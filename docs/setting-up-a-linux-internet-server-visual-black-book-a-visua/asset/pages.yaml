    # Visual Black Book


    A Visual Guide to Establishing

    Maintaining a Linux Internet Server


    Setting Up a Linux Server Visual Black Book visually describes how to use Red
    Hat Linux operating system as an Internet server to support a globally linked
    TCP/IP network. This book teaches everything from Internet basics to setting up
    different types of Servers in an easy-to-understand, functional format using clear
    technical diagrams, command-line breakdowns, and annotated screen shots. Topics
    covered in this book include registering a domain name, obtaining a dedicated
    leased line, and acquiring a router, as well as setting up a DNS server, mail
    server, Web server, Proxy server, and virtual host.


    This book will help you:


    +   * Learn all you need to know to set up an Internet server

    * Master Internet server-related concepts

    * Understand requirements for setting up an Internet Server

    * Successfully create a dedicated-access environment

    * Prepare a network structure

    * Install Red Hat Linux

    * Implement a DNS server

    * Set up a mail server

    * Establish and understand up Proxy servers

    * Discover and use virtual hosts

    * Ensure server security


