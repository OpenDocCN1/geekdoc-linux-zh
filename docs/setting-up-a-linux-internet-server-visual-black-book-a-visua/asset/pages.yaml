  md: '# 5.6 Creating Users


    # Role Of A User


    Because Linux can be used simultaneously by more than one person on a network,

    users are identified by their usernames. For example, users may be distinguished
    in the

    following ways (to distinguish users on the basis of services applies mostly to
    an

    Internet server);


    +   - Distinguishing users on the basis of services.

    (These will be mail addresses, URLs, and so on.)

    - Allocating work areas by home directories.

    (Personal Web pages are also placed in home directories.)

    - Distinguishing users on the basis of file and directory access rights.


    # Verifying New Users


    Use the id command to verify whether a user was registered correctly. Specify
    the

    username you want to verify, and execute the id command. If the specified user
    is reg-

    istered, their username and group memberships will be displayed.


    ```

    [root@server /root]: id bob

    uid=500(bob) gid=100(users)

    [root@server /root]: _

    ```


    | Username. | Affiliated group names. |


    # Deleting A User


    Use the userdel command to delete a registered user. A user''s home directory
    and its

    contents are not deleted and remain unchanged when you delete a user.


    ```

    [root@server /root]: userdel bob

    [root@server /root]: _

    ```


    # Basic Linux Rule: Do Not Log In Directly As root


    After you create a user account for yourself, do not log in directly as root again.
    If you

    log in directly as root, it will not be clear in the logs who was operating as
    root.

    Therefore, always log in as a user, and use the su command to switch to root.

    The su command is not an abbreviation for super user. It represents substitute
    user or

    switch user.


    The su command changes users. If you execute it without specifying an argument,
    it

    switches you to root.'
