  md: "# Understanding Directories\n\n# Linux Directory Structure\n\nAll Linux files\
    \ are placed in locations called directories, which correspond to Windows or Macintosh\
    \ folders. Because other directories can also be placed within a directory, the\
    \ directory structure is nested. The root portion of this nested structure is\
    \ called the \"root directory,\" and the representation of the positional relationship\
    \ between\n\nfiles and directories is called a \"path.\" Paths are required when\
    \ performing operations from the command line. Make sure that you understand how\
    \ they work.\n\n# A Linux Directory Is The Same As A Windows Folder\n\nA Linux\
    \ directory corresponds to a Windows or Macintosh folder. a directory can contain\
    \ other directories. If B is contained in directory A, A is called the \"parent\
    \ directory\" of B, and B is called \"subdirectory\" of A. In Linux, if you continue\
    \ to follow a path back along parent directories, you will end up at the root\
    \ directory. All directories and files in Linux are contained in the root directory.\n\
    \n# Linux Directory Hierarchy\n\nViewed from the root directory, directories form\
    \ a hierarchy. Names for commonly used directories are fixed. The same directory\
    \ name is often used to classify content by positioning it at a different level\
    \ in the hierarchy.\n\n+   / (root directory)\n- bin\n  - dev\n  - etc\n  - mnt\n\
    \  - sbin\n  - tmp\n  - usr\n\n| Directories placed closer to the root directory\
    \ are more important or more frequently used than those placed deeper within the\
    \ hierarchy. |\n|\n\n+   - bin\n  - lib\n  - local\n  - sbin\n\n> All but the\
    \ most basic files reside here\n\nPost-installation files are placed"
  merge: -1
