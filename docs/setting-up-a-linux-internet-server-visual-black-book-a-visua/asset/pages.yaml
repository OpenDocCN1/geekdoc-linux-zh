  md: '# STEP UP


    # Advantages Of Using NAT


    Computers or other devices within a LAN that have not been assigned global IP
    addresses on the Internet can, nevertheless, access the Internet by using NAT.
    Does this mean that the computers or devices within the LAN also can be accessed
    from the Internet?


    NAT accesses the Internet by temporarily substituting the IP address of the host
    on which NAT is running for the private IP address of each computer or device
    within the LAN that is not directly connected to the Internet. Even if the LAN
    contains multiple computers, all accesses to the Internet from them will be carried
    out by substituting the IP address of the host on which NAT is running. Because
    NAT keeps track of all accesses from within the LAN, whenever a response to an
    access is returned from anywhere on the Internet, NAT searches its memory to determine
    the private IP address of the computer within the LAN that initiated the contact
    and routes the routing data to that computer. The different private addresses
    of all of the machines on the LAN are replaced by the one global IP address of
    the NAT host. Because only the IP address of the host on which NAT is running
    is visible from the Internet, the computers or devices within the LAN cannot be
    identified from the Internet side. Therefore, access to a device within the LAN
    cannot normally occur from the Internet side.


    Enabling free access to your computer on the Internet means that your machine
    is vulnerable to hacker attacks. On the other hand, a server cannot provide services
    unless it can be accessed freely from external locations. Because a user''s PC
    is not normally used as an Internet server, however, external locations need not
    be given access to it. NAT is appropriate for such machines because it allows
    free access to outside locations, but not versa.'
