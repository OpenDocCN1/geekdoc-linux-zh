  md: '# STEP UP


    # The Router Is The Gateway


    The router is used to isolate a particular network. It stands between your private
    network and all of the other networks, and it mediates the exchange of information
    between these two realms.


    The router looks for addresses in the data flow on your private network. When
    the router finds data with an address outside your local network, it routes the
    data out to an external network. On the other hand, when the router sees data
    that has a local address, it does nothing. This is its most basic function, to
    determine whether or not data should leave your private network. Because it is
    gate standing between the local network and all other networks, it''s sometimes
    called a gateway. A large-scale network may have more than one gateway. In this
    case, information must be available so that the right router can be chosen to
    move the data out of the local network. When the information isn''t specific about
    which gateway should be used, the data is directed to the _default gateway.


    When the connection to the Internet is via a single dedicated line (as has been
    the case in our examples in this book), it''s best if a single router is used.
    It will then function as the default gateway.'
