  md: '# The Router


    # Points On Choosing A Router


    To actually use the dedicated line that you have had installed, you must have
    a router. There are many routers on the market, but we will talk about a router
    used to connect to a dedicated T1 or F1 line. In other words, we are not discussing
    units for use with an xDSL line. Although we use the specific example of a Compatible
    Systems 120Ii router, the same


    functionality is available in any of the other routers shown on the next page.


    # Role Of The Router


    A router is the gatekeeper of a network. The router determines whether any given
    data packet is allowed to pass in or out of the network for which it works. Both
    you and your ISP have a router on your respective ends of the dedicated line that
    connects both of you. All traffic into and out of your private Ethernet network
    must first check with your router for permission to come in or go out. It could
    be said that effective communication between networks is only possible through
    the good graces of routers.


    The telco will mount a network interface unit (NIU) at your end of the T1 line.
    A male-to-male network data cable connects the RJ48C jack on the NIU to the RJ48C
    jack on your CSU/DSU.


    ![](img/17f00f03278f20a01f42454f91fb48b8_55_0.png)


    ![](img/17f00f03278f20a01f42454f91fb48b8_55_1.png)


    ![](img/17f00f03278f20a01f42454f91fb48b8_55_2.png)


    ![](img/17f00f03278f20a01f42454f91fb48b8_55_3.png)


    ![](img/17f00f03278f20a01f42454f91fb48b8_55_4.png)


    CSU/DSU may be a separate unit or built into the router.


    The router performs the role of a gateway between the dedicated line and the LAN.


    Your LAN is located between the Internet server and the router.'
