  md: '# 1.2 What Is An Internet Server?


    # Types And Roles Of Internet Servers


    An Internet server provides many different functions that can use the Internet
    to exchange email, display Web pages, and so so on. Basically, a server operates
    24 hours a day to allow access to and from the Internet at any time.


    DNS server | Mail server | Web server


    ![](img/17f00f03278f20a01f42454f91fb48b8_26_0.png)


    > This book explains the procedures that you need to follow in order to operate
    an Internet server, from the installation of Linux to the settings necessary to
    maintain these types of Internet servers.


    # DNS Server


    A DNS server maintains a database of information about each machine or device
    (host) that exists within its segment of the worldwide DNS database and makes
    information available to other name servers throughout the entire Internet. The
    most important information is the address of each host within its own jurisdiction.
    The DNS server manages these addresses for the purpose of distinguishing devices
    that are being used on the Internet. A DNS server must be used when exchanging
    email and viewing Web pages.


    # Mail Server


    This server carries out the operations of email exchange. When you send email
    to a specific address, the email goes to the Mail server (located somewhere on
    the Internet) that is in charge of delivering email to the address you specified.


    # Web Server


    This server publicly sets up Web pages. When you specify a URL to view a Web page,
    your request goes to the Web server located somewhere on the Internet that is
    in charge of serving up the Web page that you specified by URL address.'
