  md: '# Appendix D How To Create A Secondary DNS Server


    # At Least Two DNS Servers Are Required


    At least two DNS servers are required to obtain a domain name. Because the DNS
    server provides the information needed to access your local domain to the Internet,
    it should always be running properly (24/7). If you prepare multiple DNS servers
    on separate computers, you need not worry if one DNS server starts strangely.
    Among the multiple DNS servers, the one that is the master is called the primary
    DNS server, and the slaves are secondary DNS servers. You can have more than one
    secondary DNS server.


    The Primary-Secondary Relationship

    For each domain, there are two or more DNS servers: one primary DNS server, and
    one or more secondary DNS servers. Because of the master-slave relationship between
    primary and secondary DNS servers, multiple DNS settings don''t need to be completely
    rewritten each time a setting is changed. Each secondary DNS server updates its
    DNS settings by automatically referencing the data of the primary DNS server.
    Therefore, after the secondary DNS server has been properly configured, you need
    only modify the configuration file of the primary DNS server. Because the configuration
    of secondary DNS servers is simple, you can set up two or more secondary DNS servers
    easily. The transfer of domain data from the primary DNS server to a secondary
    DNS server is called a zone transfer.


    ![](img/17f00f03278f20a01f42454f91fb48b8_226_0.png)


    Provides the services of one or more Unix servers'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Appendix D - How To Create A Secondary DNS Server


    # Constructing Two DNS Servers


    The DNS server that you constructed according to the procedure described in Chapter
    6 is a primary DNS server. Use the Berkeley Internet Name Domain (BIND) software
    in a similar manner to construct a secondary DNS server. A secondary DNS server
    copies domain data from the primary DNS server, you need to create a domain definition
    file that differs from that of the primary DNS server. Specify the IP address
    of the primary DNS server and the file in which the copied definition file is
    to be saved in named.conf file.


    To create a secondary DNS server, install Linux on another PC. Although you will
    install Linux according to the procedure described in this book, you must set
    a hostname and IP address for the secondary DNS server that differ from those
    of the primary DNS server. In this example, use the hostname of the secondary
    DNS server "ns2.dekiru.gr.jp" and the IP address to "210.248.12.99". Also, define
    the secondary DNS server information for the primary DNS server. Make sure that
    you replace this example information with your own DNS information.


    | Primary DNS | 210.248.12.98 |

    | Secondary DNS | ns2.dekiru.gr.jp | 210.248.12.99 |


    # Creating The Primary DNS Server


    Install Linux according to the procedure described in this book, and configure
    the primary DNS server as described in Chapter 6. However, in this configuration,
    the address of your own secondary DNS server, not the address of the secondary
    DNS server that was provided by your Internet Service Provider (ISP). Also, you
    must define and add the secondary DNS server host to both the forward lookup and
    backward lookup configuration files. Add the secondary DNS server definition as
    follows to both the forward lookup and backward configuration files. When you
    finish editing the configuration files, use the ndc command to reload BIND.


    Forward Lookup Information Configuration File (/etc/namedb/dekiru.gr.jp)


    | router | IN A | 210.248.12.97 |

    | server | IN MX 10 | server |

    | server | IN A | 210.248.12.98 |

    | | IN MX 10 | server |

    | ns2 | IN A | 210.248.12.99 |

    | | IN MX 10 | server |


    Define the secondary DNS server.


    206'
