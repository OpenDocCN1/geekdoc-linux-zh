  md: '# 3.1 Why Do You Need A Dedicated Line?


    # Ethernet Is Used To Construct a LAN


    Your permanent or dedicated line is accessed through the router. Ethernet is used
    on the LAN that ties the router and all of the users on your private network to
    the Internet server. Ethernet protocol is the most popular method used to construct
    a LAN and is available in two speeds: Base 10, which provides a transfer rate
    of 10Mbps (10,000 bits per second), and Base 100 (Fast Ethernet), which provides
    a transfer rate of 100Mbps. Cable and connectors similar to common telephone cable
    and its modular jacks are the most commonly used standard for wiring together
    both 10Base-T and 100Base-TX networks.


    A business, office, or school equipped with an Internet server


