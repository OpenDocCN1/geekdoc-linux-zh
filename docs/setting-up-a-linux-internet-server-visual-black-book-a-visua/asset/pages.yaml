    # 3.3 Your Own Domain Name


    # Domain Name Public Information Release


    After you have successfully registered your new domain, all of the information
    you supplied in your request becomes available to the public.


    # InterNIC And Internet Growth


    InterNIC was created by the National Science Foundation (NSF) to provide three
    specific services: directory and database services by AT&T, information services
    by Generic Atoms, and registration services by Network Solutions Incorporated
    (NSI). In 1995, the NSF approved NSI''s plan to charge for domain registrations.
    By the beginning of 1997, NSI was registering approximately 80,000 names per month.
    By October 1997, NSI had registered over 1.1 million domains within the .com,
    net, org, edu, and top-level domains. NSI registered its two million domain on
    May 4, 1998. In comparison, 4,000 domain registrations existed in the database
    in 1993, a total of 180,000 had been entered by November 1995. Testing of the
    Shared Registry System began on April 21, 1999.


    ![](img/17f00f03278f20a01f42454f91fb48b8_54_1.png)


    # Applying For A Domain Name


    You may apply for a domain name at the same time that you set up an account with
    your ISP or your dedicated connection provider. In effect, you are asking them
    to apply for you. You may also apply for a domain name directly. For many, the
    first method may be more convenient, but applying yourself is not difficult.


    Allowing your ISP to apply for you may be better because the name you want to
    use may have already been taken by the time your application is submitted. For
    the fastest service, if you have all of the required information on hand, you
    may apply for a domain name directly through one of the companies, called registrars,
    which handle domain name registration. The place to start is www.internic.com
    where you will find a list of registrars. Explore your Web sites and choose the
    one that most appeals to you. In our examples, we use Network Solutions.


