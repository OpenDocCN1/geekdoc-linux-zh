    # IMAP Can Be Used Instead Of POP


    The Internet message access protocol (IMAP) instead of POP can be used to read
    mail. IMAP gives the impression that a mailbox has been placed on the server.
    When POP is used, the mail is deleted from the server after it has been retrieved
    by a client. As a result, the mail can be read only from that client. If IMAP
    is used, the same mailbox can be accessed from another client or from another.


    To make your Linux mail server support IMAP, use the rpm command to install the
    IMAP server, and then uncomment the imap line of the /etc/inetd.conf file.


