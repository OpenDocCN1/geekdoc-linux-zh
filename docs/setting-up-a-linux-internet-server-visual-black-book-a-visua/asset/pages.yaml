  md: '# Uptime


    The first line of defense is to guard against electrical power outages by means
    of uninterruptible power supply (UPS) backup power unit. How long the UPS can
    keep your server and associated equipment running will depend on its own rating
    and the total power demanded by your equipment. You can extend your uptime by
    shutting down all nonessential equipment, as the server''s monitor. Most power
    outages last less than a few seconds, so a unit that will run your server for
    10 to 20 minutes is usually adequate for all but the worst cases. If you prepare
    for outages longer than 90 minutes, consider using a generator. Most UPSs do not
    work properly with off-the-shelf portable generators, so be sure to review carefully
    before you buy.


    The UPS will clean up the power to your computer, helping to extend its life,
    but power supplies, fans, and hard drives will fail sooner or later. How much
    redundancy you will depend on how concerned you are about keeping the server on
    line continuously and on your budget. Hot swappable power supplies hard drives,
    and redundant array of independent disk (RAID) systems, and completely redundant
    components can be used.


    # Bandwidth


    The bandwidth of an FT1 leased line can be scaled up or down, depending on your
    needs. If you use the same T1 line with DSU/CSU, the router will run just as well
    at the low end as it does at the high end of the bandwidth spectrum. You can start
    with 128Kbps and bump it up in steps to full T1 speed, as needed. Technically,
    changing the bandwidth of the line (resetting the DSU/CSU units on both ends of
    the line to the new speed), is simple, but the change in the billing and in your
    agreement with your ISP or telco might be more difficult. When you make your initial
    agreement, ask your leased line provider for an estimate of the time that would
    be required to change your bandwidth.


    # Domain Name


    You need to find an appealing but unassigned domain name. To apply for it, you
    must determine your administrative contact, technical contact, billing address,
    and addresses of your primary and secondary DNS name servers. If you are planning
    to set up your own DNS name server, you need to have someone else—probably your
    ISP—perform this service until you are ready to take over. It''s also possible
    to reserve a domain name without knowing beforehand what name servers you will
    use. There may be an extra charge for this.'
