    TIP!


    Reverse Lookup Fails, Part 2

    When a new address is added to the reverse lookup configuration, you may not be
    able to find the reverse lookup data immediately. In some cases, changes are not
    propagated externally until a considerable amount of time has passed since the
    last update. Check again after a few days.


    # Increase The Serial Number When You Change A Configuration File


    When you change the forward or reverse lookup configuration file, be sure to increase
    the serial number of the modified file and reload the file by running ndc reload.
    If you do not increase this number, the DNS server will not be informed that the
    file was updated. This may lengthen the time that transpires before your changes
    are reflected.'
