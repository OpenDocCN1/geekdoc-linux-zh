  md: '# Creating An Installation Disk


    # Creating A Boot Disk


    Because Red Hat''s installation program is used for installing Linux, first create
    a floppy disk for installation (boot disk), and then start the PC from that floppy
    disk.


    Use the Windows special-purpose tool named rawwrite.exe to write boot.img to the
    floppy disk.


    The file named boot.img located in the images folder of the included CD-ROM is
    required to create an installation disk.


    +   1. Insert the included CD-ROM.


    +   2. Specify the image file.


    +   1. Create a boot disk on a Windows PC.


    +   Insert the CD-ROM.


    +   Specify the boot disk image file.


    +   Caution: Be sure to enter the file name correctly.


    ![](img/17f00f03278f20a01f42454f91fb48b8_75_0.png)


    Type "images.boot.img"


    ![](img/17f00f03278f20a01f42454f91fb48b8_75_1.png)


    +   2. Start up the disk creation tool.


    +   1. Open items in the following order.


    +   My Computer


    +   CD-ROM drive


    +   dosutils


    ![](img/17f00f03278f20a01f42454f91fb48b8_75_2.png)


    +   3. Insert a floppy disk.


    +   Insert a floppy disk that was formatted under Windows.


    ![](img/17f00f03278f20a01f42454f91fb48b8_75_3.png)


    +   Double-click rawwrite.'
