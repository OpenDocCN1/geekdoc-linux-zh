  md: 'Before deciding to download the distribution from the Internet, it is worth
    considering that depending on the speed of your Internet connection, you may require
    12 or more hours of actual downloading time. If you are subject to long-distance,
    time, and/or download charges or limits, you may find it substantially cheaper
    to purchase the CD-ROM. Another point to consider is that if you make a mistake
    during the installation, you may have to start again... from scratch. This do
    two or three times, and you''ll be wishing you had purchased the CD-ROM.


    Some of the different Linux distributions are discussed briefly in Appendix. The
    Red Hat Linux distribution has become popular because of its ease of use and the
    availability of high-quality commercial support (included when you purchase the
    CD-ROM package). Because of this and its high availability, this is the distribution
    we have chosen to use in this book.


    # About The Included CD-ROM


    The CD-ROM that is included with this book contains Red Hat Linux 6.0 from Red
    Hat Software. There are no restrictions on its use, so you may use it freely at
    will. The CD-ROM also contains several free software programs related to Linux
