  md: '# 10.1 Protecting Your Internet Server From Unauthorized Access


    # Domain Name Service (DNS)


    The information that is exchanged is not encrypted. However, this is safe no usernames
    or passwords are exchanged.


    # Upgrading the Software Version


    You cannot rectify a security hole due to a problem with the software itself merely
    paying attention to the configuration settings. To eliminate this kind of security
    hole, you must make it a top priority to check software information everyday.
    A security hole in the software itself is rarely discovered at the time of an
    attack on your system. Most attacks occur after the security hole has been announced
    and before the administrator of each site is able to take measures to correct
    it. You can prevent these attacks by upgrading your software quickly to the latest
    version that includes a fix for the announced security holes.


