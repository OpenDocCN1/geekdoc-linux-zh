  md: '# Chapter 10. Operating Secure Internet Server


    # Restoring Configuration Files


    To restore configuration files that have been saved, expand the configuration
    files and then copy them. If a problem occurs and you have to build the server
    again, using the configuration files that had been backed up enables you to build
    the server with the same configuration that you used previously.


    +   1. Unpack the files.


    > Note: Perform this step after you have built the Internet server according to
    the procedure described in this book.


    +   - Change directory.

    - Enter the command. Specify the backup file.


    ```

    [root@server /root]# cd /tmp

    [root@server /tmp]# tar xvpzf backup-etc.tar.gz

    etc/passwd

    etc/group

    ```


    ```

    usr/local/etc/apache/http.conf

    [root@server /root]#

    ```


    The backed up files are unpacked into the /tmp folder.


    +   2. Copy the files.


    Copy all of the unpacked files to their original locations


    Enter the command.


    ```

    usr/local/etc/apache/http.conf

    [root@server /tmp]# cp etc/passwd /etc/passwd

    [root@server /tmp]# cp etc/group /etc/group

    ```


    Enter the command.


    ```

    [root@server /tmp]# cp etc/rc.init.d/httpd /etc/rc.init.d/httpd

    [root@server /tmp]# cp etc/rc.init.d/ipmasq /etc/rc.init.d/ipmasq

    [root@server /root]#

    ```


    # Backing Up Data Files


    The home directory data and the Web data of users is placed in the /home/usr/local/www
    directory, respectively. Saving all of the data in these directories create data
    backups.'
