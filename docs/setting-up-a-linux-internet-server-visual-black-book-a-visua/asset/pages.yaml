  md: '# Appendix G Linux Distributions


    all of the distributions try to make installation easy. Whether they succeed largely
    depends on what hardware distribution finds or doesn''t find on your PC. Check
    the hardware compatibility lists before installing to make sure your video card,
    network interface card (NIC), sound, and so on are compatible with the distribution
    you intend to install. (These lists are usually found either in the documentation
    or on the software''s Web site.) When there are no conflicts, the easiest distribution
    to install is probably Core Linux. Calder and Mandrake


    follow closely for ease of use. Thereafter, the line-up will be Turbo, Red Hat,
    SuSe, Slackware, and Debian, experienced users or those who desire a high degree
    of customization should try the previous order in reverse. Each distribution offers
    its own special features. For example, Caldera''s customization of XDM is useful.
    Core''s addition of a network neighborhood extension to the file manager is convenient.
    Mandrake''s capability to switch to an expert mode where you can pick your packages
    is great, and so on. You will want to examine each distribution.


    # Home Pages Of Major Linux Distributions


    +   1. Caldera:


    www://www.caldera.com


