  md: '# Mastering Basic Commands


    cd, ls, cp, mv, rm, And mkdir

    Nothing is more basic to Linux than performing operations on files. This section
    describes commands that are required for manipulating files. cp, mv, rm, and mkdir
    are commands for manipulating files or directories; cd and ls are commands that
    are needed to use commands:


    | cd | Changes current directory |

    | ls | Lists directory contents |

    | cp | Copies files or directories |

    | rm | Removes (deletes) files or directories |

    | mv | Moves (renames) files |

    | mkdir | Creates a directory |


    # Remember These Essential Linux Commands


    # cd Changes Current Directory


    The cd (change directory) command changes the current directory to a specified
    directory.


    ```

    [root@server /root]# cd /etc

    [root@server /etc]# -

    ```


    > The specified directory becomes the current directory.


    > Enter the destination name after the command.


    # cd Command Options


    +   - cd foo Changes to the directory too

    - cd Changes to the previous current directory

    - cd Changes to the home directory


    # ls Lists Directory Contents


    The ls (list directory) command lists the contents of a directory. When a specific
    directory is given, it lists the contents of that directory. When no directory
    is given, it lists the contents of the current directory.


    > Enter a directory name after the command.


    > A list of the contents of the specified directory appears.


    ```

    [root@server /root]# ls /usr

    X11R6 doc i1386-redhat-linux

    bin etc i486-linux-libc5

    dict games include

    [root@server /root]#

    ```


    | info local sbin tmp |

    | lib lost-found share |

    | libexec man src |


    5.4'
