  md: '# Chapter 10. Operating A Secure Internet Server


    # Restricting Access By Using tcpd


    Restricting the computers or networks that can access each server is an effective
    security measure. Servers that use inetd (such as qpopper, ftpd, and telnetd)
    are configured by the inetd.conf file, so that software for restricting access,
    called tcpd (tcp-wrappers), is made to invent. Therefore, tcpd functions should
    be used to restrict access. The tcpd software has two configuration files named
    /etc/hosts.allow and /etc/hosts.deny. For security, let''s try to configure these
    files so that all accesses are denied by default and accesses from the local area
    network (LAN) are specifically permitted.


    ```

    # Enter the command.

    [root@server ~]# vi /etc/hosts.deny

    ```


    ```

    # you should know that NFS uses portmap!

    ```


    +   ALL: ALL


    ```

    # Type "ALL: ALL".

    ```


    ```

    # Enter the command.

    [root@server ~]# vi /etc/hosts.allow

    ```


    +   # by the ''/usr/sbin/tcpd'' server.

    # Enter the specifications as shown.

    ALL: LOCAL

    ALL: 192.168.1.0/255.255.255.0 210.248.12.96/255.255.255.248


    On the left side of the colon (:) is a word that is at the end of a line in the
    inetd.conf file. For example, the setting for a post office protocol (POP) server
    would be "popper" and the setting for telnet would be "in.telnetd". The command
    name of the server program is "popper" or "in.telnetd". Use the entry /usr/sbin/tcpd
    on each line of the /inetd.conf file.


    +   # These are standard services.

    ftpd stream tcp root /usr/sbin/tcpd in.ftpd -1 -a

    telnet stream tcp now root /usr/sbin/tcpd in.telnetd


    If "ALL" is specified here, the setting is for all servers. On the right side
    of the colon (:), you can write a hostname or IP address, a notation representing
    a network, or like:


    # Entries That Can Be Written Before The Colon


    +   Server name (word at the end of each line of inetd.conf)

    "ALL" This allows all servers.

    "EXCEPT" Entries following this keyword are excluded.'
