  md: '# Preparing The PC For Linux Installation


    # Installing The Network Interface Card


    Because Ethernet is used for the connection to the router, install a NIC in the
    PC to be used for the Linux installation. To use a network address translation
    (NAT), install only one of the two NICs. Install a PCI-type NIC in the PC before
    installing Linux.


    ![](img/17f00f03278f20a01f42454f91fb48b8_74_0.png)


    > Caution: Make sure that you know the difference between PCI, ISA, and other
    slots before you begin the card installation process.


    # Connecting The Router To The Internet Server Machine


    Use a straight-through cable to connect the server machine to the Ethernet port
    of the router. Be careful not to connect the cable to the Up-Link port, and be
    sure not to use a crossover cable.


    ![](img/17f00f03278f20a01f42454f91fb48b8_74_1.png)


    > Insert the cable into the server machine until you hear a click.


    # No Mouse Is Required


    Because the explanations in this book do not use a mouse, you do not need to configure
    the server machine for use with a mouse. Unplug the mouse before installing Linux.'
  merge: -1
