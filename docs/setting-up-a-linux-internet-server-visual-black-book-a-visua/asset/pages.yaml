    # /etc/aliases Links A Set Of Mail Addresses To One Another


    /etc/aliases file links together the mail account on the left side of the colon
    (:) and the list of mail addresses and other entries on the right side of the
    colon. Depending on the contents on the right side of the colon, you can configure
    the /etc/aliases file so that mail is transferred, or you can create a simple
    mailing list.


    # Transferring Mail Address To Root Users Who Perform Administrative Duties


    Because information related to system errors and mail sent from users or external
    administrators may be delivered to the root-addressed mailbox, the administrator
    should always read root-addressed mail to root.


    By using the /etc/aliases file to transfer root-addressed mail to your own mailbox,
    you can always read root-addressed mail using your regular account and regular
    mail count.


