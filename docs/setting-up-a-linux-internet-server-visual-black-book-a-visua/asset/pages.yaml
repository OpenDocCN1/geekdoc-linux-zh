  md: "# Appendix 1 Command Reference\n\n* Brackets [] around a command argument in\
    \ the syntax sections indicate that the argument is optional and can be omitted.\n\
    \n# cd\n\nChanges the current directory.\n\n+   * Syntax\n  cd [directory name]\n\
    * Commonly used option\n  - (hyphen) Change to previous directory.\n* Related\
    \ commands: ls, pwd\n* Examples\n  cd /etc Change to /etc.\n  cd To home directory.\n\
    \n# date\n\nDisplays and sets the current time and date.\n\n+   * Syntax\n  date\
    \ [string representing date]\n* Related command: rdate\n* Note\n  Only root can\
    \ set the date. If no argument is specified, the current time and date displays.\
    \ If an argument is specified, the current time and date is set.\n\n# chgrp\n\n\
    Changes the group owner of a file.\n\n+   * Syntax\n  chgrp group name directory\
    \ name\n* Commonly used option\n  -R Changes all files and directories in the\
    \ specified directory.\n* Related commands: chown, chmod\n\n# df\n\nDisplays the\
    \ disk capacity used by you.\n\n+   * Syntax\n  df [directory name]\n* Commonly\
    \ used option\n  -k Displays amounts in kilobytes.\n  -h Displays in an easy-to-understand\
    \ format.\n* Related commands: du, mount, umount\n  fdisk\n\n# chmod\n\nChanges\
    \ file permissions.\n\n+   * Syntax\n  chmod permission filedirectory name ...\n\
    * Commonly used option\n  -R Recursively changes all files and directories in\
    \ the specified directory.\n* Related commands: chown, chgrp, is\n\n+   * Note\n\
    Executing the df command without specifying a directory displays the disk capacity\
    \ used by all mounted systems.\n\n# diff\n\nDisplays differences in files.\n\n\
    +   * Syntax\n  diff file1 file2\n* Commonly used option\n  -c Displays the results\
    \ in a context output format.\n  -d Displays the results in a unified output format.\n\
    \  -b Makes the set of changes as minimal as possible. Ignores differences in\
    \ the number of blank spaces.\n  -B Ignores differences in the number of blank\
    \ lines\n  -r If a directory is specified with this option, all files in that\
    \ directory are compared.\n\n# chown\n\nChanges the owner of a file.\n\n+   *\
    \ Syntax\n  chown username group! filedirectory name ...\n* Commonly used option\n\
    \  -R Recursively changes all files and directories in the specified directory.\n\
    * Related commands: chgrp, chmod, is\n\n# cp\n\nCopies files.\n\n+   * Commonly\
    \ used option\n  -a Maintains original file permissions as much as possible.\n\
    \  -i Asks for confirmation to copy each file.\n  -f If the file already exists\
    \ at the destination, the copied file overwrites the existing file.\n* Related\
    \ commands: mv, rm, is\n\n# dmsg\n\nDisplays the kernel log.\n\n+   * Syntax\n\
    \  dmsg\n\n+   * Note\nThe results of diff can be used as a batch file.\n\n223"
