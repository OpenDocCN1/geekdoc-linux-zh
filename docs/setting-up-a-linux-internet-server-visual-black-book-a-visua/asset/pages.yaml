  md: '# # What''s On The CD-ROM


    The Setting Up A Linux Internet Server Visual Black Book''s companion CD-ROM contains
    elements specifically selected to enhance the usefulness of this book, including:


    +   - Red Hat Linux 6.0—A special package of the Linux installation and core files
    needed to run and manage the Internet servers described in this book.

    - Apache—A robust


    # System Requirements


    Software


    +   - Your original operating system must be Windows 95, 98, or NT4 before you
    can install Red Hat 6.


    Hardware


    +   - An Intel (or equivalent) 80486 processor is the absolute minimum platform
    required; an Intel or equivalent Pentium 120MHz (or faster) microprocessor is
    recommended.

    - 16MB of RAM is the minimum requirement. 64MB or more of RAM is recommended.

    - The basic Red Hat Linux 6.0 installation requires (at an absolute minimum) approximately
    500MB of disk storage space. Hard disk space of 2GB or more is strongly recommended.'
