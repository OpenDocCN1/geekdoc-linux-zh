  md: '# Understanding Permissions


    Permissions


    Besides the owner and affiliated group that are set for all files and directories
    in Linux, permiss-ions are also assigned. Permissions indicate whether a particular
    user in Linux can access a file. This information is listed with the -l option
    of the ls command.


    You can manage files and directories precisely in Linux through the use of permissions.


    # Permissions Represent File Or Directory Access Rights


    An owner, an affiliated group, and permissions settings are assigned to every
    file and directory. Permissions determine whether or not a user will be given
    access to a partic-ular file or directory. When the -l option is appended to the
    ls command, the nine-character sequence consisting of the characters r, w, x,
    and - which appears on the left side, is the permission information. This is the
    mode of the file or directory. This sequence consists of three sets of rwx arranged
    from left to right. An r, w, or x indi-cates the corresponding type of access
    is permitted. A hyphen (-) indicates that the corresponding type of access is
    not permitted. The three sets from left to right indicate the access rights of
    the owner, the affiliated group, and others on.


    ```

    drwx-xr-x 12 root      1024 Jul 12 1999 local

    ```


    ```

    drwx-xr-x 12 root      root

    ```


    | Directory | Access rights | Access rights of group | Access rights of others.
    | Owner. | Group. |

    |---|---|---|---|---||

    | | r | Read permission | File and directory contents can be viewed only. | |
    |

    | | W | Write permission | | File and directory contents can be changed. | | |

    | | X | Execute permission | | File and directories can be accessed (executed).
    | | |'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# rwxr-xr-x For A Directory (Owner root, Group root)


    # # rwxr-xr-x 12 root root


    The initial d means that this is a directory.


    +   - If the user is root, the user can list (r) the files and directories, change
    (w) those files and directories, and access or execute (x) those files and directories.

    - If the user belongs to the root group, the user can list (r) the files and directories,
    and access or execute (x) those files and directories.

    - If the user is not root and does not belong to the root directory, the user
    can list (r) the files and directories, and access or execute (x) those files
    and directories.


    # rwxr-xr-x For A File (Owner root, Group root)


    # # rwxr-xr-x 1 root root


    The initial hyphen means that this is a regular file.


    +   - If the user is root, the user can read the contents of the file, write to
    the file, and execute the file.

    - If the user belongs to the root group, the user can read the contents of the
    file and execute the file.

    - If the user is not root and does not belong to the root directory, the user
    can read the contents of the file and execute the file.


    # How To Set Permissions


    Each rwx character string is represented by a single digit, and the entire set
    of nine permissions is expressed using three digits. The value taken by the sum
    of the numbers corresponding to the access rights that are permitted (r=4, w=2,
    and x=1). For example, rwx is represented by the number 7.


    | r w x | | |

    |---|---|---|

    | r w x | 4+2+1 | 7 |

    | r - x | 4+0+1 | 5 |

    | r w - | 4+2+0 | 6 |

    | r - - | 4+0+0 | 4 |


    Because rwx takes the value 7 and r-x takes the value 5, the permissions rwxr-xr-x
    are expressed by the number 755.


    | r w x | r - x | r - - |

    |---|---|---|

    | 4+2+1 | 4+0+1 | 4+0+1 |

    | 7 | 5 | 5 |


    This number is used when changing or setting the permissions of a file or directory.'
