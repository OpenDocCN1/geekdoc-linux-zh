  md: '# How A DNS Server Works


    DNS


    When using the Internet, there are very few times when you use an IP address directly.
    A mechanism called a domain name service (DNS) converts the hostname format, which
    humans find easier to work with, to the IP address format.


    Because the DNS associates Internet hostnames and IP addresses, you may think
    that the DNS mechanism is extremely complicated and difficult. If you have a basic
    understanding of domains, however, it is not so difficult. This section describes
    the basic parts of the DNS mechanism.


    # The DNS Is A Service That Associates Hostnames And IP Addresses


    The DNS is a service that maps hostnames to IP addresses and vice versa. It can
    find an IP address from a hostname (forward lookup) or a hostname from an IP address
    (reverse lookup). Mapping a hostname to an IP address is called *name resolution*.


    | Hostname | Forward lookup (name resolution) | IP address |

    | --- | --- | --- |

    | server.dekiru.gr.jp | | 210.248.12.98 |


    A DNS server has tables that are used to associate hostnames and IP addresses.
    Because the Internet is expanding rapidly, however, managing the mapping tables
    for all hostnames and IP addresses in one place would be extremely difficult.
    Moreover, because the correspondences between hostnames and IP addresses are frequently
    updated throughout the world, managing all the updates in a single place would
    be impossible. Instead, the DNS server of each domain restricts itself to maintaining
    the mapping tables for the hostnames and IP addresses of the domain that it manages.
    Name resolution for all other hostnames is achieved through the mutual exchange
    of information with the DNS servers of other domains throughout the Internet.


    Reverse lookup'
  merge: -1
