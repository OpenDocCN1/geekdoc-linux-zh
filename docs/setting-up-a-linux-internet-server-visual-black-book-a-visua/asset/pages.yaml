  md: '# Chapter 10. Operating A Secure Internet Server


    # If the ping Results Are Odd


    If the ping results you think Linux is acting strangely, return to Chapter 9 and
    check the following files:


    ```

    /etc/conf.modules

    /etc/sysconfig/network

    /etc/sysconfig/network-scripts/ifcfg-eth0

    /etc/sysconfig/network-scripts/ifcfg-eth1

    ```


    Reinitialize any changes you have made.


    ```

    [root@server /root]# /etc/rc.d/init.network restart [ OK ]

    Shutting down interface eth0 [ OK ]

    Shutting down interface eth1 [ OK ]

    Disabling IPv4 packet forwarding [ OK ]

    Enabling IPv4 packet forwarding [ OK ]

    Bringing up interface lo [ OK ]

    Bringing up interface eth0 [ OK ]

    Bringing up interface eth1 [ OK ]

    [root@server /root]# -

    ```


    If a ping doesn''t pass from the LAN side to the Internet side, the network address
    translator (NAT) configuration may be incorrect. Reconfigure NAT.


    ```

    [root@server /root]# /etc/rc.d/init.ipmasq restart ]

    ```


    # Restarting Daemons


    If a service isn''t acting properly even though the network connection checks
    out, try restarting each service. If you changed the configuration, the changes
    may not go into effect until the service is restarted.


    | Service | Restart Method |

    | BIND | ndc restart |

    | Apache | /etc/rc.d/init.d/httpd restart |

    | Sendmail | /etc/rc.d/init.d/sendmail restart |

    | qpopper | /etc/rc.d/init.d/inet restart |

    | FTP | /etc/rc.d/init.d/inet restart |

    | dhcpd | /etc/rc.d/init.d/dhcpd restart |

    | Squid | /etc/rc.d/init.d/squid restart |

    | NAT | /etc/rc.d/init.d/ipmasq restart |


    194'
