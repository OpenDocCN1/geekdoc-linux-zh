    # TIP!


    Using Pre-Compiled Image Files


    ![](img/17f00f03278f20a01f42454f91fb48b8_76_2.png)


    The included CD-ROM provides three other image files in addition to the boot disk
    image file.


    +   - Network Installation (boot.img)


    This file enables you to install Linux over a network, (either the Internet or
    a company''s internal LAN.) by using the File Transfer Protocol (FTP) or Hypertext
    Transfer Protocol (HTTP) and specifying a Red Hat mirror site.


    +   - PCMCIA (pcmcia.img)


    Use this image to install Linux in a PC equipped with a Personal Memory Card International
    Association (PCMCIA) interface.


    +   - Rescue Disk (rescue.img)


    Use emergency image for recovery if your Linux system has been fatally damaged.
    You''ll be asked for this disk shortly after you type "rescue Enter" at the first
    boot prompt. If the rescue is used to boot the computer, a version of Linux containing
    the minimum management commands will start; however, only individuals with a fair
    degree Linux knowledge will actually be able to use this minimum operating environment
    effectively.


    Creation will take a few minutes.


    # TIP! Booting Directly From The CD-ROM


    The CD-ROM included with these books enables you to boot Linux from the CD-ROM.
    If your PC supports a CD-ROM boot, you can install Linux from the CD-ROM without
    creating a boot disk. You need to SET the basic input/output system (BIOS) or
    the SCSI BIOS to have an SCSI CD-ROM to enable support for CD-ROM boot. If you
    can''t determine your current setting, create a boot disk to install Linux.


