  md: "# Managing Mail So That It Can Be Used Without Worry\n\n# Mail\n\nWhen an Internet\
    \ server is used, various problems can arise. The server has a feature that sends\
    \ mail to a special account (root or postmaster) automatically to report an incident\
    \ if a problem occurs.\nAlso, the root or postmaster account is used as a service\
    \ center for complaints or requests from external administrators or users.\n\n\
    Therefore, configure the mail server so that mail addressed to its special account\
    \ will be transferred to the regular account of the administrator so that problems\
    \ can be dealt with as soon as they occur.\n\n# Mail Not Reaching Its Destination\n\
    \nIf you use the sendmail.cf settings to over-restrict a network that is using\
    \ a mail server, mail may not be delivered to its external destination. In this\
    \ case, an error message is displayed in the user's mail client. Return to Chapter\
    \ 7 and recheck the configuration settings.\n a different case, when Sendmail\
    \ cannot deliver the mail to its intended destination, Sendmail sends an error\
    \ message to the sender with some explanation of the delivery failure. Error messages\
    \ that occur relatively often are \"User Unknown\" or \"Host Unknown.\" These\
    \ indicate that an invalid destination address was used in the mail that was sent.\n\
    The error message that is mailed to the sender includes the full text of the mail\
    \ that was sent. An error message that omits the text of the original mail is\
    \ also mailed to the postmaster mail account at the same time. Therefore, if the\
    \ administrator sets up the mail server so that postmaster-addressed mail is,\
    \ by default, to the address that the administrator ordinarily uses, the administrator\
    \ can keep track of mail server-erros.\n\n# Not Receiving Mail From Someone Outside\
    \ Your LAN\n\nThere are several reasons why mail cannot be received from someone\
    \ outside your LAN.\n\n# The Spool Is Full\n\nMail is temporarily stored in a\
    \ spool file at /var/spool/mail. If the df command tells you the /var filesystem\
    \ is full, use the du command to find unnecessary files in /var and delete them.\
    \ (See Section 10.2.)\n\n190"
  merge: -1
  pgno: 211
- img_proc: true
  md: '# 10.3 Managing Mail So That It Can Be Used Without Worry


    Also, if a large volume of mail is accumulated in the spool file causing the mail
    to become extremely large, delete any totally unused user accounts. If a user
    wants to retain only the address of an unused mail account, you can transfer the
    mail to his normal account by using /etc/aliases.


    # A Remote Site Cannot Specify The SMTP Server Of Your Local Domain


    If the MX record of the DNS server is invalid, a remote server cannot identify
    your local mail server, and the mail cannot be sent. Use the nslookup command
    (see Chapter 6) to verify the MX record.


    # Sendmail Configuration Is Invalid


    This condition results in the inability to receive mail. Return to Chapter 7 and
    check the sendmail.cf configuration settings to see if Sendmail has been configured
    to receive mail addressed to your own domain.


    # Mail Addressed To Special Accounts


    Mail that is addressed to the special accounts named postmaster, Webmaster, root,
    and MAILER-DAEMON may contain important information. This mail should be transferred
    to the administrator''s actual account by using /etc/aliases so the administrator
    will read it. See Chapter 7 for information about /etc/aliases.


    # Mail From Other Administrators Or Users


    If you are managing a server, you will be sent mail addressed to postmaster or
    Webmaster from other administrators or users. This mail may contain complaints
    or ongoing discussions. Dealing with this kind of mail is an important role of
    an administrator. Try to respond to everything other than SPAM or other questionable
    mail.'
  merge: -1
