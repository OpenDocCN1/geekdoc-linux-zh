  md: "# Appendix D - How To Create A Secondary DNS Server\n\n# 3 Open the configuration\
    \ file.\n\nChange directory.\n\n```\n[root@server /etc]# cd namedb\n[root@server\
    \ namedb]# vi named.conf\n```\n\nEnter the command.\n\n# 4 Edit the configuration\
    \ file.\n\nEnter your registered domain name.\n\n```\n// secondary\nzone \"dekiru.gr.jp\"\
    \ {\n  type slave;\n  file \"dekiru.gr.jp.rev\";\n  masters {\n    210.248.12.98;\n\
    \  };\n}\n```\n\nEnter the domain name.\n\n```\nzone \"96.12.248.210.in-addr.arpa\"\
    \ {\n  type slave;\n  file \"dekiru.gr.jp.rev\";\n  masters {\n    210.248.12.98;\n\
    \  };\n}\n```\n\nEnter the IP address of the primary DNS server.\n\nEnter the\
    \ network address with the numbers in reverse order.\n\nEnter the name consisting\
    \ of \"rev\" appended to the domain name.\n\nEnter the IP address of the primary\
    \ DNS server.\n\nSave the modified file and quit.\n\n# 5 Reload BIND.\n\nYouve\
    \ completed the reconfiguration\nReload BIND.\n\nEnter the command.\n\n```\n[root@server\
    \ namedb]# ndc reload\n[root@server namedb]# -\n```"
