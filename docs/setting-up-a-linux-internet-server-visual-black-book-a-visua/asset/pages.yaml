  md: '# How The Internet Is Connected


    # Routing


    The Internet ties together millions of different networks, large and small; but
    how are these networks connected? If each different network throughout the world
    used a "one-to-many" form of network connection, the total number of connections
    would be nearly infinite, and the Internet itself would be an impossibility.


    In reality, although each separate network isn''t directly connected to every
    other network, a network can connect to any other network by sending its packets
    of data through indirect, interconnected routes. Consequently, it becomes possible
    to access any location desired by connecting to the Internet at any particular
    point.


    # Individual Networks Are Connected By Routers


    The Internet is a connection of many different networks, but this doesn''t mean
    that each network is connected to every other network, directly, one-to-one. The
    beauty of the Internet is that it''s possible for two networks that are not directly
    connected to connect to each other via other networks. For example, access from
    ISP A to University E is possible via other networks, even though ISP A and University
    E are not connected directly. Access to a network anywhere in the world is possible
    by using multiple networks.


    # Route To Access: The University E Server


    The routes to various networks throughout the Internet are set.


    If a route has been set in the router, the packet finds its way directly to the
    destination address


    ![](img/17f00f03278f20a01f42454f91fb48b8_35_0.png)'
