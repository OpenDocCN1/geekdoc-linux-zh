  md: '# Using Commands


    # Commands


    The command-line interface is basic to all Linux operations. A command is entered;
    the system responds. At the command prompt, you type in a specific character string
    that runs a script or program. You can change the way a command operates or specify
    the target of a command through the use of arguments, separated by spaces, immediately
    following the command.


    # Commands And Their Arguments


    You perform all Linux operations by entering commands. A command is a character
    string that represents an operation. At the command prompt, and the command is
    accepted. After processing the accepted command, press "enter", and the response
    appears on screen, and Linux prompts for the next command.

    Commands may be followed by one or more arguments, separated by spaces, that can
    be used to specify the target of the command or to control the way in which a
    command operates. To specify an argument that includes a space, enclose the argument
    in single quotes ('''').


    > Enter one or more spaces the command and its arguments.


    ```

    [root@server /root]# command argument argument

    ```


    > If the argument contains a space, enclose the argument in single quotes ('''').


    # How To Use Options


    An option is a type of command argument. You specify an option when you want to
    execute a variation of the standard function of the command. The syntax of the
    option may differ somewhat, depending on the command, but most options begin with
    a hyphen (-).'
