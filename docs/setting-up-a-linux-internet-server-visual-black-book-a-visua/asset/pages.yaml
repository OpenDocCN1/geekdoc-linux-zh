  md: '# Appendix H Dedicated Internet Connectivity Options


    Although you can do most of the work required to get your Internet server/services
    up and running, the easiest way to go about getting them permanently connected
    to the Internet is to directly contact your local connection provider. Depending
    on the size of your budget, bandwidth, and needs, purchasing a small business
    or small office home (SOHO) access package from your local provider may be the
    best solution. If your connection and your ISP are not the same company, you need
    to coordinate the installation of your connection with your ISP who will provide
    settings for your system.


    ISDN connection supports up to 128 Kbps (and the Base Rate Interface provides
    this speed). When no one is accessing the Internet, the router disconnects the
    ISDN call. For locations with medium usage, your users can enjoy the convenience
    and speed of a dedicated access service at a fraction of the price.


    Whether you use a telephone company (Telco), cable, or satellite connection,each
    has a plethora of services and information on their Web site, from which you can
    begin to evaluate your options. A short list of examples of representative SOHO
    products and services from a few of regional bill providers (your area will have
    different selections):


    DSL:

    Digital Subscriber Line access is a new technology that runs over standard phone
    lines. DSL allows you to download files and graph-intensive Web pages at speed
    up to 10 times faster than ISDN and up to 50 times faster than 28.8kbps methods.
    The further you are from the network switching “node”(the small, inconspicuous
    cabinets stuffed with electronic components, usually found in neighborhoods on
    telephone poles or the ground), the more questionable the service and quality
    of service becomes. The more active people on the node the slower connection becomes.
    DSL is not yet available in rural areas and in some small cities. Check with your
    local Telco.


    # Telco Companies

    Pacific Bell:


    www.pacbell.com


    ![](img/17f00f03278f20a01f42454f91fb48b8_240_0.png)


    # Frame Relay:


    Frame Relay is one of the most cost-effective ways to get dedicated access to
    the Internet today speed up to 1.54Mbps, depending on your location. Frame Relay
    is a digital service that handles “bursty”, high-speed data traffic, making it
    ideal for Internet access. It’s usually less expensive than a leased full-capacity
    DS1 or T1 line.


    # LAN ISDN:


    # Burstable DS1:


    This 1.54 Mbps digital service is well-suited for large organizations requiring
    high capacity Internet connections. Depending upon your organization’s location,
    you may also want to consider a 1.536 Mbps Frame Relay service, which—unlike DS1—does
    not include a mileage charge. For further information, see the Web site.


    With LAN ISDN, your router automatically places an ISDN call to the PacBell network—ever
    over your LAN needs access to the Internet and a connection is not always up.


    219'
