  md: '# # How To Connect Client PCs To The Internet


    Network Address Translator (NAT)


    Network address translator (NAT) is a means of converting IP addresses. Using
    NAT to convert between private and global IP addresses enables clients within
    a LAN to access the Internet easily.

    Although Linux has NAT installed by default, two network cards are required to
    configure


    NAT in Linux, because a single Linux machine must be connected to networks on
    both the LAN side and the Internet side.


    # How NAT Works


    A global IP address is required to identify a particular host on the Internet.
    To access a server located on the Internet and receive a reply, a client must
    also have a global IP address.

    When NAT is used, each time the Internet is accessed from the LAN, the originating
    IP address is converted to an Internet-side IP address. From the viewpoint of
    the accessed server, it appears as if it were being accessed from an Internet-side
    IP address, regardless of which client in the LAN initiated the access. That is,
    by running NAT, a single PC can impersonate any of the PCs on the LAN.


    | 192.168.1.10 | 210.248.12.98 |


    ![](img/17f00f03278f20a01f42454f91fb48b8_175_0.png)'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# 9.2 How To Connect Client PCs To The Internet


    # Two Network Cards Are Required


    To use NAT, two network cards are required. Connect one to the Internet side (router
    side), and connect the other to the LAN side (hub attached to the LAN). Assign
    a private IP address to the LAN-side network card, and assign a global IP address
    that is valid on the Internet-side network card.


    ![](img/17f00f03278f20a01f42454f91fb48b8_176_0.png)


    # IP Addresses Are Assigned To Each Network Card


    An IP address that identifies a particular device on the Internet is actually
    assigned to the network card, not the PC. NAT requires two network cards because
    completely different IP addresses are associated with a single Linux PC.


    # NAT And IP Masquerading


    NAT is often called IP Masquerading in Linux documents. IP Masquerading is the
    name of the software that implements the NAT feature on Linux. Its functions have
    been extended slightly beyond the strict meaning of NAT. This book uses the IP
    Masquerading that is installed on Linux by default.'
