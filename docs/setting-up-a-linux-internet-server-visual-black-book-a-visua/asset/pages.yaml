  md: "# Editing Text Configuration Files\n\nThe vi Text Editor\n\nTo configure an\
    \ Internet server, this book uses vi, a standard editor provided with Linux, to\
    \ edit the configuration files.\nThe vi text editor has a command mode and an\
    \ input mode. In the input mode, you enter characters; in the command mode, you\
    \ enter commands. At first, the vi text editor may seem hard to use after repeated\
    \ use, you will\n\nbecome familiar with its operations. The section explains the\
    \ vi text editor basics and lists especially useful editing commands. You can\
    \ also use one of two special versions of vi to edit password files (viwp), and\
