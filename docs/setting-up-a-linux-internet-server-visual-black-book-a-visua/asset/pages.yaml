  md: '# # How Mail Works


    # ## Sendmail And qpopper


    A mail server is not a single program. It is implemented by two programs: an simple
    mail transfer protocol (SMTP) server and a post office protocol (POP) server.
    Each is responsible for the job.

    The SMTP server is a *transport agent*. It receives all of the mail destined for
    your domain and delivers your outgoing mail to other


    mail servers across the Internet. This uses Sendmail for the SMTP server.

    The POP server is a *delivery agent*. It distributes incoming mail that has been
    stored by the SMTP server. This book uses qpopper for the POP server. This section
    describes the role and functions of each of these servers.


    # ## Role Of The Mail Server


    The mail server provides functions for receiving and storing mail addressed to
    your domain, and delivering outgoing mail (SMTP server), and for distributing
    incoming mail (POP server).


    # ### Role Of The Mail Server


    +   * Receiving incoming mail and delivering outgoing mail

    * Storing mail

    * Distributing incoming mail


    The mail server stores mail that is received until the recipient comes to get
    it.


    The mail server receives mail addressed to the recipient.


    Mail server


    Any mail that is stored will be distributed to the recipient when the mail server
    is accessed.


    ![](img/17f00f03278f20a01f42454f91fb48b8_137_0.png)'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Functions Of Sendmail and qpopper


    Sendmail is the server (transport agent) used for sending outgoing and receiving
    incoming mail. qpopper is the server (delivery agent) that distributes the mail
    that has been received and stored by Sendmail. Building these two servers will
    enable mail to be used freely.


    ![](img/17f00f03278f20a01f42454f91fb48b8_138_0.png)


    +   - Sendmail

    Server for delivering outgoing mail.


    +   - qpopper

    Server for distributing mail from the mail server.


    Names Of Mail Servers Used In This Book

    Server for sending outgoing mail (SMTP) smtp.dekiru.gr.jp

    Server for distributing received mail (POP) pop.dekiru.gr.jp'
