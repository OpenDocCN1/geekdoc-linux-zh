  md: '# 4.7 Installing Linux, Part


    > TIP!


    # What Are /,var, And /usr?


    / (root) is the mount point (name) of the region assigned to the Linux OS. /var
    is the name of the region assigned to system logs and server data, /usr is the
    name of the region where non-system data or programs are stored.


    > TIP!


    # If Mount Point Names Are Invalid, Linux Cannot Be Installed Properly


    If you set the name of a mount point as /var, or /usr incorrectly, an error may
    occur during installation due to insufficient free space or some other reason.
    Note that the names are case sensitive, a distinction is made between uppercase
    and lowercase letters.


