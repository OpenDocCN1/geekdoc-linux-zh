  md: "# Appendix I - Command Reference\n\n+   • Commonly used options:\n\n# du\n\n\
    Displays the disk capacity by each directory.\n\n+   • Syntax\n  du [directory\
    \ name]\n\n+   • Commonly used options\n  -k Displays amounts in kilobytes.\n\
    \  -x Stays in one file system.\n  -S Displays totals only.\n  -d Displays the\
    \ disk capacity used within each directory\n  -h Displays in an easy-to-understand\
    \ format.\n  -a Displays all files as well.\n\n+   • -l Displays a list of lists\
    \ that can be sent.\n  -v Displays details.\n  -m Displays the processes that\
    \ are using file systems containing specified files and directories.\n  -HUP Sends\
    \ hang-up signal. Used when reading settings in a terminal.\n  -kill Sends a signal\
    \ to forfeit quit. Sparingly, as when a process refuses to quit.\n\n+   • Related\
    \ command:\n\n+   • Related commands: mount, kill\n\n# find\n\nSearches files.\n\
    \n+   • Syntax\n  find starting directory conditions\n\n+   • Commonly used options\n\
    \  -name file name Searches for the file name.\n  -size size Searches for this\
    \ size.\n  -type character Searches for and matches only with this type of files.\n\
    \n# grep\n\nWhen specifying a name, [+] indicates a value greater than n, [-]\
    \ indicates a value equal to n, and [-n] indicates a value less than n. For the\
    \ size, [c] after the directory results in bytes, [k] in kilobytes, and [b] for\
    \ nothing else will display the result in blocks of 512 bytes. After type, appending\
    \ [d] displays directories, and [l] displays symbolic links.\n\n+   • Note\n\n\
    Searches within files and displays the results in line units.\n\n+   • Syntax\n\
    \  grep string filename\n\n+   • Commonly used options\n  -n Outputs line numbers.\n\
    \  -i Does not distinguish case.\n  -v Displays non-matching lines.\n  -wnumber\
    \ Displays the specified number of lines before and after a match.\n\n+   • Related\
    \ command:\n\n# fsck\n\nChecks and repairs file systems.\n\n+   • Syntax\n  fsck\
    \ [device name]\n\n+   • Commonly used option\n  -y Answers to all questions.\n\
    \n+   • Related commands: mount, umount\n\n+   • Note\n\nWhen Linux boots, the\
    \ fsck executes automatically if the drive has been mounted more than 20 times\
    \ since the last check. Additionally, fsexec automatically if the shutdown command\
    \ did not execute properly or if a system error occurs.\n\n# gzip\n\nCompress\
    \ files.\n\n+   • Syntax\n  gzip file\n\n+   • Commonly used option\n  - Extracts\
    \ compressed files.\n\nThe gzip command compresses files and saves them with the\
    \ gz extension. A function to collect files is not included in gzip itself. In\
    \ Linux, the tar command will use gzip to compress files.\n\n# id\n\nDisplays\
    \ user ID and group ID information.\n\n+   • Syntax\n  id [username]\n\n+   •\
    \ Related commands: su, useradd, userdel\n\n+   • Note\n\nIf a user is not specified,\
    \ the user who executes the id command will be specified.\n\n# kill\n\nSends a\
    \ signal to a process.\n\n+   • Syntax\n  kill process ID\n\n# 224"
