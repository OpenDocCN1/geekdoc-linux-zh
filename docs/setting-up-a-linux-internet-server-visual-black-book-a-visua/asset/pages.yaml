  md: '# # Understanding TCP/IP


    TCP/IP


    On the Internet, information flows throughout the networks following communication
    protocols called TCP/IP. TCP/IP is an acronym for set of protocols used on the
    Internet to define how computers talk to each other. TCP/IP refers to the two
    most important of these protocols - Transmission Control Protocol and Internet
    Protocol.


    In a TCP/IP network, devices are distinguished by numbers called IP addresses.
    Consequently, it''s necessary to assign a unique IP address to each device on
    the Internet. On the Internet, IP addresses are grouped sequentially and magically.
    This section explains what is meant by a network address and how network masks
    are required to manage them.


    # ## What Is TCP/IP?


    A set of protocols (TCP/IP) is used throughout the Internet. In a TCP/IP network,
    numbers (IP addresses) are used to distinguish devices located on the network.
    Each device connected to the network has its own unique IP address. Throughout
    the Internet not even one device has the same IP address as another device. The
    work of determining where access originates and where it is directed completely
    depends on the use of IP addresses.


    +   * Computers in the Internet are distinguished by IP addresses


    ![](img/17f00f03278f20a01f42454f91fb48b8_37_0.png)


    210.232.68.125


    210.248.12.98


    210.238.29.91


    An IP address is composed of four decimal numbers, ranging from 0 to 255, all
    separated by dots (.). Each of the four numbers represents a combination of eight
    bits (one byte). Because IP addresses are used to identify each computer on the
    Internet uniquely, you can assign them freely as please. When connecting to the
    Internet, you must use the IP addresses that have been assigned to you by your
    ISP.


    210.248.12.98


    A combination of four numbers, ranging from 0 to 255, separated by dots (.).'
