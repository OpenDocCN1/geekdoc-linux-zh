  md: '# Appendix I - Command Reference


    +   • Commonly used options

    -l Matches environment settings to the user being changed to.

    -m Marches environment settings to the current user.

    -c command Executes a command.


    # reset_resize


    Carries out terminal settings.


    +   • Syntax

    eval ''resize''


    +   • Related commands: stry


    +   • Note

    The resize command is used to change the size of a window. The reset command is
    used when unintelligible characters are encountered, as when a binary file displays
    on screen.


    # rm


    Deletes files.


    +   • Commonly used options

    -f Deletes all files in the current directory.

    -f Deletes read-only files as without confirmation

    -i Requests user confirmation to delete each file (Red Hat default).


    +   • Related commands: cp, mv, ln


    +   • Note

    Deleted files cannot be recovered, so exercise caution using this command.


    # shutdown


    Quits the system.


    +   • Syntax

    shutdown [-h -r] time [message]


    +   • Commonly used options

    -h Quit

    -r Reboot.

    -c Cancels a scheduled shutdown.


    +   • Note

    If you specify "now" in the time, the shutdown operation begins immediately. If
    -h or -r are not specified, the system switches to single-user mode. In single-user
    mode, all services are stopped. Use this command when necessary during administrative
    tasks.


    # sort


    Files by line.


    +   • Commonly used options

    -n Sort alphabetically.

    (The Default is alphabetically.)

    -r Sort in reverse order.

    -u Lines having identical content display only.

    -b Ignores blank characters.


    # su


    +   • Syntax

    su [username]


    # tar


    Collects files (archive).


    +   • Syntax

    tar option directory

    • Commonly used options

    -c Create an archive.

    t Displays a list of files in the archive.

    x Opens an archive.

    v Displays the progress of the command.

    -f Specifies a file.

    -z Uses compression.


    +   • Examples

    tar cvf backup-home.tar/home

    tar tvf aaa.tar.gz

    tar tvf aaa.tar.gz


    +   • Note

    The tar command was originally a tape archive. If you do not specify a file name
    by using the f option, Linux will attempt to send the data to a tape archive.


    # tpchdk


    Tests the tc_wrappers configuration file. Along with tpchdk, it can be used to
    verify the settings of the hosts and hosts.deny files.


    +   • Syntax

    tpchdk

    • Commonly Used Options

    -v Displays the contents of all access restrictions

    • Related Commands: tpcdmatch


    # tpcdmatch


    Checks the restrictions in the tc_wrappers files. Predicts how the wrapper will
    handle a specific request for service.


    +   • Syntax

    tpchdk

    tpcdmatch server_name_client_IP_address

    • Related Commands: tpchdk


    227'
