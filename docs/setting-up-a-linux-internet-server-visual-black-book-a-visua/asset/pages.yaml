- img_proc: true
  md: '# STEP UP


    # The Procedures In This Book Are Based On Red Hat Linux 6.0


    This book assumes that you will use Red Hat Linux 6 as the OS for your Internet
    server. From the next chapter, the procedures for building an Internet server
    are based on Red Hat Linux 6. Therefore, to create a server according to the procedures
    described in this book, you must install Red Hat Linux 6, which can be found on
    the CD-ROM that is included with this book.


    Although the various types of server programs that are generally used in Unix-like
    OSes and are not limited to Linux, the procedures described in this book cannot
    necessarily be used directly on all of them. And because Linux differs by distribution,
    you will not necessarily be able to use the same procedures if the version of
    Red Hat Linux differs. Unless you have enough experience to be able to read the
    procedures described in this book for the servers that are installed and configured
    and to convert them accordingly for use with another Unix-like OS, you should
    use the included Red Hat Linux 6.


    # If Red Hat Linux 6.0 Is Not Used...


    To use a different distribution of Linux or another Unix-like OS to install and
    configure the servers described in this book, you must have sufficient experience.
    Although the basic procedures and configuration files are the same, details will
    differ. You must be able to convert and apply the book''s descriptions to the
    specifics of the other OS. This requires familiarity with the procedures and documentation
    for installing and configuring new programs, especially server programs, on the
    other system. To use an OS other than Red Hat Linux 6, be prepared to work out
