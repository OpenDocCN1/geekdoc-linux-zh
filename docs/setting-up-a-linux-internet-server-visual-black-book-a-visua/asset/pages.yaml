  md: '# STEP UP


    # Beware Of Relay Abuse


    Sendmail operates by storing received mail on disk or by relaying it according
    to the Sendmail configuration. Unless Sendmail is specifically configured otherwise,
    it makes no difference from where the received mail originated. This kind of configuration
    leaves your mail server vulnerable to abuse because a a completely unrelated third
    party could freely use your mail server to relay.


    Mail can be sent to many people simultaneously by specifying multiple addresses.
    Before this mail is relayed, only one mail message in which multiple addresses
    are written needs sent. The mail server that actually delivers the mail, on the
    other hand, sends mail individually to the mail server of every domain specified
    in the list of addresses. If your mail server is abused as a relay point, the
    Sendmail program of your domain is used as the mail server for actually delivering
    the mail. The malicious third party will have increased the load on your network.
    Therefore, as a rule, you should restrict relaying of mail.


    MAIL_RELAY_RESTRICTION in the sendmail.def file is used to assign restrictions
    by checking the IP addresses of the mail senders. If this is set to “yes", only
    mail from the network specified by LOCAL_HOST_IPADDR and LOCAL_HOST_DOMAIN will
    be relayed. To permit relaying for other specific networks, change these specifications.


    ![](img/17f00f03278f20a01f42454f91fb48b8_157_0.png)'
