  md: '# Standard Directory Names


    | Name | Contains |

    | --- | --- |

    | bin | Essential command binaries |

    | sbin | Essential system administration command binaries |

    | dev | Peripheral device representation files |

    | etc | System-wide configuration files |

    | lib | Shared libraries (code snippets and data) |

    | mnt | Mount point of temporary partitions |

    | tmp | Temporary files |


    In Linux, the system root directory is represented by / (pronounced "slash" or
    /root/). If directory A is contained in the root directory, it is represented
    by /A. If directory B is contained in /A, then / is used to separate the two directories,
    therefore /A/B. This second /, and any subsequent use of / in the path, is for
    separation only; these slashes do not mean root. Method of representing a file
    or directory location by using directory names and slashes (/) is known as path.
    In Linux, all directories and files can be specified by paths from the root directory
    (/). The specification of a path from the root directory (/) such as /A/B is referred
    to as an absolute path.


    ![](img/17f00f03278f20a01f42454f91fb48b8_102_0.png)


    # Current Working Directory


    Rather than use an absolute path each time you specify a file location, you can
    use "..” to refer to the parent directory of your working directory.


    ![](img/17f00f03278f20a01f42454f91fb48b8_102_1.png)


    Again, the directory in which you are currently working is called the current
    directory or present working directory. Not preceding the pathname with a slash
    (/) means that the file location is represented relative to the current directory
    and is known as a relative path.


    # Linux is Case-Sensitive


    File and directory names in Linux are case-sensitive. Uppercase letters are distinguished
    from lowercase ones in Linux file or directory names. For example, /usr and /USR
    are treated as totally different directories. Therefore, pay careful attention
    to when entering file or directory names and commands.'
