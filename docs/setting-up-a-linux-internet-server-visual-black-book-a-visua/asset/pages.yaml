  md: '# 3.5 The Big Picture


    # Selecting The Hardware


    Like bandwidth, how much CPU speed, RAM, and storage capacity you need depends
    on how much content you intend to serve over an interval. It also depends on the
    bandwidth of your dedicated line. For example, there is little point infitting
    a server with powerful CPUs, for example, if you publish mostly static pages,
    and the most data you can push through your line is 64Kbps. Besides the computer
    that you need to run your Internet server, a DSU/CSU, hubs, network interface
    cards, net-cables, and a power backup unit must also be selected and acquired.


    # Ordering The Line


    You will need to give the leased line provider and your ISP (they may be the same
    company) certain information. Schedule the installation of your line at a time
    that is convenient for you and the tel. An agreement with the line provider will
    have to be signed, and initial payments may have to be made.


    # You And Your ISP


    You will probably not have much ongoing contact with your leased line unless the
    line goes down. Ideally, this will be your of ISP, too. They provide you with
    a port into the Internet through a single router. There is no filtering, no content
    monitoring, and no interference of any kind. You may run your secondary name and
    mail servers, but you take care of every thing. Keep in mind, however, even in
    this scenario, your continued presence on the Internet is completely dependent
    on your ISP. A good relationship


    # The Key Points In Detail


    You will become familiar with these key issues as you proceed to build your Internet
    server and make it available on the Internet. Your specific response to these
    issues and how they can be handled well change over time. The answers may vary,
    depending on the set of conditions at a specific time and place. The questions,
    on the other hand, will generally remain the same. Our approach, using a dedicated
    leased T1 or FT1 line, is only one among several options. You may choose to use
    an XDSL or ISDN line.


    # Location


    The best place for your server might be a closet or small room. The location must
    be convenient for your server as well as that of the T1 line. You should have
    enough room either to work on your server or easily move the server out of the
    closet for upgrades and maintenance. Restrict access by locking the door. You
    don''t want someone accidentally resetting the server or unplugging the T1. Finally,
    have a telephone next to the server and a telephone log or bound telephone notebook
    to record communications with your ISP and the telephone company. Install vents
    near the ceiling so that warm air can escape, and make sure cooler air has a way
    to enter near the floor.(Cutting off 1/2 to 3/4 inch from the bottom of the door
    may work). If heat is a big problem, you may need an air conditioner or forced
    venting. Clean the floor and walls regularly, and install screens into your vents
    if the outside air entering the space gets especially dusty. The cooler and cleaner
    the ambient air around your server is, the better the server will run.'
