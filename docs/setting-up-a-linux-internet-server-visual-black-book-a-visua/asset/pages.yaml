  md: '# # Installing Your Web Server


    # ## Installing Apache


    A Web server receives hits very frequently, These accesses from external sources
    may be concentrated at certain times; therefore, it is essential that you install
    the latest, enhanced version.


    during the boot process. If a version of Apache was installed previously, we will
    delete it, then we compile and install a more recent version.


    This section explains how to compile and install Apache, and how to specify the
    basic configuration, and how to configure Apache so that it starts up


    +   Delete the version of Apache that was included in the package.


    Delete Apache to make sure there is no previous version of Apache installed.


    Enler the command.


