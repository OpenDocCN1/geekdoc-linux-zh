  md: '# STEP UP


    # Who Decides How The Internet Works?


    The Internet relies on various protocols, conventions, and mechanisms, several
    of which were introduced in this book. Who decides how these are implemented?
    A committee called the Internet Engineering Task Force (IETF) decides the various
    protocols, conventions, and mechanisms the Internet uses. Anyone interested can
    participate in IETF meetings, and the results are consolidated in documents as
    Internet Drafts.


    If an Internet Draft is approved by a committee called the Internet Architecture
    Board (IAB), it becomes a formal document called a Request for Comments (RFC).
    Anyone can download both Internet Drafts and RFCs FTP or HTTP. Serial numbers
    are assigned to RFCs. If you look for RFC #2068, for example, you will find the
    protocol specifications for HTTP version 1.1, currently in use on the Web. Besides
    various kinds of Internet specifications, RFCs include summaries of other documents
    and introductory information called FYIs (For Your Information) that provide explanations,
    questions and answers (Q&As), and a history of the Internet. RFCs also are assigned
    to STDs. If you have any questions concerning the Internet or if there is anything
    you specifically want to know, you should read the appropriate RFC first.


    The most significant factor in RFCs and STDs being approved as formal specifications
    on the Internet is that programs or devices are actually operating according to
    these specifications, not whether the specifications seem logically correct. A
    standard is really just something that is commonly used and operates correctly.
    This is illustrated by the frequently used line, “It is a de facto standard on
    the Internet.”


    IAB www.iab.org


    IETF www.ietf.org


    196'
