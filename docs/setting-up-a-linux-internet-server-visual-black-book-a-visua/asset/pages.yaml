  md: '# # Installing Linux, Part 2


    # ## Using fdisk


    The fdisk tool divides the storage space on the hard disk into separate partitions
    for different purposes. Because a PC that is set up as an Internet server will
    run continuously after it has been booted, it will not be able to boot another
    operating system (OS). Let''s configure the hard disk so that the entire disk
    will be used by Linux.


    A hard disk that is used by Linux is usually divided into two main divisions:
    a swap partition and a filesystem partition. In this book, the file system area
    is divided into three partitions: one for a minimal OS, one for temporary storage
    of mail and the like, and one for data.


    # ## Creating Partitions Suitable For An Internet Server


    For this part of the installation, allocate 64MB for the swap partition, 256MB
    for the root (/) partition, 512MB for the /var partition, and the remaining area
    for the /usr partition. The minimum Linux system will be placed in the / partition.
    Data used by various types of server software (such as the system log, mail spool,
    or proxy cache) will be placed in the /var partition. Programs or documents will
    be installed in the /usr partition.


    # Hard Disk Used By Linux (Example: For An 8GB Hard Disk)


    > The hard disk is partitioned into four partitions: one for swap, one for the
    basic OS, one for data and programs, and one for mail and so on.


    ![](img/17f00f03278f20a01f42454f91fb48b8_81_0.png)


    Caution: The explanation presented here is for the partitioning scheme used in
    this book.'
