  md: "# Pi Project\n\n# Retro Pi Phone\n\n# # Retro Pi Phone\nRetro accessories are\
    \ all the rage – this project smartphone features to a 1960s rotary phone\n\n\
    ![](img/589a2610a2e4642c43669f03fe22f7ff_67_0.png)\n\nDan Aldred\n\nDan is the\
    \ Head of ICT at a secondary school in North York and a Raspberry Pi Educator.\n\
    \nLike?\n\nYou can see a number of Dan's Prrelated hacks on his YouTube channel,\
    \ in action, at https://youtube.com/@DanAldred. Watching this will expose you\
    \ to the music of Richie Youie.\n\nhere's something about taking old lifetime\
    \ technology and bringing it back into service. Dan's Pi Phone is one such great\
    \ example. It's a 1960s rotary phone that uses a Pi to dial for the latest headlines\
    \ or send a tweet.\n\n### What inspired this project?\\\n\t\t\t\"bbox\": [0.198,\
    \ 0.345, 0.435, 0.365]\nI was originally sourcing an old rotary dial phone to\
    \ show myself what phones used to be. Before Christmas, I saw a popular supermacraft\
    \ channel had made a classic rotary dial phone – except that they had replaced\
    \ the dial with buttons, and the main cord was connected to the router rather\
    \ than the telephone.\n\nPeople around me do not know how the rotary dials work.\
    \ When you dial, you take your finger out of the hole and turn the dial. This\
    \ is where I got the idea of combining classic smartphone features, with the traditional\
    \ rotary method of accessing information.\n\n### How difficult is it to connect\
    \ a Pi to a rotary dial in terms of hardware?\n\t\t\tSimple in principle but practically\
    \ basic! I created a circuit using the GPIOs and then used Python to check for\
    \ a change in signal. As the rotary dial turns it makes contact, breaking a circuit.\
    \ This is detected by the GPIO pins and fed back into the program code.\n\nThe\
    \ difficult part was suitable a wiring diagram for each of the phones. They all\
    \ look the same, but the inside is different depending on the age and model. britishphones.com\
    \ contains a lot of advice and wiring diagrams. With the correct dial I could\
    \ identify and locate the wires used and hook them up to the rotary dial on the\
    \ Pi.\n\nAs you dial, the 'pulse value' is returned and printed out to the Pi.\
    \ For example, if it returns a value of 1, and it returns a value of 8, then 17-1\
    \ returns 8 pulses into the dial numbers: 7. 10-1 is divided by 3, and 17-1 is\
    \ divided by 8. Once you know which number has been dialed you can assign it to\
    \ function. For more details, look at the wiring see: https://youtu.com/JCh7iv_QBk.\n\
    \nWhat could people bear in mind if they attempt to build something similar?\n\
    The main element to focus on is getting the rotary dial talking to your Raspberry\
    \ Pi. This is established, and then you can finish the function.\n\nAlso consider\
    \ using a Pi Zero. Originally, I had intended to embed a Pi Zero due to size.\
    \ However, as I was developing I realised that it was too small to fit and I had\
    \ to strip out some of the telephone's components to make room a Raspberry Pi.\n\
    \nCan you tell us how you use the rotary dial for recognition capabilities?\n\
    Once you can read the pulse from the rotary dial you can assign actions to each\
    \ number. This is a list of 10 commands. If II is dialed, then read the said voice\
    \ message.\n\nSpeech recognition is powered by Google's standard recognition system\
    \ and works very well. It records your voice, to Google where it is converted\
    \ into text, then sent back to the Pi program. I used the classic e-speak to read\
    \ all text.\n\n> Once you can read the pulse from the rotary dial you can assign\
    \ actions to each number\n\nThe SMS system is powered by Twilio and uses an API\
    \ and unique number to check for text messages. When an message is sent, Twilio,\
    \ the the Pi code responds by triggering the ring-sound then converts and stores\
    \ the content of the message speech.\n\nIs there a feature you would want to see\
    \ in the Raspberry Pi, or perhaps an add-on that has a better fit?\n\t\t\tI would\
    \ like to see some sort of camera or RFID sensor that fits directly onto a Pi\
    \ Zero. What sort of setup could you create your own remote key or trigger notifications\
    \ when conditions are met.\n\n+   Further reading\n\nDan Aldred has a vast treasure\
    \ of ideas about Raspberry Pi and Python-projects and his personal website www.tecod.com\
    \ also tracks his projects on Twitter (@Dan_Aldred.\n\n68"
