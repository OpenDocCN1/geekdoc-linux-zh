    ![](img/589a2610a2e4642c43669f03fe22f7ff_74_0.png)


    Once it''s installed, you can import it into your code:


    +   import bluetooth


    Since Bluetooth is a type of network stack, the language around Bluetooth coding
    should seem familiar to anyone who has written networking code before. You need
    to create socket objects and use them to connect to other devices. You can then
    send and receive data across them. The first step is to create the socket:


    ```

    server_socket = bluetooth.BluetoothSocket(bluetooth.RFCOMM)

    ```


    Once the socket is created, you can listen for incoming connections, like:


    ```

    port = 1

    server_socket.bind(("127.0.0.1", port))

    server_socket.listen(1)

    ```


    # BLE for low-power systems


    The code above binds the socket to a selected port, and then listens for incoming
    on incoming connections. As you can see, you can get a client socket and accept
    the connection. As you can


    ```

    client_socket = server_socket.accept()

    ```


    You then call the recv(x) method of the client socket. The parameter x is the
    number of bytes to read in from. Once your call is all done with the Bluetooth
    connection, you need to remember to shut everything down.


    ```

    client_socket.close()

    server_socket.close()

    ```


    Bluetooth does work, at in principle. Otherwise, you may end up wasting time to
    fix your own code when there is no hardware issue happening.


    # Intro to Python


    All of these tools are really useful, the real purpose of this tutorial is to
    give you the ability to add Bluetooth functionality to your own code. This way,
    you can connect multiple devices together and manage them with Raspberry Pi. You''ll
    find it useful. The first step is to make sure that you have the Bluetooth module
    for Pi installed, with the following command:


    +   sudo apt-get install python-bluetooth


    Don''t forget that when you have two connections to shut down. After they have
    been closed, we can dig deeper into feature functionality.


    Bluetooth includes a low-power implementation named BLE. You may want to look
    at this if you''re building a project that needs to run for an extended period
    of time. Within the Python bluetooth module, there is a sub-module named ble,
    which has classes and methods to manage this for you.


