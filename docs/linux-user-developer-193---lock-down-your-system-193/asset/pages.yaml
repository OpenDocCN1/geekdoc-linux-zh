  md: '# Tutorial


    # Sense HAT: Menu System


    # # Sense HAT: Create a physical menu system


    Take your Python code to the next level with physical computing and the Raspberry
    Pi Sense HAT


    # Calvin Robinson


    Calvin is an Associate Principal, Teaching & Learning, New Technologies at a three-campus
    all-through school in North West London.


    ![](img/589a2610a2e4642c43669f03fe22f7ff_69_0.png)


    ![](img/589a2610a2e4642c43669f03fe22f7ff_69_1.png)


    # Resources


    +   - Raspberry Pi


    +   - Sense HAT

    www.raspberrypi.org/products/sense-hat


    +   - Python 3


    +   - Sense HAT for Python 3

    https://pypi.org/project/sense-hat


    ![](img/589a2610a2e4642c43669f03fe22f7ff_69_2.png)


    Sense HAT is an official add-on board for the Raspberry Pi, offering a whole host
    of built-in sensors including a gyroscope, accelerometer and magnetometer, pressure
    and humidity sensors. What we''re interested in, the fancy is an 8x8 RGB LED matrix
    and five-button joystick to use.


    01 Install the HAT

    When attaching the HAT to your Pi be sure to screw the standoffs in place before
    plugging the HAT onto the Pi''s GPIO pins to avoid breaking the pins. If you have
    some reason to remove the HAT at some point, be careful as the pin header can
    come with it. Once attached, we''ll need to install the sense-hat Python module.


    We''ll start with a simple four-option menu system where down, left and right
    align positions enable the user to navigate the menu made of 8x8 pixel array.
    Pushing the stick button will select the desired option. We''ll then take a look
    at building on this to potentially unlimit menu options.


    ```

    sudo apt-get install sense-hat

    ```


    ```

    from sense_hat import SenseHat


    sense = SenseHat()

    sense = sense.get_position()

    sense.set_message(''Hello World!'')

    ```


    This menu can then interact with any Python program you''re creating, providing
    a physical user interface which we think you will agree to be much more appealing
    user experience than entering into a regular Python shell window prompt.


    Tutorial files available:


    70'
