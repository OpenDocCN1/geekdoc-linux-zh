  md: '# Hardening WordPress


    # WordPress: Use hardening techniques on your install


    Apply some extra measures to tighten up the security of your WordPress installation


    Roughly 25% of web pages are created with WordPress, making it one of the main
    targets of attack for hackers.


    Because companies choose to use it, it''s used for all kinds of services around
    the internet. But the basic security measures offered by WordPress are not enough,
    so we need to use some third-party tools and check the setup of various plugins
    or components, as well as the database itself.


    The design of WordPress is one of its greatest virtues and there''s a large community
    around it, which has helped grow. WordPress uses PHP as its main programming language
    and very popular services as MySQL and Apache as server. Its simplicity is a key,
    but it also has potential for customization through plugins and even graphics
    (templates), all under a GPL licence. These components also suffer from their
    lack of security, which can contain anything from malware to several attacks.


    ![](img/589a2610a2e4642c43669f03fe22f7ff_39_0.png)


    # Common threats


    The security of sites created with WordPress is continually at risk because of
    several factors that could potentially facilitate an attack. Types of attack range
    from simple phishing to complex SQL injection. The exploitation of security flaws
    may be caused by an insecure server set. But these are not the only problems that
    we can face. The most common ones are prevalent vulnerabilities in the code itself;
    including insecure source code from poorly written themes and third-party plugins
    that are installed.


    The first step to hardening your WordPress site is to correctly configure all
    of the settings - which means creating secures passwords to avoid any brute-force
    attacks. Passwords should be at least eight characters long and contain numbers,
    symbols, uppercase letters. The authentication in WordPress is important to keep
    in mind because it determines if the user is legitimate and has permission to
    access resources in the system.


    Stealing credentials can be achieved in various ways. For example, it is possible
    to retrieve credentials


    through a short of phishing attack using email. This attack could infect the target
    with any kind of malware - trojan, for example - and steal the WordPress credentials.
    But the most common attack is related to plugins-and the exploitation of any vulnerabilities
    within their security code.


    Accessing WordPress with a password, even if it is, does not guarantee that the
    user is legitimate. It is possible that the password was stolen, so it''s necessary
    to use two-factor authentication to ensure that account security is not lost.
    This is done through plugins that allow a second channel of authentication for
    the user. There are many ways to implement this, but with the proliferation of
    security-plugins, the these are the easiest to use.


    # Secure your WordPress site


    Plugins are used in WordPress, but also one of its security concerns. A general
    rule, in any plugin that you use the system should be downloaded from a secure
    repository, and with a maintenance policy be able to uninstall and update these
    components.


    There are many plugins that allow enable us to scan and detect issues with them.
    For example, Word (wordpress.com) and Security (https://sucuri.net/) are the two
    most popular, and include a firewall, plugin and real-time traffic analyzer. Both
    of these plugins are available as free and commercial versions.'
