  md: '# Kodi

    The leading home-theatre software that doubles as a streaming server


    ![](img/589a2610a2e4642c43669f03fe22f7ff_80_0.png)


    +   - Kodi has a powerful web interface that can stream your media library, and
    also doubles up as a remote control to the Kodi server


    ![](img/589a2610a2e4642c43669f03fe22f7ff_80_1.png)


    +   - Behind the scenes, U uses popular open source tools and libraries such as
    Fmpeg and Encoder to handle all sorts of media


    Usability

    One of the main reasons for Kodi''s popularity is its ease of use and intuitive
    interface. It has a ''10-foot'' user interface that''s designed for use with traditional
    televisions and can be navigated by a TV''s remote control. Kodi will help users
    populate their libraries from their computer on first launch.


    Usability

    UMS has a couple of interfaces. The administration interface runs locally on the
    server and is divided into various tasks. You can easily add media libraries and
    configure the behaviour of the server from this interface. There''s also a minimal
    web interface for streaming that shares directories as well as recently played
    files.


    Management

    Kodi has an extensive list of features and offers a lot of conveniences for managing
    media. It has tools for managing creating and controlling playlists, audio tags
    and other kinds of metadata as well. It is also search for subtitles and offers
    parental controls to restrict access to different areas of the app.


    Management

    UMS does a few management functions that give you access from the administration
    interface. It can fetch artwork for music and use ffmpegplayer to generate thumbnails
    for videos. You can get extensive options for tuning the transducer settings.
    You can use all compatible devices on the network from the administration interface.


    Device support

    Available for AndroidOS and Windows, you can install Kodi on Android and iOS devices
    and a lot of other peers including Amazon Fire TV, Raspberry Pi, Intel, Android
    and more. You can stream media from a Kodi installation via the web interface
    or over the network. Connect, AirPlay and UPnP devices.


    Configuration

    Installation is fairly simple well-documented. While the app comes with defaults
    and only needs to be pointed to your media library, it does offer extensive configuration
    options. Although the settings are housed inside a unified settings interface,
    it can be quite frustrating to locate a particular setting when you''re not familiar
    with the layout.


    Overall

    A one-stop shop for all your media playback and streaming needs, Kodi is one of
    the crown jewels of open source software, it''s already impressive list of features
    is further bolstered by its add-ons.


