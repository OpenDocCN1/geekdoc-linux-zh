    \ the >8search changes. What would we like to do is to add the files in builtin/git.c\
    \ and to the index and then commit. Then we would end up with the commit message\
    \ as well. The easiest way to get around this problem is to use a special tool\
    \ in the interactive stager.\n\n# Interactive staging\n\nTo start the interactive\
    \ stager we would run the command git add The first thing that puts a number in\
    \ a list of all the files, together with a list of commands and prompt with the\
    \ words Now, as in Figure 2 we want to update the index by adding some files.\
    \ We can use 'update' to update the files. The interactive stager repeats the\
    \ list of files, inviting us what to add to the commit. If we use 1, 2 we will\
    \ add files 1 and 2 to the index. Press a second time (without typing anything)\
    \ the Press Update prompt to get back to the first screen. Line 5, git.c, is more\
    \ complicated, since we only want to commit\n\nAnd there are a lot of other options\
    \ in the patch menu - you can get a full list by typing ? instead of r. For example,\
    \ the interactive stager it will automatically try to split the modifications\
    \ into hunks. If you use s, it will split a hunk into smaller hunks, or e to edit\
    \ the hunk manually, or to have full control over what gets into the hunk.\n\n\
    There are many more options in the interactive stager, and they're all useful.\
    \ Run git-add and go to the INTERACTIVE MODE section to find out more about them.\n\
    \nWhat now > Staged unstaged patch\n1: unchanged\n* +-1 git c\nPatch update\n\
    unstaged patch\n1: unchanged\n* +-1 git c\nPatch update\ndiff --git a/git.c b/git.c\n\
    index f9e87a5..08d5972 108644\n--- \n+++ +\n@@ -4,7 +4,7 @@ static struct cmd\
    \ cmd_commands[] = {\n* - \"objects\", cmd_RUN, STAGING\n+ cmd_GC, RUN, STAGING\n\
    + \"commit-id\", cmd_get_commit_id, NO_PARSEOPT\n+ \"grep\", cmd_grep, RUN_STAGING\n\
    + \"hash-object\", cmd_hash_object,\n+ index\", cmd_index, RUN_SETUP_STAGING |\
    \ NO_PARSEOPT\nStage hunk (y,n,a,g,d,j,e,m|?) .\n\nsome of the changes in the\
    \ file, if we use the patch command to perform a partial staging of the file,\
    \ if we use the prompt at the What now prompt and press return. We get a list\
    \ of the remaining unstaged changes - in this case, only the ones we want to add\
    \ to the file - and then we return to the staging process.\n\nThe interactive\
    \ stager now starts with \"hunks\" of the file - blocks of code which have been\
    \ made - as Figure 3. As we can see, the first hunk shows changes - so for the\
    \ one we want to add to commit - we press y and return to the interactive stage.\
    \ The second hunk is the welcome message, so we press n and return as we don't\
    \ want to stage this particular modification.\n\nWe are back at the home prompt,\
    \ and we can run git status to continue the interactive stage. Now we see that\
    \ git commit appears in the 'Changes to be committed' and 'Changes not staged\
    \ for commit' lists.\n\nThe next is to run commit -m \"changed the name from grep\
    \ to search\" in order to create a new commit with these selections of modifications.\
    \ Finally, we can add the welcome message as a second commit.\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_38_0.png)"
