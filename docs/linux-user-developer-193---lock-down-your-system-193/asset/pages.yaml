  md: "# # Tutorial Raspberry Pi: Bluetooth\n\n# ### Talking to an Arduino\n\nOne\
    \ of the things you want to do with your Raspberry Pi is to configure it for whatever\
    \ remote devices are communicating with. In this case, you will want to dump the\
    \ incoming data to a file for processing.\n\nThis type of pattern should be familiar\
    \ to anyone who has written TCP socket code. With this boilerplate code, you could\
    \ write a controller program for your Raspberry Pi that can send data to the remote\
    \ devices, and then read them and save them out to files. You can adapt the devices\
    \ as needed.\n\nWhile all of the code in the main article is meant to run on a\
    \ Raspberry Pi, you can use any device that you want. For example, you use a Raspberry\
    \ Pi, plus the code described here, as the central unit. You can use any Bluetooth\
    \ module, as a remote sensor.\n\n# ### Copy arrays\n\nThe first step is to accept\
    \ an incoming connection. Since you want to accept a connection from any device,\
    \ you will need to listen on all ports.\n\n```\nserver_socket = socket.socket(socket.AF_INET,\
    \ socket.SOCK_DGRAM)\nserver_socket.listen(port)\nport = server_socket.getsockname()[0]\n\
    ```\n\nThe last line tells you the file has been listed. The next step is to accept\
    \ a connection and get the device name from that incoming connection.\n\nThe key\
    \ is that you will need one thread of execution to handle incoming connections.\
    \ This thread will add the connected sockets to a data structure. You will need\
    \ another thread to go through and deal with each incoming connection. For both\
    \ of these sections, you will use named connections, which will be used to handle\
    \ all of this process.\n\n```\nclient_name = client_info(0) + \".out\"\nclient_file\
    \ = open(client_name, 'a')\nwhile:\n    data = client_socket.recv(1024)\n    if\
    \ len(data) == 0:\n        break\n    client_file.write(data)\n```\n\nWith this\
    \ function, you can open a file for this particular connection and save the data\
    \ as a file. As example, you could do something like this:\n\n> Since Bluetooth\
    \ is a type of network stack, a lot of the language around coding would seem very\
    \ familiar to anyone who has written networking code\n\nThe first step is to handle\
    \ the incoming connections. For this portion, the code will essentially set up\
    \ the socket and listen for the next connection requested.\n\n```\ndata_file =\
    \ open('data.txt', 'r')\nwhile True:\n    data = data_file.read(1024)\n    if\
    \ len(data) == 0:\n        client_socket.send(data)\n```\n\nGoing in the other\
    \ direction is quite simple either. You simply need to open a file for reading,\
    \ and then send the data out to a device. A simple example look like:\n\n```\n\
    while True:\n    socket, addr = server_socket.accept(None)\n    connections.append(socket)\n\
    ```\n\nThis snippet will loop forever, listening for incoming connections and\
    \ saving them to the device when they get established.\n\nThe next chunk of work\
    \ is to check of all these connections and what we might be going in them. The\
    \ basic check would look like:\n\n```\ndef check_data(address, output_file):\n\
    \    socket = connections[address]\n    # ...\n    socket = connections[address]\n\
    ```\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_75_0.png)\n\nA program like this\
    \ can be a friendly way to verify that the underlying hardware is working correctly"
