  md: "cannot be manipulated.\nThe wp_posts tables contain different attributes related\
    \ to the identity of the author, date, visibility and so on. The editing mode\
    \ is responsible for protecting insertions, updates or deletions of values; if\
    \ the 'Read-Only' mode is enabled, the table cannot be manipulated.\n\nThe wp_users\
    \ and wp_userdata tables are strongly related. The first table lists information\
    \ about users, such as password, email, and nickname. This is used by WordPress\
    \ to compare whether the password entered by the user is valid and corresponds\
    \ to the user name indicated.\n\nTo better understand how security protection\
    \ works, let's consider two scenarios where we could apply this solution:\n\n\
    +   - When a new user is deleted, updated or added, the wp_users table is modified,\
    \ and as the wp_userdata table, the role, nickname and other attributes are reloaded.\n\
    - When a user logs in, the wp_users table receives queries to verify that the\
    \ password is really the one stored. When it is checked and validated, an entry\
    \ in the wp_userdata table is created to add the session, in the event it already\
    \ exists, instead of creating an operation with the new value is carried out and\
    \ stored in 'meta_value'.\n\nEven Paths has created a plug-in to take care of\
    \ all this; head to: http://blog.in/WPAdminPassword to see more about it.\n\n\
    # Use TOTP\n\nTime-Based One Time Password, is an authentication that generates\
    \ a one-time password from a secret key in a specific time. This is an extra security\
    \ measure to prevent unauthorized access to WordPress. To learn how it works,\
    \ we use Latch again because this feature is already implemented. It is necessary\
    \ to install the Two Factor Authentication plug-in. Once installed, it must be\
    \ activated and 'Ousted' \n\n![](img/589a2610a2e4642c43669f03fe22f7ff_42_0.png)\n\
    \n# If our security measures fails, it's important to be ready with a full backup\n\
    \nTOTP protection ensures. The next step is to pair the login operation with the\
    \ QR code generated by the Two Factor Authentication plug-in. In the next WordPress\
    \ login operation, once it has validated, the system will ask for TOTP. This code\
    \ is available within Latch in the FIN menu. WordPress is now protected with another\
    \ security layer.\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_42_1.png)\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_42_2.png)\n\
    \nUpdating WordPress is a really important operation because it doesn't take advantage\
    \ of a security flaw within the WordPress distribution itself. We recommend that\
    \ you install all updates for plugins and WordPress itself; as we've already pointed\
    \ out, don't forget to check the source of those components and what you are downloading\
    \ from a legitimate repository.\n\n> Example: The ideal chain connection for users\
    \ that're not logged in and those that\n\n```\ndefine( 'WP_AUTO_UPDATE_CORE',\
    \ true );\n```\n\nIf all security measures fail, it's important to be ready with\
    \ a full backup to restore WordPress. Some plug-ins can run this for you, but\
    \ there is a simple way to create a quick backup of the system files and database\
    \ using plug-ins. For the system files, you will need to connect via FTP/SFTP\
    \ and copy all folders and files from your site, including the subfolders wp-admin,\
    \ wp-content and wp-includes. For the database, the most common method is to use\
    \ phpMyAdmin where need to select the database name and start the copy to an external\
    \ file by clicking 'Export'. This action copies all the tables inside the database,\
    \ so all this information will be safe. Alternatively, you could accomplish a\
    \ backup from the console using mysql command:\n\n```\n$ mysqldump --add-drop\
    \ -h database_name -u root -p wp > wp.bak.sql\n```\n\nAs you can see, it is worth\
    \ dedicating a little time to ensure the security of your WordPress is installed,\
    \ as well as how users access it."
