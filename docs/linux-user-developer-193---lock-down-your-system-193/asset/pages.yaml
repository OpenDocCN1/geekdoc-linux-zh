  md: '# TEXT EDITOR


    # GNU nano 2.9.7


    A CLI text editor that works for both new and experienced users


    +   Pros

    Easy-to-use command line text editor that is designed for both new and experienced
    users.


    +   Cons

    Doesn''t support the mouse, which makes it cumbersome for simple text editing.


    While you can divide experienced Linux campaigners into the emacs or vi camps,
    these two editors are often too confusing to use.


    nano, often just known as nano, is a simple CLI editor easy to learn with enough
    features for beginners. supports text wrapping, has full undo and redo, can highlight
    syntax and do a lot more.


    specify the complete path to a file, which it''ll open for modification if it
    exists, or create a new buffer at the specified location. The interface of the
    editor is fairly intuitive. It displays the name of the file you''re editing at
    the top while the last two rows at the bottom contain help functions.


    Use the shortcut to help you the documentation, which lists all the shortcuts
    you can use. Does that that format, you also find that it can open compressed
    documents. The shortcuts at the bottom also change depending on the context. For
    example, when you are saving a buffer you''ll get shortcuts to help you complete
    this particular function.


    +   Great for...

    Quickly creating or tweaking configuration files once you learn all the relevant
    commands.


    If you launch nano without any arguments, it''ll open the editor with an empty
    buffer. You can also


    # WEBSITE GENERATOR


    # Nikola 78.15


    Convert content into a static website with ease


    ![](img/589a2610a2e4642c43669f03fe22f7ff_90_0.png)


    Nikola is a Python utility that converts simple markup into a spiffy-looking website
    with a single command.


    Using Nikola you can make a static website more-friendly by adding one of the
    popular comments. It also supports themes with plugins, tag clouds, comics. You
    can import RSS feeds and more.


    Using Nikola Python package to manage exact commands as listed in the Getting
    Started section on the project''s site. Once you''ve installed it, you can create
    a static website with sample content within the nikola-directory.


    ```

    nikola serve <website_directory>

    ```


    Replace <website_directory> with the directory name under which it will generate
    the content of your website.


    The process will ask some questions to confirm the website''s name and the author''s
    name and other settings. Use nikola build --force to build the website. nikola
    serve -eb enables you to view the website using an accompanying web server.


    Nikola is a fairly extensive tool and you will spend some time reading through
    its various command line options.


    Above the sites it generates, to the use of you can create some impressive-looking
    pages


    +   Pros

    A CLI tool that can convert all types of documents into static websites that are
    easy to maintain.


    +   Cons

    Not everybody is comfortable using a command-line tool unless extensive and detailed.


    +   Great for...

    Generating, configuring and maintaining a personal website.


    https://nikola.org'
