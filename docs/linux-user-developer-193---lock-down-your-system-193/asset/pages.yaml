  md: '# Zulip for Start-ups


    You can install Zulip on a freshly 64-bit Ubuntu 16.04 server. While theoretically
    it should work with any flavour of Linux as long as it satisfies the server''s
    software dependencies, Ubuntu Xen is the only officially supported distribution.
    In addition, development is easiest for Zulip and not providing any other network
    services.


    other things. Make sure you set one up before you''ll need to supply your credentials
    while installing the server. Zulip developers recommend using the transactional
    email service such as SendGrid, Mailgun, or Amazon SES which are cheaper and more
    reliable than rather setting up your own SMTP server from scratch.


    In terms of physical requirements, this machine needs a 64-bit- OS with at least
    2GB of RAM and 20GB of disk space to serve up to 100 users. If you have more than
    that, make sure you have +4GB of RAM and a dual-core system. The disk space depends
    on the size of the files you will upload; if users share large files it''s prudent
    to have a larger minimum.


    You''ll also have to ensure the server allows traffic over port 443 to accept
    HTTPS connections. If you use port 80 instead, you''ll need to redirect users
    to the HTTPS server. For sending emails, you''ll have to make sure the Zulip server
    has outgoing access to your mail server via the SMTP port 587.


    Before starting, installation also requires you to have a fully qualified domain
    name for your Zulip server - like chat.example.com. You will need a SSL certificate;
    the installation process will automatically fetch one from Let''s Encrypt using
    the certbot tool. Zulip needs a fully configured server for email invitations,
    notifications and


    # Install Zulip


    To install Zulip on the Ubuntu server and use sudo to switch to the root user.
    Go to http://www.zulip.org/releases/ and download the latest version (Note: The
    version we use is also on the connective and Fileist) in a temporary directory
    using the following commands:


    ```

    $ cd /tmp

    # wget https://www.zulip.org/dist/releases/

    zulip-server-1.8.1.tar.gz

    # tar xf zulip-server-1.8.1.tar.gz

    # cd zulip-server*

    ```


    ![](img/589a2610a2e4642c43669f03fe22f7ff_55_0.png)


    # Send and receive messages


    Click the ''New topic'' button located at the bottom. The stream you join has
    space to enter a topic. Topics are like the subjects of an email, so you can better
    organise messages within a stream.


    You can get the attention of particular users, rather than the whole stream, by
    typing the @ followed by the first few characters of their username and letting
    Zulip complete it for you.


    To send messages directly to one or more users instead of the stream, click the
    ''New message'' button at the bottom of the chat interface. Use Zulip''s autocomplete
    feature to find names of users you want to address.'
