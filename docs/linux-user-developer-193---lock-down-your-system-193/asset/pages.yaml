  md: '# Tutorial


    # Hardening WordPress


    +   Database modes

    Read-Only

    Allow the owner of the database to disable the capability of a user to log in
    and post comments as well as administrative operations such as adding, modifying
    or deleting users.

    Administration

    Allow the owner of the site to decide when updates, deletions of users are allowed
    (user management).

    Editing

    Allow posting of content only when the administrator allows it.


    ```

    openssl req -sha -newkey rsa:2048 -days 365

    -nodes -keyout server-key.pem -out server-req.pem

    openssl -keyout server-key.pem

    openssl x509 -req -in server-req.pem -days 365 -CAkey ca.key -CAfile cacert.pem

    -set_serial 0 -out cert.pem

    ```


    To accomplish this chain splitting, we need to create several modifications to
    the WordPress files wp-config.php and wp-load.php. The first step is to include
    the wp_user in the file wp-config.php. This user is named as DB_USER. The second
    step is to add a function to wp-load.php. This function is called using wp_db_load().
    To add this variable, which we will use in WordPress, and check if the user exists
    or not, use the following code:


    The cacert, server-cert.pem and server-key.pem files must be copied to the /etc/mysql/
    path. Once these are configured, we secure the server. To verify that the settings
    are correct, we make a connection to the server using `mysql -u <user> --sslca=cacert.pem`.
    We can now verify that the connection is encrypted. If it''s not, we will need
    to add the flag "MYSQL_CLIENT_FLAGS," to the connection at the top of wp-config.php.
    Then the connection by WordPress will be encrypted by SSL and a potential attacker
    will not be able to monitor or intercept.


    To find out if a user is logged in or not, the wordpress_logged variable is analysed
    and we check wordpress_logged. If such a value exists, the user is logged in and
    if it doesn''t, the user isn''t.


    # ideal for maximising security would be for each user to have their own chain


    For each user to have their own connection chain, then the WordPress administrator
    will have a unique connection to the database. Let''s look at a practical application
    of logging multiple users using SSL.


    The following commands will create the wp_user user and assign permissions in
    MySQL:


    ```

    CREATE USER ''wp_user''@''%'' IDENTIFIED BY ''pass'';

    GRANT SELECT ON wordpress.* TO ''wp_user''@''%'';

    FLUSH PRIVILEGES;

    ```


    Using the above method (that WordPress makes) queries to the database to fetch
    the content from the tables, posts on the website, and so on. There are many ways
    to do this in the wp-config.php file, loaded in the MySQL database. Then we use
    only SELECT, which is defined in the new tables, but only only with the SELECT
    command.


    Successful attacks on the WordPress database can be dangerous; for example, a
    SQL injection can cause loss, manipulation or insertion of data in WordPress tables
    such as wp_users. On the other hand, a network packet injection attack enables
    an attacker - effectively in the communications between the WordPress application
    and application - to modify the content that the CMS sends.


    This, the potential addition of a user, and the modification of parameters or
    contents in the database, are prohibited. This limits the minimum privilege and
    impact.

    Users logged in using a root user name with all read/write privileges, so this
    connection grants higher privilege than non-logged users. This is an approximation
    to the ideal, but we can see how the risk of an SQL attack has greatly been reduced,
    because any attack has been detected, because any user who is logged in cannot
    access or manipulate information from the database.


    One implementation of the strategy is to use a function that monitors the attacks
    in WordPress critical tables, which will allow the owner to enable or disable
    options with two-factor authentication. These triggers communicate with Late to
