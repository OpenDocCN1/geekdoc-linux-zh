  md: '# INTERVIEW KUBEFLOW


    # Open ML for everyone


    We spoke to Google David Aronch about his new open source project for simplifying
    scalable machine-learning deployments


    F or anyone dealing with complicated Kubernetes must become the standard. The
    question now occupying many users is what to build on top of that abstraction.
    Answer is Kubeflow focused on Machine Learning. At CloudNativeCon in Copenhagen,
    David Aronchick, Product Manager, and Vishnu Kannan, Senior Software Engineer,
    announced Kubeflow 0.1, the project''s first release. Aronchick explained Google
    of Kubeflow. In series, there''s another opportunity to abstract the complexities
    of ML and focus on the aspects of software development.


    together, without even necessarily forcing the Kubernetes APIs. And that''s a
    really important point. You don''t have to go and make any changes. You can reach
    it as an application as you want, without making any changes to the underlying
    platform. What we mean, is, that your solution can become portable again. So I
    looked at a number of domains that needed that kind, and that''s where we were
    looking at ML. ML is incredibly interesting. It''s a challenge of ''How does this
    impact me? How do I get started with ML? How do I scale?''. So we were looking
    at ML and we''re trying to figure out, ''How do we handle a whole lot like 2015;
