  md: "while True:\n\n```\ndata = socket.recv(1024)\nif len(data) == 0: break\noutput_file.write(data)\n\
    socket.close()\ndel connections[address]\n```\n\nThe recv() function is blocking,\
    \ meaning that it will wait until something happens, you will likely want to create\
    \ a separate thread for each of these connections so that your program doesn't\
    \ freeze when checking for incoming data from each of them connections.\n\nAlso,\
    \ the given cleans up after itself when the connection is lost, or closed from\
    \ the other side. This might be something that you rather handle in some central,\
    \ depending on how you want your program to work.\n\n# Control devices\n\nWhen\
    \ dealing with your Bluetooth neighbourhood, there are a couple of techniques\
    \ that you might consider adding to your device. The first is to advise yourself\
    \ of all the locally visible, by using the Service Discovery Protocol (SDP). There\
    \ is also a function called advertise_service() that opens a socket that you are\
    \ currently listening, and as well, the following code will set up the SDP protocol.\n\
    \n![](img/589a2610a2e4642c43669f03fe22f7ff_76_0.png)\n\n+   - bluetooth.advertise_service(server_socket,\
    \ \"rPiService\", classes=(bluetooth.SERIAL_PORT_CLASS,), profile=\"bluetooth.SERIAL_PORT_PROFILE\\\
    ))\n\nThis sets up a name rPiService, that your devices can look for and decide\
    \ whether they should connect to. This can help you manage your remote devices\
    \ in an easier way, since you are dealing with names instead of addresses.\n\n\
    If you are also going to use Python code to connect (maybe they are also Raspberry\
    \ Pi boards), the following code is an example of how to make connect:\n\n+  \
    \ - services = bluetooth.\n  find_service(name=\"rPiService\", match=(bluetooth.SERIAL_PORT_CLASS))\n\
    \  port=match(\"port\")\n  name=match(\"name\")\n  host=match(\"host\")\n\nThis\
    \ code ensures that only one service is visible that has the name rPiService.\n\
    Along with devices able to discover the Raspberry Pi server, you may need to enable\
    \ that your Raspberry Pi to discover what devices are visible to it.\n\nThe function\
    \ discover_devices() does scan and reports back info about any that that are found.\n\
    \n+   - nearby_devices = bluetooth.discover_devices(lookup=True)\n  for name,\
    \ address in nearby_devices:\n    print(\"%s - %s\" % (name, address))\n\n> Above\
    \ the basic layout of the network we are creating is star topology, everyone connecting\
    \ to a central Raspberry Pi\n\nThis is why for managing connections, the Raspberry\
    \ Pi can be completely in charge. It can look at what devices are up and listening,\
    \ and then make socket connections to them and send control signals. This way\
    \ of working implies that the remote devices are coded by you are operating on\
    \ the Raspberry Pi which is connecting to them directly.\n\n# Where next?\n\n\
    Before moving on, we need to stress that you should not use any of the code that\
    \ you have seen written here. As you should have noticed, there is no-checking\
    \ at all. With a protocol like Bluetooth, which is designed for short-range and\
    \ low-power connection, connections between devices are more fragile than you\
    \ might be used to - especially if you have previously coded programs over a long\
    \ link, such as TCP over Ethernet.\n\nThis means that you should be responsible\
    \ for writing code to be a bit more robust than these examples, especially if\
    \ the remote devices are at the extremes of the range. Having that, we hope that\
    \ this has put another option in your toolbox for when you need to make multiple\
    \ machines talking to each other without needing to physically connect them."
