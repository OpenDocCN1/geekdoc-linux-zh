    # Fresh free & open source software


    # GAME MANAGER


    # Lutris 0.4.16


    An all-one solution to install, manage and play games


    With Lutris you can install, remove, configure, and manage games on your Linux
    desktop. Lutris comes with Linux support for Windows games (via Wine), and even
    emulate console games which can also manage games through GOG and the Humble Bundle.
    To top it all, the app includes scripts to make a game''s installation process
    easier. Lutris comes with more than 20 emulators and platforms installed Lutris
    consists of two components: the desktop app and lutris.net website. You can use
    the website to browse available games and add your own to personal library. You
    can sync with the desktop app and install the added games with a single app. Head
    to Lutris to get the desktop app for your distribution. Installation instructions
    for the install stores are straightforward and simple. Follow them to set up the
    app with lutris.net. Then head to Lutris > Synchronise Library to fetch the list
    of games you have added. You can now right-click the listed titles and use the
    option to install the game.


    ![](img/589a2610a2e4642c43669f03fe22f7ff_89_0.png)


    Head to My Account section on lutris.net and sign in to your Steam account to
    sync your Steam library.


