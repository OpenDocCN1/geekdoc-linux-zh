  md: '# Meltdown forces Kubuntu to drop 32-bit


    # Remaining users should grab 18.04 LTS


    **It''s a trend that has stalked the Linux for the past few years: retiring of
    32-bit disk images.** Ubuntu was among the first to abandon these, suitable for
    older hardware, and its family of Ubuntu flavours slowly followed suit.


    Now, Kubuntu has announced it is jumping on the one-way 64-bit train. Via an email
    on the Kubuntu Developer mailing list, Valor Zermann revealed that Kubuntu developers
    intend to stop 32-bit users. Several reasons are given, but most compelling in
    the accompanying notes from Canonical''s Bryan Quigley is: "Machines running i86
    are capable of running amid. Ubuntu are vulnerable to the critical vulnerability,
    whereas they wouldn''t be if they were running amd." While many users are employing
    32-bit systems, statistics suggest most hardware will run 64-bit operating systems.


    This means that while there is a 32-bit Kubuntu build available for 18.04 LTS,
    it will be the final one. When time comes, for anyone wishing to use Kubuntu on
    32-bit hardware to install, and take advantage of the three years to support the
    LTS deliveries.


    ![](img/589a2610a2e4642c43669f03fe22f7ff_7_0.png)


    > Above: It''s time to switch to 64-bit Kubuntu packages – or Mint 19


    # New Arduino boards announced at Maker Faire


    **Just when you thought that cloned boards were a thing of the past, Arduino announced
    two new PCBs.** Announced at the Maker Faire in May, the new boards will be introduced
    to set the direction for Arduino, which has been recently reclaiming boards while
    tweaking and reaching the limits.


    First to be announced was the newly revised Arduino UNO WiFi Rev 2, with boards
    based on the ESP-8266 microcontroller and the ESP32 SoC. Wireless connectivity
    for the Arduino UNO is obviously a


    and, this revision includes an ECC608-type chip accelerator for secure communications.
    One drawback of the usual Arduino UNO features no PWM outputs. The microcontroller
    has a high-speed digital-to-analog converter, 6KB RAM, four channels and three
    universal synchronous/serial interfaces.


    A new board was also announced at Maker Faire. The MKR VIDOR 4000 features a Programmable
    Gate Array (FPGA) that can mimic many other processors. In addition, the MKR VIDOR
    4000 is also


    wireless (using the same chip as Arduino UNO, which has considerable ramifications
    for further things). Smaller than the UNO WiFi Rev 2, the MKR VIDOR 4000 is similar
    and SAMD21 is too. While prices are coming, both boards will be available by the
    time you read this. With the trademark of the past deal, prepare your breadboards
    and Arduino sketches for a fresh age of hobbyist computing with Arduino.'
