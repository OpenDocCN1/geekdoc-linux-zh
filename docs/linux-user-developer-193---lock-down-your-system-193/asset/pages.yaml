  md: '# # AT A GLANCE


    +   * Explore Zulip p55

    Learn how Zulip can enhance your organisation''s communication


    +   * Install Zulip p56

    Roll out Zulip on a test server as well as a production server


    +   * Understand Streams p59

    Learn how to communicate using Zulip


    +   * Configure Zulip p60

    Adapt the installation to your requirements


    Messaging and collaboration tools like Slack and HipChat (now stride) have become
    essential parts of many organizations. Teams assimilate into the workflow to streamline
    communication and enhance productivity. But why use the likes of proprietary Slack
    when you can easily use self-hosted open source solutions? You give all the control
    and your data — to a third party on the internet.


    Zulip is an open source chat platform. It was acquired by Dropbox in 2014, which
    released it under the Apache License 2010. Its backend is Python while the web
    front-end is written in JavaScript.


    Zulip has all the features you''d expect. One of its standout features is the
    threaded conversation group. With this, you can participate in multiple separate
    conversations without getting lost or overwhelmed. We make it interesting. In
    Zulip, you can have conversations with another user or en group, and can easily
    share files with anyone by dragging and dropping them into the Compose box.


    You can access Zulip via its web interface or desktop and mobile apps for Mac
    OS, Windows and Linux as well as Android and,. Zulip has all the features you
    need, from typing notifications and the ability to


    track the performance of team members. All automatically save drafts and enables
    you to edit messages. Filters help organize users and a bunch of tools and mechanisms
    like hashtags and topics to enable you to catch up. To help keep track, Zulip
    organizes streams and many conversations. It has a full history, so you can search
    for the conversations that happened before. Zulip offers free-grained search options
    and can show statistics about the communications in your organisation.


    > You can participate in multiple separate discussions at the same time without
    losing time


    Zulip also has impressive developer-friendly features. When sharing code, you
    can use backticks to specify the syntax of a code block, and Zulip has syntax
    highlighting. It is remarkably flexible. You can build report systems and built-in
    integrations with third-party services such as Track, Nagios, GitHub and Jira.
    The Zulip platform can pull in notifications from over sources, such as monitoring
    tools, project management systems, continuous integration platforms and more.
    You can also use the Zulip API to customize notifications from your own application.


    Zulip is equipped with all the necessary tools that can help teams in an organisation
    operate more effectively and efficiently. Lately, Zulip has seen a good amount
    of traction since its drop as an active developer community and a regular participant
    in the open source ecosystem.


    Over the next few weeks, we will show you how deploy Zulip within your organisation
    or as a production server. We''ll also hand-hold you through its administration
    interface and help you test your installation of the unique features available.


    In this feature we will show you the latest of the Zulip server (with a very important
    feature that will get to the market later) and some new and improved features.
    We show the installation procedure has been streamlined and Zulip can now automatically
    fetch SSL certificates


    If you''re new to Zulip, we show you how to import your users, teams, message
    history from Slack or Mattermost. In Zulip, you can join multiple teams at once
    so it might not work as expected.


    In addition to mentioning users, we show how to set up channels, integrations,
    and manage groups of users. For example, @sales will send a message to all members
    of the sales team. A major feature in this version of Zulip is the ability to
    have chat sessions with Jitsi Meet. The developers are working to add other chat
    features such as Google Hangouts. We show first snapshot of these features in
    release


