    exploit/linux/ftp/ftopfd_reverse: {\n  \"default_port\": 21,\n  \"inline\": \"\
    220 ProFTPD 1.3.0 ftp server\",\n  \"handler\": [\n    \"seq\"\n  ]\n}\n```\n\n\
