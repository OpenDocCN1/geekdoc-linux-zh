    ## Review


    ## Fresh free & open source software


    ## GAME MANAGER


    ### Lutris 0.4.16

    An all-in-one solution to install, manage and play games


    With Lutris you can install, remove, configure, and manage games on your Linux
    desktop. Lutris comes with Linux support for Windows games (via Wine), and even
    emulate console games which can also manage games through GOG and the Humble Bundle.
    To top it all, the app includes scripts to make a game''s installation process
    easier. Lutris comes with more than 20 emulators and platforms installed Lutris
    consists of two components: the desktop app and lutris.net website. You can use
    the website to browse available games and add your own to personal library. You
    can sync with the desktop app and install the added games with a single app. Head
    to Lutris to get the desktop app for your distribution. Installation instructions
    for the install stores are straightforward and simple. Follow them to set up the
    app with lutris.net. Then head to Lutris > Synchronise Library to fetch the list
    of games you have added. You can now right-click the listed titles and use the
    option to install the game.


    ![](img/589a2610a2e4642c43669f03fe22f7ff_89_0.png)


    Head to My Account section on lutris.net and sign in to your Steam account to
    sync your Steam library.


    - Pros: A one-stop approach makes it really simple to install and manage Linux-compatible
    games.

    - Cons: Can''t add games from the plus app, as some will fail to install and not
    display debug messages.

    - Great for Installing and playing games from different gaming platforms. lutris.net


    ## DATA TRANSFER


    ### curl 7.60.0

    Ferry files across the network with ease - de-facto


    curl is one of command-line tools that should be in the toolbox of all Linux users.
    The versatile utility is powered by libcurl and supports a large number of protocols
    including HTTP, FTP, HTTPS, SCP, SFTP, LDAP, Gopher, IMAP, POP3 and a command-line
    data transfer tool; you can use it to download any files from the internet by
    specifying a URL. It can also download website entities or write data to a website.
    Many of its useful features include the ability to retry failed downloads, bandwidth
    throttling, HTTP redirects and more.


    You can use curl to upload files as well. For example, the command `curl -u [user:password]`


    ```bash

    upload.txt -T ftp://example.com connects to an FTP server and uploads the specified
    file; curl has an extensive list of options that offer all kinds of flexibility
    for downloads; the command curl -z 16-May-2018 [download-location] only downloads
    files that have been modified by the server script.

    ```


    Beyond transfers you can also use curl for other purposes. You can fetch the definition
