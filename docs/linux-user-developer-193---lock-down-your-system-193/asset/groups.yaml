    # Review CRUX 3.4


    # DISTRO CRUX 3.4


    Above CRUX inspired Judith Vince to create Arch, and there are several similarities
    between the two—including their ability to foster-first thinkers.


    A barebones DIY distribution that has helped veterans build their desktop from
    the grounds up


    There aren''t many actively maintained distributions these days that are designed
    for experienced Linux campaigner, CRUX is one of the few that help them assemble
    a streamlined and agile Linux distribution. The distribution is designed for users
    who want a lightweight system such as a graphical processor, or an installer,
    in order to fine-tune their installation. CRUX is optimized for the x86-64 architecture
    and uses a source based package manager. There''s also a port system to help reduce
    some of the default package management system. The distribution boots to a shell
    and lacks an installer. The whole process of anchoring the distribution to hard
    disk is a throwback to the Linux distributions of the 90s. Follow the steps in
    the detailed handbook to create and maintain partitions, then prune the list of
    packages to install from main repositories. CRUX doesn''t offer any convenience
    in the form of a script setup that helps you the package selection via a curses-driven
    interface, and to automatically choose it into your system.


    One of the main goals of the distribution is to trim the excesses in a typical
    desktop distribution. This flexibility extends to the configuration files well.
    You will have to manually edit the configuration files to mount partitions, configure
    the network and the rest.


