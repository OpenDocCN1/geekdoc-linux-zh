- md: "\n# REVIEWED! OPENSUSE LEAP 15\n\n# LinuxUser\n\nTHE ESSENTIAL MAGAZINE FOR\
    \ THE GNU GENERATION & Developer™\n\n# INFOSEC SPECIAL\n\n# LOCK DOWN SYSTEM -\n\
    > Pen-test your PC > Confine your programs > Secure your network\n\n# INTERVIEW\n\
    \nKubeflow Toolkit: Fire up scalable Machine Learning in five minutes\n\n# FRESH\
    \ MINT 19\n\nThe story behind the biggest release of 2018\n\n# SPECIAL REPORT\n\
    \nUBports: Ubuntu Touch lives on!\n\nThe latest from the team keeping the mobile\
    \ OS alive\n\n# CRUX Linux 3.4\n\nTested the lightest Linux distro for experienced\
    \ users\n\n# Media streamers\n\nWatch your media collection on all platforms and\
    \ devices\n\n# 44 PAGES OF TUTORIALS\n\n- Power tools for Git\n- Compilers uncovered\n\
    - Secure Wordpress\n- Be a Bluetooth Pi pro\n\n# ALSO INSIDE\n\n- Kernel news\n\
    - Sense HAT: Menu builder\n\n# TIME TO STEP OFF / THAT TREADMILL\n\nWith so many\
    \ demands from work, home and family, there never seem to be enough hours in the\
    \ day for you. Why not press pause once in a while, curl up with your favourite\
    \ magazine and put a little oasis of 'you' in your day.\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_1_0.png)\n\
    \nPRESS PAUSE / ENJOY A MAGAZINE MOMENT\n\nTo find out more about Press Pause,\
    \ visit: pauseyourday.co.uk\n\n# LinuxUser & Developer\n\nTHE MAGAZINE FOR THE\
    \ GNU GENERATION\n\nFuture PLC Quincy House, The Ambury, BA1 1UA\n\n# Welcome\n\
    \n# Editorial\n\nEditor Chris Thorne\nchris.thorne@linuxuser.com\n01302 46224\n\
    \nDesigner Ian Webber\nProduction Editor Ed Richards\nEditor A Chat, Tom Graham\n\
    Senior Artist Jo Webber\n\nto issue 193 of Linux User & Developer\n\n# in this\
    \ issue\n\nContributors\nJim Sherfield, Christian Taylor, John Jones,\nToni Castillo\
    \ Garza, Jon Masters, Paul O'Brian, Tam Hannah,\nMark Marshall, David Glyn,\n\
    Shashank Sharma\n\n- Lock Down your System, p18\n- Set up Zilla for your Business,\
    \ p54\n- What's New in Linux Mint 19, p62\n\nAll copyrights and trademarks are\
    \ acknowledged and respected\nLinux is the registered trademark of LinuxUser in\
    \ the UK and other countries.\n\nAdvertising\nMedia rates are available on request\n\
    Commercial Director Claire Dove\nAdvertising Richard Nicholls\nAdvertising Director\
    \ Richard Nicholls\nAccount Director Andrew Tilly\n017025 66111\n\nWelcome to\
    \ the UK and North America's favourite Linux and open source magazine. It's been\
    \ another frantic month as it announced GitHub, the central repository for most\
    \ open source projects, for $7billion (see p6). It's easy to say how much Linux\
    \ grew, but it's the clearest indication of the ideological divide in the open\
    \ source community continues its open source charm offence. We've spoken to a\
    \ number of influential figures and some feel an independent 'GitHub Foundation'\
    \ is in order.\n\nInternational\nLinux User is available for licensing. Contact\
    \ the\nInternational department to discuss partnership opportunities \ninquiries\
    \ with Neil Ed Ellis\n\nIn this issue, we've focused on security, with a guide\
    \ to lock down your system (p18) and a guide to WordPress hardening. We also caught\
    \ up with Clem from Linux Mint (p62), an update on Ubuntu by UBports (p32) and\
    \ chatted with David Jones' Android about kubefetch (p12). Enjoy!\n\nSubscription\n\
    Email us contact@linuxuser.com.uk\nTo order copies at £9.99 call 01302 462236\n\
    Order online or line at subscriptions@linuxuser.com.uk\nTo cancel here Sharon\
    \ Thompson\n\n# Get in touch with the team:\n\nHeadlines\nHead of News Matt\n\n\
    Head of Production U S UK Mark Constance\nProduction Manager Martin Wood\nAdvertising\
    \ Manager Jamie Creaser\nProduction Manager Nicole Keasey\n\n# Management\n\n\
    Managing Director Aaron Assad\nEditor Director Ian Wood\nHead of Design Rodney\
    \ Redway\nCommunication Director Jonathan Hill\n\nlinux@linuxuser.com\n\n# Printed\n\
    \nPrinted by Waterfield Publishing, Stony's Road,\nnborough, Peterborough, PE1\
    \ 6JE\n\n# Marketplace\n\nFuture PLC is a publisher of magazines, software\nand\
    \ hardware and merchandise. In this issue we\nhave a range of software deals,\
    \ hardware offers\nand plenty of merchandise. We also have\nhills of free content\
    \ for which we hold for\nFSC (Future Services) certification and accreditation\n\
    \n![](img/589a2610a2e4642c43669f03fe22f7ff_2_0.png)\n\nTwitter: @linuxusermag\n\
    \nFacebook: facebook.com/LinuxUserUK\n\nfilesieop.com\n\n# SUBSCRIPTION OFFER\n\
    \n# Subscribe and receive a Free Jack Bluetooth speaker!\n\nMORE DETAILS ON PAGE\
    \ 30\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_2_1.png)\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_2_2.png)\n\
    \n![](img/589a2610a2e4642c43669f03fe22f7ff_2_3.png)\n\n# FUTURE\n\n# Connectors\n\
    \n# Creators\n\n# Editors\n\n# Makers\n\nFuture PLC is a publisher of magazines,\
    \ software\nand hardware and merchandise.\nLondon Stock Exchange\nwww.futureplc.com\n\
    \nChief executive Zebed Smyth-Thorne\nFinancial officer penny Leithin-Brand\n\
    tel: 01302 462250\n\nwww.linuxuser.com\n\n# Contents\n\n18\n# LOCK DOWN\n-YOUR\
    \ SYSTEM\n\n54\n# ZULIP\nFOR START-UPS\n\n62\n# WHAT'S NEW IN\nMINT 19\n\n# OpenSource\n\
    \n# Features\n\n# Tutorials\n\n+ 06 News\nMicrosoft acquires GitHub, many hissy\
    \ fits ensure while others celebrate\n\n+ 18 Lock Down your System\nTake a proactive\
    \ approach to computer security and learn how to protect your devices against\
    \ any kind of threat. We explain how to create a setup script, configure binaries\
    \ and police your network\n\n+ 36 Essential Linux: Git\nIn part three of our series\
    \ on mastering Git, learn some exciting and powerful tools to speed and improve\
    \ your version-control workflow\n\n+ 10 Letters\nWhat's on your mind, readers?\n\
    \n+ 54 Zulip for Start-ups\nGet grips with the free, open source software and\
    \ find out how to harness its best features for your organisation\n\n+ 40 Wordpress\
    \ hardening\nWordPress is ubiquitous on the web, but also makes vulnerable to\
    \ attacks – find out how to secure your own installation\n\n+ 12 Interview\nWe\
    \ talk to Google about its plans for the just-released Kubeflow\n\n+ 62 What's\
    \ new in Linux Mint 19?\nMint has been a favourite distro for switching between\
    \ other OSes. We chat with founder Clément Lefebvre about the latest release based\
    \ on community feedback\n\n+ 44 Computer Security: Metploit\nEmulate vulnerabilities\
    \ by writing code and using Metploit on them\n\n+ 16 Kernel Column\nAnother update,\
    \ another explorer\n\n+ 48 Programming: Haskell\nDiscover how to interact with\
    \ the 'core' languages with which compilers operate\n\n# SpecialReport\n\n+ 32\
    \ UBports\nUbuntu Touch isn't dead – we chat with the team behind its revival\n\
    \nLinux & Developer\nIssue 193\nJuly 2018\nfacebook.com/LinuxUser\nTwitter: @linuxusermag\n\
    \n# Practical Pi\n\n+ 68 Retro Pi\nDan Aldred decided to add modern smartphone\
    \ features to a rotary dial phone by incorporating a Pi - it wasn't as simple\
    \ as he first thought\n\n+ 70 Create a physical menu\nThe Raspberry Pi Sense HAT\
    \ is a versatile beast - why not use it to create an LED-based menu system with\
    \ Python code and its inputs? We explain how\n\n+ 74 Bluetooth with Python\nSometimes\
    \ you'll want a Pi to communicate with other devices via Bluetooth rather than\
    \ wires or Wi-Fi - it's pretty easy to do, with the help of some Python\n\n# Reviews\n\
    \n+ 79 Group test: Media streaming servers\nEmby, Gerbera, Kodi and Universal\
    \ Media all promise hassle-free streaming, which delivers\n\n+ 84 Hardware\nThe\
    \ Netgear ReadyNAS422 and Philips BD350 monitor put to the test\n\n+ 86 openSUSE\
    \ Leap 15\nA distro for professionals\n\n+ 88 CRUX 3\nA bare-bones DIY distribution\n\
    \n+ 90 Fresh FOSS\nlinux 4.16, kernel 7.6.0, GNU nano 2.3.7 and Nikola 7.15 reviewed\n\
    \n# Back page\n\n+ 96 Update Me or Die!\nAnother intriguing story from sci-fi\
    \ author Stephen Owen\n\nSUBSCRIBE TODAY\nGet a free Bluetooth speaker when you\
    \ subscribe!\nTurn to page 30 for more information\n\n# OpenSource\n06 News &\
    \ Opinion | 10 Letters | 12 Interview | 16 Kernel WoW\n\n# Microsoft acquires\
    \ GitHub, leaving devs concerned for its future\n\nNat Friedman is new CEO, while\
    \ Microsoft’s CEO, Satya Nadella, assures GitHub will “remain an open platform”\n\
    \nTech giant Microsoft has acquired a $7.5 billion buyout of GitHub, resulting\
    \ in a change at the top of the world’s leading software development platform.\
    \ Currently hosting over 7 million developers and over 80 million repositories,\
    \ GitHub hosts code alongside millions of smaller projects. From Kodi-plugins,\
    \ code can be found on GitHub, where most code is hosted with open source licences.\n\
    \n## This will GitHub to expand into new territories without relying on ourselves\n\
    \nThe long-planned debut from GitHub will be mixed with the arrival of Microsoft’s\
    \ Chris West. Nat Friedman, although will be welcomed by Microsoft working closely\
    \ with Nat and the team. Traditionally, Microsoft’s relations with GitHub were\
    \ somewhat cordial, but under the stewardship of CEO Satya Nadella, this has changed.\
    \ In march 2017 he has contributed to open source projects and many of its most\
    \ important developers are open source.\n\nIn a statement, Microsoft identified\
    \ three clear opportunities: “empower developers at every stage of the development\
    \ lifecycle”, accelerate innovation and bring developers tools and services to\
    \ new audiences.\n\nGitHub is valued at $7.2 billion valuation, it is currently\
    \ making $200 million in annual revenue (up from $140 in 2016), earning $66 million\
    \ from a paid service for keeping code private and charging for Enterprise, which\
    \ offers new workspaces and tools.\n"
