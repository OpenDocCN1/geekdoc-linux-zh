    # Meltdown 漏洞强制 Kubuntu 放弃 32 位


    # 剩余用户应尽快获取 18.04 LTS


    **这是过去几年一直困扰 Linux 的一个趋势：弃用 32 位磁盘镜像。** Ubuntu 是首批放弃这些适用于旧版硬件的镜像的系统之一，其 Ubuntu
    变体系列也相随其后。


    现在，Kubuntu 宣布它将加入这列单行不返的 64 位列车。通过 Kubuntu 开发者邮件列表的一封邮件，Valor Zermann 透露，Kubuntu
    开发者打算停止支持 32 位用户。虽然给出了几个原因，但 Canonical 的 Bryan Quigley 在随附注释中给出的最具说服力的理由是：“运行
    i86 的机器能够运行 amid。Ubuntu 容易受到关键漏洞的影响，而如果它们运行在 amd 上，就不会受到影响。”尽管许多用户在使用 32 位系统，但统计数据表明，大多数硬件将运行
    64 位操作系统。


    这意味着虽然为 18.04 LTS 提供了 32 位的 Kubuntu 版本，但这将是最后一个版本。等时间到来时，对于任何希望在 32 位硬件上安装并使用
    Kubuntu 的用户，请利用这三年的 LTS 交付支持期。


    ![](img/589a2610a2e4642c43669f03fe22f7ff_6_0.png)


