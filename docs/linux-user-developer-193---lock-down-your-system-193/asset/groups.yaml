    多亏了 SELinux，运行在 Apache 守护进程中，Apache 不被允许打开新的连接。


    当然，默认策略允许任何进程运行任何列出的文件（如 "bin"），在 SELinux Enforcing 模式下，仍然可以执行那些老式的劣手段，例如通过 http://your_ip/php?cmd=cat
    /etc/password -


    ## SELinux 策略


    | 请求操作 | 主体（例如进程） | SELinux 安全服务器 | 权限是否授予？ | 对象（例如文件） |

    | :--- | :--- | :--- | :--- | :--- |

    | AVC: 拒绝 (Denied) | | | 是/否 | |


    上方是 SELinux 决策过程图，它图化起来比实现起来容易。


    ### + 快速指南


    ### ### SELinux 模块框架 (LSM)


    SELinux 模块是一个内核框架，它为新的内核扩展挂挂钩安全检查提供了一种机制。SELinux 是灵活的。AppArmor (https://wiki.ubuntu/AppArmor)
    类似于处理文件操作，但 SELinux 更灵活并能处理进程。


    它为所有已加载的进程创建一个基准，一旦被允许，除非 - 否则会根据进程行为根据之前定义的基准来拒绝进程。它不像像 TOMOYO 的 yama (https://github.com/lyudaj/yama)
    那样对实践函数进行细粒度控制以防止恶意文件执行，并允许进程从中提取敏感信息，因为它是安全的 https://schauler-ca.com/home 是为了简单性而开发的。


    ```bash

    # 列出 SELinux 模块

    semodule -l

    # 加载模块

    semodule -i mymodule.ko

    # 模块

    semodule -r mymodule

    # 检查状态

    semodule -status

    ```


    ```bash

    # 列出 SELinux 策略

    sepolicy -l

    # 列出 SELinux 布尔值

    getsebool -a

    # 设置布尔值

    setsebool -P <boolean> on

    # 检查布尔值

    getsebool <boolean>

    ```


    ## 4 微调策略定义


    策略的某些方面可以通过 SELinux 模块更改。例如，Apache 默认无法打开连接。如果你想更改规则，使用：`httpd_network_connect
    1`。使用 `getbool -` 获取整个元组列表。


    ## 5 完成策略需要


    当 SELinux 处于强制模式时，你的某些二进制文件可能会正常工作。如果你认为允许特定的二进制文件访问被拒绝的资源，使用 `audit2 -l` 创建安全模块并安装启用。


    ## 6 重新编译整个策略


    当默认策略和表不够用时，你可以安装策略源 (source-selinux-policy-src)，进行更改并重新构建策略以更新文件系统。为了避免这种情况，使用
    `setbool` 和自定义策略。


    SELinux 已移植到大多数 GNU/Linux 框架。在基于 Debian 的系统上，运行 `apt-get install selinux-policy-default
    auditd-selinux-utils`。这将 grub 添加 security-selinux 选项。重启电脑。


    正常使用系统。当 SELinux 处于允许模式时，任何违反策略的行为将被记录在 /var/log/audit.log。检查日志查看了哪些决策。如果你的权限被拒绝，运行
    `audit2allow -a`。


    SELinux 仅在允许模式下允许你拒绝。要实际应用这些更改，请将 SELinux 配置为强制模式。如果你想在 /etc/selinux/config 文件中更改，则必须在下次启动时强制策略。


    ## 寻找我们区域的漏洞


    Kali 自带了一系列安全评估工具。Burp 是一个微调你的发现和分析的好工具。


    '
