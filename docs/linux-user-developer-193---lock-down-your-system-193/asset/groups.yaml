    # 开源你的 Linux 新闻与观点


    # 观点


    ## 内核专栏


    Jon Masters 像往常一样，为我们带来了 Linux 社区的最新动态。


    Linus Torvalds 发布了 Linux 4.17，并指出：“我没有把它称为 5.0，即使没有考虑到遥远的未来。随着 4.17 的发布，所有的 git
    对象计数数字学都达到了那个位置。”这指的是自 4.0 版本以来的变化介于 3.0 和 4.0 之间。他说：“它将在未来发生。4.17 开启了即将公布的 Linux
    消息的信箱。”


    **Jon Masters** 是一位从事 Linux 相关工作超过 22 年的黑客，他在 13 岁时就从大学毕业。Jon 居住在剑桥，在一家大型企业 Linux
    供应商工作。他正在驱动用于能效 ARM 设备的系统创建。


    4.18 中的新功能包括支持在 32 位 ARM 系统上扩展的物理 V1 和 V2 缓解措施，以及一个新的 `v056` 内核参数，用于禁用 x86 系统上的新的
    5 级分页（扩展物理和虚拟地址）。对 FUSE 支持的添加对于包含 Linux 环境的用户特别有帮助——许多服务器发行版使用 FUSE 文件系统挂载到容器内。


    4.18 中，未特权多进程将允许仅挂载一种复杂的 FUSE（用户空间文件系统）文件系统，作为原型新系统的手段；例如，在这个时代我们也很怀念内核驱动程序。今天，有
    LKL Linux 内核库，它允许 Linux 驱动程序在用户空间中使用，所有的 Linux 文件系统都可以被任何需要挂载的非特权容器利用。这并不罕见，但它确实存在。


    在内核加载中，延迟最近变得显而易见，因为 CPU 必须获取数据——等待——加载，这些加载所需的时间与数百或数千次其他 CPU 操作相同。各种技巧虽然快速但规模很小，因此内核可能会使用最近的数据，但迟晚我们都会因等待内存而失去宝贵的周期。


    现代微处理器具有“乱序执行”（OoO）特性，该技术最初由 IBM 的 Robert Bobat 为 1997 年大型机模型 91 浮点单元发明，并由处理器（或编译器）在优化的地方乱序执行指令。由于微处理器相对于附件内存延迟较低，它们花费了大量时间等待加载完成。加载延迟可以通过推测执行来克服，这是
    CPU 架构中对变量更新的术语。


    ## 预测性缓冲区绕过


    本月发现了另一个影响许多高性能处理器的安全漏洞。最新问题影响一个被称为预测性缓冲区绕过（speculative buffer bypass）的子系统，成功的利用将允许运行在相同权限级别的恶意代码从内核中导出敏感数据，例如身份识别信息、密码以及加载到内核的敏感内核。


    这种级别可以欺骗运行时环境读取它正常不应该访问的数据。这可能允许运行在浏览器中的恶意 JavaScript 代码从内核中导出敏感数据，例如身份识别信息、密码和加载内容。


    ## 乱序执行


    高性能指令序机器流水线中的瓶颈之一是处理与存储操作冲突的加载。当程序对内存执行存储操作时，它会进入存储缓冲区以便稍后写入内存。随后的加载必须检查此存储缓冲区以从内存中获取正确值，这更具挑战性，因为加载的地址和


    OoO 机器的内部机制非常壮观。它们包括诸如寄存器重命名之类的概念，这规过了传统的 GPR（通用寄存器）限制，例如寄存器。这些寄存器跟踪数据依赖关系，每条指令在就绪时就会分发。通过这种方式，顺序执行的任务由“前端”分发到“后端”，程序按顺序“退役”（retired），这样两者都无法看出区别。


    OoO 扩展了这一概念，允许定义窗口内的任何指令执行，只要依赖指令（已“就绪”）。这些窗口非常大——笔记本电脑上大约有 192 条指令。


    ## 锁定你的系统


    Toni Castillo Girona 向你展示如何采取主动方法保护计算机安全并保护你的设备


    ## 快速概览


    - **Kali Linux 安全设置 p20**: 在加密的 USB 闪盘上安装 Kali Linux，以便随地测试你的系统。

    - **限制你的二进制文件 p24**: 学习如何使用 SELinux 限制不可信的用户和进程。

    - **保护你的网络 p22**: 击意外连接并控制你的出站数据包。

    - **对系统进行渗透测试 p26**: 通过定期对系统进行渗透测试，找出你的系统是否足够安全。


    钓鱼、加密货币挖矿恶意软件、僵尸网络、病毒、敏感数据泄露……在一个危险的互联的世界中，一个非常危险的世界。旧的规范不再适用；是时候与坏人作斗了，我们现在不仅是在讨论电脑和笔记本电脑，还有你的冰箱、手机以及每一台精先进的咖啡机。我们的生态系统随时可能被破解，我们的数字生活和现实生活（由于不断涌出的
    IoT 设备现在已交织在一起）可能会被廉价出售，仅运行在桌面上的杀病毒软件已经不够了。你需要采取更主动的安全方法，并开始攻击自己的系统和设备以寻找弱点，并确保在太晚之前修补了安全漏洞，防止网络罪分子进入你的系统。


