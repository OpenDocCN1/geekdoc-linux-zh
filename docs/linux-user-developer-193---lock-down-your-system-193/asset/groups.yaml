    # Drop brute-force attacks


    When you are attacking a network service one of the most common attack you would
    undoubtedly encounter is brute-force. As Hydra can brute-force a variety of login
    services such as SSH, HTTP POST-based, IMAP, and so on. Although there is software
    to prevent these attacks, some prefer dropping these packets as they arrive. Let
    us imagine you drop packets by adding the following two rules to your firewall:


    ```

    iptables -A INPUT -p tcp --dport 2222 -j DROP

    iptables -A INPUT -m state --state NEW -j ACCEPT

    ```


    ```

    iptables -A INPUT -p tcp --dport 2222 -m state --state NEW --hitcount 4 --seconds
    20 -j DROP

    ```


