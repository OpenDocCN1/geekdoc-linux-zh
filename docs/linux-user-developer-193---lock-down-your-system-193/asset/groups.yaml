    # 回顾 CRUX 3.4


    # 发行版 CRUX 3.4


    上述 CRUX 启发了 Judith Vince 创建 Arch，两者之间有许多相似之处——包括培养“思考优先”学习者的能力。


    一个极简的 DIY 发行版，帮助老手们从零开始构建自己的桌面。


    如今，并没有多少为经验丰富的 Linux 玩家设计的、活跃维护的发行版，CRUX 是少数能帮助他们组装精简且敏捷的 Linux 发行版之一。该发行版专为想要轻量级系统（例如图形处理器或安装程序）以便精调安装的用户设计。CRUX
    为 x86-64 架构进行了优化，并使用基于源码的包管理器。还有一个端口系统来帮助减少某些默认包管理系统。该发行版启动后进入 shell，缺少安装程序。将发行版固定到硬盘的整个过程是对
    90 年代 Linux 发行版的追溯。请按照详细手册中的步骤创建并维护分区，然后剪减从主仓库要安装的包列表。CRUX 没有提供任何脚本设置形式的便利性来通过
    curses 驱动界面帮助你选择软件包并自动将其选择到你的系统中。


    该发行版的主要目标之一是剔典型桌面发行版中的冗余。这种灵活性也延伸到了配置文件。你必须手动编辑配置文件来挂载分区、配置网络等。


    ### 规格

    - CPU: x86-64 或更新处理器

    - 图形: 取决于你安装的桌面

    - 内存: 512MB

    - 存储: 1GB

    - 许可证: GPL 下的构建脚本

    - 获取地址: https://crux.nu


