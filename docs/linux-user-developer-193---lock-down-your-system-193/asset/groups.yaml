    # 固固 WordPress


    ## WordPress：在你的安装上使用加固技术


    采取一些额外措施来增强你的 WordPress 安装的安全性


    大约有 25% 的网页是用 WordPress 创建的，这使其成为黑客攻击的主要目标之一。


    由于许多公司选择使用它，它被用于互联网上的各种服务。但 WordPress 提供的基础安全措施还够够的，因此我们需要使用一些第三方工具，并检查各种插件或组件的设置，以及数据库本身的配置。


    WordPress 的设计是其最大的优点之一，它周围有一个庞大的社区，这有助于了它的成长。WordPress 使用 PHP 作为主编程语言，并使用 MySQL
    和 Apache 等非常流行的服务作为服务器。它的简单性是一个关键，但它通过插件甚至图形（模板）具有定制的潜力，且所有都遵循 GPL 许可。这些组件也受到缺乏安全性的影响，可能包含从恶意软件到攻击的任何内容。


    ## 常见威胁


    由于几个可能导致攻击的因素，使用 WordPress 创建的网站安全性一直处于风险之中。攻击类型从简单的钓鱼到复杂的 SQL 注入不等。对漏洞的利用可能是由服务器不安全引起的。但这些并不是我们面临的唯一问题。最常见的问题存在于代码本身；包括来自编写不当的主题和安装的第三方插件的源代码。


    加固你的 WordPress 网站的第一步是正确配置所有设置——这意味着创建密码以避免任何暴力破解攻击。密码至少应有八个字符，并包含数字、符号和大写字母。WordPress
    中的认证是需要记住的重中之重，因为它决定了用户是否合法以及是否有权限访问系统中的资源。


    窃取凭据可以通过多种方式实现。例如，可能通过电子邮件的钓鱼攻击获取凭据。这种攻击可能会感染目标任何类型的恶意软件——例如木马——但最常见的攻击与插件以及其代码内部漏洞的利用有关。


    使用密码访问 WordPress，即使这不能保证用户是合法的，也可能密码被盗，因此有必要使用双因素身份验证来确保账户不会丢失。这是通过插件实现的，这些插件允许用户使用第二个认证通道。实现这一点的有许多方法，但随着安全插件的激增，这些是最容易使用的。


    ## 保护你的 WordPress 网站


    WordPress 使用插件，但它也是安全考量之一。一个通用规则是，在你使用的任何插件中，系统都应该从安全的仓库下载，并根据维护策略能够更新这些组件。有很多插件允许我们扫描并检测它们的问题。例如，Wordfence
    (wordpress.com) 和 Sucuri (sucuri.net/) 是最流行的，包含一个防火墙插件和实时流量分析器。这两个插件都有免费版和商业版。


    另一个为了增加安全性而要安装的有趣功能是限制登录尝试的控制。默认情况下，WordPress 并没有实现此功能，因此我们需要下载第三方插件，如 Limit Attempts
    或 Login Lockdown。


    当实现 WordPress 的 2FA（双因素身份验证）时，一个实用的解决方案是 Wordfence (https://it.ly/catch)，它通过已安装的插件提供
    2FA，该插件在认证过程中激活，正如其名所示，它是一个额外的层，即使用户拥有正确的凭据和密码，也可以阻止或允许访问。解析过程对于识别令牌（tokens）非常有用。在钓鱼攻击的情况下，WordPress
    首先检查此查询是否有效，以检查锁的状态。如果锁处于“关闭”状态，WordPress 将拒绝访问并生成通知以提醒用户潜在的钓鱼尝试。在锁打开的情况下，WordPress
    将像往常一样，允许用户访问 WordPress 的内部区域。管理员可以控制所有与安全相关的属性。


    ## 加固 WordPress 服务器


    安装 WordPress 的服务器是另一个必须保护的实例。每个 WordPress 实例都应该经过加固，例如更改文件权限和数据库，删除安装文件或根据需要安装安全插件。但由于某些原因，你不想费心插件，你可以使用一个名为
    Hardening 的工具。WordPress 加固是使用一种安全框架，允许我们从操作系统的角度将 WordPress 隔离。在 Linux 中，只需输入以下命令：


    ```bash

    $ git clone https://github.com/hardcraft/wordpress

    ```


    现在，例如，如果想检查 WordPress 安装所在的文件夹权限，可以运行以下命令：


    ```bash

    $ /hardening.py -d /home/username/ --chmod

    ```


    所有命令都可以在一行中执行，如下：


    ```bash

    $ /hardening.py -d /home/username/ --c -b -f -t --config --delete-version --plugins
    --indexes=wordpress.log

    ```


    ## 保护数据库


    通过保护与数据库的连接可以阻止 SQL 注入和网络攻击。WordPress 为所有用户提供单一连接。在其他情况下，用户是否是 root 无关——所有请求都使用相同的密码。我们必须区分用户和数据库以便拥有多个用户，但所有用户将使用相同的数据库连接。这是处理已登录用户流量的一个大安全特性。


    解决此问题的最佳方法是使用 SSL 对此单一数据库连接进行通信，MySQL 版本必须兼容 SSL。你可以通过跟踪 MySQL 控制台连接来实现，如下：


    | 有用的命令 | 说明 |

    | :--- | :--- |

    | --remove | 删除安装文件 |

    | --robots | 网页爬虫的指纹识别 |

    | --config | 使用最高安全特性修复 |

    | --indexes | 阻止 WordPress 损坏 |


    一旦检查了 SSL 兼容性，下一步是：


    ```bash

    openssl req -new -x509 -rsa:2048 -days 365 -keyout key.pem -out cert.pem

    ```


    ## 教程：加固 WordPress


    为了实现此目标，我们需要在 wp-config.php 和 load.php 中处理 WordPress。第一步是不在 wp-config.php 中包含不安全的主题。第二步是可以在
    load.php 中名为 DB_USER。我们需要在 WordPress 中使用以下代码：


    ```php

    // SQL/

    define(''MYSQL_CLIENT_FLAGS'', ''555'');

    define(''DB_HOST'', ''192.168.1.100'');


    /** 在创建数据库时使用图表 */

    define(''DB_CHARSET'', ''utf8'');

    ```


    理想的方法是每个用户拥有自己的连接，然后使用以下命令：


    ```sql

    CREATE USER ''wp_user''@''%'' IDENTIFIED BY ''pass'';

    GRANT SELECT ON wordpress.* TO ''wp_user''@''%'';

    FLUSH PRIVILEGES;

    ```


