    ## Zulip for Start-ups


    You can install Zulip on a freshly 64-bit Ubuntu 16.04 server. While theoretically
    it should work with any flavour of Linux as long as it satisfies the server''s
    software dependencies, Ubuntu Xen is the only officially supported distribution.
    In addition, development is easiest for Zulip and not providing any other network
    services.


    Make sure you set one up before you''ll need to supply your credentials while
    installing the server. Zulip developers recommend using the transactional email
    service such as SendGrid, Mailgun, or Amazon SES which are cheaper and more reliable
    than rather setting up your own SMTP server from scratch.


    In terms of physical requirements, this machine needs a 64-bit OS with at least
    2GB of RAM and 20GB of disk space to serve up to 100 users. If you have more than
    that, make sure you have +4GB of RAM and a dual-core system. The disk space depends
    on the size of the files you will upload; if users share large files it''s prudent
    to have a larger minimum.


    You''ll also have to ensure the server allows traffic over port 443 to accept
    HTTPS connections. If you use port 80 instead, you''ll need to redirect users
    to the HTTPS server. For sending emails, you''ll have to make sure the Zulip server
    has outgoing access to your mail server via the SMTP port 587.


    Before starting, installation also requires you to have a fully qualified domain
    name for your Zulip server - like chat.example.com. You will need a SSL certificate;
    the installation process will automatically fetch one from Let''s Encrypt using
    the certbot tool. Zulip needs a fully configured server for email invitations,
    notifications and other things.


    ## Install Zulip


    To install Zulip on the Ubuntu server and use sudo to switch to the root user.
    Go to http://www.zulip.org/releases/ and download the latest version (Note: the
    version we use is also on the connective list) in a temporary directory using
    the following commands:


    ```bash

    $ cd /tmp

    # wget https://www.zulip.org/dist/releases/zulip-server-1.8.1.tar.gz

    # tar xf zulip-server-1.8.1.tar.gz

    # cd zulip-server*

    ```


    ## Send and receive messages


    Click the ''New topic'' button located at the bottom. The stream you join has
    space to enter a topic. Topics are like the subjects of an email, so you can better
    organise messages within a stream.


    You can get the attention of particular users, rather than the whole stream, by
    typing the @ followed by the first few characters of their username and letting
    Zulip complete it for you.


    To send messages directly to one or more users instead of the stream, click the
    ''New message'' button at the bottom of the chat interface. Use Zulip''s autocomplete
    feature to find names of users you want to address.


    Rather than using certificates from Let''s Encrypt, Zulip can work with self-signed
    certificates. While it handles SSL for the server, it requires a fully qualified
    domain name before it will let you in, so this may not be the most common option.
    Make sure to visit the Organization Settings on a fresh Zulip installation to
    review or edit the settings for your requirements.


    Secondly, Zulip can be configured for email notifications. Because of Gmail''s
    anti-spam measures, you can hook up a Gmail account to your Zulip server after
    making some changes to the settings. Scroll down to toggle ''Allow less secure
    apps'' from Off to On. Below:


    From the extracted directory you can run the installation script in the following:


    ```bash

    # ./scripts/setup/install \

    --cert=email-admin@example.com \

    --hostname=chat.example.com

    ```


    In addition, we''ve used the --cert option to install SSL certificates for the
    server. The email of the server''s administrator will be listed in every email
    sent out. The --hostname option sets the hostname for your Zulip server. It will
    take some time to complete and when it does, print a URL that you can use to log
    into the Zulip server.


    Once you''re done, install on a physical or even a virtual machine, since you''ve
    just installed Docker into it. Follow the instructions above to switch to the
    root user and grab the latest Zulip release. Use the following command to run
    the installer:


    ```bash

    # ./scripts/setup/install --min-site-id

    ```


    ## Keyboard commands


    You can navigate and use Zulip keyboard if you want. Find a list of shortcuts
    used at https://help.zulip.com/keyboard-shortcuts


    ## One size fits all


    Although you might have a long list of requirements, Zulip is simple enough to
    allow you to work around them. This is especially for creating a test deployment,
    and can be used within the local network.


    | | |

    |---|---|

    | 4 Format messages | Zulip formats messages using GitHub Flavored Markdown. The
    ''A'' icon indicates the messaging box to reveal the formatting. To hide, use
    the eye icon to preview the message. |

    | 5 Video calls | To initiate a video call with all users, compose a message as
    normally. Then click the camera icon to join the video call. |

    | 6 Reply to messages | Browse the stream and click the message you want to reply
    to. This opens the Message box with all details about the stream and topic. Simply
    type your reply


    When executed on a production server, the install script also initialises the
    Zulip Database. We used the --no-init-db option to prevent it from doing so, to
    enable us to customise settings that will influence the installation. No matter
    what command line options you, the install script always does to fetch the latest
    releases. It''ll also configure third-party services by including the Postgres
    database, the caching system Memcached and


    + QUICK TIP

    Moving from Slack

    Slack exports data in compressed files that can be imported into Zulip with just
    a couple of minutes. Documented at: https://zulip.com/data-from-slack/


    Scroll down to the next section to define the settings for the SMTP server which
    enables the Zulip server to send emails. If you are using Gmail, the settings
    are:


    ```

    EMAIL_HOST = ''smtp.gmail.com''

    EMAIL_USER = ''yourhi@gmail.com''

    ```


    You''ll also have to provide the password of the main Gmail account to enable
    it to send emails. The password is found in /etc/zulip/zulip_settings.conf. In
    a text editor, scroll to and enter the following:


    ```

    email_password = your-account-password

    ```


    The script also creates the zulip user, which creates various Zulip components
    you need to run. It also creates the configuration directories where it places
    all your code. When it finishes, the installer moves the Zulip code from where
    it was (inside a temporary directory) to the appropriate path and creates a symbolic
    link to /home/zulip/deployments/


    Replace the values in the main settings file to match those of your installation.
    Now set to initialise the database. First, switch to the zulip user with zulip
    and then populate the database:


    ```bash

    $ /home/zulip/deployments/current/scripts/initialize-database

    ```


    You can now generate the one-time Zulip server with the following:


    ```bash

    $ /home/zulip/deployments/current/manage.generate_realm_creation_config

    ```


    ## Before you invite other users to join, there are some aspects of the installation
    you will need to tweak


    This will display a UI, but usually this will only be accessible from other computers
    on the same network. Enter the Zulip server into a web browser to follow the configuration
    wizard to create the new organisation and you will be prompted for a user account
    that becomes the default Zulip administrator. You can use these details to log
    into your Zulip installation.


    Once the installation is complete, you need to make some changes to the settings
    file. Open the file at /etc/zulip/zulip_settings.conf and modify the EXTERNAL_HOST
    parameter to point to the IP address of your Zulip server on your local network
    (such as 192.168.0.14). Similarly point the ZULIP_DOMAIN. If you modified it,
    it should look something like this:


    ## Tweak your install


    ```bash

    root:/zulip/deployments/current/manage.generate_realm_creation_config 2018-04-30
    17:59:42

    root:/zulip/workers/event_handlers.user_events

    root:/zulip/workers/event_handlers.user_created

    root:/zulip/workers/event_handlers.email_sent

    root:/zulip/workers/event_handlers.error_report

    root:/zulip/workers/event_handlers.message_sent_notifications: started

    root:/zulip/workers/event_handlers.message_delivered

    root:/zulip/workers/event_handlers.message_sent_1

    root:/zulip/workers/event_handlers.message_sent_2

    root:/zulip/workers/event_handlers.message_sent_3

    root:/zulip/workers/event_handlers.message_sent_4

    ```


    If you haven''t already, you should configure it at /etc/zulip/settings.py. Next,
    run as the zulip user (using ''zulip'') if needed:


    ```bash

    /home/zulip/deployments/current/manage.generate_realm_creation_link

    ```


    This generates a configuration, single-use link that you can use to set up your
    Zulip server.


    Now you are at Zulip''s main interface, which you''ll explore a little further.
    Now, click and select the ''organisation'' link. This displays the administration
    box, where you can tweak various settings to influence the Zulip installation.
    In the Organisation section, you can change several details such as its name,
    description and avatar. You can get back to the main Zulip interface later, for
    instance when you''ve fleshed out

