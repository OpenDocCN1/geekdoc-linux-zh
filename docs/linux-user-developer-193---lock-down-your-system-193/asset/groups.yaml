    # Tutorial Programming: Compilers


    # Haskell: Use the language

    to learn how compilers


    # Discover how to interact with the simple ''core''

    languages that compilers operate on


    Compilers work in all of different ways,

    but there are only a few common steps that they

    go through. The first step, parsing source code

    and converts it into data structures that the compiler

    understand. The next steps - desugaring and

    typechecking - simplify these data structures and

    change them into Core language. Then it performs

    optimisations on the data for a given architecture,

    then generates machine code for the target.


    We''ll be working with a slightly modified version of the

    Core language to see how it works. We recommend you

    en an editor and copy the template ''Hello world''

    code to the file, saving it as Core.hs. As you

    dev, you can compile it with ghc Core.hs.

    Some Linux distributions require you to compile with ghc

    -dynamic, so try to avoid getting errors.

    You can find the code from this article on FileSio.


    After all these steps, we''ll look at the smallest

    data structures at the heart of the compiler, those that

    represent the program once the type and syntactic\sugar have been stripped out.
    These data structures are

    known as Core language, and are surprisingly

    simple to understand.


    The Core datatypes

    We start by specifying a type that we will represent

    as ''expression'' in the program; that is, an individual chunk

    of program that can be evaluated. The definition of the type

    is shown in Figure 2. The first line of Core as

    that we are defining a new datatype parametrised by

    type b, which will represent the type of variables


