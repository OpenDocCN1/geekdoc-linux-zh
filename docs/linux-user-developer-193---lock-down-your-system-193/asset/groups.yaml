    默认情况下，提交（commits）通过哈希值（hash codes）引用。这些代码非常长，并且很难传递。幸运的是，通过查看前几个字符就能很容易判断我们指的是哪一个哈希值。


    例如，我们正在使用的 Git 仓库提交了 207c5f0d4ef3f3958fc；我们可以通过运行 `git log` 来检查这一点。


    交互式阶段（The interactive stage）可以方便地向提交中添加多个文件。


