    ### 易用性


    Kodi 受欢迎的主要原因之一是它的易用性和直观的界面。它有一个专为传统电视设计的“10 英级”（10-foot）用户界面，可以通过电视遥控器进行导航。Kodi
    将帮助用户在首次启动时从电脑填充他们的库。


    ### 易用性


