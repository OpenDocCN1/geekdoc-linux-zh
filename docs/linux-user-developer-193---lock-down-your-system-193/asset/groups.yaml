    +   - Cons The distribution is designed for users who want to operate completely
    from the CLI.


    Summary If you''re willing to put in the time required, CRUX will give you a slim
    and tightly integrated installation that any ready-made distribution. From experience
    with source distributions, CRUX offers the most worthwhile process


