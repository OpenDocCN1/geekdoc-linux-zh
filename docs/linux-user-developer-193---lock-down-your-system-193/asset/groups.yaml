  mdcn: "\n\n# 教程\n\n## 编程：Haskell\n\n对于参数 `x`，它将读取此新环境的值。在编写了这个辅助函数后，我们可以定义 `eval`\
    \ 函数的下一种情况：\n\n- 占位值（Dummy values）\n在我们使用的某些递归定义中，我们用下划线 `_` 代替参数名。例如，`apply`\
    \ 函数的分支声明为 `apply (Literal _ _)`，这意味着我们不在乎这些参数，并且不打算在函数体中使用它们。\n\n```haskell\n\
    eval (App fun arg) =\napplyFunction (env fun) (env arg)\n```\n\n下一步是 `List` 构造函数。对于\
    \ `Lit`，lambda 始终是一个值，因此我们可以自动返回它。也不需要调用当前环境。\n\n```haskell\neval (Lam x body)\
    \ = Clo x body\n```\n\n`List` 情况稍微复杂一些。为了定义它，我们定义了两个辅助函数。图 5 中的 `matches` 是一个返回值是否匹配某个分支的函数。规则很简单：`n\
    \ == n`，并且它总是匹配 `DEFAULT` 分支。\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_51_0.png)\n\
    \n```haskell\nfibonacci = function(n) =\nswitch (n) =\n  case 0:\n    return 1;\n\
    \  case 1:\n    return n;\n  default:\n    return fibonacci(n - 1) + fibonacci(n\
    \ - 2);\n```\n\n上述斐波那契函数的实现非常简单，但它可能效率低下——为什么呢？\n\n```haskell\neval (Case expr\
    \ cases) =\neval (env get cases) (env expr)\n```\n\n为了计算第一个表达式，我们将其传递给 `getCase`\
    \ 函数以获取 `Plus` 和 `Minus` 的分支。剩下的只需定义 `evaluateAndApply` 了，这是图 6 中的两个辅助函数。\n\n\
    函数定义的主分支使用了一种不寻的 Haskell 语法“列表推导式”（list comprehension）。读取它的方法是通过收集匹配模式每个元素的求值结果来形成一个列表。\n\
    \n- 下方\n可以方便地将像 `-` 和 `+` 这样的运算符作为函数传递\n\n所以表达式过滤掉了所有不匹配的情况，然后形成所有匹配分支的列表。如果列表为空，则函数的未未定义。\n\
    \n然后定义 `eval` 函数的下一种情况就很简单直接了：\n\n```haskell\n| applyBinaryOperation :: (Literal\
    \ -> Literal -> Literal) -> Value -> Value -> Value\n| applyBinaryOperation ::\
    \ (Literal n -> Literal n) -> (Literal f m)\n| applyBinaryOperation = undefined\n\
    | evaluateAndApply :: (Ord b) -> Env -> Env -> (Literal -> Literal) -> Expr ->\
    \ Expr -> Value\n| evaluateAndApply env expr1 expr2 = Value\n| applyBinaryOperation\
    \ f (env expr1) (env expr2)\n```\n\n![](img/589a2610a2e4642c43669f03fe22f7ff_51_1.png)\n\
    \n```haskell\neval (Bool expr1 expr2) =\nevaluateAndApply env (expr expr1) (expr\
    \ expr2)\n```\n\n第一个 `evaluateAndApply` 接收像 `+` 或 `*` 这样的二元函数，它接收两个数字并返回第三个数字，以及两个值，并返回这两个数字的操作结果。在其中一个或两个值都是分支的情况下，该函数是未定义的。\n\
    \n第二个 `evaluateBinaryOperation` 是 `evaluateAndApply` 的简单封装器。它接收两个值和两个表达式，并在该环境中计算这些表达式。\n\
    \n借此，我们终于完成了 `eval` 函数，它最终看起来可能如下所示：\n\n```haskell\nprintValue :: Value -> b ->\
    \ IO =\nprintValue (Literal n) = print n\nprintValue (Cloval _) = putStrLn \"\
    Closure\"\n```\n\n现在我们已经写好了，我们应该测试一下吗？首先，让我们写一个打印值的函数：\n\n现在让我们尝试一些基础算术和函数应用。将图\
    \ 3 中的双重表达式复制到代码中，并将 `main` 函数修改为如下：\n\n## Maybe 与单态（monads）\n\n`Maybe` 是 Haskell\
    \ 创建“可选参数”的方式（参考 boost 示例；C++ 的 Boost 库中的可选）；`Maybe` 实际上是一个特殊的数据类型，带有 `Nothing`（表示不存在值）和\
    \ `Just`（表示存在值，即 `case value`）。\n\n使用 `Maybe` 来避免不安全地使用 monad。例如，`Map.lookup`\
    \ 函数返回一个包装在 `Maybe` 中的值。安全的 Haskell 真的可以利用 `Just` 和 `Nothing` 情况来处理 map。由于我们主要对本文感兴趣，我们定义了一个将\
    \ monad 元素转换为类型的函数。\n\n`Maybe` 是 Haskell 中 monad 的一个特别简单的实例。我们没有在本文中涵盖 monads，但这可以帮助你获得关于它的思路。我们展示了向函数\
    \ `z -> M` 添加内容意味着给原始函数增加了“计算副作用”（computational effects）；它具有使返回值可选的效果。在返回值前面添加\
    \ `Just` 意味着可以在执行的同时打印消息并获取输入。\n\n```haskell\nmain :: IO ()\nmain = printValue\
    \ (fmap elemMap (Double 216))\n```\n\n在这里，我们将（空环境）映射到初始环境。当我们编译并运行该程序时，它应该打印出\
    \ 21 翻倍的结果。\n\n## 评估复杂程序\n\n到目前为止，我们评估了单个表达式。计算机程序比简单表达式更自然：它是绑定序列，每个绑定接收一个表达式并给出一个名称。所以表达式过滤掉所有不匹配的情况，然后形成所有匹配情况的列表。如果列表为空，则函数的值为未定义。\n\
    \n然后定义 `eval` 函数的下一种情况就很直接了：\n\n```haskell\n| applyBinaryOperation :: (Literal\
    \ -> Literal -> Literal) -> Value -> Value -> Value\n| applyBinaryOperation ::\
    \ (Literal n -> Literal n) -> (Literal f m)\n| applyBinaryOperation = undefined\n\
    | evaluateAndApply :: (Ord b) -> Env -> Env -> (Literal -> Literal) -> Expr ->\
    \ Expr -> Value\n| evaluateAndApply env expr1 expr2 = Value\n| applyBinaryOperation\
    \ f (env expr1) (env expr2)\n```\n\n第一个 `evaluateAndApply` 接收一个像 `+` 或 `*` 这样的二元函数，它接收两个数字并返回第三个数字，以及两个值，并返回这两个数字的操作结果。在其中一个或两个值都是分支的情况下，该函数是未定义的。\n\
    \n第二个 `evaluateBinaryOperation` 是 `evaluateAndApply` 的简单封装器。它接收两个值和两个表达式，并在该环境中计算这些表达式。\n\
    \n借此，我们终于完成了 `eval` 函数，它最终看起来可能如下所示：\n\n```haskell\nprintValue :: Value -> b ->\
    \ IO =\nprintValue (Literal n) = print n\nprintValue (Cloval _) = putStrLn \"\
    Closure\"\n```\n\n"
