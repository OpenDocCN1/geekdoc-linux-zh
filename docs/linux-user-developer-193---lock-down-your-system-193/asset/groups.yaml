    unprivileged container that needs to mount. This isn''t unlikely, but it is exists
    for the month.


    In an in-kernel load, latency is recently bviously obvious because the CPU will
    have to fetch the data - wait - the loads, which take the same time as hundreds
    or thousands of thous of other CPU operations. Various tricks are fast but small,
    so the kernel might used data recently, but sooner or later we lose precious cycles
    waiting for the memory.


