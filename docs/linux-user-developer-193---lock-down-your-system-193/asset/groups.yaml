    # Old and new


    Dan wanted to use as much of the old telephone hardware as possible. He stripped
    down the wire and managed to solder the speaker from the handset to the speaker
    points on the Raspberry Pi. All sound plays through the original speaker.


    ![](img/589a2610a2e4642c43669f03fe22f7ff_68_0.png)


    # Old tweeted


    To make it possible to record and send tweets, Dan had to replace the original
    handset microphone and embed a USB microphone to the Pi within the phone case.


    # Retro touches


    Dan recreated an oldstyle look for the Pi Phone by laser-cutting a dial and etching
    it with the contemporary functions that apply to each number.


    ![](img/589a2610a2e4642c43669f03fe22f7ff_68_1.png)


    # Pi Phone functions


    +   - News Headline

    - Weather Report

    - Current Time

    - Play Music

    - Stop the Music

    - Check SMS

    - Record a voice message

    - Listen to voice message

    - Shut down the Pi


    ![](img/589a2610a2e4642c43669f03fe22f7ff_68_2.png)


    # External audio


    Dan fitted a headphone extension to the Pi Phone for connecting to an external
    speaker, to enable other people to hear the Pi Phone''s responses.


    # Listen to Lionel


    Each number carries a smart feature. For example, dialing 1 plays the news headlines.
    If you dial 4 plays Lionel Richie. Fortunately, you can stop that by dialing 5,
    and dial 6 to send a tweet. The Pi phone when it receives incoming text messages,
    which are then converted into:


    ![](img/589a2610a2e4642c43669f03fe22f7ff_68_3.png)


    ![](img/589a2610a2e4642c43669f03fe22f7ff_68_4.png)


    # Wired for sound


    Dan says that getting the rotary dial connected to the Raspberry Pi was the most
    complex part of the project, as he had to find the phone model and identify which
    of the wires used. Fortunately, he found info on web. Basically, it''s the gates
    in the top-right corner of this diagram.


    # Could do with an extension


    Fitting the Pi into the Phone was a challenge. Dan says: he needed the Pi 3 for
    the processing power and USB ports, and had to remove some of the original board
    and components to fit the Pi in. The chassis needs a small hole to house the SMS
    LED indicator.'
