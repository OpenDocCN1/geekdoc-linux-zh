    # 焦点聚焦


    ## 开发云原生 AI 应用


    机器学习可以节省数百万美元。这是大企业长期以来做出的声明。为了证明这一点，谷歌工程师大卫（David Aronovich）在关于 Kubernetes 的演讲中展示了
    Google 的数据使用效率图表。当你将机器学习附加到 Kubernetes 上时，它实现了近乎即时的节省。


    但从机器学习中获益并非易事。从零开始构建系统或与遗留系统集成是非常痛苦的。虽然托管成本较低，但最终会导致供应商锁定问题。在 Kubernetes 出现之前，它解决了许多令人头疼的问题。在
    Kubernetes 中，Vishnu Kannan 展示了如何提高易用性、运营效率和扩展性。


    ### 情感分析


    ![](img/589a2610a2e4642c4369f03fe22ff_12_0.png)

    ![](img/589a2610a2e4642c4369f03fe22ff_12_1.png)


    Kubeflow 允许用户在 Kubernetes 上进行实验。Vishnu Kannan 展示了流程如何运行。使用一个简单的朴素模型进行自然语言处理（NLP）单词分类，Kannan
    展示了训练，这花费了大约一个月。


    他使用了 Kubernetes API 以及其他工具让训练变得非常简单，因为 Kubeflow 提供了一个抽象层，无论你是否使用 Kubernetes，你都可以在任何云、自有云、甚至是本地部署这个框架，它是可移植的。


    其次，它是扩展的。Kubernetes 为你提供了一整套扩展工具，而不仅仅是扩展 CPU。当你拥有异构集群（混合了 CPU 和 GPU）时，这一点非常重要。我们希望让它可扩展，因此我们正在
    Kubernetes 之上开发许多工具，使得平台之间的任务变得简单。


    我们正在构建一个云原生、高度可移植、高度可配置的平台，遵循许多标准。到目前，我们取得了成功：在 GitHub 上有超过 3000 个 Star，70 个不同的贡献者，700
    个不同的提交。因此，我们获得了一些动力，我们对 Kubeflow 非常兴奋——它像 Kubernetes 一样解决这些问题，并让人们在其上方构建平台。


    关于 GPU 的问题，为什么 Kubernetes 对于扩展 GPU 或关注处理效率至关重要？是的，我的意思是，通常情况下人们希望有一个非常简单的设置。所以当你声明式地部署应用程序时，无论你是否使用
    Kubernetes，你都不需要考虑驱动程序或特定的 GPU 版本。Kubernetes 提供了一个抽象层，但也提供了丰富的调度构造，让我们解释一下：


    > 它是用来解决琐碎的事情


    www.linuxx.com | 13


    ## 开源新闻与观点


    谷歌的高级工程师 Vishnu Kannan 展示了在 Kubeflow 中 GPU 是什么、什么版本、有多少个可用等。调度器可以处理这些。


    但除非你通过丰富的 API 传递信息，否则总会遇到问题。在 Kubeflow 中，我们什么都不做，我们说：“Kubeflow 需要你告诉我们哪些 GPU 可用，然后我们……”是的，机器学习负载是
    Kubeflow 上增长最快的负载，因为这些负载需要忙碌且可扩展，而 Kubeflow 在块中提供了所有优秀的抽象层和隔离。


    ![](img/589a2610a2e4642c4369f03fe22ff_13_0.png)


    我们使用像 Spark 或 Pachyderm 这样的数据处理框架。我们不编写自己的，所以这些都是经过了严格的测试。这实际上是把它们结合在一起。此外，你不需要所有内容都运行在
    Kubeflow 内部。例如，如果一个大型组织管理其流水线，你有很多天在聚合某些内容并在 Kubeflow 之上运行，其中可能涉及制作检查点、存储等。


    你之前是否有任何公司表达过意向？可以谈论任何一个吗？


    我们现在不谈论它们。很快会有非常令人惊讶的大消息。完全明确，我倾向于让公司不要基于我们的东西——因为我们正在编写它。


    现在，明确的是，我们不编写自己的框架，我们使用 TensorFlow、PyTorch 或 Caffe。我们不编写自己的。


    Kubeflow 的组件可以在 Kubeflow 内部通信，也可以连接到任何端点——就像其他人开发的任何其他层的容器之类的。


    ## 快速指南


    David Archonick 让我们在机器学习的可复现性难题上取得了“突破”：Archonick 解释道，“如果你是某个行业的研究人员并发表了论文，第二位研究人员是不可能复现它的，除非你的系统设置正确。”


    所以，如果我们有一个涵盖每篇研究论文的愿景，将三个 URL：一个是用于配置环境的 Kubeflow URL，另一个是你需要下载和加载的模型 URL，还有一个是数据的链接。


    Archonick 说，该项目只解决数字一。“我们不会解决数字二和三。但我们想确保你拥有可复现性，”他补充说，他接触过所有被谷歌雇用的全球顶尖研究人员：“这太疯狂了。我简直根本无法复现它。”


    ![](img/589a2610a2e4642c4369f03fe22ff_13_1.png)


    > 上：无法复现已发布的机器学习模型对于研究人员来说是一个严重的问题


    '
