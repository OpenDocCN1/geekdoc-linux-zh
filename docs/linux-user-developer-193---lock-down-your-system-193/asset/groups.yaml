    ### A guide to controlling Bluetooth with Python


    ### We show you how to get your Raspberry Pi to talk to some other devices – without
    the wires


    One of the greatest uses of the Raspberry Pi is as a controller for other devices.
    The Raspberry Pi includes the GPIO bus, which most people use for this purpose.
    But come on, if you have a Wi-Fi hub to connect to your Pi by wires, you could
    communicate with it over your devices. This might not be possible in every case;
    your device might not have built-in Bluetooth and not be able to run anything
    else as a Wi-Fi radio. In these cases, another option is to communicate via Bluetooth.


    As of writing, there are Raspberry Pi versions with Bluetooth integrated into
    the system. Any of the Raspberry Pi 3 versions, or the Raspberry Zero W, have
    Bluetooth capabilities – we are not covering this option where you would need
    a USB dongle to get your Raspberry Pi Bluetooth in this much detail. In terms
    of software, most is available in the Raspberry package repository.


    ## Install bluetooth


    The first step is to ensure you have all the required packages installed. You''ll
    want to make sure your system is updated first, with the following commands:


    ```

    sudo apt-get update

    sudo apt-get upgrade -y

    sudo apt-get dist-upgrade -y

    ```


    ```

    sudo rpi-update

    ```


    Once your Raspberry Pi is fully updated, you can install everything needed with
    one meta-package:


    ```

    sudo apt-get install bluetoothstack

    ```


    Not only do you get the required drivers for the Bluetooth stack, but you also
    get some utilities that you can use to verify your setup.


    ## Explore controllers


    With everything installed you can use one of the included command-line utilities
    to check that it''s all working. The main utility for this purpose is bluetoothctl.
    When you run it, you get dropped into an interpreter where you can issue commands
    to the Bluetooth system. From here, if your Raspberry Pi has multiple dongles
    in, you can use the select command to pick which one you should use.


    You''ll want to make sure the controller is powered up and before starting a scan
    of what devices are available locally. You can do this with the following commands:


    ```

    power on

