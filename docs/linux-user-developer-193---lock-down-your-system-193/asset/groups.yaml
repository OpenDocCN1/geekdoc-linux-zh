    ## Linux Mint 19


    Paul O''Brien 与 Linux Mint 负责人 Clément Lefèbre 进行了交流，随着这个流行的发行版通过新版本的发布不断成熟和改进。


    ![](img/589a2610a2e4642c43669f03fe22f7ff_61_0.png)


    Linux Mint 诞生于十年前，于 2006 年 8 月发布了“Ada”。该版本基于 Ubuntu 6.06，随后的版本“Barbera”切换到了 GNOME
    桌面环境作为其桌面。今天发布的 Linux Mint 与 Ubuntu 基础版本的 LTS（长期支持）版本对齐，提供五年的支持。


    巨大的吸引力——Linux Mint 广受欢迎的原因是开发团队紧跟来自网络社区的反馈。团队也想要一个全新的“版本”。当我们开发 Linux Mint 时，我们的目标是做得更好，因此我们始终考虑用户。我们希望
    Mint 用户能够继续享受他们过去所喜爱的一切，并通过实现新功能、修复问题以及尝试使其完美来满足他们的预期：“一个伟大的版本是一个每个人都能享受的版本。”


    发布日期是以一种快速实验性发行版的形式呈现的，其中包含了创始人 Clément Lefebvre 在在线评论中讨论的功能。这一实验收到了良好反馈，并根据 Clem
    的一些想法和改进引入了新功能。该项目获得了一种稳健开发方法，并渴望在强大和易用性之间取得正确的平衡，这显然是秘诀——Mint 仍然是最流行的桌面发行版之一，通过整合完整的套件，在其无障碍访问的所有元素提供了即时满足感。


    ## 核心信息


    Linux Mint 基于 Ubuntu 的长期支持版本，由 Xenial 和第 19 版本提供支持。Linux Mint 版本获得五年的支持。


