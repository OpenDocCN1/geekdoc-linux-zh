  mdcn: "\n无法被操作。\n`wp_posts` 表包含与作者身份、日期、可见性等相关的不同属性。编辑模式负责保护值的插入、更新或删除；如果启用了“只读”（Read-Only）模式，则该表将无法被操作。\n\
