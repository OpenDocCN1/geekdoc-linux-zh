    very end, or for the element of the environment ''main'' and returns the corresponding
    value.


    The use of bindings is that allows us to implement recursive functions. Figure
    8 shows an implementation of the Fibonacci function. You might like to try to
    write it, using Figure 7 as a template (although you might notice that this is
    not the most efficient way of approaching it). Given this, we need to define a
    main function and pair the two to make a program, as shown in Figure 9. We can
    see how the main function of the Haskell program to evaluate and print out the
    resulting value, which will be number 55.


    Our language is now complete and can be used to write simple programs. It is a
    little tricky to have the environment around in all our functions; the most elegant
    way of this in Haskell is by using monads, but that is a subject for another article...


