    # Review Media streaming servers


    # Emby


    An easy-to-use and all-inclusive solution with lots of features


    ![](img/589a2610a2e4642c43669f03fe22f7ff_79_0.png)


    +   You can connect Emby to your TV tuner and DVR devices to stream and record
    live TV


    # Usability


    All parts of the web interface are very intuitive, adding media to players. You
    can right-click on items to reveal a plethora of useful options such as downloading
    them, adding them to playlists and collections, collecting when them or editing
    their metadata. You can check the stream quality during playback and full-screen.


    # Management


    You can add users and give them limited access to the libraries and restrict what-media
    playbacks they can use. Emby also allows parental control and you can block items
    with a higher rating than the one you''ve defined. Emby is a detailed metadata
    manager and can also download subtitles from opensubtitles.org.


    # Device support


    Emby supports every DLNA-compliant device and enables you to stream and control,
    block on compatible players. Emby''s web interface is also ready to use any connected
    Chromecast device. We have apps for all mobile platforms and devices such as Amazon
    Fire, Apple TV, and Android TV.


    # Configuration


    The software is available as a pre-packaged binary and it has installation scripts
    for all popular distributions including Arch, CentOS, Fedora, and Ubuntu. The
    web interface has a detailed and well-organized configuration section to cover
    all aspects of your installation. You can also access the help online within the
    administration section.


    # Overall


    A comprehensive media-streaming solution that works across all platforms and devices.
    It has all the features you''ll need to find in a media streaming.


    # Gerbera


    A no-frills streaming server with impressive-on-the-fly transcoding


    ![](img/589a2610a2e4642c43669f03fe22f7ff_79_1.png)


    +   Thanks to Gerbera''s useful-on-the-fly transcoding capability, you can view
    media in formats not supported by your player


    # Usability


    There''s not much to the web interface you can only use to populate and maintain
    your media library - you can''t use it or play back the shared media. The interface
    is divided into two sections: one to browse the file system and the other lists
    shared media.


    # Management


    The Gerbera interface offers you two options for adding libraries. The first adds
    a directory with the default settings, while the other presents additional options
    - for example, the ability to automatically scan the library after a fixed interval.
    Gerbera doesn''t support explicit features as parental controls, or anything beyond
    basic streaming capabilities.


    # Device support


    Gerbera doesn''t have a web player to stream straight off the box. Once the server
    is running it is visible to all DLNA clients, including desktop players such as
    VLC and Android apps like BubbleUPR. You can use these clients to browse and share
    the shared media.


    # Configuration


    Gerbera is configured via the third-party repositories of popular distributions.
    It has adequate defaults, but if you plan to make changes you''ll need to edit
    its configuration with a text editor. The configuration has two types of settings
    and will fail to load the ones marked as required is, which can be confusing at
    first.


    # Overall


    A simple and straightforward DLNA media server that works right out of the box.
    Gerbera allows you to manage libraries from the web interface, but everything
    else you need to jump to the CLI.'
