    \ anonymous()），你应该能看到一些标准的 FTP 服务器响应，例如：`331 Need password\\r\\n`。将以下行添加到你的 `service.cfg`\
    \ 并重新加载模拟器（reload）：\n\n```json\n\"seq\": {\n  \"starts\", \"USER\",\n  \"331 Need\
