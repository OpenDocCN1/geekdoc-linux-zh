    ## 适用于初创企业的 Zulip


    你可以在一个全新的 64 位 Ubuntu 16.04 服务器上安装 Zulip。从理论上讲，只要满足服务器的软件依赖，它可以适用于任何发行版的 Linux，但
    Ubuntu Xen 是唯一官方支持的发行版。此外，对于 Zulip 来说，最容易开发的方式是不提供任何其他网络服务。


    在安装服务器期间需要提供凭据之前，请确保你已经设置好。Zulip 开发者推荐使用事务性邮件服务，如 SendGrid、Mailgun 或 Amazon SES，这些服务比从头建立自己的
    SMTP 服务器更便宜、更可靠。


    在硬件要求方面，这台机器需要一个 64 位操作系统、至少 2GB 内存和 20GB 磁盘空间，以支持多达 100 个用户。如果你超过了这个数量，请确保你有
    +4GB 内存和双核系统。磁盘空间取决于你上传的文件大小；如果用户共享大文件，设置较大的最小磁盘空间是明智的。


    你还必须确保服务器允许通过 443 端口的流量以接受 HTTPS 连接。如果你使用 80 端口，则需要将用户重定向到 HTTPS 服务器。对于发送邮件，你必须确保
    Zulip 服务器通过 SMTP 端口 587 具有访问你邮件服务器的权限。


    在开始之前，安装还需要你为你的 Zulip 服务器准备一个完全限定域名（FQDN），例如 chat.example.com。你需要一个 SSL 证书；安装过程将使用
    `certbot` 工具从 Let''s Encrypt 自动获取。Zulip 需要一个完全配置的服务器用于邮件邀请、通知等其他功能。


    ## 安装 Zulip


    在 Ubuntu 服务器上安装 Zulip，并使用 `sudo` 切换到 root 用户。访问 http://www.zulip.org/releases/
    并使用以下命令在临时目录中下载最新版本（注意：我们使用的版本也在连接列表[connective list]中）：


    ```bash

    $ cd /tmp

    # wget https://www.zulip.org/dist/releases/zulip-server-1.8.1.tar.gz

    # tar xf zulip-server-1.8.1.tar.gz

    # cd zulip-server*

    ```


    ## 发送和接收消息


    点击位于底部的“新主题”（New topic）按钮。你加入的流（stream）有空间输入主题。主题类似于邮件的主题，因此你可以更好地组织流内部的消息。


    你可以通过输入 `@` 符号，后跟用户名的前几个字符并让 Zulip 为你补全，来获得特定用户的关注，而不是整个流。


    若要直接向一个或多个用户发送消息而不是向流，请点击聊天界面底部的“新消息”（New message）按钮。使用 Zulip 的自动补全功能查找你想要称呼的用户名。


    Zulip 可以不使用 Let''s Encrypt 的证书而与自签名证书工作。虽然它会处理服务器的 SSL，但在允许你进入之前，它需要一个完全限定域名，因此这可能不是最常见的选项。请确保在新的
    Zulip 重新安装中访问“组织设置”（Organization Settings），以根据你的需求查看或编辑设置。


    其次，Zulip 可以配置邮件通知。由于 Gmail 的反垃圾邮件措施，你可以在对设置进行一些更改后，将 Gmail 账户连接到你的 Zulip 服务器。向下滚动，将“允许不安全的应用”（Allow
    less secure apps）从“关闭”切换到“开启”。如下：


    从解压的目录中，你可以运行以下的安装脚本：


    ```bash

    # ./scripts/setup/install \

    --cert=email-admin@example.com \

    --hostname=chat.example.com

    ```


    此外，我们使用了 `--cert` 参数为服务器安装了 SSL 证书。服务器管理员的邮箱将列在每封发出的邮件中。`--hostname` 参数设置了你的 Zulip
    服务器的主机。这需要一些时间来完成，完成后它会打印出一个可以使用其登录 Zulip 服务器的 URL。


    完成后，在物理机或甚至虚拟机上安装，因为你刚刚在里面安装了 Docker。按照上面的说明切换到 root 用户并获取最新的 Zulip 版本。使用以下命令运行安装程序：


    ```bash

    # ./scripts/setup/install --min-site-id

    ```


    ## 键盘命令


    如果你愿意，可以使用 Zulip 键盘进行导航。你可以在 https://help.zulip.com/keyboard-shortcuts 找到快捷键列表。


    ## 一通百吃


    尽管你可能有一长串需求，但 Zulip 足够简单，让你能够应对这些需求。这对于创建一个测试部署尤为适用，并且可以在局网内使用。


    | | |

    |---|---|

    | 4 格式化消息 | Zulip 使用 GitHub Flavored Markdown 格式化消息。“A”图标表示消息框，用于显示格式化。若要隐藏，使用眼睛图标预览消息。
    |

    | 5 视频通话 | 若要与所有用户发起视频通话，像平常一样撰写消息。 |

    | 6 回复消息 | |


    '
