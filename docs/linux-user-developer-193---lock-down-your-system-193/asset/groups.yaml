    # Hardening WordPress


    ## WordPress: Use hardening techniques on your install


    Apply some extra measures to tighten up the security of your WordPress installation


    Roughly 25% of web pages are created with WordPress, making it one of the main
    targets of attack for hackers.


    Because companies choose to use it, it''s used for all kinds of services around
    the internet. But the basic security measures offered by WordPress are not enough,
    so we need to use some third-party tools and check the setup of various plugins
    or components, as well as the database itself.


    The design of WordPress is one of its greatest virtues and there''s a large community
    around it, which has helped grow. WordPress uses PHP as its main programming language
    and very popular services as MySQL and Apache as server. Its simplicity is a key,
    but it also has potential for customization through plugins and even graphics
    (templates), all under a GPL licence. These components also suffer from their
    lack of security, which can contain anything from malware to attacks.


    ## Common threats


    The security of sites created with WordPress is continually at risk because of
    several factors that could potentially facilitate attack. Types of attack range
    from simple phishing to complex SQL injection. The exploitation of flaws may be
    caused by an insecure server. But these are not the only problems we can face.
    The most common ones are prevalent in the code itself; including source code from
    poorly written themes and third-party plugins that are installed.


    The first step to hardening your WordPress site is to correctly configure all
    the settings - which means creating passwords to avoid any brute-force attacks.
    Passwords should be at least eight characters long and contain numbers, symbols,
    uppercase letters. Authentication in WordPress is important to keep in mind because
    it determines if the user is legitimate and has permission to access resources
    in the system.


    Stealing credentials can be achieved in various ways. For example it is possible
    to retrieve credentials through phishing attack using email. This attack could
    infect the target with any kind of malware - trojan, for example - But the most
    common attack is related to plugins and the exploitation of vulnerabilities within
    their code.


    Accessing WordPress with a password, even if it does not guarantee that the user
    is legitimate, is possible that the password was stolen, so it is necessary to
    use two-factor authentication to ensure that account is not lost. This is done
    through plugins that allow a second channel of authentication for the user. There
    are many ways to implement this, but with the proliferation of security-plugins,
    these are the easiest to use.


    ## Secure your WordPress site


    Plugins are used in WordPress, but also one of its security concerns. A general
    rule, in any plugin you use the system should be downloaded from a secure repository,
    and with maintenance policy be able to update these components. There are many
    plugins that allow us to scan and detect issues with them. For example, Wordfence
    (wordpress.com) and Sucuri (sucuri.net/) are the most popular, and include a firewall
    plugin and real-time traffic analyzer. Both of these plugins are available as
    free and commercial versions.


    Another interesting feature to install for added security is control to limit
    login attempts. By default this feature is not implemented in WordPress so we
    need to download third-party plugins such as Limit Attempts or Login Lockdown.


    When it comes to implementing 2FA for WordPress, one useful solution is Wordfence
    (https://it.ly/catch) and it provides 2FA through a plugin installed which is
    activated during the authentication process, acting as the name implies, an extra
    layer to block or allow access even if the user has the correct credentials and
    password. The parsing process is really useful to identify tokens. In the case
    of a phishing attack, WordPress first checks if this query is valid to check the
    status of the lock. If the lock is in a ''closed'' state, WordPress denies access
    and generates a notification to alert the user of a potential phishing attempt.
    In the event that the lock is opened, WordPress takes as it normally would, giving
    the user access to the internal areas of WordPress. The administrator can control
    all attributes related to security.


    ## Harden the WordPress server


    The server where WordPress is installed is another instance that must be secured.
    Every WordPress instance should be hardened, for example changing file permissions
    and databases, deleting the installation files or installing security plugins
    as we need. But for some reason you don''t want to bother with plugins, you could
    use a tool called Hardening instead. WordPress hardening is using a security framework
    that allows us to isolate our WordPress from the operating system''s point of
    view. From Linux, just type the following command:


    ```bash

    $ git clone https://github.com/hardcraft/wordpress

    ```


