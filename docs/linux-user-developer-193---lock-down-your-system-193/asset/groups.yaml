    ### 手机的智能设计与笔记本电脑的 GnuPG 安全令牌


    Social purpose 公司宣布，Libren 5 智能手机（PureOS5）将于 2019 年 1 月发布，其开发工作已取得重大进展。其最终设计既时尚又快速（如图所示），多个应用程序已准备就绪发布，包括联系人和原生通话。由于支持加密通话和原生
    VoIP，它将成为一款安全的智能手机，同时提供短信和电子邮件的端到端加密，并为摄像头、麦克风和蓝牙提供硬件级开关。还提供了预配置的 VPN 服务用于浏览。


    与此同时


    “我们有一支极其资深的工程师和设计师团队，正按照计划构建 Libren 5，并拥有经过验证的制造能力来实现我们的交付目标。


    正如 Purism 网站上所示：“我们相信人们应该拥有保护他们而非利用他们的安全设备’”


