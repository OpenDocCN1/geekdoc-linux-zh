    # ## Media streaming servers


    Watch your media anywhere and any device. Start streaming all over the network
    using these popular open solutions


    ### Emby

    A major of Emby''s core elements including the server are open source but some
    others are released under a proprietary license. While streaming media doesn''t
    cost anything, some features require a paid subscription to its Emby Premiere.

    https://emby.media


    ### Gerbera

    Formerly the unmaintained MediaProject, Gerbera continues to build and add to
    the popular DLNA/UPnP server collection. The GPL2-licensed server boasts some
    interesting features to reimagine your media collection based on extracted metadata.

    https://gerbera.io


    ### Kodi

    Previously known as XBMC, Kodi is an all-in-one media player and home theatre
    app. It''s available for multiple platforms and although it isn''t primarily designed
    to stream media, it is one of many related functions it can do easily thanks to
    extensive plug-ins.

    kodi.tv


    ### UMS

    Another popular DLNA-compliant server, the Universal Media Server (UMS) was originally
    forked from the PS3 Media project to gain greater stability and file compatibility
    by adding a new of console-independent features.

    www.universalmedierver.com'
