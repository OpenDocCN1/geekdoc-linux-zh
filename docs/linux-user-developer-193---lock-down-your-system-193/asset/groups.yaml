    Welcome to the UK and North America''s favourite Linux and open source magazine.
    It''s been another frantic months as it announced GitHub, the central repository
    for most open source projects, for $7billion (see p6). It''s easy to say how much
    Linux grew, but it''s the clearest indication of the ideological divide in the
    open source community continues its open source charm offence. We''ve spoken to
    a number of influential figures and some feel an independent ''GitHub Foundation''
    is in order.


