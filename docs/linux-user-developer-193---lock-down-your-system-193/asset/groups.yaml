    组织的详细信息，点击“保存更改”按钮并关闭对话框。


    Zulip 中的通信发生在 IRC 频道中，这些通道通常与 IRC 聊天室或邮件列表相比较。Zulip 安装包含多个“流”（streams），包括“新成员”，你还可以创建自己的自定义流。流可以邀请组织中的任何任何人，或者通过邀请来加入。只需点击
    `+` 即可在组织内创建一个流，重要的是花些时间头脑风暴你想要创建的流，例如一个用户可以分享学习资源的通用流，或者一个可以让他们分享项目成果的 #misc（杂项）流。


    # 快速指南


    ## 从 GitHub 获取通知


    你可以使用 Zulip 的集成机制从你的 GitHub 存储库获取通知。首先，创建一个流来托管消息，点击齿轮图标并进入 Settings（设置）> Add
    a Bot（添加机器人节点）。在流上选择“webhook”选项，为它赋予任意名称和密钥。点击“Create bot”（创建机器人）按钮并复制机器人的 API
    Key。注意流名称格式：`https://zulip.host/api/v1/events?stream=[stream-name]&key=[API-key]`


    ```

    Key&stream=[stream-name]

    ```


    将 ''zulip''、API-Key'' 和 ''stream-name'' 替换为匹配你的环境。如果不提及它们，Zulip 将无法以 RPM 的形式接收通知。进入
    GitHub 并切换到 Settings。选择左侧标签并将你构建的 URL 粘贴到“Payload URL”（负载 URL）中。更改内容类型为你想要通知的事件类型。点击“Add
    Webhook”（添加 Webhook）即可完成。


    要创建流，点击侧边栏流列表旁的齿轮图标；Zulip 会显示所有流。点击 `+` 开始创建流的过程。页面右侧会显示一个对话框。你可以输入流的名称，添加可选的描述，但通过切换
    Accessibility（访问权限）部分下的复选框将其设为私有。“Announce stream”（公告流）按钮会通知到 #announcement 流中。


    ## 你可以将某些流设为默认流，新用户在加入网络时会自动订阅这些流


    > 关于创建此新流，以便其他用户可以加入。


    使用“People to add”（要添加的人员）部分自动让用户订阅该流。你可以手动指定用户的名称或电子邮件来邀请加入现有流。完成后，点击“Create”（创建）按钮激活该流。


    新流现在将列在主界面左侧的其他流列表中。你可以点击相邻的齿轮图标在左列显示名称，然后按下右上角的 Press（按下）按钮。


    作为 Zulip 管理员，你还可以将某些流标记为默认流，这样新用户在加入网络时会自动订阅它们。点击齿轮图标并进入“Manage organisation”（管理组织）。向下滚动左侧选项列表，在“Stream
    name”（流名称）框中找到要添加为默认的流的前几个字符，并使用应用程序建议来发布该流。列表列出了所有默认项；你可以使用“Remove from default”（从默认项中移除）按钮、“add
    to a stream”（添加到流）或从此列表中删除。


    你们都将敞开大门并邀请用户加入你的 Zulip 安装。再次点击齿轮图标并向下滚动列表选择“Invite users”（邀请用户）选项。这将打开一个窗口，你可以在其中输入想要邀请的用户的电子邮件，然后从底部的邀请消息中选择。你还可以自定义流。


    上述 Zulip 管理员可以查看所有公共流，但除非被邀请消息，否则只能看到仅限邀请流的成员。


    # 初创企业的 Zulip


    被邀请的用户将被自动订阅。默认流旁边的复选框已勾选。完成后，点击“Invite”（邀请）按钮，Zulip 将向他们发送电子邮件邀请。一旦其他用户加入，你就可以启动
    Zulip 与他们交换消息。


    ## 推送通知


    传递通知是一项重要功能。对于任何消息服务来说，传递通知都是一项重要功能。Zulip 桌面应用可以很好地集成到各种环境中。Zulip 应用程序可以接收来自 push.zulip.com
    的通知，以便如消息、@mentions 等事件。如果你使用浏览器，请在你的设置中启用通知。


    在移动应用上获取实时通知有点复杂。这是由于 Zulip v1.8.1 版本中的新更新。这实际上非常简单，归功于


    > Zulip 桌面应用可以很好地集成


    首先，通过点击齿轮图标进入设置来启用通知。在“Private messages”（私信）和“@mentions”下，勾选“Enable notifications”（启用通知）复选框。然后保存更改，释放终端并登录
    Zulip 服务器。


    首先以 root 身份进入 Zulip，然后切换到 Zulip


    ```

    $ /home/zulip/deployments/manage_py_script

    ```


    今天就介绍到这里。Zulip 已准备好接收来自 push.zulip.com 的推送通知，当


    正如你看到的，Zulip 的操作非常直观。除了它在使用流来跟踪用户方面的创新用法外，


    我们在本文中仅触及了 Zulip 的表面，但我相信这足够你开始深入探索了。Zulip 是一项显然为增强所有类型组织的通信设计的服务。你可以在第 69 页的“从
    Zulip 获取通知”中找到更多信息并学习如何将服务器连接到 GitHub 等第三方服务。


