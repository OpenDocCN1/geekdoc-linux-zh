    # 开源


    你的 Linux 新闻与见解源泉


    # 读者来


    ## # 你的来信


    关于本杂志、Linux 和开源的疑问与意见


    > 中奖来信！

    ### 来自澳洲南方的废光盘

    亲爱的 LU&O，我正在寄回这张 DVD，以此作为沮丧的象征。这张光盘在驱动器里会作响——而且它只会发出这种声音。因为我必须提前等几周才能从报刊代理那里拿到杂志，如果这些光盘没有经过更仔细的错误检查，且我完全没有更换的机会，我本该把它们寄到世界的另一端了。作为你们杂志的老读者和关注者，我相信如果我准备支付近
    20 英镑，那么本杂志必须是好的，事实也如此 [EC Thomas]，但一张坏光盘就是浪费。


    我知道我是少数居住在偏远地区、需要去当地图书馆使用免费 Wi-Fi 的人之一，因此无法下载大量数据，一张装满 ISO 文件的光盘简直是数据黄金。

    **Malcolm Beckwith，澳大利亚**


    Chris：听到这种事情很令人失望，因为 ISO 在最终由供应商刻录之前会经过多个 QA（质量保证）阶段。你们不需要把坏光盘寄回给我们。提醒大家，所有订阅者都应该获得更换的光盘（我们为这项服务支付了足够的费用），但如果没有收到，请直接发送邮件到
    linux@future.com 并附上你的订阅详情。


    ## # 十美元之梦


    LU&O，我必须让你们知道我的最近发现。我是 Linux 新手，当时在读你们以前的一期杂志。我记得上面说过“旧的 Dell Epson 都是安装 Linux
    的极佳选择”。几周后，我在社区社区的跳蚤市场上发现了一台旧的 2007 年 Dell Inspiron E1505。它有巨大的


    以上旧笔记本电脑并不总是与 Linux 兼容良好，但显然在旧机器上安装它是件轻而易举的事：“没有硬盘，屏幕不工作；”出价 10 美元并送到她家里。我拆掉了完全损坏的硬盘，只留下了机器。从
    ebay 上订了一个二用的 48GB SanDisk SSD，并将 Lubuntu ubuntu 17.04 加载到 USB 盘中。连接了一个 2 英寸显示器后，我有了我的新宝贝，哈利路！我运行了我的第一个
    Linux，并在 17 秒内启动了，ubuntu 太棒了。一切都运行正常！


    想象一下这种经历对于像我这样的新手来说是多么激动。我仍然在线，并希望能和你们聊天！感谢给我这个机会把 10 美元变成一场激险的冒险。


    ## Glen 住在德克萨斯州


    Chris：太棒了，Glen！我们说过任何旧旧机箱都是好机箱吗？坦率说，我们不确定哪里坏，只是我们主要使用了安装的操作系统。从帖子的年代来看，我们似乎跳过了某些
    UEFI——即 BIOS 替代品——它是 2007 年引入的。对于某些用户来说，其他人在安装时会遇到困难，因为他们需要在 UEFI 中关闭兼容模式以获取正确的
    GRUB 版本。当时安全启动（Secure Boot）还不存在。他们的“功能”是微软在 2011 年引入的，用于防止未经授权的软件或操作系统。你仍然发现很多对此感到沮丧的用户帖子。


    # 竞赛


    获奖者-Malcolm Beckwith


    微软以 75 亿美元收购 GitHub 的消息引发了很多争议，这在某种程度上不可避免。当传言开始传播时，我们问：微软要买 GitHub 吗？你怎么看？这是一个好举措还是一场噩梦？我们目睹了大量的
    GIF，这表明读者对这项交易并不满意，但这里有几个亮点：


    - @tosin240

    > “如果微软购买了它，它将只会通过源码社区和另一个机构进行分叉，就像 Linux 对 MariaDB 所做的那样；Solaris 对 Illumos (Oracle)
    也是，等等。”


    - @opensolar

    > “Illumos 是不可比拟的——因为 OpenSolar 是开源的，它可以进行分叉，而且主要价值在于代码。GitHub 不是开源的；价值在于数据库和网络效应，而不仅仅是代码。”


    - @rawminh

    > 其他消息是，对 @github 的兴趣正处于极点。


    - @Graphmatics

    > “MS 支付了 75 亿美元……如果它对程序开发者来说不是一个实用的系统……天哪，我需要在他们任何疯狂的编程语言中一个稳定的 Linux 应用！”直接去
    git 吧。


    - @iodvednetave

    > “噩梦”


    - @pavliknew

    > “我完全支持。我用 GitHub，但社区正变得太中心化了。”


    分享你的 Linux 知识或你喜欢的开源项目，或者尽管提到更多关于 GitHub 的内容？将信发送至 linux@future.com 或在 @LinuxUserMag
    与我们交流。最佳信件将获得一个 16GB 的 DataAsh Pro USB 3.0 闪存盘，带有键盘的 AES 256 位加密，通过用户和管理员 PIN
    码提供额外安全。更多详情请见 https://lstorage-uk.com。


    # 热门推文


    # 采访 KUBEFLOW


    ## 面向大家的 ML


    我们采访了 Google 的 David Aronchick，关于他简化可扩展机器学习部署的新开源项目。


    对于任何处理复杂 Kubernetes 的人，它必须成为标准。现在占据许多用户的问题在该抽象之上构建什么。答案是 Kubeflow——专注于机器学习。在哥本哈根的
    CloudNativeCon 大上，产品经理 David Aronchick 和高级软件工程师 Vishnu Kannan 发布了 Kubeflow 0.1，该项目的首次发布。Aronchick
    解释了 Google 的 Kubeflow。在系列中，还有另一个机会去抽象 ML 的复杂性并关注软件开发的方面。


    '
