    msfconsole -q \"exploit/linux/ftp/ftopfd_reverse: \\\n  set RHOSTS 127.0.0.1;\n\
    \  exploit; quit\"\n```\n\nThe exploit failed, unfortunately, because the remote\
    \ is not a ProFTPD vulnerable server. You will see out on the emulator console\
    \ that we cannot find a match for USER anonymous\\n of size 16. This is expected.\
    \ By following the exploit function in the emulator, we can start sending payload\
