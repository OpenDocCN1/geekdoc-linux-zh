    The setup script is one of CRUX''s few. The distribution also has a utility for
    installing binary packages, pkg-get:


    > If you can live with its esoterism, CRUX will give you like no other


    the rest. However, the configuration files have commented-out examples that you
    can adapt to match your environment.


    Another highlight of the distribution is its malleability. The benefit becomes
    evident when you are in the installation process where you need to compile your
    own kernel. After the first time, the CRUX developers have smoothed out the process
    so that you don''t need to do it again, it works flawlessly on all our computers,
    from physical machines to virtual machines. The distribution''s flexibility allows
    you to easily set up the bootstrap; CRUX is perhaps the only distribution that
    allows you to use the LILO tool. There''s also the main GRUB distribution, which
    is in fact more convenient if you are using bits of your root filesystem.


    CRUX is a source-based distribution, which compiles packages from source instead
    of installing binary packages but the upside is that you get apps optimized for
    your hardware. The main CRUX repositories are not exhaustive, but you have access
    to a lot of others and the project''s website has long list of repositories that
    contain a lot more popular open


    The distribution has enough documentation, but it''s not exhaustive and all pages
    are not written for complete newbies. It''s hard to say that if you''re not used
    to hacking to your system to a solution like the CRUX provides, you''re going
    to be a bit of a disappointment.


    But if you can live with its esoterism, CRUX will give you a finely optimised
    system that''s like nothing you''ve tried before.


    Matthew Sharma


