    面向加拿大市场，Arch Linux 同时也附带了 Openbox，这是一种快速、轻量级的发行版，适用于桌面电脑和笔记本电脑。


    ### Bluestar Linux

    Bluestar 包含 KDE 桌面基础，并包含了最新的软件包以及丰富的桌面和多媒体软件选择。


