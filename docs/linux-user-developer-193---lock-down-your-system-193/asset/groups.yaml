    # SPOTLIGHT


    ## Developing Cloud-native AI apps


    Machine Learning can save millions of dollars. That''s the statement that big
    businesses have long made. To demonstrate that, David Aronovich - in his presentation
    at Kubernetes, Copenhagen - showed a chart of Google''s data power-usage efficiency.
    When attached ML to their processes it was a near-instant 40 cent saving.


    But benefiting from what ML offers is not simple. There''s a lot of pain in learning
