- img_proc: true
  md: '# Chapter 15: Step 12: Free Your Office 38


    One strength of Applicware is their document filters, which are about on par with
    the StarOffice filters. Highly formatted Word documents won''t look as nice in
    either product as they do in their native application, but simpler documents look
    and work just fine.


    Whether you''d consider a rollout of Applicware to your Windows systems, or you''d
    only want to equip Linux users with the suite, it''s worth consideration. It''s
    not as ponderous as StarOffice, though it''s not quite as elegantly, either. And
    while the price is greater than zero (it''s $99 for the full suite as I write
    this), it''s nowhere near the price of a Windows-based suite.


    For more information on Applicware, see http://www.vistasource.com/. There''s
    also information on Applicix'' open source offerings for application development
    at http://shelf.sourceforge.net/


    # WordPerfect


    Corel has done a nice job with its entry into the Linux application arena, WordPerfect
    2000 for Linux. The Standard edition includes the Linux versions of some desktop
    applications that have been around for quite some time: WordPerfect for word processing
    and page layout, and the Quattro spreadsheet. Corel Presentations and CorelCentral,
    which includes an address book and calendar/appointment reminder features, round
    out the package. The Deluxe version adds the user-friendly Paradox database program,
    which I found every bit as easy to use as Microsoft''s Access. Figure 15-2 shows
    a desktop with WordPerfect 2000 in action.


    Both versions of the suite come bundled with Corel, so if you''re interested in
    testing the packages, you can take advantage of the all-in-one packaging to make
    your evaluation process a little easier. Installation over other distributions
    was a snap using the graphical installation procedure.


    The WordPerfect suite, which looked a little more trim than the StarOffice suite,
    was no speed demon; I was watching the disk activity on my desktop system and
    wondering it was time to take advantage of dip in memory products. The tools are
    mostly slow to open and close, though, and seemed to respond well as I used them.
    If you''re devoted to open source or zero price software, I''d recommend the WordPerfect
    package, which did an acceptable job opening Microsoft Office files and has Windows-based
    versions. One downside is that WordPerfect''s maker, Corel, has been in financial
    straits for some time, making its future a little questionable. And a recent influx
    of users from Microsoft is not unlikely to bolster Corel''s strategy.


    # OTHER BUSINESS APPLICATIONS


    While I don''t want to describe every major business product available for Linux,
    I would like to mention some highlights that you might want to investigate further.
    Linux users enjoy a wide range of no- or low-cost programming tools, database
    software, web tools, file utilities, graphics production programs, collaboration
    software, and “business entertainment” packages.'
