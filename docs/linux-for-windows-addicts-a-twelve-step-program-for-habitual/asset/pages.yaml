  md: '# Enabling Server Side Includes


    Another expedient option is to enable SSI, which gives dynamic access to the files
    and programs on the host system. While this increases overhead because the server
    must parse each file for includes and execute them locally, it makes life pretty
    easy for those creating the web page content.


    For example, using the "include file" directive, you can include a stock header
    and footer template to give your web pages the same look and feel. This ensures
    consistency; because you''re not reusing the original code over and over, you''re
    literally using the same code over and over. If you want to change the template,
    you only need to change one header file and one footer file.


    # Server Configuration


    Enabling the SSI functionality on the server is straightforward:


    +   1. Tell Apache to parse certain .shtml extension for parsing.

    2. Designate the directory that will use it.

    3. Enable parsing for the directory that will use it.


    As you may have guessed, these things happen based on whether and where you allow
    the Server Side Includes for the default configuration, specific files and directories,
    and virtual domains. Enabling SSI produces an output in the httpd.conf file, which
    you may recall, called "Includes." But other underlying changes occur in a file
    I haven''t mentioned yet, /etc/httpd/conf/srm.conf. This file contains some features
    you might find interesting, such as the icons associated with different file types
    for directory listings.


    For our purposes, though, the interesting part of the srm.conf file relates to
    telling Apache what types of files to handle. The two lines that should be included
    in the configuration once you''ve enabled SSI are


    ```

    AddType text/html .shtml

    AddHandler server-parsed .shtml

    ```


    The first line simply tells the web service that there''s another type of html
    file and that it can be identified by .shtml extensions. The second line instructs
    the server to parse these .shtml documents for special strings that can be replaced
    by server-produced content. In both cases, you could manually tweak the system
    to use an extension that''s not .shtml, but .shtml is the de facto standard.


    # Web Page Configuration


    To include dynamic content in your web pages based on SSI, you need to use only
    the .shtml extension for the page. This means the page will be parsed (so don''t
    use this extension on pages that don''t need server side includes, or you''ll
    be wasting processing resources) for these. But what are they?'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Chapter 11: Step 8: Establish a Web Server


    The include statement in a .shtml file is placed between comment brackets, shown
    here:


    ```

    <#config time="%m/%d/%Y" -->

    ```


    The config option allows you to configure how error messages, file sizes, and
    dates are displayed. This example sets the date''s display format to print in
    the mm/dd/yyyy format. The following example actually prints the date in the format
    that has been specified:


    ```

    <#echo var="DATE_LOCAL" -->

    ```


    The echo command outputs the specified variable into the text of the HTML page,
    so it''s useful for doing things like indicating the date a page was loaded. Even
    more useful is the exec command, which allows you to run a command on the server
    and dump its output into the HTML page.


    ```

    <#exec cmd="/bin/ls docs/*.pdf" -->

    ```


    This option runs the ls command to give a listing of the PDF files in the docs
    directory. This information is placed into the HTML page where the tag was invoked,
    so it might be useful to format output like by using <PRE> and </PRE> tags around
    the include statement.


    There is another version of the exec command that executes CGI scripts instead
    of system programs. Consider this example:


    ```

    <#exec cgi="cgi-bin/createaccount.cgi" -->

    ```


    This option runs the createaccount script from the Apache server''s cgi-bin directory.
    Note that neither of these options will work if the IncludesEXECNO option was
    selected for this server or this directory.


    You can output other useful information using SSI, including the size of a file:


    ```

    <#fsize virtual="docs/prodocs.pdf" -->

    ```


    The fsize option looks at a given file and returns its filesize; this is particularly
    useful if you want to know how large a file is before they start downloading.
    You can also include the last modification date of a file using a similar command:


    ```

    <#lastmod file="index.shtml" -->

    ```


    Notice that in the fsize statement, the argument is "virtual", while in the lastmod
    statement, the argument is "file." The reason is that in the fsize statement,
    the file is located in a different directory than the .shtml file with the include
    statement. If that''s the case, either statement needs to use the "virtual" argument.
    In the lastmod example, the file is assumed to be in the same directory as the
    .shtml file.'
  merge: -1
  pgno: 342
