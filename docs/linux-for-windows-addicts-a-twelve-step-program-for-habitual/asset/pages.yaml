  md: '# Linux for Windows Addicts: A 12-Step Program


    In the last chapter, we looked into installing and configuring mail software.
    What do you do if not all of the tools I mentioned came some software that wasn''t
    included with the distribution? You move to Step 10 of our Microsoft abuse recovery
    program, and continue to look for new software and promptly make it.


    # USING PACKAGES


    A package is composed of a set of files and some additional information; together,
    they tell your system where the files need to be installed, which other files
    are required to make these files run. The package system maintains enough information
    about the packages allows you to do several useful things. One is safe removal
    of a package, because the system knows whether any package needs a file. This
    is unlike an uninstall program that actually works.


    Another fine feature of package managers is verification of one or all the packages
    on the system, because the system knows the packages that have been installed
    and the corresponding files should be present.


    Convinced packaged software is a good thing? Whether you are or not, you might
    check out this section. We''ll start looking at the package options available
    to you, and move on to package management tools and procedures.


    # RPMs and Debs


    There are widely used package formats: RPM and DEB. RPM files are used by the
    many Red Hat derivative distributions (and, I''d better hasten to add, other distributions
    that are not derivative works), while DEB files are used by Debian and related
    distributions, including Core Linux.


    For our purposes, a package is a compressed set of files, stored along with additional
    information, which can easily be unpacked and installed by a user. RPM and DEB
    packages both do this, and while there are differences between the two formats,
    they serve to make the process of installing and uninstalling software significantly
    easier. If you''re really interested in the differences between the two formats,
    check out the information provided at http://kitenet.net/~joey/pkg-comp/


    I don''t think there''s a compelling reason to use one type of package over another.
    I think you should choose the distribution you want to use and work with it. But
    you may find that one package type or the other is more useful to you, and if
    you''re planning building and distributing software, you may want to be able to
    support both formats.'
