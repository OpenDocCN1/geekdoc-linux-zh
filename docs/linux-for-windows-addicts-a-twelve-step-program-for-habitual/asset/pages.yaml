  md: '# Chapter 6: Step 3: Compile a Kernel


    If you have networked Macintoshes using Ethertalk or (heaven help you) LocalTalk
    that need to see your Linux box, enable AppleTalk Protocol Support. You''ll have
    to use the netatalk program, which is available from http://www.umich.edu/~rsug/netatalk/,
    to enable file and print services for AppleTalk Mac Clients. And if you have to
    support-communications with Digital Equipment Corp. using DECNet, you should enable
    the DECNet support option. Otherwise, leave these options alone.


    The last networking option is for 802.1d Ethernet Bridging. This feature allows
    a Linux system with multiple network cards to act as a bridge between Ethernet
    networks. Data packets come into the system''s network card from one Ethernet,
    the system can check to see if packet is destined for the bridged Ethernet, and
    if so, it will send the data onto that network over the other network card. Unless
    you mean to turn your Linux system into a network device, you don''t want to do
    this.


