  md: '# Linux for Windows Addicts: A 12-Step Program


    # MANAGING SENDMAIL


    Although we''re moving extremely rapidly through the process of setting up sendmail
    on a Linux mail server, since we''ve talked about it at all, it seems sensible
    to include a little information on how to maintain it. Two management issues we
    haven''t discussed much previously we are monitoring the mail queue and preventing
    spam.


    # Keeping Tabs on the Queue


    You can view the contents of the sendmail queue from within Linuxconf. Go to the
    Config-Networking-Server-Tasks-Mail Delivery System (Sendmail) tree and select
    the Manage Mail Queue option, which will bring up a display like the one in Figure
    12-1.


    There aren''t any messages queued up in Figure 12-1, and hopefully you won''t
    have mail backed up on your system, either. But if you do get some messages queued
    up, and you wish to delete some, you can easily accomplish this by clicking on
    the message ID to open the message. Click the DEL key to delete the selected message.


    # Anti-Spam Measures


    If you''ve got an email address, you''re getting spam. And if you''re running
    a mail server, you''re probably getting quite a lot of spam. I''ve talked to administrators
    who say ten per


    ![](img/dcd0086266143e7048be2fb5e68a2391_355_0.png)


    Figure 12-1. View contents of the sendmail message queue from Linuxconf'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Chapter 12: Step 9: Manipulate Email


    # 337


    cent of their incoming mail is unsolicited commercial email, most of it with forged
    return addresses.

    While there''s not much that can be done to turn that flood into a trickle, there
    are some anti-spam features built into sendmail, the Linuxconf allows you to configure
    these fairly easily. Thus, you can not only bounce mail from known offenders or
    suspect addresses or networks; you can also tellmail the specific domains and
    hosts for which it should be forwarding messages.


    # Rejected Senders


    Use this option to filter out messages from a particular email address, network
    address, hostname, or any address in a domain. Enter into the Origin field enter
    the origin address you want to filter.

    You may also add an error message to be sent when the message is bounced. Make
    it as pleasant or obnoxious as you desire. If you think the message will actually
    reach the recipient (most spammers forge to avoid having to deal with this type
    of thing), you might consider some variation on this theme: "Thank you for your
    inquiry about our email editing services. Future messages we receive will be edited
    at a flat rate of $500 per month. For variations on this theme, and others, see
    Axel Boldt''s Blacklist at http://www.uni-paderborn.de/~axel/BI/blacklist.html##harsh.
    While you''re there, trace links back to his homepage and read his interesting,
    though unrelated, comparison of Germany and the U.S.A.


    # Relay For/To


    The Relay For options restrict who can use this sendmail system as a mail relay.
    To specify the ''Relay For'' IP option and enter the IP address (you can specify
    part of a complete address to use by the whole network, e.g., 10.0.0.1). To specify
    the host or domain by name, select the ''Relay For'' By Name option and enter
    the host or domain name.

    The Relay To Hosts option limits the hosts and networks to which you will allow
    your system to transfer mail. If you normally use a single mail connection to
    an ISP or another corporate location, this could be the only entry you create.


    # ALTERNATIVES TO SENDMAIL


    Don''t get me wrong: sendmail will do the job. There are plenty of people out
    there who are experienced with it, and you shouldn''t have any trouble getting
    outside help if you need it. The Mail-Administrator-HOWTO is one resource that
    discusses configuration of sendmail and other Mail Transport Agent (MTA) services.
    The Mail-HOWTO has some similar content. But neither document has much to say
    to hype up use of sendmail. So what other options are out there?'
