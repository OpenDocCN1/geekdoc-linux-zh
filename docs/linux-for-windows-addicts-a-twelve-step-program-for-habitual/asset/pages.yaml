  md: '# Chapter 6: Step 3: Compile a Kernel


    people want to access disk images (such as a diskette image or ISO 9660 CD-ROM
    image) this way, but most folks can pass on this option.


    The Network Drive Support option enables an infrequently used method of sharing
    drives via TCP/IP, using a more standard mechanism, such as NFS, is a better choice.
    Disable this option.


    The Logical Volume Manager (LVM) Support option provides the ability to access
    virtual disks and partitions using a series of abstracted volumes and devices.
    You can clump multiple partitions and devices together into a group, and further
    subdivide this logical group into several partitions and disks, but it''s a little
    complicated unless you''re really interested. If you enable this option, you should
    also enable the LVM In Proc Filesystem feature, which provides access to the LVM
    management data via the /proc/lvm directory. For more information.


    The Multiple Devices Driver Support option is a more traditional way of addressing
    multiple hard disks as one logical drive. While software-based mirroring and redundant
    array of inexpensive drives (RAID) options are available under Windows, they''re
    available under Linux if you enable this option. Note, that the management of
    RAID systems isn''t as effortless in Linux as in Windows NT and 2000. When you
    merely combine two or more disk partitions or want to use RAID level 0, 1, 4,
    or 5, you should enable this feature.


    Because this enables software-based multiple device support, you don''t need to
    use this option to address a hardware RAID card. Hardware RAID is a better option
    if you can afford it, but if not, you can use the software version under Linux.
    Read more about software RAID in the Software RAID mini-HOWTO, which is usually
    found in the /usr/doc/tree. For the latest versions of HOWTO and mini-HOWTO documents,
    see http://www.linuxdoc.org, where you can browse or download documents to your
    heart''s content.


    +   - (Append) Mode** Linear or append mode refers to combining multiple disk
    partitions into a single logical device to expand space. From a storage capacity
    perspective, the inexpensive, high-capacity drives available today may make this
    feature somewhat unnecessary, but from an ease of management perspective, it''s
    nice to have to add another disk without pulling the old one. All the same, I''d
    probably not use it on the compile or as a module.


    +   - **RAID-0 (Striping) Mode** Disk stripping writes across multiple disks to
    minimize the delay introduced by asking a single drive to write a chunk of data.
    Allowing two or more drives to divide the task of writing the data (writing consecutive
    bits of data across array) improves performance. It doesn''t, however, improve
    reliability, because there''s no redundancy built into the system. So although
    it''s fast, if you lose one of the disks from the striping set, you lose the whole
    set of data. So I wouldn''t recommend RAID 0.'
