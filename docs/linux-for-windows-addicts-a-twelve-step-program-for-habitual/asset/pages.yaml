    **Figure 7-5.** Set your PPP connection parameters using Linuxconf


    # SLIP


    The process of configuring a SLIP connection is virtually identical to the PPP
    process, but instead of populating the ifcfg-ppp0 and chat-pppp0 files, Linuxconf
    creates or modifies /etc/sysconfig/network-scripts/ifcfg-sl0 and /etc/sysconfig/network-scripts/chat-sl0
    (for the first SLIP connection, naturally). PAP is not an option under SLIP, so
    there are no PAP-related features accessible from Linuxconf or in the files themselves.


    # PLIP


    The process of configuring a PLIP connection is very similar to the process of
    creating a SLIP connection, but this time Linuxconf creates or modifies /etc/sysconfig/network-scripts/ifcfg-plip0
    and /etc/sysconfig/network-scripts/chat-plip0 (for the first PLIP connection).
    Because PLIP is used over parallel lines, there are no phone numbers or modem
    settings to fiddle with.


    # NFS FILE SERVICES


    NFS file services are the Linux world''s most common solution to the question,
    “How can David access files on my machine?” While you may not want David to access
    your files,'
