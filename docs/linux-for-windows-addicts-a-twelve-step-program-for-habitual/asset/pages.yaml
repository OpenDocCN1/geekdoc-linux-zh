  md: '# Chapter 8: Step 5: Manage Users and Groups


    ple, there''s a command-line utility called userdel that can delete a user''s
    account (and optionally, all the files in their home directory). You can also
    edit the /etc/passwd and /etc/shadow files—just delete the lines defining the
    account to delete the account. Removing the home directory and mail spool file
    (found in /var/spool/mail) can be done manually from the command line or an X
    Windows file-management tool.


    However, deleting the user account and the files in the home directory aren''t
    the only things you should think about doing. For example, if you delete the account
    that user may have created files elsewhere, you''ll have to change their ownership.
    You can tell that a user account has been pulled out from under a file when you
    see a directory listing includes information like this:


    ```

    -rwxr-xr-x  1502      customer      388      May 13 12:40 tasks.sh

    ```


    In the places where you''d ordinarily expect the owner''s name, the number 502
    appears. The account that corresponded to user ID 502 has been deleted. What to
    do now? It''s certainly possible that you''ll just want to remove the file, but
    if you want to assign it to another user, you can do that easily using the chown
    command:


    ```

    root@romans:~ /home/demo~ chown broadcom tasks.sh

    ```


    The command listed above changes the owner of the tasks.sh file to the user named
    broadcom. You could also do this for all the files in a directory. Check the man
    page for more information about chown.


    # MANAGING GROUP ACCOUNTS


    The primary reason groups are used on Linux systems is to give a set of people
    access to files. While group membership can be used for a variety of other tasks,
    file ownership is the most common reason for their existence, and in many installations,
    it''s the only reason for their existence. Let''s take a closer look at how to
    create them, and how to modify and remove them.


    # Group Account Philosophy


    Recall from Chapter 3 (or go another look, if your lecitin intake isn''t adequate
    or you''ve eaten too many meals, as I have, prepared in aluminum pans) that file
    and directory ownership and access is figured three different ways. Each file
    or directory has a user account owner, a group owner, and a set of permissions
    that apply to the rest of the world.


    This is an adequate way of enabling or disabling access to the systems (something
    I''ll discuss more in Chapter 14). It does require you to think a little bit about
    where to place files and what to put groups, if you find yourself hopelessly entangled
    in a mass of cryptically named groups with uncertain purposes. There are a few
    things you should know about group creation before you start.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    # User Accounts Have One Primary User Group


    Each user account has an associated primary user group. This means, for example,
    if a user creates a file, by default their user account becomes the user owner
    and their primary group becomes the group owner.


    # User Accounts Can Be Members of Many Groups


    Having a primary group does not prevent the user from being a member of another
    group. Or another. Or another. A user can be a member of one, some, or every group.
    Just because you can make a user part of every group, doesn''t mean you should
    do so. Your approach should be to limit groups to users who have a need to join.


    # Groups May Be Group Members


    This allows you to make large groups out of smaller groups. For example, if the
    Sales and Marketing department consists of the three organizational groups, Sales,
    Marketing, and PR, there''s no need to add each group member to both groups. Create
    the groups first, and then make those groupnames members of the s_and_m group
    (or whatever you choose to call Sales and Marketing on your system).


    # User Groups Can Be Password-Protected


    But in networks I''ve seen, group passwords are rarely used. End users seem to
    be fully challenged by having and remembering their account password; add too
    many passwords and they''ll start forgetting things like their home address and
    phone number, Aunt Genette''s birthday, and rest them they''re supposed to use.
    That''s generally considered a bad thing. But be sure you think the password protection
    for groups, but see the ramifications through.


    # User Groups Should Have Sensible Names


    While I see networks with poorly chosen user account names, named user groups
    seem much more prevalent. I''ve always assumed this is because user names are
    generally related to the users'' real-life names, and this reality keeps the administrators
    a little in touch. But group names are often created for a set of people conceptually
    rather than organizationally.


    Because groups are most used for access to files and directories, consider using
    group names that reflect this purpose. For example, if /home/departments/ap needs
    to be accessed by some, but not all the people in three different departments,
    it might be sensible to call the group access_home_ap and include only the people
    who need to access those directories. The "access" groups easily convey both function
    and the specific area where they provide permissions.


    The bottom line is to think about what you need to do before doing it. Group management
    isn''t any more difficult in Linux than other operating systems, but like the
    others, it works best if the rationale is given some brain cycles before the keystrokes
    are made.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Creating Groups


    Creating groups in Linuxconf is a simple matter. Go to the Group Definitions option
    and click the Add button. Enter the group''s name and the numeric group ID you
    wish to use (which should be a number greater than 100 if you''re adding user
    accounts to the group). Enter the names of any members who will not be listing
    as their primary group. This information will go into the /etc/group file, where
    each group name is listed in the form: username:password:groupID:members. For
    example


    access_payroll::814:dedood,jones


    This line defines the "payroll" group, which has no password (there''s nothing
    between the first and second columns), the group ID 814, and includes users dedood
    and jones, for whom these are alternate groups, not the primary group (primary
    groups are specified on a per-account basis in the /etc/passwd file).

    The directory of the Group Addition box makes its changes to the /etc/linuxconf
    file. It allows you to specify whether each primary user of the group should have
    a different directory created, and if so, what their parent ("home base") directory
    should be. You may also specify the default permission settings for these home
    directories (see Chapter 14 for more information on file and directory permissions).


    # Adding and Removing Users


    Users may be added to the groups when you create either the users or the groups,
    as described, or later. You may use the Linuxconf interface and add users to the
    Alternate Members field (or remove them), or if you prefer, you can use a text
    editor to add or remove members from the appropriate lines in the /etc/group file
    and the /etc/gshadow file.


    # MANAGING THE ROOT ACCOUNT


    As Hope I''ve already made clear, the root account is special. It''s not a user
    account, and nobody should be using it as a primary account. Some administrators
    do to great lengths to make use of the root account difficult by selecting harsh
    terminal color schemes, not enabling productivity features such as command completion
    and command history, or other unfriendly measures.


    I don''t think this is necessary in most cases, and there are downsides to each
    of these solutions. For example, some people feel that the root shouldn''t have
    any customized shell files or notices, and this is a reasonable perspective, because
    we don''t want to make it easy to run unnecessarily as the root user. On the other
    hand, having command completion can prevent errors from being introduced by the
    human who''s logged in as root.


    Because root is all powerful on a Linux computer, a person can accidentally delete
    far more than they ought to, or restart the system at the wrong time, or fall
    into a myriad of slipsups that crop up in my nightmares. To avoid these problems,
    I''d like to make a few suggestions for using the superuser properly and avoiding
    unnecessary use of the superuser.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    # Using Root Properly


    The first part of managing the root account is being sure you''re using it properly.
    Windows administrators and home users of NT or Windows 2000, many of whom are
    accustomed to using the Administrator account as much of the time (I confess leaving
    my NT servers logged in as Administrator far too often), should take this opportunity
    to break themes of the habit. There are a few ways of doing this.


    # Know Why You''re Using Root


    Why are you logged in as root right now? What task are you performing, and do
    you really need to do it? There are good reasons to be root, of course. Viewing
    log files that are off limits to others, killing recalcitrant jobs that won''t
    respond to their owners, and scheduling cron jobs to execute tasks periodically
    are examples of things that are appropriate for root to do.


    # Don''t Kill Root


    I shouldn''t have to tell you, but please don''t ever delete the root account.
    You can recognize it in the /etc/passwd file; it should be the first entry and
    will look something like this:


    ```

    root:x:0:0:root:/root:/bin/bash

    ```


    Don''t delete that entry. Don''t kill it from Linuxconf or another management
    tool. It is nice to the root account. Say nice things about it when you use it.
    Press the keys gently when you''re entering your password. Don''t hurt it.


    # Relinquish the Root Password to Few People as Possible


    I''ve worked in environments where executives insisted on having the superuser
    passwords on all the systems in the company, and it always made me nervous, especially
    as I spent time helping them recover from some mortal wound they''d given their
    own desktop systems. Now, being an executive doesn''t necessarily make you a bonehead
    (though there may be a correlative, rather than causal, relationship between the
    two states), and there are plenty of management employees who are capable of handling
    the root account.


    In the spirit of the "Know Why You''re Using Root" section above, those who want
    the root password should have it. And while you may not be able to tell your managers
    you won''t give them the root password, you should be able to define a restricted-access
    policy that makes sense for your organization.


    And if you''re concerned about the number of people who have root password access,
    you might try the passive-aggressive approach: Change the root password and inform
    only the people who actually needed it. If somebody comes to ask why they can''t
    get in, say,"Gosh, I just changed it because we were concerned that it had been
    compromised. What did you need to do as root?” If this doesn''t work, give them
    my email address and I''ll give them what for. Heh, he, heh.'
