    # /usr/src


    The /usr/src tree contains the Linux source code. This is important because you
    may someday wish to compile a kernel for yourself (and in fact, we''ll be doing
    that in Chapter 6). When you install a distribution onto your PC, it should populate
    the /usr/src tree with the kernel source files and headers. If you want to recompile
    this kernel, you can do so from the files contained here. If you want to download
    and compile a newer kernel, on the other hand, it''s recommended that you do so
    in a directory you control, such as a specific place in your home directory. This
    will avoid confusion by any programs expecting the original header files hanging
