  md: '# Linux for Windows Addicts: A 12-Step Program


    terminal emulators available. By toggling between these terminals, you can initiate
    multiple interactive console sessions, which can be convenient.


    For example, you could start the kernel compilation process on one virtual console
    and switch over to another virtual console to check your email. This isn''t a
    big deal to those of us who are used to Windows NT and 2000, which multitask just
    fine. Linux does not go without the GUI, which means less overhead on the system
    and less likely of crashing (remember, Microsoft moved the video drivers into
    the kernel mode to improve performance starting with NT 4.0). You don''t need
    to have X Windows running or even loaded to be able to switch consoles like this:


    The Support For Console Virtual Terminal option should be enabled for normal workstation
    or server operation. tells Linux the system console should be displayed and connected
    from a monitor and keyboard to the system. That means the set of virtual terminals
    used in the previous option is the standard mechanism for human interface with
    the system. So would you ever select something else? If, for example, you have
    a management console connected to several serial ports, you might want those servers
    to convey information and receive instructions via these ports instead of the
    virtual terminals. I haven''t personally used this configuration, and I doubt
    you will. So just enable this feature,?


    Enabling the Standard/Generic Serial Support option enables standard serial ports,
    while disabling it disables standard serial ports. "Standard" serial ports are
    found on most PCs; nonexistent hardware includes devices as boards to add additional
    serial ports. Unless you want to disable your serial ports altogether (a common
    thing to do on servers that don''t have monitors, UPS monitoring devices, or other
    hardware connected to the ports), or use nonstandard hardware, you ought to enable
    this option.


    If you decided that the system console messages—errors and other system messages—sent
    over a serial port, perhaps to a management console or to a printer, you should
    enable the Support For Console On Serial Port option. If you do so, you''ll have
    to add a line to the LILO configuration file, /etc/lilo.conf, that looks like
    this:


    ```

    console=ttyS1,9600 console=tty0

    ```


    The first command specifies that the console messages will go to the second virtual
    console (the number starts with 0, so 1 is the second port) at 9600 baud. The
    second command indicates that the default is the first virtual console, but the
    serial port is still active. This configuration could be used to track the actions
    of system crackers, because they can cause you to cover their tracks elsewhere,
    but they can''t erase prints of system messages. For more information, see the
    file linux/Documentation/serial-console.txt.


    Enabling the Extended Dumb Serial Driver options allows you to select from the
    five dumb driver options that follow. Unless you expect to need one of these options
    (none of which are needed with most configurations), disable this. On the other
    hand, if you have hardware that has more than the four serial ports (known as
    COM1-COM4 in the Windows world), you should enable the Support More Than 4 Serial
    Ports option. Otherwise, disable it. If your serial port hardware allows more


