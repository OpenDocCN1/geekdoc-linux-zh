    # Performing netlogon Setup


    This set of options is used when the Samba system is acting as a login server
    for the domain. You can get to this portion of the configuration by choosing Netlogon
    Setup from the Config-Network-Tasks-Samba File server tree. Enter a name for the
    share in the Netlogon Share Title field, and be sure This Share Is Enabled option
    is selected.


    Specify the directory where you would like to keep the netlogon file in the Directory
    To Export directory. You may also specify a logon script, path, drive, and home
    relative to this exported directory.


    Specify a Microsoft-style logon script to run when the user logs in. This can
    be either a .bat file or a .cmd file, just like you''d use on a Microsoft server.
    Indeed, it should be formatted using a DOS-based editor to ensure the file uses
    the redundant Microsoft carriage return/linefeed commands to end each line.


    The script can contain NET statements to map network drives, or perform any other
    tasks you''re used to including in your Windows login scripts. You can use the
    %u, %g, or %m variables, for example, to create user-, group- or system-specific
    logon scripts.


    Use this field to designate the directory in which Windows 95 profiles are stored.
    Don''t make it put in this home tree; give it a place of its own. The client systems
    will reference the user.dat and user.man files, and will load their Desktop, Start
    Menu, Programs, and Network folders from the path you indicate here.


    Use this field if you have Windows NT or 2000 workstations that need to know what
    drive letter to use to connect to the home directory. The format is the drive
    letter and a colon: h).


    Specify the user''s home directory. The default entry is


    \\%USER%%


    This sets the home directory to point to the directory named for the user account
    on the home directory server. If your home directory is located in a different
    directory structure, change this field to reflect that.


