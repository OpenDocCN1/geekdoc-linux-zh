  md: '# Linux for Windows Addicts: A 12-Step Program


    | Setting Name | Recommended | Safest If Undecided |

    | --- | --- | --- |

    | Symmetric Multi-Processing Support | Y if multiple CPUs | N |


    The help text associated with the Processor Family explains which processes belong
    to which families. You can successfully choose a processor family equal or older
    than the family used in your system (if you''ve got a Pentium III, for example,
    you can use the most appropriate setting, PPro/x86MX, or an earlier setting, such
    as Pentium, 486, or 386.) This might be useful if you''re sharing a kernel between
    systems and to use the least common denominator or for what type of CPU you are
    using (tsk, tsk).


    The next three options are not likely to be useful; the Intel P6 Microcode Support
    option allows updates to be made to the processor microcode for the Pentium Pro
    processor and its successors. The Model-Specific Register Support and CPU Information
    Support settings allow access to specific processors on SMP systems.

    If you have RAM totaling 1GB or less, select Off. If you have more than 1GB but
    less than 4GB, select 4GB. If you use more than 4GB, select 64GB.


    The Memory Type Range Register (MTRR) feature shown in the Pentium Pro processor
    and offers performance gains for systems using those chips and successors. Some
    non-Intel CPUs can use this feature as well, if you have a recent CPU, it''s worth
    enabling MTRR Support.

    The Symmetric Multiprocessing Support option provides support for multiprocessor
    machines. Disabling this option means the system will use only 1 processor, even
    if it has more. Enabling symmetric multiprocessing (SMP) will work on multiprocessor
    machines, regardless of the number of CPUs.


    # General Setup


    These options are a bit of a hedgepodge, covering everything from PCI bus behavior
    and general parallel port support to the binary file formats understood by the
    kernel and Advanced Power Management (APM). The suggested settings are listed
    next.


    | Setting Name | Recommended | Safest If Undecided |

