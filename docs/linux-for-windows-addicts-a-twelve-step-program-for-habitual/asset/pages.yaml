  md: '# Linux for Windows Addicts: A 12-Step Program


    The Routing Messages option allows you to create a “character special file” called
    /dev/route in the system you will place some routing information. If you enable
    this option, you must log on to the system and use the mknod program to create
    /dev/route using this command:


    ```

    root@romans ~> mknod /dev/route c 36 0

    ```


    This command may seem a little cryptic, but it''s just telling Linux to create
    a special file called /dev/route, that is a character special file (it gets written
    to one character at a time), and that identifying “major number” is 36 and “minor
    number” is 0. The major and minor numbers identify the function of the special
    file to the operating system; a current list of the device files defined this
    is located in the Kernel directory (usually linux/Documentation/devices.txt).


    If you enabled the Kernel/User socket above, enable Netlink Emulation as well.
    It won''t even be an option if you disable the netlink socket.


    It''s truism that these days there are more crackers (by which I mean hackers,
    unrefined people from rural areas) with more time on their hands than there are
    administrators, let alone network security experts. Given reality, you have to
    think of network security we think of securing a house or a car: You can''t really
    expect to achieve impenetrability, but you want to avoid being too attractive
    to the bad el, and you certainly don''t want to make it easy for them to take
    or crash things.


    That is actually related to the point at hand, that a simple, relatively low-powered
    Linux machine can function as a network firewall, given the proper configuration.
    While there are Linux-based products that provide this functionality with prettied-up
    administration options, one may also configure things manually, and one way of
    doing this is by enabling this option in the kernel.


    A network firewall allows you to isolate certain networks using a set of rules
    that defines which traffic is permitted and which is denied. The firewall supported
    by this kernel configuration option is a packet filter, which means that the firewall
    can permit and deny packets based on where they come from, where they''re going,
    and the packet type.


    If you want this system to act as a packet filtering firewall, Enable Packet Filtering.
    Disable this option on ordinary workstations and servers. If you enable it, a
    submenu IP: Netfilter Configuration will appear at the end of the Networking options.
    You''ll want to open that submenu and enable the first two options: Connection
    Tracking and IP Tables. The other two options are for backward compatibility and
    shouldn''t be necessary if you''re setting up a new Linux system.


    The Socket Filtering option allows programs outside the kernel to filter the packets
    that travel through specific sockets. These filters can be configured and passed
    to the kernel for individual sockets, but this option is really targeted to programmers.
    So leave this option disabled unless the contents of linux/Documentation/networking/filter.txt
    give you enough information to do something with it.


    Enable the Unix Domain Sockets option, which allows various Linux programs to
    talk to each other. This option should be enabled even if you don''t plan to network
    a system,'
