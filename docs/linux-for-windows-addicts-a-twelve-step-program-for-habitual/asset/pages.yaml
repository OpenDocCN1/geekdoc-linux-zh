  md: '# Chapter 12: Step 8: Manipulate Email


    **Support Bogus Mail Clients** Enabling this option tells remind to bestow a little
    grace upon messages that come from mail sources that don''t generate SMTP HELO
    commands, which are the introductory messages sent by a delivering system to a
    receiver. In my opinion, you shouldn''t have to enable this option. But I''m cold
    and callous, especially when it comes to SMTP.


    **Domain Aliases** If you want your email address to be valid across multiple
    domains, you can enter as many machine names (each with a domain name you wish
    to use) in the Aliases For Your System fields. Click the Add button to add additional
    fields in the unlikely event that three isn''t enough.


    # Domain Routing


    Special routing is only needed if you have some reason to use a non-default routing
    path. In other words, if you plan to use some type of alternate way of getting
    mail to a particular host, you should add a "special (domain) routing" record.
    By selecting this option from the Config-Networking-Server Tasks-Mail Delivery
    System (sendmail) menu. For each destination you wish to designate, you should
    enter:


    +   ▼ The destination hostname


    +   ■ The alternate mail system that will be used to deliver messages to that
    destination


    +   ▲ The mail gateway protocol used to deliver messages to that mail system


    There''s also a checkbox available that allows you to use this entry as a template
    for any host in the same domain or one of its subdomains. You may override this
    template on a host-by-host basis by specifying special routing for particular
    hosts.


    # Masquerading Rules


    In the context we''re currently discussing, masquerading is rewriting a message''s
    "from" information when it''s being forwarded. This can be useful for fixing messages
    coming from systems that don''t properly create "from" address, or for making
    all outgoing messages appear to come from the same corporate domain, even if they
    originate from an internal domain.


    To create a masquerade rule, enter the following information:


    +   ▼ The original from address that will always be rewritten (this can be a user
    address or just the @domain portion if the rule should apply to all users in that
    domain)


    +   ■ The new from address that the messages will receive (this can also be a
    user address or just the @domain portion if the rule should apply to all users
    in that domain)'
