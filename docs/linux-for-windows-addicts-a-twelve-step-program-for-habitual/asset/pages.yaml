  md: '# Linux for Windows Addicts: A 12-Step Program


    (And, I have to point out, hoping to gain some goodwill from users in the process.
    You decide whether I''m being more cynical than they are.)


    Finally, many people contribute to the Linux community without writing a line
    of code. The Linux Documentation Project, for example, allows people with good
    communication skills to help others. There are many who work to advocate the use
    of Linux, and others who actively work to clear up the fear, uncertainty, and
    doubt (FUD) created when companies trash Linux with erroneous claims. And there
    are some who provide links to Linux-related stories on the Web, information on
    security issues, and the latest developments on kernels, window managers, and
    the like. Just because one isn''t a hacker doesn''t mean one can contribute.


    # WHAT''S A DISTRIBUTION?


    These days, there are literally dozens of different “distributions” of Linux,
    including names you have heard of: Red Hat, OpenLinux, Linux-Mandrake, Slackware,
    SuSE, and TurboLinux. There are others you are not familiar with: Yellow Dog,
    BasilLinux, Ba Penguin Linux.


    Because of the straightforward distribution permissions in the licensing agreement
    that comes with Linux, distributions are easy to make, and many are targeted at
    types of users. Windows2000, for example, is supposed to be easy to install. Now,
    I think one reason many people believe Linux is easily installed is that they
    haven''t installed themselves—with the computer. But if you''re afraid of the
    installation process, perhaps that distribution has something to offer.


    Other distributions are also easy to install: OpenLinux, for example, has a very
    automated installation process (it allows you to play Tetris while you wait for
    files to be copied from the CD during the installation process). Red Hat and SuSE
    have different types of installation tools intended to make things easy during
    installation.


    Many people like the Slackware distribution, which has been around for years,
    because it eschews some of these installation tools; it tends to be a distribution
    used by people who want to get their hands dirty. Its process isn''t difficult,
    it just less hand-holding than some of the other distributions.


    The bottom line is that no distribution has a lock on every good idea in the Linux
    world. Most distributions include slightly different sets of installed applications
    (some, like SuSE, just about out there!) and have a somewhat different look and
    feel. When you get that past, though, they''re all pretty similar. It''s a little
    bit like versions of Windows you get with a new computer. They''re all Windows,
    after all, but most hardware vendors customize the setup, the set of installed
    applications, and the drivers and utilities. Sometimes these are more difficult
    to install than, but if you''re having trouble, just ask a 12-year-old, and you
    should be okay. That''s a joke, people...chill out a little, okay? Sheesh!'
