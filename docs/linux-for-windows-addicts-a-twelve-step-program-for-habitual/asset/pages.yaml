    # Kernel Configuration


    The next step is to configure the kernel, which means telling it which features
    you want to include, which you want to omit, and which you wish to build as modules.
    There are three ways of performing this task: Using a prompt-driven command-line
    interface; running a text-mode utility that gives menus of kernel options; or
    executing a Windows application that gives the process GUI.


    # make config


    The bare-bones approach to configuring the Linux kernel is to use the make config
    command. This runs a script that gives you the opportunity to set each option,
    by by one. The interface is a purely text-based affair, and the process is entirely
    linear; if you make a mistake, you''ll have to rerun the make config command until
    you get the options way you want.


    On the other hand, make config will run on the most bare-bones installation of
    Linux; it requires neither Windows nor even the text-mode libraries that give
    make menuconfig user-friendliness.

    When you run make config, some script messages will appear, followed by some configuration
    information and your first choice:


