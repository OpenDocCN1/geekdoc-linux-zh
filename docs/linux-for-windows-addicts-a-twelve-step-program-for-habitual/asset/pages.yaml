  md: '# Linux for Windows Addicts: A 12-Step Program


    **group ID** A numeric value associated with a group name. Part of the file ownership
    and permissions system is based on knowledge of the group ID, and each file directory
    in the Linux filesystem has a group ID assigned as an owner. See also user ID.


    **high availability** High availability refers to the practice of making systems
    accessible to additional users and jobs, even when under heavy load or when experiencing
    failure. High availability systems make use of redundant hardware and fault-tolerant
    software to continue operation despite component failures.


    **home directory** Each user on a Linux system has a directory designated as their
    home directory. These are the directories in which users are placed by default
    when they log in, and where users ordinarily keep their files. Some configuration
    files are found in the user''s home directory. The shorthand for the current user''s
    home directory is the tilde (~). You may also refer to another user''s home directory
    using the tilde and their account name (~-username).


    **KDE** A desktop environment that looks and feels similar to the familiar Windows
    interfaces. The KDE project can be reached at http://www.kde.org/. See also environment.


    **kernel** The kernel is the portion of the operating system that manages interfaces
    with the computer hardware. The Linux kernel can be recompiled by users to maximize
    efficiency and include all desired features.


    **less** Less is a command-line utility that displays the contents of a file one
    screenful at a time. Less also allows the user to reverse the scrolling of the
    information, unlike cat, which doesn''t allow you to scroll backwards or forwards.
    Less is also unlike more, which displays one screen at a time, but can''t scroll
    backwards. See also more.


    **LILO** The Linux Loader is a program that boots the Linux kernel when the system
    starts up. It is capable of booting into other operating systems, such as Windows,
    so users can opt for a dual-boot system that allows a decision at startup time:
    Which OS I use now?


    **Linus Torvalds** Linux is the father of Linux, the open-source operating system
    he started while still at university in Finland. He is currently an employee of
    Transmeta, a semiconductor firm,'
