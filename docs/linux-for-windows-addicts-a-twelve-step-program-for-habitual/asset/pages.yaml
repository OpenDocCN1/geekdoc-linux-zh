  md: '# 278 Linux for Windows Addicts: A 12-Step Program


    The Default Service option allows you to provide some type of service to those
    who request a service that can''t be found. See the Linuxconf help for a little
    more information about this option, but the idea is instead of giving users an
    error message when they try to access a service that isn''t available, you can
    give them read-only access to some public area. Think of the warm fuzzies they''ll
    feel when they don''t get an error message. On the other hand, the confusion of
    this will engender when they ask for a printer and get a directory of press releases.


    If you enable the Show All Printers option, every printer defined in the /etc/printconf
    file may be browsed by default. And the WinPopup Command is command the Linux
    server is told to run when it receives a WinPopup message. The help text suggests
    a method for conveying this information to the Linux user that simply pulls the
    message into an X Windows text editor. I''m not a big fan of WinPopup messages,
    so I might leave this field blank.


    # Fun with Samba Variables


    I''ve mentioned the %u and %h variables you can use to tailor Samba scripts and
    messages. Variables like these make it possible to automate many tasks or make
    specific to a user, a protocol, a group, a system, or one of the other entities
    represented by these variables. Here''s a more exhaustive list, complete with
    short descriptions (more information can be found using the man5 samba.conf command.


    | Variable | Description |

    |---|---|

    | % | Attempts to recognize the remote system''s OS architecture |

    | %d | Current server process id |

    | %g | User %u''s primary group |

    | %G | User %U''s primary group |

    | %h | IP hostname of the Samba system |

    | %H | User %u''s home directory |

    | %I | Client machine''s IP address |

    | %L | Samba server''s NetBIOS name |

    | %m | Client system''s NetBIOS name. |

    | %M | Client system''s IP hostname |

    | %N | NIS home directory server |

    | %p | Service''s home directory |

    | %P | Current service root directory |

    | %R | Negotiated protocol level |

    | %S | Current service name |

    | %T | Current date and time |

    | %u | Current service user name |

    | %U | Desired client session user name |

    | %v | Samba version number |'
