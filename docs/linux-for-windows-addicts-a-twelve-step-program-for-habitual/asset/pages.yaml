  md: '# Linux for Windows Addicts: A 12-Step Program


    Enabled box, and make the share visible from a network browser by checking the
    Browsable box.


    The Inherit Settings From Share option gives you the chance to use an existing
    share as a template for a new share; the new share will use the existing share''s
    configuration by default, but you may change settings in the new share as you
    see fit.


    The Directory To Export is the path from root to the directory that will be treated
    as the top level of the disk share. As with any disk share, you want to make sure
    you won''t be able to branch over into places that shouldn''t be. Creating a disk
    share of the / directory on a Linux system is not the safest thing to do, for
    example.


    # Disk Share Access


    Enable the Public access to allow anyone who can browse the SMB network to access
    the disk share. The public access level is defined by Samba''s guest account setting.
    If this option is selected, you can also enable the Guest Only to force all users
    to access as guest users. The Writable option allows users to create files and
    directories in the share, subject to their effective permissions.


    As with home shares options, the Allow Hosts and Deny Hosts fields allow you to
    enter groups of hosts which you wish to allow or deny access to the share. Enter
    a list of hosts or IP addresses separated by commas, and/or a set of network numbers.
    The EXCEPT argument may be used to indicate one or more addresses from the specified
    range that should be excluded from the allow or deny rule.


    If you leave these blank, the system''s default behavior is to allow access from
    any system. If there''s overlap between the two fields, the tie goes to the Allow
    Hosts rule.


    # Disk Share Users


    The only difference between the user configuration for the home directory share
    and other disk shares is the Admin Users field. This field should contain the
    names (or the group name containing them) of users who should have Administrator
    access to the share. These users will enjoy unrestricted access to the share,
    and will be equivalent to the superuser on share, so don''t make just anybody
    Admin.


    # Disk Share Scripts


    With the exception of the Magic Script field, these scripts are identical to the
    ones described in the home share section. The first four fields contain the scripts
    that run: when someone connects to the service; as root when someone connects
    to the service; when someone disconnects from the service; and as root when someone
    disconnects from the service.


    The magic script is a script that can be opened from a client station; when it
    is closed, the script is executed on the server. This feature is experimental
    in the version of Samba I''m working with, so I suggest you take the Samba''s
    advice and don''t rely on this feature!


    # Disk Share Features


    There are some interesting options contained in the Features section of the Linuxconf
    configuration tool for Samba disk shares. For example, the Force User and Force
    Group options allow you to specify a single user and group.'
