    # Emacs


    Emacs is another old favorite for many Unix users. It offers a menu system, context-sensitive
    help, and complete extensibility (provided you or someone useful to you knows
    Lisp\). Emacs uses the CTRL, SHIFT, and ALT keys, the F10 key.... If there''s
    a key combination available, it''s likely Emacs makes use of it in some way.


    Most popular text editors have several to many non-text-editing features, but
    Emacs really takes the cake for extended functionality. If you''re looking for
    a text editor that isn''t similar to a mailer—it is a mailer, Emacs might be for
    you. If you''re looking for a text editor that can run in text mode but takes
    advantage of X Windows features, Emacs might be for you (though many editors go
    "both ways"). If you''re looking for a text editor with calendar and diary features,
    not to mention web-browsing capabilities, Emacs might be for you. And certainly,
    if you''ve got the time and inclination to bend its power toward your purposes,
    it''s a mighty ally.'
