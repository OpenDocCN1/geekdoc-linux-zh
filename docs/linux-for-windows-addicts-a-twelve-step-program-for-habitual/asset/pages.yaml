    system. As far as the Linux system knows, that makes a bit confusing, and because
    the ls command doesn''t show hard links, it''s even less likely that you''ll want
    to use hard links.


    # SCHEDULING MAINTENANCE


    While Windows 98, NT, and Windows 2000 have task scheduling features, they''re
    somewhat limited to what you''ll find on any Linux system. While Windows attempts
    to insulate the user from the nitty-gritty tuning and tweaking by simply providing
    ways to launch a program on a schedule, Linux allows you to run existing programs,
    shell scripts of your devising, or anything your heart desires. This makes maintenance
    tasks very easy to schedule.


    # Tools for Scheduling


    There are two primary tools Linux for scheduling jobs. The at commands allow execution
    of jobs, while cron jobs execute jobs on an ongoing, scheduled basis. While both
    are useful for administrative and other tasks, you''ve got a better chance of
    never using an at command than a cron job.'
