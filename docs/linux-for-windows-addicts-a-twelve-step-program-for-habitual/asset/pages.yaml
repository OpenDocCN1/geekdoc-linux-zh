  md: '# Chapter 1: Confessions of a Former MS Junkie


    emulators available, so you can run many of the old programs you may have—even
    some that won''t run on the current versions of Windows.


    # Applications


    But there''s more to Linux than some washed-up old programs gathering dust on
    your shelves. You want word processors, electronic mail, presentation graphics
    tools, spreadsheets?You''ve got several to choose from. You want a web browser?
    No problema. You want drawing and image editing programs, MP3 sound tools, databases,
    and programming tools? Done.


    There are thousands of applications available for Linux—and hundreds of them are
    ever useful. There''s lots of overlap in some areas, where you''ll find 10 solutions
    to the same problem. And there are some areas in which aren''t really any options
    yet viable. This isn''t unlike the Windows world. Many Linux programs are polished,
    well-documented, and many of them could use some improvement.


    Business suites are particularly noteworthy with respect to the presence of applications
    for Linux. Microsoft has all sewn up this market in the Windows environment with
    its Office products, which aren''t available on Linux. Unless Microsoft decides
    to port Office to Linux, you''ll have to use another product if you use Linux.
    Most of the major suites include Microsoft file format compatibility;it''s standard
    operating procedure for Microsoft to change these formats with every software
    release, forcing their own users to upgrade and causing users of other products
    to create ve.

    Personally, I think Microsoft''s interests would be best served by offering their
    own Linux distribution and port their major applications to it. If they can win
    the suite war on the way they did on the Mac OS, Microsoft could balkanize applications
    on Linux, at least among business buyers.)


    The point is that since memos, sales presentations, letters, financial information,
    and other documents are often sent in Microsoft formats, you''ll have to take
    this into account when you consider migration to Linux. Windows has interoperability
    features and supplemental tools, but in the end, Microsoft has a reason to maintain
    proprietary files, networking protocols, and anything else that could be shared
    between machines. As I write, writing that reason is at 89½. If Microsoft wants
    to continue to sell to its existing customers, it has to make sure its existing
    customers can''t move to something else.


    # WHERE DID LINUX COME FROM?


    Linux was created by Benedict Torvalds, commonly known to people in the Linux
    community (including those who''ve never spoken to him, traded email with him,
    or even heard him speak) as “Linux.” He began developing Linux as an alternative
    to Minix, a small Unix-like operating system used mostly in academic settings.
    At the time, Linus was a student in Helsinki, Finland. Even from the beginning,
    although was clearly the clear architect and developer, he solicited the input
    of interested parties around the world.'
