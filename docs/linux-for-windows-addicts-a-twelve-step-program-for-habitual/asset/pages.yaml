  md: '# Chapter 13: Step 10: "Make" More Software


    # Make


    The next step is running the **make** command. This is not a hard-and-fast rule;
    each tool you build should be treated as its own entity, with its own set of installation
    steps. All the same, this is very often the next step.


    Make is a program on your system that knows how to create a usable set of program
    files given some input files and some knowledge of your system. The configuration
    file is largely responsible for providing it for **make**, and by running it now,
    you''re telling it to go out and compile the files as it sees fit. While there
    are some options you can use with the **make** command (remember the different
    options when building the kernel in Chapter 6?), that''s often unnecessary.


    Looking once more at the Bluefish example, I had run the configuration script,
    and the INSTALL file tells me that the next step is to run **make**:


    ```

    millerm@romans ~/bluefish-0.3.6> make

    ```


    Notice that there''s no "dot-slash" in the front of the **make** command, which
    isn''t located in the current directory. It runs from its home (usually /usr/bin/make),
    using the files in the current directory for instructions.

    The **make** process can be time-consuming, but at least many gratifying messages
    scroll the screen as it does its work. While you may not be able to understand
    what it''s doing, it''s a little visual reassurance that something is happening.
    When it''s done, you''ll get a pretty unassuming message and will be returned
    to the shell prompt.


    # Make install


    The last step is installing the software you just built onto your system. That''s
    a fairly automated process with most software you''ll find, because the **make
    install** command will copy the files to the correct places on your system. Before
    you run **make install**, though, you normally need to be the superuser, because
    software usually ends up in directories that mortals don''t get access to.

    The last step to the installation of the Bluefish software is to become root and
    run the **make install** command:


    ```

    millerm@romans ~/bluefish-0.3.6> su

    Password:

    root@romans ~/bluefish-0.3.6> make install

    ```


    More messages scroll across the screen, and once I''m at the shell prompt again,
    I use the **exit** command to become my mortal self again. Now I can run the tool
    by issuing the following command from within xterm:


    ```

    millerm@romans ~/ bluefish

    ```


    This brings up the Bluefish editor as shown in Figure 13-6.'
