    # environment variable


    A variable whose contents are shared by the whole environment—usually the shell—is
    an environment variable. Scripts and programs can use these variables to run correctly
    in any given environment.


    # free software


    This term means different things to different people. Some consider software without
    a monetary cost to be free. Others believe that software is free if users are
    free to do with what they want, including giving it to their neighbors. You make
    the call. *See also* Free Software Foundation.


    # Free Software Foundation


    The PSF (http://www.fsf.org/) is an organization committed to the proposition
    that software should give users the freedom to run the program for any purpose,
    the freedom to examine and alter the source code, the freedom to redistribute
    copies as you see fit, and the freedom to enhance and redistribute the improvements
    for mutual benefit. *See also* Richard Stallman.


    # FUD


    This acronym refers to "Fear, Uncertainty, and Doubt," which are three of the
    less honorable tools companies use to combat a rival''s perceived advantages.
    For example, Microsoft attempted to spread FUD by releasing the Linux Myths document.


    # GNOME


    GNOME is an open source desktop environment in widespread use, and generally admired
    for its attractive appearance and extensive flexibility.


    # GNU


    This acronym stands for "GNU''s Not Unix." It''s not at all mandatory that you
    think that acronym is funny. The GNU Project is devoted to creating a complete
    Unix-like operating system based entirely on free software. *See also* Free Software
    Foundation.


    # grep


    Grep is a command-line utility used to find a string of characters, sometimes
    called a *regular expression*, in a file or set of files. It''s commonly used
    for identifying a configuration file that contains a known parameter or for retrieving
    a text file based on part of its contents.'
