  md: '# Chapter 10: Step 7: Enable Printing


    mand-line utilities. I''ll describe change what''s available to you in those programs,
    and then I''ll give you some idea of what is out there.


    # Standard Management Tools


    The fundamental tasks that need to be performed for printer management include
    starting and stopping the print daemon (to implement configuration changes, for
    example), testing the queue, viewing the contents of the queue, removing some
    or all the jobs from a queue, and checking accounting information, if any. The
    following commands allow you to perform these tasks in Linux.


    # printtool


    We''ve spent most of our time in this chapter working from the context of printer
    configuration done in printtool. Two functions I haven''t talked about so far
    are printtool''s lpd management and its testing capabilities.


    Once you''ve made a change to a queue''s configuration, you''ll have to kill the
    current lpd daemon, which is running with the old configuration information, and
    restart it with the new configuration information. This can be done from the command
    line, or simply go to the lpd menu within the printtool and select start lpd.
    That''s all there is to it!


    You can also test the queues on your Linux system from printtool. Select one of
    the print queues from the main screen, and then go to the Tests and select either
    Print ASCII Test Page or Postscript Test Page. These options dump a text file
    or a Postscript file to the printer, so you can make sure your system can handle
    both types of data.


    # lpq


    The lpq command allows you to examine the print spool associated with one of your
    print queues. If you wish to examine the printer that''s currently defined as
    your default printer, you don''t have to specify a name. On the other hand, if
    you want to specify a particular non-default queue, you can do so using the -O
    option, as shown in this example:


    ```

    millern@romans -> lpq -l -Poj

    ```


    This command will allow you to view the contents of the "oj" print queue. Notice
    that a -l option is listed as well. This option tells lpq to provide a long version
    of the queue information. If you don''t specify the -l option, lpq will give you
    a single line of information for each job queued on the system.


    The lpq information includes things like who created the job, what its status
    is, its job ID. If there are no entries in the print queue, lpq will tell you
    that.,


    # lprm


    The lprm command removes a job from a print queue. If you''ve got a big job that''s
    causing some problems, or if you realize you printed the wrong document, this
    command can'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 306 Linux for Windows Addicts: A 12-Step Program


    be quite useful. The following example removes the last job spooled in the lj4000n
    print queue:


    ```

    millerm@romans -> lprpm -Plj4000n

    ```


    If the lj4000n printer were the default printer, it wouldn''t be necessary to
    specify the -P option. If you have several jobs queued up, you can use lq to identify
    the job ID for the print job you want to kill, and specify it on the command line
    to make sure that''s the one that dies.


    Sometimes it is useful to kill every job spooled in a queue, and as well as well.
    This is usually something the superuser will want to do, so in the example shown
    here, root has logged in and is killing every job in the default queue.


    ```

    root@romans -> lprpm -

    ```


    That hyphen is the option used to terminate print jobs with extreme prejudice.
    It''s good when a process has gone haywire and is printing out a bunch of stuff
    it ought not. It''s also good, by the way, if you want to irritate one of your
    system''s pesky users. But you didn''t hear that from me.


    # pac


    This last option is more intriguing than obviously useful. It allows you to account
    for many pages of printer paper (or feet of plotter paper) have been consumed
    by the users on the system. This information is only available if there''s an
    accounting fee af option specified in printcap for the printer you want to keep
    tabs on.


    If you enable that option, you can use a command like the following one if you
    find out that one of your employees is writing a book and is probably mowing through
    pages of remapping sbaints, feedback, and the like:


    ```

    root@romans -> /usr/sbin/pac -Plj4000n millerm

    ```


    See the page for pac if you''re interested in learning more. The superuser has
    to run this job, so if you''re wasting paper, do it as root. Whoops, I did say
    that out loud?


    # Other Sources of Information


    There are plenty of other tools available for managing printers under Linux. I
    want to mention a couple that I''ve used and point you to a couple of potential
    sources for others.


    Webmin is a full-featured, web-based, modular administration interface. It can
    help you add users and groups, or configure Samba or MySQL, or administer your
    printers. It''s easy to install (and I''ll show you how in Chapter 13) and use.


    HP JetAdmin is available for many different platforms, and you may have used it
    on a Windows system. Whether you have or not, it''s reasonably easy to configure,
    it doesn''t appear to cause Address Resolution Protocol (ARP) storms anymore,
    and it works well if'
