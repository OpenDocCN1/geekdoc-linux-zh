    # ## Manual Host Configuration


    Duplicating this configuration process by manually editing files isn''t difficult,
    but the file locations may vary somewhat between distributions. In later sections
    of this chapter, I will tell you how each Linuxconf option alters the underlying
    Linux configuration files, but to simplify the introduction of Linuxconf, I''ve
    deferred that explanation for these basic options. If you want to make the changes
    manually, there are several files you''ll want to manipulate using your preferred
    text editor.


    # ### /etc/hosts


    This file contains a list of known IP addresses and the names of the corresponding
    hosts, but for now we''re primarily worried about the hostname of the machine
    we''re configuring. For it, we need a loopback entry and an address for each active
    network card:


    ```

    #

    # DM hosts file

    # 11-24-2000 MJM

    #

    127.0.0.1   localhost

    10.0.2.238   romans.distinguishingmark.org   romans rom

    ```


    If you have a "real" network-addressable IP address for a system, associate the
    hostname with that address instead of the loopback address.


    Note also that the file has some comments; they''re a little cryptic than they
    might be, but they do tell me the last time I touched the file, which is useful
    because I''ve got a terrible memory.


    # ### /etc/sysconfig/network


    This file contains a little more information than we''ve configured yet in Linuxconf,
    but we''ll go ahead and look at it anyway. You should put the hostname and address
    in the /etc/hosts file, you should also include the hostname in the /etc/sysconfig/network
    file:


    ```

    NETWORKING=yes

    FORWARD_IPV4=false

    HOSTNAME="romans"

    GATEWAY="10.0.2.254"

    GATEWAYDEV="eth0"

    ```'
