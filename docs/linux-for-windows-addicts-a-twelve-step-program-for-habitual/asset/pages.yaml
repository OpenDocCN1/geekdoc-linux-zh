    Although the Dummy Net Driver Support option doesn''t do much except in systems
    that only use Serial Line Internet Protocol (SLIP) dialup networking, it doesn''t
    hurt to include it in your kernel. It provides a dummy network address for when
    the machine isn''t dialed into the network. This address just keeps applications
    from getting confused when the system is offline. Enable it.


    The Bonding Driver Support option is a method of connecting systems together using
    more than one Ethernet connection. For example, you might want to connect a web
    server and the database server that it accesses using two 100MB Ethernet cards
    instead of just one. This process is known as bonding in the parlance of the Linux
    kernel, and enabling this option will allow it to happen. You also need multiple
    Ethernet cards and support for this feature on the computer or network equipment
    you''re connecting to the Linux system you''re configuring. This would be a rare
    occurrence, so most folks can disable this option.'
