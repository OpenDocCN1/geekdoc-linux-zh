    While this is a little different than what NT people are used to (and more like
    what Novell bindery-based administrators are used to, by the way), it''s simple
    and it''s consistent. Using the Windows products, I have to change access control
    and file permissions in different tools. In Linux, the tasks are strikingly similar,
    and there are non-command-line utilities available to perform these security operations.
    They''re not as colorful as the Windows tools, but they work.


    The Myths document is now naked and bleeding, and with its dying gasp, it makes
    this allegation about Linux security:


    Linux only provides access control for files and directories. In contrast, every
    object in NT, from files to operating system data structures, has an access control
    list and its use can be regulated as appropriate.^{52}


    While it''s true that access control under Linux is not as elaborate as some other
    systems, this statement isn''t really accurate.


    For example, under Linux, devices are represented by files. So my floppy drive
    is known as /dev/fd0. That''s not the sexiest name you''ll find, but it allows
    me to set different access levels to allow different access levels, depending
    on who is trying to use it. My company''s Chief Technical Officer, for example,
    can read from or write to my floppy drive if he wants to. The sales staff, on
    the other hand, can''t access it at all, allowing me to scoff and mock them.


