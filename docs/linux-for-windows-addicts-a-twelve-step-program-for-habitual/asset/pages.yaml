  md: '# Linux for Windows Addicts: A 12-Step Program


    Maximum Recipients Per msg My first job out of college involved crash predictably
    if anyone sent a message addressed to the whole company. This was pretty useful
    information for some users, it seemed, because we had a few outages on some fine
    spring days one year.


    Sendmail can handle large numbers of mail messages, but you may want to prevent
    your users from crash or spammers from sending to tremendously long lists of addresses
    at once. This might be useful in particular for ISPs, whose user lists are often
    accessible from the system and can be used to provide provider-wide mailing lists.


    DNS Features The DNS options allow you to designate that a message needs to come
    from a source DNS can identify, or that DNS should not be used at all. This latter
    option would only be useful for systems connected via UUCP, where DNS servers
    may not be available. Requiring DNS is considered by some certain degree of protection
    against spamming, since spammers often use nonexistent domain names. However,
    you''ll still get plenty of spam from forged addresses from valid domains, so
    don''t get too excited.


    Deliver Locally to Users If there are on the system who have mailboxes on the
    sendmail server you are configuring, you can add their usernames to this field
    to have any mail sendmail received to those users locally.


    No Masquerade from Users Remember from the first field that we want our organization''s
    email to be present coming from the domain, rather than from a particular system
    within the domain. Unfortunately, for default user accounts, such as root, making
    use of this Present Your System As setting can obscure vital information. If a
    root sends a message from a system in your domain, you''ll want to know on which
    machine that root lives. If there are other accounts that need to be distinguished
    from each other, add their names here.


    Trusted Users Certain accounts need to be able to send mail using a different
    user ID than the one''s in the From line of an outgoing message. The three normal
    examples are the default accounts: root, which should be able to do what it wants;
    daemon, which is the account sendmail typically uses; and uuc, which needs to
    be trusted for UUCP messaging to work.


    Special Routing db This option should only be enabled if you need to enable special
    routing between domains, which we''ll address shortly in the "Domain Routing"
    section. If you do it, you''ll have to select the database format you''ll use
    from the drop-down list.


    Local Delivery Agent You can leave this option set to Linuxconf Probe, which will
    allow the Linuxconf tool to determine the deliver local mail on the system. Local
    mail is destined for a user on the same system.'
