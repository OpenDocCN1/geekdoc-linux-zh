  md: '# LINUX for Windows Addicts


    GET RECOVERY HELP, INCLUDING USER GROUPS AND SUPPORT SITES


    OBTAIN AND USE THIS OPERATING SYSTEM THAT—INCREDIBLY—COSTS NOTHING DESPITE ITS
    HIGH STREET VALUE


    # A 12-Step Program for Habitual Windows Users


    # Break Free!


    Linux for Windows Addicts offers a step-by-step approach to breaking the habit
    of Windows dependence. Awaken your computing potential. Rediscover programming
    power and administrative freedom with the independent operating system that is
    easy to learn and free to own and use. Experience the healing power of Linux to
    create and manage your own stable, safe, and scalable computing system. Reclaim
    your robustness and recognize the errors of your Windows ways.


    +   - Learn—and leverage—the advantages of open source software

    - You decide: Re-platform completely to Linux or run Linux concurrently with Windows

    - From e-mail to administration to Web serving, master the computer system many
    predict will replace Windows

    - Fine-tune the operating system developed collaboratively by programmers, administrators,
    and users

    - Compile and install your own system using kernels, shells, and modules


    # Begin your recovery today!


    > ABOUT THE AUTHOR: A lifelong resident of Silicon Valley, Michael Miller has
    managed NetWare, NT, and Linux networks. He currently administers Linux, Solaris,
    and Windows systems at PROLIFIC in Newark, CA.


