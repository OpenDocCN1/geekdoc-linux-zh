  md: '# rlogin


    The **rlogin** program allows you to log in to a remote system as though it were
    local. It establishes a terminal session on another network-connected system so
    you can access files and programs on that system. This means you can make use
    of the processing power on other systems without having to sit in front of them.
    Of course, the owners of the other systems can prevent you from using **rlogin**
    to get onto their systems, I assume they''ll play nice if you play nice.


    # rsh


    This program allows you to execute a command on a remote host. The **rlogin**
    command established by logging onto the remote computer, **rsh** simply passes
    another command to the remote host. As useful as **rlogin** and **rsh** are, they
    allow possible routes of access to outsiders who can get to your computers across
    a network. The functionality of these programs is incorporated into a more secure
    utility ssh.


    # telnet


    The **telnet** command is another way to access a remote computer; it is more
    restrictive than the **rlogin** and **rsh** programs, but it is widely supported.
    For example, if you have a web site hosted at an outside ISP, you may be able
    to telnet to the ISP''s computer to manipulate files and directories. While ftp
    programs works well for transferring files from one host to another, telnet is
    more appropriate for accessing the files once they''ve reached the remote host.


    # WEIRD AND WONDERFUL TOOLS


    There are a few programs and utilities that don''t quite fit into the previous
    categories. Because you''re likely to run into some of these as you install Linux
    or programs that run on Linux, I want to mention them here.


    # make


    I''ll discuss using **make** in greater detail in Chapter 13, but you should know
    about it now so that it doesn''t confuse you before then. There is a GNU program
    called “make” that allows to re-create a large program to run on your system.
    I say re-create because you''re not writing code yourself, you''re simply running
    **make** to compile and link a program so it will run on your computer.


    Because programmers don''t know the details of every user''s configuration, and
    because most of them want their programs to work on several different hardware
    platforms and operating systems, you''ll find that many programs available for
    Linux are distributed as source code.'
