  md: '# Cron


    Processes are not created only when you invoke a program; they can be scheduled
    to occur on an ongoing basis. One mechanism used to do this is the crontab, which
    is a file that contains instructions for what to run and when to run them. Each
    user has a crontab that can be edited to perform ongoing tasks like deleting temporary
    files, performing backups, or sending status reports. Another, similar mechanism
    for scheduling jobs is the at command.


    # Daemon


    Both the crontab and the at command work because there is a cron daemon determining
    what jobs need executing and making sure they run when they''re supposed to. So
    what''s a daemon? Simply a process lurking in the background, tirelessly executing
    the commands it has been given. I''m not personally very excited about the name;
    I don''t want a familiar spirit in my computer doing my bidding. But it''s just
    a name, so I promise it won''t get agitated if you don''t.


    # top


    So how do you find out which processors are the top users of system resources?
    Your betcha''s the top command. Top is great for identifying processes that may
    be dragging your system performance down, and it provides additional information
    such as overall CPU utilization, number of active user sessions, system uptime,
    memory usage, and swap usage.


    # ps


    To determine the status of all processes on the system, you can use the ps command,
    which stands for "process status." This command can list all or some processes,
    and has a variety of options controlling the information it shows. This command
    is particularly useful when you''re interested in both active and inactive processes.


    # Redirection


    Most command-line programs act on input that you enter on the keyboard, right?
    And most command-line programs produce output to the screen, right? That''s right.
    But that''s not the only way those programs can be used. Linux allows you to redirect
    a program''s input and output in clever ways to produce the information you''re
    looking for.


    # stdin


    The usual source for command input is known as the standard input file, which
    is commonly referred to as stdin. What file is this? It''s the keyboard "file."
    That is to say, in normal operation, the standard input for a command is what
    you type on the keyboard. This isn''t rocket science at all, is it?'
