  md: '# Chapter 1: Confessions of a Former MS Junkie


    It''s true that Linux is primarily a command-line-based operating system. I''ve
    to see this as a good thing: the command line a powerful tool when I want to use
    it; I have a choice of windowing systems to run on top of Linux; and I don''t
    have to waste system power keeping a graphical user interface (GUI) running on
    systems that are used as servers.


    It''s also true that most Windows users aren''t familiar with Unix commands. Their
    names are often weird, either. Most of the commands aren''t always clear. I don''t
    see this as a big problem, either. Most of the commands you''ll need to use in
    a graphical tool in Linux, so you don''t have to resort to the command line except
    by choice. And the commands you have available are much more powerful than what
    you get in a DOS command box in Windows. We''ll talk about this in later chapters,
    honestly—you don''t have to worry about this.


    As far as Unix being old... this is also true. If you''re trying to infer that
    its age makes it obsolete, think again. The graphical interfaces available for
    Linux incorporate most of the interface features that Windows or the Mac OS relatively
    easily. And speaking of all... can you believe these guys at Microsoft want to
    use a mouse with your new PC? For crying out, the mouse is 36 years old! And the
    keyboard is even older! The age argument is dumb when I make it, and it''s a dumb
    argument when Microsoft makes it.


    Worried about networking? Don''t bother; Unix does it naturally and has been doing
    it for a long time. Another cool feature common to Unix-like operating systems
    is that they support multiple users at once. In other words, you can have multiple
    people logged in at once—including people running different graphical interfaces,
    or logged from other machines on the Internet, text-only terminals, point-of-sale
    systems, you name it. Whether you''re running Linux on a workstation or server,
    or you have multiple user accounts with multiple configurations, everyone in the
    family can tweak things the way they like!


    # Multiple Hardware Platforms


    Back in the old days, when I wrote Migrating from NetWare to Windows NT, NT was
    supported on a variety of hardware platforms. Not a huge variety, but I played
    with NT on a dual-CPU MIPS box, and I talked to users on Digital''s Alpha platform.
    NT hasn''t supported MIPS for years, and it''s no longer supported on Alpha, either.


    This isn''t the worst thing going on in the world, and it''s not a problem if
    you use Intel stock. If you''d like another choice, you''re going to have to look
    elsewhere, and Linux runs not only on Intel-based machines (and compatibles like
    AMD), on Sun workstations, PowerPC-based computers, and even Amigas. There are
    other supported platforms, but you get the idea.


    Even within the Intel product line, Linux supports a wider range of processors
    than Windows; most distributions can be run on 386-based machines (try running
    Windows-2000 on one of those!) all the way up to the Pentium III processors. If
    you''re already using Windows, your system is probably Pentium-class or higher—but
    isn''t it nice to know that old hardware you have sitting in the closet may also
    work just fine?'
