  md: '# Linux for Windows Addicts: A 12-Step Program


    The first step in freeing yourself from Microsoft''s grasp was installing Linux.
    If you have succeeded in climbing that step, congratulations are in order. But
    before you get too proud of yourself, there is more self- and computer-improvement
    to under-take your transformation. The second step is to believe that X Windows
    is highly configurable, won''t crash your system, and can restore your sanity.


    After you install Linux, many popular distributions automatically boot you straight
    into X Windows when you start your computer, saving you the anguish of having
    to look at that frightening command line. But how do you control the appearance
    of the X Windows environment that has been created for you? And what do you do
    to reconstruct the GUI if your hardware changes? You look for answers here, that''s
    what you do.


    # SETTING UP X


    There are several options for setting up the X Windows software for your system.
    Not all distributions include these tools, but most will contain at least one.
    Perhaps the most widely available tool is XF86Setup, which isn''t sexy, but is
    fairly straightforward. The lizardx and Xconfigurator tools may be available on
    your distribution, but you''ll have to check to make sure.


    You should log on as the root user to run all three tools. If you aren''t already
    logged in as the root user, you can become root by entering su at a console prompt
    and entering the root password as prompted. And I''d recommend running all three
    tools from console mode rather than from within X, if to avoid occasional unexpected
    results. It''s best to know six things before you start configuring X:


    +   * Video board make and model

    * Amount of video memory

    * Monitor make and model

    * Monitor vertical and horizontal refresh rates

    * Mouse type and port

    * Keyboard type


    You should have this information already if you went through the installation
    procedure in the previous chapter. But if you''re changing hardware, consult its
    documentation for specifications you don''t know. It''s always best, for example,
    not to guess at the refresh rates of your monitor. Guess too high, and bad things
    have been said to happen.


    # XF86Setup


    The XF86Setup program generally accompanies the XFree files on a Linux system.
    Some distributions don''t include the XF86Setup program (Red Hat, for example,
    wants'
