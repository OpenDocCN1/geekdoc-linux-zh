  md: '# Chapter 15: Step 12: Free Your Office


    StarOffice''s greatest strengths are its comprehensive list of tools and features,
    Sun''s promise to release a version as free software, its compatibility with Microsoft
    document files, and its multiplatform support. Its biggest limitation is its performance.
    Learn more about StarOffice at http://www.sun.com/products/staroffice/


    # KOOffice


    The KOOffice suite is still under development, but it is looking promising, especially
    if you like the look and feel of the KDE desktop. Like the other KDE applications,
    KOOffice tools are reasonably well integrated into the desktop environment, so
    they take on the attributes of any special themes you''re using.


    Like the StarOffice suite, KOOffice contains an ambitious array of tools; in fact,
    the tools KOOffice doesn''t include are the mail tool and web browser, but these
    are already available for KDE without the KOOffice package, so you''re covered
    there, too. The KOOffice packages includes:


    +   * KWord

    * KSpread

    * KPresenter

    * KIllustrator

    * KMyShop

    * Katabase

    * KFormula

    * KChart

    * KImage (a viewer)


    While KOOffice looks good and is much more than than the StarOffice programs,
    it lacks many "must-have" features, and some of the pieces are not currently usable.
    Even for those that are, there are problems. For example, the KWord application
    does not yet have an operational filter for importing or producing Word documents.
    Such filters are a must in nearly every environment, so that something to keep
    in mind as you consider your options.

    KOOffice is also not as-portable as StarOffice. It relies heavily on the KDE packages,
    and I''d be surprised if there are plans to move the application away from the
    desktop environment. At this time KOOffice is really only an option for those
    who don''t need to continue supporting Windows clients or Microsoft document files.
    Have a look at http://koffice.kde.org/ to see if that''s still the case as you
    read this.


    # Abiword


    Unlike KOOffice, Abiword is available on a wide variety of platforms, including
    Windows. Like KOOffice, the current release of Abiword is pre-1.0. However, the
    overall functionality'
