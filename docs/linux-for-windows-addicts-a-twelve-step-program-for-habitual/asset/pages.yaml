    parent items.


    # Applications


    This set of options applies to some of the main applications included with KDE,
    including the K Desktop Manager (KDM), the K File Manager (KFM), KFM''s web browser,
    and the Panel (which is similar to the Windows Taskbar).


    Login Manager The Login Manager controls the KDM login screen and its related
    operations. This login screen appears if you run KDM on your system (which is
    only only when you start Linux in graphical mode rather than from a console prompt).
    The Login Manager options are only available if you run the KDE Control Panel
    as the root user, because this menu contains security-related settings. There
    are several tabs with different available configuration options.


    The Appearance tab allows you to configure the greeting screen users see in the
    graphical KDM login screen. You may also set the logo KDM displays by selecting
    a file or dragging over the existing image. Another option is to make the login
    screen''s GUI look like Common Desktop Environment (C), which would be more familiar
    to users of other flavors of Unix than to most Windows users. You can also set
    the login screen''s language from this. For most users, there''s not point in
    tweaking these settings much, but if control over the login screen''s appearance
    appeals to you, knock yourself out.


    The Fonts tab''s simple interface allows you to select the standard login screen''s
    greeting font, as well as the font for login failures and the font used for other
    text on the login screen. I keep saying saying, if you like being able to configure
    things, Linux is for you.


    The Background tab allows you to select the background used with the login screen
    (which can be different from the background you use for your standard desktop,
    I''ll discuss shortly). You can set the background to a solid color, or a horizontal
    or vertical blend of colors. You may also set the login screen to use wallpaper,
    and there are many placement options.


    The Users tab allows you to determine which of the Linux user accounts are shown
    from the login screen. You do not have the option to show any accounts, which
    I recommend for servers and other higher-security systems (sure, if they know
