  md: '# Chapter 9: Step 6: Mingle with Microsoft, Network with Novell


    Okay, that last requirement is not mandatory, but the others are. By default,
    there’s no script set, so the user won’t be added on the fly. Linuxconf comes
    with a script option that you can select (or use as the basis for your own). It
    looks like this:


    ```

    /usr/sbin/adduser -s /bin/false -g pop -c "smb account %u" %u

    ```


    This creates a user with minimal functionality on the Linux side of the Samba
    box (no shell and a minimal-rights primary group) that can access Samba resources,
    depending on how you’ve configured them. This allows you to add a user to the
    Windows side and not to worry about duplicating the process on the Linux side.


    Automatic account deletion, on the other hand, ensures that a user account that
    is disabled on the Windows network is also removed from the Linux network. The
    stars and planets don’t have to be properly aligned for this to happen (well,
    no more than usual, anyway), but the following conditions must be true:


    +   - Authentication mode must be domain (because server authentication doesn’t
    provide a definitive statement that an account has been deleted).

    - The specified domain controller must return an error code indicating that the
    user no longer exists in the domain.

    - The delete script must exist and take the argument %u, which represents the
    account name to be deleted.


    The default is to include no such script, so automatic deletion is not enabled.
    However, you may select the default option from Linuxconf, which looks like this:


    ```

    /usr/sbin/deluser %u

    ```


    This is a simple script: Given the user represented by %u, remove that user’s
    account and the contents of their home directory. The moral of the story: Don’t
    accidentally delete a user from the NT domain if you enable this option, or you’ll
    be in double account restorations.


    Other Features This last set of default options is a bit of a hedgehogodge of
    Samba functionality. The Guest Account option allows you to specify a Linux account
    used when public access is allowed to a Samba resource. If you allow public access
    to disk or printer shares, you should enter an account name with few privileges;
    the “nobody” account is a reasonable choice.


    The Dead Time option should be set to the number of minutes of inactivity that
    the Samba system to allow before it disconnects a Samba client that has no files
    open. The default value, 0, does not connect such users. Depending on the number
    of users you have vying for server, a value ranging from 10 to 30 seems reasonable.
    Most clients will reconnect seamlessly, so it’s good to set a value here.


    The Debug Level determines the amount of logging’s done by the Samba system, which
    could be useful for debugging or troubleshooting. The higher the number, the more
    detail is logged. Don’t worry about this option, setting it to 0 won’t be a problem.'
