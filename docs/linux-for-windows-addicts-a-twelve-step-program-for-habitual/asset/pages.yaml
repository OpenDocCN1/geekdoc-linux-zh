    There are different approaches for allocating disk space on a Linux system, but
    at a minimum, you need a root partition and some swap space. A root partition
    smaller than about 1GB gives you enough to play with, and I suggest that you make
    the swap space equal to double the amount of RAM installed on your system. Notice
    that in Figure 4-23 three partitions are listed: A 20MB partition on hda1, a 1200MB
    partition on hda5, a 400MB partition on hda6, and a 300MB partition on hda7.


    At this point I give you a quick refresher on how Linux calls hard disks. Each
    disk on a Linux system is given a device name, depending on whether it''s an IDE
    or a SCSI drive. If your system is properly configured (which is likely, but not
    certain) and has one IDE hard disk, that drive will be known to Linux as /dev/hda.
    Each partition on that disk drive gets a number. There can only be four partitions
    on a disk drive, which are numbered 1–4. One of these may be an “extended” partition
    that holds additional “logical” drives that are numbered starting with 5.


    The partitions listed in Figure 4-23 are all on the first IDE hard disk; the 20MB
    partition is partition 1 (known as hda1), the 1200MB partition is partition 5
    (known as hda5), the 400MB partition is partition 6 (known as hda6), and the 300MB
    partition is partition 7'
