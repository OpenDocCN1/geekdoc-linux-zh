    to slowly animated.


    The window placement policy is Smart, which attempts to minimize window overlap
    and cluster. The default option will drop windows haphazardly across the screen,
    Cascade will overlap window items but not title bars. The manual option you click
    on the desktop each time a window opens to indicate where it should be placed.
    Finally, the interactive setting attempts to use smart placement until an overlap
    threshold is set-not met, and then it forces manual placement for additional windows.


    If you''ve used Windows of your computing life, window focus probably isn''t something
    you''ve given much of. In Windows, a window is selected (that is, “given focus”)
    by clicking on it. That window retains focus until another window is clicked on.
    In KDE, this behavior is known as Click to focus. But there are other focus options
    available from the Properties screen.


    A more customary way for Unix to configure focus is known as Focus follows mouse.
    This option gives focus to whatever the mouse pointer is sitting over. This makes
    it easier to type text into a window largely obscured by another window with reference
    information, but it can also be frustrating when you really have to know where
    your mouse pointer is located at all times. If you don''t like Click to focus,
    I recommend.


    Another option is Classic sloppy focus, which is similar to the Focus follows
    option but allows you to cycle focus through the windows using the ALT+TAB key
    combination. The Classic focus follows mouse option is also based on the Focus
    follows mouse option, which strictly removes focus from a window if the mouse
    pointer leaves the window. This means that if the pointer isn''t above any window
