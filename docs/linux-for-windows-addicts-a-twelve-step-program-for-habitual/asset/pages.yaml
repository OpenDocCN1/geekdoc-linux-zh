  md: '# Chapter 10: Step 7: Enable Printing


    This command prints the contents of the file /etc/printcap to the printer named
    lj4000n, making two copies. If you want to print to the primary printer (the first
    one listed in your /etc/printcap file), you don''t have to specify the -P option,
    and if you want to print a single copy, you don''t have to specify the - option.


    You can also set an environmental variable to indicate the default printer you
    wish to use. You''ll have to check your shell''s man pages to get the scoop, but
    for sh/bash shells, you can set this option from the command line like so:


    ```

    [millerm@romans ~]# PRINTER=oj

    [millerm@romans ~]# export PRINTER

    ```


    Performing the same task in the csh/tsh environment takes one statement:


    ```

    millerm@romans ~> setenv PRINTER oj

    ```


    You can check the current setting of your PRINTER environment variable using this
    command from either shell:


    ```

    [millerm@romans ~]# echo $DISPLAY

    ```


    The mpage utility is found on many systems; it allows you to specify the number
    of pages that are printed on a single piece of paper, giving you a little more
    control over your deforestation efforts. If you have a PostScript printer, mpage
    is quite convenient:


    ```

    millerm@romans ~> mpage -4 -Poj /etc/smb.conf

    ```


    This command will print four pages of text (reduced in size to fit and boxed for
    legibility) on a single sheet of paper. There are many additional options you
    can choose from; see the man page.


    The encrypt utility is another common tool for tweaking the output of a print
    job. You have even more control over how the output is displayed, and can alias
    your favorite set of encrypt options and use it as their default print command.
    Encrypt can be invoked like:


    ```

    millerm@romans ~> encrypt -2 -a2 -G -j -r /etc/smb.conf

    ```


    These options, from left to right, tell encrypt to print two columns per page,
    to print only the second page, to use a fancy (gaudy) header, to put borders around
    the columns, and to print the page in landscape mode. For large files, this can
    be a handy option, because the gaudy header gives you the date and time the file
    was modified, the filename, and the current page number.


