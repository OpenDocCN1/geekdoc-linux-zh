  md: '# Linux for Windows Addicts: A 12-Step Program


    I My name is Mike, and I''m a Microsoft user. I''m not ashamed to say it. I''ve
    come to grips with it. I''m probably not much different from you. I like using
    PCs, I like the power, appearance, and ease of use of a graphical user interface.
    I like finding and using software that helps me be productive, enables me to learn
    and solve problems, and amuses me. I like using powerful, inexpensive hardware
    that''s readily available.


    But I''m not a slave to Microsoft anymore. I''m free from the endless upgrading,
    the compatibility problems, and the ongoing expense of doing things the Redwood
    way. ''How so?'' you ask, as though hadn''t read the title of this book.


    If you haven''t heard much about Linux, it''s not for lack of proficiency. Stock-market
    speculators, Information Systems flankies, business managers, and common hobbyists
    are discussing, debating, and deploying Linux around the world. The press coverage
    of Linux continues with everything from basic facts to bald-faced lies to unabashed
    prints. To make sure we''re all on the same page, this chapter describes the back-ground
    of this operating system and for the people.


    # WHAT IS LINUX?


    Linux is a free, open-source, collaboratively developed Unix-like operating system
    available for most hardware platforms. It offers extensive networking support,
    numerous features for interoperability with other systems, and vast numbers of
    native and ported applications.


    If all those terms make sense to you, feel free to move on. If you''re fuzzy on
    some or all of them, allow me to explain further. That is, after all, my job here.


    > NOTE: Most English speakers pronounce Linux as "Lee-hucks." Its creator, Linus
    Torvalds, calls it "Lee-nucks," but he''s from Finland and pronounces his own
    name "Lee-nus." So some people have anglicized the operating system the same way
    they would have their first name: "Lee-nucks." Wait, there''s more. GNU, which
    is mentioned in this chapter, is pronounced "Guh-new," not "Gnu." The GNOME desktop
    environment is known as "Guh-nome," not "nome."


    # Free


    This term is almost self-explanatory. Linux allows you the freedom to use and
    distribute it without paying for it. If you''re accustomed to using Microsoft''s
    operating systems, and you''re a little skeptical about not paying $100 or every
    two or three years to see a new set of features and new bugs, I understand. But
    Linux is freely available from a variety of sources on the Internet, and it can
    be purchased on CD for next nothing (I''ve purchased many distributions for $1.95
    per CD-ROM).


    Linux is often distributed with manuals, additional software, and other value-added
    items...and you''ll usually pay more for these distributions. But the reality
    is that you'
