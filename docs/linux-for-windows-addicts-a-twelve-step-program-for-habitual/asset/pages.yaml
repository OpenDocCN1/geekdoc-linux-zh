    print queue. And all of this functionality costs you how much? What a beautiful
    thing free is, especially when free works well.


    # Using .nwclient


    While the command line works just for infrequently made connections, and connection
    scripts are fine for scheduled connections, it is very friendly to users who periodically
    want to connect to a NetWare server, but who don''t want to be bothered (or can''t
    be trusted) to use the command line.


    For cases like these, ncpfs can use a user-specific file called .nwclient. This
    configuration-dot file goes in a user''s home directory and contains information
    about the connections they''re likely to make.


    The file may contain passwords, so it must be secured with file permissions to
    600. After you create the file, be sure to use the chmod utility to change the
    permissions to this level, which allows the owner (only!) read and write access
    to the file.


    The file contains one or more lines containing a SERVER/USER combination, and
    optionally a password. Consider these contents of a .nwclient file:


    ```

    TITUS/GARYSOTO

    TIMOTHY/GARYSOTO redants

    UDE/GUEST -

    ```'
