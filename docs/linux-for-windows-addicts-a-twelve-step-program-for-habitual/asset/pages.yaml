    # cp


    The **cp** command is straightforward; you can use it to copy a file to another
    name or location, or to copy multiple files to a directory. It is analogous to
    the DOS copy command. You must have read permissions on a file to copy it, and
    you must have write permission in the destination directory to create the copy.


    # mv


    The **mv** command is also easy to learn. It simply renames or moves a file or
    files. While the **cp** command leaves copies in the old location, the **mv**
    command eliminates the original files. You must have write permissions on a file
    to move it out of its original location, and you must have write permissions in
    the destination directory to move it into its new home.


    # rm


    This command allows you to delete files and directories. You must have write permissions
    for the files and directories you want to delete, and by default, the command
    will not remove directories. To do that, you must specify the -r option to "recurse"
    through the directory structure. But please careful recursing, or you''ll be cursing
    for sure.


    # cat


    The **cat** command is similar to the type command in DOS. It is simply a way
    of showing the contents of a file on the screen. As odd as it may seem, it has
    another function: It can be used to join (concatenate) multiple files. I have
    not figured out how to punch holes hooks with it, but who knows what other powers
    might it possess'
