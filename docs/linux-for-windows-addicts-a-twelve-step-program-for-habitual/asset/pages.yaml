  md: '# Linux for Windows Addicts: A 12-Step Program


    The steps we''ve taken so far have been focused on the process of making Linux
    a useful platform for a person who is accustomed to a Windows environment. But
    now the time has come to focus on the reason we tell ourselves we use computers:
    Productivity. If a Linux system cannot run the tools you need as part of your
    daily work, its overall effectiveness will be greatly limited.


    While plenty of people employ their Linux systems as web or file print servers
    or as programming workstations and stop there, I hope you''re ready to face Step
    12: Having become Linux users as a result of these Steps, we continue by employing
    Linux-based applications.


    # OPEN SOURCE OR FREEWARE OFFICE APPLICATIONS


    You may recall from Chapter 1 that there has been some controversy over what meant
    by "free software" and "open source" software. I do not intend to pick at that
    scab; I am primarily interested in solutions that are currently available without
    a charge, and these packages are. Whether you should be supporting their efforts
    is an entirely different matter, so I encourage you to go with your conscience.
    I''ll try to point out the question marks I''m aware of as I discuss each package.


    # StarOffice


    The StarOffice suite is now part of the Sun Microsystems stable software, which
    makes some people more interested in the product and makes others skittish about
    it. If you look past the politics of the situation, you''ll find that StarOffice
    is a remarkably complete set of office productivity tools. Because StarOffice
    is widely available, relatively mature, and includes most of the features Windows
    users want, you''ll spend a little more time on it than some of the other tools.
    Because Sun has released the source code to StarOffice, you can expect the product
    to improve.


    # What StarOffice Includes


    The StarOffice includes the essential document processing tool that can open Microsoft
    Word documents. A variety of HTML file templates are included for rapid creation
    of web pages. A spreadsheet, a web browser, a presentation tool with full graphing
    features, and a database builder/front end. Also included are a personal task
    list and mail and Usenet news, vector drawing program, image editor, and formula
    builder round out the package. All in all, it contains enough functionality to
    meet most users'' desktop application needs.


    There is a downside to this massive conflagation of functionality, however. StarOffice
    has a monolithic look and feel, integrating the many tools into a single workspace,
    as shown in Figure 15-1.


    While the design keeps all the different tool windows accessible, which can be
    a problem under X Windows, it also makes working with the tools cumbersome at
    times.'
