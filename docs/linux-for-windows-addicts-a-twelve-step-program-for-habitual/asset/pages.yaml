  md: '# Chapter 6: Step 3: Compile a Kernel


    This command copies the bzlimage file just created to the /boot directory, where
    its name will be "vmlinuz-2.2.14" to help us remember what version it is. Now
    that it''s in the right place, we can edit the /etc/lilo.conf file to update the
    line so that it points to the new kernel.


    When the /etc/lilo.conf file has been edited, we''re ready to tell LILO to update
    its configuration information. This is a simple process (but you still have to
    be the root user):


    ```

    root@romans ~ /sbin/lilo

    Added Linux *

    ```


    You may see a slightly different message telling you that kernel(s) were added,
    depending on the label tags specified in the lilo.conf file. Regardless, you''re
    now ready to build any modules you specified during the configuration process.


    > NOTE: If you''re running Corel Linux or another distribution from a Windows
    partition, you likely are using loadlin, another boot loader. When you build a
    new kernel on a loadlin system, you simply go into Windows and overwrite the existing
    file named vmlinuz with the bzlimage file you just created (rename vmlinuz.)


    # Make Modules


    When you''re configuring the Linux kernel, you have the option to include many
    options as modules rather than placing them into the kernel. Each module can be
    loaded and unloaded separately; in older days, Linux required you to tell the
    kernel what to load or unload, but module loading is now automatic if you build
    support for the kernel module loader (kmod) in the kernel.


    To build the modules, simply run this command:


    ```

    millerm@romans ~/linux> make

    ```


    This will create the completed modules you requested during the configuration
    process. It will not install them, however, so there''s a second step you must
    take (this one must be performed as root):


    ```

    root@romans ~millerm/linux> make modules_install

    ```


    This command copies the completed modules to a subdirectories of /lib/modules/
    that corresponds to the kernel version. That''s all there is to it; the modularized
    features of Linux are now available on an on-demand basis.


    # WHAT TO COMPILE INTO THE KERNEL


    It''s fine for me to tell you to compile a kernel. It''s fine for me to tell you
