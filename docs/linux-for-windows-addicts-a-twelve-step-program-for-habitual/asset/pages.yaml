    In this section, we''ll focus on the process of building the kernel; I''ll save
    a discussion of what exactly you should build into the kernel for later in this
    chapter. Now, let''s start by making sure you''ve got a fresh set of kernel files
    and that they''re ready to go.


    # Pre-Tidy Things


    The default location for your original Linux kernel source files is a directory
    known as /usr/src. This directory is sometimes a logical link (see Chapter 3 if
    you''re unfamiliar with that term) to a version-specific directory. Consider the
    following directory listing:


    ```

    millerm@romans:/usr/src ls -l

    total 12

    lrwxrxr-x 1 root root 12 Feb 9 06:29 linux -> linux-2.2.13

    drwxr-xr-x 3 root root 4096 Feb 9 06:28 linux-2.2.13

    drwxr-xr-x 3 root root 4096 Feb 11 02:35 linux-2.2.14

    drwxr-xr-x 7 root root 4096 Feb 9 06:33 redhat

    ```


    In this /usr/src directory, for example, there are two subdirectories for Linux
    versions (2.2.13 and 2.2.14), and a logical link to one version (2.2.13). While
    you can keep multiple versions of the kernel this way, it''s a better idea to
    leave the /usr/src directory as your installation left it. Instead of modifying
    the contents of that tree, you can create your own directory structure in a subdirectory
    of your home directory.


    To update the kernel, you can download the latest version from the Internet; while
    some distributions have download locations on their own websites, you can also
    go to www.kernel.org to find past and present kernels, both production and development.
    Once you''ve downloaded the source file to your home directory, decompress it
    using the appropriate tool.


    The smallest files (which will download fastest) are those with the .bz2 extension.
    To decompress and expand them from the archive file, use commands like this (using
    the name of the file you downloaded):


    ```

    millerm@romans: -> bunzip2 linux-2.4.0-tar.bz

    millerm@romans: -> tar xf linux-2.4.0-tar

    ```


    This will create a directory structure in the directory where you ran the tar
    command. Change into the linux directory, which is the top level of the Linux
    source tree. From here, run make proper, as shown here:


    ```

    millerm@romans: -> cd linux

    /home/millerm/linux

    millerm@romans: ~/linux make proper

    ```'
