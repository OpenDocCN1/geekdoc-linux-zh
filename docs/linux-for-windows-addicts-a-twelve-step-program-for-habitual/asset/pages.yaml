  md: '# Deal with Password Encryption


    If you''re having trouble reaching a Samba server from Windows 2000, Windows NT
    4.0 patched to Service Pack 3 or later, Windows 98, or Windows 95-OSR/2, but you
    can reach from earlier Microsoft operating systems, the most likely culprit is
    clear text passwords. Earlier Microsoft products use them; later ones won''t do
    it by default.


    You''ll have to decide for yourself whether password encryption, which brings
    with it passwords saved to disks that are not perfectly secure, or clear text
    transmission, which may allow passwords to be captured over the wire, is better
    for your situation. I lean towards enabling clear text passwords from the client
    stations, but this can be an irritating step to have with each new system if you
    don''t have an effective means of automating the process for each client platform
    in use.


    **Use Unencrypted Passwords** If you decide to enable unencrypted passwords, use
    the regedit command appropriate to the platform, and change the value specified
    in Table 9-3 to enable the Windows system to transmit clear text.


    **Samba Password Encryption** If you opt to enable password encryption on the
    Samba server, follow these steps:


    +   1. Add the following line to the [global] section of the smb.conf file

    ```conf

    crypt passwords=yes

    ```


    | OS | Registry Key | Name and Data |

    |---|---|---|

    | Win 2000 | [HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkStation\Parameters]
    | "EnablePlainTextPassword"=dword:00000000 |

    | WinNT 4.0 | [HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Rdr\Parameters]
    | "EnablePlainTextPassword"=dword:00000000 |

    | Win 98 | [HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\VxD\VNETSUP]
    | "EnablePlainTextPassword"=dword:00000000 |

    | Win 95 | [HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\VxD\VNETSUP]
    | "EnablePlainTextPassword"=dword:00000000 |


    **Table 9-3.** Enable Unencrypted Passwords on Microsoft OSes'
