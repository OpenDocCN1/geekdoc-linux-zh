    # CONNECT TO NOVELL SYSTEMS


    While connecting to Microsoft-based systems has taken up the majority of space
    in this chapter, I don''t want to completely neglect Novel''s NetWare. I''m far
    enough removed from my years toiling as a NetWare administrator that I feel pretty
    benign about the NOS, and it''s also true that the company has improving its product
    line since I''ve been away. You may have some NetWare systems that you''d like
    to access from your Linux stations. And if you have NetWare clients around, you
    may find that in circumstances it''s easier to have your Linux system emulate
    a NetWare server than to go around changing each and every client. So in the interests
    of those in either situation, I''d like to talk solutions to both problems.


    # Connecting as a Client


    Connecting to a Novel server from a Linux client is easy if you have the right
    tools. Perhaps loading the NFS namespace on your NetWare server volumes is the
    easiest way of doing this, but that''s not an option for everyone. Frankly, Red
    Hat has the ncps package, which qualifies as the right tool for the job. If you
    included the IPX protocol when you built your kernel, and configured it using
    Linuxconf (as described in Chapter 7), you''re sitting pretty.


    # Using ncpmount


    If IPX is working properly on your system, you can use the ncpmount and ncpmount
    to mount and unmount NetWare volumes from your Linux system. For example, if you
    wanted to access a NetWare server known as TITUS, you could use the following
    command:


    ```

    root@romans -> ncpmount -S TITUS -U supervisor /mnt/titus

    ```


    This will prompt you to pass the password on TITUS; if you enter it correctly,
    you will be able to access the TITUS volumes from the mount point specified, /mnt/titus.
    For each volume on TITUS, there will be a separate subdirectory in the mount point.


    There are many other options available when connecting to a NetWare server using
    ncpmount. Table 9-4 describes some of the more useful options, but you can check
    the man page for more detail.


    By including the ability to do things like pass the password, ncpmount gives you
    the chance to completely script the connection between the Linux and NetWare system,
    though it naturally means you''ll have to secure the script, especially if you
    plan to be using the NetWare Supervisor password.'
