  md: '# 300 Linux for Windows Addicts: A 12-Step Program


    usage) if it’s pointing to a printer on an SMB or NCP server. If you’re interested
    in more configuration options, they’re exhaustively listed in the man page for
    printcap, man 5 printcap.


    # /var/spool/lpd/


    The /var/spool/lpd directory is referenced in two of the lines in the first /etc/printcap
    definition:

    In- deed, this directory is where most distributions place the lpd-related files.


    ```

    :sd=/var/spool/lpd/lj:

    if=/var/spool/lpd/lj/filter:

    ```


    The first line indicates that the unique spoolfile directory is /var/spool/lpd/lj,
    and the second line sets the print filter (which is a script that determines what
    kind of file is being printed and how to best print it).


    There should be a separate directory in /var/spool/lpd for each printer you set
    up. By default, printtool will use a name like /var/spool/lpd/lp0, which is fine.
    If you want to change the name to something else, use printtool to do so.


    # RUNNING PRINT JOBS


    Now that you’ve configured your printers, it’s time to get printing. While Windows
    applications include a pretty transparent mechanism for printing (using the File
    | Print menu), the variety of interface designs on Linux applications, and the
    prevalence of text-mode tools, make it quite likely you’ll just want to print
    a file from the command line or from a GUI file manager tool. No matter how you’re
    accessing the print command, though, it’s useful to know how to point to the right
    Linux printer from a Linux client, from a Windows client, or from a NetWare client.


    # From Linux


    As everything else in Linux, there are a few ways of printing. When you’re printing
    from the command line, there are several utilities available for outputting files
    to your printer. When you’re using X Windows, you can use those same command-line
    tools, or you can use the print functionality built into many applications.


    # Command-Line Printing


    If you want to output the contents of a file to a printer, you’ll just do fine
    with the lpr command. The following command illustrates some of the most commonly
    used options for the lpr command:


    ```

    millerm@romans -> 1lpr -Plj4000n -2 /etc/printcap

    ```'
