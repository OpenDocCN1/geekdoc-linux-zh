    # File System Integrity


    A file system refers to the way a computer stores files to disk. For example,
    DOS used a file system called the Allocation Table (FAT). Windows 98 uses an enhanced
    version known as FAT32. And Windows NT can use FAT or a file system known as NTFS.
    Linux can use all these filesystems and its native filesystem is currently one
    called ext2.


    For most purposes, ext2 is effective; it resists fragmentation (so you don''t
    get to watch a disk defragmenter move all those colored blocks around like you
    do in Windows), it''s fairly flexible, and it handles large disks well. When a
    Linux system doesn''t shut down properly (if you turn it off without telling it
    to shut down first, for example), the system knows to check the filesystem because
    it wasn''t properly closed.


    Even if the file was properly closed, however, ext2 periodically forces a file
    integrity check on startup. It is possible to tweak the system to make this less
    frequent, but it''s a good thing to maintain file system integrity so you don''t
    lose files, so that''s recommended.


    The Myths document points out that the filesystem check can take a long time if
    you''ve got large partitions unused, noting that


    > ...the system must check the integrity of the file system during system restart,
    a process that will likely consume an extended amount of time, especially on large
    volumes and may require manual intervention to reconstruct the file system.³36


    This is a reasonable criticism, and something you should consider if you''re thinking
    of moving a particularly large data set to Linux. On the other hand, an ''extended
    amount of time'' may really amount to minutes. Curious about the recovery times,
    I shut off power to two of my systems to crash them and then powered them up.
    Neither system took more than three minutes to check its files (on 36GB of partitions
    for each server). While this result is anecdotal and unscientific, it is still
    a real-world example of what you might expect.'
