  md: '# Linux for Windows Addicts: A 12-Step Program


    # LINUX INFORMATION SOURCES


    There are tons, heaps, and loads of information sources out there. Shucks, given
    how helpful Microsoft has been in explaining things about Linux, you might figure
    somebody else would have some information to share as well, right? There tends
    to be lots of inter-linking between Linux sites, so you should be able to gather
    lots of information by visiting just a few of these sites.


    # Publications and News


    My favorite place for Linux news is the Linux Weekly News site''s daily updates
    page, but there are many other good sites. Here are some of:


