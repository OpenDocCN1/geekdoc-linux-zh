    config**.


    # make menuconfig


    This option is preferable to **make config** in most circumstances, not only because
    it’s a little aesthetically pleasing, but also because it allows you to change
    your mind gracefully. The kernel features are grouped together in a set of menus
    (the name of the command, I’m sure you noticed) that you can navigate as you need
    to; this means you don’t have to wade through every configuration option, which
    is nice.


    To initiate this utility, run the command as the root:


    ```

    root@romans:~ make menuconfig

    ```


    This will likely generate some messages on the console before a window similar
    to the one in Figure 6-1.


    Navigating the menus is easy; use the cursor keys to move to a menu item and then
    PRESS ENTER to open the menu. Each menu item is preceded by a pair of square brackets,
    which signify a feature that must be included or excluded, or by a set of less-than
    and greater-than signs, indicate that the feature may be modularized. Move to
    whatever you wish or press the spacebar to toggle the options. An asterisk indicates
    that the option is selected, while an “m” indicates that the option is to be built
    as a module. If there’s nothing between the brackets, the option will not be included
    in the kernel you’re building.


    In the menu shown in Figure 6-2, Kernel support for a.out binaries will be excluded
    from the kernel, Kernel support for ELF binaries will be included and Kernel support
    for MISC binaries will be made into a module.


    When you have configured the kernel functionality as you see fit, select Exit
