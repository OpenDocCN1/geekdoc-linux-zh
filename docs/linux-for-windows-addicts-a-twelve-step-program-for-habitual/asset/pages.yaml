  md: '# Chapter 11: Step 8: Establish a Web Server


    # Controlling the Server Daemon


    Once you have finished configuring the Apache server, you should start or restart
    the server. Linuxconf do this for you, but you may also do it yourself. You can
    use the following-command to check the current status of the web server:


    ```

    root@romans ~ /etc/rc.d/init.d/httpd status

    httpd (pid 31832 31831 31830 31829 31828 31827 31826 31825 31822) is running...

    ```


    This response tells you whether Apache, the daemon is running, and if so, the
    process IDs for its processes. You can use the same command, substituting restart
    for kill the current processes and restart them with the new configuration information
    you entered. You can also use the start and stop options to initiate and kill
    the processes separately.


    If you want the server to start automatically when the server boots up (or if
    you want to prevent it from doing so), you can use the /usr/sbin/ntsysv full-screen,
    text-mode utility described in Chapter 10. But I want to mention another way of
    accomplishing this task, time from within Linuxconf.


    Select the Control Service activity over the Control-Control Panel. You will see
    a list of known services, and those that are currently running will so. You can
    click on the name of a process—in this case, httpd—to open a control screen like
    the one shown in Figure 11-3.


    As you can see in Figure 11-3, the Automatic Startup for this process has been
    enabled. That means the server automatically starts Romans. There are buttons
    at the bottom of this screen that allow you to configure changes you made (in
    this case, the only option is to enable or disable the configuration at startup),
    or to start, stop, or restart the server. It''s just another way of doing the
    same thing!


    # Setting Up Virtual Sites


    Perhaps you noticed that I skipped an option in the Apache Web Server menu in
    Linuxconf. The Virtual domains option is used to set up multiple domain names
    using a single Apache server. This can be useful for separating different projects,
    products, groups, functions, or people. It also allows you to do cool things like
    act as a web hosting service.


    You can create virtual web sites using unique IP addresses, but I think it''s
    easier to manage the virtual domains as aliases to a single IP address. Either
    way, you need to configure the DNS entries for the servers so users will be able
    to reach each virtual domain you create. In other words, just configuring Apache
    for virtual domains won''t get most of your clients connected.


    There are few differences between the basic Apache server configuration and the
    configuration of a virtual site. Instead of using the Defaults option, of course,
    you select the Virtual Domains option. If you click the Add button, you can add
    a new virtual domain, or if there are existing virtual domains, you can click
    a name to view, edit, or delete that domain.'
  merge: -1
