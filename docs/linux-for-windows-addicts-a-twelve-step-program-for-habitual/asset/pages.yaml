  md: '# Linux for Windows Addicts: A 12-Step Program


    If you are building a large web site, you might consider looking into PHP and
    Zope. PHP is a scripting language designed to make creation of dynamic web content
    fast and easy. It is similar in functionality to Microsoft''s Active Server Pages
    (ASP). It provides access to many database programs, including Access and SQL
    Server. PHP is used for many public web sites, and the administrators I really
    like managing it. The PHP homepage is at http://www.php.net/


    Zope is another option for database-backed web creation. It''s an object-oriented
    application system for building web sites, and it comes with its own web server
    (or you can hook it into Apache if you prefer). Zope makes heavy use of the Python
    programming language, but you don''t have to use Python if you don''t want. You
    have control over the objects that you create for the web site, which allows you
    to be very precise about the security you impose the site. The downside is that
    while Zope is attractive, it''s not always intuitive, so the learning curve may
    be steep for a little while. See what you think with a visit to http://www.zope.org.


    There are many more well-related applications and tools available from the usual
    places: Freshmeat and Sourceforge would be good sites to start your search.


    # File Utilities


    I''ve mentioned some of the utilities in previous chapters, including the compression
    and archiving options (gzip, bzip2, compress, zip, tar, and others). Linux distributions
    also tend to include image viewers that can display, and sometimes convert, AVI,
    GIF, JPEG, MPEG, PDF, PNG, TIFF, MPEG, AVI, and QuickTime files.


    There are also many different file managers available within distributions and
    the Web. There are alternate filesystems, such as the Reisfers, which is a journaling
    filesystem that works with Linux. You might also be interested in automatic distribution
    and file-mirroring utilities such as rdist and mirror.


    Other utilities include CD-ROM writers, MP3 rippers and burners, sound file players,
    command-line spell checkers, and heaven know what else. If you need it, the chances
    that someone needed it, too. Check Freshmeat and other Internet sites for utilities
    and procedures to do what you''re looking for.


