  md: '# Watchdog Timer Support


    Selecting these options allows you to set up a watchdog, which checks to see if
    the watchdog file is open, and if so, if it has been touched within the last minute;
    if it has not been, the system is rebooted. The idea here is that as long as the
    system''s running, the watchdog file is modified periodically. Thus, if the file
    hasn''t been altered in the last minute, the system must be on the frit.


    On a system that must be available as much as possible, you can enable the watchdog
    before a task that you think lock up the system, and disable afterwards. This
    process works best with a watchdog card you put in the system, and there''s a
    software-only solution available as well. If you''re interested, check out the
    information in the help text as well as the documents that come with the kernel:
    linux/Documentation/watchdog.txt and linux/Documentation/pcwd-watchdog.txt.


    Activate the Intel i8x0 Random Number Generator Support if you use systems an
    Intel i8bx server motherboard. It won''t be the end of the world if you have one
    of these boards and don''t activate this feature, if you don''t know what chipset
    motherboards (it indicates the chipset as the system starts booting up), leave
    this deactivated.


    Enabling the /dev/nvram Support option allows you to make use of the battery-backed
    memory in a PC''s real time clock (RTC). There are only 50 bytes available here,
    and while this might be a cool trick for a hacker, it''s not wise for normal folk
    and administrators to be twiddling in this area. Don''t do it.


    If you are building a kernel for an SMP system, enable the Enhanced Real Time
    Clock option. The RTC in your PC can also be used on uniprocessor machines, but
    I wouldn''t suggest enabling this unless you''re supporting multiprocessing machines.
    There is an associated character file called /dev/rtc to which clock status is
    written. To create it, run the following command:


    ```

    root@romans ~ mknod /dev/rtc c 10 135

    ```


    For more information about this option, see the associated help text and linux/Documentation.txt.


    If you''re using a system with an AGP-port 3D graphics card, you can enable /dev/agpgart
    to provide full AGP support for the card. As I write this, there isn''t much support
    for this functionality, but that''s likely to change. You should also enable the
    Direct Rendering Manager and the Direct Rendering Infrastructure (DRI) chip option
    that applies to your video card.'
