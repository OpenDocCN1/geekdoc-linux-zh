    # Default Permissions


    Perhaps you''ve wondered which permissions are assigned by default. That setting
    is configurable using the umask command, which is normally included in the /etc/profile
    and csh.login shell configuration files. The umask statement takes a numeric permission
    string that is similar to—but different from—the numeric permission strings used
    with chmod.


    The three-digit umask string is the "complement" to the permissions you want to
    enable by default. In other words, while a value of 7 is as open as you get with
    a chmod command, it''s as restrictive as you get with the umask command. Each
    digit of the default file permission setting is equal to 7 minus the corresponding
    umask digit. Thus, if the umask is 077, the default file permission setting is
    700, which is a fine setting for the root user.


