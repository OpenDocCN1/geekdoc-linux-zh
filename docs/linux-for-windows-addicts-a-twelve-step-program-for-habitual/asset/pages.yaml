  md: '# Linux for Windows Addicts: A 12-Step Program


    # # To Networks


    If there are networks you wish to access without using the primary gateway, you
    can use the Other Routes to Networks option to configure the correct gateway.
    For example, my company can have a separate network for customers who come for
    training or to make use of our on-site systems. Rather than have the primary systems
    access this network using our main router, we''ve configured each system to recognize
    that the network is connected through the firewall that separates the production
    network from the customer network.


    Setting this up in your own environment is not at all difficult using Linuxconf.
    Simply select the Other Routes to Networks option from the Config-Networking-Client
    Tasks-Routing And Gateways tab. On the tab that appears for the name or IP address
    of the gateway (router) to use access the destination network, the destination
    network itself, and the desired mask, as shown in Figure 7-3.


    Notice that the destination network ends with a .0 address. This is how you tell
    Linux that the whole network can be reached via this gateway. To reach a specific
    host instead, use the "To hosts" section, which is in the Linuxconf table populate
    the /etc/sysconfig/static-route files.


    Your entries in the network, 10.0.0.1 gw 10.0.2.240


    ```

    eth0 net 10.0.0.1 mask 255.255.0.0 gw 10.0.2.240

    ```


    ![](img/dcd0086266143e7048be2fb5e68a2391_249_0.png)


    Figure 7-3. Configure the Linux host to find routes to other networks'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Chapter 7: Step 4: Connect to a Network


    # To Hosts


    If you need to tell the host you''re configuring how it can access a specific
    host on another network, you can do so using the Other Routes To Hosts option
    from the Config-Net-working-Tasks-Routing And Gateways tree. This configuration
    is very straightforward; you simply indicate the address of the gateway that knows
    how to reach the destination host, and then enter the destination host''s IP address.


    This is useful when there are multiple routers connected to the local network
    and you want to be sure that the traffic to the designated host goes through the
    designated gateway.


    The Linuxconf entry modifies the /etc/sysconfig/static-routes file with one per
    host you specify. In this example, the system can reach 10.0.1.1 via the gateway
    at 10.0.2.240:


    ```

    eth0 net 10.0.1.1 netmask 255.255.255.255 gw 10.0.2.240

    ```


    # To Alternate Local Networks


    There''s one more option that fits into this treatment of other routing options,
    but it''s a little different from the preceding two. An alternate local network
    is an IP network that is logically different (it has a different network address)
    but runs on the same physical network (it shares a bus or is on the same physical
    wiring as the main network). If your network is structured this way, don''t fear;
    you can use the Routes To Alternate Local Networks from the Config-Networking-Client
    Tasks-Routing And Gateways tree to add the additional local networks.


    You''ll have to specify the network number (remember that this will end with at
    least one .0) and the network interface used to access this network, and you can
    specify an appropriate netmask for each network you specify.


    The changes made in Linuxconf are used to update the /etc/sysconfig/static-routes
    file; the following line indicates that the system can reach any host on the 10.0.3.0
    network via the second NIC (eth1).


    ```

    any 10.0.3.0 netmask 255.255.255.0 gw eth1

    ```


    # Routed Daemon


    The routed daemon is a process to maintain routing tables using the Routing Information
    Protocol (RIP) information, which allows dynamic routing. RIP is used to ascertain
    how many gateways must be traversed when data takes a particular route from one
    host to another. By comparing this count of “hops,” the hosts on a network can
    determine the most expedient way of getting from one place to another.


    In small environments with a very small number of interconnected networks, this
    is-important, but in more complex environments, there may be many different ways
    of delivering data from one host to another, it can be quite useful.


    But while this option configures the routed daemon, it''s not likely that this
    daemon will be enabled on your system. It''s not well loved by most networking
    folks,'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    who often peter gated. Still, you have the option to used routed, and your Linuxconf
    choices are simple.

    If you are configuring a host that will not do any routing (including almost every
    system with a single network card), you can enable the option to listen to routing
    information only. These hosts do not do any routing, they shouldn''t have anything
    to say on the subject. If, on the other hand, the system you''re configuring do
    routing, you should enable the Export Default Route option. This tells your system
    to announce its services and updates the dynamic routing tables via RIP.

    The changes made using the Linuxconf front are stored in the file /etc/sysconfig/routed.
    This file contains two variables that are read when routing is started.


    ```

    EXPORT_GATEWAY="no"

    SILENT="yes"

    ```


    # Name Service Search Path


    The next option is telling the Linux host how it should go about getting hostname
    information. There are three sources of information available for configuration:


    +   - /etc/hosts file

    - DNS server

    - Network Information System (NIS) server


    Using the Host Name Search Path option from Linuxconf''s Config-Networking-Client
    Tasks tree, you can specify which of those three sources the host you''re configuring
    results. You can also set the order in which they''re consulted. Simply indicate
    whether multiple IP addresses might be assigned for a single host, then select
    the option that orders the name service resources the way you want.

    The order you designate is reflected in the /etc/host.conf file, which contains
    two lines:


    ```

    order hosts, bind, nis

    multi on

    ```


    The first line lists the name service resources in the order they''ll be consulted,
    and the second line indicates that the system can deal with multiple IP addresses
    for a single hostname.


    # NIS Configuration


    If your network includes NIS servers (and if it doesn''t, there''s no point in
    consulting them in the “Name Service Search Path” section described above), you
    can configure the Linux host''s NIS clients from the Network Information System
    (NIS) option in the Config-Networking-Client Tasks tree. Enter the NIS domain
    and the NIS server address or name in the fields provided.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Chapter 7: Step 4: Connect to a Network


    233


    The changes made to the underlying system files by the Linuxconf front are reflected
    in two files. The first one is /etc/sysconfig/network, which has an NISDOMAIN
    entry set equal to the domain name you specify:


    ```

    NISDOMAIN="prolificinc"

    ```


    The other change is made in the /etc/yp.conf file. "YP" refers to "yellow pages,"
    a predecessor to today’s NIS that is also supported by Linux. The yp.conf file
    includes a ypserver pointed to the NIS server you specified:


    ```

    ypserver 10.0.2.3

    ```


    # IPX Configuration


    If you need the Linux system to be able to use the IPX protocol, you can configure
    the IPX protocol settings using the IPX Interface Setup option from the Config-Networking-Client
    Tasks tree. There are three tabs on which you can set IPX-related networking options:
    Config; Adaptor 1; and Internal net.


    # Config


    If you need IPX enabled, make sure the Enable IP Networking button is enabled.
    The two additional options allow the system to autoconfigure itself to select
    the correct interface and frame type for the network.


    Linuxconf changes to an underlying system file based on the options you choose.
    This file is for /etc/sysconfig/network, which includes a variety of network settings,
    including these three IPX-related entries:


    ```

    IPX="yes"

    IPXAUTOPPRIMARY="off"

    IPXAUTOFRAME="off"

    ```


    In these lines shown, IPX has been enabled, but the automatic configuration of
    the frame types has been disabled. In most cases, a Linux system being configured
    to read files from a NetWare server will be able to use the “on” settings for
    the two IPXAUTO-options.


    # Adapter 1


    If you wish to select your own frame types and network numbers, you can do so
    using this tab, as shown in Figure 7-4.


    Each section of this tab allows you to configure a frame type that may or may
    not be active on your network. If you’re an experienced NetWare administrator,
    these options will be easy to set. If you’re not, you should really opt for this
    type of configuration if the autoconfigure option on the Config page doesn’t work.


    You should enable any of the four listed frame types as you need to connect to
    NetWare servers on your network. The default frame type used on NetWare servers
    has'
