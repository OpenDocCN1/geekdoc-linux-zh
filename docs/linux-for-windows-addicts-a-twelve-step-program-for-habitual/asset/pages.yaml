    them. However, I also don''t recommend enabling more of these device support options
    than you really need. Below is a summary of my suggestions for the options selectable
    from the main menu.


    | Setting Name | Recommended | Safest If Undecided |

    |---|---|---||

    | Network Device Support | Y | Y |

