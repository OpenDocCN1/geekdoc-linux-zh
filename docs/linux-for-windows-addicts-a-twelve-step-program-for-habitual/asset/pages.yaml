  md: '# Linux for Windows Addicts: A 12-Step Program


    Having chosen to embark on your computer- and life-improvement project of de-taching
    yourself from the Microsoft collective, you have installed Linux and configured
    X to work and learn the way that makes you happiest. Now it''s time to undertake
    the next important step in the migration program: Decide to turn your system over
    to the power and flexibility of a customized kernel.


    Do you want to amateur (ham) radio, ISDN, Token Ring networking, or SCSI tape
    drives? Add them to the kernel. Could you care less about power management, symmetric
    multiprocessing, or 3Com network cards? Pull them out of the kernel. Can''t decide
    what you''ll want later? Rebuild the kernel as often as you like, create modular
    options for devices or features you don''t need yet, or build multiple kernels
    and see which one works.


    # WHY COMPILE A KERNEL?


    It''s a good question. After all, if all has gone well with your Linux installation
    so far, why going around in the holies of hotels? What''s to be gained?


    First and foremost, what''s to be gained is a Linux installation that''s tailored
    to your system and the tasks you''re giving it. The Linux distributions generally
    install a multi-purpose kernel that can handle a whole class of machines. But
    if you know what kind of hardware you''re using, why should you be chewing with
    a bunch of preloaded drivers that you''re not using?


    As far as goes, maybe there is other functionality you''d like to investigate
    on your system? Perhaps you''d like to set your Linux up as a router that has
    proved itself by staying up for a while. You may have to compile a kernel with
    routing functionality built in or it be firewalls, or a new SCSI card or a peripheral
    or who knows what.


    Perhaps the best reason to build your kernel, though, is to take advantage of
    the improvements being made by kernel programmers around the world. This isn''t
    a matter of grabbing random bits of code from random sources; the latest stable
    kernel, which is likely to be newer than the version that you have with your distribution,
    is available from http://www.kernel.org. The latest version, with the features
    (of which many are still in process), is also available at that site. You can
    keep track of what the developers are talking about by reading the Kernel Traffic
    summary available at http://linuxcare.com. These outstanding weekly summaries
    do fine job of boiling the technical discussions and the human interactions on
    the linux-kernel mailing list.


    For it''s worth, building a kernel isn''t difficult. It can take some time, especially
    if you''re using an older, slower system. And it can lead you into a little trouble,
    particularly if you forget some essential drivers or features. But in my experience,
    it''s far easier avoiding Microsoft junk mail, for example. So count your blessings,
    and let''s get going.


    # HOW TO COMPILE THE KERNEL


    All you''re doing when you compile the kernel is building a program. You don''t
    have to write any part of the program yourself, but you do have to tell it what
    options you want'
