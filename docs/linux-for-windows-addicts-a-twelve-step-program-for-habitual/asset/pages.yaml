- img_proc: true
  md: '# Chapter 13: Step 10: "Make" More Software


    To that end, the rpm command offers the -V option, which performs verification
    on the package or file—or all the installed packages. The brute-force method is
    to verify all packages, an operation that can take some time and spit out quite
    a bit of output:


    ```

    rpm -Va > rpm_verify.txt

    ```


    Notice the output from the rpm command is being redirected into the file rpm_verify.txt.
    This is a separate, optional step, but it''s much easier to review the data in
    a file across your screen.


    The output from the verification commands depends on whether there are differences
    between the data in the package and the files actually installed on your system.
    If there are no differences, there won''t be any output. For each file that differs,
    however, there will be output that looks like this:


    ```

    root@romans ~ rpm -VF /etc/sendmail.cf

    S.5....T /etc/aliases

    ```


    The cryptic-looking characters to the left of the /etc/aliases file show three
    ways in which the file differs from the original package specification and provides
    us with a piece of information that helps us interpret the results.


    The S means the filesize differs from the original file''s size. The 5 means the
    MD5 checksum for the file (which makes sense, as it appears the file has been
    changed). The T means the file has been modified from the original package date,
    which is also consistent with a file that has been changed. The c means that this
    file has been marked by the package as a configuration file, and therefore is
    likely to have been touched since the original installation. These values and
    the others (the periods in the example output indicate that the other values match
    the originals) are described in Table 13-2.


    Installation If you check the man page for the rpm tool, you''ll find that there''s
    a -U option that allows you to do package installation. Why am I suggesting that
    you use the -U option? It''s my experience that the fewer options I''m using infrequently,
    the more likely I remember the ones I use frequently. And the -U option provides
    the dual functionality of installing packages that aren''t already installed and
    upgrading packages that need upgrading.


    The basic approach for applying this command to real life is pretty simple. Specify
    the package on the command line like this:


    ```

    root@romans ~ rpm -Uvh webmin-0.78.rpm

    ```


    The -U option, as I mentioned, specifies the upgrade operation. The v option,
    specified together in this context, causes the package name to be displayed next
    to a set of pound signs that are placed sequentially as the installation process
    proceeds. This gives you an idea of the progress being made if the package is
    large.'
