  md: '# About the Author


    Michael Joseph Miller is the author of Migrating from NetWare to Windows NT (Sybex),
    but finds that most people don''t hold that against him. His other published work
    includes Managing an Inherited NetWare Network (Sybex) and some poetry. He has
    managed NetWare, NT, Solaris, and Linux networks, including the primarily Linux-based
    development environment at PROLIFIC, Inc., the electronic design automation (EDA)
    software firm where he works.'
