  md: '# Configuring XFree86 4


    While running XFree86Setup used to be mandatory unless your Linux distribution
    included another tool, that''s no longer the case if you use XFree86 4.0.x. The
    latest versions of the X Window System incorporate a configuration mode that configures
    things far more automatically than that. However, many available distributions
    don''t yet use XFree86 4, which is more powerful than its predecessor, but may
    not be as stable.


    You can determine which version of XFree86 you''re using by running the following
    command from a console prompt or xterm:


    ```

    millerm@romans -> XFree86 -version

    ```


    This will tell you the version number and build date. If you''re using a distribution
    that includes XFree86 4, it can be configured by the root user with the following
    command from the line:


    ```

    root@romans /root> XFree86 -configure

    ```


    This will generate a configuration file, called XF86Config.new, in the current
    user''s home directory. You can test this configuration by running the following
    command:


    ```

    root@romans /root> XFree86 -xf86config /root/XF86Config.new

    root@romans /root> cd /etc/X11/

    root@romans /etc/X11> mv XF86Config XF86Config.orig

    root@romans /etc/X11> cp /root/XF86Config.new ./XF86Config

    ```


    If this results in an X Windows system that looks good, the root user can replace
    the existing configuration file with the new one (saving the old one just in case):


