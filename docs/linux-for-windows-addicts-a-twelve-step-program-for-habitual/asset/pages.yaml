  md: '# Chapter 8: Step 6: Mingle with Microsoft, Network with Novell 271


    Windows system, if you let it, you''ll find that at the end of each line there
    is ^M sequence. It''ll drive you insane if you do, so this option is supposed
    to help translate the two systems so that neither gets short-sheeted.


    There are three options for the translation mode field: Binary; Auto; and Text.
    The Binary setting performs no translation on the files. The Auto setting attempts
    to match the file''s extension with a list of known program, archive, layout,
    and graphics extensions. If the extension doesn''t match one of those, it''s assumed
    to be a text file and is translated. The Text setting translates each and every
    file, even ones that could be assumed as binary files.


    While Auto is reasonably safe, the best course of action is to avoid using the
    same files on both systems as much as possible. If you share files on a dual-boot
    system, that''s fine, but otherwise, go ahead and move the files over to a native
    ext2 filesystem. And select the Binary option.


    Here''s an example of what a line in the /etc/fstab might look like once you''ve
    configured these options:


    ```

    /dev/sda2 /mnt/windoze vfat rw,conv=binary,uid=504,gid=501,umask=700 1 0

    ```


    In this case, the vfat filesystem on /dev/sda2 will be mounted in the /mnt/windoze
    directory with read-write access. Files and directories will be owned by the user
    whose ID is 504 and the group whose ID is 501, and the default permissions for
    those files and directories will be 700, which gives full read, write, and execute
    permissions to the user owner account and prevents access from everyone else.
    The filesystem at /mnt/windoze will be installed in a system dump, and will not
    be touched with fsck.


    Linuxconf offers two fields: one is a comment field you can use to remind yourself
    what you''re doing with the filesystem you''re configuring; the other is a Generic
    Options field that''s included because there are other options that can be fed
    to the mount command. Check the man pages for mount and fstab for more information.


    # Windows VFAT Partitions


    The later Windows 9x partitions use the VFAT filesystem, which added support for
    long file names. Mounting a VFAT filesystem from the Linux command line is very
    similar to mounting a FAT filesystem; only the partition type is different:


    ```

    root@romans > mount -t vfat /dev/sda2 /mnt/windoze

    ```


    Performing the same task with Linuxconf is identical to the process used to mount
    a FAT filesystem, with the obvious exception that you must specify the VFAT type.


