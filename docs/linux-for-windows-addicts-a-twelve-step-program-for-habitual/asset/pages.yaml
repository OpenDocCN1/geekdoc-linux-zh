  md: '# Linux for Windows Addicts: A 12-Step Program


    # Linux Offers Freedom


    So you may not care that Linux runs on almost any hardware available, but that''s
    one way it offers freedom. Maybe you care instead of not having to pay $100 every
    time Microsoft comes out with a new operating system. You don''t have to buy a
    new copy of Linux; you can download it, copy it from a friend, or get a cheap
    CD. Or you can purchase a shiny, new boxed copy with a complete manual and several
    CDs worth of latest applications. You''re free to choose.


    Maybe you don''t like the interface looks on your PC. Maybe, unlike me, like the
    look of the Mac OS. Great! There are multiple window managers available for Linux,
    and you can make your desktop look like Windows, a Mac, a Sun workstation, or
    whatever else your boat. You''re free to choose.


    Maybe you need to link to other computers, even weird ones. Perhaps you''ve got
    an OS/2 disk, or a Mac disk with all your data on it, and you''d like to keep
    reading from it for a couple of years. Once again, you can make a copy of software
    to run on your new computer? You''re free to do so—legally and ethically.


    Get the idea? If you''ve got the ability to write your own programs, you''ve got
    more freedom, as there are many development tools, libraries, and extensions you''re
    free to use. And there are countless projects you''re free to contribute to (or
    to start yourself).


    # Linux Works Well


    I''ll talk about this in the next chapter, but Linux works well right now. In
    my office, I have two systems. The older Pentium Pro system runs the flavor du
    jour of Windows, and it stays up between crashes. If one program crashes on my
    Windows box, I kill it and no other programs are harmed. If one program crashes
    on my Linux box, I kill it, I wait for a while, try to kill it again, and hope
    that someday control will return to my keyboard and mouse.


    My Windows box talks to my Linux very well. This is because my Linux speaks Windows
    very fluently. I save my files to the Linux box (as I mentioned, it doesn''t go
    down, and I''ve never had a problem with file corruption on my Linux box, while
    I''ve had cases of SanDisk finding the lifeless remains of a file I was working
    on before the Windows crashed).


    My company''s software is used in designing integrated circuits. It is very sophisticated
    and process-intensive. Our compute farm consists of multiprocessor machines running
    Linux, and when we have to perform a benchmark or do some work for a client, all
    those CPUs are running as fast as they can. This is an excellent way to crash
    a Windows system, but it doesn''t faz Linux. I manage more servers for this company
    than I have for previous times, but I''ve got a smaller staff (me, myself, and
    I). This works because the Linux boxes work hard, they work continuously, and
    they work well.'
