    # Security Commands


    As we continue our whirlwind tour of Linux commands, I''d like to point out just
    three security-related commands. Many security functions can be performed from
    within Windows, so that''s often where people choose to go, but it''s only wise
    to know the basic commands just in case.


    # passwd


    The `passwd` command sets a user account password. When you run `passwd` as a
    normal user, you can change the password for the account you''re currently using.
    When you run `passwd` as root, you can change the root password or the password
    for any other user account. Be careful not to forget the root password, because
    it can be a hassle to recover.


    # chmod


    The `chmod` command is used to change the permission attributes of a file or directory.
    If you have permissions to the file or directory you wish to change (either as
    a user or a group), you should be able to use `chmod`.


    # chown


    The `chown` command changes the owner and/or group attributes of a file or directory.
    If you want to change ownership of a file or directory, you must be root or the
    current owner.


    # Networking Commands


    Although there are many network-related commands available on a Linux system,
    I''ve selected a few that are particularly noteworthy. Others, such as `ping`,
    may also be useful, but we''ll cover them all in more detail in Chapter 9.


    # ftp


    Guess how the file transfer protocol is. That''s right, it''s used to transfer
    files! The widespread appeal and availability of the Internet has made ftp a familiar
    concept to many users, even those who haven''t used the version included in Windows.
    Although you can use any web browsers to access ftp sites, you can also use a
    command-line tool. The `ftp` tool allows you to specify which files you''re transferring
    text files or binary files; it allows you to transfer multiple files at one time;
    and it even allows you to delete files on the remote system (if you have the rights
    to do so).'
