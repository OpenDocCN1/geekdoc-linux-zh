    efficient set.


    The numeric permission settings are based on an octal system in which four digits
    from 0 to 7 specify the owner permissions, group permissions, other permissions,
    and the special bits (sticky bit, setuid, or setgid).


    For the standard permissions, a value of 1 sets the "x" permission, while a value
    of 2 sets the "w" permission, and a value of 4 sets the "r" permission. You can
    add values to set multiple permissions at once, or you can use 0 to turn off all
    permissions. The results are the digits shown in Table 14-4.


    File and directory permissions are often set using three numeric digits. The first
    of the three digits sets the permissions for the owning user. The second digit
    sets the permissions for the owning group. And you won''t be surprised to learn
    that the third digit sets the permissions for the rest of the world.


    So if Karen wanted to give herself read and write access to a file, but only wanted
    to give the owning group access and wanted to lock out the other users entirely,
    she could use this command:


    ```

    karen@romans -> chmod 640 ~karen/christmas_cards.txt

    karen@romans -> ls -1 ~karen/christmas_cards.txt

    rw-r------ 1 karen 10345 May 23 20:05 christmas_cards.txt

    ```


    On the other hand, if she had less personal data and wanted to give full access
    to a directory to herself and the owning group, she could use the following syntax:


    ```

    karen@romans -> chmod 770 ~karen/share/

    karen@romans -> ls -1 ~karen/share/

    drwxrwx--- 5 karen 4096 May 23 20:05 share

    ```


