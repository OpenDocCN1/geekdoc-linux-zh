  md: '# Linux for Windows Addicts: A 12-Step Program


    # USB Support


    The Universal Serial Bus (USB) is a relatively new way of attaching peripherals
    to a personal computer. Although it has been around for a few years, USB still
    isn''t overwhelmingly utilized in PC hardware, but this seems to finally be changing.
    In fact, it''s possible to purchase "legacy-free" systems that eschew Ps/2, keyboard,
    serial, and parallel ports in favor of flexible USB ports. The USB connector takes
    less time than standard serial or parallel connectors, so that there''s an advantage
    in many ways.


    If you use USB ports and peripherals, you can tell the kernel to support for them.
    While most of the USB support options are specific to the devices you use, there
    are a few general settings you should be able to figure out independent of your
    hardware.


    | Setting Name | Recommended | Safest If Undecided |

    |---|---|--|

    | Support For USB | Y if you use USB ports and devices | M |

    | USB Verbose Debug Messages | N | N |

    | Preliminary USB Device Filesystem | Y | Y |


    Enable Support For USB if you want to use USB devices. There''s no need to turn
    on USB Verbose Debug Messages unless you''re doing troubleshooting of the USB
    code, but if you enable, you should also enable the Preliminary USB Device Filesystem,
    which populates the /proc/usb directory with information about your USB bus and
    the devices connected to it.


    You must enable one of the USB Controllers options; systems with Intel chipsets
    are most likely to use one of the UHCI drivers, while systems without Intel chipsets
    are most likely to use the OHHCI driver. Select additional device support as appropriate
    for your menagerie of USB devices, and you''re done.


    # Kernel Hacking


    This last option is supposed to be for kernel hacking; it provides key combinations
    using the SYSRQ key found on most current keyboards (the key also known as PRINT
    SCREEN). These key commands can give you control of the system even when the kernel''s
    not behaving as it should.


    The trouble is that most of these actions should only be taken on a system that''s
    being used for testing. You don''t want your production system being unintentionally
    rebooted, its processes stopped and restarted, or all programs killed in the current
    virtual terminal.


    | Setting Name | Recommended | Safest If Undecided |

    |---|---|--|

    | Magic SysRq Key | N | N |'
  merge: -1
