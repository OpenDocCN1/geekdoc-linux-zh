    # Mail to Fax Gateway


    Does the option of sending faxes via email appeal to? Linuxconf can do some configuration
    of sendmail to this end. You may set up allowable zones, authorize certain addresses
    to send fax messages, encrypted or otherwise, to numbers in those zones, and log
    these faxes.


    There''s a basic fax spooling script in the /var/lib/linuxconf/lib/ directory,
    and it can feed messages to a program called faxpool. This in turn prepares the
    messages to be delivered by the sendfax program. Check out the man pages for more
    information on these scripts. Other fax programs are available, and some of them
    may be more friendly than these programs.


    # Virtual Email Domain


    If you want to add virtual domains to the email handled by the sendmail server,
    this option allows you to configure them. The help text is quite helpful for details
    on how to set up the DNS servers to support the virtual domains, and the sendmail
    configuration is straightforward.


    Each virtual domain is handled separately from the primary domain sendmailing
    on the system. For each virtual server, you can specify the following information:


    +   * fully qualified virtual domain name (required)

    * A fallback destination for messages that don''t match an alias or known user

    * If you leave this field blank, unmatched messages will be bounced. If you specify
    a domain (@domainname), the message will be sent to the same username at the specified
    domain. If you specify a specific user and domain (user@domain), the mismatched
    message will be sent to that user. If you specify a username by itself, the message
    will be forwarded to that user in that same domain name.

    * A starting user for users in this virtual domain

    * A limit on each user''s inbox size. Default is no limit (0).

    * Additional aliases filenames (the first is /etc/vmail/aliases.domainname)

    * Additional domains that should be virtualized to this same definition


    # Mail User Configuration


    Getting the server ready to handle incoming and outgoing messages wasn''t too
