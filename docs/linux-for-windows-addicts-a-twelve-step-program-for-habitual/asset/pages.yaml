  md: '# What D''Ya Mean, Easy?


    People seem to think that whatever operating system they''re used to is easy.
    I spent a couple of hours talking to a guy who was getting a DSL line for his
    iMac. He told me how easier it was to set up Mac networking than Windows networking.
    He told the phone company DSL installers how much easier it was. Then he proceeded
    to take about as long as setting up networking as I would have needed for a Windows
    system (It didn''t matter much, as the DSL line hadn''t been properly configured
    on the back end and we couldn''t get to the Internet).


    I don''t mean to slam the Mac or to praise Windows for its ease of use. The point
    is that people usually mean "familiarity" when they talk about ease of use. Another
    case in point: My wife happily talks about quitting her job at Sun Microsystems,
    starting work as a teacher, where she was provided with a Macintosh computer.
    It took her a long time to figure out that the Mac''s power was turned on from
    the keyboard.


    The keyboard is a better place to put a power switch than somewhere on the computer''s?
    I don''t think so, though I don''t think it''s any worse, either as you consider
    whether to try Linux, and whether to move to Linux, think about this: Anything
    seems alien to you now will seem familiar later. So the question is: Which operating
    system offers you the most compelling functionality? I''ll discuss that in Chapter
    2.


    # Extensive Network Support


    Windows has come to support a variety of networking functions, as well as a wide
    range of protocols used by different networking systems. But it''s topped in most
    areas by Linux, which has been shaped by a community dedicated to standards and
    open communications and is based on Unix, which was networked before you could
    issue a "net start" command in Windows for Workgroups.


    Mail systems, web servers and browsers, network management tools, server clustering
    tools, enterprise databases, and most of the other types of network functionality
    you might want are all available for Linux systems, and are becoming all the time.


    # Interoperability


    Linux does a good job of following the standards in computing today. So if you
    want to connect Linux systems on your network and access files and printers between
    Windows and Linux machines—you can do it. If you want to connect to Macintosh
    computers, SNA hosts, NFS partitions, and a host of other ... well, hosts—you
    can do it.


    Heck, Linux has long allowed you to hook up your amateur (ham) radio to your computer.
    You want interoperability? Beat that. And of course, there are DOS and Windows'
