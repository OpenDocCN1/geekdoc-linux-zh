  md: '# Linux for Windows Addicts: A 12-Step Program


    If you''re reading this book because you loathe everything you think Microsoft
    stands for, welcome. If you''re reading this book because you work in Microsoft''s
    marketing de-partment, welcome. welcome And especially if you''re reading this
    book because you want to help moving from Windows to Linux....welcome.


    I don''t think everyone can—or should—migrate from Microsoft to Linux. And I don''t
    feel that this is life''s most important decision by any stretch of the imagination.
    But I know how much time I spend in front of my own computer and helping others
    with theirs. And I also know how much satisfaction I''ve gotten from using Linux
    and how nice it is not to be locked into a single company''s operating systems.
    This book is intended to help readers see their need to change and give constructive
    steps to facilitate that change.


    # WHO SHOULD READ THIS BOOK


    This book is intended for users of Microsoft operating systems, whether they''re
    happy about it or not. You should read this book if


    +   - You run a Microsoft operating system on your personal computer.

    This book is meant to serve as the bridge from your experience as a Microsoft
    user to your new life as a recovering Microsoft user. While large amounts of documentation
    exist already, much of it is created by people who don''t use Microsoft products.
    I do use Microsoft products on a daily basis. I also use Linux on a daily basis,
    and I think you''ll like Linux once someone shows you how.


    +   - You administer a Microsoft network.

    If you are a Microsoft system administrator thinking about experimenting with
    the Linux operating system, this book will give you a good start.


    +   - You''re curious about the hubbub over Linux.

    Computer companies don''t normally publish books like this one, and to be honest,
    computer book authors don''t normally write books like this one. You may comment
    on the whole Microsoft versus Linux confrontation? It''s here. And you want general
    information on Linux? It''s here. And I think you''ll have fun reading it.


    +   - You hate Microsoft.

    While I''m not sure if this is the healthiest way to express yourself, I''m meeting
    more and more more people who feel this way. The ones I''ve enjoyed reading this
    book and have been encouraged by the ease with which they''ve been able to end
    their reliance upon a company they dislike so much.


    +   - You love Microsoft.

    I''m even less sure that this is a healthy feeling; you have to know that a company
    can''t love you back, but that''s your choice. If you read this book and decide
    still to love Microsoft and its products, good for you. I''ve got to warn you,
    though, it''s possible that considering Linux will awaken you up to a need you
    didn''t even know you had. So read on, but read carefully.'
