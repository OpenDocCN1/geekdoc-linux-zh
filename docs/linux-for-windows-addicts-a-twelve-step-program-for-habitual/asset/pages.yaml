  md: '# Chapter 8: Step 5: Manage Users and Groups


    One way the UUOCP user configuration is different in the primary group assigned,
    which is always uucp. Another difference is that there is no shell defined, because
    everything the UUOCP boils down to a job transferring data from one system to
    another. The last difference is in the default home directory, which is normal
    /var/spool/uucpublic. The configuration files for the UUOCP setup are found in
    /etc/uucp directory.


    If you don''t have an existing need for UUCP, I wouldn''t recommend implementing
    it; while many Unix users are quite familiar with it, Windows administrators might
    as well stick with PPP for dial-up connections.


    # SETTING ACCOUNT POLICIES


    The last user-account-related configuration options to which we need to turn our
    attention are the general policies that dictate how accounts are validated, which
    shells are usable, and what information should be given to users when they log
    in.


    # Account Policies


    The system account policies include two major types of information: rules for
    validating the passwords when they are created or changed, and default account
    management rules. While you can specify the account management settings for individual
    users when they’re created, you can also configure the system’s default settings
    as you want.


    # Password Validation Rules


    There are several of these rules, and some of them are familiar to administrators
    of other network operating systems, some are unique to Unix and Unix-like environments.
    These options can be seen in the top half of Figure 8-3, which shows the web-based
    Linuxconf interface to the Password & Account Policies


    You can use these options to make your passwords more difficult to guess by making
    them longer and increasing the required of non-alphabetic characters. If you enable
    the Private Group option, each user will be assigned to a corresponding group
    created at the same time. Disabling this option causes users to be added to a
    single group by default; you can change that group when you create the user.


    If you don’t the standard /home directory be the default base directory for your
    users, you can change that base directory to the location you specify. This may
    be useful in particular when your users have home directories on a different system
    than the one you’re creating accounts.


    The Creation Permissions option may seem a little oblique to Windows administrators
    without Unix experience. It simply means that when the new user’s home directory
    is created, access permissions need to be assigned. The value shown in Figure
