    This is the screen from which you can configure your mouse to run in X. Most recently
    built computers use the PS/2 port to connect a 2-button mouse, or a serial mouse,
    with 3 buttons. But you might still need to make sure X knows what it needs about
    your mouse.


    First, you need to make sure X and your mouse are speaking the same language by
    checking the mouse protocol. You can do this by pressing the button at the top
    of the page that connects to your mouse. So, for example, if you''re using a PS/2
    mouse, you''ll want the PS/2 button selected. (If your mouse isn''t working, press
    the P button on your keyboard to change the selected button.)


    Next, look at the mouse device it is connected to. As I mentioned in Chapter 3,
    physical devices in Linux are referred to as files under the /dev directory. So,
    for example, if you have a PS/2 mouse, the corresponding device is /dev/psaux.
