  md: '# Linux for Windows Addicts: A 12-Step Program


    In the last chapter, I investigated the process of adding more software to a Linux
    system using packages and source files. I think that''s one of the most exciting
    parts of Linux, because I''m always intrigued to see the great tools people are
    building and making available for others to use and improve.


    In this chapter, we''ll look at another kind of sharing; this one is between systems
    on your network. It''s an important detail, so important that it is Step 11 on
    the route to recovery, which tells us to share files to improve conscious contact
    and schedule our jobs to carry them out.


    # FILE PERMISSIONS REVISITED


    We''ve talked about file permissions before; if you recall, using the ls -l command
    to display a file list also shows the permission bit settings in a directory''s
    files and directories. Knowing what those permissions are and knowing how to use
    them are two different matters, however, so I''d like to return to both subjects.


    # Determining Permissions


    Like any other multiuser system, Linux must keep track of who owns files and who
    is allowed to monkey with them. You don''t want any tomfoolery going on each other''s
    files, and you certainly don''t want any ability to restrict access to the system,
    or to share files as needed. Just as NT and Windows 2000 have file and directory
    permissions, and NetWare has permissions set for both files and directory permissions.
    For the most part, dealing with the file and directory permissions separately
    will work fine, but there are plenty of circumstances in which the combination
    of permission settings is significant. Accordingly, we''ll first look at the individual
    file and directory permissions, and then we''ll examine ways in which the permissions
    interact.


    # Determining Ownership


    The file-management tools that KDE and GNOME do a fine job of showing ownership,
    but you won''t always have the luxury of access to an X Windows interface, so
    we''ll consider the details of determining ownership using command-line tools.
    The concepts are easily applied to what you will see using the widely used GUI
    file managers.


    If I want to check out the ownership of Karen''s Christmas card list, I can use
    the ls command with the -l option.


    ```

    millerm@romans ~ ls -l -karen/christmas_cards.txt

    -rw-r------ 1 karen karen 10345 May 23 20:05 christmas_cards.txt

    ```


    From this, I see that the file is owned by the user karen and the group karen.
    Neither is surprising. But what if the listing looked something like this instead?


    ```

    -rw-r------ 1 501 501 10345 May 23 20:05 christmas_cards.txt

    ```'
