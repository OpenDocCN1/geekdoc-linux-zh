    using PartitionMagic is the only one on the system. There won''t be any choices
    for you; you should simply click the Next button to continue to the Format Partitions
    screen shown in Figure 4-15.


    There should be two partitions: A root partition with mount point "/" and a virtual
    memory partition. The virtual memory partition is more commonly known as a swap
    partition. When memory is scarce, the operating system uses the disk space in
    the swap partition to swap things in and out of RAM. Check to see that the partitions
    have the correct mount points, that the root partition is the size you specified,
    and that the swap file is at least as large as the amount of RAM in your system
    (preferably twice as large). Then click the Format Chosen Partitions button, but
    remember that once you do so, you can''t undo what''ve done.


