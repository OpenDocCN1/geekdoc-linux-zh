  md: '# Chapter 6: Step 3: Compile a Kernel


    | Setting Name | Recommended | Safest if Undecided |

    |---|---|---|n| Set Version Information On All Module Symbols | N | Y |

    | Kernel Module Loader | Y | Y |


    Activating the Loadable Module Support feature allows you to compile certain kernel
    options as modules. These modules aren''t included in the main kernel; they can
    be loaded into and removed from the kernel''s currently running on an as-needed
    basis. I''m going to recommend making certain options into modules, so please
    enable loadable module support.


    The Set Version Information on All Module Symbols is a grandiose way of saying,"let
    me use modules from another kernel with the kernel I''m building." This is useful
    if you want to load a module that someone built with another version of the kernel,
    or if you want to load a module that wasn''t part of the Linux kernel code at.
    This doesn''t happen terribly, and because we''re going to be making modules for
    the kernel we''re building, you shouldn''t need unless you get modules from other
    people.


    The Kernel Module Loader builds into the kernel the allow load modules as needed.
    Kmod, the process that handles loading of modules, can also be configured to remove
    unused modules. See the kmod documentation in linux/Documentation/kmod.txt for
    more information about how to do this.


    # Processor Type and Features


    These options allow you to customize the kernel to reflect your computer''s CPU
    type. The general rule is to choose settings that reflect no functionality than
    your system supports. In other words, if you use processor settings from a previous
    generation of chips, you''re much more likely to be successful if you select options
    that exceed your computer''s specs. Obviously, you can get the best performance
    by specifying the options that line best with your exact system settings. The
    suggested settings for these options are shown below.


    | Setting Name | Recommended | Safest If Undecided |

    |---|---|---|n| Processor Family | The one matching your CPU | 386 |

    | Intel P6 Microcode Support | N | N |

    | Model-Specific Register Support | N | N |

    | CPU Information Support | N | N |

    | High Memory Support | Off | Off |

    | MTRR (Memory Type Range Register) Support | Y | Y |'
