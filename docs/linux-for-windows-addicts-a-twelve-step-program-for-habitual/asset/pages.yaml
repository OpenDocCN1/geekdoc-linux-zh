  md: '# Linux for Windows Addicts: A 12-Step Program


    Other Linux distributions may put this configuration file in a different location;
    if it''s not in that directory on your system, you''ll have to check your documentation
    or do a search for the file to find it.


    Domain IP Address This field allows you to specify the IP address that multiple
    domains are sharing on your web server. This should be an IP address, but you
    could also add a colon and a port number if you want to specify the hosts on a
    particular port. The address you enter here is added to /etc/conf/httpd.confd,
    as shown here:


    ```

    NameVirtualHost 10.0.0.12

    ```


    Server Name While most systems won''t require this entry, it''s not a bad idea
    to set the server name to be the one you want. Depending on your DNS records are
    set up, omitting this entry might make Apache select the wrong name for your server.
    While this is rare, you can avoid it by entering the fully qualified domain name
    of your server. be reflected in the /etc/conf/httpd.confd file in a line like
    this one:


    ```

    ServerName www.mikeandkaren.com

    ```


    Document Root The document root is the directory you''d like to be the top-level
    location for documents provided by the server. The full path from the server''s
    root directory to the directory where the top-level files will be stored. This
    entry will be placed in the /etc/conf/httpd.confd file like this:


    ```

    DocumentRoot /home/httpd/index.html

    ```


    This is a typical address because it''s how Red Hat and other distributions set
    up the Apache server. In this case, if a web client looked at www.mikeandkaren.com/index.shtml,
    they''d be pointed to /home/httpd/httpd/index.shtml on the Linux server.


    Web Server Log Files The Apache server will gladly maintain several log files
    for you, allowing you to see what kind of errors, transfers, browsers, and referring
    sites notices. Each of these options may be specified separately, so you don''t
    have to set any of them. The information can be useful, though, so I recommend
    setting them all, especially if you''re snoopy like I


    All these settings are assumed to be relative to the Apache server''s ServerRoot
    (which is /etc/httpd in Red Hat and many other distributions), unless they begin
    with a slash, which indicates that the entry is an absolute file path from the
    server''s root directory (/).


    The Error log option allows you to specify the name of the log file for the server''s
    error messages. The Transfer Log field specifies the location of the log file
    in every access to the server is logged. The Agent Log is used to record the web
    browsers used by visitors to your site. Finally, the delightfully spelled Referer
    Log refers to links that send visitors to one site from another.


    Using fairly normal configuration settings would result in the following lines
    being entered in the /etc/conf/httpd.conf file, with one exception. The AgentLog
    ip'
