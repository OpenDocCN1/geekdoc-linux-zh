    # Filesystems


    This set of options allows your Linux system to read (and, often, to write) a
    variety of different filesystems. While there are certain filesystems that should
    always be enabled (the Linux default file system type, ext2, and the standard
    CD-ROM filesystem, ISO-9660, come to mind), there are a number of other filesystems
    that may be useful in a mixed environment; you''ll have to decide which worth
    building into the kernel or compiling as modules, and which you don''t expect
    to need. My suggestions are shown here.


