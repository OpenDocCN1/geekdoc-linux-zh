- img_proc: true
  md: 'Note that there are a couple more package options that I won''t cover. The
    first is SLP, which is used by Stampede distribution (http://stampede.org). It
    aims to make packages less dependant on package managers, but it''s not widely
    used, at least as I write this. The other isn''t really a package, it''s a compressed
    tar file, commonly known as a tarball. I''ll discuss these files a little more
    in the "Compiling Source Tarballs" section of this chapter, but they lack the
    file dependency information that''s included in what I consider a proper package.


    #  Package Management


    There''s a dizzying array of packages available for use on Linux platforms, and
    two of the easiest ways to access and install them is through use of package managers.
    In recent chapters, I''ve been focusing on the Red Hat distribution''s tools;
    naturally, because the popular Debian distribution and its ilk use a different
    package manager, you might find yourself having to (rasp!) ... read the documentation
    if you use one of the DEB-based distributions.


    While I''ll generally explain the use of a GUI tool before explaining how to make
    some changes from the command line, I''d like to reverse that sequence in this
    case. Automating package installation is very easily accomplished by scripts,
    and it requires a little understanding of the command-line functions.


    If you find the command line completely frustrating, please skip ahead to the
    "Kpackage" and "GnoRPM" sections that follow. These are standard GUI tools that
    come with the KDE and GNOME desktop environments, and they''re extremely easy
    to use and are quite powerful. They aren''t designed for hands-free batch processing.


    # Command-Line RPM


    Using the rpm command isn''t difficult, and it''s certainly extensively documented.
    See the man page and the documentation at http://www.rpm.org. The primary actions
    are easy to figure out, though. They''re listed in Table 13-1.


    | RPM Option | Description |

    | - | - |

    | rpm -q | Query the RPM database |

    | rpm -V | Verify installed files against original package |

    | rpm -U | Upgrade or install package |

    | rpm -e | Uninstall products |


    Table 13-1. Basic RPM Command-Line Options'
