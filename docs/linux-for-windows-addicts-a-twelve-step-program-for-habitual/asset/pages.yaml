  md: '# What If My Computer Won''t Boot from the CD-ROM Drive?


    If you''re using older hardware to install Linux, and if you don''t purchase a
    retail version of Linux (one that comes with a floppy drive), you may run into
    trouble if your computer won''t boot from a CD-ROM. If this is the case, first
    check your computer''s BIOS setup program to see if you can set the system to
    boot from CD-ROM. If that''s not an option, you''ll have to make a boot floppy.
    Most distributions include the tools to do this from Windows. In Corel Linux,
    the process goes like this:


    +   1. Insert a floppy disk—one that doesn''t contain any vital data—in your computer''s
    floppy drive.

    2. Double-click on the My Computer icon on your Windows desktop, and right-click
    on the floppy drive icon when it appears. Select the Format option from the menu.

    3. In most cases a Quick format will work fine, so click Start to commence the
    format. When the format finishes, click Close to the summary window and then click
    Again to close the Format window.

    4. Back in My Computer window, right-click on your CD-ROM''s icon and select the
    Explore option. Double-click on the folder to open it.

    5. Double-click Bootflap.bat to start the program, which will open in a DOS box.
    Be sure you''ve got the right disk in the drive (well, you formatted it pretty
    too late now anyway), and press any key to create the boot floppy.

    6. The program will let you know which track and head is being accessed and will
    tell you when it''s done. Close the window, and you''ve got your boot disk!


    # Installing Core Linux


    To begin installing Linux, choose the Windows programs you have open, and then
    insert the Core Linux CD-ROM in your CD-ROM drive. If your computer automatically
    detects CD-ROMs, you should automatically be presented with the Corel Linux Autorun
    screen. If you don''t see this splash screen after a few moments, you may have
    CD-ROM autoplay enabled in Windows. To commence with the installation, simply
    double-click on the My Computer icon, and then double-click on your CD-ROM drive''s
    icon. Installing Core Linux is very easy:


    +   1. To move along with the startup screen, click the Next button. You should
    see a screen similar to the one shown in Figure 4-6.'
