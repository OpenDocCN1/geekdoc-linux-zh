    The Z (zsh) is the most feature-laden of the three, so if you have to have every
    available shell function, it can be useful. However if you use the TC (tcsh),
    which is based on an earlier shell, don''t use csh, which often isn''t an option
    due to some unpredictable behavior and functional limitations. Csh uses syntax
    similar to the C programming language, which it popular with C-literate users.


    # Shell Scripts


    A shell script is a program written using a shell. These scripts are very similar
    to the batch files used under DOS or Windows, they offer more power and control.
    Shell scripts handle everything from automating routine tasks to performing product
    installations or working as full-fledged applications. Running a script isn''t
    difficult; if you''re using the same shell as the script is, you can just type
    the script name. If you''re not using the same shell as the script is, you simply
    type the shell name before the script name:

    millerm@romans:-> zsh atone.zsh


    You can tell which shell a script uses by its first line. Shell scripts are text
    files, and their first lines should always have a pound sign and an exclamation
    point, followed by the full path to the shell program, like this:


    ```

    #!/bin/bash

    ```


    # Environment Variables


    Have you ever played with a CONFIG.SYS file on a DOS machine? Maybe you have and
    never want to do anything like that. While you may not have to tinker with environment
    variables in Linux, either, they can be used to make it easy for programs (including
    shell scripts and commands you run from a prompt) to find files or know your preferences.'
