  md: '# Linux for Windows Addicts: A 12-Step Program


    The user''s home directory comes next; you''ll set aside a place for home directories,
    and /home directory is traditionally used for this purpose, though there are a
    variety of different ways of approaching this issue. The command interpreter is
    the user''s default shell; I''d recommend using /bin/bash unless you or your user
    have a stronger preference for /bin/tcsh.


    You can also use the numeric user ID if you want to; if you do not make an entry
    here, the system will allocate the next available ID number, which may be fine
    for you. I like to allocate ID numbers based on a user''s department or job description,
    so I generally opt to set the user ID myself.


    Base Information Storage The information you''re entering in Linuxconf goes into
    Linux configuration files that can be viewed and manipulated directly. The base
    information goes into the file /etc/passwd, which stores user account information.
    Some lines extracted from a Linux system''s /etc/passwd file are shown below:


    ```

    albers:0GGccYX5Q:501:100:Daniel J. Albers:/home/albers:/bin/tcsh

    dedoo:neboLEFKHJg:502:100:Paul de Dood:/home/dedood:/bin/tcsh

    brian1:0GVdfUWInhw2:305:200:Brian1:/home/brian1:/bin/tcsh

    demo:NgjZqUhcobjS:605:200:Demo:/home/demo:/bin/tcsh

    ```


    The first entry in each of these lines is the login name (the columns separate
    the different entries). The second entry is a password hash code, but we''ll talk
    more about them later. The next is the user ID, and the number that follows it
    is the user''s primary group ID. The user''s full name comes next, followed by
    their home directory and shell. You can edit most of this information manually
    to good effect, but the password field is more complicated. You can''t enter a
    password here and it work; all you can do is delete the whole password.

    You also have the option of using command-line tools to create user accounts,
    which allow you to create scripts that automate creation of large numbers of users.
    The useradd and mkpasswd commands are quite valuable for this purpose: useradd
    creates a new user with the attributes you specify, and it allows you to maintain
    defaults for all users it creates; mkpasswd generates a random password with a
    number of characters you specify. Check their main pages for more information.


    # Password Parameters


    The set of user account options set the password parameters for the account. These
    include


    +   - The number of days a a new password must be retained before it can be changed

    - The number of days a password can be retained before it must be changed

    - The number of days of advanced warning users get before the account expires

    - The number of days until the account expires

    - A expiration date'
