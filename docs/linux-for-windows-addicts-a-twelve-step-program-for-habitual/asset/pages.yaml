  md: '# Linux for Windows Addicts: A 12-Step Program


    **Querying** You can query your system for its RPM information, which can be useful
    for finding out what a package contains or for finding which package owns a file
    on your system. For example, to learn some basic information about a package you''re
    considering installing on your system, you can use a command like this:


    ```

    rpm -qip webmin-0.78.rpm

    ```


    This tells you the **rpm** command that you''re doing a query for package information,
    and you''re interested in the package file “webmin-0.78.rpm.”

    That''s fine if you have the package file handler. But what you often want to
    know is: What package owns a file? To answer question, you can issue a command
    like this:


    ```

    rpm -qf /etc/sendmail.cf

    ```


    That command tells you the name of the package that owns /etc/sendmail.cf, complete
    with version number information. But often, that information isn''t enough to
    tell you what the package really is. To see some basic information about the package
    that owns a file, use the **-i option**:


    ```

    rpm -qif /etc/sendmail.cf

    ```


    This is one of the more useful query commands, especially when you''re first figuring
    out what''s going on with your Linux system. But sometimes you want a list of
    all the files that came with a package, and you can find that information using
    a command like this:


    ```

    rpm -qlf /etc/sendmail.cf

    ```


    That format finds the package that owns the /etc/sendmail.cf file and then reports
    back a list of all files owned by that package. You could also specify a package
    name instead.

    You can play around with the **rpm -q** options if you''re looking for other information,
    or to find it. But let me show you one more command; this produces lengthy output.
    It produces a list of all configuration files identified by all installed packages
    and formats them with the file permissions, ownership information, and size, as
    the **ls -l**:


    ```

    rpm -qac

    ```


    **Verification** Verifying a package means checking the files installed on your
    system against the contents of the package that installed them. It''s a way of
    seeing what has changed, and in many cases, change is fine. For example, configuration
    files almost always need to change, and you may change file permissions or ownership
    of certain files. But it''s a good thing to be able to identify which things have
    changed and how.'
