  md: '# Chapter 13: Step 10: "Make" More Software


    # 353


    # USING MAKE


    You may not always be fortunate enough to find a package for the software you
    want to install, especially if you''re interested in running the very latest versions
    that are available; such leading-edge software prepackaged for your convenience
    is rarely your convenience. That doesn''t mean you''re left out in the cold, though,
    because “making” programs is not very hard.


    By making programs,” I’m not talking about writing the programs on your own. Whether
    or not you feel comfortable doing that, you can build programs from sources other
    people have written. In fact, another reason to learn about the make command is
    because some software is distributed as source files. In other words, even if
    they''re bundled in a package, the files still need to be built once they''ve
    been installed. If the distributor intended this to be the case, the RPM package
    will have the extension .rpm instead of the usual .src.


    # Source Tarballs


    Most of the software you find on the Web isn''t going to be packaged that way,
    either. Instead, it''s usually wrapped up into a compressed archive file affectionately
    called “tarball.” You can usually identify these creatures by their extensions,
    which are usually one of these:


    +   - .tar

    - tar.gz

    - .gz

    - .tar.Z

    - .tar.bz2


    # Tar Files


    The first extension may be identifiable as the output of the tar command, which
    is short for “tape archive” but often has nothing to do with tapes. Basically,
    the tar command takes several files, with or without a directory structure, and
    encapsulates them into a single file. It''s not unlike how a ZIP file works on
    PCs, or Stuff files on Macs, except that there''s no compression going on in the
    process. To create a tar file, you can issue a command like this:


    ```

    millerm@romans ~ tar cvf loveletters.tar ~/to_karen/letters/*

    ```


    This is a common set of options; they indicate that the tar command should create,
    verbously, a file named loveletters.tar, from all the files and directories found
    under my home directory in the directory to_karen/letters/.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    It''s fine to know that, but it''s not exactly relevant to the task at hand, which
    isn''t putting files into archive; it''s removing them. That is pretty easy, too:


    ```

    karen@romans -> tar xvf loveletters.tar

    ```


    Karen can open the archive using these options, which tell the tar command to
    extract the archive file verbely. Being able to create and open tar files is very
    useful, but it''s not the whole story, as I mentioned, these files aren''t compressed.


    # tgz and gz Files


    The compression part is where the other extensions come in. While Linux systems
    can use the zip and unzip commands to manipulate ZIP files for swapping with PC
    users, the gzip program is more widely used. The .tgz and .tar.gz extensions indicate
    that the file has been archived by tar and compressed using gzip. To create a
    compressed version of the archive, I could use a compressed file I already created:


    ```

    millerm@romans -> gzip loveletters.tar.gz

    ```


    This would produce a file called loveletters.tar.gz, and it might be dramatically
    smaller than the original file, depending on the data. But I don''t have to go
    through two steps to perform this task; I have the tar command call the compression
    utility at the same time:


    ```

    millerm@romans -> tar cvzf loveletters.tgz ~/to_karen/letters/*

    ```


    This would produce a file called loveletters.tgz that is roughly equivalent to
    the .tar.gz file. That''s not always true, but for our purposes, it''s close enough,
    because either way, the compressed file can be opened the same way:


    ```

    karen@romans -> tar xzf loveletters.tgz

    karen@romans -> tar xzf loveletters.tar.gz

    ```


    Either command fully decompresses the archive and extracts its files and directories.


    # Z Files


    A less-favoured option that''s more often found on other Unix platforms is a pair
    of tools known as compress and uncompress. The compression on a “compressed" file
    isn''t as great as the compression on a gzip file, but because some systems don''t
    include the gzip utility, compress may be more useful if you''re sharing files
    with Unix users. The utilities work pretty much as you''d expect; to create an
    archive, you can use a command like this:


    ```

    millerm@romans -> compress loveletters.tar

    ```'
