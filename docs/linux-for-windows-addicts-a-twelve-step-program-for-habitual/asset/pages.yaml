    the following fields:


    +   * The name of the alias.

    * The name of a program, script, or statement to pipe the mail through, if desired.
    This could be used to send the mail to a log file or to the bit bucket.

    * A file that contains a list of the users included in this alias, if desired.
    This is useful if you want to be able to (or want somebody to be able to) edit
    the alias list from a text file.

    * The names of users who should receive mail sent to the alias, if desired.


    # Virtual Domain Aliases


    This option is identical to the preceding User Aliases option, but instead of
    being used in the primary sendmail domain, these aliases are established for the
    virtual domains you have created on your system. See the list of options above
