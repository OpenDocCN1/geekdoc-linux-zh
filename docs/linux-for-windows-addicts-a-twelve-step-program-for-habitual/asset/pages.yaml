  md: '# Chapter 11: Step 8: Establish a Web Server


    # MANAGING CONTENT


    There''s not much to content management on a web server, regardless of the server
    software you are using. But I''d like to highlight a few of the basic tasks involved
    in maintaining a web site. From the placement of text and images, to enabling
    SSI and CGI features, to basic server status monitoring, it may be helpful to
    know the basics of how to manage the server you''ve set up.


    # Storing Text and Images


    The most straightforward way to put text and images on an Apache server is in
    the document root used for the server or its virtual domains. You can create a
    directory to organize this content as you please, though I''m surprised at how
    many people just dump everything into one.


    But you''re not limited to this linear directory tree. Don''t forget, for example,
    that you can create logical links to other files or directories on the server
    or on a remotely mounted filesystem. This allows you to create links, for example,
    to use user directories on a file server or from individual workstations.


    Consider the contents of a document directory:


    ```

    drrwxxr-x  8 root      web  4096 Mar 23 10:09 .

    drwxxr-x  13 root      web  4096 Feb  9 16:03 .

    lrwxrxr-wx  1 millimer users  17 Mar 13 08:50 .albers -> /home/albers/html

    lrwxrxr-wx  1 millimer users  14 Feb 27 14:35 .howto -> /usr/doc/HOWTO

    lrwxrxr-wx  1 millimer users  17 Feb 27 15:10 .jerry -> /home/jerry/HTML

    lrwxrxr-wx  1 millimer users  19 Feb 27 14:35 .mini -> /usr/doc/HOWTO/mini

    drwx-xr--  2 root      root  4096 Jan 13 19:54 css

    -xr-xr--x  1 millimer users   973 Jan 22 10:47 customers.shtml

    -xr-xr--x  1 millimer users  4134 Mar 13 08:50 employees.shtml

    -xr-xr--x  1 millimer users  2123 Feb 29 10:18 index.shtml

    -xr-xr--x  1 millimer users  6469 Mar 17 14:29 is.shtml

    drwx-xr-  7 root      root  4096 Aug 16 1999 manual

    drwx-xr-x  3 root      root  4096 Feb 19 13:32 mrtgt

    drwx-xr-x  3 millimer users  4096 Feb  4 10:16 prolificinc.com

    ```


    Note that there are "dot" files as links to other directories. These don''t have
    to be done; I think its better to make them so. If the Follow Symlinks option
    was enabled for this server or this directory in Linux, those links allow quick
    and easy access to directories and systems outside the current tree. For example,
    the /home/albers/html directory could be NFS mounted from another system, but
    there''s no need to include convoluted references in the HTML pages themselves;
    instead, refer to .albers directory, and the server will be able to get them to.'
  merge: -1
  pgno: 340
