  md: "# Chapter 6: Step 3: Compile a Kernel\n\nSo I recommend that you do not enable\
    \ this key. If you're really curious, though, I suggest that you read the linux/Documentation/sysrq.txt\
    \ and decide for yourself whether to activate the magic key.\n\n# ## MANAGING\
    \ MULTIPLE KERNELS\n\nThe ability to make customized kernels may lead you to wonder\
    \ whether you can configure multiple kernels and make use of different ones at\
    \ different times. Luckily, the answer is yes. In many cases, creating a single\
    \ kernel and loading additional modules when you need them is perfectly adequate.\
    \ For example, if you have a laptop and want different devices depending on whether\
    \ you're on the road or in your office docking station, you can build the network\
    \ and parallel port support as modules and load them only when you're docked and\
    \ have a network card and printer.\n\nHowever, there are circumstances where multiple\
    \ kernels are a better option. Naturally, if you're going to be testing multiple\
    \ kernel builds, it's a good idea to be able to track out the changes you're making,\
    \ and having access to multiple kernels is a good way of doing this. When certain\
    \ distributions install them onto a multiprocessing system, they provide access\
    \ to two kernels; for normal SMP activities, and one for uniprocessor mode for\
    \ troubleshooting.\n\nSo how do you use of multiple kernels on a system? You instruct\
    \ your boot loader to point to different kernel files and give yourself an opportunity\
    \ to select one. The sample /etc/lilof.conf below configures the boot loader to\
    \ prompt the user to enter one of two kernels: The standard kernel, stored in\
    \ /boot/vmlinux; or the test kernel, stored in /home/millern/bzImage.\n\n```\n\
    boot = /dev/sda      # boot from the master boot record\n                    \
    \ # of the first SCSI drive\nprompt # prompt for the correct kernel at boot\n\
    delay = 15          # 15-second delay\nlinear             # It's a big SCSI drive\n\
    \nimage = /boot/vmlinux # the primary bzImage file\nroot = /dev/sda     # the\
    \ root partition\nlabel = Linux       # the name used to select this kernel\n\
    read-only          # mount root read-only initially\n```\n\n```\nimage = /home/millern/bzImage\
    \ # a second bzImage file\nlabel = TestKernel  # the name used to select this\
    \ kernel\nroot = /dev/sda      # the root partition\nread-only           # mount\
    \ root read-only initially\n```\n\nSome of the options shown in this example need\
    \ to be changed on your system; the drive names and partition numbers, for example,\
    \ need to correspond to your configuration."
