    receive and accept an outrageously better offer.) The login name is simply the
    account name; in the example shown in 8-1, the login name is “karen”. The full
    name is used for human identification purposes; when people have similar or cryptic
    account names, it''s very useful to have real names associated with them.


    The optional information includes the account''s primary group membership (in
    the example, this is the sickeningly mushy “sweetie-pies”) and any additional
    groups in which the account shares membership. I will discuss groups in “Managing
    Group Accounts” later in this chapter.


