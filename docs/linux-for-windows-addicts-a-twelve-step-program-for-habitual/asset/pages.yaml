  md: '# Linux for Windows Addicts: A 12-Step Program


    | drwx-xr-xr-x | 2 millerm users | 1024 Mar 29 | 1999 mword |

    | -rwxr-xr-- | 1 millerm users | 2829 Mar 16 | 1999 spam.zip |

    | -rwxr-xr-- | 1 millerm users | 51200 Mar 16 | 1999 survey.tar |

    | drwx-xr-xr-x | 3 millerm users | 1024 Jul 17 | 10:53 webmin |

    | drwx-xr-xr-x | 3 millerm users | 1024 Aug 26 | 1998 xll1 |


    As you can see, there are 10 attributes for each item in the directory. The first
    attribute indicates whether the item is a directory or not. If the first character
    in the attribute is a "d," it''s a directory. If the first character is "-", the
    item isn''t a directory. That''s pretty straightforward, right? That''s one down
    nine to go.


    The next three characters indicate what the owner is allowed to do with the item.
    For example, the item in the directory listing is a file named "README" (we can
    tell it''s a file because there''s no "d" in the first position).


    As we can tell from whose username is located, "millerm" owns this file. The second,
    third, and fourth characters indicate whether the owner user can read ("r"), write
    ("w"), and execute ("x") the file. Notice that the README can only read and write
    the file; because it''s not executable, he can''t "run" this file.


    As we can tell from its团体, "users" has access to the file. The next set of three
    permission characters indicate what members of the "users" group can do with this
    file. The permissions for README restrict the members of the group reading the
    file, because only the "read" attribute is set.


    The final set of three characters indicates what kind of access is allowed to
    the rest of the world. In the case of the README file, it''s the same as the access
    allowed to the "users" group: read only; write; no execute.


    Together, these attributes allow a rich set of privileges to be maintained, with
    file owners, groups of users, and the rest of the world receiving different access
    based on the type of file. In the Linux world, this comes into play when you''re
    attempting to install new software. When the software needs to be outside your
    home directory (in which, by default, you enjoy full access privileges), you will
    be instructed to perform part of the installation as root. This is because ordinary
    users don''t have the right to add or change files in most of the Linux directories.
    That''s good, because it keeps people from accidentally deleting or changing vital
