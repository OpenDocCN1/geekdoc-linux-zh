  md: '# Introduction


    # HOW THIS BOOK IS ORGANIZED


    This book is divided into two parts. The first part is a set of essays on computing,
    which is a nice way of describing what Dennis Miller call a “rant.” There’s quite
    a lot of confusion out there, so Part I attempts to explain what Linux is, give
    some background on the conflict between Microsoft and the Cloud, and discuss some
    differences in terminology and perspective between the Linux and Microsoft operating
    systems.


    The second part of the book focuses on specific steps you can install, configure,
    and use Linux systems in conjunction with or instead of Microsoft systems. There
    are 12 of these steps, and each one is given a chapter of its own:


    +   * Step 1: Install Linux

    * Step 2: Configure X

    * Step 3: Compile a Kernel

    * Step 4: Connect to a Network

    * Step 5: Manage Users and Groups

    * Step 6: Mingle with Microsoft, Network with Novell

    * Step 7: Enable Printing

    * Step 8: Establish a Web Server

    * Step 9: Manipulate Email

    * Step 10: “Make” More Software

    * Step 11: Share and Schedule

    * Step 12: Free Your Office


    # GETTING MORE INFORMATION


    If you''re looking for more information about using Linux or for answers to particular
    questions that aren''t answered in this book, there''s help available. In addition
    to references to documentation and web sites found in context, there is an appendix
    containing web addresses for a variety of Linux-related resources I''ve found
    useful.


    But because everything in the computing world is dynamic, and because Linux in
    particular is being enhanced at a rapid pace, more information is available at
    a central location on the Web. Check http://www.msaddicts.com for the latest lists,
    news, updates, and experiences. And if you still don''t find what you''re looking
    for, drop me a line at mjm@msaddicts.com.'
