    The Quota Support option allows you to set restrictions on ext2 filesystem disk
    usage for each account on the system. While disk quotas weren''t built into Windows
    until the release of Windows 2000, if you administered other network operating
    systems, such as NetWare, you may be familiar with quota management. The basic
    idea is that by specifying a maximum of disk space that a user can consume, you
    can prevent a small number of users from filling a shared partition with data,
    leaving no space for anything or anyone else.


    Having worked in Information departments for years, I consider this essential
    functionality for a network server, unless you''re the only user on the system,
    I suggest that you enable this option and read the quote mini-HOWTO.


    If you''re going to be running on a distributed network with other Unix or Linux
    systems, enable the Kernel Automounter Version 4 Support option, which automatically
    mounts partitions (which can be on local drives, but this is generally most useful
    for network drives) as they''re needed. This behavior is fairly transparent in
    Windows, and if you don''t enable it, you''ll feel a little pissed when you have
    to manually mount remote devices periodically. The Linux version of the automount
    concept unmounts the devices after the timeout you specify.


    Adding support to the kernel isn''t enough by itself; you''ll have to start the
    automount daemon and indicate the partitions that you want automatically mounted.
    For more information, read the automount mini-HOWTO document.


    If you''re going to run a dual-boot system or have left a DOS or Windows 9x partition
    on your Linux system, you''ll definitely want to enable the DOS fat fs Support
    option.'
