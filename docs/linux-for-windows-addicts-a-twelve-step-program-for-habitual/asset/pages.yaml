    # Getting into Linux from Windows


    If you are able to place Core Linux on its own partition, it will automatically
    overwrite the hard disk''s master boot record (MBR) and give you the option of
    starting Windows or Linux when you start up. But if you installed Linux on a Windows
    partition, this doesn''t happen. So do you start Linux? There are three ways to
    do it.


    # Starting in DOS Mode


    This option tells Windows 9x you want to run in DOS compatibility mode and then
    starts Linux from that mode:


    +   1. To start in DOS mode, simply press F8 while Windows is starting. This should
    bring up the Windows startup options. One of them is DOS Safe Mode—select it.


    +   2. Doing so takes you to a DOS prompt; you''ll need to change directories
    to the CDL directory, and run STARTCDL.BAT from there:


    ```

    C:\> cd cdl

    CCDL> startcdl.bat

    ```


    This will launch Linux.


    # Creating Startup Boot Options


    Another way of doing things is somewhat elegant: you edit your CONFIG.SYS and
    AUTOEXEC.BAT files in Windows to provide startup options for Windows or Linux.
    Follow these steps:


    +   1. From your Windows desktop, click the Start button, select Run, and enter
    sysedit.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '2. The sysedit program allows you to edit your startup files, including CONFIG.SYS
    and AUTOEXEC.BAT. Select CONFIG.SYS first. It may be empty, or it may have entries
    in it already. If there are entries, add the following lines before them:


    ```

    SWITCHES=/F


    [MENU]

    menuitem=WIN, Windows

    menuitem=LINUX, Corel Linux

    udedefault=LINUX, 5

    ```


    [WIN]

    This establishes a startup menu, defaulting to run Linux after providing a choice
    for five seconds. If you wish to change the default startup option to Windows,
    change the mudefault line by removing LINUX and adding WIN. If you wish to change
    the decision time, simply change 5 to the number of seconds you want to wait before
    booting the default option.


    3. If there were already entries in your CONFIG.SYS file, add the following line
    after them. (If there weren''t existing entries, just add this after the lines
    you inserted in Step 2.)


    ```

    [LINUX]

    ```


    4. Select File | Save to save the new CONFIG.SYS contents, and then select the
    AUTOEXEC.BAT file.


    5. Enter the following lines before any entries that already appeared in the AUTOEXEC.BAT
    file:


    ```

    @ECHO OFF

    GOTO %CONFIG%

    :WIN

    ```


    6. Any existing entries would follow the :WIN tag. After them (or immediately
    after WIN, if there are no existing entries) enter these lines:


    ```

    GOTO END


    :LINUX

    C:

    CD CDL

    STARTCDL.BAT

    GOTO END

    ```


    ```

    :END

    ```'
