    It is usually found in a di-


    > Behind the Scenes

    All three of these tools, and others like them, modify a configuration file known
    as XF86Config. This file is most often found in /etc/X11 or /usr/X11R6/lib/X11
    (and sometimes there is a link from one location to the other). This file contains
    the information XFree86 uses to respond to your keyboard and mouse and to tell
    your graphics subsystem what to do. It''s a text file, so you can browse it using
    a “pager” (a program used to read a page of text at a time),

    root@romans /root> less /etc/X11/XF86Config


    If you''re interested in tweaking your configuration, this file is the place to
    do it. Documentation for XFree86 is normally found in /usr/X11R6/lib/X11/doc,
    and there are some Linux-HOWTO documents available on the subject as well (see
    Appendix A for more information on the HOWTO documents and where to find them).'
