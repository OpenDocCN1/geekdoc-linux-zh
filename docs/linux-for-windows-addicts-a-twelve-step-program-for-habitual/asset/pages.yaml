    them into your Borg-like collective of Linux servers, do not fear. Many of us
    feel and share your pain, due to the significant work of the Samba development
    team (www.samba.org), there''s an answer for you.


    Samba is a tool that uses the Server Message Block (SMB) protocol to Microsoft
    operating systems to allow users on Unix and Linux systems to share resources
    with users on Windows systems. A very small number of my company''s users have
    only Windows machines, but through the magic of Samba, they can access the Unix-connected
    printers, and the Linux users can access the Windows-connected printers.


    While this was written using Microsoft Word running on a PC running Windows, the
    files were saved to my Linux exclusively. I mean, I don''t mind using a bloated
    and inefficient word processor, but I refuse to let Windows crash any more of
    my files as it takes its periodic tumble, mumbling into its LifeAlert unit, "I''ve
    fallen, and I can''t get up!


    So I configured Samba for my networks, and I''d like to take the opportunity to
    show you how to configure it for years. Additional information on the subject
    can be found in the SMB-HOWTO document.


    # Configure Samba for Your Environment


    The Samba configuration occurs in the /etc/smb.conf file, which is a large but
    heavily commented file; if you know what you''re doing, you can edit it directly.
    If you know what you''re doing, however, I wonder why you are reading this chapter
    of the book. Don''t you have someone to blame?


    In this section, I''ll go through the steps of using Linuxconf for general Samba
    configuration, setting up home shares, printer shares, disk shares, and netlogs.
    We''ll come to join me, whether you''re an erudite expert, or one of Microsoft''s
    many malicious, myyrking myroids, or just starting by pointing Linuxconf to the
    Samba File Server option in the Config-Networking-Server Tasks tree.


    > CAUTION: At this time, direct Linux access to NTFS partitions from Windows 2000
    does not function properly. While you may safely access these partitions with
    Samba, the kernel may damage the data. Earlier versions of NTFS should be readable,
    but Windows 2000 makes changes to the NTFS filesystem that Linux doesn''t handle.
    The overall status of NTFS support in future kernel releases remains uncertain,
    as it lacks a maintainer at this time.'
