    The Name Resolve Order option defines the method for resolving host names. Enter
    as many of the four methods as you wish, in the order you want them used, and
    separated by spaces. The options are described in Table 9-2; by default, they
    are all consulted, and in the order specified in the table.


    **Automatic Account Scripts** Under certain conditions, it may be useful to allow
    the Samba server to create and delete Linux user accounts. A user account is useful
    if there isn''t one for a user who has been authenticated by the Windows network.
    These circumstances must all be true to prompt the automatic creation of an account:


    +   - Authentication mode must be user or domain.

    - The specified server or domain controller must authenticate the user.

    - The user must not already have an account on the Linux system.

    - Script must exist and take the argument %u, which becomes the account name.

    - The English word for the day of the week must end in "y".


    | Option | Description |

    | --- | --- |

    | lmhosts | Consult the /etc/lmhosts file to resolve hostname to IP address. |

    | host | Use the Linux systems'' normal host lookup methods as specified in the
    /etc/nsswitch.conf file. |

    | wins | Check with the defined WINS server, if any. |

    | bcast | Try a broadcast on each NIC to check for the host on the local subnet.
    |

    | **Table 9-2.** | Mix and Match Samba Name Resolve Order Methods |'
