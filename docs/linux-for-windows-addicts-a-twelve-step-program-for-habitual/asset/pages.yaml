    # Internal Net


    This tab gives you the opportunity to configure the host-specific internal network
    number and the primary network node number. For systems that aren''t doing any
    IPX routing, which could be most of them (what earth are you routing IPX with
    a Linux system, for heaven''s sake?), you won''t need to configure these entries.


    When you configure these options, the changes are reflected in the /etc/sysconfig/network
    file, which has two entries related to the internal network configuration options:


    ```

    IPXINTERNALNUM="195948557"

    IPXINTERNALNODENUM="0"

    ```


    > Note that in the first line, the IPX internal network number has been converted
    to binary format from the hexadecimal format in which it was entered (and in which
    it''s commonly displayed on NetWare systems).


    # DIALUP NETWORKING


    If your Linux system will be a dialup connection, you have three types to choose
    from. Newer versions of Linuxconf (including the one that ships with Red Hat 7)
    allow you to configure any of these three types in exactly the same way you configured
    the network card. So, for example, if you configured your Ethernet card as Adapter
    1, you can add your PPP connection as Adapter 2.


    Older versions of Linuxconf have a PPP/SLIP/PLIP option on the Config-Network-Client
    Tasks tab, you''ll see the currently configured connections and can edit them,
    remove them, or add additional definitions. Clicking on an existing definition
    will bring up its configuration details; you can view or change these details
    or delete the definition altogether from this.


    If you click the Add button to create a new dialup networking connection, you''re
    given a choice of the three types available: Point-to-Point Protocol (PPP); Serial
    Line IP (SLIP); or Parallel Line IP (PLIP). Most everyone these days has access
    to and uses PPP, but we''ll briefly look at SLIP and PLIP as well, just in case
    you''re one of the unfortunate ones.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    # PPP


    When you select a PPP interface, you''ll see a configuration page like the one
    shown in Figure 7-5. Enter the phone number you dial to establish a PPP connection
    to COM1, connection, and make sure to set the modem port properly (/dev/ttyS0
    equates to COM1, /dev/ttyS1 equates to COM2, etc.) If your PPP connection supports
    PAP authentication, check the box. Then enter the login name and password you
    wish to use to establish contact. You can click Accept to use the default PPP
    configuration, or click Customize to further tweak the settings.

    If you do opt to customize the PPP connection settings, you''ll given four tabs
    to choose from: Hardware; Communication; Networking; and PAP. These settings you
    should already know about, including speed, modem initialization and dial values,
    and IP addresses for the local and remote hosts. The changes made on these pages
    are included in the file /etc/sysconfig/network-scripts/ifcfg-ppp0 (for the first
    PPP connection, the second would be in the same directory as ifcfg-ppp1).

    Sample contents of this file are shown as follows:


    ```

    DEVICE="ppp0"

    ONBOOT="no"

    USERLTL="no"

    MODEMPORT="/dev/ttyS0"

    LINESPEED="115200"

    PERSIST="yes"

    DEFABORT="yes"

    DEBUG="yes"

    INITSTRING="ATZ"

    DEFROUTE="yes"

    HARDFLOWCTL="yes"

    ESESCAPECHARS="no"

    PPPOPTIONS="*"

    PAPNAME="rootabega"

    REMIP="10.4.0.4"

    NETMASK="*"

    IPADDR="10.0.2.2"

    MRU="1444"

    MTU="1444"

    DISCONNECTTIMEOUT="831"

    RETRYTIMEOUT="5"

    BOOTPROTO="none"

    ```


    The modem dial-out string, including the phone number, can be found in /etc/sysconfig/network-scripts/chat-ppp0.
    And the PAP password, if configured, is stored in /etc/ppp/pap-secrets. None of
    these files can be read by non-root users, so they''re relatively secure.'
