  md: '# Chapter 11: Step 8: Establish a Web Server


    Directory Path This is just the path to the directory for which you want to override
    the default options. Specify this as an absolute address, starting with the root
    directory of the web server. For example, you might enter something like:


    /home/http/html/hissingweasels


    This addition will be made to the /etc/httpd/conf/httpd.conf file in the form
    of a Directory section. Each directory you add using the Sub-Directory Spec option
    will get its special order in the configuration file, and will be denoted with
    tags like these:


    ```

    <Directory /home/httpd/html/hissingweasels

    </Directory>

    ```


    Between those two lines will be the options you specify on the rest of this configuration
    page, starting with the Features section.


    Features This list of features should be familiar; it''s the same as the list
    shown previously in Table 11-1. If you want to allow or disallow a set of features
    in particular subdirectories on the server, here''s your opportunity. Each option
    you select in this section goes into an Options between directory''s start and
    end tags.


    Override Policies This tells the server which options can be overridden in the
    current directory based on the contents of a .htaccess file. These files are configuration
    ("dot") files nestled in the config tree of your web server. They allow you to
    set access to a directory without having to restart the web server.


    If you plan to use .htaccess files in the directory you''re configuring, you can
    indicate the servicewide policies that each can override. These options are listed
    on a single line in the appropriate directory sections. If you selected all the
    options Linuxconf provides, you create a line like this:


    AllowOverride AuthConfig FileIndexes Limit Options


    SSL Options Secure Socket Layer (SSL) configuration is a complex process, and
    while Linuxconf enter some of the useful parameters, it does little to explain
    how or why to use them. If you know what you''re doing, though, you can configure
    SSL for the current directory using the fields in this section.


    The Cipher Suite field is where you enter the SSLCipher string that specifies
    how the client connection is negotiated. The field populates the SSLRequire directive,
    which sets the rules for who gets access. The Options field fills the SSLOptions
    directive to enable runtime options. The Verify Depth field fills the SSLVerify
    depth, which indicates how far the certificate can be without being invalidated.
    Set the SSL Require SSL box to enable the SSLRequireSSL flag. And finally, set
    the SSLVerifyClient level using the pull-down list next to the Verify Client field.'
