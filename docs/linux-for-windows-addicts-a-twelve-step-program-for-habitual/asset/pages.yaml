    # LILO CONFIGURATION FROM LINUXCONF


    In the remaining chapters of this book, I''ll demonstrate different types of system
    configuration and management tasks. Many of these tasks can be automated on Red
    Hat and derivative systems using a tool called "linuxconf." While the tool provides
    a graphical front end to the text-based utilities and files you would otherwise
    have have to manipulate manually, it provides a framework from which an experienced
    Windows system administrator can often work more comfortably than at the command
    line.


    And although I''ve described the contents of the /etc/lilo.conf, the truth is
    that you may not have to manually edit the file at if linuxconf is available to
    you. So in this section, I''d explain how to run linuxconf, and how to use it
    to configure LILO.


    # Running linuxconf


    Because linuxconf is a system configuration utility, you''ll need to run it as
    root. That means you should log on as root or use the su command to become root.
    (Don''t forget to use the exit command to become a regular user when you''re done.)


    Run linuxconf from a console prompt or in an xterm using this command:


    ```

    root@romans /> /bin/linuxconf

    ```


    If you''re at a console, a full-screen, text-mode interface will appear. If you
    are in X Windows, a graphical interface will appear. A panel on the left-hand
    side shows a tree of configuration options, and the detail window on the right
    side shows the settings available for the selected option. In Figure 6-5, the
    LILO tree has been expanded in the left-hand panel, and the LILO defaults option
    has been selected.'
