    # USING LINKS


    Links files are like Windows shortcuts, but they''re more closely associated with
    their targets shortcuts. When you use links under Linux, unless you do an -l and
    notice that the first file permission is an "l", you won''t know that you''re
    not directly manipulating the file. This makes excellent tools to have in your
    belt, because they can be used for everything for simplifying upgrades to sharing
    files across a network.


    # Symbolic Links


    The most common type of link is known as a symbolic link. These links aren''t
    quite intimately hooked to the target as hard links, which I''ll describe momentarily.
    Let me put it this way: These are the links you''ll be using.


    You create a symbolic link using the ln command, as shown here:


    ```

    millerm@romans ~ ln -s ~albers/wassup.avi wu

    ```


    That command creates a link in my home directory, called wu.avi, which points
    to a file in another user''s home directory. Notice that I give the link a different
    name than the original filename; this is fine, and it can be quite useful.


    For example, sometimes it can be useful to create links to files in the same directory.
    This is what happens in the /usr/src/ directory if you want to keep multiple versions
    of the kernel source files; the "linux" directory is often just a link to the
    version you''re currently building.


    Another example of the use of links to deal with versioning can be seen in the
    /usr/lib/ directory. If you do an -l, you''ll find that there are dozens of links
    pointing from generic libraries to a specific version of library. If a new version
    comes along, it can be plugged into the correct directory and linked (but please
    don''t do this yourself if you''re not familiar with Linux directories).


    Symbolic links are also useful for sharing. You can create a shared directory
    on a server, NFS mount it on client stations, and place a link in each user''s
    directory to the shared directory. As far as the user knows, the files are local
    to their system. In fact, some cases it is possible to move a file or a whole
    directory, create a link to make it look like it''s where it always has, and never
    let the user know anything different. That''s extremely useful.


    One last use for symbolic links is for saving disk space. If you''ve got files
    that would ordinarily have to be duplicated in many different places on a system,
    you''ve got the option of just placing a single file and creating links to that
    location.'
