  md: '# Activating Changes from linuxconf


    Be sure that on each window in which you made changes that you click the Accept
    button. Once you''ve done that, click the Act/Changes button in the bottom left
    corner of the linuxconf window. This will bring up a System Status tab that will
    ask you if you want to preview the changes to be made or just activate them (you
    can also quit without making the changes by clicking the Quit button in the lower
    left-hand corner). It can be instructive to see what changes linuxconf has made,
    so if you''re interested in learning more about how Linux works, have a look at
    that.


    When you''ve seen all you want, click the Activate The Changes button to start
    the system updates required to implement the changes you''ve requested. In some
    cases you will be prompted to confirm actions linuxconf is taking; others will
    run without further ado.


    Once the kernel update has taken place, you can restart the system to take advantage
    of the new features you''ve added or of the space you saved by eliminating features
    you weren''t using. And since we''ve started looking at linuxconf, let''s continue
    by using it to configure Linux to run on a network. We''ll do that in Chapter
    7, coming up next.'
