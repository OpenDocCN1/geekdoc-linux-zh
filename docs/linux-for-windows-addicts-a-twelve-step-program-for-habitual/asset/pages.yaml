    monitors not listed. In this case, there are two options. The better approach
    is to dig up your monitor''s manual and find the horizontal and vertical sync
    ranges. This is standard information included in every monitor manual (and if
    you''re lucky, it may be printed on the back of the monitor). Enter the horizontal
    and vertical sync rates in their respective boxes, and type a monitor name to
