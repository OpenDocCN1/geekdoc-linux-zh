  md: '# Linux for Windows Addicts: A 12-Step Program


    ![](img/dcd0086266143e7048be2fb5e68a2391_339_0.png)


    The virtual configuration screen is similar to the default configuration screen,
    with the addition of two extra fields. The Virtual Host Name is the name or IP
    address of this virtual host (duhl!), which should be registered as a valid domain
    name in DNS or in all your users'' host files or NIS domains. The other additional
    field is the Server Aliases field, which gives you the chance to enter aliases
    for your virtual domain, which should also be registered in DNS.


    The other entries are identical to those you set for the main web server domain.
    You can also tweak the SSL settings for the virtual domain on this page. The changes
    you make will be added to a virtual server definition in the /etc/http/conf/httpd.conf
    file, which will contain entries like the ones shown here:


    ```

    <VirtualHost 10.0.1.230

    ServerName www.foo.com

    ServerAlias www.foo.net www.foo.org

    </VirtualHost>

