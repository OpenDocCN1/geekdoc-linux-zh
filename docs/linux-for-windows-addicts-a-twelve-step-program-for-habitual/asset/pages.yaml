  md: '# MANAGING SPECIAL FUNCTION ACCOUNTS


    The special function accounts are those used by users on PPP, SLIP, UUCP, and
    POP connections. If your system is acting as a server for one or more of these
    services, you can use Linuxconf to configure user access to each one.


    # PPP Accounts


    If your Linux system is acting as a server for PPP clients, you can use the PPP
    Accounts option in Linuxconf to manage the PPP accounts separately from the rest
    of the user accounts. The same pieces of information are needed for PPP account
    information as for standard account creation. While configuration and troubleshooting
    of a PPP system falls outside this book''s scope, there is plenty of information
    to help you if you''re interested. I suggest you start with the PPP-HOWTO document
    and the Linux Administrator''s Guide.


    # Base Information


    As seen in Figure 8-2 illustrates, there are few differences between the interface
    for entering the basic user account whether creating local user accounts or PPP
    accounts.

    As you might expect, there are fields for entering the login name, full name,
    home directory, and user ID. All these pieces of information will be stored in
    the /etc/passwd file, as any other user account. The differences can also be seen
    in Figure 8-2, however. Notice that the primary group name is set to puppers,
    and the command interpreter (the shell) is set to /usr/lib/linuxconf/lib/pppplogin.
    This script controls what happens when a PPP account is used.


    # Password Parameters


    The password parameters for a Linuxconf-based PPP account are identical to the
    ones available for standard user accounts. Like other user accounts, the PPP account
    password settings are stored in /etc/conf.linuxconf.


    # Mail Settings


    You probably won''t be surprised to find that the mail settings for a PPP account
    are the same as those for the normal user accounts described earlier in this chapter.
    The information you enter here will be stored in the .forward file in the user''s
    directory and in /etc/aliases file.


    # SLIP Accounts


    If you are hosting SLIP accounts on the Linux system, you can use Linuxconf to
    configure the SLIP accounts. These accounts differ very little from the normal
    user accounts, but like the PPP accounts, they have their own primary group name
    and command interpreter lines.'
  merge: -1
