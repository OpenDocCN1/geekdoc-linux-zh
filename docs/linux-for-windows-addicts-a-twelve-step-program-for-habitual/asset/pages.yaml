    Unlike the User List field, which checks the password being provided for a match
    with any password corresponding to any user in the list, a "valid user" must give
    the password that matches their username.


    There''s also the Invalid Users, who are not allowed to login to the service at
    all. It''s not bad idea to allow the defunct user accounts to a group (like the
    name "deadpile"), and then sticking that groupname, preceded by a "+" to specify
    that it''s a Linux groupname, or an "@" to look for an NIS group first, and then
    for a matching Linux group. If a name appears in both the valid and invalid lists,
    the tie goes to being invalid, because Samba is such validating software.


    Setting Max. Connections to a value greater than 0 (the default) allows you to
    limit the number of active simultaneous connections. Users who attempt to connect
    to the service after the maximum limit has reached will be denied. Samba uses
    lock files (stored) in /tmp/samba to keep track of these files.


    Populate the Read Only User List with the names (or groups of names), preceded
    by an "@" or "+" symbol of users who should not write access to the home directory,
    even if the Writable option is set.


    Home Share Scripts Sometimes it''s useful to execute a script whenever a user
