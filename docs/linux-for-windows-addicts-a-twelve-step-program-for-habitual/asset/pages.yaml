    ". entry is a shortcut that refers to the directory I''m currently working in,
    and the ".." refers to its parent directory. The "secret" file was present all
    along, but it''s shielded view unless a person is looking for "dot" files. This
    is a way of tucking configuration files away so they don''t clutter your home
    directory. Making something a "dot" file doesn''t provide any real security, so
    it''s purely a tidiness device. The same trick can be used to hide directory names.


