  md: '# Chapter 9: Step 6: Mingle with Microsoft, Network with Novell


    # Configuring Users'' Home Shares


    This set of options is used to configure sharing of home directories (which can
    be handled separately from other disk shares). You can tailor this feature to
    meet your particular needs by setting access from hosts, enabling and disabling
    individual users, and configuring scripts.


    You have two initial configuration steps to take, though. First, a useful description
    of the home shares in the Comment/Description field. People don''t always see
    these descriptions in real life, but they''re still nice to have. The %h to include
    the Samba server hostname can be useful.


    The second thing to do is decide how much you want to enable and advertise the
    share. Most of the time, if you''re creating a share, you''ll want to enable it
    by selecting the This Share Is Enabled option. But sometimes you might want to
    take a share offline, and you can do that by deselecting this option. You can
    also make the share visible to users browsing the network by enabling the Browsable
    option. In some cases, disabling this provides a small amount of added security
    by making the share less of an enticing users to go where they''re not supposed
    to go.


    Home Share Access The Public Access option enables password-free access, opening
    the home shares by perusal by anybody who can browse the SMB network. Of course,
    their access level is defined by the Guest Account setting in the Other Options
    feature.


    The next option is Writable, which if enabled allows users to create files and
    directories in the home directories, subject to their effective permissions. There''s
    nothing wrong with making home directories writable (that''s usually what they''re
    for), but I''d be careful configuring public access via a guest account if you
    enable writing to the directories.


    The Allow Hosts and Deny Hosts settings configure Samba to accept or reject the
    hosts or networks you specify in the same way the same entries worked in the "Setting
    Defaults" process described earlier. Adding entries here allows you to create
    exceptions to or exclusions from the default users you already laid down.


    Home Share Users The first user-related option allows you to specify a list of
    users who might access the system. This sounds more useful than it is, I''m afraid.
    This isn''t really an effective method for restricting access to the system; instead,
    it serves as a guest list to the Samba server to help identify user names that
    might be associated with the password that has been given. This doesn''t seem
    to be necessary if you''re using recent Microsoft operating systems, but older
    ones may not pass the user name Samba is expecting.


    If you desperately want to make the user list security method, the Only User May
    Connect Feature, which restricts access to the users specified in the list (you
    may specify users by listing an NIS or Linux group they''re part of; just append
    the @ symbol to the beginning of the group name and add it to the list).


    The Write List option overrides the Writable setting above; by listing a user
    or group in this field, you allow the user (or all group members) write access
    to the home shares.'
