  md: '# Linux for Windows Addicts: A 12-Step Program


    In the previous chapters, we looked at differences between Linux and Windows by
    focusing on how they are developed and distributed. In this chapter, we begin
    addressing the nitty-gritty details that distinguish the two operating systems.


    If you''re used to using Windows products, especially if you didn''t use DOS very
    much, some of the underlying concepts behind Linux may be confusing. Perseverance
    will pay off, though, because many of the conceptual and implementation differences
    from Windows give Linux its power.


    # STRANGE CONCEPTS


    Unix and its imitators, including Linux, use some concepts that are foreign to
    most Windows and Macintosh users. As I mentioned in Chapter 1, if some of these
    ideas seem weird and incomprehensible now, they''ll seem straightforward later,
    when you''re more familiar with them.


    # Kernel


    I''ve mentioned the kernel before, but this is a good time to mention it again,
    because it''s talked about frequently in the Linux world, and it''s not something
    Windows users think about. The kernel is the part of the operating system that
    handles the most basic functions and controls interactions with the computer hardware.
    A kernel is just a program to allow you to control your computer without knowing
    every detail about its inner workings.


    The kernel is modular—that is, when the kernel program is created (and we''ll
    do that in Chapter 6), it can be created and customized to include some features
    and to exclude others. For example, if you don''t have a SCSI interface in your
    computer, you don''t have to include the SCSI modules in the kernel. By excluding
    unnecessary components, you can create a smaller, more efficient kernel, which
    will use fewer resources and improve performance.


    # Shells


    If the kernel is the low-level program insulating you from the details of the
    computer hardware, the shell provides another layer of insulation. The shell provides
    the text-based user interface; it is the program that tries to figure out what
    you mean when you type something on the command line. For a new user, selecting
    a shell seems arbitrary, as many features are the same between the various shells.


    What do you do with a shell? For starters, all the commands you''ll read about
    in this chapter are typed into the shell. The shell looks something like a DOS
    prompt (select the MS-DOS Prompt or Command Prompt on your Windows system if you''ve
    forgotten), but it''s far more powerful than the DOS prompt. For example, most
    shells allow you to type part of a filename or command and then press the TAB
    key to automatically finish the'
