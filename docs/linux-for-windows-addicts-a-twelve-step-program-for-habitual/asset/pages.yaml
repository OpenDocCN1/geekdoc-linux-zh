    # # IrDA Subsystem


    If you''re building a Linux kernel for a system with an infrared port (most often,
    a laptop computer) and wish to use Infrared Data Associations (IrDA) communications
    using Linux, you must select this option. If you do, you''ll have several protocol
    options to choose from.


    The IrLAN protocol allows you to connect systems via an infrared Ethernet. The
    IrCOMM protocol allows you to emulate a serial port over an infrared link. The
    IrLPT protocol allows you to set up the Linux box to print to a printer with an
    infrared port, but in server mode, it also allows you to use the Linux box as
    an infrared print server, giving access to a locally-connected printer to other
    infrared-equipped systems.


    For further details on what''s involved in using infrared connections on Linux
    systems, consult the IR-HOWTO document. An extremely brief document is available
    in the kernel in linux/Documentation/networking/irda.txt. http://irda.sourceforge.net.
    In most cases, people don''t bother with infrared communications and should select
    this option as shown below.


    | Setting Name | Recommended | Safest If Undecided |

    |---|---|--|

    | IrDA Subsystem Support | N | M |


    If you enable the IrDA subsystem support, you should also enable the corresponding
    Infrared-Port Device Drivers. If you have enabled IrDA, you should enable the
    following-options as well:


    +   - IrTY IrDA Device Driver

    - IrPORT IrDA Device Driver


    The remaining options enable support for specific IrDA chipsets and serial port
    dongles. Enable the appropriate one(s).


    # # ISDN Subsystem


    If you use an ISDN card in a system for which you''re configuring a Linux kernel,
    you can enable this option to turn on ISDN support. This doesn''t apply to ISDN
    modems and other devices that connect using another type of port, but internal
    ISDN devices may be supported. Most of the options in this section are device-specific
    drivers, so if you choose to enable this feature, you should choose the appropriate
    device support options. The driver for the widely-used Siemens chipset is known
    as HiSax and works with quite a few ISDN devices.'
