  md: '# Linux for Windows Addicts: A 12-Step Program


    You have progressed far, seeker for Linux knowledge. And your next task is one
    that all recovering Microsoft users must face: Now that your system is in operation,
    how do you set it up for user access? There are several ways of managing users
    and groups on a Linux system, and we''ll explore a few of them in the course of
    this chapter.


    # MANAGING USER ACCOUNTS


    Remember that Linux is a multiuser operating system, which means that whether
    it''s running on a system used as a workstation or a server, it was designed to
    be accessed by multiple people. It''s less like the Windows 9x family of products,
    which have a flimsy user login mechanism, and more like the Windows NT/2000 family,
    which more tightly integrates the concept of multiple user accounts.


    What this means for you is that user accounts are a necessary part of Linux administration,
    whether you''re running Linux on a standalone system at home or as a server in
    your office. If your organization is growing, or you have lots of turnover in
    your workplace or love life, you may have lots of administration to do. So let''s
    talk about how to add, change, and delete user accounts.


    # Adding Users with Linuxconf


    Linuxconf is a pretty painless mechanism for adding user accounts. Using the full-screen
    text mode interface, the GUI under X Windows, or the web browser interface, you
    can view the current user accounts and add more as needed. When you click the
    Button to finish adding the account, you''ll be prompted to enter the account''s
    password. Before you get to that point, though, there are four sets of account
    information that Linuxconf can handle: basic account information, password management
    parameters, mail settings, and account privileges. We''ll discuss each in turn.


    # Base Information


    The base information is the fundamental set of data required when creating the
    user account. There are eight pieces of information that Linuxconf is interested
    in getting, but only the first three are required:


    +   - Enabled?

    - Login name

    - Full name

    - Group

    - Supplementary groups

    - Home directory

    - Command interpreter

    - User ID'
