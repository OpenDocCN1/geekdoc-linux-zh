    I''ll tell you why.


    To me, the value of a product is in its usefulness to me in my eyes (if it costs
    more than the functionality I get from it). In fact, the price of a program can
    only lessen its value. For example, I recently downloaded Bluefish, an HTML editor
    distributed under the GNU Public License (GPL). It has nearly all the functionality
