  md: '# Chapter 8: Step 5: Manage Users and Groups


    # Know How to Recover Root


    Having few people know the root password it''s possible that the sad day will
    come when nobody knows the root password. At the rate system administrators change
    these days, the likelihood of losing the root password is fairly high. What do
    you do if you need to administer a system whose root password has been trashed?


    This is where a boot floppy comes in very handy. Some distributions will also
    allow you to boot from a non-installation version of Linux CD-ROM. Either way,
    you''ll want to insert the appropriate disc or diskette and everybody off. Make
    a note of the location of the /etc directory; normally, it is not placed on a
    different partition from / directory, so use the mount command to determine the
    partition that is mounted as /etc or /. Make a note of it.


    If a non-root user can shut the system down gracefully, the shutdown -h command
    to do so. If mortals do not have this power, check whether mortals can mount any
    of the partitions on the system. If this does not work, issue the sync command
    a few times to make sure the disk contents are up to date and not hanging out
    in a cache somewhere (after everybody''s off the system and there aren''t any
    active processes running). Hold your breath, and wince, use CTRL-ALT-DEL from
    the console to reboot the system.


    Boot from the floppy or CD-ROM, which will mount its own root directory and file
    structure, and, importantly, use its own account definitions. Login as root and
    use the mount command to mount the hard disk partition containing your normal
    /etc directory. For example, if /etc is on the /dev/sda1 partition, you can use
    the following command:


    ```

    mount /dev/sda /mnt

    ```


    This makes the contents of the /dev/sda1 partition visible on /mnt. You will be
    able to change it into the /mnt directory and find the /etc directory. Edit the
    passwd file contained there by deleting the text between the first two colons
    on the root account''s line, so that it looks like this:


    ```

    root::0:0:root:/root:/bin/bash

    ```


    Now edit the file in the same directory by deleting the text between the first
    two colons on the root account''s line. Restart the system, and you should be
    able to log in as root without a password. Change that situation quickly using
    the passwd command, and for heaven''s sake, put your new password in safe or something.


    This exercise should also give you an idea of why it''s important to maintain
    physical security over your systems. Given a floppy disk and access to the system,
    you''ve just changed the root password. Sobering, isn''t it?'
  merge: -1
