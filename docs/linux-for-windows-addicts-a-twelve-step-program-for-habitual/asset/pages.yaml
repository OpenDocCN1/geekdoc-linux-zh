    Accept and you''re done setting DNS. The Linuxconf interface is a front end to
    the /etc/resolv.conf file. While the DNS Usage-option is for Linuxconf''s benefit
    only, the other changes you make will be visible in the resolv.conf file, which
    includes lines like:


    ```

    domain prolificinc.com

    search stdcells.com

    search standardcells.com

    nameserver 10.0.2.1

    nameserver 10.0.2.254

    ```


    # Default Gateway


    The default gateway is the router that this system will depend upon to send data
    located outside the local network. To configure this option in Linuxconf, select
    Defaults from the Config-Networking-Client Tasks-Routing And Gateways entry. Enter
    the gateway-s IP address in the Default Gateway field.


    If you want the system you''re configuring to act as a router, you can check the
    Enable Routing box on the Defaults screen. Unless you''ve configured the system
    to be a router, however, you shouldn''t enable this option.


    You can also examine the /etc/sysconfig/network file to find (and change, if you
    wish) the current default gateway, which is defined on a line as follows:


    ```

    GATEWAY="10.0.2.254"

    ```


    # Other Routes


    If you want to designate other ways of getting off the local network, you can
    specify other routes to get to specific networks or hosts. You can also configure
    the system to recognize multiple logical IP networks running over the same physical
    network.


    All three of the options described next manipulate a file known as /etc/sysconfig/static-routes.
    If you wanted to manually edit this file, you could do so; once the changes have
    been made to your satisfaction, you don''t have to reboot the system; you can
    simply restart the networking processes using the command /etc/rc.d/S10network
    reload (assuming you’re in normal multiuser mode, known as runlevel 3).'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Chapter 7: Step 4: Connect to a Network


    # # Displaying Routing


    There are several sources of networking status information available on a Linux
    system. If you enabled the /proc filesystem in the kernel, you can examine the
    files and subdirectories in /proc/net for information that might be relevant to
    something you''re doing. On the other hand, if you''re looking for quick and dirty
    routing information, you can check out the /bin/netstat command.


    Netstat is a useful tool for determining routing information, identifying enabled
    and active sockets, and viewing network interface statistics. To view the current
    routing information, use the netstat -r command, which produces output similar
    to this:


    | Destination | Gateway | Genmask | Flags | MSS Window | itrt Interface |

    |---|---|---|---|---|---|-|

    | 10.0.1.1 | * galatians.disti | 255.255.255.255 | DGH | 0 | 0 eth0 |

    | 10.0.2.238 | * | 255.255.255.255 | U | 0 | 0 eth0 |

    | nt-net.dm.org | * | 255.255.255.0 | U | 0 | 0 eth0 |

    | 127.0.0.1 | * | 255.0.0.0 | U | 0 | 0 lo |

    | default | | 10.0.2.254 | 0.0.0.0 | UG | 0 | 0 eth0 |


    Notice that in this example, there are several destination hosts and networks
    specified, with a few different gateways and other bits of information available.
    The Destination column shows the target host or route. The first entry in the
    output is 10.0.1.1, a host that has specially configured to be reached via a custom
    route.


    The Gateway column shows how information gets to a specified destination from
    the host you''re working on. So to get to 10.0.1.1, this routing table indicates
    that the gateway is a host whose name is galatians.disti.


    The Genmask entry indicates the level of routing rule. Simply put, the portions
    of genmask that are set to 255 show which part of the address in the Destination
    needs to match the destination of a packet to be routed. If that doesn''t make
    sense, let me tell you this way: In the output, the two hosts listed, 10.0.1.1
    and 10.0.2.238. For these rules are invoked, four segments of the destination
    address must match the Destination setting for these rules. If they don''t match,
    the next rules are consulted until one is found that applies. So if a packet is
    destined for 127.82.82.12, it will be sent to the loopback address at 127.0.0.0,
    because the genmask only compares the first portion of the two addresses.


    More information on netstat, including how to use the -t option to show TCP information
    and how to use the -i option to show interface statistics, can be found on the
    man page (man netstat).'
  merge: -1
  pgno: 248
