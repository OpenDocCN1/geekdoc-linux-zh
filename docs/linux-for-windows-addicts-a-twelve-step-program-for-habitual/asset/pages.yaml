    Enable the VGA Text Console option, which allows you to access the Linux text-mode
    console from any VGA-compliant system. I consider this a mandatory option, even
    on systems I don''t expect to need access from a local console display. Naturally,
    I think you should agree with me.


    For people who do a great deal of work at a plain console prompt, the Video Mode
    Selection Support is a definite plus. It allows you to specify the video mode
    used for the console screen. Instead of having one default resolution setting,
    you can vary the setting to fit more rows and columns of characters. I use this
    on systems that are mainly touched from the console, and you may decide you like
    it too. However, I don''t think it''s widely useful for people migrating from
    the Windows world. If you''re interested, enable this option and add this line
    to your /etc/lilo.conf (remember to run /sbin/lilo afterwards)


    ```

    vga=ask

    ```


    This will prompt you for several resolution options when you start the system.
    Select the one you want and make a note of the corresponding code. If it looks
    good to you, you can edit the line you added to /etc/lilo.conf, replacing the
    “ask” argument with the four-digit code. Rerun /sbin/lilo and restart the system,
    and you''re good to go.


    # Sound


    While Linux provides support for a large number of sound cards, many users have
    found sound support somewhat difficult to configure. Many distributions include
    tools to make sound configuration simpler; Red Hat, for example, includes a text-mode
    utility called sndconfig. You can just run the command (as root) and Linux can
    automatically find and configure your sound card.


    | Setting Name | Recommended | Safest If Undecided |

    | --- | --- | --- |

    | Sound Card Support | Y (if you use a sound card) | M |


    For server-class machines, I don''t see a point in including a sound card at all,
    and I recommend leaving the Sound Card Support option disabled. If you want sound
    on your workstation (or a server, for that matter), go ahead and enable this option,
    then find the device-specific driver that corresponds to the sound hardware on
    your system. More information is available in the Sound-HOWTO, and in the help
    text for each option.


    Note that many sound cards fall under the OSS Modules option, so if you don''t
    see your sound card in the initial list, be sure to enable the OSS option and
    look at the rest of the list.'
