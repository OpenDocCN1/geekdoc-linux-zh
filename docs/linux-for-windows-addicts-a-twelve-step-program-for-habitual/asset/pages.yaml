  md: '# One Key, Two Key, Red Key, Blue Key


    Many Windows users are accustomed to having two buttons on their mice. For right-handed
    configuration, the left key is usually for selecting items via click or double-click,
    and the right button is for context-sensitive menus. And just as Windows users
    have sneered at one-buttoned Macintosh mice, some Unix users sneer at two-buttoned
    Windows mice.


    In Linux, the middle button is typically used to paste selected into the current
    window. In other words, you select some text using the left button, then you point
    the cursor to the place you want that text duplicated, and click the middle button.
    This system works well, and it''s particularly useful drag-and-drop functionality
    is not very comprehensive in the X Windows world. (So sneer back, Mac users!)


    If your mouse has only two buttons, you can make it like a three-button mouse
    by enabling third-button emulation. This tells Linux when you press the right
    and left keys together, you want that combination to act like the third button.
    Note that most mice with scrolling wheels allow the wheel to be clicked like a
    button, so they work as three-button mice without emulation.


    Select the current mapping for your keyboard. A space is provided for you to type
    in test the keyboard if you desire. When you''re done typing, “The brown fox jumped
    over the lazy dog,” or perhaps a more profound message like the one in Figure
    4-12, click Next to continue to the Select Monitor screen.


    The Select screen provides three ways of specifying your monitor information.
    The simplest method is finding your monitor manager in the list, clicking the
    plus sign next to the manufacturer name to show the available model numbers, and
