  md: 'For large networks with complex routing tables, you can make routing more efficient
    by enabling IP: Large Routing Tables. Smaller networks (the kernel help information
    suggests fewer than 64 entries) don''t need this feature enabled.


    IP: Kernel Level Autoconfiguration should be enabled on Linux systems that boot
    off the network rather than from a local disk. The autoconfiguration option initializes
    your system''s networking functions using BOOTP or RARP. If you are installing
    this on a diskless workstation, enable this option and either IP: BOOTP Support
    or IP: RARP Support, depending on whether your network uses the BOOTP protocol
    or a RARP server.


    Enable IP: Tunneling in the unlikely event that you need to encapsulate IP packets
    within IP packets, which is only useful if you''re trying to spoof an address
    for or ill. If you need it, you can also enable IP: GRE Tunnels Over IP to support
    generic encapsulation (GRE), which is used to help IPv6 and the far more commonly
    used IPv4 coexist on the same networks. The help text for this option notes that
    this can be useful for communicating with Cisco routers, which prefer the GRE
    tunnel to the standard Linux tunneling.


    Enable IP: TCP Explicit Congestion Notification Support if you plan to enable
    Explicit Congestion Notification (ECN) is a method of identifying and responding
    to network congestion on TCP/IP packets. If you''re rolling out a network where
    the router or most of the configured workstations use ECN, this can be useful—instead
    of dropping data packets when the network is congested, an ECN-equipped router
    steals the stations on the network to talk slower so it can keep up. If you have
    no plans to use ECN, you don''t need this option.


    IP: SYN Cookies Support (Disabled Per Default) employs a defense mechanism known
    as "SYN cookies" to prevent a potential denial-of-service attack known as "SYN
    flooding." Using SYN cookies, the system can determine which users should be able
    to connect to the host system while the SYN flooding is taking place.


    If your system will be accessible from the Internet, it''s a good idea to enable
    this option, but as the names indicate, simply selecting the option before a kernel
    build isn''t enough to turn on the SYN cookies. To do that, use the following
    command you''ve compiled and installed the kernel:


    ```

    root@roms ~> echo 1 >proc/sys/net/ipv4/tcp_syncookies

    ```


    If you are using a multivendor environment with Novell NetWare servers, and would
    like to interconnect using their (formerly) native IPX protocol, enable The IPX
    Protocol. SPX support is in the experimental stage as I write this, the extent
    of your application connectivity may be limited, but for basic networking functionality,
    including access to files and printers, IPX will serve adequately. Of, if you
    have no NetWare, it''s very unlikely


    If you enable IPX networking, you have the option of giving your Linux host an
    internal IPX network address to allow socket-level communications using the IPX:
    Full Internal IPX network option.'
