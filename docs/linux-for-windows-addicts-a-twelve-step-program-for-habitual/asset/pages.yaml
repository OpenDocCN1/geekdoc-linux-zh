    # Configuring Extra Options


    The LILO defaults option in linuxconf also has an Extra Options tab, on which
    you can find several less frequently used LILO options. However, the first entry,
    allows you to enter a "root partition," is a useful one. The value in this box
    should be the device name of the root partition (such as /dev/hda5). Another commonly
    used option is the Read Only selection for boot mode, which starts the system
    with its partitions mounted read-only to start (if you want this; the system will
    set them to read-write once the system is up and the partitions have been checked).


    If you use a ramdisk, there are options for setting its size and for enabling
    an initial ramdisk (as described earlier in this chapter). You also have the option
    to set the VGA mode to something other than the default resolution. You can enable
    password protection on the startup process, and you can add other boot options
    (see the LILO HOWTO for more information).


    # Checking Configurations


    The linuxconf menu also includes an option for viewing LILO Linux Configurations.
    If you select this entry from the left-hand panel, you will see a list of boot
    configurations showing each one''s label, the partition it boots from, and the
    name and location of the kernel it boots. This is handy for keeping tabs on what''s
    going on with your LILO configuration.


    To add additional linux configurations, click the Add button and provide the information
    requested, including:


    +   - Label

    - Kernel image file

    - Root partition

    - Ramdisk size (if any)

    - Boot mode

    - VGA mode (if any)

    - Boot options (if any)

    - Initial ramdisk (if any)

    - Password (if any)'
