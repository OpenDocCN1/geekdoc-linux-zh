  md: '# Chapter 11: Step 8: Establish a Web Server


    tion below will quietly flush any information that comes its way into the Great
    Bit Bucket in the Sky, never to be seen again.


    ```

    ErrorLog logs/error_log

    TransferLog logs/access_log

    AgentLog /dev/null

    ReferrerLog logs/referrer

    ```


    Script Alias This entry is used to specify the relative and absolute paths to
    the directory where CGI scripts are stored. CGI scripts are programs to provide
    dynamic content for the web sites. The two arguments to the ScriptAlias entry
    are the name of the CGI directory relative to the web site''s address and the
    name of the same directory in absolute terms (from the root directory of the Linux
    system).


    ```

    ScriptAlias /cgi-bin/ /home/httpd/cgi-bin

    ```


    CGI SetUID Options These options set the user and group ID when a CGI script is
    executed. These defaults to the user "nobody", it''s preferable to create a new
    user and group expressly for the purpose of running scripts from the web server,
    which will make it easier to track—and lock down—access from the Web. The CGI
    SetUID User sets the user ID, the CGI SetUID Group sets the group ID. These are
    set to unique user and group names in the following example:


    ```

    User webuid

    Group webgid

    ```


    Tuning Why all these options are considered Tuning, I have no idea. The first
    option, Listen On Port, merely indicates the TCP port number on which the web
    server will await client requests. The default port, 80, is the right choice unless
    you''ve got a reason to make people use another port to reach your server. This
    doesn''t seem like a tuning parameter, but here it is.

    The Pid File entry also has nothing obvious to do with tuning, but does specify
    the file in which the web service writes its process ID number. This number is
    convenient for things like logging or restarting the server.

    The Time Out field is used to specify the amount of time a client is given between
    the time it makes a connection to your server and the time it makes a request.
    If the client dawdles longer than the number of seconds specified in this field,
    they''ll be disconnected, and tainted by cattle-dwellers with outrageous accents.
    They''ll just be disconnected.

    Finally, the Host Name Lookups option actually gives you some control performance.
    If you enable this option, the server will attempt to resolve each client''s hostname
    from its IP address. That sounds pretty cool, but what you sacrifice response
    time, the additional overhead that these DNS lookups can require and because the
    client doesn''t get a response until the lookup has occurred. There are other
    ways of being a snoop, so you shouldn''t have to enable this option.'
