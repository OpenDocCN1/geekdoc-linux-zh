  md: '# Linux for Windows Addicts: A 12-Step Program


    EQL (Serial Line Load Balancing) Support is a funky feature that allows you to
    use two modems connected to a single system to improve network throughput. If
    the host''re dialing into can support this feature, it''s a way of making SLIP
    and PPP connections ISDN speeds. More information is contained in linux/Documentation/network/eqltxt.
    Most people don''t have this type of configuration and can disable this option.


    The Universal TUN/TAP Device Driver Support option allows you to configure a character
    special file that is treated like any Normal-to-Point or Ethernet device. The
    file can be configured and accessed like any normal NIC. While this is cool of
    kind, it''s the type of thing that most Windows administrators are looking for.
    So disable the option. And unless you use the General Instruments Surfboard 1000
    modem, don''t enable that option.


    If your Linux system uses a Fiber Distributed Data Interface (FDDI) NIC, enable
    the FDDI Driver Support option. When FDDI''s dual redundancy and relative efficiency
    makes it a good backbone technology, its expense and the myriad of high-speed
    Ethernet options make it relatively uncommon. Unless you''ve already got FDDI
    stalled, don''t bother with this option.


    The Parallel Line Internet Protocol (PLIP) allows you to connect two PCs via the
    parallel port. But consider that you can purchase 10/100 Mbit Ethernet cards for
    $10 each before you get excited about using the parallel port to transfer data.
    Why not the systems indent? Disable the PLIP (Parallel Port) Support option.


    The Point to Point Protocol (PPP) is to connect systems using dialup lines. It''s
    more than recent SLIP (the protocol) and is a better option if you get to choose
    between the two. If you''ll be dialing up (or being dialed up) for network access,
    enable the PPP (Point-To-Point) Support option. If you''re using a modem for remote
    access, as most people do, you''ll also want to enable the PPP Support For Async
    Serial Ports option that appears once you enable PPP.


    The Serial Line Internet Protocol (SLIP) is another dialup protocol to network
    over dialup lines. If PPP access isn''t available to you (shame on your IP or
    clients if that''s the case), you can enable SLIP instead of turning on the SLIP
    (Serial Line) Support option. If you enable SLIP, you might as well enable the
    Compressed SLIP (CSLIP) protocol, which allows compression of the packet headers
    to improve performance and the "Keepalive and linefill" options, which improve
    reliability over poor dialup lines. Don''t enable 6-bit encapsulation unless the
    system you connect to requires.


    # Amateur Radio Support


    Do you want to attach amateur radio equipment to your Linux system? Then enable
    the Amateur radio support option, read the HAM-HOWTO and the AX25-HOWTO documents,
    select the appropriate drivers, and continue with the kernel compilation. The
    rest of us will disable this option and slowly back away.'
