    Now I won''t be able to access the files in this directory unless I''m searching
    through her files logged in as root. Naturally, the presence of a sticky bit in
    a directory''s permissions settings prevents non-owners from deleting files in
    that directory, so that''s-another example of directory/file permission interaction.


    # Setting Permissions


    The command-line utility used to set file and directory permissions is called
    chmod. The tool offers two different ways of specifying the permissions. One method
    designates the permissions using mnemonic codes, while the other uses a system
    of numbers.


    The mnemonics often seem easier at first, so they''re a good place to start. Suppose
    Karen wants to change the access to her christmas card so that anyone on the system
    may read it. She could specify that all users get the read permission using the
    followingcommand:


    ```

    karen@romans ~ chmod a+r ~karen/christmas_cards.txt

    ```


    This format simply says that all users (a argument) should have read access (the
    argument) added (the + argument) for the file. If Karen wants to check the results
    of this command using the ls -l, she will see:


    ```

    karen@romans ~ ls -l ~karen/christmas_cards.txt

    -rw-r--r-- 1 karen karen 10345 May 23 20:05 christmas_cards.txt

    ```


    The user already had read and write access to the file, so her access hasn''t
    changed. But now the group karen and the rest of the world have been granted read
    access to the file.


    If Karen decides that she doesn''t want every bozo we know onto our Linux system
    be can use chmod to revoke the read permission for the rest of the world:


    ```

    karen@romans ~ chmod o-r ~karen/christmas_cards.txt

    karen@romans ~ ls -l ~karen/christmas_cards.txt

    -rw-r--r-- 1 karen karen 10345 May 23 20:05

    ```


    She used chmod to revoke the (the argument) read permission (the r argument) from
    the other users (the o argument). But what if, realizing that she has placed the
    file in a directory nobody could see anyway, she decides to create a new directory
    to keep files she wants to share? She can set the permissions explicitly:


    ```

    karen@romans ~ chmod a+t,u=rx,g=rw,o= ~karen/share/

    karen@romans ~ ls -l ~karen/share/

    drwxr-xr-T 5 karen karen 4096 May 23 20:05

    ```


    This time, instead of adding or subtracting permissions from the existing set,
    she has designated each and every permission. This is a convenient tool, and it''s
    easier to remember-


