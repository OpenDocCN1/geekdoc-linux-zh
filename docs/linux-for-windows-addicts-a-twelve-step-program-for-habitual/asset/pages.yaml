    section of Figure 4-23; in the second column it indicates the number of cylinders,
    heads, and sectors), you''ll want to add one more partition to mount as /boot
    (like the one in Figure-4-22).


    The /boot partition is a small partition (Red Hat recommends no larger than 16MB,
    but I like round numbers when I can use them) that contains the Linux kernel and
    other files needed while the computer boots. A /home partition is very useful
    for keeping user data separate from system files, and I strongly recommend when
    you install "for real," you use a /home partition. This will allow you to more
    easily upgrade your system, because you can leave the user data untouched and
    completely reinstall the operating system. That''s a nice feature if you want
    to add a disk drive or try a new Linux distribution.


    When you have at least a swap space, a root partition, and (if you need it) /boot
    partition, click the Next to continue. By the way, the installation program won''t
