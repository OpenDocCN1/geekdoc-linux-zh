  md: '# Linux for Windows Addicts: A 12-Step Program


    An environment variable simply holds information that''s available to the entire
    environment (that is, the shell). Information that could be widely useful, such
    as the name of the shell you''re using, your account name, groupnames you belong
    to, and other options, are stored in environment variables and are accessible
    to programs that try to use of them. The path, which is a list of directories
    Linux will search through to find a file when you try to run a program from the
    shell, is also set as an environment variable.


    # Users and Groups


    Another difference between Windows systems and Unix-like systems is the way users
    and groups are handled. If you''ve ever shared a Windows system with other people
    using different accounts, perhaps you''ve seen how NT can handle multiple users.
    Each user can have a separate desktop setup defined, for example, however most
    people of Windows use a single login name to get onto the computer, in part because
    Windows 95 and Windows 98 didn''t handle multiple accounts very well, and in part
    because most people don''t think it''s necessary for Mom, Dad, and the twins to
    have separate accounts.


    In the Linux world, we definitely want everyone to have a separate account. And
    there are a number of special accounts that we don''t want anybody to use. Not
    to mention a superuser account that should only be used for special, powerful
    functions. How does all fit together? Let''s talk about it.


    # Superuser/Root


    The superuser of a Linux system is named “root.” The superuser is a person (or
    a group of people, if more than one) that has ultimate control over the


    ![](img/dcd0086266143e7048be2fb5e68a2391_79_0.png)


    # Overly Sensitive Software?


    Unlike DOS and Windows, Unix is very case-sensitive. That is, the caseE yOU sType
    coMaNDs matters. Some commands and applications that run under Linux help you
    by allowing you to be case-sensitive, but it''s generally important to type a
    command or file name exactly as you see it. You can have many similar files in
    one directory: “README,” “ReadMe,” “readme,” and “Readme.” All four would be different
    files; each could have different contents, and you would enter each name exactly
    as it appears in the directory listing. You can create filenames that include
    a space (for example, “read me”), this can cause problems in Linux, so it''s better
    to avoid doing so (by using underscores instead of spaces, for example).


    This isn''t necessarily a bad thing, but it takes getting used to it. Compared
    to some of the Windows products, which have a tendency to convert the filename
    from whatever you entered into all-caps format, it gives you a little more control.
    On the other hand, it requires more attention, and that''s not fun.'
