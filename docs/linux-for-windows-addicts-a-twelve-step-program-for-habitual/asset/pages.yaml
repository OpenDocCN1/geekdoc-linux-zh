    # Relating Permissions


    File and directory permissions are not isolated from each other. On the contrary,
    a directory''s permissions affect the effective permissions of the files it contains.
    The upshot of this situation is that if you''re locked out of a directory, you''re
    locked out of the files it contains. In fact, if you''re locked out of any directories
    in the path of a file you''re trying to access, you''re out of luck.


    Consider another example. Imagine Karen realizes I''ve been snooping around in
    her stuff, and wants to make sure that I don''t see the invitations to the surprise
    birthday she''s throwing for me. She could restrict the outside world''s permissions
    on the invitation file itself. But she could also create a directory to which
    other users have no access:


    ```

    drwx------ 5 karen 4096 May 23 21:13 myob

    ```'
