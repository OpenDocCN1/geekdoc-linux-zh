    # Changing User Information


    Changing any of the information entered in Linuxconf is as simple as selecting
    that user and making any desired modifications, from the list and disabling the
    account to change the user''s default shell, to altering the user''s privileges.


    Another way of accomplishing the same task is by using command-line utilities.
    As root, you can use all the basic information using the usermod command:


    ```

    usermod -u 701 -g 101 -d /home/karen -m -c "Karen Miller" -l karen karen

    ```


    In this example, the account "Karen" is renamed to "karen," its user ID is changed
    to 701; the home directory is changed and the contents of the current home directory
    are moved into the new one; and the user comments are changed to reflect Karen''s
    married name.


    The user can make changes to their own personal information as well. For example,
    the user account comments, which include the user''s full name, location, office
    phone number, and home phone number, can be altered using the chfn command:


    ```

    chfn -f "Karen Miller" -o 428B -p x346 -h myob

    ```


    And if a user just needs a new shell, the chsh command may be used:


    ```

    chsh -s /bin/bash

    ```


    The list of available shells is stored in /etc/shells; this list may viewed directly
    or using the command chsh -l. A user may not use chsh to change the shell to one''s
    not listed in /etc/shells; chsh will generate an error message if this feat is
    attempted.


    # Removing User Accounts


    The process for removing user accounts from Linuxconf is quite simple; just go
    into the User Accounts area, select the user you wish to delete, and click the
    DEL button. Buh-bye, user. This action will give you the option of leaving their
    home directory intact, archiving its contents, or deleting them. As usual, there
    are other ways of doing this. For exam-'
