  md: '# make bzimage


    This step is where the kernel itself is actually compiled, and it''s the one command
    that takes the lion''s share of the time in the process. When the shell gets to
    work it uses the configuration information you''ve given it to build a new kernel
    file. On Intel-based systems, this file is created as linux/arch/i386/boot/bzimage.
    For small kernels, you can use the make bzimage command, unless you''re sure the
    kernel is going to be quite dinky, it''s easiest just to use the bzimage option.


    Many messages will scroll across your screen as your system compiles the kernel.
    When the process is complete, the system will show you the size of the file you''ve
    created. Crackle loudly, or scream, "It''s alive!" the top of your lungs, and
    continue to the next step, in which we''ll install the kernel.


    # Install the Kernel


    In the last step, we created a kernel file as linux/arch/i386/boot/bzimage. This
    is the kernel file we want our system to use, and to do so, we have to instruct
    the boot loader to use.


    Most distributions use LILO as the boot loader, and you can identify the current
    location of the kernel by viewing the /etc/lilo.conf file. Look for the first
    line that says "image=" for an entry like like this:


    ```

    image=/boot/vmlinuz-2.2.12-20

    ```


    Sometimes the vmlinuz file may be found in the root directory: /vmlinuz. Wherever
    that file is currently located, that''s where you want to put the new kernel file.
    You''ll have to use the su command to become the root user first. You don''t have
    to give the vmlinuz file the same name as its predecessor (it''s best that you
    don''t, in fact, unless you know the new one''s going to work, and even you might
    want to use a more accurate name):


    ```

    root@romans:~# cp -millerm/linux/arch/i386/boot/bzImage /boot/vmlinuz-2.2.14

    ```


    # make bzdisk


    Another useful option is the make bzdisk command. If you use this command in place
    of the make bzimage command, the kernel you create will be written to your first
    floppy drive (the equivalent of your A: drive in Windows). This disk can then
    be used to test a kernel without tweaking the existing configuration, or to boot
    the system in an emergency.


    If you use this option and wish to boot from a floppy disk, you won''t need to
    follow the kernel installation procedure that follows. Simply reboot the system
    with the floppy disk in its drive (and the computer''s BIOS set to boot from the
    floppy drive).'
