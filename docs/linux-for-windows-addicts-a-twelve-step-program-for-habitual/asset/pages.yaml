  md: '# Linux for Windows Addicts: A 12-Step Program


    **RAID-1 (Mirroring) Mode** RAID-1 doesn''t stripe the data across multiple devices;
    instead, it writes the data to all the devices in the array. This makes it fast
    for read operations and about the same speed as a single drive for write operations.
    As long as a single hard disk remains intact, though, a system with mirrored drives
    can keep operating even if the other drive goes out. This is a good, reliable
    mode of operation, so I''d suggest enabling this option or compiling it as a module.


    **RAID-4/RAID-5 Mode** These methods combine the data stripping features of RAID
    0 with "parity" data, which allows the system to continue operating if a single
    drive fails. While I''ve had multiple drives from a RAID fail at once, these methods
    are generally seen as offering the best combination of performance and failure
    resistance. RAID 4 sets a set aside a single drive to store the parity data, which
    provides the ability to rebuild the data should a disk fail. RAID 5 achieves the
    same result by stripping the parity across all the drives in the array. This is
    an efficient way to combine a set of disks for capacity and fault tolerance, and
    I''d suggest that you enable the option or compile it as a module.


    **RAM Disk Support** Unless you have a reason to use a RAM disk (as with Windows
    systems, this is a mechanism by which part of the system''s memory is accessed
    as a disk drive), there''s no reason to enable this option. You always select
    M to make it a module. RAM disks are often used during Linux installation, so
    they''re enabled in the kernel that come with most distributions.


    A RAM disk is theoretically a good way of improving performance (by loading a
    program into a RAM disk, you largely avoid touching the hard disk; since RAM is
    dramatically faster than disk, this is a good thing). However, Linux attempts
    to use available RAM to cache frequently accessed data, so the performance gains
    you would get from RAM disk use will generally be minimal.


