    A failover system is one that shares the same data as the server you want to make
    available at all times. If the first server crashes, the second server steps in
    as seamlessly as possible so that your users can keep working or buying or whatever
    your users do. One problem with failover systems is that the additional servers
    don''t do much while they''re waiting for the first server to fail. So you buy
    two expensive systems and use only one at a time.


    A clustering approach makes available the processing power of a whole group of
    computers. This way, all the systems are available for use at all times. Some
    clusters are designed to provide high-availability computing to users. The Linux
    Myths points out that there are no “commercially proven clustering technologies
    to provide High Availability for Linux.”38


    Another use of clustering is to provide parallel computing capabilities. In other
    words, you run 2, 10, or 100 computers as one massive computer. This can be significantly
    more cost-effective than buying a supercomputer, and you can do it using off-the-shelf
    Linux software and your existing hardware. Nicholas Petreley pointed out that
    you will not


    > ...a Microsoft clustering solution competitive with Beowulf clustering for Linux....
    The Linux portion of the above weighs in at $49. You can''t use Windows NT to
    create the same solution today.39


    Most readers of this book won''t need either functionality, but this is a difference
    between the two systems.


    # Large Memory Support


    How much memory is in your Windows PC? If you''ve got more than two gigabytes
    of RAM in your system, you''ve got an impressive system. And you won''t be able
    to access the whole amount with plain vanilla Linux. As pointed out on Microsoft''s
    Linux Myths page, “Linux only supports 2 gigabytes (GB) of RAM on the x86 architecture,
    compared to 4 GB for Windows NT 4.0.”40


    This is a problem I wouldn''t mind having on my desktop systems (none of which,
    by the way, will even accommodate more than 2GB), but if you find yourself in
    this conundrum, using the version 2.4 kernel, which supports 64GB on Intel hardware.


    # Huge File Support


    While we''re on the subject of big, what size is your largest file? The Linux
    Myths notes that “The largest file size Linux supports 2 GB versus 16 terabytes
    (TB) for Windows NT 4.0.”41 And this claim is true when Linux runs on the 32-bit
    systems Windows


