  md: '# Linux for Windows Addicts: A 12-Step Program


    Don''t worry if this set of options is a little mind-boggling. If you''re not
    worried about running SSL, it''s irrelevant. If you don''t know how to run SSL,
    but want to, you should start by having a look at http://www.modssl.org/, where
    these options and others are described in as much detail as you could wish. The
    changes you make in Linuxconf section will be reflected in the /etc/http/conf/httpd.conf
    file like this:


    ```

    SSLCipherSuite ALL!:ADH:RC4+HIGH:+MEDIUM:+LOW:+SSLv2:EXP

    SSLVerifyClient 2

    SSLOptions OptRegotiate

    SSLRequire %(REMOTE_ADDR) = m|/192\.76\.162\.[0-9]+$/nSSL

    SSLVerifyDepth 2

    ```


    # Setting File Specifications


    This set of options is identical to the set available for subdirectories. The
    only differences between the two are how you get there (the Files Spec option
    from the Apache Web Server tree), what it affects (specific files instead of specific
    directories), and the entries it makes in the /etc/http/conf/httpd.conf file (it
    creates a <Files> section). You can add as many files as you like, making each
    one''s configuration unique to you.


    # Select Modules


    This option allows you to enable additional modules in the /etc/http/conf/httpd.conf
    file. It is best to use this option if you know what you''re doing, and quite
    frankly, if you know what you''re doing, editing the file directly is an easier
    way to go. Many options are listed in the configuration file; you can comment
    out the ones you don''t want to use, or uncomment the ones you want to use (assuming
    they''ve been compiled on your system):


    ```

    # LoadModule speling_module modules/mod_speling.so

    LoadModule userdir_module modules/mod_userdir.so

    ```


    In this example, the delightfully named "speling_module" is inactive (it''s commented
    out), but the "userdir_module" is enabled. The latter module, by the way, allows
    you to specify a root directory used when the client request contains a reference
    to a tilde-username. This is considered basic functionality and is included by
    default. The module isn''t used as often because the overhead of looking for matches
    for misspelled or incorrectly capitalized requests can be large.


    # Manage Performance Features


    Another set of options in the Apache Web Server allows you to set parameters for
    the web server processes that run on your Linux system. You can use these parameters
    to fine-tune your resource allocation, though for most systems, the defaults will
    be no'
