    # KDE Control Panel


    I''m partial to KDE, and I think it''s the best choice for users who are used
    to the Windows interface. This revelation sparked hot fires of protest from the
    many GNOME supports out there, but that''s just a chance I''ll have to take.


    The tool used to configure KDE is known as the KDE Control Center. It''s similar
    in principle to the Windows Control Panel, though it looks a little different.
    The Control Center, as shown in Figure 5-3, has a panel on the left-hand side
    with a hierarchy of options. The contents of the right-hand panel change to present
    you with the configuration choices for the selected option.


