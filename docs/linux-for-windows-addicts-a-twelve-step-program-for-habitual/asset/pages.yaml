    +   - Programmers need collaborative help

    - Programmers want to share their efforts

    - Programmers want to be recognized for their work


    These reasons often cluster together. For example, if someone is paid to write
    some software and enjoys sharing the software, they might release the software
    as open source so others can use it. Another person may desire certain functionality
    but can''t complete the project alone.


    And don''t underestimate the incentive of recognition, figuring something out,
    of being the one who figured it out and made it. For all the programmers happy
    to be cogs compensated with stock options, there are many others to whom craft
    is paramount. These craftsmen refining each other, stimulating new ideas and enhancing
    old so to deal with current problems. There are other motives, of course, but
    these will do.


    # Someone Else Paid


    The first motive arises when someone needs software and is willing to pay for
    it. In this case, the programmer is compensated for the work, is able to pay the
    rent and purchase adequate quantities of CDs, DVDs, Doritos, and Mountain Dew.
    There are three options available to this programmer: Ignore the client''s check
    clears; keep the program in hopes of selling it to someone else; or distribute
    the program for further, testing, and enhancement. He or she is welcome to choose
    the most desirable path, if the program isn''t easily marketable, or if it will
    lie fallow, or it could be better if more people helped, why not make available
    for use and embellishment?


    # They Need the Software


    The second motive stems from a personal need for particular software functionality.
    Eric Raymond''s research paper "The Cathedral and the Bazaar" describes his experiences
    developing a program called fetchmail. He began development because he wanted
    a better mail tool than the one he had available, and he collaborated with others
    to speed development and debugging.


    A person in this situation isn''t likely to pay anyone else to write something
    they can create themselves. By doing some work and sharing it, the programmer
    is not taking any food off the plates of others. And if the tool becomes useful
    to other people—they now have the potential of selling improvements and customizations
    to others. (And if it''s wildly successful there''s always speaking money and
    a high-profile job from a company to gain some press.)


