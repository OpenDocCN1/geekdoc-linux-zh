  md: '# Preparing the Drive


    Our first move is to ready the disk for installation. OpenLinux will automate
    this process, but we can help it out by tidying the Windows partition first. We''ll
    first remove any files we know aren''t necessary, and defragment the hard disk,
    to see that there''s enough space available, install the partitioning software,
    and create the Linux partitions. Those tasks are easily accomplished one by one.


    # Removing Unnecessary Files


    If you''re pretty you''ve got plenty of available disk space, you don''t have
    to go through this step. If you''re like most of us, and fill all available space
    with junk, it''s a good idea to go through this procedure, even if it isn''t strictly
    necessary.


    Using Disk Cleanup If you''re using a version of Windows that includes it, the
    Disk Cleanup tool is an excellent option for removing unnecessary files.


    +   - Click the Start button.

    - Select the Programs menu option.

    - Select the Accessories group.

    - Select the System Tools entry.

    - Select the Disk Cleanup icon.


    This will bring up a window asking you to select the disk drive you want to clean.
    Select the hard disk on which you''ll be installing Linux, and click OK. The tool
    will then load with a screen similar to the one in Figure 4-9.


    The list of file types Disk Cleanup can delete on your system may be slightly
    different, depending on the applications you use. To rid yourself of the detritus
    left behind web browsers, applications that don''t fully delete your temporary
    files, and files that are sitting in the Recycle Bin, check all the boxes and
    click OK. Disk Cleanup will check to make sure you want to do what you just told
    it to, click OK again. After the files are deleted, the tool closes automatically.


    Cleaning Up Manually If you don''t have the Disk Cleanup tool on your system,
    you can do the same kind of cleanup manually. People usually have many recycled
    files and temporary web files, so I''ll just mention these two.


    To remove files from the Recycle Bin, follow these quick steps:


    +   - From the desktop, right-click the Recycle Bin icon.

    - Select the Empty Recycle Bin menu option.


    To remove temporary files from Internet Explorer, follow these steps:


    +   - Open Internet Explorer.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    ![](img/dcd0086266143e7048be2fb5e68a2391_125_0.png)


    **Figure 4-9.** Removing unnecessary files with Disk Cleanup


    +   2. Go to the Tools menu.

    3. Select the Internet Options entry.

    4. Make sure you''re on the General tab.

    5. Click the Remove Files button.


    Neither task is particularly difficult, so lacking the Disk Cleanup tool isn''t
    a terrible problem. Now that we have eliminated the useless files, we can tell
    Windows to organize the rest more efficiently on the disk.


    # Defragmenting the Hard Disk


    The next step in the process of readying the hard disk for OpenLinux is defragmenting
    the hard disk. This procedure reorganizes the data on the drive so it''s in an
    efficient order, packed at the beginning of the disk. Defragmenting the drive
    allows us to repartition the drive more confidently.'
