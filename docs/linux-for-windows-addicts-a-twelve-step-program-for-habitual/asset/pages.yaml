    There are several other options on the History screen, giving you control over
    display of “dot files,” the Shared, Personal, and Recent menus, sorting rules,
    and the application that runs when you open a folder while clicking the shift
    menu.


    # Desktop


    This set of options is similar to what’s found in the Colors, Desktop Themes,
    and Displays control panels in Windows, or take a few items. The exact options
    available to you depend on your installation of KDE, but I’ll describe the most
    frequently used options.


    Background From this screen you can select a single background to use with all
    your virtual desktops, or you can give each one a different look (which can be
    useful for remembering which one’s which when flip between them). You can set
    the background to a single color or to a blend or pattern using two colors. You
    may also prefer to use an image as wallpaper; most distributions include a variety
    of wallpaper images, and of course you may add your own one and control how it’s
    displayed.


    You may also set the wallpaper to random mode, which swaps the image periodically
    (you can control what’s selected and how frequently it changes). There’s an option
    to add a display icon to the desktop panel for quick reconfiguration, and you
    can set the background cache size high if you use large wallpapers on each desktop,
    or small if you prefer simple one-color backgrounds that don’t require memory.


    Borders If you’ve got multiple desktops enabled, one way to switch between them
    is by enabling active desktop borders from this screen. The active borders sense
    when you move the mouse to the edge of the screen and leave it there for a delay
    you specify, and they’ll switch to the next desktop. You can further configure
    the behavior of this desktop switching by telling KDE to move the mouse pointer
    to the center of the new desktop.


    Another option on this screen allows you to set the snap zones for borders and
    windows. The snap zones define an area around the edges of desktop borders and
    windows within those borders. If you move a window within a snap zone of another
    window or of the desktop border, the desktop manager will place the window with
    its edge exactly touching its neighbor. This is nice for the anal retentive types
    among us.


    Colors If you’ve used the Colors control panel on your Windows PC, this screen
    will be easy to navigate. You can select from a set of predefined color schemes
    (and with Windows, the results are previewed within the control panel). If you
    prefer, you can set the desktop colors by choosing each “widget” (window feature,
    as title bars and window text) and setting its color individually. You can also
    set the overall contrast of the desktop colors you’ve chosen.'
