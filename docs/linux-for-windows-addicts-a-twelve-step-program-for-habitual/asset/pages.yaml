- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    The second field, Max Clients Per Servers, allows you to set the maximum number
    of server processes for this web server. Because each user who connects to the
    web server uses a server process, this effectively sets the maximum number of
    simultaneous users.


    The Max Requests Per Child field sets the lifespan of each server process, in
    terms of requests they handle. Like some type of insect, each process serves requests
    as needed, and when they''ve served 100 requests, they die. This isn''t intended
    to be a biology lesson so much as a defense against memory leaks. By killing all
    processes after a certain amount of service, the server ensures that one leaky
    process can''t sink the ship.


    The Minimum Of Spare Servers is an awkwardly phrased field, but it''s used to
    determine the minimum number of idling servers. If there are fewer processes than
    the number set, Apache will start additional processes until this parameter is
    satisfied. Think of these as analogous to the road crew workers who need to be
    standing there while others are working. The system is designed to include them
    so that it''s ready for whatever happens.


    You can''t have a bunch of workers lollygagging around a job site, though, and
    like-wise, you don''t have a bunch of unused server processes sitting around.
    So the Maximum Of Spare Servers field allows you to designate the number of slugabs
    it can stand. If the number of inactive server processes exceeds this value, Apache
    kills off processes until the number is accessible again. Just thinking about
    this made me work harder.


    Keep Alive The Keep Alive option allows you to enable multiple user requests within
    a single connection. This is good because it prevents the user and server from
    having to re-establish a connection and every time there''s a new request.


    If you enable the Keep Alive option, you can set two related parameters. The first
    is the Keep Alive Timeout, which is the number of seconds a connection is maintained
    before it is closed. If the client isn''t making requests more frequently than
    this, the connection will be terminated. The Max Keep Alive Requests option sets
    the maximum number of requests in a connection. Note that there''s no sense making
    this section larger than the Max Requests Per Child set in the preceding section.


    Advanced Tuning Apparently there''s not much need for advanced tuning, at least
    not the linuxconf has organized this module. The lone field, Time Out, allows
    you to set a maximum lag between the time a user establishes a connection and
    the time they make a request.


    # Setup Secure Socket Layer


    The mod_ssl Configuration is the last option in the Apache Web server tree. Configuring
    mod_ssl is beyond the scope of this book, but Ralf S. Engelhardt'' documentation
    on the subject, available on the Web at http://www.modssl.org/docs/, should give
    you all the information you need to know if you want to make use of this security
    module.


    If you want to configure the SSL module, this is where you do it from Linuxconf.
    Some of the options mentioned earlier, in the “Subdirectories” section, are globally
    configurable here. Other options that are more relevant to the server-wide operations
    may also be set here.'
  merge: -1
