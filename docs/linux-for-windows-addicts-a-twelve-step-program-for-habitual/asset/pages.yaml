  md: '# Linux for Windows Addicts: A 12-Step Program


    there may be another computer on your home or with which you''d like to share
    files. If you''ve used Unix before, you''re probably familiar with NFS, and NetWare
    servers have long been able to offer their disk volumes as NFS shares. If you
    wish to make portions of a Linux system accessible to other Linux systems, or
    to other Unix users, or to Windows users already running NFS access programs like
    WRQ''s Reflection, you''ll need to export the file systems using the Exported
    File Systems (NFS) option on the Config-Networking-Server tasks tree.


    Selecting this option gives you the chance to add or modify what your Linux system
    allows others to see. To modify an existing NFS export, just click it from the
    list; to create a new one, click the Add button, which brings up a tab like the
    one shown in Figure 7-6.


    In the screen shown in Figure 7-6, the path to exported is listed as /home. When
    you enter every directory you wish, as long as it''s local to the system you''re
    configuring. If you export the root directory, for example, other users will have
    access to every part of your system, because the root directory (/) is the parent
    or ancestor of every other directory on the system. Ordinarily, you don''t need
    to be quite friendly.


    ![](img/dcd0086266143e7048be2fb5e68a2391_257_0.png)


    Figure 7-6. Use Linuxconf to configure your system NFS sharing'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Chapter 7: Step 4: Connect to a Network


    Just as you don''t need to create a share for your C drive: if you just want people
    to get to a certain folder in your home directory, you don''t need to export your
    whole Linux system if you just want people to access a particular area. It''s
    better instead to determine the directories you wish to be able to access, and
    designate them individually.


    If we return to the screen shown in Figure 7-6, the /home directory (and its subdirectories,
    by the we) is being exported to two client machines, karen and david. Notice that
    I said two machines; unlike the Windows paradigm, which provides a user with access
    to create shares, NFS gives certain machines access to the exported paths.


    Notice well that the karen machine has granted write permission to the NFS export,
    and the david machine lacks this access. While karen can read and write to the
    /home directory and its children, david may only read from the directory. Neither
    user has been granted root privileges in this directory (NFS isn''t the most secure
    access and I''m not excited about rooting privileges this way).


    The Translate Symbolic Links expands the path of a symbolic file link to include
    the full path from the root directory, even if the root directory isn''t what''s
    being exported. I haven''t had to use this, and it makes me just a little edge.
    The Request Access From Server Port option, on the other hand, is intended to
    make sure that NFS clients will only be accepted from privileged ports (less than
    1024). Enable it.


    These options are incorporated into the /etc/exports file, which is the master
    list of NFS export directories on the system. Here''s a sample:


    ```

    /home karen(rw) david (ro,all_squash)

    ```


    This line almost exactly duplicates the settings created for the Linuxconf shown
    in Figure 7-6. The remote system karen has been granted read and write access
    to the /home directory on the system being configured. The remote system david
    has been granted read-only access to the /home directory. The all_squash option
    is one I''ve added by hand. It prohibits users coming from david''s machine from
    using user rights to the target system. You can read about this option and a few
    others on the man page for the exports file: to read all about it, just execute
    the following command:


    man exports


    # VIRTUAL HOSTS


    I wouldn''t call this a frequently used feature, but you can easily configure
    your Linux system to respond to a number of IP addresses. This can be useful,
    for example, if you want to run a system as a web server that responds to multiple
    IP addresses and serves different domains and pages depending upon the requested
    address. While much of this functionality is configured in the web server software,
    the fundamental networking aspect can be setup in Linuxconf.


    Simply select the IP Aliases for Virtual Hosts from the Config-Networking-Server
    tasks, and then click a network device to enter alternative IP addresses. When
    you do so, you''ll see a screen like the one shown in Figure 7-7.'
