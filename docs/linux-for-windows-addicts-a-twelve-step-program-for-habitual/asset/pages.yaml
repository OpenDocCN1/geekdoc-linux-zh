  md: '# Linux for Windows Addicts: A 12-Step Program


    In the last chapter, we discussed the process of integrating Linux into your Microsoft-Novell
    network. Part of properly integrating these networks is providing print services,
    and if your objective is to reduce or eliminate your need for those proprietary
    operating systems, you''ll have to enable printing from your Linux systems.


    And brings us to Step 7 of the 12-step program: You must admit to yourself that
    Linux printing and print services are easy to configure. That simple step will
    allow you to provide all the print services you desire, will increase the efficiency
    of your network, and could very well bring harmony among the nations. Email me
    if you need a more detailed explanation of the logic behind that conclusion.


    In this chapter, we will discuss how to configure printing on a Linux system,
    how to make that printing capability available from various client operating systems,
    and how to manage printers in a Linux environment.


    # CONFIGURE THE LPD DAEMON


    The first step in our printer configuration process is to set up the line printer
    daemon (lpd). This is the program that runs in the background, listening for and
    spooling jobs to the appropriate printers. As with other services we''ve looked
    at, there are ways of configuring lpd from GUI-based tools. However, I also want
    to explain some of the underlying changes that are made to the system when you
    use the GUI tools, so that you won''t be insulated from what''s really going on.


    # Running printtool


    The Red Hat solution to the problem of printer configuration is a program called
    the printtool. This is a graphical tool that must be run by the superuser under
    X Windows. When you execute the printtool command, you will see a window similar
    to the one shown in Figure 10-1.


    Printtool can help you configure four types of printer connections between Linux.
    Printers that are directly connected to the Linux system (for example, via the
    parallel port) are configured as local printers. Printers connected to other Linux
    or Unix systems (including certain print server devices) are configured as remote
    printers. You can also make use of printers that are connected to Windows and
    NetWare systems on your network, if they''re ready for sharing.


    # Local Printers


    Most us connect local printers via the parallel port, and one nice feature of
    printtool is that it attempts to automatically locate printers connected to these
    ports. To add a new local printer, click the Add button from the main printtool
    screen. When you''re prompted for a printer type, as shown in Figure 10-2, select
    Local Printer and click OK.'
