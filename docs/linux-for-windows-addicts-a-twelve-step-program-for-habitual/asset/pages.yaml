  md: '# Linux for Windows Addicts: A 12-Step Program


    The PCMCIA bus is widely used on laptop computers, though it''s also possible
    to equip desktops with PC Cards as. Enable the CardBus Support option if you want
    to be able to use 32-bit CardBus on your Linux system.


    The System V IPC option is required to let certain processes talk with one another.
    While it''s not necessary for every piece of software you might run, it''s a good
    idea to include this functionality nonetheless.


    The BSD Process Accounting option allows some programs to track usage information
    about different processes. Unless the system is configured to record this information,
    and to make it available, it won''t do you much.


    The Sysctl option gives you control over how the kernel behaves actually changing
    the kernel. Only certain parameters can be altered; these can be found in the
    /proc/sys/ directory and are documented in Linux/Documentation/sysctl/.

    The Kernel Support For A.Out Binaries option is retained for backwards compatibility;
    aout is an out-of-date format used in earlier versions of Linux. Still, until
    it has gone away for, I suggest that you build a aout support into the kernel,
    just in case. Note that aout is the default name for C executables; if you compile
    a program under a recent version of Linux, the binary file will be in ELF format
    (even though it''s called aout).

    The current format for Linux binary files (program files and libraries) is known
    as the Executable and Linkable Format (ELF). You need to enable the Kernel Support
    For ELF Binaries option to run Linux. The aout format is disappearing from the
    scene as more programs use the ELF format.


    The Kernel Support For Misc Binaries option allows the Linux kernel to launch
    program files automatically when it recognizes their type. Examples of these binary
    files are Java programs that need to run in an interpreter, and DOS executables
    that need to run through the dosemu DOS emulator. Additional documentation on
    this format is included in Linux/Documentation/binfmt_misc.txt.

    Enter Power Management Support option if you''re configuring Linux on a laptop
    or another system with power-management hardware. There are two primary standards
    for such hardware; you''ll want to enable either ACPI Support or Advanced Power
    Management BIOS Support, depending on which one your system uses. In my experience,
    ACPI generally works better. There are several additional settings to configure
