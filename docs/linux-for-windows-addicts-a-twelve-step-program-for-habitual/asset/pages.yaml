  md: '# What''s with the Penguin?


    The Linux logo (some firmly contend he''s not a logo, but that''s not important
    right now) is a penguin. The penguin design you see on web sites, Linux distributions
    and promotional material, and as stuffed animals, was drawn by Larry Ewing in
    response to Linus Torvalds'' request for the artistically talented to bring his
    vision to life:


    Now, when you think about penguins, take a deep calming breath, and then think
    "cuddly". Take another breath, and think "cute". Go back to "cuddly" for a while
    (and go on breathing), then think "contended".


    With me so far? Good.


    So when you think "penguin", you should be imagining a slightly overweight penguin
    (*), sitting down after having gorged itself, and having just burped. It''s sitting
    there with a beatific smile - the world is a good place to be when you have just
    eaten a few gallons of raw fish and you can feel another "burp" coming.


    (*) Not FAT, but you should be able to see that it''s sitting down because it''s
    really too stuffed to stand up. Think "bean bag" here.


    Now, if you have problems associating yourself with something that gets off by
    eating raw fish, think "chocolate" or something, but you get the idea.


    The penguin is just a full and contented waterfowl. (In his original message,
    Linus speculated about another reason the penguin might be looking so satisfied,
    but we skipped moving to avoid undue jocularity in our juvenile readership?) That''s
    the obvious embodiment of this lean, extensible, cooperatively produced operating
    system, huh? No? Well, Linus heard enough comments about these lines that he responded
    to them:


    Some people have told me they don''t think a fat penguin really embodies the grace
    of Linux, which just tells me I have never seen an angry penguin charging at them
    in excess of 100mph. They''d be a lot more careful about what they say if they
    had.


    And upon further review, I''d be a little lousy if I''d consumed a few pounds
    of raw herring, too.'
