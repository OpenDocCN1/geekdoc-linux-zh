  md: '# Linux for Windows Addicts: A 12-Step Program


    To do the funky template voodoo I mentioned earlier, you need to use the include
    statement, which basically slurps the contents of the file you specify into the
    .html file at the point you specify it:


    ```

    <!-- include virtual="includes/head.txt" -->

