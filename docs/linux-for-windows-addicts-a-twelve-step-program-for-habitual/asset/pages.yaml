- img_proc: true
  md: '# Chapter 12: Step 9: Manipulate Email


    # USER MAIL AGENTS


    It''s all fine and good to have a mail server on your Linux box. But how do you
    read mail on a Linux system? There are many tools available, but three of the
    most commonly used Mail User Agents (MUAs) are elm, mutt, and pine.


    # elm


    In my opinion, elm is a little bit like the vi editor: They''re both old and ubiquitous.
    Elm''s interface is trim and straightforward, but if you want to do anything funky,
    you won''t have any idea how to do it. All the same, for basic access to the Linux
    mail system, it''s easy enough to use. Check out the web site at http://www.myxa.com/elm.html,
    and try running the program from the command line. Editing a message in elm uses
    the vi editor.


    # pine


    The pine (Pine Is Not Elm) MUA is more powerful, and in my opinion, a little easier
    to use than elm. It''s menu-driven, for one thing, and your options are a little
    more clearly presented with them. It can also access POP and IMAP mailboxes, so
    you can use it to get your Inbox mailbox whether that''s local or at an ISP. It
    can also browse NNTP newsgroups. See the web site at http://www.washington.edu/pine/
    for more information, and try running it from the command line as well. Editing
    a message in pine uses the pico editor commands.


    # mutt


    The mutt MUA is a mongrel tool that has taken some of the features of the other
    mail tools, and adds a few of its own. I particularly like mutt''s ability to
    use color, since I''m not stuck in front of a monochrome terminal. It also allows
    you to choose your favorite mail editor, which is nice for emacs aficionados.
    Consult the web site at http://www.mutt.org/ for more information, and try running
    it from the command line.


    # POP MAIL


    While the MUA programs described in the preceding section will work well for your
    Linux users, they won''t do your Windows users much good. What will do them some
    good is enabling POP access on your mail server and pointing a POP-capable mail
    tool at that server. Those things are very easy to do.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    # Using Linux as a POP Server


    Most Linux distributions come with a POP service of some kind. Red Hat can handle
    POP or IMAP connections, but you''ll have to enable the service you want. Follow
    these instructions:


    Open /etc/inetd.conf in a text editor, and find the lines that begin with pop-2,
    pop-3, and imap. They''re probably all commented out; if you want to use POP to
    access the mail accounts, you can do that by uncommenting the line that starts
    with the pop-3 (just delete the pound sign). If you prefer to use IMAP, uncomment
    that line instead.


    Once you''ve uncommented the line, you''ll have to restart the inet daemon by
    running the following command:


    ```

    root@romans ~ /etc/rc.d/init.dinet restart

    ```


    # Using Netscape as a POP Client


    While there are other tools that can be used to access mail from POP and IMAP
    servers, Netscape''s usually a good choice for users from the Windows world. The
    Netscape interface looks similar to what they''re used to, and it''s part of a
    program they probably have open anyway. Configuring the Netscape Messenger to
    access your POP server is very simple:


    +   - Start Netscape, and from the Edit menu, select Preferences.

    - Select the Mail & Newsgroups entry.

    - Choose the Mail Servers entry, which opens the window shown in Figure 12-2.

    - From the Incoming Mail Servers section, click Add (unless there''s already a
    server defined, in which case you can select it and click Edit).

    - In the General tab of the configuration window that appears, enter the name
    of your POP mail server.

    - Select the type of mail server. The pertinent choices are POP or IMAP.

    - Enter the name of the user''s POP account on the server.

    - If you''re dealing with an executive, check the Remember password box. Otherwise,
    lecture the lecturer on the importance of password security.

    - Tell Netscape how often to check the POP mailbox; the default of 10 minutes
    should be fine.

    - Select the option to automatically download new messages as it notices them.

    - Click OK to return to the Mail Servers window.

    - Enter the name of the SMTP server (for outbound mail), and enter the user name
    if necessary.

    - Click on the Identity option and enter the user''s full name.'
