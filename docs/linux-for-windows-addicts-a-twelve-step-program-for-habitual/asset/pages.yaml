    tar cvzvf /bak/homebak/deb_kilner_$D.tgz /home/dkilner/*

    tar cvzvf /bak/homebak/omar_keblawi_$D.tgz /home/okeblawi/*

    tar cvzvf /bak/homebak/eric_chamness_$D.tgz /home/echamans/*`

    ```


    In real life, I save files like these to a large disk partition, moving the files
    directories as the backups for a few days. A separate cron job writes the files
    to and rotates the files.


    # Synch Time


    Whether you''re on a big network or a little one, having your system''s clocks
    synced up can make life fois easier, especially if you or some users will be building
    lots of software, as compilers can be quite fussy about time discrepancies between
    systems. One way to overcome this is to use the ntdate program to sync your system''s
    clock with that of a time server. You''ll have to supply your own time server
    addresses, but a script like this, dropped into the /etc/cron.daily directory,
    should do the trick:


    ```

    #!/bin/sh

    /usr/sbin/ntpate \\\ntptime.msaddicts.com \\

    time.prolificinc.com

    ```


    # Send Scheduled Messages


    There are all kinds of tasks you can schedule that fit into this category, but
    you might consider yourself sending messages once a week or so that give basic
    system information. The results of a df command, which tells you how much disk
    space is free on each of the system''s partitions, might be a good start.


    You can set the mail recipient of different ways. Crontab files often include
    a MAILTO statement that specifies the user to use whom output should be mailed;
    it can be specified like this:


    ```

    MAILTO="millerm"

    10 5 * * 0 /bin/df

    ```'
