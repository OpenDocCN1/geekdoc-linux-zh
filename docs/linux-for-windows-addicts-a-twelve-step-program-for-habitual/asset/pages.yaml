  md: '# Chapter 2: Why You Would Want to Kick the Habit?


    If you''ve ever experienced NTFS volume check after an NT system crashes, know
    that this process can be very time-consuming if the volumes are large. The filesystem
    is more likely to need checking if the system has been powered down improperly,
    so power outages, clumsy handling of the computer cables or power switches, or—dare
    I say it—an operating system known to be unstable (see the section on "Stability"
    earlier in this chapter) may all induce a filesystem check.


    With respect to filesystem integrity and checking, my experience is that Linux
    filesystems and Microsoft NTFS systems are similar. As a user, you will be happiest
    if your system doesn''t go down unexpectedly, and Linux is good at staying up
    for a long, long time. Heaven help you if you''re using FAT32 partitions on your
    Windows systems; the combination of the instability of the Windows 9 platform,
