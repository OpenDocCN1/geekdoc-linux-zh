  md: '# Chapter 6: Step 3: Compile a Kernel


    # Parallel Port Support


    The Parallel-Port Support option enables Linux to use devices connected to the
    parallel port. While printers are commonly attached to parallel ports, many other
    peripherals, including a variety of disk drives, can use a parallel port connection.
    In a server environment where printers are often directly network-connected rather
    than attached to computers, you may not need to activate your parallel ports.
    On the other hand, Linux makes a pretty print server device and can save you a
    few bucks on an external print server device, small environments especially may
    want to activate this option.


    | Setting Name | Recommended | Safest If Undecided |

    | --- | --- | --- |

    | Parallel Port Support | Y | Y |

    | PC-Style Hardware | Y | Y |

    | Use FIFO/DMA If Available | Y | N |

    | Support Foreign Hardware | N | N |

    | IEEE 1284 Transfer Modes | Y | Y |


    If you''re using a PC-compatible computer, and activated parallel port support,
    you should select the PC-Style Hardware option. If you know your parallel port
    has a FIFO chip for accelerated parallel port communications, you can enable FIFO/DMA
    If Available. A few non-PC computers supported by Linux also use these parallel
    ports. If you have a non-PC-based system, you should select the Support Foreign
    Hardware option to enable the non-PC-style parallel port.


    Finally, if you have a fairly recent system, you may have a bi-directional parallel
    port that complies with the IEEE 1284 standard. Enabling the IEEE 1284 Transfer
    Modes allows you to make use of the Enhanced Parallel Port (EPP) or Extended Capabilities
    Port (ECP) functionality on your system. If you leave this option disabled, an
    EPP or ECP will still work as a standard printer port.


    # Plug and Play Configuration


    Plug and Play (PnP) is a mechanism by which devices are identified for the system,
    and system resources are allocated for the devices. Enabling this feature allows
    the kernel to identify and manage PnP devices. The available options are shown
    here.


    | Setting Name | Recommended | Safest If Undecided |

    | --- | --- | --- |

    | Plug And Play Support | Y | Y |

    | ISA Plug And Play Support | Y | Y |


    Enable the Plug And Play support option to turn on PnP support in the kernel.
    ISA bus devices can be identified to the system using the ISA Plug And Play support
    feature.'
