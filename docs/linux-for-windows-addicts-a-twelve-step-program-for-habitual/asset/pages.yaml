  md: '# INSTALLING RED HAT LINUX TO AN EMPTY DISK


    In the Corel Linux installation I walked through earlier in this chapter, we installed
    Linux to an existing Windows partition, despite anticipating performance problems.
    In the OpenLinux installation, we used PartitionMagic to create a space for Linux.
    But what if you already have available disk space? Perhaps you want to play it
    safe and avoid touching your Windows disk at all. And there''s always the chance
    you''re fed up with your computing life run by Microsoft that you just want to
    wipe your disk clean and start fresh with Linux.


    The type of installation I''ll illustrate with Red Hat can be performed with every
    major distribution of Linux. And while I''ll be using the graphical install because
    Windows users seem more comfortable with it, you should know that many Linux users
    prefer the text-based installation process Red Hat has used for years. That installation
    option, which is a prompted step-by-step process similar to the graphical process,
    is still available, and if you''ve got a spare hard disk to play with anyway,
    you might try that type of installation.


    # Initial Configuration Information


    The first step is to boot your system with the Red Hat CD in CD-ROM drive. If
    your system cannot boot from a CD, be sure to insert the Red Hat installation
    floppy disk. When the system boots up, it will present you with a text-based installation
    screen giving you your options: You can use the graphical setup, the text-based
    setup, or the expert-mode setup. We''ll be using the graphical setup, so simply
    press ENTER to continue. If you wait long enough without selecting an installation
    option, the graphical process will begin by default.


    A series of messages will scroll across the screen as Linux boots up. A Red splash
    screen appears, and the next thing you know, you can select your language. For
    me, this is English. When you''ve chosen the option you desire, click Next to
    continue.


    Next comes the keyboard configuration screen, which is quite similar to the one
    used in the OpenLinux setup process. It allows you to select a keyboard model,
    a country layout out, and a deadkey variant.


    I have a keyboard that isn''t listed among the options, so my best option is the
    Generic 104-key PC keyboard; choose the description that matches your keyboard
    model, or a generic description that applies. You''ll be able to decide which
    keyboard layout you use, but for some users in the U.S., the Deadkeys and ISO9995-3
    options may be a little confusing. Unless you''ll use those deadkeys (where a
    character like "~" is typed before a letter to produce another language-specific
    character), or if your keyboard is the ISO9995-3 layout, don''t worry about them
    and use the U.S. English layout.


    The Deadkeys option is only needed if you''ll be using deadkeys, or if you want,
    disable them them if your language doesn''t require them. Leaving them enabled'
