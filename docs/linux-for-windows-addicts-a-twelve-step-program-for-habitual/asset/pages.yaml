    StarOffice are all-ready afoot.


    # The StarOffice Installation Process


    The installation process is similar to what you''ll find on a Windows system;
    in fact, one of the great features of the StarOffice package is that it works
    across platforms, including Windows and Unix. To get things started, you can load
    the CD-ROM that comes with several major Linux distributions and run the setup
    program appropriate to the operating system you''re using.


    If you''re running Hat 7, StarOffice is included with the Deluxe Workstation package.
    The suite is included in RPM form from the CD-ROM impressively labeled "Third-party
    Workstation Server Applications Released with Red Hat Linux 7." To install the
    program from this CD-ROM, follow these steps:


    +   1. After mounting the CD-ROM, become root, and then install the rpm:


    ```

    root@romans /root > -Uvh /mnt/cdrom/StarOffice/StarOffice*.rpm

    StarOffice ############################################

    ```'
