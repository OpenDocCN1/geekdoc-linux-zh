    The Gimp isn''t just a bit character in Pulp Fiction, it''s the GNU Image Manipulation
    Program, an extensible and profusely featured program that allows you to retouch
    photos, create images, convert graphic file formats, and even do cartoon sketches.
    Imagine, all of that functionality, and it''s free. What could be better? Well,
    it''s also well documented and easy to use, Figure 15-3 shows the Gimp in action.


    A distribution isn''t really complete without a copy of The Gimp, but in case
    yours is missing, or you need more information, you can consult the project''s
    web site at http://www.gimp.org/


    Don''t forget that several of the free office software packages also include imageviewing,
    creation, and editing tools. These tend to be as powerful as the PC-based'
