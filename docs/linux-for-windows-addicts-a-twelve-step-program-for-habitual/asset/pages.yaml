- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    You can also specify the output destination on the line with the command itself:

    10 5 * * /bin/df 1>david@romans 2>millerm@romans


    This command will send standard output from the command to one user, and error
    messages (if any) to the other.


    # Other Maintenance Tasks


    I hope you''ve got exciting ideas about what you want to schedule using cron or
    at. Here''s one more suggestion that I recall reading some time ago in an early
    version of Matt Welsh''s documents on getting starting with Linux (for the latest
    versions of the documents he started, see the Linux Documentation Project at http://www.linuxdoc.org/).


    You can schedule periodic checks of the filesystems on your Linux systems to make
    sure they''re in good health, especially if the system doesn''t go down very often
    and therefore isn''t getting checked very often at startup. If you''re going to
    be checking filesystems, you should unmount them first; you don''t want people
    touching the contents while the check is going on.


    It would probably be best to write a full-blown script to accomplish this task
    in your environment, but the simple version might look like this:


    ```

    /bin/umount /dev/sda2

    /sbin/e2fs -fpv /dev/sda2

    /usr/bin/shutdown -r 5

    ```


    This script would be dropped into the /etc/cron.monthly directory. It first unmounts
    the partition that will be checked (which excludes the root partition, which needs
    to be mounted while the system is running from it). Next, it runs the filesystem
    checking utility, forcing a check if it doesn''t necessary, and repairing any
    damage it finds. Because there may have been corrected damage, we reboot when
    the check is done.


    That''s not a very elegant solution; a more sophisticated script could do other
    checks and might only restart the system if damage was detected. Or it might consider
    the current load on the system blithely rebooting the server. If enhancements
    like that make sense to you, try your hand at writing a new script. Just test
    it on a non-production system, if you please.'
