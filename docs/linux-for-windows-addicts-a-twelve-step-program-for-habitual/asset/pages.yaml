  md: '# Chapter 14: Step 11: Share and Schedule


    There are numbers I''d ordinarily expect to find the username and group name.
    Those numbers are the user ID and the group ID that have ownership of the file,
    and when they''re displayed instead of names, it''s because the Linux system couldn''t
    find user- and group numbers that matched the IDs associated with the file. That
    might happen if you delete a user account but don''t change file ownership.


    The user and the group with file ownership define two of the three levels of permissions
    that can apply to a file or directory. Thus, you can start the process of sharing
    files between users by putting the users in the same group, and then giving that
    group ownership of the file. The third permission applies to every user on the
    system except the owning user and group. This set of accounts is often referred
    to as “world.”


    # Reading Permissions


    There are three levels of permission that apply to files and directories: read,
    write, and execute. Each permission''s effect is shown in Table 14-1.


    Each of these permissions may be separately applied to the owning user account,
    the owning group, and the rest of the world. These permissions are applied and
    reflected in the output of the ls-l command. To return to the Christmas card list,
    recall what the output looked like:


    ```

    -rw-r---- karen karen 10345 May 23 20:05 christmas_cards.txt

