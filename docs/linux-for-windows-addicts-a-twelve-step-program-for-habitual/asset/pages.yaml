    Simply working with the variables that are built in isn''t enough fun, so you
    can set variables of your one using the set command:


    ```

    <!-- set var="$user" value=$REMOTE_USER -->

    ```


    # Configuring CGI


    We''ve already discussed how to enable a CGI directory using the Script Alias
    and May Execute CGI options from within Linuxconf. But I haven''t actually explained
    the rationale for how to go setting up your system for CGI scripting; I''ve only
    touched on the mechanism for doing so. There are three steps to enabling CGI with
    some modicum of security:


    +   1. Point the Script Alias to the directory you will secure for CGI scripts.

    2. Turn off CGI as a default option.

    3. Configure the CGI directory to allow execution of scripts.


    The first step is easily accomplished: simply set the Script Alias option for
    your server or virtual site to point to the directory you have in mind be outside
    the server''s root so so you can further limit access.


    The second step is equally straightforward: just deselect the May Execute CGI
    option from the default or virtual server configuration page, and from any other
    directory you''ve defined.


    The third step requires two substeps. The first is to configure the CGI directory
    (the one you''re pointing to in the Script Alias field). Use Linuxconf to do this,
    and be sure the May Execute CGI option is selected—preferably with no other options
    selected. Doing so will produce an entry in the /etc/httpd/conf/httpd.conf file
    that looks something this:


    ```

    <Directory /home/httpd/cgi-bin>

    Options ExecCgi

    </Directory>

    ```'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# Chapter 11: Step 8: Establish a Web Server


    This is fine, but the second substep is to make sure that you''ve enabled CGI
    scripts with the extensions you actually use. Check the /etc/http/srm.conf for
    the AddHandler line, and make sure it doesn''t allow any CGI extensions than you
    need. You can add an AddHandler to your CGI directory definition in the httpd.conf
    file; it should contain only the extensions you plan to use. For example, if CGI
    scripts use all .pl and .cgi extensions, you could simply add this line:


    ```

    AddHandler cgi-script .cgi .pl

    ```


    # Monitoring Server Status


    The last stop on our whirlwind tour of the Apache web server is some basic server
    monitoring. We''ve already talked about how to find out or not the http daemon
    is running. We can get a little more information from Apache''s logs, and from
    the web-based server status information it provides.


    # Using Log Files


    The log files I mentioned earlier: the Error Log, Transfer Log, Agent Log, and
    Referral Log, are a treasure trove of for administrators who want to know who
    is accessing the system, what they''re accessing, where they''re coming from,
    and what problems they encounter.


    While there are a pretty nice face on the log file (see, for example, http://www.analog.cx/),
    the raw material is that difficult to read. Deciding what is important to notice
    may be another issue. The bottom line is that it''s a good idea to define all
    four types of log files that Linuxconf knows about and to review them periodically
    as you see fit.


    The Error Log is the most important file to review, because it may tell you about
    misconfigurations in httpd, or indicate that users are having some kind of a problem
    you haven''t heard about directly. By default, this file is found at /etc/http/logs/error_log.


    In the example shown here, there don''t appear to be any server configuration
    problems, but Apache warns that the /usr/sbin/sueexec tool will be used to execute
    programs from the web server. There are two errors flagged, indicating that somebody
    was looking for a file that doesn''t exist.


    ```

    Sun Oct 22 04:02:04 2000 [notice] Apache/1.3.9 (Unix) (Red Hat/Linux)

    -- resuming normal operations

    Sun Oct 22 04:02:04 2000 [notice] suEXEC mechanism enabled

    (wrapper: /usr/sbin/sueexec)

    [Thu Oct 26 10:40:15 2000 [error] [client 10.0.2.228] File does not

    exist: /home/http/mlrt/mertg-1.gif

    [Thu Oct 26 10:40:46 2000 [error] [client 10.0.2.228] File does not

    exist: /home/http/mlrt/mertg-1.gif

    ```'
  merge: -1
