    # "dot" Files


    Another strange place is the "dot" file. These are files whose names start with
    a period. Ordinarily, these files are hidden from view. For example, if I list
    the files in a directory named secret:


    ```

    millerm@romans:~ ls secret

    millerm@romans:~

