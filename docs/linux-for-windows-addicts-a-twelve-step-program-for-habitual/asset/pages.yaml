  md: '# # Configure


    While the installation process will vary from application to application, the
    most common step involves some basic configuration. The software’s designers usually
    try to keep things tidy by selecting default options that work for most people,
    but there’s so much variation in the Linux world it’s possible you’ll have to
    tweak some settings.


    Sometimes the configuration step involves running a script; this is often called
    "configure," in a gesture that is both utilitarian and easily understood. Check
    any installation instructions for details, but running a script like this usually
    requires you to tell your shell where the file is located, even if you try to
    run it from the directory which it’s located.


    To return to the bluish HTML editor example, I need to move to the directory when
    I unpacked the archive, and run the **configure** script. (I know this, of course,
    because I read the INSTALL file.)


    ```

    millerm@romans ~ /cd bluefish-0.3.6

    millerm@romans ~ /bluefish-0.3.6> ./configure

    ```


    The “dot-slash” notation tells the shell that the configure file is located in
    the current directory. Once the script has been launched, a variety of system
    checks are performed, and several files are created. We’re done with the configuration
    step.


    # ## Installing Webmin via Tarball


    Although systems use the RPM package manager I could easily install the Webmin
    program available from http://www.webmin.com/, I’d like to mention it as another
    example of a program that can be built. That’s largely because I think it’s an
    excellent tool for system administrators, regardless of how it’s installed.


    In the interests of making things interesting, Webmin doesn’t use a configuration
    script called **configure**. Instead, it uses a script called **setup.sh**. If
    you want to download the latest version of the Webmin package (at that, is Webmin
    0.78), you can follow these steps to run the configuration script:


    ```

    millerm@romans -> cp webmin-0.78.tar.gz /usr/local

    millerm@romans -> cd /usr/local

    millerm@romans -> gzip webmin

    millerm@romans -> tar xvf webmin-0.78.tar

    millerm@romans -> cd webmin-0.78

    millerm@romans -> ./setup.sh

    ```


    This script will ask you a sequence of questions regarding your system, the software
    you have installed, and where that software is installed. Answer to the best of
    your knowledge, and grit your teeth trying to remember why you didn’t want to
    install it as a package. But soon the process will be over, and you don’t have
    to use the **make** command.'
