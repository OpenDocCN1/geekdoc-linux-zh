  md: '# Chapter 8: Step 6: Mingle with Microsoft, Network with Novell


    found at your nearest Samba mirror site, in the directory samba/docs/ntdom_faq/page6.html.


    The share authentication method allows users to access system resources on a share-by-share
    basis. This means that a privileged password, not a user/password combination,
    is used to gain access to each resource.


    Because certain Microsoft operating systems are not very careful about the case
    of passwords, the Password Level field gives to the Linux system (which cares
    very much about the case of the passwords) a lenience in interpreting the password''s
    case. The value in this field represents the maximum number of digits in the Unix
    password that can be capitalized.


    Setting this figure isn''t a real science; on one hand, you want to include enough
    digits to allow for a normal amount of mixed-case digits. On the other hand, if
    you want the passwords to be secure, you must minimize the amount of "play” that''s
    allowed between passwords. If you want more information on this field, what the
    user enters and what correct answer should be check the Linux help file, gives
    some good examples. The Passwd Program field is where you can create a customized
    password entry script. The default value in this field is /bin/passwd %u, which
    runs the standard passwd authentication program for the user who is making the
    connection. It''s certainly possible that you would want to create your own script,
    but I wouldn''t recommend it for now. The default should work well.


    Finally, the Null Passwords Account option allows you to provide or prevent access
    to accounts with null passwords. If you even a little bit about security, dont
    enable this option. If you don''t care about security...well, I wash hands of
    you.


    Access Privileges The Allow and Deny Hosts fields allow you to enter lists or
    groups of hosts that are specifically allowed or denied access to the system.
    Enter a single hostname, or a list separated by commas. Enter an IP address, a
    network work number, or (e.g., “10.0.”). Use the argument EXCEPT to indicate one
    or more addresses from the specified range that should be excluded from the allow
    or deny rule.


    If you leave these blank, the system''s default behavior is to allow access from
    anywhere (subject to authentication as you configured in the Passwords section,
    of course). If there overlap between the two fields, the tie goes to the Allow
    Hosts rule. Uncle Samba is apparently softared.


    Network Settings The OS level controls the priority of the Samba server with respect
    to network browsing. If you use Microsoft systems on your network to remain the
    browsing masters, you can leave this option set to 0. If you want the Samba system
    to become the master browser, you can increase this priority to 33 or higher,
    which should give the Samba system priority. The Samba documentation suggests
    setting this value to 65 if you want to ensure that it''s your master browser.


    If you want your Samba system to be the local master browser, enable the Preferred
    Master option. If you want the Samba system to be the master browser for the whole
    domain, enable the Domain Master option. Be sure you coordinate this setting with
    the'
