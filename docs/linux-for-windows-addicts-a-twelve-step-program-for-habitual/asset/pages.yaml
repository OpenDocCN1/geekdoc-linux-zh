  md: '# Linux for Windows Addicts: A 12-Step Program


    In case you''re wondering, the smbd process is the part of Samba that serves up
    resources, while the mbnd process provides NetBIOS name services from the Samba
    server. You can check their man pages for more information about each, but we''ll
    be manipulating them indirectly, using the smb wrapper program found in /etc/rc/init.d/


    To get a Samba server running, you will use the memb script to start things up:


    ```

    root@rom ~ /etc/rc.d/init.d/smb start

    ```


    You should get good news from your server in response:


    +   - Starting SMB services [OK]

    - Starting NMB services [OK]


    If you want to shut down the Samba server, you''ll issue the same command, replacing
    the start with stop. And to restart the server—perhaps because you manually edited
    the smb.conf file and the changes to be reflected in the way your server is running—you
    can issue the samb restart command which stops the processes and then starts them
    again.


    To ensure that the Samba server is started you reboot the Linux system, using
    the /usr/sbin/ntysys tool is a full-screen text tool that shows the services available
    on your system and allows you to select the ones that will be started at boot
    time. This is a convenient way of ensuring that the startup files are properly
    synced. Figure 9-4 shows that the samb service is indeed enabled at startup on
    my Samba server.


    # Troubleshoot Samba


    While there''s not enough room in this book to give you a full explanation of
    how to troubleshoot any of the services we''ll be discussing, the Samba service
    is vital to Linux administrators with a Windows client and server legacy. So allow
    me to point to the documentation on the Samba web site. As I write this, there
    is a Samba diagnosis tool available for your use; go to the Samba mirror nearest,
    follow the Documentation link, and from the Other Documentation section of the
    page, find the Diagnosing Samba link.


    But because most of my problems have been solved in just a few steps, I''ll give
    you a quick rundown on few of them here. If they''re not enough to locate and
    solve your problem, do try the web site, which includes information on how to
    use some of the Samba utilities I''ve mentioned.


    # First: Check the smb.conf file for Errors


    Although the Linuxconf interface will detect certain errors when you attempt to
    enter incorrect settings, it''s a good idea to check the smb.conf file to make
    sure that it''s doing what you think it''s doing. And while you''re checking,
    you might make some changes by hand.'
