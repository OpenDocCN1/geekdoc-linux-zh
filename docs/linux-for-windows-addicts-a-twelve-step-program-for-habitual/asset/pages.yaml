  md: '# Linux for Windows Addicts: A 12-Step Program


    We are now ready to take the first step toward freedom from our Microsoft addiction.
    We do so by admitting that we are powerless over Microsoft unless we install Linux.


    Now we''re down to brass tacks, as people used to say back in the days when you
    could find brass tacks. We''ll be installing two different distributions of Linux
    in two different situations. In both cases, we''ll perform the installation on
    a computer that''s already running Windows. In both examples, I assume we want
    to keep Windows loaded (I wouldn''t want my investment in Microsoft products reduced
    to shelfware, and maybe you''re not ready to make a clean break yet).


    In the first case, we''ll do an installation of Linux to the existing Windows
    partition. While this makes Linux run noticeably slower than it should. In the
    second case, we''ll perform the installation on a partition-adjusting program
    that comes bundled with some versions of Linux.


    The method that is right for you depends a little on the hardware you have available,
    as well as how much you''ll want to use Windows and Linux on your system. In my
    opinion, if you''re willing to install an additional hard disk in your system
    to accommodate Linux, you''ll have the easiest installation experience. The software
    installation will be very similar to what we do here, but you''ll be able to skip
    some of the steps required to squeeze Linux onto a disk already full of Windows.


    But before we begin loading the software itself, let''s get our bearings, shall
    we? It''s a good idea to collect a few pieces of information from our systems
    before we start mucking around too much. And naturally, we want to be sure we''re
    as ready as possible in case something goes wrong.


