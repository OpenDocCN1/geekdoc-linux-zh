  md: '# at Commands


    The **at** commands are used to schedule a task or a set of tasks for some point
    in the future.

    Details of your options for specifying the time of execution can be gotten from
    the man page, but I''d like to illustrate the flexibility of the tool with this
    example:


    ```

    millerm@romans -> -f mysql_tidy.sh teatime

    ```


    This statement causes the system to launch the mysql_tidy.sh script at 4:00 in
    the afternoon. Isn''t that cute? You can specify the time in a variety of ways,
    including this one:


    ```

    millerm@romans -> -f sync_time.sh now + 15 minutes

    ```


    As an administrator, you can limit access to the **at** command using the /etc/at.allow
    and /etc/at.deny files; placing an account name in the allow file gives user permission
    to use the **at** command, while placing the name in the at.deny file prevents
    the user from executing **at** commands.


    It''s also possible to manage the **at** command queue, using the **atq** and
    **atrm** commands. If you run **atq**, you can see the contents of the **at**
    command queue, which might look like this:


    ```

    millerm@romans -> atq

    1  2000-05-30  14:25 a

    2  2000-05-30  14:30 a

    ```


    The first column indicates the job number. The second is the execution date, and
    the third is the execution time. The fourth column shows the queue used; unless
    you specify a different queue, the **at** command defaults to the “a” queue.


    To remove one of those jobs from the queue before it''s executed, you can use
    the atm command; just specify the job number you want to cancel, as shown here:


    ```

    millerm@romans -> atrm 2

    ```


    A slight variation on the **at** command is the **batch** command. Instead of
    putting the job off until a specified time, this tool executes the job when the
    load on the system is low enough. The default load value should work fine, you
    can designate your own threshold level. This is great for big processing or housekeeping
    tasks that need to be done but shouldn''t slow down other tasks.


    # Cron Jobs


    If you want to schedule a job to run more than once, the **at** command isn''t
    much good. Fortunately, the cron daemon exists to perform these very tasks. The
    cron daemon (there are others in use, but this seems to be the most common cron
    tool) becomes active every minute, checking for scheduled jobs in various locations,
    launching any scheduled to be executed at the current time, and then dozing again.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    While different distributions have somewhat different implementations of the cron
    deat, I like what Red Hat and others do\u2019 a master file called /etc/crontab.
    Rather than having you edit the file to add scripts as you need them, this approach
    makes the /etc/crontab contents run the scripts in several directories at different
    intervals.


    The lines below are partial contents of the /etc/crontab on my system (which I
    \u2019d edited with the remainder of what each column means):


    ```

    # Min Hr Day-of-month Day-of-wk run-by-command

    01 * * * run-parts /etc/cron.hourly

    02 4 * * run-parts /etc/cron.daily

    22 4 * 0 run-parts /etc/cron.weekly

    42 4 1 * * run-parts /etc/cron.monthly

    ```


    The first non-line command runs the run-parts/etc/cron.hourly command at one past
    hour each morning. The next line runs the run-parts/etc/cron.daily command at
    4:02 morning every Sunday. The next line runs the run-parts/etc/cron.weekly command
    at 4:22 in the morning on the first day of each month.


    As you might guess, the /usr/bin/run-parts command runs the executables in a given
    directory, or if you want to run a particular program or script every day, you
    can just drop a copy in the /etc/cron.daily directory, and the daemon will faithfully
    execute it every day.


    Root and other users can also create their crontab files using the crontab command.
    Running crontab \u2019brings the user''s existing crontab file, if any, in a text
    editor. If there\u2019s not already a crontab file for the user, a new one is
    created. You can specify your own intervals in this file, which is saved to /var/spool/cron/crontabs;
    the filename is set to be the originating user''s account name.


