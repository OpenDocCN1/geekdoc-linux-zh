  md: '# Linux for Windows Addicts: A 12-Step Program


    ![](img/dcd0086266143e7048be2fb5e68a2391_279_0.png)


    In the SLIP version, the special group for these users is known as slipusers,
    and the default command interpreter is /sbin/login. This special shell performs
    the configuration of the mode and interfaces that a SLIP connection will be established.


    There is a configuration file known as /etc/slip/slip/slip.hosts that gives you
    control over the addresses assigned to the login names used on your system, providing
    a layer of security for the SLIP connection.


    # UUCP Accounts


    Unix-to-Unix Copy (UUCP) is a method of providing basic dialup network functionality.
    You''re most likely to run into the Taylor UUCP implementation, which is described
    in some detail in the UUCP-HOWTO. The Linuxconf for creating UUCP users is similar
    to the one used for normal accounts, PPP accounts, and SLIP accounts.'
