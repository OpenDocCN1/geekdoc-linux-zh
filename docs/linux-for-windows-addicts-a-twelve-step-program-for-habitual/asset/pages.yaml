  md: '# Chapter 3: New OS, New Freedoms, New Concepts


    71


    # # PROCESSES AND REDIRECTION


    Whether you use Windows or Linux, your operating system is capable of handling
    more than one “process” at a time. For example, if you open the Task Manager in
    Windows, you can see the applications you have open. Underlying these applications
    are often many different processes performing different tasks: Fetching input
    from your keyboard; performing calculations; placing images on your screen.


    When you use Linux, you have far more control over each of these processes (whether
    you want to control or not entirely up to you and your computer). You can create,
    reprioritize, and remove processes on your system, and you can redirect output
    from usual process to another process.


    # ## Processes


    Let’s talk about process control first. If you’re using Linux with X Windows and
    a window manager, there are several processes running before you start an application.
    There’s the shell you logged into, X Windows, the window manager, any applets
    that run on the window manager’s desktop, plus any other programs you’re running
    in the background, such as web servers, mail programs, and scheduled jobs.


    # ## Foreground


    I mentioned processes running in the background, but before I explain more about
    them, I should mention programs running in the foreground. A program running in
    the foreground is ready to accept user input or update the display on the screen,
    so interactive programs like word processors run best in the foreground. The bash,
    tcsh, and zsh shells provide all a command, fg, to bring a process from the background
    to the foreground.


    # ## Background


    A background process is one that is not waiting for something else to happen.
    For example, when users want to use my company’s software to automate complicated
    IC layout, they can issue a command to tell the computer to free up the layout,
    and that job runs in the background, they can check mail, browse the web, or even
    play a game. Any of those foreground tasks while the background is running will
    make the layout automation slower, but it will continue until it is finished.


    # ## kill


    If you can create a process by running a program, how do you remove that process?
    Naturally, you kill it. If you decide that a process has locked up, or if you
    need to free up more computer power and want to weed out unnecessary processes,
    you can use the kill command to kill some or all of them. Ordinary users can use
    the kill command to weed out their own processes, while root can kill anybody’s
    processes. So use this with extreme caution, for crying out loud.'
