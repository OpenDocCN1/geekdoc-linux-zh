  md: '# 12 Questions to Decide: Is Linux for You?


    It''s widely understood that the preliminary step to overcoming an addiction is
    real-nizing that you have an addiction. In this vein, I''d like to ask 12 questions
    to help you determine your addiction status:


    +   1. Have you ever gotten your Windows PC running smoothly, but it still only
    stayed up for a couple of days?


    Many of us who use Linux used to make promises to keep our Windows systems running,
    but could not keep them. Then we turned to Linux, relaxing: If you do not run
    Windows today, Windows cannot crash today.


    +   2. Do you wish people would mind their own business about your operating system
    and stop telling you which one to use?


    We use Linux do not tell anyone to use Linux. Well, many of us, actually. But
    we also talked about our own use of Windows, the trouble we got into, and then
    we switched to it. If you''re interested, we can tell you more.


    +   3. Have you ever switched from one version of Windows to another, hoping this
    would keep you from experiencing problems?


    Many who use Linux have tried every version of Windows. We used the version 1.0
    runtime. We used Windows 3.0, Windows for Workgroups, Windows NT, Windows 95,
    Windows CE, Windows 98, and Windows 2000. But if we used any computer with Windows
    on it, we usually crashed eventually.


    +   4. Have you had to restore data or recreate it because of a system crash during
    the past year?


    Do you save your documents every thirty seconds or restart your machine on a regular
    basis? This is a pretty sure sign that your Windows use is problematic.


    +   5. Do you envy people who use Windows without having problems?


    At one time or another, most of us who use Linux wondered why most people tolerate
    the expense and lack of innovation of the Windows OS.


    +   6. Have you had problems connected with Windows applications during the past
    year?


    Many analysts say that problems with Windows will only get worse—never better.
    Eventually, it will collapse under its own weight, or be dismantled by the courts.
    The only hope is to use another operating system.'
