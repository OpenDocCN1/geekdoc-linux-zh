    made everything worse. It solved remarkably few of our problems.

    n8. Do you ever try to get “extra” performance out of your system with expensive
    upgrades because it''s not powerful enough?


    Most of us seemed to update our hardware with every revision of the processor,
    video board, and disk, hoping to compensate for the bloat in our operating system.
    Now even older systems functions wisely.

    9. Do you tell yourself you can stop using Windows any time you want to, even
    though you keep buying expensive applications and upgrades?


    Many of us killed ourselves into thinking that we upgraded our Windows software
    because we wanted to. After starting using Linux, we found out once we started
    to buy Windows-based products, it’s difficult to stop.

    10. Have you missed days of work or school because of Windows?


    Many of us now admit that when we claimed our dogs or spouses had eaten our work,
    the truth was that a system crash had trashed our data.

    11. Do you have “Blue Screens of Death?” Or black ones?


    These are signs that your operating system isn''t adequately protected from its
    own operation and the behavior of its applications. When we started to use Linux,
    we found out that this is not inherent to our operating systems, and we didn''t
    want to be black and blue anymore.

    12. Have you ever felt that your life would be better if you did not use Windows?


    Many of us started to use Windows because it seemed to make us more efficient
    and because it seemed easy, at least for a while. Until we started using Linux,
    though, felt trapped by expensive applications, frequent upgrades, incompatibility,
    proprietary protocols and interfaces, and lack of customization.'
