  md: '# Chapter 5: Step 2: Configure X


    rectory called /usr/X11, you can locate it by entering which startx from the console
    or from an xterm.


    One common place for doing individualized X Windows configuration is the .xinitrc
    file found in each user''s home directory. This filename starts with a period,
    it is normally hidden, so you''ll have to use -a in your home directory to see
    the file. The file, if it exists, can specify keyboard mappings, windows to open
    when X starts, and similar configuration information.


    Some desktop managers, notably KDE and GNOME, have their own configuration directories.
    Look for these in your home directory; they are also hidden because they start
    with periods: .kde and .gnome.


    # IOT STARTING X


    If you start X automatically when your computer boots up, you don''t have to worry
    about using the startx command, you''ll automatically get a graphical login screen
    and be taken immediately into X Windows when you log in. That''s fine in most
    cases, but there are times you might want to start at the console prompt. For
    example, if you change your video card, you''ll have to reconfigure X. Your new
    card probably won''t be compatible with your old Windows configuration, so you
    might have to start up in a non-graphical mode to configure.


    Personally, I prefer to start in non-graphical mode because I want to do some
    work from the console prompt and don''t need X open. If I''m configuring a new
    system, example I usually rebuild the kernel to suit my needs, and then reboot.
    I don''t need X up to do the kernel rebuild (though you can rebuild it from X,
    I''ll show you how in Chapter 6), and I don''t want to wait for X to load and
    unload.


    If you decide you don''t want to start in X, you can tell it not to stop. Check
    your distribution''s documentation for specific information on how to do this,
    but here''s a common method:


    +   1. Using a text editor, open /etc/initab.

    2. Locate the line that says id:5:initdefault:.

    3. Change the line to read id:3:initdefault: (change the 5 to 3)

    4. Save the file.


    After your system reboots, it will not immediately start X Windows. For those
    who care, that''s because we''ve changed the runlevel from 5 (multiuser-capable
    with X Windows) to 3 (multiuser capable in console mode). Easy, huh?


