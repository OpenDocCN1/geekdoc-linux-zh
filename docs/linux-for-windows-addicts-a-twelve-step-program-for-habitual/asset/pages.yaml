  md: '# Chapter 8: Step 5: Manage Users and Groups


    a user account and the files in its home directory. You get to decide what you
    want to do in these situations, and you can write a shell script to perform whatever
    tasks you think necessary.


    # Account Management Defaults


    For systems with password-shadowing enabled, which you should, the default account
    management settings can be configured in this area. These options are similar
    to the ones you can set on a user-by-user basis, but apply to each user who doesn''t
    have another value specified.


    The Must Keep # Days options set the amount of time user must keep a password
    before it is changed. The Change After # Days is the number to set if you require
    users to change their passwords regularly (that is, if you prefer to them the
    password down rather than keep for eight years (the one they remember). The Warn
    # Before Expiration setting tells the system to warn the user some number of days
    before account is due. Account Expire # Days accounts accounts to expire a set
    days after their creation, with the Standard Account Duration option designates
    a default expiration date for all accounts. Unfortunately, that last option is
    expressed in days after January 1, 1970, so it''s not easy to read at a glance.
    These settings are stored in /etc/conf.linuxconf.


    # Setting Default Shells


    The Available User Shells option allows you to add or subtract from the list of
    shells available for users. The Linuxconf front end modifies the list of accepted
    shells found in /etc /shells, so if you want to narrow the list of possibilities,
    or expand it to include a great new shell, you can do that here or by editing
    that file directly.


    # Message of the Day


    This simple option allows you to designate a message to be displayed to each user
    when they log into the Linux system. Whether you''re announcing scheduled downtime,
    a company potluck, or someone''s headlights are on, this can be useful from time
    to time. This message is found in the /etc/motd file, which you can edit directly
    or programmatically if you prefer.'
