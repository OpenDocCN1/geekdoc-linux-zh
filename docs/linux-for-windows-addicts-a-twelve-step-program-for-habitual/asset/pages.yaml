- img_proc: true
  md: '# Chapter 6: Step 3: Compile a Kernel


    because it allows interprocess networking—communications between applications
    on the same machine.


    Everyone should enable the TCP/IP Networking option, which gives you access to
    TCP/IP networking on the Linux system and is used by some applications to communicate
    with the local host. In other words, there''s not much reason *not* to enable
    this option. There are several additional options that become available when you
    enable TCP/IP.


    Multicasting is a type of networking used to make communications from one-to-many
    or many-to-many computers more efficient. While standard unicast networking sends
    data from one network node to another, multicast sends the data from a network
    node to several specified addresses, meaning the data doesn''t have to be resent
    to each recipient. This reduces the amount of network traffic required to get
    the data to all destinations.


    This is useful for functions such as video broadcasting over the network, stock
    quote updates, and use of the IP Backbone (MBONE), which uses the Internet for
    distribution of multicast. Most people don''t need this functionality, so disable
    IP: Multicasting unless you''ve got a use in mind.


    IP: Advanced Router is a parent option that allows configuration of several sub-options
    related to a Linux system as a router. If you''re building a kernel for a system
    you intend to route data between multiple networks, enable the option to get access
    to the child options. Otherwise, leave it disabled.


    Enable the IP: Policy Routing to allow a Linux-based router computer to be able
    to use routing rules based on the source address. Unless you enable this option,
    the router will only use the destination address when determining how to route
    any given packet. If you''ll be running this kernel on a router, enable the option.
    Otherwise, don''t bother.


    The IP: Equal Cost Multipath option allows you to set up more complicated routing
    rules. Unless you enable this option, when a packet is routed, there''s only one
    path it can take to its destination. If you enable this option, you can allow
    multiple paths to the same destination. These paths have equal cost, which is
    to say that none of them is automatically preferred over the others. Unless you
    know you''ll need this, disable this option.


    If you enable IP: TOS Value As Routing Key, the type of service (TOS) values associated
    with IP packets can be used to determine the route each packet will take. This
    allows you to select different types of networks to carry data with different
    needs, as specified by each packet''s TOS information. Unless you know you''ll
    need this, disable this option.


    If you enabled the advanced router, you should also enable IP: Verbose Route Monitoring,
    which provides detailed routing log messages. This is one of identifying properly
    configured machines on the network or illicit attempts to gain access to your
    network.'
