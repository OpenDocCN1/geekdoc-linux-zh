  md: '# Linux for Windows Addicts: A 12-Step Program


    # more


    If you''ve got more than one screen of information in one file, the **cat** command
    will frustrate you by scrolling the beginning of the file off screen before you
    read it. Enter **more** command, which also displays the contents of a file, but
    it displays the contents one screen at a time. You press the SPACEBAR when you''re
    ready to continue with the next screen of information. This can continue until
    you''ve finished reading the file or you press the **q** key to quit early.


    # less


    Okay, let''s say you''ve happily scrolling through a README file using the **more**
    command, but that you use the SPACEBAR one time too. Or let''s say your memory
    is as bad as mine, and you immediately forgot what you read on the last screen.
    When you think you can''t take “more,” you get to use “less.”


    Less works the same way **more** does, but it allows you to scroll forward or
    backward through the file and offers more controls. For example, while **more**
    limits you to using the spacbar to page one screen ahead, **less** allows you
    to page using the SPACEBAR or scroll up and down using the arrow keys and PAGE
    UP/PAGE DOWN keys. You can quit **less** by pressing the **q** key, just as you
    do with **more**.


    # head


    But perhaps you don''t want to see the whole file at all. Maybe you just want
    to glance at the beginning of a file to see what it contains. The **head** command
    accomplishes this task. When you run **head** on a file, it displays the first
    part of the file on the screen.


    # tail


    Not to leave out those who only want to see the end of a file, Linux includes
    the **tail** command, which displays only the last few lines. This can be useful
    with log files, which often store the most recent information at the end.


    # lpr


    The **lpr** command is used to send the contents of a file to a printer. Depending
    on how the printer is configured in Linux, it may be able to tell the difference
    between a text file and a formatted file (Postscript, for example). We''ll visit
    printing significantly more detail in Chapter 8.


    # grep


    Given the ease of use of search tools available with desktop managers such as
    GNOME and KDE, you may never need to use the command to search for text within
    a file. But if you do, you''ll use **grep**. **grep** can find all instance of
    any given string of characters within the files or directories you specify.'
