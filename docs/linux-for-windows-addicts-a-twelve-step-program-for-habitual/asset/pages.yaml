  md: '# Linux for Windows Addicts: A 12-Step Program


    In the previous chapter, we did some Web server configuration and management.
    Now, those are pretty fun tasks. But when you set up a Web site, what happens?
    That''s right, you need a place to put the spam that starts arriving. So in this
    chapter, we''ll begin Step 9: Contact others via email.


    The subject of email on Linux is an immense one; for example, the massive O''Reilly
    tome, Sendmail, Second Edition, exceeds 1000 pages. But I also want to mention
    some other tools people use for managing their mail, as well as end-user tools
    for reading and editing mail. So break out your jogging shoes, and let''s get
    rolling!


    # CONFIGURING SENDMAIL


    Sendmail handles the majority of the world''s electronic mail. In its fullness,
    it is a vast, complicated system. But if you''re looking for basic mail handling
    functionality, it''s not difficult to get things up properly. And Linuxconf makes
    configuring your mail domains and users a straightforward, GUI-based process.
    Of course, if you''re looking for more information, that''s available as well,
    including a file document on configuring sendmail on Red Hat: http://www.redhat.com/support/docs/howto/RH-sendmail-HOWTO/book1.html.


    # Mail Domain Configuration


    To begin configuring your mail system, start Linuxconf and navigate to the Mail
    Delivery System (System) option from the Config-Networking-Server Tasks tree.
    This brings up a menu of sendmail options, including these configuration items:


    +   - Basic information

    - Special (domain) routing

    - Masquerading rules

    - Mail to fax gateway

    - Virtual email domain


    I''ll not include options that you can safely ignore. Check out Bryan Costales''
    Sendmail, Second Edition, if you''re looking for more information about sendmail
    configuration than you find here.


    # Basic Information


    Configure basic mail system settings from the Basic Information option, which
    includes basic mail connection information, messaging and DNS features, miscellaneous
    settings, and domain aliases.


    Present Your System As Ordinarily, mail coming from a user on a system will be
    addressed as user@machine.domain; for example, you might get mail from'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'mjm@romans.msaddicts.com. But most of us prefer that the mail appears to be
    coming from the domain, without a machine specified. In this field, enter the
    domain name as you want it to appear on outgoing messages.


    **Accept Email For** Enabling this option allows your sendmail server to accept
    mail''s addressed to this machine name and mail addressed to its domain name.
    Whether you sent mail to mjm@romans.msaddicts.com or to mjm@msaddicts.com, if
    romans is accepting mail for the domain, it''ll receive (and hopefully) both.


    **Mail Server/Gateway** Enter the name of the server that will store the mail
    for your organization in the Mail Server field, and the name of the server responsible
    for forwarding mail to the rest of the network or the rest of the world. These
    may be the same system (they may even be the system you''re configuring).


    **Mail Gateway Protocol** You''ll have to decide which protocol is used to connect
    the system you''re configuring with your network''s mail gateway. The default
    is SMTP, which is pretty common (and makes a fine default), but if you know an
    unusual connection, one of the other choices may be more appropriate for your
    situation:


    +   - esmtp Enhanced ESMTP

    - esmtprem ESMTP (on demand links)

    - uuc-dom Recommended modern UUCP

    - uucp Old UUCP


    **Enable Relay Control (Spammers)** This option enables a set of rules intended
    to prevent spam mailers using the sendmail software to forward their mail from
    your system. You want to do what you can avoid letting your mail servers become
    "open relays" for undesirable uses. Not only can the load bog your server, it
    involves you in the despicable practice of wasting people'' time and money with
    unsolicited commercial email they don''t want.


    **Messages Size Limit** If you don''t want your users to be swapping QuickTime
    videos with their friends and family, you can set a limit on the size of messages
    that goes through the sendmail server. Of course, not being able to receive large
    useless files also implies not being able to receive large useful files as well,
    but you might want to set a limit anyway.


    **Process Queue Every** How often do you want the mail to run through the mail
    queue? I like the default value of 1 minute, which gives snappy service from a
    dedicated mail server. If you''re trying to use the system for other things, though,
    or using an on-demand command, you might want to space things out a little more.


    **Use Special Shell smrh** The sendmail restricted shell (smrh) is an alternate
    shell that the mail system can use to reduce the risk of attacks during mail delivery.
    It restricts the commands that may be executed and how many commands can be executed
    during delivery.'
