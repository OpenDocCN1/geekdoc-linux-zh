  md: '# Linux for Windows Addicts: A 12-Step Program


    ![](img/dcd0086266143e7048be2fb5e68a2391_25_0.png)


    > ### How Now GNU/Linux?

    >

    > Some people refer to Linux as GNU/Linux. This doesn\u2019 have much to do with
    antelopes, but instead with the GNU Project, a longstanding effort to create a
    Unix-compatible operating system that can be freely run, redistributed, and improved.
    In this way of thinking, Linux is the kernel (the core of the operating system)
    that handles things like reading files, managing memory, and sending instructions
    to the CPU) for an operating system that''s mostly GNU software.

    > > It''s true that the GNU Project has generated many of the vital pieces of
    the puzzle that makes up Linux as we know it. It''s also true that many of the
    puzzle pieces outside the Linux kernel are not GNU software. I''ll continue to
    use the term Linux to refer to the organism as it exists now, influenced as it
    has by GNU. If you want to call it GNU/Linux, that''s okay with me---not I expect
    you to seek my approval anyway! For more GNU news, see the GNU Project''s web
    site (http://www.gnu.org).


    # Collaboratively Developed


    There\u2019s no monolithic corporate structure involved. There are politics, because
    there''s not a marketing plan or a sales force involved in the development of
    the core Linux software, all disagreements can be debated and resolved using the
    best technical solution. At this point, final decisions are the responsibility
    of Linus Torvalds, the creator of Linux, which creates a potential single point
    of failure but also provides some consistency.


    # Unix-Like


    Being a Unix-compatible operating system is considered advantageous and disadvantageous
    by different groups of people. It might seem like a disadvantage to you if you''re
    like I before using Linux\unfamiliar with Unix commands, uncomfortable with command-line
    tools, and unsure that such an ancient operating system could compete with the
    familiar Windows and Mac OS interfaces I was accustomed to. For the record, I
    was wrong.'
