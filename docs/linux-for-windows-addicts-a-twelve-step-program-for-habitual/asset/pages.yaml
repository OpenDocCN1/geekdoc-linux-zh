    monitoring ports used for failure warnings and the kernel. Can support this feature
    if your hardware uses it. Otherwise, disable this option. Setting the The Bell
    Technologies HUB8 card isn''t brain surgery: If you have one of these Bell Technologies
    cards, enable the option. If you don''t, disable the option.


