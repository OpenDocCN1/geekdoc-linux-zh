    # Configuring LILO Defaults


    As Figure 6-5, the LILO options that would ordinarily have to be typed into /etc/lilo.config
    are available with online help, drop-down lists, radio buttons, and other graphical
    crutches. This makes linuxconf an especially useful tool for the Linux administrator,
    since it gives you an idea of what your options are.


    The Base options tab shown in Figure 6-5 allows you to enable or disable LILO
    as the system''s boot loader (the LILO Is Used To Boot This System). You can indicate
    where LILO should install the boot sector, which in Figure 6-5 is set to the MBR
    on the first IDE hard disk, /dev/hda.


    The Compact boot mode is set to reduce boot time, but I''ve never bothered to
    use it. The Linear boot table encoding setting, on the other hand, is useful for
    large SCSI devices, and I''ve had good results using it with large IDE drives
    as well.


    You can set the boot delay if you want to configure a wait time before LILO starts
    booting, which I''ve never found particularly useful. Check the radio button to
    cause the LILO boot: to prompt (by the way, in Figure 6-5, the Compact and Linear
    buttons are deselected and the Present LILO boot prompt is selected; Windows users
    sometimes have trouble telling which is supposed to be)


    The timeout is the duration the LILO boot: prompt is displayed before the system
    is booted with the default kernel, and the entry in the optional Message File
    box should point to a text file to display a message at boot time.'
