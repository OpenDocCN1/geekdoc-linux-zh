  md: '# Chapter 8: Step 6: Mingle with Microsoft, Network with Novell


    # Setting Defaults


    If you select Defaults from the Samba File Server option, you''ll be presented
    with a set of basic server configuration information. These options include basic
    configuration information, password policies, access rules, network settings,
    account utilities, and other features.


    Base Configuration Your first decision is whether you wish to make the Linux passwords
    or the SMB passwords the primary list. Choose Synchronize SMB From Linux Pass
    if you want the passwords maintained using /etc/passwd, or the Synchronize Linux
    From SMB Pass option if you prefer to have the primary password resource be /etc/smbpasswd.
    Of course, you can select both options to have the passwords synchronize no matter
    where they''re changed.


    The next configuration step is to enter the server description that appears in
    the domain or group''s list of hosts. You can enter a static text string, or you
    can also include some of the variables supported by Samba—the %h option to give
    the hostname and the %v option to give the Samba version number seem the most
    useful. Figure 9-3 shows the result of entering the following line as the server
    description string on the system named proton:


    Linux Samba Server %v on %h


    ![](img/dcd0086266143e7048be2fb5e68a2391_292_0.png)


    Figure 9-3. Linux or Windows? They may only know if you tell them'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Stop Program


    The next field in the Linuxconf configuration is the workgroup to which the system
    will belong. If you will be connecting your Linux system to an NT or Windows 2000
    domain, you can specify the domain name in this field instead of a workgroup.


    The Netbios name and Netbios Aliases are optional entries. The NetBIOS name of
    your Samba-equipped Linux system defaults to the hostname, but if you need to
    make it different, you may do so here. If you wish to create virtual NetBIOS hosts,
    you can add the system''s aliases in the appropriate field.


    Password Settings The password settings control the way in which users are authenticated
    when you try to access the Samba system. If you enable the Encrypted Password
    Required option, client systems must pass encrypted passwords to be able to access
    the system. This is for Windows 98, fully Service-Packed Windows NT 4.0, and Windows
    2000 systems, which default to encrypted passwords. You''ll have to enable password
    encryption on any Windows 95 systems that need to access the Samba server if you
    enable this option.


    The Authentication Mode option allows you to select the authentication method
    from a list of choices:


    +   - User

    - Server

    - Domain

    - Share


    The user authentication method, which is the default, requires each user who wishes
    to access the Samba system to have an active account on the system and enter the
    correct password for that account.


    The server authentication method seems the same to the user, but instead of the
    Linux system doing the password authentication, it points to another server to
    perform this function. If you select this option, enter the NetBIOS name of one
    or more NT servers you trust for this task in the Password Server field.


    The domain authentication method also points to another system to perform authentication,
    but instead of being another server, it''s domain controller. This involves making
    sure the Password Server field is set to the NetBIOS name of the primary domain
    controller (PDC), making sure the Workgroup field contains the domain name, and
    starting Samba as described in the "Run Samba" section that follows.


    Once the Linux box is running Samba, you''ll have to tell it to join the NT domain
    by using smbpasswd command with the -j option; in the next example, the system
    is attempting to join a domain known as PROLIFIC:


    ```

    smbpasswd -j PROLIFIC

    ```


    Once your system has joined the domain, you''ll have to be sure to add user accounts
    for each domain user who wants to access resources on the Samba server. More information
    on this configuration, and links to tools that help creating these accounts, can
    be


