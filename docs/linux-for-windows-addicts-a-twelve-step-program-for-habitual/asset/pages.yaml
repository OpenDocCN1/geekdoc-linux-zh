    # Mount


    While Windows is moving away from strictly using them, as a general rule, drives
    have letters associated with them. Every Windows user knows that A: and B: always
    refer to floppy drives, and that C: is likely to be a hard disk, and that D: is
    sometimes a CD-ROM drive. These ideas are leftover from the DOS era and have been
    retained in Windows alongside references to machines, shares, and folders.


    Linux uses a different naming mechanism. In the Linux world, drives are addressed
    by their device names or their mount points. Don''t panic if that sounds meaningless.
    First, it is that under Linux, all devices are represented by a particular filename
    (the device name). For example, my floppy drive is known as /dev/fd0. Second can
    be accessed using another filename, and that is the mount point. For example,
    my floppy drive is mounted as /fd0. Other people might mount it to /floppy or
    /mnt/floppy (which is probably the best choice), whichever they choose be their
    mount point.


    Linux manipulates the drive using its device name, but in most cases, users must
    access the drive using its mount point. This means the “drive” is known to the
    operating system as /dev/fd0, but when a user wants to see the contents of a particular
    floppy “diskette,” the device must be mounted, and the contents are viewed and
    manipulated from that mount point.


    Another example would be a hard disk. The device name of the first SCSI hard drive
    on a system is /dev/sda. That hard disk is often divided into several logical
    partitions to separate different types of files. The first partition on the first
    SCSI hard drive is known as /dev/sda1. If you decide to put home directories on
    that partition, it''s mount point would be /home. All three locations exist: /dev/sda,
    /dev/sda1, and /home. The users would access the data on that partition using
    the mount point /home.


    Using a common filesystem structure to deal with devices and their contents is
    subtly powerful. It gives Linux administrators a consistent way of accessing devices
    on the system without having to use clumsy front ends. The distinction between
    devices and content will become particularly important during the installation
    process when you''re trying to figure out what mount points to use, and what disk
    partitions to access from each one. If you''re not sure about the subject now,
    dealing with the specific examples in Chapter 4 should help you understand better
    how to partition and mount a drive.'
