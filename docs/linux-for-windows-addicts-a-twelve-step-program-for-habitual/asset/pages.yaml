- img_proc: true
  md: '# qmail


    The qmail package is preferred to sendmail by many administrators, who feel its
    ease of configuration and security make it clearly superior to sendmail. I don''t
    feel at all strongly about qmail''s superiority in those areas, and I''m inclined
    to think that you''re best off using the package that came preinstalled with your
    distribution. However, you should investigate qmail if you expect to be managing
    mail and think sendmail''s myriad options aren''t worth the trouble, given that
    many of those options aren''t accessible through Linuxconf. The primary qmail
    web site is at http://cr.yp.to/qmail.html.


    # exim


    While qmail''s primary strength is considered its security, exim is supposed to
    be easier to configure than either sendmail or qmail. Remembering that the mail
    system''s already installed on your system gives you an advantage, you still might
    want to investigate exim if you''re considering doing more hands-on configuration
    of your mail system. Its primary web site is http://www.exim.org.


    # Postfix


    Postfix aims to be a competitor to qmail and is said to be faster than both qmail
    and sendmail (though unless you''re handling large volumes of mail, performance
    shouldn''t be a major issue). Consult the Postfix web site at http://www.postfix.org/
    for more information.


    # snail


    This program is pretty much the granddaddy of sendmail''s rivals. While it''s
    easier to configure, it also offers fewer options and less scalability. Time appears
    to have passed mail by, if you''re interested, exim might be a reasonable substitute.
    It isn''t a central mail web site, but there is an ftp site at ftp://ftp.planix.com/pub/Snail.


    # OpenMail


    One of these tools is not like the others, and it is Hewlett-Packard''s OpenMail.
    This package allows you to support PC client packages such as Microsoft Exchange
    and Lotus cc:Mail, running all the while on a Linux platform. HP offers a free
    trial period for this tool, but it''s still commercial software. Read more about
    it at its main page: http://www.ice.hp.com/cyc/om/00/index.html.'
  merge: -1
