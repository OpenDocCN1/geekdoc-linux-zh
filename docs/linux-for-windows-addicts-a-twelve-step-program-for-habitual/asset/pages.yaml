    Now that you''ve gone through all that rigmarole, it''s time to commence with
    the Linux installation. The first Linux installation process I''ll illustrate
    uses Corel Linux 1.0


    NOTE: Booting Linux from an installation diskette or CD-ROM may set off the antivirus
    program in your computer''s BIOS. If this happens, you''ll get a warning message
    while the system starts up. In most cases, you''ll be able to continue installation,
    but you might consider disabling the virus check–after you check the diskette
    for viruses.


    ![](img/dcd0086266143e7048be2fb5e68a2391_116_0.png)


    # INSTALLING COREL LINUX FROM WINDOWS


    One of the easiest ways to install Linux is by using Corel Linux. This is one
    of several dis-ributions that allow you to try out the operating system without
    creating a Linux partition on your computer. If you just want to explore Linux,
    it''s one of the least intrusive ways of getting started, because it doesn''t
    require any changes to your hard disk lay-out: If you have enough free disk space
    in Windows, you should be able to install Corel Linux.


    On the other hand, if you install Linux on top of an existing Windows partition,
    which is how Core accomplishes this little feat, you can expect seriously sluggish
    performance. The only point to doing things this way is to see what the installation-process
    is like to play with Linux without buying another disk or partitioning things
    yourself.


    Still, I''m going to illustrate the Corel Linux installation process because it''s
    incredibly easy. If your hardware is on the compatibility list, your chances of
    installation success are high and the demands will be quite minimal. And you certainly
    don''t have to install Corel Linux to a Windows partition; if you''re willing
    to add a disk drive or have unallocated space on your existing disk drive, it''s
    still worth a try. The installation process is even easier in those cases because
    you don''t have to configure Win-d to be aware of Linux at all.


    One tradeoff you may make by installing Corel Linux rather than another distribution
    is that others tend to offer more application options than Corel does. But if
    your goal is to try Linux without worrying about repartitioning your hard disk
    or installing a new disk, I recommend Corel. If you''re willing to partition the
    system yourself, or to add a new hard disk (or let your existing disk wiped clean),
    while you can install Corel Linux, you might consider OpenLinux or Red Hat, which
    are discussed later in this chapter.'
  merge: -1
