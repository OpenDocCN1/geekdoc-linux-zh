  md: '# What’s Your Score?


    If you answered “yes” more than four times, you may have a serious Windows problem.
    But only *you* can decide whether you think Linux will work for you. Try to keep
    an open mind as you read this book and I will try to show you the techniques I
    use to kick the Windows habit myself.


    Linux may not currently solve all your computing problems. But many people are
    out there using it each day to accomplish tasks they use to rely upon Windows
    to perform. They’re finding that by doing so, they’re saving time, money, and
    frustration, and making their computing lives much more manageable.


    # WHY SHOULD I CARE ABOUT LINUX?


    There are several good reasons people should care about Linux. You can see which
    ones apply to you:


    +   - Linux offers an alternative

    - Linux offers freedom

    - Linux works well

    - Linux continues to improve

    - Linux is fun


    # Linux Offers an Alternative


    There’s lots of resentment toward Microsoft these days for the way they seem to
    try to stifle competition. Whether they’ve done so legally or not is still being
    decided in the court system, but there are many people who would be happy to find
    an alternative—almost any alternative.


    A Macintosh is not an alternative that will satisfy everyone who falls into this
    category. It’s restrictive in its own way, with more proprietary, more expensive
    hardware, limited native applications, limited interoperation with other systems,
    and (pardon me in advance) a retarded user interface.


    Linux is an option for people who (for whatever reason) don’t want to give any
    money to Bill Gates, who aren’t willing to trade in their existing Windows-compatible
    hardware. My father, for example, was excited to hear that I was writing this
    book, because he would like to be able to do all the things he needs to do without
    involving Microsoft. If you feel the way he does, give Linux a try.'
