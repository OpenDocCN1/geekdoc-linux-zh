    specify a file to which from the Magic Script will be written. This value defaults
    to the name of the magic script with a .out extension. And the Max Connections
    settings limiting the number of simultaneous active connections permitted for
    the share. Users who attempt to access the share after the limit is reached are
    kicked out of the inn and are lucky to find space in the stables.


    # Run Samba


    If you''ve plowed through all that Samba configuration, you''re ready to take
    on a simple task for a change.(Actually, there are a number of additional options
    not covered by Linuxconf, if you''re looking for functionality that isn''t covered,
    check out the smb.conf man page and the samba.org web site.) So you''ll be happy
    to know that the actual running of the Samba process is quite simple


    Running Samba on a Red Hat or derivative distribution just means making sure the
    process gets started. You can see whether it''s running by using the /etc/rc.cd/init.d/smbd
    script and checking for the Samba status, like this:


    ```

    root@romans > /etc/rc.cd/init.d/smbd status

    ```


    If the Samba server is running, it will tell you so, and it will give you the
    process ID numbers for the related processes:


    ```

    smbd (pid 18934 18919) is running...

    nmbd (pid 18930) is running...

    ```


    On the other hand, if the server isn''t running, the smb status command will return
    something more like this:


    ```

    smbd stopped

    nmbd stopped

    ```'
