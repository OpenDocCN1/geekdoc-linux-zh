  md: '# Chapter 3: New 0S, New Freedoms, New Concepts


    system. All files, all devices, and all processes running on the system must comply
    with the superuser''s commands. Root control over the creation of new users and
    can set permissions on directories and files as necessary.


    Root performs software installations, identifies and tidies up after system problems,
    and maintains security. The person (or persons) who have access to the root account
    should not normally log in root, however. Those who have superuser access should
    have their own user accounts; the root account is only used to perform root functions
    such as software installation or user creation.


    The superuser account should be used only when needed because it is capable of
    deleting files needed by the operating system. It can crash others'' files. It
    can kill processes. And all of these things can happen mistake if you are careless,
    tired, or confused. For day-to-day use, Linux provides ordinary user accounts.


    # User Accounts


    Each user of a Linux system has unique user account. Account names consist of
    short strings of characters: a user''s name or nickname can be the best accounts
    name. Users on a Linux system can be logged into the same machine at the same
    time (either remotely, on separate "virtual consoles", or in different windows).


    Each user gets a home directory in which files and programs may be placed. These
    home directories are ordinarily placed in /home, so the full path to my home directory
    is


    /home/millerm


    By default, all users who are part of the same group (see the "Groups" section
    below) can view the files in other group members'' home directories, but cannot
    modify them. Unless you change their access, ordinary users cannot change any
    files on a Linux system out.


    # Groups


    Linux, like other network operating systems, uses groups primarily to provide
    access privileges for different sets of people. For example, if users "mom" and
    "dad" want to share a directory containing financial information without giving
    access to their children, users "erin" and "matt," they can use "root" to create
    a group, put "mom" and "dad" in that group, and give the group exclusive access
    to the financial data.


    # Attributes


    File and directory attributes are part of the DOS and Windows environments, so
    they''re not an entirely foreign concept. However, the way they are used in Linux
    may be a little harder to decode at first. In the directory listing below, look
    at the leftmost column to see the attributes of each file and directory:


    ```

    -rw-r--r 1 millerm users 190 Nov 24 11:48 README

    drwx-xr-x 2 millerm users 1024 May 24 1999 jdk

    ```'
