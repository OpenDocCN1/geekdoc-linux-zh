  md: 'problelo. To see those defaults, select the Performance option, which will
    bring up a configuration screen like the one shown in Figure 11-12.


    There are three subsections in this window. The first one allows you to set parameters
    related to the number of server processes. The second section relates to how long
    a connection is maintained. The extremely brief third section sets a different
    type of client timeout.


    **Number of Processes** The Start Servers field allows you to set the number of
    server processes the service starts with. In other words, when Apache is launched,
    how many web server processes are initially launched? Enter this number in this
    field, which is set to 10 by default.


    ![](img/dcd0086266143e7048be2fb5e68a2391_336_0.png)


    Figure 11-2. Configure Apache server performance settings from Linuxconf'
