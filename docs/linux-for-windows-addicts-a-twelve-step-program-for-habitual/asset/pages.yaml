  md: '# Glossary


    **superuser** The master of a Unix or Unix-like system, the superuser is usually
    the root account, which has unrestricted access to all the files and directories
    on the system. A regular user who wants to log in temporarily as root can use
    the su command to become the superuser. No phone booth is required for this transformation.


    **Unix-like** An operating system that looks and feels like Unix isn''t always
    Unix, especially back in the days when AT&T was vigorously enforcing its trademark
    on the name Unix. So a system that behaves more or less like Unix (a more certain
    standard would be POSIX compliance, but that''s not absolutely necessary), but
    doesn''t contain any of the original Unix code, is Unix-like.


    **user account** On multiuser systems like Linux, users access the system and
    their individual files by means of a user account. Windows NT and Windows 2000
    have similar account structures, though Windows 9x isn''t quite as stringent about
    access.


    **user ID** A user ID is the numeric value associated with a user name. Part of
    the file ownership and permissions system is based on knowledge of the user ID,
    and each file and directory in a Linux filesystem has a user ID assigned as an
    owner.


    **virtual console** A virtual console refers to a series of full-screen text displays
    a user can access from a Linux system. Instead of having only a single command
    screen, like on a DOS system, Linux allows users to have several active sessions
    and be logged in on several different virtual consoles. These consoles share the
    same physical console and are accessed by use of function keys.


    **Windows** As a proper noun, this term refers to a large family of operating
    system products ranging from handheld and embedded applications to enterprise
    servers. A vast majority of the PCs in use today run one version or another of
    Microsoft''s flagship operating system.


    **window manager** A program responsible for controlling windows in a GUI, including
    placing, moving, resizing, iconifying, and destroying them. The window manager
    is also responsible for the appearance of the windows, including colors, fonts,
    and control widgets.'
  merge: -1
