  md: '# Linux for Windows Addicts: A 12-Step Program


    If you have been using servers in a Windows NT or Windows 2000 environment, you
    may have had the opportunity to use Microsoft''s Internet Information Services
    (IIS), which comes bundled with the operating system. With Linux, you have the
    opportunity to use the Apache web server, which hosted more than 60 percent of
    web sites, according to the September 2000 Netcraft survey (see http://www.netcraft.com/survey
    for the latest information). Apache is included with most Linux distributions,
    many of which automatically enable the web server during installation!


    Just as easily availability gives IIS a certain appeal on Windows servers, it
    makes Apache that much more appealing on Linux. It can also help you achieve Step
    8 of our 12-step program: Establish a reliable web server. While you have other
    web server options to run on Linux, we''ll examine Apache running on Linux, plus
    ways of managing the server and your content.


    # RUNNING APACHE


    Because most major Linux distributions include Apache, most people won''t even
    need to install it. However, if you find yourself among the unfortunate few, you
    can leverage the tips in Chapter 13 to install a version of Apache from the Apache
    Software Foundation at http://www.apache.org.


    The issues we will tackle in this chapter include customizing your Apache installation
    to do what you want it to starting, stopping, and restarting the web server daemon,
    and creating virtual sites on your web server.


    # Customizing the Web Server Using Linuxconf


    Customizing an Apache web server can be accomplished a few different ways. There
    are some graphical management tools available (see http://gui.apache.org/ for
    more information about these), and of course, you can manually edit the configuration
    files. Because we''ve been focused on using Linuxconf for system administration,
    though it seems sensible to start by using it to customize our web server configuration.


    While Linuxconf doesn''t do everything, it certainly proves to be a useful tool
    to help hanging from your Linux administration belt. This proves true with Apache
    server management as well. As we go along, I''ll point out where the options are
    being incorporated into the text-based configuration files so you have an idea
    of what''s going on under the hood.


    To get started, open Linuxconf from the command-line, from X Windows, or in a
    web browser. Traverse the Networking-Server Tasks-Apache Web Server tree, where
    you''ll find the Apache configuration options.


    # Setting Web Server Defaults


    To set the basic web server information, select the Defaults option from the Apache
    Web Server tree. You should see a screen that is similar to the one shown in Figure
    11-1.'
