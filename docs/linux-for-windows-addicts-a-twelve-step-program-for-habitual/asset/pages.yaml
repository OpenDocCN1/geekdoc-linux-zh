    also add the IP Number Of Server if you desire. Enter the printer share name in
    the Printer Name field.


    Access information for the printer is also entered from this screen. While it''s
    best to access SMB printers that don''t require a password, because the password
    is saved without encryption, it''s possible to enter a username and password that
    have access to the share. Fill the Workgroup field with the correct Windows workgroup
    name.


    The rest of the information on this screen is the same as described in the “Local
    Printers” section. When you''re satisfied with your entries, click the OK button
    to return to the main screen.


    # NetWare/NCP Printers


    If you have a NetWare printer you''d like to access from a Linux system, you can
    configure it printingtool. While most of the information is identical to what
    I''ve described in the preceding sections, there are a few NCP-specific options.
    Please note that the username and password are stored unencrypted on the Linux
    system, so don''t use an account that has any useful access to anything but the
    printer.

    nThe Print Server Name in this case is the name of the NetWare server, and the
    Print Queue Name, not surprisingly, is the name of the NetWare print queue on
    that server. The User and Password fields specify the account required to gain
    access to that and print queue.


    # Underlying Changes


    Those configuration steps didn''t seem very challenging, did they? That''s because
    they weren''t. The changes they make to your Linux system aren''t very complicated,
    either. I still prefer making the changes from printtool if I''m setting up a
    new printer, simply because I''m less likely to make a configuration type that
    way. But once I''ve got a system connected to the printer, it''s easy to write
    a script to add the changes to other systems on the network. Sweet Linux eases
    the pain! The print changes changes two areas on your Linux system: The /etc/printcap
    file and the /var/spool/lpd/ directory.'
