  md: '# Chapter 1: Confessions of a Former MS Junkie


    just want to experiment with Linux, you can get it without paying for it (and
    without the Software Publisher''s Association asking the local sheriff to raid
    your home or office). Don''t do this with Microsoft operating systems; it''s not
    only risky, it''s wrong.

    I should point out one more thing here. Some people will argue about “free” means
    in this context. In particular, the folks at GNU, which created the licensing
    terms under which Linux is distributed, are fussy about the use of terms “free”
    and “open source.” If you''re willing to trade some time for further semantic
    precision, I recommend reading up on the controversial issues at the GNU web site
    (http://www.gnu.org).


    # Open Source


    Open Source might be a more unfamiliar concept. Although the Open Source Initiative
    has codified a specific definition it uses to certify open source software, you''ll
    find that lots of people use the phrase to mean subtly different things. The most
    important aspect of open source software is that you have the right to see the
    source code for the software, and you cannot deny anyone else has the same right.
    This is also the one that people argue about the most.


    The folks at the Open Source Initiative (http://www.opensource.org) assert that
    open source “promotes software reliability and quality by supporting independent
    peer review and rapid evolution of source code.” At the very least, using open
    source software means that you can tinker with the program (or pay someone else
    to) to make it work the way you want it to. For many businesses and individual
    users, this is a major advantage.


    # When Free Software Ain''t


    If Linux is supposedly free, why do you see it for $20–$80? And how''s anybody
    supposed to make money on the proposal? The Free Software Foundation''s take on
    this is that the “free” in “free software” refers to freedom, not price. Specifically,
    it refers to “users” freedom to run, copy, distribute, study, change and improve
    the software.” So the producers of “free software” can sell software for as much
    as they want, so long as the freedom of use remains intact.

    Whether this is a viable way of running the software industry or remains uncertain.
    Its also irrelevant, because lots of companies will never stop producing proprietary
    software. But one thing to note is that software created on Linux systems does
    not have to be “free software,” either in price or in freedom. My company, for
    example, most of its software development on Linux systems. Our product may be
    purchased for the Linux platform. But for the foreseeable future, our software
    and the algorithms it contains will remain proprietary.

    For additional information on the nuances of software freedom, see the Free Software
    Foundation''s web site (http://www.gnu.org/fsf).


