  md: '# Linux for Windows Addicts: A 12-Step Program


    Linus release Linux version 0.02 in 1991, when it supported the 386 processor,
    had no floppy drive support, and had many bugs. Linux anticipated some doubt about
    the need for his project in a newsgroup posting over October 1991:


    I can (well, almost) hear you asking yourselves “why?” Hurd will be out in a year
    (two, or next month, who knows), and I’ve already got Minix. This is a program
    for hackers by a hacker. I’ve enjoyed doing it, and somebody might enjoy looking
    at it and even modifying it for their own needs. It is still small enough to understand,
    use and modify, and I’m looking forward to any comments you might have.


    Just for background purposes: Hurd is the kernel of the GNU Project folks have
    been developing for the GNU operating system. Hurd uses a different type of architecture
    and was under development before Linux…but Linux caught on. Minix, as mentioned,
    is another Unix-like operating system, but it’s not free, and…well, had you heard
    of it before Hurd? Don’t worry, that’s true for most everyone. The “for hackers
    by a hacker” comment is particularly interesting, as some people would think Linus
    hasn’t progressed much since then. Hey, hackers still like it, but it has come
    a long way in the intervening years.


    # WHO KEEPS LINUX GOING?


    A network of programmers around the world keeps Linux going. It’s a fictitious,
    loosely knit bunch at best, with a few individuals making key contributions and
    playing key roles. Linus is still the project manager, though others are important
    as well. But the bottom line is that there are people of all backgrounds working
    on Linux. Many are hobby who are programming for the love of programming and for
    the glory they feel when their contributions are useful and used. Some work for
    companies funding Linux development, including some make distributions.


    Others contribute to Linux because they want to support hardware or features they
    need themselves; after all, if it doesn’t exist, but you need to create it, there’s
    no point in sharing it. Hardware vendors are also beginning to work on drivers
    themselves, rather than refusing to cooperate at all (as some have done in the
    past) or merely making technical information available to others (which has happened
    with some frequency).


    There are also the software vendors themselves. Oracle, for example, isn’t excited
    about working with Microsoft, and the acrimony between those companies is fairly
    well known. It has made its database offerings available on Linux (as many as
    its competitors). Some of the Oracle database administrators (DBAs) I know are
    now making contributions to the Linux community once they used Linux, they didn’t
    want to go back to Windows. There are a number of software companies that make
    both commercial and open-source products, funding development of the latter by
    selling the former.'
