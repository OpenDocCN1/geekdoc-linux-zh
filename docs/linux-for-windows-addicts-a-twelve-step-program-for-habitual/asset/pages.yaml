  md: '# Linux for Windows Addicts: A 12-Step Program


    the tool is more complete, and it''s definitely a smaller piece of software than
    either both KOffice or StarOffice.


    One thing you give up with Abiword is the integration between tools that both
    KOffice and StarOffice offer. Abiword is a word-processing package with desktop
    publishing features, period. On the other hand, it''s also usable and truly open
    source, so if you''re looking mainly for document creation capability, it''s not
    a bad choice.


    For information on Abiword''s current functionality, check out the homepage at
    //www.abiword.org/.


    # Siag Office


    While the other packages in this category serve up typical office application
    functionality with some unique features, Siag Office is truly iconoclastic. For
    starters, you can use the Siag spreadsheet in text mode or under X. The spreadsheet
    is written in and supports input from the Scheme dialect of the Lisp programming
    language. It offers one more fairly unique feature: It will serve as a “one shot”
    web server, allowing you to share a document across the Internet.


    The Siag word processor, Pathetic Writer, sports integration with Siag, but it
    relies on external file-filtering programs to get sharing files with colleagues
    we are still using Microsoft Office products. The Egon Animator rules out this
    quirky office package with aplon. Egon allows you to make simple animations (well,
    perhaps somebody with more skill than I can make complex animation), giving you
    tight control over what element is doing.


    I don''t see Siag Office getting a large following from the formerly Microsoft
    crowd; its sensibilities are a little too programmer-oriented for most Windows
    users. But for those of us who have learned Scheme in U.C. Berkeley''s undergraduate
    computer science program, and never have had to use it again, it''s intriguing.
    For anyone who can take advantage of its unique features, it''s a pretty cool
    suite. Learn more at //siag.nu/.


    # COMMERCIAL OFFICE APPLICATIONS


    The preceding tools were either open source or available for free users. That''s
    not the only type of application you can run on Linux systems, though, and some
    of the other products are worth investigating. In particular, the Applylinux suite
    and the Linux port of Core''s WordPerfect may be suitable for your use.


    # Applixware


    Applix Inc.''s Applyixware is a full-featured office suite available on multiple
    platforms. The Applylinux suite includes Words, a full-featured word processor;
    Graphics, a drawing and implementing tool; Presents, a presentation graphics package;
    a flexible mail client; and Data, which helps you build and access databases.
    Builder is an object-oriented programming tool that''s useful for small-scale
    application design, not to mention integrating other applications with the Applyix
    tools.'
