  md: '# Linux for Windows Addicts: A 12-Step Program


    If you''re adventurousome, have a little time, and don''t mind reading the extensive
    help information, there''s plenty of information available during the config process
    (re-gardless of the config tool you use). You should be able to get everything
    you need and exclude the stuff you really don''t want without much trouble.


    But for those who want a little more assistance, this section will describe the
    options, focusing on the ones you''re likely to waste and glossing the past that
    ones aren''t likely to be useful. Just to warn you, I''m working with a test version
    of Linux 2.4, and I''m leaving out anything that''s experimental. If you''ve got
    a different version of the kernel, you might find somewhat different options.
    And if you''d like to try experimental code, you''re on yours.


    I''ve populated the tables in this section with the descriptions of the options,
    which tend to change a little from version to version of the kernel. I have omitted
    experimental options, most laundry lists of hardware-specific device drivers,
    and many options that are only useful if you select an option I don''t recommend.
    Most of these options have help text available in all three configuration tools,
    however, and if you''re interested in an option I haven''t explained in detail
    or covered in a tale, consult this to help you make your decision.


    > NOTE: Use common sense when following my suggested settings. If I haven''t recommended
    enabling the driver for hardware you use on your Linux system, for example, go
    ahead and enable it. These suggestions are general-purpose and wont suit every
    situation.


    # Code Maturity Level Options


    This option allows you to include partially developed features or drivers included
    with this version of the kernel. Unless you have to use hardware that only has
    experimental drivers, or wish to test these features, there''s no reason to include
    them. If you do include them, you risk the usual dangers of using potentially
    incomplete code. Suggested config settings are shown here.


    | Setting Name | Recommended | Safest If Undecided |

    |---|---|---|n| Prompt For Development And/Or Incomplete Code/Drivers | N | N
    |


    # Loadable Module Support


    These options allow you to determine how to handle pieces of the kernel code that
    are compiled as modules rather than built into the kernel. The options are shown
    here.


    | Setting Name | Recommended | Safest If Undecided |

    |---|---|---|n| Enable Loadable Module Support | Y | Y |'
