  md: '# INTRODUCTION


    It has been in vogue for a while now to hate Microsoft. For everyone you know
    who thinks Bill Gates is a genius and a shining example of American ingenuity
    at its productive best, there seems to be another who viliies him as a competition-stifling,
    dirty-deal-making, coercive shyster, void of original ideas.


    This book isn''t about that.


    Some see open source or free software as a revolutionary way of providing maximum
    benefit to computing users. Some feel that "open source" will change the way computing
    businesses operate throughout the world, for better and worse.


    This book isn''t about that, either.


    This book isn''t about resolving questions of morality, ethics, or value to the
    social order. It''s about investigating your options for retiring your Microsoft
    products and using a cooperatively developed, freely distributed operating system
    called Linux.'
