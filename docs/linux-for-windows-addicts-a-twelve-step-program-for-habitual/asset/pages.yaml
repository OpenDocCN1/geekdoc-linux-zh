  md: '# SCSI Support


    This option enables support for SCSI devices on the Linux system. If you know
    the system for which you''re building the kernel has no SCSI host adapters or
    devices, and if you''re not planning to add any, you can disable this option.
    Assuming you have SCSI devices on your system, my option suggestions are shown
    here.


    | Setting Name | Recommended | Safest If Undecided |

    | --- | --- | --- |

    | SCSI Support | Y | Y |

    | SCSI Disk Support | Y | M |

    | Maximum Number Of SCSI Disks That Can Be Loaded As Modules | 40 | 40 |

    | SCSI Tape Support | M | M |

    | SCSI CD-ROM Support | Y | Y |

    | SCSI Generic Support | M | M |

    | Enable Extra Checks In New Queuing Code | N | Y |

    | Probe ALL LUNs On Each SCSI Device | N | N |

    | Verbose SCSI Error Reporting | Y | Y |

    | SCSI Logging Facility | N | Y |


    If you have SCSI devices on your Linux system, enable the SCSI Support option.
    You can specify for particular types of SCSI devices separately. The first such
    option is SCSI Disk Support. This refers to hard disks using the SCSI interface,
    so if you have one or more, enable it. The next options specify the Maximum Number
    Of SCSI Disks That Can Be Loaded As Modules; the default of 40 is a fine setting
    for most of us, and it''s not necessary to make the number close to the number
    of devices you''re actually using.


    +    Enable Tape Support if you have or plan to add a SCSI tape device, and of
    course, you should enable the SCSI CD-ROM Support option if you have or plan to
    add a SCSI CD-ROM drive. Less obvious is the SCSI Generic Support option, which
    includes a hedgehodge of devices that don''t fit into the other categories, including
    SCSI-scanners and readers.

    Enable Extra Checks In New Queuing Code may not be in the version of the kernel
    you have available; it exists in the preliminary version to help identify problems
    in the SCSI code. If it''s an option, enable it. The Probe All Luns On Each SCSI
    Device function is needed only for certain SCSI devices such as CD jukeboxes that
    have multiple Logical Unit Numbers (LUNs).

    Enabling the Verbose SCSI Error Reporting option makes the SCSI-related error
    messages more verbose, and therefore more likely to be understood (ergo more useful).
    That''s generally a good thing, so I say for it. I only enable the SCSI Logging
    Facility option if you''re having system problems and suspect that something in
    the SCSI bus is to'
