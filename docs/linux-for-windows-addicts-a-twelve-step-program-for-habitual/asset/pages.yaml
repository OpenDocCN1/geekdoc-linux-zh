  md: '# ACKNOWLEDGMENTS


    Had Dr. Paul de Dood confined himself to talking about automating standard-cell
    library layout, rather than suggesting this topic, this book would not be. And
    had he not made up for it with the patient tolerance of a sleep-deprived friend
    and employee, I''d hold it against him.


    Had Jim Sumser been anything but thoroughly—even excessively by the subject matter
    and approach, this book would not be, or worse, it would be painfully boring.
    Had Kevin Shafer listened to Laura Lewin and her associates, this book would have
    been published elsewhere. Had John Read not become its vocal and energetic champion,
    it would have never made it to Osborne.


    Had I not felt graciously prodded for the manuscript by Ross Doll, LeeAnn Pickering,
    and Jan Benes, this book would not be in existence today.


    Had Daniel Albers did not introduced Paul to the glory of Linux, this book would
    not be, or worse, it would be the dramatically less compelling, Solaris for Microsoft
    Addicts: An 86-Step Program.


    Had a whole host of developers, especially those writing GNU and Linux code, practiced
    lawn darts instead, there’d be nowhere for us to, be here. Of course, they’d make
    history’s most awe-inspiring lawn darts team.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    Had a host of friends and family, including Peter and Deb Kilner, Daniel Wilburn,
    David Dwyer, and Rick Langeloh be less encouraging and inspiring, I would have
    abandoned this task early on. Rick''s application of the subject matter in his
    homely at our wedding was particularly apt.


