  md: '# Avoiding Unnecessary Use of Root


    Making appropriate use of root isn''t just a matter of using it correctly, it''s
    also a matter of not using it incorrectly. And there are some options for you
    if you wish to avoid using root when there''s not a good reason.


    # Give a Reasonable Amount of Access to User Accounts


    This is a plenty simple concept. If you give users or groups enough access over
    their own directories, you won''t need to give Big Brother Root involved to help
    them out. Or if you give certain trustworthy users membership to groups that give
    them management authority over certain files and directories, they''ll be able
    to take care of needs in these areas without constant reliance upon them.


    On the other hand, opening up system areas to user access is likely to make you
    need to use root for problems that users cause unintentionally. The principle
    is to give autonomy to users in their designated areas, and keep a stranglehold
    on all other areas.


    # Use Root Alternatives When Possible


    Think about how you''re using the root account and find ways of performing the
    same tasks without logging in root. For example, most systems don''t allow normal
    users to mount the disk partitions, which is appropriate. But it also means that
    from time to time the root user might have to mount a remote partition (when a
    network connection has been down, for example). One of eliminating direct root
    intervention from this scenario is to use the automounter to partitions that get
    lost this way. Check the man pages on the autofs command for more information
    about using the automount features.


    Another way to work around use of the root account is by using a tool designed
    for the purpose. One such utility is sudo, which allows normal users to perform
    a "superuser do" by the real superuser. If your distribution doesn''t include
    sudo, you can get it from http://www.courtesan.com/sudo/. Basically, you edit
    a file called /etc/sudoers to indicate who is allowed to perform superuser-like
    tasks, and you can lock down precisely which commands and options may be executed.


    # Don''t Give Root User Account Features


    The general principle here is that the root account isn''t a user account. Nobody
    is the superuser account as their personal account, so it doesn''t need certain
    types of functionality. It doesn''t need to use a cool window manager or the corresponding
    configuration dot files. It certainly doesn''t need to use electronic mail; when
    system messages will sometimes be mailed to root, it''s easy enough to edit the
    /etc/aliases file to forward mail for root to the user account of the system administrator.'
  merge: -1
