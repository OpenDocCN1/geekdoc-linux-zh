    **From the Command Line** To mount a DOS partition that is the first partition
    on the first SCSI drive, you could use the following command:


    ```

    `root@romans ~ mount -t msdos /dev/sda /mnt/dosdrive`

    ```


    This command simply tells Linux to mount the filesystem on the /dev/sda partition
    at the mount point /mnt/dosdrive (that directory must already exist, by the way),
    using the filesystem type msdos (umsdos also works).


    After the filesystem on the partition is mounted, its contents can be accessed
    from the Linux system in the directory /mnt/dosdrive. Mounting the partition is
    roughly equivalent to calling the C:\ drive /mnt/dosdrive instead: All the files
    and directories from the DOS partition are accessible in this directory, using
    their same names and relative paths.


    Mounting a DOS-formatted floppy disk works the same way:


    ```

    `root@romans ~ mount -t msdos /dev/fd0 /mnt/floppy`

    ```


    Many distributions conveniently pre-create the /mnt/floppy mount point for you.


    **From Linuxconf** Because there''s inevitably more than one way to do this in
    Linux, and because we''ve been using the Linuxconf tool to GUIfy other system
    administration tasks, and because the header immediately preceding this paragraph
    implies the use of Linuxconf, you might guess that Linuxconf may be used to provide
    access to a local DOS partition. You would be right.


    The Access Local Drive option in the Linuxconf Config-File Systems tree allows
    you to view, add and remove local drive mounts on the system. To mount your partition,
    click the Add button to bring up the configuration screen shown in Figure 9-1.


    The Base filesystem information is straightforward. You type the partition name
    in the Partition field, select a partition type from the list provided (for a
    DOS partition, the correct type is msdos), and specify the mount point you wish
    to use. Unlike the command-line interface, Linuxconf will let you know if mount
    point doesn''t already exist and will ask if you want to create the mount point
    for you.


    The General Options section is a friendlier interface to a variety of settings
    that can be specified when a filesystem is mounted, as shown in Table 9-1.


