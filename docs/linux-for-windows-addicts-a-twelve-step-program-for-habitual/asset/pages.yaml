- img_proc: true
  md: '# Linux for Windows Addicts: A 12-Step Program


    Notice that both the client''s IP address and the address they failed to look
    up are indicated, so you know not only who had a problem, but what the problem
    was. Not only that, but the help file flags this line with an [error] tag to help
    you distinguish it from the other messages.


    # Web-Based Server Status


    If you''re looking for more quick-and-dirty information of the “Is the server
    up and what''s it working on?” variety, there''s one more option I''d like to
    mention before we move on to configuring email. That option is a SetHandler directive,
    and it looks like this:


    ```

    <Location /server-status>

    SetHandler server-status

    order deny, allow

    deny from all

    allow from .prolificinc.com

    </Location>

    ```


    Add that option, restart the httpd daemon, and then point a browser to webserveraddress/server-status.
    You should see a screen like the one in Figure 11-4.


    While this isn''t the most glamorous display you''re ever going to find, it''s
    pretty useful for the mundane things you actually need to know. For example, you
