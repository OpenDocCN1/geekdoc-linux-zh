    # Stylist: Viewing Different Style Types


    StarOffice components make good use of styles: attributes assigned to elements
    of a document that creates a unified look and feel. To keep track of all of these
    styles, StarDesktop has the Stylist window.


    Stylist also varies between StarOffice components, so we''ll look at it in closer
    detail in later chapters. Essentially, all of the Stylist incarnations list the
    styles currently available in the document''s template.


    As a window, the Stylist behaves exactly like the Navigator. Remember to Ctrl
    + double-click on the window''s border to dock and undock it.


    Template A collection of styles, macros, and other attributes that can be assigned
    to an existing document or used to create a new one.'
