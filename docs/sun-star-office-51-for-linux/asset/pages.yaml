    # Recurring Events


    A recurring event repeats with some regularity, regularity being the key word.
    You can have repeated events, such as you child''s Little League games, but unless
    they occur at regular intervals, you will have to treat them as single events
    in StarSchedule.


    Creating a recurring event is similar to creating a single event, with just one
    extra step.


    # Creating Recurring Events


    This task reviews the methods used to create new recurring events in StarSchedule.


    +   1. In the event calendar, select a start time and day.

    2. Click the New Event icon on the Object Bar.

    3. Enter the title of your event.

    4. Click the Details icon.

    5. In the Details page of the Detail pane, enter the end time and the location
    of the event.

    6. Click the Recurrence button (see Figure 21-10).'
