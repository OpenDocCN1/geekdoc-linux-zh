  md: '# Chapter 6: StarWriter Basics


    their capability to update themselves based on the data at hand. A Date field,
    for example, displays the current date whenever you open or print the document.
    You can place a Page Number field within a document''s header or footer, in order
    to automatically number each page.


    Clicking the Insert Field icon opens the Fields dialog box (see Figure 6-4), while
    clicking and holding the icon brings up a context-like menu (not really a floating
