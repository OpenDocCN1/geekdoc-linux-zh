- img_proc: true
  md: '# Chapter 13: Beyond Spreadsheets with StarBase


    iction: databases are big, evil, scary things. Somewhere along the course of your
    professional career you may have heard this rumor. Database administrators may
    be regarded with awe at your company. The simple truth is, anyone can make a database
    and understand how it works.


    You will see for yourself in this chapter, as we explore the database component
    of StarOffice, StarBase.


    # Database Concepts


    Four different types of objects comprise databases. All of these objects working
    together make up the database; any of them taken separately do not have much use.
    These objects are tables, forms, queries, and reports. Before examining the workings
    of an actual database, it will help to recover the functionality of each object.


    You''re probably pretty familiar with tables. They are essentially simplified
    spreadsheets. A database table is simpler because the purpose of the rows and
    columns is set, where a spreadsheet has more flexibility in how you use rows and
    columns. Also, spreadsheets allow cells to interact with each other, whereas database
    tables don''t. If you need mathematical comparisons made, put your data in a spreadsheet.


    In a database table, each row is a database record. A database record is a collection
    of related data. In a database of books, for example, one record could be:


    Ivanhoe, Sir Walter Scott, New American Library, September 1987


    This record has five fields: Book Title, Author, Publisher, Published Month, and
    Published Year. All other records in this database table use the same fields.
    A record needs to have more information, then the database table needs additional
    fields. In database programmer lungo, this is sometimes referred to as adding
    columns.


    A form is the interface structure between the user and the table. Though you can
    directly enter data into a table (and some prefer doing so), a form offers visual
    cues to help you enter data more quickly, rather than forcing you to tediously
    tab across row after row of the database table.


    At the very least, a good database needs tables and forms. If the database had
    just a table, it would had just a form, it would only be a shell-surrounding nothingness.


    Queries are little programming scripts that pull specific information out of a
    database. Don''t panic if you don''t think you can program anything. You can master'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'queries once you understand the way they are structured. (Besides, StarBase
    has an AutoPilot to help you with this.)


    Once a query has gathered information, it needs to display it. This is done in
    a report, the final piece of the database puzzle. Reports are, again, similar
    to spreadsheets, that they typically present data in tabular form. Reports, however,
    are not interactive. They place the data requested by a query into a read-only
    file, which can be printed or displayed onscreen. If data needs to be changed,
    it has to be done in the table (through the form).


    Databases can have multiple versions of all these objects. In a climatology database,
    you could have a table of known temperature highs and lows for a region and another
    table of rainfall amounts, each accessed by separate forms. The choices are limitless.


    To start understanding databases at the day-to-day level, you can examine the
    data-base that installs with StarOffice: The Address Book.


    # Flipping through the Address Book


    Sun Microsystems programmers thoughtfully provided the Address Book database for
    two reasons. First, the utility itself provides a practical way to track all of
    your personal and business addresses. Second, the Address Book serves as an excellent
    database for users to educate themselves on how databases work.


    The Address Book contains two of the elements discussed in the previous section:
    a table and a form. This database has no queries and reports, but who''s to stop
    you you want to add some later?


    With this in mind, let''s discover how the Address Book works and how it, like
    any other database, can be used to create form documents with the Mail Merge function.


    # Browsing the Address Book


    In this age, you have likely seen people carrying around personal information
    manager (PIM) or personal digital assistant (PDA) devices such as PalmPilots or
    Windows CE machines. Before that, men carried the infamous little black book and
    women had lady planners.


    Now that you have the opportunity to know so many people, you probably want to
    keep your friends'' and family''s addresses in order. Not just street addresses
    either, as a growing number of our acquaintances have e-mail and Web page addresses
    as well.


    When you have a lot of addresses in your Address Book, you will want a way to
    quickly find them. Running a search in the Address Book is a piece of cake.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Chapter 13: Beyond Spreadsheets with StarBase


    # Search for an Address


    This task establishes the procedure for searching for addresses in the Address
    Book.


    +   1. In any part of StarOffice, click Edit, Address Book.

    2. The Address Book form appears, as shown in Figure 13-1.

    3. Choose Search, Address Book.

    4. In the empty form, fill in the minimum information needed to locate the address
    (Last Name usually works). Then, click the Start button.

    5. Records matching your criteria come up. Scan through multiple references using
    the Previous and Next Record buttons.

    6. When you have found the proper address, click the End button.


    If you have an active Internet connection, you can search various Internet directories
    for Internet addresses.


    +   7. Click Search, Bigfoot. Bigfoot is a global repository for Internet addresses.
    The Searching in Bigfoot dialog box appears (see Figure 13-2).

    8. Enter what information you can and click Start. Then click End End when you''ve
    finished.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_307_0.png)


    Figure 13-1 The Address Book form.'
