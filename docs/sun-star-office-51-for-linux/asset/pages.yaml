    # # Using Existing Information


    Recycling has become a booming industry in the United States. As more people participate
    in recycling programs across the country, more and more material gets pushed back
    to the manufacturers. Consequently, less and less “new” material comes to consumers
    these days.


    Recyclinging is the basic concept behind sharing information between StarImpress
    and the other components in StarOffice. After all, if you have already gathered
    data and want to present some of it in your presentation, why retype all of that
    information? Better still, if linked properly, the data reflected in the presentation
    will be the most up-to-date, “live” data possible.


    Honest Bob’s Used Cars has been doing rather these last few years, and now another
    larger dealership is approaching Bob to purchase the business. Bob, who is ready
    to retire to Florida, needs to put together a sales performance report for the
    past year from all of the data he has gathered.


