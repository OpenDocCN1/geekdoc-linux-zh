    # Grand Canyon Swallows Car Whole!


    Grand Canyon, AZ - Indiana''s reunion was tragically aborted the Spring break
    when their car accidentally flooded the desert Canyon.


    Stan Prater described the incident as nothing less than insane: "We were not parked
    at the moment, when all of us were watching the scene, a set of brakes was engaged
    just in time to save the car over the edge."


    The car, a 1990 Ford Probe, fell into a crater with a depth of over 2000 feet
    (meters). No one in the family survived the incident.


    Witnesses mentioned reports to park rangers, some reported seeing a man in a white
    jumpsuit and motorcycle helmet near the report in question.

    "I didn''t see anyone in the car," Prater stated, "but I didn''t hear anyone ''yeahyeah''
    as the car went by."


    **Figure 4-4** Wrapping text graphics.


    +   1. Set the values for the Left and Bottom fields to 0.25". A buffer now appears
    between the text and the graphic.


    +   2. Close the document without saving it, as we won''t be using the wrap method
    in the remaining newsletter tasks.


    Wrapping text is pretty easy to do: just set the wrap parameters of the graphic
    and enter the text. A more precise method involves text frames. Text frames are
    objects that act just like graphics, but contain text, rather than a picture,
