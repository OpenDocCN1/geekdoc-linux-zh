    This task examines how to search for a specific set of events.


    +   1. In StarSchedule, click the Search icon on the Object Bar. The Search pane
    opens, as shown in Figure 21-12.

    2. In this example, you''ll search for all events with the category of Little
    League. Enter this value in the Categories field.'
