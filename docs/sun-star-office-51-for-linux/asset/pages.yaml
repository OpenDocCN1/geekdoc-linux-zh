  md: '# Chapter 7: Shifting Into Automatic with StarWriter


    # Daring to Compare


    Working in a vacuum is not possible in today''s hyper-communicative society. Your
    documents will get read. And people, being people, will probably have editorial
    changes to "suggest".


    StarWriter has a great way to keep track of all the changes to your document made
    by others (or even yourself). Choose Edit, Changes, Record, and StarWriter tracks
    any further revisions, no matter who makes them. To see these changes, choose
    Edit, Changes, Show. Revisions appear as colored, underlined text, as shown in
