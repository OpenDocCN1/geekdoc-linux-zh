  md: '# Do''s and Don''ts of Presenting


    Now that you have seen some of the things StarImpress can do for your presentations,
    it''s up to you to go forth and spread the message.


    As nifty as StarImpress is, the slides are only a small part of the presentation.
    The biggest part is you, the speaker. So, in the spirit of completeness, there
    are some tips for you to follow:


    +   - Maintain eye contact. This is an old but goodie. Keep focusing on people
    around the room. You have to look at them to know their moods. If everybody starts
    glassy eyed, start wrapping your up, or throw some humor or interaction into the
    presentation.


    +   - Allow questions. You want people to ask questions, and you should always
    be prepared for them. Don''t see questions as a sign that people think you aren''t
    communicating effectively the first time; they may have been thinking about what
    to make when you revealed the greatest idea in the world.


    +   - Don''t allow all questions all of the time. What you don''t want is one
    or two people hogging the presentation, politely ask him or her to discuss the
    matter with you at the end of the presentation when you''ll have an open Q&A session.


    +   - Don''t use pointers. Pointers, especially laser pointers, are superfluous
    99 percent of the time. There is generally no reason for a speaker to use a stick,
    laser, or to point out words on the screen. Your audience can see the slides and
    they know how to read. Only use pointers in situations where a specific graphic
    detail needs to be highlighted that might otherwise be missed by an audience.


    +   - Face the audience. On a related subject, don''t turn your body to read the
    slides with the audience. No one wants or needs to see your backside.


    # From Presentation to Web Page


    We are rapidly becoming a world in which whole libraries can be downloaded in
    minutes, where personal services such as grocery shopping and bill paying will
    always be online, where the exchange of new ideas with someone on the other side
    of the world will be as easy as handling a paper memo to the colleague in the
    office across the hall.


    Whole new markets open up every day and it''s time you go in them. In this do,
    you need to be out on the Web. Creating a presentation to show to your colleagues
    and peers is one thing, but creating a presentation for the world to see seems
    a pretty daunting task.'
  merge: -1
