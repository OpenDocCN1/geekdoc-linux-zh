  md: '350 Chapter 16: StarImpress Your Peers


    Each of the five edit views in StarImpress has a different set of tools to use.
    The following sections will examine these tools.


    # Drawing View


    If any view could be called the center of StarImpress, it would be the Drawing
    view. In this view, all the editing and creating of individual slides. You enter
    text, apply slide transitions, add pictures—anything that can be done to a slide,
    you do it here.


    This translates, of course, into a large number of tools you can use. There are
    too many tools to devote a lot of words to each. To help you in the right direction,
    the following sections will highlight the main tools within the Drawing view.


    # Main Toolbar


    The Main Toolbar shares a majority of its icons with the StarDraw component of
    StarOffice. In fact, only four tools have been added to the StarImpress version
    of this toolbar.


    In the Drawing view, the tools on the Main Toolbar focus focus on creating text
    and graphic objects on the slide. Many of the icons have floating toolbars, vastly
    increasing the number of possible tools this single toolbar possesses. Figure
    16-3 highlights the icons on the Main Toolbar while Table 16-2 briefly explains
    the function of each icon.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_369_0.png)


    figure 16-3 The Drawing view''s Main Toolbar.'
