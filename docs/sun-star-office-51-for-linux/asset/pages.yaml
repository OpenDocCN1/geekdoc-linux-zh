    # # More Shortcuts Using Toolbars


    Toolbars are an element that can be very useful, or somewhat confusing. Let''s
    face it: software makers have a tendency to cram as much as they possibly can
    into the toolbar. Sun has followed a similar path. However, as you will read in
    this section, you can modify the toolbars to better suit your needs.


    # ## Toolbar Basics


    StarOffice has four toolbars that can appear in its components: the Function Bar,
    Object Bar, Hyperlink Bar, and Main Toolbar. These toolbars appear by default
    in whatever component they need to be present.


    For example, even though you can choose to view the Main Toolbar in the StarDesk-top,
    you don''t really gain anything by turning it on. The Function and Object Bars
    contain all of the necessary functions for the StarDesktop.


    Other toolbars appear in various StarOffice components. And, while the Object
    Bar and Main Toolbar appear in most of the components, they differ in each one.
    These'
