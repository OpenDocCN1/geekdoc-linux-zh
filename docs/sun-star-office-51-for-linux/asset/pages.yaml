  md: '# Conclusion


    You now have the ability to create your own database! This ability puts you a
    notch above those around you who think databases are too difficult for mere mortals
    to do.


    Keep in mind that we have just scratched the surface of building and maintaining
    databases. StarBase has more functionality that has not been explored in this
    book. Be sure to continue exploring StarBase on your own, particularly the various
    design views, where the real power lies.


    Chapter 14 will examine another data presentation tool, StarChart. StarChart is
    the component of StarOffice that, working closely with StarCalc, creates stunning
    visual representations of your data.


