    It''s Not Disney

    Animated text can be abused very easily. It almost did not make it into this book.
    In the early days of the Web, some enterprising person invented the <BLINK> tag.
    This tag, when read by browsers, caused the surrounded text to blink and off indefinitely.
    Forever.'
