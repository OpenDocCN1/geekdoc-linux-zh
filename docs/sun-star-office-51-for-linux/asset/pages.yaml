  md: '# Algebra, Calculus, Trigonometry: They''re Back! 333


    In 1974, the United States sent the first intergalactic email: a mathematical
    message designed to let our stellar neighbors know that the lights are on and
    everyone''s home here on Earth (see Figure 15-1).


    This message, when viewed mathematically, can tell intelligent life who sent the
    message, what they look like, and about some of the chemical building blocks of
    life on this crazy planet Earth.


    Of course, this all depends on whether the rest of the universe has done its math
    homework.


    # Algebra, Calculus, Trigonometry: They''re Back!


    StarMath is a very specialized tool for expressing this powerful thing called
    math. It is not so specialized as to prevent everyone from using it, but it is
    specialized enough that not everyone will want to use it.


    There exists a significant dearth of applications that easily create formulas.
    Educators will find StarMath a real timesaver when creating homework assignments
    for the rest of us to do. Corporate trainers for financial and industrial companies
    can show employees the formulas behind the tasks in their work, such as the effective
    annual interest rate explanation shown in Figure 15-2.


    Understanding how you can use StarMath is important so that you don''t needlessly
    shy away from a tool that could potentially add accuracy and professionalism to
    any document you create.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_352_0.png)


    Figure 15-1 The 1974 Arecibo message.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# Chapter 15: StarMath: Not Just for Rocket Scientists


    ![](img/185096a0ec6a79f83b74a7ac44692a25_353_0.png)


    Figure 15-2 How the bank figures out the interest you get.


    # # Unraveling Math Mysteries


    Math operates on a pretty basic principle: you have values and you have the operators
    that affect them. If this sounds like the definition of functions you read in
    Chapter 12, "Breaking Out of the Cell,\" you''re right. You can think of functions
    as a subset of math."


    You can express values in two ways: as numbers or as variables. Numbers representations
    that we have universally assigned (at least most of the world) to amounts. "One"
    represents the concept of a single object, whatever that object might be.


    Variables take a step back from this direct object representation. They represent
    a non-specific amount of a more specific object. The "e" in e=mc2 represents energy.
    The other variables in the formula and the formula itself determine the amount
    of energy.


    Some variables represent specific values of a specific object. These are known
    as constants. Constants do not change, hence the clever name. The "c" in the famous
    formula in the last paragraph is a constant representing the speed of light: 299,792
    meters per second. Which, Einstein would say, is really, really fast.


    Operators control how values and variables interact with each other. In the equation
    "1 + 2 = 3," the (+) operator indicates the addition of the values 1 and 2, and
    the equal (=) operator indicates a value, 3, equivalent to the summing action.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Unraveling Math Mysteries


