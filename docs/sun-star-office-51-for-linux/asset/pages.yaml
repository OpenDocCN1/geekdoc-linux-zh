    Lines are one-dimensional objects that connect two points in space together. Curves
    are lines that follow a different path through space. Rather than taking the direct
    approach like a line, curves bend through space. A more precise equation explains
    this, but let''s not get carried away.


    In StarDraw, the Line icon lets you access eight tools to create lines and curves,
    as well as polygons. Polygons are the next progression of a line, since three
    lines can be joined together to form the most basic polygon, the triangle.


