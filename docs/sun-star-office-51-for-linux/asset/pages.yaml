    # Formula Bar


    The Formula Bar is a toolbar only found in the StarCalc component. It is small
    in terms of the number of functions it contains, it is probably the most important
    toolbar in this component. Here is where you enter all of the functions and formulas
    used in your spreadsheet.


    The Formula Bar has two distinct modes: the cell edit mode and the data input
    mode. The distinction may seem a bit too fine, but you''ll pick up on it quickly.
    In the cell edit mode, the Formula Bar''s tools deal with the selected cell or
    cells as they relate to other cells. In data input mode, the functions of the
    Formula Bar apply to data or formulas within one cell.


    Figure 11-11 shows the Formula Bar in the cell edit mode and Figure 11-12 shows
    the same bar in the data input mode.


    Table 11-3 lists the functions of all the icons in either mode of the Formula
    Bar. Chapter 12 will outline these functions in detail.'
