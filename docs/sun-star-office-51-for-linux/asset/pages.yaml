  md: '# Playing the Keyboard


    The menu command accelerators examined in the previous section differ from the
    key combinations that appear to the right of many menu commands. Key combinations
    are analogous to shortcut keys in other applications. Key combinations—sometimes
    a combination of two or three keys—yield an action quicker than using the menus,
    even by keyboard. To print a file, you could use the menu accelerator Alt + F,
    P (File, Print). But for real speed, you can use the key combination of Ctrl +
    P to start the print process.


    Like menus and toolbars, these key combinations can be configured as well, as
    seen in the following task.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_75_0.png)


    # Configure the Keyboard


    In this task, you''ll create a key combination for an existing menu command.


    +   1. Within any toolbar, right-click to open the context menu.

    2. Click the Configure command. The Configuration dialog box appears.

    3. Select the Keyboard tab. The dialog box appears similar to the one in Figure
    3–17.


    Again, two sections appear in the dialog box with several buttons on the right
    side. The Keyboard section contains the current state of all combination and other
    special keys. The Functions section contains choices for all possible menu commands.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_75_1.png)'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# StarOffice Desktop


    +   4. To assign a new key combination to a StarOffice command, select an unassigned
    key or key combination from the Keyboard list.


    +   5. Select the command to which you want to assign the key combination using
    the Category and Command lists. Check the Keys field to determine if this command
    already has a key combination assigned to.


    +   6. Click the Assign button. The key combination appears in the Keys field.


    +   7. Click OK.


    > You can save your keyboard configuration by clicking the Save button, described
    in the previous task.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_76_0.png)


    # Explorer: Finding What You''re Looking For


    Up to this point, you have been reviewing elements of StarOffice that you have
    likely seen before. Now it''s time to look at the elements unique to StarOffice.


    The Explorer is one such element. Simply put, the Explorer allows you to access
    files on your PC. Of course, if it were that simple, this would be a short section.
    Explorer''s strength (and complexity) is in its organization. Within Explorer
    groups contain different ways to access and create data, as you will see in the
    following section.


    # Explorer Basics


    View the Explorer by clicking the Explorer On/Off icon on the Function Bar, or
    choosing the View, Explorer command. Even after doing so, you still may not see
    the Explorer. This is because of Explorer''s ability to hide on the edge of the
    screen. In Figure 3-18, you can see the Explorer control bar on the left edge
    of the screen.


    Make the Explorer visible across the desktop by clicking any part of the Explorer
    control bar. You can resize it by dragging the control bar to the left or right,
    until you''ve reached the desired width.


    > If you want to resize the desktop so part of it is no longer hidden under the
    Explorer, click the Stick button on the Explorer control bar. The Stick button
    has the little thumbstick graphic on it.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_76_1.png)


    If you want to change the position of the Explorer, hold down the Ctrl key and
    double-click anywhere inside the Explorer. This results in a floating window,
    as seen in Figure 3-19.'
