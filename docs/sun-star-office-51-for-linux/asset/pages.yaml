  md: '# Chapter 17: Create the Best Presentations


    # Stop the World, I Want to Get Off!


    Since early in the history of the World Wide Web, animated graphics have become
    the valued treasures of Web sites around the world. That''s because, when done
    right, animated graphics lend a lot of pizzazz to aa Web page.


    The same holds true for a presentation. StarImpress has the tools to enable you
    to create your own animated graphics, too. Be warned: you don''t want to get carried
    away with the animated graphics, either. Too many spinning logos and zipping dwarfs
    across the screen will have your audience paying attention to the screen and not
    to you.


    The safest place to use animated graphics is in an “idle” slide. An idle slide
    is a slide where the presentation can be halted for some time, for example, during
    an intermission or a question and answer session.


