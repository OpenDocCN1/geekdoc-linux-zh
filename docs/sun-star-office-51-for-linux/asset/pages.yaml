    **Figure 15-0** Simply select a symbol and insert it into your formula.


    This is where the Selection window comes in handy. From the Selection window,
    you can access all of the available operators in StarMath. The first two rows
    of icons in the Selection window are operator category icons. Selecting one of
    these reveals the operators within that category.


    > The F2 key advances the cursor to the next placeholder in the Commands window.
    Shift+F2 moves the cursor back to the previous placeholder.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_358_1.png)


    StarMath has nine operator categories, which Table 15-1 details.


    Table 15-1 StarMath Operator Categories

    | Category | Description |

    | --- | --- |

    | Unary/Binary | These operators consist of the more traditional arithmetic operators
    as well as the Boolean logic operators. |

    | Relations | Operators that compare values to one another, such as less than
    and greater than. |

    | Set-Operations | Operators used to describe mathematic sets, such as set A intersect
    set B. |

    | Functions | Algebraic and trigonometric operators, such as the exponential function
    and the sine and cosine operators. |

    | Operators | Calculus operators such as integral and derivative. |

    | Attributes | Operators that apply cosmetic changes to values, including vector
    markers and a font size tool. |

    | Brackets | Bracket and parentheses operators. |

    | Format | Formatting tools, such as line break and variable alignment. |

    | Other | Miscellaneous operators.'
