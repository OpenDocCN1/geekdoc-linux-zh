- img_proc: true
  md: '# Looking Through Your Toolbox


    Of all of the shapes you can create in StarDraw, but only the ellipse occurs naturally.
    It shows up in eggs, orbits, and raindrops. But it is a uniquely natural shape
    because in nature, there are no such things as straight lines. Only with human
    intervention can such lines be created, and you can''t have a true polygon without
    true straight lines.


    Like the square to the rectangle, the circle is just a special form of ellipse.
    But like straight lines, circles don''t occur in nature either. The orbit of the
    Moon around the Earth is elliptical, as the orbits of every planet around the
    Sun. Even the shape of the Earth isn''t a perfectly round sphere, as the spinning
    mass of the planet bulges out near the Equator, making the Earth egg-shaped.


    Because ellipses are so common in the universe around, StarDraw provides more
    than just circle and ellipse tools. You can create arcs and segments as well,
    as seen in Figure 18-7 and detailed in Table 18-3.


    > The programmers at Sun misnamed the Ellipse Pie tool, instead referring to it
    as another Circle Pie icon. For clarity, this text will refer to the tool by its
    correct use.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_424_0.png)


    Figure 18-7 The Ellipse floating toolbar.'
