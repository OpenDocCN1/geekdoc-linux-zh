  md: '# Chapter 10: Learning to Draw the StarDraw


    You can see that the second figure has quite a bit more jaggedness than the first
    figure. This effect, called pixelation, plagues raster-based graphics.


    Pixelation gets in the way of more than image quality. Drawings in a raster-based
    graphic are difficult to resize, because items change their size, pixels have
    to be added or subtracted from the original drawing. The computer has to "guess"
    how the final resized object will appear. Unfortunately, it does not always do
    the best job.


    Because of this object-oriented treatment of items in a drawing, you can more
    easily manipulate and interact with the objects—especially given the tools StarDraw
    makes available.


    # Looking through Your Toolbox


    The StarDraw component''s tools have a lot in common with the tools found in Star-Impress.
    In fact, with respect to their toolbars, the components are nearly identical.


    This is attributable to the fact that StarImpress''s drawing view and StarDraw
    have the same goal: creating graphics. StarImpress just creates multiple graphics
    with more text and a more unified look.


    # Main Toolbar


    The Main Toolbar in StarDraw is the nerve center of this StarOffice component.
    With it, you can access a dizzying array of tools to begin your work of art.


    Those of you with good memories will recall many of these tools from the Main
    Toolbar in the StarImpress component (see Figure 18-3).


    ![](img/185096a0ec6a79f83b74a7ac44692a25_419_0.png)


    figure 18-3 The StarDraw Main Toolbar.'
