  md: 'Creating Professional Reports 325


    # Creating Professional Reports


    While charts help when reviewing your own data, you typically use them to create
    a visual impact for other people. As such, you need to create charts that look
    as professional as possible. The AutoFormat Chart tool does a great job, but it
    is not perfect. Plus, it always needs a table of data to draw from.


    The remainder of this chapter will show how charts can be edited after their creation
    and how you can create a chart on your own without a table present.


    # Operating without a Net


    If you are writing a slick-looking report, do you really want a table of data
    and a chart in the document at the same time? Perhaps, but perhaps not. If the
    chart makes the impact you want, why include the data?


    Thus far, every chart created in this chapter links directly to a table of data.
    Which makes sense, since all charts have to rely on some data. But, you can use
    StarChart to create charts from scratch, with no visible attendant table of data.
    The next task illustrates how to do this.


    # Create Charts Independent of Tables


    This task creates a chart directly within a StarWriter document without a pre-existing
    data table.


    +   1. In a StarWriter document, click and hold the Insert Objects icon on the
    Main Toolbar, then click the Insert Chart icon on the floating toolbar.

    2. In the AutoFormat Chart dialog box, enter no information and click the Finish
    button. A chart template appears in the document, as seen in Figure 14-14.

    3. By default, StarChart sets up a column chart. To change this, click the Edit
    Chart Type icon on the Main Toolbar.

    4. In the Dimensions area of the Chart Type dialog box, select the 3-D option
    (see Figure 14-15).

    5. Select the Columns type in the Type field.

    6. Select the Normal Variant and then click OK.

    7. Click the Chart Data icon. The Chart Data window appears, as shown in Figure
    14-16.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_344_0.png)'
