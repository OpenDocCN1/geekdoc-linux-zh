    # # Data Manipulation


    Manipulation is often seen as a bad thing. Most of the time it is, particularly
    when done in the extreme. No one likes to be manipulated. Certainly no scientist
    would stand for the manipulation of data.


    Like it or not though, every time you present data to others, you have likely
    manipulated it, if only subtly. This sweeping statement be made with some assurance
    for the simple reason that we show spreadsheets to others, we are always trying
    to make a point. If you want to show that hog prices are the reason bacon prices
    skyrocketed in the third quarter of the year, then you would not bury the data
    reflecting in the middle of a 500-page report on the pork industry.


    This is what I mean when discussing manipulation—the everyday massaging of data
    we all do to get our message across more clearly—


    # # Entering Data


    Data manipulation begins with a question you ask before you even start a StarCalc
    document: What data do you want to enter?'
  merge: -1
