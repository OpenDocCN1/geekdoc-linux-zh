    # Queries to Ask


    You enter data into the form, which goes into the table. All is well and happy
    in the world. Then you decide you want to know how many Spider-man comic books
    you have entered so far. You can''t see this in the form, and after entering so
    many comic books, you find it impractical to scan the table for Spider-man records.


    So, what do you do? Build a query!


    A query is a set of instructions that tells the database to pull out certain pieces
    of information and store them in a query table, which is sort like a sub-table.
    You can even edit records from the query table and have those changes reflected
    in the main database table.'
