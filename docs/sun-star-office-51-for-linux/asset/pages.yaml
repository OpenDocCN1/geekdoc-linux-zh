  md: "# Sending and Receiving Files via Posting\n\nUssgroups don't just contain messages.\
    \ They also have the ability to transfer files. \nThis is not done exactly like\
    \ an e-mail attachment. Usenet, you see, can only post ASCII text, not binary\
    \ files. To get around this, engineers devised a special encryption routine called\
    \ UUCODE. This routine splits apart an attached file into manageable chunks, compiles\
    \ the pieces into UUCODE form, and attaches each UUENCODED piece to its own posted\
    \ message.\n\nIn the early days of Usenet, before newsreaders got smart, you had\
    \ to retrieve all of the separate component messages of a UUENCODED binary file\
    \ and then UUDECODE them one at a time. If any piece was missing then you couldn't\
    \ access the file.\n\nToday, news reader applications like StarDiscussion automatically\
    \ group these messages together and UUDECODE the file automatically, so you see\
    \ only the attached file in the header pane.\n\n# Open Newsgroup File Attachments\n\
    \nThis task reveals how to open attached files in newsgroup postings.\n\n+   1.\
    \ In an open newsgroup, select a message that contains a file attachment.\n2.\
    \ In the header file pane, double-click the file to open. The attached file opens\
    \ in the message pane (see Figure 20-8).\n3. To save the file on your computer,\
    \ right-click the file and save As as the context menu.\n\nLots of newsgroups\
    \ out of Usenet pass back and forth. Many of them have the term “binaries” in\
    \ their names. These newsgroups make the best recipients of any files you would\
    \ like to share with the world.\n\n# Send Newsgroup File Attachments\n\nThis task\
    \ discusses how to send file attachments in a newsgroup message.\n\n+   1. In\
    \ StarDiscussion, begin the process to post a new message.\n2. When you've completed\
    \ the message, click the Attach File icon.\n3. In the Open dialog box, navigate\
    \ to the desired file and click Open."
  merge: -1
