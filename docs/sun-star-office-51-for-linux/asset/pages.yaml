  md: '# Chapter 2: Discovering the Components of StarOffice


    Advertising in the modern age has grown to outlandish heights. Day after day,
    images and sounds exhort us to drink this, see that, and wear these blue jeans.
    Mostly the hype is just that—hype. A certain huge sci-fi movie released in the
    summer of 1999 demonstrated this point well.


    But every once in a while, the hype has some substance to it, so we keep listening.
    StarOffice is a product where we should definitely pay attention. Here is an office
    suite that offers something other office suites does not: a totally integrated
    interface that seamlessly blends its different components.


    In Chapter 1, you were introduced to the history behind StarOffice and shown how
    to obtain and install a copy of the application for yourself. Now that you have
    successfully installed StarOffice on your Linux PC, it''s time to start it and
    see for yourself how this powerful office suite is put together. This chapter
    will guide you in doing just that\u2014\u2014 taking a grand tour of the StarOffice
    suite.


    # StarDesktop: A Better Interface


    The best place to start any tour is at the beginning. With StarOffice, that''s
    an easy place to find: it''s on the StarDesktop.


    Getting to the StarDesktop is very simple: just start StarOffice. If you run the
    KDE interface that comes with Caldera OpenLinux, do this by selecting the Personal,
    StarOffice menu command on the main KDE menu (see Figure 2-1).


    When StarOffice starts for the first time after installation, it asks you to configure
    the Internet settings using the Internet AutoPilot. If you have not have this
    yet, refer to the task in Chapter 1 "Configure Your StarOffice Internet Settings"
    for detailed instructions.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_39_0.png)


    When the startup completes, you first see the StarDesktop (see Figure 2-2). Though
    we will examine this interface in greater detail in Chapter 3, "Working with StarDesktop,\u2014\u2014
    a quick examination will now be helpful because StarDesktop is fundamental to
    the workings of the entire StarOffice application.


    The center of the screen holds the Desktop section. This displays the contents
    of any directory you want to see. Items within the Desktop can be opened with
    just a double-click. In many ways, StarDesktop serves not just as a launch pad
    for StarOffice documents, but also as a robust file navigator.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_39_1.png)'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# StarDesktop: A Better Interface


