    # Modify an Existing Template


    This task shows how to modify an existing StarWriter template.


    +   1. In any StarWriter document, select File, Templates.

    2. In the Document Templates dialog box (see Figure 7-24), select the Standard
    option in the Categories list.

    3. In the Templates list, select the Roses World Letter template.

    4. Click the Edit button.

    5. In the document that appears, make the necessary changes.

    6. Select File, Save As.'
