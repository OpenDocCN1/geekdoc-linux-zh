  md: '# Pulling StarDesktop Together


    Newsflash: the universe is mostly empty space.


    Try not to be alarmed, but this solidity thing . . . it''s just an illusion. Truth
    told, the distances between the atoms that make up everything around us are so
    vast that without molecular bonding, your hands would just slip right through
    this book. It’s energy we feel when our hands slap together, not matter.


    But the universe isn''t just a big cloud of atoms because atoms attract each other
    so well. The components of the universe work together to make the greater whole.


    The last chapter, “Working with StarDesktop,” individually examined the basic
    elements of the StarDesktop interface. This chapter will examine the capabilities
    of the StarDesktop when you use the parts as components of the greater whole.
    The following sections will review the file management capabilities of StarOffice.


    # Creating New Files


    Recall that StarOffice does not have ‘on’ switches for any of the individual components.
    You can''t just start StarWriter—you need to create or open a file to activate
    the StarWriter component.


    When you begin any project in StarOffice, you start a new file based on what you
    need to accomplish, not on what component you want to work from. For this reason,
    instead of creating new files, you create new tasks. Starting a new task is not
    a difficult feat, as StarDesktop has several places in its interface at which
    you can start the process.


    # Create a New StarOffice Task


    This task demonstrates the five different single-step processes for creating a
    new task (file).


    +   * Several new task icons appear in the main StarDesktop screen (see Figure
    4-1). Double-click the appropriate icon to begin the task.

    * In the Tasks group in Explorer, single-click any of the new Task icons to open
    a new file.

    * Click and hold the Desktop icon in the Taskbar to select from a list of new
    tasks.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_89_0.png)'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Pulling StarDesktop Together


