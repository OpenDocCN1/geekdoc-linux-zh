  md: '# Chapter 6 will examine the AutoText function in greater detail.


    # DirectCursor icon


    In word processing applications, you can only place an insertion point within
    a document that already has text. Try it and see sometime—you can''t place an
    insertion point anywhere where there are no characters, printed or non-printed.

    StarWriter defeats this limitation with the DirectCursor. Simply put, with DirectCursor
    on, you can place the insertion point anywhere on a page, regardless of where
    the text on the page lies.


    Figure 6-9 shows an example of the DirectCursor function. As you move the pointer
    across the page, a shadowy arrow appears in tandem with it.

    This shadow arrow indicates where the insertion point would land if you click
    the mouse button at that moment. This feature, by clicking the DirectCursor icon
    in the Main Toolbar, gives you incredible control over text placement, having
    to calculate indents or tab stops.


    The DirectCursor inserts tabs and paragraphs based on the current style. If you
    alter the style at a later time, the position of the text will likely change.
    For example, changing the font from a 12-point size to an 8-point size will most
    likely change the location of the text, though it should remain spaced relative
    to the font size.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_134_0.png)


    ![](img/185096a0ec6a79f83b74a7ac44692a25_134_1.png)


    Figure 6-9 Place your insertion point anywhere in the document.'
  merge: -1
