    # Group Icons


    The two Group icons, Insert Group and Ungroup, represent the final data manipulation
    method on the Main Toolbar.


    Grouping data is especially useful when dealing with very large amounts of data.
    Grouping is to spreadsheets as outlines are to documents. Grouping data allows
    data to be presented in a more streamlined fashion. When you group data, you can
    temporarily hide it from view in much the same manner as outline levels can be
    hidden.


    Chapter 12 will discuss grouping data in more detail.


