    Figure 11-21 Vertical text in a spreadsheet.


    # # Formatting Value


    Politicians love to talk about values. We need to get back to traditional values,
    they say. But whose tradition? European? Asian? African? There is no one answer.


    Nor is there one way to display data values. The different time formats have already
    been shown. Numbers, too, can be expressed in different ways. One dataset may
    project the significant value to the hundredths place, while another projects
    to the thousands place.


    Even in the English-speaking cultures, numbers carry different names. In the United
    States, citizens refer to 1,000,000,000 as a billion. In the United Kingdom, a
    billion is officially 1,000,000,000,000,000. Advocates of the Queen''s English
    refer to this as yet another example of the insidious U.S. corruption of the English
    language. Quite.


    Within a spreadsheet, it may not be obvious to readers what is a data value and
    what is text. Is that 1999 in cell C3 indicative of a year—one short of 2,000
    items, or the brand-name of a new company? The next task shows one quick way to
    find out.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Chapter 11: StarCalc Basics


    ![](img/185096a0ec6a79f83b74a7ac44692a25_263_0.png)


    # Distinguish Values from Text


    This task illustrates how to highlight all data values in a spreadsheet.


    +   1. With a StarCalc spreadsheet open, click Tools, Options.

    2. In the Options dialog box, select the Spreadsheet Document, Contents menu tree
    options.

    3. Select the Value highlighting checkbox.

    4. Click OK. The spreadsheet now displays all data values in a new color.


    # Formatting Numbers


    “Mathematics,” Galileo Galilei once said, “is the alphabet with which God has
    written the universe.” This means we had better be really careful on how we present
    our numbers. You never know Who who might be checking our work.


    One other thing: number formats vary from nation to nation, so if you create a
    spreadsheet for readers in another country; try to accommodate their conventions
    as a courtesy.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_263_1.png)


    # Change Number Format


    This task shows how to modify the format of a numeric value within a spreadsheet.


    +   1. In an open StarCalc spreadsheet, select a cell with a numeric data value.

    2. Choose Format, Cells.

    3. In the Cell Attributes dialog box, click the Numbers tab (see Figure 11-22).


    ![](img/185096a0ec6a79f83b74a7ac44692a25_263_2.png)


    figure 11-22 Setting numeric value formats.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '+   4. Select Number in the Category list.


    +   5. Select the -1234,12 option in the Format list. A preview of the selected
    number appears in the Preview window and the values in the Options area change
    to correspond to the selected format.


    +   6. Modify the format slightly by changing the value of the Decimal Places
    to 1.


    +   7. Click OK.


    # Formatting Date and Time


    Most people over the age of 30 remember the way they were taught to tell time.
    The little hand on the three, and the big hand on the twelve mean 3:00. These
    days, you can hardly find a clock that tells time in analog fashion.


    Agreement on timekeeping is still a hot issue in international circles. While
    many countries have adopted the Gregorian calendar for trade purposes, many countries
    still have their own calendars and dates. And, to make it more confusing, dates
    displayed from the same calendar can be shown in different ways. In the U.S.,
    8/14/99 translates to Germany.


    StarCalc takes all in stride and lets you choose your preferred method of displaying
    dates and times—at least based on the Gregorian.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_264_0.png)


    # Change Date and Time Format


    This task shows how to modify the format of date and time values within a spreadsheet.


    +   1. Enter your date of birth into an empty cell within any open StarCalc document.
    Use any number-based format.


    +   2. Select the cell.


    +   3. Choose Format, Cells.


    +   4. In the Cell Attributes dialog box, click the Numbers tab.


    +   5. Select Date in the Category list.


    +   6. Select the Friday, December 31, 1999 option in the Format list. In the
    Preview window, you can see the day of the week on which you were born.


    +   7. To convert the date to an hour-based format, select Time in the Category
    list.


    +   8. Select the 876613:37:46:00 option in the Format list.


    +   9. Click OK. Now you can see the number of hours, minutes, and seconds that
    have passed between Midnight, January 1, 1900 and your birthday.'
