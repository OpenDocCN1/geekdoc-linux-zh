  md: '# Putting the Stylist and Navigator to Work


    The Stylist is an underrated tool in StarOffice. In StarWriter, it hardly seems
    necessary, given the presence of the Apply Styles field in the Object Bar. In
    StarCalc, the Object Bar doesn''t contain such a field, the Stylist becomes more
    important.


    While the appearance of the Stylist varies between StarOffice components, the
    functionality of the Stylist remains the same. The Stylist window catalogs all
    available styles in each StarOffice component and lets you apply those styles
    in the active file.


    The Stylist toolbar has two sections: a style section on the left and a style
    section on the right. The contents of the style section vary in different StarOffice
    components. In StarCalc, for instance, there are only two style icons, where StarWriter
    has five icons. These style icons control the contents of the Style List in terms
    of the type to which the styles apply. This differs from the Style Category list
    as well as by further categorizing the available styles. Table 11-4 details the
    functions of the icons within the StarCalc Stylist.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_252_0.png)


    Figure 11-13 The StarCalc Stylist can style cells and sheets in the blink of an
    eye.'
