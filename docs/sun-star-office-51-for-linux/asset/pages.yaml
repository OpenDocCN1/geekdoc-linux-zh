  md: '# Chapter 8: Using the Power of Navigator


    In the old days, navigation involved telling time and charting everywhere you
    had been before. By knowing what time it was back at home and then checking the
    sun was at noon locally, you could roughly tell how far east or where you were
    from home.


    In addition to observing the sun, navigators kept charts on the color of the water,
    which way the winds were blowing, and how many days they had been sailing from
    that last island. All of these facts helped them avoid being lost at sea.


    The Navigator in StarOffice is built upon this principle of knowing where you
    are and what''s around you. This chapter will explore the basic Navigator tool
    functions in StarWriter, with an eye towards how the Navigator functions in the
    other StarOffice components.


    # Everything You Wanted To Know about a Document ...


    Let''s start right with a look at the Navigator in Figure 8-1.


    Though it looks kind of small, the Navigator is really very powerful. Not only
    can you use Navigator to view any element within a document, you can also use
    it to shift elements from one document to another.


    | Toggle Navigation Previous Object Next Object Page Number Drag Mode Promote
    Chapter Demote Chapter |

    |---|---|---|---|---|---|---||}{

    | Navigator | | | | | | | |

    | Heading | | | | | | | |

    | Table | | | | | | | |

    | Text Frame | | | | | | | |

    | Pictures | | | | | | | |

    | Objects | | | | | | | |

    | Bookmarks | | | | | | | |

    | Sections | | | | | | | |

    | Hyperlinks | | | | | | | |

    | References | | | | | | | |

    | Indexes | | | | | | | |

    | Notes | | | | | | | |


    ![](img/185096a0ec6a79f83b74a7ac44692a25_191_0.png)


    Figure 8-1 The StarWriter Navigator.'
  merge: -1
