- img_proc: true
  md: 'Chapter 16 summarized these tools. This chapter warrants a more detailed look
    at them because many more of the the icons in StarDraw''s Main Toolbar access
    floating toolbars.


    # Select and Zoom


    You''ll most use the Select icon on the Main Toolbar. You click this icon to activate
    the selection cursor. This pointer lets you select any object in the drawing document.
    One interesting thing about this tool is that it automatically starts after you
    finish using any other tool.


    The Zoom icon contains a floating toolbar that in turn contains a surprising number
    of tools. One would think that a zoom tool would have few options, but in StarDraw,
    the name of the game is control. The more control of the document you have, the
    easier it is to get down to the business of drawing.


    Clicking and holding the Zoom icon opens the floating toolbar. The Main Toolbar
    displays the last tool selected from the floating toolbar.


    Figure 18-4 illustrates the Zoom floating toolbar, and Table 18-1 highlights the
    functionality of the Zoom tools.


    All of these tools are fairly self-explanatory. The Shift tool is an interesting
    anomaly, if only because it seems to belong with the Select tool.


    To use this Shift tool, simply click its icon on the Zoom floating toolbar. The
    pointer changes to a little hand. Drag any part of the page in any direction and
    the page itself pulls in the direction you drag.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_420_0.png)


    Figure 18-4 The Zoom floating toolbar.'
