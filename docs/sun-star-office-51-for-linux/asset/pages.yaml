    used in order to keep readers interested. Web sites, marketing experts say, should
    be updated at least every four months. Not just a text update, either, but a full-blown
    redesign.


    StarOffice has many tools to explore the use of effective design and color, StarChart
    among them. StarChart really works well with its sister component StarCalc. The
    data within StarCalc is more than ready to be charted and graphed. All it takes
    is a little figuring and effort to generate great results.


    # Pies, Bars, Graphs—So Many Choices


    Let''s face it: charts are simply cool. There is nothing like that “aha!” feeling
    you get when you first look at incomprehensible raw data and then see it again
    neatly organized in a chart. Always try to achieve that “aha!” feeling when creating
    charts. Charts, like anything used in excess, can be too much for the reader to
    handle if not done well.


    And it isn''t just one kind of chart you can create with StarChart. StarChart
    has eight chart types available, five with three-dimensional versions. Table 14-1
    lists the available chart types. These 13 types are not the extent of the available
    charts, however, as each type contains a number of variants, bringing the total
    number of charts to 79!


    | Table 14-1 StarChart Chart Types |

    | Name | 3D Version? |

    |---|--|

    | Lines | Yes |

    | Areas | Yes |

    | Bars | Yes |

    | Columns | Yes |

    | Pie | Yes |

    | XY Diagram | No |

    | Net | No |

    | Stock | No |'
