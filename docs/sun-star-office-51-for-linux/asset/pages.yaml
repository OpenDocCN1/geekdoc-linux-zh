  md: '# Configure Your StarOffice Internet Settings


    The first time you start StarOffice, it displays a message indicating that it
    is initializing its components for first-time use. Once completed, the StarDesktop
    interface appears with the Internet settings - Welcome dialog box (see Figure
    1-17). Before beginning this task, gather the necessary information together so
    you have it ready for the AutoPilot when it asks. You need:


    +   * Proxy server address and port (if you have one)

    * POP3 server address

    * SMTP server address

    * E-mail user name

    * E-mail password

    * News server address


    Your network system administrator or the support staff at your Internet Service
    Provider are good sources for this information. Here''s where you start the Internet
    Settings AutoPilot.


    In this dialog box, you have the choice not to use the Internet (click Don''t
    use the Internet) or to continue with the setup program (click Next). Internet
    setup should be done as early as possible, so click Next to continue.


    > If you do not want to set up Internet access at this time, click the Don''t
    use the Internet button. You can come back and set it up later by selecting the
    File, AutoPilot, Internet Setup menu command.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_34_0.png)


    Figure 1-17 Your first chance to get StarOffice talking to the Internet.'
