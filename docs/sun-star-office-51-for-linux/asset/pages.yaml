    # Managing Your Desktops


    Hopefully by now, your desktop is neater than when you first looked at it back
    in Chapter 3. If not, fear not—StarOffice still has some more housekeeping functions
    up its sleeve.


    # Eliminating StarDesktop Clutter


    As time goes on, StarDesktop, like most other processors of knowledge, becomes
    full of scattered links and files. It''s like dust around books—it''s unavoidable.
    But, books don''t have what StarDesktop has: the capability to instantly sweep
    the clutter away using automated housekeeping tools.'
