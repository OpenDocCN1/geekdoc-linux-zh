  md: '# Conclusion


    The use of e-mail has become quite pervasive in the business and personal computing
    arenas. It has all but replaced the internal business memo and is poised to eliminate
    the postal letters home home to Mom and Dad asking for more money.


    Long before the Internet became a collection of billboards for corporations, it
    was designed to share information. Different protocols shared information in different
    ways. Gophers linked information together like one worldwide directory tree; e-mails
    handled the immediate messaging needs; and http servers became the basis of the
    World Wide Web.


    While Gopher servers have all but vanished, another early form of Internet communication
    still flourishes today: the newsgroups. Part mailing list, part bulletin board,
    and part controversial hot bed, newsgroups can be a fascinating source of expert
    and anecdotal information. In Chapter 20, you will learn how a close relative
    of StarMail, StarDiscussion, will enable you to navigate the stormy newsgroup
    waters.'
  merge: -1
