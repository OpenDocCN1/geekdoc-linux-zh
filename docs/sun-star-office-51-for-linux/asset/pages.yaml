  md: '# Chapter 6: StarWriter Basics


    106


    It was a dark and stormy night. . . The urge to put words on paper is very strong

    in most cultures. Paper and ink lend a sense of permanence that we don''t seem
    to

    have in our own brains. Scientists speculate that we do indeed remember every-thing
    we have experienced, perhaps all the way back to Minute One. But, until wenfigure
    out how to remember all of that detail, we still need to write it down.


    Clearly writing this thing will be around for some time, and it''s important that
    younhave the right tools to put your words together so you can worry about what
    to write

    as opposed to how to write it.


    The StarWriter component of StarOffice makes a great tool to get your words onnpaper
    or on computer screens around the planet. In this chapter, the basics of the

    StarWriter interface will be explored, as well as the steps used in creating special
    elements in a StarWriter document.


    # The StarWriter Interface


    They say that clothes make the man. Okay, in these politically correct times,
    it shouldnbe said that clothes make the person. But the point holds, nonetheless.


    As discussed in the previous chapters, StarWriter is not a separate application
    in the

    StarOffice suite. Think of it more as a set of clothes StarOffice puts on to go
    to

    building a document. It''s still StarOffice and shares many of StarOffice''s functions,

    with the new outfit, it''s StarWriter.


    Part word processor, part desktop publisher, StarWriter is jammed with tools and

    functions to put a document together. This section will detail the tools found
    in the

    toolbars, menus, and key combinations that make up the StarWriter outfit.


    # Exploring the Toolbars


    When StarWriter appears on the screen, the most dramatic visual change occurs
    in

    t toolbars (see Figure 6-1). First off, a new Main Toolbar appears on the screen,

    and the Object Bar gains quite a bit of functionality. Since the toolbars are
    a great

    resource while you work in StarWriter, let''s examine them more completely.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_125_0.png)'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Main Toolbar


    The new kid on the block is the Main Toolbar, a toolset tightly configured for
    the StarOffice component using it. Typically, the Main Toolbar appears on the
    left side of the screen, rather than along the top, making use of what Sun Microsystems
    calls floating toolbars.


    The icons with tiny green triangles in them, shown in Figure 6-2, indicate the
    presence of a floating toolbar. Throughout the StarOffice application, the Main
    Toolbar uses the floating toolbars, so be sure to get well-acquainted with them.


    # Insert Icon


    The Insert icon appears at the top of the Main Toolbar. Clicking the Insert icon
    reveals a floating toolbar that contains eleven tools designed to insert items
    into your document, from special symbols to entire documents. Figure 6-3 gives
    a detailed look at the floating toolbar, and Table 6-1 explains the functionality
    of each icon on the Insert floating toolbar.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_126_0.png)


    **Figure 6-1** The StarWriter interface.


    > Buzzword

    Floating toolbars: The ''sub-toolbars'' that appear when you click certain icons
    on the Main Toolbar. This is analogous to accessing the contents of a file pulling
    out a drawer.'
