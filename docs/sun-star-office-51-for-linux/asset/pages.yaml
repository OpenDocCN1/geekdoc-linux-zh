  md: 'lichés aside, so much can be conveyed in a picture it staggers the mind. If
    you have ever stood in a museum and looked at a painting for any length of time,
    you will know the sense of this statement. If you haven''t recently, you should.


    The colors and shapes contained in art trigger the deepest part of ourselves,
    our emotions. Is it any wonder industry has sprung up that uses art to manipulate
    our emotions? The industry, commonly referred to as advertising, has a single
    overriding goal: use images and words (mostly images) to get us feel good about
    parting with our money to buy a specific thing.


    Whatever your feelings are about advertising, it should be noted that for the
    most part, it works. Images are powerful to us and remember, as you learned in
    Chapter 16, "StarImpress Your Peers.\ The more pleasing (a bottle of cola glistening
    with frost) or unusual (a talking Chihuahua) the image, the more it tends to stick
    with us.


    The ability to create such stunning art becomes more accessible to the layperson
    everyday. With its vector-based and three-dimensional drawing capabilities, StarDraw
    clearly steps in the right direction towards this.


    # Vector-Based Drawing: What''s the Big Deal?


    Computer graphics have two general categories of file formats: raster and vector.
    You may know these formats under their nom de plus bitmap and geometry graphics,
    respectively.


    In the Linux environment, some raster-based graphics include:


    +   * XBM: X Bitmap

    * XPM: X PixMap

    * XWD: X Window Dump Format


    A raster-based graphic consists of thousands of individual pixels, each with a
    specific color or shade of gray.


    A vector-based graphic contains geometric objects—lines, shapes, and shades—but
    no lower limit. Another way: If you have a line in a vector-based graphic, you
    get a line. If you have a line in a raster-based graphic, you get a collection
    of dots to form a line.


    Figures 18-1 and 18-2 demonstrate a visual example of this difference. Figure
    18-1 shows a line created in StarDraw, with a thickness of 0.1 inches and viewed
    at 600 percent. Figure 18-2 shows the same line at the same view in a graphic
    converted to bitmap format.'
