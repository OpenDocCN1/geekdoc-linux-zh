    # Different Ways to View the Desktop


    When you use StarOffice, it may seem as if StarDesktop takes over the Linux Desktop
    completely. This is not the case, though. The Linux Desktop still runs, but the
    StarDesktop duplicates many of its functions.


    # Integrated Desktop View


    The Integrated Desktop view is similar to the default view of StarDesktop. It
    includes the Taskbar, toolbar, and all of the usual elements of the StarDesktop,-with
    the application title bar. In this view, the Taskbar includes Open Task icons
    for running Linux applications. Access the Integrated Desktop view by clicking
