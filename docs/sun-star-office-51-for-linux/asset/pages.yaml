  md: '# Stating Your Opinion


    Everybody has an opinion on something. Everybody. Newsgroups act as conduits to
    let those opinions out into the world.


    If you lurk around newsgroups, reading everything in sight, sooner or later you''
    be motivated to respond to a message or toss an idea for general consumption.
    This is not a difficult task in StarDiscussion, no different than sending e-mail
    messages, as you will see.


    # Posting Replies


    If you post a message to a newsgroup, chances are you will first reply to a preexisting
    message. It is simply more fun to keep a line of discussion going than to start
    a new one.


    But, a first tip on newsgroup etiquette. No matter how right you think you are
    and how goofy you think the others in the thread to which you are responding,
    try to maintain civility. Too often in electronic communications, the anonymity
    of messages to things we would never dare say to someone''s face. Manners should
    not disappear because you''ve involved a computer in a conversation. Endeavor
    to treat others on newsgroups as you would want to be treated.


    # Post a Reply to an Existing Newsgroup Message


    This task examines the method used to post replies to newsgroup messages.


    +   1. In an open newsgroup, select the message to which you want to reply.

    2. Click the Post Reply icon on the Object Bar. The pre-addressed message appears,
    as shown in Figure 20-6.

    3. Enter the text of your reply in the message window.

    4. Click the Send Message icon. The message transfers to the Outbox for transmittal
    to the news server.


    # Posting a New Message


    Maybe it''s a question. Maybe it''s the answer to why hot dogs in a baseball stadium
    taste 500 percent better than other hot dogs. It doesn''t matter—you just have
    to share it with someone! So, go ahead, post the message. In fact, post it in
    multiple newsgroups for better response.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_476_0.png)'
  merge: -1
