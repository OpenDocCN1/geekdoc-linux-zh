    12-15.

    14. Save the document.


    # Filtering Data


    Chapter 11 briefly introduced the AutoFilter concept. The AutoFilter lets you
    visually strip out unnecessary data. This is a visual action only—the data does
    not go anywhere. Rather, the spreadsheet hides it until you want to view the data
    in its entirety again.


    When used, the AutoFilter can use as many different criteria as there are columns
    in the sheet. Any data can become a filter.


    For following task, Honest Bob wants to see how many vehicles each of his salespeople
    are assigned to. The AutoFilter offers an excellent way to quickly view this information.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Use the AutoFilter to Filter Data


    This task illustrates the use of the AutoFilter.


    +   1. Open the Inventory document.

    2. Select the range A2:F13.

    3. Click the AutoFilter icon on the Main Toolbar. The AutoFilter control buttons
    appear in the first row of the range (see Figure 12-16).


    If StarCalc asks when your column headings, click Yes to make the first row of
    range act as your column headings.


    +   4. To view the vehicles being sold by Jan, click the control button in the
    Agent cell. A filter selection list appears, listing all available agents as well
    as three other options (see Figure 12-17).

    * All: Cancels any previously applied filter by allowing all values to be displayed.

    * Standard: Opens the Standard Filter dialog box.

    * Top 10: In a larger spreadsheet, it lists only rows with the top 10 values in
    this column.


    +   5. Select the Bill option. Figure 12-18 shows what the filter results look
    like. Note the nonconsecutive row numbers in the row headers.

    6. To remove the AutoFilter, set all filter lists to All.

    7. Choose Data, Filter, Hide AutoFilter, and leave the document open for the next
    task.


    You use the Standard Filter and the Advanced Filter for more defined work. The
    Standard Filter allows you to select three criteria with which to filter data,
    while you use the Advanced Filter for filters beyond three criteria.


    This may seem like a step backwards. After all, the AutoFilter can use as many
    different filter as there are columns in the data area. However, there is a more
    important difference between these filters than number of allowed criteria.


    In the AutoFilter, the AND function logically links all criteria. The other processes
    use AND or OR to perform their function. Also, AutoFilter only lets select one
    value for each criteria type at a time. Thus, if you want to see a list of all
    the cars Bill and Jim are selling, AutoFilter will not be of much use. Finally,
    only the Standard and Advanced filters let you copy filtered information to another
    part of the spreadsheet (or even another file) so you can work with separately
    from your main body of data.'
