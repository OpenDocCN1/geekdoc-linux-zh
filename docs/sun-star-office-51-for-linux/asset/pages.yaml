  md: '# Working with Functions


    Ever hear of Newton''s *Principia*? This multi-volume work is regarded as one
    of the world''s finest theoretical works. In it, Sir Isaac Newton proposes and
    proves many mathematical principles. It is a bit-detailed for most people''s tastes:
    Newton spends hundreds of pages proving that one plus is equal to two.


    Thanks to Newton, and many others, there are many mathematical functions used
    in the world today. Thanks to accountants, there are a few more.


    In StarCalc, you have access to 258 functions. This is too many to list here.
    But the Categories and Functions topic in StarOffice''s Help system contains a
    very detailed list of functions by category that explains what one does.


    # What Functions Do


    A function is a mathematical operation that compares two or more values to each
    other in a predetermined way and produces a new result. In the mathematical equation
    “two plus two equals four,” two and two are the values, plus is the arithmetic
    operation, and equals is the comparative operation.


    Functions can be simple (SUM, PRODUCT) or complicated (ACOT, CONFIDENCE) to understand.
    Their basic premise never changes: insert the right kind of values and you get
    a result. It is important to know what values are valid with which functions.
    You can''t really apply the SIN function to a currency value: the SIN function
    applies to angles. Again, the Help system can inform you of valid value types
    for each function.


    Functions should be distinguished from operators. Operators are essentially short-hand
    for functions. When you write $2 × 2 × 2 = 8$ on paper, you can use the multiplication
    operator (\*) to mimic this in StarCalc:


    ```

    =2*2*2

    ```


    Using the multiplication operator is the same as using the PRODUCT function, in
    a shorter form.


    ```

    =PRODUCT(2;2;2)

    ```


    You can find an excellent list of the operators available in StarCalc (including
    cell reference operators) in the Help system''s “Operators in StarCalc” topic.


    # Exploring the Function List


    Building a function in StarCalc is a lot like building cell references. In fact,
    every time you build a reference you create a StarCalc function.'
