  md: '# Read Mail Messages


    This task reviews the steps to read messages in the Inbox.


    +   1. In any component of StarOffice, open the Explorer window.

    2. Click the E-Mail & News group bar, then double-click the Inbox folder to open
    it.


    > If you do not have a visible Inbox, you can create one very quickly by right-clicking
    in the E-Mail & News group and clicking New, POP3 Account or New, VIM Account
    and filling in the pertinent information in the dialog box.


    +   3. If you have not done so recently, update the contents of your Inbox by
    right-clicking the folder and clicking Update in the context menu. You can have
    the Inbox automatically update when opened by clicking Update on Open in the folder''s
    context menu.

    4. Once new messages are in your folder, select any of them in the message list
    pane. If the message content is not stored locally, there will be a slight pause
    while the content downloads from the server.

    5. After reading the message, click the Next Unread Message icon on the Object
    Bar.

    6. Repeat Steps 4 and 5 until you have read all of the new messages.


    Even though you have looked at the message and digested what it says, StarMail
    does not consider it as read until you actively mark it as such. As said before,
    this is a status indicator that you can use to get your advantage. You may want
    to keep a message as "unread" until you have taken action on it, for instance.
    Luckily, marking messages is remarkably simple.


    # Mark Messages You''ve Read


    This task reviews the steps to take to mark messages as read in the Inbox.


    +   1. In the StarMail component, select an unread message.

    2. Double-click the message to officially read it.

    3. To mark a number of messages as read, select them holding either the Ctrl or
    Shift keys while clicking.

    4. Click the Message/Unread icon on the Object Bar or press Ctrl + S.'
