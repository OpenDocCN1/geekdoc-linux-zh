  md: '# Reports to Make


    A query is nice for those occasions when you seek information for yourself on
    your Linux PC. But, if you want to share the information with others or want to
    transport the information, a report is the way to go.


    A report differs from a query only in the type of output. Reports are read-only.
    Once information is in a report, you cannot change it there. You would have to
    change data in the database table and re-run the report to make changes on the
    report.


    # Create a Report with AutoPilot


    This task illustrates the method for creating a report in StarBase using the Report
    AutoPilot.


    +   1. In Explorer, right-click the Reports icon under the Comic Book database.

    2. Choose New, Report from the context menu.

    3. The Table Selection dialog box of the AutoPilot opens. Confirm that the selected
    Data Source is the Comics table and click the Next button.

    4. Move all fields in the Field Selection dialog box to the Chosen Fields box
    and click Next.

    5. In the Outline dialog box, you can choose how to group the data in the report.
    Select Publisher in the Group By field and click the right arrow button. Figure
    13-29 displays the end-result of this action.

    6. Click Next.

    7. In the Sort Options dialog box, select these values for fields 1, 2, and 3,
    respectively: Title, Volume, and Issue. When you''ve finished, click Next.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_329_0.png)


    Figure 13-29 Group your data into categories.'
