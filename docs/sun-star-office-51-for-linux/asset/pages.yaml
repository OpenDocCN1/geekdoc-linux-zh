    # Conclusion


    With each passing day the world grows smaller and smaller. We can reach out and
    touch so many lives with just a click of the mouse—staggering to think about times.


    But this extra communication comes at a price: the rapid shrinking of the time
    we have available to work with all of these people. As much as the world around
    us, time remains the one constant.


    To help manage time on a personal level, StarOffice has included its own Personal
    Information Manager (PIM) application in the form of the StarSchedule component.
    Chapter 21 will review the tricks and techniques of schedule management with StarSchedule.'
