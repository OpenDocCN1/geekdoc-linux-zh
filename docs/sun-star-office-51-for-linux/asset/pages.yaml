    polygon to deactivate the polygon cursor.


    +   2. Click the Edit Points icon on the Option Bar.


    +   3. Drag any of the object editing handles to change the shape of the polygon.


    Lines have a functional purpose as well as an aesthetic function. In StarDraw,
    connectors have the job of joining objects on the page together. This function
    is very useful when creating that most fluctuating of business documents, the
    organization chart.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_439_0.png)


    # Connect Objects Together


    This task steps through the procedures used to create connectors between objects
    in StarDraw.


    +   1. In an open StarDraw document, click and hold the Connector icon on the
    Main Toolbar and then click the Connector icon within the floating toolbar.


    +   2. Drag the connector pointer across the screen. As you do, note the appearance
    of connector selection boxes around each object passed over.


    +   3. Click on the desired object and drag the cursor to the next object.


    +   4. Release the mouse button. Figure 18-19 shows the initial result of this
    action.


    +   5. To change the connector position, drag the red connector handle until it
    aligns with one of the four connection handles on the object.


    +   6. Repeat the action, if necessary, on the second object (see Figure 18-20).
    If you connect the connector lines to the object connection handles, then dragging
    either of the connected objects automatically brings the connector with it.


    # Giving Texture to Your Art


    Sight is a major sense for human beings. The sense of touch is another major sense
    for us, too. If an object looks appealing, we feel this compulsion to reach out
    and touch it. The use of textures often brings about this appealing look.


    Textures can create positive or negative feelings about the object on which they
    are applied. A sphere with a metallic gleaming surface invokes memories of a cool,
    smooth touch. The same sphere given a wooden texture invokes exactly the opposite
    memory.'
