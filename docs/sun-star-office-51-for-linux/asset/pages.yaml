  md: 'Accountants aren''t the only ones using spreadsheets these days. With online
    banking, online trading, and online loan applications available to the average
    consumer, more and more people use spreadsheets to track their rapidly changing
    finances.


    This new demand, coupled with the already present needs of the business world
    for clearer, faster reporting, requires a spreadsheet program to be pretty powerful.
    StarCalc delivers the spreadsheet power you need to your Linux desktop. This component
    of StarOffice delivers many of the same functions found in Microsoft Excel or
    Lotus 1-2-3 and maintains interoperability with the rest of StarOffice.


    This chapter will review some of the basics of spreadsheets and StarCalc in particular.
    In addition, value formats and data formatting will be explained.


    # Cells, Rows, and Columns: A Spreadsheet Primer


    You have likely used a spreadsheet before, at one time or another. Many users,
    often do not create or modify the basic workings of the spreadsheets they use.
    They just plug in the numbers and print the assigned reports like they''re supposed
    to.


    There comes a time in computer users'' lives when they need to create a spreadsheet
    for themselves. At that time, it''s a good idea to know how these spreadsheet
    doodads work.


    It all comes down, more or less, a familiar type of cell is the basic building
    block of your body. There are many different types of cells: nerve cells, skin
    cells, liver cells—the list goes on and on. But no matter kind of cell you look
    at, they all have pretty much the basic structure: nucleus, plasma membrane, cell
    wall, mitochondria, and other hard-to-pronounce components. Even though they have
    the same overall structure, cells can have vastly different jobs because of the
    specialized way they have been put together.


    The same applies to spreadsheet cells. They are all rectangular and they all can
    contain data. Each cell in a spreadsheet can have a different task. One cell may
    be empty, filled in with an attractive shade of purple. Another cell may contain
    the number 42. Still another may contain a formula that refers to the number 42
    and displays something completely different. Cells are all the same, but they
    can be used in many different ways.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Cells, Rows, and Columns: A Spreadsheet Primer


    Cells are typically positioned and referred to rows and columns. By universal
    convention, spreadsheet rows are denoted with numbers and columns with letters.
    Because spreadsheets sometimes need more than 26 columns, the columns after the
    letter Z move to a two-letter notation (AA, AB, AC, and so on). This lettering
    convention continues to column IV, making 256 the maximum number of columns a
    Star-Calc spreadsheet can have. A spreadsheet can contain 32,000 rows, giving
    you the potential to fill 8,192,000 cells. With over 8 million cells to fill,
    you probably won''t run out of space to perform the needed calculations, maybe,
    you work for NASA.


    You identify cells by their row and column position in the spreadsheet. The cell''s
    four rows down and eight columns across is identified as cell H4. Find the cell
    reference by looking at the bold column and row headings or reading the coordinates
    from the Sheet Area field in the Formula Bar, as seen in Figure 11-1.


    Multiple cells are called ranges. A solid black fill denotes a selected range
    of cells. The coordinates of a range include the cell in the upper left corner
    of the range and the cell in the lower right corner of the range. Thus, you would
    reference the range selected in Figure 11-2 as D2:G14.


    | Sheet Area Coordinates | Bold column heading | Bold row heading |

    | --- | --- | --- |


    ![](img/185096a0ec6a79f83b74a7ac44692a25_242_0.png)


    Figure 11-1 Reading a cell''s coordinates.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 224 Chapter 11: StarCalc Basics


    Coordinates D2 Range


    ![](img/185096a0ec6a79f83b74a7ac44692a25_243_0.png)


    Figure 11-2 Reading a range''s coordinates.


    The range in Figure 11-2 is an unnamed range. You can give a proper name to a
    range, which you can refer to in a formula. Naming ranges minimizes confusion
    caused by a number of unintuitive coordinates. Chapter 12, “Breaking Out of the
    Cell,” will review this feature in more detail.


    You''ve got the basics down. As you progress through the chapter, you will start
    to see how the cells of a spreadsheet fit together to make a body of data.


    # Learning the StarCalc Interface


    When you start cooking, you want to have all of your ingredients out on the counter
    before you begin. Nothing is so frustrating as having to stop and find the jar
    of saffron when your hands are covered in flour. Even better, have your ingredients
    chopped, cut, and measured before you begin for true speed.


    The same concept applies when building a spreadsheet. You need to have all of
    your tools before you begin. In this section of the chapter, the StarCalc tools
    will be examined, with special emphasis on those tools unique to StarCalc.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Working with StarCalc Tools and Menus


    If you have read Part II of this book, you will notice that the StarCalc and StarWriter
    interfaces have many similarities (see Figure 11-3).


    StarCalc, of course, makes use of the ubiquitous Function Bar. As in all of the
    StarOffice components, its toolset remains the same. If you need to review the
    Function Bar, refer back to Chapter 6, "StarWriter Basics."


    In addition to the Function Bar, StarCalc offers the Main Toolbar, the Object
    Bar and a new toolbar, the Formula Bar. StarCalc also has a window: the Function
    List. This dockable window has one very important purpose: to list every available
    function StarCalc can perform (258 of them in Version 5.1). Chapter 12 will discuss
    this window in more detail.


    # Main Toolbar


    The Main Toolbar in StarCalc shares many of the same tools with the Main Toolbar
    in StarWriter. It also shares the floating toolbar interface on many of its icons.


    Some differences, though, need to be examined. Not all are readily apparent, but
    they''re there nonetheless. Figure 11-4 highlights all of the icons on the Main
    Toolbar of StarCalc. The following sections describe only those icons that have
    different or new functions than their StarWriter counterparts.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_244_0.png)


    Figure 11-3 The primary toolsets of the StarCalc interface.'
  merge: -1
  pgno: 244
