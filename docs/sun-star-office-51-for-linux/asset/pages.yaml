    Text


    With all of the hullabaloo about art and drawing, it may seem odd to include a
    text tool in StarDraw. Sometimes, though, things need to be spelled out.


    Technical drawings illustrate this need, as do advertisements. After all, what
    good is a stunning ad if it doesn''t include the product name?


    The Text icon accesses a small floating toolbar (see Figure 18-5). This toolbar
    contains three tools: Text, Fit Text to Size, and Callouts.


    The Text icon starts the text cursor. Once, simply drag the cursor across the
    drawing to form a rectangular text area. When you release the mouse button, you
    can enter the desired text into the box. Use the tools found in the text version
    of the Object Bar to format the text.'
