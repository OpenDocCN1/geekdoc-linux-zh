  md: '# Installing StarOffice


    After successfully downloading the StarOffice installation file, it''s time to
    start unpacking and installing. We use the term "unpacking" because as big as
    the installation file is, the .TAR extension on the file name means it has been
    compressed to a larger file size. Thus, you need to uncompress the .TAR file,
    returning it to its actual size.


    To do this, run a Terminal window on your Linux desktop. In the command line interface,
    use the cd command to navigate to the directory where you saved the installation
    file. Once there, type the command tar xvf s05a_lnx_01.tar. This creates the /so51inst
    subdirectory. Navigate to that directory using the command cd so51inst, and then
    run the README file.


    > If you have downloaded the file segments, run the tar xvf command for each of
    the seven tar files. If you have saved them in the same directory, their contents
    will be unpacked into the same destination directories.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_29_0.png)


    The README file contains valuable, current information on installation problems
    and procedures. In particular, it addresses the needed presence of the glibc2
    libraries. Without these libraries in place, StarOffice does not install or run
    properly. Review the instructions within the README file and follow them precisely.


    Once you have glibc2 libraries in place, navigate to the /office51 directory by
    typing cd office51.


    You are now ready to install StarOffice.


    # There''s a Lizard in Your Computer!


    Okay, admitted, it''s not a full-blown, green, scaly creature with cravings for
    flies. But, nonetheless, a Lizard now resides in your computer. Sun Microsystems
    has inherited an installation program with this quirky name. And, in the first
    task of the book, you use the Lizard (Linux Installation Wizard) to install StarOffice.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_29_1.png)


    # Install StarOffice 5.1


    Complete this task to install StarOffice 5.1 for Linux.


    +   1. In the /so51inst/office51 directory, start the setup program by typing
    ./setup. The setup program starts, as shown in Figure 1-9.

    2. The first dialog box of the program welcomes you and displays a Next button.
    Click this to continue.'
