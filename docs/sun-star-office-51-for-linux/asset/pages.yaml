- img_proc: true
  md: '# Everything You Wanted to Know About a Document...


    Many of the icons in the Navigator floating toolbars. These toolbars specify the
    different kind of objects to which the navigator can maneuver. For instance, if
    you want to scroll through the document from graphic to graphic, you can specify
    this in the various object floating toolbars. Table 8-1 describes the functions
    of the icons and fields within the Navigator.


    | Table 8-1 The Navigator Tools |

    | Name | Function |

    | Toggle | Switches between Normal view and Master view (only within a master
    document). |

    | Navigation | Click and hold to reveal floating object toolbar. Select an object,
    which will in turn be used by the Previous Object and Next Object icons. |

    | Previous Object | This icon shifts the document back to previous object type.
    |

    | Next Object | This icon shifts the document forward to next specified object
    type. |

    | Page Number | Enter a page number in this field to navigate to that page instantly.
    |

    | Drag Mode | Choose the end result of click and drag actions when moving objects
    from one document to another. |

    | Promote Chapter | In a master document, moves selected chapter towards beginning
    of a document. |

    | Demote Chapter | In a master document, moves selected chapter towards end of
    a document. |

    | List Box On/Off | Turns List Box in the Navigator on or off. |

    | Content View | List Box changes to show only the currently selected object type.
    |

    | Set Reminder | Places a reminder in the document. |

    | Header | Jumps to nearest header. Jumps back to main document text on next click.
    |

    | Footer | Jumps to nearest footer. Jumps back to main document text on next click.
    |

    | Anchor <-> Text | Toggles cursor back and forth between footnote anchor and
    footnote text. |

    | Outline Level | Selects the lowest outline level displayed in the Navigator.
    |

    | Promote Level | Shifts selected heading down one level. |

    | Demote Level | Shifts selected heading down one level. |

    | List Box | Lists all elements contained within active document. |

    | Open Documents | Lists all open documents in StarWriter, distinguishing between
    active and inactive documents. |'
