  md: '# Open a File


    1. In any StarOffice component, choose File, Open or click the Open icon on the
    Function Bar. The Open dialog box appears (see Figure 4-2).


    2. Navigate to the file you want to open by double-clicking folders in the file
    list to move down the directory tree. Move up the directory tree by clicking the
    Up One Level icon.


    3. When you select a file, the file name appears in the Filename field. Click
    Open to begin editing the file.


    Other methods for opening an existing file include:


    +   - Typing the file name and path directly in the Filename field.

    - If the file has been edited recently, open the Filename list and select the
    file from the list.


    A closer look at the Open dialog box is in order, as it is a deceptively useful
    tool. The icons indicated in Figure 4-2. Table 4-2 details these icons and their
    functions.


    # Table 4-2 Open Dialog Box Controls


    | Icon | Function |

    | --- | --- |

    | List | Changes to List view in the file list. |

    | Details | Changes to Details view in the file list. |

    | Up One Level | Moves to the next highest folder level in the file list. |

    | Create New Directory | Creates a new subdirectory in currently viewed directory.
    |

    | Default Directory | Returns the file list to the default directory. |


    ![](img/185096a0ec6a79f83b74a7ac44692a25_94_0.png)


    Figure 4-2 The Open dialog box.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Chapter 4: Managing Files in StarDesktop


    Holding down the Up One Level reveals a list of all of the folders "above" the
    current folder, all the way up to the Workplace listing. Holding down the Default
    Directory reveals a list of several locations to navigate to, including the Explorer
    groups, the Templates folders, and the Desktop.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_95_0.png)


    The Open dialog box is not the way to start editing a file. You can also:


    +   - Navigate to the file in Explorer (and Beamer) and open it directly from
    there with double-click (single-click for groups not in Hierarchical View mode).


    ![](img/185096a0ec6a79f83b74a7ac44692a25_95_1.png)


    To open a file within a new window, hold the Shift key while double-clicking the
    file''s icon on the StarDesktop.


    +   - If the file has been recently edited, open the File menu and choose the
    file from the list at the bottom of the menu.

    - Type the file name and path directly into the URL Name field in StarDesktop.

    - If the file has been edited recently, open the URL Name list and choose the
    file name from the list.


    # Saving Files


    You''ve done your work, and now it''s time to turn the computer off. Before you
    go, you should save your files for later distribution. But what if not everyone
    getting this file has StarOffice. How will they be able to read the documents?


    Saving your files in StarOffice is very easy. Sharing them with others is not
    challenging, either, as StarOffice gives you almost as many formats to save to
    as it can open. Tables 4-3 through 4-8 list the file types to which the individual
    StarOffice components can save.'
