  md: '# Validating Your Data


    What is data validation?


    In short, data validation is a way that StarCalc can make sure the right kind
    of data is entered in the right place.This has been alluded within the StarCalc
    chapters of this book. You would hardly want a time value creeping into a statistical
    report, would you? This is called data type validation.


    In addition, StarCalc performs another kind of validation for data: data value
    validation. Take, for example, a baseball player''s batting average, which is
    a running average of the number of hits per number of times at bat in a given
    time frame. This is presented as a three digit fraction (Sammy Sosa''s lifetime
    batting average, for instance, .267).


    If someone were entering batting averages into a StarCalc spreadsheet, you would
    not want them to enter a value such as an integer. That would be out of the proper
    range of values.


    Another feature of data validation in StarCalc is the capability to create customized
    error messages. This is especially helpful for those of you who got tired of trying
    to figure out what cryptic "501: error" messages mean. Now, error messages can
    inform about exactly went we want and how to fix it.


    For the following tasks, Honest Bob wants to keep track of the number of makes,
    models, and types of vehicles he has on his lot at a given time. Knowing the type
    of vehicle allows him to budget his advertising spending for the month (if he
    has a large number of trucks, he can spend more money on advertising in a local
    SUV club''s magazine, for instance).


    Bob wants to ensure the validity of data in this new table, no matter who enters
    it. Some of his salespeople are not the most computer literate, it seems.


    The next task details how Bob could go about this.


    # Create Input Validation Rules and Messages


    This task guides you through the steps to create input validation rules and input
    help messages.


    +   1. In the Inventory document, move to the inventory breakdown table begun
    in the "Grouping Data" section of this chapter.

    2. Select range C24:E30.

    3. Choose Data, Validity. Figure 12-27 shows the Data Validation dialog box.

    4. On the Values tab, select the Whole Numbers option in the Allow list.


