  md: 'To close the Tip window, click the arrow icon on the window control bar. Drag
    the same control bar to resize the window. To turn off the Tip window until the
    next start up, click the Close icon.


    If you do not want the Tip window to ever appear, select the Don''t display tips
    box.


    To bring the Tips back at start up, open the Options dialog box using the Tools,
    Options command. Select the General, Other options on the directory tree and in
    the Tips section, select the Reset Tip List option.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_86_0.png)


    # A Little Help, Please


    As you learned in Chapter 2, the Help Agent proactively provides context-driven
    help on any part of StarOffice. In English, that means whenever you click an icon,
    button, or window on the screen, the Help Agent responds by giving you detailed
    help on that object.


    In Figure 3-30, you can see the Help Agent with its various icons highlighted.
    Table 3-3 lists the functions of each of these icons.


    | Table 3-3 Icons on the Help Agent Toolbar |

    | Name | Function |

    | Contents | Opens the Help contents page. |

    | Back | Navigates back to a previously viewed Help page. |

    | Forward | Navigates forward from a previously viewed Help page. |

    | Stop | Stops a Help file from loading. |

    | Zoom Out | Enlarges the font size of the Help file. |

    | Zoom In | Decreases the font size of the Help file. |

    | Find | Opens the Search dialog box. |

    | Question | Opens the Question page, where you can ask a plain-English question.
    |

    | General Help | Opens a new StarOffice window, and displays the Help contents
    page. |'
