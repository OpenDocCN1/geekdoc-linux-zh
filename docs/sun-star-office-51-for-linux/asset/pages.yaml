  md: '# # StarDesktop Tools 63


    ![](img/185096a0ec6a79f83b74a7ac44692a25_82_0.png)


    **Figure 3-23** Viewing files with Beamer.


    # # Navigator: Viewing Files at the Molecular Level


    The Navigator is one of the StarDesktop tools that that changes drastically from
    component to component. Figure 3-24 shows how it looks in StarImpress. Compare
    that to the number of controls within Navigator in StarWriter (see Figure 3-25).


    While this tool differs from one StarOffice component to the next, its general
    purpose remains the same: to list all the elements of an open file and aid you
    in navigating between elements.


    Throughout its many forms, Navigator behaves similarly as a window. Navigator
    floats by default, like Explorer and Beamer, it can, be docked.


    To dock the Navigator, hold Ctrl and double-click, but this time on the border
    of the window, not within the window. Doing achieves the effect shown in Figure
    3-26.


    As we review each of the individual StarOffice components throughout the book,
    we''ll examine the Navigator''s specific abilities as well.'
