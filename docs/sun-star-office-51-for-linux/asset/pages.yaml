  md: '# Taking Off with AutoPilot


    the kitchen of the future was supposed to be a gleaming, metallic wonder that
    would cook a full dinner at the touch of a button. Boy, have things changed. While
    we still wait for that fully automated kitchen, StarWriter has some automated
    devices that do. These tools are called AutoPilots, and like their aviation name-sakes,
    they get you where you need to go with a minimum of fuss.


    In addition to AutoPilots, StarWriter has other, less flashy functions to assist
    you in document creation. These functions—including Auto Spellcheck, templates,
    Auto-Correct, and Search & Replace—will be examined in this chapter.


    # Taking Off with AutoPilot


    In an airplane, autopilots assist the pilot in getting from point A to point B.
    Autopots are not really supposed to fly the plane for the entire flight. The important
    stuff—takeoffs, landings, and not hitting the ground—these activities still need
    the pilot’s supervision.


    And so is it with StarWriter’s AutoPilots, which assist you in creating specialized
    documents, but don’t create your documents for word.


    The technique for creating a business letter can be a puzzle to some. Where does
    the date go? Where does the recipient’s address sit? AutoPilot can help you with
    the details, so you can focus on the content of your writing, and the form.


    # AutoPilot Correspondence


    With the advent of e-mail, many people regard letters as an old-fashioned way
    to communicate. But as long as we have the need to hold a solid piece of paper
    in our hands, letters will be considered more ‘official’ their electronic counterparts.


    The AutoPilot Letter is a step-by-step series of dialog boxes that walk you through
    the mechanics of letter writing so you can get to the business of writing the
    letter.


    # Create Letter


    This task details the steps involved in the creation of a business letter using
    the AutoPilot Letter. At any time, you can click the Create button to stop the
    AutoPilot and start the new letter document. This task guides you through all
    of the possible steps.


    +   1. In any component of StarOffice, choose File, AutoPilot, Letter.


