  md: '# Chapter 17: Create the Best Presentations


    True, you''ll need to keep some design changes in mind when creating Web pages
    from StarImpress presentations, which will be reviewed shortly. For the most part,
    however, a StarImpress presentation ideally converts to a Web page. It has color,
    backgrounds, and graphics, which all enable the presentation to “fit in” on the
    Web.


    Keep in some key differences as you think about moving your work to the Internet.
    The foremost difference is the organizational style of a presentation converted
    to HTML and a standard Web site. A standard Web site supports the paradigm—visitors
    enter the site at the central trunk of the tree (the home page) and from there
    can move through the branches of the tree as far as they want. In a presentation-turned-Web-page,
    the layout of information is serial. Visitors view the information from start
    to finish, moving through one page after another in sequential order.


    For this reason, a StarImpress presentation should never take the place of a conventional
    Web site. But it can be a valued component of a site.


    In StarWriter, when you converted documents to HTML, you essentially saved the
    document as a new format. For StarImpress files, you achieve HTML conversion by
    exporting the presentation into a specialized Web page interface that lets users
    navigate through each slide as a graphic. The following task details this this
    process.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_411_0.png)


