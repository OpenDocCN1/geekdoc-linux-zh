  md: '# Chapter 3: Working with StarDesktop


    ![](img/185096a0ec6a79f83b74a7ac44692a25_79_0.png)


    Figure 21 The Task group in Hierarchical mode.


    Five standard groups come with StarOffice:


    +   - E-Mail & News. Contains any e-mail or newsgroup messages.

    - Tasks. Contains shortcuts for creating any type of StarOffice document.

    - Work Folder. Offers a view of your primary work directory.

    - Bookmarks. Contains a list of all bookmarked files and Web pages.

    - Explorer. Shows a hierarchical view of all StarOffice files and all files on
    the host PC.


    You are not limited to these five groups, however. On the top of the group bars,
    notice the group bar not yet mentioned: the New Group. This special group bar
    allows you to create groups of your own.


    # Create a New Group in Explorer


