    Like the Navigator and Stylist windows, you can dock the Help Agent with the Ctrl
    + double-click action on the window''s border.


    # # Conclusion


    This chapter has covered a lot of material, taking you through all of the ins
    and outs of the StarDesktop interface. This basic review is essential, however,
    as you will utilize these tools in all of the other StarDesktop components.


    Chapter 4, “Managing Files in StarDesktop,” goes beyond the interface of StarDesktop-
    and into file management using traditional folders and directories. You will even
    learn how to use the desktop itself to organize your work!'
