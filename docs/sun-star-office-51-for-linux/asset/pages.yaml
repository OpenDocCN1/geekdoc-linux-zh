  md: '# Jazzing Up Your Online Documents


    Okay, you say, that was pretty easy, but those Web pages are pretty boring! No
    pictures, no hyperlinks, nothing to write about.


    Web pages, which used to be just text and a couple of pictures, have become synonymous
    with multimedia these days. If you don''t have artwork, scads of links, and other
    gimmicks, your page is boring.


    # Inserting Hyperlinks


    A hyperlink is the natural extension of hypertext—a concept dreamed up as early
    as 1945 by Vannevar Bush. Bush''s basic premise was that since the human mind
    often remembered things by association, then information should be mapped out
    using associative links.


    All this is behind the creation of a hyperlink—an act made so simple by StarWriter,
    it''s easy to take for.


    Hyperlinks are passages of text with special HTML tags called anchors around them.
    The official tag syntax is <ANCHOR>, but today most browsers recognize the shorthand
    <A>.


    In HTML, hyperlinked text might appear like this:


    ```

    For more information on StarOffice, visit the <A HREF="http://www.sun.com/starof-fice">StarOffice
    Web Site<A>.

    ```


    HREF is the parameter of the anchor tag that lists the address of where to should
    the user click on the link.


    Again, this is useful to know if you ever need to get into the guts of your Web
    page and do some tweaking. For the most part, StarWriter takes care of this for
    you, as seen in the next task.


    # Insert Hyperlinks into a Web Page


    This task demonstrates the steps needed to create a hyperlink in a Web page.


    +   1. Open the Modern1.html document.

    2. Personalize the template page to your specifications. An example is shown in
    Figure 10-4.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_229_0.png)'
