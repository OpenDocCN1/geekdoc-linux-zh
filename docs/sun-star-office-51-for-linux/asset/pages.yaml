    # StarCalc Prognostication


    The future is just a second away. What happens when you reach the end of this
    sentence? Does the phone ring? Does a meteor crash through your house? Events
    like these are a hard to predict. But predicting the future in some small way
    is vital for many businesses, so they can be properly prepared for the worst.


    StarCalc''s Scenario functions let you play with the data in your spreadsheet
    to see what would happen if certain events occur.


    For Honest Bob, since an event is rain. Over the years, Bob has learned the wetter
    season, the less cars he sells, and the more he has to bring his prices down to
    eventually get the cars off the lot.


    So, Bob likes to see how much his vehicles might sell for in a dry season, a moderate
    season, or a wet season. Rain affects prices differently for each vehicle type.
    Trucks always sell better than vans, which in turn sell better than cars, no matter
    what the weather.'
