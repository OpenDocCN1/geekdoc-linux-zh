  md: 'Pies, Bars, Graphs—So Many Choices 35


    With all of these charts to choose from, it would be a bit much to show examples
    of all of them. To keep things simple, this chapter will focus on the creation
    of the three most commonly used chart types: pie, bar, and graph.


    # Baking a Pie


    Pie charts provide an excellent vehicle for showing percentage values in a clear
    fashion. When we can see a given piece of the pie in relation to the other pieces,
    we get a pictorial representation in our minds that affects us in a deeper way
    than do numbers.


    Honest Bob has a problem. His sales staff receives annual bonuses based on their
    contributions to the company''s annual sales performance. In order to provide
    his staff information on where they stand (and give them some incentive), Bob
    wants to show them their progress, but doesn''t want to show what he considers
    to be private financial information.


    A pie chart ideally suits this type of situation. It will project the information
    for Bob without revealing too much detail.


