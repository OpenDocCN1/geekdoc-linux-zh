  md: '# Outline View


    The Outline view in StarImpress facilitates the entry of clean and well-organized
    text within the slides. Because all of the text in the slides belongs to one big
    outline, this is a key view to use in StarImpress. The points on the screen should
    support and organize your presentation, not repeat it for word.


    The tools and interface in the Outline view are rather simple, since the Drawing
    view handles most of the formatting and special effects. Figure 16-8 reveals a
    look at the Outline view.


    The Object Bar remains the same as the text Object Bar in the Drawing view, though
    several icons are not available in this view. You can access neither the Option
    Bar nor the edit mode controls in the Outline view.


