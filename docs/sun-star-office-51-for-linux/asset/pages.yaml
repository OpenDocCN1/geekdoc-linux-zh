    # # Borrowing from Other Files


    As explained before, you can copy certain objects from one document into another
    by dragging the object between documents.


    Big deal, you might say, cutting and pasting does the same thing. Though this
    is true, cutting and pasting does not allow you to create a hyperlink in one document
    to an object in another document. Nor does it let you create embedded links that
    reflect any edits made to the original object in the destination document.


    Using Navigator to copy objects enables you to use three copying methods, which
    Table 8-2 also notes the restrictions of each method.


    # **Table 8-2 Navigator Object Copy Methods**


    | Method | Function | Availability |

    |---|---||

    | Hyperlink | Drag an object into another document to create a hyperlink to original
    object. | Works with all objects. |

    | Link | Drag an object into another document to create a protected link to original
    object. | Does not work with graphics, OLE objects, references, and indexes. |

    | Copy | Drag an object into another document to create a copy of the original
    object. | Does not work with graphics, OLE objects, references, and indexes. |'
