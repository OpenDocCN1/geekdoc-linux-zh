    # Reading Your Mail


    Information in the StarMail interface divides into two main categories: message
    and header. The top and the bottom panes in the interface are the message list
    and the message content panes, respectively.


    Items in bold in the message list indicate unread items. You can, however, select
    any message in the message list in order to display and read it in the message
    content pane.


    The header panes contain more technical information about the message. The left
    header pane contains the pertinent header fields, such as Subject, From, and To.
    The right header pane lists the files contained within the message. This pane
    always displays a text file, which contains the content of the message.


    While the read mail interface has no Main Toolbar, the Object Bar (shown in Figure
    19-2) has more than tools to make up for this. Table 19-1 details what each icon
    on this toolbar can do.


