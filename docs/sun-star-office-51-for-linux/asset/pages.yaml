  md: '# Chapter 7: Shifting Into Automatic with StarWriter


    ![](img/185096a0ec6a79f83b74a7ac44692a25_175_0.png)


    # Using Templates to Get Ahead


    Shortcuts, when they work, are good things. Scientists predict that when we figure
    out how to get to the nearest star, it will likely be because we have figured
    out a way to get around the space that lies between our Sun and Alpha Centauri—perhaps
    by means of the shortcuts now found in science fiction, such as the tesseract,
    hyperspace, or warp drive.


    Templates are, for all practical purposes, shortcuts. They offer a way to start
    a StarWriter document without all the configuration bother.


    # Exploring Templates


    Templates can be any files you want to use as a model to create new files. This
    is not a big secret. Many people who want to create a new newsletter simply open
    up the old newsletter file, erase all the old content, and use the remaining skeleton
    of the newsletter as a template.


    And that''s okay, if you want to hassle with the erasing and rebuilding of content.


    But there is a better way in StarWriter. First, a look at the templates provided
    by StarWriter is in order.'
  merge: -1
  pgno: 175
