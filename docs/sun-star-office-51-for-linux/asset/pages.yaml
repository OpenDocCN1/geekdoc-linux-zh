  md: 'o matter how successful you are or how many friends you have, it all comes
    down to this: you have a finite number of years to romp about this world. I say
    this not to panic anyone, but rather to raise another point. If you have only
    a set of minutes to hang around, shouldn''t you get the work done as efficiently
    as possible so you can go out and enjoy the rest of life? Thought so.


    Which brings us to StarSchedule, StarOffice''s pretty good attempt at a Personal
    Information Manager. PIMs, as they are known in the computer biz, are soft-applications
    designed to manage our busy days. Recently, PIMs started coming in their own hardware
    devices called Personal Digital Assistants (PDAs), such as the popular PalmPilot.


    StarSchedule tracks two time-consuming aspects of our daily lives: events and
    tasks. In a business setting, it allows you to influence the schedules of others.


    # Exploring the StarSchedule Interface


    Before learning to use the StarSchedule component, let''s first examine its interface,
    since it has yet to be seen in any of the other StarOffice components.


    To start the StarSchedule component, you must select either the Events or Task
    fold-ers in the Explorer window. You''ll find these folders under the StarSchedule
    folder. Selecting the Events folder starts the window shown in Figure 21-1.


    You can see that this screen has much to examine. Central to the interface is
    the event calendar. In the default Day view, this pane lists all of the events
    on a given day in block format. You can enter events directly into this pane and
    change times with just the mouse, as you will see later in this chapter.


    The Calendar in the upper right corner has help with navigation. It tells you
    the cur-rent selected day. It also gives you the bigger picture on how busy your
    month is shaping up to be.


    > In the default mode, the calendar displays the weeks of the year and does not
    highlight days with events. To change this, right-click the Calendar and change
    the settings on the context menu.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_482_0.png)


    The StarSchedule interface includes the Task list in order to show your busy life
    all on one screen. This miniature version of the Task list is as fully functional
    as the main Task list, which you can review by selecting the Tasks folder in the
    Explorer (see Figure 21-2).'
