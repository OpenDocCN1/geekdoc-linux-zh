  md: '# To my mother,

    the best teacher'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'id you ever have someone that just pops up in your life and creates chaos?
    I''ve got someone like that—my acquisitions editor, Kim Spikler. Oh sure, she
    seems nice, but in reality she''s out to make the rest of my hair fall out. Kim
    was instrumental in getting me to write my first book (which she co-authored with
    me) and now she keeps giving me more books! Despite this, I am glad to have her
    as a colleague and a friend.


    "Jennifer Starbuck, Dan Gentry, and Ryan Palsgaard get huge kudos from me for
    focused early in the process and for having a sense of humor. After all, who lets
    their authors arbitrarily assign them moralistic nicknames to minimize the confusion
    given over their names? (Yes, I was “Evil” Brian, which all my friends find fitting.)


    Jennifer Starbuck, Dan Gentry, and Ryan Palsgaard get huge kudos from me for ripping
    my text up and making it so much better. I also send many thanks to the under-appreciated
    production staff.


    There is no greater thanks from me to my good friend and colleague, Robert Bogue.
    Without Rob''s incredible assistance and loan of his equipment and expertise,
    this book simply could not have been put together.


    Thanks also to Alexius Smith, who gave the book critical academic eye.


    In terms of timing, this book could not have been written at a worse time. We
    moved into a new house and changed jobs to become a full-time author. We call
    that stress here in Indiana. For keeping me sane and laughing through all of this
    hullabaloo, my wife, Cynthia, and daughters, Brittany and Morgan, get all of my
    love.


    Okay, mushy part''s over. Let''s get cracking on StarOffice for Linux!'
