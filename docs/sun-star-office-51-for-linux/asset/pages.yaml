  md: '# # Master the ins and outs of Sun StarOffice 5.1


    Discover how easy it is to get started with StarOffice. Learn how to create professional-looking
    documents with StarWriter, analyze data and run reports using StarCalc-all in
    one program! Not just for documents, StarOffice also functions as a comprehensive
    organizer. Manage your contacts and e-mails effortlessly with StarSchedule and
    StarMail. With this task-oriented guide, the answers are right at your fingertips.


    Brian Proffitt is a professional author and computer consultant. He consults in
    the areas of desktop application training, documentation, and configuration management.
    He has developed over 50 computer books and provided technical editing for dozens
    more.


    # # Learn Faster


    +   - Prepare documents for the Web using StarWriter

    - Explore how to simplify file management using StarDesktop

    - Learn how to enhance documents with graphics created in StarDraw

    - Create databases in StarBase and start managing your data more efficiently


    # # Learn More


    +   - Master all of the StarOffice components, including StarImpress, StarDraw,
    StarSchedule, and StarMail

    - Employ graphs and charts created in StarChart to bring new life to your data

    - Apply templates and time-saving techniques to your StarOffice documents

    - Discover how to add pizzazz to presentations in StarImpress


