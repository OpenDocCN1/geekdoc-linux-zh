    # Slide Sort View


    The Slide Sort view, illustrated in Figure 16-10, displays all of the slides in
    the presentation in miniature form. As the name suggests, this view offers an
    easy way to sort the order of the slides in the presentation.


    The Main Toolbar in this view has three icons, all tools you have worked with
    before: Select, Zoom, and Presentation. Again, the Option Bar and edit mode controls
    are not available in this view.


    This view does more than allow the sorting of slides. It also permits easy editing
    of the transitions between slides, among other things. The Object Bar, which the
    next section examines more closely, has been dramatically altered to accomplish
    these jobs.


    # Object Bar


    The Object Bar in the Slide Sort view contains the tools to edit the transitions
    between your presentations. Transitions are the effects that occur when moving
    from one slide to another, such as the sliding of one slide over the previous
    one.


