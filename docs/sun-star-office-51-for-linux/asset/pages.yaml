  md: '# Building with Lines


    ![](img/185096a0ec6a79f83b74a7ac44692a25_438_0.png)


    **Figure 10-18** Freeform curves can be tweaked into a better look.


    Lines are often used to create polygons. A polygon is simply a multi-sided shape
    composed of straight lines. The sides may or may not be of equal length. If they
    are, and all of the angles within the polygon are equal, then the polygon is called
    a regular polygon.


    Creating regular polygons in StarDraw takes some practice, as there is no utility
    to automatically regulate line lengths and angles. But with some practice, you
    should be able to manage it.


    # Create Multi-sided Polygons


    This task illustrates how to make polygons within StarDraw.


    +   1. In an open StarDraw document, click and hold the Line icon on the Main
    Toolbar, and then click the Polygon, filled icon.

    2. Drag the polygon pointer across the screen.

    3. Release the mouse button, then drag the cursor to the next corner point of
    the polygon.

    4. Click where you want the corner placed.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_438_1.png)'
