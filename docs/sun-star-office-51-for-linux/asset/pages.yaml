  md: 'will be examined in the appropriate chapters later in the book. For now, let''s
    take a look at the two most consistent toolbars: Function and Hyperlink.


    The Function Bar generally appears just below the menu of the StarDesktop interface.
    Table 3-1 defines the names and functions of each of the Function Bar’s icons
    and other controls.


    # Table 3-1 The Function Bar Icons and Controls


