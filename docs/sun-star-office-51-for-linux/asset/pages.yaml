    # Formatting Cells


    Thus far, the previous sections in this chapter have concerned themselves with
    formatting the data contained within a cell, but not the cell itself. Formatting
    cells goes beyond just making the data look pretty. Recall that the human eye
    needs to have something to keep it focused. Following a long row of data across
    a screen is very difficult if nothing keeps the eye from wandering off or down
    into the adjacent rows.


    With the judicious addition of fills and borders, you can help the eye track data
    across a screen.


    # Applying Borders and Fills


    All cells have borders. Sometimes the borders are invisible, but they are always
    there, like the air we breathe.


    Cell borders can come in all of the available StarOffice colors and can be as
    thick as 9 pts. I don''t recommend that you use such an extreme width on individual
    cell borders, as you will obscure the cell''s contents. But you may sometimes
    find uses for all of the various thicknesses.


    Cell fills are also referred to as backgrounds for cells. These, too, in a vast
    variety of colors. Care should be taken, however, to avoid the darker shades,
    as these obscure the text as well. But if you use a dark fill color, you can change
    the text color to increase the contrast between text and background.


    As you create your own fills, try to keep the number of different colors to a
    maximum of three shades. More than that could lead to confusing data representation
    and a frustrated brain.


    # Change Cell Borders and Fills


    This task applies various borders and fills to cells with a StarCalc document.


    +   1. Open a StarCalc document.

    2. Select a range of cells one column wide.

    3. Choose Format, Cells.


