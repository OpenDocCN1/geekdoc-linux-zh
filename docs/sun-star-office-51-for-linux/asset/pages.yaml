  md: '# Insert Internal Hyperlinks into a Web Page


    This task demonstrates the steps needed to create an internal hyperlink in a Web
    page.


    +   1. Open the Modern1.html document.


    To properly illustrate this function, insert dummy text into the Web page until
    the page is more than one screen in length. Place the destination tag at the end
    of the page and the hyperlink at the beginning of the page.


    +   2. Place your cursor at an internal link destination near the end of the document
    and, without selecting text, choose Insert, Hyperlink.


    +   3. Enter the destination tag name, test.jump, in the Name field.


    +   4. Click OK.


    +   5. Move to the beginning of the document, select a text passage, and click
    Insert, Hyperlink.


    +   6. Enter Modern1.html#test.jump in the URL field.


    +   7. Click OK. The selected text now has an active hyperlink to the testjump
    name.


    +   8. Save the Modern1.html document.


    The other Web page essential is graphics. Inserting a picture in an HTML document
    is just as simple as in a StarWriter document, as the following task demonstrates.


    # Insert Pictures into a Web Page


    This task illustrates the method for placing graphics within a Web page.


    +   1. Open the Modern1.html document.


    +   2. Place the cursor at the graphic insertion point and choose Insert, Picture.


    +   3. In the Insert Picture dialog box, navigate through the file system and
    select a graphic file to insert.


    +   4. Click the Open button.


    +   5. The picture inserts into the page, as shown in Figure 10-7.


