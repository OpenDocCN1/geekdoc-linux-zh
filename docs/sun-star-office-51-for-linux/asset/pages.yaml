    ![](img/185096a0ec6a79f83b74a7ac44692a25_308_0.png)


    **Figure 13-2** Searching online directories with the Address Book.


    # # Managing the Address Book


    Hopefully, you are a social person, and you like to get out and meet new people
    every once in a while. If you aren''t, put this book down and go find some friends
    now.


    Mission accomplished? Good. Now you can participate in the next set of tasks,
    which will demonstrate how to add addresses and edit existing addresses in the
    Address Book.


    # ## Add an Address


    This task adds the addresses of your new-found friends into the Address Book.


    +   - In any part of StarOffice, click Edit, Address Book.

    - Click the New button on the Address Book form.

    - Fill in all of the available information in the appropriate fields.


    > StarOffice is an international program and sometimes its global status shows
    through, such as in the Address Book form. U.S. and Canadian users may not find
    the order of the Country, State, ZIP, and City fields intuitive. Until you are
    to use them, take care when entering information in these fields.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_308_1.png)


    +   - When you have entered all of the information, click the Next Record button.

