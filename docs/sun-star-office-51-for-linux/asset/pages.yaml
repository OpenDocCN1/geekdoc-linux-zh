  md: '# Scheduling Events


    ![](img/185096a0ec6a79f83b74a7ac44692a25_492_0.png)


    Figure 21-12 You can search for events based on a variety of parameters.


    +   1. Click the Search forwards icon. As StarSchedule finds each event with this
