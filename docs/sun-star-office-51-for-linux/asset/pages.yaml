  md: '# Detective StarCalc on the Case


    The greatest detective on Earth would be who? Sherlock Holmes? Charlie Chan? Hercules
    Pierot? Batman? All fictional characters, each with staggering abilities of deductive
    reasoning.


    We all have the ability to solve a mystery. Most of us enjoy seeking one out to
    solve. But the clues aren''t easy to find sometimes. Many times they are right
    under our noses and we always seem to overlook them.


    It can be the same in StarCalc. Sometimes spreadsheets can be so complicated,
    hard to know which data came from where. (and you know this was coming, right?)
    StarCalc has its own detective to help you trace data across the landscape of
    your spreadsheet, which can be as scary as the moors to a new user.


    The detective or auditing tool assumes each referenced or referencing cell contains
    one of two types of data. A cell either has dependent data, where its own data
    is depended upon by other cells; or precedent data, where its own data is dependent
    on other cells.


    Let''s examine the detective action in the next task.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_297_0.png)


    # Use Detective to Audit Your Data


    This task solves the mystery of the auditing functions in StarCalc.


    +   1. In the open Inventory document shown in Figure 12-32, one of the values
    in the Make Total column seems wrong. The value for Chevrolet is 0, when it is
    clearly more than that. Select the Chevrolet cell B17.

    2. Choose Tools, Detective, Trace Dependents. Several trace arrows appear (see
    Figure 12-33), but none to point to cell B26, which still says 0.

    3. Choose Tools, Detective, Remove All Traces.

    4. Select cell B26.

    5. Choose Tools, Detective, Trace Precedents. Trace arrows appear, pointing to
    the wrong range.

    6. In the Input Line of cell B26, correct the range.

    7. Save the document. Figure 12-34 shows the result!'
