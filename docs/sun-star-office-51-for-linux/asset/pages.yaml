  md: '# Chapter 2: Discovering the Components of StarOffice


    On the left side of the screen there is a variety of items, from files in your
    computer to work folders containing all of a project''s work. The structure of
    this window contains groups, as E-mail & News, Work Folder, and Tasks. An Explorer
    group uses a directory tree very similar to the Windows 98/NT Explorer to navigate
    the files on your PC.


    Along the top of the Desktop is the Beamer. The Beamer is similar in function
    to the Explorer, as it displays folder contents. The Beamer window displays the
    contents of any folder selected in the Explorer window. If you have been experimenting
    with the interface (and who could blame you?) you may have noticed that you can
    get the same effect by double-clicking any folder in the Explorer window and seeing
    the folder contents in the Desktop window. But, by single-clicking folders in
    Explorer, the Beamer can show the same contents without supplanting what is in
    your Desktop window.


    As a document viewer, StarDesktop has the ability to configure itself to accommodate
    whatever type of file you have opened. Thus when you open a StarCalc file, the
    toolbars, Navigator, and Stylist all change to StarCalc-specific tools. The same
    effect occurs when you open a StarWriter document or a StarImpress presentation.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_41_0.png)


    > In truth, there are no individual applications within StarOffice, as there are
    in Microsoft Office. You will not find an "on switch" for StarWriter or any of
    the other components. You activate them on an as-needed basis. For example, if
    you create a new StarImpress presentation or open an existing presentation file,
    then StarImpress automatically starts.


    This dual functionality of file navigator and universal document viewer makes
    StarOffice unique. It is a powerful feature, but Admittedly one can trip up a
    user if they''re not careful. Chapter 3 will take a more in-depth look at the
    StarDesktop and demonstrate how to use this tool properly.


    # StarWriter: A New Way to Write


    StarDesktop is the center of StarOffice, then it can be safely said that StarWriter
    is the focal point.


    The written word is still a major component of our daily lives. Newspapers, Web
    pages, and books—the written word comprises them all. Even our audio and visual
    media streams from writer scripts and news copy.


    StarWriter was the first product developed by the original Star Division and,
    as such, is the most developed component of Sun''s new office suite. You can see
    this robust nature in Figure 2-3, which shows a typical StarWriter window. You
    can see that'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Document Navigator StarWriter: A New Way to Write


    ![](img/185096a0ec6a79f83b74a7ac44692a25_42_0.png)


    StarWriter offers a number of tools. Three tools unique to StarWriter and the
    entire StarOffice suite—include the Navigator, Stylyst, and Help Agent. Again,
    we''ll look at these tools in more detail in Chapter 3, but a brief introduction
    here won''t hurt.


    The Navigator enables you to navigate your cursor to any point in a document.
    For instance, the Navigator inventories and lists the number of tables, figures,
    and other unique objects within a given document. If you wanted to jump to Figure
    2-3 you would just click on that entry in the Navigator and your cursor appears
    at 2-3.


    The inventory feature of the Navigator also makes it easy to manage documents
    with large numbers of elements. If your document was supposed to have nine pictures,
    it would be disastrous to discover after it comes back from the printer that only
    eight were actually inserted.


    The Stylyst brings forth the concept of styles. This may not be a new concept
    to you, as styles have been around for a few years.


    Styles typically have proper names that describe their features. The Stylyst in
