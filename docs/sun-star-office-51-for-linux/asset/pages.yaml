    click Open.

    3. To use the graphic as a backdrop to text, right-click the graphic and choose
    Arrange, Send to Back. Figure 17-8 shows an example of using graphic backgrounds.


    > Temporarily move the graphic away with your mouse to edit the text color for
    higher contrast, if necessary.


