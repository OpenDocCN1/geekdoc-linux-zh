  md: '![](img/185096a0ec6a79f83b74a7ac44692a25_381_0.png)


    The Notes view presents each slide individually on a single sheet of paper. The
    slide covers the top half of the sheet and the bottom half has a note box. Within
    this note box, you can enter any additional points or examples to assist during
    the actual presentation.


    The Handout view is the simplest view of all. It simply displays a certain number
    of slides on a page that you can print and give to audience members to allow them
    to follow along. Handouts are very useful when giving a lot of detail in a presentation.


    To change the number of slides displayed per page in the Handout view, click the
