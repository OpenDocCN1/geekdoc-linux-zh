    # The StarDesktop Concept


    Every graphical operating system these days has a desktop. Caldera OpenLinux,
    for example, comes with KDE, which in turn has the KDE Desktop. Microsoft Win-d,
    which you may have seen once or twice, also has a Desktop.


    Office suites, in general, do not have desktops. Most suites work with the existing
    desktop in whatever operating system they find themselves in. So, Microsoft Office
    plants program shortcuts for all of its components in the Start menu in Win-dows.


    Not so with StarDesktop. When StarOffice starts, the StarDesktop not only fills
    your KDE Desktop screen, it actually takes over the desktop and acts in its place.
    This new integrated desktop acts as a launching point for all of the StarOffice
    com-ponents, a file manager for all of your directories and files, and even a
    Web browser to explore the world beyond your computer.


