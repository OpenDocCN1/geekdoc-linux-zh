- img_proc: true
  md: '# Looking Through Your Toolbox


    ![](img/185096a0ec6a79f83b74a7ac44692a25_422_0.png)


    Figure 18-5 The Text floating toolbar.


    The Fit Text to Size icon functions identically to the text icon, with one important
    difference. In a regular text box, any text that overflows will be placed "outside"
    the text box and by the presence of a tiny red arrow. In a fit to size text box,
    once you enter the text and the box is no longer selected, the text inside immediately
    resizes to fill the special text box as much as possible. This condition remains
    as long as the text exists.


    Callouts, something you have seen a lot of in this book, can be created with the
    final tool in the floating toolbar. To use, merely drag the callout cursor across
    the screen. For best results, drag the callout away from the item to which the
    callout points.


    To control the size of the callout box, simply drag the box handles to make the
    size you want. Dragging the pointer control handle changes the curve angle.


    # Rectangle


    A rectangle is a four-sided polygon with corner angles of 90 degrees. It is one
    of our favorite shapes, given how many times we use it in a given day. Paper,
    boxes, and buildings—these utilize the shape or its special relative, the square.


    StarDraw has a number of tools, naturally, to help build these shapes. It should
    be noted that all shapes in StarDraw come in one of two types: filled and empty.
    Filled shapes, when created, appear in the color selected in the Object Bar or
    color palette. Empty shapes have only the edge lines visible.


    Figure 18-6 displays the Rectangle floating toolbar. Table 18-2 explains the use
    of each of the tools.'
