    Additional navigation icons appear at the end of each help topic. Clicking the
    left and right arrow icons takes you to the previous and next help topics, respectively.
    Be aware that they do not take you to the next subtopic, but rather to the next
    same-level topic in the General Help.


    Clicking the scroll icon takes you to the Overview page for the entire Help system.
    This is different than the index page accessed by the Help Index icon on the toolbar.
    The Help button takes you to the contents page for the specific help file you
    are viewing.


    Switching help files is a like putting a book down and picking up another one.
    Simply open the list box in the Choose Help File field and select another file
    to view.


    If the text appears too small or large for you to read comfortably, the Zoom In
    or Zoom Out icons out until the text displays in a comfortable point size.


    Even though the General Help is nice to page through, you may be in need of quick
    answers. StarOffice provides some nifty ways to find the answers you seek.'
