  md: '# Chapter 6: StarWriter Basics


    The Picture icon also changes what the screen displays. Instead of nonprinting
    characters, it controls the appearance of all graphics and objects within a document.
    Use the Picture icon to replace graphics and other objects with a plain box containing
    the URL and descriptive name (see Figure 6-12).


    These placeholders let you know where a graphic has been placed and what the graphic
    is—without taking valuable computer memory and time to keep displaying the actual
    graphic.


    # Online Layout Icon


    Though we won''t get into the creation of online Web documents until Chapter 10,
    a brief look at the Online Layout icon is in order.


    Because most documents created in StarWriter are destined for paper, the onscreen
    display tends to emulate a paper document, complete with margins and paper edges.


    Documents generated for a Web page, however, have no such limitations. The Online
    Layout view takes advantage of this fact. Click the Online Layout icon to transform
    the open document into a meaningless, edeless format, as shown in Figure 6-13.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_137_0.png)


    Figure 6-12 Graphic and object placeholders.'
