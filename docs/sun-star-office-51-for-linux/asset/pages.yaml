    # Edit Modes


    The Edit Mode controls are small and difficult to see, much like their brethren,
    the View controls. Located in the lower left corner of the slide window, these
    three buttons (shown in Figure 16-7) control which portions of a slide you can
    edit.


    The Slide Mode is the default editing mode in the Drawing view. This mode lets
    you edit all objects in the screen not directly connected to the background.


    Use the Background Mode to make changes to the background of all the slides in
    your presentation with that design. Exercise caution in this mode, because changes
    here appear in many other slides.


    Use the Layer Mode to edit objects which may or may not be visible in the slide.
    This mode can be used in conjunction with the Slide or Background Modes.


