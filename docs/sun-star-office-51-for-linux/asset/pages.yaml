  md: '# Improving the Help System


    It''s said before that imperfections exist in the General Help system. Some of
    this is attributable to continuing product development, misplaced hyperlinks,
    and even faulty translation from the original German. (Last is not a problem in
    the German version of StarOffice, of course.) Even the pristine help in the help
    system may lack the terminology you need to understand the message they deliver.


    Fortunately, you can provide clarification in the form of annotations.


    # Annotate a Help Topic


    This task demonstrates the steps to annotate a help topic.


    +   1. In a General Help topic, click the Write Annotation icon.

    2. Enter your comments in the comment field in the Annotation dialog box (see
    Figure 5-7).


    > If you have already written an appropriate comment in another document, copy
    the comment using StarOffice''s Copy command. Click the Insert button to place
    the comment in the Annotation dialog box.


    +   3. To create the annotation, click OK. An annotation icon appears in the upper
    left corner of the topic page (see Figure 5-8).

    4. To view the annotation, click the annotation icon to re-open the Annotation
    dialog box.

    5. You can remove the annotation by clicking the Delete button, then OK.


