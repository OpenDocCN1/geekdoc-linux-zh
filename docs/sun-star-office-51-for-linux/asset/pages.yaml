    # Indexing your Document


    Creating an index is hard work. The people who index books have to be meticulous
    in their work, picking apart every word in a document and gathering the important
    words together in a comprehensive list.


    These are seriously detail-oriented people.


    Indexing is one of the most specialized tasks in publishing. Without the right
    tools, it can be quite maddening.


    In this section, we will look at two indexing tasks. The first is the very automatic
    Table of Contents function, where StarWriter sweeps through the document headings
    and lists its page numbers in the blink of an eye.


    The second task, creating an index, needs some manual decision-making on your
    part, but still creates indexes far more easily than a totally manual process.'
