  md: '# What Do All These Menus Mean?


    The toolbars contain a voluminous amount of functions to assist in the creation
    of documents. Yet, they pale in comparison to the depth of the menu commands in
    StarWriter. The menus represent every toolbar command, plus many additional commands.
    In theory, you could put every menu command on the toolbars, but that would add
    so much clutter to the screen that you''d only have a two-inch-tall space in which
    to type your document.


    Because of the sheer number of menu commands, this section of the chapter will
    not detail every available command as was done earlier with the toolbars. Instead,
    the more commonly used menu commands will be explained here, with the rest demonstrated
    in the appropriate chapters.


    # Editing Your Document


    Of all the available menus in StarWriter, the Edit menu is perhaps the most useful.
    It contains the most pervasive commands in StarWriter, except for the Open and
    Save commands in the File menu.


    In this menu, you''ll find the ubiquitous Cut, Copy, and Paste functions, as well
    as the Undo, Redo, and Repeat commands. You can open the Search & Replace dialog
    box from here, as well as track Changes to the document.


    The following tasks in this section will highlight the most basic of these commands.


    # Cut, Copy, and Paste Document Objects


    This task reviews cutting, copying, and pasting of any document object using Edit
    menu commands.


    +   1. In an open StarWriter document, select a passage of text, a graphic, or
    a form field.

    2. From the Edit menu, click Cut.

    3. Move the cursor to another area of the document.

    4. Again from the Edit menu, click Paste. The cut text appears in the new spot.


    You can create copies of document items such as text or graphics in just a few
    steps.


    +   1. To copy an item, select the desired item.

    2. From the Edit menu, click Copy.

    3. Move the cursor to another area of the document.

    4. From the Edit menu, click Paste. A copy of the text appears in the new spot.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Undo Your Work


    This task demonstrates the Undo, Redo, and Repeat functions of the Edit menu.


    +   After performing any edit within a document, click Edit, Undo. The most recent
    change to the document vanishes.


    > The Undo, Redo, and Repeat commands will always be followed by a one-word description
    of the action that will be performed.


    +   Click Edit, Redo to put the change back on screen.

    Click Edit, Repeat to repeat the most recent change.


    # View Your Document


    The way we look at things is very important to how we treat them. Look at a bug
    down on the ground and you will likely feel indifferent. Look at the same bug
    through an electron microscope and you may shudder in revulsion.


    How you view a document is important to your work. When you have a document with
    a lot of graphics, seeing the whole page at once helps you balance the look of
    the page. Conversely, those with vision problems may want to make the print appear
    really big without increasing the font size.


    # Zoom In Close


    This task reviews how to change the zoom perspective of a document.


    +   In an open document, click View, Zoom. The Zoom dialog box appears (Figure
    6-16).


    +   Select the option that matches your desired view choice.

    * If you want a precise zoom percentage, click the Variable option and enter the
    numeric value (see Figure 6-17).

    * To see an entire page, select the Entire Page option in the Zoom dialog box.

    * For the best size for your current screen dimensions, select the Optimal option.


    We''ve already discussed the capability of StarOffice to change its own interface
    by moving toolbars and changing menus. You can make other subtler interface changes
    that can be just as important.'
