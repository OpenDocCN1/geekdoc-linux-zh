  md: '# Chapter 10: Publishing Your Documents Everywhere


    Hyperlinks rely on a file system to locate other HTML files, just like your Linux
    system. If the destination HTML file is in the same directory as the source HTML
    file, then the hyperlink needs just the name (index.html). If the destination
    is another directory, but still on the same machine, then the hyperlink needs
    the path and file name (../work_folder/index.html). If the destination is on another
    Web server altogether, then the hyperlink requires the full URL address, path,
    and file name (http://www.example.com/work_folder/index.html).


    ![](img/185096a0ec6a79f83b74a7ac44692a25_231_0.png)


    +   1. Enter a file name (and path) for the destination file in the URL field.
    Use the Browse button if needed.

    2. Click OK. The selected text now has an active hyperlink, as seen in Figure
    10-6.


    Another useful hypertext function is the ability to jump within a current Web
    page. These internal links are great to use in long documents with a lot of text.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_231_1.png)


    > The Proffitt Family Web Page

    Welcome to the Proffitt Family Web Page Reading in Indianapolis, Indiana, the
    Proffitt Family strives to fight for truth, justice, and the American way! (No,
    really).


    Get Up and Close with the Proffitt Family Members

    * Brian

    * Cliff

    * Brian //../root/Desktop/SOFigures/Brian.html

    * Morgan


    Warning! Associating with the Proffitts has been known as a reality-altering experience!'
  merge: -1
