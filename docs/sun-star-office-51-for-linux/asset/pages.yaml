    # Sending and Receiving Files via E-mail


    One of the great benefits of e-mail is its ability to send electronic files of
    any shape and most reasonable sizes for the role. These electronic email files
    are called attachments. This concept virtually eliminated the old sneaker practice,
    where files were placed on floppy disks and walked around the office.


    Sending files via e-mail has also revitalized another business concept: collaboration.
    By facilitating the passing of files back and forth, people have more time and
    more inclination to share files and work on them together.


    # Send E-Mail File Attachments


    This task discusses how to send file attachments in an e-mail message.


    +   1. In StarMail, begin the process to send a new e-mail.

    2. When you''ve completed the message, click the Attach File icon.

    3. In the Open dialog box, navigate to the desired file and click Open. Figure
    19-14 displays an attached file.'
