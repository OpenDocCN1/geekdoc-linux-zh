  md: '# Chapter 10: Publishing Your Documents Everywhere


    John and Kafula Foley have a Web site. It''s pretty simple: a list of the couple''s
    favorite Web sites, including several noteworthy local charities centered around
    the Camphill School for the Disabled. John is a computer consultant who specializes
    in Delphi and Internet programming.


    The Foleys'' Web site can be found at: www.info.bw/~-john.


    This could be like thousands of others on the Internet. Its premise has indeed
    been before. What makes it so interesting is where the Web site and the Foleys
    live: Gaborone, Botswana.


    Think about this before. You could be sitting anywhere in the world right now,
    reading this book. If you can get online, right now, right this second, you can
    read about a couple of people who live on the other side of the world.


    Right now, you can have your own Web page out there for the whole world to see.
    StarWriter can get you started.


    # HTML 101: The Facts behind the Myth


    Many people mistakenly believe that making a Web page is hard. While more specialized
    Web pages with Java and ActiveX code require quite a bit of planning and work,
    the majority of Web pages can be put together by anyone with just a simple text
    editor like vi. But just because you can use a text editor to create a Web page,
    that does not mean you should.


    Web pages are composed of a document language called HTML, which stands for HyperText
    Markup Language. HTML uses a system of tags that surround passages of text. Any
    text between the tags displays the attributes associated with the tag. Thus, `<i>`
    (italic) tags make the text within *italic*.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_225_0.png)


    > For an excellent resource on learning HTML, read Learn HTML In a Weekend (Prima,
    1999).


    The format for HTML documents is much simpler than the StarWriter document format.
    HTML files are nothing more than ASCII text files. This makes them quick to read
    across the Internet. Browsers, as StarDesktop, do much of the work in reading
    an HTML file by quickly converting the tagged text into the more dramatic visual
    representations you''re used to seeing.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_225_1.png)'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'If you think that you have to memorize a bunch of HTML tags and syntax in order
    to produce a Web page, think again. Remember, there are better tools out than
    plain text editors. Using vi these days would be like baking a cake with a camp
    stove. Possible, but hard.


    Instead, you can use StarWriter to quickly produce Web pages. How quickly? Just
    tap your shoes three times, and start reading the next section.


    # Creating a Web Page


    There is more than one way to skin a cat. Anyone would want to skin a cat is a
    mystery. But, it''s more catchy than saying there''s more than one way to create
    a Web page in StarWriter.


    The two methods you can use in StarWriter include creating an HTML document from
    scratch (easy) and converting an existing document to HTML format (ridiculously
    easy).


    The next task will tackle the latter method first, proving the ease in which StarWriter
    creates HTML.


    # Convert a Document into a Web Page


    This task steps through the method used to create a Web page from an existing
    Star-Writer document.


    +   1. In an open StarWriter document, choose File, Save As.

    2. Select HTML (StarWriter) in the File Type field of the Save As dialog box.

    3. Click Save. The file is now in HTML format.


    That seems too easy, but that''s really all there is to it! If you have doubts,
    start third-party browser, such as Netscape Navigator, which is included with
    Caldera Linux. Open the HTML file you just created and it appears in the browser,
    just like any Web page as shown in Figure 10-1.


    In fairness, it should be noted that not all StarWriter documents lend themselves
    well to conversion to HTML format. Documents with placed graphics and text frames
    may appear jumbled, for instance.


    As simple as the Save As method, it should be reserved for basic document version,
    such as getting corporate documentation quickly onto the company intranet. For
    more creativity, StarWriter has provided an AutoPilot to help you start new Web
    pages, as detailed in the following task.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Chapter 10: Publishing Your Documents Everywhere


    ![](img/185096a0ec6a79f83b74a7ac44692a25_227_0.png)


    # 1.Introduction


    Since 1990, the Chicago Model Company has created thousands of trend maps for
    teens, girls, and adult hobbies. Now, at the dawn of the new millennium, CMO is
    launching its newest product PCRAIL.


    PCRAIL is the first model-based trend tracker with the PC2000 preference table,
    and they give complete control of trends, volatility, and demand through the CMO''s
    Power Pilot.


    By performing this change, the Software Development Department will be using a
    new-new Configuration Management tool, CMOBanger, to take advantage of the functionality
    of the Unix operating system. With this shift, CMOBanger will allow us to take
    advantage of the functionality of the Unix environment.


    CMOBanger is new in the local area, and it is intended to improve the process
    models that CMOBanger will be maintaining, widely intended to go for a more flexible
    and agile development process.


    One of the problems is the lack of reliable Helper Integration and Formal Problem
    Testing models within CMOBanger. Our current plan is to modify the model to include
    these elements in the next phase of the project.


    There is also a problem with the sheer number of different models used in the
    project. We need to create a better format for the document that will give us
    clear synopses and descriptions of each model, with recommended changes to CMOBanger''s
    specific needs.


    > Note: Each synopsis and process flow in the following sections have been adapted
    from the CMOBanger user documentation.


    # Genesis Track


    ![](img/185096a0ec6a79f83b74a7ac44692a25_227_1.png)


    Figure 10-1 HTML documents can be created in seconds.


    # Make a Web Page with Autopilot


    This task steps through the method used to create a Web page using the Web Page
    Autopilot.


    +   1. In any part of StarOffice, choose File, Autopilot, Web Page. The Web Page
    Autopilot opens, as shown in Figure 10-2.


    +   2. Select the Center Homepage page. Behind the Autopilot, the web page shown
    in the document window changes to show the Center Homepage template.


    +   3. Click the Style button.


    +   4. Select the Modern style.


    +   5. Click Complete. The Web Page template appears for for editing, as shown
    in Figure 10-3.


    +   6. Save the page as Modern1.html.'
