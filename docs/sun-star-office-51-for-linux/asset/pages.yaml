  md: '# Sort Icons


    Sorting is a very common way of manipulating data. When you sort, you simply change
    the order of a given set of data to correspond to a desired output. The Sort Ascending
    and Sort Descending icons use the most common sort methods: alphabetic and numeric.


    To sort data in a spreadsheet, first select the range of data to sort, and then
    click the Sort Ascending or Descending icon. The leftmost column of data determines
    whether an alphabetic or numeric sort will be applied to the selected rows in
    the data range. The ascending sort places lower numbers and letters at the top
    of the sort, while the descending sort begins with higher letters and numbers,
    as seen in Figure 11-9.


    > Sort icons do not sort data by entire rows and columns, so be careful in their
