    # Viewing the Toolbars


    With all these toolbars hanging about, finding the one you want could be tricky.
    Luckily, StarDesktop provides easy ways to activate the toolbars. You can also
    configure each toolbar to your specifications, making StarDesktop more customized
    to your own tastes.


    StarOffice offers two ways to make toolbars visible. The first method is standard
    in all StarOffice components, first click View, Toolbars, and select your toolbar
    choice.


    The second method is faster, but slightly tricky. If you right-click anywhere
    within a visible toolbar, you get a context menu that lets you make almost the
    same choices as the previous method. By default, StarOffice does not include the
    Hyperlink Bar in its context menu, so to get to this toolbar, you must use the
    first method using the main menu. Also if you attempt to bring up the context
    menu on the Hyperlink Bar, nothing happens.


    Now that you know how to turn on any toolbar in any StarOffice component, the
    following task shows you how to customize the toolbars to suit your needs.'
