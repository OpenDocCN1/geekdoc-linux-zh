  md: '# Alignment and Position


    All objects in StarDraw come with object handles and remain separate from all
    other objects in the drawing, save connectors. Because of this, you can manipulate
    objects independently of the other objects on the page. The exception to this
    statement is the connector object, which automatically alters itself when any
    object it''s connected to moves or changes.


    For the most part, though, you can effect objects with impunity and not worry
    about affecting the objects around it. Two Main Toolbar icons specifically designed
    for object-level handling include the Alignment and Position icons.


    The Alignment icons, illustrated in Figure 18-11, have fairly straightforward
    functions. Each icon applies its alignment command to a selected object. The alignments
    relate to the page itself, so care should be taken when using these tools, as
    objects can be dramatically repositioned with them.


    Objects in a drawing are like cards in a deck: each object can be stacked on top
    of the others. The tools in the Position floating toolbar let you move objects
    from layer to layer. Figure 18-12 shows the icons in the Position floating toolbar,
    and Table 18-8 explains the functions of each of these icons.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_430_0.png)


    ![](img/185096a0ec6a79f83b74a7ac44692a25_430_1.png)'
