    # Adding Graphics


    It makes sense that in a software application designed to present ideas and facts
    to a large number of people, there would be a way to get some graphics into the
    mix. After all, is worth . . . well, you know the rest.


    Add graphics to enhance a presentation, not be its central focus point. This is
    essentially a physical limitations issue. If you place a detailed graphic in your
    presentation, only the people in the very front row of your audience can see and
    read it. There are exceptions of course, but for the most part try to use graphics
    as enhancements, as detailed in the following task.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_398_1.png)


