    | --- | --- |

    | Bookmark | Creates a bookmark of any file listed in the Load URL field. |

    | Load URL | URLs and local file names entered here appear on the StarDesktop.
    |

    | Browse Backward | Returns to the last visited Web page or file. |

    | Browse Forward | After browsing backwards, moves forward to current file or
    Web page. |

    | Stop Browse | Halts the download of a Web page. |

    | Go to Homepage | Calls up designated homepage. |

    | Reload | Reloads and refreshes current page. |

    | Edit File | Enables editing of a downloaded Web page. |

    | Open File | Opens the Open dialog box. |

    | Save Document | Opens the Save dialog box. |

    | Send Message | In Internet Online mode, activates a new e-mail message window.
    |

    | Print File Default | Prints current file to default printer. |

    | Cut | Cuts selected text or graphic from a document. |

    | Copy | Copies selected text or graphic from a document. |

    | Paste | Pastes cut or copied text or graphic into a document. |

    | Undo | Removes last edit action. Can be repeated. |

    | Redo | Performs last undone edit action. Can be repeated. |

    | Explorer On/Off | Opens/closes Explorer window. |

    | Beamer On/Off | Opens/closes Beamer window. |

    | Navigator On/Off | Opens/closes Navigator window. |

    | Stylist On/Off | Opens/closes Stylist window. |

    | Help Agent | Opens/closes Help Agent window. |

    | Internet Online/Offline | Switches connection to the Internet on or off. |'
