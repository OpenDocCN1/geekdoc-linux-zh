    of the interface. This usually presents the element in a more integrated manner
    with the rest of the interface.


    # Full Screen View


    Users who want to see what they are working on and nothing else should consider
    the Full Screen view. To access this view, click View, Full Screen. The StarDesktop
    now looks like the screen shown in Figure 3-6.


    Observe that in this view all of the toolbars, as well as the Explorer and Be
