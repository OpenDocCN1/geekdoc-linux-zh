  md: '# Desktop Publishing Basics 18


    Have you ever noticed how some spices on the spice rack get used faster than others?
    Garlic powder and chili powder seem to fly off the shelf, while cream of tartar
    and filé powder seem to be always in stock.


    It''s the same way with complex computer applications. You may rarely use some
    of the more esoteric features of the application. But every once in a while, you
    need to do something really fancy with your documents—a sharp-looking photo page,
    a company annual report, a product order form—something where your work really
    needs to shine.


    StarWriter can help you put together high-end documents when the need arises.
    And, like good filé powder in gumbo, the results can be spectacular.


    # Desktop Publishing Basics


    The term desktop publishing is a bit misleading. It seems to imply that someone
    can make a book or magazine on a PC. In truth, the name comes from the fact that
    desktop publishing accomplishes today what used to be done by hand in publishing
    houses. Some jobs still have to be done in the bindery, so desktop publishing
    is not true publishing—yet. The gradual shift towards online documents and electronic
    books, however, may soon mean that desktop publishing will be the only kind of
    publishing.


    What makes desktop publishing different from word processing is that the former
    mainly handles the context and delivery of the material. Word processor applications
    deal with the content of a document. StarWriter is one of the few commercial applications
    that effectively marries these two forms of document creation.


    The following section of this chapter will use a series of tasks to demonstrate
    the use of these desktop publishing tools to create a family newsletter.


    # Things to Do with Art


    The most eye-catching effect that desktop publishing achieves is presentation
    of artwork in a document. Artwork is just that: any sort of picture or visual
    presentation of information. It can be a screenshot of a computer program or pictures
    from your last vacation.'
