  md: 'Getting something for free may mean you''ll have to work for it. Be aware that
    the size of the single download file is extremely large: around 70 MB. That means
    an optimal 28.8K modem connection, it will be about 6 to 7 hours to download this
    file. (This equates to 3 to 4 hours on a 56K modem and 1 to 2 hours on an ISDN
    connection.) It is recommended that you start the single file download before
    you go to bed at night or before you leave for work in the morning. A late night
    download will be the fastest, as North American and European traffic will be at
    its nightly ebb.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_28_0.png)


    Either way is fine. If you choose to download the segmented files, be sure to
    save them in the same directory on your Linux machine. Once you click any of the
    download links, you will see the Save As dialog box, seen in Figure 1-7. Choose
    a logical location on your computer and click OK.


    While your computer works on downloading the software, it may be a good time to
    do some yard work or catch up on a good night''s sleep, depending on your modem
    speed. The download progress is shown in the Download dialog box (see Figure 1-8).
    See you in the morning!


    ![](img/185096a0ec6a79f83b74a7ac44692a25_28_1.png)


