  md: '# 372 Chapter 17: Create the Best Presentations


    Mr. Buonarroti was a man with a problem. A painter by trade, he had just received
    a job from a very high official to paint a ceiling. The question was, what colors
    to use? The room itself was huge, the ceiling nearly 75 feet above the floor.
    This height meant that any designs on the ceiling would have to be big and bold,
    so as to be seen from the ground.


    Eventually, Mr. Buonarroti figured it out, and even though it took four years
    to finish the job, the custodians of the room were so impressed by his work that
    they hired him again 23 years later to paint another section of the ceiling—over
    the alter of the Sistine Chapel.


    And so, between 1535 and 1541, Mr. Buonarroti—better known to the rest of the
    world by his first name, Michelangelo—painted one of the best presentations ever
    created: the Last Judgement.


    # Presenting Your Work


    We are not Michelangelos, looking to release our artistic talents. But we all
    have ideas, some good and some bad. Communicating these ideas can be tricky, and
    we often need help, such as that which StarImpress provides, to get the message
    out.


    Having a great tool is not enough. Knowing how to use the tool is better, but
    still it''s not enough. You need to know what to do with StarImpress. What do
    you want to say? How will you work up to your point?


    # Starting with the End in Mind


    Start with the end in mind.


    This simple statement has no hidden complexity; it means what it says. Before
    you begin to work on your StarImpress presentation, list at least three goals
    you want to accomplish in your presentation. They do not necessarily have to be
    salient points of the presentation. Improving your public-speaking skills is always
    a worthwhile goal, for example.


    Once you''ve listed the goals, create a list of information related to these goals
    that you want audience members to know. If one of your goals is to educate the
    audience on the advantages of the Linux operating system, start listing the things
    you want the audience to remember when they walk back to their cupboards and offices.
    Complete this step for every self-directed goals; you will want them to remember
    what a great speaker you are.'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# Getting the Right Equipment


    Don''t assume that the cool LCD projector is available and in the conference room
    on time, you may be pleasantly surprised. Always double-check that the equipment
    you need is where you need it and that it''s in good working order.


    Also, the more important the presentation, the more you need to prepare for something
    to go wrong. Don''t put all your eggs in one basket. If you''ve decided to use
    an LCD projector connected to a computer to display your work, then have a backup
    ready in case something goes on the blink.


    # Knowing Your Audience


    Knowing your audience, even if it is people you have worked closely with for years,
    can be difficult. What kind of mood will they be in for your message? And do you
    get them from mood A to mood B, which ideally is open and questioning?


    Being ready for your audience is the hardest thing of all. The best approach is
    to know your topic inside and out. Your audience needs to hear the knowledge you
    have in your head, deliver that knowledge with poise and confidence (and maybe
    a couple of jokes).


    # Enhancing the Presentation


    Of course, it never hurts to give your audience something good to look at. As
    stated before, they''ll remember what they see more easily than what they hear.


    You can enhance StarImpress presentations in a multitude of ways beyond the good-looking,
    but basic, presentations generated by the AutoPilot. One word of caution before
    beginning the examination of these enhancements: don''t get carried away. Keep
    the look of your slides simple and cluttered. Don''t get crazy with five different
    kinds of transitions for a six-slide presentation. Simplicity and consistency
    are the wordcraft for a good StarImpress presentation.


    # Choosing Colors


    When Michelangelo painted the ceiling of the Sistine Chapel, used a variety of
    shades and tones, mostly mixed together by hand as he went. Today, paints premixed
    with names such as Limone, Toasted Almond, and Indian Corn. Keep in mind, these
    are names of paint colors, not ingredients of a new trail mix.


    Their names aside, it''s good that we have the ability to create so many varying
    shades. While careful: the right color combination can highlight your presentation,
    the wrong one can drive your audience to distraction. Whole volumes have been
    written'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# 374 Chapter 17: Create the Best Presentations


    on color theory, and it would be impossible to describe all of the different methods
    to determine what colors to use.


    Here''s a good rule of thumb: keep your backgrounds and your text and graphics
    in contrast to one another. If you use dark text, then make the background light,
    and vice versa.


    Another good rule of thumb is to experiment with different color combinations
    to see which tones complement each other and clash.


    In StarImpress, backgrounds typically link to the template of the presentation
    document. You can still edit them, however, as the following task will show.


