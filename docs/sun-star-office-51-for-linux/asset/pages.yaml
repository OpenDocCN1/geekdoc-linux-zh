    2. To see all events with a specific category at one, click the List view icon
    on the Object Bar.

    3. Click the Categories column heading to sort the events by category.


    # Scheduling Meetings


    Nobody works in a vacuum, even authors who sit alone, writing in cold, dark offices.
    Sooner or later in the business world, we all have to meet with someone else.

    It''s hard to set up a meeting in StarSchedule, but the application has some limitations.
    If you are on a network and can view the calendar files of your co-workers, then
    you can see their schedules blocked out while you set up the meeting. This helps
    you not schedule a meeting time that conflicts with others'' schedules.

    If, however, you cannot see other calendar files, you can only use regular e-mail
    to notify people about the meeting.

    Creating a meeting is identical to the process used to create an event, as you
    will see in the following two tasks.'
  merge: -1
  pgno: 492
- img_proc: true
  md: '# Chapter 2f: StarSchedule Your Meetings


    # Set a Meeting


    This task reviews the methods used to create a new meeting in StarSchedule.


    +   1. In the event calendar, select the meeting''s start time and day.

    2. Click the New Event icon on the Object Bar.

    3. Enter the title of your meeting.

    4. Click the Details icon.

    5. In the Details page of the Detail pane, enter the end time and the location
    of the meeting.

    6. Click the Participants button (see Figure 21-13).

    7. Click the Address Book icon on the Object Bar.

    8. Drag participants from the Address Book to the participants list.

    9. Click anywhere outside the meeting event.

    10. In the event calendar, right-click the event and choose Send Event as E-Mail
    from the context menu.

    11. StarSchedule places notification of the event in the Outbox for later delivery
    to the meeting participants.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_493_0.png)


    > Figure 21-13 Selecting meeting participants in this pane.'
  merge: -1
  pgno: 493
- img_proc: true
  md: '12. Monitor the status of each participant in the Details pane. Change his
    or her meeting attendance state as needed.


    # Create a Recurring Meeting


    This task reviews the methods used to create new recurring meetings in StarSchedule.


    +   1. In the event calendar, select a start time and day.

    2. Click the New Event icon on the Object Bar.

    3. Enter the title of your meeting.

    4. Press Enter to open the Details pane.

    5. In the Details page of the Detail pane, enter the end time and the location
    of the meeting event.

    6. Click the Participants button.

    7. Click the Address Book icon on the Object Bar.

    8. Drag participants from the Address Book to the participants list.

    9. Click the Recurrence button.

    10. Select the Monthly option.

    11. Have the meeting occur every fifth day of the month.

    12. Click anywhere outside the meeting event.

    13. In the event calendar, right-click the meeting event and choose Send Event
    as E-Mail from the context menu.

    14. StarSchedule places notification of the event in the Outbox for later delivery
    to the selected participants.

    15. Monitor the status of each participant in the Details pane. Change their State
    as needed.


    If a meeting needs to be changed, you can update all of the participants at once
    by following the steps in the next task.


    # Change or Cancel a Meeting


    This task highlights how to quickly notify all meeting participants of a change.


    +   1. Select a meeting event in StarSchedule.

    2. Make changes to any part of the meeting event.

    3. In the event calendar, right-click the event and choose Send Event as E-Mail
    from the context menu.'
  merge: -1
  pgno: 494
- img_proc: true
  md: '# Chapter 21: StarSchedule Your Meetings


    4. StarSchedule places notification of the changed meeting event in the Outbox
    for later delivery.


    # Tracking Your Things To Do


    Technology was supposed to make things easier easier for us. Remember that one?
    In case you had any doubts, try this statistic on size: 50,000 years ago, it took
    the average 20 hours a week to feed, clothe, and house his entire family. The
    rest of the time, he could lollygag.


    Today, that some person has to work an average of 50 hours a week to achieve the
    same goal. Technology hasn''t made things easier—it''s just given us more stuff
    to do before we relax with nuts and berries.


    StarSchedule is a pretty good way of tracking all of these tasks in your life.
    The interface to do so is deliberately simple. After all, why make the task list
    one more technological complication?


    ![](img/185096a0ec6a79f83b74a7ac44692a25_495_0.png)


    # Create a Task


    This task demonstrates how to enter a task in StarSchedule.


    +   1. In StarSchedule, click the New Task field just above the Task list.


    > ing the New Task icon on the Object Bar also starts this process.


    +   2. Enter a task.

    3. Click anywhere outside the New Task line. The completed task appears in the
    Task list.


    Not all tasks are created equal. This is a good thing, if you think about it.
    A surgeon should give a little higher priority to an appendectomy than picking
    up a new set of golf balls.


    Not all tasks have such an obvious difference in prioritization. It is up to you
    to define prioritization of your tasks.'
  merge: -1
  pgno: 495
- img_proc: true
  md: '# Prioritize Tasks


    This task explains how to prioritize tasks in StarSchedule.


    +   1. In the Explorer window, double-click the Tasks folder in the StarSchedule
    folder.

    2. In the Priority column, click a task''s priority value.

    3. Select a new value in the list.

    4. To sort tasks by priority, click the Priority column heading.

    5. In the Explorer window, double-click the Events folder.

    6. Right-click the Task list pane and select Sort.

    7. Change the values in the Sort dialog box to sort by Due Date and then Priority.

    8. Click OK. The Task list reorders according to the new sort parameters.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_496_0.png)


    # Conclusion


    As you have seen, tracking your days and nights is a pretty easy thing for StarSchedule
    to accomplish. If only it would actually do those tasks for you. Maybe in version
    6.


    This chapter concludes Sun StarOffice 5.1 for Linux. I Hope that you have gleaned
    some important information on how to use one of the most robust applications for
    the Linux environment.


    With the new distribution methods being planned by Sun Microsystems, StarOffice
    is fast becoming very popular on any of its platforms. It''s nice to know it will
    always have a home on Linux.'
  merge: -1
