    # AutoFormatting Your Work


    With all these auto-terms flying about, it''s easy to get confused about what
    tool does this task. AutoFormat is interlinked closely with the AutoCorrect feature,
    but they are really not similar.


    AutoFormat is a tool designed to apply several formatting changes to a particular
    element in StarWriter. That may not sound like a lot, but when you consider that
    the element is a table, and that AutoFormat can work on every cell in that table
    in just a few short stops—well, that''s a horse of a different color.


    Or, at least, a table of a different color.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_181_1.png)


    # AutoFormat a Table


    This task illustrates how to quickly AutoFormat a table in StarWriter.


    +   1. Create a table of any size in a StarWriter document, populating the cells
    with data, as well (see Figure 7-28).

    2. With the cursor anywhere within the table, choose Format, AutoFormat.

    3. Select an attractive format in the AutoFormat dialog box (see Figure 7-29).

    4. Click on the More button to view the elements affected by the AutoFormat format.'
