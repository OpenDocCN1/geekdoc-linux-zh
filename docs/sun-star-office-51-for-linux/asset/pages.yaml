  md: 'Linux and StarOffice seem made to be together. Not only is StarOffice one of
    the few robust office suites available for the Linux platform but the two products
    have similar histories, as well. Indeed, the development of Linux and StarOffice
    has many parallels, the two systems did not join together until 1996.


    Like Linux, StarOffice began with a student, 16-year-old Marco Börries, who founded
    Star Division in 1985. Börries started his fledgling software development company
    with StarWriter, a DOS-based application, Star Division gained a lot of industry
    acclaim in a short amount of time.


    By 1995, Star Division had added more functionality to its flagship products.
    Not only StarWriter, but StarCalc, StarBase, and StarDraw were offered to the
    public, both separately and as part of the new StarOffice product. While Microsoft
    Office began to dominate the North American market, European markets embraced
    StarOffice, due to its lower retail price, critical acclaim, and smaller footprint.


    A year later, StarOffice 3.1 became the first version of the application adapted
    for use on Linux.


    Today, StarOffice is available on Linux, Windows, OS/2, Sun/Solaris, and UNIX
    and has been recently bought by Sun Microsystems, which has big plans for the
    application.


    StarOffice offers one more unique feature that other office suites don''t have.
    You can download and install the full version of the application from the Internet.
    And, depending on how you plan to use StarOffice, you may not have to spend a
    dime to get it.


    # ## About This Book


    This book is the first volume in the Prima Tech Linux series. It gives readers
    a look into one aspect of the Linux operating system. Later books in the series
    will explore other applications made for Linux, as well as distribution of the
    operating system itself.


    This book contains dozens of tasks, each designed to walk you through the most
    commonly performed functions in StarOffice. This approach gets you on the way
    to using the application in the most efficient manner.'
