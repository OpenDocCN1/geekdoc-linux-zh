  md: '# Chapter 15: StarMath: Not Just for Rocket Scientists


    Creating a complex formula is not difficult in StarMath, as long as you consider
    which operators to build first. The equation to calculate the orbital period of
    a body in orbit around a planet serves as an example of a complex formula. The
    formula has two variables and two constants:


    +   - M. The mass of the planet and the orbiting body combined.

    - a. The length of the semi-major axis of the orbit.

    - G. The gravitational constant of the universe.

    - Pi. The ratio between the circumference of a circle and its diameter.


    You don''t need to understand all of the mathematical concepts of this formula
    to complete the following task, which walks you through building the following
    formula:


    ```

    $P=2\sqrt{\frac{a^3}{GM}}$

    ```


    ![](img/185096a0ec6a79f83b74a7ac44692a25_359_0.png)


    # Create Complex Formulas


    This task demonstrates how to build a complex formula in StarMath.


    +   1. From any part of StarOffice, choose File, New, Formula. A new StarMath
    document appears.

    2. Click the Unary/Binary category icon in the Selection window, and then click
    the Division (Fraction) icon.

    3. In the Commands window, select the denominator placeholder.

    4. In the Selection window, select the Function category icon, and then click
    the Square Root icon. The formula thus far should look like the one in Figure
    15-9.

    5. With the placeholder of the Square Root operator still selected, click the
    Division (Fraction) icon in the Unary/Binary category once more.

    6. Select the placeholder of the numerator of the root fraction and click the
    Multiplication (Dot) icon under the Unary/Binary category.

    7. Select the placeholder of the denominator of the root fraction. Then, in the
    Functions category, click the Power operator icon.

    8. Enter a in the value section of the Power operator and 3 in the exponent section.
    Figure 15-10 shows the formula at this stage.

    9. Replace the placeholders in the multiplication operation in the numerator of
    the root fraction with G and M.

    10. Select the placeholder of the numerator of the overall fraction and enter
    2.'
