  md: '# Conclusion


    This chapter has looked deeply into the StarDraw component, and for good reason:
    it is perhaps the most tool-laden component in the StarOffice application. StarDraw
    is certainly the most intimidating for those who did not do well in art class.
    With a little practice and imagination, StarDraw can put you on the path to artistic
    achievement.


    This chapter concludes Part IV of this book. Part V turns to a discussion of what
