  md: '# Sorting Data


    Sorting data is a nice way to keep things orderly in a disorderly world. Data
    rarely comes to us in an alphabetical manner, or any other orderly form. So, it''s
    up to us to make sense of it.


    In Chapter 11, we reviewed the AutoSort function of StarCalc. While this is a
    handy tool, you can do still more with sorting in StarCalc.


    Like the AutoFilter, AutoSort has limitations. It can only sort by one set of
    values. It does not let you choose the value, either as it uses the left-most
    column of values in the selected range.


    This is fine for quick sorts, but the Sort function lets you sort with up to three
    separate criteria.


    # Sort Data with Multiple Criteria


    This task illustrates the use of the Sort function in StarCalc.


