  md: '# Chapter 1: Getting, Installing, and Configuring StarOffice


    ife is all about choices. What shoes do I wear today? What name do we give our
    baby? Where do I go on vacation? These are not trivial questions. Nor is the question
    of what office suite you should use. For years, Microsoft Office has been the
    big cheese in the United States. Lately, however, a new product is making a splash
    in the software industry: StarOffice.


    This chapter will guide you through the steps needed to acquire and install Sun
    Microsystems'' StarOffice for your own Linux PC.


    # Obtain StarOffice for Your Machine


    Judging by the fact that you have purchased or are at least perusing this book


    More and more these days, the Internet is becoming a marketplace. Star Division,
    the company that first developed StarOffice, recognized this trend early in the
    history of online shopping. By 1996, StarOffice 3.0 was distributed online—a key
    factor in getting the software noticed by consumers around the world. In September
    of 1999, it was announced that Star Division was being purchased by the American
    Sun Microsystems. At first, it did not seem obvious why the maker of Sun Solaris
    and the author of the Java programming language would have an interest in a German
    office suite like StarOffice.


    Interviews with Sun''s CEO Scott McNeally made clear things. McNe revealed plans
    to take the brand-new Java version of StarOffice and create a network-enabled
    service called Portal. StarPortal would be available on participating Internet
    Service Provider''s sites, where customers could sign up for word processing,
    spreadsheet, and other services for a small additional fee added to their monthly
    basic Internet fee.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_23_0.png)


    At the same time, StarOffice''s Deluxe Edition would be made free of charge to
    the public both on the Internet and on CD-ROM. The CD-ROM version would also be
    incorporated into the ISP''s initial offer of CD-ROMs. ISPs would not only offer
    a connection to the Internet, but would also provide a free Microsoft Office-compatible
    application to their new customers.


    In the meantime, anyone can take advantage of Sun''s offering right now!


    Internet Service Provider (ISP): Companies that provide connection to the Internet
    for their customers.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# # Find StarOffice Online


    Getting to StarOffice on the Internet is easy. Open your Web browser, connect
    to the Internet following your normal procedures, type **www.sun.com/staroffice**
    into your location or address field, and press the Enter key. This opens the StarOffice
    home page, as seen in Figure 1-1.


    As said at the beginning of the chapter, life is full of choices. When you click
    the Get StarOffice link, the next page presents the downloading options page.


    Before Sun''s purchase of Star Division, there were many versions of StarOffice
    to obtain for each operating system: Personal, Deluxe, Professional, and so on.
    On these, only the Personal Edition was free. Today, Sun is offering the version
    known as Deluxe as its standard, free offering. This is great news for StarOffice
    users, as you will get more file filters and technical support for free!


    # # Obtain StarOffice Online


    Now that you know where to find StarOffice, you''ll see how easy it is to get
    a copy of StarOffice 5.1 on your Linux machine.


    Referring back to Figure 1-1, note the Get StarOffice link. Click this link. The
    main download page for StarOffice (see Figure 1-2) appears. The version of StarOffice
    you want (in our case, the Linux English version) and click the Download button
    to proceed.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_24_0.png)


    Figure 1-1 The StarOffice home page on Sun Microsystems web site.'
