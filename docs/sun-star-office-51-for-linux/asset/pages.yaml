    The SIS still has a long way to go before it solves all of StarOffice''s problems.
    But, as time passes, more questions and answers will be entered into the system,
    making it a more robust help tool.


    # Conclusion


    This chapter reviewed the different ways to get assistance in StarOffice, primarily
    with the help system.


    In the future, there will be other more interactive Help tools, such as StarChannels.
    When fully implemented, StarChannels will give you the ability to download updates
    to StarOffice automatically, access live stock and news feeds, and access more
    help files. At the time this book went to press, the StarChannels tool was still
    in the development phase, with only an update mechanism for the Sun Solaris flavor
    of StarOffice available. Until that time, the online help systems provide good
    tools to use when you get stuck in StarOffice.


    The next chapter begins Part II of this book: a complete section on the most-used
    (and oldest) component of StarOffice—StarWriter.'
