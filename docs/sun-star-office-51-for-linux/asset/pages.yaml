    # Building Data References


    A reference is how one cell communicates with another. No matter how sophisticated
    a spreadsheet looks, it all hinges on references.


    When you place a reference within a cell, you have directly linked it to the cell
    being referenced. Any changes made in the referenced cell immediately reflect
    in the referencing cell.


    In Figure 12-1 you can see this illustrated. The value in cell E10 is identical
    to the value in cell B12.


    In the Formula Bar, the value assigned to cell D5 is


    ```

    -B3

    ```


    This tells StarCalc to keep an eye on the contents of cell B3 and display any
    value found there within cell D5 as well. Nothing too difficult; this is not rocket
    science.


    One cell can directly reference one cell at a time, which means you cannot display
    the contents of cells B1, B2, and B3 simultaneously in cell D5. However, one cell
    can be referenced by a number of other cells. So, D5 can display the contents
    of B3, but so can E17, H12, and so on.


    All of this freedom has some drawbacks. As mentioned in Chapter 11, "StarCalc
    Basics," cross-references can be broken if cell values can''t be located. You
    also need to look out for circular references.


    You create a circular reference when you accidentally make cell refer to each
    other. This seems easy to avoid, but sometimes a circular reference can sneak
    in'
