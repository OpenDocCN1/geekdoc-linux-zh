  md: '# 432 Chapter 18: You Have StarMail


    April 3, 1860 will forever be etched in American history. On that day, 49 letters
    and five telegrams left St. Joseph, Missouri in a hurry, strapped to the saddle
    of a horse. Simultaneously, another mail-bound horse rider left San Francisco
    to a steamboat bound for Sacramento.


    For 19 months, this journey repeated as riders traversed the entire western half
    of the then-young United States in ten days or less. Dozens of riders, 400 horses,
    and 157 relay stations kept the mail moving at the fastest speed ever known. Though
    it operated for less than two years, the Pony Express gave the few Western states
    and the rest of the nation the ability to communicate.


    Information today is the lifeblood of Western society, replacing even money as
    the ultimate goal. Without information, many reason, there would be no way to
    obtain the money anyway. So today, this very instant, we can turn on the TV or
    surf the Internet and find out what is happening in a small town in miles.


    E-mail contributes enormously to the time it takes to read this sentence, an e-mail
    message can travel around the world. Think about this: in the time you can communicate
    to anyone who can access the Internet for such a low cost it is practically free.


    Because it is a complete office suite solution, StarOffice has StarMail, its own
    way of tapping into this communications media. With it, you can e-mail colleagues
    across the hall or around the world with ease.


    # Exploring the StarMail Interface


    At first glance, the StarMail interface may seem a bit cluttered and perhaps a
    little confusing. Of all of the components in StarOffice, StarMail makes the most
    aggressive use of available screen real estate. Figure 19-1 illustrates this unique
    interface design.


    One of the big differences between StarMail and those of other StarOffice components
    is the use of the Explorer. While you can use the Explorer in any of the StarOffice
    components at any time, you usually don''t need it to any great degree. In StarMail,
    the Explorer is a crucial element of the interface and should be kept visible.


    The Explorer displays the number of messages sitting in the Inbox and Outbox.
    The Inbox and Outbox are euphemisms for directories that keep all incoming and
    outgoing mail, respectively. The numbers in parentheses indicate how many messages
    sit in each folder.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_451_0.png)'
  merge: -1
  pgno: 451
- img_proc: true
  md: '# Exploring the StarMail Interface


    Inbox Outbox


    | Number of messages | Explorer | Message list pane |

    | --- | --- | --- |

    | Number of unread messages | Header information pane |


    ![](img/185096a0ec6a79f83b74a7ac44692a25_452_0.png)


    Figure 18-1 The StarMail interface for reading e-mail.


    If you have unread messages in the Inbox, the folder name appears in bold with
    a set of two numbers. The first number indicates the number of unread messages
    in the Inbox, and the second refers to the total number of messages.


    The Outbox can display two messages as well. When appropriate, the first header
    refers to the number of messages yet to be actually sent on the Internet and the
    second refers to the total number of messages in the folder.


    An important distinction should be made clear right away: Clicking the Sending
    icon does not immediately send the message out to the big, wide world. Instead,
    StarMail stores the message in the Outbox until the next time you connect the
    computer to the Internet.


    Another feature that may seem new to regular e-mail users is the message header
    methodology. StarMail, unless specifically instructed otherwise, only downloads
    message headers from the mail server. It downloads the content of the message
    only upon request.'
