    To which your brain quickly replies with a hearty "ouch!"


    StarCalc cells can do more than sit there and show pretty data—though they do
    that rather well. In StarCalc, cells can communicate with each other, building
    results and new data based on combinations of the old.


    In this chapter you will learn how to get the cells in your StarCalc spreadsheet
