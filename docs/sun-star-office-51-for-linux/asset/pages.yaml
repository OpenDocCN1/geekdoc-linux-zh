  md: '# The StarWriter Interface


    # Hyperlink Bar Icon


    This icon has the simplest job on the toolbar: it opens the Hyperlink Bar, which
    Chapter 3, “Working with StarDesktop” introduced, and Chapter 10, “Publishing
    Your Documents Everywhere” will demonstrate more thoroughly.


    # Nonprinting Characters and Picture Icons


    Nonprinting characters are characters that never appear on the printed page. Despite
    this, they are rather useful to have around. These characters include paragraph
    marks, tabs, and spaces.


    Click the Nonprinting Characters to reveal these hidden marks on screen, as seen
    in Figure 6-11.


    Having visible nonprinting characters is good when you fine-tune the layout of
    your document and you can''t figure out why a certain paragraph looks a certain
    way. A quick look at the “invisible” characters may reveal, for example, that
    someone used five consecutive spaces rather than a tab to gain some spacing.


    # Nonprinting characters


    ![](img/185096a0ec6a79f83b74a7ac44692a25_136_0.png)


    Figure 6-11 See the invisible workings of a document.'
