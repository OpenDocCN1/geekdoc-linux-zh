- img_proc: true
  md: 'You are probably familiar with the adage that history repeats itself; it means
    that there''s really no such thing as a completely new idea. All ideas borrow
    from concepts that have been thought of before. The computer? Engineers built
    the first ones on the principles of a mechanical adding machine, which had its
    origins in the abacus, which in turn had its origins in counting sticks and stones.


    This is not to say that ideas haven''t been improved upon. Certainly the telephone
    is a great idea, much better than shouting across the city. Potato chips were
    a brilliant invention, even if an angry chef invented them out of spite for a
    customer who kept demanding thinner potato slices.


    This constant hybridization of old ideas into new keeps our personal knowledge
    growing by leaps and bounds. One of these old-to-new ideas is the subject of this
    chapter: the newsgroup.


    # # Newsgroups: A Not-So-New Way to Talk


    The newssgroups on the Internet descend directly from the old electronic bulletin
    boards (EBBs) pervasive in the late 1980s, before the Internet freely opened up
    to private citizens. On these EBBs, people posted notes and comments on any topic,
    to be read by all subscribers to the EBB.


    EBBs got their conceptual start from the cork and tack bulletin boards found in
    super-markets, places of worship, and offices. People posted little colourful
    sheets of paper announcing anything under the sun onto these cork boards in layers
    and layers.


    Today''s newssgroups reside on the Usenet network, a sub-section of the Internet.
    News servers on Usenet host select a number of newsgroups and messages, they forward
    them to the next servers they find in the Usenet network, like a giant game of
    Telephone. How many messages each server holds depends on the space on the server
    and other considerations of the server''s administrator.


    The messages on newssgroups contain the full range of human emotion and achievement.
    People can learn more about the world around them, meet new people, fall in love
    with someone they have never met. Newsgroups are true communities on the Internet.'
  merge: -1
  pgno: 469
- img_proc: true
  md: '# Newsgroups: A Not-So-New Way to talk


    # The Good Stuff


    Over 35,000 newsgroups exist. That''s just the public ones; some corporations
    have their own private newsgroups, as well. This huge number of newsgroups means
    you will likely find a discussion on a topic of interest to you.


    Newsgroups typically carry a name indicating the topic they discuss. Related groups
    arrange into hierarchies. The first name in the newsgroup is usually the general
    hierarchy of the topic.


    When Usenet first began, it had just seven hierarchies: alt, comp, misc, rec,
    sci, soc, and talk. This hierarchy structure was held in check by the nature of
    the newsgroup creation process. With the exception of the alt groups (more on
    those later), new newsgroups could only be formed by a consensus of current newsgroup
    users. comp.os.linux.powerpc could not be formed until enough people in the other
    comp.os.linux groups decided to make it so.


    Today, Usenet has many hierarchies, newsgroup users agree to add and more news
    servers. Table 20-1 lists some of the most populated hierarchies.


    | Hierarchy | Description |

    | --- | --- |

    | 3dfx.* | Three Dimensional Effects |

    | alt.* | Alternative |

    | ca. | Canada |

    | christnet.* | Christian Network |

    | comp.* | Computers |

    | compuserve | CompuServe |

    | control.* | Control |

    | de. | Germany (Deutschland) |

    | fr.* | France |

    | gnu.* | GNU Operating System |

    | gov.* | Government Information |

    | humanities.* | Humanities |

    | ieee.* | IEEE Standards |

    | linux.* | Linux Operating System |

    | microsoft.* | Microsoft |

    | misc.* | Miscellaneous |

    | news.* | Usenet News |

    | rec. | Recreational |

    | sci.* | Science |

    | soc.* | Social Issues |

    | talk.* | Talk |

    | uk.* | United Kingdom |'
  merge: -1
  pgno: 470
- img_proc: true
  md: '# Chapter 20: Talk About it with StarDiscussion


    To keep the newsgroups on topic, many of them have moderators. Posts to moderated
    newsgroups are monitored by some lucky soul who determines whether the posting
    is relevant to the group. If it is, then they post it for all to see. If not,
    zap!


    Many of the larger newsgroups, and all of the alt groups, do not have moderators.
    With the larger groups, the size and amount of traffic means non-topic messages
    are bound to creep in. The alt groups, they''re another story, as you will learn
    in the next section.


    # The Not-So-Good Stuff


    If newsgroups represent an online community, then the alt hierarchy newsgroups
    represent the more radical side of society. It is here that Usenet rules relax
    and groups go unmoderated. This "anything goes" attitude means that anything can
    (and possibly does).


    In these groups exists a majority of the erotic and inflammatory messages and
    files found in Usenet. I say this not to be judgmental, but rather as a warning.
    If you are an adult, you are free to read any material, whether you agree with
    it or not. But be forewarned: some of this stuff is pretty strong and well into
    the X-rated form of media.


    This is *not* to say that all alt groups contain pornographic material! In fact


    Alt groups can be fun to explore, and anyone with a news server can create an
    alt group, some of the groups can be pretty interesting. Just look carefully.


    # The StarDiscussion Interface


    Looking at the StarDiscussion interface shown in Figure 20-1, you will see that
    it looks rather familiar. In fact, it is identical to the StarMail interface.
    Only the structure of the message list has changed, and not by much.


    A new organization in the message list requires some explanation. When messages
    have the same subject line, StarDiscussion treats them as part of a thread. On
    the Internet, a thread is a set of messages related to a common subject. StarDiscussion
    has two types of threads: direct-reply threads and common-subject threads.


    Direct-reply threads are sequences of messages that reply back and forth between
    newsgroup users on the same subject. Common-subject threads consist of multiple
    postings on one subject, but the messages may not be direct replies to other messages
    in the thread. StarDiscussion groups these together under a folder with the subject
    heading.'
