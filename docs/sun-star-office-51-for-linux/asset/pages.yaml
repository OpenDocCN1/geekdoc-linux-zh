    # Option Bar


    The Option Bar is a new toolbar for those of you reading this book from cover
    to cover. You find it only within the StarImpress and StarDraw components. This
    toolbar contains a variety of features to customize the way you edit or create
    slides with StarImpress.


    For instance, you can set what happens when you select a text object. Do you want
    text handles to appear, or do you want to go straight into editing the text within?
    You may want to use the double-click action to edit text in text objects, or you
    may elect not to be able to edit the text at all. The choice is yours, among several
    others. Figure 16-6 and Table 16-5 illustrate and detail the features of the icons
    on the Option Bar.


