  md: '# Spelling and Auto Spellcheck Icons


    The odds are very high that you, reader, have a scotoma.


    Before you run off to the doctor, a scotoma is not something life-threatening,
    but it is a pain.


    "Scotoma" is an editorial term for those funny little quirks that show up in consistently
    misspelled or mispronounced words. No matter how many times you type the word,
    the word, even you say it out loud—you still lock up and goof it.


    Most people have scotomas, even professional authors. Used to rely heavily on
    the skills of their editors and proofreaders to catch these mistakes, nowadays
    most word processing programs have spell-checkers to help everyone.


    StarWriter is no exception, having two icons on the Main Toolbar to facilitate
    good spelling: the Spelling and AutoSpellcheck icons. The Spelling icon''s capabilities
    will be explored in Chapter 7, but I''ll demonstrate AutoSpellcheck here in this
    chapter.


    Figure 6-10 shows a document with the AutoSpellcheck function turned on. Notice
    the wavy lines underneath certain words (they appear in red on screen). StarWriter
    doesn''t recognize these words, but not necessarily of misspellings.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_135_0.png)


    > If you are using a new term that you want StarWriter to treat as a valid word,
    right-click the underlined word and choose the Add command.


    # Search Icon


    Use the Search icon when you want to find a particular word in a document. Also
    use this tool whenever you need to replace a given word, sentence, or even paragraph
    style with another form of text or paragraph style.


    The Search & Replace dialog box appears when you click the Search icon. Chapter
    7 will detail the workings of this dialog box.


    | Unrecognized words |

    | --- |

    | Page 3 / 17 | Standard | B1K | STD HVP |

    | Start | PCRAILfo |


    ![](img/185096a0ec6a79f83b74a7ac44692a25_135_1.png)


    Figure 6-10 StarWriter highlights misspelled and unknown words.'
