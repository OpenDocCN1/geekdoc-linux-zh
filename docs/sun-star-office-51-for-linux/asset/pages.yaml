  md: 'Some people are good at presentations. They stand up in front of everyone and
    mesmerize us with their logic, charisma, and charm. No notes, no slides—just the
    person and their vision. The rest of us may require a little assistance.


    Since many people fear public speaking second only to death, they would rather
    not become fiery orators in order to get their points across. Which leaves the
    second option: another way to communicate.


    Which brings us to the component in StarOffice that gets this job done for you:
    StarImpress.


    If you are familiar with Microsoft Office, StarImpress is the counterpart to the
    PowerPoint application. Those who use Corel''s WordPerfect 2000 will recognize
    the similarity to Corel Presentations. But for creating presentations on the Linux
    platform, only one competitor, Applixware for Linux, has a comparable application.


    # Learning the Tools to Use


    The makers of StarImpress have loaded it with dozens of interesting tools that
    help you build incredible presentations with ease. This is readily apparent when
    looking at the StarImpress interface (see Figure 16-1).


    Within StarImpress, you can choose from six views when working with your presentation.
    Five of these views enable you to edit your presentation in different ways. The
    sixth lets you view your presentation from start to finish. Figure 16-2 highlights
    the view controls in the upper-right corner of the interface. Table 16-1 outlines
    the different views and their purposes.


    | Table 16-1 The StarImpress Views |

    | View | Function |

    | Drawing | The default (and primary) view in StarImpress, where you edit slides
    on an individual level. |

    | Outline | This view enables the creation and editing of the presentation''s
    outline, which the slides directly reflect. |

    | Slide Sort | Use the Slide Sort view to shift the slide order in a presentation,
    if needed. |

    | Notes | Many presenters need notes to guide them through their presentation.
    Use this view to create such notes. |

    | Handout | Sometimes handouts accompany presentations so the audience can follow
    along and create their own notes. This view enables the creation of handouts.
    |

    | Slide Show | This-only view shows the presentation in its entirety. |'
  merge: -1
