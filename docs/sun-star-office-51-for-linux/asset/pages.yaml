    # Eliminating Typos as You Go


    In Chapter 6, “StarWriter Basics,” you were introduced to the Auto Spellcheck
    and Spelling icons on the Main Toolbar. Now is time to examine these tools, and
    one other, more closely.


    AutoCorrect and Auto Spellcheck may seem to similar tools and in a way, they are.
    Each seeks out unrecognized words. AutoCorrect does more than just highlight these
    words. If AutoCorrect recognizes what word should be, it goes ahead and corrects
    the spelling, even as you type the rest of the sentence.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_178_1.png)'
  merge: -1
