    # 3-D Objects


    On paper, of course, three-dimensional objects only appear to be this way. After
    all, they still use only two dimensions. But the unique look of a solid object
    can be translated into three dimensions given the right shadowing and perceptions.


    StarDraw lets you create preset "solid" shapes. You can rotate these solid shapes,
    reshape them, even illuminate them from various light sources.


    StarDraw can create even more solid shapes, as will be seen in the section “Entering
    the Third Dimension” in this chapter. Until then, Figure 18-8 shows the contents
    of the 3-D Objects floating toolbar.


    # Line


    As has been said before, nature doesn’t produce straight lines. A true straight
    line is a mathematical construct. Sure, you can get the straightest line and draw
    the straightest line with it, but is it 100 percent straight? Doubtful. The paper
    and the desk it sits on bow slightly to the forces of gravity.


    Still, we keep using lines, because despite their imperfections, people have decided
    that they are straight and that’s the story we’re sticking to.'
