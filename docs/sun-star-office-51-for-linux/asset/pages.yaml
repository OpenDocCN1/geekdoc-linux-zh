    Basics."


    # StarCalc: Figure It All Out


    Spreadsheets get their name from the old-fashioned ledger sheets used by desk-bound
    accountants. In their work, they would lay out numbers on what were at times huge
    sheets of grid-lined paper. Sometimes these sheets would be yards long and if
    a mistake were made in just one cell ... well, let''s say the mistake would be
    rather tedious to find and fix.


    The concept of these paper sheets has been carried over to electronic format.
    It makes sense to keep data in this familiar tabular format. Thus, the first spreadsheet,
    VisiCalc, was born. Though no relation to StarCalc, a lot of the concepts introduced
    in VisiCalc provide the basis for StarCalc''s design.


    Figure 2-4 shows the basic elements common to all spreadsheets: cells, rows, and
    columns. You can''t have a spreadsheet without these elements. Spreadsheet programs
    differ in the way they present and utilize these elements.


    Cells are the heart of a spreadsheet. They contain the data. The data values can
    be numbers, letters, words—whatever you want to keep track of. Cells can also
    contain formulas. Formulas are mathematical equations that take the value of one
    cell and relate it to the value of another cell to come up with a unique answer.
    If needed, formulas can equate ranges of cells.'
