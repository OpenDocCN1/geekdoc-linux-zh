  md: '# Chapter 7: Shifting Into Automatic with StarWriter


    # Make AutoCorrect Settings


    This task shows how to configure StarWriter''s AutoCorrect tool.


    +   1. In any open StarWriter document, select Tools, AutoCorrect/AutoFormat.

    2. In the Replace tab (see Figure 7-25), enter Star Office in the Replace field.

    3. Enter StarOffice in the With field.

    4. Click the New button.

    5. Click the Exceptions tab.

    6. Enter hon. in the abbreviations field (for “Honorable”).

    7. Click the New button.

    8. Click the Options tab.

    9. Clear the Detect URL option in the modifying and typing columns.

    10. Click the Custom Quotes tab.

    11. Choose what you would like your double and single quotes to look like.

    12. Click OK to complete the operation.


    AutoCorrect will not be able to recognize every spelling mistake, and that''s
    where the Auto Spellcheck and Spelling tools come in. They won''t fix everything
    for you automatically, but they do point out any word they don''t recognize so
    you can choose whether to fix it.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_179_0.png)


    Figure 7-25 Adding words to be AutoCorrected.'
