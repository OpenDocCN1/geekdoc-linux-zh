    # Building Your Own Database


    If you have a collection, you know how important it is to keep track of it. You
    may constantly acquire new items for the collection, trading with other hobbyists
    in order to finage acquisition of the item you desire most.


    You have seen how StarBase manages addresses, and maybe now you''re thinking creating
    your own database to track the things in your collection. This is not a bad idea,
    because StarBase makes database creation simple.


    To create a working database, you need to build the following items in this order:


    +   1. Database file

    2. Table

    3. Form


    You always need to build the database file first. You could, in theory, create
    the form before the table, but that can be cumbersome. Why do all the extra work?


    The remainder of this chapter is devoted to the creation of a comic book collection
    database. As you follow along, watch carefully and think about how you would like
    to build a database for your own collection.


    # Choosing Database Formats


    StarOffice is unique among Linux office suites because of its compatibility with
    other programs. StarBase is no exception, having the capability to create databases
    in server formats other than its native StarBase format:


    +   - DB2

    - dBase

    - JDBC

    - Microsoft Access 97

    - ODBC

    - Oracle

    - Text'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Building Your Own Database


    Which format should you choose depends on a couple of things. If you import data
    from another database in one of these formats, then you should select that format.
    You might also save a copy of the database in an alternate format if you intend
    to share the file with others who—heaven forbid—might not use StarOffice.


    The following task shows how to begin construction of the database.


    # Build a Database


    This task accomplishes the first stage of creating a database in StarBase: creating
    the main database file.


    +   1. In any StarOffice component, click File, New, Database. Figure 13-13 displays
    the Properties of <Database> dialog box.

