    # # Opening More Windows


    So far, things have been pretty easy. You''ve been humming along, working in one
    window, and then another, each separate from the other windows.


    That''s about to change.


    The concept of having one window per StarOffice is all well and good when your
    tasks do not relate to each other. But more and more, documents are not made up
    of just one kind of file. Spreadsheets need to work with reports, which in turn
    need artwork. With such a big project, it would be nice to see all of the different
    components at once.


    Now you can open as many windows related to one active Taskbar icon that can reasonably
    fit on-screen.


    # ## Explore Multiple Windows Related to a Single Taskbar Icon


    Follow these steps to use multiple windows for a single Taskbar icon.


    +   1. With any StarOffice open document, choose Window, New Window. A new window
    containing the same type of document as the original appears (see Figure 4-10).

    2. Click any part of each open window. Note the name change in the active task
    icon on the Taskbar.

    3. Resize each window by dragging the divider bar between the windows.


    > The menu commands in the Window menu do not affect all open windows. With the
    exception of New Window, the commands affect only the active window.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_104_1.png)


    ![](img/185096a0ec6a79f83b74a7ac44692a25_104_2.png)'
