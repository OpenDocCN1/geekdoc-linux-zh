    Money.


    The next task shows how StarCalc not only formats currency values, but does so
    in a very cosmopolitan manner.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_265_1.png)


    # Change Currency Format


    This task shows how to modify the format of a currency value within a spreadsheet.


    +   1. In an open StarCalc spreadsheet, select a cell with a numeric or currency
    data value.

    2. Choose Format, Cells.

    3. In the Cell Attributes dialog box, click the Numbers tab.

    4. Select Currency in the Category list.

    5. The Format list breaks into two sections: a list of nations and a list of available
    formats for that nation. Select Kê Czech.

    6. Select the -1234.-- Kê option.

    7. Click OK. The value now appears in Czech Republic koruna.


    Even though StarCalc offers a plethora of both common and esoteric formats, some-day
    you may need to create your own, as the following task demonstrates.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_265_2.png)


    # Create a New Data Format


    This task steps through the procedure to create a new data format in StarCalc.


    +   1. With any StarCalc spreadsheet open, choose Format, Cells.

    2. In the Cell Attributes dialog box, click the Numbers tab.

    3. Select Percent in the Category list.

    4. Select the -12.95% option in the Format list.'
