  md: '# Chapter 3: Working with StarDesktop


    # # Getting Around with Menus and the Keyboard


    In this section, we''ll review the most basic of interface key elements, the menu
    and the keyboard.


    # ## Menu Basics


    It may seem silly to review menus at this point in the book, since for nearly
    three chapters you have been asked to use them to run various commands. Nonetheless,
    you need to do this review in order to demonstrate things you likely have not
    done before.


    Menus are a very basic part of a graphical user interface. Because of their cascading
    group format, they allow you to access a large number of commands in a small amount
    of space. Menus do not have to be used exclusively with a mouse. If you prefer
    using a keyboard to the electronic reader, you can use the access keys to access
    the menu commands. Simply hold the Alt key and then press the underlined letter
    of the menu you want to view. For instance, to view the File menu, press Alt +
    F at the same time. From there, it''s just a matter of holding down the Alt key
    and typing the successive letters to get the command you want. File, Open, therefore,
    becomes Alt + F, O.


    # ## Custom Menus, Really!


    As nifty as menus, they can be rather cryptic at times. For one thing, in StarWriter,
    why is the Mail Merge command on the File menu and not on the Tools menu? If you
    don''t like where a menu command is, or want to add a new one, StarOffice lets
    you configure a menu any way you want it.


    # ## Configure a Menu


    In this task, you''ll move an existing menu command to a new menu, and you''ll
    create a new menu item and new submenu.


    +   1. Within any toolbar, right-click to open the context menu.

    2. Click the Configure command. The Configuration dialog box appears.

    3. Select the Menu tab. The dialog box appears similar to the one in Figure 3-16.


    The tilde (~) in the menu command names appear before letters designated menu
    accelerator keys. Double-clicking the menu command in the Configuration dialog
    box and carefully retyping the link in another location of the word modifies the
    accelerator keys.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_73_0.png)


    ![](img/185096a0ec6a79f83b74a7ac44692a25_73_1.png)'
  merge: -1
