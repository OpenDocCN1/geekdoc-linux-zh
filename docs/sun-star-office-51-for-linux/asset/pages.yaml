  md: '# Chapter 4: Managing Files in StarDesktop


    # Copy a File


    This task demonstrates how to copy a file within StarOffice.


    +   1. Find the file you wish to copy in either the Explorer, Beamer, or Desktop
    window.

    2. Right-click the file to be copied.

    3. Choose Copy from the context menu.

    4. Navigate to the folder or group in which you want to place the file.

    5. Right-click anywhere within the destination folder.

    6. Choose Paste from the context menu.


    An exact copy of the file is placed within the destination.


    # Move a File


    This task demonstrates two methods for moving a file within StarOffice. The first
    method is very similar to the previous task on copying a file.


    +   1. Find the file you wish to move in the Explorer, Beamer, or Desktop window.

    2. Right-click the file to be moved.

    3. Choose Cut from the context menu.

    4. Navigate to the folder or group to which you want to move the file.

    5. Right-click anywhere within the destination folder.

    6. Choose Paste from the context menu.


    The original file is placed within the destination.

    The second method is even simpler:


    +   1. In the Beamer or Desktop (or Explorer if in a non-Hierarchical view), single-click
    the file to be moved.

    2. Drag the file to its destination.


    The original file is placed within the destination directory.


    # Rename a File


    This task demonstrates how to rename a file within StarOffice.


    +   1. In the Beamer, Desktop, or Explorer, right-click the file to be renamed.'
