    # Conclusion


    In this chapter, you learned how to apply some neat tricks to your StarImpress
    presentation. You also picked up on the fact that too much of a good thing can
    present unique problems for presenters. Keeping your slides sharp but simple is
    the key to a great presentation.


    Civic spaces, meeting rooms, and convention halls—you may someday give a presentation
    in any or all of these places. These places, though they vary in size, all share
    a common condition: they are local. In this chapter you have also learned how
    to break this barrier and put forth your ideas to the world using the Internet.


    The spoken and written word are just a couple of kinds of creativity that can
    be expressed. Artistic expression is certainly another way to get your ideas out
    there for all to see. In Chapter 18, you will learn more about expressing your
    artistic side with StarOffice''s drawing component, StarDraw.'
