    # ## Lines, Arrows, and Connectors


    You can use lines to create objects in a drawing, but you can also use them to
    point things out to the viewer.


    The Lines and Arrows and Connector icons come next on the Main Toolbar. Both have
    similar goals of highlighting objects in a drawing but differing methodologies.


    The floating toolbar from the Lines and Arrows icon lists ten straight lines that
    you can create within StarDraw. You can make these lines fairly freeform, starting
    and finishing anywhere on the drawing page.


    Table 18-5 briefly details the specific function of each of the tools in the Lines
    and Arrows floating toolbar.


    Connectors, on the other hand, are not freeform, as you can only place them from
    one object handle to another. The "Building With Lines" section later in this
    chapter explains this in more detail. For now, Table 18-6 lists the multitude
    of available connectors.


    # ## Effects


    Every big movie produced by Hollywood these days has to have some kind of special
    effect. The story the movie tells may fall by the wayside as directors and producers
    try harder to trick our senses into believing the fantastic.


    This is not to say that effects in general are bad. But, as has been stressed
    through-out this book, everything in moderation is the key.'
  merge: -1
