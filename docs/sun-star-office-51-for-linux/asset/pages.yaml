    collective acts perfect.


    For good or ill, rehearsals are a necessary component of any presentation. It
    is never

    a good idea to just wing it. While practicing the speech that goes along with
    the

    slides, you can StarImpress keep track of the time you speak during each slide.

    It can even apply these times to slide transitions, fully automating your presentation.


