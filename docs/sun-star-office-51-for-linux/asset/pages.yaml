    # Using Special Tools


    StarWriter has additional tools within its chipset that can create incredible
    interactive Web pages. Delving into these tools would be a whole book unto itself,
    so we will provide just a quick overview here.


    The Insert, Object menu has commands for inserting a plug-in and an applet.'
