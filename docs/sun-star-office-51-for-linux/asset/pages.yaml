    # Not Just One Sheet


    The perceived universe has three dimensions: length, height, and depth. Some define
    time as the fourth dimension, and scientists have theorized the existence of objects
    called superstrings that may vibrate through as many as 11 dimensions, which is
    enough to make non-scientists'' heads hurt.


    For now, we will apply just the three-dimension analogy to StarCalc. Because now
    you have mastered the existence of the two-dimensional spreadsheet, it''s time
    to venture into the third dimension: multiple spreadsheets.


    The origin of multiple spreadsheets goes all the way back to the paper spreadsheets
    we talked about earlier in the book. When the early spreadsheets grew so large—with
    hundreds and thousands of rows and columns—some accountant-types got the idea
    to start layering some of the calculations onto other spreadsheets. In this manner,
    spreadsheets didn''t grow to huge sizes but still maintained the detail the accountants
    wanted.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'When electronic spreadsheets were created, this methodology carried over. Even
    though size is a less pressing issue on a computer screen scrolling, most people
    still find it cumbersome not to see all of the data in a reasonable area. And,
    because we often print electronic spreadsheets, they still relate to the old paper
    medium.


    When using multiple spreadsheets, it is important to remember how the sheets interconnect
    (if at all). Some people simply place unrelated datasets on each sheet, others
    relate data with many cross-references. If you do cross-references between multiple
    sheets, be careful that you do not inadvertently erase or change a piece of data
    cell on another sheet needs. Chapter 12 will further examine cross-references.


    The use of multiple sheets is pretty simple. To view another sheet, simply click
    its sheet tab near the bottom left corner of the screen. If you want to select
    more than one sheet (useful for printing), click a tab and hold the Shift key
    while clicking another tab. The two tabs and any in between become Selected. Select
    nonadjacent tabs, hold the Ctrl key while clicking.


    New StarCalc documents have three sheets by default. Sometimes you may need more
    (or fewer) sheets. The next task guides you through this procedure.


    # Create Multiple Sheets


    This task reviews the steps to create additional sheets in your spreadsheet document.


    +   1. In an open StarCalc document, right-click the sheet tab adjacent to the
    location where you want to insert a new sheet.

    2. Choose Insert from the context menu.

    3. In the Position area of the Insert Sheet dialog box (see Figure 11-16), select
    After selected sheet.

    4. Select the New sheet option.

    5. Leave the No. of Sheets value at 1 and enter a new name for the sheet in the
    Name field.

    6. Click OK. The new sheet appears, as seen in Figure 11-17.

    7. Right-click another sheet tab.

    8. Choose Delete from the context menu.

    9. When asked if you are sure you want to delete the selected sheet, click Yes.
    The sheet is removed from the spreadsheet document.


    Besides being able to create new sheets from scratch, StarCalc can import whole
    sheets from other documents. This is more effective and faster than cutting and
    pasting a data area from one document to another.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_256_0.png)'
