  md: '# Tips and Extended Tips


    Getting help in StarOffice is never hard to do. Tips and extended tips provide
    a subtle way to get assistance.


    But what is a tip in StarOffice? According to the application, two elements are
    known as tips.


    The first kind of tip is the little placards that pop up when you hold the mouse
    cursor over an icon in the toolbars. They list the actual name of the icon, as
    seen in Figure 3-27.


    You activate tips using the Help, Tips command.


    For more information, you can view extended tips using the Help, Extended Tips
    command. If you do this, you will note that now the yellow placards display quite
    a bit more explanation about what icons do, as seen in Figure 3-28.


    In addition to these pop-up tips, a second type of tip appears as information
    in the Tip window below the Desktop. These tips, displayed in Figure 3-29, give
    you random tidbits of information to help you use StarOffice.


    Unlike other windows, the Tip window cannot float. It sits on the bottom of the
    screen and that''s it.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_84_0.png)


    Figure 3-27 Toolbar tips.'
