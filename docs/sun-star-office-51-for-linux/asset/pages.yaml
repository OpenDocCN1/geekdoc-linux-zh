  md: '3. Enter a name for the new group.


    4. Press the Enter key.


    5. To add files to the new group, navigate to the appropriate files in the Explorer
    group.


    6. From either the desktop window or the Beamer window, drag the files to the
    empty new group.


    > Dragging and dropping files into an Explorer group automatically moves the files,
    as opposed to copying them. Be sure that other files or programs do not need the
    file in its old location.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_80_0.png)


    7. To move files into another group, drag the files to the destination group bar.
    Viewing files and folder contents within groups depends on the group''s view settings.
    When set to Large or Small Symbols, simply click the files or folders to view
    them on the desktop. If the group is set to Hierarchical view, double-clicking
    the files and folders accomplishes the same thing.


    Either way, if you are working in a document, you may not want the desktop taken
    over by files you are just trying to locate. For the solution to this problem,
    you need the Beamer window.


    # Examining Directories with the Beamer


    The Beamer is one of tools that needs to be used in conjunction with another.
    Alone, it is admittedly not very useful. The Beamer''s primary purpose is to display
    the files of any folder selected in a group of the Explorer window. Not folders—just
    files.


    This specificity means Beamer does not work well itself—sort of like a steering
    wheel without a car. But when you couple the Beamer with the Explorer, now you
    get a car with a steering wheel, a much more exciting (and safer) prospect.


    Start the Beamer exactly as you start Explorer, either with the Beamer On/Off
    icon on the Function Bar or with the Beamer command. You can float the Beamer
    window using the Ctrl + double-click action, too.


    To really see how Beamer can be useful, the next section will examine how it works
    with its partner tool, Explorer.


    # Beamer and Explorer: An Unbeatable Team


    If you have Beamer and Explorer at the same time, you can navigate through your
    Linux file system without leaving the document you are currently working on. Take
    a look at Figure 3-22 to see what this means.'
