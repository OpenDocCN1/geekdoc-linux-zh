  md: '# Good-Looking Data


    The human body has several quirks that we have to put up with daily. One of them
    is the wandering eye. It is not the wandering eye that gets spouses and significant
    others in trouble. Rather, it is the inability for our eyes to stay focused in
    any one place for almost any length of time.


    Our eyes, it seems, always have to be moving, soaking up the world around us.
    This translates into the need to create documents that attract our eyes so that
    they naturally want to look at the words on the page. It helps that in most cultures,
    lettering attracts the eye, even if we can figure out what they found. This is
    a learned response, the attraction doesn''t keep the eyes there for long. It becomes
    necessary, therefore, to keep the interest with something other than just letters.
    Sometimes it''s by outstanding content, other times by eye-catching colors (yellow
    fire trucks get more visual attention, for example, than red ones).


    One thing eyes—and the brain behind them—detect is fusion. Place a jumbled document
    or spreadsheet before someone, and the frustration level goes through the roof.
    At that point, the person will most likely ignore the document. Our visual system
    wants things simple and consistent.


    You can establish consistency in a StarCalc spreadsheet in many ways beyond the
    obvious use of colors and fills. One method is consistent formatting of data.
    In this context, the format of data refers to the way it appears.


    For instance, time can be expressed in many different ways. Right now, as I write
    these words, it is Saturday, August 14, 1999, 2:27 in the afternoon. Or is it
    1427 hrs on 8/14/99? Or is Sabru Leg, 14 Agustus 1999M, 3:34 WITA? Time can be
    presented in thousands of different formats. You are free to choose whichever
    of format you want, but it is important to maintain continuity. If you use a 12:34
    p.m. format in one cell with time data, then you should use the same format in
    other time data cells.


    Time is just one of the values in StarCalc that can have different formats. Dates,
    time, numbers, and currency can all be displayed in different ways, as you will
    learn in the next sections.


    # Formatting Text


    Text formats are perhaps the simplest to understand. StarCalc handles text in
    much the same way as StarWriter. Each cell can hold over 64,000 characters of
    text, so you can create whole documents within cells. But, why would you want
    to?


    You accomplish text formatting using the same tools found within StarWriter, with
    some additional functions designed specifically for cell use.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Chapter 11: StarCalc Basics


    # Star Task

    Change Text Format


    This task demonstrates the use of formatting tools within StarCalc to alter text
    presentation.


    +   1. Within an open StarCalc spreadsheet, select a cell with data.

    2. Click the Bold icon on the Object Bar.

    3. Enter 24 into the Font Size field.

    4. Choose Format, Cells.

    5. Click the Alignment tab in the Cell Attributes dialog box (see Figure 11-20).

    6. In the Orientation area, click the vertical ABCD button.

    7. Click OK. Figure 11-21 shows the newly formatted text.


    A cell can also be resized to fit all of the text within it.


    +   1. In an empty cell within the spreadsheet, enter a lengthy text passage.
    A small red triangle indicates the presence of overflow text.

    2. Choose Format, Cells.

    3. Click the Alignment tab in the Cell Attributes dialog box.

    4. Select the Line Break check box.

    5. Click OK. The lengthy text passage appears in full within the cell.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_261_0.png)


