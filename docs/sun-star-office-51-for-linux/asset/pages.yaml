  md: '# Chapter 5: Sending Out an SOS


    The ability to help our fellow human beings is hard-wired into our genes. Still,
    we find ways to ignore this urge to assist others. But every once in a while,
    someone makes an effort and help is offered.


    # Going Beyond Help Agent Basics


    Let''s kid ourselves: online help systems are usually not the best way to get
    assistance when we have a problem. In Linux, the man pages are helpful, but sometimes
    finding the correct topic is tricky.


    Sun Microsystems has done a fair job of putting together the help files for StarOffice.
    They have ways to go before they perfect the system, however. Despite its shortcomings,
    some features of the help system really shine. For this reason, discounting the
    help files would be an error.


    In Chapter 3, "Working with StarDesktop", I briefly introduced you to the Help
    Agent, a definite plus in StarOffice''s help arsenal. In this chapter, we''ll
    further examine this tool, and we''ll also look at the main help system in detail.


    # Help Agent 007


    When you''ve turned the Help Agent on, it proactively gives you unsolicited help
    on the objects it recognizes on the screen. You open this window by choosing Help,
    Help Agent or by clicking the Help Agent icon in the Function toolbar. Figure
    5-1 shows a view of the Help Agent doing its job.


    While the Help Agent is present, every time you click a menu command or toolbar
    icon, Help Agent quickly posts the help topic on that function in it.


    Even if you don''t have Help Agent on, it''s always there to guide you. Whenever
    you start a new or complicated function, Help Agent pops up with instructions
    on performing that task.


    > If you do not want Help Agent to even appear when you start new functions, choose
    the Tools, Options command. In the Options dialog box, select General, Other from
    the directory tree. In the Help Agent section section, clear the Start automatically
    check box.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_113_0.png)'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# StarOffice 5.1 Personal Edition - [work]


    # Going Beyond Help Agent Basics


    ![](img/185096a0ec6a79f83b74a7ac44692a25_114_0.png)


    **Figure 5-1** The Help Agent seeks to bring you quiet enlightenment.


    # # StarOffice General Help


    As, helpful as Help Agent, sometimes you just have to break out the big guns to
    get the assistance you need. Enter Help Agent''s big brother: the General Help
    system.


    The General Help system quickly guides you to the right answers. It also does
    a credible job of being an online manual. The difference is subtle, but there
    nonetheless. Most online help topics are small, self-contained nuggets of information
    that can be viewed one at a time with little to no interactivity with other topics.
    The General Help system''s interface encourages you to page through the help system
    like a book rather than using this hit-or-miss technique.


    In Figure 5-2, you can see this for yourself. The Desktop screen displays the
    General Help contents.


    The Register tabs make the General Help more readable. They contain the additional
    topics related to the topic viewed. They enable you to see at a glance all of
    the subtopics, even if they are not all displayed on the screen. To use the Register
    tabs, simply click them to open their related page. If some of the tabs are off-screen,
    click the small navigator buttons to move forward or backward through the row
    of tabs.'
