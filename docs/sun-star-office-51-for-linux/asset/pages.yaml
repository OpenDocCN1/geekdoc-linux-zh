  md: '# Referencing with Footnotes and Endnotes


    Footnotes and endnotes were invented to inform readers about a particular fact
    on the page without disrupting the flow of the document. If we did not have footnotes
    and endnotes, then readers could be cruising along, reading a wonderful bit of
    flow-text, when—BAM!—a reference to a magazine article smacks them in the optic
    nerve and makes them lose their train of thought.


    Footnotes and endnotes are basically the same thing. Each places a small marker
    in the text that readers may, at leisure, follow to a reference about that particular
    passage. Footnotes appear at the bottom of the page and endnotes appear at the
    end of the document or the current chapter.


    It is not a good idea to use footnotes and endnotes in the same document because
    it disrupts the readers'' expectations. Typically, you use endnotes for bibliographic
    references and footnotes for more prosaic explanations, though this is not a hard
    and fast rule.


    Also, being sparing in your use of footnotes. Too many or too lengthy footnotes
    will certainly be distracting.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_219_0.png)


    # Create Footnotes


    This task assists you in creating footnotes in a StarWriter document.


    +   1. In an open StarWriter document, choose Insert, Footnote.

    2. The Insert Footnote dialog box appears. Set the Numbering option to Automatic.

    3. Set Type to Footnote.

    4. Click OK. A footnote marker appears in the text at the text cursor location,
    and a new footer is created on the same page (see Figure 9-23).

    5. Enter text in the footnote.

    6. Click outside the footnote footer to resume document editing.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_219_1.png)


    # Create Endnotes


    This task assists you in creating endnotes in a StarWriter document.


    +   1. In an open StarWriter document, choose Insert, Footnote.

    2. The Insert Footnote dialog box appears. Set the Numbering option to Automatic.

    3. Set Type to Endnote.'
