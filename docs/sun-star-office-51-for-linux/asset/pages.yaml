  md: '# Printing with StarDesktop


    While the individual StarOffice components manage printing independently, the
    ability to print a file from StarDesktop without opening that file should not
    be over-looked. This can be a useful function, particularly if you have multiple
    files to print in a short amount of time.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_111_0.png)


    # Star Directly from StarDesktop


    This task shows how to print files from the Desktop.


    +   1. Right-click any StarOffice document on the Desktop or in the Beamer window.

    2. Choose the Print command.

    3. The file automatically prints on your PC''s default printer.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_111_1.png)


    > This function can only be used with StarOffice documents. Other file types need
    to be printed from their native applications.


    # Conclusion


    This chapter covered the StarDesktop features that you will use in your everyday
    work with StarOffice. Again, it is important to realize that the features of StarDesktop
    top carry over into all of the other StarOffice components, as they make use of
    the StarDesktop interface.


    The next chapter reviews the best way to get assistance in StarOffice: the online
    help system.'
