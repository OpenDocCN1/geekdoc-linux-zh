    # # Outlining Your Work


    When sitting down to write a document of any length, you should create an outline.


    You might think this as a rather complicated procedure for a little document like
    a one-page letter to Grandma. But you have likely already created the outline
    in your head before you sat down. For these types of smaller documents, certainly
    no one expects you to create a written outline. Just go with the one you prepared
    in your brain.


    For longer documents, where the human attention span can become a nuisance, it
    is a good idea to take the time to create an outline, for these reasons:


    +   * Outlines keep writing on track and focused.

    * Outlines keep the skeletons for the document, so writers simply "flesh out"
    the content between headings.


    Outlines are an investment in time but the payoff is a cleaner, more consistent,
    and easy-to-write document.


