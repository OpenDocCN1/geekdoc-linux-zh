  md: '# Check a Document''s Spelling


    This task shows how to use StarWriter''s spelling tools.


    +   1. In any open StarWriter document, click the Auto Spellcheck icon on the
    Main Toolbar.

    2. If any red underlined word appears in your document, right-click the word.

    3. A context menu appears, listing a number of possible alternative spellings
    for the word (see Figure 7-26).

    4. If the context menu lists the correct spelling, select the item. The word is
    corrected.

    5. If the word is correctly spelled and StarWriter just does not recognize it,
    select Add and then the dictionary file in which you want to place the word.


    In a large document with many unrecognized words, the Spelling tool is a more
    efficient way to correct typos.


    +   1. Click the Spellcheck icon on the Main Toolbar.


