- img_proc: true
  md: '# Jazzing Up Your Online Documents


    ![](img/185096a0ec6a79f83b74a7ac44692a25_236_0.png)


    **Figure 10-10** Scrolling text can get the right kind of attention if used properly.
    Scrolling text


    A plug-in is a third-party application used with browsers to enable them to view
    specialized types of files. Usually these are multimedia files, such as Macromedia
    Shockwave, a great Web page animation tool, or Adobe Acrobat, a universal document
    reader. Inserting a plug-in into your page enables any visitor to your page to
    directly access the plug-in they would need to view any special items on your
    page.


    Applets are small applications (hence the name) compiled in the Java programming
    language. What makes Java so powerful is its ability to run on any platform: Linux,
    UNIX, Windows, even Macs. Java applets are small, so they can be downloaded, compiled,
    and run by a Java-capable browser in just a little more more time than it takes
    to read a regular Web page.


    If you are knowledgeable in the use of tools, then your StarWriter Web pages can
    move to the next plateau of Web design.


    > For more information on high-end Web page design, read Hands on HTML (Prima
    Tech, 1999).


    ![](img/185096a0ec6a79f83b74a7ac44692a25_236_1.png)'
