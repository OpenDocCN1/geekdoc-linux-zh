  md: 'Styles in today''s word processing programs stem from a concept found in Standard
    Generalized Markup Language (SGML). SGML is a text-only format that uses tags
    to highlight portions of a document. Any text in between the tags assigned to
    the attributes to the tags. A <Bold> tag makes text bold, for example. If this
    sounds familiar, SGML is the parent-language for another little language you may
    have heard of: HTML.


