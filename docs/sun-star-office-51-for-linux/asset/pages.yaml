  md: '# Chapter 4: Managing Files in StarDesktop


    ![](img/185096a0ec6a79f83b74a7ac44692a25_109_0.png)


    # Arrange Your Desktop


    This task guides you through StarDesktop''s arranging features.


    +   1. Open the StarDesktop. (If your icons are not in a messy state, drag them
    around until they are!)


    +   2. Right-click anywhere in the Desktop window.


    +   3. From Window, click Arrange Icons.


    +   4. In the submenu that appears, you can choose to immediately sort by Title,
    Type, Size, or Modification Date. You can also align the Desktop icons to the
    invisible grid StarDesktop uses to align objects.


    +   5. For proactive maintenance, click either Always align with grid or Auto
    arrange.


    # When One Desktop Won''t Do


    Most of us have to contend with one desktop at a time. From the cubicle desk to
    the school desk it''s one desktop. Sure, you may have a desk at work and another
    at home but these tend to be separated by the time it takes for you to commute.


    StarDesktop allows you to create multiple Desktops, each totally independent of
    the other. Right away, the benefit of this is phenomenal. Imagine one StarDesktop
    for your work, one for home, and maybe one for your hobby.


    Linux and KDE users will certainly be familiar with this feature, as the KDE interface
    uses it prominently. Now you can have it within StarOffice. With just a few clicks
    and menu commands, you''ll be off and running.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_109_1.png)


    # Create a New Desktop


    This task demonstrates how to make a desktop from a folder.


    +   1. Open the Explorer window.


    +   2. Navigate to the folder from which you want to create a Desktop. Be sure
    the folder''s contents appear on the Desktop or in the Beamer.


    +   3. In the window displaying the folder''s contents, right-click to open the
    context menu.


    +   4. Choose the Desktop command. The folder is now a Desktop.


    +   5. To switch between Desktops, right-click the Desktop icon and select the
    Desktop you want to view.'
