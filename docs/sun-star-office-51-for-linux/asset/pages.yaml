    # Post a New Newsgroup Message


    This task discusses the steps to post and cross-post messages to newsgroups.


    +   1. In any open newsgroup, click the New Mail icon on the Object Bar. A prefressed
    but empty message appears.

    2. Enter the text of the message and the subject.

    3. To send to multiple newsgroups, drag a newsgroup name from the Explorer window
    into the message address field.

    4. Click the Send Message icon.


    # Managing Newsgroups


    With over 35,000 newsgroups to choose from, the potential for chaos in Star-Discussion
    is high. Because the potential volume is huge, StarDiscussion limits the number
    of newsgroups that can be displayed to 2,500 groups.


    With 2,500 groups at a time, you can still be pretty messy. And users add new
    groups to Usenet on a daily basis. How can you see them? Fear not, for StarDiscussion
    has the tools to help you manage this fabulous Usenet, as seen in the next tasks.'
