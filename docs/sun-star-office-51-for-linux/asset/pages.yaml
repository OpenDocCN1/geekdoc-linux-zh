    # Form Icon


    One of the coolest capabilities StarWriter has is online forms creation. No longer
    do you have to make a survey, print it out, and re-enter the handwritten results
    into a waiting database. Now you can create a form that can be filled out directly
    online using the floating toolbar associated with the Form icon.


    Like the icons before, the Form icon uses dual actions: a single-click starts
    the last-function and a click-and-hold action reveals the floating toolbar.


    Figure 6-7 displays this floating toolbar, while Table 6-3 lists the functions
    of the icons in.


    # AutoText Icon


    The AutoText icon activates a nifty feature in StarWriter. AutoText, as the name
    implies, automatically inserts text into your document. Here''s the short version
    of how this works: as you type, StarWriter always looks for unique patterns of
    letters. If it finds such pattern, AutoText displays a help tip with the entire
    word AutoText thinks you want to use. If this is indeed the word you want to use,
    you can press Enter to insert word into the text.


    The AutoText icon does two things: clicking and holding the icon allows you to
    directly place some commonly used AutoText passages into the document (see Figure
    6-8). Single-clicking the icon activates the AutoText dialog box.'
