  md: '# Puling StarDesktop Together 79


    # Save an Existing File


    +   1. In an open document, choose File, Save or click the Save Document icon
    on the Function Bar. This saves your file and the work you have done to this point.
    If you just created this document, then the Save Document icon becomes dimmed.
    You must use the File, Save As command. The Save As dialog box appears (see Figure
    4-3).

    2. Enter the name you want to give the file in the Filename field.

    3. Choose the file format you want to save the document as the choices in the
    File type list.

    4. Click Save.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_98_0.png)


    > For added security, select the Save with Password check box. This opens the
    Enter Password dialog box during the Save process.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_98_1.png)


    # File Maintenance


    You''ll need to perform file maintenance in many instances. Maintenance includes
    copying, moving, renaming, and even deleting files from your computer.


    You can perform all of these functions in the Linux command line interface and
    in KDE, as well. But StarOffice has easy-to-use features to accomplish these jobs
    without leaving the application. The next four tasks will guide you through performing
    the file maintenance steps on your system.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_98_2.png)


    Figure 4-3 The Save As dialog box.'
  merge: -1
  pgno: 98
