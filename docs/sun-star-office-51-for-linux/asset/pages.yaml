  md: '# Finding Clues to the Mystery


    Mysteries can be fun, usually not when you''re working on a computer. Computer
    mysteries tend to cause headaches. Both the General Help and Help Agent tools
    have well-defined search tools to help you solve your StarOffice mystery.


    # Finding a Help Topic


    In each StarOffice help tool, you can look for exactly the topic you want. The
    following task outlines the steps to take to use the help search tool.


    # Search for Answers in Help


    This task demonstrates the how to run a help search.


    +   1. In General Help, click the Search Help icon on the Object Bar; or in Help
    Agent, click the Find icon. The Search dialog box appears, as shown in Figure
    5-3.

    2. With the Index tab selected, type the word or topic you are looking for in
    the first field.

    3. If the center field displays the appropriate topic, select it.

    4. In the bottom field, the pertinent topics appear. Select the one you want and
    then click the Display button. The correct Help topic appears.


    > > If you double-click the desired topic, the topic immediately opens.


