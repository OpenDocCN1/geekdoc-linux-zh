  md: '# Jazzing Up Your Online Documents


    ![](img/185096a0ec6a79f83b74a7ac44692a25_234_0.png)


    Figure 10-8 Graphics really make the page


    Blinking text became the cool thing on the Web, for all of a day. Then people
    began to notice their optic nerves sneezing in irritation. It took a few years,
    but the <BLINK> tag eventually went away.


    Animated text replaced text as a neat thing to do, and it was overused as well.
    After many complaints, its use was curtailed, but it did not go extinct. There
    were some valid uses for animated text. The human eye is attracted to movement,
    after all, and what better way to get people to read an important message by scrolling
    it across the screen?


    If you decide to use animated text, StarOffice can create it for you very easily.
    Just be careful not to overdo it. Use it for something important like a new update
    to your Web site or an announcement of a special event.


    # Animate Your Text


    This task details how to scroll text across a Web page.


    +   1. Open the Modern1.html document.

    2. Click the Text Animation icon in the Main Toolbar.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_234_1.png)'
