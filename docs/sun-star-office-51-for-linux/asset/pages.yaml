  md: '# 468 Chapter 21: StarSchedule Your Meetings


    Now that we''ve completed the grand tour, it''s time to start using the tools
    in StarSchedule. After all, you''re a very busy person.


    # Scheduling Events


    In StarSchedule, you have two kinds of events to deal with: those that take place
    once and those that take place at semi-regular intervals. Events that occur once
    are referred to as single events, while repeating events are called recurring.


    # Single Events


    A single event does not refer to getting a bunch of unmarried men and unmarried
    women all in the same room together loud music and bad punch. That''s a singles
    event. A single event is more like the special meeting called to discuss an action
    plan or the parent-teacher conference that you need to go to.


    StarSchedule offers more than one way to create events, as you will learn in the
    following task.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_487_0.png)


    # Create Single Events


    This task reviews the methods used to create new events in StarSchedule.


    +   1. In the event calendar, select a start time and day.

    2. Click the New Event icon on the Object Bar. The selected half-hour block gains
    a colored border, as seen in Figure 21-7.

    3. Enter the title of your event.

    4. Click the Details icon on the Object Bar to open the Detail pane.

    5. In the Details page of the Detail pane, enter the end time and the location
    of the event (see Figure 21-8).

    6. Click the Reminder button.

    7. Select the Display Dialog option and change the value of time to 5 minutes.

    8. Click outside the event in the event calendar to complete the editing process.

    Figure 21-9 shows the completed event.


    > You can double-click the event calendar at the start time to achieve the same
    effect.'
  merge: -1
