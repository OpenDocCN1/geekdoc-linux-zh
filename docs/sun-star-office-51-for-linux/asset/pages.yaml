  md: '# Table 11-1 The Insert Cells Floating Toolbar Icons


    | Name | Function |

    |---|---|

    | Insert Cells Down | Inserts a single cell or range of cells immediately above
    selected cell(s), forcing the selected cell(s) and any occupied cells below the
    selection down on the spreadsheet. |

    | Insert Cells Right | Inserts a single cell or range of cells immediately to
    the left of the selected cell(s), forcing the selected cell(s) and any occupied
    cells to the right of the selection right across the spreadsheet. |

    | Insert Rows | Inserts a single row of cells immediately above selected cell(s)
    or row. |

    | Insert Columns | Inserts a single column of cells immediately to the left of
    the selected cell(s) or column. |


    To insert multiple cells, rows, or columns, select multiples of these items before
    clicking the appropriate Insert Cell icon. The same number of selected items will
    be created.


    ![](img/185096a0ec6a79f83b74a7ac44692a25_246_0.png)


    AutoFormat icon in StarCalc opens the same AutoFormat feature for tables found
    in StarWriter. Since any set of data in a StarCalc spreadsheet can be thought
    of as a table, the programmers at Sun Microsystems decided to make access to this
    tool quick and simple. To use the AutoFormat tool, select any range of data and
    click the AutoFormat icon.


    # AutoFilter Icon


    You can manipulate data in three primary ways: sort, group, or filter. The AutoFilter
    helps you accomplish the latter of these tasks.


    Filters allow the display of only certain types of data. For instance, a spreadsheet
    (shown in Figure 11-7) includes a list of cars, trucks, and vans. The keeper of
    this data wants to display only the cars. The AutoFilter lets the user quickly
    filter out all of the non-car data from the displayed report, as seen in Figure
    11-8.


    See Chapter 12 for a more detailed look at the AutoFilter and StarCalc''s other
    filtering tools.'
