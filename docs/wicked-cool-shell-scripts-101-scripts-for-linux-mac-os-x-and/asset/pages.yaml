    # #75 Creating a Text-Based Web Page Counter


    One popular of many web pages is a page counter that increments each time a request
    for the page in question is served. A quick glance at the counter tells you how
    popular your pages are and whether they''re seeing lots of visitors. While counters
    aren''t typically written as shell scripts, that means it can''t be done, and
    we''ll throw caution to the wind and build it!


    The fundamental challenge with this particular script is that there''s a possible
    race condition, a situation in which two people visit the page simultaneously
    and each of the counter scripts steps on the other when writing to the data file.
    This is surprisingly tricky. Consider the following few lines of code:


    ```

    while [ -e $lockfile ]; do

    sleep 1

    ```'
