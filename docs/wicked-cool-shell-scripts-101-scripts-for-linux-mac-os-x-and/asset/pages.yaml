  md: '# #12 Building a Shell Script Library


    Many of the scripts in this chapter have been written as functions rather than
    stand-alone scripts so they can be easily and gracefully incorporated into other
    scripts without incurring the overhead of system calls. While there''s no #include
    feature in a shell script, as there is in C, there is a tremendously important
    capability sourcing for that serves the purpose.


    To see why this is important, let''s consider the alternative. If you invoke a
    shell script within a shell, by default script is run within its own subshell.
    You can immediately prove this experimentally:


    ```

    $ tinyscript.sh

    test=2

    $ test=1

    $ tinyscript.sh

    $ echo $test

    ```


    Because this script changed the value of the variable test within the subshell
    running the script, the value of the existing test variable in the current shell''s
    environment was not affected. If you instead use the source notation to run the
    script, it is handled as each command in the script was typed directly into the
    current shell:


    ```

    $ tinyscript.sh

    $ echo $test

    2

    ```


    As you might expect, if you have an exit 0 command within a script that''s sourced,
    for example, it will exit that shell and log out of window.


