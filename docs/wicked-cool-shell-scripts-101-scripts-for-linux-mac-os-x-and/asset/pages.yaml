- img_proc: true
  md: 'done


    touch $lockfile


    It seems as this should work, only allowing the script to escape the while loop
    when the lock file doesn''t exist and then immediately creating the lock file
    to keep everyone else out. It doesn''t work. Remember that two copies can be running
    essentially simultaneously, so what happens if one ascertains that there''s no
    lock file, gets through the loop, and then swapped out by the CPU before creating
    the new lock file? Meanwhile, the second script tests, also finds there''s no
    lock file, and creates one, now it has exclusive access to the data. The first
    script swaps back in, it touches the lock file (which already exists, it doesn''t
    know that), and mayhem ensues.


    The solution is to use a utility for the job, to ensure that you don''t encounter
    a race condition in the middle of the locking sequencing. If you''re lucky, your
    Unix has the helpful lockf command, which executes a specific command while locking
    an exclusive lock file. If not, many Unixes have the locking utility as an alternative.
    To be portable, this script works with both, depending on what it can find. Script
    #10 discusses this issue in greater depth too.


    # The Code


    ```

    #!/bin/sh

    ```


    +   - A simple text-based page counter, with appropriate locking.


    ```

    myhome="/home/taylor/web/wicked/examples"

    counter=$myhome/counter.dat

    lockfile=$myhome/counter.lock

    updatecounter=$myhome/updatecounter

    ```


    > # Note that this script is not intended to be called directly

    # a web browser so it doesn''t use the otherwise obligatory

    # content-type header material.


    > # Ascertain whether we have lock or lockfile system apps


    ```

    if [ -z ($lockfile) ]; then

    if [ -z ($lockfile) ]; then

    echo "(counter: no locking utility available)<cbr"

    exit 0

    else # proceed with the lockfile command

    if [ ! -f $counter ]; then

    checho "0" # it''ll be created shortly

    else

    cat $counter

    fi


    trap "/bin/rm -f $lockfile" 0

    ```'
