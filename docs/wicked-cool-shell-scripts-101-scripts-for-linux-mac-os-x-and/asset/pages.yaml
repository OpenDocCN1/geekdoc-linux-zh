  md: '# Hacking the Script


    A subtle problem here is that some jobs shouldn''t be run more than once a week
    or a month, so there should be some sort of check in place to ensure that that
    doesn''t happen. Furthermore, sometimes the recurring jobs might run well from
    cron, so we can''t make a blanket assumption that cron doesn''t run, the jobs
    haven''t run.


    One solution would be to create empty timestamp files, one for daily, weekly,
    and monthly jobs, and then add new entries to the /etc/daily, /etc/weekly, and
    /etc/monthly directories that update the last-modified date of each timestamp
    file with touch. This would solve the problem: cron doesn''t check then the last
    time the recurring cron job was run and quit if an insufficient amount of time
    has passed.


    What this solution doesn''t avoid the situation in, six weeks after the monthly
    cron job last run, the admin doesn''t invoke the monthly jobs. Then four days
    later someone forgets to shut off their computer and the monthly cron job is invoked.
    How can that job know that it''s not necessary to run the monthly jobs after all?


    Two scripts can be added to the appropriate directory. Two scripts can be added
    to the appropriate directory. One script must run first from run-script or periodic
    (the standard ways to invoke cron jobs) and can then turn off the executable on
    all other scripts in the directory except its partner script, which then executes
    the execute bit after run-script or periodic has been scanned and ascertained
    that there''s nothing to do: None of the files in the directory appear to be executable,
    and therefore cron doesn''t run them. This is not a great solution, however, because
    there''s no guarantee of script evaluation order, and if we can''t guarantee the
    order in which the new scripts will be run, the entire solution fails.


    There might be a complete solution to this dilemma, actually. Or it might involve
    writing a wrapper for run-script or periodic that would know how to manage timestamps
    to ensure that jobs aren''t executed frequently,


    # #55 Rotating Log Files


