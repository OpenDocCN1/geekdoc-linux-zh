  md: '# 12


    # # SHELL SCRIPT FUN AND GAMES


    ![](img/a236915495daab651d7c2cc28becf416_333_0.png)


    **Up to this point, we’ve been pretty focused on serious and important uses of
    shell scripts to improve your interaction with your Unix/Linux system and make
    the system more flexible and powerful.** But there’s another side to shell scripts
    that’s worth exploring just briefly as the book wraps up, and that’s games.


    Don’t worry — I’m not proposing that we write a new version of The Sims as a shell
    script. It just turns out there are a number of simple scripts that are easily
    and informatively written as shell scripts, and, heck, wouldn’t you rather learn
    how to debug scripts by working with something fun than some serious utility for
    suspending user accounts or analyzing Error logs?


    Here are two quick examples up front to show you what I mean. First off, long-time
    Usetenet readers know about something called rot13, a simple mechanism where off-color
    jokes and obscene text are obscured to make them a bit less easy read. It’s what’s
    called a *substitution cipher*, and it turns out to be remarkably simple to accomplish
    in Unix.'
