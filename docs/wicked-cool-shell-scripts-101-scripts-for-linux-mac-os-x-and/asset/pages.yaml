  md: '```

    $restart

    echo "Configuration appears to have failed; restarted with old config" >&2

    echo "Failed configuration is in $httpconf.failed.$date" >&2

    exit 1

    fi

    ```


    The live httpd.conf file is moved to http.conf.failed.MMDDHHMM, and the old httpd.conf
    file, saved as httpconf.MMDDHHMM, is moved back into place. The web server is
    started once again, and an error message is output.


    These hoops, as shown in the snippet just, ensure, that whether the VirtualHost
    addition is successful or not, a copy of both the original and edited http.conf
    files remain in the directory. The only stumbling block with this technique occurs
    if the restart command doesn''t return a nonzero code after it fixed. If this
    is the case, it''s well worth lobing the developer to have it, but in the meantime,
    if the script thinks that the restart went fine but it didn''t, you can jump into
    the conf directory, move the old version of the configuration file, now saved
    as saved.http.conf.MMDDHHMM, back to httpd.conf, and then restart by hand.


    # Running the Script


    This script requires three arguments: the name of the new domain, the email address
    of the administrator for Apache error message pages, and the account name of the
    user who is going to own the resultant directories. To have the output displayed
    rather than actually modifying your httpd.conf file, include the -n flag. Note
    that you will doubtless need to modify the value of the first few variables in
    the script to match your own configuration before you proceed.


    # The Results


    Because the script doesn''t have any interesting output when no errors are encountered,
    it will look to the "show, but don''t do" output by specifying the -n flag to
    virtual:


    ```

    $ -n baby.net admin@baby.net taylor

    mdir /etc/httpd/html/baby.net /var/log/httpd/baby.net

    chown taylor /etc/httpd/html/baby.net /var/log/httpd/baby.net


    ###### Virtual Host setup for baby.net ######

    ```


    ```

    <VirtualHost www.baby.net>

    ServerName baby.net

    ServerAdmin admin@baby.net

    DocumentRoot /etc/httpd/html/baby.net

    ErrorLog logs/baby.net/error_log

    TransferLog logs/baby.net/access_log

    </VirtualHost>

    ```


    294 Chapter 10


    No Starch Press, Copyright © 2004 by Dave Taylor'
