  md: "# #9 An Arbitrary-Precision Floating-Point Calculator\n\nOne of the most commonly\
    \ used sequences in script writing is (($ )), which lets you perform calculations\
    \ using various rudimentary functions. This sequence can be quite useful, most\
    \ commonly when incrementing counter variables, and it supports addition, subtraction,\
    \ division, remainder, and multiplication, though not any of fractional or decimal\
    \ value. Thus, the following command returns 0, 0.5:\n\n```\necho $(( 1 / 2 ))\n\
    ```\n\nSo calculating values that need better precision, you've got a challenge\
    \ on your hands. There just aren't many calculator programs that work on the command\
    \ line. Except, that is, for, an oddball program that few Unix people are taught.\
    \ Billing itself as an arbitrary-precision calculator, the bc program harkens\
    \ back to the very dawn of Unix, with its cryptic error messages, complete lack\
    \ of prompts, and assumption that you're using it, you already know what you're\
    \ doing. But that's okay. You can cope.\n\n# The Code\n\n```\n#!/bin/sh\n\n# scriptbc\
    \ Wrapper for 'bc' that returns the result of a calculation.\n\nif [ $1 = \"-p\"\
    \ ]; then\n    precision=$2\n    shift 2\nelse\n    precision=2 # default\nfi\n\
    \nbc -q << EOF\nscale=$precision\n*\nquit\nEOF\n\nexit 0\n```"
