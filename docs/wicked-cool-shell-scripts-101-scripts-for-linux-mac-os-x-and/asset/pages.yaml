    not all implementations work that. Some use \ as a special embedded character
    to defeat the default behavior, or others simply insert including the trailing
    newline regardless.


    Figuring out whether your particular echo is well implemented is easy: Simply
    type in the following command and see what happens:


    ```

    $ echo -n "The rain in Spain;" echo " falls mainly on the Plain"

    ```'
