  md: '# #89 Tracking FTP Usage


    If you''re running an anonymous FTP server, you should already be constantly monitoring
    what happens in the ~ftp/pub directory (which is usually where uploads are allowed),
    but any FTP server requires you to keep an eye on things.


    The ftp daemon''s transfer log (xferlog) file format is definitely one of the
    most cryptic in Unix, which makes analyzing it in a script rather. Worse, there''s
    a standard, common xferlog file format that just about everyone uses (and which
    this script expects), and there''s an abbreviated ftppd.log format that some BSD
    versions of ftp use that are just about impossible to analyze in a script.


    So we''ll focus on the xferlog format. The columns in an xferlog are as in Table
    10-2.


    | Column | Value |

    | --- | --- |

    | 1-5 | Current time |

    | 6 | Transfer time (secs) |

    | 7 | Remote host |

    | 8 | File size |

    | 9 | Filename |

    | 10 | Transfer type |

    | 11 | Special action flag |

    | 12 | Direction |

    | 13 | Access mode |

    | 14 | Username |

    | 15 | Service name |

    | 16 | Authentication method |

    | 17 | Authenticated user ID |

    | 18-? | Additional codes as added by the specific ftppd program (usually omitted)
    |


    **Table 10-2:** Field values in the xferlog file


    A sample line from an xferlog is as cryptic as you might expect:


    ```

    Mon Nov 4 12:22:46 2002 2 192.168.124.152 2170570 \ /home/ftp/pub/openssl-0.9.5r.tar.gz
    b i r leoftp o * c

    ```


    This script quickly scans through xferlog, highlighting connections and files
    uploaded and downloaded, and producing other useful statistics.


    # **The Code**


    ```

    #!/bin/sh

    ```


    ```

    # xferlog - Analyzes and summarizes the FTP transfer log. A good doc

    # detailing the log format is http://aolserver.com/docs/2.3/ftp-ch4.htm.

    ```


    ```

    stdxferlog="/var/log/xferlog"

    ```'
