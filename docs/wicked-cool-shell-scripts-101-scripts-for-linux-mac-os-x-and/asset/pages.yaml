    \ opt; do\n  case $opt in\n    l ) action=\"lock\" ;\n    u ) action=\"unlock\"\
    \ ;\n    r ) retries=\"$OPTARG\" ;\n  esac\ndone\nshift $((OPTIND - 1))\n```\n\
