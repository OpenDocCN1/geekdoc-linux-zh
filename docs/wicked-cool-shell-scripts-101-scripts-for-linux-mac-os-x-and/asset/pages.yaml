    Now let''s scrape the log file for some useful data:


    echo ""

    echo "The ten most popular pages were:"


    awk ''print $7'' ''$$1'' | grep -iE ''(.gif|.jpg|.png)'' | \\

    sed s/\\\\\\\\//g | sort | \\

    uniq -c | sort -rn | head


    echo ""

