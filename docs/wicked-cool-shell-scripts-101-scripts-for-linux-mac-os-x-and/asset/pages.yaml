    # How It Works


    Although this is a short script, it is rather densely packed. These scraper scripts
    are best built iteratively, looking for patterns to filter in the structure of
    the web page information and then tune by line to produce the output desired.


    On the BBC website, this process is surprisingly easy because we''re already looking
    at the low-bandwidth version of the site. The first task is to discard any HTML
    associated with the navigational menus, bottom material, and so forth, that we
    have just the core content of the page, the stories themselves. That''s what the
    first sed does — it reduces the data stream by preserving the headline and body
    of the new stories between the "Last Updated" string at the top of the page and
    the news.bbc.co.uk/p search box at the bottom of the page.


    The next invocation of sed is uglier than the first, simply because it''s doing
    something:


    ```

    sed ''s/<\n<g>/s>/</g''

    ```


    Every time it finds an angle bracket (<), it''s replacing it with a carriage return
    followed by an angle bracket. Close angle brackets (>) are replaced by a close
    bracket followed by a carriage return. If sed supported an \n notation to specify
    carriage returns, the second sed invocation would not need to be written across
    lines and would read much more easily, as follows:


    ```

    sed ''s/<\n<g>/s/>\n/g''

    ```


    Once the added carriage return puts all the HTML tags on their own lines, the
    second invocation of grep strips out all the tags (-v ignores the logic of grep,
    showing all lines that do not match the pattern, and the -e flag specifies that
    the argument is a complex regular expression), and the result is to fit to wrap
    the result text better. Finally, the uniq command is used to ensure that there
    aren''t multiple blank lines in the output: It removes all nonunique lines from
    the stream.


    # Running the Script


    This script has no arguments, and as long as the BBC hasn''t changed its basic
    low-source page layout, it''ll produce a text-only version of the top technology
    headlines. The first version of the bnews script was written around a layout that
    changed during 2003: The BBC originally had all its articles wrapped in <div>
    tags but has since changed it. Fortunately, the update to the script involved
    about ten minutes of work.'
