  md: "# #17 Logging File Removals\n\nThis script is an example of an entire class\
    \ of useful shell scripts called wrappers. The basic idea of wrappers is that\
    \ they live between an actual Unix command and the user, offering the user different\
    \ and useful functionality not available with the actual command alone. In the\
    \ case of this script, file deletions using the `rm` command will be logged in\
    \ a separate log file without notifying the user.\n\n# ## Code\n\n```\n#!/bin/sh\n\
    # logrm - Logs all file deletion unless the -s flag is used.\n\nremodelog=\"/var/log/remove.log\"\
    \n\nif [ $#-eq 0 ]; then\n    echo \"Usage: $0 [-s] list of files or directories\"\
    \ >&2\n    exit 1\nfi\n\nif [ \"$1\" = \"-s\" ]; then\n    # silent operation\
    \ requested ... don't log\n    shift\nelse\n    echo \"$(date): $(USER): $@\"\
    \ >> $remodelog\nfi\n/bin/rm $@\n```\n\n# ## Running the Script\n\nRather than\
    \ give this script a name like logrm, a typical way to install a wrapper program\
    \ is to rename the underlying program using the underlying program's old name.\
    \ If you choose this route, make sure that the wrapper invokes the newly renamed\
    \ program, not itself. For example, if you rename /bin/rm to /bin/rm.old and rename\
    \ this script the last few lines of the script will need to be changed so it invokes\
    \ /bin/rm.old, not itself!\nYou can also use an alias to have this wrap a standard\
    \ call to rm:\n\n```\nalias rm-logrm\n```\n\nIn either case, you will, of course,\
    \ need write and execute access to /var/log, which might not be the default configuration\
    \ on your particular Unix or Mac OS system."
