  md: "To rot13 something, simply feed it through tr:\n\n```\ntr '[a-zA-Z]' '[n-za-mN-ZA-M]'\n\
    ```\n\nHere's an example:\n\n```\n$ echo \"So two people walk into a bar...\"\
    \ | tr '[a-zA-Z]' '[n-za-mN-ZA-M]'\nFb gib rbcyr jynx vagb n...\n```\n\nTo unwrap,\
    \ simply apply the same transform:\n\n```\n$ echo 'Gib rbcyr jynx vagb n one...'\
    \ | tr '[a-zA-Z]' '[n-za-mN-ZA-M]'\nTwo people walk into a bar...\n```\n\nAnother\
    \ short example is a palindrome checker. Type in something you believe is a palindrome,\
    \ and let it test you to:\n\n```\ntestit=\"$(echo $ | sed s/[[:alpha:]]//g | tr\
    \ '[:upper:]' '[:lower:]')\"\backwards=\"$(echo $testit) rev)\n```\n\n```\nif\
    \ [ \"\\$testit\" = \\$backwards ]; then\necho \"\\$@ is a palindrome\"\nelse\n\
    echo \"\\$@ is not a palindrome\"\nfi\n```\n\nThe logic here: A palindrome is\
    \ a word that's identical forward or backward, the first step is to remove all\
    \ nonalphabetic characters and ensure that everything is lowercase. Then the Unix\
    \ rev reverses the letters in a line of input. If the forward and backward versions\
    \ are the same, we've got a palindrome, and if they differ, we don't.\n\nThe three\
    \ games presented in this final chapter are a bit more complex, all will prove\
    \ fun and worth to your system, I'm sure. All require separate data files, however,\
    \ which you can easily obtain from my website. For the word list, save the file\
    \ at http://www.intuitive.com/wicked/examples/long-words.txt, and for the state\
    \ capitals file download http://intuitive.com/wicked/examples/state.capitals.txt\n\
    \nSave both of files in the directory /usr/lib/games/ for the scripts to work\
    \ as intended, or, if you save them elsewhere, modify the scripts to match.\n\n\
    # 99 Unscramble: A Word Game\n\nIf you see the Jumble game in your newspaper or\
    \ played word games at all, you're familiar with the basic concept of this game:\
