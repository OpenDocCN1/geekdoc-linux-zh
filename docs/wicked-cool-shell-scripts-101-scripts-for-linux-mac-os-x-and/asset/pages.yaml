  md: 'Why test for the value 2 rather than 1? Because the entered value has a carriage
    return appended by the read statement, and so it has two letters if it''s correct,
    not one. The sed in this strips out all nondigit values, of course, to avoid any
    confusion with the leading tab that we likes to enter.


    Testing for lowercase is straightforward: Remove all letters from guess and see
    if the result is zero (empty) or not:


    ```

    elif [ ! -z "$(echo $guess | sed ''/[:lower:]]//g'')" ]; then

    ```


    And, finally, to see if the user has guessed the letter already, transform the
    guess such that letters appear in the guessed variable are removed, and see if
    the result is zero (empty) or not:


    ```

    elif [ -z "$(echo $guess | sed "s/${empty$guessed}//g")" ]; then

    ```


    Apart all of these tests, however, the trick behind getting hangman to work is
    to translate into dashes all occurrences in the original word of each guessed
    letter and compare to the result of the original word. If they''re different,
    the guessed letter is in that:


    ```

    elif [ "$(echo $match | sed "s/$guess/-/") != "$match" ]; then

    ```


    One of the ideas that made it possible to write hangman that was the partially
    filled-in word shown to the player, the partial variable, is rebuilt each time
    a correct guess is made. Because the variable accumulates each letter guessed
    by the player, a sed transformation that translates into a dash letter in the
    original word does this:


    ```

    partial="$(echo $match | sed "s/${empty$guessed}//g")

    ```


