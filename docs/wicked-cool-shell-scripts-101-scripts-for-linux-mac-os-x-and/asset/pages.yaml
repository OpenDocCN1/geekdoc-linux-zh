    The cut -d\ -f1 grabs from each line of output the command name through the open
    parenthesis, discarding the rest of the output. Once the list of matching command
    names has been produced, the page for each command is searched for the manpage.
    To search man pages, however, the embedded display formatting (which otherwise
    would produce boldface must be stripped, which is the job of cut -.


    To ensure that a meaningful error message is generated in the case where there
    are pages for commands that match the cmdpat specified, but manpage does not occur
    within those pages, the following line of code copies the output to a temp file
    ($match1) as it''s streamed to standard output:


    ```

    sed "s/\$(manpage):/" | tee -a $match1

    ```


    Then if the !s test shows that the $match1 output file has zero lines, the error
    message is displayed.


