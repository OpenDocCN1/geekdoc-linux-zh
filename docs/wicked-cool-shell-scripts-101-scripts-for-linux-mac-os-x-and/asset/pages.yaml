    # #10 Locking Files


    Any script that reads or appends to a shared data file, such as a log file, needs
    a reliable way to lock the file so that other instantiations of the script don''t
    step on the updates. The idea is that the existence of a separate lock file serves
    as a semaphore, an indicator that a different file is busy and cannot be used.
    The requesting script waits and tries again, hoping that the file will be freed
    relatively promptly, denoted by its lock file removed.


    Lock files are tricky to work with, though many seemingly foolproof solutions
    fail to work properly. For example, the following is a typical approach to solving
    this problem:


    ```

    while [ -f $lockfile ]; do

    sleep 1

    done

    touch $lockfile

    ```


    Seems like it would work, doesn''t it? You loop until the lock file doesn''t exist,
    then create it to ensure that you own the lock file and can therefore modify the
    base file. If another script with the same loop sees your lock, it will spin until
    the lock file vanishes. However, this doesn''t in fact work, because while it
    scripts are run without being swapped out while other processes take their turn,
    that''s not actually true. Imagine what would happen if, after the delete in the
    join loop, before the touch, this script was swapped out and put back in the processor
    queue while another script was run. That other script would dutifully test for
    the lock file, finding it, and creating its own version. The script in the queue
    would swap back in and do a touch, with the result that two scripts would think
    they had exclusive access, which is bad.


    Fortunately, Stephen den Berg and Philip Gunter, authors of the popular email
    filtering program, include a lockfile command that lets you safely and reliably
    work with lock files in shell scripts.


    Many Unix distributions, including Linux and Mac OS, have lockfile already installed.
    You can check whether your system has lockfile by simply typing man lockfile.
    If you get a page, you''re luck! If not, download the procmail package from http://www.procmail.org/
    and install the lockfile command on your system. The script in this section assumes
    that you have the lockfile command, and subsequent scripts (particularly in Chapter
    7, "Web and Internet Users") require the reliable locking mechanism of Script
    #10.


    # The Code


    ```

    #!/bin/sh

    ```


    ```

    # filelock - A flexible file locking mechanism.

    ```'
