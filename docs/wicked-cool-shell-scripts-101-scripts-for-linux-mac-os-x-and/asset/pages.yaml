  md: "# How It Works\n\nThe netstat program is tremendously useful, but its output\
    \ can be quite intimidating. Here are the first ten lines:\n\n```\n$ netstat -s\
    \ -p tcp | head\ntcp:\n    360836 packets sent\n    9134 data packets (1095816\
    \ bytes)\n    24 data packets (5640 bytes) retransmitted\n    0 initiated ack-only\
    \ packets by MTU discovery\n    19290 ack-only packets (13856 delayed)\n    0\
    \ NRG only packets\n    0 window probe packets\n    6295 window update packets\n\
    \    1340 control packets\n```\n\nThe first step is to extract those entries that\
    \ contain interesting and important performance statistics. That's the main job\
    \ of getstat, and it does this by saving the output of the netstat command into\
    \ the temp file $temp and going through $temp ascertain key values, such as total\
    \ packets sent and received. To ascertain the number of packets sent, and for\
    \ example, the script below\n\n```\nsent=\"$(grep 'packets sent' $temp | cut -d\
    \ -f1 | sed s/[[:digit:]]//g')\n```\n\nThe sed invocation removes non digit values\
    \ to ensure that no spaces or bars end up as part of the resultant value. Then\
    \ all of the extracted values are written to the netstat.log file in the format\
    \ var1Name=var1Value, var2Name=var2Value, and so forth. This will let us use eval\
    \ on each line in netstat.log and have all the variables instantiated in the shell:\n\
    \n```\ntime=10639480;snt=3872;re=24;rec=5065;dup=306;out=215;cre=46;acc=17;reto=170\n\
    ```\n\nThe netperf script does the heavy lifting, parsing netstat.log and reporting\
    \ both the most recent performance numbers and any anomalies or other values that\
    \ are increasing over time.\n\nAlthough the netperf script seems complex, once\
    \ you understand the math, it's quite straightforward. For example, it calculates\
    \ the percentage of retransmissions by dividing retransmissions by packets sent\
    \ and then multiplying this result by 100. An integer-only version of the transmission\
    \ message is calculated by taking the result of dividing retransmissions by total\
    \ packets sent, multiplying it by 1000, and then dividing by:\n\n```\nrep=\"$(scriptpcbc\
    \ -p 3 $re/$snt*100)\nrep=\"$(scriptpcbc -p 4 $re/$snt*10000 | cut -d. -f1)\n\
    rep=\"$( $rep / 100 ))\n```"
  merge: -1
  pgno: 302
- img_proc: true
  md: 'As you see, the naming scheme for variables within the script begins with the
    abbreviations assigned to the various netstat values, which are stored in netstat.log
    at the end of the getsats script:


    The abbreviations are snt, re, rec, dup, oo, creq, cacc, and rato. In the netperf
    script, the p suffix is added to any of these abbreviations for variables that
    represent decimal percentages of total packets sent or received. The pn suffix
    is added to any of the abbreviations for variables that represent integer-only
    percentages of variables. Later in the netperf script, the ps suffix denotes a
    variable that represents the percentage summaries (averages) used in the final
    calculations.


    The while loop steps through each entry of netstat.log, calculating the four key
    variables (re, ret, dup, and oo, which are retransmits, timeouts, and out of order,
    respectively). All are written to $stats temp file, and then the awk script sums
    each column in $stats calculates average value by dividing the sums by the number
    of records in the file (NR). Following line in the script ties things together:


    ```

    echo $(awk -f awktmp < $stats)

    ```


    The awk invocation is fed the set of summary statistics ($stats) produced by the
    while loop utilizes the calculations saved in the $awktmp file to output variable=value
    sequences. These variable-value sequences are incorporated into the shell with
    the environment, instantiating the variables reps, retops, dupps, and oops, which
    are average retransmit, average retransmit timeouts, average duplicate packets,
    and average out-of-order packets, respectively. The current percentile values
    can then be compared to these average values to spot problematic trends.


    # Running the Script


    For the netperf script to work, it needs information in the netstats log. That
    information is generated by having a crontab entry that invokes getsats some level
    of frequency. On a modern Mac OS X, Unix, or Linux system, the following crontab
    entry will work:


    ```

    /15 * * * */home/taylor/bin/getstats

    ```


    It will produce a log file entry every 15 minutes. To ensure the necessary permissions,
    it is best to actually create an empty log file by hand before running getstats
    for the first time:


    ```

    $ sudo touch /var/log/netstat.log

    $ chmod a+rw /var/log/netstat.log

    ```'
