- img_proc: true
  md: 'The call to retrieve the source of the specified web page, and then performs
    three different translations. SRC= SRC="baseurl/ to ensure that any relative pathnames
    of the nature SRC="logo.gif" are rewritten to work properly as full pathnames
    with the domain name. If the domain name of the site is http://www.intuitive.com/,
    the rewritten HTML would be: SRC="http://www.intuitive.com/logo.gif"; HREF attributes
    are similarly rewritten, and then, to ensure we have broken anything, the third
    translation pulls the baseurl out of the HTML source in situations where it''s
    been erroneously added. For example, HREF="http://www.intuitive.com/http://www.some-com/link"
    is clearly broken and must be fixed for the link to work.


    Notice also that the recipient address is specified in the echo statement (echo
    "To: $2") rather than as argument to sendmail. This is a simple security trick:
    by having the address within the sendmail input (which sendmail knows to parse
    for recipients because of the -t flag), there''s no worry about users playing
    games with addresses like "joe;etc/passwd|mail lazy". It''s a good technique to
    use for all invocations of sendmail within shell scripts.


    # Running the Script


    This script requires two parameters: the URL of the site being tracked (and you''ll
    need to use a fully qualified URL, that begins with http:// for it to work properly)
    and the email address of the person or comma-separated group of people who should
    receive the updated web page, as appropriate.


    # The Results


    The first time the script sees a web page, the page is automatically mailed to
    the specified user:


    ```

    $ changrack http://www.intuitive.com/blog/ taylor@intuitive.com

    ```


    Note: we''ve never seen this site before.


    The resultant emailed copy of the site, while not exactly as it would appear in
    the web browser, is still quite readable, as shown in Figure 7-2.


    All subsequent checks of http://www.intuitive.com/blog/ will produce an email
    copy of the site only if the page has changed since the last invocation of the
    script. This can be as simple as a single value or as complex as a complete redesign.
    While this script can be used for tracking any website, those that don''t change
    frequently probably work best: If the site changes every few hours (such as the
    CNN home page), checking for changes is a waste of CPU cycles, because it''ll
    always be changed.'
  merge: -1
