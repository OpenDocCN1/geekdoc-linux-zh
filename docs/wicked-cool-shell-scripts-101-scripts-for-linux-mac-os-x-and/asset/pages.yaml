  md: '# How It Works


    The most interesting line in this script is


    ```

    smallest=$(ls -l "$name" $gzout $bzout | \

    awk ''{print $5"NR"}'' | sort -n | cut -d= -f2 | head -1)

    ```


    This line has lost the size of each file (the original and the three

    compressed files, in a known order), chops out the just files with awk, sorts

    numerically, and ends up with the line number of the smallest resultant

    file. If the compressed versions are all bigger than the original file, the result
    is 1,

    an an appropriate message is output. Otherwise, smallest will indicate which of

    compress, gzip, or bzip2 did the best job. Then it''s a matter of moving the

    appropriate file into the current directory and removing the original file.

    Another technique in this script is worth pointing out:


    ```

    $Z < "$name" $gzout &

    gz < "$name" $gzout &

    bz < "$name" $bzout &\wait

    ```


    The three compression calls are done in parallel by using the trailing & drop

    each of them into its own subshell, followed by the call to wait, which stops
    the

    script until all the calls are completed. On a uniprocessor, this might not offer

    m performance benefit, but with multiple processors, it should spread the

    task out and complete quite a bit faster.


    # Running the Script


    This script should be invoked with a list of filenames to compress. If some of

    them are already compressed and you desire to compress them further, use the

    -flag; otherwise they''ll be skipped.


    # The Results


    The best way to demonstrate this script is with a file that needs to be compressed:


    ```

    $ -l1 alice.txt

    -IW-R--I--R-- 1 taylor staff 154872 Dec 4 2002 alice.txt

    ```


    The script hides the process of compressing the file with each of the three

    compression tools and instead simply displays the results:


    ```

    $ bestcompress alice.txt

    Best compression is with compress. File renamed alice.txt.

    ```


    You can see that the file is not quite a bit shorter:


    ```

    $ -l1 alice.txt.Z

    -IW-R--I--R-- 1 taylor wheel 66287 Jul 7 17:31 alice.txt.Z

    ```


