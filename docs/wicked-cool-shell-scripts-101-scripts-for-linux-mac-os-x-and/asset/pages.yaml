  md: '# Hacking Script


    The ftpsync script uploads only files, ignoring directories. To rectify this,
    you could have each subdirectory within the working directory on the local system
    detected in the loop, add a mkdir command to the $tmpfile, and then invoke another
    call to ftpsync with the name of the new subdirectory at the end of the current
    script. You''d still need to ensure that you''re irreversibly stepping into subdirectories,
    but that can be managed by invoking subsequent calls to ftpsync in subshells.


    The problem with this solution is that it''s really beginning to push the edges
    of what''s logical to include in a shell script. If you have nftp, for example,
    you''ll find it has built-in support for recursive put commands; rewriting these
    scripts to utilize nftp capability makes a lot more sense than continuing to struggle
    with the more primitive ftp.


    **NOTE** When to write your script in a "real" programming language

    Any script that has grown to more than 150 lines or would probably be better written
    in a more sophisticated language, either Perl, C++, or Java. The longest script
    in this entire book is only 149 lines long (Script #53, Validating User crontab
    Entries). Your cutoff may vary, and there are some situations in which you must
    solve the problem within a shell script, but they''re few and far between. Think
    about whether you can solve the problem more efficiently in a more sophisticated
    development environment if you find your script is bursting at the seams and hundreds
    of lines long.


