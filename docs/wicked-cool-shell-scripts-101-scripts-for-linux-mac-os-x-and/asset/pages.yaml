  md: '# How It Works


    This script demonstrates the useful here document capability in shell scripting.
    The << notation allows you to include material in the script that is treated as
    if it were taken directly from the input stream, which in this case allows any
    mechanism for handling commands by the bc program.


    This is also our first script demonstrates how command arguments can be utilized
    within bc to enhance the flexibility of a command. Here, if the script is invoked
    with a -p flag it allows you to specify the desired scale. If no scale is specified,
    the program defaults to scale=2.


    When working with bc, it''s critical to understand the difference between length
    and scale. As far as bc is concerned, length refers to the total number of decimal
    digits in the number, while scale is the total number of digits after the decimal
    point. 10.25 has a length of four and a scale of two, which has a length of five
    and a scale of five.


    By default, bc has a value for length, but because it has a scale of zero, bc
    without any modifications works exactly as the $( ) notation. Fortunately, if
    you use a scale setting to bc, you find that there''s lots of hidden power under
    the hood, as shown here:


    ```

    $ bc

    bc 1.05

    Copyright 1991, 1992, 1993, 1994, 1997, 1998 Free Software Foundation, Inc.

    This is free software with ABSOLUTELY NO WARRANTY.

    For details type ''warranty''

    scale=10

    (2002-1962)*365

    14600

    1460/7

    2085.714285712

    quit

    ```


    To allow access to the bc capabilities from the command line, a wrapper script
    has to silence the opening copyright information, if present, even though most
    bc implementations know that they should silence the header if their input isn''t
    the terminal (stdin). The wrapper also sets the scale to a reasonable value, feeds
    in the actual expression to the bc program, and ends with a quit command.


    # Running the Script


    To run this script, feed a mathematical expression to the program as an argument.


    # The Results


    ```

    $ scriptbc 14600/7

    2085.71

    ```'
