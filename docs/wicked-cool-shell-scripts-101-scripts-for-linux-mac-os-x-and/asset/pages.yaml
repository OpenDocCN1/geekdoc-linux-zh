    of the /etc/skel directory are copied to the home directory. By convention, the
    /etc/skel directory is where a master .bashrc, .login, .bashrc, and .profile are
    kept, and on sites where there''s a web server “account service, a directory like
    /etc/skel/public_html would be copied across the new home directory, alleviating
    many “Where do I create my new website?” questions.


