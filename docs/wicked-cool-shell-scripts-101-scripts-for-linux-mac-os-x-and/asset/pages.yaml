    # How It Works


    The heart of this script is the sequence of commands fed to the ftp program:


    ```

    ftp -n << EOF

    open $server

    user ftp $anonpass

    get $filename $basefile

    quit

    EOF

    ```


    This script illustrates the essence of a batch file: It prepares a sequence of
    instructions that it feeds to a separate program, Here we specify the server connection
    to open, specify the anonymous user (ftp) and whatever default password is specified
    in the script configuration (typically your email address), and then get the specified
    file from the FTP site and quit the transfer.


    # Running the Script!


    In, this script is simple and straightforward: Just fully specify an ftp URL,
