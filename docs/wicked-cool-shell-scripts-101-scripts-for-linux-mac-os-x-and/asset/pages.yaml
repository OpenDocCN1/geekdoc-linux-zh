  md: '# MAC OS X SCRIPTS


    One of the most important changes in the world of Unix and Unix-like operating
    systems was the release of the completely rewritten Apple Mac OS X system. Jumping
    from the older Mac OS 9, Mac OS X is built atop a solid and reliable Unix core
    called Darwin. Darwin is an open source Unix based on BSD Unix, and if you know
    your Unix at all, the first time you open the Terminal application in Mac OS X
    you''ll doubtless gasp and swoon with delight. Everything you''d want, from development
    tools to standard Unix utilities, is included with the latest generation of Macintosh
    computers, with a gorgeous GUI quite capable of hiding all that power for people
    who aren’t ready for it.


    ![](img/a236915495daab651d7c2cc28becf416_315_0.png)'
  merge: -1
  pgno: 315
- img_proc: true
  md: "There are some significant differences between Mac OS X and Linux/Unix, however,\
    \ not the least of which is Mac OS X uses a system database called NetInfo for\
    \ a number of flat files, notably /etc/passwd and /etc/aliases. This means that\
    \ if you want to add a user to the system, you have to inject her information\
    \ into the NetInfo database, not append it to the /etc/passwd file.\n\nAdditional\
    \ changes are more on the fun and interesting side, fortunately. One tremendously\
    \ popular Mac OS X application that many people adore is iTunes, an elegant and\
    \ powerful MP3 player and online radio tuner. Spend time with iTunes, and you'll\
    \ find that it's very hard to keep track of what songs are on your system. Similarly,\
    \ Mac OS X has an interesting command-line application called open, which allows\
    \ you to launch graphical (\"Aqua\") in Mac OS X parlance from the command. But\
    \ open could be more flexible than it is, a wrapper helps a lot.\n\nThere are\
    \ other Mac OS tweaks that can help you in your day-to-day interaction. For example,\
    \ if you work on the command line with files created for the GUI side of the Macintosh,\
    \ you'll quickly find that the end-of-line character in these files isn't the\
    \ same as the character you need working on the command line. In technical parlance,\
    \ Aqua systems have end-of-line carries (notably, an r character), while the Unix\
    \ side wants newlines (an \\n ). Instead of a file in which each line is displayed\
    \ one after the other, a Mac Aqua will show up in the Terminal without the proper\
    \ line breaks. Have a file that's suffering from this problem? Heres what you'd\
    \ see if you tried to cat it:\n\n```\n$ cat mac-format-file.txt\n$ \n```\n\nYou\
    \ know there's content. To see that there's content, use the -v flag to cat, which\
    \ makes all otherwise hidden control characters visible. Suddenly you see something\
    \ like this:\n\n```\n$ cat -v mac-format-file.txt\nThe Rain in Spain^Mfalls mainly\
    \ on^Mthe plain.^MNo kidding. It does.\\^M $\n```\n\nClearly there's something\
    \ wrong! Fortunately, it's easy to fix with:\n\n```\n$ tr '\\\\r' '\\\\n' < mac-format-file.txt\
    \ > unix-format-file.txt\n```\n\nOnce this is applied to the sample file, start\
    \ to make a lot more sense:\n\n```\n$ tr '\\\\r' '\\\\n' < mac-format-file.txt\n\
    The Rain in Spain\nfalls mainly on\nplain.\nNo kidding. It does.\n```"
  merge: -1
  pgno: 316
- img_proc: true
  md: 'If you open a Unix file in a Mac application like Microsoft Word and it looks
    all wonky, you can also switch end-of-line characters in the other direction —
    toward Aqua application:


    ```

    $ tr ''\n'' ''\r'' < unixfile.txt > macfile.txt

    ```


    One last snippet before we get into the specific scripts for this chapter: easy
    screen shots in the world of Mac OS X. If you''ve used the Mac for any length
    of time, you''ve already learned that it has a built-in screen capture capability
    that you access by pressing CMD-SHIFT-3. You can also use the Mac OS X Utility
    located in the Applications/Utilities folder, and there are some excellent thirdparty
    choices, including Ambrosia Software''s Snaps Pro X, which I''ve used for the
    screen shots in this book.


    However, did you know that there''s a command-line alternative too? There''s no
    man page for it, but screencapture can take shots of the current screen and save
    them to the Clipboard or to a specified file (JPEG or TIFF format). Type in the
    command without any arguments, and you''ll see the basics of its operation:


    # $ screencapture


    +   screencapture: illegal, file required if not going to clipboard

    usage: screencapture [-cmwsx] [file] [cursor]

    -i capture screen interactively, by selection or window

    control key - causes screen shot to go to clipboard

    space key - toggle between selection and window modes

    escape key - cancels interactive screen shot

    -m force screen capture to go to the clipboard

    only the main monitor, undefined if -i is set

    -w only allow selection mode

    -s only allow mouse selection mode

    -W start interaction in window selection mode

    -x do not play സ്വന്ത

    file where to save the screen capture


    This is an application begging for a wrapper script. For example, to take a shot
    of the screen 30 seconds in the future, you could use


    # $ sleep 30; screencapture capture.tiff


    But what if you wanted to take a series of screen shots, spaced one minute apart?
    A simple loop would work:


    ```

    maxshots=60; counter=0

    while [ $counter -lt $maxshots ]; do

    screencapture$$(counter).tiff

    counter=$(( counter + 1 ))

    ```'
