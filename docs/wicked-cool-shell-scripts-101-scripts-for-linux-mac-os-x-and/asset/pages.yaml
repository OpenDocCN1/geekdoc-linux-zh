  md: '# Where to put your scripts


    I recommend that you create a new directory called "scripts," probably as a part
    of your HOME directory, and then add that fully qualified directory name to your
    PATH variable. (Use echo $PATH to see your current PATH, and edit the contents
    of _login or _profile (depending on the shell) to modify your PATH appropriately.)


    # Running the Script


    To run this, we first need to append a short block of commands to the very end
    of the file. These commands pass a starting parameter to the validation program
    and check the return code, like so:


    ```

    if [ $# -ne 1 ];

    echo "Usage: $0 command" >&2; exit 1

    fi


    checkForCmdInPath "$1"

    case $? in

    0 ) echo "$1 found in PATH"

    1 ) echo "$1 not found or not executable"

    2 ) echo "$1 not found in PATH"

    esac


    exit 0

    ```


    Once you''ve added the additional code snippet, you can invoke this script directly,
    as shown in "The Results," next. Make sure to remove or comment out the additional
    code before you''re done with this script, however, so its later inclusion as
    a library function doesn''t mess things up.


    # The Results


    To test the script, let''s invoke the names of three programs: a program that
    exists, a program that exists but isn''t in the PATH, and a program that does
    not exist but has a fully qualified filename and path:


    ```

    $ inpath echo

    echo found in PATH

    $ MrEcho echo

    MrEcho not found in PATH

    $ inpath /usr/bin/MrEcho

    /usr/bin/MrEcho not found or not executable

    ```


