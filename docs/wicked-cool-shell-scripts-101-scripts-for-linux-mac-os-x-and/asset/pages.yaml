  md: "# The Code\n\n```\n#!/bin/sh\n# inpath - Verifies that a specified program\
    \ is either valid as,\n# or that it can be found in the PATH directory list.\n\
    ```\n\n```\nin_path()\nn    # Given a command and the PATH, try to find the command.\
