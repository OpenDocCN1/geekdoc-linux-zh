  md: "# #68 Tracking Changes on Web Pages\n\nSometimes great inspiration comes from\
    \ seeing an existing business and saying to yourself, \"That doesn't seem too\
    \ hard.\" The task of tracking changes on a website is a surprisingly simple way\
    \ of collecting such inspirational material, as shown in this script, changetrack.\
    \ This script does one interesting nuance: When it detects changes to the site,\
    \ it emails the new web page, rather than just reporting it on the command line.\n\
    \n# ## The Code\n\n```\n#!/bin/sh\n\n# changetrack - Tracks a given URL, and if\
    \ it's changed since the\n#   visit, emails the new page to the specified address.\n\
    \nsitearchive=\"/usr/tmp/changrack\"      # change as desired\nsendmail=\"/usr/bin/sendmail\"\
    \          # might need to be tweaked!\nfromaddr=\"webscraper@intuitive.com\"\
    \   # change as desired\n\nif [ $# -ne 2 ]; then\n    echo \"Usage: $(basename\
    \ $0) url email\" >&2\n    exit 1\nfi\n\nif [ ! -d $sitearchive ]; then\n    if\
    \ ! mkdir $sitearchive; then\n        echo \"$(basename $0) failed: couldn't create\
    \ $sitearchive.\" >&2\n        exit 1\n    fi\n    chmod 777 $sitearchive    \
    \          # you might change this for privacy\nfi\n\nif [ \"$(echo $1 | cut -c1-5)\\\
    \ != \"http:\" ]; then\n    echo \"Please use fully qualified URLs (e.g., http://)\"\
    \ >&2\n    exit 1\nfi\n\nfname=\"$(echo $1 | sed 's|^/\\\\///|g' | tr '/?&' '...')\"\
    \nbaseurl=\"$(echo $1 | cut -d '-' -f3)\"\n\n# Grab a copy of the web page into\
    \ an archive file. Note that we\n# track changes by looking just at the content\
    \ (e.g., '-dump', not\n# '-source'), so we can skip any HTML parsing\n\nlynx -dump\
    \ $1 | uniq > $sitearchive/$(fname).new\n\nif [ -f $sitearchive/$fname ]; then\n\
    \    # We've seen this site before, so compare the two with 'diff'\n```\n\nChapter\
    \ 7 No Starch Press, Copyright ©2004 by Dave Taylor"
  merge: -1
