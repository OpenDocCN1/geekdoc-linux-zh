  md: "Like the mute script, the scripts presented in this chapter are short and useful,\
    \ offering a range of administrative capabilities, including system backups, showing\
    \ what system services are enabled through both inetd and xinet, a front end to\
    \ the date command for changing the current date and time, and a helpful tool\
    \ to validate crontab files.\n\n# #39 Analyzing Disk Usage\n\nEven with the advent\
    \ of large disks and their continual drop in price, system administrators seem\
    \ to perpetually be tasked with keeping an eye on disk usage to ensure that the\
    \ system doesn't fill up.\n\nThe most common monitoring technique is to look at\
    \ the /users /home directory, using the du command to ascertain the disk usage\
    \ of all the subdirectories, and reporting the five or ten users therein. The\
    \ problem with this approach, however, is that it doesn't take into account usage\
    \ elsewhere on the hard disk(s). If you have some users who have additional space\
    \ on a second drive, or sneaky types who keep MPEGs in a dot directory /tmp or\
    \ in an unused and accidentally opened directory in the ftp area, they'll escape\
    \ detection. Also, if you have home directories spread across multiple devices\
    \ (e.g., disks), searching each /home isn't necessarily optimal.\n\nInstead, a\
    \ better solution is to get all account names directly from the /etc/passwd file\
    \ and then search the file systems for files owned by each account, as shown in\
    \ this script.\n\n# The Code\n\n```\n#!/bin/sh\n\n# fquota Disk quota analysis\
    \ tool for Unix.\n# Assumes that all user accounts are >= UID 100.\n\nMAXDISKUSAGE=20\n\
    \nfor name in $(cut -d -f1,3 /etc/passwd | awk -F: '$2 > 99 {print $1}')\ndo\n\
    \  echo - \"User $name exceeds disk quota. Disk usage is: \"\"\n  # You might\
    \ need to modify the following list of directories to match\n  # the layout of\
    \ your disk. Most likely change: /Users to /home\n  find / /var /Users -user $name\
    \ -xdev -type f -ls | \\\n  awk '{ sum += $7 } END { print sum / (1024*1024) \"\
    \ MBs\" }'\n\ndone | awk \"$9 $MAXDISKUSAGE { print \\0 }\"\n\nexit 0\n```"
