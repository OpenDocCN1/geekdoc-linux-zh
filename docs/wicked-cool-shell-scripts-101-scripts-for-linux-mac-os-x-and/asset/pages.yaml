- img_proc: true
  md: "```\nthiskey=$($randomquote$db)\n\nstate=$(echo $thiskey | cut -d\\ -f1 | sed\
    \ 's/- //g')\ncity=$(echo $thiskey | cut -d\\ -f2 | sed 's/- //g')\nmatch=$(echo\
    \ $city | tr '[:upper:]' '[:lower:]')\n```\n\n```\nguess=\"\"\ntotal=$((guess\
    \ + 1 ))\n\necho\necho \"What is the capital of the state?\"\n```\n\n```\nwhile\
    \ [ \"$guess\" != \"$match\" -a \"$guess\" != \"next\" -a \"$guess\" != \"quit\"\
    \ ];\ndo\n\ttecho -n \"Answer:\"\n\tread guess\n\nif [ \"$guess\" = \"$match\"\
    \ -o \"$guess\" = \"$city\" ]; then\n\ttecho \"\"\n\techo \"*** Absolutely correct!\
    \ Well done!\"\n\tcorrect=$((correct + 1))\n\tguess=\nelif [ \"$guess\" = \"next\"\
    \ -o \"$guess\" = \"quit\" ]; then\n\ttecho \"\"\n\techo \"$city is the capital\
    \ of the $state.\"\nelelse\n\ttecho \"I'm afraid that's not correct.\"\n\tfi\n\
    done\n```\n\n```\necho \"You got $correct out of total presented.\"\nexit 0\n\
    ```\n\n# How It Works\n\nFor such an entertaining game, states are very simple\
    \ scripting. The data file contains state/capital pairs, with all spaces in the\
    \ state and capital names replaced with dashes and the two fields separated by\
    \ a single space. As a result, extracting the city and state names from the data\
    \ is:\n\n```\nstate=$(echo $thiskey | cut -d\\ -f1 | sed 's/- //g')\ncity=$(echo\
    \ $thiskey | cut -d\\ -f2 | sed 's/- //g')\n```"
