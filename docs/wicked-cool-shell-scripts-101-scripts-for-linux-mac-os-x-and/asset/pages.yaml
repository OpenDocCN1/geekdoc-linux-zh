    # Sample usage of this function in a script


    ```

    echo -n "Enter input: "

    read input


    if ! validAlphaNum "$input"; then

    echo "Your input must consist of only letters and numbers." >&2

    exit 1

    else

    echo "Input is valid."

    fi


    exit 0

    ```


    # How It Works


    The logic of this script is straightforward. First, it transforms the input with
    a sed-based transform to create a new version of the input data, and then it compares
    the new version with the original. If the two versions are same, all is well.
    If not, the lost data wasn''t part of the acceptable alphanumeric (alphabetic
    plus numeric) character set, and the input was unacceptable.\Specifically, the
    sed substitution is for any characters not in the set [:alnum:], the POSIX shorthand
    for the local definition of all upper- and lowercase characters and digits (alnum
    stands for alphanumeric). If this new, compressed value doesn''t match the input
    entered earlier, the removal of all the alphanumeric reveals nonalphanumeric values
    in the string (which is illegal) and the function returns a nonzero result, indicating
    a problem.


    # Running the Script


    This script is self-contained. It prompts for input and then informs you whether
    the result is valid or not. A more typical use of this function, however, would
    be to include it at the top of another script or in a library, as shown in Script
    #12, *Building a Shell Script Library*.


    This script is a good example of a general shell script programming technique.
    Write your functions and test them before you integrate them into larger, more
    complex scripts. It''ll save lots of headaches.


    # The Results


    $ validnum

    nEnter input: valid123SAMPLE

    Input valid.'
