  md: '# How It Works


    There''s a lot working together for this script to function. Not only do you need
    to have your Apache configuration (or equivalent) correct, but you need to have
    the correct entries in the .htaccess file and you need an .htpasswd file (ideally)
    at an entry for the admin user.


    The script extracts the .htpasswd filename and does a variety of tests to sidestep
    common htpasswd error situations, including an inability to write to the file.
    It also checks to ensure that the user is logged in as if the password file exists
    and is nonzero in size. All of this occurs before the main block of the script,
    the case statement.


    # Processing Changes to .htpasswd


    The case statement asserts when three possible actions is requested (A = add a
    user, U = update a user record, and D = delete a user) and invokes the correct
    segment of code accordingly. The action and the user account on which to perform
    the action are specified in the QUERY_STRING variable (sent by the browser to
    the server) as XY where X is the action code and Y is the specified username.
    When a password is being changed or a user is being added, a third argument, p,
    is needed and sent to the script.


    For example, let''s say I was adding a new user called joe, with the password
    knife. This action would result in the following QUERY_STRING given to the script
    from the web:


    ```

    a=A&u=joe&p=knife

    ```


    The script would unwrap this so that action A user was joe, and pass was knife.
    Then it would ensure that the password contains only alphanumeric characters in
    the following:


    ```

    if [ ! -z "$(echo $pass | tr -d ''[:upper:]][[:lower:]][[:digit:]'')" ]; then

    echo "Error: passwords can only contain a-z A-Z 0-9 ($pass)"

    ```


    Finally, if all was well, it would invoke the htpasswd program to encrypt the
    new password to the entry: the .htpasswd file:


    ```

    $htpasswd $user $pass

    ```


    # Listing All User Accounts


    In addition to processing requested changes to the .htpasswd file, directly after
    the case statement it produces an HTML table that lists each user in the .htpasswd
    file, along with a [delete] link.


    After producing three lines of HTML output for the heading of the table, the script
    continues with the interesting code:


    ```

    oldIFS=$IFS; IFS=""; # change word split delimiter

    while read acct pw; do

    echo "<tr><td>$acct</td><a href="$myname?a=D&u=$acct">$pw</a></td></tr>"

    ```


    No Starch, Copyright © 2004 by David Taylor'
