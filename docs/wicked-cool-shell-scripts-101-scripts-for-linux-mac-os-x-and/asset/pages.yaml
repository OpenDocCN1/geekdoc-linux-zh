  md: "# The Code\n\n```\n#!/bin/sh\n\nconnecttime - Reports cumulative connection\
    \ time for month/year entries\n# found in the system log file. For simplicity,\
    \ this is an awk program.\n\nlog=\"/var/log/system.log\" # this is just /var/log/system\
    \ on some machines\ntempfile=\"tmp/$0.$\"\n\ntrap << 'EOF' rm $tempfile\n\ncat\
