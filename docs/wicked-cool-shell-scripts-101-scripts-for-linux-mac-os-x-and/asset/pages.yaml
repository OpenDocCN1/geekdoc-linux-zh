    # #86 Exploring the Apache error_log


    Just as Script #84, Exploring the Apache access_log, reveals the interesting and
    useful statistical information found in the regular access log of Apache or Apache-compatible
    web server, this script extracts the critical information from the error_log.


    For servers that don''t automatically split their log file into separate-access_log
    and error_log components, you can sometimes split a central log into access and
    error components by filtering on the return code (field 9) of each entry:


    ```

    awk ''{if(substr($9,0,1) <= "3") { print $0 }'' apache.log > access_log

    awk ''{if(substr($9,0,1) > "3") { print $0 }'' apache.log > error_log

    ```


    A return code that begins with a 4 or a 5 is a failure (the 400s are client errors,
    the 500s are server errors), and a return code beginning with a 2 or a 3 is a
    success (the 200s are success messages, the 300s are redirects):


    Other servers that produce a single log file containing both successes and errors
    denote the error messages with an [error] field value. In that case, the split
    can be done with a grep ''[error]'' to create the error_log and a -v ''[error]''
    to create the access_log.


    Whether your server automatically creates an error_log or you have to create your
    own log by searching for entries with the ''[error]'' string, in the error log
    just about everything is different, including the way the date is specified:


    ```

    $ head -1 error_log

    [Thu Jan 2 10:07:07 2003] [error] [client 208.18.31.244] File does

    not: /usr/local/etc/httpd/htdocs/intuitive/favicon.ico

    ```


    In the access_log, dates are specified as a compact one-field value with spaces,
    but the error_log takes five fields instead. Further, rather than a consistent
    scheme in the word/string position in a space-delimited entry consistently'
