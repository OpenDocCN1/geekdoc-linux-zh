  md: 'That''s all the information we need to create a shell script that turns the
    data stream — the form information — into an email message, mails it off, and
    puts up a thank-you message for the web surfer.


    # The Code


    ```

    #!/bin/sh


    # formmail - Processes the contact form data, emails it to the designated

    # recipient, and returns a succinct thank-you message.


    recipient="tayor"

    thankyou="thankyou.html"      # optional ''thanks'' page


    ( cat << EOF

    From: (Your Web Contact Form) www@$(hostname)

    To: $recipient

    Subject: Contact Request from Web Site


    Content of the Web site contact form:

    EOF

    cat - | tr ''\&'' ''\n'' | \\

    sed -e ''s/+//g'' -e ''s/%40@/g'' -e ''s/:=/ /''

    echo ""; echo"

    echo "Form submitted on $(date)"

    )| sendmail -t


    echo "Content-type: text/html"

    echo ""


    if [ -r $thankyou ]; then

    cat $thankyou

    elelse

    echo "<html><body bgcolor=\\white">"

    echo "Thank you. We''ll try to contact you soonest."

    echo "</body></html>"

    fi


    exit 0

    ```


    # How It Works


    The cat statement translates the field separator & into a carriage return with
    tr, then cleans up the data stream a bit with sed, turning + into a space, the
    %40 encoding sequence into an & and into a colon followed by a space. Finally,
    a rudimentary thank-you message is displayed to the user.


