    # How It Works


    After the basic validity checks, the script processes the file containing the
    list of critical files, which is supplied as the first command argument, to ensure
    that spaces embedded in its filenames will work in the while loop (remember, by
    default spaces delimit arguments, so without some additional help, the shell will
    think "test file" is two arguments, not one). It does this by prefacing every
    space with a backslash. Then it builds the archive with the primitive but useful
    tar command, which lacks the ability to read standard input for its list and thus
    must be fed via a cat invocation


    ```

    tar czf $infile

    ```


    The tar invocation automatically compresses the archive, and uencode is then utilized
    to ensure that the resultant data file can be successfully emailed without corruption.
    The end result is that the remote address receives an email message with the uencoded
    tar archive as an attachment. This should be a straightforward process.


    NOTE The uencode program wraps up binary data so that it can safely travel through
    the email system without being corrupted. See man uencode for more information.


    # Running the Script


    This script expects two arguments: the name of a file that contains a list of
    files to archive and back up, and the destination email address for the compressed,
    uencoded archive file. The file list can be as simple as


    ```

    $ cat filelist

    ```


