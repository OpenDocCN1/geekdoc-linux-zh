  md: '# How It Works


    The ftync script uses the .timestamp file to ascertain which files in the current
    directory have changed since the last time ftync synchronized with the remote
    system. If .timestamp isn''t present, ftync automatically uploads everything in
    the current directory.


    The actual upload of files occurs in the conditional statement at the end of the
    script, which tests to see whether the transfer worked:


    ```

    if ftp -n < $timestamp

    ```


    **CAUTION** Be warned that some versions of Unix include an ftp program that doesn''t
    properly return a nonzero failure code to the shell when a transfer fails. If
    you have such an ftp program, the conditional statement just shown will always
    return false, and the touch $timestamp statement will never execute. If you find
    that this is the case, remove the conditional block completely, leaving just following:


    ```

    ftp -n < $timestamp

    touch $timestamp

    ```


    Upon completion, the .timestamp file is either created or updated, depending on
    whether it exists.


    # Running the Script


    To run this script, set up a directory on the remote server that you want to mirror
    the contents of a local directory using ftp, and then synchronize the files in
    the current directory by invoking ftync with the account server, name, and remote
    directory.


    It would be easy to either drop this shell invocation directly into a cron job
    or create a sync alias that remembers the command-line arguments, as shown in
    the “Running Script” section of Script #83, Synchronizing Files with SFTP:


    # The Results


    ```

    $ ftync taylor@intuitive.com archive

    Synchronizing Up: Found 33 files in local sync folder.

    Password:

    All files synchronized up with intuitive.com

    ```


    The Password: prompt is from within the ftp program itself, and on this Linux
    system, the interaction is quite succinct and graceful. The second time the command
    is invoked, it properly reports nothing to:


    ```

    $ ftync taylor@intuitive.com archive

    ftync: No files require uploading to intuitive.com

    ```'
