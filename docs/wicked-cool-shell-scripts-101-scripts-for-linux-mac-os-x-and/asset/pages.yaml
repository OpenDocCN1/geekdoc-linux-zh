- img_proc: true
  md: 'Each guess is compared against both the all-lowercase version of the city name
    (match) and the actual correctly capitalized city name to see if it''s correct.
    If not, the guess is compared against the two command words next and quit. If
    either matches, the script shows the answer and either prompts for another state
    or as appropriate.


    # Running the Script


    This script has no arguments or command flags.


    # The Results


    Ready to quiz yourself on state capitals?


    $ states


    What city is the capital of Indiana?

    Answer: Bloomington

    I''m afraid that''s not correct.

    Answer: Indianapolis


    *** Absolutely correct! Well done! ***


    What city is the capital of Massachusetts?

    Answer: Boston


    *** Absolutely correct! Well done! ***


    What city is the capital of West Virginia?

    Answer: Charleston


    *** Absolutely correct! Well done! ***


    What city is the capital of Alaska?

    Answer: Fairbanks

    I''m afraid that''s not correct.

    Answer: Anchorage

    I''m afraid that''s not correct.

    Answer: None

    I''m afraid that''s not correct.

    Answer: Juneau


    *** Absolutely correct! Well done! ***


    What city is the capital of Oregon?

    Answer: quit


    Salem is the capital of Oregon.

    You got 4 out of 5 presented.'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'Fortunately, the game tracks only ultimately correct guesses, not how many
    incorrect guesses you made or whether you popped over to Google to get the correct
    answer! -)


    # Hacking the Script


    Probably the greatest weakness in this game is that it''s so picky about spelling.
    A useful modification would be to add some code to allow fuzzy spelling, so that
    the user entry of June might match Juneau, for example. This could be done using
    a modified Soundex algorithm, in which all vowels are removed and all doubled
    letters are squished down to a single letter (e.g., Annapolis would transform
    to n). This might be too forgiving for your tastes, but the general concept is
    worth considering.


    As with other games, a "hint" function would be useful too. Perhaps it would show
    the first letter of the correct answer when requested but keep track of how many
    hints were used as the play proceed.


    Although this game is written around state capitals, it would be quite trivial
    to modify the script to work with any sort of paired data file. For example, you
    could create an Italian vocabulary quiz with a slightly different file, or a country/currency
    match, or even a politician/political party quiz. Again, as we''ve seen repeatedly
    in Unix, writing something that is reasonably general purpose allows it to be
    reused in useful and occasionally unexpected ways.'
