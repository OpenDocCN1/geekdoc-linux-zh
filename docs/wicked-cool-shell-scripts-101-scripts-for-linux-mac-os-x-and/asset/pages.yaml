    # #37 Working with Compressed Files


    Throughout the years of Unix development, few programs have been reconsidered
    and redeveloped more times than once. On most Linux systems there are three significantly
    different compression programs available: compress, gzip, and bzip2. Each has
    a suffix, .z, .gz, and .bz2, respectively, and the degree of compression of the
    results can vary among the three programs, depending on the layout of data within
    a file.


    Regardless of the level of compression, and regardless of which compression programs
    are installed, working with compressed files on many Unix systems requires uncompressing
    them by hand, accomplishing the desired tasks, and recompressing them when finished.
    A perfect job for a shell script!


    # The Code


    ```

    #!/bin/sh


    # zcat, zmore, and zgrep - This script should be either symbolically

    # or linked to all three names - it allows users to work with

    # compressed files transparently.


    z="compress"; uncompress=""; zlist=""

    gzip="gzip"; ungzip="gunzip"; gzlist=""

    bzip2="bzip2"; unbzip2="bunzip2"; bzlist=""


    # First step is to try and isolate the filenames in the command line.

    # We''ll do this lazily stepping through each argument, testing to

    # see if it''s a filename or not. If it is, and it has a compression

    # suffix, we''ll uncompress the file, rewrite the filename, and proceed.

    # When done, we''ll recompress everything that was uncompressed.

    ```'
