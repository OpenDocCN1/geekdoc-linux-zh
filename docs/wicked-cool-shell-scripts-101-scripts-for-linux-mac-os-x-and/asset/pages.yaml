    # How It Works


    Located in /etc/daily, /etc/weekly, and /etc/monthly or /etc/cron.daily, /etc/cron.weekly,
    and /etc/cron.monthly, these cron jobs are set up completely differently from
    user crontab files: Each is a directory that contains a set of scripts, one job,
    that run by the crontab facility, as specified in the /etc/crontab file. To make
    this even more confusing, the format of the /etc/crontab is different too, because
    it adds an additional field that indicates what user ID should run the job.


    To start, the /etc/crontab file specifies the hour of the day (in the second column
    of the output that follows) at which to run the daily, weekly, and monthly jobs:


    $ egrep ''daily|weekly|monthly'' /etc/crontab

    # Run daily/weekly/monthly jobs.

    15 3 * * * root periodic daily

    30 4 * * * 6 root periodic weekly

    30 5 1 * * root periodic monthly


    What happens to the daily, weekly, monthly jobs, if this system isn''t running
    at 3:15am every day, at 4:30am on Saturday morning, and at 5:30am on the first
    of each month?


    Rather than to force cron to run the jobs, this script lists the jobs and runs
    them directly with eval. The only difference between invoking the jobs from this
    script and invoking them as part of a cron job is that when jobs are run from
    cron, their output stream is automatically turned into an email message, whereas
    with this script the output is displayed on the screen.


    # Running the Script


    This script must run as root and has one parameter: either daily, weekly, or monthly,
    to indicate which group of system cron jobs you want to run. To run as root, sudo
    is recommended.


    # The Results


    This script has essentially no output and displays no results unless an error
    is encountered within the script or within one of the jobs spawned by the cron
    scripts.'
