    # #53 Validating User cron entries


    One of the most helpful facilities in Unix is cron, with its ability to schedule
    jobs at arbitrary times in the future, recurring every minute, few hours, monthly,
    or annually. Every good system administrator has a Swiss army of scripts running
    from the crontab file.


    However, the formatting for cron specifications is a bit tricky, and the cron
    fields have numeric values, ranges, and even mnemonic names for days of the week
    or months. What''s worse the crontab program generates insufficient error messages
    when scanning a cron file that might be incorrectly structured.


    For example, specify a day of the week with a typo, and crontab reports


    ```

    "tmp/crontab.DjJ7r4vw6R": bad day-of-week

    crontab: errors in crontab file, can''t install

    ```


    In fact, there''s a second error in the sample input file, line 12, but crontab
    is going to force you to take the long around to find it in the script because
    of its poor error-checking code.


    Instead of doing crontab''s way, a somewhat lengthy shell script can step through
    the crontab files, checking the syntax and ensuring that values are within reasonable
    ranges. One of the reasons that this validation is possible in a shell script
    is that sets and ranges can be treated as individuals. So to test whether 3-11
    or 4,6,9 are acceptable values for a field, simply test 3 and 11 in the former
    case, and 4, 6, and 9 in the latter.'
