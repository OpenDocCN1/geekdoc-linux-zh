- img_proc: true
  md: "requires you to specify the process ID, which can be a hassle. A much useful\
    \ approach is to have a script that matches process name to process ID and then\
    \ renics the specified application.\n\n# The Code\n\n```\n#!/bin/sh\n\n# renicename\
    \ - Renics the job that matches the specified name.\n\nuser=\"\"; tty=\"; showpid=0;\
    \ niceval=\"-a\"      # initialize\n\nwhile getopts \"-n:t:p\" opt; do\n  case\
    \ $OPTARG in\n    n) niceval=\"-z $tty\"\n      if [ ! -z \"$tty\" ]; then\n \
    \       echo \"$: error: -u and -t are mutually exclusive.\" >&2\n        exit\
    \ 1\n      fi\n      user=$OPTARG\n    t) if [ ! -z \"$user\" ]; then\n      \
    \  echo \"$: error: -u and -t are mutually exclusive.\" >&2\n        exit 1\n\
    \      fi\n      tty=$OPTARG\n    p) showpid=1;\n      echo \"Usage: $0 [-n niceval]\
    \ [-u user|-t tty] [-p] pattern\" >&2\n      echo \"Default niceval change is\
    \ \\$niceval\\ (plus is lower)\" >&2\n      echo \"priority, minus is higher,\
    \ but root can go below 0\" >&2\n      exit 1\n  esac\ndone\nshift $((($OPTIND\
    \ - 1))) # deat all the parsed arguments\n\nif [ $# -eq 0 ]; then\n  echo \"Usage:\
    \ $0 [-n niceval] [-u user|-t tty] [-p] pattern\" >&2\n  exit 1\nfi\n\nif [ !\
    \ -z \"$tty\" ]; then\n  pid-$(ps cu -t $tty | awk \"/1/ { print \\$2 }\")\nelif\
    \ [ ! -z \"$user\" ]; then\n  pid-$(ps cu -U $user | awk \"/1/ { print \\$2 }\"\
    )\nelse\n  pid-$(ps cu -U $USER:-LOGNAME | awk \"/1/ { print \\$2 }\")\nfi\n\n\
    if [ -z \"$pid\" ]; then\n  echo \"$: no processes match pattern $1\" >&2; exit\
    \ 1\n```"
