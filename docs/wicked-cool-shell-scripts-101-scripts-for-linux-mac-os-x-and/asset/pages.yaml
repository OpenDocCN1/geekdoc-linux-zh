    \ &2\n    exit 1\n  fi\n  tty=$2\n  n) denoining=1;\n  ?) echo \"Usage: 0 [-s\
    \ signal] [-u user|-t tty] [-n] pattern\" &2\n    exit 1\nnesac\ndone\n```\n\n\
