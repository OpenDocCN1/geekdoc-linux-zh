    # Hacking the Script


    You''ve already noticed that rather than using a human-readable date format, the
    getstats script saves entries in the netstat.log file using epoch time, which
    represents the number of seconds that have elapsed since January 1, 1970. For
    example, 1,063,985,000 seconds represents a day in September 2003.

    The use of epoch time will make it easier to enhance this script by enabling it
    to calculate the time lapse between readings. If for some reason, your system''s
    date command doesn''t have the %s for reporting epoch time, there''s a C program
    you can install to report the epoch time on just about any system: http://www.intuitive.com/wicked/examples/epoch.c.


    # #91 Renicing Tasks by Process Name


    There are many times when it''s useful to change the priority of a specific task,
    whether it''s an IRC or chat server''s to use only "spare" cycles, an MP3 player
    or file download that has become less important, or a real-time CPU monitor being
    increased in priority. The renice command,,'
