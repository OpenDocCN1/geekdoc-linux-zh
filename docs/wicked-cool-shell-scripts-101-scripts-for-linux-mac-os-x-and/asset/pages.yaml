  md: '# HACKING THE XBOX


    An Introduction to Reverse Engineering


    by ANDREW “BUNNIE” HUANG


    Hands-on guide to hardware hacking and reverse engineering using Microsoft’s Xbox™
    video console. Covers basic hacking techniques as reverse engineering and debugging,
    as well as Xbox security mechanisms and other advanced hacking topics. Includes
    a chapter written by the Electronic Frontier Foundation (EFF) about the rights
    and responsibilities of hackers.


    JULY 2003, 288 PP., $24.99 ($37.99 CDN)

    ISBN 1-59327-029-1


    ![](img/a236915495daab651d7c2cc28becf416_362_0.png)


    # HACKING


    The Art of Exploitation


    by JON ERICSON


    A comprehensive introduction to exploitation techniques and creative problem methods
    known as “hacking.” Explains technical aspects of hacking as stack based overflows,
    heap overflows, string exploits, return-into-libc, shellcode, and cryptographic
    attacks on 802.11b.


    NOVEMBER 2003, 264 PP., $39.95 ($59.95 CDN)

