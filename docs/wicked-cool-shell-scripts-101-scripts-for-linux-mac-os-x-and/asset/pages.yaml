    Aha! Notice that on the previous day susan deleted the file /tmp/central.log.


    # Hacking the Script


    There''s a potential log file ownership problem here too. Either the remove.log
    file is writable by all, in which case a user could clear its contents out with
    a command like /dev/null /var/log/remove.log or it isn''t writable by all, in
    which case the script can''t log the events. You could use a setuid permission
    so that the script runs with the same permissions as the log file, but there are
    two problems with this. First, it''s a really bad idea! Never run scripts setuid!
    Second, if it''s not enough of a reason, you could get into a situation where
    the users have permission to delete their files but the script doesn''t, and because
    the effective uid set with the setuid would be inherited by the command itself,
    things would break and there would be great confusion when users couldn''t remove
    their own files, when they check and see that they are the files in question.


    Two other solutions to this problem are worth mentioning. First, if you have an
    ext2 or ext3 file system (probably Linux), you can use the chattel command to
    set a specific append-only file permission on the log file and then leave it writable
    without any danger. Second, you could write the log messages to syslog, using
    the helpful logger command. To log the rm commands with logger is straightforward:


    ```

    logger -t logrm "${USER:-LOGNAME}: $*"

    ```


    This adds an entry to the syslog data stream (untouchable by regular users) that
    is tagged with logrm, the username, and the command specified.


    Syslog needs to watch for


    If you opt for this approach, you''ll want to check syslog(8) to ensure that your
    configuration doesn''t discard user.notice priority log events (it''s almost always
    specified in the /etc/syslog.conf file).'
