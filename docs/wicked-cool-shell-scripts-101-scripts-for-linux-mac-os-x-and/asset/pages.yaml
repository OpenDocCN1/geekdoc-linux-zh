    \ modifies\n    # The IFS (input field separator) but restores it upon completion.\n\
    \n    cmd=$2  retval=1\noldIFS=$IFS  IFS=$=\"\"\n\n    for directory in $path\n\
    \        if [ -x $directory/$cmd ]; then\n            retval=0  # if we're here,\
    \ found $cmd in $directory\n        fi\n    done\n    IFS=$oldIFS\n    return\
