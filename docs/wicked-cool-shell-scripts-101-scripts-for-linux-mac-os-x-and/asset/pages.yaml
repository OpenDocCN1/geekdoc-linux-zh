  md: '# How It Works


    The counter and update scripts do something quite simple: Together they open up
    a file; grab the number therein; increment it; save the new, larger value; and
    display that value. All the complexity in these scripts is associated with locking
    files to ensure there''s no collision when updating the counter value.


    The basis of the main conditional ascertains the system has lockf (the preferred
    choice), lockfile (an acceptable alternative), or nothing:


    ```

    if -z $(which lockf) ; then

    if -z $(which lockfile) ]; ; then

    echo "counter: no locking utility available\<br>"

    ```


    The command looks for a specific command in the current PATH; if it can''t find
    it, it returns zero. If neither lock nor lockfile exists, the script refuses to
    run and quits, but if any locking system can be found, it uses that and proceeds.


    The search for scripts running within the CGI environment is often shorter than
    the path for interactive scripts, so if you know that the system has lockf or
    lockfile and the script can''t find it, you''ll need to do one of two things.
    Modify the runtime by adding a line of code like the following to the beginning
    of the script, supplying the directory that contains the program in question:


    ```

    PATH=$(PATH):/home/taylor/bin

    ```


    Or replace both $(which lockf) and $(which lockfile) with the full lockfile or
    lock path and filename that you want to use in the script.


    # Running the Script


    This script isn''t intended to be invoked directly by a user or linked to directly
    by a web page. It is most easily as a server-side include (SSI) directive on an
    enabled web page, typically denoted by changing the suffix of the enabled page
    from .html to .shtml so that the web server knows to process it specially.


    The .shtml page would have a line of code embedded in the HTML similar to the
    following:


    ```

    <!#exec cmd="wicked/examples/counter.sh"-->

    ```


