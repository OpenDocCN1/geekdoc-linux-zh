    # #38 Ensuring Maximally Compressed Files


    As highlighted in Script #37, most Unix implementations include more than one
    compression method, but the onus is on the user to figure out which does the best
    job of compressing a given file. What typically happens is users learn how to
    work with just one program without ever knowing that they could attain better
    results with a different one. Making this more confusing is that some files compress
    better with one algorithm than another, and there''s no way to know without experimentation.


    The logical solution is to have a script that compresses files using each of the
    tools and then selects the smallest resultant file as the best. That''s exactly
    what bestcompress does. By the way, this is one of my favorite scripts in the
    book.


    # The Code


    ```

    #!/bin/sh


    # compress - Given file, tries compressing it with all the available

    # compression tools and keeps the compressed file''s smallest, reporting

    # the result to the user. If ''-a'' isn''t specified, bestcompress skips

    # compressed files in the input stream.


    Z="compress" gz="gzip" bz="bzip2"

    zout="/tmp/bestcompress.\$.gz"

    gzout="/tmp/bestcompress.\$.bz"

    skipcompressed=1

    ```'
