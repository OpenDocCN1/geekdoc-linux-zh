    # How It Works


    This script is straightforward, changing the user''s password to an unknown (to

    value) and shutting off the user''s home directory. If he or she

    is logged, we give a few seconds'' warning and then log the user out by killing

    of her running processes.


    Notice the sequence of sending a SIGHUP (HUP) to each running process, a

    hang-up signal, and then sending the more aggressive SIGKILL

    (KILL). The SIGHUP signal often, but not always, quits applications, but it

    won''t kill a shell. SIGKILL, however, cannot be ignored or blocked by any

    Unix process, so it''s guaranteed 100 percent effective, though it

    dn''t give the application any time to clean up temp files, flush file buffers
    to

    ensure changes are written to disk, and so forth.


    Unspending a user is a simple two-step process of opening his or her home

    directory back up (with chmod 700) and resetting the password to a known value

    (passwd).'
