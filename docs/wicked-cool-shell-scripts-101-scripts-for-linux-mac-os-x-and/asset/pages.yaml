  md: 'enclosed command | invoked and its output substituted. The first of the sequences
    shown here extracts the first character and forces it to uppercase with tr. (The
    sequence echo $1|cut -c could also be written as ${1#?} in the POSIX manner, as
    seen earlier.) The second of the sequences extracts the second and third characters
    and forces them to be lowercase:


    ```

    month-$\$(echo $1|cut -c|tr ''[:lower:]'' ''[:upper:]'')

    month-$\$(echo $1|cut -c2-3 | tr ''[:upper:]'' ''[:lower:]'')

    ```


    # Running the Script


    To ensure maximum flexibility with future scripts that incorporate the normdate
    functionality, this script was designed to accept input as three fields entered
    on the command line. If you expected to use this script interactively, you''d
    prompt the user for the three fields only, that would make it more difficult to
    invoke normdate from other scripts.


    # The Results


    This script does what we hoped, normalizing date formats as long as the format
    meets a relatively simple set of criteria (month name known, month value between
    1 and 12, and a four-digit year value). For example:


    ```

    $ normdate 8 3 62

    normdate: expected four-digit year value.

    $ normdate 8 3 1962

    Aug 3 1962

    $ normdate AUGUST 3 1962

    Aug 3 1962

    ```


    # Hacking the Script


    Before you get too excited about the many extensions you can add to this script
    to make it more sophisticated, check out Script #7, which uses normdate to validate
    input dates. One modification you could make, however, would be to allow the script
    to accept dates in the format MM/DD/YYYY or MM-DD-YYYY by adding the following
    snippet snippet immediately before the test to see if three arguments are:


    ```

    if [ -eq 1 ]; then # try to compensate for / or - formats

    set --$(echo $1 | sed ''s/\/-]/ /g'')

    fi

    ```


    With this modification, you could also enter the following common formats and
    normdate them:


    ```

    $ normdate March-11-1911

    Mar 11 1911

    ```'
