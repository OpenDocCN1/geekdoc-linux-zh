    # How It Works


    The getstock script is one of the most straightforward in this chapter. It emulates
    a method-get query to Lycos Finance and extracts the value of a single stock specified
    as the command argument by finding the line in the web page that indicates "Last
    Price:" and extracting the subsequent price.

    The wrapper script portfolio calculates the value of all stocks in a portfolio,
    using the information stored in the portfolio data file, which is organized as
    a simple text file with stock name, ticker symbol, and the number of shares held.
    For parsing simplicity, the data files are separated by a | character that''s
    not likely to show up in a company name. The portfolio script extracts the value
    of these fields, calculates the current value of each stock by calling getstock,
    and multiplies by the shares held to ascertain the total value of that stock.
    They sum up, and you have the portfolio value.

    The eval command on the first line of the while loop in portfolio is tricky-


    ```

    eval \$(echo $holding | \

    awk -F "|\'' ''{print name="$1"; ticker="$2"; hold="$3"}\'')

    ```


    Within the subshell, awk parses a line from the portfolio database, splitting
    it into three fields, and then outputs them in name=value format. Then the call
    to eval, within which the awk call contains, forces the script to evaluate awk
    as if it were entered directly into the shell. For example, the Apple holdings
    in the portfolio shown in the next section, the subshell would be


    ```

    name="Apple Computer"; ticker="AAPL"; hold="500"

    ```'
