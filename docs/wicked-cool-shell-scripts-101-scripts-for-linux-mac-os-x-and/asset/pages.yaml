  md: '# #84 Exploring the Apache access_log


    If you''re running Apache or a similar web server that uses the Common Log Format,
    there''s quite a bit of quick statistical analysis that can be done with a shell
    script. The standard configuration for a server has an access_log and error_log
    written for the site; even ISPs make these raw data files available to customers,
    but if you''ve got your own server, you should definitely have and archiving this
    valuable information.


    Table 10-1 lists the columns in an access_log.


    | Column | Value |

    | --- | --- |

    | 1 | IP of host accessing the server |

    | 2-3 | Security information for https/SSL connections |

    | 4 | Date and time zone offset of the specific request |

    | 5 | Method invoked |

    | 6 | URL requested |

    | 7 | Protocol used |

    | 8 | Result code |

    | 9 | Number of bytes transferred |

    | 10 | Referrer |

    | 11 | Browser identification string |


    **Table 10-1:** Field values in the access_log file


    A typical line in an access_log looks like the following:


    ```

    63.203.109.38 - [02/Sep/2003:09:51:09 -0700] GET /cluster HTTP/1.1"

    301 248 - "http://search.msn.com/results.asp?rs=CHECKED&FORM=MSNH&q=%22little+big+Horn%22
    "Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.0)"

    ```


    The result code (field 8) of 301 indicates success. The result indicates the URL
    of the page that the surfer was visiting immediately prior to the request on this
    site: You can see the user at search.msn.com (MSN) and searched for "little Big
    Horn." The results of that search included a link to the /custer URL on this.


    The number of hits to the site can be quite ascertained by doing a word count
    on the log file, and the date of entries in the file can be ascertained by comparing
    the first and last lines:


    ```

    $ wc -l access_log

    10991 access_log

    $ head -1 access_log ; tail -1 access_log

    64.12.96.106 - [13/Sep/2003:18:02:54 -0600] ...

    216.93.167.154 - [15/Sep/2003:16:30:29 -0600] ...

    ```


    With these points in mind, here''s a script that produces a number of useful statistics,
    given an Apache-format access_log file.'
