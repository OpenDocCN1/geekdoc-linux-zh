    The agenda script checks for events by taking the current date and transforming
    it into the three possible string formats (dayname, day+month, and day+month-year).
    It simply compares each of these strings to each in the .agenda data file. If
    there''s a match, that is shown to the user. While long, the agenda script has
    nothing particularly complex except how eval is used to assign variables to each
    of the date values needed:


    ```

    eval($date("+weekdayday="%a" month="%b" day="%e" year="%G"))

    ```


    It''s also possible to extract the values one by one (for example, weekday="$date+%a"),
    but in very rare cases this method can fail if the date rolls over a day in the
    middle of the four date invocations, so a succinct invocation is preferable. In
    either case, unfortunately, date returns a day number with either a leading zero
    or a leading space, neither of which is desired. The line of code immediately
    subsequent to the line just strips the leading space from the value, before proceeding.


