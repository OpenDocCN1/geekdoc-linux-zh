  md: "# Hacking Script\n\nThis concept can be applied to almost anything on the Web\
    \ if you're inspired. You could scrape the headlines from CNN or the South China\
    \ Morning Post, or get a random advertisement from a cluttered site. Again, if\
    \ you're going to make it an part of your site, make sure it's either considered\
    \ public domain or you've been asked for permission.\n\n# Turning Web Pages into\
    \ Email Messages\n\nCombining the method of reverse-engineering file-naming conventions\
    \ with the website tracking utility shown in the previous chapter (Script #68,\
    \ Tracking Changes on Web Pages), you can email yourself a web page that updates\
    \ not only its content but its filename.\n\nAs an example, Cecil Adams writes\
    \ a very witty and entertaining column for the Chicago Reader \"The Straight Dope\"\
    . The specific page of the latest column has a URL of: http://www.straightdope.com/columns/${now}.html,\
    \ where now is the year, month, and day, in the format YMMDD. The page is updated\
    \ with a new column every Friday. To the new column emailed to a specified address\
    \ automatically is rather straightforward:\n\n```\n#!/bin/sh\n\n# getopde grab\
    \ the column of 'The Straight Dope'\n# Set it up to run every Friday.\n\nnow=\"\
    $(date +%Y%m%d)\"\nurl=\"http://www.straightdope.com/columns/${now}.html\"\nto=\"\
    testing@yourdomain.com\" # change this as appropriate\n\n```\n\n```\ncat << EOF\n\
