    # #81 Synchronizing Directories with FTP


    One of my most common uses for ftp is to ensure that a local copy of a directory
    is synchronized with a remote copy on a web server. The fancy name for this is
    content mirroring. The basic idea is simple: Move into a specific local directory,
    specify a remote server and remote directory, and then ensure that anything that''s
    changed in one directory is copied to the other, as needed.


    This book offers two scripts for FTP syncing: fpsyncup and fpsyncdown. The first
    uploads all files in the current directory to the remote directory, while the
    latter does the opposite and is presented here as Script #82. Unless you''re starting
    fresh on a new client system and need to acquire the latest versions of files
    from a server, you''ll most likely use fpsyncup far, more often than siblings,
    because people work directly with files located on servers.


    # The Code


    ```

    #!/bin/sh

    ```


    ```

    # fpsyncup - Given a target directory on an ftp server, makes sure that

    # all new or modified files are uploaded to the remote system. Uses

    # a timestamp file ingeniously called .timestamp to keep track.

    ```


    ```

    timestamp=".timestamp"

    tempfile="/tmp/fpsyncup.$\"

    count=0"

    ```


