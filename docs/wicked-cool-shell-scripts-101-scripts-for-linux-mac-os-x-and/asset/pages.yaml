  md: "```\ndiff $sitearchive/$fname $sitearchive/$$(fname).new > /dev/null ; then\n\
    echo \"Site $1 has changed since our last check.\"\nelse\nrm -f $sitearchive/$$(fname).new\
    \ # nothing new...\n  # no change, we're outta here\nfi\n```\n\necho \"Note: we've\
    \ never seen this site before.\"\n\nFor the script to get here, the site must\
    \ have changed, and we need to send\n# the contents of .new file to the user and\
    \ replace the original with the\n# .new for the invocation of script.\n\n```\n\
    ( echo Content-type: text/html\necho \"From: fromaddr (Web Site Tracker)\"\necho\
    \ \"Subject: Web Site $1 Has Changed\"\necho \"To: $z\"\necho \"\n```\n\n```\n\
    lynx -source $1 | \\\nsed -e\"[sS][h][rR][cC]=\\|SRC=\\\\$baseurl|g\" \\\\\nsed\
    \ -e\"[sS][h][rR][eE]=[ff]=\\|HREF=\\\\$baseurl|g\" \\\\\nsed -e\"$baseurl|http:http|g\"\
    \ \\\\\n$sendmail -t\n```\n\n# Update the saved snapshot of the website\n\n```\n\
    mv $sitearchive/$$(fname).new $sitearchive/$fname\nchmod 777 $sitearchive/$fname\n\
    ```\n\n# and we're done.\nexit 0\n\n# How It Works\n\nGiven a simple URL and a\
    \ destination email address, this script grabs the URL's\nweb page content and\
    \ compares it against the content of the site from the\nprevious check.\nIf's\
    \ changed, the new web page is emailed to the specific recipient, with\nsome simple\
    \ rewrites to try to keep the graphics and HREFs working. These HTML\nrewrites\
    \ are shown below:\n\n```\nlynx -source $1 | \\\nsed -e\"[sS][h][rR][cC]=\\|SRC=\\\
    \\$baseurl|g\" \\\\\nsed -e\"[sS][h][rR][eE]=[ff]=\\|HREF=\\\\$baseurl|g\" \\\\\
    \nsed -e\"$baseurl|http:http|g\"\n```"
