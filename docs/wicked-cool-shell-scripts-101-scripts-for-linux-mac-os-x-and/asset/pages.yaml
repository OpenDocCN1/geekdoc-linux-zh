    # #87 Avoiding Disaster with a Remote Archive


    Whether or not you have a good backup strategy, with tape rotation and so forth,
    it''s still a nice policy to identify a half-dozen critical files and have sent
    them to a separate off-site archive system. Even if it''s just one key file that
    contains customer addresses, invoices, or email from your sweetheart, having an
    occasional off-site archive can save your life when you least expect it.


