    # Hacking the Script


    "remove the good characters and then see what’s left" approach is nice because
    it’s tremendously flexible. Want to force uppercase letters but also allow spaces,
    commas, and periods? Simply change the substitution pattern:


    ```

    sed ''/^[:upper:][][.]//''

    ```


    A simple test for valid phone number input (allowing integer values, spaces, parentheses,
    and dashes) could be


    ```

    sed ''/^[:digit:]][\(-\]//''

    ```


    For integer values only, though, beware of a pitfall. You might try the following:


    ```

    sed ''/^[:digit:]][]//''

    ```


    But if you want to enter negative numbers? If you just add the minus sign to the
    valid character set, -3-4 would be a valid input, though not a legal integer.
    The particular instance of negative numbers is addressed in Script #5, *Validating
    Integer Input*, later in this chapter.


