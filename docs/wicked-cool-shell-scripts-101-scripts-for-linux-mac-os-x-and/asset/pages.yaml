- img_proc: true
  md: '# How It Works


    By convention, uids 1 through 99 are for system daemons and administrative tasks,
    100 and above are for user accounts. Unix administrators tend to be a fairly organized
    bunch, and this script takes advantage of that, skipping all accounts that have
    a uid less than 100.


    The -xdev argument to find command ensures that doesn''t go through all files,
    preventing it from clogging through system areas, read-only directories, removable
    devices, the /proc directory of running processes (Linux), and similar areas.


    It may seem at first glance that this script exceeds disk quota message for every
    and account, and the awk statement after the loop allows reporting of this message
    for accounts with usage greater than the predefined MAXDISKUSAGE.


    # Running the Script


    This script has no arguments and should be run as root to ensure access to all
    directories and file systems. The smart way to do this is by using the sudo command
    (man sudo for more details). Why is sudo helpful? Because it allows you to execute
    one command as root, after which you are back to a regular user. Each time you
    run an administrative command, you have to consciously use sudo to do so; using
    su - root, by contrast, makes you root for all subsequent commands until you exit
    the shell, and when you get distracted it''s all too easy to forget you are root
    and type a command that can lead to disaster.


    > You will likely have to modify the directories listed in the find command to
    match the corresponding directories in your own disk topography.


    # The Results


    Because it is searching across file systems, it should be no surprise that this
    script takes a while to run. On a large system it could easily take somewhere
    between a cup of tea and a lunch with your significant other. Here are the results:


    ```

    $ sudo fquota

    User linda exceeds disk quota. Disk usage: 39.7 Mbytes

    User taylor exceeds disk quota. Disk usage: 21799.4 Mbytes

    ```


    You can see that taylor is out of control with his disk usage! That''s 21GB Sheesh.


    # Hacking the Script


    A complete script of this nature should have some sort of automated email capacity
    to warn the scofflaws that they are hogging disk space. This enhancement is demonstrated
    in the very next script.'
