    # How It Works


    Using the helpful lynx command, this script extracts just the text from each of
    the specified pages and feeds the result to a spell-checking program (ispell)
    in this example, though it works just well with itself or another program. See
    Script #25, Checking the Spelling of Individual Words, for more information about
    different spell-checking options in this script:


    Notice the file existence in this script too:


    ```

    if [ ! -f "filename" -a "$filename|cut -c1-7" != "http://"

    ```


    It can''t just if the given name is not readable, because $filename might actually
    be a URL, so the test becomes more complex. However, when referencing filenames,
    the script can work properly with invocations like website *, though you''ll get
    better results with a filename wildcard that matches only HTML files.

    Try wellspell *html.


    Whichever spell-checking program you use, you''ll need to ensure that the result
    of the following line is a list of misspelled words, with none of the spell-checking
    utility''s special formatting:


    ```

    ispell -a | awk ''/\/&/{ print $2 }'' | \

    ```


    This line is but one of a quite complex pipeline that extracts the text from the
    page, translates it to one word per line (the tr invocation), the words, and ensures
    that each one appears only once in the pipeline (sort -u). After the sort operation,
    we screen out all the lines that don''t begin with a lowcase letter (that is,
    punctuation, HTML tags, and other content). Then the next line of the pipe runs
    the data stream through the spell utility, using awk to extract the misspelled
    word from the oddly formatted ispell output. The Results'
