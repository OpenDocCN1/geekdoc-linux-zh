    \ {\nif ($sum > 60) { total = sum/60 \" hours\" }\nelse\n    { total = sum \"\
    minutes\" }\nprint lastmonth \": \" total\n}\nEOF\n\ngrep \"Connect time\" $log\
    \ | awk -f $tempfile\n\nexit 0\n```\n\n# How It Works\n\nOn most Unixes, the system\
