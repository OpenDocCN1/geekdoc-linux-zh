  md: '# #23 A Remainder Utility


    Windows and Mac users for years have appreciated simple utilities like Stickies
    and Post-It, streamlined applications that let you have tiny reminder windows
    stuck on your screen. They''re a perfect place to jot a phone number or other
    reminder. If you''re at the Unix command line, there''s nothing analogous, yet
    the problem is quite easily solved, as shown in this few scripts.


    The first script, *remember*, lets you easily save random snippets of information
    into a file. If invoked without any arguments, it reads standard input until the
    end of the file, and if invoked with arguments, it saves those arguments to the
    data file instead.


    The other half of this duo is *remindme*, a companion shell script that either
    plays the contents of the *rememberfile* if no arguments are given, or if an argument
    is, searches in this file for the specified pattern.


    # The Code


    ```

    #!/bin/sh


    # remember - An easy command-line-based memory pad.


    rememberfile="$HOME/.remember"


    if [ $ -eq 0 ]; then

    echo "Enter note with "D: "

    cat >> $rememberfile

    else

    echo "$@" >> $rememberfile

    fi


    exit 0

    ```


    Here''s the second script, remindme:


    ```

    #!/bin/sh


    # remindme - Searches a data file for matching lines, or shows the entire contents

    # of the data file if no argument is specified.


    rememberfile="$HOME/.remember"


    if [ $ -eq 0 ]; then

    more $rememberfile

    else

    grep -i "$@" $rememberfile | $(PAGER:-more)

    fi


    exit 0

    ```'
  merge: -1
  pgno: 90
- img_proc: true
  md: '# Running the Scripts


    To use the remindme utility, first add notes, phone numbers, or anything else
    to the rememberfile with the remember script. Then search this freeform database
    with remindme, specifying as long or short a pattern as you''d.


    # The Results


    ```

    $ remember

    Enter note, with ^D:

    The Boulder Community Network: http://bcn.boulder.co.us/

    ^D

    ```


    Then, when I want to remember that note, months later:


    ```

    $ remindme boulder

    The Boulder Community Network: http://bcn.boulder.co.us/

    ```


    Or if I need any other data that might be in there:


    ```

    $ remindme 800

    Southwest Airlines: 800-IFLYSNA

    ```


    # Hacking the Script


    While certainly not any sort of shell scripting programming tour de force, these
    scripts nearly demonstrate the incredible extensibility of the Unix command line.
    If you can envision something, the odds are good that there''s a simple and straightforward
    way to accomplish it.


    These scripts could be improved in any number of ways. For instance, you could
    create the record of records where each record is time-timestamped and multiline
    input is saved as a single entity that can be searched with a regular expression,
    which would enable you to store phone numbers for a group of people and retrieve
    them by all remembering the name of one person in the group. If you''re really
    into scripting, you might also want to include and delete capabilities. Then again,
    it''s pretty easy to edit the ~/.remember file by hand.


