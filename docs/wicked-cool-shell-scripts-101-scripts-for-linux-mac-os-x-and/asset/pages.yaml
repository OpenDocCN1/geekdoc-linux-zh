  md: 'Three types of access mode are possible: a is anonymous, g is for users who
    utilize the guest account (usually password protected), and r is for real or regular
    users. In the case of anonymous and guest users, the account value (field 14)
    is the user''s password. People connecting anonymously are requested by their
    FTP program to specify their email address as their password, which is then logged
    and can be analyzed.


    Of this xferlog output stream, the most important entries are those with an anonymous
    access mode and a direction of i, indicating that the entry is an upload listing.
    If you have allowed anonymous connections and have either deliberately or accidentally
    left a directory writable, these anonymous upload entries are where you will be
    able to see if script kiddies, warez hackers, and other characters of ill reput
    are exploiting your server. If an an entry lists a file uploaded to your server,
    it needs to be checked out immediately, if the file-name quits innocuous.


    This test occurs in the following statement in extract:


    ```

    awk ''$13 = \"$1\" $12 = \"$1\" { print \$9 } | sort | uniq -c | sort | head -10
    | sed ''s/\*//'' > $tmp

    ```


    In this rather complex awk invocation, we''re checking whether field 13 matches
    the anonymous access code (because extract is called as extract "a "Anonymous
    Access") and field 12 indicates that it''s an upload with the code 1. If both
    of these conditions are true, we process the value of field 9, which is the name
    of the file uploaded.


    If you''re running an FTP server, this is definitely a script for a weekly (or
    every daily) cron job.


    # Running the Script


    If invoked without any arguments, this script tries to run and analyze the standard
    ftppd transfer log /var/log/xferlog. If that''s not the correct log file, a different
    filename can be specified on the command line.


