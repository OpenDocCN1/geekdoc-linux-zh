    The coolest single line in this script contains the snippet


    ```

    awk -F: '' ''{ if (big < $3 && $3 < 5000) big=$3 } END { print big + 1 }'' $file

    ```


    This scans through the /etc/passwd file, ascertaining the largest user ID in use''s
    not the highest user account value (adjust for your configuration preferences)
    and adding 1 to it for the new account ID. This saves the admin from having to
    remember what the next available ID is, and it also offers a high degree of consistency
    in account information as the user evolves and changes.


