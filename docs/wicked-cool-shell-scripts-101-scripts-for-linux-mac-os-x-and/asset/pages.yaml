  md: '# How It Works


    This script exploits the ability of the date command to show the date and time
    for a specified time zone, regardless identifying your physical location. In fact,
    the entire script is all about identifying a valid time zone name that the date
    command will work when invoked at the very end.


    Most of the complexity of this script comes from trying to anticipate names of
    world regions entered by users that do not match the names of regions in the time
    zone database. The time zone database is laid out with timezone and region/locationname
    columns, and the script tries to display useful error messages for typical input
    problems.


    For example, although Td="Casablanca" date would fail to find a matching region,
    and the date command would instead display GMT (Greenwich Time, more properly
    known as Universal Time Co), the city Casablanca exists in the time zone database.
    The proper region Africa/Casablanca, was shown in the introduction to this script.
    This script can find Casablanca in the Africa directory and identify the zone
    accurately. Specify "Africa," on the other hand, and the script knows that there
    are subregions and specifies that the information is insufficient to uniquely
    identify a specific time zone.


    Finally, you can also use a time zone (e.g., UTC or WET) as an argument to this
    script to see a subset of time zones that are defined.


    An excellent reference to the time zone database can be found online, http://www.twin-sun.com/tz/tz-link.htm


    # Running the Script


    To find in a specified region or city, specify the region or city name as the
    argument to the command. If you know both the region and the city, you can specify
    them as region/city, as in Pacific/Yap. Without any arguments, time shows Greenwich
    Mean Time/Universal Time Coordinated (GMT/UTC).


    # The Results


    +   $ timein

    It''s Friday, March 28, 2003, at 2:58 AM in UTC

    $ time London

    It''s Friday, March 28, 2003, at 2:58 AM in Europe/London

    $ time Brazil

    The region "Brazil" has more than one time zone. Please use ''list'' to see all
    known regions and time zones.

    $ time Pacific/Honolulu

    It''s Thursday, March 27, 2003, at 4:58 PM in Pacific/Honolulu

    $ time WET

    It''s Friday, March 28, 2003, at 3:58 AM in WET

    $ time mycloset

    Can''t find an match for "mycloset". Please use ''list'' to see all known regions
    and time zones.


    No Starch Press, Copyright ©2004 by Dave Taylor 69'
