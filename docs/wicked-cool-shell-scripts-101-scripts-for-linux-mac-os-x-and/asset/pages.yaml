    > Nostradamus couldn''t predict this ... it''s Trivial.net


    Figure 8-7: Server-side includes let us invoke shell scripts from within HTML
    files


    # Hacking the Script


    If your system doesn''t support SSI, another approach to getting a counter, though
    a bit clunky, would be to have a wrapper script that emulates this simple SSI
    mechanism. Here''s an example in which the string "--countervalue--, embedded
    in the HTML page to display, will be replaced with the actual numeric counter
    value for the specified HTML file:


    ```

    #!/bin/sh


    # streamfile - Outputs an HTML file, replacing the sequence

    # --countervalue--- with the current counter value.

    # This script should be referenced, instead of $infile, from other pages.


    infile="page-with-counter.html"

    counter="./counter.sh"


    echo "Content-type: text/html"

    echo ""


    value="$(counter)"


    sed "s/---countervalue---/$value/g" $infile


    exit 0

    ```'
