    # #54 Ensuring System cron Jobs Are Run


    Until recently, Unix systems were all designed and developed to run as servers,
    up 24 hours a day, 7 days a week. For you can see implicit expectation in the
    design of the cron facility: there''s no point in scheduling jobs for 2:17am every
    Thursday if the system is shut down at 6pm for the night.


    Many modern Unix and Linux users shut down their systems at the end of the day
    and start it up the following morning. It''s quite alien to Mac OS users, for
    example, to leave their systems running overnight, let alone over a weekend or
    holiday period.


    This isn''t a big deal with crontab entries, because those that don''t run due
    to actual shutdown schedules can be tweaked to ensure that they get invoked consistently.
    The problem arises when the daily, weekly, and monthly cron jobs that are part
    of the underlying system are not run at the predefined times.


    This script enables the administrator to invoke the daily, weekly, or monthly
    jobs directly from the command line, as


    # The Code


    ```

    #!/bin/sh


    # Runs the daily, weekly, and monthly

    # system cron jobs on a system that''s likely

    # to be shut down during the usual time of day when

    # the system cron jobs would occur.

    ```


