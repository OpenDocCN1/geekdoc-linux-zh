    # #92 Adding New Host Accounts


    This script is particularly useful for web administrators who serve a number of
    different domains and websites from a single server. A great way to accomplish
    this by using virtual hosting, a capability of Apache (and many other web servers)
    to assign multiple domain names to the same IP address and then split them back
    into individual sites within the Apache configuration file.


    Just as adding a new account on a private machine requires the creation of a new
    home directory, creating a virtual host account requires creating a separate home
    for both the web pages themselves and the resultant log files. The material added
    is straightforward and quite consistent, so it''s a great candidate for a shell
    script.


