  md: "# #7 Validating Date Formats\n\nOne of the most challenging validation tasks,\
    \ but one that's crucial for shell scripts that work with dates, is to ensure\
    \ that a specific date is actually possible. If we ignore years, this task is\
    \ not too bad, because the calendar is well behaved and consistent each year.\
    \ All we need in that case is a table with the days of each month against to compare\
    \ a specified date. To take leap years into account, you have to add some additional\
    \ logic to the script. One set of rules for calculating a leap year is as follows:\n\
    \n+   - Years divisible by 4 are not leap years.\n- Years divisible by 4 and 400\
    \ are leap years.\n- Years divisible by 4, not divisible by 400, and divisible\
    \ by 100, are not leap years.\n- All others divisible by 4 are leap years.\n\n\
    Notice how this script utilizes normdate (Script #3) to ensure a consistent date\
    \ format before proceeding.\n\n# The Code\n\n```\n#!/bin/sh\n# valid-date -- Validates\
    \ a date, taking into account leap year rules.\n\nexceedsDaysInMonth()\\n{\n \
    \   # Given a month name, return 0 if the specified day value is\\n    # less\
    \ than or equal to the max days in the month; 1 otherwise\\n\\n    case $1|tr\
    \ '[:upper:]' '[:lower:]' in\\n        jan*) days=31 ;; feb*) days=28 ;;\\n\\\
    \        mar*) days=31 ;; apr*) days=30 ;;\\n\\n        may*) days=31 ;; jun*)\
    \ days=30 ;;\\n\\n        jul*) days=31 ;; aug*) days=31 ;;\\n\\n        sep*)\
    \ days=30 ;; oct*) days=31 ;;\\n\\n        nov*) days=30 ;; dec*) days=31 ;;\\\
    n\\n        *) echo \"$0: Unknown month name $1\" >&2;exit 1\\n    esac\\n\\nif\
    \ [ $2 -lt 1 -o $2 -gt $days ]; then\\n    return 1\\nelse\\n    return 0 # the\
    \ day number is valid\\nfi\\n\\n\\nisLeapYear()\\n{\n    # This function returns\
    \ 0 if it is a leap year, 1 otherwise.\\n}\n```"
