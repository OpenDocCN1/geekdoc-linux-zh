  md: '# Hacking the Script


    Like its partner script, ftpsync, ftpsync doesn''t deal with transferring directories
    in a graceful manner. It will stumble and output an error message for each sub
    True encountered in the remote directory.


    Solving this problem is tricky because it''s difficult to ascertain the directory
    and file structure on the remote ftp server. One possible solution would to have
    the script execute a dir command on the remote directory, step through the output
    results to ascertain which of the remote matches a file and which is a subdirect,
    download all the files to the current local directory, and make necessary subdirectories
    within the local directory, and then, one by one, step into each local subdirect
    and invoke ftpsyncdown.


    As with the suggested solution to simulate a similar directory in Script #81,
    if you have nctfp you will find it has built-in support for recursive get commands.
    Rewriting this script to utilize that nctfp capability makes a lot more sense
    than continuing to struggle with the more primitive ftp command.


    For a brief note on when to rewrite shell scripts in a "real" programming language,
    see the "Hacking the Script" section in Script #81.


    # #83 Synchronizing Files with SFTP


    While the ftp program is quite widely available, it''s really something you should
    avoid like plague. There are two reasons for this: First, ftp servers are notorious
    for being buggy and having security holes, and second, and much more problematic,
    ftp transfers all data between the server and client in the clear. This means
    that when you transfer files to your server, account name and password are sent
    without any encryption, making it relatively trivial for someone with a packet
    sniffer to get this vital information. That''s bad.


    Instead, all modern servers should support the considerably more secure ssh (secure
    shell) package, a login and file transfer that supports end-to-end encryption.
    The file transfer element of the encrypted transfer is sftp, and its even more
    primitive than ftp, but we can rewrite fpsync with sftp, as shown in this script.


    > **NOTE Downloading an ssh package**nIf you don''t have ssh on your system, complain
    to your vendor and administrative team. There''s no excuse. You can also obtain
    the package and install it yourself by starting at http://www.openssh.com/


    # The Code


    ```

    #!/bin/sh


    # fpsync - Given a target directory on an sftp server, makes sure that

    # all new or modified files are uploaded to the remote system. Uses

    # a timestamp file ingeniously called .timestamp to keep track.

    ```'
