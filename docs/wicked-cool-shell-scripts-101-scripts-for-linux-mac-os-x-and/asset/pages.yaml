    \ a signal to send to the process,\n# -u user to specify the user, -t tty to specify\
    \ a tty,\n# and -n to only report what is done, rather than doing it.\n\n```\n\
    signal=\"-INT\" # default signal\nuser=\"\" tty=\"=0\n```\n\n```\nwhile getopts\
    \ $opt do\ncase $opt in\n  # Note the trick below: kill wants -SIGNAL but we're\
    \ asking\n  # FOR SIGNAL so we slip the '-' in part of the assignment\n  s) signal=\"\
    $OPTARG\"\n  u) if [ ! -z \"$tty\" ]; then\n    echo \"0: error: -u and -t are\
