    # #43 Implementing a Secure Locate


    The locate script presented as Script #19 is useful but a search problem: if the
    build process is run as root, it builds a list of all files and directories on
    the entire system, regardless of owner, allowing users to see directories and
    filenames that they wouldn''t otherwise have permission to access. The build process
    can be run as a generic user (Mac OS X does, running locateddb as user nobody),
    but that''s not right, because as a user I want to locate file matches in any
    directory tree, regardless of whether user विडियो can see.


    One way to solve this dilemma is to increase the locate-base that each entry has
    an owner, and permissions string attached, but then the locateddb itself remains
    unless the locate script is run as a setuid or setgid script, and that''s something
    to be avoided at all cost.


    A compromise is to have a separate locate for each user. It''s not quite that
    bad, because a personal database file is needed only for users who use the locate
    command. Once invoked, the system creates a .locateddb file in the user''s home
    directory, and a cron job can update .locateddb files nightly to keep them in
    sync. The very first time someone runs the locate script, it outputs a warning
    that they may only see matches for files that are publicly accessible. Starting
    the next day (depending on the cron schedule) the users get their personalized
    results.'
