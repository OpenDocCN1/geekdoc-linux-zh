  md: "# #26 Shpell: An Interactive Spell-Checking Facility\n\nChecking the spelling\
    \ of something word is useful, but more commonly you'll want to check all of the\
    \ words in a file en masse. You can do that with ispell, if you've installed it,\
    \ but ispell has an interface that some people find baffling. If you don't have\
    \ ispell, many of the rudimentary spellchecking packages don't offer much sophistication\
    \ than \"Is this word right? functionality. Therefore, in either case, an alternative\
    \ approach to checking and fixing all of the spelling errors throughout a file\
    \ might be just what you need, and it's easily accomplished with this shell script.\n\
    \n# ## Code\n\n```\n#!/bin/sh\n\n# sphell - An interactive spell-checking program\
    \ that lets you step\n# through all known spelling errors in a document, indicate\
    \ which\n# ones'd like to fix and how, and apply the changes to the file\n# The\
    \ original version of the file is saved with a .shp suffix,\n# and the new version\
    \ replaces the old.\n\n# Note that you need a standard 'spell' command for this\
    \ to work,\n# which might involve installing ispell, ispell, or sphell on your\
    \ system.\n\ntempfile=\"tmp/$0.\\$\\$\"\nchangerequests=\"tmp/$0.\\$\\$.sed\"\n\
    spell=\"-l1\"      # modify as needed for your own spell\n\ntrap \"rm -f $tempfile\
    \ $changerequests\" EXIT HUP INT QIT TERM\n\n# Include the ansi color sequence\
    \ definitions\n\nscript-library.sh\ninitializeANSI\n\ngetfix()\n  # Asks the user\
    \ to specify a correction. If the user enters a replacement word\n# that's also\
    \ misspelled, the function calls itself, which is a level 2 nesting.\n# This can\
    \ go as deep as the user might need, but keeping track of nesting\n# us to ensure\
    \ that only level 1 outputs the \"replacing word\" message.\n\n  word=$1\n  filename=$2\n\
    \  misspelled=1\n\n  while [ $misspelled -eq 1 ];\n    echo \"\"; echo \"$(bold)Misspelled\
    \ word $(word):$(boldoff)\"\n```"
