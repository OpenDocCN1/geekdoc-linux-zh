    # #78 Reporting Broken External Links


    This script partner for Script #77, Identifying Broken Internal Links, utilizes
    the

    -versal option of lynx to generate and test a set of external links —

    other websites. When run as a traversal of it, lynx produces a number of data

    files, one of which is reject.dat. The reject.dat file contains a list of all

    external links, both website links andmailto: By iteratively trying to access

    each http link in reject.dat, you can quickly ascertain which sites work and which

    sites fail to resolve, which is exactly what this script describes.


    # The Code


    ```

    #!/bin/sh


    # checkexternal - Traverses all internal URLs on a website to build a

    # list of external references, checks each one to ascertain

    # might be dead or otherwise broken. The -a flag forces the

    # script to list all matches, whether they''re accessible or not:

    # default only unreachable links are shown.


    x=/usr/local/bin/lynx      # might need to be tweaked

    listall=0; errors=0          # shortcut: two vars on one line!


    if [ "$1" = "-a" ]; then

    listall-1; shift

    fi


    outfile="$(echo "$1" | cut -d/ -f3).external-errors"

    /bin/rm -f output             # clean it for new output


    trap "/bin/rm -f traverse*.errors reject*.dat traverse*.dat" 0


    if [ -z "$1" ]; then

    echo "Usage: $(basename $0) [-a] URL" >&2

    exit 1

    fi


    # Create the data files needed

    lynx -traversal $1 > /dev/null;

    ```


