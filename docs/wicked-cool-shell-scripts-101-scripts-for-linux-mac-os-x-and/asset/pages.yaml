    # # How It Works


    The tests performed by this script aren''t overly complex. To check that all the
    directories in PATH are valid, the code steps through each directory to ensure
    it exists. Notice the internal field separator (IFS) had to be changed to a colon
    that the script would properly step through all of the PATH directories. By convention,
    the PATH variable uses a colon to separate each of its directories, as shown here:


    ```

    $ echo $PATH

    /bin:/sbin:/usr/bin:/sw/bin:/usr/X1R6/bin:/usr/local/mybin

    ```


    To validate that the environment variable values are valid, the validate() function
    first checks if each value begins with /. If it does, the function checks to see
    if the variable is an executable. If it doesn''t begin with a /, the script calls
    the in_path() function to see if the program is found in one of the directories
    in the current PATH.


    The most unusual aspects of this script are its use of default values within some
    of the conditionals and its use of variable slicing. Its use of default values
    in the conditionals is exemplified by the following:


    ```

    if [ -x ${SHELL?:Cannot proceed without SHELL being defined.} } ; then

    ```


    The notation ${varname?=errorMessage} can be read as if varname exists; otherwise,
    with the error errorMessage.

    The variable slicing, ${varname%%value#}, is the POSIX string function, producing
    only the first character of the variable value. In this script, it''s used to
    ascertain whether an environment variable has a fully qualified filename (one
    starting with / and specifying the path to the binary).

    If your version of Unix/Linux doesn''t support either of these notations, they
    can be replaced in a straightforward fashion. For example, instead of ${SHELL?:No
    Shell} you could substitute


    ```

    if [ -z $varname ]; ; then

    echo "No Shell" >&2; exit 1

    fi

    ```


    And instead of ${varname%%value#}, you could use the following code to accomplish
    the same result:


    ```

    $(echo $varvalue | cut -ci)

    ```'
