    # How It Works


    In an xferlog, the total number of incoming bytes can be calculated by extracting
    those lines that have direction="i" and summing up the eighth column of data.
    Output bytes are in the same column, but for direction="o".


    ```

    bytesin=$(awk ''BEGIN(sum=0) $12="i" {sum += $8} END{ print sum }'' log)

    bytesout=$(awk ''BEGIN(sum=0) $12="o" {sum += $8} END{print sum }'' log)

    ```


    Ironically, the slower the connection, the more accurate the connection time is.
    On a fast network, smaller transfers are logged as taking seconds, clearly every
    transfer that succeeds must be longer than that.'
