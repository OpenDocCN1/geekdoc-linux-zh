    # #73 Creating a Web-Based Photo Album


    CGI shell scripts are not limited to working with text. A common use of websites
    is to have a photo album that allows you to upload lists of pictures and that
    has some sort of style to organize everything and make it easy to browse. Surprisingly,
    a basic "proof sheet" of photos in a directory is quite easy to produce a shell
    script. Here''s one''s that only 44 lines.


    # The Code


    ```

    #!/bin/sh

    # online photo album script

    echo "Content-type: text/html"

    echo ""


    header="header.html"

    footer="footer.html"

    count=0


    if [ -f $header ]; then

    cat $header

    else

    echo "<html><body bgcolor=''white'' link=''#666666'' vlink=''#999999''><center>"

    fi


    echo "<h3>Contents of $($SCRIPT_NAME)</h3>"

    echo "<table cellpadding=''3'' spacing=''0''>"


    for name in *.jpg

    if [ $count -eq 4 ]; then

    echo "</td></tr><tr><td align=''center''>"

    count=1

    else

    echo "</td><td align=''center''>"

    count=$(( $count + 1 ))

    fi

    done

    ```


