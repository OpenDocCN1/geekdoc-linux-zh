  md: "taylor $ sllocate Taylor-Self-Assess.doc\n/Users/taylor/Documents/Merrick/Taylor-Self-Assess.doc\n\
    \n# Hacking the Script\n\nIf you have a large file system, it's possible that\
    \ this approach will consume a nontrivial amount of space. One way to address\
    \ this issue would be to make sure that individual .sloc database files contain\
    \ entries for files that appear in the central public database. This requires\
    \ a bit more processing up front (sort sort, and then use diff), but it could\
    \ pay off in terms of saved space.\n\nAnother technique aimed at saving space\
    \ would be to build the individual .slocate files with references only to files\
    \ that have been accessed since the last update. Versions of this would work better\
    \ if the slocate script was run weekly than daily; otherwise each Monday all users\
    \ would be back to zero because they're unlikely to run the slocate command over\
    \ the weekend.\n\nFinally, another easy way to save space is to keep the .slocate\
    \ files compressed and uncompress them on the fly when they are searched with\
    \ slocate. See the zgrep command in Script #37 for inspiration regarding how this\
    \ technique might be utilized.\n\n# 44 Adding Users to the System\n\nIf you're\
    \ responsible for managing a network of Unix or Linux systems, you've already\
    \ experienced the frustration caused by subtle incompatibilities among the different\
    \ operating systems in your domain. Some of the most basic tasks prove to be the\
    \ most incompatible across different flavors of Unix, and chief among tasks is\
    \ user account management. Rather than a single command-line interface that is\
    \ 100 percent consistent across all Unix flavors, each vendor has developed its\
    \ own graphical interface for working with the peculiarities and quirks of its\
    \ own.\n\nThe Simple Network Management Protocol (SNMP) was, ostensibly, supposed\
    \ to help normalize this sort of thing, but managing user accounts is difficult\
    \ as it was a decade ago, particularly in a heterogeneous computing environment.\
    \ As a result, a very helpful set of scripts for a system administrator includes\
    \ a version of adder, deleter, and suspender that can be customized for your specific\
    \ needs and then easily ported to all Unix systems.\n\n> Mac OS X is the old OS!\n\
    \ OS X is an exception to this rule, with its reliance on an account database\
    \ called NetInfo. Versions of these tools for Mac OS X are presented in Chapter\
    \ 11.\n\nOn a Unix system, an account is created by adding a unique entry to the\
    \ /etc/passwd file, an entry consisting of a one-to-eight character account name,\
    \ a unique user ID, a group ID, a home directory, and a login shell for user.\
    \ Modern Unix systems store the encrypted password value in /etc/shadow, so an\
