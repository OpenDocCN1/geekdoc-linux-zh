  md: "# #33 Wrapping Only Long Lines\n\nOne limitation of the fmt command and its\
    \ shell script equivalent, Script #14, is that they wrap and fill everything they\
    \ encounter, whether it makes sense to do so or not. This can mess up email (wrapping\
    \ your .signature is not good, for example) and many other input file formats.\n\
    \nWhat if you have a document in which to wrap the long lines but leave everything\
