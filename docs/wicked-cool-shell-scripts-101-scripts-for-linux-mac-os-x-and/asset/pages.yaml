  md: 'This script is also more useful when invoked from a cron job on a daily or
    weekly basis. I have similar scripts that run every night and send me updated
    pages from various sites that I like to track. It saves lots of time-wasting surfing!

    Most interesting of the possible hacks is to modify this script to work off a
    data file of URLs and email addresses, rather than requiring those as input parameters.
    Drop that modified version of the script into a cron job, write a web-based front
    end to the utility, and you''ve just duplicated a function that some companies
    charge people money to use on the Web. No kidding.


    # NOTE Another way to track changes


    There''s another way to track web page changes that''s worth a brief mention:
    RSS. Known as Really Simple Syndication, RSS-enabled web pages have an XML version
    of the site that makes tracking changes trivial, and there are a number of excellent
    RSS trackers for Windows, Mac, and Linux/Unix. A good place to start learning
    about RSS is http://rss.intuitive.com/. The vast majority of sites aren''t RSS
    enabled, but it''s darn and worth keeping an eye on!'
