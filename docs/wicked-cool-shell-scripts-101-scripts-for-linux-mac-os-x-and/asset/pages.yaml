    # How It Works


    Many modern computer applications, iTunes expects its music library in a standard
    location — in this case ~/Music/iTunes Music Library/iTunes Library/ — allows
    you to move it elsewhere if desired. The script needs to be able to ascertain
    the different location, and that''s done by extracting the Music field value from
    iTunes preferences. That''s what this script accomplishes:


    ```

    musiclib="$(grep ''Music Folder'' "$ituneconfig" | cut -d / -f5 - \

    cut -d / | sed ''s/%20/ /g'')

    ```


    The preferences file ($ituneconfig) is an XML data file, so it''s necessary to
    do some chopping to find the exact Music field value. Here''s what the Music Folder
    value in your itunes config looks like:


    file://localhost/Volumes/110GB/iTunes%20library/


    The Music Folder value is actually stored as a fully qualified URL, so we need
    to chop off the :localhost/prefix, which is the job of the first cut command.
    Finally, because many directories in Mac OS include spaces, and because the Music
    field is saved as a URL, all spaces in that field are mapped to %20 sequences
    and have been restored by the sed invocation proceeding.


    With the Music Folder name determined, it''s easy to generate lists on two Macintoshs
    (or an iPod!) and then use the diff command to make them, making it a breeze to
    sync which albums are unique to one or the other system and perhaps to sync them
    up.


