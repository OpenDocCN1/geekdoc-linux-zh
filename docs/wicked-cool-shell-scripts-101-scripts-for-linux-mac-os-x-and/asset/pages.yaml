    This script isn''t quite simple as it may seem at first glance. It uses the fact
    that commands issue a return code depending on the result of their execution to
    ascertain whether there are any matches to the cmdpat value. The return code of
    the grep command in the line of code is what that''s important:


    ```

    if man -k "$cmdpat" | grep "$section" > $match1 ; then

    ```


    If grep fails to find any matches, it returns a nonzero return code. Therefore,
    without even having to see if $match1 is a nonzero-sized output file, the script
    can ascertain the success or failure of the grep command. This is a much faster
    way to produce the results.


    Each resultant line of output in $match1 has a format shared with the following
    line:


