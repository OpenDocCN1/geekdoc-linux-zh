  md: '# How It Works


    The first chunk of code, the if [$ -eq q] conditional block, executes no arguments
    are specified, displaying the contents of the deleted files archive. However,
    there''s a catch. We can''t display the actual filenames because we don''t want
    the user to see the timestamp used internally to guarantee unique filenames. In
    order to display this data in a more readable format, the sed statement deletes
    the first five occurrences of digit digit in the ls output.


    If an argument is specified, it is the name of a file or directory to recover.
    The next step is to ascertain how many matches are there for the name specified.
    This is done with the following statement:


    ```

    matches="$(ls "$1" 2>/dev/null | wc -l)"

    ```


    The unusual use of quotes in the argument to ls ensures that this pattern will
    match filenames that have embedded spaces, the ''*'' wildcard pattern is expanded
    properly by the shell. The 2>/dev/null ensures any error resulting from the command
    is discarded rather than shown to the user. The error being discarded is most
    likely No such file or directory, caused when no match for the specified filename
    is found.


    If there are multiple matches for the file or directory specified, the most complex
    part of this script, the if [$matches -gt 1] block, executed, displaying all the
    results. Using the -t flag to the command in the main loop catches the files to
    be present from newest to oldest, and a succinct to the awk command translates
    the date/time stamp of a filename into the deleted date and time information in
    the parentheses. The inclusion of the -k flag to ls in the size calculation allows
    the file sizes to be represented in kilobytes:


    ```

    size="$(ls -sdk name | awk ''{print $1}'')

    ```


    Rather than displaying the size of matching directory entries, which would be
    meaningless, the script displays the number of files within each matching directory.
    The number of entries within a directory is actually quite easy to calculate,
    and we chop the leading spaces out of the wc command output, as:


    ```

    size="$(ls name | wc -l | sed ''s/[^[:digit:]]//g'')")

    ```


    Once the user specifies one of the possible files or directories, the corresponding
    exact filename is identified by the following statement:


    ```

    restore="$(ls -tdi "$1" | sed -n ''${${desired}p''")

    ```


    This statement contains a slightly different use of sed. Specifying the -n flag
    and then a number (${desired}) followed by the p print command is a very fast
    way to extract only the specified line number from the input stream.'
