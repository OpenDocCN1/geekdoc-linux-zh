    \ $pid\n```\n\n# How It Works\n\nThis script borrows liberally from the earlier\
    \ Script #52, Killing Processes by Name, which does a similar mapping of process\
    \ name to process ID, but then kills the jobs, rather than lowering their priority.\n\
    In this situation, you don't want to accidentally renice a matching of processes\
    \ (renicename -n 10 \"*\", so the script fails if more than one process matches\
    \ the criteria. Otherwise, it makes the change specified and lets the actual renice\
    \ program report any errors that may have been encountered.\n\n# Running the Script\n\
    \nYou have a number of different options when running this script: -n val you\
    \ to specify the desired nice (job priority) value. The default is specified nice=1.\
    \ The -u user flag allows matching processes to be limited by user, while -t tty\
