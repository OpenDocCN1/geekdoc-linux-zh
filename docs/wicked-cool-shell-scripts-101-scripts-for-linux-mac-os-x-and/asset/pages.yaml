  md: '# How It Works


    For a full system backup, the pax command does all the work, piping its output
    to a compression program (bzip2 by default) and then to an output file or device.
    An incremental backup is a bit more tricky because the standard version of tar
    doesn''t include any sort of modification time, unlike the GNU version of tar.
    The list of files modified since the previous backup is built with find and saved
    in the inclist temporary file. That file, emulating the tar format for increased
    portability, is then fed to pax directly.


    Choosing when to mark the timestamp for a backup is an area in which many backup
    programs messed up, typically marking the “last backup time” when the program
    has finished the backup, rather than when it started. Setting the timestamp to
    the time of backup completion can be a problem if any files are modified during
    the backup process (which can take quite while if the backup is being fed to a
    tape device). Because files modified under this scenario would have a last-modified
    date older than the timestamp date, they would not be backed up the next.


    However, timestamping before the backup takes is wrong too, because of these problems
    are avoided by saving the date and time before the backup starts (in the timestamp
    variable), but applying the value of $timestamp to $tsfile using the -t flag to
    touch only after the backup has succeeded.


    # Running the Script


    This script has a number of options, all of which can be ignored to perform the
    default incremental backup based on the timestamp for the last incremental backup.
    The flags allow you to specify a different output file or device (-o output),
    to choose a full backup (-f), to actively choose an incremental backup (-i), or
    to prevent the timestamp file from being updated in the case of an incremental
    backup (-n).


    # The Results


    $ backup

    Doing incremental backup, saving output to /tmp/backup.140703.bz2


    As you would expect, the output of a backup program isn’t very scintillating.
    But the resulting compressed file is sufficiently large to show plenty of data
    within:


    ```

    $ ls -l /tmp/backup*

    -rw-r--r-- 1 taylor wheel 61739008 Jul 14 07:31 backup.140703.bz2

    ```'
