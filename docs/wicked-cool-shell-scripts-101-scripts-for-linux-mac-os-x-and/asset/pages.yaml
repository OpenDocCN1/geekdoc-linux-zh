  md: '# INTRODUCTION


    ![](img/a236915495daab651d7c2cc28becf416_19_0.png)


    If you’ve used Unix for any length of time, you’ve probably found yourself starting
    to push the envelope, tweak how things work, change the default flags for commands
    you use a lot, and even create rudimentary shell scripts that automate simple
    tasks in a coherent fashion. Even if all you’ve done is to create an alias or
    two, you’ve taken the first step on the road to being a shell script hacker extraordinaire,
    as you’ll soon see.


    I’ve been using Unix for more years than I want to think about, and it’s a great
    OS, especially because I can tweak, tune, and hack it. From simply automating
    common tasks to creating sophisticated, user-friendly versions of existing Unix
    commands, and creating brand-new utilities that serve a useful purpose, I’ve been
    creating spiffo little shell scripts for quite a while.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'This book is about making Unix a friendlier, more powerful, and more personal
    computing environment by exploiting the remarkable power and capabilities of the
    shell. Without writing a single line of C or C++, without invoking a single compiler
    and loader, and without having to take any classes in program design and methodology,
    you will learn to write dozens of wicked shell scripts, ranging from an interactive
    calculator to a stock ticker monitor, and a set of scripts that make analyzing
    Apache log files a breeze.


    # This Book Is For You . . .


    As with any technical book, an important question for Wicked Shell Scripts is
    whether this book is for you. While it''s certainly not a primer on how to use
    the Unix, Linux, or Mac OS shell to automate tasks, and it doesn''t list all the
    possible conditions that you can utilize with the test command, this book should
    nonetheless be engaging, exciting, and stimulating for anyone who has ever delved
    into the murky world of shell scripting. If you want to learn how to write a script,
    there are less of great references online. But all have one thing in common: They
    offer dull, and uninteresting examples. Instead, this book is intended to be a
    cookbook, a sort of "best of hacksendium that shows the full and remarkable range
    of tasks that can be accomplished with some savvy script programming. With lengths
    ranging from a few dozen to a hundred or more, the scripts in this book should
    not just prove useful, but will inspire you to experiment and create your own
    shell scripts too. And if that sounds interesting, this book is definitely for
    you.


    # What Is a Shell Script, Anyway?


    Time (was years ago) when hacking was considered a positive thing. Hackers were
    people on the cutting edge of computer use, experimenting and trying novel and
    unusual solutions to solve problems. These were people who changed the way the
    rest of us viewed computers and computing.


    But as the public network became more pervasive, a subset of these hackers started
    to migrate to remote system break-ins, with a zeal that overwhelmed the rest of
    us. Nowadays, many consider having a bad thing as, in "hacking into the secure
    Department of Energy database." However, I like to think of hacking as being a
    more benign, intellectually engaging, and considerably less criminal enterprise,
    more akin to the wonderful praise a computer aficionado offer with the compliment
    "Cool hack!


    This book is about cool shell hacks.


    # Which Shell?


    There are at least a dozen Unix shells floating around, but they''re all based
    on two major flavors: Bourne Shell (sh) and C Shell (csh). The most important
    shells in Unix and Linux world are the Bourne Shell, C Shell, Korn Shell (a descendant
    of C Shell), and Bourne Again Shell (bash).'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The original command shell of note is the Bourne Shell, written by Steven Bourne
    at AT&T Bell Labs in the early days of Unix. It''s probably still on Unix box
    as /bin/sh, and while it''s not sexy, its syntax may be a bit odd, it''s a simple
    and powerful scripting environment so commonly across Unixes that it''s the lingua
    franca of the scripting world.


    The Free Software Foundation''s open source reimplementation of the Bourne Shell
    goes by the name of bash, the Bourne Again Shell. It is a lot more than just a
    reimplementation of a 20-year-old command shell; however it''s a great scripting
    environment and a highly interactive user shell. On many Linux systems, /bin/sh
    is actually a hard link to bash.


    And then there is the C Shell, UC Berkeley''s most important innovation in the
    realm of shell scripting. The C replaced the odd Bourne Shell with a command syntax
    that looks more like its native language, C.


    As many facets of Unix, passions are among the three predominant camps: Bourne
    Shell, Korn Shell, and C Shell. But it is not equal. Consider the well-known article
    "C Programming Considered Harmful!" whose author, Tom Christiansen, points out,
    correctly:


    I am constantly shocked and dismayed to see people test cases, install scripts,
    and other random hacking using the csh. Lack of proficiency in the Bourne Shell
    has been known to cause errors in /etc/rc and .csh files, because you must write
    these files in that language.


    The csh is seductive the conditionals are C-like, so the path of least resistance
    is chosen and a csh script is written. Sadly, this is a loss, and the programmer
    even realizes it, even when they find that many simple things they wish to do
    range cumbersome to impossible in the csh.


    I agree wholeheartedly with Tom, and hence in this book we will exhaust the use
    of C Shell. If you''re a strong advocate of the C Shell, you should find it easy
    to rewrite almost all of the scripts in this book to fit your. Similarly, many
    people are advocates of the Korn Shell, which has a terrific interactive command
    line but, I feel, is less capable as a scripting environment.


    When evaluating a shell, both its interactive capabilities (such as aliases, command-line
    history, the on-the-fly corrections, helpful error messages) and its scripting
    capabilities. This book focuses on the scripting side of things, and so the scripts
    presented here are Bourne Shell scripts (with an occasional sprinkling of bash
    or POSIX shell tweaks for entertainment value) and should just fine on any Unix
    you may have.


    # The Solaris Factor


    If you''re working on a Solaris system, you''ve got a bit of a problem, but not
    one that can''t be solved. The scripts in this book are all written against the
    POSIX 1003 standard for the Bourne Shell, which includes functions, variable slicing,


    +   1 Online at http://www.facts.org/faqs/unix-faq/shell/csh-what/


    No Starch Press, Copyright © 2004 by Dave Taylor 3'
