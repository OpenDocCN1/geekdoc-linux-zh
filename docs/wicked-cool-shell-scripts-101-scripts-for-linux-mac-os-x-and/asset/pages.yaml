    # #56 Managing Backups


    Managing system backups is a task that all system administrators are familiar
    with, and it''s something nobody thanks unless something goes horribly wrong.
    Even on a single-user personal computer running Linux, some sort of backup schedule
    is essential, and it''s usually after you''ve been burned once, losing a chunk
    of data and files, that you realize the value of a regular backup.


    One of the reasons so many systems neglect backups is that many of the backup
    tools are crude and difficult to understand. The dump and restore commands (called
    dump in Solaris) are typical, with five "dump levels" and an intimidating configuration
    required.


    A shell script can solve this problem. This script backs a specified set of directories,
    each incrementally (that is, only those files that have changed since the last
    backup) or full backup (all files). The backup is compressed on the fly to minimize
    space usage, and the script output can be directed to a file, a tape device, a
    remotely mounted NFS partition, or even a CD burner on compatible systems.


    # The Code


    ```

    #!/bin/sh


    # backup - Creates either a full or incremental backup of a set of

    # defined directories on the system. By default

    ```


    ```

    usage() {

    {

    cat << "EOF" >>$2

    Usage: $0 [-o output] [-i-f] [-n]

    -o lets you specify an alternative backup file/device

    -i is an incremental or -f is a full backup, and -n prevents

    updating the timestamp if an incremental backup is done.

    ```'
