    # THE MISSING

    CODE LIBRARY


    ![](img/a236915495daab651d7c2cc28becf416_27_1.png)


    Unix’s greatest strength is that it lets you create new commands by combining
    old ones in unique and novel ways. However, although Unix includes hundreds of
    ways to combine them, you will still encounter situations in which nothing does
    the job quite right. This chapter focuses on scripts that allow you to create
    smarter and more sophisticated programs within the constraints of shell scripts.


    There’s a secret that we should address up front: The shell programming environment
    isn’t as sophisticated as a real programming environment. Perl, Python, and even
    C have structures and libraries that offer extended capabilities, but shell scripts
    are more of a “roll your own” world. The scripts in this chapter will help you
    make your way in that world. They’ll serve as a set of tools that let you write
    better, smarter, more sophisticated scripts later in the book.'
