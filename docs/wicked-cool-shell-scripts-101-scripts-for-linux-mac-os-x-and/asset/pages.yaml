    # How It Works


    Although this script looks complex, it''s not. It''s easier to see this if we
    consider each block as a separate little script. For example, the first few lines
    extract the firstdate and lastdate by simply grabbing the fourth field of the
    first and last lines of the file. The number of hits is calculated by counting
    lines in the file (using wc) for raw text files (that is, with .gif, .jpg, .png,
    or .txt as their extension). Total bytes transferred is calculated by summing
    the value of each field in each line and then invoking nnumber to present it attract.

    The most popular pages can be calculated by extracting the pages requested from
    the log file; excluding any image files; sorting; uniq to calculate the number
    of occurrences of each unique line; and finally sorting one time to ensure that
    the most common occurring lines are presented first. In the code, it looks like:


    ```

    awk ''print $7'' ''$$1'' | grep -iE ''(.gif|.jpg|.png)'' | \\

    sed s/\\\\\\//g | sort | \\

    uniq -c | sort -rn | head -10

    ```


    Notice that we normalize each little bit: The sed invocation strips out any trailing
    slash, to ensure that /subdir/ and /subdir are counted as the same request.'
