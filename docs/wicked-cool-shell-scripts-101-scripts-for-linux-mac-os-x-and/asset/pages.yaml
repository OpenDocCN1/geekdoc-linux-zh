    values being substituted. The script can bulk-translate all URL encodings, also
    called escape sequences, and it''s useful to ensure that encodings, including
    for <, and >, are not translated. Security, dontcha — a nice way to sidestep people
    who are trying to sneak unauthorized HTML into your guestbook display.


