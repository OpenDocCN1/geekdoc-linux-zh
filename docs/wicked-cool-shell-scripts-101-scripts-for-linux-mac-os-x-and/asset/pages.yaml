  md: '# #88 Mirroring a Website


    Large, busy websites like Yahoo! operate a number of mirrors, separate servers
    that are functionally identical to the main site but are running on different
    hardware. While it''s unlikely that you can duplicate all of their fancy setup,
    the basic mirroring of a website isn''t too difficult with a shell script or two.


    The first step is to automatically pack up, compress, and transfer a snapshot
    of the master website to the mirror server. This is easily done with the remoteback
    script shown in Script #7, invoked by nightly cron.


    Instead of sending the archive to your own mail address, however, send it to a
    special address named unpacker, then add a sendmail alias in /etc/aliases (or
    the equivalent in mail transport agents) that points to the unpacker script given
    here, which then unpacks and unlocks the archive:


    ```

    unpacker="home/taylor/bin/archive-unpacker"

    ```


    You''ll want to ensure that the script is executable and sensitive to what applications
    are in the default PATH used by sendmail: The /var/log/messages log should reveal
    whether there are any problems invoking the script as you debug.


    # ## The Code


    ```

    #!/bin/sh


    # unpacker - Given an input stream with a uencoded archive from

    # the remotearchive script, unpacks and unlocks the archive.


    temp="tmp/$(basename $0).$"

    home="$HOME:/usr/home/taylor"

    mydir="home/archive"

    webhome="/usr/home/taylor/web"

    notify="taylor@intuitive.com"


    (cat - > $temp $temp | cut -d - -f2)


    target="$(grep "Subject: " $temp | cut -d -f2")


    echo ($base): Saved as $temp, with $(wc -l < $temp) lines

    echo "message subject=\\$target\""


    # Move into the temporary unpacking directory...


    if [ -d $mydir ]; then

    echo "Warning: archive dir $mydir not found. Unpacking into $home"

    cd $home

    mydir=$home

    # for later use

    else

    cd $mydir

    fi

    ```'
