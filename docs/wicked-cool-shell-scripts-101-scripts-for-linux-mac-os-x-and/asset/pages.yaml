  md: '# How It Works


    When run, if the exchange database .exchangerate is more than 12 hours out-of-date,
    the first script, getexchange, grabs the latest exchange rate information from
    the CNN site, extracts the exchange rates for the major currencies specified in
    the script, and then saves them in a currency=value format. Here is how the .exchangerate
    file appears after the script is run:


    ```

    $ cat /tmp/.exchangerate

    cada=0.747100

    euro=1.173303

    japan=0.009163

    uk=1.664400

    ```


    The second script, exexchange, is rather long and relies on Script #9, scriptbc,
    for all of the mathematics involved. The basic algorithm of the script is to normalize
    the currency value specified in the command arguments to U.S. dollars by fulfilling
    the specified value by the appropriate exchange rate, and then to use the relationship
    between the U.S. dollar and each foreign currency to calculate the equivalent
    value in each currency.

    From speaking point of view, note particularly how exexchange incorporates the
    exchange rate values from the .exchangerate data file:


    +   $exchranefile


    This is known as sourcing a file, and it causes the specified file (script) to
    be read as if its contents were part of this script. This will make more sense
    if we contrast with the result of the following line:


    ```

    sh $exchranefile

    ```


    This does exactly the wrong thing: it spawns a subshell, sets the exchange rate
    variables within that subshell, and then quits the subshell, leaving the calling
    script without access to the values for these variables.


    # Running the Script


    This pair of scripts is typical of sophisticated Unix interaction, with getexchange
    being the one "admin" script doing the necessary back-end work to ensure that
    the exchange rate is correct and up-to-date, and exchange being the "user" script
    that has all the proper bells and whistles but doesn''t touch the Internet at.

    Although the getexchange script can run as frequently as desired, it actually
    gets and updates the currency exchange rates only if $exchranefile is more than
    24 hours old (Wait, let me re-read: it actually gets and updates the currency
    exchange rates only if $exchranefile is more than 12 hours old). This lends itself
    to being a daily cron job, perhaps just during weekdays (the currency markets
    aren''t open on weekends, so the rates don''t fluctuate from Friday evening to
    Monday morning).'
