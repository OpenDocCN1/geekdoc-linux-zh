    With one small addition to your .zshrc or .bashrc (depending on what login shell
    you have), you can automatically have the Terminal window title show your current
    working directory. To use this to show your current working directory, for example,
    you can use either of the following:


    | alias precmd "titleterm $PWD" | [tcsh] |


    | export PROMPT_COMMAND="titleterm\$PWD" | [bash] |


    If you run either the tcsh shell (the default login shell for 10.2.x) or the bash
    shell (the default for 10.3.x, the so-called Panther of Mac OS X), you can drop
    one of the commands into your .zshrc or .bashrc, and starting the next time you
    open a Terminal window, you will find that your window title changes each time
    you move into a new directory!


