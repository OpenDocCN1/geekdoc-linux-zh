    utilities, and daemons log events to system log files. Even on a computer with
    lots of disk space, it''s important to keep an eye on the size of these files
    and, of course, their contents to.

    As a result, most sysadmins have a set of instructions that they place at the
    top of their log analysis utilities, similar to the following:


    ```

    mv $log.2 $log.3

    mv $log.1 $log.2

    mv $log $log.1

    touch $log

    ```'
