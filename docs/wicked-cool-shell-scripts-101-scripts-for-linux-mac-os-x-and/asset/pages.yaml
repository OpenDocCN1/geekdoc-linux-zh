    # #48 Cleaning Up Guests Leave


    Many users disable the guest user for security reasons, others do have a guest
    account (often with a trivially guessable password) to allow people from other
    departments to access the network. It''s a useful account, but there''s one big
    problem: With multiple people sharing the same account, it is uncommon for someone
    to experiment with commands, edit .rc files, subdirectories, and so forth, thereby
    leaving things messed up for the next user.

    This script addresses the problem by cleaning up the account space each time user
    logs out from the guest account, deleting any files or subdirectories created,
    removing all dot files, and then rebuilding the official account files, copies
    of which are stored in a read-only archive tucked into the guest account in ..template
    directory.


    # The Code


    ```

    #!/bin/sh


    # fixguest - Cleans up the guest account during the logout process.


    # Don''t trust environment variables: reference read-only sources


    iam=$(whoami)

    myhome="$(grep "^$iam:" /etc/passwd | cut -d: -f6)


    # *** Do Not run this script on a regular user account!


    if [ "$iam" = "guest" ]; then

    echo "Error: you don''t want to run fixguest on this account.">&2

    exit 1

    fi


    if [ ! -d $myhome..template ]; then

    echo "$0: no template directory found for rebuilding.">&2

    exit 1

    fi

    ```'
