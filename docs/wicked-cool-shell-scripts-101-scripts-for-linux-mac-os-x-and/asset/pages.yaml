  md: '# How It Works


    This succinct script offers two different command flags, -w to specify that lines
    should be wrapped when their width exceeds X characters (the default is 72) and
    -h to enable hyphenation, filling the lines more and improving the final results.
    Notice the test to check for starting flags: A loop getsopts to step through the
    options, then uses shift ${(OPTIND - 1)} to throw all arguments away once they''ve
    been processed.


    The other, far more important technique demonstrated is the use of a here document
    to feed multiple lines of input to a command. The old double-input-redirect sequence
    noff allows you to have a here document, sequence of the script that''s treated
    as if it were typed on an command line. Using the here document, the script outputs
    all of the necessary noff commands and calls the cat command with the requested
    filename or filenames. The cat command''s output is then fed directly to noff.
    This is a technique that will appear frequently in the scripts presented in this
    book, and it''s one well worth experimenting with!


