  md: '# How It Works


    To avoid any problems with things changing underfoot, notice that the very first
    task that deleteer performs is to suspend the user account by calling suspender.


    Before modifying the password file, this script locks the lockfile program, if
    it''s available. If not, it drops back to a relatively primitive mechanism through
    the creation of the file /etc/passwd.lock. If the lock file already exists, this
    script will sit and wait for it to be deleted by another program; once it''s gone,
    deleteer immediately creates it and proceeds.


    # Running the Code


    This script must be run as root (use sudo) and needs the name of the account to
    delete as the command argument.


    > Danger!

    Notice that this script is irreversible and causes lots of files to vanish, so
    be careful if you want to experiment with it!


    # The Results


    ```

    $ sudo deleteuser snowy

    Change account snowy password to something new.

    Changing password for user snowy.

    New password:

    Retype new password:

    passwd: all authentication tokens updated successfully.

    Account snowy has been suspended.

    Files still left to remove (if any):

    /var/log/dogbone.avi

    ```


    Account snowy (uid 502) has been deleted, and their home directory (/home/snowy)
    has been removed.


    That dreary snowy had hidden an AVI file (dogbone.avi) in /var/log. Lucky that
    we noticed — who knows what it could be?


    # Hacking the Script


    This deleteuser script is deliberately not complete. Sysadmins will decide what
    additional steps to take, whether it is compressing and archiving a final copy
    of the account files, writing them to tape, burning them on a CD-ROM, or mailing
    them directly to the FBI (hopefully I''m just kidding on that one). In addition,
    the account needs to be removed from the /etc/group files. If there are stray
    files outside of the user''s home directory, the find command identifies them,
    but it''s still up to the admin to examine and delete each one, as appropriate.'
