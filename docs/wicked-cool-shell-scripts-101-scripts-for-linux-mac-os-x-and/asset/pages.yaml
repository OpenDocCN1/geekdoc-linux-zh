    # #70 Logging Web Events


    A cool use of a shell-based CGI script is to log events using a wrapper. Suppose
    that I''d like to have a Yahoo! search box on my web page, but rather than feed
    the queries directly to Yahoo!, I''d like to log them, to build up a database
    of what people see from my site.


    First off, of HTML and CGI: Input boxes on web pages are created inside forms,
    and forms have user information to be processed by sending the value of the form''s
    action attribute. The Yahoo! query box on any web page can be reduced to the following:


    ```

    <form method="get" action="http://search.yahoo.com/bin/search">

    Search Yahoo:

    <input type="text" name="p">

    ```


    No Starch Press, Copyright © 2004 by Dave Taylor'
  merge: -1
  pgno: 223
- img_proc: true
  md: '```

    <input type="submit" value="search">

    </form>

    ```


    However, rather than hand the search pattern directly to Yahoo!, we want to feed
    it a script on our own server, which will log the pattern and redirect the query
    along with the Yahoo! server. The form before changes in only one small regard:
    The action field becomes a local script rather than a direct call to Yahoo!


    ```

    <!-- Tweak action value if script is placed in /cgi-bin/ or other --

    <form method="get" action="log-yahoo-search.cgi">

    ```


    The log-yahoo-search.cgi script is remarkably simple, as you will see.


    # The Code


    ```

    #/bin/sh

    ```


    ```

    # log-yahoo-search - Given a search request, logs the pattern, then

    # feeds the sequence to the real Yahoo! search system.

    ```


    ```

    # Make sure the directory path and file listed as ''logfile'' are writable by

    # user nobody, or whatever user you have as your web server uid.

    logfile=/var/www/wicked/scripts/searchlog.txt

    ```


    ```

    if [ ! -f $logfile ]; then

    touch logfile

    chmod a+rw $logfile

    fi

    ```


    ```

    if [ -w $logfile ]; then

    echo "$(date): \$QUERY_STRING" | sed ''s/p=\//g;s/+/g'' >>$logfile

    ```


    ```

    echo "Location: http://yahoo.com/bin/search\$QUERY_STRING"

    echo ""

    ```


    ```

    exit 0

    ```


    # How It Works


    The most notable elements of the script have to do with how web servers and web
    clients communicate. The information entered into the search box is sent to the
    server as the QUERY_STRING, encoded by replacing spaces with the + sign and other
    non-alphanumeric characters with the appropriate character sequences. Then, when
    the search pattern is logged, all + signs are translated back to spaces safely
    and simply, but otherwise the search pattern is not decoded, to ensure that no
    tricky hacks are attempted by users. (See the introduction to this chapter for
    more details.)'
