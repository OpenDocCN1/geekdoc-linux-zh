  md: '# How It Works


    The method of processing the input file in this script is interesting. Notice
    that the file is fed by the while loop with a < $ and that each line can then
    be analyzed by reading it with read input, which assigns the input variable to
    each line of the file.


    If your shell doesn''t have the ${var} notation, you can emulate behavior with
    wc:


    ```

    varlength="$echo "var" | wc -c"

    ```


    However, wc has a very annoying habit of prefacing its output with spaces to get
    values align nicely in the output listing. To sidestep this pesky problem, a slight
    modification, which lets only digits through the final pipe step, is necessary:


    ```

    varlength="$echo "var" | wc -c | sed ''/^[:digit:]//''

    ```


