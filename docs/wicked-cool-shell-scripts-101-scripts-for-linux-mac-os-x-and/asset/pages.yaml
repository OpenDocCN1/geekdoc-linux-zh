  md: 'scripts in this book, offers a password management tool that runs as CGI script
    and lets you easily add new accounts, change the passwords on existing accounts,
    and delete accounts from the account list.


    To get started, you will need a properly formatted .htaccess file to control access
    to the directory it''s located within. For demonstration purposes, this file might
    look like the following:


    ```

    $ cat .htaccess

    AuthUserFile /web/intuitive/wicked/examples/protected/.htpasswd

    AuthGroup /dev/null

    AuthName "Sample Protected Directory"

    AuthType Basic


    <Limit GET>

    require valid-user

    </Limit>

    ```


    A separate file, .htpasswd, contains all the account and password pairs. If this
    file doesn''t exist, you''ll need to create one, a blank one is fine: Use touch
    .htpasswd and ensure it''s writable by the user ID Apache itself (possibly user
    nobody). Then we''re ready for the script.


