  md: "# #59 Downloading files via FTP\n\nOne of the original killer apps of the Internet\
    \ was file transfer, and the king of file transfer programs is ftp, the File Transfer\
    \ Protocol. At some fundamental level, all Internet interaction is based upon\
    \ file transfer, whether it's a web browser requesting an HTML document and accompanying\
    \ graphics files, a chat server relating lines of discussion back and forth, or\
    \ an email message traveling from one end of the earth to the other.\n\nThe original\
    \ ftp program still lingers on, and its interface is quite crude, it's powerful,\
    \ capable, and well worth taking advantage of with some good scripts. There are\
    \ plenty of newer ftp programs around, notably ncftp (see http://www.ncftp.org/),\
    \ but with some shell script wrappers, ftp does just fine for uploading and downloading\
    \ files.\n\nFor example, a typical use for ftp is to download files from the Internet.\
    \ Often when, the files will be located on anonymous FTP servers and will have\
    \ URLs similar to ftp://myserver/path/filename. A perfect use for a scripted ftp.\n\
    \n# ## The Code\n\n```\n#!/bin/sh\n\n# ftpget - Given an ftp-style URL, unwraps\
    \ it and tries to obtain the\n# file using anonymous ftp.\n\nanonymous=\"$LOGNAME@$(hostname)\"\
    \n\nif [ -ne 1 ]; then\n    echo \"Usage: $0 ftp://\" >&2\n    exit 1\nfi\n\n\
    # Typical URL: ftp://ftp.ncftp.com/2.7.1/ncftpd-2.7.1.tar.gz\n\nif [ \"$(echo\
    \ $1 | cut -c1-6)\" != \"ftp://\" ]; then\n    echo \"$0: Malformed url. I need\
    \ it to start with ftp://\" >&2;\n    exit 1\nfi\n\nserver=$(echo $1 | cut -d/\
    \ -f3)\"\nfilename=\"$(echo $1 | cut -d/ -f4)\"\nbasefile=\"$(basename $filename)\"\
    \n\necho $(0): Downloading $basefile from server $basefile\n\nftp -n << EOF\n\
    open server\nuser ftp $anonpass\nget $filename $basefile\nquit\n```"
