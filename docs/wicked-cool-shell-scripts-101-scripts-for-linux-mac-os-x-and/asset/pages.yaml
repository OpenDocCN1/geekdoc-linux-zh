  md: 'Much of the challenge of script writing arises from the subtle variations between
    different flavors of Unix. While the IEEE POSIX standards supposedly provide a
    common base of functionality across different Unix implementations, it can still
    be confusing to use a Solaris system after a year in a Red Hat environment. The
    commands are different, they''re in different locations, and they often have subtle
    command flags. These variations can make writing scripts difficult too, as you
    may imagine.


    # What Is POSIX?


    The early days of Unix were like the mythical Wild West, with companies innovating
    and taking the operating system in quite different directions while simultaneously
    assuring customers that the new operating systems were compatible and just like
    the other Unixes. The Institute for Electrical and Electronic Engineers (IEEE)
    stepped in and, with a tremendous amount of effort from all the Unix vendors,
    created a standard version of POSIX, against which all commercial and open source
    Unix implementations are measured. You can''t buy a POSIX operating system per
    se, but the Unix or Linux you run is POSIX compliant.


    Yet POSIX-compliant implementations vary. One example of that will be addressed
    later in this chapter involves the echo command. Some versions of this command
    support an -n flag, which avoids the trailing newline that''s a standard part
    of the command execution. Other versions of echo support the \c escape sequence
    as a "does not include a newline", while still ignore it all and have no apparent
    way to add newlines. To make things even more puzzling, some command shells have
    a built-in echo function that ignores the -n and \c flags, while the same Unix
    system usually also has a standalone binary /bin/echo that understands these flags.
    This makes prompting for input in a shell script quite tough, because ideally
    the script should work identically as many Unix systems as possible. For functional
    scripts, needless to say, it''s critical to normalize the echo command, and that''s
    just one of the many scripts included in this book.


    Let''s get started looking at actual scripts to include in our script library.


    # #1 Finding Programs in the PATH


    Shell scripts that use environment variables (like MAILER and PAGER) have a hidden
    danger: Some of their settings may well point to nonexistent programs. For example,
    if you decide to be flexible by using the PAGER setting to display script output,
    instead of just-coding a specific tool, how do you ensure that the PAGER value
    is set to a valid program? After all, if it''s not a valid program, your script
    will break. This first script addresses how to test whether a given program can
    be found in the user''s PATH, and it''s also a good demonstration of different
    scripting techniques, including script functions and variable slicing.'
