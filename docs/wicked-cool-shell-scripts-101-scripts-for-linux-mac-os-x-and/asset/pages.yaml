  md: '# #57 Backing Up Directories


    Related to the task of backing up entire file systems is the user-centric task
    of taking a snapshot of a specific directory or tree. This simpel script allows
    users to easily create a compressed archive of a specified directory.


    # The Code


    ```

    #!/bin/sh


    # archivedir - Creates a compressed archive of the specified directory.


    maxarchivedir=10      # size, in blocks, of ''big'' directory

    compress-gzip         # change to your favorite compress app

    sprogname=$(basename $0)


    if [ $# -eq 0 ]; then

    echo "Usage: $sprogname directory" >&2; exit 1

    fi


    if [ ! -d $1 ]; then

    echo "$sprogname: can''t find directory $1 to archive." >&2; exit 1

    fi


    if [ "${basename $1}" != "$1" -o "$1" = "." ]; then

    echo "$sprogname: You must specify a subdirectory" >&2

    exit 1

    fi


    if [ ! -w . ]; then

    echo "$sprogname: cannot write archive file to current directory." >&2

    exit 1

    fi


    ndirsize=$(du -s $1 | awk ''{print $1}'')


    if [ $ndirsize -gt $maxarchivedir ]; then

    echo -n "Warning: directory $1 is $ndirsize blocks. Proceed? [n]"

    read answer

    answer=$(echo $answer | tr ''[:upper:]'' ''[:lower:]'' | cut -ci)

    if [ "$answer" != "y" ]; then

    echo "$sprogname: archive of directory $1 canceled." >&2

    exit 0

    fi

    ```'
