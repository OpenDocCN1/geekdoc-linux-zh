- img_proc: true
  md: '# #77 Identifying Broken Internal Links


    The scripts in Chapter 7 highlighted the value and capabilities of the lynx-only
    web browser, but there''s even more power hidden within this tremendous software
    application. One capability that''s particularly useful for a web administrator
    is the traverse function (which you enable by using -traverse), which causes lynx
    to step through all links on a site to see if any are broken. This feature can
    be harnessed in a short script.


    # ## The Code


    ```

    #!/bin/sh


    # checklinks - Traverse all internal URLs on a website, reporting

    # any errors in the "traverse.errors" file.


    lynx="/usr/local/bin/lynx" # this might need to be tweaked


    # Remove all the lynx output files upon completion:

    trap "/bin -rf traverse*.dat reject* traverse*.dat" 0


    if [ -z "$1" ]; then

    echo "Usage: checklinks URL" >&2; exit 1

    fi


    lynx -traverse "$1" /dev/null


    if [ -s "traverse.errors" ]; then

    echo -n $(wc -l < traverse.errors) errors encountered.

    echo Checked $(sed "s\${1]||g" traverse.dat | wc -1) pages at ${1}

    else

    echo -n "No errors encountered."

    echo Checked $(grep "''http" traverse.dat | wc -1) pages at ${1}

    exit 0

    fi


    baseurl=$(${1} | cut -d / -f3)

    mv traverse.errors $$(baseurl).errors

    echo "(A copy of this output has been saved in $$(baseurl).errors")


    exit 0

    ```


    # ## How It Works


    The vast majority of the work in this script is done by lynx; the script just
    fiddles with the resultant lynx output files to summarize and display the data
    accurately. The lynx output file reject.dat contains a list of links pointing
    to external URLs (See Script #7, Reporting Broken Internal Links, for how to exploit
    this data);'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'traverse.errors contains a list of failed, invalid links (the gist of this
    script); traverse.dat contains a list of all pages checked; traverse2.dat is identical
    to traverse.dat except that it also includes the title of every page visited.


    # Running the Script


    To run this script, simply specify a URL on the command line. Because it goes
    out to the network, you can traverse and check any website, be beware: Checking
    something like Google or Yahoo! will take forever and eat up all of your disk
    space in the process.


    # The Result


    First off, let''s check a tiny website that has no errors:


    ```

    $ checklinks http://www.ourecopass.org/

