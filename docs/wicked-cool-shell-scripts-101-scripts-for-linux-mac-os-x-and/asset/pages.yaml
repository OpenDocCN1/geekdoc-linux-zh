    # #25 Checking the Spelling of Individual Words


    High-end programs like StarOffice, OpenOffice.org, and Microsoft Word include
    built-in spell-checking software, but the more rudimentary question of whether
    a word is spelled correctly or not is beyond the ability of any of these applications.


    Similarly, Most Unix uses a spell-check package that works well, albeit with a
    crusty interface. Given an input file or data stream, the packages generate a
    long list of all possible misspellings. Some spell-check packages include interactive
    spell-checking applications. Again, none of them offer a simple way to check the
    spelling of a single word.


