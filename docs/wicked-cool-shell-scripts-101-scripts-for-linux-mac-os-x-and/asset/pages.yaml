  md: '# Running the Script


    While the lockfile script isn''t one that you''d ordinarily use by itself, you
    can try to test it by having two terminal windows open. To create a lock, simply
    specify the name of the file you want to lock as an argument of lockfile. Remove
    the lock, add the -u flag.


    # The Results


    First, create a locked file:


    ```

    $ lockfile /tmp/exclusive.lck

    $ ls -l /tmp/exclusive.lck

    -rw-r--r-- 1 taylor wheel Mar 21 15:35 /tmp/exclusive.lck

    ```


    The second time you attempt to lock the file, lockfile tries the default number
    of times (ten) and then fails, as follows:


    ```

    $ lockfile /tmp/exclusive.lck

    lockfile : Failed: Couldn''t create lockfile in

    ```


    When the first process is done with the file, you can release the lock:


    ```

    $ lockfile -u /tmp/exclusive.lck

    ```


    To see how the lockfile script works with two terminals, run the command in one
    window while the other window spins trying to establish its exclusive lock.


    # Hacking the Script


    Because this script relies on the existence of a lock file as proof that the lock
    is still enforced, it would be useful to have an additional parameter that is,
    say, the longest length of time for which a lock should be valid. If the lockfile
    routine times out, the last accessed time of the locked file could then be checked,
    and if the locked file is older than the value of this parameter, it can safely
    be deleted as a stray, perhaps with a warning, perhaps.


    This is unlikely to affect you, but lockfile doesn''t work with NFS-mounted disks.
    In fact, a reliable locking mechanism on an NFS-mounted disk is quite complex.
    A better strategy that sidesteps the problem entirely is to create locks only
    on local disks.


