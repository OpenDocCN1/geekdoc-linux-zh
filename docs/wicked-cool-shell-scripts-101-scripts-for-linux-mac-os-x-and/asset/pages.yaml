    WEB AND INTERNET ADMINISTRATION


    ![](img/a236915495daab651d7c2cc28becf416_247_0.png)


    If you’re running a web server or are responsible for a website, simple or complex,
    you find yourself performing some tasks with great frequency, ranging from identifying
    broken internal and external site links to checking for spelling errors on web
    pages. Using shell scripts, you can automate these tasks, as well as some common
    client/server tasks, such as ensuring that a remote directory of files is always
    completely in sync with a local copy, to great effect.'
