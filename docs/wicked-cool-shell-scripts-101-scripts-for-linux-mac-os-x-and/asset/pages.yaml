  md: '# How It Works


    The first thing to notice about this script is that it is set up to mail its results
    to the address specified in the notify variable. While you may opt to disable
    this feature, it''s quite helpful to get a confirmation of the receipt and successful
    unpacking of the archive from the remote server. To disable the email feature,
    simply remove the wrapping parentheses (from the initial cat to the end of the
    script), the entire line in which the output is fed into the main process, and
    the echo invocations throughout the script that output its status.


    This script can be used to unpack two types of input: If the subject of the email
    message is a valid subdirectory of the home directory, the archive will be unpacked
    into that destination. If the subject is anything else, the decoded, but still
    compressed (with gzip), archive will be stored in the /tmp directory.


    One challenge with this script is that it confirms and unwraps/packs the archive
    data. Initially, the email input is saved in $temp, but when this is run through
    code, the extracted file has the same name as it had before the weencode program
    was run in Avoiding Disaster with a Remote Archive, Script #87. This new filename
    is extracted from this script:


    ```

    fname="$(awk ''/^begin / { print $1 }'' $temp")

    ```


    Because the archive is compressed, $fname is something.tgz. If a valid subdirectory
    of the main directory is specified in the subject line of the email, then the
    archive is to be installed, the value of $fname is modified yet again during the
    process to have a .tar suffix:


    ```

    fname="$(echo $fname | sed ''s/.tgz$/.tar/g'')"

    ```


    As a security precaution, unpacker won''t always unpack a tar archive that contains
    filenames with absolute paths (a worst case could be /etc/passwd: You really don''t
    want that overwritten because of an email message received!), so care must be
    taken when building the archive on the local system to ensure that all filenames
    are relative, not absolute. Note that tricks like ../../../../../etc/passwd will
    be caught by the script test too.


    # Running the Script


    This script is intended to be run from within the lowest levels of the email system,
    it has no parameters and no output: All output is sent via email to the address
    specified as notify.


    # The Results


    The results of this script aren''t visible on the command line, but we can look
    at the email produced when an archive is sent without a target directory specified:'
