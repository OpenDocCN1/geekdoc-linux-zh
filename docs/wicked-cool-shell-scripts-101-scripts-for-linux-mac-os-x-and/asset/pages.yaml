    # Hacking the Script


    There are two additions to the script that would be quite useful: First, create
    a new website directory and automatically copy in an index.html and perhaps a
    custom 404 error page, replacing in the 404 error page a specific string like
    %%domain%% with the new domain name, and %%admin%% with the email address of the
    administrator.


    A second useful addition would be to test and possibly refine the restart testing;
    if your restart program doesn''t return a nonzero value on failure, you could
    capture the output and search for specific words like "failed" or "error" to ascertain
    success or failure. Or immediately after restarting, using ps|grep to see if httpd
    is running, and respond appropriately.'
