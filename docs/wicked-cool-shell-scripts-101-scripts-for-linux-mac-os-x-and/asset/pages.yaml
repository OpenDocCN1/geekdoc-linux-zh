  md: '# THE LINUX COOKBOOK 2ND EDITION


    Tips and Techniques for Everyday Use


    by MICHAEL STUTZ


    The Linux Cookbook 2nd Edition shows the best ways to do things on Linux, so that
    you can get your work done, quickly and easily. Organized by the general things
    that you use your computer for, the book gives you “recipes” for each task, each
    one with simple, step-by-step instructions, and an example that shows how to use
    the technique in practice. Covers the major Linux distributions.


    APRIL 2004, 576 PP., $39.95 ($59.95 CDN)

    ISBN 1-59327-031-3


    # LINUX FOR YOUR MOM


    by RICHARD GRANT


    An easy-paced and enthusiastic introduction to Fedora Core (the new openly-developed
    Red Hat project), geared towards the home desktop user who wants to customize
    their graphical interface, how to use the Internet, play games and music, burn
    CDs with graphics, print, download software, and more.


    MARCH 2004, 320 PP., $34.95 ($52.95 CDN)

    ISBN 1-59327-034-8


    # THE LINUX ENTERPRISE CLUSTER


    by KARL POPPER


    The Linux Enterprise Cluster is a practical guide for building and installing
    an enterprise-class cluster for mission critical applications using commodity
    hardware and open source software. The book includes information on how to build
    a high-availability server pair using the Heartbeat package, how to use the Linux
    Server load balancing software, and how to configure a reliable printing system
    in a cluster environment, and how to build a job scheduling system in Linux with
    no single point of failure.


    MARCH 2004, 456 PP., $49.95 ($74.95 CDN)

    ISBN 1-59327-036-4


    ![](img/a236915495daab651d7c2cc28becf416_361_0.png)


    ![](img/a236915495daab651d7c2cc28becf416_361_1.png)


    ![](img/a236915495daab651d7c2cc28becf416_361_2.png)'
