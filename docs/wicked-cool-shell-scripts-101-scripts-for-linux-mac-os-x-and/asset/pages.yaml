    # #32 Displaying a File with Additional Information


    Many of the common Unix commands have evolved within slow-throughput, expensive
    output environments and therefore offer minimal output and interactivity. An example
    is cat: When used to show a short file, it really doesn''t have much helpful output.
    It would be nice to have more information about the file. This script, a more
    sophisticated variation of Script #31, accomplishes this.


    # The Code


    ```

    #!/bin/sh

    showfile - Shows the contents of the file, including additional useful info.


    width-72

    for input

    do

    echo "--------------------------------------------------------------------------------"

    lines=$(wc -l < $input | sed ''s/ //g'')

    chars=$(wc -c < $input | sed ''s/ //g'')

    owner=$(ls -ld $input | awk ''{print $3}'')

    echo "--------------------------------------------------------------------------------"

    echo "File $input ($lines lines, $chars characters, owned by $owner)"

    echo "--------------------------------------------------------------------------------"

    while read line

    do

    if [ ${#line} -gt $width ]; then

    echo "$line" | fmt | sed -e ''1s/^//'' -e ''2,$s/^+/ /''

    else

    echo "$line"

    fi

    done < $input

    echo "----------------------------------------------------------------"

    ```'
