  md: "# #18 Displaying the Contents of Directories\n\nWhile the ls command is a cornerstone\
    \ of working with the Unix command line, there's one element of the command that's\
    \ always seemed pointless to me: indicating the size of a directory. When a directory\
    \ is listed, the program either lists the directory's contents file or shows the\
    \ number of 1,024-byte blocks required for the directory data. A typical entry\
    \ in ls -l output might be\n\n```\n```\ndrwrxr-x  2 taylor taylor  4096 Oct 28\
    \ 19:07 bin\n```\n```\n\nBut that's not very useful, because I want to know how\
    \ many files are in the specified directory. That's what this script accomplishes,\
    \ generating a multicolon listing of files and directories that show file size\
    \ with file entries and the number of files with directory entries.\n\n# ## The\
    \ Code\n\n```\n```\n#!/bin/sh\n\n# formatdir - Outputs a directory listing in\
    \ a friendly and useful format.\n\ngmk()\n{\n  # Given input in Kb, output in\
    \ Kb, Mb, or Gb for best output format\n  if [ $1 -ge 1000000 ]; then\n    echo\
    \ \"$$(scriptbc -p 2 $1 / 1000000)Gb\"\n  elif [ $1 -ge 1000 ]; then\n    echo\
    \ \"$$(scriptbc -p 2 $1 / 1000)Mb\"\n  else\n    echo \"${1}Kb\"\n  fi\n}\n\n\
    if [ $# -gt 1 ]; then\n  echo \"Usage: $0 [directory]\" >&2; exit 1\nelif [ $#\
    \ -eq 1 ]; then\n  cd \"$1\"\nfi\n\nfor file in *\ndoo\n  if [ -d \"$file\" ];\
    \ then\n    size=$(ls \"$file\" | wc -l | sed 's/[[:digit:]]//g')\n    if [ $size\
    \ -eq 1 ]; then\n      echo \"$file ($size entry)\"\n    else\n      echo \"$file\
    \ ($size entries)\"\n    fi\n  fi\ndoo\n```\n```"
