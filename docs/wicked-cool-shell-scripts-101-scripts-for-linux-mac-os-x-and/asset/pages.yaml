  md: '# Hacking the Script


    A useful refinement to this script would be to allow certain users have larger
    quotas than others. This could easily be accomplished by creating a separate file
    that defines the disk quota for each user and declaring in the script a default
    quota for users not appearing in the file. A file with account name and quota
    pairs can be scanned with grep and the second field extracted with a call to cut
    -f2.


    # #41 Figuring Out Available Disk Space


    Related to disk quota management is the simpler question of how much disk space
    is available on the system. The df command reports disk usage on a disk basis,
    but the output can be a bittling:


    | Filesystem | 1K-blocks | Used Available% | Mounted on |

    |---|---|---|---|--|

    | /dev/hdb2 | 2569592 | 187048 | 2219564 | 8% / |

    | /dev/hdb1 | 101089 | 6218 | 89652 | 7% /boot |

    | none | 127744 | 0 | 127744 | 0% /dev/shm |


    What would be more useful is a version of df that summarizes the available capacity
    values in column four and then presents the summary in a way that is easily understood.
    It''s a task easily accomplished in a script.


    # The Code


    ```

    #/bin/sh


    # diskspace - Summarizes available disk space and presents it in a logical

    # and readable fashion.


    tempfile=`tmp/available.$\$


    trap ''rm -f $tempfile'' EXIT


    cat << ''EOF'' > $tempfile

    { sum += $ 4 }

    END { mb = sum / 1024

    gb = mb / 1024

    printf "%.0f MB (%.2fGB) of available disk space\n", mb, gb

    }

    EOF


    d -k | awk -f $tempfile


    exit 0

    ```'
