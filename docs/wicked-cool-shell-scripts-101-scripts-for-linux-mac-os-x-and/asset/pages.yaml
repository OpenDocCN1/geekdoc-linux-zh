  md: 'And finally we''re ready to create the actual account in the NetInfo database
    with niutil. The first line creates an entry for the account in NetInfo, -creating,
    and the subsequent account attributes are added with -createprop. Notice that
    the special_shadow_passwd field is created, though its value is left as null.
    This is also a placeholder for the future: NetInfo doesn''t store the encrypted
    password in a secret place. Yet.


    Instead of using cp -R to install files and directories into the new account,
    the script uses a Mac OS-specific utility called ditto. The command ensures that
    any files that might have resource forks (an Aqua-ism) are copied intact.


    Finally, to force the password to be set, the script simply calls passwd with
    the special notation that only the root user can utilize: passwd account, which
    sets the password for the specified account.


    # Running the Script


    This script prompts for input, so no command flags or command-line arguments are
    necessary.


