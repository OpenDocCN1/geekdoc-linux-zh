  md: "steps from gallows: 6, word so far: -----\nGuess a letter: quit\n\n# Hacking\
    \ the Script\n\nObviously it's quite difficult to have the fancy guy-hanging-on-the-gallows\
    \ graphic\n we're working with a shell script, so we use the alternative of counting\
    \ \"steps to\ngallows instead. If you were motivated, however, you could probably\
    \ have a\nseries of predefined \"text\" graphics, one for each step, and output\
    \ them as the\ngame proceeds. Or you could choose a nonvolatile alternative of\
    \ some sort, or,\ncourse!\n\nNote that it is possible to pick the same word twice,\
    \ but with the default word\nlist containing 2,882 different words, there's not\
    \ much chance of occurring.\nIf this is a concern, however, the line where the\
    \ word is chosen could save all\nprevious words in a variable and screen them\
    \ against to ensure that there aren't\nany repeats.\n\nFinally, if you were motivated,\
    \ it would be nice to have the guessed letters be\nsorted alphabetically. There\
    \ are a couple of approaches to this, but I think I'd try\nto use|sort;\n\n# #101\
    \ A State Capitals Quiz\n\nOnce you have a tool for choosing a line randomly from\
    \ a file, as we have with\nScript #76, Displaying Random Text, there's no limit\
    \ to the type of quiz games you\ncan write. In this instance, I've pulled together\
    \ a list of the capitals of all 50 states\nin the United States of America; this\
    \ script randomly chooses one, shows the\nstate, and asks the user to type in\
    \ the matching capital.\n\n# The Code\n\n```\n#!/bin/sh\n\n# states - A state\
    \ capital guessing game. Requires the state capitals\n# data file at http://www.intuitive.com/wicked/examples/state.capitals.txt.\n\
    \ndb=\"/usr/lib/games/state.capitals.txt\"\nrandomquote=$HOME/bin/randomquote.sh\"\
    \      # Script #76\n\nif [ -r $db ]; then\necho \"Error: Can't open $db for reading.\"\
    \ >&2\necho \"$(get http://www.intuitive.com/wicked/examples/state.capitals.txt)\"\
    \ >&2\ne \"save the file as $db and you're ready to play!\" >&2\n    exit 1\n\
    fi\n\nguesses=0 correct=0 total=0\n\nwhile [ \"$guess\" != \"quit\" ]; do\n```"
  merge: -1
