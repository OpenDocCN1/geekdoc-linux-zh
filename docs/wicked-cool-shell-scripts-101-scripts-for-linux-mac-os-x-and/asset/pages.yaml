    # #90 Monitoring Network Status


    One of the most puzzling administrative units in Unix is netstat, which is too
    bad, because it offers quite a bit of useful information about network throughput
    and performance. With the -s flag, netstat outputs volumes of information about
    each of the protocols on your computer, including TCP, UDP, ICMP, IPSec, and Most
    of these protocols are irrelevant for a typical configuration; the protocol to
    examine is TCP. This script analyzes TCP protocol traffic, determining the percentage
    of failure and including a warning if any values are out of bounds.


    Analyzing network performance as a snapshot of long-term performance is useful,
    but a much better way to analyze data is with trends. If your system has 1.5 percent
    packet loss in transmission, and in the last three days the rate jumped up to
    7.8 percent, a problem is brewing and needs to be analyzed in more detail.


    As a result, Script #90 is in two parts. The first part is a short script that
    is intended to run every 10 to 30 minutes, recording key statistics in a log file.
    The second script parses the log file and reports performance and any anomalies
    or other values that are increasing over time.


    CAUTION Some flavors of Unix cannot run this script as. It turns out that there
    is a variation in the output format of the netstat command between Linux and Unix
    versions. This code works for Mac OS X and FreeBSD; the changes for other Unixes
    should be straightforward (check the log file to see if you''re getting meaningful
    results to ascertain whether you need to tweak it).'
