  md: '$() notation as a smarter alternative to backticks, and so on. So what''s

    problem? The default /bin/sh in Solaris 9 and earlier is not POSIX-compliant,

    which causes a huge hassle.


    Fortunately, you can fix it with sh in one of ways:


    +   1. Replace /bin/sh with a hard link to /usr/xpg4/bin/sh, the POSIX-compliant

    shell in Solaris. This might be a bit radical, and there''s a tiny chance it''ll

    break other things in Solaris, I''d be cautious about this choice.

    2. In every single script in this book, replace the #1/bin/sh line with #1/usr/

    xpg4/bin/sh, which is straightforward. This has the added advantage of allow-

    ing you to automate the process with a for similar to the following:


    # This assumes that you''re in the Wicked Cool Shell script directory;

    for script in


    ```

    sed $#!|/bin/sh|#!|/usr/xpg4/bin/sh| < $script outfile

    mv $script

    done

    ```


    Hopefully, with the release of Solaris 10 Sun will just say "cia!” to the legacy

    problems and include a POSIX-compliant version of the Bourne Shell she

    default /bin/sh, and this will all go away as a problem.


    # Organization of This Book


    This book is organized into 12 chapters that reflect the wide range of different

    ways that shell scripts can improve and streamline your use of Unix. If you''re
    a

    Mac OS fan — as I am — rest assured that almost every script in this book will

    work just fine in both Jaguar and Panther, with the exception of those scripts
    that

    check /etc/passwd file for account information. (The user password in-

    ment is in the NetInfo database. Visit the book''s website for dis-

    cussion of this issue and how to work with rizerport and nij instead.)


    # Chapter 1: The Missing Code Library


    Programming languages in the Unix environment, particularly C and Perl, have

    extensive libraries of useful functions and utilities to validate number formats,

    calculate date offsets, and perform many more useful tasks. When working with

    thell, you''re left much on your own, so this first chapter focuses on

    various tools and handles to make shell scripts more friendly, both throughout
    this

    book and within your own scripts. I''ve included every input validation

    functions, a simple but powerful scriptable front to bc, a tool for quickly

    adding commas to improve the presentation of very large numbers, a technique

    of sidesteping Unixes that don''t support the helpful -n flag to echo, and an

    include script for using ANSI color sequences in scripts.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Chapters 2 and 3: Improving Commands and Creating Utilities


    These two chapters feature new commands that extend and expand Unix in various
    helpful ways. Indeed, one wonderful aspect of Unix is that it''s always growing
    and evolving, as can be seen with the proliferation of command shells. It''s as
    guilty of idling this evolution as the next hacker, this pair of chapters offers
    scripts that implement a friendly interactive calculator, an unm facility, two
    different reminder/event-tracking systems, a reimplementation of the locate command,
    a useful front end to the spelling facility, a multi-time zone command, and a
    new version of ls that increases the usefulness of directory listings.


    # Chapter 4: Tweaking Unix


    This may be heresy, but there are aspects of Unix that seem to be broken, even
    after decades of development. If you move between different flavors of Unix, particularly
    between open Linux distributions and commercial Unixes like Solaris and HP-UX,
    you are aware of missing flags, inconsistent commands, and similar issues. Therefore,
    this chapter includes both rewrites and front ends to Unix commands to make them
    a friendlier or more consistent with other Unixes. Scripts include a method of
    adding GNU-style full command flags to non-GNU commands and a couple of smart
    scripts to make working with the various file-compression utilities considerably
    easier.


    # Chapters 5 and 6: System Administration Tools


    If you''ve picked up this book, the odds are pretty good that you have both administrative
    and administrative responsibility on one or more Unix systems, even if it''s just
    your Debian Linux or FreeBSD PC. (Which reminds me of a joke: How do you fix a
    broken Windows PC!) These two chapters offer a few scripts to improve your life
    as an admin, including disk usage analysis tools, a disk quota system that automatically
    emails users who are over their quota, a tool that summarizes which services are
    regardless of whether you use inetd or xinetd, a kill reimplementation, a crontab
    validator, a log rotation tool, and a couple of backup utilities.


    # Chapter 7: Web and Internet Users


    If you''ve got a computer, you''ve doubtless got an Internet connection. This
    chapter includes a bunch of really cool shell scripts that show how the Unix command
    line can offer some wonderful and simple methods of working with the Internet,
    including a tool for extracting URLs from any web page on the Net, a weather tracker,
    a movie database search tool, a stock portfolio tracker, and a website change
    tracker with automatic email notification when changes.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Chapter 8: Webmaster Hacks


    The other side of the web coin, of course, is when you run a website, either from
    your own Unix system or on a shared server elsewhere on the network. If you''re
    a webmaster or an ISP, the scripts in this chapter offer interesting tools for
    building pages on the fly, processing contact forms, logging a web-based photo
    album, and the ability to log web searches. This chapter also includes a text
    counter and complete guest book implementation, as it shell scripts.


    # Chapters 9 and 10: Web and Internet Administration


    These two chapters consider the challenges facing the administrator of an Internet
    server, including two different scripts to analyze different aspects of a web
    traffic log, for identifying broken internal or external links across a website,
    a web page spell-check script, and a slick Apache web password management tool
    that makes keeping an .htaccess file a breeze. Techniques for mirroring directories
    and entire websites with mirroring tools are also explored.


    # Chapter 11: Mac OS X Scripts


    The Macintosh operating system is a tremendous leap forward in the integration
    of Unix and an attractive, commercially successful graphical user interface. More
    importantly, because every Mac OS system has a complete Unix hidden behind the
    pretty interface, there are a number of useful and educational scripts that can
    be written, and that''s what this chapter explores. In addition to a rewrite of
    adjuster, new Mac OS X accounts to be set up in seconds from the command line,
    scripts in this chapter explore how Macs handle email aliases, how iTunes stores
    its music library, and how to change Terminal window titles and improve the useful
    open program.


    What''s a programming book without at least few games? This chapter integrates
    many of the most sophisticated techniques and ideas in the book to present three
    fun and challenging games. While entertaining, the code for each is also well
    worth studying as you read through this last chapter. Of special note is the hangman
    game, which shows some smart coding techniques and shell script tricks.


    # The Website


    The official website for this book can be found at http://www.intitive.com/wicked/.
    You''ll find all the scripts discussed in this book as well as bonus scripts,
    including games, some Mac OS X–specific hacks, and others that don''t make the
    final cut for the book, which are still worth examination and study. You''ll also
    find a link to the official errata list for this book (worth checking especially
    if you''re finding that a script isn''t working for you) and information about
    many other books I''ve written on Unix and web-related topics.'
  merge: -1
  pgno: 24
