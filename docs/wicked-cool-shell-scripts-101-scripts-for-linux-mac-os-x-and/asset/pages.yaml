  md: '# How It Works


    Like ftp, sftp allows a series of commands to be fed to it as pipe or input redirect,
    which makes this script rather simple to write: Almost the entire script focuses
    on building the sequence of commands necessary to upload changed files. At the
    end, the sequence of commands is fed to the sftp program


    As Scripts #81 and #82, if you have a version of sftp that doesn’t properly return
    a nonzero failure to the shell when a transfer fails, simply remove the conditional
    block at the end of the script, leaving only


    ```

    sftp -b $file "user@server"

    touch $timestamp

    ```


    Because sftp requires the account to be specified as $user@host, it’s actually
    a bit simpler than the equivalent ftp script shown in Script #81, ftpsync. Also
    notice the -P flag added to the put commands; it causes sftp to retain the local
    permission, creation, and modification times for all files transferred.


