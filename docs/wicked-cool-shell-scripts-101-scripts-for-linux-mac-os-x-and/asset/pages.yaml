  md: '# How It Works


    For any given suffix, three steps are necessary: uncompress the file, rewrite
    the filename without the suffix, and add it to the list of files to recompress
    at the end of the script. By keeping three separate lists, one for each compression
    program, this script also lets you easily grep across files compressed using multiple
    utilities.


    The most important trick is the use of the eval directive when recompressing the
    files. It is necessary to ensure that filenames with spaces are treated properly.
    When the Zlist, zlist, and blist variables are instantiated, each argument is
    surrounded by quotes, so a typical value might be "sample.c" "test.pl" "penny.jar".
    Because the list has leaves of quotes, invoking a command like cat Zlist results
    in cat claiming that file "sample.c" wasn''t found. To force the shell to act
    as if the command were typed at a command line (where the quotes are stripped
    once they have been utilized for arg parsing), eval is used, and all works as
    desired.


    # Running the Script


    To work properly, this script should have three names. How do you do that in Unix?
    Simple: use can symbolic links, which are special files that store the names of
    link destinations, or hard links, which are actually assigned the same node as
    the linked file. I prefer symbolic links. These can be easily created (the script
    is already called zcat):


    ```

    $ ln -s zcat zmore

    $ ln -ns zcat zgrep

    ```


    Once that''s done, you have three new commands that have a shared code base, and
    each accepts a list of files to process as needed, uncompressing and then recompressing
    them when done.


