  md: '# COMMAND-LINE TOOLS


    Both the graphical user interface (GUI) and the command-line interface are similar
    in one respect – they need to be executed by the superuser account. The basic
    format of the `rpm` command is


    ```

    rpm option package_name

    ```


    # Fast Facts


    The basic options used with the `rpm` command are shown below, and any system
    administrator needs to learn these:


    +   - -i installs the package.

    - -e removes (erases) the package.

    - -U removes the installed package first and then installs the new version.

    - -V verifies the installation of the package.

    - -q queries the package.


    Each of these can be combined with a number of other options to make the `rpm`
    command very powerful.


    # Package Installation


    Packages are installed using the `-i` option. A simple install of the Telnet package
    specified above would be


    ```

    rpm -i telnetd-0.17-23.i386.rpm

    ```


    There are useful options that are often combined with the install option, as well
    as with other options, namely `-v` and `-h`. The `-v` option is for verbose and
    will give some useful feedback during the process. The `-h` option will print
    a series of hash marks on the screen as the work proceeds, with the sole purpose
    of keeping you aware that something is still happening.


    # Package Updating


    Packages already installed on system can be upgraded to a later release using
    the `-U` option. This option will remove the old version, keeping any modified
    files such as the configuration files. It will then install the new version. To
    upgrade the Telnet package above to version 18, release 5, the command to use
    is


    ```

    rpm -U telnetd-0.18-5.i386.rpm

    ```


    To see this in verbose mode and printing hash marks when the archive is unpacked,
    the command would look like


    ```

    rpm -Uvh telnetd-0.18-5.i386.rpm

    ```'
  merge: -1
