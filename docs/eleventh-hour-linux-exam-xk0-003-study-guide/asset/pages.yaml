    +   A. F, then M

    B. F, then n

    C. F, then k

    D. F, then I


    +   4. Users are reporting that a particular corporate server responds slowly
    at around 30 min between 10:30 A.M. and 11:00 A.M. You decide to run sar at regular
    intervals during this time to capture statistics on the server''s network performance.
    What syntax would you use to capture six sets of these metrics every 10 min?

    A. sar -A DEV 600 6

    B. sar -n DEV 600 6

    C. sar -n DEV 600 6

    D. sar -A DEV 600 6


    +   5. You are in the process of setting up an active mode FTP server. Whenever
    you try to connect, you can connect to the server, but you cannot enter a username
    and password. You made that TCP ports 21 and 20 are open on the server. What is
    the most probable cause of the problem?

    A. TCP ports 1022 and below are open on the server

    B. TCP ports 1023 and above are open on the server

    C. TCP ports 1022 and below are closed on the server

    D. TCP ports 1023 and below are closed on the server


    # ANSWERS


    +   1. Correct answer and explanation: C. Answer C is correct because the command
    with -c and -j switches the archive and compresses the files in the archive with
    bzip.


    Incorrect answers and explanations: A, B, and D. Answer A is incorrect because
    the -c switch creates the tarfile, and there is nothing to instruct to compress
    the files in the archive. Answer B is incorrect because the -x switch is used
    to extract the files from the archive, which in this case contains compressed
    files. Answer D is incorrect because the -x switch is used to extract the files
    from the archive.


    +   2. Correct answer and explanation: D. Answer D is correct because the restore
    command with -f switch is required to extract all files from the archive and specify
    the archive file.


    Incorrect answers and explanations: A, B, and C. Answer A is incorrect because
    the output file is specified and the -f switch is used to specify the archive
    file. Answer B is incorrect because dump is used to back up the files and has
    no restore functionality. Answer C is incorrect because only restore can be used
    to extract files from a backup set created with dump.'
