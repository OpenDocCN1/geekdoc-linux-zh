  md: '# MANAGING SERVICES


    As a system administrator, one of your primary jobs is to manage services running
    on your systems.


    # Fast Facts


    Services, daemons, are just programs that start and run in the background and
    provide services for users.


    +   - Services are started when their assigned runlevel is initiated.

    - Scripts that start each service are in etc/init.d.

    - The scripts can be used manually with parameters of start, stop, restart.


    # inetd and xinetd


    To conserve resources, smaller and less frequently used network-based services
    bundled together in a super server service, waits in the background until one
    of the services is needed and loads it. This method prevents the service from
    just sitting there taking up memory until it is actually needed. There are two
    super server daemons in Linux - inetd and the newer, "extended" xinetd, which
    has some features and enhanced security. Changing the services managed by inetd
    or xinetd is done by editing the appropriate configuration file (/etc/inetd.conf
    or /etc/xinetd.conf) and restarting the service.


    # chkconfig


    chkconfig is a handy tool for managing runlevels a service runs in some Linux
    distributions. It can be used to view or change the runlevels a service will run
    in. Type chkconfig to view the status of all services at the current runlevel.


    # SUMMARY OF EX OBJECTIVES


    In the BASH and command line tools section, we covered enough to get you started,
    editing, moving, and deleting files and directories, as well as using some of
    the tools that are available in a directory structure. We also covered using man
    and info to find more information about command line utilities. We even learned
    about linking commands together to get even more functionality out of them, and
    touched on how scripts work.


    In the Task Scheduling section, we learned how to run programs automatically on
    a regular schedule with cron or at a later time with at. In the Managing Services
    section, we learned how to tell Linux which services to run'
  merge: -1
