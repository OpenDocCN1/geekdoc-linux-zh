  md: '# Installing, Removing, and Updating Programs


    The options used are c to create a tar file for v verbose output, and f to put
    the output in the specified file. The tar archive will be created from one or
    more files and/or directories specified at the end. There could be multiple files
    directories specified on the same command line. For instance, suppose you wanted
    to compress everything in your directory folder, say /home/synergy/work. The command
    to create an archive work.tar in the current directory would


    ```

    tar -cvf work.tar /home/synergy/work

    ```


    Once the tar file has been created, you can list its contents using tar -tvf work.
    The tar file can be decompressed or the files extracted using -xvf work. This
    extraction process does not remove the tar file but places the files in the current
    working directory.


    The tar utility can also be used to compress the tar file that has been created.
    In the above example, to compress the tar file of the work directory, you would
    use:


    ```

    tar -czvf work.tar

    ```


    The files are compressed using gzip and will be given the .tgz extension. The
    compressed file can be decompressed using


    ```

    tar -xzvf work.tar

    ```


    # COMPRESSION UTILITIES


    Some compression utilities work best on certain types of file, but we will concentrate
    on a couple of them. We have mentioned gzip that can be used with tar. It is also
    a stand-alone program that can be invoked to compress files at any time. The format
    of the command is


    ```

    gzip filename.ext

    ```


    This will compress filename.ext and save it as filename.ext.gz. The original file
    will be deleted during the process. This can be decompressed using the command:


    ```

    gzip filename.ext.gz

    ```


    Again, the command will delete filename.ext.gz and leave filename.ext only. The
    gzip utility can compress files to different levels from 1 to 9, with 1 being
    quick but least efficient to 9 being very efficient with the default is level
    6. For both gzip and unzip, the option -r can be used, which will recursively
    compress or decompress all the files in the current directory and the subdirectories.


    The bzip2/bunzip utilities are another pair of compression and decompression tools,
    which often give slightly better compression ratios. The commandline options are
    very similar to that of gzip/gzip. The compressed files will usually have an extension
    of bz2/bz or tb/tb2 (compressed file or a compressed tar file).'
