    \ contains software libraries in support of the X server.\n- /usr/include: It\
    \ has the include files if a new X client needs to be developed.\n- /usr/lib/x11:\
    \ A symbolic link will be found to this directory in /usr/lib. It contains the\
    \ font file, documentation, system, and client resources.\n- /usr/lib/modules:\
    \ This will hold all the drivers for various graphics cards used by the X server.\n\
    - /usr/X11/man: The man pages for X11.\n\nWhen Linux is installed on a computer\
    \ and the graphical desktop option, the main components required to run a local\
    \ X session are loaded: X server, basic fonts, a terminal client, and a Window\
    \ Manager. The main configuration file for the X Windows system is the xorg.conf\
    \ file. The xorg.conf file is typically located in /etc/X11/xorg.conf, although\
    \ this does vary across Linux distributions.\n\nThe xorg.conf file will contain\
    \ a number of sections that will provide information on the input devices, monitor\
    \ layout, file locations, and so on. The main sections are as follows:\n\n+  \
    \ - Files: The location of the fonts and colors of the X server.\n- Module: It\
    \ informs the X server on the dynamic modules to load.\n- InputDevice: It defines\
    \ all input devices such as the mouse and keyboard that are used in the system.\n\
    - ServerLayout: It defines the display and defines the screen layouts.\n- Monitor:\
    \ Attributes of the monitor(s) that are attached to the system.\n- Screen: Screen\
    \ configuration.\n- Device: It defines all the graphics cards attached to the\
    \ system.\n\nThe ServerLayout section are at the highest level and can bind together\
    \ the input and output devices to be used in a session. The output devices will\
    \ comprise of a number of sections (for example the graphics board and monitor).\
    \ All input and output devices are bound together in the Screen section and are\
