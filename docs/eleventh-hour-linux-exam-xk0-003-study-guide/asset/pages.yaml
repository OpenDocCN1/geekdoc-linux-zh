    # DNS


    The DNS resolves machine names to an IP address or it converts from an IP address
    to the name. In principle, a DNS resolves a name to its IP address.


    ![](img/53450e0f522134e838a034ce98470308_113_0.png)


    The Domain namespace can be regarded as structured in a tree form.


    +   - Each domain within the tree is a node, with each having a set of resource
    records (RRs) associated with it.

    - RRs will define (at least) the ownership, name, and IP address.

    - Domains can have subdomains, often referred to as children.

    - The root is named . (dot), a corollary of the root drive / in the filesystem.

    - Subdomains prepend their name to the root name, separated with another \.

    - Actual machines in each domain are defined by their machine name and the domain
    they are in their fully qualified domain name (FQDN).


    The Domain name system is a distributed database, and the nodes of this database
    are name servers with one or more authoritative DNSes that publish all the information
    about a domain, included in zone files on the DNS. The forward and reverse zones
    are defined as: reverse zones associate an IP address with a hostname and forward
    zones associate a name with an IP address. The DNS resolver is the client part
    of the client-server architecture and is the process that performs the resolution
    of the query, for example, the translation of the FQDN to its actual IP address.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# CHAPTER 8  Installing, Configuring as a Server


    DNS RRs


    RRs are the most basic part of the Domain name system and have a number of basic
    elements to them: type


    CACHING NAMESERVER

    A caching nameserver will build a local cache of resolved domain names and this
    list to serve other hosts on your network. A large number of DNS requests are
    the same, and this will increase the speed of resolution and decrease the amount
    of traffic you send upward to another nameserver provided by *named*. A sample
    listing showing how a primary nameserver is set up below, which is in the *named.conf*
    file (normally in /etc or /etc/named.d).


    ```

    zone "mydomain.com" IN {

    type master;

    file "mydomain.com.xzone";nallow-update [ none ];

    };

    ```


    There is a control utility called *rndc* that allows you to administer the *named*
    daemon. The configuration file for *rndc* is at /etc/rndc.conf, and additionally,
    you need to specify authentication keys in both /etc/rndc.conf and /etc/named.conf,
    which must match. You need to generate HMAC-MD5 keys for both the configuration
    files using the following command:


    ```

    dnssec-keygen -a hmac-md5 -b <bit-length> -n HOST <key-file-name>

    ```


    The default port used by *rndc* to connect to is 953. Once the command is set
    up, the *rndc* command can be used with the following options shown in Table 8.1.


    # NTP


    The NTP synchronizes computer clocks over a network


    | Table 8.1 rndc Options |

    | - | - |

    | Refresh | Refreshes the database |

    | Reload | Reloads the zone files but keeps the cached files |

    | Stop | Stops the service gracefully |'
