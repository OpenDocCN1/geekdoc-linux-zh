  md: '# CHAPTER 7 Installing, Configuring as a Workstation


    > EXAM WARNING

    The name and location of the main configuration files are important to know for
    the exam. In particular, make sure that you know the configuration files you need
    to change to configure individual users desktop.


    # Terminal Emulators


    Within Linux, there are a number of built-in terminal emulators, often bundled
    with the X Windows display manager. The two common ones are gnome-terminal and
    console in GNOME and KDE, respectively. These are feature rich and have a very
    user-friendly interface, although for everyday tasks memory is not an issue these
    terminal emulators are very good and easy to use and are probably the preferred
    for a user. However, for systems that have a smaller amount of RAM, there is another
    emulator called xterm that has a very small memory footprint (usually under 1
    MB), although the window is smaller and the default font is hard to read. The
    standard x emulators are for DEC VTxx and Tektronix 4014 terminals.


    The VTxx and Tektronix terminals each have their own window so a user can edit
    in one and look at graphics in another. Only one of these windows will be considered
    active at any time, and this one will accept keyboard input and terminal output.
    The number of options allowed for xterm is very large. That will allow the system
    to correctly emulate the terminal and application running in it.


    # SUMMARY OF EXAM OBJECTIVES


    In this chapter, you learned how to configure a Linux system when it is used as
    a workstation. The two most common aspects of the user experience, namely printing
    and the GUI (X Windows interface), and how these can be configured for individual
    users were explained.


    The CUPS interface was shown, and how to add local printers using the interface
    was explained. The management of the printers and their queues was demonstrated
    using the CUPS interface and how this could be achieved using the command line
    interface.


    The user''s main interface to the computer is the GUI, and the number of different
    interfaces that can be used is very large. The standard, underlying interface
    is X Windows and is commonly known as X11. This can be used and enhanced with
    many different display managers; the two most ones being GNOME and KDE. The main
    configuration files for X Windows and how to modify these for individual users
    were described. Specific configuration details were then outlined for the GNOME
    and KDE desktops. The use of multiple or virtual desktops and how these may be
    different from a user''s experience of a single desktop was explained. The configuration
    of these multiple desktops was explained.'
