  md: '# CHAPTER 3 Booting Linux


    Most modern bootloaders are dynamically configurable and can be executed during
    and after the system has been booted. The bootloader can pre-defined configuration
    files during startup or can support boot-time changes (for example, selecting
    different kernels, virtual file systems) via a boot command prompt. In addition,
    the bootloader can make modifications to boot-time configuration files and the
    files prior to using them after control has been transferred to the operating
    system kernel.


    # Installing GRUB and Booting Linux


    Prior to execution of GRUB, the system BIOS loads into memory the Master Boot
    Record (MBR) and executes its contents. The total size of the MBR is 512 bytes,
    which contains the bootloader program and disk partitioning information. The preinstallation
    form of the GRUB program is divided into two stages and the MBR stage 1. The stage
    1 program uses the first 446 bytes with the remaining 64 bytes allocated to the
    partition table of the hard disk. The purpose of GRUB stage 1 is to find and load
    GRUB stage 2 (which may reside elsewhere on the hard disk). GRUB stage 1 must
    be flexible enough to access many different file types. This flexibility is accomplished
    because GRUB stage 1 has a large number of mass storage device drivers. Once loaded,
    GRUB stage 2 can perform the following three functions:


    +   - load a predefined Linux kernel (for example, vmlinuz-version.gz).

    - allow selection of which operating system to boot on dual boot system.

    - entry of boot parameters.


    Once GRUB stage 2 has loaded the Linux kernel, it must also load a virtual file
    system and execute the Linux kernel.


    > Fast Facts


    Linux is started using a bootloader, often using GRUB which can be summarized
    as follows.


    +   - Is loaded by the BIOS and resides in the MBR.

    - Can access many different filesystems (ext3, file allocation table (FAT), VFAT,
    and so forth).

    - Is dynamically configurable after you have installed Linux.

    - Main configuration file is /etc/grub.conf.

    - GRUB boot menu is /boot/grub/menu.1st.


    # GRUB Configuration Files and Commands


    GRUB is a dynamically configurable bootloader application and allows for postinstallation
    changes to the system for ensuring a successful boot-up process,'
