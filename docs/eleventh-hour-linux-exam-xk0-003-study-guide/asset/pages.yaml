    # Fast Facts


    There are a number of useful commands to search log files.


    +   - The output of a command can be piped into `grep` and used to filter what
    shows up on the screen, or you can feed files directly into `grep`. The syntax
    is `grep [options] PATTERN [file]`. When used, `grep` will search the named file
    (or standard input) for lines that match the `PATTERN` and prints any matching
    lines. The number of options available is large, and expressions can be used.

    - tail shows the 10 lines of text in a file, or with the `-n NUM option, it shows
    the last NUM lines. The `-f option f`, for follow, refreshes the screen with new
    information as the log file updates. It may be convenient to open a separate terminal
    window for running `tail -f`.

    - The awk utility is a programming language specialized for text and string functions.
    The general syntax is `awk [options] -f script-file filename`. If the filename
    is left off, `awk` uses STDIN. `awk` is much more flexible than grep.

    - sed is a stream editor, intended to edit files using scripts, and is useful
    for doing bulk search and replace functions within multiple files and acts on
    ones line at a time. The syntax is `sed [options] -f script_file filename`.


    # BACKING UP AND RESTORING


    Backups can be done at different levels. Level backups run at the operating level
    and are convenient for dealing with individual files, but they require a working
    operating system to restore. Some online backup uses the database or e-mail system
    to read each record or mailbox and make a copy. An offline backup requires the
    system that manages the database or the e-mail system to be shut down. It is also
    possible to do an offline backup of entire drive systems and computers themselves
    by booting from an alternate device.


    # Fast Facts


    There are two general kinds of backups – complete backups and partial backups.


    +   - Complete backups back up all the data you have selected.

    - Partial backups back up only the data that has changed since the most recent
    complete backup.'
