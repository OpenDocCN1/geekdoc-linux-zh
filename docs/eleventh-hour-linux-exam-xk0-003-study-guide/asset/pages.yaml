  md: '# Local Filesystems


    Local filesystems alleviate many challenges that are typically associated with
    network-based filesystems, RAM disk-based filesystem, and removable filesystems.
    This includes performance challenges due to limit network bandwidth, access failure
    due to network connectivity, and nonpersistent filesystems (for example, RAM disk)
    that require reconfiguration once the electrical power is restored.


    This section presents some additional filesystems that are somewhat common: FAT,
    New Technology File System (NTFS), and Virtual File Allocation Table (VFAT). FAT
    is a widely supported filesystem with a number of different standards including
    FAT16, FAT32, and a variation VFAT. These are summarized in Table 2.1.


    > EXAM WARNING

    Unlike, earlier operating systems that used the FAT filesystem allowed files to
    be named with only eight alphanumeric characters with a period separating the
    name from three alphanumeric character extension. VFAT supports long filenames,
    which allows files to have names up to 255 alphanumeric characters. VFAT is the
    preferred filesystem for mounting foreign filesystems.


    # Network


    Linux filesystems can also span across a network that allows them to function
    as a client/server model that provides file-sharing services to systems remotely.
    The server component provides shared directories that can be accessed via network
    connectivity. The client component, after obtaining access, connects the directories
    to a mount point on the local filesystem. Within the Linux environment, the two
    primary network-based filesystems are the NFS and the Server Message Block Filesystem
    (SMBFS).


    NFS is a framework designed to allow a client workstation to access remote files
    over a network on a network-based server. In this model, the server shares one
    or more directories that can be accessed by a network client. NFS uses ports TCP
    2049 and UDP 2049.


    # Table 2.1 FAT Cluster and Partition Sizes


    | Name | Cluster Address Size | Partition Size |

    | FAT12 | 12 bits | 16 MB |

    | FAT16 | 16 bits | 2 GB |

    | FAT32 | 32 bits | 2 TB |'
