  md: '# NIS


    Network Information System (NIS) is another option for storing centralized user
    and other configuration files. It was originally called the yellow pages, so many
    NIS commands start with “yp.” NIS has a central directory of information containing
    users, groups, host names, and e-mail addresses as well as a plethora of other
    information. There is a database of configuration files that can be shared across
    the network, and /etc/passwd, /etc/group and /etc/shadow are shared, and a user
    can log-in on different workstations.


    # RADIUS


    Remote Authentication Dial In User Service (RADIUS) was originally developed for
    dial-in access via modems but is now used as centralized authentication and authorization
    system across networks. It is a client/server protocol with the client forwarding
    requests to the RADIUS server to grant or deny the request.


    # Two-factor Authentication


    Two-factor authentication refers to a requirement to provide two things when you
    log in, usually “something you know” – a password and “something you have” – an
    access token of some sort. Two-factor authentication makes it much harder to break
    into someone else’s account because guessing his or her password is no longer
    good enough.


    # SUMMARY OF EXAM OBJECTIVES


    Although “security” is frequently associated with “restrictions,” it is helpful
    to consider it in terms of “allowances.” To summarize, remember that the adduser
    command allows access to the system, chmod modifies how users can do with files,
    and groupadd can be used to create groups that can be used to share information.
    The su and sudo commands extend user privileges to allow administrative tasks,
    and ssh allows access to other systems. User account information can be shared
    between systems with ldap and nis, and authentication requirements can be customized
    using on a Linux system with pam.


    There are number of applications for observing the Linux system environment, including


    +   - Nessus and nmap for scanning networks

    - Wireshark for capturing packets on a network interface

    - Snort for watching a network for suspicious traffic

    - Tripwire to watch for suspicious file updates


    SELinux is used to limit what an application can do using MACs, and gpg can be
    used to encrypt information or to guarantee it hasn’t been altered.'
