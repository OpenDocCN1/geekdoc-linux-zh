    It can read data in blocks and only copy the portion of files that have changed,
    called delta-transfer, which means it won''t copy an entire file if a small part
    of it has been modified. rsync can be run using a remote shell or as a service,
    using its Transmission Control Protocol (TCP) socket and transport system.


    The basic sync for moving files using rsync is shown in Table 10.2.


