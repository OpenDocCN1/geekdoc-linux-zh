    # SUMMARY OF EXAM OBJECTIVES


    Linux filesystems provide the operating system with a framework for the storage,
    organization, removal, and retrieval of digital information. Filesystems are responsible
    for organizing and maintaining files, folders, metadata, and residual data as
    containers for storing digital information. In addition, you learned that different
