    # Swap


    Linux requires virtual memory to ensure its successful performance, which can
    exist as a file or an entire partition for storage. Virtual memory is accomplished
    by dividing the system''s physical RAM into units known as pages and transferring
    less used physical units of RAM (pages) to the hard disk drive using a process
    known as swapping. When the system swaps out pages of memory to the hard disk
    drive, the system''s RAM is freed to perform additional functions.


    Although swapping offers advantages by extending its access to more memory, pages
    stored and retrieved on the hard disk drive are accessed slower than pages that
    only resided in physical memory (RAM). For the Linux system to use swap space,
    a special file or swap partition must be created first. The creation of a swap
    file entails the creation of a special file, which must be designated to function
    as a swap file and is created with the dd command. Here is an example of the creation
    of empty swap.


    ```

    dd if=/dev/zero of=newfile bs=1024 count=1048576

    ```


