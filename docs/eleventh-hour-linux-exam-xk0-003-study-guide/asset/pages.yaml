    # FILESYSTEM MANAGEMENT


    There are tools to manage filesystems either locally or remotely, and these will
    be used by all system administrators, often on a daily or weekly basis.


    # Fast Facts


    The filesystem tools that you will need to learn for the exam and will likely
    use on a regular basis


    +   - du provides a summary of disk space used per file in the current directory
    and disk space allocated for files contained in any subdirectories.

    - df provides a summary of the amount disk space available on a filesystem in
    many different ways by using different arguments.

    - df -i displays information about inodes rather than file blocks.

    - df -h presents a disk space summary in an easy-to-understand output using kilobytes,
    megabytes, and/or gigabytes.

    - Filesystems need to be maintained and should be checked and, if necessary, repaired
    using the fsck command.

    - Filesystems need to be unmounted prior to running fsck.


    # Quotas


    Users and errant applications, without limitations, can continue to add data to
    a folder that would eventually use up all the available disk space on a partition.
    Once a partition is full of data, not only will users and applications be unable
    to save information to disk but damage to system or application files may also
    occur. The implementation of disk quotas can provide valuable filesystem management
    support to allow you to specify limits on disk storage that may be allocated to
    a user or a group of users.


    To implement disk quotas, you must add the following qualifiers "usrquota" and
    "grpquota" to each desired in the /etc/stab file and reboot the system. Then,
    the quotacheck command needs to execute the quota-selected filesystems and build
    a table of the current disk usage for each filesystem with disk quota enabled.
    This information is stored in aquota.group and aquota.user files. Finally, the
    edquota command, a quota editor, is used to display and change the various quota
    settings for one or more users or groups.'
