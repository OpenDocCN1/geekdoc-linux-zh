    # X11


    X11 is the common name for the X Windows system, which is the GUI found on most
    Linux distributions today.


    # Starting and Stopping X11


    There are a number of ways to start and stop the X Windows system. Normally, the
    display manager will be loaded automatically on boot, optionally by setting up
    the /etc/initab file to load the X Windows system when multiuser mode is used
    (runlevel 5). The actual display manager that will be used in the /etc/sysynit/displaymanager
    configuration file as shown below for the KDE environment:


    ```

    DISPLAYMANAGER="kdm4"

    ```


    When Linux is booted into a multiuser mode without a graphical login using the
    display manager, such as runlevel 3 in the /etc/initab file, you will have to
    start an X session from the command line. The X server and X session must be started,
    and this can be accomplished using startx, without without any parameters.


    The startx command will use configuration settings found in the .xinit file which
    default will be in /etc/X11/xinit directory; however, the user can customize the
    X session and launch default clients using a .xinit file located in their home
    directory. If you intend to use the display manager that was installed with your
    system, you do not need to use a customized .xinit file.


    The startx command itself be passed parameters which it passes to the X server
    before an X session is launched. One such parameter is the -depth option that
    will alter the number of colors used. This can be used during development or testing
    of X clients to ascertain how each will look on different hardware solutions.
    This may be useful if you are planning a large roll out across a variety of differing
    hardware. This will start an X session depth of 16.7 million colors.


    ```

    $ startx --depth 24

    ```


    The startx command can also be used to launch multiple X sessions in a number
    of virtual consoles. The complexity of multiple X sessions that it is not an everyday
    occurrence, and you may wish to be very familiar with X sessions'
