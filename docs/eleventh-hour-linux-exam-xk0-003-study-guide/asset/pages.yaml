    # Compiling and Installing Applications from Source


    Compiling and installing from source presents a terrific opportunity to tune applications
    to your specific hardware and software platform. This section starts with a description
    of how to include these hardware- and software-specific parameters and then continues
    through the process to compile and install the application. It concludes with
    prominent utilities for archiving and packaging source code: tar, bzip, and gzip.


    # CONFIGURING THE SOURCE


    We will discuss downloading the package archive later in the section, but suppose
    for now that you have the source in a suitable directory on your hard drive. The
    first place to look is to see if there are any readme or install files in the
    directory and read them. These usually contain very useful information on the
    software and often give details on how to install them with any specific options
    or dependencies that you may need.


    After reading the documentation, you need to change directories to the directory
    where the package is stored. You can then configure the package, which is usually
    achieved using the configure script by ./configure.


    The configure script is a shell script which configures the Makefile, which is
    used by the compilation tool make (described below). This Makefile will have information
