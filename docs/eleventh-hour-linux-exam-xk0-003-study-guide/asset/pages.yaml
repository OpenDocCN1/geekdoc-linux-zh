  md: '# CHAPTER 7 Installing Configuring as a Workstation


    # X SESSION MANAGER


    The state of the desktop or session at a given time is managed by the X Session
    Manager. This allows, for instance, a user to log out and log into a session and
    to have the same windows displayed. The session manager stores the state of all
    the windows on exit to restore them. Although the default session manager *xsm*
    can be used, specific session managers are often bundled with the display manager,
    such as *ksmanager* in KDE.


    # DISPLAY MANAGER


    The display manager runs as a program that allows the X server to start a session
    on a system, either local to or remotely. The display manager often prompts the
    user for a user name and password with an initial login screen, although it may
    be bypassed depending on the set up of the system (usually via KDE’s auto login
    feature). When it runs on a local system, it will start the X server before presenting
    the login screen. In a remote session, the display manager will act like a telnet
    server requesting a username and password for starting the remote session. The
    default display manager in X is the Windows Display Manager (XDM). The most popular
    alternative display managers are explained later. Alternative display managers
    are often used, as the default XDM is more complex to configure for the standard
    user.


    # KDM


    The display manager bundled with KDE is the KDE Display Manager. KDM is very configurable
    from the KDE control center, allows configuring screen color, menu options, styles,
    and so on. KDM was originally based on XDM. The main configuration file for KDM
    is often found in `/usr/share/kde/config` and is called *kdmrc*. KDM must be run
    before a user is logged in, so it is not associated with any user and user-specific
    configuration files are not possible. Users can however, change the appearance
    of their desktop once they are logged in.


    The graphical login manager within KDM is *The Greeting*, which can show a company
    logo, current system time, or perhaps nothing. Some or all users may be allowed
    to shutdown the system from this initial screen.


    # GDM


    GNOME was conceived slightly later than KDE and unlike KDM, this was written entirely
    from scratch and does not contain any original XDM code. Upon startup, the GDM
    daemon reads its local configuration file, `gdm.conf`. When there is more than
    one local display, each of these forks an Xserver and slave process. The initial
    process will start the display and calls *gdm* to prompt the user for a user name
    and password. Remote displays are managed using the X Display Manager Protocol,
    *XDMP*, typically running on port 177.


    The configuration file can be found in the file `/etc/gdm/gdm.conf` and the syntax
    within the file the standard GNOME syntax. The file contains a large number of
    options for the daemon configuration, security, remote and local GUI. When the
    system is installed, most of these are set up automatically.'
