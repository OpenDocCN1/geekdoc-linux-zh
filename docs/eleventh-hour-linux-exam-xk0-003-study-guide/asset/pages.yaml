  md: '# CHAPTER 1 Installing Linux


    +   - **ext3** The Third Extended Filesystem (ext3) expanded the ext2 filesystem.
    ext3 provides journaling support and is the default filesystem on many newer versions
    of Linux.

    - **ReiserFS** It performs faster than ext3 and ext2 and supports a larger maximum
    file structure (8TB).


    Another approach to assigning filesystems to partitions is via the use of the
    *mkfs* command tool. This command line tool assigns the filesystems (for example,
    ext2, ext3, and ReiserFS) to partitions. To assign the filesystem using the *mkfs*
    command, append the -t option followed by the desired filesystem type. For example:


    ```

    mkfs -t ext /dev/sda

    ```


    The assigning of partitions and filesystems to your hard drive may result in the
    filesystem or partitioning being corrupted or you may need to reclaim disk space
    from an empty and unmounted partition. To accomplish this task, you can use the
    *parted* command tool, which can be used in reclaiming disk space, but it will
    also copy a filesystem from one partition to another. During the partition creation
    process, *parted* will create the filesystem.


    To use this, boot the system and select *Rescue System* from the options presented.
    The system will allow you to log in as root (no password is required). To enter
    the *parted* command mode, type *parted* and the disk drive of interest. For example:
    *parted /dev/sda*.


    # DISK TYPES


    There are two additional disk types that need to be discussed: logical volume
    manager (LVM) and Redundant Array of Independent Disks (RAID). LVM is used to
    create logical volumes and RAID is used to improve performance and/fault tolerance
    of the disk subsystem. The LVM-based partition-based implementations can be configured
    on top of RAID or non-RAID systems.


    # LVM


    LVM-based installations offer a unique approach for creating virtual partitions
    (also known as logical volumes). The standard partition-based approach, after
    implementation, is hard to change. The LVM approach offers greater control of
    the disk environment because you can create virtual partitions that group physical
    partitions or disk drives together as one. The command-line tools for LVM are
    as follows:


    +   - *vgcreate* prepares physical volumes for use in LVM.

    - *vgcreate* creates and name volume groups.

    - *lvcreate* creates and names logical volumes used by filesystems.


    # RAID


    RAID uses your disk subsystem to provide enhanced read/write performance, protection
    against data loss due to disk failures, or both. It can be implemented'
