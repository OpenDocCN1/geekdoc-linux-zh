  md: '# BASH Commands


    Some commands will only accept a certain amount of input at a time, and the solution
    to this is to use xargs, which will accept the input stream and split it into
    chunks along a bit at a time and repeatedly running the downstream command. The
    following example will move all of Bob''s music files into his music directory:


    ```

    find -name "*.mp3" -u bob | xargs -i mv {} ./bob_mp3

    ```


    If you put a "; between two commands, they will run consecutively:


    ```

    do_this_first; then_do_this; and_final_this

    ```


    The "==" is used to compare the equivalence of two variables, often used in scripting.


    # Special Devices


    The /dev/null file is often called "the bit bucket," and is most often used to
    hide unnecessary output from a program embedded in a script. The /dev/random is
    the interface to the systems random number generator, and it will produce random
    numbers to create cryptographic keys using noise from various devices to maintain
    an "entropypool" to generate numbers.Applications that can get by psuedandom numbers
    can use /dev/urandom. The /dev/zero file works like /dev/null if you send data
    to it, but you can use it for an input stream to create fills of zeros.


    # Using System Documentation


    Linux offers many ways to find additional information for all of its commands.
    The quickest and most basic assistance comes from using the help option of any
    given command — usually both -t and -help work.


    > EXAM WARNING

    Remember when you are taking the Linux+ exam you will have to know about the Linux
    documentation systems, but unfortunately you would not have access to them.


    # DID YOU KNOW?


    +   - [command] will display a brief description of the command from information
    in /usr/share/man or /usr/share/doc. **manpath** lists the directory where **man**
    looks for information.

    - **apropos** searches pages to find what you want, for example, **apropos search**
    shows all the entries that have **search** in their description.

    - **whatis** displays one-line descriptions of a command from the man page.'
  merge: -1
