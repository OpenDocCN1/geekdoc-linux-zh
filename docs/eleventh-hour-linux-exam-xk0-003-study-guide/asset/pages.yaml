    # Special Permissions


    There are additional special permissions that are represented by a fourth octal
    number, in front of the normal three. Octal value of 4 is the setuid, 2 is the
    setgid, and 1 sets the sticky bit. They are set using the same chmod command as
    the normal bits, either using a four-digit octal value or the same method using
    letters, with the following additional letters:


    +   - X sets the user or group ID

    - s restricted deletion flag

    - t sticky bit


    Fast Facts


    The setuid or setgid bit be set on directories or executable files.


    +   - On directories, all files within the directory have the UID or GID of the
    directory.

    - Setting the bits allows for shared directories.

    - On executable files, the program runs with the privileges of the program owner
    or group membership of the program.

    - Using the setuid bit allows files to be run with administrator rights.


    # STICKY BIT


    When the sticky bit is set on a directory, files within that directory can only
    be renamed or deleted by their owner, the directories owner, or the system administrator.
    Without the sticky bit, any user with write and execute privileges in the directory
    could delete files.


    # SELINUX BASICS


    Operating systems are a complex set of modules, which will inevitably contain
    flaws that need to be patched at time during their lifecycle. The real risk is
    that someone figures out how to exploit a flaw or vulnerability in your system
    before you get a chance to patch it or even before the software provider realizes
    there is a problem and can fix it.'
  merge: -1
