  md: '# SCHEDULING TASKS


    In the following sections, you will learn how to put routine tasks on an automated
    schedule using cron and ad hoc tasks using at.


    # cron (cron allow, cron deny)


    For the routine tasks that need to be performed on a regular basis or predefined
    intervals, there is a scheduling service cron that lets you put these tasks on
    a schedule of your own design which runs in the background, checking every minute
    to see if there is anything scheduled to run. The /etc/cron.allow file lists the
    ONLY users able to edit cron configuration (crontab) files. If that is empty the
    system looks for /cron.deny file, which lists users barred from editing cron files.
    The root user is not affected by either.


    # crontab Command Syntax


    crontab files (cron table) tell what to run and when it is stored for users in
    /var/spool/cron, with the crontab name matching the username. administrators''
    files are kept in /etc/crontab, and there is a /etc/cron.d directory that programs
    can use to store their own schedule files.


    crontab files are edited using crontab -e with each line having six or seven fields
    and specifying one command.


    +   - The first five fields on each line tell which minute, hour, day, month,
    and weekday to run a command.

    - Next users specify whose rights to run the command under.

    - Lastly is the command itself.

    - Valid options for the schedule fields are a * (match anything), exact number,
    two numbers with a dash between them for a range of values, or a list of values
    separated by commas to match each single value.

    - crontab -l displays the contents of your crontab file.

    - crontab -r deletes it.


    # atq


    If you just want to run something a bit later, use the at command. It accepts
    commands from either a file (-f) or standard input, ending with a <ctrl> d. A
    single Ctrl + d is sufficient if there is nothing on the line. It takes two Ctrl
    + d''s there is more on the line. Use at to see what jobs are queued up, and their
    job numbers. To cancel a job, use atm followed by the job number you wanted canceled.'
  merge: -1
