    - timeout 5 – means wait 5 s before automatically booting the system.

    - timeout 10 – means wait 10 s before automatically booting the system.

    - timeout 0 – boot the default selection immediately |

    | title | This option indicates the setting displayed by the boot-menu title.
    Examples include:

    - title Linux

    - title Fallsafe

    - title GNOME User Interface |

    | root | This option provides a device or partition name indicating the location
    of the kernel and initrd files. Examples include:

    - root (hd0,0) – represents the first hard drive and the first partition.

    - root (hd0,1) – represents the first hard drive and the second partition |

