    # /proc


    The /proc filesystem is a virtual filesystem, which facilitates communication
    between the Linux kernel and the user processes. The /proc filesystem contains
    a number of directories that can organize the data and its virtual files. Virtual
    files can be read from or written to the /proc filesystem as a method of communicating
    with specific attributes in the kernel. Virtual files can share data from the
    kernel or user vice versa. There are a number of interesting files in the /proc
    filesystem such as cpinfo, which identifies the type and size of the processor
    installed in the kernel, and modules. A typical listing of the directory is shown
    in Figure 4.1.


