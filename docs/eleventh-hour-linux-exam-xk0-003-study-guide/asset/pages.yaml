    NICE

    A process has a priority value between –20 and +19 called niceness value. The
    lower the value, the faster it runs, and niceness is inherited from the parent
    process. The ps -al will show niceness in the NI column. The owner of a process
    can make it slower, freeing up resources, and only a system administrator can
    make it faster. There are two ways to adjust the niceness of a file: nice and
    renice. To start a process with an adjusted niceness, type the following:


