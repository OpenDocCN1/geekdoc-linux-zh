    Before deciding on how to layout your system, you will need to consider the following:


    +   - Physical hard disks have limitations imposed by the disk manufacturer (for
    example, disk geometry) and by the system manufacturer (for example, please, BIOS).

    - Primary partitions (maximum four per disk) divide the hard disk drive into physical
    groups.

    - Extended partitions can be subdivided into logical partitions (groups).'
