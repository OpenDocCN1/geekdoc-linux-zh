- img_proc: true
  md: '# CHAPTER 9 Securing Linux


    SELinux reduces the risk of these problems by implementing a system that limits
    what programs can do. Ideally no user or program should have access to anything
    than it needs to do its job—this is a standard security paradigm called *least
    privilege*. SELinux is not another Linux distribution, as it is built into the
    Kernel (from 2.6 onwards). It incorporates mandatory access controls (MAC), a
    mechanism that enforces least privilege by program. Normally, a Linux system uses
    discretionary access controls (DAC) that depend on the user to set the security
    level.


    Using DAC, a run program by a user will have access to everything that that user
    has. Therefore, if the root account (or a process that runs with that privilege)
    is compromised, the entire system would be compromised. With MAC, the security
    policies are mandatory and set by the system owner. Even with elevated privileges,
    the security policy on files and programs cannot be overridden.


    # Fast Facts


    To make it easier to set things up, SELinux provides three running modes:


    +   * **enabled**: SELinux is up and running, any forbidden actions are blocked.

    * **disabled**: SELinux is there but not turned on.

    * **permissive**: SELinux is up and running, with the rules in place, but when
    something forbidden is attempted, SELinux allows it.

    * **Initially**, SELinux sets to permissive mode to identify conflicts easily.


    # IMPLEMENTING PRIVILEGE ESCALATION


    As a system administrator, you need to be careful what you do; even a small typo
    can cause devastation. Consider the difference between `rm -r /tmp/test` and `rm
    -r /tmp/test`. The difference of a single space causes the system to try and delete
    every file on your machine. To protect your system as well as is to use the idea
    of "least privilege," it is advisable to use your system with normal user privileges
    whenever possible. When extra authority is called for, you can use privilege escalation.


    # Fast Facts


    There are two ways to escalate your privileges: *su* and *sudo*.


    +   * **sudo** is put in front of commands, and after you press the **Enter**
    key, it will ask for your regular user password and run the command as administrator.
    Once you authenticate, *sudo* will remember the password for a few minutes, so
    additional uses don''t ask for a password.'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'Only users who are listed in the/etc/sudoers file can use privilege escalation.
    It is recommended that you use visudo as root to make any changes, which opens
    the sudoers file in vi and protects it from simultaneous


    It is often easier to start an new command shell with administrative privileges
    with the su command. su uses the administrator password.


    # SECURITY APPLICATIONS AND UTILITIES


    The following tools are open source and available online and are all very complex
    and feature rich. For the exam, it is important to know what each tool is used
    for.


    > EXAM WARNING

    These tools are very useful for protecting your systems, but like any power tool,
    they can just as easily be misused. Be sure you have authorization – preferably
    before using them outside of your own test environment. The tools that send out
    packets are capable of sending information that can cripple or reboot your systems,
    which is a great way to test if a system is vulnerable, but could lead to a lot
    of problems. Please use these tools with care.


    # Fast Facts


    There are numerous tools to test for vulnerabilities on a system and to ascertain
    what ports are being listened to. The main ones are


    +   - nmap is a network scanning tool and is invaluable for seeing what is attached
    to your network. It can test for services or open network ports, finding unauthorized
    network devices and services testing firewalls.


