  md: '# CHAPTER 5 Using BASH


    +   - apropos and whatis a database created by mandb.

    - The database created by mandb may be handled by makewhatis on some distributions.

    - info is intended as an improved way to manage documentation for the GNU utilities
    and provides information in threaded chunks nodes.


    # Accessing Kernel and Architecture Information


    Linux uses a virtual file system located at /proc to represent activity within
    the computer, and it allows communication with various kernel and driver components.
    If you compare ps -a with ls /proc, you will notice that every process has its
    own subdirectory under /proc. There are also files for system hardware: cat /proc/cpuinfo
    tells you everything could want to know about your processor and /proc/version
    knows all the installed version of Linux. A slightly different way to check on
    your installed version is uname -a. Note that /proc/version shows the actual distribution
    name, whereas uname -a will show if you have a 32 or 64 bit process.


    All the settings in /proc/sys directory tree can be adjusted using sysctl. Changes
    are lost when the system reboots, and must be added to /etc/sysctl.conf to make
    them permanent. Use sysctl -p to change the system to reread the sysctl.conf file
    without having reboot.


    # Basic Scripting


    A script is a plain text file containing a collection of line programs and options
    that can be run as a group. Each line is read one at a time and interpreted, which
    can make scripts slow. Scripts need to have execute permission unless the sh command
    is used, which makes the sh executable and the script just a parameter.


    A bash script file expects a first line of #!/bin/bash and this script would like
    to be run with the bash shell located in the /bin directory.


    # Using Shell Features


    The bash shell provides a history feature that remembers commands you have previously
    entered, stored in a hidden file in your home directory: .bash_history and the
    entire list are viewed by typing history. Typing !! will repeat the last command.
    When you type history command line is preceded by a number; typing <command-number>
    replays the command corresponding to that. Another command line feature is tab
    completion. Bash will try and guess what you are attempting to type using Tab
    key. If you already have enough characters to uniquely identify the next word,
    bash will fill it in for you. If you have not typed enough of a word, a second
    press of the Tab key will display a list of possible matches for you.'
