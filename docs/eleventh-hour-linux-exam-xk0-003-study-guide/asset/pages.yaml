  md: '# CHAPTER 6 Installing Applications


    | Table 6.1 Main Linux Package Formats |

    |---||

    | .rpm | RPM Package Manager is used by Red Hat, openSUSE, Mandriva Linux, Mandrake,
    and many more. |

    | .deb | Debian package is used by Debian and Ubuntu, Knoppix. |

    | tgz or tar.gz | tar and gzip package is used by Slackware. |


    The packages can be found individually on various Web sites or installation disk
    also in software repositories, which are locations where the software packages
    can be found and downloaded. These repositories can vary from having a small number
    of packages (even one) on them or with a whole operating system on them.


    # Crunch Time


    You need to know and understand the following for the exam:


    +   - Packages contain a group of (usually) related program files.

    - Packages often have associated library files in them.

    - Packages can be binary or source files.

    - Dependencies are other packages a program needs installed.

    - Software repositories are locations where packages are located.


    # RPM


    RPM stands for RPM Package Manager and is a feature of Red Hat Linux and similar
    distributions. The basic rpm file is a precompiled binary package bundled with
    a script file, which can be used to build, install, remove, modify, and verify
    the software archives. RPM packages contain a complete archive of the files, along
    with a host of other information on the package, such as name, version, and checksums.
    In addition, there are scripts to include to install, upgrade, or remove the software,
    along with preinstallation and postinstallation scripts where necessary.


    The RPM system uses a database to hold and track all information, including the
    version of all the software that is installed. This basic information is held
    in /var/lib/rpm directory, and a sample listing of this directory is shown below:


    ```

    $ ls -l

    total 46184

    -rw-r--r-- 1 root root 2994176 2009-06-23 12:29 Basenames

    -rw-r--r-- 1 root root 12288 2009-06-23 12:29 Conflictname

    ```'
