    # Editing Files Using vi


    A good text editor is called vi and the enhanced version is called vim. The key
    to dealing with vi is understanding that it has three modes: Command, Ex, and
    Edit. When starting vi, you will be in Ex mode, which allows you to move around
    the file you are editing and to perform copy and paste commands and other advanced
    features like recording and playing macros. To actually enter text, you will need
    to shift into Edit mode by typing one of the edit keys, and then go back to Ex
    by pressing the Esc key. Command mode is entered from Ex mode by typing colon:)
    and is used to save files, enter a filename or text to be searched for. You can
    go back to Ex by pressing Esc.


    To transition to Edit mode, use the i to insert text in front of the cursor position,
    or o to insert text onto a new line below the line the cursor is. Once in Edit
    mode you can type text as you normally would. Press the Esc key to get back to
