  md: '# Backing Up and Restoring


    To illustrate


    ```

    dd if=/dev/cdrom of=/home/brian/cdbbackup.iso

    ```


    The option if designates the input file (the CD that is mounted in my CD-ROM drive),
    and of designates the output file, cdbackup.iso in my home directory.


    # Writing to Removable Media (CD-RW, DVD-WR)


    Creating CDs and DVDs is a commonplace activity that people do for a variety of
    reasons: backing up files on a computer, creating a photo CD, and transferring
    music and videos, among others. At a high level, there are two steps in the process
    of burning a CD or DVD:


    +   1. Create an image file for the CD or DVD, which involves creating filesystem
    on the medium and adding data to an image file.


    +   2. Apply the image to the CD or DVD.


    Regardless of the media, nothing can be stored until a filesystem has been created
    on it. Unlike a hard disk, CD or DVD-R is writeable once, which means that if
    you create the empty filesystem as a step by it, it will remain empty forever.
    Burning a CD or DVD involves creating a filesystem while transferring the media.
    The command that accomplishes the first part of the process – creating an image
    file (.iso file) that includes both the filesystem and the actual files that will
    be transferred to the medium – is mkisofs. You can use the following syntax for
    creating a typical CD or DVD:


    ```

    mkisofs -r o [filename of CD or DVD image.iso] [directory where files to be copied]

    ```


    The option -r sets the permissions of all files on the CD or DVD to be readable
    and enables RockRidge-extensions. If you do not use the -r option, the files will
    be created with the permissions that were assigned to them in their original locations.
    The second step is to apply the image to the CD or DVD using a separate program,
    cdrecord. The following syntax will mount your image at the mount point,


    ```

    mount -t iso9660 -o ro, loop=/dev/loop0 [filename of CD or DVD image]

    /cdrom

    ```


    The -t option, iso9660, identifies the filesystem of the image file as that of
    a CD or DVD. Once the CD or DVD image is mounted, you can navigate to the cdrom
    directory (using cd cdrom) and verify that you have included all the files you
    wanted and that the directory is sound. You will need to figure out the SCSI device
    address of your CD or DVD burner. as root, you can use the command cdrecord -scanbus
    (substituting the correct device) and then address if necessary:


    ```

    cdrecord dev=0,0,0 [filename of CD or DVD image.iso]

    ```'
