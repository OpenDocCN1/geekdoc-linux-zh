  md: '# File Permissions and Ownership


    | Table 9.2 Description of Options for chmod |

    | Who | Action | Permissions |

    | --- | --- | --- |

    | u for user | + add a permission | r for read |

    | g group | - to remove a permission | w for write |

    | o for everyone | = set all the permission bits as shown | x for execute |

    | a for all the above | | |


    > EXAM WARNING

    The execute bit has to be set before a binary executable file can be run, but
    because a script has to be opened for the interpreter to see the commands inside,
    it needs both the read and execute bits.


    The most useful options are the same as for chmod:


    +   - -R or --recursive makes changes in the subdirectory tree.

    - username:groupname filename changes the file''s owner to username and the group
    to groupname.

    - username:filename changes the file''s owner to username and change the group
    to the users primary group (note the colon after the username).

    - groupname:filename changes the group to groupname.


    You can use the numeric UID or GID in place of a username or groupname.


    CHGRP

    chgrp works as the chown :group and includes the same useful options of -R and
    --reference. Syntax is chgrp [OPTION] groupname filename.


    CHROOT

    chroot is a bit different than the preceding commands, as it doesn''t change any
    of a file''s attributes; instead, it changes how much of the file structure program
    is allowed to see. This does by redefining the top of the directory tree to you
