  md: '**Password** It can be alphanumeric, case sensitive, and should not contain
    any accented characters or umlauts. The system automatically checks'' for weak
    passwords.


    # # Installation Settings


    During installation, Linux is installed in accordance with the choices made previously.
    A number of Linux distributions, such as openSUSE, will display the choices you
    made prior to installation for you to confirm these and, optionally, modify them
    prior to installation occurring.


    The last step in the installation stage prepares your system to boot into the
    new Linux operating system, which includes copying of the system files to the
    system, saving any configurations, installing the Boot Manager, saving any installation
    settings, and finally preparing the system for the initial boot.


    # # INSTALLING ACROSS THE NETWORK


    Network source installation is slower than installing from local media due to
    limitation on network bandwidth.


    > Fast Facts


    For network installation, you need to remember:


    +   * Primary network protocols available are Hypertext Transfer Protocol (HTTP),
    File Transfer Protocol (FTP), Network File System (NFS), and Server Block (a protocol)
    (SMB).

    * Installation can occur from an Internet-based server using HTTP or FTP.

    * The targeted Linux system must be started from a network bootable CD or DVD
    image.

    * The IP-address or name of the server is required for HTTP, NFS, or FTP installations.

    * Installation can use an anonymous FTP server.


    The system will complete an on-board self test as before and the Linux kernel
    will provide you with various menu options for installing Linux and additional
    configuration options required prior to the installation process. While the desired
    network installation source is varied (for example, DVD, SLP, FTP, HTTP, SMB,
    Hard Disk) for the Linux+ Certification exam, we will concentrate on the HTTP,
    FTP, and NFS protocols.'
