  md: '# MAKE


    The utility make is used to automatically determine which components of a software
    package need to be complied and then to guide this compile process. make uses
    the makefile, which details the relationships among the files in the package and
    how to update these files. This will be undertaken from the data in the database
    and the last modification times of files. The executables are typically made up
    from object files, which are compiled from source files.


    Once you have the makefile after running compiling, then you can run make. This
    shell script is typically run initially with no options and will parse the makefile
    and update any files as necessary. If make completes, this will build a binary
    of the software package. This does not install the binary; that step is achieved
    in the last step using the command make install and will have to run with superuser
    privileges.


    If this exits without errors displayed, the software has been installed correctly.
    The configure script determines where the program will be installed, typically
    in /usr/local/bin. To clean up your system from the temporary files left by make,
    you can run the command make clean.


    # AUTONCONF


    The autoconf utility is a package of M4 macros that are used to build a set of
    shell scripts to automatically configure software source packages. The utility
    will create a configuration script from a template file listing the operating
    system features that the package uses. The generation of the configuration files
    is primarily to make the user''s experience easier, to ensure that the configure
    process is easier to use and less prone to errors.


    # Archive Files


    The tar format has been in existence since the early days of UNIX and the utility
    to use this file format was originally designed for tape archives (tar). tar is
    now a common method for archiving or collecting a large number of files into one
    larger file, while preserving all the file information, such as directory structures,
    dates, and group permissions. Files that are packed into this format have a naming
    structure of filename.tar. These large files can be compressed using a compression
    utility such as gzip, bzip, or compress. Depending on the compression utility
    used, the tar file will be renamed.


    +   - filename.tar becomes filename.tar.gz if gzip is used.

    - filename.tar becomes filename.tar.bz 2 if bzip/bzip2 is used.


    To create a tar file, the following general syntax can be used:


    ```

    tar -cvf filename.tar files|directories

    ```'
