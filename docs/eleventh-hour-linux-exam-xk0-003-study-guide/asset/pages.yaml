  md: '# CHAPTER 10 Troubleshooting and Maintaining Linux


    # SUMMARY OF EXAM OBJECTIVES


    There are so monitoring and measuring utilities available on Linux that there
    is no excuse not to monitor your system. The sar and top programs produce detailed
    reports on how different components of your system are performing at specified
    intervals and in real time, respectively. You will want to pay special attention
    to the programs that calculate and display the load average: top, w, and uptime,
    among others.


    Although monitoring will help you check on how things are going with your system,
    you will need to know where to go to find information when the inevitable happens
    and things go badly. There are many logs; which reside under the /var/log directory
    structure, and knowing the various logs /var/log is important. With the amount
    of data that is captured in each log, you need good searching and rafting tools
    like grep, sed, awk, and tail.


    Restoring data that has been lost due to a hard crash or user error is inevitable.
    Creating backup sets with tar and dump, restoring files with tar and restore,
    and using the dd command to create disk images and apply them to other media covered.


