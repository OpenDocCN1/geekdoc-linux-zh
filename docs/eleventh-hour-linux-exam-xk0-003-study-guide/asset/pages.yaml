  md: '# Installing, Removing, and Updating Programs


    # Package Querying


    The query command, -q, queries the rpm database and gives you data on the package.
    Information on all the packages installed can easily be displayed using rpm -qa,
    but the output will be very long and should be piped through more or less redirected
    to a file.


    # Package Removing


    Packages already installed on a system can be removed or erased with the -e option.
    For instance, removing the Telnet package above can be achieved thus:


    ```

