    The CUPS application can be summarized as performing the following actions.


    +   - Create and manage a queue for each printer.

    - Users will send print requests to CUPS and CUPS puts the job into the appropriate
    queue.

    - Each job will have a job request associated with it.

    - Users can cancel or pause their jobs.

    - CUPS assigns a program to each job to convert it into a printable form.

    - Jobs are activated in a first-in/first-out basis.

    - Completed jobs are removed from the queue by CUPS.


    # Enable and Disable Queues


    Each printer will have its own queue which will be managed to ensure that the
    jobs are printed in an orderly fashion. These queues can be enabled or disabled,
    even if there are items in the queue. This is often necessary if a printer has
    a problem that needs be fixed and the system administrator wants to disable the
    queue until the issue is corrected. A system administrator can also issue a comment
    to tell users why the printer is disabled.


    ```

    # cupsdisable -r "Printer maintenance is being performed" CANONMX

    ```


    The printer can be enabled using the command:


    ```

    # cupsenable CANONMX

    ```


    # WEB MANAGEMENT PORT (PORT 631)


    The interface to CUPS is via a Web interface that allows you to view print jobs
    and what printers are installed, and also to manage them. CUPS can be accessed
    via a Web interface on port 631, either locally or remotely. On the local machine,
    the interface can be accessed using the URL http://localhost:631. The interface
    is shown in Figure 7.1. In addition, there is a CUPS application program, which
    does not use a browser, but the look and feel is identical.


    There are some pages on the GUI that will require a user name and password to
    perform actions on them, such as to add a printer. On most Linux distributions,
    only root can add, modify, or delete a printer or class of printers.'
  merge: -1
