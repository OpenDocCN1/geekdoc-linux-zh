  md: '# CHAPTER 1 Installing Linux


    operating system services. The Linux kernel integrates the CPU architecture via
    a series of device drivers and kernel extensions.


    +   - Hardware components are presented as device drivers, and for each Linux
    distribution a unique Linux Hardware Compatibility List is created.


    For the Linux+ exam, you will need a fundamental understanding of the following
    components:


    +   - Power supply units (PSU) are the devices required to provide the various
    computer hardware components within your system with direct current (DC).

    - Motherboards are circuit boards housed inside system unit that contains the
    CPU, the memory (RAM) chips, and the slots available for expansion cards. Other
    expansion boards interface with it to receive power and provide bidirectional
    communications.

    - CPUs are responsible for data processing and controlling the functions performed
    by the various hardware components, process all software instructions issued,
    and determine the speed of the system.

    - Memory stores the data or programs that the CPU processes.

    - Expansion boards are devices that expand the capabilities of a computer by enabling
    a range of different devices.

    - Video adapters are expansion cards that translate binary into the images viewed
    on the computer monitor.

    - Storage devices are internal and external devices used for storing data and
    information.


    ![](img/53450e0f522134e838a034ce98470308_4_0.png)


    Although the Linux+ exam is not about the hardware, you need to have a basic understanding
    of the components to install and support Linux and be able to answer the following:


    +   - CPU make and architecture (32 or 64 bit)?

    - How much RAM (memory) do you have?

    - What installation media do you have (DVD/CD/network)?


