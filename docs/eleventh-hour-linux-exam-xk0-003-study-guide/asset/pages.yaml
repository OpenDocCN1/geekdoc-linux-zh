    # ## INTRODUCTION


    Initial operating system installation requires the understanding of important
    concepts including computer hardware, environment settings, partitions and network
    settings. Successful installations need good planning performed in advance.


    # ## A NOTE ABOUT HARDWARE


    Linux is supported on many different hardware platforms because of its flexible
    architecture and the support of the open source community.


    > Fast Facts


    The Linux hardware compatibility architecture is divided into four categories
    as follows:


    +   * Central processing unit (CPU) architectures supported continue to expand
    and include 32- and 64-bit Intel and AMD architectures, SPARC.

    * Hardware abstraction layer (HAL) is designed to function as a tier between the
    physical hardware and software functioning on the system. Its purpose is to hide
    hardware complexity and differences from the operating system.

    * The monolithic kernel architecture is designed to function dynamically and supports
    the loading of modules and instructions to implement all'
