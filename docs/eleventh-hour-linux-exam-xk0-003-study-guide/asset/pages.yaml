    \ is returned.\n\nThe following is the basic syntax for dump:\ndump -0 -A [archive\
    \ file]-f [destination file or device] [mountpoint of a filesystem or a list of\
    \ files and directories to be backed up\n\nIn the example above, the -0 option\
    \ tells dump to perform a full backup. The -A option is used to designate the\
    \ archive file, which is read by the restore command (described below) when restoring\
    \ the backup files. -f is used to identify the target file or device that will\
    \ host the \"dumped\" files.\n\n# RESTORE\n\nrestore performs a restore of files\
    \ that have been backed up by dump and can be used to restore a full backup of\
    \ a filesystem and apply any subsequent incremental backups. restore can be used\
    \ to restore individual files or directories across a full or partial backup archive\
    \ file and operate across a network to restore filesystems and directories on\
    \ remote systems.\n\nThe following code is the basic syntax for restore that will\
    \ restore all files from the identified archive (mounted at /dev/nst0) in the\
    \ current directory.\n\n```\nrestore rf /dev/nst0\n```\n\nIn this example, the\
    \ r option retrieves all files from the archive and the f option is used to designate\
    \ the archive (/dev/nst0).\n\n# DD\n\ndd is useful for making and copying disk\
    \ images, backing up and moving disks, and duplicating filesystems, as it makes\
    \ an exact clone of a hard disk, including all blank space. To use it, the source\
    \ disk must be unmounted and the output destination must be at least as large\
    \ as the source."
