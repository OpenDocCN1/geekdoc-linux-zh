    # FILE TYPES


    A proper understanding of linked files requires a little technical background
    information. Directories contain the names of the files that reside in them, and
    pointers to an inode. The inode stores the metadata for each file – the owner,
    size, access rights, time of modification, and where the data contained in each
    file is physically located. The extra layer of abstraction provided by the inode
    means that it is possible to have two different names that point to exactly the
    same file information. This is called a "hardlink" and is created as follows:
    In file_name hard_link_name


    The hard link is just as valid as a name as the original file name, and all hard
    links must be deleted before the space occupied by the file is freed. The nature
    of hard links does not permit hard links to directories or to files residing on
    separate drives.


    The soft link is an actual file, with its own inode and contains the path to the
    object the file links to. Soft links are allowed to point to directories and to
    files on other systems, but because they are independent files it is possible
    to delete the soft link and leave the file "broken", pointing to a nonexistent
    file. The ls -l command shows symbolic links with an "L" at the very first position
    in the row and with an arrow (→) pointing to the target file. Symbolic links are
    created as follows: In -s file_name soft_link_name


