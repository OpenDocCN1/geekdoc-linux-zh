    # Updating Software


    To update a software package that is already installed, you can use the `update`
    option within `yum`. For example, to update the `tclient` package you would type
    the command `su -c yum update tclient`


    If the software being updated is currently in use by the system, the application
    or service needs to be restarted before the update is made. The kernel can also
    be updated using yum, and these updates will only come into upon a restart of
    the system. When the kernel is updated, yum will retain the old version in order
    that the old kernel can be booted into case of an error with the new kernel. The
    current and previous versions are kept.


    Package groups can also be updated, for the MySQL Database package group is updated
    using the command `su -c yum groupinstall "MySQL Database"`.


    # Removing Software


    The removal of software is achieved using the `remove` option. Again, both packages
    and package groups can be removed. When this is invoked, yum checks the software
    package and the dependencies and removes both.


    ```

    su -c ''yum remove firefox''

    su -c ''yum groupinstall "MySQL Database"''

    ```


    When yum removes the software package, it leaves any user data in place, but the
    configuration files may be removed.


