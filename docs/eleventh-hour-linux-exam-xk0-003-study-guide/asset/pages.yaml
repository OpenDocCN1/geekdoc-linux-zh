  md: '+   3. Correct answer and explanation: B. Answer B is correct because n will
    display the percentage of memory usage.


    Incorrect answers and explanations: A, C, and D. Answer A is incorrect because
    M will display the CPU time in hundreds of seconds. Answer C is correct because
    k will sort by percentage of CPU utilization. D is incorrect because l displays
    utilization based on CPU time.


    +   4. Correct answer and explanation: B. Answer B is correct because the switch
    and parameters needed to collect the desired statistics -n DEV 600 6. The -n switch
    tells sar to capture network statistics, the next parameter, 600, specifies the
    interval in seconds, and the last interval, 6, specifies that six sets of statistics
    should be captured.


    Incorrect answers and explanations: A, C, and D. Answer A is incorrect because
    -A tells sar to capture all available system statistics. Answer C is incorrect
    because the last two parameters are inverted, which means that 600 sets of statistics
    will be captured at 6-s intervals. Answer D is incorrect because the -A switch
    is used, and the parameters are inverted.


    +   5. Correct answer and explanation: D. Answer D is correct because TCP ports
    1023 and above need to be open to ensure that all the connections required for
    active mode can be established.


    Incorrect answers and explanations: A, B, and C. Answer A and C are incorrect
    because active mode FTP uses TCP ports 1023 and above, not below. Answer B is
    incorrect because the connection could be established if the ports were open.'
