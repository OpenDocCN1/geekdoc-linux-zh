    The cpio program uses binary archive files. It has three basic modes:


    +   - copy-out mode creates an archive.

    - copy-in mode reads files from an archive.

    - copy-pass mode transfers files from place to another without creating the actually
    archive as a middle step.


    In copy-out mode, cpio accepts a list of files that you want to put into your
    archive from STDIN and sends the output to STDOUT, using cpio to require some
    command-line redirection. The output can be a regular file, device file, or network
    location.


    In copy-in mode, cpio reads an archive from STDIN and spits out into the current
    directory. The files to be extracted from the archive can be selected using a
    pattern, where pattern stands filename wildcard. The following commands demonstrate
    how this is done using cat cpio:


    ```

    cat archive_file | cpio -i "pattern"

    ```


    # TAR


    tar is used to store files and extract files from an archive, called a tarfile.
    This tarfile may be created and stored on any rewritable medium, such as a tape
    drive or hard drive. The following is the syntax for creating a tarfile with tar:


    ```

    tar c [ bBEeffhiklnoppqQwX [ 0-7 ] ] ] [ block ] [ tarfile ] [ exclude-file ]
    (-I include-file | -C directory | file | file )

    ```


