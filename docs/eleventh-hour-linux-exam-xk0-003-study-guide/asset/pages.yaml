  md: '# # CHAPTER 3

    # Booting Linux


    +   Exam objectives in this chapter

    * GRUB

    * Runlevels

    * Troubleshooting Boot Issues


    ## INTRODUCTION

    The Linux boot process starts when the system is powered up and the hardware is
    checked by the system BIOS and then determines what device (for example, floppy
    disk drive, hard disk drive, CD/DVD drive) will be used to boot the system. This
    first sector of the boot device contains the Linux bootstrapping program (for
    example, LILO, GRUB, NTLLOADER), although we will describe the Grand Unified Bootloader
    (GRUB) program, which we will use throughout this book. The system BIOS loads
    GRUB into memory and executes the program and system control is now transferred
    to the bootloader. The various processes are described in the following sections.


    > EXAM WARNING

    For the Linux+, the Linux booting process is based on the Intel x86 CPU architecture.
    Linux also supports the booting of other CPU hardware architectures (for example,
    AMD, Alpha, ARM, IA-64, m68k, MIPS, PA-RISC, PowerPC, S/390, SPARC), but the boot
    processes are different.


    ## GRUB

    GRUB is used for starting modern Linux operating systems and is the first program
    on any storage device that the computer executes. The purpose of the bootloader
    program is to perform a sequence of events on your computer to load the main operating
    system. In essence, the bootloader receives control from the system BIOS process,
    performs a sequence of events, and then transfers control to the operating kernel.'
  merge: -1
