    B. dump -xf /mount/usbhdd/michaelhdd.backup

    C. tar -xvf /mount/usbhdd/michaelhdd.backup

    D. restore -rf /mount/usbhdd/michaelhdd.archive


    +   3. Lately you have been hearing reports that your Linux server is slow to
    respond and you have a suspicion that there are applications that are consuming
    more than their fair share of the server’s memory. What key'
