  md: '# CHAPTER 6 Installing Applications


    # ADDING AND REMOVING REPOSITORIES


    There are thousands of software packages for Linux stored in software repositories,
    and the main repositories are usually set up at install time. If you are not connected
    to the Internet during the initial load of Linux, these may not be set up or be
    marked as inactive.


    # yum Repositories


    Software repositories can be defined on remote servers well as locally. The repositories
    are defined in the /etc/yum.conf file and in /etc/yum.repos directory. You can
    make a local repository by downloading the software from other repositories and
    setting up a local repository to save downloading these for a number of machines
    on your network. When you have downloaded the packages, you need to generate the
    correct information for a repository. This is achieved using createpo, which extracts
    all the data from the rpm files to generate the metadata for yum. The command
    to create the metadata from the /rpm_directory is


    ```

    createrepo /rpm_directory

    ```


    This can be included into the file in the /etc/yum.repo.d directory.


    > Fast Facts


    Depending on your environment, you may use different repositories depending on
    the actual use of the system.


    +   - For servers and general users, repositories for the stable distribution
    are recommended.

    - If you need the additional functionality of new, development, or unstable repositories,
    allow adequate time before deployment.

    - Users who add packages from any repository may make their system unstable and
    add work for your system administrators.


    # Adding a Repository in Debian


    The method of adding a repository that use the APT packaging tool is different.
    The file /etc/apt/sources.list contains a list of available software repositories,
    and it can be updated manually or (if installed) by a graphical manager. If you
    want to add a new repository, the format to follow is package type, Web address
    (URL), distribution, and section. For example, one of the lines in sources.list
    could be


    ```

    deb http://security.debian.org/ lenny/updates main contrib

    ```'
