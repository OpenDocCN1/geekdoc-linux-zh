  md: '# CHAPTER 8

    Installing, Configuring as a Server


    +   Exam objectives in this chapter

    * Network Services

    * Web Services

    * Application Services


    # INTRODUCTION


    Servers provide network services to clients, such as Domain name server (DNS)
    and Dynamic Host Configuration Protocol (DHCP), or they serve as an application
    server, such as printing and mail. The main network and application services are
    explained in this chapter.


    # NETWORK SERVICES


    There are many network services that can be deployed to a system, and this section
    will look at the most commonly deployed ones: DHCP, DNS, Network Time Protocol
    (NTP), and the interoperability with Microsoft Windows systems.


    # DHCP


    DHCP servers are used to configure Transmission Control Protocol/Internet Protocol
    (TCP/IP) parameters for a host as they connect to a network, including


    +   * IP address

    * Name servers

    * Configuring the routing, including the default route


    Fast Facts


    The main aspects of the DHCP you need to remember are as follows:


    +   * DHCP allocates IP addresses to hosts on a permanent or temporary basis.

    * Temporary IP addresses are said to be leased to a client by the server.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# CHAPTER 8 Installing, Configuring as a Server


    +   - Leased IP addresses can be renewed or relinquished.

    - The list of leases is kept in dhcpd.leases, usually in /var/db.

    - DHCP maximizes the usage of IP addresses available by allocating addresses on
    an as-needed basis.

    - DHCP servers usually have fixed or static IP address.


    # DHCP SERVER CONFIGURATION


    Before starting to configure the DHCP server, it is very important to understand
    your network and what parameters you will be configuring.


    > DID YOU KNOW?

    The basic parameters you will want to configure with DHCP are as follows:

    - Domain name

    - DNSes

    - Lease times

    - Routing

    - Static IP addresses

    - Logging

    - Primary or secondary DHCP server


    The configuration file for DHCP is /etc/dhcpd.conf. Each subnet that you are going
    to provide DHCP services must be defined in the file. The main options that can
    be used are described below:


    ```

    # Sample configuration file for dhcpd

    # Set the time a client can keep the IP address

    default-lease-time 600;

    max-lease-time 7200;

    # set the default gateway to be used by clients

    option routers 10.254.239.1;

    # Set-up the NTP server

    option ntp-server 10.254.239.6;

    # set the nameserver to be used by clients

    option domain-name-servers 10.254.239.5

    # This is a very basic subnet declaration.

    ```'
