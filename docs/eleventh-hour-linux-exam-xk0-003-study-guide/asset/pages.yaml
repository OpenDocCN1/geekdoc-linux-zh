  md: '# CHAPTER 4 Configuring the Base System


    The listing shows a series of numbered directories at the left-hand part of the
    screen for a process that is running on the computer. The directory labeled 1
    is for the first process initiated: the init process.


    > DID YOU KNOW?\ Although the list of compatible hardware is large and often configured
    correctly on installation, understanding how Linux configures devices is essential
    to support and maintain a system. In particular:

    - Use lsusb and lspci to interrogate and list hardware devices.

    - Loaded modules are listed using ismod.

    - modprobe can load and unload modules.

    - /sys contains files related to the kernel and firmware.

    - /proc is a virtual filesystem to communicate between the kernel and the user
    processes.


    # modprobe and modprobe.conf


    Devices can be detected during installation or when a new device is installed
    in a system. There are also a number of ways to initialize the hardware manually.


    +   - modprobe is the high-level handler for all modules, and it can be used to
    unload or load a new device''s kernel module.

    - The /etc/modprobe.conf local file can be edited to prompt the system to recognize
    and support the new hardware upon reboot.


    The base system uses the /proc/modprobe.conf file to load the modules, which should
    not be modified. This file appends the /etc/modprobe.conf.local to itself via
    an include statement. Once an entry has been added to the /etc/modprobe.conf.local
    and a reboot is undertaken, the system performs a module dependency check.


    As root, you can also manually load (and unload) a device''s kernel module using
    modprobe. This command will look in the /usr/lib/modules [kernel version] for
    all the modules and files except for the /etc/modprobe.conf configuration file
    and /etc/modprobe.d directory. If the module does not exist, modprobe generates
    an error. modprobe does not do anything to the module itself, all dependencies
    and the resolving of symbols are handled by the kernel itself. Kernel messages
    generated by a module failure will be displayed using the dmesg command.


    Each module may need one or more additional modules enabled to function correctly,
    and modprobe will check for these dependencies in the modules.dep file which is
    itself generated by the command depmod. dep file is located in the /lib/modules/''uname
    directory.'
  merge: -1
  pgno: 49
- img_proc: true
  md: "# /etc/modules.conf configuration file\n\nThe behavior of modprobe can be altered\
    \ by the optional /etc/modules.conf file. This file consists of a set of lines,\
    \ which looks similar to a shell script. This file will typically only exist if\
    \ you are installing kernel modules, which are not compiled directly into the\
    \ kernel and not handled by modprobe elsewhere.\n\n# NETWORKING\n\nIt is very\
    \ rare that a modern computer system is not connected to some form of network,\
    \ and this requires the setup of a network card and TCP/IP on your system.\n\n\
    # Configuring the Interface\n\nIf you are installing a network interface card\
    \ (NIC) or other hardware module, ensure that it is on the supported device list\
    \ for the Linux kernel you are installing. Most NICs will have one or more lights\
    \ to indicate whether it is working and connected. If you encounter an error,\
    \ use any diagnostics tools that are available to check out the device.\n\nWhen\
    \ you have installed the NIC and are confident that it is working, the NIC needs\
    \ to be configured. The two commands required when configuring NIC are ifconfig\
    \ and ifup. It should be noted that superuser privileges are required for some\
    \ of the options in the ifconfig, ifup, and ifdown commands. The ifconfig command\
    \ is very useful in displaying the status of a NIC, with part of the output shown:\n\
    \n```\n$ /sbin/ifconfig\neth0 Link encap:Ethernet Hardware 00:0D:56:E7:9D:B1\n\
    \  inet addr:192.168.1.38 Bcast:192.168.1.255\n  inet6 addr:fe80::20d:56ff:fee7:9db1/64\
    \ Scope:Link\n  UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1\n  RX packets:8773\
    \ errors:5 dropped:0 overflows:0 frame:5\n  TX packets:2722 errors:0 dropped:0\
    \ overflows:0 carrier:0 collisions:0 txqueue:1000\n  RX bytes:5185021 (4.9 Mb)\
    \ TX bytes:226856 (221.5 Kb)\nInterrupt:11\n```\n\nA number of actions to find\
    \ a non-working network card are listed below. With multiple NICs, the cards are\
    \ sequentially numbered eth0, eth1, and so on, and you must be sure you are manipulating\
    \ the correct device."
  merge: -1
  pgno: 50
- img_proc: true
  md: 'The NIC must be turned on for the system to recognize it, and you can achieve

    using `ifconfig` or `ifup` as shown below:


    ```

    ifconfig eth0 up

    ```


    ```

    ifup eth0

    ```


    Reconfiguring the IP and subnet mask of the device may require the NIC to be

    inactive or to be turned on and off. This can be achieved using `ifconfig` or
    `ifdown`nnas such:


    ```

    ifconfig eth0 down

    ```


    ```

    ifdown eth0

    ```


    > EXAM WARNING

    Remember that `ifconfig`, `ifup`, and `ifdown` are usually located in the /sbin
    directory,

    is not part of the path defined asPATH for most users. The full directory path
    may

    therefore be required to execute the commands.


    The IP address associated with the NIC can be assigned dynamically from a

    DHCP server, or it can have a static address assigned to it. To set a NIC to a
    spe-

    cific IP address, the command is


    ```

    ifconfig eth0 10.10.10.3 netmask 255.255.255.0

    ```


    # DHCP SETUP AND CONFIGURATION


    For the majority of devices, the use of DHCP will be the preferred option. The

    host running DHCP obtains an IP address by contacting a central server, which

    mtains the addresses for one or more clients. Once the client has contacted

    server, it will be assigned an IP address, subnet mask, and potentially other

    information such as the default route and IP address of the default NS. The inform-

    ation that is requested is stored in the configuration file /etc/dhclient.conf.


    A command-line DHCP client (/etc/dhcpcd), can also be used to configure the

    network interface. The Domain name server (DNS) information obtained from

    server will be written to resolv.conf or, if unavailable, directly to /etc/resol-

    conf. In larger networks, the DHCP server may also supply configuration data

    for Network Information Service (NIS) and Network Time Protocol (NTP), and

    these will be stored in /etc/yp.conf and /etc/ntpd.conf. These services will be

    stopped and started by dhcpcd to ensure that they are notified of the change.


    For support reasons, a number of other options are useful with the dhcpcd

    command:


    +   - release releases the current lease and deconfigures the interface.

    - renew attempts to renew the lease. These two commands are often done

    sequentially to check the connection to the DHCP server.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Networking


    +   - nogateway restricts any updating of the default route.

    - nontp stops ntp being updated.

    - nodes stops DNS information being updated in /etc/resolconf.


    DHCP alternative client is dhclient, which runs on startup and reads the /etc/dhclient.conf
    file. This file contains a list of all the network interfaces that to be configured
    in the current system. If the interface is configured using this client, it stores
    the DHCP lease in /var/lib/dhcp/dhclient.leases.


    # CONFIGURING A WIRELESS INTERFACE


    To display the status of all the wireless interfaces on a system, iwconfig with
    no parameters or the iwlist command in /usr/sbin. The wireless statistics are
    obtained from the /proc/net/wireless file.


    ![](img/53450e0f522134e838a034ce98470308_52_0.png)


    To set up a wireless NIC, the main parameters to use are as follows:


    +   - SSID sets the network name to enable the user to roam across a number of
    access points.

    - Mode needs to be setting on the network topology. The common parameters are
    Managed for a network of many access points, ad-hoc for point-to-point connection,
    and Master if the device will act as access point.

    - Key/enc is used to set the current encryption key and is entered in hex notation
    in the form XXXX-XXXX-XXXX-XXXX or as an ASCII string with the s: prefix.


    # NETWORK CONFIGURATION FILES


    There are a number of network configuration files in the systems that are modified
    automatically or manually. The files have comments embedded in them using the
    # symbol.


    # Hosts File, /etc/hosts


    The hosts files map IP addresses to host names and contains both IPv4 and IPv6
    addresses. For large networks, this is usually undertaken by DNS.


    # Services, /etc/services


    The services files map port numbers to services. A port is specific to an application
    and is the communication endpoint used by the transport layer protocols in the
    IP suite. Applications use these port numbers to ensure that the sending and receiving
    systems understand which application the packet is destined for.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Name Switch Service, /etc/nswitch.conf


    The Name Switch Service is used to tell the system service to use, with potentially
    a number of entries per service to allow for multiple “databases” and their lookup
    order to be specified. Typically, there will be entries for password, hosts, networks,
    and services among others. The typical entries are as follows:


    +   - nis: Use NIS or YP (formerly called Sun Yellow Pages)

    - dns: Use the Domain name server

    - files: Use the local files


    # Resolver File, /etc/resolv.conf


    The resolv.conf file will constructed automatically and will never need to be
    changed manually. It contains the list of one or more NSs, typically obtained
    from the DHCP service, with the format nameserver_IP_ADDRESS.


    # TCP/IP Ports


    There are a number of common networking ports that are used frequently. Ports
    0 through 1023 are defined as well-known ports. Registered ports are from 1024
    to 49151. The remainder of the ports from 49152 to 65535 are defined dynamically
    by applications. A brief description of the ports are as follows:


    +   - Port 20 and 21: FTP data and FTP control, respectively

    - Port 22: Remote login protocol secure (SSH)

    - Port 23: Telnet, used for accessing system remotely but is not very secure

    - Port 25: Simple Mail Transfer Protocol (SMTP) used by e-mail servers

    - Port 53: DNS protocol

    - Port 80: Used for accessing Web servers

    - Port 110: The POP service or Post Office Protocol used by local e-mail clients
    to retrieve mail from servers

    - Port 123: NTP to synchronize time with remote time servers

    - Port 143: E-mail clients can use the Internet Message Access Protocol (IMAP)
    to retrieve mail from servers

    - Port 443: This is the Hypertext Transfer Protocol (HTTPS) Secure that combines
    HTTP with a cryptographic protocol, which can be used for payment transactions
    and other secure transmission of data from Web pages.

    - Port 631: The Internet Printing Protocol (IPP) used to print printers remotely
    on the network

    - Port 3306: The standard port for MySQL.


    These ports are defined in the /etc/services file on Linux systems.


    # Managing Connectivity


    The descriptions above have outlined the basics of network connectivity and how
    to install a network card into a system. The following section builds on this
    knowledge and defines to manage the connectivity between systems in a network.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# ROUTING


    The setup of the IP address and associated data on each of the NICs within the
    system is only part of the required network configuration. The system needs to
    know where to route packets, and this is achieved using the route command, located
    in /sbin and after the interfaces have been set up.


    Any network interface will have an IP address and a subnet mask. The IP address
    will be in the 192.168.1.1 (for IPv4) or 2001:db9:0:567:1:1 (IPv6). The subnet
    mask identifies how many nodes are in that network, for instance, a class C network
    has 254 nodes. When a machine has communicate with another machine, it will decide
    how to route these packets to it. If it is on the local network, it can do so
    directly. Otherwise, to use an intermediate router to send the packets to. The
    route command used with no parameters displays the current routing table as shown
    below:


    ```

    $ syngress > /sbin/route

    ```


    | Destination | Genmask | Flags Metric Ref Use Iface |

    | 192.168.1.0 * | 255.255.255.0 | U | 1 | 0 | eth0 |

    | loopback * | 255.0.0.0 | U | 0 | 0 | lo |

    | default | 192.168.1.1 | UG | 0 | 0 | eth0 |


    The first column shows the IP or the host name. The default gateway for this machine
    is the default entry and where packets are sent if no route exists for a destination.
    The Genmask defines the Netmask for that particular network. The flags column
    can have a number of options, with U being the route enabled and G specifying
    that the destination requires a gateway. The other notable column is Iface. This
    column specifies which interface is used for that route.


    The route command can add to the routing tables and specify a host or a network
    as a destination, with the default being a host. The most common route to add
    is that of the default gateway as


    ```

    $sbin/route add default 192.168.1.1

    ```


    If the interface has just been configured using the ifconfig command, the network
    may have to be added by hand


    ```

    $sbin/route add -net 192.168.1.0 netmask 255.255.255.0 dev eth1

    ```


    # IPTABLES


    iptables is a user space program for system administrators and usually installed
    as /usr/sbin/iptables. It is used to configure the tables, rules, and filters
    to control the treatment of network packets into and out of the system. It uses
    the Xtables framework, which is used by Netfilter. The Xtables is kernel-level
