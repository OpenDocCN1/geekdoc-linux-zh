    ## 文件类型


    正确理解链接文件需要一些技术背景信息。目录包含存储其中的文件名，以及指向 inode（索引节点）的指针。inode 存储了每个文件的元数据——所有者、大小、访问权限、修改时间以及每个文件中数据在物理上的位置。inode
    提供的额外抽象层意味着可能有两个不同的名称指向完全相同的文件信息。这被称为“硬链接”，通过以下方式创建：`ln file_name hard_link_name`。


    硬链接与原始文件名一样具有同样的有效性，并且在释放文件占用的空间之前，必须删除所有硬链接。硬链接的性质不允许创建目录的硬链接，也不允许指向位于单独驱动器上的文件硬链接。


    软链接（符号链接）是一个实际的文件，有它自己的 inode，并包含文件链接的对象的路径。软链接允许指向目录和其他系统上的文件，但由于它们是独立的文件，可能会删除软链接并导致文件“损坏”，指向一个不存在的文件。`ls
    -l` 命令显示的符号链接在行的最左侧位置有一个“L”，并带有一个指向目标文件的箭头（→）。符号链接通过以下方式创建：`ln -s file_name soft_link_name`。


    ## 设备文件


    任何能够向你的 Linux 系统进出移动信息的设备，在 /dev 目录下都有一个设备文件。这种处理设备的方式让用户很容易发送或接收信息；他们只需要写入（或读取）适当的文件。


    块设备文件以大块在连接到系统的硬件之间进出，并使用缓冲区提高效率，例如硬盘、USB 和带带器。字符设备文件一次移动一个字符且无缓冲。注意，dev 中的并不是每个文件都对应当前连接的设备；大多数只是等待新设备指向的占位符。


    命名管道 FIFO（先进先出）是用于计算机内运行程序之间通信的缓冲区。一个打开管道写入，另一个读取，数据在它们之间传输。


    特殊文件使用 `mknod` 命令创建，分别用于字符、块和管道文件：


    ```

    mknod new_device_c [major_device_number] [minor_device_number]

    mknod new_file_b [major_device_number] [minor_device_number]

    mknod new_pipe_name p

    ```


    通常，只有在手动安装设备驱动程序时才会手动创建特殊文件，安装时应该包含带有附加信息的详细说明。


    ## 测试文件


    文件通常有扩展名来指示其内容，这可能并不显而易见，且文件可以使用语法 [filename] 进行排序。如图 5.1 所示。


    测试评估类似于 `test -1 -gt 2`，结果以退出值的形式返回，可以在脚本中检查以做出决策。`test` 命令的力量展示了更多有趣的选项，例如 `test
    -e [filename]` 用于检查文件是否存在以便覆盖它，以及 `test -d [directory_name]` 查看它是否为目录。


    `ls -F` 命令列出带有各种类型标记的文件以便识别。虽然 `file` 和 `test` 命令在脚本更有用，但 `ls -F` 对人类更有帮助，并用特殊字符分类文件，例如
    / 表示目录，@ 表示链接，* 表示可执行文件。


    ## 使用 vi 编辑文件


    良好的文本编辑器被称为 vi，增强版本称为 vim。处理 vi 的关键在于理解它的三种模式：命令模式、Ex 模式和编辑模式。启动 vi 时，你处于 Ex 模式，该模式允许你在编辑的文件中移动并执行复制粘贴命令以及录制和播放宏等高级功能。要实际输入文本，你需要通过输入一个编辑键切换到编辑模式，然后按
    Esc 键返回 Ex 模式。


    要切换到编辑模式，使用 `i` 在光标位置前插入文本，或使用 `o` 在光标所在下方新起一行插入文本。进入编辑模式后，你可以像平常一样输入文本。按 Esc
    键回到 Ex 模式。


