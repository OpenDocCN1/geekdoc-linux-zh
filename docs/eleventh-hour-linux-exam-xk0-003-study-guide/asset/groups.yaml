    View Network Statistics


    # Fast Facts


    You can control the collection of current information by appending two numbers-
    at the end of the command.


    +   - The first will set the collection interval in seconds.

    - The second tells how many times it should gather the information.

    - sar -n DEV 5 4 shows network statistics for 5-s time periods a total of four
    times.


    # IOSTAT


    The iostat command shows both CPU and disk utilization statistics and can also
    show remote Network File System (NFS) drive systems. It was covered in Chapter
    5, "Using BASH."


    # VMSTAT


    The vmstat command uses information in /proc/meminfo, /proc/stat, and /proc/*stat
    to show virtual memory and other system usage statistics, including disk and processor
    usage. vmstat can be followed with two numbers indicating how long to wait and
    how many times to run. Memory statistics using units of'
  - '[PAGE 150]


    # Analyzing Logs 153


    blocks equate to 1024 bytes of memory block in current Linux kernels. Using vmstat
    without options gives a brief overview of memory and CPU statistics. -d option
    shows more detailed statistics related to the disk drives in the system.


    # UPTIME


    The uptime command gives a quick one-line display showing the current system,
    how long the system has been up, the current number of users, and the load average
    over the last 1, 5, and 15 min. The load average is a count of processes currently
    being handled by the processor or waiting to be.


    # TOP


    The top command shows a current tally of system usage and an ongoing list of processes.
    This is covered in Chapter 5, “Using BASH."


    # Load Average


    Many of the commands that show system utilization three numbers that represent
    the system load average. You can see it in the upper section of the top command
    and on the end of the uptime command, and it also shows up in the w command.


    > EXAM WARNING

    nYou may have noticed in the exam objectives that the focus is on commands; however,

    there are several key statistics that are objectives as well, load average being
    one.

    should be familiar with the commands to know which ones will display load average
    and

    other utilization statistics.


    The load average is a three part statistic that indicates, on average, how many
    processes are currently running or waiting to be run by the processor and is essentially
    a count of how many programs are waiting to run at a given moment, with a damping
    factor to give a more accurate time-weighted average. The 1-min average has a
    smaller damping factor and is allowed to swing more quickly, whereas the 15-min
    average has a higher damping factor and gives a better long-term overview of the
    system load.


    # ANALYZING LOGS


    A record of events is kept in a variety of log files, and these files can be crucial
    for troubleshooting problems, tracking down failures, and finding security issues.
    Different distributions may have slightly different log files and directory structures.
    The syslog configuration is defined in the /etc/syslog.conf and is to determine
    which system processes record their events to what files and what level of logging
    to use.'
