    using hardware specific RAID controllers (Hardware RAID) or functionality embedded
    within the operating system (Software RAID).


    # DID YOU KNOW?


    RAID subsystems require two or more disks to form one virtual disk. The differences
    between software and hardware RAID solutions are as follows:


    +   - Hardware-based RAID performs faster than the software-based RAID implementation
    because software-based RAID requires more CPU time and has additional requirements.

    - Software-based RAID is operating system dependent and hardware-based RAID is
    vendor independent.

    - Hardware-based RAID may be more expensive than software-based RAID as it may
    require additional hardware components (for example, RAID controllers), unless
    incorporated on your motherboard.


    RAID technology requires an understanding of three basic concepts: striping, mirroring,
    and parity. Striping joins the hard drives together to form one large disk drive.
    For example, 300 MB drives joined in a striping array will form a 900 MB drive.
    Striping writes every data of all the disks contained in the array and will eventually
    read data from all disks contained in the array, increasing overall disk subsystem
    performance. The downside of striping is that it does not provide any fault tolerance.


    Mirroring forms one disk whose size is determined by the smallest one, and the
    data is written to both drives, providing a level of redundancy in the one drive
    crashes. The disadvantage of mirroring is the impact of having to record the same
    data twice across different drives which reduces the disk subsystem performance.
    Parity stores information in the disk array subsystem that can be used to rebuild
    files or lost data in the event one of the disks in the disk subsystem array fails.
    Unlike striping and mirroring, parity requires a minimum of three disks inside
    the disk array subsystem. Each of these techniques is assigned a different RAID
    level.


    # RAID Levels


    Each RAID level offers advantages and disadvantages. In general, the partitions
    should be stored on different drives to get the performance and fault tolerance
    you want. RAID levels can be concatenated (also known as nested) which means the
    common RAID level numbers are combined with other RAID levels, sometimes with
    a “+" between. For example, RAID 10 (or RAID 1+0) consists of a RAID level 1 disk
    array subsystem, each of which is one of the “drives” of a level 0 disk array
    subsystem.'
