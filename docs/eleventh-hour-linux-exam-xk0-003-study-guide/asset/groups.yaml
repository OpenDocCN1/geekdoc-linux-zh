    # Filesystem Management


    After the disk system is implemented, a summarized disk quota review for a filesystem
    is available using the repquota command, which creates a summarized disk quota
    report. The report includes a summary of the disk quotas for the specified filesystems
    and summaries for the current number of files and amount of disk space per user.
    Finally, in case of a system crash and other filesystem failures, the quotacheck
    command is used to scan a filesystem for disk quota use and to create, and, if
    necessary, repair disk quota systems.


    # Loopback Device


    Linux offers support for a loopback device, which supports the transformation
    of a special file containing an image of another filesystem into a device that
    can be used like any partition or device. Linux loopback devices are commonly
    used for CD/DVD ISO images. The disk created of the CD/DVD disc contains the UDF
    or ISO 9660 filesystem format. Prior to accessing the loopback device, the ISO
    image must be downloaded and mounted. The Linux mount command is used to attach
    the virtual filesystem image.


    # NFS


    NFS is a client/server model designed to make specific directories on a server
    available to a subset of clients or all clients on a network. The server-side
    must configure directories for sharing, known as exports, and the client-side
    must be configured for mounting exports. The shares (exports) made available via
    /etc/exports file. This file contains a listing of directories (exports) and the
    client machines that mount the exports. Each line represents a shared directory
    and any associated options (for example, permissions).


    The parameters for each line are as follows:


    ```

    exported_directory <client> <options> <clientN> (<options>)

    ```


    +   - exported_directory is the directory where the exporting is on the server.

    - <client1> is the host or network to which the exporting is shared for access.
    The client1 parameter can be based on Internet Protocol (IP) address, host or
    name for a single host; a wildcard (*) for group of machines; or an IP range.

    - <options> are those imposed on the connection, which include read-only (ro),
    read-write (rw), root_squash (to prevent remove root access), no_squashing (to
    allow remove root access), and others.


    To activate the access of shared directories (exports), the exports command can
    be used. The set of arguments can be used with the command:


    +   -a To load and export all directories listed in /etc/exports file

    -r Rereads the /etc/exports file after changes have been made to the share permissions

    -i Ignores the /etc/exports file and a directory not listed in the file

    -u Removes (unset) currently listed exported directories

    -au Removes all exported directories'
