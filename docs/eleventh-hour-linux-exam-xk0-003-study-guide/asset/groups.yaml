    # LEAD AUTHOR


    Graham Speake (CISSP #56073, M.Inst. ISP) is a risk management consultant with
    BP, one of the world''s largest energy companies. He currently provides risk assessment
    and remediation consultancy to BP operating units throughout the world. His specialties
    include industrial automation and process security, penetration testing, network
    and network design. Graham is a frequent speaker at security conferences and often
    presents security training to BP staff around the world. Graham''s background
    includes positions as a consultant at ATOS/Origin and is an engineer at the Ford
    Motor Company.


    Graham holds a bachelor''s degree from the Swansea University in Wales and is
    a member of the ISA. Graham was born in the United Kingdom, but now lives in Houston,
    Texas, with his wife, Lorraine and daughter.


    # CONTRIBUTING AUTHORS


    Brian Barber (Linux+, MCSE, MCSA, MCP+I, MCNE, CNE, CNA-GW) works for the Canada
    Deposit Insurance Corporation (CDIC) as a project manager and architect for CDIC''s
    service management program. He first started using Linux at Home and has then
    been a staunch advocate of open source software, belonging to the Ottawa Linux
    User Group (OCLUG) since 2001 and the Ottawa Python Authors Group. His primary
    areas of interest are operating systems, infrastructure design, multiplatform
    integration, directory services, and enterprise messaging. In the past, he has
    held the positions of Principal Consultant with Sierra Systems Group Inc., Senior
    Coordinator with LG Group Inc. (now part of IBM Global Services), and Senior Technical
    Analyst at MetLife Canada.


    He has been coauthor, technical editor, or lead for over 15 books and certification
    guides. He is an experienced instructor and courseware developer. Recently, he
    was a Contributing Technical Editor for Cisco Router and Switch Forensics: Investigating
    and Analyzing Malicious Network Activity (ISBN: 978-15979-418-2, Syngress), and
    Cisco CCNA/CCENT Exam 640-802, 640-822, 640-816 Preparation Kit (ISBN: 978-15979-306-2,
    Syngress).


    Terrence V. Lillard (Linux, CISSP) is an IT security architect and an expert in
    cybercrime and cyber forensics. He is actively involved in compromise, intrusion,
    network, and cybersecurity cyber forensics cases, including investigations, security
    audits, and assessments both nationally and internationally. Terrence has testified
    in U.S. District Court as a Computer Forensics/Security Expert Witness. He has
    designed and implemented security architectures for various government, military,
    and multinational corporations. Terrence’s background includes positions as principal
    consultant at Microsoft, the IT Security Operations manager for the District of
    Columbia’s government IT Security Team, and instructor at the Defense Cyber Center’s
    (DC3) Computer Investigation Training Academy program. he has taught IT security
    and cyber/cyberforensics at the undergraduate and graduate level.


    He holds a B.S. in Electrical Engineering, Master of Business Administration (MBA),
    and is currently pursuing a Ph.D. in Information Security.


    **Chris Happel** has over 20 years of experience with voice and data networking
    and security. He is currently a managing consultant for Liberty Trio, LLC, and
    is an avid supporter of GNU/Linux and open source software.


    # TECHNICAL EDITOR


    **Kevin Riggins** (CISSP, CCNA) is a Senior Information Security Analyst with
    over 20 years of experience in information technology and over 10 years of experience
    in information security. Kevin has used and managed Linux systems since 1995.
    Kevin has technical and strategic experience in a broad range of technologies
    and systems. Kevin currently leads the Security Review and Consulting team at
    Principal Financial Group which performs information security risk assessments
    and provides information security consulting services for all business units of
    The Principal. He holds a B.A. in Computer Science from Simpson College, Indianola,
    IA, is is a member of ISSA, Infragard, and is the author of the Infosec Ramblings
    blog.


