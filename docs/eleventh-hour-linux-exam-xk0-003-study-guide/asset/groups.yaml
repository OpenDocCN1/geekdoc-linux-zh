    # # CHAPTER 9

    Securing Linux


    +   ### Exam objectives in this chapter

    * Managing and Monitoring User and Group Accounts

    * File Permissions and Ownership

    * SELinux Basics

    * Implementing Privilege Escalation

    * Security Applications and Utilities

    * Checksum and File Verification Utilities

    * Implementing Remote Access

    * Authentication Methods


    # ## INTRODUCTION


    Linux is regarded as a secure operating system; however, even the secure systems
    can have an occasional flaw or be misconfigured, and security is best applied
    in layers. In this chapter, we''ll look at the tasks necessary to make sure your
    Linux systems live up to their secure reputation.


    # ## MANAGING AND MONITORING USER AND GROUP ACCOUNTS


    It''s critical to be able to control who gets access to what information to maintain
    security and may be a legal requirement. Limiting user accounts protects information
    and also protects the system itself, from both malice and simple errors.


    # ### Tools


    The following tools are used to create and manage user accounts.'
  - '[PAGE 131]


    # CHAPTER 9 Securing Linux


    USERADD


    There are a number of steps involved in adding users, and these may include the
    following:


    +   1. Define the new user in /etc/passwd, and create a User Identification number
    (UID). The system uses UIDs to refer to the user internally.

    2. Create a password for the user bin /etc/shadow file.

    3. Define a new group in /etc/group and create a Group Identification number (GID).

    4. Create a new home directory for the user, set the file permissions on it, and
    copy the default startup files to it.

    5. Set up the users e-mail account.


    Although it is entirely possible to do each of these steps by hand, the useradd
    tool automates them. The syntax is useradd [options] username.


    Good options to know are


    +   - b or --base-dir: location of the home directory.

    - m or --create-home: create a home directory for the user, and copy the basic
    user settings files from /etc/skel.


    A number of other parameters can be set in the /etc/login.defs and /etc/default/useradd
    files, including


    +   - Range of UID and GID numbers

    - Location of the users e-mail file

    - Account and password time limits


    USERDEL


    userdel deletes a user, and the syntax is userdel [options] username.


    The options are


    +   -r or --remove deletes the user''s home directory and his her e-mail spool.

    - --f or --force deletes the user account even if they are currently logged in,
    deletes the home directory even if other users may be sharing it, and deletes
    a group that matches the usner even if it is used by others on the system.


    Note that neither of these will remove files outside of a user''s home directory.


    USERMOD


    usermod changes (modifies) a user account, and syntax is usermod [options] username.'
  - '[PAGE 132]


    # Managing and Monitoring User and Group Accounts


    Options include


    +   - -l or --login changes a username.

    - -d or --home changes the users home directory; use -m to move their files to
    the new location.

    - -u or --uid and -g or --gid changes the UID and default group number but doesn''t
    actually change the ownership information of any existing files they may have.

    - -G or --group[1,group2,...] changes the groups that the user is a member of.
    The user is removed from any groups unless listed -a or --append is also used.

    - -L or --lock and -U or --unlock options lock and unlock the account.


    # Crunch Time


    As well as the above commands, there are some that work on groups only:


    +   - groupadd creates groups, using the unused GID number; -g or --gid lets you
    pick a specific number.

    - groupdel deletes groups, removing them from /etc/group and (if used) /etc/gshadow
    but won''t let


    you remove a user''s primary group, groupdel won''t change the actual GID information
    on existing files, and if the GID gets reused, you may get unexpected access or
    other security issues.

    group changes a group''s GID or groupname, with -g or --gid changing the GID and
    -n or --newname newgroup to change the name.


    # PASSWD


    Users can use passwd to change their own password, or system administrators can
    change passwords on their behalf or reset a forgotten password by providing the
    username. passwd can also be used to lock and unlock accounts with -l and -u.


    > EXAM WARNINGnpasswd isn''t actually listed on the CompTIA list of exam topics,
    but they refer to "lock," so it is advisable to be familiar with both usermod
    -l and passwd -l.


    # WHO AND WHOAMI


    who lists the usernames of people logged into your system and can show where remote
    users are logged in and the number of users. who works looking in the /var/run/utmp
    file, which keeps track of who is logged into the system.

    The whoami command simply prints your username.'
