    +   - Partial backups are divided into differential and incremental.


    +   - Differential backups contain everything that has changed since the last
    complete backup.


    +   - Incremental backups copy everything that has changed since the last backup.


    +   - To restore data from incremental backups, you need the last complete backup
    and all the incremental backups.


    # Copying Data


    File-level copies of data over a network can be done using rsync and FTP. By copying
