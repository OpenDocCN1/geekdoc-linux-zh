    SAMBA


    Samba will implement the basic Server Message Block/Common Internet File System
    (SMB/CIFS) services, namely:


    +   * File and print services

    * Authentication and authorization

    * Name resolution

    * Browsing or service announcement


    Users may wish to share all of their files and allow only certain users to access
    (authentication and authorization). All these are handled by the daemon that is
    included within Samba.


    > Fast Facts


    The two daemons included with Samba are smbd and nmbd.


    +   * smbd handles file and printer sharing, including user access (authentication
    and authorization).

    * nmbd undertakes name resolution on a point-to-point basis or broadcast basis,
    using the NetBIOS protocol.

    * In broadcast mode, an nmbd client will send out a request to all machines on
    the network, asking for a particular service.

    * The other name resolution element of the nmbd daemon revolves around the NetBIOS
    Name Service (NBNS) or Windows Internet Name Service (WINS).

    * Within NBNS, there is a master server that holds the IP address and NetBIOS
    name of each client or server on the network and will serve these upon request.

    * The network browsing or service announcement part of Samba is also handled by
    the nmbd daemon.

    * There is one local master browser (LMB) on a network that holds the list of
    available services and provide these upon request. These lists can be populated
    across domains via domain master browsers (DMBs).


