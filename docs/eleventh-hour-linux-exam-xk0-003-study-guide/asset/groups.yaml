    device. This allows the mounting of an ISO image, so you can view/edit the files
    before burning a CD or DVD.

    Incorrect answers and explanations: B, C, and D. Answer B is incorrect because
    the linux echo command will return feedback to the monitor. Answer C does not
    exist. Answer D is the network adaptor address for testing network connectivity.


    - 4. Correct answer and explanation: Answer C is correct; swapon is the Linux
    command used to designate a specific file or partition for swapping.

    Incorrect answers and explanations: A, B, and D. Answer A is incorrect; / swap
    is a precreated swap partition created during the initial installation. Answer
    B is incorrect because it is an invalid Linux command.


    - 5. Correct answer and explanation: Answer D is correct; exportfs is the Linux
    command used to activate the share of shared NFS directories on the NFS server.

    Incorrect answers and explanations: A, B, and C. Answer A is incorrect; GRUB is
    the Linux bootloader program. Answer B is incorrect; fdisk is the Linux command
    used to partition a storage device. Answer C is incorrect; swapon is the Linux
