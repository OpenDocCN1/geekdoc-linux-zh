    # 实现远程访问


    从他那里核实信息。密钥生成过程只需执行一次。密钥共享可以通过面对面或使用密钥托管服务完成。


    - 文件的接收者获取发送者的公钥并将其导入其系统。

    - 当接收者收到文件时，他或她使用存储的发送者公钥对文件进行解密或仅进行身份验证。


    # 实现远程访问


    下面定义了安全的远程访问方法。


    ## SSH


    尽管 Telnet 仍然可用，但访问远程系统上命令行 shell的首选方法是安全外壳（SSH）。使用 ssh 客户端连接到运行 ssh 守护进程的远程系统。ssh
    的语法为 `[OPTIONS] [username@]hostname [command]`。


    连接 server1 的基本连通方法是输入 `ssh server1`，这假设你想在远程系统上使用相同的用户名，就像你使用本地用户名一样。若要使用不同的用户名登录远程系统，可以使用
    `-l username` 选项，或者将用户名放在主机之前，中间用 `@` 隔，例如：`ssh bob@server1`。


    第一次使用 ssh 连接到主机时，会显示新主机的签名，ssh 会询问你是否想将签名添加到已知主机列表中。


    ## 安全隧道


    ssh 可以捕获发往 TCP 端口的流量，通过其加密连接传递，并将其交给远程端的 TCP 端口（无论是加密的还是未加密的网络流量）。这被称为转发或隧道化。


    要创建一个隧道，你需要知道远程服务器上你想要选择的服务 TCP 端口，并在你的本地服务上选择一个未使用的 TCP 端口。语法如下：


    ```

    ssh -Local_tcp_port:localhost:remote_tcp_port remote_host_name

    ```


    ## SFTP


    可以使用 sftp 代替文件传输协议（FTP），因为后者不使用任何加密技术。一旦你登录到远程系统，就可以使用 sftp 命令发送和接收文件。通过这种方式连接的语法与普通
    ssh 相同。


    ## 快速上手点


    SFTP 命令与 BASH 和 FTP 均相似，包括：


    - `cd path` 更改远程目录。

    - `ls` 查看远程目录的内容。

    - `put` 将文件从本地复制到远程机器。

    - `get` 将文件从远程机器复制到本地。

    - `bye` 或 `quit` 退出 sftp。


    ## X11 转发


    ssh 的一个功能是 X11 转发，它本质上与之前讨论的 TCP 端口转发相同。它允许将你的 ssh 服务器连接到远程客户端，使得运行在终端的程序可以在你的本地屏幕上绘制图形界面。要测试它，使用
    ssh 登录远程主机（如果未启用 X11 转发则使用 `ssh -X`），并执行具有图形界面的程序。你可能想在命令末尾添加 `&` 以在后台运行。


    ## 密钥生成


    `ssh-keygen` 命令用于创建公/私钥对。一旦将公钥放置在远程主机上，ssh 就会使用这些密钥验证你的登录，不再需要密码。步骤如下：


    - 1. 使用 `ssh-keygen` 创建密钥对。

    - 2. 从你的用户家目录 `.ssh/id_rsa.pub` 将公钥复制到远程用户家目录 `.ssh/authorized_keys`。

    - 3. ssh 在登录时会检查匹配的密钥，如果找到，则不会询问密码。


    一旦密钥到位，可以配置 ssh 要求使用公/私钥进行远程登录，只要你的密钥保持安全且不丢失，这就是一个非常安全的系统。


    ## 身份验证方法


    身份验证是系统在你输入用户名和密码时用于确定你是否应该获得访问权限的过程。它分为两种基本因素：


    - 本地身份验证限于单台计算机。它知道你是谁，但其他计算机并不知道。在几台计算机上易于设置和管理，但扩展性较差。

    - 集中式身份验证允许将用户信息和其他设置收集到单一仓库中，然后从受信任的计算机进行访问。集中式系统的配置可能复杂得多，但它使大型计算机网络的管理变得简单得多。


    ## PAM


    可插身份验证模块（PAM）为 Linux 程序和服务提供动态的身份验证请求。模块化设计意味着实现某些新的身份验证技术（如指纹扫描仪）或策略（如强制密码复杂性）与插入适当模块并通过更新相应的配置文件告诉系统使用它们一样简单。每个身份验证程序都有自己的
    PAM 配置文件。配置文件存储在 `/etc/pam.d` 目录下。


    ## 快速上手点


    PAM 涵盖了四组管理任务：


    - 身份验证模块（Authentication modules）验证用户。

    - 账户模块（Account modules）检查账户仍然有效，跟踪密码、账户过期时间和当天等项。

    - 会话模块（Session modules）处理与用户会话启动和关闭相关的任务。在用户通过验证之前，会话无法启动。

    - 密码模块（Password modules）用于更新密码或其他身份验证机制，并可以强制密码强度。


    每个 PAM 配置文件列出了管理任务的类型、执行任务时检查哪些模块，以及一个指示通过模块测试是否为强制或可选（或其他等）的控制项。实际的 PAM 模块存储在
    `/lib/security/` 中。


    ## LDAP


    轻量目录访问协议（LDAP）用于在 TCP/IP 上查询和修改目录服务。目录可以被视为一组对象，每个对象都有自己的属性，这些属性按层次结构组织。LDAP 目录树使用
    DNS 来构建这种层次结构，而这种结构之下可以是组织、系统、个人甚至是打印机。


    LDAP 系统通常使用独立的 LDAP 守护进程；`slapd` 提供存储用户信息的服务器功能。个人工作站需要通过 PAM 插件或邮件客户端访问 `slapd`
    目录。


    ## NIS


    网络信息系统（NIS）是存储集中用户和其他配置文件的另一种选择。它最初被称为“黄页”，因此许多 NIS 命令以 `yp` 开头。NIS 有一个包含用户、组、主机名、电子邮件地址以及大量信息的数据库。`/etc/passwd`、`/etc/group`
    和 `/etc/shadow` 在网络范围内共享，用户可以在不同的工作站登录。


    远程认证拨入用户服务（RADIUS）最初为通过调制解调器的拨入访问开发，现在用于网络的集中认证和授权系统。它是一种客户端/服务器协议，将请求转发给 RADIUS
    服务器以授予或拒绝请求。


    ## 双因素身份验证


    双因素身份验证是指登录时需要提供两种东西，通常是“你知道的”（密码）和“你拥有的”（某种访问令牌）。双因素身份验证让破解他人的账户变得困难得多，因为仅猜密码已经不够了。


    ## 考试目标总结


    尽管“安全”经常与“限制”联系在一起，但从“允许”的角度来考虑会有帮助。总结一下，记住 `adduser` 命令允许访问系统，`chmod` 修改用户对文件的操作权限，`groupadd`
    可创建用于共享信息的组。`su` 和 `sudo` 命令扩展用户权限以执行管理任务，`ssh` 允许访问其他系统。用户账户信息可以通过 ldap 和 nis
    在系统间共享，身份验证要求可以通过 pam 在 Linux 系统进行自定义。


    许多应用程序用于观察 Linux 系统环境，包括：


    - Nessus 和 nmap 用于扫描网络

    - Wireshark 用于在网络接口捕获数据包

