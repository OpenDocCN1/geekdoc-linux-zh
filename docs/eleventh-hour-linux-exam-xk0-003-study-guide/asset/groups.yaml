    ## 第 2 章 管理文件系统


    `showmount` 命令可确定服务器上共享目录（导出）的信息，并列出 `/etc/exports` 文件中列出的所有正在服务器上共享的导出项。`showmount`
    命令的语法为 `showmount [options] [server1]`。


    `server1` 的默认值为 `hostname` 返回的值。在不带任何选项的情况下，`showmount` 显示从主机挂载目录的客户端。表 2.4 显示了一些可用选项。


    要与服务器建立连接，客户端可以使用 `mount` 命令。以下演示了客户端如何建立 NFS 连接：


    ```

    mount server1:share /mount_point

    ```


    这使得切换到 `/mount_point` 目录后就可以访问 server1 上 `/share` 目录下的所有文件。通过在 `/etc/fstab` 文件中插入一行，可以在启动时建立到
    NFS 共享的自动挂载连接。


    ## Swap（交换）


    Linux 需要虚拟内存来确保其成功运行，虚拟内存可以文件或整个分区的形式存在。虚拟内存通过将系统的物理 RAM 分为称为“页”（pages）的单元，并通过一种被称为“交换”（swapping）的过程将较少使用的物理
    RAM 单元（页）传输到硬盘驱动器来实现。当系统将内存页交换到硬盘时，系统的 RAM 会被释放以执行额外的功能。


    虽然交换通过扩展对更多内存的访问提供了优势，但存储和检索在硬盘上的页的访问速度比仅位于物理内存（RAM）中的页慢。Linux 系统要使用交换空间，必须先创建一个特殊文件或交换分区。创建交换文件涉及创建一个特殊文件，该文件必须被指定作为交换文件使用，并使用
    `dd` 命令创建。以下是创建空空间的示例。


    ```

    dd if=/dev/zero of=newfile bs=1024 count=1048576

    ```


    | 表 2.4 Showmount 选项 | |

    |---|---|

    | Showmount 选项 | 目的 |

    | -a, --all | 使用 hostname:directory 格式，其中 hostname 是客户端名称，directory 是挂载的目录 |

    | -d, --directories | 列出客户端挂载的目录 |

    | -e, --exports | 打印服务器导出的文件系统列表 |

    | -h, --help | 提供帮助摘要 |


    该命令创建了一个名为 `newswapfile` 的交换文件。输入文件 `/dev/zero` 是提供空字符的特殊 Linux 文件。新创建的交换文件大小为
    1 GB。


    要指定一个分区或特殊文件作为交换空间，使用 `mkswap` 命令。该命令在分区或特殊文件上设置交换区域。以下命令首先准备一个分区，然后准备一个特殊文件作为交换文件：


    ```

    mkswap /dev/hdb1

    mkswap /newswapfile

    ```


    `swapon` 命令用于指定进行分页和交换的特定设备或文件。对于分区，您需要以 root 身份使用 `swapon` 命令对其进行准备：

    swap/dev/hdb1


    要禁用或关闭交换文件或交换分区，`swapoff` 命令会禁用指定分区或文件上的交换。当使用 `-a` 标志时，将禁用所有已知交换设备和文件的交换。`swapoff
    -s` 命令将显示当前状态。


    ## 考试目标总结


    Linux 文件系统为操作系统提供了一个存储、组织、删除和检索数字信息的框架。文件系统负责通过组织和维护文件、文件夹、元数据和残留数据，作为存储数字信息的容器。此外，你还学习了用于本地和网络访问的不同文件系统类型（例如
    SMB 和 NFS）。


    你学习了使用 `mount` 命令挂载和卸载文件系统。文件系统在 `/etc/fstab` 文件中自动定义。在创建分区后，必须将文件系统分配给分区。Linux
    `mkfs` 命令将文件系统分配给分区。Linux 文件系统是一种用于组织目录（文件夹）和文件的分级结构，并基于 FHS（文件层次结构）。文件系统管理描述了管理本地和远程文件系统所需的工具。讨论了确定已用和剩余磁盘空间（例如
    `du` 和 `df`）以及实施和管理用户磁盘空间限制的各种命令（例如 `edquota`、`quotacheck` 和 `repquota`）。此外，还描述了使用
    `fsck` 命令修复损坏的文件系统、挂载唯一的回环文件系统、访问 NFS 文件系统以及使用 Linux 命令 `mkswap`、`swapon`、`swapoff`
    和 `swapinfo` 准备交换文件或分区。


    ## 五大难题


    -   1. 你需要使用 `fdisk` 为你想要添加额外存储空间的新 SCSI 磁盘驱动器建立分区。原始驱动器都是 IDE 驱动器。正确的语法是哪个？

    A. `fdisk /dev/SCSI1`

    B. `fdisk /dev/IDE`

    C. `fdisk /dev/sda`

    D. `fdisk /dev/sdb`


    -   2. 系统初始启动时，哪个文件会自动挂载文件系统？

    A. `/etc/fstab`

    B. `/boot/fstab`

    C. `/dev/devices.map`

    D. `/etc/grub.conf`


    -   3. 什么是 ISO 回环设备（loopback device）？

    A. 将特殊文件转换为虚拟 Linux 文件系统

    B. 向显示器返回反馈测试的设备

    C. /null 驱动设备

    D. IP 地址 127.0.0.1


    -   4. 哪个 Linux 命令用于指定进行分页和交换的特定设备或文件？

    A. `/swap`

    B. `swap`

    C. `swapon`

    D. GRUB


    -   5. Linux `export` 命令的目的是什么？

    A. 作为 Linux 启动加载器运行

    B. 分区存储设备

    C. 指定特定文件或分区用于交换

    D. 激活共享目录的共享


    ## 答案


    -   1. 正确答案及解释：答案 C 是正确的；第一块磁盘的 SCSI 设备表示法为 `/dev/sda`。

    错误答案及解释：A、B 和 D。答案 A 和 B 是错误的，因为它们不存在作为设备名称。答案 D 是错误的；第二块磁盘的 SCSI 设备表示法为 `/dev/sdb`。


    -   2. 正确答案及解释：答案 A 是正确的；`/etc/fstab` 文件用于定义和自动挂载文件系统。

    错误答案及解释：B、C 和 D。答案 B 是错误的，因为该文件不存在。答案 C 和 D 是 GRUB 加载内核时使用的文件。


    -   3. 正确答案及解释：答案 A 是正确的。Linux 操作系统支持一种称为回环设备的特殊类型文件系统。这允许挂载 ISO 镜像，以便你可以在刻录 CD
    或 DVD 之前查看/编辑文件。

    错误答案及解释：B、C 和 D。答案 B 是错误的，因为 Linux `echo` 命令会向显示器返回反馈。答案 C 不存在。答案 D 是测试网络连接的网络适配地址。


    -   4. 正确答案及解释：答案 C 是正确的；`swapon` 是用于指定特定文件或分区交换的 Linux 命令。

    错误答案及解释：A、B 和 D。答案 A 是错误的；`/swap` 是初始安装时创建的交换分区。答案 B 是错误的，这是一个无效 Linux 命令。


    -   5. 正确答案及解释：答案 D 是正确的；`exportfs` 是用于在 NFS 服务器上激活共享目录共享的 Linux 命令。

    错误答案及解释：A、B 和 C。答案 A 是错误的；GRUB 是 Linux 启动加载程序。答案 B 是错误的；`fdisk` 是用于分区存储设备的 Linux
    命令。答案 C 是错误的；`swapon` 是用于指定特定文件或分区交换的 Linux 命令。


