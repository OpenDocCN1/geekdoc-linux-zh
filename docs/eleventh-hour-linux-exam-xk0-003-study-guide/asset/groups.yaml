    \ 将 GRUB 加载到内存并执行该程序，此时系统控制权已移交给引导加载程序。接下来的章节将描述各种过程。\n\n> 考试警告\n> 对于 Linux+，Linux\
    \ 启动过程基于 Intel x86 CPU 架构。Linux 也支持其他 CPU 硬件架构的启动（例如 AMD, Alpha, ARM, IA-64, m68k,\
    \ MIPS, PA-RISC, PowerPC, S/390, SPARC），但启动过程是不同的。\n\n## GRUB\nGRUB 用于启动现代 Linux\
    \ 操作系统，是计算机在任何存储设备上执行的第一个程序。引导加载程序的目的是在你的计算机上执行一系列操作以加载主操作系统。本质上，引导加载程序从系统 BIOS\
    \ 进程接收控制权，执行一系列操作，然后将控制权移交给操作系统内核。\n\n大多数现代引导加载程序都是动态可配置的，并可以在系统启动期间和之后执行。引导加载程序可以在启动时读取预定义的配置文件，也可以通过启动命令提示符支持启动时的更改（例如，选择不同的内核、虚拟文件系统）。此外，在控制权移交给操作系统内核后，引导加载程序可以对启动时的配置文件以及之前的文件进行修改。\n\
    \n## 安装 GRUB 并启动 Linux\n\n在执行 GRUB 之前，系统 BIOS 将主引导记录 (MBR) 加载到内存并执行其内容。MBR 的总大小为\
