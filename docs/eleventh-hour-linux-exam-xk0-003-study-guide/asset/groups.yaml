    ## 移除软件包


    系统中已安装的软件包可以使用 `-e` 选项移除或擦除。例如，移除上述 Telnet 包可以这样实现：


    ```

    rpm -e telnetd-0.17-23.i386

    ```


    > ### 你知道吗？

    Linux 中最广泛使用的两种软件包类型是 rpm 和 deb。

    - 两者都允许用户安装、更新、移除和查询软件。

    - 可以使用额外工具解决依赖关系（例如 yum 和 APT）。

    - 使用 rpm 的 "e" 选项移除或擦除软件包。

    - 使用 dpkg 的 "r" 选项移除软件包。


    ## YUM


    有一个用于 rpm 软件包的自动安装、移除和更新实用，称为 yellowdog updater modified (yum)。使用 yum 的优点是它可以自动解决依赖关系。Fedora
    提供了若干软件仓库，并预配置为与三个仓库工作：


    - Base 仓库（基础仓库）包含 Fedora 版本，通常位于您的安装介质上。

    - Updates（更新）包含基础包的所有更新。

    - Extras（额外）包含用户可能想要安装的大量额外软件。


    此外，还有开发仓库可用，其中包含最新的代码，这些代码可能并不稳定。和 rpm 一样，执行 yum 需要超级用户权限。


    ## 使用 yum 安装软件


    你可以使用 yum 安装新的软件软件包或包组。以下显示了单个软件包（firefox）和包组（MySQL database）的命令。


    ```

    su -c ''yum install firefox''

    su -c ''yum groupinstall "MySQL Database"''

    ```


    当 yum 命令执行时，它会检查任何依赖关系，解决它们，然后安装指定的软件包。依赖检查需要是递归的，因此会对要安装的新软件包进行依赖关系检查，以此此类推。


    > 考试警告

    当你安装一个服务时，Linux 系统不会启动。你必须配置该服务在启动时运行，这可以通过命令行使用 `chkconfig` 和 service 命令来实现。


    ## 更新软件


    要更新已安装的软件软件包，可以使用 yum 中的 `update` 选项。例如，要更新 `tclient` 软件包，你需要输入命令 `su -c yum update
    tclient`。


    如果正在更新的软件当前被系统使用，则在进行更新之前需要重启应用程序或服务。内核也可以使用 yum 更新，这些更新只有在系统重启后才会生效。当内核更新时，yum
    将保留旧版本，以便在新内核出现错误时可以进入旧内核。当前版本和之前的版本会被保留。


    包组也可以进行更新，对于 MySQL Database 包组，使用命令 `su -c yum groupinstall "MySQL Database"`
    进行更新。


    ## 移除软件


    软件的移除通过 `remove` 选项实现。同样，软件包和包组都可以被移除。当调用此命令时，yum 会检查软件软件包及其依赖关系并移除两者。


    ```

    su -c ''yum remove firefox''

    su -c ''yum groupinstall "MySQL Database"''

    ```


    当 yum 移除软件软件包时，它会保留任何用户数据，但可能会移除配置文件。


    ## deb


    基于 Debian 的 Linux 发行版基于 GNU 项目，Debian 软件包可能类似于 rpm 软件包。有类型的仓库：


    - Stable（稳定版）：包含最稳定且经过测试的软件包。

    - Testing（测试版）：包含为未来稳定版本进行测试的软件包。

    - Unstable（不稳定版）：包含最新的、可能不稳定的软件包。


    ## 安装、移除和更新程序（续）


    Debian 软件包管理器称为 dpkg。安装软件包请使用：


    ```

    dpkg -i package_name

    ```


    移除软件包请使用：


    ```

    dpkg -r package_name

    ```


    更新软件包请使用：


    ```

    dpkg -U package_name

    ```


