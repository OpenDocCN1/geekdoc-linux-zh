    ## 运行级别 (RUNLEVELS)


    本节介绍了 `init` 程序的功能和七个运行级别。


    ## init 命令


    `init` 命令负责执行运行级别，是启动过程的最后一步。它将通过进程 ID 1 来标识。它负责启动在 `/etc/inittab` 文件定义的系统进程。


    ## 运行级别 (Runlevels)


    运行级别是特殊的脚本，通过执行 root 管理和用户访问的各种服务或进程来定义计算机系统的启动或停止。通过特权用户运行 `teleinit` 或 `init`
    来更改运行级别，这会向 `init` 发送相应的信号。


    共有七种不同的运行级别，编号从 0 到 6，尽管运行级别 4 并不经常使用。


    ![](img/53450e0f522134e838a034ce98470308_35_0.png)


    了解运行级别及其每个级别的设计用途非常重要，最重要的描述如下：


    - 0 终止所有程序并关闭系统。

    - 1 用于单用户模式；也可以使用 s 或 S。

    - 2 用于不带网络连接的多用户模式。

    - 3 用于带网络连接的多用户模式，并在命令行模式下启动。

    - 5 启动带有网络连接的运行级别，并启动图形形图形化用户界面 (GUI)。

    - 6 重启系统。


    大多数系统将默认运行级别设置为 3 或 5。


    为了执行运行级别，`/etc/init.d` 目录中有两类脚本，通过符号链接进行调用。第一组脚本由 `init` 命令执行，在系统启动过程中或每当你启动关闭过程时启动。这些脚本包含在
    `/etc/initab` 文件中，如图 3.4 所示。默认运行级别位于 `/etc/initabb`。默认运行级别项在文件中的格式如下：


    ```

    id:5:initdefault:

    ```


    对于图 3.4 所示的文件，运行级别配置为在多用户模式下启动，并提供网络连接和窗口管理器的 X 支持。该文件还指示了搜索要执行特定服务或程序的子目录。对于默认运行级别，`/etc/init.d/rc5d`
    是包含默认和服务程序脚本的目录。每个运行级别都包含在运行级别启动和停止时执行的脚本。包含用于停止运行级别的脚本的文件以大写字母 "S" 开头。第二组以 "K"
    开头的脚本在运行级别从一个切换到另一个时每次都会执行。调用 `/etc/init.d/rc` 文件是为了确保脚本按正确的顺序执行。


