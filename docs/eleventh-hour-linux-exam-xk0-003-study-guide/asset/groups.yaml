    # 第 6 章


    ## 安装应用程序


    ### 本章学习目标

    - 安装、删除和更新程序

    - 添加和删除存储库


    # 引言


    一旦安装并配置了 Linux，作为管理员，大部分时间将花在安装、配置、支持和删除应用程序上。本章将通过各种方法和工具带你了解这些过程，其中两种最常用的软件包管理工具是
    APT 和 Red Hat 包管理器 (RPM)。当你需要安装未打包的应用程序时，将需要从源代码进行编译和安装。


    ## 安装、删除和更新程序


    在 Linux 系统中，有许多方法安装程序或软件包，正如 Linux 中已的主要方法一样。软件包可以被视为打包成一个归档文件的组，你使用的软件包格式完全取决于你运行的
    Linux 发行版。通常需要安装一个或多个库或支持包才能运行。这些额外的包被称为依赖项，因为主程序依赖它们才能工作。如果你已经安装了这些依赖项，则不需要重新安装。


    原则上，软件包有两种类型：二进制包和源码包。源码包需要为你的系统进行编译和构建，而二进制包已经针对特定的安装进行了编译。分发和管理特定发行版二进制文件的实用程序称为包管理器。表
    6.1 显示了最常见的管理器。


    | 表 6.1 主要 Linux 软件包格式 |

    | :--- | :--- |

    | .rpm | RPM 包管理器被 Red Hat、openSUSE、Mandriva Linux、Mandra 等许多系统使用。 |

    | .deb | Debian 包被 Debian 和 Ubuntu、Knoppix 使用。 |

    | tgz 或 tar.gz | tar 和 gzip 软件包被 Slackware 使用。 |


    可以在各种网站或安装磁盘上单独找到软件包，也可以在软件存储库中找到，存储库是查找下载软件包的地方。这些存储库的软件包从很少（一个）到一个整个系统不等。


    # 关键点


    你需要知道并理解以下内容：


    - 软件包包含一组（通常是）相关文件。

    - 软件包通常包含库文件。

    - 软件包可以是二进制或源码文件。

    - 依赖项是程序所需的其他软件包。

    - 存储库是软件包所在的位置。


    RPM 代表 Package Manager，是 Red Hat Linux 类似发行版的特性。基本的 rpm 文件是一个预编译的二进制包，包含一个脚本用于安装、升级或删除软件。RPM
    系统使用数据库来跟踪所有信息，这些基本信息存储在 /var/lib/rpm目录中，该目录的示例所示：


    ```

