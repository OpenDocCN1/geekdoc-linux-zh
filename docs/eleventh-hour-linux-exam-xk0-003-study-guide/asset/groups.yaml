    CUPS allows the user to group printers together and this collection of printers
    is called a *class*. This is particularly of interest in a company who has a number
    of printers and they can be grouped in areas, such as finance, admin, and so forth.
    This allows printers to be offline for maintenance and the user will not notice
    any disruption or need to remember the names of different printers in their area.
    The adding and management of printer classes is undertaken in the Administration
    tab of the CUPS GUI.


    > > **DID YOU KNOW?**

    Although we have discussed CUPS in terms of Linux, it is a cross-platform software
    application.

    - CUPS can run on Microsoft Windows and Apple platforms as well.

    - The application can manage local and remote printers – even across the Internet.

    - The Web-based GUI allows remote administration.

    - The Web interface port is 631.


    # Printing Commands


    Once a printer has been installed and properly configured, a user is able to print
    to it from any printer-capable graphical client. Text-based interface can also
    print via a single command line interface. These basic commands are described
    in the following sections.


    # LPR


    The *lpr* command submits print jobs to the specified printer, or the default
    printer if none is specified. The main options that a user will need are shown
    in Table 7.1.'
- md: '

    ## Table 7.1 lpr Printing Options


    | | |

    |---|---|

    | -P destination | The name of the printer to send the job. |

    | -# number | Print a specific number of copies (default is 1 copy). |

    | -T title | Prints a title on the banner page of the output. |

    | -h | Suppresses printing of the banner page. |

    | -w cols | Prints files with pages of a specific width. |

    | -m | Send mail when the job has been printed. |

    | Filename | The name of the file which you want to print. |


    This command is used with BSD systems.


    ## LP


    The lpr command is very similar to the lpr command described earlier, but it works
    on V Systems. There are a number of differences in the syntax, as the -o parameter
    with lp has a number of different options as as nobannner, cpi=pitch, and width=chas.
    Depending on which system you are working on, you should understand the syntax
    of each command.


    ## LPQ


    lpq is used to see the status of one or more print queues and this can run once
    or displayed continuously at a specified interval until the queue is empty. The
    command on one will display the queue of the default printer. The main options
    for the command are follows:


    - -a to show the status of all printers

    - -P status of a specific printer

    - -interval will display the queue every interval seconds until empty


    ## LPSTAT


    The lpstat command can show the status of printers and queues like the lpq command;
    however, there are more options, such as to query the status of specific CUPS
    servers in the network. The options are shown in Table 7.2. This is useful for
    system administrators who can administer print servers and queues from a central
    location.


    ## CANCEL


    Administrators can cancel jobs in the queue of a specific printer. An individual
    job can be canceled or all jobs can be removed, if the user has the appropriate
    rights. The default printer queue will be checked if no specific printer is defined.


    ## Table 7.2 Ipstat Options


    | -a | Display the queues for all printers destination |

    | -d | Display the default destination |

    | -h server | Specifies the CUPS server to communicate to |

    | -o printer | Display the queue on printer |

    | -p printer | Shows status of printer |

    | -r | Status of CUPS server |


    ## X11


    X11 is the common name for the X Windows system, which is the GUI found on most
    Linux distributions today.


    ## Starting and Stopping X11


    There are a number of ways to start and stop the X Windows system. Normally, the
    display manager will be loaded automatically on boot, optionally by setting up
    the /etc/initab file to load the X Windows system when multiuser mode is used
    (runlevel 5). The actual display manager that will be used in the /etc/system/displaymanager
    configuration file as shown below for the KDE environment:


    ```

    DISPLAYMANAGER="kdm4"

    ```


    When Linux is booted into a multiuser mode without a graphical login using the
    display manager, such as runlevel 3 in the /etc/initab file, you will have to
    start an X session from the command line. The X server and X session must be started,
    and this can be accomplished using startx, without any parameters.


    The startx command will use configuration settings found in the .xinit file which
    default will be in /etc/X11/xinit directory; however, the user can customize the
    X session and launch default clients using a .xinit file located in their home
    directory. If you intend to use the display manager that was installed with your
    system, you do not need to use a customized .xinit file.


    The startx command itself be passed parameters which it passes to the X server
    before an X session is launched. One such parameter is the -depth option that
    will alter the number of colors used. This can be used during development or testing
    of X clients to ascertain how each will look on different hardware solutions.
    This may be useful if you are planning a large roll out across a variety of differing
    hardware. This will start an X session depth of 16.7 million colors.


    ```

    $ startx --depth 24

    ```


    The startx command can also be used to launch multiple X sessions in a number
    of virtual consoles. The complexity of multiple X sessions that it is not an everyday
    occurrence, and you may wish to be very familiar with X sessions before you do
    this. Each X session then to be closed separately or the system gets restarted
    in runlevel 3 as mentioned earlier.


    ## Difference between X11 Clients and Server


    The X Window System was developed using a client/server model, which means that
    the two components can be distributed on separate systems. On a typical Linux
    configuration, these components are located on the same machine; however, they
    communicate via the standard processes. In a client/server application, the client
    software will initiate a communication session, while the server waits for a request
    from one of its clients. Most people use client/server programs on a regular basis
    without realizing it. For instance, a browser is a client program that requests
    data from a Web server.


    In X11, the X server communicates with various client programs. This server accepts
    requests for graphical output, that is, the normal display window on a screen
    and also accepts user input from the keyboard and mouse and sends these back to
    the client. The server can send out to a display on another system or may control
    the video output on local system. Thus, the user''s terminal is the server and
    the applications are the client, which is often the case of confusion for new
    users as an end-user. Their perception is that the client runs on the user''s
    computer and the server is remote. In X11, the X server communicates with various
    client programs. This server accepts requests for graphical output, that is, the
