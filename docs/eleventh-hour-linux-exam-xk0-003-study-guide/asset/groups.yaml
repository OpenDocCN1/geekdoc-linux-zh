    # CHAPTER 8

    Installing, Configuring as a Server


    +   Exam objectives in this chapter

    * Network Services

    * Web Services

    * Application Services


    # INTRODUCTION


    Servers provide network services to clients, such as Domain name server (DNS)
    and Dynamic Host Configuration Protocol (DHCP), or they serve as an application
    server, such as printing and mail. The main network and application services are
    explained in this chapter.


    # NETWORK SERVICES


    There are many network services that can be deployed to a system, and this section
    will look at the most commonly deployed ones: DHCP, DNS, Network Time Protocol
    (NTP), and the interoperability with Microsoft Windows systems.


    # DHCP


    DHCP servers are used to configure Transmission Control Protocol/Internet Protocol
    (TCP/IP) parameters for a host as they connect to a network, including


    +   * IP address

    * Name servers

    * Configuring the routing, including the default route


    Fast Facts


    The main aspects of the DHCP you need to remember are as follows:


    +   * DHCP allocates IP addresses to hosts on a permanent or temporary basis.

    * Temporary IP addresses are said to be leased to a client by the server.'
  - '[PAGE 112]


    # CHAPTER 8 Installing, Configuring as a Server


    +   - Leased IP addresses can be renewed or relinquished.

    - The list of leases is kept in dhcpd.leases, usually in /var/db.

    - DHCP maximizes the usage of IP addresses available by allocating addresses on
    an as-needed basis.

    - DHCP servers usually have fixed or static IP address.


    # DHCP SERVER CONFIGURATION


    Before starting to configure the DHCP server, it is very important to understand
    your network and what parameters you will be configuring.


    > DID YOU KNOW?

    The basic parameters you will want to configure with DHCP are as follows:

    - Domain name

    - DNSes

    - Lease times

    - Routing

    - Static IP addresses

    - Logging

    - Primary or secondary DHCP server


    The configuration file for DHCP is /etc/dhcpd.conf. Each subnet that you are going
    to provide DHCP services must be defined in the file. The main options that can
    be used are described below:


    ```

    # Sample configuration file for dhcpd

    # Set the time a client can keep the IP address

    default-lease-time 600;

    max-lease-time 7200;

    # set the default gateway to be used by clients

    option routers 10.254.239.1;

    # Set-up the NTP server

    option ntp-server 10.254.239.6;

    # set the nameserver to be used by clients

    option domain-name-servers 10.254.239.5

    # This is a very basic subnet declaration.

    ```'
- md: "\n## Network Services\n\nsubnet 10.254.239.0 netmask 255.255.255.224 (\n  range\
    \ 10.254.239.10 10.254.239.20;\n  option routers rtr-239-0-1.example.org, rtr-239-0-2.example.org;\n\
    )\n\n# Fixed addresses can also be specified for hosts.\n# Names or IP addresses\
    \ can be used\n\n```\nhost adminprinter(\n  hardware ethernet 08:00:07:26:c0:a5;\n\
    \  fixed-address adminprinter.fugue.com;\n)\n```\n\nThis setup is allocating a\
    \ number of IP addresses using DHCP, both leased and fixed.\n\n## DNS\n\nThe DNS\
    \ resolves machine names to an IP address or it converts from an IP address to\
    \ the name. In principle, a DNS resolves a name to its IP address.\n\n![](img/53450e0f522134e838a034ce98470308_113_0.png)\n\
    \nThe Domain namespace can be regarded as structured in a tree form.\n\n- Each\
    \ domain within the tree is a node, with each having a set of resource records\
    \ (RRs) associated with it.\n- RRs will define (at least) the ownership, name,\
    \ and IP address.\n- Domains can have subdomains, often referred to as children.\n\
    - The root is named . (dot), a corollary of the root drive / in the filesystem.\n\
    - Subdomains prepend their name to the root name, separated with another \\.\n\
    - Actual machines in each domain are defined by their machine name and the domain\
    \ they are in in their fully qualified domain name (FQDN).\n\nThe Domain name\
    \ system is a distributed database, and the nodes of this database are name servers\
    \ with one or more authoritative DNSes that publish all the information about\
    \ a domain, included in zone files on the DNS. The forward and reverse zones are\
    \ defined as: reverse zones associate an IP address with a hostname and forward\
    \ zones associate a name with an IP address. The DNS resolver is the client part\
    \ of the client-server architecture and is the process that performs the resolution\
    \ of the query, for example, the translation of the FQDN to its actual IP address.\n\
    \n## CHAPTER 8 Installing, Configuring as a Server\n\n### DNS RRs\n\nRRs are the\
    \ most basic part of the Domain name system and have a number of basic elements\
    \ to them: type\n\n### CACHING NAMESERVER\nA caching nameserver will build a local\
    \ cache of resolved domain names and this list to serve other hosts on your network.\
    \ A large number of DNS requests are the same, and this will increase the speed\
    \ of resolution and decrease the amount of traffic you send upward to another\
    \ nameserver provided by *named*. A sample listing showing how a primary nameserver\
    \ is set up below, which is in the *named.conf* file (normally in /etc or /etc/named.d).\n\
    \n```\nzone \"mydomain.com\" IN {\n  type master;\n  file \"mydomain.com.xzone\"\
    ;\n  allow-update [ none ];\n};\n```\n\nThere is a control utility called *rndc*\
    \ that allows you to administer the *named* daemon. The configuration file for\
    \ *rndc* is at /etc/rndc.conf, and additionally, you need to specify authentication\
    \ keys in both /etc/rndc.conf and /etc/named.conf, which must match. You need\
    \ to generate HMAC-MD5 keys for both the configuration files using the following\
    \ command:\n\n```\ndnssec-keygen -a hmac-md5 -b <bit-length> -n HOST <key-file-name>\n\
    ```\n\nThe default port used by *rndc* to connect to is 953. Once the command\
    \ is set up, the *rndc* command can be used with the following options shown in\
    \ Table 8.1.\n\n## NTP\n\nThe NTP synchronizes computer clocks over a network\n\
    \n| Table 8.1 rndc Options | |\n| :--- | :--- |\n| Refresh | Refreshes the database\
    \ |\n| Reload | Reloads the zone files but keeps the cached files |\n| Stop |\
    \ Stops the service gracefully |\n\n## Table 8.2 date Options\n\n| Option | Description\
    \ |\n| :--- | :--- |\n| -a | Adjusts the date when the time is drifted |\n| -u\
    \ | Displays or sets the time in GMT |\n| -s datetime | Sets the time and date\
    \ |\n\nAn NTP client is implemented as a continuously running daemon process,\
    \ which runs in the kernel space due to the timing of it. The main configuration\
    \ file is /etc/ntp.conf and defines the servers to synchronize to, as well as\
    \ networks are allowed to synchronize to, your server. A number of servers need\
    \ to be defined to ensure redundancy, as follows:\n\n```\nserver lerc-dns.lerc.nasa.gov\
    \ # Stratem 1 server\nserver ntp.time.edu               # Stratem 2 server\n```\n\
    \nThe utility program ntpq is used to monitor the NTP daemon to determine the\
    \ performance, and ntpq -p is useful to see what time servers are currently being\
    \ polled. The local date and time can be set using ndate or ntppd.\n\n## DATE\n\
    \ndate displays or sets the date on a system that does not have an NTP with common\
    \ options shown in Table 8.2.\n\n## Windows Interoperability\n\nInteroperability\
    \ between Linux and Windows is normally an essential task that any system administrator\
    \ needs to undertake.\n\n## REMOTE DESKTOP\n\nrdesk uses the Remote Desktop Protocol\
    \ (RDP) and can be used to present remote desktops. To connect to a remote host,\
    \ hostname de-connect.\n\n## Crunch Time\n\nrdesk uses the Remote Desktop Protocol\
    \ (RDP) and can be used to present remote desktops. To connect to a remote host,\
    \ hostname de-connect.\n\n## VIRTUAL NETWORK COMPUTING\n\nrdesk uses the Remote\
    \ Desktop Protocol (RDP) and can be used to present remote desktops. To connect\
    \ to a remote host, hostname de-connect.\n\n## SAMBA\n\nrdesk uses the Remote\
    \ Desktop Protocol (RDP) and can be used to present remote desktops. To connect\
    \ to a remote host, hostname de-connect.\n\n## Fast Facts\n\nThe Samba server\
    \ has a number of daemons (notably, *nmmbd* and *smbd*).\n\n- smbd handles file\
    \ and printer, including authentication.\n- nmbd undertakes name resolution, using\
    \ point-to-point.\n- The network announcement part of Samba is also handled by\
    \ nmbd.\n- There is one local master browser (LMB) on the network that holds the\
    \ list of available services.\n- These lists can be-populated across domains via\
    \ domain master browsers (DMBs).\n\n## Configuration Files\n\nThe main configuration\
    \ file for Samba is smb.conf, usually residing in /etc/samba/smb.conf. The smb.conf\
    \ layout is similar to that used in older Windows .ini files, comprising a number\
    \ of sections with a section name in brackets ([]) delimit the sections. The sections\
    \ or stanzas will contain information about the shares, printers, and services.\
    \ There is one special stanza *global*, which specifies parameters to apply to\
    \ all stanzas in smb.conf. A very minimal smb.conf file can be defined that just\
    \ defines a couple of global parameters and some shares.\n\n```\n[global]\nworkgroup\
    \ = mycorp\nnetbios name = computer_name\n[share1]\npath = /etc\ncomment = share\
    \ the /etc folder to the world\n[share2]\npath = /documents\ncomment = share the\
    \ global documents folder to the world\n```\n\nIf you are setting up a server\
    \ and want to share everyone's home directories, there is a special stanza called\
    \ *homes*, which will enable the default home directories.\n\n```\n[homes]\ncomment\
    \ = Home Directories\nbrowseable = yes\nComment = only allow users to connect\
    \ to their own directory, \\\\server\\username\nvalid users = %S\ncomment = allow\
    \ user to write to the\nwritable = yes\n```\n\n## Inhosts File\n\nThe Inhosts\
    \ file is built into Samba and the NetBIOS name to IP address mapping, in a similar\
    \ format to the /etc/hosts file. The file is located in the /etc/usr/local/samba/lib\
    \ directories.\n\n## Managing a Samba Server\n\nThe Samba server has a number\
    \ of daemons (notably, *nmmbd* and *smbd*) that need to be started, normally upon\
    \ boot, and will read the smb.conf file. Once started, the server can be managed\
    \ from the command line or through a graphical user\n"
  mdcn: "\n\n## 网络服务\n\nsubnet 10.254.239.0 netmask 255.255.255.224 (\n  range 10.254.239.10\
