    # CHAPTER 10

    Troubleshooting and Maintaining Linux


    +   Exam objectives in this chapter

    * Monitoring Tools

    * Analyzing Logs

    * Backing up and Restoring


    # INTRODUCTION


    This chapter covers common tools for managing a system, including monitoring performance
    and logs and backing up data. If your system seems to be running slowly or having
    some other issues, it is very helpful to have some historical data to compare,
    so it is advisable to run a few of them now and then under normal load, so you
    have a good idea what “normal” looks like.


    # MONITORING TOOLS


    Linux provides a number of handy tools for reviewing system status and other statistics.
    Not all of them may be included in a default installation, but they are all supported
    and can be made to work with a little effort.


    # Commands


    The usage of the most popular utilities is described below.


    # SAR


    sar can be used to gather both current and historic system statistics for the
    system processor. By default, sar displays information periodically gathered and
    stored in files at /var/log/sysstat/sa*, with the last two numbers of the sa*
    files corresponding to the calendar day the information was collected. Some other
    options include sar -A to show all statistics and sar -n DEV to show network statistics.
    An example showing network statistics is shown in Figure 10.1.'
