    # ROUTING


    The setup of the IP address and associated data on each of the NICs within the
    system is only part of the required network configuration. The system needs to
    know where to route packets, and this is achieved using the route command, located
    in /sbin and after the interfaces have been set up.


    Any network interface will have an IP address and a subnet mask. The IP address
    will be in the 192.168.1.1 (for IPv4) or 2001:db9:0:567:1:1 (IPv6). The subnet
    mask identifies how many nodes are in that network, for instance, a class C network
    has 254 nodes. When a machine has communicate with another machine, it will decide
    how to route these packets to it. If it is on the local network, it can do so
    directly. Otherwise, to use an intermediate router to send the packets to. The
    route command used with no parameters displays the current routing table as shown
    below:


    ```

    $ syngress > /sbin/route

    ```


    | Destination | Genmask | Flags | Metric Ref Use Iface |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 192.168.1.0 * | 255.255.255.0 | U | 1 | 0 | eth0 |

    | loopback * | 255.0.0.0 | U | 0 | 0 | lo |

    | default | 192.168.1.1 | UG | 0 | 0 | eth0 |


    The first column shows the IP or the host name. The default gateway for this machine
    is the default entry and where packets are sent if no route exists for a destination.
    The Genmask defines the Netmask for that particular network. The flags column
    can have a number of options, with U being the route enabled and G specifying
    that the destination requires a gateway. The other notable column is Iface. This
    column specifies which interface is used for that route.


    The route command can add to the routing tables and specify a host or a network
    as a destination, with the default being a host. The most common route to add
    is that of the default gateway as


    ```

    $ /sbin/route add default 192.168.1.1

    ```


    If the interface has just been configured using the ifconfig command, the network
    may have to be added by hand


    ```

    $ /sbin/route add -net 192.168.1.0 netmask 255.255.255.0 dev eth1

    ```


    # IPTABLES


    iptables is a user space program for system administrators and usually installed
    as /usr/sbin/iptables. It is used to configure the tables, rules, and filters
    to control the treatment of network packets into and out of the system. It uses
    the Xtables framework, which is used by Netfilter. The Xtables is kernel-level
    component and provides an application program interface (API) for kernel-level
    extensions. The tables are associated with a number of specific kinds of packet
    processing. Packets are processed by the system rules in a chain, with each rule
    to send the packet to another rule if necessary. All network packets into and
    out of the system must traverse at least one chain.


    There are three predefined chains for input, output, and forward in the table.
    A packet traverses the chain until it matches the packet and decides what to do
    with it (such as accept or drop a packet) or returns the rule processing to the
    calling chain or traverses until the end of the chain is reached. The current
    rules can be displayed using the iptables -l command and must be run as root as
    it requires privileges. Network Address Translation (NAT) is configured by the
    packet filter ruleset, this is included with iptables.


    # DNS RECORD TYPE AND DNS RESOLUTION


    The domain server is used to convert names to their actual IP address using the
    resolver process. These servers are defined in the /etc/resolv.conf file defined
    above. Each NS is part of a tree structure and will have an authoritative NS for
    its domain, such as foo.com. Each NS may delegate parts of its zone to other NSs
    for convenience and speed. Starting from the root domain, the server that is the
    authoritative NS for a domain can be found by following the chain of delegations.


    # Fast Facts


    Each DNS will have the data for the domain in resource records. These records
    hold a single fact about that domain, with the common records defined below:


    - A (address) records define the actual IP address associated with a name.

    - NS (server name) records define the authoritative NS for the domain.

    - MX (Mail Exchanger) records define the main server for the zone.

    - PTR (Pointer) records define the real name of the host for a particular IP.

    - CNAME (Canonical Name) is the alias of one name to another.

    - TXT (Text) Primarily for human-readable text but also contain machine-readable
    data.


    More information on DNS is covered in Chapter 8, "Installing, Configuring."


    # NETWORK CONNECTIVITY TROUBLESHOOTING


    The following will guide the user through basic network troubleshooting. When
    issues arise, a systematic approach is needed to ensure a quick resolution. If
    the machine is newly built, it is advisable to use a network connection that is
    known to be fully working to ensure the physical cable, and upstream devices as
    routers, switches, and DHCP servers are fully operational. Initially, ensure that
    the NIC configuration is correct and then connect the network machine should now
    be initialized with an IP address and relevant information. The ifconfig command,
    with parameters, should be executed to display the status of the NICs. For a more
    comprehensive output use ifconfig and netstat. The common options for netstat
    are in Table 4.1. It is often useful to use netstat in a separate terminal window
    while testing connections between two computers. Additionally, there will be an
