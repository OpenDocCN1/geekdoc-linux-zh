    # OBTAINING INFORMATION ABOUT PACKAGES


    You may want to install a package but not sure what the name of the package is.
    One method of finding these packages is to use apt-cache. To search for packages,
    you will need to use:


    ```

    apt-cache search name

    ```


    For instance, suppose you want to search for abiword, you would execute the command
