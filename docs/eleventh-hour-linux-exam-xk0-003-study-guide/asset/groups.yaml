    \n## 引言\nLinux 启动过程始于系统上电，系统 BIOS 对硬件进行检查，然后确定使用何种设备（例如，软驱驱动器、硬盘、CD/DVD 驱动器）来启动系统。启动设备的第一个扇区包含\
