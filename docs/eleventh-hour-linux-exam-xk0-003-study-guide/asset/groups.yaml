    # CHAPTER 3 Booting Linux


    | Table 3.1 /boot/grub/menu.lst Options |

    | /boot/grub/menu.lst Options | Purpose |

    | default | This option is used to instruct the system to use the designated Title
    entry to boot by default. Examples include:

    - default 0 – for the first menu

    - default 1 – for the second menu

    - default 2 – for the third menu |

    | timeout | This option is used to instruct the system to immediately boot the
    default selection or wait a prescribed amount of time. Examples include:

    - timeout 5 – means wait 5 s before automatically booting the system.

    - timeout 10 – means wait 10 s before automatically booting the system.

    - timeout 0 – boot the default selection immediately |

    | title | This option indicates the setting displayed by the boot-menu title.
    Examples include:

    - title Linux

    - title Fallsafe

    - title GNOME User Interface |

    | root | This option provides a device or partition name indicating the location
    of the kernel and initrd files. Examples include:

    - root (hd0,0) – represents the first hard drive and the first partition.

    - root (hd0,1) – represents the first hard drive and the second partition |

    | kernel | This option presents the location and name for the Linux kernel (for
    example, vmlinuz). This is the option used to select a different kernel to boot
    the system. It also specifies the default runlevel by placing the runlevel number
