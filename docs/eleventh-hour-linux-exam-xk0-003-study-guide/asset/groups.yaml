    选项会在工作进行在屏幕上打印一系列哈希标记，其唯一目的是让你意识到某些操作仍在进行。


    ## 软件包更新


    系统中已安装的软件包可以使用 `-U` 选项升级到较后的版本。此选项将移除旧版本，并保留任何修改过的文件（如配置文件）。然后将安装新版本。将上述 Telnet
    包升级到版本 18 发布 5，要使用的命令是：


