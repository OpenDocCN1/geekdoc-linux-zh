    # Configuring Apache Server Logs


    The Apache error log is set by the ErrorLog directive, and it is the log file
    where the httpd daemon will send errors and diagnostic information – normally
    called error_log. The LogLevel directive in the configuration file will define
    the amount of error logs or how verbose they are. There are eight levels of logs:
    emergency, alert, critical, error, warning, info, and debug.


