    # Difference between X11 Clients and Server


    The X Window System was developed using a client/server model, which means that
    the two components can be distributed on separate systems. On a typical Linux
    configuration, these components are located on the same machine; however, they
    communicate via the standard processes. In a client/server application, the client
    software will initiate a communication session, while the server waits for a request
    from one of its clients. Most people use client/server programs on a regular basis
    without realizing it. For instance, a browser is a client program that requests
    data from a Web server.


    In X11, the X server communicates with various client programs. This server accepts
    requests for graphical output, that is, the normal display window on a screen
    and also accepts user input from the keyboard and mouse and sends these back to
    the client. The server can send out to a display on another system or may control
    the video output on local system. Thus, the user''s terminal is the server and
    the applications are the client, which is often the case of confusion for new
    users as an end-user. Their perception is that the client runs on the user''s
    computer and the server is remote. In X Window terminology, the server provides
    display and I/O services to the applications. The applications that use these
    services are (such as a browser).


    The Server and Client Communication Protocol runs with transparency, that is,
    it is invisible to the applications that it is using. When Linux is designated
    as a server, the clients are often distributed across the network. Communication
    Protocol can be tunneled over an encrypted tunnel. X can be bandwidth intensive,
    so a fast network is desired, particularly if there are a lot of remote clients.


    # Window Managers


    The X Window manager is the windowing system that runs on X, and the user can
    choose one of many. These window managers will have certain requests between the
    client and server redirected through them, such as when a new window needs to
    be displayed. The types of window manager include tiling window managers (GNOME
    and KDE are good common examples), and so forth), compositing window managers
    (like icewm).


    In general, the window manager controls the appearance of the GUI to the user.
    It positions windows, controls the fonts and colors, and handles the input and
    output (mouse-clicks and so forth). The window manager is just another client
    from the point of view of the X window server. The initial window that is displayed
    as the root window, with top-level windows being children of this root window.'
