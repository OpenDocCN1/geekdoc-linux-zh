    # PSTREE


    pstree shows the relationship between parent and child processes in a hierarchical
    view and pstree -p will also show process IDs. The init process is the parent
    of all processes and always has a PID of 1. Each child process knows its parent
    ID (PPID), which is what pstree shows between processes. ps -al to look at just
    CPU but also physical and network drive usage can use iostat command as shown
    in Figure 5.3. The various CPU-related statistics shown at the top of the report
    are follows:


    - %user Percentage of processor time spent on user applications

    - %nice Percentage of processor time spent on user applications running at lowered
    priority

    - %system Portion of processor used by the system

    - %iowait Percentage of time the processor has idle when drives attached to system
    are busy

    - %idle Idle time

    - %ps (transfers per second) A transfer is considered a request for data

    - %blk_read/s Blocks read per second

    - %blk_write/s Blocks written per second

    - %steal Related to virtualized systems


    # NICE


    A process has a priority value between –20 and 19 called niceness. The lower the
    value, the faster it runs, and niceness is inherited from the parent process.
    The owner of a process can make it slower, freeing up resources, and only system
    administrator can make it faster. There are two ways to adjust the niceness of
    a file: nice and renice. To start a process with an adjusted niceness, type the
    following: nice -n 10 find/-name my_file. Once the process is running it can be
    reset to a specific value with root access and renice like this: [img/53450e0f522134e838a034ce98470308_70_0.png]
    Figure 5.3 Example of iostat


    # Leveraging I/O Redirection


    There are a number of small useful tools that meant to work together and I/O redirection
    is the glue that sticks these programs together. Console programs make use of
    three streams for communicating, as shown in Table 5.5. You can use file redirection
    allows you to use the output from one program as the input for another, or send
    it to a file. You can use the contents of a file as the input for a program, or
    use a succession of programs to create and manipulate information. Common uses
    of redirection are shown in Table 5.6.


    WARNING Be careful when using >, if you redirect your output stream to an existing
    file it will be overwritten. >> to append to the end of an existing file.


    | Table 5.5 | The Three Communications Streams |

    | Name | Number | Symbol | Normal Connection |

    |---|---|---|---|

    | STDIN | 0 | < | Keyboard |

    | STDOUT | 1 | > | Console |

    | STDERR | 2 | > | Console |


    | Table 5.6 | Common Uses of Redirection |

    | Command | Result |

    |---|---|

    | some_program > not_the_console | Output is directed to not_the_console, which
    can be a file or device |

    | some_program < something_to_send_to_a_program | Input for some_program or file
    or device |

    | some_program > data_output.txt 2> error_output.txt | Output sent to data_output.txt
    and errors sent to error_output.txt |

    | some_program 2> error_output.txt | Errors sent to error_output.txt |

    | some_program > data_and_errors.txt 2>&1 or some_program &>data_and_errors.txt
    | Data and error streams are combined |

    | some_program | another_command | Sends output from one program into the input
    of another |

    | ls -al | tee directory.txt | tee duplicates a stream and sends one copy to the
    display and another to a file |


    # BASH Commands


    Some commands will only accept a certain amount of input at a time, and the solution
    to this is to use xargs, which will accept the input stream and split it into
    chunks along a bit at a time and repeatedly running the downstream command. The
    following example will move all of Bob''s music files into his music directory:


    ```bash

    find -name "*.mp3" -u bob | xargs -i mv {} ./bob_mp3

    ```


    If you put a ";" between two commands, they will run consecutively:


    ```bash

    do_this_first; then_do_this; and_final_this

    ```


    The "==" is used to compare the equivalence of two variables, often used in scripting.


    # Special Devices


    The /dev/null file is often called "the bit bucket," and is most often used to
    hide unnecessary output from a program embedded in a script. The /dev/random is
    the interface to the systems random number generator, and it will produce random
    numbers to create cryptographic keys using noise from various devices to maintain
    an "entropypool" to generate numbers. Applications that can get by pseudandom
    numbers can use /dev/urandom. The /dev/zero file works like /dev/null if you send
    data to it, but you can use it for an input stream to create fills of zeros.


    # Using System Documentation


    Linux offers many ways to find additional information for all of its commands.
    The quickest and most basic assistance comes from using the help option of any
    given command — usually both -t and -help work.


    > EXAM Remember when you are taking the Linux+ exam you will have to know about
