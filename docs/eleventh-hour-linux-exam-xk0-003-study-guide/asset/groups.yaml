  - '[PAGE 160]


    The following terms show up throughout the book and, with their accompanying definitions,
    they should be a useful resource for studying for the exam.


    +   **Apache containers** Sections within the Apache Web server configuration
    files.


    +   **Apache modules** Add-ons for the Apache Web server.


    +   **Attributes** The properties of a file, such as size, modification date,
    ownership, and permissions.


    +   **Binary package** Group of files in compiled format that has been designed
    to work on the appropriate Linux distribution.


    +   **Child process** Process spawned from a parent process. Each parent can have
    many child processes.


    +   **Class (of printer)** Group of printers linked together so they can act as.


    +   **Command Line Interpreter or Command Line Interface (CLI)** A full-screen
    windowed text-mode session where the user executes programs by typing in commands
    with or without parameters.


    +   **Common UNIX Printing System (CUPS)** The standards-based, open printing
    system.


    +   **Dependencies** Packages required to be installed when another package is
    installed.


    +   **Dynamic Host Configuration Protocol (DHCP)** A protocol for automating the
    configuration of computers that use TCP/IP.


    +   **Discretionary Access Control (DAC)** Type of access control where system
    privileges are specified by the owner of an object, who can apply, modify, or
    remove them.


    +   **DNS server**, authoritative A DNS server that gives the definitive answer
    to a DNS query, and not a cached answer from another server.


    +   **Domain Master Browser (DMB)** The domain master server within an individual
    workgroup.


    +   **Exit value** Shows the exit status of the shell and commands.


    +   **Firewall** Security device to segregate networks.


    +   **Forwarding and tunnelling** One network protocol encapsulating a different
    protocol.


    +   **FTP server, active mode** FTP client uses the PORT command.


    +   **FTP server, anonymous server** An FTP server in which users do not need
    an account on the server.'
  - '[PAGE 161]


    # Glossary


    FTP server, passive mode FTP client uses the PASV command.


    Fully Qualified Domain Name (FQDN) Complete definition of a host, such as host.test.com.


    Grand Unified Bootloader (GRUB) Bootloader used on most modern versions of the
    Linux operating system.


    Group Identification number (GID) Identification number of a Linux group.


    Hardware Abstraction Layer (HAL) Abstraction layer between hardware and the software
    in a computer.


    Hostname Name of the specific host.


    Immutable Files that cannot be deleted, by root.


    Internet Message Access Protocol (IMAP) An e-mail protocol that allows users to
    receive an IMAP e-mail client, where all e-mail, folders, and so on are stored
    on the server, rather than the client''s local computer.


    Inode A data structure holding information about files in a Unix file system.


    Iostat Program to report statistics regarding the I/O system.


    Journaling Filesystems keep a record of changes and allows for faster restart
    after an unexpected system shutdown.


    Kernel The core operational code of an operating system.


    Lease Temporary assignment of an IP address to a host by a DHCP server.


    Least privilege Runs programs with as few privileges as possible.


    libraries Groups of files.


    Linux distribution A particular version of Linux, such as OpenSUSE, Red Har, and
    so on.


    Load average The average loading of the system over a period of time.


    Local Master Browser (LMB) Master browser on a subnet.


    Logical partition Partitioning of a primary partition.


    Makefile Describes the dependencies between files.


    Mandatory Access Control (MAC) A type of access control where system privi-leges
    are specified by the system.


    Master Boot Record (MBR) Holds the partition table of the disk and can contain
    executable code.


    Metadata Data about data.


    Mode Permission on a file.


    Mail Transport Agent (MTA) A program responsible for delivering e-mail messages.


    Network Time Protocol (NTP) The TCP/IP protocol used to synchronize the clocks
    on computers across a network.


    Package manager Collection of tools to automate the installing, upgrading, and
    configuring of software packages.'
  - '[PAGE 162]


    # Glossary


    **Packages** Collection of files, either in binary or source form.


    **Parent process** The process that spawned (started) a new process.


    **Post Office Protocol (POP)** An application-layer Internet standard protocol
    used by local e-mail clients to retrieve e-mail from a remote server.


    **Privilege Escalation** Process to escalate your privileges to that of an administrator.


    **Redirection** Redirects IO from or to a different device.


    **Regular Expression (regex)** A recognized method for describing a search pattern.


    **Relay** Method of forwarding e-mail on.


    **Residual data** Small parts of a disc that have obsolete data.


    **Root** Often called superuser or administrator.


    **Runlevel** A specialized script that starts a different set of services.


    **Samba** An open source suite of programs that provide file and print services
    to SMB/CIFS clients and allows for interoperability between Linux/Unix servers
    and Windows-based clients.


    **Server Message Block (SMB)** Protocol that can be used to interface linux and
    windows systems.


    **ServerRoot** In Samba, location other files can be made relative to.


    **Shadow password** Encrypted password file.


    **Software repositories** Locations where different software packages are held.


    **Source package** Collection of files that need to be compiled.


    **Stanza** Section of a Samba configuration file.


    **Sticky bit** Programs run with the permissions of the owner of the file and
    not that of the user who runs the program.


    **Stream editor** Noninteractive editor.


    **Syslog** Utility for logging system messages.


    **Terminal** A utility that can be run to input commands.


    **User ID (UID)** A numeric identifier that represents a user.


    **Window Manager** A program or software that controls the placement and appearance
    of windows within a windowing system in a GUI.


    **X Window System (or simply, X)** An open source software of (including a network
    protocol) that implements the X display protocol, provides windowing and manages
    keyboard and mouse functions to provide a GUI for networked computers.'
