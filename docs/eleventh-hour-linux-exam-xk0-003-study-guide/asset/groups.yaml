    $ startx --depth 24

    ```


    `startx` 命令还可以用于在多个虚拟控制台上启动多个 X 会话。多个 X 会话的复杂性使得它并不是日常发生的事件，在你在此之前，你可能希望非常熟悉 X
    会话。每个 X 会话将被单独关闭，或者如前所述，在运行级别 3 下重启系统。


    ## X11 客户端与服务器的区别


    X Window 系统使用客户端/服务器模型开发，这意味着这两个组件可以分布在不同的系统上。在典型的 Linux 配置中，这些组件位于同一台机器上；然而它们通过标准进程进行通信。在客户端/服务器应用程序中，客户端软件将发起通信会话，而服务器等待来自其中一个客户端的请求。大多数人经常使用客户端/服务器程序但却没有意识到这一点。例如，浏览器就是一个从
    Web 服务器请求数据的客户端程序。


    在 X11 中，X 服务器与各种客户端程序通信。该服务器接受图形输出请求（即屏幕上的普通显示窗口），并接受来自键盘和鼠标的用户输入并将这些输入发回客户端。服务器可以将输出发送到另一个系统的显示器上，也可以控制本地系统的视频输出。因此，用户的终端是服务器，而应用程序是客户端，这通常会让作为终端用户的新用户感到困惑。他们的感知是客户端运行在用户的计算机上，而服务器是远程的。（注：原文此段存在大量重复段落，译文已按要求去重并保持逻辑清晰）。


