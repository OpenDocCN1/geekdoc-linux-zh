  - '[PAGE 49]


    # CHAPTER 4 Configuring the Base System


    The listing shows a series of numbered directories at the left-hand part of the
    screen for a process that is running on the computer. The directory labeled 1
    is for the first process initiated: the init process.


    > DID YOU KNOW?\ Although the list of compatible hardware is large and often configured
    correctly on installation, understanding how Linux configures devices is essential
    to support and maintain a system. In particular:

    - Use lsusb and lspci to interrogate and list hardware devices.

    - Loaded modules are listed using ismod.

    - modprobe can load and unload modules.

    - /sys contains files related to the kernel and firmware.

    - /proc is a virtual filesystem to communicate between the kernel and the user
    processes.


    # modprobe and modprobe.conf


    Devices can be detected during installation or when a new device is installed
    in a system. There are also a number of ways to initialize the hardware manually.


    +   - modprobe is the high-level handler for all modules, and it can be used to
    unload or load a new device''s kernel module.

    - The /etc/modprobe.conf local file can be edited to prompt the system to recognize
    and support the new hardware upon reboot.


    The base system uses the /proc/modprobe.conf file to load the modules, which should
    not be modified. This file appends the /etc/modprobe.conf.local to itself via
    an include statement. Once an entry has been added to the /etc/modprobe.conf.local
    and a reboot is undertaken, the system performs a module dependency check.


    As root, you can also manually load (and unload) a device''s kernel module using
    modprobe. This command will look in the /usr/lib/modules [kernel version] for
    all the modules and files except for the /etc/modprobe.conf configuration file
    and /etc/modprobe.d directory. If the module does not exist, modprobe generates
    an error. modprobe does not do anything to the module itself, all dependencies
    and the resolving of symbols are handled by the kernel itself. Kernel messages
    generated by a module failure will be displayed using the dmesg command.


    Each module may need one or more additional modules enabled to function correctly,
    and modprobe will check for these dependencies in the modules.dep file which is
    itself generated by the command depmod. dep file is located in the /lib/modules/''uname
    directory.'
- md: "\n# /etc/modules.conf configuration file\n\nThe behavior of modprobe can be\
    \ altered by the optional /etc/modules.conf file. This file consists of a set\
    \ of lines, which looks similar to a shell script. This file will typically only\
    \ exist if you are installing kernel modules, which are not compiled directly\
    \ into the kernel and not handled by modprobe elsewhere.\n\n# NETWORKING\n\nIt\
    \ is very rare that a modern computer system is not connected to some form of\
    \ network, and this requires the setup of a network card and TCP/IP on your system.\n\
    \n# Configuring the Interface\n\nIf you are installing a network interface card\
    \ (NIC) or other hardware module, ensure that it is on the supported device list\
    \ for the Linux kernel you are installing. Most NICs will have one or more lights\
    \ to indicate whether it is working and connected. If you encounter an error,\
    \ use any diagnostics tools that are available to check out the device.\n\nWhen\
    \ you have installed the NIC and are confident that it is working, the NIC needs\
    \ to be configured. The two commands required when configuring NIC are ifconfig\
    \ and ifup. It should be noted that superuser privileges are required for some\
    \ of the options in the ifconfig, ifup, and ifdown commands. The ifconfig command\
    \ is very useful in displaying the status of a NIC, with part of the output shown:\n\
    \n```\n$ /sbin/ifconfig\neth0 Link encap:Ethernet Hardware 00:0D:56:E7:9D:B1\n\
    \  inet addr:192.168.1.38 Bcast:192.168.1.255\n  inet6 addr:fe80::20d:56ff:fee7:9db1/64\
    \ Scope:Link\n  UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1\n  RX packets:8773\
    \ errors:5 dropped:0 overflows:0 frame:5\n  TX packets:2722 errors:0 dropped:0\
    \ overflows:0 carrier:0 collisions:0 txqueue:1000\n  RX bytes:5185021 (4.9 Mb)\
    \ TX bytes:226856 (221.5 Kb)\nInterrupt:11\n```\n\nA number of actions to find\
    \ a non-working network card are listed below. With multiple NICs, the cards are\
    \ sequentially numbered eth0, eth1, and so on, and you must be sure you are manipulating\
    \ the correct device.\n\nThe NIC must be turned on for the system to recognize\
    \ it, and you can achieve using `ifconfig` or `ifup` as shown below:\n\n```\n\
    ifconfig eth0 up\n```\n\n```\nifup eth0\n```\n\nReconfiguring the IP and subnet\
    \ mask of the device may require the NIC to be inactive or to be turned on and\
    \ off. This can be achieved using `ifconfig` or `ifdown` as such:\n\n```\nifconfig\
    \ eth0 down\n```\n\n```\nifdown eth0\n```\n\n> EXAM WARNING\n> Remember that `ifconfig`,\
    \ `ifup`, and `ifdown` are usually located in the /sbin directory, which is not\
    \ part of the path defined as PATH for most users. The full directory path may\
    \ therefore be required to execute the commands.\n\nThe IP address associated\
    \ with the NIC can be assigned dynamically from a DHCP server, or it can have\
    \ a static address assigned to it. To set a NIC to a specific IP address, the\
    \ command is\n\n```\nifconfig eth0 10.10.10.3 netmask 255.255.255.0\n```\n\n#\
    \ DHCP SETUP AND CONFIGURATION\n\nFor the majority of devices, the use of DHCP\
    \ will be the preferred option. The host running DHCP obtains an IP address by\
    \ contacting a central server, which maintains the addresses for one or more clients.\
    \ Once the client has contacted the server, it will be assigned an IP address,\
    \ subnet mask, and potentially other information such as the default route and\
    \ IP address of the default DNS. The information that is requested is stored in\
    \ the configuration file /etc/dhclient.conf.\n\nA command-line DHCP client (/etc/dhcpcd),\
    \ can also be used to configure the network interface. The Domain name server\
    \ (DNS) information obtained from the server will be written to resolv.conf or,\
    \ if unavailable, directly to /etc/resolvconf. In larger networks, the DHCP server\
    \ may also supply configuration data for Network Information Service (NIS) and\
    \ Network Time Protocol (NTP), and these will be stored in /etc/yp.conf and /etc/ntpd.conf.\
    \ These services will be stopped and started by dhcpcd to ensure that they are\
    \ notified of the change.\n\nFor support reasons, a number of other options are\
    \ useful with the dhcpcd command:\n\n- - release releases the current lease and\
    \ deconfigures the interface.\n- - renew attempts to renew the lease. These two\
    \ commands are often done sequentially to check the connection to the DHCP server.\n\
    \n# Networking\n\n- - nogateway restricts any updating of the default route.\n\
    - - nontp stops ntp being updated.\n- - nodes stops DNS information being updated\
    \ in /etc/resolconf.\n\nDHCP alternative client is dhclient, which runs on startup\
    \ and reads the /etc/dhclient.conf file. This file contains a list of all the\
    \ network interfaces to be configured in the current system. If the interface\
    \ is configured using this client, it stores the DHCP lease in /var/lib/dhcp/dhclient.leases.\n\
    \n# CONFIGURING A WIRELESS INTERFACE\n\nTo display the status of all the wireless\
    \ interfaces on a system, use iwconfig with no parameters or the iwlist command\
    \ in /usr/sbin. The wireless statistics are obtained from the /proc/net/wireless\
    \ file.\n\n![](img/53450e0f522134e838a034ce98470308_52_0.png)\n\nTo set up a wireless\
    \ NIC, the main parameters to use are as follows:\n\n- - SSID sets the network\
    \ name to enable the user to roam across a number of access points.\n- - Mode\
    \ needs to be setting on the network topology. The common parameters are Managed\
    \ for a network of many access points, ad-hoc for point-to-point connection, and\
    \ Master if the device will act as access point.\n- - Key/enc is used to set the\
    \ current encryption key and is entered in hex notation in the form XXXX-XXXX-XXXX-XXXX\
    \ or as an ASCII string with the s: prefix.\n\n# NETWORK CONFIGURATION FILES\n\
    \nThere are a number of network configuration files in the systems that are modified\
    \ automatically or manually. The files have comments embedded in them using the\
    \ # symbol.\n\n# Hosts File, /etc/hosts\n\nThe hosts files map IP addresses to\
    \ host names and contains both IPv4 and IPv6.\n\n# Services, /etc/services\n\n\
    The services files map port numbers to services. A port is specific to an application\
    \ and is destined for.\n\n# Name Switch Service, /etc/switch.conf\n\nThe Name\
    \ Switch Service is used to tell the system service to use, with potentially a\
    \ lookup order. Typically, there will be entries for password, hosts, and networks.\
    \ The entries are:\n\n- - nis: Use NIS or YP\n- - dns: Use the Domain name server\n\
    - - files: Use the local files\n\n# Resolver File, /etc/resolv.conf\n\nThe resolv.conf\
    \ file is constructed automatically and will never need to be changed. It contains\
    \ the list of one or more NSs, typically obtained from the DHCP service, with\
    \ the format nameserver=IP_ADDRESS.\n\n# TCP/IP Ports\n\nThere are a number of\
    \ common networking ports that are used frequently. Ports 0 through 1023 are defined\
    \ as well-known ports. Registered ports are from 1024 to 49151. The remainder\
    \ of the ports from 49152 to 65535 are defined dynamically by applications. A\
    \ brief description of the ports are as follows:\n\n- Port 20 and 21: FTP data\
    \ and FTP control, respectively\n- Port 22: Remote login protocol secure (SSH)\n\
    - Port 23: Telnet, used for accessing system remotely but is not secure\n- Port\
    \ 25: Simple Mail Transfer (SMTP) used by e-mail servers\n- Port 53: DNS protocol\n\
    - Port 80: Used for accessing Web servers\n- Port 110: The POP service or Post\
    \ Office Protocol used by local e-mail clients to retrieve mail from servers\n\
    - Port 123: NTP to synchronize time with remote time servers\n- Port 143: E-mail\
    \ clients can use the Internet Message Access Protocol (IMAP) to retrieve mail\
    \ from servers\n- Port 443: This is the Hypertext Transfer Protocol (HTTPS) Secure\
    \ that combines HTTP with a cryptographic protocol, which can be used for payment\
    \ transactions and other secure transmission of data from Web pages\n- Port 631:\
    \ The Internet Printing Protocol (IPP) used to print printers remotely on the\
    \ network\n- Port 3306: The standard port for MySQL\n\nThese ports are defined\
    \ in the /etc/services file on Linux systems.\n\n# Managing Connectivity\n\nThe\
    \ descriptions above have outlined the basics of network connectivity and how\
    \ to install a network card into a system. The following section builds on this\
    \ knowledge and defines to manage the connectivity between systems in a network.\n"
  mdcn: "\n\n# /etc/modules.conf 配置文件\n\nmodprobe 的行为可以通过可选的 /etc/modules.conf 文件进行更改。该文件由一组行组成，看起来类似于\
    \ shell 脚本。通常只有在你安装内核模块时，该文件才会存在，这些模块没有被直接编译到内核中，也没有由 modprobe 在其他地方处理。\n\n# 网络\n\
    \n现代计算机系统没有连接到某种形式的网络是非常罕见的，这通常要求在你的系统上设置网卡和 TCP/IP。\n\n# 配置接口\n\n如果你正在安装网络接口卡\
    \ (NIC) 或硬件模块，请确保它位于你正在安装的 Linux 内核支持的设备列表中。大多数网卡将有一个或多个指示灯，用于指示其正在工作并连接。如果你遇到错误，请使用任何可用的诊断工具检查设备。\n\
    \n当你安装了网卡并确认其工作正常后，需要对网卡进行配置。配置网卡时所需的两个命令是 `ifconfig` 和 `ifup`。需要注意的是，`ifconfig`、`ifup`\
    \ 和 `ifdown` 命令中的某些选项需要超级权限。`ifconfig` 命令对于显示网卡状态非常有用，部分输出所示：\n\n```\n$ /sbin/ifconfig\n\
    eth0 Link encap:Ethernet Hardware 00:0D:56:E7:9D:B1\n  inet addr:192.168.1.38\
    \ Bcast:192.168.1.255\n  inet6 addr:fe80::20d:56ff:fee7:9db1/64 Scope:Link\n \
    \ UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1\n  RX packets:8773 errors:5\
    \ dropped:0 overflows:0 frame:5\n  TX packets:2722 errors:0 dropped:0 overflows:0\
    \ carrier:0 collisions:0 txqueue:1000\n  RX bytes:5185021 (4.9 Mb) TX bytes:226856\
    \ (221.5 Kb)\nInterrupt:11\n```\n\n下面列出了查找未正常工作网卡的若干操作。如果有多个网卡，网卡按顺序编号为 eth0、eth1\
    \ 等，你必须确保操作的是正确的设备。\n\n网卡必须开启系统才能识别它，你可以像下面所示使用 `ifconfig` 或 `ifup` 实现：\n\n```\n\
    ifconfig eth0 up\n```\n\n```\nifup eth0\n```\n\n重新配置设备的 IP 地址和子网掩码可能需要网卡处于非活动状态或反复开关。可以通过\
    \ `ifconfig` 或 `ifdown` 实现：\n\n```\nifconfig eth0 down\n```\n\n```\nifdown eth0\n\
    ```\n\n> 考试警告\n> 请记住 `ifconfig`、`ifup` 和 `ifdown` 通常位于 /sbin 目录，该目录不是大多数用户定义的\
    \ PATH 路径的一部分。因此，执行这些命令时可能需要完整的目录路径。\n\n与网卡关联的 IP 地址可以从 DHCP 服务器动态分配，也可以为其分配静态地址。要将网卡设置为特定的\
    \ IP 地址，命令是：\n\n```\nifconfig eth0 10.10.10.3 netmask 255.255.255.0\n```\n\n#\
    \ DHCP 设置与配置\n\n对于大多数设备，使用 DHCP 是首选方案。运行 DHCP 的主机通过联系中央服务器来获取 IP 地址，该服务器维护一个或多个客户端的地址。一旦客户端联系了服务器，它将获得一个\
    \ IP 地址、子网掩码，以及可能的其他信息，如默认路由和默认 DNS IP 地址。请求的信息存储在配置文件 /etc/dhclient.conf 中。\n\
    \n也可以使用命令行 DHCP 客户端 (/etc/dhcpcd) 来配置网络接口。从服务器获取的域名服务器 (DNS) 信息将写入 resolv.conf，或者在不可用时直接写入\
    \ /etc/resolvconf。在较大的网络中，DHCP 服务器还可以为网络信息服务 (NIS) 和网络时间协议 (NTP) 提供配置数据，这些将存储在\
    \ /etc/yp.conf 和 /etc/ntpd.conf 中。这些服务将由 dhcpcd 停止和启动，以确保它们收到更改。\n\n出于支持原因，dhcpcd\
    \ 命令还有许多有用选项：\n\n- - release 释放当前租约并取消配置。\n- - renew 尝试续租。这两个命令通常按顺序执行，以检查与 DHCP\
    \ 服务器的连接。\n\n# 网络\n\n- - nogateway 限制默认路由的任何更新。\n- - nontp 停止更新 ntp。\n- - nodes\
    \ 停止在 /etc/resolconf 中更新 DNS 信息。\n\nDHCP 替代客户端是 dhclient，它在启动时运行并读取 /etc/dhclient.conf\
    \ 文件。该文件包含当前系统中要配置的所有网络接口列表。如果使用此客户端配置接口，它会将 DHCP 租约存储在 /var/lib/dhcp/dhclient.leases。\n\
    \n# 配置无线接口\n\n要显示系统上所有无线接口的状态，请使用不带参数的 `iwconfig` 或 /usr/sbin 中的 `iwlist` 命令。无线统计从\
    \ /proc/net/wireless 文件获取。\n\n![](img/53450e0f52213)\n\n要设置无线网卡，参数如下：\n\n- - SSID\
    \ 设置网络名称。\n- - Mode 用于访问点。\n- - Key 以 ASCII 格式用于加密。\n\n# 网络配置文件\n\n网络配置文件可以自动或手动修改。它们包含\
    \ # 符号。\n\n# 主机文件 /etc/hosts\n\n主机文件将 IP 地址映射到主机名，包含 IPv4 和 IPv6。\n\n# 服务 /etc/services\n\
