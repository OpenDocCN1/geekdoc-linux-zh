    # Managing Processes


    Every program, utility, or bit of code waiting in the background on your Linux
    machine is called a process, and it is automatically handled by the kernel. Users
    can monitor and manage their own processes; system administrators have access
    to nearly all processes.


    # PS


    ps will show you what programs are being run by you in the terminal window it
    is executed in, which is usually just bash and the ps command itself. ps -A will
    show all the processes currently recognized by the machine. The output of the
    ps command is formatted into four columns. The first column is the process identification
    number or PID, which the system uses to uniquely identify each process. The next
    column is where the process is running - it’s "control terminal," which determines
    where the program’s input and output - should go.


    # BASH Commands


    Next is the amount of time the processor has spent on the process. The last is
    the "human readable" name of the process. Other useful options include the following:


    - -u or --user (username or user ID) will show processes associated with the given
    user.

    - -C (command_name) will show processes that have the given command name.

    - -p, -pp, or -pid (process_id) will show processes with the listed process ID.
    If ps is only given a number as an argument, it assumes the number is the process
    ID.

    - -t, -tty (ttylist) will show processes on a given tty interface. A plain "-w"
    will show processes not associated with a port, and a -t without a tty number
    will assume you the processes associated with the current port you are using.


    # KILL


    kill will forcefully end a process using the process id, and killall will terminate
    a process by name instead of PID.


    The kill command works by sending a signal to the process, by the default TERM
    signal. The syntax for signals is -s [signal] PID and common signals are shown
    in Table 5.4. Signals can also be used to communicate between processes, or by
    the kernel to report an event or problem back to a process.


    # TOP


    A more versatile utility is top, which dynamically shows processes in real time,
    sorted by the amount of CPU time they are using in Figure 5.2. The upper section
    of the top display shows a summary of the system, including uptime, current users
    (each bash session as a user), and various load and memory usage statistics. The
    lower part of the display shows processes ID, owner, amounts of various memory,
    and CPU resources being consumed by each process. One handy feature is a built-in
    kill option; to terminate a process, just press k and type in the process ID.


    | Signal Name | Number | Description |

    |---|---|---|

    | Kill | 9 | Forcibly kill the process |

    | INT | 2 | Interrupt, like typing control-c |

    | TERM | 15 | Gracefully terminate a program |

    | HUP | 1 | Often used to make the program reread its configuration |

    | QUIT | 3 | Like TERM but can cause a program to copy the memory it was using
    to a diagnostic file |


    # CHAPTER 5 Using BASH


    ![](img/53450e0f522134e838a034ce98470308_69_0.png)


