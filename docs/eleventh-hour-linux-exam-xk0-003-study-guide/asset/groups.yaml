    SMBFS 是一个旨在允许工作站访问服务器上目录/文件共享共享的框架。该模型以客户端/服务器架构实现，由两个组件组成。第一个组件是 SMB 协议，它为执行进程间通信和在
    TCP 445 上的监听器提供了机制。第二个组件是 SMB 服务，它是同时存在于客户端和服务器端的应用程序。SMB 服务与系统的认证机制和本地文件系统互操作，这允许
    SMB 环境与许多其他服务器进行互操作。微软版本的 SMBFS 被称为通用网络文件系统（CIFS）。Samba 应用是一个开源的客户端/服务器实现，它对 SMBFS
    和 CIFS 提供支持。


    ![](img/53450e0f522134e838a034ce98470308_18_0.png)


    需要理解本地文件系统与远程文件系统的区别，以及两者的优缺点。


    - 常见的网络（远程）文件系统有 NFS 和 SMB。

    - 与微软系统的连接通常使用 SMB。

    - 本地文件系统可以存在于内部或外部连接设备上。

    - 本地文件系统的性能通常优于网络文件系统。


    ## 挂载和 U(N)MOUNTING 文件系统


    挂载是将独立的存储设备附加或连接到根目录层次结构的形式。它使得本地或远程机器上物理分离的磁盘和/分区可用，在客户端上的附加位置被称为挂载点。Linux 用户可以手动挂载文件系统，也可以让文件系统在系统初始启动时自动挂载。


    ## mount 和 umount 命令


    要手动将文件系统挂载到现有的根目录结构，可以使用 `mount` 命令建立到本地挂载点的连接，该命令可以带参数也可以不带参数。不带参数执行 `mount`
    命令会列出系统中所有已挂载的文件系统。Linux 的一个独特特性是将设备（例如存储设备和终端）视为目录（文件夹），并使用 `/dev` 目录挂载设备。要挂载设备，请使用带有两个参数的
    `mount` 命令。第一个参数表示你希望附加到根目录结构中的存储设备。第二个参数表示你想要附加其下方的目录位置，即挂载点。大多数 Linux 系统的通用目录位置是
    `/mnt` 和 `/media` 目录。`/media` 目录通常用于挂载可移动媒体（例如软磁盘、CD/DVD 驱动器）。此外，在挂载任何存储设备之前，执行
    `mount` 命令前需要存在一个挂载点目录。


    ```

    mount /dev/sdb1 /mnt/morestore

    ```


    `mount` 命令确实包含额外的参数（例如用于超级块的 `sb` 和关闭日志的 `noad`）。要指定特定的文件系统类型，应使用 `-t` 参数。通常，Linux
    内核会自动检测你正在附加的存储设备的文件系统类型。


    要断开设备，请使用 `umount` 命令并指定挂载点。


    ```

    umount /mnt/morestore

    ```


    ## 快速入门


    挂载和卸载分区是系统管理员经常使用的过程。了解命令和选项非常重要。


    - 卸载设备的命令是 `umount`。

    - Linux 通常会检测你正在附加的文件系统类型。

    - 将需要永久挂载的系统添加到 `/etc/fstab` 文件中。


    ## /etc/fstab


    `/etc/fstab` 文件是文本格式的，它列出了每次系统启动时永久挂载的文件系统。将文件系统添加到 `/etc/fstab` 以便在启动时自动挂载的结构包含了要挂载的分区、挂载点、文件系统类型和其他文件系统选项（例如
    `nolist`、`noatime` 和 `auto`）。典型的结构如图2.1 所示。


    | LinuxExpert1@linux-01vc:~etc cat fstab | defaults | 0 0 |

    | :--- | :--- | :--- | :--- |

    | /dev/sda | swap | swap | 0 0 |

    | /dev/sda2 | ext3 | acl,user_xattr | 1 1 |

    | /dev/sda3 | /home | ext3 | acl,user_xattr | |

    | proc | /proc | proc | defaults | 0 0 |

    | sysfs | /sys | sysfs | noauto | 0 0 |

    | debugfs | /sys/kernel/debug | debugfs | noauto | 0 0 |

    | usbfs | /proc/bus/usb | usbfs | noauto | 0 0 |

    | devpts | /dev/pts | devpts | mode=0620,gid=5 | 0 0 |


    图 2.1

    /etc/fstab 文件


    ## 分区


    分区是在存储设备内将电子存储空间分配为特定文件系统类型的独立数据区域的过程。无论是通过分区编辑器工具实现还是通过 `fdisk` 命令实现，都可以创建、删除或修改分区。在对存储设备进行分区和格式化之前，无法进行文件夹和文件的创建和放置。对每个设备实现一个或多个分区的决定是基于某些优缺点的。


    ## 快速入门


    在存储设备上创建多个分区：


    - 改进了位于同一分区上的数据和应用程序的访问时间

    - 支持用户文件和操作系统文件的分离

    - 提供专用的操作系统交换（swap）或分页（paging）文件空间

    - 防止操作系统文件受系统数据文件快速增长（例如日志和系统缓存）的影响，这些文件可能会迅速耗尽所有可用磁盘空间

    - 支持多系统启动（multiboot）

    - 通过隔离分区保护操作系统文件免受快速消耗所有可用磁盘空间的系统数据文件的影响

    - 提供多启动支持


