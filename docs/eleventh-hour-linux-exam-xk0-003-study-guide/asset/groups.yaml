    the boot process with GRUB, you can enter various kernel parameters such as the
    modification of the runlevel parameter.


    # Fast Facts


    The use of a Rescue System is very useful as it loads a specialized kernel without
    a GUI from a variety of sources.


    +   - The original distribution disk can be used, check the file system for devices,
    verify and/or modify the bootloader configuration, resize the partition, and make
    a few other modifications that may be necessary.

    - You can use a Live CD that allows you to perform a system rescue by booting
    the system and mounting the disk partitions to fix or repair configuration or
    boot issues. These can be on CD, DVD, or even a memory stick.


    Single-user mode is used to bypass the requirement to enter a root password (many
    Linux distributions now force the entering of a root password). Typically, this
    option is used to gain access to the root prompt to change a lost or forgotten
    password. When the Linux system is booted under runlevel 1 (single-user mode),
    you will directly get a root prompt and you can execute the passwd command to
    modify the root password. As you are logged in as root, you will not be prompted
    to enter the old password.


    # SUMMARY OF EXAM OBJECTIVES


    In this chapter, we discussed the Linux boot process and the information that
    will be required during booting of a Linux system. GRUB is one of the default
    bootloading applications and loads the Linux kernel from the specified boot device.
    GRUB is used during the initial booting of the system and afterwards as an installation
    to or test GRUB configuration settings prior to applying the modifications to
    the system during the boot process. Three critical GRUB configuration files were
    presented: /etc/grub.conf, /boot/menu.lst, /boot/device.map. The grub-install
    command is used to reinstall the GRUB preinstallation to the hard disk on a running
    system. This command installs GRUB to either the MBR or a partition and checks
    for errors.'
- md: "\n## CHAPTER 3 Booting Linux\n\nRunlevels use a collection of scripts that\
    \ define how a computer system starts or stops by executing various services or\
    \ processes and the level of root administration and user access. The runlevels\
    \ are numbered from 0 through 6 with the default runlevel settings for the systems\
    \ located in the /etc/initstab file.\n\nThe final section, Troubleshooting Boot\
    \ Issues, introduced approaches to resolve boot problems. The dmesg command can\
    \ assist in troubleshooting or obtaining information about system hardware and\
    \ is used to send Linux kernel messages to a standard output by being able to\
    \ print or control the kernel ring buffer.\n\nThe dynamic modification of the\
    \ kernel option allows you to enter information to be executed by the Linux kernel\
    \ during the booting of your system. The kernel parameters can be added by editing\
    \ /boot/grub/grubmenu.lst, entering information at the boot prompt or by dynamically\
    \ modifying the kernel during the boot process with GRUB.\n\nThe Rescue approach\
    \ starts a specialized Linux kernel without a GUI. The Linux kernel loaded can\
    \ be obtained from a bootable device (for example, LiveCD). Once the kernel is\
    \ loaded into RAM, you may configure files, check the file system for defects,\
    \ verify and/or modify the boot loader configuration, resize the partition, and\
    \ a few other system modifications that may be necessary.\n\n## TOP FIVE TOUGHEST\
    \ QUESTIONS\n\n- 1. You are the IT system administrator for the Linux systems\
    \ in your department. You need to make changes to the default runlevel setting.\
    \ Which file contains the default runlevel setting?\n   A. /etc/initstab\n   B.\
    \ /etc/grub/boot/initab\n   C. /boot/grub/device.map\n   D. /etc/init.d\n\n- 2.\
    \ Your IT department has made several severe hardware device changes. These includes\
    \ changes modifications to the hard disk drives. You need to make modifications\
    \ to the GRUB bootloader. Which file should you edit to configure the GRUB stage\
    \ 2 image?\n   A. /etc/menu.lst\n   B. /boot/grub/menu.lst\n   C. /etc/grub.conf\n\
    \   D. /boot/grub/grub.conf\n\n- 3. You are the IT system administrator for the\
    \ Linux systems in your department. You need to make changes to the GRUB device\
    \ naming conventions. Which file contains the default runlevel setting?\n   A.\
    \ /etc/device.map\n   B. /etc/grub.boot/device.map\n   C. /boot/grub/device.map\n\
    \   D. /etc/init.d\n\n- 4. The Linux kernel is a critical component in the Linux\
    \ boot process. Where does it reside on the system?\n   A. The /kernel directory\n\
    \   B. The /grub/boot/kernel directory\n   C. The /boot directory\n   D. The /boot/kernel\
    \ directory\n\n- 5. The Linux bootloader is a critical component in the Linux\
    \ boot process. Where does it reside on the system?\n   A. It resides in the Master\
    \ Boot Record\n   B. It resides inside the Linux kernel\n   C. The /etc directory\n\
    \   D. Inside the system BIOS\n\n## ANSWERS\n\n- 1. Correct answer and explanation:\
    \ A. Answer A is correct because the /etc/initstab contains the default runlevel\
    \ setting. The default setting for runlevel 5 looks like the following:\n\n```\n\
    5:initdefault\n```\n\nIncorrect answers and explanations: B, C, and D. Answer\
    \ B is incorrect because the path /etc/grub does not exist. Answer C is incorrect\
    \ because /boot/grub/device.name is used to map Linux device names to GRUB naming\
    \ conventions. Answer D is incorrect because /etc/init.d is the directory containing\
    \ the runvels scripts.\n\n- 2. Correct answer and explanation: C. Answer C is\
    \ correct because /etc/grub.conf contains information about the disk partition\
    \ used to find and load GRUB stage2 image.\n\nIncorrect answers and explanations:\
    \ A, B, and D. Answer A is incorrect because the menu.list does not reside in\
    \ the /etc directory and the file is used to determine which operating system\
    \ is loaded and booted on the menu item selected. Answer B is incorrect because\
    \ the file is used to determine which operating system is loaded and booted on\
    \ the menu item selected. Answer D is incorrect because the grub.conf does not\
    \ reside in the /boot/grub directory.\n\n- 3. Correct answer and explanation:\
    \ C. Answer C is correct because /boot/grub/device.name is used to map Linux device\
    \ names to GRUB naming conventions.\n\nFor example:\n\n```\n(hd0)->~/dev/sda\n\
    ```\n\nIncorrect answers and explanations: A, B, and D. Answer A is incorrect\
    \ because the path /etc does not contain device.map. Answer B is incorrect because\
    \ the directory /boot/grub does not exist. Answer D is incorrect because /etc/init.d\
    \ is the directory containing the runvels scripts.\n\n- 4. Correct answer and\
    \ explanation: C. Answer C is correct because the Linux kernel is located in the\
    \ /boot directory.\n\nIncorrect answers and explanations: A, B, and D. Answers\
    \ A, B, and D are incorrect because these directories do not exist.\n\n- 5. Correct\
    \ answer and explanation: A. Answer A is correct because the Linux Bootloader\
    \ resides in the Master Boot Record (MBR). The MBR is the bootloading sector.\
    \ The system BIOS reads the first sector of the boot device. This sector is 512-bytes\
    \ in size. For a hard disk drive, this special sector is known as the MBR.\n\n\
    Incorrect answers and explanations: B, C, and D. Answer B is incorrect because\
    \ the Linux bootloader is used to retrieve the Linux kernel. Answer C is incorrect\
    \ because /etc is a folder mounted by the Linux kernel once it obtains control\
    \ from the Linux bootloader. Answer D is incorrect because the system BIOS reads\
    \ the first sector of the boot device. This sector contains the Linux boot loading\
    \ program. The system BIOS loads the bootloader into memory and executes the program.\n\
    \n## CHAPTER 4\nConfiguring the Base System\n\n- Exam objectives in this chapter\n\
    - User Profiles\n- Device Management\n- Networking\n\n## INTRODUCTION\n\nThis\
    \ chapter explains how to configure system and user profiles as well as the common\
    \ environment variables, the management of the various devices and where these\
    \ are located in the disk structure, and the fundamentals of Linux networking\
    \ utilizing TCP/IP and how to manage within Linux.\n\nUser management is one of\
    \ the fundamental tasks that need to be understood for day-to-day management of\
    \ a Linux system. Ensuring that users have the correct rights and environment\
    \ setup will assure that their experience in using the system is favorable and\
    \ that the overhead is kept to a minimum.\n\nThe networking of the computer system,\
    \ whether via wired or wireless connection, is usually a necessity in today's\
    \ world. The computer also utilizes Transmission Control Protocol/Internet Protocol\
    \ (TCP/IP) as the transport mechanism for the network connections and the different\
    \ options available to set up this will be discussed. The basics in connecting\
    \ to name servers (NSs) and Dynamic Host Configuration Protocol (DHCP) servers\
    \ are also discussed, and the majority of parameters are explained.\n\n## USER\
    \ PROFILES\n\nAny installation of Linux includes the creation of different user\
    \ accounts: the superuser, a normal day-to-day user, and a system user. A normal\
    \ user can add, delete, and modify his or her files and those that have the attribute\
    \ set. These users cannot make system-wide changes nor can they manage other users.\n\
    \n## CHAPTER 4\n Configuring the Base System\n\nA superuser (also referred to\
    \ as a system administrator) has global privileges and can create and delete users\
    \ can change the permissions of files within the filesystems. There is a special\
    \ superuser known as root, with a user ID and group ID of 0. This user has full\
    \ and unrestricted rights to manipulate any file, to traverse any directory, and\
    \ to execute any program.\n\n## Fast Facts\n\nAll users in a system will have\
    \ a profile which is configurable.\n\n- Only superusers have the rights to configure\
    \ other user' profiles.\n- Use export when you set environment variables if they\
    \ need to be elsewhere in the environment.\n- Use the full path name when you\
    \ need to run commands that are not located in a directory specified in your path\
    \ variable.\n- Setting a variable may require additional actions, for example,\
    \ setting the PRINTER variable also needs printer installed.\n\nA system user\
    \ is an administrative account that is used by the system itself for the running\
    \ of various administrative tasks. System users differ from other users in the\
    \ system that they do not have a home directory or password; nor can be accessed\
    \ via the normal system prompt.\n\n## System and User Profile and Environment\
    \ Variables\n\nUsers on the system are able to customize their profile to suit\
    \ specific needs and preferences, held in environment variables throughout the\
    \ system. There are three different shells in bash (Bourne-again shell): login\
    \ shell, normal shell, and interactive shell. The login shell bash_profile located\
    \ in the user home directory or /etc directory, and interactive shells refer ~/.bashrc.\
    \ The environment variables are named objects that contain information that can\
    \ be used by one or more applications.\n\nA summary of the bash (Bourne-again\
    \ shell) startup files is shown below:\n\n- /etc/profile: The system-wide startup\
    \ file and will be executed when a user logs on.\n- /etc/bashrc: This is often\
    \ linked to /etc/bashrc and is called per-interactive shell startup.\n\nBoth these\
    \ files will be protected, and only the superuser (root) will be able to make\
    \ changes to the file. As the files may be overwritten with a system upgrade,\
    \ it is not recommended that changes are made to them directly.\n"
  mdcn: "\n\n## 第 3 章 启动 Linux\n\n运行级别（Runlevels）使用一组脚本，通过执行各种服务或进程，来定义计算机系统的启动或停止，以及\
    \ root 管理权限和用户访问的级别。运行级别编号从 0 到 6，系统的默认运行级别设置位于 `/etc/initstab` 文件中。\n\n最后一个章节“故障排除启动问题”介绍了解决启动问题的方法。`dmesg`\
    \ 命令可以协助故障排除或获取有关系统硬件的信息，它通过能够打印或控制内核环形缓冲区（ring buffer），将 Linux 内核消息发送到标准输出。\n\
    \n内核选项的动态修改允许你输入在系统启动期间由 Linux 内核执行的信息。可以通过编辑 `/boot/grub/grubmenu.lst`、在启动提示符（prompt）处输入信息，或在启动过程中使用\
    \ GRUB 动态修改内核来添加内核参数。\n\n救援（Rescue）方法会启动一个没有图形界面的特殊 Linux 内核。所加载的 Linux 内核可以从可启动设备（例如\
    \ LiveCD）获取。一旦内核加载到内存（RAM），你就可以配置文件、检查文件系统缺陷、验证和/或修改引导程序配置、调整分区大小，以及其他可能必要的系统修改。\n\
    \n## 五大最难级问题\n\n- 1. 你是部门 Linux 系统的 IT 系统管理员。你需要更改默认运行级别设置。哪一个文件包含默认运行级别设置？\n\
    \   A. /etc/initstab\n   B. /etc/grub/boot/initab\n   C. /boot/grub/device.map\n\
    \   D. /etc/init.d\n\n- 2. 你的 IT 部门进行了若干次严重的硬件设备更改。这些包括对硬盘驱动器的修改。你需要修改 GRUB 引导加载程序。你应该编辑哪个文件来配置\
    \ GRUB 2 阶段镜像？\n   A. /etc/menu.lst\n   B. /boot/grub/menu.lst\n   C. /etc/grub.conf\n\
    \   D. /boot/grub/grub.conf\n\n- 3. 你是部门 Linux 系统的 IT 系统管理员。你需要更改 GRUB 设备命名规范。哪个文件包含默认运行级别设置？\n\
    \   A. /etc/device.map\n   B. /etc/grub.boot/device.map\n   C. /boot/grub/device.map\n\
    \   D. /etc/init.d\n\n- 4. Linux 内核是 Linux 启动过程中的关键组件。它位于系统的哪个位置？\n   A. /kernel\
    \ 目录\n   B. /grub/boot/kernel 目录\n   C. /boot 目录\n   D. /boot/kernel 目录\n\n- 5.\
    \ Linux 引导加载程序是 Linux 启动过程中的关键组件。它位于系统的哪个位置？\n   A. 它位于主引导记录（MBR）中\n   B. 它位于\
    \ Linux 内核内部\n   C. /etc 目录\n   D. 在系统 BIOS 内部\n\n## 答案\n\n- 1. 正确答案及解释：A。答案 A\
    \ 是正确的，因为 `/etc/initstab` 包含默认运行级别设置。运行级别 5 的默认设置如下：\n\n```\n5:initdefault\n```\n\
    \n错误答案及解释：B、C 和 D。答案 B 是错误的，因为路径 `/etc/grub` 不存在。答案 C 是错误的，因为 `/boot/grub/device.name`\
    \ 用于将 Linux 设备名称映射到 GRUB 命名规范。答案 D 是错误的，因为 `/etc/init.d` 是包含运行级别脚本的目录。\n\n- 2.\
    \ 正确答案及解释：C。答案 C 是正确的，因为 `/etc/grub.conf` 包含了用于查找和加载 GRUB stage2 镜像的磁盘分区信息。\n\n\
    错误答案及解释：A、B 和 D。答案 A 是错误的，因为 `menu.list` 不位于 `/etc` 目录中，且该文件用于确定在选定的菜单项上加载并启动哪个操作系统。答案\
    \ B 是错误的，因为该文件用于确定在选定的菜单项上加载并启动哪个操作系统。答案 D 是错误的，因为 `grub.conf` 不位于 `/boot/grub`\
    \ 目录。\n\n- 3. 正确答案及解释：C。答案 C 是正确的，因为 `/boot/grub/device.name` 用于将 Linux 设备名称映射到\
    \ GRUB 命名规范。\n\n例如：\n\n```\n(hd0)->~/dev/sda\n```\n\n错误答案及解释：A、B 和 D。答案 A 是错误的，因为路径\
    \ `/etc` 不包含 `device.map`。答案 B 是错误的，因为目录 `/boot/grub` 不存在。答案 D 是错误的，因为 `/etc/init.d`\
    \ 是包含运行级别脚本的目录。\n\n- 4. 正确答案及解释：C。答案 C 是正确的，因为 Linux 内核位于 `/boot` 目录。\n\n错误答案及解释：A、B\
    \ 和 D。答案 A、B 和 D 是错误的，因为这些目录不存在。\n\n- 5. 正确答案及解释：A。答案 A 是正确的，因为 Linux 引导加载程序位于主引导记录（MBR）中。MBR\
    \ 是引导扇区。系统 BIOS 读取启动设备的第一个扇区。该扇区的大小为 512 字节。对于硬盘驱动，这个特殊扇区被称为 MBR。\n\n错误答案及解释：B、C\
    \ 和 D。答案 B 是错误的，因为 Linux 引导加载程序用于检索 Linux 内核。答案 C 是错误的，因为 `/etc` 是 Linux 内核获取控制权后挂载的文件夹。\n\
