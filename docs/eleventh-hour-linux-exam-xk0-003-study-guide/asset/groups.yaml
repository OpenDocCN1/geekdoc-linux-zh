    ## Differences between KDM and GDM


    At first glance, the differences between GDM and KDM are purely cosmetic (colors,
    whether there is a toolbar at the bottom of the screen or main menu, and so on).
    Overall, it is said that a system KDE is more than Microsoft Windows like with
    GNOME.


    GDM by default has two toolbars at the top and bottom, and it also divides it
    into three subsections: *applications, places, and system*. KDM has only one toolbar
    at the bottom and its menu is divided into favorites, *applications, and computer*.
    In terms of user input, the default for KDM is one click, and two in GDM. Also,
    the system configuration menus are usually more complicated in KDM as opposed
    to GDM.


    You can install both window managers on one system and switch between them (or
    have them display on different monitors at the same time, if you have enough computing
    and power). This is undertaken in many ways, with common distributions like Fedora
    using the `switchdesk` command.


    ## Multiple Desktops


    Within the Windows systems, there is an ability to have more than one desktop.
    Each desktop is known as a virtual desktop within the system, and each can operate
    independently to another. This concept allows the user to create or more separate
    environments where simultaneous tasks can be undertaken. This might involve a
    word processor in one desktop, email client open in another, and perhaps some
    scripts running in a terminal session in another. The use of virtual desktops
    allows an uncl view of the applications with the ability to change another desktop
    at the click of a button.


    ## KDE VIRTUAL DESKTOP


    There are four virtual desktops installed with KDE as a default, with the option
    to install a total of 36. These are shown on the bottom toolbar, initially numbered
    1 to 4.


    Moving between desktops is achieved just by clicking on the appropriate number.
    The standard desktop is initially installed on all desktops. To make it easier
    for navigation, this can be renamed using the multiple desktop control module
    shown in Figure 7.2.


    The toolbar will then appear as shown in Figure 7.3.


    ## GNOME WORKSPACES


    Within the GNOME system, these are called workspaces and there is a *workspace
    switcher application* that controls this. You can set different preferences including
    the number of workspaces you want (up to 36). The user can move to a different
    workspace using the applet or you can move to one by pressing Ctrl and scrolling
    the mouse to highlight the desired workspace. A part of a typical GNOME screen
    showing four numbered workspaces is shown in Figure 7.4. Rather than having names
    such as Desk 1, Desk 2, and so on, you can rename the workplaces to more meaningful
    names, perhaps mail, scripts, Internet, and so forth. Individual applications
    within one desktop can be moved to another desktop or be visible in all workspaces.


    ## X Window System Directories


    The current implementation of X controlled by the X.org foundation (www.x.org)
    is a distribution commonly called Xorg, typically more than 100 MB in size.


