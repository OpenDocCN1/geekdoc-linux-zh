    - Using the setuid bit allows files to be run with administrator rights.


    # STICKY BIT


    When the sticky bit is set on a directory, files within that directory can only
    be renamed or deleted by their owner, the directories owner, or the system administrator.
    Without the sticky bit, any user with write and execute privileges in the directory
    could delete files.


    # SELINUX BASICS


    Operating systems are a complex set of modules, which will inevitably contain
    flaws that need to be patched at time during their lifecycle. The real risk is
    that someone figures out how to exploit a flaw or vulnerability in your system
    before you get a chance to patch it or even before the software provider realizes
    there is a problem and can fix it.'
