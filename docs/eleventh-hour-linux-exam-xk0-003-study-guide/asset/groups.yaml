    # 第 2 章

    管理文件系统


    ## 本章考试目标

    - 文件系统类型

    - 挂载和卸载文件系统

    - 分区

    - 目录

    - 文件系统管理


    # 引言


    本章介绍了文件系统的创建策略、不同类型的文件系统、用于创建文件系统的工具以及用于管理文件系统的工具。


    # 文件系统类型


    文件系统为操作系统提供了一个数字信息组织、修改、删除和检索的框架。为了实现这些要求，文件系统负责组织和维护文件、文件夹、元数据和残留数据，作为存储数字信息的容器。无论选择何种文件系统类型，数据容器的大小可以从数太字节（TB）到小到扇区（sector）。扇区的大小在不同文件系统类型之间可能有所不同；但它是可以分配给用于存储文件的最小磁盘空间单位。扇区的默认大小通常为
    512 字节。


    > 快速概览


    文件系统组织并维护以下数据：


    - 文件是文件系统内分配的空间扇区，用于存储数字信息。

    - 文件是文件系统内分配的空间扇区，用于存储数字信息。分配的空间可以是连续的，也可以是非连续的。有四种不同类型的文件：普通文件、链接、先进先出（FIFO）和套接字（sockets）。

    - 目录（或文件夹）是文件系统内分配的空间扇区，用于对分组。这种关联在文件分配表（FAT）中执行并维护。目录是分级结构，目录包含子目录。

    - 元数据是操作系统用于进一步描述文件和文件夹的数据。通常，会创建并使用某种形式的索引文件。索引信息可以包含文件大小、文件时间戳、扇区位置以及与访问权限和设备类型的信息。

    - 残留数据是在文件、文件名、文件夹和名称关系断开后留在文件系统中的一种形式的数据，大小不异。这通常发生在删除文件或文件夹之后，可能小到一个扇区。空隙（Slack
    space）是磁盘上任何当前未与特定文件关联的残留数据。


    对于各种类型的文件系统，存储容器（也称为存储介质类型）可以位于许多不同的存储设备上。


    # 第 2 章 管理文件系统


    ## 你知道吗？


    - 硬盘媒体类型用于内部或外部驱动器的数据。

    光存储媒体类型分为 CD 和 DVD。CD 和 DVD 都支持 ISO 9660 标准，也称为 CDFS。

    网络型类型由服务器消息块（SMB）和网络文件系统（NFS）组成。客户端建立网络连接。

    移动存储类型是为闪存内存设计的。内存设备主要用于闪存卡。

    随机访问存储器（RAM）类型作为内存的一部分运行。压缩文件系统（cramfs）用于许多 Linux 发行版。

    特殊用途文件系统通过应用程序或系统工具处理文件、文件夹和元数据。


    # 本地文件系统


    本地文件系统缓解了与网络文件系统、内存磁盘和移动文件系统相关的许多挑战。这包括由于网络带宽引起的性能挑战、由于网络连接导致的访问失败，以及在电源恢复后需要重新配置的持久系统（例如内存磁盘）。


    本节介绍了一些常用的文件系统：FAT、新建文件系统（NTFS）和虚拟文件表（VFAT）。这些总结在表 2.1 中。


    > 考试警告

    使用 FAT 文件系统的早期操作系统允许仅使用八个字母字符命名，并用点分隔名称和三个字母字符扩展名。VFAT 支持长文件名，允许文件名长达 255 个字母字符。VFAT
    是挂载外部文件系统的首选文件系统。


    # 网络


    Linux 文件系统还可以跨网络，允许它们作为客户端/服务器模型为远程系统提供文件共享服务。服务器组件提供通过网络连接的共享目录。客户端组件在获取访问后，将目录连接到本地文件系统的挂载点上。在
    Linux 环境中，两种主要的网络文件系统是 NFS 和服务器消息块文件系统（SMB）。


    NFS 是一个框架，允许客户端工作站通过网络访问网络化服务器上的远程文件。在这种模型中，服务器共享一个或多个目录供网络客户端访问。NFS 使用端口 TCP
    2049 和 UDP 2049。


    # 表 2.1 FAT 簇和分区大小


    | 名称 | 簇地址大小 | 分区大小 |

    | :--- | :--- | :--- |

    | FAT12 | 12 位 | 16 MB |

    | FAT16 | 16 位 | 2 GB |

    | FAT32 | 32 位 | 2 TB |


