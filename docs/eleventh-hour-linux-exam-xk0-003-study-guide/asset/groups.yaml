    # IMPLEMENTING REMOTE ACCESS


    Secure methods of remote access are defined below.


    ## SSH


    Although Telnet is still available, the preferred method for accessing a command
    shell on a remote system is the secure shell (SSH). An ssh client is used to connect
    to a remote system running the ssh daemon. The syntax for ssh is [OPTIONS] [username@]hostname
    [command].


    Basic connectivity to connect server1 is to type ssh server1 and assumes you want
    to use the same username on the remote system, as you are using the local one.
    To log in to the remote system with a different username, you can either use the
    -l username option or put the username in front of the host, with an @ between
    them, like this: ssh bob@server1


    The first time ssh is used to connect to a host, the new host''s signature is
    shown, and ssh asks if you''d like to add the signature to your list of known
    hosts.


    ## SECURE TUNNELS


    ssh can catch traffic going to a TCP port, pass it through its encrypted connection,
    and hand it off to a TCP port on the remote side, encrypted or unencrypted network
    traffic. This is called forwarding or tunneling.


    To create a tunnel, you need to know the TCP port of the service on the remote
    server that you want to pick and pick an unused TCP port on your local service.
    The syntax looks like this:


    ```

    ssh -Local_tcp_port:localhost:remote_tcp_port remote_host_name

    ```


    ## SFTP


    ssh can be used instead of File Transfer Protocol (FTP), which doesn''t use any
    encryption, using sftp. Once you log in to the remote system, you can use sftp
    commands to send and receive files. The syntax to get connected in this way is
    the same as regular ssh.


    ## Fast Facts


    SFTP commands are similar to both BASH and FTP, including:


    - cd path changes the remote directory.

    - ls views the contents of the remote directory.

    - put copies a file from the local to the remote machine.

    - get copies a file from the remote machine to the local.

    - bye or quit sftp.


    ## X11 FORWARDING


    One feature of ssh is X11 forwarding, which is essentially the same as the TCP
    port forwarding discussed earlier. It allows you to connect your ssh server to
    the remote client such that a program running on the end draws a graphic interface
    on your local screen. To test it, log into a remote host with ssh or ssh -X if
    X11 forwarding is not enabled, and execute a program that has a graphic interface.
    You may want to add & at the end of the command to run it in the background.


    ## KEYGEN


    The ssh-keygen command is used to create a public/private key pair. Once the public
    key is placed on the remote host, ssh uses the keys to authenticate your login,
    and passwords are no longer required. The steps are:


    - 1. Use ssh-keygen to create a key pair.

    - 2. Copy the public key from your user home directory .ssh/id_rsa.pub to the
    remote user home directory .ssh/authorized_keys.

    - 3. ssh checks for matching keys when logging in, and if they are found, it doesn''t
    ask for a password.


    Once the keys are in place, ssh can be configured to require public/private keys
    to log in remotely, which makes for a very secure system, as long as your keys
    remain safe and don''t get lost.


    ## AUTHENTICATION METHODS


    Authentication is the process the system uses to determine you are supposed to
    be given access when you type in your username and password. It comes in two basic
    factors:


    - Local authentication is limited to a single computer. It knows who you are,
    but no other computers do. It is easy to set up and administer on a few computers
    but scales poorly.

    - Centralized authentication allows user information and other settings to be
    gathered into a single repository and then accessed from trusted computers. Centralized
    systems can be much more complicated to configure, but make it much easier to
    administer large networks of computers.


    ## PAM


    Pluggable Authentication Modules (PAMs) provide dynamic authentication requests
    from Linux programs and services. The modular design means that implementing some
    new authentication technology (like a fingerprint scanner) or policy (like mandatory
    password complexity) is as easy as plugging in the appropriate modules and telling
    the system to use them by updating the appropriate configuration file. Each authentication
    program has its own PAM configuration file. Configuration files are stored in
    the /etc/pam.d directory.


    ## Fast Facts


    There are four groups of management tasks that are covered by PAM:


    - Authentication modules verifies users.

    - Account modules checks the account is still valid, tracking items as passwords,
    account expiration, and time of day.

    - Session modules handles tasks related to the start and close of a user session.
    Sessions cannot start until the user is authenticated.

    - Password modules are used to update password or other authentication mechanism
    and can enforce the strength of the password.


    Each PAM configuration file lists types of management task, which module(s) to
    check while performing the task, and a control that tells if passing the module
    test is, among others, mandatory or optional. The actual PAM modules are stored
    in /lib/security/.


    ## LDAP


    Lightweight Directory Access Protocol (LDAP) is used to query and modify directory
    services on TCP/IP. A directory can be considered to be a set of objects, each
    with their own attributes which are organized in a hierarchical manner. The LDAP
    directory tree uses DNS to structure the upper levels of this hierarchy with specific
    organizational structures below this could be organizations, systems, individual
    people, or even hardware printers.


    LDAP systems typically use the stand-alone LDAP daemon; slapd provides the back-server
    functionality to store user information. Individual workstations then access the
    slapd directory as needed: via a PAM plug-in for authentication or maybe through
    an e-mail client to look up e-mail addresses.


    ## NIS


    Network Information System (NIS) is another option for storing centralized user
    and other configuration files. It was originally called the yellow pages, so many
    NIS commands start with “yp.” NIS has a central directory of information containing
    users, groups, host names, and e-mail addresses as well as a plethora of other
    information. There is a database of configuration files that can be shared across
    the network, and /etc/passwd, /etc/group and /etc/shadow are shared, and a user
    can log in on different workstations.


    ## RADIUS


    Remote Authentication Dial In User Service (RADIUS) was originally developed for
    dial-in access via modems but is now used as centralized authentication and authorization
    system across networks. It is a client/server protocol with the client forwarding
    requests to the RADIUS server to grant or deny the request.


    ## Two-factor Authentication


    Two-factor authentication refers to a requirement to provide two things when you
    log in, usually “something you know” – a password and “something you have” – an
    access token of some sort. Two-factor authentication makes it much harder to break
    into someone else’s account because guessing his or her password is no longer
    good enough.


    ## SUMMARY OF EXAM OBJECTIVES


    Although “security” is frequently associated with “restrictions,” it is helpful
    to consider it in terms of “allowances.” To summarize, remember that the adduser
    command allows access to the system, chmod modifies how users can do with files,
    and groupadd can be used to create groups that can be used to share information.
    The su and sudo commands extend user privileges to allow administrative tasks,
    and ssh allows access to other systems. User account information can be shared
    between systems with ldap and nis, and authentication requirements can be customized
    using on a Linux system with pam.


    There are number of applications for observing the Linux system environment, including


    - Nessus and nmap for scanning networks

    - Wireshark for capturing packets on a network interface

    - Snort for watching a network for suspicious traffic

    - Tripwire to watch for suspicious file updates

