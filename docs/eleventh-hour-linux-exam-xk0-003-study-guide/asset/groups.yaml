    # CHAPTER 7 Installing Configuring as a Workstation


    # X SESSION MANAGER


    The state of the desktop or session at a given time is managed by the X Session
    Manager. This allows, for instance, a user to log out and log into a session and
    to have the same windows displayed. The session manager stores the state of all
    the windows on exit to restore them. Although the default session manager *xsm*
    can be used, specific session managers are often bundled with the display manager,
    such as *ksmanager* in KDE.


    # DISPLAY MANAGER


    The display manager runs as a program that allows the X server to start a session
    on a system, either local to or remotely. The display manager often prompts the
    user for a user name and password with an initial login screen, although it may
    be bypassed depending on the set up of the system (usually via KDE’s auto login
    feature). When it runs on a local system, it will start the X server before presenting
    the login screen. In a remote session, the display manager will act like a telnet
    server requesting a username and password for starting the remote session. The
    default display manager in X is the Windows Display Manager (XDM). The most popular
    alternative display managers are explained later. Alternative display managers
    are often used, as the default XDM is more complex to configure for the standard
    user.


