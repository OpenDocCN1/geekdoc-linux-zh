    \ 指定间隔为秒，最后一个参数 `6` 指定采集六组统计数据。\n  错误选项及解释：A、C、D。答案 A 是错误的，因为 `-A` 告诉 `sar` 采集所有可用的系统统计数据；答案\
    \ C 是错误的，因为最后两个参数反反了，这意味着每 6 秒采集 600 组统计数据；答案 D 是错误的，因为使用了 `-A` 切换。\n\n- 5. 正确答案及解释：D。答案\
    \ D 是正确的，因为 TCP 端口 1023 以上必须开启以确保主动模式所需的所有连接都能建立。\n  错误选项及解释：A、B、C。答案 A 和 C 是错误的，因为主动模式\
    \ FTP 使用 TCP 端口 1023 以上，而不是以下；答案 B 是错误的，因为如果端口开启连接可以建立。\n\n"
