    ```


    The var/lib/rpm/packages file is the primary database of all the installed software
    in the system and will grow depending on the number of packages. A file of 40
    MB or larger is not an unusual size for a fully loaded system. This directory
    is used by RPM to manage all software.


    The rpm package names are in a standard format and contain


    - Package software name

    - Version of the software

    - Release number of the package

    - Architecture the package was built for.


    The actual format will be as:


    ```

    <package_name>-<version>-<arch>.rpm

    ```


    As an example, the rpm for the Telnet package file, with a version of 0.17 and
    a release of 23 built for the i386 platform, would look like telnetd-0.17-23.i386.rpm.

