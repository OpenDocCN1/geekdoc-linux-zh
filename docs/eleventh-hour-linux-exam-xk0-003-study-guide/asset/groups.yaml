    # 第 5 章 使用 BASH


    - apropos 和 whatis 是由 mandb 创建的数据库。

    - 在某些发行版中，由 mandb 创建的数据库可以通过 makewhatis 进行处理。

    - info 旨在作为一种改进的方法，用于管理 GNU 工具的文档，并以线程化的分块节点的形式提供信息。


    ## 访问内核和架构信息


    Linux 使用位于 `/proc` 的虚拟文件系统来表示计算机内的活动，并允许与各种内核和驱动组件进行通信。如果你比较 `ps -a` 和 `ls /proc`，你会发现每个进程在
    `/proc` 下都有自己的子目录。还有用于系统硬件的文件：`cat /proc/cpuinfo` 会告诉你关于处理器的所有你想知道的信息，而 `/proc/version`
    则包含所有已安装的 Linux 版本。检查已安装版本的另一种略有不同的方法是 `uname -a`。注意，`/proc/version` 显示的是具体的发行版名称，而
    `uname -a` 则会显示你运行的是 32 位还是 64 位进程。


    `/proc/sys` 目录树中的所有设置都可以使用 `sysctl` 进行调整。更改在系统重启后会丢失，必须将其添加到 `/etc/sysctl.conf`
    中以永久生效。使用 `sysctl -p` 可以让系统重新读取 `sysctl.conf` 文件，而无需重启。


    ## 基础脚本


    脚本是一个包含行程序和选项的纯文本文件，这些可以作为一个组运行。每行都会逐个读取并解释，这可能导致脚本运行缓慢。除非使用 `sh` 命令，否则脚本需要具有执行权限，该命令使
    `sh` 变为可执行，而脚本仅作为一个参数。


    bash 脚本文件期望第一行是 `#!/bin/bash`，此脚本希望使用 `/bin` 目录下的 bash shell 运行。


    ## 使用 Shell 特性


    bash shell 提供历史功能，可以记住你之前输入的命令，这些命令存储在家目录下的隐藏文件中：`.bash_history`，通过输入 `history`
    可以查看整个列表。输入 `!!` 将重复上一个命令。当你输入 `history` 时，命令行前面会有一个数字；输入 `<command-number>` 就会重新执行对应的命令。另一个命令行功能是
    Tab 键补全。Bash 会尝试使用 Tab 键猜测你正在尝试输入的内容。如果你已经输入了足够的字符来唯一标识下一个单词，bash 将为你填充它。如果你输入的单词还不够，再次按下
    Tab 键将显示可能的匹配项列表。


    ## 任务调度


    在接下来的章节中，你将学习如何使用 `cron` 将常规任务放在自动化调度上，以及使用 `at` 处理临时任务。


    ## cron (cron 允许，cron 禁止)


    对于需要定期或按预定义间隔执行的常规任务，有一个调度服务 `cron`，它允许你按照自己的设计对这些任务安排计划并在后台运行，每分钟检查一次是否有计划运行的任务。`/etc/cron.allow`
    文件列出了唯一能够编辑 cron 配置（crontab）文件的用户。如果该文件为空，系统会查找 `/cron.deny` 文件，该文件列出了禁止编辑 cron
    文件的用户。root 用户不受这两者的影响。


    ## crontab 命令语法


    crontab 文件（cron 表）告诉系统运行什么以及何时运行，它们为用户存储在 `/var/spool/cron` 中，其中 crontab 名称与用户名匹配。管理员的文件保留在
    `/etc/crontab` 中，并且有一个 `/etc/cron.d` 目录，程序可以使用它来存储自己的调度文件。


    crontab 文件使用 `crontab -e` 进行编辑，每行有六或七个字段并指定一个命令。


    - 每行的前五个字段告诉在几分、几小时、几、每月以及星期几运行命令。

    - 接下来是指定在谁的权限下运行命令。

    - 最后是命令本身。

    - 调度字段的有效选项是 `*`（匹配任何内容）、精确数字、两个之间用连字符连接的数字（表示范围），或用逗号分隔的值列表以匹配每个单独值。

    - `crontab -l` 显示你的 crontab 文件的内容。

    - `crontab -r` 删除它。


    ## atq


    如果你只想在稍后运行某些东西，请使用 `at` 命令。它接受来自文件 (`-f`) 或标准输入的命令，并以 `<ctrl> d` 结束。如果行尾没有内容，按一次
    Ctrl + d 就足够了。如果行尾还有内容，则需要两次 Ctrl + d。使用 `at` 查看队列中的作业及其作业编号。要取消作业，请使用 `at` 加上你想要取消的作业编号。


    ## 管理服务


    作为系统管理员，你的主要工作之一是管理运行在系统上的服务。


    ## 快速入门


    - 服务（守护进程）只是在后台启动并运行为用户提供服务的程序。


    - 服务在分配的运行级别（runlevel）初始化时启动。

    - 启动服务的脚本位于 `etc/init.d`。

    - 脚本可以使用 `start`、`stop`、`restart` 参数手动使用。


    ## inetd 和 xinetd


    为了节省资源，较小且使用频率较低的网络服务被组合在一个超级服务中，在后台等待直到某个服务被需要并加载它。这种方法防止了服务在实际被需要之前一直占用内存。Linux
