    # Linux 安装过程


    Linux 可以从各种本地和网络源进行安装。除了少数独特的设置外，每个安装源的安装过程本质上是相同的。Linux 本地介质安装可以使用 CD、DVD 或 .iso
    源进行。当安装程序从本地源启动时，系统将完成板载自检并显示初始屏幕，允许用户选择各种选项，例如安装、修复、救援等。提供的选项将根据 Linux 发行版的不同而异，但通常遵循以下项：


    - 从硬盘启动：用于自动启动现有的 Linux 操作系统。

    - 修复已安装的系统：此选项用于修复之前安装的系统。

    - 安装：此选项从 Linux 发行版中加载微型 Linux 内核并启动安装过程。

    - 救援系统：此选项将启动一个没有图形用户界面的特殊 Linux 内核。它将 Linux 内核加载到内存中，并可能加载配置文件、检查文件系统的缺陷、和/或修改引导加载程序配置、调整分区大小，以及可能必要的其他关键修改。

    - 检查安装介质：用于确保镜像的完整性。

    - 内存测试：此选项使用 memtest86 对您的系统进行句法测试。


    安装过程分为三个不同的阶段：准备、安装和配置。准备阶段帮助您配置系统的语言、日期和时间、桌面环境、用户帐户信息、root 密码验证方法以及磁盘分区信息类型。安装阶段是非交互式过程，负责安装软件并为系统的初始启动序列做好准备。最后一个阶段是配置阶段，取决于您选择的是自动配置还是手动配置，安装程序软件将能够预配置各种网络设置，要么允许您输入网络配置信息。例如，您的系统主机名、域名和其他网络配置设置（例如接口、DHCP、防火墙）。


    # 准备


    第一阶段是准备，它从您的系统环境和偏好中收集信息。默认语言和键盘设置为英语（美国）。选择语言和键盘设置将自动为您切换到预设设置。安装程序通过执行系统探测对您的系统进行系统分析，搜索各种存储设备（例如
    USB、Firewire、软盘、硬盘驱动器）、现有 Linux 分区和系统文件，确定系统是否可以更新，并启动包管理器。


    # 第 1 章 安装 Linux


    时钟和时区设置允许您设置区域、时区以及系统日期和时间信息。此外，您可以决定是否要使用本地时间或 UTC（协调世界时）。在安装过程完成后，可以配置系统使用网络时间协议（NTP）。某些发行版允许您选择想要安装的桌面环境（如果有），其中
    GNOME 和 KDE 是最流行的。


    # 分区


    分区是根据您的磁盘布局选择并实施分区和文件系统的过程。系统通常会提供基于默认分区的选项或基于逻辑卷管理（LVM）的选项供选择。此外，用户可以选择编辑现有分区或创建新分区。创建新分区或编辑现有分区的决定取决于系统是否将与另一个操作系统（例如
    Microsoft Windows）共存，或者是否包含多个磁盘驱动器，或者您是否想调整文件系统分区（例如，新建文件系统 (NTFS)）。


    ![](img/53450e0f522134e838a034ce98470308_6_0.png)


    正确对硬盘进行分区以安装并支持 Linux 是关重要的。推荐的分区方案代表了最常用的方法，通常包含两个分区和一个扩展分区。


    两个主分区支持根分区（root）和交换分区（swap）。扩展分区支持家分区（home）。硬盘最多可以有四个主分区。


    # 用户设置


    可以与本地或网络认证一起创建用户帐户。您可能可以为系统管理员“root”分配相同的密码。您可以选择是否自动登录，但出于安全考虑，建议不要使用此功能。系统可以配置为在安装过程完成后使用
    NTP。用户可能需要输入用户名和密码。


    ![](img/53450e0f522134e838a034ce98470308_6_1.png)


    用户信息将包括：


    - 用户全名：用户的姓和名。

    - 用户名：登录系统的用户名。

    - 密码：区分大小写。


    # 安装设置


    在安装期间，将根据您的选择安装 Linux。openSUSE 等某些 Linux 发行版将根据您之前选择的选项进行配置。


    安装阶段的最后一步是配置阶段，这将从网络源进行安装，并为系统的初始启动做好准备。


    # 跨网络安装


    由于带宽限制，网络安装比从本地介质安装要慢。


    > 知识点

    > 对于网络安装，您需要记住：

    - 可用的网络协议有超文本传输协议 (HTTP)、文件传输协议 (FTP)、网络文件系统 (NFS) 以及服务器块协议 (SMB)。

    - 安装可以从网络启动的 CD 或 DVD 进行。

    - 需要服务器的 IP 地址或名称以进行 HTTP、NFS 或 FTP 安装。

    - 可以匿名 FTP 服务器。


    网络安装源的类型取决于网络带宽。对于 Linux+ 认证考试，我们将重点关注 HTTP、FTP 协议。


    | 网络安装类型 | 域名/IP 地址 | 发行版源/文件夹 | 用户名 | 密码 |

    | :--- | :--- | :--- | :--- | :--- |

    | HTTP | 需要 | 需要 | N/A | N/A |

    | FTP | 需要 | 需要 | 需要（匿名登录为空） | 需要 |

    | NFS | 需要 | 需要 | N/A | N/A |


    表 1.1 总结了网络安装的类型以及您需要提供的参数值。


    在选择了所需的网络安装方法后，安装程序将按照“从本地介质安装”部分所述的方式工作。


    ![](img/53450e0f522134e838a034ce98470308_8_0.png)


    网络安装涉及制作一个小小的 Linux 启动盘并下载大部分代码，这比从本地介质安装要慢得多。尽管您可以同时在多个系统上安装 Linux，但请确保有足够的带宽。


    # 布局文件系统


    布局文件系统有两种选项：基于分区的（默认）或基于 LVM 的。


    ![](img/53450e0f522134e838a034ce98470308_8_1.png)


    在决定如何布局系统之前，您需要考虑以下因素：


    - 物理硬盘受到磁盘制造商的限制（例如，磁盘几何结构）以及系统制造商的限制（例如，BIOS）。

    - 主分区（每个磁盘最多四个）将硬盘驱动器划分为物理组。

    - 扩展分区可以细分为逻辑分区（组）。


    '
