  - '[PAGE 123]


    # Application Services


    # SQUID CONFIGURATION FILES


    The configuration file is /etc/squid/squid.conf, and the software is installed
    in /usr/local/squid. Squid can be configured to listen on any port, which is often
    useful if you are trying to hide some servers from general browsing. The default
    port for squid is 3128, although a lot of people change this to port 80. To allow
    squid to listen on ports 3128, 80, and 8080, change the squid.conf:


    ```

    http_port 3128 80 8080

    ```


    Access control lists (ACLs) can be used to restrict the networks that are allowed
    to connect to the server and with which protocol. The squid proxy can filter individual
    sites so that users cannot access them.


    EXAM WARNING

    Squid can be used as a proxy server and as a caching server. When it is a caching
    server, it displays data to the client that it has already in cache, for example,
    a Web page. When it is used as a proxy server, it acts as a go-between for requests
    from a client to the target server. The target server will, therefore, not be
    able to communicate directly with the client.


    # APPLICATION SERVICES


    The following section will explain the common application services of printing
    and e-mail.


    # Printing


    The print server that is common within Linux is CUPS, and it is accessed via a
    Web browser using port 631, http://localhost:631, substituting the localhost part
    with a machine name or IP address if you are accessing a remote CUPS instance.
    Some pages require the root username and password.


    # NETWORK PRINTERS


    Network printers require the IP address or can be found using Simple Network Management
    Protocol (SNMP) built into CUPS. There are three network protocols supported by
    CUPS:


    +   - AppSocket Protocol, usually associated with HP JetDirect

    - Internet Printing Protocol (IPP), normally port 631

    - Line Printer Daemon (LPD) Protocol, port 515


    # Managing Operation Policies


    There rules built into CUPS to allow the administrator to define a number of policies,
    such as the user must supply a password, stored in cupsd.conf and are changed
    by the CUPS interface using the Edit Configuration File on the Administration
    tab.'
  - '[PAGE 124]


    # CHAPTER 8 Installing, Configuring as a Server


    # Printer Classes


    Administrators can group printers together to form a class, allowing users to
    send a document to this group, CUPS will decide the best printer to use.


    # Mail


    An e-mail server can have a number of different clients seamlessly connecting
    to it. The mail server for a domain needs DNS configured to ensure that there
    is valid MX record.


    The main transport mechanism between e-mail servers is the Simple Mail Transfer
    Protocol (SMTP), which operates on port 25. Mail is transferred from one e-mail
    server to another using a mail transfer agent (MTA), such as sendmail, or Post
    Office Protocol (POP) and Internet Message Access Protocol (IMAP) are used by
    e-mail clients to retrieve e-mail from server.


    # HOW MAIL WORKS


    Users will have usernames for a domain such as username@your_domain, and mail
    will be sent to the mail server in that domain specified by the DNS MX record.
    When users send e-mail destined for a local user, the mail server will simply
    put the e-mail in the appropriate user''s mailbox. If it is for someone outside
    the domain, the mail server will look up the MX record of the target domain and
    then try to send or relay the mail to server.


    # Sendmail


    The following sections will outline how to set up a sendmail server.


    # STARTING AND STOPPING SENDMAIL


    Sendmail is usually started upon boot, when it reads the configuration file. Changes
    to the configuration file require it to be restarted.


    ```

    service sendmail start

    service sendmail stop

    ervice sendmail restart

    ```


    # SENDMAIL CONFIGURATION


    The main configuration file is sendmail.cf, normally located in /etc/mail/sendmail.cf
    or /etc/sendmail.cf. A common method of producing the sendmail cf file is through
    the use of m4 macro processor, which works on the configuration parameters in
    the file /etc/mail/sendmail.mc.


    # MAIL RELAYING


    Mail relaying needs to be set up that your server is not used by spammers. You
    want to relay (or deliver) all mail that originates from your domain to the target
    domain. If your domain is mycorp.com, then you will need to add this into the
    /etc/mail/relay-domains file. As it it is relatively easy to spoof the'
  - '[PAGE 125]


    # Application Services


    from address, /etc/mail/access can be used, which is more specific on who can
    use the relay server. This file can be used to configure a number of actions as
    relay, reject, and discard. The file is a simple two column list, which needs
    to be converted into a sendmail compatible file.


    # POSTFIX


    An alternative to sendmail is postfix, which was designed to be simpler than sendmail.
    Although there are several hundred configuration parameters that are controlled
    by the configuration file /etc/postfix/main.cf., the variables are defined and
    used in a similar way to shell variables.


    ```

    parameter = value

    new_parameter = $parameter

    ```


    The domain that is used in outbound mail is the myorigin parameter, which defaults
    to the local machine. The server can accept mail for a number of domains, and
    these will be specified in the mydestination parameter. As sendmail, you must
    ensure you only relay mail from hosts or network you know and trust. This is undertaken
    by mynetworks parameter.


    The postfix daemon reports all errors to the syslog daemon, which itself sorts
    out events by class and severity. The logging classes, levels, and logfile names
    must be entered into /etc/syslog.conf to ensure these are logged correctly.


    ![](img/53450e0f522134e838a034ce98470308_125_0.png)


    You need to have a number of valid e-mail addresses "aliased" to another account.


    +   - Aliases work for both sendmail and postfix.

    - The aliases file is normally /etc/aliases or /etc/mail/aliases

    - Aliases are often configured to root.

    - The aliases file needs converting to a format that can be parsed by the mail
    server, using newaliases.

    - Aliases can be used to set up simple mailing lists.


    # MySQL


    MySQL is a relational database management system (RDBMS) and will store data in
    tables, which can be linked together to enable manipulation of the data much easier.


    # MySQL CONFIGURATION


    The main configuration file is /etc/my.cnf, and databases are located in a subdirectory
    of /var/lib/mysql. The MySQL data directory needs to be'
  - '[PAGE 126]


    # Table 8.5 mysql Command-Line Options


    | -u username | Connects a username to the database |

    | -p | Prompts for password |

    | -h hostname | Connects to the MySQL server on the remote hostname |


    owned by the user who runs MySQL, and this directory should be set to 700 using
    chown.


    # STARTING AND STOPPING MySQL


    The MySQL service can be started and stopped using the commands listed below:


    ```

    service mysqld start

    service mysqld stop

    service mysqld restart

    ```


    # TESTING THE CONNECTION


    The MySQL server can be tested very easily using the built-in command-interpreter.
    The basic command is mysql, and the options are shown in Table 8.5.

    mysql will attempt to connect to a remote database server using port 3306.


    # SUMMARY OF EXAM OBJECTIVES


    In this chapter, you learned about how to configure a Linux system when used as
    a server. The DHCP service provides the client with an IP address and other data,
    such as the local nameserver. The basics of DNS configuration were discussed,
    and how to set up the different files for forward and reverse name resolution
    was outlined. The interoperability with Microsoft Windows using a Samba server
    and how to modify the various configuration files to undertake this task were
    defined.


    The section on Web services was centered around the Apache Web server, showing
    how the server is configured. The location of the main configuration files, the
    definitions of modules and containers pertain incorporated into the Apache configuration,
    and how PHP and CGI scripts are explained. The Squid proxy server configuration
    was shown, and how it is used in a network was described. The configuration of
    an FTP server and how this could be configured for different file transfers, such
    as straight ASCII text or programs in a binary form, were described.


    Finally, mail servers and how to configure the two most popular mail servers,
    sendmail and postfix, were discussed.'
- md: "\n## TOP FIVE TOUGHEST QUESTIONS\n\n1. You have been told that your mail MTA\
    \ is being used as a relay by spammers. You want to stop this happening. What\
    \ is the best course of action?\n   A. Relocate the mailserver behind your corporate\
    \ firewall and only allow TCP port 25 to and from this server.\n   B. Ensure that\
    \ the hosts you allow to relay are on your local network by configuring the /etc/mail/access\
    \ file.\n   C. Ensure that your domain can be relayed by configuring the relay-domains\
    \ file.\n   D. Configure the mailserver to stop all relaying of mail and make\
    \ sure all the users connect to it via an approved client.\n\n2. Your new Apache\
    \ Web server has been set up and one of the developers want to know which directory\
    \ to load the Web pages. What directive will need to be accessed in the httpd.conf?\n\
    \   A. WebRoot directive\n   B. DocumentRoot directive\n   C. ServerName directive\n\
    \   D. WebBase directive\n\n3. You want to set up your Apache server to capture\
    \ logs as you are having problem with the application. What log level would you\
    \ set to give you the most verbose logs?\n   A. emerg\n   B. error\n   C. info\n\
    \   D. alert\n\n4. The Samba server in your office has been set up with the name\
    \ samserv. You want to connect to the directory that has set up and shared it.\
    \ What will be the correct command from a terminal shell if you want to connect\
    \ as a user called juliet?\n   A. smbclient //samserv/sammy juliet\n   B. smbclient\
    \ //samserv/sammy -u juliet\n   C. smbclient //samserv/sammy -U juliet\n   D.\
    \ smbclient //samserv/sammy -U juliet\n\n5. You want to administer your DNS using\
    \ the command, but you cannot connect to the server. You have pinged the server\
    \ and it responds. You have just installed the config. What is the likely error?\n\
    \   A. You have not put your IP address into named.conf file for the target.\n\
    \   B. You have not inserted the correct keys into named.conf file.\n   C. You\
    \ have run dnssec-keygen immediately before issuing the command.\n   D. You must\
    \ run dnssecign on the new host and the target to ensure they can communicate\
    \ with each.\n\n## ANSWERS\n\n1. Correct answer and explanation: B. Answer B is\
    \ correct, as this will specify which of your networks can connect to this mailserver\
    \ and have mail relayed. If you configure the networks correctly, mail will not\
    \ be relayed. Incorrect answers and explanations: A, C, and D. Answer A is incorrect,\
    \ as relocating the mailserver behind a firewall will not help. The server will\
    \ have to have port 25 open on it, and this is used by spammers to force the mailserver\
    \ to relay. This option would be useful if the correct configuration files specified\
    \ in B were done. Answer C is incorrect, as this will allow domain to send e-mail.\
    \ Answer D is incorrect, because if you stop the mailserver from relaying users\
    \ will not be able to send any mail.\n\n2. Correct answer and explanation: B.\
    \ Answer B is correct, as the DocumentRoot parameter correctly defines the directory\
    \ where the Web pages are stored. Incorrect answers and explanations: A, C, and\
    \ D. Answer A is incorrect, as there is no WebRoot parameter. Answer C is correct,\
    \ as ServerName parameter defines the name of the Web site. Answer D is incorrect,\
    \ because there is no WebBase parameter.\n\n3. Correct answer and explanation:\
    \ C. Answer C is correct, as info is the lowest log level and will give the most\
    \ verbose output. Debug can also be used, which will give more output than info.\
    \ Incorrect answers and explanations: A, B, and D. Answer A is incorrect, as this\
    \ will only give emergency message as a lock file. Answer B is incorrect, as this\
    \ may be useful for debugging but does not give you lots of errors. Answer D is\
    \ incorrect, as this will just give log messages for actions that must be taken.\n\
    \n4. Correct answer and explanation: C. Answer C is correct, as this will invoke\
    \ smclient and connect to share on target server (sammy). Incorrect answers and\
    \ explanations: A, B, and D. Answer A is incorrect, as the option to specify the\
    \ username (-U) is missing. Answer B is incorrect, as -u is not used. Answer D\
    \ is incorrect, as this does not specify the user correctly.\n\n5. Correct answer\
    \ and explanation: B. Answer B is correct, because the rndsec command needs to\
    \ have authentication keys that match those of the target server. Incorrect answers\
    \ and explanations: A, C, and D. Answer A is incorrect, as you do not need to\
    \ insert IP address of target in that file. Answer C is incorrect, because although\
    \ you need to use dnssecign to get the correct key, the value must be put into\
    \ rndc.conf.\n\n## CHAPTER 9 Securing Linux\n\n### Exam objectives in this chapter\n\
    - Managing and Monitoring User Accounts\n- File Permissions and Ownership\n- SELinux\
    \ Basics\n- Implementing Privilege Escalation\n- Security Applications and Utilities\n\
    - Implementing Remote Access\n- Authentication Methods\n\n## INTRODUCTION\nLinux\
    \ is regarded as a secure operating system; however, even secure systems can have\
    \ flaws. In this chapter, we'll look at the tasks necessary to make sure Linux\
    \ systems live up to their reputation.\n\n## MANAGING AND MONITORING USER AND\
    \ GROUP ACCOUNTS\nIt is critical to control who gets access to what to maintain\
    \ security. Limiting user accounts protects information and also protects the\
    \ system itself from both malice and simple errors.\n\n### Tools\nThe following\
    \ tools are used to create and manage user accounts:\n\n#### USERADD\nThere are\
    \ a number of steps involved in adding users, and these may include the following:\n\
    1. Define the new user in /etc/passwd, and create a User Identification (UID).\
    \ The system uses UIDs to refer to the user internally.\n2. Create a password\
    \ for the user in /etc/shadow file.\n3. Define a new group in /etc/group and create\
    \ a Group Identification number (GID).\n4. Create a new home directory for the\
    \ user, set the file permissions on it, and copy the default startup files to\
    \ it.\n5. Set up the users account.\n\nAlthough it is entirely possible to do\
    \ each of these steps by hand, the useradd tool automates them. The syntax is\
    \ useradd [options] username. Good options to know are:\n- -b or --base-dir: location\
    \ of the home directory.\n- -m or --create-home: create a home directory for the\
    \ user and copy basic user settings from /etc/skel.\n\nA number of other parameters\
    \ can be set in the /etc/login.defs and /etc/default/useradd files, including:\n\
    - Range of UID and GID numbers\n- Location of the users\n- Account and password\
    \ time limits\n\n#### USERDEL\nuserdel deletes a user, and the syntax is userdel\
    \ [options] username. The options are:\n- -r or --remove deletes the user's home\
    \ directory and mail spool.\n- --f or --force deletes the user account even if\
    \ they are currently logged in, deletes the home directory even if other users\
    \ may be sharing it, and deletes a group that matches the user even if it is used\
    \ by others on the system.\n\nNote that neither of these will remove files outside\
    \ of a user's home directory.\n\n#### USERMOD\nusermod changes (modifies) a user\
    \ account, and syntax is usermod [options] username. Options include:\n- -l or\
    \ --login changes a username.\n- -d or --home changes the users home directory;\
    \ use -m to move their files to the new location.\n- -u or --uid and -g or --gid\
    \ changes the UID and default group number but doesn't actually change the ownership\
    \ information of any existing files they may have.\n- -G or --group[1,group2,...]\
    \ changes the groups that the user is a member of. The user is removed from any\
    \ groups unless listed -a or --append is also used.\n- -L or --lock and -U or\
    \ --unlock options lock and unlock the account.\n\n#### Crunch Time\nAs well as\
    \ the above commands, there are some that work on groups only:\n- groupadd creates\
    \ groups, using the unused GID number; -g or --gid lets you pick a specific number.\n\
    - groupdel deletes groups, removing them from /etc/group and (if used) /etc/gshadow\
    \ but won't let you remove a user's primary group, groupdel won't change the actual\
    \ GID information on existing files, and if the GID gets reused, you may get unexpected\
    \ access or other security issues.\ngroup changes a group's GID or groupname,\
    \ with -g or --gid changing the GID and -n or --newname group to change the name.\n\
    \n#### PASSWD\nUsers can use passwd to change their own password, or system administrators\
    \ can change passwords on their behalf or reset a forgotten password by providing\
    \ the username. passwd can also be used to lock and unlock accounts with -l and\
    \ -u.\n\n> EXAM WARNINGpasswd isn't actually listed on the CompTIA list of exam\
    \ topics, but they refer to \"lock,\" so it is advisable to be familiar with both\
    \ usermod -l and passwd -l.\n\n#### WHO AND WHOAMI\nwho lists the usernames of\
    \ people logged into your system and can show where remote users are logged in\
    \ and the number of users. who works looking in the /var/run/utmp file, which\
    \ keeps track of who is logged into the system.\nThe whoami command simply prints\
    \ your username.\n"
  mdcn: "\n\n## 五大难题题\n\n1. 你被告知你的邮件 MTA（邮件传输代理）正被垃圾邮件发送者用作中继。你想停止这种情况的发生。最佳行动方案是什么？\n\
    \   A. 将邮件服务器移动到公司防火墙之后，并仅允许该服务器进出 TCP 端口 25 的流量。\n   B. 通过配置 `/etc/mail/access`\
    \ 文件，确保你允许中继的主机位于本地网络上。\n   C. 通过配置 `relay-domains` 文件，确保你的域名可以被中继。\n   D. 配置邮件服务器停止所有邮件中继，并确保所有用户通过批准的客户端连接到它。\n\
    \n2. 你的新 Apache Web 服务器已经设置完毕，其中一个开发人员想要从哪个目录加载 Web 。需要在 `httpd.conf` 中访问哪个指令？\n\
    \   A. WebRoot 指令\n   B. DocumentRoot 指令\n   C. ServerName 指令\n   D. WebBase 指令\n\
    \n3. 你想设置 Apache 服务器来捕获日志，因为你在应用程序上遇到了问题。你会设置什么种日志级别以获得最详细的日志？\n   A. emerg\n\
    \   B. error\n   C. info\n   D. alert\n\n4. 你办公室的 Samba 服务器已命名为 `samserv`。你想连接到已设置并共享的目录。如果你想以名为\
    \ `juliet` 的用户身份连接，终端 shell 中的正确命令是什么？\n   A. smbclient //samserv/sammy juliet\n\
    \   B. smbclient //samserv/sammy -u juliet\n   C. smbclient //samserv/sammy -U\
    \ juliet\n   D. smbclient //samserv/sammy -U juliet\n\n5. 你想使用命令管理你的 DNS，但无法连接到服务器。你\
    \ ping 了服务器，它有响应。你刚刚安装了配置。最可能的错误是什么？\n   A. 你没有在 `named.conf` 文件中为目标输入你的 IP 地址。\n\
    \   B. 你没有在 `named.conf` 文件中插入正确的密钥。\n   C. 你在发布命令之前立即运行了 `dnssec-keygen`。\n \
    \  D. 你必须在新主机和目标主机上运行 `dnssecign` 以确保它们之间可以通信。\n\n## 答案\n\n1. 正确答案和解释：B。答案 B 是正确的，因为这将指定你的哪些网络可以连接到此邮件服务器并进行邮件中继。如果你正确配置了网络，邮件将不会被中继。错误答案和解释：A、C\
    \ 和 D。答案 A 是错误的，因为将邮件服务器移动到防火墙后没有帮助。服务器必须开放 25 端口，垃圾邮件发送者会利用此强制邮件服务器进行中继。如果完成了\
    \ B 中指定的正确配置，此选项将非常有用。答案 C 是错误的，因为这会允许域名发送电子邮件。答案 D 是错误的，因为如果停止邮件服务器的中继，用户将无法发送任何邮件。\n\
    \n2. 正确答案和解释：B。答案 B 是正确的，因为 `DocumentRoot` 参数正确定义了存储 Web 页面的目录。错误答案和解释：A、C 和 D。答案\
    \ A 是错误的，因为没有 `WebRoot` 参数。答案 C 是正确的（注：此处原文可能有误，通常 ServerName 仅用于定义站点名称）。答案 D\
    \ 是错误的，因为没有 `WebBase` 参数。\n\n3. 正确答案和解释：C。答案 C 是正确的，因为 `info` 是最低日志级别，将提供最详细的输出。也可以使用\
    \ `debug`，它提供的输出比 `info` 更多。错误答案和解释：A、B 和 D。答案 A 是错误的，因为这只会作为锁文件提供紧急消息。答案 B 是错误的，虽然这可能用于调试，但不会提供大量的错误。答案\
    \ D 是错误的，因为这只会提供必须采取行动的日志消息。\n\n4. 正确答案和解释：C。答案 C 是正确的，因为这将调用 `smbclient` 并连接到目标服务器上的共享\
    \ (`sammy`)。错误答案和解释：A、B 和 D。答案 A 是错误的，因为缺少了指定用户名的选项 (`-U`)。答案 B 是错误的，因为没有使用 `-u`。答案\
    \ D 是错误的，因为这没有正确指定用户。\n\n5. 正确答案和解释：B。答案 B 是正确的，因为 `rndsec` 命令需要与目标服务器匹配的身份验证密钥。错误答案和解释：A、C\
    \ 和 D。答案 A 是错误的，因为你不需要在该文件中插入目标的 IP 地址。答案 C 是错误的，虽然你需要使用 `dnssecign` 获取正确的密钥，但该值必须放入\
    \ `rndc.conf` 中。\n\n## 第 9 章 安全 Linux 安全\n\n### 本章考试目标\n- 管理和监控用户账户\n- 文件权限和所有权\n\
    - SELinux 基础\n- 实现特权提升\n- 安全应用和工具\n- 实现远程访问\n- 身份验证方法\n\n## 引言\nLinux 被认为是一个安全的操作系统；然而，即使是安全的系统也存在缺陷。在本章中，我们将查看确保\
    \ Linux 系统名副其实的必要任务。\n\n## 管理和监控用户和组账户\n控制谁可以访问什么对于维护安全性至关重要。限制用户账户可以保护信息，并保护系统本身免受恶意和简单错误的影响。\n\
    \n### 工具\n使用以下工具创建和管理用户账户：\n\n#### USERADD\n添加用户涉及许多步骤，这些可能包括以下内容：\n1. 定义新用户，这些可能包括在\
    \ `/etc/passwd` 中定义新用户 (UID)。\n2. 在 `/etc/shadow` 中创建密码。\n3. 在 `/etc/group` 中定义新组\
    \ (GID)。\n4. 创建用户的主目录并设置其权限。\n5. 设置用户账户。\n虽然可以手动执行这些步骤，但 `useradd` 工具实现了这些操作。语法为\
    \ `useradd [options] username`。常用的选项包括：\n- `-b` 或 `--base-dir`：主目录位置。\n- `-m`\
    \ 或 `--create-home`：创建主目录并从 `/etc/skel` 拷贝设置。\n\n在 `/etc/login.defs` 中可以设置许多其他参数，`useradd`：\n\
    - UID 范围\n- 用户位置\n\n#### USERDEL\n`userdel` 删除用户，语法为 `userdel [options] username`。选项包括：\n\
