    # Leveraging I/O Redirection


    There are a number of small useful tools that are meant to work together and I/O
    redirection is the glue that sticks these handy programs together. Console programs
    make use of three streams for communicating, as shown in Table 5.5.


    You can use file redirection that allows you to use the output from one program
    as the input for another, or send it to a file. You can use the contents of a
    file as the input for a program, or use a succession of programs to create and
    manipulate information. Common uses of redirection are shown in Table 5.6.


    > EXAM WARNING

    Be careful when using >, if you redirect your output stream to an existing file
    it will be overwritten. >> to append to the end of an existing file.


    | Table 5.5 | The Three Communications Streams |

    | Name | Number | Symbol | Normal Connection |

    |---|---|---|--|

    | STDIN | 0 | < | Keyboard |

    | STDOUT | 1 | > | Console |

    | STDERR | 2 | > | Console |


    | Table 5.6 | Common Uses of Redirection |

    | Command | Result |

    |---|--|

    | some_program > not_the_console | Output is directed to not_the_console, which
    can be a file or device |

    | some_program < something_to_send_to_a_program | Input for some_program or file
    or device |

    | some_program > data_output.txt 2> error_output.txt | Output sent to data_output.txt
    and errors sent to error_output.txt |

    | some_program 2> error_output.txt | Errors sent to error_output.txt |

    | some_program > data_and_errors.txt 2>&1 or some_program &>data_and_errors.txt
    | Data and error streams are combined |

    | some_program | another_command | Sends output from one program into the input
    of another |

    | ls -al | tee directory.txt | tee duplicates a stream and sends one copy to the
    display and another to a file |'
