    ### 引言

    任何系统的用户都将执行许多基本任务：与显示器上的应用程序交互（例如，文字处理、任务调度）以及打印。用户界面和打印机的标准设置将使用户体验更加丰富，同时减少支持工作。关于打印机的章节将描述如何配置和使用通用
    UNIX 打印系统 (CUPS)。


    大多数最新的 Linux 发行版都提供一个或多个图形用户界面 (GUI) 来与用户进行交互。这些界面通常运行在 X Windows 系统之上，最常用的窗口管理器由
    KDE 和 GNOME 提供。X11 是 Windows 的最新形式，是一个真正的客户端/服务器应用程序，本文将描述其实现方式，以及所需主要配置文件的说明。


    ### 打印

    设备管理和设置可能会令人困惑，因为厂商对 Linux 打印驱动的支持各异，并不是所有厂商都有兼容的 Linux 驱动。CUPS 是一种通常部署在现代 Linux
    发行版中的打印服务程序。


    CUPS 概述

    CUPS 应用将应用程序的页面描述转换为打印机可以理解的格式，然后管理发送到实际打印机的过程。打印机制造商会开发不同的打印方法，即使在其产品线内部。CUPS
    应用将执行这种转换，并对终端用户隐藏。


    CUPS 应用可以总结为执行以下操作：


    - 为每个打印机创建并管理队列。

    - 用户向 CUPS 发送打印请求，CUPS 将作业放入相应的队列。

    - 每个作业都关联有一个作业请求。

    - 用户可以取消或暂停他们的作业。

    - CUPS 为每个作业分配一个程序将其转换为可打印格式。

    - 作业按照先入先出的原则激活。

    - 完成的任务由 CUPS 从队列中移除。


    ### 启用和禁用队列

    每个打印机都有自己的队列，并将其进行管理以确保作业按顺序打印。这些队列可以被启用或禁用，即使队列中有项目。当打印机出现需要修复的问题且系统管理员希望在问题修复之前禁用队列时，这通常是必要的。系统管理员还可以发布注释告诉用户打印机被禁用的原因。


    ```

    # cupsdisable -r "Printer maintenance is being performed" CANONMX

    ```


    可以使用以下命令启用打印机：


    ```

    # cupsenable CANONMX

    ```


    ### Web 管理端口 (端口 631)

    CUPS 的接口是通过 Web 界面实现的，允许您查看打印作业和安装了哪些打印机，并对它们进行管理。可以通过本地或远程通过端口 631  Web 界面访问
    CUPS。在本地机器上，可以使用 URL http://localhost:631 访问界面。界面如图 7.1 所示。此外，还有一个 CUPS 程序，它不使用浏览器，但外观和感受是完全相同的。


    GUI 上的某些页面需要用户名和密码才能执行操作，例如添加打印机。在大多数 Linux 发行版中，只有 root 用户可以添加、修改或删除打印机或打印机类。


    ### 通用 UNIX 打印系统 1.3.9

    欢迎！

    这些页面允许您监控打印机和作业以及执行系统管理任务。点击上方或下方的任何标签页来执行任务。


    如果要求输入用户名和密码，请输入您的用户名和密码或 "root" 用户名和密码。


    ### 关于 CUPS

    CUPS 为基于 UNIX 的操作系统提供了一个可移动打印层。它由 Apple 公司开发和维护，旨在推广标准的打印解决方案。CUPS 是以互联网打印协议 ("IPP")
    为基础的打印系统接口。


    ### 打印机驱动与辅助

    图 7.1

    浏览器中的 CUPS 界面


    ### 关键时刻

    打印机管理部分非常强大，允许用户：

    - 打印测试页

    - 停止/启动打印机

    - 启用和禁用队列


    ### 管理打印机、作业和队列

    CUPS 界面易于理解，对于大多数用户来说，命令行更容易。由于系统管理员可以防止未经授权的用户更改功能，它提供了一个简单安全的 GUI 给用户使用。


    ### 快速事实

    - 将作业从一个队列移动到另一个队列

    - 取消所有作业

    - 设置打印机选项

    - 允许指定用户

    - 设置为默认


    ### CUPS 打印类

    CUPS 允许用户将打印机分组，这种打印机集合被称为*类* (class)。这对于拥有多个打印机的公司特别有用，可以按区域分组，例如财务、行政等。这允许打印机离线维护，用户不会遇到任何中断，也不需要记住区域内不同打印机的名称。打印类的添加和管理在
    CUPS GUI 的管理标签页中进行。


