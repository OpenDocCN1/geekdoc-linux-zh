    ```

    apt-get remove package_name(s)

    ```


    The package will be removed, along with all the packages that depend on it.

    The configuration files will not be removed, but adding the option -purge will

    remove all files associated with the package. Using this option is worthwhile
    for

    you know you will not be using this package in the future, as it clean up the

    disk and not leave a trace of unwanted files in the filesystem.


    # UPGRADING PACKAGES


    The upgrading of packages can be accomplished very easily within the APT

    system. All the packages within the current distribution can be upgraded with
    a

    single command:


    ```

    apt-get upgrade

    ```'
