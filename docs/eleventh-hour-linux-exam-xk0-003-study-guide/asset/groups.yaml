    # CHAPTER 9 Securing Linux


    ## Fast Facts


    w (syntax: w [options] user) provides the information who is in, plus:


    - What device they logged into?

    - Where they logged in from (console or Internet Protocol (IP) address or remote)?

    - When they logged in?

    - How long their session has been idle?

    - How much processor time they''ve used?

    - What program they are running?


    last reviews the /var/log/wtmp file to show information about who has logged in
    (and out) since the file was created. The syntax is last [options] [name] [tty].


    Options include

    - -t YYYYMMDDHMMSS to show who was logged in at a specific time.

    - name [pseudo user] account reboot each time it gets rebooted, so last reboot
    shows a list of the times system has been rebooted since the creation of the /var/log/wtmp
    file.


    ## Files


    We''ve touched on a number of files used to maintain user information; now, we''ll
    take a closer look at a couple of them.


    ### /etc/skel


    Each user account has a home directory where his or her account settings and preferences
    are held. A set of template files, in the /etc/skel (short for "skeleton") directory,
    are copied to a new user''s home directory by useradd. The template files can
    be used to give users helpful defaults for their BASH shell, standardized options
    for a company preferred text editor, or other standardized settings. It can even
    be used to give company standard browser favorites or a company directory.


    ### /etc/passwd


    The /etc/passwd file is a text file that can only be edited by a user with elevated
    privileges. Each user has its own line, with fields by colons. The fields, in
    order, are


    - username

    - password

    - UID

    - GID

    - comment(s)

    - user’s home directory

    - user’s default shell: “/bin/false” means that user doesn’t get shell access


    ### /etc/shadow


    /etc/passwd was used by many common utilities to cross-reference username and
    UID/GID information. Having easy access to every user’s password, even if encrypted,
    is a bad thing. To solve that problem, there is a mechanism called a shadow password
    file; /etc/shadow can only be read by system administrators and contains the actual
    passwords. It can also be read by processes and utilities that are setuid 0.


    > EXAM WARNING

    If you hand-edit the /etc/passwd file, be careful not to leave the password field
    blank. This clears the password, so anyone can connect as that username without
    a password. This is considered a poor security practice, even if other steps have
    been taken to that account.


    ### /etc/group


    /etc/group contains a list of groups and related information, one group per line,
    with fields separated by colons:


    - groupname

    - password

    - GID

    - members: separated by commas


    Groups use a similar mechanism as users to set a password, which can be used to
    delegate group management to member users. passwd manages the passwords, which
    can be securely stored in the /etc/gshadow file.


    ## FILE PERMISSIONS AND OWNERSHIP


    The basic tools to manipulate permissions and ownership are described below.


    ## Tools


    There are a number of commands used to manage permission bits and other file attributes.


    ### CHMOD


    chmod is used to change the permission bits with syntax: chmod [options] MODE
    FILE.


    Two useful options:


    - -R or --recursive makes changes in the entire subdirectory tree.

    - --reference=file1 sets the permission bits on file2 to match file1.


    There are also two very different ways to represent the mode: using numbers and
    letters.


    Numbers use a three digit base-8 (octal) number, with the first digit for the
    owner, second for the group, and third for everyone else (other), as shown in
    Table 9.1. To set a file to only owner and group can read and write to it, you
    would enter chmod 660 file3.


    When using the numbers, all bits get set at once, with letters you can adjust
    individual parameters one at a time. The specific format has a lot of combinations
    but options is basically:


    ```

    chmod who what_changes filename

    ```


    The what_changes option comprises two parts: the action you want to perform (add,
    delete, and so on) along with one or more permissions, as shown in Table 9.2.


    To allow the user and group to be able to execute a file, you would use: chmod
    ug+x file3.


    ### CHOWN


    chown is used to change a file''s owner and group with syntax: chown [OPTION]
    [username[:groupname]] filename.


    | Table 9.1 File Permission Value and Text |

    | Octal | Permissions |

    |---|---|

    | 0 | --- |

    | 1 | --x |

    | 2 | -w- |

    | 3 | -wx |

    | 4 | r-- |

    | 5 | r-X |

    | 6 | rw- |

    | 7 | rwx |


    | Table 9.2 Description of Options for chmod |

    | Who | Action | Permissions |

    | --- | --- | --- |

    | u for user | + add a permission | r for read |

    | g group | - to remove a permission | w for write |

    | o for everyone | = set all the permission bits as shown | x for execute |

    | a for all the above | | |


    > EXAM WARNING

    The execute bit has to be set before a binary executable file can be run, but
    because a script has to be opened for the interpreter to see the commands inside,
    it needs both the read and execute bits.


    The most useful options are the same as for chmod:


    - -R or --recursive makes changes in the subdirectory tree.

    - username:groupname filename changes the file''s owner to username and the group
    to groupname.

    - username:filename changes the file''s owner to username and change the group
    to the users primary group (note the colon after the username).

    - groupname:filename changes the group to groupname.


    You can use the numeric UID or GID in place of a username or groupname.


    ### CHGRP


    chgrp works as the chown :group and includes the same useful options of -R and
    --reference. Syntax is chgrp [OPTION] groupname filename.


    ### CHROOT


    chroot is a bit different than the preceding commands, as it doesn''t change any
    of a file''s attributes; instead, it changes how much of the file structure program
    is allowed to see. This does by redefining the top of the directory tree to you
    specify. The syntax is chroot newroot[command]. This is normally used as a function
    within a script, but if the command is left off, chroot will give you a BASH shell
    with the root you specified.


    ### LSATTR


    isattr displays a of attributes that may be set on files and directories. These
    attributes define a number of advanced options and features that the computer
    uses when accessing information.


    ## DID YOU KNOW?

    The attributes include for a file are varied, described:


    - i means a file *immutable*: only the root user or privileged kernel processes
    can make changes to it. This essentially locks a file that you don''t change.

    - a makes a file append-only, so it can only be added to; handy, for log files.

    - d marks a file to be skipped.

    - c marks a file for compression at the kernel level.

    - s marks a file so that it gets overwritten with zeros when deleted, to enhance
    security.

    - A tells the system not to use atime to update the access time on a file, instead
    of caching them.

    - D does the same as S for directories.

    - u marks the file to allow it to be undeleted.

    - R indicates that a file uses special block sizing to allow it to be larger than
    2 TB.


    The syntax for *lsattr* is `lsattr [OPTIONS] [filename]`.

    Options include


    - d lists directories but not their contents.

    - R recursively lists subdirectories.


    ### CHATT


    *chattr* is used to change the attribute bits that were covered in the *lsattr*
    section, with a syntax of `chattr [OPTIONS] [mode] filename`.

    mode is +, -, = to add, remove, or set exactly a list that consists of valid option
    letters described in the *lsattr* section, above.


    > EXAM WARNING

    Not all the available options may be incorporated into a particular Linux kernel
    and may have unexpected results even if they are. Additional research should be
    done before testing any of these on a production system.


    ### UMASK


    *umask sets the default file permissions for a file when it is first created and
    uses a list of octal values to indicate what rights to *remove*. A typical *umask*
    is 0022, with the two''s meaning new files will have the write privilege removed
    for members of group and other. You can view your *umask* or change it by using
    simply typing *umask newmask*.

    '
