    # 路由


    系统内部每个网卡（NIC）的 IP 地址和相关数据的设置仅是所需网络配置的一部分。系统需要知道将数据包路由到何处，这是通过在接口设置后使用位于 `/sbin`
    下的 `route` 命令来实现的。


    任何网络接口将有一个 IP 地址和一个子网掩码。IP 地址将是 192.168.1.1（IPv4）或 2001:db9:0:567:1:1（IPv6）。子网掩码标识该网络中有多少节点，例如，C
    类网络有 254 个节点。当一台机器与另一台机器通信时，它将决定如何路由这些数据包。如果它在本地网络上，可以直接进行。否则，将使用中间路由器发送数据包。不带参数使用的
    `route` 命令将显示当前路由表，如下所示：


    ```

    $ syngress > /sbin/route

    ```


    | 目的 (Destination) | 通用掩码 (Genmask) | 标志 (Flags) | 度量 (Metric) | 引用 (Ref) | 使用
    (Use) | 接口 (Iface) |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 192.168.1.0 * | 255.255.255.0 | U | 1 | 0 | eth0 |

    | loopback * | 255.0.0.0 | U | 0 | 0 | lo |

    | default | 192.168.1.1 | UG | 0 | 0 | eth0 |


    第一列显示 IP 或主机名。该机器的默认网关是默认项，当不存在指向目的地的路由时，数据包将发送此处。Genmask 定义了该特定网络的网络掩码（Netmask）。标志列可以有多个选项，U
    表示路由启用，G 指定目的地需要网关。另一个值得注意的列是 Iface。该列指定了用于该路由的接口。


    `route` 命令可以向路由表添加并指定主机或网络作为目的，默认为主机。最常见的添加路由是默认网关，如下：


    ```

    $ /sbin/route add default 1921168.1.1

    ```


    如果接口刚刚使用 `ifconfig` 命令进行配置，可能必须手动添加网络：


    ```

    $ /sbin/route add -net 192.168.1.0 netmask 255.255.255.0 dev eth1

    ```


    # IPTABLES


    iptables 是一个用于系统管理员的用户空间程序，通常安装为 `/usr/sbin/iptables`。它用于配置表、规则和过滤器，以控制进入和离开系统的数据包的处理。它使用
    Xtables 框架，该框架由 Netfilter 使用。Xtables 是内核级组件，为内核级扩展提供应用程序接口（API）。表与许多特定类型的数据包处理相关。数据包通过链（chain）中的系统规则进行处理，每条规则在必要时会将数据包发送到另一个规则。进入和离开系统的所有网络数据包至少经过一个链。


    表中三个预定义的链链：输入（input）、输出（output）和转发（forward）。数据包在链中遍历，直到它匹配到数据包并决定如何处理它（例如接受或丢弃数据包），或者将规则处理返回给调用链，或者遍历到链的末尾。可以使用
    `iptables -l` 命令显示当前规则，必须以 root 身份运行，因为需要权限。网络地址翻译（NAT）通过数据包过滤规则集配置，包含在 iptables
    中。


    # DNS 记录类型和 DNS 解析


    域名服务器使用解析器过程将名称转换为其实际 IP 地址。这些服务器在上述定义的 `/etc/resolv.conf` 文件中。每个 NS 都是树形结构的一部分，其域（如
    foo.com）将有一个权威 NS。为了方便和速度，每个 NS 可能会将其区域的部分委托给其他 NS。从根域名开始，可以通过遵循委托链找到某个域的权威 NS
    服务器。


    # 快速概览


    每个 DNS 都会在资源记录中包含该域的数据。这些记录持有关于该域的单一事实，常见的记录定义如下：


    - A（地址）记录定义了与名称关联的实际 IP 地址。

    - NS（服务器名称）记录定义了该域的权威 NS。

    - MX（邮件交换器）记录定义了该区域的主服务器。

    - PTR（指针）记录定义了特定 IP 主机的真实名称。

    - CNAME（规范名称）是一个名称到另一个名称的别名。

    - TXT（文本）主要用于人类可读文本，但也包含机器可读的数据。


    关于 DNS 的更多信息见第 8 章“安装与配置”。


