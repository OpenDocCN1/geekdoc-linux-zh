    # CHAPTER 4

    Configuring the Base System


    +   Exam objectives in this chapter

    - User Profiles

    - Device Management

    - Networking


    # INTRODUCTION


    This chapter explains how to configure system and user profiles as well as the
    common environment variables, the management of the various devices and where
    these are located in the disk structure, and the fundamentals of Linux networking
    utilizing TCP/IP and how to manage within Linux.


    User management is one of the fundamental tasks that need to be understood for
    day-to-day management of a Linux system. Ensuring that users have the correct
    rights and environment setup will assure that their experience in using the system
    is favorable and that the overhead is kept to a minimum.


    The networking of the computer system, whether via wired or wireless connection,
    is usually a necessity in today''s world. The computer also utilizes Transmission
    Control Protocol/Internet Protocol (TCP/IP) as the transport mechanism for the
    network connections and the different options available to set up this will be
    discussed. The basics in connecting to name servers (NSs) and Dynamic Host Configuration
    Protocol (DHCP) servers are also discussed, and the majority of parameters are
    explained.


    # USER PROFILES


    Any installation of Linux includes the creation of different user accounts: the
    superuser, a normal day-to-day user, and a system user. A normal user can add,
    delete, and modify his or her files and those that have the appropriate attribute
    set. These users cannot make system-wide changes nor can they manage other users
    on the system.'
  - '[PAGE 43]


    # CHAPTER 4 Configuring the Base System


    A superuser (also referred to as a system administrator) has global privileges
    and can create and delete users and can change the permissions of files located
    within the filesystems. There is a special superuser known as root, with a user
    ID and group ID of 0. This user has full and unrestricted rights to manipulate
    any file, to traverse any directory, and to execute any program.


    # Fast Facts


    All users in a system will have a profile which is configurable.


    +   - Only superusers have the rights to configure other user''s profiles.

    - Use export when you set environment variables if they need to be elsewhere in
    the environment.

    - Use the full path name when you need to run commands that are not located in
    a directory specified in your path variable.

    - Setting a variable may require additional actions, for example, setting the
    PRINTER variable also needs printer drivers installed.


    A system user is an administrative account that is used by the system itself for
    the running of various administrative tasks. System users differ from other users
    in the system that they do not have a home directory or password; nor can they
    be accessed via the normal system login prompt.


    # System and User Profile and Environment Variables


    Users on the system are able to customize their profile to suit specific needs
    and preferences, held in environment variables throughout the system. There are
    three different shells in bash (Bourne-again shell): login shell, normal shell,
    and interactive shell. The login shell bash_profile located in the user home directory
    or /etc directory, and interactive shells refer ~/.bashrc. The environment variables
    are named objects that contain information that can be used by one or more applications.


    A summary of the bash (Bourne-again shell) startup files is shown below:


    +   - /etc/profile: The system-wide startup file and will be executed when a user
    logs on.

    - /etc/bashrc: This is often linked to /etc/bashrc and is called per-interactive
    shell startup.


    Both these files will be protected, and only the superuser (root) will be able
    to make changes to the file. As the files may be overwritten with a system upgrade,
    it is not recommended that changes are made to them directly.'
