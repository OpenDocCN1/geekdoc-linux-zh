    ## 安装、删除和更新程序


    使用的选项中 `c` 用于创建 tar 文件，`v` 用于详细输出，`f` 用于将输出写入指定的文件。tar 归档将根据末尾指定的一个或多个文件和/或目录创建。同一条命令行上可以指定多个文件或目录。例如，假设你想压缩目录文件夹中的所有内容，比如
    `/home/synergy/work`。在当前目录下创建 `work.tar` 归档的命令为：


    ```

    tar -cvf work.tar /home/synergy/work

    ```


    一旦创建了 tar 文件，你可以使用 `tar -tvf work` 列出其内容。可以使用 `-xvf work` 解压 tar 文件或提取文件。此提取过程不会删除
    tar 文件，而是将文件放置在当前工作目录中。**


    `tar` 工具还可用于压缩已创建的 tar 文件。在上面的示例中，为了压缩 `work` 目录的 tar 文件，你将使用：


    ```

    tar -czvf work.tar

    ```


    这些文件将使用 `gzip` 进行压缩，并赋予 `.tgz` 扩展名。可以使用以下命令解压压缩文件：


    ```

    tar -xzvf work.tar

    ```


    ## 压缩工具


    某些压缩工具在特定类型的文件上效果最好，但我们将重点介绍几个。我们提到了 `gzip` 可以配合 `tar` 使用。它也是一个独立的程序，可以随时调用来压缩文件。该命令的格式为：


    ```

    gzip filename.ext

    ```


    这将压缩 `filename.ext` 并将其保存为 `filename.ext.gz`。原始文件在此过程中会被删除。可以使用以下命令解压：


    ```

    gzip filename.ext.gz

    ```


    再次，该命令将删除 `filename.ext.gz` 并仅留下 `filename.ext`。`gzip` 工具可以将文件压缩为 1 到 9 的不同级别，其中
    1 最快但效率最低，9 效率极高，默认级别为 6。对于 `gzip` 和 `unzip`，都可以使用 `-r` 参数，它将递归地压缩或解压当前目录及其子目录中的所有文件。


    `bzip2/bunzip` 工具是另一对压缩和解压缩工具，通常能提供略高的压缩率。命令行选项与 `gzip/gzip` 非常相似。压缩后的文件通常具有 `bz2/bz`
    或 `tb/tb2` 扩展名（压缩文件或压缩的 tar 归档）。


    ## 第 6 章 安装应用程序


    ## 添加和删除仓库


    Linux 有数千个软件软件包存储在软件仓库中，主仓库通常在安装时设置。如果你在 Linux 初始加载期间没有连接互联网，这些仓库可能未设置或被标记为非活动。


    ### yum 仓库


    软件仓库可以定义在远程服务器上，也可以在本地。仓库定义在 `/etc/yum.conf` 文件和 `/etc/yum.repos` 目录中。你可以通过从其他仓库下载软件并建立本地仓库，为网络中的多台机器保存这些下载内容。当你下载完包后，需要为仓库生成正确的信息。这是通过使用
    `createrepo` 实现的，它从 `rpm` 文件中提取所有数据以生成 `yum` 的元数据。从 `/rpm_directory` 创建元数据的命令为：


    ```

    createrepo /rpm_directory

    ```


    这可以被包含在 `/etc/yum.repo.d` 目录下的文件中。


    > 快速事实

    > 根据你的环境，你可能根据系统的实际用途使用不同的仓库。


    - 对于服务器和普通用户，建议使用稳定发行版的仓库。

    - 如果你需要新的、开发版或不稳定版仓库的额外功能，请在部署前留出足够的时间。

    - 从任何仓库添加包的用户可能会导致系统不稳定，并为系统管理员增加工作量。


    ### 在 Debian 中添加仓库


    添加仓库的方法是：在 `/etc/sources.list` 文件中添加行，或者在 `/etc/sources.list.d/` 目录下创建文件。仓库的格式如下：


    ```

    deb http://deb.debian.org/debian focal main

    ```


    添加安全源：


    ```

    deb http://deb.debian.org/debian focal-updates main

    deb http://security.debian.org/debian-security focal-security main

    ```


    添加后，你可以使用 `apt update` 更新软件包列表，使用 `apt install` 安装软件包，使用 `apt remove` 移除软件包。


    ## 总结


    在本章中，我们学习了如何安装、删除和更新 Linux 应用程序。我们学习了如何使用 `tar`、`gzip`、`bzip2` 等压缩和解压缩工具。我们还了解了如何管理软件仓库，如
    `yum` 和 `apt`。这些技能对于管理 Linux 系统来说至关重要。


    '
