    # Linux Installation Process


    Linux can be installed from various local and network sources. Apart from a few
    unique settings, the installation process for each installation source is essentially
    the same. Linux local media installation can be performed by using CD, DVD, or
    .iso sources. When the installer is launched from a local source, the system completes
    an on-board self test and displays an initial screen allowing options, such as
    install, repair, rescue, and so forth. The options offered will vary depending
    upon the Linux distribution, but typically follows:


    - Boot from the Hard Disk: It is used to automatically boot an existing Linux
    operating system.

    - Repair Installed: This option repairs a previously installed system.

    - Installation: This option loads the mini Linux kernel from the Linux distribution
    and starts the installation process.

    - Rescue System: This option starts a specialized Linux kernel without a graphical
    user interface. It loads the Linux kernel into RAM and may configuration files,
    check the filesystem for defects, and/or modify the boot loader configuration,
    resize the partition, and a few other critical modifications that may be necessary.

    - Check Installation Media: It is used to ensure the image''s integrity.

    - Memory Test: This option conducts syntactic tests of your system using memtest86.


    The installation process is divided into three distinct stages: preparation, installation,
    and configuration. The preparation stage assists you in configuring the system''s
    language, date and time, desktop environment, user account information, and root
    password authentication methods, and type of disk partitioning information. The
    installation stage is a noninteractive process, which installs the software and
    prepares your system for the initial boot sequence. The final stage is the configuration
    stage and, depending on whether you selected automatic or manual configuration,
    the installer software will either preconfigure various network settings or allow
    you to input network configuration information. For example, your system''s host
    name, domain name, and other network configuration settings (for example, interfaces,
    DHCP, firewalls).


    # Preparation


    The first stage, preparation, collects information from your system''s environment
    and your preferences. The default language and keyboard settings are English (US).
    Selecting the language and keyboard settings will automatically switch you to
    the prescribe settings. The Installer performs a system analysis of your system
    by conducting a system probe to search for various storage devices (for example,
    USB, Firewire, floppy disks, hard disk drives), existing Linux partitions and
    system files, determining whether the system can be updated, and launching the
    Package Manager.


    # CHAPTER 1 Installing Linux


    The Clock and Time Zone setting allows you to set the Region, Time Zone, and system
    Date and Time information. In addition, you can determine if you would like to
    use local time or UTC (Coordinated Universal Time). The system can be configured
    to use Network Time Protocol (NTP) after the installation process is completed.
    Some distributions allow you to choose which desktop environment you wish to install
    (if any), with GNOME and KDE being the most popular.


    # PARTITIONING


    Partitioning is the process of selecting and implementing a partition and file
    system based on your disk layout. The choice to select the default partition-based
    option or the logical volume management (LVM)-based option will normally be given.
    In addition, the user can choose to edit the existing partitions or create new
    partitions. The decision to create a new partition or edit an existing partition
    depends on if the system will coexist with another operating system (for example,
    Microsoft Windows) or contains more than one disk drive, or if you want to resize
    a filesystem partition (for example, New Technology File System (NTFS)).


    ![](img/53450e0f522134e838a034ce98470308_6_0.png)


    Correctly partitioning a hard disk to install and support Linux is essential.
    The recommended partitioning schema represents the most common approach that often
    entails having two partitions and extended partition.


    The two primary partitions support the root partition and the swap partition.
    The extended partition supports the home partition. A hard disk can have a maximum
    of four primary partitions.


    # USER SETTINGS


    User accounts can be created along with local or network authentication. You may
    be able to assign the same password to the system administrator “root” account,
    but for better security, it is best to use different ones. Optionally, you may
    be able to set an Automatic Login feature to allow the system to automatically
    log you in whenever the system restarts (or reboots). For security reasons, this
    option should not be selected and users should always be required to enter their
    usernames and passwords.


    ![](img/53450e0f522134e838a034ce98470308_6_1.png)


    The user information will include the following:


    - User Full Name: User’s first and surname must be entered.

    - Username: Username for logging in to the system.

    - Password: It can be alphanumeric, case sensitive, and should not contain any
    accented characters or umlauts. The system automatically checks for weak passwords.


    # Installation Settings


    During installation, Linux is installed in accordance with the choices made previously.
    A number of Linux distributions, such as openSUSE, will display the choices you
    made prior to installation for you to confirm these and, optionally, modify them
    prior to installation occurring.


    The last step in the installation stage prepares your system to boot into the
    new Linux operating system, which includes copying of the system files to the
    system, saving any configurations, installing the Boot Manager, saving any installation
    settings, and finally preparing the system for the initial boot.


    # INSTALLING ACROSS THE NETWORK


    Network source installation is slower than installing from local media due to
    limitation on network bandwidth.


    > Fast Facts

    > For network installation, you need to remember:

    - Primary network protocols available are Hypertext Transfer Protocol (HTTP),
    File Transfer Protocol (FTP), Network File System (NFS), and Server Block (a protocol)
    (SMB).

    - Installation can occur from an Internet-based server using HTTP or FTP.

    - The targeted Linux system must be started from a network bootable CD or DVD
    image.

    - The IP-address or name of the server is required for HTTP, NFS, or FTP installations.

    - Installation can use an anonymous FTP server.


    The system will complete an on-board self test as before and the Linux kernel
    will provide you with various menu options for installing Linux and additional
    configuration options required prior to the installation process. While the desired
    network installation source is varied (for example, DVD, SLP, FTP, HTTP, SMB,
    Hard Disk) for the Linux+ Certification exam, we will concentrate on the HTTP,
    FTP, and NFS protocols.


    | Network Installation Type | Domain Name/IP Address | Distribution Source Directory/Folder
    | User Name | Password |

    | :--- | :--- | :--- | :--- | :--- |

    | HTTP | Required | Required | N/A | N/A |

    | FTP | Required | Required | Required (anonymous login if empty) | Required |

    | NFS | Required | Required | N/A | N/A |


    Table 1.1 summarizes the type of network installations performed, and the parameter
    values you will need to provide during the initial installation.


    After selecting the preferred network-based installation method, the installer
    will work as described earlier in the Installing from Local Media section.


    ![](img/53450e0f522134e838a034ce98470308_8_0.png)


    Network installations entail making a small Linux boot disk and downloading the
    majority of the code, which will take considerably longer than installing the
    system with local media. Although you can install Linux on a number of systems
    simultaneously, ensure you have adequate bandwidth.


    # LAYING OUT THE FILESYSTEM


    There are two options on laying out the filesystem: partition-based (default)
    or LVM-based.


    ![](img/53450e0f522134e838a034ce98470308_8_1.png)


    Before deciding on how to layout your system, you will need to consider the following:


    - Physical hard disks have limitations imposed by the disk manufacturer (for example,
    disk geometry) and by the system manufacturer (for example, please, BIOS).

    - Primary partitions (maximum four per disk) divide the hard disk drive into physical
    groups.

    - Extended partitions can be subdivided into logical partitions (groups).

