    )\n\n# 也可以为主机指定固定地址。\n# 可以使用名称或 IP 地址\n\n```\nhost adminprinter(\n  hardware ethernet\
    \ 08:00:07:26:c0:a5;\n  fixed-address adminprinter.fugue.com;\n)\n```\n\n此设置通过\
    \ DHCP 分配若干 IP 地址，包括租赁地址和固定地址。\n\n## DNS\n\nDNS 将机器名称解析为 IP 地址，或者将 IP 地址转换为名称。原则上讲，DNS\
    \ 将名称解析到其 IP 地址。\n\n![](img/53450e0f522134e838a034ce98470308_113_0.png)\n\n域名命名空间可以看作是树形结构。\n\
    \n- 树中的每个域都是节点，每个节点都关联有一组资源记录 (RRs)。\n- RR 将定义（至少）所有权、名称和 IP 地址。\n- 域名可以有子域，通常称为子节点。\n\
    - 根节点命名为 .（点），这是文件系统中根目录 / 的推论。\n- 子域将其名称置于根名称之前，并用另一个 \\ 隔开。\n- 每个域中的实际机器通过其机器名和在完全限定域名\
    \ (FQDN) 中所属的域来定义。\n\n域名系统是一个分布式数据库，该数据库的节点是名称服务器，每个服务器拥有一个或多个权威 DNS，发布有关该域的所有信息，这些信息包含在\
    \ DNS 的区域文件（zone files）中。正向区域和反向区域定义为：反向区域将 IP 地址与主机名关联，正向区域将名称与 IP 地址关联。DNS 解析器是客户端-服务器架构中的客户端部分，是执行查询解析的进程，例如将\
    \ FQDN 翻译为其实际 IP 地址。\n\n## 第 8 章 安装、配置为服务器\n\n### DNS RR\n\nRR 是域名系统最基本的部分，并包含若干基本元素：类型\
    \ (type)\n\n### 缓存名称服务器\n缓存名称服务器将构建已解析域名的本地缓存列表，并为你网络上的其他主机提供服务。大量的 DNS 请求是相同的，这将提高解析速度并减少发送到由\
    \ *named* 提供的另一个名称服务器的流量。下面是一个示例列表，显示了如何设置主名称服务器，该设置位于 *named.conf* 文件中（通常在 /etc\
    \ 或 /etc/named.d）。\n\n```\nzone \"mydomain.com\" IN {\n  type master;\n  file\
    \ \"mydomain.com.xzone\";\n  allow-update [ none ];\n};\n```\n\n有一个名为 *rndc* 的控制工具，它允许你管理\
    \ *named* 守护进程。*rndc* 的配置文件位于 /etc/rndc.conf，此外，你需要在 /etc/rndc.conf 和 /etc/named.conf\
    \ 中指定身份验证密钥，且两者必须匹配。你需要使用以下命令为两个配置文件生成 HMAC-MD5 密钥：\n\n```\ndnssec-keygen -a hmac-md5\
    \ -b <bit-length> -n HOST <key-file-name>\n```\n\n*rndc* 连接的默认端口为 953。一旦设置好命令，可以使用表\
    \ 8.1 所示的选项配合 *rndc* 命令。\n\n## NTP\n\nNTP 在网络上同步计算机时\n\n| 表 8.1 rndc 选项 | |\n\
    | :--- | :--- |\n| Refresh | 刷新数据库 |\n| Reload | 重新加载区域文件但保留缓存文件 |\n| Stop | 优雅地停止服务\
    \ |\n\n## 表 8.2 date 选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| -a | 在时间偏移时调整日期 |\n\
    | -u | 显示或设置 GMT 时间 |\n| -s datetime | 设置时间和日期 |\n\nNTP 客户端实现为一个持续运行的守护进程，由于其计时特性，它运行在内核空间中。主配置文件是\
    \ /etc/ntp.conf，定义了要同步的服务器，以及允许同步到你服务器的网络。需要定义若干服务器以确保冗余，如下所示：\n\n```\nserver\
    \ lerc-dns.lerc.nasa.gov # Stratem 1 server\nserver ntp.time.edu             \
    \  # Stratem 2 server\n```\n\n实用型程序 ntpq 用于监控 NTP 守护进程以确定性能，ntpq -p 有助于查看当前正在轮询哪些服务器。本地日期和时间可以使用\
    \ ndate 或 ntppd 设置。\n\n## 日期\n\ndate 显示或设置没有 NTP 的系统上的日期，常用选项如表 8.2 所示。\n\n##\
    \ Windows 互操作性\n\nLinux 和 Windows 之间的互操作性通常是任何系统管理员需要完成的一项基本任务。\n\n## 远程桌面\n\n\
