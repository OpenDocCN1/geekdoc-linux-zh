    # CHAPTER 2 Managing Filesystems


    SMBFS is a framework designed to allow workstations to access directory/file shares
    on a server. This model, implemented as client/server architecture, comprises
    two components. The first component, SMB protocol, provides mechanisms for performing
    interprocess communications and listeners on TCP 445. The second component, SMB
    service, is an application that resides on both the client-side and the server-side.
    The SMB service interoperates with the system''s authentication mechanisms and
    local filesystem, which allows the SMB environment to interoperate with various
    other servers. The Microsoft version of the SMBFS is known as the Common Internet
    File System (CIFS). The Samba application, an open source client/server implementation,
    provides support for both SMBFS and CIFS.


    ![](img/53450e0f522134e838a034ce98470308_18_0.png)


    The difference between local and remote filesystems needs to be understood as
    well the advantages and disadvantages of both.


    +   - Common network (remote) filesystems are NFS and SMB.

    - Connectivity with Microsoft systems is usually SMB.

    - Local filesystems can reside on internal or external attached devices.

    - Local filesystems normally outperform network filesystems.


    # MOUNTING AND U(N)MOUNTING FILESYSTEMS


    Mounting is a form of attaching or joining a separate storage device to the root
    directory hierarchy. It makes physically separate disks and/or partitions on a
    local or remote machine available, with the attached location on the client machine
    called a mount point. Linux users can manually mount a filesystem or have a filesystem
    automatically mounted when the system initially starts up.


    # The mount and um Commands


    To manually mount a filesystem to your existing root directory structure, you
    can establish a connection to a local mount point using the mount command, which
    can be used with or without any arguments. The mount command issued with no arguments
    lists all the currently mounted filesystems on the system. A unique feature about
    Linux is its treatment of devices (for example, storage devices and terminals)
    as directories (folders) with the /dev directory used to mount devices. To mount
    a device, use the mount command with, typically two arguments. The first argument
    represents the storage device that you wish to attach to your root directory structure.
    The second argument represents the directory location where you want to attach
    it underneath, the mount point. The general directory locations for most Linux
    systems are the /mnt and /media directories. The /media directory is typically
    used for the mounting of'
