    # CHECKSUM AND FILE VERIFICATION UTILITIES


    One complex security problem involves being able to trust that files you rely
    on haven''t been tampered with. Every Transmission Control Protocol (TCP) packet
    passing through every router is checked; the router ''adds up'' the bits, and
    if they match the that the sending device claims it, everything is assumed to
    be okay. When it comes to security, though, it requires protection against possible
    malicious intent not just random errors.


    # Fast Facts


    A number of methods are currently used to certify that files haven''t been tampered.


    +   - md5sum uses the MD5 algorithm to calculate a checksum for a down-loaded
    file, which is compared to a checksum supplied by the file''s creator. If you
