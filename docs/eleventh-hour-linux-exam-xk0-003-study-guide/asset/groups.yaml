    ## CHAPTER 2 Managing Filesystems


    | Table 2.2 Linux Directories and Partitions |

    | Linux Directory | Benefits of Separate Partition |

    |---|---| |

    | /swap | The /swap directory is used as swap space and functions as virtual memory.
    This directory provides additional memory to your system to run large programs.
    |

    | /boot | The /boot directory contains files and configuration needed during the
    Linux boot process. The implementation of /boot under a different partition would
    make system rescues and repairs easier. |

    | /home | The /home directory normally hosts users'' account directories and user-specific
    files. This directory should be assigned a separate partition as the multiuser
    user may fill the partition. In addition, performing backup and restore functions
    is a lot easier if changing user files reside on a separate partition. |

    | /tmp | The /tmp directory is used to support programs that require temporary
    file space that is volatile. It can reside under the root directory, but if temporary
    files grow quickly than your root directory, they may run out of disk space, perhaps
    from system or core dumps. |

    | /var | The /var directory contains system and application-generated information
    as a result of spooling, logging, and system temporary files. The /var directory
    should be placed on a separate partition, if possible. It is normally a subdirectory
    underneath the root directory. The primary reason why it should be separated is
    due to the possible growth of the log files and user mailboxes. |


    ## DIRECTORIES


    The purpose of this section is to provide an overview of the key directories,
    as shown in Table 2.3. As a hierarchical tree structure, the filesystems at the
    top with a directory indicated by a forward slash called the root directory and
    contains all the underlying files and directories.


    The Linux filesystems can be considered as follows:


    - A hierarchical structure to organize files and directories

    - A directory structure based on the Filesystem Hierarchy Standard (FHS)

    - Ordered consistently (due to FHS) to enable files and directories to be easily
    located by users and applications |


    ## Table 2.3 Critical Linux Directories


    | Linux Directory | Purpose |

    |---|---|

    | / | The root directory is the top tier directory and is the most important directory
    in the Linux system. It contains core directories and files, which include utilities,
    configuration files, bootloader information, and start-up information required
    for the initialization of the Linux system. |

    | /bin | Contains Linux commands used by the system administrator and users, which
    are also accessible when the system is in single-user mode |

    | /dev | Used within the Linux environment to mount devices |

    | /etc | To control the execution of programs and support the dynamic Linux environment,
    the /etc directory is used. It contains system and application configuration files.
    |

    | /media | Used to mount removable media (for example, floppy disks, CD/DVD drives,
    and USB-Thumb drives) for access by the system administrator and users |

    | /mnt | Similar to the /media directory, this is used to temporarily mount filesystems.
    |

    | /proc | Functions as a virtual filesystem for system processes and the Linux
    kernel |

    | /root | The root directory, not to be confused with the root directory, is the
    home directory assigned to the root user account. |

    | /sbin | Used to contain Linux utilities that are used only by the system administrator
    (for, root). It contains executables for critical booting, restoring, recovering,
    and/or repairing the Linux system. |

    | /usr/bin | Contains the primary executable commands on the system. Linux users
    and the root user can execute the commands in this directory. |

    | /usr/lib | This contains software libraries and packages for programs, including
    object files and internal binaries that are platform specific. |

    | /usr/lib64 | Performs the same function as the /usr/lib directory but supports
    the 64-bit architecture |

    | /usr/local | Location for locally installed applications. Software installed
    in this directory is typically not affected by system software updates. In addition,
    software installed in this directory can be shared. |

    | /usr/share | Used to store read-only architecture neutral files. The files contained
    in this directory are platform independent. |

    | /var/log | Contains data files generated as a result of spooling, logging, and
    system temporary files |


    ## CHAPTER 2 Managing Filesystems


    When addressing all other second tier directories and files, using the full path
    naming convention, all subsequent files and folders indicate their hierarchical
    position with the forward slash to prevent confusion with other directories that
    could have the same name but at a different sublayer tiers (for example, third
    level and fourth level).


    ## FILESYSTEM MANAGEMENT


    There are tools to manage filesystems either locally or remotely, and these will
    be used by all system administrators, often on a daily or weekly basis.


    ## Fast Facts


    The filesystem tools that you will need to learn for the exam and will likely
    use on a regular basis


    - du provides a summary of disk space used per file in the current directory and
    disk space allocated for files contained in any subdirectories.

    - df provides a summary of the amount disk space available on a filesystem in
    many different ways by using different arguments.

    - df -i displays information about inodes rather than file blocks.

    - df -h presents a disk space summary in an easy-to-understand output using kilobytes,
    megabytes, and/or gigabytes.

    - Filesystems need to be maintained and should be checked and, if necessary, repaired
    using the fsck command.

    - Filesystems need to be unmounted prior to running fsck.


    ## Quotas


    Users and errant applications, without limitations, can continue to add data to
    a folder that would eventually use up all the available disk space on a partition.
    Once a partition is full of data, not only will users and applications be unable
    to save information to disk but damage to system or application files may also
    occur. The implementation of disk quotas can provide valuable filesystem management
    support to allow you to specify limits on disk storage that may be allocated to
    a user or a group of users.


    To implement disk quotas, you must add the following qualifiers "usrquota" and
    "grpquota" to each desired in the /etc/fstab file and reboot the system. Then,
    the quotacheck command needs to execute the quota-selected filesystems and build
    a table of the current disk usage for each filesystem with disk quota enabled.
    This information is stored in aquota.group and aquota.user files. Finally, the
    edquota command, a quota editor, is used to display and change the various quota
    settings for one or more users or groups.


    ## Filesystem Management


    After the disk system is implemented, a summarized disk quota review for a filesystem
    is available using the repquota command, which creates a summarized disk quota
    report. The report includes a summary of the disk quotas for the specified filesystems
    and summaries for the current number of files and amount of disk space per user.
    Finally, in case of a system crash and other filesystem failures, the quotacheck
    command is used to scan a filesystem for disk quota use and to create, and, if
    necessary, repair disk quota systems.


    ## Loopback Device


    Linux offers support for a loopback device, which supports the transformation
    of a special file containing an image of another filesystem into a device that
    can be used like any partition. Linux loopback devices are commonly used for CD/DVD
    ISO images. The disk created of the CD/DVD contains the UDF or ISO9660 filesystem
    format. Prior to accessing the loopback device, the ISO image must be downloaded
    and mounted. The Linux mount command is used to attach the virtual filesystem.


    ## NFS


    NFS is a client/server model designed to make specific directories on a server
    available to a subset of clients or all clients on a network. The server-side
    must configure directories for sharing, known as exports, and the client-side
    must be configured for mounting exports. The shares (exports) made available via
    /etc/exports file. This file contains a listing of directories (exports) and the
    client machines that mount the exports. Each line represents a shared directory
    and any associated options.


    The parameters for each line are as follows:


    exported_directory <client> <options> <clientN> (<options>)


    - exported_directory is the directory where the exporting is on the server.

    - <client1> is the host or network to which the exporting is shared for access.
    The client1 parameter can be based on Internet Protocol (IP) address, host or
    name for a single host; a wildcard (*) for group of machines; or an IP range.

    - <options> are those imposed on the connection, which include read-only (ro),
    read-write (rw), root_squash (to prevent remove root access), no_squashing (to
    allow remove root access), and others.


    To activate the access of shared directories (exports), the exports command can
    be used. The set of arguments can be used with the command:


    - a To load and export all directories listed in /etc/exports file

    - r Rereads the /etc/exports file after changes have been made to the share permissions

    - i Ignores the /etc/exports file and a directory not listed in the file

    - u Removes (unset) currently listed exported directories

    - au Removes all exported directories

    '
