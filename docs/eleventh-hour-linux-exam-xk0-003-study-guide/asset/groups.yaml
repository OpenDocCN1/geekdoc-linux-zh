    ## 应用服务


    ## SQUID 配置文件


    配置文件为 `/etc/squid/squid.conf`，软件安装在 `/usr/local/squid`。Squid 可以配置为监听任何端口，当您尝试从常规浏览中隐藏某些服务器时，这通常非常有用。Squid
    的默认端口为 3128，尽管有许多人将其更改为 80 端口。要允许 squid 监听 3128、80 和 8080 端口，请修改 `squid.conf`：


    ```

    http_port 3128 80 8080

    ```


    访问控制列表（ACLs）可用于限制允许连接到服务器的网络以及使用的协议。Squid 代理可以过滤单个网站，使用户户无法访问这些网站。


    考试警告

    Squid 可以作为代理服务器，也可以作为缓存服务器。当它作为缓存服务器使用时，它会向客户端显示它已经在缓存中的数据，例如 Web 页面。当它作为代理服务器使用时，它充当客户端到目标服务器请求之间的中间人。因此，目标服务器将无法与客户端直接通信。


    ## 应用服务


    下一节将解释打印和电子邮件的常用应用服务。


    ## 打印


    Linux 中常用的打印服务器是 CUPS，通过使用端口 631 的 Web 浏览器访问 `http://localhost:631` 进行访问；如果您正在访问远程
    CUPS 实例，请将 `localhost` 部分替换为机器名称或 IP 地址。某些页面需要 root 用户名和密码。


    ## 网络打印机


    网络打印机需要 IP 地址，或者可以使用 CUPS 内置的简单网络管理协议（SNMP）找到它们。CUPS 支持三种网络协议：


    - AppSocket 协议，通常与 HP JetDirect 关联

    - 互联网打印协议 (IPP)，通常端口 631

    - 线路打印机守护进程 (LPD) 协议，端口 515


    ## 管理操作策略


    CUPS 内置了规则，允许管理员定义许多策略，例如用户必须提供密码，这些策略存储在 `cupsd.conf` 中，并通过 CUPS 界面使用“管理”选项卡上的“编辑配置文件”进行更改。


    ## 第 8 章 安装并配置为服务器


    ## 打印机类


    管理员可以将打印机分组形成一个类，允许用户向此组发送文档，CUPS 将决定使用哪个最佳打印机。


    ## 邮件


    电子邮件服务器可以有多个不同的客户端无缝地连接到它。域的邮件服务器需要配置 DNS 以确保有有效的 MX 记录。


    邮件服务器之间的主要传输机制是简单邮件传输协议 (SMTP)，它运行在端口 25 上。邮件通过邮件传输代理 (MTA，如 `sendmail`）从一个邮件服务器传输到另一个，或者电子邮件客户端使用邮局协议
    (POP) 和互联网消息访问协议 (IMAP) 从服务器检索邮件。


    ## 邮件如何工作


    用户将拥有一个一个域的用户名，例如 `username@your_domain`，邮件将发送到 DNS MX 记录指定的该域的邮件服务器。当用户发送发给本地用户的邮件时，邮件服务器将直接将邮件放在相应用户的邮箱中。如果是发送给域外的人员，邮件服务器将查找目标域的
    MX 记录，然后尝试将邮件发送或中继到服务器。


    ## Sendmail


    接下来的章节将概述如何设置 sendmail 服务器。


    ## 启动和停止 SENDMAIL


    Sendmail 通常在启动时启动，此时它会读取配置文件。对配置文件的更改需要重启它。


    ```

    service sendmail start

    service sendmail stop

    service sendmail restart

    ```


    ## SENDMAIL 配置


    主配置文件是 `sendmail.cf`，通常位于 `/etc/mail/sendmail.cf` 或 `/etc/sendmail/sendmail.cf`。生成
    sendmail cf 文件的常用方法是使用 m4 宏处理器，它作用于 `/etc/mail/sendmail.mc` 文件中的配置参数。


    ## 邮件中继


    需要设置邮件中继，以确保您的服务器不被垃圾邮件邮件发送者使用。您希望中继（或交付）所有源自您的域的邮件到目标域。如果您的域是 `mycorp.com`，则您需要将其添加到
    `/etc/mail/relay-domains` 文件中。由于伪造发件地址相对容易，可以使用 `/etc/mail/access`，它对谁可以使用中继服务器规定得具体。该文件可以配置中继、拒绝和丢弃等许多操作。该文件是一个简单的两列列表，需要转换为
    sendmail 兼容的文件。


    ## POSTFIX


    sendmail 的替代方案是 postfix，它的设计比 sendmail 更简单。尽管有几百个参数由配置文件 `/etc/postfix/main.cf`
    控制，但这些变量的定义和使用方式类似于 shell 变量。


    ```

    parameter = value

    new_parameter = $parameter

    ```


    用于出站邮件的域是 `myorigin` 参数，默认是本地机器。服务器可以接受多个域的邮件，这些将在 `mydestination` 参数中指定。与 sendmail一样，您必须确保只中继来自已知并信任的主机或网络的邮件。这是通过
    `mynetworks` 参数实现的。


    postfix 守护进程将所有错误报告给 syslog 守护进程，该进程本身按类别和严重程度对事件进行排序。日志类别、级别和日志文件名必须输入 `/etc/syslog.conf`
    以确保这些记录正确。


    您需要通过别名来配置电子邮件地址。


    - 别名适用于 sendmail 和 postfix。

    - 别名文件通常为 `/etc/aliases`。

    - 别名可以配置为 root。

    - 别名文件需要转换为邮件服务器解析的格式，使用 `newaliases`。

    - 别名可以设置简单的邮件列表。


    ## MySQL


    MySQL 是一个关系型数据库管理系统 (RDBMS)，并将数据存储在表中，可以相互链接以便方便操作数据。


    ## MySQL 配置


    主配置文件是 `/etc/my.cnf`，数据库位于 `/var/lib/mysql` 的子目录下。MySQL 数据目录需要由运行 MySQL 的用户所有，并使用
    `chown` 设置 700。


    ## 表 8.5 mysql 命令行选项


    | 选项 | 描述 |

    | :--- | :--- |

    | -u username | 连接用户名到数据库 |

    | -p | 提示密码 |

    | -h hostname | 连接到远程主机的 MySQL 服务器 |


    ## 启动和停止 MySQL


    可以使用以下命令启动和停止 MySQL 服务：


    ```

    service mysqld start

    service mysqld stop

    ```


    ## 测试连接


    可以使用内置的解释器非常方便地测试 MySQL 服务器。基本命令是 `mysql`，选项如表 8.5 所示。mysql 将尝试通过端口 3306 连接到数据库服务器。


