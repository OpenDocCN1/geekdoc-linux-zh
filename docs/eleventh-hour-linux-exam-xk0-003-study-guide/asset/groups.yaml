    ## A Note about Hardware


    Initial operating system installation requires the understanding of important
    concepts including computer hardware, environment settings, partitions and network
    settings.


    The hardware compatibility architecture is divided into four categories as follows:


    - Central processing unit (CPU) architectures supported continue to expand and
    include 32 and 64-bit Intel and AMD architectures, SPARC.

    - Hardware abstraction layer (HAL) is designed to function as a tier between the
    physical hardware and software. Its purpose is to hide hardware complexity and
    differences from the system.

    - The monolithic kernel architecture is designed to function dynamically and supports
    the loading of modules and instructions to implement all operating system services.
    The hardware components are presented as device drivers, and for each Linux distribution
    a unique Hardware Compatibility List is created.


    For the Linux+ exam, you will need a fundamental understanding of the following
    components:


    - Power supply units (PSU) are the devices required to provide the various hardware
    components within your system with direct current (DC).

    - Motherboards are circuit boards inside system unit that contains the CPU, the
    memory (RAM) chips, and the slots available for expansion cards. Other expansion
    boards interface with it to receive power and provide bidirectional communications.

    - CPUs are responsible for data processing and controlling the functions performed
    by the various hardware components, process all software instructions issued,
    and determine the speed of the.

    - Memory stores the data or programs that the CPU processes.

    - Expansion boards are devices that expand the capabilities of a computer by enabling
    a range of different devices.

    - Video adapters are expansion cards that translate binary into the images viewed
    on the computer monitor.

    - Storage devices are internal and external devices used for storing data and
    information.


    ## Installing from Local Media


    The purpose of this section is to present you with the major Linux installation
    decisions required during the operating system installation process.

