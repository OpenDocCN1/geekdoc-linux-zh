    ## CHAPTER 7

    Installing, Configuring as a Workstation


    Exam objectives in this chapter

    - Printing

    - X11


    ### INTRODUCTION

    Users of any system will undertake a number of basic tasks: interaction with applications
    on a monitor (for example, word processing, task scheduling) and printing. A standard
    setup for the user interface and the printers will make the users experience much
    more fulfilling; as well as reduce the support-head. The section on printers will
    describe how Common UNIX Printing System (CUPS) is configured and used.


    Most of the latest Linux distributions offer one or more graphical interfaces
    (GUIs) to interact with the user. These are commonly run on top of the X Windows
    system, with the most common window managers by KDE and GNOME. X11, the latest
    incarnation of Windows is a true client/server application, and how this is implemented
    is described, along with descriptions of the main configuration files that are
    needed.


    ### PRINTING

    The management of the devices and the setup can be confusing as the support for
    Linux print drivers varies between manufacturers, and not all have compatible
    Linux drivers. CUPS is a print service program that is commonly deployed in a
    modern Linux distribution.


    CUPS Overview

    The CUPS application will convert the page descriptions from an application into
    a format that the printer will understand and then manages the process for sending
    this to the actual printer. Manufactures of printers will develop different methods
    to print, even within their line of printers. The CUPS application will perform
    this conversion, hopefully hidden from the end user.


    The CUPS application can be summarized as performing the following actions.


    - Create and manage a queue for each printer.

    - Users will send print requests to CUPS and CUPS puts the job into the appropriate
    queue.

    - Each job will have a job request associated with it.

    - Users can cancel or pause their jobs.

    - CUPS assigns a program to each job to convert it into a printable form.

    - Jobs are activated in a first-in/first-out basis.

    - Completed jobs are removed from the queue by CUPS.


    ### Enable and Disable Queues

    Each printer will have its own queue which will be managed to ensure that the
    jobs are printed in an orderly fashion. These queues can be enabled or disabled,
    even if there are items in the queue. This is often necessary if a printer has
    a problem that needs be fixed and the system administrator wants to disable the
    queue until the issue is corrected. A system administrator can also issue a comment
    to tell users why the printer is disabled.


    ```

    # cupsdisable -r "Printer maintenance is being performed" CANONMX

    ```


    The printer can be enabled using the command:


    ```

    # cupsenable CANONMX

    ```


    ### WEB MANAGEMENT PORT (PORT 631)

    The interface to CUPS is via a Web interface that allows you to view print jobs
    and what printers are installed, and also to manage them. CUPS can be accessed
    via a Web interface on port 631, either locally or remotely. On the local machine,
    the interface can be accessed using the URL http://localhost:631. The interface
    is shown in Figure 7.1. In addition, there is a CUPS application program, which
    does not use a browser, but the look and feel is identical.


    There are some pages on the GUI that will require a user name and password to
    perform actions on them, such as to add a printer. On most Linux distributions,
    only root can add, modify, or delete a printer or class of printers.


    ### Common UNIX Printing System 1.3.9

    Welcome!

    These pages allow you to monitor your printers and jobs as well as perform system
    administration tasks. Click on any of the tabs above or on below to perform a
    task.


    If you are asked for username and password, enter your username and password or
    the "root" username and password.


    ### About CUPS

    CUPS provides a portable printing layer for UNIX-based operating systems. It is
    developed and maintained by Apple Inc. to promote a standard printing solution.
    CUPS is the printing system interface that uses Internet Printing Protocol ("IPP")
    as the basis for it.


    ### Printer Drivers and Assistance

    FIGURE 7.1

    CUPS Interface in Browser


    ### Crunch Time

    The management of printers section is very powerful and allows the user to:

    - Print a test page

    - Stop/start a printer

    - Enable and disable a queue


    ### Managing Printers, Jobs, and Queues

    The CUPS interface is easy to understand and for the majority of users, it is
    easier to use the command line. As the system administrator can prevent unauthorized
    users changing certain functions, it provides an easy, safe GUI to deploy to users.


    ### Fast Facts

    - Move jobs from one queue to another

    - Cancel all jobs

    - Set printer options

    - Allow specified users

    - Set as default


    ### CUPS Printer Classes

    CUPS allows the user to group printers together and this collection of printers
    is called a *class*. This is particularly of interest in a company who has a number
    of printers and they can be grouped in areas, such as finance, admin, and so forth.
    This allows printers to be offline for maintenance and the user will not notice
    any disruption or need to remember the names of different printers in their area.
    The adding and management of printer classes is undertaken in the Administration
    tab of the CUPS GUI.


    > > **DID YOU KNOW?**

    Although we have discussed CUPS in terms of Linux, it is a cross-platform software
    application.

    - CUPS can run on Microsoft Windows and Apple platforms as well.

    - The application can manage local and remote printers – even across the Internet.

    - The Web-based GUI allows remote administration.

    - The Web interface port is 631.


