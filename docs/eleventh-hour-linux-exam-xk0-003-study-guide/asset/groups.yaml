    ## CHAPTER 2 Managing Filesystems


    SMBFS is a framework designed to allow workstations to access directory/file shares
    on a server. This model, implemented as client/server architecture, comprises
    two components. The first component, SMB protocol, provides mechanisms for performing
    interprocess communications and listeners on TCP 445. The second component, SMB
    service, is an application that resides on both the client-side and the server-side.
    The SMB service interoperates with the system''s authentication mechanisms and
    local filesystem, which allows the SMB environment to interoperate with various
    other servers. The Microsoft version of the SMBFS is known as the Common Internet
    File System (CIFS). The Samba application, an open source client/server implementation,
    provides support for both SMBFS and CIFS.


    ![](img/53450e0f522134e838a034ce98470308_18_0.png)


    The difference between local and remote filesystems needs to be understood as
    well the advantages and disadvantages of both.


    - Common network (remote) filesystems are NFS and SMB.

    - Connectivity with Microsoft systems is usually SMB.

    - Local filesystems can reside on internal or external attached devices.

    - Local filesystems normally outperform network filesystems.


    ## MOUNTING AND U(N)MOUNTING FILESYSTEMS


    Mounting is a form of attaching or joining a separate storage device to the root
    directory hierarchy. It makes physically separate disks and/or partitions on a
    local or remote machine available, with the attached location on the client machine
    called a mount point. Linux users can manually mount a filesystem or have a filesystem
    automatically mounted when the system initially starts up.


    ## The mount and umount Commands


    To manually mount a filesystem to your existing root directory structure, you
    can establish a connection to a local mount point using the mount command, which
    can be used with or without any arguments. The mount command issued with no arguments
    lists all the currently mounted filesystems on the system. A unique feature about
    Linux is its treatment of devices (for example, storage devices and terminals)
    as directories (folders) with the /dev directory used to mount devices. To mount
    a device, use the mount command with, typically two arguments. The first argument
    represents the storage device that you wish to attach to your root directory structure.
    The second argument represents the directory location where you want to attach
    it underneath, the mount point. The general directory locations for most Linux
    systems are the /mnt and /media directories. The /media directory is typically
    used for the mounting of removable media (for example, floppy disks, CD/DVD drives).
    In addition, prior to mounting any storage device, a mount point directory needs
    to exist before executing the mount command.


    ```

    mount /dev/sdb1 /mnt/morestore

    ```


    The mount command does include extra arguments (for example, sb for superblock
    and noload for turning off journaling) that can be used. To specify a specific
    filesystem type, the -t argument should be used. Normally, the Linux kernel typically
    detects the type of filesystem of the storage device you are attaching.


    To disconnect a device, use the unmount command, specifying the mount point.


    ```

    umount /mnt/morestore

    ```


    ## Fast Facts


    Mounting and unmounting of partitions is an often used process by system administrators.
    Knowing the commands and options is very important.


    - To command to unmount a device is unmount.

    - Linux normally detects the type of filesystem you are attaching.

    - Add systems to be permanently mounted to the /etc/fstab file.


    ## /etc/fstab


    The /etc/fstab file is text-based, which lists the filesystems that are mounted
    on a permanent basis whenever the system is booted. The structure for adding a
    filesystem to the /etc/fstab so that it can be mounted automatically at boot catches
    the partition to be mounted, the mount point, the filesystem type, and other filesystem
    options (for example, nolist, noatime, and auto). A typical structure is shown
    in Figure 2.1.


    | LinuxExpert1@linux-01vc:~etc cat fstab | defaults | 0 0 |

    | :--- | :--- | :--- | :--- |

    | /dev/sda | swap | swap | 0 0 |

    | /dev/sda2 | ext3 | acl,user_xattr | 1 1 |

    | /dev/sda3 | /home | ext3 | acl,user_xattr | |

    | proc | /proc | proc | defaults | 0 0 |

    | sysfs | /sys | sysfs | noauto | 0 0 |

    | debugfs | /sys/kernel/debug | debugfs | noauto | 0 0 |

    | usbfs | /proc/bus/usb | usbfs | noauto | 0 0 |

    | devpts | /dev/pts | devpts | mode=0620,gid=5 | 0 0 |


    FIGURE 2.1

    /etc/fstab file


    ## PARTITIONS


    Partitioning is the allocation of electronic storage space within a storage device
    into separate data areas for a specific filesystem type. Whether implemented either
    via a partition editor tool or via the fdisk command, partitions can be created,
    deleted, or modified. The folder and file creation and placement process cannot
    occur until after the partitioning and formatting of the storage device. The decision
    to implement one or more partitions per device is based on certain advantages
    and disadvantages.


    ## Fast Facts


    Creating multiple partitions on your storage device:


    - Improves access time for data and applications colocated on the same partition

    - Supports the separation of user files and operating system files

    - Provides dedicated operating system swap or paging file space

    - Protects operating system files from the rapid growth of system data files (for
    example, logging and system cache) that may consume all available disk space quickly

    - Provides support for multibooting environments

    - Provides a layer of isolation to prevent or protect one partition''s system
    resources from another partition''s system resources

    - Allows the implementation of various filesystems and different geometry strategies
    to improve read and write performance


    After creating a partition, a filesystem must be installed to visit it via a partition
    editor tool or via the mkfs command. A directory structure would then need to
    be created for the allocation and organization of files and folders. The balancing
    of size and structure of the partitions, filesystems, and directories must be
    addressed, with decisions based on.


    - Initial boot access: During the installation process, it is critical the system
    BIOS (basic input/output system) and GRUB (grand unified bootloader) functions
    are able to access a partition. The system BIOS will access the primary partition
    to execute the bootloader, GRUB, which must be able to access the /boot partition
    to retrieve the Linux kernel and other critical configuration files. As a result,
    for some installations, placing the initial boot applications and configuration
    files on a separate partition makes the installation process easier, especially
    as, during the initial boot process, the Linux kernel de-vice.


    Disk space growth: The design and implementation of a Linux system require disk
    space projections. The amount of disk space needed for current and future use
    needs to be calculated, and the projections should include installed applications
    and application data. If a fixed partition-based implementation is used, space
    limitations or quotas should be used. The introduction of logical volume management
    (LVM) reduces disk growth by allowing volumes to expand across separate disks.


    Security and permissions: Information stored on the same partition opens the door
    for various security risks. For example, if the partition is corrupted, all the
    data could be lost. In addition, directories not properly secured could give unauthorized
    users access to sensitive data (for example, everybody''s HR records). Creating
    separate partitions to segregate system resources from user files allows you to
    place more stringent controls around system resources.


    Backup/restore: Creating several partitions provides greater backup flexibility,
    reduces backup impacts, and can improve restoration times.


    System repair: Creating a partition for critical partitions makes it easier to
    repair and/ recover a corrupted partition.


    Logging/monitoring: Log files must be accessed, reviewed, and in cases saved for
    security purposes. The creation of a separate partition for log files will make
    it easy to backup, restore, and secure them.


    Volatile/temporary data: Computers and associated applications are constantly
    creating volatile and temporary data. The Linux system creates a swap partition
    to hold some of this data. However, there are other directories (for example,
    /tmp) that traditionally reside underneath the root directory. These other directories
    can also outgrow the disk space capacity of the partition.


    System maintenance: The creation of separate partitions for system administration
    and maintenance purposes can also make the job easier.


    The decision to create a partition or not to create a partition is difficult.
    Clearly, a single partition is not a system design either; however, creating a
    partition for every directory is not feasible either. Table 2.2 provides more
    insight into why some directories are put on separate partitions.


    The recommended partitioning schema is to have two primary partitions and one
    extended partition. The two primary partitions support the Linux root partition
    and the Linux swap partition. The extended partition supports the home partition.

