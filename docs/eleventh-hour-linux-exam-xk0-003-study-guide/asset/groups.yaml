    ## Laying out the Filesystem


    - For any bootable operating system, there must be at least one primary partition
    which will be used by the operating system to store the kernel and a few pertinent
    files.

    - The remaining three partitions can be all primary partitions, extended, or a
    combination of both.

    - For a dual-boot system, there must be two primary partitions (one for each operating
    system).


    Partitions can be created or edited during the installation process, and the decision
    to create a new or edit an existing partition will be based on factors such as
    the Linux system will coexist with an existing partition or contains more than
    one disk, or if you want to resize a foreign operating system''s partition (for
    example, NTFS).


    Another approach to edit, and create partitions is via the use of the `fdisk`
    command line. The `fdisk -l` command displays all disk drives attached to the
    system and their corresponding geometry. The output shows the disk device name,
    the disk geometry, the disk identifier and the partition map (if a disk is accessible).


    The `fdisk` command is used to create or modify partitions, entered by typing
    `fdisk` and the disk drive of interest. The `fdisk` command mode screen is displayed
    and the command `m` is used to display a screen that lists commands available
    for use.


    The partitions created, whether primary or extended (with logical subdivided partitions),
    must be assigned a partition type which are used for hosting specific filesystems.
    The partition type 83 is used to support Linux filesystems, and the partition
    type swap is used to support the swap partition (type 82). To select and configure
