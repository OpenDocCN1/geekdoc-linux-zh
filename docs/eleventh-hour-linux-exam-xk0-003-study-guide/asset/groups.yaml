    和 CGI 脚本。展示了 Squid 代理服务器的配置，以及它在网络中使用。描述了 FTP 服务器的配置，以及如何配置以进行不同的文件传输（如纯 ASCII
    文本或二进制格式的程序）。


    最后，讨论了邮件服务器以及如何配置两个流行的邮件服务器 sendmail 和 postfix。


    '
