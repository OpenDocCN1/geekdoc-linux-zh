    ## 启动和停止 X11


    有多种方法可以启动和停止 X Windows 系统。通常情况下，显示管理器会在启动时自动加载，可选是通过设置 `/etc/initab` 文件以便在使用多用户模式（运行级别
    5）时加载 X Windows 系统。在 `/etc/system/displaymanager` 配置文件中使用的实际显示管理器如下（以 KDE 环境为例）：


    ```

    DISPLAYMANAGER="kdm4"

    ```


    当 Linux 在不使用显示管理器进行图形登录的情况下进入多用户模式时（例如 `/etc/initab` 文件中的运行级别 3），你必须从命令行启动 X 会话。必须启动
    X 服务器和 X 会话，可以使用不带任何参数的 `startx` 完成。


    `startx` 命令将使用在 `.xinit` 文件中的配置设置，默认位于 `/etc/X11/xinit` 目录；然而，用户可以使用位于家目录下的 `.xinit`
    文件来自定制 X 会话并启动默认客户端。如果你打算使用随系统安装的显示管理器，则不需要使用自定义的 `.xinit` 文件。


    `startx` 命令本身可以传递参数，这些参数会在启动 X 会话之前传递给 X 服务器。其中一个参数是 `-depth` 选项，它将更改使用的颜色数量。这可以在
    X 客户端的开发或测试期间使用，以确定在不同硬件解决方案上的外观。如果你计划在各种不同的硬件上进行大规模部署，这可能会很有用。这将启动一个深度为 1670
