    # Installing, Removing, and Updating Programs


    abiword-help - online help for AbiWord

    libgtview0c2a - rendering engine for MathML documents

    abiword-plugin-grammar - grammar checking plugin for AbiWord

    abiword-plugin-mathview - equation editor plugin for AbiWord

    abiword-plugin-gofice - GOffice interaction plugin for AbiWord


    # Resolving Application Dependencies


    You can download dependent application packages manually as you try to install
    an application from an rpm package, or you can use Yum. Yum is used for RPM-based
    systems, such as Red Hat and Fedora. For Linux distributions, apt natively resolves
    application dependencies. Although APT is a terrific tool from the command line,
    you are not forced to open a terminal window or change runlevels to drop to a
    command line when working in a GUI environment.


    # Compiling and Installing Applications from Source


    Compiling and installing from source presents a terrific opportunity to tune applications
    to your specific hardware and software platform. This section starts with a description
    of how to include these hardware- and software-specific parameters and then continues
    through the process to compile and install the application. It concludes with
    prominent utilities for archiving and packaging source code: tar, bzip, and gzip.


    # CONFIGURING THE SOURCE


    We will discuss downloading the package archive later in the section, but suppose
    for now that you have the source in a suitable directory on your hard drive. The
    first place to look is to see if there are any readme or install files in the
    directory and read them. These usually contain very useful information on the
    software and often give details on how to install them with any specific options
    or dependencies that you may need.


    After reading the documentation, you need to change directories to the directory
    where the package is stored. You can then configure the package, which is usually
    achieved using the configure script by ./configure.


    The configure script is a shell script which configures the Makefile, which is
    used by the compilation tool make (described below). This Makefile will have information
    on your system to enable make to compile the source correctly. The machine output
    from this command will be a new Makefile, and if the command worked correctly,
    this will be constructed and placed in the correct directory. It could be a lot
    of messages scrolled to the standard output during this process. If it finds an
    error, it will be reported, and configure will exit gracefully.'
  - '[PAGE 90]


    # MAKE


    The utility make is used to automatically determine which components of a software
    package need to be complied and then to guide this compile process. make uses
    the makefile, which details the relationships among the files in the package and
    how to update these files. This will be undertaken from the data in the database
    and the last modification times of files. The executables are typically made up
    from object files, which are compiled from source files.


    Once you have the makefile after running compiling, then you can run make. This
    shell script is typically run initially with no options and will parse the makefile
    and update any files as necessary. If make completes, this will build a binary
    of the software package. This does not install the binary; that step is achieved
    in the last step using the command make install and will have to run with superuser
    privileges.


    If this exits without errors displayed, the software has been installed correctly.
    The configure script determines where the program will be installed, typically
    in /usr/local/bin. To clean up your system from the temporary files left by make,
    you can run the command make clean.


    # AUTONCONF


    The autoconf utility is a package of M4 macros that are used to build a set of
    shell scripts to automatically configure software source packages. The utility
    will create a configuration script from a template file listing the operating
    system features that the package uses. The generation of the configuration files
    is primarily to make the user''s experience easier, to ensure that the configure
    process is easier to use and less prone to errors.


    # Archive Files


    The tar format has been in existence since the early days of UNIX and the utility
    to use this file format was originally designed for tape archives (tar). tar is
    now a common method for archiving or collecting a large number of files into one
    larger file, while preserving all the file information, such as directory structures,
    dates, and group permissions. Files that are packed into this format have a naming
    structure of filename.tar. These large files can be compressed using a compression
    utility such as gzip, bzip, or compress. Depending on the compression utility
    used, the tar file will be renamed.


    +   - filename.tar becomes filename.tar.gz if gzip is used.

    - filename.tar becomes filename.tar.bz 2 if bzip/bzip2 is used.


    To create a tar file, the following general syntax can be used:


    ```

    tar -cvf filename.tar files|directories

    ```'
