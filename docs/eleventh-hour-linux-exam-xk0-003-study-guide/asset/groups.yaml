    \n- 2. 你正在更换 Michael 的电脑，并已使用以下语法将硬盘备份到外部硬盘（`/mount/usbhdd`）：`dump-0 -A michaelhdd.archive\
    \ -f /mount/usbhdd/michaelhdd.backup / .`（原文如此）。你想在新电脑的另一个硬盘上还原备份。在启动新电脑并挂载外部硬盘后，你会使用哪种命令？\n\
    \  A. `restore -rf /mount/usbhdd/michaelhdd.backup`\n  B. `dump -xf /mount/usbhdd/michaelhdd.backup`\n\
    \  C. `tar -xvf /mount/usbhdd/michaelhdd.backup`\n  D. `restore -rf /mount/usbhdd/michaelhdd.archive`\n\
    \n- 3. 最近你听到报告说你的 Linux 服务器响应缓慢，你怀疑某些应用程序消耗了超过其应份额的服务器内存。在 `top` 运行时，你会按下哪个组合键组合，使运行中的程序按各自的内存使用百分比进行排序？\n\
    \  - A. F，然后 M\n  - B. F，然后 n\n  - C. F，然后 k\n  - D. F，然后 I\n\n- 4. 用户报告说某个特定的公司服务器在每天上午\
    \ 10:30 到 11:00 之间响应缓慢。你决定在此期间定期运行 `sar` 以捕获有关服务器网络性能的统计数据。你会使用什么语法来每 10 分钟采集六组此类指标？\n\
    \  A. `sar -A DEV 600 6`\n  B. `sar -n DEV 600 6`\n  C. `sar -n DEV 600 6`\n \
    \ D. `sar -A DEV 600 6`\n\n- 5. 你正准备设置一个主动模式 FTP 服务器。每当你尝试连接时，都可以连接到服务器，但无法建立数据连接。最可能的原因是什么？\n\
    \  A. TCP 端口 22 以下是关闭的\n  B. TCP 端口 1023 以上是开启的\n  C. TCP 端口 21 开启\n  D. TCP 端口\
    \ 1023 以下是关闭的\n\n## 答案\n\n- 1. 正确答案及解释：C。答案 C 是确的，因为 `-j` 选项使用 bzip2 压缩文件。\n \
    \ 错误选项及解释：A、B、D。答案 A 是错误的，因为 `-c` 选项创建 tar 包；答案 B 是错误的，因为 `-x` 用于解压而非创建最小尺寸包；答案\
    \ D 是错误的，因为 `-x` 选项用于解压。\n\n- 2. 正确答案及解释：D。答案 D 是正确的，因为使用 `restore` 命令配合 `-f`\
