    # Package Querying


    The query command, -q, queries the rpm database and gives you data on the package.
    Information on all the packages installed can easily be displayed using rpm -qa,
    but the output will be very long and should be piped through more or less redirected
    to a file.


    # Package Removing


    Packages already installed on a system can be removed or erased with the -e option.
    For instance, removing the Telnet package above can be achieved thus:


    ```

    rpm -e telnetd-0.17-23.1386

    ```


    > ### DID YOU KNOW?

    The two most widely used package types within Linux are rpm and deb.

    * Both allow the user to install, update, remove, and query software.

    * Additional tools can be used to resolve dependencies (for example, yum and APT).

    * Remove or erase packages with the "e" option with rpm.

    * Remove packages with the "r" option with dpkg.


    # YUM


    There is an automatic installation, removal, and update utility for rpm packages
    called yellowdog updater modified (yum). The advantage of using yum is that it
    resolves the dependencies automatically. Fedora provides a number of software
    repositories and is preconfigured to work with three:


    +   * Base repository contains the Fedora release, usually on your installation
    media.

    * Updates have all the updates from the base package.

    * Extras is a large selection of additional software that a user may want to install.


    In addition, there are also development repositories available which will have
    the newest code, which may not be stable. Like rpm, yum needs have superuser privileges
    to be performed.


    # Installing Software with yum


    You can install new software packages or package groups with yum. The following
    shows the commands for a single package (firefox) and a package group (MySQL database).


    ```

    su -c ''yum install firefox''

    su -c ''yum groupinstall "MySQL Database"

    ```'
  - '[PAGE 84]


    When the yum command executes, it checks for any dependencies, resolves them,
    and then installs the specified package. The dependency check needs to be recursive,
    so new packages to be installed are checked for dependencies and so on.


    > EXAM WARNING

    When you install a service, the Linux system will not start. You must configure
    the service to run on bootup, which can be achieved from the command line using
    `chkconfig` and service commands.


    # Updating Software


    To update a software package that is already installed, you can use the `update`
    option within `yum`. For example, to update the `tclient` package you would type
    the command `su -c yum update tclient`


    If the software being updated is currently in use by the system, the application
    or service needs to be restarted before the update is made. The kernel can also
    be updated using yum, and these updates will only come into upon a restart of
    the system. When the kernel is updated, yum will retain the old version in order
    that the old kernel can be booted into case of an error with the new kernel. The
    current and previous versions are kept.


    Package groups can also be updated, for the MySQL Database package group is updated
    using the command `su -c yum groupinstall "MySQL Database"`.


    # Removing Software


    The removal of software is achieved using the `remove` option. Again, both packages
    and package groups can be removed. When this is invoked, yum checks the software
    package and the dependencies and removes both.


    ```

    su -c ''yum remove firefox''

    su -c ''yum groupinstall "MySQL Database"''

    ```


    When yum removes the software package, it leaves any user data in place, but the
    configuration files may be removed.


