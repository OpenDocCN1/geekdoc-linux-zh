    ## Application Services


    ## SQUID CONFIGURATION FILES


    The configuration file is /etc/squid/squid.conf, and the software is installed
    in /usr/local/squid. Squid can be configured to listen on any port, which is often
    useful if you are trying to hide some servers from general browsing. The default
    port for squid is 3128, although a lot of people change this to port 80. To allow
    squid to listen on ports 3128, 80, and 8080, change the squid.conf:


    ```

    http_port 3128 80 8080

    ```


    Access control lists (ACLs) can be used to restrict the networks that are allowed
    to connect to the server and with which protocol. The squid proxy can filter individual
    sites so that users cannot access them.


    EXAM WARNING

    Squid can be used as a proxy server and as a caching server. When it is a caching
    server, it displays data to the client that it has already in cache, for example,
    a Web page. When it is used as a proxy server, it acts as a go-between for requests
    from a client to the target server. The target server will, therefore, not be
    able to communicate directly with the client.


    ## APPLICATION SERVICES


    The following section will explain the common application services of printing
    and e-mail.


    ## Printing


    The print server that is common within Linux is CUPS, and it is accessed via a
    Web browser using port 631, http://localhost:631, substituting the localhost part
    with a machine name or IP address if you are accessing a remote CUPS instance.
    Some pages require the root username and password.


    ## NETWORK PRINTERS


    Network printers require the IP address or can be found using Simple Network Management
    Protocol (SNMP) built into CUPS. There are three network protocols supported by
    CUPS:


    - AppSocket Protocol, usually associated with HP JetDirect

    - Internet Printing Protocol (IPP), normally port 631

    - Line Printer Daemon (LPD) Protocol, port 515


    ## Managing Operation Policies


    There are rules built into CUPS to allow the administrator to define a number
    of policies, such as the user must supply a password, stored in cupsd.conf and
    are changed by the CUPS interface using the Edit Configuration File on the Administration
    tab.


    ## CHAPTER 8 Installing, Configuring as a Server


    ## Printer Classes


    Administrators can group printers together to form a class, allowing users to
    send a document to this group, CUPS will decide the best printer to use.


    ## Mail


    An e-mail server can have a number of different clients seamlessly connecting
    to it. The mail server for a domain needs DNS configured to ensure that there
    is valid MX record.


    The main transport mechanism between e-mail servers is the Simple Mail Transfer
    Protocol (SMTP), which operates on port 25. Mail is transferred from one e-mail
    server to another using a mail transfer agent (MTA), such as sendmail, or Post
    Office Protocol (POP) and Internet Message Access Protocol (IMAP) are used by
    e-mail clients to retrieve e-mail from server.


    ## HOW MAIL WORKS


    Users will have usernames for a domain such as username@your_domain, and mail
    will be sent to the mail server in that domain specified by the DNS MX record.
    When users send e-mail destined for a local user, the mail server will simply
    put the e-mail in the appropriate user''s mailbox. If it is for someone outside
    the domain, the mail server will look up the MX record of the target domain and
    then try to send or relay the mail to server.


    ## Sendmail


    The following sections will outline how to set up a sendmail server.


    ## STARTING AND STOPPING SENDMAIL


    Sendmail is usually started upon boot, when it reads the configuration file. Changes
    to the configuration file require it to be restarted.


    ```

    service sendmail start

    service sendmail stop

    service sendmail restart

    ```


    ## SENDMAIL CONFIGURATION


    The main configuration file is sendmail.cf, normally located in /etc/mail/sendmail.cf
    or /etc/sendmail.cf. A common method of producing the sendmail cf file is through
    the use of m4 macro processor, which works on the configuration parameters in
    the file /etc/mail/sendmail.mc.


    ## MAIL RELAYING


    Mail relaying needs to be set up that your server is not used by spammers. You
    want to relay (or deliver) all mail that originates from your domain to the target
    domain. If your domain is mycorp.com, then you will need to add this into the
    /etc/mail/relay-domains file. As it is relatively easy to spoof the


    from address, /etc/mail/access can be used, which is more specific on who can
    use the relay server. This file can be used to configure a number of actions as
    relay, reject, and discard. The file is a simple two column list, which needs
    to be converted into a sendmail compatible file.


    ## POSTFIX


    An alternative to sendmail is postfix, which was designed to be simpler than sendmail.
    Although there are several hundred configuration parameters that are controlled
    by the configuration file /etc/postfix/main.cf., the variables are defined and
    used in a similar way to shell variables.


    ```

    parameter = value

    new_parameter = $parameter

    ```


    The domain that is used in outbound mail is the myorigin parameter, which defaults
    to the local machine. The server can accept mail for a number of domains, and
    these will be specified in the mydestination parameter. As sendmail, you must
    ensure you only relay mail from hosts or network you know and trust. This is undertaken
    by mynetworks parameter.


    The postfix daemon reports all errors to the syslog daemon, which itself sorts
    out events by class and severity. The logging classes, levels, and logfile names
    must be entered into /etc/syslog.conf to ensure these are logged correctly.


    You need to have a number of valid e-mail addresses "aliased" to another account.


    - Aliases work for both sendmail and postfix.

    - The aliases file is normally /etc/aliases or /etc/mail/aliases

    - Aliases are often configured to root.

    - The aliases file needs converting to a format that can be parsed by the mail
    server, using newaliases.

    - Aliases can be used to set up simple mailing lists.


    ## MySQL


    MySQL is a relational database management system (RDBMS) and will store data in
    tables, which can be linked together to enable manipulation of the data much easier.


    ## MySQL CONFIGURATION


    The main configuration file is /etc/my.cnf, and databases are located in a subdirectory
    of /var/lib/mysql. The MySQL data directory needs to be owned by the user who
    runs MySQL, and this directory should be set to 700 using chown.


    ## Table 8.5 mysql Command-Line Options


    | Option | Description |

    | :--- | :--- |

    | -u username | Connects a username to the database |

    | -p | Prompts for password |

    | -h hostname | Connects to the MySQL server on the remote hostname |


    ## STARTING AND STOPPING MySQL


    The MySQL service can be started and stopped using the commands below:


    ```

    service mysqld start

    service mysqld stop

    service mysqld restart

    ```


    ## TESTING THE CONNECTION


    The MySQL server can be tested very easily using the built-in command-interpreter.
    The basic command is mysql, and the options are shown in Table 8.5. mysql will
    attempt to connect to a remote database server using port 3306.


    ## SUMMARY OF EXAM OBJECTIVES


    In this chapter, you learned about how to configure a Linux system when used as
    a server. The DHCP service provides the client with an IP address and other data,
    such as the local nameserver. The basics of DNS configuration were discussed,
    and how to set up the different files for forward and reverse name resolution
    was outlined. The interoperability with Microsoft Windows using a Samba server
    and how to modify the various configuration files to undertake this task were
    defined.


    The section on Web services was centered around the Apache Web server, showing
    how the server is configured. The location of the main configuration files, the
    definitions of modules and containers pertain incorporated into the Apache configuration,
    and how PHP and CGI scripts are explained. The Squid proxy server configuration
    was shown, and how it is used in a network was described. The configuration of
    an FTP server and how this could be configured for different file transfers, such
    as straight ASCII text or programs in a binary form, were described.


    Finally, mail servers and how to configure the two most popular mail servers,
    sendmail and postfix, were discussed.

