    \n## 第3章 启动 Linux\n\n运行级别使用一组脚本，通过执行各种服务或进程，来定义计算机系统的启动或停止，以及 root 管理权限和用户访问的级别。运行级别编号从\
    \ 0 到 6，系统的默认运行级别设置位于 `/etc/initstab` 文件中。\n\n最后一个章节“故障排除启动问题”介绍了解决启动问题的方法。`dmesg`\
    \ 命令可以协助故障排除或获取有关系统硬件的信息，它通过能够打印或控制内核环形缓冲区，将 Linux 内核消息发送到标准输出。\n\n内核选项的动态修改允许你输入在系统启动期间由\
    \ Linux 内核执行的信息。可以通过编辑 `/boot/grub/grubmenu.lst`、在启动提示符处输入信息，或在启动过程中使用 GRUB 动态修改内核来添加内核参数。\n\
    \n救援（Rescue）方法会启动一个没有图形界面的特殊 Linux 内核。所加载的 Linux 内核可以从可启动设备（例如 LiveCD）获取。一旦内核加载到内存（RAM），你就可以配置文件、检查文件系统缺陷、验证和/或修改引导程序配置、调整分区大小，以及其他可能必要的系统修改。\n\
    \n## 五大最难级问题\n\n- 1. 你是部门 Linux 系统的 IT 系统管理员。你需要更改默认运行级别设置。哪一个文件包含默认运行级别设置？\n\
    \   A. /etc/initstab\n   B. /etc/grub/boot/initab\n   C. /boot/grub/device.map\n\
    \   D. /etc/init.d\n\n- 2. 你的 IT 部门进行了若干次严重的硬件设备更改。这些包括对硬盘驱动器的修改。你需要修改 GRUB 引导加载程序。你应该编辑哪个文件来配置\
    \ GRUB 2 阶段镜像？\n   A. /etc/menu.lst\n   B. /boot/grub/menu.lst\n   C. /etc/grub.conf\n\
    \   D. /boot/grub/grub.conf\n\n- 3. 你是部门 Linux 系统的 IT 系统管理员。你需要更改 GRUB 设备命名规范。哪个文件包含默认运行级别设置？\n\
    \   A. /etc/device.map\n   B. /etc/grub.boot/device.map\n   C. /boot/grub/device.map\n\
    \   D. /etc/init.d\n\n- 4. Linux 内核是 Linux 启动过程中的关键组件。它位于系统的哪个位置？\n   A. /kernel\
    \ 目录\n   B. /grub/boot/kernel 目录\n   C. /boot 目录\n   D. /boot/kernel 目录\n\n- 5.\
    \ Linux 引导加载程序是 Linux 启动过程中的关键组件。它位于系统的哪个位置？\n   A. 它位于主引导记录（MBR）中\n   B. 它位于\
    \ Linux 内核内部\n   C. /etc 目录\n   D. 在系统 BIOS 内部\n\n## 答案 \n\n- 1. 正确答案及解释：A。答案\
    \ A 是正确的，因为 `/etc/initstab` 包含默认运行级别设置。运行级别 5 的默认设置如下：\n\n```\n5:initdefault\n\
    ```\n\n错误答案及解释：B、C 和 D。答案 B 是错误的，因为路径 `/etc/grub` 不存在。答案 C 是错误的，因为 `/boot/grub/device.name`\
    \ 用于将 Linux 设备名称映射到 GRUB 命名规范。答案 D 是错误的，因为 `/etc/init.d` 是包含运行级别脚本的目录。\n\n- 2.\
    \ 正确答案及解释：C。答案 C 是正确的，因为 `/etc/grub.conf` 包含了用于查找和加载 GRUB stage2 镜像的磁盘分区信息。\n\n\
    错误答案及解释：A、B 和 D。答案 A 是错误的，因为 `menu.list` 不位于 `/etc` 目录中，且该文件用于确定在选定的菜单项上加载并启动哪个操作系统。答案\
    \ B 是错误的，因为该文件用于确定在选定的菜单项上加载并启动哪个操作系统。答案 D 是错误的，因为 `grub.conf` 不位于 `/boot/grub`\
    \ 目录。\n\n- 3. 正确答案及解释：C。答案 C 是正确的，因为 `/boot/grub/device.name` 用于将 Linux 设备名称映射到\
    \ GRUB 命名规范。\n\n例如：\n\n```\n(hd0)->~/dev/sda\n```\n\n错误答案及解释：A、B 和 D。答案 A 是错误的，因为路径\
    \ `/etc` 不包含 `device.map`。答案 B 是错误的，因为目录 `/boot/grub` 不存在。答案 D 是错误的，因为 `/etc/init.d`\
    \ 是包含运行级别脚本的目录。\n\n- 4. 正确答案及解释：C。答案 C 是正确的，因为 Linux 内核位于 `/boot` 目录。\n\n错误答案及解释：A、B\
    \ 和 D。答案 A、B 和 D 是错误的，因为这些目录不存在。\n\n- 5. 正确答案及解释：A。答案 A 是正确的，因为 Linux 引导加载程序位于主引导记录（MBR）中。MBR\
    \ 是引导扇区。系统 BIOS 读取启动设备的第一个扇区。该扇区的大小为 512 字节。对于硬盘驱动，这个特殊扇区被称为 MBR。\n\n错误答案及解释：B、C\
    \ 和 D。答案 B 是错误的，因为 Linux 引导加载程序用于检索 Linux 内核。答案 C 是错误的，因为 `/etc` 是 Linux 内核获取控制权后挂载的文件夹。\n\
