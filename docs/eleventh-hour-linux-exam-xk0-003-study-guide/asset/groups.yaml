- md: '

    # CHAPTER 5 Using BASH


    - apropos and whatis a database created by mandb.

    - The database created by mandb may be handled by makewhatis on some distributions.

    - info is intended as an improved way to manage documentation for the GNU utilities
    and provides information in threaded chunks nodes.


    ## Accessing Kernel and Architecture Information


    Linux uses a virtual file system located at /proc to represent activity within
    the computer, and it allows communication with various kernel and driver components.
    If you compare ps -a with ls /proc, you will notice that every process has its
    own subdirectory under /proc. There are also files for system hardware: cat /proc/cpuinfo
    tells you everything you could want to know about your processor and /proc/version
    knows all the installed version of Linux. A slightly different way to check on
    your installed version is uname -a. Note that /proc/version shows the actual distribution
    name, whereas uname -a will show if you have a 32 or 64 bit process.


    All the settings in /proc/sys directory tree can be adjusted using sysctl. Changes
    are lost when the system reboots, and must be added to /etc/sysctl.conf to make
    them permanent. Use sysctl -p to change the system to reread the sysctl.conf file
    without having to reboot.


    ## Basic Scripting


    A script is a plain text file containing a collection of line programs and options
    that can be run as a group. Each line is read one at a time and interpreted, which
    can make scripts slow. Scripts need to have execute permission unless the sh command
    is used, which makes the sh executable and the script just a parameter.


    A bash script file expects a first line of #!/bin/bash and this script would like
    to be run with the bash shell located in the /bin directory.


    ## Using Shell Features


    The bash shell provides a history feature that remembers commands you have previously
    entered, stored in a hidden file in your home directory: .bash_history and the
    entire list are viewed by typing history. Typing !! will repeat the last command.
    When you type history the command line is preceded by a number; typing <command-number>
    replays the command corresponding to that. Another command line feature is tab
    completion. Bash will try and guess what you are attempting to type using Tab
    key. If you already have enough characters to uniquely identify the next word,
    bash will fill it in for you. If you have not typed enough of a word, a second
    press of the Tab key will display a list of possible matches for you.


    ## SCHEDULING TASKS


    In the following sections, you will learn how to put routine tasks on an automated
    schedule using cron and ad hoc tasks using at.


    ## cron (cron allow, cron deny)


    For the routine tasks that need to be performed on a regular basis or predefined
    intervals, there is a scheduling service cron that lets you put these tasks on
    a schedule of your own design which runs in the background, checking every minute
    to see if there is anything scheduled to run. The /etc/cron.allow file lists the
    ONLY users able to edit cron configuration (crontab) files. If that is empty the
    system looks for /cron.deny file, which lists users barred from editing cron files.
    The root user is not affected by either.


    ## crontab Command Syntax


    crontab files (cron table) tell what to run and when it is stored for users in
    /var/spool/cron, with the crontab name matching the username. administrators''
    files are kept in /etc/crontab, and there is a /etc/cron.d directory that programs
    can use to store their own schedule files.


    crontab files are edited using crontab -e with each line having six or seven fields
    and specifying one command.


    - The first five fields on each line tell which minute, hour, day, month, and
    weekday to run a command.

    - Next users specify whose rights to run the command under.

    - Lastly is the command itself.

    - Valid options for the schedule fields are a * (match anything), exact number,
    two numbers with a dash between them for a range of values, or a list of values
    separated by commas to match each single value.

    - crontab -l displays the contents of your crontab file.

    - crontab -r deletes it.


    ## atq


    If you just want to run something a bit later, use the at command. It accepts
    commands from either a file (-f) or standard input, ending with a <ctrl> d. A
    single Ctrl + d is sufficient if there is nothing on the line. It takes two Ctrl
    + d''s there is more on the line. Use at to see what jobs are queued up, and their
    job numbers. To cancel a job, use at followed by the job number you wanted canceled.


    ## MANAGING SERVICES


    As a system administrator, one of your primary jobs is to manage services running
    on your systems.


    ## Fast Facts


    - Services, daemons, are just programs that start and run in the background and
    provide services for users.


    - Services are started when their assigned runlevel is initiated.

    - Scripts that start each service are in etc/init.d.

    - The scripts can be used manually with parameters of start, stop, restart.


    ## inetd and xinetd


    To conserve resources, smaller and less frequently used network-based services
    bundled together in a super server service, waits in the background until one
    of the services is needed and loads it. This method prevents the service from
    just sitting there taking up memory until it is actually needed. There are two
    super server daemons in Linux - inetd and the newer, "extended" xinetd, which
    has some features and enhanced security. Changing the services managed by inetd
    or xinetd is done by editing the appropriate configuration file (/etc/inetd.conf
    or /etc/xinetd.conf).


    ## chkconfig


    chkconfig is a handy tool to view status of services. It can be used to enable
    or disable services at boot.


    ## SUMMARY OF OBJECTIVES


    In the BASH section, we covered enough to get started, and even touched on some
    of utilities. In the Task Scheduling section, we learned how to run programs automatically
    with cron or at a later time. In the Managing Services section, we learned how
    to start, restart, and stop services.

    '
