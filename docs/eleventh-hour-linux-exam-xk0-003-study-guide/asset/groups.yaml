    \ CD 以及传输音乐和视频等。从高级层面来看，刻录 CD 或 DVD 有两个步骤：\n\n- 1. 为 CD 或 DVD 创建镜像文件，这涉及在介质上创建文件系统并将数据添加到镜像文件中。\n\
    - 2. 将镜像应用到 CD 或 DVD 上。\n\n无论使用何种介质，在介质上创建文件系统之前，任何内容都无法存储。与硬盘不同，CD 或 DVD-R 只能写入一次，这意味着如果你将创建空文件系统作为其中一个步骤，它将永远保持为空状态。刻录\
    \ CD 或 DVD 涉及在传输介质的同时创建文件系统。完成该过程第一部分——创建一个包含文件系统和将传输到介质的实际文件的镜像文件（iso 文件）的命令是\
    \ `mkisofs`。你可以使用以下语法创建典型的 CD 或 DVD：\n\n```\nmkisofs -r o [CD 或 DVD 镜像的 .iso 文件名]\
    \ [要复制文件的目录]\n```\n\n`-r` 选项将 CD 或 DVD 上所有文件的权限设置为可读，并启用 RockRidge 扩展。如果你不使用 `-r`\
    \ 选项，文件将按照它们在原始位置被分配的权限创建。第二步是使用单独程序 `cdrecord` 将镜像应用到 CD 或 DVD 上。以下语法将你的镜像挂载到挂载点：\n\
    \n```\nmount -t iso9660 -o ro, loop=/dev/loop0 [CD 或 DVD 镜像文件名]\n/cdrom\n```\n\
    \n`-t` 选项 `iso9660` 标识镜像文件的文件系统为 CD 或 DVD 系统。一旦挂载了 CD 或 DVD 镜像，你就可以进入 `cdrom`\
    \ 目录（使用 `cd cdrom`）并验证你是否包含了所有想要的文件，以及该目录是否正常。你需要确定你的 CD 或 DVD 刻字机的 SCSI 设备地址。作为\
    \ root 用户，可以使用命令 `cdrecord -scanbus`（替换为正确的设备）并在必要时指定：\n\n```\ncdrecord dev=0,0,0\
    \ [CD 或 DVD 镜像的 .iso 文件名]\n```\n\n## 第 10 章 Linux 的故障排除与维护\n\n## 考试目标摘要\n\nLinux\
    \ 上有许多监控和测量工具，因此没有理由不监控你的系统。`sar` 和 `top` 程序分别产生详细报告，说明你的系统中不同组件在指定间隔和实时情况下的性能情况。你可能需要特别关注计算并显示平均负载的程序：例如\
    \ `top`、`w` 和 `uptime` 等。\n\n虽然监控可以帮助你检查系统的运行情况，但当不可避免的问题发生且情况变得非常糟糕时，你需要知道去哪里寻找信息。有很多日志文件；它们位于\
    \ `/var/log` 目录结构下，了解 `/var/log` 中的各种日志是非常重要的。由于每个日志中记录的数据量巨大，你需要良好的搜索和过滤工具，如\
    \ `grep`、`sed`、`awk` 和 `tail`。\n\n硬性崩溃或用户错误导致的数据丢失是不可避免的。使用 `tar` 和 `dump` 创建备份集，使用\
    \ `tar` 和 `restore` 还原文件，以及使用 `dd` 命令创建磁盘镜像并将其应用到其他介质，均在涵盖范围内。\n\n## 五大最难题\n\n\
    - 1. 你被要求在核心应用程序升级之前备份特定服务器上的用户数据。由于数据量很大，你必须确保这些文件能够存放在远程硬盘中。你会使用哪种命令来确保备份文件的尺寸尽可能小？\n\
    \  A. `tar -cvf userdata.tar /home/*`\n  B. `tar -xjvf userdata.tar /home/*`\n\
