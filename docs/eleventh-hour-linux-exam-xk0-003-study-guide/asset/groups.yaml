    ## RUNLEVELS


    This section introduces the functionality of the init program and the seven runlevels.


    ## The init Command


    The `init` command is responsible for executing runlevels and is the last step
    in the boot process. It will be identified by the process id of 1. It is responsible
    for starting system process defined in the `/etc/inittab` file.


    ## Runlevels


    Runlevels are specialized scripts that define how a computer system starts or
    stops by executing various services or processes of the root administrators and
    user access. The runlevel is changed by having a privileged user run `teleinit`
    or `init`, which sends appropriate signals to `init`.


    Seven different runlevels exist, numbered 0 through 6 although runlevel 4 is not
    often used.


    ![](img/53450e0f522134e838a034ce98470308_35_0.png)


    Knowledge of the runlevels and what each is designed to do is very important and
    the most important are described as follows:


    - 0 terminates all programs and shuts down the system.

    - 1 is for single-user mode; s or S can also be used.

    - 2 is for multiuser mode without network connectivity.

    - 3 is for multiuser mode with network connectivity and starts in command line
    mode.

    - 5 starts runlevel with network connectivity and starts the graphical user interface
    (GUI).

    - 6 reboots the system.


    Most systems set their default runlevels to either 3 or 5.


    To execute runlevels, two types of scripts are located in the `/etc/init.d` directory
    called through symbolic links. The first set of scripts, executed by the `init`
    command, is started during the system''s boot process or whenever you initiate
    the shutdown process. These scripts are contained in the /etc/initab file, as
    shown in Figure 3.4. The default runlevel is located in the /etc/initabb. The
    default runlevel entry looks like the following in the file:


    ```

    id:5:initdefault:

    ```


    For the file presented Figure 3.4, the runlevel is configured to start in multiuser
    mode and provide network connectivity and X support for Windows Managers. The
    file also indicates subdirectory to search for specific services or programs to
    execute. For the default runlevel, /etc/init.d/rc5d is the directory containing
    default services and programs scripts. Each of the runlevel contains scripts that
    are executed when a runlevel is started and stopped. For files containing scripts
    used for stopping a runlevel, the files begin with the capital letter "S". The
    second sets of scripts with "K" are executed whenever the runlevels are changed
    from one runlevel to another. The /etc/init.d/rc file is called to ensure the
    scripts are executed in the proper sequence.


