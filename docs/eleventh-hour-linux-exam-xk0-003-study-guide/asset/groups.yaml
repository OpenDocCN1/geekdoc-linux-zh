    ## DISPLAY MANAGER


    The display manager bundled with KDE is the KDE Display Manager. KDM is very configurable
    from the control center, allows configuring screen color, menu options, styles,
    and on. KDM was originally based on XDM. The main configuration file for KDM is
    often found in /usr/share/kde/config and is called kdmrc. KDM must be run before
    a user is logged in, so it is not associated with any user and user-specific configuration
    files are not possible. Users can however, change the appearance of their desktop
    once they are logged in.


    The graphical login manager within KDM is The Greeting, which can show a company
    logo, current system time, or perhaps nothing. Some or all users may be allowed
    to shutdown the system from this initial screen.


    ## GDM


    GNOME was conceived slightly later than KDE and unlike KDM, this was written entirely
    from scratch and does not contain any original XDM code. Upon startup, the GDM
    daemon reads its local configuration file, gdm.conf. When there is more than one
    local display, each of these forks an Xserver and slave process. The initial process
    will start the display and calls gdm to prompt the user for a user name and password.
    Remote displays are managed using the X Display Manager Protocol, XDMP, typically
    running on port 177.


    The configuration file can be found in the file /etc/gdm/gdm.conf and the syntax
    within the file the standard GNOME syntax. The file contains a large number of
    options for the daemon configuration, security, remote and local GUI. When the
    system is installed, most of these are set up automatically.

