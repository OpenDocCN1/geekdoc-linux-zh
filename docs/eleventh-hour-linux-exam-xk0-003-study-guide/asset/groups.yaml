    Normal users have two similar files that are also called:


    - /home/user/.bash_profile: A personal startup file and is executed when a user
    logs into a system.

    - /home/user/.bashrc: The personal interactive startup file.


    The format for creating and modifying an environment variable within bash (Bourne-again
    shell) is always in the format:


    ```

    NAME=value

    ```


    The setting of a variable only makes this available in that shell. To move the
    variable from the shell to the environment, the export command has been used:


    ```

    export NAME=value

    ```


    This allows programs other than the shell to access this variable (for instance,
    a file editor).


    # PS1


    When a user first logs on, he or she will be greeted by a prompt. The user prompt
    is defined initially in the file /etc/bash.bashrc as the environment variable
    *PS1* and can display a vast array of data.


    Typical variables that are used:


    | variable | Description |

    | :--- | :--- |

    | d | Date in "Wed Sep 09" format |

    | h | First part of the host name |

    | u | Username |

    | t | Time in 24-h format |


    # PS2


    The *PS2* variable is very similar to the *PS1* variable except that it is displayed
    when the user enters an incomplete command and the system will wait for the user
    to complete the command and press **Enter** again. This default prompt is the
    > sign and can be changed by altering the *PS2* variable.


    # PATH


    The *PATH* variable is used by commands to locate a specific command or application.
    When you enter a command, the shell looks in each of the directories specified
    in the PATH command. The *PATH* variable contains the list of directories separated
    by a colon, such as `/bin:/usr/bin:/usr/local/bin`.


    You can use a number of Linux commands to obtain information about the hardware
    installed in the system. These commands can display a wealth of information in
    order to enable you to debug any issues.


    - lsusb displays USB information.

    - lspci displays information on Peripheral Component Interconnect (PCI) devices.

    - lsmod extracts and displays information on loaded modules.

    - /sys contains files related to the kernel.

    - /proc facilitates communications between the kernel and the user processes.


    # lsusb


    lsusb lists all the USB buses on a system and displays information about any devices
    attached to them. The -v option gives verbose output.


    ```

    $ lsusb

    Bus 004 Device 001: ID 1db6:0001 Linux Foundation 1.1 root hub

    Bus 003 Device 001: ID 1db6:0001 Linux Foundation 1.1 root hub

    Bus 002 Device 001: ID 1db6:0001 Linux Foundation 1.1 root hub

    Bus 001 Device 005: ID 0204:6025 Chipbank Microelectronics Co., Ltd CBM2080 Flash
    driver controller

    Bus 001 Device 003: ID 04d6:c517 Logitech, Inc. LX710 Cordless Desktop Laser

    Bus 001 Device 002: ID 413c:0058 Dell Computer Corp. Replicator

    Bus 001 Device 001: ID 1db6:0002 Linux Foundation 2.0 root hub

    ```


    # lspci


    The lspci command displays all the information regarding the PCI buses in the
    system and all the devices that are attached to it. This command can also be used
    with the -x option to display the initial 64 bytes of PCI configuration to see
    what is loaded.


    ```

    $ lspci -x

    00:00.0 Host bridge: Intel Corporation 82855PM Processor to I/O Controller (rev
    03)

    00: 86 80 40 33 06 01 90 20 03 00 00 06 00 00 00 00

    10: 08 00 00 e0 00 00 00 00 00 00 00 00 00 00 00 00

    20: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    30: 00 00 00 00 e4 00 00 00 00 00 00 00 00 00 00 00

    00:01.0 PCI bridge: Intel Corporation 82855PM Processor to AGP Controller (rev
    03)

    00: 86 80 41 33 07 01 a0 00 03 00 04 06 20 01 00

    10: 00 00 00 00 00 00 00 00 01 21 20 c0 c0 22

    20: 00 fc f0 fd 00 e8 f0 ef 00 00 00 00 00 00 00

    30: 00 00 00 00 00 00 00 00 00 00 00 00 0c 00

    ```


    Also, the -b command can be used to display the interrupt request line (IRQ) addresses
    as seen by the individual cards.


    ```

    $ lspci -b

    00:00.0 Host bridge: Intel Corporation 82855PM Processor to I/O Controller (rev
    03)

    00:01.0 PCI bridge: Intel Corporation 82855PM Processor to AGP Controller (rev
    03)

    00:1d.0 USB Controller: Intel Corporation 82801DB/DBL/DBM (ICH4/

    ICH4-L/ICH4-M) USB UHCI Controller #1 (rev 01)

    ```


    # lsmod


    The lsmod command extracts all the information about loaded modules, derived from
    /proc/modules file, and displays it as shown below:


    ```

    $ lsmod

    Module Size Used by

    ls_iso8859_1 3768 1

    ls_cp437 5432 1

    vfat 9764 1

    fat 46376 1 vfat

    usb_storage 86620 1

    ip6t_LOG 6212 7

    ```


    # /sys


    The /sys directory contains all the files related to the kernel, firmware, and
    other system-related files. There are a number of directories under /sys to ensure
    that it is a well-known structure. The overall structure can be seen using the
    ls command.


    ```

    $ ls -l /sys

    total 0

    drwxr-xr-x 2 root root 2009-05-23 10:53 block

    drwxr-xr-x 16 root root 2009-05-23 08:47 bus

    drwxr-xr-x 2 root root 2009-05-23 10:53 class

    drwxr-xr-x 16 root root 2009-05-23 08:47 dev

    drwxr-xr-x 2 root root 2009-05-23 10:53 firmware

    drwxr-xr-x 16 root root 2009-05-23 08:47 kernel

    drwxr-xr-x 2 root root 2009-05-23 10:53 module

    drwxr-xr-x 16 root root 2009-05-23 08:47 power

    ```


    The /proc filesystem facilitates communication between the kernel and the user
    processes. The /proc filesystem is a virtual filesystem that provides an interface
    to kernel data structures. The /proc directory contains a number of files and
    directories that represent information about the running system. Virtual files
    can be read from or written to /proc. There are a number of files in /proc, which
    provide information about the kernel and user processes.

