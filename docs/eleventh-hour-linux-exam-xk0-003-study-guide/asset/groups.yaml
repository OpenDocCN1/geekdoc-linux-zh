    ## CHAPTER 2 Managing Filesystems


    The showmount command can be used to determine information about the shared directories
    (exports) on a server and will list all exports currently shared listed in the
    /etc/exports file, if they are currently being shared on the server. The showmount
    command syntax is showmount [options] [server1].


    The default value for server1 is the value returned by the hostname. With no options,
    showmount shows the clients that have mounted directories from the host. Some
    of the available options are shown in Table 2.4.


    To establish a connection to the server, the client can use the mount command.
    The following demonstrates how the client can establish an NFS connection:


    ```

    mount server1:share /mount_point

    ```


    This makes accessible all the files underneath the directory /share on the server1
    by changing to the /mount_point directory. An automatic mounted connection to
    the NFS share is established at boot time by inserting a line to the /etc/fstab
    file.


    ## Swap


    Linux requires virtual memory to ensure its successful performance, which can
    exist as a file or an entire partition for storage. Virtual memory is accomplished
    by dividing the system''s physical RAM into units known as pages and transferring
    less used physical units of RAM (pages) to the hard disk drive using a process
    known as swapping. When the system swaps out pages of memory to the hard disk
    drive, the system''s RAM is freed to perform additional functions.


    Although swapping offers advantages by extending its access to more memory, pages
    stored and retrieved on the hard disk drive are accessed slower than pages that
    only resided in physical memory (RAM). For the Linux system to use swap space,
    a special file or swap partition must be created first. The creation of a swap
    file entails the creation of a special file, which must be designated to function
    as a swap file and is created with the dd command. Here is an example of the creation
    of empty swap.


    ```

    dd if=/dev/zero of=newfile bs=1024 count=1048576

    ```


    | Table 2.4 Showmount Options | |

    |---|---|

    | Showmount Option | Purpose |

    | -a, --all | Uses the format hostname:directory, where hostname is the name of
    the client and directory is the mounted directory |

    | -d, --directories | List client mounted directories |

    | -e, --exports | Prints the servers list of exported filesystems |

    | -h, --help | Provides help summary |


    The command creates a swap file named newswapfile. The input file /dev/zero is
    a special Linux file that provides null characters. The newly created swap file
    is 1 GB in size.


    To designate a partition or special file to be used as swap space, the mkswap
    command. This command sets up a swap area on a partition or special file. The
    following commands prepare first a partition and then a special file as a swap
    file:


    ```

    mkswap /dev/hdb1

    mkswap /newswapfile

    ```


    The swapon command is used to designate the specific devices or files on which
    paging and swapping is to take place. For the partition, you would need to prepare
    it using the swapon command as root:

    swap/dev/hdb1


    To disable or turn off the swap files or swap partitions, the swapoff command
    disables swapping on the specified partition or file. When the -a flag is used,
    swapping is disabled on all known swap devices and file. The swapoff -s command
    will display the current status.


    ## SUMMARY OF EXAM OBJECTIVES


    Linux filesystems provide the operating system with a framework for the storage,
    organization, removal, and retrieval of digital information. Filesystems are responsible
    for organizing and maintaining files, folders, metadata, and residual data as
    containers for storing digital information. In addition, you learned that different
    filesystem types are available for local and network access (for example, SMB
    and NFS).


    You learned about the mounting and unmounting of filesystems using the mount command.
    Automatically files systems are defined in the /etc/fstab file. After creating
    a partition, a filesystem must be assigned to the partition. The Linux mkfs command
    assigns filesystem to the partition. The Linux filesystem is a hierarchical structure
    used to organize directories (folders) and files and is based on the FHS. Filesystem
    management described the tools needed to manage local and remote filesystems.
    To determine the amount of disk space used and remaining (for example, du and
    df) and the various commands for implementing and managing disk space limitations
    for users (for example, edquota, quotacheck, and repquota) were discussed. Additionally,
    the repairing of corrupted filesystems using fsck command, the mounting of unique
    loopback filesystems, the accessing of NFS filesystems, and the preparation of
    swap files or partitions using the Linux commands mkswap, swapon, swapoff, and
    swapinfo were described.


    ## TOP FIVE TOUGHEST QUESTIONS


    - 1. You need to use fdisk to establish a partition for a new SCSI disk drive
    you want to add for extra storage space. The original drives are all IDE drives.
    Which is the correct syntax?

    A. `fdisk /dev/SCSI1`

    B. `fdisk /dev/IDE`

    C. `fdisk /dev/sda`

    D. `fdisk /dev/sdb`


    - 2. Which file, when the system initially starts, will automatically mount filesystems?

    A. `/etc/fstab`

    B. `/boot/fstab`

    C. `/dev/devices.map`

    D. `/etc/grub.conf`


    - 3. What is an ISO loopback device?

    A. The transformation of special file into a virtual Linux filesystem

    B. A device that returns feedback tests to the monitor

    C. The /null driver device

    D. The IP address 127.0.0.1


    - 4. Which Linux command is used to designate the specific devices or files on
    which paging and swapping is to take place?

    A. `/swap`

    B. `swap`

    C. `swapon`

    D. GRUB


    - 5. What is the purpose of the Linux export command?

    A. To function as the Linux bootloader

    B. To partition a storage device

    C. To designate a specific file or partition for swapping

    D. To activate the share of shared directories


