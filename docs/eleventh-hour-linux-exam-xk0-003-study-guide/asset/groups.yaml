    # FTP


    The FTP server is used to upload and download files to a server from an FTP client.

    An FTP server that allows anyone to connect to it is called an anonymous server.


    # Fast Facts


    FTP servers can be set up in active mode or passive mode.


    +   - In active mode, clients connect from a random port P > greater than 1023
    to the port 21 on the server.

    - Clients listen on port P+1 and send this information to the server using PORT
    P+1.

    - The server will then connect to the P+1 port from its data port, port 20.

    - Ports P and P+1 will be open on the client, and ports 20 and 21 will be open
    on the server.

    - In passive mode, the client initiates both connections, opening ports P and
    P+1 (P > 1023).

    - Port P connects to port 21 and then uses PASV to get the server to open a port
    above 1023, say S, and transmits this to the client using PORT S.

    - The client connects to this port S.


    An FTP server can restrict the local usernames that can be used, for example,
    root. This is achieved by putting the list of users in /etc/ftpdusers, and this
    list of names must also appear in /etc/passwd. /etc/ftchproot is in a similar
    format to /etc/ftpdusers and contains the list of users whose root directory needs
    to be changed, often listed in /etc/ftpd.conf, to ensure that the user cannot
    traverse into an unauthorized area.


    # Squid


    Squid can be configured to cache HTTP and FTP traffic to reduce the amount of
    traffic destined for the Internet. Web clients are configured to access the Internet
    through this cache.


    # Fast Facts


    Squid is a proxy server and Web caching service. It has many uses, namely:


    +   - Caching lookups for the network

    - Additional security for Web access

    - Speeding up a Web server through caching of repeated requests.'
