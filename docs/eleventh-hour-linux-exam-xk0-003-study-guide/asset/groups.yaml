    ## 第 2 章 管理文件系统


    | 表 2.2 Linux 目录与分区 |

    | Linux 目录 | 独立分区的用处 |

    |---|---|

    | /swap | /swap 目录被用作交换空间，并充当虚拟内存。此目录为您的系统提供额外的内存以运行大型程序。 |

    | /boot | /boot 目录包含 Linux 启动过程中需要的文件和配置。在不同的分区下实现 /boot 可以使系统救援和修复变得更加容易。 |

    | /home | /home 目录通常存放用户的账户目录和用户特定文件。此目录应被分配一个独立分区，因为多用户可能会可能会填满分区。此外，如果更改用户文件存储在独立的分区上，执行备份和恢复功能将简单得多。
    |

    | /tmp | /tmp 目录用于支持需要易失性临时文件空间的程序。它可以存在于根目录下，但如果临时文件的增长速度快于您的根目录，它们可能会耗尽磁盘空间，可能是由系统转储或核心转储引起的。
    |

    | /var | /var 目录包含由于打印、日志记录和系统临时文件生成的系统和应用程序信息。如果可能，/var 目录应该放在独立分区上。它通常是根目录下的子目录。应该将其分离的主要原因是日志文件和用户邮箱可能存在的增长。
    |


    ## 目录


    本节的目的是提供关键目录的概述，如表 2.3 所示。作为一个分级树形结构，文件系统的顶端由正斜杠指示的目录称为根目录，它包含了所有的底层文件和目录。


    Linux 文件系统可以被视为：


    - 一种组织文件和目录的分级结构

    - 一个基于文件系统层次结构标准 (FHS) 的目录结构

    - 排序一致（由于 FHS），以便用户和应用程序能够轻松地找到文件和目录


    |


    ## 表 2.3 关键 Linux 目录


    | Linux 目录 | 用途 |

    |---|---|

    | / | 根目录是顶层目录，是 Linux 系统中最重要的目录。它包含了核心目录和文件，包括初始化 Linux 系统所需的实用程序、配置文件、引导加载程序信息和启动信息。
    |

    | /bin | 包含系统管理员和用户使用的 Linux 命令，这些命令在系统处于单用户模式时也是可以访问的。 |

    | /dev | 在 Linux 环境中用于挂载设备。 |

    | /etc | 用于控制程序执行并支持动态 Linux 环境的 /etc 目录。它包含了系统和应用程序配置文件。 |

    | /media | 用于为系统管理员和用户挂载可移动介质（例如软磁盘、CD/DVD 驱动器和 USB 闪盘）。 |

    | /mnt | 与 /media 目录类似，用于临时挂载文件系统。 |

    | /proc | 作为系统进程和 Linux 内核的虚拟文件系统运行。 |

    | /root | 根目录（不要与根目录 / 混淆）是分配给 root 用户账户的家目录。 |

    | /sbin | 用于包含仅供系统管理员（即 root）使用的 Linux 实用程序。它包含了用于关键启动、恢复、故障恢复和/或修复 Linux 系统的可执行文件。
    |

    | /usr/bin | 包含系统上的主要可执行命令。Linux 用户和 root 用户可以执行此目录中的命令。 |

    | /usr/lib | 包含程序所需的软件库和包，包括特定平台的对象文件和内部二进制文件。 |

    | /usr/lib64 | 执行与 /usr/lib 目录相同的功能，但支持 64 位架构。 |

    | /usr/local | 本地安装应用程序的位置。安装在此目录中的软件通常不受系统软件更新的影响。此外，安装在此目录中的软件是可以共享的。 |

    | /usr/share | 用于存储只读的架构中性文件。此目录包含的文件是平台无关的。 |

    | /var/log | 包含由于打印、日志记录和系统临时文件生成的数据文件 |


    ## 第 2 章 管理文件系统


    在处理所有其他二级目录和文件时，使用全路径命名规范，所有后续文件和文件夹都通过正斜杠指示其分级位置，以防止与其他具有相同名称但位于不同子层级（例如第三级和第四级）的目录混淆。


    ## 文件系统管理


    有工具可以本地或远程管理文件系统，这些工具将被所有系统管理员使用，通常每天或每周使用一次。


    ## 快速上手知识


    你为了考试需要学习并可能经常使用的文件系统工具：


    - du 提供当前目录中每个文件使用的磁盘空间摘要，以及任何子目录下包含的文件分配的磁盘空间摘要。

    - df 通过不同的参数，以多种方式提供文件系统可用磁盘数量的摘要。

    - df -i 显示关于 inode 而非文件块的信息。

    - df -h 使用易于理解的输出（以千字节、兆字节和/或吉字节为单位）呈现磁盘空间摘要。

    - 文件系统需要维护，并并在必要时使用 fsck 命令进行检查和修复。

    - 在运行 fsck 之前，需要卸载文件系统。


    ## 配额


    用户和出错错误的应用程序在没有限制的情况下，可以继续向文件夹添加数据，最终会用尽分区上所有的可用磁盘空间。一旦分区被数据填满，用户和应用程序不仅无法将信息保存到磁盘，还可能导致系统或应用程序文件的损坏。磁盘配额的实施可以提供宝贵的文件系统管理支持，允许您限制存储。


    要实现磁盘配额，必须在 /etc/fstab 文件中为每个的文件系统添加 "usrquota" 和 "grpquota" 限定符并重启系统。最后，使用 edquota
    命令（配额编辑器）来显示和更改用户或组的配额设置。


    ## 文件系统管理


    在实施配额后，可以使用 repquota 命令获取文件系统的磁盘配额报告。在系统崩溃或其他文件系统故障时，使用 quotacheck 命令扫描文件系统的配额使用情况并在必要时创建。


    ## 回环设备


    Linux 支持回环设备，它可以将包含文件系统镜像的特殊文件转换为像分区一样的设备。回环设备通常用于 CD/DVD ISO 镜像。创建的磁盘包含 UDF 或
    ISO960 文件系统格式。在访问回环设备之前，必须下载并挂载镜像。使用 Linux mount 命令附加虚拟文件系统。


    ## NFS


    NFS 是一种客户端/服务器模型，旨在为网络上的部分或所有客户端提供特定的目录。服务器端必须配置共享目录（称为导出），客户端必须配置挂载导出。通过 /etc/exports
    文件提供的共享。该文件包含了挂载导出的客户端机器列表。每行代表一个共享目录及其关联选项。


    每行的参数如下：


    exported_directory <client> <options> <clientN> (<options>)


    - exported_directory 是服务器上的导出目录。

    - <client1> 是共享访问的主机或网络。client1 参数可以基于互联网协议 (IP) 地址、主机或名称用于单个主机；通配符 (*) 用于了一组机器；或
    IP 范围。

    - <options> 是施加在连接上的选项，包括只读 (ro)、读写 (rw)、root_squash（防止移除 root 权限）、no_squashing（允许移除
    root 权限）等。


    为了激活共享目录（导出）的访问，可以使用 exports 命令。这组参数可以配合以下命令使用：


    - a 加载并导出 /etc/exports 文件列出的所有目录

    - r 在对共享权限进行更改后重新读取 /etc/exports 文件

    - i 忽略 /etc/exports 文件并对未在文件中列出的目录进行导出

    - u 移除（取消设置）当前列出的导出目录

    - au 移除所有导出目录


    '
