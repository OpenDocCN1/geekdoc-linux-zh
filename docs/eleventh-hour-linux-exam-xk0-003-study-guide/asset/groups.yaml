    ## CHAPTER 10 Troubleshooting and Maintaining Linux


    | Table 10.1 Syslog Event Levels |

    | Level | Description |

    | --- | --- |

    | Emerg | Panic situations |

    | Alert | Urgent situations |

    | Crit | Critical conditions |

    | Err | Other error conditions |

    | Warning | Warning messages |

    | Notice | Thing that might merit investigation |

    | Info | Informational messages |

    | Debug | For debugging only |


    System events are categorized into eight event levels, listed in Table 10.1, and
    can be produced by one of 21 predefined facilities or system programs.


    ## Crunch Time


    The following log files and their usage are very important for the exam.


    - /var/log/messages: It is the standard location for most system events. All info,
    notice, and warning messages are sent by default, along with some authorization
    and cron events.

    - /var/log/syslog: It collects information about authorization events, time changes,
    and system statistics events if you installed the sysstat package.

    - /var/log/mail: It is the events related to the mail service.

    - /var/log/secure: It is used by Red Hat-based distributions to record authorization
    messages for ssh, sudo, and other authorization events.

    - /var/log/lastlog: It is the information about user login times and is a binary
    file. lastlog file to show the last time a user has logged in to the system.


    ## Rotating Logs


    Over time, log files keep growing and would eventually fill whatever hard drive
    they are written to, so it is important to implement a log management scheme.
    The standard program for rotating log files is logrotate, and by default, it runs
    daily by the cron schedule. It can be set to rotate, compress, remove, and/or
    log files based on specified times. The /etc/logrotate.conf file contains the
    options used by logrotate.


    ## Searching and Interpreting Log Files


    Most log files are simple text with valuable data that can be read with your favorite
    paging application, such as less. If you are searching for a specific type of
    event or troubleshooting a particular issue, all the other events will simply
    be cluttered and get in the way.


    ## Fast Facts


    There are a number of useful commands to search log files.


    - The output of a command can be piped into `grep` and used to filter what shows
    up on the screen, or you can feed files directly into `grep`. The syntax is `grep
    [options] PATTERN [file]`. When used, `grep` will search the named file (or standard
    input) for lines that match the `PATTERN` and prints any matching lines. The number
    of options available is large, and expressions can be used.

    - tail shows the 10 lines of text in a file, or with the `-n NUM` option, it shows
    the last NUM lines. The `-f` option, for follow, refreshes the screen with new
    information as the log file updates. It may be convenient to open a separate terminal
    window for running `tail -f`.

    - The awk utility is a programming language specialized for text and string functions.
    The general syntax is `awk [options] -f script-file filename`. If the filename
    is left off, `awk` uses STDIN. `awk` is much more flexible than grep.

    - sed is a stream editor, intended to edit files using scripts, and is useful
    for doing bulk search and replace functions within multiple files and acts on
    one line at a time. The syntax is `sed [options] -f script_file filename`.


    ## BACKING UP AND RESTORING


    Backups can be done at different levels. Level backups run at the operating level
    and are convenient for dealing with individual files, but they require a working
    operating system to restore. Some online backup uses the database or e-mail system
    to read each record or mailbox and make a copy. An offline backup requires the
    system that manages the database or the e-mail system to be shut down. It is also
    possible to do an offline backup of entire drive systems and computers themselves
    by booting from an alternate device.


    ## Fast Facts


    There are two general kinds of backups – complete backups and partial backups.


    - Complete backups back up all the data you have selected.

    - Partial backups back up only the data that has changed since the most recent
    complete backup.

    - Partial backups are divided into differential and incremental.

    - Differential backups contain everything that has changed since the last complete
    backup.

    - Incremental backups copy everything that has changed since the last backup.

    - To restore data from incremental backups, you need the last complete backup
    and all the incremental backups.


    ## Copying Data


    File-level copies of data over a network can be done using rsync and FTP. By copying
    over a network, it is possible to easily send your backups to off-site locations,
    although bandwidth may become an issue.


    ## RSYNC


    rsync doesn''t just copy data, but it synchronizes the data, if you use rsync
    on a directory, the other will be made to an exact duplicate of the original.
    It can read data in blocks and only copy the portion of files that have changed,
    called delta-transfer, which means it won''t copy an entire file if a small part
    of it has been modified. rsync can be run using a remote shell or as a service,
    using its Transmission Control Protocol (TCP) socket and transport system.


    The basic sync for moving files using rsync is shown in Table 10.2.


    ## FTP


    Another common way to transfer files is by using FTP and can be used for backups.
    FTP requires both a client and a server that the client connects to and was discussed
    in more depth in Chapter 8, “Installing, Configuring as a Server.”


    | File Operation | rsync Command Syntax |

    | --- | --- |

    | Copy files locally from one directory to another | rsync [OPTIONS...] SRC...
    [DEST] |

    | Pull files via remote shell | rsync [OPTIONS...] [USER@]HOST:SRC... [DEST] |

    | Push files via remote shell | rsync [OPTIONS...] SRC... [USER@]HOST:DEST |

    | Pull files via rsync daemon | rsync [OPTIONS...] [USER@]HOST::SRC... [DEST]
    |

    | Push files via rsync daemon | rsync [OPTIONS...] SRC... [USER@]HOST::DEST |


    ## Archiving and Restoring Commands


    The following commands are standard utilities for backing up data; each having
    their own strengths and weaknesses.


    ### CPIO


    The cpio program uses binary archive files. It has three basic modes:


    - copy-out mode creates an archive.

    - copy-in mode reads files from an archive.

    - copy-pass mode transfers files from place to another without creating the actually
    archive as a middle step.


    In copy-out mode, cpio accepts a list of files that you want to put into an archive.
    In copy-in mode, cpio reads files from an archive. In copy-pass mode transfers
    files from place to another without creating the actually archive as a middle
    step.


    ### TAR


    tar is used to create archives and extract files. The following is the syntax
    for creating a tarfile:

    ```

    tar cf archive_file [files]

    ```


    The most used options for tar are listed in Table 10.3.


    | Option | Description |

    | --- | --- |

    | -A, --append | Append files to archive |

    | -c, --create | Create a new archive |

    | -d, --diff | Find differences between archive and filesystem |

    | --delete | Delete from archive |

    | -r, --append | Append files to the end of archive |

    | -t, --list | List the contents of archive |

    | -u, --update | Only append files that are newer than archive |

    | -x, --extract | Extract files from archive |


    ### DUMP


    dump can archive entire filesystems and works by examining files on a target filesystem
    and determining the files that need to be backed up. These files are copied to
    the backup medium, usually hard disk or tape, and if the dump is larger than the
    backup medium, the dump is split and copied to multiple volumes. The following
    is the basic syntax for dump:

    ```

    dump -0 -A [archive file] -f [destination file or device]

    ```


    ### RESTORE


    restore performs a restore of files that have been backed up by dump and can be
    used to restore a full backup of a filesystem and apply any subsequent incremental
    backups. restore can be used to restore individual files or directories across
    a full or partial backup archive file and operate across a network to restore
    filesystems and directories on remote systems.


    The following is the basic syntax for restore that will restore all files from
    the identified archive in the current directory:

    ```

    restore rf archive_file

    ```


    ### DD


    dd is useful for making and copying disk images, backing up and moving disks,
    and duplicating filesystems, as it makes an exact clone of a hard disk, including
    all blank space. To use it, the source disk must be unmounted and the output destination
    must be at least as large as the source.

