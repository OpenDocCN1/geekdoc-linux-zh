    - %nice 花在低优先级运行的用户应用程序上的 CPU 时间百分比

    - %system 系统使用的处理器部分比例

    - %iowait 当挂载到系统的驱动器忙碌时处理器空闲的时间百分比

    - %idle 空闲时间

    - %ps (每秒传输数) 每次传输被视为一次数据请求

    - %blk_read/s 每秒读取的块数

    - %blk_write/s 每秒写入的块数

    - %steal 与虚拟化系统相关


    # NICE


    进程有一个于 –20 到 19 之间的优先级值，称为 niceness（谦值）。值越低，运行越快，且 niceness 会从父进程继承。进程的所有者可以使其变慢以释放资源，而只有系统管理员可以使其变快。调整文件的
    niceness 有两种方法：nice 和 renice。要用调整后的 niceness 启动进程，请输入：nice -n 10 find/-name my_file。一旦进程运行，可以使用
    root 权限通过 renice 将其重置为特定值，如下：[img/53450e0f522134e838a034ce98470308_70_0.png] 图
    5.3 iostat 示例


    # 利用 I/O 重定向


    有许多小而实用的工具，I/O 重定向是让这些程序结合的胶水，你可以将一个程序的输出重定向到另一个程序的输入。重定向的常见用法见 5.5。警告：使用 > 要小心，它会覆盖文件；使用
    >> 则追加到文件末尾。


    | 表 5.5 | 三种通信流 |

    | 名称 | 数字 | 符号 |

    |---|---|---|

    | STDIN | 0 | < |

    | STDOUT | 1 | > |

    | STDERR | 2 | 2 |


    | 表 5.6 | 重定向的常见用法 |

    | 命令 | 结果 |

    |---|---|

    | command > file | 输出重定向到文件或设备 |

    | command < file | 输入来自文件或设备 |

    | command &> file | 输出和错误流都重定向到文件 |

    | command 2>&1 | 将标准错误重定向到标准输出 |

    | command | another_command | 将一个程序的输出发送到另一个程序的输入 |

    | ls -al | tee file | tee 复制流并将一份发送到显示，另一份发送到文件 |


    # BASH 命令


    某些命令一次只能接受一定数量的输入，解决方法是使用 xargs，它会将输入流分成块并反复运行下游命令。以下示例将 Bob 的所有音乐文件移动到音乐目录：


    ```bash

    find -name "*.mp3" -u bob | xargs -i mov {} ./_music

    ```


    如果你在两个命令之间放置 ";"，它们将顺序执行：


    ```bash

    do_this_first; then_do_this; and_final_this

    ```


    "==" 用于比较两个变量的等效性，通常用于脚本。


    # 特殊设备


    /dev/null 文件通常被称为“黑洞”，通常用于隐藏脚本中程序不必要的输出。dev/random 是系统随机数生成器的接口，它通过来自各种设备的噪声产生随机数来创建加密密钥，维护一个“熵池”来生成数字。可以使用伪随机数的应用程序可以使用
    /dev/urandom。dev/zero 文件向其发送数据时类似于 /dev/null，但你可以将其作为输入流创建零填充。


    # 使用系统文档


    Linux 提供了许多方法获取所有命令的附加信息。最快速、最基本的帮助来自任何给定命令的帮助选项——通常 -t 和 -help 都有效。


    > 考试 记住在参加 Linux+ 考试时，你必须了解 Linux 文档系统，但遗憾你无法访问它们。


    '
