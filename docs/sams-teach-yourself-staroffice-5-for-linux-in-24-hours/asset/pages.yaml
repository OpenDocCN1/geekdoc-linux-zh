  md: 'To start a slide show do any of the following:


    +   - Choose the slide show icon on the right edge of the StarOffice window.

    - Select Slide Show from the Presentation menu.

    - Press Ctrl+F2 (this might not work within some window managers, however).


    After a few seconds, the first slide appears full-screen (see Figure 21.23).


    # Figure 21.23


    The slide show appears full-screen, enabling you to advance the slides with the
    mouse or keyboard.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_432_0.png)


    You might notice a menu item called Display quality below the Slide show item
    on the View menu. This item only affects how the slides appear during editing.
    (A lower quality setting can improve system performance if you have graphic images
    in your slides.) The slide show is always presented in full color.


    You can control the slide show using the mouse or keyboard, depending on the settings
    that you selected in the Slide Show dialog box. For example, if you''ve deselected
    Change slides on mouse click, none of the mouse events listed in the table that
    follows will function.


    Table 21.1 describes how to interact with the slide show while it is running.'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# TABLE 21.1 SLIDE SHOW INTERACTION VIA MOUSE OR KEYBOARD


    | Action | How to do it |

    | Advance to the next slide | Mouse: Click the left mouse button once. Keyboard:
    Press spacebar, the Enter key, or the right arrow key. |

    | Return to the previous slide | Mouse: Click the right mouse button once. Keyboard:
    Press the left arrow key. |

    | Go to the first slide | Press the Home key. |

    | Go to the last slide | Press the End key. |

    | End the slide show | Press the Esc key. |


    > Some people have a habit of double-clicking on everything. Double-clicking during
    a slide advances two slides. If you happen to make this mistake, click the right
    button once to back up, and then click the left button once to advance the slide
    when you''re ready.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_433_0.png)


    # Preparing Hardcopy Slides


    For many presentations, you''ll want to have paper handouts of your slides for
    your audience. StarOffice has several options for how those handouts can be printed.
    The following section describes how to set up and print the handouts that you
    need.


    # Setting the Page Size


    The default size size for a presentation is the computer monitor. When you print
    the slides to paper, you need to select the correct paper size to which you want
    to print.

    To set the page size, follow these steps:


    +   1. Choose Page from the Format menu. The Page dialog box appears. (See Figure
    21.24.)

    2. From the Paper format drop-down list, select 8.5 x 11 in.

    3. Choose the Landscape option to print slides or handouts. Choose the Portrait
    option to print Speaker Notes or a presentation outline.

    4. Choose OK to apply these settings and close the dialog box.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# Formatting and Giving Your Presentation


    # FIGURE 21.24


    In the Page dialog box, you can set up margins and paper size to print your presentation.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_434_0.png)


    # Defining Printing Options


    To print a presentation, choose the Print item from the File menu. The Print dialog
    box appears (see Figure 21.25).


    # FIGURE 21.25


    The Print dialog box is used to print a paper copy of your presentation. First,
    however, choose Options... to select what to print.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_434_1.png)'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# 414 Hour 21


    The presentation printing options are linked to this standard printing dialog
    box. You can access them by choosing the Options... button. The Printer Options
    dialog box appears, and you can select how and what to print. (See Figure 21.26).


    # FIGURE 21.26


    Select what to print and which other printing options to apply in the Printer
    Options dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_435_0.png)


    The Printer Options dialog box can also be viewed as the Printing tab in the Presentation
    Options dialog box.


    In the Contents area of the Printer Options dialog box, you can choose what you
    want to print. The four options correspond to the four Master Views that you can
    use while preparing your slides. They are


    +   Drawing—Print one slide per page. This page is suitable for copying onto transparencies
    for an overhead projector.


    +   Notes—Print one slide on the top half of a page with the speaker notes on
    the bottom half.


    +   Handouts—Print four slides per page for handouts to your audience.


    +   Outline—Print the text of the slides without formatting it into slides. The
