    - Outline View

    - Notes View

    - Start Slide Show

    - Drawing View

    - Slide View

    - Handout View


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_417_0.png)


    # Rearranging Slides Using the Slide Sorter


    The Slide Sort view is ideal for rearranging slides after you''ve created a presentation.
    With the Slide Sort view, you can work with all the slides at once, seeing how
    they relate to each other in the presentation.


    > While working with slides in the Slide Sort view, you can double-click on any
    slide to switch to the most recently used full-screen view of slide (Drawing,
    Notes, or Handouts view is used, depending on what you were viewing before selecting
    Slide Sort view).


    To select a slide in the Slide Sort view, click on it once. You''ll see a heavy
    black outline around the slide to indicate that it''s selected.


    # Moving Slides


    The most useful feature of the Slide Sort view is the way it enables you to move
    slides around.


    Suppose you have a presentation with many slides and you decide to move a slide
    to another position in the presentation.


    While the Slide Sort view, you can move the slide by clicking, dragging, and dropping
    the slide in a new location. As you drag the slide, an outline of the slide moves
    around the screen and a bar appears between the two slides where the slide you
    are dragging will be inserted when you release the mouse button (see Figure 21.11).'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# Formatting and Giving Your Presentation


    # FIGURE 21.11


    Moving slides in the Slide Sort view is guided by the slide outline and insertion
    bar.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_418_0.png)


    # Copying and Pasting Slides


    In Hour 19, "Creating Presentations with Starlimpress," you learned how to insert
    slides into your presentation using the Slide..., item in the Insert menu.


    You can''t directly insert slides in the Slide Sort view, but you can easily copy
    and paste slides. Using copy and paste enables you to duplicate a slide and make
    modifications to it, saving time when the slides are similar in layout or content.


    To copy and paste a slide in the Slide Sort view, follow these steps:


    +   - Click on the slide that you want to copy to select it.

    - Press Ctrl+C to copy the selected slide.

    - Press Ctrl+V to paste the selected slide.


    > You can use the Cut, Copy, and Paste items from the Edit menu. The keyboard
    shortcuts are used to show how quickly you can work with slides in the Slide Sort
    view.


    After you have used Paste to insert a copy of a slide, you can drag that slide
    to a new location if necessary.'
  merge: -1
  pgno: 418
- img_proc: true
  md: '398


    # # Deleting Slides


    As with moving and copying slides, deleting slides is best done in the Slide Sort
    view because the slide sorter enables you to see how the entire presentation is
    affected by the deletion of a slide. As the other slides fill in the space of
    a deleted slide, you can see how the topics flow and the presentation improves
    (hopefully).


    To delete a slide in Slide Sort view, follow these steps:


    +   1. To select the slide that you want to copy, click on it.

    2. Press Ctrl+X to cut the slide from the presentation. Other slides move in to
    fill its place.


    > You can also use the Delete key or the Cut item from the Edit menu to delete
    a slide in the Slide Sort view.


    > If you realize you''ve made a mistake after deleting a slide, choose Undo from
    the Edit menu.


    # # Defining Transitions Between Slides


    Transitions are the visual movement from one slide to the next in your presentation.
    The transitions between slides can add or take away from the effect that you are
    trying to create.


    For example, you can add to the excitement of a sales team presentation with varied
    and interesting transitions, or you can damage your image of professionalism by
    using wild transitions with strange sounds during a presentation to a key client.


    StarOffice provides dozens of slide transitions from which you can select. The
    Slide Sort view is used to apply transitions to slides. You can use other views
    if you prefer, but with the Slide Sort view you can set all the transitions at
    once and see that they all fit nicely.


    To begin choosing slide transitions, choose Slide Transition from the Presentation
    menu. The Slide Transition window appears. (See Figure 21.12.) Use this window
    to select slide transitions, apply them to slides, and preview the results.'
  merge: -1
  pgno: 419
- img_proc: true
  md: '# Formatting and Giving Your Presentation


    FIGURE 21.12


    The Slide Transition window contains dozens of options for setting up transitions.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_420_0.png)


    Notice that the Slide Transition window isn''t like a dialog box—it can stay open
    as you work on the slides. Just choose the transition you want to use at any time.
    You can close the window by choosing Slide Transition from the Presentation menu
    (or by clicking the Close button in the upper right corner of the window).


    > The transition options are not going to be explained here (including timed automatic
    transitions and adding a sound to a transition). You can experiment with these
    on your own by using the Extras button in the Slide Transition window.


    Several parts of the Slide Transition window require an explanation. The main
    part of the window contains two drop-down lists.


    From the top list, you select which set of transition effects are displayed in
    the boxes below the list. Favorites is selected by default. Other choices include
    Fade, Spiral, Stretch, and Uncover. If you select any of these the set of diagrams
    below the list changes.


    The second list is the speed of the transition. Medium is selected by default.
    You can choose Slow or Fast from the list to change how rapidly the slide transition
    you define occurs.'
  merge: -1
