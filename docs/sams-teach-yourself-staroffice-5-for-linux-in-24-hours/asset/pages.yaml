    # Updating Explorer Icons


    Youveve how to create several types of Internet-related icons in your Explorer
    window. These icons are the only way that you can access these features in StarOffice.


    If you need to fix or update the information in any of the Internet icons on your
    Desktop, right-click on the icon and choose the Properties item in the pop-up
    menu that appears.


    The other menu items shown can be used to set options for that Internet account.
    For example, you can change which messages are shown in an email or news account.
    Not all items shown, however, apply to all the Internet-related icons.


    # In the Next Hour


    The next hour, "Using StarSchedule," describes the StarSchedule features of StarOffice,
    where you can define calendar events and appointments and maintain lists of contacts
    and friends. The scheduling information can be coordinated with other StarOffice
    users to set up meetings or check the availability of a coworker.'
