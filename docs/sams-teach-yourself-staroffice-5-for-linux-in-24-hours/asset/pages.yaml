    that StarOffice provides as preconfigured types of information that are listed
    in the Explorer window for easy access.


    You''ll see the Explorer used for examples throughout the rest of this book.


    # Viewing the Beamer


    As you explore the icons in the Explorer window, you''ll view many different types
    of information and system resources. One way to view these items is in the Beamer
    window. If the Beamer isn''t onscreen, some items from the Explorer window appear
    in the main viewing window, but this makes it harder to use them in your documents.


    The Beamer window is similar to a little catalog or listing where information
    is displayed. The Beamer window appears just below the toolbars.


    To view the Beamer window, select Beamer from the View menu.


    With the Beamer window onscreen, it is easier to see how useful the different
    parts of the Explorer can be. In general, the items displayed in the Beamer window
    can be dragged and dropped into the document that you''re working on.


    # Using the Explorer Icons


    The sections that follow define some of the default items included in the Explorer
    and show how to try them :


    +   **The Address Book**—The address book is a collection of mini-databases (each
    one called a *Table*) where you can store names, addresses, and other information
    for people you know. You can create custom queries and forms for these Tables,
