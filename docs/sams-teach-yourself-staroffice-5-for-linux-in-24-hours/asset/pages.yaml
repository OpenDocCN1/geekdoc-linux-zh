- img_proc: true
  md: '# Using the Desktop


    After you start StarOffice and you''re looking at the Desktop, you can immediately
    start a new document by double-clicking on the New Text Document icon in the upper-left
    corner of the Desktop. (See Figure 7.3.)


    FIGURE 7.3


    The New Text icon on the Desktop opens a new document.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_151_0.png)


    The New Text Document icon


    > When you rearrange the StarOffice Desktop with your own files, be careful not
    to delete the New Text Document Icon or you won''t have the option to quickly
    start new documents.


    # Using a Template


    If you know what type of document you''re creating, you can save time by starting
    with a document template. A template has all the formatting and standard information
    for a particular type of document—all you have to do is enter your text.


    To open a template, choose New from the File menu; then choose From Template from
    the New submenu. The Templates dialog box appears, as shown in Figure 7.4.


    From the Text Document Templates dialog box, select the category of document that
    you need from the Categories list. When you select a category, a list of templates
    appears in the Templates list. Click on a template and click the OK button to
    open a new document based on that template.


    The categories include templates for presentations, spreadsheets, and different
    documents. When you select a template, a file of the corresponding type is opened.


    > If you used a minimum or custom install that didn''t include the StarOffice
    templates, the Text Document Templates dialog box is empty.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Creating a New StarWriter Document


    131


    FIGURE 7.4

    Documents can be started from many different StarOffice templates.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_152_0.png)


    Beyond templates, StarOffice provides a more customized way to create a new document:
    the AutoPilot.


    # Using the AutoPilot


    A StarOffice AutoPilot is a series of dialog boxes that ask you questions about
    what you want to do. Then they use the information that you entered to complete
    the task for you.


    AutoPilots are provided in StarOffice for many tasks, including creating several
    types of new documents. Using the AutoPilot takes more time than opening a template
    but the results are customized to fit exactly what you want.


    > An AutoPilot is similar to a Wizard in some Microsoft Windows applications.


    As an example, you can use the AutoPilot to create a new memo. Choose AutoPilot
    from the File menu, and then select Memo. The first screen of the Memo AutoPilot
    dialog box appears (see Figure 7.5).'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# FIGURE 7.5


    The AutoPilot can be used to create a customized memo.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_153_0.png)


    After you select the options in this dialog box that fit the memo that you want
    to create, click the Next>> button. The next part of the dialog box appears, and
    you can enter more details about the memo.


    > The information you provided in the User Data tab of the General Options (choose
    Options from the Tools menu, and then General Options) provides some of the information
    used by the AutoPilot.


    The AutoPilot dialog box contains a total of four screens in which you enter information,
    followed by one which displays a checkered flag and tells you that the AutoPilot
    is ready to create your memo. When you''re done, press the Create button and the
    memo document is opened with everything in place except the words you enter. All
    the formatting, graphics, and so forth are taken care of.


    AutoPilots are provided for the most commonly used document types. Many more templates
    are provided than AutoPilots, but the AutoPilots enable you to customize your
    document without learning all the commands you might need to use.


    Also, AutoPilots can be used even if you didn''t install the document templates.'
