    within a slide can be

    edited in the Image

    Editor.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_397_0.png)


    Table 20.1 describes the image manipulation tools provided on the Main toolbar
    when

    y start to edit a bitmapshed image.


    # TABLE 20.1 IMAGE MANIPULATION TOOLS ON THE MAIN TOOLBAR


    | Tool name and icon | Description |

