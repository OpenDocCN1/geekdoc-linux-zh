  md: '# FIGURE 11.20


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_239_0.png)


    # In the Next Hour


    In the next hour, "Using Spellcheck and the Thesaurus," you will learn how to
    use the spellcheck and thesaurus features of StarOffice. Spellchecking includes
    automatic highlighting and word correction, and the powerful StarOffice thesaurus
    enables you to explore word meanings to choose just the right term.'
