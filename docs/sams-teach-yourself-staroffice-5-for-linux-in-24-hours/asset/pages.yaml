    your email message. When the body of the email message is active, different icons
    and menus are displayed.


    The Attach File dialog box is the same as the Open File dialog box with which
    you''re already familiar (see Figure 23.9). The only difference is when you select
    a file and choose OK, the filename is listed in the Attachments section of the
    email window.


    When you have attached files to your email, click on the Attachments tab in the
    upper area of the message window to see a list of attached files. The Attachments
    tab is to the right of the headers section. If it''s not visible, click and drag
    the border between sections to reveal it.


    Several browsers that include email capabilities send the email message in plaintext
    (ASCII) and in HTML text, so that if the message is read within another browser,
