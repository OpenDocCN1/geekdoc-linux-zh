    # Protecting a Sheet


    The security features of StarOffice enable you to protect your information both
    from spying eyes and accidents caused by user error (for example, if you accidentally
    delete or change something).


    You can protect information in your spreadsheet in several ways, including


    +   - Hiding a sheet from view without password protection

    - Protecting a sheet from being altered

    - Protecting specific cells in a sheet from being altered

    - Preventing certain cells from being printed when the spreadsheet is printed


    You can easily hide a sheet from view. Choose Sheet from the Format menu, and
    then choose Hide from the Sheet submenu. The current sheet immediately disappears.


    To see that again, choose Show from the same submenu and select the sheet that
    you hid.


    As another example, suppose you have a spreadsheet containing sales figures. Those
    sales numbers are reality, but you want to experiment with a formula to see how
    certain actions will affect future sales.


    All the cells in a StarOffice spreadsheet are marked as read-only by default.
    That is, when you turn Sheet Protection on, you can''t modify any cells in the
    spreadsheet. For your sales spreadsheet, you want to protect the entire spreadsheet
    so that you don''t alter the sales figures, but want to leave a few cells unprotected
    so that you can experiment with a formula or two.'
  merge: -1
