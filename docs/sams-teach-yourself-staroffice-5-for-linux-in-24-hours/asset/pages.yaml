- img_proc: true
  md: '# HOUR 20


    # Adding Graphics and Charts to Your Presentation


    In this hour you learn how to add additional graphical elements to your StarOffice
    presentations, beyond those provided by the StarOffice presentation templates.


    Within a StarOffice presentation, you can add clip-art graphics, draw your own
    graphics, import graphics files, or use charts created in a StarCalc spreadsheet.
    In this hour you learn how to do each of these things.


    # Importing and Editing Graphic Files


    Graphics are an important part of any slide presentation. With only bulleted lists,
    any presentation rapidly becomes a chore for both presenter and audience. With
    colorful graphics that illustrate your points, however, everything becomes more
    interesting.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_394_0.png)'
  merge: -1
  pgno: 394
- img_proc: true
  md: '374


    Hour 20


    StarOffice uses graphics in slides much as it does in word processing documents
    and spreadsheets. The sections follow describe how to use the basic graphics features
    within your presentation slides.


    # Importing an Existing Graphic File


    Any graphic file can be imported into a slide by following these steps:


    +   1. Move to the slide on which you want to insert a graphic.

    2. Set the viewing mode to Drawing (from the Master View submenu under the View
    menu).

    3. Select Picture under the Insert menu, and then choose From File on the Picture
    submenu. (See Figure 20.1)


    FIGURE 20.1

    A graphic can be imported into a slide from the Insert Picture dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_395_0.png)


    You can also use StarDraw or Image Editor tools to draw a separate picture within
    a slide. Use of these drawing tools is described later in this hour.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# Moving and Resizing an Imported Graphic


    Any image that you import into a StarImpress presentation can be moved and sized
    to fit the slide you''re creating.


    To work with an image, it must first be selected. Select an image by clicking
    on it; green handles appear around the object when it is selected.


    > If you don''t see a regular arrow-shaped mouse pointer, you can''t select objects
    on a slide. Choose the Arrow icon on the Main toolbar (usually on the left side
    of the screen).


    After an object is selected, you can manipulate it in several ways:


    +   - Click on the middle of the object and drag it to a new location.

    - Click and drag a corner of the object (on a green handle) to change the size
    of the object (up or down). Hold the Shift key as you do this to keep the ratio
    correct (to avoid distorting the image).

    - Click the right mouse button or go to the Format menu to see all the formatting
    options available for the imported image, including 3D effects and slide show
    actions.


    # Editing an Imported Graphic File


    For mostmapped graphics that you import into a StarImpress presentation (in formats
    such as TIFF, GIF, and BMP), you can use the Image Editor to edit the imported
    graphic directly.


    To use the Image Editor, right-click on a selected graphic and choose Image from
    the pop-up menu. Choose Edit from the Image menu that appears.


    When you choose Edit from the Image menu, the bitmaps image appears in a heavy
    border and a different set of image manipulation tools appears in the Main toolbar
    (Figure 20.2). The resolution of the image might also change so that you see only
    a portion of the graphic.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_396_0.png)'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# FIGURE 20.2


