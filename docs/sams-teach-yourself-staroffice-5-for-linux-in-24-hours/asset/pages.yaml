    # Working with Sheets


    Although you''ve seen how to move rapidly all over your spreadsheet, it can still
    make

    more sense to split your information across several sheets that are part of a
    single spread-

    sheet file.


    For example, suppose you''re preparing a company budget. All the information is
    related,

    but rather than scroll all over a large spreadsheet to find items and check formulas,
    you

    can place each division''s expected revenues and expenses on a separate sheet.
    The first

    sheet can be used to summarize the information on all the other sheets.


    StarOffice provides this capability. The default new spreadsheet that opens three

    sheets. You can rename these sheets or add additional sheets as needed.


    In addition, you can use features such as hiding sheets to arrange and protect
    the infor-

    mation on each sheet.


