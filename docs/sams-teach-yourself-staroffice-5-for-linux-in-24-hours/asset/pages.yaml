  md: '# Using the Task List


    The StarSchedule task list is really just a computerized to-do list. But if you
    have a lot of things to do, StarSchedule provides some features that you''ll find
    helpful.


    You can view the task list by double-clicking on the Tasks item under StarSchedule
    in the Explorer. A simple default Task List is shown (see Figure 24.2).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_488_0.png)


    The following sections describe how to create new tasks, modify the details of
    those tasks, and filter the task list.


    # Creating New Tasks


    To create a new task in the Task List, just click under the Title field on the
    New Task line above the currently displayed tasks. A cursor appears in the Title
    field, where you can enter a brief description of the task that you''re defining.
    When you''ve typed in the description, press Enter.


    Now you can set the start and due dates for this task. Click in the Start date
    field, and then click on the drop-down arrow to see a calendar where you can click
    on a start date (see Figure 24.3).'
