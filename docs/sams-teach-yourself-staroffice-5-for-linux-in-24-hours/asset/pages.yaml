    with green handles). Red handles now appear, and the mouse pointer changes to
    the rotate tool. Click and hold the left mouse button. An outline of the box enclosing
    the torus rotates in three dimensions as you move the mouse. When you release
    the mouse button, the torus is redrawn. The red handles remain, however.


    > With the torus selected, you can also select the Draw Effects icon on the Main
    toolbar to rotate the object.


    Click in the white space outside of the selected object to deselect it.


    # Changing Colors


    Most objects in StarDraw can have a color associated with them. Objects are generally
    composed of an outline and a fill color. You can choose to make both the outline
    and the fill invisible, or you can use a color (including black) to display them.


    With any object selected, you can use the drop-down lists on the Object toolbar
    to set the outline and fill options.


    For example, with the torus selected, choose Continuous from the drop-down line
    style box that currently shows the word invisible.


    Then choose invisible from the drop-down fill style box that currently shows the
    word Color. The result is shown in Figure 6.9.


    Choose Undo from the edit menu twice to revert to the filled torus.


    > The line style and color and the fill style and color can also be modified by
    choosing Line and Area on the Format menu. The Colors tab of the dialog box gives
    you greater control over color than do the drop-down lists on the Object toolbar.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_140_0.png)'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# FIGURE 6.9


    You can select colors for the fill and outline of each object. This Figure shows
    an invisible dill color and a continuous black outline.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_141_0.png)


    # Arranging Objects


    As you create objects, they are layered on top of one another. Thus, the last
    item is the top item visible; it covers any items that are created before it.


    But you don''t always want things to stay that way. To alter the arrangement of
    the objects, select an object, right click on it, and choose Arrange from the
    pop-up menu. The Arrange submenu enables you to move an object forward or backward
    by one object, or to the front or back of the entire drawing (as if it was the
    first or last object created). By selecting different objects and using these
    options, you can arrange the overlapping of all the objects in your drawing.


    > StarDraw also has a feature called layering, in which multiple objects are placed
    on different layers and modified, viewed, or printed as a set. This advanced feature
    is beyond the scope of this introduction to StarDraw, but you can choose Layer
    from the Insert or Format menus to begin experimenting with layers.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_141_1.png)'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Creating Graphics with StarDraw


    # Grouping Objects


    When you have a drawing containing many objects, it can be helpful to work with
    many objects in the drawing as a group (for example to resize, move, or change
    their color simultaneously).


    For example, suppose your line and torus form the core of a fancy new logo. After
    you''ve established the look that you want, you''ll need to resize both at the
    same time.


    You can select both objects at the same time and use the Position and Size dialog
    box on the Format menu.


    But you can also group the objects together so that they are tied to one another;
    selecting one selects both and editing either both. This enables you to use graphical
    tools to resize the objects, and makes using other features more convenient.


    This is especially true when the objects that you want to use together comprise
    a group of 10, 50, or many more objects. It doesn''t make sense to select them
    each time.


    In addition, when you have a complex drawing, it can be very difficult to precisely
    select the object that you want among the many others onscreen. By creating a
    group of objects, you can tie together objects to work on them simultaneously.


    To create a group, follow these steps:


    +   - Click on the line to select it.

    - Hold down the Shift key and click on the torus. Now both objects are selected.

    - Choose Group from the Modify menu. The two objects are grouped together, and
    now show only one set of green handles.


    # Adding Text to the Drawing


    Most drawings include text of some sort that labels or explains the drawing. StarDraw
    images are not intended to be used for newsletters or other text-heavy projects
    (although it''s certainly possible to use StarDraw for such purposes). Nevertheless,
    StarDraw includes many text manipulation options.


    To add text to a drawing, choose the text tool from the Main toolbar (with a large
    T on the icon) and click the location in the drawing where you want the text placed.
    Then start typing:


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_142_0.png)'
  merge: -1
