  md: '# Setting up Task Categories


    The default task categories of Personal, Ideas, Vacation, and Job are a good start,
    but you''ll probably want to define others. Categories are assigned to each user
    individually, so you must edit the Default User properties (or those of another
    user that you establish) to change the categories.


    Follow these steps to add or change task categories:


    +   1. In the Explorer, open the StarSchedule item, the Servers item, and then
    the My Computer item. The Default User icon is shown.

    2. Right-click on the Default User icon and choose Properties from the pop-up
    menu. The Properties of User dialog box appears (Figure 24.8).


