    ![](img/d07037173ed87c2b5a0d33ea3544eb75_47_1.png)


    # # Setting Your PATH Variable


    First, try an experiment. Open a terminal emulator window in X (an xterm window)
    and enter the following command:


    ```

    $ soffice

    bash: soffice: command not found

    ```


    Your system probably can''t start StarOffice. The program for StarOffice can''t
    be located automatically unless you include the subdirectory that contains the
    StarOffice binary in the PATH environment variable.


    To add the StarOffice path to your PATH environment variable, enter the following
    command:


    ```

    $ export PATH=$PATH;-/Office50/bin

    ```


    By adding the StarOffice binary directory to the PATH environment variable, your
    Linux environment can locate your StarOffice program binaries.


    If you want to add this information to your shell startup so that you don''t have
    to enter it each time you start Linux, add the command just given to your .profile
    script in your home directory. (.profile script is executed each time you log
    in to Linux.)


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_47_2.png)


    > Hidden files in your Linux filesystem begin with a period—for example, .profile
    or .bashrc. You can see them by using the ls command with the -a


    ```

    $ ls -a

    ```'
