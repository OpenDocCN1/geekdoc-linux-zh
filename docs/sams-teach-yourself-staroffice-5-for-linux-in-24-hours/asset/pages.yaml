    +   - Visual effects, such as solarization, tiling, smoothing, and noise reduction


    +   - Eyedropper for color sourcing


    +   - Airbrush


    +   - Multiple magnification ratios and cropping


    # Formatting Images in Your Document


    After you have an image that looks the way you want it to graphically, many other
    issues remain in terms of having the image correctly positioned and displayed
    within the context of your document. These issues apply whether you''ve created
    an image in the Image Editor or StarDraw or imported it from another program.


    The following section describes how to set options such as where the image is
    anchored, how text wraps around the image, and where the image is positioned on
    the page.


    # Selecting a Graphic to Edit


    With any image, you must first select it. This tells StarOffice which image you''re
    referring to. It also changes many of the menus and options in StarOffice, giving
    you choices that are related to images rather than text.


    You can select any image by clicking on it. You can tell that an image is selected
    because it has an outline around it and small green squares on each corner and
    on each side, as in Figure 11.6.


    With an image selected, notice that the format menu and the Object toolbar change
    to show image-manipulating options, as shown in Figure 11.7.


    You learn more about these options and icons in the following sections.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_229_0.png)


    > StarOffice refers to a graphic that you insert from a file as a Picture: a graphic
    that you insert from the Image Editor (by drawing it) is called an Object. The
    Object toolbar and Properties dialog boxes for Pictures and Objects vary slightly.
    The same operations can be used on both Pictures and Objects, but some operations
    (such as flip image) are located in different places for Pictures and Objects.
    After selecting a Picture or Object, check the menus, toolbar icons, and Properties
    dialog box.'
  merge: -1
