  md: '# HOUR 13


    # Creating Spreadsheets with StarCalc


    In this hour, you learn how to create, print, and save a new spreadsheet. Although
    the process is similar to creating a new text document (which we learned in Hour
    7, “Creating a New StarWriter Document”), spreadsheets use some different methods
    of formatting and printing.


    In addition, this hour describes other information specific to spreadsheets, such
    as setting input and calculation preferences and various other spreadsheet-options.


    # Opening a New StarCalc Spreadsheet


    StarOffice provides several methods for starting a new spreadsheet, all of which
    are familiar to you from starting a new StarWriter text document. The sections
    that follow describe these methods.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_256_0.png)'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Using the Start or New Menus


    The easiest way to open a new spreadsheet is to click on the Start button in the
    bottom left corner of the StarOffice window, and then choose Spreadsheet from
    the pop-up menu that appears.


    You can also open a new spreadsheet by choosing New from the File menu; then choose
    Spreadsheet from the submenu. (See Figure 13.1.)


    FIGURE 13.1

    You can open a new spreadsheet from the New submenu of the File menu.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_257_0.png)


    # Using the Desktop


    The default StarOffice Desktop also includes an icon that you can double-click
    to open a new spreadsheet. The icon is indicated in Figure 13.2.


    > You can use the Desktop icon on the Start bar to switch to the Desktop.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Creating Spreadsheets with StarCalc


    237


    # FIGURE 13.2


    Icon for a new spreadsheet


    When you double-click on the New Spreadsheet icon on the Desktop, a new spreadsheet
    document opens.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_258_0.png)


    # Using a Template


    StarOffice includes a collection of templates that you can use as a starting point
    for several commonly used spreadsheets, such as expense reports and calendars.


    When you use a template, the formatting is all set up for you; you just enter
    the data and print the document.


    StarOffice includes spreadsheet templates for things such as


    +   - Yearly/monthly calendar

    - Loan calculation

    - Amortization schedule

    - Inventory

    - Schedule

    - Timetable


    13'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'To use one of these templates, follow these steps:


    +   1. Choose New from the File menu; then choose From Template from the bottom
    of the New submenu. The New dialog box appears.


    +   2. Scroll down the list of Categories and click on Financial Documents. A
    list of templates appears. (See Figure 13.3).


    # FIGURE 13.3


    Choosing From the New submenu opens a dialog box where you can select from a list
    of financial templates.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_259_0.png)


    +   3. Click on the template that you want to try.


    +   4. Choose OK. The template document opens.


    +   markdown": "5. In many cases, the template starts with a dialog box that asks
    you questions about the document that you want to create. Answer the questions
    in the dialog boxes to continue.


    +   6. Choose Save As from the File menu.


    +   7. Enter a name and location to which to save this document; then choose OK.


    > Opening a template is similar to opening a blank form with only formatting and
    an outline in which you can enter your own information. Always save the document
    under a name that you choose as soon as you start entering data in it.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Creating Spreadsheets with StarCalc


    Templates can be very useful for everyday spreadsheets. Following is an example
    to show how you work.


    Suppose that you need to prepare an expense report after a business trip. You
    can get out a piece of blank paper and start drawing columns, or you can follow
    these steps:


    +   1. Choose New from the File menu.

    2. Choose From Template from the New submenu. The New dialog box appears.

    3. Scroll down in the Categories list and click on Spreadsheet.

    4. Click on Travel Expense Report in the Templates list.

    5. Click the More button in the lower-right corner. The dialog box expands to
    show you more about templates. (See Figure 13.4).


    Figure 13.4

    The dialog box can be used to preview a template or to review template descriptions.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_260_0.png)


    +   6. Click on the Preview box to see a graphical image of the Travel Expense
    Report spreadsheet.


    +   7. Choose OK to open the template. The Travel Expense Report document appears
    on your screen as in Figure 13.5.


    +   8. Choose Save As from the File menu.


    +   9. Enter a new name for the expense report that you are creating and choose
    Save.


    +   10. Enter your expense data in the worksheet, saving regularly as you work.
    All the totals and other calculations are included in the template. All you enter
    is the detailed information from your trip.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# FIGURE 13.5


    Templates such as the Travel Expense Report give you a formatted area in which
    to enter your data.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_261_0.png)


    Although templates can come in handy, it is still recommended that you review
    the formulas in the spreadsheet before accepting the information in a template
    as being perfectly accurate. Mortgages, expense reports, and so on deserve careful
    attention to detail.


    # Opening an Existing StarCalc Spreadsheet


    Opening an existing StarCalc spreadsheet is similar to opening a text document.
    You can access an existing file in several ways:


    +   - Choose Documents from the Start menu and select a document from the list
    of recently visited files.

    - Choose Open from the File menu. From the Open dialog box, select a StarCalc
    spreadsheet file and choose OK.


    You can also use the file folder icon on the Function toolbar to view the Open
    dialog box.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '* If you have a spreadsheet stored on your StarOffice Desktop, double-click
    on its icon.


    * Use the Explorer window to browse your Workplace or the Work Folder. When you
    find the spreadsheet file that you want to open, double-click on it.


    When you use any of these methods, the spreadsheet appears on your screen, ready
    to be edited.


    # Saving Your Spreadsheet


    Saving your spreadsheet is just like saving your text documents, as you learned
    in Hour 7. The relevant menu items on the File menu are the same for both text
    documents and spreadsheets.


    As soon as you start a new spreadsheet, choose the Save As item from the File
    menu. The Save As dialog box is shown in Figure 13.6; notice that StarCalc is
    automatically chosen as the format in which to save.


    Figure 13.6

    The Save As dialog box for the StarCalc format.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_262_0.png)


    File type in which to save a spreadsheet'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'Select a directory, if necessary, using the file/directory browsing window;
    enter a file-name for the spreadsheet.


    > Remember, filenames in Linux can be long and include spaces and most other special
    characters.


    When you press OK, the file is saved. After giving a name to a document the first
    time you save it, you can update the document on the hard disk by pressing Ctrl+S
    at any time, or by choosing Save from the File menu.


    You can also click on the disk icon on the Function toolbar to save the current
    spreadsheet. If the disk is gray (disabled), no changes have been made in your
    spreadsheet since it was last saved (or since it was created).


    When you save your spreadsheet, all the sheets of the spreadsheet are saved into
    a single file.


    # # Printing Your Spreadsheet


    Printing a spreadsheet can be a lot more complicated than printing a text document.
    Instead of just choosing pages to print, you might need to print a certain block
    on the spreadsheet, compress its size, turn the grid on or off, or set other printing
    features. This section explores how to set these options and print your spreadsheet.


    # # Setting the Print Area


    When you have a large spreadsheet (several screens of data), you might want to
    print only a portion of the entire sheet. In StarOffice, you can select an area
    of your spreadsheet as the Print Area. Then, when you issue a command to print,
    only the part of the spreadsheet within the Print Area is printed.


    You can define a Print Area, and turn it on or off, so that the Print command
    prints only the Print Area or the entire spreadsheet, respectively.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Creating Spreadsheets with StarCalc


    To define a print area within a larger spreadsheet, follow these steps:


    +   Select a block of cells within the spreadsheet, using either of the following
    methods:

    - Click and drag the mouse, releasing the mouse button when the desired area is
    selected.

    - Hold down the Shift key and use the arrows to enlarge the selected area.

    Choose Print Range from the Format menu.


    > If you are not viewing a spreadsheet the Print Range option isn''t shown on
    the Format menu.


    Choose Set from the Print Range submenu.

    After using this procedure, you select Print, only the cells in the spreadsheet
    you selected as the Print Area are printed.

    If you want to print the entire spreadsheet again, you can choose the Clear item
    in the Print Range submenu of the Format menu. Then no Print Area is set, and
    each Print command prints everything.

    To explore the Print Area options, select Edit from the Print Range submenu of
    the Format menu. The Edit Print Areas dialog box is displayed (see Figure 13.7).


    # Figure 13.7

    In the Edit Print Areas dialog box, you can set which cells you want to print.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_264_0.png)'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Hour 13


    When you set a print area using the procedure outlined earlier, you''re setting
    what StarOffice calls the User-Defined Print Area.


    In the Print area part of the Edit Print Areas dialog box, you can select from
    the following-three options from the drop-down list:


    +   - None—Don''t use a Print area selection; print the entire spreadsheet when
    the Print command is issued.


    +   - User-defined—Print the area defined as the Print Area when the Print command
    is issued. The range of cells that is defined as the print area is shown in the
    field next to the drop-down list.


    +   - Selected—Print the selected block of cells when the Print command is issued.
    This is like a one-time print area. The range of selected cells is shown in the
    field next to the drop-down list.


    You can use the Edit Print Areas dialog box to specify what you want to print
    using a few options. If you choose None from the drop-down list, the entire spreadsheet
    is printed when you issue a Print command, but the User-defined Print area cell
    isn''t cleared. You can select it again from this list without having to set it
    again manually by selecting the cells.


    If you choose Selected from the drop-down list in the dialog box, a Print command
    prints whatever cells you have selected. This is handy for printing several sections
    of a spreadsheet without setting and clearing the print area each time.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_265_0.png)


    Be sure to reset your selection in the Edit Print Areas dialog box after you''ve
    used the selected setting for whatever you needed to print. Otherwise, you might
    try to print your spreadsheet later and be surprised to print only a single cell.


    # The Fit-to-Page Feature


    One printing feature that always seems to be necessary when working on a spreadsheet
    is the fit-to-page feature.


    When you''ve prepared a spreadsheet, you often want to print it onto a certain
    number of pages, scaling both directions to fit. Otherwise, you can end up with
    a single column or row on a separate page.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Creating Spreadsheets with StarCalc


    To set how many pages a spreadsheet is to print on, follow this procedure:


    +   1. Choose Page from the Format menu (with a spreadsheet open).

    2. Choose the Sheet tab in the Page dialog box (see Figure 13.8).


    # FIGURE 13.8


    In the Sheet tab of the Page dialog box, you can fit your spreadsheet onto a fixed
    number of pages.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_266_0.png)


    +   3. In the Scale area of the dialog box, click on the Maximum pages option.

    4. Enter the number of pages on which to print in the field provided.

    5. Select whether you want the pages printed from top to bottom or from right
    to left.


    Here''s an example of how you can use this feature. This hour walks through it
    without presenting actual spreadsheets, but it should be clear.


    Suppose you had prepared a long expense report with several columns for date,
    city, descriptions, amount, exchange rate, and so on. When you printed the expense
    report, the far-right column printed on a separate page. The entire printout was
    four pages long, two each way, although the two pages on the right (looking at
    all the pages arranged correctly after being printed) contained only a single
    column.


    Now, if you use the Sheet tab of the Page dialog box, you can compress the spreadsheet
    horizontally just enough to fit all the columns onto one page, but still prints
    two pages (see Figure 13.9). enter 2, and then select Print Top to bottom. StarOffice
    compresses the spreadsheet


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_266_1.png)'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# FIGURE 13.9


    The fit-to-page feature squeezes your spreadsheet onto the number of pages that
    you specify.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_267_0.png)


    Regular Printing


    Using Fit to Page


    > If you try to squeeze too many cells onto too few pages (I always try for one
