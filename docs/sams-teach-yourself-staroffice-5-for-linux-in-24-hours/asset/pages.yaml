    # Viewing Properties of an Item on the Desktop


    The right-click menu that you just used to delete a Desktop icon has many other
    uses. The menu changes depending on the type of icon that you right-click. In
    general, however, the menu shown in the previous figure applies.


    One of the things that you''ll use the right-click menu for is to view the properties
    of your document on your Desktop—to see its size, its date of creation, and so
    on.


    When you right-click on any Desktop icon, you can choose the Properties item from
    the pop-up menu. The dialog box in Figure 3.11 appears. Different types of files
    slightly different dialog boxes.


    From the Properties dialog box, you can view properties such as


    +   - The type of document (StarWriter, subdirectory Folder, HTML, StarCalc, Word,
    and so on)

    - The size of the document

    - The date and time that the file was created and when it was last modified

    - Information about accessing the document on the Internet (if appropriate to
    the file type)'
