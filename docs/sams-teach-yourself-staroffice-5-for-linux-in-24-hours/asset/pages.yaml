  md: '# HOUR 15


    # Using Formulas, Functions, and Names


    In this hour you will learn about using formulas and functions to add useful information
    to your StarCalc spreadsheets. This hour explains the different functions available
    in StarOffice, as well as how to use calculation preferences to determine how
    those functions are used by StarOffice.


    The formulas in a spreadsheet are what make it more useful than a pencil and paper.
    This hour demonstrates how to use simple formulas, and it shows several functions
    that you can use for regular and specialized applications.


    # Labels and Formulas


    Every cell in a spreadsheet can contain one of the following three types of data:


    +   - A number (digits that you enter in the cell)

    - Text (called a label)

    - A formula (something that requires computation by StarOffice to reach a value
    that is displayed)'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 276


    # Hour 15


    Most of this hour discusses using formulas. *Formulas* are entered into a cell
    to make StarOffice calculate something. They''re what gives a spreadsheet its
    real power.


    # Entering Cell References


    In Hour 14, "Entering Spreadsheet Data," cells in a spreadsheet are defined as
    a letter-number combination that refer to a row and colun in the spreadsheet.
    For example, one cell is


    D13


    or, using an absolute reference (of which you''ll see an example in this hour),
    the cell is


    $D13


    A range of cells (a rectangular block) is referenced as follows:


    D13:R55


    Hour 14 also describes how to assign a name to a cell or a block of cells (a range).
    You''ll use ranges later in this hour.


    # Entering Numbers and Labels


    How does StarOffice determine what type of information a cell contains? A few
    rules are all it takes:


    +   - If a cell contains only numbers (digits), it''s a number.

    - If a cell contains anything else (letters), it''s a label.

    - If a cell starts with an equal sign (=), it''s a formula, and it needs to be
    evaluated to reach a value.


    Open a new spreadsheet and enter some information to see how all this works:


    +   1. Click on cell B5 to place the focus on that cell.

    2. Type the word Sale and press Enter. Notice as you type that the information
    appears both in the cell (B5) and above all the cells on the Input Line (see Figure
    15.1).

    3. When you press Enter, the cursor moves to the cell below.'
