  md: '# HOUR 7


    # Creating a New StarWriter Document


    In this hour, you learn how to create a new StarOffice word processor document,
    and then save and print that document. Documents in StarOffice can be started
    in several ways; you''ll learn the most useful ones.


    In addition, this hour describes how to start entering text in your document and
    how to set default options for your text documents.


    # Starting from Scratch with StarWriter


    StarOffice provides so many ways to open a new document that you''ll hardly know
    which one to choose. The sections that follow walk you through the methods that
    you''re most likely to use.


    When you start a new StarWriter word processing document, you''re really just
    opening another window in the StarOffice main window. Any other documents you
    have open, as well as the StarOffice Desktop, all stay active, though they might
    be hidden from view.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'The sections that follow describe how to open a new StarWriter document. This
    can be done in several ways:


    +   - Using the Start button in the bottom left corner of the StarOffice window—Click
    Start and choose Text Document from the pop-up menu.

    - Using the New menu—Choose New from the File menu and then Text Document from
    the New submenu.

    - Using the Desktop—Double-click on the New Document icon. Switch to the Desktop
    using the Desktop icon on the Status bar if necessary.

    - Using a Template—Choose New from the File menu; then choose from Template.

    - Using the AutoPilot—Choose AutoPilot from the File menu; then choose a Document
    type (agenda, fax, and so on) from the AutoPilot submenu.


    # Using the Start Menu


    The easiest way to start a new StarWriter document is to select Text Document
    from the Start menu. The Start menu is always visible in the lower left corner
    of the StarOffice window.


    When you click on Start, a pop-up menu appears. The top part of the menu lists
    file types that you can start. Choose Text Document to start a new StarWriter
    word processing document.


    # Using the New Menu


    After you start StarOffice, the Desktop is displayed. You can open a new document
    by choosing New from the File menu, and selecting Text Document from the New sub-menu.
    (See Figure 7.1.) You can see that StarOffice enables you to create many types
    of files. When this book refers to a document, it means a StarWriter word processing
    file.


    Notice in the New submenu that an icon is shown next to each item. You''ll learn
    to recognize these icons for the file types that they represent in StarOffice.


    When you choose Text Document from the New submenu, a new word processing document
    appears in the main StarOffice window; the Desktop is no longer visible (see Figure
    7.2).


    Using the Start menu or the Desktop (see the next section) are both faster than
    using the File menu to open a new document.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Creating a New StarWriter Document


    FIGURE 7.1


    The New submenu enables you to select which document type you want to start working
