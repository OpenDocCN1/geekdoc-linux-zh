  md: '# HOUR 9


    # Using Advanced Formatting Tools


    In this hour, you learn how to use advanced formatting tools such as footnotes,
    columns, and text styles. StarOffice provides many formatting tools beyond what
    you learn here, but these are the formatting options that will be most useful
    to you.


    You''ll learn how to insert, edit, and delete footnotes, as well as to set up
