    When you import a document, the styles from the Word document are added to the
    current StarOffice style list. You can see these in the Paragraph Styles window.
    (Press F11 or choose Stylist from the Format menu; see Figure 5.2.)


    If you know your Word document well, you might be troubled that your paragraph
    styles aren''t listed in the Paragraph Styles window. Take heart. Change the drop
    box at the bottom of the Paragraph Styles window from Automatic to All Styles—or
    better, to Applied Styles.


