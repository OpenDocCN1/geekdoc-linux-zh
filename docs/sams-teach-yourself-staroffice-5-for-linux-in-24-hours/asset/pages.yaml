    in the View menu.


    +   - Right click on the word Explorer, the top icon in the Explorer window. A
    pop-up menu appears.


    +   - From the pop-up menu, select New, and then POP3 Account. The Properties
    of POP3 Account dialog box appears (see Figure 23.1).'
