  md: '# Using Advanced Formatting Tools


    > StarOffice automatically renumbers all footnotes as you work. You don''t have
    to insert footnotes in order throughout your document.


    When you''ve entered the text for the footnote, press the Page Up key or click
    on the body of your document.


    # Editing a Footnote


    Editing a footnote is also easy. If you place your mouse pointer next to a footnote
    marker in your document, the pointer changes to a hand. If you click on any footnote
    marker, the cursor jumps to the footnote text, and you can edit it.


    If you prefer, you can also scroll down the page. When you see the footnote text,
    click anywhere in the footnote to begin editing.


    > If you place the mouse pointer on the footnote number in the footnote text area
    and click, the cursor moves to the marker in the body of your text. This is a
    great way to find footnote or endnote references are located in a document.


    # Deleting a Footnote


    You can delete any footnote by highlighting the footnote marker and pressing delete.
    This deletes the footnote marker and the footnote text; other footnotes are renumbered
    as necessary.


    You can use the keyboard or the mouse to delete a footnote. To use the keyboard,
    place the cursor after the footnote marker and press the backspace key. To use
    the mouse, position the mouse pointer near the footnote marker until the pointer
    changes to a hand. Click and drag across the footnote marker so that it''s selected.
    Press Delete to delete the footnote.


    > You can use Undo on the Edit menu if you delete a footnote and then change your
    mind.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Customizing Footnote Options


    StarOffice enables you to customize footnote options for each document you create.
    This section discusses how to customize the most useful footnote options. Options
    that you can set include designating that footnotes appear at the end of each
    page, the end of each paragraph, or the end of your entire document (endnotes).
    In addition, you can define how the automatic numbering of footnotes functions.


    All the footnote options are set from the Footnote Options dialog box, which you
    can access by selecting from the Tools menu. (See Figure 9.5)


    # Figure 9.5


    In the Footnote Options dialog box, you can set the location, numbering, and style
    of your footnotes.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_185_0.png)


    The Footnote Options dialog box is divided into four areas:


    +   **Position**—Determines where footnotes are placed in your document

    * **Auto numbering**—Determines how the automatic numbering functions (used when
    you select Automatic instead of Character in the Insert Footnote dialog box)

    * **Styles**—Determines the formatting of the footnote text (this will make sense
    after you''ve read the section on styles at the end of this hour)

    * **Continuation notice**—Determines what message is placed between pieces of
    a footnote that must be split between two pages (trying a long footnote and you''ll
    quickly see how this is used)'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Setting Footnote Position


    The Position area of the Footnote Options dialog box describes where the text
    for footnotes that you insert in your document. The default selection for the
    position is End of page, which means that for any footnote you insert on a page,
    the text for that note is placed at the bottom of the same page. The only exception
    is footnotes that wrap to the next page if tables or numerous footnotes interfere
    with the formatting.


    If you want to change your footnotes to endnotes, select End of document; StarOffice
    places all the footnotes at the end of your document, after all the text that
    you type.


    # Setting Up Automatic Numbering


    The Auto numbering area enables you to determine three things about the automatic
    numbering of footnotes in your document:


    +   * What is used to number the footnotes (Arabic numerals, roman numerals, small
    letters, or capital letters). If you have a lot of footnotes, don''t use roman
    numerals.

    * How often the numbering is restarted.

    * What the markers start with each time they are restarted.


    Just as with the other automatic formatting features of StarOffice, such as outlining
    and bulleted or numbered lists (see Hour 10, “Using Tables, Indexes, and Other
    Special Features”), you can select which system to use for numbering your footnotes.


    This flexibility enables you to use various numbering systems without having to
    use the Character option to type in a letter or special number for each footnote.
    It also keeps the footnote numbering accurate.


    The automatic numbering that is provided for footnotes can be restarted at regular
    intervals. For example, you can have footnote markers 1 and 2 on the first page,
    and when you add a new footnote marker to page 2, the footnote marker can begin
    at 1 again. The options include the following:


    +   * Each page can have a separate set of numbered footnotes.

    * Each chapter can have a separate set of footnotes.

    * The entire document can use a single footnote numbering system, from beginning
    to end.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Using Columns


    Per chapter numbering of footnotes is used with multifile documents that use a
    Master document. This isn''t discussed in this book.

    If you choose the End of Document position for your footnotes (making endnotes),
    the numbering option for each page doesn''t make sense, so it doesn''t appear
    in the list.


    Finally, you can select the starting footnote number for the document. This starting
    number is used as the first footnote number for this file. This is used for Master
    Documents that include several files.


    The starting footnote number is not used for per page or per chapter numbering
    options, which restart at 1 automatically.


    The starting number is always shown as an Arabic numeral, even if you''ve selected
    letters or roman numerals as footnote markers. Think of the starting number as
    the sequence to start with rather than the actual character. If you choose 5 as
    the Start at number and capital letters as the markers, for example, the first
    footnote is E.


    The defaults for Auto numbering are 1,2,3. Per document, and 1 (for Start at).
    After you''ve tried these options, you can experiment with the Styles and Continuation
    notice to see how they can improve the usefulness of your footnotes in StarOffice.


    When you want to format text that flows in multiple vertical columns, such as
    in a newspaper or magazine, you can use the Columns feature.


    The Columns feature aligns your text to standard newspaper-style columns. In other
    words, each page can have multiple columns. The text that you flows from the bottom
    of one column to the top of the next column.


    Although you can''t do everything in StarOffice that you can in a page layout
    program such as Quark Express or PageMaker, StarOffice enables you to define the
    number of columns you want, the spacing between the columns, and the width of
    the line that separates the columns.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_187_0.png)


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_187_1.png)'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Defining Columns


    You can define your columns before you begin entering your text, or you can format
    your document into columns at any time during the creation of the document.


    The tab where you define columns is part of the Page dialog box. To view this
    area, select Page from the Format menu; then select the Column tab within the
    Page dialog box. (See Figure 9.6.)


    # FIGURE 9.6


    You can define columns within the Page dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_188_0.png)


    For these examples, assume that you can use standard column widths, which means
    that you don''t have to worry about all the measurements in the Column width area
    of the dialog box.


    > If you select more than one column, you can uncheck the Automatic width feature
    and manually adjust the width of each column. Always change the Spacing field
    to a nonzero value; the default value of zero means that text in adjacent columns
    is touching, and therefore can''t be read easily.'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'Instead, look at the Preview and the Columns areas. You can adjust the number
    in the Amount field (a strange field name) to change the number of columns in
    the document. An easier method, however, is to click on one of the little pictures
    that shows how you want your columns set up.


    The automatically set choices include:


    +   - One column (regular noncolumn text)

    - Two and three columns (for newspaper style text)

    - Two columns, with the left or right column narrower (for newsletters or special
    formatting tricks)


    Click on any of these figures and the Preview figure changes to show how you the
    text in your document will look.


    The Separator area of the Columns tab enables you to define a line between each
    column. The default line size is None. If you want to add a line between the columns
    in your document, you can select a line width from the drop-down list.


    After the Line field has a size selected, you can also set a value in the Height
    field. This number is the percentage of the height of the text column. For example,
    if your top and bottom margins are both one inch and your paper is 11 inches tall,
    using a 100% Height creates a 9-inch line.


    If you set the Height to less than 100%, you can also set the position of the
    line, placing it even with the top or bottom of the column, or centered vertically
    between columns. The same line specifications apply between all columns.


    Figure 9.7 shows a document divided into two columns, with standard column widths.
    A line between columns is .01 point wide, and 100 percent high (the full distance
    between top and bottom margins).


    Recall that you can create columns any time you want. To create columns in a new
    document, follow these steps:


    +   - Open a new document (notice that there are currently no columns)

    - Select the Columns tab of the Page dialog accessed through the FormatPage menu.

    - Select the number of columns you want.

    - Change the Spacing field in the Column width section to .1 or .2 inches.

    - Define a line to separate the columns (if you want one).

    - Choose OK.'
  merge: -1
