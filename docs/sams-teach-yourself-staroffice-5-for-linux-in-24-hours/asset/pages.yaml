    # Recalculating Your Spreadsheet


    When you enter formulas in your spreadsheet, the values that are calculated from
    those formulas can change continuously as you enter new information in the other
    cells of the spreadsheet.


    StarOffice automatically recalculates everything in your spreadsheet as you enter
    new or revised numbers in cells. StarOffice determines which cells need to be
    recalculated by waiting on which cells you enter numbers.


    If you''ve entered a large spreadsheet, however, with many complex formulas, you
    might find that the constant recalculation slows down your work with StarOffice.
    This is especially true if you use a lot of financial or mathematical functions
    with large numbers of cells.


    You can turn the auto-calculate feature off that StarOffice waits for explicit
    instructions before recalculating the spreadsheet.


    To turn off the auto-calculate, select Cell Contents from the Tools menu, and
    then choose AutoCalculate from the Cell Contents submenu. This feature is unchecked,
    and the spreadsheet is no longer recalculated until you explicitly request a recalculation.


    With AutoCalculate turned off, you can give the command to recalculate by choosing
    Recalculate from the Cell Contents submenu (under the Tools menu).


    > Press F9 at any time to recalculate the spreadsheet.


    # Using More Advanced Functions


    In this section, you''ll see an example of a financial function provided by StarOffice.
    The functions that are part of StarOffice include specialized scientific and complex
    mathematical functions that will meet almost any calculating need that you have
    in a spreadsheet. (When was the last time you needed to calculate an arctangent?)


    Many of the advanced functions require that you have a spreadsheet set up with
    certain information as background. A less-involved function is used as an example
    to show you the power of these functions.'
