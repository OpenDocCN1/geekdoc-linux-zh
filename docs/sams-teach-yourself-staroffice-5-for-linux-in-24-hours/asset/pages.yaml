    Next you''ll see the screen where you can select the Installation directory. Because
    you''re doing a single user installation, the default directory that is shown
    is probably a good choice. It is probably something such as /home/nwells/Office50.
    If you want to change it, choose the Browser button and select another directory.


    If you don''t install StarOffice in the same place that you designated for the
    libraries when running the soprep script, the program might not run after installation
