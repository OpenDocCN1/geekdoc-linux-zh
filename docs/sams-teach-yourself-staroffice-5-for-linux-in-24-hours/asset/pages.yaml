- img_proc: true
  md: '# Hour 7


    You can also click and hold on the icon to the far right at the top of the dialog
    box to see a drop-down list from which you can choose the directory that you want
    to view. Options include the Explorer window, the Workspace, and the root directory
    of your Linux filesystem (/).


    If you need to move to another location in your Linux filesystem, click the Parent
    Directory icon to move up one level in the directory structure.


    Notice that even in Linux, StarOffice tries to match the icon for each file type.
    For example, if you have a Microsoft Word file, it appears with the standard Word
    document icon.


    To select a subdistrict and view its contents, double-click on it.


    When you know which file you want to open, select it and choose the Open button.
    If the file isn''t in StarOffice format, you might be prompted to help StarOffice
    determine the file format so it can be opened for editing in StarOffice. Hour
    5, "Importing and Exporting StarOffice Documents" describes the details of working
    with other file formats for StarOffice.


    > You can also open a document directly from the Work Folder in the Explorer.
    Just double-click on the Work Folder, and then double-click on the file that you
    want to open.


    # Entering and Modifying Text


    When you have a new or existing document onscreen, you can enter text and use
    standard keys to move around the screen just as you do in any text editor or other
    Linux program. Be certain that your StarOffice window has focus so that your keystrokes
    appear where you expect them to.


    # Saving Your Document


    After you''ve entered the text of your document, you''ll want to save it to your
    hard disk.


    To open the Save As dialog box, press the disk icon on the Main toolbar (see Figure
    7.8) or choose Save from the File menu.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Creating a New StarWriter Document


    FIGURE 7.8


    The disk icon on the Main toolbar saves your document. If the document doesn''t
    have a name yet, it opens the Save As dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_156_0.png)


    The disk icon


    > The disk icon is gray (so you can''t click on it) unless you have a document
    open, with changes. Each time you save your document, the icon goes gray until
    you make other edits.


    # Selecting a Location for Your Files


    When you open the Save As dialog box to save a document to disk, the sub True
    that appears in the dialog box is the StarOffice Work Folder. If you enter a filename
    and choose OK, your document is saved in the Work Folder, which is actually a
    subdirectory of the StarOffice directory.


    The advantage of saving your files in the default Work Folder is that your files
    are always available from the Explorer window (as you learned in Hour 3, "Using
    the Explorer and the Desktop").


    On the other hand, you might prefer that your StarOffice files are located with
    other word processing or personal files; or you might have separate directories
    where you want to store your word processing files, spreadsheets, presentations,
    and so forth.


    You can change the default so that the StarOffice Save As dialog box always starts
    at a different location in the Linux filesystem: Change the Work Folder path in
    the General Options dialog box. (See Hour 4 for details.).


    # Learning to Save Early, Save Often


    It doesn''t take too many disasters before people start planning for them. If
    you''ve ever lost several days'' work, or even a productive hour'' work because
    of a power glitch, a system crash, or some other problem, you probably save documents
    regularly.


    Of course, Linux never seems to crash. Why not get it in the habit of using that
    little key combination any time you pause during your typing: Press Ctrl+S


    After you''ve saved a document the first time, and have given it a document name,
    you can update it on your hard disk by using the Ctrl+S Accelerator key combination.
    You'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'can see this listed next to the Save item in the File menu, but choosing that
    menu item all the time isn''t nearly as convenient as pressing the Accelerator
    keys.


    If you''re more a mouse person than a keyboard person, you can click on the floppy
    disk icon to update your document on the hard disk. If you''ve already saved the
    file once, you don''t have to enter the document''s name again.


    # # Resaving with a New Document Name


    Sometimes, you might also need to save your document with a new name.


    For example, suppose you open a file that you previously sent to someone. You
    need to resend it to another friend. If you just choose Save or press Ctrl+S,
    you''ll erase the original version of the file.


    Instead, after you''ve opened the original file, immediately choose Save As from
    the File menu. Enter a new name for the file and choose OK. Now you can make changes
    to the file and save it without losing the information in the original file.


    # # Printing Your Document


    Printing your document can be very easy—or very difficult. For the easy version,
    just press the printer icon on the Main toolbar (see Figure 7.9).


    FIGURE 7.9


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_157_0.png)


    The printer icon on the Main toolbar immediately prints the current document.


    The printer icon


    The current document is printed immediately, without even opening a dialog box.


    That is, the document is printed if you have printing correctly configured on
    your Linux system and a valid printer driver selected and configured in StarOffice.


    Unfortunately, if you haven''t set up printing in Linux, it''s beyond the scope
    of this book to describe how to do it. Some information is provided in Hour 4.
    For complete information, check out a copy of Sams Teach Yourself in 24 Hours.


    Your Linux system probably has a printer setup utility of some sort. You can also
    edit the /etc/printcap file in a text editor—this is the “difficult” version of
    printing your document.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Creating a New StarWriter Document


    If your Linux printing is working, you can set a few other options for printing
    your document beyond pressing the printer icon on the toolbar.


    Before you print a document, you might want to see how it will look on the printed
    page. You can do this by choosing Page View/Print the File menu while you''re
    viewing a document. Figure 7.10 shows a Page View.


    # Figure 7.10


    A Page View of your document shows how it will look on a printed page.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_158_0.png)


    You need to check the Page View/Print preview item in the File menu if you want
    to continue editing your document.


    When the page looks right, you can print your document by choosing Print from
    the File menu. The Print dialog box appears (see Figure 7.11); you can select
    several printing options before choosing OK to send your document to the printer.


    Options that you can set in the printer queue to print the document to, which
    pages to print, and how many copies to print.


    If you need to change the printer setup before printing, you can choose Cancel
    to close the Print dialog box and choose the Print Setup dialog from the File
    menu. In addition to these printing options, a few other options can be found
    in the General Options dialog box (described in Hour 4), and in the Text Document
