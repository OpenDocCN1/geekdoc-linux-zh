  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_464_0.png)


    # # HOUR 23


    # ## Using StarOffice Email and Newsgroup Features


    In this hour you''ll learn how to use other Internet-aware features of StarOffice.
    Specifically, you''ll learn how to configure your email system within StarOffice
    to send and receive email, and how to read and post to Internet newsgroups.


    The features described in this hour go beyond working with Web documents, as described
    in the previous hour. Using email and reading newsgroups are two other important
    sources of information sharing on the Internet. StarOffice provides access to
    these resources for anyone with an Internet connection. This hour describes how
    to use those features.


    # ## Configuring Email Accounts


    Before you can send and receive email in StarOffice, you must configure the incoming
    and outgoing email accounts so that your email can be located and routed properly.'
