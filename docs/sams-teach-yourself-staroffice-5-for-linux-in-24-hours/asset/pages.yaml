    Figure 7.6


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_154_0.png)


    The Open File icon on the Main toolbar is a folder.


    The Open File icon


    All after this information about starting a new StarOffice document, you still
    might need to open an existing document.


    As in most graphical programs, you can open the Open dialog box with the folder
