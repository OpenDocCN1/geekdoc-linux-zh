- img_proc: true
  md: 'Across the top of the Slide Transitions window are several buttons. From left
    to right they are


    +   - **Effects**—Displays the set of transition effects from which you select,
    previously described (this button is selected by default when you first open the
    Slide Transition window).

    - **Extras**—Displays a set of other options that are not described here, but
    that you can experiment with your own.

    - **Update**—When this button is selected (toggled on), clicking on a slide selects
    the transition of that slide in the Slide Transition window.

    - **Apply**—Applies the transition to the currently selected slide.

    - **Preview**—Opens or closes the Preview window. When the Preview window is open,
    you can view a miniature transition for any slide by clicking the Apply button.


    To apply a transition to a slide, follow these steps:


    +   1. Open the Slide Transition window by selecting Slide Transition from the
    Presentation menu.

    2. Click on the slide to which you want to apply a transition. (Make sure that
    the Update button is not selected.)

    3. Select a transition type from the drop-down list.

    4. Select a transition by clicking on one of the small graphic images below the
    list.

    5. Select a speed from the drop-down list.

    6. Click on the Apply button (the green check-mark) to apply the selected transition
    to the current slide. A transition tag appears below the slide. If the Preview
    window is already open, the transition is also previewed as you select the Apply
    button.


    > When you apply a transition to a slide, you are defining what transition is
    displayed at that slide—not from that slide to the next slide. This is apparent
    as you use the Preview window.


    > You can see if a slide has a transition applied to it by noting whether a transition
    tag appears below it in the Slide Sort view (see Figure 21.13).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_421_0.png)


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_421_1.png)'
  merge: -1
  pgno: 421
- img_proc: true
  md: '# FIGURE 21.13


    The Slide Sort view displays a small tag or icon below each slide that has a transition
    applied to it.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_422_0.png)


    Indicates that a transition has been applied to the slide


    7. Click on the Preview button to open the Preview window (see Figure 21.14).
    The current slide appears in miniature in the Preview window.


    # FIGURE 21.14


    The Preview window enables you to review how the slide transitions will actually
