    ![](img/d07037173ed87c2b5a0d33ea3544eb75_199_0.png)


    +   2. Choose the New button.


    +   3. Enter a name for the new style on the first tab, Organizer.


    +   4. Review each tab in the dialog box, entering the correct formatting detail
