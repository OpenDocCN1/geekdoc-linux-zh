  md: '# Creating Internet Documents with StarOffice


    FIGURE 22,14


    The Bookmark icon represents the URL of the current document. Drag it to the Bookmarks
    folder to save a link to the current document.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_454_0.png)


    The Bookmark icon


    22


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_454_1.png)


    An HTML document in the Bookmark folder is listed by its HTML title, which appears
    in the title bar of any browser when you view the file. Local files are listed
    by their filenames.


    To open a bookmark, select it from the Bookmarks submenu of the Start menu. If
    you''re viewing bookmarks in the Beamer window, you can either


    +   - Drag the bookmark from the Beamer window and drop it in the current document
    to place a link at the current cursor location.

    - Double-click on the bookmark in the Beamer window to open that document.


    The advantage of using bookmarks is that they make a document easy to access,
    but take up almost no space (only a few bytes each).


    # Working with Web Documents


    StarOffice enables you to view and link to Web documents, but it also enables
    you to create them. New Web documents can be created from existing Web documents
    that you download, or they can be started from scratch with nothing but an idea.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_454_2.png)


    If you want to use downloaded pages as the basis for your own Web pages, ask for
    permission and check the legal statements on the site. Generally it''s best to
    learn from other sites—even studying the HTML code from their pages—to create
    your own Web page from scratch.'
  merge: -1
  pgno: 454
- img_proc: true
  md: '# Saving Existing Documents for the Web


    Hour 5. "Importing and Exporting StarOffice Documents," describes how you can
    use the Save As feature of StarOffice to export HTML documents for use on the
    Web or as an interchange format for others who aren''t using StarOffice.


    > HTML—HyperText Markup Language—is a tagging system used to create documents
    for display on the Web. It''s a simple format, but it''s tedious to enter the
    codes by hand.


    Although the features of a StarOffice document can''t be converted to HTML for
    Web display, the primary ones can. Saving an existing document in HTML format
    is a quick and easy way to create a Web page. Tables, graphics, and all standard
    text formatting is included in the exported Web page.


    To export a document in HTML, follow these steps:


    +   1. Open an existing StarOffice document.

    2. Choose Save As... from the File menu.

    3. In the drop-down list of file formats, select HTML. (See Figure 22.15.)


    # FIGURE 22.15


    Select HTML as the file format to save your existing StarOffice documents for
    use on the Web.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_455_0.png)'
  merge: -1
  pgno: 455
- img_proc: true
  md: '# Creating Internet Documents with StarOffice


    +   4. Enter a new name for the file (html is added automatically).

    5. Choose OK.

    6. Reopen the newly-saved HTML file in StarOffice or in another browser to see
    how well the formatting converted to HTML..


    # Creating New HTML Documents


    If you don''t already have a document prepared that you want to move to the Web
    but know that the Web is the target for the document you want to create, the best
    option is to create it from the beginning as an HTML document. That way, you''ll
    know how it will look in a browser when you''re finished.


    StarOffice enables you to create native HTML documents. To start a new HTML document,
    select New from the File menu, and then select HTML document. You can also choose
    New HTML Document from the StarOffice Desktop, or click the Start menu and choose
    More, and then HTML document.


    A new blank document appears looks similar to the word processing documents that
    you''re familiar with. However, you''ll see that the menus and toolbars are slightly
    different when you create an HTML document.


    Create a small HTML document now and see where the differences lie. Use the following
    steps:


    +   1. Enter a headline on the first line of the new document.

    2. Enter a paragraph of descriptive text.

    3. Enter three bullet items after the paragraph. If you start each line with a
    hyphen, StarOffice converts the hyphens to bullets.

    4. Choose Picture from the Insert menu and pick a graphics file to insert.


    You cannot use the Image Editor to create an image within an HTML document. The
    image must exist in a separate file.'
  merge: -1
  pgno: 456
- img_proc: true
