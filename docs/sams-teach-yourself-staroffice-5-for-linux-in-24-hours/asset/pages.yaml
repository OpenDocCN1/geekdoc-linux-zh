    # Setting the General Options


    Although you can set options independently for spreadsheets, HTML files, presentations,
    and so on, some settings apply to all documents that you create.


    These general settings are controlled by the General Options dialog box, which
    you can view by selecting Options from the Tools menu, and then selecting General.


    The sections that follow review the most important settings in the General Options
    dialog box.


    # Reviewing Your User Data


    When you installed StarOffice in Hour 1, "Installing StarOffice," you had the
    option of entering some personal data during the installation. This User Data
    is stored in StarOffice for use in template documents, in email and newsgroup
    postings, and so on.


    If you need to review or change any of your personal information, go to the General
    Options dialog box (choose Options, Tools, General) and choose the User Data tab.
    (See Figure 4.7.)'
