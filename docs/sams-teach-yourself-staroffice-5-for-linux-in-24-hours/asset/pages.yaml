  md: 'You can also select from among these viewing options by using the buttons on
    the right edge of the screen above the vertical scroll bar. The icons are small,
    but if you leave the mouse pointer over an icon, a pop-up description tells you
    which view is selected. Click on any of these icons to select a view. (See Figure
