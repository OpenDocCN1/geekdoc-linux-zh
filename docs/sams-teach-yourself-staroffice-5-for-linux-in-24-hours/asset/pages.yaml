- img_proc: true
  md: 'The lines that you enter as topics are part of the Agenda, and also headlines
    on individual slides, depending on the type and length of presentation that you
    specify.


    6. Click the Next>> button to advance to the next screen in the dialog.


    7. Choose the type of presentation that you want to make by selecting a radio
    button box on this screen. Note that a description is provided on the left side
    of the dialog box. The description changes when you select different items in
    the list. (See Figure 19.7.)


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_379_0.png)


    8. Click the Next>> button to continue. In the next section, shown in Figure 19.8,
    select a design style and a duration for your presentation.'
  merge: -1
