    # Using Bold, Italic, and Underline


    The font settings that you''ll work with continually are those such as bold, italic,
    and underline.


    While you''re in the Character dialog box, you can see which options are available
    in the font that you select by looking in the Style list. If you choose a specialized
    font, for example, italic might not be available.


    You can select any of these styles, and then press OK to apply them to selected
    text. If no text is selected, they apply to any new text you enter at the current
    cursor position.'
