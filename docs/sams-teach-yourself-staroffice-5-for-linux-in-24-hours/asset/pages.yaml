  md: '# Adding items to the Calendar


    Adding items to the Event Calendar can be done whenever it''s visible. You can
    either double-click on a time slot, or single-click on a time slot and then choose
    the New Event icon on the Object toolbar (the far left icon).


    The time slot displays a cursor where you can enter text describing the event
    for that time slot. Press Enter when you''ve completed the description.


    If you want to indicate that a task lasts longer than a single time division on
    your calendar, click on the border of the text entry area while typing an event
    description, and then drag the border to fill in the time you want the event scheduled
    for: one hour, two hours, or whatever takes.


    If you have the Details section of the Event Calendar displayed, you can select
    any event by clicking on it, and then edit the details of that event, including
    priority, category, participants, and so on.


    # Filtering the Calendar Events


    Calendar events can be filtered just like the task list. Filter criteria can include
    other items, such as out-of-office events.


    To define an event filter, choose Define Event Filter from the View menu. The
    Event Filter dialog box shown in Figure 24.19 appears. The filter definition follows
    the same procedure as the Task list filter description earlier in this hour.


