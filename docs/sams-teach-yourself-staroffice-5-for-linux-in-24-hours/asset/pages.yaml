  md: '# TABLE 5.3 ITEMS TO CHECK AFTER IMPORTING A SPREADSHEET


    | Item to check | Potential problems |

    |---|---|

    | Total number of sheets in the spreadsheet | The current sheet of an imported
    spreadsheet might be intact, but the entire "Workbook" might not have been imported
    correctly. Check the names and arrangement of multiple sheets in a multi-sheet
    spreadsheet. |

    | Page numbers, footnotes, headers, and footers | These items outside the page
    margins might overlap or be in different positions. Also check the font used.
    |

    | Font | A different default font might be substituted. |

    | Graphics and charts | Different graphics formats might be supported in the new
    word processor, making some graphics gray boxes. Positioning of the graphics might
    also be off. |

    | Formulas | Chart styles or formatting options available might be different.
    Check charts for data consistency (do they still make sense when you read the
    numbers?), as well as making sure that they still look good.

    Most formulas are simple enough to transfer fine, but long or complex formulas
    that rely on absolute cell references or a special order in which operations are
    performed might not calculate in the same way. Add parentheses where needed to
    force calculation in the correct order. |

    | Functions | If a function that was available in the original spreadsheet program
    is not available in the new program, an obvious error appears in the cell. More
    dangerous or rarely-used used functions that might have different meanings or
    parameter order and therefore appear to work, but actually functioning differently.
    |

    | Document properties | Document meta-information, such as author and date created,
    might not be imported even though the new spreadsheet program has those features.
    |

    | Special Features | Features such as data validation and input help notes, sheet
    protection, and user-defined functions might not import correctly, leaving the
    data in the cells correct, but making use of the spreadsheet by others less intuitive.
    |


    continues'
