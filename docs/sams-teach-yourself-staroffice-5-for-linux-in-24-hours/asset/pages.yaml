  md: '# FIGURE 24.6


    The Details button shows fields for many task details.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_491_0.png)


    Click the Details button to show this information.


    Some of the information in the Details area is already shown in the single-line
    task summary. You already already entered a start and due date, for example. Each
    of the drop-down boxes in this area defines something about the selected task.
    Each of these items is described here:


    +   * Start date—The date the task is to be started.


    +   * Due date—The date the task is to be completed.


    +   * Completion date—The date the task was completed (not always the same as
    the Due date for most of us).


    +   * Close date—When the task was closed. This can be used separately from the
    completion task because of other actions taken on this task. Also, the closed
    field can be used to filter tasks, as described later in this hour.


    +   * Status—Enables you to define how the task is progressing or if it''s deferred
    or put on hold. Five options are given in this field.


    +   * % complete—Enables you to define in 10 percent increments how the task is
    progressing.


    +   * Access Level—Can be public, private, or confidential. The access level is
    used when you work with others on a network that can view your task and calendar.
    Only tasks marked public are available for others to view.'
