    slides, you can apply a transition to all of them at once.


    # # SpellChecking Your Presentation


    Hour 12, “Using SpellCheck and the Thesaurus,” already provided the lecture on
    the importance of spellchecking your document. Now imagine your misspelled word
    spread across a screen in 18 inch letters before 250 people. Follow the easy steps
    that follow to spellcheck every presentation.


    You can run the StarOffice spellcheck from any slide view; however, the Outline
    view might be the fastest and most convenient because each slide doesn’t have
    to be graphically drawn during spellcheck.


    The spellcheck options for a presentation are the same as those for a document
    (as described in Hour 12):


    +   * The AutoCorrect option fixes many simple typing errors, such as transposed
    letters.


    +   * The AutoCheck option can be selected under the Spelling submenu in Tools
    menu. This provides red underlining as a warning for any word that can’t be found
    in the spelling dictionary.


    +   * The Spelling window, with its replacement and ignore options and the thesaurus,
    is available to check the text of your presentations.'
