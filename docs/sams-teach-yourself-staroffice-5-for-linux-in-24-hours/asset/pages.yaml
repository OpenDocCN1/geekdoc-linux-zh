  md: 'Because formatting can apply to different areas, Styles can also be applied
    at different levels. The five icons represent the following:


    +   - Paragraph styles—Apply to a complete paragraph. These include formatting
    items such as indents, fonts, sizes, and so forth.


    > The examples in this hour revolve around paragraph styles, but the same principles
    apply to the other types listed in the Stylist window.


    +   - Text styles—Apply to blocks of characters and generally include formatting
    options such as italic, bold, and font type.


    +   - Frame styles—Apply to Frames in your document. (Frames are not covered in
    this book. A frame is similar to inserting a graphic in your document, but you
    can control type in it.)


    +   - Page styles—Define formatting for an entire page, such as margins and paper
    size.


    +   - Numbering styles—Define how numbered and outlined lists are formatted.


    You will use some other parts of the Stylist window in the examples that follow.


    # Reviewing the Attributes of a Style


    Using a style is only half the fun. If you want to understand how your document
    is formatted and be ready to create your own styles (discussed in the next section),
    you need to see what formatting attributes are part of a named style.


    To see the parts of a named style, view that style in the Paragraph Style dialog
    box. Use one of the following options:


    +   - Click on a style in the Stylist window to select it, and then right-click
    anywhere in the window. Choose the Modify item from the pop-up menu.


    +   - Choose Styles and Templates from the Format menu, and then choose Catalog
    from the submenu that appears. Select a paragraph style from the list and choose
    the Modify button.


    Using either method, the Paragraph Style dialog box appears (shown in Figure 9.14).'
