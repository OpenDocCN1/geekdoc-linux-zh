  md: '# FIGURE 9.11


    The Paragraph Styles window lists available styles.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_195_0.png)


    # Applying a Style


    When you have the Paragraph Styles window open, you can apply a named style to
    any text in your document. You will learn more about creating styles in the next
    section, but first here''s a look at how to apply a style.


    The styles and text in this example won''t match your document, but you can still
    see how styles are used. Follow these steps:


    +   1. Place your cursor in a paragraph of text to which you want to apply a new
    style.


    +   2. Double-click on a style name in the Paragraph Styles window. Notice that
    several things might change in your text paragraph, depending on which style you
    double-clicked on. The indents or margins, the font, the size, or other features
    might have changed.


    +   3. Try double-clicking on another style and watch the text change.


    +   4. With the Paragraph Styles window still open, click on another paragraph
    in your document to move the cursor to that document.


    +   5. Double-click on any style and watch the text paragraph change.


    That''s how easy it is to use a style to format your document. In the next section,
    you will learn more about how to use the Paragraph Styles window with styles that
    are predefined, or with styles that you define.


    # Reviewing the Stylist


    The Stylist window is a quick-access method of applying a named style to a block
    of text. You can also choose a style from the drop-down list in the Object toolbar
    (see Figure 9.12), but other things can be done only in the Stylist window.'
