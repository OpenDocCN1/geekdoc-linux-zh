    # Reviewing the Edit Options on a Chart


    After you''ve created a new chart, you can edit any part of it, and make it look
    completely different if you choose to.


    You can access a piece of the chart to format it in one of three ways:


    +   - Double-click on a part of the chart when it''s in edit mode (with a heavy
    line around it).

    - Click on a part of the chart to select it and then click the right mouse button
    to select from a submenu of editing options. The Object Properties item is usually
    the most comprehensive.

    - Click on one of the buttons on the Main toolbar to use a chart editing tool.'
