  md: '# Configuring StarOffice


    Backup copies are stored in the ~/Office50/backup directory with the extension
    .bak. You can use the Open item on the File menu to browse this directory and
    select a backed-up document to load.


    +   * Automatic save every xx Minutes—Autosave is one of the nicest features of
    any modern office software. When you check this option, StarOffice automatically
    creates a new backup file every few minutes (you determine how often in the Minutes
    field). If your work is unexpectedly interrupted, you lose a few minutes'' work,
    even if you never officially saved the document you''re working on. The time required
    for Autosave on most computers is not noticeable.

    * Undo Number of steps—This option enables you to set how far you can back up
    in your work using the Undo item on the Edit menu. More undo levels adds to the
    memory requirements of your, but can be a great help if you do a lot of editing
    on large or important files.


    > The two Save options—Always create backup copy and Automatic save xx minutes—are
    turned by default in many word processors, such as Microsoft Word. However, they
    are off by default in StarOffice. Turn these options on and leave them as you
    work in StarOffice.


    > If you''re working on a laptop, automatic save and backup features can use extra
    battery power by running the hard drive more often. Use your judgment as to whether
    the backup or the battery life is more important to you.


    # Reviewing Your StarOffice Paths


    If you''ve worked with Linux for very long, you know that one of the greatest
    sources of trouble with Linux software can be determining where things are stored
    in the filesystem.

    StarOffice is a large program, and you might want to store parts of it in nonstandard
    locations to fit what you''re doing with the rest of your Linux system.


    The Paths tab in the General Options dialog box enables you to set up the subdirectory
    where each part of StarOffice is stored. Most of these subdirectories are probably
    fine if they''re set up by default. Following is a look at a couple that you might
    want to change.

    The Path tab of the General Options dialog box is shown in Figure 4.9.'
