    # 8


    > An inch is 72 points; if you want a headline that is 1/2-inch high on a printed
    page, for example, use a 36-point font. The size of fonts onscreen rarely corresponds
    to their correct point size.


    You''ll probably only set a new font for headlines, captions, or certain words
