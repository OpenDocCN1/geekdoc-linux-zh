  md: '# Using StarOffice Email and Newsgroup Features


    Some email systems don''t allow attachments that are larger than a certain size.
    Either your email server or the receiver''s email server might reject the message
    if you attach a large file or several files to your email message. Common limits
    are 100K, 1MB, or 10MB. If this occurs, you''ll have to figure out a way to split
    attached files into multiple smaller email messages, or call the system administrator
    for help.


