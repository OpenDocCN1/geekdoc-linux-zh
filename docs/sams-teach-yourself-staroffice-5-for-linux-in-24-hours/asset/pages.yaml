    In addition to creating a New Style by Example, you can create a new style based
    on an existing style. This can be a lot quicker than setting all the needed formatting
    options—if the style you want is similar to another style, but with a few modifications.


    To create a style based on another style, follow these steps:


    +   1. Place the cursor in a paragraph of the style that you want to use as a
    basis for your new style.


    +   2. Open the Paragraph Styles window.


    +   3. Right-click anywhere in the Paragraph Styles window.


    +   4. Choose New from the pop-up menu that appears. The Paragraph Style dialog
    box appears.


    +   5. The settings in this dialog box are those of the current paragraph. Notice
    that the Based on field contains the name of the style for the paragraph in which
    the cursor is located.


    > The Based on style is not the style highlighted in the Stylist window when you
    select New from the pop-up menu. it is always the style of the current text paragraph.


    +   6. Enter a name for your new style in the Name field.


    +   7. Change any formatting areas that you want in this new style.


    +   8. Choose OK to add the new style to the list of styles for this document.


    Styles are a powerful feature within StarOffice. You''ve seen only the most basic
    features of styles, but it will still be enough to make the formatting of your
    documents go a lot smoothly.


    # In the Next Hour


    In the next hour, you''ll learn how to insert and format tables in your StarOffice
