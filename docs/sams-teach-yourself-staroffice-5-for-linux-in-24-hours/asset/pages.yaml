  md: '# Using Tables, Indexes, and Other Special Features


    +   6 Choose OK to close the Numbering/Bullets dialog box. The first outline number
    appears.


    With the outline started, you can type the text of the first outline item and
    press Enter. Each time you press Enter, the next number in the outline appears.


    Continue to enter outline items, following these two rules:


    +   - If the outline needs to be indented further (lower level in the outline),
    press the Tab key before you type the item.


    +   - If the item needs to be raised to a higher level in the outline, press Shift+Tab
