  md: 'The mailboxes you set up in this section define specific email accounts. You
    can create multiple inboxes for different accounts you have, as well as multiple
    outboxes to hold messages sent through those accounts. Each of these accounts
    can use any of several protocols, such as POP3, VIM, or IMAP. To use an account,
    you must define the server on which the account resides.


    Don''t confuse these accounts with the default SMTP servers for outgoing and incoming
    mail that you define in the Internet Options dialog box (opened from the Tools
    menu). For example, you can have a separate POP3 account through an ISP, in addition
    to the email arriving on your local SMTP server.


    > Email accounts can use any of several formats, including POP3 and IMAP. Check
    with your ISP or system administrator to see which protocol you need to use to
    retrieve email.


    > As you work with email accounts in StarOffice, you''ll see VIM as an option
    in several places. VIM is a protocol used by cc:Mail and Lotus Notes. This option
    isn''t discussed in this book, however.


