    ![](img/d07037173ed87c2b5a0d33ea3544eb75_363_0.png)


    You can check this box and choose the Sort Criteria tab to see that the drop-down
    list contents change to Column B, Column C, and so on.


    +   - When the Include formats checkbox is selected, the format of each cell is
    moved with it during the sorting process. If this checkbox is not selected, the
    values are moved, but the formatting remains as it was before the sort.


    +   - For some examples, lines might be highlighted in bold. The bold format can
    follow the sorted line, or remain on the same row as new data is sorted into that
    position.


    +   - The Copy sort results to checkbox indicates that the sorted table is to
    be copied to another location in the spreadsheet, rather than replacing the selected
    cells that are being sorted.


    +   - The drop-down list shows any names that you have defined within your spreadsheet
    (defining names was described in Hour 14, "Entering Spreadsheet Data").


    +   - If you don''t have names defined, or prefer to use another area of your
    spreadsheet, you can use cell references in the text entry field to right the
    drop-down list below the Copy results checkbox.'
