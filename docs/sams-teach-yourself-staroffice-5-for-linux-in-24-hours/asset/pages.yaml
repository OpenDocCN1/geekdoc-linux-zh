  md: '# Adding Graphics to Documents


    # FIGURE 11.19


    Every image option and setting can be configured for a selected image from the
    Object dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_238_0.png)


    # Adding Horizontal Lines


    A much simpler graphic element you can add to your document is a simple horizontal
    line. These are useful as ruling lines for documents, for example to divide sections
    of a resume or report.


    You can add a variety of horizontal lines by selecting Horizontal Line from the
    Insert menu. The Insert Horizontal Line dialog box appears, as shown in Figure
    11.20.


    The collection of horizontal lines in the scrolling list is a little different
    from similar lists in programs such as Word. If you want a standard ruler, choose
    the top item, Single, and then choose OK.


    If you scroll down the list, you''ll see a variety of lines that are more suited
    to a Web page than any normal text document that you might print out on paper:
    rainbows and rabbit feet, airplanes, and marbled textures.


    If you use one of these fancy lines, the horizontal line is treated as an image.
    You can select it, add a border, and so on.


    If you choose the Single horizontal line, however, you can''t easily select it
    for editing, you''re stuck with the line you initially see. In fact, you might
    have to deleting the line if you need to. It''s so narrow that clicking on it
    doesn''t often work. Instead, place the cursor just above it, hold down the Shift
    key, and use the arrows to select it.'
  merge: -1
