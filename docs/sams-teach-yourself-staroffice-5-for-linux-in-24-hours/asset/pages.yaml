  md: '# Formatting Your Spreadsheet


    # Formatting Cell by Cell


    Formatting in a text document can be for a word, a paragraph, a page, or an entire
    document. Different formatting options apply to different areas of the document.


    In Hour 13, "Creating Spreadsheets with StarCalc," you learned about printing
    a spreadsheet and setting options such as margins and page headers.


    Almost everything else in a spreadsheet is formatted on a cell-by-cell basis.
    That is, the choices that you make apply to one or more individual cells. When
    you select a column and apply a formatting option, you''re really applying that
    option to each cell in the column, and not to the column itself.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_314_0.png)


    > There isn''t much time to talk about it here, but cells can also use Styles,
    as described in Hour 9, "Using Advanced Formatting Tools." This means that you
    can apply several formatting options to a cell at one time by assigning a name
    style.


    # Setting a Font and Size


    Suppose that you want to make headlines for the main column headings in your spreadsheet.
    You might have a spreadsheet similar to the one in Figure 16.2.


    FIGURE 16.2.


    A spreadsheet often needs its column headings highlighted for easy reading.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_314_1.png)'
