  md: 'Several other paragraph formatting settings are included in the Paragraph dialog
    box, including defining text flow options and colors for a paragraph. Leave those
    for exploration: now look at how to format and arrange the pages of your document.


    # Using Other Paragraph Formatting Features


    StarOffice provides other formatting features that are less commonly used, but
    which can add some variety to the appearance of your documents. The Drop Caps
    tab enables you to define a large initial letter on the current paragraph, such
    as you''d see at the beginning of a newsletter or magazine article.


    The Borders and Background tabs enable you to define an outlined box around the
    current paragraph and specify the background color of the paragraph, respectively.
    These features are great for highlighting blocks of text in unusual ways. You''ll
    see similar-borders and background features as you format graphics and characters.


    # Arranging the Page


    Beyond the character and paragraph settings, you need to set up the pages through
    which the paragraphs flow. You can open the dialog box to organize the page layout
    of your document by choosing Page from the Format menu.


    Unfortunately, StarVision chose to place an advanced formatting tool as the default
    first tab on this dialog box (the Organizer tab). You''ll learn about organizing
    styles in this tab in Hour 9.


    # Setting the Page Margins and Paper Size


    After you have the Page dialog box open, choose the Page tab, as shown in Figure
    8.11. From this tab of the dialog box you can set the margins, page layout, and
    paper size.


    All four sides of the printed page are represented by the four Margins fields:
    Left, Right, Top, and Bottom. You can use the arrows next to the fields or type
    a custom number. The measurement used is the one you defined in the General Options
    (see Hour 4).


    The Paper format area defines what type of paper your document will be printed
    on. You can select a paper size and either Portrait or Landscape printing.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_175_0.png)


    > Depending on your printer setup, the default paper size might be A4, a European
    paper size that makes all your documents look strange if you live in the U.S.
    Check the paper size for the first few documents you create to be sure that it''s
    set to Letter.'
  merge: -1
