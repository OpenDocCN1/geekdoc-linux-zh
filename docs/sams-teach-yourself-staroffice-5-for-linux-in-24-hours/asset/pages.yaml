    # Using HTML as an Interchange Format


    You''ll hear more about this in Hour 22, "Creating Internet Documents with StarOffice,"
    but StarOffice is designed to work well with the Internet. In fact, HTML is one
    of the prime formats that StarOffice can read and write.


    HTML is not listed in the previous sections as a word processor interchange format
    because HTML is severely limited compared to word processor formats. At least,
    it''s designed for different goals, so using HTML to convert between Word 97 and
    StarOffice, for example, does not preserve all the formatting and document data
    from the original file.


    Nevertheless, if you''re working with colleagues who are Web-savvy, or who are
    more interested in reading your document in editing or altering your document,
    HTML can be an effective format for your documents.


    You can choose HTML as the format in the Save As dialog box (described previously).
    StarOffice can read in (import) any HTML Web page, including one that you''ve
    saved for StarOffice.


