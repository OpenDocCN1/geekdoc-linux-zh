  md: '# Getting Started with StarOffice


    If you use bash, you can add the updated PATH command to your start-up script
    by executing the following command:


    ```

    $ echo ''export PATH:$SPATH:-/Office40/bin'' >>.bashrc

    ```


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_48_0.png)


    The commands used in this hour assume you''re running the bash shell, which is
    the default shell for almost all Linux systems. Some users prefer using other
    shells, such as sh, csh, or tsh. Some commands that have been demonstrated (such
    as export) don''t work the same way in other shells.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_48_1.png)


    # StartingStarOffice from a Command Line


    With the PATH variable set correctly, you can start StarOffice from any graphical
    xterm window with the following command:


    ```

    $ soffice

    ```


    However, it''s better to add a space and an ampersand afterward:


    ```

    $ soffice &"

    ```


    This starts StarOffice as a background application to the xterm in which you are
    typing. Put simply, that means that the xterm command line is still usable. In
    the first example, without the &, the xterm is busy running StarOffice and isn''t
    of any further use to you.


    If you don''t want to worry about setting the PATH variable described in the previous
    section, you can always start the StarOffice program directly from the StarOffice
    binary directory. From any directory, the command is as follows:


    ```

    $ ~/Office50/bin/soffice &

    ```


    Now here''s how to make it more convenient to start StarOffice from your Desktop.


    > It''s normal for StarOffice to take a full minute or more to start, even on
    a 400MHz Pentium system.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_48_2.png)'
