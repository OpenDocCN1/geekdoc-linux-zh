    # Using Bullets and Line Numbering


    You can use bullets and numbering the same way that you use outlining in StarOffice:


    +   1. From the Format menu, choose Numbering/Bullets.


    +   2. Choose the Bullets or Numbering tab.


    +   3. Select a style from the boxes shown.


    +   4. Choose OK.


    A bullet or number is shown at the beginning of the current line. When you type
    text and press Enter, the next number or another appears (see Figure 10.18).


    As with outlining, press Enter on a blank line to end the automatic addition of
    a bullet or line number.


    When you need to use a bullet list or numbered list, you can also add those features
    after you''ve entered the text.


    Just select any block of text and then open the Numbering/Bullets dialog box.
    When you select the bullet or numbering option and choose OK, your selection is
    applied to all the selected lines.'
