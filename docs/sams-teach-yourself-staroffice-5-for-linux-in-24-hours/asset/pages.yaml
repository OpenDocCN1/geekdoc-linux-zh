    # Inserting Links in Spreadsheets and Presentations


    In the preceding example, you created a hyperlink with a phrase in a word processing
    document. You can also enter links in spreadsheets and presentations, but not
    with as much flexibility.


    When you type an URL within any spreadsheet cell or presentation slide, the URL
    is immediately converted to a hyperlink that you can click on to go to that page.
    (See Figure 22.13.)'
