  md: '# Using Database Functions


    # FIGURE 18.13


    AutoFiltering makes it easy to view the records that match a selected value for
    a certain field.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_366_0.png)


    With the California records showing, you can easily review or edit them as a group.
    Notice that the row numbers match the true row numbers in the unfiltered spreadsheet.


    When you''re done working with the California records, select Filter from the
    Data menu, and then uncheck Filter by selecting it again from the Filter submenu.
    All the records in the table are displayed again.


    # Using the Standard Filter


    You can also define filter criteria yourself. This can save time if you have a
    field that contains many types of data.


    For example, if you have hundreds of records for California, and you only want
    to view those that are in Fairfield, you can use a Standard filter to set both
    City and State criteria at the same time. The AutoFilter doesn''t allow this flexibility.


    To set a Standard filter, select Filter from the Data menu, and choose Standard
    filter from the Filter submenu. The Standard Filter dialog box appears (see Figure
    18.14).'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# FIGURE 18.14


    The Standard filter dialog box can be used to select multiple values on which
    records are filtered.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_367_0.png)


    You can choose up to three fields to filter. This is similar to choosing three
    fields to sort, except that with filtering only records matching a certain value
    are displayed.


    For example, you can choose State as the Field name, equals (=) as the Condition,
    and CA as the Value.


    Then you choose an Operator to define the interaction between the multiple criteria.
    Choose AND from the drop-down list.


    Next choose City as the field value, greater than or equal to (>=) as the Condition,
    and a city name near the middle of the alphabet as the Value.


    The dialog box with your selections appears in Figure 18.15.


    After choosing OK to apply the Standard filter, the list of records looks similar
    to Figure 18.16. Notice that only California records with names greater (later
    in the alphabet) than your criteria are listed.'
  merge: -1
