  md: '# Creating an Index


    +   The background color for the entire table or for any cells in the table


    > Many of the table formatting options can be set from the Object toolbar, including
    the borders and background color for any selected cells.


    Indexing a document is tedious business. Unless you''re a professional indexer
    (there are such things) or you like using boxes of 3x5 index cards (as did the
    science writer Isaac Asimov), you''ll appreciate the indexing features of StarOffice.


    Indexes aren''t used just for books like this one, although you can certainly
    write and index your book in StarOffice. Indexes add professional touch to any
    document that''s longer than a dozen pages. They help a reader skim a large amount
    of text or find just the right piece of information.


    Creating an index in StarOffice consists of two steps, which are outlined in detail
    in the following sections.


    First, you insert index markers in your document. Each index marker is associated
    with the term or concept next to the marker. That is, you insert a marker that
    says Apache tribe, history of, at the beginning of the sentence or paragraph that
    describes the history of the Apaches.


    Second, you insert or update the index. In this step, StarOffice processes all
    the markers found in your document (or in the multiple files in a Master document)
    and assembles the text from the index markers, in alphabetical order, with the
    page numbers each marker was found.


    Each time you add text to your document, the page number on which an index marker
    is found changed. But with the index markers in place, you can just update the
    index again to have the index include all the correct page numbers. Updating an
    index takes only a few seconds and requires no input from you.


    > The update process for a StarOffice index is called generating the index in
    many other word processors.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Using Tables, Indexes, and Other Special Features


