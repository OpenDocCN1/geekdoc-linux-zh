  md: '# FIGURE 22.13


    You can enter a URL in a spreadsheet cell to create an automatic hyperlink.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_453_0.png)


    However, you cannot select a word in a cell or on a slide and attach a hyperlink
    to it. The Format menu for a spreadsheet or presentation doesn''t include the
    hyperlink option.


    # Saving URLs in the Explorer


    The Explorer window and the Landmarks folder were described at the beginning of
    this book; now you''re ready to use them.


    Anytime you view a file or a document on the Internet, you can save the location
    of that document in the Landmarks folder. To save the location of any document,
    follow these steps:


    +   1. Open the Explorer window by selecting Explorer from the View menu. Click
    the Show arrow in the corner of the Explorer window if the Explorer is selected
    but hidden.


    +   2. Click on the Bookmark icon, drag it to the bookmarks folder, and release
    the mouse button. (The link icon is shown in Figure 22.14.)


    You may make use of the links in the Bookmark folder in a couple of ways.


    To view the contents of the Bookmark folder, click on the Start menu below the
    document window. The Landmarks submenu contains all your bookmarks. You can also
    open the Beamer window (select it from the View menu) and click on the Bookmark
    folder in the Explorer window to view the bookmarks in the Beamer.'
