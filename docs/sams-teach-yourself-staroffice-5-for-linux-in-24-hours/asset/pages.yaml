  md: '# Adding Graphics and Charts to Your Presentation


    Some of the choices in the Interaction dialog box are only relevant in the Windows
    version of StarOffice, even though they are still listed in the Linux version.


    5. Choose OK to close the Interaction dialog box.


    When you start a slide show (see Hour 21, "Formatting and Giving Your Presentation"),
    you can click on the graphic that you imported to execute the action that you
    selected in the Interaction dialog box.


    # Drawing Your Own Graphics


    Adding graphics that you''ve created in a spreadsheet or other drawing program
    is a big part of most presentations. A slide is similar to a picture, though,
    and sometimes you need to add a feature specific to one slide.


    StarOffice drawing tools enable you to do this. The basic drawing tools are always
    visible on the Main toolbar—on the left of the screen—as you edit slides in Drawing
    mode (a single slide fills the screen in this mode). The toolbar is shown in Figure
    20.4.


    FIGURE 20.4


    The Main toolbar on the left side of a slide in Drawing mode contains a complete
    set of drawing tools.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_400_0.png)


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_400_1.png)


    The drawing tools shown on the Main toolbar are vector-based drawing tools, like
    those used in StarDraw (see Hour 6). Bitmap (raster) drawing tools are available
    by choosing Picture from the Insert menu, and then selecting From Image Editor.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# Adding Lines and Rectangles


    Simple shapes such as lines and boxes are easy to add and edit with the drawing
    tools.

    The steps that follow take you through a series of additions to a basic slide
    from a StarOffice template.


    Start with a slide in Drawing mode, as shown in Figure 20.5. (This is the first
    slide of the New Employee Introduction presentation from the templates.)


    # FIGURE 20.5


    This slide is used as the basis for examples of drawing lines and shapes.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_401_0.png)


    +   - Click on the Lines and arrows icon on the Main toolbar on the left side
    of the screen.

    - Move the mouse pointer over the slide and notice how it changes from an arrow
    to crosshairs.

    - Click and drag the mouse pointer across the middle of the screen to make a long
    horizontal line.

    - Press the Shift key to constrain the line to vertical, horizontal, or a 45 degree
    angle.

    - Release the mouse button to finish drawing the line. The mouse pointer changes
    back to an arrow (the select object mode), but the line you drew remains selected
    (with a green handle on each end). The screen looks similar to Figure 20.6.'
