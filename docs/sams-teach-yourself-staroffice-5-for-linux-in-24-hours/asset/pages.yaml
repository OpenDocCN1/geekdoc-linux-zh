    # Updating or Removing the StarOffice Installation


    After you have StarOffice installed, you might want to change the installation.
    For example, if you didn''t install the help files or templates in the original
    installation, you might want to add them to your system later.


    You might even need to remove StarOffice from your Linux system. Although StarOffice
    is pretty much self-contained in the Office50 directory, it always helps to have
    a deinstall utility.


    All these tasks can be completed by starting the setup utility after StarOffice
    is installed. The setup utility detects that StarOffice is already installed on
    your system (for the current user) and presents you with options that are different
    than those in the original installation.


    Start the setup utility within the program directory of StarOffice:


    ```

    $ /opt/Office50/bin/setup &

    ```


    The setup program starts up, but it doesn''t look like it did the first time.
    The options presented now (see Figure 1.10) are


    +   * Modify installation

    * Deinstallation

    * Repair


    The next sections take you through these options.'
