  md: '# Updating an Index


    When you have the index in place, you might still need to add or remove information
    from your document. This can involve adding and deleting words that are marked
    as index entries. It can also mean moving text around so that the page numbers
    in the index aren''t correct.


    StarOffice enables you to update the index without worrying about the location
    of the index entries in the document.


    Any time you need to update the index with the latest index entries and correct
    page numbers, select Update from the Tools menu and choose Current Index or All
    Indices from the submenu. The specified index entries are instantly reexamined
    and corrected in your document.


    # Numbering and Outlining


    For many documents, both in business and in creative work, you need to create
    a structured outline or numbered list that you expand or work from to create a
    larger document.


    StarOffice provides line numbering, automatic bullets, and automatic outlines
    to help you structure a document without keeping track of all the numbers of letters
    as you go.


    The sections that follow describe the easiest ways to use StarOffice to automate
    a structured document as an outline, or to add line numbering or automatic bullets
    to your text.


    # Using Auto Numbering Outlines


    Whenever you need to create an outline in StarOffice, you can turn on the outline
    feature to have StarOffice do the work for you.


    Suppose you''re writing an outline for a book. Before you start writing the outline,
    follow these steps:


    +   1. Place your cursor where you want the outline to begin.


    +   2. Choose Numbering/Bullets from the Format menu. The Numbering/Bullets dialog
    box opens.


    +   3. Choose the Outline tab (see Figure 10.16).


    +   4. Select which style of outline level markers you prefer by clicking on one
    of the boxes.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# FIGURE 10.16


    The Outline tab enables you to define how an automatic outline is to be structured.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_219_0.png)


    +   5. Optionally, choose the Customize tab (see Figure 10.17). From this tab
    you can set the format of each outline level exactly as you prefer. Spacing, numbering,
    bullet graphics, indent amount, and other settings can be controlled separately
    for each outline level.


    # FIGURE 10.17


    In the Customize tab of the Numbering/Bullets dialog box, you can set numbering
    and spacing options for each outline level.


