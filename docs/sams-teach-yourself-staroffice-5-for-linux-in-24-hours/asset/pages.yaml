    Desktop files.


    # Switching Between Documents and the Desktop


    With all your key working documents stored on your StarOffice Desktop for easy
    access, you might be asking what makes the Desktop so convenient.


    You can always switch to the Desktop by selecting it from the Window menu. The
    easier way, usually, is to click on the Desktop button on the left end of the
    Start bar (see Figure 3.12). Because this button is always visible, you''re always
    just one click away from viewing all the files on your Desktop.


