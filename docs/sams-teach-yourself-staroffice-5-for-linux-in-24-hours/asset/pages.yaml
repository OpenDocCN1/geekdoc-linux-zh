  md: '# Viewing Multiple Document Windows


    When you have multiple documents open in StarOffice, you can display each one
    in a window smaller than the main StarOffice so that parts of multiple documents
    are visible at the same time.


    These floating windows each include a Status bar for the document in that window.


    Use the small buttons on the upper-right corner of the document to create a floating
    window while viewing a document. As with non-floating, full-sized windows, you
    can use the Windows menu or the buttons on the Start Bar to make any document
    visible.


    # Using the Start Menu


    The Start menu is a great way to access any StarOffice features. Not only are
    menu items provided to start new documents of many types, but you can also use
    the Start menu to open recently edited documents (their names are saved and shown
    on the Documents submenu, just as you do in Microsoft Windows 98.


    Bookmarks and Help files are also listed in separate submenus on the Start menu
    for quick access.


    If you''re using KDE on your Linux system, and you selected KDE Integration when
    you installed StarOffice, you have two other features available in the Start menu:


    +   - The Program Files submenu includes everything from the KDE Main Menu, so
    you can start any program on the KDE menu directly from StarOffice.


    +   - The KDE Control Center is included in the Settings submenu, so you can configure
    KDE from the Start menu selections.


    # Reviewing the Menus


    The menus in StarOffice will be very familiar to you if you''ve used other office
    suite software. The items are arranged in a similar pattern that is easy to learn.


    The catch is that StarOffice, unlike MS Office, isn''t composed of several components
    such as MS Word and MS Excel. Instead, everything is part of one program: StarOffice.


    Therefore, the menus don''t have to change between different document types. In
    fact, most of the menu items remain the same for any document that you''re working
    on. This makes it easy to find the command that you need the menus.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Using the Explorer and the Desktop


    When you work with different types of documents, you''ll see that the following
    menus remain constant most of the time:


    +   - **File menu**—Items for working with entire files or documents, such as
    opening and saving

    - **View menu**—Items for choosing what you view on your StarOffice window

    - **Window menu**—Items for arranging and selecting among the open documents in
    your StarOffice session

    - **Help menu**—Items for different online help tools


    On the other hand, some of the menus change quite a bit. For example, the formatting
    options for a spreadsheet and a word processing document require different commands,
    so the items listed on the Format menu change according to what you''re working
    on.


    # Using Keyboard Shortcuts


    Computer users seem to fall into two camps. The first prefers to use a mouse,
    feeling that typing is for content and not for controlling a computer program.
    The second type prefers the keyboard, and only touches the mouse as a last resort.


    Graphical programs make it easy to learn a new application, but they require you
    to use the mouse. Most graphical programs in Windows and Macintosh also have keyboard
    shortcuts to accommodate users who prefer using the keyboard. These shortcuts
    are a great way to quickly perform tasks without using the mouse. Most Linux programs
    don''t have these shortcuts, but StarOffice for Linux does!


    Two kinds of keyboard shortcuts are provided in StarOffice. The first uses the
    Alt key to open a menu and regular keystrokes (letters, arrows, and the Tab key)
    to select an option.


    The second type of shortcut is called an Accelerator key. By pressing the Ctrl
    key in combination with other keys, you can immediately execute an action such
    as saving or printing a file, or building a block of selected text.


    Following is an example of using the Alt key to perform a task—opening a new StarCalc
    spreadsheet:


    +   - While holding down the Alt key, press the *f* key (this is usually written
    as Alt+F). The New appears.

    - Press the *n* key. The New item is selected, and the New submenu appears.

    - Press the *s* key. The Spreadsheet item is selected, and a new spreadsheet document
    appears on your screen.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_82_0.png)'
  merge: -1
  pgno: 82
