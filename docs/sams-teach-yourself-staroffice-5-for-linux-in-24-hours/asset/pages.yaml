- img_proc: true
  md: '# Working with Columns


    When you set up columns, each page of your document is like multiple pages of
    text with narrow margins, formatted onto one page. Beyond that distinction, other
    functions of StarOffice work the same within columns as they do in regular columns:


    +   - Tables can be inserted into columns—The table cannot, however, extend beyond
    the boundary of a column.


    +   - Graphics can be added to a page with columns—As with regular pages, the
    graphic box can be resized and moved as you choose. The column boundaries don''t
    restrict movement.


    +   - A frame can be inserted on a page with columns—The frame can be moved and
    sized without being restricted by the column borders.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_191_0.png)


    > If you need to add a table that spans several columns, insert a Frame and add
    text and a table within the Frame. We haven''t discussed Frames, but you can experiment
    with them.


    +   - Index markers and footnote markers can be added to text in columns—The correct
    placement and page numbers apply.


    # Using Text Styles


    Styles are an advanced formatting feature that enables you to quickly format a
    block of text with several formatting options.


    Styles are included in most major word processors, including Word, WordPerfect,
    FrameMaker. This section describes how to set up and use styles in StarOffice.


    # Explaining the Concept of Styles


    When you use the standard formatting options so far (mostly in Hour 8, “Formating
    Your Document”), you can set up text that is bold or double-spaced, or that has
    many other options set. StarOffice refers to this as soft-formatting; this is
    ironic because it can be pretty hard to set up these formatting options for your
    entire document.


    The alternative is to use styles. A style is a named set of formatting attributes
    that you can apply all at once. If you need to make a single word bold, it’s easy
    to select it and press the Bold icon on the object toolbar.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Using Advanced Formatting Tools


    Suppose, however, you have a long document with quotations scattered throughout.
    Each quotation paragraph needs to be spaced differently, with different margins,
    and in italics (those professors are sticklers for format).


    Instead of choosing each formatting attribute for each paragraph, you can define
    a style—call it quote—and then apply that style to each quotation paragraph. When
    you apply the Quote style, all the formatting that you define is applied at once
    to that paragraph.


    Similarly, blocks of characters have a style. For example, suppose you need to
    set all computer commands in a document to bold, italic, courier font. A style
    enables you to apply all these attributes at the same time.


    Styles can be useful when you want to experiment with different formats. For example,
    assume you''ve formatted each of the headings in a large document with 24-point
    Bold Helvetica font. If you need to change all the headings to 20-point Italic
    Times font, it will take a long time to modify the document by.


    With a style defined for the heading, however, you can change the attributes of
    the style—and all the paragraphs marked with that style change immediately.


    The Style command allows you more power in quickly formatting a document.


    # Reviewing the Style Command


    Before you start using the Style command, here''s a look at a potentially confusing
    issue in StarOffice.


    If you click the right mouse button on any block of text, a formatting menu appears.
    Part of that menu includes a Style submenu (see Figure 9.8).


    This same type of information is shown in a different arrangement in the Character
    dialog box, which you can open from the Format menu by selecting Character, and
    then the Font tab (see Figure 9.9).


    Please note that both of these style settings (as shown in the preceding figures)
    define font characteristics for a selected block of text, from a character to
    an entire document. This is a great way to change small amounts of text at a time;
    it can be a problem, however, if you want to change all the headings in a document,
    for example. Don''t confuse these style settings with the paragraph styles described
    in this section.


    A better way to manage the look and feel of your document is to assign a predefined
    set of characteristics to a style name. You can then assign these style names
    to any text you choose, instead of changing one paragraph at a time, you can change
    them all at once by redefining the named style.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_192_0.png)'
  merge: -1
  pgno: 192
- img_proc: true
