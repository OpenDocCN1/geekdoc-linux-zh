    # Adding Another Printer Type


    To add a printer from the list of existing printers (for which StarOffice has
    some driver support), double-click on the printer name in the Existing printer
    drivers list. That printer is moved to the Installed printers list, where it can
    be configured for use.


    # Setting the Default Printer


    The default printer is the one to which StarOffice automatically prints when you
    have any document.


    To make one of the installed printers the Default printer, select that printer
    in the Installed printers list by clicking on it. Then choose the Default Printer
    button under the Installed printers list.


    # Changing the Print Queue Used by a Printer


    A print queue is a named location where files are to be printed are placed. You
    might find it useful to set up multiple print queues if you have a printer with
    regular and letterhead paper, or if several users are sharing a printer and you
    want to keep your print jobs separate.


    Any printer can be connected to any print queue. If printer A is connected to
    print queue B, when a user prints a file to print queue B, the physical device
    printer A (and its associated driver) is used to print the file.


    To set the print queue for any installed printer, follow these steps:


    +   1. Select a printer from the Installed printers list by clicking on it.

    2. Choose the Connect button. Figure 4.20 appears.

    3. Select an existing print queue from the list shown by clicking on it.

    4. Choose OK to connect this installed printer to the selected queue.


    The default name for the Linux print queue (which is used by default on the generic
    printer that is automatically installed) is lpr. You''ll see a definition for
    a print queue called lpr when you view the Connect dialog box. All the print queue
    definitions are taken from your Linux printing configuration file (usually /etc/printcap).'
