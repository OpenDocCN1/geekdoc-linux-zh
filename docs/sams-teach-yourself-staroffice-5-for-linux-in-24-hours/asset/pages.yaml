- img_proc: true
  md: '# Defining Database Terms


    Before describing the database features of StarOffice, some database terms are
    outlined to ensure that we''re all starting from the same point.


    Loosely defined, a database is a collection of organized information. A database
    can contain multiple tables or specific sets of information. For an example, Orders
    database might contain a table of customer information and a table of product
    information. You''ll often hear a single table referred to as a database when
    it''s not part of a larger dataset—that''s what we do in this hour.


    Each table consists of records, with each record being a data set, or tuple, if
    you''re familiar with some of the more formal database terminology.


    Each record is made up of fields, and each field is a distinct piece of information.


    Because a spreadsheet is being used as a database management program in this hour,
    the following generalizations can be made about what you''ll shown here:


    +   - A record is a row or part of row in the spreadsheet.

    - A field is a column in the spreadsheet.

    - A spreadsheet cell is a single field within a single record of the table or
    database.


    Here''s look at the sample data used to show about databases in StarOffice. Figure
    18.1 contains a table, organized as rows and columns, with a label at the top
    of each field.


    # FIGURE 18.1


    The sample data, organized in rows (records) and columns (fields).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_353_0.png)'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Using Database Functions


    From this sample, you can see that each record contains the name and address of
    a person.


    The fields that make up each record are


    +   * Name

    * Address

    * State

    * Zip Code


    Many other database terms are used when you work with a more formal database program
    such as Informix or Microsoft Access.


    Terms such as primary key and outer join apply to relational databases, but not
    to the less formal, flat-file databases that you can create and manage in a StarOffice
    spreadsheet.


    # Using Data Validation


    Data validation enables you to control what information is entered in each field
    of your database, and provide feedback messages as data is entered.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_354_0.png)


    > You can use the data validation procedures outlined in this section for single
    cells within a spreadsheet, but using them for fields within a database-style
    table of information is described here.


    Using data validation assumes two things:


    +   * You are working within a structured table that needs information to fit
    certain patterns in order to be useful.

    * Several people will be entering data in the table, or you want to be reminded
    of the restrictions that will make the data valid and useful.


    Looking at the sample table, you can immediately see two fields that require data
    of a certain format:


    +   * Information in the State field must be letters only (no numbers) and must
    be two characters (to match the standard U.S. state codes).

    * Information in the Zip field must be numbers only, and must be at least five
    characters (someone might enter a Zip+4 code, however).


    Data validation can be used to make certain that anyone entering data in these
    fields follows these rules to maintain the integrity of your database table.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Setting up Data Validation Criteria


    To set up criteria, rules, for how your data must be structured, you first must
    select the cells to which the data validation rules are to apply.


    For this example, the spreadsheet is dedicated to names and addresses table, so
    you can select the entire column to define a field to which you want to apply
    a data validation rule.


    +   1. Click on the column heading for column C to select the entire column of
    state information (see Figure 18.2).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_355_0.png)


    +   2. Select Validity from the Data menu. The Data Validation dialog box appears
    (see Figure 18.3).


    +   3. Choose the Values tab.


    +   4. Select Text Length from the Allow field drop-down list.

    The Allow field defines what type of data can be contained in the selected cells
    (the State field in this case).


    +   5. Select Equal from the Allow Data field drop-down list.

    The Data field defines how the cell entry is compared to a fixed value. (For example,
    all numbers greater than zero).'
