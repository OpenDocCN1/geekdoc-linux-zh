    ![](img/d07037173ed87c2b5a0d33ea3544eb75_378_0.png)


    # FIGURE 19.6


    The first information requested by the Presentation AutoPilot is your name, the
    company name, and the topic information for the presentation.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_378_1.png)'
