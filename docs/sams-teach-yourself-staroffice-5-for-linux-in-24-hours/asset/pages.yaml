    +   **Bookmarks**—Bookmarks are pointers to documents that you might want to view
    or edit again in the future. The bookmarks folder is similar to using bookmarks
    in any Web browser, but that in StarOffice you can also use bookmarks for local
    documents that you''re editing instead of just for documents on the Web.


    If you want to add a file that you''re viewing to the bookmark folder, just drag
    and drop the Link icon onto the Bookmark folder in the Explorer. (The Link icon
    is a folder with a triangle-flag on it, located just to the left of the URL window
