    4. Choose OK to insert the new rows or columns.


    You can also insert new rows by moving to the last cell of the table and pressing
    the Tab key. This method can be used only to add another row to the end of the
    table, however.


    Another quick method is to use the icons on the Object toolbar. The Insert Row
