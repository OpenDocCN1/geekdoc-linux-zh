  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_164_0.png)


    # HOUR 8


    # Formatting Your Document


    In this hour, you learn how to format your document. You''ll want to have a document
    open to use for the examples that are given (or just type in some text). The figures
    show sample text that has been typed in to demonstrate what is being described.


    Formatting determines what fonts are used and how they''re displayed, how lines
    and paragraphs are aligned, and how the page is arranged.


    More advanced formatting tools are described in Hour 9, "Using Advanced Formatting
    Tools," but you''ll quickly see that StarOffice provides a full set of formatting
    options. They''re even easy to use! Most of the StarOffice basic formatting options
    are the same as those in Microsoft Word or Corel WordPerfect.


    # Setting Character Styles


    The font in which a document is written gives it a certain feel when you read
    it; the font can make the document casual or business-like, or it can make the
    document easier or harder to read.'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'Fonts can be loosely grouped into fixed-spacing fonts, which are often used
    to indicate computer output, and proportional fonts, which are much easier to
    read. Also, fonts can be serif—with little ledges like the text you''re reading
    now—or sans-serif (French for “without serif”). Sans-serif fonts are good for
    headlines, but are considered more tiring for large amounts of text.


    The term font usually refers to the typeface, such as Times, Helvetica, or Courier.
    Other characteristics of the typeface—character attributes—are normally defined
    separately because they are used much more frequently.


    # Choosing a Font


    A font can be applied to an entire document, just to a paragraph, or even to a
    character. For example, the entire document might be in the Times font, but words
    that describe computer commands can be in Courier font.


    Before you enter text, you can select a font for the text that you enter. After
    you''ve entered text in a document, you can select the text that you want to appear
    in a different font and apply that font.


    To apply a new font to select text, follow these steps:


    +   Select the text to which you want to apply a font by either clicking and dragging
    the mouse pointer, or by holding down the Shift key and using the arrow keys.


    +   Choose Character from the Format menu. The Character dialog box appears (see
    Figure 8.1).


    > You can also select a font from the drop-down list in the Object toolbar, if
    that toolbar is displayed. However, you''re about to explore the other character
    formatting options, so use the dialog box for now.


    +   Select a font from the Font list. The Preview in the dialog box shows how
    your selected text looks in the font that you selected from the list.


    +   If you want the font to be sized differently than the surrounding text, choose
    a size from the Size list.


    +   Choose OK to apply the font and close the dialog box.


    Text sizes are displayed in points, a printers'' term you will become familiar
    with as you use StarOffice. Standard text is sized at either 10 or 12 points;
    headlines usually start at 14 points and go up from there.'
  merge: -1
  pgno: 165
