    for Linux™ in 24 Hours


    #  Get Started Now!\24 proven one-hour lessons


    In just 24 sessions of one hour or less, you will be up and running with StarOffice
    5 for Linux. Using a straightforward step-by-step approach, each lesson builds
    upon the previous one, now allowing you to learn the essentials of StarOffice
    for Linux from the ground up.


    +   Find your answer to:

    * Installing and configuring StarOffice

    * Importing and exporting files between applications

    * Creating and giving powerful presentations with StarImpress

    * Using StarOffice for all of your Internet needs including mail and news

    * Creating and formatting documents in StarWriter

    * Using the tools in StarOffice to create HTML

    * Keeping track of your life with StarSchedule


    > Nicholas Wells is an experienced author who began using Linux daily in 1994
    while working as a technical writer at Novell. Linux is his main desktop environment
    and is technically proficient in most aspects of UNIX. Nicholas started StarOffice
    3.1 when it first appeared for Linux in 1997, but now uses StarOffice as his working
    environment for word processing and spreadsheets.


    R. Dean Taylor has over 14 years of channel-marketing experience in the computer
    industry working for companies such as Sanyo/Icon, IBM, and Novell. He is currently
    responsible for channel marketing for Caldera Systems, Inc. Although he has extensive
    experience in the computer industry, this is his first experience in professional
    writing and has discovered it to be extremely rewarding.


