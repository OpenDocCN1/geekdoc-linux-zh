  md: '# Installing StarOffice


    The archive is not compressed (it is not in .tgz format) because it contains files
    that are already compressed. Don''t use the z option in your tar command.


    # Installing a Single-User Version of StarOffice 5


    StarOffice is installed by a setup program, just like most Windows programs with
    you may be familiar. After running a small script to install the correct system
    libraries in a StarOffice directory, you can run setup to install StarOffice.


    The network installation procedure is described in the later part of this hour.
    A network installation of StarOffice differs from a single-user installation only
    in the location of the StarOffice files and the capability of multiple users to
    run StarOffice at the same time.


    To install StarOffice, follow these steps:


    +   1. Log in as the user for which you are installing StarOffice, and start the
    X Window System if it isn''t already running.

    2. Open an extern command-line window.

    3. Change to the directory that contains the StarOffice archive that you downloaded:

    4. Change to the glibc2_inst directory:

    5. If you are running a tsh or (pd)ksh shell, start an sh shell (the StarOffice
    scripts were written for bourne-compatible shells):

    6. Start the StarOffice preparation script (note the dot-space-dot-space):

    7. Respond to the first prompt by entering the name of the directory in which
    the StarOffice libraries will be installed. This will be the lib/ subdirectory
    below where you intend to install the StarOffice program:


    ```

    $ cd /tmp/so50/1

    ```


    ```

    $ cd glibc2_inst

    ```


    ```

    $ sh

    ```


    ```

    $ ../soprep

    ```


    ```

    glibc2 directory [/opt/Office50/lib] ? /home/nwells/Office50/lib

    ```'
