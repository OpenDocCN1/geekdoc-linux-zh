  md: '# Setting Calculation Preferences


    The Calculation tab of the Spreadsheet Options dialog box enables you to set how
    the formulas in your spreadsheet are to be calculated by StarOffice. These options
    refer to mathematical and alphanumeric operations.


    ### FIGURE 13.17

    The Calculation tab of the Spreadsheet dialog box determines how some operations
    in formulas are performed.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_275_0.png)


    If you want to allow iterative formulas, check the Iterations check box. This
    enables self-referring formulas that reach a final value by process of iterating—or
    refining—the cell value. The iterative check box determines how many times the
    formula iterates.


    If the cell value doesn''t change at least much in the Minimum Change value field,
    the iteration process stops.


    The Date field is provided for compatibility with other programs or processes
    (including formulas) to which you might be accustomed. The difference in dating
    methods is only in where the dates begin. In the end, this isn''t something that
    most users need to worry about.


    The Decimal places is the default number of decimal places to display in a cell.
    Of course, you can increase or decrease the decimal places displayed in any cell
    with a mouse click. This is just the default value for all cells.'
