- img_proc: true
  md: '# Working with Tables


    Tables are a great way to organize data. When you need to present a list that
    has components that correspond to each other, a table can be the perfect presentation.
    It makes it easier for a person who is reading your document to scan the information
    quickly and to find relationships between parts of the data that you present.


    Tables are easy to start and edit in StarOffice, either from the menus or from
    the Object toolbar. In this hour, you learn how to work with both. When it seems
    appropriate, you also get a tip about how StarOffice compares with the operation
    of other word processors with which you might already be familiar.


    # Inserting a New Table


    Suppose you''re creating a document that discusses the languages used around the
    world. You want to insert a table that lists a few countries that you''re interested
    in and the languages spoken in those countries.


    To insert this simple table (which you''ll also use for further examples), follow
    these steps:


    +   1. Position your cursor where you want the table inserted.

    2. Choose Table from the Insert menu. The Insert Table dialog box appears (see
    Figure 10.1).


    FIGURE 10.1


    In the Insert Table dialog box, you can specify the size of a new table.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_203_0.png)'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Using Tables, Indexes, and Other Special Features


    +   3. Enter a table name in the Name field (you can leave the default name if
    you prefer).

    4. Enter the number of columns and rows that the table will contain in the corresponding
    fields.


    > This example creates a small table with two columns and five rows. You''ll expand
    it as you learn other table features.


    +   5. Choose OK to create the new table (see Figure 10.2).


