  md: 'The Stylist item on the Format menu—A miniature version of the Stylist is part
    of the Object toolbar. From the window that this item opens, you apply a named
    style to a block of text.


    # Opening the Stylist Window


    The Stylist window contains a list of named styles that are defined for the document
    you''re viewing. Each document can have a different set of named styles.


    > You can import styles from another document into the current document by using
    Load from the Styles & Templates submenu on the Format menu.


    From the Stylist window, you can apply any named style to a block of text in your
    document. You can open the Stylist window in one of three ways:


    +   - Click on the Stylist icon near the right end of the Function toolbar (see
    Figure 9.10).


    FIGURE 9.10


    The Stylist icon on the Format toolbar opens the Paragraph Styles window.


    The Stylist icon


    +   - Press the F11 key.


    > Depending on your keyboard mapping for X and your window manager or desktop
    configuration, pressing F11 might not open the Paragraph Styles window.


    +   - Select Stylist from the Format menu.


    In any case, the Paragraph Styles window opens (see Figure 9.11).'
