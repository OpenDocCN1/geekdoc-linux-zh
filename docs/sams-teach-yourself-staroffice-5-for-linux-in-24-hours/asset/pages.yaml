  md: '# Using the Explorer and the Desktop


    In the sections that follow, you learn how to move files between these two areas
    of StarOffice.


    # ## The Desktop Icons


    Several types of icons are included on the default StarOffice Desktop:


    +   * New documents—Double-clicking on any of these icons opens a new document
    of the named type. One example is the icon labeled New Spreadsheet.


    +   * HTML documents (Web pages)—These documents are related to the StarOffice
    home pages at StarDivision, the creator of StarOffice. One example of these is
    the icon labeled StarDivision.


    +   * Programs—can also be stored on the Desktop. One example is the icon labeled
    Printer setup, which runs the program setup.


    +   * Explorer links—Because some features, such as StarSchedule, can only be
    accessed via the Explorer, the Desktop includes to those items. One example is
    the icon labeled tasks, which opens the Task List screen (see Hour 24, "Using
    StarSchedule")


    The StarOffice Desktop isn''t just for these default files. On the Desktop you''re
    actually seeing the contents of a particular subdirectory on your Linux system.
    You can see this in the URL window of the function bar when you''re viewing the
    Desktop. The following URL is displayed (with your username, of course):


    ```

    file://home/dtaylor/Office50/Desktop/

    ```


    Because the Desktop is always quickly available by clicking on the Desktop icon
    in the lower-left of the status bar, storing your daily work files on the Desktop
    makes them easy to access.


    # ## Adding Your Documents to the Desktop


    You can add any of your documents to the Desktop so that you can immediately find
    them. Just follow these steps:


    +   *1. Make sure on the View menu that that both the Beamer and the Explorer
    windows are open.


    +   *2. In the Explorer window, open the Workplace folder.


    +   *3. Within the Explorer window, browse in the Beamer until you locate the
    work file that you want to move to the Desktop.


    +   *4. Click and drag the file''s icon from the Beamer, dropping it on the Desktop
    (see Figure 3.8).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_76_0.png)'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# FIGURE 3.8

    The StarOffice Desktop with a user file added.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_77_0.png)


    > When you move a file to the Desktop, you''re moving the actual file to a different
    subdirectory. Use the same drag-and-drop procedure when you want to move the file
    off the Desktop. Deleting the file from the Desktop erases the file from your
    system.


    When you drop an icon onto onto the Desktop, sometimes it doesn''t appear on the
    Desktop even though the file has been moved. To refresh the Desktop display, choose
    the Display Details icon from the Object toolbar. When you choose the Display
    Icons icon on the toolbar, the new file appears on the Desktop.


    You can add many files to your Desktop, arranging them to suit your work needs.
    You can even delete some of the help files on the Default Desktop and use the
    Help menu instead when you need to open an Online Help file. Figure 3.9 shows
    a sample Desktop with a collection of personal files.'
  merge: -1
