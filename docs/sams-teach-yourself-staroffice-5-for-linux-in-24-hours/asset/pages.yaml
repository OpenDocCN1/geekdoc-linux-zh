- img_proc: true
  md: '# Creating Presentations with StarLimpress


    # FIGURE 19.8


    Select a design style and a duration for your presentation.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_380_0.png)


    9. Click the Next>> button to continue. In the next section, shown in Figure 19.9,
    select a presentation medium: paper, overhead transparency, or 35mm slide. The
    medium that you select determines which types of graphics are used in the presentation.


    # FIGURE 19.9


    Choose a medium for your presentation so that graphics and pages are sized optimally.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_380_1.png)'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'If you intend to use your presentation directly from your computer (running
    a slide show as described in Hour 21), choose Overhead as the medium.


    10. Click Next>> to continue, and then click Create to finish the presentation.
    After a moment, the first slide appears onscreen, as shown in Figure 19.10.


    # FIGURE 19.10


    A presentation set by the AutoPilot includes slides for each of your topics.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_381_0.png)


    You might not always like the results of an AutoPilot presentation, but they can
    be edited normally after they''re first created—and it''s a very fast way to get
    started.


    # Creating Individual Slides


    After you have a layout or presentation template onscreen, you''re ready to enter
    the information that you actually want to present.


    StarOffice uses a layout for each slide to simplify and organize the placement
    of text and objects on the slide. You can add information in other locations,
    but the layouts make basic text entry much easier.'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# Adding a Layout to a Slide


    If you used either the New Presentation icon or a background layout from the set
    of Presentation Layouts, your screen shows a blank or graphical slide with no
    indication of how to proceed. Choose Slide Layout from the Format menu. The Modify
    Slide dialog box appears. (See Figure 19.11).


    Figure 19.11

    The Modify Slide dialog box contains graphical representations of content styles
    that can be applied to the current slide.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_382_0.png)


    From the set of AutoLayout pictures, click on the one that matches how you want
    the current slide to look. For example, if you want a single headline with bullets
    underneath (a common choice), click on the middle picture in the second row.

    Other choices indicate that slides include text in columns, charts, graphics,
    tables, and every combination of these elements. Completely empty slides (totally
    or in part) can be used to provide space for other creative things that you want
    to do with imported objects or with the drawing tools (see Hour 20, "Adding Graphics
    and Charts to Your Presentation").


    When you''ve selected the best layout, click OK. The current slide now includes
    the layout that you selected (see Figure 19.12).'
  merge: -1
  pgno: 382
- img_proc: true
  md: '# FIGURE 19.12


    An AutoLayout applied to a slide provides guided areas for you to enter information
    on a slide.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_383_0.png)


    The AutoLayouts show you what to do next. Each block in the layout includes an
    instruction to Click and add a title, double-click to add a document or chart,
    or something similar.


    > If you don''t use one of the areas in the AutoLayout, the instructions and outlined
    boxes that you see onscreen do not appear in your slide presentation. They are
    only there as a reference while you enter information.


    You can use the Slide Layout dialog box at any time to change the layout of the
    current slide. StarOffice tries to fit any existing text into the areas of the
    newly-selected layout.


    # Inserting a New Slide


    As you create your presentation, you''ll need to add new slides for each topic.
    Even if you used the AutoPilot or a presentation template, you might need to insert
    an additional slide or two.


    To add a slide, choose Slide from the Insert menu. The Insert Slide dialog box
    appears. In this dialog box, select the layout of the slide that you want to insert.
    (This dialog box looks just like the one used to modify the layout of an existing
    slide.)'
  merge: -1
  pgno: 383
- img_proc: true
  md: '# Creating Presentations with StarlImpress


    New slides are always inserted after the current slide.


    After a slide is inserted, you can add and edit text on it just like any any other
    slide in your presentation.


    # Entering Text on a Slide


    With the helpful hints scattered throughout the slide layouts, entering information
    on a slide isn''t very challenging. The large-type instructions such as Click
    to add title, for example, don''t leave much to the imagination.


    After you have entered text, you can click on any block of text to select that
    block and begin editing it. A cursor in the block indicates that it can be edited.(See
    Figure 19.13.)


    FIGURE 19.13


    Text within a slide can be edited by clicking on the text. The block is selected,
    and an editing cursor appears.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_384_0.png)'
  merge: -1
  pgno: 384
- img_proc: true
  md: 'The green handles around the text block can be used to adjust the block in
    which the text sits. You can do any of the following:


    +   - Click in the center of the text box and drag it to a new location.


    > The layouts have all the text boxes centered and aligned. Moving them to a new
    location on the slide might not work well with graphics or back-ground elements
    on the slide.


    Click on any green handle to expand or contract the size of the text box.

    The size of the text box doesn''t affect the size of the font used for text. It
    does, however, affect how much text is visible on the slide and how the text is
    arranged. For example, making a title box longer allows more letters to fit on
    one line before the title wraps to a second line


    # Adjusting Paragraphs


    Each slide within a presentation is almost like a separate document. Text doesn''t
    flow from slide to slide like pages in a word processing document. Instead, text
    is arranged in individual paragraphs. Each paragraph is one of the blocks of text
    that you click on to add or edit text. If the paragraph is too long for the slide,
    the extra text is cut off and won''t appear in your presentation.


    For example, in many slides the title of the slide is one paragraph and the bulleted
    list that follows is a second paragraph.


    Because these paragraphs reside in text boxes that can be moved or adjusted with
    the green handles described in the previous section, paragraphs in a presentation
    don''t have margins. You just move and resize the text box to the location on
    the page where you want the text.


    You can, however, set up some features of each paragraph of text. With a block
    of text selected (with a heavy outline and green handles around it), select Paragraph
    from the Format menu. The Paragraph dialog box appears (see Figure 19.14), but
    with three tabs instead of the eight tabs that appear when you''re working in
    a StreamWriter processing document.


    In the Indents and Spacing tab, you can set up automatic indents for lines in
    the selected block of text. You can also define if text is single- or double-spaced.
    These options are useful for larger blocks of text, which don''t frequently occur
    within slides.'
  merge: -1
  pgno: 385
- img_proc: true
  md: '# Creating Presentations with StarLimpress


    In the Alignment tab (see Figure 19.15), you can define the current block of text
    as center-, left-, or right-justified. This is very useful for titles and some
    summary information.


    # FIGURE 19.14


    Each block of text on a slide can be edited from the Paragraph dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_386_0.png)


    # FIGURE 19.15


    The Alignment tab enables you to justify text in the current paragraph.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_386_1.png)'
  merge: -1
  pgno: 386
- img_proc: true
  md: 'Finally, in the Tabs tab (see Figure 19.16) you define tab stops for each of
    the lines of text in the paragraph. This is used for setting up columns of figures
    or tables within a block of text.


    # 19.16


    Tab stops can be used to set up table-like formats or columns, figures, or names.
    An embedded spreadsheet can often replace these options, however.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_387_0.png)


    Because StarOffice enables you to import charts from spreadsheets and to include
    minispreadsheets, setting a lot of tab stops won''t often be necessary.


    # Setting Font Options


    Reason font choices are part of the pre-defined layouts and templates in StarOffice.
    However, if you want to change fonts or add effects as you do in a word processing
    document, it''s easy to do.


    To select a block of characters that you want to format, first select the entire
    paragraph that contains the characters. With a paragraph selected and a cursor
    in that paragraph, you can use the arrows keys with the Shift key, or drag your
    mouse pointer, to select words that you want to reformat.


    With characters selected within a paragraph, choose Character from the Format
    menu. The Character dialog box appears (see Figure 19.17).'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# Creating Presentations with StarlImpress


    FIGURE 19.17

    Individual characters or words can be formatted within a slide using the Character
    dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_388_0.png)


    Using this dialog box, you can choose a font and font size, and standard or advanced
    font effects.


    You remember from previous hours that most of the character formatting tools appear
    on the Object toolbar whenever you start editing text. For example, when text
    is selected within a slide, you can perform any of the following actions from
    the Object toolbar:


    +   * Set bold, italic, or underlined text.

    * Choose a font and font size.

    * Set justification for the text (for example, centered).

    * Set single- or double-spaced text.

    * Choose a color for the selected text.


    Using the Object toolbar is often the most convenient way to format text, but
    not everything can be done from the toolbar. Some formatting, such as indents
    and superscripts, are generally done in the Character dialog box.


    # Saving Your Presentation


    Although this topic is listed in this hour, you need to save your presentation
    with a unique name before you enter the first line of text on the first slide.'
  merge: -1
  pgno: 388
- img_proc: true
  md: 'To save a presentation, use the Save As item on the File menu. The now-familiar
    Save

    As dialog box appears. (See Figure 19.18.)


    # FIGURE 19.18


    The Save As Dialog

    box enables you to

    choose a new name for

    the presentation that

    y''re creating.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_389_0.png)


    Enter a name for your file and select the directory to which it will be saved.
    Then choose

    The Save button.


    After you save your presentation with a name, you can quickly update your saved

    presentation on disk at any time with a keystroke: Ctrl+S.


    > Starlimpress 5.0 is the default format. If you need to read this presentation

    in another program, export it to another format, as described in the next

    section.


    # Exporting Slides in Graphics Formats


    Despite our interest here, Starlimpress is not a well-known presentation format.
    If you

    need to work with your presentation in another program, plan to export your presentation

    in another format.


    For both documents and spreadsheets, the StarOffice Save As dialog box includes

    several formats from which you can choose. For example, a text document can be
    saved

    as a Word 97 or an RTF file.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# Creating Presentations with StarlImpress


    Presentations use the Export dialog box instead of the Save As dialog box. Exporting
    in graphics format as GIF, BMP, or JPEG creates a single graphics file for the
    currently-displayed slide.


    To create a graphic version of a slide, follow these steps:


    +   1. Choose Export from the File menu. The Export dialog box appears; this dialog
    box looks just like the Save As dialog box except for the default directory and
    the file types available.

    2. Select a graphics format from the File Type drop-down list.

    3. Enter a filename for the slide that you are exporting as a graphic (by default,
    the correct graphics format extension is added automatically).

    4. Choose Save. For most formats, another dialog box appears and asks questions
    to the selected graphics format. For example, Figure 19.19 shows the BMP-specific
    dialog box.


    FIGURE 19.19


    Exporting a slide as a BMP graphic opens a dialog box with graphics-specific questions.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_390_0.png)


    +   5. Answer the questions in the dialog box (if one appears) and choose OK to
    complete the export process.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# Exporting as a Web Presentation


    Although StarOffice can''t export presentations in PowerPoint format, it can export
    in HTML format, so your presentation can be viewed in any Web browser.


    Exporting in HTML creates a set of files with names based on the name you enter
    as an export filename. To export a presentation in HTML format, follow these steps:


    +   - Choose Export from the File menu. It doesn''t matter which slide you''re
    viewing when you export in this case because the entire presentation is exported.

    - In the Export dialog box, choose HTML from the File Type drop-down list.

    - Enter a filename for the HTML document.


    > Make the first part of the filename that you enter recognizable. Because each
    slide is a separate HTML file, StarOffice creates many filenames based on the
    name that you enter, chopping off part of it and adding numbers to the end of
    each filename.


    +   - Choose Save. The HTML Export dialog box appears (see Figure 19.20).

    - Choose a resolution for the graphic part of the HTML pages (the slides themselves).
    The higher the resolution, the larger the graphic image files are.

    - Choose OK to finish exporting to HTML.


    When you have finished exporting, you can use a browser, or StarOffice, to read
    the first file of the set of HTML documents for your presentation.


    For example, if you name your exported file Travel, StarOffice names the pages
    Travel_0. The first slide is Travel_1, which you can load as shown in Figure 19.21.
    Notice that a Continue link takes you to the next slide. (Low resolution has been
    used for these files so that they fit onscreen in StarOffice.)'
  merge: -1
  pgno: 391
