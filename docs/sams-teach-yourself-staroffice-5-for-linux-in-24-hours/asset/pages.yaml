  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_46_0.png)


    # HOUR 2


    # Getting Started

    StarOffice


    In this hour, you will learn how to start StarOffice, as well as some hints for
    using StarOffice within several popular Linux graphical systems.


    After you learn how to start StarOffice, you will learn some basics about the
    layout of the StarOffice window and how to start navigating around it as you create
    your documents.


    # Starting StarOffice


    Starting the StarOffice program is like starting any other program in Linux. You
    just enter the name of the program on a command line. There are two rules:


    +   1. You must be running the X Window System—the graphical interface to Linux.
    If you''re in character mode, StarOffice can''t run. It''s strictly a graphical
    program.'
