    ![](img/d07037173ed87c2b5a0d33ea3544eb75_35_0.png)


    > If you have KDE on your system, choose the Custom installation option to automatically
    add StarOffice to your KDE menus. Details are provided in the next section.


    If you don''t have much space, you can choose the Minimum Installation button.
