- img_proc: true
  md: '# HOUR 6


    # Creating Graphics with StarDraw


    In this hour, you learn how to create vector-based graphics using the StarDraw
    tools in StarOffice. The drawing and editing tools of StarDraw are explained,
    as are adding text and modifying colors in the graphic images that you create.


    # Vector and Raster Graphics


    The first thing that needs to be explained before using StarDraw to create a graphic
    is the difference between a vector-based graphic image and a raster-based (also
    called bitmapped) graphic image.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_130_0.png)'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Raster images


    Most of the images you''ve seen, such as computerized photos and graphics on the
    Web in GIF for JPEG format, as are raster graphics. These can be created in raster,
    or bitmap, drawing programs such as Adobe Photoshop, PaintShop PRO, CorelPAINT,
    or the Image Editor in StarOffice (see Hour 11, “Adding Graphics to Documents”).


    If you have created graphics using programs such as CoreDRAW, the GIMP, or Adobe
    Illustrator, you''ve used vector drawing programs.


    What''s the difference? A file containing a bitmapped graphic image contains a
    piece of information for each pixel (bit) in the image. Every line, or raster,
    in the image must be described in this way, with color, brightness, and other
    information stored for each pixel.


    Of course, the information stored for all bits can be compressed. Using fewer
    colors requires less space to describe each bit, and areas that are the same color
    can be compressed using file formats as GIF and PCX. The information for each
    pixel is still extracted when the image is displayed.


    Raster graphics are best for photos, scanning the Web, and very small images such
    as icons. Raster graphics are easier to work with and display in a computer than
    vector-based images.


    # Vector Images


    Vector-based images describe how to draw an image on a blank page. So instead
    of a set of color information for every dot on the screen, a vector image might
    have the following-instructions:


    +   1. Draw a circle at center point 100,150 and with a radius of 50 pixels, and
    fill it with color number 12.

    2. Draw a line from point 25,25 to point 100,25. Make it black, and 5 pixels wide.


    These examples of drawing commands can be stored in a vector drawing program using
    very little space. Using vector drawing commands also means that the image can
    be scaled to any size without seeing the stairstep or pixelation that comes from
    resizing bitmaps images.


    Of course, it isn''t easy to describe a photograph of a castle using drawing commands
    like these—but the commands get a lot more complicated than you might think. Bitmapped
    images are the best choice for some things, but for many business graphics applications,
    vector graphics are the right choice.'
  merge: -1
