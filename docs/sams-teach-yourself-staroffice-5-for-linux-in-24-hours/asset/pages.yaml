    \nFor example\n\n# FIGURE 20.3\n\nWhen you select an Interaction for a graphic\
    \ on a slide, you must define the parameters of that action.\n\n![](img/d07037173ed87c2b5a0d33ea3544eb75_399_0.png)\n\
    \nThe slide titles in a presentation can be listed so that you can choose which\
    \ slide to go to when the selected graphic is clicked."
