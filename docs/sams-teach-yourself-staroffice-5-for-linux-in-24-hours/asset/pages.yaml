    # Turning Grid Lines On or Off


    When you print spreadsheets in StarOffice, you can also choose from other options
    that define what parts of the spreadsheet are printed.


    Each of these are selected individually in the Page dialog box (choose Page from
    the Format menu while viewing a spreadsheet), in the Sheet tab.


    The following options are listed in the dialog box. You can select whether each
    one prints:


    +   **Column and Row Headers**—Include the alphanumeric labels on columns (such
    as column D). When you include these labels, you can troubleshoot your spreadsheet
    by checking formulas and references to actual cells in the sheet.

    * **Grid**—The grid in the spreadsheet is made up of the vertical and horizontal
    lines that separate cells. If you''ve turned on shading or other formatting (such
    as borders on some cells), you might not want the grid labels in the way.

    * On the other hand, if you have a complex or busy spreadsheet, the grid lines
    make it much easier to read.

    * **Formulas**—Printing formulas means that instead of printing the results of
    a formula, the behind-the-scenes instructions are printed. For example, instead
    of $23,419'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Creating Spreadsheets with StarCalc


    the formula that generated the number is printed—perhaps something similar to
    the following:

    =sum(D7:D28)


    If you''re reviewing your spreadsheet design or looking for potential errors before
    you pass on your work, printing the formulas enables you to check how the sheet
    is put together.


    Printing Formulas works best if you also print Column and row Headers. That way
    you can see which cells a formula refers to.


    +   **Notes**—You can add a note to any cell in your spreadsheet (just choose
    Note from the Insert menu). If you choose to print notes, they are added to your
    printed pages as footnotes in a report. If notes are not printed, they are visible
    only when you view the spreadsheet onscreen.


    +   **Charts**—Charts that have been imported or created in your spreadsheet can
    add a lot visually, but they take a lot of time and toner to print. While you''re
    in the draft stages of preparing a spreadsheet, you can choose not to print Charts.


    +   **Zeros**—Sometimes it''s important to distinguish between cells that have
    values of zero and cells that are empty (no data entered). This option enables
    you to have StarCalc indicate in your printed pages the cells in which a zero
    value occurs. A zero can be typed in or be the result of a formula calculation.


    After you have chosen items to print, choose OK in the dialog box to set those
    options.


    # Choosing the Page Format


    As with text documents, you need to correctly define the overall page layout that
    you''ll be using. This amounts to the two things above all:


    +   * Landscape or portrait size (long or tall pages)

    * Page size


    You can decide on landscape or portrait depending on the layout of the spreadsheet
    you''re preparing. Use whatever fits the shape of the data best.


    Both of these options can be set in the Page Style dialog box. Just follow these
    steps:


    +   1. Choose Page from the Format menu.


    +   2. Click on the Page tab in the Page dialog box. (See Figure 13.10.)


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_268_0.png)'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# FIGURE 13.10


    The Page tab of the Page dialog box enables you to set paper size and print orientation.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_269_0.png)


    +   3. In the Paper format part of the dialog box, check that the page size drop-down
    list displays Letter. (Select Letter if it doesn''t.)


    +   4. To the right of the page size field, click on the Landscape or Portrait
    buttons to change the print orientation.


    > The results of your changes in this dialog box are shown graphically in the
