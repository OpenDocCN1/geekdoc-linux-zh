- img_proc: true
  md: '# FIGURE 9.7


    A sample document with columns and a line defined between them.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_190_0.png)


    The document shows outlines for columns that you''ve defined. As you type, the
