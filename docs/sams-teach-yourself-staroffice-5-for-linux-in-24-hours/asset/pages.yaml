    the Explorer to set some options for Events and Tasks. For that reason, the Explorer
    is used for the examples. Using the Desktop icon and leaving the Explorer closed
    leaves more space for the events or tasks, of course.


    StarSchedule also works with servers and users on your network. You can select
    other computers on the network and view the calendar schedule for users on that
    computer. You must have permission, and you can only view public events, however.


    All the StarSchedule components are shown in Figure 24.1 as they appear in the
    Explorer. You can right-click on any of these components to set various options,
    the sections that follow describe. In particular, the pop-up menu opens a dialog
    box where you can review how that component is set up.


