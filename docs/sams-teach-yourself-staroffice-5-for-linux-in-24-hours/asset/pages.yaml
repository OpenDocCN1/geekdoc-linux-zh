    ![](img/d07037173ed87c2b5a0d33ea3544eb75_273_0.png)


    # Adding a Grid to a Spreadsheet


    When you use a spreadsheet, you probably think of the grid as the lines that divide
    the cells in the sheet. When you select printing options in the Page dialog box
    under the Format menu (in the Sheet tab), the grid *does* refer to the lines between
    cells.


    In StarOffice, however, you can also turn on a grid of closely spaced dots to
    help you create or place charts or other objects within the spreadsheet. This
    is the grid that you''re setting options for in the tab of the Spreadsheet Options
    dialog box (shown in Figure 13.15).


    Most of the time you won''t want to use this grid at all. If you do, select the
    Visible grid check box. Checking the Snap to grid check box forces objects that
    you create or insert to be aligned on the grid points. A spreadsheet with a visible
    grid is shown in Figure 13.16.'
