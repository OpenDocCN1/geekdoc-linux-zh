  md: '# # StarOffice FOR LINUX

    in 24 Hours


    To...


    | To | PAGE |

    | --- | --- |

    | Add a border to a graphic | 214 |

    | Add a hyperlink to a document | 428 |

    | Add the sales chart to your presentation | 311 |

    | Adjust the width of column | 302 |

    | Check for spelling errors | 219 |

    | Configure a printer | 87 |

    | Create a new graphic | 205 |

    | Create a web page | 419 |

    | Create an outline | 197 |

    | Enter text on a slide | 363 |

    | Filter data records | 339 |

    | Format a chart | 314 |

    | Format your document into columns | 262 |

    | Get document to print to one page | 244 |

    | Give my presentation | 389 |

    | Import exporting documents | 89 |

    | Learn the layout of StarOffice | 465 |

    | Obtain a license key | 8 |

    | Print my document | 242 |

    | Review StarOffice system requirements | 5 |

    | Schedule an appointment | 478 |

    | Send an email | 454 |

    | Use formulas in a spreadsheet | 275 |

    | Use StarOffice sample documents | 89 |

    | Utilize the Explorer windows | 45 |


    | HOUR | TITLE | CONTENT |

    | --- | --- | --- |

    | 1 | Installing StarOffice | How to install the necessary libraries and the program
    for both network and single-user |

    | 2 | Getting Started with StarOffice | Integrating StarOffice with your window
    and manager to know the layout of the interface |

    | 3 | Using the Explorer and the Desktop | How to use the Explorer and features
    of the desktop |

    | 4 | Configuring StarOffice | Configuring toolbars and acting up printers and
    other global options |

    | 5 | Importing and Exporting StarOffice | How to make StarOffice Documents work
    with existing files |

    | 6 | Creating Graphics in StarDraw | How to create and modify graphics with the
    new StarDraw program |

    | 7 | Creating a New StarWriter Document | Covers creating, saving, and printing
    documents |

    | 8 | Formatting Your Documents | Covers basic text and document formatting |

    | 9 | Using Advanced Formatting | Add footnotes and columns to your document |

    | 10 | Adding Graphics to Documents | Work in outline mode to help you organize
    your thoughts and text |

    | 11 | | How to import and manipulate graphics in your documents |

    | 12 | Using SpellCheck and the Thesaurus | StarWriter has very powerful set of
    features to help you sure your work is not mistake |

    | 13 | Creating Spreadsheets with StarCalc | Covers creating, saving, and printing
    spreadsheets |

    | 14 | Entering Spreadsheet Data | Shows how to enter and manipulate data in a
    spreadsheet |

    | 15 | Using Formulas and Functions | Use StarCalc''s formula and functions to
    help you analyze and report on your data |

    | 16 | Formatting the Spreadsheet | How to change the font style and size as well
    as number formats |

    | 17 | Adding Charts and Graphics to Spreadsheets | Make your data tell a more
    interesting story |

    | 18 | Using Database Functions | Learn to use StarOffice''s database capabilities
    |

    | 19 | Creating Presentations with StarImpress | StarImpress is a very powerful
    presentation package; this covers how to get started |

    | 20 | Adding Graphics and Charts to Your Presentation | Use space with graphics
    and color |

    | 21 | Formatting and Presenting Your Slide | Arrange your slides and add transitions
    to help make your presentation more interesting |

    | 22 | Creating Internet Documents with StarOffice | Browse the web and create
    HTML documents with StarOffice |

    | 23 | Using StarOffice Email and News Features | Set up access to your favorite
    newspapers and email servers |

    | 24 | Using StarSchedule | How to manage appointments and tasks for yourself
    and a group of people'
