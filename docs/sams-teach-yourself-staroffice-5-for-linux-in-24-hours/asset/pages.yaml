  md: '# HOUR 4


    # Configuring StarOffice


    In this hour, you learn how to set options that affect working environment in
    StarOffice. That environment includes defining what items are included on your
    menus and toolbars, as well as special features such as auto-spellchecking.


    Options that affect specific document types such as spreadsheets or HTML documents
    are discussed in the hours that describe working with those document types.


    All the global options described in this hour are set from the Tools menu, and
    most are part of the Configure or Options items.


    # Changing What''s on the Menus and Toolbars


    StarOffice provides more flexibility than you will probably ever want. Almost
    everything you see on the screen can be changed to fit your work environment and
    preferences.'
  merge: -1
  pgno: 86
