  md: '# FIGURE 22.11


    Hyperlinks can be added to any block of text by specifying a link address in the
    Character dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_452_0.png)


    # FIGURE 22.12


    Hyperlinks within text are shown in pop-up boxes whenever you move over a hyperlink
    phrase.


    The first part of the phrase defines the protocol that you use. The second part
    is the server. If you are using a server, you can leave this part blank, or specify
    the server name and port number for each protocol.


    For example, the server might be something like www.example.com, and the port
    might be something like 80 for http.


    # Hyperlinked phrase


