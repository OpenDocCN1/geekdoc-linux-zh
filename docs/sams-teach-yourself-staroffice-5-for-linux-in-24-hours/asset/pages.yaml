  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_312_0.png)


    # HOUR 16


    # Formatting Your Spreadsheet


    In this hour, you will learn how to change the formatting of your spreadsheet.


    The look of a StarCalc spreadsheet is almost as flexible as a StarWriter document.
    This hour describes how to set text attributes such as boldface, colors, and currency
    style. In addition, you''ll learn how to add and delete rows and columns, and
    to use some other StarOffice features that make viewing and arranging your spreadsheet
    more convenient.


    # Changing Fonts and Sizes


    When you write a report, you use headlines, special fonts, and italic and bold
    text to help get your point across. A spreadsheet is no different. The information
    that you are communicating needs to be easy to access and appealing—even attractive.'
  merge: -1
