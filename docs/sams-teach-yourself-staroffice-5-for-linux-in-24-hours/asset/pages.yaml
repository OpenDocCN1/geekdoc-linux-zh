  md: '# Installing StarOffice


    If you selected the Standard or Minimum installation options and choose Next,
    the screen in which you select components of StarOffice, described in the following
    screen, does not appear.


    # Using the Custom Installation Option


    If you enjoy setting things yourself, you can choose the Custom Installation option.
    When Custom Installation is selected, the screen that appears after the installation
    directory is chosen enables you to select which components of StarOffice to install.
    (See Figure 1.6).


    FIGURE 1.6

    The Custom Installation option enables you to select which components of StarOffice
    you want to install.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_36_0.png)


    From this screen, you can select which components you want to install. Clicking
    on a plus sign opens a sub-list of components. The icons are used to indicate
    which components are selected:


    +   * A solid color indicates that all of that component is selected for installation.

    * A fuzzy color indicates that part of list of components will be installed.

    * An empty (black outlined) icon indicates that the component will not be installed.


    StarOffice uses the same set of underlying functionality for the word processor,
    the spreadsheet, the presentations software, and so on. If you leave out a key
    section, none of these will function. Instead, you can save space by selecting
    sample documents, templates, help files, and so on which you want to install.'
