    ![](img/d07037173ed87c2b5a0d33ea3544eb75_318_1.png)


    Left Center


    Right Full


    FIGURE 16.10


    Selected cells can also have their contents placed against the top or bottom of
    the cell border, or vertically centered in the cell.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_318_2.png)


    Center Top Bottom


    > Knowing how to set justification on cells is important because StarOffice sets
    justification automatically to the right side for words and to the left side for
    numbers, which might not fit how you want to look.


    > Remember, if you leave the mouse pointer over a button for seconds, a small
    pop-up help dialog box tells you what the button is used for.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Setting Number Formats in Cells


    Formatting cells involves more than just the font and size of the numbers. Formatting
    also determines how numbers in cells are arranged according to the information
    they represent. For example, sales figures, scientific data, and baseball scores
    are all numbers. But they all look quite different.


    Setting a number format for a cell determines how the number entered in that cell
    is displayed. StarOffice provides several convenient ways to select common formats,
    as well as more advanced features for less-used formats.


    # Using the Object Bar to Set Number Formats


    For example, suppose you need to enter a set of sales numbers. You can enter a
    column of figures like the one shown in Figure 16.11.


    FIGURE 16.11


    A column of sales figures can be entered to represent dollar volumes.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_319_0.png)


    But these don''t look much like sales figures. Select the cells in which you entered
    the sales numbers. Now press the "money" button (StarOffice calls it the Currency
    button, but we like our name better). It looks like a little stack of coins on
    the Object Bar (see Figure 16.12).'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Formatting Your Spreadsheet


    FIGURE 16.12


    The Currency button formats cells as dollar amounts.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_320_0.png)


    The selected cells are immediately formatted with a dollar sign and two decimal
    places (see Figure 16.13).


    FIGURE 16.13


    A column of numbers can be formatted as dollar amounts with the currency button
    on the Object bar.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_320_1.png)


    A similar button, next to the Currency button, formats numbers as percentages
    (for example, .56 is displayed as 56.00%).


    # Adjusting Decimal Places


    One feature of number formatting that you might want to adjust for many types
    of figures is how many decimal places are displayed.


    Two buttons on the Object Bar increase or decrease the number of decimal places
    on all selected cells. These buttons are shown in Figure 16.14.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# FIGURE 16.14


    The number of decimal places can be increased or decreased from these buttons
    on the Object Bar.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_321_0.png)


    For example, enter this number in a cell, press Enter, and then click on the cell
    to give it focus again:


    45


    Now press the Increase decimal button (the one on the left in Figure 16.14) three
    times. The cell displays


    45.000


    Now type this number in the cell, press Enter, and click on the cell to give it
    focus again:


    45.724


    When you press Enter, the cell immediately displays


    45.72


    because the default cell setting is for two decimal places. If you press the Decrease
    decimal button twice, the cell displays


    46


    Notice that the number is rounded, not just cut off. Pressing the Decrease decimal
    button again has no effect because these buttons only round below the decimal
    point.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Using the Number Formatting Dialog Box


    All these number formatting operations on the Object bar are actually shortcuts
    for things you can do from the Cell Attributes dialog box.


    Open the Cell Attributes dialog box by selecting Cells... from the Format menu,
    and then selecting the Numbers tab (see Figure 16.15). From this dialog box you
    can set many options for how numbers are displayed.


    Figure 16.15

    Numbers can be formatted in many different ways within the Numbers tab of the
    Cell Attributes dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_322_0.png)


    These options are as follows:


    +   - The category field determines the overall characteristics of how the number
    in a cell is formatted, such as whether a percentage sign or dollar sign is included,
    or whether scientific notation is used.

    - The Format field determines how digits and decimal places in that category are
    formatted, for example, how many decimal places are displayed, and how negative
    numbers are displayed.

    - The Options section includes a field in which you can set the number of decimal
    places explicitly.

    - A checkbox enables you to select whether negative numbers are displayed in red
    onscreen (and on a color printer if you have one).'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'As with other StarOffice dialog boxes, a Preview window shows you how

    the current cell looks when formatted with the current selections in the

    Numbers tab.


    # Adjusting and Inserting Rows and Columns


    If you''re like the rest of us, creating spreadsheets often includes discovering
    that you

    did''t leave enough space for your data, or that you left too much space between
    sec-

    tions of your information.


    Setting row height and column width enables you to fit the spreadsheet to the
    data

    you''ve entered.


    Inserting and removing rows and columns enables you to add or remove unused space
    to

    make your data fit the spreadsheet.


    # Adjusting Row Height and Column Width


    Row height adjusts automatically to the tallest characters on the row. You can
    also adjust

    the height you choose, however.


    Column width, on the other hand, always has to be adjusted manually to accommodate

    longer numbers or text labels.


    First, play with the row height. If you want to change the row height from the
    height

    that''s automatically chosen, follow these steps:


    +   1. Choose Row height from the Format menu, and then Height from the Row submenu.
    The

    Height dialog box appears (see Figure 16.16).

    2. Selecting default value changes the row height to the default of 0.19 inches.

    3. Enter a new height value in the Height field.

    4. Choose OK to apply the new height to the current row.


    The Optimal Height dialog box enables you to add a little extra space to the

    automatic height of rows (based on font size). Choose Optimal Height from

    the Row submenu under the Format menu.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_324_0.png)


    Setting column width to match the width of lines of text or numbers is more useful
    than setting new row heights. By setting the width to match your data, you can
    keep your spreadsheet looking good while also keeping track of how it will be
    printed (by using the Print Area and Fit to Page features).


    If your columns aren''t wide enough for the text that you enter in a cell, the
    text is simply cut off, often mid-character.


    If your columns aren''t wide enough for the numbers that you enter, or are calculated
    from the formulas that you use, StarOffice displays these characters in the cell:


    ###


    The numbers are still stored in the cell, but you can''t read them (onscreen or
    on paper) until you make the column wider. To see the value contained in an undersized
    cell, you must select that cell and read the Input line above the mouse.


    The easy method of adjusting the column width is to use the mouse. Follow these
    steps:


    +   1. Move the mouse pointer to the right edge of the column letter label (see
    Figure 16.17).'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# FIGURE 16.17


    Click on the right edge of the column label to adjust column width.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_325_0.png)


    Click here to adjust the width of column B


    +   2. When the mouse pointer changes to a side-by-side double-headed arrow, click
    the mouse button and move it to the right for a wider column, or to the left for
    a narrower column.


    > A pop-up message tells you the width of the column as you resize it.


    +   3. Release the mouse button.


    > If you select several columns before resizing, all the selected columns are
    resized to the same size.


    Row height can be set in the same way by clicking and dragging on the row labels
    on the left edge of the screen.


    Of course, using the mouse to adjust row and column size are only shortcuts. If
    you want to be precise, you can use the sizing dialog boxes under the Format menu.
    Choose either Row or Column and then Height (for Rows) or Width (for Columns).
    See Figure 16.18.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Formatting Your Spreadsheet


    FIGURE 16.18


    The Column Width dialog box enables you to reset the default width of a column
    or enter a specific numeric value for the column width.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_326_0.png)


    In the Height and Width dialog boxes, you can reset the size to the default value
    with the checkbox, or you can enter a specific numeric value for the size of the
    row or column.


    As with the mouse-driven procedure, all the selected rows or columns are affected
    when you use these dialog boxes.


    # Inserting and Deleting Rows


    Although you can use copy and paste functions to move data around in a StarCalc
    spreadsheet, sometimes the easiest thing to do is to insert a row or column, rather
    than try to move everything to a new location.


    Inserting a row is basically like Cut and Paste to move the entire spreadsheet
    one line. But it''s a lot easier to insert a row. In fact, you can insert several
    rows in one operation to give yourself more room in a section of your spreadsheet.


    This example uses the spreadsheet shown in Figure 16.19. This Figure shows the
    Movie3 file from the samples/spreadsheets folder in the Explorer. You can load
    it and follow along.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# FIGURE 16.19


    A spreadsheet like this one might need extra rows inserted to accommodate additional
    data.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_327_0.png)


    Suppose that you need to add information about several other cities to this table
    of statistics. You can insert additional rows by following these steps:


    +   1. Click on the row for row 9 (click on the 9).


    +   2. Drag the mouse downward until three rows are selected (see Figure 16.20).


    > You can also select a cell in each of three rows, such as cells C9, C10, and
    C11. Selecting the entire row makes the data easier to keep track of.


    +   3. Choose Rows from the Insert menu. The bottom half of the table moves down
    to add three rows in the middle (see Figure 16.21).


    Notice a couple of things about this operation:


    +   - Formatting for the cells was maintained. This isn''t always the case, but
    StarOffice tries to make the new rows look similar to the old rows.


    +   - The row numbers changed for the lower part of the table. Any formulas entered
    in the lower part of the table (in row 9 or higher) were automatically updated
    by adding three to the row number.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Formatting Spreadsheet


    FIGURE 16.20


    You select the number of rows that you want to insert.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_328_0.png)


    FIGURE 16.21


    A table with three new rows inserted to accommodate additional information.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_328_1.png)'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'If you used an absolute row reference (with a dollar sign on the row, such
    as C$15), it won''t be updated, and the formula might not calculate correctly.


    If you select Rows from the Insert menu without doing anything else first (such
    as selecting other cells), StarOffice inserts one row above the current row.


    Deleting rows is a little more complicated. Some of the details were covered earlier
    in this hour. Basically, you can do any of the following in a StarOffice spreadsheet:


    +   * Delete the contents of a block of cells (clear the cells).


    +   * Delete a block of cells, moving other cells up to fill in the space left
    by the cells you deleted (and updating formulas as needed).


    +   * Delete an entire row, moving other rows up and updating formulas.


    Here, you''ll just learn how to delete a complete row. Just follow these steps:


    +   * Select a complete row by clicking on the label for that row (on the far
    right of the row).


    +   * Choose Delete Cells from the Edit menu. The entire row is deleted and other
    cells are moved up and renumbered.


    If you Cut on the Edit menu, or the delete key, the cells are cleared but the
    empty cells remain in your spreadsheet.


    # Inserting and Deleting Columns


    Inserting columns is done using the same procedure as inserting rows.


    Some areas of a spreadsheet, for example where cells have been merged together,
    don''t allow you to insert or delete rows or columns because so creates an ambiguous
    situation.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'To insert a single column, choose Columns from the Insert menu. A single column
    is added to the left of the current cell.


    You can also insert multiple columns by selecting several cells across a row.
    New columns are always inserted to the left of the currently selected cells.


    As you probably suspect by now, deleting a column is similar to deleting a row:


    +   1. Select the column to be deleted by clicking on the column label (the letter
    above the cells).


    +   2. Choose Delete Cells from the Edit menu. The columns are removed.


    > You can choose Undo from the Edit menu if you delete information and then change
    your mind.


    # In the Next Hour


    In Hour 17, "Adding Charts and Graphics to Spreadsheets," you''ll learn how to
    create charts within a spreadsheet by selecting cells in the spreadsheet and using
    the StarOffice charting tools. After the chart is created, you''ll learn how to
    format and arrange the information on the chart to best suit your needs.'
  merge: -1
  pgno: 330
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 331
- img_proc: true
  md: '# HOUR 17


    # Adding Charts and Graphics to Spreadsheets


    This hour guides you through creating graphics and charts from the data in your
    spreadsheet, and then inserting those graphics into your spreadsheet or exporting
    them for other uses.


    StarOffice includes many types of chart options. You''ll learn how to use the
    most popular ones in this hour. You''ll also see how to modify and format charts
    after they''re created and inserted into your spreadsheet.


    # Adding a Graphic to a Spreadsheet


    After formatting your spreadsheet with the options presented in Hour 16, "Formatting
    Your Spreadsheet," you can add graphic images of your data (charts) to further
    spruce up the look of your spreadsheet.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Importing a Graphic File


    Hour 11, "Adding Graphics to Documents," described how to add a graphic to a text
    document. The process is identical for adding a graphic to a spreadsheet. Just
    follow these steps:


    +   1. Move to the cell in which the upper left corner of the graphic image is
    to be positioned.


    > You can move or resize the image after you import it, but it''s helpful to have
    the graphic near the location at which you want it.


    +   2. Choose Picture from the Insert menu. Then choose Picture From the Picture
    sub menu. The Insert Picture dialog box appears (see Figure 17.1).


    # Figure 17.1


    Select a graphics file to insert from the Insert Picture dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_333_0.png)


    You can also create a picture in the Image Editor or StarDraw and insert it into
    your spreadsheet. Using the Image Editor is described in Hour 11. The use of StarDraw
    is described in Hour 6, "Creating Graphics with StarDraw."'
  merge: -1
  pgno: 333
- img_proc: true
  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_334_0.png)'
  merge: -1
  pgno: 334
- img_proc: true
  md: "# Editing an Imported Graphic\n\nAfter you load a graphic file into your spreadsheet,\
    \ you can move and edit it in many ways. Although this is covered in detail in\
    \ Hour 11, Table 17.1 shows you the most important things that you can do with\
    \ an imported graphic.\n\n# TABLE 17.1 EDITING IMPORTED GRAPHICS\n\n| Action |\
    \ Steps |\n| --- | --- |\n| Select the graphic | Click once anywhere on the image.\
    \ |\n| Move the graphic | Select the image. Click and drag the image to a new\
    \ location. |\n Resize the graphic | Select the image. Click and drag on a green\
    \ corner handle. (Hold down the Shift key while dragging to maintain the aspect\
    \ ratio) |\n| Do bitmap editing on an image | Double-click on the image to open\
    \ it within an Image Editor window |\n| Arrange the image within several layers\
    \ | Right click on a selected image and select an item from the Arrange submenu\
    \ |\n\n![](img/d07037173ed87c2b5a0d33ea3544eb75_335_0.png)\n\n> Because a spreadsheet\
    \ isn't arranged in paragraphs and pages, you can't use the justification and\
    \ alignment settings for a graphic in a spreadsheet.\n\n# Creating a Chart\n\n\
    A powerful feature of StarOffice is the capability to create charts from the information\
    \ you enter in the spreadsheet cells. Charts are a great way to highlight your\
    \ information for presentations and to quickly see trends onscreen.\n\nStarOffice\
    \ provides many types of charts, with many options. The chart feature is flexible,\
    \ but it can take some experimentation to get your data to look just right.\n\n\
    ![](img/d07037173ed87c2b5a0d33ea3544eb75_335_1.png)\n\n> Mark Twain was right\
    \ when he said, \"There are lies, damn lies, and statistics.\" Check your charts\
    \ to be sure that they reflect an accurate visual message."
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Adding Charts and Graphics to Spreadsheets


    The sections that follow walk you through creating a few basic charts and editing
    those charts. You''ll learn the steps that you can use to create a chart with
    your own data. You''ll be using a set of simple sales data as the basis for your
    chart samples.


    The words chart and graph are used interchangeably in this discussion.


    # Selecting a Data Set


    The first step in creating any chart is to select the data that you want to graph.
    Use the mouse to click and drag over a block of cells, or use the keyboard to
    select an area.


    The area that you can select be as small or large as you need. It needs to include
    all the numbers and labels that you want to be part of the graph.


    The labels are the headings that you typed in to identify your data. Include these
    in the cells that you select. The charting feature uses these to place labels
    on the chart that creates.


    A sample set of data is shown, with its labels, in Figure 17.3.


    FIGURE 17.3

    A selected set of data, ready to be charted.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_336_0.png)'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'Creating a useful chart in StarOffice involves several steps. First, you answer
    questions in a series of dialog boxes. After the chart is created, you can edit
    the chart to make it look just as you want it.


    The following sections step you through this process.


    # Starting a Chart


    With a data area selected in your spreadsheet, choose Chart from the Insert menu.
    The AutoFormat Chart dialog box appears, as shown in Figure 17.4.


    FIGURE 17.4


    The first part of the AutoFormat Chart dialog box enables you to set up the location
    of the chart.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_337_0.png)


    The name in the title bar of the dialog box includes the following: (1–4). Notice
    the buttons to use the Next and <<Back to look at four different parts of the
    AutoFormat Chart dialog box, filling information as you go. You can go to any
    or all the different parts of the dialog box before pressing the Create button
    to create the chart that you''ve defined.


    The options in the first part of the dialog box enable you to indicate the location
    of the chart. Specify both where the data for the chart are being taken from and
    where the finished chart is be placed. The options in the first part are as follows:


    +   * The Area field—Uses cell reference notation to describe the block of cells
    that you selected before opening this dialog box. The sheet name and corner cells
    define the block of information being charted. You don''t have to do anything
    in this field.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Adding Charts and Graphics to Spreadsheets


    +   The location where the chart will be placed—This field is labeled Chart, and
    results in a worksheet. From this drop-down list, select the sheet in which to
    place the chart. The default is the sheet where the selected cells are located.
    The chart will be placed to the right of the selected cells.


    > You''re inserting this sample chart on Sheet2 so you can enlarge it and edit
    it later. If you leave this field set to Sheet1, the chart is inserted next to
    the cells that you selected.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_338_0.png)


    +   Label checkboxes—StarOffice tries to determine whether you''ve included labels
    in the block of selected cells. It does this by checking the data type of the
    cells. StarOffice uses this to set the checkboxes for the first row or first column
    being used as chart labels, rather than numerical data. Make sure the checkboxes
    are accurately selected to get a correctly-configured graph.


    # Selecting a Chart Type


    To continue setting up your chart, select the Next>> button to move to the second
    part of the AutoFormat Chart dialog box, shown in Figure 17.5.


    FIGURE 17.5

    In the second part of the AutoFormat Chart dialog box, you select which type of
    chart to use.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_338_1.png)'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'You select the type of chart that you want to use from the set of 12 small
    pictures in the dialog box (scroll down to see the last four). StarOffice tries
    to pick an appropriate chart type based on your data, but you might want to change
    the selected chart type.


    > Note that some chart types are intended for certain types of data. For example,
    a pie chart is intended for percentage data, where the total is 100 percent (a
    full pie).


    The available chart types include the following. This list uses the names that
    StarOffice uses, followed by explanation as needed:


    +   * Lines (horizontal)

    * Areas (horizontal lines filled in underneath)

    * Columns (vertical bar graph)

    * Bars (horizontal bar graph)

    * Pies (pie chart)

    * XY diagram (requires that X-axis values are sorted, which is done for you automatically
    after StarOffice checks with you)

    * Net (grap in polar coordinates)

    * Lines (three dimensional)

    * Areas (three dimensional)

    * Bars (three dimensional horizontal bar graph)

    * Columns (three dimensional vertical bar graph)

    * Pies (three dimensional pie chart)


    The Preview window on the left side of the dialog box shows you how the data appears
    as a chart of the selected type. The preview image changes as you select different
    chart types.


    > The color of the charts might not appear correctly in the Preview window or
    the finished chart. This makes it difficult to judge the data in the chart. In
    the next section, you''ll learn how to edit the colors to make your chart readable.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Adding Charts and Graphics to Spreadsheets


    It is recommended that you select the Show text elements in preview checkbox.
    It makes the graphic part of the chart preview smaller, but it helps you to visualize
    how the final chart will look. In the third and fourth parts of the dialog box,
    it also helps to determine the effect you are having with your selections.


    For this sample data, a vertical bar graph (columns) has been selected, as shown
    in the previous figure.


    # Selecting a Chart Variant


    To continue the process of defining your chart, choose the Next>> button. The
    screen that you see depends on what chart type you selected in the second screen.
    The one you see (after choosing the Columns chart type) is shown in Figure 17.6.


    Figure 17.6


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_340_0.png)


    In the third part of the AutoFormat Chart dialog box, select a chart variant and
    choose whether to display grid lines.


    You can always move back and forth between the sections of this dialog box and
    change any selections that you''ve made. To do this, use the following steps:


    +   1. Press the <<Back button. The second part of the dialog box is shown.

    2. Select the Pie chart type.

    3. Press the Next>> button. The third part of the dialog box is shown again, but
    the chart type variants from which you can choose are all pie charts instead of
    column charts (see Figure 17.7).'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# FIGURE 17.7


    The variants in the third part of the AutoFormat Chart dialog box depend on which
    chart type is selected.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_341_0.png)


    We''ll continue with the columns type for this example if you want to go back
    and choose the columns chart type before going on.


    Following is a look at the chart variants for the columns chart that was selected.
    You might want to look back at the data in the cells to see how it can be represented
    in different ways.


    +   * The first variant is normal, and matches the chart pictures in the second
    part of the AutoFormat Chart dialog box.

    * The second variant is a stacked column (or bar graph). This is appropriate if
    you want to graphically represent the total of a group of figures, as well as
    their individual values.

    * The third variant is also a stacked column, but uses percentages instead of
    values. Thus, all columns are the same height. This is useful when you want to
    judge the relative weights of the data points in your cells.

    * The fourth variant uses a horizontal line for one set of data, plus the columns
    for the others. This might be used for data sets that include a line of totals
    that run above the individual bars.


    You can see a bit of experimentation is suggested to get your graph just right.


    Because we''re more interested in developing an attractive chart than in teaching
    Statistics J101, we''ll select the Normal chart variant.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Adding Charts and Graphics to Spreadsheets


    The checkboxes in the third section of the dialog box are used to turn the grid
    lines on or off. You can see the gridlines in the preview window as you select
    or deselect the checkboxes.


    All the checkboxes in this part of the dialog box might not be available. For
    example, the 2 axis checkbox is only available if you selected a three-dimensional
    chart type.


    You can continue to the final part of the AutoFormat Chart dialog box by pressing
    the Next>> button.


    # Labeling Your Chart


    In the fourth and last section of the AutoFormat Chart dialog box (shown in Figure
    17.8), you can set options for how the chart is labeled and which text elements
    are included on it.


    FIGURE 17.8


    In the fourth part of the AutoFormat Chart dialog box, you determine which text
    labels are included on the chart.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_342_0.png)


    If you want to include a title at the top of your chart, leave the Chart Title
    checkbox selected and enter the name of the chart in the text entry field (where
    Main Title is entered by default).'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# Hour 17


    You won''t always want a title, depending on what other information is

    nearby in your spreadsheet.


    If you want to include a legend on your chart, leave the Yes button selected in
    the Add

    legend section. It is recommended that you include a legend as you develop your
    chart.

    You can turn it off after you''ve seen that the chart is appropriate to your needs.


    A legend is a mini-chart that coordinates the graphical information on the

