  md: '# Introduction


    Writing a book about a Linux application is something new. The publication of
    this book marks a new step for Linux books—until now, all the books about Linux
    have focused on the operating system. With the incredible growth of Linux, now
    approaching 8 million users, books about how to use Linux applications are becoming
    available—starting with this one.


    StarOffice is a complete office suite modeled on Microsoft Office 97. It was developed
    by StarDivision, a German company that has enjoyed tremendous success in Europe.
    StarOffice for Linux is their first venture into other parts of the world, and
    promises to be a boon to Linux users.


    If you''re familiar with Office 95 or Office 97, many of the features of StarOffice
    will be familiar to you. StarOffice includes advanced features such as automatic
    indexes, integrated drawing tools, spreadsheet databases, chart designers, and
    a macro programming language StarBASIC (although that topic isn''t discussed in
    this book).


    If you''re not familiar with Microsoft Office, but you have been using Linux,
    you''ll love working with StarOffice. It provides everything you need to create
    documents, spreadsheets, databases, and presentations. No more giving a presentation
    about Linux using PowerPoint. You can also use StarOffice as an integrated Internet
    tool—read email and newsgroups, browse the Web, and download from FTP sites,all
    within the same comfortable interface.


    If you''re new to Linux, this book is a great place to start. After you have Linux
    installed, the step-by-step approach walks you through the StarOffice installation,
    creating basic documents, and using the features of windows and dialog boxes.
    Before long, you''ll be using StarOffice as your primary application in Linux.


    In addition to documents, spreadsheets, and presentations, StarOffice 5 includes
    several major improvements over previous versions. These improvements include
    the following:


    +   - A complete scheduling program (similar to Microsoft Outlook) with tasks,
    event calendars, and pop-up reminders for recurring or one-time events.


    +   - A powerful vector-based drawing tool, StarDraw, to create drawings that
    can be integrated into other StarOffice documents.


    +   - Redesigned Internet access tools, including new emailing and newsgroup reading
    interfaces.


    +   - Improved stability, based on the latest Linux libraries (glibc), plus a
    new, easy-to-use installation program.'
  merge: -1
  pgno: 22
- img_proc: true
