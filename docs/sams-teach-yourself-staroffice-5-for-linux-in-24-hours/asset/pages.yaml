  md: '# Using StarOffice Email and Newsgroup Features


    After creating an Outbox (or immediately if you answered No to the Outbox question),
    a news server icon with the name you entered appears in the Explorer window.


    # Choosing Newsgroups to View


    Of all the newsgroups on the Internet, you probably only want to review a few
    at a time. Newsreaders enable you to subscribe to a newsgroup. Subscribing to
    a newsgroup doesn''t affect anything on the Internet (for example, it doesn''t
    send your name to the news server). Subscribing to a newsgroup just adds that
    newsgroup to a list within the newsreader to keep track of which newsgroups are
    to be displayed for.


    A list of subscribed newsgroups defines those newsgroups from which you want to
    regularly read messages. In the Subscribe tab of the Properties of News dialog
    box, you can view all the newsgroups that are active on your selected news server,
    and then mark, or subscribe to those interest you. Depending on the settings in
    the View tab, only those newsgroups that you subscribe to are listed in the news
    browsing described in the next section.


    # Reading Newsgroup Postings


    To read news messages, double-click on the news server icon that you created in
    the Explorer. A news reader window appears: you can select a message to read from
    the message subject lines (see Figure 23.16).


    FIGURE 23.16


    Newsgroup messages are within a StarOffice newsgroup browsing window.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_482_0.png)'
  merge: -1
  pgno: 482
- img_proc: true
  md: 'Reading newsgroup messages is a little like reading email. But instead of viewing
    multiple email subject folders, the message titles in the current folder, and
    the text of one message, with news you view the list of newsgroups (like folders),
    the titles of news messages (like email messages), and the text of the selected
    newsgroup message.


    # # Posting a New Message to a Newsgroup


    As you read newsgroup postings, you''ll probably want to reply to some of them.
    Posting a message to a newsgroup is similar to sending an email message, with
    these important differences:


    +   * Newsgroup postings are read by thousands of strangers around the world.

    * Newsgroup postings can take longer to appear in the newsgroup than email takes
    to reach a recipient (though they usually don''t).

    * Newsgroup postings in some newsgroups can be rejected by the moderator who controls
    the group feels the posting is off-topic or inappropriate.

    * In some newsgroups, strangers who don''t like what you say respond with various
    levels of verbal abuse. Ignore it.


    With these differences in mind, a few rules of Internet etiquette (netiquette)
    might be helpful. These are generally accepted rules of behavior within newsgroups
    and the Internet generally:


    +   * Read postings in a newsgroup for a few days before posting anything. Try
    to sense the tone of the messages (social, friendly, scholarly, antagonistic)
    so you can match it.

    * Look for a message in the newsgroup that contains a list of Frequently Asked
    Questions (a FAQ) and read it before posting to the newsgroup. The FAQ answers
    a few dozen questions that everyone with an interest in the subject of the newsgroup
    asks. They all want you to read the answer in the FAQ of asking it again.

    * When people say something offensive in retaliation to a comment with which they
    didn''t agree (this is affectionately called a *flame war*), don''t add fuel to
    the fire. Take the high ground and change the subject.


    With these ideas in mind, you can reply to any message in a newsgroup, either
    by replying privately via email, or by replying publicly back to the newsgroup
    (see Figure 23.17).'
  merge: -1
