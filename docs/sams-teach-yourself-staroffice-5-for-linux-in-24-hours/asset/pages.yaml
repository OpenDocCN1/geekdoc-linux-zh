  md: '# Activating the Spellcheck Dialog Box


    The traditional method of spellchecking a document also works in StarOffice. You
    can use a spellcheck dialog box to review misspelled words and choose how to correct
    them.


    The StarOffice spellchecker starts from the current cursor position and pauses
    at each word that can''t be located in a StarOffice dictionary.


    To start the spellchecker and check your entire document, move to the top of your
    document and choose Spelling from the Tools menu; then choose Check from the Spelling
    submenu. The Spelling dialog box appears finds a word that thinks it is misspelled,
    as in Figure 12.9.


    # 12.9


    +   The Spelling dialog box enables you to carefully check the spelling of your
    document.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_249_0.png)


    When you start the Spelling dialog box, the first misspelled word (starting from
    your cursor position) is shown in the dialog box. If a potential correction for
    the word can be determined by StarOffice, the replacement is shown in the replacement
    field. Other potential replacements are listed in the Suggestions list that follows.


    After you take one of the following actions, the spellchecker looks for the next
    misspelled word, and you repeat the process. This continues until the document
    has no misspelled words (words not found in the dictionary), or until you choose
    the Close option to close the dialog box. The options you can choose for each
    word include'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Using SpellCheck and the Thesaurus


    +   * Click Replace—To replace the word in your document with the word in the
    Replacement field.

    * Click Replace All—To replace every occurrence of this misspelled word with the
    word in the Replacement field.


    > If you choose this, the spellchecker does not pause on this word next time—it
    corrects it and moves on.


    +   * Click Ignore—To skip this word without correcting it. (For example, choose
    this option if the misspelled word is a person''s name.)

    * Click Ignore All—To skip every occurrence of this word in this document. (In
    other words, don''t pause the next time this word is encountered.)

    * Choose Add—To add this word (as it appears in your document before correction)
    to the currently selected dictionary (see the Dictionary field).


    > Choose Add or Ignore All are similar in results; however, choosing makes the
    spellchecker skip the word in other documents, not just in this document.


    StarOffice can''t figure out how to correct the word, the word from your document
    is shown in the Replacement field. In this case, choosing Replace doesn''t change
    anything.


    If you don''t see the corrected spelling in the list of Suggestions, you can type
    anything into the Replacement field (by memory or from a dictionary) and then
    choose Replace, Replace All, or Add to correct the word.


    Don''t be surprised by some of the words that aren''t included in the StarOffice
    dictionary. For example, neither StarOffice nor Linux is included, for some reason.
    You might want to add them, especially if you''re writing a book about StarOffice
    for Linux.


    > You can''t click on the document and edit it without closing the Spelling dialog
    box first. But that''s OK because when you restart the Spelling dialog box, it
    starts from the current cursor position.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Searching the Thesaurus


    One final language feature of StarOffice is the Thesaurus. The word thesaurus
    comes from the Latin word for treasure, and you can think of a thesaurus as a
    treasure chest of words that you haven''t yet seen.


    Whenever you need the right word in a document, you can type a word that''s close
    in meaning, but not just right. Then look it up in the Thesaurus to search for
    or replace similar words.


    The StarOffice Thesaurus even includes a dictionary for thousands of words.


    To use the Thesaurus, select a word by placing the cursor in it. Then select Thesaurus
    The Thesaurus dialog box appears (see Figure 12.10).


    # FIGURE 12.10


    Use the Thesaurus dialog box to search for words related to your selected word.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_251_0.png)


    The word that you selected in the body of the text is displayed in the Word field.
    The various meanings for that word are listed under the Meaning field.


    The Replace field contains the word that you have selected (the same word as the
    Word field), but the Synonym list contains a list of possible replacements for
    your selected.


    > Words meaning the opposite of the word you selected are also listed in the Synonym
    list, but with the word antonym listed after them.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Using SpellCheck and the Thesaurus


    To change your selected word into one of the synonyms, select that synonym from
    the list and choose OK. The dialog box closes, and your word is updated.


    # Searching for More Meaning


    After you''ve selected a word in the Synonyms list, you can look up that word
    in the Thesaurus by clicking the Search button.


    The new word appears in the Word field, with its definitions in the Meaning list.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_252_0.png)


    > Choosing an interesting word and exploring its meanings and synonyms in an online
    thesaurus is a great way to improve your writing.


    If you want to see how the dictionary and thesaurus work, try one of these words:
    set, tone, malignant, fix, or joy. They have strong lists of synonyms or long
    lists of meanings to explore.


    A thesaurus with definitions can also help you choose between words such as effect
    and affect, or complement and compliment.


    # Using the Thesaurus from the Spelling Dialog Box


    When you''re spellchecking your document, you might want to use the Thesaurus
    dialog box to review possible word replacements.


    From the Spelling dialog box, select the More button, and then choose Thesaurus.
    The same Spelling dialog box appears, with the current word from the Spelling
    dialog box as its entry. You can use this dialog box to choose a replacement word,
    and then return automatically to the Spelling dialog box.


