- img_proc: true
  md: '# Using Auto Spellcheck


    The Auto Spellcheck feature of StarOffice helps you create correct documents by
    point-ing out misspelled words as you type. It does not guarantee perfect documents,
    but it can help you catch your errors before someone else does.


    When the Auto Spellcheck feature is turned on, any word that you type that can''t
    be found in the spelling dictionary is underlined in red, as in Figure 12.4.


    FIGURE 12.4

    With Auto Spellcheck, words that can''t be found in the dictionary are underlined
    in red.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_244_0.png)


    Words with wavy underline to show misspellings.


    # Turning Auto Spellcheck On or Off


    You might not want to use Auto Spellcheck all the time; seeing all red lines can
    be annoying.


    To turn Auto Spellcheck on or off, select Spelling from the Tools menu. On the
    submenu that appears, you see Auto Spellcheck as an option. You can select that
    option to turn on Auto Spellcheck (see Figure 12.5). After a moment, the words
    that can''t be found in the dictionary are underlined in red.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# FIGURE 12.5


    The Auto Spellcheck

    menu option can be

    selected to turn this

    feature on or off.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_245_0.png)


    You can also turn on Auto Spellcheck by clicking an icon on the Main tool-bar.
    The icon displays characters underlined in red.


    When Auto Spellcheck is on, you see a check by that menu item. Select it again
    to turn

    Auto Spellcheck off. All the red underlines disappear.


    Be careful about the meaning of red underlines. They don''t always mean a

    misspelled word. Names that aren''t in the dictionary are underlined, such as

    ThinkPad (an IBM laptop).


    In addition, misused words that are in the dictionary won''t be underlined.

    For example, using to and too there and their incorrectly won''t be

    marked.


    The next section describes how to use the regular spellcheck dialog box to go
    through

    your document and check for misspelled words.'
  merge: -1
