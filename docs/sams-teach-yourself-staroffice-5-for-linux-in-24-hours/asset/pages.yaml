  md: '# Using StarOffice Email and Newsgroup Features


    # Configuring the Newsgroup Reader


    Newsgroups are subject-oriented group discussions across the Internet. They''re
    sort of like email, except everyone''s messages are posted in a common place for
    everyone to read and respond to. You can also compare them to a chat session on
    the Internet, except that they don''t occur in real time. Newsgroup messages can
    be delayed several hours from the time that they are posted or sent, to the time
    that you see them on your newsgroup reader.


    Newsgroups cover every subject imaginable, from the scholarly to the mundane to
    the obscene (there are lots of those). Newsgroups are organized in a tree, with
    a broad-category listed first, followed by a more specific subject.


    For example, the sci.physics group discusses physics; the soc.religion.muslim
    discusses issues for Muslims, and comp.linux.announce contains announcements relevant
    to Linux users (it stands for computers/operating systems/linux/announcements).
    There are thousands of different newsgroups. The newsserver that you need to connect
    for reading newsgroup postings probably receives more than 100MB of data each
    day from new postings.


    Although other word processors might have email capability, none that we''ve seen
    include the capability to browse Internet newsgroups. Normally you must use your
    Web browser to read newsgroups. StarOffice integrates these features.


    # Creating a News Icon


    The first step in reading newsgroups is to create and configure a news server
    item in the Explorer window. With the news server item in place, you can select
    it to read and post messages to newsgroups.


    To create a news server icon in Explorer, follow these steps:


    +   1. With the Explorer window open, right-click on the word Explorer on the
    top line of the Explorer window. A pop-up menu appears.

    2. From the New submenu, choose News. A Properties of News server dialog box appears,
    where you can define the properties of the news server that you want to access
    (see Figure 23.15).

    3. Make sure that the Receive tab is selected.

    4. Enter the name of the news server in the Server field. You''ll need to get
    the name of this server from your ISP or system administrator.

    5. Enter a username and password for this server if these are needed to access
    it (usually you won''t need to fill in these fields).


