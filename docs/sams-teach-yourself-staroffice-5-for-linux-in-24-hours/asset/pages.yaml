    - Left and right (Mirrored) in coordination. In this case, the Left/Right margin
    codes change to Inner/Outer.

    - All the pages in the document.


    # # Adding a Header or Footer to Each Page


    Working with headers and footers in StarOffice is convenient. Instead of using
    hidden codes and reference pages, StarOffice places a separate box on each page
    in which you can click and start entering text for the header or footer.


    In the Page dialog box, you can configure headers from the Header tab (see Figure
    8.12). By definition, a header or footer is included on every page of your document,
    so if you don''t want to include them on some parts of a larger document, use
    separate document files.


