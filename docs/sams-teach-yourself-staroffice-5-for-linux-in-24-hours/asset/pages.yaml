    # Using the Object Dialog Box


    The Formatting pop-up menu and the Object toolbar have been used for all the examples
    of manipulating images. All functions, however, including moving an image on the
    page, can be done from the Object dialog box.


    With an image selected, choose Object from the Formatting pop-up menu or from
    the main Format menu. The Object dialog box appears (see Figure 11.19).


    From the seven tabs in this dialog box, you can set all the features described
    previously, as well as several others that you can explore on your own. For example,
    you can add an URL link to any image so that clicking on it brings you to a Web
    page in StarOffice.


    Most of the image editing you''ll do is probably more easily done from the pop-up
    menus and Object toolbar, but you might choose to use this dialog box for a more
    methodical approach.'
