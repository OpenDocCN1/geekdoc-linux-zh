  md: '# Importing and Exporting StarOffice Documents


    Obviously, this situation is less than ideal, especially if you have to regularly
    exchange documents between StarOffice and another word processor such as Ami Pro.
    For each document, you have two conversions: from Ami Pro to an intermediate format
    such as RTF, and from RTF to StarOffice.


    Rich Text Format (RTF) is a widely supported format that is intended to be cross-platform.
    Because it includes many formatting features, such as character formats, footnotes,
    and tables, it is often a good choice for conversions between word processing
    formats. In addition, RTF is included as a conversion option, both reading and
    writing, with every major word processor.


