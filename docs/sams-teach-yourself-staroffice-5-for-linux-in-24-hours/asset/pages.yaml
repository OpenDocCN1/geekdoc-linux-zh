  md: '# Reviewing Imported and Exported Documents


    Any time you move a document between word processors that use different formats—example,
    reading a Word file into StarOffice—check the document to see how well the conversion
    worked.


    Although we''ve had good luck with the Word filter in StarOffice (which is recommended
    for most uses in this hour), you might have problems with some features.


    Table 5.1 shows the key import and export filters available in StarOffice, and
    how you can use them.


    # Table 5.1 Key Import and Export Filters in StarOffice


    | Format | Comments |

    |---||

    | HTML | Strong filter in StarOffice, but useful mostly for Internet/Web posting
    and sharing between systems without other word processors (difficult to edit exported
    documents). |

    | RTF | A good choice for word processors and text processing systems that don''t
    support Word format. |

    | Word 6.0/95 | The preferred choice for exchanging files with anyone who can
    read Word format. |

    | Word 97 | A strong filter in StarOffice, but best to use only for export when
    you know the recipient has Word 97 because Word 95 can''t read Word 97 files.
    |

    | Plaintext | Useful for exporting to email systems without HTML capability, or
