    want to divide items on each line: comma, tab, or semicolon (if you use paragraphs,
    your table will only have one column).


    +   4. Choose OK to create the new table from your block of text.


    # Formatting a Table


    When you have a table inserted into your document, you can enter text into the
    table cells. Move between cells using the following hints:


    +   - Click in any table cell to place the cursor in that cell.

    - Use the Tab key to advance the cursor to the next cell.

    - Use Shift+Tab to back up to the previous cell.


    After you have entered text in your table, you''re likely to need to update the
    formatting or size of the table.


    Notice that the Object toolbar changes when you move the cursor to any table cell.
    Instead of standard text formatting tools such as bold, italics, and centering
    text, the Object toolbar includes icons for Insert Row, Split Cells, and Border
    formatting.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_206_0.png)


    > To see a short description of any button on the Object toolbar, move the mouse
    pointer over that icon and leave it there for a moment. A yellow pop-up description
    appears for that icon.


    When you insert a new table in your document, the top row of the table is automatically
    formatted using the Table Heading style. The rest of the cells use the Table Contents
    style. You learned about styles in Hour 9.


    Taking the table of languages in Figure 10.4 as a starting point, suppose that
    now need to add some information to the table. The following section steps through
    how to perform some common table functions.'
