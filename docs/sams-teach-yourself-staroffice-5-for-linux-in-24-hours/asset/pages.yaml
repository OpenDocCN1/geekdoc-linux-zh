    Pasting information can take many forms in the Paste Special dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_294_0.png)


    Notice that you can select which types of information are to be pasted into the
    cells at the current focus point in the spreadsheet.


    > If you use Ctrl+V or the regular Paste item on the Edit menu, everything is
    pasted—without regard to the type of data being pasted.


    The Paste Special command gives you control over what is pasted, how existing
    cells are shifted around, and other operations that can be performed during the
    paste operation.


