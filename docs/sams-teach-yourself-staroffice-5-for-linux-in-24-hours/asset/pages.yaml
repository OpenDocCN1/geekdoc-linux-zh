  md: '# Setting Spreadsheet Options


    In Hour 4, "Configuring StarOffice," you learned about setting options that apply
    to everything that you do in StarOffice. You can also set options that apply to
    how StarOffice works with and formats spreadsheets.


    > The options you set while viewing a spreadsheet are specific to that file and
    are saved with that file. If you open a new spreadsheet, the default spreadsheet
    options are used.


    To view or set the spreadsheet options, select Options from the Tools menu; then
    choose Spreadsheet from the submenu. The Spreadsheet options dialog box appears,
    as shown in Figure 13.11.


    Figure 13.11 The first tab of the Spreadsheet Options dialog box. Contents, enables
    you to set preferences for how spreadsheet information is displayed.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_270_0.png)


    The Spreadsheet options dialog box consists of six tabs where you can set different
    options. The most important options are described in the following sections.


    # Choosing What to Display Onscreen


    A spreadsheet contains a lot of information behind what you see onscreen. Formulas,
    charts, values, and notes can be part of different cells.'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'From the Contents tab of the Spreadsheet Options dialog box, you can select
    parts of the spreadsheet to be displayed onscreen. In the top part of the dialog
    box, you can check any item that you want displayed.


    > Notice that these display options are similar to the options for printing in
    the Sheet tab of the Page Style dialog box, described in the previous section.
    Remember that the options described here affect only onscreen display.


    For example, if you want to have formulas displayed instead of the result of the
    formula calculation, you can check the Formulas check box in the Display field.


    By default, any values in your spreadsheet that calculate to zero, are displayed.
    Also, any notes that you enter for a cell are visually noted in two ways. A red
    dot in the corner of a cell indicates that the cell has a note. When you leave
    the mouse pointer over a cell for a few seconds, the note appears in yellow (see
    Figure 13.12).


    # FIGURE 13.12


    +   A note can be added to any cell. If the file is configured to view notes,
    they appear automatically when the mouse is left over a cell.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_271_0.png)


    For objects, such as graphic images and charts, you can select from a drop-down
    list in the bottom part of the dialog box. You can choose to have any of these
    object types displayed, hidden or used as a placeholder. (A placeholder appears,
    showing the size of the object, but without using the processing time or memory
    to prepare and display the real object.)'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Creating Spreadsheets with StarCalc


    You can also select some display options from the Layout tab of the Spreadsheet
    Options dialog box (see Figure 13.13). The layout options define the display and
    color or grid-lines, which we reveal screen elements as the scroll bars, multisheet
    tabs, and page break lines are displayed.


    Figure 13.13


    The Layout tab of the Spreadsheet Options dialog box includes some options.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_272_0.png)


    # Setting Input Options


    In the Input of the Spreadsheet Options dialog box (see Figure 13.14), you can
    set preferences for how you use the keyboard to enter data in your spreadsheet.


    When you''re entering a lot of data in a spreadsheet, it can help to set where
    the focus goes when you press Enter, or whether pressing Enter in a cell starts
    Edit mode for the contents of that cell or just moves to a new cell. All these
    can be set with the check boxes in the Input tab.


    You can also select whether the row and column headings are highlighted for the
    currently selected cell.'
  merge: -1
  pgno: 272
