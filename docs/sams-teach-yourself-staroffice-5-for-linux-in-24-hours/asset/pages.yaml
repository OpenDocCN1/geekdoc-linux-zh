  md: '# Formatting Your Document


    FIGURE 8.11


    You set the margins, paper size, and orientation in the Page tab of the Page dialog
    box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_176_0.png)


    The Preview area shows you what effect your changes will have, both by the size
    and shape of the white box (representing the page) and by the black margin lines
    within the white box.


    # Defining Basic Page Numbering and Layout


    The Numbering field enables you to set the numbering style for the document: letters,
    Arabic numerals, or Roman numerals.


    The page numbering is set from the Page Numbering item on the Tools menu. Unfortunately,
    the power of the page numbering feature is not what it could be, compared to other
    word processing systems.


    > If you need to set up different page numbering styles (using the Page dialog
    box) or starting numbers (using Page Numbering from the Tools menu), use separate
    document files.


    Finally, you can set which pages in your document these settings apply to. This
    setting is not as flexible as it could be; if you''ve used FrameMaker or WordPerfect,
    you might be disappointed to see that you can apply different formats to only
    a limited set of pages, rather than setting new information for each and every
    page as needed.'
