- img_proc: true
  md: '# Using the Explorer and the Desktop


    **FIGURE 3.9**

    The StarOffice Desktop with a collection of personal work files.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_78_0.png)


    # Removing a Document from the Desktop


    The easiest way to move a document from the Desktop to a folder in your Workplace
    is to drag the icon from the Desktop to a folder in your Workplace (within the
    Explorer).


    If you want to delete a file that''s stored on your Desktop, another choice is
    to drag and drop the icon from the Desktop to the Recycle Bin icon in the Explorer
    window.


    If you want to delete a file directly from the Desktop, however, you can follow
    the following steps:


    +   1. With the mouse pointer over the icon of the file that you want to delete,
    click the right mouse button. The pop-up menu shown in Figure 3.10 appears.


    +   2. Choose Delete from the pop-up menu.


    +   3. Use the Confirm Delete dialog box to confirm that you want to erase this
    item from the Desktop and from your filesystem. The icon and the file it represents
    are deleted.'
  merge: -1
