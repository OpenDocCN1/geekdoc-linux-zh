  md: '# Moving and Resizing Images


    The first thing you might want to do with an image is to move it to a new location
    on the page, to position it more precisely after you dragged it from the Beamer.


    To move a selected image, click anywhere in the image and drag the mouse. The
    outline that moves shows where the image is to be placed when you release the
    mouse.


    By default, the text flows around the image, above and below it. You''ll learn
    how to change that setting momentarily.


    If you need to resize the image, use the green handles that appear when you select
    the image.


    To resize any selected image, click and drag on any of the green handles. The
    moving outline shows you the size that the image will be when you release the
    mouse button.


    Notice that you can easily (too easily) alter the ratio of height to width for
    an image as you resize it. (See Figure 11.8.)


    # Figure 11.8


    As you resize an image, hold down the Shift key to prevent the distortion shown
    here.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_231_0.png)


    To prevent distortion, hold down the Shift key as you drag on a handle to resize
    an image. The Shift key makes both directions of the image move in concert so
    that the image is sized without being distorted.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Setting Alignment and Text Wrapping


    The easiest way to set many image options is by clicking the right mouse button
    on a selected image. The Formatting pop-up menu appears, so you can easily choose
    an option from a menu or submenu (see Figure 11.9).


    Figure 11.9

    The Formatting pop-up menu can be used with any selected image by clicking the
    right mouse button.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_232_0.png)


    Additional options to the pop-up menus appear on the Object toolbar (just scroll
    the toolbar over to explore the icons on the toolbar by leaving your mouse pointer
    over an icon for a few seconds. A descriptive message tells you what that icon
    is used for.


    Although you can move an image by dragging it with the mouse, this isn''t the
    most precise method. Instead, you can use the menus to select a left margin, centered,
    or right margin position for an image. Just follow these steps:


    +   1. Select an image in your document.

    2. Click the right mouse button to access the Formatting pop-up, or select Format
    on the menu bar.

    3. Select the Alignment submenu.

    4. Choose Left, Center, or Right from the submenu. The image is repositioned horizontally.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'The Top, Middle, Bottom alignment options refer to the vertical placement of
    the image when you have the text wrapping around it.


    Text wrapping determines whether the image has blank space to either side of it,
    or whether the text in your document flows down the sides of the image. Several
    options are included in the Wrap submenu of the Format menu. The three most useful
    ones are included on the Object toolbar. They are as follows:


    +   - No wrap—Text doesn''t flow around the image at all, as in Figure 11.10.


    # FIGURE 11.10


    No wrap forces blank space to either side of your image.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_233_0.png)


    +   - Page wrap—Text flows down either side of the image, around the sized box
    that contains the image, as in Figure 11.11.


    +   - Wrap through—Text flows into the box containing the image; the main background
    color of the image is considered transparent, and the text forms around the shape
    of the image, as in Figure 11.12.


    > Study the Figures to understand the Wrapping terms used by StarOffice. They
    might differ from what you''re accustomed to in other programs.'
  merge: -1
