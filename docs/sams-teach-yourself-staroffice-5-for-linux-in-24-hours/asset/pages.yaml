  md: 'The following sections describe how to expand your formatting skills to complete
    paragraphs.


    # Choosing Paragraph Settings


    As with character formatting, paragraph formatting can apply either to the block
    of text that you''ve selected or to all the text that you enter after indicating
    a change.


    In this case, *paragraph* means all the text that you enter between the times
    that you press Enter. This is often several lines because of the often auto-wrapping
    in word processors.


    Formatting for paragraph refers to the way in which the indents and spacing for
    lines in that paragraph are handled, how tabs are spaced, whether text is left-
    or right-justified, and so forth.


    All the paragraph formatting for StarOffice documents is done in the Paragraph
    dialog box, which you can open by choosing the Paragraph menu. (See Figure 8.7).


    # FIGURE 8.7


    All paragraph formatting is done from the Paragraph dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_171_0.png)


    The exceptions to this are a few icons on the object toolbar; you will learn about
    these icons in a moment.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Formatting Your Document


    To see how to use the paragraph formatting options, place the cursor in a paragraph
    that you want to edit. You don''t have to select the paragraph text—StarOffice
    applies your changes to the entire paragraph. Choose Paragraph from the Format
    menu.


    # Setting Line Spacing and Paragraph Indents


    Start with the Indents and Spacing tab (select it if it''s not showing). The following
    are the options:


    +   * Indents—Indicate that text in the selected paragraph is moved further in
    (or, using negative numbers) from the margins (which you''ll review in the Page
    formatting section). Left and right indents indicate how much extra space to leave
    on each side of the paragraph.


    +   * First line indent—Enables you create an indented paragraph with a further
    indented first line or a hanging indent by setting the Left indent to a higher
    number than the First line indent.


    +   * The Spacing—(Top and Bottom fields are shown) Indicates how much empty space
    will appear preceding and following the current paragraph. Unless you need to
    align a paragraph with a printed form or complete other special tasks, you can
    probably leave these settings unchanged.


    +   * Line spacing drop box—Determines how the lines in the paragraph are spaced
    based on how high each line of text is. Put simply, you can select single-spaced,
    double-spaced, or 1.5-spaced lines. Other options are listed for the typesetters
    among us.


    As you change the numbers in any of these fields, glance at the Preview window
    on the right side of the dialog box. The picture displayed there shows you how
    your changes affect the lines of text in the current paragraph.


    # Setting Paragraph Alignment


    In the Paragraph dialog box, you can also select the alignment for the lines of
    the current paragraph. Most documents that you create will use the default left-aligned
    or left-justified setting.


    Some reports that you write require full justification, meaning text on both the
    left and right margins are aligned. Right alignment and centered text lines are
    normally used only for headlines or occasional special effects.


    The Alignment tab of the Paragraph dialog box (see Figure 8.8) includes options
    for these alignment types. Again, the Preview area at the right of the dialog
    box shows roughly how the alignment option will look.'
  merge: -1
