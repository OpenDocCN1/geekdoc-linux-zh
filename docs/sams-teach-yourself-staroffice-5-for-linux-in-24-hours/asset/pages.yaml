    drag in the middle of the chart to move it anywhere in the spreadsheet.


    To modify the chart itself, you must have the chart in edit mode. To do this,
    double-click on a chart. You can tell that it is ready to edit if it has a heavy
    line around it (see Figure 17.12), and the toolbar on the left of the screen contains
    icons to edit the chart (those are desired in a moment).


