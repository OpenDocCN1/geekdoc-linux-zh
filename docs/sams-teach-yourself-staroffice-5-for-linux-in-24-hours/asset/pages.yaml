    # Choosing an Installation Option


    The next decision that you have to make is which components of StarOffice you
    want to install. As mentioned earlier, StarOffice is not a small program, so you
    can choose to leave some parts out of the installation.


    Remember, however, the integrated nature of StarOffice means that most of the
    program is shared among all the components. That means that you can''t leave out
    a large component such as the StarImpress presentation software.


    If you need to save hard disk space, you can leave out things such as the following:


    +   - Clipart or Graphics collections

    - Templates

    - Help files

    - Sample documents


    You can choose one of several installation options, as shown in Figure 1.5.


    The easiest choice is the Standard Installation. This takes a lot of space (139MB),
    plus 20MB extra during installation), but provides you with graphics, templates,
    help files, dictionaries, and so forth. If you choose the Standard Installation
    button, you have about 160MB of free hard disk space.'
