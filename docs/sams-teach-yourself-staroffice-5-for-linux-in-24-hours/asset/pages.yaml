- img_proc: true
  md: 'The best way to start making your spreadsheet attractive is to set up the fonts
    and text attributes that make information easier to locate and read.


    When you''re viewing a spreadsheet, most of the text formatting options you''ll
    use included in the Object Bar (see Figure 16.1).


    The Object Bar has the formatting options that you''ll use the most.


    # FIGURE 16.1

    The Object Bar contains many of the text formatting features that you''ll use.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_313_0.png)


    Included in the Object bar are the following text formatting options:


    +   * Font name

    * Font size

    * Bold/Italic/Underline

    * Justification (Center, Left, Right)

    * Vertical alignment (Top, Center, Bottom)

    * Number format (common options; others are selected via menu options)

    * Border type and background colors

    * Decimal places


    All these formatting options can be set using menu items in the Format menu, but
    the Object toolbar provides a quick shortcut. In the sections that follow, you''ll
    learn how to work with these formatting options.'
