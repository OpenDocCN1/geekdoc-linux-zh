    # In the Next Hour


    In Hour 11, "Adding Graphics to Documents," you''ll learn how to add graphics
    to your StarWriter documents. You can either import existing graphic files of
    many different formats or create your own drawings using the built-in Image Editor
    or StarDraw tools. You''ll also learn to edit how images are positioned and displayed
    in your document.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_222_0.png)


    # # HOUR 11


    # # Adding Graphics to Documents


    In this hour, you learn how to add the graphic images and figures that you create
    to your documents. You also learn how to position and edit a graphic.


    StarOffice includes StarDraw for creating vector-based graphics (see Hour 6, "Creating
    Graphics with StarDraw"), and the Image Editor for creating bitmapped graphics.
    Both types of graphics can be inserted into documents as described in this hour.


    StarWriter documents can also use standard line drawing and borders. In this hour,
    you learn how to insert and position such elements in a document.


    # # Importing Graphics


    Pictures or diagrams add a lot to any document. Because StarOffice can create
    Web pages so readily, you''ll probably use a lot of graphics as you create documents
    in StarOffice.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'Instead of using StarDraw or the StarOffice image editor (which you''ll learn
    later in this hour), you can create the images you need in a standard Linux package
    such as GIMP or Xpaint. Both of these excellent tools are included in nearly every
    Linux distribution.


    After you''ve created a graphic or downloaded one that you want to add to your
    document, you''re ready to import the graphic into your StarOffice document.


    # Placing Graphics in Your Document


    StarOffice includes a clip art library of dozens of images that you can insert
    into your documents. You can also use most graphics in standard formats (A list
    of major supported formats is included in the next section.) In this hour, you
    learn how to use both clip art and other imported graphics.


    To prepare for this example, open a document that you''ve been working on and
    check both the Explorer and the Beamer in the View menu so that they''re visible
    on your screen. Then follow these steps:


    +   1. Click on the plus sign (+) to the Gallery in the Explorer window.

    2. Choose a category of clip art by clicking on it. Choose Maps. The graphics
    in that group appear in the Beamer. (See Figure 11.1.)


    FIGURE 11.1

    Clip art can be viewed in the Beamer window.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_223_0.png)'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Adding Graphics to Documents


    3. Scroll through the Beamer until you find an interesting graphic.

    4. Click on the graphic in the Beamer and drag it to the main document window.

    5. Release the mouse button in the location within the document in which you want
    the graphic placed. The graphic isn''t placed at the current cursor location.


    You''ve just inserted a graphic into your document. The image is selected, as
    shown by the green handles around it. (See Figure 11.2) A little anchor is also
    shown. The anchor is provided mainly for reference purposes; it indicates where
    the graphic is anchored in the document. Because you can use your mouse to drag
    the document wherever you want it, the anchor doesn''t matter much in your documents.


    # FIGURE 11.2


    A graphic is selected after dragging it into a document.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_224_0.png)


    Handles show that the graphic is selected.


    A little later, you''ll look at how to work with the graphic that you''ve inserted.
    First, however, you will try two other methods of inserting a graphic.


    Remember that the Workplace item in the Explorer is a method of browsing your
    entire Linux filesystem. With the Beamer open, you can open the Workplace icon
    in the Explorer and locate a graphic in your Linux filesystem.


    As you browse the directories in the Explorer, you can click on any directory
    rather than the plus sign next to the directory to see a listing of the files
    that the directory contains in the Beamer window.'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'When you see a graphic file in the Beamer window that you want to insert in
    your document, click on the icon or filename in the Beamer window and drag it
    to a spot in your document.


    If the file is in a graphics format that StarOffice can read (more on that soon),
    the graphic appears in your document.


    Finally, you can use the old-fashioned method of inserting graphics into your
    document. Choose Picture from the Insert menu and then choose File from the submenu.
    The Insert Picture dialog box appears, as shown in Figure 11.3.


    # FIGURE 11.3


    From the Insert Picture dialog box, you can select a graphics file to insert.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_225_0.png)


    The advantage of using the Insert Picture dialog box (instead of the Beamer) for
    graphics that aren''t in the StarOffice Gallery is that you can select the Preview
    checkbox (as it is in the figure) and see the graphic before you insert it.


    After you find the graphic file that you want to insert, choose OK to close the
    dialog box and insert the graphic. The graphic appears with the green handles,
    ready to be edited (as described later in this hour).


    # Using Other Linux Programs to Convert Graphic Formats


    This book isn''t all about Linux graphics tools, but it is useful to review a
    few programs that can help you get your graphics into StarOffice.'
  merge: -1
  pgno: 225
- img_proc: true
  md: "StarOffice supports a variety of image formats, including GIF, TIFF, BMP, EPS,\
    \ JPEG,\nWMF, Mac-pict, PNG, and a few others.\n\nWhen you have to deal with another\
    \ image format, however, you can also try one of\nthese tools to convert it to\
