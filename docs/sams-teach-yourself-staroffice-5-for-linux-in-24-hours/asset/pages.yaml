  md: '# Importing and Exporting Graphics


    StarOffice supports a long list of graphics formats. Hour 11, "Adding Graphics
    to Documents," describes how to import graphic images into a document. This same
    process can be used to import saved image files into spreadsheets, presentations,
    or StarDraw files.


    When you create a bitmaps image in the Image Editor (described in Hour 11), or
