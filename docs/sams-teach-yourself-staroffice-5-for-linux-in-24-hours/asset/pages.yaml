  md: '# Adding Speaker Notes


    Speaker notes (also called presenter notes) can guide you in making a presentation.
    They help you cover all the relevant points, in the correct order. They can also
    provide additional information in case questions arise during your presentation.


    Speaker notes can be printed out on paper (described later in this hour) or displayed
    onscreen in the Notes view, as Speaker notes are not intended for distribution
    to the audience; they provide information for the presenter.


    Speaker notes can also be useful if you''re preparing a presentation but not giving
    it. The speaker will appreciate the additional information and guidance on the
    topics as preparation for what the audience might ask or to hear.


    To add notes to a slide, you must be in the Notes view of your slides. Choose
    Master View from the View menu, and then Notes from the Master View submenu.


    With the Notes view onscreen, you can add notes by double-clicking on the bottom
    half of the page that is displayed. A heavy line surrounds the notes area and
    a cursor appears.


    Type the notes that you want to add to the slide. You can format the text as you
    do any paragraph of text in a StarOffice. You can


    +   - Change the font size of the text to fit more in the Notes window or to make
    easier to read (You only have the half page shown for each slide—no running over
    a multi-page footnote).

    - Use bold, italic, or underline to emphasize points in the notes.

    - Set justification to center or align paragraphs.

    - Make the spacing between paragraphs wider or narrower (single- or double-spaced).
    Double-spaced is a good idea if you''re using a smaller font size.


    All these formatting options are available from the Format menu, from the toolbar,
    or by right-clicking in the notes area and selecting from the editing pop-up menu
    that appears (see Figure 21.15).


    The slide itself is generally where you include graphics to your presentation,
    but you can also include them in the notes area so that they are only visible
    to the speaker.


    With the notes selected, you can choose Picture from the Insert menu, and then
    select From File... from the Picture submenu. The now-familiar Insert Picture
    dialog box appears, and you can select an image file to insert into the Notes
    area (see Figure 21.16).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_424_0.png)'
  merge: -1
  pgno: 424
- img_proc: true
