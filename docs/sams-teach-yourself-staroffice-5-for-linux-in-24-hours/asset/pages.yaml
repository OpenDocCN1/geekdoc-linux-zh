  md: '# FIGURE 7.11


    The Print dialog box enables you to set several options before printing your document.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_159_0.png)


    # Setting Options for All Text Documents


    In Hour 4, you learned how to set General Options that apply to all the files
    you can create in StarOffice. In addition to these options, you can set specific
    options to all text documents. To see the Text Document Options dialog box, select
    Options from the Tools menu, and then choose Text Document. The dialog box opens
    with the first tab (Contents) selected, as in Figure 7.12.


    The Text Document dialog box includes eight tabs that you can select to set different
    options. The sections that follow highlight the options that will be the most
    useful to you.


    > The name Text Document refers to several types of documents that you can create
    in StarOffice, such as email messages, faxes from templates, and so forth. All
    these documents use the options that you set in the Text Document Options dialog
    box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_159_1.png)


    # Choosing Which Parts of a Document Are Displayed


    The Contents tab determines which types of information are displayed in the document
    window, and how they are displayed. In the Contents tab you can set the following
    options:'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Creating a New StarWriter Document


    +   - Which parts of a document to display onscreen or to keep hidden (such as
    tables, graphics, and notes)

    - Whether to display fields and notes with shading for easy identification

    - Which special characters to display onscreen (things such as paragraph marks
    and tabs can be indicated with a visible character)


    Figure 7.12

    in the Text Document Options dialog box, you can set options for display, fonts,
    tables, and so forth for all text documents.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_160_0.png)


    Choosing How the Document Layout Is Displayed

    The Layout tab defines options for measurements and other features that determine
    how formatting options are applied or viewed. In the Layout tab you can set the
    following options:


    +   - How far apart the default tab options are set

    - Which measurement system to use in the document for rulers, indents, and so
    forth (for example, picas, inches, or millimeters)

    - Which windowing options are available for the document (rulers and scrolling)


    In the Grid tab you can turn on a visible grid, or just "snap to" an invisible
    grid and set the resolution of the points on that grid.


    # Changing the Default Fonts for Text Documents


    When you create a new StarOffice document and start entering text, StarOffice
    uses a certain font or typeface for your document.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'In the Standard Fonts tab, shown in Figure 7.13, you can set the default fonts
    that are used for documents. Different fonts can be specified for different paragraph
    styles, including settings for headings, indices, and captions, in addition to
    the standard font for body text.


    # FIGURE 7.13


    Default fonts for the main styles in a text document are set in the Standard Fonts
    tab of the Text Document Options dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_161_0.png)


    If you prefer, you can check a box to set these fonts just for the current document,
    rather than for all text documents.


    When you want to change the default font for one of the paragraph types, use the
    drop-down list to select from the installed StarOffice fonts.


    # Setting Text Document Printing Options


    In the Print tab, shown in Figure 7.14, you can select which parts of a text document
    are printed. For example, you can turn on printing of special fields, tables,
    and so forth, or you can select to print only left or right pages.


    As another example, suppose you''re working on a document that contains many graphics.
    You can choose to print the document without printing any of the graphics or drawings
    while you''re revising the early drafts of the document; or, you might choose
    to print the document without any of the notes that you''ve added.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Creating a New StarWriter Document


    FIGURE 7.14


    Printing for a text document can be configured in the Print tab of the Text Document
    Options box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_162_0.png)


    The Options button in the Print dialog box (opened from the File menu) enables
    you to go directly to the Text Document Options tab.


    # Setting Table Options


    The final tab that is described for setting Text Document Options applies to Tables.
    In the Table tab you can set the table size is affected by your editing.


    Specifically, you can set the default width and height for columns and rows when
    you insert a new table, as well as whether changes to a cell''s contents affect
    the entire table size or just the adjacent parts of the table.


    The Text Document Options dialog box includes a few additional options that you
    can see in the figures or experiment with as you work, but the options that you''re
    most likely to use as you create documents have been covered here.'
