- img_proc: true
  md: '# Creating Graphics with StarDraw


    StarDraw is a vector-based drawing program. You can use the Image Editor in StarOffice
    if you need to create bitmaps images. The advantages of using StarDraw for a graph-ics
    project include


    +   - Graphics files are smaller than equivalent bitmaps images, unless you''re
    creating a very complicated image.

    - Graphics can be resized for display on different screens or printed formats.

    - Objects within StarDraw images (objects are described later in this hour) individually
    modified.


    Vector images are useful for flyers, business graphics such as boxes and brochures
    that have a lot of text, and page layout tasks such as newsletters.


    The following section shows you how to create a new StarDraw image and start working
    with the drawing tools that StarDraw provides.


    # Creating a New StarDraw Image


    To start a new StarDraw image, double-click on the New Drawing icon on the StarOffice
    desktop, or choose Drawing from the Start menu or Submenu on the File menu.


