    From the Event Layout dialog box you can set how a workweek is defined, which
    colors to assign to event categories, and how the display of events in the calendar
    is autosized for easy reading.


    # Setting up Reminders and Recurring Events


    When you have an important event coming up, it can be helpful to have a reminder
    to get to you on time. StarSchedule enables you to define pop-up dialogs or email
    messages as a method for receiving a reminder about an important event.


    Not all events require a reminder, of course, so you''ll have to explicitly set
    the reminder option for events that warrant it.


    To set a reminder for a calendar event, follow these steps:


    +   1. Enter the event in your calendar.

    2. Turn on the Details area of the screen. Notice that the Details for an event
    includes additional buttons compared to Details for a task.

    3. Click the Reminder button to display Event Reminder options.

    4. Choose Dialog to display a pop-up dialog box before the event time (you select
    how far in advance from the drop-down list).

    5. Choose the Play sound checkbox to play a tune as the dialog box appears (this
    helps if you might not be in front of your computer).

    6. If you prefer an email reminder (this is a good idea for recurring events—see
    the next section), choose the Email button.

    7. Define the amount of time before the event to send the email (allow time for
    your email server to deliver the message).

    8. Define the email address to which to send the reminder.

    9. Click on another time slot to indicate that you''ve finished setting up details
    for this event.


    If StarSchedule is not started automatically when StarOffice begins (this is the
    default case), a dialog box warns you that reminders require StarSchedule to be
    started with StarOffice. You can select a button to make this happen.'
  merge: -1
  pgno: 503
- img_proc: true
  md: '# Using StarSchedule


    > If you haven''t defined any email settings, including an email Outbox, the email
    reminder features can''t function. See Hour 23, "Using StarOffice Email and Newsgroup
    Features," for information on setting up email in StarOffice.


    Some events assigned to a particular day or week occur at regular intervals. StarSchedule
    enables you to mark those recurring events so that they appear automatically in
    your event calendar. To set up a recurring event, follow these steps:


    +   1. Enter the new event in your calendar.

    2. Click the Recurrence button to display recurring event options. None is selected
    by default.

    3. Choose the radio button that matches how this event is to be automatically
    scheduled in your calendar: daily, weekly, monthly, or yearly. The options to
    the right change according to your selection (see Figure 24.20).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_504_0.png)


    FIGURE 24.20 Recurring events can be defined precisely in the Details for any
    calendar event.


    4. Choose the appropriate settings for when you want the recurring event to be
    scheduled.


    5. Click in another time slot in the calendar to indicate that you''ve finished
    defining the details for this event.


    > A recurring event is often a good place to use an event reminder. Weekly or
    monthly events are often easily forgotten.'
  merge: -1
