    # Using Other StarOffice Internet Functions


    The rest of this hour describes how to use the other Internet capabilities of
    StarOffice. To access most of these features, you must create a new icon in the
    Explorer window, just as you created a POP account to access email. New icons
    in the Explorer are created by right-clicking on the word Explorer at the top
    of the Explorer window.


    The Internet functions available within the Explorer include


    +   - Reading email via POP or IMAP protocols (described in the previous section)

    - Browsing FTP servers

    - Reading newsgroups

    - Adding Internet links and searches as icons on your Desktop


    Most of these services require that you set up certain configuration options.
    In particular, server names and networking information (such as proxy server or
    username and password) must be entered in the configuration for an Internet option
    that you want to make use.


    # Browsing an FTP Site


    FTP sites are Internet archives. They don''t include graphics and sound like Web
    sites, but they have files that you can download for use on your computer. Most
    publicly available FTP sites allow any user to log in to download files using
    the username anonymous or ftp, and a complete email address as a password.


    To browse an FTP site within StarOffice, start by right-clicking on the word Explorer
    in the Explorer window. From the New submenu, choose FTP Account. The Properties
    of FTP Account dialog box appears (see Figure 23.12).'
