  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_202_0.png)


    # HOUR 10


    # Using Tables, Indexes, and Other Special Features


    In this hour, you will learn how to use some of the more common features of StarOffice
    beyond the standard formatting discussed in Hours 8, "Formatting Your Document,"
    and 9, "Using Advanced Formatting Tools."


    Specifically, many of your documents will include tables. In this hour you learn
    how to insert and modify StarOffice tables. Also, if you work on any large documents
    (more than, say, 20 pages), you might want to use the automatic index generation
    in StarOffice. Finally, this hour explores some other useful features such as
    using outline mode and automatic bulleted lists.


    Some of these features are much easier to show you if you have an existing document.
    At times, a reference is made to one of the sample documents that comes with StarOffice.
    In any case, you''re probably starting to work with your own documents, so you
    can try out the tasks on your own.'
