  md: '# Adding Graphics and Charts to Your Presentation


    | Tool name and icon | Description |

    | --- | --- |

    | Rectangle frame tool: an unfilled rectangle | Click and drag to form an unfilled
    square or rectangle |

    | Ellipse tool: a filled ellipse | Click and drag to form a filled circle or ellipse
    |

    | Ellipse frame tool: an unfilled ellipse | Click and drag to form an unfilled
    circle or ellipse |

    | Airbrush tool; a pen with ink around it | Draw freehand lines with an airbrush
    effect |

    | Color tool; a rainbow | Set colors in your image by RGB channel, black and white,
    or other methods (using the fly-out menu). |

    | Effects tool | Add effects to your image, such as charcoal, tile, embossed,
    and so on. |

    | Eyedropper tool | Select an existing color in your image as the current palette
    color for drawing actions. |


    > If you click and Zoom on some of the image manipulation tools in the Main toolbar
    (Zoom, Image, Color, or Effects), a fly-out set of icons appears; you can select
    options related to that tool. Hour 6, "Creating Graphics with StarDraw," describes
    these fly-out menus in more detail.


    You can resize the image using the mouse in the corner of the window. Changing
    the size of the Image Editing window doesn''t make the image larger after editing,
    it just gives you more space to view the image during editing.


    When you are done editing a graphic in the Image Editor, click the mouse somewhere
    else on the slide (not in the image window). The Image Editor closes, leaving
    the edited image on your slide.


    # Adding Actions to Graphics


    Graphics in presentations have a special linking feature that makes them especially
    useful. A slideshow is often viewed on-line, whereas a spreadsheet or word processing
    document is almost always viewed on paper.


    When you add a graphic to the slide, the graphic can be live. That is, it can
    have an action associated with it that when you run a slide show, clicking on
    the graphic causes a certain action to occur in the slide show. This is similar
    to having a programmable button that you define on a slide.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_398_0.png)'
  merge: -1
  pgno: 398
- img_proc: true
  md: "To use this feature, follow these steps:\n\n+   1. Import a graphic into your\
    \ slide.\n2. Select the imported graphic by clicking on it so that you can edit\
    \ its properties.\n3. Choose Interaction from the Presentation menu. The Interaction\
    \ dialog box appears. No action is selected, so the dialog box isn't much to look\
    \ at right now.\n4. Click on the drop-down box and select an action to associate\
    \ with clicking on this. The choices include the following:\n   * Play a sound.\n\
    \   * Start another Linux program.\n   * Go forward or backward in the slide show.\n\
    \   * Go to another StarOffice document (for example, a full spreadsheet that\
