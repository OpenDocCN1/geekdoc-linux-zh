  md: '# HOUR 22


    # Creating Internet Documents with StarOffice


    This hour describes how to use key Internet features of StarOffice to integrate
    the documents that you create with StarOffice with those that you find or want
    to provide on the Internet.


    StarOffice is the most completely integrated Office suite available. Whereas the
    rest of this book has described how to use the basic features of StarOffice, in
    this hour you''ll learn how to integrate many of those features into an Internet
    environment.


    # Setting Internet Options


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_440_0.png)'
  merge: -1
  pgno: 440
- img_proc: true
  md: 'If you are connected to the Internet and have a correctly configured Linux
    system, the browser features of StarOffice will work correctly without any additional
    action on your part. This hour provides a review of the Internet options to help
    you understand a little more about how StarOffice interacts with the Internet.


    The technical descriptions are kept to a minimum as the Internet options are described,
    but you might find you need more information to set up the Internet connection
    properly. Correct your system administrator or, if you pick a copy of Sams Teach
    Yourself Linux in 24 Hours or Special Edition Using Linux, 4th Edition. Either
    of these books can teach you more about the protocols and Internet server tools
    of Linux—things that are only touched on here.


    Using StarOffice with the Internet involves three separate sets of option settings
    within StarOffice:


    +   * Basic Internet connectivity information (servers, proxy, and so on)

    * Internet Browser configuration (caching, display sizes, and so on)

    * HTML Document settings (source text and table options, content display, printing,
    and so on)


    The following section describes the Internet options that allow your connection
    to the Internet to work correctly. The browser and HTML options are described
    later in this hour.


    # Choosing Internet Server Options


    StarOffice provides many Internet capabilities, but you have to set them up before
    you can use them. This setup is done in the Internet Options dialog box, which
    you can open by selecting Selecting Options from the Tools menu, and selecting
    Internet... from the Options submenu. (See Figure 22.1).


    The first tab, Proxy, defines the proxy server that you''re using for your Internet
    connection. If you have no proxy server, you can leave this to None. If you are
    using a proxy server, choose Manual and enter the server name and port number
    for each protocol that uses the proxy.


    For example, the server might be something such as gw.thomastravel.com, and the
    port might be something such as 3260. The server and port are often the same for
    all the protocols in the list.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# Creating Internet Documents with StarOffice


    # FIGURE 22.1


    The Internet options dialog box controls the configuration of Internet servers
    and protocols within StarOffice.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_442_0.png)


    > If you thought you had an Internet connection, but the browser functions (described
    later) don''t work, your network might require a proxy to access Internet protocols
    such as HTTP. Check with your network administrator for more information.


    Email and newsgroups are the subject of Hour 23; however, setting up the connection
    to use them is part of this dialog box, so it is described here.


    In the Mail/News tab (see Figure 22.2), enter the server names and user information
    required to retrieve and send email messages and newsgroup postings.


    The Outgoing and Incoming mail servers are often different. The Outgoing mail
    server might be the name of the system on which you are running StarOffice, if
    your Linux system is running a mail server as Qmail or Sendmail.


    The incoming mail server can also be your Linux system, but might be another server
    on your network or the Internet. StarOffice can use several different mail protocols
    to send and receive email, depending on how your network is configured and how
    you set up an email account (described in Hour 23). The User ID and Password that
    you enter in this box are used mainly to retrieve POP3 email from a POP mail server.'
  merge: -1
  pgno: 442
- img_proc: true
  md: '# FIGURE 22.2


    In the Mail/News tab, enter the server names and usernames needed to access your
    email and post to news-groups.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_443_0.png)


    The News server is the computer that contains the newsgroups that you want to
    read and post to. Unless you have a large system and a lot of expertise, your
    desktop Linux computer is probably not the news server (they are difficult to
    set up and are not set by default like mail servers).


    Enter the name of the nearest news server on your network, or the news server
    at your ISP location.


    Finally, the Text Format area defines how incoming messages for email and news
    are formatted. You can save a message in any of these formats as you view it,
    so the choice is not restrictive.


    The other server option that might need some attention is the LDAP Server tab
    (see Figure 22.3).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_443_1.png)


    LDAP is a directory service protocol that enables you to access worldwide listings
    of people and resources through your Web browser. LDAP is growing rapidly in popularity.
    Linux is developing strong LDAP support, so you might be able to use LDAP for
    these directory services soon.'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# Creating Internet Documents with StarOffice


    # FIGURE 22.3


    The LDAP server tab lists directory servers that StarOffice can use as you access
    the Internet.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_444_0.png)


    The name of each LDAP server is listed in the Server list. You can define a new
    LDAP server that you want to access by pressing the New... button. You can also
    select any of the servers listed and choose Modify... to see or update the information
    related to that LDAP server (See Figure 22.4.) Note that the standard port for
    the LDAP protocol is 389. If you choose another port number, you might not be
    able to access the LDAP server.


    # FIGURE 22.4


    Each LDAP server can be set up with a server and port number.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_444_1.png)'
  merge: -1
  pgno: 444
- img_proc: true
  md: 'Four11., a master LDAP directory server that is available to everyone on the
    Internet, is already included in the LDAP Server list.


    # Setting up Internet Searching


    The Web is becoming much friendlier to those who don''t know their way around.
    Directories, search engines, and other portals provide guidance as you seek information
    on a particular topic.


    StarOffice integrates access to seven of the most popular search sites (or portals)
    as part of its browser capabilities. In the Search tab (see Figure 22.5), you
    can review the search options that are set by default, or you can alter the them
    as needed.


    FIGURE 22.5


    In the Search tab, you can review or alter how popular search engines are used
    to retrieve information on topics for which you search.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_445_0.png)


    For example, Yahoo! is shown in the list of search engines. When you click on,
    the Prefix field shows the URL that StarOffice uses to send a search query to
    Yahoo. Words that you enter as subjects to search for are added to the information
    shown so that you can receive a list of search hits.


    Unless you discover that one of the seven nationwide search engines has altered
    their searching format, you won''t need to change anything in the Search tab.'
  merge: -1
  pgno: 445
- img_proc: true
  md: '# Setting up Internet Protocols


    Internet connectivity for your Linux system is not set up in StarOffice. You can
    use commands such as route and ifconfig at a Linux command line to examine your
    network (if you''re logged in as root).


    Within StarOffice, however, you can set a couple of networking options. These
    are included on the Protocol tab of the Internet dialog box. (See Figure 22.6).


    FIGURE 22.6

    In the Protocols tab, you can define settings for HTTP, FTP, and DNS.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_446_0.png)


    In the HTTP area, you can define how many connections are used at the same time
    to retrieve a document. For example: if you request an HTML document in turn contains
    ten small graphics, StarOffice can request several of them at the same time instead
    of requesting one, waiting for a reply, and then requesting the next one.


    > If you have a fast Internet connection (such as a 56K modem or faster), you
    can increase this number from the default of four. If you are using a slow modem,
    increasing the connection won''t improve the speed of document downloads.'
  merge: -1
  pgno: 446
- img_proc: true
  md: 'The Include email address checkbox determines whether your email address (as
    entered in the General Options dialog box, described in Hour 4, “Configuring StarOffice”)
    needs to be included as part of each request that is sent to a Web server. If
    this checkbox is selected, Web servers can log your email address and use it to
    send you information (such as advertising). Most people probably prefer to leave
    this unchecked (the default setting).


    > Not all Web servers can or track email addresses submitted with page requests.
    Most of those who track them for statistical purposes will need to use them for
    unsolicited advertising—but why give them the chance?


    Connections for FTP servers are handled like those for Web servers (HTTP servers).
    You can choose to have multiple connections at the same time to speed up the retrieval
    of files. However, using an FTP server usually involves only a single interaction.
    An FTP site doesn''t include multiple graphics that are downloaded at the same
    time to create a page.


    The default setting of two FTP connections will be fine, even if you''re using
    a fast Internet connection.


    In the DNS server area, you define how the Domain Name Service is used within
    StarOffice. Domain Name Service is the network system that maps from an Internet
    IP address to a name such as www.cnn.com.


    The DNS server area works independently of the settings within your Linux system;
    that is, it can. If you select Automatic, StarOffice uses your Linux settings
    to find a DNS name server. If you prefer to use a different name server with StarOffice,
    you can select Manual and enter the IP address of another DNS name server.


    > The DNS name server on your network might work in conjunction with a proxy server
    (see the Proxy section earlier in this hour). Choosing a different name server
    might not be possible.


    When you have finished setting options in the Internet Options dialog box, choose
    OK to apply your changes and close the dialog box.'
  merge: -1
  pgno: 447
- img_proc: true
  md: '# Using the StarOffice Browser


    With the Internet access options set, you can use StarOffice as a Web browser
    as easily as you use it to create documents.


    # Opening a Web Document


    Viewing a document from the Web in StarOffice is as easy as entering the URL.
    Make sure that the Function toolbar is visible, and then enter the URL that you
    want to view in the URL field (see Figure 22.7) and press Enter.


    FIGURE 22.7


    Enter the URL for the page that you want to view in the URL field on the Function
    toolbar.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_448_0.png)


    > In the drop-down list below the URL field, you can see a list of other URLs
    for the documents that you''ve been working on. The URLs in this list usually
    start with file:/// to indicate that they are locally-stored documents. This list
    is similar to the history list in a Web browser, or to the list of recently opened
    files on the bottom of the File menu.


    When you press Enter after typing something in the URL field, the Web page or
    file is retrieved and displayed in the working window as if you had used the Open
    item on the File menu. (See Figure 22.8).


    > If your network connection appears to be working in Linux, but not in StarOffice,
    check that the Online button on the function toolbar (a small globe) is toggled
    to On.'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# FIGURE 22.8


    A Web address entered in the URL field that causes that page to be retrieved and
    displayed in StarOffice.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_449_0.png)


    After you have retrieved a Web document, you can treat it as in a regular Web
    browser—click on links to view other pages, print it, and so on. However, you
    can also treat the Web document as you do any other StarOffice document—edit,
    save it, or copy and paste parts of the document into other StarOffice documents.


    The formats of the Web and StarOffice are not the same, so some formatting features
    (such as fonts) don''t transfer exactly between the two; but StarOffice is intended
    to be used with the Web, making the Web just like an extension of your local workspace.


    One of the greatest advantages of the Web is its capability to easily hyperlink
    to other documents. StarOffice builds on that feature in several ways, as the
    next sections will describe.


    # Inserting Automatic Links in StarWriter Documents


    As you work with documents in StarOffice that you''ve loaded from the Web, you
    probably click on a lot of links. StarOffice enables you to add links to any StarOffice
    document. This can be done in two ways: automatic or manual links. When either
    type of link


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_449_1.png)


    If you have sufficient permissions and a Web server that supports it, you can
    also upload, or PUT, documents to a Web server from StarOffice; check the StarOffice
    online help for more information.'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# Creating Internet Documents with StarOffice


    is added to a StarOffice document, anyone who reads that document (within StarOffice)
    can click on the link and jump to that page.


    To see an automatic link created, open a StarWriter word processing document and
    enter an URL or an email address as text. For example, in the middle of a document,
    type the following:


    ```

    http://www.linuxjournal.com

    ```


    Notice that StarOffice automatically creates a link to the URL that you entered.
    The link is usually blue and underlined. (See Figure 22.9.) Immediately after
    you enter the sample URL, click on it with your mouse. The document–in this, the
    Web home page for the Linux Journal magazine–appears in StarOffice.


    # FIGURE 22.9


    An URL entered in a StarOffice document is immediately converted to a live Web
    link.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_450_0.png)


    Email addresses function in the same way. Enter an email address such as the following:

    wells@xmission.com


    StarOffice immediately makes it into a mailto: link; therefore, clicking on the
    words that you just entered causes StarOffice to initiate an email message to
    this email address, as shown in Figure 22.10. (See Hour 23 for details on configuring
    and sending email within StarOffice.)'
  merge: -1
