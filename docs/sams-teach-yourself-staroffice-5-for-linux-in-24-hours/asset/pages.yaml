    > The transition Preview shows the transition to the current slide from a black
    background, rather than from the previous slide. It''s still a good idea to review
    the entire presentation as a slide show (with all transitions in place) before
    showing it publicly.


    9. Click on another slide in the slide sorter and repeat the process of assigning
