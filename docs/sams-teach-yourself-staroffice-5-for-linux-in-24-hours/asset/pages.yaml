    +   5. Choose OK to finish creating the new style.


    You''re probably in a bigger hurry than that, however, so here''s an easier way
    to create a new style: it''s called Style Example.


    # Creating a Style by Example


    A Style by Example enables you to format a paragraph just as you want it to look,
    and then to say to StarOffice,"Record how that paragraph looks and duplicate it
    at my command."


    The advantage to Style by Example is that you don''t have to wade through all
    the dialog boxes to see whether you''re missing something in the formatting. You
    can use the standard formatting options you''ve been learning to set up a paragraph,
    and name it as a style.'
