    # # Importing and Exporting Presentations


    Presentations in StarImpress include most of the features you''ll find in the
    popular PowerPoint program. The details of creating presentations can be found
    in Hour 19, “Creating Presentations with StarImpress.”


    Unfortunately, the import and export capabilities of StarImpress are not impressive.

    nAlthough StarOffice lists PowerPoint 97 in the Select Filter dialog box as a
    supported file type for importing documents, it is difficult to get it read in
    native PowerPoint files.


    > If you keep your presentations simple, you might have better luck trying to
    import your PowerPoint 97 presentations into StarOffice.


    The best solution for importing a presentation created in another program such
    as PowerPoint or Corel Presentations is to save the presentation as a series of
    HTML documents, and then to use StarOffice as a Web browser to view the presentation
    on your Linux system.


    # # Exporting StarImpress Presentations


    When you create a StarImpress presentation that you want to use on a computer
    system that does not have StarOffice, your best choice is to use the Export item
    on the File menu to export the presentation as a set of HTML documents.


    You can also select a graphic format to export the current slide as a bitmapped
    image.'
