  md: '# Using Advanced Formatting Tools


    # Creating a Footnote


    Creating a footnote in a StarWriter document is quite easy: Just place the cursor
    in the body of the text where you want the footnote to appear. Then choose Footnote
    from the Insert Menu (see Figure 9.2).


    Figure 9.2 Choose Footnote from the Insert menu to create a new footnote.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_182_0.png)


    After you select the Footnote option under the Insert Footnote Menu, an Insertnote
    dialog box appears (see Figure 9.3). In this dialog box, you can select between
    two


    +   - **Automatic**—This is the default setting (it''s always selected when the
    dialog box opens, even if you''ve chosen Character for a previous footnote). The
    Automatic setting uses the StarOffice defaults. Until you change the footnote
    settings (you''ll learn later in this hour), the Automatic option uses the next
    number in your footnote sequence for this document as the marker for this new
    footnote.


    +   - **Character**—If you don''t want sequential numbers or letters, you can
    define character or characters you want to insert in the body of the text as a
    footnote marker. The Character option allows up to ten characters to be entered.'
  merge: -1
