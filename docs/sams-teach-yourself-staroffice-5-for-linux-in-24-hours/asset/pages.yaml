  md: '# Hour 4


    Two things that you work with regularly can be easily modified: menus and toolbars.

    Menus and toolbars can be configured to contain exactly the commands and icons
    that you want to have immediately accessible.


    Start by exploring how you can change the StarOffice menus to suit your tastes.


    # Selecting Menu Items to Display


    If you''re new to StarOffice, you probably can''t imagine why you''d want to change
    the menu structure—especially because everything you''ll see in this book is based
    on the default menus!


    After you''ve used StarOffice for a while, however, you might find that you want
    the menus to more closely match any application that you use. Perhaps, for example,
    you regularly use a command that''s hard to access via the default menu structure
    (maybe requires you to go through three submenus and a dialog box). In either
    case, setting up the menus to match your preferences makes StarOffice easier to
    use.


    All the commands used in StarOffice are available as menu items. You can select
    any of them from a list and position them anywhere in the menu structure.


    In fact, you can also write your programs in StarOffice BASIC (a macro language
    for StarOffice) and assign custom commands to a new menu item. That, however,
    is beyond the scope of this book.


    To take a look at the menu items, choose Configure from the Tools menu. The menu
    configuration dialog box opens. Select the Menu tab to see the menu configuration
    options, as shown in Figure 4.1.


    You will notice a few things in this figure:


    +   - The menu structure (main menus and submenus or menu items) is indicated
    in the top list by the indentation of the items.

    - The keyboard shortcut for each menu item in the Menu item list has a tilde (-)
    in front of it. For example, the AutoPilot menu item has a tilde in front of the
    u, indicating that pressing u selects this menu item (after pressing Alt+F to
    open the File menu).

    - A command name is shown to the right, in square brackets, for each menu item.

    - Categories of functions or commands are listed in the Category field.

    - All the available commands for the selected functions category are listed in
    the Command list in the dialog box.'
  merge: -1
