- img_proc: true
  md: '# # Importing Excel Spreadsheets


    It is the same with spreadsheets as it is with word processing: file conversion
    and sharing with Microsoft Office products is stronger than with any other office
    software.


    # ## Reading Excel 5.0, 6.0/95 and Excel 97 Files


    The best input filter for spreadsheets in StarOffice is the Excel filter. In fact,
    it''s the only StarOffice filter made specially for spreadsheets. When you use
    the Open dialog box (see Figure 5.8), the familiar Microsoft icon is used for
    any Excel files found in that directory.


    **FIGURE 5.8**

    The familiar icon is used for any Excel spreadsheets that are displayed in the
    Open dialog box.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_121_0.png)


    You can open Excel files from versions 5.0, 6.0, 95, or 97 within StarCal. Just
    use the same steps that you use to open other StarOffice documents (using the
    Open dialog box). You can store Excel documents on your StarOffice Desktop and
    double-click to start editing them.


    Of course, when you save any Excel document that you''ve been editing, you need
    to watch the file format to ensure it''s set correctly. If you open an Excel spreadsheet,
    edit that spreadsheet, and use Save or Save As, StarOffice uses the same Excel
    filter (version) that was used to read in the file.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Importing and Exporting StarOffice Documents


    When using the StarOffice filter to save documents in Excel format, be careful
    to check large or complex spreadsheets the first time you import them or when
    moving them back and forth between Microsoft Office and StarOffice. There haven''t
    been problems exchanging files with Excel users, but we might not be stretching
    the capabilities of the filter with a lot of complex charts, formulas, and so
    on.


    > It''s a good idea to save a StarOffice-formatted spreadsheet--or at least a
    backup of the Excel-formatted document--that you intend to pass on to a colleague
    until you''ve heard from that person that the file can be opened.


    # Import Other Spreadsheet Formats


    Besides Microsoft Excel spreadsheets, you can have spreadsheets in several other
    formats. The sections that follow describe how to open other documents in StarOffice.


    # Using Lotus 1-2-3 Spreadsheet Files


    Lotus 1-2-3 is arguably the second most-used spreadsheet in the world. StarOffice,
    however, does not give it attention.


    Lotus 1-2-3 1.0 is listed in the Select Filter dialog box as an option when you
    open a file with an unrecognized format (See Figure 5.9) But this Lotus filter
    opens the sheet in StarWriter as a word processing document, which isn''t much
    to use of.


    FIGURE 5.9

    Select Filter dialog box enables you to select the correct format for the file
    that you want to import into StarOffice.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'If you have a Lotus 1-2-3 spreadsheet that you want to edit in StarOffice,
    you''ll need to open the file within Lotus 1-2-3 and then use the Save As command
    to save the file in one of the following formats:


    +   - Excel 4.0, 5.0, 95, or 97

    - HTML

    - DIF


    Using DIF and HTML is described a little later in this hour. Depending on the
    version of Lotus 1-2-3 that you''re using, all these options might not be available
    in the Lotus Save dialog box.


    If you can use the Excel option to save your Lotus 1-2-3 spreadsheet, the file
    type is detected automatically and the file opens in StarOffice without a problem.
    If the format cannot be recognized, the Select Filter dialog box (previously)
    appears), and you can select the correct format.


    Although this is really the only way to use Lotus 1-2-3 spreadsheet files, the
    combination of a non-Microsoft export filter in Lotus and a non-Microsoft input
    filter in StarOffice can lead to uncertain results. Check your spreadsheet carefully
    for errors, and keep backup copies until you''re certain that the transfer worked.


    # Using Other Interchange Formats


    StarOffice doesn''t really support any other native spreadsheet formats. It does,
    however, provide the Data Interchange Format (DIF), which can be used successfully
    in some cases. DIF is intended for use with databases more than with spreadsheets,
    but it is a widely used standard format that any spreadsheet can most likely save
    in.


    The best option for using spreadsheets created by other programs is to use the
    Save As dialog box to save the document in an Excel format. Using both an input
    filter and an output filter on your spreadsheet increases the chance that a problem
    might occurring; however, the StarOffice input filter for Excel really provides
    the best option because it is so much further than any other interchange format
    for spreadsheets with StarOffice.


    Although StarOffice handles HTML text very well, comma-delimited text—or even
    HTML—won preserve the formulas that are part of your spreadsheet. It only preserves
    the values that are calculated from those formulas.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'Therefore, if you want to use your spreadsheet to show someone your results,
    HTML is fine. If you need to continue working on the spreadsheet, however, HTML
    is useless.


    # Exporting Spreadsheets for Use in Other Programs


    If you need to share StarOffice spreadsheets with a colleague that uses another
    spreadsheet program, the other program is not likely to read StarOffice files.
    None of the other popular spreadsheets—Lotus 1-2-3, Quattro Pro, Microsoft Works—support
    importing StarOffice spreadsheet files.


    Instead, you''ll need to export your StarOffice spreadsheet files in a format
    that can be read by the other spreadsheet program.


    StarOffice provides the following useful spreadsheet export filters from the Save
    As dialog box:


    +   * Excel 4.0, 5.0, 95, and 97

    * HTML

    * dBASE (database format)

    * Text


    To save a StarOffice spreadsheet in another format, follow these steps:


    +   1. Choose Save As from the File menu. The Save As dialog box opens.

    2. Select a format from the File type drop-down list.


    > As described in the previous sections, the best option for exporting a file
    for use in another word processor is Excel. (Use the latest version of Excel that
    the target computer has installed.) If you use any of the other formats listed
    previously, some formatting or formula information will be lost during the conversion.


    +   3. Enter a different name for the document.


    +   4. Select the directory in which the new file is to be saved (remember that
    you can''t save the file directly to a floppy diskette unless you have mounted
    it in your Linux system).


    +   5. Choose OK to save the document.'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'After you''ve saved a StarCalc spreadsheet in a format such as Excel, you can
    use that spreadsheet in any program that can import that format. Because of the
    popularity of Excel, any program released after the release of Excel 5 probably
    has this capability.


    In fact, most spreadsheet programs determine the file format automatically, based
    on the file extension or content, and apply the correct correction to the Excel
    format. For example, if you open an Excel 5 spreadsheet in Lotus 1-2-3 version
    3.1 for Windows, file imports automatically and appears on your screen.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_125_0.png)


    In some cases, a spreadsheet program can''t determine the format of a file. In
    such a case, you normally choose the format from a dialog box that lists the available
    filters.


    # Reviewing Imported and Exported Sheets


    Any time you move a spreadsheet between programs using a non-native format—for
    example, reading an Excel file into StarOffice—check the spreadsheet to see how
    well the conversion worked.


    Although we''ve had good luck with the Excel filter in StarOffice (which is recommended
    for almost all spreadsheet exchanges), you might have problems with some fea-


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_125_1.png)


    In all spreadsheet programs, some conversion filters work better than others.
    Importing one type of file might work well, whereas importing another type might
    leave a spreadsheet full of errors. Check any important areas after importing
    a spreadsheet.


    tures.


    Table 5.3 lists some things that you can check to see how converted spreadsheets
    have fared, in addition to listing some problems that you might encounter after
    importing and exporting files.'
  merge: -1
