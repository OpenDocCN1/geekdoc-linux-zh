    # # HOUR 18

    Using Database Functions


    In this hour you will learn about the database functions of StarOffice.

    Database functions enable you to operate on a set of spreadsheet data as if it
    were records in a database. The data in spreadsheet cells is examined using spreadsheet
    functions in formulas that provide useful tools for manipulating your data.


    The database features that you''ll learn about include using data validity checking
    to help guide you in entering data in your sheet, plus sorting and filtering features
    to organize large amounts of data.'
