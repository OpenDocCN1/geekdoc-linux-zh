    # Adding Columns to an Existing Document


    If you already have a document and want to change its layout to include columns,
    place the cursor anywhere in the body of the document and follow these steps:


    +   - Select Page from the Format menu and choose the Columns.


    +   - Define the number of Columns you want by selecting one of the pictures in
    the Columns area.


    +   - Change the Spacing Field in the Column width section to something such as
    .1 or .2 inches (as you prefer).


    +   - Define a line to separate the columns (if you want one).


    +   - OK.


    StarOffice immediately formats your document according to the columns that you
    defined. Unfortunately, you cannot set columns for just a part of your document.
    It''s all columns in the same style—or no columns.'
