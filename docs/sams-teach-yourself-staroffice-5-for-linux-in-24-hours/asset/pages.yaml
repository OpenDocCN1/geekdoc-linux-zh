- img_proc: true
  md: '# Spellchecking Your Document


    The AutoCorrect feature is nice, but a traditional spellchecker provides more
    flexibility. At the same time, the Auto Spellcheck feature can underline words
    in red that aren''t in the dictionary, but it doesn''t fix your errors. You might
    need to run the spellchecker to correct the errors.


    # Using the Pop-Up Spelling Menu


    StarWriter enables you to check the spelling of a document using a special pop-up
    menu, or with a standard dialog box.


    To check the spelling of a single word in a document, position your mouse pointer
    over a word that has a red underline and click the right mouse button. When you
    do this, a menu similar to the one in Figure 12.6 is displayed.


    FIGURE 12.6

    The right-click pop-up menu contains different ent spelling options.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_246_0.png)


    > If you right-click on a word without a red underline (or with Auto Spellcheck
    turned off), you''ll see a different menu than the one described here.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'The pop-up menu is divided into two sections. The top section contains words
    that StarWriter suggests as possible corrections for the word you right-clicked.
    If you select one of the words in the top section of the menu, the word you clicked
    is replaced with the word you selected from the menu.


    > The pop-up menu you see has only four items, starting with Spelling, StarOffice
    can''t determine any suggestions to correct the word that you clicked. You''ll
    have to use a paper dictionary.


    In the bottom part of the pop-up menu, the following four commands are listed:


    +   * Spelling—Selecting the Spelling item opens the full Spellcheck dialog box,
    which is described at later length in this chapter. Choosing this option is a
    good idea if you want to have more help determining how to correct it.

    * Add—Selecting Add adds the word to the spelling dictionary that you select from
    the submenu that appears (see Figure 12.7).


    FIGURE 12.7

    Add opens a submenu where you can select a dictionary to which to add a word.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_247_0.png)'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'Adding a word to a dictionary means that word won''t be marked as misspellelled
    any longer. You learn more about this in the next section.


    +   * **Ignore All**—Selecting Ignore All causes the StarOffice spellchecker (including
    the Auto Spellchecker) to ignore the misspelled word throughout this entire document.


    +   * **AutoCorrect**—Selecting AutoCorrect opens a submenu with suggestions for
    how this word can be corrected. (See Figure 12.8.) If you select one of the items
    in the AutoCorrect submenu, that correction is added to the AutoCorrect configuration.
    This means that any time you type this word (the one you right-clicked on) in
    this way, it is corrected to the spelling that you selected in the AutoCorrect
    submenu.


    # FIGURE 12.8

    AutoCorrect opens a submenu where you can select a spelling correction to add
    to the AutoCorrect feature.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_248_0.png)


    You can review any item that you add to AutoCorrect via this menu by looking it
    up in the AutoCorrect dialog box, described earlier in this hour.


    Don''t add every word to the AutoCorrect feature. It can become overwhelmed and
    sluggish. Just add words that you habitually misspell (as in the previous regards
    example).'
