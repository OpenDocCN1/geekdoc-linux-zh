    One reason that StarOffice isn''t perfect for creating other Web pages is the
    limited set of features. Some HTML features that many people like to use, such
    as frames and client-side image maps, cannot be added using automated tools when
    you create an HTML page in StarOffice (although they are supported when viewing
    Web pages that you download into StarOffice).'
