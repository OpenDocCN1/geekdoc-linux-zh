  md: 'To deselect options from the list, follow these steps:


    +   1. Click on the plus sign (+) to the left of the type of item that you want
    to deselect. That item expands to display its contents.


    +   2. Click on the plus sign for sublevel components, if necessary.


    +   3. Click on the icon or name of an item that you don''t want to install. The
    icon goes blank and the Required disk space line in the bottom of the screen is
    updated to reflect the new system requirements.


    +   4. Click again on any icon that you want to reselect so that it is included
    in the installation.


