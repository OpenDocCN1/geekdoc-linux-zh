    files.


    Instead, you need to export your StarOffice files in a format that can be read
    by another word processor. StarOffice provides several export filters from the
    Save As dialog box (see Figure 5.7):


    As with preparing a file for import into StarOffice, the main formats to use for
    exporting to other word processors are as follows:


