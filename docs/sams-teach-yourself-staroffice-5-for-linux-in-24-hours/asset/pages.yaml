  md: '# Using Layers


    If you use a lot of images in your documents, you might need to occasionally layer
    them on top of each other to get the effect that you want.


    By selecting options from the Position submenu of the Format menu, you can raise
    or lower images as graphical layers in your document. For example, suppose you
    have two images combined to create an effect, as in Figure 11.13.


    # FIGURE 11.13


    Two images can be overlapped to create an effect.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_235_0.png)


    If you select one of the images and choose Send to Back, the other image covers
    it, as in Figure 11.14.


    # Adding a Border


    Most graphics that you import into your document won''t have a border. Within
    a text document, however, images often need to be set off with a border.


    If you have the Object toolbar displayed onscreen, you can add a border with a
    few mouse clicks. Follow these steps:


    +   1. Select the image to which you want to add a border.

    2. Click on the Border icon on the Object toolbar (see Figure 11.15).'
