  md: '# FIGURE 21.22


    The Navigator window can be displayed during a presentation to help you move among
    the slides in your presentation.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_431_0.png)


    +   * Animations allowed—If this checkbox is selected, any animations that you
    have defined within your slides are executed as each slide is displayed. Uncheck
    this option if you''re concerned about speed, or if you just want to try the presentation
    without animations running.


    +   * Change slides on mouse click—With this checkbox selected, you can use the
