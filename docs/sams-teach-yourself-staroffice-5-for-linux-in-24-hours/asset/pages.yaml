    # # Repairing StarOffice


    The final option in the post-installation setup program is to Repair your StarOffice
    installation. Use this option if something has happened to your Linux filesystem
    that makes StarOffice unable to run.


    You can compare this to having a really bad crash in Microsoft Windows. Instead
    of reinstalling the system or application, you can run the setup utility and use
    the Repair button.


    The Repair feature can determine which parts of StarOffice are missing or misplaced,
    and whether file versions are incompatible. As with modifying the installation,
    this provides a convenient alternative to backing up your data and configurations
    and reinstalling StarOffice.


    Again, you might need access to the original StarOffice archive files that you
    downloaded so that the Repair utility can retrieve any missing files from the
    StarOffice original source. This is only the case, however, if the networked installation
    of StarOffice is damaged.


    # # In the Next Hour


    Hour 2 describes how to start the StarOffice program that you installed in this
    hour. You learn how to use a command line (within the X Window System) or a desktop
    icon to start the program.


    In addition, the next hour walks you through the basic interface elements of the
    StarOffice window, so you start to become familiar with the screen that you''ll
    be seeing throughout this book.'
