  md: '# Using StarSchedule


    To begin with, you can move from the current day (the default starting place in
    the calendar) to any day, week or month. Use the arrows on the Object toolbar
    to move to the next period in the calendar (see Figure 24.16).


    # Figure 24.16


    The arrows on the Object toolbar enable you to move to the next or previous calendar
    period.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_500_0.png)


    Use these arrows to move forward or backward in the events calendar.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_500_1.png)


    The amount that arrows move depends on whether you''re viewing a day, a week,
    or a month.


    You can also change how many days are shown in the onscreen event calendar. Use
    the buttons in the Object toolbar to select one day, a five or seven day week,
    or a full month. The buttons are labeled 1, 5, 7, and 31, respectively.


    With any of these time frames shown in the event calendar, you can select how
    time is divided onscreen. While viewing a single day, for example, if you right-click
    the Select from the Time Scale menu, your time during the day can be broken down
    into hour blocks, or smaller blocks if you prefer.


    > One of our favorite options is the Colors item on the pop-up menu. It enables
    you to assign colors to different task/event categories so that they appear color
    coded on your event calendar.


    The event calendar also has other sections that can be displayed or hidden. You''ll
    want a big screen to use them all (as the figures show).


    The sections that you can turn on display include


    +   The details area—Shows the details for the selected event, much like the details
    described for tasks earlier in this hour.


    +   The task list—Can be displayed in a separate window. This enables you to drag
    tasks to spots on the event calendar so that you can plan to work on them.


    +   A Calendar—Not the event calendar, but a small calendar to find or track dates.'
