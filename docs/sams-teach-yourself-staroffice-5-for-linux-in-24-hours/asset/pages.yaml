  md: '![](img/d07037173ed87c2b5a0d33ea3544eb75_486_0.png)


    #  HOUR 24


    # # Using StarSchedule


    In this hour you''ll learn how to use the StarSchedule features of StarOffice.
    StarSchedule is new to StarOffice 5. It enables you to track to-do lists and calendar
    events, and integrate those events and tasks with others on your network to schedule
    meetings, share ideas, and so forth.


    To make full use of the features of StarSchedule, you need to have other users
    using StarOffice on your network. If you''re a single user on StarOffice, however,
    you can still use the task lists and calendar to track your own time.


    In the sections that follow, you''ll learn how StarSchedule tools are organized,
    and how to work with the task list, events calendar, and address book.


    # # How StarSchedule is Organized


    To use StarSchedule, you''ll work within two different screens of information:
    the Events screen and the Tasks screen. You can view either of these screens by
    either double-clicking on the Events or Tasks icon on the StarOffice Desktop,
    or selecting Events or Tasks within the StarSchedule folder of the Explorer.'
  merge: -1
  pgno: 486
- img_proc: true
  md: '# Hour 24


