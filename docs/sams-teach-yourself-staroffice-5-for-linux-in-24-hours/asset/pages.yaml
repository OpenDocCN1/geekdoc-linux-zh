    # Converting Between Text and Tables


    Another method that you might need to use to create a table involves converting
    an existing list or block of text into a table.


    The StarOffice conversion to tables isn''t as smart as it could be, however. Arrange
    your text so that all the cells on a single row of the table that you want to
    create are on a single line in the text before you convert to a table.


    If you don''t arrange the text in this manner, you can''t tell how many columns
    StarOffice will use when it creates a table from the text lines.


    Each item that is in its own cell in the table needs to be separated from the
    next item by a tab, a comma, or a semicolon.


    Use the following steps to convert text to a table:


    +   1. With your text arranged, select all the text that you want included in
    the table.

    2. Choose Convert Text to Table in the Tools menu (this item is not available
    on the menu until you select a block of text).'
