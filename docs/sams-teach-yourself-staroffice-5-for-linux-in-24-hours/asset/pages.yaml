  md: '# Importing and Exporting StarOffice Documents


    A message often appears when you save in Word format to remind you that some features
    might not transfer to Word format, and therefore you might lose some information.
    If this is a concern, save a copy in native StarOffice format as well.


    Although the StarOffice filters for Word documents are good, be careful about
    assuming that everything converts from a StarOffice file saved as Word 97 to a
    native Windows copy of Word 97.


    In particular, things such as macros, footnotes, headers, tables, and so on might
    not convert or be formatted incorrectly in Word 6.0/95 or Word 97.


    It''s a good idea to save a StarOffice-formatted document—or at least a backup
    of the Word-formatted document that you intend to pass on to a colleague—until
    you''ve heard from that person the file can be opened and is correctly formatted.


    # Reviewing Styles in Imported Files


