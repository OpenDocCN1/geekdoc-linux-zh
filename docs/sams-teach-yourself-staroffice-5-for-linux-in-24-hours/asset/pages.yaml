  md: 'By starting with this type of information, you can experiment with some formulas.
    First, however, you need to know how to edit a cell.


    # Editing a Cell


    Often, you''ll need to return to a cell in which you''ve previously entered information
    and make a change.


    If you move the focus to a cell and start typing, you''ll erase the contents of
    the cell and replace them with what you''re typing. This can be a waste of time
    if you want to preserve most of the cell''s contents.


    You have to tell StarOffice that you want to edit the cell contents instead of
    replacing them. To do this, press the F2 key. You''ll see that the focus outline
    around the current cell disappears, and a cursor appears in the cell.


    > You can also double-click on a cell to begin editing its contents.


    When you''ve finished editing the cell contents, press Enter or click the mouse
    pointer in another cell.


    > In the next section you start using formulas. When you press F2 to edit a cell
    that contains a formula, the formula, rather than the number that was calculated
    from the formula, is displayed for you to edit.


    # Entering Formulas


    A formula is any cell in which StarOffice must do some calculation before displaying
    a numeric or text value.


    To place a formula in a StarOffice cell, start your entry in the cell with an
    equal sign (=). A formula can be simple math, such as the following:


    ```

    =4*5

    ```


    The cell that contained this formula displays


    20'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Using Formulas, Functions, and Names


    Of course, that formula doesn''t serve much purpose in a spreadsheet because it
    is much easier to just enter the result. To make a formula useful, another cell
    is usually referred to, as follows:


    ```

    =4*C55

    ```


    The value displayed in the cell containing this formula depends on the value stored
    in cell C55. Because of the formula, the value of one cell is updated as the value
    in another cell changes. This is the power of a spreadsheet.


    > The four basic math operations—addition, subtraction, multiplication, and division—can
    be used in any formula. In fact, you''ll probably use them regularly as part of
    your formulas.


    An example of a basic formula is to add the values of several cells. Click on
    cell B11 if it doesn''t already have focus. Type the following:


    ```

    =B6+B7+B8+B9+B10

    ```


    When you press Enter, StarCalc adds together the four numbers that you entered
    in your sample spreadsheet and displays the total in cell B11.


    # Using Functions


    Spreadsheets also provide a set of tools that make calculations a lot easier.
    Functions takes a cell or a set of cells as a parameter, and does some calculation
    on those cells to produce a value.


    The value produced by a function can be combined with other functions to reach
    a final cell value. All the calculation is done instantly by StarOffice.


    # Using Functions to Simplify Formulas


    For example, look at the column of sales numbers and the sample formula that you
    entered. The formula you entered is shown here:


    ```

    =B6+B7+B8+B9+B10

    ```


    This works fine, but it''s not ideal. If you had a list of 50 numbers to add?
    Instead of listing all the cell references, you can use a StarOffice function
    called sum(), which adds together all the cells referred to as parameters of the
    function. That formula looks like this:


    ```

    =sum(B6:B10)

    ```'
  merge: -1
