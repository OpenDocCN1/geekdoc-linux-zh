- img_proc: true
  md: 'Using either formula, changing one of the values in cells B6 through B10 changes
    the total shown in cell B11. The recalculation is automatic. Using the sum() function,
    however, has advantages that will become apparent—advantages beyond being easier
    to type in.


    Following is another example to show how useful functions can be.


    Suppose you have prepared a spreadsheet of sales figures. Each time you open the
    spreadsheet for review and printing, you want it to contain a date and time stamp
    at the top of the spreadsheet. This indicates when that sheet was updated and
    printed.


    You can enter a new date and timestamp each time you open the spreadsheet, or
    you can place the formula in a cell somewhere in the spreadsheet:


    ```

    =now()

    ```


    Now, each time you open or recalculate the spreadsheet, the now() function inserts
    the current date and time into that cell (see Figure 15.3).


    # FIGURE 15.3


    The now() function can be used to insert the current date and time in each cell
    you open or recalculate the spreadsheet.


    | | A | B |

    |---|---|---|n| 1 | =NOW() |

    | 2 | 1/11/99 17:28 |


    > If your columns are too narrow to display the complete result of a formula,
    you''ll see something like ####. Click on the border of the column heading and
    drag the column so that it''s a little wider, and you can view the result.


    # Finding Functions


    When you begin using StarOffice to create complex spreadsheets, you might not
    know which functions are available to get the results you want. The sum() function
    is the most used function, but beyond that, how do you find and use the right
    function?


    The answer is the StarOffice Function AutoPilot. By using this tool, you can review
    a list of functions by category, choose the one that you think fits your needs,
    and then review what the function does and be guided to enter the correct parameters
    to make it work correctly.'
  merge: -1
