  md: 'You can see how useful this feature can be when you''re using StarOffice for
    lists or tables of information. With data validation, all the information in the
    table is valid and useful. Typing or knowledge errors can be greatly reduced by
    using simple rules to control what is entered in each cell.


    Data validation in StarOffice is a useful feature, but it''s not like the data
    validation that is available if you use a full-featured relational database.


    Still, if you want to have more fine-grained control over the data validation
    process (for example, to check that the state matched one of the actual codes
    in a list), you can create a macro program and check the data time it is entered.


    Macro is one of the options in the Error Alert tab of the Data Validation dialog
    box—but you''re not going to learn how to write StarOffice macros during this
    24 Hours.


    # Sorting Database Records


    Another of the truly useful database features in StarOffice is the capability
    to sort lines of information.


    You can choose which field to sort on, and set other sorting options to fit your
    data arrangement.


    The same sample list of names and addresses is used to show how sorting works.


    # Selecting Data to Sort


    The first step in sorting data is selecting the area that you want to sort. This
    area consists of a block of cells, including the field names at the top of the
    block. Figure 18.8 shows the selected cells that you want to sort.


    Remember these two dangers as you select the area to be sorted:


    +   - If you don''t select all the rows in the table, you are left at the bottom
    of the table, unsorted. This problem can be solved by selecting the entire table
    and resorting.

    - If you don''t select all the columns in the table, the sort operation rearranges
    the first part of each row, leaving the mismatched last part of each row (record).
    You can fix this by choosing Undo from the Edit menu if you recognize the problem
    immediately.


    After you have selected the cells to be sorted, choose Sort... from the Data menu.
    The Sort dialog box appears (see Figure 18.9).


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_360_0.png)'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# FIGURE 18.8


    The full table, with field names, is selected for the sort operation.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_361_0.png)


    # FIGURE 18.9


    The sort dialog box enables you to choose options for how a block of records is
    sorted.


    ![](img/d07037173ed87c2b5a0d33ea3544eb75_361_1.png)'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Setting the Sort Criteria


    The method used to sort list of records in StarOffice is based on two things:


    +   - Which column is to be sorted (used as the key to the sort)

    - Are the highest values or the lowest values listed first


    The first field in the Sort dialog box is Sort by. Click on the drop-down list
    and notice that it contains the names of the fields from your sample data. It''s
    a good idea to include the field names in the block of cells that you select for
    sorting.


    > The field that you sort on is sometimes called the sorting KEY.


    Suppose that you want the list sorted by state, and then alphabetically within
    each state. Follow these steps:


    +   1. From the Sort drop-down list, select State. (If you''re using different
    sample data, the items in the list are different.)

    2. Choose the Ascending button (so that AL is listed first and WY last).

    3. Now that the first Sort by field is defined, you can select a second field
    from the next field down, labeled Then by. Choose Name from this drop-down list.

    4. Also choose the Ascending button next to this field (so that Allan is listed
    first and Zoe last).


    With the sort criteria set, you can choose OK, and the records are sorted.


    # Reviewing Sorting Options


    Sorting in StarOffice provides many other options, however, in addition to setting
    up the sort criteria.


    Select a block of cells and choose Sort from the Data menu. Then choose the Options
    tab (see Figure 18.10).


    The following sections describe each of the items in the Options tab:


    +   - When the Case checkbox is selected, all alphabetical sorting is based on
    upper- or lowercase letters, instead of all letters being treated the same.

    - When the Area contains column headers checkbox is selected, the Sort criteria
    window uses the words in the first row to help you identify which sorting method
    you want to use.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Figure 18.10


    The Sort dialog box includes Options tab in which you can set up many variations
