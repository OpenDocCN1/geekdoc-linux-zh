    # F. Getting on board


    You''ll be safest on a two-section ladder that you can put up to the top - rest
    the ladder brackets on the billboard for your comfort and reassurance. Remember:
    vandals don''t bounce, so don''t over stretch. Use a bucket for your paste hung
    from the ladder with an S hook; you''ll need your hands for positioning your poster.
    You can get a bill poster''s brush online; you could also use a soft bristle broom
    but if I see I''ll really mark you on style for that. A fat wallpaper brush is
    just about use-able, but you''re going to be up that ladder three times longer
    than you need to be – if you''re only changing a bit of lettering or imagery it
    would work fine.


    # G. Timing is everything


    Generally speaking, boards in busy cities are changed every two weeks. Out of
    town that might become every month. If you watch when they change you can figure
    out the best time to carry out your take-over. If you''ve been covered over you
    find the board still wet you can peel off the poster you''ve been covered by.
