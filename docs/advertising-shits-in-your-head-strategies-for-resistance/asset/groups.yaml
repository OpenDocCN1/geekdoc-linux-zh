    ## 移除、替换和破坏广告并非破坏行为。


    这是一种清理行为，在法律和道德上都是可以站得住脚的。


    #广告在你的脑子里拉屎


    ## 法律辩护


    “公共空间内的任何让你无法选择是否看它的广告，它都属于你。你有权取走、重新排列和重复使用它们。你可以对它们做任何你想做的事。请求许可就像是请求保留一块别人刚朝你头上扔过来的石头一样……”94


    Banksy/Tejaratchi


    在英国，颠覆行为可能导致刑事破坏罪罪。对于某些颠覆者来说，在涉及法律时，最佳策略是避免被当场抓获，并采取匿名行动。品牌破坏主义（Brandalism）和特别巡逻小组（Special
    Patrol Group）通过穿着“被称为国际隐形斗篷的荧光背心”来防止引起怀疑”。95 作为 SPG 的一名匿名成员告诉《国家新闻报》（New Statesman）：


    > “我们小组中没有人被抓获过，因为要在做某些通常是某人的工作的事情时被抓获是极其困难的——即使当你在英国警察部队总部外（两次）张贴关于羁留期间死亡、带有
    ACAB 口号的海报时也是如此。”96


    其他人则更加公开。Public Ad 的 Jordan Seiler 将他的工作视为公民不服从，因此认为能够声称自己的行为至关重要。在美国，颠覆行为的指控罪是“持有涂鸦材料”；Jordan
    本人曾在执行水上广告接管行动（water-take-overs）时被捕，九名志愿者在参与他的 NYSAT 项目时被捕，总共入狱 310 小时。97 公民不服从传统的一部分是“表现得好像你已经自由了”998，Jordan
    正是在这种精神下考虑法律的：


    > 我并不认为我做的事情是非法的，我认为这是一种有效的抗议形式。从技术上说它是非法的，但并非所有法律都是公正的。财产不服从和针对财产的暴力的历史被接受，是因为财产不是人，而是因为在资本主义体系中我们过度看重财产，导致它被严肃对待。”99


    在法国，颠覆广告小组 Debounonneurs100 采取故意因其行为被捕的策略，以便在法庭上就广告造成的危害进行对话。他们使用“必要辩护”，声称他们的行动是必要的，因此是合法的，因为他们防止了更大的犯罪。传统上这种理由在法庭上被驳回，但在
    2014 年 3 月 25 日，一位法国法同意他们的行为确实是合法的，并撤销了小组的所有指控。101 因此，3 月 25 日被国际颠覆小组宣布为反对广告的国际行动日。


    位于伦敦的颠覆者 Agit Art Works 制作了他们所说的“免死金牌”，102，这是基于“合法理由”（lawful excuse）的辩护辩护。他们指出，行为的意图定义了刑事破坏，而不是行为本身——如果你诚实地认为你的行动正在阻止更大的犯罪，那么它应该是合法的。需要注意的是，当这种辩护最近被英国的
    Plane Stupid 活动分子测试时（他们劫持了一块贴有关于希思罗机场第三条跑道抗议信息的广告牌），该辩护失败了。


    法律诉讼的进一步可能来自受到颠覆者攻击的公司，无论是被颠覆的品牌，还是户外广告位的所有者。2016 年 7 月，布鲁塞尔地铁系统的 700 处广告被替换为带有抗议信息的颠覆广告（反对
    TTIP，跨大西洋贸易伙伴关系）；声称该行动的小组 TTIP Game Over 受到地铁运营公司（STIB）和广告位所有者 JCDecaux 的联合警方投诉；103；然而，警方决定没有采取进一步行动。


    采取法律行动也可能适得其反：《牛津知识产权杂志》最近的一篇文章声称，除了颠覆者被当场抓获外，对颠覆行为的法律保护极小。作者指出司法趋势倾向于给予言论自由更大的保护，并扩大了可以认为是戏仿和合理使用的范围。此外，起诉带来的负面声誉成本可能过高：


    > “品牌破坏主义可能会增加信息的知名度，但损害品牌声誉的风险通常太大，以至于公司采取采取法律诉讼。”


