    # 7


    # YEAH,

    WE GOT KEYS FOR THAT


    One of the things that makes modern subverting practice stand out is the vigour
    with which its various proponents attempt to spread the form. Unlike other art-forms,
    there is nothing to be gained by retaining a monopoly on practice, and everything
    is to be won by passing it around. Both Jordan Seiler and Bill Posters of Brandalism
    started out as individual artists, putting up their work in the street-art tradition;
    both have come to the realisation that, for interventions to be making a true
    claim to the rights of the city, it must be a practice that is open to all.


    There can be a few obstacles to subverting, which include: accessing the spaces,
    printing materials large enough, and practical instruction on how to install your
    artwork. Thanks to globalisation, many of these obstacles can be overcome on a
    global scale.


    # PRINTING


    All outdoor advertising spaces worldwide are standardised sizes, so as long as
    you can get someone with a big enough printer, you get artwork printed in the
    correct sizes. At the time of writing, 6-sheets can be printed for about £6 (8
    USD) and 12 printed 4-sheets for a 48-sheet billboard come


    53'
