    ## BANI-SHIT


    One strategy to remove outdoor advertising from cities that has had some success
    is the localized, government-enacted ban. For this reason, the final point of
    Special Patrol Group’s Ad Hack Manifesto makes the claim that outdoor advertising
    both can and should be banned.


    Outdoor advertising bans certainly can happen, and there are a few precedents
    for them. In 2007, Sao Paulo enacted the Clean City Law, which designated outdoor
    adverts as a form of visual pollution. As a consequence, 15,000 billboards and
    over 300,000 oversized storefront signs were removed in under a year. In 2015,
    Grenoble, France, became the first city in Europe to ban outdoor advertising,
    and 326 advertising spaces were replaced with community noticeboards and trees.
    The Mayor’s office stated it was “taking the choice of freeing public space in
    Grenoble from advertising to develop areas for public expression”⁵8 (perhaps an
    explicit reference to the public’s right to the city?).


    To date, these have been the only city-wide outdoor advertising bans, though there
    have been other attempts to trim back the proliferation of outdoor advertising:
    in 2009, Chennai, India banned the erection of new billboards and there are also
    several US States where billboards are banned.¹⁵⁹. Paris planned to reduce the
    number of advertising hoardings by a third in 2011 and, in 2015, Tehran replaced
    all of its 1500 commercial billboards with art for ten days⁶⁰ (more than doubling
    Brandal''s largest citizen take-over to date – 600 bus stop ad spaces in Paris
    in November 2015).


    Though at first glance it may appear that advertising bans are a positive step,
    academic Kurt Ives questions the rationale for them: where activists may see their
    work as inherently anti-capitalist, he claims the cities that have introduced
    bans may be doing so in order to reassert the dominance of the state. He suggests
    a “ceremonial normative model of public space”, which privileges civic order above
    private commercial interests, but also views the public as a passive audience
    for “ceremonial, monumental and architectural displays, which might exercise a
    civilising influence”. Outdoor advertising bans are concerned with “the aesthetic
    integrity of the public realm… rather than its democratic accessibility.¹


    Some subvertisers, too, are wary of government bans. Rather than a city-wide ban
    on advertising, Jordan Seiler would prefer spaces to be available for all citizens
    to use: “this should be self-organised, you should just allow public messaging
    and sprawl on the streets. That’s probably utopian, but I think a more viable
    solution would be to create places and structures that would support an open curation
    of some sort”.⁶² He also questions the motives behind the bans,⁶³ and points out
    that the ban in Sao Paulo has only been partial: at the same time as the Clean
    City Law was introduced, the city signed a contract with Jecaux to provide bus
    shelters. Intervening into advertising spaces that usually celebrate consumption,
    they divert messages towards ones of anti-consumption. Of course, almost all governments
    are wedded to the capitalist system, so it seems unlikely they’ll allow advertising.
    For this reason, direct action remains a vital strategy.


    ## 6 SUBVERTISING


    Subvertising is a portanteau of subversion and advertising. It is a relatively
    modern term, but can be defined as any type of action that is taken to subvert
    advertising. This may range from improvised graffiti-style interventions to the
    more coordinated campaigns of the modern era. Though it is difficult to say when
    exactly subvertising emerged as a form, the history of organised outdoor advertising
    dates back to at least the 1970s. In Australia, the B.U.G.A.P. (Billboard-Using
    Graffiti Against Unhealthy Promotions) collective started taking direct action
    against tobacco advertising in 1973 (because, in their words, “someone had to
    do something about it!”⁶⁵ and claim their work is one of the earliest forms of
    subvertising the world has seen.⁶⁶. Not long after, in 1977, the Billboard Liberation
    Front (BLF)⁷⁷ was formed in San Francisco, and began setting about making they
    termed “improvements” to outdoor advertising, as well as encouraging others to
    do the same. Both of these organisations still have websites that reflect on their
    history and give advice to potential practitioners.


    ## DETOURMENT


    The motivations for subvertising have traditionally been wide-ranging, from objections
    to individual products, to aesthetic considerations, to simple mischief. Though
    the strategies of altering, removing or reversing outdoor advertising may remain
    largely the same, today''s subvertisers are a more coordinated movement, with
    a more connected vision:


    > *Today, the practice of subvertising is reaching novel heights. Collectives
    are starting to connect globally to form an ever-increasing force of resistance
    against the visual and mental implications of advertising. Initiatives such as
    Brandalism, Brigade Antip and Plane Stupid are beginning to specifically address
    the connections between advertising, fossil fuels and climate change. Intervening
    into advertising spaces that usually celebrate consumption, they divert messages
    towards ones of anti-consumption.*⁷¹


    "The method is the most interesting part of Brandalism, since it''s specifically
    designed to confuse the viewer a little. This is why the posters are usually playful,
    typically mimicking established designs. They are, I think, motivated by 1960s
    French Situationism—people who believed the culture, the “spectacle” of modern
    society needed to be attacked, and done in such a way that would wind up, rile,
