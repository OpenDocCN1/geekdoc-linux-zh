    ways of thinking.78


    # AGAINST LIBERAL PRANKSTERS


    A criticism of subvertising is that over-emphasising its potential effect may
    be naïve. As academic Richard Gilman-Opalsky points out:


    > “Debord was well aware, in the 1950s and 60s, that something like ‘subvertising’
    could never jam a culture of constant accumulation. Subvertising at its best is
    like a skip on a record that the needle passes over with a minor interruption.”59


    It’s possible that subverts may just be ignored, or subsumed into habitual ways
    of thinking; it’s also true that just as advertising works on an emotional level
    and in a cumulative way, so must subvertising, which means it is likely to be
    most effective as part of a sustained campaign.


    Neither can subverting be about reform if it is to be truly considered détournement,
    in the Debordian sense. Academic and author Catherine Flood claims that Addbusters
    "shifted the focus of graphic resistance from creating radical alternatives to
    mainstream design and advertising to exposing its practices." But the modern subverting
    movement has moved beyond this position by returning to the original Debordian
    critique of the spectacle which is suspicious of attempts at reforming it:


    > "One must not introduce reformist illusions about the spectacle, as if it could
    eventually improved from within, ameliorated by its own control of a better-informed
    public opinion."


    Where Addbusters aim at individual brands and campaigns, even if this could be
