    ![](img/8651026a6fb925f178510a3cc9c8b614_43_0.png)


    ## BANI-垃圾


    ## 5


    ## BANI-垃圾


    一种从城市中移除户外广告并取得某些成功的策略是地方政府颁布的禁。因此，特别巡逻队（Special Patrol Group）《广告黑客宣言》的最后一点认为，户外广告可以且应该被禁止。


    户外广告禁止确实可以发生，而且有几个先例。2007年，圣保罗颁布了《清洁城市法》，将户外广告指定为一种视觉污染。结果，在不到一年内，15,000块广告牌和超过300,000个大型店面招牌被移除。2015年，法国格诺布尔成为欧洲第一个禁止户外广告的城市，326个广告空间被社区告示板和树木取代。市长办公室表示，这是“选择让格诺布尔的公共空间从广告中解放，以开发公共表达区域”⁵⁸（也许是对公众城市权的明确引用？）。


    迄为止，这些是唯一的市范围户外广告禁令，尽管还有其他削减户外广告泛滥的尝试：2009年，印度钦奈纳禁止了设立新广告牌，美国也有几个州禁止了广告牌.¹⁵⁹.
    巴黎计划在2011年减少三分之一的广告围挡，并在2015年，德黑兰将其所有1500个商业广告牌更换为艺术品，为期十天⁶⁰（这比Brandal迄今最大的公民占领活动增加了一倍——在巴黎有600个公交站广告空间）。


    虽然乍看之下禁止广告似乎是一个积极的步骤，但它质疑了这种逻辑：在2011年，巴黎计划减少三分之一的广告围挡；在2015年，德黑兰将其所有1500个商业广告牌更换为艺术品，为期十天⁶⁰。这种做法可能看起来是积极的，但也质疑了禁止广告的合理性。


    许多颠覆广告者，也对禁止广告保持警惕。与其在市范围内禁止广告，乔丹·塞勒（Jordan Seiler）更倾向于让空间对所有人开放：“这也许是乌托邦的，但我认为一种更可行的解决方案是某种形式的组织”。他也质疑了禁止广告背后的动机⁶³，并指出圣保罗的禁只是局部的：在《清洁城市法实施的同时，城市与Jecaux签约提供公交站。干预这些通常庆祝消费的广告空间，将信息引向反消费。因此，直接行动仍然是一个至关重要的策略。


    ## 6 颠覆广告 (SUBVERTISING)


    颠覆广告（Subvertising）是颠覆和广告的合成词。这是一个相对现代的术语，但可以定义为任何为了颠覆广告而采取的行动。这可能从即性的涂鸦风格干预到现代更有协调的活动。虽然很难说颠覆广告何时形成的，但组织广告的历史至少可以追溯到1970年代。在澳大利亚，B.U.G.A.P.（利用涂鸦反对不健康促销）团体从1973年开始针对烟草广告采取直接行动（因为用他们的话说，“有人做点什么！”⁶⁵），并声称他们的工作是世界上最早的颠覆广告形式之一⁶⁶。不久后，1977年，广告牌解放阵线（BLF）⁷⁷在旧金山成立，并开始对户外广告进行他们所谓的“改进”，并鼓励其他人这样做。这两个组织仍然拥有网站，回顾其历史，并为潜在的从业者提供建议。


    ## 挪用 (DETOURMENT)


    颠覆广告的动机传统上非常广泛，从对个人产品的反对到审美考虑，再到简单的作剧。虽然改变、移除或反转户外广告的策略可能基本保持不变，但今天的颠覆广告者是一个更有协调的运动，具有更有联系的愿景：


    > 今天，颠覆广告的实践正在达到新的高度。团体开始在全球范围内联系，形成一种反对广告视觉和心理影响的日益增长的力量。Brandalism、Brigade Antip和Plane
    Stupid等计划开始专门解决广告、化石燃料与气候变化之间的联系。干预这些通常庆祝消费的广告空间，将信息引向反消费。⁷¹


    “这种方法是Brandalism最有趣的部分，因为它专门设计用来让观众感到困惑。这就是为什么这些海报通常具有趣味性，通常模仿既有的设计。我认为，它们受到20世纪60年代法国情境主义的影响——那些人们认为现代社会的文化、“奇观”需要被攻击，并且要以一种能够引起骚乱、模仿、愤怒、困惑的方式。”⁷²


    颠覆广告是文化干扰（culture jamming）的一种独特形式，可以被视为一种干预塑造我们思维的视觉景观的尝试⁷³，并在程度上，它与情境主义国际组织（SI）的工作有直接联系⁷⁴。


