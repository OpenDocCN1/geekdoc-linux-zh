    ## BRANDALISTS FOR LONDON PUBLIC SPACE MATTERS


    ![](img/8651026a6fb925f178510a3cc9c8b614_74_2.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_74_3.png)


    ## AN IDIOT’S GUIDE TO BILLBOARD TAKEOVERS


    ### A. Lingo

    Know your terminology, a billboard is also known as a 48-sheet as it is made up
    of 12 sections (60” x 40”). Each of 12 sections is called a double-sheet as (30”
    x 20”) in size.


    ### B. What’s the point?

    What is your billboard going to be, have you got a point or are you being decorative?
    Either way, show your idea to a friend. A poster on paper is one thing; a poster
    on billboard just makes you look like a big wanker that can’t spell. It’s the
    difference between knowing your shit and knowing your line. If you’re printing
    your masterpiece go to C. If it’s cutting one up to D.


    ### C. Size

    The size for a standard billboard is landscape 10ft x 20ft or 3m x 6m. If you
    get one printed, you really want it printed on blue-backed paper. This requires
    pre-soaking in water before sticking and keeping it moist in a bag is essential.
    Blue-backed paper means it’s easy to move and line up on the board and it dries
    perfectly flat and professional-looking. Make sure you number each of 12 sections
    on the top and roll from the bottom. Work from top left and have your ladder in
    the middle of three positions.


    ### D. Cut up jobs

    If you have two images you want to mash up together you can cut a section from
    one with a knife and peel off. Once away from the scene you can take the paper
    you don''t need from the back until it''s thin enough to re-stick with paste onto
    another board. As the industry standard blue-backed paper it usually dries perfectly,
    hiding the fact you''ve added a bit. I did this with the first board I ever altered,
    moving it from one board and sticking onto another so the whole phrase became
    “SUDDENLY EVERYTHING SUCKS”.


    ### E. Paint jobs

    Do you need me to tell you to use something that won''t run in the rain? Aerosol
    or acrylic or even exterior paint will do.


    ### F. Getting on board

    You''ll be safest on a two-section ladder that you can put up to the top - rest
    the ladder brackets on the billboard for your comfort and reassurance. Remember:
    vandals don''t bounce, so don''t overstretch. Use a bucket for your paste hung
    from the ladder with an S hook; you''ll need your hands for positioning your poster.
    You can get a poster brush online; you could also use a soft bristle broom but
    if you see it''ll really mark you for that. A fat wallpaper brush is just about
    useable, but you''re going to be up that ladder three times longer than you need
    to be if you''re only changing a bit of lettering or imagery it would work fine.


    ### G. Timing is everything

    Generally speaking, boards in busy cities are changed every two weeks. Out of
    town that might become every month. If you watch when they change you can figure
    out the best time to carry out your take-over. If you''ve been covered over and
    find the board still wet you can peel off the poster you''ve covered by. Do keep
    in mind the police will really want to kick your arse.


    ### H. Caution!

    Some boards have nothing on them as they’ve become dangerous. Quite often the
    wooden platforms become rotten and never removed.


    ### I. Legal

    Technically speaking you’re putting a poster on a site that is designed to have
    a poster on it, so legally you’re not fly posting or criminally damaging it. If
    you cover every board in town week after week then someone will probably try and
    shut you down as you’re losing them money. A one-off take-over they’ll just cover
    you up, no problemo.


    ### J. Sticking to it

    A bucket of hardware store wallpaper paste or some wheat paste will work fine.


    ### K. Hide in plain sight

    Orange is very much in vogue on the Outdoor Advertising scene – hi-viz jacket
    and trousers as standard. Why not accessorize with a hard hat, too? I have no
    idea why they make them wear, I have thus far been injured by falling paper. Going
    by the book, you should wear a harness that attaches you to the ladder.


    ### L. Skin jobs

    Not just the enemy in Blade Runner. Check that the board you want to paste on
    isn’t a “skin”. They are a type of plastic, various types are in use, and you
    can’t paste on to these boards, but you can use spray mount or carpet adhesive
    spray.

