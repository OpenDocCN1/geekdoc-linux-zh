    David Harvey


    The right to the city is a concept put forward by French philosopher and sociologist
    Henri Lefebvre, and later expanded by David Harvey. It can be summed up as the
    right to make and remake the spaces in which we live; it stands in opposition
    to corporate or state control of our environment.¹⁵¹. The right to the city means
    the democratisation of all aspects of our lives within the urban sphere: labour,
    education, planning, etc. Subvertisers start from the aesthetic as a symbolic
