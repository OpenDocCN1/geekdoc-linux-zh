    具体而言，“颠广告”（subvertising）可以被概念化为一种“偏移”（detournement）——即重新路由或劫持——这是由情境主义国际（SI）开创的一种种策略。这既体现在对个人品牌或广告的重新想象上，也体现在对广告空间的劫持或“占领”上。


    颠广告者声称这种“偏移”有效的一种方法是干预视觉景观并刺破“现有的真理体制”。76 如前所述，户外广告被视为不可触碰的：通过干预包含广告的物理空间并改变信息77以创造“对已建立倾向的位移”，颠广告可以打破我们习惯性的思维方式。78


    # 反对自由主义恶作剧


    对颠广告的一种批评是，过度强调其潜在影响可能是天真的。正如学者理查德·吉尔曼-奥帕尔基（Richard Gilman-Opalsky）指出的：


    > “德波在20世纪50年代和60年代非常清楚，像‘颠广告’这样的东西永远无法干扰一种不断积累的文化。颠广告最好的状态就像唱片上的一个跳音，唱针滑过它时只会产生轻微的干扰。”59


    颠覆行为可能只是被忽略，或者被归入习惯性的思维方式中；事实也是，正如广告在情感层面和以累积的方式发挥作用，颠广告也是如此，这意味着它在作为持续运动的一部分时可能最有效。


    如果颠覆行为要被真正视为德波意义上的“偏移”（détournement），那么它就不可能关乎改革。学者兼作家凯瑟琳·弗洛德（Catherine Flood）声称，“广告破坏者”（Addbusters）“将视觉抵抗的焦点从创建针对主流设计和广告的激进替代方案转向了揭露其做法”。但现代颠覆运动已经超越了这一立场，回归了德波对“景观”的原始批判，这种批判对试图改革的尝试持怀疑态度：


    > “人们不能对景观引入改革主义的幻想，仿佛它最终可以从内部改进，通过其自身对信息更丰富的公众舆论的控制来改善。”


    当“广告破坏者”针对个人品牌和活动时，即使这可以被看作是系统性批判的一部分，它也是从一个相对较高的视角进行的，而那些无法参与斗争的人被放逐到了观众的位置。这就是为什么案例中考虑的所有颠广告者（见第71页）都试图传播这种形式。


    # 来自“广告城”的巴士 # 广告黑客宣言


    ![](img/8651026a6fb925f178510a3cc9c8b614_68_0.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_69_0.png)


    # 耶，我们有钥匙！！让现代颠覆脱颖而出的点之一，是其支持者试图传播这种形式的活力。与其他艺术形式不同，保持实践的垄断不会带来任何收益，而通过传递可以赢得一切。乔丹·塞勒（Jordan
    Seiler）和来自 Brandalism 的比尔·波斯特（Bill Posters）最初都是个人艺术家，以街头艺术的传统展示作品；他们都意识到，为了让干预行为真正声称拥有城市权利，它必须是一项对所有人开放的实践。颠覆可能会遇到一些障碍，包括：进入空间、打印足够大的材料以及关于如何安装你的艺术作品的实用指导。得益于全球化，许多这些障碍可以在全球范围内克服。


    # 打印

    全球所有的户外广告空间都是标准尺寸，所以只要你能找到一个有大打印机的人，你就能获得正确尺寸的作品。在本文写作时，6张幅（6-sheets）的打印费用约为6英镑（8美元），12幅约为8英镑（10美元）。价格因地区而异，但相比，如果你通过户外广告公司支付广告牌费用，每个广告牌每周需要花费500英镑（600美元），最低消费为2000英镑（2400美元）。


    # 接入钥匙

    或许衡量广告占据空间之感知神圣程度的一个标准是，大多数空间要么完全不受保护，要么只受标准安全锁的保护，而这些锁的钥匙可以很容易获取。


    Brandalism 和特种巡小组（Special Patrol Group）都在网上提供了关于哪些接入工具以及在哪里可以找到它们的建议。特种巡小组创建了一个广告空间黑客包，他们声称可以进入英国三分之一的户外空间。85
    这些包是为班克斯的“奇幻工厂”（Dismaland）展览制作的，在该期间售出了2000套。


    公共广告活动自2014年起提供他们所谓的公共访问钥匙。86 每个钥匙都由艺术家创始人乔丹·塞勒手工制作，他解释说：


    > “纽约街道广告占领（NSAT）之后的想法是，好吧，我一个人无法造成足够的破坏。我需要找到项目和方法让其他人这样做，因为我没有足够的时间资源来造成足够的破坏。所以公共访问确实如此。”87
    目前有11种套装，全球已售出400多套。所有的国际锁组合都会在公共访问网站上显示，如果粉丝发现了目前的公共访问钥匙无法打开的锁，可以把照片发给乔丹，他会尝试制作一把钥匙。乔丹使用标签
    #YeahWeGotKeysForThat 来收集颠覆者使用他的工具进行的颠覆装置图像。


    # 培训

    除了提供接入钥匙的建议，Brandalism 还创建了一份在线安装指南。90 它可以在他们的网站上找到，并作为《STRIKE!》杂志（第7期）的跨页登登。特种巡小组还更新了该指南的设计，将其作为一个折叠页单在2016年格拉斯拉斯里音乐节分发（见反面）。2012年的第一次
    Brandalism 活动仅由两个成员安装，但2014年的第二次活动中，这两个成员将知识传给了其他人。60


