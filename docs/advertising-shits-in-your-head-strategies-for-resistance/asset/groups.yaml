    Dekeyser describes the three challenges subversific face: “Firstly, subvertisements
    may easily be ignored if the habitual passive interaction with advertising space
    is too strong. Secondly, the progression of habit-evaluation and modulation take
    time and may require both persistence and patience. This means they require disruptive
    triggers that are expressed across a broad multiplicity of spatiotemporal assemblages.
    Thirdly, Bissell (2014: 489) has also pointed out how, at times, events of disruption
    become synthesised into habit’s refrain’ where the capacities of habit to absorb
    or neutralise unwanted challenges to habitual modes of thought, feeling and behaviour
    are reduced. The result then of subvertisements might even perform an intensification
    of existing inclinations or refrains that thickens the ‘protective guarantee’
    of urban habits rather than reducing their abilities to maintain in place.”


