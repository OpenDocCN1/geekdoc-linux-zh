    # 特别巡逻小组 (SPECIAL PATROL GROUP)


    特别巡逻小组（SPG）被认为是《STRIKE!》杂志的一个隐秘、激进派分支。他们以一个现在已解散的警察部队命名，该部队因导致活动家布莱尔·皮奇（Blair
    Peach）的死亡而臭名昭著，而他们的首次行动是针对大都会警察局的。


    他们总部部位于英国伦敦，早期工作集中在从《STRIKE!》杂志页面获取设计，并将其安装在公交站的六联幅广告位、告示牌和伦敦地铁的广告空间。2015年，他们是班克斯西“垃圾地乐园”（Dismaland）展览的一部分，在现场演示了公交站涂鸦技术，并还提供了他们的“广告空间黑客包”（Ad
    Space Hack Pack）。


    最近，他们一直在代表其他运动设计并安装颠覆作品——包括 Netpol、希斯罗 13 气候小组和“和平退伍军人”（Veterans for Peace）。


    # 全方位宣传 (TOTAL PROPAGANDA)


    特别巡逻小组的第一场活动是针对大都会警察局“信心运动”（Confidence Campaign）宣传的行动——这是一场在“对警察信任度较低地区”进行的超本地化海报营销活动。2014年12月12日，三项设计被安装在伦敦约30个地点——


    # 你的脑子里装满了广告垃圾 (ADVERTISING SHITS IN YOUR HEAD)


    包括位于新苏格兰广场（英国警察局总部）外——模仿了警察自己的海报，但传递了更诚实的信息。口号是“全方位宣传”（Total Propaganda），是对大局“全方位执法”（Total
    Policing）口号的颠覆。设计强调了：制度种族主义；马克·杜根（Mark Duggan）之死以及不公平的大麻法。公交站的安装案例走红，被多家主流新闻媒体报道。


    大局在2015年春季进行了另一轮信心运动海报，SPG 再次用自己的活动做出回应。这次他们关注羁押死亡、警察腐败以及大局在自己的活动上花费的公共资金：


    > “大都会警察局花费了大量的我们的资金试图说服我们和他们——他们不是暴力的、种族主义的和腐败的。2012年是1260万镑，2013年是930万镑——光去年两周他们就浪费了近五十万英镑的公共海报活动。”²¹


    对于这两场活动，STRIKE! 杂志的博客提供了设计的可下载版本，试图帮助受活动启发的人进行自己的颠覆工作.¹²²


    # 狗工作 (BULLSHIT JOBS)


    在大多数人圣诞假期结束回到上班的第一天（2015年1月2日）——摘自大卫·格雷伯（David Graeber）文章《论狗工作现象》的引用（该文章质疑了资本主义下工作的本质）被插入到伦敦地铁系统的普通广告中。这些安装案例走红，并被多家新闻媒体报道，包括今日俄罗斯（Russia
    Today），他们采访了大卫·格雷伯关于他的文章。123 这遵循了将他们的颠覆广告链接回解释 SPG 行动的文章或理论的趋势。


    # 不要投票！(DON’T VOTE!)


    在2015年英国大选两周前，受无政府主义理论启发的特别巡逻小组在伦敦各地的公交站安装了质疑投票制度的设计。这三个设计的内容分别是：不要投票：参与政治！；不要投票：弄废你的选票！；不要投票：走上街头！海报上包含一个
    URL，链接到一个揭露投票制度的页面，并给出了公民应该抵制它的理由。特别巡逻小组的一名匿名成员接受了《Huck Magazine》的采访，解释了这一行动。124


    # 垃圾地乐园 & DSEI (DISMALAND & DSEI)


