    # RIGHTS TO THE CITY


    The private ownership of public infrastructure is a worrying tendency, because
    it inevitably leads to provision based on potential for profit rather than public
    utility (or other non-economic notions) which, in turn, further cements the idea
    that only the profitable is imaginable on our city streets. The inverse corollary
    of this trend is the provision of useless street-furniture, the sole function
    of which is as a site of advertising. Jordan Seiler describes the pointless proliferation
    of public phone boxes in New York City:


    > "I we have about 20,000 of them, which means 60,000 ads changing every month.
    They are simple to get into and it''s just a ubiquitous form in NYC that people
    don''t even use for their phone calls. They are just advertising revenues at this
    point, because everybody has a cell phone."88


    One of the reasons private provision of public infrastructure may be tolerated
    is that the public imagines the cost is endured by the beneficent provider, which
    represents a saving to the public purpose. But advertising spend increases the
    cost of the products advertised, and that cost is ultimately passed on to the
    consumer. There is no such thing as a free bench.49


