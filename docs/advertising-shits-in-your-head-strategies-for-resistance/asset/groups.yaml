    认同你的需求并拥有它们至关重要。如果没有 Anonymous，罗莎·帕克斯（Rosa Parks）不会是现在的罗莎·帕克斯。¹107


    ## NYSAT (2009)


    纽约街头广告占领（NYSAT）是 Jordan 决定扩大他的颠覆实践以吸引更多人参与。目标是纽约市一家专门使用非法广告空间的公司，这意味着让市民参与进来相对容易，Jordan
    将此归功于“100 多名艺术家、活动家、摄影师、录像师、律师、母亲、父亲、学生、教师和普通公民的辛勤工作与奉献”。¹108


    该行动的形式是市民对非法广告空间进行刷白处理；这移除了广告并创造了一个空白画布，许多艺术家随后用作品填满了它。它还吸引了媒体的关注，包括《纽约时报》、《经济学人》、《Abbusters
    以及街艺术杂志《Juxtapoz》在内的媒体。


    ## TOSAT (2010)


    多伦多街头广告占领（TOSAT）是第一个国际街头广告占领项目。¹109。这次项目并不是简单地涂掉违法的张贴，而是进入了合法空间——Pattison 户外核心媒体柱——并将它们的广告替换为海报。项目邀请了
    60 名艺术家提交作品，超过 90 根媒体柱的广告被更换，还有 20 块广告牌。招募了一支当地志愿者团队进行安装，并在 TOSAT 迷你网站上提供了如何进入这些空间的信息——使用一个普通的家用门把手。该行动在多伦多的当地新闻中被报道，并通过街头艺术网站《Juxtapoz》和《Vandalog》在国际上传播。


    ## MASAT (2011)


    马德里街头广告占领（MASAT）是 Jordan 的第二个国际广告占领活动。¹¹¹⁰。这次，参与者不是提供艺术作品，而是被提供基于文本的作品，这使得过程面向了“广泛的个人，包括社会学家、教师、律师、画廊主以及任何对公共空间的策展和参与感兴趣的人”。总共有
    106 种不同的基于文本的设计被提交并安装。


    ## 公共访问钥匙


    Jordan 一直在纽约不安全的公共电话空间工作，因此最初并不需要访问工具。但当他访问马德里参加 MASAT 项目时，他遇到了同为颠覆者的 Vermibus，后者复制了一个原始的
    JCDecaux 钥匙。这让他产生了可以制造访问钥匙的想法；后来他在家里的工作室里弄通了如何复制它们。¹¹¹


    目前有 11 种不同的钥匙可用，Jordan 到此已售出约 400 套访问钥匙。如果有人发现某个目前没有钥匙的锁，可以把照片发给 Jordan，他会尝试为他们复制并在网上提供。Jordan
    说，公共访问项目（Public Access Project）的目标是：


    > ">……通过提供对市政基础设施的访问来开展公共对话，反转这种单向通信。艺术家和个人可以将该网站提供的工具视为功能性雕塑，将他们的思想注入我们共同的公共空间中。”112


    ![](img/8651026a6fb925f178510a3cc9c8b614_94_0.png)


    ![](img/8651026a6fb925f178510a3cc9c8b614_95_0.png)


    ## 品牌主义 (BRANDISM)


    Bill Posters 的艺术生涯始于一名涂鸦者，在大学期间作为涂鸦小组的一员，在屋顶、火车和墙上涂鸦。在受到伊拉克战争的影响变得更加政治化后，他写了一篇关于文化干扰（culture
    jamming）的论文，引用了列斐伏尔、克莱因情境主义者，并表示这作为后来成为“品牌主义”的“反商业计划”。¹¹¹³。


    2012 年的第一个品牌主义项目以广告牌和消费主义为目标，Bill 招募了一位朋友（仍是匿名品牌主义小组的一员）来帮助安装。尽管广告牌引起了许多主流媒体的注意，包括
    Channel 4 的《随机行为》（Random Acts）中的一个四分钟片段，但这对广告牌组合很快意识到他们“只是开两辆货车里的两个汉们”¹¹¹⁴。从那以后，他们的重点一直是赋能他人采取自己的行动，此后的每场活动都有越来越多的志愿者参与。¹¹¹⁵。


    Bill Posters 将品牌主义的工作——用艺术取代广告——视为一份礼物。¹¹¹⁶。与广告不同，它对观众没有任何要求，可以被视为一种双向互动。国际知名的艺术家曾参与过品牌主义项目——Peter
    Kennard、Gee Vaucher、Robert Montgomery——但在街头上，他们是以匿名形式呈现的。


    ## 广告在你脑海里拉屎 (ADVERTISING SHITS IN YOUR HEAD)


    ## 品牌主义 2012 - 广告牌 (THE BILLBOARD)


    第一个品牌主义项目发生于 2012 年 7 月，横跨五个大城市。两名安装人员贴了 36 块大幅广告牌（48 联海报），上面有 28 名国际艺术家的原创作品。该项目的时间经过特意安排，以配合“伦敦奥运会引发的普遍性品牌狂热”¹¹¹⁷，因此引起了国际媒体的关注，引发了“对我们被迫与之互动的户外广告空间合法性的讨论”。¹¹¹⁸。


    ## 品牌主义 2014 - 6联画 (THE 6-SHEET)


    在意识到该项目的民主性仍存在疑问后，品牌主义……


    - 在两天内，爱丁堡、利物浦、利兹、布莱顿安装了 36 张海报。


