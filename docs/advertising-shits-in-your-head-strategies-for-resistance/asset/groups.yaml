    2016年，法国颠覆组织 RAP 发起了一年一度的国际反对广告行动日（3月25日）。作为对的回的回，Brandalism 发起了“转换立场”（Switch
    Sides）活动。这些海报是专门为奥美威、麦德（Ogilvy Mather）、ABDO 和 WMT 等广告公司的员工设计的，并安装在他们位于曼彻斯特和伦敦的办公室外。海报上印有一个链接，可引导用户回到
    Brandalism 网站，并有一篇短文解释了他们为什么认为在这一行业工作的人应该转换立场：


    > “我们在曼彻斯特和伦敦安装了这些设计，是为了与你们对话。祝贺你们成为该国顶尖广告公司之一。我们受到一个特定问题的关注：你们的天赋


    你们的创造力本意味着更多意义。*20*


    该活动在多家广告行业新闻媒体上都有报道，Brandalism 最近还举办了首场“广告商匿名会”（Advertisers Anonymous）活动，旨在为想要离开该行业的人提供一个出口和平台。


    # 很抱歉，我们被抓住了。(We''re sorry that we got caught.)


