    As these values are primed repeatedly, they are likely to be strengthened. This
    is likely to happen through an automatic route as well as an effortful route of
    cognitive processing. Through the automatic route, priming values strengthens
    links between environmental cues and these values in the way that information
    is stored in our memory (i.e. our schemas). This serves to strengthen these values
    automatically, even without awareness on the part of the person. In addition,
    through the effortful route, messages that strengthen existing values provide
    people with further proof that the values are indeed important and worth pursuing.
    Hence, through effortful cognitive thinking about these values and their importance,
    these values are strengthened and the environmental cues provide evidence and
    reasons for the importance of these values.


