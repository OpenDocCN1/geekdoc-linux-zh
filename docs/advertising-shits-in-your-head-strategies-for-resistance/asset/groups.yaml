    If we want to understand the messages that define (popular) culture then we have
    to look at the main storytellers. In our culture that is the storytellers that
    have the most money – the advertisers.”29


    Society both defines story and is defined by it. The active shaping of our cultural
    values, and the dominance over that shaping by advertising, is an important part
    of subvertisers’ objection to it. In a blog post that Jordan Seiler describes
    as a manifesto, he outlines why the it’s important to interrupt that dominance:


    > I think it’s important to question the monopolization of our public visual environment
    for commercial concerns and what that means for the determination of our collective
    social agenda. By privileging one type of message over another we are, through
    repetition, setting the terms of our cultural and political discourse. Considering
    the great hurdles we face socially and environmentally, the commercial discourse
    we surround ourselves with not only ignores our current reality but actively works
    against it by distracting us from each other in favor of ourselves.”30


    # SOCIETY''S STORY


    # INTRINSIC VS EXTRINSIC


    > *Outdoor ads have become part of people''s day-to-day urban wallpaper... and
    connect everyday ways of thinking to commercial imperatives*”31


    Anne Cronin


    Subvertisers are not wrong to say that surrounding ourselves by commercial discourses
    has an important impact on our values. It''s a claim that''s supported by research
    into our collective values, and the implications of how advertising acts upon
    them.32


    Sociologist Joseph Schwartz identified a number of values that occur consistently
    across different countries and cultures;33 these collective values can be split
    into intrinsic and extrinsic categories (see diagrams overleaf). Values drive
    our behaviors, and studies have shown that placing greater importance on extrinsic
    values is associated with higher levels of prejudice, less concern about the environment
    and weak concern about human rights.34


    It is perhaps not surprising that most advertising is designed to appeal to extrinsic
    values.35 As subvertisers point out, that should be of concern to everyone who
    wants to promote something other than individualistic consumption. This is especially
    the case because an important feature of these values is that they work in opposition:
    if a person has strongly held extrinsic values, this will diminish their regard
    for intrinsic values, and vice-versa.36


    # ADVERTISING SHITS IN YOUR HEAD


    ![](img/8651026a6fb925f178510a3cc9c8b614_31_0.png)


    # INTRINSIC VALUES


    # EXTRINSIC VALUES


    # AFFILIATION

    - To have satisfying relationships with family and friends.


    # SELF-ACCEPTANCE

    - To feel competent and autonomous.


    # CONFORMITY

    - To ‘fit-in’ with other people.


    # COMMUNITY FEELING

    - To improve the world through activism or socially creative projects.


    # IMAGE

    - To look attractive to other people in terms of body and clothing.


    # FINANCIAL SUCCESS

    - To be wealthy and materially successful relative to others.


    # BENEVOLENCE

    - Preserving and enhancing the welfare of those with whom one is in frequent contact
    (the‘in-group’)


    # ACHIEVEMENT

    - Personal success through demonstrating competence according to social standards.


    # UNIVERSALISM

    - Understanding, appreciation, tolerance and protection for the welfare of all
    people and for nature


    # POWER

    - Social status and prestige, control or dominance over other people and resources.


    Not only do advertisements place an emphasis on extrinsic values, but by repeatedly
    activating those values, it serves to strengthen them. And we don''t even need
    to be persuaded to buy the product: simply by seeing messages with extrinsic values
    emphasised, we can subconsciously buy into those values.37 But it''s important
    to note that everyone, everywhere holds all of these values to differing degrees;
    it''s not that the values themselves are inherently good or bad, simply that they
    have an influence on our behavior.


    Advertisers place the emphasis on extrinsic values: subvertisers want to pull
    the balance back towards the intrinsic.


