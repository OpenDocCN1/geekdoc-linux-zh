- md: "\n## Removing, replacing, and defacing advertising is not vandalism.\n\nIt\
    \ is an act of tidying up that is both legally and morally defensible.\n\n#AdvertisingShitsInYourHead\n\
    \n## LEGAL DEFENCE\n\n“Any advert in a public space that gives you no choice whether\
    \ you see it or not is yours. It’s yours to take, rearrange and re-use. You can\
    \ do whatever you like with it. Asking for permission is like asking to keep a\
    \ rock. someone just threw at your head...””94\n\nBanksy/Tejaratchi\n\nIn the\
    \ UK, subverting potentially carries a charge of criminal damage. For some subvertisers,\
    \ the best strategy where the law’s concerned is to avoid being caught in the\
    \ act, and to act anonymously. Brandalism and Special Patrol Group take precaution\
    \ against arous suspicion by wearing the “international cloak of invisibility\
    \ known as hi-viz””95 As an anonymous member of the SPG told the New Statesman:\n\
    \n> “Nobody in our group has ever been caught because it is absurdly difficult\
    \ to get caught doing something that is usually someone’s job – even when you’re\
    \ putting posters about deaths in custody, bearing the ACAB slogan, outside the\
    \ HQ of the British Police Force (twice).”96\n\nOthers are more open. Jordan Seiler\
    \ of Public Ad views his work as civil disobedience and, as such, says it’s important\
    \ to be able to claim your actions. In the US the charge for subverting is “possession\
    \ of graffiti materials”; Jordan has himself been arrested doing water-take-overs,\
    \ and nine volunteers were arrested taking part in his NYSAT project, spending\
    \ a total of 310 hours in jail collectively.97 Part of the tradition of civil\
    \ disobedience is “acting as though you’re already free”998 and it is in this\
    \ spirit that Jordan considers the law:\n\n> I don’t think of what I do as illegal,\
    \ I think it’s a valid form of protest. It is technically illegal, but not all\
    \ laws are just. There’s a history of property disobedience and violence against\
    \ property, that’s accepted because property’s not a person, but because in a\
    \ capitalist system we privilege property so heavily, it’s taken seriously.99\n\
    \nIn France, subvertising group Debounonneurs100 use the tactic of deliberately\
    \ getting arrested for their actions in order to have a conversation about the\
    \ harms caused by advertising in court. They use the defence of necessity, claiming\
    \ that their actions are necessary, and therefore lawful, because they prevent\
    \ a greater crime. Traditionally it has been dismissed in court, but on 25 March\
    \ 2014 a French judge agreed that their actions were indeed lawful and acquired\
    \ the group of all charges.101 For this reason, 25 March has been declared an\
    \ international day of action against advertising by international subvertising\
    \ groups.\n\nLondon-based subvertisers Agit Art Works produced what they say is\
    \ a “get-out-of-jail free card”,102, based on the the justification defence of\
    \ lawful excuse. They point out that the intent of the act is what defines criminal\
    \ damage, not the act itself – if it is your honestly held belief that your action\
    \ is preventing a greater crime, it should be lawful. It should be noted that\
    \ when this defence was tested recently by Plane Stupid activists in the UK, who\
    \ had hijacked a billboard with a protest message about the third runway at Heathrow,\
    \ it failed.\n\nFurther potential for legal action comes from the companies that\
    \ subverting attacks, whether that's the brands that are subverted or the owners\
    \ of outdoor advertising sites. In July 2016, 700 adverts on the Brussels metro\
    \ system were replaced with subverts bearing protest messages (against TTIP, the\
    \ Transatlantic Trade Investment Partnership); the group that claimed the action\
    \ – TTIP Game Over – was subject to a joint police complaint by the company that\
    \ runs the metro system (STIB) and the owners of the advertising sites, JCDecaux;103;\
    \ however, the police decided no further action was necessary.\n\nTaking legal\
    \ action also has the potential to back-fire: a recent article in the Oxford Journal\
    \ of Intellectual Property claimed that, outside of subverters being caught in\
    \ the act, there is minimal legal protection against subverting. The authors point\
    \ to a judicial trend towards affording greater protection to freedom of speech,\
    \ as well as an expansion of what can be considered parody and fair-usage. Additionally,\
    \ the cost of bad publicity stemming from prosecution could be too high:\n\n>\
    \ \"Brandalism may increase the publicity of the message, but the risk of damaging\
    \ the brand's reputation is often too great for the company to pursue full legal\
    \ action.\"\n\n## CASE STUDIES\n\n## PUBLIC CAMPAIGN\n\nJordan Seiler began subverting\
    \ at art school: after being challenged by a teacher that he probably wouldn’t\
    \ take-over all of the ad spaces in a subway station for his thesis, that’s exactly\
    \ what he did. His practice grew from there, as he took on more and more ambitious\
    \ take-overs – including the world’s first international ad take-over. In addition\
    \ to his collective projects, Jordan still performs independent installs in his\
    \ native New York, as well as internationally. \n\nUnlike some other subverters,\
    \ Jordan does not carry out his work anonymously and says it’s important that\
    \ he claims ownership of his output. Starting out in the street art tradition,\
    \ he called the project Public Ad Campaign as a pseudonym, but has since been\
    \ more open about his identity as “it’s\n"
