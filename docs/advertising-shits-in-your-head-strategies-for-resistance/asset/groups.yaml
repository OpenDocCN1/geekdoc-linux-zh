    你文明终结的轰鸣已经来临，而你穿那条酷的新牛仔裤看起来并不好看。这就是我们挥霍了百年特权后的代价——没有为我们的孩子教育做过任何努力，也没有为拯救地球付出行动。资本主义的敞篷版来了，一个你曾因自大而甚至无法保护的帝国也终结了。潮汐来临了。中东来临。天气来临。所有人来临了。


    ![](img/8651026a6fb925f178510a3cc9c8b614_19_0.png)


    # 广告正在你的脑子里拉屎。


