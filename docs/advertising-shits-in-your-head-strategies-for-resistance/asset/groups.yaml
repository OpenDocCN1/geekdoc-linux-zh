    ## 如何破解公交站广告空间


    ### 你将需要


    - 艺术设计海报：1,200mm x 1,800mm

    - 4位通用工具钥匙

    - H60 安全插销

    - TX30

    - 反光背心


    ![](img/8651026a6fb925f178510a3cc9c8b614_73_0.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_73_1.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_73_2.png)


    1. 选择一个合适的公交站位置。主要的公交站广告公司是 JDCause，有数百个供你选择。


    2. 从工具包中取出4位通用钥匙，找到具有大型正方形钥匙形状的附件。这将打开广告外壳侧面的锁。


    3. 将正方形钥匙插入锁中并顺时针旋转180度。如果第一次没有打开，不要担心，机械结构可能很紧。保持冷静并继续尝试。


    4. 侧面板打开后，将一个手指伸进外壳底部，向上滑动金属盖以露出下一个钥匙孔。


    ![](img/8651026a6fb925f178510a3cc9c8b614_73_3.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_74_0.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_74_1.png)


    有机玻璃罩可能有两个活塞，当你释放卡扣时它们会打开。确保你握住屏幕底部让它缓慢上升。


    将双手放在外壳底边缘并向框架推，以重新接合卡扣并关门。


    然后离开；慢慢来；享受这种体验。


    一旦钥匙进入锁中，在面板内部逆时针旋转90度——只需向下拨开关即可。有了背光，你会感觉没那么暴露。保持有机玻璃屏幕关闭状态。


    你可能希望在海报的有机玻璃上预折叠一厘米的边缘，方便安装。信用卡也可以帮助将海报推入夹条。


    将海报滑到面板顶部，将其推入横顶部的夹条。


    ![](img/8651026a6fb925f178510a3cc9c8b614_74_4.png)


    如果在晚上安装，打开面板内的断路器——只需向下拨开关即可。有了背光，你会感觉没那么暴露。


    ![](img/8651026a6fb925f178510a3cc9c8b614_74_5.png)


    如果你替换的海报背面是空白的，你可以将其复用于下一次安装；如果不是，你应该回收它。


    ![](img/8651026a6fb925f178510a3cc9c8b614_74_6.png)


    从工具包中取出T40六角扳，将其插入小孔并保持金属盖举起。


    从底部开始卷起内部的海报。


    ## ADHACK 宣言


    来自英国各地10个不同城市的活动家。对于2015年的巴黎运动，活动家们在安装公交站广告之前，预先进行了培训。Special Patrol Group 的成员曾在
    Banksy 的 Dismaland 并在现场演示了如何进入广告柜。作为 2015 年 Total Propaganda 运动的一部分，他们购买了一个二手的
    Clear Channel 广告柜，并制作了一个视频展示了应该使用哪些工具以及如何安装海报。


    Public Ad Campaign 最近在纽约举办了一场免费研讨会，介绍了颠覆的历史和理论，并向他们提供了开展自己工作所需的实用技能：


    > “这次活动通过提供简要的历史和理论概述，并分享了在纽约进行接管所需的实用技能。加入我们吧！”


    Jordan 之前的活动还包括：100人走上街头共同夺回空间，任何人都可以参与。


    ## 伦敦公共空间关注者


    ![](img/8651026a6fb925f178510a3cc9c8b614_74_2.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_74_3.png)


    ## 傻瓜广告接管指南


    ### A. 术语

    了解术语，广告牌也被称为48位，因为它由12个部分组成（60英寸 x 40英寸）。每个12个部分被称为双位，尺寸为（30英寸 x 20英寸）。


    ### B. 意义何在

    你的广告牌将是什么？你有想法还是在装饰？无论哪种，向你的朋友展示你的想法。纸质海报是一回事；广告牌上的只会让你看起来像个不识字的混蛋。这就是了解街道和了解广告之间的区别。如果你在制作你的杰作，请看C。如果是接管，请看D。


    ### C. 尺寸

    标准广告牌的横尺寸是10英尺 x 20英尺，或3米 x 6米。如果你拿到一个，你真的想要在蓝背纸上打印。这在粘贴前浸泡在水中并保持其湿润至关重要。蓝背纸意味着它很容易移动并在广告牌上对齐，看起来平整且专业。确保每个12个部分在顶部并从底部卷起。从左上开始工作并将梯子放在中间。


    ### D. 裁剪工作

    如果你有两张想要组合在一起的图片，可以用刀从一张切出一个部分然后离开现场。你可以拿走不需要的部分，直到它足够薄可以粘贴到另一个广告牌上。行业标准的蓝背纸通常干得非常完美，隐藏了你动过的事实。这是我第一次修改的广告牌，从一个移动到另一个，结果整个句子变成了“突然一切都很糟糕”。


    ### E. 油漆工作

    我需要告诉你使用雨水不会冲掉的东西吗？喷漆、丙烯甚至室外漆都可以。


    ### F. 上板

    使用可以到达顶部的双节梯子是最安全的——将梯架靠在广告牌上以获得舒适和安心。记住：破坏者不会弹跳，所以不要过度拉伸。用S钩在梯子子上挂一桶胶水；你需要用手来定位海报。你可以在网上买海报刷；你也可以用软毛刷，但如果被看到，那会让你暴露。粗墙纸刷勉强可用，但如果你只是改变一点字母或图像，你在梯子上的时间比需要的长三倍。


    ### G. 时机决定一切

    通常，繁忙城市的广告牌每两周更换一次。郊外可能每月更换一次。如果你观察他们何时更换，就可以判断出接管的最佳时间。如果你被覆盖后发现广告牌还是湿的，你可以撕掉你覆盖的海报。请记住，警察真的会踢你的屁。


    ### H. 注意！

    有些广告牌上面什么都没有是因为它们已经变得危险了。木平台经常腐烂且从未移除。


    ### I. 法律

    从技术上说，你是将海报放置在一个设计用于放置海报的地方，所以从法律上讲，你没有非法张贴或刑事破坏。如果你每周覆盖全镇每个广告牌，那么可能会可能会尝试阻止你，因为你让他们损失了钱。一次性的接管他们只会覆盖你，没问题。


    ### J. 坚持

    一桶五金店的墙纸胶或一些小麦胶都可以。


    ### K. 隐于无形

    橙色在户外广告界非常流行——反光夹克和裤子是标准配置。为什么不也配上安全帽呢？我不知道为什么他们让他们戴，我到为止还没被掉落的纸伤过过。


    '
