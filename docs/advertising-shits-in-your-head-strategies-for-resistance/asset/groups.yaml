    ## How to hack into bus stop advertising spaces


    ### What you will need


    - Artwork: 1,200mm x 1,800mm

    - 4-Way utility key

    - H60 Security Pin

    - TX30

    - Hi Viz Vest


    ![](img/8651026a6fb925f178510a3cc9c8b614_73_0.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_73_1.png)

    ![](img/8651026a6fb925f178510a3cc9c8b614_73_2.png)


    1. Choose a suitable bus stop location. The main bus stop advert company is JDCause,
    and there are hundreds of sites to choose from.


    2. Select the 4-way utility key from the kit and locate the attachment that has
    a large square key shape. This will open the lock on the side of the advertisement
    shell.


    3. Insert the square key into the lock and turn clockwise 180 degrees. Don''t
