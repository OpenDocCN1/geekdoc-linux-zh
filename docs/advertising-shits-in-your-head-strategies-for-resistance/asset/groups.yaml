    # PART ONE:

    ADVERTISING

    SHITS IN YOUR HEAD


    # In 2013 we spent £9.6m telling you you''re not violent, racist and corrupt.
    It''s propaganda pure and simple.


    Using public money to lie to the public

    #ACAB


    # 1


    # PR-OPAGANDA


    "20th century advertising is the most powerful and sustained system of propaganda
    in human history and its cumulative cultural effects, unless quickly checked,
    will be responsible for destroying the world as we know it. As it achieves this
    it will be responsible for the deaths of hundreds of thousands of non-western
    peoples and will prevent the peoples of the world from achieving true happiness.
    Simply stated, our survival as a species is dependent upon minimizing the threat
    from advertising and the commercial culture that has spawned it."1


    Sut Jahally


    The modern subvertising movement has consumerism as its target. Many practitioners
    present their work as explicitly anti-capitalist and almost all object to outdoor
    advertising as a form of propaganda. Jordan Seiler of the Public Ad Campaign notes
    how ingrained in our collective consciousness both capitalism and the system of
    propaganda that promotes it become:


    > [Our acceptance of advertising is] testament to how much advertising in general
    has actually infused itself into our lives and we consider it to be a medium that
    is inescapable and just inherently a part of the capitalist system."2


    # ADVERTISING SHITS IN YOUR HEAD


    In the section “Why Brandalise?” from the Brandalism website, the authors specifically
    cite the system of propaganda that we euphemistically call public relations, which
    they claim advances unsustainable economic growth.³


    But what does it mean to categorise outdoor advertising as propaganda?


    # BAD WORDS?


    > “Propaganda got to be a bad word because of the Germans using it, so what I
    did was to try and find some other word, so we found the word Counsel on Public
    Relations.”


    Edward Bernays


    Edward Bernays is widely considered to be the founder of modern public relations.
    The nephew of Sigmund Freud, he used psychoanalysis to appeal to emotions. This
    marks a turning point in advertising. Before it was called public relations, it
    was called propaganda.


    Although the name may have changed, Bernays wrote a book on propaganda, entitled
    Propaganda. In Propaganda, Bernays explains: "The intelligent and strategic manipulation
    of the opinions of the masses is a salient element of democracy. Propaganda is
    neither good nor bad: it’s what you do with it that counts."⁵ It is argued that
    propaganda is a necessary element of democracy because the invisible government
    of the public, the mental opinion of the masses is the true power.


    > We are governed, our minds moulded, our tastes formed, our ideas suggested,
    largely by men we have never heard of. This is a logical result of the way in
    which society is organised.⁸


    For Bernays, a smoothly functioning society was one marshalled around consumption;
    he viewed the American way of life as so entwined with capitalism as to be identical.
    Though he occasionally uses examples of other ways propaganda can be used, Bernays
    has a special place for propaganda that he claims to be the civilising influence
    of capitalism.⁹ It is de-propaganda de-propaganda de-propaganda claim that the
    conscious manipulation of the masses remains unchanged today.¹⁰


    # THE EDGE OF APOCALYPSE


    It is further claimed that passive participation in a system that demands nothing
    but consumption may be taking a devastating toll in terms of environmental destruction.
    Subvertisers follow Sut Jahally (quoted at the start of this chapter) when they
    claim that advertising is fuel for the capitalist system, a system of exponential
    growth and ever-increasing consumption. Brandalism performed their largest ad-takeover
    to date – by installing over 600 posters in bus stop advertising spaces – in protest
    of the COP 21 climate talks in Paris. Bill Posters of Brandalism explains their
    targeting of the climate talks:


    > “We are taking their spaces back because we want to challenge the role advertising
    plays in promoting unsustainable consumerism. Because t advertising industry force
    feeds our desires for products created from fossil fuels, they are intimately
    connected to causing climate change. As is the case with the climate talks and
    their corporate sponsored events, outdoor advertising ensures those with the most
    money are able to ensure that their voices get heard above all else.”¹¹


