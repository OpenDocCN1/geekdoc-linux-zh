    广告黑客宣言


    伦敦公共空间事务的品牌破坏主义者


    # 2


    # 广告正在你的脑子里拉屎


    广告到处拉屎，并主导着我们的文化。这是一种直观的、强力的污染形式，不仅影响了我们的共同公共和文化空间，也影响了我们深处的私密空间。广告商想要你的“大脑时间”——在你不知情的情况下在你的脑子里拉屎。我们要阻止他们。¹²


    Bill Posters – 品牌破坏主义 (Brandalism)


    # 视觉污染


    颠覆活动者之间的一个共同主题是将广告概念化为一种污染。Bill Posters 在他2014年的文章《广告正在你的脑子里拉屎》中将其称为污染。


    事实确实是，普通城市居民以惊人的速度面对着行业所谓的“户外广告（OOH）”。在英国，平均每个通勤者在在45分钟的伦敦地铁旅程中，会接触到超过130条广告，涉及80多种不同的产品；在完整的一天里，首都居民可能会看到大约3500条商业信息。15


    颠覆广告者（Subvertisers）声称——就像其他污染物一样，环境中的广告具有有害影响。


    # 你的眼睛在静默中阅读这些


    也许与污染进行类比恰当的一个原因，是广告在环境中积聚的方式——一种商业杂乱。当广告作为背景环境积累存在时，它的危害是最大的。


    一些广告商声称广告的影响是无害的，16，同时又声称它是强有力的说服形式；一方面，反正没人注意到户外广告，另一方面，它是一个价值数十亿美元的行业，帮助影响我们的决策。17
    之所以可以声称“99%的广告几乎没有或没有影响”*18 却能以不断增长的速度销售广告，是因为广告恰恰作为背景噪音时发挥了它们最强大的作用。


    广告研究员 Robert Heath 博士已经证明，广告在潜意识层面发挥作用，这意味着它在


    ![](img/8651026a6fb925f178510a3cc9c8b614_22_0.png)


    # 广告正在你的脑子里拉屎


    在不需要高水平注意力的情况下对我们起。他提出了“低注意力处理模型”，显示即使在我们没有主动注意到它或无法在意识中回想起它时，广告对我们仍然有影响。19 此外，他证明了广告是在情感而非智力层面发挥作用，这意味着即使是那些意识到广告虚假承诺的人，仍然可能通过情感被说服。避免这种潜意识影响的唯一方法是完全避免广告，正如广告商和广告商们所指出的，这几乎是不可能的。


    # 多工作，少睡觉


    广告行业声称广告重新分配了消费——从一种产品到另一种产品，这是品牌之间永恒的战争。广告的批评者声称恰恰相反：广告通过创造需求增加了总消费。广告商声称他们正在寻找市场份额；批评者声称他们在扩张或创造市场。


    “广告增加消费”这一观点的最著名倡导者是 JK Galbraith，他在《富足社会》中提出。他认为存在一种“依赖效应”——一旦人类基本需求得到满足，就必须制造更多以维持增长型经济的需求。20
    他的断言最近被研究人员 Benedetto Molinari 和 Francesco Turino 在他们关于广告宏观经济影响的研究中证实：


    （注：此处原文存在大量重复的OCR错误文本，已按要求提取核心内容翻译。）

