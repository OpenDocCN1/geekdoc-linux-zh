    in around £80 ($100). Prices vary depending on location but, by comparison, if
    you were to pay for a billboard via an outdoor advertising company, it would cost
    you around £500 ($600) a week per billboard, with a £2000 ($2400) minimum spend.


    # ACCESS KEYS


    It is perhaps a measure of the perceived sanctity of the spaces adverts occupy
    that the majority of them are either completely unprotected or only protected
    by standard security locks, the keys for which can be easily found and purchased
    on the internet.


    Both Brandalism and Special Patrol Group have put advice online on which access
    tools are required and where to find them. Special Patrol Group created an Ad
    Space Hack Pack that contains the three tools that they claim can access “up to
    a third of outdoor advertising spaces in the UK”.85 The packs were created for
    Banksy’s Dismaland exhibition, where over 2000 sets were sold during its week
    run.


    Public Ad Campaign have been making what they call Public Access keys available
