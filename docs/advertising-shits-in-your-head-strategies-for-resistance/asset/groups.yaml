    particular, subvertising can be conceptualised as a form of “detournement” – a
    rerouting or hijacking – a strategy that was pioneered by the SI.75 This is true
    both in terms of the re-imagining of individual brands or adverts, but also in
    the hijacking of advertising spaces or “take-overs”.


    One way that subvertisers claim this form of detournement may work is by intervening
    in the visual landscape and puncturing the “existing regime of truth”.76 As described
    earlier, outdoor advertising is seen as untouchable: by both intervening in the
    physical space containing the advert and altering the message77 to create a “displacement
    of an already-established disposition”, subvertising can disrupt our habitual
    ways of thinking.78


    # AGAINST LIBERAL PRANKSTERS


    A criticism of subvertising is that over-emphasising its potential effect may
    be naïve. As academic Richard Gilman-Opalsky points out:


    > “Debord was well aware, in the 1950s and 60s, that something like ‘subvertising’
    could never jam a culture of constant accumulation. Subvertising at its best is
    like a skip on a record that the needle passes over with a minor interruption.”59


    It’s possible that subverts may just be ignored, or subsumed into habitual ways
    of thinking; it’s also true that just as advertising works on an emotional level
    and in a cumulative way, so must subvertising, which means it is likely to be
    most effective as part of a sustained campaign.80'
  - '[PAGE 67]


    Neither can subverting be about reform if it is to be truly considered detournement,
    in the Debordian sense. Academic and author Catherine Flood claims that Addbusters
    "shifted the focus of graphic resistance from creating radical alternatives to
    mainstream design and advertising to exposing and attempting to reform its practices."281
    But the modern subverting movement has moved beyond this position by returning
    to the original Debordian critique of the spectacle, which is suspicious of attempts
    at reforming the outdoor advertising industry:82


    > "One must not introduce reformist illusions about the spectacle, as if it could
    eventually improved from within, ameliorated by its own specialists under the
    supposed control of a better-informed public opinion."83


    Where Addbusters aim at individual brands and campaigns, even if this could be
    seen as part of a more systemic critique, it took aim from a relatively elevated
    position, and didn''t attempt to pass the weapons around; those who aren''t able
    to take part in the fight are necessarily relegated to the position of spectator.84
    This is why all of the subvertisers considered in the case studies (see page 71)
    attempt to spread the form.'
