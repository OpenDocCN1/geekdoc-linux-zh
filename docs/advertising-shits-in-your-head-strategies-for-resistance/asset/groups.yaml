    # YEAH, WE GOT KEYS FOR THAT One of the things that makes modern subverting stand
    out is the vigour with which its proponents attempt to spread the form. Unlike
    other art forms, there is nothing to be gained by retaining a monopoly on practice,
    and everything is to be won by passing it around. Both Jordan Seiler and Bill
    Posters of Brandalism started out as individual artists, putting up their work
    in the street art tradition; both have come to the realisation that, for interventions
    to be making a true claim to the rights of the city, it must be a practice that
    is open to all. There can be a few obstacles to subverting, which include: accessing
    the spaces, printing materials large enough, and practical instruction on how
    to install your artwork. Thanks to globalisation, many of these obstacles can
    be overcome on a global scale.


    # PRINTING

    All outdoor advertising spaces worldwide are standardised sizes, so as long as
    you can get someone with a big printer, you get artwork printed in the correct
    sizes. At the time of writing, 6-sheets can be printed for about £6 (8 USD) and
    12-sheets come around £8 ($10). Prices vary depending on location but, by comparison,
    if you were to pay for a billboard via an outdoor advertising company, it would
    cost you around £500 ($600) a week per billboard, with a £2000 ($2400) minimum
    spend.


    # ACCESS KEYS

    It is perhaps a measure of the perceived sanctity of the spaces adverts occupy
    that the majority of them are either completely unprotected or only protected
    by standard security locks, the keys for which can be easily found and purchased
    on the internet.


    Both Brandalism and Special Patrol Group have put advice online on which access
    tools are required and where to find them. Special Patrol Group created an Ad
    Space Hack Pack that contains the three tools they claim can access “up to a third
    of outdoor advertising spaces in the UK”.85 The packs were created for Banksy’s
    Dismaland exhibition, where over 2000 sets were sold during its week run.


    Public Ad Campaign have been making what they call Public Access keys available
