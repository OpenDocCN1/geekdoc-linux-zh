    # NYSAT (2009)


    New York Street Advertising Takeover (NYSAT) was the first time Jordan decided
    to expand his subverting practice to get more people involved. Targeting a company
    in New York City that exclusively used illegal advertising spaces meant that it
    was relatively easy to get citizens involved, and Jordan credits “the hard work
    and dedication of over a 100 artists, activists, photographers, videographers,
    lawyers, mothers, fathers, students, teachers, and public citizens.”¹108


    The action took the form of citizens white-washing the illegal ad spaces; this
    removed the adverts and created a blank canvas, which many artists then filled
    with their work. It also garnered media attention, from outlets including the
    New York Times, the Economist, Abbusters and street art magazine Juxtapoz.


    # TOSAT (2010)


    The Toronto Street Advertising Takeover (TOSAT) was the first international street
    ad take-over project.¹109 Rather than simply painting over illegal fly-posting,
    this time the project accessed legal spaces – Pattison Outdoor Core Media Pillars
    – replaced their adverts with posters. 60 artists were invited to submit artwork
    and over 90 media pillars had'
  - '[PAGE 92]


    their adverts replaced, as well as 20 billboards. A team of local volunteers was
    recruited to perform the installs and information on how to access the spaces
    – using an ordinary household doorknob – was made available on the TOSAT mini-site.
    The action was featured in local Toronto news and internationally via street art
    sites Juxtapoz and Vandalog.


    # MASAT (2011)


    Madrid Street Advertising Takeover (MASAT) was Jordan’s second international ad
    take-over campaign.¹¹¹⁰ This time, instead of using artworks, contributors were
    asked to provide text-based submissions, which opened up the process to “a wide
    range of individuals including sociologists, teachers, lawyers, gallery owners
    and anyone with a concern for the curation and participation in public space”.
    In total, 106 different text-based designs were submitted and installed.


    # PUBLIC ACCESS KEYS


    Jordan had been working with public telephone spaces in New York that aren''t
    secured, so didn’t initially have any need of access tools. But when he visited
    Madrid for the MASAT project, he met fellow subverter Vermibus, who had replicated
    an original JCDecaux key. This planted the idea that manufacturing access keys
    could be done; later he figured out how to replicate them in his workshop at home.¹¹¹


    There are 11 different keys available and Jordan’s sold around 400 sets of access
    keys to date. If someone spots a'
  - '[PAGE 93]


    lock that doesn’t currently have a key, they can send a photo to Jordan who will
    try to replicate it for them and then make it available online. Jordan says that
    the Public Access Project aims to:


    > ">...reverse this one-way communication by providing access to municipal infrastructure
    for public dialogues. Artists and individuals can treat the tools offered through
    this site as functional sculptures to interject their thoughts into our shared
    public spaces."112'
