    # ADVERTISING SHITS IN YOUR HEAD


    # BRANDALISM 2012 - THE BILLBOARD


    The first Brandalism project happened in July 2012, across five major cities.
    Two installers pasted up 36 large format billboards (48-sheets) with original
    work from 28 international artists. The project was deliberately timed to coincide
    with the “protective brand-mania that generalised the London Olympics”¹117 and
    as such gained international media attention, provoking “a discussion about the
    legitimacy of outdoor advertising spaces that we are forced to interact with”.¹118


    # BRANDALISM 2014 - THE 6-SHEET


    After realising there were still questions over the democracy of the project,
    Brandalism prepared for round two with a three day training course on both the
    theory and practice of subverting. Ten “crews” from all over the UK attended and
    helped to select which artworks would be installed on the streets by a process
    of consensus decision making.


    Over two days, 365 artworks were installed in bus stop advertising panels in Edinburgh,
    Glasgow, Liverpool, Manchester, Leeds, Birmingham, Brighton, Bristol, Oxford and
    London. The installs again included work from internationally acclaimed artists,
    but were anonymised.


