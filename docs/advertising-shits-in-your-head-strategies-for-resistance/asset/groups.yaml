    # ADHACKMANIFESTO


    1. 广告

    正在你的脑子里拉大屎

    这是一种视觉和心理污染。


    2. 移除/替换/破坏广告

    并不是破坏公物行为

    这是一种清理行为，在法律和道德上都是防御性的。


    3. 视觉领域是一个

    公共领域

    它是公有财产的一部分

    它属于所有人，因此不应该任何人能够拥有它。


    4. 户外广告

    可以也应该被

    禁止

    圣保罗在 2007 年做到了，格勒诺布在 2015 年也效仿。


    # 第一部分：

    广告

    正在你的脑子里拉大屎


    # 在 2013 年，我们花了 960 万英镑告诉你你不暴力、不种族歧视、不腐败。这完全纯粹是宣传。


    用公款钱欺骗公众

    #ACAB


    # 1


    # 公关宣传式宣传 (PR-OPAGANDA)


    “20世纪的广告是人类历史上最强大、最持久的宣传系统，其积累的文化影响如果不及时遏制，将负责破坏我们所知的的世界。在实现这一目标的过程中，它将导致数十万非西方人民的死亡，并阻止世界各国获得真正的幸福。简单来说，我们作为一个物种的生存取决于最大限度地减少来自广告以及产生它的商业文化所带来的威胁。”1


    Sut Jahally


    现代颠覆广告运动以消费主义为目标。许多从业者将他们的工作明确表述为反资本主义，且几乎所有人都反对将户外广告作为一种宣传形式。公共广告运动（Public Ad
    Campaign）的 Jordan Seiler 指出资本主义以及促进它的宣传系统是如何根深蒂固我们的集体意识的：


    > [我们对广告的接受] 证明了广告实际上已经在多大程度上渗透了我们的生活，我们将其视为一种无法逃避的媒介，而且本质上是资本主义系统的一部分。”2


    # 广告正在你的脑子里拉大屎


    在 Brandalism 网站的“为什么选择 Brandalism？”章节中，作者特别引用了被我们委婉地称为“公共关系”的宣传系统，他们声称该系统推进了不可持续的经济增长.³


    但将户外广告归类为宣传意味着什么？


    # 坏词？


    > “‘宣传’（Propaganda）变成一个坏词是因为德国人使用它，所以我尝试找另一个词，于是我们找到了‘公共关系顾问’（Counsel）这个。”


    Edward Bernays


    爱德华·伯恩斯被广泛认为是现代公共关系的创始人。作为西格蒙德·弗洛伊德的侄子，他利用心理分析来诉诸情感。这标志着广告的一个转折点。在它被称为公共关系之前，它被称为宣传。


    尽管名称变了，伯恩斯还是写过一本名为《宣传》的书。在《宣传》中，伯恩斯解释道：“对大众意见的智力和策略性的操纵是民主的一个显著元素。宣传本身无好无坏：关键在于你如何使用它。”⁵
    人认为，宣传是民主的必要元素，因为对公众的隐形政府——大众的心态才是真正的权力。


    > 我们被统治、思想被塑造、品味被形成、观点被建议，在很大程度上是由我们从未听过的这些人。这是社会组织方式逻辑结果。⁸


    对于伯恩斯来说，一个运作良好的社会是围绕消费构建的；他认为美国的生活方式与资本主义紧密结合到等同。尽管他偶尔会使用其他利用宣传的例子，但伯恩斯对他那种声称是资本主义文明化影响的宣传留有特殊地位。⁹
    这种宣传者声称，对大众的有意识操纵在今天仍然没有改变。¹⁰


    # 末日边缘


    进一步声称，被动参与一个只要求消费的系统可能在环境破坏方面付出毁灭性的代价。颠覆广告者遵循了 Sut Jahally（本章开头的引用）的观点，他们认为广告是资本主义系统的燃料，一个追求指数级增长和不断增加的系统。Brandalism
    执行了他们迄为止最大的广告接管行动——在公交站广告位安装了 600 多张海报——以此抗议在巴黎举行的 COP 21 气候变化会议。Brandalism 的
    Bill Posters 解释了他们针对气候会议的原因：


    > “我们夺回这些空间，是因为我们想挑战广告在推广不可持续消费主义方面所扮演的角色。因为广告行业强行灌输对化石燃料产品的渴望，它们与导致气候变化密不可分。正如气候会议及其企业赞助活动一样，户外广告确保了拥有最多钱的人能够确保他们的声音盖过其他声音。”¹¹


