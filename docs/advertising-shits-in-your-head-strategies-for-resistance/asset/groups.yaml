    Perhaps one reason a comparison with pollution is apt is the way that advertising\
    \ can accumulate in the environment – a sort of commercial clutter. It is as background\
    \ environmental accumulation that advertising can be most harmful.\n\nSome advertisers\
    \ claim that the affect of advertising is benign,16 at the same time as claiming\
    \ it is a powerful form of persuasion; on one hand, nobody notices outdoor adverts\
    \ anyway, and on the other, it is a multi-billion dollar industry that helps to\
