    One way that subvertisers claim this form of detournement may work is by intervening
    in the visual landscape and puncturing the “existing regime of truth”.76 As described
    earlier, outdoor advertising is seen as untouchable: by both intervening in the
    physical space containing the advert and altering the message77 to create a “displacement
