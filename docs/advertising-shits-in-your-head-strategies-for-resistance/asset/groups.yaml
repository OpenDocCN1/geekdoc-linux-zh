    # AN IDIOT’S GUIDE TO

    BILLBOARD TAKEOVERS


    # BY DR D


    # A. Lingo


    Know your terminology, amaze your friends. A billboard is also known as a 48-sheet
    as it is made up of 12 (60” x 40”) sections. Each of the 12 sections is called
    a 4-sheet as they are 4 x double crowns (30” x 20”) in size.


    # B. What’s the point?


    What is your billboard take over going to be, have you got a point or are you
    being decorative? Either way, show your idea to a friend. A typo on paper is one
    thing; a typo on a billboard just makes you look like a big wanker that can’t
    spell. It’s the difference between knowing your shit and knowing you’re shit (I
    stole that line).


    If you’re printing your masterpiece go to C. If it’s cutting one up go to D. People
    who paint go to E.


    # C. Size matters


    The print size for a standard billboard is landscape 10ft x 20ft or 3m x 6m. If
    you get one printed online, you really want it printed on blue back paper. This
    paper requires pre-soaking in water before sticking and keeping it moist in a
    plastic bag is essential. The pre-soaking of blue back means it’s easy to move
    and line up on the board and it


    59'
