    explains:


    > "The idea after NYSAT [New York Street Advertising Takeover] was, ok, I can’t
    do enough damage on my own. I need to figure out projects and ways in which other
    people can do the work, because I just don’t have enough time or resources to
    do enough damage. And so Public Access really was about that.”87 Currently there
