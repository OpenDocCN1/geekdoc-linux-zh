  md: 'particular


    One way that subvertisers claim this form of detournement may work is by intervening
    in the visual landscape and puncturing the "existing regime of truth".⁷⁶ As described
    earlier


    # AGAINST LIBERAL PRANKSTERS


    A criticism of subvertising is that over-emphasising its potential effect may
    be naïve. As academic Richard Gilman-Opalsky points out:


    > "Debord was well aware, in the 1950s and 60s, that something like sporadic ''subvertising''
    could never jam a culture of constant accumulation. Subvertising at its best is
    like a skip on a record that the needle passes over with a minor interruption."⁷⁹


    It''s possible that subverts may just be ignored, or subsumed into habitual ways
    of thinking; it''s also true that just as advertising works on an emotional level
    and in a cumulative way, so must subvertising, which means it is likely to be
    most effective as part of a sustained campaign.⁸⁰'
  merge: -1
  pgno: 66
- img_proc: false
  md: 'Neither can subvertising be about reform if it is to be truly considered détournement,
    in the Debordian sense. Academic and author Catherine Flood claims that Adbusters
    “shifted the focus of graphic resistance from creating radical alternatives to
    mainstream design and advertising to exposing and attempting to reform its practices.”⁸¹
    But the modern subvertising movement has moved beyond this position by returning
    to the original Debordian critique of the spectacle, which is suspicious of attempts
    at reforming the outdoor advertising industry:⁸²


    > "One must not introduce reformist illusions about the spectacle, as if it could
    be eventually improved from within, ameliorated by its own specialists under the
    supposed control of a better-informed public opinion."⁸³


    Where Adbusters took aim at individual brands and campaigns, even if this could
    be seen as part of a more systemic critique, it took aim from a relatively elevated
    position, and didn''t attempt to pass the weapons around; those who aren''t able
    to take part in the fight are necessarily relegated to the position of spectator.⁸⁴
    This is why all of the subvertisers considered in the case studies (see page 71)
    attempt to spread the form.'
