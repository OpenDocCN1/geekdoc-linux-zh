  md: 'The motivations for subvertising have traditionally been wide-ranging, from
    objections to individual products, to aesthetic considerations, to simple mischief.
    Though the strategies of altering, removing or reversing<sup>69</sup> outdoor
    advertising may remain largely the same, today’s subvertisers are a more co-ordinated
    movement,<sup>70</sup> with a more connected vision:


    > “Today, the practice of subvertising is reaching novel heights. Collectives
    are starting to connect globally to form an ever-increasing force of resistance
    against the visual and mental implications of advertising. Initiatives such as
    Brandalism, Brigade Antipub and Plane Stupid are beginning to specifically address
    the connections between advertising, fossil fuels and climate change. Intervening
    into advertising spaces that usually celebrate consumption, they divert messages
    towards ones of anti-consumption.”<sup>71</sup>


    # DETOURNEMENT THIS


    > “The method is the most interesting part of Brandalism, since it’s specifically
    designed to confuse the viewer a little. This is why the posters are usually playful,
    typically mimicking established designs. They are, I think, motivated by 1960s
    French Situationism – people who believed the culture, the “spectacle” of modern
    society needed to be attacked, and done in such a way that would wind up, rile,
    mimic, anger, confuse.”<sup>72</sup>


    Subvertising is a distinct form of culture jamming, which can be seen as an attempt
    to “intervene in the visual landscape that shapes how we think”;<sup>73</sup>
    as such, it has a direct link to the work of the Situationist International (SI).<sup>74</sup>
