  md: '# LEGAL DEFENCE


    > "Any advert in a public space that gives you no choice whether you see it or
    not is yours. It''s yours to take, rearrange and re-use. You can do whatever you
    like with it. Asking for permission is like asking to keep a rock someone just
    threw at your head..."


    Banksy/Tejaratchi


    In the UK, subvertising potentially carries a charge of criminal damage. For some
    subvertisers, the best strategy where the law''s concerned is to avoid being caught
    in the act, and to act anonymously. Brandalism and Special Patrol Group take precaution
    against arousing suspicion by wearing the "international cloak of invisibility
    known as hi-viz".


    As an anonymous member of the SPG told the New Statesman:


    > "Nobody in our group has ever been caught because it is absurdly difficult to
    get caught doing something that is usually someone''s job – even when you''re
    putting up posters about deaths in custody, bearing the ACAB slogan, outside the
    HQ of the British Police Force (twice)."


    Others are more open. Jordan Seiler of Public Ad Campaign views his work as civil
    disobedience and, as such, says it''s important to be able to claim your actions.
    In the US the charge for subvertising is "possession of graffiti'
