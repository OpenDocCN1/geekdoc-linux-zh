  md: '**5** Take the T40 hex key from the kit, and insert it into the small hole
    whilst keeping the metal cover held up.


    ![](bbox=[0.15, 0.72, 0.44, 0.88])


    > ℹ️ If installing at night time, turn the power breakers off inside the panel
    – just flick the switch down. You will feel less exposed with the backlight.


    **6** Once the key is located in the lock, turn anti-clockwise through 90 degrees
    to release the catches that keep the perspex screen closed.


    ![](bbox=[0.12, 0.35, 0.39, 0.49])


    **7** The perspex cover may have two pistons that open up when you release the
    catches. Make sure you keep hold of the bottom of the screen and let it rise slowly.


    ![](bbox=[0.12, 0.02, 0.42, 0.22])


    **8** Roll up the poster that is inside from the bottom.


    ![](bbox=[0.44, 0.72, 0.72, 0.87])


    **9** Slide your poster into the top of the panel, push it into the clip the runs
    across the top of the perspex. You may wish to pre-fold a 1cm edge on your posters,
    for an easier install. A credit card can also help with pushing the poster into
    the clip.


    ![](bbox=[0.44, 0.4, 0.72, 0.55])


    > ♻️ If the poster you are replacing has a blank reverse, you can re-use it for
    another installation; if not, you should recycle it.


    **10** Put two hands on the bottom edge of the casing and push back to the frame
    to re-engage the catches, and close the door. Then walk away; take your time;
