- img_proc: false
  md: '## H. Caution!

    Some boards have nothing on them as they''ve become dangerous. Quite often the
    wooden platforms become rotten and never get removed.


    ## I. Legal bizzle

    Technically speaking you''re putting a poster on a site that is designed to have
    a poster on it, so legally you''re not fly posting or criminally damaging it.
    If you cover every board in town week after week then someone will probably try
    and shut you down as you''re losing them money. A one-off take-over they''ll just
    cover you up, no problemo.


    ## J. Sticking it to the man

    A bucket of hardware store wallpaper paste or some wheat paste will work fine.


    ## K. Hide in plain sight

    Orange is very much in vogue on the Outdoor Advertising scene — hi-viz jacket
    and trousers as standard. Why not accessorize with a hard hat, too? I have no
    idea why they make them wear these, I have thus far never been injured by falling
    paper. Going by the book, you should wear a harness that attaches you to the ladder.


    ## L. Skin jobs

    Not just the enemy in Blade Runner. Check that the board you want to paste on
    to isn''t a "skin". They are a type of plastic, various types are in use, and
    you can''t paste on to these boards, but you can use some spray mount or carpet
    adhesive spray.'
