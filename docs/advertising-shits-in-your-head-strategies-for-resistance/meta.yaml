  md: '# # 1

    ## PR-OPAGANDA


    > "20th century advertising is the most powerful and sustained system of propaganda
    in human history and its cumulative cultural effects, unless quickly checked,
    will be responsible for destroying the world as we know it. As it achieves this
    it will be responsible for the deaths of hundreds of thousands of non-western
    peoples and will prevent the peoples of the world from achieving true happiness.
    Simply stated, our survival as a species is dependent upon minimizing the threat
    from advertising and the commercial culture that has spawned it."¹


    Sut Jahally


    The modern subvertising movement has consumerism as its target. Many practitioners
    present their work as explicitly anti-capitalist and almost all object to outdoor
    advertising as a form of propaganda. Jordan Seiler of the Public Ad Campaign notes
    how ingrained in our collective consciousness both capitalism and the system of
    propaganda that promotes it have become:


    > "[Our acceptance of advertising is] testament to how much advertising in general
    has actually infused itself into our lives and we consider it to be a medium that
    is inescapable and just inherently a part of the capitalist system."²'
  merge: -1
  pgno: 12
- img_proc: false
  md: 'In the section "Why Brandalise?" from the Brandalism website, the authors specifically
    cite the system of propaganda that we euphemistically call public relations, which
    they claim advances unsustainable economic growth.³


    But what does it mean to categorise outdoor advertising as propaganda?


    # BAD WORDS?


    > "Propaganda got to be a bad word because of the Germans using it, so what I
    did was to try and find some other word, so we found the word Counsel on Public
    Relations.''"⁴


    Edward Bernays


    Edward Bernays is widely considered to be the founder of the modern public relations
    industry. The nephew of Sigmund Freud, he was the first person to use his uncle''s
    insights from psychoanalysis to appeal to an advertising audience''s emotions.
    This marks an enormous milestone in marketing and is a strategy that remains essentially
    unchanged today; this turning point can justifiably be considered the birth of
    the consumer.


    But before public relations was called public relations it was called propaganda;
    it is no small irony that propaganda got such a bad name from its war-time usage
    – in mobilising millions to the deadliest conflagration the world had yet seen
    – that the word itself had to be spun. The man responsible'
  merge: -1
  pgno: 13
- img_proc: false
  md: 'for effecting the name-change was Edward Bernays, the most famous practitioner
    of the industry he invented. Before he''d changed the name, Bernays wrote a book
    on its practice, entitled Propaganda – it is basically a beginners guide to public
    relations, propaganda for propaganda.


    Although the name may have changed, public relations retains its essential definition:
    Effort directed systematically toward gaining support for an opinion or a course
    of action. In Propaganda, Bernays explains: "The mechanism by which ideas are
    disseminated on a large scale is propaganda, in the broad sense of an organised
    effort to spread a particular belief or doctrine."⁵ It only became a dirty word
    because "the Germans" used it, but it is exactly the same method. Bernays also
    uses examples of how propaganda is necessary to bring about the changes in public
    opinion that allow, for example, dangerous chemicals in food to be outlawed.⁶
    Propaganda is neither inherently good nor bad: it''s what you do with it that
    counts.⁷


    Indeed, for Bernays, the conscious manipulation of the masses by means of propaganda
    was seen not only as inevitable and benign, but as a necessary part of democracy.
    It is a claim that rests both on the idea that the mass of people – the public
    – are dangerous when left to their own devices, but also that certain individuals
    – and only these individuals – are talented enough to guide the rest. Where subvertising
    activists describe outdoor advertising as undemocratic – in that there is no collective
    control over it – Bernays suggests that public relations are an important component
    of a democratic'
  merge: -1
  pgno: 14
- img_proc: false
  md: '# ADVERTISING SHITS IN YOUR HEAD


    society. The meaning of the word democracy is highly contested: in Bernays'' schema
    it takes on such paradoxical meaning as to almost constitute double-think:


    > > "The conscious and intelligent manipulation of the organized habits and opinions
    of the masses is an important element in democratic society. Those who manipulate
    this unseen mechanism of society constitute an invisible government which is the
    true ruling power of the country. We are governed, our minds moulded, our tastes
    formed, our ideas suggested, largely by men we have never heard of. This is a
    logical result of the way in which our democratic society is organised. Vast numbers
    of human beings must co-operate in this manner if they are to live together as
    a smoothly functioning society."⁸


    For Bernays, a smoothly functioning society was one marshalled around consumption;⁹
    he viewed the American way of life as so entwined with capitalism as to be almost
    identical. Though he occasionally uses examples of other ways propaganda can be
    used, Bernays has a special place for propaganda that promotes what he claims
    to be the civilising influence of capitalism. Bernays also makes the claim that
    good advertising is not simply propaganda for an individual product, or even for
    an individual company, but for the entire system of consumption.¹⁰


    Subvertisers claim that this conscious manipulation of the masses – practically
    unchanged since Bernays – places the emphasis on passive consumption over active
    political participation.'
