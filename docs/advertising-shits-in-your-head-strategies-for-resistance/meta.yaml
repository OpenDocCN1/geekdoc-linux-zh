  md: '# # AN IDIOT''S GUIDE TO BILLBOARD TAKEOVERS


    **BY DR D**


    # ## A. Lingo


    Know your terminology, amaze your friends. A billboard is also known as a 48-sheet
    as it is made up of 12 (60" x 40") sections. Each of the 12 sections is called
    a 4-sheet as they are 4 x double crowns (30" x 20") in size.


    # ## B. What''s the point?


    What is your billboard take over going to be, have you got a point or are you
    being decorative? Either way, show your idea to a friend. A typo on paper is one
    thing; a typo on a billboard just makes you look like a big wanker that can''t
    spell. It''s the difference between knowing your shit and knowing you''re shit
    (I stole that line).


    If you''re printing your masterpiece go to C. If it''s cutting one up go to D.
    People who paint go to E.


    # ## C. Size matters


    The print size for a standard billboard is landscape 10ft x 20ft or 3m x 6m. If
    you get one printed online, you really want it printed on blue back paper. This
    paper requires pre-soaking in water before sticking and keeping it moist in a
    plastic bag is essential. The pre-soaking of blue back means it''s easy to move
    and line up on the board and it'
  merge: -1
  pgno: 76
- img_proc: false
  md: 'dries perfectly flat and professional-looking. Make sure you number each of
    the 12 sections on the top at the back and roll from the bottom up. Work from
    top left and have your ladder in the middle of the first two posters, that way
    you should be able to reach all the posters only moving your ladder to three positions.


    Don''t try and pre-soak any other paper, you''ll just end up with paper-mache.
    If you know your printer, happy days: if not, be aware they can be like the Stasi.
    They have a code of conduct that means if they think what you''re asking them
    to print is likely to cause offence they won''t print it and obviously they now
    know what you''re up to. I did have a printer once refuse to print an image of
    David Cameron''s face, so the lines on what can be considered offensive are subjective.


    # **D. Cut up jobs**


    If you have two billboard images you want to mash up together you can cut a section
    from one with a knife and peel off. Once away from the scene you can tease the
    paper you don''t need from the back of the piece until it''s thin enough to re-stick
    with paste onto another board. As it''ll have the industry standard blue-backed
    paper it usually dries perfectly, hiding the fact you''ve added a bit. I did this
    with the first board I ever altered, moving "SU" from one board and sticking it
    onto another so "CLICKS" became "SUCKS", the whole phrase becoming "SUDDENLY EVERYTHING
    SUCKS".'
  merge: -1
  pgno: 77
- img_proc: false
  md: 'YEAH, WE GOT KEYS FOR THAT


    # ## E. Paint jobs


    Do you need me to tell you to use something that won''t run in the rain? Aerosol
    or acrylic or even exterior masonry paint will do you...


    # ## F. Getting on board


    You''ll be safest on a two-section ladder that you can put up to the top - rest
    the ladder brackets on the billboard for your comfort and reassurance. Remember:
    vandals don''t bounce, so don''t over stretch. Use a bucket for your paste hung
    from the ladder with an S hook; you''ll need your hands for positioning your poster.
    You can get a bill poster''s brush online; you could also use a soft bristle broom
    but if I see you I''ll really mark you down on style for that. A fat wallpaper
    brush is just about use-able, but you''re going to be up that ladder three times
    longer than you need to be – if you''re only changing a bit of lettering or imagery
    it would work fine.


    # ## G. Timing is everything


    Generally speaking, boards in busy cities are changed every two weeks. Out of
    town that might become every month. If you watch when they change you can figure
    out the best time to carry out your take-over. If you''ve been covered over and
    you find the board still wet you can peel off the poster you''ve been covered
    by. Do keep in mind the bill poster will now really want to kick your arse.'
