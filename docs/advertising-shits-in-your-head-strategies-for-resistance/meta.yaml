    # ADVERTISING SHITS IN YOUR HEAD


    > "Advertising shits all over and dominates our culture. It is a visceral, powerful
    form of pollution that not only affects our common public and cultural spaces,
    but also our deeply private intimate spaces. Advertisers want your ‘brain time’
    – to shit in your head without your knowledge. We want to stop them."[^2]


    Bill Posters – Brandalism


    # VISUAL POLLUTION


    A common theme amongst subvertising activists is to conceptualise advertising
    as a form of pollution. Bill Posters refers to it as pollution in his 2014 article
    “Advertising Shits in Your Head”,$^{13}$ and Special Patrol Group’s second Ad
    Hack Manifesto claim is that advertising is “a form of visual and psychological
    pollution”. This echoes artist and subvertiser Darren Cullen’s sentiments in an
    interview about subvertising, when he called removing or replacing advertising
    “an act of tidying up”.$^{14}$ When Sao Paolo Mayor Gilberto Kassab implemented
    the Clean City Law in 2007, it too labelled outdoor adverts a form of “visual
    pollution”.'
  merge: -1
  pgno: 20
- img_proc: false
  md: 'It is certainly true that the average city dweller is confronted by what the
    industry terms Out Of Home (OOH) advertising at a dazzling rate. In the UK, the
    average commuter is exposed to more than 130 adverts featuring more than 80 different
    products in a 45-minute London Underground journey; in an entire day, residents
    of the capital are likely to see around 3500 commercial messages.15


    Subvertisers claim that – just as with other pollutants – the presence of advertising
    in the environment has harmful effects.


    # YOUR EYES READ THIS SILENTLY


    Perhaps one reason a comparison with pollution is apt is the way that advertising
    can accumulate in the environment – a sort of commercial clutter. It is as background
    environmental accumulation that advertising can be most harmful.


    Some advertisers claim that the affect of advertising is benign,16 at the same
    time as claiming it is a powerful form of persuasion; on one hand, nobody notices
    outdoor adverts anyway, and, on the other, it is a multi-billion dollar industry
    that helps to influence our decisions.17 The reason it’s possible to claim that
    “99% of adverts make little or no impact”18 and still sell advertising at an ever-increasing
    rate is that it is precisely as background noise that adverts have their most
    powerful effect.


    Advertising researcher Dr Robert Heath has proven that advertising works on a
    subconscious level, meaning it works'
