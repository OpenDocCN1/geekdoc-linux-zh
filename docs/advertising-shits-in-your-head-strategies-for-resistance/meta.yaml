  md: '# # 3

    ## SOCIETY''S STORY


    > > *"It follows, too, that the masses [...] in the city are subject to manipulation
    by symbols and stereotypes managed by individuals working from afar or operating
    invisibly behind the scenes through their control of the instruments of communication."*²⁷

    >

    > — Louis Wirth


    Advertisers like to claim that advertising only reflects existing cultural values,
    that their ads merely hold a mirror up to the world – any horror we might see
    was already there anyway. While this is certainly true in one sense, subvertisers
    claim that it''s the emphasis placed on certain of these innate values over others
    that''s harmful. Again, the advertisers'' claim to the public that they have no
    real influence appears to be at odds with the claims they make to their clients.


    # ## CULTURAL NARRATIVE


    Our cultural narrative is told in many ways and through many mediums – it is the
    sum of all of these parts that tells our collective story. One of our most important
    spaces for telling that story – public space – is increasingly becoming privately
    owned and dominated by private interests. Jordan Seiler points out that the stories
    that are told by those'
  merge: -1
  pgno: 28
- img_proc: false
  md: 'interests are rarely, if ever, some of "our more interesting goals for ourselves
    as a society, like community, taking care of our children correctly and education".²⁸
    Bill Posters of the Brandalism project echoes his sentiment regarding the dominance
    held over our collective narrative by private interests:


    > "We have always seen culture as the spaces and places where society tells stories
    about itself. Every society has a space where these stories are told and in our
    culture it''s advertising that dominates these spaces (both physical and digital).
    If we want to understand the messages that define (popular) culture then we have
    to look at the main storytellers. In our culture that is the storytellers that
    have the most money — the advertisers."²⁹


    Society both defines that story and is defined by it. The active shaping of our
    cultural values, and the dominance over that shaping by advertising, is an important
    part of subvertisers'' objection to it. In a blog post that Jordan Seiler describes
    as a manifesto, he outlines why he thinks it''s important to interrupt that dominance:


    > "I think it''s important to question the monopolization of our public visual
    environment for commercial concerns and what that means for the determination
    of our collective social agenda. By privileging one type of message over another
    we are, through repetition, setting the terms of our cultural and political discourse.
    Considering the great hurdles we face socially and environmentally, the commercial
    discourse we surround ourselves with not only ignores our current reality but
    actively works against it by distracting us from each other in favor of ourselves."³⁰'
  merge: -1
  pgno: 29
- img_proc: false
  md: 'SOCIETY''S STORY


    # INTRINSIC VS EXTRINSIC


    > "Outdoor ads have become part of people''s day-to-day urban wallpaper... and
    connect everyday ways of thinking to commercial imperatives"³¹


    Anne Cronin


    Subvertisers are not wrong to say that surrounding ourselves by commercial discourses
    has an important impact on our values. It''s a claim that''s supported by research
    into our collective values, and the implications of how advertising acts upon
    them.³²


    Sociologist Joseph Schwartz identified a number of values that occur consistently
    across different countries and cultures;³³ these collective values can be split
    into intrinsic and extrinsic categories (see diagrams overleaf). Values drive
    our behaviors, and studies have shown that placing greater importance on extrinsic
    values is associated with higher levels of prejudice, less concern about the environment
    and weak concern about human rights.³⁴


    It is perhaps not surprising that most advertising is designed to appeal to extrinsic
    values.³⁵ As subvertisers point out, that should be of concern to everyone who
    wants to promote something other than individualistic consumption. This is especially
    the case because an important feature of these values is that they work in opposition:
    if a person has strongly held extrinsic values, this will diminish their regard
    for intrinsic values, and vice-versa.³⁶


    29'
