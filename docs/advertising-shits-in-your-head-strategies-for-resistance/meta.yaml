  md: '> *"We tested the spread-it-around [or "market share"] against market enhancing
    [or "dependence effect"] hypotheses as originally stated by Galbraith. Our main
    finding is that the second hypothesis is preferred by the data."*²¹


    Although human needs may be finite, human desire can be infinite.²² The stoking
    of this desire has seen citizens in the UK take on an unprecedented level of consumer
    debt;²³ to service both our manufactured desires and the debt we take on in a
    never-ending attempt to satisfy them, we''re working more and more.²⁴ There are
