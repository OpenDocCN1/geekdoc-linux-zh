    # WORK MORE, SLEEP LESS


    The advertising industry claims that advertising merely redistributes consumption
    – from one product to another, a perpetual war between brands. Critics of advertising
    claim the opposite is true: that advertising increases overall consumption by
    creating needs. Advertisers claim they’re looking for market-share; critics claim
    they’re expanding or creating markets.


    The most famous advocate of the idea that advertising increases consumption is
    JK Galbraith in The Affluent Society. He argued that there exists a “dependence
    effect” – that once basic human needs had been met more must be manufactured to
    sustain demand in a growth-economy.<sup>20</sup> His assertion has recently been
    proven by researchers Benedetto Molinari and Francesco Turino in their study on
    the macro-economic impacts of advertising:'
