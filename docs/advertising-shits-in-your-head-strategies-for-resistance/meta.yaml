  md: '# 5

    # BANI-SHIT


    One strategy to remove outdoor advertising from cities that has had some success
    is the localised, government-enacted ban. For this reason, the final point of
    Special Patrol Group''s Ad Hack Manifesto makes the claim that outdoor advertising
    both can and should be banned.


    Outdoor advertising bans certainly *can* happen, and there are a few precedents
    for them. In 2007, Sao Paulo enacted the Clean City Law, which designated outdoor
    adverts as a form of visual pollution. As a consequence, 15,000 billboards and
    over 300,000 oversized storefront signs were removed in under a year.<sup>57</sup>
    In 2015, Grenoble, France, became the first city in Europe to ban outdoor advertising,
    and 326 advertising spaces were replaced with community noticeboards and trees.
    The Mayor''s office stated it was "taking the choice of freeing public space in
    Grenoble from advertising to develop areas for public expression"<sup>58</sup>
    (perhaps an explicit reference to the public''s right to the city?).


    To date, these have been the only city-wide outdoor advertising bans, though there
    have been other attempts to trim back the proliferation of outdoor advertising:
    in 2009, Chennai, India banned the erection of new billboards and there are also
    several US States where billboards are'
  merge: -1
  pgno: 44
- img_proc: false
  md: 'banned.⁵⁹ Paris planned to reduce the number of advertising hoardings by a
    third in 2011 and, in 2015, Tehran replaced all of its 1500 commercial billboards
    with art for ten days⁶⁰ (more than doubling Brandalism''s largest citizen take-over
    to date – 600 bus stop ad spaces in Paris in November 2015).


    Though at first glance it may appear that advertising bans are a positive step,
    academic Kurt Iveson questions the rationale for them: where activists may see
    their work as inherently anti-capitalist, he claims the cities that have introduced
    bans may be doing so in order to reassert the dominance of the state. He suggests
    a "ceremonial normative model of public space", which privileges civic order above
    private commercial interests, but also views the public as a passive audience
    for "ceremonial, monumental and architectural displays, which might exercise a
    civilising influence". Outdoor advertising bans are concerned with "the aesthetic
    integrity of the public realm... rather than its democratic accessibility."⁶¹


    Some subvertisers, too, are wary of government bans. Rather than a city-wide ban
    on advertising, Jordan Seiler would prefer spaces to be available for all citizens
    to use: "this should be self-organised, you should just allow public messaging
    and scrawl on the streets. That''s probably utopian, but I think a more viable
    solution would be to create places and structures that would support an open curation
    of some sort".⁶² He also questions the motives behind the bans,⁶³ and points out
    that the ban in Sao Paulo has only been partial: at the same time as the Clean
    City Law'
  merge: -1
  pgno: 45
- img_proc: false
  md: 'was introduced, the city signed a contract with JCDecaux to provide advertising-funded
    bus shelters. By eliminating the haphazard clutter of billboard advertising, it''s
    entirely possible that the Clean City Law will benefit the companies that now
    hold a monopoly on the advertising infrastructure that is slowly being reintroduced
    in a "controlled manner". It eliminates the competition and means that a few big
    companies are once again allowed to dominate.


    Of course, almost all governments are wedded to the capitalist system of production,
    so it seems unlikely they''ll take the decision to ban advertising in order to
    quell consumption. For this reason, direct action remains a vital strategy against
    outdoor advertising.'
