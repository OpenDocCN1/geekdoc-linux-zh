  md: '# # HAPPINESS


    > > "Advertising is not about catering to existing needs, but creating new desires.
    Not only desires, but insecurities as well, because we cannot desire without feeling
    we lack something."²⁵


    Advertising may be exceptionally adept at creating needs, but it is singularly
    bad at meeting them, at making good on its promises. Critics claim that unsatisfied
    needs, even those manufactured artificially, are a cause of unhappiness. Furthermore,
    they posit a new form of cyclical consumerism that follows the “I eat because
    I’m unhappy” model: the more anxious and depressed we are, the more we must consume;
    the more we consume, the more anxious and depressed we become. Left-leaning think-tank
    Compass puts it this way:


    > > "Advertising is the fuel that is driving this system; it persuades us to buy
    material possessions in the quest for happiness — but this is only making us unhappy...
    The goal of advertising then is not the creation of happiness and consumer fulfilment.
    Instead the purpose and consequence seems to be the creation of a mood of restless
    dissatisfaction with what we have got and who we are so that we go out and buy
    more."²⁶'
