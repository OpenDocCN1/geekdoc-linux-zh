  md: '# BRANDALISM


    Bill Posters started his art-life as a graffiti writer, painting on roofs, trains
    and walls as part of a graffiti crew while at university. After becoming more
    politicised by the Iraq War, he ended up writing his dissertation on culture jamming,
    referencing Lefebvre, Klein and the Situationists, and says this acted as the
    “anti-business plan” for what became Brandalism.^113


    The first Brandalism project in 2012 had billboards and consumerism as its target,
    and saw Bill recruit a friend (who is still part of the anonymous Brandalism crew)
    to help with the installs. Though the billboards caught the attention of much
    mainstream media, including a four-minute segment for Channel 4’s Random Acts,
    the billboard twosome quickly realised that they were “just two blokes in a van”.^114
    Since then, their focus has been on empowering others to take their own actions,
    and every campaign since has seen more and more volunteers involved.^115


    Bill Posters sees the work of Brandalism — replacing adverts with art — as a gift.^116
    Unlike advertising, it demands nothing of the viewer, and can be viewed as a two
    way interaction. Internationally acclaimed artists have featured in the Brandalism
    projects — Peter Kennard, Gee Vaucher, Robert Montgomery — but on the street they’re
    presented as anonymous.'
  merge: -1
  pgno: 96
- img_proc: false
  md: '# BRANDALISM 2012 – THE BILLBOARD


    The first Brandalism project happened in July 2012, across five major cities.
    Two installers pasted up 36 large format billboards (48-sheets) with original
    work from 28 international artists. The project was deliberately timed to coincide
    with the “protective brand-mania that characterised the London Olympics”^117 and
    as such gained international media attention, provoking “a discussion about the
    legitimacy of outdoor advertising spaces that we are forced to interact with”.^118


    # BRANDALISM 2014 – THE 6-SHEET


    After realising there were still questions over the democracy of the project,
    Brandalism prepared for round two with a three day training course on both the
    theory and practice of subvertising. Ten “crews” from all over the UK attended
    and helped to select which artworks would be installed on the streets by a process
    of consensus decision making.


    Over two days, 365 artworks were installed in bus stop advertising panels in Edinburgh,
    Glasgow, Liverpool, Manchester, Leeds, Birmingham, Brighton, Bristol, Oxford and
    London. The installs again included work from internationally acclaimed artists,
    but were anonymised.'
