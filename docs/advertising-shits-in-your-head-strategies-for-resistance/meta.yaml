    Further potential for legal action comes from the companies that subvertising
    attacks, whether that''s the brands that are subverted or the owners of outdoor
    advertising sites. In July 2016, 700 adverts on the Brussels metro system were
    replaced with subverts bearing protest messages (against TTIP, the Transatlantic
