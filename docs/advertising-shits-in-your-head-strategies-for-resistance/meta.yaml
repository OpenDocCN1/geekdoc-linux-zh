  md: '# SOCIETY''S STORY


    ![](bbox=[0.1, 0.06, 0.9, 0.92])


    # INTRINSIC VALUES


    +   - **AFFILIATION**: To have satisfying relationships with family and friends.

    - **SELF-ACCEPTANCE**: To feel competent and autonomous.

    - **COMMUNITY FEELING**: To improve the world through activism or socially creative
    projects.

    - **BENEVOLENCE**: Preserving and enhancing the welfare of those with whom one
    is in frequent personal contact (the ''in-group'')

    - **UNIVERSALISM**: Understanding, appreciation, tolerance and protection for
    the welfare of all people and for nature


    # EXTRINSIC VALUES


    +   - **CONFORMITY**: To ''fit-in'' with other people.

    - **IMAGE**: To look attractive to other people in terms of body and clothing.

    - **FINANCIAL SUCCESS**: To be wealthy and materially successful relative to others.

    - **ACHIEVEMENT**: Personal success through demonstrating competence according
    to social standards.

    - **POWER**: Social status and prestige, control or dominance over other people
    and resources.'
  merge: -1
  pgno: 32
- img_proc: false
  md: 'Not only do advertisements place an emphasis on extrinsic values, but by repeatedly
    activating those values, it serves to strengthen them. And we don''t even need
    to be persuaded to buy the product: simply by seeing messages with extrinsic values
    emphasised, we can subconsciously buy into those values.^37^ But it''s important
    to note that everyone, everywhere holds all of these values to differing degrees;
    it''s not that the values themselves are inherently good or bad, simply that they
    have an influence on our behavior.


    Advertisers place the emphasis on extrinsic values: subvertisers want to pull
    the balance back towards the intrinsic.'
