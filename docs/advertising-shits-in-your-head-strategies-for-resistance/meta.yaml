    shell.


    ![](bbox=[0.78, 0.52, 0.98, 0.67])


    **3.** Insert the square key into the lock and turn clockwise 180 degrees. Don''t
    worry if it doesn''t open first time, the mechanism can be stiff. Keep calm and
    keep trying.


    ![](bbox=[0.78, 0.34, 0.98, 0.52])


    **4.** Once the side panel is open, insert one finger into the bottom of the casing
    and slide the metal cover up to reveal the next key hole.


