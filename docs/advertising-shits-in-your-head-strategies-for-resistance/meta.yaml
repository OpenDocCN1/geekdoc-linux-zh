- img_proc: false
  md: '*power to reshape the processes of urbanization. The freedom to make and remake
    our cities and ourselves is, I want to argue, one of the most precious yet most
    neglected of our human rights.*"<sup>50</sup>


    David Harvey


    The right to the city is a concept put forward by French philosopher and sociologist
    Henri Lefebvre, and later expanded by David Harvey. It can be summed up as the
    right to make and remake the spaces in which we live; it stands in opposition
    to corporate or state control of our environment.<sup>51</sup> The right to the
    city means the democratisation of all aspects of our lives within the urban sphere:
    labour, education, planning, etc. Subvertisers start from the aesthetic as a symbolic
    demand for complete control:


    > "We asked ourselves the question: what can we as a global network of citizens
    do to challenge the cultural pessimism arising from the power of consumerism?
    How can we facilitate the reclamation of our right to the city and the revolution
    of everyday life?"<sup>52</sup>


    Almost all practioners talk about reclaiming public space.<sup>53</sup> Public
    space is a contested term, and it''s questionable whether there has ever been
    a truly public space to which we can return; however, it may be possible to *create*
    a public space, and subvertisers have been vocal about what that might look like.
    This is one possible vision of a public space from Bill Posters:


    > "Public space is an arena in which no single authority should reign and multiple
    voices should be heard, so we started from a'
