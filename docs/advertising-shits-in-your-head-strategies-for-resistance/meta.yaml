  md: '# THE EDGE OF APOCALYPSE


    It is further claimed that passive participation in a system that demands nothing
    more than unquestioned consumption may be taking a devastating toll in terms of
    environmental destruction. Subvertisers follow Sut Jhally (quoted at the start
    of this chapter) when they claim that advertising is fuel for the capitalist system,
    a system of exponential growth and ever-increasing consumption on a finite planet.
    Brandalism performed their largest ad-takeover to date – by installing over 600
    posters in bus stop advertising spaces – in protest at the COP 21 climate talks
    in Paris. Bill Posters of Brandalism explains their targeting of the climate talks:


    > "We are taking their spaces back because we want to challenge the role advertising
    plays in promoting unsustainable consumerism. Because the advertising industry
    force feeds our desires for products created from fossil fuels, they are intimately
    connected to causing climate change. As is the case with the climate talks and
    their corporate sponsored events, outdoor advertising ensures that those with
    the most money are able to ensure that their voices get heard above all else."^1


    It''s not that propaganda, public relations, advertising or the intersections
    of all three are inherently evil; it is rather that the system they have been
    so adept at promoting throughout the twentieth and twenty-first centuries is responsible
    for economic crises, resource wars, widening inequality and, perhaps most alarmingly,
    environmental destruction on a global scale. Subvertisers can justifiably argue
    that propaganda is, once again, marshalling millions to their deaths.'
