  md: '# 4


    **RIGHTS TO THE CITY**


    > *“Under these conditions, ideals of urban identity, citizenship and belonging
    – already threatened by the spreading malaise of a neoliberal ethic – become much
    harder to sustain.”*⁴⁰


    David Harvey


    # **WHO OWNS WHAT WE SEE?**


    Founder of the modern public relations industry, Edward Bernays, is by no means
    the only person to recognise that “the tendency of big business is to get bigger”.⁴¹
    This is certainly true in the outdoor advertising industry, where a handful of
    companies now dominate the landscape. And this is true both in terms of the companies
    that own those spaces, but also in terms of the companies that can afford to occupy
    them.⁴²


    One member of the Special Patrol Group (SPG) tells a story about one of the first
    times they went out to do ad-takeovers on the London Underground. As they were
    slotting a subvert over the original ad in an ad-space, a commuter interjected
    and flustered at them: “You want arresting! Why don’t you just pay for your advertising,
    like everyone else?” It serves to illustrate both the perceived'
  merge: -1
  pgno: 36
- img_proc: false
  md: '# ADVERTISING SHITS IN YOUR HEAD


    sanctity of the private nature of these public spaces – that anyone interfering
    with them should be arrested – and also the misconception that these spaces are
    somehow open to all.⁴³ The very reason the SPG were using subverts is because
    not everyone can afford to pay to occupy them.


    A common stated motivation for the modern subvertising movement is the ubiquity
    of outdoor advertising and the monopoly held over public space by private interests.⁴⁴
    The industry uses its ubiquity to sell outdoor advertising: the internet has broken
    the monopoly on people''s attention that television used to hold, but the urban
    landscape is still a space through which everyone must inevitably traverse. Subvertisers
    want to reclaim that space for all.


    # PRIVATE PUBLIC SPACE


    An important part of how this dominance has been achieved is through the private
    ownership of public provision – particularly public transport provision.⁴⁵ The
    advertisers have literally written their names on things that are supposed to
    belong to everyone. Capitol Outdoor boasts on its website: "Outdoor advertising
    [...] incorporates your targeted branding message into the everyday landscape
    of commuters and becomes part of the very fabric of the living and working environment
    where it is placed."⁴⁶ Clear Channel Outdoor, too, are open about their motives:
    "When brands advertise on our street structures, they become part of the public
    social space, entering people''s thoughts and conversations."⁴⁷'
  merge: -1
  pgno: 37
- img_proc: false
  md: '# RIGHTS TO THE CITY


    The private ownership of public infrastructure is a worrying tendency, because
    it inevitably leads to provision based on potential for profit rather than public
    utility (or other non-economic notions) which, in turn, further cements the idea
    that only the profitable is imaginable on our city streets. The inverse corollary
    of this trend is the provision of useless street-furniture, the sole function
    of which is as a site of advertising. Jordan Seiler describes the pointless proliferation
    of public phone boxes in New York City:


    > “I think we have about 20,000 of them, which means 60,000 ads changing every
    month. They are simple to get into and it’s just a ubiquitous form in NYC that
    people don’t even use for their phone calls. They are just advertising venues
    at this point, because everybody has a cell phone.”<sup>48</sup>


    One of the reasons private provision of public infrastructure may be tolerated
    is that the public imagines the cost is shouldered by the beneficent provider,
    which represents a saving to the public purse. But advertising spend increases
    the cost of the products advertised, and that cost is ultimately passed on to
    the consumer. There is no such thing as a free bench.<sup>49</sup>


    # RIGHTS TO THE CITY


    > “The right to the city is far more than the individual liberty to access urban
    resources: it is a right to change ourselves by changing the city. It is, moreover,
    a common rather than an individual right since this transformation inevitably
    depends upon the exercise of a collective'
