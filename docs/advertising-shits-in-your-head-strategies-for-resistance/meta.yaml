    is "acting as though you''re already free"98 and it is in this spirit that Jordan
    considers the law:


    > "I don''t think of what I do as illegal, I think it''s a valid form of protest.
    It is technically illegal, but not all laws are just. There''s a history of property
    disobedience and violence against property, that''s accepted because property''s
    not a person, but because in a capitalist system we privilege property so heavily,
    it''s taken seriously."99


    In France, subvertising group Les Deboulonneurs100 use the tactic of deliberately
    getting arrested for their actions in order to have a conversation about the harms
    caused by advertising in court. They use the defence of necessity, claiming that
    their actions are necessary, and therefore lawful, because they prevent a greater
    crime. Traditionally it has been dismissed in court, but on 25 March 2014 a French
    judge agreed that their actions were indeed lawful and acquitted the group of
    all charges.101 For this reason, 25 March has been declared an international day
    of action against advertising by international subvertising groups.


    London-based subvertisers Agit Art Works produced what they say is a "get-out-of-jail
    free card",102 based on the justification defence of lawful excuse. They point
    out that the intent of the act is what defines criminal damage, not the act itself
    – so if it is your honestly held belief that your'
