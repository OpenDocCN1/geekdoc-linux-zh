  md: '# BRANDALISM 2015 - PARIS COP21


    The Paris project was in support of protests against the COP 21 climate conference
    and attempted to make the connection between advertising, consumerism and environmental
    destruction explicit. In particular, the project took issue with what they saw
    as “greenwashing” of the climate talks:


    > “Increasingly, these talks are dominated by corporate interests. This year’s
    talks in Paris are being held at an airport and sponsored by an airline. Other
    major polluters include energy companies, car manufacturers and banks. Brandalism
    aims to creatively expose this corporate greenwashing.”¹⁹


    The Brandalism crew – numbering six British operatives – were in Paris for two
    weeks leading up to the day of the action, in a squatted warehouse turned print-studio,
    printing the 600 posters that would eventually be installed. During this time
    they also made tools for accessing Parisian bus stop cabinets and trained local
    teams in the art of installs. Despite Paris being under a state of emergency because
    of recent terror attacks, which meant that all street protests had been banned,
    Brandalism pulled off their biggest take-over to date and garnered international
    mainstream attention for their efforts.'
  merge: -1
