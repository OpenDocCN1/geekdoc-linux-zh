  md: '# # SPECIAL PATROL GROUP


    Special Patrol Group (SPG) are thought to be a shadowy, militant wing of STRIKE!
    Magazine. They are named after the now disbanded police unit that was notoriously
    responsible for the death of activist Blair Peach and their first actions were
    taken against the Metropolitan Police Force.


    Based in London, England, their early work was centred around taking designs from
    STRIKE!’s pages and installing them in bus stop six-sheet spaces, billboards and
    London Underground ad spaces. In 2015 they were part of Banksy’s Dismaland exhibition,
    where they gave demonstrations in bus stop hacking and also made their Ad Space
    Hack Pack available.


    More recently they’ve been been designing and installing subverts on behalf of
    other campaigns – including Netpol, the Heathrow 13 climate group and Veterans
    for Peace.


    # # TOTAL PROPAGANDA


    The first campaign by the Special Patrol Group was an action taken against the
    propaganda of the Metropolitan Police Force’s “Confidence Campaign” – a hyper-localised
    poster marketing campaign in “areas with low confidence in the police”. On 12
    December 2014, three designs were installed in around 30 sites in London –'
  merge: -1
  pgno: 118
- img_proc: false
  md: 'including outside New Scotland Yard, headquarters of the British Police Force
    – mimicking the police’s own posters, but with more honest messaging. The tagline
    was Total Propaganda, a subversion of the Met’s Total Policing slogan. The designs
    highlighted: institutional racism; the killing of Mark Duggan; and unfair cannabis
    laws. The bus stop installs went viral and were featured by several major news
    outlets.


    The Met did another round of confidence campaign posters in spring 2015, and the
    SPG again responded with their own campaign. This time they focussed on deaths
    in custody, police corruption and the amount of public money the Met spent on
    their own campaigns:


    > “The Metropolitan Police Force spend ridiculous sums of our money trying to
    convince us – and themselves – that they’re not violent, racist and corrupt. In
    2012 it was £,12.6m and in 2013 it was £,9.3 – in two weeks alone last year they
    wasted nearly half a million pounds of public money on pointless poster campaigns.”121


    For both campaigns, downloadable versions of the design were made available through
    STRIKE! Magazine’s blog, in an attempt to help people inspired by the campaign
    do their own subvertising.122


    # BULLSHIT JOBS


    On the first day back to work after the Christmas break for most - 2nd January
    (2015) - quotes from David Graeber’s article ‘On the Phenomenon of Bullshit Jobs’
    – which'
  merge: -1
  pgno: 119
- img_proc: false
  md: '# SPECIAL PATROL GROUP


    questioned the nature of work under capitalism – were inserted over regular ads
    on the London Underground system. The installs went viral and were covered by
    several news outlets, including Russia Today who interviewed David Graeber about
    his article.¹²³ This follows a trend of linking their subvertisements back to
    articles or theory that explain the SPG’s actions.


    # DON''T VOTE!


    Two weeks before the 2015 UK General Election, the Special Patrol Group – whose
    work is informed by anarchist theory – installed designs questioning the voting
    system in bus stops around London. The three designs read: Don’t Vote: Engage
    With Politics!; Don’t Vote: Spoil Your Ballot!; and Don’t Vote: Take to the Streets!
    The posters featured a url that links to a page debunking the voting system and
    giving reasons why citizens should boycott it. An anonymous member of the Special
    Patrol Group gave an interview explaining the action to Huck Magazine.¹²⁴


    # DISMALAND & DSEI


    The Special Patrol Group were invited to be part of Banksy’s Dismaland exhibition.
    On site they gave tutorials in subvertising to visitors, using a bus stop ad-cabinet
    that had been installed for this purpose. They also made available the Ad Space
    Hack Pack (for £6), which included a H60 Allen Key, a T30 Security Torx and a
    4-Way Utility Key, as'
  merge: -1
  pgno: 120
- img_proc: false
  md: 'well as a guide on how to use them (originally designed by Brandalism). Over
    2000 sets were sold during Dismaland’s five week run.


    During the course of Dismaland, the Defence and Security Equipment International
    (DSEI) exhibition – an arms fair that is widely protested every year – happened
    at the Excel Centre. Artists from Dismaland – Darren Cullen, Matt Bonner, STRIKE!
    Magazine and Barnbrook Studio – created designs that were installed in bus stops
    around London and on London Underground advertising spaces. Over 300 designs were
    installed and the action was featured by several major news outlets.¹²⁵


    # GLASTONBURY 2016


    Special Patrol Group were invited by Shangri-La to be part of Glastonbury Festival.
    An advertising cabinet was brought on site as part of a bus stop installation,
    which featured subverted brand designs claiming “Advertising Shits in Your Head”.¹²⁶
    The group also used the festival to launch their international Ad Hack Manifesto.
    When Glastonbury ended, the group installed the cabinet in DIY Space for London
    where it is used for training others in the art of bus stop hacking.'
