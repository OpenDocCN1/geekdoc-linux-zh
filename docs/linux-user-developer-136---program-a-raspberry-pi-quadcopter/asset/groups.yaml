    ## 开源


    您的 Linux 新闻与观点来源


    ## JON MASTERS


    ## 内核专栏


    随着 3.13 开发最后阶段的结束以及 3.14 开发周期的开始，Jon Masters 总结了 Linux 社区的最新动态。当然，这是一个持续的过程，其中大多数功能已经成熟并存在于各个子系统的开发树中。这些功能中的大部分一部分已由
    Stephen Hahn 在 ''linux-next'' 合并树中处理。其余部分已经在某些地方经过了测试，但在 3.14 中不会有任何尚未发布说明的新代码进入。


    针对潜在利用的另一个论点通常是，攻击者在入侵系统后可以删除日志，这是一个微小的操作，会使其毫无价值。后者可以通过实时日志和其他防止攻击者破坏日志的功能来轻易应对，这些功能通过断言来确保只有安全问题会被删除。Jon
    Masters 是一位拥有 18 年 经验的 Linux 黑客，他曾就读于剑桥大学，目前任职于企业供应商。他在 kernelmasters.com 发布每周邮件列表。


    ## 已知漏洞检测


    Vegard Noisson 提交了一项名为“已知漏洞检测”的补丁提案。由于不同的内核版本对可能损害系统的不同代码序列敏感，因此可以将命名的“利用”放置在内核中添加修复程序的地方，从而在内核被补丁后防止利用。捕获利用的通知也令人厌烦，Vegard
    喜欢大多数成功的尝试通常是微小操作——系统虽然获得了 root 权限，但在日志中没有迹。


    Linux 3.13 候选版本 (RC8) 表示“并不特别可怕”，这意味着在我们读到此文时，RC8 可能已经发布。Jon Masters 引入了针对（通常是）RC8
    合并窗口（针对 Linux 3.14）的工作，因此无论是否需要下一个 RC8。现有的内核没有提供这种机制。那么它们要么会对用户添加或删除的某些更改产生漏洞。事实上，确实存在一些反对意见，因为这似乎可能导致内核随着时间的推移包含大量的注释。总的来说，对于
    Keith Cook 这样关注 Linux 社区安全问题的经理来说，日志机制是简单且有效的。他确保了这种利用（或类似的利用）被添加的可能性非常小。


    ## 进行中的开发


    针对即将到来的 3.14 开发周期的功能开发，Miklos Szöllosi 展示了 ''rename'' 系列补丁的第3 版本。这是一个新功能（有时被称为
    ''renamed''），其行为与 ''rename'' 系统调用类似，但有一个名为 rename flags 的额外参数。这个额外参数涉及 rename
    概念，它允许（例如）将目录树与符号链接进行交换。


    ## 观点


    内核专栏 - Jon Masters


    ## 开源


    “大多数黑客在成功之前会尝试多次利用”


    从原子性来说，这意味着运行的程序看到的两个组件要么是在它们被交换之前，要么是在没有办法看到不稳定状态的情况下（这需要使用一系列调用，通过先拆毁项再重建它们来模拟）。Masters
    计划将 rename 引入下下一个 Linux (3.14) 内核中，作为未来覆盖层（overlays）的依赖。这避免了使用复杂的指令 `#pragma once`，它允许将经典的头文件守符宏替换为更优雅的内容。`#pragma`
    特殊代码序列被称为“包含保护”（include guards），因为它们的设计是为了确保头文件在条件预处理器指令中仅被包含一次。其他现代编译器更优雅，但标准性较低，因此更容易出错。


    切入正题，交叉重命名（cross-rename）对于叠加文件系统非常有用，它可以将两个文件系统合并为一个虚拟文件系统，通常用于“实时”系统，在这些系统中，只读根文件系统由辅助空间（另一个文件系统）修改，该空间是只读文件系统与数据之间的差异


    ## 官方 One Fund 2014年波士顿马拉松团队成员


    Jon Masters 将作为 One Fund Boston 的成员之一参加 One Fund 波士顿马拉松，为去年受影响的人筹集资金。他需要像你这样的朋友帮助支持他的筹款，可以在此处捐赠：bit.ly/1dum06


    新文件被添加到内部叠加层，或者项的删除或替换被标记为“白出”（这是世界的祖先），使用像 TipEx——一种在点上覆盖文字的物质这样的名称——白出项忽略某个项文件并使用替换项（来自叠加层）。通过使用交叉重命名，叠加文件系统可以原子地呈现文件系统的视图视图，或者使用
    EZZF 格式的空白空间利用。由于缺乏支持它的工具，目前无法恢复遗留数据，除非使用 2 个文件系统之一进行


    最后，本月的奖授予 Steven Rostedt，感谢他提出的允许内核访问的建议。然后如果有人尝试在普通账户中。David Jones 指出内核终于修复了对新
    `bz2` 存档的支持。使用 `gz` 文件格式以及 `xz` 文件格式，提供了更高效


