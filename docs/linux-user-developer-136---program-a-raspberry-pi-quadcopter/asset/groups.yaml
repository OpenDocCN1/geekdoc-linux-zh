    # 欢迎

    阅读 Linux User & Developer 第 136 期


    Rob Zetsloot 在大学学习航空航天工程，使用 Python 在课堂上对复杂系统进行建模。136 期有幸采访了 Monopoly Linux 创者
    Geoff Sutton 关于 Steam 的，从第 18 页开始的精彩专题报道。


    # 每期都让 Linux User 更加便宜 第 26 页


    Tom Ham 自 1985 年起进入 IT 行业，担任过记者、导师和科学类作家。从那时起他见证了移动游戏的各个方面。Tom 将继续介绍本期中涉及的“代码类”游戏。


    Mihals Tukacos 是一位拥有编程和数学经验的 UNIX 系统管理员。他自 1996 年起一直使用 Linux。Mihals 在第 48-53 页展示了如何使用
    GIMP 制作照片。我们在接下来的几个月也会回顾这个主题。


    - Steam OS 揭秘

    - 掌握 Twitter API

    - 使用 Qt 操作文件

    - 编写树莓派程序


    Michael Reed 是一位技术作家，编写 Linux 相关文章已有 15 年。他专攻 Linux 开发和开源。在第 136 期中，Linux User
    老兵 Michael Reed 展示了如何将文档批量转换为 PDF 的过程。你可以


    Jon Lister 是一位内核开发者，在 Linux 领域已工作了 18 年，从 13 岁上大学起开始。Jon 与独立内核开发者 Thomas 会面，并为一家大型企业
    Linux 供应商工作。


    Gareth Halcliffe 是我们的记者，从第 12 页开始带我们了解开源生态系统的最新进展。下期 Linux 将详细讨论 UEFI 和开源。


    欢迎阅读 Linux User 最新版，这是英国和非洲最喜爱的开源杂志。看来我们的树莓派项目在读者中大受好。。打算在不久的未来构建另一个机器人。Andy Baker
    来自 linuxstuff.co.uk 展示了如何向你的树莓派项目添加四个旋翼，这比你想象的要科学得多。他在从第 56 页开始的精彩文章中解释了树莓派 PID。


    我们还有幸与 Monopoly 创者、全能行业传奇 Geoff Sutton 坐谈 Steam Alchemist。我们还可以从第 18 页开始的大型专题中找到更多关于
    Steam Alchemist 的评测。享受本期内容！


