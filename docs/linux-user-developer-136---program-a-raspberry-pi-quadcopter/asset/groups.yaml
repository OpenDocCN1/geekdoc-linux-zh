    # Linux 用户树莓派聚会 - 2014年4月5日


    英国首个南岸聚会活动确认


    《Linux 用户与开发者》杂志将举办其历史上首次的“树莓派聚会”（Raspberry Jam）。该活动将于 2014 年 4 月 5 日在多塞特郡普尔的
    RNLI 举行。


    届时将为 120 名树莓派爱好者提供空间，让他们与其他编码人员和创客者聚在一起，学习并分享关于他们项目的想法。


    活动将涵盖来自树莓派世界的专家演讲、与会者可以在其中学习编程和制作项目的工作坊，以及创作者可以分享其最新树莓派作品的展示分享环节。


    Linux 用户树莓派聚会面向于所有技能水平的爱好者，并且对于不想自带设备的参会者，现场将提供足够的树莓派供使用。


    > Linux User 编辑员 Russell Barnes 表示：“我们 Linux User 是树莓派的忠实粉丝，因此我们非常期待在首届树莓派聚会上与其他爱好者聚在一起。”


    活动将为所有年龄段的粉丝准备丰富内容，有许多精彩的项目演示和挑战等待大家体验。


    活动门票现已出售（成人25 英镑，18 岁以下参与者免费），可通过 Eventbrite 网站 www.eventbrite.co.uk 购买。如需活动更新，请在
    Twitter 上关注我们 @LinuxUserMag 或访问我们的主页 www.linuxuser.co.uk。


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_9_0.png)


    # 新闻

    Linux 社区最新动态


    ## 开源与安卓


    ### 谷歌加入开放汽车联盟


    希望在今年年底前主掌方向


    广告巨头谷歌宣布与半导体和汽车行业资深企业 NXP、奥迪、英特尔、通用和现代建立合作伙伴关系，加入开放汽车联盟（Open Automotive Alliance,
    OAA）。


    OAA 旨在复制 Android 的成功，鼓励基于 Linux 的 Android 操作系统及其由 Google 控制的生态系统应用于车载娱乐系统，一个新平台将于今年年底发布其首批产品。


    “OAA 致力于让开发者能够创新，让汽车技术对每个人来说更安全、更直观，”该集团的创始声明声称。“这种开放开发模型和通用平台将允许汽车制造商轻松将尖端技术带给驾驶员，并为开发者创造新机会，以安全且可扩展的方式为驾驶员和乘客提供更强大的体验。”


    “数百万人已经熟悉 Android 并每天都在使用它，”Sundar 在发布会上说。“Android 平台扩展到汽车领域将把移动技术整合到汽车中，为驾驶员提供熟悉的、无缝的软件体验。”


    此举是谷歌内部生产全自动驾驶车辆的研发工作，该公司已拥有其工作原型。


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_10_0.png)


    谷歌的开放汽车联盟希望将 Android 从口袋带到多年来的仪表盘上。这些是基于 Google Chauffeur 的一个原生深度集成到汽车基础设施中的软件平台。相比之下，OAA
    的 Android 版本将限于仪表盘的娱乐和导航系统。


    ## 硬件


    ### Linksys WRT54 在 Belkin 旗下重生


    开源路由器获得 21 世纪新面貌


    流行的 Linksys WRT54G 路由器（OpenRouter 发行版的诞生石）已被新所有者 Belkin 更新并重新发布为 WRT1900。


    2002 年，该路由器因被发现违反其操作系统所属的 GPL 许可证而给其创建者 Linksys 造成了巨大的头疼。2003 年，公司发布了源代码——直接导致了固件方面性的爆炸式增长，并增加了新的功能和能力。


    其替代品 WRT1900AC 保留了原始设计的蓝黑色调，但现在采用了双核 1.2 GHz 处理器、四根天线、双频（5GHz 和 2.4GHz WiFi）、四个千兆网口以及
    SATA 和 USB 3.0 连接。


    自那时，Belkin 还为 OpenWrt 社区提供了源代码、开发工具包和编程接口。在写作时，WRT1900 在英国的供应和价格尚待确认。


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_10_1.png)


    第二象限生产

    对 PostgreSQL 的支持提供 15 分钟（人工）响应，4 小时周转并保证在 24 小时内修复。每天 24 小时，每年 365 天。

    我们将保持业务活力。


    ![](img/5ff17f6022f06afb_10_2.png)


    # 开源

    Linux 新闻与观点


    ## 开源专栏


    ### 一个委员会的希望

    2013 年 12 月，慕尼黑完成了一项始于十年前的计算机系统迁移到免费软件的过程，声称节省了 1000 万英镑……


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_11_0.png)


    ### IT 演进

    慕尼黑（注：此处原文可能误写为 LiMux）这种德语发行版希望为其他政府铺平道路。


    即使是最小的组织也与遗留产品和难以绕过的流程有关。开放 API 和接口提供了长期灵活性、数据完整性和可访问性，这在随机使用数据库 .NET 和 VB 脚本之后才能实现。正如许多组织，慕尼黑的
    IT 系统多年来一直是根据部门逐个演变的，结果是委员会的 IT 部门负责各自的运营，通过不同的优化流程，没有标准和巨大的数据管理。


    Richard Hill 关于艺术、音乐、数字权利以及各种出版物的免费软件。


    Florian Schebel 注意到，LMux 是世界 IT 分发的一个小镜像。通用用户硬件管理。用于软件发行和管理的不同工具。超过 300 个应用程序，许多是冗余的，例如
    FrontPage、Fusion 等，用于 HTML 编辑。


    将城市的计算机系统从 Windows 迁移是一个漫长的过程，但否认 Linux 的使用很奇怪，不同版本的 Windows 迁移带来了问题；碎片化数据或冗余应用程序以及过程本身。并没有改变。


    然而，微软甚至更促使慕尼黑在 2013 年进行了一项研究显示了约 1700 万英镑。慕尼黑 IT 服务供应商 Julia Kreys 反驳说，系统质量“很糟糕”，她不会作为一个研究项目发布。行政部门利用机会重新构了数据。


    www.linuxuser.co.uk


    # 观点

    Linux 社区最新动态


    ## 开源专栏


    仅仅因为旧游戏是免费的，我们就不应该在某人这样做时对其感激多年……


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_12_0.png)


    客户端、不同的补丁级别、安全概念。完整的问答分解可以查看。但复杂性会产生数据。数据并非基于任何明确的低效率会渗透进来，更多问题层层叠加。尽可能地，重新对齐计算机系统提供了一个收回我们可以使用的数据并避免痛苦的回报的机会，从长远来看，免费桌面工具的实施没有实际利益，也是一个开始并结束的过程的源头。这并不难隐藏：复古游戏和更现代的游戏多年来已经在网页浏览器中免费可用了。问题是，大量的发行商选择了视而不见，而不是免费提供给他们关心的玩家。


    最近，越来越多的发行商对他们的作品更加保护。在一个所有游戏都只需几英镑即可免费获取的时代，曾经愿意提供旧游戏的发行商现在会想他们多快可以将它们翻新并标记在网络各地。


    > Simon Berry 是一位跨越 Linux、Mac 和 OS 平台的技术作家和编辑。我是那种寻找档案及其历史的人。游戏玩家也是那类非常了解档案领域的人，无论他们是否进入过其中。对于大多数组织来说，从
    Windows 移动到 Linux 的首要原因是感知到的成本节省。但还有互操作性和标准的通用性，这带来了更长期的利益。解锁数据和资源可能意味着短期内失去时间并消耗成本，但这样做会带来昂贵且高效的结果。


    宣布一系列 70 年代和早期视频游戏已在网页浏览器中免费，其中一些是档案启动“控制机项目”的最新工作。Linux 现在可以从收藏中获得五个控制机的游戏，Magnav、Odyssey
    和 Asteroids 也是免费的。


    市政府、其他德国委员会、Linux 社区和其他利益 LMux 的回报之一。LMux 是一种通用 Linux 发行版已被德国政府批准为官方发行版。慕尼黑的工作可能是最好的。免费游戏可以在
    archive.org/details/console 查看，点击任何你喜欢的项目，不要让它们让你困扰。


