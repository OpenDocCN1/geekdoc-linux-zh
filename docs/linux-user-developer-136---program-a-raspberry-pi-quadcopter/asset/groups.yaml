    # Welcome

    to issue 136 of Linux User & Developer


    Rob Zetsloot studied aerospace engineering at university, using Python to model
    complex systems in class. Issue 136 had the great pleasure of talking to Monopoly
    Linux creator Geoff Sutton about Steam for his excellent feature expose starting
    on page 18.


    # Get Linux User cheaper every issue Page 26


    Tom Ham has been in the IT business since 1985, working as a journalist, tutor
    and author of science. He has seen every aspect of mobile games since then. Tom
    continues with ''code'' games he deals with in issue.


    Mihals Tukacos is a UNIX system administrator with experience in programming and
    maths. He has been using Linux since 1996. Mihals shows how to make a sample photo
    using GIMP on pages 48-53. We review the topic in coming months, too.


    - Steam OS revealed

    - Master the Twitter API

    - Manipulate files with Qt

    - Program a Raspberry Pioder


    Michael Reed is a technology writer, and he has been writing about Linux for 15
    years. He specializes in Linux development and open source. For Issue 136, Linux
    User veteran Michael Reed shows how to automate the process of mass-converting
    documents to PDFs. You can


    Jon Lister is a kernel developer who has been working for Linux for 18 years,
    since attending university at age 13. Jon meets with independent kernel developer
    Thomas and works for a large enterprise Linux vendor.


    Gareth Halcliffe is our reporter and brings us the latest developments from all
    over the open ecosystem starting from page 12. Next issue Linux will be speaking
    extensively about UEFI and open source.


    Welcome to the latest edition of Linux User, the UK and Africa''s favourite open
    source and Linux magazine. So it seems our Raspberry Pi project was somewhat of
    a hit with our Raspberry-Pi readers. We intend to build another robot point in
    the near future, we decided to try Raspberry Pi skills slightly different from
    this. Andy Baker, of blog.linuxstuff.co.uk shows how to put out a Pi in our six-page
    coding that adding four rotor blades to your Raspberry Pi project is much more
    like rocket science than you might think. Master PIDs explained with his project
    code in the excellent article starting on page 56.


    We also had the pleasure of speaking of a true legend of computer game development
    this month. We sat down with Monopoly Linux creator and all-round industry legend
    Geoff Sutton on Steam Alchemist. We can also find that and more with a review
    of Steam Alchemist in our big feature starting on page 18. Enjoy the issue!


