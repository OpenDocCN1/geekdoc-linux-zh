  - '[PAGE 29]


    # # Tutorial Install and dual-boot SteamOS


    When it finishes, a menu with few options will appear. Use the arrow keys to Reboot,
    and you will be sent straight to SteamOS.


    # # 15 Partitioning SteamOS


    If you have your CD or stick with your other drives, add it to your system. Reboot
    and choose it from the boot menu, or reorder the boot menu. SteamOS will have
    itself first in the order, but this shouldn''t be a problem. Change the boot order
    to Ubuntu. Launch and then scan the disk. You''ll notice that a single, large
    partition at the end of the disk is the storage partition, where all the games
    are stored.


    # # 12 Unsupported graphics


    You might run into problem with a black screen. This will happen if you don''t
    have supported graphics cards, but there is a quick and dirty solution. Make sure
    to halt the boot process by pressing any key or down arrow on the keyboard when
    starting up.


    # # 13 Boot options


    In the boot menu, press e. The boot options will be displayed on the screen -
    when it says ''notfound'' in the boot options and delete it. Press F10 and you
    should boot into SteamOS in BIOS mode automatically. We''ll cover a more permanent
    solution as we dual-boot with other.


    # # 14 Reattach original hard drive method


    If you use the dual hard drive method to dual-boot, now is the time to pick the
    original hard drive. To boot into it, choose this hard drive from the boot menu
    and follow the steps to update GRUB later in the tutorial.


    # # 10 Finish


    Exit Steam, log out of the session you''re using. Then enter **desktop** as the
    password. Open up a terminal again and type:


    ```

    /post_install.sh

    ```


    It will ask for a password: enter desktop and press enter. It will automatically
    reboot after a moment.


    # # 11 Recovery process


    After the reboot, the system will perform an automated recovery to complete the
    installation. When it works, let it do its thing.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_0.png)


    # # 16 Making space


    You can shrink the storage partition as much as you want - however, remember that
    this limit how many games you can install in SteamOS. Any other distro will require
    at least 20GB to install, but you cannot share space between them, so keep that
    in mind.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_1.png)


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_2.png)


