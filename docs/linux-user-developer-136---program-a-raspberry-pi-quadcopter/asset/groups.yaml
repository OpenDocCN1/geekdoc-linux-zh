    # # Questions & answers


    All your technical problems solved


    Q/A


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_90_0.png)


    +   * Remote work is useful for many tasks


    Windows to remotely access machines, it offers a lot of flexibility, and I was
    wondering if any remote desktop clients for Linux have the same sort of features?

    One of the features we really liked is the central server that handles all the
    requests. Are there any services or clients that can replace this for us?


    write permissions for a group. This is how I use the NFS. First, create an account
    on the server. Then create a group and add all the users to the group, and then
    set the permissions for the folder and file on the mounted NFS server.


    Anna


    For basic desktop usage, using Linux feels like coming home. It has a lot of customisation
    features, can detect active systems on the network, and has many systems and settings
    for each purpose.


    File permissions can cause a headache on a network file system


    I must also mention that users are users who do not know/care to change permissions;
    they might want to put a file on NFS and have it work automatically. Setting permissions
    before putting them on the mounted NFS is no-go (unless you like that system,
    which depends on user behaviour).


    When it comes to central servers, you have to get a bit creative. We use SSH tunnels
    for most things, or OpenVPN and have to reroute traffic over the internet, and
    then use some scripts to set up the connection.


    All users are in one group, let us call it ''for'', and each user has his or her
    profile in the home directory.


    Example of: /etc/fstab


    Charlie


    Well, there are plenty of things to tell. A cron job could be created to just
    chmod on a regular basis - absolutely not necessary and will cause unnecessary
    server load, it''s perfect.


    Although it is not open source, there is also TeamViewer, which works on a network
    of Linux distros. Make sure there are prepared for problems in your system before
    you get it go, though.


    BUT, if you use a file via Samba, for example, and then file lands on the server,
    you can''t put files on NFS, other users can''t use it at all because of the permissions.


    Otherwise, if you want to use a user folder for first file, you can do some permissions
    tweaking. This will result in the file being owned by the user and not having
    the correct permissions. You can do that without


    ```

    /var/192.168.1.100/no_subtree,check_all,all_anonid,anonid=1001

    ```


    # # Network setup for work


    I have a problem with NFS regarding permissions when copying a file that has no
    read/


    What I did was use some kind of umask that will force default permissions on a
    file being copied to NFS. Which, means users put that file on NFS, NFS users have
    permission to read and write for group, and it corrects it. Use umask sets for
    a newly created file.


    ```

    # chmod gws /home/user

    ```


    Alternatively, you could switch the system to Samba, although of course that could
    take a while to get properly up, depending on the network.


