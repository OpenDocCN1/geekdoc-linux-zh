    ## 5. 回家了 (Gone Home)


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_24_0.png)


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_24_1.png)


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_24_2.png)


    ▲ 作为早期 Kickstarter 的成功案例，《FTL》是 2012 年独立游戏的宠儿之一。作为一款太空策略游戏，《FTL》让你指挥一艘快速返回总部递送叛军计划的星舰。你在管理珍贵资源的同时，管理许多敌对太空区域。游戏很难，具有类
    Rogue 特性，地图是随机生成的。由于是单生命且随机生成，这对玩家来说非常有回报，因为游戏有多个地方让你想要停留。更高的难度等级和不同的班次改变了游戏的玩法，这意味着在完成之前将花很长时间。


    ▲ 《Fez》是上述益智平台游戏之一——一个简单的平台游戏，强调在途中完成的谜题。像《超级肉肉男孩》一样，它最初发布在 Xbox Live，并于去年移植到
    Linux。《Fez》的核心是一个简单的概念，通过挑战具有挑战性的平台和物体，让 Gozo 穿越世界并进入新区域。一点谜题有助于你在探索世界的每个区域时移动。看到真正的结局需要一些惊人的脑力挑战，使它成为过去几年最有成就的游戏之一。


    ▲ 《回家了》是那些扩展了视频游戏定义的的作品之一。它最恰切的描述是一个互动小说，玩家以第一人称控制一个回到童年之家的女性。在那里，她的姐姐留了一张值得关注的字条。游戏让你搜索角色的背景故事，并为可玩角色揭示新事实。这些故事通过游戏进行探索，以第一人称游戏玩过它使其成为极具沉浸感且必不可少的体验。它使用
    Unity 构建，允许轻松部署到 Linux。


