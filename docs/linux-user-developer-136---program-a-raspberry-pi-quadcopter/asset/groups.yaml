    \ Flask 可以提供静态文件或使用渲染模板，为了简单起见，我们在第一个路由的末尾返回一个简单的文本响应来显示我们的进度。\n\n## 07 创建一个 flask\
    \ session\n\n为了维护变量并为用户设置特定值，我们将值存储在 Flask session 中。session 是使用 cookie 存储值来实现此最安全的方法，但由于我们使用了一层加密来保证用户凭据的安全，它的行为就像字典，因此我们可以使用字典拥的所有方法。例如，如果我们需要存储身份验证令牌，可以使用\
