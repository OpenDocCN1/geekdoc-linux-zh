    ## 理解四翼器……


    尽管本文侧重于软件，但需要关于套件硬件的非常基本的背景以提供上下文。四翼器有四个螺旋桨（因此得名），指向轴线，每个螺旋桨连接在一个电机上，电机（通常）位于方形框架的四个角之一。两个电机顺时针旋转，两个反时针旋转，以最小化四翼器的动量。每个电机都由电子速度控制器（ESCs）驱动。电机有一组线圈（相位），ESC
