    ```\n\n# Automate mass scanning of documents\n\nUsing a variety of packages, we\
    \ will show you how to put together a script-driven customised document scanning\
    \ solution.\n\n# Advisor\n\nMichael Reed is a technology journalist, and he has\
    \ been busy with Linux for 15 years.\n\nWe're going to show you how to make a\
    \ document scanning system. To accomplish use a variety of Linux tools. The advantage\
    \ of this approach is that we control the process to match your specific requirements.\
    \ This gives us a tool that can handle big jobs and is open to lot of customisation.\n\
    \nWe'll be looking at possible end products: a PDF file in which each page is\
    \ a scan of an original page, and a text file that contains the textual content\
    \ of the original pages. The content of the text file is searchable, and we cover\
    \ a couple of ways of making it into a PDF.\n\nThis tutorial is modular. For example,\
    \ if we are dealing with pre-scanned images, we can skip the initial steps and\
    \ move forward to converting them into a PDF. But said, if you prefer to use nothing\
    \ to stop you. That said, we've tried to make every part of the process scriptable\
    \ for complete automation.\n\n# Resources\n\n- A Linux box\n- a scanner\n\n# Automate\
