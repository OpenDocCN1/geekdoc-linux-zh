    # Your view


    Your source of Linux news and views

    Contact us...

    Register and post your comments... Email directly...

    www.linuxuser.co.uk/forum/ linuxuser@imagine-publishing.co.uk


    # YOUR VIEW


    # Linux User Letters


    Your opinions about the magazine, Linux and open source


    # Supporting me


    I read your article on Windows 8 support with laptops, how they''re selling it
    to the public as not easy to use. You haven''t helped the corporate IT departments
    along with them. Most use email, well known occasionally Excel/Word/Powerpoint.
    All these apps have alternatives that work, However, Microsoft''s very corporate
    purchasing and no one wants to take a risk-can''t go without ''buying'' IBM, as
    they used to say.


    Knut Svendsen


    Well it''s interesting, as HP have recently decided to stop supporting Windows
    8 even after the Windows 8.1 update that''s supposed to fix everything. Users
    are clearly


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_93_0.png)


    The live tiles in Windows 8 have not been for everyone


    # THREAD BARE


    # Music to your ears


    We put up our manager group test on the website, where we compared the audio and
    quality capabilities of various media applications. Our readers have their opinions
    on the list, and felt we missed. if you want to add your voice: bit.linuxuser.co.uk


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_93_1.png)


    Praxis said:

    Linux players are as fiery as a rash, unfortunately. Almost all they want to do
    is which is not what''s expected from an operating system normally idles, like
    extensible tools. I used Audacious because it is light, and LidsMusic because
    it''s much better at handling bandwidth-consuming services. There are things which
    I could use but it works well. I also used Decode Player, after a light option.
    At times in use. In the last couple of years I''ve used Foxbox.


    dgrb said:

    I like how to organize my music, as I use very excellent software which are easily
    dealing with 92 recordings of Beethoven''s Eroica Symphony on the hard drive.
    I too tend to use Audacious, although XMMS used to be my favourite - no faults,
    it just basically told you what to do to it. I HATE software that thinks I am
    better than I do (one I''ve never had time for April).


    Duenny Taylor said:

    I''m not a fan of Rhythmbox, I find that it doesn''t play audio CDs very well
    I actually like Banshee. For me, I make playlists and that is how I go about playing
    songs. Some of my playlists can be found and few others on the same list. For
    me they have organized by genre useless.


    ignariascia:

    It''s quite amazing how a program as Guayisque makes kind of reviews. I''ve used
    RB and Banshee for years and IM Guayisque beats them all. It''s the most complete
    set of software managing collections. Please consider reviewing it in a future
    article.


    Richard Rose said:

    I like to agree with that I have just recently switched to Guayisque and I am
    very happy with it. I think it beats Rhythymbox - although the interface could
    do with some improvements.


    94 www.linuxuser.co.uk


    # Your view

    Windows 8 support, music players, CentOS, Pear OS Letters


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_94_0.png)


    # Android Magazine


    With more Android features now merged but also the Linux kernel, becoming easier
    to develop for one of the most popular systems around.


    With over 25 billion app downloads, and over 100 million users worldwide, there''s
    a wide range of folks ready to carry on Android-driven drivers empower you to
    look out our latest Android magazine dedicated to the platform. Along with news
    and reviews to keep your system updated there are tutorials and advice on developing
    and hacking your hardware. Find out more at www.littlelinux.co.uk


    - * Pear OS is gone, but hopefully forgotten


    not liking the tablet-style interface on laptops and PCs, and if they''re still
    offering that level of support, this has been since Windows 8 was released. Of
    course, Linux has its options for the kind of users that need more support than
    Windows, here is at least one way of using a more traditional desktop interface.


    Linux can be big business, when we see how Red Hat and Ubuntu have become. There
    is a place to sell a distro that is made to everyone. Are Mac converts for such
    a lucrative market? I suppose we will find out eventually.


    Den


    # Our two CentOS


    software created for Pear OS - the desktop plugins, the App Store-style software
    we are interested to see exactly what it comes out of - we found there was always
    something with Pear OS that marred the experience, so hopefully our release in
    the future works a bit better.


    I read that CentOS is getting more support from Red Hat? This does mean that they''re
    going to fully like the way OS has developed over the last years, and I don''t
    really want how they do it. They have their own free version in Fedora and a lot
    of people don''t like what''s heading as


    Beng sold off doesn''t necessarily mean David Tavares, creator of Pear OS, is
    selling off the distro as a. It could just be the name, or it could


    Joe Gibbons so far it seems like Red Hat hasn''t supporting them, but are giving
    them a little help when the CentOS team specifically ask them. We would doubt
    it will change much, as it''s already dictated by RHEL is already doing. It generally
    results in a better product.


    I heard that Pear OS had been sold off to another company? I didn''t even know
    who bought it up. Sure, CentOS isn''t changing any time soon


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_94_1.png)


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_94_2.png)


