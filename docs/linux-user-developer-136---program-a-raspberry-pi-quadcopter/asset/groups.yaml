    **GitHub**: [github.com/mitshelf/flask](https://github.com/mitshelf/flask)


    # ## A Twitter account


    # ## Your favourite token


    Once upon a time, the Twitter API allowed developers to write a quick weekend
    hack. Setting up was simple, the documentation was plentiful and available. But
    now things are a little different. With the Twitter API v1.1, authentication is
    not as simple as it used to be (though documentation is still plentiful). Twitter
    now requires OAuth to get for all its requests. It is a bit complicated - and
    appropriate if you''re putting together a quick hack. However, the authentication
    process will help you when it comes to debugging problems when you have to start
    handling multiple endpoints. We''ll be using Flask - a lightweight Python server
    framework - to define routes, controllers and return views. For this project:
    as we''ll see shortly, defining routes and handlers is a piece of cake and saves
    us having to deal with a sort of overhead that comes with frameworks like Django.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_43_0.png)


    OAuth settings

    Use the access token as your ''oauth_token'' and the token secret as your ''oauth_token_secret''
    to sign requests with your own token. Keep your tokens, secrets, and secrets safe.


    | Field | Value |

    | --- | --- |

    | Access level | Read-only |

    | Request token URL | [Understand the permission-model](https://developer.twitter.com/en/docs/concepts/authentication/permission-model)
    |

    | Consumer key | |

    | Consumer secret | https://api.twitter.com/oauth/request_token |

    | Authorize URL | https://api.twitter.com/oauth/authorize |

    | Access token URL | https://api.twitter.com/oauth/access_token |

    | Callback URL | |

    | Sign in with Twitter | bio |


