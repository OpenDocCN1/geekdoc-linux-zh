    \n# Build a blog with Django\nProgram and publish a Django blog site.\n# TUTORIAL\n\
    \n## 10 Django views\n\nDjango views are functions that describe how to display\
    \ information on screen when you call a URL. A view takes the first argument of\
    \ every view as an HTTP request and returns an HTTP response. A function named\
    \ template will be created, and another function named list is also created. It\
