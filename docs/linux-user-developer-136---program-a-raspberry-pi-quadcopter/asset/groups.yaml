    \ request, we need to properly encode and format our authorisation headers. The\
    \ main difference between `sign_request()` and `auth_headers()` is that we use\
    \ the body of the request. If we use the wrong headers, the request will be rejected.\n\
    \n## 14 Making the request token\n\nOnce we've got the headers, we go back to\
    \ the HTTP request and call the oauth() method and wait for response. If it all\
    \ has gone well, we'll receive a string in our response with our first access\
    \ token. We then need to parse this individually for the parameters, using the\
    \ function `getParameters()` which will parse the string and return us a dictionary\
    \ that we can access. We'll then use these tokens for later requests.\n\n## 15\
    \ Reducing the request\n\nNow we have our first access token, we can reduce our\
