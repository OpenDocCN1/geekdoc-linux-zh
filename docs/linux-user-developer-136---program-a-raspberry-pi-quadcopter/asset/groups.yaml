    \n# 07 Use ImageMagick\n\nInstall ImageMagick on your system. We can use the image-process\
    \ with the `convert` command. We can use it to rotate and crop images. We can\
    \ also use it to split pages. Note that use a single drag in front of:![](img/5ff17f60221cc9f68eff9bca50f06afb_32_5.png)\n\
    \n# 03 Scan image\n\nDo a quick test of scanning by typing `scanimage -d [device\
    \ name] --test.png`. This will scan one page in graphics to check it. Add the\
    \ `-v` option to default settings. If there are problems refer to:![](img/5ff17f60221cc9f68eff9bca50f06afb_32_6.png)\n\
    \n# 04 Refine options\n\nIf you plan to OCR the text, consider 300 DPI for black\
    \ and white. For one thing, this keeps the file sizes down. `scanimage -d [device\
    \ name] --format --mode=line --resolution 300 > [filename]` are typical options![](img/5ff17f60221cc9f68eff9bca50f06afb_32_7.png)\n\
    \nYou can drag dialogues here: www.linuxuser.co.uk\n\n# Automate mass scanning\
    \ of documents\n\n## 08 Crop the page\n\nUse the parameters arrived at by using\
    \ GIMP to carry out a crop type: `[image] -crop widthxheight+[offset]+[offset]\
    \ [output name]`. For instance, `convert page.png -crop 224x331+1 page_1.png`\
    \ to create a rectangle at 1 pixel from the top left side.\n\n## 09 Rotate the\
    \ page\n\nIf you had to scan the pages on sides, use ImageMagick to rotate them:\
    \ `[input name] -rotate 90 [output name]` should do the trick.\n\n## 10 Split\
    \ pages\n\nBefore make, use of GIMP to work out the dimensions of the crop: `convert\
    \ page.tiff -crop 223x1536+0+1529 page_a.tiff` followed by `convert 223x1536+0+0\
    \ page_b.tiff` creates two separate files from pages.\n\n## 11 Make pre-processing\
