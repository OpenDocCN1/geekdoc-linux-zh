    ## SteamOS 特辑


    ## SteamOS 前 5 大游戏


    想要尝试 Steam 并希望获得比 Valve 官方提供更多的内容吗？这里有一些 Linux 和 SteamOS 上可玩的最佳游戏，可以帮助你入门。


    ## 1. 战锤：最后光 (Metro: Last Light)


    《战锤：最后光》是目前未支持 Linux 但知名度最高的游戏之一。作为被严重低估的《战锤：2033》的续作，《最后光》将玩家带回到末日后的莫斯科。这是一款带有恐怖元素的第一人称游戏，更不用说派系之间的分歧。在游戏中，弹药被用作货币——也就是你在武器中所使用的相同能量。这种手动瞄准系统有助于在保持生存的同时维持氛围感。


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_23_0.png)


    ## 2. 超级肉肉男孩 (Super Meat Boy)


    两个类别的 20 个平台定义了：白天平台和高速特技平台。后者是基础平台类型中的绝佳之作，并通过了超级肉肉男孩的严。。该游戏最初发布于 Xbox 360，随后很快面向
    PC 玩家。这是一款精彩且节奏快速的平台游戏，几秒钟可能花费几分钟不等的时间，关卡中充满了想要因你犯一个小错就杀死ك的物体，而成功则需要大量的技巧、运气和一点乐趣。


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_23_1.png)


    该游戏使用控制器游玩，例如 Xbox 360 手柄，但显然使用 Steam 控制器也运行良好良好。不过，如果你必须用键盘玩，我们还不认识任何能完成这项任务的人。


    ## 专家选择...


    ### Ron 推荐...


    #### 《请查通行证》(Papers, Please)


    Ron 简单地评价道“这真的是一个非常棒的游戏！”他 推荐了最佳生物沉浸式控制 Simon Papers。在写本文时，该游戏仍在 Linux 版本的开发中，它关于当你看到人们试图进入你的国家时的你的家庭福利。


    ### Ethan 推荐...


    #### 《阳极》(Anode)


    “我非常喜欢 Anode，它可能是我去年最喜欢的游戏。3D 潜入。一个让你探索太空和外层世界的动作冒险游戏。它是少数通过 Steam 绿光计划（Greenlight）的作品之一，用户通过投票决定将独立游戏加入
    Steam。”


    ### Johannemann 推荐...


    #### 《苏鲁之影》(Eldritch)


    “我知道开发者在 Linux 实现上投入了很多心血！”Johannemann 说。这是一款受 H.P. 洛夫克拉特启发的第一称动作游戏，利用你的战斗实力穿过恶魔世界。游戏还具有类
    Rogue（rogue-like）元素，地牢是随机生成的。


    ## SteamOS

