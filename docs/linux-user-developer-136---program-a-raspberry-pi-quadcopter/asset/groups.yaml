    # # Handling Twitter''s three-legged OAuth process


    Building and signing requests for OAuth can be tricky. We explain the authentication
    process for Python and Flask


    # ## Advisor


    **Sean M Tracey** is a creative technologist at a leading agency. He spends a
    lot of his time living (inside of Node.js, Python and Arduino)


    # ## Resources


    **Python 2.7**

