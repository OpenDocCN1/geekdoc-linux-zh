    \ `manage.py migrate` 来创建表。可以更改你的模型，但避免潜在问题是好事。\n\n## 动态模板\n\nDjango 使用动态模板。它的系统使用内置模板，但你也可以创建自己的。你在项目中使用的模板位于\
