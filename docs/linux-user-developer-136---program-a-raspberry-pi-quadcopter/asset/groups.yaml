    # 教程：设置无线接入点


    # 使用树莓派设置无线接入点


    ## 如何无线连接到你的树莓派，或连接到它的任何现有网络


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_63_0.png)


    **无线化** 为现有的有线网络创建一个接入点


    **树莓派与适配器** 我们的专家配备了合适无线适配器的树莓派


    **路由器** 为一个可以随处使用的新独立网络创建一个接入点


    Liam Fraser

    Liam 是 RaspberryPiTutorials 的创建者，并担任树莓派基金会的 Linux 服务器管理员志愿者员。


    ### 你需要的的物品


    - **最新版本的树莓派镜像** raspberrypi.org/downloads

    - **一台路由器或交换机**

    - **一个支持接入点（AP）模式的 USB 无线适配器**

    - **一个用于测试的 Wi-Fi 设备**


    带有支持接入点模式无线适配器的树莓派是一个非常多功能的工具。除了连接到现有网络外，树莓派还可以变成一个接入点并允许多个设备连接到它。它可以拥有自己的网络，也可以桥接到现有网络并使其变为无线化。这种方法的一个潜在应用是为访客创建一个访客网络，并设置适当规则确保他们无法连接到任何局域网（LAN）。另一个是简单地通过无线而非以太网连接，这在以太网端口已被占用时非常有用。例如，作为服务器的树莓派（用于通过网络启动计算机）会有一根以太网线连接到正在启动的计算机，但你可能需要同时登录并查看发生了什么。


    ### 01 安装奖励包


    使用用户名 **pi** 和密码 **raspberry** 登录树莓派系统。使用以下命令获取最新的软件包列表：


    ```bash

    sudo apt-get update

    ```


    我们将使用 `hostapd`，这是一个处理接入点管理和认证的守护进程。我们还需要 `bridge-utils`，它将用于桥接以太网和无线接口；`iw` 用于获取无线接口的信息，而
    `dnsmasq` 是一个 DHCP 服务器接口。通过以下命令安装它们：


    ```bash

    sudo apt-get install host bridge-utils iw dnsmasq

    ```


    ### 02 检查 AP 模式


    拥有一个支持接入点（AP）模式的适配器至关重要。要验证这一点，检查有线设备并输入 `iw`。将有一个名为“Supported interfaces mode”（支持的接口模式）的部分。确保
    AP 模式在列表中。我们的输出如下：

    Supported interfaces:


    - IBSS

    - AP

    - APVLAN

    - WDS

    - monitor


    ```text

    ssid=pinet

    hw_mode=g

    channel=1

    wlan0

    wpa_passphrase=super_secret

    wpa_key_mgmt=WPA-PSK

    ee80211n1

    ```


    注意，如果你没有无线能力的设备，或者遇到稳定性问题，你可能需要保留最后两行。如果你遇到稳定性问题，可能还需要更改无线通道。完成后，使用 `sudo /etc/init.d/hostapd
    start` 启动 hostapd。


    ### 03 桥接接口


    我们将桥接以太网和无线接口，以便它们共享相同的 IP 地址和流量通道。要做到这一点，使用 `sudo` 编辑 `/etc/network/interfaces`
    并将其更改为如下：


    ```text

    auto lo

    iface lo loopback


    allow-hotplug eth0

    iface eth0 manual


    allow-hotplug wlan0

    iface wlan0 manual

    ```


    ```text

    iface br0 inet dhcp

    bridge_ports eth0 wlan0

    bridge_wait 0

    ```


    目前，我们处于现有网络中，并将设置本地路由器。使用 `reboot` 使更改生效。


    ### 04 配置 hostapd


    我们需要编辑 `/etc/default/hostapd` 以在启动时运行守护进程。使用“DAEMON_CONF”选项并将其替换为：


    ```bash

    DAEMON_CONF=/etc/default/hostapd.conf

    ```


    我们需要使用指定的属性配置 hostapd 文件。如下所示：


    ```text

    interface wlan0

    bridge=br0

    driver=ie80211n

    country_code=UK

    ```


    ### 05 连接到网络


    配置文件中的 SSID 是名称，WPA Passphrase 是密码。当你连接到网络时，连接将桥接到有线网络，并且你应该从你的现有路由器 DHCP 获取一个
    IP 地址。


    ### 06 创建端点网络


    我们现在要配置网络独立于你的现有网络。要做的第一件事是提供你喜欢的静态 IP 地址。例如使用 `192.168.0.2`。如果你想路由到其他网络，我们建议使用随机地址范围。我们将做的第一件事是在
    `/etc/network/interfaces` 的桥接部分分配静态地址，如下：


    ```text

    iface br0 inet static

    bridge_ports eth0

    bridge_wait 0

    address 192.168.0.2

    netmask 255.255.255.0

    gate 255.255.254

    ```


    ### 07 配置 DHCP 服务器


    第一步我们将安装 dnsmasq 服务器。这非常简单。只需执行以下配置复制：


    ```bash

    sudo cp /etc/dnsmasq.conf /etc/dnsmasq.conf.orig

    ```


    然后编辑 `/etc/dnsmasq.conf` 包含以下行：


    ```text

    interface=br0

    address=192.168.0.2..192.168.0.254

    mask=255.255.255.0

    ```


    ### 08 尝试一下


    无线接口上的设备将能够连接有线网络，任何插入树莓派的设备将获得一个 IP 地址，以便与其他通信。


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_64_0.png)


    # 要学习的技能


    1. 连接：许多接入点支持的一种非常有用的设备。

    2. 网络：网络世界的，让它变得不那么神奇。


