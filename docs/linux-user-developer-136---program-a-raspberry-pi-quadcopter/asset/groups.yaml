    \n当你创建一个新项目或应用时，Django 会生成几个文件和文件夹。例如，项目包含一个名为 `__init__.py` 的文件，让 Python 将目录视为一个包；一个名为\
    \ `settings.py` 的文件是项目的配置。\n\n在 `photoblog` 目录下存在一个名为 `models.py` 的文件，它包含了项目的数据库模型。\n\
