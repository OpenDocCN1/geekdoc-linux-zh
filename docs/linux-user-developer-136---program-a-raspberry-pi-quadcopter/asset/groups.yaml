    # # Tutorial Program a Space Invaders clone


    # ## 03 Testing Pyifiers


    (With Pygame installed and the project cloned to your machine (you can also find
    the zip on this site - simply unpack it and copy it to your folder), you can take
    it for a quick test drive to make sure everything''s set up. Now you can run your
    program from the pygame directories in the terminal to start. You can then start
    the game with the space bar, shoot with the arrow keys on your keyboard to move
    your left and right


    you can''t learn individual items within them. For constants, which aren''t designed
    to change anything.


    You could, have a pet class. From that class you could create a cat (that meows)
    and a dog (that barks). They''re different in many ways, but they''re both furry
    and have the same parent class. We do exactly that with our Ammo class, using
    it to create both bullets and enemies. They move in opposite directions, but they''re
    fundamentally one and the same class. We use this it avoids creating unnecessary
    code and ensures consistent behaviour between objects.


    # ## 04 Creating your own class


    Once you''ve reached a high score (surviving for over 200 projectiles) it''s time
    to implement your own version. You''ll learn much from following the example and
    figuring out what''s going on. For those who want to make their own project, create
    a new project folder and use any IDE (IDLE or whatever) to create and save a py
    file of yours.


    # ## 05 Classes - part 1


    A class is a blueprint for an object you''d like to make. In the game we play,
    we have many instances of a class, or multiple copies (in the make_player method)
    halfway through the screen. The player inherits a lot of properties from the Sprite
    class, as well as new methods found within the first line of the class you created.
    You can read more about the Sprite class at www.pygame.org/wiki/Sprite.


    # ## 09 The game


    Our final class is where all the main functionality of the game takes place, but
    remember, it''s just a list of methods - nothing actually happens until you call
    them. The main class is where the game resides. We use Pygame to program our projectiles,
    antagonist and gameState class to control things like moving the player''s movement
    (direction) and if we need to restart the screen.


    # ## 07 Classes - part 2


    In Invaders, classes creating the attributes which are simple variables for the
    class to use. For each ammo (or a bullet), you''ll also notice all the class has
    an (update) method which is called in the main game (we''ve called calls update)
    in every iteration of the loop that we''ve created to move. In the case of the
    bullet it moves to the top or bottom of the screen, and we destroy it (if it doesn''t
    move left any).


    # ## 10 The main loop


    There are many methods (functions) in the class, each one designed to control
    a particular aspect of either setting up the game itself. The actual logic of
    what happens every round of the game is contained in the (main_loop) method at
    the end of the class. This is where we update all the variables and functions
    we need for your game. Starting there, you''ll be able to see how the score has
    been updated 20 times every second before ending the game.


    # ## 08 Global variables


    Once we''ve identified the variables we need, we store them in block capitals.
    The variables are constants (or global variables). They are numbers that need
    not be used but referred to in the code, colours sizes and resolution. You''ll
    also need multiple numbers in different classes -


    # ## 11 Main loop - part 1


    First we check that the game_attribute is true - if it isn''t, then the main_loop
    is skipped and we go straight to pygame update. The flag is set so we reset the
    screen and wait for the Esc key on the start_screen. Assuming end_game is false,
    the main loop can start again with the (control) method, which checks if the position
    of the player and the enemy have collided. We use the random loop to call the
    (update) method every frame and draw the screen using a loop. This is how we make
    sure everyone''s up to date and before we check collisions in col_collision.


    # ## 12 Main loop - part 2


    Once collisions have been detected, we need to see if the games is met to continue.
    If it is with is_end and defenses_destroyed, if either of these methods returns
    false we need to return to the start screen. On then, we also need to check if
    all the aliens are alive, from within start_screen. If the aliens are alive, we
    can call the next_round() method, which creates a fresh batch of aliens and increases
    their speed per round. Finally, we refresh the screen so that everything''s built
    and the game can be played. Remember, the main loop runs 20 times a second - and
    so the fact that we don''t call for the screen to update at the end of the loop
    is of no consequence.


