    \ will have to edit `photoBlog/views.py` to add views to your Django website.\
    \ Every view should return a URL defined in `urls.py`.\n\n## 11 Project URLs\n\
    \nWhen use Django for the first time, you will have many URL patterns. The more\
    \ you use Django, the more you are going to encounter complex patterns.\n\nURL\
    \ patterns are processed in order; as soon as a match is found, it stops any matching.\
    \ This allows specific expressions before generic ones. URLs are defined in `urls.py`.\
