    \n现在我们开始演示如何向 Twitter 提交数据。OAuth 协议要求每个请求都使用 SHA1 哈希值进行签名，以便 Twitter 能够验证收到的数据的完整性。\n\
    \n```python\ndef verifyRequestParameters(request):\n    verify_params = {\n  \
    \      'consumer_key': consumer_key,\n        'nonce': str(random.randint(1, 999999999)),\n\
