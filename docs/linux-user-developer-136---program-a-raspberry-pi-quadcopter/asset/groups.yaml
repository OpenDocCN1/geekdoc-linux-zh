    # On the DVD


    Your disc


    Find out what lies in store for you issue

    Welcome to the Linux User & Developer DVD, which accompanies the magazine. We''ve
    chosen a selection of relevant contents of the magazine. For this issue we''ve
    included RC, Sabayon, NOOBs, SystemRescue distros to experiment with


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_95_0.png)


    If you want to follow along with some of our tutorials, selected project files
    are available here


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_95_1.png)


    20 of the latest and greatest packages covering a variety of different functions


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_95_2.png)


    Want to see what your favourite devs are doing?


    Want to try a new distro? Here''s how to get...


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_95_3.png)


    STEP 1: Grab a new ISO

    Copy the ISO from your disc to your hard drive - go to the tab, click ISO and
    Save. After, install an ISO to download. If you''re not sure you need 32-bit or
    64-bit version, who go to the safer is.


    STEP 2: Open or install Brasero

    Brasero is the most popular open source utility. If it''s not already installed
    on your distro, locate it in your repository and install it. Then run the program
    and select ''Burn image'' from the Projects tab on the left.


    STEP 3: Burn your disc image

    On the Burning Setup menu, click the box - ''click here'' to select a disc image
    - and navigate to the ISO you just put on your hard drive. Once selected, ensure
    you''ve got a CD or DVD writable disc inserted and click ''Create Image''.


    # Disc introduction

    Welcome to the all-new Linux User & Developer DVD


    # Editor''s picks


    **NOOBs** It''s a bit more than an easy way to install a Raspberry Pi distro...
    It''s also a way to do better your Raspberry Pi. There are a number of excellent
    distros available for Raspberry Pi, and this''s the best way to experience them.


    **GParted** If you don''t have GParted, you should - it''s the very best partition
    editor and manager around. Our group test confirmed this, and as a lightweight
    app you won''t be losing any space.


    **Scratch** Learn the basic logic of programming by making simple games with Scratch.
    It''s a great way for newcomers and youngsters to start learning to code, making
    it more interesting than Hello World.


