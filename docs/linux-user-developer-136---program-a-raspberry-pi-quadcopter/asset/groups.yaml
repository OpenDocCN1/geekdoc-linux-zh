    如何击败树莓派机器人？给它装上翅膀。Andy Baker 为我们展示如何通过代码飞向云端。


    树莓派是一个极佳的项目。由于我们热爱挑战，我们开始寻找某种能够超越第 32 期中树莓派机器人的东西，某种能真正挑战我们黑客和编程技能极限的东西。我们选择了一台基于树莓派的四翼器。


    如果你只想享受飞行的乐趣，可以购买即插即飞（RTF）的套件，但我们想要的是挑战！我们从 Wheel F450 开始——拥有所有硬件，但没有任何控制电子设备或软件。许多爱好者使用
    Arduino 微控制器制作了 DIY 四翼器，因此我们知道 DIY 组装是可行的，但极少有人（如果有的话）曾成功使用过树莓派。


