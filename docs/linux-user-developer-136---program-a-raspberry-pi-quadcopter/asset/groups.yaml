    +   01 Install

    Before we start writing code, we have a few prerequisites. If you have python
    on your system then installing is as simple as putting `pip install flask` into
    your library. If you''re building from scratch, you''ll need to find Flask and
    GitHub on the list. The latest version is:


    +   02 Create a twitter app

    Before we go with Twitter, we need to create an app for free. For this, sign in
    and go. If you go to https://dev.twitter.com/en/dashboard/your-profile; hover
    over it and the drop-down ''Select My Apps'' and then click the link. Follow the
    instructions to set up the app. The information you enter here is not important
    right now — at the end of the process you''ll see a field titled ''OAuth Settings''
    with a set of settings. We''ll need in a little bit:


    +   03 Importing Python

    These are the modules we''ll be using for this project. For example, all of the
    modules should be included in all versions of Python 2.7+. These are all used
    in the process of generating, encoding and decoding requests to and from Twitter
    API. We need to be specific when importing requests from Flask, out of scope of
    the endpoints


    +   04 Create global variables for Twitter keys

    In step 2 we created an app with Twitter. Now we need the variables that we saw
    in the OAuth Settings area of the ''Create'' key and consumer_secret variables.
    Now, leave the oauth_secret and oauth_token variables as blank strings — we''ll
    assign those later.


