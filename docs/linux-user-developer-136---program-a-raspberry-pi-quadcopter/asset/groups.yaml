    ## 11 获取密钥\n\n使用 HMAC 库对密钥进行哈希。我们将使用我们的签名字符串（请求体的内容）。SHA1 哈希函数处理签名。\n\n## 12 获取请求令牌\n\
    \n我们不能仅仅请求令牌来访问数据。首先，我们需要获取请求令牌，然后对其进行交换。这是我们在后端自己完成的。在此期间，如果我们想尝试任何事情，我们需要提交给\
