    - 1&1 移动网站生成器

    - 新品：PHP 5.5, Perl, Python, Ruby


    # 成功的营销


    - 1&1 SEO 专业

    - 1&1 搜索引擎营销

    - Facebook® 和 Bing® 积分

    - 1&1 邮件订阅工具


    # 尖端技术


    - 地冗余带来的最高可用性

    - 超过 300 Gbit/s 网络连接

    - 保证高达 2 GB RAM

    - 新品：由 CloudFlare 驱动的 1&1 CDN

    - 新品：包含 1&1 SiteLock 安全扫描！


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_16_1.png)


    ## 功能

    SteamOS


    # SteamOS


    # 游戏的未来与 Linux 的未来相关


    在经历了多年的传闻、数月的预热和数周的等待后，SteamOS 终于问世。这个游戏发行版的发布标志着 Valve 进军硬件市场的开始。在发布当天，第一批 Valve
    自己的 Steam Machines 已经发货。这些早期上架的产品虽然寥寥无几，但实际上它们是未来更多第三方产品的先例。Valve 的这一巨大举措在科技和游戏界引起了波澜，预计随后会有一些人士能够帮助我们真正理解
    Valve 的处境，以及他们的下一步动作可能是什么。


    1 www.linuxuser.co.uk


    # 专家简介


    我们采访了游戏界一些最重要的人物，听听他们对 SteamOS 的看法


    # Ron Gilbert

    **游戏行业资深人士**


    《猴子岛之旅》系列背后的男人 Ron Gilbert 已经在行业内深耕了 25 年。去年，他创立了 Beep Games，这是首批在 Linux 上发布的游戏之一。他现在运营着
    Beep Games 工作室，目前专注于移动游戏。


    # Ethan Lee

    **Linux 移植专家**


    独立游戏幕后的一位重要人物，Ethan 是 Linux 最重要的人物之一。去年，他帮助移植了一些独立游戏界的大名之作，包括《Fez》、《Rogue League》和《Super
    Hex》。


    # Johnnemann Nordhagen

    **独立游戏开发者**


    Fullbright 公司联合创始人，2K Marin 前员工，Johnnemann Nordhagen 自 2013 年的独立游戏 Game Home 以来一直深耕独立领域。他是一名程序员，目前正在环游世界，准备在投入下一个项目之前结束旅行。


    > “我正在为我制作的 iOS 游戏《Scurvy Scaffolds》制作 Android 版本，”Ron Gilbert 在我们在电话中问候他时说道。


    我们在 Skype 上联系到了他，他对移植自己的最新游戏感到非常兴奋。在 Linux 上运行实际上是很有趣的，因为这意味着他制作的下一个作品将更具跨平台友好性。话题很快转到了
    Linux 作为一种方式


    > “移植是一件很有趣的事，”他说，“并不是说它要出来，但它并没有特别之处。我觉得这太棒了，所以 Linux 上的优秀独立游戏很棒，因为人们可以在运行桌面平台的同时玩游戏，而无需启动到
    Windows 或任何其他我不想处理的东西。”


    他准确地回答了他所说的 Linux 并不特殊是什么意思，假设他指的是从技术角度来看它并没有特别不同。“为 Windows、Mac 或 Linux 编写游戏非常相似。你只需要确定你用的是
    OpenAL 还是 DirectX，并且你必须处理这个问题；希望人们编写的代码具有分层，在代码和硬件之间有平台分层。”


    随着独立游戏和硬件的兴起，Steam 进入 Linux 也大有裨益。“Steam 确实拥抱了 Linux 平台，这是一个可行的开发平台。”


    这就是 Ethan Lee 登场的地方。我们之前和他聊过，他已经将游戏移植到 Linux 大约两年，随着 Steam for Linux 成为游戏日益被接受的严肃考虑，他对技能的需求在过去一年中有所增加。


    > “就在 Steam for Linux 出出的左右，我开始真正为 Linux 制作一个可以运行的游戏，我不确定是因为 Steam 还是我的 MGSDL
    开发导致了这种情况。所以，MGSD2 发生了……在四月之前我只有两个。从四月我决定了更多。”


    “然后一切似乎并没有任何放慢的迹象。”


    ## 功能 SteamOS


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_16_0.png)


    ## 控制器设计


    控制器是 Steam 的一部分，虽然他们可能在上面花费了时间，但事实是他们需要更好的硬件。他们只是在说，“让 OEM 去做，然后我们会解决软件问题。”这很有意义。

