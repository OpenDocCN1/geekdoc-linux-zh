    \n# 教程\n\n# 处理 Twitter 的注销 OAuth 流程\n\n# LinuxDeveloper\n\n为了正确对请求签名，我们需要将参数按字母顺序排序，对其进行\
    \ URL 编码，拼接然后每次对它们进行签名。这是一个 OAuth 编码问题。由于我们几乎对每个请求都要执行此操作，我们将编写一个方便的函数来完成所有这些工作：sign()\n\
    \n> Flask 非常适合这个项目：定义路由和处理器的参数就像制作蛋糕一样\n\n![](img/5ff17f60221cc9f68eff9bca50f06afb_45_0.png)\n\
    \n## 09 创建我们的签名\n\n首先，我们需要使用请求的基础 URL，这可以通过 `urllib.quote()` 实现。接下来，我们为传递给函数的参数创建一个有序字典，根据键值按字母顺序排序。由于每个请求都必须使用正文中的所有参数进行签名，因此正确排序它们非常重要。接下来，我们创建一个变量体来存储我们将将用于请求的方法字符串，并将其附加其中。然后，我们通过对字典的键值对进行拼接和\
