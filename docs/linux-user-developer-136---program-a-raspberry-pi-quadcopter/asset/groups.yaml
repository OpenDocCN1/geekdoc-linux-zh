    ![](img/5ff17f60221cc9f68eff9bca50f06afb_24_0.png)


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_24_1.png)


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_24_2.png)


    ▲ An early Kickstarter success story, FTL was one of the indie darlings of 2012.
    A space strategy game, FTL puts you in charge of a starship that is rushing home
    to deliver the rebel plans to HQ. You manage many sectors of hostile space while
    managing precious resources. The game is hard, rogue-like, and procedurally generated
    maps. As a single life and randomly generated, it''s rewarding to the player though,
    with several places the game wants to be. Higher difficulty levels and different
    shifts change the way the game can be played, meaning it will be a long time before
    you finish.


    ▲ Fez is one of the aforementioned puzzle platforms — a simple platform that puts
    emphasis on puzzles to complete along the way. Like Super Meat Boy, it was originally
    released on Xbox Live and later ported to Linux last year.

    The core of Fez is a simple concept, challenging platforms and objects, allowing
    Gozo to traverse the world and access new areas. A bit of the puzzle helps you
    move around each area you explore the world.

    Seeing the true ending takes some mind-boggling mental feats, and makes it one
    of the most rewarding games of the last few years.


    ▲ Gone Home is one of those that stretches the definition of videogame. It''s
    best described as an interactive novel, where the player takes first-person control
    of a woman returning to her childhood home. There is, her sister has left a note
    worth looking into it. The game has you searching through the character''s backstories
    and illuminating new facts to the playable character.

    These stories are explored through the game, and having played it in a first-person
    game makes it an incredibly immersive and essential experience. It''s built in
    Unity, which allows for easy deployment to Linux.


