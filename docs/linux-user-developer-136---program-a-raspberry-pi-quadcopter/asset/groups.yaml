    # Korora 20


    Korora 被介绍为面向初学者，对老手来说依然有用——但它不仅仅是一个换壳版的 Fedora 版本：如今那些能让新手更容易上手的 Linux 发行版并不多。它们大多数关注某一个特定的发行版和概念，在
    Korora 的情况下，就是 Fedora。Korora 早期基于 Gentoo，后来切换到了基于 Fedora 的方案，在这些流行的发行版中提供了更完整的体验。


    标准 Fedora 和 Korora 之间的某些区别在于让它变得更容易上手。首先，Korora 提供了不同的桌面环境，如 GNOME、MATE 和 XFCE。虽然这些也可以通过其他选项安装并同时保持出色的
    Fedora 体验，但获取这些选项要简单一些。RPM Fusion 也用于选择，并包含 Google 和 VirtualBox 的额外仓库。Korora 使用了新版本的
    Anaconda 安装程序。


    Korora 20 使用 Yum Extender，这是一种软件管理器和安装器，作为 Fedora 安装器或 Synaptic 的替代方案。Fedora 版本比较简单，而
    Yum Extender 希望在为用户带回功能的同时，对新手来说依然易用。


    它的界面布局并非最佳，更多地依赖于知道自己要找哪个包，而不是提供一系列类别供你浏览。它还崩溃过几次，特别是在安装新软件或更新设置之后。不过，它非常好用，你可以轻松地安装
    Soundtrack 或使用 GNOME 的应用程序安装器来取代 Yum Extender。这是了解 Linux 的一种好方法。然而，在某种程度上，Fedora
    很容易学习和使用，不需要尝试很多花样。它可能不是最好的。


    作者：Red Robot


    一系列工具帮助新手接触 Linux —— 但并非没有问题。尽管如此，除了一个稍微有点靠谱的包管理器外，各种口味和额外功能的选择让它比没有这些时更容易被老用户使用。


    Korora 用一个信息丰富的界面欢迎你的到来。

