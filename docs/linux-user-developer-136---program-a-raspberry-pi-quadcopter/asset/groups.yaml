    Edit individual partitions without worrying until you''re done


    Change QtParted''s configuration if you want to use different functions


    # Interface


    # Interface


    GParted has the simplest interface in this test. But this is no bad thing, as
    it allows for real-estate to be given to the all-important visualisation of your
    storage. Changing between hard drives and USB storage is as easy with a drop-down
    menu, and partitions are exactly what you''re looking at.


    The layout of QtParted focuses on giving maximum space to the partitions on selected
    drives, with only a simple list on the side for selecting them. The design of
    the menus requires a bit more knowledge of how to format your drives, and there''s
    no way in the actual interface to mount or unmount partitions.


    # Features


    # Features


    Due to limitations with libparted, logical volume management (LVMs) can be however,
    you cannot edit them very much. You can at least if you need them. Otherwise,
    as well as standard formatting, you can resize, boot flags and system-specific
    mount points. All of this is handled happily via the easy-to-use interface.


    QtParted comes with a few more functions than Disk for partitioning and formatting,
    it''s lacking compared to the other editors in this test. Shrinking and resizing
    is however, there''s no real management of what partitions are active and mounted.
    It does at least show what the drives are doing okay.


    # Formatting


    # Formatting


    With a task based on partition, GParted supports a high number of file systems
    both and new. A resizing is smart, and will not allow you to go lower than the
    amount of data already present. You can tweak the size and position of partitions
    by the megabyte to make set everything up to your preferences.


    QtParted offers a number of file types that you can write to, and has a similar
    selection that allows you to set up a number of drives at a time. This means that
    you are able to play with the set up without having to commit to it, and puts
    unnecessary stress on the hard.


    # Extras


    # Extras


    GParted is an excellent partition tool that works for both partitions and new
    types required for EFI and Windows 8. There''s also a data recovery tool that
    can recover all lost partitions and files if your drive is corrupted. While it
    is not the best way to recover drives, it''s a good first step.


    Unfortunately, there are a few extras on QtParted, and no plug-ins. Development
    is still under some form, and it''s not even version 1.0, so there may be some
    interesting features to come. For the time being, you''ll need to look elsewhere
    for more hard drive management.


    # Overall


    # Overall


    GParted is very much focused on its task as a partition editor, and manages to
    do all of that is required of it. It also lets you know how your changes are affecting
    the overall structure, which is always good to know.


    QtParted is an interesting application - on the one hand-it, it''s a decent tool
    and a nice interface in general. It''s lacking a few features that its successor
    has full access to. Overall, it''s still a good choice, but it could be a bit
    better.


