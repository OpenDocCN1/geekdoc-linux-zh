    # ### What you need


    +   - **Latest RaspberryPi Image** raspberrypi.org/downloads

    - **A router or switch**

    - **A USB wireless dongle that supports Access Point mode**

    - **A Wi-Fi device to test with


    A Raspberry Pi with a wireless dongle that supports Access Point is a very versatile
    tool. As well as connecting to an existing network, the Raspberry Pi can become
    an access point and have multiple devices connected to it. It can either have
    its own network or bridge onto an existing one and make it wireless. One potential
    application of this is to create a guest network for visitors, with appropriate
    rules to make sure they can''t connect to any LAN. Another is simply connecting
    to it over wireless than Ethernet, which can be useful if the Ethernet port is
    already used. For example, a Raspberry Pi acting as a server (used to boot a computer
    over the network) would have an Ethernet cable connected to the computer it''s
    booting, but you might need to log in and see what''s going at the same time.


