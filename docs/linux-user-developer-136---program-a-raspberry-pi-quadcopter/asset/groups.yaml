    # 在逆风中，四翼飞行器会因为风力的作用而向后漂移


    与相应的 PID 输出存在差异。三个 PID 的净输出随后被应用于电机 PWM 通道的适当组合上，以设置单独的脉冲宽度。


    通过垂直 PID，可以实现某种程度的起飞、悬停和降陆。将四翼飞行器放在水平水平面上，将目标设定为 0.5 m/s，它就会冲向云霄，而稳定性 PID 则确保在整个飞行、悬停和降陆过程中保持水平姿态。


    水平移动更加复杂。目标是以每秒 1 米的速度向前移动。最初的要求是处理水平补偿——因此，增加功率将产生向前推力导致向前加速，但同时空气阻力会减慢运动。为了维持这种稳定的向前速度，存在动态的倾斜努力。


