    \ 命令一起传递。\n\n## 03 创建你的 django-admin 项目\n\n你将使用 `django-admin` 命令创建一个新项目。每个项目可以包含许多应用（apps），因此项目本身是轻量级的，你可以根据需要添加应用。\n\
