    ![](img/5ff17f60221cc9f68eff9bca50f06afb_32_1.png)\n\n# 01 Install SANE Access\
    \ Now\n\nInstall SANE Access Now if you have installed SANE and still have difficulty\
    \ accessing your scanner, there may be a manufacturer-specific SANE-backend for\
    \ it. In that case, Google for it.\n\n![](img/5ff17f60221cc9f68eff9bca50f06afb_32_2.png)\n\
    \n# 05 Create scanning script\n\nWe'll make our first script out of the command-line\
    \ string that starts. Using a text editor, create a file named scan using `#!/bin/bash`\
    \ as the first line. Access the scanner that you can use. Save the file. Make\
    \ the script executable by typing `chmod +x scan`. As we go on, create extra scripts\
    \ at these stages. We can then chain these into one long script or invoke them\
    \ individually.\n\n# 02 Find scanner\n\nCheck that SANE can work with your scanner\
    \ by typing the command line. If your scanner is supported, the text output will\
    \ show device name. What you need is the first element before:![](img/5ff17f60221cc9f68eff9bca50f06afb_32_3.png)\n\
    \n# 06 Calculate crop (Wait, numbering is off in source)\n\nInstall GIMP and your\
