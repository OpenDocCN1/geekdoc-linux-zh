    # Tutorial Set up a wireless access point


    # Set up a wireless access point with a Raspberry Pi


    ## How to wirelessly connect to your Raspberry Pi, or any existing network connected
    to it


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_63_0.png)


    **Go Wireless** Create an access point for an existing wired network


    **Pi & dongle** Our expert''s Raspberry Pi with a suitable wireless dongle


    **Router** Create an access point for a new independent network that can be used
    anywhere


    Liam Fraser

    Liam is the creator of the RaspberryPiTutorials and volunteers as a Linux server
    administrator for the Raspberry Pi Foundation


    ### What you need


    - **Latest RaspberryPi Image** raspberrypi.org/downloads

    - **A router or switch**

    - **A USB wireless dongle that supports Access Point mode**

    - **A Wi-Fi device to test with**


    A Raspberry Pi with a wireless dongle that supports Access Point is a very versatile
    tool. As well as connecting to an existing network, the Raspberry Pi can become
    an access point and have multiple devices connected to it. It can either have
    its own network or bridge onto an existing one and make it wireless. One potential
    application of this is to create a guest network for visitors, with appropriate
    rules to make sure they can''t connect to any LAN. Another is simply connecting
    to it over wireless than Ethernet, which can be useful if the Ethernet port is
    already used. For example, a Raspberry Pi acting as a server (used to boot a computer
    over the network) would have an Ethernet cable connected to the computer it''s
    booting, but you might need to log in and see what''s going at the same time.


    ### 01 install the reward


    Log into the Raspberry system with the username **pi** and the password **raspberry**.
    Get the latest package lists using the following command:


    ```bash

    sudo apt-get update

    ```


    We''ll be using hostapd, which is a daemon that handles access point management
    and authentication. We also need bridge-utils, which will be used to bridge the
    Ethernet and wireless interfaces together, iw is used to get information about
    the wireless interface, and dnsmasq is a DHCP server interface. Install these
    with:


    ```bash

    sudo apt-get install host bridge-utils iw dnsmasq

    ```


    ### 02 Check for AP mode


    It''s crucial that you have a dongle that supports Access Point (AP) mode. To
    verify, check the wired device and type iw. There will be a section titled "Supported
    interfaces mode". Ensure that AP mode is in the list. Our expert''s output looked
    like this:

    Supported interfaces:


    - IBSS

    - AP

    - APVLAN

    - WDS

    - monitor


    ```text

    ssid=pinet

    hw_mode=g

    channel=1

    wlan0

    wpa_passphrase=super_secret

    wpa_key_mgmt=WPA-PSK

    ee80211n1

    ```


    Note that if you don''t have a wireless capable device, or having stability issues,
    you''ll want to leave the last two lines. You may also need to change the wireless
    channel if you are having stability issues. Once you have done this, start the
    hostapd with sudo /etc/init.d/hostapd start.


    ### 03 Bridge interfaces


    We''ll Bridge the Ethernet and the wireless interface so they can share the same
    IP address and traffic channel. To do this, edit /etc/network/interfaces (using
    sudo) and change it to look as:


    ```text

    auto lo

    iface lo loopback


    allow-hotplug eth0

    iface eth0 manual


    allow-hotplug wlan0

    iface wlan0 manual

    ```


    ```

    iface br0 inet dhcp

    bridge_ports eth0 wlan0

    bridge_wait 0

    ```


    At the moment, we''ll be on an existing network, and we will set up our local
    router. Using reboot so the changes takes effect.


    ### 04 Configure hostapd


