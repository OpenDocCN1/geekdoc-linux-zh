    ## 实验与调优


    虽然代码准确地反映了我们描述的所有内容，但有一组关键步骤只能通过测试找到：调优这些 PID 增益。对于每个 PID 调优，比例、积分和差分增益只能通过实验获得。结果相对直观，但每台四翼飞行器都是不同的。


    首先，找到 PWM 起飞阈值：这是通过将你的四翼飞行器放在地上并缓慢增加 PWM 直到它开始升起来实现——例如，代码所示，这大约是 1500+95。


    接下来，调整稳定性 PID——假设你的四翼飞行器是水平的且平衡大致位于中心，俯仰调优的结果适用于偏航。对于俯仰调优，调节两个对角的电机并将其放在表面上——四翼飞行器在中间保持水平。开启悬挂电机的
    PWM 直略低于起飞速度（在我们代码中为 1550us 脉冲宽度），直到四翼飞行器开始摇摆、晃动或向右而非向左？相应地调整 P 增益。一旦 P 增益稳定，D
    增益是可选的，但它会增加稳定性和灵敏度。它就像按在胶带上的感觉——它不会移动。


    - 垂直 PID 可以估算。1590us 略高于 5us/s 的起飞速度，因此 P 增益为 100 是理想的。不需要 D。


    有了真实的起飞、悬停和降落就是安全的，这就是你调优垂直 PID 的方式。过大的 P 增益会导致四翼飞行器撞击墙或在空中执行动作。最好的结果是在大型开放区域/公园内，那里降落后地面足够软。


    这没有捷径，所以你必须接受它会坠毁并尽力享受挑战！一旦平衡真正实现，你就拥有了一台可以在微风条件下起飞、悬停和降落的四翼飞行器。下一步是调整遥控器，但那是另一篇文章的内容……


