    现在的威胁更大。如果一个 Steam Box（Steam Box）必须运行 Windows 8，那它将完全是一堆垃圾。


    关于价格问题，大家都认同它的定价应该与游戏主机相似，而不仅仅是那种可能无法预估价格的低端产品。”当我们询问 Johnmann 是否有让它变得廉价的想法时，Johnmann
    回答道。他表示价格并没有想象中那么昂贵，但比游戏主机便宜。显然，想要免费获得是很的，但我知道 Valve 为什么要这么做。


    在这些问题中，如果由我来演示，我会建议通过这种方式来明确 Johnmann 所表达的观点。“事实是，人们喜欢它的外观并想要一个免费版本，但他们没有，因为[早期采用者]将是第一批购买这种产品的人，他们对成本的关注不如对多样性的关注。事实是，他们只是想强调‘我们可以在任何设备上运行
    Steam，我们可以拥有一个比 Xbox 更便宜的盒子。’”


    同样值得注意的是，微软和索尼能告诉我们它们在消费者那里失败的原因，是因为它们将消费者视为亏本买，正如 Ron 回复的：“索尼和微软，他们是在亏本卖机器。”


    ### 如果我以后为 Steam 开发任何东西，我希望也能支持 Linux


    只是这样他们就能在软件销售中赚钱。你可能会认为 Valve 也能做到这一点，因为如果他们将其授权给这些第三方，那么他们就失去了自己构建软件的能力。


    所以，尽管我们的专家小组认为运行可能会遇到一些问题，但 SteamOS 的未来正开始缓慢增长。行业正慢慢开始接受 Linux 作为游戏平台的理念，而且这种想法很难被改变。这可以追溯到
    Ron 开发他的 Android 移植版本并从中学习。


    “我显然也想支持 Linux，”他说，“是的，我可能会雇人来做初始的 Linux 移植，但我希望以后构建 Linux 版本能变得容易得多。我没有看到任何一个
    Steam 游戏是不包含 Linux 版本。”


