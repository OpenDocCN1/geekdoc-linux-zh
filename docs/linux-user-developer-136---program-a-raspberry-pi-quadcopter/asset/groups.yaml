    # OPINION

    # Linux and FOSS lead the way to the cloud


    Malcolm Herbert, director of Red Hat Consulting, thinks freedom of choice should
    be the cornerstone of any planned movement towards a cloud environment...


    The days of legacy UNIX are almost over as companies toward the cloud. Enterprise
    infrastructure built on the need for interoperability resulted in vendor-lock;
    cloud technology promises a freedom. Freedom of choice, on a daily basis, should
    be the cornerstone of any planned cloud strategy. In addition to come the requirements
    for the way, in terms of technology (APIs, communication et al) and in process
    systems managed.

    Linux and open source has changed the way about IT infrastructure in the same
    way that the operational IT is. We now move to open source technologies, and the
    processes that built them have changed. Back in 1996, before there was an enterprise-ready
    distribution of Linux, IT managers turned to Linux on SunOS and Solaris, as it
    was easier to manage and display. However, adopting the early days was met with
    some resistance, particularly


    from the risk averse who believed that the advantage one ever got for buying IBM
    extended to other preset products.

    Persuading people that Linux and open source software was best for web services
    took time. The premium IT solutions brought only a boom time for IT workers and
    Solaris were a boom time. The 1990s were expensive Linux. Market forces in question
    to demand scalable solutions pushed open source into the market.

    Many early adopters of Linux in the enterprise moved to open source and commodity
    hardware data centres between and today. These businesses have reported significant
    savings and performance benefits. These organisations could be seen as open source
    pioneers who designed and migrated to a new environment, and understand how to
    take what had been by community driven then into the very commercial world.


    They paid a higher price for adaption, both in terms of acquiring skills and leading
    the way beyond affordable hardware, as well as raw methodology. The benefits made
    it worth.

    One of the more implicit benefits of open source is lower licence/subscription
    costs, was standardised.


