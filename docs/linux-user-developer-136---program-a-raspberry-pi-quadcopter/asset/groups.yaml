    # Tutorial Install and dual-boot SteamOS


    Browse the web easily using Valve''s innovative browser and controller-based text
    entry


    SteamOS runs natively in Big Picture mode, perfect for quickly creating a living-room
    PC or HTPC


    Play your Linux-compatible Steam games on your TV easily with SteamOS


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_27_0.png)


    # Install and dual-boot SteamOS


    Make the best SteamOS possible – yours. Learn how to install SteamOS and get dual-booting
    for maximum flexibility


    Advisor

    Rob Zwetsloot models complex systems and develops clients in Python, Django and
    PHP. He loves to experiment with computing


    SteamOS is here, the future of gaming and Linux. Steam Machines, on the other
    hand, won''t make it out of shelves, or virtual shelves. The solution to this
    dilemma is quite simple: make your own SteamOS using the Steam Machine for gaming.


    Instructions on the SteamOS website can be misleading. There is also an installation
    element missing from SteamOS right now. In the traditional way at least, you cannot
    add SteamOS to an already working computer with a desktop. With a bit of planning,
    you can dual-boot with an existing SteamOS or create a dual-boot system on any
    hardware.


    ## Resources

    - PC with EFI or EFI support

    - USB stick


    Creating a Steam Machine will also be a lot cheaper than some of the competitors.
    Recently you would get the best out of it with an NVIDIA graphics card; however,
    AMD and Intel chipset support is now included.


    It''s time to create the ultimate living-room HTPC and to experience SteamOS as
    it develops. Remember, this is your computer, so make a backup beforehand or use
    a spare machine.


    ## A second distro image

    SteamOS installation files:

    store.steamowered.com/buildyourown


    The installation process is not always straightforward, though, and even the simplest
    is complicated.


    # Install and dual-boot SteamOS


    Make your own personalised version of SteamOS and dual-boot it


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_28_0.png)


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_28_1.png)


    # 01 Convert download


    USER suggests that you use the default installation, but by far better is the
    option to use custom. Follow the ''Build your own'' page on the Steam website
    and download the installer by following the link on the page underneath: Installation


    The previous step, make sure to look at the time for our entry point at startup.
    Restart when you get in, and use the default GRUB option. If you see dots on your
    screen, wait a few minutes or before pressing reset. If it fails to boot to a
    screen after three times, try the installation process again.


    # 02 Unpack Files


    Make your USB stick is empty and format it in FAT32 just to be safe. Disconnect
    the contents of the installer onto the drive with any hidden files. You don''t
    need to write anything about it, making the process just a little bit easier.


    # 03 Secure boot


    Some modern PCs use UEFI by default. Make sure to turn off the UEFI menu, before
    continuing or you won''t be able to install the installer, or even SteamOS for
    that matter. The enter menu should appear after POST.


    # 06 Boot USB


    Insert your USB drive into your system and reboot. After that boot from the BIOS
    menu, or reboot from the menu from SteamOS/EFI if the stick starts. Then you can
    set up home for how to install SteamOS.


    # 07 Install choices


    There are a few choices to make from the Steam menu, however which version of
    the application you have installed. Select ''Automatic installation'' to continue.
    This process is completely automatic, needing your input when finished to restart
    the PC. This will take 30 minutes to hour, depending on hardware.


    # 04 EFI support


    If your BIOS supports EFI, then now is the time to activate it in the BIOS menu.
    SteamOS will not even launch if you don''t activate it.


    # 05 Dual hard drive


    The easiest way to dual-boot and retain on a second hard drive. Disconnect the
    hard drive with OS and connect the hard drive you want to install SteamOS on.


    # 09 Setting up


    Once on the login screen, enter the username and password then to enter the terminal.
    It will download and update the Steam client, then ask you to sign into your account.


    # 10 Finish


    Exit Steam, log out of the session you''re using. Then open up a terminal again
    and type:

    ```

    sudo post_install.sh

    ```

    It will ask for a password: enter and press enter. It will automatically reboot
    after a moment.


    # 11 Recovery process


    After the reboot, the system will perform an automated recovery to complete the
    installation. When it works, let it do its thing.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_0.png)


    # 16 Making space


    You can shrink the storage partition as much as you want - however, remember that
    limit how many games you can install in SteamOS. Any other distro will require
    at least 20GB to install, but you cannot share space between them, so keep that
    in mind.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_1.png)

    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_2.png)

    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_3.png)

    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_4.png)

    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_5.png)

    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_6.png)

    ![](img/5ff17f60221cc9f68eff9bca50f06afb_29_7.png)


    # 12 Unsupported graphics


    You might run into a problem with a black screen. This will happen if you don''t
    have supported graphics, but there is a quick and dirty solution. Make sure to
    halt the boot process by pressing any key or down arrow on the keyboard when starting
    up.


    # 13 Boot options


    In the boot menu, press e. The boot options will be displayed on the screen -
    when it says ''not found'' in the boot options and delete it. Press F10 and you
    should boot into SteamOS mode automatically. We''ll cover a more permanent solution
    as we dual-boot with others.


    # 14 Attach original hard drive


    If you use the hard drive method to dual-boot, now is the time to pick the original
    drive. To boot into it, choose this hard drive from the boot menu and follow the
    steps to update GRUB later.


    # 15 Partitioning SteamOS


    If you have your CD or stick with other drives, add it to your system. Reboot
    and choose it from the boot menu, or reorder the boot menu. SteamOS will have
    itself first in the order you change it. Launch and then scan the disk. You''ll
    notice that a single large partition at the end of the disk is the storage partition
    where all games are stored.


    # 17 Install OS


    You can now install your second drive. You can use the ''alongside'' option or
    choose your custom partitions. Do not select use disk or you''ll destroy the work
    we''ve just done.


    # 18 Boot order


    You may have to enter the BIOS/UEFI and change the boot order to allow your second
    drive to boot. Change it to the main drive first with SteamOS, and reboot. If
    you''ve installed alongside, that should have automatically added a SteamOS option.


    # 19 Update GRUB


    If you''re booting from two hard drives, you''ll need to mount the SteamOS partitions
    before updating-grub with the following:

    ```

    sudo update-grub

    ```

    It should find SteamOS and add it to the list.


    # 20 Modify GRUB


    We can make a permanent change to GRUB which allows us to boot into SteamOS with
    no problems, just by default:

    ```

    sudo nano /boot/grub/grub.cfg

    ```

    Find the entry for SteamOS and remove something like the timeout. Save the file.


    # 22 Media center


    You can also turn the second drive into an HTTP server by installing XBMC. There''s
    more you can do to make Steam a media center. Select the option to automatic login,
    log out and choose XBMC in the session manager before logging back.


    # 23 Controls


    For this setup, you will need to set up a keyboard to choose between SteamOS and
    XBMC at boot time. XBMC will support USB controllers, so you''ll like using them
    for Steam, or you could use a remote.


    # 21 More GRUB


    If you want SteamOS to be the default option at boot, reconfigure the configuration
    file. Locate the line default="0" and change 0 to the number which will be the
    line it appears at at the boot menu, minus one.


    # 24 Future updates


    XBMC has an updating system, so your version of the client will be kept up to
    date as new features are added. The core system doesn''t work the same way, you
    may have to reinstall SteamOS in the future to take advantage of better driver
    support. Though, for now, you, you can get a taste of the future of gaming without
    the ridiculous price tag.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_30_0.png)

    ![](img/5ff17f60221cc9f68eff9bca50f06afb_30_1.png)

    ![](img/5ff17f60221cc9f68eff9bca50f06afb_30_2.png)


