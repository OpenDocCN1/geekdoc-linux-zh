    \ perfect for this project: defining routes and handlers parameters of a cake\
    \ is\n\n![](img/5ff17f60221cc9f68eff9bca50f06afb_45_0.png)\n\n## 09 Creating our\
    \ signature\n\nFirst, we need to use the base URL of the request, which we can\
    \ do with urllib.quote(). Next, we create an ordered dictionary of the parameters\
    \ we passed through the function alphabetically according to the key value. As\
    \ each request must be signed with all of the parameters in the body, it is important\
    \ to order them correctly. Next, we create the variable body to hold the string\
    \ of the method we'll be using for the request and append it to it. Then, we build\
    \ the body by concatenating and URL-encoding the key value pairs of the dictionary\
    \ so we have our signature. Then we check whether or not the body is empty; if\
    \ not, we'll append an '&' to the body signature in the next step.\n\n## 10 The\
    \ signing key\n\nNow we need to create a signing key for our signature. As we\
