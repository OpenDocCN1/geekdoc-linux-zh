    # Program a Raspberry Pi quadcopter


    How do you beat a Raspberry Pi robot? You give it wings. Andy Baker shows us how
    to code our way into the clouds


    The Raspberry Pi is a fantastic project. Since we love a challenge, we set out
    looking for something to top our Raspberry Pi robot from issue 32, something that
    would really push the limits of our hacking and coding skills. We chose a quadcopter-based
    on Raspberry Pi.


    Kits are available as-ready-to-fly (RTF) if you just want the joy of flight, but
    we wanted the challenge! We started with the Wheel F450 - all the hardware, but
    none of the control electronics or software. Many enthusiasts have created DIY
    quadcopters using Arduino microcontrollers, so we knew a DIY build was possible,
    but very few, if anyone successfully used the Raspberry Pi.


    This article uses the Python code on the disc as a guide to help you build a quadcopter,
    metaphorically bolting it together so that by the end, you don''t just understand
    the code but also the interaction with the world to build your own quadcopter
    with confidence.


    In the article, you can follow the corresponding code by searching for an equivalent
    tag comment; for example, simply searching the code for ''# Angles''.


