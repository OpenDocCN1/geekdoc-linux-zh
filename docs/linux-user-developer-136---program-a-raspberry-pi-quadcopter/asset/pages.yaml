    ![](img/5ff17f60221cc9f68eff9bca50f06afb_95_0.png)


    # Tutorial Files


    If you want to follow along with some of our tutorials, selected project files
    are available here


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_95_1.png)


    # Software


    20 of the latest and greatest software packages covering a variety of different
    functions


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_95_2.png)


    # Directory


    Want to see what your favourite distro devs are doing?


    # How to burn an ISO Want to try a new distro ISO? Here''s how to get...


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_95_3.png)


    STEP 1: Grab a new ISO

    Copy the ISO from your disc to your hard drive - go to the Tabs disc, click ISO
    and Save. After, install an ISO to download. If you''re not sure you need a 32-bit
    or 64-bit version, who go to the safer is.


    STEP 2: Open or install Brasero

    Brasero is the most popular open source utility. If it''s not already installed
    on your distro, locate it in your repository and install it. Then run the program
    and select ''Burn image'' from the Projects tab on the left.


    STEP 3: Burn your disc image

    On the Burning Setup menu, click the box - ''click here'' to select a disc image
    - and navigate to the ISO you just put on your hard drive. Once selected, ensure
    you''ve got a CD or DVD writable disc inserted and click ''Create Image''.'
