  md: '# Linux User Raspberry Jam - 5th April 2014


    The UK''s first south coast jam confirmed


    Linux User & Developer magazine is holding its first ever Raspberry Jam event.
    The Linux User Raspberry Jam event will take place at the RNLI in Poole, Dorset
    on the 5th April 2014.


    There will be places for 120 Raspberry Pi enthusiasts to get together with other
    coders and makers to learn and share ideas about their projects.


    The event will feature expert speakers from the world of Raspberry Pi, workshops
    where attendees can learn to program and make projects, and show-tell sessions
    where creators can share their latest Raspberry Pi creations.


    The Linux User Raspberry Jam is aimed at enthusiasts of all skill levels and there
    will be Raspberry Raspberry Pis to go around for attendees who don''t want to
    bring their own.


    > Russell Barnes, Editor of Linux User said: "We''re big fans of the Raspberry
    Pi at Linux User so we''re really excited about getting together with other enthusiasts
    at the first Raspberry Jam."


    There will be something for fans of all ages lots of great projects demos and
    challenges to take in.


    Tickets for the event (£25 for adults, free for attendees under 18) are now on
