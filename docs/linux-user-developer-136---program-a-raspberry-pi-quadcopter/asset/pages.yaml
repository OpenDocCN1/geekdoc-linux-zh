    for future requests.


    # 13 Building the OAuth headers


    When we sign our requests, we need to properly encode and format our authorisation
    headers. The main difference between `sign_request()` and `auth_headers()` is
    that the signature is the string that we generate for the body of the request,
    and we prepared the headers with '' '', and prepared them for the same purpose.
    We''ve separated the two to emphasise importance of the difference - if we use
    the wrong headers, the request will be malformed. If we use the wrong body, the
    request''ll be rejected. Notice the difference in the body of the request. If
