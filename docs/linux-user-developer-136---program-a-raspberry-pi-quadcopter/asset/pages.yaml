    We want to point our out to `/authenticated`. We then add the signature to the
    requestParameters that passed through to the signing, as we''ll be using this
    to build our authorisation headers.


    # 15 Reducing the request


    # A little about oauth_nonce


    Most of the values in the OAuth headers and signing process are optional. However,
    oauth_nonce is a randomly generated value - alphanumeric but since there is no
    defined convention, an integer can be used for this purpose. It is so Twitter
    can check that it''s not sent the same request twice.


