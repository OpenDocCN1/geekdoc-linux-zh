    +   Propellers The propellers are set diagonally to the x, y, axes, and rotate
    as shown to reduce yaw (rotation about the z-axis)


    +   Orientation The overall orientation of the quadcopter depicting front, back,
    left and right in relation to the sensor and propeller layouts


    +   Sensors The quadcopters'' sensors report data according to these x, and y
    axes


    input to the vertical speed PID from the sensors is reduced by the cosine of the
    measured angle ''optic tilt with respect to the horizon.

    Similarly, X and Y speed PID inputs need to compensate for pitch and roll angles
    when comparing target speeds against actual starts from accelerometer readings.


    # Experimentation and tuning


    While the code accurately reflects everything we''ve described, there is one critical
    set of steps which can only be found by testing: tuning these PID gains. For each
    PID tuning, an Proportional, Integral and Differential gain can only be found
    with experimentation. The result is relatively straightforward but every quadcopter
    will be different.

    First, find the PWM takeoff: this is done by sitting your quadcopter on the ground
    and slowly increasing the PWM until it starts to lift—for example, this is about
    1500+95, as shown in the code.


    Next, orient the stability PIDs - assuming your quadcopter is level and its balance
    is roughly center, the result of pitch tuning applies to yaw. For pitch tuning,
    tune two diagonally opposed motors and rest on a surface - the quadcopter horizontal
    in between. Power up the dangling motors

    PWM to just under take-off speed (1550us pulse width in our) until the quadcopter
    starts to rock, wobble, or do right, not left? Tune the P gain accordingly. Once
    P gain is stable, D gain is optional, but adds firmness and crispness. It is like
    clicking on tape - it doesn''t move.


    +   Vertical PID can be estimated. 1590us is little above take-off speed of 5us/s
    so a P gain of 100 is ideal. No need for D.


    With a real-takeoff, hover and landing are safe, which is how you want to tune
    the vertical PID. An excessive P gain leads to quadcopter slamming into walls
    or performing maneuvers in mid-air. The best outcome is in a large open field/park
    where the ground is soft enough after landing.


    There''s no shortcut to this, so you must accept that it crashes and enjoy the
    challenge as best as you can! Once the balance has gone true, then you have a
    quadcopter that takes off, hovers and lands in breezy conditions. Next step is
    to adjust a remote control, but that for another article...


