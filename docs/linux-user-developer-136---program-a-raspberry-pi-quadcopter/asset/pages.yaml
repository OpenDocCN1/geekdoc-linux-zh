  md: '# # Feature SteamOS


    # # SteamOS top 5 games


    Inspired to jump on Steam and want more than Valve''s offerings? Here are some
    of the best games available on Linux and SteamOS to get you started


    # ## 1. Metro: Last Light


    Metro: Last Light is one of the highest-profile games unavailable on Linux. The
    sequel to the frankly underrated Metro: 2033, Last Light returns players to the
    post-apocalyptic Moscow. It is a first-person game with horror elements, not to
    mention the dissent within the factions. In the game, ammunition is used as currency
    - the same energy you''re using in your weapons. This manual aiming system helps
    to preserve atmosphere while staying alive


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_23_0.png)


    # ## 2. Super Meat Boy


    20 platforms in two categories define: day platforms and high-speed acrobatic
    platforms. The latter is the best of the basic platform genre, and it is tested
    by Super Meat Boy. Originally released on Xbox 360, the game was quickly presented
    to PC players. It''s a fantastic and fast-paced platformer where a few seconds
    can take anywhere between minutes and the levels are full of objects that want
    to kill you for one mistake and success can involve a lot of skill, luck and a
    bit of fun.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_23_1.png)


    The game is played with a controller, so as an Xbox 360 pad, however apparently
    works just fine with the Steam Controller. If you must play with a keyboard though,
    we do not know anyone who completed it that task


    # # Expert choices...


    # ### Ron suggests...


    # #### Papers, Please


    Simply telling ''that''s a really great game!'' Ron recommends best biologic immersion
    control Simon Papers. At the time of writing, it''s still in development for Linux
    and it concerns your family''s welfare as you see people trying to enter their
    country.


    # ### Ethan suggests...


    # #### Anode


    "I really Anode, it''s probably my favorite game of last year. The 3D Ding. An
    action-adventure game where you explore the world of space and outer space. One
    of the few titles that made it through Steam''s Greenlight process users vote
    for indie games to be added to Steam.


    # ### Johannemann suggests...


    # #### Eldritch


    "I know the dev put a lot of work into a Linux implementation! says Johannemann.
    A first-person action game inspired by H P Lovecraft, make your way through a
    world of demons using strength of your combat prowess. There are rogue-like elements
    to the game as well, with dungeons randomly generated.


