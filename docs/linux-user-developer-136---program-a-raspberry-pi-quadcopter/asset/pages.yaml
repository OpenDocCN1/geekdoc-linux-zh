    # Linksys WRT5 reborn under Belkin


    Open-source router given a 21st-century makeover


    The popular Linksys WRT54G router, which gave birth to the OpenRouter distribution,
    has been updated by new owner Belkin and re-released as the WRT1900.

    In 2002, the router caused its creator Linksys considerable headache when it was
    found to be in breach of the GPL license under which its operating system was.
    In 2003, the company released the source code - directly leading to an explosion
    in popularity with respect firmware and added new features and capabilities.

    Its replacement, the WRT1900AC, maintains the blue and black design of the original
    but now a dual-core 1.2 GHz processor, four antennas, dual-band 5GHz and 2.4GHz
    WiFi, four gigabit ports, enSATA and USB 3.0 connectivity.

    Since, Belkin has also provided source code, software development kits and programming
    interfaces for the OpenWrt community early-access hardware.

    UK availability and pricing for the WRT1900AC router was still awaiting confirmation
    at the time of writing.


