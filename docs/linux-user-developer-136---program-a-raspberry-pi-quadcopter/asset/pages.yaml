    # Korora 20


    Korora is presented as beginners, and still useful for veterans — but it is more
    than a reskinned Fedora release:


    Linux distributions that make Linux easier for newcomers are not particularly
    these days. Most of them focus on one particular distribution and concept, in
    the case of Korora, it''s Fedora. Previously based on Gentoo, Korora made the
    switch to a Fedora-based approach, offering a more complete out of the popular
    distribution.


    Some of the differences between standard Fedora and Korora are at making it bit
    more accessible. First, Korora offers different desktop environments like GNOME,
    MATE and XFCE. While these can also be installed with other options, still keeping
    the great Fedora experience, it is slightly easier to get the options. RPM Fusion
    is also used for selection, with extra repositories for Google and VirtualBox.
    Korora uses the newer version of the Anaconda installer.


    Korora 20 uses Yum Extender, a software manager and installer used as an alternative
    to the Fedora installer or Synaptic. The Fedora version is on the simplistic side,
    and Yum Extender hopes to bring functionality back to users while still being
    simple to use for newcomers.


    interface doesn''t have the best layout, relying more on knowing which package
    you''re looking for than offering a selection of categories to browse through.
    It also crashed on a number of occasions, especially after installing new software
    or updating settings. It is very good though and you can easily install Soundtrack
    or use the Application Installer from GNOME to replace Yum Extender. It is a good
    way to get to know Linux. However, at some point, Fedora is easy to learn and
    use without trying many wheels. It won''t be the best.


    By Red Robot


    A selection of tools helps introduce newcomers to Linux – but it''s not without
    its problems. Still, aside from a slightly dodgy package manager, the choice of
    flavours and extras make it usable by more veteran users than without the.


    Korora welcomes you with a fairly informative screen


