    # 11 Having the key


    Using the Python HMAC library to hash the key. We''ll use our signature string
    (the content of the request body and method with our secret key). The SHA1 hash
    function handles the signing.


    # 14 Making the request token


    Once we''ve got the headers, we go back to the HTTP request and call the oauth()
    method and wait for response. If it all has gone well, we''ll receive a string
    in our response with our first access token. We then need to parse this individually
    for the parameters, using the function `getParameters()` which will parse the
    string and return us a dictionary that we can access. We''ll then use these tokens
    values for later requests.


    # 12 Obtaining a request token


    We can no longer just request a token to access our data. First, we need to obtain
    a request token and then exchange it for an access token. This is something we
    can do on the back-end and it ourselves. In the meantime, if we want to try anything
