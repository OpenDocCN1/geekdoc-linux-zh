    Instead, an estimation method is used with feedback from the sensors to fine-tune
    this estimate. Because the estimation/feedback code loop spins at over 100 times
    a second, this approach can reach error very quickly and needs nothing but compensating
    for that''s all handled by the feedback; this is the PID algorithm.


    # Code and reality


    In this code, there are nine PIDs in total. In the horizontal plane, for both
    the X and Y axes, the horizontal speed PID converts the user-defined desired speed
    to required acceleration/ the vertical speed PID converts this to desired tilt
    rate which the rotation speed PID converts to changes in motors feed to front/back
    or left/right motors for rotation.


    It takes the target, subtracts the feedback input, resulting the error is then
    processed via an Integral or a Differential algorithm to produce the output.


    In the vertical direction, a single PID converts the desired rate of ascent/descent
    to the actual output applied to each plate.


    # # Blender


    The output applied to each ESC in turn the vertical speed is applied to all blades;
    the pitch rate output is split 50/50 subtracting from the front blades and adding
    to the back, producing the pitch. Roll is handled in a similar way. Yaw is also
    handled in a similar way, but by adding diagonal blades which spin in opposite.


    Yaw uses two PIDs one to set the desired angle of yaw, set to 0, and one to set
    the yaw rotation speed. The output of these is to feed the diagonal motors in
    the same direction.


    These ESC-specific outputs are converted to a PWM signal to feed the hardware
    ESCs with updated propeller/ motor speeds.


    The most critical of the nine are pitch/yaw stability. These ensure that whatever
    requirements are enforced by other PIDs and external factors, the quadcopter is
    stable at its targets; without this stability the PIDs cannot work. Pitch by relative
    speed differences between the front and back propellers; roll by left and right,
    yaw by clockwise/anticlock'
