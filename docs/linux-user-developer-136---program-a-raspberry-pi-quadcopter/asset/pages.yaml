    # 09 Creating our signature


    First, we need to use the base URL of the request, which we can do with urllib.quote().
    Next, we create an ordered dictionary of the parameters we passed through the
    function alphabetically according to the key value. As each request must be signed
    with all of the parameters in the body, it is important to order them correctly.
    Next, we create the variable body to hold the string of the method we''ll be using
    for the request and append it to it. Then, we build the body by concatenating
    and URL-encoding the key value pairs of the dictionary so we have our signature.
    Then we check whether or not the body is empty; if not, we''ll append an ''&''
    to the body signature in the next step. Following this, we''ll generate the request
    like: GET `https%3A%2F%2Fapi.com%2F%1Fauth%3Fkey1=value1&key2=value2&key3=value3`


