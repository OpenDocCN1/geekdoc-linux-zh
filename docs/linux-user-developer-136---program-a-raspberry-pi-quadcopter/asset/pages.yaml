    #  02 Check for AP mode


    It''s crucial that you have a dongle that supports Access Point (AP) mode. To
    verify, check the wired device and type iw. There will be a section titled "Supported
    interfaces mode". Ensure that AP mode is in the list. Our expert''s output looked
    like this:

    Supported interfaces:


    +   * IBSS

    * AP

    * APVLAN

