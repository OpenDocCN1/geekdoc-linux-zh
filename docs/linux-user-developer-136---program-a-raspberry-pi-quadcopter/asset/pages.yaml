    # # Taking out the trash


    When dealing with memory oriented programming languages, one thing that comes
    to mind is garbage collection. Whenever you have the ability to reference an object
    with more than one, you will need to keep track of references in the memory until
    all have been removed. In Python, you have a garbage collector that is done. To
    control this, you will need to use the gc module. If you want to see how many
    objects are tracked by the collector, you can use the `gc.get_count()`. Normally,
    garbage collection is handled by an algorithm that is to maximize memory usage
    with minimal impact. But, if you want to force a garbage collection, you can go
    with `gc.collect()`. The collected objects are cleaned up. You can see the memory
    leaks used by the garbage collector with the `gc.set_threshold()`. You can always
    check what objects are about to be collected with `gc.garbage()`. With the gc
    module, you get a lot more control over your system than in most languages.


