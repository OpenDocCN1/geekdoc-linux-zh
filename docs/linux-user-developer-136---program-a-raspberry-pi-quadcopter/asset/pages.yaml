    metre per second. Initially the requirement is to handle the horizontal compensation
    – thus increased power will apply a forward force leading to forward acceleration,
    but at the same time, friction in the air will slow the movement. There is a dynamic
    tilting effort to maintain this stable forward velocity.


    Up to this stage, the PIDs are enough. But what about horizontal movement control,
    suppression of drifting in the headwind?


    The suppression and controlled horizontal movement use nested PIDs: the X and
    Y horizontal speed PIDs output the pitch and roll angle PIDs, while meeting some
    angular targets. The sensor feedback ensures that the desired horizontal speed
    is approached, the horizontal speed PID errors shrink, reducing the targets for
    the angle PID, thus bringing the quadcopters back up to horizontal again.


    Taking the drift suppression first, a quadcopter in a headwind will drift backwards
    due to the force applied by the wind. To compensate, it must tilt nose down at
    some angle that some of the thrust is applied forward to counteract the wind.
    In doing so, some of the power keeping the ''copter'' at a fixed height is now
    hitting the back; unless the wind is


