    head at the unsatisfied dependencies (which should be satisfied, by all accounts),
    I''d rather not to deal with that than figure out if pianobar is in the official
    repos.


    Unfortunately, there''s a reason why not finding it in Ubuntu – it''s because
    of Pianobar''s package manager. Repos uses only truly free software, and pianobar
    might not meet these needs. There''s a solution, though:


