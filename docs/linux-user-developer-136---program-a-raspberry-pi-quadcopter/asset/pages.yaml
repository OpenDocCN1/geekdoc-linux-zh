    ```

    ssid=pinet

    hw_mode=g

    channel=1

    wlan0

    wpa_passphrase=super_secret

    wpa_key_mgmt=WPA-PSK

    ee80211n1

    ```


    Note that if you don''t have a wireless capable device, or having stability issues,
    you''ll want to leave the last two lines. You may also need to change the wireless
    channel if you are having stability issues. Once you have done this, start the
    hostapd with sudo /etc/init.d/hostapd start.


    #  03 Bridge interfaces


    We''ll Bridge the Ethernet and the wireless interface so they can share the same
    IP address and traffic channel. To do this, edit /etc/network/interfaces (using
    sudo) and change it to look as:


    ```

    auto lo

    iface lo loopback


    allow-hotplug eth0

    iface eth0 manual


    allow-hotplug wlan0

    iface wlan0 manual

    ```


    ```

    iface br0 inet dhcp

    bridge_ports eth0 wlan0

    bridge_wait 0

    ```


    At the moment, we''ll be on an existing network, and we will set up our local
    router. Using reboot reboot so the changes takes effect.


    #  04 Configure hostapd


    We need to edit /etc/default/hostapd to start the daemon on boot. Use the "DAEMON_CONF"
    option and replace it with:


    ```

    DAEMON_CONF=/etc/default/hostapd.conf

    ```


    We need to configure the hostapd config file with the specified attribute. Below
    is what we like:


    ```

    interface wlan0

    bridge=br0

    driver=ie80211n

    country_code=UK

    ```


    #  05 Connect to the network


    The SSID in the config file is the name, and the WPA Passphrase the password.
    When you connect to the network, connection will be bridged to the wired network
    and you should receive an IP address from your existing router dhcp. Creating
    on an access point


    #  06 Create an endpoint network


    We''re going now to configure the network to be independent of your existing network.
    The first thing to do is provide a static IP address that you like to use. For
    example use 192.168.0.2. We recommend using a random address range in case you
    want to route to other networks. The first thing we''ll do is to assign a static
    address to the bridge section of /etc/network/interfaces to look as follows:


    ```

    iface br0 inet static

    bridge_ports eth0

    bridge_wait 0

    address 192.168.0.2

    netmask 255.255.255.0

    gate 255.255.255.254

    ```


    #  07 Configure a dhcp server


    We''ll install dnsmasq-server in the first step. It''s really simple. Just tap
    a copy of the following config:


    ```

    sudo cp /etc/dnsmasq.conf /etc/dnsmasq.conf.orig

    ```


    Then edit /etc/dnsmasq.conf to contain the following lines:


    ```

    interface=br0

    address=192.168.0.2..192.168.0.254

    mask=255.255.255.0

    ```


