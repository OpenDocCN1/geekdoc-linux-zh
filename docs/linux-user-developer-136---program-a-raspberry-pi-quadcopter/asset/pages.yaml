  md: '# # Tutorial Automate mass scanning of documents


    # ## 08 Crop the page


    Use the parameters arrived at by using GIMP to carry out the crop type: `[image]
    -crop widthxheight[+offset][+offset] [output name]`. For instance, convert page.png
    -crop 224x331+1 page_1.png to create a rectangle at 1 pixel from the top left
    side.


    # ## 09 Rotate the page


    If you had to scan the pages on sides, use ImageMagick to rotate them: `[input
    name] -rotate 90 [output name]` should do the trick.


    # ## 10 Spacing pages


    Before make, make use of GIMPs to work out the dimensions of the crop: `convert
    page.tiff -crop 223x1536+0+1529 page_a.tiff followed by convert 223x1536+0+0 page_b.tiff`
    creates two separate files from two pages.


