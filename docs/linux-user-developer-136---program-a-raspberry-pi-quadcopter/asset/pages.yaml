  md: "# # Handling Twitter’s three-legged OAuth process\n\nA walkthrough for the\
    \ Twitter authentication process using Python and Flask\n\nTUTORIAL\n\n# ## 05\
    \ Assigning a namespace to the Flask app\n\nNow we create an instance of the Flask\
    \ class. This variable will have us access to all the classes and properties associated\
    \ with the Flask app. The `.name` property in instance gives us the class name\
    \ as its scope.\n\n# ## flask.py (cont. on next page)\n\n```\nimport urllib, urllib2,\
    \ collections, hmac, binascii, time, random\nfrom hashlib import sha1\nfrom flask\
    \ import redirect, session\n\n# Twitter API Variables\nconsumer_key = 'Y9nMRDu3s5Xev'\n\
    consumer_secret = '8svrrB4klvHjWlZCU9WbtopzdXvZgJ6bb'\n\napp = Flask(__name__)\n\
    \n@app.route('/authenticate')\ndef authenticate():\n    session['secret'] = '...'\n\
    \n    request_params = {\n        'callback': 'https://api.twitter.com/auth/',\n\
    \        'consumer_key': consumer_key,\n        'nonce': str(random.randint(1,\
    \ 999999999)),\n        'signature_method': 'HMAC-SHA1',\n        'timestamp':\
    \ str(int(time.time())),\n        'version': '1.0'\n    }\n    return sign_request(request_params,\
    \ \"https://api.twitter.com/')\n```\n\nOn the Disc\n\n# ## 06 Creating our first\
    \ route\n\nIn order to authenticate our user, we need to create an endpoint that\
    \ they can visit to trigger the route. This process is easy with Flask: use the\
    \ route decorator (@app.route) to trigger functions or actions. The first endpoint\
    \ we want to create is the redirect after authentication, which will be executed\
    \ by the user. Note that although we do not need the function to have the same\
    \ name as the endpoint, Flask can serve static files or use rendering templates,\
    \ but for brevity we are going to use return at the end of the first route a simple\
    \ text response to show our progress.\n\n# ## 07 Creating a session flask\n\n\
    In order to maintain variables and set specific values to users, we are going\
    \ to store values in Flask sessions. A session is the most secure way to do this\
    \ using a cookie to store values, but since we use a layer of cryptography to\
    \ keep user credentials safe, it behaves just like a dictionary, so we can use\
    \ all the methods that dictionaries have. For example, we can use session.class\
    \ if we need to store the authentication token. We need to make sure that before\
    \ we make any calls to sessions, we set the secret key to avoid an error. We choose\
    \ to set the secret key in app() so it will be set before our server is executed.\
    \ Like most cases, this is all we need.\n\n```\n@app.route('/callback')\ndef callback():\n\
    \    request = urllib2.request(request)\n    token = request.args.get('oauth_token')\n\
    \    if token:\n        session['oauth_token'] = token\n        return redirect('https://api.twitter.com/authorize?oauth_token='\
    \ + token)\n    else:\n        return HTTPError('404')\n```\n\n# ## 08 Preparing\
    \ to authorise our app\n\nNow we start by showing how to submit data to Twitter.\
    \ The OAuth protocol requires every request to be signed with a SHA1 hash so Twitter\
    \ can verify the integrity of the data that it has received.\n\n```\ndef verifyRequestParameters(request):\n\
    \    verify_params = {\n        'consumer_key': consumer_key,\n        'nonce':\
    \ str(random.randint(1, 999999999)),\n        'timestamp': str(int(time.time())),\n\
    \        'version': '1.0',\n        'oauth_token': session('oauth_token')\n  \
    \  }\n    signature = sign_request(verify_params, \"POST\", \"https://api.twitter.com/\"\
    )\n    request.add_header(\"Authorization\", \"oauth=\" + signature)\n```\n\n\
