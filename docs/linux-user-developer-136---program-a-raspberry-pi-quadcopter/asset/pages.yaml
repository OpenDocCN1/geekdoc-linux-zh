    the pages. Don''t carry the copy in GIMP which will be coming from the command
    line in a minute.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_32_1.png)


    # 01 Install SANE Access Now


    Install SANE Access Now if you have installed SANE and still have difficulty accessing
    your scanner, there may be a manufacturer-specific SANE-backend for it. In that
    case, Google for it.


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_32_2.png)


    # 05 Create scanning script


    We''ll make our first script out of the command-line string that starts. Using
    a text editor, create a file named scan using `#!/bin/bash` as the first line.
    Access the scanner that you can use. Save the file. Make the script executable
    by typing `chmod +x scan` into a terminal. As we go on, create extra scripts at
    these stages. We can then chain these into one long script or invoke them individually.


    # 02 Find scanner


    Check that SANE can work with your scanner by typing the command line. If your
    scanner is supported, the text output will show a device name. What you need is
    the first element before the colon:


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_32_3.png)


    # 06 Calculate the crop


    Don''t worry rotating the documents at this stage. Install GIMP and your scanning
    package. Open the scanned document in GIMP and use the crop tool from


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_32_4.png)


    # 07 Use ImageMagick


    Use the package to install ImageMagick on your system. We can use the image-process
    with the convert command. We can use it to rotate and crop images. We can also
    use it to split pages. Note that use a single drag in front of options:


    ![](img/5ff17f60221cc9f68eff9bca50f06afb_32_5.png)


    # 03 Scan image


    Do a quick test of scanning by typing `scanimage -d [device name] --test.png`.
    This will scan one page file in graphics to check it. Add the `-v` option to default
    settings. If there are problems refer to


