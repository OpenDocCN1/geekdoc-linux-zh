    # 19 Edit in LibreOffice


    Simply copy and paste the output from the previous steps into LibreOffice Writer.
    You can then take control of the setting and manually edit section headers. Here
    you can import images from the original document.


    # 14 Double-sided documents


    If you have to scan double-sided documents, use the options as before, but add
    batch-double to increment the page numbers by two. For the other sides, do the
    same, but add batch-starts to make the numbering use.


    # 20 Export PDF from LibreOffice


    LibreOffice has built-in facilities for the creation of PDF files. When you have
    finished the layout and formatting, go to File>Export as PDF. Here, click Export
    and get your document


    # 17 OCR processing text


    Use the Bash command to OCR a full directory of scans: for in *.tiff doesseract;
    the result is a set of text files. You can then work with them using grep <text>
    [output file]


    # 21 Scryptable pdf


    If you install pdfscript and enscript, you can prepare the text file using the
    command: enscript -o [output file] [text file].pdf. Then convert the PostScript
    into a PDF by using pdfscript [ps file]


    # 18 Format text


    Tesseract will insert carriage returns in the same place as they occurred in the
    source. You can reformat the text with the following command fmt -u [output file]


    # 15 Convert to pdf


    You can use ImageMagick to convert a directory of scans into PDF: convert *.tiff
    output.pdf. If you need to add a header title, use page00.tiff in the directory.


