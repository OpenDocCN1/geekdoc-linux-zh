    Backing Up


    **Q: What do I need to back up?**

    A: There are a lot of graphical applications that can help you with backing up,
    although many dealing with backing up are tricky. If there''s a tough, the default
    backup is just enough to save your files. They can also have scheduling features,
    so you only need to set once.


    **Q: Where should I store my files?**

    A: Always use a USB storage device or networked computer if you have a drive or
    drive systems. If there''s a fire, they''re as safe as anything else. In this
    case an – you''ll also have easy access to your files in the future.


    **Q: Can i image the entire hard drive?**

    A: Yes you can, by using the ClzillaSystemClone tool. Clzilla can clone an entire
    hard drive, or just single partitions of it. These can be quite large, though,
