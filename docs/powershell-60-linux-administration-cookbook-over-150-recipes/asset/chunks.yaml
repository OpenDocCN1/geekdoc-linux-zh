  trans: "\n另一方面，CLIXML（或通用语言体系 XML）是一个完整的 .NET 对象。当一个 PowerShell 对象导出为 CLIXML 时，该对象将按其原样保留。也就是说，CLIXML\
    \ 保留了所有的属性（理论上具有任何深度）以及作为输出对象的一部分的方法。换句话说，可以说 CLIXML 导出在对象成员方面几乎是**无损**的。\n\n\
    # 另请参考\n\n食谱：使用 ASCII 字符生成随机文本\n\n# 使用变量和对象\n\n在本章中，我们将讨论以下主题：\n\n1. 使用环境变量\n\
    2. 存储 .NET Core 对象实例的输出\n3. 为对象创建自定义属性\n4. 从返回的对象创建自定义对象\n5. 理解数据类型的扩展\n6. 在不同会话之间保留对象的修改\n\
    7. 移除自定义类型数据\n\n# 序言\n\n变量对编程至关重要，因为它们充当程序执行期间存储的信息的容器。尽管管道（piping）让 PowerShell\
    \ 具有极高的通用性，但它们仍然取代变量，因为通过管道传递的对象必须立即被消费，而且考虑到我们多样的需求，并不是所有脚本都是这样运行的。\n\n我们都了解各种数据类型：`int`、`double`、`string`、`char`、`array`\
    \ 等。PowerShell 中另外两种重要的变量类型是 `hashtables` 和 `objects`。hashtable 是由键值对组成的字典表。正如我们所见，对象在\
    \ PowerShell 中可以非常复杂，也可以非常简单，持有不同类型的值。\n\n在 PowerShell 中，对象可以存储在变量中。例如，\n\n```\n\
    $Processes = Get-Process\n```\n\n这将所有进程存储在变量 `$Processes` 中。\n\n关于变量需要记住的另一点是作用域（scope）。默认情况下，变量具有局部作用域，这意味着它们在指定的函数内部有效。全局变量在整个程序中有效。通常，使用局部变量是最佳实践。\n\
    \n全局变量使用 `$Global:` 前缀声明和使用，例如 `$Global:MyVariable`。\n\n# 使用环境变量\n\n在这个食谱中，你将学习环境变量。当通过\
    \ Shell 会话与系统交互时，Shell 需要许多信息信息来确定程序访问权限、可用资源、默认配置、系统属性等。这些设置中的某些在系统内部以变量的形式进行配置，这些设置通常被称为环境变量（EnvironmentVariables）。\n\
    \n虽然在安装期间硬编码这些信息是一种方法，但它会让整个系统变成一个单体，如果不进行所谓的“推倒重装”（nuking-and-paving），就无法重新配置。通过环境变量，引入了另一层灵活性。\n\
    \n# 如何操作...\n\n让我们通过以下步骤开始使用环境变量：\n\n1. 要显示环境变量，输入 `Get-ChildItem env:` 或 `Get-Item\
    \ env:` 并按回车\n\n```\nPS> Get-ChildItem env:\nPS> Get-Item env:\n```\n\n2. `Env:`\
    \ 也是一个 PowerShell 提供程序，工作方式就像文件系统。因此，你也可以在 `Env:` 执行 `Set-Location` 并使用 `Get-ChildItem\
    \ .` 来列出系统中可用变量。\n\n3. 要显示特定环境变量的值，运行以下命令。\n\n```\nPS> Get-ChildItem Env:/PATH\
    \ | Select-Object value | Format-Table -Wrap\n```\n\n输入 `Get-ChildItem Env:/`\
    \ 后，你可以使用制表完成来填充所有环境变量。\n\n4. 对 `PATH` 环境变量执行 `Get-Member` 以找到其类型。\n\n5. 在更改环境变量之前，使用\
    \ `$env:PATH | Get-Member` 列出 `PATH` 变量。它是一个字符串。将内容保存在安全的地方。\n\n6. 现在，通过将 `sqlcmd`\
    \ 工具执行文件的路径添加到 `$env: PATH` 变量来更新 `PATH` 环境变量。该操作是将字符串添加到现有值。\n\n你可以向 `PATH` 添加任何位置。如果你坚持获取\
    \ `sqlcmd`，请前往 [Microsoft docs](https://docs.microsoft.com/en-us/sql/linux/sql-server-linux-setup-tools?view=sql-server-linux-2017)\
    \ 查看 SQL Server 2017 获取副本的说明。\n\n```\nPS> $env:PATH = $env:PATH + ':/opt/mssql-tools/bin'\n\
    PS /root> sqlcmd\n```\n\n上一个代码块的输出如图所示：\n\n![](img/1e6b48cb-4403-4d84-aac1-56e43f0a78b9.png)\n\
    \n7. 让我们退出会话，启动新会话，检查 `PATH` 变量并运行 `sqlcmd` 可执行文件。\n\n```\nPS> sqlcmd \n\nsqlcmd\
    \ : The term 'sqlcmd' is not recognized as the name of a cmdlet, function, script\
    \ file, or operable program.\n```\n\n# 工作原理...\n\n正如我们在*列出 PowerShell 中的各种提供程序*\
    \ 中所示，`Env` 是一个包含特定环境配置的提供程序。大多数配置选项也作为环境变量向我们开放。我们可以使用 `Get-ChildItem` 和 `Get-Item`\
    \ 命令来列出可用环境变量的值，因为 `Env:` 是 `Env` 提供程序中的一个驱动器。由于环境变量没有子项，`Get-Item` 和 `Get-ChildItem`\
    \ 返回相同的输出。\n\n由于这些变量决定了你的会话如何运行，因此对这些值进行的更改是瞬时的。也就是说， `$env:PATH` 的值是从你的 Linux\
    \ 计算机配置中获取的。在 PowerShell 会话中对 `$env:PATH` 进行的手更改只要 PowerShell 会话仍然有效。对 `$env:PATH`\
    \ 的更改不会更改系统内部的值。\n\n如果你想让某些更改永久生效，编辑 `.bashrc` 或 `~/.bash_profile` 配置文件。如果你想使用\
    \ PowerShell 代替 Bash，请在你的 PowerShell 配置文件中进行更改。关于如何执行操作的说明可以在*使用 PowerShell 准备管理*章节中的食谱——*启用每次加载时自动执行的命令*中找到。\n\
    \n# 更多内容...\n\n你还可以使用 .NET 类型加速器及其方法来访问环境变量。\n\n```\nPS> [environment]::GetEnvironmentVariable(\"\
    PATH\")\n```\n\n# 另请参考\n\n1. 关于环境变量：`Get-Help about_Environment_Variables` \n\
    2. 食谱 1.11：列出 PowerShell 中的各种提供程序\n3. 食谱 3.4：启用每次加载时自动执行的命令\n\n# 存储一个 .NET Core\
    \ 对象实例的输出\n\n.NET 是面向对象的，并基于类和对象工作。PowerShell 作为此框架的扩展，允许你与 .NET 框架和 COM 接口交互，以执行许多系统管理任务。通过这种方式，你不再局限于可以使用\
    \ cmdlet 执行的任务。\n\n在这个食谱中，我们将从 PowerShell 内部定义一个简单的类。\n\n# 准备工作\n\n我们建议在此食谱中使用\
    \ Visual Studio Code。如需了解如何安装和配置它，请访问*使用 PowerShell 准备管理* 章节中的食谱——*安装 Visual Studio\
    \ Code*。\n\n# 如何操作...\n\n启动 Visual Studio Code 并处理其提出的任何即时要求。\n\n1. 在 Visual Studio\
    \ Code 中打开一个新文件，并将文件类型设置为 PowerShell。\n2. 在脚本面板中输入以下内容。文件不需要保存。\n\n```\nclass\
    \ Person {\n    [string]$Name\n    [Int32]$Age\n    [int32]$Salary\n\n    Person\
    \ () {}\n\n    Person ([string]$Name, [int32]$Age) {\n        $this.Name = $Name\n\
    \        $this.Age = $Age\n    }\n\n    [int32] sal ([int32]$Salary, [int32]$Comm)\
    \ {\n        return $Salary * $Comm\n    }\n}\n```\n\n3. 要查找类的构造函数，调用静态方法 `New`；在提示符处输入以下。\n\
    \n```\nPS> [Person]::New\n```\n\n4. 这给了我们两个同名的函数；这些是重载定义。现在，通过传递参数创建一个新对象。\n\n"
- fmt: "\n```bash\nPS> [Person]::New('Prashanth',34) \n```\n\n![](Images/6134d77a-3052-4d39-b0ba-c260b5982fd6.png)\n\
    \n### 5. Now, let us invoke the constructor the PowerShell way, which in turn\
    \ calls the .NET constructor. This creates an instance of the `Person` class (which,\
    \ by definition, is an object).\n\n```bash\nPS> $Person = New-Object -TypeName\
    \ Person -ArgumentList 'Prashanth', 34\n```\n\n### 6. To list the properties of\
    \ the object (and by extension, the class), run the `Get-Member` cmdlet.\n\n```bash\n\
    PS> $Person | Get-Member \n\nPS> $Person | Select-Object Name, Age, Salary | Format-Table\
    \ -AutoSize \n\nPS> $Person.sal(200,2)\n```\n\n![](Images/8daf5696-50c8-40ac-b1f9-a9114d7c13b9.png)\n\
    \n### 7. Next, Let us take a look at the other samples. Let us use system-defined\
    \ class libraries.\n\n```bash\nPS> $MailClient = New-Object -TypeName System.Net.Mail.SmtpClient\
    \ 'packtpub.smtpdomain.com'\nPS> $Message = New-Object System.Net.Mail.MailMessage('pjayaram@packtpub.com',\
    \ 'pjayaram@packtpub.com', 'Subject', 'Welcome to Packt!')\nPS> $MailClient.Send($Message)\n\
    ```\n\n### 8. Let us see another example of password encryption using `System.Management.Automation`\
    \ class objects.\n\n```bash\nPS> $User = 'Prashanth' \nPS> $Password = 'Y94b^E$85CBLU%at'\
    \ \nPS> $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force\
    \ \nPS> $Credentials = New-Object -TypeName System.Management.Automation.PSCredential\
    \ -ArgumentList $User, $SecurePassword \nPS> $Credentials | Get-Member\n```\n\n\
    ![](Images/6cb687d1-a002-45c1-917f-d2a18d39014e.png)\n\n# How it works...\n\n\
    The goal of this recipe is to demonstrate how PowerShell works hand-in-hand with\
    \ .NET, and objects that are created the .NET way can be called (and stored) easily\
    \ in PowerShell. First, we declare a class with the keyword, `class`. We then\
    \ declare its parameters, and then, create two constructors: one default and one\
    \ parameterised.\n\nWe also create a method called `sal`. We define its return\
    \ type as `int32`, and defined two parameters. Within it, we define what needs\
    \ to be returned.\n\nBack at the PowerShell prompt, we call the static (method\
    \ of the class, not of an object) `New` method. The syntax is to mention the class\
    \ name, followed by two consecutive colons (`::`) to call it in the global namespace,\
    \ followed by the name of the method.\n\nIf you follow the steps, you'll also\
    \ see an example of using the two different system class libraries, `System.Net.Mail.SmtpClient`\
    \ and `System.Net.Mail.MailMessage`, and the instantiation of a method by integrating\
    \ the output of mail-message with the SMTP-client object.\n\nNext, we use the\
    \ system class library `System.Management.Automation.PSCredential`. In this example,\
    \ we send some text to `ConvertTo-SecureString` which takes input as plain text\
    \ and converts it to a secure string. Then, we pass the encrypted string to the\
    \ `PSCrendital` system class to store the user name and the secure string into\
    \ the `$Credentials` variable. \n\n# See also\n\n1. Recipe 3.1: Installing Visual\
    \ Studio Code\n\n# Adding custom properties to an object\n\nPowerShell cmdlets\
    \ are capable of allowing the administrators to work with most tasks. However,\
    \ there are some situations where the returned objects don't satisfy the administrative\
    \ needs of a certain script. In such situations, we may need to create our own\
    \ custom objects based on the available .NET classes, or at least, add a custom\
    \ property to the object.\n\nWhile a string is an object of `System. String` type,\
    \ the `Get-Process` cmdlet returns an object of type `System.Diagnostics.Process`,\
    \ `Get-ChildItem` returns an object with the type `System.IO.FileInfo`, a custom-created\
    \ object has the object type, `PSCustomObject`.\n\n# How to do it...\n\nLet us\
    \ now proceed to create a custom object.\n\n1. To create a custom object, use\
    \ `New-Object` cmdlet. \n\n```bash\nPS /home/PacktPub> New-Object -TypeName PSCustomObject\n\
    ```\n\n2. That was not of much use to us. Let us add a few properties into it,\
    \ along with their values and store these values in a variable.\n\n```bash\nPS>\
    \ $MyCustomObject = [pscustomobject]@{ \n  Name = 'Prashanth Jayaram'\n  Title\
    \ = 'PowerShell'\n  Publisher = 'Packt' \n}\n\nPS> $MyCustomObject\n```\n\n3.\
    \ To add properties to an object, use the `Add-Member` cmdlet.\n\n```bash\nPS>\
    \ $MyCustomObject | Add-Member -MemberType NoteProperty -Name 'Location' -Value\
    \ 'United States'\nPS> $MyCustomObject\n```\n\n4. To remove a property from an\
    \ object, use the following command.\n\n```bash\nPS> $MyCustomObject.PsObject.Properties.Remove('Location')\n\
    \nPS> # To see if the property is still available, run:\nPS> $MyCustomObject.Location\n\
    ```\n\n5. To access properties, you can use the member access operator (`.`).\n\
    \n```bash\nPS> $MyCustomObject.Name \nPrashanth Jayaram\n\nPS> $MyCustomObject.Title\
    \ \nPowerShell\n\nPS> $MyCustomObject.Publication \nPackt\n```\n\n# How it works...\n\
    \nCreating an object is straightforward. All you have to do is tell PowerShell\
    \ that you are creating a custom object, by calling the `[psobject]` accelerator\
    \ and specifying the properties you would like to add to the object. After the\
    \ accelerator is called, we specify the names of the properties, and assign values\
    \ to them. Records are added one at a time, using the hash literal notation (`Name\
    \ = 'Prashanth'`).\n\nIt is easy to confuse a hashtable with a PSObject at this\
    \ stage, given that we use the hash literal notation when creating the object.\
    \ Remember that they are very different from each other. We will get into the\
    \ details of what a hashtable is in the chapter, Arrays and Hashtables.\n\nWe\
    \ mention three properties in the custom object we have created: `Name`, `Title`\
    \ and `Publisher`. If we would like to add additional properties in the future,\
    \ we can simply use the `Add-Member` cmdlet, where we specify the object (we pass\
    \ the object through the pipeline), we specify the name of the property, and assign\
    \ a value to it.\n\nRemoving a property is a little more complex, since we do\
    \ not have a `Remove-Member` cmdlet, nor the members we use in the step easily\
    \ discoverable. For instance, `[PSCustomObject] | Get-Member` does not reveal\
    \ `PsObject` being its member. We call the `Remove` method within the `Properties`\
    \ object, which is within the `PSObject` object of the custom object we created.\
    \ (So many objects!)\n\nAccessing properties in an object is as simple as using\
    \ the member access operator with the property name.\n\n# See also\n\n1. Recipe:\
    \ Creating and initialising a simple hashtable\n\n# Creating a custom object from\
    \ a returned object\n\nWe now know how to create a custom object from scratch.\
    \ In this recipe, we will use a returned object, and modify the returned object\
    \ to create a custom object. When we look at loops, we will extend this capability\
    \ to create versatile custom objects; in production environments, this capability\
    \ can be used to do more!\n\n# How to do it...\n\nThe first step to learning something\
    \ is to simplify it. Therefore, we will select only one instance of an object\
    \ and work with it.\n\n1. Get all the processes, select only the name, ID, working\
    \ set and the start time, pick the 5th process in the list, and assign it to a\
    \ variable.\n\n```bash\nPS> $Process = (Get-Process | Select-Object Name, Id,\
    \ WS, StartTime)[4]\n```\n\n2. Let us say that we did not like the names of the\
    \ properties in the object. Let us change the names.\n\n```bash\nPS> $CustomProcess\
    \ = New-Object -TypeName PSObject -Property @{\n  ProcessName = $Process.Name\n\
    \  ProcessId = $Process.Id\n  WorkingSet = $Process.WS\n  StartedAt = $Process.StartTime\n\
    }\nPS> $CustomProcess\n```\n\n![](Images/a42cf4a5-4cb5-4112-9157-fd017a8d4192.png)\n\
    \n3. But that is not the sequence we specified. Let us get them in sequence.\n\
    \n```bash\nPS> $CustomProcess = [ordered]@{\n  ProcessName = $Process.Name\n \
    \ ProcessId = $Process.Id\n  WorkingSet = $Process.WS\n  StartedAt = $Process.StartTime\n\
    } \nPS> New-Object -TypeName PSObject -Property $CustomProcess\n```\n\n![](Images/609d4d23-847e-4300-9453-0071a046f302.png)\n\
    \n4. Recreate the object with information on how long the process has been running\
    \ for instead of when it was started.\n"
  raw: "```\nPS> [Person]::New('Prashanth',34) \n```\n\n![](Images/6134d77a-3052-4d39-b0ba-c260b5982fd6.png)\n\
    \n5.  Now, let us invoke the constructor the PowerShell way, which in turn calls\
    \ the .NET constructor. This creates an instance of the Person class (which, by\
    \ definition, is an object).\n\n```\nPS> $Person = New-Object -TypeName Person\
    \ -ArgumentList 'Prashanth', 34\n```\n\n6.  To list the properties of the object\
    \ (and by extension, the class), run the `Get-Member` cmdlet.\n\n```\nPS> $Person\
    \ | Get-Member \n\nPS> $Person | Select-Object Name, Age, Salary | Format-Table\
    \ -AutoSize \n\nPS> $Person.sal(200,2)\n```\n\n![](Images/8daf5696-50c8-40ac-b1f9-a9114d7c13b9.png)\n\
    \n7.  Next, Let us take a look at the other samples. Let us use system-defined\
    \ class libraries.\n\n```\nPS> $MailClient = New-Object -TypeName System.Net.Mail.SmtpClient\
    \ 'packtpub.smtpdomain.com'\nPS> $Message = New-Object System.Net.Mail.MailMessage('pjayaram@packtpub.com',\
    \ 'pjayaram@packtpub.com', 'Subject', 'Welcome to Packt!')\nPS> $MailClient.Send($Message)\n\
    ```\n\n8.  Let us see another example of password encryption using `System.Management.Automation`\
    \ class objects.\n\n```\nPS> $User = 'Prashanth' \nPS> $Password = 'Y94b^E$85CBLU%at'\
    \ \nPS> $SecurePassword = ConvertTo-SecureString $Password -AsPlainText -Force\
    \ \nPS> $Credentials = New-Object -TypeName System.Management.Automation.PSCredential\
    \ -ArgumentList $User, $SecurePassword \nPS> $Credentials | Get-Member\n```\n\n\
    ![](Images/6cb687d1-a002-45c1-917f-d2a18d39014e.png)\n\n# How it works...\n\n\
    The goal of this recipe is to demonstrate how PowerShell works hand-in-hand with\
    \ .NET, and objects that are created the *.NET way* can be called (and stored)\
    \ easily in PowerShell. First, we declare a class with the keyword, `class`. We\
    \ then declare its parameters, and then, create two constructors: one default\
    \ and one parameterised.\n\nWe also create a method called `sal`. We define its\
    \ return type as `int32`, and defined two parameters. Within it, we define what\
    \ needs to be returned.\n\nBack at the PowerShell prompt, we call the static (method\
    \ of the class, not of an object) `New` method. The syntax is to mention the class\
    \ name, followed by two consecutive colons (`::`) to call it in the global namespace,\
    \ followed by the name of the method.\n\nIf you follow the steps, you'll also\
    \ see an example of using the two different system class libraries, `System.Net.Mail.SmtpClient`\
    \ and `System.Net.Mail.MailMessage`, and the instantiation of a method by integrating\
    \ the output of mail-message with the SMTP-client object.\n\nNext, we use the\
    \ system class library `System.Management.Automation.PSCredential`. In this example,\
    \ we send some text to `ConvertTo-SecureString` which takes input as plain text\
    \ and converts it to a secure string. Then, we pass the encrypted string to the\
    \ `PSCrendital` system class to store the user name and the secure string into\
    \ the `$Credentials` variable. \n\n# See also\n\n1.  Recipe 3.1: Installing Visual\
    \ Studio Code\n\n# Adding custom properties to an object\n\nPowerShell cmdlets\
    \ are capable of allowing the administrators to work with most tasks. However,\
    \ there are some situations where the returned objects don't satisfy the administrative\
    \ needs of a certain script. In such situations, we may need to create our own\
    \ custom objects based on the available .NET classes, or at least, add a custom\
    \ property to the object.\n\nWhile a string is an object of `System. String` type,\
    \ the `Get-Process` cmdlet returns an object of type `System.Diagnostics.Process`, `Get-ChildItem` returns\
    \ an object with the type `System.IO.FileInfo`, a custom-created object has the\
    \ object type, `PSCustomObject`.\n\n# How to do it...\n\nLet us now proceed to\
    \ create a custom object.\n\n1.  To create a custom object, use `New-Object` cmdlet. \n\
    \n```\nPS /home/PacktPub> New-Object -TypeName PSCustomObject\n```\n\n2.  That\
    \ was not of much use to us. Let us add a few properties into it, along with their\
    \ values and store these values in a variable.\n\n```\nPS> $MyCustomObject = [pscustomobject]@{\
    \ \n  Name = 'Prashanth Jayaram'\n  Title = 'PowerShell'\n  Publisher = 'Packt'\
    \ \n}\n\nPS> $MyCustomObject\n```\n\n3.  To add properties to an object, use the\
    \ `Add-Member` cmdlet.\n\n```\nPS> $MyCustomObject | Add-Member -MemberType NoteProperty\
    \ -Name 'Location' -Value 'United States'\nPS> $MyCustomObject\n```\n\n4.  To\
    \ remove a property from an object, use the following command.\n\n```\nPS> $MyCustomObject.PsObject.Properties.Remove('Location')\n\
    \nPS> # To see if the property is still available, run:\nPS> $MyCustomObject.Location\n\
    ```\n\n5.  To access properties, you can use the member access operator (`.`).\n\
    \n```\nPS> $MyCustomObject.Name \nPrashanth Jayaram\n\nPS> $MyCustomObject.Title\
    \ \nPowerShell\n\nPS> $MyCustomObject.Publication \nPackt\n```\n\n# How it works...\n\
    \nCreating an object is straightforward. All you have to do is tell PowerShell\
    \ that you are creating a custom object, by calling the `[psobject]` accelerator\
    \ and specifying the properties you would like to add to the object. After the\
    \ accelerator is called, we specify the names of the properties, and assign values\
    \ to them. Records are added one at a time, using the hash literal notation (`Name\
    \ = 'Prashanth'`).\n\nIt is easy to confuse a hashtable with a PSObject at this\
    \ stage, given that we use the hash literal notation when creating the object.\
    \ Remember that they are very different from each other. We will get into the\
    \ details of what a hashtable is in the chapter, *Arrays and Hashtables*.\n\n\
    We mention three properties in the custom object we have created: `Name`, `Title`\
    \ and `Publisher`. If we would like to add additional properties in the future,\
    \ we can simply use the `Add-Member` cmdlet, where we specify the object (we pass\
    \ the object through the pipeline), we specify the name of the property, and assign\
    \ a value to it.\n\nRemoving a property is a little more complex, since we do\
    \ not have a `Remove-Member` cmdlet, nor are the members we use in the step easily\
    \ discoverable. For instance, `[PSCustomObject] | Get-Member` does not reveal\
    \ `PsObject` being its member. We call the `Remove` method within the `Properties`\
    \ object, which is within the `PSObject` object of the custom object we created.\
    \ (So many objects!)\n\nAccessing properties in an object is as simple as using\
    \ the member access operator with the property name.\n\n# See also\n\n1.  Recipe: Creating\
    \ and initialising a simple hashtable\n\n# Creating a custom object from a returned\
    \ object\n\nWe now know how to create a custom object from scratch. In this recipe,\
    \ we will use a returned object, and modify the returned object to create a custom\
    \ object. When we look at loops, we will extend this capability to create versatile\
    \ custom objects; in production environments, this capability can be used to do\
    \ more!\n\n# How to do it...\n\nThe first step to learning something is to simplify\
    \ it. Therefore, we will select only one instance of an object and work with it.\n\
    \n1.  Get all the processes, select only the name, ID, working set and the start\
    \ time, pick the 5th process in the list, and assign it to a variable.\n\n```\n\
    PS> $Process = (Get-Process | Select-Object Name, Id, WS, StartTime)[4]\n```\n\
    \n2.  Let us say that we did not like the names of the properties in the object.\
    \ Let us change the names.\n\n```\nPS> $CustomProcess = New-Object -TypeName PSObject\
    \ -Property @{\n  ProcessName = $Process.Name\n  ProcessId = $Process.Id\n  WorkingSet\
    \ = $Process.WS\n  StartedAt = $Process.StartTime\n}\nPS> $CustomProcess\n```\n\
    \n![](Images/a42cf4a5-4cb5-4112-9157-fd017a8d4192.png)\n\n3.  But that is not\
    \ the sequence we specified. Let us get them in sequence.\n\n```\nPS> $CustomProcess\
    \ = [ordered]@{\n  ProcessName = $Process.Name\n  ProcessId = $Process.Id\n  WorkingSet\
    \ = $Process.WS\n  StartedAt = $Process.StartTime\n} \nPS> New-Object -TypeName\
    \ PSObject -Property $CustomProcess\n```\n\n![](Images/609d4d23-847e-4300-9453-0071a046f302.png)\n\
    \n4.  Recreate the object with information on how long the process has been running\
    \ for instead of when it was started."
