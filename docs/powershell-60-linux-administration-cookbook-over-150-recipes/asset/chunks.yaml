    # 本书内容


    第 1 章，*安装、参考与帮助*，向管理员介绍了什么是 `.NET Core`、它的功能是什么、它如何在 Linux 中实现，并开始介绍 PowerShell。本章节包含了关于
    PowerShell 历史信息、它在类 Unix 系统上的实现，以及它与当前可用 shell 的区别。


    第 2 章，*介绍核心及其功能*，将引导读者了解如何安装 PowerShell、如何查阅文档、搜索信息、发现 cmdlet，以及挂载模块和提供程序以扩展 PowerShell
    的功能。


    第 3 章，*使用 PowerShell 准备管理*，高效管理的前提是有一个舒适的工作空间。在本章中，我们自定义了 `Terminal`，学习了 PowerShell
    的行为，并学习用 PowerShell 的方式思考以及使用 cmdlet 的各种方法。


    第 4 章，*使用 PowerShell 进行管理的第一步*，了解 PowerShell 的行为后，我们在本章从 PowerShell 中的基本工具开始，例如获取日期和计算返回的对象。我们将处理进程，并学习如何通过在
    PowerShell 中实现 `crontab` 来调度这些任务。


    第 5 章，*通过管道传递数据*，向读者介绍如何使用管道来利用 PowerShell 的面向对象模型。


    第 6 章，*使用变量和对象*，引导读者学习如何在脚本中有效地定义和使用变量。此外，本章深入探讨了 PowerShell cmdlet 返回的对象。


    第 7 章，*使用分支和循环进行流*，引导读者构建使用分支和循环的逻辑，这是脚本和函数的各种逻辑构建块。


    第 8 章，*处理字符串*，引导读者如何使用字符串为管理员提供服务。


    第 9 章，*执行计算*，将帮助读者在 PowerShell 中执行数学计算。


    第 10 章，*使用数组和哈希表*，让用户良好理解数组和哈希表在 PowerShell 中如何工作以及如何使用它们。


    第 11 章，*处理文件和目录*，引导读者了解使用 PowerShell 处理文件所需的所有知识。


    第 12 章，*构建脚本和函数*，引导用户创建脚本作为代码重用的手段。除了编写一系列无交互运行脚本的指令，本章还采用了交互脚本方法以实现更好的灵活性。函数是利用
    PowerShell 代码重用潜力的更好方法。本章还引入了函数概念，作为从仅仅编写脚本迈进的一步。


    第 13 章，*函数的高级概念*，展示了构建函数过程中下一步，并包含了有助于构建生产级函数的高级功能，这些函数具有 cmdlet 的所有功能，例如参数集和完整的帮助信息。


    第 14 章，*深入底层：调试与错误处理*，引导读者了解各种帮助脚本编写和管理员创建可靠脚本的选项。本章还向读者介绍了不同类型的错误、PowerShell
    中的错误以及优雅地处理它们。


    第 15 章，*处理环境*，向读者介绍 PowerShell 如何处理环境。读者将学习使用环境变量、了解命令是如何被调用的，以及其他让使用 PowerShell
    变得更容易的重要方面。


    第 16 章，*PowerShell 中的安全*，向读者介绍 PowerShell 中提供的安全功能以及如何开启和关闭它们。


    第 17 章，*使用 PowerShell 进行企业管理*，引导读者利用 PowerShell 的力量并开始使用 PowerShell 管理企业中的计算机。


    第 18 章，*最佳实践总结*，反复强调最佳实践以确保读者记住，并解释为什么它们被认为是最佳实践。


    第 19 章，*PowerShell 与云操作*，离开本地环境，查看我们如何使用可用选项管理 Azure 和 AWS 云平台。


    第 20 章，*使用 PowerShell 进行 SQL 数据库管理*，旨在教你使用 PowerShell 管理 SQL 服务器以及在上面执行开发活动。它包含了安装和配置程序，还涵盖了使用
    PowerShell 中的 SMO 库进行的基本数据库管理任务。


    # 目录


    # 前言


    《PowerShell 6.0 Linux Administration Cookbook》将带你全面了解 `.NET Core`、通用的 PowerShell，以及在
    Linux 上用于管理和自动化的 PowerShell。本书还将涵盖如何使用 PowerShell 以及管理 Docker 容器、云、VMware 和 SQL
    数据库的高级概念。


    # 安装、参考与帮助


    在本章中我们将涵盖以下食谱（示例）：


    1. 安装 PowerShell

    2. 在 PowerShell 中获取帮助信息

    3. 为特定 cmdlet 获取帮助信息

    4. 更新帮助

    5. 搜索关键词帮助

    6. 查找特定参数的帮助信息

    7. 探索 `about_` 话题

    8. 发现 cmdlet

    9. 查找模块

    10. 从存储库安装模块

    11. 列出 PowerShell 中的各种提供程序


    # 引言


    一切从在你的系统上安装 PowerShell 开始。安装 PowerShell 非常简单且直接。由于 PowerShell 是开源的，其源代码可以在认为是最大的开源项目平台
    GitHub 上获取。目前，Windows、Debian（以及 Ubuntu）、RedHat Linux（以及 CentOS）、Fedora 和 macOS
    均受 PowerShell 项目官方支持。Arch Linux 和 Kali Linux 由社区支持。对于 AppImage 版本的 PowerShell
    也有社区支持，该版本可以在大多数现代 Linux 发行版上运行。


    AppImage 是一种用于在 Linux 发行版上运行的应用程序打包方式。每个应用程序都有其依赖项。在 Linux 上，包管理器在安装包时管理依赖项的安装。而
    AppImage 包将所有必要的依赖项封装在内部。根据用户偏好，AppImage 可以便携模式运行，也可以安装到系统中。


    在编写本章时，PowerShell 在适用于 ARM 的 Windows 上以及 Raspbian Stretch 上实验性可用。


