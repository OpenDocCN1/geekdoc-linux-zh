    # Sorting the output


    It is time for another simple cmdlet, which would build towards the recipe, *Taking
    actions on the returned objects*. In this recipe, we will sort the output objects
    to meet our requirements.


    # How to do it...


    We will continue to use the directory and the files we created for the book. If
    all of your files are of zero bytes, download a few files with content. The file
    type does not matter.


    1.  List out the files in the directory.


    ```

    PS> Get-ChildItem -Path .

    ```


    2.  Filter the output to have only files.


    ```

    PS> Get-ChildItem -Path . -File

    ```


    3.  Pipe the object to the `Sort-Object` cmdlet to sort the output based on the
    file size.


    ```

    PS> Get-ChildItem -Path . -File | Sort-Object -Property Length

    ```


    4.  The shorthand for the expression would be:


    ```

    PS> gci . -File | sort Length

    ```


    5.  Sort the files, the largest file to the smallest file.


    ```

    PS> Get-ChildItem -Path . -File | Sort-Object -Property Length -Descending

    ```


    6.  Pick the largest three files in the lot.


    ```

    PS> Get-ChildItem -Path . -File | Sort-Object -Property Length -Descending -Top
    3

    ```


    7.  Create two files, and, using a text editor, add some content into both of
    them. (Or use the following script block to create some random text.)


    ```

    PS> $($i = 0; while ($i -lt 520) {(-join ((65..90) + (97..122) | Get-Random -Count
    8 | ForEach-Object {[char]$_})).ToString(); $i++}) -join '' '' | Out-File ./random-text-1.txt;
    Start-Sleep -Seconds 60; $($i = 0; while ($i -lt 500) {(-join ((65..90) + (97..122)
    | Get-Random -Count 8 | ForEach-Object {[char]$_})).ToString(); $i++}) -join ''
    '' | Out-File ./random-text-2.txt

    ```


    8.  Now, sort the files in the directory, first, by size, and then, the name.


    ```

    PS> Get-ChildItem -Path . -File | Sort-Object -Property Length, Name

    ```


    Observe the output that you get.


    9.  Sort the list in the descending order.


    ```

    PS> Get-ChildItem -Path . -File | Sort-Object -Property Length, Name -Descending

    ```


    ![](Images/98feda49-fc08-4af2-8a63-c814f055239c.png)


    # How it works...


    This recipe is another demonstration of passing objects through the pipeline.
    In the help documentation for `Sort-Object`, we see a parameter called `InputObject`.
    This parameter is a generic term used in PowerShell for a parameter whose input
    comes through the pipeline.


    `Sort-Object` accepts input from the pipeline, and sorts the content based on
    the property specified. If a property is not specified, the default property for
    the object output from the preceding command is used for sorting. If there are
    multiple properties are input, the sorting happens based on the order in which
    the properties are specified.


    Sorting can happen in the ascending order (default), or the descending order.


    # Taking actions on the returned objects


    We have been using the pipeline throughout this chapter to perform various activities
    on the objects. We have been passing objects from one cmdlet to another, and in
    fact, taking actions on the objects being returned. This recipe, in the technical
    sense therefore, is nothing new. However, in order to get ourselves more comfortable
    using the pipeline, and to show that the pipeline is not just used for selection,
    filtration and sorting, we will use the pipeline to also perform some deletions.


    # Getting Ready


    If you do not have files within the demo directory that we created, please go
    ahead and create some files. Make sure some of the files have some content in
    them.


    Let us say that you have been given a requirement. There is a certain team which
    would like the top two largest files of each type, deleted from a directory. If
    there is only one file of a certain type, that file has to be left alone.


    # How to do it...


    Here is an outline of the steps you would want to take:


    1.  Get all the files at the path specified.


    2.  Group the files by file type (extension).


    3.  Filter out those groups that contain more than one item.


    4.  Expand each group, sort the files by size (length).


    5.  Pick the two largest files in each group.


    6.  Delete the files.


    While we are working on a sandbox directory, and that we are taking precautions
    not to delete anything important, it is still better to only prototype the action
    using ShouldPerform (the WhatIf parameter). This way, the files would not be actually
    deleted, but PowerShell would only tell you what it would do if the command is
    run.


    Let us get cracking.


    1.  List the contents of the current directory and group the output based on the
    extension.


    ```

    PS> Get-ChildItem -Path . -File | Group-Object -Property Extension

    ```


    2.  Filter to discard lone files of each extension.


    ```

    PS> Get-ChildItem -Path . -File | Group-Object -Property Extension | Where-Object
    Count -GT 1

    ```


    3.  Now comes a loop construct. We will look at how that works in a future chapter.
    For now, just know that it works. The goal here is to only leverage the pipeline.


    ```

    PS> Get-ChildItem -Path . -File | Group-Object -Property Extension | Where-Object
    Count -GT 1 | ForEach-Object {$_.Group | Sort-Object Length -Bottom 2}

    ```


    ![](Images/c1ae6403-f6e6-48bf-a8cb-188092d3f16e.png)


    4.  Delete these files using the `Remove-Item` cmdlet. Use the `WhatIf` switch
    if you do not want the files actually deleted.


    ```

    PS> Get-ChildItem -Path . -File | Group-Object -Property Extension | Where-Object
    Count -GT 1 | ForEach-Object {$_.Group | Sort-Object Length -Bottom 2} | Remove-Item
    -WhatIf

    ```


    # How it works...


    When any cmdlet reads an object through the pipeline, it reads the entire contents
    of the object. And any cmdlet that is designed to accept input through the pipeline
    picks the right property from the object, and then takes actions on the objects.
    In the case of this recipe, it was the `Path` property that was picked in order
    to identify the files to delete.


    To know if a certain cmdlet accepts input from the pipeline, run `Get-Help` on
    the cmdlet with the `Full` parameter, and see if the value for `Accept pipeline
    input?` is true. The `InputObject` parameter of `Where-Object`, or the `Path`
    parameter of `Move-Item` are a couple of examples.


