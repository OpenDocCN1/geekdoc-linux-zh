    .

    about_Wildcards                   HelpFile

    ```


    3.  Pick out the topic you''d like to read about—we pick `about_Modules`.


    4.  Enter `Get-Help about_Modules` to read up on PowerShell modules.


    ```

    ABOUT MODULES


    Short Description

    Explains how to install, import, and use PowerShell modules.


    Long Description

    A module is a package that contains PowerShell commands, such as cmdlets,

    providers, functions, workflows, variables, and aliases.


    People who write commands can use modules to organize their commands and

    share them with others. People who receive modules can add the commands in

    the modules to their PowerShell sessions and use them just like the

    built-in commands.

    .

    .

    .

    How to Find the Commands in a Module


    Use the Get-Command cmdlet to find all available commands. You can use the

    parameters of the Get-Command cmdlet to filter commands such as by module,

    name, and noun.

    .

    .

    .

    The following modules (or snap-ins) are installed with PowerShell. *

    CimCmdlets * Microsoft.PowerShell.Archive * Microsoft.PowerShell.Core *

    Microsoft.PowerShell.Diagnostics * Microsoft.PowerShell.Host *

    Microsoft.PowerShell.Management...

    ```


    # How it works...


    `Get-Help` gives you information about cmdlets if the cmdlet is passed as an argument.
    In cases where you know only a part of the name of the cmdlet, you can use a combination
    of characters and wildcards to list out cmdlets that match the search string (`about_*`
    in our case).


    Now, we pick the topic we would like to read about and enter that specific `about_`
    topic. Now, `Get-Help` shows the complete documentation about the topic.


    # How to do it...


    Get-Command can help determine the best cmdlet for a task. To find cmdlets, follow
    the steps below:


    1.  At the Terminal, type `pwsh` to invoke PowerShell.


    2.  Enter Get-Command to get a list of all cmdlets available in PowerShell. The
    number of cmdlets returned would change based on when you last updated PowerShell
    and the modules you''ve loaded.


    ```

    PS> Get-Command

    ```


    This may not be particularly useful—what would you do with a list of commands
    if you were looking for something to list out the currently-running processes?


    3.  A process is a noun. We want a list of cmdlets that work on *processes*. At
    the prompt, type:


    ```

    PS> Get-Command -Noun Process

    ```


    Note that in PowerShell, the noun is in the singular form. Therefore, it''s Process
    and not Processes.


    4.  If you would like to further narrow down the list of cmdlets returned, add
    the verb as well.


    ```

    PS> Get-Command -Verb Get -Noun Process

    ```


    5.  If you''re feeling lazy, or unsure of the exact conventions, you could even
    use the wildcard.


    ```

    PS> Get-Command -Noun Proc*

    ```


    6.  If you''d rather not write so much, and you''re almost sure you know the partial
    cmdlet, you can straight away use wildcard search.


    7.  If you know the name of the module which contains the cmdlet, you can even
    use the Module parameter when invoking `Get-Command`.


    ```

    PS> Get-Command -Noun Process -Module Microsoft.PowerShell.Management

    ```


    # How it works...


    PowerShell has the capability to identify the verb and the noun in cmdlets, based
    on the first occurrence of hyphen. Anything that appears before the first hyphen
    is the verb, and anything that appears after, is the noun. When cmdlets are loaded
    from modules, PowerShell identifies the verbs and the nouns in them. The search
    promptly returns the cmdlets based on the search specifications. Filters based
    on the name of the verb, noun or even the module restrict the search accordingly.


    # Finding Modules


    Loosely coupling the components is one of the keys to success of a framework.
    PowerShell follows this principle as well. All cmdlets are packaged within modules.
    The modules can be first-party-provided, created by you, or even third-party-created.


    Installation of modules, which could''ve been a hassle in the past, has been streamlined
    today. PowerShell now comes pre-packaged with a package manager called, `PowerShellGet`,
    that connects to the PowerShell gallery ([https://www.powershellgallery.com](https://www.powershellgallery.com)).
    The PowerShell gallery is an online repository that contains modules, scripts
    and other utilities that administrators can download and install in order to extend
    PowerShell''s capabilities.


    While it is possible to download PowerShell modules from third-party sites, our
    focus in this book would be the PowerShell repository.


    # How to do it...


    To find modules in the PowerShell repository, follow these steps:


    1.  Launch PowerShell by running `pwsh` on the Terminal.


    2.  Look for the command pertaining to modules.


    ![](Images/98edfcda-d148-4d35-a041-807f5ddd86f9.png)


    Notice the list of commands available to work with modules. Some of them are of
    the cmdlet type, while others are functions.


    3.  Filter the output further, using the verb.


    ```

    PS> Get-Command -Noun Module -Verb Find

    ```


    You get `Find-Module` as the output.


    4.  Enter the following to list out all the modules.


    ```

    PS> Find-Module

    ```


    The list begins to appear. The search results are way too many. Press `Ctrl +
    C` to abort the execution.


    5.  Search for a module to help you work with Docker containers.


    ![](Images/788be588-8afd-4bb8-9de4-0fe6ccba964e.png)


    # How it works...


    Hundreds of modules, scripts and Desired State Configuration resources have been
    registered with the `PSGallery` repository. Microsoft now recommends using the
    repository for module management. Using the `Find-Module` cmdlet, PowerShell makes
    a connection to the repository and gets a list of all available modules. Then,
    it runs a search on the returned results based on the criteria you mention.


    You can also similarly find scripts that can perform repetitive tasks. To find
    scripts, use the `Find-Script` cmdlet. It works similar to the `Find-Module` cmdlet,
    except that it finds individual scripts rather than modules.


    # Installing Modules from the Repository


    Now that we know how to find modules, we can proceed with getting modules and
    installing them. All cmdlets pertaining to `PowerShellGet` are packaged in the
    module called, `PowerShellGet`.


    # How to do it...


    We now know the name of the module that would let us manage our Docker infrastructure.
    Let us now try to install the module.


    1.  Installation of modules may require elevated privileges. Open PowerShell with
    `sudo`.


    ```

    $ sudo pwsh

    ```


    2.  Now run the following command to install the Docker module from the repository.


    ```

    PS> Install-Module Docker

    ```


    ![](Images/b41b716d-f624-482c-8474-96b30d3b2e87.png)


    3.  In some cases, you may want to save the module locally before you install
    it.


    ```

    PS> Save-Module Docker ~/PsModules

    ```


    This way, you can simply import the module in portable mode and run the cmdlets
    without having to install the module in any of the system directories.


    4.  To import the downloaded module, run:


    ```

    PS> Import-Module ~/PsModules/Docker/1.3.2/Docker.psm1

    ```


    5.  To update the installed module, run:


    ```

    PS> Update-Module Docker

    ```


    6.  To remove an installed module, run:


    ```

    PS> Uninstall-Module Docker

    ```


    Most of these functionalities work with scripts published to the PowerShellGet
    repository as well. Just replace Module with Script in the cmdlet and that should
    do the trick—you can find, save, install, update and uninstall scripts the same
    way you do modules.


    Downloaded scripts need not necessarily be installed; they can be directly called.
    We will see this in the later sections.


    # How it works...'
