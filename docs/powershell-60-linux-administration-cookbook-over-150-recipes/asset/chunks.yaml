    \ $CurrentDay.AddDays(7)\n\nWrite-Output \"Mothers’ Day falls on $($MothersDay.ToLongDateString()).\"\
    \n```\n\n4. Run the script. Enter any year and you should get the date for Mothers’\
    \ Day for that year.\n\n# How it works...\n\nEvery finite looping construct requires\
    \ three things:\n\n1. The starting point\n2. The stopping point\n3. The way to\
    \ proceed towards the stopping point\n\nIn case of the `Foreach` construct, the\
    \ entire logic is pre-coded. It takes an entire array, finds the starting and\
    \ stopping points, and moves towards the stopping point one step at a time. The\
    \ `For` construct has these parameters declared in the loop declaration statements\
