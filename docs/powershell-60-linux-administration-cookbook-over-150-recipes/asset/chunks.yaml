  trans: "\n\n3. 处理当前运行的进程以测量资源消耗\n4. 启动和停止进程\n5. 查找进程的所有者\n6. 根据文件类型调用应用程序\n7. 安装\
    \ CronTab 模块\n8. 在 PowerShell 中调度任务\n9. 在 PowerShell 中删除调度任务\n\n# 简介\n\n根据《哈佛商业评论》，一种有效的学习方法是在由于“信息盛宴”和“信息禁食”之间循环。鉴于我们已经熟悉了相关内容（也许可能对上一章的内容量有些不知所措），我们将用更轻量的方法开始使用\
    \ PowerShell 进行管理的第一步。\n\n到为止，我们已经学习了如何运行命令项（cmdlet）、它们的参数是什么、如何设置和使用别名等。在本章中，我们将学习如何使用一些基础工具、处理进程以及调用应用程序。\n\
    \n此外，尽管书名写的是 Linux，但书中的大多数配方在 Windows 上也应该可以运行（尤其是 Windows 上的 PowerShell 6.0）；可能需要进行微小的修改，例如在路径中使用反斜杠。\n\
    \n# 处理日期属性\n\n学习 PowerShell 的最佳方法是从简单的 cmdlet 开始。`Get-Date` 是 PowerShell 中存在的最简单但尚未被完全利用的\
    \ cmdlet 之一。在这个配方中，我们将玩转日期，看看它们如何在不同场景下使用。一如既往，PowerShell 的可能性远比一本书能涵盖的多。为了简洁起见，我们只查看足够的内容，让你能够优雅地进入\
    \ PowerShell 自动化世界；其余部分你将自己处理。\n\n# 准备工作\n\n如果你遵循了之前的章节并执行了其中提到的所有练习，那么你已经准备就绪了。否则，请“安装参考与帮助”章节并获取一份\
    \ PowerShell。回到这里继续。此配方仅使用终端，因此不需要其他任何。\n\n# 如何操作……\n\n在我们开始处理日期之前，让我们先简单地调用一次日期。\n\
    \n1. 显示当前的日期和时间。\n\n```\nPS> Get-Date\n\nSaturday, 16 June 2018 12:14:07\n```\n\
    \n2. 找出此返回对象拥有哪些成员。\n\n```\nPS> Get-Date | Get-Member\n```\n\n![](img/2fa6a427-d4fb-4f66-a683-816c5e5d09d4.png)\n\
    \n一大堆属性和方法。\n\n3. 尝试显示类似 16/06/2018 的日期。\n\n```\nPS> $Date = Get-Date\nPS> \"\
    $Date.Day/$Date.Month/$Date.Year\"\n```\n\n![](img/5e6589ce-2bd7-48fd-83f3-13864445c379.png)\n\
    \n颜色看起来不对。\n\n4. 按照如下方式更改命令。根据你的终端主题，语法现在看起来应该更好看了。（暂时不要担心为什么这种变化有效；我们稍后处理变量时会考虑这个问题。）\n\
    \n```\nPS> \"$($Date.Day)/$($Date.Month)/$($Date.Year)\"\n16/6/2018\n```\n\n但这费了很大精力。有更简单的方法吗？\n\
    \n5. 查看帮助以查看你可以获得哪些参数。\n\n```\nPS> Get-Help Get-Date\n```\n\n有一个 `Format` 参数。\n\
    \n6. 输入以下内容以获取短日期。\n\n```\nPS> Get-Date -Format d\n```\n\n尝试使用以下值作为 `Format`：`g`、`U`、`yyyy/MM/dd`\
    \ 和 `yyyyMMddhhmmss`。\n\n![](img/58296173-4b02-41ea-881a-9f97745811eb.png)\n\n\
    7. 如果你更习惯 UNIX 日期格式，请使用 `Uformat` 参数。\n\n```\nPS> Get-Date -Uformat %d/%m/%Y\n\
    ```\n\n让我们再进一步，向系统传递一个自定义日期并从中获取一些信息，利用了 `Get-Date` 输出对象的成员。\n\n8. 查找 2018 年万圣节是星期几。\n\
    \n```\nPS> (Get-Date -Day 31 -Month 10 -Year 2018).DayOfWeek \nWednesday\n```\n\
    \n9. 如果你了解本地区域日期的工作原理，按如下方式传递日期并获取相同的信息。\n\n```\nPS> (Get-Date 31/10/2018).DayOfWeek\n\
    ```\n\n10. 如果你记得类型加速器（Type Accelerators）的概念，请使用它来获取你需要的信息。\n\n记住在调用 `DateTime`\
    \ 加速器时使用 YMD 或 MDY 格式，以避免错误。\n\n```\nPS> ([datetime]'10/31/2018').DayOfWeek\n\
    ```\n\n为了避免歧义，请写出月份。\n\n```\nPS> ([datetime]'31 October 2018').DayOfWeek\n```\n\
    \n# 工作原理……\n\n.NET 中的 `System.DateTime` 类封装了足够数量属性和方法。`Get-Date` 命令项通过封装利用了这些属性和方法。`Get-Date`\
    \ 默认获取系统的当前日期和时间，并允许你从中挑选子对象，或快速地将它们组合成格式。\n\n除了这些操作外，该命令项还允许你传递像日期和时间的简单字符串，并将输入字符串转换为\
    \ `DateTime` 对象。\n\n虽然 `Get-Date` 考虑了你当前的本地区域，但类型加速器 `DateTime` 似乎作用于 YMD- 或 MDY-\
    \ 格式的日期-时间。\n\n# 另请\n\n1. [DateTimeFormatInfo](https://msdn.microsoft.com/library/system.globalization.datetimeformatinfo.aspx#Remarks)\
    \ 类 | 备注 (Microsoft Developer Network)\n\n2. 配方 2.3：从文本解析输入为对象（类型加速器）\n\n# 处理日期和时间函数\n\
    \n在上一个配方“处理日期属性”中，我们关注了 `DateTime` 对象拥有的属性。我们在 `Get-Date` 中看到的参数也适用于这些属性。在当前配方中，我们将查看\
    \ `DateTime` 对象内部的方法，并学习如何利用它们来为我们服务。不过，这个配方的核心思想是让你习惯于使用输出对象的一部分的方法。\n\n# 如何操作……\n\
    \n让我们先从将本地时间转换为 UTC 开始。\n\n1. 在提示符处输入 `Get-Date` 并列出输出对象的成员。\n\n```\nPS> Get-Date\
    \ | Get-Member\n```\n\n2. 有一个方法叫做 `ToUniversalTime`。调用该方法。\n\n使用 Tab 补全减少按键次数。\n\
    \n```\nPS> (Get-Date).ToUniversalTime()\n```\n\n将输出与你的本地时间进行比较。\n\n3. 接下来，让我们看看今天三十五天后准确是星期几。\n\
    \n```\nPS> (Get-Date).AddDays(35)\n```\n\n4. 如果你想看三小时十八分钟后是几点钟：\n\n```\nPS> (Get-Date).AddHours(3).AddMinutes(18)\n\
    ```\n\n5. 接下来，找出自 2016 年世界环境日以来过了多少天。\n\n```\nPS> (Get-Date).Subtract((Get-Date\
    \ '5 June 2016'))\n```\n\n![](img/f40255e1-1726-409d-ab88-f5eae036a3b.png)\n\n\
    # 工作原理……\n\n`Get-Date` 返回的对象像拥有属性一样也拥有若干个方法。在这个配方中，我们使用这些方法按照我们需要的方式来操作日期。方法是带有参数调用的。当你不想指定任何参数时，仍要使用一对空括号来调用方法。\n\
    \n方法可以像我们添加小时和分钟那样进行链式调用。只要输出对象不改变，在大多数情况下，你都应该通过链式调用调用该对象的方法。例如，如果你在第一个方法中将日期对象转换为字符串，那么第二个方法应该是一个支持字符串输入的方法。如果有疑问，对输出使用\
    \ `Get-Member` 命令项以查看它支持哪些方法。\n\n`Subtract` 方法接受 `DateTime` 作为其参数。将命令项的输出作为参数传递给方法需要将命令项连同传递的参数封装在额外的括号内——`Subtract((Get-Date\
    \ '5 June 2016'))` 而不是 `Subtract(Get-Date '5 June 2016')`——这样内部命令会先执行以获取值，然后传递给方法。\n\
    \n"
- fmt: '

    A good chunk of administration involves working with processes on a given computer.
    PowerShell contains `cmdlets` that enable you to work with processes on a computer.
    In this recipe, we will list out all the processes running in the system, and
    fetch the amount of resources the processes are collectively consuming.


    In the following chapter, *Passing data through pipelines*, we would look at other
    options such as filtration and so on, using what we learn in this recipe.


    # How to do it...


    As we already discussed, our goal here is to work with processes.


    1. List out the `cmdlets` that help you work with processes.


    ```

    PS> Get-Command -Noun Process

    ```


    Remember that PowerShell uses only singular nouns.


    We get five `cmdlets`. What we initially need is `Get-Process`.


    2. Run the `cmdlet` to see what it shows.


    ```

    PS> Get-Process

    ```


    The output is a long table of processes, the memory they are consuming, the CPU
    time they are using, etc.


    3. Get the total count of processes currently running in the system.


    ```

    PS> (Get-Process).Count

    ```


    4. Now, fetch the average of the pages of memory used by the processes. The term
    for this is Working Set, denoted as `WS`.


    ```

    PS> Get-Process | Measure-Object -Property WS -Average

    ```


    5. There are other fields in the hash table as well. Let us get all of that information.


    ```

    PS> Get-Process | Measure-Object -Property WS -Average -Sum -Minimum -Maximum

    ```


    6. Get the average, sum, minimum and maximum for both, the working set, as well
    as the CPU.


    ```

    PS> Get-Process | Measure-Object -Property WS, CPU -Average -Sum -Minimum -Maximum

    ```


    ![](Images/4352fcb8-f849-4aa5-8832-54d1d1d7f056.png)


    # How it works...


    The `cmdlet`, `Get-Process`, gives out an entire table of all the processes running
    in the system. Think of each row as an individual object, and the entire table
    as an array of these rows. `Count` (or in other words, `length`) is, logically,
    a property of an array. Therefore, we call the `cmdlet`, and on the object that
    is output, we run a counting operation. This gives us how many processes are running
    in the system at the moment.


    The next `cmdlet` we see is an important one, as: `Measure-Object`. This `cmdlet`
    is designed to perform measurements on the objects that are output. In our case,
    we pick the property, `WS` to perform measurements on. If no property is specified,
    PowerShell will pick the property based on its definition in the output object.


    `Measure-Object` is capable of performing some neat arithmetic calculations on
    the output object. We use this capability of the `cmdlet` to fetch the average
    first, and then, the sum, the minimum value, and the maximum value as well. The
    `Property` parameter accepts a string array as input (`Get-Help Measure-Object
    -Parameter Property`). Therefore, we specify `WS` as well as `CPU` (separated
    by commas) in the `cmdlet`, and then perform the measurement operation.


    # Launching and stopping a process


    All pro-terminal administrators launch and stop processes from the terminal all
    the time. This usually happens at the terminal prompt on Bash. With PowerShell,
    the process is not very different. This recipe will show you how to work the processes.
    And by the way, this recipe where you go on a full information fast.


    # Getting Ready


    Open VS Code. If the status bar at the bottom is blue, chances are that a folder
    is open in VS Code. VS Code saves the location it is open at, and so, even if
    you start a session of VS Code after a fresh reboot, you would still see a folder
    open. We need the folder closed. To do this, press `Ctrl + Shift + N` (or go to
    `File > New Window`). Close the window where a folder is open.


    # How to do it...


    If you listed out the commands in the previous recipe, scroll up to find what
    `cmdlets` might help you with this recipe.


    1. At the prompt, type in the following to start Visual Studio Code.


    ```

    PS> Start-Process code

    ```


    Ensure that the status bar at the bottom is not blue. If it is blue, read the
    *Getting Ready* section of this recipe. Press `Ctrl + Shift + E` or click on Explorer
    icon on the left sidebar of VS Code. There should not be any directory open there.


    2. Open VS Code at the directory you created the `hello-world` script.


    ```

    PS> Start-Process code -ArgumentList /home/ram/Documents/code/github/powershell/

    ```


    Press `Ctrl + Shift + E` or click on Explorer icon on the left sidebar of VS Code.
    Do you see the directory open?


    Now, let us stop the VS Code process.


    3. List out the processes running in the system and see if anything matches `code`.


    ```

    PS> Get-Process | grep code

    ```


    4. If you want the PowerShell way of doing it, run the following command and note
    the name in the `ProcessName` column:


    ```

    PS> Get-Process *code*

    ```


    5. PowerShell deals with objects; `grep` outputs text. Therefore, now that we
    know that the exact name of the process is `code`, we directly get details on
    the process.


    ```

    PS> Get-Process code

    ```


    That gives us a valid output.


    6. Stop all the `code` processes.


    ```

    PS> Stop-Process code

    ```


    That would not work; the `cmdlet` accepts a `System.Diagnostics.Process` object
    as input.


    7. Enclose `Get-Process` within parentheses and pass the input to `Stop-Process`.


    ```

    PS> Stop-Process (Get-Process code)

    ```


    8. Now, see if there is a `code` process running any more.


    ```

    PS> Get-Process code

    ```


    ![](Images/d4e99014-7a79-4f58-9d80-a711853638b3.png)


    The best way of stopping a process is using its ID.


    9. I am running `dconf-editor` on my PC right now, and would like to close it.
    You may choose any process to stop; play safe, though.


    ```

    PS> Get-Process dconf-editor

    PS> Stop-Process -Id 20608

    ```


    # How it works...


    The `cmdlet`, `Start-Process`, works with paths. In case of `code`, though, Linux
    knows the path where the package is installed. Therefore, simply calling the package
    by "command" is sufficient.


    The VS Code process accepts directory/file location as an input. Therefore, we
    add the `ArgumentList` parameter and pass the path to the process as an argument.
    This opens that directory in VS Code.


    Stopping a process requires a .NET object as input by default; `Stop-Process`
    would not accept string as the default input. Therefore, we enclose the `Get-Process`
    `cmdlet` within parentheses, so that it gets executed first and outputs a `System.Diagnostics.Process`
    object, which is then processed by `Stop-Process`.


    In order to be exact with respect to which process we would like to stop, we use
    the Process ID, and pass it as the argument to `Stop-Process`.


    # Finding the owner of a process


    In the recipe, *Working with currently-running processes…*, we listed out the
    processes running in the system. The table did not show us the process owner.
    In this recipe, we look at working with processes started by a certain owner.


    # How to do it...


    The `Get-Process` `cmdlet` can fetch us this information.


    1. At the prompt, type the following to get all the parameters that the `Get-Process`
    `cmdlet` accepts.


    ```

    PS> Get-Help Get-Process

    ```


    2. We see a parameter `IncludeUserName` (the name suggests it is a switch parameter).
    Get more information on it.


    ```

    PS> Get-Help Get-Process -Parameter IncludeUserName

    ```


    ![](Images/c0afced1-67c8-48e2-bb2a-faff5025c2b6.png)


    3. Run the command:


    ```

    PS> Get-Process -IncludeUserName

    ```


    4. Filter out the processes started by you. We will use `grep` for this operation,
    until we learn how to filter in PowerShell.


    ```

    PS> Get-Process -IncludeUserName | grep ram

    ```


    5. Count the number of processes running under your name.


    ```

    PS> (Get-Process -IncludeUserName | grep ram).Count

    ```


    6. If you would like to use the `Measure-Object` `cmdlet`, you can.


    ```

    PS> Get-Process -IncludeUserName | grep ram | Measure-Object

    ```


    7. Let us now see how what amount of working set all of the processes started
    by you consume.


    ```

    PS> Get-Process -IncludeUserName | grep ram | Measure-Object -Property WS -Sum

    ```


    ![](Images/ca96880c-e0ef-4261-9578-d0b31a8234e2.png)


    There is an error.

    '
