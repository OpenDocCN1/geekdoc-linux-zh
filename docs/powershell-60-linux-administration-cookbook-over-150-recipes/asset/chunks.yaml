    \       Templates\nd-----          4/20/18   6:36 AM                Videos\n```\n\
    \nThat is the output that we are familiar with–the output of `Get-ChildItem`.\n\
    \nAliases are ephemeral by default. They exist only as long as your PowerShell\
    \ session exists. To use custom aliases without having to recreate them each time,\
    \ export these aliases (the instructions for which are in the next recipe) and\
    \ import them using your PowerShell profile. We will understand profiles in a\
    \ later chapter.\n\n# How it works...\n\nAliases, as already mentioned, are pointers\
    \ to cmdlets. Using `New-Alias`, you create a pointer with a custom name, that\
    \ points to the desired PowerShell cmdlet. This is simply a Name–Value pair.\n\
    \nWhen you run anything on PowerShell, PowerShell checks its list of cmdlets and\
    \ aliases (among other definitions) to understand what you are asking for. When\
    \ PowerShell encounters an alias, it looks for which cmdlet it points to, and\
    \ runs the cmdlet.\n\n# There's more...\n\nYou can add more content to your aliases,\
    \ such as descriptions. Refer the help documentation for `Get-Alias` to see what\
    \ more you can do with aliases.\n\n# See also\n\n1.  Recipe 3.8: Understanding\
    \ cmdlets and parameters\n\n2.  Recipe 2.8: Importing/Exporting custom aliases\
    \ for future use\n\n3.  Recipe 3.4: Enabling automated execution of commands for\
    \ each load\n\n# Export/Import Custom Aliases for Future Use\n\nAliases being\
    \ ephemeral, in spite of its advantages and the intended use of aliases, could\
    \ be seen as an inconvenience. In order that aliases can be reused, they need\
    \ to be exported to a file and later, imported when needed. This recipe will show\
    \ you how to export and import the aliases you may have created.\n\n# Getting\
    \ Ready\n\nYou need custom aliases already created for this process to be effective.\
    \ If you don't have custom aliases created, the export action would only export\
    \ the default aliases, which would be loaded with PowerShell anyway.\n\nGo to\
    \ the previous recipe to create at least one custom alias.\n\n# How to do it...\n\
    \n1.  Ensure that your custom alias exists and runs properly. One way of doing\
    \ this is to get details about the alias you created.\n\n```\nGet-Alias listdir\n\
    ```\n\n2.  Export all of the aliases loaded on your session to a file.\n\n```\n\
    Export-Alias aliases.csv\n```\n\nCSV is the default file type. The import that\
    \ we would see in the coming steps understands CSV and make the necessary associations.\n\
    \n3.  It is also possible to export the aliases as a script. This way, PowerShell\
    \ will create a script that would contain the New-Alias cmdlet for each of the\
    \ aliases in the export.\n\n```\nExport-Alias aliases.ps1 -As Script\n```\n\n\
    4.  Look at the contents of each of the files created; the CSV file first, and\
    \ then the script.\n\n```\nGet-Content ./aliases.csv\n```\n\n![](Images/56717d30-2937-4bac-89c4-634503efc8e8.png)\n\
    \n```\nGet-Content ./aliases.ps1\n```\n\n![](Images/bdf72b32-a228-470f-ac21-ad35d4e8013a.png)\n\
    \n5.  Optionally, edit the file to remove all the aliases except the ones you\
    \ created. The custom aliases can be found at the bottom of the list.\n\nThis\
    \ concludes exporting aliases.\n\nLet us now import aliases into our PowerShell\
    \ session.\n\n1.  Restart PowerShell.\n\n2.  See if the alias, `listdir`, that\
    \ you created exists.\n\n```\nGet-Alias listdir\n```\n\n3.  Now, import the aliases.\n\
    \n```\nImport-Alias ./aliases.csv\n```\n\nYou may receive several errors, each\
    \ saying that the new alias could not be created since the alias already existed.\
    \ There are two ways to handle this: the first is to remove the default aliases\
    \ from the export file (which is recommended), and the second is to use the `-Force`\
    \ parameter (this may still result in errors, but they would be significantly\
    \ fewer).\n\nIf you exported the aliases as a script, simply call the script.\n\
    \n```\n./aliases.ps1\n```\n\n# How it works...\n\nThe script way is straight-forward:\
    \ the cmdlets are run one after the other and the aliases are created in the system\
    \ just like how you created them manually.\n\nWith the CSV import, PowerShell\
    \ parses the input into the Name–Value pairs (and add other parameters based on\
    \ what you exported) and add them to its alias reference for the current process.\n\
    \n# See also\n\n1.  Recipe 3.4: Enabling automated execution of commands for each\
    \ load\n\n# Listing out the execution policies and setting a suitable one\n\n\
    There was a time when running scripts on Windows computers was a piece of cake.\
    \ Windows computers were highly prone to remote script executions. With PowerShell,\
    \ Microsoft added a safety belt that allowed the user some control over how PowerShell\
    \ scripts were loaded. Some specific models of script executions got restricted,\
    \ which plugged some holes in the system.\n\nIt is important to remember that\
    \ execution policies are **not** a security feature. There are ways to circumvent\
    \ this fence and still run scripts. Execution policies are in place to ensure\
    \ users don't accidentally run scripts without awareness.\n\nPowerShell on Windows\
    \ and Windows PowerShell contain the configuration. Running PowerShell scripts\
    \ on Windows is still restricted by default. On PowerShell on Linux, this doesn't\
    \ work at the moment, and based on the interactions in the community, it is uncertain\
    \ whether this feature would make it to PowerShell on Linux.\n\nAn execution policy\
    \ determines what type of execution of scripts is allowed. Here are the six execution\
    \ policies (excluding Default):\n\n1.  AllSigned\n\n2.  RemoteSigned\n\n3.  Restricted\n\
    \n4.  Unrestricted\n\n5.  Bypass\n\n6.  Undefined\n\nThere are three scopes as\
    \ well:\n\n1.  Process\n\n2.  CurrentUser\n\n3.  LocalMachine\n\nA combination\
    \ of an execution policy and a scope are what determine the condition which scripts\
    \ can be loaded under. Microsoft has documented in detail what each of the policies\
    \ is. In general, AllSigned requires that all the scripts that run on the computer\
    \ are signed using a code signing certificate by a trusted certification authority.\
    \ If this policy is set, PowerShell will not run unsigned scripts even if you\
    \ were the one to create them.\n\n**Restricted** is the default policy: Commands\
    \ can be run, but not scripts. **RemoteSigned** allows scripts created on your\
    \ own computer to run. Scripts that are downloaded from the Internet cannot be\
    \ run.\n\n**Bypass** is similar to unrestricted, however, is used in specific\
    \ scenarios such as when PowerShell forms the basis of a certain application,\
    \ and the application has its own security implementation.\n\n**Unrestricted**\
    \ means that all scripts and commands can run after a simple confirmation. **Undefined**\
    \ means that no policy has been defined for a particular scope. Let us try to\
    \ understand the concepts using the following recipe.\n\n# Getting Ready\n\nThis\
    \ recipe needs Windows to work. If you're running a pure Linux environment, you\
    \ cannot work with this recipe. You may run the commands, but you would see the\
    \ Unrestricted policy set at all levels.\n\nIf you can get your hands on a Windows\
    \ computer, you can proceed with this recipe regardless of whether it has PowerShell\
    \ or Windows PowerShell.\n\n# How to do it...\n\nOpen a PowerShell window  by\
    \ running `pwsh` or `powershell`. The `pwsh` command calls PowerShell, and `powershell`\
    \ calls Windows PowerShell.\n\nWindows PowerShell comes preinstalled on all modern\
    \ Windows products; PowerShell, on the other hand, has to be installed. Note that\
    \ all of the current PowerShell cmdlets will run as well on Windows PowerShell."
