    would not accept string as the default input. Therefore, we enclose the `Get-Process`
    cmdlet within parentheses, so that it gets executed first and outputs a `System.Diagnostics.Process`
    object, which is then processed by `Stop-Process`.


    In order to be exact with respect to which process we would like to stop, we use
    the Process ID, and pass it as the argument to `Stop-Process`.


    # Finding the owner of a process


    In the recipe, *Working with currently-running processes…*, we listed out the
    processes running in the system. The table did not show us the process owner.
    In this recipe, we look at working with processes started by a certain owner.


    # How to do it...


    The `Get-Process` cmdlet can fetch us this information.


    1.  At the prompt, type the following to get all the parameters that the `Get-Process`
    cmdlet accepts.


    ```

    PS> Get-Help Get-Process

    ```


    2.  We see a parameter `IncludeUserName` (the name suggests it is a switch parameter).
    Get more information on it.


    ```

    PS> Get-Help Get-Process -Parameter IncludeUserName

    ```


    ![](Images/c0afced1-67c8-48e2-bb2a-faff5025c2b6.png)


    3.  Run the command:


    ```

    PS> Get-Process -IncludeUserName

    ```


    4.  Filter out the processes started by you. We will use `grep` for this operation,
    until we learn how to filter in PowerShell.


    ```

    PS> Get-Process -IncludeUserName | grep ram

    ```


    5.  Count the number of processes running under your name.


    ```

    PS> (Get-Process -IncludeUserName | grep ram).Count

    ```


    6.  If you would like to use the `Measure-Object` cmdlet, you can.


    ```

    PS> Get-Process -IncludeUserName | grep ram | Measure-Object

    ```


    7.  Let us now see how what amount of working set all of the processes started
    by you consume.


    ```

    PS> Get-Process -IncludeUserName | grep ram | Measure-Object -Property WS -Sum

    ```


    ![](Images/ca96880c-e0ef-4261-9578-d0b31a8234e2.png)


    There is an error.'
