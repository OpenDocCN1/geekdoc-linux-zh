    \ loop part comes in at `Foreach-Object`. You pass the array object into the pipeline.\
    \ The `Foreach-Object` cmdlet picks up the array, and processes one element at\
    \ a time. When referring to the element within the loop, you use the `$PSItem`\
    \ (a.k.a. `$_`) automatic variable, since the object has been passed through the\
