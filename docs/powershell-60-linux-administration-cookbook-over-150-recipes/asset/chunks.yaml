- fmt: "\nMost of our scripting and administration is going to revolve around running\
    \ cmdlets and chaining them. In some situations, we run a cmdlet expecting it\
    \ to work a certain way, only to find out that the cmdlet threw an error, or worse,\
    \ did something undesirable.\n\nThe key to getting cmdlets to do what we want\
    \ them to do is to eliminate ambiguity. In this recipe, we will learn to construct\
    \ commands contextually and effectively.\n\n# Getting Ready\n\nRead the Help section\
    \ of the first chapter, *Installation, Reference and Help*. Let us understand\
    \ the notifications used in the help information that `Get-Help` shows. \n\nWhile\
    \ this may not be an exhaustive guide to using help, it should cover most of your\
    \ daily help document reading needs. The idea is to show you the notations. These\
    \ notations may appear in several combinations (parameter values in curly braces,\
    \ surrounded by square brackets, for example).\n\n| Notation | Meaning |\n| :---\
    \ | :--- |\n| `-Parameter <DataType>` | No square brackets: Mandatory parameter,\
    \ named. The parameter must be called by name, and a value of `DataType` must\
    \ be specified. |\n| `[-Parameter <DataType>]` | Square brackets around the parameter-data-type-pair:\
    \ Optional parameter, although, it must be called by name, and a value of `DataType`\
    \ must be passed. |\n| `[-Parameter] <DataType>` | Square brackets around the\
    \ parameter name: Positional parameter. You can simply pass a value of `DataType`\
    \ to the cmdlet, as long as the value is at the position shown by the parameter\
    \ in the help text. The parameter need not be called by name as long as the position\
    \ is right. |\n| `[[-Parameter] <DataType>]` | Square brackets around the parameter\
    \ name, and another pair of square brackets around the parameter-data-type-pair:\
    \ Positional parameter, which is optional. |\n| `-Parameter <DataType[]>` | Square\
    \ brackets after DataType: Multi-valued parameter. This parameter accepts multiple\
    \ values as input, each pair of values separated by a comma. |\n| `-Parameter`\
    \ | No data type: Switch parameter. Calling the parameter makes the switch `$true`,\
    \ and not calling it uses the default value for the switch. To disable the switch,\
    \ set it to false, like `-Parameter:$false`. |\n| `-Parameter {Value1 &#124; Value2\
    \ &#124; Value3}` | Values surrounded by curly braces: Parameter that accepts\
    \ predefined values as input. In this case, you would call the parameter like\
    \ `-Parameter Value1`, or `-Parameter Value2`. In other words, this parameter\
    \ does not accept arbitrary values. |\n\nBash champions take note: PowerShell\
    \ needs a comma separating the values in a multi-valued parameter. Therefore,\
    \ if you would like to call `Remove-Item` on three files, you would enter `Remove-Item\
    \ file1, file2, file3`. If only a space separates the values (like Bash's input),\
    \ PowerShell will consider the three values as values to three positional parameters,\
    \ and would either throw an error, or do something you did not want it to, based\
    \ on the cmdlet you call.\n\nIn general, anything surrounded by square brackets\
    \ is optional. Anything surrounded by curly braces indicates predefined parameter\
    \ values (the pipe separates each value). Data type followed by an empty pair\
    \ of square brackets indicate array of that data type. And the position of the\
    \ parameter is to be noted.\n\nNotice the combination: `Required` is false, there\
    \ is a default value as shown in the text below the parameter name, and the position\
    \ is `1`. This means that you can simply call the cmdlet, and it would run itself\
    \ against the default value for its first parameter. The example used here is\
    \ `Get-ChildItem`.\n\n# How to do it...\n\nThat was a long getting ready section.\
    \ Let us now put this knowledge to use.\n\n1. Run a command to get a list of files\
    \ and directories in the current location.\n\n```\nGet-ChildItem\n```\n\n2. Let\
    \ us now add a `.` to indicate the current location.\n\n```\nGet-ChildItem .\n\
    ```\n\n3. Compare the outputs of the last two commands.\n\n4. Next, let us go\
    \ with the following:\n\n```\nGet-ChildItem -Path .\n```\n\nIs the output the\
    \ same as that of the last two commands?\n\n5. Run the following and note the\
    \ values for each of the keys below:\n\n```\nPS> Get-Help Get-ChildItem -Parameter\
    \ Path\n\n-Path <String[]>\n    Specifies a path to one or more locations. Wildcards\
    \ are permitted. The default location is the current directory (`.`).\n\n    Required?\
    \                    false\n    Position?                    1\n    Default value\
    \                Current directory\n    Accept pipeline input?       True (ByPropertyName,\
    \ ByValue)\n    Accept wildcard characters?  true\n```\n\n6. Next, create a file\
    \ in the current location, called `file1` by calling the parameter by name.\n\n\
    ```\nGet-Help New-Item\n\n.\n.\n.\nSYNTAX\n    New-Item [[-Path] <String[]>] [-Confirm]\
    \ [-Credential <PSCredential>] [-Force] [-ItemType <String>] -Name <String> [-UseTransaction]\
    \ [-Value <Object>] [-WhatIf] [<CommonParameters>]\n\n    New-Item [-Path] <String[]>\
    \ [-Confirm] [-Credential <PSCredential>] [-Force] [-ItemType <String>] [-UseTransaction]\
    \ [-Value <Object>] [-WhatIf] [<CommonParameters>]\n```\n\n7. We have two possibilities:\
    \ `Path` and `Name`. Look for information on `Path`.\n\n```\nPS> Get-Help New-Item\
    \ -Parameter Path\n\n-Path <String[]>\n    Specifies the path of the location\
    \ of the new item. Wildcard characters are permitted.\n\n    You can specify the\
    \ name of the new item in Name , or include it in Path .\n\n    Required?    \
    \                true\n    Position?                    0\n    Default value \
    \               None\n    Accept pipeline input?       True (ByPropertyName)\n\
    \    Accept wildcard characters?  false\n```\n\nIf we use `Name`, we have to call\
    \ it by name (no pun intended). If not, we can specify the name as part of `Path`\
    \ (no alliteration intended either).\n\n8. Let us use `Path` first. “`-Path`”\
    \ need not be written, since it is a positional parameter.\n\n```\nNew-Item file1\n\
    ```\n\n9. Try the same operation with `Name`. This time, mention the parameter\
    \ name.\n\n```\nNew-Item -Name file2\n```\n\n10. If you would like, create a third\
    \ file, by calling `Path` by name.\n\n```\nNew-Item -Path file3\n```\n\n11. List\
    \ out the contents of the current location.\n\n```\nGet-ChildItem -Path .\n```\n\
    \nThe files are present.\n\n12. Let us now delete the files.\n\n```\nGet-Help\
    \ Remove-Item\n```\n\n13. Mention the file names as paths.\n\n```\nRemove-Item\
    \ file1\n```\n\n14. List the contents of the directory.\n\n```\nGet-ChildItem\
    \ -Path .\n```\n\n15. Now, let us delete multiple files in one shot. And this\
    \ time, let us call the parameter by name.\n\n```\nRemove-Item -Path file1, file2\n\
    ```\n\n16. Let us now create a directory. We need to use parameter called `ItemType`,\
    \ which has predefined values, based on the provider (we are using `FileSystem`).\n\
    \n```\nNew-Item -Path test-dir -ItemType Directory\n```\n\n17. Create three new\
    \ files like so:\n\n```\nNew-Item test-dir/file1, test-dir/file2 -ItemType File\n\
    New-Item test-dir/child-dir -ItemType Directory\nNew-Item test-dir/child-dir/file3\
    \ -ItemType File\n```\n\n18. Now, let us delete the contents. Wait for a confirmation\
    \ prompt to appear after running the command.\n\n```\nRemove-Item -Path test-dir\n\
    ```\n\n19. Read the prompt. It talks something of the `Recurse` parameter.\n\n\
    20. Choose `L` and press Enter to abort the process.\n\n21. Now, enter the following\
    \ command:\n\n```\nRemove-Item -Path test-dir -Recurse\n```\n\n22. That was quiet!\
    \ List out the contents of the current directory to ensure `test-dir` is gone.\n\
    \n```\nGet-ChildItem .\n```\n\nThe directory is indeed gone.\n\n# How it works...\n\
    \nWorking with cmdlets is simple. There are two kinds of parameters: named and\
    \ positional.\n\nPositional parameters work based on the position. They are programmed\
    \ in such a way that PowerShell understands their logical sequence and performs\
    \ its actions. For instance, when moving items, the general way of working is\
    \ to call the command, pass the source first and then the destination.\n\nTherefore:\n\
    \n```\nMove-Item /home/ram/Documents/GitHub /home/ram/Documents/Code/\n```\n"
