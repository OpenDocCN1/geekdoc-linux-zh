    ![](Images/35e5d79d-da5e-48da-a3a1-2a533159bf7b.png)


    # How it works...


    This is a classic example of object filtering. Since the output of most PowerShell
    cmdlets are objects, it is easy to select the necessary object and discard the
    rest from the output.


    When we run `Get-Help` with the cmdlet we need help and the specific parameter
    of the cmdlet we are looking for, we get a filtered help specific to the cmdlet.
    In our case, we picked the Noun parameter.


