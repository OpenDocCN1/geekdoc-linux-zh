  trans: "\n\n```javascript\nPS> $CustomProcess = [ordered]@{\n  ProcessName = $Process.Name\n\
    \  ProcessId = $Process.Id\n  WorkingSet = $Process.WS\n  RunningMins = [math]::Floor(((Get-Date)\
    \ - $Process.StartTime).TotalMinutes)\n}\nPS> New-Object -TypeName PsObject -Property\
    \ $CustomProcess\n```\n\n![](img/9708bd11-619f-45c9-8842-7aac2c1ac587.png)\n\n\
    # 运行原理...\n\n在本食谱中，我们从一个输出对象（`$Process`）创建了一个自定义对象（`$CustomProcess`）。`$Process`\
    \ 中的属性可以使用成员访问操作符进行访问。`$Process` 中的值被视为 `$CustomObject` 中属性的值，但 `$CustomObject`\
    \ 中的名称是不同的。在本食谱中，我们还使用了一个计算属性，即 `RunningMins`。\n\n这里需要注意的一个重要点是，此食谱的结果也可以通过结合\
    \ `Select-Object` 和计算属性来实现。然而，在对象通用性重要且对象实例数量显著增加的情况下，使用自定义对象更为简单。我们将在学习使用循环结构后，在未来的章节中扩展此功能。\n\
    \n另一个需要注意的点是 `[ordered]` 加速器的使用。通常情况下，自定义对象的属性不会按照我们列出它们的顺序出现。在本食谱中，我们将哈希字面量表示与自定义对象的创建分离开来。我们首先创建一个包含属性名和属性值的有序哈希表（ordered\
    \ hashtable），然后将创建的哈希表指定为 `New-Object` 命令的 `Property` 参数，以创建按我们想要顺序显示属性的自定义对象。\n\
    \n# 另\n\n1. [创建 .NET 和 COM 对象](https://docs.microsoft.com/en-us/powershell/scripting/getting-started/cookbooks/creating-.net-and-com-objects--new-object-?view=powershell-6)\
    \ (Microsoft 文档)\n\n# 理解类型数据（Type Data）的扩展\n\n在食谱*从输出中选择列*中，我们使用哈希表来为自定义的列设置名称和表达式。稍后，我们还在\
    \ `Select-Object` 语句中使用一个小的计算来获取计算输出。如果你尝试通过新名称选择该列，那也是行的。从技术上讲，你已经扩展了该对象。但什么是类型数据呢？既然我们可以使用\
    \ `Select-Object` 工作，为什么还需要一个食谱来扩展它呢？\n\n深入研究类型数据以及如何将其与 .NET 类和对象一起工作可能会让这个概念变成一个“高级”概念。从历史上看，我们大多数学习者都会推迟学习“高级”主题。因此，我们将坚持它的简单部分，目前仅针对\
    \ PowerShell 进行工作。本食谱将作为一个跳板，通过使其变得简单且有趣来帮助你理解它是什么，为了学习考虑，将它远离任何“高级”内容。\n\n扩展类型数据有两种方法：\n\
    \n1. 使用 PowerShell 命令行（以理解其所有工作原理）\n2. 使用 XML 文件（为了可移植性）\n\n# 准备工作\n\n为了理解我们正在讨论的内容，在这里你需要读过以下食谱：\n\
    \n1. 从输出中选择列\n2. 从返回的对象创建自定义对象\n\n让我们回到问题：当我们可以使用 `Select-Object` 时，为什么要扩展类型数据呢？\n\
    \n效率问题。虽然你可以更改名称、添加计算并使用新名称引用计算属性，但该更改仅存在于该上下文中。如果你将其添加到变量中，如上一个食谱*从返回的对象创建自定义对象*中所示（我们对名称进行了一些巧妙的更改并创建了自定义的\
    \ `NoteProperty`），那么这样做就太麻烦了。现在引入：类型数据的扩展。\n\n经验法是，如果你重复做某件事，就说明有一个问题：你没有考虑将其自动化。例如，如果你运行：\n\
    \n```bash\nPS> Get-ChildItem -Path . | select Name, Length, @{Name='Age'; Expression={[math]::Round(((Get-Date)\
    \ - $_.LastWriteTime).TotalDays)}}\n```\n\n而不是：\n\n```bash\nPS> Get-ChildItem\
    \ -Path . | select Name, Length, Age\n```\n\n并且你每天执行十五次，你应该考虑扩展对象以给你你关心的内容。\n\n\
    # 如何操作...\n\n导航到你创建实验用文件的位置。\n\n1. 输入以下命令：\n\n```bash\nPS> $FilesWithAge = Get-ChildItem\
    \ . | Select-Object Name, Length, LastWriteTime\n```\n\n2. 现在，为变量 `$FilesWithAge`\
    \ 添加一个属性；该属性应该是每个文件的年龄，以天为单位。\n\n```bash\nPS> $FilesWithAge | Add-Member -MemberType\
    \ ScriptProperty -Name Age -Value { [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\
    \ }\n```\n\n3. 为它添加另一个属性，名为 `ComputerName`，它是你的本地主机的名称。\n\n```bash\nPS> $ComputerName\
    \ = hostname\nPS> $FilesWithAge | Add-Member -MemberType NoteProperty -Name ComputerName\
    \ -Value $ComputerName\n```\n\n4. 添加另一个属性作为 `LastWriteTime` 的别名，名为 `Modified`。\n\
    \n```bash\nPS> $FilesWithAge | Add-Member -MemberType AliasProperty -Name Modified\
    \ -Value LastWriteTime\n```\n\n5. 为了像漂亮的表格一样格式化，请使用以下命令：\n\n```bash\nPS> $FilesWithAge\
    \ | Format-Table -AutoSize\n```\n\n![](img/8be1b9ba-03be-4dd0-825e-63cb802c0205.png)\n\
    \n6. 现在，删除变量。查询当前目录下的文件（因为这正是该变量实际持有的内容）。\n\n```bash\nPS> Remove-Variable FilesWithAge\n\
    PS> Get-ChildItem .\n```\n\n你看不见 `Age`、`ComputerName` 或 `Modified` 属性。如果你愿意，可以尝试\
    \ `Get-Member`。\n\n接下来，我们将看到如何扩展类型数据本身，这样每次运行 `Get-ChildItem` 时，你也会获得添加到变量中的三个属性。\n\
    \n7. 获取运行 `Get-ChildItem` 时返回的对象。\n\n```bash\nPS> Get-ChildItem | Get-Member\n\
    ```\n\n8. 你得到了 `System.IO.DirectoryInfo` 以及 `System.IO.FileInfo`。我们选择 `System.IO.FileInfo`。运行以下命令。\n\
    \n```bash\nPS> $ComputerName = hostname \n\nPS> Update-TypeData -TypeName System.IO.FileInfo\
    \ -MemberType NoteProperty -Name ComputerName -Value $ComputerName\n\nPS> Update-TypeData\
    \ -TypeName System.IO.FileInfo -MemberType AliasProperty -Name Modified -Value\
    \ LastWriteTime\n\nPS> Update-TypeData -TypeName System.IO.FileInfo -MemberType\
    \ ScriptProperty -Name Age -Value { [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\
    \ } \n```\n\n9. 查询当前位置的内容，并可选地将输出格式化为表格。\n\n```bash\nPS> Get-ChildItem . | Select-Object\
    \ Name, Length, ComputerName, Age, Modified | Format-Table -AutoSize\n```\n\n\
    ![](img/c5b3b81f-1763-4c48-8193-e924941e8b58.png)\n\n10. 对文件系统中的任何目录执行相同的操作，唯一的条件是目录至少包含一个文件，而不仅仅是目录。\n\
    \n```bash\nPS> Get-ChildItem ./cities/ | Select-Object Name, Length, ComputerName,\
    \ Age, Modified | Format-Table -AutoSize\n```\n\n"
- fmt: "\nThere is an important point to note here: `$this`. We have come across the\
    \ automatic variable, `$_` (or `$PSItem` after PowerShell V3) when dealing with\
    \ objects passed through the pipeline; the variable holds the current instance\
    \ of the object in the pipeline. However, when we have to perform an object extension,\
    \ we use the automatic variable, `$this`. Why? Because, the property being referred\
    \ to is being referred *within* the parent object (the object returned by `Get-ChildItem`).\
    \ External methods would be able to use `$_`. In a way, `$_` does not even exist\
    \ yet, when performing the member addition. Also, `$this` in fact, refers to the\
    \ object itself, that is returned by `Get-ChildItem`, and not just an instance\
    \ of it.\n\nWhen we would like to get a member as part of the object itself, throughout\
    \ the session, irrespective of the validity of a certain variable or the object\
    \ instance, we *extend the type data itself*. Therefore, no matter what context\
    \ you run the cmdlet in, you would get the additional members you added. Of course,\
    \ the formatting rules in PowerShell may still not let those members appear in\
    \ the output by default. You can always call the specific members, though, such\
    \ as using `Select-Object` for properties, or simply using the member access operator\
    \ on the properties: `(Get-ChildItem .).Age`.\n\nFor this, we use the `Update-TypeData`\
    \ cmdlet. `Update-TypeData`, in this context, requires the `TypeName`, which as\
    \ we have already seen, can be determined using `Get-Member` on the returned object.\n\
    \nWe mention four things in the `Update-TypeData` statements:\n\n1. The type name\n\
    2. The member type\n3. The member name\n4. The member value\n\nMember type accepts\
    \ several values, of which we use three:\n\n1. `AliasProperty`, which is simply\
    \ a reference to another member within the object. The new property is just another\
    \ name to an existing property. Therefore, the `Value` parameter can just take\
    \ the name of the existing member.\n2. `NoteProperty`, which is a static value.\
    \ In our case, we can use the host name as the static value.\n3. `ScriptProperty`,\
    \ which is essentially a calculation. We calculate the time span between the date\
    \ when it was last modified and the current date. This calculation is the `Value`\
    \ for the member, and accepts a script block.\n\nThis modification to the object\
    \ would be valid as long as the session is valid; the change is not persistent\
    \ across sessions. That brings us to the next recipe, making object modifications\
    \ stick across sessions.\n\n# See also\n\n1. Recipe 5.1: Selecting columns from\
    \ the output\n\n# Retaining object modifications across sessions\n\nIn the previous\
    \ recipe, Understanding extension of Type Data, we used the `Update-TypeData`\
    \ cmdlet to add members. However, we said that the update was valid as long as\
    \ the session was. Now, there could be two ways by which to make the type data\
    \ stick across sessions:\n\n1. Using the PowerShell profile.\n2. Using an XML\
    \ file\n\nPowerShell profile is straightforward. However, usually, the type data\
    \ extension and formatting rules are packaged as part of PowerShell modules. And\
    \ adding code to the profile is not particularly helpful in that case. In this\
    \ recipe, we will write a simple XML (`.ps1xml`) file that we will load in order\
    \ to extend the type data.\n\n# Getting Ready\n\nRestart your PowerShell session\
    \ so that the custom data type extension is discarded.\n\n# How to do it...\n\n\
    We need an XML file. You can either use the `New-Item` cmdlet to create one, or\
    \ simply use your favourite text editor. We use Visual Studio Code for this recipe.\n\
    \n1. Open your text editor and create a new empty file, and save it as `CustomTypes.ps1xml`.\n\
    2. Add the following content to the XML file. Ensure not to change the case.\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<Types>\n <Type>\n   <Name>System.IO.FileInfo</Name>\n\
    \   <Members>\n     <AliasProperty>\n       <Name>Modified</Name>\n       <ReferencedMemberName>LastWriteTime</ReferencedMemberName>\n\
    \     </AliasProperty>\n     <ScriptProperty>\n       <Name>Age</Name>\n     \
    \  <GetScriptBlock>[math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)</GetScriptBlock>\n\
    \     </ScriptProperty>\n     <NoteProperty>\n       <Name>ItemType</Name>\n \
    \      <Value>File</Value>\n     </NoteProperty>\n   </Members>\n </Type>\n</Types>\n\
    ```\n\n3. Save the file at a convenient location.\n4. Back at the Terminal (or\
    \ the PowerShell Integrated Console), enter the following command to update the\
    \ type data using the XML. Notice the `PrependPath` parameter.\n\n```bash\nPS>\
    \ Update-TypeData -PrependPath ~/Documents/code/github/powershell/chapter-06/CustomTypes.ps1xml\n\
    ```\n\n5. Now, list out all the files within any directory of your choice.\n\n\
    ```bash\nGet-ChildItem . -File | Select-Object Name, Length, Age, Modified\n```\n\
    \nYou should see the new properties that you created.\n\n![](Images/fc352f31-1676-4f6f-b492-31380f2aa080.png)It\
    \ is advised to never modify the PS1XML files in the `$PSHome` directory. They\
    \ are digitally signed by Microsoft and could be replaced with new versions during\
    \ upgrades or patches.\n\n# How it works...\n\nCustom types and formats are mostly\
    \ used while creating custom modules. Rarely do administrators require modifying\
    \ the types or formats for stock PowerShell modules. And when you do require modifying\
    \ custom types or formats, create a new PS1XML; do not modify the stock files,\
    \ since they are digitally signed, and modifying them would break your setup.\n\
    \nThink of this PS1XML file as a regular XML file. Here is a simpler way of showing\
    \ the structure. Remember that each type and each of the members within, must\
    \ have a name.\n\n```\nTypes\n-- Type\n---- Members\n------ [The custom properties\
    \ and methods you define]\n```\n\nIn essence, using the XML for type extension\
    \ is not very different from how we performed type extension in the last recipe,\
    \ except this uses an XML file, which makes the setup more portable. When we work\
    \ on creating our custom modules, we will look at packaging the types along with\
    \ the modules, and at that time, we will look in detail, how to work the paths.\
    \ For now, we load the XML by manually specifying the exact path to the file.\
    \ If you would like to load these custom types for every session of yours, you\
    \ can easily call the PS1XML from your profile. The portability aspect here is\
    \ that the XML can easily be shared or deployed; only the loading would be manual,\
    \ or through the profile—much simpler than adding cmdlets to profiles.\n\nWhen\
    \ updating the type data using cmdlets, we used the parameters `Name` as well\
    \ as `Value`, along with the `MemberType` parameter. PowerShell understood the\
    \ context and set up the types accordingly. In case of XML, though, one must remember\
    \ to use the correct tags for each of the member types. For instance, for `AliasProperty`,\
    \ the tags within should be `Name` and `ReferencedMemberName` (shown below); for\
    \ `ScriptProperty`, they should be `Name` and `GetScriptBlock`; for a `NoteProperty`,\
    \ the tags would be `Name` and `Value`.\n\n```xml\n<AliasProperty>\n   <Name>Modified</Name>\n\
    \   <ReferencedMemberName>LastWriteTime</ReferencedMemberName>\n</AliasProperty>\n\
    ```\n\nAlso, remember *not* to enclose the entire script block in braces when\
    \ placing the statement within the `GetScriptBlock` tag:\n\n```xml\n<GetScriptBlock>\n\
    \ [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\n</GetScriptBlock>\n\
    ```\n\nand not:\n\n```xml\n<GetScriptBlock>\n { [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\
    \ }\n</GetScriptBlock>\n```\n\nWhen loading the XML, we use the `PrependPath`\
    \ parameter to load our XML *before* the built-in types are loaded. To load them\
    \ after the built-in types, there is no need to use the `AppendPath` parameter,\
    \ unless the situation really needs it, since `AppendPath` is the default. Why\
    \ do the parameters matter? They determine the precedence of loading the types.\n"
  raw: "There is an important point to note here: `$this`. We have come across the\
    \ automatic variable, `$_` (or `$PSItem` after PowerShell V3) when dealing with\
    \ objects passed through the pipeline; the variable holds the current instance\
    \ of the object in the pipeline. However, when we have to perform an object extension,\
    \ we use the automatic variable, `$this`. Why? Because, the property being referred\
    \ to is being referred *within* the parent object (the object returned by `Get-ChildItem`).\
    \ External methods would be able to use `$_`. In a way, `$_` does not even exist\
    \ yet, when performing the member addition. Also, `$this` in fact, refers to the\
    \ object itself, that is returned by `Get-ChildItem`, and not just an instance\
    \ of it.\n\nWhen we would like to get a member as part of the object itself, throughout\
    \ the session, irrespective of the validity of a certain variable or the object\
    \ instance, we *extend the type data itself*. Therefore, no matter what context\
    \ you run the cmdlet in, you would get the additional members you added. Of course,\
    \ the formatting rules in PowerShell may still not let those members appear in\
    \ the output by default. You can always call the specific members, though, such\
    \ as using `Select-Object` for properties, or simply using the member access operator\
    \ on the properties: `(Get-ChildItem .).Age`.\n\nFor this, we use the `Update-TypeData`\
    \ cmdlet. `Update-TypeData`, in this context, requires the `TypeName`, which as\
    \ we have already seen, can be determined using `Get-Member` on the returned object.\n\
    \nWe mention four things in the `Update-TypeData` statements: \n\n1.  The type\
    \ name\n\n2.  The member type\n\n3.  The member name\n\n4.  The member value\n\
    \nMember type accepts several values, of which we use three:\n\n1.  `AliasProperty`,\
    \ which is simply a reference to another member within the object. The new property\
    \ is just another name to an existing property. Therefore, the `Value` parameter\
    \ can just take the name of the existing member.\n\n2.  `NoteProperty`, which\
    \ is a static value. In our case, we can use the host name as the static value.\n\
    \n3.  `ScriptProperty`, which is essentially a calculation. We calculate the time\
    \ span between the date when it was last modified and the current date. This calculation\
    \ is the `Value` for the member, and accepts a script block.\n\nThis modification\
    \ to the object would be valid as long as the session is valid; the change is\
    \ not persistent across sessions. That brings us to the next recipe, making object\
    \ modifications stick across sessions.\n\n# See also\n\n1.  Recipe 5.1: Selecting\
    \ columns from the output\n\n# Retaining object modifications across sessions\n\
    \nIn the previous recipe, Understanding extension of Type Data, we used the `Update-TypeData`\
    \ cmdlet to add members. However, we said that the update was valid as long as\
    \ the session was. Now, there could be two ways by which to make the type data\
    \ stick across sessions:\n\n1.  Using the PowerShell profile.\n\n2.  Using an\
    \ XML file\n\nPowerShell profile is straightforward. However, usually, the type\
    \ data extension and formatting rules are packaged as part of PowerShell modules.\
    \ And adding code to the profile is not particularly helpful in that case. In\
    \ this recipe, we will write a simple XML (`.ps1xml`) file that we will load in\
    \ order to extend the type data.\n\n# Getting Ready\n\nRestart your PowerShell\
    \ session so that the custom data type extension is discarded.\n\n# How to do\
    \ it...\n\nWe need an XML file. You can either use the `New-Item` cmdlet to create\
    \ one, or simply use your favourite text editor. We use Visual Studio Code for\
    \ this recipe. \n\n1.  Open your text editor and create a new empty file, and\
    \ save it as `CustomTypes.ps1xml`.\n\n2.  Add the following content to the XML\
    \ file. Ensure not to change the case.\n\n```\n<?xml version=\"1.0\" encoding=\"\
    utf-8\" ?>\n<Types>\n <Type>\n   <Name>System.IO.FileInfo</Name>\n   <Members>\n\
    \     <AliasProperty>\n       <Name>Modified</Name>\n       <ReferencedMemberName>LastWriteTime</ReferencedMemberName>\n\
    \     </AliasProperty>\n     <ScriptProperty>\n       <Name>Age</Name>\n     \
    \  <GetScriptBlock>[math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)</GetScriptBlock>\n\
    \     </ScriptProperty>\n     <NoteProperty>\n       <Name>ItemType</Name>\n \
    \      <Value>File</Value>\n     </NoteProperty>\n   </Members>\n </Type>\n</Types>\n\
    ```\n\n3.  Save the file at a convenient location.\n\n4.  Back at the Terminal\
    \ (or the PowerShell Integrated Console), enter the following command to update\
    \ the type data using the XML. Notice the `PrependPath` parameter.\n\n```\nPS>\
    \ Update-TypeData -PrependPath ~/Documents/code/github/powershell/chapter-06/CustomTypes.ps1xml\n\
    ```\n\n5.  Now, list out all the files within any directory of your choice.\n\n\
    ```\nGet-ChildItem . -File | Select-Object Name, Length, Age, Modified\n```\n\n\
    You should see the new properties that you created.\n\n![](Images/fc352f31-1676-4f6f-b492-31380f2aa080.png)It\
    \ is advised to never modify the PS1XML files in the `$PSHome` directory. They\
    \ are digitally signed by Microsoft and could be replaced with new versions during\
    \ upgrades or patches.\n\n# How it works...\n\nCustom types and formats are mostly\
    \ used while creating custom modules. Rarely do administrators require modifying\
    \ the types or formats for stock PowerShell modules. And when you do require modifying\
    \ custom types or formats, create a new PS1XML; do not modify the stock files,\
    \ since they are digitally signed, and modifying them would break your setup.\n\
    \nThink of this PS1XML file as a regular XML file. Here is a simpler way of showing\
    \ the structure. Remember that each type and each of the members within, must\
    \ have a name.\n\n```\nTypes\n-- Type\n---- Members\n------ [The custom properties\
    \ and methods you define]\n```\n\nIn essence, using the XML for type extension\
    \ is not very different from how we performed type extension in the last recipe,\
    \ except this uses an XML file, which makes the setup more portable. When we work\
    \ on creating our custom modules, we will look at packaging the types along with\
    \ the modules, and at that time, we will look in detail, how to work the paths.\
    \ For now, we load the XML by manually specifying the exact path to the file.\
    \ If you would like to load these custom types for every session of yours, you\
    \ can easily call the PS1XML from your profile. The portability aspect here is\
    \ that the XML can easily be shared or deployed; only the loading would be manual,\
    \ or through the profile—much simpler than adding cmdlets to profiles.\n\nWhen\
    \ updating the type data using cmdlets, we used the parameters `Name` as well\
    \ as `Value`, along with the `MemberType` parameter. PowerShell understood the\
    \ context and set up the types accordingly. In case of XML, though, one must remember\
    \ to use the correct tags for each of the member types. For instance, for `AliasProperty`,\
    \ the tags within should be `Name` and `ReferencedMemberName` (shown below); for\
    \ `ScriptProperty`, they should be `Name` and `GetScriptBlock`; for a `NoteProperty`,\
    \ the tags would be `Name` and `Value`.\n\n```\n<AliasProperty>\n   <Name>Modified</Name>\n\
    \   <ReferencedMemberName>LastWriteTime</ReferencedMemberName>\n</AliasProperty>\n\
    ```\n\nAlso, remember *not* to enclose the entire script block in braces when\
    \ placing the statement within the `GetScriptBlock` tag:\n\n```\n<GetScriptBlock>\n\
    \ [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\n</GetScriptBlock>\n\
    ```\n\nand not:\n\n```\n<GetScriptBlock>\n { [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\
    \ }\n</GetScriptBlock>\n```\n\nWhen loading the XML, we use the `PrependPath`\
    \ parameter to load our XML *before* the built-in types are loaded. To load them\
    \ after the built-in types, there is no need to use the `AppendPath` parameter,\
    \ unless the situation really needs it, since `AppendPath` is the default. Why\
    \ do the parameters matter? They determine the precedence of loading the types."
