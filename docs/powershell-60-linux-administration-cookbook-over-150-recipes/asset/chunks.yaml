- fmt: "\n# How it works...\n\n`Get-Process` does not show you the process owner information\
    \ by default. In some situations, it may be necessary to have this information.\
    \ In this simple recipe, we use the help documentation to get all the parameters\
    \ and use the `IncludeUserName` switch parameter to get the process owner information.\n\
    \nIn the next step, we filter out the processes started by a certain user, and\
    \ then, count the number of processes. We do the same using `Measure-Object` as\
    \ well, and notice that the output is the same. `Measure-Object` has \"object\"\
    \ in its name, but worked on text that was output by `grep`. At the same time,\
    \ it said at the next step that the value of `Property` is invalid.\n\nThe answer\
    \ to why `Measure-Object` worked when counting, is in the step that precedes it.\
    \ We know that if an array is output, PowerShell can count the number of elements\
    \ in the array. `Measure-Object` is also capable of the same: measuring what can\
    \ be measured in string arrays—`Count` works on string arrays.\n\nHowever, when\
    \ we tried to fetch the total working set, `Measure-Object` could not get us that.\
    \ The reason is that the output of `grep`, as we have seen before, is plain text.\n\
    \n```\nPS> Get-Process -IncludeUserName | grep ram | Get-Member\n```\n\n# There's\
    \ more...\n\nSomething perhaps a few steps ahead, but, what if we wanted to get\
    \ that working set information anyway, from the output of `grep`? Simple challenge,\
    \ accepted.\n\n```\nPS> Get-Process -IncludeUserName | grep ram | awk '{print\
    \ $1}' | ForEach-Object {[Double]$_} | Measure-Object -Sum\n```\n\n![](Images/a7449853-658a-4dc1-bb60-82cb93f4e8f3.png)\n\
    \nDo not worry too much about how that works, for now. Once we read and understand\
    \ looping through available elements, we will have a better understanding of how\
    \ we got this to work. For now, understand that we converted each of the returned\
    \ strings into `double` values using the `Double` type accelerator. Then, we did\
    \ a `Measure-Object` and found the sum.\n\nOf course, with only PowerShell, this\
    \ would be much simpler.\n\n# See also\n\n1.  Recipe 2.4: Comparing the outputs\
    \ of Bash and PowerShell.\n\n# Invoking an application based on the file type\n\
    \nSo far, we have seen how to use `Start-Process` to start an application. That\
    \ involves, in many cases, launching the application, and from the application,\
    \ opening a file that you want to work on, using the application. In this recipe,\
    \ we will leverage the concept of file association, and a proper calling cmdlet\
    \ to launch an application. In fact, we will go a little further than that.\n\n\
    # How to do it...\n\nDownload a few images from the web to work with this recipe.\
    \ They could be anything, just ensure that all of them are of the same file type.\n\
    \n1.  Navigate to the location where you saved the image files.\n\n2.  At the\
    \ prompt, type in the following command to open your image viewer, and the files\
    \ in it.\n\n```\nPS> Invoke-Item -Path *.png\n```\n\n3.  Now, create a text file\
    \ in the same location.\n\n```\nPS> New-Item file-1.txt -ItemType File\n```\n\n\
    4.  Now, invoke all the files in their respective applications.\n\n```\nPS> Invoke-Item\
    \ *\n```\n\n# How it works...\n\nIn the recipe, *Calling a PowerShell cmdlet from\
    \ outside of PowerShell*, we called a PowerShell script from Bash by first invoking\
    \ PowerShell and then passing the script as an argument to the `pwsh` command.\
    \ The process is very similar in PowerShell as well, as seen in *Launching and\
    \ stopping a process*.\n\nThe `Invoke-Item` cmdlet relies on the internal file\
    \ association to open the files. The real use of `Invoke-Item` is when opening\
    \ multiple files, whether of the same kind, or different kinds of files within\
    \ the same path using the respective applications that handle them.\n\n# Installing\
    \ the Crontab PowerShell module\n\nIn this recipe, we will discuss the installation\
    \ details of a PowerShell module to manage Cron jobs using PowerShell on a Linux\
    \ machine.\n\nThere are times when there is a need for performing administrative\
    \ tasks or scheduling a script to execute automatically at given time. Linux distros,\
    \ by default, come with a scheduling utility, called, Crontab, which allows any\
    \ given tasks to be run automatically in the background at a given time. Cron\
    \ is a time-based scheduler program. It generates events based on the definition\
    \ in the `crontab` file.\n\n# How to do it...\n\nThe PowerShell crontab wrapper\
    \ module is not available in the PowerShell repository as yet. You must download\
    \ the files manually to install the module. The simplest way is to clone the PowerShell\
    \ repository and install the module from within its `demos` directory.\n\nIf you\
    \ would rather only install the CronTab module alone, download the `<repo>/demos/crontab`\
    \ directory manually. Then, start PowerShell as super-user, and navigate to `crontab`.\
    \ Continue from step 4.\n\n1.  Clone the PowerShell repository on to your computer.\n\
    \n```\n$ mkdir ~/code\n$ git clone https://github.com/PowerShell/PowerShell.git\n\
    ```\n\n2.  Start `pwsh` as a super-user.\n\n3.  Go to the `demos/crontab/CronTab`\
    \ directory within the repository. This is where the module manifest is placed.\n\
    \n```\nPS> Set-Location ~/code/PowerShell/demos/crontab\n```\n\n4.  Use the `Import-Module`\
    \ cmdlet on the module manifest to import the module.\n\n```\nPS> Import-Module\
    \ -Name ./CronTab/CronTab.psd1\n```\n\n5.  To list the components of CronTab module\
    \ use the `Get-Module` cmdlet.\n\n```\nPS> Get-Module -Name CronTab | Format-List\n\
    Name : CronTab\nPath : /home/PacktPub/CronTab.psm1\nDescription : \nModuleType\
    \ : Script\nVersion : 0.0\nNestedModules : {}\nExportedFunctions : {ConvertTo-CronJob,\
    \ Get-CronJob, Get-CronTab, Get-CronTabUser...}\nExportedCmdlets : \nExportedVariables\
    \ : \nExportedAliases : \n```\n\n6.  To list the available command types of `CronTab`\
    \ module use the `Get-Command` cmdlet.\n\n```\nPS> Get-Command -Module CronTab\
    \  \nCommandType Name Version Source\n----------- ---- ------- ------\nFunction\
    \ ConvertTo-CronJob 0.0 CronTab\nFunction Get-CronJob 0.0 CronTab\nFunction Get-CronTab\
    \ 0.0 CronTab\nFunction Get-CronTabUser 0.0 CronTab\nFunction Import-CronTab 0.0\
    \ CronTab\nFunction Invoke-CronTab 0.0 CronTab\nFunction New-CronJob 0.0 CronTab\n\
    Function Remove-CronJob 0.0 CronTab\n```\n\n# How it works...\n\nWhen you download\
    \ theCronTab module, the following files get copied to the CronTab folder from\
    \ the URL mentioned in the recipe, and these files contain the module data.\n\n\
    1.  CronTab.ps1xml\n2.  CronTab.psd1\n3.  CronTab.psm1\n\nThe `Import-Module`\
    \ cmdlet registers the cmdlets available in the module into the PowerShell session\
    \ and makes the module ready for use. The `Import-Module` cmdlet is run against\
    \ the module manifest, which is the `psd1` file. \n\nWhen you run the `Get-Command`\
    \ cmdlet, you get a list of all the cmdlets available in the module.\n\n# Scheduling\
    \ jobs in PowerShell\n\nIn this recipe, we will see how to schedule a job using\
    \ PowerShell cmdlets.\n\n# Getting Ready\n\n1.  Log in to the terminal using SU\
    \ privileges.\n\n2.  Open a PowerShell console using the `pwsh` command.\n\n3.\
    \  Import the module (refer the recipe: Installation of the Crontab module).\n\
    \n# How to do it...\n\n1.  First, check the existence of the command or scripts\
    \ that you want to schedule from a terminal\n\n```\n$ pwsh -f \"/tmp/DataLoading.PS1;\"\
    \n```\n\n2.  To run the script based on a schedule, use the `New-CronJob` cmdlet.\n\
    \n```\nPS> New-CronJob -Command 'pwsh -f \"/tmp/DataLoading.PS1;\"' -Minute 0,15,30,45\
    \ | Out-Host\n\nPS> New-CronJob -Command 'pwsh -f \"/tmp/DataLoading.PS1;\"' -Minute\
    \ */15 | Out-Host\n\nPS> New-CronJob -Command 'pwsh -f \"/tmp/DataLoading.PS1;\"\
    ' -Minute */15 -Hour 10-12 | Out-Host \n\nPS> New-CronJob -Command 'rm -rf /tmp/clr*'\
    \ -Minute 15 -Hour 1 | Out-Host \n\nPS> New-CronJob -Command 'pwsh -f \"/tmp/DataLoading.PS1;\"\
    ' -Minute */15 -Hour 10-12 -DayOfWeek sun,tue,fri -Month Jan,Mar,Jun,Sep,Dec |\
    \ Out-Host\n```\n\n3.  To get the list of currently scheduled jobs, run the `Get-CronJob`\
    \ cmdlet.\n"
