- fmt: '

    Basically, in Linux, it should be fairly simple to get the source code and build
    the application from the source code using `make`. This approach should work for
    PowerShell as well. However, as noted above, official support and community support
    are available only for a few distributions. We would focus on installing PowerShell
    on `Ubuntu` and `CentOS` since they are two of the most popular Linux distributions.


    PowerShell` is available in two releases: stable and preview. The stable releases
    are suitable for production environment since they''re more reliable. The preview
    releases are for test environments where the administrators are allowed to feel
    a little adventurous, and are willing to report bugs they come across along with
    providing feedback on the capabilities.


    # Getting Ready


    Getting ready to install PowerShell on your computer is simple. You simply need
    a working Linux computer, which you have administrator privileges on. Depending
    on what mode you pick to install PowerShell, you may or may not need a package
    manager. Chances are, your Linux distribution already has a package manager available.


    # How to do it...


    As discussed, we will look at the procedure to install PowerShell on `Ubuntu`
    (and its derivatives) as well as `CentOS` (and its derivatives).


    # Installation on Ubuntu


    There really are many ways to install PowerShell on your computer. Since we''re
    installing PowerShell on `Ubuntu`, we shall look at two ways to do it. The first
    is by adding Microsoft''s key and registering the repository and then using the
    Advanced Package Tool (`APT`) to install PowerShell, and the other, directly using
    the `.deb` package from GitHub.


    ## Installing from the repository


    The last version of `Ubuntu` that PowerShell has an official package for is `Ubuntu
    17.04`. If you have `Ubuntu 17.04`, use the steps below to install PowerShell.
    Otherwise, it is suggested that you use the direct download method.


    1. The first step is to import the GPG keys for the public repository:


    ```

    curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

    ```


    2. Now that the key has been added, register the repository—this repository is
    maintained by Microsoft.


    ```

    sudo curl -o /etc/apt/sources.list.d/microsoft.list https://packages.microsoft.com/config/ubuntu/17.04/prod.list

    ```


    3. Update the package list using the following command.


    ```

    sudo apt update

    ```


    4. Next, install PowerShell.


    ```

    sudo apt install -y powershell

    ```


    ## Installing via direct download


    Follow the steps below to install PowerShell on `Ubuntu`:


    1. Go to [https://github.com/powershell/powershell](https://github.com/powershell/powershell).

    2. Scroll down to the table that contains the list of Linux distributions officially
    supported by the PowerShell team.

    3. Click on the relevant link: `.deb` under Downloads (stable)—we will stick to
    the stable release.

    4. Read the installation instructions if you need additional information.

    5. Run the `.deb` file with `gdebi` or `eddy` or one such package installer to
    complete the installation.


    If you aren''t running one of the distributions supported officially by the Team
    or by the community, use the `AppImage`. Follow steps 1 and 2 from above, and:


    1. Click on Many Linux distributions | `AppImage` to download the `Ap-pImage`
    file. An `AppImage` file is a an application, packaged with all the dependencies
    required to run the application.

    2. Save the `AppImage` file at a convenient location.

    3. Once the download completes, navigate to the download location and run the
    `AppImage`.

    4. If you get a prompt asking if you would like PowerShell installed, choose the
    response appropriate to your environment.


    # Installation on CentOS


    Installation of PowerShell on `CentOS 7` (or `RedHat 7`) also has two methods:
    the repository and direct download. The process is similar to that of installation
    on Ubuntu Linux.


    ## Installing from the repository


    To begin installation:


    1. First, register the Microsoft repository.


    ```

    curl https://packages.microsoft.com/config/rhel/7/prod.repo | sudo tee /etc/yum.repos.d/microsoft.repo

    ```


    2. Next, install PowerShell using `yum`.


    ```

    sudo yum install -y powershell

    ```


    ## Installing via direct download


    Follow the steps below to install PowerShell on `CentOS`:


    1. Go to [https://github.com/powershell/powershell](https://github.com/powershell/powershell).

    2. Scroll down to the table that contains the list of Linux distributions officially
    supported by the PowerShell team.

    3. Click on the relevant link: `.rpm` under Downloads (stable)—we will stick to
    the stable release.

    4. Read the installation instructions if you need additional information.

    5. Install the RPM package using the following command (assuming your download
    is at `~/Downloads` and your `PWD` is `~/Downloads`).


    ```

    sudo yum install <the-downloaded-file.rpm>

    ```


    # Using the AppImage package


    Using the `AppImage` is much simpler.


    1. Go to [https://github.com/powershell/powershell](https://github.com/powershell/powershell).

    2. Scroll down to the Get PowerShell section, and find the `AppImage` link under
    community-supported distributions.

    3. Download the `AppImage` and place it at a convenient location.

    4. Run `chmod a+x PowerShell-<version>-<architecture>.AppImage` to make the `AppImage`
    executable.

    5. Call the `AppImage` to run PowerShell. You may be asked if you''d like the
    `AppImage` installed on your computer. Select Yes if you would like that.


    # How it works...


    The package manager installs the package with all its dependencies and makes the
    relevant commands available for use.


    In case of the `AppImage` package, the dependencies are all bundled into the package
    (including `.NET Core`), and the package can either run in portable mode on your
    computer, or can be installed and called. Launch PowerShell by running `pwsh`
    to take a look.


    # See also


    1. Recipe 2.5: Comparing Windows PowerShell and PowerShell


    # Fetching Help Information in PowerShell


    Commands in PowerShell are called `cmdlets` (pronounced: command-lets). `cmdlets`
    come pre-packaged with all the necessary help information, just like the help
    available for any of the Linux commands. The difference is that there''s a separate
    `cmdlet` available to get you the necessary help; help is not a switch in PowerShell.


    Before we begin, let''s launch the Terminal (launch any of the terminal emulators
    available on your computer). Let''s now type `pwsh` to call PowerShell. Proceed
    with the steps below once you get the PS prompt.


    To get help information in PowerShell:


    Enter `Get-Help` at the prompt to get an overview of the help system in PowerShell.
    You would see an output like this:


    ![](Images/f608603b-ab54-460d-996d-23861db19141.png)


    PowerShell `cmdlets` are built with help information written in them. Running
    `Get-Help` without any arguments would show you basic information on help available
    in PowerShell, which is not quite remarkable. Let us look at another recipe to
    leverage `Get-Help` a little better.


    ## Fetching Help Information for a Specific Cmdlet


    While `Get-Help` shows information about help, it can also take in other `cmdlets`
    as arguments and show help for them. Let''s pick `Get-Command` as an example and
    get help on the cmdlet.


    # How to do it...


    1. At the prompt, type in the following:


    ```

    Get-Help Get-Command

    ```


    2. You''d get an output like this:


    ![](Images/0f4996e6-5ed6-4bfe-a7da-c37a3cfc3d03.png)


    3. You can even get complete help on a cmdlet, including information about each
    of the parameter that you can use with the cmdlet; information such as whether
    the parameter is positional, mandatory and so on. We shall see in detail about
    each of these as we move into administration using PowerShell. To get full help
    on the cmdlet, enter:


    ```

    PS> Get-Help Get-Command -Full

    ```


    4. To see examples of how to use the cmdlet, enter:


    ```

    PS> Get-Help Get-Command -Examples

    ```


    5. To read help information online, enter:


    ```

    PS> Get-Help Get-Command -Online

    ```

