    \ find out how many days have passed since the World Environment Day, 2016.\n\n\
    ```\nPS> (Get-Date).Subtract((Get-Date '5 June 2016'))\n```\n\n![](Images/f40255e1-1726-409d-ab88-f5eae0366a3b.png)\n\
    \n# How it works...\n\nThe object that is returned by `Get-Date` has several methods\
    \ just like how it has properties. In this recipe, we use the methods to manipulate\
    \ date the way we need it. Methods are called with arguments. When you do not\
    \ want to specify any argument, ensure still to call the methods with an empty\
    \ pair of parentheses.\n\nMethods can be chained in the way we did in adding hours\
    \ as well as minutes. As long as the output object does not change, in most cases,\
    \ you should be able to call methods pertaining to the object by chaining them.\
    \ If, for instance, you convert the date object into string at the first method,\
    \ the second method should be a string-input-enabled method. When in doubt, use\
    \ the `Get-Member` cmdlet on the output to see what methods it would support.\n\
    \nWhen you look at `Get-Member` run against the `DateTime` object, you see that\
    \ the `Subtract` method accepts `DateTime` as its argument. Hence the use of `Get-Date`\
    \ *within* the argument. Passing a cmdlet output as an argument to a method requires\
    \ the cmdlet, along with the parameters that are passed, to be enclosed within\
    \ an additional pair of parentheses–`Subtract((Get-Date '5 June 2016'))` as opposed\
    \ to `Subtract(Get-Date '5 June 2016')`–so that the inner command is executed\
    \ first to get a value, and then, passed to the method.\n\n# Working with currently-running\
    \ processes to measure resource consumption"
