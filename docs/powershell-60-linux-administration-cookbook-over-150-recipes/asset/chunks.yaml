  trans: '

    Windows PowerShell ISE 曾是开发 PowerShell 脚本甚至 PowerShell 编写应用程序的事实标准。随后，Adam Driscoll
    为 Microsoft Visual Studio 开发了 PowerShell 扩展，将 PowerShell 集成到了集成开发环境中。


    在开发 PowerShell 的同时，随着 .NET Foundation 的成立，微软开始开发一种名为 Visual Studio Code 的轻量代码编辑器，它封装了
    Visual Studio 的许多强大功能，而没有所有语言库的沉重负载。这对于构建 PowerShell 脚本已经足够了；大多数 PowerShell 脚本编写者主要使用
    IntelliSense 功能，而 Visual Studio Code 正拥有这些功能。


    使用包管理器安装 Visual Studio Code 可以确保满足所有依赖项。此外，这种安装方法可以确保签名密钥被添加到系统中。这样，就可以通过系统（例如运行
    `sudo apt upgrade`）安装 Visual Studio Code 的更新。


    # 另见

    1. [在 Linux 上安装 Visual Studio Code](https://code.visualstudio.com/docs/setup/linux)
    (微软文档)


    # 配置自动变量

    可能没有什么能比可配置性更能提高效率了。配置系统是按照你的喜好对其进行塑造的一种。只有你最清楚什么对你有效。因此，系统的可配置性越高，就越能根据你的使用进行塑造。PowerShell
    中的自动变量是 PowerShell 自定义化的首要步骤之一（配置文件是另一个；我们稍后会介绍它们）。在本教程中，我们将列出所有自动变量，并根据我们的需求对其中一些变量进行配置。


    # 准备工作

    阅读 *安装、参考和帮助* 中的 *列出 PowerShell 中的各种提供者* 章节，以学习如何使用 PowerShell 中的各种提供者。


    # 如何操作……

    让我们先列出我们拥有的变量。这可以通过两种实现：

    * 使用命令 (cmdlet)

    * 使用提供者 (provider)


    让我们先看看使用命令列出 PowerShell 内置的变量。


    1. 打开终端窗口。如果你已经打开了一个，请重启 PowerShell。

    2. 找到适用于变量命令。

    ```

    PS> Get-Command -Noun Variable

    ```

    记住，命令中的名词（noun）始终是单数。因此，应该是 `Variable`，而不是 `Variables`。

    3. 有五个处理变量的命令。我们想要获取 PowerShell 新会话中已存在的所有变量列表。让我们选择 `Get-Variable` 并获取它的帮助信息。

    ```

    PS> Get-Help Get-Variable

    ```

    4. 这是我们需要列出当前作用域中预定义的所有变量的命令。

    ```

    PS> Get-Variable

    ```

    这应该列出当前作用域中预定义的所有变量。

    你定义的任何变量都会列在这里。因此，启动一个全新的 PowerShell 会话来查看哪些变量已被预定义是重要的。


    现在，让我们使用 PowerShell 提供者来列出当前作用域中定义的变量。

    1. 列出 PowerShell 提供者。我们在上一章中查看过提供者。

    ```

    PS> Get-PsProvider

    ```

    2. 将位置更改到 `Variable` 提供者的 `Variable:` 驱动器。这是通过 `Set-Location` 完成的。

    ```

    PS> Set-Location Variable:

    ```

    3. 现在，让我们列出 `Variable:` 驱动器的所有可用子项。

    ```

    PS> Get-ChildItem .

    ```

    此的输出与不带参数调用的 `Get-Variable` 相同。


    # 工作原理……

    PowerShell 的构建包含了一些控制其行为的变量，允许管理员修改其中一些变量以满足需求。然而，某些变量是无法修改的；它们是上下文相关的，并为 shell
    增加了一灵活性（或模块化）。

    其中一个例子是 `$PWD`，它包含当前目录的路径。该变量会根据 `Set-Location` 的执行而改变。不能向此类变量显式赋值；显式设置值对 shell
    的行为没有影响。

    另一方面，某些变量接受赋值，允许我们控制命令和脚本的执行。我们将在下一个教程中查看示例。


    # 使用变量更改 shell 行为

    在上一个教程中，我们查看了现有的变量。在本教程中，我们将更改一个变量的值来控制 PowerShell 的行为。再次记住，值的更改是瞬时的；一旦 PowerShell
    进程重启，值将重置。


    # 准备工作

    阅读上一个教程以了解哪些是预定义的自动变量。此外，启动 Visual Studio Code。按照以下步骤启动 VS Code。

    1. 打开应用程序（我使用的是 Gnome DE，通过 `Super + A` 显示所有应用程序）。

    2. 输入 `code`。

    3. 按 `` Ctrl + ` `` 启动终端。

    4. 点击欢迎界面上的“新建文件”（或按 `Ctrl + N`）。

    5. 在 VS Code 窗口的右下角，你会看到文件类型设置为“纯文本”（Plain Text）。点击它；你将被带到顶部的命令栏。

    6. 在命令栏输入 `powershell`。底部将打开 PowerShell 集成控制台。

    ![](img/4695ded0-1291-4688-85fc-14410d9643aa.png)

    我们现在已为教程准备就绪。


    # 如何操作……

    1. 让我们运行一个会导致错误的命令。目前，我们先不要关注命令的语法；我们目前的目标是生成一个错误。在脚本窗口的第一行，输入：

    ```

    Get-ChildItem /home/ram/random-directory

    Write-Host "Hello world!"

    ```

    ![](img/b0b222fa-1b67-42e4-a78e-d22e94f2bc8a.png)

    2. 使用 `F5` 键运行双行脚本。

    ![](img/104cf932-9a53-42b2-8bed-87e13ae01667.png)

    PowerShell 提示显示一个错误。它还显示了 `Hello world!` 字符串。

    3. 现在，让我们使用变量 `ErrorActionPreference` 来设置错误操作偏好。我们从上一个教程知道有这样一个变量。首先，重启 PowerShell。最简单的方法是点击集成控制台窗口顶部的小垃圾图标。当
    VS Code 询问你是否想重启会话时，点击“是”。

    ![](img/b9254d0b-3222-4b7d-879b-2d8b4063252b.png)

    4. 现在，设置 `ErrorActionPreference` 变量。在 PowerShell 集成控制台中输入：

    ```

    PS> Set-Variable ErrorActionPreference SilentlyContinue

    ```

    5. 再次运行双行脚本。

    这次没有错误了。我们在控制台上看到了 `Hello world!`。

    如果你不想让整个脚本出现在提示符处，将脚本的第一行改为 `Clear-Host`；这将在显示输出之前清除屏幕。

    6. 如果你想检查是否真的生成了错误呢？我们检查自动变量 `Error` 的值。

    ```

    PS> Get-Variable Error

    ```

    ![](img/48e32e87-abde-4edd-9ca0-6cf1a296a5aa.png)

    7. `Value` 列包含一些文本。让我们选择并展开 `Value` 的内容。

    ```

    Get-Variable Error | Select-Object -ExpandProperty Value

    ```

    ![](img/735a62cc-1e23-4373-8710-1f1c53943594.png)

    输出文本与我们在设置错误操作偏好之前收到的相同。

    你也可以直接调用 `Error` 变量读取当前会话中发生的所有错误。


    # 工作原理……

    默认情况下，错误操作偏好是 `Continue`，这意味着 PowerShell 将显示错误并继续执行脚本的其余部分（这种效果在运行单个命令时并不明显，因此创建了双行脚本，或者在顶部添加了
    `Clear-Host` 的三行脚本）。通过将 `ErrorActionPreference` 设置为 `SilentlyContinue`，我们指示 PowerShell
    记录错误但不屏幕上显示，同时继续执行脚本的其余部分。


    '
- fmt: "\n1. [about_Preference_Variables, $ErrorActionPreference](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_preference_variables?view=powershell-6#erroractionpreference)\
    \ (Microsoft documentation)\n2. Recipe: Error handling in PowerShell\n\n# Enabling\
    \ automated execution of commands for each load\n\nLike we saw in the previous\
    \ recipes, these changes are ephemeral; they remain as long as the session is\
    \ active. There might be situations wherein administrators might require running\
    \ a few commands, or loading modules to enable them to work faster. For instance,\
    \ I tend to load a series of modules that help me manage Microsoft Exchange, Active\
    \ Directory, VMware vSphere infrastructure, Citrix XenApp, Microsoft System Center,\
    \ and other environments using PowerShell.\n\nIf you see, all of these products\
    \ require different ways of loading the modules, snap-ins and scripts, and many\
    \ of them require certain configuration every time you load the modules (such\
    \ as connecting to VM servers with administrator credentials). These can be done\
    \ using the PowerShell profile.\n\n# Getting Ready\n\nPowerShell by default does\
    \ not create a profile during installation. It simply runs with its default configuration.\
    \ Any override to this configuration would require creating and modifying the\
    \ profile.\n\n1. Open a PowerShell console. (You could either run `pwsh` at the\
    \ terminal or use the VS Code console. This recipe uses the terminal.)\n2. Reveal\
    \ the path of your profile. To do this, simply call the automatic variable.\n\n\
    ```\nPS> $PROFILE\n```\n3. Check if your profile exists.\n\n```\nPS> Test-Path\
    \ $PROFILE\n```\n\n4. If you get `True` as the response, you can proceed with\
    \ the recipe. If the response is `False`, which is most likely the case, run the\
    \ following:\n\n```\nPS> New-Item $PROFILE -ItemType File\n```\n\n5. You may receive\
    \ an error, saying a part of the path was not found. This is because your `~/.config/`\
    \ directory does not by default contain a `powershell` directory. Adding `-Force`\
    \ to the command creates this directory and creates your profile file at the location.\n\
    \n```\nPS> New-Item $PROFILE -ItemType File -Force\n```\n\n![](Images/c6790c84-4047-427b-933e-47b24beaf1d1.png)\n\
    \n6. We will now edit the profile in VS Code. At the terminal, type:\n\n```\n\
    PS> code $PROFILE\n```\n\n# How to do it...\n\nYou should have the profile open\
    \ now. It would currently be empty. Let us now customise PowerShell's error action\
    \ behaviour. Remember that we said that setting `ErrorActionPreference` to `SilentlyContinue`\
    \ at the terminal was temporary. Let us now ensure that `ErrorActionPreference`\
    \ is permanently set to `SilentlyContinue` every time we launch PowerShell.\n\n\
    1. Switch to the terminal window. If you have the window open since the last recipe,\
    \ restart PowerShell.\n2. Let us see what the error action preference is at the\
    \ moment.\n\n```\nPS> Get-Variable ErrorActionPreference\nContinue\n```\n3. Switch\
    \ to VS Code. The profile should already be open for edits.\n4. At the very first\
    \ line, type in:\n\n```\nPS> Set-Variable ErrorAction SilentlyContinue\n```\n\
    5. Save the profile and close the file.\n6. At the terminal, type `exit` to exit\
    \ from PowerShell. Start PowerShell again.\n7. Let us now check what the value\
    \ is for `ErrorActionPreference`. At the prompt, type:\n\n```\nPS> $ErrorActionPreference\n\
    SilentlyContinue\n```\n8. To ensure the preference is indeed in place, type:\n\
    \n```\nPS> Get-ChildItem /home/ram/random-directory\n```\n\n![](Images/bf5a2583-205d-4e2a-b756-4611f2977719.png)\n\
    \nThe cursor simply returned to the prompt at the next line without throwing an\
    \ error.\n\n# How it works...\n\nLong story short, the PowerShell profile executes\
    \ every time a PowerShell session is loaded. This profile is a PowerShell script\
    \ file that can contain a series of commands and functions, which would be executed\
    \ just like another script.\n\nOne important point to remember is that there is\
    \ a different profile for each host. For instance, there is a separate profile\
    \ for PowerShell loaded on the Terminal, and a different one for the Integrated\
    \ Terminal on VS Code. This is because each of the terminals has a different nature.\n\
    \nExecution Policies have not been implemented in PowerShell on Linux. In case\
    \ PowerShell on Linux gains the safety belt in the future, the execution policy\
    \ should be set to allow execution of scripts in order for the profile to load.\n\
    \n# There's more...\n\nIt is bad practice to set a global action preference. Empty\
    \ the profile to remove the error action preference. Since the profile has nothing\
    \ else, you could even delete the profile using the following command:\n\n```\n\
    \ Remove-Item $PROFILE\n```\n\nRead the best practices for more information.\n\
    \n# Customising the terminal prompt\n\nIn the previous recipe, we customised the\
    \ error action preference using the profile. We used an already-demonstrated command\
    \ to show that commands that can be run on the PowerShell console can be added\
    \ to the profile as well, and this was a way to automate running a certain set\
    \ of commands which could be used to increase productivity.\n\nNow, we will take\
    \ the next step and customise our console prompt. The options are theoretically\
    \ endless; this recipe is just another demonstration of how flexible PowerShell\
    \ is.\n\n# Getting Ready\n\nYou need VS Code for this recipe. If you did not follow\
    \ along the last recipe, follow the steps in the *Getting Ready* section of the\
    \ last recipe to create a PowerShell profile, only this time, run the commands\
    \ at the PowerShell Integrated Console of VS Code.\n\n# How to do it...\n\nEnsure\
    \ that the profile is empty. If you just created the profile, you can simply proceed\
    \ further. If not, clear all contents in the profile. If the error action preference\
    \ is set in the profile, it would become hard to troubleshoot scripts that you\
    \ create in the future.\n\n1. Enter the following in the main window.\n\n```\n\
    function prompt {\n  $Location = (Get-Location).Path.ToString()\n  switch -Wildcard\
    \ ($Location) {\n    \"/home/$env:USERNAME\" { $Location = '~'; break }\n    \"\
    /home/$env:USERNAME/Documents\" { $Location = 'Documents'; break }\n    \"/home/$env:USERNAME/Downloads\"\
    \ { $Location = 'Downloads'; break }\n    \"/home/$env:USERNAME/Pictures\" { $Location\
    \ = 'Pictures'; break }\n    \"/home/$env:USERNAME/Videos\" { $Location = 'Videos';\
    \ break }\n    \"/home/$env:USERNAME/Music\" { $Location = 'Music'; break }\n\
    \    \"/home/$env:USERNAME/Documents/code\" { $Location = 'Code'; break }\n  \
    \  \"/home/$env:USERNAME/*\" { $Location = $Location.Replace(\"/home/$env:USERNAME/\"\
    , '~/'); break }\n    Default { }\n  }\n  Write-Host \"PS \" -NoNewline\n  Write-Host\
    \ `\n    ($($env:USERNAME) + \"@\" + \"$([System.Net.Dns]::GetHostByName((hostname)).HostName)\
    \ \") `\n    -NoNewLine -ForegroundColor Cyan\n  Write-Host \"$Location\" -NoNewline\
    \ -ForegroundColor Green\n  Write-Host (\"`n> \") -NoNewline\n  return \" \"\n\
    }\n```\n2. Save the profile script file.\n3. Click on the little bin icon at the\
    \ top of the Integrated Console to kill the current PowerShell session.\n4. When\
    \ VS Code prompts you whether you would like to restart the session, click Yes.\n\
    \nYour prompt should look as shown in the image below.\n\n![](Images/f6f8c8ed-8df5-4d42-8415-d37b24ac6e27.png)\n\
    \n# How it works...\n\nThe prompt is controlled by a function called `prompt`.\
    \ To demonstrate this, we could use:\n\n```\nGet-Command prompt\n```\n\nThe output\
    \ shows that there is indeed such a command, which is of the type `Function`.\
    \ To know the contents of the `prompt` function, enter:\n\n```\nPS> (Get-Command\
    \ prompt).ScriptBlock\n```\n\nThe output shows you the entire function you just\
    \ wrote. This is, however, the function that overrode the default `prompt` function.\
    \ If you clear your profile, restart the PowerShell session, and type in the command\
    \ above, you would see a simple three-liner output, which is the default `prompt`\
    \ function.\n\nNow to break down the function we wrote:\n"
