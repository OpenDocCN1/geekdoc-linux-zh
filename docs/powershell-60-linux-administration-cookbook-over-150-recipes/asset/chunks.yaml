  trans: "\n\n```bash\nPS> [Person]::New('Prashanth',34) \n```\n\n![](img/6134d77a-3052-4d39-b0ba-c260b5982fd6.png)\n\
    \n### 5. 现在，让我们用 PowerShell 的方式来调用构造函数，这反过来会调用 .NET 构造函数。这创建了一个 `Person` 类的实例（根据定义，它是一个对象）。\n\
    \n```bash\nPS> $Person = New-Object -TypeName Person -ArgumentList 'Prashanth',\
    \ 34\n```\n\n### 6. 要列出对象的属性（并扩展到类），请运行 `Get-Member`  cmdlet。\n\n```bash\nPS>\
    \ $Person | Get-Member \n\nPS> $Person | Select-Object Name, Age, Salary | Format-Table\
    \ -AutoSize \n\nPS> $Person.sal(200,2)\n```\n\n![](img/8daf5696-50c8-40ac-b1f9-a9114d7c13b9.png)\n\
    \n### 7. 接下来，让我们看看其他示例。让我们使用系统定义的类库。\n\n```bash\nPS> $MailClient = New-Object\
    \ -TypeName System.Net.Mail.SmtpClient 'packtpub.smtpdomain.com'\nPS> $Message\
    \ = New-Object System.Net.Mail.MailMessage('pjayaram@packtpub.com', 'pjayaram@packtpub.com',\
    \ 'Subject', 'Welcome to Packt!')\nPS> $MailClient.Send($Message)\n```\n\n###\
    \ 8. 让我们来看另一个使用 `System.Management.Automation` 类对象进行密码加密的示例。\n\n```bash\nPS> $User\
    \ = 'Prashanth' \nPS> $Password = 'Y94b^E$85CBLU%at' \nPS> $SecurePassword = ConvertTo-SecureString\
    \ $Password -AsPlainText -Force \nPS> $Credentials = New-Object -TypeName System.Management.Automation.PSCredential\
    \ -ArgumentList $User, $SecurePassword \nPS> $Credentials | Get-Member\n```\n\n\
    ![](img/6cb687d1-a002-45c1-917f-d2a18d39014e.png)\n\n# 工作原理...\n\n此配方的目标是演示 PowerShell\
    \ 如何与 .NET 协同工作，以及通过 .NET 方式创建的对象如何在 PowerShell 中被轻松调用（并存储）。首先，我们使用 `class` 关键字声明一个类。然后我们声明它的参数，接着创建两个构造函数：一个默认的和一个带参数的。\n\
    \n我们还创建了一个名为 `sal` 的方法。我们定义它的返回类型为 `int32` 并定义了两个参数。在方法内部，我们定义了返回的内容。\n\n回到 PowerShell\
    \ 提示符，我们调用了静态（类的方法，而不是对象的）`New` 方法。语法是提到类名，后面跟两个连续的冒号（`::`）以便在全局命名空间调用，然后是方法名。\n\
    \n如果你遵循这些步骤，你还将看到使用两个不同的系统类库 `System.Net.Mail.SmtpClient` 和 `System.Net.Mail.MailMessage`\
    \ 的示例，以及通过将邮件消息输出与 SMTP 客户端对象集成来实例化方法。\n\n接下来，我们使用系统类库 `System.Management.Automation.PSCredential`。在这个示例中，我们将一些文本发送到\
    \ `ConvertTo-SecureString`，它接受纯文本输入并将其转换为安全字符串。然后，我们将加密后的字符串传递给 `PSCredential`\
    \ 系统类，将用户名和安全字符串存储到 `$Credentials` 变量中。\n\n# 另\n\n1. 配方 3.1：安装 Visual Studio Code\n\
    \n# 为对象添加自定义属性\n\nPowerShell cmdlet 能够允许管理员处理大多数任务。然而，在某些情况下，返回的对象不能满足特定脚本的管理需求。在这些情况下，我们可能需要根据可用的\
    \ .NET 类创建自己的自定义对象，或者至少为对象添加自定义属性。\n\n虽然字符串是 `System.String`类型的对象，但 `Get-Process`\
    \ cmdlet 返回的是 `System.Diagnostics.Process` 类型的对象，`Get-ChildItem` 返回类型为 `System.IO.FileInfo`\
    \ 的对象，而自定义创建的对象类型为 `PSCustomObject`。\n\n# 如何实现...\n\n现在让我们开始创建一个自定义对象。\n\n1. 要创建一个自定义对象，请使用\
    \ `New-Object` cmdlet。\n\n```bash\nPS /home/PacktPub> New-Object -TypeName PSCustomObject\n\
    ```\n\n2. 这对我们没太大用。让我们向其中添加几个属性以及它们的值，并将这些值存储在变量中。\n\n```bash\nPS> $MyCustomObject\
    \ = [pscustomobject]@{ \n  Name = 'Prashanth Jayaram'\n  Title = 'PowerShell'\n\
    \  Publisher = 'Packt' \n}\n\nPS> $MyCustomObject\n```\n\n3. 要向对象添加属性，请使用 `Add-Member`\
    \ cmdlet。\n\n```bash\nPS> $MyCustomObject | Add-Member -MemberType NoteProperty\
    \ -Name 'Location' -Value 'United States'\nPS> $MyCustomObject\n```\n\n4. 要从对象中删除属性，请使用以下命令。\n\
    \n```bash\nPS> $MyCustomObject.PsObject.Properties.Remove('Location')\n\nPS> #\
    \ 要检查属性是否可用，运行：\nPS> $MyCustomObject.Location\n```\n\n5. 要访问属性，你可以使用成员访问运算符（`.`）。\n\
    \n```bash\nPS> $MyCustomObject.Name \nPrashanth Jayaram\n\nPS> $MyCustomObject.Title\
    \ \nPowerShell\n\nPS> $MyCustomObject.Publication \nPackt\n```\n\n# 工作原理...\n\n\
    创建一个对象非常简单。你只需要告诉 PowerShell 你正在创建一个自定义对象，方法是调用 `[psobject]` 快速加速器并指定你想要添加到对象中的属性。在调用加速器后，我们指定属性的名称并为它们赋值。记录是使用使用哈希字面量表示法（`Name\
    \ = 'Prashanth'`）逐条添加的。\n\n在这个阶段，很容易将哈希表（hashtable）与 PSObject 混淆，因为我们在创建对象时使用了哈希字面量表示法。记住，它们之间是非常不同的。我们将在“数组和哈希表”章节中详细介绍哈希表的细节。\n\
    \n我们在创建的自定义对象中提到了三个属性：`Name`、`Title` 和 `Publisher`。如果我们将来想添加更多属性，只需简单地使用 `Add-Member`\
    \ cmdlet，在其中我们指定对象（我们通过流水线传递对象）、指定属性名称并为其赋值。\n\n删除属性要稍微复杂一点，因为我们既没有 `Remove-Member`\
    \ cmdlet，而且我们在步骤中使用的成员并不容易被发现。例如，`[PSCustomObject] | Get-Member` 并没有显示 `PsObject`\
    \ 是它的成员。我们调用了我们创建的自定义对象中 `PSObject` 对象内部的 `Properties` 对象的 `Remove` 方法。（真多的对象啊！）\n\
    \n在对象中访问属性，只需像使用成员访问运算符配合属性名一样简单。\n\n# 另\n\n1. 配方：创建并初始化一个简单的哈希表\n\n# 从返回的对象创建自定义对象\n\
    \n我们现在知道如何从零创建一个自定义对象。在这个配方中，我们将使用一个返回的对象，并修改该返回的对象来创建一个自定义对象。当我们学习循环时，将扩展这种能力以创建多功能自定义对象；在生产环境中，这种能力可以实现更多！\n\
    \n# 如何实现...\n\n学习某事的第一步是简化。因此，我们将只选择一个实例并对其进行操作。\n\n1. 获取所有进程，选择名称、ID、工作集和开始时间，选取第\
    \ 5 个进程并将其赋值给变量。\n\n```bash\nPS> $Process = (Get-Process | Select-Object Name,\
    \ Id, WS, StartTime)[4]\n```\n\n2. 假设我们不喜欢对象中属性的名称。让我们更改名称。\n\n```bash\nPS> $CustomProcess\
    \ = New-Object -TypeName PSObject -Property @\n  ProcessName = $Process.Name\n\
    \  ProcessId = $Process.Id\n  WorkingSet = $Process.WS\n  StartedAt = $Process.StartTime\n\
    }\nPS> $CustomProcess\n```\n\n![](img/a42cf4a5-4cb5-4112-9157-fd017a8d4192.png)\n\
    \n3. 但那并不是我们指定的顺序。让我们按照顺序获取它们。\n\n```bash\nPS> $CustomProcess = [ordered]@{\n\
    \  ProcessName = $Process.Name\n  ProcessId = $Process.Id\n  WorkingSet = $Process.WS\n\
    \  StartedAt = $Process.StartTime\n} \nPS> New-Object -TypeName PSObject -Property\
    \ $CustomProcess\n```\n\n![](img/609d4d23-847e-4300-9453-0071a046f302.png)\n\n\
    4. 使用进程运行时长的信息而不是开始时间重新创建对象。\n\n"
- fmt: "\n```javascript\nPS> $CustomProcess = [ordered]@{\n  ProcessName = $Process.Name\n\
    \  ProcessId = $Process.Id\n  WorkingSet = $Process.WS\n  RunningMins = [math]::Floor(((Get-Date)\
    \ - $Process.StartTime).TotalMinutes)\n}\nPS> New-Object -TypeName PsObject -Property\
    \ $CustomProcess\n```\n\n![](Images/9708bd11-619f-45c9-8842-7aac2c1ac587.png)\n\
    \n# How it works...\n\nIn this recipe, we created a custom object (`$CustomProcess`)\
    \ from an output object (`$Process`). The properties within `$Process` can be\
    \ accessed using the member access operator. Values from `$Process` are treated\
    \ as values for the properties in `$CustomObject`, however, the names in `$CustomObject`\
    \ are different. In this recipe, we also used a calculated property, `RunningMins`.\n\
    \nAn important point to note here is that the outcome of this recipe can also\
    \ be achieved using calculated properties along with `Select-Object`. However,\
    \ in situations where object versatility is important and the number of instances\
    \ of the objects is significantly larger, it is simpler to use a custom object.\
    \ We will extend this capability in future chapters, after we learn to use looping\
    \ constructs.\n\nThe other point to note is the use of the `[ordered]` accelerator.\
    \ More often than not, the properties of custom objects do not appear in the sequence\
    \ we mention them in. In this recipe, we separate the hash literal notation from\
    \ the creation of the custom object. We first create an ordered hashtable with\
    \ the property names as well as the property values, and then, specify the created\
    \ hashtable for the `Property` parameter of the `New-Object` cmdlet to create\
    \ the custom object with the properties showing in the sequence we want.\n\n#\
    \ See also\n\n1. [Creating .NET and COM Objects](https://docs.microsoft.com/en-us/powershell/scripting/getting-started/cookbooks/creating-.net-and-com-objects--new-object-?view=powershell-6)\
    \ (Microsoft Docs)\n\n# Understanding extension of Type Data\n\nIn the recipe,\
    \ *Selecting columns from the output*, we used a hashtable to set the name and\
    \ the expression for a custom-named column. Later, we also used a small calculation\
    \ within the `Select-Object` statement to get a calculated output. If you tried\
    \ to select the column by the new name, that would have worked, too. Technically,\
    \ you have already extended the object. But what is type data anyway? And why\
    \ do we need a recipe to extend it when we can work with `Select-Object`?\n\n\
    Going too deep into what type data is and how to work with them along with .NET\
    \ classes and objects could potentially make the concept an \"advanced\" one.\
    \ Historically, most of us learners have procrastinated learning \"advanced\"\
    \ topics. Therefore, we will stick to the simple parts of it, and work only with\
    \ PowerShell for now. This recipe will serve as a launchpad to help you understand\
    \ what it is by making it simple and fun, keeping it away from anything \"advanced\"\
    , in the interest of learning.\n\nThere are two options to extend the type data:\n\
    \n1. Using PowerShell cmdlets (to understand how it all works)\n2. Using an XML\
    \ file (for portability)\n\n# Getting ready\n\nTo understand what we are talking\
    \ about, here, you need to have read the following recipes:\n\n1. Selecting columns\
    \ from the output\n2. Creating a custom object from a returned object\n\nLet us\
    \ come back to the question: Why extend type data when we can use `Select-Object`?\n\
    \nEfficiency. While you could change the name, add a calculation, and reference\
    \ the calculated property with the new name, that change would have existed only\
    \ in that context. If you added it to a variable, as in the last recipe, *Creating\
    \ a custom object from a returned object*, where we did some nifty changes to\
    \ the names and also created a custom `NoteProperty`, that would be a long way\
    \ to go about it. Enter: extension of type data.\n\nThe rule of the thumb is,\
    \ if you do something repetitively, there's an issue: you haven't considered automating\
    \ it. For example, if you run:\n\n```bash\nPS> Get-ChildItem -Path . | select\
    \ Name, Length, @{Name='Age'; Expression={[math]::Round(((Get-Date) - $_.LastWriteTime).TotalDays)}}\n\
    ```\n\ninstead of:\n\n```bash\nPS> Get-ChildItem -Path . | select Name, Length,\
    \ Age\n```\n\nand you do it fifteen times a day, you should consider extending\
    \ the object to give you what you care about.\n\n# How to do it...\n\nNavigate\
    \ to the location where you created files for lab usage.\n\n1. Enter the following\
    \ command:\n\n```bash\nPS> $FilesWithAge = Get-ChildItem . | Select-Object Name,\
    \ Length, LastWriteTime\n```\n\n2. Now, add a property to the variable, `$FilesWithAge`;\
    \ the property should be the age of each file, in days.\n\n```bash\nPS> $FilesWithAge\
    \ | Add-Member -MemberType ScriptProperty -Name Age -Value { [math]::Round(((Get-Date)\
    \ - $this.LastWriteTime).TotalDays) }\n```\n\n3. Add another property to it, called\
    \ `ComputerName`, which is the name of your local host.\n\n```bash\nPS> $ComputerName\
    \ = hostname\nPS> $FilesWithAge | Add-Member -MemberType NoteProperty -Name ComputerName\
    \ -Value $ComputerName\n```\n\n4. Add another property, as an alias to `LastWriteTime`,\
    \ called `Modified`.\n\n```bash\nPS> $FilesWithAge | Add-Member -MemberType AliasProperty\
    \ -Name Modified -Value LastWriteTime\n```\n\n5. To format it like a nice table,\
    \ use the following:\n\n```bash\nPS> $FilesWithAge | Format-Table -AutoSize\n\
    ```\n\n![](Images/8be1b9ba-03be-4dd0-825e-63cb802c0205.png)\n\n6. Now, delete\
    \ the variable. And query the files within the current directory (because that\
    \ is what the variable actually held).\n\n```bash\nPS> Remove-Variable FilesWithAge\n\
    PS> Get-ChildItem .\n```\n\nYou do not see the `Age`, the `ComputerName` or the\
    \ `Modified` properties. Try `Get-Member` if you would like.\n\nNext, we see how\
    \ to extend the type data itself, so that every time you run `Get-ChildItem`,\
    \ you also get the three properties we added to the variable.\n\n7. Get what object\
    \ is returned when you run `Get-ChildItem`.\n\n```bash\nPS> Get-ChildItem | Get-Member\n\
    ```\n\n8. You get `System.IO.DirectoryInfo` as well as `System.IO.FileInfo`. We\
    \ pick `System.IO.FileInfo`. Run the following commands.\n\n```bash\nPS> $ComputerName\
    \ = hostname \n\nPS> Update-TypeData -TypeName System.IO.FileInfo -MemberType\
    \ NoteProperty -Name ComputerName -Value $ComputerName\n\nPS> Update-TypeData\
    \ -TypeName System.IO.FileInfo -MemberType AliasProperty -Name Modified -Value\
    \ LastWriteTime\n\nPS> Update-TypeData -TypeName System.IO.FileInfo -MemberType\
    \ ScriptProperty -Name Age -Value { [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\
    \ } \n```\n\n9. Query the contents of the current location and optionally, format\
    \ the output like a table.\n\n```bash\nPS> Get-ChildItem . | Select-Object Name,\
    \ Length, ComputerName, Age, Modified | Format-Table -AutoSize\n```\n\n![](Images/c5b3b81f-1763-4c48-8193-e924941e8b58.png)\n\
    \n10. Do the same for any directory in the file system, the only condition being\
    \ that the directory should contain at least one file, and not just more directories.\n\
    \n```bash\nPS> Get-ChildItem ./cities/ | Select-Object Name, Length, ComputerName,\
    \ Age, Modified | Format-Table -AutoSize\n```\n"
  raw: "```\nPS> $CustomProcess = [ordered]@{\n  ProcessName = $Process.Name\n  ProcessId\
    \ = $Process.Id\n  WorkingSet = $Process.WS\n  RunningMins = [math]::Floor(((Get-Date)\
    \ - $Process.StartTime).TotalMinutes)\n}\nPS> New-Object -TypeName PsObject -Property\
    \ $CustomProcess\n```\n\n![](Images/9708bd11-619f-45c9-8842-7aac2c1ac587.png)\n\
    \n# How it works...\n\nIn this recipe, we created a custom object (`$CustomProcess`)\
    \ from an output object (`$Process`). The properties within `$Process` can be\
    \ accessed using the member access operator. Values from `$Process` are treated\
    \ as values for the properties in `$CustomObject`, however, the names in `$CustomObject`\
    \ are different. In this recipe, we also used a calculated property, `RunningMins`.\n\
    \nAn important point to note here is that the outcome of this recipe can also\
    \ be achieved using calculated properties along with `Select-Object`. However,\
    \ in situations where object versatility is important and the number of instances\
    \ of the objects is significantly larger, it is simpler to use a custom object.\
    \ We will extend this capability in future chapters, after we learn to use looping\
    \ constructs.\n\nThe other point to note is the use of the `[ordered]` accelerator.\
    \ More often than not, the properties of custom objects do not appear in the sequence\
    \ we mention them in. In this recipe, we separate the hash literal notation from\
    \ the creation of the custom object. We first create an ordered hashtable with\
    \ the property names as well as the property values, and then, specify the created\
    \ hashtable for the `Property` parameter of the `New-Object` cmdlet to create\
    \ the custom object with the properties showing in the sequence we want.\n\n#\
    \ See also\n\n1.  [Creating .NET and COM Objects](https://docs.microsoft.com/en-us/powershell/scripting/getting-started/cookbooks/creating-.net-and-com-objects--new-object-?view=powershell-6)\
    \ (Microsoft Docs)\n\n# Understanding extension of Type Data\n\nIn the recipe,\
    \ *Selecting columns from the output*, we used a hashtable to set the name and\
    \ the expression for a custom-named column. Later, we also used a small calculation\
    \ within the `Select-Object` statement to get a calculated output. If you tried\
    \ to select the column by the new name, that would have worked, too. Technically,\
    \ you have already extended the object. But what is type data anyway? And why\
    \ do we need a recipe to extend it when we can work with `Select-Object`?\n\n\
    Going too deep into what type data is and how to work with them along with .NET\
    \ classes and objects could potentially make the concept an \"advanced\" one.\
    \ Historically, most of us learners have procrastinated learning \"advanced\"\
    \ topics. Therefore, we will stick to the simple parts of it, and work only with\
    \ PowerShell for now. This recipe will serve as a launchpad to help you understand\
    \ what it is by making it simple and fun, keeping it away from anything \"advanced\"\
    , in the interest of learning.\n\nThere are two options to extend the type data:\n\
    \n1.  Using PowerShell cmdlets (to understand how it all works)\n\n2.  Using an\
    \ XML file (for portability)\n\n# Getting ready\n\nTo understand what we are talking\
    \ about, here, you need to have read the following recipes:\n\n1.  Selecting columns\
    \ from the output\n\n2.  Creating a custom object from a returned object\n\nLet\
    \ us come back to the question: Why extend type data when we can use `Select-Object`?\n\
    \nEfficiency. While you could change the name, add a calculation, and reference\
    \ the calculated property with the new name, that change would have existed only\
    \ in that context. If you added it to a variable,  as in the last recipe, *Creating\
    \ a custom object from a returned object*, where we did some nifty changes to\
    \ the names and also created a custom `NoteProperty`, that would be a long way\
    \ to go about it. Enter: extension of type data.\n\nThe rule of the thumb is, \
    \ If you do something repetitively, there's an issue: you haven't considered automating\
    \ it. For example,  if you run:\n\n```\nPS> Get-ChildItem -Path . | select Name,\
    \ Length, @{Name='Age'; Expression={[math]::Round(((Get-Date) - $_.LastWriteTime).TotalDays)}}\n\
    ```\n\ninstead of:\n\n```\nPS> Get-ChildItem -Path . | select Name, Length, Age\n\
    ```\n\nand you do it fifteen times a day, you should consider extending the object\
    \ to give you what you care about.\n\n# How to do it...\n\nNavigate to the location\
    \ where you created files for lab usage.\n\n1.  Enter the following command:\n\
    \n```\nPS> $FilesWithAge = Get-ChildItem . | Select-Object Name, Length, LastWriteTime\n\
    ```\n\n2.  Now, add a property to the variable, `$FilesWithAge`; the property\
    \ should be the age of each file, in days.\n\n```\nPS> $FilesWithAge | Add-Member\
    \ -MemberType ScriptProperty -Name Age -Value { [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\
    \ }\n```\n\n3.  Add another property to it, called `ComputerName`, which is the\
    \ name of your local host.\n\n```\nPS> $ComputerName = hostname\nPS> $FilesWithAge\
    \ | Add-Member -MemberType NoteProperty -Name ComputerName -Value $ComputerName\n\
    ```\n\n4.  Add another property, as an alias to `LastWriteTime`, called `Modified`.\n\
    \n```\nPS> $FilesWithAge | Add-Member -MemberType AliasProperty -Name Modified\
    \ -Value LastWriteTime\n```\n\n5.  To format it like a nice table, use the following:\n\
    \n```\nPS> $FilesWithAge | Format-Table -AutoSize\n```\n\n![](Images/8be1b9ba-03be-4dd0-825e-63cb802c0205.png)\n\
    \n6.  Now, delete the variable. And query the files within the current directory\
    \ (because that is what the variable actually held).\n\n```\nPS> Remove-Variable\
    \ FilesWithAge\nPS> Get-ChildItem .\n```\n\nYou do not see the `Age`, the `ComputerName`\
    \ or the `Modified` properties. Try `Get-Member` if you would like.\n\nNext, we\
    \ see how to extend the type data itself, so that every time you run `Get-ChildItem`,\
    \ you also get the three properties we added to the variable.\n\n7.  Get what\
    \ object is returned when you run `Get-ChildItem`.\n\n```\nPS> Get-ChildItem |\
    \ Get-Member\n```\n\n8.  You get `System.IO.DirectoryInfo` as well as `System.IO.FileInfo`.\
    \ We pick `System.IO.FileInfo`. Run the following commands.\n\n```\nPS> $ComputerName\
    \ = hostname \n\nPS> Update-TypeData -TypeName System.IO.FileInfo -MemberType\
    \ NoteProperty -MemberName ComputerName -Value $ComputerName\n\nPS> Update-TypeData\
    \ -TypeName System.IO.FileInfo -MemberType AliasProperty -MemberName Modified\
    \ -Value LastWriteTime\n\nPS> Update-TypeData -TypeName System.IO.FileInfo -MemberType\
    \ ScriptProperty -MemberName Age -Value { [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\
    \ } \n```\n\n9.  Query the contents of the current location and optionally, format\
    \ the output like a table.\n\n```\nPS> Get-ChildItem . | Select-Object Name, Length,\
    \ ComputerName, Age, Modified | Format-Table -AutoSize\n```\n\n![](Images/c5b3b81f-1763-4c48-8193-e924941e8b58.png)\n\
    \n10.  Do the same for any directory in the file system, the only condition being\
    \ that the directory should contain at least one file, and not just more directories.\n\
    \n```\nPS> Get-ChildItem ./cities/ | Select-Object Name, Length, ComputerName,\
    \ Age, Modified | Format-Table -AutoSize\n```\n\n# How it works...\n\nIn the first\
    \ section, we added members to the objects within a certain variable. This was\
    \ a command-line-prompt-style extension to the recipe, *Creating a custom object\
    \ from a returned object*, which was, by all means, a little more efficient in\
    \ the context. However, the changes we made to the object remained only while\
    \ the variable, `$FilesWithAge`, was valid. The object returned by `Get-ChildItem`\
    \ was not modified at all."
