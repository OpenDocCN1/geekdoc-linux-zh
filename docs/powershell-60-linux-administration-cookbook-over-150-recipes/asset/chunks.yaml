    in PowerShell.


    4.  Best Practices Roundup: Formatting only in the end.


    # Comparing the outputs of Bash and PowerShell


    PowerShell and Bash are both shells, and are capable of interacting with the kernel.
    Just like how Bash can run on Windows, PowerShell can now run on Linux. While
    almost all of the aspects of which shell is better than the other is debatable,
    and the choice of shell is simply a matter of personal preference today, it is
    true that PowerShell is as powerful as .NET Core can get.


    The primary difference between the two shells is, like we have seen before, that
    PowerShell outputs objects, while Bash returns text. Manipulation of the output
    in Bash involves manipulating text first, and then running further commands on
    the manipulated text to fetch the desirable output. PowerShell, on the other hand,
    handles content as objects and by design, requires comparatively less manipulation.


    Structured data, as noted by Jeffrey Snover (the inventor of Windows PowerShell),
    is getting popular as days pass, and structured data is where PowerShell shines
    the most.


    # Getting Ready


    In this recipe, we are going to pick one example to show how simple and efficient
    it is to handle file metadata using PowerShell, primarily since the output is
    an object. We will list the files and folders within our home directory, along
    with the date and time of modification using both, `ls` in Bash and `Get-ChildItem`
    in PowerShell.


    Open up two instances of the terminal if you would so like: launch `pwsh` on one.


    # How to do it...


    1.  At the Bash prompt, enter `ls -l` to list out all the files along with the
    metadata that the command shows by default.


    ![](Images/eaf2fd5f-b91c-43ce-8e94-a7f1d764df1e.png)


    2.  Go to the terminal that has PowerShell running, and type in `Get-ChildItem`
    at the prompt.


    ![](Images/b2226dc9-7aae-4763-a1ec-249384383e49.png)


    3.  Now, let us pick only the name of the folders and the last-modified date and
    time. This is done in Bash by passing the output of `ls -l` to `awk`.


    ```

    ls -l | awk ''{print $6, $7, $8, $9}''

    ```


    ![](Images/f56c057d-072d-4881-a844-5885d5270466.png)


    4.  Next, let us pick the same information on PowerShell as well.


    ```

    Get-ChildItem | select LastWriteTime, Name

    ```


    ![](Images/94508b98-e2da-4f79-b637-8753329401cf.png)


    If you notice, the output is very similar in both the cases, however, with PowerShell,
    you see the names of the columns as well, which means that you don''t have to
    look for further documentation. Also, the selection of columns is simpler in PowerShell;
    no text manipulation is required. On the other hand, in Bash, we use the `awk`
    command to manipulate the text output.


    5.  Let''s go one step further and create a sub-directory with a space in the
    name.


    ```

    $ mkdir ''test subdirectory''

    $ ls -l | awk ''{print $6, $7, $8, $9}''

    ```


    ![](Images/60488ba8-6c4c-45d1-b5bf-145f2fc1134f.png)


    Notice that what should have been `test subdirectory`, appears as `test`.


    # How it works...


    PowerShell reads content from the file system as objects, not as text. Therefore,
    you perform a selection of the desired columns (or as we shall later see, properties)
    directly. Bash, on the other hand, outputs text, columns from which are manipulated
    using a delimiter.


    To demonstrate that this is the case, we created a new subdirectory with a space
    in its name, and we performed the column selection same as before, only in this
    case, we did not get the complete name of the new subdirectory, because the name
    contained a white space, which is a delimiter in `awk`.


    Comparing Bash and PowerShell is like comparing apples and oranges—in more ways
    than one. However, understanding the differences helps us leverage each of the
    tools to our benefit.


    # See also


    1.  Recipe: Selecting objects via the pipeline.


    # Comparing Windows PowerShell and PowerShell


    PowerShell and Windows PowerShell are two different implementations. The former
    is based on a larger framework, the .NET Framework. The latter, on the other hand
    is a more modern framework, the .NET Core. PowerShell is cross-platform since
    its parent is. Windows PowerShell, on the other hand, is Windows-only, but has
    more capabilities than PowerShell, as of writing this chapter.


    The PowerShell that this book talks about is the cross-platform PowerShell Core.
    This is referred to as *PowerShell*. The PowerShell that is Windows-specific is
    referred to as *Windows PowerShell*.


    Windows PowerShell leverages the internal components and the architectural model
    of Windows with its capabilities enhanced by WinRM as well as Windows Management
    Instrumentation. In fact, most of the differences exist because of the inherent
    differences between Windows and Unix-like operating systems.


    # Support for snap-ins


    PowerShell will not support the legacy version of modules, called **Snap-ins**.
    Many of the snap-ins of old have been repackaged to be binary modules, and therefore,
    this should not be much of a concern, because future development of these should
    in theory work on either PowerShell, provided the system calls in the binaries
    can work on the system the binary is running on. For example, even if the Windows
    Active Directory module were repackaged into a binary PowerShell module, it would
    run on Windows PowerShell as well as PowerShell on Windows, but not on PowerShell
    on Linux because Windows Active Directory does not run on Linux.


    # Convenience aliases


    One important point to note is that commands like `ls` and `mkdir` are aliases
    in Windows PowerShell, which means, running `ls` on Windows PowerShell would run
    `Get-ChildItem` in the background (this is also true for PowerShell on Windows).
    In Linux, however, running `ls` from within PowerShell would run the actual `ls`
    command; `ls` is not an alias in PowerShell on Linux, it is the command itself,
    whose output would be plain text. You can validate this by running `ls | Get-Member`
    on PowerShell on Linux, and compare it with PowerShell on Windows as well as Windows
    PowerShell. (It is, therefore, good to stick to the best practice of not using
    aliases in scripts.)


    ![](Images/f38b4dcd-f484-4673-9559-92e752c14a42.png)PowerShell knows whether it
    is running on Linux, Windows or Mac OS by means of the values of the automatic
    variables, `IsLinux`, `IsWindows` and `IsMacOS`. On any system, only one of these
    variables has the value, `True`. When PowerShell sees that `IsLinux` is `True`,
    it would run Linux commands instead of the convenience aliases that were initially
    created to facilitate Linux administrators. For more information on these automatic
    variables, read the recipe, *Configure built-in variables*.


