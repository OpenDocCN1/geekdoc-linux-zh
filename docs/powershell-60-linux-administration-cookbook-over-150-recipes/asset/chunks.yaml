    4. 最佳实践总结：仅在最后进行格式化。


    ## 比较 Bash 和 PowerShell 的输出


    PowerShell 和 Bash 都是 shell，并且能够与内核交互。就像 Bash 可以运行在 Windows 上一样，PowerShell 现在也可以运行在
    Linux 上。虽然关于哪种 shell 比另一个更好在几乎所有方面都存在争议，而且今天对 shell 的选择仅仅是个人喜好的问题，但 PowerShell
    的强大程度确实达到了 .NET Core 能达到的最高程度。


    这两个 shell 之间的主要区别正如我们之前看到的，PowerShell 输出的是对象，而 Bash 返回的是文本。在 Bash 中对输出的操作涉及先处理文本，然后在处理后的文本上运行后续命令以获取所需的输出。相反，PowerShell
    将内容处理为对象，并且根据设计需要相对较少的操作。


    正如 Jeffrey Snover（Windows PowerShell 的发明者）提到的，随着时间的推移，结构化数据变得流行，而结构化数据正是 PowerShell
    最出色的地方。


    ## 准备工作


    在这个食谱中，我们将选取一个示例来展示使用 PowerShell 处理文件元数据是多么简单高效，主要是因为输出是一个对象。我们将分别使用 Bash 中的 `ls`
    和 PowerShell 中的 `Get-ChildItem` 列出主目录下的文件和文件夹，以及修改日期时间。


    如果你愿意，可以打开两个终端实例：在其中一个启动 `pwsh`。


    ## 如何操作...


    1. 在 Bash 提示符下，输入 `ls -l` 列出所有文件以及命令默认显示的元数据。


    ![](img/eaf2fd5f-b91c-43ce-8e94-a7f1d764df1e.png)


    2. 转到运行 PowerShell 的终端，在提示符处输入 `Get-ChildItem`。


    ![](img/b2226dc9-7aae-4763-a1ec-249384383e49.png)


    3. 现在，让我们只选择文件夹名称以及最后修改的日期时间。这在 Bash 中通过将 `ls -l` 的输出传递给 `awk` 实现。


    ```

    ls -l | awk ''{print $6, $7, $8, $9}''

    ```


    ![](img/f56c057d-072d-4881-a844-5885d5270466.png)


    4. 接下来，让我们在 PowerShell 中选择相同的信息。


    ```

    Get-ChildItem | select LastWriteTime, Name

    ```


    ![](img/94508b98-e2da-4f79-b637-8753329401cf.png)


    如果你发现，这两种情况下输出都非常相似，但在 PowerShell 中，你还能看到列名，这意味着你不需要去查找进一步的文档了。此外，在 PowerShell
    中选择列的选择更简单；不需要进行文本处理。相反，在 Bash 中，我们使用 `awk` 命令来处理文本输出。


    5. 让我们再进一步，创建一个名称中带有空格的子目录。


    ```

    $ mkdir ''test subdirectory''

    $ ls -l | awk ''{print $6, $7, $8, $9}''

    ```


    ![](img/60488ba8-6c4c-45d1-b5bf-145f2fc1134f.png)


    注意，本应该是 `test subdirectory` 的内容显示为 `test`。


    ## 工作原理...


    PowerShell 从文件系统读取内容时是对象，而不是文本。因此，你可以直接对所需的列（或者正如我们稍后看到的，属性）进行选择。相反，Bash 输出文本，使用分隔符对列进行处理。


    为了证明这一点，我们创建了一个名称中带有空格的新子目录，并执行了与之前相同的列选择，只是在这种情况下，我们没有得到新子目录的完整名称，因为名称包含一个空格，而空格是
    `awk` 中的分隔符。


    比较 Bash 和 PowerShell 就像在比较苹果和橘子——在多个方面都是如此。然而，理解这些差异有助于我们利用每种工具为我们所用。


    ## 另见


    1. 食谱：通过管道选择对象。


    ## 比较 Windows PowerShell 和 PowerShell


    PowerShell 和 Windows PowerShell 是两个不同的实现。前者基于较大的框架 .NET Framework。而后者是一个更现代的框架
    .NET Core。PowerShell 是跨平台的，因为它的父级也是如此。相比之下，Windows PowerShell 仅限 Windows，但在编写本章时，它的功能比
    PowerShell 更多。


    本书中讨论的 PowerShell 是跨平台的 PowerShell Core。它被称为 `PowerShell`。而特定的 Windows PowerShell
    被称为 `Windows PowerShell`。


    Windows PowerShell 利用了 Windows 的内部组件和架构模型，其功能通过 WinRM 以及 Windows 管理规范（WMI）得到了增强。事实上，大多数差异源于
    Windows 和类 Unix 操作系统之间的固有差异。


    ## 对 snap-ins 的支持


    PowerShell 将不支持名为 `Snap-ins` 的旧版本模块。许多旧 snap-ins 已经重新封装为二进制模块，因此这不应该是担心的问题，因为理论上这些内容的未来开发可以在任何
    PowerShell 上运行，只要二进制文件中的系统调用可以在二进制文件运行的系统上工作。例如，即使 Windows Active Directory 模块被重新封装为二进制
    PowerShell 模块，它也会 Windows PowerShell 以及 Windows 上的 PowerShell 上运行，但在 Linux 上的
    PowerShell 上不会，因为 Windows Active Directory 不在 Linux 上运行。


    ## 便利别名


    需要注意的一个重要点是 `ls` 和 `mkdir` 等命令是 Windows PowerShell 中的别名，这意味着在 Windows PowerShell
    上运行 `ls` 会后台运行 `Get-ChildItem`（在 Windows 上的 PowerShell 中也是如此）。但在 Linux 中，在 PowerShell
    内部运行 `ls` 将运行实际的 `ls` 命令；在 Linux 上的 PowerShell 中，`ls` 不是别名，而是命令本身，其输出是纯文本。你可以通过在
    Linux 上的 PowerShell 上运行 `ls | Get-Member` 来验证，并与 Windows 上的 PowerShell 以及 Windows
    PowerShell 进行比较。（因此，最好坚持不在脚本中使用别名的最佳实践。）


    ![](img/f38b4dcd-f484-4673-9559-92e752c14a42.png)PowerShell 通过自动变量 `IsLinux`、`IsWindows`
    和 `IsMacOS` 的值来判断它正运行在 Linux、Windows 还是 Mac OS 上。在任何系统中，这些变量中只有一个值为 `True`。当 PowerShell
    看到 `IsLinux` 为 `True` 时，它将运行 Linux 命令，而不是最初为了方便 Linux 管理员创建的便利别名。有关这些自动变量的更多信息，请阅读食谱，*配置内置变量*


