- fmt: "\nWindows administrators who are used to PowerShell Workflows in Windows PowerShell\
    \ need to note that they are absent in PowerShell. PowerShell Workflows were a\
    \ little advanced, (to put it nicely), and were used in specific scenarios, where\
    \ multiple cmdlets were to be run in parallel, or activities had to, say, survive\
    \ a reboot. Workflows work on the Windows Workflow Foundation, which isn't cross-platform.\
    \ Therefore, PowerShell Workflows will not run on PowerShell. Understand, though,\
    \ that this is no loss at all.\n\n# PowerShell Desired State Configuration\n\n\
    Desired State Configuration is work-in-progress as of writing this chapter. As\
    \ of now, there are two codebases of DSC resources: `LCM` for Linux, which is\
    \ managed by Microsoft's Unix team, and the other, `DSC Resources for Windows\
    \ PowerShell` written by the PowerShell team. It would be some time before the\
    \ DSC codebase becomes cross platform.\n\n# Listing out the aliases and using\
    \ them in place of cmdlets\n\nAliases, as the meaning goes, are alternative names\
    \ to cmdlets. They serve two purposes:\n\n1. Reduce the number of keystrokes\n\
    2. Make the transition to PowerShell smoother\n\nTraditionally, aliases were created\
    \ in PowerShell so that Windows and Linux administrators did not find the new\
    \ framework intimidating to work with. Regardless, aliases are best used only\
    \ on the command line, and not in scripts, because some aliases are not aliases\
    \ in Linux, and in general, aliases affect readability. (For instance, it would\
    \ take conscious effort to realise that `gbp` stands for `Get-PSBreakPoint`.)\n\
    \n# How to do it...\n\nNow that the best practice has been looked at, let us now\
    \ look at listing out all the aliases in the system. Like already mentioned, it\
    \ is simple to think in PowerShell. When we know that the verb to fetch any information\
    \ is `Get`, and the noun in this case would be `Alias`, the cmdlet could be `Get-Alias`.\n\
    \n1. Running a quick `Get-Command` on `Get-Alias` would tell us whether there\
    \ indeed is such a cmdlet.\n\n```\nGet-Command Get-Alias\n```\n\n2. Let us now\
    \ run `Get-Help` to understand how to use the cmdlet.\n\n```\nGet-Help Get-Alias\n\
    ```\n\nIf you're unsure about any command, or would like to reduce keystrokes\
    \ without involving aliases, use tab-completion. Write a part of the cmdlet or\
    \ parameter, and press the Tab key. PowerShell will complete the command for you,\
    \ or show you suggestions, based on which platform you're doing this on.\n\n3.\
    \ According to the help documentation, all the parameters for `Get-Alias` are\
    \ optional (they are all enclosed in `[]`). Therefore, simply running `Get-Alias`\
    \ would give us a list of all the aliases available in the current instance of\
    \ PowerShell.\n\n![](Images/1365c009-4f5b-4083-9ee8-257073c8a995.png)\n\n4. Let\
    \ us now try to resolve the alias, `gbp` to the PowerShell cmdlet that it actually\
    \ runs.\n\n```\nPS> Get-Alias gbp\n\nCommandType     Name                    \
    \                           Version    Source\n-----------     ----          \
    \                                     -------    ------\nAlias           gbp ->\
    \ Get-PSBreakpoint\n```\n\n5. Let us now look at how to do the opposite: get the\
    \ alias for a certain cmdlet. If you read the help documentation for this cmdlet,\
    \ you'd see a parameter called `Definition` in the second parameter set. This\
    \ is the actual PowerShell cmdlet that runs when an alias is called.\n\n```\n\
    PS /home/ram> Get-Alias -Definition Get-ChildItem\n\nCommandType     Name    \
    \                                           Version    Source\n-----------   \
    \  ----                                               -------    ------\nAlias\
    \           dir -> Get-ChildItem                                          \nAlias\
    \           gci -> Get-ChildItem\n```\n\n6. We can see two aliases as output,\
    \ both of which run `Get-ChildItem` under the hood. Let us now run `dir` as well\
    \ as `Get-ChildItem` and compare their outputs.\n\n```\nPS /home/ram> dir\n\n\
    \    Directory: /home/ram\n\nMode                LastWriteTime         Length\
    \ Name\n----                -------------         ------ ----\nd-----       06/04/2018\
    \     13:05                Desktop\nd-----       18/05/2018     16:01        \
    \        Documents\nd-----       18/05/2018     16:01                Downloads\n\
    d-----       06/04/2018     13:05                Music\nd-----       20/05/2018\
    \     02:17                Pictures\nd-----       06/04/2018     13:05       \
    \         Public\nd-----       06/04/2018     13:05                Templates\n\
    d-----       10/04/2018     03:41                Videos\nPS /home/ram> Get-ChildItem\n\
    \n    Directory: /home/ram\n\nMode                LastWriteTime         Length\
    \ Name\n----                -------------         ------ ----\nd-----       06/04/2018\
    \     13:05                Desktop\nd-----       18/05/2018     16:01        \
    \        Documents\nd-----       18/05/2018     16:01                Downloads\n\
    d-----       06/04/2018     13:05                Music\nd-----       20/05/2018\
    \     02:20                Pictures\nd-----       06/04/2018     13:05       \
    \         Public\nd-----       06/04/2018     13:05                Templates\n\
    d-----       10/04/2018     03:41                Videos\n```\n\n7. The two outputs\
    \ are identical. Let us now look at what type of object the commands return.\n\
    \n```\nPS /home/ram> dir | Get-Member\n\n   TypeName: System.IO.DirectoryInfo\n\
    \nName                      MemberType     Definition\n----                  \
    \    ----------     ----------\nLinkType                  CodeProperty   System.String\
    \ LinkType{get=GetLinkType;}\nMode                      CodeProperty   System.String\
    \ Mode{get=Mode;}\n...\nPS /home/ram> Get-ChildItem | Get-Member\n\n   TypeName:\
    \ System.IO.DirectoryInfo\n\nName                      MemberType     Definition\n\
    ----                      ----------     ----------\nLinkType                \
    \  CodeProperty   System.String LinkType{get=GetLinkType;}\nMode             \
    \         CodeProperty   System.String Mode{get=Mode;}\n...\n```\n\nThey returned\
    \ the same object as well.\n\n# How it works...\n\nAliases are nothing but mappings\
    \ done within PowerShell. The short words are mapped to PowerShell cmdlets, identified\
    \ by the `Definition` property in each of the aliases. Therefore, you can use\
    \ the aliases to in place of full cmdlets. Aliases also support the same parameters\
    \ as the cmdlet as well, since aliases are merely pointers to the right cmdlet.\n\
    \n# See also\n\n1. Best Practices Roundup\n\n# Creating a Custom Alias\n\nAliases,\
    \ as we saw in the previous recipe, are simply pointers to actual PowerShell cmdlets,\
    \ and therefore, creating custom alias simply involves identifying a word for\
    \ the alias you'd like to create, and map it to the PowerShell cmdlet that you'd\
    \ like to call.\n\n# How to do it...\n\n1. First, identify a word that you'd like\
    \ to use as the alias. For example, let us consider `listdir`.\n\n2. Run listdir\
    \ on PowerShell to ensure such a cmdlet (or a Linux command) does not already\
    \ exist.\n\n3. List out the cmdlets that deal with aliases, by running:\n\n```\n\
    Get-Command -Noun Alias\n```\n\nRemember that the nouns in PowerShell are singular.\
    \ Therefore, there would be no first-party cmdlet that contains `Aliases`. If\
    \ third party modules give you `Aliases` as a noun in them, they are not following\
    \ the PowerShell best practice of using singular nouns.\n\n4. `New-Alias` is the\
    \ cmdlet we are looking for, since it creates a new alias. (`Set-Alias` is used\
    \ to modify an alias that already exists.)\n\n5. Read the help documentation for\
    \ `New-Alias` by running:\n\n```\nGet-Help New-Alias\n```\n\nThe help document\
    \ indicates that only the Name and Value parameters are mandatory. We shall use\
    \ only the two to create this simple alias.\n\n6. Run the following to create\
    \ the custom alias:\n\n```\nNew-Alias listdir Get-ChildItem\n```\n\n7. See whether\
    \ the alias was created as desired or not.\n\n```\nPS> Get-Alias listdir\n\nCommandType\
    \     Name                                               Version    Source\n-----------\
    \     ----                                               -------    ------\nAlias\
    \           listdir -> Get-ChildItem\n```\n"
  raw: "Windows administrators who are used to PowerShell Workflows in Windows PowerShell\
    \ need to note that they are absent in PowerShell. PowerShell Workflows were a\
    \ little advanced, (to put it nicely), and were used in specific scenarios, where\
    \ multiple cmdlets were to be run in parallel, or activities had to, say, survive\
    \ a reboot. Workflows work on the Windows Workflow Foundation, which isn't cross-platform.\
    \ Therefore, PowerShell Workflows will not run on PowerShell. Understand, though,\
    \ that this is no loss at all.\n\n# PowerShell Desired State Configuration\n\n\
    Desired State Configuration is work-in-progress as of writing this chapter. As\
    \ of now, there are two codebases of DSC resources: LCM for Linux, which is managed\
    \ by Microsoft's Unix team, and the other, DSC Resources for Windows PowerShell\
    \ written by the PowerShell team. It would be some time before the DSC codebase\
    \ becomes cross-platform.\n\n# Listing out the aliases and using them in place\
    \ of cmdlets\n\nAliases, as the meaning goes, are alternative names to cmdlets.\
    \ They serve two purposes:\n\n1.  Reduce the number of keystrokes\n\n2.  Make\
    \ the transition to PowerShell smoother\n\nTraditionally, aliases were created\
    \ in PowerShell so that Windows and Linux administrators did not find the new\
    \ framework intimidating to work with. Regardless, aliases are best used only\
    \ on the command line, and not in scripts, because some aliases are not aliases\
    \ in Linux, and in general, aliases affect readability. (For instance, it would\
    \ take conscious effort to realise that `gbp` stands for `Get-PSBreakPoint`.)\n\
    \n# How to do it...\n\nNow that the best practice has been looked at, let us now\
    \ look at listing out all the aliases in the system. Like already mentioned, it\
    \ is simple to think in PowerShell. When we know that the verb to fetch any information\
    \ is `Get`, and the noun in this case would be `Alias`, the cmdlet could be `Get-Alias`.\n\
    \n1.  Running a quick `Get-Command` on `Get-Alias` would tell us whether there\
    \ indeed is such a cmdlet.\n\n```\nGet-Command Get-Alias\n```\n\n2.  Let us now\
    \ run `Get-Help` to understand how to use the cmdlet.\n\n```\nGet-Help Get-Alias\n\
    ```\n\nIf you're unsure about any command, or would like to reduce keystrokes\
    \ without involving aliases, use tab-completion. Write a part of the cmdlet or\
    \ parameter, and press the Tab key. PowerShell will complete the command for you,\
    \ or show you suggestions, based on which platform you're doing this on.\n\n3.\
    \  According to the help documentation, all the parameters for `Get-Alias` are\
    \ optional (they are all enclosed in `[]`). Therefore, simply running `Get-Alias`\
    \ would give us a list of all the aliases available in the current instance of\
    \ PowerShell.\n\n![](Images/1365c009-4f5b-4083-9ee8-257073c8a995.png)\n\n4.  Let\
    \ us now try to resolve the alias, `gbp` to the PowerShell cmdlet that it actually\
    \ runs.\n\n```\nPS> Get-Alias gbp\n\nCommandType     Name                    \
    \                           Version    Source\n-----------     ----          \
    \                                     -------    ------\nAlias           gbp ->\
    \ Get-PSBreakpoint\n```\n\n5.  Let us now look at how to do the opposite: get\
    \ the alias for a certain cmdlet. If you read the help documentation for this\
    \ cmdlet, you'd see a parameter called `Definition` in the second parameter set.\
    \ This is the actual PowerShell cmdlet that runs when an alias is called.\n\n\
    ```\nPS /home/ram> Get-Alias -Definition Get-ChildItem\n\nCommandType     Name\
    \                                               Version    Source\n-----------\
    \     ----                                               -------    ------\nAlias\
    \           dir -> Get-ChildItem                                          \nAlias\
    \           gci -> Get-ChildItem\n```\n\n6.  We can see two aliases as output,\
    \ both of which run `Get-ChildItem` under the hood. Let us now run `dir` as well\
    \ as `Get-ChildItem` and compare their outputs.\n\n```\nPS /home/ram> dir\n\n\
    \    Directory: /home/ram\n\nMode                LastWriteTime         Length\
    \ Name\n----                -------------         ------ ----\nd-----       06/04/2018\
    \     13:05                Desktop\nd-----       18/05/2018     16:01        \
    \        Documents\nd-----       18/05/2018     16:01                Downloads\n\
    d-----       06/04/2018     13:05                Music\nd-----       20/05/2018\
    \     02:17                Pictures\nd-----       06/04/2018     13:05       \
    \         Public\nd-----       06/04/2018     13:05                Templates\n\
    d-----       10/04/2018     03:41                Videos\nPS /home/ram> Get-ChildItem\n\
    \n    Directory: /home/ram\n\nMode                LastWriteTime         Length\
    \ Name\n----                -------------         ------ ----\nd-----       06/04/2018\
    \     13:05                Desktop\nd-----       18/05/2018     16:01        \
    \        Documents\nd-----       18/05/2018     16:01                Downloads\n\
    d-----       06/04/2018     13:05                Music\nd-----       20/05/2018\
    \     02:20                Pictures\nd-----       06/04/2018     13:05       \
    \         Public\nd-----       06/04/2018     13:05                Templates\n\
    d-----       10/04/2018     03:41                Videos\n```\n\n7.  The two outputs\
    \ are identical. Let us now look at what type of object the commands return.\n\
    \n```\nPS /home/ram> dir | Get-Member\n\n   TypeName: System.IO.DirectoryInfo\n\
    \nName                      MemberType     Definition\n----                  \
    \    ----------     ----------\nLinkType                  CodeProperty   System.String\
    \ LinkType{get=GetLinkType;}\nMode                      CodeProperty   System.String\
    \ Mode{get=Mode;}\n...\nPS /home/ram> Get-ChildItem | Get-Member\n\n   TypeName:\
    \ System.IO.DirectoryInfo\n\nName                      MemberType     Definition\n\
    ----                      ----------     ----------\nLinkType                \
    \  CodeProperty   System.String LinkType{get=GetLinkType;}\nMode             \
    \         CodeProperty   System.String Mode{get=Mode;}\n...\n```\n\nThey returned\
    \ the same object as well.\n\n# How it works...\n\nAliases are nothing but mappings\
    \ done within PowerShell. The short words are mapped to PowerShell cmdlets, identified\
    \ by the `Definition` property in each of the aliases. Therefore, you can use\
    \ the aliases to in place of full cmdlets. Aliases also support the same parameters\
    \ as the cmdlet as well, since aliases are merely pointers to the right cmdlet.\n\
    \n# See also\n\n1.  Best Practices Roundup\n\n# Creating a Custom Alias\n\nAliases,\
    \ as we saw in the previous recipe, are simply pointers to actual PowerShell cmdlets,\
    \ and therefore, creating custom alias simply involves identifying a word for\
    \ the alias you'd like to create, and map it to the PowerShell cmdlet that you'd\
    \ like to call.\n\n# How to do it...\n\n1.  First, identify a word that you'd\
    \ like to use as the alias. For example, let us consider `listdir`.\n\n2.  Run\
    \ listdir on PowerShell to ensure such a cmdlet (or a Linux command) does not\
    \ already exist.\n\n3.  List out the cmdlets that deal with aliases, by running:\n\
    \n```\nGet-Command -Noun Alias\n```\n\nRemember that the nouns in PowerShell are\
    \ singular. Therefore, there would be no first-party cmdlet that contains `Aliases`.\
    \ If third party modules give you `Aliases` as a noun in them, they are not following\
    \ the PowerShell best practice of using only singular nouns.\n\n4.  `New-Alias`\
    \ is the cmdlet we are looking for, since it creates a new alias. (`Set-Alias`\
    \ is used to modify an alias that already exists.)\n\n5.  Read the help documentation\
    \ for `New-Alias` by running:\n\n```\nGet-Help New-Alias\n```\n\nThe help document\
    \ indicates that only the Name and the Value parameters are mandatory. We shall\
    \ use only the two to create this simple alias.\n\n6.  Run the following to create\
    \ the custom alias:\n\n```\nNew-Alias listdir Get-ChildItem\n```\n\n7.  See whether\
    \ the alias was created as desired or not.\n\n```\nPS> Get-Alias listdir\n\nCommandType\
    \     Name                                               Version    Source\n-----------\
    \     ----                                               -------    ------\nAlias\
    \           listdir -> Get-ChildItem\n```"
