  trans: "\n\n作为管理员，我们并不经常使用 `sin`、`cos`、`log` 和 `exp` 等算术运算。然而，在 PowerShell 中可以执行所有的操作，因为\
    \ PowerShell 可以利用 .NET。通常，我们管理员可能会使用这些操作：`Abs`（绝对值）、`Ceiling`（取整）、`Floor`（地板）、`Round`（四舍五入）和\
    \ `Truncate`（截断）。在本教程中，我们将根据现有场景使用其中三种方法。其他方法的使用非常相似。以下是场景：\n\n你有一个全天创建日志的应用程序。这些日志占用了大量空间。你想清理\
    \ 30 到 31 天之前的日志。你不允许使用双重条件进行比较。\n\n创建一个函数来查找时长 30 天的文件。你的脚本应该显示清理了多少日志空间，并四舍五入到最兆\
    \ MB。\n\n# 准备工作\n\n在书籍 GitHub 仓库的 `ch05` 目录下运行脚本 `Initialize-PacktPs6CoreLinuxLab.ps1`。这只是为了让我们有一些文件可以处理。接下来，在仓库的\
    \ `ch09` 目录下运行脚本 `Set-LastWriteTime.ps1`。\n\n如果你想为内容指定 `~/random` 以外的路径，请在脚本最后一行添加\
    \ `-Path '//your/custom/path'`。确保在两个脚本中都这样操作。\n\n# 如何实现\n\n导航到包含实验文件的目录；这是所有操作发生的地方。如果你在运行脚本时没有指定自定义\
    \ -Path，它应该是 `~/random`。\n\n1. 打开终端并使用代码编辑器（`vi`、`nano` 或 VS Code）创建一个名为 `Clear-LogFiles.ps1`\
    \ 的新文件。记住，驼峰命名法只是一种约定。\n\n2. 输入以下内容。我建议你自己输入而不是复制粘贴。\n\n```\n$Today = Get-Date\n\
    $TotalFileSize = 0\n\n$FilesToDelete = Get-ChildItem . -Recurse -File | Where-Object\
    \ {[math]::Floor(($Today - $_.LastWriteTime).TotalDays) -eq 30}\n\nWrite-Host\
    \ \"The following files will be deleted:\"\nWrite-Host $FilesToDelete.FullName\n\
    \nforeach ($File in $FilesToDelete) {\n    $TotalFileSize += $File.Length\n  \
    \  Remove-Item -Path $File -WhatIf\n}\n\nWrite-Host \"Total space cleared: $([math]::Round($TotalFileSize/[math]::Pow(1024,\
    \ 2))) MB\"\n```\n\n不需要实际删除文件。如果你仍然想删除，请从第 12 行删除 `-WhatIf` 开关。\n\n建议使用 Visual\
    \ Studio Code 编写此脚本，因为它的 IntelliSense 自动完成非常有帮助。你可以在终端本身编写此脚本，在这种情况下，根据需要使用较短参数和\
    \ Tab 补全。\n\n# 工作原理\n\n`[math]::` 加速器允许我们使用 `System.Math` 类的方法。`Round()` 方法接受一个或两个参数；如果是单个参数，则舍入到最近的整数。可选的第二个参数指定小数点后的位数。\n\
    \n`Pow()` 方法几乎一言自明：在我们的案例中是 1024²。`Floor()` 方法将数字从 30.00 降低到小于 31，即降到 30。\n\n\
    这是我们做的：\n\n1. 列出要删除的文件：我们从今天起减去 `LastWriteTime`，并对其执行 Floor 操作，因为我们不被使用 `-and`\
    \ 运算符。\n2. 显示文件。\n3. 我们对每个文件执行了删除操作，同时将每个文件的大小添加到 `$TotalFileSize` 中。\n4. 最后，我们将\
    \ `$TotalFileSize` 除以 1024² 并将其四舍五入到最近的 MB。\n\n# 另另\n\n1. [System.Math Methods](https://msdn.microsoft.com/en-us/library/system.math_methods(v=vs.110).aspx)\
    \ (Microsoft 文)\n\n# 对输出进行计算\n\n在上一个教程中，我们对对象本身进行了一些巧妙的计算，并列出了 30 天的文件。在此过程中，我们还输出了要清理的总空间量。在本教程中，我们将此信息作为\
    \ PowerShell 对象输出，并在输出期间进行小型计算。场景如下：\n\n修改你在“执行算术运算”中创建的脚本，以输出结构化的 `PSCustomObject`。输出应包含目录中的文件总数、30\
    \ 天的文件以及清理的总空间量（不进行任何计算）。此外，单独显示清理出的空间量（单位为 MB）。\n\n# 准备工作\n\n如果你没有实验文件或删除了上一个教程中的文件，请在书籍\
    \ GitHub 仓库的 `ch05` 目录下运行脚本 `Initialize-PacktPs6CoreLinuxLab.ps1`。接下来，在仓库的 `ch09`\
    \ 目录下运行脚本 `Set-LastWriteTime.ps1`。\n\n# 如何实现\n\n我们将简单地基于上一个教程来节省精力和精力。与上一个教程脚本相比的更改已加粗。\n\
    \n1. 打开你喜欢的代码编辑器，在文件中输入以下内容并保存为 `ps1` 文件。\n\n```\n$Today = Get-Date\n$TotalFileSize\
    \ = 0\n\n$AllFiles = Get-ChildItem . -Recurse -File\n$FilesToDelete = $AllFiles\
    \ | Where-Object {[math]::Floor(($Today - $_.LastWriteTime).TotalDays) -eq 30}\n\
    \nforeach ($File in $FilesToDelete) {\n    $TotalFileSize += $File.Length\n  \
    \  Remove-Item -Path $File -WhatIf\n}\n\nNew-Object -TypeName psobject -Property\
    \ @{\n    TotalFiles = $AllFiles.Count\n    FilesToDelete = $FilesToDelete.Count\n\
    \    SpaceCleared = $TotalFileSize\n}\n```\n\n2. 调用 PowerShell 脚本。\n\n```\n& $HOME/Documents/code/github/powershell/ch09/02-Clear-LogFiles.ps1\n\
    ```\n\n这是输出内容的预览。\n\n![](img/23e66bdf-6918-40c5-a598-2fcce9dc03f6.png)\n\n3. 现在，只选择\
    \ `SpaceCleared` 参数。\n\n```\n(& $HOME/Documents/code/github/powershell/ch09/02-Clear-LogFiles.ps1).SpaceCleared\n\
    ```\n\n注意对 `SpaceCleared` 属性的引用，以及提示提示符之前的输出。\n\n![](img/f40eaf52-ba68-4227-8ced-94c8e9a8dfdf.png)\n\
    \n4. 将输出除以 1024² 以获得 MB 单位的值。\n\n```\n(& $HOME/Documents/code/github/powershell/ch09/02-Clear-LogFiles.ps1).SpaceCleared/[math]::Pow(1024,\
    \ 2)\n```\n\n与上面的类似；以 MB 为单位的清理总空间。\n\n![](img/82f3680a-fbf5-46d3-9d2e-614f73356e49.png)\n\
    \n# 工作原理\n\n不仅是 cmdlet 和函数，脚本也会输出对象。在上一个教程中，这是一个字符串对象；而在本次中，它是 `PSCustomObject`。通过这种方式，尽管从两个教程收集的信息是相同的，我们仍然能够通过动态运行计算来进一步处理输出。\n\
    \n# 更多\n\n1. 对 `SpaceCleared` 执行 `Round()` 操作，以以 MB 为单位的输出，并保留两位小数。\n2. 显示未被删除的文件数量。\n\
    \n将脚本的输出对象赋值给变量：`$CleanupInfo = (& //path/to/02-Clear-LogFiles.ps1)` 以于操作。\n\n\
    # 使用管理常量\n\n可能让我们我们一些人感到恼恼的是将 `Length` 属性转换为 MB 是多么困难。我们必须使用 `[math]::Pow(1024,\
    \ 2)`。简化上一个教程的输出。\n\n此外，假设你将这些文件加载在 250 GB 的 SSD 上，你想查看清理了多少百分比的空间。\n\n# 准备工作\n\
    \n如果没有实验文件或删除了上一个教程中的文件，请在书籍 GitHub 仓库的 `ch05` 目录下运行脚本 `Initialize-PacktPs6CoreLinuxLab.ps1`。接下来，在仓库的\
    \ `ch09` 目录下运行脚本 `Set-LastWriteTime.ps1`。\n\n# 如何实现\n\n我们将使用与上一个教程相同的脚本。\n\n1.\
    \ 将上一个教程返回的对象赋值给变量。\n\n```\n$FileCleanupInfo = (& //path/to/02-Clear-LogFiles.ps1)\n\
    ```\n\n2. 调用 `SpaceCleared` 属性并除以管理常量。\n\n```\n$FileCleanupInfo.SpaceCleared/1KB\n\
    $FileCleanupInfo.SpaceCleared/1MB\n$FileCleanupInfo.SpaceCleared/1GB\n```\n\n"
- fmt: "\nNotice how the results are not just the numbers divided by powers of 1000.\n\
    \n![](Images/d156b713-9b47-4582-b8d7-5a9526c42753.png)\n\n### 3. To show how much\
    \ of space got cleared from a 250 GB SSD:\n\n```\n($FileCleanupInfo.SpaceCleared)/(250*1e9)*100\n\
    ```\n\nAn almost negligible number in our case, but here it is.\n\n![](Images/5e03aa51-3d22-4c06-81fd-6b2eb4acd117.png)\n\
    \n# How it works\n\nPowerShell has been created with administrators in mind. Given\
    \ that we rely on a myriad of file operations on a regular basis, PowerShell contains\
    \ administrative constants. These constants represent powers of 1024 (1024¹, 1024²,\
    \ 1024³...).\n\nHard drive and flash drive manufacturers usually use powers of\
    \ 1000 to represent drive sizes. In our recipe, we use the scientific notation\
    \ to convert the size of the drive into bytes.\n\n# Working with calculated properties\n\
    \nIf you read through the recipe, `Selecting columns from the output` in `Passing\
    \ Data through the Pipeline`, you may skip this recipe. This recipe has been created\
    \ in the interest of context as well as those who have skipped the said chapter/recipe.\n\
    \nCalculated properties is another form of performing calculations on the fly.\
    \ Here is the scenario:\n\nYou need a report of all the files present in a certain\
    \ directory, with the names of the files, the last modified date, the full paths\
    \ and the sizes in MB.\n\n# Getting ready\n\nIf you don't have the lab files or\
    \ you deleted the files in the previous recipe, run the script, `Initialize-PacktPs6CoreLinuxLab.ps1`\
    \ from within the `ch05` directory of the book's GitHub repository. Next, run\
    \ the script, `Set-LastWriteTime.ps1` from within the `ch09` directory of the\
    \ repository.\n\n# How to do it\n\nThis is going to be a one-liner.\n\nAt the\
    \ terminal, type the following and press Enter.\n\n```\nGet-ChildItem -file -rec\
    \ | Select-Object name, lastwritetime, @{n = 'Size'; e = {[math]::Round($_.Length/1MB,\
    \ 3)}}\n```\n\n# How it works\n\nA calculated property takes in two things: the\
    \ name of the property and the expression that would produce the desired result.\
    \ Technically, this is a hashtable with `n` (or `Name`) and `e` (or `Expression`)\
    \ being the two name-value pairs. The `Expression` in itself is a script block.\
    \ When broken down into lines, the query looks like this:\n\n```\nGet-ChildItem\
    \ -File -Recurse | Select-Object Name, LastWriteTime, @{\n    Name = \"Size\"\n\
    \    Expression = {\n        [math]::Round($PSItem.Length/1MB, 3)\n    }\n}\n\
    ```\n\nSince we separated the `Name` and the `Expression` by a line, we don't\
    \ need the semicolon anymore.\n\nCalculated properties come in handy in situation\
    \ where you don't really want to create a new script, but instead, want some information\
    \ at the terminal itself, as though running a query. The value of `Name` is the\
    \ name of the property, and the values in the column are determined by the expression.\n\
    \n# Working with binary numbers\n\nIn the interest of specificity, we are going\
    \ to use the hexadecimal notification for this recipe. If you have worked with\
    \ colours on your computer, chances are that you are aware of RGB. The levels\
    \ of these primary colours are commonly represented as numbers ranging from 0\
    \ to 255 (24-bit colours). You may have also come across the hexadecimal representation\
    \ of these colours, especially if you worked with HTML/CSS.\n\nThe scenario here\
    \ is to write a simple script that converts any given hexadecimal code into decimal\
    \ RGB.\n\n# How to do it\n\nWe will assume that the input is going to with or\
    \ without the `#` (as in, `55bc9a` or `#55bc9a`).\n\n1. Open a new PowerShell\
    \ file and type the following:\n\n```\n$Rgb = Read-Host \"Enter the hexadecimal\
    \ RGB value\"\n$TrimmedRgb = $Rgb.Substring($Rgb.Length - 6)\n\n$R = $TrimmedRgb.Substring(0,\
    \ 2)\n$G = $TrimmedRgb.Substring(2, 2)\n$B = $TrimmedRgb.Substring(4, 2)\n\n\"\
    Here are the R, G and B levels for the supplied hex value:\"\n$R, $G, $B | ForEach-Object\
    \ { [int](\"0x\" + $PSItem) }\n```\n\n2. Run the script.\n\n3. Enter any valid\
    \ hexadecimal RGB value, with or without the preceding `#`. Press Enter.\n\nHere\
    \ is an example.\n\n![](Images/94d666b2-56dd-468c-8133-e16db174148d.png)\n\n#\
    \ How it works\n\nFirst, how the script works to separate the R, G and B values.\
    \ We first trim the hexadecimal string to exclude the `#` in case there is one.\
    \ We need the last 6 characters of the string. Therefore, we PowerShell to begin\
    \ the substring at 1 in case there is a `#` and 0 in case the string is 6 characters\
    \ long. We then pick two characters at a time, starting at 0 (of the trimmed string),\
    \ 2 and 4.\n\nThe conversion happens at the last line. First, we instruct PowerShell\
    \ that we would like an integer output using the cast operator. Then, we tell\
    \ PowerShell that the string is a hexadecimal string by adding `0x` to its beginning.\n\
    \nThis is a simple way of converting hexadecimal into integer. Next, we will look\
    \ at a few other conversions.\n\n# Performing base conversion\n\nThe last recipe\
    \ was a simple conversion using a cast operator and string addition. Next, we\
    \ will look at converting an integer into multiple bases such as octal, hexadecimal\
    \ and binary strings.\n\n# How to do it\n\nThe input will be taken as a string.\
    \ The output would also be string, but the octal, hexadecimal and binary representations.\
    \ We will use a .NET accelerator for this.\n\n1. Open a new PowerShell file and\
    \ type the following:\n\n```\n$InputString = Read-Host \"Enter an integer\"\n\n\
    Write-Host \"Octal representation: \" -NoNewline\nWrite-Host \"$([Convert]::ToString($InputString,\
    \ 8))\"\n\nWrite-Host \"Hexadecimal representation: \" -NoNewline\nWrite-Host\
    \ \"$([Convert]::ToString($InputString, 16))\"\n\nWrite-Host \"Binary representation:\
    \ \" -NoNewline\nWrite-Host \"$([Convert]::ToString($InputString, 2))\"\n```\n\
    \n2. Run the script and enter an integer to get the octal, hexadecimal and binary\
    \ representations of it.\n\nDo not forget to try negative numbers as well.\n\n\
    ![](Images/fc10c26b-d796-43b9-ac9b-15eba90fa9af.png)\n\n# How it works\n\nThis\
    \ recipe leverages the `[System.Convert]` .NET accelerator. The input and the\
    \ output of the script are strings.\n\nThe `ToString()` method accepts input in\
    \ the form of `int64`. When only one argument is passed, the integer is output\
    \ as it is, except the object type is no more `int`, but `string`. The optional\
    \ second argument passed to the method is the base: `2` stands for decimal, `8`\
    \ stands for octal and `16` stands for hexadecimal.\n\n# There's more\n\nWhen\
    \ I was learning PowerShell, I came across this recipe by Lee Holmes, where he\
    \ showed how file attribute flags worked in PowerShell. To see what attributes\
    \ are available in PowerShell for files and directories, and see their decimal\
    \ and binary representations, enter the following at the PowerShell prompt.\n\n\
    ```\nPS> [Enum]::GetValues([System.IO.FileAttributes]) | Select-Object `\n@{ n\
    \ = 'Property'; e = { $_ } }, \n@{ n = 'Decimal'; e = { [int]$_ } },\n@{ n = 'Binary';\
    \ e = { [Convert]::ToString([int]$_, 2) } }\n```\n\nThis is what the command gives\
    \ you.\n\n![](Images/7dcf63f7-fa21-48b0-8d58-cb8e3480c39e.png)\n\nThat brings\
    \ us to the end of this chapter. Basic arithmetic calculations have been omitted\
    \ since they are no different from any of the most common languages.\n\n# Using\
    \ Arrays and Hash Tables\n\n*Coming soon...*\n\n# Handling Files and Directories\n\
    \n*Coming soon...*\n\n# Building Scripts and Functions\n\n*Coming soon...*\n\n\
    # Advanced Concepts of Functions\n\n*Coming soon...*\n\n# Getting Under the Hood:\
    \ Debugging and Error Handling\n\n*Coming soon...*\n\n# Working with the Environment\n\
    \n*Coming soon...*\n\n# Security in PowerShell\n\n*Coming soon...*\n\n# Enterprise\
    \ Administration using PowerShell\n\n*Coming soon...*\n\n# Best Practices Round-up\n\
    \n*Coming soon...*\n\n# PowerShell and Cloud Operations\n\n*Coming soon...*\n\n\
    # Using PowerShell for SQL Database Management\n\n*Coming soon...*\n"
