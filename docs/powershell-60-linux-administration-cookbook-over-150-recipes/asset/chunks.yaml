  trans: "\n这里有一个重要的点需要注意：$this`。在处理通过管道传递的对象时，我们遇到过自动变量 `$_`（在 PowerShell V3 之后为\
    \ `$PSItem`）；该变量持有管道中对象的当前实例。然而，当我们必须执行对象扩展时，我们使用自动变量 `$this`。为什么呢？因为被引用的属性是在父对象（由\
    \ `Get-ChildItem` 返回的对象）*内部*被引用的。外部方法本应可以使用 `$_`。在某种程度上，当执行成员添加时，`$_` 甚至还不存在。此外，`$this`\
    \ 实际上指的是对象本身（即由 `Get-ChildItem` 返回的对象），而不仅仅是它的实例。\n\n当我们希望在整个会话中作为对象本身的一部分获取某个成员，而不取决于特定变量或对象实例的有效性时，我们*扩展类型数据本身*。因此，无论你在什么上下文中运行命令（cmdlet），你都能获得你添加的额外成员。当然，PowerShell\
    \ 的格式规则可能仍然不会让这些成员默认出现在输出中。不过，你始终可以特定的成员，例如使用 `Select-Object` 属性，或者简单地在属性上使用成员访问运算符：`(Get-ChildItem\
    \ .).Age`。\n\n为此，我们使用 `Update-TypeData` 令。在此语境下，`Update-TypeData` 需要 `TypeName`，正如我们已经看到的，可以通过对返回的对象使用\
    \ `Get-Member` 来确定它。\n\n我们在 `Update-TypeData` 语句中提到了四点：\n\n1. 类型名称 (TypeName)\n\
    2. 成员类型 (MemberType)\n3. 成员名称 (Name)\n4. 成员值 (MemberValue)\n\n成员类型接受多个值，我们使用了其中三个：\n\
    \n1. `AliasProperty`：它是对对象内部另一个成员的引用。新属性只是现有属性的另一个名称。因此，`Value` 参数只需要现有成员的名称。\n\
    2. `NoteProperty`：静态值。在我们的案例中，可以使用主机作为静态值。\n3. `ScriptProperty`：本质上是一个计算。我们计算最后修改日期与当前日期之间的时间跨度。该计算是成员的\
    \ `Value`，并接受脚本块（script block）。\n\n这种对对象的修改只要会话有效就是有效的；该更改不会跨会话持久化。这引出了我们下一个食谱：让对象修改跨会话持久。\n\
    \n# 参见\n\n1. 食谱 5.1：从输出中选择列\n\n# 跨会话保留对象修改\n\n在之前的食谱“理解类型数据扩展”中，我们使用了 `Update-TypeData`\
    \ 令来添加成员。然而，我们提到只要会话有效，更新就是有效的。现在，有两种方法可以使类型数据跨会话持久：\n\n1. 使用 PowerShell 配置文件（profile）。\n\
    2. 使用 XML 文件\n\nPowerShell 配置文件非常直接。但通常，类型数据扩展和格式规则是作为 PowerShell 模块的一部分封装的。在这种情况下，向配置文件添加代码并没有特别帮助。在本食谱中，我们将编写一个简单的\
    \ XML (`.ps1xml`) 文件，并加载它来扩展类型数据。\n\n# 准备工作\n\n重启你的 PowerShell 会话，以便自定义数据类型扩展被丢弃。\n\
    \n# 如何操作...\n\n我们需要一个 XML 文件。你可以使用 `New-Item` 令创建一个，或者简单地使用你喜欢的文本编辑器。我们在本食谱中使用\
    \ Visual Studio Code。\n\n1. 打开你的文本编辑器并创建一个新的空文件，将其将其保存为 `CustomTypes.ps1xml`。\n\
    2. 向 XML 文件添加以下内容。确保不要更改大小写。\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
    \ ?>\n<Types>\n <Type>\n   <Name>System.IO.FileInfo</Name>\n   <Members>\n   \
    \  <AliasProperty>\n       <Name>Modified</Name>\n       <ReferencedMemberName>LastWriteTime</ReferencedMemberName>\n\
    \     </AliasProperty>\n     <ScriptProperty>\n       <Name>Age</Name>\n     \
    \  <GetScriptBlock>[math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)</GetScriptBlock>\n\
    \     </ScriptProperty>\n     <NoteProperty>\n       <Name>ItemType</Name>\n \
    \      <Value>File</Value>\n     </NoteProperty>\n   </Members>\n </Type>\n</Types>\n\
    ```\n\n3. 将文件保存在方便的位置。\n4. 回终端（或 PowerShell 集成控制台），输入以下命令使用 XML 更新类型数据。注意 `PrependPath`\
    \ 参数。\n\n```bash\nPS> Update-TypeData -PrependPath ~/Documents/code/github/powershell/chapter-06/CustomTypes.ps1xml\n\
    ```\n\n5. 现在，列出你任意目录下的所有文件。\n\n```bash\nGet-ChildItem . -File | Select-Object\
    \ Name, Length, Age, Modified\n```\n\n你应该能看到你创建的新属性。\n\n![](img/fc352f31-1676-4f6f-b492-31380f2aa080.png)建议永远修改\
    \ `$PSHome` 目录下的 PS1XML 文件。它们由微软进行数字签名，并在升级或打补丁期间被新版本替换。\n\n# 工作原理...\n\n自定义类型和格式主要用于创建自定义模块。管理员很少需要修改内置\
    \ PowerShell 模块的类型或格式。当你确实需要修改自定义类型或格式时，请创建一个新的 PS1XML；不要修改内置文件，因为它们有数字签名，修改它们会破坏你的设置。\n\
    \n将此 PS1XML 文件视为普通的 XML 文件。这里是显示结构的一种更简单的方法。记住每个类型以及内部的每个成员都必须有一个名称。\n\n```\n\
    Types\n-- Type\n---- Members\n------ [你定义的自定义属性和方法]\n```\n\n本质上，使用 XML 进行类型扩展与我们在上一个食谱中执行类型扩展并没有太大区别，只是这里使用了\
    \ XML 文件，使得设置更具可移植性。当我们创建自定义模块时，将考虑将类型与模块一起打包，那时我们将详细如何处理路径。现在，我们通过手动指定文件的确切路径来加载\
    \ XML。如果你希望在每个会话中加载这些自定义类型，可以轻松地从配置文件调用 PS1XML。这里的可移植性体现在 XML 可以很容易地共享或部署；只需加载是手动的或通过配置文件完成——这比向配置文件添加命令要简单得多。\n\
    \n使用令更新类型数据时，我们使用了 `Name` 和 `Value` 参数，以及 `MemberType` 参数。PowerShell 理解了语境并据此设置了类型。但在\
    \ XML 的情况下，必须记住为每种成员类型使用正确的标签。例如，对于 `AliasProperty`，内部的标签应该是 `Name` 和 `ReferencedMemberName`（如下所示）；对于\
    \ `ScriptProperty`，它们应该是是 `Name` 和 `GetScriptBlock`；对于 `NoteProperty`，标签将是 `Name`\
    \ 和 `Value`。\n\n```xml\n<AliasProperty>\n   <Name>Modified</Name>\n   <ReferencedMemberName>LastWriteTime</ReferencedMemberName>\n\
    </AliasProperty>\n```\n\n此外，记住在将语句放在 `GetScriptBlock` 标签内时*不要*将整个脚本块括在大括号中：\n\n\
    ```xml\n<GetScriptBlock>\n [math]::Round(((Get-Date) - $this.LastWriteTime).TotalDays)\n\
    </GetScriptBlock>\n```\n\n而不是：\n\n```xml\n<GetScriptBlock>\n { [math]::Round(((Get-Date)\
    \ - $this.LastWriteTime).TotalDays) }\n</GetScriptBlock>\n```\n\n在加载 XML 时，我们使用\
    \ `PrependPath` 参数在内置类型加载*之前*加载我们的 XML。如果要在内置类型之后加载它们，则不需要使用 `AppendPath` 参数，除非情况真的需要，因为\
    \ `AppendPath` 是默认值。为什么参数很重要？它们决定了类型加载的优先级。\n"
- fmt: "\nThe XML file shown may look like having a large number of items. Use the\
    \ indent guide in Visual Studio Code to guide you through reading the XML. The\
    \ file, in reality, is very simple to read. And reading it will help you understand\
    \ how the properties are defined.\n\n# See also\n\n1. [The Update-TypeData cmdlet](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/update-typedata?view=powershell-6)\
    \ (Microsoft Docs)\n2. [The Types.ps1xml file](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_types.ps1xml?view=powershell-6)\
    \ (Microsoft Docs)\n\n# Removing custom type data\n\nNow that we know how to create\
    \ and update type data, the next step for us is to learn to remove the type data.\
    \ And removing the type data requires us to get the type data first. In this recipe,\
    \ we learn the process to remove type data; whether it was updated using cmdlets\
    \ or an XML.\n\n# How to do it...\n\nThe first step is to understand that a cmdlet\
    \ can output one or more types of objects. For instance, in our case, `Get-ChildItem`\
    \ output `System.IO.DirectoryInfo` as well as `System.IO.FileInfo`. Let us learn\
    \ to work with these guys.\n\n1. Get the type of the object returned by the cmdlet.\n\
    \n```\nPS> Get-ChildItem | Get-Member | Select-Object TypeName -Unique\n```\n\n\
    2. There are two types returned. We created the custom members in the second type.\
    \ Assign this to a variable.\n\n```\nPS> $TypeData = Get-ChildItem | Get-Member\
    \ | Select-Object -ExpandProperty TypeName -Unique -Last 1\n```\n\n3. Get the\
    \ type data information. Expand its members to see if the custom members are shown.\n\
    \n```\nPS> Get-TypeData -TypeName $TypeData | Select-Object -ExpandProperty Members\n\
    ```\n\n![](Images/cebc3c44-9586-4735-8b2e-b76d90b35c56.png)\n\n4. Now, remove\
    \ the type data.\n\n```\nPS> Remove-TypeData -TypeName $TypeData\n```\n\n# How\
    \ it works...\n\nThe process is straightforward. If you query the help information\
    \ for the `TypeName` parameter of `Remove-TypeData`, you would notice that it\
    \ accepts the type name accepts input via the pipeline by property value as well\
    \ as the property name. Recall the recipe, Understanding pipeline-enabled parameters,\
    \ and look at the object returned by `Get-TypeData`, for more insight.\n\nThe\
    \ `Remove-TypeData` cmdlet removes the type data from the current session. This\
    \ removal is as ephemeral as the type addition is. Therefore, the default types\
    \ and formats are not permanently removed by the cmdlet; the reason why you can\
    \ run this within PowerShell, without administrator privileges. Also remember\
    \ that the underlying XML files are not deleted either: custom or stock.\n\n#\
    \ See also\n\n1. Recipe 5.8: Understanding pipeline-enabled parameters\n\nThat\
    \ concludes the chapter. It is time to take a break, so it helps you assimilate\
    \ what you learnt. Later, experiment with different data types, create variables,\
    \ see what type of objects they contain, and what members each object contains.\
    \ We did not explicitly talk much about variables in this chapter other than environment\
    \ variables, but we used variables almost in every recipe in the chapter. Ponder\
    \ over (or better yet, practically try out) these questions:\n\n1. What can be\
    \ assigned to a variable?\n2. What does the variable contain; the entire object?\n\
    3. Can I refer to one single property of the object that a variable contains,\
    \ if at all it contains the entire object?\n4. Can I assign a certain member and\
    \ not the entire object to a variable?\n5. What if the member is a whole object\
    \ in itself? (Hint: Use `Get-Member` on the variable to find out.)\n6. What happens\
    \ when I use `Select-Object` with `-ExpandProperty` and assign the value to a\
    \ variable? What type is the variable then?\n\nThat would help you understand\
    \ more about the variables, now that you have used them so much.\n\n# Flow Control\
    \ using Branches and Loops\n\nIn this chapter, we cover the following topics:\n\
    \n1. Using If–ElseIf–Else conditions to control script flow\n2. Using Switch–Case\
    \ conditions to control script flow\n3. Learning to use delays\n4. Writing a basic\
    \ looping construct\n5. Writing a more complex loop on a predefined array\n6.\
    \ Using the For loop construct\n7. Using the While loop construct\n8. Cleaning\
    \ empty directories using the Do–While construct\n9. Cleaning empty directories\
    \ using the Do–Until construct\n\n# Introduction\n\nJust like Working with Strings,\
    \ this Flow Control is also a favourite part of PowerShell to me.\n\nMost Linux\
    \ administrators and Bash scripters would already be familiar with the concepts\
    \ such as the loops and branches, that cover these recipes. The only main difference\
    \ we would see is that we would deal with objects, and a more readable, streamlined\
    \ process of scripting.\n\n# Using If–ElseIf–Else conditions to control script\
    \ flow\n\nWe have seen how the operators work. Try out more of the operators until\
    \ it sort of becomes a second nature to you. Most of the flow control as well\
    \ as filtration in scripts happen using these operators.\n\nIn this recipe we\
    \ are going to look at conditional script flow, also known as branching. In essence,\
    \ branching works on two conditions (correct: `$true` and `$false`). And this\
    \ is generally achieved using two constructs:\n\n1. The If–ElseIf–Else construct\n\
    2. The Switch–Case construct\n\nIn this recipe, we will give ourselves a simple\
    \ problem to solve: find if today is a weekend.\n\n# Getting Ready\n\nThese recipes\
    \ require you to try them, in order to understand how they work. And these work\
    \ better on an Integrated Scripting Environment (preferably, Visual Studio Code)\
    \ than at the prompt. To run the scripts in VS Code, use the F5 key. Also, these\
    \ recipes should work identically on Windows PowerShell 3.0+ as well: the syntaxes\
    \ for these constructs are exactly the same in PowerShell and Windows PowerShell.\n\
    \n# How to do it...\n\nOpen a new PowerShell file in Visual Studio Code.\n\n1.\
    \ Enter the following in the code pane to simply find if it is a weekend.\n\n\
    ```\n$Date = Get-Date\n\nif ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n   \
    \ Write-Host 'We party on weekends!' -BackgroundColor Yellow -ForegroundColor\
    \ Black\n}\n```\n\n2. If you would like to get an output on weekdays as well:\n\
    \n```\n$Date = Get-Date\nif ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n   \
    \ Write-Host 'It is a weekend!'\n}\nelse {\n    Write-Host 'It is a weekday.'\n\
    }\n```\n\n3. If you would like to jazz it up a little, and use the whole of `if`–`elseif`–`else`:\n\
    \n```\n$Date = Get-Date\n\nif ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n \
    \   Write-Host 'We party on weekends!' -BackgroundColor Yellow -ForegroundColor\
    \ Black\n}\nelseif ($Date.DayOfWeek -eq 'Wednesday') {\n    Write-Host 'Half the\
    \ week is over, and I want to do so much more!'\n}\nelse {\n    Write-Host 'Work\
    \ is worship. Ahem!'\n}\n```\n\nIn general, `Write-Output` is a better cmdlet\
    \ to use than `Write-Host`. `Write-Host` writes the output only to the host; this\
    \ output cannot be sent to anything else without manipulation. Use `Write-Host`\
    \ only on occasions that need it.\n\n# How it works...\n\nSimple branching could\
    \ work with just the If statement. The statement checks for truth, and executes\
    \ the code block based on the outcome of the condition. In case of either–or,\
    \ where there are only two conditions, use If–Else. When there are more than two\
    \ possible outcomes, use If–ElseIf–Else. The `else` block is the catch-all.\n\n\
    # Using Switch–Case conditions to control script flow\n\nIf–ElseIf–Else work when\
    \ you have outcomes coming in categories (weekdays being five days, weekends being\
    \ two). When the outcomes are specific and/or too many in number, it could be\
    \ a little tedious to use the If–ElseIf–Else construct. To understand this better,\
    \ let us give ourselves a scenario.\n"
  raw: "The XML file shown may *look like* having a large number of items. Use the\
    \ indent guide in Visual Studio Code to guide you through reading the XML. The\
    \ file, in reality, is very simple to read. And reading it will help you understand\
    \ how the properties are defined.\n\n# See also\n\n1.  [The Update-TypeData cmdlet](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/update-typedata?view=powershell-6)\
    \ (Microsoft Docs)\n\n2.  [The Types.ps1xml file](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_types.ps1xml?view=powershell-6)\
    \ (Microsoft Docs)\n\n# Removing custom type data\n\nNow that we know how to create\
    \ and update type data, the next step for us is to learn to remove the type data.\
    \ And removing the type data requires us to get the type data first. In this recipe,\
    \ we learn the process to remove type data; whether it was updated using cmdlets\
    \ or an XML.\n\n# How to do it...\n\nThe first step is to understand that a cmdlet\
    \ can output one or more types of objects. For instance, in our case, `Get-ChildItem`\
    \ output `System.IO.DirectoryInfo` as well as `System.IO.FileInfo`. Let us learn\
    \ to work with these guys.\n\n1.  Get the type of the object returned by the cmdlet.\n\
    \n```\nPS> Get-ChildItem | Get-Member | Select-Object TypeName -Unique\n```\n\n\
    2.  There are two types returned. We created the custom members in the second\
    \ type. Assign this to a variable.\n\n```\nPS> $TypeData = Get-ChildItem | Get-Member\
    \ | Select-Object -ExpandProperty TypeName -Unique -Last 1\n```\n\n3.  Get the\
    \ type data information. Expand its members to see if the custom members are shown.\n\
    \n```\nPS> Get-TypeData -TypeName $TypeData | Select-Object -ExpandProperty Members\n\
    ```\n\n![](Images/cebc3c44-9586-4735-8b2e-b76d90b35c56.png)\n\n4.  Now, remove\
    \ the type data.\n\n```\nPS> Remove-TypeData -TypeName $TypeData\n```\n\n# How\
    \ it works...\n\nThe process is straightforward. If you query the help information\
    \ for the `TypeName` parameter of `Remove-TypeData`, you would notice that it\
    \ accepts the type name accepts input via the pipeline by property value as well\
    \ as the property name. Recall the recipe, *Understanding pipeline-enabled parameters*,\
    \ and look at the object returned by `Get-TypeData`, for more insight.\n\nThe\
    \ `Remove-TypeData` cmdlet removes the type data from the current session. This\
    \ removal is as ephemeral as the type addition is. Therefore, the *default* types\
    \ and formats are not permanently removed by the cmdlet; the reason why you can\
    \ run this within PowerShell, without administrator privileges. Also remember\
    \ that the underlying XML *files* are not deleted either: custom or stock.\n\n\
    # See also\n\n1.  Recipe 5.8: Understanding pipeline-enabled parameters\n\nThat\
    \ concludes the chapter. It is time to take a break, so it helps you assimilate\
    \ what you learnt. Later, experiment with different data types, create variables,\
    \ see what type of objects they contain, and what members each object contains.\
    \ We did not explicitly talk much about variables in this chapter other than environment\
    \ variables, but we used variables almost in every recipe in the chapter. Ponder\
    \ over (or better yet, practically try out) these questions:\n\n1.  What can be\
    \ assigned to a variable?\n\n2.  What does the variable contain; the entire object?\n\
    \n3.  Can I refer to one single property of the object that a variable contains,\
    \ if at all it contains the entire object?\n\n4.  Can I assign a certain member\
    \ and not the entire object to a variable?\n\n5.  What if the member is a whole\
    \ object in itself? (Hint: Use `Get-Member` on the variable to find out.)\n\n\
    6.  What happens when I use `Select-Object` with `-ExpandProperty` and assign\
    \ the value to a variable? What type is the variable then?\n\nThat would help\
    \ you understand more about the variables, now that you have used them so much.\n\
    \n# Flow Control using Branches and Loops\n\nIn this chapter, we cover the following\
    \ topics:\n\n1.  Using If–ElseIf–Else conditions to control script flow\n\n2.\
    \  Using Switch–Case conditions to control script flow\n\n3.  Learning to use\
    \ delays\n\n4.  Writing a basic looping construct\n\n5.  Writing a more complex\
    \ loop on a predefined array\n\n6.  Using the For loop construct\n\n7.  Using\
    \ the While loop construct\n\n8.  Cleaning empty directories using the Do–While\
    \ construct\n\n9.  Cleaning empty directories using the Do–Until construct\n\n\
    # Introduction\n\nJust like Working with Strings, this Flow Control is also a\
    \ favourite part of PowerShell to me.\n\nMost Linux administrators and Bash scripters\
    \ would already be familiar with the concepts such as the loops and branches,\
    \ that cover these recipes. The only main difference we would see is that we would\
    \ deal with objects, and a more readable, streamlined process of scripting.\n\n\
    # Using If–ElseIf–Else conditions to control script flow\n\nWe have seen how the\
    \ operators work. Try out more of the operators until it sort of becomes a second\
    \ nature to you. Most of the flow control as well as filtration in scripts happen\
    \ using these operators.\n\nIn this recipe we are going to look at conditional\
    \ script flow, also known as *branching*. In essence, branching works on two conditions\
    \ (correct: `$true` and `$false`). And this is generally achieved using two constructs:\n\
    \n1.  The If–ElseIf–Else construct\n\n2.  The Switch–Case construct\n\nIn this\
    \ recipe, we will give ourselves a simple problem to solve: find if today is a\
    \ weekend.\n\n# Getting Ready\n\nThese recipes require you to try them, in order\
    \ to understand how they work. And these work better on an Integrated Scripting\
    \ Environment (preferably, Visual Studio Code) than at the prompt. To run the\
    \ scripts in VS Code, use the F5 key. Also, these recipes should work identically\
    \ on Windows PowerShell 3.0+ as well: the syntaxes for these constructs are exactly\
    \ the same in PowerShell and Windows PowerShell.\n\n# How to do it...\n\nOpen\
    \ a new PowerShell file in Visual Studio Code.\n\n1.  Enter the following in the\
    \ code pane to simply find if it is a weekend.\n\n```\n$Date = Get-Date\n\nif\
    \ ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n    Write-Host 'We party on weekends!'\
    \ -BackgroundColor Yellow -ForegroundColor Black\n}\n```\n\n2.  If you would like\
    \ to get an output on weekdays as well:\n\n```\n$Date = Get-Date\nif ($Date.DayOfWeek\
    \ -in 'Saturday', 'Sunday') {\n    Write-Host 'It is a weekend!'\n}\nelse {\n\
    \    Write-Host 'It is a weekday.'\n}\n```\n\n3.  If you would like to jazz it\
    \ up a little, and use the whole of `if`–`elseif`–`else`:\n\n```\n$Date = Get-Date\n\
    \nif ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n    Write-Host 'We party on\
    \ weekends!' -BackgroundColor Yellow -ForegroundColor Black\n}\nelseif ($Date.DayOfWeek\
    \ -eq 'Wednesday') {\n    Write-Host 'Half the week is over, and I want to do\
    \ so much more!'\n}\nelse {\n    Write-Host 'Work is worship. Ahem!'\n}\n```\n\
    \nIn general, `Write-Output` is a better cmdlet to use than `Write-Host`. `Write-Host`\
    \ writes the output *only* to the host; this output cannot be sent to anything\
    \ else without manipulation. Use `Write-Host` only on occasions that need it.\n\
    \n# How it works...\n\nSimple branching could work with just the If statement.\
    \ The statement checks for truth, and executes the code block based on the outcome\
    \ of the condition. In case of either–or, where there are only two conditions,\
    \ use If–Else. When there are more than two possible outcomes, use If–ElseIf–Else.\
    \ The `else` block is the catch-all.\n\n# Using Switch–Case conditions to control\
    \ script flow\n\nIf–ElseIf–Else work when you have outcomes coming in categories\
    \ (weekdays being five days, weekends being two). When the outcomes are specific\
    \ and/or too many in number, it could be a little tedious to use the  If–ElseIf–Else\
    \ construct. To understand this better, let us give ourselves a scenario."
