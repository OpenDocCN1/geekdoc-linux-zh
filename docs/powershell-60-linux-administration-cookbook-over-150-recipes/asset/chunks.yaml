    *   Using a provider


    Let us first look at using the cmdlet to list out the variables built into PowerShell.


    1.  Open a terminal window. If you have one open, restart PowerShell.


    2.  Find the cmdlet that works with variables.


    ```

    PS> Get-Command -Noun Variable

    ```


    Remember that the noun in a cmdlet is always singular. Therefore, it would be
    `Variable`, and not `Variables`.


    3.  There are five cmdlets that deal with variables. We want to fetch a list of
    all variables already existing in a new session of PowerShell. Let us pick `Get-Variable`,
    and fetch help information for it.


    ```

    PS> Get-Help Get-Variable

    ```


    4.  This is the cmdlet that we need to list out all the variables predefined in
    the current scope.


    ```

    PS> Get-Variable

    ```


    That should list out all the variables predefined in the current scope.


    Any variables you define would be listed here. Hence, it is important that you
    start a fresh session of PowerShell to see what variables have been predefined.


    Let us now use a PowerShell provider to list out the variables defined in the
    current scope.


    1.  List out the PowerShell providers. We looked at providers in the previous
    chapter.


    ```

    PS> Get-PsProvider

    ```


    2.  Change location to the `Variable:` drive of the `Variable` provider. This
    is done using `Set-Location`.


    ```

    PS> Set-Location Variable:

    ```


    3.  Now, let us list out all the available child items of the `Variable:` drive.


    ```

    PS> Get-ChildItem .

    ```


    The output of this was identical to that of `Get-Variable`, called without an
    argument.


    # How it works...


    PowerShell is built with some variables that control its behaviour, and administrators
    are allowed to modify some of them to suit the needs. Some variables, however,
    cannot be modified; they are contextual, and add some amount of flexibility (or
    modularity, as the case might be) to the shell.


    One such example would be `$PWD`, which contains the path of the present directory.
    This variable changes itself based on the execution of `Set-Location`. Values
    cannot be explicitly assigned to such variables; setting values explicitly would
    have no effect on the behaviour of the shell.


    Some variables, on the other hand, accept values, and let us control the execution
    of commands and scripts. We shall look at an example in the next recipe.


    # Changing the shell behaviour using a variable


    In the previous recipe, we took a look at the existing variables. In this recipe,
    we will change the value of one of the variables to control the behaviour of PowerShell.
    Again, remember that the change in the value is ephemeral; the values would be
    reset once the PowerShell process is restarted.


    # Getting Ready


    Read the previous recipe to understand what automatic variables that come predefined.
    Also, start Visual Studio Code. Follow the steps below to start VS Code.


    1.  Open Applications (I''m using the Gnome DE, which shows all applications with
    `Super + A`).


    2.  Type in `code`.


    3.  Press `` Ctrl + ` `` to launch the terminal.


    4.  Click on New File at the welcome screen. (Or press `Ctrl + N`.)


    5.  At the bottom right of the VS Code window, you would see the file type set
    to Plain Text. Click on it; you would be taken to the command bar on top.


    6.  Type in `powershell` at the command bar. The PowerShell Integrated Console
    will open at the bottom.


    ![](Images/4695ded0-1291-4688-85fc-14410d9643aa.png)


    We are all set for the recipe now.


    # How to do it...


    1.  Let us run a command that would result in an error. For now, let us not focus
    on the syntax of the command; our only goal for now is to generate an error. At
    the first line of the script window, type in:


    ```

    Get-ChildItem /home/ram/random-directory

    Write-Host "Hello world!"

    ```


    ![](Images/b0b222fa-1b67-42e4-a78e-d22e94f2bc8a.png)


    2.  Run the two-liner script using the `F5` key.


    ![](Images/104cf932-9a53-42b2-8bed-87e13ae01667.png)


    PowerShell is prompt to show an error. It also displays the `Hello world!` string.


    3.  Now, let us set the error action preference, using the variable, `ErrorActionPreference`.
    We know there''s such a variable from the previous recipe. First, though, restart
    PowerShell. The easiest way is to click on the little bin icon at the top of the
    Integrated Console window. When VS Code asks if you would like to restart the
    session, click on Yes.


    ![](Images/b9254d0b-3222-4b7d-879b-2d8b4063252b.png)


    4.  Now, set the `ErrorActionPreference` variable. At the PowerShell Integrated
    Console, enter:


    ```

    PS> Set-Variable ErrorActionPreference SilentlyContinue

    ```


    5.  Run the two-liner script again.


    There is no error this time. And we see `Hello world!` at the console.


    If you do not want the entire script appear at the prompt, make the first line
    of the script, `Clear-Host`; this would clear the screen before showing the output.


    6.  What if you were to check whether an error was generated at all? We check
    the value of the automatic variable, `Error`.


    ```

    PS> Get-Variable Error

    ```


    ![](Images/48e32e87-abde-4edd-9ca0-6cf1a296a5aa.png)


    7.  The `Value` column contains some text. Let''s select and expand the contents
    of `Value`.


    ```

    Get-Variable Error | Select-Object -ExpandProperty Value

    ```


    ![](Images/735a62cc-1e23-4373-8710-1f1c53943594.png)


    The output text is the same as what we received before we set the error action
    preference.


    You can also simply call the `Error` variable to read all the errors that occurred
    in the current session.


    # How it works...


    By default, the error action preference is `Continue`, which means that PowerShell
    would display the error, and continue with the execution of the rest of the script
    (this effect is not noticeable when running individual commands, hence the creation
    of the two-liner, or three-liner in case you added `Clear-Host` at the top). By
    setting `ErrorActionPreference` to `SilentlyContinue`, we instruct PowerShell
    to record the error but not show it on the screen, and at the same time, go on
    with executing the rest of the script.


    # See also'
