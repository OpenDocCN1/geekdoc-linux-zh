    3.  Click on the relevant link: `.rpm` under Downloads (stable)—we will stick
    to the stable release.


    4.  Read the installation instructions if you need additional information.


    5.  Install the RPM package using the following command (assuming your download
    is at `~/Downloads` and your PWD is `~/Downloads`.


    ```

    sudo yum install <the-downloaded-file.rpm>

    ```


    # Using the AppImage package


    Using the AppImage is much simpler.


    1.  Go to [https://github.com/powershell/powershell](https://github.com/powershell/powershell).


    2.  Scroll down to the Get PowerShell section, and find the AppImage link under
    community-supported distributions.


    3.  Download the AppImage and place it at a convenient location.


    4.  Run `chmod a+x PowerShell-<version>-<architecture>.AppImage` to make the AppImage
    executable.


    5.  Call the AppImage to run PowerShell. You may be asked if you''d like the AppImage
    installed on your computer. Select Yes if you would like that.


    # How it works...


    The package manager installs the package with all its dependencies and makes the
    relevant commands available for use.


    In case of the AppImage package, the dependencies are all bundled into the package
    (including .NET Core), and the package can either run in portable mode on your
    computer, or can be installed and called. Launch PowerShell by running `pwsh`
    to take a look.


    # See also


    1.  Recipe 2.5: Comparing Windows PowerShell and PowerShell


    # Fetching Help Information in PowerShell


    Commands in PowerShell are called cmdlets (pronounced: command-lets). Cmdlets
    come pre-packaged with all the necessary help information, just like the help
