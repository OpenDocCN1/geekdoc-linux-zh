- fmt: "\nWhat PowerShell really does when running the `Install-Module` is, save the\
    \ module files in one of the locations that PowerShell looks for modules by default.\n\
    \n## See also\n\n1. Recipe: Module discovery paths in PowerShell (Creating custom\
    \ modules)\n2. Recipe 3.11: Calling a PowerShell script\n\n## Listing the Various\
    \ Providers in PowerShell\n\nOne more concept before we start preparing for administration\
    \ using PowerShell would be to understand `providers`.\n\nProviders in PowerShell\
    \ are a great example of the concept of `overloading` in object-oriented programming.\
    \ In essence, a provider is a program that logically represents non-file-system\
    \ drives as though they were drives. For instance, on Windows, the Registry is\
    \ a database of configuration. In PowerShell, the Registry is a provider; this\
    \ way, administrators can use PowerShell to navigate and manipulate Registry keys\
    \ as though they were files. This capability is available on Linux as well, however,\
    \ the providers are not as many as found on Windows.\n\n## How to do it...\n\n\
    To list out the providers in PowerShell, follow these steps:\n\n1. Run `pwsh`\
    \ to load PowerShell on the Terminal.\n2. Run the command:\n\n```\nPS> Get-PsProvider\n\
    ```\n\n![](Images/f36012e9-b8ba-4762-9952-de78c5ce0ab4.png)\n\nNote the providers\
    \ available in PowerShell, and the drives and capabilities found within these\
    \ providers.\n\n3. Navigate to the Alias: drive.\n\n```\nPS> Set-Location Alias:\n\
    ```\n\n![](Images/e52ce58e-5686-4671-816a-3cdff1cc4004.png)Notice the preceding\
    \ colon after the drive name (`Alias:` and not `Alias`). This is important to\
    \ indicate to PowerShell that you're switching drives. Without the colon, PowerShell\
    \ would simply try to look for a directory called `Alias` in your present working\
    \ directory. \n\n## How it works...\n\nAs of now, PowerShell providers don't seem\
    \ to work as intended, in Linux. However, in due course, this should be fixed.\n\
    \nProviders wrap the non-file-system like structures into themselves and present\
    \ them to PowerShell as though they were files and directories. These allow you\
    \ to navigate complex structures as though they were simply files and directories,\
    \ which are easier managed using the commands that work on the file system, such\
    \ as `Get-ChildItem`.\n\nThe `Capabilities` column in the output show capabilities\
    \ such as `Credentials`, `ShouldProcess` and `Filter` for each of the providers.\
    \ This means that the providers support passing credentials to the core, availability\
    \ of parameters such as `-WhatIf` and `-Confirm` (which are part of `ShouldProcess`)\
    \ and the ability to filter output using the `-Filter` parameter. We shall learn\
    \ about each of these in the following chapters.\n\n## See also\n\n1. Recipe:\
    \ `ShouldProcess` capabilities such as `-Confirm` and `-WhatIf` (Functions)\n\
    2. Recipe: Using the `-Filter` parameter\n\n## Introducing the Core and its Capabilities\n\
    \nIn this chapter, we cover the following topics:\n\n1. Dissecting a .NET Core\
    \ object\n2. Breaking down an output into different objects\n3. Parsing input\
    \ from text to object\n4. Comparing the outputs of Bash and PowerShell\n5. Comparing\
    \ Windows PowerShell and PowerShell\n6. Listing out the aliases and using them\
    \ in place of cmdlets\n7. Creating a custom alias\n8. Importing/Exporting custom\
    \ aliases for future use\n9. Listing out the execution policies and setting a\
    \ suitable one\n\n## Introduction\n\nMicrosoft's announcement of \"open sourcing\"\
    \ .NET in 2014 almost stirred a storm. Many rushed to the stands (so to speak)\
    \ to read about the unbelievable—how could Microsoft possibly open-source the\
    \ core of their operating system? Some were cynical, others rejoiced. Then came\
    \ the announcement a little louder and clearer that .NET Core was open source,\
    \ not the .NET Framework. Many said .NET Core was a subset of .NET Framework.\n\
    \n.NET was first announced in 2000, as a new platform based on Internet standards.\
    \ Along with it, by the end of the year, Microsoft published the `Common Language\
    \ Infrastructure` as a standard, so that anyone who wanted, could write their\
    \ own .NET framework based on those standards. .NET Framework has been the basis\
    \ of Windows since the noughties.\n\nWindows PowerShell was released to the general\
    \ market in 2006, as an implementation of .NET Framework, focussed on system administrators\
    \ (or sysadmins, to enable them to better manage their Windows workloads and automate\
    \ tasks).\n\nIn June of 2016, Microsoft released a collaboratively refactored,\
    \ more modern and efficient .NET. The .NET Core was officially born. While .NET\
    \ Framework continues to rule the Windows arena, .NET Core, which is open source\
    \ and cross-platform, has picked up great momentum and continues to grow. And\
    \ .NET Core seems to be the way forward.\n\nPowerShell (not Windows PowerShell)\
    \ is based on .NET Core, and therefore, is open source, with the same vision as\
    \ .NET Core to be cross-platform.\n\nIn this chapter, we will look at a very simple\
    \ implementation of .NET Core and compare it to the output of PowerShell to prove\
    \ that PowerShell is nothing but encapsulated .NET Core code. Along with it, we\
    \ shall look at the general behaviour of PowerShell as well.\n\n## Dissecting\
    \ a .NET Core Object\n\n.NET Core works on a cross-platform standard Common Language\
    \ Infrastructure. Therefore, it has been possible to encapsulate the internal\
    \ workings of Linux using .NET Core. As we would see in the future chapters, PowerShell\
    \ is object-oriented, just like .NET Core. For this demonstration, we would pick\
    \ a simple system class, called `System.IO.DirectoryInfo` to show information\
    \ about a certain directory. We will also compare the output .NET Core object\
    \ to the output of a PowerShell cmdlet which also shows information about a certain\
    \ directory.\n\nYou do not have to remember the names of the .NET Core classes,\
    \ methods or their syntaxes to work with PowerShell; that's the whole point of\
    \ the existence of PowerShell.\n\n## Getting Ready\n\nIf you followed along the\
    \ last chapter, you should already have PowerShell installed on your Linux computer;\
    \ open a terminal window and type in `pwsh` to invoke PowerShell.\n\nEvery `object`\
    \ has members—`properties` and `methods`. In case you're new to the concepts of\
    \ Object Oriented Programming, properties are qualities of an object (what the\
    \ object has), and methods are the capabilities of an object (what the object\
    \ can do). Therefore, to quote (arguably) the most overused example of properties\
    \ and methods: If a horse is an object, its height, its colour, etc. would be\
    \ its properties; galloping, eating, etc. would be the methods that the object\
    \ supports.\n\n## How to do it...\n\n1. With PowerShell, .NET Core is also installed\
    \ as a dependency. Let us create an object in PowerShell, which would call a .NET\
    \ class and its default constructor. This constructor requires an argument.\n\n\
    ```\nPS> New-Object -TypeName System.IO.DirectoryInfo -ArgumentList '/home/ram'\n\
    ```\n\n2. This gives us information on the directory specified, like so:\n\n```\n\
    Mode                LastWriteTime         Length Name            \n----      \
    \          -------------         ------ ----            \nd-----          5/16/18\
    \  11:03 AM                ram\n```\n\n3. There is a cmdlet in PowerShell, called,\
    \ `Get-Item`, which gives us details about a directory. Let us call this cmdlet\
    \ with the same argument as before, and see what we get.\n\n```\nPS> Get-Item\
    \ '/home/ram'\n\n    Directory: /home\n\nMode                LastWriteTime   \
    \      Length Name            \n----                -------------         ------\
    \ ----            \nd-----          5/16/18  11:03 AM                ram\n```\n\
    \n4. Close! Let us now look at the details of the output object we just received,\
    \ using the `Get-Member` cmdlet on the output of `Get-Item`.\n\n```\nPS> Get-Item\
    \ '/home/ram' | Get-Member\n```\n\n`Get-Member` shows all the members available\
    \ in the output object (most PowerShell cmdlets return objects as output, not\
    \ plain text). For more information, run `Get-Help Get-Member`.\n"
  raw: "What PowerShell really does when running the `Install-Module` is, save the\
    \ module files in one of the locations that PowerShell looks for modules by default.\n\
    \n# See also\n\n1.  Recipe: Module discovery paths in PowerShell (Creating custom\
    \ modules)\n\n2.  Recipe 3.11: Calling a PowerShell script\n\n# Listing the Various\
    \ Providers in PowerShell\n\nOne more concept before we start preparing for administration\
    \ using PowerShell would be to understand **providers**.\n\nProviders in PowerShell\
    \ are a great example of the concept of **overloading** in object-oriented programming.\
    \ In essence, a provider is a program that logically represents non-file-system\
    \ drives as though they were drives. For instance, on Windows, the Registry is\
    \ a database of configuration. In PowerShell, the Registry is a provider; this\
    \ way, administrators can use PowerShell to navigate and manipulate Registry keys\
    \ as though they were files. This capability is available on Linux as well, however,\
    \ the providers are not as many as found on Windows.\n\n# How to do it...\n\n\
    To list out the providers in PowerShell, follow these steps:\n\n1.  Run `pwsh`\
    \ to load PowerShell on the Terminal.\n\n2.  Run the command:\n\n```\nPS> Get-PsProvider\n\
    ```\n\n![](Images/f36012e9-b8ba-4762-9952-de78c5ce0ab4.png)\n\nNote the providers\
    \ available in PowerShell, and the drives and capabilities found *within* these\
    \ providers.\n\n3.  Navigate to the Alias: drive.\n\n```\nPS> Set-Location Alias:\n\
    ```\n\n![](Images/e52ce58e-5686-4671-816a-3cdff1cc4004.png)Notice the preceding\
    \ colon after the drive name (Alias: and not Alias). This is important to indicate\
    \ to PowerShell that you're switching drives. Without the colon, PowerShell would\
    \ simply try to look for a directory called Alias in your present working directory.\n\
    \n# How it works...\n\nAs of now, PowerShell providers don't seem to work as intended,\
    \ in Linux. However, in due course, this should be fixed.\n\nProviders wrap the\
    \ non-file-system like structures into themselves and present them to PowerShell\
    \ as though they were files and directories. These allow you to navigate complex\
    \ structures as though they were simply files and directories, which are easier\
    \ managed using the commands that work on the file system, such as `Get-ChildItem`.\n\
    \nThe `Capabilities` column in the output show capabilities such as `Credentials`,\
    \ `ShouldProcess` and `Filter` for each of the providers. This means that the\
    \ providers support passing credentials to the core, availability of parameters\
    \ such as `-WhatIf` and `-Confirm` (which are part of `ShouldProcess`) and the\
    \ ability to filter output using the `-Filter` parameter. We shall learn about\
    \ each of these in the following chapters.\n\n# See also\n\n1.  Recipe: `ShouldProcess`\
    \ capabilities such as `-Confirm` and `-WhatIf` (Functions)\n\n2.  Recipe: Using\
    \ the `-Filter` parameter\n\n# Introducing the Core and its Capabilities\n\nIn\
    \ this chapter, we cover the following topics:\n\n1.  Dissecting a .NET Core object\n\
    \n2.  Breaking down an output into different objects\n\n3.  Parsing input from\
    \ text to object\n\n4.  Comparing the outputs of Bash and PowerShell\n\n5.  Comparing\
    \ Windows PowerShell and PowerShell\n\n6.  Listing out the aliases and using them\
    \ in place of cmdlets\n\n7.  Creating a custom alias\n\n8.  Importing/Exporting\
    \ custom aliases for future use\n\n9.  Listing out the execution policies and\
    \ setting a suitable one\n\n# Introduction\n\nMicrosoft's announcement of \"open\
    \ sourcing\" .NET in 2014 almost stirred a storm. Many rushed to the stands (so\
    \ to speak) to read about the unbelievable—how could Microsoft possibly open-source\
    \ the core of their operating system? Some were cynical, others rejoiced. Then\
    \ came the announcement a little louder and clearer that .NET Core was open source,\
    \ not the .NET Framework. Many said .NET Core was a subset of .NET Framework.\n\
    \n.NET was first announced in 2000, as a new platform based on Internet standards.\
    \ Along with it, by the end of the year, Microsoft published the **Common Language\
    \ Infrastructure** as a standard, so that anyone who wanted, could write their\
    \ own .NET framework based on those standards. .NET Framework has been the basis\
    \ of Windows since the noughties.\n\nWindows PowerShell was released to the general\
    \ market in 2006, as an implementation of .NET Framework, focussed on system administrators\
    \ (or sysadmins, to enable them to better manage their Windows workloads and automate\
    \ tasks.\n\nIn June of 2016, Microsoft released a collaboratively refactored,\
    \ more modern and efficient .NET. The .NET Core was officially born. While .NET\
    \ Framework continues to rule the Windows arena, .NET Core, which is open source\
    \ and cross-platform, has picked up great momentum and continues to grow. And\
    \ .NET Core seems to be the way forward.\n\nPowerShell (not *Windows* PowerShell)\
    \ is based on .NET Core, and therefore, is open source, with the same vision as\
    \ .NET Core to be cross-platform.\n\nIn this chapter, we will look at a very simple\
    \ implementation of .NET Core and compare it to the output of PowerShell to prove\
    \ that PowerShell is nothing but encapsulated .NET Core code. Along with it, we\
    \ shall look at the general behaviour of PowerShell as well.\n\n# Dissecting a\
    \ .NET Core Object\n\n.NET Core works on a cross-platform standard Common Language\
    \ Infrastructure. Therefore, it has been possible to encapsulate the internal\
    \ workings of Linux using .NET Core. As we would see in the future chapters, PowerShell\
    \ is object-oriented, just like .NET Core. For this demonstration, we would pick\
    \ a simple system class, called `System.IO.DirectoryInfo` to show information\
    \ about a certain directory. We will also compare the output .NET Core object\
    \ to the output of a PowerShell cmdlet which also shows information about a certain\
    \ directory.\n\nYou do not have to remember the names of the .NET Core classes,\
    \ methods or their syntaxes to work with PowerShell; that's the whole point of\
    \ the existence of PowerShell.\n\n# Getting Ready\n\nIf you followed along the\
    \ last chapter, you should already have PowerShell installed on your Linux computer;\
    \ open a terminal window and type in `pwsh` to invoke PowerShell.\n\nEvery **object**\
    \ has members—**properties** and **methods**. In case you're new to the concepts\
    \ of Object Oriented Programming, properties are qualities of an object (what\
    \ the object has), and methods are the capabilities of an object (what the object\
    \ can do). Therefore, to quote (arguably) the most overused example of properties\
    \ and methods: If a horse is an object, its height, its colour, etc. would be\
    \ its properties; galloping, eating, etc. would be the methods that the object\
    \ supports.\n\n# How to do it...\n\n1.  With PowerShell, .NET Core is also installed\
    \ as a dependency. Let us create an object in PowerShell, which would call a .NET\
    \ class and its default constructor. This constructor requires an argument.\n\n\
    ```\nPS> New-Object -TypeName System.IO.DirectoryInfo -ArgumentList '/home/ram'\n\
    ```\n\n2.  This gives us information on the directory specified, like so:\n\n\
    ```\nMode                LastWriteTime         Length Name            \n---- \
    \               -------------         ------ ----            \nd-----        \
    \  5/16/18  11:03 AM                ram\n```\n\n3.  There is a cmdlet in PowerShell, \
    \ called, `Get-Item`, which gives us details about a directory. Let us call this\
    \ cmdlet with the same argument as before, and see what we get.\n\n```\nPS> Get-Item\
    \ '/home/ram'\n\n    Directory: /home\n\nMode                LastWriteTime   \
    \      Length Name            \n----                -------------         ------\
    \ ----            \nd-----          5/16/18  11:03 AM                ram\n```\n\
    \n4.  Close! Let us now look at the *details* of the output object we just received,\
    \ using the `Get-Member` cmdlet on the output of `Get-Item`.\n\n```\nPS> Get-Item\
    \ '/home/ram' | Get-Member\n```\n\n`Get-Member` shows all the members available\
    \ in the output object (most PowerShell cmdlets return objects as output, not\
    \ plain text). For more information, run `Get-Help Get-Member`."
