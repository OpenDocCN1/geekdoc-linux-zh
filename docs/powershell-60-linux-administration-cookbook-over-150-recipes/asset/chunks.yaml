    注意参数在输出的 `SYNTAX` 下是分组列的。在这种情况下，我们看到了两个这样的组。这些组被称为 `Parameter Sets`（参数集）。参数集告诉我们哪些参数可以组合在一起。未出现在同一个参数集中的两个参数是不能同时使用的。


    # 工作原理...


    当你运行命令行时，并将另一个命令行作为参数传递给 `Get-Help` 时，`Get-Help` 会获取作为参数传递的命令的帮助信息；在本例中为 `Get-Command`。我们将在稍后的章节中查看如何处理参数。现在，我们只是简单地调用任意
    cmdlet 的帮助信息。


    如果你观察输出，你会看到 cmdlet 的名称、使用该 cmdlet 的语法、该 cmdlet 可用的别名，以及在需要时提供的更多在线帮助。`Full` 和
    `Examples` 是开关，用于告诉 PowerShell 你需要的帮助程度。这些开关是互斥的；你不能同时运行 `-Full` 和 `-Examples`。


    # 另另


    1. 食谱 2.6：列出别名并使用它们替代 cmdlet

    2. 食谱 1.4：更新帮助信息

    3. 食谱 1.3：为特定 cmdlet 获取帮助信息（关于参数集的信息）


    # 更新帮助


    PowerShell 中的帮助信息是动态的。在大多数情况下，PowerShell 会连接网络获取最新的帮助。然而，也可以离线存储帮助文件。这可以使用 cmdlet
    `Update-Help` 来实现。


    # 如何操作...


    要下载本地安装的 PowerShell 模块的帮助文件：


    1. 输入 `exit` 退出 PowerShell。这样你就可以以提升权限重新启动 PowerShell。

    2. 输入 `sudo pwsh` 以超级用户身份启动 PowerShell。

    3. 在 `PS` 提示符下，运行 `Update-Help`。

    4. 等待更新进度条出现。随着帮助文件下载到你的计算机，进度条将会填充。


    ![](img/0475c76f-4e54-4f67-a125-cc9b7bd7f082.png)


    # 工作原理...


    每当你运行 `Get-Help` cmdlet 时，PowerShell 都会在线获取帮助信息——帮助文件并未存储在本地。这主要是为了确保引用的都是最新的帮助信息。此外，在线查看帮助也不会占用本地计算机的空间。


    但在某些情况下，有必要存储帮助信息以便离线访问。在这些情况下，下载并存储帮助文件是有意义的。


    此操作需要提升权限的原因之一是帮助信息存储在 shell 内部。因此，非管理员可能在没有管理员干预的情况下无法更新帮助。


    # 使用关键词搜索帮助


    Linux 管理员非常习惯使用 `grep` 在任何文本输出中搜索特定的文本模式。正如我们所知的，PowerShell 只返回 `object`（对象）——PowerShell
    也将文本视为对象。


    虽然将对象转换为文本会削弱 PowerShell 的功能，但在某些场景下这是必须的。在这种情况下，我们将在帮助输出中查找关键词“common”。


    # 如何操作...


    让我们从先获取 cmdlet 的帮助信息开始开始搜索过程：


    1. 在终端中输入 `pwsh` 启动 PowerShell。

    2. 在提示符下，输入：


    ```

    PS> Get-Help Get-Command

    ```

    这应该为你提供关于指定 cmdlet 的有用信息。


    3. 使用 `Out-String` cmdlet 配合 `-Stream` 开关将输出转换为文本，每次返回一个字符串，而不是将整个帮助信息作为一个单一字符串返回。这样，我们就能更高效地运行字符串匹配并获得更短的搜索结果。


    ```

    PS> Get-Help Get-Command | Out-String -Stream

    ```

    4. 目前还没有明显的区别。添加 `Select-String` cmdlet 来执行类似 grep 的操作。


    ```

    PS> Get-Help Get-Command | Out-String -Stream | Select-String ''common''

    ```

    5. 这将为你提供一个输出，其中包含包含“common”字符串的精确行。


    ![](img/f417912f-ba4f-4748-a45f-ce68acc26dfc.png)


    # 工作原理...


    在第一步中，我们只需获取 `Get-Command` cmdlet 的帮助信息。此输出是一个对象——当输出为文本时，执行文本查找操作最好。`Out-String`
    将此输出转换为纯字符串；唯一的问题是整个文本块是一个单一字符串。这种方式的文本查找可能并没有真正帮助。我们使用 `-String` 开关将大字符串拆分为较小的部分（在本例中为段落）。接下来，我们使用
    `Select-String` 配合关键词选择包含我们关键词的字符串。


    # 查找特定参数的帮助信息


    正如我们在前面的节中看到的，PowerShell 的帮助输出可能让人无所适从。当我们需要访问的 cmdlet 的参数信息时，带有 `-Full` 开关运行
    `Get-Help`。然而，这列出了所有参数。如果我们只想获取单个参数的信息呢？


    # 发现 cmdlet


    到目前为止，我们已经了如何获取 cmdlet 的帮助。我们使用 `Get-Command` cmdlet 作为示例参数。现在我们将使用 `Get-Command`
    来发现 PowerShell 中的 cmdlet。因此，当你需要 PowerShell 中的任何帮助信息时，`Get-Help` 和 `Get-Command`
    是最重要的 cmdlet。


    PowerShell 就像普通的英语——PowerShell 在 cmdlet 命名中遵循动词-名词（Verb-Noun）格式，这使得 cmdlet 听起来像普通的英语命令。PowerShell
    甚至使用了所谓的“批准动词”（approved verbs），这确保了动词在命名 cmdlet 时遵循约定。而名词部分则可以是任意的。


    大多数程序员都会建议学习“用语言思考”。这结合肌肉记忆（有助于你记住键盘上的按键），可以让编程和脚本编写变得更快。PowerShell 的结构类似于英语，在这方面有很大帮助；用
    PowerShell 思考非常容易。例如，如果你想知道当前日期，你只需要说 `Get-Date`，PowerShell 就会在屏幕上为你打印日期和时间。


    # 如何操作...


    让我们查看如何仅获取 `Get-Help` 的 `Noun` 参数的信息。


    1. 在终端窗口上运行 `pwsh` 运行 PowerShell。

    2. 在提示符下，输入 `Get-Help Get-Command` 来查找该 cmdlet 的基本帮助信息。

    3. 记录下你想获取更多信息的参数。我们以 `Noun` 参数为例。

    4. 在提示符下输入以下命令：


    ```

    PS> Get-Help Get-Command -Parameter Noun

    ```

    输出包含关于 `Noun` 参数的特定信息：


    ![](img/35e5d79d-da5e-48da-a3a1-2a533159bf7b.png)


    # 工作原理...


    这是一个对象过滤的经典示例。由于大多数 PowerShell cmdlet 的输出都是对象，因此很容易选择必要的对象并丢弃输出中的其余部分。


    当我们带有我们需要帮助的 cmdlet 以及我们正在查找的特定参数运行 `Get-Help` 时，我们会得到针对该 cmdlet 的过滤后的帮助。在我们的案例中，我们选择了
    Noun 参数。


    # 探索 About_ 主题


    文档是 PowerShell 的优势优势。虽然并不是所有模块都有完整的文档，但所有的原生模块都有，一些良好的第三方模块也是。默认情况下，PowerShell
    本身内置了详尽的文档。


    在这个食谱中，我们将查找 `about_` 主题，从输出中选择一个主题，并对我们选择的主题进行更多阅读。


    # 如何操作...


    让我们从列出所有的 `about_*` 帮助文件开始。


    1. 使用命令 `pwsh` 调用 PowerShell。

    2. 输入 `Get-Help about_*` 列出所有的 `about_*` 帮助文件。


