    # Updating Help


    Help information in PowerShell is dynamic. In most situations, PowerShell goes
    online to fetch the latest help. However, it is also possible to store the help
    files offline. This can be done using the cmdlet, `Update-Help`.


    # How to do it...


    To download the help files for the locally-installed PowerShell modules:


    1.  Type `exit` to exit PowerShell. This is so that you can relaunch PowerShell
    with elevated privileges.


    2.  Enter `sudo pwsh` to launch PowerShell as a super-user.


    3.  At the `PS` prompt, run `Update-Help`.


    4.  Wait for the update progress bar to appear. The bar will fill as the help
    files download to your computer.


    ![](Images/0475c76f-4e54-4f67-a125-cc9b7bd7f082.png)


    # How it works...


    PowerShell goes online to fetch help information every time you run the Get-Help
    cmdlet—the help files are not stored offline. This is primarily to ensure that
    only the latest help is referred. Besides, viewing help online also does not occupy
    space on the local computer.


    In some cases, however, it is necessary that help information be stored for offline
    access. In such situations, it would make sense to download and store the help
    files.


    One of the reasons this action requires elevated privileges is that the help information
    is stored within the shell. Therefore, non-administrators may not be able to update
    help without administrator intervention.


    # Searching Help for Keywords


    Linux administrators are very comfortable using `grep` to search for specific
    text patterns in any textual output. PowerShell, as we know, returns only **object**—PowerShell
    treats text as an object as well.


    While converting an object into text diminishes the power of PowerShell, it still
    is necessary in some scenarios. In this case, we shall look for the keyword, “common”
    in the help output.


    # How to do it...


    Let us begin the process of searching by first getting the help information for
    a cmdlet:


    1.  Launch PowerShell by entering `pwsh` at the terminal.


    2.  At the prompt, type in:


    ```

    PS> Get-Help Get-Command

    ```


    This should give you helpful information on the specified cmdlet.


    3.  Convert the output into text using the Out-String cmdlet along with the -Stream
    switch to return one string at a time rather than the whole of the help information
    as a single string. This way, we''d be able to run string matching more efficiently
    and get shorter search results.


    ```

    PS> Get-Help Get-Command | Out-String -Stream

    ```


    4.  There won''t be a noticeable difference at the moment. Add the Select-String
    cmdlet to perform the grep-like operation.


    ```

    PS> Get-Help Get-Command | Out-String -Stream | Select-String ''common''

    ```


    5.  This gives you an output with the exact line that has the string, ‘common''
    in it.


    ![](Images/f417912f-ba4f-4748-a45f-ce68acc26dfc.png)


    # How it works...


    At the first step, we simply get the help information for the Get-Command cmdlet.
    This output is an object—performing a text lookup operation is best done when
    the output is text. Out-String converts this output into a plain string; the only
    issue is that the whole block of text is one single string. A text lookup this
    way may not be really helpful. We use the -String switch to break the large string
    into smaller pieces (paragraphs in this case). Next, we use the Select-String
    along with the keyword to select the string that contains our keyword.


