    \n# How it works...\n\nThe `System.DateTime` class in .NET packs a good-enough\
    \ amount of properties and methods. The `Get-Date` cmdlet leverages these properties\
    \ and methods by means of encapsulation. The `Get-Date` cmdlet, by default, pulls\
    \ the current date and time of the system, and allows you to pick child objects\
    \ from it, or quickly tie them together as formats.\n\nBesides these operations,\
    \ the cmdlet also allows you to pass simple string formed like date and time,\
    \ and converts the input string into the `DateTime` object.\n\nWhile `Get-Date`\
    \ takes into account your current locale, the type accelerator, `DateTime`, seems\
    \ to work on YMD- or the MDY-formatted date-time.\n\n# See also\n\n1. The [DateTimeFormatInfo](https://msdn.microsoft.com/library/system.globalization.datetimeformatinfo.aspx#Remarks)\
    \ Class | Remarks (Microsoft Developer Network)\n\n2. Recipe 2.3: Parsing input\
    \ from text to object (Type Accelerators)\n\n# Working with date and time functions\n\
    \nIn the previous recipe, Working with date properties, we focused on the properties\
    \ that the `DateTime` object has. The parameters we saw for `Get-Date` also worked\
    \ on these properties. In this recipe, we shall look at methods within the `DateTime`\
    \ object, and learn to use them to our benefit. The main idea behind this recipe,\
    \ though, is to make you comfortable using methods that are part of the output\
    \ objects.\n\n# How to do it...\n\nLet us first start with converting local time\
    \ into UTC.\n\n1. At the prompt, type in `Get-Date` and list out the members of\
    \ the output object.\n\n```\nPS> Get-Date | Get-Member\n```\n\n2. There is a method,\
    \ called `ToUniversalTime`. Call the method.\n\nReduce keystrokes by using tab-completion.\n\
    \n```\nPS> (Get-Date).ToUniversalTime()\n```\n\nCompare the output to your local\
    \ time.\n\n3. Next, let us see what day it would be, exactly thirty-five days\
    \ from today.\n\n```\nPS> (Get-Date).AddDays(35)\n```\n\n4. If you would like\
    \ to see what time it would be after three hours and eighteen minutes:\n\n```\n\
    PS> (Get-Date).AddHours(3).AddMinutes(18)\n```\n\n5. Next, find out how many days\
    \ have passed since the World Environment Day, 2016.\n\n```\nPS> (Get-Date).Subtract((Get-Date\
    \ '5 June 2016'))\n```\n\n![](Images/f40255e1-1726-409d-ab88-f5eae036a3b.png)\n\
    \n# How it works...\n\nThe object that is returned by `Get-Date` has several methods\
    \ just like it has properties. In this recipe, we use the methods to manipulate\
    \ date the way we need it. Methods are called with arguments. When you do not\
    \ want to specify any argument, ensure still to call the methods with an empty\
    \ pair of parentheses.\n\nMethods can be chained in the way we did in adding hours\
    \ as well as minutes. As long as the output object does not change, in most cases,\
    \ you should be able to call methods pertaining to the object by chaining them.\
    \ If, for instance, you convert the date object into string at the first method,\
    \ the second method should be a string-input-enabled method. When in doubt, use\
    \ the `Get-Member` cmdlet on the output to see what methods it would support.\n\
    \nThe `Subtract` method accepts `DateTime` as its argument. Passing a cmdlet output\
    \ as an argument to a method requires the cmdlet, along with the parameters that\
    \ are passed, to be enclosed within an additional pair of parentheses–`Subtract((Get-Date\
    \ '5 June 2016'))` as opposed to `Subtract(Get-Date '5 June 2016')`–so that the\
    \ inner command is executed first to get a value, and then, passed to the method.\n"
