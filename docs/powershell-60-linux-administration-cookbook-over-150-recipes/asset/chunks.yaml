- fmt: "\nWhat we did in this recipe was certainly non-intuitive, considering we could\
    \ use just `Where-Object` along with the `Get-ChildItem`. However, the intention\
    \ of this recipe was to demonstrate the use of `Group-Object`. The `Group-Object`\
    \ cmdlet creates groups based on the criteria we specify, and names the groups\
    \ on the criteria. In our case, the criteria for grouping was the extension, and\
    \ hence, the names of the groups were the extensions.\n\nEach of these groups\
    \ contains its elements, which are objects in themselves. If we simply want the\
    \ count and the names of the groups, we use the `NoElement` parameter. If we want\
    \ only the elements, we use the `ExpandProperty` parameter of the `Select-Object`\
    \ cmdlet and expand all the elements. The elements thus expanded are the objects\
    \ of the cmdlet preceding the `Group-Object` cmdlet (`Get-ChildItem` in our case).\n\
    \nIf `Where-Object` and other cmdlets could do what `Group-Object` could in a\
    \ complicated way, why have it in the first place? Read on until *Taking actions\
    \ on the returned objects* to know more.\n\n# There's more...\n\nIf you have gotten\
    \ a hang of tab completion, you need not even select the properties that are not\
    \ shown by default. All you have to do is type `Group-Object` after the pipe,\
    \ add a space and press Tab; PowerShell will show you what objects are available\
    \ to use for grouping. Try it with:\n\n```\nPS> Get-ChildItem . -File | Group-Object<Space><Tab>\n\
    ```\n\n# See also\n\nRecipe 05.07: Taking actions on the returned objects\n\n\
    # Sorting the output\n\nIt is time for another simple cmdlet, which would build\
    \ towards the recipe, *Taking actions on the returned objects*. In this recipe,\
    \ we will sort the output objects to meet our requirements.\n\n# How to do it...\n\
    \nWe will continue to use the directory and the files we created for the book.\
    \ If all of your files are of zero bytes, download a few files with content. The\
    \ file type does not matter.\n\n1. List out the files in the directory.\n\n```\n\
    PS> Get-ChildItem -Path .\n```\n\n2. Filter the output to have only files.\n\n\
    ```\nPS> Get-ChildItem -Path . -File\n```\n\n3. Pipe the object to the `Sort-Object`\
    \ cmdlet to sort the output based on the file size.\n\n```\nPS> Get-ChildItem\
    \ -Path . -File | Sort-Object -Property Length\n```\n\n4. The shorthand for the\
    \ expression would be:\n\n```\nPS> gci . -File | sort Length\n```\n\n5. Sort the\
    \ files, the largest file to the smallest file.\n\n```\nPS> Get-ChildItem -Path\
    \ . -File | Sort-Object -Property Length -Descending\n```\n\n6. Pick the largest\
    \ three files in the lot.\n\n```\nPS> Get-ChildItem -Path . -File | Sort-Object\
    \ -Property Length -Descending -Top 3\n```\n\n7. Create two files, and, using\
