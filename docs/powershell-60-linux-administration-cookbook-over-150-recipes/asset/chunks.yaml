    1. First, run the `Get-Command` cmdlet to know how to work with execution policies.


    ```

    Get-Command -Noun Execution*

    ```


    ![](Images/ad67d754-eabc-404d-bf92-3014549f8ff6.png)


    2. Let us now get help on running the cmdlet.


    ```

    Get-Help Get-ExecutionPolicy

    ```


    3. We want to know the execution policy set on the machine, therefore, we would
    run:


    ```

    PS> Get-ExecutionPolicy

    ```


    ![](Images/69fa2f0d-8c11-4129-9c73-e4967f4357b5.png)


    This shows the execution policy currently effective on the current PowerShell
    session.


    4. To list out the policies set at various scopes, run the following command:


    ```

    PS> Get-ExecutionPolicy -List

    ```


    ![](Images/5db273a2-fe7e-4915-99ad-c590063310a7.png)


    We see that the policy is only set at the `LocalMachine` level, and it is set
    at `RemoteSigned`, which is the same as that reflected in the previous step. The
    policy at the `LocalUser` and the `Process` scopes is `Undefined`, which made
    the session pick the execution policy from `LocalMachine`.


    Let us now set the execution policy for the local machine to be `Undefined` and
    see what our session picks up.


    5. For this to work, close the current PowerShell session and open a new session
    as the administrator.


    6. Next, run the command:


    ```

    PS> Get-Help Set-ExecutionPolicy

    ```


    ![](Images/e039790c-5185-4b1d-96be-38b1391f12e3.png)


    7. The help document shows that the value of the `ExecutionPolicy` parameter is
    mandatory, and that `Undefined` is one of the valid values it would accept. We
    want to set the policy at the `LocalMachine` scope, therefore,


    ```

    PS> Set-ExecutionPolicy Undefined -Scope LocalMachine

    ```


    8. Now, list out the execution policies at the various scopes:


    ```

    PS> Get-ExecutionPolicy -List

    ```


    ![](Images/7a2cad04-6a65-480e-9d9f-14d60b2a8e9b.png)


    9. Now, let us check the currently-effective execution policy:


    ```

    PS> Get-ExecutionPolicy

    ```


    ![](Images/91d88fe3-665a-4ea8-b9c7-1e3ab057e777.png)


    10. Let us now set the execution policy back to how it was before we began the
    recipe. You may want to change the policy to suit your needs, based on what authority
    you have on the computer.


    ```

    PS> Set-ExecutionPolicy RemoteSigned -Scope LocalMachine

    ```


    # How it works...


    Execution policies are nothing but conditions set on the system to avoid accidental
    script runs. They work at different scopes.


    There are three scopes in PowerShell, as noted already. The `LocalSystem` scope
    is at the end of the chain. Right above it is the `CurrentUser` scope. At the
    top, is the `Process` scope. The level of precedence is `Process > CurrentUser
    > LocalMachine`. Therefore, if any policy other than `Undefined` is set at the
    `Process` scope, the session would use the policy set on the process. In case
    it''s `Undefined`, it would look for the policy set on the `CurrUser` scope. If
    `CurrentUser` has the policy marked as `Undefined` as well, the session would
    apply the policy applied at the `LocalMachine` level. If `LocalMachine` has `Undefined`
    set, the session would pick the `Default` policy, which is based on what PowerShell
    has defined as the policy, which may vary based on the version of operating system.
    On Windows 2016, for instance, the default policy is `RemoteSigned`.


    The policies set at the `CurrentUser` and `LocalMachine` levels are stored in
    the Windows Registry. The policy set on the `Process` scope is stored in the ephemeral
    environment variable, `$env:PSExecutionPolicyPreference`.


    # See also


    1. [About_Execution_Policies](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_execution_policies?view=powershell-6)
    (Microsoft)


    # Preparing for Administration using PowerShell


    In this chapter, we cover the following topics:


    1. Installing Visual Studio Code

    2. Configuring automatic variables

    3. Changing the shell behaviour using a variable

    4. Enabling automated execution of commands for each load

    5. Customising the terminal prompt

    6. Understanding standard redirection in PowerShell

    7. Calling native Linux commands from PowerShell

    8. Understanding cmdlets and parameters

    9. Running cmdlets with minimal keystrokes

    10. Finding parameter aliases

    11. Calling a PowerShell script

    12. Dot-sourcing a PowerShell script

    13. Calling a PowerShell cmdlet from outside of PowerShell

    14. Recording the cmdlets run on the PowerShell console


    # Introduction


    It is common notion that the more you use the terminal (as opposed to the GUI),
    the more efficient you are. Typing out commands is much easier and faster than
    clicking around the screen. However, to someone who has just begun using the terminal,
    it may not be so. Over time, as administrators grow more and more comfortable
    with the terminal, they learn to configure it for speed and efficiency, much like
    a trained horse. Further, most efficient administrators like automating several
    parts of their workflow—customising `.bashrc` and Vim scripts are examples of
    it. In this chapter, we will familiarise ourselves with the different consoles
    and tools that work with PowerShell, and will also look at a few simple recipes
    which would help customise our workspace, so that we can be more efficient.


    # Installing Visual Studio Code


    Scripting can happen on the console itself, with Vim. It is also possible to use
    other editors like Gedit or even Atom to write PowerShell scripts. It is, however,
    recommended to use Microsoft''s open source code editor, called, Visual Studio
    Code (or `vscode`). In this recipe, we would look at installing Visual Studio
    Code, and configuring it to work with PowerShell.


    # Getting Ready


    We would look at the steps to install `vscode` on Ubuntu. Today, most repositories
    contain Visual Studio Code. You may check in the software store of your distribution
    to install `vscode`. If not, the easiest way to install `vscode` is to download
    the `.deb` (or the `.rpm` package based on your distro), and run it to install
    the package on your computer.


    # How to do it...


    Installing Visual Studio Code is simple.


    1. If your Linux distribution has a software store, search the store for Visual
    Studio Code.

    2. If you find Visual Studio Code, install the package from there. If not, proceed
    with the next step.

    3. The package name for Visual Studio Code is `code`. Use your package manager
    to search for the package in the repository. On Ubuntu, the command would be:


    ```

    $ sudo apt-cache pkgnames code

    ```


    4. If you''re able to find the package in your repository, install vscode like
    you would any other package.


    ```

    $ sudo apt install code

    ```


    5. If you were unable to find the package, go to [https://code.visualstudio.com/Download](https://code.visualstudio.com/Download)
    and download the right `code` package for your distro.

    6. To install VS Code, call your package manager with the path to the downloaded
    package.


    ```

    $ sudo apt install install code_version_arch.deb

    ```


    7. If you would rather install VS Code in portable mode, download the VS Code
    tarball and extract its contents to a convenient location to run VS Code. Although,
    remember that updates to VS Code would be handled by VS Code itself, in this case.


    Visual Studio Code is a powerful code editor in itself. However, it may not fully
    support PowerShell right out of the box. You would need to install the extension
    that packs capabilities which help run write and run PowerShell scripts.


    1. Launch Visual Studio Code.

    2. Click on the Extensions icon or press `Ctrl+Shift+X` to go to the Extensions
    pane.

    3. In the search bar, enter `powershell publisher:Microsoft` and hit Enter to
    search for the PowerShell package.

    4. Click on Install in the resulting package–the PowerShell package should be
    on top.

    5. Once the installation completes, click on Reload to reload Visual Studio Code
    with PowerShell capabilities.


    You are now ready to develop PowerShell scripts using a friendly editor that supports
    almost all of the capabilities that Windows PowerShell Integrated Scripting Environment
    has, and more!


    # How it works...

