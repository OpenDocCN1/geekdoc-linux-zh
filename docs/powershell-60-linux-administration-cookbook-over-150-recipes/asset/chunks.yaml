  trans: "\n\n这将列出输出中包含的一系列成员。目前我们主要关注最第一行。\n\n```\nPS> Get-Item '/home/ram' | Get-Member\n\
    \n   TypeName: System.IO.DirectoryInfo\n\nName                      MemberType\
    \     Definition\n----                      ----------     ----------\nLinkType\
    \                  CodeProperty   System.String LinkType{get=GetLinkType;}\nMode\
    \                      CodeProperty   System.String Mode{get=Mode;}\n.\n.\n.\n\
    ```\n\n注意输出的第一行，`TypeName: System.IO.DirectoryInfo`。这正是我们在创建 .NET 对象时使用的完全相同的类型名称。\n\
    \n![](img/c1e7e64f-6993-4c88-9e96-ee87651fba00.png)\n\n这证明了显示当前工作目录信息的相同任务既可以通过调用\
    \ .NET 构造函数实现，也可以通过运行 PowerShell cmdlet 实现。因此，我们推断出 PowerShell cmdlet 仅仅是封装好的\
    \ .NET 代码，通过简化处理使管理员能够操作计算机，而无需担心底层的 .NET 代码。\n\n从本质上说，`Get-Item` 在底层调用了 `System.IO.DirectoryInfo`\
    \ 类，并连同 cmdlet 一起传递参数。\n\n`Get-Item` 可以用于文件系统中的任何位置。只要你有权限访问该位置，PowerShell 就会返回关于你作为参数传递的位置的信息。\n\
    \n正如俗话所说：\n\n如果 C# 的哥们能做到，你也可以。\n\n# 还有更多内容...\n\n阅读 `Get-Item | Get-Member` 命令的输出，以了解关于你指定的目录的更多信息。此外，在我们熟练使用\
    \ `Select-Object` cmdlet 后，我们应该能够从返回的对象中调用特定的字段。\n\n# 另另\n\n1. .NET 类，[System.IO.DirectoryInfo](https://msdn.microsoft.com/en-us/library/system.io.directoryinfo(v=vs.110).aspx)\
    \ (微软开发者网络)\n\n# 将输出拆分为不同的对象\n\n在上一节中，我们看到对象可以有属性也可以有方法。这些属性和方法被称为成员。在面向对象的编程方法（以及扩展到使用\
    \ PowerShell 进行管理）中，可以使用`成员访问运算符`（即单个点 `.`）来引用对象的属性和方法。\n\n# 准备工作\n\n理想情况下，此配方应该是上一个扩展。如果你没有运行之前的命令，建议你运行它们，然后继续执行下面的步骤。\n\
    \n# 如何操作...\n\n1. 查看来自上一个配方中以下命令的输出：\n\n```\nPS> Get-Item '/home/ram' | Get-Member\n\
    ```\n\n输出表格包含成员的名称、类型和定义。查看 `MemberType` 列；你会看到 `Method` 以及不同类型的属性，如 `CodeProperty`\
    \ 和 `Property`。\n\n2. 假设我们想查看我的主目录最后一次被写入的时间。我们将使用成员访问运算符引用此属性。要做到这一点，只需将 `Get-Item`\
    \ 命令及其参数括在括号中，并使用点操作符引用该属性。\n\n```\nPS> (Get-Item /home/ram).LastWriteTime\n\n\
    Wednesday, 18 May 2018 11:01:02\n```\n\n3. 接下来，让我们选择对象的 `Parent` 属性。这将为我们提供主目录所在的目录的详细信息。\n\
    \n```\nPS> (Get-Item /home/ram).Parent\n\nMode                LastWriteTime  \
    \       Length Name\n----                -------------         ------ ----\nd-r---\
    \       03/05/2018     17:07                home\n```\n\n此输出本身就是一个对象，这意味着我们可以获取此返回对象的最后写入时间和和其他详细信息，就像我们对\
    \ `/home/ram` 执行的那样。我们如何查看父文件夹（`/home`）是什么时候的？\n\n4. 首先，让我们在该对象上使用 `Get-Member`\
    \ cmdlet，查看返回对象的 `TypeName`。\n\n```\nPS> (Get-Item /home/ram).Parent | Get-Member\n\
    \n   TypeName: System.IO.DirectoryInfo\n```\n\n这与 `Get-Item` 本身相同。因此，`Get-Item\
    \ /home/ram` 的任何成员也适用于 `(Get-Item /home/ram).Parent`。\n\n5. 现在调用父对象上的 `CreationTime`\
    \ 属性。只需在 `Parent` 后面加上点，并调用 `CreationTime` 属性。\n\n```\nPS> (Get-Item /home/ram).Parent.CreationTime\n\
    \nThursday, 3 May 2018 17:07:38\n```\n\n`CreationTime` 属性本身也是一个类型为 `DateTime`\
    \ 的对象。因此，你可以对该对象执行日期和时间操作。\n\nPowerShell 在大多数情况下是不区分大小写的。然而，建议我们遵循约定以尽量减少错误。特别是因为在\
    \ Linux 中大小写敏感是一种约定。属性可能是不同的数据类型。可以在 `Definition` 列中看到数据类型。\n\n6.让我们查看 `CreationTime`\
    \ 对象的成员，看看是否可以进一步过滤输出。\n\n```\nPS> (Get-Item /home/ram).Parent.CreationTime |\
    \ Get-Member\n\n   TypeName: System.DateTime\n```\n\n7. 让我们只从该对象中选择年份属性。\n\n```\n\
    PS> (Get-Item /home/ram).Parent.CreationTime.Year\n2018\n```\n\n到此结束从返回对象内部选取属性的操作。接下来，让我们使用返回对象内部的方法，并在\
    \ `/home/ram` 下创建一个子目录。\n\n1. 首先，列出该目录下的现有目录。这是使用 cmdlet `Get-ChildItem` 完成的。\n\
    \n```\nPS> Get-ChildItem /home/ram\n\n    Directory: /home/ram\n\nMode       \
    \         LastWriteTime         Length Name\n----                -------------\
    \         ------ ----\nd-----       06/04/2018     13:05                Desktop\n\
    d-----       18/05/2018     16:01                Documents\nd-----       18/05/2018\
    \     16:01                Downloads\nd-----       06/04/2018     13:05      \
    \          Music\nd-----       19/05/2018     11:07                Pictures\n\
    d-----       06/04/2018     13:05                Public\nd-----       06/04/2018\
    \     13:05                Templates\nd-----       10/04/2018     03:41      \
    \          Videos\n```\n\n`Get-Item` 为提供关于目录本身的详细信息。从本质上说，此 cmdlet 处理的是当前项目。因此，你拥有与该意图一致的属性和方法。子项目（Child\
    \ items）是指该项目*内部*的文件和目录。\n\n2. 这是用户配置文件中的标准目录列表。现在让我们使用 `Get-Item` 中的方法在这个配置文件文件夹内创建一个子目录。\n\
    \n```\nPS> (Get-Item /home/ram).CreateSubdirectory('test-directory')\n```\n\n\
    要知道某个方法接受什么参数，请查看 `Get-Member` 输出的 `Definition` 列。对于 `CreateSubdirectory`，定义为\
    \ `System.IO.DirectoryInfo CreateSubdirectory(string path)`。\n\n你现在应该会得到确认。\n\n\
    ![](img/d560bd8-b8e8-471a-8413-8002dc6776.png)\n\n3. 极极了。现在，列出主目录下的目录。\n\n```\n\
    PS> Get-ChildItem /home/ram\n\n    Directory: /home/ram\n\nMode              \
    \  LastWriteTime         Length Name\n----                -------------      \
    \   ------ ----\nd-----       06/04/2018     13:05                Desktop\nd-----\
    \       18/05/2018     16:01                Documents\nd-----       18/05/2018\
    \     16:01                Downloads\nd-----       06/04/2018     13:05      \
    \          Music\nd-----       19/05/2018     11:07                Pictures\n\
    d-----       06/04/2018     13:05                Public\nd-----       06/04/2018\
    \     13:05                Templates\nd-----       19/05/2018     13:31      \
    \          test-directory\nd-----       10/04/2018     03:41                Videos\n\
    ```\n\n我们现在可以看到使用 `CreateSubdirectory` 方法创建的新目录。\n\n正如你可能注意到的，运行 `Get-ChildItem`\
    \ 与运行 `Get-Item` 返回对象的 `GetDirectories` 和 `GetFiles` 方法相似。这是 .NET Core 中封装的另一个例子。\n\
    \n"
- fmt: "\nUsing the properties and methods within a returned object is simple. Objects\
    \ from within the output returned by a cmdlet can be called using the member access\
    \ operator directly on the command (cmdlet including the parameter).\n\nCalling\
    \ properties after the member access operator fetches the data that's held within\
    \ the property. In our case, it was the `LastWriteTime`.\n\nMethods are functions.\
    \ They may or may not require an argument. The `CreateSubdirectory` method requires\
    \ a string argument, which is the name (or path) of the sub-directory we wish\
    \ to create—whatever we enter in the parenthesis essentially forms the path we\
    \ wish to create. In case of methods that can run without an argument, they need\
    \ to be called with empty parenthesis following the name of the method, like `ToString()`,\
    \ for example.\n\nWhen we pass the string argument into `CreateSubdirectory`,\
    \ the method runs a .NET Core routine and creates a sub-directory within the directory\
    \ we specify with `Get-Item`. The internal workings of the .NET Core is beyond\
    \ the scope of this book.\n\n# See also\n\n1. Recipe: Selecting objects via the\
    \ pipeline\n\n# Parsing input from text to object\n\nMoving to the object model\
    \ from text could seem a little daunting at first. However, with PowerShell, it\
    \ is not very hard to switch to the new model, especially given that PowerShell\
    \ can convert text into objects given the right tools. In this recipe, we would\
    \ look at two of the ways that PowerShell converts textual data into objects.\n\
    \n# Getting Ready\n\nBefore we dive into the recipe, let us give ourselves a little\
    \ introduction on how text-to-object parsing is handled. One way is to use .NET's\
    \ built-in functionality, and the second one that we discuss involves using a\
    \ cmdlet to perform the conversion based on a delimiter.\n\nThe basic requirement\
    \ for this recipe is simple: you simply need PowerShell installed on your computer.\
    \ We will edit the file within PowerShell. If you would be comfortable using a\
    \ text editor instead, that works as well. Most Linux distributions pack a text\
    \ editor. If not, use your package manager to install `Vim`, `Nano`, `Gedit`,\
    \ `Visual Studio Code`, `Atom` or any other text/code editor.\n\n# How to do it...\n\
    \nWe shall first look at converting text into an object from plain text input\
    \ at the terminal. This involves using what is known as a `PowerShell Type Accelerator`.\
    \ A PowerShell Type Accelerator is a an alias for .NET classes. Using these, we\
    \ can call .NET classes and use many of their functionalities within PowerShell.\n\
    \n1. Let us take plain text as input and convert the text into a date object.\
    \ To check what sort of object your input is, use the `Get-Member` cmdlet.\n\n\
    ```\nPS> '21 June 2018' | Get-Member\n```\n\nEnclosing any text within single\
    \ quotes defines the text as a `non-expanding literal string`. No explicit definition\
    \ is required in this case, in PowerShell.\n\n2. The `TypeName` says, `System.String`.\
    \ This confirms that what we entered was plain text. Let us now use a Type Accelerator\
    \ and convert this text into a `DateTime` object. The accelerator for this purpose\
    \ is `[DateTime]`; place this accelerator before the literal string.\n\n```\n\
    PS> [DateTime]'21 June 2018'\n\nThursday, 21 June 2018 00:00:00\n```\n\n3. Next,\
    \ find the `TypeName` of the object that was returned.\n\n```\nPS> [DateTime]'21\
    \ June 2018' | Get-Member\n\n   TypeName: System.DateTime\n```\n\nVoila, the string\
    \ has been successfully parsed into date and time!\n\n4. It is also possible to\
    \ achieve the same result with the cmdlet, `Get-Date`, when it is called with\
    \ the text argument.\n\n```\nPS> Get-Date '21 June 2018'\n\nThursday, 21 June\
    \ 2018 00:00:00\n```\n\n5. Similarly, the `TypeName` would be:\n\n```\nPS> Get-Date\
    \ '21 June 2018' | Get-Member\n\n   TypeName: System.DateTime\n```\n\n6. Just\
    \ like we did in the previous recipe, we can now manipulate the object to show\
    \ information in a more meaningful way. For instance, if you care only about the\
    \ year, you would write:\n\n```\nPS> (Get-Date '21 June 2018').Year\n2018\n```\n\
    \nThe other way of converting text into an object is to use cmdlets that perform\
    \ such tasks. PowerShell packs a few converter cmdlets, one of which is `Import-Csv`.\
    \ You may have noticed that PowerShell usually sends out output in a tabular format.\
    \ This is a simple representation of objects. And `Import-Csv` converts data in\
    \ delimited row-and-column structure into objects, where each row is an instance\
    \ of the object itself, and each column is a property of the object.\n\n1. To\
    \ demonstrate this, let us create a CSV file with the following content in it.\
    \ At the PowerShell prompt, type:\n\n```\nPS> @'\n```\n\n2. This would take you\
    \ to the next line; PowerShell is expecting input. Paste the following sample\
    \ content at the prompt.\n\n```\nWS,CPU,Id,SI,ProcessName\n161226752,23.42,1914,1566,io.elementary.a\n\
    199598080,77.84,1050,1040,gnome-shell\n216113152,0.67,19250,1566,atom\n474685440,619.05,1568,1566,Xorg\n\
    1387864064,1890.29,15720,1566,firefox\n```\n\n3. Go to the next line and enter\
    \ the following at the `>>` prompt:\n\n```\n'@ | Out-File sample.csv\n```\n\n\
    You could perform the same operation using the `touch` command and the text editor\
    \ of your choice. The goal is to get the content into the sample file.\n\n4. Next,\
    \ read the contents of the file using PowerShell.\n\n```\nPS> Get-Content ./sample.csv\n\
    WS,CPU,Id,SI,ProcessName\n161226752,23.42,1914,1566,io.elementary.a\n199598080,77.84,1050,1040,gnome-shell\n\
    216113152,0.67,19250,1566,atom\n474685440,619.05,1568,1566,Xorg\n1387864064,1890.29,15720,1566,firefox\n\
    ```\n\n5. That looks like simple text. Let us look at the type name of the object\
    \ to confirm that this is indeed plain text. Type in:\n\n```\nPS> Get-Content\
    \ ./sample.csv | Get-Member\n\n   TypeName: System.String\n```\n\n6. That is plain\
    \ and simple string. Let us now convert the content into a simple object. This\
    \ is done using `Import-Csv`.\n\n```\nImport-Csv ./sample.csv\n```\n\nThat should\
    \ give you a list-like output.\n\n![](Images/421790f7-a304-47d2-8a53-8d8b24057760.png)\n\
    \n7. To confirm the output is objects, list out its members.\n\n![](Images/2ce2642a-5e63-4f99-85ca-3dcba5ee4bcb.png)\n\
    \nIn general, the content is a custom object, as denoted by `PSCustomObject`.\
    \ The columns we had in the CSV are of type `NoteProperty`, as shown by `MemberType`.\n\
    \nA `NoteProperty` is a generic property, whose characteristics are similar to\
    \ string. While most properties are inherited from .NET, `NoteProperty` is custom-created\
    \ within PowerShell, as a name-value pair.\n\n8. If you would rather look at the\
    \ content as a table, format the content as a table.\n\n```\nPS> Import-Csv ./sample.csv\
    \ | Format-Table\n```\n\n![](Images/653c86b0-0db0-4230-9e4d-86c4a23a5109.png)\n\
    \nThat brings us to the end of this recipe. We have successfully converted text\
    \ into an object. However, note that this is just a simple conversion, and that\
    \ the output of `Import-Csv` is still string-like. Although, all of the content\
    \ is objects, which are easier to handle.\n\n# How it works...\n\nType Accelerators\
    \ are another form of encapsulation of .NET code in PowerShell. Remember the first\
    \ recipe in this chapter wherein we created a .NET object within PowerShell. We\
    \ used the PowerShell command, `New-Object -TypeName System.IO.DirectoryInfo -ArgumentList\
    \ '/home/ram'` to get information on a home directory: we created a new instance\
    \ of `System.IO.DirectoryInfo`, and passed an argument to it. That was a lot of\
    \ code to write. To accelerate the process, we could use, `[IO.DirectoryInfo]'/home/ram'`,\
    \ (`System` is the default namespace; PowerShell would understand it without us\
    \ explicitly mentioning it when calling accelerators) which outputs the same object\
    \ as the former command.\n"
  raw: "Using the properties and methods within a returned object is simple. Objects\
    \ from within the output returned by a cmdlet can be called using the member access\
    \ operator directly on the command (cmdlet including the parameter).\n\nCalling\
    \ properties after the member access operator fetches the data that's held within\
    \ the property. In our case, it was the `LastWriteTime`.\n\nMethods are functions.\
    \ They may or may not require an argument. The `CreateSubdirectory` method requires\
    \ a string argument, which is the name (or path) of the sub-directory we wish\
    \ to create—whatever we enter in the parenthesis essentially forms the path we\
    \ wish to create. In case of methods that can run without an argument, they need\
    \ to be called with empty parenthesis following the name of the method, like `ToString()`,\
    \ for example.\n\nWhen we pass the string argument into `CreateSubdirectory`,\
    \ the method runs a .NET Core routine and creates a sub-directory within the directory\
    \ we specify with `Get-Item`. The internal workings of the .NET Core is beyond\
    \ the scope of this book.\n\n# See also\n\n1.  Recipe: Selecting objects via the\
    \ pipeline\n\n# Parsing input from text to object\n\nMoving to the object model\
    \ from text could seem a little daunting at first. However, with PowerShell, it\
    \ is not very hard to switch to the new model, especially given that PowerShell\
    \ can convert text into objects given the right tools. In this recipe, we would\
    \ look at two of the ways that PowerShell converts textual data into objects.\n\
    \n# Getting Ready\n\nBefore we dive into the recipe, let us give ourselves a little\
    \ introduction on how text-to-object parsing is handled. One way is to use .NET's\
    \ built-in functionality, and the second one that we discuss involves using a\
    \ cmdlet to perform the conversion based on a delimiter.\n\nThe basic requirement\
    \ for this recipe is simple: you simply need PowerShell installed on your computer.\
    \ We will edit the file within PowerShell. If you would be comfortable using a\
    \ text editor instead, that works as well. Most Linux distributions pack a text\
    \ editor. If not, use your package manager to install Vim, Nano, Gedit, Visual\
    \ Studio Code, Atom or any other text/code editor.\n\n# How to do it...\n\nWe\
    \ shall first look at converting text into an object from plain text input at\
    \ the terminal. This involves using what is known as a **PowerShell Type Accelerator**.\
    \ A PowerShell Type Accelerator is a an alias for .NET classes. Using these, we\
    \ can call .NET classes and use many of their functionalities within PowerShell.\n\
    \n1.  Let us take plain text as input and convert the text into a date object.\
    \ To check what sort of object your input is, use the `Get-Member` cmdlet.\n\n\
    ```\nPS> '21 June 2018' | Get-Member\n```\n\nEnclosing any text within single\
    \ quotes defines the text as a **non-expanding literal string**. No explicit definition\
    \ is required in this case, in PowerShell.\n\n2.  The `TypeName` says, `System.String`.\
    \ This confirms that what we entered was plain text. Let us now use a Type Accelerator\
    \ and convert this text into a `DateTime` object. The accelerator for this purpose\
    \ is `[DateTime]`; place this accelerator before the literal string.\n\n```\n\
    PS> [DateTime]'21 June 2018'\n\nThursday, 21 June 2018 00:00:00\n```\n\n3.  Next,\
    \ find the `TypeName` of the object that was returned.\n\n```\nPS> [DateTime]'21\
    \ June 2018' | Get-Member\n\n   TypeName: System.DateTime\n```\n\nVoila, the string\
    \ has been successfully parsed into date and time!\n\n4.  It is also possible\
    \ to achieve the same result with the cmdlet, `Get-Date`, when it is called with\
    \ the text argument.\n\n```\nPS> Get-Date '21 June 2018'\n\nThursday, 21 June\
    \ 2018 00:00:00\n```\n\n5.  Similarly, the `TypeName` would be:\n\n```\nPS> Get-Date\
    \ '21 June 2018' | Get-Member\n\n   TypeName: System.DateTime\n```\n\n6.  Just\
    \ like we did in the previous recipe, we can now manipulate the object to show\
    \ information in a more meaningful way. For instance, if you care only about the\
    \ year, you would write:\n\n```\nPS> (Get-Date '21 June 2018').Year\n2018\n```\n\
    \nThe other way of converting text into an object is to use cmdlets that perform\
    \ such tasks. PowerShell packs a few converter cmdlets, one of which is `Import-Csv`.\
    \ You may have noticed that PowerShell usually sends out output in a tabular format.\
    \ This is a simple representation of objects. And `Import-Csv` converts data in\
    \ delimited row-and-column structure into objects, where each row is an instance\
    \ of the object itself, and each column is a property of the object.\n\n1.  To\
    \ demonstrate this, let us create a CSV file with the following content in it.\
    \ At the PowerShell prompt, type:\n\n```\nPS> @'\n```\n\n2.  This would take you\
    \ to the next line; PowerShell is expecting input. Paste the following sample\
    \ content at the prompt.\n\n```\nWS,CPU,Id,SI,ProcessName\n161226752,23.42,1914,1566,io.elementary.a\n\
    199598080,77.84,1050,1040,gnome-shell\n216113152,0.67,19250,1566,atom\n474685440,619.05,1568,1566,Xorg\n\
    1387864064,1890.29,15720,1566,firefox\n```\n\n3.  Go to the next line and enter\
    \ the following at the `>>` prompt:\n\n```\n'@ | Out-File sample.csv\n```\n\n\
    You could perform the same operation using the `touch` command and the text editor\
    \ of your choice. The goal is to get the content into the sample file.\n\n4. \
    \ Next, read the contents of the file using PowerShell.\n\n```\nPS> Get-Content\
    \ ./sample.csv\nWS,CPU,Id,SI,ProcessName\n161226752,23.42,1914,1566,io.elementary.a\n\
    199598080,77.84,1050,1040,gnome-shell\n216113152,0.67,19250,1566,atom\n474685440,619.05,1568,1566,Xorg\n\
    1387864064,1890.29,15720,1566,firefox\n```\n\n5.  That looks like simple text.\
    \ Let us look at the type name of the object to confirm that this is indeed plain\
    \ text. Type in:\n\n```\nPS> Get-Content ./sample.csv | Get-Member\n\n   TypeName:\
    \ System.String\n```\n\n6.  That is plain and simple string. Let us now convert\
    \ the content into a simple object. This is done using `Import-Csv`.\n\n```\n\
    Import-Csv ./sample.csv\n```\n\nThat should give you a list-like output.\n\n![](Images/421790f7-a304-47d2-8a53-8d8b24057760.png)\n\
    \n7.  To confirm the output is objects, list out its members.\n\n![](Images/2ce2642a-5e63-4f99-85ca-3dcba5ee4bcb.png)\n\
    \nIn general, the content is a custom object, as denoted by `PSCustomObject`.\
    \ The columns we had in the CSV are of type `NoteProperty`, as shown by `MemberType`.\n\
    \nA `NoteProperty` is a generic property, whose characteristics are similar to\
    \ string. While most properties are inherited from .NET, `NoteProperty` is custom-created\
    \ within PowerShell, as a name-value pair.\n\n8.  If you would rather look at\
    \ the content as a table, format the content as a table.\n\n```\nPS> Import-Csv\
    \ ./sample.csv | Format-Table\n```\n\n![](Images/653c86b0-0db0-4230-9e4d-86c4a23a5109.png)\n\
    \nThat brings us to the end of this recipe. We have successfully converted text\
    \ into an object. However, note that this is just a simple conversion, and that\
    \ the output of `Import-Csv` is still string-like. Although, all of the content\
    \ is now objects, which are easier to handle in PowerShell.\n\n# How it works...\n\
    \nType Accelerators are another form of encapsulation of .NET code in PowerShell.\
    \ Remember the first recipe in this chapter wherein we created a .NET object within\
    \ PowerShell. We used the PowerShell command, `New-Object -TypeName System.IO.DirectoryInfo\
    \ -ArgumentList '/home/ram'` to get information on a home directory: we created\
    \ a new instance of `System.IO.DirectoryInfo`, and passed an argument to it. That\
    \ was a lot of code to write. To accelerate the process, we could use, `[IO.DirectoryInfo]'/home/ram'`,\
    \ (`System` is the default namespace; PowerShell would understand it without us\
    \ explicitly mentioning it when calling accelerators) which outputs the same object\
    \ as the former command."
