  raw: 'Go to a directory that has some files that we can play with. If you do not
    have such a directory, create one and create some files in there. Let the files
    be of different extensions, so that we can use them in the future recipes as well.


    If you have not already, clone the git repository, [https://github.com/PacktPublishing/PowerShell-6.0-Linux-Administration-Cookbook](https://github.com/PacktPublishing/PowerShell-6.0-Linux-Administration-Cookbook).
    There is a quick-and-dirty script, `Initialize-PacktPs6CoreLinuxLab.ps1` under
    the directory, `chapter-05`. Run the script to get the necessary files.


    # How to do it...


    The `awk` command works with text, and based on the delimiters in the output text,
    separates the output into columns. This separated output is displayed as columns
    again, using a the `print` function, like in C. PowerShell works a little differently.


    Let us get started.


    1.  If you did not create files, please do so. Here are some commands you could
    use to create the files.


    ```

    PS> New-Item ./random/cities -ItemType Directory -Force

    PS> Set-Location ./random/

    PS> New-Item random-text.txt, himalayas.jpg, crunched-numbers.csv, bangalore.jpg,
    screenshot-001.png, screenshot-002.png, screenshot-003.png, demo.doc, my-plugin.rb,
    ./cities/mumbai.html, ./cities/nyc.html, ./cities/cairo.html, ./cities/dubai.html,
    ./cities/paris.html -ItemType File

    ```


    2.  You may also want to download some real multimedia content, just so we get
    the `length` (file size) property for future use. Just download any random images
    or media files.


    3.  Navigate to the location where you saved the files. I have them in a directory
    called `random` in my home directory. You would, too, if you used the script.


    ```

    PS> Set-Location ./random/

    ```


    Use tab-completion to complete the cmdlet as well as the path.


    4.  List out the contents in the current location.


    ```

    PS> Get-ChildItem -Path .

    ```


    ![](Images/fc1b8222-bc35-4723-bc80-b3c548ec789f.png)


    5.  Let us say, you do not require the `Mode` column.


    ```

    PS> Get-ChildItem -Path . | Select-Object LastWriteTime, Length, Name

    ```


    ![](Images/66a9b353-b59f-4822-9b84-ea92bae58933.png)If you notice, select does
    not seem to follow the naming or capitalisation convention that PowerShell uses.
    How is that? Run `Get-Command select` to find out.


    6.  This sequence does not really make sense to you in the current context. Shuffle
    the columns.


    ```

    PS> Get-ChildItem -Path . | Select-Object Name, Length, LastWriteTime

    ```


    ![](Images/3f839c8d-22b8-45c0-bbf9-913af8c94295.png)


    That looks much better.


    7.  Now, change the column name of `LastWriteTime` to `Modified`.


    ```

    PS> Get-ChildItem -Path . | Select-Object Name, Length, @{Name=''Modified''; Expression={$_.LastWriteTime}}

    ```


    Notice the name of the last column now, and compare it with the previous output.


    8.  Now, pick just the year; not the entire date.


    ```

    PS> Get-ChildItem -Path . | Select-Object Name, Length, @{Name=''Modified''; Expression={$_.LastWriteTime.Year}}

    ```


    9.  See how many days have passed since the last change.


    ```

    PS> Get-ChildItem -Path . | select Name, Length, @{Name=''DaysSinceModification'';
    Expression={[math]::Round(((Get-Date) - $_.LastWriteTime).TotalDays)}}

    ```


    # How it works...


    If you ran `Get-Command select`, you would have understood by now, that `select`
    is in fact an alias for `Select-Object`. As already established, PowerShell outputs
    objects. These objects are then formatted using built-in formatting rules to show
    on the screen a certain way.


    When we use the `Select-Object`, we override the formatting rules by specifying
    which objects need to be shown to us. While the primary objective of `Select-Object`
    is to pick the columns we need, the cmdlet also allows us to sequence the output
    columns.


    PowerShell also gives us the freedom to modify the name of the columns returned.
    In such a case, we use a *hashtable* to specify the name that we want, and what
    data we want shown under the column. You can even perform calculations on the
    data returned, and make this a calculated property. At the last step, we subtract
    the date of last modification from the current date, pick the total number of
    days that have passed since, and then, use the `Round` method of the `[math]`
    accelerator to get a rounded figure of the number of days since the last modification.


    The concept of `$_` or `$PSItem`.


    # There''s more...


    Try `Select-Object` with other cmdlets such as `Get-Command`, to select only those
    columns that you need.


    # See also


    Recipe : Creating and initialising a simple hash table.


    # Limiting the number of output objects


    In the previous recipe, *Selecting columns from the output*, we saw how the `Select-Object`
    cmdlet can be used to select only the columns we want. In this recipe, we will
    learn to limit the output of a cmdlet to a subset of the total items returned.


    # Getting ready


    Ensure that you are at a location that has a few files. List out the contents
    of the current directory and count the number of items returned. If the number
    is less than five, you may want to consider adding more items to the directory.


    1.  Enter the following command to count the number of files and directories at
    the current path.


    ```

    PS> (Get-ChildItem -Path .).Count

    ```


    2.  If you would like to reduce keystrokes, given that we are only running commands
    at the terminal, you could use the alias and the defaults of the cmdlet.


    ```

    PS> (gci).Count

    ```


    Those parentheses are required; the parentheses work almost similar to how they
    work in mathematics: the instruction within the parentheses is processed first.
    In this case, we want `gci` executed first, and then, the `Count` property from
    within the returned object picked.


    3.  Get the list of parameters `Select-Object` has.


    ```

    PS> Get-Help Select-Object

    ```


    We see parameters like, `First` and `Last`, and they accept integer values.


    # How to do it...


    Navigate to the directory where you have the files.


    1.  Select only the first five files and directories from the returned list, using
    the `First` parameter.


    ```

    PS> Get-ChildItem . | Select-Object -First 5

    ```


    2.  Let us say you would like to pick the last five elements.


    ```

    PS> Get-ChildItem . | Select-Object -Last 5

    ```


    3.  To skip the first three objects:


    ```

    PS> Get-ChildItem . | Select-Object -Skip 3

    ```


    4.  If you would like to skip the last two objects:


    ```

    PS> Get-ChildItem . | Select-Object -SkipLast 2

    ```


    5.  To pick the fourth element from the output:


    ```

    PS> Get-ChildItem . | Select-Object -Index 3

    ```


    6.  Now, combine it with what we learnt in the previous recipe. Pick only the
    file names and the last modified time of the first four elements.


    ```

    PS> Get-ChildItem . | select -Property Name, LastWriteTime -First 4

    ```


    # How it works...


    This is a simple recipe that helps you work with the number of items returned
    in the output. With `Select-Object` in PowerShell, we need not loop through output,
    while simultaneously counting, to only get the number of elements that we want.
    The `Select-Object` cmdlet has that functionality built in.


    The parameter names are self-explanatory. Except perhaps the `Index` parameter,
    which works exactly how numbering of array elements works with most programming
    languages: it starts with zero. Therefore, the fourth element in the array would
    have an index of `3`, and not `4`.


    The parameters, `Property` and `First` can be combined together since they both
    feature in the same parameter set in the help documentation for `Select-Object`.


    # Expanding the properties within properties


    So far from what we have seen, two things are clear to us:


    1.  An object output feels richer and makes using it easier.


    2.  An object can have more objects within it.


    We have handled the first point using the `Select-Object` cmdlet, wherein we picked
    only the objects properties that we needed, and omitted the rest. This recipe
    is designed to break down the second point for better understanding.'
