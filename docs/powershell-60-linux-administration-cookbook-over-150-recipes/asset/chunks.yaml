  trans: "\n\n习惯于 Windows PowerShell 中 PowerShell Workflows 的 Windows 管理员需要注意，这些功能在\
    \ PowerShell 中已经不存在了。PowerShell Workflows 稍微有些复杂（委婉地说），它们被用于特定的场景，例如并行运行多个 cmdlet，或者某些活动需要在重启后依然存在。Workflows\
    \ 运行在 Windows Workflow Foundation 之上，而该框架并不是跨平台的。因此，PowerShell Workflows 不会在 PowerShell\
    \ 上运行。不过，请理解，这没有任何损失。\n\n# PowerShell 期望状态配置 (Desired State Configuration)\n\n\
    在编写本章节时，期望状态配置（DSC）尚处于开发阶段。目前，DSC 资源有两个代码库：由微软 Unix 团队管理的用于 Linux 的 `LCM`，以及另一个——即由\
    \ PowerShell 团队编写的 `DSC Resources for Windows PowerShell`。DSC 代码库可能还需要一段时间才能实现跨平台。\n\
    \n# 列出别名并使用它们替代 cmdlets\n\n别名（Aliases）顾名思义，是 cmdlet 的替代名称。它们有两个作用：\n\n1. 减少击键次数\n\
    2. 使向 PowerShell 的过渡更加平滑\n\n传统上讲，在 PowerShell 中创建别名是为了让 Windows 和 Linux 管理员不会觉得这个新框架难以对付。尽管如此，别名最好只在命令行中使用，而不要在脚本中使用，因为某些别名在\
    \ Linux 中并不是别名，而且通常情况下，别名会影响可读性。（例如，需要费费精力才能意识到 `gbp` 代表 `Get-PSBreakPoint`。）\n\
    \n# 如何操作...\n\n既然已经看过了最佳实践，现在让我们来看如何列出系统中所有的别名。正如前面提到的，在 PowerShell 中思考非常简单。当我们知道获取任何信息的动词是\
    \ `Get`，而在这种情况下的名词是 `Alias` 时，那么 cmdlet 可能是 `Get-Alias`。\n\n1. 对 `Get-Alias` 快速运行\
    \ `Get-Command` 即可告诉我们是否存在这样一个 cmdlet。\n\n```\nGet-Command Get-Alias\n```\n\n\
    2. 现在让我们运行 `Get-Help` 来了解如何使用该 cmdlet。\n\n```\nGet-Help Get-Alias\n```\n\n如果你对任何命令不确定，或者想在不使用别名的情况下减少击键次数，可以使用制表补全（tab-completion）。输入\
    \ cmdlet 或参数的一部分，然后按 Tab 键。PowerShell 将为你完成命令，或者根据你所在的平台为你显示建议。\n\n3. 根据帮助文档，`Get-Alias`\
    \ 的所有参数都是可选的（它们都括在 `[]` 中）。因此，只需运行 `Get-Alias` 就会列出当前 PowerShell 实例中所有可用别名。\n\n\
    ![](img/1365c009-4f5b-4083-9ee8-257073c8a995.png)\n\n4. 现在尝试将别名 `gbp` 解析为它实际运行的\
    \ PowerShell cmdlet。\n\n```\nPS> Get-Alias gbp\n\nCommandType     Name       \
    \                                        Version    Source\n-----------     ----\
    \                                               -------    ------\nAlias     \
    \      gbp -> Get-PSBreakpoint\n```\n\n5. 现在让我们看看如何反过来：获取特定 cmdlet 的别名。如果你阅读该\
    \ cmdlet 的帮助文档，你会在第二个参数集中看到一个名为 `Definition` 的参数。这是在调用别名时实际运行的 PowerShell cmdlet。\n\
    \n```\nPS /home/ram> Get-Alias -Definition Get-ChildItem\n\nCommandType     Name\
    \                                               Version    Source\n-----------\
    \     ----                                               -------    ------\nAlias\
    \           dir -> Get-ChildItem                                          \nAlias\
    \           gci -> Get-ChildItem\n```\n\n6. 我们看到输出中有两个别名，它们在底层都运行 `Get-ChildItem`。现在让我们分别运行\
    \ `dir` 和 `Get-ChildItem` 并比较它们的输出。\n\n```\nPS /home/ram> dir\n\n    Directory:\
    \ /home/ram\n\nMode                LastWriteTime         Length Name\n----   \
    \             -------------         ------ ----\nd-----       06/04/2018     13:05\
    \                Desktop\nd-----       18/05/2018     16:01                Documents\n\
    d-----       18/05/2018     16:01                Downloads\nd-----       06/04/2018\
    \     13:05                Music\nd-----       20/05/2018     02:17          \
    \      Pictures\nd-----       06/04/2018     13:05                Public\nd-----\
    \       06/04/2018     13:05                Templates\nd-----       10/04/2018\
    \     03:41                Videos\nPS /home/ram> Get-ChildItem\n\n    Directory:\
    \ /home/ram\n\nMode                LastWriteTime         Length Name\n----   \
    \             -------------         ------ ----\nd-----       06/04/2018     13:05\
    \                Desktop\nd-----       18/05/2018     16:01                Documents\n\
    d-----       18/05/2018     16:01                Downloads\nd-----       06/04/2018\
    \     13:05                Music\nd-----       20/05/2018     02:20          \
    \      Pictures\nd-----       06/04/2018     13:05                Public\nd-----\
    \       06/04/2018     13:05                Templates\nd-----       10/04/2018\
    \     03:41                Videos\n```\n\n7. 这两个输出是完全相同的。现在让我们看看命令返回的是什么类型的对象。\n\
    \n```\nPS /home/ram> dir | Get-Member\n\n   TypeName: System.IO.DirectoryInfo\n\
    \nName                      MemberType     Definition\n----                  \
    \    ----------     ----------\nLinkType                  CodeProperty   System.String\
    \ LinkType{get=GetLinkType;}\nMode                      CodeProperty   System.String\
    \ Mode{get=Mode;}\n...\nPS /home/ram> Get-ChildItem | Get-Member\n\n   TypeName:\
    \ System.IO.DirectoryInfo\n\nName                      MemberType     Definition\n\
    ----                      ----------     ----------\nLinkType                \
    \  CodeProperty   System.String LinkType{get=GetLinkType;}\nMode             \
    \         CodeProperty   System.String Mode{get=Mode;}\n...\n```\n\n它们返回了相同的对象。\n\
    \n# 工作原理...\n\n别名只是 PowerShell 内部的映射。短词被映射到 PowerShell cmdlet，通过每个别名中的 `Definition`\
    \ 属性来标识。因此，你可以使用别名来替代完整的 cmdlet。别名也支持与 cmdlet 相同的参数，因为别名仅仅是右正确 cmdlet 的指针。\n\n\
    # 相关\n\n1. 最佳实践总结\n\n# 创建自定义别名\n\n正如我们在上一个示例中看到的，别名只是指向实际 PowerShell cmdlet 的指针，因此，创建自定义别名只需为你你想要创建的别名确定一个单词，并将其映射到你想要调用的\
    \ PowerShell cmdlet。\n\n# 如何操作...\n\n1. 首先，确定一个你想要作为别名的单词。例如，让我们考虑 `listdir`。\n\
    \n2. 在 PowerShell 中运行 `listdir`，以确保该 cmdlet（或 Linux 命令）已存在。\n\n3. 通过运行以下命令列出处理别名的\
    \ cmdlet：\n\n```\nGet-Command -Noun Alias\n```\n\n请记住，PowerShell 中的名词是单数形式。因此，不会有包含\
    \ `Aliases` 的原生 cmdlet。如果第三方模块在它们中提供了 `Aliases` 作为名词，那么它们没有遵循使用单数名词的 PowerShell\
    \ 最佳实践。\n\n4. `New-Alias` 是我们要寻找的 cmdlet，因为它会创建一个新的别名。（`Set-Alias` 用于修改已存在的别名。）\n\
    \n5. 通过运行以下命令读取 `New-Alias` 的帮助文档：\n\n```\nGet-Help New-Alias\n```\n\n帮助文档指出，`Name`\
    \ 和 `Value` 参数是强制性的。我们将只使用这两个参数来创建这个简单的别名。\n\n6. 运行以下命令创建自定义别名：\n\n```\nNew-Alias\
    \ listdir Get-ChildItem\n```\n\n7. 查看别名是否已按预期创建。\n\n```\nPS> Get-Alias listdir\n\
    \nCommandType     Name                                               Version \
    \   Source\n-----------     ----                                             \
    \  -------    ------\nAlias           listdir -> Get-ChildItem\n```\n\n"
- fmt: "\n8. Also, run the alias to see what output it gives.\n\n```\nPS /home/ram>\
    \ listdir\n\n    Directory: /home/ram\n\nMode                LastWriteTime   \
    \      Length Name\n----                -------------         ------ ----\nd-----\
    \          4/20/18   6:36 AM                Desktop\nd-----          5/10/18 \
    \  1:05 PM                Documents\nd-----          5/16/18  11:03 AM       \
    \         Downloads\nd-----          4/20/18   6:36 AM                Music\n\
    d-----           5/1/18   2:19 PM                Pictures\nd-----          4/20/18\
    \   6:36 AM                Public\nd-----          4/20/18   6:36 AM         \
    \       Templates\nd-----          4/20/18   6:36 AM                Videos\n```\n\
    \nThat is the output that we are familiar with–the output of `Get-ChildItem`.\n\
    \nAliases are ephemeral by default. They exist only as long as your PowerShell\
    \ session exists. To use custom aliases without having to recreate them each time,\
    \ export these aliases (the instructions for which are in the next recipe) and\
    \ import them using your PowerShell profile. We will understand profiles in a\
    \ later chapter.\n\n## How it works...\n\nAliases, as already mentioned, are pointers\
    \ to cmdlets. Using `New-Alias`, you create a pointer with a custom name, that\
    \ points to the desired PowerShell cmdlet. This is simply a Name–Value pair.\n\
    \nWhen you run anything on PowerShell, PowerShell checks its list of cmdlets and\
    \ aliases (among other definitions) to understand what you are asking for. When\
    \ PowerShell encounters an alias, it looks for which cmdlet it points to, and\
    \ runs the cmdlet.\n\n## There's more...\n\nYou can add more content to your aliases,\
    \ such as descriptions. Refer the help documentation for `Get-Alias` to see what\
    \ more you can do with aliases.\n\n## See also\n\n1. Recipe 3.8: Understanding\
    \ cmdlets and parameters\n\n2. Recipe 2.8: Importing/Exporting custom aliases\
    \ for future use\n\n3. Recipe 3.4: Enabling automated execution of commands for\
    \ each load\n\n# Export/Import Custom Aliases for Future Use\n\nAliases being\
    \ ephemeral, in spite of its advantages and the intended use of aliases, could\
    \ be seen as an inconvenience. In order that aliases can be reused, they need\
    \ to be exported to a file and later, imported when needed. This recipe will show\
    \ you how to export and import the aliases you may have created.\n\n## Getting\
    \ Ready\n\nYou need custom aliases already created for this process to be effective.\
    \ If you don't have custom aliases created, the export action would only export\
    \ the default aliases, which would be loaded with PowerShell anyway.\n\nGo to\
    \ the previous recipe to create at least one custom alias.\n\n## How to do it...\n\
    \n1. Ensure that your custom alias exists and runs properly. One way of doing\
    \ this is to get details about the alias you created.\n\n```\nGet-Alias listdir\n\
    ```\n\n2. Export all of the aliases loaded on your session to a file.\n\n```\n\
    Export-Alias aliases.csv\n```\n\nCSV is the default file type. The import that\
    \ we would see in the coming steps understands CSV and make the necessary associations.\n\
    \n3. It is also possible to export the aliases as a script. This way, PowerShell\
    \ will create a script that would contain the `New-Alias` cmdlet for each of the\
    \ aliases in the export.\n\n```\nExport-Alias aliases.ps1 -As Script\n```\n\n\
    4. Look at the contents of each of the files created; the CSV file first, and\
    \ then the script.\n\n```\nGet-Content ./aliases.csv\n```\n\n![](Images/56717d30-2937-4bac-89c4-634503efc8e8.png)\n\
    \n```\nGet-Content ./aliases.ps1\n```\n\n![](Images/bdf72b32-a228-470f-ac21-ad35d4e8013a.png)\n\
    \n5. Optionally, edit the file to remove all the aliases except the ones you created.\
    \ The custom aliases can be found at the bottom of the list.\n\nThis concludes\
    \ exporting aliases.\n\nLet us now import aliases into our PowerShell session.\n\
    \n1. Restart PowerShell.\n\n2. See if the alias, `listdir`, that you created exists.\n\
    \n```\nGet-Alias listdir\n```\n\n3. Now, import the aliases.\n\n```\nImport-Alias\
    \ ./aliases.csv\n```\n\nYou may receive several errors, each saying that the new\
    \ alias could not be created since the alias already existed. There are two ways\
    \ to handle this: the first is to remove the default aliases from the export file\
    \ (which is recommended), and the second is to use the `-Force` parameter (this\
    \ may still result in errors, but they would be significantly fewer).\n\nIf you\
    \ exported the aliases as a script, simply call the script.\n\n```\n./aliases.ps1\n\
    ```\n\n## How it works...\n\nThe script way is straight-forward: the cmdlets are\
    \ run one after the other and the aliases are created in the system just like\
    \ how you created them manually.\n\nWith the CSV import, PowerShell parses the\
    \ input into the Name–Value pairs (and add other parameters based on what you\
    \ exported) and add them to its alias reference for the current process.\n\n##\
    \ See also\n\n1. Recipe 3.4: Enabling automated execution of commands for each\
    \ load\n\n# Listing out the execution policies and setting a suitable one\n\n\
    There was a time when running scripts on Windows computers was a piece of cake.\
    \ Windows computers were highly prone to remote script executions. With PowerShell,\
    \ Microsoft added a safety belt that allowed the user some control over how PowerShell\
    \ loaded. It is important to remember that execution policies are not a security\
    \ feature. There are ways to circumvent this and still run scripts.\n\nPowerShell\
    \ on Windows and Windows PowerShell contain the configuration. Running scripts\
    \ on Windows is still restricted by default. On PowerShell on Linux, this doesn't\
    \ work, and based on the community, it is uncertain whether this feature would\
    \ make it to PowerShell on Linux.\n\nAn execution policy determines what type\
    \ of execution of scripts is allowed. Here are the six policies (excluding Default):\n\
    \n1. `AllSigned`\n2. `RemoteSigned`\n3. `Restricted`\n4. `Unrestricted`\n5. `Bypass`\n\
    6. `Undefined`\n\nThere are three scopes as well:\n\n1. `Process`\n2. `CurrentUser`\n\
    3. `LocalMachine`\n\nA combination of an execution policy and a scope are what\
    \ determine the condition which scripts can be loaded. Microsoft has documented\
    \ in detail what each of the policies is. In general, `AllSigned` requires that\
    \ all the scripts that run on the computer are signed using a code signing certificate\
    \ by a trusted certification authority. If this policy is set, PowerShell will\
    \ not run unsigned scripts even if you were the one to create them.\n\n`Restricted`\
    \ is the default policy: Commands can be run, but not scripts. `RemoteSigned`\
    \ allows scripts created on your own computer to run. Scripts that are downloaded\
    \ from the Internet cannot be run.\n\n`Bypass` is similar to unrestricted, however,\
    \ is used in specific scenarios such as when PowerShell forms the basis of a certain\
    \ application, and the application has its own security implementation.\n\n`Unrestricted`\
    \ means that all scripts and commands can run after a simple confirmation. `Undefined`\
    \ means that no policy has been defined for a particular scope. Let us try to\
    \ understand the concepts using the following recipe.\n"
  raw: "8.  Also, run the alias to see what output it gives.\n\n```\nPS /home/ram>\
    \ listdir\n\n    Directory: /home/ram\n\nMode                LastWriteTime   \
    \      Length Name\n----                -------------         ------ ----\nd-----\
    \          4/20/18   6:36 AM                Desktop\nd-----          5/10/18 \
