  trans: "\n显示的 XML 文件看起来可能有很多项目。使用 Visual Studio Code 中的缩进指南来引导你阅读该 XML。实际上，该文件非常易于阅读。阅读它将帮助你理解属性是如何定义的。\n\
    \n# 另参阅\n\n1. [Update-TypeData let](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.utility/update-typedata?view=powershell-6)\
    \ (Microsoft Docs)\n2. [Types.ps1xml 文件](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_types.ps1xml?view=powershell-6)\
    \ (Microsoft Docs)\n\n# 移除自定义类型数据\n\n现在我们已经知道如何创建和更新类型数据，下一步工作是学习如何移除类型数据。移除类型数据需要我们先获取该类型数据。在本食谱中，我们将学习移除类型数据的过程；无论它是使用\
    \ cmdlet 还是通过 XML 更新的。\n\n# 如何操作...\n\n第一步是理解 cmdlet 可以输出一种或多种类型的对象。例如，在我们的案例中，`Get-ChildItem`\
    \ 输出了 `System.IO.DirectoryInfo` 以及 `System.IO.FileInfo`。让我们学习处理这些对象。\n\n1. 获取\
    \ cmdlet 返回的对象的类型。\n\n```\nPS> Get-ChildItem | Get-Member | Select-Object TypeName\
    \ -Unique\n```\n\n2. 返回了两种类型。我们在第二种类型中创建了自定义成员。将其赋值给一个变量。\n\n```\nPS> $TypeData\
    \ = Get-ChildItem | Get-Member | Select-Object -ExpandProperty TypeName -Unique\
    \ -Last 1\n```\n\n3. 获取类型数据信息。展开其成员以查看自定义成员是否显示。\n\n```\nPS> Get-TypeData -TypeName\
    \ $TypeData | Select-Object -ExpandProperty Members\n```\n\n![](img/cebc3c44-9586-4735-8b2e-b76d90b35c56.png)\n\
    \n4. 现在，移除类型数据。\n\n```\nPS> Remove-TypeData -TypeName $TypeData\n```\n\n# 工作原理...\n\
    \n该过程非常直观。如果你查询 `Remove-TypeData` 的 `TypeName` 参数的帮助信息，你会注意到它接受通过属性值以及属性名通过管道输入的类型。回顾食谱“理解启用管道的参数”，查看\
    \ `Get-TypeData` 返回的对象以获得更深入的见解。\n\n`Remove-TypeData` cmdlet 从当前会话中移除类型数据。这种移除与类型添加一样是瞬时的。因此，默认类型和格式不会被\
    \ cmdlet 永久删除；这就是你可以在 PowerShell 中运行它而不需要管理员权限的原因。此外请记住，底层的 XML 文件也不会被删除：自定义自定义。\n\
    \n# 另参阅\n\n1. 食谱 5.8：理解启用管道的参数\n\n本章到此结束。是时候休息一下了，有助于你吸收所学。稍后，尝试不同的数据类型，创建变量，查看它们包含什么类型的对象，以及每个对象包含哪些成员。在本章中，除了环境变量外，我们没有显式地讨论变量，但我们几乎在每个食谱中都使用了变量。思考（或者最好是，实际尝试）以下问题：\n\
    \n1. 什么可以赋值给变量？\n2. 变量包含什么？整个对象吗？\n3. 如果变量包含整个对象，我可以引用该对象中的某个特定属性吗？\n4. 我可以将某个成员赋值给变量而不是整个对象吗？\n\
    5. 如果该成员本身是一个对象会怎样？（提示：在变量上使用 `Get-Member` 来查找。）\n6. 当我使用 `Select-Object` 配合 `-ExpandProperty`\
    \ 并值赋值给变量会发生什么？此时变量是什么类型？\n\n既然你已经频繁使用它们，这将帮助你更多地了解变量。\n\n# 使用分支和循环进行流程控制\n\n\
    在本章中，我们涵盖了以下主题：\n\n1. 使用 If–ElseIf–Else 条件控制脚本流\n2. 使用 Switch–Case 条件控制脚本流\n3.\
    \ 学习使用延迟\n4. 编写基础的循环结构\n5. 在预定义数组上编写更复杂的循环\n6. 使用 For 循环结构\n7. 使用 While 循环结构\n\
    8. 使用 Do–While 结构清理空目录\n9. 使用 Do–Until 结构清理空目录\n\n# 介绍\n\n与“处理字符串”一样，这种流程控制也是我非常喜欢的\
    \ PowerShell 部分。\n\n大多数 Linux 管理员和 Bash 脚本编写者已经熟悉这些食谱所涵盖的循环和分支等概念。我们看到的唯一主要区别是我们处理的是对象，并且是一种更具可读性的、更精简的脚本过程。\n\
    \n# 使用 If–ElseIf–Else 条件控制脚本流\n\n我们已经看到运算符是如何工作的。尝试更多的操作符，直到它们变成你的本能。脚本中的大部分流程控制以及过滤都是使用这些操作符实现的。\n\
    \n在本食谱中，我们将查看条件脚本流，也称为分支。本质上，分支基于两个条件（正确地说是：`$true` 和 `$false`）。这通常通过两种结构实现：\n\
    \n1. If–ElseIf–Else 结构\n2. Switch–Case 结构\n\n在本食谱中，我们将为自己设定一个简单的问题来解决：判断今天是否是周末。\n\
    \n# 准备工作\n\n这些食谱需要你亲自尝试，以理解它们是如何工作的。这些操作在集成脚本环境（首选 Visual Studio Code）中的效果比在提示符中更好。在\
    \ VS Code 中运行脚本，请使用 F5 键。此外，这些食谱在 Windows PowerShell 3.0+ 上也应该相同运行：这些结构在 PowerShell\
    \ 和 Windows PowerShell 中的语法是完全相同的。\n\n# 如何操作...\n\n在 Visual Studio Code 中打开一个新的\
    \ PowerShell 文件。\n\n1. 在代码面板中输入以下内容，简单的查找是否是周末。\n\n```\n$Date = Get-Date\n\nif\
    \ ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n    Write-Host 'We party on weekends!'\
    \ -BackgroundColor Yellow -ForegroundColor Black\n}\n```\n\n2. 如果你也想在工作日获得输出：\n\
    \n```\n$Date = Get-Date\nif ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n   \
    \ Write-Host 'It is a weekend!'\n}\nelse {\n    Write-Host 'It is a weekday.'\n\
    }\n```\n\n3. 如果你想增加一点趣味，并使用整个 `if`–`elseif`–`else`：\n\n```\n$Date = Get-Date\n\
    \nif ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n    Write-Host 'We party on\
    \ weekends!' -BackgroundColor Yellow -ForegroundColor Black\n}\nelseif ($Date.DayOfWeek\
    \ -eq 'Wednesday') {\n    Write-Host 'Half the week is over, and I want to do\
    \ so much more!'\n}\nelse {\n    Write-Host 'Work is worship. Ahem!'\n}\n```\n\
    \n通常情况下，`Write-Output` 是比 `Write-Host` 更好的 cmdlet。`Write-Host` 只将输出写入到宿主机；经过处理，此输出无法发送到任何其他地方。仅在需要的时候才使用\
    \ `Write-Host`。\n\n# 工作原理...\n\n简单的分支仅需 If 语句即可工作。该语句检查真值，并根据条件的结果执行代码块。在只有两种条件的“二选一”情况下，使用\
    \ If–Else。当有超过两个可能的结果时，使用 If–ElseIf–Else。`else` 块是兜底的。\n\n# 使用 Switch–Case 条件控制脚本流\n\
    \n当结果按类别出现时（例如工作日为五天，周末为两天），If–ElseIf–Else 很好用。当结果非常具体且/或数量过多时，使用 If–ElseIf–Else\
    \ 结构可能会有些繁琐。为了更好地理解这一点，让我们设定一个场景。\n"
- fmt: "\nThe dress code at your workplace is decided by a child, who likes everyone\
    \ wearing the colours of the rainbow. Since she doesn't like anyone working weekends,\
    \ is not a big fan of orange, and absolutely hates yellow, she has come up with\
    \ the following scheme (she does not yet know of \"Monday Blues\"): Red on Mondays,\
    \ Violet on Tuesdays, Indigo on Wednesdays, Blue on Thursdays, Green on Fridays\
    \ and Orange during the weekends.\n\n# How to do it...\n\nThis situation would\
    \ require a whole round of `If–ElseIf–Else` statements to program. A more efficient\
    \ way of handling the situation is to use the `Switch–Case` construct.\n\n1. Open\
    \ a new PowerShell file and add the following content to it:\n\n```\n$Date = Get-Date\n\
    \nswitch ($Date.DayOfWeek) {\n    'Monday' { Write-Output 'Red' }\n    'Tuesday'\
    \ { Write-Output 'Violet' }\n    'Wednesday' { Write-Output 'Indigo' }\n    'Thursday'\
    \ { Write-Output 'Blue' }\n    'Friday' { Write-Output 'Green' }\n    Default\
    \ { Write-Output 'Orange' }\n}\n```\n\n2. If you would rather omit `Default` and\
    \ use a wildcard matching for the weekends:\n\n```\n$Date = Get-Date\n\nswitch\
    \ -Wildcard ($Date.DayOfWeek) {\n    'Monday' { Write-Output 'Red' }\n    'Tuesday'\
    \ { Write-Output 'Violet' }\n    'Wednesday' { Write-Output 'Indigo' }\n    'Thursday'\
    \ { Write-Output 'Blue' }\n    'Friday' { Write-Output 'Green' }\n    'S*' { Write-Output\
    \ 'Orange' }\n}\n```\n\n# How it works...\n\nLike we can see, it is more efficient\
    \ to write, execute as well as troubleshoot a `Switch–Case` construct in such\
    \ situations, rather than writing a series of `if–elseif–elseif–elseif–...–else`\
    \ statements. To define a catch-all action in `Switch–Case`, use `Default`.\n\n\
    The `Switch–Case` construct also supports wildcard (`-Wildcard`) and regex (`-Regex`).\
    \ In general, it is not a good practice to omit `Default` unless all the possible\
    \ outcomes have been covered.\n\nThe working of `Switch–Case` is simple: it checks\
    \ the condition against all the values among the definitions, and whenever it\
    \ finds a condition to be true, it executes the corresponding script block. Therefore\
    \ if three conditions among five are met, the three script blocks will be executed.\
    \ This is a little unlike `If–ElseIf–Else`, which exits out of the branching construct\
    \ the moment the first `$true` is met and the script block is executed. Therefore,\
    \ if you want only one outcome from the construct, consider adding the `break`\
    \ keyword in every script block to break out of the construct the moment a `$true`\
    \ is encountered. For example:\n\n```\n...\n    'Monday' {\n        Write-Output\
    \ 'Red'\n        break\n    }\n...\n```\n\nOf course, in this particular situation,\
    \ it is not necessary, since the outcome would be exclusive.\n\n# Learning to\
    \ use delays\n\nPowerShell usually runs one statement after another; the current\
    \ statement must return the buffer (so to speak) for the next step to begin execution.\
    \ However, in some cases, you still require a wait; situations where the buffer\
    \ could be returned before the desired outcome is achieved.\n\nWhile setting up\
    \ something like this may require some manipulation, to keep it simple, let us\
    \ just assume that we need five seconds to register what day it is (sure, disbelief\
    \ works), before being instructed what to wear.\n\n# How to do it...\n\nLet us\
    \ combine the two scripts from the previous recipe, *Using conditions to control\
    \ script flow*.\n\n1. Open a new file and type the following:\n\n```\n$Date =\
    \ Get-Date\n\nif ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n    Write-Host\
    \ 'We party on weekends!' -BackgroundColor Yellow -ForegroundColor Black\n}\n\
    elseif ($Date.DayOfWeek -eq 'Wednesday') {\n    Write-Host 'Half the week is over,\
    \ and I want to do so much more!'\n}\nelse {\n    Write-Host 'Work is worship.\
    \ Ahem!'\n}\n\nStart-Sleep -Seconds 5\n\n$Date = Get-Date\n\nswitch ($Date.DayOfWeek)\
    \ {\n    'Monday' { Write-Output 'Wear red.'; break }\n    'Tuesday' { Write-Output\
    \ 'Wear violet.'; break }\n    'Wednesday' { Write-Output 'Wear indigo.'; break\
    \ }\n    'Thursday' { Write-Output 'Wear blue.'; break }\n    'Friday' { Write-Output\
    \ 'Wear green.'; break }\n    Default { Write-Output 'Poor you, working today.\
    \ Wear orange.'; break }\n}\n```\n\n![](Images/9586edab-e1bb-444a-a119-28584db1a57b.png)\n\
    \n# How it works...\n\nThe reason this is a separate recipe is that it is part\
    \ of flow control, and is useful in some specific situations. The `Start-Sleep`\
    \ cmdlet accepts `Seconds` or `Milliseconds` as input, and waits for that amount\
    \ of time before processing the next instruction.\n\n# Writing a basic looping\
