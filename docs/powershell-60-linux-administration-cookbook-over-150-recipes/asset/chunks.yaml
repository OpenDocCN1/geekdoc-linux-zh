    \ where messages from `cron` are sent. The common destinations include `/var/log/cron`,\
    \ `/var/log/messages` and `/var/log/syslog`.\n\n# Removing the jobs in PowerShell\n\
    \nIn this recipe, we're going to see the steps to remove the entries from the\
    \ CronTab file.\n\n# How to do it...\n\nThat we have created entries into the\
    \ `cron` configuration file, let us attempt to remove those entries.\n\n1.  List\
    \ the jobs using the `Get-CronJob` cmdlet. This will get you the list of jobs\
    \ that are created by reading the `CronTab` file\n\n```\nPS> Get-CronJob | Format-Table\
    \ -AutoSize\n```\n\n2.  Now, apply a conditional logic to segregate the required\
    \ job entries using `Where-Object` clause. You will read more about this in the\
    \ chapter, *Passing Data Through Pipelines*.\n\n```\nPS > Get-CronJob | Where-Object\
    \ {$_.Month -match 'Jan'} | Format-Table -AutoSize \n\nMinute Hour DayOfMonth\
    \ Month DayOfWeek Command\n------ ---- ---------- ----- --------- -------\n*/15\
    \ 10-12 * Jan,Mar,Jun,Sep,Dec sun,tue,fri /usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\
    \n*/15 10-12 * Jan,Mar sun,tue,fri /usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\
    \n```\n\n4.  Remove the entries using `Remove-CronJob`.\n\n```\nPS > Get-CronJob\
    \ | Where-Object {$_.Month -match 'Jan'} | Remove-CronJob \n\nConfirm\nAre you\
    \ sure you want to perform this action?\nPerforming the operation \"Remove\" on\
    \ target \"/usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\".\n[Y] Yes [A] Yes\
    \ to All [N] No [L] No to All [S] Suspend [?] Help (default is \"Y\"): Y\n\nConfirm\n\
    Are you sure you want to perform this action?\nPerforming the operation \"Remove\"\
    \ on target \"/usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\".\n[Y] Yes [A]\
    \ Yes to All [N] No [L] No to All [S] Suspend [?] Help (default is \"Y\"): Y\n\
    PS /home/PacktPub> \n```\n\n# How it works...\n\nWhen we would like to remove\
    \ cron jobs, we list out the cron jobs and then, pass the job objects via the\
    \ pipeline to the cmdlet, `Remove-CronJob`, to remove the jobs from the configuration\
    \ file.\n\n# Passing Data through the Pipeline\n\nIn this chapter, we cover the\
    \ following topics:\n\n1.  Selecting columns from the output\n\n2.  Limiting the\
    \ number of items returned by a cmdlet\n\n3.  Expanding selections\n\n4.  Filtering\
    \ objects\n\n5.  Grouping the output\n\n6.  Sorting the output\n\n7.  Taking actions\
    \ on the returned objects\n\n8.  Understanding pipeline-enabled parameters\n\n\
    9.  Importing content into PowerShell\n\n# Introduction\n\nIt is time for some\
    \ information feasting now. In the previous chapter, *First Steps in Administration\
    \ using PowerShell*, we looked at a few simple concepts such as working with dates\
    \ and processes. In doing so, we learnt a thing or two about using PowerShell\
    \ as well, for example, measuring the output objects.\n\nIn this chapter, we will\
    \ learn to use one of those things that make PowerShell highly efficient and friendly:\
    \ The Pipeline.\n\nMost Linux administrators would have used the pipeline in their\
    \ shell commands or shell scripts. And most administrators who use any form of\
    \ shell scripting would be aware that the pipe sends the output of one command\
    \ as input to the next. It is also true in case of Bash (and its derivatives)\
    \ that the pipe sends *text* from the preceding command to the succeeding one.\n\
    \nMost PowerShell cmdlets output objects. And the pipeline in PowerShell sends\
    \ the output *object* to the next command. When we run a PowerShell command (and\
    \ not a Linux command) in PowerShell, we get a table-like output in most cases.\
    \ We may think that it is all of the output.\n\nWhen we ask PowerShell to get\
    \ any information, it pulls out entire the object in the background. This object (or\
    \ a package that contains a lot of objects) is then processed using PowerShell's\
    \ built-in formatting rules in order for it to be displayed on the host. To quote\
    \ Microsoft:\n\nWhat you see onscreen is a summary of information, and not a complete\
    \ representation of the output object.\n\nTherefore, more often than not, what\
    \ you see on the screen as the output of a certain command, is just a tip of the\
    \ iceberg! Just that the *submerged* part was chosen not to be displayed based\
    \ on the formatting rules. In this chapter, we will use the pipeline to get more\
    \ from the objects, than is displayed on the screen by default, and leverage the\
    \ capability of the pipeline to get more out of PowerShell than meets the eye.\n\
    \n# Selecting columns from the output\n\nWhen my brother saw me exploring `awk`,\
    \ he said, 'Boy, have we overused this command!' Of course, not everything displayed\
    \ on the screen is important—or even necessary. In this recipe, we learn to separate\
    \ the columns in PowerShell, without using the Linux command, `awk`.\n\n# Getting\
    \ Ready"
