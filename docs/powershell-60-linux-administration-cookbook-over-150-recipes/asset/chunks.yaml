  trans: '

    如果你计划仅使用 PowerShell 在控制台上运行命令，那么理解管道（pipelines）并不是必须的；它封装得很好，且 `cmdlets` 的设计非常巧妙，能够处理在
    `cmdlets` 之间传递对象。然而，如果你计划创建自定义函数和模块，那么管道的概念是你非常想要深入理解的。


    在本教程中，我们将介绍 `cmdlets` 接受输入的两种方式。在创建函数的阶段阶段，我们将查看如何为参数启用管道输入。


    # 如何操作...


    我们将主要使用帮助文档来演示两种不同类型的管道输入。


    1. 在提示符处，输入以下命令：


    ```

    PS> Get-Help Get-Item -Parameter Path

    ```


    ![](img/ece35564-34f0-4beb-a575-83b29dc0208e.png)


    它显示该参数接受字符串输入，并且接受通过属性名以及值进行输入。


    2. 输入以下内容查看是否接受有效的字符串。


    ```

    PS> ''/home/ram/random'' | Get-Item

    ```


    ![](img/2f9fadc6-7b06-4d05-a0f3-3232e4d88ab8.png)


    3. 让我们对 `Get-Date` 尝试类似的操作。


    ```

    PS> Get-Help Get-Date -Parameter *

    ```


    `Date` 参数通过管道接受值。然而，它的类型是 `DateTime`，而不是字符串。


    4. 尝试通过管道发送一个有效的字符串看看它是否会被转换为日期。


    ```

    PS> ''21 June 2018'' |  Get-Date

    ```


    它确实将字符串转换成了日期和时间。


    ![](img/9bf14887-e102-4518-aba5-ef0f00939e1d.png)


    5. 现在，让我们回到获取当前目录详情。但这次我们只选择对象的 `FullName` 属性。


    ```

    PS> Get-Item . | Select-Object FullName

    ```


    6. 将此内容通过管道传递给 `Get-ChildItem` cmdlet。


    ```

    PS> Get-Item . | Select-Object FullName | Get-ChildItem

    ```


    出现了一个错误。


    ![](img/4b9eb33e-158a-47c3-91fa-81c8373590b4.png)


    7. 将属性名改为 `LiteralPath`。


    ```

    PS> Get-Item . | Select-Object @{Name = ''LiteralPath''; Expression = {$_.FullName}}

    ```


    8. 通过管道将对象传递给 `Get-ChildItem`。


    ```

    PS> Get-Item . | Select-Object @{Name = ''LiteralPath''; Expression = {$_.FullName}}
    | Get-ChildItem

    ```


    成功了。


    # 工作原理...


    通过管道输入有两种两种方式：


    1. `ByPropertyName`（按属性名）


    2. `ByValue`（按值）


    `ByValue` 类型可能是最常见的。如果参数通过值从管道接受输入，它将寻找与输出中定义的数据类型匹配的数据类型，并将输出作为自身的输入。如果数据类型与定义的不同，但可以转换为所需的类型，参数会将该值转换为它所接收的数据类型并进行处理。这种情况在
    `Get-Date` 的情况下发生过，我们将日期作为字符串发送，并通过管道传递给 `Get-Date`。


    在 `Get-Item` 的情况下，`Path` 参数接受字符串输入并处理命令。在 `Get-Date` 的情况下，`Date` 参数将字符串转换为 `DateTime`
    对象并处理了请求。


    与 `ByValue` 相比，`ByPropertyName` 寻找与参数名称相同的属性。在我们案例中，当我们传递 `FullName` 属性时，尽管它本质上是对象的字面路径且是一个字符串值，但
    `Get-ChildItem` 的 `LiteralPath` 报错了。原因是属性名不是 `LiteralPath`。当我们把属性名改为 `LiteralPath`
    时，`Get-ChildItem` 接受了通过管道输入。


    # 将内容导入 PowerShell


    管理多台计算机的管理员需要将某种输入到 `cmdlets` 中，以便他们自动化任务。虽然大多数 Linux 管理员熟悉向文件发送输入（即：`Get-Content`），但
    PowerShell 同样能够导入输入。这种导入的输入是一个 PowerShell 对象。


    在本教程中，我们将查看两种类型的导入 cmdlet 并学习如何使用它们。


    # 如何操作...


    在教程 *解析从文本到对象的输入* 中，我们使用 `Import-Csv` 导入逗号分隔的值文件，将其中包含的数据转换为 PowerShell 对象。然而，让我们回顾一下我们学到的内容，这次由于我们已经知道如何处理对象，我们将以某种方式使用导入的内容。


    在导入内容之前，让我们先将一些内容导出到 CSV 文件。这样我们就有了一些相关内容可以进行操作。


    1. 导航到你在本章创建文件的位置。列出目录内容。虽然书中在控制台上也（并推荐）使用完整的 cmdlet（当然可以使用 Tab 补全），但如果你愿意，可以使用别名。


    ```

    PS> Get-ChildItem -Path . | Select-Object Name, FullName, CreationTime, LastWriteTime,
    Extension, Length

    ```


    2. 将内容导出到 CSV 文件。


    ```

    PS> Get-ChildItem -Path . | Select-Object Name, FullName, CreationTime, LastWriteTime,
    Extension, Length | Export-Csv ./file-list.csv

    ```


    3. 使用电子表格处理器（如 LibreOffice Calc）甚至文本编辑器打开文件查看其内容。


    ```

    PS> Get-Content ./file-list.csv

    ```


    那是 `Get-ChildItem` 返回的对象的纯文本表示。


    4. 导入 CSV 文件的内容将此文本转换为对象。


    ```

    PS> Import-Csv ./file-list.csv

    ```


    5. 查找此命令返回对象的类型。


    ```

    PS> Import-Csv ./file-list.csv | Get-Member

    ```


    对象类型为 `System.Management.Automation.PSCustomObject`。


    6. 检查这是否与 `Get-ChildItem` 返回的相同。


    ```

    PS> Get-ChildItem | Get-Member

    ```


    7. `Import-Csv` 返回的对象不同。可以像对象一样对待它吗？使用成员访问获取 `CreationTime`。


    ```

    PS> (Import-Csv ./file-list.csv).CreationTime

    ```


    8. 只获取年份。


    ```

    PS> (Import-Csv ./file-list.csv).CreationTime.Year

    ```


    9. 查找上一个命令返回的对象类型。


    ```

    PS> (Import-Csv ./file-list.csv).CreationTime | Get-Member

    ```


    TypeName: `String`


    10. 尝试将 `LastWriteTime` 转换为 `DateTime` 对象。不过只选第一条记录。


    ```

    PS> Get-Date (Import-Csv ./file-list.csv | Select-Object CreationTime -First 1).CreationTime

    ```


    11. 如果我们必须保留 `Get-ChildItem` 返回对象中的所有对象，包括它们的对象类型怎么办？


    ```

    PS> Get-ChildItem -Path . | Export-Clixml ./file-list.xml

    ```


    12. 现在，将 XML 内容导入到会话。


    ```

    PS> Import-Clixml ./file-list.xml

    ```


    13. 查找导入命令返回对象的类型名称。


    ```

    PS> Import-Clixml ./file-list.xml | Get-Member

    ```


    14. 选取 `CreationTime` 属性并查找其类型。


    ```

    PS> (Import-Clixml ./file-list.xml).CreationTime | Get-Member

    ```


    TypeName: `DateTime`


    15. 只获取年份。


    ```

    PS> (Import-Clixml ./file-list.xml).CreationTime.Year

    ```


    '
- fmt: "\nOn the other hand, a CLIXML (or a Common Language Infrastructure XML) is\
    \ a complete .NET object. When a PowerShell object is exported to CLIXML, the\
    \ object is retained as it is. That is, the CLIXML retains all the properties\
    \ (of theoretically any depth), and the methods that were part of the output object.\
    \ In other words, it can be said that a CLIXML export is almost lossless in terms\
    \ of the members of the object.\n\n# See also\n\nRecipe: Generate random text\
    \ using ASCII characters\n\n# Using Variables and Objects\n\nIn this chapter,\
    \ we are discussing the following topics:\n\n1. Using environment variables\n\
    2. Storing the output of an instance of a .NET Core object\n3. Creating custom\
    \ properties to an object\n4. Creating a custom object from a returned object\n\
    5. Understanding extension of type data\n6. Retaining object modifications across\
    \ sessions\n7. Removing custom type data\n\n# Introduction\n\nVariables are important\
    \ to programming since they act as containers of information stored during the\
    \ program execution. Although piping makes PowerShell highly versatile, they still\
    \ cannot replace variables, because objects passed through the pipeline must be\
    \ consumed immediately, and not all scripts work that way, given our varied requirements.\n\
    \nWe are all aware of the various data types: `int`, `double`, `string`, `char`,\
    \ `array`, etc. Two other important types of variables in PowerShell are `hashtables`\
    \ and `objects`. A hashtable is a dictionary table formed with key–value pairs.\
    \ An object, as we have seen, could be as complex and as simple as it can get\
    \ in PowerShell, holding values of different kinds.\n\nIn PowerShell, objects\
    \ can be stored into variables. For instance,\n\n```\n$Processes = Get-Process\n\
    ```\n\nwould store all the processes into the variable `$Processes`.\n\nOne more\
    \ point to remember with variables is the scope. By default, variables have a\
    \ local scope, meaning, they are valid within the function that they are specified\
    \ in. Global variables are valid across the program. In general, it is a best\
    \ practice to use local variables, though.\n\nGlobal variables are declared and\
    \ used with the `$Global:` prefix, such as `$Global:MyVariable`.\n\n# Using environment\
    \ variables\n\nIn this recipe, you will learn about environment variables. When\
    \ interacting with the system through a shell session, there are many pieces of\
    \ information that the Shell requires in order to determine the program access,\
    \ the available resources, default configuration, system properties, etc. Some\
    \ of these settings are configured within the system as variables and these settings\
    \ are commonly called the EnvironmentVariables.\n\nWhile hard-coding this information\
    \ during installation is one way to go, it makes the entire system a monolith\
    \ that cannot be reconfigured without what is known as nuking-and-paving. With\
    \ environment variables, another layer of flexibility is introduced.\n\n# How\
    \ to do it...\n\nLet us start working with an environment variable using the following\
    \ steps:\n\n1. To Display environment variable, type in `Get-ChildItem env:` or\
    \ `Get-Item env:` and press enter\n\n```\nPS> Get-ChildItem env:\nPS> Get-Item\
    \ env:\n```\n\n2. `Env:` is also a PowerShell provider, and works just like a\
    \ file system. Therefore, you could also `Set-Location` at `Env:` and use `Get-ChildItem\
    \ .` to list out the variables available in your system.\n\n3. To display the\
    \ value of the specific environment variable, run the following command.\n\n```\n\
    PS> Get-ChildItem Env:/PATH | Select-Object value | Format-Table -Wrap\n```\n\n\
    After typing `Get-ChildItem Env:/`, You can use tab-completion to populate all\
    \ environment variables.\n\n4. Do a `Get-Member` on the `PATH` environment variable\
    \ to find its type.\n\n5. Before changing the environment variable, list the `PATH`\
    \ variable using `$env:PATH | Get-Member`. It is a string. Save the contents someplace\
    \ safe.\n\n6. Now, update the `PATH` environment variable by adding the path of\
    \ `sqlcmd` tool executable to `$env: PATH` variable. The operation is a simple\
    \ addition of a string to the existing value.\n\nYou could add any location to\
    \ `PATH`. If you insist on getting `sqlcmd`, head over to [Microsoft docs](https://docs.microsoft.com/en-us/sql/linux/sql-server-linux-setup-tools?view=sql-server-linux-2017)\
    \ for SQL Server 2017 for instructions to get yourself a copy.\n\n```\nPS> $env:PATH\
    \ = $env:PATH + ':/opt/mssql-tools/bin'\nPS /root> sqlcmd\n```\n\nThe output of\
    \ the preceding code block is illustrated in the following image:\n\n![](Images/1e6b48cb-4403-4d84-aac1-56e43f0a78b9.png)\n\
    \n7. Let us exit the session, launch a new session, check the `PATH` variable,\
    \ and run the `sqlcmd` executable.\n\n```\nPS> sqlcmd \n\nsqlcmd : The term 'sqlcmd'\
    \ is not recognized as the name of a cmdlet, function, script file, or operable\
    \ program.\n```\n\n# How it works...\n\nAs we saw in *Listing the various providers\
    \ in PowerShell*, `Env` is a provider that contains environment-specific configuration.\
    \ Most of these configuration options are also exposed to us as environment variables.\
    \ We are able to use the cmdlets `Get-ChildItem` and `Get-Item` to list the values\
    \ of the available environment variables because `Env:` is a drive within the\
    \ `Env` provider. As environment variables do not have child items, `Get-Item`\
    \ and `Get-ChildItem` return the same output.\n\nSince these variables determine\
    \ how your session behaves with you, changes made to these values are ephemeral.\
    \ In other words, the value of `$env:PATH` is picked from the configuration on\
    \ your Linux computer. The manual change made to `$env:PATH` made within a PowerShell\
    \ session remains as long as the PowerShell session is alive. Changes made to\
    \ `$env:PATH` does not change the value within the system itself.\n\nIf you would\
    \ like to make a certain change permanent, edit the `.bashrc` or `~/.bash_profile`\
    \ configuration files. If you would like to use PowerShell instead of Bash, make\
    \ the change in your PowerShell profile. Instructions on how to do that can be\
    \ found in the recipe, *Enabling automated execution of commands for each load*,\
    \ in the chapter, *Preparing for Administration using PowerShell*.\n\n# There's\
    \ more...\n\nYou can also access environment variables using .NET type accelerator\
    \ and its methods.\n\n```\nPS> [environment]::GetEnvironmentVariable(\"PATH\"\
    )\n```\n\n# See also\n\n1. About Environment variables: `Get-Help about_Environment_Variables`\
    \ \n2. Recipe 1.11: Listing the various providers in PowerShell\n3. Recipe 3.4:\
    \ Enabling automated execution of commands for each load\n\n# Storing the output\
    \ of an instance of a .NET Core Object\n\n.NET is object-oriented, and works on\
    \ classes and objects. PowerShell, being an extension to this framework, allows\
    \ you to work with the .NET framework and COM interfaces in order to perform many\
    \ system administration tasks. This way, you are not limited only to the tasks\
    \ that can be performed using cmdlets.\n\nIn this recipe, we will define a simple\
    \ class from within PowerShell.\n\n# Getting Ready\n\nWe recommend using Visual\
    \ Studio Code for this recipe. To know how to install and configure it, visit\
    \ the recipe, *Installing Visual Studio Code* from the chapter, *Preparing for\
    \ Administration using PowerShell*.\n\n# How to do it...\n\nLaunch Visual Studio\
    \ Code and address any immediate requirements it asks for.\n\n1. Open a new file\
    \ in Visual Studio Code and set the file type as PowerShell.\n2. Type in the following\
    \ in the script pane. The file does not have to be saved.\n\n```\nclass Person\
    \ {\n    [string]$Name\n    [Int32]$Age\n    [int32]$Salary\n\n    Person () {}\n\
    \n    Person ([string]$Name, [int32]$Age) {\n        $this.Name = $Name\n    \
    \    $this.Age = $Age\n    }\n\n    [int32] sal ([int32]$Salary, [int32]$Comm)\
    \ {\n        return $Salary * $Comm\n    }\n}\n```\n\n3. To find constructors\
    \ of a class, call the static method, `New`; type in the following at the prompt.\n\
    \n```\nPS> [Person]::New\n```\n\n4. This gives us two functions of the same name;\
    \ these are overload definitions. Now, create a new object by passing in the parameters.\n"
  raw: "On the other hand, a CLIXML (or a Common Language Infrastructure XML) is a\
    \ complete .NET object. When a PowerShell object is exported to CLIXML, the object\
    \ is retained as it is. That is, the CLIXML retains all the properties (of theoretically\
    \ any depth), and the methods that were part of the output object. In other words,\
    \ it can be said that a CLIXML export is almost lossless in terms of the members\
    \ of the object.\n\n# See also\n\nRecipe: Generate random text using ASCII characters\n\
    \n# Using Variables and Objects\n\nIn this chapter, we are discussing the following\
    \ topics:\n\n1.  Using environment variables\n\n2.  Storing the output of an instance\
    \ of a .NET Core object\n\n3.  Creating custom properties to an object\n\n4. \
    \ Creating a custom object from a returned object\n\n5.  Understanding extension\
    \ of type data\n\n6.  Retaining object modifications across sessions\n\n7.  Removing\
    \ custom type data\n\n# Introduction\n\nVariables are important to programming\
    \ since they act as containers of information stored during the program execution.\
    \ Although piping makes PowerShell highly versatile, they still cannot replace\
    \ variables, because objects passed through the pipeline must be consumed immediately,\
    \ and not all scripts work that way, given our varied requirements.\n\nWe are\
    \ all aware of the various data types: `int`, `double`, `string`, `char`, `array`,\
    \ etc. Two other important types of variables in PowerShell are *hashtables* and\
    \ *objects*. A hashtable is a dictionary table formed with key–value pairs. An\
    \ object, as we have seen, could be as complex and as simple as it can get in\
    \ PowerShell, holding values of different kinds.\n\nIn PowerShell, objects can\
    \ be stored into variables. For instance,\n\n```\n$Processes = Get-Process\n```\n\
    \nwould store all the processes into the variable, `$Processes`.\n\nOne more point\
    \ to remember with variables is the scope. By default, variables have a local\
    \ scope, meaning, they are valid within the function that they are specified in.\
    \ Global variables are valid across the program. In general, it is a best practice\
    \ to use local variables, though.\n\nGlobal variables are declared and used with\
    \ the `$Global:` prefix, such as `$Global:MyVariable`.\n\n# Using environment\
    \ variables \n\nIn this recipe, you will learn about environment variables. When\
    \ interacting with the system through a shell session, there are many pieces of\
    \ information that the Shell requires in order to determine the program access,\
    \ the available resources, default configuration, system properties, etc. Some\
    \ of these settings are configured within the system as variables and these settings\
    \ are commonly called the *EnvironmentVariables*.\n\nWhile hard-coding this information\
    \ during installation is one way to go, it makes the entire system a monolith\
    \ that cannot be reconfigured without what is known as nuking-and-paving. With\
    \ environment variables, another layer of flexibility is introduced.\n\n# How\
    \ to do it...\n\nLet us start working with an environment variable using the following\
    \ steps:\n\n1.  To Display environment variable, type in `Get-ChildItem env:`\
    \ or `Get-Item env:` and press enter\n\n```\nPS> Get-ChildItem env:\nPS> Get-Item\
    \ env:\n```\n\n2.  `Env:` is also a PowerShell provider, and works just like a\
    \ file system. Therefore, you could also `Set-Location` at `Env:` and use `Get-ChildItem\
    \ .` to list out the variables available in your system.\n\n3.  To display the\
    \ value of the specific environment variable, run the following command.\n\n```\n\
    PS> Get-ChildItem Env:/PATH | Select-Object value | Format-Table -Wrap\n```\n\n\
    After typing `Get-ChildItem Env:/`,  You can use tab-completion to populate all\
    \ environment variables. \n\n4.  Do a `Get-Member` on the `PATH` environment variable\
    \ to find its type.\n\n5.  Before changing the environment variable, list the\
    \ `PATH` variable using `$env:PATH | Get-Member`. It is a string. Save the contents\
    \ someplace safe.\n\n6.  Now, update the `PATH` environment variable by adding\
    \ the path of `sqlcmd` tool executable to $`env: PATH` variable. The operation\
    \ is a simple addition of a string to the existing value.\n\nYou could add any\
    \ location to `PATH`. If you insist on getting `sqlcmd`, head over to [Microsoft\
    \ docs](https://docs.microsoft.com/en-us/sql/linux/sql-server-linux-setup-tools?view=sql-server-linux-2017) for\
    \ SQL Server 2017 for instructions to get yourself a copy.\n\n```\nPS> $env:PATH\
    \ = $env:PATH + ':/opt/mssql-tools/bin'\nPS /root> sqlcmd\n```\n\nThe output of\
    \ the preceding code block is illustrated in the following image:\n\n![](Images/1e6b48cb-4403-4d84-aac1-56e43f0a78b9.png)\n\
    \n7.  Let us exit the session, launch a new session,  check the `PATH` variable,\
    \ and run the `sqlcmd` executable.\n\n```\nPS> sqlcmd \n\nsqlcmd : The term 'sqlcmd'\
    \ is not recognized as the name of a cmdlet, function, script file, or operable\
    \ program.\n```\n\n# How it works...\n\nAs we saw in *Listing the various providers\
    \ in PowerShell*, `Env` is a provider that contains environment-specific configuration. Most\
    \ of these configuration options are also exposed to us as environment variables. We\
    \ are able to use the cmdlets `Get-ChildItem` and `Get-Item` to list the values\
    \ of the available environment variables because `Env:` is a drive within the\
    \ `Env` provider. As environment variables do not have child items, `Get-Item`\
    \ and `Get-ChildItem` return the same output.\n\nSince these variables determine\
    \ how your session behaves with you, changes made to these values are ephemeral.\
    \ In other words, the value of `$env:PATH` is picked from the configuration on\
    \ your Linux computer. The manual change made to `$env:PATH` made within a PowerShell\
    \ session remains as long as the PowerShell session is alive. Changes made to\
    \ $env:PATH does not change the value within the system itself.\n\nIf you would\
    \ like to make a certain change permanent, edit the `.bashrc` or the **`~/.bash_profile` **configuration\
    \ files. If you would like to use PowerShell instead of Bash, make the change\
    \ in your PowerShell profile. Instructions on how to do that can be found in the\
    \ recipe, *Enabling automated execution of commands for each load*, in the chapter, *Preparing\
    \ for Administration using PowerShell*.\n\n# There's more...\n\nYou can also access\
    \ environment variables using  .NET type accelerator and its methods.\n\n```\n\
    PS> [environment]::GetEnvironmentVariable(\"PATH\")\n```\n\n# See also\n\n1. \
    \ About Environment variables: `Get-Help about_Environment_Variables`\n\n2.  Recipe\
    \ 1.11: Listing the various providers in PowerShell\n\n3.  Recipe 3.4: Enabling\
    \ automated execution of commands for each load\n\n# Storing the output of an\
    \ instance of a .NET Core Object\n\n.NET is object-oriented, and works on classes\
    \ and objects. PowerShell, being an extension to this framework, allows you to\
    \ work with the .NET framework and COM interfaces in order to perform many system\
    \ administration tasks. This way, you are not limited only to the tasks that can\
    \ be performed using cmdlets.\n\nIn this recipe, we will define a simple class\
    \ from within PowerShell.\n\n# Getting Ready\n\nWe recommend using Visual Studio\
    \ Code for this recipe. To know how to install and configure it, visit the recipe,\
    \ *Installing Visual Studio Code* from the chapter, *Preparing for Administration\
    \ using PowerShell*.\n\n# How to do it...\n\nLaunch Visual Studio Code and address\
    \ any immediate requirements it asks for.\n\n1.  Open a new file in Visual Studio\
    \ Code and set the file type as PowerShell.\n\n2.  Type in the following in the\
    \ script pane. The file does not have to be saved.\n\n```\nclass Person {\n  \
    \  [string]$Name\n    [Int32]$Age\n    [int32]$Salary\n\n    Person () {}\n\n\
    \    Person ([string]$Name, [int32]$Age) {\n        $this.Name = $Name\n     \
    \   $this.Age = $Age\n    }\n\n    [int32] sal ([int32]$Salary, [int32]$Comm)\
    \ {\n        return $Salary * $Comm\n    }\n}\n```\n\n3.  To find constructors\
    \ of a class, call the static method, `New`; type in the following at the prompt.\n\
    \n```\nPS> [Person]::New\n```\n\n4.  This gives us two functions of the same name;\
    \ these are overload definitions. Now, create a new object by passing in the parameters."
