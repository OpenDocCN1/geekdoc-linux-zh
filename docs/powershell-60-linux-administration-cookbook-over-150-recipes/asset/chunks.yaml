  trans: "\n\n```bash\n$Guests = Import-Csv './chapter-08/05-Write-GuestSeatDetails.csv'\n\
    \nforeach ($Guest in $Guests) {\n    $RowIdentifier = [byte]char[0].ToUpper())\n\
    \    $RowNumber = ($RowIdentifier - 64).ToString()\n\n    switch -Regex ($RowNumber)\
    \ {\n        '1(1|2|3)$' { $RowNumber += 'th'; break }\n        '.?1$'      {\
    \ $RowNumber += 'st'; break }\n        '.?2$'      { $RowNumber += 'nd'; break\
    \ }\n        '.?3$'      { $RowNumber += 'rd'; break }\n        Default     {\
    \ $RowNumber += 'th'; break }\n    }\n\n    $SeatNumber = ($Guest.Seat -split\
    \ \"-\")[1]\n\n    if ($SeatNumber -gt 20) {\n        $Side = 'right'\n    }\n\
    \    else {\n        $Side = 'left'\n    }\n\n    Start-Sleep -Seconds 1\n   \
    \ Write-Host \"Welcome, $($Guest.Name)! \" -NoNewline\n    Start-Sleep -Seconds\
    \ 1\n    Write-Host \"Your seat is in the $RowNumber row, to the $Side the aisle.\"\
    \n}\n```\n\n3. 运行脚本。\n\n![](img/05449802-4f16-462e-a2a1-6ddfb8a26793.png)\n\n\
    # 工作原理...\n\n这里的核心思想是使用 `foreach`。当使用 `Foreach` 循环结构时，你通过变量来引用每个元素；在这种情况下，变量不是通过索引标识的。在每次迭代中，在我们的案例中，`$Guest`\
    \ 会从 `$Guests` 中顺序选取一个值，以便可以使用 `$Guest` 来引用当前元素。\n\n座号有一个模式：一个字母行标识符，后面跟着一个连字符，然后是数字座位标识符。\n\
    \n座号是一个字符串。我们在 `-` 处对其进行拆分，选取结果数组中的第一个元素，将其转换为大写（以防它本来大写），将此字母转换为字符，然后使用 `[byte]`\
    \ 强制转换运算符找到其 ASCII 标识符。是的，我们从中减去 64（因此 `A` 变成 `1`）。\n\n为了能够在 switch–case 中使用该数字而不报错，我们将数字转换回字符串。我们让数字便于在句子中使用。我们获取数组的第二部分（数字部分），查看座位位于过廊的哪侧。我们将所有这些结合起来，得到最终问候和引导字符串，这些字符串会在一秒的延迟后显示。\n\
    \n# 使用 For 循环结构\n\n`Foreach` 循环和 `For` 循环的区别在于，后者使用索引来执行操作。我们需要一个变量来控制流，其值形成一个范围。让我们重新实现与*在预定义数组上编写更复杂的循环*中相同的解决方案，但使用\
    \ `For` 循环结构来代替。\n\n# 如何实现...\n\n所做的假设与*在预定义数组上编写更复杂的循环*中的假设是一的。\n\n1. 打开一个新文件并将以下内容粘贴到其中。\n\
    \n```bash\n$Guests = Import-Csv './chapter-08/05-Write-GuestSeatDetails.csv'\n\
    \nfor ($CurrentGuest = 0; $CurrentGuest -lt $Guests.Length; $CurrentGuest++) {\n\
    \    $Guest = $Guests[$CurrentGuest]\n\n    $RowIdentifier = [byte]char[0].ToUpper())\n\
    \n    $RowNumber = ($RowIdentifier - 64).ToString()\n\n    switch -Regex ($RowNumber)\
    \ {\n        '1(1|2|3)$' { $RowNumber += 'th'; break }\n        '.?1$'      {\
    \ $RowNumber += 'st'; break }\n        '.?2$'      { $RowNumber += 'nd'; break\
    \ }\n        '.?3$'      { $RowNumber += 'rd'; break }\n        Default     {\
    \ $RowNumber += 'th'; break }\n    }\n\n    $SeatNumber = ($Guest.Seat -split\
    \ \"-\")[1]\n\n    if ($SeatNumber -gt 20) {\n        $Side = 'right'\n    }\n\
    \    else {\n        $Side = 'left'\n    }\n\n    Start-Sleep -Seconds 1\n   \
    \ Write-Host \"Welcome, $($Guest.Name)! \" -NoNewline # 子表达式 `$Guest.Name` 将被计算。\n\
    \    Start-Sleep -Seconds 1\n    Write-Host \"Your seat is in the $RowNumber row,\
    \ to the $Side the aisle.\"\n}\n```\n\n2. 运行脚本。\n\n# 工作原理...\n\n你们中的一些人可能会指出，在这种情况下\
    \ `foreach` 结构比 `for` 结构更简单，你们是对的。在我担任管理员的期间，过去三年里，我使用 `for` 结构不到十次，而使用 `foreach`\
    \ 有数百次。`For` 结构有它自己的用途；但与预定义数组配合是效率较低的一种。''\n\n无论如何，只要对象是数组，`for` 就可以工作。`$CurrentGuest`\
    \ 是我们使用的索引，范围从 0 到 `$Guests` 中的总元素减 1。在这种情况下，循环从索引初始化为 0 开始，在脚本块的每次迭代后，索引都会递增（`$CurrentGuest++`）。\n\
    \n`for` 比 `foreach` 更高效的一种操作是，如果必须问候*每隔*一位客人（我知道这很没礼貌）。在这种情况下，`for` 定义的第三部分将是\
    \ `$CurrentGuest += 2`。\n\n使用 `$CurrentGuest + 2` 而不是 `$CurrentGuest += 2` 将导致此循环无限循环，因为\
    \ `$CurrentGuest` 的值将完全不会改变。\n\n# 使用 While 循环结构\n\n我们在这个方案中创建两个脚本：第一个用于建立 For\
    \ 和 While 之间的相似性，另一个为理解 Do–While 和 Do–Until 结构奠定基础。这样，学习将是循序渐进的，也更容易。\n\n对于第一个脚本，场景与上一个方案*使用\
    \ For 循环结构*中描述的相同。对于第二个，任务是将年份作为输入并找到该年份母亲节的日期。\n\n# 如何实现\n\n首先，继续你对上一个方案所做的假设。\n\
    \n1. 打开一个新文件并将以下内容粘贴到其中。\n\n```bash\n$Guests = Import-Csv './chapter-08/05-Write-GuestSeatDetails.csv'\n\
    $CurrentGuest = 0\n\nwhile ($CurrentGuest -lt $Guests.Length) {\n    $Guest =\
    \ $Guests[$CurrentGuest]\n\n    $RowIdentifier = [byte]char[0].ToUpper())\n  \
    \  $RowNumber = ($RowIdentifier - 64).ToString()\n\n    switch -Regex ($RowNumber)\
    \ {\n        '1(1|2|3)$' { $RowNumber += 'th'; break }\n        '.?1$'      {\
    \ $RowNumber += 'st'; break }\n        '.?2$'      { $RowNumber += 'nd'; break\
    \ }\n        '.?3$'      { $RowNumber += 'rd'; break }\n        Default     {\
    \ $RowNumber += 'th'; break }\n    }\n\n    $SeatNumber = ($Guest.Seat -split\
    \ \"-\")[1]\n\n    if ($SeatNumber -gt 20) { $Side = 'right' }\n    else { $Side\
    \ = 'left' }\n\n    Start-Sleep -Seconds 1\n    Write-Host \"Welcome, $($Guest.Name)!\
    \ \" -NoNewline\n    Start-Sleep -Seconds 1\n    Write-Host \"Your seat is in\
    \ the $RowNumber row, to the $Side the aisle.\"\n\n    $CurrentGuest++\n}\n```\n\
    \n2. 运行脚本；输出应与上一个方案相同。\n\n3. 现在，创建一个新的 PowerShell 文件并添加以下代码：\n\n```bash\n$Year\
    \ = Read-Host \"输入你想查找母亲节的年份 (YYYY)\"\n\n$CurrentDay = Get-Date \"01 May $Year\"\
    \n\nwhile ($CurrentDay.DayOfWeek -ne 'Sunday') {\n    $CurrentDay = $CurrentDay.AddDays(1)\n\
    }\n$MothersDay = $CurrentDay.AddDays(7)\n\nWrite-Output \"母亲节在 $($MothersDay.ToLongDateString())。\"\
    \n```\n\n4. 运行脚本。输入任何年份，您应该得到该年份母亲节的日期。\n\n# 工作原理...\n\n每个有限循环结构都需要三个要素：\n\n1.\
    \ 起点\n2. 停止点\n3. 向停止点移动的方法\n\n在 `foreach` 结构的情况下，整个逻辑是预先编码好的。它获取整个数组，找到起点和停止点，并一步步向停止点移动。`For`\
    \ 结构将这些参数声明在循环语句本身本身，每个参数用分号隔开。\n\n`While` 循环并不一样。它的起点定义在循环之外，停止点是通过的条件，而对索引的操作指定在循环内部。这三个参数在脚本中已高亮显示。初始化应该在循环之外进行，以便在循环过程中不会被修改。对索引的操作应该在每次迭代时执行，以便循环向某个方向移动。因此，此操作位于循环内。\n\
    \n"
- fmt: "\nBe a little careful with the `while` loop; you are more prone to getting\
    \ an infinite loop, because it is easy to forget to add the starting point or\
    \ the operation to move towards the stopping point.\n\nNow to Mothers’ Day. We\
    \ first get the date object for the 1^(st) of May for that year, so we can manipulate\
    \ it using its members. This date is the starting point. We then specify the condition,\
    \ 'keep the loop going if the day is not a Sunday.' Then, we add one day, every\
    \ iteration. After every iteration, the variable is checked against the condition.\
    \ Finally, when the first Sunday is encountered, the variable comes out of the\
    \ loop. We then add a week to it to find the second Sunday, and output the long\
    \ date version of the value of `$MothersDay`.\n\n# Cleaning empty directories\
    \ using the Do–While construct\n\nIn the last recipe, we found the second Sunday\
    \ of May using the year as input. We used a `While` loop for that. The `While`\
    \ loop checks the condition before even starting the iteration. If the condition\
    \ returns `$false` at the very beginning, the loop would not even begin; for instance,\
    \ if you input the year as `2016`.\n\nDo–While is a little different; the loop\
    \ is executed once whether the condition is true or not. The condition is checked\
    \ only *after* the first iteration.\n\nThe scenario for this recipe is that we\
    \ want to delete all empty directories within a certain directory.\n\n# Getting\
    \ ready\n\nIn order to work with this recipe, let us create a few empty directories\
    \ within `$HOME/random`. Use the input file that is part of the git repository\
    \ of this book to get the directories created.\n\n```\nPS> Get-Content ./chapter-08/08-input-file.txt\
    \ | ForEach-Object { New-Item $($PSItem -replace '\\.', \"$HOME/random\") -ItemType\
    \ Directory }\n```\n\n# How to do it...\n\nIf you run the following recipe within\
    \ the `random` lab directory, all its empty subdirectories will be deleted.\n\n\
    1.  Open a new file and paste the following content into it.\n\n```\ndo {\n  \
    \  $AllDirectories = (Get-ChildItem -Path $HOME/random -Recurse -Directory).FullName\n\
    \    $EmptyDirectories = $AllDirectories | Where-Object {(Get-ChildItem $PSItem).Count\
    \ -eq 0}\n    $EmptyDirectories | Remove-Item\n} while ($EmptyDirectories.Count\
    \ -gt 0)\n```\n\n2.  Let us add some logging to it so we know what is happening.\n\
    \n```\n$Iteration = 0\ndo {\n    $AllDirectories = (Get-ChildItem -Path $HOME/random\
    \ -Recurse -Directory).FullName\n    $EmptyDirectories = $AllDirectories | Where-Object\
    \ {(Get-ChildItem $PSItem).Count -eq 0}\n    $EmptyDirectories | Remove-Item\n\
    \n    \"Iteration $Iteration. Removed the following $($EmptyDirectories.Count)\
    \ directories.\"\n    $EmptyDirectories\n    $Iteration++\n} while ($EmptyDirectories.Count\
    \ -gt 0)\n```\n\n![](Images/c622064b-ee5e-4f8c-8898-3b6fcb535608.png)\n\n# How\
    \ it works...\n\nThe execution is similar to the `While` construct, however, as\
    \ shown by `Iteration 0`, the Do–While construct executes the script block once\
    \ without checking the condition. In our case, we queried the empty directories\
    \ within the loop. If we had placed this query outside of the loop, we would have\
    \ had to place it within as well, for loop control. That is inefficient programming.\n\
    \nPowerShell found nine empty directories during the execution of the script block.\
    \ When the condition check happened after the execution, `9` was evaluated to\
    \ be greater than `0`. The loop ran again. This time, the value of `$EmptyDirectories.Count`\
    \ was evaluated to be `4`. The loop ran again, and this time again, the value\
    \ was `4`, greater than `0`; the condition was still `$true`. During the next\
    \ run, `$EmptyDirectories.Count` was evaluated to be `2`, then `1`, and then,\
    \ during the last run, `0`. At this time, the outcome of the condition became\
    \ `$false`, and the loop exited. Essentially, the loop statement was, 'Go on *while*\
    \ the count is *more than* zero.'\n\n# See also\n\n1.  Recipe 5.7: Taking actions\
    \ on the returned objects\n\n# Cleaning empty directories using the Do–Until construct\n\
    \nIt is easy to confuse between Do–While and Do–Until, since they both share a\
    \ lot of similarities. However, the difference between them is in fact, pretty\
    \ clear. The Do–While loop executes as long as the outcome of the condition check\
    \ is `$true`, and exits the moment it becomes `$false`. Do–Until is the opposite:\
    \ the loop continues as long as the condition check returns `$false`, and stops\
    \ the moment it the condition check returns `$true`.\n\nLet us use the same scenario\
    \ of cleaning up empty folders, but this time, use the Do-Until loop.\n\n# How\
    \ to do it...\n\nYou would need to rerun the command to create those empty directories.\n\
    \n1.  Open a new file and paste the following content into it.\n\n```\n$Iteration\
    \ = 0\ndo {\n    $AllDirectories = (Get-ChildItem -Path $HOME/random -Recurse\
    \ -Directory).FullName\n    $EmptyDirectories = $AllDirectories | Where-Object\
    \ {(Get-ChildItem $PSItem).Count -eq 0}\n    $EmptyDirectories | Remove-Item\n\
    \    $Count = $EmptyDirectories.Count\n\n    \"Iteration $Iteration`nRemoved the\
    \ following $Count directories. '$Count = 0' is $($Count -eq 0)\"\n    $EmptyDirectories\n\
    \    $Iteration++\n} until ($Count -eq 0)\n```\n\n2.  Notice the change in the\
    \ behaviour this time and compare it with the run of Do–While.\n\n![](Images/368f892a-96c9-4179-b2aa-56ae1c662904.png)\n\
    \n# How it works...\n\nThis time, it was made evident in the interactive output\
    \ how it works. The first run happened without checking for the condition. At\
    \ the end of the run, the condition was checked for. `9` is greater than `0`,\
    \ and not equal. The outcome was `$false`, so the loop continued. It went on this\
    \ way until the count came down to `0` (making the outcome of the condition `$true`),\
    \ at which point, the loop exited. Essentially, the loop statement was, 'Go on\
    \ *until* the count *becomes* zero.'\n\nThat concludes our chapter on flow control.\
    \ I hope that you had a nice time learning the techniques, and that this chapter\
    \ helps you with a good chunk of automation work you wish to carry out after learning\
    \ to use PowerShell.\n\n# Working with Strings\n\n*Coming soon...*\n\n# Performing\
    \ Calculations\n\nIn this chapter, we discuss the following topics:\n\n1.  Performing\
    \ arithmetic operations\n2.  Performing calculations on the output\n3.  Working\
    \ with the administrative constants\n4.  Working with calculated properties\n\
    5.  Working with binary numbers\n6.  Performing base conversions\n\n# Technical\
    \ Requirements\n\nHere are the technical requirements to work with this chapter.\n\
    \n1.  PowerShell installed on the computer. Refer *Installation, Reference and\
    \ Help* for steps.\n\n2.  Visual Studio Code (recommended). Refer the recipe,\
    \ *Installing Visual Studio Code* in the chapter, *Preparing for Administration\
    \ using PowerShell*.\n\n3.  Some throw-away files for the recipes. Use the script,\
    \ `Initialize-PacktPs6CoreLinuxLab.ps1` from within the `ch05` directory of the\
    \ book's GitHub repository.\n\nThe scripts used in this chapter are available\
    \ at: [https://github.com/PacktPublishing/PowerShell-6.0-Linux-Administration-Cookbook/tree/master/ch09](https://github.com/PacktPublishing/PowerShell-6.0-Linux-Administration-Cookbook/tree/master/ch09).\n"
  raw: "Be a little careful with the while loop; you are more prone to getting an\
    \ infinite loop, because it is easy to forget to add the starting point or the\
    \ operation to move towards the stopping point.\n\nNow to Mothers’ Day. We first\
    \ get the date object for the 1^(st) of May for that year, so we can manipulate\
    \ it using its members. This date is the starting point. We then specify the condition,\
    \ 'keep the loop going if the day is not a Sunday.' Then, we add one day, every\
    \ iteration. After every iteration, the variable is checked against the condition.\
    \ Finally, when the first Sunday is encountered, the variable comes out of the\
    \ loop. We then add a week to it to find the second Sunday, and output the long\
    \ date version of the value of `$MothersDay`.\n\n# Cleaning empty directories\
    \ using the Do–While construct\n\nIn the last recipe, we found the second Sunday\
    \ of May using the year as input. We used a While loop for that. The While loop\
    \ checks the condition before even starting the iteration. If the condition returns\
    \ $false at the very beginning, the loop would not even begin; for instance, if\
    \ you input the year as `2016`.\n\nDo–While is a little different; the loop is\
    \ executed once whether the condition is true or not. The condition is checked\
    \ only *after* the first iteration.\n\nThe scenario for this recipe is that we\
    \ want to delete all empty directories within a certain directory.\n\n# Getting\
    \ ready\n\nIn order to work with this recipe, let us create a few empty directories\
    \ within `$HOME/random`. Use the input file that is part of the git repository\
    \ of this book to get the directories created.\n\n```\nPS> Get-Content ./chapter-08/08-input-file.txt\
    \ | ForEach-Object { New-Item $($PSItem -replace '\\.', \"$HOME/random\") -ItemType\
    \ Directory }\n```\n\n# How to do it...\n\nIf you run the following recipe within\
    \ the `random` lab directory, all its empty subdirectories will be deleted.\n\n\
    1.  Open a new file and paste the following content into it.\n\n```\ndo {\n  \
    \  $AllDirectories = (Get-ChildItem -Path $HOME/random -Recurse -Directory).FullName\n\
    \    $EmptyDirectories = $AllDirectories | Where-Object {(Get-ChildItem $PSItem).Count\
    \ -eq 0}\n    $EmptyDirectories | Remove-Item\n} while ($EmptyDirectories.Count\
    \ -gt 0)\n```\n\n2.  Let us add some logging to it so we know what is happening.\n\
    \n```\n$Iteration = 0\ndo {\n    $AllDirectories = (Get-ChildItem -Path $HOME/random\
    \ -Recurse -Directory).FullName\n    $EmptyDirectories = $AllDirectories | Where-Object\
    \ {(Get-ChildItem $PSItem).Count -eq 0}\n    $EmptyDirectories | Remove-Item\n\
    \n    \"Iteration $Iteration. Removed the following $($EmptyDirectories.Count)\
    \ directories.\"\n    $EmptyDirectories\n    $Iteration++\n} while ($EmptyDirectories.Count\
    \ -gt 0)\n```\n\n![](Images/c622064b-ee5e-4f8c-8898-3b6fcb535608.png)\n\n# How\
    \ it works...\n\nThe execution is similar to the While construct, however, as\
    \ shown by `Iteration 0`, the Do–While construct executes the script block once\
    \ without checking the condition. In our case, we queried the empty directories\
    \ within the loop. If we had placed this query outside of the loop, we would have\
    \ had to place it within as well, for loop control. That is inefficient programming.\n\
    \nPowerShell found nine empty directories during the execution of the script block.\
    \ When the condition check happened after the execution, `9` was evaluated to\
    \ be greater than `0`. The loop ran again. This time, the value of `$EmptyDirectories.Count`\
    \ was evaluated to be `4`. The loop ran again, and this time again, the value\
    \ was `4`, greater than `0`; the condition was still `$true`. During the next\
    \ run, `$EmptyDirectories.Count` was evaluated to be `2`, then `1`, and then,\
    \ during the last run, `0`. At this time, the outcome of the condition became\
    \ `$false`, and the loop exited. Essentially, the loop statement was, 'Go on *while*\
    \ the count is *more than* zero.'\n\n# See also\n\n1.  Recipe 5.7: Taking actions\
    \ on the returned objects\n\n# Cleaning empty directories using the Do–Until construct\n\
    \nIt is easy to confuse between Do–While and Do–Until, since they both share a\
    \ lot of similarities. However, the difference between them is in fact, pretty\
    \ clear. The Do–While loop executes as long as the outcome of the condition check\
    \ is `$true`, and exits the moment it becomes `$false`. Do–Until is the opposite:\
    \ the loop continues as long as the condition check returns $false, and stops\
    \ the moment it the condition check returns `$true`.\n\nLet us use the same scenario\
    \ of cleaning up empty folders, but this time, use the Do–Until loop.\n\n# How\
    \ to do it...\n\nYou would need to rerun the command to create those empty directories.\n\
    \n1.  Open a new file and paste the following content into it.\n\n```\n$Iteration\
    \ = 0\ndo {\n    $AllDirectories = (Get-ChildItem -Path $HOME/random -Recurse\
    \ -Directory).FullName\n    $EmptyDirectories = $AllDirectories | Where-Object\
    \ {(Get-ChildItem $PSItem).Count -eq 0}\n    $EmptyDirectories | Remove-Item\n\
    \    $Count = $EmptyDirectories.Count\n\n    \"Iteration $Iteration`nRemoved the\
    \ following $Count directories. '$Count = 0' is $($Count -eq 0)\"\n    $EmptyDirectories\n\
    \    $Iteration++\n} until ($Count -eq 0)\n```\n\n2.  Notice the change in the\
    \ behaviour this time and compare it with the run of Do–While.\n\n![](Images/368f892a-96c9-4179-b2aa-56ae1c662904.png)\n\
    \n# How it works...\n\nThis time, it was made evident in the interactive output\
    \ how it works. The first run happened without checking for the condition. At\
    \ the end of the run, the condition was checked for. `9` is greater than `0`,\
    \ and not equal. The outcome was `$false`, so the loop continued. It went on this\
    \ way until the count came down to `0` (making the outcome of the condition `$true`),\
    \ at which point, the loop exited. Essentially, the loop statement was, 'Go on\
    \ *until* the count *becomes* zero.'\n\nThat concludes our chapter on flow control.\
    \ I hope that you had a nice time learning the techniques, and that this chapter\
    \ helps you with a good chunk of automation work you wish to carry out after learning\
    \ to use PowerShell.\n\n# Working with Strings\n\n*Coming soon...*\n\n# Performing\
    \ Calculations\n\nIn this chapter, we discuss the following topics:\n\n1.  Performing\
    \ arithmetic operations\n\n2.  Performing calculations on the output\n\n3.  Working\
    \ with the administrative constants\n\n4.  Working with calculated properties\n\
    \n5.  Working with binary numbers\n\n6.  Performing base conversions\n\n# Technical\
    \ Requirements\n\nHere are the technical requirements to work with this chapter.\n\
    \n1.  PowerShell installed on the computer. Refer *Installation, Reference and\
    \ Help* for steps.\n\n2.  Visual Studio Code (recommended). Refer the recipe,\
    \ *Installing Visual Studio Code* in the chapter, *Preparing for Administration\
    \ using PowerShell*.\n\n3.  Some throw-away files for the recipes. Use the script, `Initialize-PacktPs6CoreLinuxLab.ps1` from\
    \ within the `ch05` directory of the book's GitHub repository.\n\nThe scripts\
    \ used in this chapter are available at: [https://github.com/PacktPublishing/PowerShell-6.0-Linux-Administration-Cookbook/tree/master/ch09](https://github.com/PacktPublishing/PowerShell-6.0-Linux-Administration-Cookbook/tree/master/ch09).\n\
    \n# Introduction\n\nPerforming calculations is an integral part of automation.\
    \ Of course PowerShell allows for this; it also takes things up a level by providing\
    \ administrators with what is called Administrative Constants, which help ease\
    \ calculations. We will look into these concepts in the following recipes. We\
    \ will first look at common arithmetic operations, and then, move towards using\
    \ the concepts on outputs using Calculated Properties like we saw in *Passing\
    \ Objects Through the Pipeline*.\n\nWe will also look at cases where we could\
    \ ease automation using binary numbers to identify flags, perform base conversion,\
    \ and finally, use some of .NET Accelerators/cast operators to simplify scripting.\n\
    \n# Performing arithmetic operations"
