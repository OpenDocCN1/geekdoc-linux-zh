    基本上，在 Linux 中，获取源代码并使用 `make` 从源码构建应用程序应该非常简单。这种方法也适用于 PowerShell。然而，如上所述，官方支持和社区支持仅适用于少数发行版。我们将重点关注在
    `Ubuntu` 和 `CentOS` 上安装 PowerShell，因为它们是两个最受欢迎的 Linux 发行版。


    `PowerShell` 有两个版本：稳定版（stable）和预览版（preview）。稳定版适用于生产环境，因为它们更可靠。预览版适用于测试环境，管理员允许在那里进行一定的尝试，并愿意报告他们发现的
    Bug 以及对各项功能提供反馈。


    # 准备工作


    在计算机上准备安装 PowerShell 非常简单。你只需要一台拥有管理员权限且运行良好的 Linux 计算机。根据你选择的安装 PowerShell 的模式，你可能需要或不需要包管理器。很有可能，你的
    Linux 发行版已经有了包管理器。


    # 如何操作...


    正如所讨论的，我们将介绍在 `Ubuntu`（及其衍生版本）以及 `CentOS`（及其衍生版本）上安装 PowerShell 的步骤。


    # 在 Ubuntu 上安装


    在你的计算机上安装 PowerShell 的方法有很多。由于我们是在 `Ubuntu` 上安装 PowerShell，我们将介绍两种方法。第一种是添加微软的密钥并注册仓库，然后使用高级软件包工具（`APT`）安装
    PowerShell；另一种是直接使用 GitHub 上的 `.deb` 包。


    ## 从仓库安装


    PowerShell 提供官方包的最后一个 `Ubuntu` 版本是 `Ubuntu 17.04`。如果你使用的是 `Ubuntu 17.04`，请按照以下步骤安装
    PowerShell。否则，建议使用直接下载方法。


    1. 第一步导入公共仓库的 GPG 密钥：


    ```

    curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -

    ```


    2. 现在密钥已添加，请注册该仓库——该仓库由微软维护。


    ```

    sudo curl -o /etc/apt/sources.list.d/microsoft.list https://packages.microsoft.com/config/ubuntu/17.04/prod.list

    ```


    3. 使用以下命令更新包列表。


    ```

    sudo apt update

    ```


    4. 接下来，安装 PowerShell。


    ```

    sudo apt install -y powershell

    ```


    ## 通过直接下载安装


    按照以下步骤在 Ubuntu 上安装 PowerShell：


    1. 访问 [`github.com/powershell/powershell`](https://github.com/powershell/powershell)。

    2.向下滚动到包含 PowerShell 团队官方支持的 Linux 发行版列表的表格。

    3. 点击相关链接：Downloads (stable) 下的 `.deb`——我们将坚持稳定版。

    4. 如果你需要更多信息，请阅读安装说明。

    5. 使用 `gdebi`、`eddy` 或此类包安装程序运行 `.deb` 文件以完成安装。


    如果你运行的不是团队或社区官方支持的发行版之一，请使用 `AppImage`。按照上述步骤 1 和步骤 2 操作，然后：


    1. 点击 Many Linux distributions | `AppImage` 下载 `Ap-pImage` 文件。`AppImage` 文件是一个应用程序，封装了运行该程序所需的所有依赖项。

    2. 将 `AppImage` 文件保存在方便的位置。

    3. 下载完成后，导航到下载位置并运行 `AppImage`。

    4. 如果出现提示询问你是否想安装 PowerShell，请根据你的环境选择合适的响应。


    # 在 CentOS 上安装


    在 `CentOS 7`（或 `RedHat 7`）上安装 PowerShell 也有两种方法：仓库和直接下载。过程与在 Ubuntu Linux 上安装类似。


    ## 从仓库安装


    开始安装：


    1. 首先，注册微软仓库。


    ```

    curl https://packages.microsoft.com/config/rhel/7/prod.repo | sudo tee /etc/yum.repos.d/microsoft.repo

    ```


    2. 接下来，使用 `yum` 安装 PowerShell。


    ```

    sudo yum install -y powershell

    ```


    ## 通过直接下载安装


    按照以下步骤在 CentOS 上安装 PowerShell：


    1. 访问 [`github.com/powershell/powershell`](https://github.com/powershell/powershell)。

    2.向下滚动到包含 PowerShell 团队官方支持的 Linux 发行版列表的表格。

    3. 点击相关链接：Downloads (stable) 下的 `.rpm`——我们将坚持稳定版。

    4. 如果你需要更多信息，请阅读安装说明。

    5. 使用以下命令安装 RPM 包（假设你的下载位于 `~/Downloads` 且你的 `PWD` 为 `~/Downloads`）。


    ```

    sudo yum install <the-downloaded-file.rpm>

    ```


    # 使用 AppImage 包


    使用 `AppImage` 要简单得多。


    1. 访问 [`github.com/powershell/powershell`](https://github.com/powershell/powershell)。

    2. 向下滚动到 Get PowerShell 部分，在社区支持的发行版下找到 `AppImage` 链接。

    3. 下载 `AppImage` 并将其放置在方便的位置。

    4. 运行 `chmod a+x PowerShell-<version>-<architecture>.AppImage` 使 `AppImage` 可执行。

    5. 调用 `AppImage` 来运行 PowerShell。系统可能会提示你是否想在计算机上安装该 `AppImage`。如果是，请选择 Yes。


    # 工作原理...


    包管理器安装软件包及其所有依赖项，并使相关命令变得可用。


    对于 `AppImage` 包，所有依赖项都封装在包中（包括 `.NET Core`），该包可以在你的计算机上以便携模式运行，也可以被安装并调用。运行 `pwsh`
    启动 PowerShell 查看。


    # 另另


    1. 菜谱 2.5：比较 Windows PowerShell 和 PowerShell


    # 在 PowerShell 中获取帮助信息


    PowerShell 中的命令被称为 `cmdlets`（读音：command-lets）。`cmdlets` 预装了所有必要的帮助信息，就像任何 Linux
    命令提供的帮助信息一样。区别在于，有一个单独的 `cmdlet` 可用于获取所需的帮助；在 PowerShell 中，帮助不是一个开关（switch）。


    在我们开始之前，让我们启动终端（启动计算机上可用的任何终端模拟器）。现在输入 `pwsh` 来调用 PowerShell。一旦获得 PS 提示符，请继续执行下面的步骤。


    在 PowerShell 中获取帮助信息：


    在提示符处输入 `Get-Help` 以获取 PowerShell 帮助系统的概述。你会看到如下输出：


    ![](img/f608603b-ab54-460d-996d-2386db19141.png)


    PowerShell `cmdlets` 在构建时已包含了帮助信息。不带任何参数运行 `Get-Help` 将显示 PowerShell 中可用的基础信息，这并不特别。让我们看看另一个菜谱来更好地利用
    `Get-Help`。


    ## 获取特定 Cmdlet 的帮助信息


    虽然 `Get-Help` 显示关于帮助的信息，但也可以接受其他 `cmdlets` 作为参数并显示它们的帮助。让我们以 `Get-Command` 为例并获取该
    cmdlet 的帮助。


    # 如何操作...


    1. 在提示符处输入以下内容：


    ```

    Get-Help Get-Command

    ```


    2. 你将得到如下输出：


    ![](img/0f4996e6-5ed6-4bfe-a7da-c37a3cf3d03.png)


    3. 你甚至可以获取 cmdlet 的完整帮助，包括每个参数的信息；例如参数是否是位置相关的、强制性的等。我们将在使用 PowerShell 进行管理时详细查看这些内容。要获取
    cmdlet 的完整帮助，输入：


    ```

    PS> Get-Help Get-Command -Full

    ```


    4.要查看使用该 cmdlet 的示例，输入：


    ```

    PS> Get-Help Get-Command -Examples

    ```


    5.要在线阅读帮助信息，输入：


    ```

    PS> Get-Help Get-Command -Online

    ```


    '
- fmt: '

    Notice that parameters are grouped in the output under `SYNTAX`. We can see two
    such groups in this case. These groups are called `Parameter Sets`. Parameter
    sets tell us which parameters can be grouped together. Two parameters not appearing
    within the same parameter set cannot be used together.


    # How it works...


    When you run the cmdlet, `Get-Help` with another cmdlet as the argument, `Get-Help`
    fetches help information for the cmdlet that was passed as the argument; `Get-Command`
    in this case. We shall see in the later chapters how arguments are handled. For
    now, we''re simply calling the help for an arbitrary cmdlet.


    If you notice the output, you''d see the name of the cmdlet, the syntax to use
    with the cmdlet, the alias available for the cmdlet and more online help if required.
    `Full` and `Examples` are switches which tell PowerShell the level of help you
    need. These are mutually exclusive; you cannot run `-Full` and `-Examples` at
    the same time.


    # See also


    1. Recipe 2.6: Listing out the aliases and using them in place of cmdlets

    2. Recipe 1.4: Updating help

    3. Recipe 1.3: Fetching help information for a specific cmdlet (Information about
    Parameter Sets)


    # Updating Help


    Help information in PowerShell is dynamic. In most situations, PowerShell goes
    online to fetch the latest help. However, it is also possible to store the help
    files offline. This can be done using the cmdlet, `Update-Help`.


    # How to do it...


    To download the help files for the locally-installed PowerShell modules:


    1.  Type `exit` to exit PowerShell. This is so that you can relaunch PowerShell
    with elevated privileges.

    2.  Enter `sudo pwsh` to launch PowerShell as a super-user.

    3.  At the `PS` prompt, run `Update-Help`.

    4.  Wait for the update progress bar to appear. The bar will fill as the help
    files download to your computer.


    ![](Images/0475c76f-4e54-4f67-a125-cc9b7bd7f082.png)


    # How it works...


    PowerShell goes online to fetch help information every time you run the `Get-Help`
    cmdlet—the help files are not stored offline. This is primarily to ensure that
    only the latest help is referred. Besides, viewing help online also does not occupy
    space on the local computer.


    In some cases, however, it is necessary that help information be stored for offline
    access. In such situations, it would make sense to download and store the help
    files.


    One of the reasons this action requires elevated privileges is that the help information
    is stored within the shell. Therefore, non-administrators may not be able to update
    help without administrator intervention.


    # Searching Help for Keywords


    Linux administrators are very comfortable using `grep` to search for specific
    text patterns in any textual output. PowerShell, as we know, returns only `object`—PowerShell
    treats text as an object as well.


    While converting an object into text diminishes the power of PowerShell, it is
    still necessary in some scenarios. In this case, we shall look for the keyword,
    “common” in the help output.


    # How to do it...


    Let us begin the process of searching by first getting the help information for
    a cmdlet:


    1.  Launch PowerShell by entering `pwsh` at the terminal.

    2.  At the prompt, type in:


    ```

    PS> Get-Help Get-Command

    ```

    This should give you helpful information on the specified cmdlet.


    3.  Convert the output into text using the `Out-String` cmdlet along with the
    `-Stream` switch to return one string at a time rather than the whole of the help
    information as a single string. This way, we''d be able to run string matching
    more efficiently and get shorter search results.


    ```

    PS> Get-Help Get-Command | Out-String -Stream

    ```

    4.  There won''t be a noticeable difference at the moment. Add the `Select-String`
    cmdlet to perform the grep-like operation.


    ```

    PS> Get-Help Get-Command | Out-String -Stream | Select-String ''common''

    ```

    5.  This gives you an output with the exact line that has the string, ‘common’
    in it.


    ![](Images/f417912f-ba4f-4748-a45f-ce68acc26dfc.png)


    # How it works...


    At the first step, we simply get the help information for the `Get-Command` cmdlet.
    This output is an object—performing a text lookup operation is best done when
    the output is text. `Out-String` converts this output into a plain string; the
    only issue is that the whole block of text is one single string. A text lookup
    this way may not be really helpful. We use the `-String` switch to break the large
    string into smaller pieces (paragraphs in this case). Next, we use `Select-String`
    along with the keyword to select the string that contains our keyword.


    # Looking for help information specific to a parameter


    As we saw in the previous sections, PowerShell''s help output could be a little
    overwhelming. We run `Get-Help` with the `-Full` switch when we need information
    on the parameters in the cmdlet whose help information we want to access. However,
    this lists out all the parameters. What if we wanted information on only a single
    parameter?


    # Discovering Cmdlets


    So far, we saw how to get help on cmdlets. We used the `Get-Command` cmdlet as
    the example argument. We would now use `Get-Command` to discover cmdlets in PowerShell.
    `Get-Help` and `Get-Command` thus become the most important cmdlets when you need
    any help information in PowerShell.


    PowerShell is like plain English—PowerShell follows the Verb-Noun format in cmdlet
    naming, which makes the cmdlets sound like plain English commands. PowerShell
    even uses what''s known as `approved verbs`, that ensures that verbs follow a
    convention when naming cmdlets. The nouns, on the other hand, can be arbitrary.


    Most programmers would suggest learning to “think in the language”. This, combined
    with muscle memory (which helps you remember the keys on the keyboard), makes
    programming as well as scripting faster. PowerShell''s structure being like English
    helps a lot in this regard; it''s easy to think in PowerShell. For instance, if
    you would like to know the current date, all you have to say is, `Get-Date`, and
    PowerShell will print the date and time on the screen for you.


    # How to do it...


    Let us look at how to get information only about the `Noun` parameter of `Get-Help`.


    1.  Invoke PowerShell by running `pwsh` on the terminal window.

    2.  At the prompt, enter `Get-Help Get-Command` to look for basic help information
