    4.  Read the installation instructions if you need additional information.


    5.  Run the .deb file with `gdebi` or `eddy` or one such package installer to
    complete the installation.


    If you aren''t running one of the distributions supported officially by the Team
    or by the community, use the AppImage. Follow steps 1 and 2 from above, and:


