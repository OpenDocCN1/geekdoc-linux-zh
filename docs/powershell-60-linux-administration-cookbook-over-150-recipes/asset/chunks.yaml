  trans: "\n我们的大部分脚本编写和管理工作将围绕运行命令行（cmdlet）并将它们链联起来。在某些情况下，我们运行一个 cmdlet 并期望它以某种方式工作，结果发现它抛出了错误，或者更糟糕的是执行了不符合预期的操作。\n\
    \n让 cmdlet 按照我们的意运行的关键在于消除歧义。在本教程中，我们将学习如何根据上下文有效地构建命令。\n\n# 准备工作\n\n阅读第一章*安装、参考和帮助*的帮助部分。让我们理解\
    \ `Get-Help` 显示的帮助信息中所使用的符号。\n\n虽然这可能不是使用帮助的详尽指南，但它应该涵盖你大部分阅读帮助文档的需求。其目的是向你展示这些符号。这些符号可能会以多种组合出现（例如，大括号中的参数值，或者被方括号包围）。\n\
    \n| 符号 | 含义 |\n| :--- | :--- |\n| `-Parameter <DataType>` | 无方括号：命名的必选参数。必须通过名称调用参数，并且必须指定\
    \ `DataType` 类型的值。 |\n| `[-Parameter <DataType>]` | 参数-数据类型类型对周围有方括号：可选参数，尽管如此，它必须通过名称调用，并传递\
    \ `DataType` 类型的值。 |\n| `[-Parameter] <DataType>` | 参数名周围有方括号：位置参数。你只需向 cmdlet\
    \ 传递一个 `DataType` 类型的值，只要该值位于帮助文中参数所显示的位置即可。只要位置正确，不需要通过名称调用参数。 |\n| `[[-Parameter]\
    \ <DataType>]` | 参数名周围有方括号，参数-数据类型类型周围周围有另一对方括号：可选的位置参数。 |\n| `-Parameter <DataType[]>`\
    \ | 数据类型后跟着一对空方括号：多值参数。此参数接受多个值作为输入，每对值之间用逗号分隔。 |\n| `-Parameter` | 无数据类型：开关参数（Switch\
    \ parameter）。调用该参数会使开关变为 `$true`，不调用它则使用开关的默认值。要禁用开关，请将其设置为 false，例如 `-Parameter:$false`。\
    \ |\n| `-Parameter {Value1 &#124; Value2 &#124; Value3}` | 值被大括号包围：接受预定义值作为输入的参数。在这种情况下，你将像\
    \ `-Parameter Value1` 或 `-Parameter Value2` 这样调用参数。换句话之，此参数不接受任意值。 |\n\nBash 高手请注意：PowerShell\
    \ 需要在多值参数中使用逗号分隔值。因此，如果你想对三个文件调用 `Remove-Item`，你将输入 `Remove-Item file1, file2,\
    \ file3`。如果仅用空格分隔值（像 Bash 的输入一样），PowerShell 将这三个值视为三个位置参数的值，并将根据你调用的 cmdlet 抛出错误，或者执行你不希望它执行的操作。\n\
    \n通常情况下，任何被方括号包围的内容都是可选的。任何被大括号包围的内容表示预定义的参数值（管道 `|` 分隔每个值）。数据类型后跟一对空方括号表示该数据类型的数组。需要注意参数的位置。\n\
    \n注意此组合：`Required` 为 `false`，如参数名称下方文本所示有一个默认值，且位置是 `1`。这意味着你可以简单地调用 cmdlet，它将针对其第一个参数的默认值运行。这里使用的示例是\
    \ `Get-ChildItem`。\n\n# 如何操作...\n\n这是一个很长的准备工作部分。现在让我们把这些知识付诸实践。\n\n1. 运行命令获取当前位置的文件和目录列表。\n\
    \n```\nGet-ChildItem\n```\n\n2. 现在我们添加一个 `.` 来表示当前位置。\n\n```\nGet-ChildItem .\n\
    ```\n\n3. 比较最后两个命令的输出。\n\n4. 接下来，执行以下操作：\n\n```\nGet-ChildItem -Path .\n```\n\n\
    输出与最后两个命令的输出相同吗？\n\n5. 运行以下命令并记录下方每个键的值：\n\n```\nPS> Get-Help Get-ChildItem -Parameter\
    \ Path\n\n-Path <String[]>\n    指定指向一个或多个位置的路径。允许通配符。默认位置是当前目录（`.`）。\n\n    Required?\
    \                    false\n    Position?                    1\n    Default value\
    \                Current directory\n    Accept pipeline input?       True (ByPropertyName,\
    \ ByValue)\n    Accept wildcard characters?  true\n```\n\n6. 接下来，通过名称调用参数在当前位置创建一个名为\
    \ `file1` 的文件。\n\n```\nGet-Help New-Item\n\n.\n.\n.\nSYNTAX\n    New-Item [[-Path]\
    \ <String[]>] [-Confirm] [-Credential <PSCredential>] [-Force] [-ItemType <String>]\
    \ -Name <String> [-UseTransaction] [-Value <Object>] [-WhatIf] [<CommonParameters>]\n\
    \n    New-Item [-Path] <String[]> [-Confirm] [-Credential <PSCredential>] [-Force]\
    \ [-ItemType <String>] [-UseTransaction] [-Value <Object>] [-WhatIf] [<CommonParameters>]\n\
    ```\n\n7. 我们有两种选择：`Path` 和 `Name`。查找关于 `Path` 的信息。\n\n```\nPS> Get-Help New-Item\
    \ -Parameter Path\n\n-Path <String[]>\n    指定新项目位置的路径。允许通配符。\n\n    你可以在 Name\
    \ 中指定新项目的名称，或将其包含 Path 中。\n\n    Required?                    true\n    Position?\
    \                    0\n    Default value                None\n    Accept pipeline\
    \ input?       True (ByPropertyName)\n    Accept wildcard characters?  false\n\
    ```\n\n如果我们使用 `Name`，就必须通过名称调用它。如果没有，我们可以将名称作为 `Path` 的一部分。\n\n8. 让我们先使用 `Path`。“`-Path`”不需要写，因为它是一个位置参数。\n\
    \n```\nNew-Item file1\n```\n\n9. 尝试使用 `Name` 执行相同的操作。这次提到参数名称。\n\n```\nNew-Item\
    \ -Name file2\n```\n\n10. 如果你愿意，通过名称调用 `Path` 创建第三个文件。\n\n```\nNew-Item -Path\
    \ file3\n```\n\n11. 列出当前位置的内容。\n\n```\nGet-ChildItem -Path .\n```\n\n文件已经存在了。\n\
    \n12. 现在让我们删除这些文件。\n\n```\nGet-Help Remove-Item\n```\n\n13. 将文件名作为路径提到。\n\n```\n\
    Remove-Item file1\n```\n\n14. 列出目录的内容。\n\n```\nGet-ChildItem -Path .\n```\n"
- fmt: "\nwould mean that you want to move the directory, `GitHub` to `Code`. Many\
    \ PowerShell cmdlets are programmed to understand this.\n\nNamed parameters, on\
    \ the other hand, are to be called by name. Help text shows them without any brackets\
    \ surrounding them. Calling the positional parameters by name is optional—you\
    \ are allowed to simply pass the values. However, be careful with what position\
    \ or sequence you mention them in.\n\nThe best practice is to always pass parameter\
    \ values, calling them by name when writing scripts. When running quick commands,\
    \ on the other hand, you may omit calling positional parameters by name in the\
    \ interest of speed.\n\nSome parameters have predefined value validation added\
    \ to them. These parameters accept only those values that have been defined in\
    \ them. For instance, `ItemType` only accepts `File`, `Directory`, `SymbolicLink`,\
    \ `Junction` and `HardLink` as values as of writing this section.\n\nAnd then,\
    \ there are switch parameters. `Recurse` is an example. When you call these parameters\
    \ with no value, the parameters assume `True` in most cases. When you have to\
    \ set them to `False`, you mention them, `-Parameter:$false` (for example, `-Confirm:$false`).\
    \ If you do not call the switch parameter, the parameter goes with the default\
    \ value specified in the cmdlet.\n\n# There's more\n\nIf you would like to create\
    \ the files and directories again, don't run four commands. Run the following\
    \ two.\n\n```\nNew-Item test-dir/child-dir -ItemType Directory -Force\nNew-Item\
    \ ./test-dir/file1, ./test-dir/file2, ./test-dir/child-dir/file3\n```\n\nThe parameter,\
    \ `Force`, creates `test-dir` when creating `child-dir`.\n\nGo ahead and delete\
    \ the entire directory if you want to, without the `Recurse` parameter. At the\
    \ confirmation prompt, press Enter (`Y` is the default response).\n\n# Running\
    \ cmdlets with minimal keystrokes\n\nCommands have been made to be short, historically.\
    \ However, the situation turned into a dilemma over time, since shorter commands\
    \ meant that they had to be remembered, and longer commands meant more keystrokes.\n\
    \nPowerShell has long commands, however, it deals with them in two ways:\n\n1.\
    \ Aliases, which tend to be shorter.\n2. Tab completion, which require more keystrokes\
    \ than aliases, but don't require remembering much.\n\nThe first way necessitates\
    \ using our memory to recall command names as required. The second, on the other\
    \ hand, solves the keystroke issue efficiently.\n\nBash users are used to getting\
    \ a list of matches laid out in a nice tabular format when the tab key matches\
    \ more than one strings in the context. On the other hand, the matches cycle at\
    \ the cursor in Windows (which most Bash users find \"weird\").\n\nBe that as\
    \ it may, tab completion is a boon, and this recipe makes complete use of tab\
    \ completion and simple string matching to significantly reduce keystrokes when\
    \ using PowerShell cmdlets.\n\n# Getting Ready\n\nWe use the Gnome Terminal terminal\
    \ emulator for this recipe, and tab completion on PowerShell on Linux on Gnome\
    \ Terminal behaves exactly the same way that it works on Bash on Gnome Terminal:\n\
    \n* If only one word matches the string before the tab, the word is completed.\n\
    * If multiple words match the string before the tab, all possible options are\
    \ listed.\n\nIf you are using VS Code for this recipe, or a different terminal\
    \ emulator, its behaviour may be different.\n\n# How to do it...\n\nLet us get\
    \ right to it!\n\nSay, we would like to get the list of files and directories\
    \ within the current directory.\n\n1. The right way of doing this, as per best\
    \ practices would be:\n\n```\nGet-ChildItem -Path .\n```\n\n2. However, as we've\
    \ seen before, the easy way of doing this would be:\n\n```\ngci\n```\n\nWe would\
    \ use the former way when including the cmdlet in a script. This avoids ambiguity,\
    \ in most contexts that the script would run in. This usually means minimal bugs.\
    \ The latter, on the other hand, is the short way of running the same cmdlet,\
    \ by leveraging the user-friendly features of it, combined with the awareness\
    \ of the environment as an intelligent human. This approach significantly reduces\
    \ key strokes–three characters, as opposed to twenty-one.\n\nAlthough, if you\
    \ are writing a script and would like to reduce keystrokes, you could still do\
    \ it, without having to remember things such as `gpv` means `Get-ItemPropertyValue`.\n\
    \nEnter: Tab completion.\n\n3. Follow the keystrokes mentioned below:\n\n```\n\
    get-ch<Tab><Space>.\n```\n\nThose were ten keystrokes including <Enter>.\n\nThere\
    \ may be situations wherein you would need to call a named parameter. And the\
    \ named parameter might be long.\n\n4. Find a command that has `ComputerName`\
    \ as a parameter.\n\n```\nget-comm<Tab><Space>-param<Tab><Space>computername<Enter>\n\
    ```\n\nThis completes to:\n\n```\nGet-Command -Parameter computername\n```\n\n\
    ![](Images/c624b608-e1c3-4cae-91db-beeec2cef223.png)\n\nBut it throws an error.\
    \ The error says, `Possible matches include: -ParameterName -ParameterType`. This\
    \ is the caveat in PowerShell on Linux. Let us try again:\n\n```\nget-comm<Tab><Space>-param<Tab><Tab>\n\
    ```\n\n![](Images/e5f9420d-d558-4df5-957a-64e2e050e962.png)\n\n5. Read the list\
    \ of possibilities and select `ParameterName`.\n\n```\nget-comm<Tab><Space>-param<Tab>n<Tab><Space>computername<Enter>\n\
    ```\n\n6. The complete resolution of that would be:\n\n```\nGet-Command -ParameterName\
    \ computername\n```\n\nAnd it worked.\n\nNext, let us suspend the activity in\
    \ our session for, say, five seconds. The cmdlet for this would be `Start-Sleep`.\n\
    \n7. Let us first get help on the cmdlet.\n\n```\nGet-Help Start-Sleep\n```\n\n\
    The help text says that the parameter at position one, which need not be named\
    \ is `Seconds` (square brackets around Seconds in the second parameter set), and\
    \ it accepts integer values.\n\n8. Therefore, to suspend the session for five\
    \ seconds, we would use:\n\n```\nStart-Sleep 5\n```\n\n9. If we wanted the session\
    \ (or script) suspended for 100 milliseconds, we would need to use the named `Milliseconds`\
    \ parameter. With tab completion, it would be:\n\n```\nstart-s<Tab><Space>-mi<Tab>100\n\
    ```\n\nWhich would resolve to:\n\n```\nStart-Sleep -Milliseconds 100\n```\n\n\
    10. You can, in fact, reduce the number of tabs when using parameter names. Just\
    \ type enough for PowerShell to uniquely identify the parameter name:\n\n```\n\
    start-s<Tab><Space>-m<Space>100\n```\n\nWhich would resolve to:\n\n```\nStart-Sleep\
    \ -m 100\n```\n\nIf the delay was not noticeable, feel free to increase the number\
    \ a little (say, 3000).\n\n# How it works...\n\nWe have already seen how to use\
    \ aliases. Aliases work just like normal cmdlets, including the syntax of their\
    \ parameters. The only catch is that we have to remember the aliases. Custom aliases,\
    \ as shall see in the best practices section, are a bad idea given that the aliases\
    \ have to be imported everywhere we want to run scripts that have custom aliases.\
    \ \n\nTab completion on the other hand, reduces the number of keystrokes, but\
    \ requires muscle memory. It requires some level of practice, given which, significantly\
    \ improves productivity. \n\nTab completion works when writing cmdlets, writing\
    \ parameter names, as well as when passing pre-defined values to parameters, such\
    \ as:  \n\n```\nset-exec<Tab><Space>-exec<Tab><Space>unre<Tab> \n```\n\nWhich\
    \ completes to: \n\n```\nSet-ExecutionPolicy -ExecutionPolicy Unrestricted \n\
    ```\n\nIn many situations, it is not necessary to use tab completion at all, for\
    \ instance, in the case of `Start-Sleep`. There is no parameter that starts with\
    \ `m` in case of the cmdlet. Therefore, using `-m` was sufficient for PowerShell\
    \ to uniquely identify `-Milliseconds`. That saved us the `<Tab>` keystroke as\
    \ well. \n\nProductivity with respect to writing scripts in PowerShell is a skill\
    \ that comes with practice. While aliases sure are a shortcut to speed, they have\
    \ their perils. On the other hand, using the keyboard to write scripts helps with\
    \ muscle memory, which not only helps us think in PowerShell, it also helps speeding\
    \ up tab completion, which works equally well when running commands at the console,\
    \ or writing scripts.\n"
