    In this recipe, we set out to understand the similarities between Bash and PowerShell.
    In spite of being fundamentally different from Bash, PowerShell does pack some
    similarities to Bash. Two of the similarities, as we saw, are passing content
    to files and appending content to the files.


    We looked at three cmdlets in this recipe, one of which were used twice.


    ## Out-File


    Those comfortable with Bash use the `>` for sending the output to a file, and
    `>>` to append the output to an existing file. in PowerShell, we use the `Out-File`
    cmdlet. We run a command that sends output to the standard out, and through the
    pipe, redirect the output to `Out-File`, which handles writing the output to a
    file. Usually, `Out-File` is used to send content to a text file.


    When there is a need to append the content to a file, we use the `-Append` switch
    with `Out-File`. This way, if the file that is being written to already contains
    content, the content isn''t overwritten (overwriting content is the default behaviour
    of `Out-File`).


    ## Tee-Object


    There are situations wherein you need to send content to a file, as well as display
    the content on the console. This is handled using a simple call of `Tee-Object`.
    `Tee-Object` works like the letter T; apart from sending content to a file or
    a variable, it also sends the content down the pipeline. In case `Tee-Object`
    is the last cmdlet in the statement, the pipeline output is sent out to standard
    out, which in most cases is the host (or in other words, the console by default).


    In our recipe, we sent the first output to the file, `processes.txt`, and the
    second output was not sent down the pipeline. Therefore, `Tee-Object` picked the
    standard out.


    ## Accepting input from file


    This process is significantly different in PowerShell, compared to Bash. In Bash,
    we call the command first, and then ask it to accept input from a file. In PowerShell,
    we make PowerShell read the contents of the input file first, and then send the
    output to the command that accepts input through the pipeline.


    In our recipe, we read the contents of the file, `input.txt`, which contained
    a list of four file names. We used `Get-Content` to read the content from the
    file. `Get-Content` sent the output to the standard out at first, thereby showing
    us the contents of the file. We then added a pipe to tell PowerShell that we need
    further processing, and then, added `Remove-Item` to the command chain. (`Remove-Item`
    deletes items, which could be directories, files or links.)


    As we would see later in this chapter, the first parameter (positional parameter,
    position 1) of `Remove-Item` is `Path`, which is also the parameter that accepts
    input through the pipeline. For more information, run the following command and
    read about the `Path` parameter of `Remove-Item`.


    ```

    PS> Get-Help Remove-Item -Parameter Path

    ```


    ![](Images/b1fcf9d5-5153-4ba2-a432-5bbcb8028f80.png)


    ## There''s more...


    Clean up the contents that we created for this recipe if you are the type that
    likes directories clean! If we need more files or directories in later recipes,
    we will create them as needed.


    ## See also


    1.  Recipe 3.8: Understanding cmdlets and parameters


    2.  Recipe 1.6: Looking for help information specific to a parameter


    ## Calling native Linux commands from PowerShell


    In the chapter, *Introducing the Core and its Capabilities*, we saw how native
    Linux commands were not convenience aliases in PowerShell on Linux, but the commands
    themselves. In this recipe, we would demonstrate using Linux commands at the PowerShell
    prompt. Remember how we used a Bash terminal to run the commands `ls -l` and `awk`
    to list the contents of a directory, and separate the columns in the output, in
    the recipe, *Comparing the outputs of Bash and PowerShell*. We will perform the
    same operation on the home directory, from with PowerShell, without using any
    of the PowerShell cmdlets.


    ## Getting started


    It is recommended that you have a Windows PC with PowerShell installed on it (Windows
    PowerShell would also do) in order to compare the outputs and see if we encounter
    any errors.


    ## How to do it...


    1.  At the PowerShell prompt, type in the following command to list the contents
    of the directory.


    ```

    PS> ls -l

    ```


    You see the familiar output (albeit without any of the colours, if your terminal
    emulator uses colours for file names).


    2.  Let us now look at the .NET Type Name of the output. For this, we would need
    to use the `Get-Member` cmdlet.


    ```

    PS> ls -l | Get-Member

    ```


    PowerShell displays, `TypeName: System.String`, which is consistent with what
    we saw in the aforementioned recipe.


    3.  If you have a Windows PC with PowerShell (or Windows PowerShell), run the
    same command on it.


    ```

    PS> ls -l | Get-Member

    ```


    Notice the .NET Type Name here; it is `System.IO.DirectoryInfo`, and if you scroll
    down the console a little, you would also see `System.IO.FileInfo`.


    4.  Next, at the PowerShell on Windows (or Windows PowerShell) prompt, type:


    ```

    PS> ls -l

    ```


    You would receive an error, stating that there was no value given to the parameter,
    `LiteralPath`.


    ![](Images/d565f397-477e-4b86-9518-f45d18ed8ab4.png)


    5.  At the PowerShell prompt on the Windows PC, enter the following and press
    the Tab key on your keyboard, instead of Enter.


    ```

    PS> ls -l

    ```


    You would see that the parameter name was completed to `LiteralPath`.


    6.  Press the Esc key to clear the command line.


    7.  Come back to Linux, and at the PowerShell prompt, type in the following and
    press the Tab key:


    ```

    PS> ls -l

    ```


    8.  Nothing happens. Now, enter the following and press the Tab key:


    ```

    PS> Get-ChildItem -l

    ```


    The parameter name was completed to `-LiteralPath`. Let us take one more step
    and conclude this recipe.


    9.  At the PowerShell prompt on Windows, run the following command.


    ```

    PS> Get-Alias ls

    ```


    ![](Images/91a6d14f-bbab-406c-8212-2285ff34399e.png)


    10. Switch back to Linux and run the same command.


    ```

    PS> Get-Alias ls

    ```


    You receive an error stating there is no such alias.


    ![](Images/75f2ffac-79de-4a70-af27-a3f0ade4b63.png)


    ## How it works...


    When we run any of the Linux commands on PowerShell on Linux, PowerShell does
    not call the convenience aliases that were created for the benefit of Linux administrators,
    when Windows PowerShell was launched; these convenience aliases have not been
    included in PowerShell on Linux. PowerShell, instead, runs the actual commands
    and shows the output on the console. Piping the output to other Linux commands
    work the same way as they do on Bash, when running them on PowerShell on Linux.


    The first point to note is that `ls -l` is an actual command in Linux, and it
    returns the list of files and directories in the current directory, in a table
    format. When the same command is run on PowerShell on Windows, we receive an error,
    since PowerShell on Windows interprets `ls` as `Get-ChildItem`, and `-l` as the
    incomplete-but-definitive call to `-LiteralPath` and returns an error that the
    literal path was not specified.


    When we run `Get-Alias` on `ls` on both the operating systems, PowerShell on Linux
    returns an error, while PowerShell on Windows shows the underlying PowerShell
    cmdlet.


    The other point that pins down this fact is that the output of `ls` is string,
    as opposed to a system object, when the same `ls` is run on PowerShell on Windows.
    On Windows, PowerShell calls `Get-ChildItem` under the hood, and the output shown
    is that of `Get-ChildItem`. This is supported by the type name in the output of
    `Get-Member`, which is from the `System.IO` namespace. On the other hand, on Linux,
    running `Get-Member` on the output of `ls` simply returns `System.String`.

