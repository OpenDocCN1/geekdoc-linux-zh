    # What this book covers


    [Chapter 1](#b814b90c-1b8c-4ce8-bb04-1fc5a1ecad47.xhtml), *Installation, Reference
    and Help*, introduces the administrators to what `.NET Core` is, what its capabilities
    are, how it’s been implemented in Linux, and proceeds to introduce PowerShell.
    The chapter contains information on the history of PowerShell, how it is implemented
    on Unix-like systems, and how it differs from the currently-available shells.


    [Chapter 2](#3f96cc43-1cb0-4c3c-8c3d-bded816886fe.xhtml), *Introducing the Core
    and its Capabilities*, takes the reader through how to install PowerShell, get
    around the documentation, search for information, discover cmdlets, and attach
    modules and providers to extend the capabilities of PowerShell.


    [Chapter 3](#64bf6673-e6a4-45af-bbf5-79c92f40f8df.xhtml), *Preparing for Administration
    using PowerShell*, prerequisites to efficient administration is a comfortable
    workspace. In this chapter, we customize our `Terminal`, learn how PowerShell
    behaves, and learn to think in PowerShell along with the various ways to use the
    cmdlets.


    [Chapter 4](#0b85b7b3-7cbf-4e9d-a5c1-cb7b00fb7d54.xhtml), *First Steps in Administration
    using PowerShell*, knows how PowerShell behaves, we start with basic utilities
    in PowerShell in this chapter, such as fetching the date and counting the returned
    objects. We work with processes and learn how to schedule them with the implementation
    of `crontab` in PowerShell.


    [Chapter 5](#beccee73-7f30-4673-b1c9-919cf65971b6.xhtml), *Passing data through
    pipelines*, introduces the readers to use pipelines to leverage object-oriented
    model of PowerShell.


    [Chapter 6](#83a80abd-5927-4e83-b31a-9a46e4725787.xhtml), *Using Variables and
    Objects*,takes the reader through defining and using variables effectively in
    scripts. Also, the chapter takes a deep dive into the objects returned by PowerShell
    cmdlets.


    [Chapter 7](#bc6c5353-e3b1-4bcd-95e7-68d8b79f7ae.xhtml), *Flow Control using Branches
    and Loops*,takes the reader through building a logic that uses branching and looping,
    as the basic logical building blocks of scripts and functions.


    [Chapter 8](#20d73393-b166-4857-bf13-d153475e34cd.xhtml), *Working with Strings*,
    takes the readers through using them to the benefit of administrators.


    [Chapter 9](#123e435d-0211-41ba-ba34-bb07d99bdb06.xhtml), *Performing Calculations*,
    would help the reader perform mathematical calculations within PowerShell.


    [Chapter 10](#a86f9b5f-4098-4136-a57a-ef0c923ed0de.xhtml), *Using Arrays and Hash
    Tables*, gives the user a good understanding of how arrays and hash tables work
    in PowerShell and how to use them.


    [Chapter 11](#00667dfe-b91d-40ac-88b4-146256e6deef.xhtml), *Handling Files and
    Directories*, would take the reader through all that they need to know on file
    handling using PowerShell.


    [Chapter 12](#d7e18544-bf52-4156-8f8e-fb676042f74a.xhtml), *Building Scripts and
    Functions*, takes the user through creating scripts as a means of code reuse.
    Apart from writing a series of instructions to run scripts without interactions,
    the chapter takes the interactive scripts approach to enable better flexibility.
    Functions are a better way of leveraging PowerShell''s potential in code reuse.
    This chapter also introduces the concept of functions as a step further from merely
    writing scripts.


    [Chapter 13](#facd6558-bdb2-4cde-baae-a51c0c24fbe3.xhtml), *Advanced Concepts
    of Functions*, shows the next step in the process of building functions, and packs
    the advanced capabilities that help build production-ready functions that have
    all functionalities of a cmdlet, such as parameter sets and complete help.


    [Chapter 14](#8c3c5fbb-9a67-44c0-bebb-e3dd4f1796f7.xhtml), *Getting Under the
    Hood: Debugging and Error Handling*, takes the readers through the various options
    available, that help scripters and administrators create reliable scripts. This
    chapter also introduces the reader to the different types of errors, reading errors
    in PowerShell, and handling them gracefully.


    [Chapter 15](#f90cd558-5b45-4dfa-b604-6962e325c4cd.xhtml), *Working with the Environment*,
    introduces the reader to how PowerShell handles the environment. The reader would
    learn to use the environment variables, know how a command was invoked, and other
    important aspects that would make using PowerShell easier.


    [Chapter 16](#9ab58466-c69b-427b-9f6a-11264677eccd.xhtml), *Security in PowerShell*,
    introduces the reader to the security features available in PowerShell, and how
    to turn them on and off.


    [Chapter 17](#e67171c1-a22d-47d8-bfcd-effcd89f154a.xhtml), *Enterprise Administration
    using PowerShell*,en the reader to tap into the power of PowerShell and start
    managing computers in an enterprise using PowerShell.


    [Chapter 18](#455c7d93-81c3-416b-98bc-039ed38c1a3a.xhtml), *Best Practices Round-up*,
    the best practices are re-iterated so as to ensure that the reader remembers them,
    along with explanations to why they’re considered best practices.


    [Chapter 19](#a164ee68-8be4-4c1b-9e98-db9d875106e1.xhtml), *PowerShell and Cloud
    Operations*, moves away from on-premises environments to see how we can administer
    Azure and AWS cloud platforms using the available options.


    [Chapter 20](#447dd099-2243-49f9-a9c1-b3fbcdc94f77.xhtml), *Using PowerShell for
    SQL Database Management*, designes to teach you the fundamentals of using PowerShell
    to manage your SQL Servers, as well as perform development activities on them.
    It includes the installation and configuration procedures and also covers some
    basic database administration tasks using SMO libraries in PowerShell.


    # Table of Contents


    # Preface


    PowerShell 6.0 Linux Administration Cookbook will take you through a complete
    tour of understanding `.NET Core`, PowerShell in general, PowerShell on Linux
    for management and automation. This book will also cover advanced concepts on
    how to use PowerShell and manage Docker containers, Cloud, VMware and SQL databases.


    # Installation, Reference and Help


    In this chapter we''re going to cover the following recipes:


    1. Installing PowerShell

    2. Fetching help information in PowerShell

    3. Fetching help information for a specific cmdlet

    4. Updating help

    5. Searching help for keywords

    6. Looking for help information specific to a parameter

    7. Exploring the `about_` topics

    8. Discovering cmdlets

    9. Finding modules

    10. Installing modules from the repository

    11. Listing the various providers in PowerShell


    # Introduction


    It all begins with the installation of PowerShell on your system. Installation
    of PowerShell is simple and straightforward. Since PowerShell is open source,
    its source code is available on the arguably largest platform for open source
    projects, GitHub. At the moment, Windows, Debian (and Ubuntu), RedHat Linux (and
    CentOS), Fedora and macOS are officially supported by the PowerShell project.
    Arch Linux and Kali Linux are supported by the community. Community support is
    also available for the AppImage edition of PowerShell that can be used on most
    of the modern-day Linux distributions.


    An AppImage is a way of packaging applications to run on Linux distributions.
    Every application has its dependencies. On Linux, the package managers manage
    the installation of the dependencies while installing the packages. An AppImage
    package, on the other hand, packs all the necessary dependencies within itself.
    An AppImage can run in portable mode, or be installed on the system, based on
    user preference.


    PowerShell is, as of writing of this chapter, experimentally available for Windows
    on ARM and Raspbian Stretch.

