  trans: "\n\n# 工作原理...\n\n`Get-Process` 默认不会显示进程所有者信息。在某些情况下，可能需要这些信息。在这个简单的配方中，我们使用帮助文档来获取所有参数，并使用\
    \ `IncludeUserName` 切换参数来获取进程所有者信息。\n\n在下一步，我们过滤掉由特定用户启动的进程，然后统计进程数量。我们也使用 `Measure-Object`\
    \ 执行了相同的操作，并发现输出是相同的。`Measure-Object` 的名称中包含“object”，但它也可以处理由 `grep` 输出的文本。与此同时，在下一步中它提示\
    \ `Property` 的值无效。\n\n`Measure-Object` 在计数时有效的原因，在于它之前的的前一个步骤。我们知道，如果输出的是数组，PowerShell\
    \ 可以计算数组中的元素个数。`Measure-Object` 同样具备这种能力：测量字符串数组中可以测量的内容——`Count` 适用于字符串数组。\n\n\
    然而，当我们尝试获取总工作集（working set）时，`Measure-Object` 无法无法提供结果。原因是正如我们之前看到的，`grep` 的输出是纯文本。\n\
    \n```\nPS> Get-Process -IncludeUserName | grep ram | Get-Member\n```\n\n# 更多内容...\n\
    \n也许是提前了几几个步骤，但如果我们仍然想从 `grep` 的输出中获取那些工作集信息呢？简单的挑战，接受了。\n\n```\nPS> Get-Process\
    \ -IncludeUserName | grep ram | awk '{print $1}' | ForEach-Object {[Double]$_}\
    \ | Measure-Object -Sum\n```\n\n![](img/a7449853-658a-4dc1-bb60-82cb93f4e8f3.png)\n\
    \n现在不要过度担心它是如何工作的。一旦我们阅读并理解了如何遍历可用元素，我们就能更好地理解是如何实现这一效果的。目前，只需理解我们使用 `Double`\
    \ 类型加速器将每个返回的字符串转换成了 `double` 值。然后，我们执行了 `Measure-Object` 并找到了总和。\n\n当然，如果只用 PowerShell，这将简单得多。\n\
    \n# 另另\n\n1.  配方 2.4：比较 Bash 和 PowerShell 的输出。\n\n# 根据文件类型调用应用程序\n\n到目前为止，我们已经看到如何使用\
    \ `Start-Process` 来启动应用程序。这在很多情况下涉及启动应用程序，并从该应用程序通过该程序打开你想要处理的文件。在这个配方中，我们将利用文件关联的概念以及适当的调用命令项（cmdlet）来启动应用程序。事实上，我们将更更远一点。\n\
    \n# 如何操作...\n\n从网上下载几张图片来完成此配方。它们可以是任何图片，只需确保它们都是同一种文件类型。\n\n1.  导航到保存图像文件的位置。\n\
    \n2.  在提示符处，输入以下命令来打开你的图片查看器以及文件。\n\n```\nPS> Invoke-Item -Path *.png\n```\n\n\
    3.  现在，在相同位置创建一个文本文件。\n\n```\nPS> New-Item file-1.txt -ItemType File\n```\n\n\
    4.  现在，在各自的应用程序中调用所有文件。\n\n```\nPS> Invoke-Item *\n```\n\n# 工作原理...\n\n在配方 *从\
    \ PowerShell 外部调用 PowerShell 命令项* 中，我们通过首先调用 PowerShell 然后将脚本作为参数传递给 `pwsh` 命令从\
    \ Bash 调用了 PowerShell 脚本。在 PowerShell 中的过程非常相似，正如 *启动和停止进程* 所示。\n\n`Invoke-Item`\
    \ 模块依赖于内部文件关联来打开文件。`Invoke-Item` 的实际用途是在打开多个文件时，无论是相同类型的文件，还是同一路径下不同类型的文件（使用处理它们的相应应用程序）。\n\
    \n# 安装 Crontab PowerShell 模块\n\n在这个配方中，我们将讨论一个 PowerShell 模块的安装细节，用于在 Linux 机器使用\
    \ PowerShell 管理 Cron 任务。\n\n有时需要执行管理任务或调度脚本在指定时间自动执行。Linux 发行版默认带有一个名为 Crontab\
    \ 的调度实用，它允许任何给定任务在指定时间在后台自动运行。Cron 是一个基于时间的调度器程序。它根据 `crontab` 文件中的定义生成事件。\n\n\
    # 如何操作...\n\nPowerShell crontab 封装模块尚未在 PowerShell 仓库中。你必须手动下载文件来安装该模块。最简单的方法是克隆\
    \ PowerShell 仓库并从其 `demos` 目录内部安装该模块。\n\n如果你只想安装 CronTab 模块，请手动下载 `<repo>/demos/crontab`\
    \ 目录。然后，以超级用户身份启动 PowerShell，导航到 `crontab`。从第 4 步继续。\n\n1.  在你的计算机上克隆 PowerShell\
    \ 仓库。\n\n```\n$ mkdir ~/code\n$ git clone https://github.com/PowerShell/PowerShell.git\n\
    ```\n\n2.  以超级用户身份启动 `pwsh`。\n\n3.  进入仓库内的 `demos/crontab/CronTab` 目录。这是放置模块清单的地方。\n\
    \n```\nPS> Set-Location ~/code/PowerShell/demos/crontab\n```\n\n4.  在模块清单上使用 `Import-Module`\
    \ 命令项来导入模块。\n\n```\nPS> Import-Module -Name ./CronTab/CronTab.psd1\n```\n\n5.\
    \  使用 `Get-Module` 命令项列出 CronTab 模块的组件。\n\n```\nPS> Get-Module -Name CronTab |\
    \ Format-List\nName : CronTab\nPath : /home/PacktPub/CronTab.psm1\nDescription\
    \ : \nModuleType : Script\nVersion : 0.0\nNestedModules : {}\nExportedFunctions\
    \ : {ConvertTo-CronJob, Get-CronJob, Get-CronTab, Get-CronTabUser...}\nExportedCmdlets\
    \ : \nExportedVariables : \nExportedAliases : \n```\n\n6.  使用 `Get-Command` 命令项列出\
    \ `CronTab` 模块可用命令类型。\n\n```\nPS> Get-Command -Module CronTab  \nCommandType Name\
    \ Version Source\n----------- ---- ------- ------\nFunction ConvertTo-CronJob\
    \ 0.0 CronTab\nFunction Get-CronJob 0.0 CronTab\nFunction Get-CronTab 0.0 CronTab\n\
    Function Get-CronTabUser 0.0 CronTab\nFunction Import-CronTab 0.0 CronTab\nFunction\
    \ Invoke-CronTab 0.0 CronTab\nFunction New-CronJob 0.0 CronTab\nFunction Remove-CronJob\
    \ 0.0 CronTab\n```\n\n# 工作原理...\n\n当你下载 CronTab 模块时，以下文件将从配方提到的 URL 复制到 CronTab\
    \ 文件夹，这些文件包含了模块数据。\n\n1.  CronTab.ps1xml\n2.  CronTab.psd1\n3.  CronTab.psm1\n\
    \n`Import-Module` 命令项将模块中可用的命令项注册到 PowerShell 会话中，并使模块准备好使用。`Import-Module` 命令项针对模块清单（即\
    \ `psd1` 文件）运行。\n\n当你你运行 `Get-Command` 命令项时，你会获得模块中所有可用命令项的列表。\n\n# 在 PowerShell\
    \ 中调度任务\n\n在这个配方中，我们将看到如何使用 PowerShell 命令项来调度任务。\n\n# 准备工作\n\n1.  使用 SU 权限登录终端。\n\
    \n2.  使用 `pwsh` 命令打开 PowerShell 控制台。\n\n3.  导入模块（参考配方：安装 Crontab 模块）。\n\n# 如何操作...\n\
    \n1.  首先，在终端中检查想要调度的命令或脚本是否存在。\n\n```\n$ pwsh -f \"/tmp/DataLoading.PS1;\"\n```\n\
    \n2.  要根据调度运行脚本，使用 `New-CronJob` 命令项。\n\n```\nPS> New-CronJob -Command 'pwsh -f\
    \ \"/tmp/DataLoading.PS1;\"' -Minute 0,15,30,45 | Out-Host\n\nPS> New-CronJob\
    \ -Command 'pwsh -f \"/tmp/DataLoading.PS1;\"' -Minute */15 | Out-Host\n\nPS>\
    \ New-CronJob -Command 'pwsh -f \"/tmp/DataLoading.PS1;\"' -Minute */15 -Hour\
    \ 10-12 | Out-Host \n\nPS> New-CronJob -Command 'rm -rf /tmp/clr*' -Minute 15\
    \ -Hour 1 | Out-Host \n\nPS> New-CronJob -Command 'pwsh -f \"/tmp/DataLoading.PS1;\"\
    ' -Minute */15 -Hour 10-12 -DayOfWeek sun,tue,fri -Month Jan,Mar,Jun,Sep,Dec |\
    \ Out-Host\n```\n\n3.  要获取当前调度的任务列表，运行 `Get-CronJob` 命令项。\n\n"
- fmt: "\n```\nPS /home/PacktPub> Get-CronJob |Format-Table -AutoSize \nMinute Hour\
    \ DayOfMonth Month DayOfWeek Command\n------ ---- ---------- ----- --------- -------\n\
    2 * * * * python ./pythonexmaple.py\n5 1 * * * rm -rf /tmp/clr*.*\n15 * * * *\
    \ /usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\n*/15 * * * * /usr/bin/pwsh\
    \ -c \"cd /tmp/; ./DataLoading.PS1;\"\n0,15,30,45 * * * * /usr/bin/pwsh -c \"\
    cd /tmp/; ./DataLoading.PS1;\"\n*/15 10-12 * * * /usr/bin/pwsh -c \"cd /tmp/;\
    \ ./DataLoading.PS1;\"\n*/15 10-12 * Jan,Mar sun,tue,fri /usr/bin/pwsh -c \"cd\
    \ /tmp/; ./DataLoading.PS1;\"\n```\n\n4. To view the contents of scheduled jobs\
    \ in the crontab configuration file, use `Get-CronTab`. \n\n```\nPS > Get-CronTab\
    \ \n2 * * * * python ./pythonexmaple.py\n5 1 * * * rm -rf /tmp/clr*.*\n*/15 *\
    \ * * * /usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\n0,15,30,45 * * * *\
    \ /usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\n*/15 10-12 * * * /usr/bin/pwsh\
    \ -c \"cd /tmp/; ./DataLoading.PS1;\"\n*/15 10-12 * Jan, Mar, Jun, Sep, Dec sun,\
    \ tue, fri /usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\n```\n\n# How it\
    \ works...\n\nThe PowerShell implementation of `crontab` is technically a wrapper,\
    \ which encapsulates the `crontab` commands that work in Linux. Why use PowerShell\
    \ to schedule jobs if the underlying functions are that of `crontab`? The reason\
    \ would be the uniformity of usage, the consistency and the object-oriented approach.\
    \ If you know to use PowerShell, that is all you need in order to be able to use\
    \ `crontab` as well. That is the goal.\n\nThe `New-CronTab` cmdlet is used to\
    \ define new tasks. The parameters available define the frequency with which the\
    \ tasks are to be executed. The `Cron` jobs are executed with the same privileges\
    \ as with which the `New-CronTab` cmdlet was executed. In other words, if you\
    \ launched PowerShell as a super-user and ran `New-CronTab` to define a schedule,\
    \ the commands that would be run on the specified schedule would be run with super-user\
    \ privileges.\n\nIn the steps, the command to run is listed using the `-Command`\
    \ parameter.\n\nLet us also look in brief how what inputs the `New-CronTab` accepts.\
    \ There are two ways to run a command every 15 minutes: The first is where each\
    \ minute is specified:\n\n```\n0,15,30,45 * * * * /path/command\n```\n\nAlternatively,\
    \ you can simplify the same to `*/15`.\n\n```\n*/15 * * * * /path/command\n```\n\
    \nRange can also be specified for scheduling a job. In our example, the job runs\
    \ at 10 A.M, 11 A.M and 12 P.M hours using the range option.\n\n```\n*/15 10-12\
    \ * * * /path/command\n```\n\nIn the last example, (the Names format), the job\
    \ is scheduled to run using the `DayOfweek` (Sun, Tue, Fri) and `Month` (Jan,\
    \ Mar) parameters.\n\n```\n*/15       10-12 *          Jan,Mar sun,tue,fri /usr/bin/pwsh\
    \ -c \"cd /tmp/; ./DataLoading.PS1;\"\n```\n\nThe Cron Table configuration is\
    \ read using `Get-CronTab` cmdlet. Each line represents a record of metadata about\
    \ the scheduled job; it specifies the frequency and the command/script that should\
    \ be executed.\n\nThe caveat as of now is that if you setup Cron jobs incorrectly\
    \ they appear to silently fail. Cron has its own reserved `syslog` facility, so\
    \ you should have a look at the `/etc/syslog.conf` file (or the equivalent file\
    \ in your Linux distro) to see where messages from `cron` are sent. The common\
    \ destinations include `/var/log/cron`, `/var/log/messages` and `/var/log/syslog`.\n\
    \n# Removing the jobs in PowerShell\n\nIn this recipe, we're going to see the\
    \ steps to remove the entries from the CronTab file.\n\n# How to do it...\n\n\
    That we have created entries into the `cron` configuration file, let us attempt\
    \ to remove those entries.\n\n1. List the jobs using the `Get-CronJob` cmdlet.\
    \ This will get you the list of jobs that are created by reading the `CronTab`\
    \ file.\n\n```\nPS> Get-CronJob | Format-Table -AutoSize\n```\n\n2. Now, apply\
    \ a conditional logic to segregate the required job entries using the `Where-Object`\
    \ clause. You will read more about this in the chapter, *Passing Data Through\
    \ Pipelines*.\n\n```\nPS > Get-CronJob | Where-Object {$_.Month -match 'Jan'}\
    \ | Format-Table -AutoSize \n\nMinute Hour DayOfMonth Month DayOfWeek Command\n\
    ------ ---- ---------- ----- --------- -------\n*/15 10-12 * Jan,Mar,Jun,Sep,Dec\
    \ sun,tue,fri /usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\n*/15 10-12 *\
    \ Jan,Mar sun,tue,fri /usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\n```\n\
    \n4. Remove the entries using `Remove-CronJob`.\n\n```\nPS > Get-CronJob | Where-Object\
    \ {$_.Month -match 'Jan'} | Remove-CronJob \n\nConfirm\nAre you sure you want\
    \ to perform this action?\nPerforming the operation \"Remove\" on target \"/usr/bin/pwsh\
    \ -c \"cd /tmp/; ./DataLoading.PS1;\"\".\n[Y] Yes [A] Yes to All [N] No [L] No\
    \ to All [S] Suspend [?] Help (default is \"Y\"): Y\n\nConfirm\nAre you sure you\
    \ want to perform this action?\nPerforming the operation \"Remove\" on target\
    \ \"/usr/bin/pwsh -c \"cd /tmp/; ./DataLoading.PS1;\"\".\n[Y] Yes [A] Yes to All\
    \ [N] No [L] No to All [S] Suspend [?] Help (default is \"Y\"): Y\n```\nPS /home/PacktPub>\n"
