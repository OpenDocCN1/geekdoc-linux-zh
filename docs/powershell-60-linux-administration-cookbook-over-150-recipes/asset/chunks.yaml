    Ms Sanders,B-17\nMr Shah,M-22\nMr Hugo,E-08\n'@ | Out-File -Path './chapter-08/05-Write-GuestSeatDetails.csv'\n\
    ```\n\n2. Open a new PowerShell file in Visual Studio Code and type the following\
