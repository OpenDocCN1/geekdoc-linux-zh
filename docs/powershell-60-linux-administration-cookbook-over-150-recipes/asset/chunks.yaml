    \ what their parameters are, how to set and use aliases, etc. In this chapter,\
    \ we would learn how to use some basic utilities, work with processes, and call\
    \ applications.\n\nAlso, even though the title of the book says Linux, most of\
    \ the recipes in the book should work on Windows as well (especially PowerShell\
    \ 6.0 on Windows); minor modifications may be required, such as using the backslash\
    \ in paths.\n\n# Working with date properties\n\nPowerShell is best learnt, starting\
    \ with simple cmdlets. And `Get-Date` is one of the simplest-yet-not-completely-leveraged\
    \ cmdlets present in PowerShell. In this recipe, we shall play with dates and\
