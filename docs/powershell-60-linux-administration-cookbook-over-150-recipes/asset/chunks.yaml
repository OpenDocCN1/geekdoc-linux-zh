- fmt: '

    Understanding pipelines is not so much of a requirement if you plan to use PowerShell
    for only running commands on the console; it is well encapsulated, and the `cmdlets`
    are well designed to be able to handle passing objects between `cmdlets`. However,
    if you plan to create custom functions and modules, the concept of the pipeline
    is something you would want to understand well.


    In this recipe, we will look into the two ways `cmdlets` accept input. At the
    point where we create functions, we will look at how to enable pipeline input
    for parameters.


    # How to do it...


    We will mostly use the help documentation to demonstrate the two different kinds
    of pipeline input.


    1. At the prompt, type the following command:


    ```

    PS> Get-Help Get-Item -Parameter Path

    ```


    ![](Images/ece35564-34f0-4beb-a575-83b29dc0208e.png)


    It says the parameter accepts string input, and accepts input by property name
    as well as by value.


    2. Type the following to see if a valid string is accepted.


    ```

    PS> ''/home/ram/random'' | Get-Item

    ```


    ![](Images/2f9fadc6-7b06-4d05-a0f3-3232e4d88ab8.png)


    3. Let us try something similar with `Get-Date`.


    ```

    PS> Get-Help Get-Date -Parameter *

    ```


    The `Date` parameter accepts values through the pipeline. However, the type is
    `DateTime`, and not string.


    4. Try sending a valid string through the pipeline to see if it gets converted
    into date.


    ```

    PS> ''21 June 2018'' |  Get-Date

    ```


    It did convert the string into date and time.


    ![](Images/9bf14887-e102-4518-aba5-ef0f00939e1d.png)


    5. Now, let us go back to getting details of the current directory. This time,
    however, we would pick only the `FullName` property of the object.


    ```

    PS> Get-Item . | Select-Object FullName

    ```


    6. Pass this through the pipeline to the `Get-ChildItem` cmdlet.


    ```

    PS> Get-Item . | Select-Object FullName | Get-ChildItem

    ```


    There is an error.


    ![](Images/4b9eb33e-158a-47c3-91fa-81c8373590b4.png)


    7. Change the property name to `LiteralPath`.


    ```

    PS> Get-Item . | Select-Object @{Name = ''LiteralPath''; Expression = {$_.FullName}}

    ```


    8. Pass the object to `Get-ChildItem` through the pipeline.


    ```

    PS> Get-Item . | Select-Object @{Name = ''LiteralPath''; Expression = {$_.FullName}}
    | Get-ChildItem

    ```


    That worked.


    # How it works...


    There are two kinds of input through the pipeline:


    1. `ByPropertyName`


    2. `ByValue`


    The `ByValue` type is perhaps the most common. If a parameter accepts input through
    the pipeline by value, it would look for the data type that matches the defined
    data type in the output, and pick the output as input for itself. In case the
    data type is not the same as that defined, but can be converted to the required
    type, the parameter would convert the value into the data type it takes in, and
    processes it. This happened in the case of `Get-Date`, where we sent the date
    as a string, and passed it through the pipeline to `Get-Date`.


    In case of `Get-Item`, the `Path` parameter accepted string input and processed
    the command. In case of `Get-Date`, the `Date` parameter converted the string
    into a `DateTime` object and processed the request.


    `ByPropertyName`, as compared to `ByValue`, looks for a property of the exact
    same name as the parameter. In our case, `LiteralPath` of `Get-ChildItem` threw
    an error when we passed the `FullName` property, even though it was essentially
    the literal path of the object, and a string value. The reason for the error was
    that the property was not called `LiteralPath`. When we changed the name of the
    property to `LiteralPath`, `Get-ChildItem` accepted the input through the pipeline,
    and gave us the desired output.


    # Importing content into PowerShell


    Administrators managing multiple computers need to have some sort of input fed
    into `cmdlets` so they can automate tasks. While most Linux administrators are
    familiar with sending input to files (read: `Get-Content`), PowerShell is also
    capable of importing input. This imported input is a PowerShell object.


    In this recipe, we will look at two kinds of import cmdlets and learn to work
    with them.


    # How to do it...


    In the recipe, *Parsing input from text to object*, we used `Import-Csv` to import
    a comma-separated values file to convert the data contained within to a PowerShell
    object. Let us recapitulate what we learnt, however this time, now that we know
    how to work with objects, we will use the imported content in some way.


    Before we import content, let us first export some content into a CSV file. This
    way, we would have some relevant content to manipulate.


    1. Navigate to the location where you created files for this chapter. List the
    contents of the directory. While the book uses (and recommends) complete cmdlets
    even at the console (using tab-completion of course), feel free to use aliases
    if you want.


    ```

    PS> Get-ChildItem -Path . | Select-Object Name, FullName, CreationTime, LastWriteTime,
    Extension, Length

    ```


    2. Export the contents to a CSV file.


    ```

    PS> Get-ChildItem -Path . | Select-Object Name, FullName, CreationTime, LastWriteTime,
    Extension, Length | Export-Csv ./file-list.csv

    ```


    3. Open the file in a spreadsheet processor like LibreOffice Calc or even a text
    editor to view its contents.


    ```

    PS> Get-Content ./file-list.csv

    ```


    That was a plain text representation of the object returned by `Get-ChildItem`.


    4. Import the contents of the CSV file to convert this text into an object.


    ```

    PS> Import-Csv ./file-list.csv

    ```


    5. Find the type of the object returned by this command.


    ```

    PS> Import-Csv ./file-list.csv | Get-Member

    ```


    The object type is `System.Management.Automation.PSCustomObject`.


    6. Check if this is the same as returned by `Get-ChildItem`.


    ```

    PS> Get-ChildItem | Get-Member

    ```


    7. The object returned by `Import-Csv` is different. Is it possible to treat it
    just like objects? Get the `CreationTime` using the member access.


    ```

    PS> (Import-Csv ./file-list.csv).CreationTime

    ```


    8. Get just the year.


    ```

    PS> (Import-Csv ./file-list.csv).CreationTime.Year

    ```


    9. Find the type of object returned by the last command.


    ```

    PS> (Import-Csv ./file-list.csv).CreationTime | Get-Member

    ```


    TypeName: `String`


    10. Attempt to convert the `LastWriteTime` into a `DateTime` object. Pick just
    the first record, though.


    ```

    PS> Get-Date (Import-Csv ./file-list.csv | Select-Object CreationTime -First 1).CreationTime

    ```


    11. What if we had to retain all the objects within the object returned by `Get-ChildItem`,
    including their object types?


    ```

    PS> Get-ChildItem -Path . | Export-Clixml ./file-list.xml

    ```


    12. Now, import the contents of the XML to the session.


    ```

    PS> Import-Clixml ./file-list.xml

    ```


    13. Find out the type name of the object returned by the import command.


    ```

    PS> Import-Clixml ./file-list.xml | Get-Member

    ```


    14. Pick the `CreationTime` property and find its type.


    ```

    PS> (Import-Clixml ./file-list.xml).CreationTime | Get-Member

    ```


    TypeName: `DateTime`


    15. Pick just the year.


    ```

    PS> (Import-Clixml ./file-list.xml).CreationTime.Year

    ```

    '
  raw: "Understanding pipelines is not so much of a requirement if you plan to use\
    \ PowerShell for only running commands on the console; it is well encapsulated,\
    \ and the cmdlets are well designed to be able to handle passing objects between\
    \ cmdlets. However, if you plan to create custom functions and modules, the concept\
    \ of the pipeline is something you would want to understand well.\n\nIn this recipe,\
    \ we will look into the two ways cmdlets accept input. At the point where we create\
    \ functions, we will look at how to enable pipeline input for parameters.\n\n\
    # How to do it...\n\nWe will mostly use the help documentation to demonstrate\
    \ the two different kinds of pipeline input.\n\n1.  At the prompt, type the following\
    \ command:\n\n```\nPS> Get-Help Get-Item -Parameter Path\n```\n\n![](Images/ece35564-34f0-4beb-a575-83b29dc0208e.png)\n\
    \nIt says the parameter accepts string input, and accepts input by property name\
    \ as well as by value.\n\n2.  Type the following to see if a valid string is accepted.\n\
    \n```\nPS> '/home/ram/random' | Get-Item\n```\n\n![](Images/2f9fadc6-7b06-4d05-a0f3-3232e4d88ab8.png)\n\
    \n3.  Let us try something similar with `Get-Date`.\n\n```\nPS> Get-Help Get-Date\
    \ -Parameter *\n```\n\nThe Date parameter accepts values through the pipeline.\
    \ However, the type is DateTime, and not string.\n\n4.  Try sending a valid string\
    \ through the pipeline to see if it gets converted into date.\n\n```\nPS> '21\
    \ June 2018' |  Get-Date\n```\n\nIt did convert the string into date and time.\n\
    \n![](Images/9bf14887-e102-4518-aba5-ef0f00939e1d.png)\n\n5.  Now, let us go back\
    \ to getting details of the current directory. This time, however, we would pick\
    \ only the FullName property of the object.\n\n```\nPS> Get-Item . | Select-Object\
    \ FullName\n```\n\n6.  Pass this through the pipeline to the `Get-ChildItem` cmdlet.\n\
    \n```\nPS> Get-Item . | Select-Object FullName | Get-ChildItem\n```\n\nThere is\
    \ an error.\n\n![](Images/4b9eb33e-158a-47c3-91fa-81c8373590b4.png)\n\n7.  Change\
    \ the property name to `LiteralPath`.\n\n```\nPS> Get-Item . | Select-Object @{Name\
    \ = 'LiteralPath'; Expression = {$_.FullName}}\n```\n\n8.  Pass the object to\
    \ `Get-ChildItem` through the pipeline.\n\n```\nPS> Get-Item . | Select-Object\
    \ @{Name = 'LiteralPath'; Expression = {$_.FullName}} | Get-ChildItem\n```\n\n\
    That worked.\n\n# How it works...\n\nThere are two kinds of input through the\
    \ pipeline:\n\n1.  `ByPropertyName`\n\n2.  `ByValue`\n\nThe `ByValue` type is\
    \ perhaps the most common. If a parameter accepts input through the pipeline by\
    \ value, it would look for the data type that matches the defined data type in\
    \ the output, and pick the output as input for itself. In case the data type is\
    \ not the same as that defined, but can be converted to the required type, the\
    \ parameter would convert the value into the data type it takes in, and processes\
    \ it. This happened in the case of `Get-Date`, where we sent the date as a string,\
    \ and passed it through the pipeline to `Get-Date`.\n\nIn case of `Get-Item`,\
    \ the `Path` parameter accepted string input and processed the command. In case\
    \ of `Get-Date`, the `Date` parameter converted the string into a `DateTime` object\
    \ and processed the request.\n\n`ByPropertyName`, as compared to `ByValue`, looks\
    \ for a property of the *exact same name* as the parameter. In our case, `LiteralPath`\
    \ of `Get-ChildItem` threw an error when we passed the `FullName` property, even\
    \ though it was essentially the literal path of the object, and a string value.\
    \ The reason for the error was that the property was not called `LiteralPath`.\
    \ When we changed the name of the property to `LiteralPath`, `Get-ChildItem` accepted\
    \ the input through the pipeline, and gave us the desired output.\n\n# Importing\
    \ content into PowerShell\n\nAdministrators managing multiple computers need to\
    \ have some sort of input fed into cmdlets so they can automate tasks. While most\
    \ Linux administrators are familiar with sending input to files, the important\
    \ point with PowerShell is that apart from taking file-based input (read: `Get-Content`), \
    \ PowerShell is also capable of *importing* input. This imported input is a PowerShell\
    \ object.\n\nIn this recipe, we will look at two kinds of import cmdlets and learn\
    \ to work with them.\n\n# How to do it...\n\nIn the recipe, *Parsing input from\
    \ text to object*, we used `Import-Csv` to import a comma-separated values file\
    \ to convert the data contained within to a PowerShell object. Let us recapitulate\
    \ what we learnt, however this time, now that we know how to work with objects,\
    \ we will use the imported content in some way.\n\nBefore we import content, let\
    \ us first export some content into a CSV file. This way, we would have some relevant\
    \ content to manipulate.\n\n1.  Navigate to the location where you created files\
    \ for this chapter. List the contents of the directory. While the book uses (and\
    \ recommends) complete cmdlets even at the console (using tab-completion of course),\
    \ feel free to use aliases if you want.\n\n```\nPS> Get-ChildItem -Path . | Select-Object\
    \ Name, FullName, CreationTime, LastWriteTime, Extension, Length\n```\n\n2.  Export\
    \ the contents to a CSV file.\n\n```\nPS> Get-ChildItem -Path . | Select-Object\
    \ Name, FullName, CreationTime, LastWriteTime, Extension, Length | Export-Csv\
    \ ./file-list.csv\n```\n\n3.  Open the file in a spreadsheet processor like LibreOffice\
    \ Calc or even a text editor to view its contents.\n\n```\nPS> Get-Content ./file-list.csv\n\
    ```\n\nThat was a plain text representation of the object returned by `Get-ChildItem.`\n\
    \n4.  Import the contents of the CSV file to convert this text into an object.\n\
    \n```\nPS> Import-Csv ./file-list.csv\n```\n\n5.  Find the type of the object\
    \ returned by this command.\n\n```\nPS> Import-Csv ./file-list.csv | Get-Member\n\
    ```\n\nThe object type is `System.Management.Automation.PSCustomObject`.\n\n6.\
    \  Check if this is the same as that returned by `Get-ChildItem`.\n\n```\nPS>\
    \ Get-ChildItem . | Get-Member\n```\n\n7.  The object returned by `Import-Csv`\
    \ is different. Is it possible to treat it just like we do other objects? Get\
    \ the `CreationTime` using the member access operator.\n\n```\nPS> (Import-Csv\
    \ ./file-list.csv).CreationTime\n```\n\n8.  Get just the year.\n\n```\nPS> (Import-Csv\
    \ ./file-list.csv).CreationTime.Year\n```\n\n9.  Find the type of object returned\
    \ by the last command.\n\n```\nPS> (Import-Csv ./file-list.csv).CreationTime |\
    \ Get-Member\n\n    TypeName: System.String\n```\n\n10.  Attempt to convert the\
    \ `LastWriteTime` into a `DateTime` object. Pick just the first record, though.\n\
    \n```\nPS> Get-Date (Import-Csv ./file-list.csv | Select-Object CreationTime -First\
    \ 1).CreationTime\n```\n\n11.  What if we had to retain all the objects within\
    \ the object returned by `Get-ChildItem`, including their object types?\n\n```\n\
    PS> Get-ChildItem -Path . | Export-Clixml ./file-list.xml\n```\n\n12.  Now, import\
    \ the contents of the XML to the session.\n\n```\nPS> Import-Clixml ./file-list.xml\n\
    ```\n\n13.  Find out the type name of the object returned by the import command.\n\
    \n```\nPS> Import-Clixml ./file-list.xml | Get-Member\n```\n\n14.  Pick the `CreationTime`\
    \ property and find its type.\n\n```\nPS> (Import-Clixml ./file-list.xml).CreationTime\
    \ | Get-Member\n\n    TypeName: System.DateTime\n```\n\n15.  Pick just the year.\n\
    \n```\nPS> (Import-Clixml ./file-list.xml).CreationTime.Year\n```\n\n# How it\
    \ works...\n\nImporting content from a CSV is a straightforward process. The columns\
    \ in a CSV are separated by commas. PowerShell creates an object from the input\
    \ content, with each column making a property of a PowerShell custom object. Operations\
    \ that we perform on objects can be performed on the `PSCustomObject`, however,\
    \ the only limitation with `Import-Csv` is that the properties cannot be multi-valued,\
    \ nor can they have other sub-properties within them. There could be ways to achieve\
    \ multi-valued properties with CSV, but they would involve some manipulation after\
    \ the object is imported within PowerShell. One such way is to separate the values\
    \ of the property with a delimiter, and then, after the import, split the delimited\
    \ value."
