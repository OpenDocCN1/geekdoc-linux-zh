    PowerShell, we should be able to customise the profile further.


    # See also


    1.  [about_Prompts](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_prompts?view=powershell-6)
    (Microsoft Documentation)


    # Understanding standard redirection in PowerShell


    When I first started using the command line interface, I was daunted by `<` and
    `>` and `>>` at first. Then, I entirely stopped using the command line interface
    for a while and went back to the Windows administrator ways, albeit with an unusual-for-a-Windows-admin
    level of use of keyboard shortcuts (it''s all about the speed and efficiency!).


    When PowerShell came along, I had forgotten about those operators; I simply went
    ahead and understood the concept of object and pipelines, and worked for years
    that way. Switching to Linux at home made me want to know the "Linux way" of using
    the terminal. The operators came back to haunt me. I simply installed PowerShell
    on Linux.


    Redirection in PowerShell mainly relies on streams. And streams are covered in
    a different chapter. For now, we stick with the default stream, which is, `Success`.


    This recipe covers the different, simple redirections to help with basic administration.
    We shall come back to streams while understanding the concepts of error handling.


    Before we begin, let us understand that PowerShell is very different from Bash
    in terms of redirection, although it packs some minor similarities; similarities
    enough to make you not go away, but rather appreciate the flexibility of the object
    model, and the uniformity of use.


    # How to do it...


    We shall perform four activities in this recipe:


    1.  Redirect output to a file


    2.  Append another output to the same file


    3.  Send the output of a command to the console as well as a file


    4.  Accept the input of one command into another


    Apart from the operators that we use in the first two activities, we will also
    look at the cmdlet equivalents to those operators.


    1.  List out all the processes running on your computer at the moment.


    ```

    PS> Get-Process

    ```


    2.  The output was shown on the console. Now, let us redirect the contents into
    a file.


    ```

    PS> Get-Process > processes.txt

    ```


    3.  List out the contents of the file.


    ```

    PS> Get-Content ./processes.txt

    ```


    4.  Let us now append the file with the date and time stamp.


    ```

    PS> Get-Date >> ./processes.txt

    ```


    5.  Read the contents of the file now.


    ```

    PS> Get-Content ./processes.txt

    ```


    You can see that the file now contains a list of all the processes running in
    the system, as well as the time stamp. The time stamp got *appended* to the file.


    When going the *PowerShell way*, the same results can be accomplished using the
    `Out-File` cmdlet. (`Out-File` has more features such as setting the encoding
    and new line control.) Let us accomplish the same tasks using the `Out-File` cmdlet.
    You may want to delete `processes.txt` before proceeding.


    1.  Let us list out the currently-running processes again, and send the output
    to a file using `Out-File`.


    ```

    PS> Get-Process | Out-File processes.txt

    ```


    2.  Now, let us append the time stamp to the file.


    ```

    PS> Get-Date | Out-File processes.txt -Append

    ```


    If you notice, the output of `Get-Process` and `Get-Date` went directly to the
    file; nothing got displayed on the host.


    If we want to display the output on the console as well as send the content to
    a file, we simply use `Tee-Object` instead of `Out-File`. If you would like, delete
    the file, `processes.txt` again.


    1.  Run the following command.


    ```

    PS> Get-Process | Tee-Object ./processes.txt

    ```


    The list of running processes should be shown at the terminal.


    2.  Check the contents of the file, `processes.txt`.


    ```

    PS /home/ram> Get-Content ./processes.txt

    ```


    As you can see, the list of processes appears in the text file as well.


    Let us now proceed with learning to make cmdlets accept input from files. Linux
    administrators are used to making commands accept input from a file, like so:


    ```

    $ command < input_file.txt

    ```


    The command accepts input from `input_file.txt`, and performs operations on the
    input content.


    In PowerShell, this is handled using `Get-Content` and the pipe (`|`). The PowerShell
    equivalent of a command accepting input from a file would be:


    ```

    PS> Get-Content input_file.txt | command

    ```


    This might seem the other way around to most of those who are not used to PowerShell.
    Let us break down the process into pieces and try to understand it better. For
    instance, let us say you have a list of files in a text file called `input.txt`.


    1.  Reveal the contents of the text file.


    ```

    PS> Get-Content input.txt

    ```


    ![](Images/cfa87d64-fffb-4078-a37e-18d89fb00bae.png)


    2.  List out the contents of the current directory.


    ```

    $ ls

    ```


    We have five test files in the current directory, four of which are in the list
    (the input file). Let us say that you would like to delete the files listed in
    the input file, from the directory.


    3.  Pass the output of `Get-Content` to the command, `Remove-Item`, through the
    pipe.


    ```

    PS> Get-Content input.txt | Remove-Item

    ```


    ![](Images/f5ac1741-e892-4737-9bc2-842204050c21.png)


    4.  List out the files currently present in the directory.


    ```

    PS> Get-ChildItem .

    ```


    Et voilà! If you compare the outputs of `ls` (before) and  `Get-ChildItem` (after);
    the files that were listed in the text file are no more.


    # How it works...'
