  trans: "\n\n1. [about_Preference_Variables, $ErrorActionPreference](https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_preference_variables?view=powershell-6#erroractionpreference)\
    \ (微软文档)\n2. 教程：PowerShell 中的错误处理\n\n# 为每个加载启用命令执行\n\n正如我们在之前的教程中所看到的，这些更改是暂时的；它们在会话期间保持有效。在某些情况下，管理员可能需要运行一些命令或加载模块以便工作得更快。例如，我倾向于加载一系列模块来帮助我管理\
    \ Microsoft Exchange、Active Directory、VMware vSphere 基础设施、Citrix XenApp、Microsoft\
    \ System Center 以及其他环境。\n\n可以看出，所有这些产品都需要不同的方法来加载模块、插件（snap-ins）和脚本，其中许多在每次加载模块时都需要某些配置（例如使用管理员凭据连接虚拟机服务器）。这些可以使用\
    \ PowerShell 配置文件（profile）完成。\n\n# 准备工作\n\nPowerShell 默认在安装期间不会创建配置文件。它仅以默认配置运行。对此配置的任何覆盖都需要创建并修改配置文件。\n\
    \n1. 打开 PowerShell 控制台。（你可以在终端运行 `pwsh`，也可以使用 VS Code 控制台。本教程使用终端。）\n2. 显示你的配置文件路径。要执行此操作，只需调用自动变量。\n\
    \n```\nPS> $PROFILE\n```\n3. 检查你的配置文件是否存在。\n\n```\nPS> Test-Path $PROFILE\n```\n\
    \n4. 如果返回为 `True`，则可以继续教程。如果返回为 `False`（这更有可能），请运行以下命令：\n\n```\nPS> New-Item $PROFILE\
    \ -ItemType File\n```\n\n5. 你可能会收到一个错误，提示找不到部分路径。这是因为你的 `~/.config/` 目录默认不包含 `powershell`\
    \ 目录。在命令中添加 `-Force` 可以创建此目录并在该位置创建你的配置文件。\n\n```\nPS> New-Item $PROFILE -ItemType\
    \ File -Force\n```\n\n![](img/c6790c84-4047-427b-933e-47b24beaf1d1.png)\n\n6.\
    \ 我们现在将在 VS Code 中编辑配置文件。在终端中输入：\n\n```\nPS> code $PROFILE\n```\n\n# 如何操作...\n\
    \n你现在应该已经打开了配置文件。它目前是空的。现在让我们自定义 PowerShell 的错误操作行为。记得我们说过，在终端中将 `ErrorActionPreference`\
    \ 设置为 `SilentlyContinue` 是暂时的。现在让我们确保每次启动 PowerShell 时，`ErrorActionPreference`\
    \ 都被永久设置为 `SilentlyContinue`。\n\n1. 切换到终端窗口。如果你自上一个教程以来一直开着该窗口，请重启 PowerShell。\n\
    2. 让我们现在的错误操作偏好是什么。\n\n```\nPS> Get-Variable ErrorActionPreference\nContinue\n\
    ```\n3. 切换到 VS Code。配置文件应该已经打开可以编辑。\n4. 在最第一行输入：\n\n```\nPS> Set-Variable ErrorAction\
    \ SilentlyContinue\n```\n5. 保存配置文件并关闭文件。\n6. 在终端中输入 `exit` 退出 PowerShell。重新启动\
    \ PowerShell。\n7. 现在让我们检查 `ErrorActionPreference` 的值是什么。在提示符处输入：\n\n```\nPS> $ErrorActionPreference\n\
    SilentlyContinue\n```\n8. 为了确保该偏好确实生效，输入：\n\n```\nPS> Get-ChildItem /home/ram/random-directory\n\
    ```\n\n![](img/bf5a2583-205d-4e2a-b756-4611f2977719.png)\n\n光标直接返回下一行的提示符，没有抛出错误。\n\
    \n# 工作原理...\n\n简而言之，PowerShell 配置在每次加载 PowerShell 会话时都会执行。此配置文件是一个 PowerShell\
    \ 脚本文件，可以包含一系列命令和函数，它们就像另一个脚本一样被执行。\n\n需要记住的一个重要点是，每个主机都有不同的配置文件。例如，在终端上加载的 PowerShell\
    \ 有一个独立的配置文件，而 VS Code 的集成终端有另一个。这是因为每个终端的性质都不同。\n\nLinux 上的 PowerShell 尚未实现执行策略（Execution\
    \ Policies）。如果 Linux 上的 PowerShell 未来获得了安全带，则应该将执行策略设置为允许执行脚本，以便加载配置文件。\n\n# 还有更多内容...\n\
    \n设置全局操作偏好是一个坏习惯。清空配置文件可以移除错误操作偏好。由于配置文件没有其他内容，你甚至可以使用以下命令删除配置文件：\n\n```\n Remove-Item\
    \ $PROFILE\n```\n\n阅读最佳实践以获取更多信息。\n\n# 自定义终端提示符\n\n在之前的教程中，我们使用配置文件自定义了错误操作偏好。我们使用了一个演示过的命令来证明，可以在\
    \ PowerShell 控制台上运行的命令也可以添加到配置文件中，这是自动化运行某组命令的方法，可以提高生产力。\n\n现在，我们将迈向下一步，自定义控制台提示符。理论上选项是无限的；本教程只是对\
    \ PowerShell 灵活性的另一个演示。\n\n# 准备工作\n\n此教程需要 VS Code。如果你没有跟随上一个教程，请按照上一个教程中*准备工作*部分的步骤创建\
    \ PowerShell 配置文件，但这次要在 VS Code 的 PowerShell 集成控制台中运行命令。\n\n# 如何操作...\n\n确保配置文件是空的。如果你刚刚创建了配置文件，可以直接继续。如果不是，请清除配置文件中的所有内容。如果配置文件中设置了错误操作偏好，将导致你以后创建的脚本调试变得困难。\n\
    \n1. 在主窗口中输入以下。\n\n```\nfunction prompt {\n  $Location = (Get-Location).Path.ToString()\n\
    \  switch -Wildcard ($Location) {\n    \"/home/$env:USERNAME\" { $Location = '~';\
    \ break }\n    \"/home/$env:USERNAME/Documents\" { $Location = 'Documents'; break\
    \ }\n    \"/home/$env:USERNAME/Downloads\" { $Location = 'Downloads'; break }\n\
    \    \"/home/$env:USERNAME/Pictures\" { $Location = 'Pictures'; break }\n    \"\
    /home/$env:USERNAME/Videos\" { $Location = 'Videos'; break }\n    \"/home/$env:USERNAME/Music\"\
    \ { $Location = 'Music'; break }\n    \"/home/$env:USERNAME/Documents/code\" {\
    \ $Location = 'Code'; break }\n    \"/home/$env:USERNAME/*\" { $Location = $Location.Replace(\"\
    /home/$env:USERNAME/\", '~/'); break }\n    Default { }\n  }\n  Write-Host \"\
    PS \" -NoNewline\n  Write-Host `\n    ($($env:USERNAME) + \"@\" + \"$([System.Net.Dns]::GetHostByName((hostname)).HostName)\
    \ \")\n    -NoNewLine -ForegroundColor Cyan\n  Write-Host \"$Location\" -NoNewline\
    \ -ForegroundColor Green\n  Write-Host (\"`n> \") -NoNewline\n  return \" \"\n\
    }\n```\n2. 保存配置文件脚本文件。\n3. 点击集成控制台顶部的垃圾桶图标以杀死当前的 PowerShell 会话。\n4. 当 VS Code\
    \ 提示你是否想要重启会话时，点击 Yes。\n\n你的提示符应该像下面的图片所示。\n\n![](img/f6f8c8ed-8df5-4d42-8415-d37b24ac6e27.png)\n\
    \n# 工作原理...\n\n提示符由一个名为 `prompt` 的函数控制。为了演示这一点，我们可以使用：\n\n```\nGet-Command prompt\n\
    ```\n\n输出显示确实有这样一个命令，类型为 `Function`。要查看 `prompt` 函数的内容，输入：\n\n```\nPS> (Get-Command\
    \ prompt).ScriptBlock\n```\n\n输出显示了你刚刚编写的整个函数。然而，这是覆盖了默认 `prompt` 函数的函数。如果你清除配置文件，重启\
    \ PowerShell 会话并输入上面的命令，你将看到一个简单的三行输出，那就是默认的 `prompt` 函数。\n\n现在来拆解我们写的这个函数：\n\n"
- fmt: '

    First, you declare the function you are about to write. This is done using the
    keyword, `function`, followed by the name of the function. Since we want to work
    with the prompt, we use the existing function name so as to override the default
    functionality. The next thing that follows is the script block, which starts with
    a `{`.


    We want the location to appear at the prompt. This is a must-have information,
    for obvious reasons.


    If you notice, PowerShell shows the complete Home path at the prompt. While this
    works, we are used to the tilde for Home. Also, I know that Documents, Music and
    other folders reside within my Home folder, and I would rather have just the name
    of the folder appear at the prompt. This would mean some text manipulation. Therefore,
    I assign the current location to a variable, `$Location`.


    Next, we perform a `switch-case` operation and arrive at the value for what needs
    to be displayed at the prompt. Don''t worry about the syntaxes for now; we will
    look into each of those in the chapters that follow.


    Later, we use a few `Write-Host` statements to construct the prompt text. The
    `-NoNewLine` parameter ensures that the contents of each statement do not go to
    the next line. When we need a line break, we explicitly add `` `n ``.


    If you want to break a long-running line in a script, use the backtick (`` ` ``)
    character at the point where you would like to break the line and press Enter
    to break the line after the backtick. PowerShell would treat the line with the
    backtick, as well as the line that follows, as the same line. Similarly, if you
    would like to write two statements in the same line, use the semicolon (`;`) at
    the end of the first statement, and continue with the second after a space. PowerShell
    will treat both the clauses as separate statements, just like plain English.


    Since `Write-Host` just sends text to the host, and does not return anything,
    we add a return statement to the function, with merely an empty space.


    When we reload the PowerShell Integrated Console, the profile is loaded, and this
    time the custom `prompt` function in the profile overrides the default `prompt`
    function, and presents us with a nice prompt, formatted just the way we defined.


    # There''s more...


    Play around around the sequences and the contents of the `Write-Host` statements
    for now to customise your prompt. Once we are comfortable with the syntaxes in
    PowerShell, we should be able to customise the profile further.


    # See also


    1. [about_Prompts](https://docs.microsoft.com/en-us/powershell/module/microsoft_powershell.core/about/about_prompts?view=powershell-6)
    (Microsoft Documentation)


    # Understanding standard redirection in PowerShell


    When I first started using the command line interface, I was daunted by `<` and
    `>` and `>>` at first. Then, I entirely stopped using the command line interface
    for a while and went back to the Windows administrator ways, albeit with an unusual-for-a-Windows-admin
    level of use of keyboard shortcuts (it''s all about the speed and efficiency!).


    When PowerShell came along, I had forgotten about those operators; I simply went
    ahead and understood the concept of object and pipelines, and worked for years
    that way. Switching to Linux at home made me want to know the "Linux way" of using
    the terminal. The operators came back to haunt me. I simply installed PowerShell
    on Linux.


    Redirection in PowerShell relies relies on streams. And streams are covered in
    a different chapter. For now, we stick with the default stream, which is, `Success`.


    This recipe covers the different, simple redirections to help with basic administration.
    We shall come back to streams while understanding the concepts of error handling.


    Before we begin, let us understand that PowerShell is very different from Bash
    in terms of redirection, although it packs some minor similarities; similarities
    enough to make you not go away, but rather appreciate the flexibility of the object
    model, and the uniformity of use.


    # How to do it...


    We shall perform four activities in this recipe:


    1. Redirect output to a file

    2. Append another output to the same file

    3. Send the output of a command to the console as well as a file

    4. Accept the input of one command into another


    Apart from the operators that we use in the first two activities, we will also
    look at the cmdlet equivalents to those operators.


    1. List out all the processes running on your computer at the moment.


    ```

    PS> Get-Process

    ```


    2. The output was shown on the console. Now, let us redirect the contents into
    a file.


    ```

    PS> Get-Process > processes.txt

    ```


    3. List out the contents of the file.


    ```

    PS> Get-Content ./processes.txt

    ```


    4. Let us now append the file with the date and time stamp.


    ```

    PS> Get-Date >> ./processes.txt

    ```


    5. Read the contents of the file now.


    ```

    PS> Get-Content ./processes.txt

    ```


    You can see that the file now contains a list of all the processes running in
    the system, as well as the time stamp. The time stamp got *appended* to the file.


    When going the *PowerShell way*, the same results can be accomplished using the
    `Out-File` cmdlet (`Out-File` has more features such as setting the encoding and
    new line control.) Let us accomplish the same tasks using the `Out-File` cmdlet.
    You may want to delete `processes.txt` before proceeding.


    1. Let us list out the currently-running processes again, and send the output
    to a file using `Out-File`.


    ```

    PS> Get-Process | Out-File processes.txt

    ```


    2. Now, let us append the time stamp to the file.


    ```

    PS> Get-Date | Out-File processes.txt -Append

    ```


    If you notice, the output of `Get-Process` and `Get-Date` went directly to the
    file; nothing got displayed on the host.


    If we want to display the output on the console as well as send the content to
    a file, we simply use `Tee-Object` instead of `Out-File`. If you would like, delete
    the file, `processes.txt` again.


    1. Run the following command.


    ```

    PS> Get-Process | Tee-Object ./processes.txt

    ```


    The list of running processes should be shown at the terminal.


    2. Check the contents of the file, `processes.txt`.


    ```

    PS /home/ram> Get-Content ./processes.txt

    ```


    As you can see, the list of processes appears in the text file as well.


    Let us now proceed with learning to make cmdlets accept input from files. Linux
    administrators are used to making commands accept input from a file, like so:


    ```

    $ command < input_file.txt

    ```


    The command accepts input from `input_file.txt`, and performs operations on the
    input content.


    In PowerShell, this is handled using `Get-Content` and the pipe (`|`). The PowerShell
    equivalent of a command accepting input from a file would be:


    ```

    PS> Get-Content input_file.txt | command

    ```


    This might seem the other way around to most of those who are not used to PowerShell.
    Let us break down the process into pieces and try to understand it better. For
    instance, let us say you have a list of files in a text file called `input.txt`.


    1. Reveal the contents of the text file.


    ```

    PS> Get-Content input.txt

    ```


    ![](Images/cfa87d64-fffb-4078-a37e-18d89fb00bae.png)


    2. List out the contents of the current directory.


    ```

    $ ls

    ```


    We have five test files in the current directory, four of which are in the list
    (the input file). Let us say that you would like to delete the files listed in
    the input file, from the directory.


    3. Pass the output of `Get-Content` to the command, `Remove-Item`, through the
    pipe.


    ```

    PS> Get-Content input.txt | Remove-Item

    ```


    ![](Images/f5ac1741-e892-4737-9bc2-842204050c21.png)


    4. List out the files currently present in the directory.


    ```

    PS> Get-ChildItem .

    ```


    Et voilà! If you compare the outputs of `ls` (before) and `Get-ChildItem` (after);
    the files that were listed in the text file are no more.


    # How it works...

    '
