  trans: "\n\n在编写脚本时，使用短参数名称通常不是一个好习惯；使用这些名称时应像对待别名一样保持类似的谨慎态度。短参数名称会影响可读性，而且可能在未来的某个时刻破坏脚本。例如，如果你在脚本中调用了某个\
    \ `cmdlet` 并使用了短参数名 `-comp`，该名称在创建脚本时仅代表 `ComputerName`。稍后，想象一下如果该 `cmdlet` 接收到了更新并增加了一个参数\
    \ `-CompatibilityMode`；这将破坏你编写的脚本。\n\n# 更多内容……\n\n尝试输入最常用的 `cmdlets` 及其参数，以练习\
    \ Tab 补全功能。\n\n通过在脚本面板中输入 `cmdlets` 来熟悉 VS Code。注意在 VS Code 中 `cmdlet`、参数和参数值的补全是如何运作的。如果你希望补全的工作方式与控制台相同，请参考书籍\
    \ GitHub 仓库中的我的自定义设置 JSON。\n\n# 查找参数别名\n\n我们学习了 `cmdlets` 的别名，了解了如何在不输入整个参数名称的情况下唯一标识参数，还查看了如何利用\
    \ Tab 补全的功能。\n\n为了完成这个循环，让我们也来看看参数别名。\n\n正如你所猜的，参数别名的工作方式与 `cmdlet` 别名非常相似。这些别名的主要目的是减少击键次数。\n\
    \n参数别名没有友好的文档说明，但得于 PowerShell 的面向对象模型，很容易找到。在本教程中，我们将查看如何获取参数别名。\n\n# 准备工作\n\n\
    用最少的按键找到所有接受 `ComputerName` 作为参数的命令。\n\n```\nget-comm<Tab>-parametern<Tab>Cn\n\
    ```\n\n这解析为：\n\n```\nGet-Command -ParameterName Cn\n```\n\n![](img/7de20ecf-5174-4e9e-a5ae-9e024c717114.png)\n\
    \n输出与我们之前运行的结果相同：\n\n```\nGet-Command -ParameterName ComputerName\n```\n\nPowerShell\
    \ 是如何知道 `Cn` 代表 `ComputerName` 的？\n\n# 如何操作……\n\n参数是 `cmdlets` 的一部分，而 `Get-Command`\
    \ 是获取 `cmdlets` 信息的 `cmdlet`。\n\n1. 对于此示例，让我们选择 `cmdlet` `Invoke-Command`。\n\n\
    ```\nGet-Command Invoke-Command \n```\n\n2. 检查此命令输出的对象。\n\n```\nGet-Command Invoke-Command\
    \ | Get-Member \n```\n\n3. 输出显示了一个名为 `Parameters` 的成员。使用成员访问符选择该成员。\n\n```\n(Get-Command\
    \ Invoke-Command).Parameters \n```\n\n4. 查看该成员包含哪些成员。\n\n```\n(Get-Command Invoke-Command).Parameters\
    \ | Get-Member \n```\n\n5. `Values` 是否会向我们显示我们需要的信息？\n\n```\n(Get-Command Invoke-Command).Parameters.Values\
    \ \n```\n\n6. 是的，它确实给了我们一些信息，但输出太多了。我们只需要参数名和它们的别名。\n\n```\n(Get-Command Invoke-Command).Parameters.Values\
    \ | select Name, Aliases \n```\n\n搞定了。\n\n# 工作原理……\n\n我们在阅读 Core 及其功能时看到，PowerShell\
    \ 在大多数时候返回的是对象。而且每个对象内部都可以包含其他对象。沿着 .NET 的相同路径，可以使用成员访问符来选择成员（可以是属性或方法）。属性通过直接使用属性名称来访问，而方法需要传递参数（如果没有传递参数，仍然需要一对空括号）。\n\
    \n`cmdlet` 的参数是 `Get-Command` `cmdlet` 输出对象的类型。因此，带参数 `Invoke-Command` 调用 `Get-Command`\
    \ 会返回关于 `Invoke-Command` 的数据作为输出对象。这可以进一步拆分为几个其他对象（成员），其中就 `Parameters`。\n\n`Parameters`\
    \ 本身可以进一步拆分为其他成员，`Values` 就是其中之一——`Values` 包含了参数名称，正如运行 `Get-Member` 所揭示的那样。\n\
    \n我们从 `Values` 中选择了两个对象，称为 `Name` 和 `Aliases`。\n\n这些参数别名可以用来代替参数本身。\n\n参数别名有两个注意事项：\n\
    \n* 它们是大小写敏感，这意味着需要按 Shift 键。\n\n* 它们必须被记住，尽管它们有规律，就像 `cmdlet` 别名一样（例如，`ip` 代表\
    \ `Import`，`g` 代表 `Get`）。\n\n# 调用 PowerShell 脚本\n\nPowerShell 脚本无非一系列 PowerShell\
    \ `cmdlets`，每个指令位于 `ps1` 文件的一行。这些指令按顺序执行，类似于老式的 shell 脚本。使用 VS Code 运行 PowerShell\
    \ 脚本更简单，因为你只需要运行脚本让它发挥魔力。\n\n然而，出于明显原因，在 VS Code 上运行 PowerShell 脚本并不是通常的自动化方法。此外，有很多方法运行\
    \ PowerShell 脚本。在本教程中，我们将查看一种非常简单的方法；随着书籍的进展，我们将为脚本添加更多功能，并将其封装成模块供以后使用。\n\n#\
    \ 准备工作\n\n本教程使用 VS Code 编写脚本。虽然任何文本或代码编辑器都可以编写脚本，但我们使用 VS Code 是因为根据我，VS Code\
    \ 是编写 PowerShell 脚本最友好的编辑器。\n\n1. 打开 VS Code，创建一个新文件。\n\n2. 在方便的位置创建一个新目录（也许是\
    \ `~/Code`？）。\n\n3. 将空文件保存为 `hello-world.ps1` 到你刚刚创建的目录中。\n\n4. 观察 VS Code 的右下角；它现在应该显示\
    \ `PowerShell`。\n\n5. 按 `` Ctrl + `` 关闭底部的控制台以减少干扰。\n\n如果一切如下方截图所示，你就可以开始了。（暂时忽略底部状态栏的颜色，以及左下角的\
    \ git 状态。）\n\n![](img/23eb3582-a3de-490a-804e-16c977434c72.png)\n\n# 如何操作……\n\n\
    1. 在脚本面板中输入：\n\n```\nWrite-Host \"Hello, World!\"\n```\n\n2. 保存脚本（**文件** > **保存**\
    \ 或 `Ctrl + S`）。\n\n3. 点击左侧的**调试**。或者，按 `Ctrl + Shift + D`。这会打开调试面板。\n\n4. 点击绿色的类似播放按钮的**开始调试**按钮。\n\
    \n控制台应该弹出并显示 `Hello, World!`。\n\n5. 让我们再次运行一次脚本。这次我们不打开调试面板。只需按 `F5`。\n\n`Hello,\
    \ World!` 应该再次显示在控制台中。\n\n![](img/0ab2165b-fadb-4c0e-b8e4-b7e283c3067.png)\n\n\
    现在，让我们在不使用调试控件的情况下调用脚本。\n\n1. 关闭文件 (Ctrl + W)。\n\n2. 在控制台的提示符处输入：\n\n```\n./hello-world.ps1\n\
    ```\n\n你应该能看到 `Hello, World!` 显示。\n\n3. 现在，进入主目录。\n\n4. 接下来，输入 `&`，加空格，`./` 然后开始输入脚本所在的路径。像在\
    \ Bash 中一样使用 Tab 补全。\n\n5. 到达文件位置后，按回车调用文件。\n\n![](img/7d6b31d4-f323-4db3-81a8-b73faf1b.png)\n\
    \n# 工作原理……\n\n我们在阅读 Core 及其功能时看到，运行 PowerShell 脚本最简单的方法是在集成脚本环境中调试它。在这种情况下，我们使用\
    \ VS Code 作为首选的 ISE。本教程描述的另外两种调用脚本的方法是从控制台。你可以使用 VS Code 的集成控制台，或者使用为了此目的的 PowerShell\
    \ 控制台。\n\n"
- fmt: '

    When you use the `&` call operator, you tell PowerShell that you want to run a
    script (or a command).


    Another way of calling scripts is to use `.` (or the `dot operator`), which we
    shall look at in the next recipe.


    # Dot-sourcing a PowerShell script


    In the previous recipe, we saw how to call PowerShell scripts from outside of
    the ISE. We gave PowerShell the path, and explicitly mentioned that we would like
    it to run the script, by using a call operator.


    This way is ideal if you would just like the script to perform its task and not
    leave anything behind, like variable values and such. However, there are situations
    wherein we would like to run a script and, say, retain values of the variables
    we declared and assigned in them, or use the functions we declared in them.


    In such situations where we would like the functions, variables and even aliases
    retained in the current session, we use dot-sourcing.


    # How to do it...


    If you deleted the file after the previous recipe, restore it or recreate it using
    the steps in the previous recipe. Then,


    1. Open the script file that you created in the previous recipe. At the second
    line, type the following.


    ```

    $Message = "I was dot-sourced!"

    ```


    2. Save the script. Do not run it yet.


    3. Place your cursor at the integrated console, and call the script using the
    call operator.


    ```

    & ./hello-world

    ```


    4. We declared `$Message` and assigned a string value to it. Call the variable
    to see what value it contains.


    ```

    $Message

    ```


    Nothing.


    5. Now, dot-source the script. (There are two dots; one is the operator, and the
    other after the space is reference to the current directory.)


    ```

    . ./hello-world.ps1

    ```


    6. Call the `$Message` variable again.


    ```

    $Message

    ```


    ![](Images/a0c0e9b2-1b76-46b1-97de-239dcda9adea.png)


    # How it works...


    When a script or a command is called using the call operator, the script or command
    is simply run without the current session (or technically, scope) being modified.
    The command or script runs and exits without changing anything pertaining to the
    session, including changes to built-in/automatic variables.


    When changes to the scope are desired, the script or command must be dot-sourced.
    This way, whatever variables, functions or aliases are defined in it, are retained
    in the current scope.


    # There''s more...


    Create a new alias using `New-Alias` within the `hello-world.ps1` script. Try
    to get the value of the alias after first calling the script (using the debug
    control, as well as using the call operator), and then, by dot-sourcing the script.
    Observe the outcomes.


    # Calling a PowerShell cmdlet from outside of PowerShell


    So far we have learnt to call cmdlets from the console, run scripts at the ISE,
    and call scripts in two modes. In this very short recipe, we shall learn how to
    call a PowerShell cmdlet from outside of PowerShell.


    # How to do it...


    1. Open a Terminal window.


    2. At the prompt, type:


    ```

    pwsh -h

    ```


    3. Read the syntax for the command.


    4. At the prompt, type:


    ```

    pwsh -c Get-ChildItem

    ```


    ![](Images/23321ef5-fc49-4e61-a77e-e957c0051db9.png)


    5. Let us now run the `hello-world.ps1` script.


    ```

    pwsh -f ./Documents/code/github/powershell/chapter-3/hello-world.ps1

    ```


    ![](Images/705055a1-23b9-4322-bb0b-ee77122284eb.png)


    # How it works...


    PowerShell is not an application that runs on top of Bash. PowerShell is a shell
    itself. However, it can be called from with Bash just like another application.
    Like applications, the `pwsh` command takes in arguments, which are then processed
    by PowerShell.


    The two main ways we may want to use PowerShell from within Bash is to run a single
    command, or call a script file. You can even call a script block, however, this
    must be done from within PowerShell. In most cases, running single cmdlets or
    calling a script should suffice.


    In general, when calling `pwsh` with cmdlets, make `-Command` (or `-c`) the last
    parameter, since anything that comes after the cmdlet itself is considered cmdlet
    arguments. Same goes for `-File` as well.


    When a script is designed to accept arguments, the script arguments can be passed
    after the script name, just like with cmdlets.


    # Recording the cmdlets run on the PowerShell console


    Often, there are situations in which you perform a series of tasks on your PowerShell
    console, and after quite some trial-and-error, come across a solution. And then,
    you wish you had recorded everything you did on the console. You could still copy
    content from the console, so you try to scroll up. But you can only go so far.
    Your command history (a little like Bash history) can help you, but sometimes,
    that feels limited as well.


    A few months ago, we were troubleshooting a sync issue between two of their software
    update distribution systems which were supposed to work in sync. After some of
    us were done beating around the GUI, (of course) we decided to pick PowerShell
    to fix the issue. We ran a series of commands, and after a hours of fighting with
    the systems, the systems yielded, and we were back up and running.


    Our managers asked for all the steps that we took to achieve this, so that they
    could be documented for future use. Of course I cannot tell you all the steps
    that we took—because: a) scope of the book, and b) agreements with our clients—but
    I can tell you what can help in such situations.


    # How to do it...


    Start PowerShell at the terminal, or use the PowerShell Integrated Console on
    VS Code.


    1. Run the following command:


    ```

    Start-Transcript -Path ./command-transcript.txt

    ```


    2. You can also simply run the cmdlet without any arguments; it would automatically
    create a text file with an auto-generated file name. Get the current system date
    and time


    ```

    Get-Date

    ```


    3. List out all the files and directories in the current location.


    ```

    Get-ChildItem .

    ```


    4. Create a new directory.


    ```

    New-Item test-transcript -ItemType Directory

    ```


    5. Create a new file within the directory.


    ```

    New-Item -Path test-transcript/testing-transcript.txt -ItemType File

    ```


    6. Add content to the file.


    ```

    @''

    In publishing and graphic design, lorem ipsum is a placeholder text commonly used
    to demonstrate the visual form of a document without relying on meaningful content
    (also called greeking).

    Replacing the actual content with placeholder text allows designers to design
    the form of the content before the content itself has been produced.

    —Wikipedia

    ''@ | Out-File ./test-transcript/testing-transcript.txt -Append

    ```


    7. Delete the directory.


    ```

    Remove-Item -Path ./test-transcript -Recurse

    ```


    8. Stop recording what you did.


    ```

    Stop-Transcript

    ```


    9. You should have now received the location of the transcript file. Read the
    contents of the file.


    ```

    Get-Content -Path ./command-transcript.txt

    ```


    ![](Images/3b8eda4d-a326-4155-b8ea-67f3d63f7aa3.png)


    # How it works...


    A transcript created by running `Start-Transcript` stores all of your actions
    and the console output of all of the commands you ran, in a text file. The transcript
    also contains some of other useful information pertaining to the context the commands
    were run in.


    A transcript file is a little more than a history file, in that the former contains
    the output of the commands, apart from the commands themselves.


    The `Start-Transcript` cmdlet does not require any argument at all; it can create
    a text file at the user''s home, with a unique name to ensure that no other transcript
    is rewritten. In other words, `Path` is an optional parameter.


    This concludes this chapter about preparing for administration using PowerShell.
    It''s time to crack your knuckles and refill your coffee mug. Did I tell you coffee
    speeds up thinking in PowerShell? Placebo, you say? Let''s not get into an argument
    right now.


    # First Steps in Administration using PowerShell


    In this chapter, we cover the following topics:


    1.  Working with date properties


    2.  Working with date and time functions

