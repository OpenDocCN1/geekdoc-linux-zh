    # Introduction\n\nAs per Harvard Business Review, a way to effectively learn is\
    \ to cycle between information feasting and information fasting. Given that we\
    \ have familiarised ourselves (and perhaps a little overwhelmed by the volume\
    \ of the last chapter), we will take a lighter approach to our first steps to\
