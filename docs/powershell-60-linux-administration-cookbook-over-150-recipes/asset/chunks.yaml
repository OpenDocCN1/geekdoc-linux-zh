  trans: "\n\n当运行 `Install-Module` 时，PowerShell 实际的操作是将模块文件保存到 PowerShell 默认查找模块的位置。\n\
    \n## 另另\n\n1. 食谱：PowerShell 中的模块发现路径（创建自定义模块）\n2. 食谱 3.11：调用 PowerShell 脚本\n\n\
    ## 列出 PowerShell 中的各种提供程序\n\n在我们开始使用 PowerShell 进行管理之前，另一个概念是理解 `providers`（提供程序）。\n\
    \nPowerShell 中的提供程序是面向对象编程中 `overloading`（重载）概念绝佳示例。本质上，提供程序是一个逻辑上将非文件系统驱动器表示为驱动器的程序。例如，在\
    \ Windows 上，注册表是一个配置数据库。在 PowerShell 中，注册表就是一个提供者；这样，管理员就可以 PowerShell 导航并操作注册表项，就像操作文件一样。这种功能也适用于\
    \ Linux，但提供者的数量没有 Windows 那么多。\n\n## 如何操作...\n\n要列出 PowerShell 中的提供程序，请遵循以下步骤：\n\
    \n1. 运行 `pwsh` 在终端中加载 PowerShell。\n2. 运行命令：\n\n```\nPS> Get-PsProvider\n```\n\n\
    ![](img/f36012e9-b8ba-4762-9952-de78c5ce0ab4.png)\n\n注意 PowerShell 中提供的提供程序，以及这些提供程序内部的驱动器和功能。\n\
    \n3. 导航到 Alias 驱动器。\n\n```\nPS> Set-Location Alias:\n```\n\n![](img/e52ce58e-5686-4671-816a-3cdff1cc4004.png)注意驱动器名称后面的冒号（是\
    \ `Alias:` 而不是 `Alias`）。这对于指示 PowerShell 你正在切换驱动器非常重要。如果没有冒号，PowerShell 只会尝试在你的当前工作目录中查找名为\
    \ `Alias` 的目录。\n\n## 工作原理...\n\n截至目前，PowerShell 提供程序在 Linux 中似乎还没有按预期工作。不过，这以后应该得到修复。\n\
    \n提供程序将非文件系统类的结构封装在内部，并将其作为伪文件和目录呈现给 PowerShell。这允许你像操作简单文件和目录一样导航复杂的结构，从而可以使用适用于文件系统的命令（如\
    \ `Get-ChildItem`）更轻松地管理它们。\n\n输出中的 `Capabilities` 列显示了每个提供程序的功能，如 `Credentials`、`ShouldProcess`\
    \ 和 `Filter`。这意味着这些提供程序支持向核心传递凭据、参数如 `-WhatIf` 和 `-Confirm`（它们是 `ShouldProcess`\
    \ 的一部分）以及使用 `-Filter` 参数过滤输出的能力。我们将在接下来的章节中学习这些功能的每一个项。\n\n## 另另\n\n1. 食谱：`ShouldProcess`\
    \ 功能，如 `-Confirm` 和 `-WhatIf`（函数）\n2. 食谱：使用 `-Filter` 参数\n\n## 介绍 Core 及其功能\n\n\
    在本章中，我们将涵盖以下主题：\n\n1. 剖析 .NET Core 对象\n2. 将输出拆分为不同的对象\n3. 将文本输入解析为对象\n4. 比较 Bash\
    \ 和 PowerShell 的输出\n5. 比较 Windows PowerShell 和 PowerShell\n6. 列出别名并使用它们代替命令项 (cmdlets)\n\
    7. 创建自定义别名\n8. 导入/导出自定义别名以供将来使用\n9. 列出执行策略并设置合适的策略\n\n## 引言\n\n微软在 2014 年宣布 .NET\
    \ 的“开源”几乎引发了一场风暴。许多人冲向台前（可以这么说）阅读这些难以置信的消息——微软如何可能让他们操作系统的内核开源？有些人持怀疑态度，另一些人则欢喜若狂。随后是一个更清晰的宣布：NET\
    \ Core 是开源的，而不是 .NET Framework。许多人说 .NET Core 是 .NET Framework 的子集。\n\n.NET 最初于\
    \ 2000 年发布，作为一个基于互联网标准的新平台。与其同时，在年底，微软发布了 `Common Language Infrastructure`（通用语言体系）作为一种标准，这样任何想要的人都可以根据这些标准编写自己的\
    \ .NET 框架。自 00 年代以来，.NET Framework 一直是 Windows 的基础。\n\nWindows PowerShell 于 2006\
    \ 年面向市场发布，它是 .NET Framework 的一种实现，专注于系统管理员（或称 sysadmins，以便他们更好地管理 Windows 工作负载并实现任务自动化）。\n\
    \n2016 年 6 月，微软发布了经过协作重构的、更现代且高效的 .NET。.NET Core 正式诞生。虽然 .NET Framework 继续主宰 Windows\
    \ 领域，但开源且跨平台的 .NET Core 已经积累了巨大的势头并持续增长。.NET Core 似乎是未来的方向。\n\nPowerShell（不是 Windows\
    \ PowerShell）基于 .NET Core，因此它是开源的，并且与 .NET Core 拥有跨平台愿景。\n\n在本章中，我们将查看一个非常简单的\
    \ .NET Core 实现，并将其与 PowerShell 的输出进行比较，以证明 PowerShell 仅仅是封装的 .NET Core 代码。同时，我们将观察\
    \ PowerShell 的通用行为。\n\n## 剖析 .NET Core 对象\n\n.NET Core 在跨平台标准的通用语言体系上运行。因此，使用\
    \ .NET Core 封装 Linux 的内部工作机制是可能的。正如我们在未来章节中看到的，PowerShell 是面向对象的，就像 .NET Core\
    \ 一样。为了进行演示，我们将选择一个简单的系统类，名为 `System.IO.DirectoryInfo` 来显示某些目录的信息。我们还将比较 .NET\
    \ Core 对象的输出与 PowerShell 命令项的输出，后者也显示了某些目录的信息。\n\n你不需要记住 .NET Core 类、方法或其语法来操作\
    \ PowerShell；这正是 PowerShell 存在的全部意义。\n\n## 准备工作\n\n如果你跟了上一章的操作，那么你的 Linux 计算机应该已经安装了\
    \ PowerShell；打开终端窗口并输入 `pwsh` 来调用 PowerShell。\n\n每个 `object`（对象）都有成员——`properties`（属性）和\
    \ `methods`（方法）。如果你不熟悉面向对象编程的概念，属性是对象的特征（对象拥有什么），方法是对象的能力（对象能做什么）。因此，引用一个（可以说是争议最大的）最过度使用的属性和方法例子：如果马是一个对象，它的身高、颜色等就是它的属性；奔跑、进食等就是该对象支持的方法。\n\
    \n## 如何操作...\n\n1. 使用 PowerShell，.NET Core 也作为依赖项已安装。让我们在 PowerShell 中创建一个对象，这会调用一个\
    \ .NET 类及其默认构造函数。此构造函数需要一个参数。\n\n```\nPS> New-Object -TypeName System.IO.DirectoryInfo\
    \ -ArgumentList '/home/ram'\n```\n\n2. 这为提供了指定目录的信息，如下：\n\n```\nMode         \
    \       LastWriteTime         Length Name            \n----                -------------\
    \         ------ ----            \nd-----          5/16/18  11:03 AM         \
    \       ram\n```\n\n3. PowerShell 中有一个名为 `Get-Item` 的命令项，它可以提供有关目录的详细信息。让我们使用相同的参数调用此命令项，看看我们得到了什么。\n\
    \n```\nPS> Get-Item '/home/ram'\n\n    Directory: /home\n\nMode              \
    \  LastWriteTime         Length Name            \n----                -------------\
    \         ------ ----            \nd-----          5/16/18  11:03 AM         \
    \       ram\n```\n\n4. 很好！现在让我们对 `Get-Item` 的输出使用 `Get-Member` 命令项查看我们刚刚收到的输出对象的详细信息。\n\
    \n```\nPS> Get-Item '/home/ram' | Get-Member\n```\n\n`Get-Member` 显示输出对象中所有可用成员（大多数\
    \ PowerShell 命令项返回对象输出，而不是纯文本）。有关更多信息，请运行 `Get-Help Get-Member`。\n\n"
- fmt: "\nThis would list a series of members that are part of the output. We're primarily\
    \ concerned about the very first line for now.\n\n```\nPS> Get-Item '/home/ram'\
    \ | Get-Member\n\n   TypeName: System.IO.DirectoryInfo\n\nName               \
    \       MemberType     Definition\n----                      ----------     ----------\n\
    LinkType                  CodeProperty   System.String LinkType{get=GetLinkType;}\n\
    Mode                      CodeProperty   System.String Mode{get=Mode;}\n.\n.\n\
    .\n```\n\nNotice the very first line of the output, `TypeName: System.IO.DirectoryInfo`.\
    \ That is the exact type name we used when creating the .NET object.\n\n![](Images/c1e7e64f-6993-4c88-9e96-ee87651fba00.png)\n\
    \nThis proves that the same task of showing information on the current working\
    \ directory can be achieved by calling a .NET constructor, or by running a PowerShell\
    \ cmdlet. Therefore, we infer that PowerShell cmdlets are simply encapsulated\
    \ .NET code, simplified to enable administrators to work with computers, without\
    \ having to worry about the underlying .NET code.\n\nIn essence, `Get-Item` calls\
    \ the `System.IO.DirectoryInfo` class under the hood, with the arguments passed\
    \ along with the cmdlet.\n\n`Get-Item` can be used with any location in your file\
    \ system. As long as you are authorised to access the location, PowerShell would\
    \ return information about the location you pass as the argument.\n\nLike they\
    \ say:\n\nIf the C# guys can do it, so can you.\n\n# There's more...\n\nRead the\
    \ output of the `Get-Item | Get-Member` command to understand what more information\
    \ you can get about the directory you specify. Also, after we are comfortable\
    \ using the `Select-Object` cmdlet, we should be able to call specific fields\
    \ from the returned objects.\n\n# See also\n\n1. The .NET class, [System.IO.DirectoryInfo](https://msdn.microsoft.com/en-us/library/system.io.directoryinfo(v=vs.110).aspx)\
    \ (Microsoft Developer Network)\n\n# Breaking down an output into different objects\n\
    \nIn the previous section, we saw that an object can have properties as well as\
    \ methods. These properties and methods are known as members. In the object oriented\
    \ approach to programming (and by extension, administration using PowerShell),\
    \ it is possible to reference these properties as well as methods of an object\
    \ using the `member access operator`, which is a single dot (`.`).\n\n# Getting\
    \ Ready\n\nIdeally, this recipe should be an extension to the previous. If you\
    \ did not run the previous commands, it is suggested that you do, and then proceed\
    \ with the steps below.\n\n# How to do it...\n\n1. Look at the output of the following\
    \ command from the previous recipe:\n\n```\nPS> Get-Item '/home/ram' | Get-Member\n\
    ```\n\nThe output table contains the name of the member, the type and the definition.\
    \ Take a look at the `MemberType` column; you have `Method`, and different kinds\
    \ of properties such as `CodeProperty` and `Property`.\n\n2. Assume that we would\
    \ like to see when my home directory was last written to. We would refer to this\
    \ property using the member access operator. To do this, simply enclose in parenthesis\
    \ the `Get-Item` command along with its argument and refer to the property using\
    \ the dot operator.\n\n```\nPS> (Get-Item /home/ram).LastWriteTime\n\nWednesday,\
    \ 18 May 2018 11:01:02\n```\n\n3. Next, let us pick the property, `Parent`, of\
    \ the object. This should give us the details of the directory which my home directory\
    \ resides in.\n\n```\nPS> (Get-Item /home/ram).Parent\n\nMode                LastWriteTime\
    \         Length Name\n----                -------------         ------ ----\n\
    d-r---       03/05/2018     17:07                home\n```\n\nThis output in itself\
    \ is an object, which means that we can fetch last write time and other details\
    \ of this returned object, just like how we did for `/home/ram`. How do we see\
    \ when the parent folder (`/home`) was created?\n\n4. First, let us use the `Get-Member`\
    \ cmdlet on this object and see the `TypeName` of the returned object.\n\n```\n\
    PS> (Get-Item /home/ram).Parent | Get-Member\n\n   TypeName: System.IO.DirectoryInfo\n\
    ```\n\nIt is the same as `Get-Item` itself. Therefore, any of the members of `Get-Item\
    \ /home/ram` apply to `(Get-Item /home/ram).Parent` as well.\n\n5. Now call the\
    \ `CreationTime` property on the parent object. Simply add a dot next to `Parent`,\
    \ and call the `CreationTime` property.\n\n```\nPS> (Get-Item /home/ram).Parent.CreationTime\n\
    \nThursday, 3 May 2018 17:07:38\n```\n\nThe `CreationTime` property is an object\
    \ in itself, of the type, `DateTime`. Therefore, you can perform date and time\
    \ operations on this object.\n\nPowerShell is not case-sensitive most of the time.\
    \ However, it is recommended we stick to the conventions in order to minimise\
    \ errors. Especially since case sensitivity is a convention in Linux. Properties\
    \ could be of different data types. The data type can be seen in the `Definition`\
    \ column.\n\n6. Let us look at the members of the `CreationTime` object to see\
    \ if we can further filter the output.\n\n```\nPS> (Get-Item /home/ram).Parent.CreationTime\
    \ | Get-Member\n\n   TypeName: System.DateTime\n```\n\n7. Let us pick only the\
    \ year property from this object.\n\n```\nPS> (Get-Item /home/ram).Parent.CreationTime.Year\n\
    2018\n```\n\nThis concludes picking properties from within the returned objects.\
    \ Next, let us use a method from within the returned object and create a sub-directory\
    \ under `/home/ram`.\n\n1. First, list out the existing directories under the\
    \ directory. This is done using the cmdlet, `Get-ChildItem`.\n\n```\nPS> Get-ChildItem\
    \ /home/ram\n\n    Directory: /home/ram\n\nMode                LastWriteTime \
    \        Length Name\n----                -------------         ------ ----\n\
    d-----       06/04/2018     13:05                Desktop\nd-----       18/05/2018\
    \     16:01                Documents\nd-----       18/05/2018     16:01      \
    \          Downloads\nd-----       06/04/2018     13:05                Music\n\
    d-----       19/05/2018     11:07                Pictures\nd-----       06/04/2018\
    \     13:05                Public\nd-----       06/04/2018     13:05         \
    \       Templates\nd-----       10/04/2018     03:41                Videos\n```\n\
    \n`Get-Item` gives you details about the directory itself. In essence, this cmdlet\
    \ deals with the current item at hand. Therefore, you have properties and methods\
    \ that align with that intention. Child items, on the other hand, mean the files\
    \ and directories that are *within* the said item.\n\n2. That is a list of standard\
    \ directories in a user profile. Let us now create a sub-directory within this\
    \ profile folder, using a method in `Get-Item`.\n\n```\nPS> (Get-Item /home/ram).CreateSubdirectory('test-directory')\n\
    ```\n\nTo know what argument a certain method accepts, look in the `Definition`\
    \ column of the output of `Get-Member`. In case of `CreateSubdirectory`, the definition\
    \ is `System.IO.DirectoryInfo CreateSubdirectory(string path)`.\n\nYou should\
    \ now get a confirmation.\n\n![](Images/d560bd8-b8e8-471a-8413-8002dc6776.png)\n\
    \n3. Excellent. Now, list out the directories under the home directory.\n\n```\n\
    PS> Get-ChildItem /home/ram\n\n    Directory: /home/ram\n\nMode              \
    \  LastWriteTime         Length Name\n----                -------------      \
    \   ------ ----\nd-----       06/04/2018     13:05                Desktop\nd-----\
    \       18/05/2018     16:01                Documents\nd-----       18/05/2018\
    \     16:01                Downloads\nd-----       06/04/2018     13:05      \
    \          Music\nd-----       19/05/2018     11:07                Pictures\n\
    d-----       06/04/2018     13:05                Public\nd-----       06/04/2018\
    \     13:05                Templates\nd-----       19/05/2018     13:31      \
    \          test-directory\nd-----       10/04/2018     03:41                Videos\n\
    ```\n\nWe can now see the new directory that we created using the `CreateSubdirectory`\
    \ method.\n\nRunning `Get-ChildItem`, as you may notice, is similar to running\
    \ the `GetDirectories` and `GetFiles` methods of the object returned by `Get-Item`.\
    \ This is another example of encapsulation in .NET Core.\n"
  raw: "This would list a series of members that are part of the output. We're primarily\
    \ concerned about the very first line for now.\n\n```\nPS> Get-Item '/home/ram'\
    \ | Get-Member\n\n   TypeName: System.IO.DirectoryInfo\n\nName               \
    \       MemberType     Definition\n----                      ----------     ----------\n\
    LinkType                  CodeProperty   System.String LinkType{get=GetLinkType;}\n\
    Mode                      CodeProperty   System.String Mode{get=Mode;}\n.\n.\n\
    .\n```\n\n# How it works...\n\nNotice the very first line of the output, `TypeName:\
    \ System.IO.DirectoryInfo`. That is the exact type name we used when creating\
    \ the .NET object.\n\n![](Images/c1e7e64f-6963-4c88-9e96-ee87651fba00.png)\n\n\
    This proves that the same task of showing information on the current working directory\
    \ can be achieved by calling a .NET constructor, or by running a PowerShell cmdlet.\
    \ Therefore, we infer that PowerShell cmdlets are simply encapsulated .NET code,\
    \ simplified to enable administrators to work with computers, without having to\
    \ worry about the underlying .NET code.\n\nIn essence, `Get-Item` calls the `System.IO.DirectoryInfo`\
    \ class under the hood, with the arguments passed along with the cmdlet.\n\n`Get-Item`\
    \ can be used with any location in your file system. As long as you are authorised\
    \ to access the location, PowerShell would return information about the location\
    \ you pass as the argument.\n\nLike they say:\n\nIf the C# guys can do it, so\
    \ can you.\n\n# There's more...\n\nRead the output of the `Get-Item | Get-Member`\
    \ command to understand what more information you can get about the directory\
    \ you specify. Also, after we are comfortable using the `Select-Object` cmdlet,\
    \ we should be able to call specific fields from the returned objects.\n\n# See\
    \ also\n\n1.  The .NET class, [System.IO.DirectoryInfo](https://msdn.microsoft.com/en-us/library/system.io.directoryinfo(v=vs.110).aspx)\
    \ (Microsoft Developer Network)\n\n# Breaking down an output into different objects\n\
    \nIn the previous section, we saw that an object can have properties as well as\
    \ methods. These properties and methods are known as members. In the object oriented\
    \ approach to programming (and by extension, administration using PowerShell),\
    \ it is possible to reference these properties as well as methods of an object\
    \ using the **member access operator**, which is a single dot (`.`).\n\n# Getting\
    \ Ready\n\nIdeally, this recipe should be an extension to the previous. If you\
    \ did not run the previous commands, it is suggested that you do, and then proceed\
    \ with the steps below.\n\n# How to do it...\n\n1.  Look at the output of the\
    \ following command from the previous recipe:\n\n```\nPS> Get-Item '/home/ram'\
    \ | Get-Member\n```\n\nThe output table contains the name of the member, the type\
    \ and the definition. Take a look at the `MemberType` column; you have `Method`,\
    \ and different kinds of properties such as `CodeProperty` and `Property`.\n\n\
    2.  Assume that we would like to see when my home directory was last written to.\
    \ We would refer to this property using the member access operator. To do this,\
    \ simply enclose in parenthesis the `Get-Item` command along with its argument\
    \ and refer to the property using the dot operator.\n\n```\nPS> (Get-Item /home/ram).LastWriteTime\n\
    \nWednesday, 18 May 2018 11:01:02\n```\n\n3.  Next, let us pick the property,\
    \ `Parent`, of the object. This should give us the details of the directory which\
    \ my home directory resides in.\n\n```\nPS> (Get-Item /home/ram).Parent\n\nMode\
    \                LastWriteTime         Length Name\n----                -------------\
    \         ------ ----\nd-r---       03/05/2018     17:07                home\n\
    ```\n\nThis output in itself is an object, which means that we can fetch last\
    \ write time and other details of this returned object, just like how we did for\
    \ `/home/ram`. How do we see when the parent folder (`/home`) was created?\n\n\
    4.  First, let us use the `Get-Member` cmdlet on this object and see the `TypeName`\
    \ of the returned object.\n\n```\nPS> (Get-Item /home/ram).Parent | Get-Member\n\
    \n   TypeName: System.IO.DirectoryInfo\n```\n\nIt is the same as `Get-Item` itself.\
    \ Therefore, any of the members of `Get-Item /home/ram` apply to `(Get-Item /home/ram).Parent`\
    \ as well.\n\n5.  Now call the `CreationTime` property on the parent object. Simply\
    \ add a dot next to `Parent`, and call the `CreationTime` property.\n\n```\nPS>\
    \ (Get-Item /home/ram).Parent.CreationTime\n\nThursday, 3 May 2018 17:07:38\n\
    ```\n\nThe `CreationTime` property is an object in itself, of the type, `DateTime`.\
    \ Therefore, you can perform date and time operations on this object.\n\nPowerShell\
    \ is not case-sensitive most of the time. However, it is recommended we stick\
    \ to the conventions in order to minimise errors. Especially since case sensitivity\
    \ is a convention in Linux. Properties could be of different data types. The data\
    \ type can be seen in the `Definition` column.\n\n6.  Let us look at the members\
    \ of the `CreationTime` object to see if we can further filter the output.\n\n\
    ```\nPS> (Get-Item /home/ram).Parent.CreationTime | Get-Member\n\n   TypeName:\
    \ System.DateTime\n```\n\n7.  Let us pick only the year property from this object.\n\
    \n```\nPS> (Get-Item /home/ram).Parent.CreationTime.Year\n2018\n```\n\nThis concludes\
    \ picking properties from within the returned objects. Next, let us use a method\
    \ from within the returned object and create a sub-directory under `/home/ram`.\n\
    \n1.  First, list out the existing directories under the directory. This is done\
    \ using the cmdlet, `Get-ChildItem`.\n\n```\nPS> Get-ChildItem /home/ram\n\n \
    \   Directory: /home/ram\n\nMode                LastWriteTime         Length Name\n\
    ----                -------------         ------ ----\nd-----       06/04/2018\
    \     13:05                Desktop\nd-----       18/05/2018     16:01        \
    \        Documents\nd-----       18/05/2018     16:01                Downloads\n\
    d-----       06/04/2018     13:05                Music\nd-----       19/05/2018\
    \     11:07                Pictures\nd-----       06/04/2018     13:05       \
    \         Public\nd-----       06/04/2018     13:05                Templates\n\
    d-----       10/04/2018     03:41                Videos\n```\n\n`Get-Item` gives\
    \ you details about the directory itself. In essence, this cmdlet deals with the\
    \ current item at hand. Therefore, you have properties and methods that align\
    \ with that intention. Child items, on the other hand, mean the files and directories\
    \ that are *within* the said item.\n\n2.  That is a list of standard directories\
    \ in a user profile. Let us now create a sub-directory within this profile folder,\
    \ using a method in `Get-Item`.\n\n```\nPS> (Get-Item /home/ram).CreateSubdirectory('test-directory')\n\
    ```\n\nTo know what argument a certain method accepts, look in the `Definition`\
    \ column of the output of `Get-Member`. In case of `CreateSubdirectory`, the definition\
    \ is `System.IO.DirectoryInfo CreateSubdirectory(string path)`.\n\nYou should\
    \ now get a confirmation.\n\n![](Images/d5608bd8-b8e8-471a-8413-8002dc6cf776.png)\n\
    \n3.  Excellent. Now, list out the directories under the home directory.\n\n```\n\
    PS> Get-ChildItem /home/ram\n\n    Directory: /home/ram\n\nMode              \
    \  LastWriteTime         Length Name\n----                -------------      \
    \   ------ ----\nd-----       06/04/2018     13:05                Desktop\nd-----\
    \       18/05/2018     16:01                Documents\nd-----       18/05/2018\
    \     16:01                Downloads\nd-----       06/04/2018     13:05      \
    \          Music\nd-----       19/05/2018     11:07                Pictures\n\
    d-----       06/04/2018     13:05                Public\nd-----       06/04/2018\
    \     13:05                Templates\nd-----       19/05/2018     13:31      \
    \          test-directory\nd-----       10/04/2018     03:41                Videos\n\
    ```\n\nWe can now see the new directory that we created using the `CreateSubdirectory`\
    \ method.\n\nRunning `Get-ChildItem`, as you may notice, is similar to running\
    \ the `GetDirectories` and `GetFiles` methods of the object returned by `Get-Item`.\
    \ This is another example of encapsulation in .NET Core.\n\n# How it works..."
