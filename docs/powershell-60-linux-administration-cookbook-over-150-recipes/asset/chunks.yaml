    \ yourself.\n\n# Getting Ready\n\nIf you followed along the previous chapters\
    \ and performed all the exercises mentioned in them, you should be good to go.\
    \ Otherwise, go to the chapter, Installation Reference and Help, and get yourself\
    \ a copy of PowerShell. Come back here to continue. This recipe uses only the\
    \ terminal, so there is no need for anything else.\n\n# How to do it...\n\nBefore\
    \ we start working with dates, let us make a simple call for the date.\n\n1. Display\
    \ the current date and time.\n\n```\nPS> Get-Date\n\nSaturday, 16 June 2018 12:14:07\n\
    ```\n\n2. Find out what members this returned object has.\n\n```\nPS> Get-Date\
    \ | Get-Member\n```\n\n![](Images/2fa6a427-d4fb-4f66-a683-816c5e5d09d4.png)\n\n\
    A whole bunch of properties and methods.\n\n3. Attempt to display the date like\
    \ 16/06/2018.\n\n```\nPS> $Date = Get-Date\nPS> \"$Date.Day/$Date.Month/$Date.Year\"\
    \n```\n\n![](Images/5e6589ce-2bd7-48fd-83f3-13864445c379.png)\n\nThe colours do\
    \ not look right.\n\n4. Change the command as follows. The syntax should look\
    \ better now, based on your terminal theme. (Don't worry about why the change\
    \ works for now; we shall look at it when dealing with variables at a later point.)\n\
    \n```\nPS> \"$($Date.Day)/$($Date.Month)/$($Date.Year)\"\n16/6/2018\n```\n\nBut\
    \ that was a lot of work. Is there an easier way?\n\n5. Look in Help to see what\
    \ parameters you get.\n\n```\nPS> Get-Help Get-Date\n```\n\nThere is a `Format`\
    \ parameter.\n\n6. Type the following to get the short date.\n\n```\nPS> Get-Date\
    \ -Format d\n```\n\nTry the following as the values for `Format`: `g`, `U`, `yyyy/MM/dd`\
    \ and `yyyyMMddhhmmss`.\n\n![](Images/58296173-4b02-41ea-881a-9f97745811eb.png)\n\
    \n7. If you're more comfortable with the UNIX formatting of date, use the `Uformat`\
    \ parameter.\n\n```\nPS> Get-Date -Uformat %d/%m/%Y\n```\n\nLet us take one more\
    \ step to pass a custom date to the system and fetch a little information from\
    \ it, leveraging the members of the object that is output by `Get-Date`.\n\n8.\
    \ Find what day Halloween falls on, in 2018.\n\n```\nPS> (Get-Date -Day 31 -Month\
    \ 10 -Year 2018).DayOfWeek \nWednesday\n```\n\n9. If you know how date in your\
    \ locale works, pass the date as follows and get the same information.\n\n```\n\
    PS> (Get-Date 31/10/2018).DayOfWeek\n```\n\n10. If you remember the concept of\
    \ Type Accelerators, use it to get the information you need.\n\nRemember to use\
