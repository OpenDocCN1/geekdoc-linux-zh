  trans: "\n\n你工作场所着装规范是由孩子决定的，她喜欢每个人都穿彩虹的颜色。由于她不喜欢有人在周末工作，不太喜欢橙色，并且非常讨厌黄色，她制定了以下方案（她还不知道什么是“周一忧”）：周一红色，周二紫色，周三靛蓝色，周四蓝色，周五绿色，周末期间穿橙色。\n\
    \n# 如何实现...\n\n这种情况需要一整轮 `If–ElseIf–Else` 语句来编写。处理这种情况的一种更有效的方法是使用 `Switch–Case`\
    \ 结构。\n\n1. 打开一个新的 PowerShell 文件并向其中添加以下内容：\n\n```\n$Date = Get-Date\n\nswitch\
    \ ($Date.DayOfWeek) {\n    'Monday' { Write-Output 'Red' }\n    'Tuesday' { Write-Output\
    \ 'Violet' }\n    'Wednesday' { Write-Output 'Indigo' }\n    'Thursday' { Write-Output\
    \ 'Blue' }\n    'Friday' { Write-Output 'Green' }\n    Default { Write-Output\
    \ 'Orange' }\n}\n```\n\n2. 如果你倾向于省略 `Default` 并使用通配符匹配来处理周末：\n\n```\n$Date = Get-Date\n\
    \nswitch -Wildcard ($Date.DayOfWeek) {\n    'Monday' { Write-Output 'Red' }\n\
    \    'Tuesday' { Write-Output 'Violet' }\n    'Wednesday' { Write-Output 'Indigo'\
    \ }\n    'Thursday' { Write-Output 'Blue' }\n    'Friday' { Write-Output 'Green'\
    \ }\n    'S*' { Write-Output 'Orange' }\n}\n```\n\n# 工作原理...\n\n正如我们所看到的，在这种情况下，编写、执行和排错\
    \ `Switch–Case` 结构要比编写一系列 `if–elseif–elseif–elseif–...–else` 语句更高效。在 `Switch–Case`\
    \ 中定义一个捕获操作请使用 `Default`。\n\n`Switch–Case` 结构还支持通配符 (`-Wildcard`) 和正则表达式 (`-Regex`)。通常情况下，除非已经涵盖了所有可能的结果，否则省略\
    \ `Default` 不是一个好习惯。\n\n`Switch–Case` 的工作原理很简单：它会将条件与所有定义值进行检查，每当发现条件真时，就会执行相应的脚本块。因此，如果五个条件中满足了三个，这三个脚本块都将被执行。这与\
    \ `If–ElseIf–Else` 略有不同，后者在遇到第一个 `$true` 并执行脚本块的瞬间就会退出分支结构。因此，如果你只想让结构产生一个结果，请考虑在每个脚本块中添加\
    \ `break` 关键字，以便在遇到 `$true` 时跳出结构。例如：\n\n```\n...\n    'Monday' {\n        Write-Output\
    \ 'Red'\n        break\n    }\n...\n```\n\n当然，在特定的情况下，没有必要，因为结果是互斥的。\n\n# 学习使用延迟\n\
    \nPowerShell 通常逐条执行语句；当前语句必须返回缓冲区（可以这么说以便下一步开始执行。然而，在某些情况下，你仍然需要等待；即在实现预期结果之前缓冲区就可以返回的情况。\n\
    \n虽然设置此类内容可能需要一些操作，但为了简单起见，让我们假设我们需要五秒钟来记录星期几（当然，不信也可以行），然后再被指示穿什么。\n\n# 如何实现...\n\
    \n让我们结合上一个食谱中的两个脚本，*使用条件控制脚本流*。\n\n1. 打开一个新文件并输入以下内容：\n\n```\n$Date = Get-Date\n\
    \nif ($Date.DayOfWeek -in 'Saturday', 'Sunday') {\n    Write-Host 'We party on\
    \ weekends!' -BackgroundColor Yellow -ForegroundColor Black\n}\nelseif ($Date.DayOfWeek\
    \ -eq 'Wednesday') {\n    Write-Host 'Half the week is over, and I want to do\
    \ so much more!'\n}\nelse {\n    Write-Host 'Work is worship. Ahem!'\n}\n\nStart-Sleep\
    \ -Seconds 5\n\n$Date = Get-Date\n\nswitch ($Date.DayOfWeek) {\n    'Monday' {\
    \ Write-Output 'Wear red.'; break }\n    'Tuesday' { Write-Output 'Wear violet.';\
    \ break }\n    'Wednesday' { Write-Output 'Wear indigo.'; break }\n    'Thursday'\
    \ { Write-Output 'Wear blue.'; break }\n    'Friday' { Write-Output 'Wear green.';\
    \ break }\n    Default { Write-Output 'Poor you, working today. Wear orange.';\
    \ break }\n}\n```\n\n![](img/9586edab-e1bb-444a-a119-28584db1a57b.png)\n\n# 工作原理...\n\
    \n这之所以是一个独立的食谱，是因为它是流程控制的一部分，在某些特定情况下非常有用。`Start-Sleep` 内部接受 `Seconds` 或 `Milliseconds`\
    \ 作为输入，并在处理下一个指令之前等待相应的时间。\n\n# 编写基础循环结构\n\n如果没有循环，自动化可能只完成了一半。毕竟，在大多数情况下，自动化的意义是让计算机做重复性的工作。PowerShell\
    \ 中共有六种循环结构：\n\n1. 使用 `Foreach-Object` 循环\n2. `Foreach` 循环\n3. `For` 循环\n4. `While`\
    \ 循环\n5. `Do–While` 循环\n6. `Do-Until` 循环\n\n`Foreach-Object` 循环结构可能是这些中最简单的。\n\
    \n让我们想象有一份参加某活动的五位客人名单，你想逐个欢迎他们。\n\n# 如何实现\n\n假设客人是 Mr Jain、Mr Jacobs、Ms Sanders、Mr\
    \ Shah 和 Mr Hugo。\n\n1. 在 Visual Studio Code 中打开一个新文件，并在脚本面板中输入以下内容。\n\n```\n\
    $GuestsRaw = Read-Host \"Enter the guest names, separated by commas\"\n$Guests\
    \ = $GuestsRaw -split \",$([regex]'[\\s]*')\"\n\n$Guests | ForEach-Object { Write-Output\
    \ \"Welcome, $PSItem!\" }\n```\n\n2. 运行脚本，并在提示处输入客人的名字：\n\n```\nPS> Mr Jain, Mr\
    \ Jacobs, Ms Sanders, Mr Shah, Mr Hugo\n```\n\n# 工作原理...\n\n你首先通过主机的提示获取输入。获取了原始客人列表。然后\
    \ PowerShell 根据逗号和正则表达式匹配来分割输入字符串（这是必要的，以确保无论输入中逗号后是否有空格都能正常工作：并非所有用户都是一样的）。我们使用\
    \ `-split` 和转换运算符来执行操作。\n\n循环部分在 `Foreach-Object` 出现。你将数组对象传递给管道。`Foreach-Object`\
    \ 内部程序获取数组并一次处理一个元素。在循环内部引用元素时，你使用 `$PSItem`（也称为 `$_`）自动变量，因为该对象已经通过管道传递了。\n\n\
    # 在预定义数组上编写更复杂的循环\n\n在在上一个食谱“编写基础循环结构”中，我们通过管道传递内容编写了一个简单的循环。现在，让我们考虑我们拥有相同的客人，但为他们分配了特定的座位。我们想向客人显示座位。你有如下\
    \ CSV 格式的表格。\n\n| Name | Seat | \n| :--- | :--- |\n| Mr Jain | A-12 |\n| Mr Jacobs\
    \ | C-28 |\n| Ms Sanders | B-17 |\n| Mr Shah | M-22 |\n| Mr Hugo | E-08 |\n\n\
    # 如何实现...\n\n这里的假设是每行有四十个座位，过道穿过大厅中心。\n\n1. 如果你还没有克隆仓库，可以创建自己的 CSV 文件。可以复制下面的逗号分隔内容，或者使用\
    \ PowerShell 创建 CSV。\n\n```\nPS> @'\nName,Seat\nMr Jain,A-12\nMr Jacobs,C-28\n\
    Ms Sanders,B-17\nMr Shah,M-22\nMr Hugo,E-08\n'@ | Out-File -Path './chapter-08/05-Write-GuestSeatDetails.csv'\n\
    ```\n\n2. 在 Visual Studio Code 中打开一个新的 PowerShell 文件并输入以下脚本：\n\n"
- fmt: "\n```bash\n$Guests = Import-Csv './chapter-08/05-Write-GuestSeatDetails.csv'\n\
    \nforeach ($Guest in $Guests) {\n    $RowIdentifier = [byte][char](($Guest.Seat\
    \ -split '-')[0].ToUpper())\n    $RowNumber = ($RowIdentifier - 64).ToString()\n\
    \n    switch -Regex ($RowNumber) {\n        '1(1|2|3)$' { $RowNumber += 'th';\
    \ break }\n        '.?1$'      { $RowNumber += 'st'; break }\n        '.?2$' \
    \     { $RowNumber += 'nd'; break }\n        '.?3$'      { $RowNumber += 'rd';\
    \ break }\n        Default     { $RowNumber += 'th'; break }\n    }\n\n    $SeatNumber\
    \ = ($Guest.Seat -split \"-\")[1]\n\n    if ($SeatNumber -gt 20) {\n        $Side\
    \ = 'right'\n    }\n    else {\n        $Side = 'left'\n    }\n\n    Start-Sleep\
    \ -Seconds 1\n    Write-Host \"Welcome, $($Guest.Name)! \" -NoNewline\n    Start-Sleep\
    \ -Seconds 1\n    Write-Host \"Your seat is in the $RowNumber row, to the $Side\
    \ the aisle.\"\n}\n```\n\n3. Run the script.\n\n![](Images/05449802-4f16-462e-a2a1-6ddfb8a26793.png)\n\
    \n# How it works...\n\nThe main idea here is the use of `foreach`. When using\
    \ the `Foreach` loop construct, you refer to each element with a variable; variables\
    \ are not identified with an index in this case. For every iteration, in our case,\
    \ `$Guest` picks one value from `$Guests`, in sequence, so that the current element\
    \ can be referred using `$Guest`.\n\nThe seat numbers have a pattern: an alpha\
    \ row identifier, followed by a hyphen, followed by the numeric seat identifier.\n\
    \nThe seat number is a string. We split it at `-`, pick the first element in the\
    \ resultant array, convert it to uppercase (in case it already isn't), convert\
    \ this letter to a character, and then, use the `[byte]` cast operator to find\
    \ its ASCII identifier. And yes, we subtract 64 from it (so `A` becomes `1`).\n\
    \nTo be able to use the number with switch–case without errors, we convert the\
    \ number back to a string. We make the number friendly for use in a sentence.\
    \ We take the second (numeric) part of the array to see which side of the aisle\
    \ the seat is located on. We combine all these to get the resultant greeting-and-guidance\
    \ strings, which are displayed after a delay of one second each.\n\n# Using the\
    \ For loop construct\n\nThe `Foreach` loop and the `For` loop are different in\
    \ that the latter uses an index to perform operations. We need a variable to control\
    \ the flow, whose values form a range. Let us re-implement the same solution as\
    \ that in *Writing a more complex loop on a predefined array*, but with a `For`\
    \ loop construct instead.\n\n# How to do it...\n\nThe assumptions made are the\
    \ same as that in *Writing a more complex loop on a predefined array*.\n\n1. Open\
    \ a new file and paste the following content into it.\n\n```bash\n$Guests = Import-Csv\
    \ './chapter-08/05-Write-GuestSeatDetails.csv'\n\nfor ($CurrentGuest = 0; $CurrentGuest\
    \ -lt $Guests.Length; $CurrentGuest++) {\n    $Guest = $Guests[$CurrentGuest]\n\
    \n    $RowIdentifier = [byte][char](($Guest.Seat -split '-')[0].ToUpper())\n\n\
    \    $RowNumber = ($RowIdentifier - 64).ToString()\n\n    switch -Regex ($RowNumber)\
    \ {\n        '1(1|2|3)$' { $RowNumber += 'th'; break }\n        '.?1$'      {\
    \ $RowNumber += 'st'; break }\n        '.?2$'      { $RowNumber += 'nd'; break\
    \ }\n        '.?3$'      { $RowNumber += 'rd'; break }\n        Default     {\
    \ $RowNumber += 'th'; break }\n    }\n\n    $SeatNumber = ($Guest.Seat -split\
    \ \"-\")[1]\n\n    if ($SeatNumber -gt 20) {\n        $Side = 'right'\n    }\n\
    \    else {\n        $Side = 'left'\n    }\n\n    Start-Sleep -Seconds 1\n   \
    \ Write-Host \"Welcome, $($Guest.Name)! \" -NoNewline # Subexpression `$Guest.Name`\
    \ to be computed first.\n    Start-Sleep -Seconds 1\n    Write-Host \"Your seat\
    \ is in the $RowNumber row, to the $Side the aisle.\"\n}\n```\n\n2. Run the script.\n\
    \n# How it works...\n\nSome of you might be pointing out that the `foreach` construct\
    \ was simpler than the `for` construct in this case, and you would be right. In\
    \ my stint as an administrator, I may have used the for construct less than ten\
    \ times over the last three years, compared to hundreds of times I used `foreach`.\
    \ The `For` construct has its own uses; use with a predefined array is of the\
    \ less-efficient ones.''\n\nRegardless, `for` works as long as the object is an\
    \ array. `$CurrentGuest` is the index we use, which ranges from 0 through the\
    \ total elements in `$Guests` – 1\\. The loop starts with the index being initialised\
    \ at 0 in this case, and after every iteration of the script block, the index\
    \ is incremented (`$CurrentGuest++`).\n\nOne operation where `for` would be more\
    \ efficient than `foreach` is if every *alternate* guest had to be greeted (rude,\
    \ I know). In that case, the third part of the definition of `for` would have\
    \ been `$CurrentGuest += 2`.\n\n`$CurrentGuest + 2` instead of `$CurrentGuest\
    \ += 2` would make this loop infinite, since the value of `$CurrentGuest` would\
    \ not be changed at all.\n\n# Using the While loop construct\n\nWe shall create\
    \ two scripts in this recipe: the first one to establish the similarities between\
    \ For and While, and another to lay the foundation to understanding the Do–While\
    \ and Do–Until constructs. This way, the learning would be incremental, and understanding,\
    \ easier.\n\nFor the first script, the scenario is the same as described in the\
    \ last recipe, *Using the For loop construct*. For the second, the task is to\
    \ take the year number as input and find the date for Mothers’ Day in that year.\n\
    \n# How to do it\n\nFirst, continue with the assumptions you had for the previous\
    \ recipe.\n\n1. Open a new file and paste the following content into it.\n\n```bash\n\
    $Guests = Import-Csv './chapter-08/05-Write-GuestSeatDetails.csv'\n$CurrentGuest\
    \ = 0\n\nwhile ($CurrentGuest -lt $Guests.Length) {\n    $Guest = $Guests[$CurrentGuest]\n\
    \n    $RowIdentifier = [byte][char](($Guest.Seat -split '-')[0].ToUpper())\n \
    \   $RowNumber = ($RowIdentifier - 64).ToString()\n\n    switch -Regex ($RowNumber)\
    \ {\n        '1(1|2|3)$' { $RowNumber += 'th'; break }\n        '.?1$'      {\
    \ $RowNumber += 'st'; break }\n        '.?2$'      { $RowNumber += 'nd'; break\
    \ }\n        '.?3$'      { $RowNumber += 'rd'; break }\n        Default     {\
    \ $RowNumber += 'th'; break }\n    }\n\n    $SeatNumber = ($Guest.Seat -split\
    \ \"-\")[1]\n\n    if ($SeatNumber -gt 20) { $Side = 'right' }\n    else { $Side\
    \ = 'left' }\n\n    Start-Sleep -Seconds 1\n    Write-Host \"Welcome, $($Guest.Name)!\
    \ \" -NoNewline\n    Start-Sleep -Seconds 1\n    Write-Host \"Your seat is in\
    \ the $RowNumber row, to the $Side the aisle.\"\n\n    $CurrentGuest++\n}\n```\n\
    \n2. Run the script; the output should be the same as that of the last recipe.\n\
    \n3. Now, create a new PowerShell file and add the following code:\n\n```bash\n\
    $Year = Read-Host \"Enter the year (YYYY) you would like to find Mothers’ Day\
