  trans: "\n\n在使用 `while` 循环时要稍微小心；你更容易陷入无限循环，因为很容易忘记添加起始点或移向停止点移动的操作。\n\n现在来看母亲母亲节。我们首先获取该年份\
    \ 5 月 1 日的日期对象，这样我们就可以使用其成员对其进行操作。该日期就是起始点。然后，我们指定条件：“如果当天不是星期日，则继续循环”。接着，在每次迭代中增加一天。每次迭代后，都会根据条件检查该变量。最后，当遇到第一个星期日时，变量跳出循环。然后我们对其基础上增加一周以找到第二个星期日，并输出\
    \ `$MothersDay` 值的长日期版本。\n\n# 使用 Do–While 结构清理空目录\n\n在上一个食谱中，我们使用年份作为输入找到了 5 月的第二个星期日。我们使用\
    \ `While` 循环来实现这一点。`While` 循环在开始迭代之前就会检查条件。如果条件在一开始就返回 `$false`，循环甚至不会开始；例如，如果你输入的年份是\
    \ `2016`。\n\nDo–While 略有不同；无论条件是否成立，循环都会执行一次。条件只在第一次迭代*之后*检查。\n\n本食谱的场景是：我们要删除特定目录下的所有空目录。\n\
    \n# 准备工作\n\n为了使用此食谱，让我们在 `$HOME/random` 中创建几个空目录。使用本书 git 仓库中的输入文件来创建这些目录。\n\n\
    ```\nPS> Get-Content ./chapter-08/08-input-file.txt | ForEach-Object { New-Item\
    \ $($PSItem -replace '\\.', \"$HOME/random\") -ItemType Directory }\n```\n\n#\
    \ 如何操作...\n\n如果你在 `random` 实验室目录下运行以下食谱，所有的空子目录都将被删除。\n\n1. 打开新文件并将以下内容粘贴进去。\n\
    \n```\ndo {\n    $AllDirectories = (Get-ChildItem -Path $HOME/random -Recurse\
    \ -Directory).FullName\n    $EmptyDirectories = $AllDirectories | Where-Object\
    \ {(Get-ChildItem $PSItem).Count -eq 0}\n    $EmptyDirectories | Remove-Item\n\
    } while ($EmptyDirectories.Count -gt 0)\n```\n\n2. 让我们添加一些日志，以便我们知道发生了什么。\n\n\
    ```powershell\n$Iteration = 0\ndo {\n    $AllDirectories = (Get-ChildItem -Path\
    \ $HOME/random -Recurse -Directory).FullName\n    $EmptyDirectories = $AllDirectories\
    \ | Where-Object {(Get-ChildItem $PSItem).Count -eq 0}\n    $EmptyDirectories\
    \ | Remove-Item\n\n    \"Iteration $Iteration. Removed the following $($EmptyDirectories.Count)\
    \ directories.\"\n    $EmptyDirectories\n    $Iteration++\n} while ($EmptyDirectories.Count\
    \ -gt 0)\n```\n\n![](img/c622064b-ee5e-4f8c-8898-3b6fcb535608.png)\n\n# 工作原理...\n\
    \n执行过程与 `While` 结构类似，但如 `Iteration 0` 所示，Do–While 结构在不检查条件的情况下执行一次脚本块。在我们的情况下，我们在循环内部查询了空目录。如果我们把此查询放在循环之外，那么为了控制循环，我们也必须将其放在循环内部。那是低效的编程。\n\
    \nPowerShell 在执行脚本块期间找到了九个空目录。当执行后进行条件检查时，`9` 被评估为大于 `0`。循环再次运行。这次 `$EmptyDirectories.Count`\
    \ 的值被评估为 `4`。循环再次运行，这一次值再次是 `4`，大于 `0`；条件仍为 `$true`。在下一次运行中，`$EmptyDirectories.Count`\
    \ 被评估为 `2`，然后是 `1`，最后在最后一次运行中变为 `0`。此时，条件的结果变为 `$false`，循环退出。从本质上，该循环语句是：“只要计数*大于*零就*继续*。”\n\
    \n# 另请\n\n1. 食谱 5.7：对返回的对象采取操作\n\n# 使用 Do–Until 结构清理空目录\n\n很容易混淆 Do–While 和 Do–Until，因为它们之间有许多相似之处。然而，它们之间的区别实际上非常清晰。Do–While\
    \ 循环只要条件检查的结果为 `$true` 就会执行，并在变为 `$false` 的一刻退出。Do–Until 则相反：只要条件检查返回 `$false`，循环就会继续，并在条件检查返回\
    \ `$true` 的一刻停止。\n\n让我们使用相同的清理空文件夹的场景，但这次使用 Do-Until 循环。\n\n# 如何操作...\n\n你需要重新运行命令来创建那些空目录。\n\
    \n1. 打开新文件并将以下内容粘贴进去。\n\n```powershell\n$Iteration = 0\ndo {\n    $AllDirectories\
    \ = (Get-ChildItem -Path $HOME/random -Recurse -Directory).FullName\n    $EmptyDirectories\
    \ = $AllDirectories | Where-Object {(Get-ChildItem $PSItem).Count -eq 0}\n   \
    \ $EmptyDirectories | Remove-Item\n    $Count = $EmptyDirectories.Count\n\n  \
    \  \"Iteration $Iteration`nRemoved the following $Count directories. '$Count =\
    \ 0' is $($Count -eq 0)\"\n    $EmptyDirectories\n    $Iteration++\n} until ($Count\
    \ -eq 0)\n```\n\n2. 注意这次行为的变化，并将其与 Do–While 的运行进行对比。\n\n![](img/368f892a-96c9-4179-b2aa-56ae1c662904.png)\n\
    \n# 工作原理...\n\n这一次通过交互式输出清楚地展示了它是如何工作的。第一次运行是在没有检查条件的情况下进行的。在运行结束时，检查了条件。`9` 大于\
    \ `0` 且不相等。结果为 `$false`，因此循环继续。一直这样下去，直到计数降到 `0`（使得条件结果变为 `$true`），在此时，循环退出。从本质上，该循环语句是：“*直到*计数*变为*零才停止。”\n\
    \n我们关于流程控制的章节到此结束。我希望你在学习这些技术时过得愉快，希望这一章能帮助你在学习使用 PowerShell 后完成想要的大部分自动化工作。\n\
    \n# 字符串处理\n\n*即将推出...*\n\n# 执行计算\n\n在本章中，我们讨论了以下主题：\n\n1. 执行算术运算\n2. 对输出结果进行计算\n\
    3. 使用管理常量\n4. 使用计算属性\n5. 使用二进制数操作\n6. 执行基数转换\n\n# 技术要求\n\n以下是学习本章的技术要求。\n\n1.\
    \ 计算机上安装了 PowerShell。具体步骤请参考*安装、参考和帮助*。\n\n2. Visual Studio Code（推荐）。请参考章节*使用\
    \ PowerShell 进行管理准备*中的食谱，*安装 Visual Studio Code*。\n\n3. 为食谱准备一些一次性文件。使用书籍 GitHub\
    \ 仓库中 `ch05` 目录下的脚本 `Initialize-PacktPs6CoreLinuxLab.ps1`。\n\n本章使用的脚本位于：[https://github.com/PacktPublishing/PowerShell-6.0-Linux-Administration-Cookbook/tree/master/ch09]。\n\
    \n"
- fmt: "\nAs administrators, we do not use much of arithmetic operations like the\
    \ `sin`, `cos`, `log` and `exp` operations. However, it is possible to do all\
    \ of them on PowerShell, since PowerShell can leverage .NET. In general, we may\
    \ use these operations as administrators: `Abs` (as in absolute), `Ceiling`, `Floor`,\
    \ `Round` and `Truncate`. In this recipe, we will use three of these methods,\
    \ based on the scenario we have. Use of the other methods is very similar. Here\
    \ is the scenario:\n\nYou have an application that creates logs throughout the\
    \ day. These logs consume a lot of space. You would like to clean up logs that\
    \ are between 30 and 31 days old. You are not allowed to use a dual condition\
    \ for comparison.\n\nCreate a function that looks for files of 30 days of age.\
    \ Your script should also say how much of the log space was cleared, rounded off\
    \ to the nearest megabyte.\n\n# Getting Ready\n\nRun the script, `Initialize-PacktPs6CoreLinuxLab.ps1`\
    \ from within the `ch05` directory of the book's GitHub repository. This is just\
    \ so we have some files to work on. Next, run the script, `Set-LastWriteTime.ps1`\
    \ from within the `ch09` directory of the repository.\n\nIf you would like to\
    \ specify a path other than `~/random` for the content, add `-Path '//your/custom/path'`\
    \ to the last line of the script. Ensure you do this in both scripts.\n\n# How\
    \ to do it...\n\nNavigate to the directory that contains your lab files; here\
    \ is where all the action happens. If you did not specify a custom -Path when\
    \ running the scripts, it should be `~/random`.\n\n1. Open the terminal and, using\
    \ a code editor (`vi`, `nano` or VS Code), create a new file called `Clear-LogFiles.ps1`.\
    \ Remember, CamelCase is just a convention.\n\n2. Enter the following content.\
    \ I suggest typing it by yourself rather than copy-pasting it.\n\n```\n$Today\
    \ = Get-Date\n$TotalFileSize = 0\n\n$FilesToDelete = Get-ChildItem . -Recurse\
    \ -File | Where-Object {[math]::Floor(($Today - $_.LastWriteTime).TotalDays) -eq\
    \ 30}\n\nWrite-Host \"The following files will be deleted:\"\nWrite-Host $FilesToDelete.FullName\n\
    \nforeach ($File in $FilesToDelete) {\n    $TotalFileSize += $File.Length\n  \
    \  Remove-Item -Path $File -WhatIf\n}\n\nWrite-Host \"Total space cleared: $([math]::Round($TotalFileSize/[math]::Pow(1024,\
    \ 2))) MB\"\n```\n\nThere is no need to actually delete the files. If you would\
    \ like to anyway, remove the `-WhatIf` switch from line 12.\n\nIt is recommended\
    \ to use Visual Studio Code to write this script since its IntelliSense auto-completion\
    \ is very helpful. You could write this script at the terminal itself, in which\
    \ case, use shorter versions of parameters and tab-completions as necessary.\n\
    \n# How it works...\n\nThe `[math]::` accelerator allows us to use the methods\
    \ of the `System.Math` class. The `Round()` method accepts one or two arguments;\
    \ in case of a single argument, the rounding happens to the nearest integer. The\
    \ optional second parameter specifies the number of digits after the decimal point.\n\
    \nThe `Pow()` method is almost self-explanatory: 1024² in our case. The `Floor()`\
    \ method brought down numbers from 30.00 to less than 31, down to 30.\n\nThis\
    \ is what we did:\n\n1. Listed out the files to delete: we subtracted the `LastWriteTime`\
    \ from today, and performed a Floor operation on it since we were not allowed\
    \ to use the `-and` operator.\n2. Displayed the files.\n3. We performed a remove\
    \ operation on each of the files, while also adding the size of each of the files\
    \ to `$TotalFileSize`.\n4. In the end, we divided `$TotalFileSize` by 1024² and\
    \ rounded it off to the nearest MB.\n\n# See also\n\n1. [System.Math Methods](https://msdn.microsoft.com/en-us/library/system.math_methods(v=vs.110).aspx)\
    \ (Microsoft documentation)\n\n# Performing calculations on the output\n\nIn the\
    \ last recipe, we performed some nifty calculations on the objects themselves,\
    \ and listed out files that were 30 days old. In the process, we also output the\
    \ total amount of space to be cleared. In this recipe, we will output this information\
    \ as a PowerShell object, and also perform a small calculation during output.\
    \ Here is the scenario:\n\nModify the script you created in Performing Arithmetic\
    \ Operations to output a structured `PSCustomObject`. The output should have the\
    \ total number of files in the directory, files that are 30 days old, and the\
    \ total amount of space cleared (without any calculations). Also, separately,\
    \ show the amount of space cleared by the cleanup, in MB.\n\n# Getting ready\n\
    \nIf you don't have the lab files or you deleted the files in the previous recipe,\
    \ run the script, `Initialize-PacktPs6CoreLinuxLab.ps1` from within the `ch05`\
    \ directory of the book's GitHub repository. Next, run the script, `Set-LastWriteTime.ps1`\
    \ from within the `ch09` directory of the repository.\n\n# How to do it\n\nWe\
    \ will simply build on the previous recipe to save ourselves some time and effort.\
    \ The changes from the script in the previous recipe have been emboldened.\n\n\
    1. Open your favourite code editor, enter the following in the file and save the\
    \ file as a `ps1` file.\n\n```\n$Today = Get-Date\n$TotalFileSize = 0\n\n$AllFiles\
    \ = Get-ChildItem . -Recurse -File\n$FilesToDelete = $AllFiles | Where-Object\
    \ {[math]::Floor(($Today - $_.LastWriteTime).TotalDays) -eq 30}\n\nforeach ($File\
    \ in $FilesToDelete) {\n    $TotalFileSize += $File.Length\n    Remove-Item -Path\
    \ $File -WhatIf\n}\n\nNew-Object -TypeName psobject -Property @{\n    TotalFiles\
    \ = $AllFiles.Count\n    FilesToDelete = $FilesToDelete.Count\n    SpaceCleared\
    \ = $TotalFileSize\n}\n```\n\n2. Call the PowerShell script.\n\n```\n& $HOME/Documents/code/github/powershell/ch09/02-Clear-LogFiles.ps1\n\
    ```\n\nHere is a glimpse of what that outputs.\n\n![](Images/23e66bdf-6918-40c5-a598-2fcce9dc03f6.png)\n\
    \n3. Now, pick just the `SpaceCleared` parameter.\n\n```\n(& $HOME/Documents/code/github/powershell/ch09/02-Clear-LogFiles.ps1).SpaceCleared\n\
    ```\n\nNotice the reference to the `SpaceCleared` property, and the output just\
    \ before the prompt.\n\n![](Images/f40eaf52-ba68-4227-8ced-94c8e9a8dfdf.png)\n\
    \n4. Divide the output by 1024² to get the value in MB.\n\n```\n(& $HOME/Documents/code/github/powershell/ch09/02-Clear-LogFiles.ps1).SpaceCleared/[math]::Pow(1024,\
    \ 2)\n```\n\nSimilar to the one above; the total space cleared in MB.\n\n![](Images/82f3680a-fbf5-46d3-9d2e-614f73356e49.png)\n\
    \n# How it works\n\nNot only cmdlets and functions, but scripts also output objects.\
    \ In the previous recipe, this was a string object; in this it was a `PSCustomObject`.\
    \ This way, even though the information gathered from both recipes was the same,\
    \ we were able to process the output further by running calculations on the fly.\n\
    \n# There's more\n\n1. Perform a `Round()` operations on `SpaceCleared` to get\
    \ the output in MB, with two digits after the decimal point.\n2. Show the number\
    \ of files that were omitted from deletion.\n\nAssign the output object of the\
    \ script to a variable: `$CleanupInfo = (& //path/to/02-Clear-LogFiles.ps1)` in\
    \ order to make things easier.\n\n# Working with Administrative Constants\n\n\
    The one thing that may have irked a few of us was how difficult it was to convert\
    \ the `Length` property to MB. We had to go `[math]::Pow(1024, 2)`. Simplify the\
    \ output of the previous recipe.\n\nAlso, imagine that you have these files loaded\
    \ on a 250 GB SSD, and you would like to see what percent of space was cleared.\n\
    \n# Getting ready\n\nIf don't have the lab files or you deleted the files in the\
    \ previous recipe, run the script, `Initialize-PacktPs6CoreLinuxLab.ps1` from\
    \ within the `ch05` directory of the book's GitHub repository. Next, run the script,\
    \ `Set-LastWriteTime.ps1` from within the `ch09` directory of the repository.\n\
    \n# How to do it\n\nWe will use the same script as the previous recipe.\n\n1.\
    \ Assign the object returned by the previous recipe to a variable.\n\n```\n$FileCleanupInfo\
    \ = (& //path/to/02-Clear-LogFiles.ps1)\n```\n\n2. Call the `SpaceCleared` property\
    \ and divide it by Administrative Constants.\n\n```\n$FileCleanupInfo.SpaceCleared/1KB\n\
    $FileCleanupInfo.SpaceCleared/1MB\n$FileCleanupInfo.SpaceCleared/1GB\n```\n"
