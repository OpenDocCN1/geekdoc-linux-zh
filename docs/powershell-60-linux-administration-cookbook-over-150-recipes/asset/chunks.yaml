  trans: "\n这意味着你想要将目录 `GitHub` 移动到 `Code`。许多 PowerShell 命令行（cmdlets）在设计时就能理解这种操作。\n\
    \n另一方面，命名参数通过名称调用。帮助文本在显示它们时，周围没有任何括号包围。通过名称调用位置参数是可选的——你只需传递值即可。然而，请注意你提到它们的顺序或位置。\n\
    \n某些参数被添加了预定义的值验证。这些参数只接受在其中定义的数值。例如，在编写本节时，`ItemType` 仅接受 `File`、`Directory`、`SymbolicLink`、`Junction`\
    \ 和 `HardLink` 作为值。\n\n此外，还有开关参数（switch parameters）。`Recurse` 就是一个例子。当你不带任何值调用这些参数时，在大多数情况下这些参数会被假认为\
    \ `True`。当你必须将其设置为 `False` 时，只需提及它们，`-Parameter:$false`（例如 `-Confirm:$false`）。如果你不调用该开关参数，该参数将使用程序指定的默认值。\n\
    \n# 更多内容\n\n如果你想再次创建文件和目录，不要运行四条命令。运行以下两个即可：\n\n```\nNew-Item test-dir/child-dir\
    \ -ItemType Directory -Force\nNew-Item ./test-dir/file1, ./test-dir/file2, ./test-dir/child-dir/file3\n\
    ```\n\n参数 `Force` 在创建 `child-dir` 时会创建 `test-dir`。\n\n如果你愿意，可以在不使用 `Recurse` 参数的情况下删除整个目录。在确认提示界面处，按回车键（`Y`\
    \ 是默认响应）。\n\n# 使用最少按键运行命令行\n\n从历史上看，命令的设计非常短。然而，随着时间的推移，这种情况变成了一种困境，因为短的命令意味着必须记忆，而更长的命令意味着更多的按键。\n\
    \nPowerShell 的命令很长，但它通过两种方式处理：\n\n1. 别名（Aliases），通常更短。\n2. Tab 补全（Tab completion），比别名需要更多的按键，但不需要记忆太多。\n\
    \n第一种方法需要我们根据需要记忆所需的命令名称。另一方面，第二种方法高效地解决了按键问题。\n\nBash 用户习惯了当 Tab 键在上下文中匹配多个字符串时，以整齐的表格格式列出匹配项。而在\
    \ Windows 中，匹配项会在光标处循环切换（这大多数 Bash 用户认为这很“奇怪”）。\n\n尽管如此，Tab 补全是一个福音，而这个配方充分利用\
    \ Tab 补全和简单的字符串匹配，显著减少在使用 PowerShell 命令行时的按键次数。\n\n# 准备工作\n\n我们在本配方中使用 Gnome Terminal\
    \ 终端模拟器，Linux 上 Gnome Terminal 上的 PowerShell Tab 补全行为与 Gnome Terminal 上的 Bash\
    \ 行为完全相同：\n\n* 如果只有一个单词匹配 Tab 键之前的字符串，则该单词会被补全。\n* 如果有多个单词匹配 Tab 键之前的字符串，则会列出所有可能的选项。\n\
    \n如果你在本次配方中使用 VS Code 或不同的终端模拟器，其行为可能会有所不同。\n\n# 怎么操作...\n\n让我们直接开始吧！\n\n假设我们想获取当前目录下文件和目录的列表。\n\
    \n1. 根据最佳实践，执行此操作正确方法是：\n\n```\nGet-ChildItem -Path .\n```\n\n2. 然而，正如我们之前看到的，其简单的方法是：\n\
    \n```\ngci\n```\n\n在脚本中包含命令行时，我们会使用第一种方法。这避免了在脚本运行的大多数环境中的歧义。这通常意味着更少的 Bug。另一方面，后者是通过利用命令行的用户友好特性，结合作为智能人类对环境的感知，运行相同命令的简便方法。这种方法显著减少了按键——只需三个字符，而不是二十一个。\n\
    \n尽管如此，如果你正在编写脚本并想减少按键，你仍然这样做，而无需记住像 `gpv` 代表 `Get-ItemPropertyValue` 这样的内容。\n\
    \n输入：Tab 补全。\n\n3. 遵循下方提到的按键：\n\n```\nget-ch<Tab><Space>.\n```\n\n这些包括 <Enter>\
    \ 在内的十次按键。\n\n在某些情况下，你可能调用命名参数。而命名参数可能很长。\n\n4. 找到一个带有 `ComputerName` 参数的命令。\n\
    \n```\nget-comm<Tab><Space>-param<Tab><Space>computername<Enter>\n```\n\n它会补全为：\n\
    \n```\nGet-Command -Parameter computername\n```\n\n![](img/c624b608-e1c3-4cae-91db-beeec2cef223.png)\n\
    \n但它抛出了错误。错误信息显示：`Possible matches include: -ParameterName -ParameterType`。这是\
    \ Linux 上 PowerShell 的特殊之处。让我们再次尝试：\n\n```\nget-comm<Tab><Space>-param<Tab><Tab>\n\
    ```\n\n![](img/e5f9420d-d558-4df5-957a-64e2e050e962.png)\n\n5. 读取可能的列表并选择 `ParameterName`。\n\
    \n```\nget-comm<Tab><Space>-param<Tab>n<Tab><Space>computername<Enter>\n```\n\n\
    6. 完整的解决方案将是：\n\n```\nGet-Command -ParameterName computername\n```\n\n并且成功了。\n\
    \n接下来，让我们将会会话暂停五秒。执行此操作的命令行是 `Start-Sleep`。\n\n7. 我们先获取该命令的帮助。\n\n```\nGet-Help\
    \ Start-Sleep\n```\n\n帮助文本说明位置一的参数不需要命名是 `Seconds`（在第二个参数集中 Seconds 周围有括号），它接受整数值。\n\
    \n8. 因此，为了让会话暂停五秒，我们将使用：\n\n```\nStart-Sleep 5\n```\n\n9. 如果我们想让会话（或脚本）暂停 100\
    \ 毫秒，我们需要使用命名的 `Milliseconds` 参数。使用 Tab 补全将是：\n\n```\nstart-s<Tab><Space>-mi<Tab>100\n\
    ```\n\n它将解析为：\n\n```\nStart-Sleep -Milliseconds 100\n```\n\n10. 实际上，在使用参数名时你可以减少\
    \ Tab 的次数。只需输入足够让 PowerShell 唯一识别参数名称的字符：\n\n```\nstart-s<Tab><Space>-m<Space>100\n\
    ```\n\n它将解析为：\n\n```\nStart-Sleep -m 100\n```\n\n如果延迟不明显，请稍微增加数字（例如 3000）。\n\n\
    # 原原理...\n\n我们已经看到如何使用别名。别名的的工作方式与普通命令行一样，包括其参数的语法。唯一的麻烦在于我们必须记住别名。正如我们在最佳实践部分将看到的，自定义别名是一个坏主意，因为在任何想要运行带有自定义别名的脚本的地方，都必须导入它们。\n\
    \n另一方面，Tab 补全减少了按键次数，但需要肌肉记忆。这需要一定程度的练习，练习将显著提高生产力。\n\nTab 补全在编写命令行、编写参数名称以及将预定义值传递给参数时都起作用，例如：\n\
    \n```\nset-exec<Tab><Space>-exec<Tab><Space>unre<Tab> \n```\n\n它补全为：\n\n```\n\
    Set-ExecutionPolicy -ExecutionPolicy Unrestricted \n```\n\n在许多情况下，完全不需要使用 Tab\
    \ 补全，例如在 `Start-Sleep` 的情况下。该命令行没有以 `m` 开头的参数。因此，使用 `-m` 就足以让 PowerShell 唯一识别\
    \ `-Milliseconds`。这也节省了我们的 `<Tab>` 键。\n\n在 PowerShell 中编写脚本的生产力是一项通过练习获得的技能。虽然别名确实是提高速度的捷径，但它们也有其风险。另一方面，使用键盘编写脚本有助于肌肉记忆，这不仅帮助我们用\
    \ PowerShell 的思维思考，还有助于加速 Tab 补全，这种补全在控制台运行命令或编写脚本时同样有效。\n"
- fmt: "\nUsing short parameter names is generally not a good practice while scripting;\
    \ use these with a similar caution as aliases. Short parameter names affect readability,\
    \ and also, might break scripts at some point in future. For instance, if you\
    \ call a certain `cmdlet` in a script, with a short parameter name `-comp`, which\
    \ at the time of the creation of the script, stood only for `ComputerName`. Later,\
    \ imagine the `cmdlet` received an update with an added parameter, `-CompatibilityMode`;\
    \ this would break the script that you wrote.\n\n# There's more...\n\nTry to type\
    \ most commonly used `cmdlets` along with the parameters to practice tab completion.\
    \ \n\nGet familiar with VS Code by typing the `cmdlets` in the script pane. Notice\
    \ how cmdlet, parameter and parameter value completion work in VS Code. If you\
    \ prefer completion to work the same way as at the console, refer my custom settings\
    \ JSON in the book’s GitHub repository.\n\n# Finding parameter aliases\n\nWe worked\
    \ with aliases for `cmdlets`, we saw how to uniquely identify parameter names\
    \ without having to type the entire parameter name, and we also looked at leveraging\
    \ the power of tab completion.\n\nTo complete the cycle, let us also look at parameter\
    \ aliases. \n\nAs you may have guessed, parameter aliases work very similar to\
    \ cmdlet aliases. The primary goal of these aliases is to reduce keystrokes. \n\
    \nParameter aliases are not documented in a friendly way, however, can be easily\
    \ found thanks to the object-oriented model of PowerShell. In this recipe, we\
    \ shall look at how to fetch parameter aliases. \n\n# Getting Ready\n\nFind all\
    \ the commands that take in `ComputerName` as a parameter, with minimal keystrokes.\n\
    \n```\nget-comm<Tab>-parametern<Tab>Cn\n```\n\nThis resolves to:\n\n```\nGet-Command\
    \ -ParameterName Cn\n```\n\n![](Images/7de20ecf-5174-4e9e-a5ae-9e024c717114.png)\n\
    \nThe output was the same as what we ran a while ago:\n\n```\nGet-Command -ParameterName\
    \ ComputerName\n```\n\nHow did PowerShell know that `Cn` stands for `ComputerName`?\n\
    \n# How to do it...\n\nParameters are part of `cmdlets`, and `Get-Command` is\
    \ the `cmdlet` that fetches information about `cmdlets`.\n\n1. For this example,\
    \ let us pick the cmdlet, `Invoke-Command`.\n\n```\nGet-Command Invoke-Command\
    \ \n```\n\n2. Examine the object that this command outputs. \n\n```\nGet-Command\
    \ Invoke-Command | Get-Member \n```\n\n3. The output shows a member called `Parameters`.\
    \ Use the member access operator to pick the member. \n\n```\n(Get-Command Invoke-Command).Parameters\
    \ \n```\n\n4. See what members this member contains. \n\n```\n(Get-Command Invoke-Command).Parameters\
    \ | Get-Member \n```\n\n5. Would `Values` show us the information we need? \n\n\
    ```\n(Get-Command Invoke-Command).Parameters.Values \n```\n\n6. Yes, that does\
    \ give us something, but there is too much output. We need only the parameter\
    \ names and their aliases. \n\n```\n(Get-Command Invoke-Command).Parameters.Values\
    \ | select Name, Aliases \n```\n\nThere you go.\n\n# How it works...\n\nWe saw\
    \ while reading about the Core and its capabilities, that PowerShell, most of\
    \ the time, returns objects. And every object can have objects within itself.\
    \ Going by the same path as that of .NET, a member access operator can be used\
    \ to select the members (which could be properties or methods). Properties are\
    \ addressed by simply using the property names, while methods need arguments passed\
    \ to them (an empty pair of parentheses is still needed if no argument is being\
    \ passed).\n\nThe parameters of a `cmdlet` are objects of the output that the\
    \ `Get-Command` `cmdlet` returns. Therefore, calling `Get-Command` with the cmdlet,\
    \ `Invoke-Command` returns data about `Invoke-Command` as the output object. This\
    \ can be further broken down to several other objects (members), among which,\
    \ there is `Parameters`.\n\n`Parameters` itself can be further broken down into\
    \ other members, `Values` being one of them—`Values` contains the names of the\
    \ parameters, as revealed by running `Get-Member`. \n\nWe select two objects from\
    \ within `Values`, called `Name` and `Aliases`. \n\nThese parameter aliases can\
    \ be used in place of parameters themselves. \n\nThere are two caveats with parameter\
    \ aliases: \n\n* They are case-sensitive, which means reaching for the Shift key.\
    \ \n\n* They have to be remembered, even though they have a pattern to them, just\
    \ like how cmdlet aliases do (`ip` for `Import` and `g` for `Get`, for instance).\n\
    \n# Calling a PowerShell script\n\nPowerShell scripts are nothing but a series\
    \ of PowerShell `cmdlets`, each in a line of a `ps1` file. These instructions\
    \ are executed one after the other, similar to the good old shell script. Using\
    \ VS Code makes running PowerShell scripts simpler, in that you simply have to\
    \ run the script to make the script work its magic.\n\nHowever, running PowerShell\
    \ scripts on VS Code is not the usual way of automation for obvious reasons. Also,\
    \ there are many ways to run a PowerShell script. We shall look at a very simple\
    \ way of running the script in this recipe; as we progress in the book, we will\
    \ also add more features to our scripts, and further, will package them into modules\
    \ for future use.\n\n# Getting Ready\n\nThis recipe uses VS Code to write the\
    \ script. While any text or code editor would work for the script, we use VS Code\
    \ because in my experience, VS Code is the friendliest editor for PowerShell scripting.\n\
    \n1. Open VS Code, create a new file.\n\n2. Create a new directory at a convenient\
    \ location (`~/Code`, perhaps?).\n\n3. Save the empty file as `hello-world.ps1`\
    \ within the directory you just created.\n\n4. Observe the bottom right of VS\
    \ Code; it should now say, `PowerShell`.\n\n5. Press `` Ctrl + ` `` to close the\
    \ console at the bottom to reduce distraction.\n\nIf everything is as shown in\
    \ the screenshot below, you are good to go. (Ignore the colour of the status bar\
    \ at the bottom, as well as the git status at the bottom-left for now.)\n\n![](Images/23eb3582-a3de-490a-804e-16c977434c72.png)\n\
    \n# How to do it...\n\n1. At the script pane, type in:\n\n```\nWrite-Host \"Hello,\
    \ World!\"\n```\n\n2. Save (**File** > **Save** or `Ctrl + S`) the script.\n\n\
    3. Click on **Debug** in the left. Alternatively, press `Ctrl + Shift + D`. This\
    \ opens the Debug pane.\n\n4. Press the green play-button-like **Start debugging**\
    \ button.\n\nThe console should pop out and display `Hello, World!`.\n\n5. Let\
    \ us run the script one more time. This time, we will not open the Debug pane.\
    \ Simply, press `F5`.\n\n`Hello, World!` should again be displayed in the console.\n\
    \n![](Images/0ab2165b-fadb-4c0e-b8e4-b7e283c3067.png)\n\nLet us now call the script\
    \ without using the debug controls.\n\n1. Close the file (Ctrl + W).\n\n2. At\
    \ the prompt on the console, type in:\n\n```\n./hello-world.ps1\n```\n\nYou should\
    \ see `Hello, World!` appear.\n\n3. Now, navigate to home.\n\n4. Next, type `&`,\
    \ add a space, `./` and start typing the path to where you stored the script.\
    \ Use tab completion just like you would on Bash.\n\n5. When you reach the location\
    \ of the script file, press Enter to call the file.\n\n![](Images/7d6b31d4-f323-4db3-81a8-b73faf1b9.png)\n\
    \n# How it works...\n\nThe simplest way to run a PowerShell script is to debug\
    \ it at the Integrated Scripting Environment. We use VS Code as our ISE of choice\
    \ in this case. The other two ways of calling the script described in this recipe\
    \ are from the PowerShell console. You may use the integrated console in VS Code,\
    \ or a PowerShell console called at the Terminal for this purpose.\n\nWhen the\
    \ script is located at the present working directory, PowerShell just calls the\
    \ `ps1` file and executes it. Another way of calling PowerShell scripts is to\
    \ use `&` (or the call operator): type `&` followed by a space, followed by the\
    \ path to the script file. This way of calling handles spaces in the path well.\n\
    \nIf the path to the script contains spaces, the path would need to be surrounded\
    \ by quotes. This would make PowerShell think that you are simply giving it a\
    \ string value. PowerShell would, then, simply display the path as text the moment\
    \ you press Enter.\n"
