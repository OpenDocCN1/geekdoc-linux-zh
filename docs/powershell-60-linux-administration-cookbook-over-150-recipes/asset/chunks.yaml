- fmt: '

    Let us step into this recipe with one thing in our mind: objects can contain objects
    within them, which in turn can contain more objects within them. To demonstrate
    this, we shall use the `Get-Process` cmdlet.


    ## How to do it...


    Let us begin with listing out the processes; we shall look at all the properties
    the `Get-Process` cmdlet gives us and look for complex ones.


    1. Select all the properties that are part of the output of the `Get-Process`
    cmdlet. Pick only the first object, so your console is not filled with content.


    ```

    PS> Get-Process | Select-Object -Property * -First 1

    ```


    Observe the property, `Threads`.


    2. Select the name of the process, the ID and the threads.


    ```

    PS> Get-Process | Select-Object -Property Name, Id, Threads

    ```


    3. List out all the threads for the `pwsh` process.


    ```

    PS> Get-Process pwsh | Select-Object -ExpandProperty Threads

    ```


    4. A lot of content is output. Say, we want just the ID, the priority, and the
    start time of the resulting output.


    ```

    PS> Get-Process pwsh | Select-Object -ExpandProperty Threads | Select-Object -Property
    Id, PriorityLevel, StartTime

    ```


    This gave us the ID, the priority level and the start time of all the threads
    that are running under `pwsh`.


    5. What if we use `ExpandProperty` on the ID?


    ```

    PS> Get-Process pwsh | Select-Object -ExpandProperty Threads | Select-Object -ExpandProperty
    Id

    ```


    ![](Images/9a082625-cdef-4a3d-ab7a-dc865b01364f.png)


    ## How it works...


    The default parameter for `Select-Object`, as we have seen, is `Property`. It
    accepts property names and shows their values in the output. The parameter can
    be used to fetch values of multiple properties (`Name`, `Id`, `Threads`).


    However, some properties have more complex objects within them, like how we saw
    in case of the `Threads` property of the object returned by `Get-Process`. A simple
    way to identify complex objects is to see if they are enclosed in curly braces.


    The `ExpandProperty` parameter accepts only a single property name as input and
    expands the property to show its objects. This can again be piped to `Select-Object`
    (or any other relevant cmdlet) for further processing.


    In cases where the object is not complex, `ExpandProperty` simply shows the output
    without its header. If you notice the output of `ExpandProperty`, it does not
    contain the name of the expanded object itself (`Threads` in our case); it contains
    only the value. The value, in turn has multiple properties within it.


    In case of simple properties, using `ExpandProperty` simply strips off the property
    name from the output.


    ## Filtering objects


    In the recipe, *Limit the number of items returned by a cmdlet*, we saw how to
    restrict the output content based on a number. In this recipe, we would look at
    filtering the output based on a certain criterion, and not a number.


    ## Getting ready


    Go back to read the recipe, *Working with date properties*, if you have not read
    it already. This recipe uses one of the properties from the date object to filter
    content. While it is not critical to understand filtration of objects, it still
    demonstrates the simplicity of filtration based on object properties.


    ## How to do it...


    Navigate to the location where you created files for use with this book.


    1. List out the contents of this directory to see what content you have. (If you
    are like me, you would have even forgotten where you created this directory, and
    what content you put in.)


    ```

    PS> Set-Location ~/random

    PS> Get-ChildItem -Path .

    ```


    Notice the names of the properties you got.


    2. Now, pick only those files that are larger than `0` bytes.


    ```

    PS> Get-ChildItem -Path . | Where-Object -Property Length -GT -Value 0

    ```


    3. Pick out all the JPG files from the lot. To do this, add another condition
    to the existing condition. Although, this time, use the `FilterScript` parameter
    instead of `Property`.


    ```

    PS> Get-ChildItem -Path . | Where-Object -FilterScript {$_.Length -GT 0 -and $_.Extension
    -EQ ''.jpg''}

    ```


    4. Add a condition to get only those files whose names start with ''c''.


    ```

    PS> Get-ChildItem -Path . | Where-Object -FilterScript {$_.Length -GT 0 -and $_.Extension
    -EQ ''.jpg'' -and $_.Name -CMatch ''^c''}

    ```


    5. Now, choose those files which were created before the 30th minute of any hour.


    ```

    PS> Get-ChildItem -Path . | Where-Object -FilterScript {$_.Length -GT 0 -and $_.Extension
    -EQ ''.jpg'' -and $_.Name -CMatch ''^c'' -and $_.LastWriteTime.Minute -LT 30}

    ```


    ![](Images/b3ae5d4b-631d-4e62-9ee6-c0c105aebfb5.png)


    ## How it works...


    Filtration of the output is very simple in PowerShell. Given that the content
    output is an object, we could simply use the properties from within the object
    for the filtration.


    This recipe shows two modes of filtration:


    1. Using one property and comparing its value to the input,


    2. Using a filter script, that uses multiple values, and multiple conditions.


    The `Property` parameter accepts only one property. A conditional operator and
    a value for comparison are added to the statement to filter the output.


    The `FilterScript` parameter, on the other hand, can handle more complex filtration,
    for example, when we need the output to meet several conditions.


    A significant difference between using `Property` and `FilterScript` is the use
    of the automatic variable, `$_`. This variable contains the current object in
    the pipeline. For example, in this recipe, we pass the object from `Get-ChildItem`
    to `Where-Object` through the pipeline. The automatic variable, `$_`, contains
    the object returned by `Get-ChildItem`, so that `Where-Object` can process it.
    `$_.LastWriteTime`, in this case, picks the `LastWriteTime` property from the
    object returned by `Get-ChildItem`.


    Also, the `LastWriteTime` object is of type `System.DateTime` or `DateTime`. (Run
    `(Get-ChildItem .).LastWriteTime | Get-Member` to know more.) Therefore, it is
    possible to break it down further into days, hours, minutes, and so on, which
    is the reason `$_.LastWriteTime` could be used for filtration.


    ## There''s more...


    Try out the `Where-Object` cmdlet on other outputs, such as `Get-Process`.


    ## Grouping the output


    There are situations where we could group the objects, so that we could handle
    each group better, or simply for a more organised output. In this recipe, we will
    look at passing the output of one cmdlet through the pipeline to Group-Object
    and group the output based on a property.


    ### How to do it...


    To group objects based on a property, we use the `Get-ChildItem` cmdlet on the
    files we created for use in this book.


    1. Navigate to the location where you created files.


    ```

    PS> Set-Location ~/random

    ```


    2. List out only the files (exclude the directories).


    ```

    PS> Get-ChildItem -File

    ```


    Or use the shorthand version.


    ```

    PS> gci -File

    ```


    3. Group the objects based on the extension.


    ```

    PS> Get-ChildItem . -File | Group-Object Extension

    ```


    4. The shorthand version of this would be:


    ```

    PS> gci -File | group Extension

    ```


    ![](Images/126cd1df-e553-47c3-becf-a56acb92fb78.png)


    5. Use the `Select-Object` cmdlet to only show the extension and the number of
    files in each extension.


    ```

    PS> Get-ChildItem -Path . -File | Group-Object -Property Extension | Select-Object
    -Property Name, Count

    ```


    6. Is there a simpler way to do this?


    ```

    PS> Get-ChildItem -Path . -File | Group-Object -Property Extension -NoElement

    ```


    7. Now that we know how to handle grouping and expanded property selection, let
    us pick only the JPG files from the lot.


    ```

    PS> Get-ChildItem -Path . -File | Group-Object -Property Extension | Where-Object
    Name -EQ .jpg | Select-Object -ExpandProperty Group

    ```


    ![](Images/f0b16425-bada-4fba-ad2d-f7c9a62124a9.png)


    ## How it works...

