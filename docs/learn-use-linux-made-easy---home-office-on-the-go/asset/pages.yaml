    # CPU Technology

    One of the amazing facts about Linux though, is that it doesn''t support two or
    three processor families but a ridiculous list of CPU technology. Of course we
    start with the obvious x86 and x86-64 architectures, but also PowerPC (things
    like the IBM RS/6000) and IBM''s Power processor. Then there''s the ARM processor,
    which makes it a super choice for an embedded operating system if you''re building
    a small ARM-based device and you want to run custom software on it. Going up the
    scale though, it also supports big systems such as IBM''s S/390 and z mainframe
    architectures.


    # Which Processor?

    See the table above showing which distros support which processors. It includes
    the processors for which mainframe versions are available; for instance, Fedora
    has ''secondary'' versions for the likes of MIPS, but they''re not included as
    these versions aren''t guaranteed to make the release at release time.'
