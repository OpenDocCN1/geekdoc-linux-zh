- pgno: 199
  md: '# HIDDEN NETWORKS


    Most routers with wireless capabilities will advertise the networks they support.
    We saw this when we were getting ready to install, and we were able to pick from
    a list of available networks (see below).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_199_0.png)


    Some people prefer to keep their wireless networks hidden so you can''t see them
    easily. In a security sense, it''s largely a waste of time (all you need is a
    free wireless sniffer tool and you''ll spot them even though they''re hidden),
    but you do come across the concept from time to time. To connect to a network
    of this sort, you simply need to go into the bit of the control panel that you
    configure things manually.


    > Above: You can pick from a list of networks that can be connected to.


    On Fedora 22, you go into the WiFi settings and click ''Connect to Hidden Network...''—a
    pop-up appears that lets you enter the network name, select the type of security
    it''s using and provide the security key (see left).


    | Connection | New... |

    | --- | --- |

    | Network name | Hidden |

    | Wi-Fi security | WPA & WPA2 Personal |

    | Password | ***** |


    # WIRELESS SECURITY


    We mentioned in the last section that when configuring a hidden network, you select
    the type of security it''s using. When you''re connecting to a network that''s
    being advertised to you, there''s no need to do this,


    > Above: Once you''ve entered the name and details, the hidden WiFi connects just
    like it would to any other wireless network.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'and that''s because the Linux machine can deduce the security mechanism that''s
    in place and hence it doesn''t ask you.


    > Hot Tip

    If you choose WEP as your wireless security, it''s the equivalent of replacing
    your front door with a sheet of soggy paper. Just don''t do it.


    The type of security in use is dictated not by the Linux machine but by the device
    hosting the network – your router, or wireless extender, or wireless access point.
    Whatever that''s configured to use, you''ll be able to use on your Linux PC.


    There''s a simple rule with wireless security: never, ever use WEP (Wired Equivalent
    Privacy). WEP is a very, very old standard and although its name suggests that
    it makes the wireless connection as secure as a wired one (that is, one that connects
    via an Ethernet cable) this simply isn''t the case. Technology, which includes
    security technology, has marched on and WEP simply isn''t considered secure any
    more, because it''s really easy to break using modern computers.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_200_0.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_201_0.png)


    # The Keys to Security


    Wireless security has two components: authentication and encryption. The authentication
    component is there to check that you are authorized to use the network. In corporate
    environments, this can be done using advanced techniques that exchange secure
    keys and authenticate your computer against the company''s core network systems.
    For normal users and small businesses though, this generally means using a passcode
    of some sort (preferably a complex one that''s not easy to guess).


    The encryption component is designed to make sure nobody can see what data is
    flowing over your wireless network. Given that you''re using a radio to broadcast
    everything for quite some distance around you, it''s sensible to encrypt the data
    you''re throwing around.'
  merge: -1
  img_proc: true
