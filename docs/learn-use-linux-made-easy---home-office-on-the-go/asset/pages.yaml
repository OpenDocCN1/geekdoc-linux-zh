    portfolio of services and supports development of the Ubuntu distro with that
    income.


    Since there''s no programme of commercial releases, the Ubuntu project instead
    selects every fourth version to be regarded as a highly supported release, with
    new versions every sixth months or so. This means you get long-term support (or
    ‘LTS’) offerings every couple of years.


