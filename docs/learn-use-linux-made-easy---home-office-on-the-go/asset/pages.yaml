    magically became capitalized over the years – we''ll use the fully capitalized
    version to avoid confusion). Why? Because Slack was a ''tied up'' version of a
    thing called SLS that originated in 1992; SUSE 4.2 (the first incarnation, despite
    the number) was a German translation of Slack.


    Debian whose initial incarnation also winked into existence in 1993, thanks to
    the efforts of a single developer, though as with other versions, the community
    grew and made it what it is today. Although perhaps overshadowed these days by
    some of the better-known distros, it was there right at the start.


    Red Hat

    Just a couple of years on, May 1995 saw the advent of Red Hat Linux 1.0; the product
    we know today had the word ''Enterprise'' added in March 2002 with the advent
    of RHEL 2.1 on general release and the realization that Linux stood a chance of
    being taken seriously as a corporate operating system.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_124_0.png)


    > Hot Tip

    Don''t discount Debian – it''s still a very good distro, even though there are
    some big gorilla distros that get much more attention.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_124_1.png)'
