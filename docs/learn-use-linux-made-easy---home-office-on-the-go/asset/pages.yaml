  md: '# INTRODUCING LINUX


    # OPEN SOURCE


    One term that you will often hear bandied about is open source. This phrase stems
    from about the same time as the free software movement was getting underway. It
    started when two other programmers, Eric Raymond and Bruce Perens, founded yet
    another free software movement, one they called the Open Source Initiative (OSI).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_25_0.png)


    The emergence of OSI was due to a political split among free software advocates:
    those who opted for the concept because it led to better programs and those who
    thought there was intrinsically worthwhile about free software. To a certain extent,
    rows continue to this day – there are various strands of opinion about what open
    source and free software mean.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_25_1.png)


