- pgno: 50
  md: '# Text-based Interface


    The answer today is that we wave our mice around and click on things. But that''s
    not the traditional way with Unix and Linux. And anyway, in the early days, PC
    technology was very primitive and a GUI wasn''t even an option – many PCs just
    didn''t have graphics cards or screens capable of displaying anything more than
    a basic text-based interface into which you typed commands. And that interface
    was — and is — called a shell.


    > Hot Tip

    As you''ll see, the shells all have their own variations on how you do things.

    Play with them all and pick your favourite.


    Intrigingly, though, unlike some operating systems that you have Hobson''s choice
    regarding shells, there are actually loads of different shells for the Linux platform
    (see page 68).


    # WHAT DOES THE SHELL DO?


    One of the things to bear in mind with the shell is that it doesn''t actually
    know how to execute many commands. The commands you execute in Linux — for example
    ls to list the files in a directory, or df to check the disk space using your
    computer — are actually separate programs. The shell is merely giving you a mechanism
    to say, for instance, ''Run program ls'' when you want to see the files on the
    disk. The shell tells the kernel to open the file you selected; the program hooks
    directly into the kernel in order to do its work. Think of a Linux command as
    a program — a lump of code that does some processing based on what you tell it.


    In this example, we''ll run ls to list the contents of the current directory:


    ```

    [dsc@localhost ~]$ ls

    Desktop Documents Downloads Music Pictures Public\Templates Videos

    ```'
  merge: -1
