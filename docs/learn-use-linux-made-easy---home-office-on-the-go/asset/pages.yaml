- pgno: 215
  md: '# CONFIGURING A PERSONAL NAS (NETWORK ATTACHED STORAGE) SERVER


    Linux is hugely popular as a server – that is, a machine that hosts some kind
    of service such as file storage, printer co-ordination, a database, an email transport
    system or a web server.


    For internet-facing servers (e.g. corporate web servers) the numbers are vast:
    in the July 2015 Netcraft Web Server Survey (http://news.netcraft.com/archives/2015/07/22/July-2015-web-server-survey.html),
    just over 325 million servers were detected worldwide running the Apache web server
    software, and it''s a safe bet that the vast majority of these are Linux-based.
    Serious numbers, then.


    # SHARE FILES


    Linux servers don''t have to be public-facing. It''s common, for instance, to
    want to have some kind of system at home that you can use to store your files
    so you can either keep a back-up copy or, more commonly, have them shared among
    the family. And people who host their own websites out on the internet will generally
    have some kind of home


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_215_0.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'machine to do their development on, so they can get everything just right before
    uploading the code to the internet. We''ll look at a couple of the common things
    people do, then.


    # NETWORK FILE SYSTEM


    First, we''ll look at how to run up a fileserver using a Linux machine. Now, we
    could use a thing called NFS


    (Network File System), because this is the native file-sharing protocol for Unix-style
    systems such as Linux. The thing is that not many people have machines that support
    NFS – we''re all Windows or Mac users. Since the majority of machines connecting
    to our server will be Windows PCs, we''ll go with the Windows standard, which
    is variously called SMB (Server Message Block) or CIFS (Common Internet File System)
    – and we''re not alienating Mac or Linux clients by doing this, because they can
    both access SMB file shares.


    > Hot Tip

    Yes, Linux can serve AppleShare filestores and you can persuade Windows to mount
    NFS (Unix-style) ones. But everyone uses SMB, so stick with that for maximum accessibility.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_216_0.png)'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# DOING THE SAMBA


    On Linux, SMB is implemented using the Samba package, which originated in 1992
    and was a massive hit right from the start. This is a standard part of the Fedora
    installation on our test machine, and although we''ve shown some of our examples
    using command line instructions, we''ll show some of this one with the graphical
    configuration interface. Well, it''s friendlier than typing commands, so why not?


    # BEFORE WE START


    In order to run the configuration process, we have to be able to run administrator-level
    functions. There are two ways to do this:


    +   - Log in as the ''root'' user on the Linux machine before you start the configuration
    process.


    +   - Log in as a user that you''ve created as an ''Administrator''.


    For this example, we''ve logged in as ''root''.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_217_0.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_218_0.png)


    # OUR SHARING SETUP


    The setup we''ll go with is fairly basic: we''ll create the user ''max'', and
    he''ll have his own personal directory that''s private to him. Once you''ve got
    your basic Samba setup working, this is 95 per cent of the battle won – if you
    then want to go on and start playing with shared directories and the like, you
    won''t find it overly difficult.


    # CREATE THE USER


    A much less taffy way to create a user is simply to use the user add command to
    do all of the above in a couple of commands. First, the user creation:'
  merge: -1
  img_proc: true
- pgno: 219
  md: '```

    [root@fileserver-local ~]# useradd -c ''Max Cooter'' max

    ```


    Now we''ll set the password:


    ```

    [root@fileserver-local ~]# passwd max

    Changing password for user max.

    New password:

    Retype new password:

    passwd: all authentication tokens updated successfully.

    ```


    # SETTING UP SAMBA


    If you don''t have Samba installed, get out your package manager and install it
    (dnf install Samba for us). We do this by editing the file ''smb.conf'' in the
    ''/etc'' directory, which we can do with the Files feature in the Activities menu
    — just scroll to the right and double-click it.


    The config file looks scary – but don''t panic! You only have to edit a very small
    number of bits in order to get going. We''re going to configure our server as
    a stand-alone machine (because it is – it''s not part of a corporate directory
    service). We''ll put it in会不会 ''LINUXWG'' and we call the machine ''LINUXSVR'':
    So we just look for the lines that match the left-hand side (the bit before the
    ''–'' sign) of each and update the right-hand side. Don''t randomly throw them
    in, or it''s unlikely to work – the config file is in sections and you''re likely
    to put things in the wrong place. Note also that you''ll find some lines that
    look like these but start with a '';'' or a ''#''. These are comments, so they
    won''t work unless you remove the leading '';'' or ''#''.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_219_0.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'workgroup = LINUXWG

    netbios name = LINUXSVR

    hosts allow = 127. 192.

    security = user

    passdb backend = tbdsam


    Note the third line here – it''s a list of IP address ranges that the Samba server
    allows in. We''ve told it to allow any device whose IP address starts with ''127''
    (this is a special address called the ''loopback'', and you always include this)
    or ''192''. If your local computers'' IPs start with something else (''10'' isn''t
    unusual, for instance), then list it here or your systems won''t connect.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_220_0.png)


    # SPECIAL USERS


    Before we can carry on, there''s a catch: Samba uses its own password file if
    you''re running a stand-alone machine as we are, and so you''ll need to tell it
    about our new user. We do this with the ''smbpasswd'' command:


    ```

    [root@fileserver-local samba]# smbpasswd -a max

    New SMB password:

    Retype new SMB password:

    Added user max.

    ```


    In more complex setups you can have a directory service to which Samba and all
    your other systems authenticate, but that''s for another day (and another book).'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_222_0.png)


    # SELINUX


    There''s one more thing though, and it may or may not be installed on your Linux
    machine. Another of the standard security features with many Linux distributions,
    including the one on our Fedora 22 machine, is SELinux – short for ''Security
    Enhanced Linux''. This is a security module that''s part of the kernel and which
    watches for nefarious activity. One of the things it generally blocks by default
    is Samba''s use of home directories, so let''s tell it to allow them:


    ```

    [root@fileserver]# setsebool -P samba_enable_home_dirs on

    ```'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_223_0.png)


    # # TRYING IT OUT


    Okay, now we think we have our Samba server running, we can check it with a very
    cool widget called ''smbclient''. This is part of the Samba installation, and
    it lets us probe our machine to see if it can see our Samba services being advertised.
    We run it in the terminal window on the Linux machine using the ''L'' flag to
    tell it to connect to ''localhost'' (itself) and we''ll use the ''U'' flag to
    tell it we want to connect as user ''max''. It''ll ask for Max''s password, and
    then tell us what it can see:


    ```

    ```root@fileserver-local samba# smclient -L localhost -U max

    Enter max''s password:

    Domain=[LINUXWG] OS=[Windows 6.1] Server=[Samba 4.2.2]```

    ```


    | Sharename | Type | Comment |

    | --- | --- | --- |

    | IPC$ | IPC | IPC Service (Samba Server Version 4.2.2) max | Disk Home Directories
    |

    | Domain=[LINUXWG] OS=[Windows 6.1] Server=[Samba 4.2.2] | | Comment |

    | LINUXSVR | | Samba Server Version 4.2.2 |

    | Workgroup | Master | |

    | LINUXWG | | LINUXSVR |'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The key things here are that we can see that we have server ''LINUXSVR'' and
    workgroup ''LINUXWG''. In the Sharename section at the top, we can see that ''max''
    is a share that''s available to us. So then, let''s have a go at connecting to
    the server from our Mac. Let''s fire up the ''Connect to Server'' option and enter
    the name of our fileshare - sm://linuxsvr/ (see right).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_224_0.png)


    **Above:** Once you''ve entered the name of the fileshare, you should be able
    to connect to the server.


    If the server is available, it''ll ask us to log in - and if it isn''t, we''ll
    get an error. So it''s a promising sign if we see the login box – we''ll enter
    our details and hit ''Connect'' (see middle right).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_224_1.png)


    Give a moment to connect and we can use our shared folder just like any other
    (see bottom right).


    **Above:** Enter your details in the login box.


    > Hot Tip

    ''smclient'' is your friend – it''s a brilliant way to verify that your Samba
    configuration is working correctly and advertising the fileshares you want to
    advertise.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_224_2.png)


    **Above:** Our shared folder.'
