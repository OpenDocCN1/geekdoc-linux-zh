- pgno: 101
  md: '# KEEPING PROGRAMS UP TO DATE


    When we installed Linux, the first thing we did once we''d finished was run the
    updater to ensure that all the elements of the system were the most recent versions.
    But all we did give it a basic instruction: ''Go and find updates for anything
    that''s installed.''


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_101_0.png)


    You could, of course, do the same thing once every week or so to ensure everything
    was up to date. And if you''re running Linux on your desktop machine at home and
    then don''t mind the occasional problem, then there''s nothing preventing you
    from doing so. But say you''re doing something that needs a bit more reliability
    — perhaps you''ve decided to run up your first Linux server it can run your website.
    be a bit more discriminatory.


    # Changing Functionality or Security


    Generally speaking, updates to a Linux machine work correctly without crashing.
    But that correct behaviour might be different from how it used to work. Software
    marches on, and although there are updates that fix bugs and make it work better,
    there are also often updates that change the functionality because the way something
    was designed has been superseded by a more efficient alternative or, more often,
    a security fix. Let''s take an example of something used all over the world —
    the PHP web development language we mentioned earlier. Read the page on the PHP
    home site that discusses, say, migrating from version 5.5 to version 5.6 and you''ll
    see a couple of


    > Hot Tip

    When you first install, you can do an ''update all'', but be more picky once your
    machine is in general use, in case you break something.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'deprecated features with the words ''Support for these calls will be removed
    in a future version of PHP''. So you need to be careful about running updates
    on Linux machines whose functionality you care about.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_102_0.png)


    # Screening Updates


    The approach you should take is simple. Run the package manager''s ''check if
    there are updates available'' command (with DNF, this would be dnf check-update).
    Then run down the list of items that it''s telling you are available for updating,
    and make a note of the one that relates to core components you rely heavily on.
    It''ll tell you the version''s planning to upgrade to, and you can ask the package
    manager to show you the version''s currently installed (with DNF, that''s dnf
    list installed). You just need to check on the home page for the various apps
    you care about, so you can understand whether versions will break your world (or,
    more likely, introduce a change that will work for the next few versions will
    eventually be removed).


    # Updating CUPS


    Once you''ve decided which items to update, name them to the package manager.
    In this example, we''ll update CUPS (the printing core of Linux). According to
    dnf list installed we presently have version 2.0.2-5, and according to dnf check-update
    the current release is 2.0.3-1. We''ll use DNF to update it:


    > Hot Tip

    Again, the package manager is your friend. Remember that as well as installing
    and updating, it can also uninstall stuff you don''t want.'
