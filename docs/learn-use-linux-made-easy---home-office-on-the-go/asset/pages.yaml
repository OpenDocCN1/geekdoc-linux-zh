- pgno: 27
  md: '# INTRODUCING LINUX


    The Cathedral and the Bazaar

    If you want to learn more about these schools of thought, a very good introduction
    is Eric Raymond''s book *The Cathedral and the Bazaar*. This draws a distinction
    between the two approaches. There''s the GNU way (the cathedral) where a small
    group of developers work together in secret, presenting their work at the end
    of the project, and the Linux way (the bazaar) where the code is developed in
    public, with many people contributing to the success. From this, Raymond derived
    Linus''s Law: ''Given enough eyeballs, all bugs are shallow'' or, to put it another
    way, ''Many hands make light work''.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_27_0.png)


    # THE DEVELOPMENT OF LINUX


    That''s the history of the free software movement, now it''s time to look at how
    Linux itself emerged. While one of the strengths of Linux is the number of people
    who contribute to the code, just one man working alone started the operating system.
    A young Finnish programmer-'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'called Linus Torvalds was working on a new way to use a program called MINIX,
    a strippedown version of an operating system called Unix that would change computing
    for ever.


    # Linus Torvalds


    In 1991, he sent out a famous post to the Usenet group announcing his new operating
    system:


    > Hello everybody there using minix - I''m doing a (free) operating system (just
    a hobby, won''t be big and professional like gnu) for 386(486) AT clones. This
    has brewing since April, and is starting to get ready. I''d like any feedback
    on things people like/dislike in minix, as my OS resembles somewhat (same physical
    layout of the file-system (due to practical reasons) among other things);


    The rest, as they say, is history. That post opened a new chapter in computing,
    one that led to the emergence of the Linux operating system in all its forms.
    It should be noted, however, that his original choice for his operating system
    was Freax (a mixture of free and Unix); the name Linux was actually devised by
    his collaborator Ari Lemmke. The first release of the software was proprietary,
    but it was quickly released under GPL


    # SLACKWARE AND DEBIAN


    In its early days, Linux was offered to us as a pair of floppy disks, with the
    kernel, the other with a set of GNU tools. But the software was not intuitive
    and so an ecosystem of distributions (better known as distros) sprang up, which
    enabled users to adopt Linux more easily. Many of the early distros have fallen
    by the wayside, but two of the early remain: Slack and Debian. The latter is the
    precursor of many today''s distros and a whole load more have since emerged to
    fulfill users'' needs (see page 52).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_28_0.png)'
