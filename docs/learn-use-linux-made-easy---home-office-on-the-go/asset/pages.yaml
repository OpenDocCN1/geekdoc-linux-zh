- pgno: 143
  md: '# WHAT STORAGE TO USE


    As we''ve mentioned, Linux will run on an enormous array of different hardware.
    One of the key things that influences its reliability though, is the storage you
    use to underpin the machine that it''s running on. Computer storage is a vast
    subject, and the chances are that if you ask three people what storage they''d
    recommend for your Linux machine, you''ll get at least two, if not three different
    answers. So here''s an impartial view on what you should be doing.


    # TYPES OF DISK


    The primary storage – the thing you''ll boot your Linux system from – is the hard
    disk. These days, you have two options: ''traditional'' magnetic disks (which
    we''ll refer to as ''spinning disks'') and Solid State Drives (otherwise known
    as SSD).


    Spinning Disks

    Spinning disks are just that – the storage unit is a set of disks coated with
    a magnetic material, which spins at high speed. A ''head'' on a moving arm moves
    across the disks in order to write data on to the magnetic surface or read it
    back off. An SSD, on the other hand, is made entirely of flash memory – there
    are no moving parts, but it uses solid-state memory that retains data when the
    device is off.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_143_0.png)


    **Above:** The faster the speed of your spinning disk, the higher the price will
    be.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Spinning disks are available in different speed categories. Entry-level disks
    spin at 5,400 rpm, and at the high end, you''re looking at 15,000 rpm. As you''d
    expect, the faster the speed, the faster the throughput of the disk – and the
    higher price.


    > ### **Hot Tip**


    **SSD** used to be ridiculously expensive, but now it''s merely very expensive!
    Prices are plummeting as it becomes popular, so check online stores for bargains.


    # Solid State Drives


    SSD is a whole different concept: it''s considerably faster than spinning disk
    – so for instance, migrating from a spinning disk to an SSD unit can make your
    machine boot at least two or three times faster, and some specialist benchmark
    measurements have shown the difference to be way more than that. SSD is super-fast,
    and in the bargain you also get the fact that it''s silent (there are no moving
    parts, as we mentioned) and the power consumption is lower than that of a spinning
    disk.


    The other difference is the price. We just compared a 1TB SSD with a 1TB 5,400
    rpm on a popular online retailer and the SSD was five times the price (£254/$400
    versus £46/$72). This reflects the fact that SSD is still a relatively new technology.
    Prices have already plummeted from where they were in the early days, and they
    continue to do so as the technology becomes cheaper to manufacture and the vendors
    compete.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_144_0.png)


    **Above:** Solid State Drives use flash memory and have no moving parts'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# INTERFACES


    What also matters in terms of the storage you''re using is the interface on the
    disks. If you''re a corporate IT person building a big server installation, then
    you''ll use Fibre Channel or Serial Attached Storage (known as SAS). These are
    high-speed interfaces and if you''re using SSD, then it''s absolutely essential
    for milking all the performance out of the expensive disks.


    If you''re a normal mortal putting together a desktop or laptop machine or a small
    server to do, your web development on, then you''re more likely to choose a Serial
    ATA (known as SATA) interface. Disks with SATA interfaces tend to be cheaper than
    SAS or Fibre Channel but, more importantly, most desktop and laptop machines tend
    to have SATA disk interfaces by default, these days.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_145_0.png)'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# RESILIENCE


    If you''re building a Linux laptop then you''ll usually have the ability to have
    a single internal disk in the machine. But if you''re putting a desktop system
    together, there''s usually the space to put more than one disk into the system.
    And this gives you a load more options when it comes to making your Linux machine
    more robust.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_146_0.png)


    # RAID


    Storage technology has a concept called RAID, which originally stood for Redundant
    Array of Inexpensive Disks. These days, it''s considered to mean Redundant Array
    of Independent Disks, because there''s absolutely no necessity for the disks you
    use in a RAID array to be cheap and nasty – RAID works just as well with high-speed
    storage as with something expensive and pedestrian.


    There are various configurations you can use for RAID, but the one we care about
    is RAID 1. With this approach, you have two disks connected to the adaptor card,
    and each item of data is written to both disks simultaneously. If one disk dies,
    the other just keeps on humming and the operation of your computer is unaffected
    as far as the user is concerned. There are others flavours of RAID, but for the
    average small or medium installation, you''ll go for either RAID 1 or RAID 5 (in
    the latter, you have three disks and data is spread such that you can lose one
    with no effect).'
  merge: -1
  img_proc: true
- pgno: 147
