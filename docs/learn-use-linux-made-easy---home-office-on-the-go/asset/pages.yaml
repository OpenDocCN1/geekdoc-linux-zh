- pgno: 117
  md: '# HOW THE DIFFERENT DISTROS WORK


    There are so many different Linux distros available that you''d think they can''t
    all be the same – and, of course, you''d be right. This isn''t a reference to
    the fact that some of the distros are available in flavours that support numerous
    different processor architectures though, since for a given distro, the different
    flavours look pretty much the same.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_117_0.png)


    The differences are twofold. First is the way you install the product itself –
    from a ''slimline'' image on a USB stick that gives you just enough to install
    the rest over the internet, up to a wallet full of DVDs that between them contain
    the entire suite of software – you''ll need. Second is the support model – from
    self-support up to business-class remote assistance from a 24/7 call centre.


    # WHAT FORM CAN YOU GET THEM IN?


    Our first Linux installation – the Slackware one on page 27 – came from an internet
    download, which we wrote on a stack of floppy disks. In this respect Linux started
    how it was meant to go on. To this day, the majority of'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Linux installations start life with a download from a website. This includes
    the commercial versions: RHEL is a downloadable product so as long as you have
    got an active subscription and hence can log into the support portal; and similarly,
    SUSE''s online shop tells us in the ''Stock Status'' column of the product page
    that it is an electronic download.


    Likewise when you go to an online retailer, the products you''re buying boxes
    containing CDs and manuals but online subscriptions – you''ll simply receive some
    cryptic codes that you can register by visiting the vendor''s website. Why would
    a vendor bother with the expense of printing DVDs and manuals when so many of
    them will end up in landfill or the recycle bin once the next version has been
    released?


    > Hot Tip

    We never bother with CD or DVD distros – a USB stick and a decent internet connection
    are fine by us.


    Below: You can download many different distros from their individual websites.
    This is Ubuntu''s download page.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_118_0.png)'
  merge: -1
