- pgno: 210
  md: 'The most popular web server program is Apache, and it''s a dead-easy to obtain
    it for our Fedora server with dnf install HTTPD. Note, by the way, that HTTPD
    stands for HyperText Transfer Protocol Daemon; a daemon in Unix/Linux terms is
    basically a program that sits constantly running in the background answering requests.


    Once we''ve obtained it, we need to start it up. We''ll use systemctl for that.


    ```

    [root@dc-linux ~]# systemctl start httpd

    ```


    Now if we try to connect to the web server again from our client machine, we''ll
    have more luck ... or will we?


    Below: An error message indicates we are still unable to connect.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_210_0.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Hang about. What''s going on? We''ve started the web server program, and we
    can use the

    ps command to check that it''s running:


    ```

    [root@dc-linux ~]# ps ax | grep httpd

    6050 ? Ss 0:00 /usr/sbin/httpd -DFOREGROUND

    6109 ? S 0:00 /usr/sbin/httpd -DFOREGROUND

    6111 ? S 0:00 /usr/sbin/httpd -DFOREGROUND

    6112 ? S 0:00 /usr/sbin/httpd -DFOREGROUND

    6113 ? S 0:00 /usr/sbin/httpd -DFOREGROUND

    6114 ? S 0:00 /usr/sbin/httpd -DFOREGROUND

    ```


    # IPTABLES


    We''ve already mentioned that Linux is pretty inherently secure, and one of the
    things that

    ributes to the inclusion of the IPTables firewall software as part of the default

    installation. A firewall is a piece of software that acts as a barrier to incoming
    and outgoing

    connections and ensures that, regardless of what programs are running on the system,
    only the

    connections that the system administrator permits are allowed to happen. The out-of-the-box

    approach, quite sensibly, is for the system to permit a minimal set of connectivity.
    So let''s run

    a quick IPTables command:


    ```

    iptables -I INPUT 1 -p tcp -m state -state NEW -m tcp --dport 80 -j ACCEPT

    ```


    This command is basically telling IPTables to add an ''input'' rule (that is,
    for new inbound

    connections destined for this machine) using the TCP protocol, to destination
    port 80 (the web

    server port), and it should accept those connections. Try again with our browser
    (see right).


    That''s more like it – the machine has answered our request and sent us a test
    page to prove

    it''s up. So let''s tell the machine to save our new setting. IPTables won''t
    save it unless we tell it

    to, so restarting the machine now would cause it to refuse connections after the
    restart.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '(Actually, the Fedora documentation says the current ruleset is saved when
    IPTables shuts down but it''s a fib, so we''ll save the rules by hand):


    ```

    root@dc-linux ~# iptables-save >

    /etc/sysconfig/iptables

    ```


    IPTables isn''t for the faint-hearted.

    The commands and some of what it does can be puzzling unless you''re really comfortable
    with how IP networking works.

    Happily the kind of stuff you''re likely to be doing as Linux beginner, there''s
    enough information out there in Googlelade to help you do most of what you need,
    and there''s nothing to stop checking out the main page and using a bit of trial
    and error.


    Below: The web server is now working correctly.


