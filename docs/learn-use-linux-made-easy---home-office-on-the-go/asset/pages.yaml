- pgno: 135
  md: '# Factors to Consider


    The thing is, you won''t decide to use Linux and then go on to decide on the platform
    you want to run it on. The choice of a hardware platform or an operating system
    is seldom isolated decision, instead you select them as a pair.


    Let''s take an example. Say you''re a corporate looking to run a large database
    system and you''ve decided that Oracle is the database package you want to use.
    You have a variety of choices: you could use SPARC bit (which is of course Oracle-owned)
    running Solaris, or you could use Intel-based kit running Windows, or you could
    go for a favourite Intel-based server provider (HP, perhaps, or Dell) running
    Oracle Linux and sit Oracle''s database on top.


    > Hot Tip

    Unless you have a particular reason to use some other wacky architecture, we''d
    go with x86-64 as the platform of choice - it''s popular and cheap. Don''t bother
    with 32-bit x86 if you can help it.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_135_0.png)


    # SELF-BUILT DESKTOPS?


    Those who build their own desktops tend to install Linux on them, for a simple
    reason - it''s free. The alternative would be to install Microsoft Windows, but
    of course that''s expensive. Few years ago we built a desktop for £254/£394, when
    you consider that a Windows licence is £80/£124 on top of this, Linux is an attractive
    option. What do you need to consider when you''re building your own machine?


    Above: It''s best to pick a processor, unless you have very specific requirements.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Power


    First there''re the processor. We''ve discussed the different processor families,
    but here we''re talking about building a PC so we''re talking Intel or AMD processors.
    When it comes to the choice between a 32-bit and a 64-bit processor we always
    go 64-bit; the cost differential is negligible and as far as Linux is concerned
    there''s absolutely no worry with it working as well on a 64-bit platform as on
    a 32-bit one.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_136_0.png)


    # Memory


    Then we have on-board memory, and the answer is simple: as much as you can afford.
    Our lab laptop came with 8GB of RAM as standard, which is fine for what we need;
    if you''re building a desktop why not start with 16GB? The main rule we follow
    is to leave RAM slots free for future expansion, so if you have four slots and
    you want 16GB use two 8GB modules instead of four 4GB ones.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_136_1.png)


    # Connection


    Next is the network adaptor, and as you''ll see shortly when we discuss networking,
    the only sensible option is Gigabit Ethernet. Motherboards come with on-board
    Gigabit Ethernet as standard.


    When we''re on motherboards, you''ll find that the standard ones you can get with
    SATA connections on-board; this is fine for a home-built desktop, and we''ll explain
    a bit of what SATA is all about shortly in the section on storage, along with
    some advice on what disks to choose.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Other Bits of Kit


    You''ll also need a case and a power supply, but these are ten a penny. You can
    buy all kinds of funky cases for a home-build desktop, and all you need to remember
    is to decide how many internal hard disks you want and buy a case that''s big
    enough to hold them.


    > Hot Tip If you''re self-building, get a motherboard/CPU package – it’s so much
    easier than trying to comprehend which processor works with which motherboard.


    The trickiest bit of building your own PC is matching the CPU with the motherboard
    – the sheets can be a bewildering series of socket types and such like. We tend
    to sidestep this by buying a kit that includes the motherboard and processor in
    a single box: you can get a kit for as little as about £160/$251, though, of course,
    the sky’s the limit (£470/$739 for an Intel i5 on a motherboard with 8GB RAM,
    anyone?


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_137_0.png)'
