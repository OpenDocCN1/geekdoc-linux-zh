    # Writing Scripts


    When it comes to shell commands, then, you can do powerful things. We''ve just
    scratched the surface here, but you can write scripts that call other scripts
    and do complex interactions – reading data from files, writing output to files
    and using variables to do calculations and string manipulation. The only downside
    with shells is that if you''re used to one type and you''re forced to use a different
    one, there''s a bit of learning to do, because we''ve seen, the syntax does vary.
    So if we try to run our tcsh script from above with bash, it''ll blow up:'
