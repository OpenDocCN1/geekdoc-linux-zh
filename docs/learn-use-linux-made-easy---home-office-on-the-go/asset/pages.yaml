- pgno: 148
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_148_0.png)


    # JUST THE SINGLE DISK


    If you''re going for a single disk, get an SSD if you can afford it. The performance
    improvement will be vast when compared with the speed of a ''traditional'' magnetic
    device, and as programs get bigger and slower (as seems to be the case over the
    last few years), you''ll thank yourself for making the investment.


    This also applies if you have a laptop. If you''re restricted to having a single
    one, then why not make it a good one? The test machine we''ve been using for our
    examples here is clearly not the fastest in the universe, and you can tell when
    it''s hammering the disk for a heavy chunk of access; it''s definitely destined
    for an upgrade to SSD sooner rather than later.'
