- pgno: 95
  md: '# NEXT STEPS


    Once you''ve installed Linux, you have a working system, but not one that''s up
    to date. The makers of the distros don''t constantly change their installer image
    whenever a new tweak to something comes out; after release 22 of Fedora, for instance,
    the next image you''ll see is release 23.


    # WHAT SHOULD YOU BE LOOKING FOR?


    So just as you do when you install any other operating system – Mac OS or Windows,
    for example – the first thing to do is make sure you get everything up to date.
    This is really easy to do, as we''ll see in a moment.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_95_0.png)


    Why do we run the upgrade straight away? Easy – we always want to start with a
    system that''s bang up to date (we''ll get back to managing regular updates later).


    Different distros have different package managers, and hence different ways of
    running updates. As of release 22, Fedora have actually changed their package
    manager from Yum to one called DNF. It''s dead easy to use though – just run dnf
    update:'
  merge: -1
  img_proc: true
