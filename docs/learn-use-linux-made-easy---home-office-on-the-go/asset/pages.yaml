- pgno: 239
  md: '# WHAT TO DO WHEN THINGS GO WRONG


    There will, of course, be a point at which something goes wrong. Linux is generally
    a very stable platform, but there''s always the potential for problems — hardware
    giving up the ghost, perhaps, but more likely user-inflicted (we''ll come back
    to that concept later). It''s not unusual to do something daft and break the configuration
    of the system, causing it to stop working, so what do we do when things go wrong?


    # IF YOU CAN''T GET REMOTELY


    The most common problem with Linux is when the machine is up and running but you
    can''t get in from a remote machine via SSH or some other remote tool. There could
    be a number of reasons for this: a dodgy network cable; the machine losing its
    IP settings; the system not enabling its LAN card correctly; an issue with the
    wireless network configuration (such as the authentication mechanism changing
    the machine''s settings, hence no longer matching); the IPTables configuration
    having locked you out; or one of any number of other things.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_239_0.png)'
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_240_0.png)


    The answer is to try to log in from the console of the machine itself. If you
    can''t get in as a normal user, then click the ''Not listed'' link on the login
    screen and try getting in as the root user.


    # IT STARTS BOOTING BUT DOESN''T FINISH.


    # Hot Tip


    More common is where it starts booting but only gets partway before giving some
    kind of error message. These are generally exemplified by the words ''kernel panic''
    somewhere in the plethora of error messages, or perhaps a message telling you
    that one or other of the disk volumes couldn''t be mounted. The latter is common
    if the machine has crashed or you''ve


    It is possible for your user login to be corrupted. This could be a corruption
    in the user''s configuration files or the shadow entry. The best way to figure
    this out is to log in as a different user.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# TROUBLESHOOTING AND GLOSSARY


    powered it down rather than shutting it down gracefully. Although the file system
    formats on today''s Linux are much more robust and resilient to forced shutdowns
    than they were, you sometimes get to the stage where it says: ''I''m not carrying
    on until I have had this disk cleaned up.''


    If this happens, you can try to boot the machine in single-user mode and run a
    file system check on the disk it says is corrupted. You do this by:


    +   - Pressing ''e'' on the start-up screen so you can edit the boot command before
    it executes.


    +   - Scrolling down to the line that tells the system how to start up (it''ll
    have ''vmlinuz'' mentioned in it), then adding a space followed by the word ''single''
    at the end.


    +   - Pressing CTRL-X to continue booting.


    Below: fck lets us check and fix filesystems if we have got problems.


    ```

    root@localhost ~# fck /dev/sda2

    fck from util-linux 2.26.2

    fck, 3.0.27 (2014-11-12)

    041: Dirty bit is set. fs was not properly unmounted and some data may be corrupted.

    .

    1) Remove dirty bit

    2) No action

    3) ?

    There are differences between boot sector and its backup.

    This is mostly harmless, Differences: (offset:original/backup)

    5:01/00

    1) Copy original to backup

    2) Copy backup to original

    3) No action

    4) ?

    ```'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# WHAT TO DO WHEN THINGS GO WRONG


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_242_0.png)


    The system will start up in a text-only mode, prompt you for the root password,
    then give you a command prompt. You can then run basic commands, the common one
    being fsck, the file system check tool, on the volume it previously told you was
    broken.


    # IF THIS DOESN''T HELP


    If you can''t get the system to boot into single-user mode, the easiest thing
    to do is boot from a USB stick, just as you did when installing it in the first
    place. Linux can be a pain to try to diagnose when you''re booting from a broken
    installation, so why not boot from an image that you know works and work from
    there?


    # Hot Tip


    Linux always logs a lot of information. Sometimes, the best way to solve a problem
    is to look back in the relevant log file.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'You know you can connect the wireless network and do everything you''d be able
    to do with a working Linux system, as well as mounting the onboard drives (as
    long as they''re not dead, of course) and poking about as you see fit.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_243_0.png)


    # REMEMBER THE BACKUP


    We mentioned earlier that one thing you absolutely should do is implement a backup
    of your key data and configuration files, with whatever tool you find easiest.
    That''s because there may well come a point when reinstalling the operating system
    is actually the most straightforward way of getting the machine back up and running.


    If you''ve got a backup, you won''t mind having to reinstall – and as you''ve
    seen if you followed the walk-through we did earlier, you can start from nothing
    and have a fully up-to-date Linux installation within an hour, often less.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# HOW THINGS MIGHT GO WRONG


    Having considered briefly how you might deal with something having gone wrong,
    let''s consider as our final thought on this subject how things might have gone
    wrong. We mentioned earlier that one reason for not being able to connect remotely
    to the machine is that IPTables has locked you out. Why might it do that? Simple:
    because you made a change to it. We have a phrase in IT:''sawing off the branch
    you''re sitting on''. It''s the concept of connecting remotely into the machine
    and then changing the configuration so that your remote connection is killed and
    you can''t restart it.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_244_0.png)


    Below: We can check what IPTables thinks it''s letting in.


    ```

    root@linux-pc-local:~# iptables -L -n -v

    Chain INPUT (policy ACCEPT)

    target prot opt source destination bytes packets

    ACCEPT  all  all             0.0.0.0/0            0 0

    ACCEPT  all  all             0.0.0.0/0            0 0

    ACCEPT  all  all             0.0.0.0/0            0 0

    ACCEPT  all  all             0.0.0.0/0            0 0

    ACCEPT  all  all             0.0.0.0/0            0 0

    ACCEPT  all  all             0.0.0.0/0            0 0

    ACCEPT  all  all             0.0.0.0/0            0 0

    ACCEPT  all  all             0.0.0.0/0            0 0

    ACCEPT  all  all             0.0.0.0/0            0 0

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'In some cases, Linux can be quite forgiving. For example, one might think that
    if you connect

    to the machine using SSH and then stop the SSH server process, it''ll throw you
    out, but that''s

    not the case:


    ```

    [root@dc-linux ~]# systemctl stop sshd

    [root@dc-linux ~]# ls

    anacaconda-ks.cfg Desktop Documents Downloads initial-setup-

    ks.cfg Music Pictures

    ```


    Here, we''ve killed off the SSH server, but it lets our session continue. If we
    disconnect and try

    to reconnect though, it''ll refuse our connection as expected:


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_245_0.png)'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_246_0.png)


    # Hot Tip


    If your Linux graphical desktop freezes the best thing to do is change to a console
    by pressing Ctrl + Alt + F2. This will allow you to login from the console and
    find what froze your desktop.


    ```

    [root@dc-linux ~]# exit

    [dsc-dc-linux ~]$ exit

    Connection to 192.168.1.186 closed.

    DCPro:~ davidcartwright$ ssh dsc@192.168.1.186

    ssh: connect to host 192.168.1.186 port 22: Connection refused

    DCPro:~ davidcartwright$

    ```


    With other configuration items, though you may not be so lucky. Be extremely cautious,
    then, when you reconfiguring the system from afar. Keep an open connection sitting
    there just in case, and have a fallback means of getting to the console if it''s
    located somewhere distant, because we''ve all seen off the branch we''ve been
    sitting on at some point in our careers.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# GLOSSARY


    **Apache**: This is where open source software really has an impact on the business.
    This is the most widely used web server software, with about 40 per cent of the
    market. It''s the acme of open source development, maintained by a coterie of
    developers, supported by the Apache Software Foundation.


    **Bloatware**: Unnecessary programs and applications or software that is more
    memory and disk intensive than it should be. Particularly used for software delivered
    with its operating system.


    **BSD**: Short for Berkeley Software Distribution. One of the earliest implementations
    of Linux with its roots in Unix.


    **Bash**: At its most basic, this is one of the programs that converts your CLI
    commands and does something with them. In other words, it processes Linux commands,
    but it''s not the CLI itself.


    **Compile**: The art of turning source code into something executable. Programmers
    like using this word a, but newbies won''t be doing much compiling.


    **Copleft**: The open source equivalent of copyright. Makes it plain that source
    code can be freely distributed, modified and generally mucked around with.


    **CLI**: The Command Line Interface: how you type those Linux instructions into
    the computer in the first place. Once upon a time, all computers used this, and
    then we discovered GUIs.


    **CUPS**: Common Unix Printing System. As the name suggests, this is a printing
    utility that helps a Linux computer to act as a print server and allows Linux
    to talk to the printer.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Daemon: Nothing to do with Philip Pullman and His Dark Materials, but a special
    type of program that runs in the background for specific computer requests.


    Debian: One of the earliest Linux distros. Many distros have emerged from under
    the Debian umbra.


    Distro: Short for distribution, the name given to one of the different flavours
    of Linux. There are many of them out there, it''s near impossible to list them
    all. This is one of the most common terms you''ll hear in the Linux world.


    Emacs: A Linux text editor.


    Fedora: A Linux distro, developed by the Fedora Project and supported by Red Hat.
    Reported the version of Linux used by Linus Torvalds himself.


    Fork: This is an established part of the process in all open source software development.
    It''s a technique that originated under Unix, whereby a process is copied and
    modified to create a completely different process. It''s almost an essential part
    of FOSS development as software is there to be


    modified. Sometimes, the forking makes such a distinct difference that an entirely
    new piece of software is created.


    FOSS: Free and Open Source Software. A compromise term falling between free and
    software, and it''s opened up, source.


    Gimp: A photo manipulation program for users who want an alternative to Photoshop.


    GitHub: A web-based repository for software. It''s where programmers download
    software, make revisions and offer changes.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# TROUBLESHOOTING AND GLOSSARY


    **Gnome**: A graphical desktop environment; in other words, the collection of
    icons, widgets, graphics, folders and toolbars that''s on your screen when you
    start your computer. It''s a fierce competitor with KDE. The two products have
    very different roots (although they both originated in the Unix world); Gnome
    started as a GPL project while KDE was designed to be as efficient as possible.
    There are really no massive differences between the two products – although both
    have their fierce adherents – so it''s a question of personal taste.


    **GPL Licence**: Stands for General Public Licence. Strictly speaking, should
    be GP Licence but GPL Licence has become the accepted term (in the same way that
    we talk about ATM machines). It''s an example of a copyleft licence in which any
    modifications and developments must be under the same terms as the original. In
    other words, you can''t take code under GPL, modify it and impose a new set of
    conditions on it.


    **GNU Project**: One of the very free software projects, started by Richard Stallman.
    Linux was released under the GNU licence (although not part of the project itself).


    **Grub**: The name for a program that runs when a computer boots up. It''s this
    that kick-starts the kernel in preparation for running the computer itself.


    **Kernel**: The very heart of Linux. This is where all the processing happens.
    There are two approaches to the kernel by the distros: one is that the kernel
    is left pretty untouched and the distros distinguish themselves by the utilities
    that are offered; the second is that kernels are modified in such a way to offer
    something distinct – Fedora does, for example.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_249_0.png)


    **KDE**: The other desktop environment; if you don''t want to use Gnome, KDE is
    one of your options.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# GLOSSARY


    LAMP: Stands for Linux, Apache, MySQL, PHP, a bundle of four Open Source components
    used in the development of websites. Because all the elements are free and open
    source, it''s widely used by website developers to avoid any vendor lock-in.


    MySQL: An open source relational database system. This was originally developed
    by Swedish company MySQL AB, but is now owned by Oracle. Originally developed
    under the terms of GNU/GPL, MySQL is used extensively for database-driven websites
    and is one of the elements in the LAMP software bundle.


    LEAF (Linux Embedded Appliance Firewall): LEAF is an easy-to-use embedded Linux
    system that is meant for creating network appliances for small office, home office
    and home automation environments.


    Open Source: The name for any software that is open to all to modify and muck
    around with, as distinct from proprietary code, owned by the likes of Microsoft,
    Apple, Oracle etc.


    LibreOffice: (Derived from OpenOffice, after it had been forked.) A free alternative
    to Microsoft Office, providing pretty much everything that Microsoft offers –
    not very compatible with Office,.


    Windows: A bit of an oddity. This is a Linuxstyle operating system but one that
    looks like Windows (for those users who really can''t do without). The catch is
    that it''s proprietary – so not really Linux-style at all.


    Minix: An offshoot of Unix with a microkernel architecture. Linux emerged when
    Linus Torvalds started working on the software.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_250_0.png)'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'Package manager: As the name suggests, this is a bundle of utilities that assists
    a user in installing and configuring operating system software. While it''s possible
    to install Linux without a package manager, the user must make sure that all software
    is up to date, have to compile the software direct from the source code (not for
    the faint-hearted) and configure each element separately. Put it in this way,
    you''re going to use some sort of package managers running several such package
    managers under Linux. The Advanced Package Tool, or APT, has been designed to
    handle the installation and removal of Debian family software, while Dancified
    Yum (DNF) is the default package manager for Fedora.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_251_0.png)


    RMS: How Richard Stallman is often known.


    PGP: Stands for Pretty Good Privacy. This is an Open Source encryption program,
    developed by Philip Zimmermann, as a security measure for protecting email and
    files.


    Root: This is a hangover from Unix days but it fundamentally makes absolute control
    of a system. If you think back to the way you use Windows, there are trivial changes
    you can make (to the look and feel, for example) that have no effect on how the
    computer works, but if you want to do something fundamental, you need administrator
    access. Root is the Linux equivalent of that.


    PHP: An Open Source programming language that''s used in developing applications
    for web servers. Part of the LAMP bundle of software components.


    Samba: A Linux-based file-sharing application.


    Red Hat: One of the leading distros, sponsor of Fedora and vendor of Red Hat Enterprise
    Linux (RHEL).


    Slackware: The first Linux distro that is still going strong.'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'SourceForge: Another source code repository in the same way as GitHub is. An
    accepted way for programmers to share coding resources.


    Vi: One of the main text editors for Linux users.


    Wine: What you need lots of your installation has gone wrong. Or, more prosaically,
    software that allows you to run Windows programs on Linux. A useful facility for
    those who really can think of alternative Linux applications to the ones they''re
    used to.


    SSH: Secure Shell is a Linux protocol that is used for secure remote log-in.


    Richard Stallman: Doyen of the free software movement, founder of the GNU Project
    and keeper of the flame.


    SUSE: German company that offers two operating systems: openSUSE – a free desktop
    version of Linux – and SUSE Linux Enterprise, a paid-for-offering.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_252_0.png)


    Linus Torvalds: The main man, the progenitor of the whole sheebang. Also known
    for framing Linux''s Law (as formulated by Eric Raymond): ''Given enough eyeballs,
    all bugs are shallow.''


    Ubuntu: One of the most popular of Linux distros, based on Debian and supported
    by British-based company, Canonical.


    Unix: The grand-daddy of it all. The operating system from where Linux emerged
    (via some changes). Many of the programs and utilities that serve Linux originated
    under Unix.'
  merge: -1
  img_proc: true
