    Controlled updates of this kind will keep your Linux platform stable.


    # DO I WANT ANOTHER DESKTOP MANAGER?


    We''ve already mentioned that there be several alternatives of programs that can
    do anything you want on Linux. And one of the key options is the desktop environment
    that presents the GUI interface on your Linux machine. On our test machine the
    Gnome desktop was installed by default, but you have plenty of options.'
