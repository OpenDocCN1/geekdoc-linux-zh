  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_26_0.png)


    # FREE AND OPEN SOURCE SOFTWARE


    The discussion has led to the creation of a portmanteau phrase – free and open
    source software (FOSS), a sort of compromise between the two strands of thought.
    In reality, there''s already a strong overlap between the two and some of the
    differences between the two schools are of the same arcane nature as those of
    medieval philosophers arguing about the sex of angels. Some of the arguments touch
    on all aspects of life – they''re not just technical issues (and they fall well
    outside the scope of this book). For most people outside this world, the two are
    interchangeable, but if you''re talking with software developers, don''t be surprised
    if they take a more nuanced view.'
