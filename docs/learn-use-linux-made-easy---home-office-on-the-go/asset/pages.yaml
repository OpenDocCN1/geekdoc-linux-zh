- pgno: 105
  md: '# ISSUES TO BEAR IN MIND


    We''ve walked through the process of going from a bare system to a working Linux
    machine, and the result should be pretty impressive – a working machine with an
    attractive user interface (they''re all pretty good straight out of the box) which
    is able to communicate with your other computers, surf the internet and run the
    applications you want to use. This is the real world, however, and there are a
    few things you need to have in mind when you''re installing and using Linux for
    real.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_105_0.png)


    # IS IT REAL?


    One thing we didn''t mention in the section about downloading the Linux distribution
    is that whenever you download any open source file you should make sure that the
    image you download is genuine. If you''re working from the official website then
    it''s usually fine, but you should check. You do this using a checksum – this
    is calculated by a program that takes every byte of a file and performs a calculation
    that results in a string of characters. The idea is that only that file will have
    that string calculated as its checksum.


    Let''s take our Fedora image as an example of how to check the integrity of the
    file. If we look in the directory where the installer file lives on the Fedora
    website, we see a number of files:'
  merge: -1
  img_proc: true
