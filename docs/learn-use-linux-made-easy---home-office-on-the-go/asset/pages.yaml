- pgno: 127
  md: '''Have there been new Linuxes since 2006?'' we hear you ask. And yes, absolutely,
    there been – the likes of Evolve OS (renamed Solus not so long ago), or SparkyLinux.
    There are plenty of others that have been around a while too – Linux Mint is hugely
    popular since its arrival in 2006. Any Linux book can only ever scratch the surface
    of this market full of products.


    # WHAT DO ALL THE DISTROS HAVE IN COMMON?


    There''s a load of commonality to all the distros, which is why it can often be
    difficult to choose between them.


    At the bottom, they all have a Linux kernel, though the versions vary. Generally
    speaking, the open source versions are slightly ahead of the commercial ones,
    since the commercial ones have to undergo more formal testing and need to be more
    supportive (which means bleeding-edge versions are avoided). So RHEL 7.1 has kernel
    3.10, and back in the free world, so does CentOS 7.1 (remember we mentioned the
    two in step earlier?). Fedora 22, on the other hand, has kernel 4.0.


    # Accessing File Systems


    Linuxes also have the ability to access file systems – segments of computers''
    onboard hard disks. There are file system formats that Linux considers ''native''
    (that is, you''d use them as the format for a disk holding Linux executables and
    data files), and they''re called things like ext4 and reiserFS. Most Linuxes are
    also able to read – and usually, but not always, write – non-native file systems,
    the most obvious being the FAT and FAT32 systems used by many Windows releases
    over the years and


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_127_0.png)'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'the NTFS format used by the more recent Windows incarnations. NTFS has historically
    been tricky with Linux – read-only access was the order of the day, and we''ve
    killed Windows partitions before trying to write them using experimental NTFS
    drivers – but these days, you''re OK.


    # Vital Core Abilities


    Network support is also common: even the tiniest Linux machine will usually need
    to talk to something via a network, whether it is wireless or c. And similarly,
    core is the ability to drive a screen of some sort so that you can boot the thing
    and see what it''s doing. Finally, you''ll generally have some kind of keyboard
    connectivity, with USB being the order of the day.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_128_0.png)


    Above: A dual-boot hard disk shown here: the blue segment is the Windows partition
    with the rest as Linux.


    > ### Hot Tip

    If you dual-boot Linux and Windows, check out the NTFS support on the distro you''re
    planning to use. Some still support it as read-only, which limits the usefulness.


    # WHERE ARE THE DIFFERENCES?


    The differences between Linuxes tend to come in two flavours, the first of which
    is the default setup of the product. That is, you''ll sometimes find that although
    two Linux versions have support for pretty much the same processors, disk interfaces,
    graphics cards, network adaptors and so on, the default setups will vary slightly.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 128 WORKING WITH LINUX


    For instance, if you install CentOS and pick the default options, you''ll find
    it wants to format the disks in xfs format and give you the Gnome window manager
    by default. Fedora''s also a Gnome lover, but our test machine tells us it decided
    to use ext4 format for its disks. RHEL is xfs and Gnome (very CentOS again) and
    SUSE is presently using ext3 and Gnome.


    The differences matter? In some cases, not enormously; as far as the user is concerned
    ext3 disk behaves pretty much like an ext4 or an xfs one – unless you''re talking
    about ablusive file systems or really busy disks – and if you''re installing in
    an environment like that, then you''ll be reading the vendor''s recommendations
    on the options that fit you best. Remember that we''re just talking the default
    file system; you can generally hit the ''Customize'' button and pick another if
    you wish.


    Below: The Gnome desktop help page.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_129_0.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# SIMILARITIES AND DIFFERENCES


    # Changes to the System


    In other cases, the differences are more relevant because they directly affect
    how you use the system. Different window managers will put things in different
    places on the screen, so switching between multiple environments can challenge
    sanity if you have three machines running three different window managers that
    all have bits of the GUI in different places, or have interactive screens that
    differ in quality and usability. Window managers are easy to replace, although
    the package groups can be hundreds of megabytes, so make sure you''re not short
    on disk space.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_130_0.png)


    # Different Package Managers


    The most confusing difference with distros is where they have different package
    managers. The Fedora installation we use in our examples uses DNF, which is a
    successor of the Yum package manager. Red Hat uses RPM. Yum and DNF work with
    RPM packages, so are largely the same (albeit with different syntax). Debian users
    will be used to the Advanced Packaging Tool (APT). They all do pretty much the
    same thing, except that DNF is a modern alternative of Yum and they have different
    syntaxes; it''s just that if you have different flavours you''ll need to remember
    the different commands.


    > Hot Tip

    Check out your distro''s package manager and see what family it comes from – that,
    you''ll know which types of package you can download and install.'
  merge: -1
  img_proc: true
