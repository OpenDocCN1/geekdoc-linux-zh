    do so) and a load of mechanisms for referring

    back to historical commands.


    # Hot Tip


    You''ll find one or other of the

    shell families – sh or csh - clicks

    better than the other, so stick with

    the one you get on best with. It''ll

    usually be available, even if it''s not

    the default.


    # THE HYBRIDS


    Bash, or the ''Bourne Again Shell'', was developed

    as an open source alternative to the Bourne shell.

    It has long one of the standard shells for

    Linux, and if you install Linux without changing any of the options, you''re likely
    to end up with

    is your default. Although seemingly named after (and including, unchanged, largely)

    functionality of sh, it incorporates features of csh and ksh. Extras on top of
    basic

    functionality are command completion (hit the right key and if there''s only one
    option

    for the half-typed command, it''ll finish it for you), some useful shorthands
    for file redirection,

    some nice scripting features such as advanced array structures. We''ll come back
    to scripting later.

    Ksh, or the ''Korn shell'', is named after its author David Korn. Although heavily
    sh-like, again

    there are features shared with csh, such as command aliasing and command history.


    # POSIX SHELL STANDARD


    Sh, csh, tcsh, bash and ksh are the five shells you''ll come pretty well all of
    the time and

    as we''ve seen, they''re all slightly different. Yet there is actually a standard
    that defines the core

    requirements for a Unix-style shell, which is part of the IEEE 1003 family of
    specifications. So

    there''s a standard, why are there so many shells? Simple: the functionality that
    satisfies the

    POSIX standard is merely a subset of what each of shells offers. Developers use

    POSIX as a minimum starting point and build on it in the hope of persuading users
    to like their

    flavour rather than someone else''s.


    Oh, and in case you''re wondering, the POSIX spec was based on the 1988 version
    of ksh.'
