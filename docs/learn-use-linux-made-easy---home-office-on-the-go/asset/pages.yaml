    directive.


    # Don''t Be Afraid of the Config File


    You''ll find Linux configuration files look quite scary - as we saw with the

    amba config file earlier. But as we''ve said, it is really nothing to worry about
    because the settings that it comes with ''out of the box'' are generally enough
    enough to get up and running or at least close. As we saw in the previous chapter,
    the Apache web server gives you a ''Hey, I''m working'' test page as soon as you''ve
    fired it up and told the firewall to let the connections – no configuration


    Above: httpd.conf is a configuration file and the main file you''ll use to set
    up the server.


    > Hot Tip

    Knowing your around httpd.conf is a handy thing – explore the one that ships with
    your machine and read the comments to understand what it''s doing'
  merge: -1
