  md: '# GET AN APPLICATION


    Your Linux machine can''t magically become, say, a web server without running
    a web server program, of course. Point a browser at a newly installed Linux machine
    and it''ll fail to connect.


    You''ll need to do two things to make it happen: get a web server program, and
    ensure any onboard firewall software is configured to let connections in.


    Below: The web server connection has been refused.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_209_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_209_1.png)'
