  md: '# TELNET AND PORT CONFIGURATION


    So far, then, we''ve looked at how you get connected to the network. Once you''re
    hooked up, you can do all the obvious things like browsing the internet and connecting
    to shared folders on the other computers in your house or office. But what if
    you want to use your Linux machine as a server of some sort?


    Even if you''re not going to run a live website on your server (there are plenty
    of companies out there who will host your site for at little charge), it''s common
    to want to be able to develop stuff on a machine of your own so you can test it
    fully on your internal machine before sending


