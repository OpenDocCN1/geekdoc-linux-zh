- pgno: 125
  md: '# CentOS


    CentOS emerged in the spring of 2004 and comes from RHEL stock, and continues
    to be based on the new RHEL releases as they come out. The writers go to great
    pains to point out that CentOS isn''t simply a free copy of RHEL, but that said,
    it''s built on open source code available by Red Hat, and the project board for
    CentOS includes Red Hat people.


    # Fedora


    Heading down the Fedora line from a similar RHEL heritage, Fedora Core 1 (the
    first half dozen or so releases were all Fedora Core something) came out in November
    2003. And quelle surprise – Fedora also has formal sponsorship and input from
    the team at Red Hat.


    # Ubuntu


    Around 2004, we have the arrival of Ubuntu, the first official release of which
    was confusingly numbered 4.1. Although, as we''ve mentioned, Ubuntu has tight
    links with Canonical, it''s nonetheless a proper community-driven Linux implementation.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_125_0.png)'
  merge: -1
  img_proc: true
