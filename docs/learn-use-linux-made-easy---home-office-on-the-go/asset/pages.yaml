    things like string manipulation (reversing strings, counting string lengths and
    so on) or trigonometric functions. There''s a boatload of other, far more complicated
    stuff in the average Linux distro.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_54_0.png)


    Above: The Linux Programmer''s Manual showing the Library Function


    # PACKAGE MANAGER


    In the old days, distros came on CDs and DVDs. These days, you can still download
    an entire distro, but with modern, high-speed internet connectivity, it is equally
    common to start with a very small ''get started'' installer image and for the
    installer to download the bits it needs.


    To do this, the distro manufacturers have produced package managers – applications
    that bundle all the key components of a program into a single package, which you
    can then download and extract. The contents are pulled out of the package and
    placed in various'
