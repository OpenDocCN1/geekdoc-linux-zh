    # The Prompt


    And in the command examples we just gave, you may have noticed the bit on the
    line where we''ve typed the command – the prompt:


    ```

    [dsc@localhost ~]$

    ```


    This is something all shells can do – provide you with a prompt that tells you
    useful stuff. In this case it''s telling us:


    +   - dsc@localhost: We''re logged in as user dsc on a machine called localhost.


    +   - ~: We''re currently working in the home directory of the current user (~
    is shorthand for ''home directory'' in Linux)


    +   - $: We''re running as a normal user (it''d be # if we were the privileged
    ''root'' user).


    We''ll come back later to a comparison of the popular shells you''re likely to
    come across in an average Linux distribution (see page 68). Some will install
