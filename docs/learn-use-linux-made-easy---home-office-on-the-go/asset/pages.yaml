- pgno: 1
  md: '# LEARN & USE

    LINUX

    MADE EASY


    Once mastered, Linux can be an incredibly efficient and stable operating system.
    For absolutely no cost. Linux users have the freedom to change the design of their
    desktop, personally decide which software suits them and can also ensure excellent
    security protection for their computer. Including step-by-step guides and useful
    illustrations, this book includes everything you need to know about getting grips
    with Linux.


    Learn & Use Linux Made Easy is a fantastic practical book that offers support
    to those trying to understand the operating system for the first time, as well
    as anyone wishing to build on knowledge. With easy-to-read guides to working with
    Linux, you will find advice on which distro to choose, which storage system would
    be best suited to you and also find tips on how to get the most out of the operating
    system. As well as covering the basics of installing your chosen distro, you will
    find expert advice on how to stay safe online with helpful information on wireless
    security and downloading appropriate firewalls. Also learn about the kernel and
    different shell families including sh, bash and tch.


    Further chapters include guidance on networking with Linux as well as a practical
    troubleshooting section. Here, you will find helpful solutions to the most common
    problems and a list of all the technical terms you may need that will help you
    overcome any potential problems. Filled with straightforward instructions and
    expert knowledge, this book is perfect for anyone who wants to get the most out
    of Linux.'
  merge: -1
