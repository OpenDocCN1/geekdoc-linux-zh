- pgno: 149
  md: '# SEPARATE BOOT DISK AND DATA DISK


    Although you often hear people saying how fast their machine boots, does this
    really matter? If it''s a laptop, then it probably does, as you''ll tend to start
    up and shut down a lot. If it''s a desktop, on the other hand, then perhaps not;
    our iMac stays on most of the time – we seldom shut it down as it sits silently
    in the corner.


    What you care about is how fast it runs programs and accesses data. So if you
    want to optimize operating speed, why not have a small spinning disk as the boot
    disk but then install a larger SSD disk and use it for programs and data?


    Once the kernel is in memory, it doesn''t need to do any major access of the disk
    it booted from, so performance really isn''t a big deal.


    > ### Hot Tip

    Spend money on the data disk that''s going to be accessed frequently, not the
    boot disk that only does anything when starting up.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_149_0.png)'
  merge: -1
  img_proc: true
