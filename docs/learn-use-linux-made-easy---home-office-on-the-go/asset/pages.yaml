- pgno: 119
  md: 'There are CD-based versions of Linuxes, they tend to be produced by third parties,
    the actual Linux distro makers themselves. So Amazon''s US site will sell you
    a Linux Mint CD for $9.99, or you can get a bootable version on a USB stick from
    Amazon UK for £8.79. Oh, and, of course, if you keep an eye on the Linux magazines
    in your local newsagent, you''ll usually find that the cover DVD has one or more
    distros on it.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_119_0.png)


    # THE INSTALLATION MODEL


    There are typically three installation models you can use, one of which you''ll
    already have tried if you did the Fedora install that we went through earlier.


    # Basic Internet Install


    With the basic network installation, you download a very, very small image and
    write it to a CD, DVD or USB stick. The idea is to boot the machine into a very
    basic image that''s nice and small to download, and has just enough to get the
    machine up and running, connected to a network and give you a (hopefully) comprehensible
    user interface through which you can select your installation options.


    Below: It''s important to check the speed of your internet before you do a basic
    internet install.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_119_1.png)


    The benefit of a basic internet install is that you don''t need a big beefy USB
    stick to house the installer files, which is great if you''re going to do a fairly
    customized installation with a small set of features (why download a


