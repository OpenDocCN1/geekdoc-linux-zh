  md: '# DOWNLOADING YOUR CHOSEN DISTRO


    If you''re a reader of one of the popular Linux magazines, then you''ll find one
    or more Linux distros on the DVD that comes with each issue. It''s very likely,
    though, that''s not the one you''d prefer to use – so you''ll want to go out and
    get the one you want.


    For the commercial offerings from the likes of Red Hat and SUSE, you''ll have
    to stump up real money; both of these have online shops. For the free offerings,
    it''s just a case of navigating the distro''s website and downloading the one
    you want.


    Below: It is wise to read up on a distro before committing to it.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_83_0.png)


    # WHERE TO GO


    Of the distros we''ve mentioned already, here''s where to go and look:


    +   - Red Hat Enterprise Linux: www.redhat.com/en


    +   - Fedora: www.getfedora.org


    +   - CentOS: www.centos.org'
