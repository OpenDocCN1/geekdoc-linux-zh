    # Welcome to The Open Source Initiative


    As a global non-profit, The Open Source Initiative (OSI) protects and promotes
    Open Source, championing Open Source in society through education, industry and
    infrastructure, preventing abuse of the Open Source concept. See our about and
    history for more information.


    Open source software is software that can be freely used, changed, and shared
    (in unmodified or unmodified) by anyone. Open source software is made by many
    people, and distributed under licenses that comply with the Open Source Definition.


