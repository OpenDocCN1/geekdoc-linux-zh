- pgno: 21
  md: '# LINUX DOWNSIDES


    There have been some controversies surrounding Linux. One of the most widely heralded
    Linux contracts was when the City of Munich decided to switch from Windows to
    Linux back in 2003. It started to move 4,000 desktops to a distro LiMuk, but things
    didn''t quite work out as expected, and five years later, there''d only an adoption
    rate of 20 cent. Eventually, the target desktops were all migrated, just in time
    for the deputy mayor to announce that the city was thinking of switching back
    to Microsoft.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_21_0.png)


    There were two issues at the heart of this decision. One of these was the cost
    of supporting Linux. As mentioned earlier, it''s a bit of a shortage of skilled
    Linux developers at the moment, so working with Linux is a lot more expensive
    than working with Microsoft. It''s true that all the major Linux vendors will
    offer in-house support – and there are vast forums to call on – if you need hardcore
    Linux technicians, they are going to be more expensive than Microsoft counterparts.


    # Compatability


    The other problem with the Linux implementation in Munich was the lack of operability
    with existing Microsoft programs, both within the city and with other German local
    authorities. It should be stressed that, as yet, there''s no decision as to whether
    Linux will be ditched,'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'but the arguments about the roll-out show that there are still a lot of issues.
    Munich isn''t alone, other local authorities have looked to move to Linux only
    to draw back (Bristol City Council investigated the possibility only to decide
    to stick with the status quo). They all face the problem of a lack of Linux developers
    and problems with operability with existing applications.


    # A HUGE VARIETY


    Another problem with Linux is the number of distros. This makes it tough to make
    the right choice. What doesn''t help is that each distro has its own supporting
    cast of fanatics and asking 100 Linux users for their opinion would quite possibly
    elicit 100 different responses, each person pushing his or her favourite. It''s
    not an entirely personal preference: there are some scattered examples where a
    product doesn''t work with one Linux distro but work with another. It doesn''t
    happen often, but there are some slight oddities around.


    # Linux Programmers


    The fact that Linux is open and that''s plenty of opportunity for discussion is
    normally presented as an advantage for the operating system, but it can be a disadvantage
    too. There can be conflicting pieces of advice given and it''s not always easy
    to sort out the useful advice from the unwanted. There have also instances when
    developers have got sidetracked into areas that are interesting for programming
    challenges but not so useful for users. The likes of Microsoft and Apple will
    task their programmers with solving real user challenges to offer features that
    are useful (not always successfully, it must be said).


    Linux programmers may well be more interested in solving technical problems.


    But these are minor issues when it comes to home users. For most people, Linux
    offers a world of new experiences and an opportunity to move away from the limitations
    of Windows.


    > Hot Tip

    Confused by the many different distro options? You can check the top 100 on the
    Distrowatch website: distrowatch.com'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# LINUX HISTORY


    Linux didn''t appear out of nowhere and it''s useful to examine how the software
    came into being. This is because history has a bearing on how the operating system
    is perceived today and why some companies and individuals, who would normally
    be expected to be sympathetic, have issues with Linux.


    There''s a philosophy driving Linux: a collaborative, sharing movement. This has
    been a reaction against the use of proprietary software (the likes of Microsoft
    or Apple). It''s important to realize that Linux isn''t out on a limb, here there
    are plenty of other similar initiatives – it''s just that Linux is the one with
    the most visible presence.


    **Below:** GNU operating system was one of the first examples of a free software
    project.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_23_0.png)


    # Free Unix!


    Starting this I am going to write a complete Unix-compatible software system GNU
    (for GNU''s Not Unix), and give it away for free to whoever wants. Contributions
    of time, money, programs are treated equally.


    To begin with, Unix will be a kernel plus all the utilities to write and run C
    programs: editor, C compiler, linker, assembler, and a few other things. After
    this we will add a text formatter: a YACC, an Em game, a spreadsheet, and other
    things. We hope to supply, everything that the user needs and anything else he
    might want, including online and hardcopy documentation.


    GNU will be able to run Unix programs, but will not be identical to Unix. We will
    make all improvements that are convenient, based on-'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The roots of the operating system lie in the free software movement of the
    1980s. One of the leading lights of this was a programmer called Richard Stallman
    who, in 1984, set up the GNU Project, which in turn led to the Free Software Foundation
    the following year. In this case, ''free'' is free as in politics, not free as
    in beer (to use the usual analogy).


    # PRINCIPLES OF FREEDOM


    The idea behind this freedom was to give computers more power to share information,
    a collaboration that would lead to improved performance. Under this concept of
    freedom, users had the power to study the underlying code, poke around with it
    as they wished and modify it accordingly. One of the important aspects of this
    development was a new type of software licence – the GNU General Public Licence
    (GPL), which instead of the usual copyright restrictions, operated under ''copleft''
    guidelines.


    # The General Public Licence


    This type of licence, developed by Stallman, not only ensures that software is
    free to be modified, but that these rights are retained even after modification.
    In other words, this means that an individual or organization cannot take free
    software, modify it and use that modification for proprietary purposes – once
    free, always free.


    The GNU Project was all developing a completely new type of operating system,
    one that operated under these free principles. It was into this world that Linux
    was born: it was developed using GNU tools and released under the terms of the
    GPL.


