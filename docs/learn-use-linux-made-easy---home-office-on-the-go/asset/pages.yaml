    > Hot Tip Ask Google to tell you about the ''shebang'' or ''magic line'' – it''s
    a way of forcing the system to use the right shell to run a script.


    # THE IMPORTANT THING ABOUT SHELLS


    It doesn''t actually matter that much which shell you use. In reality, the functionality
    is largely the same, albeit with a few bells and whistles and a significant difference
    in command and syntax between the csh family and the sh family. When it comes
    to scripting, unless you''re a rocket scientist, there''s little you can do in
    one shell that you can''t do in another.


    And which should you go for? If you''re starting out, then the sh family – mainly
    bash – would be the sensible choice. The sh-style shells have cribbed most of
    the cool features of the csh family anyway, and given that all the start-up scripts
    are sh-based too, it''s where the smart money goes when you''re starting up in
    Linux shells.'
