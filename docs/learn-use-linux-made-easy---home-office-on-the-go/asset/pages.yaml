    +   - Debian: www.debian.org


    > Hot Tip

    We prefer to use ''Live'' images – those boot a whole Linux instead of just a
    minimal installer. You get more flexibility that way.


    The usual way of installing Linux is to download the basic installer image and
    booting it from a DVD or USB key (we prefer USB) – it''s so much more convenient
    and it''s no harder than creating a DVD image). The basic installer image isn''t
    a complete set of installer files. Instead, it just has enough code crammed in
    to be able to boot most machines, display an installer GUI on the screen, configure
    the network (either cabled or wireless) and then download the rest of the options
    you''ve chosen via the internet. It rely on you having a decent speed internet
    connection, but these days, that''s seldom a problem.


