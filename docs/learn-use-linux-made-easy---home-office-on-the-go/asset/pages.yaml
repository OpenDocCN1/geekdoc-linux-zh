- pgno: 98
  md: '# NEXT STEPS


    > Hot Tip

    Updates can take ages, but they seldom fail, so there''s nothing to stop you going
    off and leaving it to chug away for a while.


    # CHOOSING YOUR PROGRAMS


    OK, so we now have a working system that''s nicely up to date. Now it''s time
    to decide what programs we actually want to run on.


    One of the things with the open source world is that there are often several alternatives
    when it comes to choosing the programs you adopt. So, for instance, if you want
    an email system, you have loads of options, of which the two popular ones are
    Postfix and Sendmail. Similarly, if you want a database system, you''ll probably
    choose between MariaDB (the new alternative to the famous MySQL package) and PostgreSQL.


    Do you have to choose, or can you actually run two systems side by side? The answer
    is that it depends. For an email server package, you need to choose one and stick
    with it: because mail software ''listens'' for incoming connections in a particular
    way, only one program can be


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_98_0.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'listening at any one time. But for databases and many other packages, you''re
    perfectly okay to run two or more equivalents side by side – though, of course,
    we''d always recommend picking one and sticking with it, because it saves having
    to learn several systems.


    # STICK WITH PACKAGES WHERE POSSIBLE


    Sometimes, you''ll come across programs that haven''t been made into official
    packages for the particular Linux distro you''ve chosen. Of course open source
    software is available in a form where you can download and build it yourself,
    but this is strictly not for ግን. Although authors go to great pains to make the
    build process as easy as possible, you''ll still often come across error messages
    that are cryptic and not covered by the installation documentation, which means
    you spend more time Googling and hoping everyone else has seen that problem than
    installing and using the programs.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_99_0.png)


    > > Hot TipnPackages are great, because someone else has figured out all the tricky
    stuff about building them. Make the most of their hard work!


    So unless you really have to use a particular package and it''s worth the grief
    of a self-build process, stick with programs that you can install from prebuilt
    packages.'
  merge: -1
  img_proc: true
