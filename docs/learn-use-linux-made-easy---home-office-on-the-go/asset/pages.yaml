- pgno: 133
  md: '# WHAT HARDWARE TO USE


    If you''re going to run Linux, you''ll need something to run it on. For now, we''ll
    assume that you''re going to be using a real, live, physical computer of some
    description (Linux on Cloud services like Amazon Web Services is great, but not
    what we''re here to talk about). The great thing with modern Linux implementations
    is that the range of hardware they support is vast – so you have a range of options,
    from PCs you''ve put together in your shed up to high-performance commercial machines.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_133_0.png)


    # INTEL VERSUS OTHER PROCESSORS


    Those of us who are old enough to remember will recall that Windows was once more
    than just an operating system for Intel processors. Windows was also available
    for the DEC Alpha processor, and in fact, we''ve seen it with our own eyes. Similarly,
    Sun''s Solaris isn''t just compatible with Sun''s own SPARC processors, but also
    has x86 and x86-64 support (and, of course, its ancestors in the SunOS days supported
    the 68000-series processor family and the PowerPC processor was supported in one
    short-lived version).'
  merge: -1
  img_proc: true
