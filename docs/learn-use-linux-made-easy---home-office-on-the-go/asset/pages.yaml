  md: 'It''s fair to say SUSE would be a no-brainer choice for platform. On the VMware
    front: does the preference for SUSE mean other Linuxes won''t work? Of course
    not, but you''d be silly to disregard any kind of vendor tie-up that might imply
    more robust interoperability testing, or that both parties'' developers have sat
