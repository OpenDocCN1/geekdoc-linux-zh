- pgno: 121
  md: '# DVD Install


    The final option is to download a bunch of ISO images but burn them to CDs or
    DVDs for use as installation media. This is about as close as you get to a ‘traditional’
    installation method, so you can enjoy a nostalgic half hour of swapping discs
    when prompted to do so. We’d recommend against CDs for the larger distros, but
    DVDs are fine (Debian 8, for instance, uses 17 CDs including the updaters you
    go for the full set, but only four DVDs).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_121_0.png)


    # SUPPORT OPTIONS


    The final consideration in how the various distros work is the support model –
    how you get help in the event of a problem. And here, there are three options,
    of which the first isn’t particularly supportive


    # Do It Yourself


    People around the world are looking after their own Linux systems. After all,
    millions of us are running our own Windows-based PCs at home and in small offices
    without needing a support contract from Microsoft, we’re still able to run updates
    and do configuration and basic troubleshooting ourselves. The DIY option is most
    definitely a perfectly sensible choice.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_121_1.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Free Linux Plus a Consultant


    This is a very popular option for small businesses that want to use open source
    Linux installations instead of splashing out formal support for commercial Linux
    installations; when you have in any number the costs do tend to be significant.
    There''s still a thriving industry of small and medium-sized companies that do
    general IT support on a contract basis, for significantly less cost than a collection
    of commercial Linux subscriptions.


    > Hot Tip

    Free Linux plus a consultant is a surprisingly good value way to go – and there
    are some great ones out there that you can pay just a modest retainer.


    # Commercial Support


    Option three is to go for the paid-for commercial support. As we''ve seen when
    comparing the cost of a new small-business server with Windows and different commercial
    distros, Linux is actually more costly if you simply compare prices, but what
    you get is very impressive: Red Hat''s basic support gets you a response within
    one business hour, for example, while SUSE''s is largely similar (working-hours
    cover, with two-hour response). Pay more for the advanced option and you''ll have
    24/7 cover for system-down problems. It''s not cheap, but the support is commensurate
    with what you''re paying.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_122_0.png)'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# SIMILARITIES AND DIFFERENCES


    Having noted that Linux distros come in different forms with regard to how you
    get them, install them and support them, the other side of the coin is the distribution
    you use. All distros have some features in common – the core elements that make
    them Linux rather than anything else. But there wouldn''t be a need for so many
    distros if they didn''t have all their distinguishing features.


    # WAS IT A GOOD YEAR?


    We''ve told you a bit about the Linux makers, but let''s have a brief ample through
    the chronology of the various Linux distros we discussed throughout these pages.


    | Slackware Linux Project |

    |---|---||

    | News | Slackware 14.1 is released! | 2013-11-07 |

    | Security Advisories | After a year of development (including the beta release
    and release candidates to get everything polished up) we were proud to announce
    the availability of the new release. You will find updates to the system, with
    the latest compilers and developer tools, and versions of environments. The Linux
    kernel is updated to 3.10.17 (part of the 3.10.0 release) with the latest long-term
    support (from the kernel developers). x86, 64 version of the kernel also supports
    for installing and booting on running systems. |

    | Book | |

    | General info | |

    | Get Slack | |

    | Install Hoax | |

    | Packages | |

    | Changelogs | |

    | Propaganda | For additional information, see the official announcement and the
    release notes. For a complete list of listed packages, please see the package
    list. |

    | Ports | Build scripts for all kinds of additional software for Slackware 14.1
    can be found on the slackware.org website. |


    Slackware Slackware was the first Linux we came across. One of the authors worked
    as a Sun system administrator when it arrived in June 1993, which gave the benefit
    of a half-decent connection to the internet (still a flickering concept in those
    days) and unlimited supply of 1.44MB floppy disks. Configuring Slackware was neither
    quite pretty, but it worked.


    Above: Here you can see Slackware. It isn''t pretty, but it is one of the founding
    fathers of Linux.'
