- pgno: 77
  md: '# COMPARISONS - SOME SIMPLE SCRIPTS


    We''ve had a look at what the shells do when you start them, but what are we actually
    putting in those configuration files? Answer: we''re putting a collection of shell
    commands – commands that tell the shell to do stuff. In our case, each of the
    config files have a simple command that set the prompt. In our bash .profile we
    had:


    ```

    PS1=''profile@\t:\w\$

    ```


    And in our tcsh .cshrc we had:


    ```

    set prompt = cshrc:''${cwd}\ \\''

    ```


    We won''t go into precisely what these commands mean; suffice to say that the
    power of a shell is that it does ways more than provide you with a way to execute
    command programs.


    # Command Program


    By a command program, we mean something like df – the command that summarizes
    disk usage. It feels like the shell is running the command but all it''s actually
    doing is running a program called df''s located, in the case of our test machine,
    in directory /usr/bin. The shell is doing nothing but telling the program to run.
    The shell, however, have a whole load of built-in commands and directives that
    allow you to do useful stuff. As well as just running oneoff commands, you can
    tell the shell to do clever things. In this example, we''ll use tcsh to enumerate
    all the files in a directory called ''files'' and write the filename to the terminal:


    ```

    cshrc:${cwd} % foreach i `ls files`

    foreach? echo $i

    foreach?

    ```


    +   1

    2

    3'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'The foreach command, as it suggests, executes something for each of the items
    in the list you throw at it (in this case, the output from the command ls files
    which catalogues the content of the directory ''files''). The echo command writes
    the name to the terminal, and end tells it we''ve finished writing the loop. Of
    course, we can do the same thing in bash:


    ```

    [dsc@localhost Documents]$ for i in $(ls files); do

    > echo $i

    > done

    1

    2

    3

    ```


    The neat thing with shells is that you can take these commands and write programs
    – files full of commands that string loads of functions together to produce what,
    in many cases, are complicated results. These programs – the files full of shell
    commands – are called scripts. You can do anything in a script that you can do
    on the command line. So we can express the two functions we''ve just seen as scripts.
    We''ll call the tcsh one files.tcsh:


    ```

    foreach i (''ls files'')

    echo $i from the tcsh script

    end

    ```


    ... and the bash one files.bash:


    for i in $(ls files); do

    echo $i from the bash script

    done


    > Hot Tip

    Play with some scripts and get to grips with how they work; they''re a great way
    to automate stuff you''d otherwise do by hand frequently.


    As you''ll see from the echo lines, we''ve embellished slightly so we can see
    which version''s running. To run them, we start a new instance of the shell and
    pass it the name of the script we want to run.'
  merge: -1
  img_proc: true
