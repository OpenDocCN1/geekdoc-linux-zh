  md: 'MAXWELL COUTER (general editor and author) has been an IT journalist for 30
    years. He was the founder-editor of Cloud Pro, the UK''s first cloud publication,
    he set up Techworld and was editor of the UK''s first networking weekly newspaper,
    Network Week. He has written for many computer publications, contributed to national
    newspapers and is a frequent conference speaker.


    DAVID CARTWRIGHT (author) has worked in the IT industry for over 20 years, specialising
    in infrastructure and security, and has been a Linux user since the 1990s; he''s
    presently an IT manager for a telecoms company. He writes for various IT industry
    publications, and is a former columnist for Linux Format magazine. David is a
    Fellow of the British Computer Society, a Chartered Engineer and a Chartered Information
    Technology Professional.


