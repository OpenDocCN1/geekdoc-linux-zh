- pgno: 173
  md: '# SELINUX


    Hand-in-hand with IPTables on today''s Linux machines is the SELinux (Security
    Enhanced Linux) package. It''s not an alternative to IPTables, but a complementary
    package that is implemented as a kernel module and provides additional security
    in a different way. While IPTables is all about defining whether network traffic
    gets in or out, SEL which components within our Linux machine are allowed to interact
    with each other, and to what extent. As the SELinux production team puts it, it
    allows you to ''define how applications and users access different resources such
    as files, devices, networks and inter-process communication''. SELinux is all
    about using ''policies'' to restrict access only where it''s required. However,
    the motivation is the same as that of IPTables – specifically to prevent nefarious
    activity whilst permitting the functionality we actually desire.


    > Hot Tip

    SELinux is a bit harder to get grips on than IPTables, the documentation can be
    a bit cryptic, but be persistent and you''ll be fine.


    ```

    user@localhost:~$ getenforce

    Enforcing

    user@localhost:~$ setenforce 0

    Permissive

    Class: 43  Permissive

    Types: 483  Attributes

    Domain: 29  Policy

    Allow: 107254  Neverallow

    Audit: 158  Sontactype

    Type: 16  Type

    mem: 78  allowed

    Role: 414  Range

    Context: 121  Valid

    Status: 27  used

    Defcontext: 101  Port

    Process: 8  App

    Permissive: 1  Failed

    ```


    You''ll remember from our example of setting Linux as a NAS that we had to use
    the ''setsebool -P samba_enable_home_dirs'' directive before SELinux would let
    us access Max''s home directory as a shared folder.


    Left: SELinux policy examples.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# LINUX AS A FIREWALL?


    So we''ve discussed how Linux can protect itself using both network-level security
    (IPTables) and internal restrictions about what can access what (SEinux). But
    would you actually use Linux as a firewall if you were, say, running a small business
    and you wanted to secure your world? To be honest, probably not. You certainly
    wouldn''t decide to take your fileserver and configure IPTables as your corporate
    firewall too. Why would you turn your main data repository into something that
    you actively expect to have fend off attacks? If your cheap router isn''t up to
    the job, there are a number of dedicated devices on the market that will be a
    lot easier to set up and are probably a lot more reliable than having a PC with
    a spinning disk just waiting to die.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_174_0.png)


    So use the tools available to you – IPTables and SELinux – to secure your Linux
    machines, but we wouldn''t suggest you rush to use it as the security device for
    protecting your world, as there are far easier ways than that.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# WIRELESS SECURITY


    The last area of security in the world of Linux is wireless security. We''ve already
    touched briefly on the wireless networking options open to you, so now we''ll
    have a proper look at them.


    # WHEN NOT TO USE WIRELESS


    It''s perhaps slightly odd in a chapter about wireless security to talk about
    why you wouldn''t use it, but there are some perfectly good reasons why you would
    look to use cabled networking in certain situations.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Static Machines


    If you have a desktop PC near a network outlet that you can connect easily to
    the network via a copper or fibre cable, just to do it. While the inventors of
    networking are trying their hardest to make their brainchild go faster and faster,
    they''re still way behind the cable-based lot. Buy a desktop PC today and it''ll
    come with a built-in Gigabit Ethernet port, and at the infrastructure end, the
    switching aspect is pretty cheap too.


    # Diagnosing Problems


    Cabled networks are also far easier to diagnose than wireless ones, as you know
    precisely what''s connected to what and can easily track down rogue traffic to
    specific devices or switch ports.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_176_0.png)


    This said though, we all want to do more and more wireless networking – not least
    with our smartphones and tablets and laptops (Linux-based ones, hopefully) that
    we love to cart around wherever we go. The MacBook Pro you''re typing this on
    doesn''t actually have an Ethernet port to use a cable connection requires a little
    dongle) and so wireless is increasingly becoming the order of the day.


    > Hot Tip

    We''ve told you to use wired networking where you can, but if it''s not feasible,
    then wireless is fine – and if you used cables for some machines, it leaves the
    wireless network for sharing fewer devices (which means it''ll go faster).'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# THE WIRELESS INFRASTRUCTURE MATTERS


    Wireless networking isn''t trivial if you do it properly. As we sit writing this,
    we''re connected not to the wireless router that drives our network, but to a
    small extender unit that''s taking our data streams and throwing them at the router
    via the mains circuits of the building is a popular way of increasing your wireless
    coverage, incidentally, it''s as fast and cheap. That''s fine, as we''ve been
    careful to secure everything. Like most of you reading this, we can see several
    wireless networks in their ''available networks'' list that are nothing to do
    with us and are potentially causing interference in terms of radio channels.


    # Simple Security Measures


    If you use multiple devices to ensure that your wireless network is as available
    as possible in your building, try to use extenders to genuinely extend the network
    instead of acting as a shedload of different networks. Many of the offerings on
    these days let you do this, and it means you configure each PC once for a single
    network instead of having separate network IDs and encryption levels for each
    of the access devices on the premises.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_177_0.png)'
  merge: -1
  img_proc: true
- pgno: 178
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_178_0.png)


    # Administration Interfaces


    Make sure to secure your wireless devices'' administration interfaces. Your router
    is probably also your wireless infrastructure, and most people have never changed
    the admin password on the device. We were at a pub quiz, and were impressed that
    they had a wireless system that used an iPad app for buzzing in. In the interval,
    once we logged into the wireless router''s maintenance page (username ''admin'',
    password ''password'') it was very tempting to tell it to block connections from
    all quizzers but us. We''re about to tell you to set a complex key for your wireless
    connection, so don''t ruin it by forgetting to secure the router itself.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# WIRELESS SECURITY PROTOCOLS


    Let''s have a quick recap of the various wireless security protocols. If you recall,
    they''re split into two categories: authentication/admission control and encryption.
    Authentication first, then,


    +   - WEP (Wired Equivalent Privacy): Prehistoric technology that you shouldn''t
    touch with a bargepole. It was fine when it came about in the 1990s, but these
    days, it''s easier to crack than an egg.


    +   - WPA (WiFi Protected Access): Far better than WEP, but it has been superseded
    (as you''ll see in a moment). If your wireless infrastructure is quite old, this
    might be the only non-WEP protocol available to you, but it''s more likely that
    you''ll have the option of ...


    +   - WPA2: The new version of WPA. The best so far and the one to choose. If
    all your wireless devices are new enough to support WPA2, then switch your wireless
    infrastructure to use only WPA2 and permit no others. The main development of
    WPA2 is that it includes support for more secure encryption protocols than its
    predecessor.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Moving on to encryption, the options you get depends on your chosen authentication
    protocol.

    With WEP all of the security options are utterly appalling because it''s so antiquated
    and hence the standard never reached the stage of having sufficiently complex
    encryption to cope with modern methods. With the WPA family you get the option
    of the Temporal Key Integrity Protocol (TKIP) or the CCMP encryption standard.
    The latter is based on AES, or the Advanced Encryption Standard, and is considered
    the gold standard right now, so just use it and don''t think about TKIP.


    # Remember, You''re Not a Company


    You''re not running a corporate network, so if you see options as ''WPA-Enterprise''
    when you''re setting up your equipment, you can largely disregard them. This option
    lets you do clever things like installing a digital certificate on each of your
    portable devices and authenticating your phone, tablet or laptop against a corporate
    security server to verify that it''s genuinely a device that belongs to the corporate
    network. It''s very cool, almost certainly not something you''ll use if you''re
    reading this book (at least not).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_180_0.png)


    Above: Choose a very secure password for your wireless network.


    # PASSWORD PROTECTION


    The way your device will authenticate, then, is a Pre-Shared Key (PSK). As it
    sounds, this is a string of characters that''s configured into the wireless infrastructure
    and which you also enter into any device that wants to connect to the network.
    When the PC attempts to connect to the wireless network, it negotiates a connection
    between the two parties verify that the client machine has the right key. It should
    go without saying that you need to make your PSK unguessable as possible and as
    long as is reasonable (it can be up to 63 characters). Ours is 21 characters long
    and contains a suitable collection of upper- and lower case characters, digits
    and punctuation, but it''s still sufficiently memorable that we don''t make too
    many attempts when trying to remember it when we get yet another tablet or smartphone.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 180 LINUX AND SECURITY


    # ROGUE ACCESS POINTS


    The last thing we''ll talk about in our discussion of wireless network security
    is when you come across wireless stuff that''s nothing to do with you. As we said
    earlier, it''s perfectly normal when selecting a wireless network to see a bunch
    of names that you don''t recognize. Although your wireless signal can be frustratingly
    attenuated through the flimsiest of doors or stud walls, it sometimes feels like
    six inches of lead wouldn''t keep next door''s wireless network from being visible
    in your living room. That''s not overly problematic if it''s your neighbour''s
    legitimate network (except when their kit decide to talk on the same


    channel as yours and kills the throughput). But what if someone''s run up a nefarious
    wireless device with the same network name you''re expecting to see and has allowed
    connectivity without requiring a key?


    The answer is that you have to be cautious and sensible. Tell your machine that
    it''s not allowed to connect to any old network, without specifically selecting
    it, and when you''re connecting to your legitimate network make sure it asks you
    for the PSK (if it doesn''t, you''ve probably been nabbed by the dodgy network
    because yours should demand authentication).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_181_0.png)'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# KEEP ON TOP OF IT


    Above all with wireless security, keep on top of developments. Happily, it''s
    one of the areas of IT that doesn''t change all that often. WPA2 has been with
    us since since 2004, for example, and so there''s no annual panic to get to grips
    with new standards. WPA2 is perfectly fine, and CCMP/AES is great for encryption,
    but don''t ruin it by forgetting to change the admin password of the router and
    letting any old idiot get into the router config page.


    # Hot Tip


    Be suspicious of any new network you see, and don''t try to connect to it. There
    are malware programs that advertise themselves as WiFi networks, just waiting
    to pounce when you connect.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_182_0.png)'
  merge: -1
  img_proc: true
