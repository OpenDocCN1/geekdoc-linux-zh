- pgno: 60
  md: '# STANDARD CONFIGURATION


    The programs in a Linux distro come from a wide range of different developers.
    As we''ve said, the producers of the distro take the applications, configure and
    compile them, and include them as packages in the distro. They don''t just download
    the source code of each application and compile it; they plan a system-wide directory
    structure and arrange all of the applications so that configuration files are
    all stored in a single, comprehensive directory structure. The default location
    for things configuration files and executable programs differs from application,
    so the distro producers do great pains to organize everything and change the locations
    from the app developers'' defaults to directories that are common with everything
    they include in the distro.


    This is particularly important when apps are interdependent. For example, it''s
    common to run database-backed websites on Linux – the popular approach is to combine
    the Apache web server, the PHP development language and the MySQL database. Distros
    are built so that each of these is already set up to work immediately with the
    others, with no need for further tweaking, they''re built to a common configuration
    and directory layout. This approach saves vast amounts of time, so a bit of gratitude
    to the distro makers is order.


    # THE DISTRO IS THE BUNDLE


    A Linux distro is more than the sum of its parts. In its basic form, it brings
    together a kernel, a collection of commands and wraps an installer program around
    them. But the real value of a distro is the tremendous coherence between all of
    the components – the standardized directory structure and the fact that the packages
    are compatible with each other, having been built based on a set of standards.
    In the package manager that lets you add in and drop out elements at will and
    the distro''s value is clear.


    > Hot Tip

    When you''ve explored a few applications, you''ll start to find your way around
    the common places for configuration files without really thinking about it.'
  merge: -1
  img_proc: true
