    SUSE still has an open source offering, of course, called openSUSE.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_63_0.png)


    # RED HAT


    Red Hat is a huge name in commercial Linux implementations. Founded in 1993, the
    company became hugely well known by the late 1990s, because it made Linux so much
    easier than before. The Red Hat Package Manager (RPM) suddenly made application
    installation and update far easier than before (you''ll recall that we discussed
    the benefits of package managers earlier), and the company''s online subscription
    and upgrade mechanism allowed the user to update their installation with far more
    confidence than doing it by hand.'
