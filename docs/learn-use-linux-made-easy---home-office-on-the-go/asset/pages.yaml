- pgno: 193
  md: '# SETTING WIRELESS


    So, we''ve made our Linux machine talk to the world using cabled connections,
    but of course most people who are using Linux on desktop or laptop machines won''t
    want to be tied down – literally – to their cabled networks. Wireless is, then,
    the order of the day.


    # EARLY WIRELESS


    Linux''s early history of wireless support was, frankly, appalling. This was primarily
    because there were various vendors of wireless network adaptors and they were
    too busy concentrating on just making it work to be able to spend time either
    producing Linux drivers or giving significant


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_193_0.png)'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'help to the open source community. In fact, thinking back to those days, the
    whole wireless field was a bit wobbly in its infancy, because there were a few
    different strands to the development of the protocols, and it was somewhat unclear
    which ways things would go. However, that''s probably to be expected, as happens
    in many technological fields.


    > Hot Tip

    Wireless technology is now very well established, so you don''t have anything
    like the oldies trying to use it back in the early days.


    Once wireless came of age and became well established, Linux started to catch
    up in its ability to use it. And today, wireless is just as well supported as
    cabled Ethernet connectivity by the Linux producers.


    # WIRELESS TECHNOLOGIES


    The technology standards for wireless networking come under the IEEE802.11 range
    of specifications. The initial developments were split largely into two streams:
    one using 2.4GHz radios and one using 5GHz radios. The main ones you''ll come
    across:


    ```

    root@encoder-local:~$ ifconfig wlan0

    ```


    **Above:** We can use l s i s p c 1 to find out what wireless adapter we have.
    Once we know this, it is easy to search on the internet for its capabilities'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_195_0.png)


    +   - 802.11b: The first mainstream 2.4GHz implementation, with a top speed of
    11Mbit/s.


    +   - 802.11a: The first mainstream 5GHz implementation, with a top speed of 54Mbit/s;
    although it came out around the same time as 802.11b it was much more expensive,
    so most small installations went for the slower but significantly cheaper option.


    +   - 802.11g: An evolution of the 2.4GHz approach, which brought the top speed
    up to match the 54Mbit/s of 802.11a.


    +   - 802.11n: Applied to both radio speeds, and providing link speeds up to 72Mbit/s
    on a single channel (plus the ability to aggregate channels for higher speeds).


    > ### Hot Tip

    Be sensible with your choice of wireless – do you need superfast wireless if you
    only have an 8Mbit/s ADSL line? Remember, you should use kit that supports older
    standards so your phones, etc. are able to use it.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# SETTING WIRELESS


    +   - 802.11ac: Another 5GHz implementation, ratified in 2014, aimed at bringing
    speeds up into several hundreds of megabits per second to keep wireless in line
    with the kind of speeds we see in cabled networks.


    # What This Means for Us


    Simple: we find that the wireless LAN adaptors in laptops – particularly the cheaper
    ones – tend to support the 2.4GHz radios more than they do to 5GHz ones. For example,
    our test laptop’s spec sheet says that it supports 802.11b, 802.11g and 802.11n
    – no 5GHz radios for us,


    As for Linux itself though, we’re concerned with something more fundamental: whether
    or not the actual wireless adaptor is supported by our Linux distro (or, more
    accurately, the kernel at the core of it). Unless you have really super-innovative
    laptop, this isn’t usually a problem.


    # Wireless Speeds in Real Life


    Before we get into the configuration side of wireless, a quick note of caution:
    wireless networks like air, and they don’t like doors and walls. So if we connect
    our test laptop to the wireless service of the main router, which is about ten
    yards away and the other side of an internal wall, we see it connect at 13Mbit/s
    (see right).


