  md: 'friends of ours also have a fair range of options. Beyond these, you''re into
    pretty specialist processor architectures. You can run Debian or Fedora on your
    IBM s390x processor, for example, or if you have a MIPS architecture, your choices
    include Debian and Parabola. Why do you care it? Well, if you have a multi-platform
