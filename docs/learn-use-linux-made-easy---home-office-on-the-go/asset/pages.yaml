    different flavours of the same distro on the variety of kit.


    # Gentoo Linux


    There''s one distro we''ve not touched on yet, incidentally, and that''s because
    it''s bonkers and deserves a special mention all of its own. We just checked the
    download page for Gentoo Linux and it gave us the choice of x86, x86-64, Alpha,
    ARM, HPPA, IA-64, PowerPC, s390, SuperH and SPARC. Oh, and a MIPS version that''s
    labelled ''experimental''. Linux distros don''t get any cross-platform than that.


    > ### Hot Tip

    You probably don''t have an IBM mainframe in your shed, so one of the x86 or x86-64
    ones will be good enough.


