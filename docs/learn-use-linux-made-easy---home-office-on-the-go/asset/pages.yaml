- pgno: 138
  md: '# A SERVER IN YOUR COMPANY''S OFFICE


    What do you do if you want a server for the office to run as a fileserver, or
    an email server, or a web server? Simple. Simple. Let''s take an example of an
    entry-level, mainstream server – single processor, single 1TB hard disk and 8GB
    RAM. With Windows Server 2012, this comes in at £1,899/$2,988. Hang on though:
    if we decide to go for Red Hat Enterprise Linux, it actually goes up to £2,016/$3,172.
    And for SUSE, it''s £2,102/$3,307.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_138_0.png)


    Makes Linux sound a little unattractive. Then, of course, as we''ve seen you don''t
    have to use a commercial version of Linux if you''re reasonably confident that
    you can look after the system yourself, or perhaps that you can engage a support
    partner to do it for you. Because if we check the price of the same server the
    price of the box comes down to a mere £1,252/$1,969.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'This isn''t a big saving on a single box, but if you have two or three servers,
    it starts to add up. And this is our experience in small businesses – it starts
    with one or two machines and grows to perhaps four or five. The saving is tangible
    and can make a genuine difference. And even if you decide that you will go with
    at least some Windows servers (not a silly thing to do if you want to use native
    Directory support, for example), then there''s nothing to stop you from integrating
    Linux servers into Active Directory so that the two platforms work in harmony.


    > Hot Tip

    Linux support is more expensive than the commercial price of Windows, but you''re
    getting more for your money in terms of live support from real technicians.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_139_0.png)'
