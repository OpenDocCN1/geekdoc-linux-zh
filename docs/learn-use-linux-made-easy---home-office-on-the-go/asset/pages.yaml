- pgno: 225
  md: '# USING THE APACHE WEB SERVER


    We mentioned earlier that Apache is a hugely popular web server; what we didn''t
    mention is that it''s the most popular in the world by a long way.


    So the 325 million or so Apache installations in the survey we cited represents
    about 38 per of the servers the survey has found; Microsoft''s server offering
    has a mere 27 per or so, and thus is is some way behind. We''ve done the basics
    of how to get an Apache server working (see pages 209–211), so in this section
    we''ll go into a bit more depth and show you how to do so some more interesting
    stuff with your Apache server.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_225_0.png)


    # IT''S CALLED ''HTTPD''


    There was a time when Apache referred only to the web server software of that
    name. Over the years though, the Apache project has expanded vastly and now has
    a shedload of different applications under its umbrella. The HTTPD (HyperText
    Transfer Protocol Daemon), as it''s called, is the web server package — and every
    reference you come across on your Linux machine talks about the HTTPD in some
    way.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_225_1.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'So for instance, you start, and restart the server by referencing the ''httpd''
    service:


    ```

    [root@fileserver~]# systemctl start httpd

    [root@fileserver~]# systemctl enable httpd

    [root@fileserver~]# systemctl stop httpd

    ```


    # CONFIGURING THE SERVER


    The configuration file is what you''ll fiddle with, and it''s called ''httpd.conf''.

    On Fedora machine, it''s located in directory ''/etc/httpd/conf/'', and as it''s
    a text file, you can simply navigate using the Files tool and double-click to
    fire it up in a text editor.


