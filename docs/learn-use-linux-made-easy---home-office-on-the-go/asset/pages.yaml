    # PROCESSOR PLATFORM


    Last and by no means, we have processor support as the key differentiator between
    distros. If you''re based on Intel-style processors (x86 or x86-64), then you''re
    suited for choice – though not for a moment that all Linuxes support these processors,
    as Yellow Dog with their PowerPC-based Macs will attest. Of the non-Intel processors,
    the ARM architecture is supported by a range of devices, and as well as Yellow
    Dog, those PowerPC'
