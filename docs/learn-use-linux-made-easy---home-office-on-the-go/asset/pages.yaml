  md: '# OUR CHOICE


    For our test machine, we''re downloading Fedora – specifically release 22. This
    came out in May 2015 – so at the time of writing, it''s a couple of months old.
    This is about the minimum age we''d consider using for a Linux machine that''s
    not running critical applications (in this case, it''s one of our laptops). If
    you''re a business and need to guarantee stability, you''d probably go for the
    previous version, as there will have more bug fixes for the various components.
