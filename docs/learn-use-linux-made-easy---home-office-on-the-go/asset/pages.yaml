- pgno: 64
  md: 'Red Hat Enterprise Linux, or RHEL as it''s generally known, is popular because
    of its longevity. Because Red Hat did it first, application developers have had
    a much longer timescale over which they''ve been able to tune their code to work
    fastest and most reliably with RHEL. It''s also very easy to find formal training
    and certification programmes for RHEL.


    Finally, the longevity of the Red Hat family brings with it a vast community of
    people using Fedora and CentOS (the open source offerings of the family). So if
    you''re one of those people and you''re looking to move to a general purpose,
    commercially supported Linux, then Red Hat will be the easiest one to learn thanks
    to the family resemblance.


    > Hot Tip

    RHEL is pretty much the daddy of commercial Linux distros, and is the name everyone
    knows. Don''t let that put you off the others though – they have their benefits
