- pgno: 36
  md: 'The truth is, Windows does seem a bit more unstable than other operating systems
    – as Mac users are fond of pointing out – and there''s an awful lot of restarting
    going on. It''s become a standard joke for any sort of problem – turn it off and
    turn it on again. The truth is, that does work most of the time, but it''s an
    inefficient way of dealing with problems.


    # Dealing with Updates


    For a start, there are regular Windows updates to deal with. These are pretty
    essential for keeping the system fresh. Then you''re probably updating the programs
    that run on your machine. Every time you do that, you''ll see a message about
    restarting – often when you''re in the middle of something critical.


    You can forget all of that with Linux. It doesn''t happen. There''s no restart
    every time there''s the slightest change to something on your machine. Whisper
    quietly, but there are Linux machines out in the big world that have been running
    for years, nonstop, without once having restarted.


    # POWERFUL SHELL


    The way that Linux is structured is a central kernel (the core operating system,
    surrounded by Linux utilities) and then the shell (the part that the user deals
    with). For older Microsoft users, Linux is a bit like returning to the days of
    DOS. You have to use a command-line interface and learn a whole truck of commands.
    It''s not intuitive like a GUI and there''s a need to get your syntax exactly
    right; however, a shell can be more powerful than a GUI, offering a level of control
    that you don''t always get with fancier options. This, of course, is something
    we still see with Windows; when there''s something sophisticated that needs to
    be done, the GUI is shoved aside. Microsoft itself has recognized this with the
    introduction of PowerShell, a very powerful tool aimed at business users of Windows
    – a sign of how the Linux mentality has had an effect on more traditional companies.


    > Hot Tip

    The shell, also known as the command line, was what used to scare people away
    from Linux. With a modern Linux desktop, there is no need to use the shell.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# INTEROPERABILITY AND DUAL BOOTING


    Linux plays well with other systems. It recognizes there''s a place for Windows
    and Mac OS X and will install alongside, share files with them and generally be
    nice to them. This is very different from the Windows view that dual booting means
    choosing between Windows 7 and Vista.


    There will be many Linux users for whom Windows is a must – maybe it''s for a
    particular game, maybe it''s for interoperability with business systems. In these
    circumstances, dual booting is not only an option, but essential.


    > Below: Linux works on a variety of hardware platforms, including on many sat-navs.


    > Hot Tip

    If you''re thinking about dual booting Windows and Linux, it''s best to have some
    unallocated space ready a separate hard disk for Linux. Otherwise, you''ll need
    to resize your Windows partition.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_37_0.png)


    As a side-product of this, we should also note that Linux is pretty happy to run
    on a variety of hardware platforms. We''ve already seen how it''s at the heart
    of a variety of devices from Tivo boxes to sat-nav kits, but it can also be used
    by any PC or laptop, including the popular Raspberry Pi machine. And in business,
    Linux can be deployed on any sort of chip architecture – from the Intel family
    to SPARC and IBM Power. More on this later.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# THE RESTRICTIONS OF LINUX


    It''s worth pointing out that there''s very little Linux can''t actually do: it''s
    just that the experience is not going to be as smooth as it is with Windows or
    with Apple''s iOS. You''ll be able to do everything with Linux that you do with
    these – it''s just that there needs to be a bit of fiddling about and searching
    around. Don''t let this put you off though, as that''s half the fun of using Linux.


    # OPERABILITY


    Linux is pretty interoperable with other software. But that''s not to say that
    every Linux distro will run every piece of software that''s ever been written.
    Even the most avid Linux user will admit that sometimes a particular distro will
    throw a wobbly when it tries to run an alien program.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_38_0.png)


    As we saw with the City of Munich example on page 20, one of the elements that
    bedevils commercial implementations of Linux has been the inability of some Linux
    distros to work with Microsoft software which, given its dominance in the commercial
    world, is a pretty big black mark.


    # SOFTWARE AVAILABILITY


    We''ve mentioned that there''s free (or sometimes paid-for) software that can
    replace many of the commercial packages out there. That''s true after a fashion,
    but what you''re getting is a like-for-like replacement. For example, GIMP is
    a great, free alternative to'
