- pgno: 140
  md: '# Comparing Costs


    Remember that in comparing the Windows and Linux costs, you''re not really comparing
    like for like; the commercial Linux give you not only the operating system and
    the ability to run updates, but also a variety of support such as helplines (Red
    Hat''s standard support model gives you phone and web support for unlimited cases,
    for example). So although it''s pricier, you get more for your money, even if
    you could have a self-serve option for free.


    # LINUX ON VIRTUAL MACHINES


    As a final note in this section about running Linux in a small office, let''s
    not forget the idea of virtual servers. This is where you use one or two fairly
    physical servers and a number of virtual servers – software-based servers that
    appear to everything on the network just like a physical machine but which share
    the resources of the physical kit they''re sitting on. Virtualization is most
    definitely the order of the day even in many smallish companies, because it lets
    you separate functionality between separate virtual servers, whilst letting them
    share the hardware of the physical kit as efficiently as possible.


    And, of course, every virtual server needs an operating system. If you spin up
    a Windows-based virtual server, then that''ll cost you a Windows licence, but
    if you spin up a Linux one – specifically one of the free distros – then it won''t
    cost an extra bean. Linux is brilliant for test, development and staging servers
    in a virtual setup, you can run as many machines as you wish without spending
    any money.


    # WHAT TO CONNECT IT TO


    When you''re looking at the kit you''re going to install Linux on, you also need
    to consider what you''re connecting it to – the other devices on the network that
    you might want to use for file sharing, probably a printer and almost certainly
    an internet connection. We''ve talked about how to set up the network connectivity
    of Linux, but what about the network infrastructure itself?'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Hot Tip


    If your PC isn''t going to move, use wired networking – it''s faster than wireless
    and it''s dead cheap.


    # Ethernet Networking


    The first rule is that if you''re using machines that aren''t going to move very
    much (a Linux desktop, for instance), then use Ethernet networking – that is,
    use cables rather than wireless. WiFi is brilliant for portable devices, but if
    your device isn''t portable, why not use a cable? Use Gigabit Ethernet: all new
    PC equipment will have a Gigabit port, and you can get a basic eight-port Gigabit
    network switch to connect it all to for about £20/$31, so there''s no reason not
    to.


    # Wireless Networking


    You''re almost certain to use wireless networking for portable devices, of course,
    which may mean a Linux-based laptop. Make sure you turn on the best authentication
    and encryption options (WPA2 with AES encryption is the favourite), and make the
    shared key very cryptic so nobody can guess it. If you have a small number of
    devices, why not use your router''s capability (and we bet it


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_141_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_141_1.png)'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'has it) to assign a specific IP address to a specific machine based on the
    hardware address of its network adaptor. That means that if something''s not working,
    you know what its IP address is meant to be, so you can try connectivity tests
    over the network.


    Finally, wireless networks only really work properly through thin air – they don''t
    like walls or doors. If you''re going to have over a dozen Linux machines talking
    wirelessly to the rest of your kit, make sure you go to the trouble of making
    the wireless network reliable, and use extender devices to improve the signal.
    There are two types of extender: the ones that are solely wireless (so they talk
    to your internet router wirelessly and then present themselves as a WiFi network)
    and the ones that use the mains power cabling to get the signal around the premises
    (so they are effectively cabled into the router and then presenting a WiFi network
    of their own). We use both, and performance is ten times better than we get if
    we power down all the extenders and let everything to reach the central router.


    Below: You can use a wireless extender to make sure your signal carries further.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_142_0.png)'
