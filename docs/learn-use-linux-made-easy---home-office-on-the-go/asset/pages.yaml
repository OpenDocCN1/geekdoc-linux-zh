- pgno: 185
  md: '# GETTING CONNECTED


    Computer networking has changed hugely over the years. The strange thing is though,
    that unlike pretty much everything else in the universe, the world of networking
    hasn''t quadrupled in complexity. In fact, it''s actually got simpler.


    Days, the only network protocol the average computer user comes across is IP –
    the Internet Protocol. That wasn''t the case until the late 1990s, before which
    we had an unbelievable range of network protocols. Just to pick a few, we had
    DECNet (from Digital Equipment Corporation), who invented it to let PDP-11 mincomputers
    to talk to each other), AppleTalk (from Apple in the mid-1980s to hook Macs together
    via their built-in LocalTalk ports), IPX (another 1980s vintage protocol, this
    time from Novell and the default in their NetWare operating system)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_185_0.png)'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# GETTING CONNECTED


    and X25 (hugely popular) around the same time for wide area networks.


    The underlying connectivity on top of which all these protocols sat got simpler
    too. As well as the LocalTalk connectivity mechanism built into Macs, we also
    had IBM''s Token Ring, FDDI (a fibre technology, which at 100Mbit/s was considered
    super-fast in its day), ATM (a telecom technology that tried but failed off in
    data networking) and many others. Linux has always support for an enormous range
    of network protocols – just some of them can be seen in the screenshot of the
    kernel configuration application. Nowadays, it''s pretty much Ethernet over the
    board for dubbed connections; we''ll come to wireless shortly.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_186_0.png)


    Above: Some of the range of network protocols can be seen on this kernel configuration
    application.


    # LET''S GET STARTED


    We''re therefore going to work on the premise that we want to connect to an Ethernet
    network using IP. Our test network is pretty much the same as most people have
    at home on their broadband connections: there''s a router that connects to the
    broadband link itself, and this router usually has both a handful of Ethernet
    ports and the ability to talk wireless networking too.


    > Hot Tip Even if you''re not going to use them, check out the list of networking
    options and read up on some of them on the internet. It''s fascinating stuff,
    honest!'
  merge: -1
  img_proc: true
- pgno: 187
  md: IP networks are split into segments called subnets (actually, there are loads
    of other terms as well, but if you talk subnets, everyone will know what you mean).
    These are connected by routers. Note that we mentioned a few sentences ago that
    the average home network has a router connecting to the
  merge: -1
  img_proc: true
- pgno: 188
  md: '# GETTING CONNECTED


    service provider. So if you''re wondering... yes, that home network is merely
    a subnet of the service provider''s network, and your bit of the world is separated
    from theirs by the router. Computers are able to talk directly to other computers
    that sit on the same subnet. So as we''re typing this sentence we have our Linux-based
    laptop, and a rather aged iMac all connected to the same subnet. The Linux laptop
    is connected via the network to a shared directory on the MacBook and the two
    machines are talking directly to each other. We could power off the router and,
    although the internet would be inaccessible, these two machines wouldn''t lose
    touch with each other.


    # WHAT A ROUTER DOES


    When a machine wants to talk to something outside its own subnet, though, it can''t
    make a direct connection. The thing it wants to connect could be anywhere in the
    world, after all. That''s the router''s job – to know how to route traffic so
    it reaches its destination.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_1.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_2.png)


    Above: If we needed to add routes, we could do so in the network control panel'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 188 LINUX AND NETWORKING


    > Hot Tip Get to grips with your router, because it''s key to how your network
    works, and understanding what it does will help you a lot.


    There are two types of route that a router knows about. First, we have specific
    routes: the big routers that sit within the Internet Service Providers'' networks
    have connections to other service providers'' networks, and they have big tables
    of routing information which are basically just lists of IP address ranges that
    say: ''To route address range X, send it out of this link to this neighbouring
    router


    whose address is Y''. Second is the entry at the end of every routing table that''s
    basically a catch-all entry that says: ''If the address we want isn''t in the
    list of specific routes, send it to Z'' This last entry is called the default
    route, and the device with address Z is called the default gateway. (Strictly
    speaking, it''s not a gateway, as that means something else, but that''s what
    everyone calls it, so we''ll stick with it).


    Below: A typical modern wireless router.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_189_0.png)'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# GETTING CONNECTED


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_190_0.png)


    # DOMAIN NAME SERVICE


    # HOW IT USUALLY WORKS


    The Dynamic Host Configuration Protocol, or DHCP, is your best friend. When you
    connect a computer to your home network, you probably don''t need to set any of
    the IP information we''ve mentioned – and that''s your router is a DHCP server.
    When a device starts up, it''ll have DHCP addressing enabled by default. It broadcasts
    across the network to say “Can someone give me an IP address?” and the router
    assigns one from its pool of free addresses. So most of the time, you don''t have
    to do anything.


    > Hot TipnCheck out the ''DHCP Pool'' of your broadband router – it will show
    you the range of addresses it''s been told to choose from and will show you which
    machines have been given which addresses.'
