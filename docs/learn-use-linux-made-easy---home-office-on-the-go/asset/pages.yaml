    it(?). The downside is that unless you have some kind of cache server on your
    network, if you''re doing a number of installations, you''ll end up pulling data
    down from the internet again and again. If you''re on a 50Mit/s internet link
    like ours, that''s fine, but if you have a broadband connection running at a few
    megabytes, it can be painful even for a small install.


    # Live Install


    The installation we did in our example used the Fedora Live install. These are
    very common among distros, and they''re an excellent compromise, because if you''re
    doing a default install without trimming out the bells and whistles, it has all
    the files it needs on the install media. If you recall, when we did our walk-through
    we set the wireless LAN settings before doing the install. Actually we didn''t
    have to do this, as everything it needed was on the USB stick anyway; we merely
    did it because it was a useful thing to do (and when the install was complete
    it wrote the wireless settings to the Linux installation so we were straight on
    the network when we rebooted).


    > Hot Tip Live installs are our favourite – it lets you start a pretty full Linux
    and gives more flexibility than a slimmed-down network install.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_120_0.png)'
