- pgno: 69
  md: "# SHELLS - KEEPING IT IN THE FAMILY\n\nWe've already mentioned, the shell is\
    \ what you type commands into in order to get your Linux machine to do your bidding.\
    \ And with most things in Linux, you have a number of options when it comes to\
    \ which shell to use. Although there were several options, there were originally\
    \ two separate families.\n\n# THE BOURNE SHELL FAMILY\n\nThe Bourne shell – usually\
    \ implemented by an executable program sh – was first developed by Stephen Bourne\
    \ at Bell Labs. Like the other shells one finds in Linux implementations, it predates\
    \ the Linux kernel by many years – it first appeared in the late 1970s as part\
    \ of Bell Labs' Unix implementation. The Bourne shell is known as sh – and this\
    \ is the name of the executable program on a Linux machine.\n\n# THE C SHELL FAMILY\n\
    \nWhile Bell Labs was producing its implementation, the University of California\
    \ in Berkeley was producing its own Unix-like flavour, called the Berkeley Software\
    \ Distribution, or BSD. Graduate student Bill Joy was the core creator, and the\
    \ C shell also appeared in the late 1970s. The C shell is known as – and its executable\
    \ is called – csh.\n\n# THE DERIVATIVES\n\n surprisingly, shells have come a long\
    \ way since the late 1970s – it would be a shock if nothing had changed in 30-odd\
    \ years, after all. There has been a boatload of different derivatives, which\
    \ fall into two camps: direct descendants and hybrids."
  merge: -1
  img_proc: true
