  img_proc: true
- pgno: 29
  md: '# WHY LINUX?


    That''s a concise run-through of the history of Linux. Knowing the background
    doesn''t actually help you to run the operating system, but it does help put in
    context why things are implemented the way they are. What are the main reasons
    for selecting Linux?


    There are many reasons users are turning to the operating system, and we run through
    some of them here. They''re in no particular order; what may be the main reason
    for one person won''t be for another.


    # LACK OF BLOATWARE


    Remember when you got your PC? You probably had to pick your way through an array
    of unwanted programs, certainly if you bought the machine from a large store.
    You would have had an antivirus product, possibly the magazine subscription offering,
    Zinio, and there would have been a package of various games. It is possible to
    remove these programs using Uninstall, but it''s a bit of faff. By opting for
    Linux, you do away with such problems – there''s no danger of being bombarded
    with reminders about trial periods ending, and certainly no pleas to pay for subscriptions
    to any services. With Linux, what you see is what you get.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_30_0.png)


    # ## THE VIRUS PROBLEM


    Most people who have used Windows machines have experienced a virus attack at
    some point (and if you haven''t been affected yourself, you may have well had
    to fix a machine for someone who has been). Viruses are so easy to create and
    can all too easily infect PCs: that link you shouldn''t have clicked on; that
    CD you shouldn''t have inserted; that program you shouldn''t have run – all of
    these can bring their own problems.


    # ### Linux is Virus Free


    And don''t you Apple users get smug and think that your machine is safe from attack:
    Mac gets viruses too. In fact, if you really want to avoid any form of malware
    on your PC, Linux is the only way to go.


    > > Hot Tip

    If you''re constantly battling viruses, malware, or simply a slow computer that
    crashes a lot, Linux might be for you. It is the most stable operating system.


    In theory, it''s feasible for there to be Linux virus but, as detailed earlier,
    there are many more eyes looking over Linux software. Vulnerabilities and weaknesses
    are spotted earlier and flaws are fixed more quickly.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# CYBER CRIMINALS


    Received wisdom is that the more people use an operating system, the more likely
    it is to have viruses. According to this theory, the reason that Windows is so
    vulnerable to attacks is because it’s the most popular operating system – cyber
    criminals want to attack the system with the most users.


    This implies that Linux is being ignored because there are few users, but there''s
    another overriding factor, which is to do with the way that Linux authenticates
    system changes.


    # Online Security


    If you think about what happens with malware sent to a Windows machine, you can
    see why you may need tougher authentication rules. We''ve all heard the warnings
    about viruses and what not to do: don''t open website links from unknown senders;
    don''t load CDs of unknown provenance; keep your antivirus software up to date,
    and so on.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_31_0.png)


    # Linux Password Protection


    When warnings about what not to do are ignored, the virus or the Trojan is able
    to interfere with the underlying operating system and cause all sorts of mayhem.
    It''s not been unknown for a victim to have to install the operating system completely
    from scratch.


    This can''t happen with Linux, as you need an authentication password if you want
    to make a change to the underlying operating system. So, unless you have an especially
    smart virus that can not only muck up the innards of your computer, but also read
    your password, you''re going to be in the clear.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# LACK OF DRIVERS


    If you want to attach any type of hardware to your computer – a printer, a scanner,
    anything along those lines – then you need to run a small program called a driver.
    This is not a problem when you first set up the device, as it will be included
    on the installation disk. The problems will start when you want to use another
    computer and have to start all over again. In many cases, you won''t have the
    installation CD, and even if you do have it, you then have to worry about whether
    you''re using the latest version of the driver. What generally happens is that
    you need to search through a manufacturer''s website and look down a long list
    of drivers. This isn''t always a straightforward task, as you have to have an
    exact match with the product and it''s not always easy to find a list of drivers
    on manufacturer websites.


    This is a miracle that you don''t have to go through Linux, as vast numbers of
    drivers are already included in the Linux kernel. Devices work out of the box,
    first time round.


    Below: Drivers are much easier to handle on Linux machines.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_32_0.png)'
