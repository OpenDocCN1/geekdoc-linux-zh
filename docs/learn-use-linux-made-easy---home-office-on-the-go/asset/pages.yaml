- pgno: 229
  md: '# GENERATING SELF-SIGNED CERTIFICATES AND SSL-PROTECTED WEBSITES


    We''ve given you a start on getting your web server up and running, but there''s
    one more key component that''s essential to commercial websites – secure web connectivity.
    By this, we mean HTTPS – the secure version of HTTP.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_229_0.png)


    For HTTPS to work, we need what''s called a digital certificate. This is an electronic
    ''key'' (which is basically a text file full of heavily encrypted information)
    which does two things: it allows the browser to authenticate the server (that
    is, confirm that the server is who it says it is); and it provides information
    that allows the browser and fro to encrypt data as it''s sent to and fro, in order
    that an intruder can''t simply tap into it and read the data streams.


    # SSL CERTIFICATES


    You''ll find, incidentally, these certificates are often referred to as ''SSL
    certificates''. SSL is the Secure Sockets Layer, one of the standard security
    mechanisms used in networking for donkey''s years. In reality, SSL has been superseded
    by TLS (Transport Layer Security). There are differences, but you can work on
    the premise that whether someone talks about SSL certificates, digital certificates
    or (less often) TLS certificates, they''re basically talking about the same thing.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# GENERATING SELF-SIGNED CERTIFICATES AND SSL-PROTECTED WEBSITES


    # Self-signed Certificates


    Commercial websites have commercial security certificates. The benefit of these
    is that they''re provided by trusted certification authorities (CAs) and so the
    user of the website knows that the website belongs to whom it says it. For our
    purposes, we''re going to stick with what we call a ''self-signed'' certificate:
    this is a certificate that we generate ourselves and which, although lets our
    web server work in true HTTPS fashion, which will cause the browser to show some
    warnings due to it not being from a true CA. This isn''t a problem though – it''s
    most people run their development web servers, not least because commercial certificates
    cost money (and lots of it).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_230_0.png)


    # CREATING THE ENCRYPTION STUFF


    In order to run a secure web server, we need a digital certificate. As we''ve
    said, we''re not going to get one from a CA but will generate our own. We''ll
    do this by making the system generate a secure key, generating a certificate request
    and then creating our own certificate from it. If you were using a CA you''d do
    the first two steps yourself, but then throw the certificate request at the CA
    for them to generate the certificate.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# LINUX AS A SERVER


    Before we start, we''ll ensure that we have the necessary prerequisites. We already
    have Apache HTTPD but we need to ensure that the ''openssl'', ''mod_ssl'' and
    ''crypto-utils'' packages are installed: as we''ve covered it already, we won''t
    go into the detail of how to use ''dnf'' for this.


    # Generating the Key


    First, then, let''s generate the key. In our example we''ll use DES3 encryption
    and we''ll tell it to generate a 2,048-bit key. This is pretty standard these
    days: the more bits you use the more harder it is to process and hence the more
    your server will slow down.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_231_0.png)


    We use the openssl command to generate the key, it prompts for a password, which
    is used to secure the key itself – make sure you use a complex one and keep a
    safe note of it.


    ```

    [root@local]## openssl genrsa -des3 -out linux.key 2048

    Generating RSA private key, 2048 bit long modulus


    ++++++

    .

    .

    ++++++

    e is 65537 (0x10001)


    Enterter pass phrase for linux.key:

    Verifying - Enter pass phrase for linux.key:

    ```'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Create the Certificate Request


    Now we''ll create the certificate request using the openssl command. It asks for
    some information about our organization; ours is invented, but if you''re doing
    this with a CA-provided certificate, you''ll need to be careful to enter correct,
    valid information. Why? Because the CA will demand that you prove who you are
    – so if you''re a company and your registration document doesn''t match what you''ve
    put in the certificate request, they''ll tell you where to go.


    ```

    [root@local]# openssl req -new -key linux.key -out linux.csr

    Enter phrase for linux.key:

    You are about to be asked to enter information that will be incorporated into
    your certificate request.

    What you are about to enter is what is called a Distinguished Name or a DN.

    There are quite a few fields that you can leave some blank

    For some fields there will be a default value,

    If you enter ''.'', the field will be left blank.

    Country Name (2 letter code) [XX]:GB

    State or Province Name (full name) []:Jersey

    Locality Name (eg, city) [Default City]:St Helier

    Organization Name (eg, company) [Default Company Ltd]:Linux Made Easy

    Organizational Unit Name (eg, section) []:

    Common Name (eg, your name or your server''s hostname)

    [:]:www.mylinux.local

    Email Address []:dsc@linuxmadeeasy.com

    ```


    Please enter the following ''extra'' attributes to be sent with your certificate
    request

    A challenge password []:

    An optional company name []:'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# CREATING THE CERTIFICATE


    Now we can create our certificate. Before we do, we have to do a special step
    and take off

    the password from the key file so the certificate generator can work with it:


    ```

    [root@local]# mv linux.key linux.key

    [root@local]# openssl rsa -in linux.key.org -out linux.key

    Enterter pass phrase for linux.key.org:

    writing RSA key

    ```


    And finally, we''ll generate the certificate itself:


    ```

    [root@local]# openssl x509 -req -days 90 -in linux.csr

    signey linux.key -out linux.crt

    Signature ok

    subject=/C=GB/ST=Jersey/L=5t Helier/O=Linux Made

    Easy/CN=www.mylin.local/emailAddress=dsc@linuxmadeasy

    Getting Private key

    [root@fileserver-local html]#

    ```


    Once we''ve done all this, we have

    four files. The basic encryption key

    is ''linux.key''. This was used to

    produce ''linux.csr'', which is the

    certificate request. We then

    tweaked the key and kept

    ''linux.key.org'', which was the

    original, just in case something went

    wrong (we don''t need this any

    more). Finally, we have ''linux.crt'',

    which is the certificate itself.


    > Hot Tip

    If you want to host a secure site,

    Youll need to get a certificate

    assigned by a CA, if you don''t

    people reading your page to get

    browser pop-ups telling them that

    the certificate isn''t authorized.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_234_0.png)


    # # CONFIGURING HTTPD


    Now we''ve got all the bits we need, we can add it to the HTTPD configuration.
    To do this, we need to put the files somewhere sensible and then point the config
    file at them. We''ll create a sub-directory ''ssl'' in the HTTPD config directory
    and copy the key file and the certificate into it:


    ```

    ```

    [root@local]# mkdir /etc/httpd/conf/ssl/

    [root@local]# cp linux.crt /etc/httpd/conf/ssl/linux.crt

    [root@local]# cp linux.key /etc/httpd/conf/ssl/linux.key

    ```

    ```


    Now we need to edit ''httpd.conf'' and tell it that (a) we want to talk using
    the secure HTTP protocol, and (b) where to find its keys. We do this by adding
    a ''virtual host'' entry (in our example, we dropped it just after the ''Listen
    80'' line of the config file:'
  merge: -1
  img_proc: true
- pgno: 235
  md: "```\n# SSL config\n<VirtualHost _default_:443>\n  DocumentRoot /var/www/html\n\
    \  ServerName www.mylinus.local\n  SSLEngine on\n  SSLCertificateFile /etc/httpd/conf/ssl/linux.crt\n\
    \  SSLCertificateKey /etc/httpd/conf/ssl/linux.key\n</VirtualHost>\n```\n\nWhat\
    \ this is basically telling HTTPD is:\n\n+   - The website documents live in /var/www/html\n\
    - The server name is www.mylinus.local\n- We want to turn on the SSL Engine (the\
    \ module that provides secure functionality).\n- The certificate file and key\
    \ file are in the given locations with the specified names.\n\nBecause we've edited\
    \ the configuration file, we need to restart HTTPD for it to see the changes:\n\
    \n```\nroot@local]# systemctl restart httpd\n```\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_235_0.png)"
  merge: -1
  img_proc: true
- pgno: 236
  md: '# DON''T FORGET IPTABLES


    Remember we had to tell IPTables to let connections come into our basic web server?
    Well, guess what ... port 443 is the HTTPS port, so we need to add that to IPTables
    permissions and save it for future reference.


    ```

    [root@local]# iptables

    -I INPUT 1 -p tcp -m state

    -state NEW --dport 443 -j ACCEPT

    [[root@local]# iptables-save

    > /etc/sysconfig/iptables

    ```


    And that''s it. We can now access our server with an HTTPS connection in the browser.
    We expect it to complain that the certificate isn''t one from a CA, of course
    (see right).


    We can check the certificate information by clicking on the appropriate link in
    the browser – in our example, it does indeed show the details we entered a few
    pages back when we created the certificate. Click through the warning and we''re
    in.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_236_0.png)


    Above: The browser will come up with a security warning


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_236_1.png)


    Above: Check that the certificate is correct


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_236_2.png)


    Above: Our page is now SSL protected.'
