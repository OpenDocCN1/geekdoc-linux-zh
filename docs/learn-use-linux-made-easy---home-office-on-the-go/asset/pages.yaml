- pgno: 204
  md: '# TELNET AND PORT CONFIGURATION


    it to the live server in a hosting centre. That''s exactly what we do with the
    web

    services we work with when we''re not writing books on Linux. So let''s look at
    how this works.


    # TCP


    TCP is part of the IP protocol family. It stands for Transmission Control Protocol,
    and it''s used

    by the vast majority of programs that provide some kind of networked service.
    It has a sister

    called UDP, or the User Datagram Protocol, which is a bit more niche, but still
    relevant as it''s

    uused by stuff voice calls and streamed video – and the DNS service we discussed
    earlier, in

    fact (see page 189). We''ll focus mainly on TCP though.


    Below: The ''services'' file lists commonly known TCP ports.


    ```

    services [Read-Only]

    # /etc/services:

    # $id: services,v 1.55 2013/04/14 ovasik Exp $\n# Network services, Internet style

    # IANA services: last updated 2013-04-10


    # Note that it is presently the policy of IANA to assign a single well-known

    # port number for both TCP and UDP; hence, most entries here have two

    # even if the protocol doesn''t support UDP operations.

    # Updated from RFC 1700, "Assigned Numbers" ... (October 1994). Not all ports

    # are listed only the most common ones.

    # The latest IANA port assignments can be gotten from

    # http://www.iana.org/assignments/port-numbers

    # The Well Known Ports are those from 0 through 1023.

    # The Registered Ports are those from 1024 through 49151

    # The Dynamic and/or Private Ports are those from 49152 to 65535

    # Each line describes one service, and is of the form:

    # service-name  port/protocol [aliases ...]  # comment

    tcpmux          1/tcp                   # TCP port service multiplexer

    tcpmux          1/udp                   # TCP port service multiplexer

    rje             5/tcp                   # Remote Job Entry

    rje             5/udp

    echo            7/tcp

    discard         9/tcp                   sink rull

    discard         9/udp                   sink rull

    systat          11/tcp                  users

    systat          11/udp                  users

    ```'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_205_0.png)


    A TCP connection from a client machine to a server machine is not unlike a phone
    call. The client initiates a call (a connection to us) and when the server sees
    the request come in, it answers it. The client and server can then exchange information
    as they see fit, and that when they''re done, either of the parties can close
    the connection.


    > Hot Tip

    Read about TCP and IP – they''re the absolute fundamentals of networking. these
    days, and even an hour or two''s reading up on them will help greatly.


    You probably want the server to be able to accept more than one call at once –
    akin to having several phones that people can call into. you probably want some
    way for it to know what kind of call is coming in so that you can have, the web
    server answering only web requests and the email server answering email connections.
    TCP uses the concept of a port for this.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# TELNET AND PORT CONFIGURATION


    # 205


    # HOW TCP PORTS WORK


    When the client device tries to set up a connection, there are two key components
    to the request. First, and pretty obvious, the IP address of the system it''s
    trying to connect to. Second is the port number it wants to connect to, which
    is a number between 0 and 65,535.


    When a program such as a web server starts up, it ''listens'' for incoming connections
    on the network link. The trick is though, that the software will only listen on
    a specific port or ports. Imagine you have a phone system with 65,536 extensions;
    you have the same number of telephones and you''ve labelled each of them with
    a number from 0 to 65,535. Any of them could ring at any time, but you''ve told
    the web server only to answer extension 80, and the mail server only to answer
    extension 25. That''s precisely what happens with Linux server software.


    # Well-known Ports


    Ports 0 to 1023 are called well-known ports, and have been assigned to code, general
    functions: web and email servers, remote connectivity etc. Some of the common
    ports are:


    +   - 22: SSH, the secure shell mechanism that lets you connect into the Linux
    machine and use a command line to run commands and programs.

    - 25: SMTP, the Simple Mail Transfer Protocol (internet email, basically).

    - 53: DNS, the Domain Name Service.

    - 80: HTTP, the HyperText Transfer Protocol (web servers).

    - 109 and 110: POP, for pulling email down from a server.

    - 443: HTTPS, the high-secure version of HTTP.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_206_0.png)'
  merge: -1
  img_proc: true
