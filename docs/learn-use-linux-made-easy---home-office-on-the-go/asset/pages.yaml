- pgno: 17
  md: '# WHAT IS LINUX?


    So, you want to use Linux. Congratulations, you have selected an operating system
    that will offer so much more than traditional operating systems when it comes
    to security, reliability and interoperability. You have selected an operating
    system that drives many of the servers that power the internet today and that
    provides the basis for many of the current, fast-growing cloud computing market.


    While it may be new to you, Linux is everywhere. It''s the operating system that''s
    at the heart of Android phones, the most popular smartphone technology today.
    It serves as the basis for Google''s Chromebooks. Have you got a TiVo? Guess what
    operating system lies within the TV


    Below: Linux drives the home of the CERN Large Hadron Collider.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_17_0.png)'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# WHAT IS LINUX?


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_18_0.png)


    recording device? Do you use a sat-nav to get around? TomTom is a Linux product
    too. And if you wonder what technology lies at the centre of the CERN Large Hadron
    Collider, wonder no more: it''s Linux.


    # BUSINESS TURNS TO LINUX


    But it''s not just in the hidden manifestations: it''s a technology that''s very
    much in demand within the IT workforce. According to the latest report from The
    Linux Foundation, nearly 97 per cent of organizations are currently looking to
    hire professionals with Linux skills, with salaries sky-rocketing accordingly.


    That''s the way that business is going: this situation is a reflection of how
    many organizations are running Linux-based servers. It''s a technology that is
    fast-growing and is set to catch up with existing Microsoft-based servers -- hence
    the demand for the professionals to run them.


    Linux Around the World

    ''ve already seen some large-scale Linux deployments across the world. Both the
    New York and London stock exchanges use Linux for their trading platforms. It''s
    an operating system used within banks, schools and local authorities across the
    globe.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_18_1.png)


    Right: Linux is used in many vital businesses across the world, including the
    New York Stock Exchange.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_19_0.png)


    # A UNIQUE ALTERNATIVE


    But while the business world is increasingly turning to Linux, the desktop market
    is different. Those very same enterprises are still running desktops on Windows
    (not forgetting the increasing use of smartphones and tablets within the business
    world) and Linux won''t be getting much of a look-in.


    It''s futile to pretend that you''re buying into an operating system that is wildly
    popular. Linux, in all its manifestations, has less than three percent of the
    desktop market – nothing enough to make serious waves. But, as all its supporters
    will tell you, what you are choosing is an operating system that is richer, more
    flexible, more secure and more efficient than its Microsoft and Apple counterparts.
    And, of course, being free is another big bonus.'
  merge: -1
  img_proc: true
