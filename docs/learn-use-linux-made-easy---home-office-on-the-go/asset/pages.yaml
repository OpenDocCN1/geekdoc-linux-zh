    operating system, and it''s easy to forget that it''s actually based on the Linux
    kernel. Of course, Android isn''t a Linux distro in the sense discussed earlier;
    it''s a fairly tight set of components designed for a specific purpose. A standard
    Linux distribution comes with a set of developer tools onboard to write apps for
    Android you run a developer tool on a separate PC. Nonetheless, don''t forget
    that Android is actually Linux under the hood.


    # SO WHICH DO I GO FOR?


    There''s no right answer, but the guidance is pretty simple: if you have a specific
    requirement that''s met by one of the commercial offerings (Oracle apps, for example),
    then veer towards that offering. If you''re looking for a hybrid of commercially
    supported and DIY, then the Ubuntu model is probably for you. If you want to take
    advantage of support for non-Intel processors, then you have a Google for the
