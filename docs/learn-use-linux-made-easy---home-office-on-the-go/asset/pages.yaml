    # EXTRAS INCLUDED


    At this point, it’s important to remember that a Linux distro – commercial or
    otherwise – comprises not only the kernel and core Linux executables but also
    the fleet of included apps. The commercial vendors have their own repositories
    of applications, from which their paid-for Linux offerings download updates to
    the (often complicated) suites of applications that form part of the distro. So
    you’ll generally find that new versions of applications – particularly complex
    ones – come out more frequently in the free Linux distros than they do in the
    commercial ones, as the commercial providers prefer fewer releases with more testing
    per.


    > Hot Tip

    Decide whether you want a distro that always has new versions or one that sticks
    with older, more stable ones.

    It’s a home machine, we go for the ones that use new stuff.


    # SUSE


    SUSE (originally SuSE) is an abbreviation of Software und System-Entwicklung,
    or ‘Software and System Development’ when translated from German. The SUSE distribution
    has been regarded by many as what you would expect German design – solid and stable
    without shouting about itself. Having established itself as a standalone entity
    in the Linux market, the company was acquired by Novell in 2003–4 and, through
    other mergers and acquisitions, is now a part of Micro Focus group.


    SUSE has made a big deal of its industry partnerships over the years, and it still
    trumpets its ‘special’ relationships with Microsoft, SAP and VMware. If you’re
    an enterprise using SAP, then'
