- pgno: 161
  md: '# BE SENSIBLE WITH OUTBOUND CONNECTIONS


    We''ve mentioned already that you can''t seriously break Linux if you''re a normal
    user without super-user root privileges. We did also mention though, that you
    can be a nuisance to others even if you''re a normally privileged user. Say you''re
    using one of the many free GUI-based email programs to read your mail on your
    Linux desktop. What would happen then if someone emailed you an attachment that
    was actually a script containing commands, which would send a bazillion emails
    to various addresses? Would you


    # Hot Tip


    > Linux is inherently secure, but if you do something daft such as running a script
    that someone has emailed to you, you''re asking for trouble.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_161_0.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'double-click it? Even if you just answered ''no'', not everyone thinks the
    same. After all, we''ve seen all people who have double-clicked dodgy attachments
    on their Windows email program and infected their machine with a virus of some
    kind.


    Be sensible, then. Just as you would with any other platform, think before you
    click, because although there aren''t many Linux viruses, that doesn''t mean there
    aren''t any at all.


    # KEEP YOUR APPLICATIONS UPDATED


    Finally, just as you would with any other platform, make sure you regularly update
    your applications and other Linux components. We''ve mentioned that you shouldn''t
    run a blanket update at every opportunity, as it runs the risk of breaking something,
    but similarly, you do need to ensure that everything is running at a reasonably
    recent version.


    The reason is simple: many Linux rely on vulnerabilities (that is, bugs with security
    implications) in the applications and other modules that run on the platform.
    If you ensure you update things frequently, you can minimize the chance of someone
    exploiting an old, buggy version of something on your machine.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# CONNECTING SAFELY


    When Unix computers first became popular, it was common to use console terminals
    that connected directly to a serial (RS-232) port in the back of the system.


    This was a nice, secure way to connect, because you had the physical security
    of the building and the room in which the terminals resided to control who could
    get at them. You also had the concept of a console, which was a special terminal
    (known as a ''secure'' terminal). You could only log in as root on the console,
    and on standard terminals, you had to log in as a normally privileged user and
    then become the root user.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_163_0.png)


    # LOCAL AREA NETWORKS


    This approach was very expensive: you needed multi-port serial adaptors in the
    back of the Unix machine and a serial cable running to each location where there
    was a terminal. It was inconvenient too: you could only connect from wherever
    there was a terminal. So the alternative - connecting over a Local Area Network
    (LAN) - became attractive.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# TELNET


    Telnet is the protocol that allowed many dozens of users to connect into a single
    Unix host via a LAN – generally, though not necessarily, Ethernet. A simple program
    on a client PC or Mac could very easily connect to the Unix machine and run a
    command line shell session in just the same way as a terminal did (and in fact,
    it was generally faster, while serial terminals were restricted to 2,400 or 9,600
    bits per second, while the LAN ran at 10Mbit/s or more.


    The problem with Telnet is that (a) it runs over a network connection that is
    shared with loads of other people and computers, and (b) everything you type or
    receive is transmitted in plain text – even your password and other confidential
    information. It’s not a difficult job to put a ‘sniffer’ on a network segment
    and watch the traffic as it flies past. So encryption is the order of the day.


    > ### Hot Tip

    Never, ever use the Telnet server application. SSH is more secure and is absolutely
    standard these days, so there''s no need even to consider its plain-text ancestor.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# SSH


    SSH is the Secure SHell (one of the many abbreviations with dodgy capitalization).
    The idea is simple: when the client computer connects to the server''s SSH service,
    the two endpoints negotiate with each other to set up an encrypted communication
    channel, and once this has been established, the whole end-to-end process looks
    to the user just like a Telnet connection. The difference, however, is that anyone
    watching the traffic flying past by ''sniffing'' the network will be disappointed,
    as all they''ll see a bunch of incomprehensible garbage that cannot easily be
    decoded by anyone other than one of the two points legitimately involved in the
    interaction.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_165_0.png)


    # Careful of Complacency


    When we say ''cannot easily be decoded'', that''s not to say SSH is entirely unbreakable.
    Time marches on and computers get more powerful, but in the general task of breaking
    an SSH stream''s encoding is *Intractable*, which means it would take too long
    and take too much resource to warrant the effort.


    Note also that while you generally authenticated on a traditional Telnet connection
    using a simple username/password exchange, these days you have various other tools
    at your disposal. Although you can still use a username/password combination,
    you also have the option of lodging digital certificates on the client and server.
    The benefit here is that from the first month


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_165_1.png)'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'of connection, the two endpoints know the encryption mechanism and the key
    to use, and the credentials provided by a certificate are way more complex than
    a password. You''ve also got the option of using a one-time code or other two-factor
    authentication mechanism.


    # PUBLIC KEY ENCRYPTION IS BONKERS


    While we''re on the subject, we''ll mention Public Key Encryption (PKE) – a technique
    that''s used by SSH as well as other similar concepts like the secure web protocol.
    When you use a digital certificate to encrypt or ''sign'' a chunk of data, it
    has two ''keys'' – a public one and a private one – which are mathematically related.
    When you set up a certificate, you keep the private key secret (again, the clues
    are there) and then you advertise to the world what the public key is. The cool
    thing with PKE is that if you encode something with someone''s public key, they
    can very easily decode it with their private key, but the nature of the algorithm
    (the actual function used to do the encryption) is very hard to do in reverse.
    For this reason, it''s often called a ''trapdoor algorithm'' – it''s very easy
    to go one way (encryption), but you''ll struggle to go the other (decryption).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_166_0.png)'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/c00dda504be4d70c6e7dd488ae0af42a_167_0.png)


    We''re not about to describe how to do a PKE algorithm here, as it''s more suited
    to an entire chapter than a small paragraph. It''s also a completely bonkers idea,
    particularly because when you read about it (check out the RSA algorithm, the
    first mainstream PKE mechanism), you’ll find yourselffindfind yourself thinking:
    ''How on earth did they think of that?''


    > ### Hot Tip

    Read up on PKE. There''s loads of material on the internet and although it can
    be heavy going, it''s great when you''ve had the lightbulb moment and you feel
    you have a basic understanding.


    The main thing to remember about PKE is that as computers get faster, you need
    longer and longer keys in order to make it as hard as possible for someone to
    decrypt your transmissions. The longer the key, the more processor overhead you
    use to do the actual encryption.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# SSH IS THE PATH TO OTHER FUNKY STUFF


    You may have to enable the SSHD application before some other programs will work,
    because they rely on an SSH channel being available before they can do their work.


    The final thing to know about SSH is that it’s not just a replacement for Telnet
    - it’s usable for far more than text-based command-line sessions to remote computers.
    The IT world has a tendency to reuse technology instead of reinventing the wheel,
    and so you find other concepts piggy-backing on SSH.


    The File Transfer Protocol (FTP), for instance, this is another age-old internet
    standard and in its basic form, it sends data in unencrypted streams. It wasn’t
    much of a leap of logic to say: ‘Hang about, let’s fire up an SSH connection and
    then do our FTP transfers through that.’ Make perfect sense to let the SSH software
    do the hard work of encryption and then simply throw the FTP traffic through the
    secure ‘tunnel’. FTP is not alone – developers around the world use SSH as the
    underlying security layer for their proprietary protocols, because it’s a dead
    easy way of achieving highly secure communication with no effort.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_168_0.png)'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# LINUX FIREWALLS


    So far, we''ve talked a lot about Linux''s inherent security in the sense that
    it doesn''t listen for inbound network connections unless you tell it to, and
    that you can''t break the core components unless you''re the root user. But what
    about its firewall capability? Linux can not just to refuse traffic because something
    happens not to be listening for it, but detect inbound traffic and actively decide
    whether it should be allowed in.


    # IPTABLES


    We''ve mentioned IPTables, which is the most common Linux firewall package, because
    we''ve had to tweak its rules in order to make things work in our examples. If
    you think of the components of your Linux machine like an onion, you have the
    kernel at the core, with the applications in the


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_169_0.png)'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'next layer and IPTables in the layer on top of that. If a connection doesn''t
    get through IPTables, it''s never going to reach the application, whether the
    latter is sitting listening or not.


    # PACKET FILTERING


    The core functionality of IPTables is what''s called packet filtering. The idea
    is simple: it analyses every packet (a ''packet'' is the basic unit of data on
    a network) and decides what to do with it based on what it sees. Decisions can
    be made based on the various aspects of the packet content – for instance:


    +   - If we''ve detected an unknown device on our network with a particular Ethernet
    adaptor address (perhaps one of our machines is alerting us that there''s a machine
    with Ethernet address spraying our network with junk), we could tell IPTables
    to drop packets to and from that device.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# IPTABLES RULE CATEGORIES


    When you''re configuring IPTables to secure the machine it sits on, there are
    two categories of rule (they''re called ''chains'' in IPTables parlance) we''re
    particularly interested in.


    # One-way Traffic


    First, we have the input chain, and as you might guess, this chain is all about
    traffic that comes into our machine from anywhere else. You''ve seen that the
    various examples scattered around this book have the input chain mentioned in
    the commands we''ve executed – it''s all about connections that originate elsewhere
    and land on us.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_171_0.png)'
  merge: -1
  img_proc: true
