  md: '# SETTING WIRELESS


    You''ll generally have three options for authentication:

    WEP, WPA (WiFi Protected Access) and WPA2, WPA2 is

    the newest and, surprisingly, the most secure.


    > Hot Tip

    WPA2 with AES

    encryption is the way

    go go if your router

    supports it.


    Similarly, there are two common options for encrypting

    the data: TKIP (Temporal Key Integrity Protocol) and

    AES (Advanced Encryption Standard). AES is considered

    the more secure.


    Before you start connecting your Linux workstation to the network, then, check
    out the

