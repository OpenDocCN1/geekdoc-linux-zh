    You don''t often get dodgty files if you''re using the official website, but you
    should always check, just in case.


    # BACKING UP YOUR COMPUTER


    You''ve gone to all the effort of getting your computer up and running on Linux,
    and so you ought really to back up your data once you''ve done so. With some platforms,
    you can do cunning things like syncing the local computer disk with a remote storage
    area in the Cloud (we back up our Mac via an automated sync with Google Drive,
    for instance) but as we''ll see in a short while, this isn''t necessarily an option
    for Linux.


    What you can do, is use the ''Backup-Manager'' tool to hive important files off
    to a remote file store – either a USB-connected disk or, more likely, a shared
    folder on another machine that the Linux computer can mount over the network.


    # Installing Backup-Manager


    Installing Backup-Manager is a simple DNF command as usual:


    ```

    [root@localhost desktop-integration]# dnf install backup-manager

    ```


    The precise configuration depends on what you want to back up – as usual, check
    out the man page. This has a pointer to the author''s website where you can find
    more detailed documentation.


    The main question to ask is what to back up. Given that all (or at least) of your
    applications have been installed using the package manager, there''s not really
    a lot of point backing up the individual files that make up the application installs.
    The main motivation for wanting to back up the


    > ### Hot Tip

    Backups are essential: most of us have been bitten by our PC crashing and have
    lost something we''d liked to keep hold of.'
  merge: -1
