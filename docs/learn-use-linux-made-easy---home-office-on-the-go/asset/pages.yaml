    # RAID DATA DISK


    We''ve discussed the concept of backups (see page 107), and as you''ll know if
    you''ve read that it''s often simpler to reinstall the operating system than to
    try to fix weird problems with it. Hence we''ve said that the main thing to concentrate
    on backing up your data, as you can''t reinstall that from a standard image. Why
    not RAID?


    What RAID offers, as we''ve said, is the ability for a disk to work without being
    interrupted. You, however, need to be a bit cautious when you pick your RAID adaptor,
    because you need to know when a disk has gone ''pop''. We''re not going to suggest
    specific controller cards, because the choice varies with budget and there''s
    every chance that some of them will have been superseded by you typing this and
    you reading it. The trick is to find some candidate devices, then study the spec
    sheets carefully (and ask Google) to verify that there''s a Linux version of the
    management utility or standard Linux commands such as smartctl can interrogate
    it. The usual guidance is to stick with mainstream vendors like Adapec or LSI,
    as support is generally better for the better-known vendors.'
