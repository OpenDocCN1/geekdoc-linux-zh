- pgno: 109
  md: '# 108 GETTING STARTED


    computer is to recover the data in the event that the machine becomes completely
    unusable – if the disk becomes corrupted, for example. The most sensible way to
    work is often to decide that in the event of a complete crash, it''s probably
    easier to reinstall Linux from scratch (we can do it in less than an hour, and
    so you can now have the tutorial). So you''ll concentrate the Backup-Manager configuration
    on your data files and perhaps some of the configuration files for key applications.


    # SOME STUFF STILL ISN''T POSSIBLE


    In Linux''s early days, it was common to find that it lagged behind other platforms
    – primarily Windows – when it came to applications being available to run on and
    for drivers to be available for new pieces of computer hardware. Over the years,
    this has become less and less the case – Linux is now such a mainstream operating
    system that equipment vendors consider it a normal part of their development task
    when they release new hardware.


    **Below:** Google Drive can be very useful for accessing your files wherever you
    are.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'However, this doesn''t mean that it''s universally accepted and supported by
    all the vendors out there. So for example, because we''ve just been looking at
    how to back up your machine, I was looking for alternatives for accessing Cloud-based
    storage on the Linux platform. Now, while the likes of Dropbox has a Linux version,
    the same can''t be said for, say, Google Drive – which came as a surprise to us.
    Similarly, Citrix ShareFile and, perhaps less surprisingly, Apple''s iCloud.


    # Google Drive


    You can still use Cloud storage systems that don''t have a Linux version. Let''s
    take Google Drive as an example. On Windows and Mac you can automatically sync
    files between your local disk and the remote copy, as there''s a desktop application
    for each of these platforms. On Linux you can''t do that. What you can do, however,
    is use the service via the web browser. Although files don''t automatically sync,
    you can at least download them easily to the local disk to work on them, then
    re-upload them by simply dragging them to the web browser windows.


    # SOME STUFF ISN''T PACKAGED


    We''ve mentioned previously that some software isn''t packaged and you ought to
    try to avoid it. Sometimes, though, it''s so useful that you want to make the
    effort.


    Happily, unpacked software isn''t always an utter nightmare to install. If you''re
    downloading the source code and compiling it yourself, this can be fraught with
    incomprehensible error messages and complaints from the compiler that one or more
    required components are missing so it can''t continue. But in other cases, you
    find that the software provider has done lot of the work for you. For instance,
    if you want to use the OpenOffice application suite, you download a bundle of
    package files from the producer''s website and follow a relatively straightforward
    ''read me'' instruction file to install the components.


    > Hot Tip

    Be prepared to fiddle and to Google: the ''how to'' documentation is usually good
    with unpackaged programs, but on your particular system, you may get error messages
    they don''t cover.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# COMPATIBILITY


    Having discussed a moment the fact that some applications simply aren''t available
    for Linux yet, it''s worth considering how compatible your Linux machine is (or
    isn''t) when it comes to making it work with other computers you own, or perhaps
    use at work.


    # Application Compatibility


    Some applications just don''t exist for Linux. Microsoft Office, for example;
    there''s a Mac version and a Windows version, but no Linux flavour. In such cases,
    you need to rely on the ability of the applications you do have to open files
    using formats that are compatible with the other platforms you use. LibreOffice
    (the popular office suite for Linux) is able to open documents in Microsoft Office
    formats, though there''s no guarantee that the formatting of, say, a Word 2013
    document will be preserved absolutely correctly when you open it in LibreOffice.


    > who want to be able to deal with non-Linux documents, but compatibility isn''t
    always 100%.


    Below: Accessing your Mac files on your Linux computer is easy to do.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_111_0.png)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Network Interaction


    Consider the ability to interact with other operating systems over the network,
    and in fact, this tends to be very simple because pretty much anything you owns
    is likely to be able to communicate using Windows'' basic file-sharing protocols.
    So for instance, it was very indeed to turn on file sharing on our Mac and navigate
    to it on the Linux computer.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_112_0.png)


    # Corporate Directory Service


    Next is the more advanced functionality that you may have to use if looking to
    use Linux on a corporate network. The main requirement in this context is for
    Linux users to be able to authenticate against the corporate directory service
    – which nine out of ten will be Microsoft Active Directory. The good news is that
    although traditionally quite tricky, this is perfectly feasible today; the bad
    news is that it''s well out of the scope of someone''s just getting to grips with
    Linux, as there are lots of very cryptic-looking commands you need to run.


    # THE GUI IS YOUR FRIEND


    You may have noticed that the illustrations we''ve used in this book fall into
    two categories. First are traditional screenshots, which show the graphical interface
    of modern Linux systems. Second, we have the text-based command snippets we''ve
    used to show the commands that you can use regardless of whether you''re running
    a graphical interface on your machine.


    In the early days of Linux, with very limited memory and processing power, graphical
    user interfaces were not commonplace and were generally very tricky to get running.
    The same can''t be said today, though, and so the normal way to use Linux – on
    a desktop computer anyway – is to use one of the desktop environments.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# GETTING STARTED


    So make the most of it. Yes, you can use the command line to, say, install software,
    or equally, there will be a graphical package manager on whatever Linux distro
    you''ve chosen. We used one to install the Dropbox client when we were researching
    the previous section, for instance.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_113_0.png)


    Left: Here, the Dropbox client is installing using the graphical package manager.


    # IT CAN BE QUITE SECURE OUT OF THE BOX


    The final thing to bear in mind is that Linux is regarded as a very secure, solid
    operating system. If you''re installing it from scratch, the chances are that
    your computer works fine when you''re using the keyboard and screen, but that
    you can''t connect to it from anywhere else.


    Let''s take an example. One of the fundamental features of Unix-like operating
    systems is the ability to connect from another computer and type commands at a
    shell window. But if we try to connect using the secure shell or ssh command to
    our test machine (in this case from a Mac), we''re blocked:


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_113_1.png)


    ```

    DCPro:~ ssh dsc@192.168.1.186

    ssh: connect to host 192.168.1.186 port 22: Connection refused

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'This is because, by default, Linux has its doors shut – we can''t make connections
    until we''ve turned on the service that accepts them:


    ```

    [root@localhost ~]# systemctl start sshd

    ```


    Now we can try again to connect from the Mac:


    ```

    DCPro:~ davidcartwright$ ssh dsc@192.168.1.186

    The authenticity of host ''192.168.1.186 (192.168.1.186)'' can''t be established.

    RSA key fingerprint is

    77:72:78:b0:5b:f7:d1:02:ce:cd:44:a5:92:7e:ed.

    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''192.168.1.186'' (RSA) to the list of known hosts.

    dsc@192.168.1.186''s password:

    Last login: Sat Aug 1 22:24:59 2015

    ```


    Success! Instead of throwing out the connection, we''re asked whether we want
    to accept the security key, then after providing the right password, we''re allowed
    in.


    # Additional Security


    You may find that your chosen Linux comes with additional security items enabled
    that prevent remote access even when youve turned on the connectivity features,
    for example the IPTables firewall system. So if you can''t get in even though
    you''ve ticked all the right boxes in the configuration, check that it doesn''t
    have an unknown firewall running.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_114_0.png)'
  merge: -1
