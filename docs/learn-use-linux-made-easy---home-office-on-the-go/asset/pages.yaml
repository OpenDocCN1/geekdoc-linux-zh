    # The Advantages of Open Source


    Being free is not their only advantage (although that''s not to be shrugged aside);
    it''s the way that bugs are handled that''s the real plus. Over the years, there
    have been plenty of bugs in Microsoft programs. It used to be an article of faith
    to wait for the second version as the company used to see its first efforts as
    a trial. Fixing these bugs takes time. That''s not because Microsoft developers
    are less skilled but because the bureaucracy in a large company can slow everything
    down considerably.


    That''s not the case with open source products like Linux. As the name implies,
    everything is out in the open, with nothing hidden. That means that anyone can
    change the source code. In practice, this means little, because only skilled developers
    will be able to glean anything


