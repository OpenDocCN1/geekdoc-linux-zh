  - '[PAGE 151]


    # REPLACING DISKS


    Most RAID adaptors allow you to use different disks yet still run a RAID 1 setup.
    Now, you wouldn''t do this for fun – if you''re building a new PC, then you''ll
    buy a RAID adaptor and two identical disks, of course. But if one of the disks
    fails, there''s every chance you won''t be able to purchase an identical model
    – disks become obsolete and new models appear in their place all the time. Generally
    though, as long as you replace it with one that''s (a) as fast as the broken one
    and (b) at least as big as the failed unit, the adaptor will generally be able
    to cope. Of course, you won''t be able to use the whole space of the disk, but
    that''s the price you pay for resilience.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_151_0.png)'
  - '[PAGE 152]


    # JUST BECAUSE IT KEEPS GOING


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_152_0.png)


    Cheap RAID adaptors generally need you to shut down the machine to swap out the
    failed unit – which isn''t a big deal, since you can at least choose a low-usage
    time to do it.


    One final note on the subject of RAID adaptors: just because they can survive
    the death of an attached disk, this doesn''t mean you can replace that disk without
    shutting down the server. The expensive RAID controllers in corporate servers
    have ''hot swap'' capability, where you leave the server


    running while you pull out the failed device and push in a new one. The inexpensive
    devices for small servers and desktops not not hot-swap features, so you''ll often
    find that in order to swap the disks, you have to power down the box and change
    the components. Of course, you at least have the freedom to choose a time when
    the system''s not being used to power it down, and if you''re handy with a screwdriver,
    it shouldn''t take more than 15–20 minutes to swap out a disk before powering
    up again.


    # HOW DOES IT REBUILD?


    When you replace a failed disk, the controller takes on the task of duplicating
    the data from the working one to the blank replacement. This is an automatic process,
    but it''s often not a fast one – it can take a few hours before the two are in
    syn and the system is fully resilient again. If you''ve been diligent and chosen
    your adaptor wisely, you''ll be able to check the status of the disk and see when
    it''s back to a resilient state.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_152_1.png)'
