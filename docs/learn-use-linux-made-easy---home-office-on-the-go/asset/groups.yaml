    There are two types of route that a router knows about. First, we have specific
    routes: the big routers that sit within the Internet Service Providers'' networks
    have connections to other service providers'' networks, and they have big tables
    of routing information which are basically just lists of IP address ranges that
    say: ''To route address range X, send it out of this link to this neighbouring
    router


    whose address is Y''. Second is the entry at the end of every routing table that''s
    basically a catch-all entry that says: ''If the address we want isn''t in the
    list of specific routes, send it to Z'' This last entry is called the default
    route, and the device with address Z is called the default gateway. (Strictly
    speaking, it''s not a gateway, as that means something else, but that''s what
    everyone calls it, so we''ll stick with it).


