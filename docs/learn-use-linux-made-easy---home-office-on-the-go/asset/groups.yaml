  - '[PAGE 24]


    The roots of the operating system lie in the free software movement of the 1980s.
    One of the leading lights of this was a programmer called Richard Stallman who,
    in 1984, set up the GNU Project, which in turn led to the Free Software Foundation
    the following year. In this case, ''free'' is free as in politics, not free as
    in beer (to use the usual analogy).


    # PRINCIPLES OF FREEDOM


    The idea behind this freedom was to give computers more power to share information,
    a collaboration that would lead to improved performance. Under this concept of
    freedom, users had the power to study the underlying code, poke around with it
    as they wished and modify it accordingly. One of the important aspects of this
    development was a new type of software licence – the GNU General Public Licence
    (GPL), which instead of the usual copyright restrictions, operated under ''copleft''
    guidelines.


    # The General Public Licence


    This type of licence, developed by Stallman, not only ensures that software is
    free to be modified, but that these rights are retained even after modification.
    In other words, this means that an individual or organization cannot take free
    software, modify it and use that modification for proprietary purposes – once
    free, always free.


    The GNU Project was all developing a completely new type of operating system,
    one that operated under these free principles. It was into this world that Linux
    was born: it was developed using GNU tools and released under the terms of the
    GPL.


