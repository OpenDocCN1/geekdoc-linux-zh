    # LINUX 与安全


    158


    # DMZ 主机


    现在，存在一种微小的可能性，你可能实际上想允许来自互联网的某些入站连接。例如，你可能在车库里运行了一个小型 Web 服务器。大多数家庭路由器都允许你允许某些基础连接
    - 通常通过让你设置一台 DMZ（非军事化区）计算机。这听起来有点奇怪，但基本上是告诉路由器：“如果你收到任何你已知的入站连接，将它们传递到你的内部地址”，其中内部地址是你的
    Linux 机器的 IP 地址。下面是一个 Tilgin 家庭路由器的示例。我们将 Linux 机器的 IP 地址放在“DMZ host IP address”框中。如果你考虑这样做，你可能需要在稍后阅读防火墙部分（参见第
    168–73 页）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_159_0.png)


    上方：Tilgin 家庭路由器的页面，你可以在此处设置 DMZ主机 IP 地址。


    # 小贴士


    不要使用 DMZ 主机允许入站连接，除非你完全对其含义满意 - 并且你已经关闭了所有非本质服务并加固了防火墙。


    # 默认关闭


    正如我们在讨论远程连接和运行 Web 服务器等问题时看到的，Linux 机器上的网络服务默认是关闭的。为了让它监听任何网络连接，我们通常必须先开启相应的服务，否则传入的连接将简单地忽略。始终采用这种方法
    - 如果不需要某个项在网络上监听，就将其关闭。


    对于你可以通过用户界面控制的应用程序，确保你不仅停止了该程序，还禁用了它在重启机器时复活。在 Fedora 上，这意味着使用 `systemctl stop`
    关闭它，并使用 `systemctl disable` 防止在重启时重新启动。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_160_0.png)


    如果你真的想确保某些事情的安全，如果你不需要某个可以接受网络连接的应用程序，那么你应该卸载它而不是简单地关闭它。包管理器卸载东西就像帮助你安装它们一样容易。


    上方：共享控制面板，显示默认关闭的服务。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_160_1.png)


    上方：在 Fedora 上，你可以使用 `systemctl stop` 和 `systemctl disable`：或者，你可以卸载该应用程序。


    # 理智地处理出站连接


    我们已经提到过，如果你是一个没有超级用户 root 权限的普通用户，你无法严重破坏 Linux。但我们也提到，即使你是一个普通特权用户，你也可能给他人带来麻烦。假设你正在使用许多基于
    GUI 的免费电子邮件程序之一在你的 Linux 桌面面上读邮件。如果有人给你发了一个附件，而该附件实际上是一个包含命令的脚本，该脚本会向各种地址发送数百万封邮件，那时会发生什么？你难道


    > ### 小贴士

    Linux 本身是安全的，但如果你做了某些愚蠢的事，比如运行别人发给你的脚本，你那就是在自找麻烦。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_161_0.png)


    双击它吗？即使你只是回答了“不”，但并不是所有人都想得一样。毕竟，我们见过所有在 Windows 邮件程序中双击可疑附件并导致其机器感染某种病毒的人。


    那么，请保持理智。就像你处理任何其他平台一样，在点击之前思考，因为虽然没有多少 Linux 病毒，但并不意味着完全没有。


    # 保持应用程序更新


    最后，就像你处理任何其他平台一样，确保定期更新你的应用程序和其他 Linux 组件。我们提到过，你不应该在每个机会都进行全面更新，因为这样有破坏某些东西的风险，但同样，你需要确保一切都运行在相当较新的版本上。


    原因很简单：许多 Linux 依赖运行在平台上的应用程序和其他模块的漏洞（即具有安全影响的错误）。如果你确保频繁更新内容，就可以尽可能地减少别人利用你机器上旧的、有漏洞版本的概率。


    ![]((img/c00dda504be4d70c6e7dd488ae0af42a_162_0.png)


    163


    # 安全连接


    当计算机最初流行时，使用控制台是很常见的。这种方法非常昂贵：你需要多端口串口适配器。这个想法很简单：当客户端计算机连接到服务器的服务时，两个端点相互协商以建立一个加密通道，一旦建立，整个端到端过程对用户来说就像终端连接一样。然而，区别在于，任何通过“嗅探”网络观察飞而过的流量的人都会失望，因为他们看到的只是一堆无法理解的垃圾信息，除了参与交互的两个点之外，任何人都无法轻易解码。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_163_0.png)


    # 局域网


    因此，替代方案 - 通过局域网（LAN）连接变得具有吸引力。


    # TELNET


    Telnet 是允许数十个用户通过网络连接到单个主机的协议。Telnet 的问题在于 (a) 它运行在与他人共享的连接上，以及 (b) 你输入或接收的所有内容都以明文传输。在网络上放置“嗅探器”并观察飞过的流量并不是一项困难的工作。因此加密是常态。


    > ### 小贴士

    永远、永远不要 Telnet 程序。SSH 更安全，且现在是绝对的标准，因此无需考虑它的明文祖先。


    # SSH


    SSH 是 Secure Shell（许多缩写大小写不规范的缩写之一）。这个想法很简单：当客户端连接到服务器的服务时，两个端点相互协商以建立一个加密通道，一旦建立，整个端到端过程对用户来说就像
