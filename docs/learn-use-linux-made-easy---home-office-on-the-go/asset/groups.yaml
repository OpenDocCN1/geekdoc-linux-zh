    \n## 使用 APACHE WEB 服务器 227\n\n生成密钥。\n\n```\n[root@local]# openssl genrsa -out\
    \ linux.key 2048\nGenerating RSA private key\n++++++\nRSA private key, 2048 bits\n\
    ```\n\n## 创建证书请求\n\n现在我们将创建证书请求。在此之前，我们必须执行一个特殊步骤，移除密钥文件的密码，以便证书生成器可以使用它：\n\n\
    ```\n[root@local]# mv linux.key linux.key.org\n[root@local]# openssl rsa -in linux.key.org\
    \ -out linux.key\nEnter passphrase for linux.key.org:\nwriting RSA key\n```\n\n\
    ## 创建证书请求\n\n我们将使用 openssl 命令创建证书请求。\n\n```\n[root@local]# openssl req -new -key\
    \ linux.key -out linux.csr\nEnter passphrase for linux.key:\n```\n\n## 生成证书\n\n\
    最后，我们将生成证书本身。\n\n```\n[root@local]# openssl x509 -req -days 90 -in linux.csr -signey\
    \ linux.key -out linux.crt\nSignature ok\nsubject=/C=GB/ST=Jersey/L=St Helier/O=Linux\
    \ Made Easy/CN=www.mylin.local/emailAddress=dsc@linuxmadeasy\n```\n\n"
