    # Linux Super User


    The above well-known ports are special in that if you''re running a Unix or Linux
    machine you have to be the root super user to run a program that listens on one
    of them. This is useful if you have a multi-purpose server, because a normal user
    can''t randomly run up their own mail or web server on a well-known port and break
    something.


    # Other Ports


    Just a quick note before we carry on: there''s nothing to stop you running a server
    program on a port other than its standard well-known port. These are, however,
    the default ports that client software will use. So for example, if we enter this
    URL in our web browser:


    www.mysupplier.com


    # TELNET AND PORT CONFIGURATION


    ... the browser will use the DNS to look up the IP address of the machine called
    www.mysupplier and will attempt to connect to it on port 80, because it knows
    that''s the usual port for a web server. If the web server''s running on a different
    port, you have access to it in a different way. It''s common, for example, to
    have a test version on the same server on a different port such as 8080, in which
    case, the user would have to specify the port in the URL:


    ```

    www.mysupplier.com:8080

    ```


    # Registered Ports


    Ports 1,024 to 49,151 are called registered ports. These have been registered
    with a central agency as being officially assigned to specific applications produced
    by specific vendors. So for example, IBM''s Notes email server use port 1,352
    and Windows Live Messenger used port 1,503 before it was discontinued by Microsoft.
    You don''t have to be a super user to use these.


