    \ SSL 保护的网站\n\n我们已经教你如何让你的 Web 服务器运行起来，但对于商业网站至关重要的另一个关键部分是安全网络连接。我们指的是 HTTPS\
    \ —— 即 HTTP 的安全版本。\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_229_0.png)\n\n\
    为了让 HTTPS 发工作，我们需要所谓的数字证书。这是一个电子“密钥”（本质上是一个充满深度加密信息的文本文件），它起两个作用：它允许浏览器验证服务器（即确认服务器确实是它所声称的身份）；它提供信息，允许浏览器和接收方在数据传输过程中进行加密，以便入侵者无法简单地接入并读取数据流。\n\
    \n## SSL 证书\n\n顺便提一下，你会发现这些证书通常被称为“SSL证书”。SSL 是安全套接层（Secure Sockets Layer），是网络领域多年以来使用的标准安全机制之一。实际上，SSL\
    \ 已被 TLS（传输层安全）取代。它们之间存在差异，但你可以基于这样一个前提：无论有人谈论 SSL 证书、数字证书还是（较少情况下）TLS，他们基本上说的是同一件事。\n\
    \n## 生成自签名证书和 SSL 保护的网站\n\n### 自签名证书\n\n商业网站拥有安全证书。这些证书的优点是它们由受信任的权威机构（CA）提供，因此网站用户知道它属于谁。对于我们的目的，我们将坚持使用所谓的“自签名”证书：这是我们自己生成的证书，让我们的服务器能够以\
    \ HTTPS 方式运行，这将导致浏览器由于不是来自 CA 而显示某些警告。不过这不是问题——大多数人运行开发服务器并不是因为商业证书需要钱（而且是很贵的钱）。\n\
    \n![](img/c00dda504be4d70c6e7dd488ae0af42a_230_0.png)\n\n### 创建加密内容\n\n为了运行安全服务器，我们需要数字证书。正如我们所说，我们不会从\
    \ CA 获取，而是自己生成。我们将通过让系统生成一个安全密钥、生成证书请求，然后根据它创建我们自己的证书。如果你使用 CA，则就不需要这样了。\n\n##\
    \ LINUX 作为服务器\n\n在开始之前，我们需要确保 Apache 已经安装并配置好。\n\n证书。正如我们所说，我们不会从 CA 获取证书，而是自己生成。我们将通过让系统生成一个安全密钥、生成证书请求，然后根据它创建我们自己的证书。如果你使用\
    \ CA，则就不需要这样了。\n\n## Apache 配置\n\n在开始之前，我们需要确保 Apache 已经安装并配置好。\n\n## 证书请求。\n\n\
