    # FUNKY SHELLS - AN HONOURABLE MENTION


    The shells we''ve mentioned are the ones you''re going to come across. There are,
    however, a few special-purpose shells for those of an adventurous disposition.
    For example:


    +   - Fish: the ''friendly interactive shell'', which is designed to be friendlier
    than traditional shells. It has neither sh nor csh in its heritage.


    +   - Scsh: a shell that''s based on the Scheme programming language.


    +   - Wish: a shell that lets you use GUI components.


    > Hot Tip There is no likelihood that you''re going to use the more outlandish
    shells, as they are really only for the hardcore Linux techie. Our favor says
    you''ll land with bash or tcsh.


    These shells have very little in common other than the fact that you''re unlikely
    to use them.


    # COMPARISON - STARTING AND STOPPING


    Now we know a little bit about the various shells on our Linux machines, let''s
    look at some of the practical differences. Although you can use any of the shells
    in their raw form, each one of them gives you the ability to write configuration
    files that set up the way you want it: to set the prompt you get on the command
    line, for example, or to define aliases for commands use a lot.


    Unhelpfully, different shells use different start-up files. Let''s compare bash
    and tcsh; we''ll look at what configuration files they look for first, and will
    then explain what''s actually done.


    When you log in with bash, it first checks for a system-wide configuration file:


    ```

    /etc/profile

    ```'
