    ![](img/c00dda504be4d70c6e7dd488ae0af42a_240_0.png)


    The answer is to try to log in from the console of the machine itself. If you
    can''t get in as a normal user, then click the ''Not listed'' link on the login
    screen and try getting in as the root user.


    # IT STARTS BOOTING BUT DOESN''T FINISH.


    # Hot Tip


    More common is where it starts booting but only gets partway before giving some
    kind of error message. These are generally exemplified by the words ''kernel panic''
    somewhere in the plethora of error messages, or perhaps a message telling you
    that one or other of the disk volumes couldn''t be mounted. The latter is common
    if the machine has crashed or you''ve


    It is possible for your user login to be corrupted. This could be a corruption
    in the user''s configuration files or the shadow entry. The best way to figure
    this out is to log in as a different user.'
  - '[PAGE 241]


    # TROUBLESHOOTING AND GLOSSARY


    powered it down rather than shutting it down gracefully. Although the file system
    formats on today''s Linux are much more robust and resilient to forced shutdowns
    than they were, you sometimes get to the stage where it says: ''I''m not carrying
    on until I have had this disk cleaned up.''


    If this happens, you can try to boot the machine in single-user mode and run a
    file system check on the disk it says is corrupted. You do this by:


    +   - Pressing ''e'' on the start-up screen so you can edit the boot command before
    it executes.


    +   - Scrolling down to the line that tells the system how to start up (it''ll
    have ''vmlinuz'' mentioned in it), then adding a space followed by the word ''single''
    at the end.


    +   - Pressing CTRL-X to continue booting.


    Below: fck lets us check and fix filesystems if we have got problems.


    ```

    root@localhost ~# fck /dev/sda2

    fck from util-linux 2.26.2

    fck, 3.0.27 (2014-11-12)

    041: Dirty bit is set. fs was not properly unmounted and some data may be corrupted.

    .

    1) Remove dirty bit

    2) No action

    3) ?

    There are differences between boot sector and its backup.

    This is mostly harmless, Differences: (offset:original/backup)

    5:01/00

    1) Copy original to backup

    2) Copy backup to original

    3) No action

    4) ?

    ```'
