    # 205


    # HOW TCP PORTS WORK


    When the client device tries to set up a connection, there are two key components
    to the request. First, and pretty obvious, the IP address of the system it''s
    trying to connect to. Second is the port number it wants to connect to, which
    is a number between 0 and 65,535.


    When a program such as a web server starts up, it ''listens'' for incoming connections
    on the network link. The trick is though, that the software will only listen on
    a specific port or ports. Imagine you have a phone system with 65,536 extensions;
    you have the same number of telephones and you''ve labelled each of them with
    a number from 0 to 65,535. Any of them could ring at any time, but you''ve told
    the web server only to answer extension 80, and the mail server only to answer
    extension 25. That''s precisely what happens with Linux server software.


    # Well-known Ports


    Ports 0 to 1023 are called well-known ports, and have been assigned to code, general
    functions: web and email servers, remote connectivity etc. Some of the common
    ports are:


    +   - 22: SSH, the secure shell mechanism that lets you connect into the Linux
    machine and use a command line to run commands and programs.

    - 25: SMTP, the Simple Mail Transfer Protocol (internet email, basically).

    - 53: DNS, the Domain Name Service.

    - 80: HTTP, the HyperText Transfer Protocol (web servers).

    - 109 and 110: POP, for pulling email down from a server.

    - 443: HTTPS, the high-secure version of HTTP.


