  - '[PAGE 239]


    # WHAT TO DO WHEN THINGS GO WRONG


    There will, of course, be a point at which something goes wrong. Linux is generally
    a very stable platform, but there''s always the potential for problems — hardware
    giving up the ghost, perhaps, but more likely user-inflicted (we''ll come back
    to that concept later). It''s not unusual to do something daft and break the configuration
    of the system, causing it to stop working, so what do we do when things go wrong?


    # IF YOU CAN''T GET REMOTELY


    The most common problem with Linux is when the machine is up and running but you
    can''t get in from a remote machine via SSH or some other remote tool. There could
    be a number of reasons for this: a dodgy network cable; the machine losing its
    IP settings; the system not enabling its LAN card correctly; an issue with the
    wireless network configuration (such as the authentication mechanism changing
    the machine''s settings, hence no longer matching); the IPTables configuration
    having locked you out; or one of any number of other things.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_239_0.png)'
