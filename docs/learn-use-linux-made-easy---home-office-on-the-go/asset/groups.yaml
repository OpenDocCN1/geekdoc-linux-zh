    # DOING THE SAMBA


    On Linux, SMB is implemented using the Samba package, which originated in 1992
    and was a massive hit right from the start. This is a standard part of the Fedora
    installation on our test machine, and although we''ve shown some of our examples
    using command line instructions, we''ll show some of this one with the graphical
    configuration interface. Well, it''s friendlier than typing commands, so why not?


    # BEFORE WE START


    In order to run the configuration process, we have to be able to run administrator-level
    functions. There are two ways to do this:


    - Log in as the ''root'' user on the Linux machine before you start the configuration
    process.

    - Log in as a user that you''ve created as an ''Administrator''.


