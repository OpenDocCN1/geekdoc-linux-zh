    ```


    你可能记得在我们将 Linux 设置 NAS 的示例中，我们必须使用 `setsebool -P samba_enable_home_dirs` 指令，SELinux
    才会允许我们作为共享文件夹访问 Max 的家目录。


    左图：SELinux 策略示例。


    # Linux 作为防火墙？


    我们已经讨论了 Linux 如何通过网络级安全（IPTables）和对访问权限的内部限制（SELinux）来保护自己。但如果你正在经营一家小企业并想要保护你的世界，你真的会将
    Linux 当作防火墙吗？说实话，可能不会。你肯定不会决定把你的文件服务器配置 IPTables 作为你公司的防火墙。为什么要让你的主数据仓库变成一个你积极预期它去防御攻击的东西呢？如果你的廉价路由器无法胜任，市场上还有许多专用设备，它们的设置起来要容易得多，而且可能比一台等着损坏的带有机械硬盘的
    PC 要可靠得多。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_174_0.png)


    所以，请利用手头的工具——IPTables 和 SELinux——来保护你的 Linux 机器，但我们建议不要急于将其作为保护你世界的安全设备，因为有比这简单得多的方法。


    # 无线安全


    Linux 世界的最后一个安全领域是无线安全。我们已经简要触及了你可以选择的无线网络选项，现在我们将对其进行详细介绍。


    # 什么时候不该使用无线网络


    在关于无线安全的章节中讨论为什么不使用它，可能有点奇怪，但在某些情况下，你选择使用有线网络是有完全充分的理由的。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_175_0.png)


    # 固定设备


    如果你在网络插座附近有一台台式 PC，可以通过铜缆或光纤方便地连接到网络，那就这样做吧。虽然网络发明者们正竭尽努力让他们的心血运行得更快，但他们仍然落后于基于电缆的一方。今天买一台台式
    PC，它将带有内置千兆以太网口，而在基础设施端，交换机方面也相当便宜。


    # 故障诊断


    有线网络也比无线网络容易诊断得多，因为你确切知道什么连接到了哪里，并且可以轻松将异常流量追踪到特定的设备或交换机端口。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_176_0.png)


    尽管如此，我们都想尽可能地使用无线网络——特别是对于我们那些喜欢随身携带的智能手机、平板电脑和笔记本电脑（希望是基于 Linux 的）。你正在打字这段文字的这台
    MacBook Pro 实际上并没有以太网口来使用电缆连接（需要一个小转换器），因此无线正日益成为常态。


    > 小贴士

    > 我们建议你在可行的情况下使用有线网络，但如果不可行，那么无线网络也可以——而且如果你为某些机器使用了电缆，就会为无线网络留出更少的设备进行共享（这意味着它运行得更快）。


    # 无线基础设施至关重要


    如果你操作得当，无线网络并不简单。当我们写下这些文字时，我们连接的并不是驱动我们网络的无线路由器，而是一个小型扩展器单元，它通过建筑的电源电路将我们的数据流发送到路由器。顺便提一下，这是增加无线覆盖范围的一种流行方法。


    # 简单措施


    如果你正在设置无线网络，可以做几件事来提高其安全性。首先，更改 SSID（网络名称），使其不会识别路由器型号或你个人信息的名称。其次，使用强加密协议。正如我们所见，WPA2
    是目前的标准。第三，为你的网络使用复杂的密码。最后，考虑禁用 WPS（Wi-Fi 安全设置），因为它可能存在安全漏洞。


    # 管理界面


    当你想要配置无线路由器时，你需要访问它的管理界面。这通常通过在浏览器中输入路由器的 IP 地址来实现。登录后，你就可以更改设置，包括 SSID、密码和加密类型。务必更改管理界面本身的默认密码，因为这是一个常见的安全风险。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_177_0.png)


