    ![](img/c00dda504be4d70c6e7dd488ae0af42a_93_2.png)


    - 5. 现在我们回到了没有警告的安装界面。“Begin Installation”（开始安装）按钮已启用，让我们点击它。


    上方：带有感叹号的图标显示未设置 root 密码。

    - 6. 安装程序现在将花时间安装软件。在此，你可以做几件事。你会看到没有设置 root（见中间）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_93_3.png)


    点击图标，将提示你设置密码，确保选择一个像样的——如果你选择的是明显的，它会警告你。


    上方：root 密码用于管理系统。


    # 下载你选择的发行版


    完成后点击“Done”。你应该创建一个普通用户——点击“User Creation”（用户创建）并输入真实姓名、ID 和你想使用的密码。运行几分钟后，安装程序将完成（你可以查看进度条了解它的运行情况）。


