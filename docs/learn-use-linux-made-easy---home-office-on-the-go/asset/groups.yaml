    ## 网络犯罪分子


    大众共识是，使用某个操作系统的人越多，它中病毒的可能性就越大。根据这一理论，Windows 之所以如此容易受到攻击，是因为它是最流行的操作系统——网络犯罪分子想要攻击用户最多的系统。


    这意味着 Linux 被忽视是因为它的用户较少，但还有另一个更具主导地位的因素，这与 Linux 验证系统更改的方式有关。


    ## 在线安全


    如果你思考发送到 Windows 机器的恶意软件会发生什么，你就能明白为什么可能需要更严格的身份验证规则。我们都听过关于病毒以及不该做的警告：不要打开未知发件者的网站链接；不要加载来源不明的
    CD；保持你的防毒软件更新到最新版本，等等。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_31_0.png)


    ## Linux 密码保护


    当关于不该做的警告被忽视时，病毒或木马就能干预底层操作系统并导致各种混乱。受害者不得不从头开始完全安装操作系统的情况也未未闻。


    这在 Linux 上不会发生，因为如果你想对底层操作系统进行更改，就需要一个身份验证密码。所以，除非你有一个特别聪明的病毒，不仅能搞乱你电脑的内部，还能读取你的密码，否则你是安全的。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_31_1.png)


    ## 缺少驱动程序


    如果你想给你的电脑连接任何类型的硬件——打印机、扫描仪或任何此类设备——你就需要运行一个名为“驱动程序”的小程序。当你首次设置设备时，这不是一个问题，因为它会被包含在安装盘中。当你想要使用另一台电脑并必须从头开始时，问题就开始了。在很多情况下，你没有安装
    CD，即使你有，你也必须担心自己使用的是否是最新版本的驱动程序。通常发生的是，你需要在制造商的网站上搜索并查看长长的驱动列表。这并不总是一项简单的任务，因为你必须与产品完全匹配，而且在制造商网站上并不总是容易找到驱动程序列表。


    你不需要经过 Linux 的这简直是一个奇迹，因为大量的驱动程序已经包含在 Linux 内核中了。设备开箱即用，第一次尝试就成功。


    下方：在 Linux 机器上处理驱动程序容易得多。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_32_0.png)


    ## 免费软件


    正如你可能注意到的，你不必担心 Linux 软件的成本。运行文字处理程序？不要为 Microsoft Office 花钱，改运行 LibreOffice 吧。你想处理图像？把
    Photoshop 挪到一边，选择 GIMP。想要一个邮件程序？Thunderbird。事实上，你可以挑选大多数商业软件产品，并发现某处有一个免费的 Linux
    等效产品。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_33_0.png)


    上方：GIMP 是 Photoshop 的替代品。


    下方：LibreOffice 提供高级文档创建和数据处理。


    Linux 和创意类用户特别喜欢 Apple 的软件和机器，并且对任何其他软件不屑一顾。然而，Linux 完全有能力处理这类需求。除了 GIMP 之外，还有许多可以由创意专业人士部署的产品——例如
    DarkTable 或 RawStudio。而且不仅限于照片处理；例如，Laidout 提供了另一种出版方式；LibreOffice 不仅仅是文字处理，还可以提供更高级的功能。


    ## 为什么选择 Linux？


    免费并不是它们唯一的优势（尽管这一点不容忽视）；处理漏洞的方式才是真正的加分项。多年来，微软程序中出现过很多漏洞。过去，等待第二个版本曾是一项信条，因为该公司通常将其初次尝试视为测试。修复这些漏洞需要时间。这并不是因为微软开发人员的技能不够，而是因为大公司的官僚机构会显著减慢一切的速度。


    Linux 这样的开源产品并非如此。正如其名字所示，一切都是公开的，没有任何隐藏的。这意味着任何人都可以更改源代码。在实践中，这意味着意义不大，因为只有熟练的开发者才能从代码中提取出重要的信息并进行修改。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_34_0.png)


    ## 介绍 Linux


    但这并不重要：那里有足够的代码专家可以做这些，你可以放心不会有恶意的开发者（即使有，他们也会被很快踢出去）。在 Linux 中，将有一个漏洞跟踪器来报告任何缺陷，与微软不同，你能够看到缺陷是如何修复的。


    > 贴士

    > 不要假设你所使用的任何东西都没有免费等效品，通常都有。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_35_0.png)


    | ID | 组件 | 分配人员 | 状态 |

    | :--- | :--- | :--- | :--- |

    | 17356 | Enterprise | Thom | 已分配 |

    | 109544 | Red Linux | Bastien | 修改 |

    | 121683 | Enterprise | Waters | 新 |

    | 120065 | Red Linux | Hammer | 已分配 |

    | 115083 | Enterprise | Ray | 新 |

    | 124357 | Enterprise | Holko | 已分配 |


    ## 屏


    我们都见过：蓝屏告诉我们出问题了。无论你使用的是哪个版本的 Windows。XP？Vista？Windows 7？它们都容易受到这种影响。


    上方：漏洞跟踪器是开放的解决方法。


    事实是，Windows 似乎比其他系统更不稳定——正如 Mac 用户喜欢指出的那样——而且有很多重启。这已经成为任何问题的标准笑话——关机重启。事实是，这大多数时候有效，但是一种低效的处理方法。


    ## 处理更新


    首先，有常规 Windows 更新需要处理。这些对于保持系统新鲜非常重要。然后你可能在更新你机器上的程序。每当你这样做时，你都会看到关于重启的消息——通常在你正在做某事时。


    在 Linux 上你可以忘记这一切。这不会发生。每当机器上有任何微小的变化时，都不会重启。轻声地说，世界上有很多 Linux 机器已经运行了多年，一次都没有重启过。


    ## 强大的 Shell


    Linux 的结构是一个核心内核（被 Linux 工具包围的操作系统核心）以及 Shell（用户处理的部分）。对于旧的微软用户来说，Linux 就像回到了
    DOS 时代。你必须使用命令行界面并学习一整套命令。它不像 GUI 那样直观，并且你需要确保语法完全正确；然而，Shell 可以比 GUI 更强大，提供一种在那些华丽选项中并不总是获得的控制水平。当然，这我们在
    Windows 中也能看到；当需要执行某些复杂任务时，GUI 被推到一边。微软本身通过引入 PowerShell 承认了这一点，这是一种针对 Windows
    用户的非常强大的工具——这表明 Linux 思维方式对更传统的公司产生了影响。


    > 贴士

    > Shell（也称为命令行）曾是吓跑人们远离 Linux 的原因。在现代 Linux 桌面面上，没有必要使用 Shell。


    '
