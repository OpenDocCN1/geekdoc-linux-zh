  - '[PAGE 40]


    That''s not to say that you can''t run a GUI on Linux, it''s just that they''re
    not integrated with the operating system in the same way that Windows is with
    Microsoft machines. But various distros have their GUI options – Mint has an option
    called Cinnamon, for example, and there are plenty of others to work with.


    # RUNNING GAMES


    If you''re a hardcore gamer, you''re going to want to stick to Windows. All game
    vendors will have to support Microsoft (even Macs play second fiddle when it comes
    to games). Linux is just not on the map when it comes to gaming software.


    Below: Alienware laptops running Windows are very popular with gamers.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_40_0.png)'
  - '[PAGE 41]


    # PCS WITH PRE-INSTALLED LINUX


    If you''re buying a computer from the likes of PC World or an online retailer
    such as Dabs, it''s going to come with Windows pre-installed (unless you''re buying
    a Mac, which will come with iOS pre-installed). And what if you want to buy a
    machine with Linux on it? Well, there''s the rub: there are a few places that
    will do, but you''ll have to search around.


    No major manufacturer has gone down that route since Dell launched a range of
    Linux desktop machines ... and discontinued them few months later. The reason
    for this is pure economics: there''s much more demand for Windows machines and,
    such, the mass market drives the economies of scale needed to bring the price
    down. You can also throw in the bloatware programs mentioned earlier. Yes, they''re
    a pain, but their vendors pay to be included and do help to bring the price even
    more.


    If companies offer Linux machines, what would they offer? Debian? Ubuntu? Mint?
    Fedora? You just know that any decision made would immediately raise the hacks
    of a legion of fans for an alternative system.


    > Hot Tip\If you''re looking to run a home server, then you have the option of
    pre-installed Linux. Dell and a few smaller vendors offer it.


    # WATCH VIDEOS


    We''re all used to watching video content on our computer screens. The TV is less
    in favour as a way of getting our fix and we''re using PCs, tablets and smartphones
    more and more.


    It isn''t quite true that Linux won''t let watch videos: there are workarounds
    that can be employed to watch videos, but they''re not straightforward. What most
    people want to do is switch on the device, click on a website and watch – this
    is something that''s not always possible with Linux, but don''t worry, there are
    still options available.'
