    number of bits in order to get going. We''re going to configure our server as
    a stand-alone machine (because it is – it''s not part of a corporate directory
    service). We''ll put it in workgroup ''LINUXWG'' and we call the machine ''LINUXSVR'':
    So we just look for the lines that match the left-hand side (the bit before the
    ''–'' sign) of each and update the right-hand side. Don''t randomly throw them
    in, or it''s unlikely to work – the config file is in sections and you''re likely
    to put things in the wrong place. Note also that you''ll find some lines that
    look like these but start with a '';'' or a ''#''. These are comments, so they
    won''t work unless you remove the leading '';'' or ''#''.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_219_0.png)


    ```

    workgroup = LINUXWG

    netbios name = LINUXSVR

    hosts allow = 127.192.

    security = user

    passdb backend = tbdsam

    ```


    Note the third line here – it''s a list of IP address ranges that the Samba server
    allows in. We''ve told it to allow any device whose IP address starts with ''127''
    (this is a special address called the ''loopback'', and you always include this)
    or ''192''. If your local computers'' IPs start with something else (''10'' isn''t
    unusual, for instance), then list it here or your systems won''t connect.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_220_0.png)


    # SPECIAL USERS


    Before we can carry on, there''s a catch: Samba uses its own password file if
