    # 预装 Linux 的 PC


    如果你从 PC World 或像 Dabs 这样的在线零售商购买电脑，它将预装 Windows（除非你买的是 Mac，它将预装 iOS）。如果你想买一台装有
    Linux 的机器呢？嗯，问题就在这里：虽然有几个地方可以做到，但你将需要处处寻找。


    自从戴尔推出了一系列 Linux 桌面电脑并在几年后停止生产以来，没有哪一家主要的制造商走过那条路线。原因是纯粹的经济学考虑：对 Windows 机器的需求大得多，因此大众市场推动了降低价格所需的规模经济。你还可以加上之前提到的那些预装软件（bloware）。是的，它们很讨厌，但它们的供应商付费以被在内，并且有助于进一步降低价格。


    # 运行游戏


    如果你是一个硬核玩家，你会坚持使用 Windows（即使 Mac 在游戏方面也处于次要）。Linux 在游戏领域根本不在考虑范围内。


    > 下文：运行 Windows 的 Alienware 笔记本电脑深受玩家欢迎。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_40_0.png)


    # 视频


    我们都习惯了在电脑屏幕上观看视频内容。电视作为获取这些内容的方式已不再流行，我们越来越多地使用 PC、平板电脑和手机。


    并不是说 Linux 不让你看视频：可以采用通通方法来观看视频，但它们并不简单。大多数人想做的是打开设备、点击网站并观看——这在 Linux 上并不总是可行，但别担心，仍然有方案。


    '
