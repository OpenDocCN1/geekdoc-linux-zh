    syntaxes; it''s just that if you have different flavours you''ll need to remember
    the different commands.


    > Hot Tip

    > Check out your distro''s package manager and see what family it comes from –
    that, you''ll know which types of package you can download and install.


    ## SIZE


    The other big difference you''ll find in Linux distros is their size. While this
    stands a little bizarre (surely Linux is Linux?), it makes sense if everyone''s
    requirements were the same, there would be a market for dozens and dozens of Linux
    distros.


