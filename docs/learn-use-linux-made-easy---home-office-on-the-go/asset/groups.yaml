  - '[PAGE 52]


    +   - Set most shells to colour-code the output of commands like ls based on the
    file type.


    +   - Limit what you can run, to ensure nothing runs away with the system resources.


    +   - Tell the shell to run a program in the background – detach it from the shell
    so you can even kill off the shell without killing the program.


    # The Prompt


    And in the command examples we just gave, you may have noticed the bit on the
    line where we''ve typed the command – the prompt:


    ```

    [dsc@localhost ~]$

    ```


    This is something all shells can do – provide you with a prompt that tells you
    useful stuff. In this case it''s telling us:


    +   - dsc@localhost: We''re logged in as user dsc on a machine called localhost.


    +   - ~: We''re currently working in the home directory of the current user (~
    is shorthand for ''home directory'' in Linux)


    +   - $: We''re running as a normal user (it''d be # if we were the privileged
    ''root'' user).


    We''ll come back later to a comparison of the popular shells you''re likely to
    come across in an average Linux distribution (see page 68). Some will install
    by default and others are options that you can turn on very easily.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_52_0.png)'
  - '[PAGE 53]


    # WHAT IS A DISTRO?


    We''ve already seen that the kernel enables us to run programs, and the shell
    lets us actually tell it to do so – but what about the programs themselves? Where
    do they come from? This is where the distros come in. They''re bundles that bring
    together all the items you need to take your combination of the Linux kernel and
    the shell and make it useful.


    # COMMANDS


    At the basic level, we have the commands that let us manage the Linux computer.
    So it''s commands like `ls` and `df` that we saw in the examples earlier, but
    in fact there are many hundreds of these that do an enormous amount. There''s
    `zip` for compressing files, mount to connect local and remote disk storage, ping
    to check if a remote computer is responding ... the list goes on far longer than
    we can accommodate here.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_53_0.png)


    # CODE LIBRARIES


    All operating systems have libraries – collections of common functions that programmers
    can use when writing their code. The idea''s a simple one: where there are functions
    that loads of programmers use all the time, not write them once, include them
    as part of the operating system, and let'
  - '[PAGE 54]


    the programmers call them from their code? The really common functions are things
    like string manipulation (reversing strings, counting string lengths and so on)
    or trigonometric functions. There''s a boatload of other, far more complicated
    stuff in the average Linux distro.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_54_0.png)


    Above: The Linux Programmer''s Manual showing the Library Function


    # PACKAGE MANAGER


    In the old days, distros came on CDs and DVDs. These days, you can still download
    an entire distro, but with modern, high-speed internet connectivity, it is equally
    common to start with a very small ''get started'' installer image and for the
    installer to download the bits it needs.


    To do this, the distro manufacturers have produced package managers – applications
    that bundle all the key components of a program into a single package, which you
    can then download and extract. The contents are pulled out of the package and
    placed in various'
  - '[PAGE 55]


    # THE LINUX ECOSYSTEM


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_55_0.png)


    Above: This is Yum, a graphical package manager for Fedora.


    appropriate locations around your computer''s disk. The package manager also knows
    about any dependencies that the software in one package has on other items, so
    if you try to install something that depends on a piece of software you don''t
    have, it will tell you and offer to download and install It for you.


    # A Big Win for Linux


    > > **Hot Tip**


    Get to know your package manager – it’s great to be able to interrogate your Linux
    system easily to see what''s installed, and what version it is.


    To give you an idea of what a huge benefit the package manager offers, let’s take
    the MySQL database package as an example. On my test PC, I compared the time taken
    to compile and install MySQL from scratch with the time taken to install it from
    the


    prepackaged version that comes with the Fedora distribution. With the self-compile
    option, it could take an hour to get the right prerequisites, compile the software,
    install the programs, tweak the configuration files and fire up the server. Installation
    using the prebuilt package took about three minutes, firing up the server once
    installed. The self-build took about 40 minutes for the compilation alone – and
    that’s without installing the prerequisite programs, downloading and unzipping
    the archive, etc. Using the package manager, it took three minutes to go from
    nothing to a running MySQL server. The package manager is one of Linux distros
    big wins.'
  - "[PAGE 56]\n\n# DOCUMENTATION\n\nDocumentation is absolutely key to any computer\
    \ system, and Linux has it in spades. The basic documentation used by Unix-style\
    \ operating systems since the year dot has been the man (manual) page. The man\
    \ command shows text-based documentation, with basic formatting, through which\
    \ you can page forward and back. For instance, the man page for the df command\
    \ is shown below.\nThe man library is still core to Linux, and to looking up how\
    \ the various commands you type. When it comes to application documentation it's\
    \ far more common either to have this in PDF form, in a browser-readable form\
    \ on the machine, or on the Web.\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_56_0.png)\n\
    \n```\nroot@linuxpc-local:~~\nFile Edit View Search Terminal Help\nDF(1)     \
    \                                          User  Command             DF(1)\nNAME\n\
    \ df - report file system disk space usage\nSYNOPSIS\n df (SECTION)  [FILE]\n\
    DESCRIPTION\n  This manual page documents the UIX version of df. df displays the\n\
    amount of disk space available on the file system containing each file\nname argument.\
    \ It takes no file name as given. If no file name is given, the space available\
    \ in all\ncurrently mounted file systems is shown. Disk space is shown in\nblocks\
    \ by default unless the environment variable POSIXLY_CORRECT is\nset in which\
    \ case 512-byte blocks are used.\n  If an argument is the absolute file name of\
    \ a device node contains\ning a mounted file system, df shows the space available\
    \ on that\nsystem rather than on the file system containing the device node. This\n\
    version of df cannot show space available on unmounted file sys\n```\n\nAbove:\
    \ The manual or man page for the df command."
  - '[PAGE 57]


    # APPLICATIONS


    Open source software has the benefit of enabling you to download the source code
    and compile it yourself. But unless you want to customize the code, why would
    you want to? To compile a typical source application, you need to install a compiler
    and a collection of other tools, which is a chore - particularly if you''re a
    nonexpert and you come across errors that you don''t understand.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_57_0.png)


    **Above:** The Ubuntu Software Centre is an application store for Linux.


    Distros feature collections of common applications that the producers have taken
    the time to compile, build and bundle into packages that can be installed and
    quickly using the package manager approach we discussed earlier. This collection
    of applications can only be described as enormous, regardless of which distro''re
    using: it ranges from trivial games, using useful system utilities, to high-performance
    and database software.'
