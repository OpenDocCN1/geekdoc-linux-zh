    # 应使用什么存储设备


    正如我们所提到的，Linux 可以运行在各种不同的硬件上。然而，影响其可靠性的关键因素之一，是你用于支撑运行机器的底层存储设备。计算机存储是一个极其广泛的话题，很有可能如果你问三个人对你的
    Linux 机器推荐什么种存储设备，你至少会得到两个、甚至是三个不同的答案。因此，关于你应该做什么，这里有一个中立的观点。


    # 磁盘类型


    主要的存储——即你启动 Linux 系统时所使用的设备——是硬盘。如今，你有两种选择：““传统的”磁性磁盘（我们将其称为“旋转磁盘”）和固态硬盘（也称为 SSD）。


    ### 旋转磁盘

    旋转磁盘顾名其实义——存储单元是一组涂有磁性材料的磁盘，它们以高速旋转。一个安装在移动臂上的“磁头”会在磁盘上移动，以便在磁性表面写入数据或将其从中读取出来。相比之下，SSD
    完全由闪存内存组成——没有移动部件，但它使用在设备关闭时仍能保留数据的固态内存。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_143_0.png)


    **上方：** 旋转磁盘的速度越快，价格越高。


    旋转磁盘有不同的速度类别。入门级磁盘的转速为 5,400 rpm，而在高端，你可以看到 15,000 rpm。正如你预期的那样，速度越快，磁盘的吞吐量就越高——价格也越高。


    > **热点提示**

    > **SSD** 曾经昂贵得离谱，但现在仅仅是非常贵了！随着它的普及，价格正在大幅下降，所以请查看在线商店寻找廉价。


    # 固态硬盘


    SSD 是一个完全不同的概念：它比旋转磁盘快得多——例如，从旋转磁盘迁移到 SSD 单元可以使你的机器启动速度至少快两到三倍，某些专业的基准测试显示这种差异远超于此。SSD
    极快，而且你还获得了静音的特性（正如我们提到的，它没有移动部件），并且功耗也低于旋转磁盘。


    另一个区别是价格。我们刚刚在一家热门在线零售商处对比了 1TB 的 SSD 和 1TB 的 5,400 rpm 磁盘，SSD 的价格是后者的五倍（£254/$400
    对 £46/$72）。这反映了 SSD 仍然是一项相对新的技术。价格已经从早期的水平大幅下降，随着制造技术变得更便宜以及供应商的竞争，价格将继续下降。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_144_0.png)


    **上方：** 固态硬盘使用闪存内存且没有移动部件


    # 接口


    在你使用的存储设备方面，同样重要的是磁盘的接口。如果你是一个正在构建大型服务器集群的企业级 IT 人员，那么你将使用光纤通道（Fibre Channel）或串行连接存储（称为
    SAS）。这些都是高速接口，如果你在使用 SSD，那么对于充分榨出这些昂贵磁盘的性能是至关重要的。


    如果你只是一个正在组装台式机、笔记本电脑，或者用于进行 Web 开发的小型服务器的普通人，那么你更有可能选择串行 ATA（称为 SATA）接口。带有 SATA
    接口的磁盘通常比 SAS 或光纤通道便宜，但更重要的是，如今大多数台式机和笔记本电脑默认都有 SATA 磁盘接口。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_145_0.png)


    # 容错


    如果你在构建 Linux 笔记本电脑，通常只有一个磁盘。但如果你在组装台式机，通常会有比一个磁盘更多的空间。这让你的系统更具健壮性。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_146_0.png)


    # RAID


    存储技术有一种称为 RAID，它最初代表冗余磁盘阵列（Redundant Array of Inexpensive Disks）。如今它被认为是独立冗余阵列（Redundant
    Array of Independent Disks），因为在 RAID 中使用的磁盘并不廉价——RAID 对于高速存储同样有效。


    你可以使用多种 RAID 配置，但我们关注的是 RAID 1。在这种方法下，你有连接到适配器的磁盘，每个数据都会同时写入两个磁盘。如果其中一个磁盘损坏，另一块将继续运行，对你的操作来说没有影响。还有其他
    RAID 种类，但对于大多数中小型安装，你会选择 RAID 1 或 RAID 5（在后者中，你有三个磁盘，数据分布使得你可以丢失其中一个而不受影响）。


    # 单磁盘


    如果你打算使用单磁盘，如果负担得起，请买一个 SSD。与“传统”磁性设备的速度相比，性能提升是巨大的，而且随着程序变得越来越大越来越慢（过去几年似乎一直如此），你会感谢自己投入了这项投资。


    '
