    \ mind having to reinstall – and as you've seen if you followed the walk-through\
    \ we did earlier, you can start from nothing and have a fully up-to-date Linux\
    \ installation within an hour, often less.\n\n# HOW THINGS MIGHT GO WR\n\nHaving\
    \ considered briefly how you might deal with something having gone wrong, let's\
    \ consider as our final thought on this subject how things might have gone wrong.\
    \ We mentioned earlier that one reason for not being able to connect remotely\
    \ to the machine is that IPTables has locked you out. Why might it do that? Simple:\
    \ because you made a change to it. We have a phrase in IT: 'sawing off the branch\
    \ you're sitting on'. It's the concept of connecting remotely into the machine\
    \ and then changing the configuration so that your remote connection is killed\
    \ and you can't restart it.\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_244_0.png)\n\
    Below: We can check what IPTables thinks it's letting in.\n\n```\nroot@linux-pc-local:~#\
    \ iptables -L -n -v\nChain INPUT (policy ACCEPT)\ntarget prot opt source destination\
    \ bytes packets\nACCEPT  all  all             0.0.0.0/0            0 0\nACCEPT\
    \  all  all             0.0.0.0/0            0 0\nACCEPT  all  all           \
    \  0.0.0.0/0            0 0\nACCEPT  all  all             0.0.0.0/0          \
    \  0 0\nACCEPT  all  all             0.0.0.0/0            0 0\nACCEPT  all  all\
    \             0.0.0.0/0            0 0\nACCEPT  all  all             0.0.0.0/0\
    \            0 0\nACCEPT  all  all             0.0.0.0/0            0 0\nACCEPT\
    \  all  all             0.0.0.0/0            0 0\n```\n"
  mdcn: "\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_234_0.png)\n\n# 配置 HTTPD\n\n\
    现在我们已经准备了所需的所有组件，可以将它们添加到 HTTPD 配置中了。为了这一步，我们需要将文件存放在合理的地方，然后让配置文件指向它们。我们将在 HTTPD\
    \ 配置目录中创建一个名为 `ssl` 的子目录，并将密钥文件和证书拷贝到其中：\n\n```\n[root@local]# mkdir /etc/httpd/conf/ssl/\n\
    [root@local]# cp linux.crt /etc/httpd/conf/ssl/linux.crt\n[root@local]# cp linux.key\
    \ /etc/httpd/conf/ssl/linux.key\n```\n\n现在，我们需要编辑 `httpd.conf` 并告诉它：a) 我们想使用安全的\
    \ HTTP 协议进行通信，以及 (b) 它的密钥在哪里找到。我们通过添加一个“虚拟主机”（virtual host）条目来实现（在我们的示例中，我们将其直接放在了配置文件的\
    \ `Listen 80` 行之后）：\n\n```\n# SSL config\n<VirtualHost _default_:443>\n  DocumentRoot\
    \ /var/www/html\n  ServerName www.mylinus.local\n  SSLEngine on\n  SSLCertificateFile\
    \ /etc/httpd/conf/ssl/linux.crt\n  SSLCertificateKey /etc/httpd/conf/ssl/linux.key\n\
    </VirtualHost>\n```\n\n这基本上是在告诉 HTTPD：\n\n- 网站文档存放在 /var/www/html。\n- 服务器名称为 www.mylinus.local。\n\
    - 我们想开启 SSL 引擎（提供安全功能的模块）。\n- 证书文件和密钥文件位于指定的路径，并具有指定的名称。\n\n由于我们编辑了配置文件，因此需要重启\
    \ HTTPD 才能让更改生效：\n\n```\nroot@local]# systemctl restart httpd\n```\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_235_0.png)\n\
    \n# 别忘记 IPTABLES\n\n记得我们之前必须告诉 IPTables 允许连接进入我们的基础 Web 服务器吗？猜猜看……端口 443 是 HTTPS\
    \ 端口，所以我们需要将该添加到 IPTables 权限中并保存以备后用。\n\n```\n[root@local]# iptables\n-I INPUT\
    \ 1 -p tcp -m state\n-state NEW --dport 443 -j ACCEPT\n[[root@local]# iptables-save\n\
    > /etc/sysconfig/iptables\n```\n\n这就完成了。我们现在可以在浏览器中通过 HTTPS 连接访问我们的服务器了。当然，我们预计它会抱怨证书不是由\
    \ CA 颁发的（见右侧）。\n\n我们可以通过点击浏览器中相应的链接来检查证书信息——在我们的示例中，它确实显示了我们几页前创建证书时输入的详细信息。点击警告我们就进入了。\n\
    \n![](img/c00dda504be4d70c6e7dd488ae0af42a_236_0.png)\n上方：浏览器将弹出安全警告\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_236_1.png)\n\
    上方：检查证书是否正确\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_236_2.png)\n上方：我们的页面现在受\
    \ SSL 保护。\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_237_0.png)\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_238_0.png)\n\
    \n# 出现问题时该怎么办\n\n当然，总会有某个时刻出现问题。Linux 通常是一个非常稳定的平台，但始终存在问题的可能性——也许是硬件罢工，但更有可能是用户人为造成的（我们稍后会回到这一点）。做一些愚蠢的事情并破坏系统配置导致其停止工作并不罕见，那么当问题出现时我们该怎么办呢？\n\
    \n# 如果你无法远程登录\n\nLinux 最常见的问题是机器正在运行，但你无法通过 SSH 或其他工具从远程机器登录。这可能有许多原因：网线故障；机器丢失了\
    \ IP 设置；系统没有正确启用网卡；网络配置问题（例如身份验证更改了机器设置，导致不再匹配）；IPTables 配置将你锁定在外面；或者其他许多问题。\n\
    \n![](img/c00dda504be4d70c6e7dd488ae0af42a_239_0.png)\n![](img/c00dda504be4d70c6e7dd488ae0af42a_240_0.png)\n\
    \n答案是尝试从机器本身的控制台登录。如果你无法以普通用户登录，请点击登录屏幕上的“root”链接并尝试以 root 用户身份登录。\n\n# 如果系统启动但未完成\n\
    \n更常见的情况是系统启动到一半就停止了。这通常是由于某些错误导致文件系统无法挂载，或者显示出“内核恐慌”（kernel panic）信息。这是由于磁盘损坏或强制关机导致的。在正常关机的情况下，Linux\
    \ 比强行关机更健壮且具有恢复性。\n\n如果发生这种情况，我们可以尝试进入单用户模式（single mode）启动。你可以通过以下方式操作：\n- 在启动屏幕上按\
    \ `e` 来编辑命令。\n- 找到包含 `linux` 的那行。\n- 在行末尾添加 `single`。\n- 按 `Ctrl+X` 启动。\n\n进入单用户模式后，我们可以修复文件系统：\n\
    \n```\nroot@local]# fsck -y /dev/sda1\n```\n\n修复后，重启系统即可。\n\n"
