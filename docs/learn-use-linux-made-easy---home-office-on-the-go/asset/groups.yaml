    # WHAT TO DO WHEN THINGS GO WRONG


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_242_0.png)


    The system will start up in a text-only mode, prompt you for the root password,
    then give you a command prompt. You can then run basic commands, the common one
    being fsck, the file system check tool, on the volume it previously told you was
    broken.


    # IF THIS DOESN''T HELP


    If you can''t get the system to boot into single-user mode, the easiest thing
    to do is boot from a USB stick, just as you did when installing it in the first
    place. Linux can be a pain to try to diagnose when you''re booting from a broken
    installation, so why not boot from an image that you know works and work from
    there?


    # Hot Tip


    Linux always logs a lot of information. Sometimes, the best way to solve a problem
    is to look back in the relevant log file.'
