    ## Google Drive


    你仍然可以使用没有 Linux 版本的云存储系统。就 Google Drive 为例。在 Windows 和 Mac 上，你可以自动在本地磁盘和远程副本之间同步文件，因为这些每个平台都有相应的桌面应用程序。在
    Linux 上，你无法这样做。不过，你可以做的是通过网络浏览器使用该服务。虽然文件不会自动同步，但你至少可以轻松地将它们下载到本地磁盘进行处理，然后简单地将它们拖入网络浏览器窗口即可重新上传。


    ## 某些软件未打包


    我们之前提到过，某些软件是没有打包的，你应该尽量避免使用它们。但是，它们有时非常有用，以至于你愿意付出努力。


    幸运的是，未打包的软件安装并不总是完全的噩梦。如果你下载源代码并自行编译，这可能会充满难以理解的错误信息，以及编译器抱怨缺少一个或多个所需的组件导致无法继续。但在其他情况下，你会发现软件提供商已经为你做了大量工作。例如，如果你想使用
    OpenOffice 应用程序套件，你可以从生产者的网站下载一组包文件，并按照相对简单的“read me”说明文件来安装这些组件。


    > 小贴士

    > 准备好反复调试和使用 Google：对于未打包的程序，“如何”文档通常很好用，但在你特定的系统上，你可能会遇到它们没有涵盖的错误信息。


    ## 兼容性


    在简单讨论了某些应用程序尚未适用于 Linux 的事实后，值得考虑你的 Linux 机器在与你拥有的其他电脑或可能在工作中使用的电脑连接时，兼容性如何（或是否不兼容）。


    ### 应用程序兼容性


    某些应用程序在 Linux 上根本不存在。例如，Microsoft Office；它有 Mac 版本和 Windows 版本，但没有 Linux 版本。在这种情况下，你需要依靠你所拥有的应用程序能够使用与你使用的其他平台兼容的格式打开文件。LibreOffice（Linux
    办公套件）能够打开 Microsoft Office 格式的文档，尽管无法保证在 LibreOffice 中打开时，例如 Word 2013 文档的格式会被绝对正确地保留。


    > 那些想要处理非 Linux 文档的用户，但兼容性并不总是 100%。


    **下方：**在你的 Linux 电脑上访问 Mac 文件是非常简单的。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_111_0.png)


    ## 网络交互


    考虑通过网络与其他操作系统交互的能力，事实上，这往往于非常简单，因为你拥有的几乎任何东西可能都能使用 Windows 的基本文件共享协议进行通信。例如，在
    Mac 上开启文件共享并在 Linux 电脑上导航到它确实非常容易。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_112_0.png)


    ## 企业目录服务


    接下来是如果你想在公司网络上使用 Linux，你可能需要使用的更高级的功能。在这种背景下，主要要求是 Linux 用户能够对企业目录服务进行身份验证——十之九将是
    Microsoft Active Directory。好消息是，尽管传统上相当棘手，但在今天这是完全可行的；坏消息是，这超出了刚接触 Linux 的人的理解范围，因为你需要运行许多看起来非常晦涩的命令。


    ## GUI 是你的朋友


    你可能已经注意到我们在书中使用的插图分为两类。第一类是传统的截图，显示了现代 Linux 系统的图形界面。第二类是我们使用的文本命令片段，用于显示无论你是否在机器上运行图形界面，都可以使用的命令。


    在 Linux 早期，由于内存和处理能力非常有限，图形用户界面并不常见，且通常运行起来非常棘手。今天的情况已不同了，因此使用 Linux 的正常方式（至少在台式电脑上是）是使用桌面环境之一。


    ## 入门


    所以，充分利用它吧。是的，你可以使用命令行来例如安装软件，或者同样，无论你选择哪种 Linux 发行版，都会有一个图形化包管理器。例如，在我们研究上一节时，我们就用它来安装了
    Dropbox 客户端。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_113_0.png)


    左侧：在这里，Dropbox 客户端正在使用图形化包管理器安装。


    ## 开箱即相当安全


    最后需要记住点是，Linux 被认为是一个非常安全、稳固的系统。如果你是从头开始安装的，很有可能是当你使用键盘和屏幕时电脑运行正常，但在其他地方却无法连接。让我们举个例子。Unix
    类系统的一个基本功能是从另一台电脑连接并输入命令。但如果我们尝试使用安全壳连接我们的机器（在此情况下是从 Mac），我们被拦截了：


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_113_1.png)


    ```

    DCPro:~ ssh dsc@192.168.1.186

    ssh: connect to host 192.168.1.186 port 22: Connection refused

    ```


    这是因为默认情况下情况下 Linux——在开启接受连接的服务之前，我们无法连接：


    ```

    [root@localhost ~]# systemctl start sshd

    ```


    现在我们可以再次尝试从 Mac 连接：


    ```

    DCPro:~ davidcartwright$ ssh dsc@192.168.1.186

    The authenticity of host ''192.168.1.186 (192.168.1.186)'' can''t be established.

    RSA key fingerprint is

    77:72:78:b0:5b:f7:d1:02:ce:cd:44:a5:92:7e:ed.

    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''192.168.1.186'' (RSA) to the list of known hosts.

    dsc@192.168.1.186''s password:

    Last login: Sat Aug 1 22:24:59 2015

    ```


    成功！并没有拒绝连接，而是询问我们是否想要接受安全密钥，然后在提供正确的密码后，我们允许进入。


    ## 额外安全


    你可能会发现你选择 Linux 了一些额外的安全项目，即使你开启了连接功能也会阻止远程访问，例如 IPTables 防火墙系统。所以，如果你在配置中勾选了所有选项仍然无法进入，请检查它是否运行了未知的防火墙。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_114_0.png)


    '
