    Novell 和 NetWare 操作系统）以及 X25（在同一时期广域网中非常流行）。


    所有这些协议之上的底层连接也变得简单了。除了 Mac 内置的 LocalTalk 外，我们还有 IBM 的令牌环（Token Ring）、FDDI（一种光纤技术，在
    100Mbit/s 速率下当时被认为是超快速的）、ATM（一种尝试过但在数据网络中失败的电信技术）以及许多其他技术。Linux 一直支持极其广泛的网络协议——在配置应用程序的截图中可以看到其中一些。如今，几乎全是以太网（Ethernet）统治天下；我们稍后会介绍无线部分。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_185_0.png)


    上方：可以在此配置应用程序上看到网络协议范围。


    ## 开始吧


    因此，我们将基于这样一个前提：我们想使用 IP 连接到以太网网络。我们的测试网络与大多数人家里宽带连接的情况相似：有一个路由器连接到宽带链路，而这个路由器通常有几个以太网端口并具备无线通信的能力。


    > 小贴士：即使你不打算使用它们，也要查看网络选项列表并在互联网上了解其中一些。老实说，非常有趣！


    IP 网络分为称为子网（subnets）的段（实际上还有很多其他术语，但如果你说子网，每个人都会明白你的意思）。这些段通过路由器连接。注意，我们几句之前提到过普通家庭网络有一个连接到服务提供商的路由器。如果你在想……是的，那个家庭网络仅仅是服务提供商网络的一个子网，你的世界通过路由器与他们隔离开。计算机能够直接与位于同一子网的其他计算机通信。在我们写这个句子时，我们的台基于
    Linux 的笔记本电脑和一台相当老旧的 iMac 都连接到同一个子网。Linux 笔记本电脑通过网络连接到 MacBook 上的共享目录，两台机器正在直接通信。我们可以关掉路由器，尽管无法访问互联网，但这两台机器不会失去彼此的联系。


    ## 路由的作用


    然而，当一台机器想要与其自身子网之外的东西通信时，它无法建立直接连接。毕竟，它想要连接的东西可能在世界的任何地方。这就是路由的工作——知道如何路由流量以到达目的地。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_0.png)

    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_1.png)

    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_2.png)

    上方：有线网络状态。

    下方：典型的路由器。


    ## 域名解析服务：其工作原理


    动态主机配置协议（DHCP）是你的好朋友。当你将计算机连接到家庭网络时，可能可能设置任何信息。当设备启动时，它将使用 DHCP 地址。它在网络中广播“有人能给我一个
    IP 地址吗？”，路由器从它的地址池中分配一个。大多数情况下，你什么都不需要做。


    > 小贴士：检查路由器的“DHCP 池”——它会向你展示允许选择的范围，以及哪些机器被分配了哪些地址。


    ## 使用以太网连接


    - 1. 现在连接我们的测试机器。我们用以太网线将其接入路由器并启动。现在，如果我们看屏幕右上角，可以看到有线项目显示为关闭，且网络连接图标上有一个小叉（见左侧）。

    - 2. 点击右侧的箭头会出现另一个菜单（见右侧）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_191_0.png)

    上方：有线网络目前已关闭。

    - 3. 我们可以点击“连接”，由于我们的路由器是 DHCP 服务器，它会分配一个地址。一旦 Linux 认为连接正常，我们将在窗口右上角获得一个新的网络端口图标（见下方）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_191_1.png)

    - 4. 再次点击右上角的三角形图标，我们可以拉下有线菜单并选择“有线设置”来查看服务器分配了什么（见对应图）。


    上方：有线网络已就绪。

    下方：一个新的网络端口图标现在出现在右上角。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_191_2.png)


    '
