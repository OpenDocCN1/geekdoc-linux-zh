    ## 我想要另一个桌面管理器吗？


    我们已经提到过，Linux 上有许多替代程序可以实现你想要的任何操作。其中一个关键选项是为你的 Linux 机器提供图形用户界面（GUI）的桌面环境。在我们的测试机器上，默认安装了
    Gnome 桌面，但你有很多选择。


    由于桌面环境是复杂的集合体，它们在 Linux 中是以“包组”（package groups）的形式实现的。因此，如果我们运行 `dnf grouplist`，它会告诉我们有哪些可用选项：


    ```bash

    [root@localhost ~]# dnf grouplist

    Last metadata expiration check performed 03:31:12 ago on Sat Aug 1 19:45:51 2015.

    可用环境组：

    ```


    - 最小安装 (Minimal Install)

    - Fedora 服务器 (Fedora Server)

    - Fedora 工作站 (Fedora Workstation)

    - Fedora 云服务器 (Fedora Cloud Server)

    - KDE Plasma 工作空间 (KDE Plasma Workspaces)

    - Xfce 桌面 (Xfce Desktop)

    - LXDE 桌面 (LXDE Desktop)


    > 小贴士

    > 桌面环境可能很大，所以不要下载了之后就让它们闲置在那里而不使用。


    顺便说一下，这是一个简化列表。如果我们想安装 KDE，可以运行 `dnf groupinstall KDE Plasma Workspaces`。同样，要安装
    Xfce 桌面，我们需要运行 `dnf groupinstall Xfce Desktop`。


    我们选择了 Xfce，它花费了大约五分钟下载安装。然而，一旦下载完成，你需要告诉系统使用它。这是一个运行 `switchdesk` 工具的简单案例（注意你必须先安装
    `switchdesk` 包——现在你应该已经知道怎么做了）：


    ```bash

    [root@localhost ~]# switchdesk xfce

    Red Hat Linux switchdesk 4.0

    Copyright (C) 1999-2010 Red Hat, Inc

    Redistributable under the terms of the GNU General Public License Desktop now
    set up to run xfce.

    ```


    有趣的是，你可以在 `switchdesk` 的输出中看到 Fedora 的传承，其中提到了 Red Hat 是原始生产者。


    ## 需要注意的问题


    我们已经走过了从裸机系统到可运行 Linux 机器的过程，结果应该非常令人印象深刻——一台拥有吸引人的用户界面（它们开箱即用的效果都很好）的运行机器，能够与其他计算机通信、上网并运行你想要使用的应用程序。然而，这才是现实世界，当你真正安装和使用
    Linux 时，有几点需要记住。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_105_0.png)


    ## 它是真实的吗？


    在下载 Linux 发行版的章节中，我们没有提到一点：每当你下载任何开源文件时，都应该确保下载的镜像是真实的。如果你是从官方网站下载的，通常没问题，但你应该检查一下。你使用“校验和”（checksum）来完成——它是由一个程序计算的，该程序读取文件的每一个字节并执行计算，得出一个字符字符串。原理是，只有该文件会计算出该字符串。


    以我们的 Fedora 镜像为例，来说如何检查文件的完整性。如果我们看 Fedora 网站上安装程序文件所在的目录，会看到许多文件：


    - Fedora-Live-Workstation-x86_64-22-3.iso

    - Fedora-Workstation-22-x86_64-CHECKSUM

    - Fedora-Workstation-netinst-x86_64-22.iso


    `Fedora-Live-Workstation-x86_64-22-3.iso` 是我们下载并用于安装 Linux 的镜像。如果我们下载 `Fedora-Workstation-22-x86_64-CHECKSUM`
    文件（非常小）并检查其内容，我们看到一条加密信息：


    ```

    --BEGIN PGP MESSAGE--

    Hash: SHA256

    The image (s) are generated with sha256.

    SHA256 (Fedora-Workstation-netinst-x86_64-22.iso) = c9d22e708b213358b2193670fc4b4824cf96d4d07bd6c28

    SHA256 (Fedora-Live-Workstation-x86_64-22-3.iso) = 615abcf89709a46078dd1d39638019aa6f6b0ff823534f1af0551bbbc

    -----BEGIN SIGNATURE-----

    Version: GPG v1

    iQIBCAAGBQQV4xe1A0JBtwOFDHV40QaJPHV0Ye5mcyQQPT0Q9HpTMW0AdGpbnBCQtJi2MeoqP5LX8AD55FC5qmnQzzbXQC6666fff0YUtUtUtUtUtm43Eb0DG9Y111b22141444449999999999992222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222

    -----END SIGNATURE-----

    ```


    看到 `Hash: SHA256` 的地方了吗？它告诉我们校验和的类型是安全算法（Secure Algorithm）。它还告诉我们安装程序的校验和是：


    615abcf89709a46078dd1d39638019aa6f6b0ff823534f1af0551bbbc


    ## 开始开始


    所以，如果我们为 ISO 计算 SHA256 校验和，在 Windows 上应该得到相同的序列。在 Mac 上，我们使用 `shasum` 命令完成：


    ```bash

    davidcartwright$ shasum -a 256 Fedora-Live-Workstation-x86_64-22-3.iso

    615abfc89709a46078dd1d39638019aa6f6b0ff823534f1af0551bbbc Fedora-Live-Workstation-x86_64-22-3.iso

    ```


    果不其然，我们得到了匹配的校验和。这不仅告诉我们它是真实文件，也是检查文件是否完整的方便方法。如果你想在 Windows 上检查 SHA 校验和，有多种选择——例如在
    www.raylin.wordpress.com/downloads/md5-sha-1-checksum-utility 提供的免费工具！正如我们所提到的，这是一个非常值得学习的习惯。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_107_0.png)


    | 文件: | |

    |---|---|---|

    | E:\Fedora-Live-Workstation-x86_64-22-3.iso | 浏览 |

    | MD5 | DD8B4533AA37A81247182B0794F927 | 复制 |

    | SHA-1 | E50C8A2E81A9A2E9B8D112F98FB369598C | 复制 |

    | SHA-256 | 615ABFC89709A46A078DD1D39638019AA6F6B0FF832534F1AF10551BB6CF | 复制
    |

    | SHA-512 | 8A293A6458EC9C40DC3FF53D2A0D3F76435570045176443836E112C770FA8E7 |
    复制 |

    | 哈希: | |

    | 使用生成的哈希验证 (MD5, SHA-1, SHA-256 或 SHA-512) | |

    | | 验证 |


    下方：检查 SHA 校验和是一个非常值得学习的习惯。


    升级专业版以获取更多功能


