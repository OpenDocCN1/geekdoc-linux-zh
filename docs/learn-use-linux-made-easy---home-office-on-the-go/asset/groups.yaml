    # 下一步工作


    一旦安装了 Linux，你就拥有了一个工作系统，但不是最新的。制作人员不会每出一个新微调就不断更改镜像；例如，你看到的下一个镜像将是版本23。


    # 你应该寻找什么？


    所以当你安装任何其他操作系统——例如 Mac 或 Windows 时——要做的第一件事是确保所有内容都是最新的。这非常简单，我们马上就会看到。


    为什么要立即运行更新？因为我们总是希望从最新的系统开始（我们稍后会回到管理更新）。不同的发行版有不同的包管理器，因此运行更新的方式不同。从版本 22 开始，Fedora
    实际上将包管理器从 Yum 更改为 DNF。使用它非常简单——只需运行 `dnf update`：


    ```

