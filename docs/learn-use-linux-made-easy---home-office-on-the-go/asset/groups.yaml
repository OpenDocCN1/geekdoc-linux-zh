    所以，我们在这里讨论的主流 Linux 发行版是所谓的通用型：它们在你的硬盘上占用几百 MB 或几 GB 空间，这没问题，因为你可能有一个不错的处理器和几百
    GB 的硬盘空间。但如果你受限了呢？广受欢迎的树莓派（Raspberry Pi）在诞生之初只有 256MB 板载内存，并依赖 SD 卡进行磁盘存储，在那个时代，16GB
    被认为是大容量。我们在研究这一部分时使用的参考之一是，基础安装要求从 16MB（对于小型 Linux 发行版来说很惊讶）到 1GB（对于像 Fedora 这样的发行版）之间的
    SD 卡。


    上述：Linux 是一个功能强大的发行版，尽管其大小不一。


    ## 处理器平台


    发行版之间最困惑的差异在于它们拥有不同的包管理器。我们在示例中使用的 Fedora 安装使用 DNF，它是 Yum 包管理器的继者。红帽使用 RPM。Yum
    和 DNF 都与 RPM 包配合，因此基本相同（尽管语法不同）。Debian 用户会习惯高级软件包工具（APT）。它们的功能几乎完全相同，只是 DNF 是
    Yum 的现代替代方案且它们具有不同的语法；只是，如果你有不同的变体，你需要记住不同的命令。


    > 小贴士

    > 检查你发行版的包管理器并看看它来自哪一个家族——通过这一点，你就知道可以下载和安装哪些类型的包了。


    最后，这意味着发行版之间存在处理器支持。如果你基于 Intel 风格的处理器（x86 或 x86-64），那么你有很多选择——虽然并不是所有的 Linux
    都支持这些非 Intel 处理器，ARM 架构被一系列设备支持，而且像 Yellow Dog 这样的朋友也有相当的选择。


    ## Gentoo Linux


    有一个发行版我们偶然没有提到，顺便提一下，它非常疯狂且值得特别提及。我们检查了 Gentoo Linux 的下载页面，得到了 x86、x86-64、Alpha、HPPA、IA64、PowerPC、s390、SuperH
    和 SPARC 等选择。而且 MIPS 版本并没有跨平台。


    > 小贴士

    > 你可能没有 IBM 主机，所以 x86 或 x86-64 已经足够了。


    ## 使用什么硬件


    如果你打算运行 Linux，你需要一些东西来运行它。现在，我们假设你将使用一台真实的、活的、某种描述的计算机（虽然亚马逊云服务等云服务很棒，但不是我们要讨论的）。现代
    Linux 实现非常棒的一点是，它们支持的硬件范围非常广泛——所以你有从你组装的 PC 到高性能商业机器的各种选择。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_133_0.png)


    ## Intel 与其他处理器


    我们够老的人会记得，Windows 不仅仅是 Intel 处理器的操作系统。Windows 也适用于 DEC Alpha 处理器，事实上，我们亲眼见证过。同样，Sun
    的 Solaris 不仅兼容 Sun 自己的 SPARC 处理器，还支持 x86 和 x86-64（当然，它在 SunOS 时代支持过 6800 系列处理器，而
    PowerPC 处理器仅支持过一个短暂的版本）。


    | 发行版 | x86 | x86-64 | IA64 | POWER | SPARC | ARM | MIPS | SH | IBM 主机 | ALPHA
    |

    |---|---|---|---|---|---|---|---|---|---|

    | CentOS | | 是 | | | | | | | |

    | Debian | 是 | 是 | | 是 | | 是 | | | | |

    | Fedora | 是 | 是 | | | | 是 | | | | |

    | Gentoo | 是 | 是 | 是 | 是 | 是 | | | 是 | 是 | 是 |

    | openSUSE | 是 | 是 | | | | | | | | |

    | Oracle Linux | 是 | 是 | | | | | | | | |

    | Red Hat Enterprise Linux | | 是 | | 是 | | | | | 是 | |

    | Slackware | 是 | 是 | | | | | | | | |

    | SUSE Linux Enterprise Server | 是 | 是 | 是 | 是 | | | | | 是 | |

    | Ubuntu | 是 | 是 | | 是 | | 是 | | | | |

    | Yellow Dog Linux | | | 是 | | | | | | | |


    ## CPU 技术


    关于 Linux 的惊事实之一是，它支持的不是两三个处理器家族，而是一个荒谬的 CPU 技术列表。当然，我们从明显的 x86 和 x86-64 架构开始，还有
    PowerPC（如 IBM RS/6000）和 IBM 的 Power 处理器。然后是 ARM 处理器，如果你正在构建一个小型 ARM 设备设备并希望在上面运行自定义软件，它是嵌入式操作系统的超级选择。但规模增大后，它也支持如
    IBM S/390 和 z 主机架构的大系统。


    ## 什么处理器？


    见上表，显示哪些发行版支持哪些处理器。它包含了提供主机版本的处理器；例如，Fedora 有针对 MIPS 的“次要”版本，但它们没有包含在内，因为这些版本无法保证发布。


    ## 需要考虑的因素


    事实是，你不会先决定使用 Linux，然后再决定要在哪个平台上运行它。硬件平台或操作系统的选择很少是孤立的决策，相反，你是一对选择选择。


    举个例子。假设你是一家想要运行大型数据库系统的公司，并且已经决定 Oracle 是你想要使用的数据库包。你有多种选择：你可以使用运行 SPARC 处理器（当然是
    Oracle 拥有的）上的 Solaris，也可以使用 Intel 基础设备运行 Windows，或者你可以选择你喜爱的 Intel 服务器供应商（可能是
    HP 或 Dell）运行 Oracle Linux 并在其上部署 Oracle 数据库。


