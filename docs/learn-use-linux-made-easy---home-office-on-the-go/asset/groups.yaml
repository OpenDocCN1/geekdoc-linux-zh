    # 学习与使用

    # LINUX

    # 轻松易学


    一旦精通，Linux 就可以成为一个极其高效且稳定的操作系统。而且完全不需要任何费用。Linux 用户拥有更改桌面设计的自由，可以根据个人喜好决定哪些软件适合自己，并确保为电脑提供卓越的安全保护。本书包含了分步骤的指导指南和实用的插图，涵盖了你掌握
    Linux 需要的所有知识。


    《Linux 轻松易学》是一本极好的实用书籍，为首次尝试理解该操作系统的读者以及任何希望在现有知识基础上进一步深造的人提供了支持。通过易于阅读的 Linux
    操作指南，你将获得关于选择哪种发行版的建议、哪种存储系统最适合你，以及如何充分利用操作系统性能的技巧。除了涵盖了安装所选发行版的基础知识外，你还将获得关于如何在网络上保持安全的专家建议，以及关于无线安全和下载合适防火墙的有用信息。此外，你还将学习内核以及不同的
    shell 家族，包括 sh、bash 和 tch。


    后续章节还包含了关于 Linux 网络连接的指导以及一个实用的故障排除章节。在这里，你将找到针对最常见问题的有效解决方案，以及一份你可能需要的所有技术术语列表，这将帮助你克服任何潜在问题。本书书中充满了直观的指令和专家知识，对于任何想要充分利用
    Linux 的功能的人来说都是完美的。


