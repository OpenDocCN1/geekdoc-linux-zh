    \n# 代码库 (CODE LIBRARIES)\n\n所有的操作系统都拥有库——程序员在编写代码时可以使用的常用函数集合。这个想法非常简单：如果有大量程序员经常使用的函数，就不要每次都写一遍，而是将其作为操作系统的一部分包含起来，让程序员在代码中调用它们。非常常用的函数是如字符串处理（反转字符串、计算字符串长度等）或三角函数。在普通的\
    \ Linux 发行版中，还有大量其他更复杂的内容。\n\n![](img/c00dda504be4d70c6e7dd488ae0af42a_54_0.png)\n\
