    # # CONFIGURING HTTPD


    Now we''ve got all the bits we need, we can add it to the HTTPD configuration.
    To do this, we need to put the files somewhere sensible and then point the config
    file at them. We''ll create a sub-directory ''ssl'' in the HTTPD config directory
    and copy the key file and the certificate into it:


    ```

    ```

    [root@local]# mkdir /etc/httpd/conf/ssl/

    [root@local]# cp linux.crt /etc/httpd/conf/ssl/linux.crt

    [root@local]# cp linux.key /etc/httpd/conf/ssl/linux.key

    ```

    ```


    Now we need to edit ''httpd.conf'' and tell it that (a) we want to talk using
    the secure HTTP protocol, and (b) where to find its keys. We do this by adding
    a ''virtual host'' entry (in our example, we dropped it just after the ''Listen
    80'' line of the config file:'
  - "[PAGE 235]\n\n```\n# SSL config\n<VirtualHost _default_:443>\n  DocumentRoot\
    \ /var/www/html\n  ServerName www.mylinus.local\n  SSLEngine on\n  SSLCertificateFile\
    \ /etc/httpd/conf/ssl/linux.crt\n  SSLCertificateKey /etc/httpd/conf/ssl/linux.key\n\
    </VirtualHost>\n```\n\nWhat this is basically telling HTTPD is:\n\n+   - The website\
    \ documents live in /var/www/html\n- The server name is www.mylinus.local\n- We\
    \ want to turn on the SSL Engine (the module that provides secure functionality).\n\
    - The certificate file and key file are in the given locations with the specified\
    \ names.\n\nBecause we've edited the configuration file, we need to restart HTTPD\
    \ for it to see the changes:\n\n```\nroot@local]# systemctl restart httpd\n```\n\
    \n![](img/c00dda504be4d70c6e7dd488ae0af42a_235_0.png)"
  - '[PAGE 236]


    # DON''T FORGET IPTABLES


    Remember we had to tell IPTables to let connections come into our basic web server?
    Well, guess what ... port 443 is the HTTPS port, so we need to add that to IPTables
    permissions and save it for future reference.


    ```

    [root@local]# iptables

    -I INPUT 1 -p tcp -m state

    -state NEW --dport 443 -j ACCEPT

    [[root@local]# iptables-save

    > /etc/sysconfig/iptables

    ```


    And that''s it. We can now access our server with an HTTPS connection in the browser.
    We expect it to complain that the certificate isn''t one from a CA, of course
    (see right).


    We can check the certificate information by clicking on the appropriate link in
    the browser – in our example, it does indeed show the details we entered a few
    pages back when we created the certificate. Click through the warning and we''re
    in.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_236_0.png)


    Above: The browser will come up with a security warning


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_236_1.png)


    Above: Check that the certificate is correct


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_236_2.png)


    Above: Our page is now SSL protected.'
