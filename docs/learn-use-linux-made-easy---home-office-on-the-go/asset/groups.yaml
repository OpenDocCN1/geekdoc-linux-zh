    # THE LINUX ECOSYSTEM


    If you''re looking for a general, mainstream Linux, then Oracle Linux isn''t the
    obvious choice. You would, however, consider it if you have a heavy leaning towards
    Oracle''s application products, over time there will inevitably be performance
    benefits in having applications running on their vendor''s home-produced operating
    system. Incidentally, don''t forget that this doesn''t just mean the commercial
    Oracle apps – they also own the likes of the MySQL database application, which
    started life in the open source world.


    > Hot Tip

    If you''re using Amazon''s cloud, why not consider their AMI Linux? After all,
    you know it''s optimized for that platform and has been well tested.


    # NOTABLE OTHERS


    The Linux providers we''ve mentioned are few, but they cover the vast majority
    of Linux installations worldwide. It is, however, worth giving a quick mention
    to a handful of others.


    # AMI


    First, Amazon''s Linux AMI. As you might guess, this is a Linux flavour that was
    produced and is maintained by Amazon. If you''re going to use Linux Amazon''s
    EC2 cloud server platform, this is unsurprisingly an attractive option, as you
    can be sure of compatibility and performance.


    # Debian


    Next, we have Debian Linux. In truth, it''s no longer a big deal in its own right.
    In fact, there''s a very close relationship between Debian and Ubuntu, but it''s
    the latter that is seeing popularity – primarily because of the development and
    support umbrella provided by Canonical. So Debian''s far from dead, but people
    tend to lean towards Ubuntu.


    # Android


    Finally, let''s mention an operating system you might not have been expecting
    to read about: Android. It''s been estimated that Android runs on more devices
    worldwide than any other'
  - '[PAGE 68]


    # THE PROS AND CONS OF THE MAIN VENDORS


    operating system, and it''s easy to forget that it''s actually based on the Linux
    kernel. Of course, Android isn''t a Linux distro in the sense discussed earlier;
    it''s a fairly tight set of components designed for a specific purpose. A standard
    Linux distribution comes with a set of developer tools onboard to write apps for
    Android you run a developer tool on a separate PC. Nonetheless, don''t forget
    that Android is actually Linux under the hood.


