    # CONTENTS


    +   INTRODUCTION.......................................................................
    8


    +   INTRODUCING LINUX...............................................................
    14


    For those who are brand new to Linux, this chapter will offer you an introduction
    to what it is and everything it has to offer. We''ll explain why Linux is one
    of the best operating systems currently available, and explore how it compares
    to others such as Mac OS and Windows. Any questions you may have after choosing
    Linux can be answered here.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_5_0.png)


    +   THE LINUX ECOSYSTEM...........................................................
    42


    This chapter discusses the importance of the Linux ecosystem and will help you
    get to grips with the basics behind it. You will learn valuable information on
    what a distro, explore the main vendors and decide which would be most suitable
    for you. We''ll also compare and contrast the various shell families including
    sh/ksh/bash vs csh and tcsh.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_5_1.png)'
  - '[PAGE 6]


    # GETTING STARTED ................. 80


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_6_0.png)


    Here, you will learn everything you need to know about getting started with Linux.
    From suggesting what you should be looking out for, to providing help and support
    on downloading the chosen distro of your choice, this chapter will be able to
    help you with any queries you may have.


    # WORKING WITH LINUX ................. 114


    This chapter will really help you get to grips with everything there is to know
    about actually working with Linux. We''ll provide informative guides to the many
    different distros: Ubuntu, Debian and Red Hat etc., as well as compare the similarities
    and differences between them. For those planning to create or download a range
    of files, we will offer advice on what storage system would suit you best.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_6_1.png)'
  - '[PAGE 7]


    # LINUX AND SECURITY


    Staying safe online is incredibly important to us, and so this chapter will provide
    you with enough information to ensure your safety. With advice on Linux firewalls
    on wireless security settings, your Linux system should remain safe from any nasty
    surprises.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_7_0.png)


    # LINUX AND NETWORKING


    For support and advice on how to get connected with Linux, this chapter will guide
    you through the necessary steps to do so. We''ll teach you how to set up your
    wireless network as well as explore telnet and port configuration in more detail.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_7_1.png)'
  - '[PAGE 8]


    # LINUX AS A SERVER ...................................................... 212


    For those who are unsure how to go about setting up a Linux server, look no further.
    This chapter will show you how to configure a personal NAS (Network Attached Storage),
    as well as how to use the Apache web server. It also includes step-by-step guides
    on how to generate self-signed security certificates.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_8_0.png)


    # TROUBLESHOOTING & GLOSSARY ....................... 236


    Often things do not go smoothly, and so when those times occur, we have the solutions.
    In this chapter, we will try to provide the best solutions to any problems you
    may have as well as offer all the technical terms you may need.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_8_1.png)


    # FURTHER READING & USEFUL WEBSITES ....................... 252


    # INDEX...............................................................................................
