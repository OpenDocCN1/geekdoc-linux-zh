    # 188 LINUX AND NETWORKING


    ## GETTING CONNECTED


    Computer networking has changed hugely over the years. The strange thing is though,
    unlike pretty much else in the universe, the world of networking hasn''t quadrupled
    in complexity. In fact, it''s actually got simpler. Days, the only network protocol
    the average user comes across is IP – the Internet Protocol. That wasn''t the
    case until the late 1990s, before which we had an unbelievable range of network
    protocols. Just to pick few, we had DECNet (from Digital Equipment Corporation,
    who invented it to let computers to talk to each other), AppleTalk (from Apple
    in the mid-1980s), IPX (another vintage protocol, this time from Novell and the
    NetWare operating system) and X25 (hugely popular around the same time for wide
    area networks).


    The underlying connectivity on top of all these protocols got simpler too. As
    well as LocalTalk built into Macs, we also had IBM''s Token Ring, FDDI (a fibre
    technology, which at 100Mbit/s was considered superfast in its day), ATM (a telecom
    technology that tried but failed in data networking) and many others. Linux has
    always support for an enormous range of network protocols – just some of them
    can be seen in the screenshot of the configuration application. Nowadays, it''s
    pretty much Ethernet over the board; we''ll come to wireless shortly.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_185_0.png)


    Above: Some of the range of network protocols can be seen on this configuration
    application.


    ## LET''S GET STARTED


    We''re therefore going to work on the premise that we want to connect to an Ethernet
    network using IP. Our test network is pretty much the same as most people have
    at home on their broadband connections: there''s a router that connects to the
    broadband link itself, and this router usually has both a handful of Ethernet
    ports and the ability to talk wireless.


    > Hot Tip: Even if you''re not going to use them, check out the list of networking
    options and read up on some of them on the internet. It''s fascinating stuff,
    honest!


    IP networks are split into segments called subnets (actually, there are loads
    of other terms as well, but if you talk subnets, everyone will know what you mean).
    These are connected by routers. Note that we mentioned a few sentences ago that
    the average home network has a router connecting to the service provider. So if
    you''re wondering... yes, that home network is merely a subnet of the service
    provider''s network, and your bit of the world is separated from theirs by the
    router. Computers are able to talk directly to other computers that sit on the
    same subnet. So as we''re typing this sentence we have our Linux-based laptop,
    and a rather aged iMac all connected to the same subnet. The Linux laptop is connected
    via the network to a shared directory on the MacBook and the two machines are
    talking directly to each other. We could power off the router and, although the
    internet would be inaccessible, these two machines wouldn''t lose touch with each
    other.


    ## WHAT A ROUTER DOES


    When a machine wants to talk to something outside its own subnet, though, it can''t
    make a direct connection. The thing it wants to connect could be anywhere in the
    world, after all. That''s the router''s job – to know how to route traffic so
    it reaches its destination.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_0.png)

    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_1.png)

    ![](img/c00dda504be4d70c6e7dd488ae0af42a_188_2.png)

    Above: If we needed to add routes, we could do so in the network control panel.


    > Hot Tip: Get to grips with your router, because it''s key to how your network
    works, and understanding what it does will help you a lot.


    There are two types of route that a router knows about. First, the default gateway
    – which is the route used for any traffic that is not destined for the local network.
    Second, static routes, which are manually configured to tell the router how to
    reach a specific subnet. These are the routes that the router uses to decide where
    to send your packets next.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_189_0.png)

    Below: A typical router.


    ## DOMAIN NAME SERVICE: HOW IT USUALLY WORKS


    The Dynamic Host Configuration Protocol, or DHCP, is your best friend. When you
    connect a computer to your home network, you probably don''t need to set any information.
    When a device starts up, it''ll have DHCP addressing by default. It broadcasts
    across the network to say “Can someone give me an IP address?” and the router
    assigns one from its pool of free addresses. So most of the time, you don''t have
    to do anything.


    > Hot Tip: Check out the ''DHCP Pool'' of your router – it will show you the range
    of addresses it''s been told to choose from and will show you which machines have
    been given which addresses.


    ## CONNECTING WITH ETHERNET


