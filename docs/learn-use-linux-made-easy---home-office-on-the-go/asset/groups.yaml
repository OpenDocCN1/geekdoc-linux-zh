    Received wisdom is that the more people use an operating system, the more likely
    it is to have viruses. According to this theory, the reason that Windows is so
    vulnerable to attacks is because it’s the most popular operating system – cyber
    criminals want to attack the system with the most users.


    This implies that Linux is being ignored because there are few users, but there''s
    another overriding factor, which is to do with the way that Linux authenticates
    system changes.


    # Online Security


    If you think about what happens with malware sent to a Windows machine, you can
    see why you may need tougher authentication rules. We''ve all heard the warnings
    about viruses and what not to do: don''t open website links from unknown senders;
    don''t load CDs of unknown provenance; keep your antivirus software up to date,
    and so on.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_31_0.png)


    # Linux Password Protection


    When warnings about what not to do are ignored, the virus or the Trojan is able
    to interfere with the underlying operating system and cause all sorts of mayhem.
    It''s not been unknown for a victim to have to install the operating system completely
    from scratch.


    This can''t happen with Linux, as you need an authentication password if you want
    to make a change to the underlying operating system. So, unless you have an especially
    smart virus that can not only muck up the innards of your computer, but also read
    your password, you''re going to be in the clear.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_31_1.png)'
