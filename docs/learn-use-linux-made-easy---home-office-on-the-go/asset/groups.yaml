    computer and have to start all over again. In many cases, you won''t have the
    installation CD, and even if you do have it, you then have to worry about whether
    you''re using the latest version of the driver. What generally happens is that
    you need to search through a manufacturer''s website and look down a long list
    of drivers. This isn''t always a straightforward task, as you have to have an
    exact match with the product and it''s not always easy to find a list of drivers
    on manufacturer websites.


    This is a miracle that you don''t have to go through Linux, as vast numbers of
    drivers are already included in the Linux kernel. Devices work out of the box,
