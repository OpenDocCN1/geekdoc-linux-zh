    # 运行 SAMBA


    在 Linux 上，SMB 是使用 Samba 软件包实现的，它源于 1992 年，并且从一开始就大获成功。这是我们测试机器上 Fedora 安装的标准部分，尽管我们之前已经展示了一些使用命令行指令的示例，但我们将通过图形化配置界面来展示其中的一些内容。嗯，它比输入命令要友好得多，为什么不试试呢？


    # 在开始之前


    为了运行配置过程，我们必须能够运行管理员级别的功能。有两种方法可以实现：


    - 在开始配置过程之前，在 Linux 机器上以 ''root'' 用户身份登录。

    - 以你创建的 ''Administrator''管理员用户身份登录。


    对于这个示例，我们以 ''root'' 身份登录了。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_217_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_218_0.png)


    # 我们的共享设置


    我们将采用的是非常基本的设置：我们将创建用户 ''max''，他将拥有一个属于他自己的私有目录。一旦你让基础 Samba 设置运行起来，战斗就赢了 95%
    百比——如果你接着想开始玩转共享目录之类的内容，你不会发现它非常困难。


    # 创建用户


    一种不那么笨拙的创建用户的方法是直接使用 `user add` 命令通过几条命令完成上述所有操作。首先是创建用户：


    ```

    [root@fileserver-local ~]# useradd -c ''Max Cooter'' max

    ```


    现在我们设置密码：


    ```

    [root@fileserver-local ~]# passwd max

    Changing password for user max.

    New password:

    Retype new password:

    passwd: all authentication tokens updated successfully.

    ```


    # 设置 SAMBA


    如果你还没有安装 Samba，请打开你的软件包管理器并安装它（对我们来说 `dnf install Samba`）。我们通过编辑位于 `/etc` 目录下的
    `smb.conf` 文件来实现，我们可以通过“活动”菜单中的“文件”（Files）功能来完成——只需向右滚动并双击它即可。


    配置文件看起来很可怕——但不要惊慌！你只需要编辑极小的一部分内容即可开始。我们将服务器配置为单机模式（因为它确实是——它不是公司目录服务的一部分）。我们将它放在工作组
    ''LINUXWG'' 中，并将机器命名为 ''LINUXSVR''：所以我们只需要寻找与左侧（''–'' 符号之前的部分）匹配的行，并更新右侧。不要随机把它们丢进去，否则可能无法工作——配置文件是分段的，你可能会把东西放在错误的地方。另请注意，你会发现某些行看起来像这样，但以
    '';'' 或 ''#'' 开头。这些是注释，除非你删除开头的 '';'' 或 ''#''，否则它们将起起作用。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_219_0.png)


    ```

    workgroup = LINUXWG

    netbios name = LINUXSVR

    security = user

    passdb backend = tbdsam

    ```


    注意这里的第三行——它是 Samba 服务器允许接入的 IP 地址范围列表。我们告诉它允许任何 IP 地址以 ''127'' 开头的设备（这是一个被称为“回环”的特殊地址，你总是要包含它）或
    ''192'' 开头的设备。如果你的本地电脑 IP 以其他数字开头（例如 ''10'' 并不罕见），请在这里列出，否则你的系统将无法连接。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_220_0.png)


    # 特殊用户


    在我们继续之前，有一个陷阱：如果你像我们这样运行单机机器，Samba 会使用它自己的密码文件，因此你需要告诉它关于我们的新用户。我们使用 `smbpasswd`
    命令来实现这一点：


    ```

    [root@fileserver-local samba]# smbpasswd -a max

    New SMB password:

    Retype new SMB password:

    Added user max.

    ```


    在更复杂的设置中，你可以有一个目录服务，Samba 和你所有其他系统都对其进行身份验证，但那是另一的话（也是另一本书）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_221_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_222_0.png)


    # SELINUX


    还有一件事，它可能安装在你的 Linux 机器但也可能可能。许多 Linux 发行版（包括我们 Fedora 机器上的）的另一个标准安全特性是 SELinux——“安全增强
    Linux”的简称。它是内核的一部分的安全模块，用于监控活动。它默认阻止的操作之一就是 Samba 对主目录的使用。让我们告诉它允许：


    ```

    [root@fileserver]# setsebool samba_home_dirs on

    ```


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_223_0.png)


    # 测试一下


    好的，现在我们认为 Samba 服务器已经运行了，可以使用名为 `smclient` 的酷酷工具进行检查。这是 Samba 安装的一部分，它允许我们探测机器是否能看到我们的
    Samba 服务。我们在 Linux 终端窗口运行它，使用 `L` 标志告诉它连接到 `localhost`（自身），并使用 `U` 标志告诉它我们要以用户
    ''max'' 的身份连接。它会询问 max 的密码，然后告诉我们它可以做什么：


    ```

    [root@fileserver-local]# smclient -L localhost -U max

    Enter max''s password:

    Domain=[LINUXWG] OS=[6.1] Server=[Samba 4.2]

    ```


    | Sharename | Type | Comment |

    | :--- | :--- | :--- |

    | IPC$ | Service (Samba Version 4.2) | |

    | max | Home Directories | Domain=[LINUXWG] OS=[6.1] Server=[Samba 4.2] |

    | LINUXSVR | | Master |

    | LINUXWG | | LINUXSVR |


    这里的关键点是我们可以看到有服务器 ''LINUXSVR'' 和工作组 ''LINUXWG''。在顶部的 Sharename 部分，我们可以看到 ''max''
    是一个可用共享。所以让我们从我们的机器尝试连接服务器。点击“连接服务器”选项并输入我们的共享名称 - sm://linuxsvr/


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_224_0.png)


    **上方:** 一旦输入了共享名称，你就能够连接到服务器。


    如果服务器可用，它会要求我们登录——如果没有，我们将收到错误。如果我们看到登录框，这是一个好信号——我们将输入详细信息并点击“连接”。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_224_1.png)


    **上方:** 在登录框中输入你的信息。


    等一会儿连接，我们就可以像使用其他文件夹一样使用我们的共享文件夹了。


    > 提示

    > ''smclient'' 是你的它是它是验证 Samba 配置正常工作并发布你想共享的文件的佳方法。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_224_2.png)


    **上方:** 我们的共享文件夹。


    # 使用 Apache 服务器


    我们之前提到 Apache 是一个非常流行的服务器；我们没有提到它是世界上最流行的。


    我们引用的调查中 3.25 亿 Apache 安装占了调查发现服务器的约 38%；微软的服务器仅占约 27%，因此落后了很多。我们已经完成了如何让 Apache
    服务器运行的基础工作（见第 209-211 页），因此在本节中我们将深入探讨，并展示如何使用你的 Apache 服务器做一些更有趣的事情。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_225_0.png)


    # 它叫 ''HTTPD''


    曾经 Apache 只指代该名的 Web 服务器软件。但多年来，Apache 项目已大幅扩展，现在在其伞下有很多不同的应用程序。HTTPD（超文本传输协议守护进程）是
    Web 服务器软件包——你在你的 Linux 机器上遇到的每一个引用都会以某种方式谈论 HTTPD。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_225_1.png)


    例如，你通过引用 ''httpd'' 服务来启动和重启服务器：


    ```

    [root@fileserver~]# systemctl start httpd

    [root@fileserver~]# systemctl enable httpd

    [root@fileserver~]# systemctl stop httpd

    ```


    # 配置服务器


    你将修改的是配置文件，它被称为 `httpd.conf`。

    在 Fedora 机器上，它位于 `/etc/httpd` 目录，由于它是一个文本文件，你可以直接使用“文件”工具进行导航并双击打开。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_226_0.png)


    - 这是主 Apache 配置文件。

    - 它包含了赋予服务器指令的指令。

    - 详细信息请参见 http://httpd.apache.org/docs/2.4/mod/。

    - 特别是，请参见 http://httpd.apache.org/docs/2.4/core/index.html

    - 关于每个配置指令的讨论。

    - ServerRoot: 存放配置、错误和日志文件的目录树。

    - 使用 "/"，ServerRoot 的值已准备就——对于 WIN32，服务器将创建 /var/log。

    - 在非本地磁盘上 ServerRoot，请确保指向网络机器上的本地磁盘。如果你想为多个 httpd 进程使用相同的 ServerRoot，你需要至少更改一个文件。

    - Listen: 允许 Apache 绑定到 IP 地址和/或端口而不是默认端口。另见 <VirtualHost> 指令。

    - 在不了解它们作用的情况下，不要编辑这里的指令。它们在这里作为提示或注释。


    # 配置服务器


    你将修改的是配置文件，它被称为 `httpd.conf`。


    你会发现 Linux 配置文件看起来很可怕——就像我们之前看到的 Samba 配置文件一样。但正如我们所说的，真的没什么好担心的，因为它“开箱即用”的设置通常足够让它运行起来或至少接近要求。


    '
