  - '[PAGE 249]


    # TROUBLESHOOTING AND GLOSSARY


    **Gnome**: A graphical desktop environment; in other words, the collection of
    icons, widgets, graphics, folders and toolbars that''s on your screen when you
    start your computer. It''s a fierce competitor with KDE. The two products have
    very different roots (although they both originated in the Unix world); Gnome
    started as a GPL project while KDE was designed to be as efficient as possible.
    There are really no massive differences between the two products – although both
    have their fierce adherents – so it''s a question of personal taste.


    **GPL Licence**: Stands for General Public Licence. Strictly speaking, should
    be GP Licence but GPL Licence has become the accepted term (in the same way that
    we talk about ATM machines). It''s an example of a copyleft licence in which any
    modifications and developments must be under the same terms as the original. In
    other words, you can''t take code under GPL, modify it and impose a new set of
    conditions on it.


    **GNU Project**: One of the very free software projects, started by Richard Stallman.
    Linux was released under the GNU licence (although not part of the project itself).


    **Grub**: The name for a program that runs when a computer boots up. It''s this
    that kick-starts the kernel in preparation for running the computer itself.


    **Kernel**: The very heart of Linux. This is where all the processing happens.
    There are two approaches to the kernel by the distros: one is that the kernel
    is left pretty untouched and the distros distinguish themselves by the utilities
    that are offered; the second is that kernels are modified in such a way to offer
    something distinct – Fedora does, for example.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_249_0.png)


    **KDE**: The other desktop environment; if you don''t want to use Gnome, KDE is
    one of your options.'
  - '[PAGE 250]


    # GLOSSARY


    LAMP: Stands for Linux, Apache, MySQL, PHP, a bundle of four Open Source components
    used in the development of websites. Because all the elements are free and open
    source, it''s widely used by website developers to avoid any vendor lock-in.


    MySQL: An open source relational database system. This was originally developed
    by Swedish company MySQL AB, but is now owned by Oracle. Originally developed
    under the terms of GNU/GPL, MySQL is used extensively for database-driven websites
    and is one of the elements in the LAMP software bundle.


    LEAF (Linux Embedded Appliance Firewall): LEAF is an easy-to-use embedded Linux
    system that is meant for creating network appliances for small office, home office
    and home automation environments.


    Open Source: The name for any software that is open to all to modify and muck
    around with, as distinct from proprietary code, owned by the likes of Microsoft,
    Apple, Oracle etc.


    LibreOffice: (Derived from OpenOffice, after it had been forked.) A free alternative
    to Microsoft Office, providing pretty much everything that Microsoft offers –
    not very compatible with Office,.


    Windows: A bit of an oddity. This is a Linuxstyle operating system but one that
    looks like Windows (for those users who really can''t do without). The catch is
    that it''s proprietary – so not really Linux-style at all.


    Minix: An offshoot of Unix with a microkernel architecture. Linux emerged when
    Linus Torvalds started working on the software.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_250_0.png)'
  - '[PAGE 251]


    Package manager: As the name suggests, this is a bundle of utilities that assists
    a user in installing and configuring operating system software. While it''s possible
    to install Linux without a package manager, the user must make sure that all software
    is up to date, have to compile the software direct from the source code (not for
    the faint-hearted) and configure each element separately. Put it in this way,
    you''re going to use some sort of package managers running several such package
    managers under Linux. The Advanced Package Tool, or APT, has been designed to
    handle the installation and removal of Debian family software, while Dancified
    Yum (DNF) is the default package manager for Fedora.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_251_0.png)


    RMS: How Richard Stallman is often known.


    PGP: Stands for Pretty Good Privacy. This is an Open Source encryption program,
    developed by Philip Zimmermann, as a security measure for protecting email and
    files.


    Root: This is a hangover from Unix days but it fundamentally makes absolute control
    of a system. If you think back to the way you use Windows, there are trivial changes
    you can make (to the look and feel, for example) that have no effect on how the
    computer works, but if you want to do something fundamental, you need administrator
    access. Root is the Linux equivalent of that.


    PHP: An Open Source programming language that''s used in developing applications
    for web servers. Part of the LAMP bundle of software components.


    Samba: A Linux-based file-sharing application.


    Red Hat: One of the leading distros, sponsor of Fedora and vendor of Red Hat Enterprise
    Linux (RHEL).


    Slackware: The first Linux distro that is still going strong.'
