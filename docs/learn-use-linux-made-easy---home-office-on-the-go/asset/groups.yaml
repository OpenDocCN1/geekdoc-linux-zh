    ## SUSE

    在提到 Slack-ware 时，我们不能不提到 SUSE（其“U”在多年后神奇性地变成了大写——为了避免混淆，我们将使用全大写的版本）。为什么？因为 Slack
    是源于 1992 年的名为 SLS 的东西的“绑定”版本；SUSE 4.2（尽管版本如此，这是第一个化身）是 Slack 的德语翻译版。


    Debian 的最初版本也于 1993 年问世，这得益于一位开发者的努力，但与其他版本一样，社区的成长使其发展成了今天的模样。尽管在如今，它可能被一些知名度更高的发行版所掩盖，但它从一开始就一直存在着。


    ## Red Hat

    仅仅几年后，1995 年5 月见证了 Red Hat Linux 1.0 的诞生；我们今天熟知的产品在 2002 年 3 月随着 RHEL 2.1 的正式发布而加入了“Enterprise”（企业级）一词，人们意识到
    Linux 有机会作为一种企业操作系统被严肃对待。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_124_0.png)


    > 小贴士

    不要轻视 Debian —— 它仍然是非常优秀的发行版，尽管有些大猩猩发行版获得了多得关注。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_124_1.png)


    ## CentOS

    CentOS 出于 2004 年春季，源自 RHEL，并继续随着新 RHEL 版本的发布以其为基础。作者们极力强调，CentOS 仅仅是 RHEL 的免费复制，尽管如此，它是基于
    Red Hat 提供的开源代码构建的，而且 CentOS 项目委员会也包含了 Red Hat 的人员。


    ## Fedora

    沿着类似的 RHEL 血缘进入 Fedora 线路，Fedora Core 1（前六个左右版本都是 Fedora Core 某某版本）于 2003 年 11
    月发布。令人惊喜的是——Fedora 也有来自 Red Hat 团队的正式赞助和投入。


    ## Ubuntu

    大约 2004 年，我们迎来了 Ubuntu，其第一个正式发布版本被混乱地命名为 4.1。尽管正如我们提到的，Ubuntu 与 Canonical 有着紧密的联系，但它仍然是一个真正的社区驱动的
    Linux 实现。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_125_0.png)


    ## 最近十年的发展

    最后，2004 年 SUSE 开启了向开源版本的探索，OpenSUSE 运生。


    这可能会让你感到惊讶（我们也是如此），Oracle Linux 在 2006 年 10 月发布，正如我们提到的，它和这里提到的其他口味一样，源自 Red Hat
    的血统。Oracle 决定发布自己的 Linux 并不意外。既然应用程序的性能直接受到底层操作系统性能的影响和影响——为什么不采用一个源代码免费获取的操作系统，并制作出一种融入了应用程序开发者知识成果的自己的口味版本呢？


    Oracle Linux 基于 Red Hat，并自 2006 年起一直在运行。


