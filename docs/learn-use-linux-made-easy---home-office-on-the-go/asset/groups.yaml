    ## GENERATING SELF-SIGNED CERTIFICATES AND SSL-PROTECTED WEBSITES


    We''ve given you a start on getting your web server up and running, but there''s
    one more key component that is essential to commercial websites – secure web connectivity.
    By this, we mean HTTPS – the secure version of HTTP.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_229_0.png)


    For HTTPS to work, we need what''s called a digital certificate. This is an electronic
    ''key'' (which is basically a text file full of heavily encrypted information)
    which does two things: it allows the browser to authenticate the server (that
    is, confirm that the server is who it says it is); and it provides information
    that allows the browser and fro to encrypt data as it''s sent to and fro, in order
    that an intruder can''t simply tap into it and read the data streams.


    ## SSL CERTIFICATES


    You''ll find, incidentally, these certificates are often referred to as ''SSL
    certificates''. SSL is the Secure Sockets Layer, one of the standard security
    mechanisms used in networking for donkey''s years. In reality, SSL has been superseded
    by TLS (Transport Layer Security). There are differences, but you can work on
    the premise that whether someone talks about SSL certificates, digital certificates
    or (less often) TLS, they''re basically talking about the same thing.


    ## GENERATING SELF-SIGNED CERTIFICATES AND SSL-PROTECTED WEBSITES


    ### Self-signed Certificates


    Commercial websites have security certificates. The benefit of these is that they''re
    provided by trusted authorities (CAs) and so the user of the website knows it
    belongs to whom it says. For our purposes, we''re going to stick with what we
    call ''self-signed'' certificate: this is a certificate that we generate ourselves
    which lets our server work in HTTPS fashion, which will cause the browser to show
    some warnings due to not being from a CA. This isn''t a problem though – most
    people run development servers, not because commercial certificates cost money
    (and lots of it).


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_230_0.png)


    ### CREATING ENCRYPTION STUFF


    In order to run a secure server, we need a digital certificate. As we''ve said,
    we''re not going to get one from a CA but generate our own. We''ll do this by
    making the system generate a secure key, generating a certificate request and
    then creating our own from it. If you were using a CA you''d do the first steps
    yourself, but then throw the certificate request at the CA for them to generate
    it.


    ## LINUX AS A SERVER


    Before we start, we''ll ensure that we have the necessary prerequisites. We already
    have ApacheD but we need to ensure that ''openssl'', ''mod_ssl'' and ''crypto-utils''
    packages are installed; as we''ve covered it we won''t go into the detail of how
    to use them.


    ### Generating the Key


    First, let''s generate the key. In our example we''ll use DES and tell it to generate
    a 2048-bit key. This is pretty standard nowadays: the more bits you use the harder
    it is to process and hence the more your server will slow down.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_231_0.png)


    We use the openssl command to generate the key, it prompts for a password which
    is used to secure the key itself – make sure you use a complex one and keep a
    safe of it.


    ```

    [root@local] openssl genrsa -des -out linux.key 2048

    Generating RSA private key, 2048 bit long modulus

    ++++++

    .

    .

    ++++++

    is 65537 (0x1001)


    Enter passphrase for linux.key:

    Verifying - Enter passphrase for linux.key:

    ```


    ## Create the Certificate Request


    Now we''ll create the certificate request using the openssl command. It asks for
    some information about our organization; ours but if you''re doing this with a
    CA-provided certificate, you''ll need to be careful to enter correct valid information.
    Why? Because the CA will demand that you prove who you are – so if you''re a company
    and your registration document doesn''t match what you''ve put in the certificate
    request, they''ll tell you where to go.


    ```

    [root@local]# openssl req -new -key linux.key -out linux.csr

    Enter passphrase for linux.key:

    You are about to be asked to enter information that will be incorporated into
    your certificate request.

    What you are about to enter is what called a Distinguished Name or a DN.

    There are quite a few fields that you can leave blank. For some fields there will
    be a default value, if you enter ''.'', the field will be left blank.

    Country Name (2 letter code) [XX]:GB

    State or Province Name (full name) []:

    Locality Name (eg, city) [Default City]:St Helier

    Organization Name (eg, company) [Default Company Ltd]:Linux Made Easy

    Organizational Unit Name (eg, section) []:

    Common Name (eg, your name or your server''s hostname):www.mylinux.local

    Email Address []:dsc@linuxmadeeasy.com

    ```


    Please enter the following ''extra'' attributes to be sent with your certificate
    request

    A challenge password []:

    An optional company name []:


    ## CREATING THE CERTIFICATE


    Now we can create our certificate. Before we do, we have to do a special step
    and take off the password from the key file so the certificate generator can work
    with it:


    ```

    [root@local]# mv linux.key linux.key.org

    [root@local]# openssl rsa -in linux.key.org -out linux.key

    Enter passphrase for linux.key.org:

    writing RSA key

    ```


    And finally we''ll generate the certificate itself:


    ```

    [root@local]# openssl x509 -req -days 90 -in linux.csr -signey linux.key -out
    linux.crt

    Signature ok

    subject=/C=GB/ST=Jersey/L=St Helier/O=Linux Made Easy/CN=www.mylin.local/emailAddress=dsc@linuxmadeasy

    Getting Private key

    [root@fileserver-local html]#

    ```


