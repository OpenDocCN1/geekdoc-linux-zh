    ![](img/c00dda504be4d70c6e7dd488ae0af42a_243_0.png)


    # REMEMBER THE BACKUP


    We mentioned earlier that one thing you absolutely should do is implement a backup
    of your key data and configuration files, with whatever tool you find easiest.
    That''s because there may well come a point when reinstalling the operating system
    is actually the most straightforward way of getting the machine back up and running.


    If you''ve got a backup, you won''t mind having to reinstall – and as you''ve
    seen if you followed the walk-through we did earlier, you can start from nothing
    and have a fully up-to-date Linux installation within an hour, often less.'
