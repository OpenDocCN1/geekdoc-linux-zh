    ![](img/c00dda504be4d70c6e7dd488ae0af42a_112_0.png)


    # Corporate Directory Service


    Next is the more advanced functionality that you may have to use if looking to
    use Linux on a corporate network. The main requirement in this context is for
    Linux users to be able to authenticate against the corporate directory service
    – which nine out of ten will be Microsoft Active Directory. The good news is that
    although traditionally quite tricky, this is perfectly feasible today; the bad
    news is that it''s well out of the scope of someone''s just getting to grips with
    Linux, as there are lots of very cryptic-looking commands you need to run.


