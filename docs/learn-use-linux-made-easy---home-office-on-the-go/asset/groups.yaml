    The Linux providers we''ve mentioned are few, but they cover the vast majority
    of Linux installations worldwide. It is, however, worth giving a quick mention
    to a handful of others.


    # AMI


    First, Amazon''s Linux AMI. As you might guess, this is a Linux flavour that was
    produced and is maintained by Amazon. If you''re going to use Linux Amazon''s
    EC2 cloud server platform, this is unsurprisingly an attractive option, as you
    can be sure of compatibility and performance.


