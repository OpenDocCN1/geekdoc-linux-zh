    在这里，我们杀掉了 SSH 服务器，但它允许我们的会话继续。不过，如果我们断开连接并尝试重新连接，它会如预期地拒绝我们的连接：


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_245_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_246_0.png)


    # 小贴士


    如果你的 Linux 图形桌面冻结了，最好的办法是按下 Ctrl + Alt + F2 切换到控制台。这将允许你从控制台登录并找到导致桌面冻结的原因。


    ```

    [root@dc-linux ~]# exit

    [dsc-dc-linux ~]$ exit

    Connection to 192.168.1.186 closed.

    DCPro:~ davidcartwright$ ssh dsc@192.168.1.186

    ssh: connect to host 192.168.1.186 port 22: Connection refused

    DCPro:~ davidcartwright$

    ```


    然而，对于其他配置项，你可能就不会那么幸运。因此，在远程重新配置系统时要务必极其小心。保持一个开启的连接以防万一，并且如果控制台位置较远，要有一个进入控制台的备用方案，因为我们职业生涯中的某个时刻都曾见过“锯掉自己正坐着的树枝”的情况。


    # 术语表


    **Apache**: 这是开源软件真正影响业务的地方。它是最广泛使用的 Web 服务器软件，占据了约 40% 的市场。它是开源开发的巅峰，由一群开发者维护，并由
    Apache 软件基金会支持。


    **Bloatware（臃肿软件）**: 不必要的程序和应用程序，或者内存和磁盘空间占用远超其需求的软件。特别指随操作系统一起交付的软件。


    **BSD**: Berkeley Software Distribution（伯克利软件发行）的缩写。Linux 最早的实现之一，根源于 Unix。


    **Bash**: 简单来说，它是将你的 CLI 命令转换并对其进行处理的程序之一。换句话说，它处理 Linux 命令，但它本身并不是 CLI。


    **Compile（编译）**: 将源代码转换为可执行内容的艺术。程序员们经常使用这个词，但新手通常不会做很多编译。


    **Copyleft（反向许可）**: 开源版的版权的等价物。它明确表示源代码可以自由地分发、修改和随意摆弄。


    **CLI**: Command Line Interface（命令行界面）：你最初向计算机输入那些 Linux 指令的方式。曾经，所有的计算机都使用这种界面，后来我们发现了
    GUI（图形用户界面）。


    **CUPS**: Common Unix Printing System（通用 Unix 打印系统）。顾如名，这是一个打印实用，帮助 Linux 成为打印服务器并允许
    Linux 与打印机通信。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_247_0.png)


    **Daemon（守护进程）**: 与菲利普·普尔曼和《黑暗物质》无关，而是一种在后台运行以处理特定计算机请求的特殊程序。


    **Debian**: 最早的 Linux 发行版之一。许多发行版都诞生于 Debian 的影子下。


    **Distro（发行版）**: distribution 的缩写，赋予 Linux 不同变体的名称。市面上有很多发行版，几乎不可能列全。这是你在 Linux
    世界中听到的最常用术语之一。


    **Emacs**: 一个 Linux 编辑器。


    **Fedora**: 由 Fedora 项目开发并由红帽支持的 Linux 发行版。Linus Torvalds 本人使用的 Linux 版本。


    **Fork（分支）**: 这是开源开发中一个既定的部分，一种源自 Unix 的技术，通过复制并修改一个进程来创建一个完全不同的进程。有时分叉会产生如此显著的区别。


    **FOSS**: Free and Open Source Software（自由开源软件）。它是“免费”与“软件”之间的一种折中，并且是开放修改的。


    **Gimp**: 为想要 Photoshop 替代品的用户提供的照片处理程序。


    **GitHub**: 一个用于软件的 Web 仓库。程序员在那里下载软件、进行修订并提供更改。


    **Gnome**: 一个图形桌面环境；是你启动计算机时出现在屏幕上的图标、小部件、文件夹和工具栏集合。这两个产品根源非常不同（尽管都源自 Unix 世界）；Gnome
    是作为一个项目开始的，而 KDE 设计的目标是尽可能高效。


    **GPL Licence**: 代表 General Public Licence（通用公共许可证）。严格来说，GPL 许可证已成为被接受的术语（就像我们谈论
    ATM 一样），指反向许可，任何修改都必须对其施加一套新的条件。


    **GNU Project**: 非常自由软件项目之一，由理查德·斯托曼启动。Linux 是在 GNU 许可证下发布的（尽管该项目本身不是）。


    **Grub**: 计算机启动时运行的程序名称。它是启动内核以准备运行计算机程序。


    **Kernel（内核）**: Linux 的核心。所有处理都发生在这里。发行版对内核有两种处理方法：一种是保持内核不变，另一种是按某种方式修改内核——例如
    Fedora 就是这样做。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_249_0.png)


    **KDE**: 另一个桌面环境；如果你不想使用 Gnome，KDE 是你的选项之一。


    **LAMP**: 代表 Linux, Apache, MySQL, PHP，一组用于网站开源组件。由于所有元素都是免费且开源的，它被网站开发者广泛使用，以避免任何的供应商锁定。


    **MySQL**: 一个开源关系型数据库系统。它最初由瑞典公司 MySQL AB 开发，但现在归 Oracle 所有。MySQL 最初在 GPL 条款下开发，广泛用于数据库驱动的网站，是
    LAMP 软件包中的元素之一。


    **LEAF（Linux 嵌入式设备防火墙）**: LEAF 是一种易于使用的嵌入式 Linux 系统，旨在为小型办公室、家庭办公和家庭自动化环境创建网络设备。


    **Open Source（开源）**: 任何对所有人开放、修改和随意摆弄的软件名称，区别于微软、苹果、Oracle 等公司拥有的专有代码。


    **LibreOffice**: （源自 OpenOffice，在其被分支之后。）Microsoft Office 的免费替代品，几乎提供了 Microsoft
    提供的所有功能——与 Office 的兼容性不是很好。


    **Windows**: 有点奇怪。这是一种 Linux 风格的操作系统，但看起来像 Windows（对于那些真的离不开它的用户）。陷阱在于它是专有的——所以根本完全不是
    Linux 风格。


    **Minix**: Unix 的一个分支，采用微内核架构。当 Linus Torvalds 开始编写该软件时，Linux 随诞生了。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_250_0.png)


    **Package manager（包管理器）**: 顾如名，这是一组协助用户安装和配置操作系统软件的工具包。虽然可以在不使用包管理器的情况下安装 Linux，但用户必须确保所有软件都是最新的，必须直接从源代码编译软件（不适合胆子小的人）并单独配置每个元素。换句话说，你将在
    Linux 上使用运行底层的几种包管理器。高级软件包工具（APT）被设计用于处理 Debian 系软件的安装和删除，而 DNF Yum（DNF）是 Fedora
    的默认包管理器。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_251_0.png)


    **RMS**: 理查德·斯托曼常用的别号。


    **PGP**: 代表 Pretty Good Privacy（良好的隐私）。这是一项由菲利普·齐尔曼开发的开源加密程序，作为保护电子邮件和文件的安全措施。


    **Root**: 是 Unix 时代的遗留物，但它从根本上实现了对系统的绝对控制。如果你回想你使用 Windows 的方式，你可以进行一些微不足道的更改（例如外观），这些更改对计算机的工作方式没有影响，但如果你想做一些基础性的操作，你需要管理员权限。Root
    就是这种权限在 Linux 中的等价物。


    '
