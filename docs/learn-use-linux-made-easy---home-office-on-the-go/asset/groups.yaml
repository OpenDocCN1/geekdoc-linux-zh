    # 主要供应商的优缺点


    如果你正在考虑在非技术人员的桌面上运行 Linux，这非常有吸引力——事实上，某些 PC 厂商将其作为 Windows 的替代方案出售。它在非 PC 设备中也越来越流行，例如手机和平板电脑。


    # ORACLE（甲骨文公司）


    Oracle Linux 并不是一个真正独立的 Linux 发行版，它实际上源自红帽企业级 Linux（RHEL）（尽管 Oracle 推出了自己所谓的“不可破坏的企业内核”，该内核声称比红帽的产品更优，且与之兼容）。Oracle
    决心要吞下世界，并将 RHEL 客户吸引到自己的产品中，这并不令人意外。公平地说，这并不是一个没有吸引力的提议，因为 Oracle Linux 免费下载和分发，你也可以选择付费的支持选项。


    下方：Oracle Linux 是免费的，但提供一个可选的支持选项，需要支付费用。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_66_0.png)


    # LINUX 生态系统


    如果你在寻找通用的、主流的 Linux，那么 Oracle Linux 并不是显而易见的选择。然而，如果你倾向于 Oracle 的应用程序产品，那么你可以考虑它，随着时间的推移，在他们的供应商原生操作系统上运行应用程序不可避免地会有性能优势。顺便一下，不要忘记这不仅意味着商业化的
    Oracle 应用程序——他们还拥有 MySQL 数据库应用等，该应用起源于开源世界。


    > 贴士

    > 如果你在使用亚马逊的云，为什么不考虑他们的 AMI Linux 呢？毕竟，你知道它是针对该平台进行了优化，并且经过了良好的测试。


    # 其他值得关注的发行


    我们提到的 Linux 供应商很少，但它们涵盖了全球绝大多数的 Linux 安装。不过，简要提到其他几个也是值得的。


    # AMI


    首先是亚马逊的 Linux AMI。正如你可能猜的那样，这是由亚马逊制作并维护的 Linux 变体。如果你打算使用 Amazon EC2 云服务器平台，这不无意料之地是一个很有吸引力的选择，因为你可以确保兼容性和性能。


    # Debian


    接下来是 Debian Linux。说实话，它本身已经不再是一个大足轻重的角色了。事实上，Debian 和 Ubuntu 之间有着非常紧密的关系，但目前受欢迎的是后者——主要是因为
    Canonical 提供的开发和支持支持。所以 Debian 远未灭亡，但人们倾向于选择 Ubuntu。


    # Android


    最后，让我们提到一个你可能没料到会读到的操作系统：Android。据估计，Android 在全球运行的设备比任何其他操作系统都多，人们很容易忘记它实际上是基于
    Linux 内核的。当然，Android 与之前讨论的那意义上的 Linux 发行版；它是一个为特定目的设计的非常紧密的组件集。标准的 Linux 发行版带有一套开发者工具，用于为
    Android 编写应用程序，你可以在另一台单独的 PC 上运行开发者工具。尽管如此，不要忘记 Android 的底层实际上是 Linux。


    # 那么，我该选哪一个？


    没有标准答案，但指导非常简单：如果你有特定的需求可以由某个商业产品满足（例如，Oracle 应用程序），那么就倾向于该产品。如果你正在寻找商业支持和 DIY
    的混合体，那么 Ubuntu 模式可能适合你。如果你想利用对非 Intel 处理器的支持，那么你可以根据你需要的支持的 CPU 去 Google（对于 SUSE
    来说，IBM 的 Power 系列是一个选项，如果你是一个全能型人才，那么很难不选择红帽）。


