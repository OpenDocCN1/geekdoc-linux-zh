    这是因为 Linux 机器可以推断出正在运行的安全机制，因此它不会询问你。


    > 小贴士

    > 如果你选择 WEP 作为无线安全方案，那等同于把你的前门换了一张湿透的纸。千万不要这样做。


    所使用的安全类型并非 Linux 机器决定，而是由托管网络的设备——你的路由器、无线扩展器或无线访问点决定。无论它配置为使用什么，你都可以在你的 Linux
    PC 上使用它。


    无线安全有一个简单的规则：永远、永远不要使用 WEP（有线等效隐私）。WEP 是一个非常、非常老的标准，尽管它的名字暗示它能让无线连接像有线连接一样安全（即通过以太网线连接的），但事实并非如此。技术（包括安全技术）一直在不断进步，WEP
    现在再也不被认为是安全的，因为使用现代计算机非常容易破解。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_200_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_201_0.png)


    # 安全密钥


    无线安全包含两个部分：身份验证和加密。身份验证部分用于检查你是否有权使用该网络。在企业环境中，可以使用高级技术来交换安全密钥，并根据公司的核心网络系统对你的计算机进行身份验证。但对于普通用户和小小型企业来说，这通常意味着使用某种密码（最好是难以被猜到的复杂密码）。


    加密部分旨在确保没有人能看到在你无线网络上流传输的数据。鉴于你正在使用无线电波在周围相当的范围内广播所有内容，因此对你发送的数据进行加密是明智的。


    # 设置无线


    你通常有三种身份验证选项：

    WEP、WPA（无线网络保护访问）和 WPA2。WPA2 是最新的，而且令人惊讶的是它最安全。


    > 小贴士

    > 如果你的路由器支持，带有 AES 加密的的 WPA2 是最佳选择。


    同样，数据加密有两种常见的选项：TKIP（临时性密钥完整性协议）和 AES（高级加密标准）。AES 被认为更安全。


    因此，在开始将你的 Linux 工作站连接到网络之前，请检查网络配置，如果你的设备支持，请将其切换到 WPA2 和 AES。如果不是如此，请不要惊讶：例如，我们的互联网服务提供商路由器不支持。如果是这种情况，请选择替代方案（不要碰
    WEP）。


    下方：WPA2 和 AES 是 WiFi 更安全的选项。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_202_0.png)


    # TELNET 和端口配置


    到为止，我们已经看了如何连接到网络。一旦连接，你就可以做所有显而易见的事情，如浏览以及连接家里或办公室其他计算机上的共享文件夹。但如果你想把 Linux 机器作为某种服务器呢？


    即使你打算在服务器上运行实时网站（有很多公司愿意收取少量费用为你托管网站），在自己的机器上开发内容也是很常见的，这样你可以在发送到托管中心的实时服务器之前，在内部机器上对其进行充分测试。这正是我们在编写关于
    Linux 的书籍时对处理的服务所做的事情。所以，让我们来看看它是如何工作的。


    # TCP


    TCP 是 IP 协议族的一部分。它代表传输控制协议（Transmission Control Protocol），被大多数提供某种网络服务的程序使用。它有一个姐妹协议叫
    UDP，即用户数据报协议（User Datagram Protocol），它稍微小众一点，但仍然相关，因为它被用于语音通话和流媒体视频——事实上还有我们之前讨论的
    DNS 服务（参见第 189 页）。不过，我们将主要关注 TCP。


    下方：`services` 文件列出了常见的 TCP 端口。


    ```

    services [Read-Only]

    # /etc/services:

    # $id: services,v 1.55 2013/04/14 ovasik Exp $\n

    # Network services, Internet style

    # IANA services: last updated 2013-04-10


    # 注意，IANA 目前的政策是为 TCP 和 UDP 分配同一个

    # 良知端口号；因此，这里的大多数条目都有两个，

    # 即使该协议不支持 UDP 操作。

    # 更新自 RFC 1700，“Assigned Numbers"... (1994年10月)。并非所有端口

    # 都列出，仅出最常见的。

    # 最新的 IANA 端口分配可以从此处获取

    # 良知端口是 0 到 1023。

    # 注册端口是 1024 到 49151。

    # 动态和私有端口是 49152 到 65535。

    # 每行描述一个，格式为：

    # service-name  port/protocol

    tcpmux          1/tcp

    tcpmux          1/udp

    rje             5/tcp

    rje             5/udp

    echo            7/tcp

    discard         9/tcp

    discard         9/udp

    systat          11/tcp

    systat          11/udp

    ```


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_203_0.png00dda504be4d70c6e7dd488ae0af42a_203_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_204_0.png)


    # TELNET 和端口配置

    # 205


    # TCP 端口的工作原理


    当客户端设备尝试建立连接时，请求包含两个部分。首先是显而易见的要尝试连接的系统的 IP 地址。其次是它想要连接的端口号，范围在 0 到 65535 之间。


    当像 Web 服务器这样的程序启动时，它会在网络链路上“监听”传入的连接。但技巧在于，软件会在特定的端口或端口上监听。想象你有一个有 65536 个扩展机的电话系统；你有相同数量的电话，并为每个电话标记了
    0 到 65535 的数字。任何一个电话都可能响铃，但你告诉 Web 服务器只接 80 号线，邮件服务器只接 25 号线。这就是 Linux 服务器软件完全发生的情况。


    # 良知端口


    0 到 1023 端口被称为良知端口，已分配给代码、通用功能：Web 服务器、电子邮件服务器、远程连接等。一些常用端口包括：


    - 22：SSH，安全外壳机制，允许你连接到 Linux 机器并使用命令行运行命令和程序。

    - 25：SMTP，简单邮件传输协议（基本上是互联网电子邮件）。

    - 53：DNS，域名系统服务。

    - 80：HTTP，超文本传输协议（Web 服务器）。

    - 109 和 110：POP，用于从服务器拉取电子邮箱。

    - 443：HTTPS，HTTP 的高安全版本。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_206_0.png)

    '
