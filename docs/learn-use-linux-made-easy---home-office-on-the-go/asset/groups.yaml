  mdcn: '


    SourceForge：另一个与 GitHub 类似的源码仓库。程序员共享代码资源的一种受认可的方式。


    Vi：Linux 用户最主要的文本编辑器之一。


    Wine：当你安装的许多程序出现问题时，你需要它。或者更通俗地说说，它是一种允许让你在 Linux 上运行 Windows 软件的程序。对于那些确实能想出替代常用
    Linux 应用程序的人来说，这是一个非常实用的工具。


    SSH：Secure Shell 是一种用于安全远程登录的 Linux 协议。


    Richard Stallman（理查德·斯托曼）：自由软件运动的泰斗，GNU 项目创始人，火种守护者。


    SUSE：一家德国公司，提供两个操作系统：openSUSE —— 一个免费的 Linux 桌面版本，以及 SUSE Linux Enterprise ——
    一项付费产品。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_252_0.png)


    Linus Torvalds（林纳斯·托瓦兹）：核心人物，整个这一切的始祖。还以界定“Linux 法则”（由 Eric Raymond 制定的表述）而闻名：“只要眼睛足够多，所有的
    Bug 都是浅的。”


    Ubuntu：最受欢迎的 Linux 发行版之一，基于 Debian，并由英国公司 Canonical 支持。


    Unix：这一切的祖父。Linux（通过某些更改）由此诞生的操作系统。许多服务于 Linux 的程序和实用工具都源自 Unix。


