    # 一种独特的替代方案


    尽管商业界正日益转向 Linux，但桌面市场却有所不同。同样的企业仍然在 Windows 上运行桌面系统（更不用说商业领域内手机和平板电脑的使用量日益增加），Linux
    不会获得太多的关注。


    假装你正在购买一种极其普及的操作系统是徒劳的。无论 Linux 以何种形式存在，其桌面市场的份额不到百分之三——不足以引起重大的波澜。但正如它的所有支持者所说说，你选择的是一个比微软和苹果对应品更丰富、更灵活、更安全且更高效的操作系统。而且，免费是另一个巨大的奖励。


    # 什么是 Linux？


    本书将介绍这些优势优势，并更详细地探讨 Linux 的优势之处以及它为何优于其商业竞争对手。


    # 不仅是一个，而是多个


    这里需要稍作一点解释：当我们说到“操作系统”时，我们的说法有一点不完全诚实。Linux 并不是一个操作系统，而是多个。Linux 基于单个内核，并有海量的其他组件与其内核进行切换，这些组件提供了许多不同的功能。


    本书将介绍一些主要的发行版（或 distros——distributions 的缩写）以及它们之间的区别。Linux 的美丽之处在于，与微软 Windows
    或 Mac OS 相，你得到的不是一个“一刀切”的软件软件包，而是一个可以根据你的特定需求进行调整的软件。如果你是 Linux 新手，你可能很想尝试 Ubuntu
    或 Mint（Mint 是 Ubuntu 的变体，就像 Ubuntu 是 Debian 的变体一样）。


    下方：Ubuntu，领先的 Linux 发行版之一。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_20_0.png)


    # Linux 的缺点


    关于 Linux 存在着一些争议。广为人知的 Linux 合同案例之一，是慕尼黑市在 2003 年决定从 Windows 切换到 Linux。他们开始将 4,000
    台桌面迁移到一个名为 LiMuk 的发行版，但情况并不完全符合预期，五年后，采用率仅为 20%。最终，目标桌面都完成了迁移，但正赶上副市宣布该市失败了，每个人都在推自己的喜好。这并非完全是个人喜好：有一些零散的例子显示某个产品在某个
    Linux 发行版无法运行，但在另一个上可以运行。这种情况并不经常发生，但确实存在细微的异常现象。


    # Linux 程序员


    Linux 是开放的，这提供了充足的讨论空间，这通常被视为操作系统的优势，但它也可能是一个缺点。可能会给出相互冲突的建议，并不总是容易从不想要的建议中筛选出有用的建议。还出现过这种情况，开发者偏离了对编程挑战很有趣但对用户并没实用的领域。微软和苹果等公司会要求他们的程序员去解决真实的用户挑战，以提供实用的功能（必须说，这并不总是成功的）。


    Linux 程序员可能可能对解决技术问题更感兴趣。


    但对于家庭用户来说，这些都是次要问题。对于大多数人来说，Linux 提供了一个新体验的世界，以及一个摆脱 Windows 局限的机会。


    > 小贴士

    > 被许多不同的发行版选项困扰了吗？你可以查看 Distrowatch 网站上的前 100 名：distrowatch.com


    # Linux 历史


    Linux 并非凭空出现，研究该软件是如何产生的很有用。这是因为历史影响了今天对该操作系统的认知，以及为什么某些本该对它产生同情的公司和个人会对 Linux
    产生意见。


    Linux 有一种哲学在驱动着：一种协作、共享的运动。这是对专有软件（如微软或苹果的软件）的反击。重要的一是，Linux 在这里并不是孤立的，这里还有许多类似的倡议——只是
    Linux 是可见度最高的一个。


    **下方：** GNU 操作系统是自由软件项目的早期示例之一。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_23_0.png)


    # 自由的 Unix！


    从现在开始我将编写一个完全兼容 Unix 的软件系统 GNU（GNU is Not Unix，即 GNU 不是 Unix），并免费提供给任何想要的人。时间、金钱、程序的贡献被视为同等对待。


    首先，Unix 将是一个内核加上所有编写和运行 C 程序的工具：编辑器、C 编译器、链接器、汇编器以及其他一些东西。之后，我们将添加一个文本格式化器：一个
    YACC、一个 Em 游戏、一个表格和其他东西。我们希望提供用户所需的一切以及他可能需要的任何其他东西，包括在线和纸质文档。


    GNU 将运行 Unix 程序，但与 Unix 相同。我们将根据方便的情况进行所有改进，基于


