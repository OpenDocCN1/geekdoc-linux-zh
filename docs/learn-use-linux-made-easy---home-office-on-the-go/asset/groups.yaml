    # Home Directory


    Every user ID on a Linux machine has a default home directory. If you''re a normal
    user, this will be a private directory, and so you can use a local config file
    in your home directory to specify any customizations you want. In the case of
    it three alternative files in your home directory:


    > Hot Tip Understand your start-up files, and which ones work with shells – otherwise
    you''ll be scratching your head over why something doesn''t seem to be working;
    only to find you''ve used the wrong file.


    ```

    .bash_profile

    .bash_login

    .profile

    ```


    It''ll look for the files in this order and will process only the first it comes
    across. The last of the three, .profile, is a kickback to the old sh days – it
    was the default name for personal config file. Note that if you use both sh and
    ksh (if you feel inclined), then it''s to add an entry to .bash_profile that references
    .profile, then to put your bash-only commands in .bash_profile and your sh-compatible
    commands in .profile. Sh will process the latter, and will process both.


