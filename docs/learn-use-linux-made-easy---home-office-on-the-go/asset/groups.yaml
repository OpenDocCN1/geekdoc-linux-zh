    # 分离启动盘和数据盘


    虽然你经常听到人们谈论他们的机器启动有多快，但这真的重要吗？如果是笔记本电脑，那可能确实很重要，因为你会频繁地启动和关机。另一方面，如果是台式机，也许并不重要；我们的
    iMac 大部分时间都是开启着的——它静静地坐在角落里，我们很少关闭它。


    你关心的是它运行程序和访问数据的速度。因此，如果你想优化运行速度，为什么不用一个小的机械硬盘作为启动盘，然后安装一个更大的 SSD 硬盘并将其用于程序和数据呢？


    一旦内核加载到内存，它就不需要对引导启动的磁盘进行任何主要访问，因此性能实际上并不是什么大问题。


    ### 小贴士

    把钱花在会被频繁访问的数据盘上，而不是只在启动时才用到的启动盘上。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_149_0.png)


    # 使用什么种存储设备


    ```

    root@sharpe-local:~$

    [root@sharpe-local ~] -a generate

    shell 0.4 2015-04-04 (x86_64-linux-gnu)

    Copyright (C) 2007-2015 Free Bash Project, Inc.

    Released under GNU GPL v3.


    --- START OF INFORMATION SECTION ---

    Model Family:Western Digital Blue HDD

    Serial Number:  WD-WAC671A7428

    With Device:1: SATA

    Firmware Version:  B1AD

    User Capacity:100020486880 bytes (931 GiB)

    Rotation Rate:7200 RPM

    Device Type:SATA

    ATA Version:3.0

    Local Time:2015-03-27 20:45:18

    SMART support:Enabled


    --- START OF READ SMART DATA SECTION ---

    SMART self-test result: PASSED


    General Smart:

    Offline selection status: passed data collection activity

    was never started.

    ```


    上面：`smartctl` 可以让你深入了解磁盘的细节。


    # RAID 数据盘


    我们讨论过备份的概念（见第 107 页），如果你读过那部分就会知道，重新安装操作系统通常比尝试修复它的各种奇怪问题要简单。因此，我们说过，重点应该放在备份你的数据上，因为你无法从标准镜像中恢复这些数据。为什么不使用
    RAID 呢？


    正如我们所说的，RAID 提供的可以让磁盘在不被中断的情况下工作。然而，在选择 RAID 适配器时需要稍微谨慎，因为你需要知道磁盘何时“坏掉”了。我们不会建议特定的控制器卡，因为选择取决于预算，而且极有可能在你输入这段文字到你读到它的这段时间内，某些型号已经被过时了。技巧是找到一些候选设备，然后仔细研究规格表（并咨询
    Google），以验证是否有 Linux 版本的管理工具，或者是否有标准的 Linux 命令（如 `smartctl`）可以对其进行查询。通常的建议是选择
    Adaptec 或 LSI 等主流厂商，因为对知名厂商的支持通常更好。


    # 更换磁盘


    大多数 RAID 适配器允许你使用不同的磁盘但仍然运行 RAID 1 配置。现在，你不会为了好玩而这样做——如果你在组装新电脑，你当然会买一个 RAID 适配器和两块相同的磁盘。但如果其中一块磁盘故障了，你极可能买不到完全相同的型号——磁盘会过时，新模型会不断出现。通常情况下，只要你更换的磁盘
    (a) 速度与坏掉的磁盘一样快，且 (b) 容量至少与故障单元一样大，适配器通常就能胜任。当然，你无法利用磁盘的所有空间，但这是你为了韧性而付出的代价。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_151_0.png)


    # 仅仅因为它仍在运行


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_152_0.png)


    廉价的 RAID 适配器通常需要你关机以更换故障单元——这并不是什么大问题，因为你至少可以选择一个低使用时段来进行。


    关于 RAID 适配器的最后一个说明：仅仅因为它们能从连接磁盘的死亡，并不意味着你可以在不关闭服务器的情况下更换磁盘。企业级服务器中昂贵的 RAID 控制器具有“热插拔”功能，你可以在服务器运行的同时拔出故障设备并推入新设备。小型服务器和台式机的廉价设备没有热插拔功能，所以你经常发现为了更换磁盘，必须关闭电源并更换组件。当然，你至少有自由选择一个系统未使用的时间来关机，而且如果你练练使用螺丝刀，这花不了多久。


    # 它是如何重建的？


    当你更换磁盘时，控制器会接手从工作磁盘复制数据的任务。这是一个自动过程，但取决于磁盘的大小和系统的速度，可能需要 15–20 分钟。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_152_0.png)


