    ### 大教堂与集市

    如果你想了解更多关于这些观点派的内容，非常好的入门书籍是埃里克·雷蒙德的《大教堂与集市》（*The Cathedral and the Bazaar*）。这本书区分了这两种方法。一种
    GNU 方式（大教堂），一小群开发者秘密合作，在项目结束时展示他们的成果；另一种 Linux 方式（集市），代码在公共场合开发，许多人对成功做出贡献。从这里，雷蒙德得出了林纳斯定律：“只要眼睛足够多，所有的漏洞都是浅显的”，或者换句话说，就是“人多力量大”。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_27_0.png)


    # LINUX 的发展


    那是自由软件运动的历史，现在是时候看看 Linux 本身是如何出现的了。虽然 Linux 的优势之一是贡献代码的人数之多，但这个操作系统是由一个男人独自开始的。一位年轻的芬兰程序员——名叫林纳斯·托瓦尔兹（Linus
    Torvalds），正在研究一种使用名为 MINIX 的程序的新方法，MINIX 是一个名为 Unix 的系统的精简版本，它将永远改变计算领域。


    # 林纳斯·托瓦尔兹


    1991 年，他向 Usenet 组发送了一篇著名的帖子，宣布他的新操作系统：


    > 大家好，使用 minix 的各位 - 我正在编写一个（免费的）操作系统（只是一个爱好，不会像 gnu 那样大而专业），用于 386(486) AT 隆机。这从四月就开始酝酿，正开始准备就绪。我想让大家对
    minix 中喜欢/不喜欢的地方提供任何反馈，因为我的操作系统在某些方面与其相似（由于实用原因，文件系统的物理布局相同）；


    剩下的，正如所说，都是历史了。那个帖子开启了计算的新篇章，导致了各种形式的 Linux 操作系统的出现。然而要注意，他最初选择的操作系统是 Freax（free
    和 Unix 的混合体）；Linux 这个名字实际上是由他的合作者 Ari Lemmke 设计的。该软件的第一个版本是专有的，但很快就在 GPL 下发布了


    # SLACKWARE 和 DEBIAN


    在早期，许多发行版（称为 distros）涌现，这使得用户能够采用 Linux。许多发行版已经消失，但两个留了下来：Slackware 和 Debian。后者是前驱（见第
    52 页）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_28_0.png)


    # 为什么选择 Linux？


    那是对 Linux 历史的简要回顾。了解背景并不能帮助你运行操作系统，但它有助于理解为什么。选择 Linux 的主要原因有哪些？


    有许多用户转向该操作系统，我们列出了其中一些。它们没有特定的顺序；对一个人的主要原因对另一个人可能无效。


    # 没有臃肿软件


    记得你买电脑时吗？你可能必须在一堆不需要的程序中挑选，如果你是从大型商店购买的机器的话。你那里有一包游戏。你可以通过卸载来删除这些程序，但这有点麻烦。通过选择
    Linux，你消除了这些问题——没有试用期结束的危险，也绝没有任何服务的订阅请求。在 Linux 中，所见即所得。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_29_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_30_0.png)


    ## 病毒问题


    大多数使用过 Windows 机器的人在某个时候都经历过病毒攻击（即使你自己没有受到影响，你可能也为别人修复过机器）。病毒的创建非常容易，而且极易感染电脑：你不应该点击的那个链接；你不应该插入的那个
    CD；你不应该运行的程序——这些都会带来它们自己的问题。


    ### Linux 是没有病毒的


    苹果用户也别自得意地认为你的机器免受攻击：Mac 也会感染病毒。事实上，如果你真的想避免电脑上出现任何形式的恶意软件，Linux 是唯一的选择。


    > 小贴士

    > 如果你一直在与病毒、恶意软件斗争，或者只是经常遇到经常崩溃，Linux 可能适合你。它是最稳定的操作系统。


    理论上，Linux 病毒是可能的，但正如前面提到的，有更多的眼睛在观察 Linux 软件。漏洞和缺陷会被更早发现，修复得也更快。


    '
