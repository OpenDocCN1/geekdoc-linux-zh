  - '[PAGE 245]


    In some cases, Linux can be quite forgiving. For example, one might think that
    if you connect

    to the machine using SSH and then stop the SSH server process, it''ll throw you
    out, but that''s

    not the case:


    ```

    [root@dc-linux ~]# systemctl stop sshd

    [root@dc-linux ~]# ls

    anacaconda-ks.cfg Desktop Documents Downloads initial-setup-

    ks.cfg Music Pictures

    ```


    Here, we''ve killed off the SSH server, but it lets our session continue. If we
    disconnect and try

    to reconnect though, it''ll refuse our connection as expected:


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_245_0.png)'
  - '[PAGE 246]


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_246_0.png)


    # Hot Tip


    If your Linux graphical desktop freezes the best thing to do is change to a console
    by pressing Ctrl + Alt + F2. This will allow you to login from the console and
    find what froze your desktop.


    ```

    [root@dc-linux ~]# exit

    [dsc-dc-linux ~]$ exit

    Connection to 192.168.1.186 closed.

    DCPro:~ davidcartwright$ ssh dsc@192.168.1.186

    ssh: connect to host 192.168.1.186 port 22: Connection refused

    DCPro:~ davidcartwright$

    ```


    With other configuration items, though you may not be so lucky. Be extremely cautious,
    then, when you reconfiguring the system from afar. Keep an open connection sitting
    there just in case, and have a fallback means of getting to the console if it''s
    located somewhere distant, because we''ve all seen off the branch we''ve been
    sitting on at some point in our careers.'
