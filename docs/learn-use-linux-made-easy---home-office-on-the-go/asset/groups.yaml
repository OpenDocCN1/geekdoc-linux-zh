  - '[PAGE 136]


    # Power


    First there''re the processor. We''ve discussed the different processor families,
    but here we''re talking about building a PC so we''re talking Intel or AMD processors.
    When it comes to the choice between a 32-bit and a 64-bit processor we always
    go 64-bit; the cost differential is negligible and as far as Linux is concerned
    there''s absolutely no worry with it working as well on a 64-bit platform as on
    a 32-bit one.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_136_0.png)


    # Memory


    Then we have on-board memory, and the answer is simple: as much as you can afford.
    Our lab laptop came with 8GB of RAM as standard, which is fine for what we need;
    if you''re building a desktop why not start with 16GB? The main rule we follow
    is to leave RAM slots free for future expansion, so if you have four slots and
    you want 16GB use two 8GB modules instead of four 4GB ones.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_136_1.png)


    # Connection


    Next is the network adaptor, and as you''ll see shortly when we discuss networking,
    the only sensible option is Gigabit Ethernet. Motherboards come with on-board
    Gigabit Ethernet as standard.


    When we''re on motherboards, you''ll find that the standard ones you can get with
    SATA connections on-board; this is fine for a home-built desktop, and we''ll explain
    a bit of what SATA is all about shortly in the section on storage, along with
    some advice on what disks to choose.'
  - '[PAGE 137]


    # Other Bits of Kit


    You''ll also need a case and a power supply, but these are ten a penny. You can
    buy all kinds of funky cases for a home-build desktop, and all you need to remember
    is to decide how many internal hard disks you want and buy a case that''s big
    enough to hold them.


    > Hot Tip If you''re self-building, get a motherboard/CPU package – it’s so much
    easier than trying to comprehend which processor works with which motherboard.


    The trickiest bit of building your own PC is matching the CPU with the motherboard
    – the sheets can be a bewildering series of socket types and such like. We tend
    to sidestep this by buying a kit that includes the motherboard and processor in
    a single box: you can get a kit for as little as about £160/$251, though, of course,
    the sky’s the limit (£470/$739 for an Intel i5 on a motherboard with 8GB RAM,
    anyone?


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_137_0.png)'
  - '[PAGE 138]


    # A SERVER IN YOUR COMPANY''S OFFICE


    What do you do if you want a server for the office to run as a fileserver, or
    an email server, or a web server? Simple. Simple. Let''s take an example of an
    entry-level, mainstream server – single processor, single 1TB hard disk and 8GB
    RAM. With Windows Server 2012, this comes in at £1,899/$2,988. Hang on though:
    if we decide to go for Red Hat Enterprise Linux, it actually goes up to £2,016/$3,172.
    And for SUSE, it''s £2,102/$3,307.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_138_0.png)


    Makes Linux sound a little unattractive. Then, of course, as we''ve seen you don''t
    have to use a commercial version of Linux if you''re reasonably confident that
    you can look after the system yourself, or perhaps that you can engage a support
    partner to do it for you. Because if we check the price of the same server the
    price of the box comes down to a mere £1,252/$1,969.'
  - '[PAGE 139]


    This isn''t a big saving on a single box, but if you have two or three servers,
    it starts to add up. And this is our experience in small businesses – it starts
    with one or two machines and grows to perhaps four or five. The saving is tangible
    and can make a genuine difference. And even if you decide that you will go with
    at least some Windows servers (not a silly thing to do if you want to use native
    Directory support, for example), then there''s nothing to stop you from integrating
    Linux servers into Active Directory so that the two platforms work in harmony.


    > Hot Tip

    Linux support is more expensive than the commercial price of Windows, but you''re
    getting more for your money in terms of live support from real technicians.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_139_0.png)'
  - '[PAGE 140]


    # Comparing Costs


    Remember that in comparing the Windows and Linux costs, you''re not really comparing
    like for like; the commercial Linux give you not only the operating system and
    the ability to run updates, but also a variety of support such as helplines (Red
    Hat''s standard support model gives you phone and web support for unlimited cases,
    for example). So although it''s pricier, you get more for your money, even if
    you could have a self-serve option for free.


    # LINUX ON VIRTUAL MACHINES


    As a final note in this section about running Linux in a small office, let''s
    not forget the idea of virtual servers. This is where you use one or two fairly
    physical servers and a number of virtual servers – software-based servers that
    appear to everything on the network just like a physical machine but which share
    the resources of the physical kit they''re sitting on. Virtualization is most
    definitely the order of the day even in many smallish companies, because it lets
    you separate functionality between separate virtual servers, whilst letting them
    share the hardware of the physical kit as efficiently as possible.


    And, of course, every virtual server needs an operating system. If you spin up
    a Windows-based virtual server, then that''ll cost you a Windows licence, but
    if you spin up a Linux one – specifically one of the free distros – then it won''t
    cost an extra bean. Linux is brilliant for test, development and staging servers
    in a virtual setup, you can run as many machines as you wish without spending
    any money.


    # WHAT TO CONNECT IT TO


    When you''re looking at the kit you''re going to install Linux on, you also need
    to consider what you''re connecting it to – the other devices on the network that
    you might want to use for file sharing, probably a printer and almost certainly
    an internet connection. We''ve talked about how to set up the network connectivity
    of Linux, but what about the network infrastructure itself?'
  - '[PAGE 141]


    # Hot Tip


    If your PC isn''t going to move, use wired networking – it''s faster than wireless
    and it''s dead cheap.


    # Ethernet Networking


    The first rule is that if you''re using machines that aren''t going to move very
    much (a Linux desktop, for instance), then use Ethernet networking – that is,
    use cables rather than wireless. WiFi is brilliant for portable devices, but if
    your device isn''t portable, why not use a cable? Use Gigabit Ethernet: all new
    PC equipment will have a Gigabit port, and you can get a basic eight-port Gigabit
    network switch to connect it all to for about £20/$31, so there''s no reason not
    to.


    # Wireless Networking


    You''re almost certain to use wireless networking for portable devices, of course,
    which may mean a Linux-based laptop. Make sure you turn on the best authentication
    and encryption options (WPA2 with AES encryption is the favourite), and make the
    shared key very cryptic so nobody can guess it. If you have a small number of
    devices, why not use your router''s capability (and we bet it


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_141_0.png)


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_141_1.png)'
