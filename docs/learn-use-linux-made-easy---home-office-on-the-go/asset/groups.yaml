    So the mainstream Linux distros we''ve discussed here are what you call general
    purpose: they take a few hundred megabytes or a few gigabytes on your hard disk,
    which is fine you probably have a decent processor and a few hundred gigabytes
    of hard disk space. But what if you''re limited? The huge popular Raspberry Pi,
    which started life with 256MB of onboard memory and relied on an SD card for its
    disk storage in the days when 16GB was considered quite big for an SD card. One
    of the references we used when researching this section had the onboard


    > Above: Small Linux is a functional distro, despite its size.


    memory requirement for a basic installation of anywhere between 16MB (no surprise
    for the Damn Small Linux distro) and 1GB (for the likes of Fedora).


    # PROCESSOR PLATFORM


    Last and by no means, we have processor support as the key differentiator between
    distros. If you''re based on Intel-style processors (x86 or x86-64), then you''re
    suited for choice – though not for a moment that all Linuxes support these processors,
    as Yellow Dog with their PowerPC-based Macs will attest. Of the non-Intel processors,
    the ARM architecture is supported by a range of devices, and as well as Yellow
    Dog, those PowerPC'
  - '[PAGE 132]


    friends of ours also have a fair range of options. Beyond these, you''re into
    pretty specialist processor architectures. You can run Debian or Fedora on your
    IBM s390x processor, for example, or if you have a MIPS architecture, your choices
    include Debian and Parabola. Why do you care it? Well, if you have a multi-platform
    installation that you want to modify, there''s something to be said for running
    different flavours of the same distro on the variety of kit.


    # Gentoo Linux


    There''s one distro we''ve not touched on yet, incidentally, and that''s because
    it''s bonkers and deserves a special mention all of its own. We just checked the
    download page for Gentoo Linux and it gave us the choice of x86, x86-64, Alpha,
    ARM, HPPA, IA-64, PowerPC, s390, SuperH and SPARC. Oh, and a MIPS version that''s
    labelled ''experimental''. Linux distros don''t get any cross-platform than that.


    > ### Hot Tip

    You probably don''t have an IBM mainframe in your shed, so one of the x86 or x86-64
    ones will be good enough.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_132_0.png)'
  - '[PAGE 133]


    # WHAT HARDWARE TO USE


    If you''re going to run Linux, you''ll need something to run it on. For now, we''ll
    assume that you''re going to be using a real, live, physical computer of some
    description (Linux on Cloud services like Amazon Web Services is great, but not
    what we''re here to talk about). The great thing with modern Linux implementations
    is that the range of hardware they support is vast – so you have a range of options,
    from PCs you''ve put together in your shed up to high-performance commercial machines.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_133_0.png)


    # INTEL VERSUS OTHER PROCESSORS


    Those of us who are old enough to remember will recall that Windows was once more
    than just an operating system for Intel processors. Windows was also available
    for the DEC Alpha processor, and in fact, we''ve seen it with our own eyes. Similarly,
    Sun''s Solaris isn''t just compatible with Sun''s own SPARC processors, but also
    has x86 and x86-64 support (and, of course, its ancestors in the SunOS days supported
    the 68000-series processor family and the PowerPC processor was supported in one
    short-lived version).'
  - '[PAGE 134]


    # WHAT HARDWARE TO USE 133


    | Distribution | x86 | x86-64 | IA64 | POWER | SPARC | ARM | MIPS | SH | IBM MAINFRAME
    | ALPHA |

    |---|---|---|---|---|---|---|---|---|---||

    | CentOS | | Yes | | | | | | | |

    | Debian | Yes | Yes | | Yes | | Yes | | | | |

    | Fedora | Yes | Yes | | | | Yes | | | | |

    | Gentoo | Yes | Yes | Yes | Yes | Yes | | | Yes | Yes | Yes |

    | openSUSE | Yes | Yes | | | | | | | | |

    | Oracle Linux | Yes | Yes | | | | | | | | |

    | Red Hat Enterprise Linux | | Yes | | Yes | | | | | Yes | |

    | Slackware | Yes | Yes | | | | | | | | |

    | SUSE Linux Enterprise Server | Yes | Yes | Yes | Yes | | | | | Yes | |

    | Ubuntu | Yes | Yes | | Yes | | Yes | | | | |

    | Yellow Dog Linux | | | Yes | | | | | | | |


    # CPU Technology

    One of the amazing facts about Linux though, is that it doesn''t support two or
    three processor families but a ridiculous list of CPU technology. Of course we
    start with the obvious x86 and x86-64 architectures, but also PowerPC (things
    like the IBM RS/6000) and IBM''s Power processor. Then there''s the ARM processor,
    which makes it a super choice for an embedded operating system if you''re building
    a small ARM-based device and you want to run custom software on it. Going up the
    scale though, it also supports big systems such as IBM''s S/390 and z mainframe
    architectures.


    # Which Processor?

    See the table above showing which distros support which processors. It includes
    the processors for which mainframe versions are available; for instance, Fedora
    has ''secondary'' versions for the likes of MIPS, but they''re not included as
    these versions aren''t guaranteed to make the release at release time.'
  - '[PAGE 135]


    # Factors to Consider


    The thing is, you won''t decide to use Linux and then go on to decide on the platform
    you want to run it on. The choice of a hardware platform or an operating system
    is seldom isolated decision, instead you select them as a pair.


    Let''s take an example. Say you''re a corporate looking to run a large database
    system and you''ve decided that Oracle is the database package you want to use.
    You have a variety of choices: you could use SPARC bit (which is of course Oracle-owned)
    running Solaris, or you could use Intel-based kit running Windows, or you could
    go for a favourite Intel-based server provider (HP, perhaps, or Dell) running
    Oracle Linux and sit Oracle''s database on top.


    > Hot Tip

    Unless you have a particular reason to use some other wacky architecture, we''d
    go with x86-64 as the platform of choice - it''s popular and cheap. Don''t bother
    with 32-bit x86 if you can help it.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_135_0.png)


    # SELF-BUILT DESKTOPS?


    Those who build their own desktops tend to install Linux on them, for a simple
    reason - it''s free. The alternative would be to install Microsoft Windows, but
    of course that''s expensive. Few years ago we built a desktop for £254/£394, when
    you consider that a Windows licence is £80/£124 on top of this, Linux is an attractive
    option. What do you need to consider when you''re building your own machine?


    Above: It''s best to pick a processor, unless you have very specific requirements.'
