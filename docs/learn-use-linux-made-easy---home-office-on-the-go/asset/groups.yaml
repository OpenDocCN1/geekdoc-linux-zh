    # SLACKWARE AND DEBIAN


    In its early days, Linux was offered to us as a pair of floppy disks, with the
    kernel, the other with a set of GNU tools. But the software was not intuitive
    and so an ecosystem of distributions (better known as distros) sprang up, which
    enabled users to adopt Linux more easily. Many of the early distros have fallen
    by the wayside, but two of the early remain: Slack and Debian. The latter is the
    precursor of many today''s distros and a whole load more have since emerged to
