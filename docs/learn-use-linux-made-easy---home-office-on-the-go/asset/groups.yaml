    # ## THE VIRUS PROBLEM


    Most people who have used Windows machines have experienced a virus attack at
    some point (and if you haven''t been affected yourself, you may have well had
    to fix a machine for someone who has been). Viruses are so easy to create and
    can all too easily infect PCs: that link you shouldn''t have clicked on; that
    CD you shouldn''t have inserted; that program you shouldn''t have run – all of
    these can bring their own problems.


    # ### Linux is Virus Free


    And don''t you Apple users get smug and think that your machine is safe from attack:
    Mac gets viruses too. In fact, if you really want to avoid any form of malware
    on your PC, Linux is the only way to go.


    > > Hot Tip

    If you''re constantly battling viruses, malware, or simply a slow computer that
    crashes a lot, Linux might be for you. It is the most stable operating system.


    In theory, it''s feasible for there to be Linux virus but, as detailed earlier,
    there are many more eyes looking over Linux software. Vulnerabilities and weaknesses
    are spotted earlier and flaws are fixed more quickly.'
