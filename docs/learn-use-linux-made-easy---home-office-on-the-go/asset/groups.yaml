    # STAYING SAFE ONLINE


    Linux has a reputation for being an incredibly secure operating system. But what
    makes it so? What does Linux have that, say, Windows or MacOS doesn''t? Particularly
    given that MacOS is a flavour of Unix not unlike Linux anyway.


    Well, first is the basic security model. Where operating systems such as the Windows
    family allow you to provide a given user ID with permissions ranging from nothing
    to everything (including whatever variant you wish in between), Linux doesn''t.
    You''re either the super-user (''root'') or you''re not, and no matter what wacky
    permissions you give people, they simply can''t do high-privilege actions unless
    they become root. Secondly, the writers of malware and viruses tend to concentrate
    on the more popular platforms (primarily Windows), because the more popular the
    platform, the more likely they''re going to be infect someone''s system.


    Don''t think for a moment though, that Linux can''t be made insecure because it
    can. It''s a powerful operating system and as such it''s perfectly possible to
    configure it so that, for example, a normal user can execute a program as root.
    But you have to be (a) the root user in order to do this, as well as, (b) a bit
    naive. Similarly, there have been virus-like malware programs for Unix-style operating
    systems over the years too – even back as far as 1988, when the ''Morris worm''
    became the first internet virus when it exploited security vulnerabilities in
    some Unix implementations.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_155_0.png)'
  - '[PAGE 156]


    # KEEPING LINUX SECURE


    But although Linux can be made insecure, it''s generally very secure – so let''s
    talk about why that is and how you can keep it that way. There are two sides to
    security: making sure your machine isn''t available for people to connect randomly
    into and wander about your files; and being sensible about what you do online.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_156_0.png)


    # NAT AND THE NETWORK YOUR MACHINE SITS ON


    The chances are that your Linux machine is sitting on a home or small office network,
    and that it''s accessing the internet in the same way as, say, Windows PCs, tablet
    computers and smartphones. This generally means that you have a router that allocates
    your computer IP address and performs what''s called Network Address Translation
    (NAT) when you want to browse to a website out there in the big wide world.


    > Hot Tip

    The average home or small office network has NAT even if you didn''t realize it.
    It''s well worth understanding, as it helps comprehend how your network works
    at all.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_156_1.png)'
  - '[PAGE 157]


    # Private IP Addresses


    To understand NAT, you need to understand the concept of a private IP address.
    And to be honest, the clue is in the word ''private''. The internet has a concept
    called Request For Comments (RFC), which is a badly chosen name because the various
    documents are regarded pretty much as standards even if they''re not labelled
    as such. Now, RFC1918 (check out https://tools.ietf.org/html/rfc1918) is called
    Address Allocation for Private Networks, and tells us that there are some address
    ranges that are considered private:


    +   - 10.0.0.0 – 10.255.255.255

    - 172.16.0.0 – 172.31.255.255

    - 192.168.0.0 – 192.168.255.255


    # Outbound Connections


    The trick with private IP addresses is that the routers by your ISP won''t route
    traffic to or from these addresses, which means that nobody can make a connection
    from the internet into your Linux machine if it has one of these addresses.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_157_0.png)


    The trouble is, of course, that this will also stop making outbound connections,
    because the internet won''t know how to route the reply back to your machine.
    This is where NAT comes in, because what happens:


    +   - The PC, with its private address, makes an outbound connection, which lands
    at the router.

    - The router, whose internet port has a public IP address that the internet can
    route to, takes note of the connection from a PC and does some funky translation
    to the remote server sees the connection as coming from the router''s public address.'
