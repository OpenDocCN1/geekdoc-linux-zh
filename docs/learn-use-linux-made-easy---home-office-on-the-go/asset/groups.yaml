    # LINUX DOWNSIDES


    There have been some controversies surrounding Linux. One of the most widely heralded
    Linux contracts was when the City of Munich decided to switch from Windows to
    Linux back in 2003. It started to move 4,000 desktops to a distro LiMuk, but things
    didn''t quite work out as expected, and five years later, there''d only an adoption
    rate of 20 cent. Eventually, the target desktops were all migrated, just in time
    for the deputy mayor to announce that the city was thinking of switching back
    to Microsoft.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_21_0.png)


    There were two issues at the heart of this decision. One of these was the cost
    of supporting Linux. As mentioned earlier, it''s a bit of a shortage of skilled
    Linux developers at the moment, so working with Linux is a lot more expensive
    than working with Microsoft. It''s true that all the major Linux vendors will
    offer in-house support – and there are vast forums to call on – if you need hardcore
    Linux technicians, they are going to be more expensive than Microsoft counterparts.


    # Compatability


    The other problem with the Linux implementation in Munich was the lack of operability
    with existing Microsoft programs, both within the city and with other German local
    authorities. It should be stressed that, as yet, there''s no decision as to whether
    Linux will be ditched,'
