    Linux 与其他系统相处很好。它承认 Windows 和 Mac OS X 有自己的位置，并会与它们并排安装、共享文件，并且通常对它们非常友善。这与 Windows
    的观点非常不同，Windows 认为双系统启动意味着在 Windows 7 和 Vista 之间进行选择。


    对于许多 Linux 用户来说，Windows 是必不可少的——也许是为了某个特定的游戏，也许是为了为了与业务系统进行互操作。在这种情况下，双系统启动不仅是一个选项，更是必选项。


    > 下文：Linux 运行在各种硬件平台上，包括许多卫星导航仪上。


    > 小贴士

    > 如果你正在考虑双系统启动 Windows 和 Linux，最好为 Linux 准备一块独立的硬盘并留出未分配空间。否则，你将需要调整 Windows 分区。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_37_0.png)


    作为此的副产品，我们还应该注意到，Linux 非常乐意运行在各种硬件平台上。我们已经看到它是如何成为从 Tivo 盒子到卫星导航套件等各种设备的核心，但它也可以被任何
    PC 或笔记本电脑使用，包括流行的树莓派机器。在商业领域，Linux 可以部署在任何芯片架构上——从英特尔家族到 SPARC 和 IBM Power。关于这一点稍后会有介绍。


    # Linux 的局限性


    值得指出的是，Linux 其实没有什么是做不到的：只是体验不会像 Windows 或苹果的 iOS 那样流畅。你可以在 Linux 上完成你在这些系统上能做的任何事情——只是需要进行一些折腾和搜索。不要让这让你望而却步，因为那是使用
    Linux 的乐趣的一半。


    # 可操作性


    Linux 与其他软件具有良好的互操作性。但并不意味着每一个 Linux 发行版都能运行所有编写过的每一段软件。即使是最热衷的 Linux 用户也会承认，有时某个特定的发行版在尝试运行异源程序时会闹情绪。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_38_0.png)


    正如我们在第 20 页看到的慕尼黑市案例所示，困扰 Linux 商业实施的因素之一是某些 Linux 发行版无法与微软软件协作，考虑到微软在商业领域的主导地位，这是一个相当大的污点。


    # 软件可用性


    我们提到过，有免费（或有时是付费的）软件可以取代现有的许多商业软件包。这在某种程度上是真实的，但你得到的是等效替换。例如，GIMP 是 Photoshop
    的一个极佳的免费替代品，可以完成后者约 99% 的功能，但 GIMP 存在明显的差距。例如，它不提供 CMYK 选项（对于任何寻求专业用途的软件包来说，都是商业上的自杀）。Photoshop
    还拥有更丰富的生态系统，提供了一系列工具和插件，让专业设计师或艺术编辑师的生活更加轻松。


    > 下文：曾经，运行 PC 意味着要仔细观察这些。


    而且不仅仅是 Photoshop。还有许多 Windows 或 Mac 程序提供了更复杂的用户体验。对于家庭用户或狂热的业余爱好者来说，有许多替代品，但硬核专业人士需要更多。


    # 缺乏图形用户界面 (GUI)


    使用 Windows 或 Mac 的人都有易于使用的图形用户界面（GUI）来帮助他们操作操作系统。GUI 自从以来一直是苹果的一部分，但（这现在很难想象）Windows
    直到 20 世纪 90 年代初才开始使用 GUI。在此之前使用微软系统必须学习大量的 DOS 命令。这并不直观。


