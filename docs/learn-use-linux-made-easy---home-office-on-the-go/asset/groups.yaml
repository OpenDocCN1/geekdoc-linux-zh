    # 编写脚本


    当谈到 shell 命令时，你可以完成非常强大的操作。我们在这里只是触皮一角，但你可以编写调用其他脚本并进行复杂交互的脚本——从文件中读取数据、将输出写入文件，并使用变量进行计算和字符串处理。Shell
    唯一的缺点是如果你习惯了一种类型并被迫使用另一种，那么需要一些学习，因为正如我们所看到的，它们的语法确实有所不同。所以，如果我们尝试用 bash 运行上面的
