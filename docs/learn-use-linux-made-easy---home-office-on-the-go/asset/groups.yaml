    # Google Drive


    You can still use Cloud storage systems that don''t have a Linux version. Let''s
    take Google Drive as an example. On Windows and Mac you can automatically sync
    files between your local disk and the remote copy, as there''s a desktop application
    for each of these platforms. On Linux you can''t do that. What you can do, however,
    is use the service via the web browser. Although files don''t automatically sync,
    you can at least download them easily to the local disk to work on them, then
    re-upload them by simply dragging them to the web browser windows.


    # SOME STUFF ISN''T PACKAGED


    We''ve mentioned previously that some software isn''t packaged and you ought to
    try to avoid it. Sometimes, though, it''s so useful that you want to make the
    effort.


    Happily, unpacked software isn''t always an utter nightmare to install. If you''re
    downloading the source code and compiling it yourself, this can be fraught with
    incomprehensible error messages and complaints from the compiler that one or more
    required components are missing so it can''t continue. But in other cases, you
    find that the software provider has done lot of the work for you. For instance,
    if you want to use the OpenOffice application suite, you download a bundle of
    package files from the producer''s website and follow a relatively straightforward
    ''read me'' instruction file to install the components.


    > Hot Tip

