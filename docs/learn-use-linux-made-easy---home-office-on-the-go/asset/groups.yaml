    # 关于 shell 的重点


    使用哪种 shell 实际上并不重要。事实上，功能在很大程度上是相同的，尽管在 csh 系和 sh 系之间在命令和语法上存在一些细微差别和显著差异。在编写脚本方面，除非你是个火箭科学家，否则你在一个
    shell 中能做的事情，在另一个 shell 中几乎都能做到。


    你应该选择哪一个？如果你是初学者，那么 sh 系（主要是 bash）是明智的选择。毕竟 sh 风格的 shell 已经吸收了 csh 系的大多数酷功能，而且考虑到所有的启动脚本都是基于
    sh 的，所以当你开始学习 Linux shell 时，这是明智之流的选择。


