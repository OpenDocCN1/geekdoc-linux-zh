    # 我们的选择


    对于我们的测试机，我们正在下载 Fedora——特别是 release 22。它于 2015 年 5 月发布——在写作时它已经发布几个月了。对于不运行关键应用程序的
    Linux 机器，这是我们会考虑的最小年龄。如果你是为了业务稳定性，可能会选择上一个版本，因为它会有更多的错误修复。对于 Fedora 来说，release
    21 发布了七个月了，正合适。但为了我们的目的，我们将坚持 release 22。


    # 获取安装程序


    第一步：前往 www.getfedora.org Fedora 首页。顺便的是我们在运行 Windows 8.1 的 PC 上下载。


    > 下方：Fedora 首页非常易用。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_85_0.png)


    有三个选项：Workstation、Server 和 Cloud——在这个例子中我们将选择 Workstation。


    有一个很大的、友好的“立即下载”链接，让我们点击它。我们进入了一个可以选择特定安装程序的页面。确定 64 位 1.3GB 的 Live 镜像可能是我们要的，它就在页面顶部的“下载”按钮旁边。


    如果你看右侧，你会看到其他替代方案。有一个 32 位 Live 镜像，以及两个“netinstall”镜像——一个 32 位一个 64 位。由于我们使用的机器确实是
    64 位 PC，且我们使用 Live 镜像，只需点击“下载”。在我们的网络下，下载大约需要 20 分钟，所以不需要太久。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_86_0.png)


    > 小贴士：确保你选择了正确的版本


    # LiveUSB


    现在我们需要一个将 Fedora 安装程序的 ISO 镜像写入优盘的程序。推荐的方法是使用 LiveUSB Creator，这是一个你可以从网上下载的免费工具：fedorahost.org/liveusb-creator


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_86_0.png)


    上方：这个 LiveUSB Creator 将 Fedora 安装程序放在 USB 盘中。


    # 制作启动盘


    1. 我们要的第一件事是确保它是空的。插入 USB 盘并打开“计算机”工具（见下方）。


    2. 在“设备”下找到 USB 盘（见下方）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_87_0.png)


    右键点击并选择“格式化”。我们将 FAT32 作为文件系统，卷标为 Fedora。


    3. 一旦我们点击“开始”并确认我们确实想要格式化设备，只需要几秒钟。


    # 下载你选择的发行版


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_88_0.png)


    # LiveUSB


    liveusb-creator 是一个跨平台工具，用于在 USB 驱动器上轻松安装操作系统。


    # 特性


    - 在 Windows 和 Linux 中运行

    - 完全非破坏性安装。无需处理对 USB 的格式化或分区

    - 支持“破坏性”安装方法，使用 dd 直接将 ISO 复制到驱动器。这会覆盖所有数据和分区。这种方法启动更可靠，且全自动。

    - 支持自动下载 Fedora 版本，以及 Sugar on a Stick！

    - 持久性存储创建。这允许你在 USB 盘上分配额外空间，以便在重启后保留对 的更改。这本质上让你随身携带自己的 Fedora。

    - 已知版本的校验和，以确保你下载了正确的文件

    - 多语言翻译


    # 证言


    “作为一名非 Linux 用户，Live-USB Creator 改进了……”


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_88_1.png)


    上方：这个 LiveUSB Creator 将 Fedora 安装程序放在 USB 盘中。


    4. 向下滚动，Windows 版本的链接在那里。大约是 12MB 的下载，所以不需要很长时间。该文件是 Windows 安装程序，所以打开它。点击下一步（见右侧）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_88_2.png)


    上方：一旦打开安装程序，就会出现此页面。


