    24/7 呼叫中心的企业级远程协助。


    # 你可以以什么形式获得它们？


    我们的第一次 Linux 安装——第 27 页的 Slackware——是来自互联网下载的，我们把它写在了一叠软磁盘上。在这方面，Linux 按照它本该的方式开始了。直到今天，大多数
    Linux 安装的起点仍然是从网站下载。这包括了商业版：RHEL 是一个可下载的产品，只要你拥有活跃的订阅并因此可以登录支持门户；同样，SUSE 的在线商店在产品页的“库存状态”列中告诉我们，它是电子下载。


    同样，当你去在线零售商处购买时，你买的产品是装有 CD 和说明书的盒子，但对于在线订阅——你只会收到一些晦懂的代码，你可以通过访问供应商网站进行注册。既然在下一个版本发布后，有这么多
    DVD 和说明书最终会变成垃圾填埋场或回收桶里的垃圾，供应商为什么要费心去打印 DVD 和说明书呢？


    > 小贴士

    > 我们从不费心于 CD 或 DVD 发行版——一个 USB 闪盘和良好的互联网连接对我们来说就足够了。


    下方：你可以从各自的网站下载许多不同的发行版。这是 Ubuntu 的下载页面。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_118_0.png)


    有基于 CD 的 Linux 版本，通常由第三方制作，而不是 Linux 发行版本身。因此，亚马逊美国站会以 9.99 美元卖给你一张 Linux Mint
    CD，或者你可以从亚马逊英国以 8.79 英镑获得一个 USB 闪盘上的启动版本。哦，当然，如果你关注当地报刊店的 Linux 杂志，通常会发现封面 DVD
    上包含一个或多个发行版。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_119_0.png)


    # 安装模型


    通常有三种你可以使用的安装模型，如果你做过我们之前过的 Fedora 安装，那么你已经尝试过其中一种了。


    ## 基础网络安装


    在基础网络安装中，你下载一个非常、非常小的镜像并将其写入 CD、DVD 或 USB 闪盘。这种方法的想法是让机器启动到一个非常基础且下载很小的镜像中，该镜像包含足够让机器运行并连接网络的内容，并为你提供一个（希望是）易懂的用户界面，通过该界面你可以选择安装选项。


    下方：在进行基础网络安装之前，检查你的网络速度是非常重要的。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_119_1.png)


    基础网络安装的优点是，你不需要一个巨大的 USB 闪盘来存放安装文件，如果你打算针对少量功能进行相当自定义的安装，这就太棒了（如果你只想使用其中几百 MB，为什么要下载几个
    GB 呢？）。


    | 上次结果： |

    | :--- |

    | 下载速度: 46677 kbps (5834.6 KB/sec 传输) |

    | 上传速度: 671 kbps (83.9 KB/sec 传输) |


    缺点是，除非你在你的网络中有某种缓存服务器，否则如果你进行多次安装，你将不得不反复地从互联网下载数据。如果你使用的是像我们这样的 50M/s 宽链路，那没问题；但如果你使用的是速度只有几兆字节的宽带连接，即使是很小的安装也可能是痛苦的。


    ## Live 安装（现场安装）


    我们在示例中做的安装使用了 Fedora Live 安装。这些在发行版中非常常见，而且是一个极佳的折中方案，因为如果你进行默认安装且不修剪那些花哨的功能，安装介质上已经包含了它所需的所有文件。如果你还记得，我们在演示步骤时，在安装之前设置了无线局域网设置。实际上，我们没必要这样做，因为它所需的一切本就在
    USB 闪盘上；我们仅仅是因为认为这很有很有用（而且当安装完成后，它会将无线设置写入 Linux 安装中，这样我们重启后就直接连接到了网络）。


    > 小贴士

    > Live 安装是我们的最爱——它让你启动一个相当完整的 Linux，并且比精简版的网络安装更具灵活性。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_120_0.png)


    ## DVD 安装


    最后的选择是下载一组 ISO 镜像，但将它们刻录到 CD 或 DVD 作为安装媒体。这最接近“传统的”安装方法了，因此你可以在被提示时享受半小时更换光盘的怀旧时光。我们建议对较大的发行版使用
    CD，但 DVD 是可以的（例如，Debian 8 使用 17 张 CD，包括如果你选择完整版时的更新程序，但只需要四张 DVD）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_121_0.png)


    # 支持选项


    发行版运作方式的最后一个考虑因素是支持模型——你如何获得帮助。


    ## 自行其路


    第一个选项是自己来。那里有庞大的 Linux 用户社区，有论坛和维基。如果你遇到问题，可能会找到解决过它的人。这是学习最好的方式，但它需要大量的时间和精力。


    ## 免费 Linux  咨询


    第二个选项是从他人那里获得免费帮助。许多发行版都通过邮件列表和社区论坛提供某种程度的支持。这对于大多数人来说很棒，但如果你需要快速答案，它可能不够快。


    ## 商业支持


    第三种选项是付费支持。这对于需要保证响应时间的企业来说至关重要。你可以获得专业技术人员的支持，他们可以帮你解决任何问题。这可能很贵，但对许多人来说，这种安心感是值得的。


    '
