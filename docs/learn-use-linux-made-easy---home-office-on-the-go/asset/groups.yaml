    \ PCs, such as this one from the 1980s, would only be capable of displaying a\
    \ text-based interface. The answer today is that we move mice around and click\
    \ on things. But that's not the traditional way with Unix and Linux. Anyway, in\
    \ the early days, PC technology was very primitive and a GUI wasn't even an option\
    \ – many PCs didn't have graphics cards or screens capable of displaying anything\
    \ than a basic text-based interface into which you typed commands. And that interface\
    \ was — is called a shell.\n\n> Hot Tip: As you'll see, the shells have their\
