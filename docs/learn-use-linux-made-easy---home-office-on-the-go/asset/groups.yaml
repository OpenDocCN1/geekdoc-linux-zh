    # OUR SHARING SETUP


    The setup we''ll go with is fairly basic: we''ll create the user ''max'', and
    he''ll have his own personal directory that''s private to him. Once you''ve got
    your basic Samba setup working, this is 95 per cent of the battle won – if you
