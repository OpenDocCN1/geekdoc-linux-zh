    ![](img/c00dda504be4d70c6e7dd488ae0af42a_191_0.png)

    Above: The wired network is currently off.

    - 3. We can click ''Connect'', and since our router is a DHCP server it''ll assign
    an address. Once Linux thinks the connection''s working correctly we''ll get a
