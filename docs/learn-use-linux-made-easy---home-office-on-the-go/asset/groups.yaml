    # HOW THINGS MIGHT GO WRONG


    Having considered briefly how you might deal with something having gone wrong,
    let''s consider as our final thought on this subject how things might have gone
    wrong. We mentioned earlier that one reason for not being able to connect remotely
    to the machine is that IPTables has locked you out. Why might it do that? Simple:
    because you made a change to it. We have a phrase in IT:''sawing off the branch
    you''re sitting on''. It''s the concept of connecting remotely into the machine
    and then changing the configuration so that your remote connection is killed and
    you can''t restart it.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_244_0.png)


