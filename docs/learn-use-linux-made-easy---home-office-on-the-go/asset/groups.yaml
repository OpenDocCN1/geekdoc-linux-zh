    Linux itself emerged. While one of the strengths of Linux is the number of people
    who contribute to the code, just one man working alone started the operating system.
    A young Finnish programmer-called Linus Torvalds was working on a new way to use
    a program called MINIX, a stripped-down version of an operating system called
    Unix that would change computing for ever.


