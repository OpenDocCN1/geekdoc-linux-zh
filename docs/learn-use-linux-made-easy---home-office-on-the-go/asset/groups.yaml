  - '[PAGE 9]


    # INTRODUCTION


    Starting out with Linux can be difficult, especially if you''re brand new to the
    sometimes complicated operating system. This guide tells you everything you need
    to know to get started, from the very basics to the more advanced capabilities
    of Linux.


    # ABOUT THIS BOOK


    This is a book about Linux: if you''re a hardcore Linux user who''s used to arguing
    the merits of Debian against Fedora, it''s not for you. If you''re a professional
    IT person already managing an Apache web server, it''s not for you ... but if
    you''re interested in an adaptable, flexible and efficient operating system and
    want to know how to get the best from it, this book is most definitely for you.


    While it''s true that you can buy into Linux by going through a commercial distribution
    (distro) or by using a partner, it''s far more fun and interesting if you do it
    all yourself. Yes, there''s a lot to learn and you''ll have to get to grips with
    the notion of the Linux shell and the demands of a command-line interface, but
    this book will guide you.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_9_0.png)'
  - '[PAGE 10]


    # WHAT CAN YOU EXPECT?


    In the first chapter, you''ll learn about the history of Linux: who Linus Torvalds
    is; the philosophy behind free and open-source software; and why so many developers
    devoted their time to getting services off the ground. While this won''t help
    you become a Linux expert, you will understand some of the rationale behind the
    operating system and why there are so many distros about.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_10_0.png)


    # THE HEART OF THE OPERATING SYSTEM


    Chapter two is about Linux itself and the supporting ecosystem. It takes us to
    the heart of the operating system and helps you understand how Linux is structured:
    what''s in the kernel and what''s in the shell (see page 44).


    There''s also much more detail about the various Linux distros, what the main
    ones offer and how they differ. There''s plenty of information to help you choose
    the right one.'
  - '[PAGE 11]


    Then we finally get to some of the technical differences as we examine the various
    shell families and compare the shells sh, ksh and bash to csh and tcsh (see page
    68) – this may seem like a return to algebra lessons, but it will become clear
    what they all mean. In short, each one of them gives you the ability to write
    configuration files that set up Linux the way you want.


    # CHOOSING YOUR DISTRO


    We we get to chapter three. This is where we really get started with Linux. We
    now come to the nitty-gritty of downloading your chosen distro (see page 52).
    They''re not all the same and there are step-by-step guides to follow to make
    sure that you can get your chosen distro up and running properly. Screenshots
    alongside the step-by-step guides will ensure that everything is easy to follow
    so you can set up your Linux the way you want.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_11_0.png)


    # What Programs are Available?


    There''s also a look at what programs you can run with your distro. For example,
    if you want to select an email system, there are plenty to choose from. How do
    you decide between Postfix and Sendmail, for example? We look at what to consider
    when deciding which one is best for you.'
  - '[PAGE 12]


    # IN-DEPTH DETAILS


    You can get further information on how the different distros work in chapter four
    (see page 60). This time, we go into the detail of how they all work and pick
    up on their idiosyncies and foibles. All of them have their pluses and minuses,
    and it''s important to know these. Hot Tip boxes placed alongside the text give
    you that extra bit of advice that can make all the difference.


    # SECURITY


    One of the most important aspects of an operating system is security. There''s
    been plenty of debate about how secure Windows is and the ways that Microsoft
    has looked to beef up the safety of its own operating system. A Linux machine
    is considerably more secure, but that does not mean that security should be ignored.


    In chapter five, we take an in-depth look at all aspects of Linux security, with
    a detailed examination of secure remote log-in facility – SSH – how to use it
    and what you should be looking out for.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_12_0.png)


    Linux Firewalls

    There''s more to this chapter than SSH; it also looks at how to provision and
    administer Linux firewalls and goes into detail about wireless security, an essential
    part of any modern IT user''s armour.'
  - '[PAGE 13]


    # SETTING UP YOUR CONNECTION


    Computers don''t usually work in isolation, so chapter six examines how a user
    can establish a Linux connection. The chapter will take into account both wired
    and wireless connectivity – looking at everything you need to know about Linux
    networking.


    # LINUX AS A WEB SERVER


    You may well be interested in using Linux as a server. In this case, you''ll be
    interested in chapter seven. This goes into much more detail about what you''ll
    need to do to establish a viable Linux server and how to configure a personal
    NAS (Network Attached Storage) server (see page 214).


    # Apache Web Severs


    We also get to grips with one of the major uses of Linux: how it is used to


    drive Apache web servers. This is one of the areas where Linux really does hold
    sway over its competitors: about two-thirds of web servers across the world are
    based on Apache.


    If you''re going to be using Linux as a web server, then you''re going to learn
    about how to generate self-signed security certificates and how to run SSL-protected
    websites. Chapter eight shows you how.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_13_0.png)'
  - '[PAGE 14]


    # TROUBLESHOOTING


    After that, we have the very important troubleshooting section. This tells you
    how to fix some common problems. We look at what to do when you can''t log on
    remotely, what to do when you lose the connection, and the value of a decent back-up.
    This chapter essentially explains the importance of not sawing through the branch
    you''re sitting on


    There''s also a complete glossary, so you''re not left baffled by any terms that
    you come across your Linux journey.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_14_0.png)


    # THE START OF YOUR LINUX JOURNEY


    Within the space of a couple of hundred pages, it''s impossible to cover the full
    range and richness of Linux. There are so many distros out there, each with their
    own advantages, that there''s something for everyone; we can only push you in
    the right direction. There are plenty of resources out there that you can take
    you further, and there are plenty of people to help you. One of the joys of Linux
    is that everything''s out in the open and everything is geared towards collaboration.
    If you have a query, someone is going to be able to answer it. This book will
    get you started: how far you go is really up to you.


    # Hot Tip


    As you go through this book, look out for Hot Tip boxes, for getting even more
    out of your Linux experience. From extra resources to insights learned from decades
    of using Linux, these tips will start you on your way to becoming a Linux expert.'
  - '[PAGE 15]


