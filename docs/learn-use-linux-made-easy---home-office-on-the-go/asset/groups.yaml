    \n为了实现这一点，发行版制造商制作了包管理器——这些应用程序将程序的所有关键组件打包成单个包，然后你可以下载并解压它。内容会从包中提取出来，并放置在计算机磁盘上适当的位置。包管理器还了解一个包中的软件对其他项目的任何依赖关系，因此如果你尝试安装某个依赖于你未安装软件的程序，它会告诉你并提议下载并安装它。\n\
