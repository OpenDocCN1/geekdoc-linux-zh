  - '[PAGE 36]


    The truth is, Windows does seem a bit more unstable than other operating systems
    – as Mac users are fond of pointing out – and there''s an awful lot of restarting
    going on. It''s become a standard joke for any sort of problem – turn it off and
    turn it on again. The truth is, that does work most of the time, but it''s an
    inefficient way of dealing with problems.


    # Dealing with Updates


    For a start, there are regular Windows updates to deal with. These are pretty
    essential for keeping the system fresh. Then you''re probably updating the programs
    that run on your machine. Every time you do that, you''ll see a message about
    restarting – often when you''re in the middle of something critical.


    You can forget all of that with Linux. It doesn''t happen. There''s no restart
    every time there''s the slightest change to something on your machine. Whisper
    quietly, but there are Linux machines out in the big world that have been running
    for years, nonstop, without once having restarted.


    # POWERFUL SHELL


    The way that Linux is structured is a central kernel (the core operating system,
    surrounded by Linux utilities) and then the shell (the part that the user deals
    with). For older Microsoft users, Linux is a bit like returning to the days of
    DOS. You have to use a command-line interface and learn a whole truck of commands.
    It''s not intuitive like a GUI and there''s a need to get your syntax exactly
    right; however, a shell can be more powerful than a GUI, offering a level of control
    that you don''t always get with fancier options. This, of course, is something
    we still see with Windows; when there''s something sophisticated that needs to
    be done, the GUI is shoved aside. Microsoft itself has recognized this with the
    introduction of PowerShell, a very powerful tool aimed at business users of Windows
    – a sign of how the Linux mentality has had an effect on more traditional companies.


    > Hot Tip

    The shell, also known as the command line, was what used to scare people away
    from Linux. With a modern Linux desktop, there is no need to use the shell.'
