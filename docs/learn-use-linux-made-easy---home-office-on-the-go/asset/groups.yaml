    # WHY LINUX?


    That''s a concise run-through of the history of Linux. Knowing the background
    doesn''t actually help you to run the operating system, but it does help put in
    context why things are implemented the way they are. What are the main reasons
    for selecting Linux?


    There are many reasons users are turning to the operating system, and we run through
    some of them here. They''re in no particular order; what may be the main reason
    for one person won''t be for another.


    # LACK OF BLOATWARE


    Remember when you got your PC? You probably had to pick your way through an array
    of unwanted programs, certainly if you bought the machine from a large store.
    You would have had an antivirus product, possibly the magazine subscription offering,
    Zinio, and there would have been a package of various games. It is possible to
    remove these programs using Uninstall, but it''s a bit of faff. By opting for
    Linux, you do away with such problems – there''s no danger of being bombarded
    with reminders about trial periods ending, and certainly no pleas to pay for subscriptions
    to any services. With Linux, what you see is what you get.


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_29_0.png)'
