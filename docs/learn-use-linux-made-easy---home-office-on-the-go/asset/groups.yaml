    ![](img/c00dda504be4d70c6e7dd488ae0af42a_89_1.png)


    要将 Fedora 镜像拷贝到 U 盘，只需点击“Browse”（浏览）并导航到我们下载的镜像，同时确保“Target Device”（目标设备）是我们刚刚格式化的
    U 盘（右侧）。


    Fedora 安装程序已成功写入 U 盘。


    现在我们要做的是点击“Create Live USB”（创建 Live USB）并等待。这个文件只有 1.3MB，所以花费两三分钟是正常的。完成后，你可以关闭
    Creator 应用程序。


    ## 小贴士


    手头准备一个好用的 U 盘以备此类用途。它们相对便宜，而且当你需要时如果没有备用，跑去商店买会很麻烦。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_89_2.png)


    # 下载你选择的发行版


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_90_0.png)


    # 运行安装程序


    我们现在拥有的是一个可以启动电脑的 U 盘。现在，你可能需要更改电脑 BIOS 中的启动设置，使其在从内置硬盘启动之前从 USB 端口启动。这你需要在 Google
    上搜索或查看你的 PC 文档，因为这因机器而异。


    一旦你处理好了 PC 的启动选项，就可以在插入 U 盘的情况下启动它。你应该能看到一个黑色屏幕，上面有几个选项，包括“Test this media & start
    Fedora Live”（测试此媒体并启动 Fedora Live）。


    上方：Fedora 欢迎界面为你提供了在安装前测试 Fedora 的选项。


    这是默认选项，只需等待它就会启动。过了一会儿，你应该会看到“Welcome to Fedora”界面，上面有两个选项：“Try Fedora”（尝试 Fedora）和“Install
    to Hard Drive”（安装到硬盘）（见下方）。


    现在，我们想要进行安装，但在此之前，我们需要连接网络以便安装程序下载其文件。在我们的情况下，我们将使用无线网络。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_90_1.png)


    # 连接 WiFi


    - 1. 要进入 WiFi 配置页面，转到右上角并点击小三角形。会出现一个摘要窗口，显示关于蓝牙和电池电的一些基本信息，更重要的是，WiFi 尚未连接（见右侧）。

    - 2. 点击“Not Connected”（未连接）链接，系统将扫描无线网络；几秒钟后，你将得到列表。

    - 3. 点击你想要的一项，它会向你索要安全密钥。


    假设你的手指没有问题，它将确认你已连接。


    - 3. 现在我们已经处理好了 WiFi 连接，可以开始安装了。点击左角的角的Activities”（活动）菜单，你将在底部看到“Install to Hard
    Drive”（安装到硬盘）选项。点击此项，安装程序窗口将在几秒后出现。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_91_0.png)


    上方：工具菜单显示 WiFi 尚未配置。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_91_1.png)


    上方：系统生成了可用的无线网络列表。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_91_2.png)


    > 小贴士

    现在的 Linux 安装程序非常好，但请仔细检查每个屏幕，以确保你没有错过任何设置。


    上方：在提示时输入 WiFi 密码。


    # 下载你选择的发行版


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_92_0.png)


    这是一个非常简单的向导。在第一个屏幕上你将选择语言和变体；我们将选择英语和英国（见顶部）。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_92_1.png)


    上方：第一步是设置你的语言。


    - 点击“Continue”（继续），它会思考一会儿你的系统；在我们的情况下，我们已经选择了 WiFi 网络——我们看到的唯一警告是关于“Installation
    Destination”（安装目标）的（见右侧）。


    所以让我们点击它。在我们的 PC 上，我们有两个选项。现在，SanDisk Cruiser 实际上是我们正在用于截图的 U 盘——我们需要选择 31.5GB
    的磁盘。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_92_2.png)


    上方：这里还需要设置安装目标。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_92_3.png)


    点击它，会出现一个小勾号（右下角）。然后点击“Done”（完成）。


    上方：已选择磁盘。


    # 开始


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_93_0.png)


