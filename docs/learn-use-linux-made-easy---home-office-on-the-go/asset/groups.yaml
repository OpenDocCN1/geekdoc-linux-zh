    # 引言


    开始学习 Linux 可能会很困难，特别是对于这个有时复杂的操作系统完全陌生的学者来说。本指南将教你入门所需的所有知识，从最基础的知识到 Linux 的更高级功能。


    # 关于本书


    这是一本关于 Linux 的书：如果你是一个习惯于争论 Debian 和 Fedora 优劣的硬核 Linux 用户，那么它不适合你。如果你是一个已经在管理
    Apache Web 服务器的专业 IT 人员，它也不适合你……但如果你对一种适应性强、灵活且高效的操作系统感兴趣，并想知道如何发挥它的最大价值，那么这本书绝对适合你。


    虽然通过商业发行版（distro）或使用合作伙伴来获取 Linux 确实可行，但亲手完成这一切会有趣得多也更有意义。是的，有很多东西要学，你必须掌握 Linux
    终端（shell）的概念以及命令行界面的要求，但这本书将引导你完成。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_9_0.png)


    # 你可以期待什么？


    在第一章中，你将学习 Linux 的历史：林纳斯·托瓦尔斯（Linus Torvalds）是谁；自由开源软件背后的哲学；以及为什么有这么多开发者投入时间让服务运行起来。虽然这不会帮助你成为
    Linux 专家，但你将理解该操作系统的某些逻辑依据，以及为什么会有这么多发行版。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_10_0.png)


    # 操作系统的核心


    第二章介绍 Linux 本身及其支持生态系统。它将带我们进入操作系统的核心，帮助你理解 Linux 的结构：内核中有什么，终端中有什么（见第 44 页）。


    关于各种 Linux 发行版还有更多细节，主要版本提供的功能以及它们之间的区别。有丰富的信息帮助你选择正确的版本。


    最后，我们将进入一些技术差异，检查不同的 shell 家族，并将 sh、ksh 和 bash 与 csh 和 tcsh 进行比较（见第 68 页）——这看起来可能像是回到代数课，但它们所有的含义将变得非常清晰。简而言之，每种
    shell 都赋予你编写配置文件的能力，按照你想要的方式设置 Linux。


    # 选择你的发行版


    我们进入第三章。这是我们真正开始学习 Linux 的地方。我们现在进入了下载所选发行版的细节部分（见第 52 页）。它们并不尽相同，有分步骤的指南可以遵循，以确保你所选的发行版能够正常运行。步骤指南旁边的截图将确保所有内容都易于遵循，以便你按照自己的方式设置
    Linux。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_11_0.png)


    # 有哪些可用程序？


    我们还将查看使用你的发行版可以运行哪些程序。例如，如果你想选择一个邮件系统，有很多供你选择。例如，你如何在 Postfix 和 Sendmail 之间做决定？我们将介绍在决定哪种最适合你时需要考虑的因素。


    # 深度细节


    你可以在第四章中获取关于不同发行版如何运作的更多信息（见第 60 页）。这一次，我们将进入它们工作原理的细节，并捕捉它们的特性和缺点。它们都有自己的优劣，了解这些至关重要。文本旁边的“热点提示”（Hot
    Tip）框将为你提供可能产生巨大差异的额外建议。


    # 安全


    操作系统的最重要的方面之一是安全。关于 Windows 的安全性以及微软寻求增强其自身操作系统安全性的方法，一直存在大量的争论。Linux 机器要安全得多，但这并不意味着应该忽视安全。


    在第五章中，我们将深入研究 Linux 安全的各个方面，详细检查安全远程登录设施—— SSH——如何使用它以及你应该注意哪些事项。


    ![](img/c00dda504be4d70c6e7dd488ae0af42a_12_0.png)


    Linux 防火墙

    这一章的内容不仅是 SSH；它还查看了如何配置和管理 Linux 防火墙，并详细介绍了无线安全，这是任何现代 IT 用户装甲中不可或缺的一部分。


    # 设置你的连接


    计算机通常不是孤立工作的，因此第六章将检查用户如何建立 Linux 连接。该章将同时考虑有线和无线连接——涵盖你关于 Linux 网络所需的所有知识。


    # Linux 作为 Web 服务器


    你可能对将 Linux 作为服务器感兴趣。在这种情况下，会对第七章感兴趣。这章详细详细介绍了建立一个可行的 Linux 服务器需要做什么，以及如何配置个人
    NAS（网络附属存储）服务器（见第 214 页）。


    # Apache Web 服务器


    我们还在查看 Linux 的主要用途之一：它如何被用于驱动 Web 服务器。如果你打算将 Linux 作为服务器，第八章将向你如何生成 SSL 证书。


    # 故障排除


    之后，我们有故障排除章节。我们将查看无法登录时该怎么办，以及如何修复常见问题。


