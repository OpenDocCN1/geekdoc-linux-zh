    # 奇特的 Shell - 值得提及


    我们提到的这些 Shell 是你将会遇到的。然而，对于那些具有冒险精神的人来说，还有一些特殊用途的 Shell。例如：


    - Fish：“友好的交互式 shell”，设计初衷比传统 Shell 更友好。它的血统中既没有 sh 也没有 csh。

    - Scsh：一种基于 Scheme 编程语言的 shell。

    - Wish：一种让你使用 GUI 组件的 shell。


    > 热门提示：你不太可能使用那些更奇特的 Shell，因为它们真的只是为硬核 Linux 技术人员准备的。根据我们的预测，你最终会使用 bash 或 tcsh。


    除了你可能不会使用它们之外，这些 Shell 之间几乎没有共同点。


    # 比较 - 启动与停止


    现在我们已经对 Linux 机器上的各种 Shell 有了些许了解，让我们来看一些实际的差异。尽管你可以以原始形式使用任何 Shell，但每一个都赋予了你编写配置文件的能力，以按照你想要的方式进行设置：例如，设置命令行显示的提示符，或者为经常使用的命令定义别名（aliases）。


    遗憾的是，不同的 Shell 使用不同的启动文件。让我们比较一下 bash 和 tcsh；我们将先看它们首先查找哪些配置文件，然后解释实际执行了什么。


    当你用 bash 登录时，它会首先检查系统级配置文件：


    ```

    /etc/profile

    ```


    # Linux 生态系统


    # 主目录


    Linux 机器上的每个用户 ID 都有一个默认的主目录。如果你是一个普通用户，这是一个私有目录，因此你可以使用主目录中的本地配置文件来指定任何想要的自定义内容。在你的主目录中有三个备选文件的情况下：


    > 热门提示：了解你的启动文件以及哪些文件与 Shell 配合使用——否则你将为某些事情似乎不起作用而抓耳挠腮；结果发现你用错了文件。


    ```

    .bash_profile

    .bash_login

    .profile

    ```


    它将按照此顺序查找文件，并只处理遇到的第一个。这三个文件中的最后一个 .profile 是对旧 sh 时代的致敬——它曾是个人配置文件的默认名称。请注意，如果你同时使用
    sh 和 ksh（如果你有此倾向），那么要在 .bash_profile 中添加一个引用 .profile 的条目，然后将仅限 bash 的命令放在 .bash_profile
    中，将兼容 sh 的命令放在 .profile 中。sh 会处理后者，并且两个都会处理。


    这里举个例子。我们从一个既有 .bash_profile 又有 .profile 用户开始。前者将提示符设置为以 bash_profile 开头，后者则为
    profile。我们预期提示符会提到 bash_profile，事实确实如此：


    ```

    Davids-MacBook-Pro:~ davidcartwright$$ ssh dsc@192.168.1.186 dsc@192.168.1.186''s
    password:

    ```


    Last login: Mon Jul 27 21:02:13 2015

    bash_profile@21:02:42:~$


    ```


    我们将删除 .bash_profile，并预计它会选取 .profile，果真，它确实如此：


    ```

    Davids-MacBook-Pro~: davidcartwright$ ssh dsc@192.168.1.186

    dsc192.168.1.186''s password:

    Last login: Mon Jul 27 21:02:42 2015 from 192.168.1.156

    profile@21:02:54:~$

    ```


    以下：bash 的 etc profile。


    ```

    root@linuxpc-local:~~

    File Edit View Search Terminal Help

    /etc/profile

    # 系统级环境和启动程序，用于登录设置

    # 函数和别名存放在 /etc/bashrc

    # 除非你清楚自己在做什么，否则修改此文件不是好主意。

    # 最好在 /etc/profile.d/ 中创建一个 custom.sh shell 脚本

    # 对你的环境进行自定义更改，因为这可以避免在未来的更新中需要进行合并。

    path() {

    case $1 in

    (PATH)

    if [ "$2" -ne "$PATH" ]; then

    export PATH="$2:$PATH"

