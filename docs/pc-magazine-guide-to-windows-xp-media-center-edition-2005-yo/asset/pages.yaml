    ![](img/9c34804a6113e2b911b7ce17a1a67b67_233_0.png)


    **Figure 12-16:** The Copy Options screen.


    # Note


    Media Center uses proprietary WMA formats for copying CDs. The files are fully
    supported by Media Center but may not be the best choice overall if you also plan
    to use the files on portable MP3 players or devices that do not play WMA files.
    If that is the case, convert your CDs using an MP3 ripping program and add the
    files to your music library from Windows Media Player.


    After the one-time session copying protection and file formats, you are able to
    copy your CD using the Copy button when the CD is playing, or even easier, by
    pressing the Red Record button on the remote.


    Media Center copies the entire CD—you cannot choose to only record tracks. The
    track being copied is indicated by a spinning CD icon with the percentage of track
    appearing next to it. Songs that have been copied have a check mark with the track
    next to them, as shown in Figure 12-17.


    Media Center copies each track until the end of the CD is reached. You can continue
    to listen to the CD while it is being copied.


    To listen to the CD that has been copied, you can click on the album from the
    main Music menu where recently played music is listed or find it using any of
    the sort and search methods.'
