    cancel recordings and get more information, as shown in Figure 10-10. You can
    also get to Info by using a mouse and clicking on the right mouse key for a highlighted
    event.


    It is a lot of work to go through the Guide to find shows you have scheduled to
    record. With a large grid of channels and two weeks of shows, it''s really not
    the best way to find the shows you have scheduled for recordings.


    Another way to cancel recordings is to go to the Recorded TV menu from My TV.
