    # # Setting Up Your Media Center PC


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_37_0.png)


    One of the biggest challenges many people face when buying a Media Center PC is
    where it will be used in the home. Just about any Media Center PC on the market
    is top-of-the-line PC that''s more than capable of any office-computing task.
    As discussed in Chapter 1, the audio and video powers of Media Center PCs also
    make them one of the most powerful home entertainment devices on the market today.


    Used as an entertainment center in the family room or for powering the entertainment
    center from the home office, Media Center PCs can do so much that you will want
    to reconfigure your current entertainment system. You will want to keep parts
    of your current entertainment system and some you will want to remove. This chapter
    looks at how to build a home entertainment center with the Media Center PC at
    the heart of it.


    # # Choosing the Right Media PC Form Factor


    You will need to start with the purchase of a Media Center PC. One of the first
    questions people ask when thinking about purchasing a Media Center PC is “Why
    can''t I add Media Center to my current PC?” As you learn in the next chapter,
    Media Center PCs are a combination of hardware, software, and operating system
    that all work together as a configured system. The system is only sold as a Media
    PC and unfortunately is not available for upgrade to your current computer.


    If you have time, a good way to start is to read this book and understand all
    of the features and possibilities that such a computer represents. Understanding
    the functions and knowing where you plan to use it in your home will help you
    get the right model.


    For example, if you primarily want to use your Media Center PC for picture viewing
    and video, you can purchase a model with a smaller hard drive. For recording tons
    of TVs and editing home videos you will want to get a Media PC with TV tuner cards
    and the largest hard drive possible—and maybe even one you can add hard drives.


    Media Center PCs come nicely equipped with everything you will need except a display.
    In addition to deciding what type of display you will use (the nearby beside),
    you also have a choice of what size and shape (form factor) of Media Center PC
    you want. As a component in your'
