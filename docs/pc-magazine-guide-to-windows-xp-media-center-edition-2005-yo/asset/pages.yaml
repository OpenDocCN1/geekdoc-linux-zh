  md: '# # Chapter 16


    # # Creating SlideshowsnUsing My Pictures


    With all of your picture management skills in place (as covered in Chapter 15)
    you are ready to viewing all of your picture files in a slideshow. My Pictures
    does slideshow better than just any other program. Media Center improves on computer
    slideshows by adding sophisticated motion in addition to transitions. The combination
    of movement and dissolves makes slideshow in Media Center truly TV-like experience.
    Using a video-style visualization of pictures that move, pan, and transition elegantly
    combined with the ability to play music along with them makes it the slideshow
    of choice.


    Because the pictures on your computer were most likely "slides" to start off,
    with the name "slides" comes from the yesteryear activity of using a slide projector
    to project the images of slides onto a wall or reflective screen. The slides were
    put out of play in the slide projector, and using an automatic advance or a manual
    advance controller, the slides were displayed one after another.


    The name "slides" continues to be an appropriate name since slideshows on a computer
    really have not looked that much different from those a slide projector. They
    have been a series of slides, presented one after another, projected onto your
    (computer) screen.


    # # Slideshow Settings


    Go to the Start Screen, select Settings, and select Pictures to arrive at the
    settings menu for My Pictures. All of the settings in this menu, shown in Figure
    16-1, are important for a great slideshow, and we will look at each one in detail.
    The settings allow controlling the style of slideshow, the transition effect,
    what information is displayed over the slides (if any), and how to play your slideshow.
    Here are each of the settings and how you can use to customize a slideshow:


    +   - Show pictures in random order—Presents pictures in a slideshow in random
    order. If you unchecked the box, pictures are displayed in their sort order by
    file name or date.

    - Show pictures in subfolders—This plays the pictures in subfolders within a primary
    folder.

    - Show caption—This applies to full-screen viewing of pictures and slideshows.
    The caption displays the file name on top of the picture being shown.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# 268 PC Magazine—Guide to Windows XP Media Center Edition 2005


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_288_0.png)


    Figure 16-1: The My Pictures Settings during slide show.


    +   - Show song information during slide show:

    - Beginning and end of song—Song information and album art is shown at the beginning
    and end of song when you play songs during a slideshow. The information is displayed
    over the pictures in the slideshow. Figure 16-2 shows song information displayed
    over a picture.

    - Always—The song information is shown at all times over the pictures in the slideshow.

    - Never—Song information is not displayed during a slideshow.

    - Transitions type:

    - Animated—The pictures are larger than the screen, and they are moved gently
    in panning motions while being displayed. The pictures fade in and out of one
    another as they are changed.

    - Cross fade—The pictures are displayed full-screen and remain still, and the
    pictures fade in and out of one another when they change.

    - None—Pictures are shown full-screen and cut from one to another without a fade
    or transition.

    - Transition time: The duration of each slide is determined here. Times from one
    to sixty seconds can be selected.

    - Slide show background color: When portrait pictures are displayed, they are
    put at a background because they cannot fill a landscape screen. This setting
    controls the color of the'
  merge: -1
