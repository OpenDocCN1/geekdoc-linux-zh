  md: '# Chapter 10: Recording and Playback of TV Programs 179


    # Managing Recorded Shows


    Once you have a number of recorded shows, you will appreciate the tools Media
    Center offers to find and manage recorded shows. It may seem strange that “finding”
    is an issue, but with series and the overall case of recorded shows you may end
    up with a lot of shows on your drive and it may be hard to tell which episode
    of Friends is which. (Okay, bad example as all episodes of Friends are the same
    episode really. . . .)


    Just as the Program Guide allows you to search for shows by keywords, actors,
    or show titles, recorded shows retain all of that guide information with the recording
    you can search for recorded shows using the same methods as with the Guide.


    The first place to find and manage recorded shows is the Recorded Shows menu.
    This menu contains tools to make the list of shows in many of ways and to help
    you find the right show. You can sort the shows in the list by the date they were
    recorded which shows you recorded last Thursday and you can''t remember the name
    of), sort by name, or sort by the category.


    You can also add a recording using the same basic scheduling routines presented
    earlier in this chapter.


    The final item is to view the “Scheduled” recordings. All of the shows scheduled
    to be recorded are listed in this menu, but you can also find about shows you
    have recorded in the past by using the History menu.


    With all of the tools for managing recorded shows, you will quickly learn to find
    the show you are looking for, add new shows, delete shows, and view them when
    you please.


    # Summary


    Media Center excels at functioning as a digital video recorder. Using the hard
    drives in your computer or attached to it, you can store a virtually unlimited
    number of recorded TV shows. If you have a DVD burner, it is also possible to
    transfer shows from your hard drive to a DVD


    After going through an initial setup to establish recorded preferences and what
    quality you want to record TV shows, you can record TV shows while watching them
    using one-touch recorder or use the Program Guide to schedule recordings of individual
    shows and series. Recordings can be made by using keywords to record all shows
    that have that keyword in their description, and shows can also be recorded by
    time, date, and channel.


    Once shows are recorded, they are easily viewed full-screen, on the My TV menu,
    or on the Windows desktop in a window. Recorded shows can be deleted or kept as
    long as you desire. You recorded shows from a menu or from a search of the data
    about the show from the Program Guide.'
  merge: -1
