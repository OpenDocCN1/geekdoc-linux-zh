  md: '# Chapter 5


    # Choosing the Right Media Center PC


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_99_0.png)


    By all appearances, a Media Center PC looks just like any other high-end PC. In
    fact, it''s possible to configure a standard PC to include the same hardware for
    TV viewing and recording plus all of the audio and video functions found on Media
    Center PCs. Even configured with the same hardware, a standard PC would not be
    a Media Center PC; the Windows XP Media Center Edition Operating System that makes
    it special.


    Media Center PCs are unique in many ways and offer advantages that make them worth
    their price. This chapter takes a look at what makes a Media Center PC different
    from a standard PC for media applications and how to find the right Media Center
    PC for your lifestyle.


    # Standard PCs versus Media Center PCs


    Microsoft has taken a different approach to offering its Windows XP Media Center
    Edition operating system to users than previous versions of its operating systems.
    Microsoft operating systems such as Windows XP Home Edition or Windows were not
    only preinstalled on PCs. Once you had a computer with Windows on it you could
    also upgrade to new versions of Windows or purchase Windows to install on computers
    you built and assembled.


    That is not the case with the Windows XP Media Center operating system; it''s
    only available on PCs that are sold as complete systems meeting hardware and configuration
    requirements established by Microsoft for the purpose of acting as your media.
    You won''t be able to buy it as an upgrade to an existing version of Windows;
    you need to purchase a PC configured to those requirements with the Windows XP
    Media Center Edition operating installed.


    The benefit to you is that when you purchase a Media Center PC it has everything
    you need right out of the box. In addition to an operating system to act as a
    TV-like experience, the hardware in the PC offers the correct level of performance
    for the demands of getting video in out of the PC as well as storing it.


    Windows XP Media Center combines a standard Windows XP operating system for general
    computing with a special operating system for viewing and controlling media called
    Media Center (shown in Figure 5-1).


    The Media Center operating system integrates a number of experiences and system-level
    functions. It creates a consistent and understandable way of working with media
    files such as TV programs, video, pictures, and music. The controls are the same
    whether you''re viewing a home movie, watching TV,'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# 80 PC Magazine—Guide to Windows XP Media Center Edition 2005


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_100_0.png)


    **Figure 5-1:** Media Center running in a window on the standard Windows XP desktop.


    playing music, or looking at pictures; they can all be managed using the same
    actions and commands from one keyboard, one mouse, or one remote control.


    That level of integration is not possible using different applications on a standard
    PC—even if you had the same hardware that is found on a Media Center PC. Again,
    it''s the Media Center operating system that brings all of the hardware and software
    together into a user experience that makes sense.


    # Media Center PC Hardware Requirements


    In order for a PC to use the Windows XP Media Center Edition operating system
    it must include the following hardware:


    +   - A Media Center-compatible remote control if your PC comes with a TV tuner.

    - A remote infrared (IR) sensor that communicates with the remote control if your
    PC comes with a TV tuner.

    - A remote IR controller to control your cable or satellite set-top box if your
    PC comes with a TV tuner.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 5: Choosing the Right Media Center PC 81


    +   - A high-performance graphics card capable of displaying TV and video on a
    computer monitor.


    +   - A TV output port to display Media Center on a standard TV.


    +   - Digital audio output to send digital audio from your computer to an existing
    home entertainment system.


    +   - TV tuner card, single or dual, that can display television signals from
    a cable, satellite, a connected video source like a VCR, or an antenna source.


    +   - A hardware encoder enables recording of TV shows from cable, satellite,
    or antenna to the computer''s hard disk.


    +   - Mid- to high-end processors


    +   - Enough memory for both computing and entertainment applications


    +   - High-capacity hard disks


    +   - CD-ROM/DVD drives


    +   - Advanced graphics and audio capabilities


    +   - Networking connectivity


    # Media Center PC Hardware Differences


    Although Microsoft puts requirements on the hardware for Media Center PCs, it
    gave enough latitude to manufacturers to allow a range of prices and configurations.
    For example, the operating system can support a TV tuner, it is not a hardware
    requirement.


    Because there are differences in various Media Center PCs, the following sections
    detail each component in a Media Center PC system and how it affects the overall
    Media Center PC experience.


    # DIFFERENT PROCESSORS AND RAM


    Like PC on the market, Media Center PCs are available with different processors.
    At any point in time the fastest processors on the market will cost what you most,
    so the question is is a faster processor worth the extra money?


    Most Media Center PCs are using Pentium 4 processors, and just about any clock
    speed will work well. For example, I''ve tested both a Pentium 4 2.6-GHz unit
    and a 2.8-GHz unit; both performed exceptionally well in all Media Center applications.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# 82 PC Magazine—Guide to Windows XP Center Edition 2005


    Media Center was designed to work correctly on computers that have been available
    for more a year now, so processor speeds have exceed the original requirements.
    Because processor speeds keep increasing, it''s important to consider whether
    a faster processor will have value in your traditional computing applications.


    The use of video—displaying TV and videos—is where a lot of processing power is
    required. Luckily, processing is offloaded to the video card, so it is important
    to get a Media Center PC that is equipped with the best video card possible.


    RAM is also a part of the performance of your PC. Currently RAM configurations
    in Media Center PCs range from 250MB to 2GB.


    > Tip

    You can expand your RAM in the future but a good starting point is to purchase
    a Media Center PC with at least 512MB of RAM.


    # DIFFERENT HARD DRIVES


    If you plan to do a recording of TV shows and put all of your media on your Media
    Center PC, you should consider two things in regard hard drives: the size of the
    drive that comes with the machine and whether you can add an extra hard drive.


    Media PCs started being marketed with drives as small as 80GB, and you can configure
    them with extremely large hard drives such as a 250GB drive. The rule here is:
    Get the largest drive for the money that you can. Video and music files (plus
    the ever-larger files created with multi-mega pixel digital cameras) are compared
    to virtually anything else you store on your PC, so bigger is definitely better.
    Table 5-1 shows approximately how many hours of TV programs can be recorded (at
    different quality levels) using a 120GB hard drive.


    | Table 5-1 Recording Times at Different Quality Settings |

    | Recording Quality | Best | Better | Good | Fair |

    | :--- | :--- | :--- | :--- | :--- |

    | Hours of Storage | 46 | 54 | 66 | 122 |


    Drive is an important consideration. Look for 7200-RPM drive speeds and stay away
    from the 5400-RPM drives if possible. Video play best with faster drives and will
    often offer larger files (8MB file would be the best choice).


    Even with a large hard drive you may find yourself wanting more storage. You have
    two choices when expanding: Add a second internal hard drive (if there is a bay
    in your PC) or add an external hard drive.


    The least expensive and elegant way is to add an internal hard drive. Because
    external drives require a case and a power supply, they will cost more. Again,
    the rule is to get a large, fast drive either internal or external. In a living/family
    room setting you probably not want to have a lot of “add-ons” such as external
    hard drives laying about, the internal drive may be the best option for such settings.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Chapter 5: Choosing the Right Media Center PC 83


    External hard drives come in two versions: FireWire/IEEE 1394 and USB 2.0. Your
    Media Center PC can work with either since it will have both FireWire/IEEE 1394
    and USB 2.0. Using USB 2.0 is faster of the two so that may be the best choice.
    External hard drives have both FireWire/IEEE 1394 and USB 2.0 connections but
    you may have to pay for more.


    With the ability to add hard drives—and with prices getting lower by the day—you''ll
    have the option of building your storage as needed. The best deal is to get the
    largest drive possible when you buy your computer. It usually costs more to add
    a drive than it comes installed at the time of purchase.


    # DIFFERENT OPTICAL DRIVES


    Media Center PCs can come equipped with a variety of optical drive configurations,
    as shown in Table 5-2.


    | Table 5-2 Optical Drive Configurations |

    | Type | Plays | Records |

    |---|---|---||

    | CD-ROM | Audio CDs, Data CDs | Does not record |

    | CD-RW | Audio CDs, Data CDs | Audio CDs, Data CDs |

    | DVD | DVDs, Audio CDs, Data DVD/CDs | Does not record |

    | DVD-R/-RW | DVDs, Audio CDs, DVD/CDs | -DVDs, Audio CDs, Data DVD/CDs |

    | DVD+/-RW | DVDs, Audio CDs, DVD/CDs | +DVDs, Audio CDs, Data DVD/CDs |

    | DVD+/RW/-RW | DVDs, Audio CDs, DVD/CDs | -DVDs, Audio CDs, Data DVD/CDs |


    Depending on the form factor, it may come with one or two optical drives. A typical
    example of a two-drive configuration is one CD-ROM drive and one DVD recording
    media. Media Center PCs can come with at least one drive for writing DVDs, but
    most are offered with DVD recording drives.


    DVD-R or RW enable you to record your own DVDs that can be played on your Media
    Center PC or most regular DVD players. They can also record data DVDs and CDs,
    audio CDs, and MP3 songs.


    Many Media Center PCs come equipped with a DVD recording drive and a second CD-ROM
    drive. High-end systems feature two DVD recording drives, which allow quick and
    easy copying of DVDs.


    # DIFFERENT VIDEO CARDS


    One of the most important components in a Media Center PC is the video card. It
    drives your computer monitor, TV, or both. It virtually everything you see on
    the screen and how well video looks on a display.


    Like the processor that powers your computer, the video card is a small computer
    in its own right. It has a processor and memory and both affect performance. As
    with processors and all the other components in a Media Center PC, a variety of
    video cards are offered and will affect the price of the system.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# 84 PC Magazine—Guide to Windows XP Center Edition 2005


    Video cards process all the visual information that you see either on your computer
    monitor or TV. For Media Center PCs, they must be capable of delivering high-quality
    video on monitor resolutions ranging from 640 x 480 to high resolutions such as
    2048 x 1536. They must also be capable of sending flicker-free video to a TV.


    Currently, most of the video cards in Media Center PCs are from Nvidia or ATI
    with high-performance processors. All cards that come with a Media Center PC must
    meet minimum requirements for displaying them on either computer monitors or TVs,
    so most will do a good job for basic TV viewing and PC use.


    It is also required that the video card allows connection to a standard computer
