  md: '# Chapter 6: Getting Audio and Video In and Out of Your MCE PC 101


    monitor to the video card via these connectors. When using a computer monitor,
    audio is played through the speakers that you have attached to your computer.


    You can connect both TV and a computer monitor at the same time. Following the
    connection scenarios above, connect the TV using the S-Video or composite connection
    and your computer monitor to the 15-pin VGA or DVI connector. When you turn on
    both computer displays will be active and you can use the Display Properties from
    the Control Panel in Windows XP to make adjustments to how the two displays should
    work together. You can have them both the same image and create a “virtual” desktop
    that spans the two displays. This is good for using Windows XP on the computer
    monitor while Media Center runs on the TV.


    # Cross-Reference


    Adjusting the properties of your video card is covered in Chapter 9.


    # Audio


    In addition to changing how you watch TV, a Media Center PC also changes how you
    listen to music. PCs have become the new home stereo in many ways—people are using
    them to buy music, burn CDs and MP3s, and listen to music. Although a PC is great
    for playing music, it would be hard to dedicate a PC just for the purpose of playing
    music in the family room or den. Media Center PCs change that.


    By putting TV viewing, DVD playing, and music all in one system, your Media Center
    PC becomes a replacement for many current home entertainment devices, including
    the traditional home stereo. Whether located in the family room directly or through
    an extension box, the Media Center PC makes the perfect home stereo. It can play
    virtually all music formats (MP3, WMA, audio CDs, audio DVDs, and WAV files) and
    it can connect to the Internet for radio and streaming audio.


    When you connect your Media Center PC to a great set of powered speakers or surround
    sound system you will ever find at an amazingly low price. This section lists
    how to connect powered speakers or your current home stereo to your Media Center
    PC.


    # Sound Card


    Your Media Center PC comes with a sound card that enables you to import analog
    music into your PC and send either digital or analog music to powered speakers
    or an amplifier connected to regular non-powered speakers.


    Most sound cards have the following connections:


    +   - Line In for direct connection to another audio device.

    - Mic for capturing live audio using a microphone.

    - Line Out for output to a TV, powered speakers, or an amplifier.

    - Headphone Jack for listening to audio using headphones, or it can be used as
    a Line Out connector.'
