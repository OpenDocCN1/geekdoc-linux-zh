  md: '# Chapter 14


    # Listening to Broadcast and Internet Radio


    If you''ve only ever listened to an FM radio station and heard a song you like
    or a comment from someone, probably wished you could hear it again. If you were
    listening to FM radio on Media Center PC, you could. Media Center can pause and
    rewind live radio broadcasts. How cool is that? If your Media Center PC is equipped
    with an FM tuner you will love listening to the radio. In the same way that Media
    Center makes watching TV and listening to music a whole new experience, it works
    same magic for a totally unexpected experience with radio.


    This chapter looks at how to listen to FM radio, and also Internet radio stations
    if you are connected to the Internet.


    # Tuning to FM Broadcasts


    As the heart of your home entertainment center, if you have an FM radio tuner
    in your Media Center PC, then you have the ability to play FM radio broadcasts—just
    like your home stereo.


    Radio is only present in Media Center if your computer has an FM tuner as part
    of the TV tuner card that you came with your PC, or when you subscribe to an Internet
    radio service as Live 365 from Online Spotlight as featured in Chapter 19. When
    an FM tuner is present or if you subscribe to an Internet radio service, Media
    Center adds ''Radio'' as one of the menus on the Start Screen. If your computer
    does not have an FM tuner, or you have not subscribed to an Internet radio service,
    the Radio button will not be present on the Start Screen.


    # Note


    If you don''t have an FM tuner you can upgrade your TV tuner card to one that
    includes FM radio tuning. This requires removing your old TV tuner card and installing
    a new one with FM tuning. Windows XP will recognize the new hardware and update
    your system files. The next time you start Media Center, a Radio button will be
    present on the Start Screen.


    237'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Connecting an Antenna for FM Reception


    Your TV/FM tuner card has two antenna connections: one for connecting your TV
    antenna or cable from a set-top box, and another for an FM antenna. They will
    both be coaxial connectors as shown in Figure 14-1.


    # Note


    Without an antenna, you will not be able to tune to FM broadcasts. Some really
    powerful local stations may be strong enough to be picked up by the connector
    on the card, but you will not be able to get all of your local stations without
    one.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_258_0.png)


    Figure 14-1: FM antenna connector on the TV/FM tuner card.


    Getting the right type of FM antenna is important. If you have a radio or home
    stereo you may be using a simple single-wire or dual-wire antenna that hangs off
    the back of your stereo or radio. Wire antennas attach to the stereo or radio
    using screw connectors on the back of the set. It is possible to use such an antenna,
    but you will need an adapter that allows you to connect the wires to a coaxial
    connector. Such converters are available at electronic stores such as Radio Shack.


    A better solution is to get a good FM radio antenna. They come in two varieties:
    amplified or passive. The amplified version boosts the FM signals if you live
    in a building or an area where reception is not good. The passive version does
    not boost the signal and is good if you live in an area without reception problems.
    Because the passive versions are inexpensive (around $10) versus the more expensive
    versions ($30–50), you may want to try a passive antenna first.


    # Tip


    Another solution for getting FM reception is to use an inexpensive set of "rabbit
    ears." A low-cost TV antenna will also allow you to pick up most radio stations
    in your area.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Chapter 14: Listening to Broadcast and Internet Radio 239


    Regardless of which antenna you use, be sure that it has a coaxial connector to
    allow it to connect to the TV/FM tuner. Figure 14-2 shows a passive FM antenna
    from Radio Shack that does a great job in most areas and is available for under
    $20 in many electronic stores.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_259_0.png)


    **Figure 14-2:** A passive FM antenna from Radio Shack with coaxial connector.


    Connect your FM antenna, and once you start listening to FM radio on your Media
    Center PC, be sure to play with its position in the room. Moving the antenna to
    various locations sometimes improves reception. If your reception is poor with
    a set of rabbit ears or a passive FM antenna, try an amplified FM antenna.


    # The Radio Menu


    With an FM antenna attached, you are ready to listen to FM radio using Media Center.
    From the Start Screen, you should have Radio on the menu, as shown in Figure 14-3.
    If you don''t have Radio, it means you do not have an FM tuner as part of your
    TV tuner card.


    After clicking the Radio button, you are brought to the Radio menu, as shown in
    Figure 14-4. Since its your first visit to Radio, the screen does not contain
    any radio station presets, and has the following items on the menu:


    +   - **Internet:** This button takes you to Internet radio stations if your computer
    has an active connection to the Internet.

    - **Start FM:** To begin FM radio stations, press this button to activate the
    FM tuner.

    - **Station:** This is where you can enter a station, or see what station is currently
    tuned.

    - **Save button:** Saves current station to a radio station preset.

    - **Seek buttons:** Clicking these finds the next strongest station.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# 240 PC Magazine—Guide to Windows XP Media Center 2005


    +   * Tune buttons:** Clicking these moves to the next higher or lower station
    regardless of signal strength.

    * **1-9 preset buttons:** Once you have added presets, buttons 1 through 9 allow
    you to tune directly to the present stations.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_260_0.png)


    Figure 14-3: Radio on the Start Screen.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_260_1.png)


    Figure 14-4: The Radio menu.'
