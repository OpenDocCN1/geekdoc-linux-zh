  md: '# Managing Music libraries


    One thing you learn pretty quickly when creating and working with Playlists is
    that information about songs is a big part of managing your music library. As
    detailed earlier in the chapter, each song in your media library has a "tag" that
    identifies much more than its name and file location. To effectively use Media
    Center, you get familiar with how to manage your music library.


    In addition to tagging your music files, when you get music from the Internet
    or from audio CDs you will want to manage where they are stored and also what
    format and amount of compression you want to have. Let''s start with converting
    audio files from CDs.


    # Copy Music from Audio CDs


    Rather than playing CDs—and constantly moving them in and out of the optical drive—it
    makes more sense to copy them to your hard drive and include them in your music
    library. Then you''ll be able to add tracks to Playlists and not worry about using
    the original CD when you want to hear a song from it. To make that, you need to
    choose which method and program you use to copy CDs.


    Media Center uses Windows Player to copy music to your hard drive. When you use
    Media Center to copy an audio CD, it will use any settings you have made in Windows
    Player to make copies. By default, Media Center only offers you the choice of
    saving music in the native WMA (Windows Media Audio) format. Windows Media Player
    also supports plugins for saving music as MP3 files, which might be a better choice
    if you want the files to be compatible with other hardware as possible.


    # Note


    If your computer did not have an MP3 plug-in or at least a trial version of one,
    you can obtain an MP3 plugin from the Tools menu of Windows Media Player. From
    the menu bar choose Tools �� Plug-ins ⮛ Download Plug-ins. You will need to be
    connected to the Internet and be prepared to pay—they cost ten bucks each.


    > MP3 is a pretty big deal when it comes to being a widely used music file. Portable
    music players, home DVD players, and a large number of programs all support MP3.
    As a compression format, it allows you to compress music files with acceptable
    quality. WMA is also excellent for compressing music files and is supported by
    an ever-growing list of devices.


    Based on how you use your music files, choose the format''s best for you. If you
    have an MP3 player, you''ll probably want to copy all of your music as MP3 files.
    If you only plan to use your music in Media Center or Windows Media Player, WMA
    will work great. The good news is that Media Center and Windows Media Player play
    both formats, so you can use MP3 files without concern.


    # MAKING MP3 FILES


    If you want to save your music as MP3 files, you will need to leave Media Center
    and go to Windows Media Player or any third-party tool ⮛ you may currently use
    for creating MP3 files.


    In Windows Media Player, choose Tools ⮛ Options ⮛ Copy Music. The Copy Music menu
    appears. Under Copy Settings, you can choose from a variety of formats. If you
    have an MP3 plug-in, this is where you select it for use in Media Center. The
    Copy Music menu is shown in Figure 13-19.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# # Chapter 13: Managing Playlists and Music Libraries


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_251_0.png)


    Figure 13-19: Selecting MP3 as the CD format.


    In addition to copying the MP3 file, the Copy Music menu also allows you to decide
    which directory and folder to save files to. The default directory is the My Music
    folder in My Documents. This may not be the best place to store your music files
    if you have a lot of them, or if you have added a second or external drive for
    storing media files.


    # ## Note


    If you choose to store your music files in any place other than the My Music folder
    in My Documents, be sure to create a shortcut to that location and place it in
    the My Music folder. Media Center will only look in My Music so the shortcut to
    yours is critical.


    Once you choose the file location and want to save your music files as MP3s, you
    can also choose how much compression they saved with. The rules are simple: smaller
    files compress the more and reduce the quality of the sound. To keep the sound
    quality as good as possible, use the least compression possible. If you are storing
    your files for use only on your computer''s hard drive, use the highest quality
    setting if you have enough space. If you plan to use your files on a portable
    device such as'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# 232 PC Magazine—Guide to Windows XP Center Edition 2005


    MP3 player or an iPod, you will need to consider how many hours of music you want
    to store on and possibly use a higher amount of compression to reduce the file
    sizes.


    Once you have made decisions, the next time you choose to copy an audio CD from
    Media Center, it will use these settings.


    If you have a ripping program that you use and like, continue to use it but follow
    these guidelines:


    +   - Be sure you know the location where the files are being stored and add shortcut
    to the My Music folder in My Documents if you are not saving them there.


    +   - If your ripping program has an option for getting information about the
    song to fill in media information, be sure to select it.


    +   - If you can obtain copy protection for the song and want it, do so when ripping
    the song.


    These guidelines will give your music files ready to use in Media Center without
    extra steps later.


    # MAKING WMA FILES


    If you decide to copy your music as WMA files, you will still have to decide where
    your files are located and how much compression you want to save them with. Just
    as MP3 file settings, to make changes to Windows Media Player and choose Tools
    ➔ Options ➔ Copy CD, as shown in Figure 13-19. Rather than choosing MP3 as the
    figure, choose WMA as the file format. WMA has three settings to choose from.
    Just as MP3, there is a trade-off of size for audio quality. A good method for
    either WMA for MP3 compression is to copy one song at each setting and listen
    to it. If you are fine with the audio quality of a highly compressed file, try
    listening to it with headphones, in your car, in your living room—all of the places
    you will play it in the future.


    # Note


    Keep in mind that once you store a music file at high quality, you can save it
    again at some point at a lower quality. That is not true in reverse—you can''t
    copy from a low-quality setting to a higher quality setting and regain any quality,
    so be sure to be comfortable with your settings.


    Here are the three WMA formats:


    +   - Windows Media Audio: Tracks are copied at one constant compression rate.
    You can choose the quality level using the slider bar in the Copy Audio menu.


    +   - Windows Media Audio Bit Rate Mode: Tracks are copied using a variety of
    compression rates within a track, adding as much compression as possible when
    needed to create the best quality audio with the smallest file size.


    +   - Windows Media Audio Lossless Mode: Tracks are saved at essentially the same
    quality as the CD they came on.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Chapter 13: Managing Playlists and Music Libraries 233


    After you choose your compression rate and file location, Media Center uses these
    settings time you copy an audio CD.


    # Media Files that Work with Media Center


    If you have been ripping your CDs and purchasing or downloading music online for
    awhile, you probably have a large music library that you want to use in Media
    Center. Even though WMA and MP3 are the primary methods for copying music into
    Media Center, it supports most common audio formats.


    Table 13-3 lists audio files that are supported by Media Center, along with their
    file extensions to help you identify your files.


    | Format | Extension(s) |

    |---|---|

    | CD audio | .cd |

    | Windows Media audio files | .asf, .asx, .wax, .wm, .wma, and .wmd |

    | Windows audio files | .wmp, .wmx, .wvx, and .wav |

    | MP3 | .mp3 and .m3u |


    By some reason you have music in a format that is not supported, you can use a
    file utility to convert the files to one of the preceding formats.


    When working with existing files, they may not have media information attached
    to them. Windows Media Player attempts to find media information about your files
    as they are used. This requires a connection to the Internet. If you don''t add
    tags to your existing files or you don''t have a connection to the Internet that
    you want to use for this purpose, go to Windows Media Player and choose Tools
    Options Media Library. Uncheck the box for automatic music information updates
    as shown in Figure 13-20.


    # Music You''ve Bought Online


    Online music purchases add an additional level of complexity—licenses.


    When you purchase music from online music services, they are actually selling
    you a license to play the file that you downloaded on your computer with specific
    number of copies to a CD. For this reason, most stores require either their "application"
    to download music or that you have Windows Media Player manage the license.


    The applications that you must use with music services such as Napster, iTunes,
    Rhhapsody, and other services gladly manage the licenses to the music you purchase
    and control digital copying. These applications are pretty good at copy protection.
    If you try to copy a song to a format around the copy protection, they won''t
    let you do it.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# 234 PC Magazine—Guide to Windows XP Media Center 2005


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_254_0.png)


    Figure-13-20: Controlling automatic music information updates.

    The good news is that the licenses are fairly fair. You can usually play the music
    for as long as you


    on your computer and then make a limited number of CD burns with.

    When you purchase from sources, they issue a license for it and that license contains


    restrictions on how it is used. Windows Media Player looks for the licenses when
