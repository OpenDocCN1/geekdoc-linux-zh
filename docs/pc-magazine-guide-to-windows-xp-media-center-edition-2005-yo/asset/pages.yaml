    # To VR or not to TV?


    Many retail sellers of Media Center PCs such as Best Buy and Circuit City bundle
    15” or 17” LCD displays with Media Center PCs. I am always amazed at that bundle;
    the magic and dazzle of a Media Center PC is that you can use it with a TV, but
    I have yet to see one that promised at a retail outlet. Not one had their Media
    Center PCs hooked up to a TV, and never would do that for him. Finally hunted
    down a store that made the connection for him and saw a Media Center PC hooked
    up to a 42” plasma TV. He bought the computer—and the 42” plasma TV.


    If you plan to use your Media Center PC in your living room or family room you
    may want to take a pass on the LCD display bundle. If you are in the market for
    a new TV, as if the retailer can give you an good “bundle” deal with a TV in place
    of the LCD display.


    Media Center PCs come in five basic form factors. Each has its advantages for
    different locations and applications.


    # Tower


    Towers are just what their name imply: They are large, vertically oriented oblong
    boxes originally as office equipment and for use. They are easily expanded and
    are low-cost. Most Media Center PCs are being sold as vertical towers like most
    PCs in retail outlets. The reason for this is that it’s cheaper and easier for
    manufacturers to take an existing PC and add on the components that make Microsoft’s
    Media Center PC requirements than it is to create a new form factor cases.


    The only problem with the tower factor is that it looks like an office PC; it’s
    not really a machine that belongs in a living room. Additionally, the vertical
    shape is unfriendly to all entertainment center shelving and furniture. If you
    take pride in the appearance of your entertainment center you need to consider
    if this factor is right for you


    Manufacturers such as Sony and Hewlett-Packard have recognized this issue and
    the Hewlett-Packard line, for example, others Media Center PCs with a glossy black
    and front panel with all connectors available from the front hidden by wires when
    not in use (Figure 2-1). It’s a clean, polished look, the vertical factor is still
    perfect for entertainment center


    If you plan to use your Media Center PC in an office or a location that can work
    with a tower, this will factor cost into find a great value. Because these machines
    share the casing and parts with their regular PC lines, larger manufacturers can
    produce them at a low cost and service them easily. They are also easily upgraded
    and expanded, making it simple to add hard drives and expansion cards.


    For overall, choice of retailers, and expansion options, the tower can’t be beat—if
    you can live with it in your entertainment center.'
