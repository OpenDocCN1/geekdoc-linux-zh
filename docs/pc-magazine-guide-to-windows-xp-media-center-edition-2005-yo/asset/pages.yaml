  md: '# Chapter 19


    # Accessing Internet Content from Online Spotlight


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_317_0.png)


    You now probably are wondering why Media Center does not include a Web browser.
    It does make extensive use of the Internet—mainly to get data and music licensing
    rights. As a part of the Windows XP operating system you would think that going
    to the Web would be a snap for Media Center. It is one of the reasons for the
    lack of a traditional Web browser like Internet Explorer is the very nature of
    Media Center itself; it''s a TV experience. Web sites are not formatted to work
    for TV viewing.


    By controlling what content you access with Media Center, Microsoft assures that
    the Web content you do see display correctly on a TV and match the overall user
    interface of Media Center. As time goes on, and more content providers will begin
    to format products to work in Media Center, so the future looks bright.


    Even though it is highly disguised, Media Center does have a Web browser function:
    Online Spotlight. Mixing content on the computer and content from the Internet,
    it creates a Media Center Internet solution that works well on any display, whether
    you''re using a remote control or mouse and keyboard. This chapter looks at Online
    Spotlight and some of the content and information you can get to with.


    # Note


    Really need to get to the Internet? You''re using a full-powered PC. Leave Media
    Center and use your favorite Web browser in Windows XP. Be sure to switch to a
    computer monitor if you are currently using a TV for Media Center.


    # An Internet Portal


    If you are familiar with the term portal, you will quickly start to think of Online
    Spotlight as a very strict portal for Media Center. The only online content you
    can get to is the content chosen for you by Media Center.'
  merge: -1
  pgno: 317
- img_proc: true
