- img_proc: true
  md: '# Chapter 9


    # My TV and the Program Guide


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_155_0.png)


    To really understand what a Media Center PC is all about, if your PC is equipped
    with single or dual TV tuner cards, launch Media Center, go to My TV, and watch
    TV. Sit back and use the remote control. Change channels, adjust the volume, and
    get more information about the program you are watching. Pretty soon, especially
    if you are using a TV to view Media Center, you will forget you are using a personal
    computer. If Microsoft has done its job right, that''s exactly what should happen.


    Before the arrival of Media Center PCs, watching TVs, DVDs, and videos on a computer
    monitor was not very TV-like-like. The video did not look the same as a TV and
    the overall experience was complex and very computer-like. Watching TV should
    be enjoyable and as easy to operate as simply using a remote control. Media Center
    PCs made that a reality.


    By using a process video de-interlacing, Media Center addresses the fundamental
    difference between a TV display and a computer monitor—interlaced versus non-interlaced.
    TVs actually create the screen you see by making two sets of images appear as
    one. To create a smooth, flicker-free image at the slow refresh rate of TV, the
    screen is painted in two sets of lines, and even the result is an image that is
    jitter-free and good for motion—but not for small items and detail!


    Computer monitors are great at detail. Small type and details on the screen require
    high resolutions and fast scan rates. What is good for TV and even display does
    not make good for TV viewing. They do not interlace the image. Media Center processes
    video in a many ways that make it look like "TV" on a computer monitor in addition
    to TVs. Feuring video scaling, Media Center also allows TV to be displayed at
    any resolution and still look good.


    A good test is to TV program playing in Media Center on a high-resolution computer
    monitor full-screen. The TV shows the image at 320 x 240. The computer monitor
    may be at a much higher resolution, so from 1024 x 768. From 10 feet away, the
    picture should look the same on either display. It would also look good when you
    get a foot from the computer monitor. Media Center is optimizing the image for
    the video you are viewing in real time.


    Fast processors and dedicated video processors made this possible. So, whether
    you are using your high-resolution computer monitor or your regular TV connected
    to your Media Center PC, this chapter covers setting My TV in Media Center, controlling
    TV viewing, and using the Program Guide.


    135'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Display Configuration and Calibration


    Media Center enables you to change the overall contrast, weight of type displayed
    on the screen, and even the size of the fonts.


    It also enables you to establish what type of computer monitor or TV you will
    be. Computer monitors can be traditional "tube" displays (cathode-ray tubes, CRTs)
    or newer flat-panel monitors such as liquid crystal displays (LCDs). TVs can be
    standard CRTs, flat panels such as LCD, or new flat-plasma TVs or projection TVs.
    By choosing which type of display you are using, Media Center can deliver the
    sharpest, most pleasing picture. There are also a number of tools for adjusting
    your display—its color, contrast, image size, position, and brightness. At the
    end of the calibration process you will have fine-tuned both Media Center and
    your display.


    # Display Configuration Setup


    Following the "wizard" metaphor used to perform complex setups in a simple step-by-step
    process used in Windows XP, Media Center has a number of wizards for making TV
    adjustments. The first wizard you will want to use is the Display Wizard. You
    reach it by selecting from the Start Screen, then TV, then Configure Your TV or
    Monitor. That brings you to the start of the process shown in Figure 9-1.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_156_0.png)


    Figure 9-1: The first Display Configuration screen.


    The first screen explains that Media Center will make adjustments to the way things
    look on your display based on information you provide about it in the next few
    screens. After that, you will be able to make further adjustments to your display
    using its own controls.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Chapter 9: My TV and the Program Guide 137


    All you really need to know at this point is what type of display you will be
    using as your primary display. If you are using multiple displays, such as a computer
    monitor and a TV connected to your PC at the same time, you should enter information
    for the one you will be viewing Media Center most.


    9-2 shows the different types of displays that Media Center can make adjustments
    for. It is important to note that in the rapidly changing world of displays, some
    of the categories can apply to either a TV or a computer monitor. The choices
    are as follows:


    +   * Traditional TV or Monitor: A "tube" style display often referred to as a
    CRT (cathode ray tube).

    * Flat Panel: A flat-panel LCD (liquid crystal display) computer monitor or TV,
    and also a flat-panel plasma TV or computer monitor.

    * Rear projection: Almost always a TV.

    * Front projection: Most often a computer projector that can actually be used
