  md: '# Chapter 15


    # Viewing and Managing Digital Picture Libraries


    Most digital cameras can connect to a TV to display pictures on it. Doing this
    requires a special cable, and like any "extra step," most people don''t spend
    the time to set up their picture viewer. In the mid-1990s Eastman Kodak came out
    with the Photo CD. You could have a Photo CD made when you developed your film
    and then to copied to disc; the trick was that you needed a Photo CD player. It
    never caught on. Recently, most all DVD players had the ability to play JPEG files
    stored on a CD-ROM or DVD-R disc. However, this feature is not the reason people
    purchase DVD players.


    Anything that requires a special process, extra efforts, or special devices seldom
    popularity. Most digital photos are stored on a computer. It''s the logical place
    to store them once the memory in your digital camera gets full. You can perform
    image editing, you can e-mail pictures, or make prints from them and play slideshows.


    Computer-based slideshows have been pretty basic. They show one after another,
    sometimes with a nice transition. Windows XP has a slideshow screen saver that
    is very popular. It''s easy to use and with the operating system.


    A computer is the best place to store, edit, and print pictures, but not always
    the best for slideshows. It''s hard for a group of people to sit comfortably around
    the computer monitor to watch a slideshow. Media Center changes all of that. To
    a TV, digital photo libraries are one of the finest experiences when teamed with
    My Pictures in Media Center. Looking more like a video than a slideshow, pictures
    move, living things are displayed with stunning quality, and you even have the
    ability to mix music.


    This chapter takes a look at how to get all of your digital photos together for
    use in My Pictures. Chapter 16 takes a at making slideshows once you get comfortable
    working with pictures in Media Center.


    # Tip


    Don''t have a digital camera but have tons of prints, slides, and negatives? Most
    photo processing labs offer a service to convert your hard copy to digital files
    on a CD-ROM. You can also buy scanners to digitize prints for increasingly affordable
    prices.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Building a Digital Photo Library


    If you aren''t familiar with digital photos, this section will serve as a quick
    primer. If you have a digital camera, you can skip this section of the chapter
    and move to the “Managing Digital Photo Library” section later in the chapter.


    The gist of this section is that the only way to use photos in Media Center is
    to get them into a digital file. There are many of ways to get existing prints,
    slides, and negatives converted. You can do it by yourself using a scanner or
    send them to a service that will do it for you. Let''s take a look at what you
    will need in the way of files in each process.


    # Scanning Pictures Yourself


    Most people can do great job scanning prints on their own, and scanners are easy
    to use and inexpensive. Slides and negatives are a bit trickier and require more
    expensive scanners, but it is still possible to convert over them if you are one
    willing to invest the time and money. For scanning prints, you should look for
    a scanner with the following features:


    +   - Flatbed scanner with at least 1200 dpi resolution.

    - An easy-to-open lid, and preferably one that can be removed for pictures in
    books and albums.

    - A USB connection to your PC.

    - A scanning area of at least letter size and preferably legal size.

    - Software that allows repetitive scanning of the same size pictures, often referred
    to as multi-photo mode.

    - Depending on your needs, you may need a slide or negative scanning attachment.


    You can generally get such a scanner for around $100 or less. Scanners that cost
    more are for graphics and professional, but for home applications such as TV viewing
    and sending e-mails containing your photos, a low-cost scanner will serve you
    just fine. In the $100 to $150 range you should expect an attachment for scanning
    slides and negatives.


    Once you have attached your scanner to your computer, you can begin converting
    your pictures. Here are some simple settings that will ensure your pictures work
    well in Media Center, and for most of the uses you will have in them:


    +   - File Format: Save your pictures as JPEG files. Use the highest quality setting
    for JPEG.

    - File Size: A good size for 4” x 6” prints is 1200 x 800 pixels. Pictures scanned
    and stored at this size will display well on your TV or computer monitor and will
    be able to capture all of the information that was on the print. You are often
    required to set the dpi, or dots per inch for the scan. If you use 180 dpi, you
    should get close to the 1200 x 800 size image from a 4” x 6” print.

    - Number of Colors: Use the “millions” of colors settings. Other terms to look
    for are 24- or 32-bit color depth or 16.7 million colors.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Chapter 15: Viewing and Managing Digital Picture Libraries


    Using these settings you can quickly build a digital photo library from your existing
    shoeboxes full of photos.


    # Using a Photo Service to Scan Your Pictures


    For existing prints, slides, or negatives, you should check with your local photo
    processing service (including those at drug stores and supermarkets) to see if
    they offer a service for converting your hard-copy photos to digital files on
    a CD-ROM. If they don''t, you can find a number of photo services online that
    can do them for you.


    If you find such a service, they will take your prints, slides, and negatives
    and scan them for you. A labor-intensive process that often gets done by hand,
    can get expensive. The service will typically deliver the digital photos on a
    CD-ROM (usually as JPEGs) and return your originals to you.


    Many drug stores, supermarkets, and retailers like Wal-Mart and others have in-store
    scanning stations where you do the work of making the scans and they put them
    onto a CD-ROM for you. This is sometimes expensive, so always check around for
    a reasonable price.


    # Note


    The price for getting your photos to disc is very high when you use a service—usually
    at least 25 cents per photo and sometimes more. For a large collection of photos,
    you can easily exceed the cost of buying your own scanner.


    # Getting New Pictures in Hard Copy and Digital Format


    If you are using a "film camera" and are bringing your film in developing, the
    news is much better. Most photo services offer the option to deliver a CD-ROM
    containing digital versions of your photos along with your prints for as little
    as $3 extra per roll of film. This is a good deal and the quality of the digital
    photos is usually very good.


    The files that are delivered will most likely be JPEGs stored at least 800 × 600
    pixels, most over 1200 × 800.


    If you are a digital camera user, you are ahead in having your photos ready to
    use in Media Center; the photos are already digital so there''s no conversion
    necessary. Hopefully you have been moving your files from your camera''s storage
    card to your PC. If you haven''t, do so now. It''s the best, most economical place
    for them.


    # Managing Your Digital Photo Library


    Once you have your pictures in JPEG format from scanning them yourself or having
    your photo retailer do it for you, you are ready to move them to your Media Center
    PC. Regardless of how you get your pictures into your PC (scanned from prints,
    slides, or negatives from a digital camera), you will need to organize them a
    bit to effectively use them in general, and slideshows in particular. Folder'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# 254 PC Magazine—Guide to Windows XP Media Center Edition 2005


    names, file and dates will all play a role in using your photos in Media Center,
    so it is good to manage your photo library with that in mind.


    # # File and Folder Names


    Most digital photos have names that do not actually describe the photo—unless
    you have done the hard work of going in and renaming all of your picture files.
    Most people don’t do that. Rather, they organize the picture folders in folders
    that describe the photos inside of it, such as “Mom’s Birthday 2002” or “Graduation
    Day.”


    That works well because the photos from a digital camera, for example, have unintuitive
    names as IMG00023.jpg. When you get a large folder full of pictures named that
    it’s hard to know what the pictures are. Figure 15-1 shows a typical folder full
    of pictures from a digital camera. Can you tell which photo you want to view?


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_274_0.png)


    **Figure 15-1**: Digital camera file names are not descriptive.


    When you scan your photos, you probably will take the effort to name the files,
    and that is a real plus. It’s okay if you don’t it and use whatever name the scanning
    software assigns them. Again, the important thing is to store concentrated groups
    of photos from one occasion in a folder'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Chapter 15: Viewing and Managing Digital Picture Libraries


    whose name describes the photos you. Don''t be afraid to use dates in the folder
    name—it really helps organize your photo library.


    # File Dates


    Whether from a digital camera or pictures you scanned and saved as a file, each
    file has a name and a creation date. You will learn that photo files can be sorted
    by their date. That can be good for digital camera files since it means the date
    was taken, it doesn''t work that for pictures you got from a photo service or
    scanned yourself. In those cases the file will be for the day the picture was
    scanned and may be well off of the date the picture was taken.


    In addition to the file name and creation date, Windows XP also keeps track of
    when the photo was last modified (any actions such moving the file or editing
    it) and the last access date. Figure 15-2 shows information for a picture file
    from a digital camera. Right-click on the file and choose to see this information.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_275_0.png)


    Figure 15-2: File name, creation, modification, and access dates for a digital
    picture.


    As you can see, the created date is important for identifying a picture. If you
    have not set the clock and calendar on your digital camera, you will have a hard
    time organizing and sorting your photos by creation date.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# 256 PC Magazine—Guide to Windows XP Center Edition 2005


    When you scan your own photos or a service do it for you, you will not be able
    to modify the creation date, by naming the folder they are in a date with your
    best way of organizing them by date.


    # Finding Picture Files


    Once you have moved as many of your digital photo files to your PC as possible,
    name your folders and organize your folders in a way that makes each picture easy
    to find and identify. You can store the folders anywhere on your computer, and
    Media Center will take you through the same process of finding media files with
    My Music where you identify the locations of folders that contain pictures.


    To add picture folders to My Pictures, go to the Start Screen, select My Pictures,
    and from the My Pictures click the Find Pictures. From the next menu, Add or Remove
    Folders, choose to Add Folders. Next, decide if you will be only adding folders
    from the Media Center PC you are working on or from shared folders from another
    computer. After making that selection and clicking Next, you arrive at the Picture
    Discovery menu, as shown in Figure 15-3.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_276_0.png)


    **Figure 15-3**: Select the folders that contain picture folders from the Picture
    Discovery menu.


    It is important to note that the folder selection routine looks out all hard drives,
    CD and DVD drives, plus attached media drives (such as a compact flash or SD card
    reader), you can add'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Chapter 15: Viewing and Managing Digital Picture Libraries 257


    folders from your digital camera or disk full of pictures such as a Picture Disk.
    These must be present in your computer for the pictures to be viewed.


    Put a check mark to the drives, folders, or devices where your pictures are located
    and select Next. A confirmation will list the folders. If you missed any, click
    the Back button and make changes. If everything looks right, You will be added
    to My Pictures and each time you enter it will scan the folders for any additions
    or deletions of files. You can go back to the Find Pictures menu to add or remove
    folders.


    # Files from Your Digital Camera


    Media Center can view photo files that are stored on digital media such as Compact
    Flash and Secure Media. The problem with having photos on media is one of convenience—you
    must out and put the card in the computer each time you want to view them. The
    same is true for photos stored on a CD-ROM. They are safe, but you will view them
    only if you have to remember to put in the disc and remember which disc holds
    pictures!


    You can move files from your digital camera within Media Center by simply attaching
    your digital camera to your PC with its USB cable. When connected, Media Center
    will recognize the camera and present it as a folder in the My Pictures menu like
    any other folder. When you open the folder, you can copy the files from the camera
    into your My Pictures or Shared folders and delete them from the camera if you
    choose.


    Media Center can display just any file created with just any digital camera. At
    this point, it''s important to plan how you want to view your digital camera files—all
    at once or in a whole from a memory card or CD-ROM.


    At this point you are ready to start viewing your pictures.


    # Viewing Photos in My Pictures


    With expertly organized photo files, you are now ready to view them from Media
    Center. If there is a photo file or shortcut to it in your My folder, choose My
    Pictures. Media Center will be able to display it.


    From the Media Center Start Screen, choose My Pictures. You will see the My Pictures
    menu, as shown in Figure 15-4


    Using the user interface as all of the other parts of Media Center, My Pictures
    is highly visual while giving you plenty of tools to find and manage your photo
    library. The right section of the screen contains visual representations of each
    of the folders containing pictures from the folders you added. If you used the
    Thumbnail view of folders in Windows XP, you will be familiar with this method
    of saying “see into” folders. Individual files located in the My Pictures folder
    will be identified as single icons of the picture.


    Let''s take a look at all the elements on the My Pictures menu:


    +   • Thumbnails: Visual previews of photo folders and files you can view.


    +   • Play show button: Plays a slideshow of


    +   • Sort by name/date buttons: Sorts the folders by their name or creation date.


    +   • Create CD/DVD button: Allows you to copy your pictures to a CD or DVD.'
