  md: '# # Introduction: The Living Room Revolution


    Perhaps you''ve been a participant in many of the recent technology “revolutions.”
    If you''re like me you''ve probably seen writing go from typewriter to desktop
    publishing, cameras from film to digital, recorded music from vinyl albums to
    cassettes to CD-ROMs and not to MP3s downloaded from the Internet.


    It is doubtful that today you would want to purchase a turntable, cassette deck,
    or even a CD player—except perhaps to play old recordings you have. You probably
    could add film cameras and typewriters to that list too.


    Now I''ll pose the next question to the children of the revolution: as of today
    you would a personal computer, DVD player or recorder, MP3 jukebox, or any personal
    video (or PVR) device such as TiVo or ReplayTV?


    I hope not! You''re a child of the digital revolution and those devices are the
    problem, not the solution.


    If you''re reading this book, you have heard the news: For the price of a good
    personal computer you can have one device that can:


    +   - Play, record, and store hundreds of hours of TV programs.


