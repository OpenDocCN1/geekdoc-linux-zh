    One computer, the Media Center PC, makes the connection to the Internet, and all
    other devices and computers use that connection. If you are using dial-up service,
    your Media Center PC is the device that dials to the Internet, and all other devices
    use it.


    In a wired network, each device connects to the router via an Ethernet cable.
    In a wireless network, each device (except for the Media Center PC, which connects
    to an Ethernet cable) connects to a wireless adapter that communicates with the
    router, and the router can also connect wired devices to the network.


    Once all the devices are attached to the network, you can use a network wizard
    in Windows XP to establish the connection to the hub to each device and establish
    the level of file sharing and access to the Internet. Your router and network
    hardware also come with installation software that will guide you through the
    process.'
