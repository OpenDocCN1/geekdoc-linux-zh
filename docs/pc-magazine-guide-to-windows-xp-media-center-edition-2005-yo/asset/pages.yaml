  md: '# Chapter 9: My TV and the Program Guide 143


    Figure 9-9 shows the test for brightness. This test applies equally to both TVs
    and computer monitors. The test shows a man in a black suit with a black shirt
    and tie standing in front of background containing a solid white and a solid black
    area. In the black area of the background there is an “X” moving in the area.
    The X is black too.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_163_0.png)


    Figure 9-9: The Brightness test.


    If the brightness on your display is adjusted correctly, the man’s suit should
    appear black, not gray. The tie and shirt should also appear black with some highlights
    and detail, and you should be able to distinguish the shirt from the suit. The
    X moving in the background should be barely visible, and once again, black, not
    gray. The image should be bright enough to see the suit and the shirt. If the
    suit is gray, or you can see the X moving and it is gray rather than black, adjust
    the brightness on your display to make the grays appear black.


    Figure 9-10 shows the next test, which is for contrast. This setting affects the
    level and clarity of white in the image.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_163_1.png)


    Figure 9-10: The Contrast test.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# 144 PC Magazine—Guide to Windows XP Media Center Edition 2005


    Contrast affects the overall image and provides detail and clarity in general.
    It helps distinguish details in areas of similar tones and is one of the most
    important display adjustments along with brightness.


    In this test you see a man in a white shirt. The shirt has wrinkles and details.
    Turn up the contrast as high as possible without losing the shadows, wrinkles,
    or details in the shirt. There is a pool cue in the background. It is both black
    and white. Be sure that you adjust the contrast stick is perfectly straight and
    smooth. This is particularly important with CRT displays where there can be a
    variation of brightness and contrast.


    The final calibration is for RGB color balance, as shown in Figure 9-11. RGB stands
    for red, green, and blue, which are the three colors used by computer monitors
    and TVs to make all colors by combining varying percentages of each. When an equal
    amount of color is combined, it makes gray. For example, 50 percent red, 50 percent
    blue, and 50 percent green creates 50 percent black, which is gray. This test
    makes sure the RGB settings are adjusted properly by displaying a set of gray
    bars. To adjust your display color, adjust the color settings on your display
    to make all the bars appear in shades of gray with no color tint.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_164_0.png)


    Figure 9-11: The RGB Color Balance test.


    # Note


    You may need to go back and adjust the brightness and contrast settings when you
    adjust the color balance—they affect each other. You can go back to the Settings
    menu and run these tests at any time in the future, so if you notice that your
    TV show or pictures aren’t looking right, be sure to recalibrate your display
    using this wizard.


    After completing the RGB test, you are done with the display adjustments and can
    move on to setting up your Program Guide.'
  merge: -1
