    Media Center PCs aren''t amplifiers—they rely on powered speakers or connection
    to your current stereo for amplification and the quality of sound. What can they
    do better any home stereo has vast quantities of music and allow you to access
    it with ease. Whether you like using CDs, ripping your audio CDs to MP3 files,
    or downloading music off the Internet, PCs handle music extremely well.


