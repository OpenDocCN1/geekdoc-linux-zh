    # SINGLE AND DUAL TUNERS


    Although a TV tuner can tune into virtually any TV or signal, it can only tune
    to one channel at a time. Back to the “TV” metaphor, most likely your TV can only
    tune to one channel at a time. That works fine for TV viewing—with a Media Center
    PC, you might want to watch one TV program while you are recording. That doesn’t
    work using a single TV tuner card.


    To watch a live TV program while recording another TV, you need to have one tuner
    for the program you are watching and another TV tuner for the program to record.
    A Media Center with a dual tuner or two TV tuner cards enables you to watch or
    record two live TVs at the same time.


    This is an important feature for TV activity in general (you may simply want to
    watch one show while you are recording another, or two shows at once), but it’s
    critical if you want to use your Media Center PC as the entertainment in your
    home. If you are using a home network and extenders that allow other TVs to access
    your Media Center PC content, you do not want to force others to view the program
    you are watching. Dual tuners enable them, through to view or record another program
    from the remote location.


    Even if you are the only user, dual tuners offer the greatest control over recording
