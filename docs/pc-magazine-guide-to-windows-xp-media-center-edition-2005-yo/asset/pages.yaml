  md: '# Chapter 11: Playing and Burning DVDs 189


    # Aspect Ratios


    Movies on DVD come in a variety of aspect ratios. A movie that fills a standard
    TV screen is in the 4:3 aspect ratio, which was the standard for TV screens until
    recently DVD began delivering movies in the aspect ratio in which they were originally
    made, typically 16:9. The widescreen version of a movie when played on the standard
    TV will contain a black set of bars above and below the widescreen presentation
    (this is sometimes referred to as letterbox).


    Many newer TV sets are being made in the widescreen format. This allows all the
    pixels on the screen to be used to display the movie and allow it to fill the
    screen. Most widescreen TVs have an automatic method for detecting a widescreen
    video and the set switch to a format that does not show the black bars, allowing
    the movie to fill as much of the screen as possible without distorting the aspect
    ratio.


    Media Center treats DVDs as if they were displayed on a standard 4:3 TV. If you
    play a widescreen movie, it will have the black bars at the top and bottom. If
    you are using a widescreen TV or computer monitor, it will auto-adjust to fill
    the screen, or you can use manual controls to switch to the widescreen format
    and cut off the black bars. Figure 11-11 shows a widescreen movie playing on a
    4:3 TV that includes the black bars required to display correctly without distortion.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_209_0.png)


    Figure 11-11: A widescreen format movie playing on a standard 4:3 aspect TV.


    Until the world once again settles on a standard for aspect ratio for TVs, black
    bars will likely appear on your display at times based on the video you are watching.


    # Burning TV Programs to DVDs


    If your Media Center PC equipped with a DVD burner such as a DVD+/RW drive, or
    you have added one to your system, you can create your own DVDs in Windows XP
    and Media Center—if your computer came with special software for this purpose.
    Don''t worry if it didn''t, you can add a program to burn the TV shows you recorded
    to DVDs.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# 190 PC Magazine—Guide to Windows XP Media Center Edition 2005


