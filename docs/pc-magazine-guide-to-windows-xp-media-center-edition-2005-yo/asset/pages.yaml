    and Auto Playlists. As you find tracks, click on them to add them to the Playlist.
    At any time you can right-click on tracks in the Playlist to delete them from
    the Playlist or change their order in the list. Figure 13-4 shows a completed
    selection.


    You can create as many playlists as you want and go back to Windows Media Player
    to edit them at any time. The Playlists you create in Windows Media Player will
    also be present in Media Center.'
