  md: '# Chapter 2: Setting Up Your Media Center


    The only thing I don''t like about this configuration is that I now have a DSL
    modem and router in my living room. I was trying to get away from wires and clutter!
    Luckily, they are small devices that are easily tucked out of view.


    # Media Center Extender Devices


    When choosing where to locate your Media Center PC and how to use it for both
    entertainment and office computing, the best solution is to use Media Center Extender
    devices.


    # Cross-Reference


    Chapter 8 takes a complete look at how Extenders work.


    An Extender is a small box that connects your TV to your Media Center PC almost
    as if directly connected as a monitor. The Extender adds the Media Center environment
    to the TV and enables you to access the user interface and media content including
    the TV source, such as cable or satellite signals.

    Extender devices make your TV set look, feel, and act just like a Media Center
    PC. This allows you to place your Media Center PC in the location of your choice
    and connect other TVs in the house using Extenders and your home network.

    Moving away from the networking configuration example in the previous section,
    I now have my Media Center PC in my home office and use Extenders for the TVs
    in my family room and bedroom. Now my Media Center PC powers all my TVs and I
    have access to all my recorded TV shows, videos, music files, and photos from
    every TV set.


    # Internet Connection


    If you plan on using your Media Center PC to access media content from the Internet,
    you will want a high-speed connection if you intend to download media files and
    access streaming media; these activities are like pulling teeth without a high-speed
    connection. Although it is possible to download media using a dial-up connection
    to the Internet, media files are anywhere from large to huge and will likely take
    so to download that you cringe at the thought of doing it with a dial-up service.
    Streaming video files using dial-up also results in a smash, low-quality situation
    that would be hard to view from the couch when using a TV.

    With high-speed Internet access you are no longer limited to the media that resides
    on your computer. A lot of fun having a Media Center PC is being able to venture
    out to get music and video content from the Internet. As you will learn, there
    are Web sites that allow you to "rent" movies that are downloaded to your Media
    Center PC for period of time. You can also purchase music, listen to radio, and
    share your pictures with friends and family. Just about any of those activities
    beg for high-speed Internet access.


    Prices for DSL and broadband services have come down significantly. I currently
    subscribe to DSL for $29.95 a month and I am happy with the service. You can usually
    find high-speed service from either your phone provider or cable system, but there
    are many new high-speed services not connected with a utility provider that may
    serve your area.'
