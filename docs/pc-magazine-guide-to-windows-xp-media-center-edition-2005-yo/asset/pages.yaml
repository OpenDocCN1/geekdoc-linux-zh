  md: '# 168 PC Magazine—Guide to Windows XP Center Edition 2005


    If you have scheduled a series recording, you can delete one show in the series
    or cancel the recording of the entire series. To cancel one episode in the series,
    go to the instance of the Guide, click on it, and follow the same procedure as
    canceling a one-time recording. This cancels the one and leaves the series recording
    in place. When you are returned to the Program Guide, the ''series'' recording
    symbol for that will be dimmed. This means that the show is part of a scheduled
    recording but that episode will not be recorded.


    To cancel the recording of the series, go to any occurrence of the series in the
    Guide and click on it. When you are at the show information screen, don''t click
    the Do Not Record button but click the Series Info button. From the Series screen
    you can cancel the series recording, as shown in Figure 10-9. When you return
