    your TV listings. Data is what creates your Guide and allows you to schedule recordings
    of TV shows.


    # # A New TV


    As incredible as your Media PC is, you interact with largely through your TV.
    With your TV being your window into a world of media content and adventures (not
    to mention just plain old watching TV), it should be the best part of your system.
    Prices of exotic new TVs like LCD and plasma TVs are now getting down to the point
    where you may want to seriously considering them as the ultimate addition to your
    Media Center PC and home entertainment center.


    As you will learn by the end of this book, it is possible to sit in your living
    room and doing tasks you used to do at a desk. With a high-definition TV (and
    wireless keyboard and mouse) you can use it for word processing, surfing web sites,
    and other traditional computing activities.


    # # Wireless Keyboard and Mouse


    If there is one thing I have about Media Center PCs that are being sold today
    that most of them are being sold with the same "wired" keyboard and mouse that
    come with a regular PC—in this view is a huge failure for use in a living room
    or family room setting.


    One of the requirements Microsoft should have placed on computer manufacturers
    using the Windows XP Media Center Operating System is that they sell them with
    a wireless keyboard and mouse. But, they didn''t. That means you will have to
    add one if you don not want to be tripping over wires or being tethered 6 feet
    to your Media Center PC.


    A number of wireless keyboard/mouse packages are available, but the one that I
    like and would highly recommend is the Media Center Remote and Keyboard from Gyration,
    Inc., which is both a Media PC remote and a mouse that is controlled by hand movements
    and motions. See Figure 2-11. "remote" combines a remote control that replicates
    the functions of the Media Center PC remote and a mouse that is controlled my
    hand movements and motions than moving it over a flat surface. This is a perfect
    solution for living room use. You dont need a coffee table for a mouse pad!


    The wireless keyboard is small, which is because the last thing you want is a
    large, clunky keyboard and this is just the right size. If you prefer a conventional
    keyboard with number and cursor keys, Gyration also sells wireless keyboards with
    that form. In addition, it has a wireless mouse that can be operated by hand movements
    or on a flat surface like any mouse.


    # # Putting It All Together


    With a great monitor, high-speed Internet access, and a wireless keyboard and
    mouse, you will have an amazing entertainment center powered by your Media Center
    PC. Now let''s look at all of that media power fits into your home.


    Where your Media Center PC ends in your home is an important decision. Each location
    you choose will require some modifications to your home and require good planning.'
