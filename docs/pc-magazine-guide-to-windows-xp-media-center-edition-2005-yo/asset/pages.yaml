    # # Pausing and Replaying Live Radio


    One that Media Center has no regular radio can pause a live radio broadcast for
    up to 30 minutes and replay up to 30 minutes of the broadcast.

    Using the same recording features found in My TV—you can think of Radio the same
    way when you watch TV in My TV—you are in control. Now you can replay a favorite
    song, go back and get an important phone number you heard in a commercial, and
    walk away without missing anything in a talk show by using the pause feature.
    How many times have you heard a song and wanted to know the performer and missed
    the answer saying who it was? Just rewind to find out if it was mentioned.


    # Note


    Although Radio has the same rewind and pause features as in My TV, it does not
    have a record feature. That is, you can''t record radio broadcasts like TV programs.


    If you have mastered navigating TV pausing and rewinding, you will know how to
    do the actions in Radio. Here are the methods to control pausing and rewinding:


    +   - Pausing Live Radio: Press the Pause button on the remote control or use
    your mouse to click the Pause button on the on-screen controls. If your keyboard
    has transport keys, press the Pause button.

    - Rewinding Live Radio: Press the Replay button on the remote control to move
    backwards in a radio broadcast in seven-second increments up to 30 minutes. You
    can move forward in'
