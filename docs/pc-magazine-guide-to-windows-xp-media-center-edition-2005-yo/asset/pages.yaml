    # Turning Channels and Adjusting Volume


    With all those buttons and items, you would think there would be some way to turn
    the channel or adjust the volume! Don''t worry; there are several simple methods
    depending on how you are controlling Media Center.


    To keep the screen clean just like a traditional TV, buttons for channel changing,
    volume, and muting are either on your remote control or appear on the screen when
    there is a slight movement of the mouse or action over the keyboard.


    If you are using a remote control, you can use either the channel up or down buttons
    to change channels, or can directly enter a channel number using the keypad. Volume
    controls and a mute key enable you to adjust or mute the sound, respectively.


    # Full-Screen and Window Viewing


    After getting used to the My TV menu, you will want to start using My TV to, watch,
    watch TV. This is easy as described earlier. Use your remote control or click
    on the video window and your screen with the TV program you are viewing—live or
    recorded. To return to the My TV, use the Back button on the remote control or
    the Back icon at top of the screen for the desktop controls when using a mouse.


    At that point you use your remote control/keyboard/mouse controls to change channels
    and perform actions in the full-screen mode. Program information will appear for
    a few seconds when you change channels and then softly fade away. When you adjust
    the volume, an on-screen volume meter will appear and then fade away.


    # Note


    At any time you can use the Info button on the remote control (or right-click
    the mouse) to get information about the program. This applies to both live shows
    and recorded shows. Basic program information is overlaid on the telling time
    of the show, the it started, its duration, and a brief description. There is also
    a More Information button to see the same screen you would see if you were using
    the Program Guide.


    Such features improve the standard TV viewing experience. Because you are using
    a Windows XP computer you can combine the world of TV viewing and computing. For
    example, you can reduce the program you are watching to a window on the Windows
    XP desktop to continue watching your program while using Windows applications.
    An example of this is shown in Figure 9-18.


    +   - Use your mouse to activate the desktop controls and use the "restore down
    button to size the screen down to a window. You can then use the mouse to position
    the Media Center window anywhere on the Windows XP desktop.'
