  md: '# Chapter 6: Getting Audio and Video In and Out of Your MCE PC


    # Powered Speakers


    Powered speakers have come a long way since the early days of hooking up a pair
    of tiny one-way speakers to a PC solely for the purpose of hearing beeps and warnings.
    Today, many powered speakers rival high-end amplifiers and speakers in audio quality
    and are made by the most prestigious audio manufacturers.


    The most typical configuration for powered speakers is a subwoofer with two small
    satellite speakers. The subwoofer takes the full task of providing lower frequency
    sounds—the bass and “bottom” to music and audio ever. The subwoofer handles the
    rumbling, room-shaking effect when viewing a DVD. Because human ears cannot discern
    the direction of such low frequency sounds, only one speaker is required either
    in a stereo or surround system.


    The smaller speakers provide stereo imaging and most all of the mid- and high-range
    sounds. Some of the best satellite speakers can be quite small, but regardless
    of their size, any audio system of quality is subjective.


    In a surround sound system, you will have two satellite speakers and a center
    channel speaker in addition to the subwoofer. Often referred to as a 5-1 system,
    you will have two satellite speakers for the front of the room, two for the back
    of the room, a center channel speaker for the front center and a subwoofer placed
    out of sight if possible.


    Powered speakers, with their names, come with their amplifier. Current systems
    can range from five watts of power to hundreds of watts of power. Long debated,
    the value of a high-watt system that can play sound without distortion is less
    important than the quality of sound at all. Even a low-watt system can provide
    excellent sound if the amplifier and materials used in the speakers and housings
    are well designed.


    If your Media Center PC has a set of powered speakers, they have been selected
    because they can play both music and movie soundtrack sounds well. Since you paid
    for them with your system, be sure to try them before looking for a more powerful
    or elaborate solution.


    # Connecting to a Stereo or Amplifier


    If you have a sound system or home stereo that you really like, you can use it
    rather than a set of powered speakers to provide sound for your Media Center PC.
    The only drawback in such a scenario is that it adds some complexity regarding
    volume control—your current system will not be controlled by your PC remote control.
    You will need to turn it on and off make adjustments—including volume—independent
    of your Media Center PC.


    You use some connectors and cables as a set of powered speakers. The Line Out
    connection from the sound card should be connected to the Line In of your stereo
    or amplifier. A typical connection from a sound card to a home stereo is shown
    in Figure 6-12.


    # ADJUSTING VOLUME


    You can make changes in volume level using a home stereo or amplifier either by
    using the volume control on the stereo, or using the Media Center PC''s own volume
    adjustments. A good method is to set your home stereo or amplifier at a fairly
    loud volume (just short of too loud and without any hint of hum) and then use
    your PC''s volume control at all times. Once you use this method you will only
    need to touch the home system to turn it on or off.'
