  md: '# Media Center PC as Network Hub


    The description of a home network in the preceding section is very basic. You
    should use the instructions and installation software that comes with your router
    and network adapters for the installation of the network. It will help you manage
    your network, your computers on the network, and guide you through the process.


    Before you begin such a process, you must think about building it from the diagram
    shown in Figure 8-1.


    Because your Media Center PC is going to pull the greatest demands on the Internet
    (such as Guide updates and downloading music and movies), you are going to make
    the most direct connection to the Internet. You would not want your Media Center
    PC to be connected to the network wirelessly. If it''s a wireless network, your
    hub device has a, wired connection to the router and the Internet (phone line,
    DSL or cable modem).


    Because you will be connecting Extenders to the Media Center PC, and because it
    also has the largest hard drives, it makes sense to have it be the primary“server”
    that feeds video, music, and picture files to Extender devices.


    # Note


    Whenever possible, you will want to serve media files directly from the computer
    that has them on the hard drive. That means you should use your Media Center PC
    as the primary computer for viewing media files. This provides the most reliable
    delivery of audio and video, because networks can slow down and affect their play.


    It may not always be possible to have your Media Center PC act as the hub due
    to proximity of your Internet connection or cable/satellite source. If there is
    no phone line, DSL, or cable/satellite connection where you view TV, you need
    to connect your Media Center PC to a wireless network hosted by another computer
    elsewhere in your home or apartment.


    This is not recommended, and you should consider running a phone line or cable
    line to the location of your Media Center PC, which would solve the problem.


    # Media Center PC as Entertainment Server


    Once you have created your home network


    In a home apartment, you have a number of entertainment devices: radios, TVs,
    and stereos. One of the problems in a home setting is that each of these devices
    has always stood alone. Each TV needed to have its own VCR or DVD player attached
    to it. Each stereo had to have CDs to play so CDs were scattered in different
    locations.'
