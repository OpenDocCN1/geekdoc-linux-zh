    # Getting Your Music Files Ready to Play


    Media Center works with Windows Media Player in Windows XP in a number of ways.
    As an operating system built as an extension of Windows XP, Media Center uses
    Windows Media Player as its musichandling engine—it manages the music rights and
    file management.


    # Note


    If you only plan to play audio CDs and do not plan to store music files on your
    hard drive, you can skip this step and begin playing your CDs directly from Media
    Center.


    # Content Protection


    Windows Media Player controls management and music licenses for Media Center.
    Let’s take a look at how Microsoft describes content protection:


    **About content protection for My Music**


    > Licensed or protected files are digital media files that are secured with a
    license to prevent illegal distribution. The license can specify whether it exists
    and how you can use the file. The terms of the license are specified by the person
    or company that provided the file. Just like in Windows Media Player, Media Center
    cannot play protected files without a license.


    > If you attempt to access a file that requires a license, you may be prompted
    to acquire a license before you begin playing it. There are different ways you
    can acquire licensed files, the most common way is to download them from content
    providers (such as record companies). The provider may issue a license when you
    download them. Otherwise, when you play a file for which you do not have a license,
    Media Center may require you to register, provide a unique player ID, or pay a
    fee, depending on the content protection.


    To work with the copy-protection parameters of downloaded music and music you
    burn from audio CDs, Music in Media Center must work hand-in-hand with Windows
    Media Player. When you use a music service such as Napster to purchase or listen
    to music from My Music, Media Center is managing rights and licensing.


    Modern-day music piracy from artists and the music industry has brought us to
    the place where copy protection is a fact of life. Accepting this, let’s look
    at how to set up your computer to allow Media Center to work with Windows Media
    Player to manage your music library so'
