    # # Summary


    Legal issues surrounding copying music and purchasing music online require Media
    Center to manage music rights. It does this by using Windows Player''s rights
    management controls. Before using any existing music files on your computer, you
    must first add them to Windows Player''s music library. Media Center will recognize
    and play all music files found in that.


    Media Center can play music files stored on your computer and also play audio
    CDs. Music from any source can be viewed by song, artist, album, genre, or playlist.
    You can find songs by performing searches that span the same categories.


    CDs can be copied directly from Media Center, and they are automatically added
    to the music library and use the same file formats and copy protection as Windows
    Media Player.'
