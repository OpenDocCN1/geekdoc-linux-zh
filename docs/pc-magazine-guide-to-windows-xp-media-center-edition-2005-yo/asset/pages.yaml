  md: '# 36 PC Magazine—Guide to Windows XP Center Edition 2005


    In creating a media PC, Microsoft has put Windows under the hood and put all of
    its features to work. Media Center works seamlessly with Windows XP. It uses the
    many functions, drivers, Internet connectivity, networking protocols, and system
    architecture that makes Windows the powerful computing environment that it is.


    The use of Windows XP as the underlying operating system for Media Center allows
    you to continue use all of the programs, drivers, and utilities that are available
    for any Windows PC. The good news is that you will be able to use it as a regular
    PC, which makes it an even greater value when you consider that you get a great
    entertainment PC, too.


    # Media Center PCS Use Windows XP


    As an operating environment, Media Center allows multiple users, obtains content
    from Internet sources, maintains files and directories, and manages media content
    and rights. Calling on video cards and TV tuner cards using DVD drives or playing
    files are all system-level functions.


    Media Center uses Windows XP to manage content, devices, and connectivity to the
    outside world through Internet. As a part of Windows XP, Media Center can use
    all of the content that you have created with Windows applications. This means
    your MP3 files, digital, and digital videos will work perfectly in Media Center.


    Media Center also uses the file structure and conventions (folders, directories,
    directories) that you are using in Windows. As you will learn, although Media
    Center uses those conventions to manage content, you will not see much of it.
    As a TV-centric environment it has simplified many conventions and does a lot
    of the work of locating your media files for you.


    There is particular integration between Media Center and Windows Player for managing
    music files. Media Player manages music libraries but also manages rights to play
    music when purchased or downloaded from the Internet. Media Center''s My Music
    application works hand-in-hand with Media Player and uses the same file and rights
    management.


    The integration of Media Center and Windows XP is seamless and as a user you will
    appreciate how well Media Center reduces the complexity of managing and using
    media with Windows XP. For media content, Media Center is a great environment.
    The Media Center portion of the interface has its limited to only those that have
    Media Center-specific content. It does not contain a Web browser like Windows
    Explorer. It does, however, use Internet Explorer with all of its security and
    protocol functions as the engine for connecting Media Center to online content.
    For computing or rapid surfing, you will always need to return to Windows XP.


