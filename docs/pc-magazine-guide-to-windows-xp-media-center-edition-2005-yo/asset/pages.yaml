  md: '# Chapter 9: My TV and the Program Guide 145


    # Setting Up My TV


    Setting up the Program Guide does more populate the on-screen guide with TV listings
    and information—it creates your channel lineup. The channel lineup is the list
    of stations that you can view on your Media Center PC.


    Although it may seem like a lot of work to set up My TV, the effort will pay off
    as you move to the next steps of watching TV and using the Program Guide.


    # Getting Program Guide Information


    To begin the setup of your Program Guide and channel lineup, select Settings from
    the Start Screen and then click Guide from the Settings menu. You are brought
    to the screen shown in Figure 9-12.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_165_0.png)


    From the Guide Settings menu, select Set Guide Listings. This takes you through
    the process of identifying your TV service provider and getting Program Guide
    data. You will need to be connected to the Internet during the process.


    After an initial screen detailing that you are to set up your Program Guide, the
    next screen gives you the chance to read a privacy statement relating to use of
    the Program Guide. As covered earlier in the book, to provide you with TV information
    needs to know where you are and located what channels you have access to. This
    information must be collected and stored to update your Program Guide on a regular
    basis, there is a privacy statement for you to read on the Program Guide setup
    screen. After reviewing it, if you agree to its terms you can select to use the
    Program Guide by clicking the Yes button at the bottom of the screen and then
    clicking Next.'
  merge: -1
  pgno: 165
