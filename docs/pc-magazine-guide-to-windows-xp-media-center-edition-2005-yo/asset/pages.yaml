  md: '# Chapter 2: Setting Up Your Media Center PC 25


    # Computer Monitor


    If you plan to use your computer monitor by itself or with a TV as a display for
    your Media Center PC, you will want to make sure that it is large enough for entertainment
    viewing.


    Most computer monitors, whether tube or LCD flat panels, will work perfectly as
    a display for Media Center PC. This is an item you should keep and use as you
    always have.


    # TV


    If you have not yet purchased a Media Center PC it is good to think about your
    TV now. If you have a quality TV, it should be capable of being your primary display.
    All Media Center PCs have video-out ports with S-Video and composite video connections
    that allow them to connect to a TV. Following are three tips when considering
    what display to use with your Media Center PC:


    +   - You can use composite video output, but if your TV has an S-Video input
    it is strongly recommended that you use it.


    +   - If the TV doesn''t fit the profile of one that will work well with a Media
    Center PC, you can use your computer monitor until upgrade to a new TV.


    +   - If you purchase a TV that can function as a computer monitor, I suggest
    that you connect it to your Media Center PC as a monitor using the 15-pin monitor
    connector rather than using the composite or S-Video connectors. The quality of
    the image will be better this way.


    # CATHODE-RAY-DIODE (CRD) TVS


    When dealing with a standard TV, your current TV may be perfectly good to use.
    Start looking at the back of your TV to identify type of video connections it
    has using the examples shown in Figure 2-8.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_45_0.png)


    As a starting point you should check your TV to make sure it has more than the
    coaxial antenna connection on all TVs. If it has either a composite or S-Video
    connector you will be able to connect your TV to your Media Center PC. You will
    not be able to use a TV that only has a coaxial antenna connection.'
