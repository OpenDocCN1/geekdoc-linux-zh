    # Media Center Experiences


    Once you are familiar with the Start Screen and become comfortable with navigating,
    you''re ready to visit the experiences that come with Media Center.


    Each program is explored in great detail later in the book, but for now we will
    take a look at all of the experiences and highlight their features.


    # My TV


    Media Center PCs are all equipped with TV tuner cards that enable you to view
    and record TV programs. My TV is the area where you view TV programs, search for
    them using a Program Guide, and schedule and replay recorded shows. The My TV
    menu is shown in Figure 4-7.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Chapter 4: Media Center Experiences


    # 63


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_83_0.png)


    Using My TV will change the way you think of watching television. By combining
    the power of a personal computer with TV viewing, Media Center adds new features
    and controls to the experience. The most important new features are as follows:


    +   **Digital Recording:** You can record TV programs to your computer''s hard
    drive. This allows you to schedule recordings or record the program you are watching.
    The TV programs are stored as files on your computer, you can also store them
    on DVDs using a third-party application.


    +   **Pausing and Replaying:** When you are watching live TV you can pause and
    rewind up to 30 minutes of the program, allowing you to “time shift” your viewing.
    Media Center is always recording live TV so it is easy to pause, walk away or
    answer a phone, and then come back to the same spot in the program and continue
    watching. You can rewind, fast forward, jump back to live TV at any time. Another
    feature is that if you are watching a program and 20 or 30 minutes into it you
    say to yourself, “Hey, I should have recorded this!” You can just rewind to the
    start and hit Record. It will start recording from that point.


    +   **Program Guide:** As an owner of a Media Center PC you have access to an
    on-screen Program Guide to view information about TV shows. The guide helps you
    plan your viewing and plays an important role in scheduling recordings. Searching
    with the guide allows you to find shows by title, genre, or keywords. You can
    even customize the guide to filter only the types of programs you like.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# 64 PC Magazine—Guide to Windows XP Center Edition 2005


    Watching a Recorded Program or Another Live Program While Recording: A nice feature
    included in Media Center is the ability to watch a program you have recorded while
    recording a live TV program, or watch another live TV program at the same time
    if you have dual tuners on your PC.


    Recording and ''time shifting'' with a robust Program Guide is just the beginning
    of features. Media Center supports 4:3 ratio displays and 16:9 widescreen displays.
    Picture quality on computer monitors is enhanced through video de-interleaving.
    My TV allows the display of closed captioning and supports Second Audio Programming
    (SAP) in both the live viewing and recording modes. You can view program information
    from the Program Guide during a live show or even once you have recorded it, as
    shown in Figure 4-8.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_84_0.png)


