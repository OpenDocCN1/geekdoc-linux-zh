    by holding the Ctrl key down so to select the group.


    6. Once you have selected the group of songs you want to edit, right-click on
    any of the songs and choose Advanced Tag Editor. The pop-up menu will contain
    a list of the tracks you have selected and you can edit each track or all of the
    tracks at once. In Figure 13-11, the genre is being changed to “Country” and will
    affect all of the tracks. This allows you to edit track information to any combination
    of tracks.'
