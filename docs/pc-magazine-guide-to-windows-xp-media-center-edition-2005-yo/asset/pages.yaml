  md: '# Chapter 7: Media Storage: Adding and Replacing Drives 107


    bay was open. The media card reader used little power and produced little heat
    so I was confident taping a second drive under it would solve my problem.


    # DRIVE SIZE AND STORAGE STRATEGY


    The types of files you store will determine how large of a second hard drive you
    should have. Table 7-1 gives typical storage estimates to help you determine how
    much additional storage you need.


    | File Type | Typical Size |

    | --- | --- |

    | MP3 File | 60MB per CD |

    | Audio File | 700MB per CD |

    | 2.1-megapixel JPEG | 1.2MB per picture |

    | Video AVI File | 14GB per hour |

    | Video MPEG File | 1GB per hour |

    | High Quality TV Recording | 3GB per hour |

    | Low Quality TV Recording | 1GB per hour |


    Any file that is compressed (such as MP3s and MPEGs) will vary in size, but these
    show a "worst case scenario" for your planning. Like the "Real-World Media Storage"
    sidebar earlier in the chapter, create an estimate of how many hours of music
    you want to store, how many photos and videos you have, as well as how many you
    will likely take in the next two years. Think about how many hours of recorded
    TV shows you want to keep. Using Table 7-1, you can calculate how much media storage
    you need.


    Next, consider how much data storage you have used in the past. This includes
    all of the files you used online, with word processors, spreadsheets, accounting
    programs, and files created in other applications.


    Finally, add it all up. A good strategy is to get a drive that is twice the size
    of your estimate. So, if your estimate is 80GB, get a 160GB drive.


    A good strategy to consider will help determine what drive size to leave your
    hard drive (your C drive) for programs and general data storage and designate
    the hard drive you are adding as your media drive. You can put all of your photos,
    music files, and recorded TV shows on your D drive. This helps manage your overall
    file storage.


    Hard drives come in a range of sizes. You can find drives from 40GB up to 250GB
    in most retail stores such as Best Buy or Circuit City. You can find larger hard
    drives at computer stores and through mail-order retailers. Prices are always
    coming down and rebates are common, so be sure to shop for the best price per
    GB.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# 108 PC Magazine—Guide to Windows XP Center Edition 2005


    # Tip


    Drives come in different speeds. Current drives are either 5400 RPM or 7200 RPM.
    Putting all arguments aside, it only makes sense to purchase a 7200 RPM drive,
    and preferably one with an 8MB buffer. The faster spin of the 7200 RPM drive makes
    the data transfer faster and the 8MB buffer also helps ensure recorded TV shows
    and videos play back without pauses. When you are recording one show and playing
    back another, you will be glad that you purchased a fast drive.


    Drives come with different interfaces and your owner''s manual will also list
    what type of drive is in your computer. Most Media Center PCs use an IDE drive;
    specifically, an EIDE model. Some models use ATA drives. Check with your manufacturer
    if you are not. Hard drive manufacturers also support numbers to help you choose
    the right drive for your PC.


    # INSTALLING AN INTERNAL HARD DRIVE


    Hard drives use common connectors and mounting systems, so installing one is really
    pretty easy. Generally about the only thing you will need is a Phillips head screwdriver.
    Usually you won''t need any software for installation—drives typically come formatted
    and ready to use right out of the box.


    Follow these steps to install a new hard drive:


    +   1. Check your computer''s manual to make sure that it has a bay for a second
    disk drive. That section should contain information on expanding your system and
    have diagrams and instructions on how to remove the case from your computer and
    reach the drive bays.


    # Caution


    Be sure to disconnect the power cable from the computer before starting.


    +   2. Next you should search to find where you will be mounting the hard drive
    and determine if there is an expansion cable connector available. If the cable
    goes only to the current hard drive and does not have a connector for a second
    hard drive, you will need to change the cable. Your new hard drive should contain
    a special cable for this purpose; it will allow you to connect both drives to
    the processor board. This cable is shown in Figure 7-1.

    3. Locate the power connector in your PC. This connector is shown in Figure 7-2.
    There may be several of these, and only one will work.

    4. After making sure you have an open drive bay, the right cable, and an available
    power connector, use a jumper to help identify the drive to the operating system.
    Drives are referred to in the system as *masters* or *slaves*. This helps the
    system to know which drive to boot from when starting the system— master. The
    second drive will occupy the slave position.'
