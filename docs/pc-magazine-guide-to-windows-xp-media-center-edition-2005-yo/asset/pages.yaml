    # User Interface


    The Start Screen acts as the main menu and establishes the look, feel, and navigation
    for all of the experiences of Media Center. Using a full-screen display, it is
    designed to be a portal to entertainment content designed for viewing and controlling
    from a distance. All of the icons, text, and menu items must be easily seen sitting
    away from the screen. For example, the interface should be readable and comfortable
    while sitting on a couch about ten feet away from a TV.


    This is important to consider because your first use of Media Center may be well
    when using a computer monitor. In that case, the type is large and the icons are
    huge. The amount of information on the screen at any time is limited when compared
    to programs running in Windows XP.


    Media Center has been designed to be a TV-like experience. The choice of colors,
    fonts, and subtle transitions between views how well does it work on a computer
    monitor? Well, it depends if you like to watch movies or TV ten inches away from
    the screen! Generally media viewing is best done from a comfortable distance while
    sitting back and relaxing. You probably won''t be sitting hunched over a keyboard
    with your elbows on a desk intently if you want to watch a TV program.


    When viewing media such as DVDs or TV, you will find Media Center''s user interface
    makes perfect using sense. One of the touches that is in screens Media Center
    look the same when using a TV or virtually any size and resolution of computer
    monitor.


    When you change the resolution settings of your computer monitor while using Windows
    XP, everything on the desktop changes size. Text and icons that are large at 800
    × 600 become tiny at'
