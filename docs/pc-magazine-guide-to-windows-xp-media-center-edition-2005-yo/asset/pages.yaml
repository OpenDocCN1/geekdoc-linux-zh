    # ADJUSTING TONE AND BALANCE


    Use your home stereo or amplifier tone, equalization, and balance controls to
    get the most desired sound. You can also make these adjustments from the PC using
    the sound control panel. In some cases both can produce an incredible range of
    control over the sound of your system.


    # Getting Sound Into Your System


    If you''re planning to capture audio from analog devices such as a cassette player,
    turntable, or other devices, connect it to your sound card using the Line In.


    Media Center does not provide direct support for such connected devices. Using
    Windows XP and an audio capture program (including the simple but effective Sound
    Recorder program from the Accessories/Entertainment start menu), capture the desired
    analog source and save it as an MP3, WAV, or WMV file. Once you''ve captured and
    saved the file, it will be recognized by Media Center and be played in My Music.


    # Summary


    Your Media Center PC connects to your current TV sources including antennas, cable,
    or satellite services and other analog devices such as a VCR. Using a TV tuner
    card your PC can play much in the same way as your current television set. Unlike
    a TV tuner, it can record, rewind, or pause live TV. Using a dual TV tuner card
    you can watch live TV while recording TV or have different live programs in different
    rooms when using extender devices.


    A TV or computer monitor can be used as the primary display and can be used at
    the same time. This allows the Media Center PC to be effective both as an entertainment
    device and as an office/home computer. The entertainment experience is completed
    by connecting the Media Center PC to either a set of powered speakers or a home
    stereo.'
