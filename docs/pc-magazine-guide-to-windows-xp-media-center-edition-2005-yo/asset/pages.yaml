    background with choices being black, white, or 10 percent increments of gray between
    black and white. Figure 16-3 shows a portrait-shaped picture against a solid black
    background.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_289_1.png)


    **Figure 16-3:** Solid black background chosen for pictures that show a background.


    With these settings you can change the look and feel of any slideshow. For family
    or personal slideshows, you may want to have transitions and view pictures in
    a random order with the slideshow including subfolders. For a formal slideshow,
    such as for a business presentation, you would want to include the folder for
    your slideshow, show them in actual order instead of random order, and choose
    to not use transitions.'
