  md: '# Chapter 8


    # Home Networks and Media Center Extenders


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_139_0.png)


    The cost and ease of creating a home network has come to a point where there is
    no reason not to network your home. If you have more than one computer, you can
    share an Internet connection, files, and have a central place, such as a large
    hard drive, for storing all of your files. Media Center goes beyond that. By using
    “Extender” devices, you can add Media Center functions such as recording TV, viewing
    the Program Guide, and playing music and videos from any TV. That means you can
    make every TV in your home an extension of Media Center without adding additional
    computers.


    This chapter takes a look at creating a home entertainment network with your Media
    Center PC as the hub and acting as your entertainment server.


    # Networking Basics


    If you not yet created a network with your PCs, this section gives you some basics
    on the process and what you will need.


    Windows XP has a number of wizards that will help you create your home network,
    but before you get far, you will need some networking hardware.


    There are two types of networks:


    +   **Wired:** A wired network connects each of your computers and devices with
    a wire, either Ethernet wiring or phone lines. For media serving, you will only
    want to consider Ethernet wiring due to its faster speed. Wired networks are the
    most reliable form of networking, but they have drawbacks for homes or apartments
    that are not already “wired.” It means running cables along walls or running wires
    through walls, which is not practical.


    +   **Wireless:** Using the same type of wireless signals as a cordless phone,
    wireless networks use transmitters/receivers to send data between computers and
    devices. Wireless signals are subject to interference of all kinds (other wireless
    devices such as cordless phones, electrical fields, and so on), they are not 100
    percent reliable and have slowdowns in data transmission. For homes and apartments
    where you do not want to run cables, this is the best solution since no wiring
    is required.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# PC Magazine—Guide to Windows XP Media Center Edition 2005


    Wired networks are extremely inexpensive. A typical router for a wired network
    can cost as little as $30. All you need is the router and cables to connect devices
    to the router.


    # Note


    Cables range in price, but if you shop smart you can get cables for a great price.
    The same 25-foot Ethernet cable is $11.84 at Wal-Mart and $19.95 at stores like
    Office Depot.


    Wireless networks are not as simple. A variety of “standards” for wireless networking
    exist and they keep changing. In addition, you need adapters for each device the
    cost can run very high. There is little reason to even consider slower standards
    when using Media Center. You need the fastest wireless network you can get since
    you are dealing with media files. Table 8-1 is a guide to the different wireless
    standards with recommendations as to which you should use.


    # Table 8-1 Wireless Network Standards


    | Standard | Speed | Recommendation |

    | --- | --- | --- |

    | 802.11a | Up to 54Mbps in the 5GHz band | Recommended, but costly. Not compatible
    with 802.11b devices. Most reliable for home use there are few devices using the
    5GHz band. |

    | 802.11b | Up to 11Mbps in the 2.4GHz band | Not recommended. This standard is
    too slow for live or recorded TV or video playback. |

    | 802.11g | Up to 54Mbps in the 2.4GHz band | Recommended, but for recent devices
    that have 110Mbps speed. Compatible with WiFi devices and 801.11b devices. |


    You will also need a variety of network adapters in a wireless network. Each device
    must be connected to an adapter to communicate with the network. You can also
    add devices to a wireless router, which is often the best method if wiring is
    possible. Routers contain Ethernet ports for wired devices. Table 8-2 gives a
    list of the adapters you will need in a wireless network.


    Your DSL or cable modem connect directly to the router. Using Ethernet cables
    when possible reduce the cost of your network because a cable connection is less
    than the cost of a wireless adapter.


    Regardless of wired or wireless network, the following concept remains the same:
    You will want to use your Media Center PC as the primary hub that connects to
    the Internet and serves data to any other computer or device.


    Figure 8-1 shows a typical Media Center PC home network configuration. As you
    can see, the Media Center PC and the cable/DSL modem connect to a router. The
    router is a device that manages the exchange of data from one device to another
    in a home network.'
