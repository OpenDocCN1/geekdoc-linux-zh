  md: "# Chapter 13\n\n# Managing Playlists\n Music Libraries\n\n![](img/9c34804a6113e2b911b7ce17a1a67b67_235_0.png)\n\
    \nChapter 12 looked at how to get music from various sources into your Music Library.\
    \ With the ability to have thousands of songs in the library, managing them becomes\
    \ a big issue. Although you can sort your music by artist, song, album, or genre,\
    \ finding and playing the music you want needs an even more powerful tool—Playlists.\n\
    \nThink of your music library as a menu of songs. With Playlists, you go through\
    \ the menu, select the songs you want in the order you want to play them, and\
    \ when you are there you have a list of songs you want to play. Playlist can be\
    \ saved, named, and then played. Playlists can contain any combination of songs\
    \ from any source, and you can edit and change the Playlist whenever you want.\
    \ To Media Center, Playlists are the same as CDs or albums—you play them and control\
    \ them just as you do media.\n\nThis chapter explores how Media Center works with\
    \ Playlists and how you create them. It also takes a look at how to manage your\
    \ music library by knowing how to get all the information about each song attached\
    \ to it and how to secure rights to play it on your computer.\n\n# Managing Playlists\n\
    \nIn 12 you learned how Media Center works with Windows Media Player to build\
    \ music libraries. Media Center also works directly with Windows Media Player\
    \ to create Playlists, and all of the Playlists that you create in Windows Media\
    \ Player can be used in Media Center.\nThere are two types of Playlists:\n\n+\
    \   * Auto Playlists: Windows Media Player automatically generates Playlists for\
    \ you. It comes with a number of Auto Playlists to get you started. These lists\
    \ contain most recently played music, music you have added but have to listen\
    \ to, and music you play often. Media Center uses the Auto Playlists and they\
    \ include songs that you played both in Media Center and Windows Media Player.\
    \ As you will soon learn, you can create your own Auto Playlists.\n* Playlists\
    \ that you create: Using Windows Media Player or Media Center and all of the music\
    \ you have added to your library, you create and name a Playlist, add songs to\
    \ it, and save it.\n\n215"
