  md: '# Final Considerations when Choosing a Media Center PC


    Now that you''ve looked at what makes Media Center PC the same—and what makes
    each Media Center PC different—you can begin thinking about the type of Media
    Center PC that will work for you.


    Here are some of key points in choosing a Media Center PC beyond brand preference:


    +   * **The Real Thing:** Make sure that it is an actual Windows Media Center
    PC. Some computers are being sold by the name "Media Center" that have much of
    the same hardware, but that do not have the Media Center operating system.

    * **Form Factor:** Make where you will use your Media Center PC determine the
    form factor. If you plan to expand your system with internal add-ons such as additional
    PCI cards or hard drives, make sure the form factor allows for such expansion.

    * **Value:** Although it may be easiest to go to a major retailer and get a Media
    Center PC off the shelf, it might not be configured to give you the features you
    want or the best price. By configuring your system (often by buying online) you
    can usually get the equipment for less than you you would upgrade your system.

    * **The Latest Product:** Since its release, Microsoft has updated Media Center
    about once a year. You will get the latest release of Media Center installed on
    your PC when you buy it. Although you can usually upgrade to the latest version
    at no cost from the manufacturer, it is best to start off with the latest release
    installed to save you the work. As with all computers, the latest systems tend
    to offer more features and value for a lower cost. Do some online research to
    make sure you are getting the newest hardware and software.


    # Summary


    Every Media Center PC offers a complete hardware configuration that has been optimized
    for viewing and storing TV programs, playing FM radio programs, plus storing and
    playing audio, video, and photo files. Using high-performance processors, video
    and audio cards, a TV tuner card, hard drives, optical drives, and networking
    features, enable you to use your Media Center PC as your entertainment center
    for all media.


    Media Center PCs come with a remote that allows you to control the functions of
    Media Center with the same ease as controlling a TV set


    When not being used for media applications, the high-performance hardware of the
    system makes it a powerful PC for general computing.


    Media Center PCs come in different form factors and can be configured with different
    hard drives, optical drives, processors, and video cards, so it''s important to
    get a Media Center PC that is configured for your needs.'
