  md: '# Chapter 6: Getting Audio and Video In Out of Your MCE PC 99


    There are two methods of attaching the IR Control Cable depending on the type
    of connector provided by your manufacturer. The first method is to place the sensor
    end of the cable in front of your set-top box IR sensor. This will work, but since
    the device can be bumped out of place it is risky.


    The preferred method is to stick the sensor end of the IR Control Cable directly
    over the IR sensor on the set-top box. The IR Control sensor has adhesive for
    this purpose. Once connected, this provides a reliable method for controlling
    your set-top box without the device moving or not being in the best position.
    This method is shown in Figure 6-8.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_119_0.png)


    **Figure 6-8**: IR Control Cable attached to the front of a set-top box.


    # OTHER VIDEO SOURCES


    The final method to get analog video into Media Center is to connect your TV tuner
    to a video source other than TV; for example, a VCR or analog camcorder. This
    enables you to capture or view BetaMax or VHS tapes and video from analog camcorders.


    The connections are essentially the same for a cable or satellite-top box. If
    your device has only a coaxial connector, use a coaxial cable between it and the
    Antenna/TV Signal connector on your TV tuner. If it has an S-Video connector and
    Audio Out jacks, use those to make the connection.


    Just as with a set-top box, you need to know which channel the device is tuned
    to—most likely either channel 3 or 4.


    # Video Cards


    You connect your TV or computer monitor to your Media Center PC''s video card.
    You can connect a TV, a computer monitor, or both at the same time.


    Although Media Center PCs use coaxial connectors for bringing in a TV signal through
    the TV tuner, the video card in your PC does not have a coaxial connection for
    connecting to your TV. The video cards used in most Media Center PCs have a standard
    VGA 15-pin port for computer monitors and an S-Video Out port for connection to
    a TV. Some video cards may also have an RCA-composite video out port or a DVI
    port for newer TVs and computer displays.'
