  md: 'work perfectly in your Media PC, and, depending on both your DVD burner format
    and any home DVD player you plan to use, will probably work perfectly on other
    DVD players too.


    # Compatibility Issues


    As referred earlier, if you plan to use the DVDs you burn using a program such
    as PrimeTime on home players, you will need to test for compatibility. DVD burners
    come in three versions: DVD+R, DVD-R, and DVD+/R.


    The disc you create on your burner will play back on your computer, but that may
    not always be the case with other drives and home DVD players. Unfortunately,
    there are competing standards and each home DVD player is different in what formats
    it supports. Until the time for both DVD writers and DVD players'' abilities to
    read formats is solved, you will have to test whether the DVDs you create work
    on the players you plan to use.


    If you are adding a drive, prices are now low enough that you can get a good deal
    on DVD+/R drive. This will allow you to use the right type of format and disc
    for just about any player you will be.


    # Copyright and Rights Issues


    Speaking about playing your DVDs on other players, do the right thing and obey
    the law. Can you show your shows to a DVD for private viewing. But the way and
    television industry is headed, you might find that it is not the case. When you
    record a movie from cable or satellite, you essentially eliminating the potential
    sale or rental of that DVD. It gets more serious if you burn movie to a DVD and
    give it to someone else.


    Just as with music, rights issues are being battled in court every day. The reason
    for this is people have abused their ''fair use'' rights to copying and sharing.
    If you want to retain your rights to copy media such as music and TV, respect
    the law and don''t distribute your DVDs. Keep them for your own use and help keep
    the laws for everyone.


    # Summary


    Unlike others in the past, Media Center PCs have been optimized to make playing
    video and DVDs as good as if you were them in a consumer DVD player. As part of
    your overall entertainment center, playing DVDs with your Media Center is easy
    and adds features not found on home DVD players.


    In addition to playing DVDs, if your computer has a DVD burner you can create
    DVDs of the TV programs you recorded using My TV. Media Center comes equipped
    with a program for burning recorded shows, and your computer may have enough capacity.
    If you want to go beyond the Media Center experience, you can purchase PrimeTime
    with Sonic. PrimeTime is a Media Center application designed to burn your shows
    to DVD within Media Center. If you are planning to burn your DVDs, be sure to
    look for a burner that writes both DVD+R and DVD-R discs so that discs will work
    on any standard DVD player. TV shows are copyrighted material and you will need
    to limit burning DVDs or Video CDs for your personal use.'
  merge: -1
