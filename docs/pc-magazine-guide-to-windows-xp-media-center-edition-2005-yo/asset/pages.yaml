  md: '# Chapter 7


    # Media Storage: Adding

    and Replacing Drives


    One of the nicest features of a Media Center PC is its ability to record TV programs.
    Even if you''re not a person who records lots of TV shows on your VCR, you will
    quickly learn that using a Media Center PC for recording TV is a completely different
    experience—you can time-shift TV.


    If there is a show you want to watch, with a Media Center PC you have two options:


    +   - Watch TV Make sure you are home when your program is on, having nothing
    else planned, in front of your TV, and hope the phone doesn''t ring! With My TV
    in Media Center PC you can “pause” the program, but you still have to be there
    when it''s on.

    - Schedule the show and watch it whenever you want.


    The second option up lots of TV programming for you. By being able to quickly
    and easily schedule recordings and have My TV record all of your favorites shows,
    you can watch shows you otherwise miss due to your schedule. Now you can skip
    over parts (yes, that means commercials, too) and record one program while you
    watch. It''s simply a better way to watch TV.


    With the ability to time-shift by recording TV shows, and the desire to save your
    favorites, you will find that on any hard drive will soon be filling up with all
    kinds of TV shows. And if you want to save some of those long-term and even share
    them with friends and family, you will want to burn them to DVDs.


    This chapter takes a look at different ways to save TV programs (and music) and
    how to expand your storage.


    # Hard Drives


    Your Media Center PC comes equipped with a fairly large hard drive. Most models
    start with an 80GB drive and newer models have up to 500GB drives available. Music
    files, digital photo files, video files, and recorded TV shows all take up large
    amounts of drive storage. Compared to virtually any other file type (such as Word
    documents or spreadsheets), media files are huge.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'There is an old saying, “You can’t be too rich or too thin.” When comes to
    Media Center PCs, you can’t have too large of a hard drive; you will need it.
    The good news is that it’s easy to add hard drive storage and the prices just
    keep going down. This section looks at hard drive options.


    # Real-World Media Storage


    Last year I converted all of my audio CDs to MP3 files. The average CD, when converted,
    was 60MB. With 1,200 CDs, my files consumed 50GB on my hard drive. In the past
    two years I have taken a lot of pictures with my 5-megapixel digital camera. My
    picture files are taking up 8GB of space. Undaunted by the size of those files
    I undertook the biggest storage drive of: converting my videos to AVI for editing.
    Just a couple of hours of video took morethan40GB of drive space. Before I ever
    recorded a TV program I had 100GB of media files filling up my drive. Looking
    for a great price on a hard drive, I was able to add a second 160GB hard drive
    for about $80 (after rebates) and it’s now filling up with TV recordings.


    # Internal Hard Drives


    An internal drive is the best drive value. You can replace the drive you currently
    have with a larger one, but it makes more sense to add a second hard drive if
    your computer has an open drive bay.


    If your computer doesn’t have room for a second hard drive, replacing your current
    hard drive is possible but it is the most complicated and expensive solution.
    You will lose storage you have already paid for and you will also need to go through
    a process where you transfer all of your current files, programs, and settings
    to a new hard drive. Although there are good utility programs for this purpose,
    it adds complexity and risk you may need to reinstall Windows using your original
    installation discs.


    If your computer has a bay for an additional drive, the next step is to determine
    the size and type of drive to add.


    # Radical Measures


    I own a really nice Hewlett-Packard Media Center PC. Everything was great until
    I decided I needed to add a second hard drive. The media reader unit was occupying
    the space normally used for a second hard drive. That meant I would either have
    to remove the media reader (not an option—use it all the time), replace my current
    hard drive, or add an external hard drive. I didn’t want to replace the large
    hard drive already in use, so I wanted to add an additional drive and add more
    boxes in my family room.


    Searching around inside the PC and cursing that the connectors for adding a drive
    and power were just dangling, I decided to take them into my own hands and add
    a second drive and mount it under the drive cage in an open area inside of the
    PC. Would the manufacturer approve? I’m sure they wouldn’t. Does my second drive
    work? Perfectly. I was not concerned with overheating or cabling issues—the owner’s
    manual stated you could add a second hard drive if the'
