  md: '# Chapter 4


    # Media Center

    Experiences


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_77_0.png)


    Media Center PCs combine PC hardware optimized for media with a set of unique
    experiences for managing and playing media. The experiences are completely integrated
    with the Media Center operating system and all share the same file conventions
    and use the same actions and remote control.


    Right out of the box, Media Center PCs are ready for media. Everything you need—both
    hardware and software—is part of the system.


    In creating a Media Center PC, Microsoft had a high bar to jump over: the TV.
    Think of how effective the user interface is. You pick up a remote control, press
    the power button, and the TV turns in a matter of seconds and starts playing.
    It has two basic actions: turn channels and adjust volume. Not only is it amazingly
    simple, it works perfectly—until the TV breaks, and nowadays is not too often.


    It would be hard to say that Media Center PCs are at that level of hardware sophistication
    (PCs are not yet instant-on-devices and they need a reboot now and then), but
    the Media Center operating system and experiences are getting close to that level
    on the software side.


    This chapter gives you a tour of the suite of experiences that come standard on
    every Media Center PC. Later chapters explore each one in greater detail.


    # Media Center Start Screen


    Launch Media Center either by clicking the “Green Button” Media Center icon on
    the Windows desktop or by pressing the Green Button on the remote control, as
    shown in Figures 4-1 and 4-2.


    Media Center runs as an application in its own window and it can run simultaneously
    with other Windows XP experiences. It opens full-screen but the window it runs
    in can be resized or minimized.


    After a brief splash screen welcoming you to Media Center, you arrive at the Media
    Center Screen, as shown in Figure 4-3.


    As a Windows XP user you should be familiar with the Start button on the Windows
    XP desktop. The Start button is used to launch programs in both Windows XP and
    Media Center. The Start Screen in Media Center will launch only Media Center experiences—not
    Windows programs.'
  merge: -1
  pgno: 77
- img_proc: true
