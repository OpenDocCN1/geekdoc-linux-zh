  md: '# # Chapter 12: Playing Audio Files and CDs with My Music 211


    # ## Playing and Copying Audio CDs


    When you place an audio CD into your optical drive you see an on-screen prompt
    asking you if you wish to play the audio CD. If you choose OK, it automatically
    adds the tracks from the CD to the music queue and starts playing. The screen
    changes to the queue mode and if you are connected to the Internet, Media Center
    looks up the track names and obtains the album art, as shown in Figure 12-14.
    If you are not connected to the Internet, the songs are labeled by track numbers.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_231_0.png)


    **Figure 12-14:** The menu for playing audio CD.


    All of the same options are used for playing CDs as for playing audio files. You
    can choose to play the songs in random order or shuffle them, display them by
    individual song, view all of the tracks on the CD, or use visualizations. In addition
    to those controls, there is the Copy CD option.

    One of the biggest advantages of working with Media Center is that you can store
    any audio CD on your hard drive and add it to your music library. When you store
    the CD on your computer, the next time you want to play it you will not need the
    CD because you will be able to play it from the hard drive.


    # ## Note


    When you copy CDs to your hard drive using My Music, you can add them directly
    to your My Music folder.'
  merge: -1
  pgno: 231
