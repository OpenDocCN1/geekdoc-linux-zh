    # Creating Your Own Auto Playlists


    Auto Playlists are worth creating because they track your media library and automatically
    update Playlists for you. You can create a Playlist, for example, of your favorite
    pop songs. The list would contain all of yours, but if you added a few new songs
    to your music library? You would have to go to Windows Media Player and edit the
    list by manually adding the new songs.


    With your auto Playlist you can create a list of favorite pop songs and have Media
    Center add any new pop songs you add to your music library in the future. You
    can set it where songs are only added if you rate them or play them a few times
    first to make sure that they are "favorites.\nTo create your auto Playlist, you
    need to leave Media Center and go to Windows XP and launch Windows Media Player.
    Once, click on Music Library from the menu choices on the left side of the screen,
    and from the top menu bar choose Playlists, as shown in Figure 13-3. Choose Auto
    Playlist and see the menu in Figure 13-4, where you can enter the criteria you
    choose for your auto Playlist.


