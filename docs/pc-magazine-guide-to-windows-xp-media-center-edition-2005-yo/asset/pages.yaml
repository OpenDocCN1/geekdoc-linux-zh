    +   - Albums: Sorts by the name of the album.

    - Artists: Sorts by the artist name.

    - Playlists: Sorts by the names of playlists you have created.

    - Songs: Sorts by the name of the song.

    - Genres: Sorts all music by the genre that has been assigned.


    As you can see, having properly ripped your files with track information is crucial.
    If you simply ripped your CDs without having Media Center (or any other ripping
    application you may have used) go to the Internet to find track information, or
    enter it manually, it is going to be hard to find your music. Start doing it now.
    Windows Player, working with Media Center My Music, attempts to find all of this
    information for you in the background over time. It''s a long process and you
    need to connect to the Internet.


    # Note


    My Music enables you to find music in a number of intuitive ways. Just as with
    My TV, it puts the controls and information in front of you when you need them.


    When you click on one of the buttons to find music sorted by that category, you
    are brought to a screen, as the one shown in Figure 12-7 and Figure 12-8, containing
    “pages” of music listings. Media Center does not scroll, but it does scroll lists
    like these. You can scroll the list using your mouse or direction keys on the
    remote control.


    Figure 12-8 shows a list of more than 5,000 songs. When you select the Songs button
    from My Music, with many songs you recognize will have a short delay before you
    see this list. That means that My Music is getting the list of songs and it will
    show an on-busy” symbol when it needs to do some searching.


    You can page up or down the Channel/Page buttons on the remote control. It will
    move the list up or down a page at a time, which is better but still not the best
    way to see a song if you know what it is.


    If you know a song title and the artist name you may be able to find it quicker
    by album or artist. That reduces the number of items you need to scroll or page
    through. Figure 12-9 shows music sorted by Artists. The 5,000 songs are in a list
    of 280 items. It''s a list of items to scroll through, but it''s a right way to
    find the finish.


    Regardless of how you sort your music, you may page rather than scroll through
    long lists. Figure 12-10 shows the Search menu, which you can find on the My Music
    main menu. This works great for finding music quickly, but only if you have some
    idea of what you are looking for. Enter some text into the Search field, and Media
    Center searches all data fields in the music files, Figure 12-10 shows a search
    with the word “new.” It returned songs, artists, albums, and genres.'
