  md: '# Chapter 20


    # Final Thoughts about Media Center


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_327_0.png)


    At this point you should know all you need to know to get the most from your Media
    Center PC. If you are like many users, you may still ask, “Is this really good
    enough to replace all my other entertainment devices?” That’s a great question.


    This chapter takes looks at the potential Media Center holds within its design
    to be the replacement for other entertainment devices. It also looks at the limitations
    Media Center currently has.


    # Media Center PCs versus Dedicated Devices


    Media Center PC is so good, why do people still buy “dedicated” entertainment
    devices like DVD recorders, DVD players, home stereos, and TiVo digital video
    recorders (DVRs)? Why aren''t Media Center PCs the heart of any new entertainment
    system leaving Best Buy or Circuit City?


    Dedicated devices still have a lot going for them. Here are just a few of the
    benefits of traditional consumer devices:


    +   - Instant-On: You just turn on and you''re watching TV—there’s no booting.

    - Reliable: They don’t “crash” the way PCs do so often.

    - Easy to use: Truthfully, you don’t need a book to use this to.


    Dedicated devices such as TVs and DVD players have the perception of being easy
    to use and operate. Most people still think of them as complicated devices that
    often are in control of them, not in control of the PC.


    Most of all, people don’t think of using a computer to watch TV. Regardless of
    the cost, it’s like offering any item to a person who doesn’t want or need it.
    Even at a great price, they won’t buy it. Changing a consumer habit is one of
    the greatest challenges faced to companies marketing any new type of product.
    Great features and value are just a small part of a value proposition to any consumer.


    # Cost Comparison


    Earlier in the book we looked at how a Media Center PC actually costs less than
    a DVD recorder with a built-in hard drive using the TiVo service. The Media Center
    PC offered much more for the same'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'price. That was comparing it to just one device. Table 20-1 gives you a detailed
    look at what it would cost to replicate all the features of a Media Center PC
    using a dedicated consumer electronic devices (based on prices at the time of
    writing this book).


    # **Table 20-1 Comparison of Dedicated Devices versus Media Center PCs**


    | Feature on a$1,000 Media Center PC | Dedicated Device | Cost |

    |---|---||

    | Record TV | TiVo | $200 |

    | Play DVDs | DVD Player | $80 |

    | Record DVDs | DVD Recorder/Player | $400 |

    | Play CDs and Radio | Home Stereo | $300 |

    | Play Pictures on TV | TV Picture Viewer/ Slideshow Player | $200 |

    | Burn Audio CDs | CD Recorder | $200 |

    | Access to Internet | MSN TV | $100 |

    | One Remote Control | Universal Remote Control | $50 |

    | Total Cost | | $1530 or more |


    Without including the cost of all of the computing functions of a Media Center
    PC, and limiting to a fair comparison of media device and recording, it is clear
    that Media Center PCs offers more value for a lower price than dedicated devices
    that would perform the same functions.


    When you consider all of the things a Media Center PC can do and the overall value
    it represents, you really have to think about the long-term success of Media Center
    PCs to be more about a change in the way things are done than a simple gadget
    at a great price.


    # **Changing Habits**


    It takes a long time to change a consumer habit. The amount of time it takes for
    any new concept or product category to become widely accepted by the mass market
    is about 10 years.


    Think of DVDs. It took about 10 years from their introduction before they overtook
    VRs. Audio CDs had the same 10-year cycle before they replaced audio cassettes.
    and it were even longer from the introduction of the personal computer before
    “everyone” had to one.


    Right now, HDTV (high-definition) TV is facing an equal challenge. Although better
    than analog TV, HDTV has been slow to succeed not only because of the change in
    consumer habits, but because of spotty availability of programming and extremely
    high prices for new sets.


    Will it take 10 years for Media Center PCs to catch on? In my opinion, no. As
    adopted technologies (the personal computer and entertainment center), Media Center
    doesn''t fall into the category of a new device, but it does represent a change
    of habit: using a PC in the living room.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Chapter 20: Final Thoughts about Media Center 309


    # # Media Center: A Work in Progress


    Say “PC” and what do you think of? Home offices, spreadsheets, word processors,
    and the Internet.

    Say “TV” and what do you think of? Living rooms, TV shows, news, sports, and weather.

    The challenge is to get people to think of Media Center PCs as a single device
    that can do all of it in any of those rooms. It actually can do all of that, but
    there are a few things that need to happen before people see it that


    I think it will take time and even more features before Media Center PCs are at
    the heart of home entertainment in most homes. Let’s take a look at some things
    that need to happen:


    +   - Instant-On: When someone calls you and says “Turn on channel 7 right now!”
    you know that you can go to your TV, turn it on, and almost instantly see what
    they’re talking about. Media Center PCs need to have “instant-on” performance
    level. Waiting for a computer to boot-up isn''t a TV-like experience.

    - Reliability: Although computers are really reliable on the hardware side, the
    operating system sometimes crashes. TVs, VCRs, and DVRs crash (they break, they
    don’t crash). If you’ve scheduled a recording of your favorite TV and the computer
    crashes you don’t even know it, you’re not relying on it in the future and you’re
    back to your PC or VCR. Media Center PCs simply can''t crash and are expected
    to be reliable.

    - Easy-to-use: Moving back and forth between Windows XP and Windows Media Player
    and setting up printers and configuring home networks; Yikes! That’s not like
    taking a TV out of the box, connecting the cable, and turning it on to watch the
    game. To truly be a home media center Media Center PCs have to be able to be used
    and set up by anyone—early adopters (you and me).


    Now, look at this list, and go back to the first section of this chapter and look
    at the list advantages of dedicated consumer electronic devices.

    It’s the same line.

    Perhaps that’s why you don’t see Media Center PCs in the TV department of Best
    Buy and Circuit City. Perhaps they are still marketed to most users who are truthfully
    used to complexity, learning curves, and long waits in the use of programs.

    Media Center PCs are a work in progress. The preceding items and even longer lists
    of similar improvements are certainly on the planning board of Microsoft and all
    of their hardware partners. In order to make to the PC entertainment device, these
    companies are aware of how consumer electronic devices are successful not just
    because of value and features, but also ease-of-use and reliability. Their goal
    is to make Media Center PCs good. It will take time, but I am a believer. It will
    happen.


    # # Overcoming Media Center Limitations


    Let’s take the three items listed earlier and see how you can overcome those limitations
    in the meantime until the systems themselves come to par.'
