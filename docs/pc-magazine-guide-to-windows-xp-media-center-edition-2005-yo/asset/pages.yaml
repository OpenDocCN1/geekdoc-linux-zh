  md: '# PC Magazine—Guide to Windows XP Center Edition 2005


    The Remote Sensor can be connected to any USB port on the front or back of your
    Media Center PC. The reason that a "remote" device is preferred over one built
    into your PC is that it can be positioned next to your TV or monitor. It''s intuitive
    to use a remote control to the TV program you are watching—not your PC. Once you
    have connected the Remote Sensor to the PC, you can use the long cable to position
    it out or next to your TV or monitor. An added benefit is that in a living or
    family room you can actually put your PC out of sight since the Remote Sensor
    is what control it when using a remote control.


    Figure 6-7 shows the typical placement of a Remote Sensor in a family room. If
    you''re using your Media Center PC in an office setting you should also place
    your Remote Sensor next to your computer monitor. This will always allow you to
    point to the screen to control your viewing.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_118_0.png)


    Figure 6-7: Placement of a Remote Sensor in a family room.


    # IR Control Cable


    Once you have connected your Remote Sensor you can attach the device that replaces
    the remote control from your set-top box and turn it on and change channels for
    you.


    This device works for set-top boxes that use infrared (IR) remote controls. Some
    set-top boxes, such as from Dish Networks, use a UHF remote control and will not
    work because they are not IR devices. You can add an IR control to such boxes
    and contact your cable or satellite provider for such an option.


    If the set-top box uses an RF remote you will need to attach an IR Control Cable
    from your Remote Sensor and place the sensor or in front of your set-top box.
    First, locate the IR control on your Remote Sensor. Connect the jack end of the
    IR control to it and run the long cord so you can locate the sensor end of the
    cable in front of your set-top box.


    Next is the tricky part: You will need to locate the IR sensor on your set-top
    box. It may be visible or it may be hidden behind dark plastic. An easy way to
    locate it is to shine a flashlight into the front panel for small rectangle with
    an even smaller dark rectangle inside of it. That is the IR sensor. You can test
    it by covering it with black tape or even your hand and using your remote control.
    If the remote doesn''t cause any actions, you have located the IR sensor.'
