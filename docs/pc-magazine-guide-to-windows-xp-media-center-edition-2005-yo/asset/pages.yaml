    # About the Author


    Terry Ulick has extensive experience chronicling the revolutions in PCs and producing
    television programming. He has written extensively on PC use since the late 1970s
    and was a columnist for PC Magazine in its earliest days. He went on to publish
    the first magazine on desktop publishing, *Personal Publishing*, in the mid 1980s
    and to write three of the first books on desktop publishing.


    In 1995 he co-founded the first online digital photo service for America Online,
    PicturePlace, an AOL Greenhouse Venture.


    From there, he worked as Executive Director of Business Development for Tribune
    Media Services, where he was responsible for TV listings and movies show content
    development. The products he developed put TV information into Microsoft products
    such as MSN TV, WebTV, UltimateTV, and Media Center. Currently, he is the President
    and Co-Founder of Good Time Wine, one of the first generation of broadband-based
    networks to power Media Center Edition PCs with shows such as Good Time Wine and
    Camp US that can be viewed directly from the Internet.


    The combination of his editorial experience and his inside knowledge of the planning
    and delivery of entertainment-based content to PC/TV devices makes him uniquely
    qualified to write this book.'
