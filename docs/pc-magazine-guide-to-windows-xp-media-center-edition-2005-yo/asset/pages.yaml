  md: '# Chapter 10: Recording and Playback of TV Programs 163


    Finally, there is a setting for Recording Quality. Choosing different recording
    qualities will also reflect how many hours of programs you can store (based on
    the size of the drive and percentage allocated to recording in the first two settings).
    You can see the estimates at the bottom of the screen.


    The two estimates at the bottom of the screen show the maximum recording time
    based on the settings you''ve chosen. This is the total amount of time that can
    be stored at those settings. The other estimate is the unused recorder time that
    subtracts the space used by currently recorded shows and how much actual time
    is available for recordings. Because you will be adding and deleting shows, this
    number is always changing.


    The most important setting is which drive to use. Use one where you have the most
    free space and allocate a reasonable amount of drive to recording. Starting with
    50 minutes is safe and you can check back occasionally and examine how your recording
    habits are working with the space you have allocated.


    In the same manner, try different recording quality settings and watch the recorded
    shows to determine if the lower quality settings are acceptable. They offer you
    the greatest amount of storage on your hard drive and on DVDs you burn.


    After making settings in the Storage menu, click Save and then go to the Recording
    Defaults menu shown in Figure 10-3.


