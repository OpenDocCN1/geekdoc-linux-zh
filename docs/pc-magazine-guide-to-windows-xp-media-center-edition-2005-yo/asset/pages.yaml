  md: '# 288 PC Magazine—Guide to Windows XP Center Edition 2005


    Installing the programs that may have come with your PC first. Your PC probably
    came with two games, Otto and Gem Master. If the icons are dimmed, it is because
    they are shortcuts to an install program for the games that are already on your
    computer. After a short installation routine asking you if you agree to the user
    license, your program will be in color and you will be able to play the games.


    They are great games, especially Otto. Determined as I was to assure you of their
    quality, I played Otto all the way to level 100—the highest possible level—and
    reached the “Kingdom Saved” screen. I have included proof of this accomplishment
    in Figure 18-4, which is also a good example of how a game program looks in Media
    Center.


