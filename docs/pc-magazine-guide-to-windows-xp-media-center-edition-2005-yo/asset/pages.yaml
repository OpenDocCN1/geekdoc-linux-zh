    music if you want to play it in Media Center.


    To change your copy protection setting in Media Center and Windows Media Player,
    choose Tools

    Options and select the Privacy tab. Select Acquire Licenses Automatically for
    Protected Content.

    This allows you to play most music you''ve downloaded in Media Center.'
