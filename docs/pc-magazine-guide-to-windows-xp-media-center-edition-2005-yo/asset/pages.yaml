  md: '# # Chapter 18


    # # Adding More Programs

    to Media Center


    When it comes to playing and managing media such as TV, music, and pictures, Media
    Center comes with just about everything you need out of the box. That''s not to
    say that as a PC user you are no doubt used to being able to add programs to expand
    the utility, functionality, and fun of your computer.


    Carrying on in that fine tradition, Media Center enables you to add programs—as
    long as they are designed for Media Center. With Media Center''s unique environment
    and user interface, programs that can be added to Media Center must have a TV-centric
    interface that can be controlled using a mouse, keyboard, or remote control.


    This chapter takes a look at how you add programs to Media Center and where to
    find them.


    # # The Launch Pad


    You may have noticed that the Media Center Start Screen has a button labeled More
    Programs. Think of More Programs as the “launch pad” for applications that you
    add to Media Center. By placing adding-on programs in a special area, you can
    have as many programs as you want without adding complexity to the Start Screen.


    An easy way to find how additional programs are positioned in Media Center is
    to equate them to programs you add to Windows XP. When you click the Start button
    in Windows XP, there is a list of programs that remain constant in the menu. Like
    the standard programs such as My TV and Pictures in Media Center''s Start Screen.
    To get more programs in Windows XP, you click the All Programs button and find
    a list of all the programs on your PC. When you run a program, it is added to
    a list of most used programs in the Windows XP Start menu.


    Media Center uses the exact same concept. To reach additional programs, you go
    to the menu More Programs from the Start Screen. When you launch a program, it
    is added as a shortcut when you highlight the More Programs on the Start Screen.
    The most recently used programs are added, as shown in Figure 18-1. If you have
    to use any additional programs, you will only see More Programs.


    When you click the More Programs button, you go to the menu in Figure 18-2. Any
    programs that have been added to Media Center are listed as menu items. Microsoft
    refers to this screen as the More Programs “folder.” which makes sense—the additional
    programs are listed like file icons others in a folder.


    285'
  merge: -1
  pgno: 305
- img_proc: true
