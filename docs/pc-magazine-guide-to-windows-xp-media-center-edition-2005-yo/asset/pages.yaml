  md: '# Chapter 6


    # Getting Audio and Video In and Out of Your MCE PC


    As the heart of your digital entertainment center, your Media Center PC must be
    able to gather media content from both analog and digital sources. It displays
    that content using either a computer monitor or TV for the video and plays audio
    through powered speakers or an amplifier, such as a home stereo connected to speakers.
    This chapter looks at the devices and connections used for getting audio and video
    in and out of your Media Center PC.


    # Video


    Your Media Center PC uses two devices for managing video: a TV tuner card to get
    analog signals into your computer and a video card to send video to a computer
    monitor, TV, or both at the same time. Each card contains its own processors designed
    to deliver high performance and meets Media Center Edition standards for video
    performance.


    The TV tuner converts analog sources into a digital format. The conversion takes
    place in real time and the resulting digital signal can be saved as a file. This
    feature allows the recording of TV programming and the ability to relive live.
    TV tuner cards also include an FM tuner that processes analog FM broadcasts into
    a digital format.


    The video card sends either analog or digital signal to a display. Media Center
    PCs must be able to use a standard computer monitor or TV as a primary display.
    They can support both displays at the same time. When using a TV and a computer
    monitor at the same time, you can have the screen mirrored on both or have each
    screen, such as Media Center on the TV and Windows XP on the computer monitor.


    The combination of a TV tuner card and a video card that ensures a quality image
    on a standard TV allows Media Center PCs to be used for TV viewing and recording
    as well as for viewing home videos and DVDs in a family room setting.


    # TV Tuner Card


    One of the first things you will want to do when using your Media Center PC is
    to connect your current TV source to the TV tuner card. This enables you to start
    using the TV functions of Media Center and'
