    DVI cable to connect them. If your video card has only a DVI connector and your
    monitor uses a 15-pin VGA connection, you will need to use a DVI to VGA adapter
    to connect your video card or computer monitor. Most likely your video card and
    computer monitor will both have 15-pin VGA connectors and if, connect the'
