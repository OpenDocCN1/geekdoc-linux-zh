- img_proc: true
  md: '# 310 PC Magazine—Guide to Windows XP Media Center Edition 2005


    # Instant-On


    It''s true that you don''t run on a Media Center PC and instantly get a TV picture.
    So, with a bit of logic and understanding of how PCs work, you can achieve a result
    that''s pretty close to "instant-on."


    +   - Leave your computer on: By leaving your computer in an "on" state, or in
    Standby mode, you will be able to quickly get TV programs when needed. Media Center
    PCs are built to "wake" from standby to record shows, so you really never turn
    them off completely; if you regularly schedule to record, it takes a few seconds
    to wake from standby, which is almost the same amount of time it takes for most
    TVs to come out of the power saver mode.

    - Exit your Media Center: Let Media Center running all the time you are or in
    standby. Even if you are using Windows XP applications, having Media Center running
    and playing TV means you are just one click away from TV viewing, listening to
    music, or accessing any of its functions.


    By going to the Power Options on the Windows XP Control Panel, you can set how
    long it takes before Media Center goes into Standby mode, and also make adjustments
    for hard drive spin down and the amount of time before the display goes into Standby
    mode. Figure 20-1 shows the Options from the Control Panel.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_330_0.png)


    Figure 20-1: The Power Options control panel.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Chapter 20: Final Thoughts about Media Center 311


    By properly configuring your settings, you can keep Media Center handy at all
    times and also save power based upon how you use your Media Center PC and your
    TV viewing habits. Don''t worry about recordings; as long as you are in the Standby
    mode, Media Center will wake you PC for the recording.


    # Reliability


    Since most computer hardware is actually pretty reliable, you most likely will
    have computer crashes that are operating system or software-based. Although such
    crashes aren''t caused by you, you can do some simple things to prevent them:


    +   **Identify problem routines or applications:** If your system hangs up or
    crashes every time you run a program, you may want to seriously stopping the use
    of the program. It may also be that programs run well on the same time as Media
    Center. This can happen when you run them at the Media Center and go to Windows
    XP to run a video program that is trying to use the TV tuner card or devices that
    Media Center is using. To identify problem situations and assure them, everything
    would work perfectly, but it doesn''t. You can prevent many crashes with this
    approach.


    +   **Don''t overload your PC:** Sometimes too many programs running at once slows
    down performance or a crash. Programs that run great on their own may tend to
    call system routines and resources that other programs are using, and things get
    very slow when the programs fight each other for resources. After you are through
    with non-Media Center applications, close them.


    +   **Optimize and clean up often:** Using the tools to can with Windows XP in
    the System Tools folder, optimize and defragment your hard drives and clean up
    your system files. Performing these tasks every three months is a good practice
    to keep your PC running well.


    +   **Use Windows Update often:** Check periodically for updates to Windows XP
    and Media Center from the Microsoft Web site. Problems that happen to most people
    get reported and system updates eventually become avoidable to solve.


    # Ease of Use


    Things are only hard when you don''t know how to do them. The first time you do
    something is always harder than the second time. By reading this book you have
    a good head start in making your Media Center PC easy to use. It''s experience
    and knowledge that is required since the hardware and software is still more complex
    than a TV.


    By learning how to use Media Center and making all of the settings work the way
    you want, you will find it to be very easy to use. After the initial setup, it''s
    an intuitive product''s really just "point and click" if you are still using a
    mouse, or "press" if you are using a remote control.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Final Thoughts on Digital Entertainment


    I used to think of entertainment as different sets of experiences. I would listen
    to music; I would watch a DVD. I''d look at my picture scrapbook. Each was unique,
    and each required different devices and a knowledge of how to control them.


    Owning a Media Center PC has changed all of that. All of those actions are now.
    I use one device for all of them, and they are beginning to weave together in
    both function and my perception of entertainment. I am much more likely to jump
    from one to another than ever before. This has let me view more media when I want
    it than if I were using disparate devices.


    I no longer think of watching TV as a time-based, linear experience. I record
    just everything and watch it when I want, not when the networks tell me to. That
    itself is priceless.


    All my media is now just a click or two away. It''s all available, for the first
    time, in one place. I love it.


    Even better is the future. With more and more entertainment content coming from
    the Internet, the universe of what I can watch and listen to is growing. Just
    as the Internet opened up information in a way never seen before, it is doing
    the same thing for entertainment content. Media Center is a portal to that world—and
    the world of personal photographs, videos, and music that I have assembled and
    define who I am.'
  merge: -1
