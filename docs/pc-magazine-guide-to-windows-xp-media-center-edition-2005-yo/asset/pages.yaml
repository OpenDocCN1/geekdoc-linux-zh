  md: '# Chapter 10: Recording and Playback of TV Programs


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_185_0.png)


    Figure 10-4: Manually recording a live TV show.


    # SCHEDULING RECORDINGS FROM THE GUIDE


    Manual recording is great for shows you are watching live, but most of your recording
    activity will be scheduled recordings. Chapter 9 introduced you to using the Program
    Guide. The Guide is the primary method for scheduling recordings.


    Using any or all of the methods to find shows using the Guide, once you find a
    program that you want to record, as shown in Figure 10-5, click on it. If it is
    at any time in the future, once you click on it will see the screen shown in Figure
    10-6, where you are scheduling the recording.


    Information about the program you have selected is displayed on the screen. This
    will help you understand if the show is new or a rerun and to make sure it is
    what you want to record. In addition to show the information there are three buttons
    for recording: Record, Record Series, and Advanced Record.


    Each of the buttons allows a different type of recording. Here are the differences:


    +   **Record:** Schedules a one-time recording of the show you selected.


    +   **Record Series:** This schedules the recording of the series. It records
    all the shows the Guide can find for this series. Remember setting the Only Series
    Defaults early in the chapter? Those rules will apply to how the series is recorded.
    If you want to schedule a series recording or even a one-time recording with different
    settings, the next option.


    +   **Advanced Record:** If you want to override the defaults for one-time or
    series recordings, use the Advanced Record option. You will be able to set all
    the options for recording for the one show or series.


    +   **Other Showings:** Displays a list of all other airings of the show, regardless
    of time or channel.'
