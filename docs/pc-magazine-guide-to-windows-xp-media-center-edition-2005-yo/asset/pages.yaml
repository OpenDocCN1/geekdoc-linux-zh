  md: '# Chapter 7: Media Storage: Adding and Replacing Drives


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_131_0.png)


    # External Hard Drives


    All the rules of data storage requirements detailed for internal hard drives apply
    apply to adding an external hard drive. You may want to add an external hard drive
    for the following reasons:


    +   - Your Media Center PC does not have an open bay for an internal hard drive.

    - You already have a second internal hard drive and want to add even more storage.

    - You would like to share photos on the external hard drive between computers.


    External hard drives are essentially the same hard drive that you would add as
    an internal hard drive, but they come in a self-contained case with either a USB
    or FireWire/IEEE 1394 interface and own power supply. Because of the external
    interface, case, and power, they cost more than internal hard drives.


    You can connect a large number of external drives to your computer (this is called
    daisy chaining) to add storage when needed. Both the USB and FireWire/IEEE 1394
    interfaces allow connection of multiple drives to your computer.


    Your Media Center PC has both types of interfaces so either will work. Newer,
    more expensive external drives will have both interfaces. Since USB 2.0 is a bit
    faster than FireWire/IEEE 1394, it seems to be the drive of choice. Either drive
    will work well. Also, shop around for the best value regardless of which interface
    you choose.


    Connection of an external hard drive is no more complicated than using the correct
    cable (USB 2.0 cable or IEEE 1394 cable) and connecting it from your external
    hard drive to your computer. You can connect the external drive when the computer
    is off or on. Figure 7-6 shows the back of an external hard drive using a FireWire/IEEE
    1394 connection.'
