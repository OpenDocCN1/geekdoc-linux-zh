  md: '# Chapter 6: Getting Audio Video In and Out of Your MCE PC


    # CONNECTING THE TV SOURCE


    TV tuner cards (or ports on a laptop) have two basic connections: Antenna/TV Signal
    input and S-Video input. These two connectors are shown in Figure 6-1.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_113_0.png)


    Figure 6-1: Antenna/TV and S-Video connectors on your TV tuner card.


    Antenna/TV Signal connectors are the most basic form of connection and are present
    on all TVs. The connectors use a coaxial cable and are commonly found on antennas
    or to connect cable boxes or VCRs. The cable has a male connection with a single
    wire surrounded by shielding and a threaded coupler. The TV tuner card has a female
    connector with threads. To make this connection you run a coaxial cable from your
    antenna, cable box, or satellite box to the connector on the TV tuner card.


    Antenna/TV Signal connectors carry both a video and an audio signal, so only one
    cable is required. Because this type of connection carries all information in
    one wire, it is the lowest quality connection option.


    If you are using a video source such as a cable box or a satellite box, it may
    have a better connector: S-Video. This connector carries only the video signal,
    and it divides the signal into detail information and color information. It uses
    two sets of wires for this and delivers a noticeably better image. If your video
    source has an S-Video connection, use rather than the antenna connector. You will
    need to use an S-Video cable and an audio cable for making the audio connection.


    Because the S-Video carries only the video signal, you must make a separate connection
    for audio. The set-top box will probably have a set of RCA connectors—one for
    each audio channel. The audio connection on your PC is mostly like a stereo "mini
    plug". You will need to use an audio cable with a set of RCA connectors on one
    end and a stereo mini plug on the end to make your connection. This is shown in
    Figure 6-2.


    One final point: Your tuner card may or may not have its own audio connectors.
    Some TV cards require you to use “line in” connections of your PC’s audio card
    to accept the audio portion of your video signal when using an S-Video connection.
    Refer to your owner’s manual for more details, but as a simple rule if your tuner
    card does not have audio connectors, use your audio card connectors.'
