  md: '# Chapter 1


    # Planning to Use a Windows XP Media Center Edition PC


    Windows XP Media Center Edition PC is a PC that has been enhanced for home entertainment
    Media Center systems are offered complete with all of the hardware and software
    needed for viewing and recording TV programs, DVDs, personal videos and pictures,
    as well as listening to music and radio.


    Unlike traditional computers, Media Center PCs can use a regular TV as the display
    and can be operated using a supplied remote control. You can continue to use a
    computer monitor or have both a computer and a TV connected and in the same time.


    The operating system, which is only available on Windows XP Media Center Edition
    PCs, has a TV-centric environment that makes it possible to use your PC in living
    room, bedroom, or family room using only a TV


    This chapter takes a look at how using a Windows XP Media Center Edition PC will
    change your home entertainment experience—and the entertainment equipment you
    may use currently. It takes a look at what equipment and media you will want to
    keep—and what you will want to put away.


    # Cross-Reference


    Part II of this book examines Media Center PC hardware and devices. Appendix A
    provides you with a list of Media Center PC manufacturers.


    # Putting All in One Box


    Where there used to be a home stereo, DVD player, CD player, VHS recorder, TiVo,
    and a box full of remote controls, you can now replace them with just one device:
    a Windows XP Media Center Edition PC (referred to henceforth as a “Media PC”).
    It will enable you to do everything of the old devices did, but all in one device,
    with remote control, and with common user interface and sets of controls. Even
    better, all of your entertainment content can be easily accessed and can work
    together. A good example is creating a DVD: Your pictures create the backgrounds
    in'
