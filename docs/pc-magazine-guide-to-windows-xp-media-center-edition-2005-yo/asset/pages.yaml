- img_proc: true
  md: '# 270 PC Magazine—Guide to Windows XP Center Edition 2005


    Other effects such as captions are a personal preference. In general, you should
    leave captions off since they detract from the picture. They are helpful in identifying
    pictures at certain times so it is a great feature to have when you need it.


    # # Playing a Slideshow


    From the My Pictures menu, select the folder you want to use for a slideshow.
    If you have chosen to include subfolders from the Settings menu, it also plays
    any folders nestled inside of selected folder.


    From the menu choices on the left side of the screen, choose Play slide show.
    The screen begins playing slideshow-fullscreen with the settings you have chosen
    from the Settings menu. The pictures move forward until the end of the folder
    is reached and then the show restarts and loops you choose to stop it.


    > **TIP**nAlthough you can continue to use any screen saver you want, using the
    slideshow feature in My Pictures makes a great screen saver—especially when you
    use a TV as your primary display.


    # # Navigation in a Slideshow


    Table 16-1 shows the control commands that you can use during a slideshow. You
    can also use their equivalents on the keyboard or the mouse using on-screen controls.


    Table 16-1 Slideshow Transport Controls

    | Action | Press |

    |---|---|

    | Play slideshow | Play |

    | Go to next picture | FWD/Skip/right arrow |

    | Go to previous picture | Rewind/Replay/left arrow |

    | Fast-forward | FWD |

    | Rewind | REW |

    | Pause/resume | Pause |

    | Stop slideshow | Stop |


    # # Playing Music During a Slideshow


    You can play music from My Music during a slideshow. This adds a lot to your experience,
    and with some planning you can even create custom playlists for slideshows.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Chapter 16: Creating Slideshows Using My Pictures 271


    Music in slideshows is not synchronized with the actual slideshow. Music is played
    in the background and does not start or stop with the beginning or end of the
    slideshow. Basically, you can play music from My Music at the same time you are
    watching a slideshow. The transport controls during a slideshow control the pictures—not
    the music.


    To play music during your slideshow, first go to My Music and select a playlist
    or selection of songs and start them by playing. Select “repeat” if you don’t
    want the music to stop during the show. Once you have started your music, return
    to My Pictures and begin your slideshow.


    The music will play and if you want you can display information about the song
    playing by choosing to display song information at the beginning and end of song,
    or at all times, from the Settings menu.


    # Fine-Tuning Your Slideshow


    With the options available from the Settings menu you can fine-tune a slideshow
    in advantage of showing it. Transitions, slide duration, captions and background
    colors affect the overall slideshow experience.


    Knowing how to manage your folders and group your pictures into folders is also
    a great way to create a great slideshow.


    # TIP


    You can create a special folder for your slideshow. Using Windows Explorer from
    Windows XP, copy or create shortcuts from a variety of folders into your slideshow
    and name it. This allows you to create a unique slideshow that spans folders that
    only include the pictures you really want. This has the added benefit of saving
    a lot of hard drive space.


    Adding a custom music playlist to your special slideshow is also a great technique.
    By creating a mix of songs that echo the mood and feel of your pictures, you can
    create a perfect soundtrack for the slideshow.


    Finally, before it to sit back and preview the show. Go back and make changes
    to both the mix of picture and the music if needed.


    # Summary


    Using the file management techniques for picture folders covered in Chapter 15,
    you can use the slideshow feature of My Pictures to create highly visual, video-like
    slideshows for display on your TV or computer monitor. By adding shortcuts to
    folders containing digital pictures to the My Pictures folder, you can continue
    to store your pictures wherever you choose.


    The Settings menu allows you to control transitions, slide duration, captions
    for pictures, and background colors during the show. You can add music to a slideshow
    by creating a custom music playlist for it or using any existing playlist or choice
    of album or artist.'
  merge: -1
