  md: '# Summary


    Auto Playlists and regular Playlists enable you to create custom mixes of your
    favorite music. Using Windows Media Player you can create Playlist type and use
    those Playlists in Media Center. Auto Playlists update lists based on a set of
    rules, and regular Playlists are a fixed set of songs selected from the media
    library.


    In order to create Playlists, you need to have your music stored as files on your
    PC''s hard drive in any of the file formats supported by Media Center. By copying
    CDs, downloading music, or using existing music files on your computer, you will
    build a media library. The library, or a shortcut to it, must be located in the
    My Music folder in the My Documents folder for Media Center to find the music
    files.


    To effectively build Playlists and manage your music library, you need to gather
    media information such as album name, song name, artist, and other information
    about the music. You can do this by obtaining it from the Internet or by manually
    entering track information. For music that is purchased online, you will need
    to obtain a license to play it on your computer and be sure that Windows Media
    Player is set to obtain music licenses.'
  merge: -1
