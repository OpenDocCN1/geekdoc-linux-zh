  md: '# Chapter 17


    # Playing Home Movies with My Video


    Playing videos is something that Media Center does extremely well. The video enhancements
    Microsoft incorporated to make low-resolution TV programs look fantastic just
    about any TV or display connected to your Media Center make movies that you create
    on a digital camcorder look better than you''ve ever seen them. The same goes
    for old home movies from 8mm, Super 8 films, and from analog camcorders.


    Media Center plays videos the same way—and with the same easy-to-use controls—as
    TV programs and music. If you have watched TV or played music in Media Center,
    you''ll be right at home in My Video. There is one caveat: getting your movies
    onto your computer requires some knowledge of file transfers and connecting your
    camcorder or VCR to your Media Center PC. This chapter takes a look at capturing
    your videos and playing them in Media Center.


    # Getting Videos into Your Media Center PC


    Home movies and videos come in two varieties: analog and digital. What it boils
    down to is if you don''t have a digital camcorder, everything else is analog.
    Between the two, digital videos are the easiest to get into your PC, and the quality
    is generally excellent.


    Media Center is all about playing—not capturing them. It also allows you to connect
    a digital camcorder to your Media Center PC and play videos from it using the
    transport controls in Media Center, it does not save the video as a file.


    # Use Movie Maker to Capture Video


    To“capturing analog or digital videos from your camcorder, VCR or other video
    source, you will need to use a capture program. Media Center PCs equipped with
    Microsoft’s Movie Maker software, which can be used to capture, edit, and create
    videos.


    Because your Media Center PC has an IEEE 1394/Firewire connector, it can easily
    capture digital videos in Movie Maker and other video editing programs you may
    have. Since it also has a TV tuner card it can be used to capture analog video
    by other video-editing programs you may have that can capture analog video.


    Check with your owner’s manual or on-screen help to see which video capturing
    programs in addition to Movie Maker your computer came with and how to use them.
    For now, Movie Maker will 273'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# 274 PC Magazine—Guide to Windows XP Media Center Edition 2005


    do a great job for capturing your analog or digital videos. Figure 17-1 shows
    Movie Maker in action. Use Movie Maker''s on-screen help and video-capturing wizards
    to capture your videos and use its editing features to edit your video. When you
    have a video that you are happy with, save it to your hard drive.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_294_0.png)


    Figure 17-1: Movie Maker captures and edits home videos.


    You will be able to find video files in any location on your PC or home network,
    so you can place your video files where you choose. In addition, if you have video
    files as video clips that you recorded on a digital camera that are stored on
    the camera or memory storage card, they can be viewed in My Videos. Before saving
    any video, it is good to understand which file formats are best to work with your
    videos in general, and Media Center specifically.


    # File Formats for Videos


    You can capture videos and save them in a variety of formats. The good news is
    that Media Center supports most popular formats. When capturing video, remember
    that just like with picture files, there are uncompressed formats such as AVI
    that create huge files, and compressed formats such as MPEG save at a much smaller
    size with an acceptable resolution in overall quality. A good practice is to capture
    a few videos at different compression settings and see how the result looks. If
    you have saved a few files, take a look at how large they are and how much space
    you want to commit to storing home videos. That will help you determine which
    compression setting is best for you.'
  merge: -1
