  md: '# Chapter 1: Planning to Use a Windows XP Center Edition PC 5


    # # Portrait of a Windows Entertainment PC


    When you purchase a Media Center PC, it''s a good time to review the progress
    you are making moving to an all-digital entertainment system. In fact, it is a
    great time to upgrade your current entertainment equipment and get rid of some
    of it. Whether the Media Center PC is used in your living room, family room, or
    your home office, it represents the opportunity to create an amazing digital entertainment
    system.


    At first glance, a Windows XP Media PC looks just like a regular Windows PC—because
    it is. It is a high-end PC powered by Windows that has been expanded to play media
    using a special extension of the Windows operating system and high-performance
    components that are optimized for getting media content in and out of the PC.


    Most Windows PCs enable you to play music using Media Player and many other programs
    designed to play music. The same is true for videos and digital photographs. If
    your computer has a TV tuner card you can also view and record TV programs. Although
    it is possible to varie add audio and video cards to play media, a configuration
    would lack integration and ensure your user interface across media applications.


    Media Center PCs enable you to view and control your TV, DVD, music, and digital
    photo collection using Media Center PC. It keeps all media in one unified place
    and that you to control, and view your media the way it was intended to be viewed—on
    a TV with a remote control.


    Sitting at a computer monitor, mouse, and keyboard is better for word processing
    and traditional computations, you''ll probably agree that it is not conducive
    to watching TV or listening to music. If you are like most people who will want
    your experience to be in a more comfortable setting, such as a living room or
    family room. Additionally, PCs don''t work for viewing by groups of people; it''s
    hard for more than one person to view a computer monitor. TVs remain the most
    natural way to watch TV and view videos.


    Media Center PCs take care of that problem. You can literally set up your Media
    Center PC in your family room, turn it on, and control it without a keyboard or
    a mouse—just a remote control.


    # ## Both a PC and an Entertainment Center


    The fact that a Media Center PC works well as an entertainment center presents
    one important question: Do you use it as PC or do you use it as an entertainment
    device?


    Because you can hook both a computer monitor and a TV to the PC simultaneously,
    you can have both displays in either home office or the family room. Until now
    that has been about the only option if you wanted to use a Media Center PC for
    home office and traditional computing—and occasionally use it for media viewing.


    Some people may continue to use a Media Center PC as their home office PC Others
    may take the place and locate it in their family room hooked up only to their
    TV and dedicate it to their entertainment center. The good news is that it can
    be used for both purposes—and at the same time.


    Using simple home networking and "Extender" rooms, you can solve the "office vs.
    family room" dilemma. In the chapters that follow you can set up your PC in the
    home office and network it to an inexpensive device that hooks up to your TV and
    allows access to the complete Media experience from anywhere else in your home.


    Figure-1 shows a typical Media Center PC home configuration using the PC in the
    office and Media Center Extenders for the family room and bedroom.'
