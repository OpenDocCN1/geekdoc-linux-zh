    shows on a DVD.


    Another option is to use a third-party DVD authorizing application, which should
    allow a bit more customization.


    # Using PrimeTime to Burn Shows to DVD


    One of the first-party applications that became available for Media Center was
    PrimeTime from Sonic. It is nicely featured in the Spotlight menu of Media Center
    and is easily downloaded or purchased or installed from a CD.


    PrimeTime is a Windows Media Center application and adheres to the user interface
    and controls standard to Media Center. It is launched from the More programs on
    the Start Screen and is as easy to use as any other Center application.


    The first step is to obtain a copy of the program. If you have high-speed Internet,
    the simplest way is to download it from www.sonic.com.


    After purchasing the program, or if you purchased a CD for installation, install
    it on your computer following the on-screen instructions. PrimeTime will be one
    of the applications featured in the More Programs menu.


    Click the PrimeTime button and you are sent to the program as shown in Figure
    11-15. There is a bit of ''jump'' when you switch to third-party applications.
    Even though it doesn''t look like it, you are actually in Windows XP and the program
    is running as a stand-alone application. This is not a failing in any way; because
    if additional applications are developed for use in Media Center.


    As you can see, although the colors are different, the program menu contains a
    list of the programs you have recorded by name or data. In My TV, shows have a
    room available on a DVD, and so you sort your programs by name or Data. Data information
    about the shows and appears as you move your cursor over the shows.


    The size of the recording shows with the show. This is really useful information
    because you can see how large the recording is and use that information to decide
    how many shows you can fit on your DVD. Some programs can be added to a DVD recordable
    disc at different times, the on-screen display of the DVD disc in your burner
