  md: '# 142 PC Magazine—Guide to Windows XP Media Center Edition 2005


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_162_0.png)


    **Figure 9-7:** The On-screen Centering and Sizing test.


    The next test helps with that situation. The Aspect Ratio test, shown in Figure
