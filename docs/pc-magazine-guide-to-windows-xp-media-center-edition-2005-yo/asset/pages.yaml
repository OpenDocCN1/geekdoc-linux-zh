  md: '# Chapter 9: My TV and the Program Guide


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_161_0.png)


    **Figure 9-6:** The Display Calibration tests menu.


    The calibration process is pretty simple, but you need to be sure to familiarize
    yourself with how your TV or computer monitor makes adjustments.


    Computer monitors will often have display adjustments from the front panel of
    the display. From a Menu you should be able to get controls for brightness, contrast,
    and color, plus controls for size and position on the screen. The controls can
    be tedious to use and it is a good idea to play with them a bit to get how to
    use them.


    TVs will likely use a Menu on the remote to make adjustments. Although there are
    options to adjust brightness, contrast, and contrast, there may not be any adjustments
    for size or positioning on the screen. TVs will fill the screen and maintain a
    consistent aspect ratio.


    After familiarizing yourself with your display controls you can fine-tune them
    using the videos from the Display Calibration menu. Each test takes you through
    three steps. The first step shows you what the test contains, the next screen
    explains how to make the adjustments on your display, and the third screen shows
    a self-repeating video to view as you make any adjustments. To stop the video,
    press the Esc key on the keyboard or the Back button on your remote.


    Figure 9-7 shows the first test to send to your display—On-Screen Centering and
    Sizing. This may apply more to computer displays than TVs, but it is good to ensure
    that your TV is displaying the information correctly.


    The test plays a full-screen video with an inset window showing how the video
    should fill the display if it is adjusted properly. If it is not displaying properly,
    use the width, height, and horizontal vertical position adjustments on your display
    to get the screen to match the inset video. It is possible to adjust the width
    or height of the video to be too wide or tall in an attempt to fill the screen
    fully. This could result in the aspect ratio being incorrect. A typical example
    would be attempting to fill a 4:3 aspect ratio video on a 16:9 aspect ratio display.
    Everything would be too wide.'
  merge: -1
