  md: '# Chapter 10


    # # Recording and Playback of TV Programs


    Anyone who has owned a VCR over the past 20 years has had the ability to record
    TV programs. Interestingly, only a very small percentage of people who owned VCRs
    used them to record TV shows on a regular basis. The cost and hassle of blank
    videotapes, labeling them, storing them, remembering to put a blank tape in, and
    figuring out how to schedule a recording made the process needlessly complex.
    Maybe it was just once you have seen a show or a movie you rarely wanted to watch
    it and again.


    In the 1990s DVDs began to replace VCRs—and for playback device, VCRs are low-quality
    compared to DVDs. With a DVD you could jump to different channels in an instant.
    You didn''t have to rewind them. If you only wanted to play a movie, the DVD format
    was the way to go.


    Another device appeared in the late 1990s—the Digital Video Recorder (DVR). DVRs
    from TiVo and ReplayTV arrived with the promise that they could watch TV viewing
    forever. Essentially hard drives connected to a TV tuner card with an operating
    system dedicated to scheduling, recording, and playing back TV programs, they
    offered the recording ability of a VCR with the digital features of DVDs.


    DVR allow you to view a sophisticated Program Guide that can schedule a recording
    for later, or even record a favorite show or type of show whenever it''s. Once
    recorded, you can play the show back and jump around the program just like a DVD.
    Even better, since the hard drive is recording what you are watching, you can
    cause a pause and return and pick up where you left off. All of these features
    are a perfect complement to TV viewing.


    The concept of shifting TV viewing is possible with a DVR. Even when watching
    a live show, its possible to time-shift when needed. What is time shifting? Well,
    you can replay a scene, for example, just like with a DVD. You can decide in the
    middle of the show that you would like to record it for later. You can even wait
    about 15 minutes before viewing and it zap segments or commercials you don''t
    want to view.


    Digital Recorder is any device that can store video on digital media such as a
    hard drive. PVR, which stands for Personal Video Recorder, is often used to describe
    the exact same device.


    # Note'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Recording TV Shows


    Although DVR devices are gaining momentum (Dish and DirecTV now offering DVR features
    to new subscribers), they are still expensive because they require a monthly subscription
    fee to use the Guide, they have a limit to how many hours can be recorded, and
    their hard drives cannot easily be upgraded to larger sizes.

    Media Center PCs are fantastic DVRs and then some. Right out of the box, a Media
    Center PC has virtually all of the features and benefits of dedicated DVRs but
    with significant advantages:


    +   - There''s no monthly subscription fee for the Program Guide.

    - You can add as much storage as desired to record TV programs by adding hard
    drives.

    - With a DVD burner you can transfer recorded shows to DVDs.

    - A Media Center PC with extenders can power multiple users and TVs.

    - You can use a computer to view your recorded TV shows, effectively turning your
    PC monitor into a bonus TV.


    All of these features are included in a home entertainment device that also includes
    DVD playback, playback of music and digital photos, and comes with a top-of-the-line
    PC at an affordable price. Once you''ve set up your Media Center PC to play TV
    as covered in Chapter 9, you are ready to begin shifting and recording TV shows.
    Let''s get started.


    # Recorder Settings


    Media Center can record TV at different "quality" settings. Because TV programs
    are files on your hard drive, you wish to sacrifice a bit of visual quality to
    fit more hours of TV on your hard drive. Different levels of compression are used
    when recording a show. The more compression used, the lower the quality of the
    video. Less compression in a high-quality video takes more space on your hard
    drive.

    Media Center uses four levels of "quality," or compression. Table 10-1 gives an
    approximate estimate of how many gigabytes per hour of recording you can get at
    each quality setting.


    | 10-1 Hours of Recording at Different Quality Settings |

    | Recording Quality | Approximate File Size |

    |---|---|n| Best | 3GB per hour |

    | Better | 2.5GB per hour |

    | Good | 2GB per hour |

    | Fair | 1GB per hour |


    As you can see, when using the "best" quality setting, if you have 60GB of hard
    drive available for recorded TV shows you would be able to store about 20 hours
    of programs. At the "fair" quality setting you could get about 60 hours of programming.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Chapter 10: Recording and Playback of TV Programs 161


    To understand which setting is right for you, think about the following issues:


    +   - Are you only recording the shows for one-time playback? If so, you can record
    at the best quality since you will be erasing the show after viewing.

    - Will you be storing the shows on your hard drive long-term? If so you will want
    to consider using a lower quality setting because the gigabytes fill up quickly
    on any hard drive with high-quality recordings.

    - Are you planning to store the shows on a DVD? Just like a hard drive, DVDs can
    hold more hours of programming when you record the show at a lower quality setting.
    At the “best” setting you can only fit a one-hour show on a DVD. At the “fair”
    quality setting you can fit out about four hours on a DVD.


    Beyond storage and DVD burning considerations you will ultimately need to record
    shows at the different quality settings and watch on your TV or computer monitor.
    If the quality setting is acceptable, then use it and gain as much storage as
    possible. If the higher quality settings are more to your liking and you have
    plenty of storage space, use those—but remember you cannot fit many hours on a
    DVD at the best setting. For a two-movie show, use the “good” setting to fit it
    onto a single DVD.

    The preceding concepts are ones that you will understand better once you record
    shows at different quality settings, the first step is to learn how to change
    the settings. From the Media Center Start, choose Settings, TV, and then Recorder.

    Once you are at the Recorder Setting screen, as shown in Figure 10-1, there are
    two menus that you will need to work with: Recorder Storage and Recording Defaults.
    These menus enable you to set the recording quality and also set which hard drives
    are stored on, how much of that hard


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_181_0.png)


    Figure 10-1: The Recorder main menu.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# 162 PC Magazine—Guide to Windows XP Media Center Edition 2005


    be dedicated to recording shows, and how long the shows should be kept. You can
    also set limits on how many hours of shows can be recorded each day and whether
    a recording should start and stop it before and after a show airs


    First, go to the Recorder Storage space as shown in Figure 10-2. This menu controls
    where the files are stored and what percentage of the drive can be used for.


    ![](img/9c34804a6113e2b911b7ce17a1a67b67_182_0.png)


    Figure 10-2: The Recorder storage menu.


    The first item to set is the drive to store recorded programs on. You will most
    likely have both a C and a D drive. If you have added a second hard drive or external
    hard drives attached, you will have drive letters associated with those.


    Your C drive is generally where the Windows XP system and program files are stored.
    The D drive is usually allocated for data storage and is larger than the C drive.
    Add-on drives may offer more room than the C drive since most C are partitioned
    to be relatively small. You can see how much room on any of your hard drives by
    using the My Computer panel from Windows XP. Click on any of the drives to view
    their total size and how much of the drive is used by data or programs.


    The Recorder space tells you how much each drive has—and how you know how much
    space on drive can be used for recording. When you click the plus and minus symbols
    on the Record on drive, it displays how large that is. As you change drives, the
    screen shows a listing of how much space is available for recordings and how much
    of that space is currently being used by recorded programs. This applies only
    to the percentage of the drive dedicated to recording.


    Under the Record on drive item is a setting for what percentage of the drive is
    dedicated to recording TV shows from My TV. Use the Disk Allocation setting to
    change the percentage. You will see the estimates at the bottom of the screen
    change accordingly.'
