  md: '# Aspect Ratio Issues


    In the past years both computer monitors and TVs have taken on new shapes—particularly
    widescreen formats. To display movies in their original theatrical release formats,
    DVDs were available in widescreen versions. Although it was great to see movies
    as they were intended by the director, TVs are in a 4:3 aspect ratio, and widescreen
    movies are in a 16:9 aspect ratio.


    When on a regular TV, the widescreen movie filled the width of the screen, and
    black bands appeared on the top and bottom of the screen. This was referred to
    as "letterboxing" and much of the actual information was used for the black bands
    on the top and bottom of the screen. To put more detail and actual picture on
    the screen, TVs were set to be made in 16:9 widescreen aspect ratio. This was
    great for watching DVD, but no great for watching standard TV.


    One of two things when you watch 4:3 aspect ratio programs on a widescreen TV
    or computer monitors—the4:3 is stretched to fill the width of the screen and as
    a result the image is distorted, or the 4:3 is contained within the width—you
    guessed it—black bands on each side of the image. There is no winning when it
    comes to aspect ratio.


    The first release of Media Center presented all information in a 4:3 aspect ratio,
    just like a standard TV. If you would to change the setting on your computer monitor
    or TV would have a stretched image that was distorted or you would have to display
    a 4:3 true aspect ratio with vertical bars on each side of the image.


    The good news is that starting with the release of Media Center 2004, widescreen
    support is a part of the system. Rather than stretching or changing settings on
    your display, you set Media Center for the correct aspect ratio and it fills the
    display correctly and fills in the top or side areas without the black bars. For
    this reason, it is important to go through the display calibration process and
    establish the display width for your computer monitor or TV.


    # Calibrating Your Display


    Until this, all of the menus have established what type of display you are using
    to be able to take you to a series of calibration routines where Media Center
    displays visual information for your particular display. At this point you will
    actually make adjustments to your display using its settings. Most TVs and computer
    monitors have a number of controls for brightness, contrast, color, sharpness,
    and image size. Media Center will display reference images and you will make adjustments
    to match your display to the reference images.


    After making your choice for the connection type, click the Next button and you
    will arrive at the Display Calibration menu shown in Figure 9-6.


    From the Display Calibration menu you can view videos that will help you correctly
    set your display for:


    +   - Onscreen Centering and Sizing

    - Aspect Ratio (Shape)

    - Brightness (Black and Shadow)

    - Contrast (White)

    - RGB Color Balance'
  merge: -1
