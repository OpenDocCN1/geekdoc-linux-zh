    jack, you will need to use that.


    > Note

    If your TV has only a standard antenna connection, be advised that the quality
    from that connection may not be satisfactory. If that is your only choice, you
    can purchase an adapter from an electronics store such as Radio Shack to connect
    component video to RF, which is the term used for the antenna connection on your
    TV.


    After making the appropriate connection for video, connect either the RCA-stereo
    connectors to the audio-in jacks on your TV, or, if you are using a surround sound
    system, connect the digital audio connection on the Extender to your surround
    sound system.

