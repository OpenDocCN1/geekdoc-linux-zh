  md: '# Chapter 14: Listening to Broadcast and Internet Radio


    A good way to get started is to manually enter the number for a favorite radio
    station in your area. Even if you enter a number, nothing happens until you click
    the Start FM button. This starts the FM tuner and tunes to the station you entered.


    # Note


    Are you entering stations or clicking on presets and not hearing anything? Be
    sure to click Start FM to fire up the FM tuner.


    You can use any of the standard methods for number entry used everywhere in Media
    Center to enter station numbers—number buttons on the remote control or the number
    keys on your keyboard. If your antenna is a good one, you should hear your radio
    station. If you hear the station there is static, try moving your antenna to a
    different location. If your station still static, before running out to purchase
    a better antenna, tuning to other stations to make sure the problem really is
    with the antenna. Using the buttons, tune to other radio stations and see how
    the reception is also how many stations come in clearly. If you get clear stations,
    your antenna is the job. If very few stations come in, you may need a better antenna.


    # Creating Presets


    As you tune up and down using manual entry, seek, or tune, you will find stations
    that you will want to listen in the future. Just as with car and home radios,
    Media Center enables you to store your favorite stations as presets for easy station
    selection.


    To create a preset, simply tune to a station, and once you have tuned it, click
    the Save button. It saves the station as presets in the next available preset
    slot. Nine stations are available. Figure 14-5 shows the Radio with a full set
    of presets.


    You can change, delete, or alter the order of radio presets by going to the Radio
    Settings menu. Each of the presets can be edited or deleted. Using the Up and
    down arrows, you can change the order of the presets. Clicking the “X” button
    removes the preset from that location. If you are using your remote for this function,
    use the arrow to move up and down within the list of presets and use the Up or
    Down buttons to move the preset within the list. To delete a preset, use the Delete
    button on the control.


    The Autosort reorders the list in ascending or descending order. Each time you
    click the button it changes from ascending to descending or ascending.


    Clicking Save saves the order and set of presets as shown on the Radio Settings
    menu. If you click Cancel, it exits the Radio menu without changing the presets.
    (See Figure 14-6.)


    # Navigating Live Radio


    Once you have your stations tuned and presets selected, you can begin listening
    to FM radio. Table 14-1 shows the quickest ways to move to presets using each
    input method.'
