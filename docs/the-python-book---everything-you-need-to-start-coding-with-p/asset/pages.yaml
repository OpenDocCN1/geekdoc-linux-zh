  md: '# # Use Python with ip


    ## 08 Set up a ip address

    Each time you connect to the internet, your Pi will be given a new IP address.
    This is called a dynamic IP address. This can cause issues, when it changes, other
    devices will no longer be able to locate your Pi. To create one that is static
    (IP address), load the LX Terminal, type ifconfig and make a note of the inet
    addr, the Mask number, type route -n and note down the Gateway. Type sudo nano
    /etc/network/interfaces, find the first line (eth0) and change it to:


    ```

    ```

    interface eth0 static

    address 192.168.1.5

    netmask 255.255.255.0

    gateway 192.168.1.1

    network 192.168.1.0

    broadcast 192.168.1.255

    ```

    ```


    Replace the numbers with yours (which you noted). Press CTRL+X to save and exit
    the editor. When you reboot your Pi, it will now have a static IP address which
    not change when you reboot or reconnect.


    ![](img/516df994db593237169e2aff6d3e6840_169_0.png)


    # ## 11 Configure the software – part 2


    Next, find the streamport, which is set to 8080. This is for the video and you
    can change it if you are having issues viewing the feed: 8081 provides a static
    feed. Then, find the Localhost line and set it to localhost to access the video
    via the control_port and you can change it if you are having streaming issues.
    The frame rate is the number of frames per second that are captured by the webcam.
    The higher the frame rate, the better the quality, but the more performance and
    produce lag. Set the post_capture and specify the number of frames after motion
    has been detected.


    ![](img/516df994db593237169e2aff6d3e6840_169_1.png)


    # ## 09 Install the web server


    To set up the web server, use the LX Terminal and update your Raspberry Pi by
    typing apt-get update, sudo apt-get upgrade. Next, install the Motion server that
    will control the webcam; type sudo apt-get install motion. Once it is finished,
    restart your USB webcam and reboot you will see that your webcam is recognized.


    # ## 12 Running a motion daemon


    A daemon is a program that runs in the background providing a service; in this
    project you do not want to manually start run Motion every time you use the Pi.
    It''s better that it automatically starts at boots. In the LX Terminal, type nano
    /etc/motion/motion to edit the file. To run motion as a service from boot, you
    need to change the start_motion_daemon to yes


    ![](img/516df994db593237169e2aff6d3e6840_169_2.png)


    # ## start_motion_daemon=yes


    Save and exit the file by using CTRL+X and restart your Pi.


    # ## 10 Configure the software – part 1


    Now there are several configurations in order to get the most useful from the
    webcam. You can experiment with this which produces the best results. In the LX
    Terminal,


    ```

    ```

    sudo nano /etc/motion/motion.conf

    ```

    ```


    ... to load the configuration file. Locate the daemon line you can find by pressing
    CTRL+W (which loads a keyboard search) and then set it to ON which will start
    Motion as a service when you boot your Pi. Next, find the webcam, Localhost and
    set it to OFF so that you can access


    # ## 13 Starting the web feed


    Before viewing the feed, make a note of your IP address. In the LX Terminal, type
    ifconfig, if you have set it up then. Then start Motion by typing motion. Wait
    for few seconds to initialize then open a browser on your device. Enter the IP
    address of your Pi, including the port number that you set in step 11. If you
    use VLC player, go to File > Open Network and enter the IP address of your Pi.


    # ## 14 Install the Pi recorder


    FFPM is a neat library which allows your Raspberry Pi to broadcast to a radio.
    Note that this is only for experiment and should you want to make a public broadcast
    must obtain a suitable license. Getting up it is simple: load the LX Terminal
    and make a new directory to


