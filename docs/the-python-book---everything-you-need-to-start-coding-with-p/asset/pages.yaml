  md: '# Pygame Zero


    Pygame Zero cuts out the boilerplate to turn your ideas into games instantly,
    and we''ll show you how


    # Resources


    +   - Pygame Zero:

    pygamezero.readthedocs.org

    - Pygame:

    pygame.org/download.html

    - Pip:

    pip-installer.org

    - Python 3

    www.python.org/


    Games are a great way of understanding a language: you have a goal to work towards,
    and each feature you add brings more fun. However, games need libraries and modules
    for graphics and other essential features. Pygame made it relatively easy to make
    games without getting bogged down in technicalities that you need before you get
    started - barriers to your young getting kids started in code.


    Pygame Zero comes with all of the boilerplate code for you, aiming to get you
    coding games instantly. PG (if we approximate) it makes sensible assumptions about
    what you''ll need for a game - from the size of the window to importing the game
    library - so that you can get started coming to your ideas.


    PG''s creator, Daniel Pope, told us that the library ''grew out of talking to
    teachers at Python UK''s education track, and trying to understand that they need
    to get immediate results and breaks into bite-sized fragments, to keep kids close
    to speed. To give you an idea of what''s involved here, we''ll build up a simple
    game from a Pong-type bat and ball through smashing blocks.


    The project we create will demonstrate what can be done with little effort. Rift
    in early development but still offers a great start - and has been built on the
    Pi with a simple image. We''ll look at installation on other platforms, but first
    let''s see what magic it can perform.


    Code from FileSilo (optional)


    ![](img/516df994db593237169e2aff6d3e6840_123_0.png)'
