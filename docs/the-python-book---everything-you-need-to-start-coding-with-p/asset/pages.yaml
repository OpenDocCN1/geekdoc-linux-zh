    # # Part two: Add animation and sound to Pivaders


    After writing a Space Invaders clone in 300 lines of code, now we expand it to
    include animation and sound


    # ## Resources


    +   - **Raspbian**: [www.raspberry.org/downloads](https://www.raspberry.org/downloads)

    - **Python**: [www.python.org/doc](https://www.python.org/doc)

    - **Pygame**: [www.pygame.org/docs](https://www.pygame.org/docs)

    - **Art assets**: [openggameart.org](https://openggameart.org)


    We had fun creating our Space Invaders clone. For the previous tutorial, the key
    challenges with the project were to keep it to manageable – just 300 lines of
    Python. Without the use of Pygame''s strength set the goal would have been nearly
    at least twofold. Pivaders'' ability to manage and detect collisions thanks the
    Sprite class really made a great difference to project, not just in terms of length
    but in simplicity. If you missed the first part of the


    project, you can download via github.io/kBvTG while you can find final version
    v0.2, including all the images, music and sound effects we used, over at github.io/kBvTG.


    Even within the clearly defined framework Pygame offers, there are still ways
    we could have approached adding animations. We could have created one of classes
    to manage and contain containers of images, layers of smaller (images) which we
    would need to draw (or scroll) to the screen.


    For better readability and performance, we integrated a few methods into our Game
    class and output to a sprite sheet. Not only does it make it easy to draw under
    control and keep performance levels up, which is important for the Raspberry,


    # ## 01 Setting up dependencies


    As we recommend with the last tutorial, you''ll get much more from the example
    scripts. To run the code we''ve made available online, you will need Pygame installed.
    Use it as reference as you create your own animations and sound for your Pygame
    projects. Regardless of whether you want to learn how to play or walk-through
    the code to get a better understanding of basic game creation, you''re going to
    need basic game dependencies. The two key requirements here are Pygame and git,
    both of which are installed by default on update-Raspbian. If you don''t have
    them, type them at the command line:


    ```

    sudo apt-get install python-git

    ```'
