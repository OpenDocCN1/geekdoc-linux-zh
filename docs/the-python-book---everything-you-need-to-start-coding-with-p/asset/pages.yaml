  md: "# 01 Preparing the directory structure\n\nAs we have mentioned previously,\
    \ Kodi follows a certain directory naming convention. In this case we are building\
    \ a video plugin, so the plugin name will be 'addon'. But the root directory we\
    \ will need several other folders and files as follows:\n\nThe following shows\
    \ the directory structure of Linux Environment:\n\n+   - addon_name - Root plugin\
    \ directory\n- addon.xml\n- default.py\n- icon.png\n- README\n- resources\n- settings.xml\n\
    \n```\nversion=\"2.6.0\"\n<import addon=\"plugin.video.youtube\"\nversion=\"3.0.0\"\
    >\n<import addon=\"plugin.video.vimeo\"\nversion=\"3.0.0\">\n<import addon=\"\
    plugin.video.dailymotion.com\"version=\"1.0.0\"\n<require/>\n```\n\nIn the above\
    \ we have added a library called xbmc.video 2.6.0. Currently it is a mandatory\
    \ dependency, but if you want to add optional ones you will need to add <import\
    \ addon=\"addon.special version=\"0.1.0\"/>.\n\nIn the example above we have edited\
    \ the version with Kodi Leia 10.0 or higher. It would only work in Kodi Xby 11.0\
    \ and not in the latest version.\n\nUsing the latest version of Kodi Kodi: 19\
    \ (released in 2021) to set up the plugin. Kodi 18 will still be used and found\
    \ on the Old Releases section of the website at https://mirror.kodi.tv, which\
    \ is no longer supported, though not end of life.\n\nIn this example we are also\
    \ adding some third-party plugins as shown using xbmc.video_plugin. These will\
    \ show up in the video section of Kodi.\n\n# 02 Creating addon.xml\n\nAn addon.xml\
    \ file must be created in the root of the directory. The addon.xml file contains\
    \ the metadata about the plugin. It contains various information like credits,\
    \ version and dependency information about the theme.\n\nThe root of the addon.xml\
    \ is <addon>. It is defined as follows:\n\n```\n<addon id=\"plugin.video\"\n<name>XBMC</name>\n\
    <version=\"0.1.0\">\n<provider>\n<root of the content is placed here\n</addon>\n\
    ```\n\nHere, id is the identifier for the plugin, so it should be unique among\
    \ all the addons, and it is also used for dependency version. Kodi follows the\
    \ version naming which helps in delivering automatic updates - Kodi follows the\
    \ Major.Minor.Patch versioning convention; name follows:\n\nNote: Steps 3 to 5\
    \ covers that that need to be added within the addon.xml file.\n\n# 03 Adding\
    \ dependency information\n\nDependency inside an extension is managed using the\
    \ <requires> \n\n```\n<requires>\n<import addon=\"xbmc.plugin\"\n```\n\n# 04 Setting\
    \ up the plugin entry point\n\nOur extended purpose is to provide the video content\
    \ for Kodi. In order to convey that, we have to set up the following:\n\n```\n\
    <extension point=\"xbmc.plugin\"\ngesurface=\"library.default.py\"\nversion=\"\
    1.0.0\">\n<|extension|>\n```\n\nHere, the library entry sets up the plugin entry\
    \ point. It is a default script which will be executed when the user activates\
    \ the plugin. The <extension> elements set up the media type it provides. This\
    \ also gets reflected in the placement of the plugin-in. Since it will show up\
    \ in the video section of Kodi.\n\n# 05 Setting up in-metadata\n\nMetadata about\
    \ the plugin is provided in <extension point=\"xbmc.addon.metadata\">. The following\
    \ are the important elements...\n\nplatform: The only, XBMC are cross-platform\
    \ compatible. However, if you want to depend on the native library that is only\
    \ available on certain platforms, you can use the following supported attributes.\
    \ Here they are:\n\nlanguage: This gives the description of the plugin. In our\
    \ example sets the language attribute as English, but you can use other languages:\n\
    \nwebsite: Where the plugin is hosted. Source: repository URL. If you are hosting\
    \ your plugin on GitHub, you can mention the repository URL there.\n\nforum: Discussion\
    \ forum for your plugin. If you use <email> you can directly link your email or\
    \ use a free-provider email address like domain.com.\n\n# 06 Setting changelog,\
    \ icon and fan\n\nWe need a few files in the plugin-directory. The changelog lists\
    \ your plugin-changes in the Kodi UI.\n\nAn example changelog:\n\n+   - 0.1\n\
    - Initial Release\n- 0.2\n- Fixed Buffering Issue\n\nicon: This will be a non-transparent\
    \ PNG file for the Kodi UI. It should be of size 256x256 pixels.\n\nfanart (png):\
    \ The fanart is rendered in the background if a user selects the plugin-in in\
    \ Kodi. The art needs to be rendered in HD format, so its size can range from\
    \ 728 (72dpi) up to 1920x1080 (1080px).\n\nThe Python Book 75"
