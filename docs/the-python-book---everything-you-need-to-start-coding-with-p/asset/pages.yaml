  md: "# # Get started with Python\n\nTIP\nYou can define defaults for variables if\
    \ you want them to be included in the function without passing any variables through\
    \ at all. You do this by assigning an equals sign after the variable name: for\
    \ example\n`def my_function(string='default'):`\n\n# Or with a while loop:\nprint(\"\
    Using a while loop\")\n# We already have the total above, knowing the len function\
    \ is very\n# useful:\ntotal = len(ints)\ncount = 0\nwhile count < total:\n   \
    \ print(str(ints[count]))\n    count = 1\n\n# # Functions and variable scope\n\
    \nFunctions are used in programming to break code down into smaller chunks. This\
    \ makes code much easier to read. Functions can be reassigned in certain ways.\
    \ Functions can have variables passed by value, which means that a copy of the\
    \ variable is passed to the function that is only valid in the scope of the function.\
    \ Any changes made to the original variable inside the function will be discarded.\
    \ Functions can also return values, so this isn't an issue. Functions are defined\
    \ with the keyword `def` followed by the name of the function. Any variables that\
    \ are passed through in brackets. Multiple variables are separated by commas.\
    \ The names given to the variables in these brackets are the\n\nthat will be in\
    \ the scope of the function, regardless of what\nthe variable that was passed\
    \ to the function is. Let's see\n\nThe output from the program opposite is as\
    \ follows:\n\n> \"Functions are used in programming to break processes down in\"\
    \n\n```\n#!/usr/bin/env python3\n\n# Below is a function called string, which\
    \ accepts a variable\n# that will be called original in the scope of the function.\
    \ Anything\n# indented with 4 spaces under the function definition is in the\n\
    # scope:\ndef modify_string(original):\n    original += \" that has been modified.\"\
    \n    # At the moment, only the local copy of this string has been modified\n\
    def modify_string_return(original):\n    original += \" that has been modified.\"\
    \n    # However, we can return our local copy to the caller. The function\n  \
    \  ends as the return statement is used, regardless of where it\n    is in the\
    \ function.\n    return original\n```\n\nWe are now outside the scope of the modified_string\
    \ function, as we have reduced the level of indentation\n\nThe test string won't\
    \ be changed in this code\n\n```\ntest_string = \"This is a test string\"\n\n\
    modify_string(test_string)\nprint(test_string)\n\ntest_string = modify_string_return(test_string)\n\
    print(test_string)\n```\n\n# The function's return value is stored in the variable\
    \ test string,\n# overwriting the original and therefore changing the value that\
    \ is\n# printed.\n\nHowever, we can call the function like this\n\n14 The Python\
    \ Book"
