    # 03 Making calculations


    +   - one = np.array(1,2,3,4)


    The aforementioned command creates a one-dimensional array. If you want to create
    a two-dimensional array, you can use the array function:


    +   - two = np.array([[1,2,3],[-1,-2,-3],[0,0,1]])


    You can also create arrays with more dimensions.


    # 03 Making simple calculations


    Using a given array, you can find the minimum and maximum values in it by executing
    the following commands:


    ```

    >>> array.min()

    >>> array.max()

    ```


    Should you want to find the mean value of all array elements, run the next command:

    The median divides the set into two subsets with the same number of elements.
    If the set has an odd number of elements, the median is the part of the data set.
    On the other side, if there is an even number of elements, then the median is
    the mean value of the two centre elements of the sorted data set.


    ```

    >>> array.median()

    ```


    # 04 Using with NumPy


    NumPy only indexes the indexing which is useful for sorting arrays and lists.
    If you also want to sort a given element from an array, you can use the following
    function:


    ```

    >>> np.sort(array)

    ```


    You can also select a part of an array (a slice) using the following function:


    ```

    >>> array[0:3,1]

    ```


    Finally, you can convert an array into a Python list using the following:


    ![](img/516df994db593237169e2aff6d3e6840_80_0.png)


