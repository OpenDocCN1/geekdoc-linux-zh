  md: '# Create a Minecraft Minesweeper game


    Use your Raspberry Pi and Python knowledge to code a simple mini-game in Minecraft


    # Resources


    Jessie or Raspian:

    raspberrypi.org/downloads


    Python:

    www.python.org/


    You may remember or have even played the classic Minesweeper PC game that originally
    dates back to the 60s. Over the years it has been bundled with many operating
    systems, and has been featured as a mini-game on mobile phones.


    # 01 Update and install


    To update your Raspberry Pi, open the terminal and run


    This project will walk you through how to create a simple version in Minecraft.
    We will code a script that sets out an arena of blocks and turns one of these
    blocks into a mine. To play the game, guide your player around the board. Each
    time you stand on a block to find it and collect points, but watch out for the
    mine as it will end the game and you will lose.


    ```

    sudo apt-get upgrade

    sudo apt-get update

    ```


    The Raspberry Pi OS image has Minecraft and Python installed. The Minecraft API
    which enables you to interact with Minecraft using Python is also pre-installed.
    If you are using an old OS version, we highly recommend downloading and then updating
    your version to either the most recent Jessie or Raspbian.


    ![](img/516df994db593237169e2aff6d3e6840_119_0.png)'
