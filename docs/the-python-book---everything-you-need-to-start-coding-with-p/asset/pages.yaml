    save it as a NumPy array, the following code will find the number of requests
    per hour:


    ```

    $ cat access.log | cut -d '' '' -f 1 | -n | awk ''{print $1}'' | sort | uniq -c
    | awk ''{print $2, $1}'' > output.txt

    ```


    # 05 Reading files


    The format of the text file (text.txt), use the following code to load it into
    a NumPy array:


    | 00 | 19 |

    | 01 | 22 |

    | 02 | 121 |

    | 03 | 104 |


    Reading the time.txt file and assigning it to a new array variable can be done
    by:


    ```

    >>> aa = np.loadtxt("time.txt")

    ```


    # 06 Writing to files


    Writing variables to a file is similar to reading a file. If you have an array
    named aa, you can use it to save contents into a file aa.txt using the following
    command:


    ```

