    \ instead of \"minecraft.create\".\n\n```\n```python\nimport random\nimport time\n\
    from mci import minecraft\nmc = minecraft.create()\n```\n```\n\n# Switching to\
    \ the shell\n\nSwitch between Python and Minecraft screens is difficult especially\
    \ as Minecraft. The best way is to use the windows around the screen to run MC\
    \ full-screen as the mouse controls enable off. Use the Tab key to release the\
    \ keyboard and mouse from the MC window.\n\n03 Running the code\nUsing Python\
