  md: '# Use Python with Pi


    extract the files into:


    ```

    start_motion_daemon=yes

    mkdir Pifm

    ```


    # 16 Stop the broadcast


    If you wish to end the broadcast before the song voice has finished, you will
    need to kill the transmission. In a new terminal window, type top. This will list
    all the running programs. Look for Pifm somewhere near the beginning of the list
    and note its PID. Return to the terminal and type `kill -9 <PID>` ( replacing
    `<PID>` with the appropriate process number). This will ensure that each broadcast
    is new and the Pi is only trying to transmit one WAV file at a time.


    # BCM number


    Then download the required Python files:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    wget http://www.osuts.com/pifm.tar.gz

    ```


    GPIO pins are a physical interface between you and the world. At the simplest
    level, you can use them as switches that can turn on or off. You can also use
    them to turn off the Raspberry Pi. The BCM option means referring to the Broadcom
    SoC channel number. The GPIO option specifies that you are referring to the pins
    by their location on the header.


    Finally, extract the files using the code:


    ```

    sudo ./pifm --name=out_of_wav.wav 100

    ```


    # 15 Add a serial aerial and then broadcast


    Setting up the hardware is relatively easy. There is no need to attach anything
    as the Pi can transmit directly from physical pin 7 without needing anything.
    However, you will probably want to extend the range of the broadcast by adding
    a wire to GPIO (pin number 7). Unbelievably, this can extend the range of the
    broadcast to 100 metres! Ensure the WAV file is in the Pifm folder and then broadcast
    the WAV file with the code above.


    # 17 Next...


    You have four minis which you have prepared and adapt and combine. You may want
    to try embedding some of your own hacks that you have created. Over the page we
    will cover how to wire up and deploy them!


    In this example, the Star Wars theme will play. You can create and add your own
    sound files. The 100.0 refers to the FM frequency of the broadcast; this can be
    changed between a range of 88 and 108MHz. Turn on your radio and adjust to the
    appropriate frequency and you will have your message playing.


