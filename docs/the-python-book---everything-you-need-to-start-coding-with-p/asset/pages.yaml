  md: "# Files\n\nWhen dealing with files, you need to create a file object to interact\
    \ with it. The file command takes a string with a name and creates a file object.\
    \ You can then call the file object methods like 'read' and 'close', to get data\
    \ out of the file. If you are doing file processing, you can also use the 'readline'\
    \ method. When opening a file, there is an explicit 'open' command to start the\
    \ process. It takes a string with a name, and an optional parameter that is string\
    \ defines the mode, for reading ('r'), writing ('w') or appending ('a'). After\
    \ opening the file, a file object is returned so that you can interact with it.\
    \ You can then write to it, and finally close it.\n\n![](img/516df994db593237169e2aff6d3e6840_20_0.png)\n\
    \n# Yielding\n\nIn many cases, a function may need to yield control of execution\
    \ to some other function. This is the case with generators. The preferred method\
    \ for a generator is that it will yield the next value when it is requested through\
    \ the 'next()' method. The 'yield' command saves the current state of the generator\
    \ and returns control to the calling function. In this way, the value of the generator\
    \ is returned and the generator picks up where it left off. In this case, you\
    \ only need enough memory to store the next value, rather than enough memory to\
    \ store all of the values in memory at once.\n\n```\npython\ndef count(n):\n \
    \   count = 0\n    while count < n:\n        yield count\n        count += 1\n\
    \nfor i in count(5):\n    print(i)\n```\n\n# Picking data\n\nThere are different\
    \ ways to retrieve the data results. One of the ways is to use the pickle module.\
    \ Pickle is a module that can serialize and deserialize Python objects to a single\
    \ string. This allows you to store the data on hard drive. You can use the dump\
    \ method to save the data out. When you want to read the same data back, you can\
    \ use the unpickle method. It works with any object, including a list or a dictionary.\
    \ Pickle is a module that is very flexible and functional. It is written in C,\
    \ so it can be as fast as 1000 times faster. One thing to be aware of is that\
    \ pickle does not store the information about the class, but only the instance\
    \ information. This means that when you unpickle an object, it may have different\
    \ methods and attributes if the class definition has changed in the interim.\n\
    \n# Shelving data\n\nWhile you are saving data, you might need more memory than\
    \ is available in your Python session. The shelve module works like pickle, but\
    \ it can store everything that can be pickled. The storage of the data is on the\
    \ hard disk instead of a memory-based database. When you open a shelf, you can\
    \ read and write data using key pairs. When you are done, you need to be explicit\
    \ about which shelf the data you want to save. The data may be stored in the backing\
    \ database, so it is best not to open the result files outside of the shelf module\
    \ in Python. You can also open the shelf with writeback method to write out changes.\n\
    \n# Threads\n\nYou can run multiple threads of execution within Python. The 'thread'\
    \ command can create a new thread of execution. This is useful when you have multiple\
    \ tasks to perform. When you want to create a thread, you need to handle a function,\
    \ along with any parameters that function needs. Note that Python threads are\
    \ not like POSIX threads. This means that everything is the responsibility of\
    \ the programmer. You need to handle locks with the 'lock' approach. When you\
    \ need to 'exit' the thread to ensure that it is cleaned up and no resources are\
    \ left behind you. You also have fine-grained control over the threads, which\
    \ is best to set the class status for each thread."
