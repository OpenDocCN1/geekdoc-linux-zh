    \ You might want to build your own REPL. The compile() function takes a string\
    \ of Python code and returns an object that represents a byte translation of this\
    \ code. This new object can then be passed to either 'eval()' or 'exec()' to be\
    \ executed. The 'single' mode is a single expression, 'eval' is a single expression\
    \ and 'exec' is a code block.\n\n![](img/516df994db593237169e2aff6d3e6840_22_0.png)\n\
    \n# __init__method\n\nWhen you create a new class you can include an initialisation\
    \ method that gets called when a new instance of the class is created. This method\
    \ is useful when the new object instance needs some data in the new object.\n\n\
    # __del__method\n\nWhen an object is about to be destroyed, the __del__ method\
    \ is called. This gives you the opportunity to free up resources that may be required.\
    \ This might be closing files, or disconnecting networks. When the object is destroyed,\
    \ resources are freed.\n\n```\nFile Edit View Search Terminal Help\n>>> class\
    \ MyClass:\n    def __init__(self, name):\n        self.name = name\n        print('Initializing\
    \ %s' % self.name)\n    def __del__(self):\n        print('Destroying %s' % self.name)\n\
    \\>>> obj = MyClass('Test')\n>>> del obj\n```\n\n# Exiting your program\n\nThere\
    \ are two ways to exit the Python interpreter: 'exit()' and 'quit()'. Both take\
    \ an optional parameter which sets the exit code for the process. Using these\
    \ is generally more effective than using the exit function from the sys module\
    \ ('sys.exit()').\n\n# Return values\n\nA function can return a value to the calling\
    \ function. Because it has no name, this includes lambda functions. Lambda functions\
    \ use the 'return' statement to return an object.\n\n```\nFile Edit View Search\
    \ Terminal Help\n>>> def add(a, b):\n    return a + b\n>>> add(2, 3)\n5\n>>> (lambda\
    \ x, y: x + y)(2, 3)\\5\n```\n\n# String concatenation\n\nWe will finish with\
    \ what most lists start with string concatenation. The easiest way to join strings\
    \ is using the '+' operator. If you want to include other items, like numbers,\
    \ you can use the 'str()' casting to convert it to a string object.\n\nPython\
    \ Book 233"
