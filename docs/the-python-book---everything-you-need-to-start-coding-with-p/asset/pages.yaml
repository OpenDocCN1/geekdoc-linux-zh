  md: '# Embed Python in C


    Here, we will learn how to embed Python code within your C program to get the
    best of both worlds


    There are times with a C program, when you might want to execute some of Python
    code. Maybe you are able to run Python code within your program, for example,
    this enables us to extend Python''s functionality. We can do this by embedding
    Python within the C program.


