    \ OVER\")\n        mc.postTo(\"Score: \" + str(score))\n    else:\n        mc.setBlock(xl,\
    \ yl-1, zl, 41)\n        mc.postTo(\"GAME OVER\")\n```\n\n+   13 Game over\nIf\
    \ you do not stand on the mine, the game is over. Use the post chat to display\
    \ a \"Game Over\" in the MinecraftWorld.\n\n+   14 Final score\nThe last part\
