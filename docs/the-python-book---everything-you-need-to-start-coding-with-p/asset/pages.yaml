    \ mines!\n\n# Create with Python\n\n![](img/516df994db593237169e2aff6d3e6840_120_0.png)\n\
    \n```\n```python\nimport minecraft\n```\n```\n\n02 Importing the modules\nLoad\
    \ up your preferred Python editor and start a new window. You need to import the\
    \ modules: random to calculate and create the location of time, and import time\
    \ to add pauses and delays to the program. Next, add two further lines of code:\
    \ from mci import minecraft and mc = minecraft.create(). Create these program\
