    results.

    The first thing you need is the ability to sense the world around it. One sense
    that we humans feel is most like sight. With web cameras it is easy to connect
    to hardware, vision is easy to give to robot. The real problem is how to interpret
    this data. Luckily, you can use OpenCV to do just that, a vision library that
    can provide amazing gathering and processing, complex functions like recognition
    and extraction of 3D objects. You can identify and track objects moving through
    your field of view. You can also use OpenCV to give your robot some reasoning
    capabilities. OpenCV includes a sets of


    ![](img/516df994db593237169e2aff6d3e6840_71_0.png)


    machine learning, where you can use statistical trees or clustering, and it is
    easy to feed decisions to neural networks.

    Another sense that you may want to use is sound. The jasper project is one that
    would give you complete voice control system. This project would give your robot
    the ability to listen and respond to your verbal commands. The project has the
    point: when you give it a command and the voice recognition software works then
    you need to build a mapping of pieces of text to what commands to execute.

    There are lots of sensors you could use, but this begins to learn the realm of
    store-bought hardware. Other sensors like temperature, pressure, orientation or
    location, need specialised hardware that needs to be interfaced with the computer.


    ![](img/516df994db593237169e2aff6d3e6840_71_1.png)


    # Arduino


    Contrast to the Raspberry Pi, which runs all its OS on card, the Arduino boards
    are microcontrollers with less processing power than computers. In this platform
    you execute code that you write. It is mainly used to interface with hardware
    and sensors, servos, and devices like LEDs, and is inexpensive. Arduino is available
    and can be a powerful complement to the Pi.


    ![](img/516df994db593237169e2aff6d3e6840_71_2.png)


    # Raspberry Pi


    While we haven''t discussed which one is better to use for your project, you should
    consider the pros and cons of each. This tiny computer is much easier to build
    a robot structure that you might be building. Since it''s already ready to go,
    you should be able to simply copy your code to work on the Pi. It also includes
    its own IO so that you can read its own sensors.


    # ROS - Robot Operating System


    While you could write some code that runs on a standard computer or Linux distribution,
    it is not optimal when to handle all of the data that a robot needs when dealing
    with events in real-time. A dedicated system - the Robot Operating System (ROS)
    is designed to provide the same type of interface between different parts of the
    robot. One of the most powerful features of ROS is that it is designed to facilitate
    communication between processes. You can run ROS on one computer, or over multiple
    computers connected over a network, so that it is protected from all other processes.
    ROS is more of a graph of processes with messages being passed between them.


    ROS is a complex operating system, rather than a library, it is tricky when to
    use it in Python. It is better to write Python code that can be used in ROS. The
    fundamental design is to be flexible and scalable. This result means that your
    code should be clean and not particularly concerned with where it is going or
    who it is talking to. Then, it can be used within the graph of ROS. ROS provides
    available available that allows you to do coordinates, useful for figuring where
    sensors or limbs are in space, as well as for data processing, and for creating
    and making the messages that can be sent between processes. For extremely time-sensitive
    tasks, there is a plugin library that allows you to write a C++ plugin that can
    be used within ROS processes.


    72 The Python Book'
