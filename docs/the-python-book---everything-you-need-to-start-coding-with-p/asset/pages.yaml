    Python IDE (optional) on FileSilo


    behind it It supports almost all platforms, including different architectures.
    It is available for Linux, Windows, macOS, Android, iOS and more.

    In these pages we will learn to build extensions for Kodi. Extensions are a way
    of adding features to Kodi without learning the core of XBMC or alter it in any
    way. One advantage is that Kodi uses Python as its scripting language, and this
    can also be used to build the extensions. This really helps new developers to
    get involved in the project since

    Kodi supports many types of extensions (or Add-ons): Plugins, Skins and more.
    Depending on the type of feature you want, you can create a new media section
    of Kodi. For example, a plugin would appear in the Views section, Skins are like
    applications for Kodi. They are important since Kodi is a completely


    customisable application — you can change the look and feel of just about every
    facet of the page. Depending on which category you choose, you will have to create
    the extension directory accordingly. For


    In this tutorial we will build a plugin called LUD Entry that will provide a way
    to watch videos from feeds within Kodi. Our plugin will show various content such
    as subtitles and allow users to add their own Subtitles. Each video can be categorized
    as Hot, New, Top, etc. With this plugin we will achieve a very high user experience.

    Due to space limitations we aren''t able to provide the full code here. We recommend
    downloading the complete code from FileSilo.


    Kodi (XBMC) is perhaps the most important thing that has ever appeared in the
    open source media center space. It starts with its life as a project and then
    it becomes the base of software for media aficionados. it also has been formed
    into many other successful media applications such as Box and Plex, Kodi has ultimately
    grown into a powerful of open source application with a solid community


