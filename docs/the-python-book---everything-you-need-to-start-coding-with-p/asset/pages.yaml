  md: "# Create dynamic templates with Flask, Jinja2 and Twitter\n\nCreate a dynamic\
    \ webpage with Twitter and Flask's rendering engine, Jinja2\n\n# Resources\n\n\
    +   * Python 3\n* Flask: flask.poco.org\n* Flask GitHub: github.com/pallets/Flask\n\
    * A Twitter account\n* Your favourite text editor\n* Code downloaded from FileSilo\n\
    \n![](img/516df994db593237169e2aff6d3e6840_137_0.png)\n\nPython and Flask are\
    \ a great combination when you're handling the Twitter OAuth process and requests\
    \ to obtain tokens. The large amount of daily data is unmanageable; however, since\
    \ Flask handles the sets out by OAuth 1.0, you can use it to build and create\
    \ web services using the same standard without a great deal of work. For years\
    \ PHP has been the master of template generation, but with well-documented frameworks\
    \ like Sinatra and Ansible, the ability to write powerful scripting languages\
    \ greatly improves our web development. We're going to use Flask, Python and its\
    \ integration engine to display templates. Flask comes with the super-powerful\
    \ Jinja2 rendering engine; even without JavaScript, the syntax will look very\
    \ similar to the Handlebars rendering engine. But, before we dive into that, we\
    \ need to organize the code that we're using for this.\n\n# 01 Rearranging your\
    \ code\n\nserver code can get messy and unmanageable quickly, so the first thing\
    \ we are going to do is move our functions and insert them into another project.\
    \ This will make sure our server logic and endpoints are clear by using Flask's\
    \ resource functions for the code downloaded from FileSilo (under Twitter Flask)\
    \ and locate the helpers.py file (sign_request and create_auth_handlers which\
    \ we called helpers.py in the root of your project folder). At the top of this\
    \ file we will need to import some libraries.\n\nThe template uses us to generate\
    \ a list of Twitter tweets\n\n+   * import urllib, we, \nhashlib, time, string\n\
    \n+   * from hashlib import shal\n\nNow we can go back to our server and import\
    \ the helpers functions back into our project. We do this by simply importing\n\
    \nhelpers.py. Python is smart; it will look in the current directory for a file\
    \ before it loads a system module. Now every function included in helpers.py is\
    \ accessible to our project. All we need to do is call the method with the helper_function_name,\
    \ and it will execute. For sign_request, we will need to pass our secret and consumer\
    \ with each request after receiving it from Twitter. Adjust the function code\
    \ like:\n\n```\ndef sign_request(parameters, method,\nbase64, consumer, auth,\n\
    secret):\n```\n\n# 02 server modules\n\nWith out of the modules included in this\
    \ project having moved to helpers.py, we can now remove more of them from server.py.\
    \ If we intend our first statement to be:\n\n+   * import urllib, time, random\n\
    \n...our project will continue to function as it did"
