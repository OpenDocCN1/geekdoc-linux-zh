  md: "# Get started with Python\n\n```\n$ /functions_and.py\n# This is a string\n\
    This is a test string that has been modified.\n```\n\n# Comparison operators\n\
    \nThe common comparison operators available in Python:\n\n| strictly less than\
    \ |\n| less than or equal |\n| strictly greater than |\n| greater than or equal\
    \ |\n| equal |\n\nScope is important to get the hang of it, otherwise you can\
    \ get into some bad habits. Let's write a quick program to demonstrate this. While\
    \ going a Boolean variable called, which will decide if a number is assigned to\
    \ a variable in an 'if' statement, the variable hasn't been defined anywhere apart\
    \ from the scope of the 'if' statement. We'll try to print the variable.\n\n```\n\
    $ /usr/bin/python\ncont = False\nif cont:\n    var = 1234\nprint(var)\n```\n\n\
    In the section code below, Python will convert the integer to a string before\
    \ printing it. It's a good idea to explicitly convert to strings - especially\
    \ when it comes to concatenating together. If you use the + operator it's not\
    \ explicit what happens to. Python's string format that we demonstrated is a clearer\
    \ example of how to doing that. Can you see the problem? var has only been defined\
    \ in the scope of the 'if' statement, which means that we get a very nasty error\
    \ when we try to access it.\n\nwhat a variable does. The other thing that this\
    \ get along with is that this is going to be your code comment. This will also\
    \ help everyone else who reads your code, and in the future. It's useful to provide\
    \ a brief summary at the top of a code file describing what the application does,\
    \ or a part of the application it is made of multiple files.\n\n# Summary\n\n\
    This chapter has introduced you to the basics of programming in Python, and you\
    \ are getting used to the syntax, internal logic and feel of a Python program.\
    \ The next step is to learn how to work with a problem that you want to solve\
    \ and break it down into small steps that you can implement in a programming language.\n\
    \nGoogle, or any search engine, is very helpful. If you are stuck with anything,\
    \ or an error message you can't work out how to fix, stick it into Google and\
    \ Google might just show you a lot closer to solving your problem. The first link\
    \ takes us to a Stack Overflow thread with a bunch of useful replies. Don't be\
    \ afraid to get stuck - in the realm of programming is solving one manageable\
    \ chunk at a time.\n\n```\n$ /scope.py\nTraceback (most recent call last):\n \
    \ File \"scope.py\", line 8, in <module>\n    print(var)\nNameError: name 'var'\
    \ is not defined\n```\n\nIf cont is set to True, then the variable will be created\
    \ and we can access it just fine, however is a bad way to do things. The correct\
    \ way is to initialize the variable outside the scope of the 'if' statement.\n\
    \n```\n$ /usr/bin/python\ncont = False\nif cont:\n    var = 1234\nif var:\n  \
