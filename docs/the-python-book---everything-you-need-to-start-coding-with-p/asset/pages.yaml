    # 08 Working with matrices


    A special type of two-dimensional array is a matrix where multiplication replaces
    element-by-element. Matrices are generated using the matrix (or mat) function
    as:


    ```

    In [2]: aa = np.mat([[1, 1, 1, 1, 1, 1, 1]])

    ```


    You can add two matrices AA and BB by typing AA + BB. Similarly, you can multiply
    them by AA *.


