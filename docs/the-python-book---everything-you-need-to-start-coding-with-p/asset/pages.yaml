    # ## Plotting with Matplotlib


    09 **Plotting with Matplotlib**

    The first thing you should do is install Matplotlib. As you can see, Matplotlib
    has many dependencies that you should also install.


    The first thing you will learn is how plot a polynomial function. The necessary
    command for plotting the polynomial is:


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    poly = np.array([1, -1])

    x = np.linspace(-5, 5, 100)

    y = poly(x)

    plt.plot(x,y)

    plt.title(''x*y'')

    ticks = np.arange(-5, 6, 1)

    yticks = np.arange(-5, 6, 5)

    plt.xticks(ticks)

    plt.yticks(yticks)

    plt.grid(True)

    plt.show()

    ```


    The variables that hold the information is the range, which is defined for x =
    np.linspace(-5, 5, 100). The other variable is y, which holds all the values of
    y for each x.


    It is important to start your python using the "ipython-matplotlib" magic command
    to see the output on your screen. If you are interested in learning more, you
    should experiment more, as with NumPy which can also calculate the derivatives
    of a function and multiple functions in the same.


