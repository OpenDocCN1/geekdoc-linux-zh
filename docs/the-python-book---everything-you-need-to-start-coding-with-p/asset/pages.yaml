  md: "# Use Python with Pi\n\n# Raspberry Pi: Build an\nautomated news machine\n\n\
    Use Python code to pull down the latest news into a simple\npresentation, with\
    \ hyperlinks to each story\n\n```\nimport requests\nimport json\nimport time\n\
    from bs4 import BeautifulSoup\n\nurl = 'https://news.google.com/rss'\nresponse\
    \ = requests.get(url)\nsoup = BeautifulSoup(response.text, 'xml.parser')\n\ndef\
    \ get_news():\n    print(\"Presentation\")\n    items = soup.find_all('item')\n\
    \    for item in items[:10]:\n        title = item.find('title').text\n      \
    \  link = item.find('link').text\n        print(f\"{title} - {link}\")\n\nget_news()\n\
    ```\n\n![](img/516df994db593237169e2aff6d3e6840_155_0.png)\n\nNews is everywhere.\
    \ We are constantly\nbroadcasting stories via multiple\ndevices, laptops, TVs\
    \ and radios. We\npossibly also overhear people discussing\nstories. Traditionally\
    \ people liked the type\nnewspaper that you read to indicate a kind of\ntimus\
    \ of yours, political news, special\nstatus and your ethics and morals are\naligned.\
    \ For example, IBT in\n2013 found that 40 cent of readers of the\nNew York Times\
    \ were making more than $75k\n(approximately $59,000 a year).\n\nNowadays\n\n\
    ![](img/516df994db593237169e2aff6d3e6840_155_1.png)\n\nUK water and hotter than\
    \ at any time in a century\n\n![](img/516df994db593237169e2aff6d3e6840_155_2.png)\n\
    \nAbove Harvest stories from news sites to\ncurate your own feed\n\nnews stories.\
    \ Then use python-pptx to\nwrite news data into a presentation and save\nto folder.\
    \ Open the file, and you have your\nown customised news feed that includes\nthe\
    \ news headlines and a hyperlink\nto each of the stories. Simply check your source\
    \ and run\nthe program again.\n\n# Resources\n\nfeedparser:\ngithub.com/kurtmkee/feedparser\n\
    \n# Python-pptx\n\ngithub.com/scanny/python-pptx\n\nWhatever your news preference,\
    \ this tutorial\nwill walk you through constructing and building\nyour own, automated\
    \ ‘News Machine’.\nSelect your favourite source and use\nfeedparser to pull down,\
    \ five, ten, or more\n\n156 The Python Book"
