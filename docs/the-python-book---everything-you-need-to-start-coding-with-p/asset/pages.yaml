  md: '# Web development


    Django comes with a lightweight development server you can test your work locally


    Django is of course to read and write SQL databases, but it needs little knowledge
    to succeed in doing so


    Using HTML and CSS in conjunction with Django is clear and straightforward; it''s
    much easier to bug-fix than PHP


    Django comes with a generic back-end site that is set up in seconds, and easily
    customizable after that


    ![](img/516df994db593237169e2aff6d3e6840_141_0.png)


    # Resources


    +   - Python 3

    - www.python.org

    - Django Source Code

    - www.djangoproject.com


    # # Build your own blog with Django


    Learn how to use this extremely powerful Python-based web framework to create
    a complete blog from scratch in record time


    Creating your blog always feels like a great accomplishment. Sure, you could use
    the fantastic WordPress if you need a complete blog with right now. And Tumblr
    exists for people who want to write something, or post pictures of corps in space.
    You don''t have full control from start to finish with a prefabricated blog, though,
    and none of these is written in the fantastic Django. Django is of course based
    on Python,


    the object-oriented programming language does have clearly readable syntax. Due
    to its Python base, it is an incredibly powerful and simple to use language for
    web development with a vast array of libraries.

    So let''s use to make a blog: In this section of the process we will explore how
    to set up Django, writing and reading to a database, creating a front and back-end,
    and some interactions with HTML.


    142 The Python Book'
