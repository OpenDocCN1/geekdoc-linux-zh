    \ body, or the date, to include as part of the information.\n\nThe first parameter\
    \ is a list of 'email addresses'. If you have only one address, you can put it\
    \ in a list as a string containing the body of the email. The second parameter\
    \ is the email message that you want to be sent to one or more of the email addresses.\
