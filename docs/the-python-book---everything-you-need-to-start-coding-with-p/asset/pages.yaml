  md: '# Build your Robot


    The Robotic Arm comes in kit with a detailed set of instructions how to build
    the parts and combine them into the final arm. This will take you three or hours
    which is perfect for a rainy day. The arm kit includes all the required parts
    for the base. Each part is meant to be installed in the correct way around. This
    will not damage the arm but will result in the arm moving in the opposite direction
    to the programmed direction.


    # Update your Pi


    After building the robot, plug in your Raspberry Pi and boot up. Do not plug in
    the arm first. First install the software and OS. When your Pi is connected to
    the Internet, open the LX terminal and type:


    ```

    $ sudo apt-get update

    $ sudo apt-upgrade

    ```


    Wait for the download and then reboot, typing sudo reboot.


    # 03 Install the PyUSB software


    Use the PyUSB library to interact with your robot arm, first establish a connection
    to access the Raspberry Pi''s Serial Bus (USB) when the arm is plugged in. In
    the terminal window, type:


    ```

    $ git clone https://github.com/walayac/usb.py

    ```


    Once you have installed the pysb folder, then type cd pysb, then type the code
    sudo pip install.py. This will install the required module. Finally, reboot your
    Raspberry Pi with sudo reboot.


    # 04 Attach the arm to the Pi


    Now that you have installed the required software to program the arm, plug it
    in. To do this simply take the arm from the slot and insert into one of the USB
    ports on your Raspberry Pi. Turn on the arm using the switch located on the base
    of the arm. You can test that the connection is live and the arm is recognised
    by the LX Terminal by typing lsusb. This will return a list of the hardware connected
    to the USB ports.


    ![](img/516df994db593237169e2aff6d3e6840_160_0.png)


    # 05 Take control of the arm


    The arm is controlled by sending a line of code to the USB to the arm. This code
    includes the duration of each movement as well the coordinates to identify which
    motors to turn on or off in which directions to turn. The codes to move the arm
    are fairly very however Python can simplify them into manageable lines of code.


    | File | Edit | Format | Options | Window |

    |---|---|---|---|--|

    | New File | Ctrl+N | | | |

    | Open... | Alt+M | | | |

    | Recent Files | | | | |

    | Class Browser | Alt+C | | | |

    | Path Browser | | | | |

    | Save | Ctrl+S | | | |

    | Save As... | Ctrl+Shift+S | | | |

    | Copy As... | Alt+Shift+S | | | |

    | Print Window | | | | |

    | Close | Alt+F4 | | |

    | Exit | Ctrl+Q | | |


    # 06 Open Python


    From the menu of the taskbar select and the LX Terminal, double click the link.
    Administrative privileges are required to access the arm via Python, open python
    as a sudo user. In the LX terminal type sudo and press Enter. When IDE is loaded,
    open a new window, and click New.


    # 07 Import the required libraries


    At the top of the window, create your program. Import core and use usb libraries,
    line 1 This allows you to send commands to the USB port and control the arm. USB
    is a complex protocol, PyUSB has good defaults for many configurations, reducing
    the need for vast amounts of code. The library permits you to select delays between
    each movement of the arm. Add the line of code as below:


    ```

    import usb

    import time

    ```


    ![](img/516df994db593237169e2aff6d3e6840_160_1.png)


    # Experiment with the gestures to find ones that suit you


    The Pi-writer can detect gestures that you can experiment with using the camera.
    For your program, the arm can be used to detect a similar gesture, which is also
    perfect for additional projects, like changing the music player or using the arm
    to create or play samples. Check the full code for these examples at https://github.com/pimoniero/gesturetree/master/examples'
