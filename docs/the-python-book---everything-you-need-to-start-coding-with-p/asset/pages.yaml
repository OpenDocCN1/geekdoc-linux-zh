  md: '# Python essentials


    ![](img/516df994db593237169e2aff6d3e6840_25_0.png)


    Python is a programming language that lets you work more quickly and integrate
    your systems more effectively. Today, Python is one of the most popular programming
    languages in the open source space. Look around and you will find it running everywhere,
    from various configuration tools to XML parsing. Here is the collection of 50
    gems to make your Python experience worthwhile...


    # Running 01 Python scripts


    On most of the UNIX systems, you can run Python scripts from the command line.
    $ python myprog.py


    # Basics


    easy to try your first steps in programming and using all Python commands. You
    issue each command at the command prompt, one by one, and the answer is immediate.


    > >> symbol is meant to be given at the Python prompt. It is also important to
    remember that Python takes tabs very seriously - so if you are receiving any error
    that mentions tabs, correct the spacing.


    # Running 02 Python interpreter


