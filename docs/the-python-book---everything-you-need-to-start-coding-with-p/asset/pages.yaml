  md: "# # Web development\n\n![](img/516df994db593237169e2aff6d3e6840_142_0.png)\n\
    \n| Name | Description | Stars |\n|---|---|---|\n| Django | | 255 |\n| Django\
    \ | High-level object-oriented web framework | 10 |\n| python-django | Python\
    \ web development framework | 10 |\n| python-matlab | Python-based plotting system\
    \ in a style similar to matlab | 10 |\n| python-story | Scientific tools for python\
    \ | 10 |\n| ide-python | IDE for python using likter | 4 |\n| python | Python\
    \ programming language | 4 |\n| spe | Django python editors | 4 |\n\n![](img/516df994db593237169e2aff6d3e6840_142_1.png)\n\
    \n# ## Start the development server\n\nDjango comes with a lightweight development\
    \ server to test out locally. You can also use it to check out work, so cd to\
    \ the myblog folder and then `python manage.py runserver`\n\nIf all goes well,\
    \ it should return zero errors. Use Ctrl+C to exit.\n\n+   - To make sure Django\
    \ is installed properly, run the following command:\n  `pip install django`\n\n\
    # ## 03 Verify your Django\n\nIn the python shell, type `import django; print(django.get_version())`\n\
    It will return a version number if it has installed correctly, which should be\
    \ 1.3. \n\n![](img/516df994db593237169e2aff6d3e6840_142_2.png)\n\n# ## 01 Install\
    \ Django\n\nDjango is based on Python, and it is better to develop on. Python\
    \ 3 is the recommended version, and this is installed with the python package.\
    \ If you want to check your version, start the Python shell by typing into the\
    \ terminal.\n\n![](img/516df994db593237169e2aff6d3e6840_142_3.png)\n\n# ## 06\
    \ Configure the database\n\nThe database settings are kept in the settings.py\
    \ file. Open it with your favorite editor and go to the Databases section. Change\
    \ `ENGINE` to\n\n```\nENGINE: 'django.db.backends.sqlite3'\nAnd in NAME, put the\
    \ absolute path for -\n`NAME': '/home/user/projects/myblog/sqlite3.db'`\n```\n\
    \nSave and exit.\n\n# ## 02 Install Django\n\nMost operating systems have a Django\
    \ package available in the repository, python-django in Debian. If you have a\
    \ little trouble finding it, or you could build it from source. Make sure you\
    \ install the latest version.\n\n![](img/516df994db593237169e2aff6d3e6840_142_4.png)\n\
    \n# ## 04 Start a new project\n\nIn terminal, cd to the folder you want to develop\
    \ the blog in, and then run the next command:\n\n```\ndjango-admin startproject\
    \ myblog\n```\n\nHere, 'myblog' can be replaced by whatever you want to name the\
    \ project, but we'll use it for the upcoming examples.\n\n# ## 07 Create the database\n\
    \nThe database file will be generated using the command:\n\n```\npython manage.py\
    \ sync\n```\n\nDuring creation, it will also set up a superuser, which you can\
    \ do now.\n\nThe SQLite database file will be created in your myblog folder.\n\
    \n![](img/516df994db593237169e2aff6d3e6840_142_5.png)\n\nThe Python Book 143"
