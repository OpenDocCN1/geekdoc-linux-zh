    # Creating the mine


    07 In the previous step you found the player''s location on the board. The x,
    y coordinates can be used to place the mine on the board. The code `mine = random.randint(0,
    11)` generates a random number between 1 and 10. Combine this with the player''s
    current x position and add the number to the position - this creates a random
    mine on the board.


    ```

    mine_x = int(x)

    mine_y = int(y)

    mine_z = int(z)

    ```


    Use setblock to place the mine: `mc.setblock(mine_x, mine_y, mine_z, 5)`. Using
    y-1 ensures that the block is placed on the same level as the board and hidden.
    The 5 is the block ID, which you can change if you want to see where mine is.
    This is useful for testing the rest of the code, so change it back before you
    play it!


    # 08 Create a score variable


    Each that you remain inside the mine, a point is added to your score. Create a
    variable to store the current score, set it to zero at the beginning of the game.
    Use the `postChat` to announce the score at the beginning. Note that Minecraft
    cannot hold a value, so the score is converted to an integer before it is displayed.


    ```

    score = 0

    mc.postChat("score: " + score")

    ```


    # Other Minecraft hacks


    If you enjoy programming and Minecraft, there are many more great Raspberry Pi-based
