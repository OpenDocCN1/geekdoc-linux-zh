  md: "# Django is an incredibly powerful and simple-to-use language\n\n# 15 Setup\
    \ the admin page\n\nThe admin page has a generic, usable template, but you need\
    \ to configure it to edit, create and delete posts. First, create a new file in\
    \ your blog directory and **enter**:\n\n```\n```python\nfrom blog.models import\
    \ Post\nfrom django.contrib import admin\n\nadmin.site.register(Post)\n```\n```\n\
    \nTo have posts displayable on the site, edit your `models.py` and **add** the\
    \ following:\n\n```\n```python\nclass Post(models.Model):\n    def __str__(self):\n\
    \        return self.get_absolute_url()\n```\n```\n\nSave, and run.\n\nThe admin\
    \ page is now usable! You should be able to see your posts, and it's now easier\
    \ to manage them.\n\n# 16 Activate the front page\n\nOpen the `urls.py` in your\
    \ directory and **add** the following **urls section**:\n\n```\n```python\nurlpatterns\
    \ = [\n    path('', include('blog.urls')),\n]\n```\n```\n\n# 17 Create another\
    \ url page\n\nYou need to create another url page in the app directory, use `blog/urls.py`\
    \ and **add** the following:\n\n```\n```python\nfrom blog.models import Post\n\
    from django.http import HttpResponse\n\ndef index(request):\n    post_list = Post.objects.all()\n\
    \    return render(request, 'index.html', {'post_list': post_list})\n```\n```\n\
    \n# 21 Format the front page\n\nGo back to the template file, `index.html`, and\
    \ **add** the following html tags:\n\n```\n```html\n{% for post in post_list %}\n\
    \    <h2>{{ post.title }}</h2>\n    <p>{{ post.date }}</p>\n    <div>{{ post.content\
    \ }}</div>\n{% endfor %}\n```\n```\n\nThis is just an example — the post can be\
    \ in any order with tags.\n\n# 18 Start the template\n\nWe've just written for\
    \ a template that currently doesn't exist. First set where the templates are looked\
    \ for in `settings.py`.\n\n```\n```python\nTEMPLATE_DIRS = [\n    'home/user/templates/',n]\n\
    ```\n```\n\nYou can put the template wherever you want, as long as it's referenced\
    \ correctly. For example:\n\n# 19 Write a template page\n\nNow write the template\
    \ file in your app. For example, using `index.html`:\n\n```\n```html\n{% for post\
    \ in post_list %}\n    <h2>{{ post.title }}</h2>\n    <p>{{ post.date }}</p>\n\
    \    <div>{{ post.content }}</div>\n{% endfor %}\n```\n```\n\n# 22 Spruce up the\
    \ admin list\n\nYou'll do the admin page in your blog directory. open it and add\
    \ the following **attributes**:\n\n```\n```python\nfrom blog.models import Post\n\
    from django.contrib import admin\nnclass PostAdmin(admin.ModelAdmin):\n    list_display\
    \ = ('title', 'pub_date', 'author')\n\nadmin.site.register(Post, PostAdmin)\n\
    ```\n```\n\nIn this case, `list_display` is a fixed variable name.\n\n# 20 View\
    \ your dashboard\n\nLet's make sure this works. Start the development server with:\n\
    \n```\n```bash\npython manage.py runserver 127.0.0.1:8000/blog/\n```\n```\n\n\
    It's not pretty, but you have successfully pulled your stored data. We will spend\
    \ the next steps tweaking it a bit.\n\n# 23 A logical page\n\nThe new page on\
    \ the site might not be what you're comfortable with. We will change it in the\
    \ admin by adding the following:\n\n```\n```python\nclass PostAdmin(admin.ModelAdmin):\n\
    \    list_display = ('title', 'pub_date', 'author')\n\nadmin.site.register(Post,\
    \ PostAdmin)\n```\n```\n\n# 24 A functional page\n\nSo there you have to navigate\
    \ to 127.0.0.1:8000/blog/ and will show off the page you've created. Django is\
    \ easy to use once you know how, and there are plenty of tweaks you should make\
    \ to make it better.\n\n![](img/516df994db593237169e2aff6d3e6840_144_0.png)"
