  md: "# Web development\n\n> You don't have full control from start to finish with\
    \ a prefabricated blog – but you will with Django”\n\n![](img/516df994db593237169e2aff6d3e6840_143_0.png)\n\
    \n# 08 Create your blog\n\nNow it's time to create a blog app in your project:\
    \ python manage.py startapp blog\n\nThis creates the folder which is all your\
    \ data lives. You can change 'blog' to another name, but we'll use blog in our\
    \ examples.\n\n![](img/516df994db593237169e2aff6d3e6840_143_1.png)\n\n```\nFile\
    \ Edit View Search Terminal Help\n$ -mandz-Laptop -D /Django/myblog cd\n$ -mandz-Laptop\
    \ -cd /Django/myblog\n$ -mandz-Laptop -D /Django/myblog sudo nano s\n$ python\
    \ manage.py migrate\n$ -mandz-Laptop -D /Django/myblog sudo nano settings.py\n\
    $ python manage.py sql blog\n\nCREATE TABLE blog_post (\n  id INTEGER PRIMARY\
    \ KEY,\n  post TEXT NOT NULL,\n  title varchar(100) NOT NULL,\n  author varchar(50)\
    \ NOT NULL,\n  date datetime NOT NULL\n)\n```\n\n# 09 Start your blog\n\nWe can\
    \ now take the first steps in creating our blog model. Open models.py and change\
    \ it to:\nfrom django.db import models\n\nclass Post(models.Model):\n    post\
    \ = models.TextField()\n    title = models.CharField(max_length=100)\n    author\
    \ = models.CharField(max_length=50)\n    pub_date = models.DateTimeField(auto_now_add=True)\n\
    \nThis creates the Post class, which has a table that contains your blog.\n\n\
    # 11 Install your app\n\nYour app needs to be installed in the settings project,\
    \ which is very simple. Open the settings file, go to the INSTALLED_APPS section\
    \ and add 'blog'.\n\n# 13 Let's blog\n\nWe will test it post:\ntest_post = Post()\n\
    \nNow let's add the blog content:\ntest_post.post = 'Hello World!'\ntest_post.title\
    \ = 'First Post'\ntest_post.author = 'Me'\ntest_post.pub_date = datetime.now()\n\
    \nThen run the following to create the database\n\n```\npython manage.py syncdb\n\
    ```\n\n# And finally:\n\nAnd we save it:\ntest_post.save()\n\n# 14 Start the site-blog\n\
    \nTo create the admin site, edit urls from the myblog directory, and uncomment\
    \ the following lines:\n\n```\nfrom django.contrib import admin\npath('admin/',\
    \ admin.site.urls),\n```\n\n# 10 Customise your blog\n\nNow let expand our blog\
    \ model a bit as it resembles a more classic class:\n\n# 12 Set up post\n\nNow\
    \ we can create a post and test our code. First, enter the Django shell:\n\n```\n\
    python manage.py shell\n```\n\nSave and exit, edit settings.py and add this line\
    \ from INSTALLED_APPS:\n'django.contrib.admin',\n\nA CharField needs to have a\
    \ character limited defined, and DateTime holds the time values.\n\nThen we add\
    \ these comments to add the necessary data and settings.\n\n```\nfrom blog.models\
    \ import Post\nnimport datetime\n```\n\nThe admin site is at 127.0.0.1:8000/admin/\n\
    \n144 The Python Book"
