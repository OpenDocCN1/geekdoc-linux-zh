  md: "# # Work with Python\n\n# # Check your mail\n\nWith Python, you can have your\
    \ Raspberry Pi act as a mailchecker, giving you a running list on incoming email\n\
    \nSince the Raspberry Pi is a small computer, I used it in a lot of projects where\
    \ you want to monitor a source of data.\nOne monitor which you might want to create\
    \ is a mailchecker that can read emails. In this lesson, I will show you how to\
    \ create your own mail-checking monitor on your Pi. We will focus on the communications\
    \ between the Pi and the server, and not worry too much about the further exercise.\n\
    To start, we will use two different communication protocols. The older one is\
    \ called POP (Post Office Protocol), and the newer is called IMAP (Internet Message\
    \ Access Protocol). We will cover both to access all the emails that you want\
    \ to sort into.\nUsing POP is very easy as part of the standard library. In order\
    \ to start using it, you will need to import the module and create a new connection\
    \ object. For example, we will create a connection to the server that is handled\
    \ through Gmail.\n\ninteract with it. For example, you can get the welcome message\
    \ from the server with the getwelcome() method:\nunouched or not. If you want\
    \ to simply look at the first chunk of the messages, you can use the top() method.\
    \ The code will give you the headers and the first five lines of the message in\
    \ the list.\n\n```\nmy_pop.getwelcome()\n```\n\nThe first things that you will\
    \ want to connect to the server are the username and password for the account.\
    \ Hardcoding the password in your code is no security issue, because the password\
    \ is not matter. Unless you have a good reason to hide it. Included in the standard\
    \ library is the getpass module, which you can use to ask the end-user for their\
    \ password in a safer fashion. You could use the following code, for example:\n\
    \n```\nimport getpass\nmy_pop.user(getpass.getpass('name@gmail.com'))\nmy_pop.pass_(getpass.getpass())\n\
    ```\n\n```\nimport pop3\nmy_pop = pop3.POP3_SSL('gmail.com', )\n```\n\nYou will\
    \ need to use POP3 to connect to Gmail because Gmail uses SSL for connections.\
    \ You'll also need to find the \"allow less apps\" option in your Gmail settings\
    \ or you'll face an error. The communication protocol involves sending a series\
    \ of commands to the server to\n\nNow you are fully logged in to your account.\
    \ Your next will be to quit the connection when you are finished. If you need\
    \ a quick check of the messages, use the stat() method:\n\n```\nmy_pop.stat()\n\
    ```\n\n```\nemail_top = my_pop.top(1)\n```\n\nThis method will return a tuple\
    \ consisting of the response text from the server, a list of headers and the number\
    \ of requested messages. The problem with the top() method is that it is not the\
    \ newest. In some cases, you can use the retrieve() method. This will return the\
    \ message in the same format as the top(). If you have multiple messages, you\
    \ need to decide what you want to display. As an example, you might want to simply\
    \ print the subject line of each message. You could do that with the following\
    \ code:\n\n```\nfor line in email_top]:\n    if 'Subject' in line:\n        print(line)\n\
    ```\n\nYou do need to search the number of lines included in the headers from\
    \ message to message. Once you are done, don't forget to close the connection.\
    \ The last thing to keep in mind is that your server will keep the connection\
    \ alive while it is running. It would frequently time out. If you need to you\
    \ can use the keep() method to keep a connection-alive for longer.\n\nAs mentioned\
    \ previously, the second method for talking to mail servers is IMAP. Luckily,\
    \ there is a module included in the standard library that is imaplib. Also as\
    \ above, it contains two methods to establish connections. If you need an SSL\
    \ connection, you can use IMAP4 for\n\n> Most email servers use protocols\n\n\
    communication protocols"
