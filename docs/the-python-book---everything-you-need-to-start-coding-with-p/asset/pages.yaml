    # ## Asserting values


    Assertions use the concept of an assertion. The assert takes a Python expression
    and checks if it is true. If it is, the program continues normally; otherwise,
    an AssertionError is raised. You can also check that certain variables are within
    a certain range. For example, you can check assertions made within your code.
    You can optionally include a second parameter to the assertion. This second parameter
    is a message that is printed out if the assertion fails. With detailed error message,
    you may want to include cleanup code to recover from the failed assertion.


    # ## Mapping functions


    A common task that is done everyday is to map a list of elements. Python provides
    the map() function to do this. Map returns a list of the results of the function
    applied to each element of an iterable. You can map more than one input, then
    a list of tuples is returned, with each element of the tuple containing the results
    from each function. If you have more than one input, map will take them from all
    given iterables. The assumption is that the iterables are of the same length,
    and that they are all necessary for the given function.


    ```

    # for some test, map

    print(list(map(lambda x: x*2, range(5))))

    ```


    # ## Virtual


    Because of the complexity of the Python environment, it is sometimes best to set
    up a clean environment within which only the modules you need for a project, are
    installed. This is called a virtual environment. If you create such an environment,
    you can create a directory named ENV. This will include the subdirectories bin,
    lib and include, with an initial environment. You can then start using this new
    environment, which will change certain variables, such as the PATH. When you are
    done, you can restore your environment back to its previous condition. In this
    way, you can use environments that have the modules you need for a set of tasks.


    # ## While strictly costly, everyone needs to know how to deal with loops. The
    two types of iterations loop (for) and a conditional loop (while)


    # ## Loops


    While not strictly costly, everyone needs to know how to deal with loops. The
    two types of iterations loop (for) and a conditional loop (while). In a for loop,
    you iterate over a sequence of values, executing one at a time and putting them
    in a variable until you have processed every element or you have a break. In a
    while loop, the code continues for as long as some condition remains true. While
    loops can also be exited early by using the break command, you can also use continue
    to skip code within current iteration and move to the next one.


    # ## Reductions


    In many cases, you will need to do a reduction operation. This is when you take
    a list of values and reduce it to a single value. In Python, you can use the "reduce"
    function to apply the reduction function to each pair of elements in order. For
    example, if you apply the reduction sum to the first five numbers, you would get
    the result (((1+2)+3)+4)+5. You can also specify an initial value, which is used
    to act on all elements from the iterable, and is returned as a default if the
    iterable is actually empty. You can use a lambda function for the function to
    keep your code as tight as possible. In this case, reduce should only take two
    input parameters.


    # ## Filtering


    Where the map returns a result for every element in an iterable, filter only returns
    a result if the function returns a true value. This means you can create a new
    list of elements only that meet some certain condition. If the values were between
    0 and 10, this would create a new list with no negative numbers and numbers above
    10. This could be accomplished with a loop, but this method is cleaner. If the
    function provided to filter is "None", it is assumed to be the identity function,
    which returns all iterable elements.


