  md: '# Use Python with Pi


    # # Hack a toy with the Raspberry Pi: Part 1


    Learn how to master four simple hacks and embed them into a toy


    # ## Resources


    +   - An old/new toy

    - Resistors

    - Small disc motor

    - LED

    - Radio

    - Small webcam

    - Female-to-female jumper jerky wire


    Combining an old toy and a Raspberry Pi, you can embed a selection of components
    to create your own augmented toy that responds to user input. For example, a £3
    R2-D2 stream sweetner, light it up, play music and stream as well as your mobile.
    This two-part tutorial covers setting up four basic features: an LED for the eye,
    a haptic motor to simulate an electric shock, a stream from a hidden camera and
    the Star Wars tune broadcast to a radio. You may choose to combine these with
    your own hacks or use them as standalone features in other projects.


    Don''t feel limited to just using a Star Wars toy either - we used the R2-D2 figure
    because it was cheap, available and popular, but there''s no limit to the toys
    that you can experiment with. Action figures (provided that they can be disassembled
    to hold the electronic) and plasticy and sturdy toys both lend themselves to this
    kind of maker, especially if they accompany a movie or TV show that has memorable
    or sound effects that you can make broadcast. Part two covers how to set up the
    toy and set up triggers to start features.


    ![](img/516df994db593237169e2aff6d3e6840_167_0.png)'
  merge: -1
