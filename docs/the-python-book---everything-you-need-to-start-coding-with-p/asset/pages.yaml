    With POP connection, you need to keep the connection open from timing out. You\
    \ can use the ID method of the IMAP connection. This method acts as a key-filter.\
    \ You can use it to clean up after yourself before the download. The best way\
    \ to do this is to select the message using ID first, and then use the first one.\
    \ Here is an example of how:\n\n```\nmy_imap.logout()\n```\n\nYou now have enough\
    \ information to connect to an email server, get a list of messages, and then\
    \ pull out the sections that you want to display as an email. If you are displaying\
    \ on an LCD, you might just want to have the subject lines scrolling post. If\
