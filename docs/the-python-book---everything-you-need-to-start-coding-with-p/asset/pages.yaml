  md: '# # Revisit the arcade classic Pong in Python


    Calvin Robinson takes us through creating a contemporary homage to Pong – considered
    by many to be the very first arcade game


    This series of building retro games in Python so far seen us coding a linear space
    module (LFX282), a side-scrolling platform (LFX263), a fancy pellet-muncher, and
    now we''re going to develop Pong! To Pong is the original arcade game. It''s the
    first video game to become a commercial success. Released for arcades in 1972
    and for the home in 1975, Pong has gained popularity worldwide and is permanently
    memorialised in the Smithsonian Institute in Washington, D.C. Developed and de-published
    by Atari, Pong is a 2D tennis simulation with quite the simple game design imaginable,
    however engaging to an addictive gaming experience.


    each player. That''s the version we''re going to create today. Since we don''t
    have hardware and we''re programming entirely in Python, we''ll give each player
    two keys on either side of the keyboard: for one up and one down.


    Pong offers us an accessible programming language with straightforward syntax.
    It''s the perfect language for playing with vector-based video games. Let''s go!


    # ### What gameplay mechanics?


    Gameplay mechanics in Pong are quite simple. It''s essentially ping-pong from
    a basic bird''s-eye view. The game makes use of vector graphics to display a rectangular
    shape for the players and a circle (or square, depending on the processing) for
    the ball.


    In single-player mode, the player moves paddle and the computer acts as non-player
    controlling the second. The goal is to get the ball to pass the opponent''s side
    of the screen. You get a point for each time the ball hits the opponent''s paddle.


    Home Pong console was set up for two paddles, with a module for


    Pong without any details about version 2 version. If you''re using version 3,
    we''ll be using Python 3 in Terminal with the basic Linux distro you can install
    pygame after a quick update with apt-get update. We''ll also be taking advantage
    of some modules like mixer. This can be found on the disk, or via the source code
    in our Archives page at http://linuxformat.com/archives


    With Pong 3 we will create a new Pong file. Using your''s text editor create an
    empty file and save it in the same folder as linuxformat.py, which we''ll use
    as a reference for the graphics. We''ll use touch pygame instead of nano by pong
    org, or directly through the Python IDE.


    We''re going to take advantage of the Pygame toolkit to create this project. Pygame
    is a useful module designed to assist with, as name suggests, the development
    of games in Python. Pygame includes shapes such as rectangles, which we''ll use
    of. To install pygame use pygame in command: pip3 pygame to install modules for
    Python, rather than just pip2, which may get messy with multiple installations
    of Python on a single machine.


    When it comes to programming, there''s no point in reinventing the wheel every
    time. Start off by programming the pygame module and initializing the game engine:


    ```

    import pygame

