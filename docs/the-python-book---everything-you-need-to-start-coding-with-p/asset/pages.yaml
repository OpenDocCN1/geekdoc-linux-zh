    # Creating Pac-Man style games in Python


    Pac-Man has earned its place in video gaming history. Calvin Robinson shows how
    you create your own version of the iconic arcade title


    Pac-Man is arguably one of the most famous video game since 1980 with the release
    of the arcade version. Pac-Man has seen many iterations, remixes and sequels around
    a simple premise. Pac-Man is a yellow, disk-shaped, mainly feature-character,
    who moves around a 2D environment collecting dots. The player has to collect all
    the dots in the room in the form of ghosts, avoiding any of the four ghosts. Pinky,
    Blinky, Inky and Clyde are brightly colored to stand against the black background,
    being pink, red, cyan and orange, respectively. Pac-Man must avoid the ghosts
    and collect all dots to progress to the next level.


    Pac-Man can only move up, down, left or right through the maze of dots, but does
    have some advantages in his arsenal. By collecting large ''pellets'' Pac-Man becomes
    energized and the ghosts turn blue, enabling


    > The code Download from linuxformat.com/ archives


    him to eat them on. The more blue ghosts you eat, with all arcade games, the aim
    of the game is to get the highest score on the leader board.


    Originally called Puck Man in Japan because of the character looking like a hockey
    puck, Pac-Man was renamed for Western audiences to avoid any dodgy issues. It''s
    fun and friendly, and potentially the first ''inclusive'' video game, what with
    Pac-Man being the appeal to girls as well as boys, to attract a younger audience.


    # Working in Python


    Python is an incredibly accessible programming language. In LXF262 we used Python
    to create a Lunar Lander Module game, and in LXF263 we created a side-scrolling
    game in Python. The


    104 The Python Book'
