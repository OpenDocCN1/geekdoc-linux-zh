  md: '# # Get started with Python


    # ## Variables and data types


    Let''s get in, and what better way than the programmer''s first friend, the "Hello
    World" application! Start opening a terminal. Its current working directory will
    be your home directory. It''s probably a good idea to make a directory for the
    first projects you''ll be creating, rather than having them loose in your directory.
    Create a directory called python using `mkdir python`. You''ll need to change
    to that directory before starting.


    The next step is to create an example file printing "Hello world" to the touch.
    We use the command `touch hello.py` and the first most important part of it is
    making it executable. We write our code inside hello.py. We do this with the command
    `chmod +x hello.py`. Now that we have set up file, we can run it by typing `./hello.py`.


    A variable is a name in source code that is associated with an area in memory
    that you can use to store data, which is then called throughout the code. Data
    can be one of many types:


    | Integer | Stores numbers |

    | Float | Stores decimal numbers |

    | Boolean | Can have value of True or False |

    | String | Stores collection of characters, "Hello World" is a string |


    As well as these data types, there are sequences (technically, a sequence is something
    that you can iterate) we''ve classed as a main data type:


    ```

    $ mkdir python

    $ cd python

    $ touch hello.py

    $ chmod +x hello.py

    $ hello.py

    ```


    | List | Contains a collection of data in a specific order |

    | Tuple | Contains a collection immutable data in a specific order |


    Our Hello World program is simple, it only needs two lines. The first line begins
    with a shebang (`#!/usr/bin/env python3`) - a hashbang followed by the path to
    the Python interpreter. This tells the system which interpreter to use for the
    script. If you''re running this in an IDE, you don''t necessarily need to do this.


    A tuple would be used for something like a coordinate, containing an x and y value
    as a single variable, whereas a list is typically used to store larger collections.
    The data is stored in an immutable format because you aren''t allowed to change
    values of individual elements in a tuple. However, you can create a new tuple
    instead.


    It is also useful to know Python''s dictionary. A dictionary is a mapped data
    type. It stores data in key-value pairs so that you can access any element in
    the dictionary by that value''s key, which is different from how you do with a
    list. In a list, you access an element by its index (a number), but in a dictionary
    you access an element by its key.


    The second line actually prints the message to the screen. It is just a single
    line. We pass the value Hello World to the print function. Hello World is a literal
    string enclosed in quotes to mark it as data. The print function is a built-in
    function in Python source code. example, the print function in Python prints any
    value that gets passed to it from the console.


    Let''s work on a program to demonstrate how to use variables and different data
    types. It''s worth noting that Python has many different data types in Python.
    Feel free to create this in any editor you like. Everything will work just as
    long as you remember to make the file executable. We''re going to out variables.


    You can run the Hello World program by prefixing the filename with `./` in this
    case:


    ```

    $ ./hello.py

    Hello World

    ```


    > TIP If you are using a graphical editor such as Geith, you would need to do
    the last step of making the file executable. You only have to make the file executable
    once. You can then freely edit the file once it is executable.


    # ## Interpreted vs compiled languages


    An interpreted language like Python is one where the source code is converted
    to machine and executed each time the program runs. This differs from compiled
    languages where the source code is only compiled to machine once - the resulting
    machine code is executed each time the program runs.'
