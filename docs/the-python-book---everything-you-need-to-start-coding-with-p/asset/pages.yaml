    # 12 Setting the mine


    In the previous step we checked whether you are standing on a mine or a safe block.
    If it is the mine then replace it with lava blocks, which will block and engulf
    the player. Use the `mc.setblock` to create blocks between two points. Lava blocks
    are by gravity, so setting them higher than the point ensures the lava flows over
    the player.


    ```

    mc.setblock(x-5, y+1, z-5, x+5, y+2, z+5)

