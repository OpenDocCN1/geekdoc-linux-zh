  md: "# Use Python with Pi\n\n# Click to add title\n\nClick to add subtitle\n\nAdding\
    \ an image to each side\n\nThe final line of code writes the text to the textboxes.\n\
    \nto convert the URL from the downloaded data into a hyperlink, three lines:\n\
    \nOn sites it may be possible to download images and add them to your slide. Simply\
    \ add the location of the image to the variable use slide.shapes.add_picture()\
    \ to add the image and define the position of the image as follows. Further details\
    \ can be found at http://bit.ly/lpdjx\n\n```\ndef add_hyper_link(shape, text,\
    \ url):\n    p = shape.text_frame.paragraphs[0]\n    r = p.add_run()\n    r.text\
    \ = text\n    p.font.size = PT(12)\n    p.font.name = 'Lato'\n    p.font.color\
    \ = RGBColor(0, 0, 255)\n    r.hyperlink.address = url\n```\n\n```\np.font.color\
    \ = RGBColor(0, 0, 0)\nhlink = r.hyperlink\nhlink.address = url\n```\n\nThis section\
    \ of the function defines font attributes. One adds the line which text is collected\
    \ in Step 10 from the new news message to the slide. We use p.font.size to set\
    \ the size of the text, which is achieved by Pt followed by actual size - using\
