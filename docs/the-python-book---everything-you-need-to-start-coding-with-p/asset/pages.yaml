  md: "# Multitask with your Pi\n\nLearn how to multitask with your own Python code\
    \ — for those multiple projects on the go\n\nThe majority of programmers will\
    \ learn single-threaded programming as their first computational model. The basic\
    \ idea is that functions are executed sequentially, one after the other. This\
    \ works well enough until you reach a point where you need to start multitasking.\
    \ Some applications are difficult to run on a single processor of some architecture.\
    \ In these cases, you would have heavy, compute-bound processes running in parallel.\
    \ Since the Raspberry Pi is not a 16-core desktop machine, you might be under\
    \ the assumption that you cannot use threads to improve execution speed. This\
    \ isn't true.\n\nThere are plenty of problems that might make multitasking tricky.\
    \ You might find that splitting code into multiple threads takes a considerable\
    \ amount of time to complete. In these cases, it is well worth proving your effort\
    \ by creating multiple threads. Since Python is the language of choice for the\
    \ Raspberry Pi, we will learn to add threads to your code. For those who have\
    \ used multi-threaded programming in Python, you will run into the GIL, Global\
    \ Interpreter Lock, which ensures that only one thread can actually be running\
    \ at a time, so you will not get parallel processing. The Raspberry Pi is up to\
    \ this:\n\nThe code below is an example of how to write the correct code for this\
    \ article. By using the threading module, you can run multiple functions at once.\
    \ What you need to write is your code. The first step is to create a new thread\
    \ object with the constructor:\n\n```\nt = threading.Target(target=my_func)\n\
    ```\n\nThe Thread object takes some function that you have created, my_func in\
    \ the example above, as the thread that needs to run.\n\nthread object has finished\
    \ its initialisation, it is alive but not running. You need to explicitly call\
    \ the new thread's start() method. This will begin running the code you handed\
    \ to the thread.\n\nYou can check if this thread is alive by using thread.alive.\
    \ Normally, this thread will run until the code finishes, or it can exit if an\
    \ unexpected exception is raised. Depending on your experience with parallel programs,\
    \ you might have some ideas about how to handle this. For example, in MPI, you\
    \ might use the same code running in parallel. To do something like this, you\
    \ can use callbacks:\n\n```\ndef my_func():\n    id = threading.get_id()\n   \
    \ print(f\"thread {id} is starting\")\n```\n\n```\nthread.start()\n```\n\nThe\
    \ code above works but doesn't exist in Python 2. Thread is one of the modules\
    \ that change moving from one version of Python to another. Here is the code for\
    \ the version of Python you are using:\n\nA common pattern in parallel programming\
    \ is to use a Queue. This way, your main thread can continue with the work and\
    \ all of the resources are kept relatively safe. But how do you know if the child\
    \ thread is done or not? If you use the join() method mentioned above, the thread\
    \ will wait until the child thread finishes. In these cases, you can use the join()\
    \ method of the thread object you\n\nare waiting on. This method blocks execution\
    \ at the same time, we wait until the thread question returns. You can include\
    \ an optional parameter to the method to time out after some number of seconds.\
    \ This allows you to not get trapped in a thread that never returns to execution.\n\
    \nNow that we have more than one thread of execution at the same time, we have\
    \ to be careful about variables. The first thing is about global data. If you\
    \ have two threads that want to read, or even write, what happens to the same\
    \ variable? You can have situations where the value of variables can change out\
    \ of sync with what you expect.\n\nThese types of issues are called race conditions,\
    \ because the threads are racing with each other to see in what order they write\
    \ to the shared variable. There are two solutions to solve this problem of:\n\n\
    # lock = threading.Lock()\n\nThe first is to control access to global variables\
    \ and allow only one thread to work with them. The generic term for this is using\
    \ a mutex to control this access. A mutex is an object that needs to be locked\
    \ before accessing the associated variables. In the threading module, this is\
    \ how you create a new lock. The first step is\n\n![](img/516df994db593237169e2aff6d3e6840_99_0.png)\n\
    \n100 The Python Book"
