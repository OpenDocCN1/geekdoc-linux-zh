  md: "# Create with Python\n\ncolours of game world using RGB (red green blue) colour,\
    \ it seems so counter-intuitive, but all zeros are and the full is 255. It helps\
    \ to think of it as amount of light in that colour range, 255 being the maximum\
    \ and 0 being none.\n\n# Quitters!\n\nAs always, we'll need a way to quit our\
    \ game. After the main game loop it's best to include pygame.quit().\n\n# Quick\
    \ tip\n\nTry introducing a score limit to the game. With a random selection, it\
    \ could be used to end the game when a player reaches a high score.\n\n```\nBLACK\
    \ = (0, 0, 0)\nWHITE = (255, 255, 255)\nWe'll want to set the dimensions of our\
    \ game window. We'll use a typical VGA resolution of 800x600, but you can change\
    \ it to a lower resolution like VGA, for example, 640x480.\nsize = (800, 600)\n\
    screen = pygame.display.set_mode(size)\npygame.display.set_caption(\"Pong\")\n\
    We'll also set the title to Pong, but you may want to get more creative here.\n\
    ```\n\nFor our paddles, we're going to create a new class. Then we can spawn objects\
    \ of that class and they'll be independent of each other. We'll need a paddle\
    \ for each player; they both have the same height, width, colour and so on. It's\
    \ so practical to use an Object Oriented approach here, rather than two separate\
    \ entities. With Object Oriented Programming, we'll need to save our paddle states\
    \ in their class. Create a new Pong file called paddle.py.\n\n![](img/516df994db593237169e2aff6d3e6840_108_0.png)\n\
    \nNow we'll have a display window with a resolution and a colored background and\
    \ setup up, we can focus on the main loop of the program. Before we do, let's\
    \ create a way to quit so:\n\n```\ncarrying = True\nclock = pygame.time.Clock()\n\
    Here we'll build the main loop. We'll set carrying to True, and while it's True\
    \ we'll design our loop to continue until we've changed the status of the updates.\
    \ To make the controls responsive we need to observe user inputs and handle them\
    \ in real time. For example, when the mouse or keyboard is pressed, we'll have\
    \ to implement the appropriate game logic, such as moving the paddle or ball.\
    \ After each frame, we'll need to refresh the screen to ensure the frames and\
    \ shapes are redrawn, and this is how the game will come to life. Here we can\
    \ show how this screen refresh works - that's called the \"rate\" in our code.\
    \ We set the frame rate to 60 frames per second, which is standard for most video\
    \ games. The higher the frame rate, the smoother the movement will appear.\n```\n\
    \n```\nwhile carrying:\n    for event in pygame.event.get():\n        if event.type\
    \ == pygame.QUIT:\n            carrying = False\nscreen.fill(BLACK)\npygame.draw.line(screen,\
    \ WHITE, [340, 0], [340, 500], 5)\npygame.display.flip()\nclock.tick(60)\n```\n\
    \nSo while carrying, we'll check if the user did anything (pygame.event.get())\
    \ and, if they did close off (if event.type == pygame.QUIT) we'll switch carrying\
    \ to False.\n\nWe haven't added the game logic - that all go in the middle after\
    \ the while loop. For now, we've done the drawing. The screen has been filled\
    \ with black and a white net across the screen. We've updated the screen with\
    \ pygame.display.flip() and set the fps rate.\n\n> The above is: Pong cabinet\
    \ from 1972.\n\nThe Python Pong 109"
