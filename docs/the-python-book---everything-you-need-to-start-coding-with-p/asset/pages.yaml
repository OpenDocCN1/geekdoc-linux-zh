  md: "# Work with Python\n\n# 16 The client's networking class\n\nMuch of the Networking\
    \ class is similar to the server's. One difference is that the class doesn't join\
    \ the Thread - we start just one of its functions as a thread.\n\ndifference is\
    \ that we want to add things to the text view of our window. We do this by using\
    \ the idle_add function of GObject. This allows us to call a function that updates\
    \ the running in the main thread when it is not busy.\n\nyou've started the server,\
    \ open an instance of the client and enter 127.0.0.1:port where 'port' is the\
    \ port you've decided to use. The server will print the port it's listening on\
    \ to make this. Then enter a username and click OK. You will see an output like\
    \ this. You can now use multiple clients by replacing 127.0.0.1 with the address\
    \ of the server. You may have to let the port go through your computer's firewall\
    \ without using it.\n\n```\nclass Networking:\n    def __init__(self, window,\
    \ socket, port):\n        super().__init__(window)\n        self.socket = socket\n\
    \        self.socket.setsopt(socket.AF_INET, socket.SOCK_STREAM, socket.SO_REUSEADDR,\
    \ 1)\n        self.socket.connect((port))\n```\n\n```\ndef send(self, message):\n\
    \    sendall(message)\n    print(f\"Sending: {message}\")\n```\n\n```\ndef receive(self):\n\
    \    data = self.socket.recv(1024)\n    if not data:\n        return None\n  \
    \  return data\n```\n\n```\ndef tidy_up(self):\n    idle_add(self.finish)\ndef\
    \ finish(self):\n    self.socket.close()\n```\n\n```\ndef join(self, username):\n\
    \    self.username = username\n    self.send(f\"USERNAME {username}\")\n```\n\n\
    ```\ndef listen(self):\n    while True:\n        data = self.receive()\n     \
    \   if data:\n            self.handle_message(data)\n```\n\n```\ndef handle_message(self,\
    \ data):\n    message = data.decode().split(' ', 1)\n    if message[0] == \"USERNAME\"\
    :\n        self.username = message[1]\n    elif message[0] == \"MESSAGE\":\n \
    \       print(f\"{self.username}: {message[1]}\")\n```\n\n```\ndef handle_message(self,\
    \ data):\n    if data == \"QUIT\":\n        self.tidy_up()\n    else:\n      \
    \  self.handle_message(data)\n```\n\nWe'll wait for the queue to finish when the\
    \ user is quitting or the window is closed.\n\n```\ndef quit(self):\n    idle_add(self.window.add_quit())\n\
