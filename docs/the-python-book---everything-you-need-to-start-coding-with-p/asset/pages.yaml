    # ## With modulus


    The ''with'' clause provides the ability to use a code block with methods defined
    by a context manager. It can help clean up code and make it easier to read what
    a piece of code is supposed to do months later. A classic example is using ''with''
    when dealing with files. The best part is that you don''t have to call ''file.close()''
    manually; you just open the file in the block, and the file will be automatically
    closed when the block ends. So, even if the block throws an exception, you don''t
    need to worry about it. If you have a more complicated ''with'' command, you can
    create your own context manager to help out.


    # ## Printing


    The simplest way of getting output to the user is with the print command. This
    will send the text to the console window. If you are using version 2.X of Python,
    there are many ways you can use the print command. The most common way was done
    simply as ''print "message"''. Python 3 introduced a new syntax that you use for
    printing. So, the example above would look like ''print("message")''. If you use
    the ''print'' function, you can add extra parameters to give you finer control
    over that output. For example, you can use the ''sep'' parameter to change what
    gets dumped into the file. It will also accept any object that has some string
    representation.


    # ## Ranges


    You may have a list of lists, or in a ''for'' loop, the ''range()'' command can
    iterate over an iterable list of integers. With one parameter, you get a range
    starting from zero. With two parameters, you can specify an optional start, as
    well as a step. Negative numbers count down.


    # ## Max and Min


    If you have a list of numbers (or anything else) and want to know about the largest
    and smallest elements, you can find the maximum element with the max() function.
    Use min() to find the minimum element, min().


    # ## Iterators


    Iteration is a Pythonic way of doing things. For objects which are not intrinsically
    iterable, you can use the iter() function to wrap your object and provide an iterable
    interface for it with loops and operations.


    # ## Sorted lists


    You can use the ''sorted()'' function to sort the elements of a list. You can
    use a custom function, and even more complex, provide a key function that pulls
