    +   14 Broadcasting in NumPy

    To explain, we tell more about broadcasting because it is a very useful characteristic.
    You should know that array broadcasting has a rule: in order for two arrays to
    be considered for broadcasting, the size of the trailing axes for both arrays
    in an operation must be the same or one of them must be one.


    ![](img/516df994db593237169e2aff6d3e6840_82_3.png)


    Put simply, array broadcasting allows NumPy to "change" the dimensions of an array
    by filling it with data in order to be able to do calculations without another.
    Nevertheless, you cannot stretch dimensions of an array to do your job.


