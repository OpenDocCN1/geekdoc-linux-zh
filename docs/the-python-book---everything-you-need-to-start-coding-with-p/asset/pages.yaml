    In this article, all code at the start

    ```


    # 03 Dynamic typing


    Java, C++, and other statically typed languages, you must specify the type of
    the function return value and each argument. Python is a dynamically typed language,
    you never have to explicitly specify the type of anything. Based on what value
    you assign, Python will keep track of the data type internally.


    26 The Python Book'
