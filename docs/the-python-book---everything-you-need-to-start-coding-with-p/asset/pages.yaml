    \ level of indentation. Spaces are used to represent a single level of indentation\
    \ in Python. You can use tabs, but tabs are not defined clearly, especially if\
    \ you open a file in more than one editor.\n\n```\n#!/usr/bin/env python3\n```\n\
    \n```\nimport sys\n\nsys = sys.exit\n\nint_count = 5\n\nif int_count < 6:\n  \
    \  sys.exit(\"count must be >= 6\")\nelse:\n    print(\"int_count was >= 6 continuing\"\
    )\n```\n\n> The 'for' loop uses a local copy, so changes in the loop do not affect\
    \ the list\n\n# More about a Python list\n\nThe path that the code takes will\
    \ depend on the value of the int_count. The code in the \"if\" block will be executed\
    \ if the condition is true. The important statement is to use the system library,\
    \ which provides the way to exit the program, printing an error message. Notice\
    \ the four spaces indent used to indicate a statement of code belongs to:\n\n\
    +   * For statements, which are commonly used to control structures.\n* For lists,\
    \ you can iterate over items in collections, or to repeat a piece of code a certain\
    \ number of times\n* While statements, a loop continues until the condition is\
    \ true\n\nA list is ordered and mutable an array of elements. A list for tuple\
    \ can contain different types, which is not unlike the case with arrays in other\
    \ languages. We recommend that you use lists when you only need one type of list.\
    \ A list might always be the best choice when the way data in a list will be processed\n\
    \nWe are going to use a loop that accepts user input from the keyboard to demonstrate\
    \ how control structures work. We're calling it construct_list.\n\n```\n$ /construct.py\n\
    # How many integers are you?\nYou must enter an integer\n```\n\nThe loop is using\
