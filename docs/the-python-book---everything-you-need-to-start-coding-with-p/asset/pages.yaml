    NumPy is the primary package for performing scientific computing. It has powerful
    N-dimensional array objects, for integrating C/C++ and Fortran code, linear algebra,
    Fourier transforms and number capabilities, among others. NumPy supports broadcasting,
    which is a clever way to deal with functions in a way that handles arrays of different
    shapes efficiently.


    NumPy also works with Pygame, a Python package for creating games, explaining
    why its use is beyond the scope of this article. It is considered good practice
    to try the various NumPy functions before putting them into Python programs. The
    examples in this article are using Python or SciPy.


    Apart from its capabilities, the advantage of NumPy is that it can be integrated
    into other programs. In other words, you can get your data from a database, the
    output of another program, an external file or an HTML page and process it using
    NumPy.


    # ### Installing NumPy


