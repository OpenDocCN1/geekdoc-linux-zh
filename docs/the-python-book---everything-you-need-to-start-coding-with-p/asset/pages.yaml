    While:

    x1, y1, z1 = mc.player.getPosition()


    # 10 One point placed


    Now that the player has moved one square they are awarded a point. This is a simple
    action of adding the value to the existing score. This is achieved using `score
    = score + 1` inside this loop, it will run each point time the player moves.


    ```

    time.sleep(1)

    ```


    ```

    score = score + 1

    ```


