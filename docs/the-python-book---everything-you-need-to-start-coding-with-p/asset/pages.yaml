    # 13 How is a list?


    In some cases, you may have a collection of elements within a list that can be
    evaluated to True or False. For example, you may run a number of possibilities
    through your computation and have created a list of which ones passed. You can
    use the command ''any'' to see whether any element in your list is true. Both
    of these commands return True if the relevant element is true, and False if not.
    If they differ then the iterable object is empty, the command ''all'' returns
    True if the iterable is empty, whereas the ''any'' returns False for any non-empty
    iterable.


    # 14 Enumerating


    Sometimes, we need to list the elements of an iterable object with their indices
    so that they can be processed in order. You can do this by looping through all
    the elements and building an enumerated list. It takes an iterable and creates
    a list of tuples with the result. Each tuple contains the zero-based index of
    the element, with the element itself. You can also specify a starting value as
    a parameter. For example, you could enumerate a list of names with the command
    ''enumerate(names,start=''. In this example, we decided to start the indexing
    at 1 instead of 0.


    ```

    >>> names = [''a'', ''b'', ''c'']

    >>> list(enumerate(names,start=1))

    [(1, ''a''), (2, ''b''), (3, ''c'')]

    ```


    # 15 Casting


    Variables in Python don''t have any type of object. However, the actual data,
    can be stored as one type or another. More addition, assume that the input values
    are of the same type. Very often the user is smart enough to make the kind of
    type conversion that is needed. To convert data from one type to another, there
    are classes of functions that can be used to do this conversion process. The most
    common ones are ''float'', ''int'', ''oct'', and ''str''. For the number-based
    conversion functions, there is an order of precedence which follows: when converting
    up, nothing changes the value should hold. When converting down, some amount of
    information is lost. For example, converting float to int. Python truncates the
    number towards


    # 16 What is this?


    Everything in Python is an object. You can check whether an object is an instance
    of a class with the command ''isinstance(object,class)''. This returns a Boolean
    value.


    # 17 Is it a subclass?


    The subclass() command checks if one class is a subclass of another. If class1
    and class2 are the same, this returns True.


    # 18 Global objects


    You get a dictionary of the global symbol table for the current module with the
    command ''globals()''


    # 19 Local objects


    You can access an index of the current local symbol table by the command ''locals()''


    # 20 Variables


    The command ''vars()'' returns the dictionary elements of an object. If you use
    ''vars()'' it behaves like ''locals()''


    # 21 Making a class


    A list of names is defined as globals for the code block with the command ''class''


    # 22 Nonlocals


    In Python 3, you can access the nearest enclosing with the command ''nonlocal
    names'' and bind it to that scope.


    # 23 Raising an exception


    When you encounter an error, you can use the command ''raise'' to throw an exception.
    You can also raise an exception type with a message.


    # 24 Dealing with an exception


    Exceptions can be caught in a try-construction. If the code fails in the try block,
    the exception in the except block runs.


    # 25 Static methods


    You can create a static method, similar to in Java or C++, with the command ''staticmethod(function,
    name)''


