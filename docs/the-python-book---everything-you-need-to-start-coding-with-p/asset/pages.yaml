    # 03 Testing Pivaders


    With Python installed and the project cloned to your machine — simply find the
    zip on FileSilo — unpack and copy it to your home directory, you can then take
    a look to make sure everything''s set up properly. Now you get to run python.pivaders
    from within the project folder in the terminal. Start the game with the space
    bar, but with some shift and use the left and right arrows to move your pivader
    left and right.


    you can''t remove individuals within them. Perfect, for constraints, which aren''t
    designed to change anything.


    You could, for example, have a pet class. That class you could create a cat that
    meows and a dog that barks). They''re different in many ways, they''ll have both
    fur and paws, so you can create them from the same parent class. Now we use it
    with Ammo class to create the bullet players and all the missiles. They''re different
    but fundamentally one and the same. This saves us from creating unnecessary code
    and ensures consistent behaviour between objects.


    # 04 Creating your own class


    Once you''ve racked up a high score (which is really over 2000 points) and it''s
    good enough to start rethinking how the game is going, you''ll want to add your
    own features. To do that, create a new project folder and use either IDE or Leafpad
    (or getgame) to create and save a new file as you go.


    # 06 Classes - part 1


    A class is essentially a blueprint for an object you''d like to make. It contains
    all the required info, from which you can make instances of that class. We use
    it in the main_class method halfway through the game. The first thing is that
    the classes in Pivaders are just like Python''s Sprite class, so you can find
    all the shortcuts for them at pivaders.sprite. For more details of the class,
    you can read more about the Sprite class at https://www.pygame.org/docs/sprite.html


    # 09 Game


    The main class is called Game. This is where the main part of the game itself
    comes in, but it''s still just a list of lists — not anything until a ''Game''
    object is created at the bottom of the class. This class is the central part of
    the game, so we initialize the pygame for our protagonist and antagonist strategies
    and then use key aspects of elements class to control the player''s movement and
    decide if we need to start the turn again.


    # 07 Classes - part 2


    In Pivaders, besides the simple variables in classes - the object itself (a player,
    an alien, or bullet) - all the classes have an update method apart from Block
    class (which is a function within a class). The (update) method is called in the
    main_loop method of the game (which we call main_loop) to move the objects. If
    one goes off the screen, it''s time off and destroy it (since we don''t need it
    anymore).


    # 10 The main loop


    There are a lot of methods (functions) in the class, and each is designed to control
    a particular aspect of the gameplay. The most important is the main_loop which
    dictates what happens when any round of the game is contained in the main_loop
    method at the top of the pivaders.py and it is the key to unlocking what comes
    next. We need to control the drawing line-by-line at the top of the main_loop,
    and then see what''s been elapsed every 20 seconds when you''re playing the game.


    # 05 Global variables & tuples


    Once we''ve imported the modules we need for the project, there''s quite a long
    list of variables and tuples we use. These variables are global (or tuples). They
    are important variables that never change — they represent things like colours,
    block sizes and resolution. You''ll also need to use sizes and sizes as tuples.
    We could use square brackets to make them lists, but we use tuples here since
    they''re immutable, which means


    # 08 What''s important


    classes, so that you can use them to create different types of things.


    ![](img/516df994db593237169e2aff6d3e6840_113_0.png)


    # 11 Main loop logic - part 1


    First the main loop checks if the end_game is true. If so, the main loop in main_loop
    is skipped and we go to pivader.py, exiting the game. If not it then checks if
    the player closed the window or pressed a key. If the start_screen is true, the
    main loop can start with the control(method) method, which checks to see if the
    location of the player has changed. We need to move the alien and us as well.
    Then we need to continue on to draw the screen that has been created. We use the
    (update) method for each and every actor on the screen for a simple loop. This
    uses variables to move up and moved before we check collisions in calc_collision().


    # 12 Main loop logic - part 2


    Once we have been deleted, we check if the game is still wanted. We do so with
    dead() and defenses_broken() — if any of these methods return true, then we return
    to the start_screen. If not, we also need to see if we''ve killed all the aliens,
    from win_round(). While not being the end, we can also call next_round() — which
    method creates a fresh batch of aliens and moves them around the screen. Finally,
    we refresh the screen so that everything''s been drawn, so what could have been
    killed or removed from the screen. Remember, the main loop happens 20 seconds
    - so that we don''t wait for the call to update right at the end of the loop of
    no consequences.


