  md: '# 02 Downloading python


    Git is a superb version control solution that helps programmers save their code
    and files. It not only helps you return to a previous time but also keeps a history
    of changes, means you can jump back on places from github. To view the version
    of the project we created you can use the command line `log` and `type`


    ```

    git clone https://github.com/rustbuilders/python

    ```


    This is a folder that contains python pyiders - go inside `pyiders` and take a
    look.


    # 03 Navigating the project


    The project is laid out with several folders. Within pyiders sits a license, a
    readme and a second folder. In this game file, pyiders.game, and the data folder
    you''ll find subfolders for graphics and sounds, as well as the folder for the
    icons and scores. For tasks, simply edit the subfolders in `pyiders/data` or `data/tasks`.


    Use the keys to steer left and right and the space bar to shoot. You can join
    to the main screen with the Esc key and press enter.


    # 04 Animation & sound


    Compared with the game last month, it''s much more dynamic. The project moves
    when you change direction and moves left when you either press the arrow key or
    leave the key off. When you shoot an alien, it explodes


    with several frames of animation and you should take fire, a smaller explosion
    occurs on our ship. Music, lasers and explosion sound effects also accompany the
    animations in the game.


    # 05 Finding to animate


    Before we can program, we have to set up our ship and alien. We''ve used some
    sprite sheets to use as sprite sheets; you can find free online or create one
    with GIMP or a library. It''s a bit tricky but scaled and sized frames are perfect
    idea. Find many free-made assets at opengart.org, we


    # 06 Tweaking


    While many of the assets on sites like opengart.org are great, you may want to
    import them into your own project. To change the size and position of the alien
    we used with our ship sheet, we had to move the alien to the center and then change
    the size of the frames and copy-paste them into a new sheet with 11 frames of
    the same size as our ship. Precision on size and width is key, so we can just
    adjust it until it looks right.


    # 07 Loading the sprite


    Since we used the Sprite to create our Player class, we can easily explain how
    the players look and move. We need to load our ship sheet with `pygame.image.load`.
    We also made the sound for our ship with a transparent background, so we can add
    `append_sound.


    # 08 Animation flags


    Down is the initialization code for the game. We set flags for player and alien:
    `self.animate`, `self.left` and `self.right`. In the control of our game, we used
    these `flags` to ''automatically'' move the ship when we are moving right and
    to let the ship continue to look left if it''s leaving off the screen.


    # 09 The effects


    These flags appear up in the code for the game. We use `self.animate` within the
    game class. Here we used it to coordinate the frame and position of the alien
    exactly. If `self.right` is true and the current position is what we want, we
    increase the speed of the alien. If `self.left` is true, we move the alien back
    to the left.


    # 10 Adding music to project


    Pygame makes it easy to add audio to a scale project. We used a short piece of
    music in our preferred format (wav) from freesound.org and loaded it using the
    `pygame.music` class. It''s also loaded via `pygame.music.load`. We can easily
    adjust and loop the music with:


    ```

    pygame.music.load(''music/alien.wav'')

    pygame.music.play(loops=-1)

    ```


    # 12 Using sounds


    If you''re struggling to find free and open sounds effects, we recommend freesound.org.


    ![](img/516df994db593237169e2aff6d3e6840_117_0.png)


    ![](img/516df994db593237169e2aff6d3e6840_117_1.png)


    118 The Python Book'
