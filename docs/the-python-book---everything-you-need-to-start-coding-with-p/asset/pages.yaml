    # # Get started with Python


    Always wanted to have a go at programming? No more excuses because Python is the
    perfect way to get started!


    Python is a great programming language for both beginners and experts. It is designed
    with code readability in mind, making it an excellent choice for beginners programmers
    who are still getting used to various programming concepts.


    Libraries to create a windowed application, or you could try something a little
    more ambitious like an app such as creating using Python''s Bluetooth and Input
    libraries to capture the input from a USB keyboard and relay the input events
    to an Android phone.


    The language is powerful and has plenty of Libraries available, allowing programmers
    to get a lot done with relatively little code.


    In this guide we''re going to be using Python 3 since that version is most likely
    to be installed on your Linux distribution.


    You can make all kinds of applications in Python. You could use the Pygame framework
    to write simple 2D games, you could use the GTK


    In the following tutorials, you''ll learn how to create popular games using Python
    programming. We''ll also show you how to add sound and AI to these games.'
