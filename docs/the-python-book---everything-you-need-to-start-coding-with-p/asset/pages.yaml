  md: "# # Create with Python\n\nLeft Once finished,\nmini-game uses the\nchat console\
    \ to\nreport your score\n\n```\nimport sys\nimport random\nimport time\nimport\
    \ os\nimport math\nimport threading\nimport tkinter\nimport minecraft\nimport\
    \ mpi\n\nscore = 0\nplayer_x = 0\nplayer_y = 0\nplayer_speed = 1\nwidth = 100\n\
    height = 100\nwhile True:\n    move = random.randint(0, 4)\n    if move == 0:\n\
    \        player_x += 1\n    elif move == 1:\n        player_x -= 1\n    elif move\
    \ == 2:\n        player_y += 1\n    elif move == 3:\n        player_y -= 1\n \
    \   if player_x < 0 or player_x > width:\n        player_x = 0\n    if player_y\
    \ < 0 or player_y > height:\n        player_y = 0\n    time.sleep(0.1)\n```\n\n\
    ![](img/516df994db593237169e2aff6d3e6840_122_0.png)\n\nGAME OVER\nScore: 318\n\
    GAME OVER\n\n| ID | Name | Value |\n|---|---|---|\n| 1 | Apple | 10 |\n| 2 | Banana\
    \ | 20 |\n| 3 | Cherry | 30 |\n\n# Full code listing\n\n```\nimport random\nimport\
    \ time\nfrom mpi import minecraft\ncm = minecraft.Minecraft()\nmc = cm.create()\n\
    ### Create the mine###\nmc.postTo(\"Welcome to Minecraft Sweeper\")\nx, y, z =\
    \ mc.getPlayerPos()\nmc.setBlock(x+1, y-1, z+28, 58)\nmine = 0\nmine = random.randrange(0,\
    \ 11, 1)\n\n### Place the mine###\nmine_x = int(mine)\nmine_z = int(mine)\nmc.setBlock(mine_x,\
    \ mine_y, mine_z, 6)\nscore = 0\nmc.postTo(\"Score: \" + str(score))\ntime.sleep(0.1)\n\
    while True:\n    # Test if you are standing on the mine\n    xl, yl, zl = mc.getPlayerPos()\n\
    \    # check\n    time.sleep(0.1)\n    if (xl, yl, zl) == (mine_x, mine_y, mine_z):\n\
