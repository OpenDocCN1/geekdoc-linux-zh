  md: '# Use Python with Pi


    ![](img/516df994db593237169e2aff6d3e6840_159_0.png)


    # control a Robotic Arm

    with your fingertips


    Build, hack and move a robotic arm with flicks,

    finger movements and gestures


    This tutorial combines the Maplin Robotic Arm and

    Pimonori''s Skywriter HAT to enable you to take control of

    t robot with just the touch of your fingertips. The arm

    can through three points of articulation and ends in

    a clamp to give reason flexibility movement. The

    arm moves through 120 degrees at the wrist,

    30 degrees at the elbow, 180 degrees at the base is in the vertical

    270 degrees in the horizontal. It is easy to

    assemble and is a great beginner robot. In this tutorial

    you will first connect your Raspberry Pi to the USB port, and then learn

    how to use Python code to send commands and receive

    them from the arm. Next we will write a simple program to

    control the arm; this is actually fun and you can start


    to another location. The Skywriter is an electrical near-field

    30-sensing board that recognises a gesture of gestures

    including taps and flicks. These gestures can be made at a

    specific location on the board (north, south, east, west or in

    the centre) then programmed to respond in a particular way.

    We will explain each part of the tutorial in detail.

    Finally, the arm and the Skywriter code are combined

    to create a program where you assign a particular arm

    to a particular gesture to control it at your fingertips.

    For example, a tap on the north of the

    board could move the arm, a tap at the bottom (the

    south position) could move it downwards. Watch this video

    how Skywriter: https://www.youtube.com/watch?v=0DcC5S8


    # Resources


    +   - Maplin Robotic Arm

    Pimonori Skywriter

    Raspberry Pi 2, 3 or 4


    160 The Python Book'
