- img_proc: true
  md: '# 01 Set up LED


    LED are really easy to set up and control. They make a nice addition to your toy
    and can be used as flashing buttons, or in example, R2-d2''s radar eye. Take and
    hold the longest; this is the positive arm and connects to the input. Wrap the
    wire around the leg and attach it. Take the negative arm and attach this to another
    motor.


    # 02 Attach the led


    Take the positive wire, with the G17, which is physical pin number 11 (look at
    the far-top left and down pins). Connect the negative wire to any of the ground
    pins, GND, 5, 14, 23, 39; you may need to move it around any area if you need
    more wires for the motors.


    # 03 Light up the led


    To turn the LED on, use the gpio library, which was designed to simplify the interaction
    between the led and a computer. Use the LX terminal and


    ```

    sudo apt-get install python3-gpio

    ```


    to install it (Remove the ''3'' if you want to use it with Python 2). Once installation
    is completed, open a new Python window and type the following code. Assign the
    pin number of the LED to a variable. Save the line 3 and finally turn the LED
    on and off (lines 5 and 6). Change the code to suit your toy project.


    ```

    import time

    from gpiozero import LED

    led = LED(17)

    led.off()

    ```


    ```

    while True:

    led.on()

    time.sleep(0.5)

    led.off()

    time.sleep(8)

    ```


    # 04 Add vibration


    You may want the toy to vibrate or shake when it moves. R2-d2 is known for giving
    out electric shocks and a safe way to emulate this is haptic feedback, similar
    to that when you press a key on your mobile. Pinoriro stocks a suitable vibration
    motor, which will deliver a short vibration. Take each of the wires and connect
    them to a female-female jumper.


    # 05 Wire the disc motor


    Wire the positive from the motor (usually red) and attach it to GPIO pin 9; this
    is physical pin number 21. The black wire connects to a ground pin - the nearest
    is pin 25; then drop down wires onto the leg that is pin 25. Start a new program
    or edit the code to spin the motor on GPIO 9. This ensures that the motor system
    is working.


    ```

    import RPi.GPIO as GPIO

    GPIO.setmode(GPIO.BCM)

    import time

    ```


    # 06 Turn the motor


    To turn the motor, set the output pin, 9. This tells the program that GPIO 9 is
    an output. Next, set the GPIO to ''HIGH'' line; this is like turning it on. Current
    flows through and the motor will turn on. Add a pause line 3 before setting the
    output to LOW, which turns the motor around. adjust the timings to find the perfect
    pace for your needs.


    ```

    sudo apt-get install python3-gpio

    GPIO.output(9, GPIO.HIGH)

    time.sleep(0.5)

    GPIO.output(9, GPIO.LOW)

    ```


    # 07 Hang a webcam


    A small camera can be hidden within the body of the toy to take photos or stream
    a live feed to a laptop or mobile device. Use your webcam and carefully strip
    away the plastic shell so you are left with the board and lens. Depending on the
    size of your toy, adjust the casing so that it can fit and be


    ![](img/516df994db593237169e2aff6d3e6840_168_0.png)


    # R2-d2 in action


    Check out the video of the R2-d2 toy and see the features in action. This is great
    inspiration for your own toy project.


    ![](img/516df994db593237169e2aff6d3e6840_168_1.png)


    ![](img/516df994db593237169e2aff6d3e6840_168_2.png)


    The Python Book 169'
