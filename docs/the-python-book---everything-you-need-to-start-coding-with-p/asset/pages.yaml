    Django contains a lot of impressive features, in the name of interfaces and modules.
    These include admin interfaces and database management tools, ORM, and authentication
    systems. Django helps enable rapid application development for enterprise-level
    projects, while also enabling a clear reusable approach to using subapplications.


    # # Flask


    flask.pococ.org


    GOOD FOR: Creating full-featured REST APIs. Its ability to manage multiple routes
    and templates is very impressive


    Flask''s aim is also to provide a set of commonly components used as URL, routing
    and templates. Flask will also work on controlling the request and response objects,
    all in all this means it is lightweight but still powerful framework.


    # # Werkzeug


    werkzeug.pococ.org


    GOOD FOR: API creation, interacting with databases and following strict rules
    whilst managing HTTP.utils


    Werkzeug is the underlying framework for Flask and other Python frameworks. It
    provides a unique set of tools that enable you to perform URL routing processes
    as well as request and response objects, and it also includes a powerful debugger.


    # # Tornado


    tornadowebproject.org


    GOOD FOR: Socket connection and long polling due to its ability to scale manage
    number of connections


    Tornado is a library that works as a nonblocking, web server and web application
    framework. It''s known for its high performance and scalability, developed for
    Facebook which was a real-time chat system that gathered several social media
