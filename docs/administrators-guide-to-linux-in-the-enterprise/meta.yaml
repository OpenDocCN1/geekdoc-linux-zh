    This line will forward all e-mail for *webmaster@mydomain.com* into the maildir
    */home/myemail/Maildir/*. For Qmail to know the difference between maildirs and
    mailboxes, note the differing syntax. To define a mailbox, begin the string with
    a forward slash and end with a valid mailbox filename. To define a maildir, begin
    the string with a forward slash and end with a forward slash. You can use this
    method to define another maildir (like */home/myemail/Maildir-webmaster/*), but
    your e-mail client must support multiple maildirs if you''re going to inject the
