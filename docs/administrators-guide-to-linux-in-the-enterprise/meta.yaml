    # Delegating authority to subdomains


    Some domains are quite large, and they often split up into logical subdomains
    for differing company divisions or groups. For example, a university that owns
    the domain *myuniv.edu* may want to give the physics department a subdomain of
    *phys.myuniv.edu*. However, if the physics department is large and has many computers,
    it will have to assign a lot of DNS entries. Instead of updating the primary DNS
    authority for *myuniv.edu*, the university could let *phys.myuniv.edu* have its
    own primary DNS server. That way, the physics department could make changes without
    disturbing the administrator of the domain''s primary DNS server. Now, let''s
    assume that the primary DNS for *myuniv.edu* is *ns.myuniv.edu* and the primary
    DNS for *phys.myuniv.edu* is *h2o.phys.myuniv.edu*. The database file for *myuniv.edu*
    might look like this:


    ```

    @INSOA...

    INA10.1.1.25

    INMXmail.myuniv.edu.

    INMXns.myuniv.edu.


    h2o.physINA10.1.2.80


    physINNSh2o.phys.myuniv.edu.

    INNSns.myuniv.edu.

    ```


    In this example, we gave *h2o* (the primary DNS for *phys.myuniv.edu*) an IP address
    of 10.1.2.80 as a precaution. If the folks in the physics department accidentally
    destroy their DNS data, their primary DNS server will still exist in *ns.myuniv.edu*''s
    domain records. Since the *h2o* machine belongs to the *phys* subdomain, you should
    place *h2o.phys* in the first column (and not *h2o*). Doing so translates into
    *h2o.phys.myuniv.edu*—not just *h2o.myuniv.edu* (which is incorrect). The second
    NS line exists because you''ll want *ns.myuniv.edu* (the primary DNS server for
    the university) to act as a secondary DNS server for the new subdomain.


    If you''re delegating authority for PTR records, the same rules apply. Your reverse
    resolution file on the primary server might look like this:


    ```

