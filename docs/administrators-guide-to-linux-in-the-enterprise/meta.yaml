  md: '# Using database maps


    If you are using any database maps, you''ll need to rebuild them with `makemap`
    from the original text source, (you do keep your original text source, don''t
    you?) to make sure the format is compatible with your new setup.


    This is generally done like this (example is using the mailertable database—more
    on this later):


    ```

    makemap hash /etc/mailertable.db < /etc/mailertable

    ```


    *hash* is one of three database options that *makemap* can use. The others are
    *dbm* and *btree*. *Sendmail* expects the *hash* format by default, but it can
    read a number of database formats, provided you''ve compiled support for them
    into the *sendmail* binary and you specify the lookup technique in the *.mc* file
    configuration. You can even leave the lookup table in plain text format, but lookups
    become quite slow if your list is very large. The implied database lookup command
    is:


    ```

    hash -o /etc/mail/somedatabase.db

    ```


    But you can also define any number of other lookup techniques, including calling
    an external program:


    ```

    dbm -o /etc/mail/virtusers

    program /path/to/program -d data.file

    ```


    The option being looked up is passed as the last parameter by *sendmail*.


    # Using procmail


    *Sendmail* expects *procmail* as the local delivery agent for Linux. Chances are,
    if you were already running *sendmail*, you have *procmail* installed. You can
    always check quickly:


    ```

    [stew@omnibook stew]$ which procmail

    /usr/bin/procmail

    ```


    If not, you can grab a precompiled RPM for your distribution or get source from
    the procmail site at **www.procmail.org**. *Procmail* is much more than a simple
    delivery agent with quite powerful filtering features.


    # Host names and aliases


    One item not mentioned in the *sendmail* documentation is the existence of `/etc/mail/local-host-names`.
    *Sendmail* will fail on startup without this file. It should contain the names
    of the hosts you will be accepting mail for. You can easily create one, like **Listing
    D**.


    You will also need an aliases table. Chances are, you already have one in */etc*,
    so you just need to move it to `/etc/mail`. Otherwise, you may see the following
    error message when trying to send or check mail status:


    ```

    hash map "Alias0": missing map file

    /etc/mail/aliases.db

    ```


    After you copy your aliases file to `/etc/mail`, run *newaliases*. An aliases
    file is mandatory, with a minimum of the following entries:


    ```

    Listing D: *Create /etc/mail/local-host-names*

    [root@omnibook /root]# hostname > /etc/mail/local-host-names

    ```


    ```

    Listing E: *Startup sendmail log*

    [root@omnibook /root]# tail -1 /var/log/messages

    Apr 14 17:39:36 omnibook sendmail: sendmail startup succeeded

    ```


    ```

    Listing F: *Telnet to port 25*

    [root@omnibook /root]# telnet localhost 25

    Trying 127.0.0.1....

    Connected to localhost.

    Escape character is ''^]''.

    220 omnibook.ays.net ESMTP Sendmail 8.11.3/8.11.3; Sat, 14 Apr 2001

    17:45:16 -0400

    QUIT

    ```'
