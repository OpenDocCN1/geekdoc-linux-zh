  md: 'back by *procmail*. In other words, a nondelivering recipe can use an external
    application (one outside of *procmail* itself) and act upon that e-mail before
    the processing on the e-mail is considered complete.


    In order to accomplish nondelivering recipes, a lockfile is often used. What is
    a lockfile? I''m glad you asked! In this article, we''ll unravel the mystery that
    the Linux (and the UNIX) community calls *lockfiles*.


    # Lockfiles


    It''s important to understand why lockfiles are used with certain recipes and
    why they''re not used with others. Understanding this crucial difference could
    keep you from losing a good deal of e-mail (as well as a good deal of time in
    retrieving that lost e-mail).


    # What do they do?


    Very simply, a lockfile places a semaphore within a file that basically says,
    "the file that owns this lock already has a process acting upon it and cannot
    be acted upon by any other process." With this handy-dandy tool, you can take
    an incoming e-mail, attach a lockfile to it, run a single process on the e-mail,
    and be sure that no other process will attempt to execute on that e-mail until
    the locked process has come to completion.


    # How are they used?


    In practice, we can use them for basic virus protection. Let''s say that we have
    an outbreak of viruses that come in the form of *.vb* scripts. A simple way to
    avert this virus is to mangle the extension so that Windows (poor, poor Windows)
    cannot execute the suspect file. Once the extension is mangled, the e-mail can
    then be delivered to its rightful owner.


    Without the lockfile, it''s possible that the e-mail could be delivered (through
    another recipe) before the extension is mangled. With the lockfile, this won''t
    happen—unless the recipe is poorly written, in which case no lockfile can help
    you!


    The fastest way to pinpoint whether a recipe uses a lockfile or not is the trailing
    : after the :0 at the top of a recipe. There are other times when a lockfile is
    explicitly called and named by appending a name, such as :0: *vacation.lock*.
    The advantage, of course, is efficiency. We''ll discuss lockfiles more as we go
    along.


    # Review the basics, quickly


    If you remember, the basics of a *procmail* recipe look like this:


    ```

    :0

    action

    ```


    Adding in a few more possibilities gives you this:


    ```

    :0 *flags:* lockfile_name

    * condition 1

    * condition 2

    action

    ```


    The first recipe has two lines. The first line, :0, marks the beginning of the
    recipe (all recipes have this), and the second line, *action*, is the action that
    is to be taken on incoming mail. For instance, you can replace *action* with something
    as simple as


    ```

    ! xxx@xxxx.xxx

    ```


    where *xxx@xxxx.xxx* is replaced with a legitimate e-mail address. This will forward
    all mail to the indicated e-mail address.


    The second recipe contains two (or more) extra lines that are marked *condition1*
    and *condition2*. The second recipe adds to the first line both flags and a user-defined
    lockfile. The possible flags used in *procmail* are fairly valuable:


    +   - **H**—*egrep* the header (the default).

    - **B**—*egrep* the body.

    - **D**—Tells the internal *egrep* to distinguish between uppercase and lowercase
    (contrary to the default, which is to ignore case).

    - **A**—This recipe will not be executed unless the conditions on the immediately
    preceding recipe (on the current block-nesting level) without the *A* or *a* flag
    are matched as well. This allows you to chain actions that depend on a common
    condition.

    - **a**—This has the same meaning as the *A* flag, with the additional condition
    that the immediately preceding recipe must have been successfully completed before
    this recipe is executed.

    - **E**—This recipe executes only if the immediately preceding recipe was not
    executed. Execution of this recipe also disables any immediately following recipes
    with the *E* flag. This allows you to specify *else if* actions.


