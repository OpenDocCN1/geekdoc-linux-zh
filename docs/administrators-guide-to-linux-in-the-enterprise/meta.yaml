    # Konqueror


    The Konqueror browser is considered by many to be the single biggest selling point
    for KDE2. Konqueror acts not only as a solid file browser but also a fully featured
    Web browser! In "Open source: The Linus Torvalds interview," Linus Torvalds himself
    said, "I''ve switched from my old fvwm setup (where "f" stood for "feeble" window
    manager) to KDE2 mostly because I love the anti-aliased fonts from QT and because
    I think that Konqueror is a better Web browser than Mozilla or Netscape (and also
    gets anti-aliased fonts)."


    Konqueror is a rather large application that serves a multitude of purposes. As
    a file browser, it gives to the Linux OS full drag-and-drop capability, in-line
    image viewing, single-click application launching, and a host of other features.
    One of the nicest aspects of Konqueror is the ability to switch between viewing
    modes. The available modes include:


    +   ▶ **File Management**: This is standard two-pane viewing.


    +   ▶ **File Preview**: This is three-pane viewing, which gives the user a third
    viewing area. Here, the far-left pane is for directories, the middle pane is for
    file listings, and the far-right pane is to view the contents of the actual files.


    +   ▶ **Midnight Commander**: This is an interesting perspective in that it takes
    the standard two-pane view and adds a third (at the bottom) that is actually a
    small terminal window where you can interact with the command line.


