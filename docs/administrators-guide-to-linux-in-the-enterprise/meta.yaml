    strategy, and it does a good job of keeping the user partition isolated from the
    kernel and all the boot critical code. However, in this strategy, the user filesystem
    is really just a subdirectory of the root partition.


    In the event that a user somehow manages to corrupt this partition, you might
    not be able to access the critical stand-alone files, such as the cd or ls command,
    that would help you boot the system.


    I tend to favor a different strategy for some very different objectives:


    +   > I want the root partition to be a stand-alone bootable minimal system complete
    with all the files that one would need if he or she booted the system in single
    user mode.

    > I want the rest of the system to be in a different physical partition so that
    I have the absolute minimum potential for damage to the root partition. Ideally,
    this would mean not having the /usr or /var located in the physical root partition.
    Unfortunately, we don''t always get what we want.


    Thus, my recommendation would be to declare a root partition of size 128 MB or
    so. This will hold the kernel and all boot files, as well as the /bin directory
    and the /var directory. Next, I would declare the /usr partition to be the rest
    of the available space on the disk. Within the /usr partition, I would create
    /usr/home, and then I would create a symbolic link from /usr/home to /home. This
    points the /home directory to physical space in the /usr partition. Someday, you
    might wish to add another disk, and then you could redirect /home to point to
    that disk instead of


    Table A: A very simple Linux partition table


    | Partition | Mount point | Description |

    | :--- | :--- | :--- |

    | /dev/hdb1 | /mnt/win98 | This is the Win98 filesystem we discussed. |

    | /dev/hdb2 | /boot | Kernel and related files go here; allocate 25 MB or so.
    |

    | /dev/hdb3 | Linux swap | This is your 128-MB swap space. |

    | /dev/hdb4 | / | This is where everything else goes. |


    Table B: My Linux partition strategy


    | Partition | Mount point | Description |

    | :--- | :--- | :--- |

    | /dev/hdb1 | /mnt/win98 | This is the Win98 filesystem we discussed. |

    | /dev/hdb2 | / | This is where everything goes. |

    | /dev/hdb3 | Linux swap | This is your swap space. |

    | /dev/hdb4 | /usr | User data will be stored here. |'
