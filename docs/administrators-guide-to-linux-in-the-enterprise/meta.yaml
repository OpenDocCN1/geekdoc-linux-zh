    # Modifying existing user information


    # Changing passwords


    The *passwd* command can change a user''s password, as in:


    ```

    passwd joe

    ```


    This command allows you to change joe''s password. You''ll be prompted for a new
    password for this user; then, you''ll be prompted for the password again. As root,
    you can change any password on the system. As a user, you may only change your
    own password.


    # Changing the user''s home directory


    To change a user''s home directory, run the following command:


    ```

    usermod -d <new homedir> <username>

    ```


    To change jim''s home directory from /home/jim to /home/jim1, run:


    ```

    user mod -d /home/jim1 jim

    ```


    To move the information that''s contained in a user''s home directory to the new
    location, run:


    ```

    user -d -m /home/jim1 jim

    ```


    This command moves all files in jim''s current directory to the new home directory.


    # Changing UIDs and GIDs


    To change a user''s UID, run the command:


    ```

    usermod -u -<UID> <username>

    ```


    The following command changes jim''s UID to 555:


    ```

    usermod -u 555 jim

    ```


    To change a user''s GID, run the command:


    ```

    usermod -g -<GID> <username>

    ```


    The following command changes jim''s GID to 555:


    ```

    usermod -g 555 jim

    ```


    # Changing an account expiration date


    Changing an account expiration date is useful for situations where you may need
    only temporary access to a system. The administrator can change the account expiration
    date so that the account is disabled on a set date. The command syntax is (where
    YYYY-MM-DD is the year, month, and day when I want the account to expire):


    ```

    usermod -e YYYY-MM-DD <username>

    ```


    Let''s say that I want an account for user guest to expire on March 1, 2002. The
    command syntax would be:


    ```

    usermod -e 03/01/02 guest

    ```


    This command resets the account expiration date for the user guest to March 1,
    2002.'
