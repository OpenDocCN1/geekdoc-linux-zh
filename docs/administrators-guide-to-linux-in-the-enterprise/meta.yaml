    ▶ **<Y> IP firewalling:** This option sets a Linux box as packet-filter firewall.


    If any computer on your network has multiple ports to the outside world, go to
    the Character Devices section and check off the following items:


    ▶ **<Y>/<M> IP Masquerading:** This option allows a computer to send information
    to the outside world by piggybacking on a firewall''s IP.


    +   ▶ **<y> Support for more than four serial ports**


    ▶ **<Y> Reverse ARP:** This function enables the Reverse Address Resolution Protocol
    (RARP). RARP is used by diskless clients and X terminals to inquire about their
    IP addresses.


    +   ▶ **<y>/<m> Cyclades multi-card mux support**


    +   ▶ **<y> Stallion multi-card serial support**


    Next, go to the Ethernet section and check off the appropriate software for your
    LAN cards. Or if you have ARCnet devices or token ring devices, check off the
    appropriate software for your cards.


    +   ▶ **<y>/<m> Stallion Easy IO or EC8/32 support**


    +   ▶ **<y>/<m> Stallion EC8/64 ONboard Brumby support**


