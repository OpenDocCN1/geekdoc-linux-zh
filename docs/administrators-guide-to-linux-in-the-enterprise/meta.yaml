    # Installing Slackware Linux


    You will need two formatted floppies to install Slackware Linux. Don''t trust
    factory formatting, since any defect in the formatting might sabotage the installation.
    To save time later, format the floppies yourself.


    Next, locate the RAWRITE.EXE utility in your distribution. Depending on how things
    are arranged, you might have to hunt around for this utility. I found it at <http://leb.net/pub/blinux/speakup/mirror.speakup_home/disks/slackware/slackware-7.1/bootdisks.144>.
    Using RAWRITE, you will want to create two disks; the first will be your boot
    floppy and the second will be your root floppy. To make the boot floppy, locate
    the boot image file bare.i (according to the Slackware Installation Help) and
    copy it to the boot floppy using the command:


    ```

    RAWRITE BARE.I    A:

    ```


    I am assuming that you found the image file in the FLOPPIES directory. Adjust
    this path to reflect the correct directory in the event that your version of Slackware
    doesn''t match. Similarly, create the root floppy using the command:


    RAWRITE COLOR.GZ    A:


    I have never encountered anyone who had trouble with the graphics in color.gz,
    but in case you do, you can retry using text.gz instead.


    Once you have these two disks prepared, you can reboot the machine with the boot
    disk inserted into the floppy drive.


    Once the two floppies have been created, you can insert the boot floppy into the
    floppy drive and then shut down Windows with the restart option. You might need
    to check your BIOS settings to make sure that your boot sequence starts with the
    A: drive. If this is not the case, then your system won''t boot from the floppy!
    Assuming we leap that hurdle, the system will present you with a boot: prompt,
    at which you will most likely just want to press [Enter]. In the event that you
    have special needs, read over the text on the screen and see if anything applies.
    I hope that, if you copied all the needed files into a Windows partition, you
    won''t need any special options. The system will soon prompt you to switch disks,
    and at that time, you can replace the boot disk with the root disk. After that,
    your system will come up with the slackware login: prompt. Just slightly above,
    it tells you that you may log in as root, so go ahead! Type root, press [Enter],
    and you will be sitting at the shell prompt, which is indicated by the # symbol.


    It''s show time now! From here, you can do many different things. One interesting
