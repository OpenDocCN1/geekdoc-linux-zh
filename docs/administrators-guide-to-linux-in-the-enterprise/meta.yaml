    2.2INCNAME2.1-50.1.10.in-addr.arpa

    .

    .

    49.2INCNAME49.1-50.1.10.in-addr.arpa

    50.2INCNAME50.1-50.1.10.in-addr.arpa

    1-50INNSh2o.phys.myuniv.edu

    ```


