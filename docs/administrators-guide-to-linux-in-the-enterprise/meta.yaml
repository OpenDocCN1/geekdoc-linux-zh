  md: "# **Listing B:** *The inetd superserver script*\n\n```\n# processname: inetd\n\
    # pidfile: /var/run/inetd.pid\n# config: /etc/sysconfig/network\nconfig: /etc/inetd.conf\n\
    \n# Source function library.\n. /etc/rc.d/init.d/functions\n\n# Get config.\n\
    . /etc/sysconfig/network\n\n# Check that networking is up.\nif [ ${NETWORKING}\
    \ = \"no\" ]\nthen\n    exit 0\nfi\n\n[ -f /usr/sbin/inetd ] || exit 0\n\nRETVAL=0\n\
    \n# See how we were called.\ncase \"$1\" in\n  start)\n    echo -n \"Starting\
    \ INET services: \"\n    daemon inetd\n    RETVAL=$?\n    \n    echo\n    [ $RETVAL\
    \ -eq 0 ] && touch\n    /var/lock/subsys/inet\n    ;;\n  stop)\n    echo -n \"\
    Stopping INET services: \"\n    killproc inetd\n    RETVAL=$?\n    \n    echo\n\
    \    [ $RETVAL -eq 0 ] && rm -f\n/var/lock/subsys/inet\n    ;;\n  status)\n  \
    \  status inetd\n    RETVAL=$?\n    ;;\n  restart)\n    $0 stop\n    $0 start\n\
    \    RETVAL=$?\n    ;;\n  reload)\n    killall -HUP inetd\n    RETVAL=$?\n   \
    \ ;;\n  *)\n    echo \"Usage: inet\n    {start|stop|status|restart|reload}\"\n\
    \    exit 1\nesac\n\nexit $REVAL\n```\n\ncompilation on *kernel-2.2.12-20* (Red\
    \ Hat 6.1). Issue the following command (unless you're in superuser mode):\n\n\
    ```\nsu root\n```\n\nThen issue these commands:\n\n```\ncd /usr/src/linux\nmake\
    \ xconfig\n```\n\nNext, go to the Network options and check off the following\
    \ items in order to set up a basic LAN:\n\n+   ► **<y> Packet socket:** This option\
    \ allows you to use *tcpdump*. It acts as an interface between the hardware and\
    \ the software.\n\n+   ► **<y> Routing messages:** This option allows you to read\
    \ network information, which could be useful for debugging purposes.\n\n+   ►\
    \ **<y> Network firewalls:** This option is a must if any computer in the network\
    \ has a firewall.\n\n+   ► **<Y> TCP/IP networking:** This option is absolutely\
    \ necessary in order for a TCP/IP network to work. If it is turned off, you will\
    \ have an IPX network.\n\n# **NOTE**\n\nIt is a common fallacy to assume that\
    \ out-of-the-box-Linux is a completely secure OS. Linux can be turned into a much\
    \ more secure OS than most others without the use of third-party applications.\
    \ One step toward that end is to comment out nearly (if not all) services in the\
    \ /etc/services file."
