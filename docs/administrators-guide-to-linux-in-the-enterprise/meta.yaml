    will resolve to 10.1.1.25, which points to *mail.myuniv.edu*. The final NS record
    in the database tells people who query 10.1.2.0-10.1.2.255 to send their queries
    to *h2o.phys.myuniv.edu* for the reverse resolution. The reverse resolution file
    on the primary DNS server should be named `/var/named/10.1.db`. That way, it can
    handle the *1.10.in-addr.arpa* domain. Of course, this method only works if you
