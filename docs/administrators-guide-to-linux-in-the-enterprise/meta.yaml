  md: '# Creating disks from within Linux


    Creating an installation disk within Linux depends on the *dd* command. The various
    types of installation floppies you''ll create are:


    +   - *Boot.img*—Needed when performing an installation from a nonbootable CD-ROM.

    - *Bootnet.img*—Needed when performing an installation via the network.

    - *Pcmcia.img*—Needed when performing a network installation on laptops.

    - *Rescue.img*—Needed for recovery.


    To create an installation disk, insert an empty floppy in the floppy drive and
    the Linux distribution CD in the CD-ROM drive, open up a console, and run the
    following commands (do not run anything preceded by #):


    ```

    #mount the cdrom

    mount /mnt/cdrom

    #change to the /mnt/cdrom/images

    # directory

    cd /mnt/cdrom/images

    #run the dd command on the specified

    # files

    dd if=image_file of=floppy_device

    ```


    Pay special attention to the *image_file* and *floppy_device* sections. Where
    you see *image_file*, you will insert the name of one of the specified installation
    floppies from above. For example, if you want to create a standard installation
    floppy for installing with a non-bootable CD-ROM, you''d run the command


    ```

    dd if=Boot.img of=/dev/fd0

    ```


    If you want to create an installation disk for installing over a network (with
    NFS, FTP, HTTP, etc.), you''d run the command


    ```

    dd if=Bootnet.img of=/dev/fd0

    ```


    To perform a network installation on a laptop, run the command


    ```

    dd if=Pcmcia.img of=/dev/fd0

    ```


    Finally, for a rescue disk you''d run


    ```

    dd if=Rescue.img of=/dev/fd0

    ```


    # Creating disks from within DOS


    Creating the above disks from within DOS is just as simple. You''d use the *rawrite.exe*
    command to create Linux installation/rescue disks from within DOS. The *rawrite*
    command


    comes with Red Hat, Mandrake, and many other distributions.

    The steps for creating installation/rescue floppies from within DOS are as follows:


    +   1. Insert the Linux CD.

    2. Insert a blank floppy.

    3. Open up a DOS prompt.

    4. Change to the *D:\dosutils* directory.

    5. Run the *rawrite* command.

    6. Enter the name of the file you want to create (from the list above).

    7. Enter the name of the floppy device (more than likely, this will be *a:*).


    The above steps are fairly simple. The biggest differences from creating such
    disks in Linux (other than being in a completely different environment) are:


    +   - The filenames (the names listed above) are in the *D:\images* directory,
    and the capitalization is different (generally, all characters but the extension
    are capped).

    - The floppy device is called *a:* as opposed to */dev/fd0*.


    So let''s say you want to create a *Boot.img* floppy from within DOS. You will
    *cd* into the *D:\images* directory and then run


    ```

    rawrite

    ```


    You will then be asked for a filename. At the filename prompt, type


    ```

    D:\images\BOOT.img

    ```


    Now press [Enter], and you will be prompted for the floppy device name. At this
    prompt, enter


    ```

    a:

    ```


    followed by [Enter].

    At this point, your floppy will be created (which takes only a matter of seconds).
    Once it is done, you can safely remove it (no *umount* necessary).


    # Conclusion


    With the above tools, you will be able to create an installation disk for most
    circumstances. Whether your only chance to create a boot disk is from DOS or whether
    you are preparing for things to come (such as a network installation or a total
    meltdown), these tools should aid you in your quest for a Linux installation.'
  merge: -1
  pgno: 49
- img_proc: false
  md: '# Try this helpful workaround for a Linux/Win2K dual boot


    By Mike Walton


    Well, you''ve gone and done it now. You thought ahead when installing Microsoft
    Windows 2000 Professional on your test machine, partitioning the hard drive so
    that you could put Linux on the same machine.


    Then you took your copy of Red Hat Linux 7.1 and installed it on the partition
    you created. When you got to the point in the installation where Red Hat asks
    you where to put LILO (the Linux loader), you just clicked through, allowing it
    to be put on the default—the master boot record (MBR) of the machine.


    But when you rebooted the machine after the Linux install, you had no way to get
    to your Windows 2000 Professional. The nice graphic list showed up, but the only
    choice on it was Linux. Whoops!


    Figure A


    ![](bbox=[0.45, 0.19, 0.95, 0.485])


    # Getting back to ground zero


    The problem is that the NT boot loader must reside on the MBR of the machine to
    boot either NT 4.0 or Windows 2000 Professional, which announces as it boots up
    that it''s built on NT technology.


    (It is recommended that you put whatever versions of Windows on the dual boot
    machine first and then install the Linux.)


    Here''s the good news: All you have to do is clear LILO out of the MBR, and you
    will have your Windows 2000 machine back. The bad news is that the location of
    LILO needs to be set at installation time, and if it gets wiped off the MBR, you''re
    going to have to reinstall Linux to make it work correctly.


    When you get to the LILO screen in the Linux Red Hat 7.1 installation (**Figure
    A**), you will have the option to install LILO on the first sector of the boot
    partition. Hopefully, when you partitioned your Linux partition, you made a boot
    partition (*`/boot`*) as is recommended during that part of the install.


    Also make sure that you click the button to make a boot floppy, which you will
    need later to start Linux because the NT boot loader is not going to show Linux
    in its list until after you complete the workaround.


    The easiest way to clear LILO out of the MBR is to find your old Windows 98 boot
    disk (or any boot disk that contains the *fdisk* utility). Booting from that boot
    disk, at the A: prompt, type:


    ```

    fdisk /mbr

    ```


    Now you can install Red Hat again, using the workaround below.


    When you get to the end of the Linux install, it is going to want to reboot the
    machine, so go ahead and insert the boot floppy you just made so the machine will
    boot from that.


    # The rundown on the workaround


    In our example above, everything was done as recommended except for the positioning
    of LILO during the Red Hat Linux installation.


    If your CMOS is set to boot from the disk before the hard drive, you should boot
    into Linux. If you installed GNOME, then you will probably boot into the console
    mode, which is fine. If you installed KDE, it may boot into the KDE desktop, but
    you can call up a terminal session from there as well.'
