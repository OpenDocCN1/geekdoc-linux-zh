  md: '# All the wonders of procmail, part 1


    By Jack Wallen, Jr.


    Imagine being able to configure your mail-processing agent on your own personal
    computer to do whatever you want it to do! Imagine being able to configure, with
    a simple file edit, autoreplying, autoforwarding, playing specific sounds, filtering,
    and many other actions. Now imagine which application can do this. And finally,
    imagine which operating system you must be using to have these awesome features!


    We''ll begin with the single-user *procmail* and eventually migrate to a more
    complex *procmail* system that will aid the administrator with such tasks as redirection
    of e-mail, notification of e-mail, autoresponding, and filtering.


    If you''re not familiar with *procmail*, you don''t know what you''re missing.
    *procmail* works in conjunction with your local Mail Transport Agent (MTA) as
    a local mail-delivery agent and a powerful filtering system. Say what? Okay, let
    me try to explain this one more time. Linux has various MTAs (*sendmail*, *fetchmail*)
    that go out, poll your configured mail server (or your ISP''s mail server), and
    bring your e-mail to your computer. Then the MDA (Mail Delivery Agent) takes the
    mail from where the MTA leaves off and drops it into your user-defined mailbox.
    (Imagine that the U.S. Postal Service is your MTA, your postal carrier is your
    MDA, and your postal carrier has permission to sort through your mail and remove
    all the junk you don''t want.)


    The *.procmailrc* file is made up of various *recipes* that pull off all the stunts
    that *procmail* is capable of achieving. Some of these recipes are simple, and
    some of them are complex. Regardless of the complexity of the recipe, there are
    commonalities throughout all of *procmail* that we''ll outline.


    # Writing procmail recipes


    *procmail* has two kinds of recipes: delivering and nondelivering. If a delivering
    recipe is found to match, *procmail* considers the mail delivered and will *cease*
    processing the *.procmailrc* file after having successfully executed that line
    of the recipe. If a nondelivering recipe is found to match, processing of the
    *.procmailrc* file will continue after the action line of this recipe has been
    executed. In other words, a delivering recipe ends the action on an e-mail, and
    a nondelivering recipe allows the action to continue.


    *procmail* does what it does (delivers your e-mail to your mailbox and filters
    out the unwanted) with such amazing flexibility that you could spend the rest
    of your computing life toying with its options and configurations. In this article,
    we''ll highlight some of the more useful options and help you create a highly
    personal and usable *procmail* recipe.


    The *.procmailrc* file is written in *sendmail.cf* syntax, so you can imagine
    the vastness of its capabilities. Within this section, I will enlighten you on
    some of the syntax necessary for *procmail* recipes.


    I like to look at the philosophy of creating *procmail* recipes in a very simple
    way: How do I want to act upon an incoming e-mail, and what key section of that
    e-mail will allow me to accomplish my goal? For this, you''ll want to look at
    an e-mail containing the following sections:


    # Recipe what?


    +   - Destination header (To, Cc, Bcc, etc.)

    - From header

    - Date header

    - Subject header

    - Body


    First of all, *procmail* uses an *rc* file (resource configuration) called *.procmailrc*
    that resides in either the user''s home directory or the */etc* directory. If
    there is no *.procmailrc* file in the user''s home directory, the application
    will default to the file in */etc*.


    Finally, you will want to look at *procmail* as having these basic actions:


    +   - Directing


    > NOTE

    Use caution when writing the global default file because it will be executed with
    root privileges.'
  merge: -1
  pgno: 212
- img_proc: false
  md: '+   - Redirecting

    - Filtering

    - Notification


    # Using expressions


    *procmail* uses standard *egrep* expressions. A regular expression is a pattern
    that describes a set of strings (a string is a sequence of characters) that are
    constructed similarly to arithmetic expressions. Regular expressions typically
    consist of smaller, singular expressions that use various operators to piece them
    together. *procmail* uses regular expressions to do such things as search a subject
    line for a string.


    Let''s use a very common example—spam. We all hate it, and we all want to do away
    with it. Within a GUI e-mail client, you can include keywords and keyphrases for
    the mail filters to search for and act upon. *procmail* does this exact thing
    by using expressions. For instance, you frequently receive spam with the subject
    "Make Money From Home." How do you filter this so that such a message will never
    appear in your inbox? With regular expressions, of course. Let''s look at a small
    section of code used to filter the subject line "Make Money From Home." The following
    section of code is where *procmail* scans the subject (another bit of code is
    used to act upon the mail should the subject match):


    ```

    * ^Subject:.Make Money From Home$

    ```


    Within the above snippet (from a *.procmailrc* file), we used a number of operators
    to put together a regular expression:


    +   - ▶ ^—Marks the beginning of a line.

    - ▶ .—Means any following character.

    - ▶ $—Denotes the end of a line.

    - ▶ ?—The preceding item is optional and will be matched at most once.

    - ▶ *—The preceding item will be matched zero or more times.

    - ▶ +—The preceding item will be matched one or more times.

    - ▶ {n}—The preceding item will be matched exactly n times.

    - ▶ {n,}—The preceding item is matched n or more times.

    - ▶ {n,m}—The preceding item is matched at least n times, but not more than m
    times.


    So you could look at the above snippet of code as two expressions pieced together,
    with operators, to form one phrase:


    +   - ▶ Subject:

    - ▶ Make Money From Home


    You could take this one step further and filter out any mail with a subject that
    contains any one of the words "Make Money From Home" with the following change:


    * ^Subject:\.Make|Money|From|Home$


    We''ve made the following additions:


    +   - ▶ \—Tells the condition to match *exactly* what follows as opposed to *any*
    that follow.

    - ▶ |—Can act as a standard Linux pipe symbol or as an *or* extraction operator
    (as in this *or* that *or* these or this | that | these).


    Also, *procmail* can use the following:

    - ▶ !—Forward to the specified e-mail address. (Be careful, because this can also
    mean *invert the condition*, depending on where and how it''s used.)

    - ▶ a*—Any sequence of zero or more *a*

    - ▶ a+—Any sequence of one or more *a*

    - ▶ a?—Either zero or one *a*

    - ▶ [^a-d]—Any character that''s not a *dash*, *a*, *b*, *c*, *d* or *newline*

    - ▶ (abc)*—Zero or more times the sequence *abc*


    > **NOTE**


    There are, of course, much more complicated (as well as powerful) means of filtering
    spam. Also note that the above expression will filter any message that has any
    combination of the words Make, Money, From, and Home within the subject.


    # Keywords and special characters


    Like most applications of this nature, *procmail* uses keywords and special characters
    to make life easier. Many of these keywords and characters should be obvious to
    catch as well as to use. Some examples are:


    +   - ▶ :0—Beginning of a recipe'
  merge: -1
  pgno: 213
- img_proc: false
  md: '+   - **:0:**—Beginning of a recipe that uses a lockfile (more on using lockfiles
    later)

    - **To**—Compare what''s in the e-mail''s *To:* field to the condition

    - **From**—Same as above but comparing the *From:* field

    - **Subject**—Same as above but comparing the *Subject:* field

    - **\/–**—Anything after this set of characters (a followed by a —not a capital
    v [V]) will be contained in the variable/keyword *SMATCH*. And *SMATCH* can now
    be used to create a filename (or whatever).

    - **^TO_**—A special *procmail* expression designed to catch an e-mail address
    (or the beginning of an e-mail address) that is in any destination header (To,
    Cc, Resent-To, etc.)


    Of course, there are a great many other keywords and metacharacters involved with
    *procmail*, but the above list will get us started.


    # The header


    I like to think of the first section of the *procmailrc* file as the header. This
    section of the file sets up the location of the user''s mailbox and the log file,
    as well as files set up for debugging purposes.


    This header section contains (but is not limited to) the following lines:


    ```

    SHELL=/bin/sh

    MAILDIR=$HOME/mail

    DEFAULT=$MAILDIR/username

    LOGFILE=$MAILDIR/log

    ##LOGABSTRACT=all

    VERBOSE=no

    ```


    These are the main entries for the header section:


    +   - **SHELL=/bin/sh**—Sets your shell (in this case to *bash*) to avoid unnecessary
    problems.

    - **MAILDIR=$HOME/mail**—Creates the default directory in which your mail will
    be stored. Typically, (but not necessarily), this is */home/USERNAME/mail*.

    - **DEFAULT=$MAILDIR/mail**—Sets the default inbox.

    - **LOGFILE=$PMDIR/log**—Sets the default location of the *procmail* log. This
    is typically set within the actual *procmail* directory.

    - **##LOGABSTRACT=all**—This is for debugging purposes. Remove the ## when you
    need more information for debugging.

    - **VERBOSE=no**—Again, this is for debugging. Set this option to *yes* when you
    need to debug a recipe.


    Other useful environment variables for the header section include:


    +   - **ORGMAIL=/path/to/system/mailbox**—Usually the system mailbox—if, for some
    reason, the mail could not be delivered, then this mailbox will be the last resort.

    - **LOCKFILE=/path/to/global/lockfile**—Global semaphore file (The use of a global
    lockfile is discouraged; whenever possible, use local lockfiles on a per-recipe
    basis instead.)

    - **TIMEOUT=x**—Number of seconds (x) that must pass before *procmail* decides
    that some child it started must be hanging. If *procmail* decides that a process
    has hung, then that offending process will receive a TERMINATE signal from *procmail*,
    and processing of the *rc* file will continue. If the number is zero, then no
    timeout will be used, and *procmail* will wait forever until the child has terminated.
    The default is 960 seconds.

    - **HOST**—Hostname of the machine

    - **NORERETRY**—Number of retries that are to be made if any process table full,
    file table full, out of memory, or out of swap space error should occur. If this
    number is negative, then *procmail* will retry indefinitely; if it is not specified,
    it defaults to four times.

    - **SUSPEND=x**—Number of seconds (x) that *procmail* will pause if it has to
    wait for something that is currently unavailable (memory, fork, etc.)—if it is
    not specified, it will default to 16 seconds.

    - **MATCH**—This variable is assigned by *procmail* whenever it is told to extract
    text from a matching regular expression. It will contain all text matching the
    regular expression that follows the \/ characters.

    - **INCLUDERC=/path/to/rc/file**—Names an *rc* file (relative to the current directory)
    that will be included here as if it were part of the current *rc* file.'
