    will discover a whole new virtual terminal. Press [Alt][F1] and you will be sent
    back to the original virtual terminal where you already logged in. This very nice
    feature allows you to display Slackware installation documentation in one virtual
    terminal while you perform the various tasks in the others. Log in on a second
    virtual terminal and then type the setup command. This starts the installation
    setup program. Next, select the HELP option to bring up the Slackware setup help.'
