    in the 192.168.10.0 network like this:


    ```

    route add -net 10.0.0.0 netmask

    255.0.0.0 gw 192.168.10.25

    ```


    This command tells the kernel to route all packets destined for the 10.0.0.0 network
    to 192.168.10.25, which it defines as a gateway. So now, by using the three route
    commands, your kernel will know where to send packets. In this situation, a few
