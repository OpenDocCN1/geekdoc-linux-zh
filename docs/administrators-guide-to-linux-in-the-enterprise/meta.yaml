    However, security still depends heavily on the person(s) configuring it. A well-configured
    Windows server is certainly more secure than a poorly or partially configured
    Linux server, and—let''s be honest—it''s much easier and faster to configure and
    lock down Windows NT/2000 than Linux. Nevertheless, as I mentioned above, if you
    have the time, inclination, and/or necessity for providing maximum security, it
