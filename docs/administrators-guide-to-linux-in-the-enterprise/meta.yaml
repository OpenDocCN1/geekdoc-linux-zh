  md: '# Evaluating Linux: Reality vs. hype


    By Jason Hiner, MCSE, CCNA


    I''m a huge fan of Linux. However, I certainly don''t want to oversell Linux.
    Linux continues to suffer from too much hype and exaggeration. My goal with this
    article is to help you sort out the real advantages and disadvantages of deploying,
    managing, and supporting Linux in a corporate environment.


    # Why Linux is getting so much attention


    A lot of the attention Linux has received in the last few years is based less
    on what Linux is and more on what Linux is not. Quite simply, Linux is not Microsoft.
    In fact, Linux might adequately be termed the antithesis of Microsoft.


    Microsoft and its products are centralized, polished (at least in terms of image),
    proprietary, user-friendly, and generally pretty expensive. Linux and its software
    products are decentralized (in most cases), open source, a little difficult to
    use, and generally quite inexpensive (at least up front).


    Much of the hype that swirls around Linux is centered on the hopes of many people,
    both within and outside the IT community, that Linux will help loosen Microsoft''s
    stranglehold on the software market. However, IT professionals seeking to deploy
    the best solutions based on sound business principles must cut through this hype
    when evaluating whether the OS meets the requirements of various situations.


    # The Linux security myth


    The first, and most prevalent, piece of hype I must dispel is the "Linux security
    myth." I have read a number of flawed and misleading arguments about Linux security.
    Many Linux enthusiasts assert that Linux is inherently more secure than Microsoft''s
    popular Windows NT/2000 platform. I strongly believe that argument is dead wrong,
    and I''ll tell you why.


    Arguments that use the example that Linux wasn''t hit by the ILOVEYOU virus to
    claim that it is not susceptible to these kinds of damaging activities are flawed
    arguments from a network security standpoint. It''s like saying, "Let''s go to
    the second floor of our glass house because the people outside are throwing stones
    only at the first floor right now." Eventually, they''ll start throwing stones
    upstairs, too, and eventually, hackers and virus writers will start targeting
    Linux. Suggesting that a switch to Linux will keep your organization out of harm''s
    way is a temporary solution, at best, and is not a good security strategy.


    No operating system is *inherently* secure, with the possible exception of something
    like Trusted Solaris, which is built entirely around security in order to serve
    the needs of government contractors and high-security industries. The security
    of most operating systems (including Trusted Solaris, to an extent) depends heavily
    on the configuration of the administrators who design, implement, and manage them.


    Linux enthusiasts often point to the fact that Redmond is continually releasing
    new patches for Windows as an indicator that Microsoft products are less secure.
    However, these numerous flaws are found because of the sheer numbers of administrators,
    security experts, and hackers that put Windows under the microscope every single
    day.


    That''s not to say that Microsoft should not make security a higher priority in
    its development efforts. Obviously, it should. But putting Linux under the same
    microscope reveals a plethora of security flaws, too, as evidenced by the fact
    that companies such as Red Hat are also continually releasing security patches
    to their Linux distribution.


    In defense of Linux security, I will side with Linux partisans in agreeing that
    an administrator can more thoroughly lock down a Linux system than a Windows NT/2000
    system because of the open source nature of Linux and the fact that you can get
    in and look at every aspect of a Linux system—something that it is not susceptible
    to these kinds of damaging activities are flawed arguments from a network security
    standpoint.'
  merge: -1
  pgno: 12
