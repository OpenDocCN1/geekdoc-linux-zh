  md: '# An overview of Qmail, part 2: Configuring Qmail


    By Vincent Danen


    In "An overview of Qmail, part 1: Installing Qmail," I explained how you could
    install Qmail, a Mail Transfer Agent (MTA) that provides POP3 and SMTP services
    for your Linux server. (It is very similar to *sendmail* or *postfix*.) I told
    you how to change your system so that you could use Qmail''s maildir format instead
    of the traditional mailbox format that most MTAs use. In this article, I''ll examine
    some configuration options, and I''ll give you some tips that will help you get
    the most out of your new Qmail setup.


    # Hard or soft error in qmail-pop3d.init


    First, let''s discuss a particular problem with the POP3 server. Depending on
    your system and setup, users may not be able to read their e-mail via POP3 on
    your system. If not, Qmail will report a variety of different error messages to
    the e-mail client. I experienced this very frustrating and time-consuming problem
    after installation.


    When you run the POP3 server startup script */etc/rc.d/init.d/qmail-pop3d.init*,
    it may report a hard or soft error before the daemon starts. Usually, this error
    is associated with *dnsfq*, a program that Qmail calls in order to determine your
    host information. To check for errors, this program performs a reverse lookup
    on your IP address. Since many hosts on the Internet perform reverse lookups before
    connecting to another host, Qmail tries to determine whether or not doing so will
    cause a problem for you. If some hosts can''t perform a reverse lookup, they''ll
    refuse to connect to your host. If the reverse lookup doesn''t work, then you
    probably have an issue with your ISP or with your own DNS server (if you''re running
    one). On the other hand, many hosts will perform a reverse lookup based on your
    domain name instead of your IP address; if so, the reverse lookup probably will
    be successful. This problem isn''t critical, and you can solve it easily.


    Take your favorite editor and edit the */etc/rc.d/init.d/qmail-pop3d.init* file.
    In this file, you''ll find a line that is similar to the following:

    `HOST=$($QMAILHOME/bin/dnsfq $($QMAILHOME/bin/hostname))`


    Simply comment out that line and add this new line (where *myhost.com* is the
    fully qualified domain name for your server):

    `HOST=myhost.com`


    Restart the POP3 server by issuing:

    `/etc/rc.d/init.d/qmail-pop3d.init restart`


    Now, you shouldn''t see any more hard or soft error messages at startup. If you
    attempt to connect to the POP3 server in order to read your e-mail, you shouldn''t
    have any problems.


    # Forwarding e-mail to another host


    By default, Qmail will only accept e-mail for its own domain and for any defined
    virtual domains. With some configuration settings, however, you may need to forward
    e-mail that you receive on your system to another internal server or to a completely
    different host. To enable Qmail to forward e-mail to another host machine or SMTP
    server, you must edit two configuration files in your */var/qmail/control* directory.
    First, you must edit the *rcpthosts* file, which contains a list of the domains
    for which Qmail will accept mail. For example, if your domain name were *mydomain.com*
    and you provided Web hosting services for *otherdomain.com*, both domain names
    would point to your server because of the Web hosting. However, suppose that *otherdomain.com*
    wanted to handle its own e-mail directly with its own SMTP server. You still need
    to handle the Web hosting, so *otherdomain.com* still needs to point to your server.
    But you also need to receive mail for *otherdomain.com* and forward it to another
    host. At the end of the */var/qmail/control/rcpthosts* file, add the following
    line:

    `otherdomain.com`'
