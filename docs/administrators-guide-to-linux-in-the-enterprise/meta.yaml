    prior to the `grub>` prompt. This tells GRUB to use the file `/boot/grub/messages`,
    located on the first partition on the first hard drive (hd0,0).


    The *password* keyword defines the password required to start any interactive
    operations, such as editing menu entries and entering the command-line interface.
    In this fashion, you can prevent GRUB from doing anything other than starting
    the default operating system without the password, but you will need to use the
    *lock* keyword as we see in the second image (in the above configuration example).
    The *lock* keyword tells GRUB to only boot that image if a valid password is entered.


    The *title* keyword starts an image definition. The first image we define, which
    we also have set to our default, is *Linux*.


    The *kernel* keyword defines the kernel image to load and all other kernel options.
    Where LILO uses a number of entries to specify all of this information, GRUB uses
    a single line. The first part determines the location of the boot image. In this
    case, we are using `/boot/vmlinuz`, which is located on the first partition of
    the first hard drive. If boot is located on a different partition, say `/dev/hde5`,
    you would use (hd0,4) to tell GRUB to use the fifth partition of the first hard
    drive. Finally, you tell it the root directory to use, `/dev/hde1`, the initrd.img
    file to use, `/boot/initrd.img`, and the appended


    options, which in this case is `hdb=ide-scsi`, to load the ide-scsi module for
    our CD-RW. In the above example, the lines have wrapped; they are in fact all
    on the same line.


    There are a few more options you can set to fine-tune GRUB, and browsing the *info*
    pages will give you that information. Type `info grub` to obtain detailed information
    about GRUB. But this should be enough to get you started.


    # Writing changes


    Finally, to write your changes to the MBR, simply run


    `grub`


    as root. You will then be given a `grub>` prompt. Now you need to enter a few
    commands to install GRUB into your MBR.


    `grub> root (hd0,0)`


    This tells GRUB where the root device is located. In our case, `/dev/hde1` is
    where our `/boot` partition is located, and thus our GRUB stage1 file, so we use
    (hd0,0). Next, you need to actually install GRUB into the MBR by using


    `grub> setup (hd0)`


    After this command is completed, GRUB will tell you if it was successful or not.
    You can now reboot and GRUB will be your default boot loader.'
