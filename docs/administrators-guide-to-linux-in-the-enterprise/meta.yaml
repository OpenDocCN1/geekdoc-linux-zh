  md: "```\n# Basic system aliases - these MUST\n# be present.\nMAILER-DAEMON:   postmaster\n\
    postmaster:       root\n\nMany times, you'll add an entry to have\nroot's mail\
    \ forwarded to an administrator's\naccount:\n\n# Person who should get root's\
    \ mail\nroot:             stew\n\nOften, you may want to create an alias for a\n\
    group of people:\naccounting:  greg, shirly, ashley\n\nNewaliases is a symbolic\
    \ link to /usr/sbin/\nsendmail. Running it will notify sendmail of your\nchanges.\n\
    ```\n\nThe format of the aliases file is the same format used for many of the\
    \ database lookup tables for sendmail. Entries on the left are matched with those\
    \ on the right. Sendmail either replaces instances of the left-hand side entry\
    \ with the right-side data or treats such entries according to rules on the right-hand\
    \ side.\n\nThat about does it for installation. If you've followed all the steps\
    \ correctly, you should be able to start up your new sendmail binary:\n\n```\n\
    [root@omnibook /root]# /etc/rc.d/init.d/sendmail start\nStarting sendmail:   \
    \            [  OK  ]\n```\n\nIf you take a look at /var/log/messages, you should\
    \ see something like **Listing E**.\n\n# Testing sendmail\n\nYou can try to telnet\
    \ into port 25 and see the daemon at work in **Listing F** (provided you haven't\
    \ disabled telnet and replaced it with ssh).\n\nAnd you can try sending yourself\
    \ some mail:\n\n```\n[stew@omnibook stew]$ mail stew\nSubject: test\ntest\n\n\
    Cc:\n.\n```\n\nIf things are set up correctly, you should find the test message\
    \ in your favorite mail program's inbox.\n\nIf you should notice a long delay\
    \ in starting sendmail or checking the queue status with mailq, there is probably\
    \ something wrong with your host name setup, and sendmail is trying to find out\
    \ the local host name.\n\n# Other options\n\nThat's it for the basics. Let's go\
    \ back and look at some of the options available when starting up sendmail. Like\
    \ most UNIX command-line programs, sendmail accepts a number of switches that\
    \ affect its behavior:\n\n+   - **-d** — Debugging mode: The \"d\" is to be followed\
    \ with various numbers to change the debugging level by category and level. With\
    \ no options, the default is 0-99.1, which outputs debugging data for all categories\
    \ at level 1.\n- **-v** — Verbose mode: Sendmail will output additional information\
    \ when running.\n- **-q** — Process the mail queue: This is especially useful\
    \ if you are on a dial-up and have sendmail configured to hold mail until explicitly\
    \ told to process it. This can also include a code to tell sendmail to process\
    \ the queue at a regular interval (q1h = hourly).\n- **-bd** — Run in daemon mode\n\
    - **-bt** — Run in address testing mode\n- **-n** — Don't use the aliases file\n\
    - **-Xfile** — Log all mail traffic in the specified file (useful for debugging)\n\
    - **-Cfile** — Use an alternate configuration file\n\nThere are many more. The\
    \ sendmail man page covers them in more detail.\n\nMany systems will run sendmail\
    \ from its startup script with the -bd and -q options only; it'll look something\
    \ like\n\n```\n/usr/sbin/sendmail  -bd  -q15m\n```\n\nwhich means run as a daemon\
    \ and deliver mail every 15 minutes.\n\nSince I mentioned the case of a system\
    \ not connected to the Internet at all times, let's quickly touch on how you would\
    \ set this up. We would still like local mail to be delivered immediately, but\
    \ we want sendmail to queue up all mail to addresses outside of our network until\
    \ explicitly told to deliver it. We'll need to add some entries to our .mc file:\n\
    \n```\ndefine('confCON_EXPENSIVE', 'True')\ndefine(SMTP_MAILER_FLAGS, e)\ndefine('SMART_HOST',\n\
    \    'smtp.myisp.com')\n```"
