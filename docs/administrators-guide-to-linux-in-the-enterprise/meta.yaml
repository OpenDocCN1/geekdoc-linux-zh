    # System accounting in Linux


    *By Jim McIntyre*


    The ability to monitor user activity on a Linux system is one of the first skills
    a Linux administrator should master. This ability often provides a first line
    of defense in discovering unauthorized activity. This article discusses the monitoring
    tools that are available as part of the Linux operating system, and demonstrates
    how to employ system accounting procedures to enhance system security.


    # Connection accounting


    Connection accounting is the process of tracking current user logins and logouts.
    Connection accounting on a Linux system is managed through the following utilities:


    +   - **dump-utmp**—Converts raw data from */var/run/utmp* or */var/log/wtmp*
    into readable ASCII text. Best suited for use in scripts.


    +   - **ac**—Reads */var/log/utmp* and outputs user connect time in hours. The
    default is a summary for all users.


    +   - **last**—Shows a list of last logged-in hours. Provides more detail than
    the *ac* command.


    +   - **who**—Shows currently logged-in users. Reads */var/log/utmp* file.


    +   - **utmp**—Used to log active user sessions.


    +   - **wtmp**—Used to record login and logout activity. The *wtmp* utility also
    records system reboots and run-level changes.


    Several programs are involved in providing information related to connection accounting.
    This eliminates the need to run a specific daemon to initiate connection accounting.
    However, the following files must exist on your system:


    +   - **/var/run/utmp**—Contains all data associated with *utmp*.


    +   - **/var/log/wtmp**—Contains all data associated with *wtmp*.


    If these files don''t exist on your system, the following commands will create
    them:


    ```

    touch /var/run/utmp

    touch /var/log/wtmp

    ```


    These files are owned by root, and the file permissions should be set to 644 (rw-r--r--).'
