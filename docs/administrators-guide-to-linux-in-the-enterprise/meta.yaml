  md: 'address (we''re going to use *you@mailaddy.com*) and keep a copy of it in the
    local default mailbox. The first thing we''ll do is create the two action sections
    for this recipe, and then we''ll piece them together.


    The first section is the remailing section, and it looks like this:


    ```

    :0 c

    ! you@mailaddy.com

    ```


    What will be unfamiliar in the above section is the *c* flag in the first line.
    The *c* flag tells *procmail* that we''re making a carbon copy of the e-mail.
    Also possibly unfamiliar (although mentioned earlier) is the */* character, which
    can hold two different meanings. Within a condition, the */* character means to
    invert the condition (or not). Within an action line, the */* character means
    to forward to the specified e-mail address.


    Before we add the new section, let''s put our improved recipe together:


    ```

    :0

    * ^TO..*me@mailaddy.com

    :0 c

    ! you@mailaddy.com

    ```


    Now you have a recipe worthy of building upon.


    The final step in this recipe is to add in the section that will send a copy of
    the mail to the default inbox. To do this, however, we have to know how to enclose
    both of our new action statements within braces, {}, so that *procmail* knows
    that both action statements are to be used within the same recipe.


    The section we''re now going to add is very simple:


    ```

    :0

    /path/to/mail/directory

    ```


    Please keep in mind that, in the above section, you''ll be using your own user
