  md: '# User administration in Linux


    *By Jim McIntyre*


    Two of the most important responsibilities of any administrator are the administration
    and monitoring of users on a Linux network. Good foresight on the part of a system
    administrator will prevent unnecessary downtime and will uncover security holes
    before they become a problem. In this article, I''ll discuss adding, modifying,
    or deleting user and group accounts with command line tools, and I''ll talk about
    creating root or privileged user accounts.


    # Managing users with command line tools


    # Creating a user


    You can create a new user very easily. At the command line, just type:


    ```

    useradd <username>

    ```


    To create a new user with the username guest, run:


    ```

    useradd guest

    ```


    If you see the prompt "command not found," type */usr/sbin/useradd guest*. If
    you still get the same prompt, type *which useradd* in order to locate the useradd
    program. Now type:


    ```

    useradd guest

    ```


    This command will use system defaults to create a new line in the */etc/passwd*
    file. When I ran the command, */etc/passwd* showed the following new line:


    ```

    guest:x:501:501:anybody:/home/guest:/bin/bash

    ```


    Look at the second field from the left. The only character it will contain is
    an x because it is the password field. To create a password for the user guest,
    run the following command:


    ```

    passwd guest

    ```


    On my system, I entered the word *guest* for both the username and its password.
    The *passwd* command will ask you to enter the password twice. After the password
    is accepted, it''s encrypted and added to the user''s line in */etc/passwd*.


    # IDs


    The *useradd* command will create the User Identification (UID) and the Group
    Identification (GID) automatically. To illustrate what happens, let''s examine
    my */etc/passwd* file.


    ```

    root:x:0:0:root:/root:/bin/bash

    bin:x:1:1:bin:/bin:

    daemon:x:2:2:daemon:/sbin:

    adm:x:3:4:adm:/var/adm:

    lp:x:4:7:lp:/var/spool/lpd:

    sync:x:5:0:sync:/sbin:/bin/sync

    shutdown:x:6:0:shutdown:/sbin:/sbin/shutdown

    halt:x:7:0:halt:/sbin:/sbin/halt

    mail:x:8:12:mail:/var/spool/mail:

    news:x:9:13:news:/var/spool/news:

    uucp:x:10:14:uucp:/var/spool/uucp:

    operator:x:11:0:operator:/root:

    nobody:x:99:99:Nobody:/:

    xfs:x:100:102:X Font Server:/etc/X11/fs:/bin/false

    gdm:x:42:42::/home/gdm:/bin/bash

    jim:x:500:500:Jim McIntyre:/home/jim:/bin/bash

    guest:x:501:501:anybody:/home/guest:/bin/bash

    ```


    The fields with which we''re concerned are the first line and the last two lines.
    The first line is for the root user (or superuser). A root user is mandatory for
    Linux. This user is created during the installation process, and the person who
    performs the install supplies the password. The root UID and GID is always 0,
    and the default group for root is always 0.


    Now, look at the last two lines in the file. The user jim was created as soon
    as I finished installing Linux. The first field is the username; the second field
    is the password field. You''re probably wondering why there''s an x in the password
    of the password field instead of a combination of letters and numbers. The x appears
    because I''m using a process called password shadowing. You should use this process,
    too. (We''ll discuss how to shadow passwords later. For now, let''s concentrate
    on */etc/passwd*.) Exclamation'
