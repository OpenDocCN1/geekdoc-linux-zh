    You must make two changes to enable IP forwarding:


    There are five steps in configuring a network to work with a Linux gateway:


    +   1. Enable IP forwarding in the Linux kernel on the gateway computer.

    2. Configure the gateway computer.

    3. Configure IP masquerading on the gateway.

    4. Configure the host computer(s).

    5. Test the network.


    +   6. Go to the Networking Options menu and select IP: Advanced Router.

    7. Go to the Filesystems menu and select Support For /proc Filesystems.


    After choosing these options, you''ll need to recompile the kernel. Reboot with
    the new kernel configuration, then run the two commands mentioned earlier to confirm
    that IP forwarding is enabled and to enable IP forwarding if necessary.


    # Step 1: Enabling IP forwarding


    # Step 2: Configuring the gateway


    The IP forwarding process enables a gateway to send, or forward, IP packets to
    destination IP addresses on another network. This ability is required whether
    the destination address is located within the same office building or on a network
    a continent away.


    To configure a Linux server as a gateway, IP forwarding support must be built
    into the kernel. To determine whether IP forwarding is enabled or not, run the
    command


    cat /proc/sys/net/ipv4/ip_forward


    If the output is 1, IP forwarding is enabled; if the output is 0, IP forwarding
    is not enabled. If the output is 0, run the command


    echo 1 > proc/sys/net/ipv4/ip_forward


    Then run


    cat /proc/sys/net/ipv4/ip_forward


    again. If the answer this time is 0, you''ll need to recompile the kernel with
    support for IP forwarding. This is accomplished with the following commands:


    An IP address gives a network, a network server, or a network host a unique identity.
    There are three blocks of reserved IP addresses. These addresses may be used on
    a private network, but because they are non-routable addresses, they are invisible
    to the Internet. The three groups of nonroutable IP addresses are shown in **Table
    A.**


    For this article, we''ll be using the network address 10.28.3.0 for the local
    network and the address 192.168.1.21 for the gateway supplied by the ISP.


    The first network interface we''ll configure is the interface that forwards IP
    packets. To configure this interface using a text editor, the following steps
