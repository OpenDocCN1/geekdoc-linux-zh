    Ultimately, my goal here has been to dispel the myth that Linux is *inherently*
    more secure than Windows NT/2000 because, clearly, it is not. That being said,
    I think we''re ready to have a sane look at some of the areas where Linux has
    considerable value, as well as some of the penguin''s drawbacks. **Figure A**
    shows a rundown of the Linux pros and cons that we''ll be discussing.


    and-true methods of turning big profits in the software industry is by requiring
    a paid license of your software for each machine on which it is loaded (see Microsoft
    Corp.). Linux flies in the face of this trend by not requiring a paid license
    for using the operating system.


    For example, you can buy one Red Hat Linux CD and use it to load Linux on 100
    servers. You do not owe Red Hat any additional money and you are still legally
    within the terms of the General Public License for Linux. If you had decided to
    load Windows 2000 on those 100 servers, it would have cost you in the neighborhood
    of $75,000—if you took advantage of one of Microsoft''s volume discount programs.
    Obviously, this factor alone can make Linux very attractive.


    Actually, in a situation such as this, Linux can save you even more than the cost
    of the licenses because the hardware requirements for Linux are significantly
    less than those for Windows NT or 2000 for accomplishing the same tasks. For example,
    whereas a Windows 2000 server really requires a minimum of 256 megabytes of RAM
    to accomplish basic file and printer sharing, a Linux server can offer comparable
    performance when handling the same tasks with 64 to 128 megabytes of RAM.


    # Figure A


    # Linux advantages


    +   ▶ No licensing fees


    ▶ Most server software is stable and reliable


    ▶ Requires minimal hardware resources


    ▶ Open source allows for greater security


    # Linux disadvantages


    +   ▶ Supporting it is expensive


    ▶ Troubleshooting is difficult


    ▶ Configuration is complicated and time-consuming


    ▶ Desktop software is unstable and buggy


    # Deployment and support


    Another one of the most widely extolled virtues of Linux is its stability. Once
    you get Linux properly configured—a task that''s not for the faint of heart or
    the inexperienced—you can definitely reap the benefits of excellent stability.
    I have heard enough stories from other administrators about Linux Web servers,
    DNS servers, and firewalls that were configured and then not touched again for
    over a year to believe fully in the stability of Linux. I can also personally
    vouch for the Linux firewall on my network, which has been running without a hitch
    for four months, and a Linux Web server I helped set up that ran uninterrupted
    for over six months.


    However, this stability does not come without a price. Setting up and configuring
    any kind of server functionality on Linux takes considerable effort and often
    an initial period of trial and error in order to make it work. I


    # A look at the true costs


    You can''t talk about the advantages of Linux without talking about dollars (or
    whatever your national currency may be). One of the tried-'
