    # The ac command


    The *ac* command provides statistics on user connections. A typical use for the
    *ac* command would be to check the amount of time each user has spent logged into
    the system.


    Although limited, the *ac* command does provide some useful information related
    to intrusion detection. For example, if I run the *ac* command and I see that
    user Susan has spent several hours logged in the last two days, when I know Susan
    is on vacation, I have an indicator that someone may be using Susan''s account
    to gain unauthorized access to the system.


    # The last command


    The *last* command provides per-user login and logout times, as well as information
    on system reboots and run-level changes. By default, *last* will display every
    connection and run-level change recorded in `/var/log/wtmp`. The amount of information
    presented by the *last* command can be overwhelming. A more typical use for the
    *last* command would be to run the command `last -5`. This would provide the five
    most recent entries in `/var/log/wtmp`.


    The important point to note here is that the *last* command not only shows who
    has been logged into the system, but also when they logged in, for how long, and
    from where they logged in. This information can be used to identify unauthorized
    activity on your system. For example, if the `last -5` command showed that Susan
    had logged into the system after working hours, this could be an indication that
    someone else was using a legitimate user account to access the system. The administrator
    could then disable the account, to prevent it from being used for further access,
    prior to performing a more thorough security analysis. Running the command `last
    -x` will tell you about run-level changes on your system.


    The *last* command can provide an administrator with clues about suspicious activity.
    Unexpected logins, unauthorized run-level


    changes, and system crashes can all be detected using this utility. As a system
    administrator, running the *last* command on a daily basis will allow you to spot
    unusual activity as you become more familiar with user activity on your network.


    # The who command


    The primary purpose of the *who* command is to report which users are currently
    logged into the system. The *who* command can provide the following information:


    +   - Which device a user is logged in from.

    - Where the login occurred.

    - The hostname if a remote login is used.

    - The X display if X windows is used.

    - Whether or not the user will accept write or talk messages.


    The command `who -wH` will provide the user''s ID, the idle time for the user,
    the write or talk status, and a printed header.


    The value of using the *who* command is that the administrator gets a snapshot
    of current user activity on the system. This command is often the administrator''s
    first line of defense in detecting suspicious activity on a Linux system.


    # The lastlog command


    Another command used for connection accounting is the *lastlog* command. The *lastlog*
    command reads the `/var/log/lastlog` file to produce a record of the last time
    a user logged in. While this command is limited in its flexibility, *lastlog*
    provides a quick way to check user activity or spot unusual login times or users
    who are not known to the administrator. The *lastlog* command is useful for spotting
    unusual login activity on a Linux system.


