  md: 'hosts and network files. I''ll show you how to configure and route through
    a gateway.

    The first step is to choose an IP from your own country''s NIC center. There are
    six classes of networks:


    +   - **Class A:** Networks ranging from 1.0.0.0 to 127.0.0.0

    - **Class B:** Networks ranging from 128.0.0 to 191.255.0.0

    - **Class C:** Networks ranging from 192.0.0.0 to 223.255.255.255

    - **Classes D, E, F:** Networks ranging from 224.0.0.0 to 254.0.0.0


    For the sake of argument, let''s suppose your company will go with a Class C network.
    Your NIC gives you the IP range of 192.23.1.0 to 192.24.1.0. The subnet mask is
    255.255.255.0.

    Next, you will have to subnet the IP range. Then, you must set up the /etc/host
    file. The file looks like **Listing D**.

    Hostnames may be Fully Qualified Domain Names (FQDNs) or relative to the local
    domain. Next, add the following line to the /etc/host.conf file:


    ```

    order hosts

    ```


    In this fictitious company, there are subnets. So, to the file /etc/networks we
    add the following:


    ```

    #/etc/networks for the linux_stuff company


    tech-support-net     192.23.1.0

    customer-support-net 192.23.2.0

    research-net         192.23.3.0

    ```


    It is important to have different IP addresses for the networks and hosts; problems
    can occur if the addresses are the same.

    After you''ve set up these files, you must connect the interfaces. You can use
    *ifconfig* and *route*, or you can use *Linuxconf*. I''ll discuss two types of
    setups: single-interface setups and multiple-interface setups.


    # Single-interface setup


    In the single-interface setup, we''ll connect one *eth0* interface to one network
    and many hosts. In the multiple-interface setup, we''ll connect multiple interfaces
    (*eth0, eth1, ppp0, ppp1*) to many networks and many hosts.

    For a single-interface setup, we''ll first connect the loopback device. At the
    prompt, type:


    `ifconfig lo 127.0.0.1`


    This corresponds to the first line in the /etc/hosts file.

    Next, connect the Ethernet interface to the network. To connect to the Ethernet
    interface, type:


    `ifconfig eth0 store`


