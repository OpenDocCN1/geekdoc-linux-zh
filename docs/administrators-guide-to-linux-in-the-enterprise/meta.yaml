    with *msg* (in order of modification times), pipe the listed files to the *sed*
    command, and delete all but 1 through 32.


    With these backup recipes in place, you''re ready to begin experimenting with
    your first recipes.


    # Redirecting e-mail


    The first of the delivering recipes we are going to look at is an obvious one,
    I hope. This recipe simply receives an e-mail and then bounces it to another address
    (deleting the original address from the receiving account). This can be accomplished
    with (what was outlined above)


    ```

    :0

    ! xxxxxxxxxx . xxx

    ```


    which will then redirect all e-mail to the address defined in the xxxxxx@xxxx.xxx
    space. The above recipe consists of only an action (which is to redirect all e-mail).
    We''ll build on this recipe by adding a condition that will examine a specific
    portion of the e-mail and, if the condition is met, act upon it.


    For our example, let''s say that you want every e-mail sent to you from the e-mail
    address *fiancee@herhome.com* to be redirected to a personal account, *fiance@myhome.com*.
    The first thing you have to do is check any incoming mail for an address match
    with the following condition:


    +   * `^FROM.*fiancee@herhome.com*`


    With the above condition in place, only those e-mails coming from the specified
    address will be redirected. Of course, like almost every Linux application and
    command, this can be modified to suit many needs. Say, for instance, that you
    wish to send all e-mail coming from a certain domain (we''ll use *thisdomain.com*)
    to another address. To do this, you would alter the above condition to


    +   * `^FROM\/.+@thisdomain.com*`


    which will redirect any e-mail coming in from *thisdomain.com* to the configured
    target address. Notice the difference between the two conditions: The first contains
    the entire e-mail address you wish to redirect, and the second contains only the
    @ and the domain name.


    What is critical within the new condition is the addition of `\/.+`, which says
    that the *exact* string will be matched one or more times.


    # NOTE


    Make sure that you are using the \ followed by the / and **not** a capital v (V)
    in the above condition.


    # One step further


    Okay, so you have your basic redirecting recipe that takes all e-mail from a certain
    source and sends it on its way to another. Let''s say that you want to keep a
    copy for yourself. How do you do it? Very simple.


    To keep a copy of the redirected e-mail, you need only add on to the current working
    recipe. The addition can be as simple as writing another action section; however,
    we are going to make the current recipe a bit more standard and stable.


    Remember from above that we have only two lines. The first line indicated that
    a new recipe was beginning, and the second was the actual recipe. The problem
    with this recipe is that it is very nonspecific. We don''t like that. What we
    want to do is make our recipes as specific as we can, and we can do this by using
    the tools we already have.


    Instead of creating a recipe that says (basically) "take all incoming mail (regardless
    of address) and send it to X," we want to say something more specific like "take
    all mail addressed to X and send it to Y." This method will certainly take you
    further in your trek with *procmail*. So, let''s implement it!


    The first section of our pseudo code, "take all mail addressed to X," can be handled
    with the following condition (using *me@mailaddy.com* for the incoming e-mail
    address):


    +   * `^TO.*me@mailaddy.com`


    The above condition is fairly complete, but we''re not finished yet. Remember
    that we have to begin this with the :0 characters, so now our new recipe, so far,
    looks like this:


    ```

    :0

    * ^TO.*me@mailaddy.com

    ```


    Now you''re one step closer to a better recipe. The next step is to add the action
    lines that will mail a copy of the e-mail to another'
