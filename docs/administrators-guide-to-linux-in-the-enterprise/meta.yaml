  md: 'consider when evaluating Linux for your enterprise.


    # Expect to hire a specialist


    Technically, you can download free versions of Linux. But running a free version
    of any OS is futile unless you know how to use and support it.


    To fully unleash Linux''s potential, you''ll need someone in-house with the expertise
    to manipulate the Linux kernel code. If you and your staff lack Linux experience,
    be prepared to hire someone who is a Linux specialist. Retraining current staff
    with a course or two simply isn''t a viable option with Linux, explained Jim Wildman,
    founder of Rossberry Consulting, a consultancy specializing in open source solutions
    and UNIX system administration.


    "You can''t learn it by taking a course," Wildman said. "You have to live it for
    a while. You have to understand how it works."


    Stacey Quandt, associate analyst with the Giga Information Group, recommended
    that you look for someone with UNIX or Linux experience. For many IT managers
    with tons of Microsoft-certified staff, that''s the bad news. The good news is
    that you may find a qualified candidate with Linux experience by hiring someone
    straight out of school, Quandt said.


    "The best and brightest university graduates are using Linux and want to work
    for companies who are using cutting-edge technology," said Quandt.


    Being careful of who you hire to maintain the Linux OS is a sure way to avoid
    a bad experience, according to Russ Herrold, founder of the Owl River Company,
    a consultancy specializing in systems analysis and administration, network design,
    and open source solutions.


    "Don''t hire Joe Linux user who just wandered in from the street and just graduated
    from high school and expect to get a professional product," Herrold advised.


    # Support and maintenance issues


    If you want structured support, buy Linux from a Linux vendor like Red Hat or
    Caldera. Since free versions of Linux exist, vendors usually offer their versions
    at reasonable prices.


    According to Gartner, in May 2001, the price for Linux ranged from $0 to $150.


    There are ways to receive help if you don''t buy a version of Linux or other support
    services. There are many Linux-based Web sites that announce bug fixes and virus
    alerts daily. The Linux community is tight-knit and if you look, there are many
    free user groups you can join. You can also buy support from third-party organizations.


    Whether you buy a version or choose a free version, be sure to document any changes
    made to the kernel. Since the kernel can be manipulated by those with the correct
    authorization, your staff can waste time trying to maintain the OS if they don''t
    know what other team members have changed.


    Tom Rule, an IT support technician and full-time computer skills teacher for the
    Mount de Sales Academy in Macon, GA, knows firsthand the importance of documentation.


    "We had a student who did a lot of the [Linux] research. We had a very nonstandard
    installation of Linux, and the student who set it up wasn''t a believer [at the
    time] in documenting what he did. Now we''ve spent a lot of time trying to figure
    out where things are and how to fix them," said Rule.


    # Savings on equipment


    When you''re weighing the costs of a Linux solution, be sure to factor in hardware,
    since Linux can help you realize savings by allowing the use of older hardware.


    "The capability to run on aging hardware is especially appealing to end-user organizations,
    effectively extending the life of an old x86 PC or ancient RISC workstation that
    would otherwise be destined for the garbage heap," said Gartner in a recent report
    on Linux.


    Finding new uses for old systems is a great way to stretch your budget.


    "You have to ask yourself, can I reuse older hardware to get through an economic
    downturn?" said Herrold. Linux can help you do that, he added.


    Rule agreed.


    "Linux has also been good for us because it has allowed a much longer time between
    server hardware upgrades—our 90 MHz Pentium was useful for five years," he said.'
