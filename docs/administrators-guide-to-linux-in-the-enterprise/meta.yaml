    # Final thoughts


    Since Linux will be acting as a file server, you''ll need a way to run reliable
    backups. If the Linux box will be serving a large number of files in an enterprise
    environment, I would recommend putting a tape drive in the Linux server itself.
    The other option is to use some shell scripting to create a compressed archive
    of all the files on the Linux file server, ship those files over to one of your
    NT servers each night using the *cron* daemon, and back up this archive with the
    rest of the mission-critical files in your daily Windows NT backup.'
