    this process is trivial:


    ```

    cp -R /home /usr

    rm -rf /home

    ln -s /usr/home /home

    ```


    This strategy is nice because it puts /bin and etc together with the kernel in
    the root partition. If /usr ever gets hosed up, you can still boot your system
