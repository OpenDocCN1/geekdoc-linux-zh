  md: 'The *install* keyword contains the name of the file to be used as the new boot
    loader. With versions of LILO 21.5 and higher, this can be either `boot-text.b`
    or `boot-menu.b`. In our case, we use `/boot/boot.b`, which is actually a symbolic
    link to `boot-menu.b`. You will typically want to use `boot-menu.b`, as that provides
    you the graphical menu you see when you start your computer, while `boot-text.b`
    only exists for those who prefer a simple LILO prompt instead of the menu.


    The *vga* keyword determines which VGA mode LILO will boot with. If you wish to
    boot into straight 80x25 mode, use the word "normal" here; if you wish to boot
    into 80x50 mode, use *ext*. If you want to know what VGA modes are available,
    use the word *ask* and LILO will present you with a list of VGA modes from which
    to choose.


    > LILO and GRUB are two excellent boot loaders if you do not have the need for
    an on-the-fly partitioning utility.


    The *default* keyword determines which image is the default to be loaded. In this
    case, we want the *linux* image to be loaded by default.


    The *lba32* keyword tells LILO to generate 32-bit logical block addresses instead
    of sector/head/cylinder addresses. This is recommended for all recent drives,
    as it allows LILO to boot from partitions beyond the 1024-cylinder barrier.


    The *prompt* keyword tells LILO to issue the boot prompt and wait for user input
    before proceeding. The *timeout* keyword tells LILO how long to wait in tenths
    of a second. So the value of 50 in the *timeout* section tells LILO to wait 5
    seconds.


    The *password* keyword defines a password that must be used to boot the system.
    In this case, our password is *secret*. If you wish to have the system require
    the password to boot, remove the *restricted* keyword from the file. If you only
    want a password to be required if the user tries to append options to the kernel
    at the boot prompt, leave the *restricted* keyword where it is. The *restricted*
    keyword is generally used when you want the system to be able to boot without
    human intervention but want to prevent people from changing kernel options. These
    keywords can also be used in the image sections, so you can password-protect certain
    images completely, while using the *restricted* keyword with only some other images.
    If you wish to mix and match restricted and unrestricted images, define the password
    in the global section and use the *restricted* keyword in the images you wish
    to be able to boot without human intervention (usually the default image) and
    omit it from the other sections so that a password is required to boot them.


    The *message* keyword tells LILO which file to use that contains the message to
    display before the boot prompt. For our graphical menu, we are using `/boot/message-graphic`,
    which contains the graphic for our graphical menu. If you were using the text
    loader, you could enter some text in the file to be displayed before the boot
    prompt. Whenever you change the message file, you will need to rerun LILO to rebuild
    the *map* file.


    The *menu-scheme* keyword determines the color scheme to use with graphical booting.
    It follows the syntax: `<text>:<highlight>:<border>:<title>`, which in our case
    is *wb:bw:wb:bw*. This means we will have white on blue for the text and border,
    with blue on white for the highlight and title. The letters you can use are kbGCrmmyw,
    which stand for blaK, Blue, Green, Cyan, Red, Magenta, Yellow, and White, respectively.
    Use uppercase letters if you want the color to be intense.


    Finally, we come to the section defining our images to boot from. Each image section
    has the same structure, which consists of a starting *image* keyword that determines
    the Linux image to boot; this will usually be `/boot/vmlinuz-[kernel_version]`.
    In most cases, `/boot/vmlinuz` will be a symlink to a real image file, like `/boot/vmlinuz-2.4.3-20mdk`.


    Next, you define the name of the image with the *label* keyword. The first one
    we define is *linux*, which is our default image. Further on,'
