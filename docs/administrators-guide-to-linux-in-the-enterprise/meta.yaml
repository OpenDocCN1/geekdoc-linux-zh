  md: '# # Working with NFS


    *By Bryan Pfaffenberger*


    Network File System (NFS) is the native local area networking protocol not only
    for Linux, but for all UNIX-like operating systems. As you may have already discovered,
    the Linux implementations of NFS can be a bear to configure. If NFS has been giving
    you fits, you''ve come to the right place. In this article, I''ll reveal the tricks,
    secrets, and magical incantations needed to get NFS working on your system.


    You''ll begin by surveying precisely what you''ll need to install—on the client
    as well as the server—to work with NFS. You''ll then learn how to export directories
    from the NFS server so that they''re available to other computers on your network.
    Next, you''ll learn how to mount remote directories on the client machines, just
    as if they were part of the client machine''s file system. You''ll also learn
    how to deal with the various error messages you''re likely to encounter. By the
    time you''ve finished reading this article, you''ll have mastered all the essentials
    of NFS, and you''ll be well on your way to taking full advantage of this powerful,
    transparent technology.


    # ## Transition


    Part of the problem with Linux implementations of NFS lies in the fact that Linux
    users are going through a transition. Since Linux version 2.2, NFS has been directly
    supported in the kernel. That''s good for performance. But it also means that
    all those NFS utilities need to be updated to deal with the kernel changes—and
    so does the documentation. The result, predictably, is buggy software and out-of-date
    documentation. Perhaps you''ve been lucky and gotten NFS working without too much
    trouble, but many Linux users complain that they can''t get past the error messages.


    # ## What about Samba?


    Before you get started with squashed roots and other NFS mysteries, take a moment
    to consider whether NFS is right for your network. For one thing, NFS works only
    with Linux (and other UNIX-like operating systems). If your network includes Windows
    95/98/NT boxes, you may wish to consider using Samba instead.


    In brief, Samba is a cross-platform networking protocol that implements the messaging
    system native to Microsoft Windows. The Linux implementation of this messaging
    technology is very neat—so neat, in fact, that more than a few Linux-only networks
    are running Samba, even though there aren''t any Windows boxes on these networks!
    Still, Samba isn''t as tightly integrated with Linux as NFS is. For example, it''s
    easy to configure NFS so that all the needed software runs automatically on startup
    and all the remote directories are mounted without user intervention. (You can
    do this with Samba, too, of course, but it requires more work.)


    # ## Squash that root


    Before you get started with NFS, understand that NFS isn''t the most secure networking
    technology. (One colleague says that NFS actually stands for "no flippin'' security.")
    Like the Internet protocols, it dates from those wondrous days when networks were
    small, you knew everyone who used it, and everyone behaved nicely. Created in
    the organizational equivalent of Mr. Roger''s Neighborhood, NFS assumes that security
    is no big deal; if a user has logged on to one of the networked systems and supplied
    the correct username and password, this system becomes a *trusted client*. If
    you logged on to a client system as root, you could log on to the server as root—and
    of course, you wouldn''t do anything malicious, would you?


    Those days are gone, unless you''re setting up a small network at home that''s
    not connected to the Internet. Once you connect your network to the Internet,
    though, there''s a chance unauthorized intruders could gain root user status—and
    with the NFS of yore, they''d quite quickly gain root user status on any of the
    systems on the network. The same goes for internal intruders, such as an employee
    hunting for valuable information that could be'
