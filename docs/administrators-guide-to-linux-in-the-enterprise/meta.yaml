    # Managing multiple domains


    More often than not, a DNS server will have to manage more than one domain. You
    can even make a DNS server act as the primary server for some domains and as a
    secondary server for others—all with the same setup. It isn''t very hard to do,
    but it involves several steps that you need to follow. First, you must edit your
    */etc/named.boot* file so that you can manage the *xyz.com* domain, which we examined
    in the first part of our series, and the *mydomain.com* domain. With the following
    code, this machine will also become the secondary DNS server for *otherdomain.com*.


    ```

    directory/var/named

    cache.named.ca

    primaryxyz.comxyz.com.db

    primarymydomain.commydomain.com.db

    secondaryotherdomain.com192.168.1.28

    otherdomain.com.db

    primary1.168.192.in-

    addr.arpa192.168.1.db

    ```


    Your DNS server will be the primary server for *xyz.com* and *mydomain.com*, and
    it will be the secondary server for *otherdomain.com*. You can obtain the DNS
    records from the primary DNS server for *otherdomain.com* at 192.168.1.28. Next,
    edit the */etc/named.conf* file so that it will provide the same information:


    ```

    options {

    directory "/var/named";

    };

    zone "." {

    type hint;

    file "named.ca";

    };

    zone "xyz.com"{

    type master;

    file "xyz.com.db";

    };

    zone "mydomain.com"{

    type master;

    file "mydomain.com.db";

    };

    zone "otherdomain.com"{

    type slave;

    file "otherdomain.com.db";

    masters { 192.168.1.28; };

    };

    zone "1.168.192.in-addr.arpa"{

    type master;

    file "192.168.1.db";

    };

    ```


    Configure the database files as you normally do. For example, edit the resource
    records in */var/named/xyz.com.db*, */var/named/mydomain.com.db*, and *192.168.1.db*.
    Remember, *named* creates the */var/named/otherdomain.com.db* file when it refreshes
    the zone information for the *otherdomain.com* domain.


    Now, you''re going to have to decide which is your primary domain. Let''s assume
    that *mydomain.com* is the primary domain for your system and that *xyz.com* is
    a domain that you''re hosting (but that you don''t necessarily own). This distinction
    is important when you''re setting up your reverse resolution records (or the *192.168.1.db*
    file). When you perform reverse resolution, you can point to only one machine
    name per IP address.


    For example, let''s assume that *mydomain.com* has three machines, and each machine
    has its own separate IP address that''s reachable from the Internet. Your primary
    machine is called *web.mydomain.com* because it''s your Web server. It also acts
    as your primary DNS server. The second machine is called *mail.mydomain.com*,
    and it acts as your SMTP and POP3 server. The third machine, which is called *backup.mydomain.com*,
    is your secondary DNS server. Setting up your network this way will distribute
    the load across multiple computers; no single computer will become completely
    saturated with IP traffic.


    If you''re hosting *xyz.com*, give it the same information. Define *web.xyz.com*,
    *mail.xyz.com*, and *backup.xyz.com* and define any appropriate CNAME records
    along the way. Now, you have two fully qualified domain names per machine, for
    your Web server can be reached by *web.mydomain.com* and *web.xyz.com*. Similarly,
    the other two machines can be reached by two different (but fully qualified) domain
    names. You can''t place both of these domains in your reverse resolution database,
    so you use your primary domain instead (*mydomain.com*). Your reverse resolution
    file might look like this:'
