    in order to create the alias file.


    # Aliases that run programs


    So far, I''ve explained how you can create aliases that forward e-mail to other
    users based on a list of addresses that are defined in your dot-qmail file. There''s
    one other function that dot-qmail files can perform—sending a message to a specific
    program. This function could involve anything from an auto-responder robot to
    a mailing list program.


    First, you must define the alias file in the same way that you would for forwarding
    e-mail to another address, mailbox, or maildir. Use a pipe (|) to begin the command
    line of the program that you want to call. For example, e-mail to *auto@mydomain.com*
    must run the program */usr/bin/myprogram*. So, create the */var/qmail/alias/.qmail-auto*
    alias file and include the following line in this file:

    `|/usr/bin/myprogram`


    To run a series of programs over the incoming e-mail message, you can include
    as'
