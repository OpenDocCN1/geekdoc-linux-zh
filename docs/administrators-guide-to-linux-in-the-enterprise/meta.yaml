  md: '# Installing Apache and PHP


    By Vincent Danen


    In this article, we are going to take a look at installing one of the most popular
    server packages for Linux: the Apache Web Server. Apache is an open source Web
    server that is found with almost every single Linux distribution, and it is perhaps
    one of the most popular Web servers on the Internet today. It has excellent portability
    as it can run on Linux, *BSD, *NIX, Windows, OS/2, and even BeOS.


    Because most Linux distributions come with Apache, you will only need to build
    it from scratch very rarely. More often than not, you will use RPM or DEB packages
    to upgrade your system, but sometimes the occasion may warrant a system administrator
    building and installing Apache from scratch. This is often the case on older systems
    with dependency issues on new packages designed for newer versions of the same
    distribution. Because installing Apache via RPM and DEB packages is extremely
    simple and straightforward, we aren''t going to bother taking a look at that method
    of installation, but instead we''ll deal directly with the source.


    # Obtaining Apache source


    The first thing you need to do is obtain a copy of the Apache source code. You
    can choose the latest stable version of Apache, which is currently 1.3.20, or
    you can choose the most recent development version, which is 2.0.16 beta (as of
    this writing). Let''s download the latest stable version at http://httpd.apache.org/dist/httpd
    as the file apache_1.3.20.tar.gz. Save this file to your /usr/local/src directory.


    The next step is to unpack the source archive. This is accomplished using, as
    root:


    ```

    cd /usr/local/src

    tar xvzf apache_1.3.20.tar.gz

    ```


    You will now have an apache_1.3.20/ subdirectory located beneath your /usr/local/src
    tree. Now change to that directory. It''s time to run the configure script, which
    will set up our Apache options.


    # Building Apache


    Configuring Apache is done via the configure script. This is not the same configuration
    you will do in your actual configuration files. This is where you configure some
    of the runtime defaults for Apache, such as the location to install files, support
    for extra features and modules, and so forth.


    Let''s assume that you already have Apache installed and you simply want to give
    the new version of Apache a test run before you move your entire system over to
    it. This is handy to ensure that you have no difficulties with the new Apache
    prior to switching, and it will minimize any downtime should you encounter problems.


    To do this, we will install Apache into /usr/local/apache instead of the default
    /usr directory tree. This means that the Web server itself will be installed into
    /usr/local/apache/bin instead of /usr/sbin. To do so, we run configure, like this:


    ```

    ./configure --prefix=/usr/local/apache

    ```


    But that isn''t how we''re going to install Apache because it won''t give us the
    functionality that we might be looking for. Instead, we will run configure like
    **Listing A**.


    This does a few more things than the previous example, some of which may be essential
    to your site. We tell configure that we want the end installation to be in /usr/local/apache,
    and we also tell it to enable all modules. By default, Apache enables most modules,
    but not all of them, and there are some useful modules, such as mod_rewrite, that
    are not enabled by default.


    The next thing we are doing is enabling Dynamic Shared Object (DSO) support for
    the maximum number of modules, which in our case is all of them. Enabling DSO
    support is important because it allows you to load and unload modules in Apache
    by simply reconfiguring and restarting it, without requiring you to recompile
    if you wish to remove support for a particular module or add support for another
    one.'
