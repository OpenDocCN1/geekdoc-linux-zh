  md: "It's kind of neat to watch how an address works its way through the various\
    \ rulesets and gets modified. **Listing E** shows one for our Yahoo spammer that\
    \ we set up in the access_db.\n\nThese examples give you an overview of some of\
    \ the things you can do by enabling different *sendmail* options and features,\
    \ as well as a more efficient way to test them than just throwing mail out there\
    \ and hoping it arrives. If you're using a lot of the database table controls,\
    \ it probably wouldn't hurt to set up some scripts to run new entries through\
    \ the test mode after they're added. In fact, you could automate the whole process\
    \ of adding a new entry to one of the database tables, run *makemap*, restart\
    \ *sendmail*, and process the new entry through the test mode.\n\n# ## Sendmail\
    \ performance tuning\n\nNow that we know a bit about the level of control we can\
    \ exert on mail traveling in and out of our systems, let's take a look at what\
    \ we can do to get maximum efficiency out of running *sendmail*. There are a number\
    \ of options we can set to control how mail is processed, as well as how well\
    \ *sendmail* will coexist with other software running on your system.\n\n```\n\
    QueueSortOrder=host\n```\n\nThis feature makes the best use of the Connection\
    \ Caching feature if your system transfers large quantities of mail to a number\
    \ of users at the same host. The outgoing mail queue is sorted by hostname and,\
    \ by caching the connection, a number of messages to one host can all go through\
    \ during one connection, rather than adding the overhead of opening and closing\
    \ a number of SMTP connections.\n\nIf you are handling a very large volume of\
    \ mail, you may need to take steps to increase the efficiency of the *mqueue*\
    \ directory by using a separate disk, RAID, or a hashed filesystem such as XFS.\
    \ You may also need to run additional *mqueue* processors with a mix of QueueSortOrder\
    \ of both \"host\" and \"time\" in order to clear out messages quickly, as well\
    \ as insure that the oldest messages don't get bounced.\n\n*Sendmail* makes heavy\
