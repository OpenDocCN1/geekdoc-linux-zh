    # Debugging/diagnostics with smbclient


    The following tools give *smbclient* the ability to help with debugging a Samba
    connection (anything in all caps is a user-defined variable):


    +   ▶ *B IP_ADDRESS*—This sets the broadcast address.

    ▶ *d DEBUG_LEVEL*—This sets how in-depth you want your debugging information to
    be.

    ▶ *E*—This sends messages to *stderr* instead of *stdout*.

    ▶ *I IP_ADDRESS*—This sets the IP address of the server to which you wish to connect.

    ▶ *i SCOPE*—This sets a NetBIOS scope identifier.

    ▶ */LOG_FILE*—This sends the log messages to the user-defined file.

    ▶ *N*—This suppresses the password prompt.

    ▶ *n NetBIOS_NAME*—This allows you to override the NetBIOS name the daemon will
    use to advertise itself.

    ▶ *O SOCKET_OPTIONS*—This sets the TCP/IP socket options. This is often used only
    for performance tuning.


    +   ▶ *p PORT_NUMBER*—This sets the port number that the client will use to accept
    requests.

    ▶ *R RESOLVE_ORDER*—This sets the resolve order of the name servers.

    ▶ *s CONFIGURATION_FILE*—This declares the location of the Samba configuration
    file (*smb.conf*).

    ▶ *t TERMINAL_CODE*—This sets the terminal code for Asian languages.

    ▶ *U USERNAME*—This sets the username and can be used in conjunction with a password,
    for example, *-U username%password*.

    ▶ *W WORKGROUP*—This sets the workgroup name with which you want to connect.


    The above list is pretty healthy and will get you through most issues with Samba.


    # GUI front ends


    I''ve finally come to the section I''m quite anxious to discuss. Every once in
    a while, something very mysterious happens. As I began writing this article, I
    started thinking there really isn''t a good application to offer the readers that''s
    as user friendly as Microsoft''s Network Neighborhood. That particular application
    is simple to use and reads the network as easily and efficiently as if it were
    an intrinsic part of the local machine. Until recently, Linux had no such application.


    ![](bbox=[0.17, 0.6, 0.55, 0.925])


    LinNeighborhood, written by Hans Schmid and Richard Stemmer, is one application
    that really made my day. This little application not only reads the entire network,
    it can automatically, and silently, mount these shares into directories created
    by the application! I''m not sure why it took so long for such an application
    to appear, but this little gem is making using Linux on a primarily MS network
    as simple as it gets.


    Although LinNeighborhood is better experienced than explained, I''ll give it a
    try. The foundation of the application rests on the *smbmount* command and does
    it—in true Windows fashion—with as little user interaction as possible. Once configured,
    this little beauty can be opened to show the available shares. With a right-click
    you can choose from a number of'
  merge: -1
  pgno: 183
- img_proc: false
  md: 'options. Among these right-click options is the ability to mount the share
    and then browse it with a file manager. It is simple and elegant.


    The only possible difficulty in this application is the initial configuration.
    When you''re running on a typical MS network, you''ll need to configure only the
    following (under the Options | Preferences menu): On the Scan tab, configure Workgroup.
    Always scan as user if you have a username and password, you''ll need this). On
    the Programs tab, you may have to switch to a different *smbmount* version. On
    the Miscellaneous tab, select Memorize Mounted Shares/Remount On Next Startup.
    On the Post Mount tab, you may want to configure a different file manager.


    The main screen for LinNeighborhood looks like **Figure A**. You''ll notice that
    the main window contains three icons. The first two icons (small computers) represent
    two machine shares (both NT machines) mounted to Giles (the local machine). Beneath
    the top two icons is a third icon (a cute penguin head) that represents the entire
    network (even though it bears the name of the local machine).


    One of the beauties of the application is that when you open the program, it will
    immediately connect to the entire network—and with a double-click on the other
    icons, it will mount the user-configured shares.


    # Conclusion


    It''s taken some time, but Linux is finally getting to the point where it can
    live with ease in the Windows world. Complicated network setup is quickly becoming
    a thing of the past. In this article, we''ve tried to move you closer to your
    dream of working at a Windows-less workstation.


    # LinNeighborhood: A new GUI to advance Linux in a Windows network


    *By Jack Wallen, Jr.*


    It''s been a long time coming, but Linux finally has some sense of integration
    salvation on the horizon. Hans Schmid and Richard Stemmer have created LinNeighborhood,
    a lightweight front end for the *smbmount* and *smbclient* commands.


    LinNeighborhood is an Xwindow graphical port of Network Neighborhood, running
    over Samba utilities and the Linux smvfs programs under kernels less than 2.1.70
    and smb mount/smbmnt/smbumount under kernels greater than 2.1.70. LinNeighborhood
    permits the user to browse an SMB (CIFS) network consisting of Samba, Windows
    (Windows for Workgroups, 95, 98, NT), and probably (although these haven''t been
    tested) OS/2 and LANManager for DOS, among others. It also offers an interface
    for mounting the found shares.


    I happened to come across this little gem while I was, surprisingly enough, writing
    the previous article on the Samba *smbmount* command. I knew I wanted to spotlight
    a GUI application, but I was concerned because there really wasn''t a good one
    available. Sure, GNOME has *Gnomba*, but it''s pretty useless when you need to
    actually do WORK (like accessing a farm of Microsoft machines on a'
  merge: -1
  pgno: 184
- img_proc: false
  md: 'network). Then, along came an e-mail (on one of the many lists I frequent)
    about a little application called LinNeighborhood.


    # Installing LinNeighborhood


    I went to the Web site and happily noticed that both sources and *rpm* packages
    were available. To expedite the process, I chose the *rpm* package (which is concurrent
    with the source release of 0.6.0) and installed it with this simple command:


    ```

    rpm -ivh LinNeighborhood-0.6.0-1.i386.rpm

    ```


    Installing with the source is just as simple. Once you''ve downloaded the file
    *LinNeighborhood-0.6.0.tar.gz*, you run this command:


    ```

    tar xvzf LinuNeighborhood-0.6.0.tar.gz

    ```


    followed by:


    ```

    cd LinNeighborhood-0.6.0

    ```


    and finally the following set of commands (run as root):


    ```

    ./configure

    ./make

    ./make install

    ```


    Once you''ve run the above commands, the package should be successfully installed.


    # Starting and configuring LinNeighborhood


    You can run the LinNeighborhood application in one of two ways:


    +   - Using the command *LinNeighborhood*

    - Selecting the LinNeighborhood command from the main menu (in GNOME, this command
    is on the Applications menu; in KDE, you have to add it to the menu)


    Once you have the application open, you will see something like **Figure A**,
    which shows the LinNeighborhood interface with an open Microsoft share called
    *nt2* (a user-configured name). But how do we get to this point? Good question.
    Let''s get to work!


    Configuring LinNeighborhood is very easy. If you have a basic knowledge of your
    network environment and a correctly configured *smb.conf* file, the configuration
    process should take only seconds.


    The first step in configuring the application is to open LinNeighborhood and choose
    Options | Preferences. In the resulting window, enter your network''s workgroup
    information on the Scan tab, as shown in **Figure B**.


    # Figure A


    ![](bbox=[0.041, 0.589, 0.49, 0.918])


    *Once you open LinNeighborhood, you''ll see this window.*


    # Figure B


    ![](bbox=[0.51, 0.589, 0.959, 0.818])


    *Enter your network''s workgroup information in the main configuration window.*'
