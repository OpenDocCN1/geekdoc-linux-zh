  md: '# Setting up a secure FTP server with ProFTPD


    By Vincent Danen


    One of the most important services available on the Internet today—with the exception
    of Web serving—is the ability to exchange files via File Transfer Protocol (FTP).
    FTP sites are a cornerstone of the Internet, and no one can dispute this. Because
    of the popularity of FTP, a number of FTP server packages have been released for
    a variety of platforms. In the Linux world, probably the most popular of these
    FTP servers is the wu-ftpd server.


    While wu-ftpd is a good product and provides excellent performance, it lacks a
    number of features found in newer products. It also has a poor security history.
    A number of people felt that the only way to get wu-ftpd up to spec was to completely
    redesign it from the ground up. It was at this time that a new FTP server, called
    ProFTPD, was born. In this article, I''ll introduce you to ProFTPD.


    # Features


    Unlike other FTP servers, ProFTPD is designed to be lightweight, secure, and configurable.
    (If you''re familiar with Apache, you should have no trouble adapting because
    the configuration for ProFTPD is based on a similar syntax.) Other FTP servers
    may provide an extremely secure setting at the expense of configurability. ProFTPD
    doesn''t do this. It provides an extremely capable FTP service, with a high level
    of configurability and security. Currently, ProFTPD offers some attractive features
    that I''ll quickly outline for you.


    ProFTPD features per-directory .ftpaccess configuration files similar to Apache''s
    .htaccess files. ProFTPD makes it simple to configure multiple virtual FTP servers
    and anonymous FTP services. It can be run either as a standalone server or from
    inetd, depending on your needs. The anonymous FTP service it provides doesn''t
    need a specific directory structure or other system files like the anonftp package
    for wu-ftpd (no more /home/ftp if you don''t want it!). ProFTPD allows for hidden
    directories and files based on user/group ownership and UNIX-style permissions.
    It can run as a configurable, nonprivileged user in standalone mode in order to
    decrease the chance of attacks that might exploit its root capabilities (like
    Apache running as user nobody). It provides multiple forms of logging compatible
    with the wu-ftpd logging standard, and it provides extended paranoid logging.
    It also supports full shadow passwording, including support for expired accounts.


    # Installing ProFTPD


    The first thing you must do is install ProFTPD. Because ProFTPD is a full FTP
    server, it conflicts with wu-ftpd and you must first remove wu-ftpd from your
    system. To do this on a Linux Mandrake or any other RPM-based system, use the
    following:


    ```

    rpm -e anonftp

    rpm -e wu-ftpd

    ```


    The anonftp package provides anonymous FTP services for wu-ftpd and must be removed
    first because it depends on the wu-ftpd package. Finally, you have to remove wu-ftpd
    itself.


    At this point, you can install ProFTPD. Some distributions provide a packaged
    version of ProFTPD, usually via user contributions. If your distribution does
    provide this, it would be easiest to install the ProFTPD RPM. If that isn''t possible,
    you''ll have to download the source code from the ProFTPD site at www.proftpd.net
    and compile it yourself.


    To download and compile ProFTPD, grab the latest tarball from the downloads page
    of the Web site (216.24.5.22/pub/proftp-1.2.0pre10.tar.gz). At this writing, the
    latest version is 1.2.0pre10. Move the downloaded file to the /usr/src directory
    and issue


    ```

    tar xvzf proftpd-1.2.0pre10.tar.gz

    cd proftpd-1.2.0pre10

    ```


    This will place you in the top-level directory of the source distribution. To
    compile and install the package, issue the following:


    ```

    ./configure --prefix=/usr \

    --sysconfdir=/etc \

    --localstatedir=/var/run \

    ```'
