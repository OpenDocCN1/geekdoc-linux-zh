    tree. Change to the *usr/local/src/squid-2.3.STABLE4* directory and run *configure*
    like **Listing A**.

    This code, of course, is one long line and not separate commands. What we are
    doing here is telling *Squid* to install into the */usr* directory tree and place
    the binaries into *usr/sbin*. We use */var* for all caching data and *etc/squid*
    for the configuration files. We place everything else that belongs to *Squid*
    (icons and so forth) into */usr/lib/squid*.

    The *--enable-snmp* command turns on the Simple Network Monitoring Protocol (SNMP)
    functions in *Squid* to allow you to use an SNMP-aware monitoring utility to view
    your proxy server. Finally, the *--enable-heap-replacement* command tells *Squid*
    to use various cache-replacement algorithms that are more efficient than the standard
    LRU algorithm.

    The next step is to do the actual *Squid* compiling:

    make

    Depending on your machine, this may take a few minutes.

    Once this is complete, install the package using

    make install

    This will install all of the *Squid* components to their appropriate locations.


    The next thing you want to do is create two directories where *Squid* will store
    its caching data and log files. To do this, run the following commands:

    mkdir -p /var/spool/squid

    mkdir -p /var/log/squid

    If you will be using *Squid* as the user nobody and the group nogroup, change
    the following *chown* command to suit. Prior to performing the next command, however,
    you must create the user and group using the *useradd* and *groupadd* commands:

    chown squid.squid /var/spool/squid

    Now *Squid* is installed and is ready to be configured.


    # Configuring Squid


    It''s time to configure *Squid*. To do this, you must change to the */etc/squid*
    directory. This directory will contain a few files, but the most important file—and
    the one we will be looking at—is the *squid.conf* file. Open *squid.conf* in your
    favorite editor.

    *Squid* will theoretically operate just with all of the defaults enabled. If a
    keyword is missing, *Squid* will use the default value for it, so you can even
    run *Squid* with a zero-byte *squid.conf* file (but I wouldn''t recommend it).
    Tweaking the *squid.conf* file will help you get the most out of *Squid*. Because
    there are so many options in the configuration file, we''ll be looking at only
    the more important keywords. Feel free to explore the *squid.conf* file and make
    any changes you see fit above and beyond those pointed out in this article.

    The first item to configure is the port that *Squid* listens to. *Squid* uses
    the keyword *http_port* to define what port to listen to and optionally what domain
    name or IP address to bind to. You can specify the port alone, or you can specify
    the port and hostname/IP address using the syntax *[hostname|IP]:[port]*. The
    default port is 3128, so we''ll define it thusly:

    http_port 3128'
