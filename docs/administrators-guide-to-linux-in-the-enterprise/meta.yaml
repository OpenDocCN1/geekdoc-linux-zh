  md: "```\nNSweb.mydomain.com.\nNSbackup.mydomain.com.\n1PTRweb.mydomain.com.\n2PTRmail.mydomain.com.\n\
    3PTRbackup.mydomain.com.\n```\n\nIf you follow these steps, you shouldn't have\
    \ any problems serving multiple domains from one machine. Basically, all you really\
    \ need is one primary domain for your network. Usually, when you define the hostname\
    \ for your computer, you have only one hostname and one domain name. This domain\
    \ name will become your primary domain because it's the one that's used across\
    \ your network.\n\n# Forwarding DNS requests\n\nForwarding DNS requests to another\
    \ DNS server is a simple way of lessening the load on your DNS server. If the\
    \ local server receives any queries that it can't resolve from its own local cache,\
    \ it will forward hostname lookup requests to a specific list of servers. This\
    \ method builds a rich cache on the selected server and keeps the load down on\
    \ secondary servers. If possible, this selected server should exist on your local\
    \ network. That way, you'll prevent your secondary servers from reaching out to\
    \ the Internet to resolve hostname lookups. Only one server on your local network\
    \ will look up hostnames across the Internet, which can become very helpful if\
    \ you're paying for Internet usage. Here's an example of a /etc/named.conf file\
    \ using the forwarders option:\n\n```\noptions {\ndirectory \"/var/named\";\n\
    forwarders first;\nforwarders { 192.168.1.1;\n  192.168.1.2; };\n};\n```\n\nThese\
    \ lines tell the local server to try the forwarders before it tries to get an\
    \ answer from any other external server (such as the root servers that InterNIC\
    \ runs). The forwarders first option is somewhat redundant because it tells the\
    \ local server to try the forwarders before trying anything else, which is the\
    \ default setup. An alternative option is the forwarders only; option, which tells\
    \ the local server to talk to forwarders only. With the forwarders only; option,\
    \ any queries not resolved by the forwarders will remain unresolved because the\
    \ local server is explicitly told not to try any external servers. The forwarders\
    \ option contains a list of DNS servers to which all queries will be forwarded.\
    \ (In the above lines, 192.168.1.1 would be consulted first; then, 192.168.1.2\
    \ would be consulted.)\n\n# Final tips\n\nNow, I'm going to give you two tips\
    \ that will save you a lot of headaches. If this is the first DNS server that\
    \ you've ever set up, you'll want to pay close attention to these tips. First,\
    \ due to various RFCs that relate to domain name services, you must keep in mind\
    \ that NS and MX records can't point to CNAME records. These record types must\
    \ point to an explicitly defined A record. If not, named will remind you by writing\
    \ an error to the syslog. Although named will run with NS and MX records pointing\
    \ to CNAMEs, it isn't proper, and this method may cause problems. Pointing to\
    \ a name server called bunny.xyz.com instead of ns.xyz.com may not be as cosmetic,\
    \ but it's proper. Since this difference is invisible to everyone except other\
    \ DNS servers, it doesn't really matter. You can define a CNAME of ns.xyz.com\
    \ to point to bunny.xyz.com. If you're worried about cosmetics, you can tell your\
    \ users to use ns.xyz.com as the DNS server for normal hostname resolving.\n\n\
    Second, if you want to set up primary and secondary DNS servers, make sure that\
    \ they exist on separate machines. Remember, named doesn't like it very much if\
    \ you tell it to act as both primary and secondary DNS for any given zone or domain.\
    \ It will write an error to the syslog if it encounters this configuration.\n\n\
    # Conclusion\n\nSetting up a DNS server can remain a simple and straightforward\
    \ job, or it can become extremely complex—based on your needs. I trust that I've\
    \ approached the configuration and installation of BIND and the DNS server system\
    \ in a way that will help you get the most out of any DNS server that you set\
    \ up.\n\nAnother excellent source of information on DNS is the DNS Resources Directory,\
    \ which you can find at www.dns.net/dnsrd. This source will help you obtain further\
    \ advanced configuration, if you require it."
