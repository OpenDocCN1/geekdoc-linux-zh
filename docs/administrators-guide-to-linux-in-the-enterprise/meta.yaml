  md: '▶ **server**


    ▶ **domain**


    You''ll often see administrators use the security setting *server* when setting
    up Samba in a Windows NT domain. But since Samba version 2.x, the *domain* option
    has been available.


    Domain security makes Samba authenticate users like an NT machine, while server
    security makes Samba authenticate like a Windows 95/98 machine. Domain security
    gives Samba the advantage of participating in NT domain trusts in an enterprise
    environment. It also cuts down on PDC/BDC connection resources because, unlike
    server security, which always keeps an RPC connection open with the PDC or BDC
    as long as the daemon is running, domain security connects to the PDC or BDC only
    when authenticating a user. This conserves valuable resources on the NT domain
    controllers.


    As far as the other *smb.conf* variables go, the *workgroup* variable lets you
    specify the name of your NT domain (in CAPS). The *netbios name* is just that
    (also in CAPS). The *server string* is the comment you see in Network Neighborhood.
    The *nt acl support* setting maps UNIX permissions to NT access control lists.
    The *wins server* setting is the WINS server that Samba will use. The *dns proxy*
    setting tells Samba whether or not to attempt to resolve NetBIOS names with DNS
    lookups. Set it to *no*. The default *name resolve order* listed above is the
    standard and the best to use in almost all cases.


    The *encrypt passwords* setting must be set to *yes* if you have clients running
    Windows 95 with SR2 or later, Windows 98, or Windows NT with Service Pack 3 or
    later. If your clients don''t meet these standards, I recommend upgrading them
    because encrypted passwords are very important for network security. The *log
    file* and *max log size* settings can simply be left at the defaults.


    In the *remote announce* variable, put the IP broadcast address of the local network
    this server is on. In the *remote browser sync* settings, put the IP broadcast
    address of the subnets that connect with this server so that you can have browse
    list synchronization. You can leave the *socket options* setting at the default
    value for best performance. The *printcap* and *load printers* settings are left
    at default values and included in active settings so that you can easily add print
    servers to Samba in the future if you choose.


    # Avoiding common errors


    The settings *local master*, *domain master*, and *preferred master*, should all
    be set to *no* or deleted, along with their partner *os level*. These settings
    involve making the Samba server the master browser on the NT network. You don''t
    want to let this happen because it can cause numerous errors on your NT machines.
    At best, it will cause some annoying Event Viewer messages. At worst, it will
    bring down your domain controller.


    > Domain security makes Samba authenticate users like an NT machine, while server
    security makes Samba authenticate like a Windows 95/98 machine.


    You also want to delete the *domain logons* setting. If this is set to *yes*,
    Samba will try to act like a domain controller, and it could bring down your real
    PDC. While theoretically, a Samba server can be set up as a PDC in an NT domain,
    in practice, it still has a number of problems using the current release of Samba.
    However, it does hold great potential in future Samba releases.


    As a rule, you can safely delete any of the global settings that are not listed
    above. Settings can always be added back in as you learn more about Samba and
    want to tweak it according to your needs and specifications. You can also delete
    [homes], [netlogon], [tmp], [profiles], [public], and any other sample shares.
    But save the [printers] share, because it''s for general printer functionality.


    Also, remember that you''ve set up Samba to authenticate users through the NT
    domain controller. This means that Linux looks to NT to see who is allowed to
    mount and access Samba shares. However, the read/write/execute permissions for
    working with files on'
