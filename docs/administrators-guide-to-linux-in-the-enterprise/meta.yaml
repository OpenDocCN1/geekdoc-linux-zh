    CONDITIONS

    make sure the e-mail was addressed to you

    make sure you do not reply to daemons and mailing lists

    make sure you avoid mail loops

    use formail to generate an auto-reply header and extract it to the file vacation.cache
    to be used as a database to hold our already sent e-mail

    addresses (we want to send the vacation message only once to each address)

    ACTIONS

    if the name is not in the above cache file, we''ll use sendmail to reply to the
    address with our message

    ```


    ```

    file, we''ll use sendmail

    to reply to the address with our

    message

    ```


    # The real thing


    The real recipe looks quite a bit different than the pseudo code but will perform
    just as we''ve outlined. You should note that this is actually two recipes. The
    first recipe sets up our vacation cache so that we have a database of e-mail addresses
    collected. You use this database so that you send your auto-responder mailing
    only once to each address. You will want to create this file, *vacation.cache*,
    with the command `touch ~/mail/vacation.cache`


    The second recipe actually puts together the e-mail to be sent to the extracted
    address. This second recipe acts only if the first recipe fails.


    Here''s the actual recipe:


    ```

    :0 Whc: vacation.lock

    * $^To:.*\<$\LOGNAME\>

    * !^FROM_DAEMON

    * !^X-Loop: jwallen@techrepublic.com

    | formail -rD 8192 vacation.cache


    :0 ehc

    | (formail -rI"Precedence: junk" \

    -A"X-Loop: jwallen@techrepublic.com" \

    ; \

    echo "I received your mail."; \

    echo "I''m currently attending LinuxWorld Expo."; \

    echo "and will return Friday, August 18."; \

    echo "-- "; cat $HOME/.signature \

    ) | $SENDMAIL -oi -t

    ```


    Now that we''ve seen the recipe in pseudo code and actual code, let''s break it
    down line by line:


    ► `:0 Whc: vacation.lock`—This line starts the recipe, waits until the e-mail
    has checked successfully before it filters the mail, feeds the header to the destination
    file (*vacation.cache*), carbon-copies the e-mail, and creates a lockfile called
    *vacation.lock*.


    ► `* $^To:.*\<$\LOGNAME\>`—Checks to make sure the e-mail was, in fact, addressed
    to you.


    ► `* !^FROM_DAEMON`—Makes sure that it does not reply to daemons and mailing lists.'
