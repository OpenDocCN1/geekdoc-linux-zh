    ```

    chkconfig qmail-pop3d.init on

    ```


    The Qmail POP3 server uses *tcpserver* to manage the daemon, so you can use the
    rules files for this service, too. To create the rules for the POP3 daemon, edit
    the */etc/tcprules.d/qmail-pop3d* file. This text format file specifies which
    *tcprules* you want activated for the service. For those of you who are new to
    *tcpserver*—and anybody who hasn''t used Qmail probably is new to it—the *tcprules*
    files are located in the */etc/tcprules.d/* directory. There are two files per
    service: one is called *[daemon-name]*, and the hashed file is called *[daemon-name].cdb*.
    Since *tcpserver* uses compiled files, you must use the *tcprules* program in
    order to compile the ASCII text configuration file into the hashed file that *tcpserver*
    uses. By default, there are no *qmail-pop3d* and *qmail-pop3d.cdb* files. You
    need to create them. A very basic file might look like this:


    ```

    127.0.0.1:allow24.65.128.35:allow

    ```


    # Security and POP3 with tcpserver


    Assuming that 24.65.128.35 is your own IP address, it allows connections only
    from the local adapter and your IP address. It''s rather restrictive, but it''s
    useful if you''re using POP3 services locally and you don''t want everyone else
    on the Internet to be able to connect to your POP3 server. Save your new *qmail-pop3d*
    file and compile it with the following command:


    ```

    tcprules qmail-pop3d.cdb qmail

    -pop3d.tmp < qmail-pop3d

    ```


    Now, you have the hashed file that *tcpserver* needs in order to operate properly.
    To start the POP3 server without waiting for a reboot, run:


    ```

    /etc/rc.d/init.d/qmail-pop3d.init

    start

    ```


    The POP3 server will wait for incoming connections. Your new, fully functional
    SMTP and POP3 mailer service will be more secure than any other MTA.


    # Converting those older mailbox formats


    Next, you''ll want to convert the older mailbox format of storing mail to Qmail''s
    maildir format. The old mailbox format stores incoming e-mail in a file called
    */var/spool/mail/[username]*. From Qmail''s point of view, this method is insecure
    and unreliable. Instead, Qmail uses the maildir format, which is far more reliable.
    The mailbox format, which involves only one file, has a major flaw. If the system
    crashes while a program is appending a new message to the mailbox file, the message
    will be truncated. In some cases, it can be truncated in the middle of a line,
    and the rest of the message will merge with the next message. The delivering program
    will probably resend the message because there was a crash. By then, however,
    it''s too late. Your mailbox has become corrupt.


    When it comes to new mail messages, the maildir format is crash-proof. It''s much
    faster and much easier for e-mail clients and Mail User Agents (MUAs) to use.
    In an NFS environment, Qmail won''t even use the mailbox format for incoming mail.
    The maildir format, however, works very well over NFS, and you don''t have to
    lock it in order to make it safe and easy to read. In this environment, several
    MTAs can deliver mail to you at the same time, and there won''t be any problems
    or delays because there''s no locking of files. If you''re using the mailbox format,
    the same rule doesn''t apply because different programs would try to access the
    same individual file at the same time. Since the maildir format gives one file
    to each message, e-mail can be delivered, deleted, and read, and other mail processing
    procedures won''t be affected.


    You can change your existing mailbox format to the maildir format easily. Qmail
    provides a tool called *maildirmake*, which accomplishes this task for you. You
    need to run this program as the user in order to complete the conversion. (Qmail
    can use both the maildir and mailbox formats on a per-user basis.) Use the *su*
    program to become the user'
