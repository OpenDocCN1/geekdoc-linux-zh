    \ therefore, you should save these messages to another folder so that you don't\
    \ have to toggle between two mail storage formats. To switch to the maildir format\
    \ on your system, as root, you should create the *Maildir* directory in the new-user\
    \ template directory. (In Linux Mandrake, it's the */etc/skel/* directory). Next,\
