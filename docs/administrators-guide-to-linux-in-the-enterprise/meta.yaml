    Microsoft''s Web site lists Microsoft Windows 2000 at a purchase cost of $319,
    assuming you are not upgrading from a previous version. You must also add Microsoft
    Office 2000, which lists for $579. This brings your total to $898 per machine.
    Microsoft does offer volume discounts.


    Of course, the purchase cost is just one aspect of the total cost of ownership.
    We must consider what it might cost to maintain your enterprise system. System
    administration staff would be the next major cost to consider. Even if you can
    get by using few people to maintain a Windows system, the cost of labor will dwarf
    the initial purchase cost in only a few years. Getting your staff up to speed
    on the Linux operating system should not require any more cost than that of upgrading
    your Windows environment. And if you take into consideration the cost savings,
    uptime, and lower manpower requirements to operate, you can quickly see how Linux
    makes most budgeters happy campers.


    If you need technical support from Microsoft, they offer several options. You
    may call them and discuss your specific needs to get a quote. Red Hat offers similar
