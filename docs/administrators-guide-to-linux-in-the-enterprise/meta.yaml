  md: '# # Save big by replacing NT file servers with Linux Samba


    By Jason Hiner, MCSE, CCNA


    The word is out. Using Samba to set up a Linux file server in a Windows NT domain
    offers network administrators some great options. Linux Samba brings excellent
    stability, performance, integration, and a significant cost savings over a Windows
    NT server doing the same tasks. However, a successful Samba implementation into
    an NT domain depends upon using the best Samba settings for NT integration and
    avoiding common configuration errors.


    In this article, I''ll go step-by-step through the process of setting up a Samba
    file server on Linux and optimizing it for security and performance in a Windows
    NT domain. I''ll also explain how to avoid common configuration errors and show
    you how to set up shares. Although Samba can also be used as an excellent print
    server, this article will focus primarily on configuring a file server. Nevertheless,
    once you set up your Samba configuration, you can easily add printing services
    by learning the Linux method of setting up network printers.


    This article assumes that you have a solid understanding of Windows NT domains
    but are a beginning to intermediate Linux user. The only assumptions from the
    Linux side are that you have a Linux distribution installed on your target machine
    and that you have a basic understanding of the Linux file system and know how
    to use a text editor.


    # ## Preliminary Linux configuration


    Samba comes preinstalled on many Linux distributions, and it''s available as an
    installation option on all the major distributions. If you''re running an older
    distribution, I would recommend that you go to Samba''s Web site at www.samba.org,
    download the latest version of Samba, and install it on your Linux machine.


    Once you have Samba installed, log in to your Linux system as the root user. Before
    you begin configuration, you will need to stop the Samba daemons (services) if
    they are currently running. You can issue the following command to display all
    of the currently running daemons:


    ```

    ps aux | more

    ```


    Look for *smbd -D* and *nmbd -D*. (These are the two Samba daemons.) Locate the
    PID numbers for these two daemons in the second column from the left. Issue the
    following command (replace 1010 with the *smbd* PID number):


    ```

    kill -9 1010

    ```


    Next, issue this command (again replacing the 0101 with the *nmbd* PID number):


    ```

    kill -9 0101

    ```


    Before digging into the Samba configuration itself, you''ll need to set up users
    and groups on the Linux machine to correspond to the users and groups in your
    Windows NT domain. To set up groups in Linux, issue the following command for
    each group:


    ```

    groupadd groupname

    ```


    Then, set up users by issuing the following command for each user:


    ```

    adduser username -g groupname

    ```


    For an enterprise environment with a large number of users, I would recommend
    using a product such as Microsoft''s NT Services for UNIX or MKS Toolkit to set
    up username/password synchronization between Linux and Windows NT. Both solutions
    work well, but Microsoft''s product is more economical, and MKS Toolkit is more
    robust.


    You also need to set up the main directory that you''ll share to the Windows NT
    network. Issue the following commands:


    ```

    cd /

    mkdir winshare

    ```


    followed by this command:


    ```

    chmod 777 winshare

    ```


    This creates the share */winshare* and provides read/write/execute ability to
    anyone who gains permission to mount the share.'
