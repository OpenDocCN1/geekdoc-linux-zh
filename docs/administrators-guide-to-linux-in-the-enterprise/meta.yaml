  md: '# ## Step three: Compile the kernel with sound support


    To enable sound support on a Linux system, two features need to be compiled into
    the kernel:


    +   1. Support for loadable modules

    2. Support for sound


    This article won''t cover the steps necessary to compile and install a new Linux
    kernel. It is assumed that you have the experience necessary to compile the kernel
    with the required support.


    # NOTE


    When you compile the kernel, remove any sound card drivers from the kernel prior
    to compiling. ALSA will load the driver required by your sound card later.


    # ## Step four: Install the ALSA drivers


    Once the kernel is compiled and installed, the next step is to install the ALSA
    drivers. First, untar and uncompress the alsa-driver package with the command:


    ```

    tar -Ixvf alsa-driver-0.5.10a.tar.bz2

    ```


    The next step is to enter the directory containing the alsa-driver package with
    the command:


    ```

    cd alsa-driver-0.5.10a

    ```


    Prior to running the configure script in this directory, make sure of the configuration
    options you require. The following options are supported by the alsa-driver package:


    +   - **--with-isapnp=yes/no/auto**: Selects the ALSA isapnp utility, or the standard
    Linux isapnp tool. If you don''t use an ISA sound card, select no.


    +   - **--with-sequencer=yes/no**: Select yes if a MIDI driver is required.


    +   - **--with-oss=yes/no**: Select yes for ALSA to emulate the OSS sound system.


    +   - **--with-cards**: Provides a comma-separated list of the card or cards ALSA
    will provide support for. The option "ALL" will provide support for all ALSA-supported
    sound cards. The option "dummy" may be used if no sound card is installed but
    sound support is required.


    +   - **-with-prefix=directory**: The ALSA directory package includes C header
    files used to build other ALSA utilities. The default location is /usr/include.
    If another location is required, enter the directory path to that location (e.g.,
    /usr/local/include).


    On my system, I use a Creative Sound-Blaster ensoniq PCI sound card, based on
    the ens1371 chipset. I don''t require the isapnp package, and I don''t use OSS
    emulation. However, I do need MIDI support, and I use the default location for
    the C header files. To configure ALSA with these options, I use the command


    ```

    ./configure --with-isapnp=no

    --with-sequencer=yes

    --with-oss=no

    --with-cards=ens1371

    ```


    The next step is to build and install the modules with the following two commands:


    ```

    make

    make install

    ```


    The ALSA drivers and header files are then installed, and a script to load and
    unload ALSA when the system is booted and shut down is generated.


    # ## Step five: Building the ALSA device files


    The next step is to create the ALSA device files. The alsa-driver package uses
    the snddevices script to create these files. The procedure ALSA uses to interface
    with your sound card relies heavily on the /proc filesystem. The snddevices script
    creates dynamic device files in /proc/asound/dev.


    The snddevices script links /proc/asound/dev to /dev/snd and also creates entries
    in /dev to provide OSS emulation. To run the snddevices script, run the following
    command from the alsa-driver package directory as root:


    ```

    ./snddevices

    ```


    If you are running a 2.2 series kernel, the /dev/sndstat file, which is used to
    provide information on installed OSS drivers, won''t work properly. The solution
    to this problem is to'
