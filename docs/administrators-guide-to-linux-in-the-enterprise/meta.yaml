    - Reducing the CPU clock speed will decrease power consumption. Several laptops
    offer a CPU clock selector that will toggle between normal and slow speed.

    - Turn off the CPU cooler. Many recent laptops offer a BIOS option called Cooling
    Control. If your system''s CPU is becoming too hot, this option allows you to
    have it cooled by a tiny fan (setting Performance) or to have its CPU clock slowed
    down (setting Silence). To increase your uptime while using the battery, use Silence.

    - Avoid using external devices such as the printer, CRT (cathode-ray tube) screen,
    Zip drive, and portable camera with your computer while using the battery.

    - Avoid using any built-in device such as the floppy disk drive, hard disk, or
