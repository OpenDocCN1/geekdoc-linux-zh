  md: '▶ *^X-Loop: jwallen@techrepublic.com*—Avoids mail loops (an e-mail comes from
    your account to your account and is auto-replied from your account back to your
    account, which would cause a possibly infinite loop).


    the conditions and actions within ()—to *sendmail* for delivery to recipients.


    Why is this considered a nondelivering recipe when it obviously delivers to an
    outside e-mail address? The main reason is because it is using an external program
    (*formail*) to generate a response, leaving *procmail*''s sole purpose to write
    to a file (*vacation.cache*). Even though the ultimate action is that an auto-generated
    e-mail is mailed to the sender of the original mail, many times no e-mail will
    be generated (for instance, when someone''s e-mail address is already in the *vacation.cache*
    file). Now is it obvious why this is considered a nondelivering recipe?


    ▶ | *formail -rd 8192 vacation.cache*—The header has been piped to this line,
    which uses *formail* to create a cache of e-mail addresses to compare.


    ▶ :0 eh—If the immediate recipe fails, we will execute this recipe, feeding the
    header to the next pipe and making a carbon copy of the mail. No lockfile is used.


    ▶ | {formail -ri"Precedence: junk"} \—Append a custom header field (*Precedence*),
    set it to *junk*, and strip away all other headers.


    ▶ -A"X-Loop: jwallen@techrepublic.com" ; \—Append the *X-Loop:* header to our
    newly generated e-mail so that we can guarantee avoidance of e-mail loops.


    ▶ echo *—The next four lines (all beginning with *echo*) are the lines of text
    you wish to include in your auto-responder.


    ▶ } | $SENDMAIL -oi -t — Pipe the newly created message—everything created with
    the conditions and actions within ()—to *sendmail* for delivery to recipients.


    # Conclusion


    In this article, we unraveled the mystery of lockfiles, reviewed the basics of
    recipes, and created a couple of helpful nondelivering recipes. Of course *procmail*
    can do so much more! Do not assume that these two articles are an exhaustive resource.
    For an exhaustive resource on *procmail*, please consult your imagination.


    # Configuring Linux printers with printtool


    By Jack Wallen, Jr.


    Let''s say you have a Linux box up and running, and you''ve managed to configure
    users, networking, and sound so far. Now it''s time you stepped up to the printer
    plate and smacked a home run!


    # What is printtool?


    The *printtool* utility is actually a front end for a couple of different applications.
    The first use of *printtool* is as a front end for creating and editing the */etc/printcap*
    file. The */etc/printcap* file is charged with communicating to *lpd* (line printer
    daemon) the configurations (i.e., printer names, printer locations, printer filters)
    for the connected printers.


    In this article, we''re going to configure both a local and a remote printer (with
    a helping hand from Samba) using Red Hat''s *printtool* utility.'
