    # # Customizing the Linux bootup and shutdown processes


    *By Jim McIntyre*


    The ability to manage the Linux bootup and shutdown processes is essential for
    a system administrator. The administrator must know which services are running
    on the system, how to add new services, and how to remove services that are not
    required. This article will provide Linux administrators with the information
    necessary to customize the files and directories involved in the Linux bootup
    and shutdown processes and will examine the tools available to customize these
    processes.


    # ## An overview of the boot process


    When a Linux system is booted, the Linux boot loader (LILO) loads the kernel.
    When called by LILO, the kernel is uncompressed, the display device is initiated,
    and the kernel starts checking for hardware attached to your system. As it finds
    hardware devices, it loads kernel modules to provide support for these devices.
    Once hardware support is loaded, the kernel mounts the root (/) filesystem as
    read-only. If no problems are detected in /, the root filesystem is mounted as
    read-write.


    After the root filesystem is mounted as read-write, the kernel executes a program
    called *init*. When *init* has completed its execution, the system is up and running.
    The *init* process is highly configurable, via the */etc/inittab* file and files
    and directories with the *init* configuration process.


    The following syntax is used for configuration lines in the */etc/inittab* file:


    ```

    id:run-levels:action:process

    [arguments]

    ```


    +   - The first field is a unique label, which identifies an entry in the *inittab*
    file.

    - The second field specifies which run-levels this entry applies to.

    - The third field specifies the action to be taken.

    - The fourth field identifies the process to be run and any arguments that apply
    to that process. Command-line arguments may also be specified in the fourth field.


    The state of a Linux system is specified by its run-level. There are seven run-levels
    available on a Linux system.'
