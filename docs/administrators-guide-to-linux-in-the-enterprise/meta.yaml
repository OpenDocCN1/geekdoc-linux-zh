    which is very desirable. However, this puts one company in the position of dictating
    proprietary standards to the world. Regardless of how you feel about the situation,
    your enterprise system office product selection must be determined based on whether
    you need compatibility within your company or worldwide compatibility.


    On the Linux platform, you have a number of choices that will allow you to maintain'
