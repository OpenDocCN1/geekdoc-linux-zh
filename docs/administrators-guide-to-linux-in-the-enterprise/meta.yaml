- img_proc: false
  md: 'Emacspeak always provides the context that''s needed to grasp the meaning of
    the information it''s conveying.


    For an interesting Real Audio demonstration of a "live" Emacspeak session, go
    to [www.vipace.org/audio/emacs.ram](http://www.vipace.org/audio/emacs.ram).


    # On the horizon


    To reach full maturity as the ideal, low-cost computer platform for people with
    disabilities, Linux needs high-quality, freely distributable speech recognition
    and speech synthesis software. Happily, they appear to be on the way, thanks to
    two ongoing efforts that have already produced impressive results.


    Promising to fill the speech synthesis void is Sphinx, a project housed at Carnegie
    Mellon University''s department of computer science. Sphinx is an experimental
    speech-recognition system that''s available for any POSIX-compatible system, a
    category that includes Linux. For more information on Sphinx, visit the Sphinx
    Group at Carnegie Mellon University at [www.speech.cs.cmu.edu/sphinx](http://www.speech.cs.cmu.edu/sphinx).


    On the speech synthesis end, Festival enables Linux users to generate speech using
    ordinary sound cards, which means that it brings to Linux the benefits of IBM''s
    ViaVoice but without the restrictive licensing. Distributed under an X11-like
    license, Festival is quite usable right now; to try it out, visit the Center for
    Speech Technology Research at the University of Edinburgh at [www.cstr.ed.ac.uk/projects/festival](http://www.cstr.ed.ac.uk/projects/festival)
    to get this application.


    There''s a project under way to develop a screenreading program for X, one that''s
    comparable to the screenreaders developed for Microsoft Windows. The software
    is being developed by the Mercator Project at Georgia Tech''s Graphics, Visualization,
    and Usability Center. A port to Linux is under way; visit Brian Seldon''s page
    at [www.henge.com/~brian/ultralin.html](http://www.henge.com/~brian/ultralin.html)
    for more information.


    # For more information


    +   - **BLINUX** ([http://leb.net/blinux](http://leb.net/blinux)) This site is
    devoted to improving the usability of Linux for people who are blind. There are
    three mailing lists (blinux-announce, blinux-develop, and blinux-list).

    - **Visible Bell mini-HOWTO** ([www.caldera.com/LDP/HOWTO/mini/Visual-Bell.html](http://www.caldera.com/LDP/HOWTO/mini/Visual-Bell.html))
    This mini-HOWTO shows how to implement a visual bell for users with limited hearing.

    - **X11-Big-Cursor mini-HOWTO** ([www.caldera.com/LDP/HOWTO/mini/X-Big-Cursor.html](http://www.caldera.com/LDP/HOWTO/mini/X-Big-Cursor.html))
    This mini-HOWTO explains how to enlarge the X cursor for users with limited vision.'
