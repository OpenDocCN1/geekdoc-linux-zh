    Qmail also supports user-specific aliases, which provide greater flexibility to
    your users. For example, suppose you have a user with the e-mail address *joe@mydomain.com*.
    Joe is a local user with a */home/joe* directory, and he collects his mail via
    POP3—just like any normal e-mail user. Perhaps Joe wishes to set up his own mailing
