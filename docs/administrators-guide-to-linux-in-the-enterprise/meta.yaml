  md: '# # Virus scanning with Qmail


    *By Vincent Danen*


    In previous articles, I introduced the Qmail mail server ("An overview of Qmail,
    part 1: Installing Qmail" and "An overview of Qmail, part 2: Configuring Qmail")
    as an alternative to the *postfix* and *sendmail* mail servers. Qmail is a high-capacity,
    scalable mail solution that runs under Linux and other UNIX variants. It can be
    used as a single-user MTA solution or as a full-blown enterprise mail system.


    With the proliferation of viruses available on the Internet, many ISP and company-run
    mail server administrators are looking at options to filter attachments and scan
    for viruses at the mail-server level. While virus scanners for Linux are not as
    numerous as those for Windows, there are some commercial virus-scanning solutions
    available. Integrating the virus scanner into Qmail at the queueing level can
    be a challenge, but the end result is a server that scans for viruses on every
    incoming and outgoing message.


    In this article, I will explain how to install the AMaViS wrapper program based
    on the usage of the Sophos Anti-Virus solution, but you may choose to use a different
    virus scanner. I will also list and explain several other virus-scanning options.


    For those who run a mail server for their company or to service external customers,
    removing viruses before the offending message is even delivered to the client
    minimizes the risk of spreading it. So, even if Outlook users tend to open and
    run every virus that hits their system, by including a wrapper program with an
    antivirus solution in Qmail, you can reduce the number of infections. If every
    mail server on the Internet scanned for viruses at a server level, the spread
    of such viruses would greatly decrease.


    Setting up the wrapper script to run the antivirus program on Qmail is the easy
    part. The more challenging activity is finding an appropriate antivirus solution.
    With the selection of scanners varying significantly in price, it would probably
    be best if you research and try as many of them as you can before settling on
    a solution. The most expensive may not necessarily be the best for your needs,
    and the cheapest may actually work better. Another important factor to keep in
    mind is the speed of the scanning. If the scanner takes two seconds to scan an
    e-mail message and your site has high traffic, you may encounter a significant
    slowdown in your e-mail processing time. This is another reason you will want
    to experiment with the different scanners before making the final decision.


    # ## AUTHOR''S NOTE


    > You may also want to invest in some extra horsepower for your system. Qmail
    does not itself require anything fancy, but if you are scanning each message coming
    into or leaving your system, you may want something with a little more power to
    handle the load.


    Since there aren''t very many scanners to choose from that work with Linux, you
    may have limited options. Also, the available virus scanners out there can vary
    greatly in performance. Sophos, the virus scanner I will use in my installation,
    has probably the best customer technical support system out of any of the vendors,
    and the cost involved is more for the support than for anything else. However,
    it''s also perhaps the most expensive virus-scanning solution available. When
    inquiring about Sophos, I was quoted a price for a single server license that
    would be almost $1,500 for a one-year license. You can register to download Sophos
    Anti-Virus from its Web site at


