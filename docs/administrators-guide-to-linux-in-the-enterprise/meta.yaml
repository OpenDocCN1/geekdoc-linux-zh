    # Dealing with power failures


    Eventually, you''ll have to deal with a power failure on your system. My first
    concern when faced with a power failure is to make sure that my servers are shut
    down properly. This ensures that file systems are unmounted properly and that
    data contained in buffers is properly written to the hard disk. The default inittab
    file contains the following line:


    ```

    pf::powerfail:/sbin/shutdown -f -h +2 "Power failure: System Shutting Down"

    ```


    This line tells init to run shutdown in the event of a power failure. The powerfail
    action is enabled when the monitoring software on the Uninterruptible Power Supply
    (UPS), or powerd, the power-monitoring daemon, send the SIGPWR signal to init.
    The default setting allows the UPS to run the system for two minutes prior to
    running the shutdown script.


    If power is restored during the shutdown process, the following line cancels the
    running shutdown:


    ```

    pr:12345:powerokwait:/sbin/shutdown -c "Power Restored. Shutdown Cancelled"

    ```


    When init receives a SIGPWR signal and the file /etc/powerstatus contains the
    text string OK, the powerok action is activated.


    # Managing init files


    The System V init program uses numerous files, symbolic links, and directories.
    Fortunately, Linux includes three tools for managing init files:


    +   - chkconfig

    - ntsysv

    - linuxconf


    # Using chkconfig


    The chkconfig utility allows the administrator to maintain the symbolic links
    required for starting and stopping services in a run-level; chkconfig can manage
    all scripts in the /etc/rc.d/init.d directory. Following are some typical uses
    for chkconfig.


    # List manageable services


    To list what services will start in each run level, use the command


    ```

    /sbin/chkconfig --list

    ```


    To check the run-level configuration for a particular service, use the command


    ```

    /sbin/chkconfig --list inet

    ```


    The preceding command lists the configuration for the inet service in each run-level.
    This command produces the following on my system:


    ```

    inet 0:off 1:off 2:off 3:on 4:on 5:on 6:off

    ```


    The output tells me that the inet service is enabled for run-levels 3 and 5 and
    is disabled for all other run-levels.


    # Add a new service


    To make a new service available to the current run-level, run the following command:


    ```

    chkconfig --add httpd

    ```


    This command adds the httpd service to the current run-level.


    To add a new service to a specific run-level, use the command


    ```

    /sbin/config --level 4 --add inet

    ```


    This command adds the inet service to run-level 4.


    # Delete a service


    To remove a service from the current run-level, use the command


    ```

    /sbin/chkconfig --del inet

    ```


    This command deletes the inet service from the current run-level.


    To delete a service from a specific run-level, use the command


    ```

    /sbin/chkconfig --del gated --level 5

    ```


    This command removes the gated service from run-level 5.


    # Using ntsysv


    The ntsysv utility allows service management through a simple menu interface.
    To run ntsysv for the current run-level, use the command


    ```

    /usr/sbin/ntsysv

    ```'
