  md: '# Using Webmin: One amazing tool for Linux administration


    By Ed Engelking II, A+


    As a Linux Web site administrator, I''m always looking for ways to make life easier
    when it comes to configuring my Linux box. One of the easiest ways of administering
    my machine has come from a Web-based application known as Webmin. In this article,
    I will examine this great tool and show you how you can make it work for your
    UNIX-based organization.


    ![](bbox=[0.43, 0.22, 0.97, 0.49])


    # What is Webmin, anyhow?


    Webmin at its simplest is a Web-based server administration tool. It has been
    built from the ground up to make server administration as simple as possible for
    novice to expert Linux/UNIX administrators. Users who are new to administering
    a UNIX-based environment will appreciate the easy navigation and simple interface,
    while seasoned pros will appreciate the easy configuration of servers, module
    installation, and the other great utilities available.


    +   - **Others Folder:** The Others folder contains services that don''t quite
    fit under the previous folder categories listed. In the standard configuration,
    you can find services such as a Java-based file manager, installation and configuration
    of Perl modules, and system/server statistics.


    # What can Webmin do?


    The real question here should be what can''t Webmin do. Here are a few examples
    of services available through Webmin:


    # Information on specific services available


    +   - **System Folder:** In the standard System folder, administrators can configure
    boot-up and shutdown options, add/delete users and groups, install/remove software
    packages, view system logs, and start/stop the running process.


    As a Web administrator, there are two tools that help me operate my Web server
    on a daily basis: Apache Web Server configuration and Users And Groups configuration.


    # Apache Web Server tool


    +   - **Servers Folder:** (See **Figure A**.) In the standard Servers folder,
    administrators have access to Apache configuration services, DNS configuration
    services, DHCP services, FTP Server configuration, MySQL configuration, Samba
    configuration (including SWAT), and Proxy services.


    The Apache Web Server tool is by far the best module available on Webmin, in my
    opinion. With this tool, I am able to start, stop, and restart my Apache Web server
    by simply clicking a link available in the configuration page.


    I am also able to add virtual hosts on my Web server with little to no trouble
    at all. Without Webmin, if I wanted to add a new virtual host in my Apache server,
    I would have to physically edit my httpd.conf file and add the information line-by-line.
    With Webmin, I click on the Virtual Host link to add a new virtual host and enter
    the information in the available


    +   - **Hardware Folder:** In the standard Hardware folder, admins have the option
    of configuring the Linux Bootup configuration, RAID devices, network configuration,
    partitions, and printer administration.'
