    +   - The *DOMAINNAME* line specifies the domain name for this network and is
    normally set during Linux installation.


    +   - The next two lines specify information necessary to determine the default
    gateway for this computer. Although this server will function as a gateway, it
    actually accesses the Internet through another gateway. In this case, that gateway
    is supplied by the ISP. The *GATEWAYDEV* line is necessary when more than one
    network interface is configured on a system. When multiple interfaces are configured,
    the *GATEWAYDEV* line always specifies the device that''s connected to the default
    gateway provided by the ISP.


    +   - The *IPADDR=* line specifies the IP address for the interface.


    +   - The *NETMASK=* line specifies the subnet mask (netmask) for this network.


    +   - The *NETWORK=* line specifies the address of this network.


    +   - The *BROADCAST=* line specifies the broadcast address for this network.


    +   - The *ONBOOT= yes* line ensures that this interface will be activated when
    the system is booted.


