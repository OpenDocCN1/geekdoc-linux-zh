  md: 'install another package that provides POP3 services. Qmail is a very secure
    and reliable MTA. Its new mailbox format makes it more resistant to corruption
    if a system crash occurs during delivery. Qmail is supposed to be one of the most
    efficient mail servers; on a Pentium computer that runs BSD/OS, Qmail can easily
    sustain 200,000 local messages per day, with separate messages injected and delivered
    to mailboxes in a live test. Qmail also overlaps 20 simultaneous deliveries by
    default, and it handles mailing list messages very quickly.


    Qmail is much smaller than other MTAs because it has one delivery mode and one
    forwarding mechanism instead of having a variety of delivery modes and segregated
    delivery mechanisms. Qmail is an acceptable replacement for sendmail. Once Qmail
    is installed and configured correctly, programs that rely on sendmail won''t recognize
    a difference between the two MTAs.


    # How it is installed


    Unfortunately, Qmail isn''t the easiest package to install. While you can find
    sendmail, postfix, and other SMTP servers in simple RPM or DEB packages, Qmail
    must be compiled on the system upon which it''s going to be installed. This task
    can become a little tricky for people who have never compiled a program or recompiled
    an RPM package. For this article, I''m going to describe the steps of installing
    Qmail as a replacement for your current MTA. The computer I''m using is a Pentium
    166mHz with 128MB RAM that runs Linux Mandrake 7.0.


    # Getting the source


    First, you should mirror the Qmail distribution site. Download all of the included
    subdirectories and files. You won''t use all of them, but downloading everything
    makes it easier to find anything you need. You can obtain all of the subdirectories
    at ftp://moni.msci.memphis.edu/pub/qmail. For my example, I''ll mirror the remote
    directory into the /usr/src/qmail directory.


    # The installation


    After you''ve finished mirroring the remote directory, enter the /usr/src/qmail/var-qmail


    directory. This is where the primary Qmail package is located. Before we install
    Qmail, however, we need to prepare the system for the installation. Since the
    installation creates a number of local users, we must stop the ypbind service
    if the installation computer is an NIS client system. You also need to remove
    the file that corresponds to the NIS domain by issuing: rm -f /var/yp/binding/*


    Now, we must stop sendmail or your current MTA. If you''re running RedHat, you
    will have sendmail by default; later versions of Linux Mandrake use postfix by
    default. To remove sendmail from the system, type: rpm -e --nodeps sendmail


    If you''re using postfix or Exim, exchange the package name with sendmail in the
    second command that I listed. Now, you''re ready to begin building your Qmail
    packages. Since you''re still in the /usr/src/qmail/var-qmail directory, build
