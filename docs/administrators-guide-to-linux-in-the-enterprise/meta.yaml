  md: '# # Can UDMA work with Linux? Why, of course it can


    *By Jack Wallen, Jr.*


    As time marches on, so does technology. As technology marches on, so must our
    knowledge. Take, for instance, the moment I was faced with my first Linux installation
    with an Ultra DMA 100 hard drive! What an experience this turned out to be! Are
    you laughing? You probably shouldn''t be if you plan on installing Linux on one
    of these systems. Fortunately for you, I''ve taken the time and gone through the
    suffering so that I may bring you a bit of good news, a smidge of bad news, and
    a touch of relief.


    The good news is that you can, in fact, install Linux onto Ultra DMA disk drives...
    and it works very nicely. The bad news is that it takes some time, effort, and
    the tearing down of your machine. The relief? Well good ol'' Jack is gonna show
    ya just how to make it all good!


    # ## First things first


    First you need to verify that you are, indeed, running an UDMA system. There are
    a couple of ways to do so. If you already have Linux installed (and are wanting
    to upgrade or re-install) you can run the *mount* command without options, like
    so:


    ```

    mount

    ```


    The *mount* command will report, among other things, what device name your hard
    drive is labeled. Generally this is going to be something like */dev/hda*. What
    we''re looking for is the *a* in *hda*. Should this be an *e* or an *f*, then
    more than likely you''re running an Ultra DMA drive. Pretty simple, I''d say.


    The next method involves taking a peek inside your machine. What you want to do
    here is look at where your hard drive is plugged into the motherboard. If the
    connector (on the motherboard) is blue, then you''re dealing with UDMA. If the
    connector is not blue, then more than likely it is IDE. (Yet another simple method
    of detecting the type of drive you are running.) On my test system the UDMA controller
    was an on-board UDMA 100 controller.


    # ## On to the installation


    Okay, before we go any further, I''m going to make this very clear: BACK UP YOUR
    SYSTEM! Any time you are dealing with hardware you run the risk of losing data...
    your data! Back up everything that you possibly can before you move on to these
    next steps.


    Have you backed up? If not, go back to the previous paragraph and read it one
    more time, with feeling.


    Okay... now we''re set. Let''s set this puppy to barking!


    # ## Return to sender: Address unknown


    The first thing you need to do is figure out just where your UDMA control lies.
    The Linux kernel sees these (IDE and UDMA controllers) as very specific addresses,
    and you are going to have to tell that kernel where you want it to play.


    There''s a file within your */proc* directory called *pci* which will serve you
    up more information than you ever thought you could need. To view this file, run
    the command:


    ```

    less /proc/pci

    ```


    and you will be greeted with a rather lengthy text file that resembles:


    ```

    PCI devices found:

    Bus 0, device 0, function 0:

    Host bridge: VIA Technologies Unknown device (rev 2).

    Vendor id=1106. Device id=305.

    Medium devsel. Master Capable.

    No bursts.

