    # # Helping Linux make a leap into the enterprise with ReiserFS


    *By Vincent Danen*


    You may have heard the term "journaling file system" and wondered what the fuss
    was all about. It''s not a new term, by any means, but it is relatively new to
    Linux. Let me explain. Traditionally, Linux has used extended file system 2, or
    *ext2*, for its primary file system. This is like the FAT file system for DOS,
    HPFS for OS/2, or NTFS for Windows NT. None of these file systems, however, is
    a journaling file system.


    Started in 1993 by Hans Reiser, ReiserFS is a file system that''s becoming increasingly
    popular among Linux users. As it stands, ReiserFS is known primarily as a journaling
    file system, but it has the potential to become much more than just that. The
    author has expressed that'
  merge: -1
  pgno: 238
- img_proc: false
  md: 'the long-term goal for ReiserFS is to move database- and keyword-searching
    options into the file system itself. The advantages to such a file system should
    be clearly obvious. Fast file finds are the least of what this potential file
    system would have to offer. The ReiserFS is modeled after the AS400, because like
    the AS400, it has a relational database as its core. Combining the relational
    database nature of the AS400 with the many benefits of traditional UNIX file systems
    is the hope for the ReiserFS project of the future.


    # ## What is a journaling file system?


    Due to its complexity, I''m going to give you a very brief overview of a journaling
    file system. Describing the theory and working architecture behind a journaling
    file system and ReiserFS itself is beyond the scope of this article.


    To say it more sufficently, a journaling file system uses a database to store
    information about the file system as opposed to the way a traditional file system
    (like *ext2*) uses a program, such as *fsck*, to check the entire partition. Consequently,
    after a system crash (or an accidental reset), ReiserFS merely needs to consult
    the transaction log to determine whether or not there are any problems with the
    state of the file system.


    The term "journaling" comes from the fact that ReiserFS—and any other journaling
    file system—journals (or logs) transactions by first writing them to a log buffer,
    then asynchronously writing the log buffers to the on-disk log. After a crash,
    the ReiserFS recovery tool, *reiserfsck*, reads the on-disk log. If necessary,
    transactions are repeated to ensure that the file system remains in a consistent
    state.


    The long and short of this is that if there is a problem—if your system crashed
    or your cat brushed up against the reset button—the system will restart much faster
    with ReiserFS partitions than with regular *ext2* partitions. Unfortunately, I
    cannot provide you with details on how much faster simply because I have no more
    *ext2* partitions left to benchmark against. But, there is a remarkable increase
    in system boot up speed. And, depending on how often the system has rebooted,
    you may no longer need to worry about periodic *fsck* checks during boot up. ReiserFS
    handles all of this quickly and efficiently.


    You''ll notice also that you''re no longer limited to file sizes of approximately
    2 GB as you are with the *ext2* file system. Files and directories can be as large
    as you want them to be. You''ll suffer a marginal performance hit with larger
    directories or files, but not nearly as much as you would using *ext2* (if the
    file you''re using would even fit in an *ext2* partition!).


    # ## Compile ReiserFS into your kernel


    ReiserFS is being used on Linux systems as a replacement for *ext2*. While there
    are other journaling file systems in the works, ReiserFS is by far the most mature.
    Not in terms of overall design, however, (after all, XFS has been used on IRIX
    systems for years) but in Linux usability. ReiserFS can be used by people running
    Linux now, whereas SGI''s XFS and IBM''s JFS still have some work ahead of them
    to be able to port those file systems and associated utilities to Linux. Plus,
    they must be stabilized in order to be used in production environments.


    This, in and of itself, makes ReiserFS very attractive right now. It can be used
    immediately, and people can see the benefits immediately. While waiting for something
    like XFS—which may end up being more robust and stable considering the company
    behind it and how long it has been used—might be an option for some, others don''t
    see the need to wait. ReiserFS fills a need, and it does it very well.


    The stages of use for ReiserFS vary from distribution to distribution. For instance,
    Linux-Mandrake 7.1 was the first version of Linux-Mandrake to include support
    for ReiserFS.


    > > The long and short of this is that if there is a problem—if your system crashed
    or your cat brushed up against the reset button—the system will restart much faster
    with ReiserFS partitions than with regular ext2 partitions.'
