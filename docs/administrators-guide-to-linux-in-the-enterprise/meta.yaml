    # Ooey gooey


    As shown in Figure A, the *userconf* GUI is fairly straightforward. Like the other
    modules in *linuxconf*, *userconf* is set up with tabs and buttons that make its
    use very simple.


    This application can only be called by root and is called with the command:

    /sbin/userconf


    When you run this command, the *userconf* tool appears, and you''re ready to get
    to work.


    # Normal users


    The Normal tab is where you do most of your work with *userconf*. Within the normal
    users, you will add/delete/modify user and group information. Before this tool,
    you were stuck using the confusing *useradd* and *groupadd* commands. Well, times
    are a-changin'', and even Linux administrators can do routine tasks via GUI.


    Once you open the Normal tab, click on the User Accounts button and you''ll see
    a new window that looks much like Figure B.


    Once this window is open, click on the Add button, and a new window will appear
    (see Figure C) where you will enter the user''s information. You will need to
    supply three critical pieces of information. The first is the Login Name, which
    is what the user will be known by within the Linux system. A word of


