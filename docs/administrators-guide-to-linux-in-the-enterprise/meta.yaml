  md: 'remove the /dev/sndstat file and create a new link to /proc/asound/sndstat
    with the commands

    rm /dev/sndstat

    ln /dev/sndstat /proc/asound/sndstat


    > **NOTE**

    On most Linux distributions, the group *audio* will own the device files created
    by this process. Only users who are members of this group will be able to read
    and write to the audio hardware (sound card). Users who require the ability to
    configure the sound card will need to be made members of this group.


    At this point, the ALSA drivers are installed, but they are not yet configured.
    The *alsaconf* utility creates ALSA configuration files automatically, but *alsaconf*
    requires that the ALSA libraries and the ALSA utilities be installed first.

    The configuration process for the ALSA library and ALSA utility packages normally
    doesn''t present any problems. To configure the ALSA libraries, run the commands:

    tar -Ixvf alsa-lib-0.5.10.tar.bz2

    cd alsa-lib-0.5.10

    ./configure

    make

    make install

    Repeat the process for the alsa-utils package. Once these packages are installed,
    you''re ready to start configuring ALSA.


    # Step six: Configuring ALSA with alsaconf


    The *alsaconf* utility makes the process of setting up ALSA a lot simpler. This
    utility is actually a script that allows the user to select the sound card and
    then automatically generates the necessary configuration files.

    Remember that ALSA also requires kernel modules to be loaded to provide support
    for a specific sound card. There are two common ways of loading kernel modules.
    The first is to use the *modprobe* command to load the appropriate module whenever
    support for the sound card is required. On my system, I would run the following
    command as root to load the kernel module for my sound card:

    modprobe snd-card-ens1371


    Unfortunately, this method requires that the kernel module for your sound card
    be loaded each time you boot your system. Another way of ensuring that the proper
    kernel module is loaded when the system is started is to ensure that the module
    is associated with the sound in the /etc/modules.conf file. This file is read
    when the system is booted and tells *modprobe* which modules are associated with
    which device on your system. The *alsaconf* utility is used to automate the process
    of creating the correct entry in the /etc/modules.conf file. The first step is
    to untar and uncompress the *alsaconf* package with the command:

    tar -zxvf alsaconf-0.4.3b.tar.gz

    Next, run the command

    cd alsaconf-0.4.3b

    and then run the command

    ./alsaconf

    When *alsaconf* is running, take the following steps:

    1. Select the correct sound card type for your system.

    2. Choose an identifier for your card or select the default CARD_0.

    3. Select "no more cards" when you have made your choices.

    4. The *alsaconf* script will now generate the appropriate /etc/conf.modules file
    for your system and will try to start ALSA.


    # Step seven: Test ALSA on your system


    Assuming ALSA will start successfully, the /proc/asound directory will be created.
    To confirm that this directory exists, run the command

    cat /proc/asound/devices

    If the directory has been created, the output to the previous command will be
    similar to the text in **Table A**.


    Table A: *Output of cat /proc/asound/devices*

    | ID | Range | Description |

    |---|---|---|

    | 0: | [0]: | Control |

    | 6: | [0- 0]: | Mixer |

    | 16: | [0- 0]: | Digital audio playback |

    | 24: | [0- 0]: | Digital audio capture |

    | 33: | : | timer |'
