    # Routing with Linux


    *By Vincent Danen*


    The Linux operating system makes a perfect solution to your routing needs. With
    phenomenal uptime and simple configuration, Linux can provide you with much-needed
    relief from your routing woes. In this article, I will introduce you to routing
    and then to routing with the Linux operating system.


    Well, your system sends the packets that consist of your e-mail message to your
    specified gateway. The gateway then forwards the packets to another gateway, or
    router. The process continues until the packet arrives at your friend''s system
    and he or she reads the message. This is true for all Internet protocols, whether
    it is FTP, HTTP, IRC, and so on.


    # What is routing?


    Whether or not you''re aware of how it works, every time you connect a computer
    to a network, you are dealing with the issue of routing. Routing is a means of
    sending an IP packet from one point to another. For instance, when you send an
    e-mail message to your friend in another country or even across the street, you
    are transmitting a series of IP packets, or datagrams, from your computer to your
    friend''s computer. So how does this information get there?


    If you have a single computer, you typically do not need to worry about routing.
    You simply tell your computer to use the IP address of the gateway supplied by
    your ISP and off you go. If, however, you run a network of computers, this can
    become a little bit more of an issue. If you place a firewall in front of your
    network, you need to configure things further. With this setup, you are actually
    dealing with two networks: your local network and the Internet. Packets coming
    from one to the other need to be forwarded in special ways so they arrive at their
    appropriate destinations.'
