    # Don''t look now, but Linux 2.4 is enterprise-ready


    *By Jason Hiner, MCSE, CCNA*


    The Linux 2.4 kernel gives the operating system a lot more ammunition in its server
    war against Novell NetWare, Microsoft Windows NT/2000, and commercial UNIX vendors
    such as Sun Microsystems. The 2.4 kernel systematically addresses and remedies
    the main weakness that has kept Linux from winning more servers in the enterprise:
    scalability. Let''s compare Linux to the network operating systems that currently
    dominate the enterprise. Table A shows how they stack up.


    # Table A


    | | Processors | RAM |

    |:---|:---|:---|

    | Linux 2.4 | 8+ | 64 GB |

    | Linux 2.2 | 4 | 2 GB |

    | NetWare 5.1 | 32 | 4 GB |

    | WinNT EE | 8 | 4 GB |

    | Win2K AS | 8 | 8 GB |

    | Win2K DC | 32 | 64 GB |

    | Solaris 8 | 64 | 64 GB |


    WinNT EE = Windows NT Server 4.0 Enterprise Edition

    Win2K AS = Windows 2000 Advanced Server

    Win2K DC = Windows 2000 Datacenter


    # Improvements


    The changes in Linux 2.4 deal mainly with the internal infrastructure that governs
    how the OS gets things done. The most notable improvements occur in the following
    areas:


    +   - Optimization for symmetrical multiprocessing (SMP)

    - Support for up to 64 gigabytes of RAM


    +   - Rewritten network layer for better performance and throughput

    - Expanded hardware support

    - Support for a large number of users and for larger file sizes'
