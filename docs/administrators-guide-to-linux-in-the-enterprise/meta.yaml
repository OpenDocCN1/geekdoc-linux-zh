    *eth0* is attached to the 10.0.0.0 network, while *eth1* is attached to the 192.168.10.0
    network. This firewall needs to route packets from the 10.0.0.0 network through
    the 192.168.10.0 network, which will in turn forward packets to the Internet.


    The first argument passed to *route* will be either *add* or *del*, which will
    tell *route* if it is adding or deleting a route from the routing table. The rest
    of the arguments that *route* uses are dependant upon which action you have chosen.


    In this scenario, you''d set up the firewall system with two IP addresses: 10.0.0.1
    on *eth1* and 192.168.10.25 on *eth0*. The gateway to the Internet on the 192.168.10.0
    network is still 192.168.10.1. On the firewall system, you would run *route* with
    the following commands:


    Let''s take a look at creating the routing table so that we have defined the same
    routes, as shown in the previous example. The first thing you need to do is add
    the network to which you belong by using:


    ```

    route add -net 192.168.10.0 netmask 255.255.255.0 dev eth0

    ```


    ```

    route add -net 192.168.10.0 netmask 255.255.255.0 dev eth1

    route add default gw 192.168.10.1

    route add -net 10.0.0.0 netmask 255.0.0.0 dev eth0

    ```


    This will add the network 192.168.10.0/255.255.255.0 to the Ethernet device *eth0*.
    This corresponds with the first line shown in the output.


    On the router, this defines both networks: 192.168.10.0 on *eth1* and 10.0.0.0
    on *eth0*. It also assigns 192.168.10.1 as the default gateway.


    To add the loopback network, you would use:


    ```

    route add -net 127.0.0.0 netmask 255.0.0.0 lo

    ```


    On the computers in the 10.0.0.0 network, you would use *route* like this:


    ```

    route -net 10.0.0.0 netmask 255.0.0.0 dev eth0

    route add default gw 10.0.0.1

    ```


    This adds the network 127.0.0.0/255.0.0.0 to the Ethernet device *lo*, which represents
    the loopback (or local) network. It is not necessary to do this if you''re using
    Linux kernels 2.2 or higher, as those kernels will handle this automatically.


    This tells each computer that the default gateway is 10.0.0.1, which is your firewall/router.


    Finally, you need to add the default gateway using:


    ```

    route add default gw 192.168.10.1

    ```


    With both the firewall and the 10.0.0.0 network set up, you should be able to
