    # Using GRUB


    GRUB works in a very different way. It comes with an interactive script called
    *grub-install*, which is how you should initially configure it, unless you really
    know what you''re doing. You will need to have GRUB installed first; most distributions
    also come with GRUB, but if not, you can download it from the GNU.org site at
    **www.gnu.org/software/grub**.


    To begin the configuration, issue the following as root:


    ```

    grub-install /dev/hde

    ```


    where */dev/hde* is the primary drive to boot from. Again, */dev/hde* is the primary
    ATA100 drive, but if you use ATA33 or ATA66 drives, be sure to use */dev/hda*.


    Once *grub-install* runs for the first time, it will create a file called */boot/grub/device.map*
    and will print the contents of that file to the screen. This will list all of
    the drive devices on your system, including your floppy drive. After running *grub-install*
    here, my */boot/grub/device.map* file looked like **Table A**.


    Table A: *The device.map file*


    | (fd0) | /dev/fd0 |

    |---|---|

    | (hd0) | /dev/hde |

    | (hd1) | /dev/hdf |

    | (hd2) | /dev/hdg |


    If this looks correct, you will then need to create the GRUB configuration file:
    */boot/grub/menu.lst*. Let''s look at an example configuration file, shown in
    **Listing A**.


    # Keywords


    The *default* keyword tells GRUB to boot the first definition by default; in this
    case, it will be the one titled Linux.


    The *timeout* keyword tells GRUB to wait 5 seconds before booting automatically.
    Unlike LILO, GRUB uses seconds, not tenths of a second.


    The *i18n* keyword tells GRUB which file to use for its message file, which will
    be shown'
