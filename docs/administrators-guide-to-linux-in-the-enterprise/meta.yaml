  md: "```\n# \"Smart\" relay host (may be null)\nD$smtp.myisp.com\n```\n\nAn interesting\
    \ feature allows relaying based on the MX records of the host portion of an incoming\
    \ recipient address. If this is enabled, another domain can add you as an MX record\
    \ in its DNS setup and relay its mail through your system, with no prior arrangement\
    \ with you. Consequently, use caution in enabling this feature.\n\n```\nFEATURE('relay_based_on_MX')\n\
    ```\n\nSimilarly, the feature:\n\n```\nFEATURE('relay_local_from')\n```\n\nallows\
    \ spammers to relay through your system by simply specifying a return path, which\
    \ is a local domain. Again, caution is advised. You can control this further by\
    \ using:\n\n```\nFEATURE('relay_mail_from')\n```\n\nThis allows relaying if the\
    \ mail sender is listed as RELAY in the access map.\n\nIf you've ever set up your\
    \ own Linux box with a made-up domain and then tried to send Internet mail only\
    \ to find it bounced right back at you, you probably encountered a system that\
    \ had not enabled the following feature:\n\n```\nFEATURE('accept_unresolvable_domains')\n\
    ```\n\nYour fancy myscreamingmachine.myhouse.org domain name is not resolvable\
    \ out on the greater Internet's DNS, so whatever system received the message refused\
    \ to accept it. By default, sendmail comes with this feature disabled.\n\nIf you\
    \ want to fine-tune control of which domains (and even users) you will accept\
    \ mail from, then use:\n\n```\nFEATURE('access_db',\n  'hash /etc/mail/access')\n\
    ```\n\nYou can specify a second parameter with the name of the access file; don't\
    \ forget that you'll need to use makemap again to create a database file from\
    \ the text file. You can specify domains or individual users on the left-hand\
    \ side of the file, with REJECT, OK, RELAY, DISCARD, or various ERROR messages\
    \ on the right-hand side:\n\n| | |\n|---|---|\n| spammer@yahoo.com | REJECT |\n\
    | cyberspammer.com | REJECT |\n| mybuddy@cyberspammer.com | OK |\n\nYou can also\
    \ set up a \"blacklist\" for your own systems and users, using:\n\n```\nFEATURE('blacklist_recipients')\n\
    ```\n\nAgain, this is a tabular list and can have users and domains (see **Listing\
    \ C**), which forces clients to check their incoming mail on the POP server before\
    \ they can send outgoing mail through the Simple Mail Transfer Protocol (SMTP)\
    \ server.\n\nSince many mail clients act in just this manner anyway, nothing special\
    \ is required of the user, and only users with authorized mail accounts can relay\
    \ mail through the server.\n\nThat covers most of the common controls on what\
    \ mail will pass through your server. There are others, and the sendmail site\
    \ covers them in detail at **www.sendmail.org**.\n\n# Running in test mode\n\n\
    Another interesting way you can run sendmail is in test mode, which allows you\
