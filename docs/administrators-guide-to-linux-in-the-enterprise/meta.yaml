  md: '# Mounting Windows shares to a Linux directory


    If you''re using the Samba server as a workstation, you may wish to access your
    shares on your Windows system. This is a handy configuration for a one-person,
    two-computer (or more) network in which you''re using Linux and Windows.


    To mount and unmount your Windows shares on your Linux workstation, you can use
    the utilities supplied with Samba (*smbmount* and *smbumount*). You''ll want to
    make these utilities accessible to ordinary users by turning the SUID (set user
    ID) bit on for both of these utilities. Note that this procedure entails a security
    risk if you''re configuring a workstation on a wide-open network, such as a university
    network, but it shouldn''t pose unacceptable risks in a small, private network.


    To modify *smbmount* and *smbumount* so that you can access these utilities from
    your ordinary user account, first open a terminal window and log in as superuser.
    Next, type `chmod u+s /usr/sbin/smbmount` and press [Enter]. Then, type `chmod
    u+s /usr/sbin/smbumount` and press [Enter].


    For the next step, you''ll need to know the exact name of the share you want to
    mount. To do so, type *smbclient -L* followed by two slashes and the name of the
    computer that contains your Windows share (such as *//lothlorien*). You''ll be
    asked to supply your password. When you''ve done so successfully, you''ll see
    a list of the available shares. From this list, identify the share that you want
    to mount, such as *//lothlorien/suzanne*.


    Before you can mount the Windows share on your Linux system, you''ll need to create
    a mount directory. It''s convenient to place this directory within your home directory,
    where it''s easily accessible.


    To create the mount directory, log off the superuser account (type *exit* and
    press [Enter]). In your home directory, create a directory that you''ll use to
    mount the share. To create */home/suzanne/lothlorien*, for example, you''d type
    `mkdir /home/suzanne/rivendell` and press [Enter].


    Now that you''ve created the mount directory, you can use *smbmount* to mount
    the share to this directory. To do so, log in to your ordinary user account and
    open a terminal window. Type *smbmount* followed by the share''s name (such as
    *//lothlorien/suzanne*) and the name of the mount point (such as */home/suzanne/lothlorien*),
    and press [Enter]. Note that the mount point—a directory—must exist in order for
    this command to succeed. Here''s an example:


    ```

    smbmount //lothlorien/suzanne /home/suzanne/lothlorien

    ```


    You''ll be prompted to supply this user''s password. Do so, and press [Enter].
    If you''d like to unmount the share, just type *smbumount* followed by the name
    of the mount point (for example, *smbumount /home/suzanne/lothlorien*). Like to
    mount this share automatically every time you log in? Just add the *smbmount*
    command to *.bash_profile* in your home directory.


    # Conclusion


    In this two-part series, I''ve walked you through all the procedures you need
    to follow in order to configure Samba file exchange on your network.'
