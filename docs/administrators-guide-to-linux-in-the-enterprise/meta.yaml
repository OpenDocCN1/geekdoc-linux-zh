    # Configuring encrypted passwords


    If you chose to use encrypted passwords with Samba, you''ll need to modify your
    Samba system to work with the encrypted passwords the Windows clients will send.
    The Windows password encryption format isn''t compatible with the default password
    encryption system used on Linux systems. As a result, you''ll need to create an
    additional password file for Samba users, one that conforms to the Windows format.
    This isn''t an attractive solution; the two password files aren''t in sync, so
    you''ll need to update the files if one of the passwords changes. But it works.


    The following procedure creates a Samba password file located in `/usr/local/samba/private`,
    which you''ll modify so that it cannot be viewed by anyone except the root user.
    You''ll then use a script provided with the Samba distribution, called `mksmbpasswd`,
    to extract the usernames from the default Linux password file—`/etc/passwd`—and
    write them, in the Windows encryption format, to `/usr/local/samba/private/smbpasswd`.
    Although this file contains all the usernames of the users on your system, it
    doesn''t contain passwords, so you''ll need to supply these using the `smbpasswd`
    utility, which is also provided with the Samba distribution.


    > **IMPORTANT**


    Be sure to log in as root user or superuser.


    Create a directory to store the encrypted password file by typing `mkdir /usr/local/samba/private`
    and pressing [Enter]. Change the permissions on this directory so that it is invisible
    to all users except root. To do so, type `chmod 500 /usr/local/samba/private`
    and press [Enter]. Now you''ll extract the Linux password


    words from `/etc/passwd`, the default password file on Linux systems, and write
    them to a new file named `/usr/local/samba/private/smbpasswd`. You''ll do so with
    the `mksmbpasswd.sh` script, which is provided with Samba.


    Find out where the script is installed by typing `mksmbpasswd.sh` and pressing
    [Enter]. If the script isn''t on the default path, be sure to include the pathname
    in the next step''s command.


    Launch the script using the following command:


    ```

    cat /etc/passwd | mksmbpasswd.sh > /usr/local/samba/private/smbpasswd

    ```


    Then, open `/usr/local/samba/private/smbpasswd` with a text editor. As you''ll
    see, each user''s password is defined on a single (rather lengthy) line. Enlarge
    the window''s size, if necessary, so you can see the whole line. Now delete all
    the entries *except* the ones for the users to whom you''re granting access. In
    particular, be sure to delete *root*, *cron*, and *daemon*!


    Finally, save the file, and exit the text editor. The file you''ve just created
    contains usernames, but the password fields are blank. You must now define passwords
