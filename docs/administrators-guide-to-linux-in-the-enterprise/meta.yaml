  md: 'advice: Here at TechRepublic, my network login name is *wallenj*. I use that
    as my Linux login name, which makes using such tools as *smbmount*, pine, and
    *ssh* that much easier.


    The next bit of information you may find critical is Full Name. Why, you ask,
    might Full Name be critical? Within a large corporation, you might have any number
    of employees logged on to a system. As an administrator, you might not remember
    what name is associated with a particular user. (Perhaps your Linux users aren''t
    all using their network login names as their Linux login names.) In order to find
    the information associated with a login name, you could simply *finger* the user@domain
    and discover the full name—simple and quick information gathering.


    The last critical bit of information you will enter into the user account creation
    window (see Figure C) is under the Params tab (see **Figure D**).


    You can configure a user''s password to expire on the Params tab. This is often
    a good way to make your users change their passwords every so often. As you can
    see in Figure D, the default is set to make the user change the password after
    99,999 days. Since it''s highly doubtful any users will be using their Linux machine
    after 276.24 years, you can configure this section how you like, but remember
    that you are dealing in days.


    Within this same window, you can set a user account to expire after a particular
    number of days as well. This can be useful when you need to create a temporary
    user account. By setting the account to expire after a number of days, you can
    ensure that you will not have stray accounts begging for nefarious activity. If
    you configure an account to expire after a given date, you can use the Warn #
    Days Before Expiration feature on this window to send a warning before the account
    expires.


    # ## Group definitions


    You can set group definitions by clicking the Group Definitions button on the
    Normal tab. Much of the group configuration is similar to the user configuration.


    On the Group Definitions window, click the Add button and you will see a new window
    open (see **Figure E**). In this Group Specification window, you will see two
    tabs. The first tab, Base Info, allows you to configure the Group Name, Group
    ID, and Alternate Members. It is best to leave the Group ID set to what the system
    offers (unless you have a very good reason to configure your own).


    The second tab is used to configure the directories of the group. Under this tab,
    you will enter the Home base directory for the new group and the Creation Permissions.
    For security reasons, it''s best to leave the permissions set as the system configures
    them.


    Often, you do not need to give a group a home base directory, but there are times
    when you may want to. Should you wish to do so, you will do it under the Directories
    tab. By


