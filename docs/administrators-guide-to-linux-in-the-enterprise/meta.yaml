    # Giving users permission to run shutdown


    In its default configuration, the `/etc/inittab` file gives any user the ability
    to reboot a Linux server using the [Ctrl][Alt][Delete] key combination. The following
    line in `/etc/inittab` allows this action:


    `ca::ctrlaltdel: /sbin/shutdown -t3 -r now`


    This line allows the [Ctrl][Alt][Delete] key combination to be used for rebooting
    and calls the *shutdown* script to reboot immediately. To disable this function,
    add a comment (#) to this line or remove it from the `/etc/inittab` file. To give
    specific users permission to use the *shutdown* script, create the `/etc/shutdown.allow`
    file.


    **Table B: *Shutdown command examples***


    | Command | Action |

    |---|---|

    | `shutdown -r now` | Shuts down and reboots now. |

    | `shutdown -h 5` | Shuts down and halts the system in five minutes. |

    | `shutdown -k 5` | Does not shut down but sends broadcast message to users. |

    | `shutdown -c` | Cancels a running shutdown. |'
