  md: 'The *smbclient* application has a few other little quirks that might quickly
    become annoying enough to make you shy away from it. One of the more annoying
    is the lack of tab completion. Typically, in a Linux *bash* shell, if you type
    part of a command or filename and hit the [Tab] key, the shell will auto-complete
    the word for you. This feature saves a great deal of repetitive typing and guesswork.
    Once you''ve become accustomed to this feature, you won''t want to compute without
    its help. Within *smbclient*, you no longer have this feature. Instead of tab
    completion, the [Tab] key functions only as a [Tab] key. So when you try to use
    [Tab] for word completion, you''ll end up with something like **Listing A**.


    # Table A


    | ls | dir | du | lcd | cd |

    | pwd | get | mget | put | mput |

    | rename | more | mask | del | open |

    | rm | mkdir | md | rmdir | rd |

    | prompt | recurse | translate | lowercase | print |

    | printmode | queue | cancel | quit | q |

    | exit | newer | archive | tar | blocksize |

    | tarmode | setmode | help | ? | ! |


    The point of the above is to show you an attempt at using tab completion and its
    consequences. Within the mounted share (above) is a directory called *TPG content*.
    When trying to \*\* into that directory, I attempted tab completion, which came
