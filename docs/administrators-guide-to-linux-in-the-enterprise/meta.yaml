  md: '# Changing finger information


    Using the finger command, we can gain information about users on a system. The
    syntax to finger a user is:


    `finger <username>`


    The user''s full name, office location, and phone number are common pieces of
    information that are obtained from finger. The `chfn` command is used to change
    a user''s finger information. To change finger information for jim, the syntax
    would be:


    `chfn jim`


    You''ll be prompted for new finger information for the user. Finger information
    is stored in `/etc/passwd`, but users can create a file called .plan in their
    home directory. The new file will be appended to the information that''s shown
    through the `finger` command.


    # Deleting and disabling users


    To delete a user from your system, use the `userdel` command. The syntax for this
    command is:


    `userdel <username>`


    To delete the contents of the user''s home directory, use the syntax:


    `userdel -r <username>`


    To delete the user guest from your system, run:


    `userdel guest`


    Often, you''ll want to disable an account temporarily to prevent logins. You can
    accomplish this task through any of the following methods:


    +   - Use the `usermod` command to set the user''s password to expire immediately.

    - Create a file named `/etc/nologin`. Place a simple text message in the file
    that explains why users can''t log in. (As long as this file exists, no root users
    will not be able to log in.)

    - Edit `/etc/shells` and append a shell named `/bin/false` to it. Then, run the
    command `usermod -s /bin/false <username>`. (It prevents the user from logging
    in.)


    # Conclusion


    Now, you should be able to add, modify, or delete user and group accounts with
    the commands that I''ve discussed, and you should be able to create root or privileged
    user accounts. In the long run, this knowledge will make your job of administering
    and monitoring users a lot easier. As I mentioned earlier, however, nothing is
    more important than good foresight on your part. If you can spot problems before
    they arise, then you can curtail a lot of frustration and unnecessary down time.


    # Grokking the Linux configuration tools: userconf


    *By Jack Wallen, Jr.*


    One of the tasks you will frequently perform as a system administrator is administering
    user accounts. Whether you''re adding, deleting, or editing, you will deal with
    user accounts on a day-to-day basis. Having the right tools to deal with this
