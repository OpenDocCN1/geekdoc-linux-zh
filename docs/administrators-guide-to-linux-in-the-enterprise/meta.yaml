    # Get Samba running, part 1: Preparing Linux and Windows for Samba


    By Bryan Pfaffenberger


    Samba is the name of an open-source, Linux-based implementation of the Windows
    networking protocols. In plain English, what this means is simple: Once you have
    Samba running on a Linux system, the Linux box will appear in Windows users''
    Network Neighborhood dialog boxes; likewise, Linux users can access directories
    on Windows systems. In addition, users can make their printers available to network
    users, and that''s true whether the printers are attached to Windows or Linux
    workstations. In short, Samba implements transparent resource sharing on networks
    in which Linux and Windows systems coexist, and that''s why Samba is an increasingly
    indispensable resource for Linux users everywhere.


    sufficiently stressed: Samba is well worth investigating even if your network
    is Microsoft-free. There''s no reason you can''t use Samba as your networking
    protocol for a Linux-only network. Compared to the native Linux network resource
    sharing protocols, the Network File System (NFS) and Line Printer Daemon (lpd),
    Samba is easier to implement, more flexible, less likely to bring down workstations
    in the event of a network failure, and easier to administer.


    If there''s a downside to Samba, it''s the package''s complexity. Configured to
    the max, Samba can emulate many of the functions of Windows NT Server, but you''ll
    need a lot of time and NT expertise to implement all of Samba''s capabilities.
    What''s more, you can''t just install Samba and expect to see your Linux system
    in the Network Neighborhood window. You have to prepare your Linux and Windows
    systems properly—and to do so, you''ll need a certain amount of system administration
    expertise that''s often taken for granted in the Samba documents available online—which
    is one of the reasons so many people have trouble getting Samba to work.


    There''s a genuine need for a simple, step-by-step introduction to Samba that
    includes *all* the information you need to get a basic, no-frills Samba system
    working correctly. And that''s just what you''ll find here. This two-part series
    of articles walks you through every step needed to configure your network for
    Samba usage, install and configure the Samba software, and implement reliable,
    easy-to-use file sharing between Linux and Windows systems.


