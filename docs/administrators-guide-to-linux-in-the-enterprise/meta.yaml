    # Process administration in Linux


    *By Jim McIntyre*


    Any time you run a program on a Linux system, an instance of that program is loaded
    into memory. When a program is loaded into memory, it becomes a running task on
    your Linux system. Because processes consume system resources, such as memory,
    CPU time, and disk space, being able to manage processes is an important administrative
    skill. The state of a Linux system at any given time, or any computer system for
    that matter, is determined by the process running on the system at that moment.
    In this article, I''ll provide an introduction to process management on a Linux
    system.


    gram, which is the first process to run on the system. Depending on the system''s
    run level, *init* may then start other processes. Every process on a Linux system
    gets a process identification (PID) number. Because *init* is always the first
    process loaded into memory, it will always have a PID of 1.


    # Starting processes in Linux


    Before we get too involved in processes, I''d like to explain some concepts. Below
    are the main processes and their explanations.


    # Daemon process


    A daemon process is a process that runs continually on your system or is loaded
    into memory only when asked to do so. During the Linux bootup, several daemon
    processes are loaded into memory. Some of the more common daemon processes are
    *dhcpd* (Dynamic Host Configuration Protocol Daemon), *crond* (Cron Daemon), and
    *lpd* (Line Printer Daemon). A daemon process is usually identified by the letter
    d at the end of the process name.


    # Init


    When a Linux system is booted, *lilo.conf* loads the kernel. The kernel in turn
    runs the *init* pro-


    # User process


    A user process, also known as an interactive process, is a process run via a Linux
    shell. All'
