    to make a greater contribution.


    # Why does accessibility matter?


    Organizations should make sure that they''ve equipped people with disabilities
    with computer systems that are as accessible as possible, given the limitations
    of current technology. The main reason, and by far the most important one, is
    that it''s simply the right thing to do. Properly designed and equipped computers'
