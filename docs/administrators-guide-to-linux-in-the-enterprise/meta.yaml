  md: 'supply the full e-mail address. For example, if your primary e-mail address
    were *myemail@otherdomain.com*, you would use the following line:

    `&myemail@otherdomain.com`


    To forward e-mail to local users, you could inject the e-mail directly into a
    mailbox file or a maildir directory. Inside *.qmail-webmaster*, type this line:

    `/home/myemail/Mailbox.webmaster`


    This line will place all e-mail for *webmaster@mydomain.com* inside the mailbox
    file *home/myemail/Mailbox.webmaster*. (You can use any mailbox name you want.)
    For this example, I put all of the e-mail for this alias in a different mailbox
    file from the standard mailbox file for this user (which is */home/myemail/Mailbox*).
    For this method to be effective, your e-mail client must understand and support
