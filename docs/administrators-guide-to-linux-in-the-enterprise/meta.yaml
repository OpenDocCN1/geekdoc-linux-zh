    # The Squid proxy-caching server


    By Vincent Danen


    Many people have heard the term proxy server but do not know how it can benefit
    them. We''ve all heard of firewalls, and we all know the value of a good firewall.
    Some of you might even be using a firewall proxy to make life easier. For those
    of you who are unaware of what a proxy server or firewall proxy is, let me first
    explain the concept.


    provides a cache for all clients, regardless of their number.


    One last thing to note about Squid is that it is a Web-only cache. This means
    that it speaks only the HTTP protocol. It will not cache multimedia items such
    as RealAudio, FTP, or anything other than HTTP requests. Squid can cache FTP requests
    if they''re made with the HTTP protocol, but most FTP clients don''t do this.
    It can also cache WAIS and Gopher information if it is using the HTTP protocol
    and, of course, it can cache secure SSL transactions using the HTTP protocol.


    A proxy server is a program that accepts requests from a client, such as a Web
    browser or FTP client, and forwards the request to the appropriate Internet server.
    It''s transparent to the end user beyond the initial setup of the proxy. This
    method is often used when a number of computers sit physically behind another
    computer, which is in turn connected to the Internet. This configuration allows
    all of the computers simultaneous access to the Internet through one specific
    computer, typically the firewall or proxy server.


    To this end, using Squid in conjunction with a regular firewall proxy as opposed
    to using it instead of a regular firewall proxy is encouraged. Squid''s primary
    benefits are its speed and the fact that it caches data. Beyond this, it isn''t
    a firewall replacement. If you use Squid, you should still use your regular firewall.


    # Installing Squid


    Linux has a very unique, high-speed, and top-quality proxy server. Its name is
    Squid and it, like most applications under Linux, performs an amazing task for
    no monetary cost. However, beyond this, Squid is also a caching program and is
    thus referred to as a proxy-caching server.


    Squid can be installed two ways. You can compile it yourself, or you can install
    the RPM or DEB package for your particular distribution. You should run Squid
    as an unprivileged user, meaning that it should never run solely as root. Many
    people choose to run Squid as the user nobody with the group nogroup; however,
    it is highly recommended that you run Squid as its own user and group, meaning
    that it should run as user squid and group squid. The choice, of course, is entirely
    up to you.


    So what exactly does this mean, and how does Squid differ from other traditional
    proxy servers? Well, Squid performs the same function as any proxy server. It
    takes requests from client programs and forwards them to the appropriate Internet
    server. It also stores a copy of the returned data to an on-disk cache. This means
    that if the same data is requested multiple times, Squid returns the cached data
    as opposed to initiating a connection to the Internet server. This is where Squid''s
    speed truly becomes visible. Think of it as being similar to your browser''s cache.
    Netscape, Internet Explorer, and virtually every other browser keep an on-disk
    cache as well, which they will refer to in the event that a Web site cannot be
    reached or if you recently visited it and the data hasn''t changed. Instead of
    using a cache solely for one client program, Squid


    The first thing you need to do is download either the source code for Squid or
    the RPM or DEB package. If you use RPM, you may need to do nothing more than run


    rpm -ivh squid-2.3.STABLE2-3mdk.i586.rpm


    on a Linux Mandrake 7.2 system. The version and release numbers may differ, depending
