    \    label=linux2.2\n    root=/dev/hde1\n    initrd=/boot/initrd-2.2.img\n   \
    \ append=\" hdb=ide-scsi\"\n    read-only\n```\n\n# Introduction to LILO and GRUB\n\
    \nLILO (www.ibiblio.org/pub/Linux/system/boot/lilo/!INDEX.html) was the first\
    \ Linux boot loader, and its name simply stands for “Linux LOader.” You will never\
    \ need to download it because all Linux distributions come with it.\n\nGRUB is\
    \ a newer boot loader that at one point was a little more advanced than LILO.\
    \ Its name stands for GRand Unified Boot-loader. I find GRUB a little more difficult\
    \ to use than LILO, and it is no longer any more advanced than LILO is. It offered\
    \ a graphical boot menu before LILO did, and it was a text ANSI-based menu at\
    \ that. Now, LILO offers a true graphical boot menu and is just as powerful, if\
    \ not more so, than GRUB.\n\nThis is the configuration file I use on a Linux-Mandrake\
    \ 8.0 system. It's very straight-forward and easy to follow.\n\n# Using LILO\n\
    \nWe will first take a look at LILO. The LILO configuration file is typically\
    \ /etc/lilo.conf, and it contains information on the possible kernels, boot images,\
    \ and defaults for LILO. Because LILO can dual-boot between Linux and Windows,\
    \ as well as many other operating systems, your LILO configuration file can become\
    \ quite confusing. On one system, I have LILO configured to boot between eight\
    \ versions of Linux-Mandrake, Debian, and SuSE. So, as\n\n# Keywords\n\nThe *boot*\
    \ keyword tells LILO which hard drive contains the boot sector that is read. This\
    \ should be the first hard drive in your system. We see that */dev/hde* is the\
    \ value here, which specifies the first ATA100 drive in the system. If you have\
    \ ATA33 or ATA66 drives, this will likely be */dev/hda* instead.\n\nThe *map*\
    \ keyword specifies the location of the *map* file. This is typically */boot/map*.\
    \ If you do a directory listing in your */boot* directory, you should see the\
    \ *map* file there."
