  md: '```

    #!/bin/sh

    uptime >> /home/USERNAME/uptime.diary

    ```


    (Replace USERNAME with the user name that you use to log on to your system.)


    Another nice little trick will help the admin or user to examine output either
    at a different time or allow you to send the output to a fellow user. With the
    Linux mail application, you can e-mail the output of a command. By running:


    uptime | mail thisguy@thisplace.com


    you will e-mail the output of uptime to thisguy@thisplace.com. You could even
    combine the above with the at command and tell your machine to e-mail the output
    of uptime (or nearly any command) with:


    ```

    at 5pm <press enter here>

    uptime | mail thisguy@thisplace.com

    <press enter here>

    <press ctrl-d>

    ```


    **AUTHOR''S NOTE**


    In the above section, anytime it indicates <press enter here>, you must press
    the enter key and so forth.


    # Directing output to a printer


    Being able to send a file directly to a printer with a simple command is often
    more desirable than opening an application in order to print. For this task, the
    lpr command (the offline printer which uses a spooler daemon) is perfect.


    Let''s say, for example, you have an ASCII table used as a simple database generated
    by a cron job and you want it printed out from a console-only Linux box. With
    a file named database, you would cd to the directory containing the file and run
    the command:


    lpr database


    This command will send the file to the spooler daemon, and out to the printer.


    Let''s say that you want to have this same file printed every day. Add an entry
    in /etc/cron.daily like:


    lpr /path/to/file


    Make sure the permissions are -rwxr-xr-x (as root, type chmod 755 FILENAME where
    filename is the name of the file you just created above) and you will have a daily
    printout.


    Like all good Linux commands, you can use several arguments with the lpr command.
    The most useful of these arguments are:


    +   - -P: Forces output to a specific printer. Normally the default printer is
    used (site dependent), or the value of the environment variable PRINTER is used.

    - -h: Suppresses the printing of the burst page.

    - -m: Sends mail upon completion.

    - -r: Removes the file upon completion of spooling. Can''t be used with the -s
    option due to security concerns.


