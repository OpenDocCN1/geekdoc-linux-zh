    # Preparing for Linux in your enterprise


    By Brian Lusk


    Maybe it was when you purchased an additional 50 licenses for your NT server.
    Maybe it was when you migrated from Windows NT 4 to Windows 2000. Maybe it was
    the third time last week that you had to reboot your NT server. Or maybe it was
    when Microsoft announced the


    retirement of the NT 4 MCSE track. But at some point, you let slip the statement:
    "Maybe it''s time I learned about Linux." Well, maybe it is. In this article,
    we''ll discuss whether you want Linux and how you can learn enough to make it
    run like clockwork.'
