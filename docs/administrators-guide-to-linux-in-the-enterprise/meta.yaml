  md: '# Linux 101: Linux partitions explained


    By Jack Wallen, Jr.


    At the very heart of the Linux installation process (and the one item that confuses
    most Windows migrants) are partitions. Under the Linux system, each partition
    serves a different purpose and can be configured to serve in many ways.


    There are many tools to partition a hard drive in preparation—Disk Druid, FDISK,
    and Partition Magic, to name a few. Each tool has its advantages and disadvantages.
    With the newer releases of the various Linux distributions, the partitioning routines
    can all be executed through a well designed GUI interface. So the act of partitioning
    has become even simpler than with the Windows FDISK utility.


    The biggest difference between the basic Windows partitioning scheme and the Linux
    partitioning scheme is the addition of the swap partition. The Linux swap partition
    acts similarly to the Windows swap file, but it is dedicated and more stable.


    When performing a custom installation (as opposed to the very newbie-aware automated
    installations that most distributions offer), the Linux swap partition has a maximum
    size of 120 MB. It is typical to go with a swap scheme of *Swap = number of MB
    of RAM*. Of course, if your machine goes beyond 120 MB of RAM, you''ll have to
    settle for the 120 MB swap partition.


    Outside of the swap partition, the only other *required* partition (in a Linux
    environment) is the root partition, called the ''/'' partition. This partition
    houses the various directories created by the Linux installation, including home,
    etc, dev, var, bin, dev, lost+found, mnt, root, tftpboot, usr, boot, lib, misc,
    opt, proc, sbin, and tmp.


    # Linux 101: RPM files explained


    By Jack Wallen, Jr.


    RPMs aren''t just for automotive aficionados. They''re also Red Hat''s answer
    to the establishment''s EXE files.


    # Installing with RPM


    The Red Hat Package Management system (RPM) is a user-friendly, yet robust, standardized
    installation application that makes installing, uninstalling, verifying, and querying
    programs simple, while retaining the common strengths and efficiency of Linux.


    Like many Linux commands and applications, RPM accepts arguments and flags, adding
    to its usefulness. These arguments (like many Linux arguments) dictate to RPM
    the nature of the request made—allowing user modification and control.


    Let''s examine the common uses of RPM.


    # Installation


    An RPM file (a binary file used for application installation) comes with the extension
    RPM and is the Linux equivalent of the Windows EXE file. RPM can only be run as
    root (super user) from the command line, with the GUI tools gnoRPM (from the GNOME
    desktop environment), or from kpackage (from the KDE environment). For installation
    with RPM, there are a few "common" arguments sent to the routine. Among the most
    useful installation flags are:


    ▶ -I, install (install the listed package)


    ▶ -v, verbose (output verbose messages to the screen as package installs)


    ▶ -h, hash (print out hash marks to indicate progress)'
