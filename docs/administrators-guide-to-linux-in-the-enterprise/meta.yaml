  md: 'CASE STUDY


    # How a Linux solution saved this company $35K


    By Mike Walton


    Linux is often lauded as an economical solution. In fact, we recently heard from
    one administrator who saved his company $35,000 by using a Linux solution. However,
    his Linux strategy did more than just save money on the front end—it allowed him
    to deliver a better enterprise solution that increased his ability to monitor
    and manage network uptime.


    In this article, we''re going to follow Ed, who was a manager overseeing network
    administration at a communications company when a major network reconfiguration
    was dumped in his lap. The project required him to divide a LAN into five smaller
    virtual LANs with switches that, at the time he needed them, would not pass DHCP
    or DNS traffic.


    We will see why:


    +   * Ed wanted to subdivide his LAN into five VLANs.

    * The switches wouldn''t work on his LAN and how he got around it by turning old
    workstations into Linux DNS/DHCP servers.

    * Ed''s workaround saved his company at least $35,000.

    * Solving the problem of monitoring the old hardware created the additional benefit
    of enhancing network uptime.


    # GET INSIGHTS FROM THE TRENCHES


    You can learn quite a bit by reading about the methods other administrators and
    engineers use to resolve challenging technology issues. Our hope is that this
    article will provide you with unique solutions and valuable techniques that can
    help you become a better IT professional. All administrators and their companies
    remain anonymous so that no sensitive company or network information is revealed.


    # Addressing the problem


    When Ed was placed in charge of the call center network at a communications company
    in Bellevue, WA, the company was in the process of subdividing its 700- to 800-node
    network into five VLANs.


    “The reason we did the VLANs is that we were running off of hubs, and we were
    running out of ports, and everyone wanted 100 megabits to their desktops,” Ed
    said. “We also wanted more intelligent switching and to segregate the traffic
    a little bit.”


    Under the original network topology, when all the PC workstations in the company
    would fire up between 8:00 and 8:30 every morning, they were using DHCP to request
    an IP address from a Windows NT Server, which was also doing DNS service duties.
    Multiply the DNS requests by more than 700 machines, and there was a lot of network
    traffic being broadcast on the company''s network. Server traffic to a dozen servers
    also compounded the situation.


    When the VLANs were set up, the marketing department would have its own LAN, the
    MIS department would have its own LAN, the call center would have its own LAN,
    and so on.


    Ed picked a Saturday to make the change, and other than some poor planning that
    led to a few wiring problems, everything was going smoothly. Then, another system
    administrator came to Ed with some bad news. The new Bay Networks switches they
    were installing didn''t propagate the DHCP and DNS information to the new VLANs.
    (Bay Networks is now owned by Nortel Networks.)


    The network administrator who came with the bad news recommended buying five new
    fully loaded Windows NT Servers to perform the DHCP/DNS server duties. “I knew
    my boss wouldn''t want to spend $35,000 to make this work. To make the situation
    worse, it was a temporary fix because Bay Networks was going to relesase a firmware
    fix within 90 days,” Ed said.'
