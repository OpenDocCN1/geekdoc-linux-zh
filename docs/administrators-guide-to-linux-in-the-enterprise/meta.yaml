    to be used for evaluation purposes. The file you will be downloading is *linux.intel.libc6.tar.Z*,
    which is for Linux Intel systems running *glibc2.1* or higher.


    There are other solutions, though. Computer Associates has its own virus scanner
    called InoculateIT that works for many operating systems, including Linux. You
    can grab the file,'
