  md: '# Understanding sendmail from the ground up


    By Stewart Benedict


    Sendmail has been around almost as long as UNIX itself. The authors of the famed
    O''Reilly "bat" book compare it in complexity to the "Gordian knot" of ancient
    history. It''s true; sendmail is a fairly complex program. A casual read of /etc/sendmail.cf
    by mere mortals can send the uninitiated screaming away in fear. But like most
    things, if taken in small bites, with a methodical approach, we can get beyond
    that complexity and come to an understanding of what sendmail is all about. I''m
    not saying you''ll be a master after one short article, but you should have a
    better comfort level with the program, should you need to deal with it.


    > ## NOTE

    In Greek legend, the Gordian knot was the name given to an intricate knot used
    by Gordius to secure his oxcart. Gordius, who was a poor peasant, arrived with
    his wife in a public square of Phrygia in an oxcart. An oracle had informed the
    populace that their future king would come riding in a wagon. Seeing Gordius,
    the people made him king. In gratitude, Gordius dedicated his oxcart to Zeus,
    tying it up with a peculiar knot. An oracle foretold that he who untied the knot
    would rule all of Asia. According to a later legend, Alexander the Great cut the
    knot with his sword. From that time, "cutting the Gordian knot" came to mean solving
    a difficult problem.


    # What is sendmail?


    Sendmail is an MTA, or Mail Transfer Agent. Its sole purpose in life is to move
    mail from one system to another or deliver mail on a single system from one user
    to another. This sounds simple enough, until you consider the wide variety of
    systems and network protocols out there and how sendmail manages to communicate
    with most of them. Most UNIX-derived operating systems come with sendmail out
    of the box, configured for the most common configuration. In many cases, you can
    just


    use it and not worry about how it works. If you have a valid Internet domain name
    and sendmail is serving just one box properly configured with the fully qualified
    domain name, sendmail should just magically do its thing.


    Where you can run into trouble is if you need to "tweak" sendmail''s functionality
    or if you need to upgrade due to security issues and build from source.


    If you think about it, e-mail has been quite a magical revolution in communication.
    Unlike with the phone, you can still communicate with someone even if you''re
    not both available at the same time. Unlike traditional "snail mail," message
    delivery can happen in minutes; if you''re vacationing in Australia, you can still
    read the e-mail sent to you in Milwaukee, provided you have access to the Internet.


    The definitive site for all things sendmail is sendmail.org. This site has links
    covering where to get sourcecode and documentation, as well as links to other
    helpful resources. If you have a large organization and want a commercially supported
    product, the sendmail author has spun off a corporate version, Sendmail, Inc.,
    offering additional features, including graphical configuration, support, and
    alliances with other key vendors to provide virus scanning and other extras.


    The most current version as of this writing is 8.12.0.Beta7. I''m going to download
    and discuss version 8.11.3 from ftp://ftp.sendmail.org/pub/sendmail/sendmail.8.11.3.tar.gz.


    # Compiling sendmail


    Compiling sendmail from source is pretty easy, provided you''re set up with the
    necessary tools to build programs from source:


    ```

    tar -xzf sendmail.8.11.3.tar.gz

    cd sendmail-8.11.3

    sh Build

    ```


    If you need special library or include options, they can be included while calling
    the script with the -I or -L flags and specifying your options.


    There are extensive notes on other options, as well as various compiler/OS quirks
    at www.sendmail.org/compiling.html.'
