    ADMIN$ Disk Remote Admin

    Asset Disk Asset Management Database

    Art Disk Art

    Operations Disk Operations

    IPC$ IPC Remote IPC


    Above you see the shares available to your machine. Now you have all the information
    you need to mount a share to your Linux machine. Using the command

    smbmount //help/Art ~/work

    you will effectively mount the Art share (from Help) into the /home/USER/work
    directory. You can now use the Art share as if it were local to your own machine.


    One issue currently haunts the smbmount protocol, however. At seemingly random
    times, you will attempt to view (or list or change into) your smbmounted directory
    and receive the following error:

    ls: work: Input/output error

    where work is the directory you''ve created for mounting your Samba shares.


    There is currently no workaround for this problem. The only way to solve this
    issue is to su to root and run the umount (or smbmount) command on the work directory,
    exit out of root, and then remount the directory as the regular user.


    # Less typing, more work


    All of these commands are time-consuming at best and at worst, a headache to remember.
    There''s a very easy way to simplify these commands—aliases.


    To add an alias for this command, you must first insert the IP address and a name
    for the machine into the /etc/hosts file. This new entry will look like this:

    172.22.1.33 help

    and will allow you to use the hostname help instead of having to type the IP addy.
    With this inserted, you must open your .bashrc file and add the following line:

    alias work="smbmount //help/Art /home/USER/work"


    With the above line in place, you will have to exit out of both X and console.
    Once you


    log on again, you''ll see that by issuing the command work from a bash prompt,
    you will effectively have issued the smbmount command you entered into the .bashrc
    file. It''s also possible to add the command into the /etc/rc.d/rc.local file;
    however, there are problems with this, and the command is rarely—if ever—successful.


    # smbclient


    The smbclient command is a multifunctional tool that acts (among other things)
    as an FTP-like client for Samba. This tool can be quite handy when all else fails.
    The biggest drawback is when you attempt to access a standard Windows 9x machine.
    Because the 9x technology was not created for networking, you won''t be able to
    FTP into that machine. There is, of course, software that will allow you to enable
    this technology on a 9x machine, but that''s another topic for another time.


    To use smbclient to read and write to directories from Windows machines, you''ll
    want to use the command in this way:

    smbclient //SERVERNAME/SHARENAME

    and you''ll receive such information as

    Password:

    Domain=[TECH] OS=[Windows NT 4.0]

    Server=[NT LAN Manager 4.0]

    smb: \>


    In this command, you must substitute your own information for SERVERNAME and SHARENAME.


    One you''ve entered your password and hit [Enter], you''ll see the smb: \> prompt.
    At this prompt, you can do a number of groovy things. The primary functions within
    smbclient are shown in Table A.


    What this treatment does is create a multifunctional network connection between
    a Linux box and a Windows box. With the ability to do most directory commands
    (ls, dir, cd, mkdir, etc.), the file exchange capability of FTP, and many basic
    bash commands, smbclient quickly becomes a telnet on steroids.


    Of course, using smbclient has its drawbacks. With this application, there are
    no GUI models to use. When in smbclient mode, you''re stuck with a command-line
    structure, which many people will not be too thrilled about.'
