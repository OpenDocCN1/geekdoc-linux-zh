  md: 'While I do not advocate moving a whole NT network to Linux, using Linux Samba
    for file and print services in an NT network offers many advantages, especially
    cost. A basic Windows NT Server costs $800 for one machine, and the hardware is
    usually a minimum of $2,000. Linux server software costs a maximum of $200, and
    you can load it on as many machines as you want. Because it requires less hardware
    resources, that cost is lower as well.


    With these cost savings, an administrator can more easily place a Samba file and
    print server in each departmental domain and/or subnet in order to keep resources
    local to the users. This move, coupled with the speed gain from an optimized Samba
    server, will increase file and printer access times and thus, employee productivity.
    Also, the stability of a Samba server on Linux is reliable enough that you''ll
    rarely have to look at it once it''s configured correctly, let alone reboot it!


