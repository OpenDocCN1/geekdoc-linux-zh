    \ Qmail to use the maildir format by default. For example, look for the line in\
    \ the script that reads:\n\n```\nqmail-start ./Mailbox splogger qmail\n```\n\n\
    Change it to the following:\n\n```\nqmail-start ./Maildir/ splogger qmail\n```\n\
    \nQmail can use both the maildir and mailbox formats, but there is one caveat:\
    \ Qmail uses a different method of storing mailbox files than do traditional SMTP\
    \ servers. While other SMTP servers use */var/spool/mail/[username]*, Qmail uses\
    \ */home/[username]/Mailbox*. Qmail's method provides additional security by storing\
    \ the mailbox in the user's home directory instead of in the */var* directory\
    \ tree. To use this new format, move the files in */var/spool/mail* to the appropriate\
    \ user's directory. The user's e-mail client (such as Elm or Pine) must be reconfigured\
    \ somewhat. Then, as root, you must make a symbolic link that points from */var/spool/mail/[username]*\
    \ to */home/[username]/Mailbox* for each user. For security reasons, change the\
    \ permissions on the */var/spool/mail* directory to 1777. That way, you'll prevent\
    \ users from removing these links. The symbolic links are needed to trick programs\
    \ that don't (or can't) support Qmail's way of handling the mailbox format into\
    \ writing incoming e-mail to the correct files.\n\n# Using single-user mode\n\n\
    If you have a busy system, you should boot into single-user mode and perform some\
    \ maintenance. It will preserve your system integrity by not starting the Qmail\
    \ servers and by disallowing user logins. It will make your transition to Qmail\
    \ much easier. To boot into single-user mode, reboot the system and, at the LILO\
    \ prompt, type *linux single* instead of pressing [Enter]. If you have a custom\
    \ kernel or a different boot label for Linux, like *mandrake*, type *mandrake\
    \ single* and boot into single-user mode. After you reboot, simply type the following\
    \ lines as root:\n\n```\nmv /var/spool/mail/[username]\n    /home/[username]/Mailbox\n\
    ln -s /home/[username]/Mailbox\n    /var/spool/mail/[username]\n```\n\nOnce you've\
    \ moved all of the mailbox files, you can reboot the system into whatever runlevel\
    \ you normally use. Qmail will start storing incoming mail for your users either\
    \ in the new maildir format or in the converted mailbox format.\n\nYou'll have\
    \ to update your e-mail client configuration in order to use the new mailbox format.\
    \ In Pine, change the *inbox-path* to *~/Mailbox*. By default, it's left blank;\
    \ it uses the normal */var/spool/mail/[username]* mailbox setting to receive mail.\
    \ You need to configure most e-mail clients similarly, but you may have to modify\
    \ and recompile the source code for others. If you set the symbolic links correctly,\
    \ however, you shouldn't have to worry about it.\n\n# Conclusion\n\nIf you've\
    \ followed all of these instructions carefully, you'll have a Qmail system that\
    \ provides SMTP and POP3 services to your users. It also should work with the\
    \ reliable maildir format or another secure mailbox format. There are a number\
    \ of other options that you'll want to configure if you're going to use Qmail\
    \ in a production environment, which I'll discuss in the second part of this series.\
    \ §"
