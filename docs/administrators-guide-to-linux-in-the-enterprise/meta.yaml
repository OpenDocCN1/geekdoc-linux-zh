  md: '# Finding a Linux solution


    Ed knew the company had a bunch of older computers in a storage closet in the
    company parking garage, so he sent one of his staff members to the closet with
    instructions to pull out five or six machines with the fastest processors and
    the most memory. He said most of the machines in the closet had processor speeds
    between 266 MHz and 400 MHz, with between eight and 16 megs of RAM.


    Ed installed Red Hat Linux on five of the machines and then ran a little script
    he wrote on each machine to configure them with the appropriate IP address ranges
    and other network settings for each VLAN.


    "I guess I came in at 10:00 A.M. on a Saturday, and by 1:00 P.M., we had the [Linux]
    servers up and running," Ed said. "It was very straightforward, and it surprised
    my network administrator, who was a Windows NT guy."


    Ed said that being located so close to Seattle, and Microsoft''s headquarters
    in Redmond, there was a natural tendency to use everything Microsoft at the company.
    Thus, when he deployed the Linux servers, there were many expressions of gloom
    and doom from his coworkers in the IT department.


    "At the time, our DNS server running on NT would go down once or twice a week,"
    Ed said. "When I left the company, these Linux servers had been running over three
    months straight. I put them in a corner, turned them on, and forgot about them."


    No one really should have been surprised, he said. As a communications company
    doing telephone and cable telecommunications, the company was using a Linux box
    to gather call-data records off of phone switches, preprocess that data, and then
    feed that data to an AS/400 where it went into the billing system. According to
    Ed, the company had been using that machine with success for about a year before
    this project came up.


    "Linux and the variants like BSD lend themselves very well to doing things like
    that—DNS services, DHCP services, print servers, file servers, that sort of thing.
    They do it very economically," he said.


    When the updates to the switch firmware came, the Linux servers were functioning
    so well that Ed''s company didn''t bother with the patch.


    # A good solution gets better


    One concern with resurrecting the old computers for duty as DHCP/DNS servers was
    that they were potentially more likely to experience an equipment failure.


    To solve that problem, Ed wrote a script that would ping the old machines every
    two minutes. If there were a change in operating state, the program would send
    him a notice to his cell phone.


    Ed then turned one of old 486 machines in the storage closet into a Linux ping
    server. He figured that if his new ping server was going to be checking his Linux
    servers, he might as well add all the routers and other servers to the ping list.
    This turned out to be fortuitous for Ed. He believes it may have saved his job
    a couple months later.


    The company''s AS/400 was located in Seattle and connected to the Bellevue operations
    via a T1 connection, with several backup T1 connections. Ed''s ping server was
    constantly testing the router at his end of the T1 in Bellevue and the router
    at the other end of the T1 in Seattle. If either of these routers refused to respond
    to a ping, it would mean the T1 connection, and all of its alternate connections,
    were down.


    One morning at 7:30 A.M., Ed''s ping server sent him an e-mail via his cell phone
    that the T1 was down. He called someone in Seattle and they were working to fix
    the problem by 8 A.M. By 9 A.M., the T1 connection was restored. Without the warning
    system, Ed would not have discovered the problem until he got into the office.
    At that point, the T1 would probably have been down all morning while the fix
    was in progress.


    "I just think it''s important to note that not only is there a place in corporate
    America for open source systems but that a company can save a significant amount
    of money and get a robust solution out of it," Ed said. "You don''t have to spend
    hundreds of thousands of dollars to get a solution that works."'
