  md: '# **Listing B: *The template file***


    ```

    divert(-1)

    #

    # Copyright (c) 1998, 1999 Sendmail, Inc. and its suppliers.

    #       All rights reserved.

    # Copyright (c) 1983 Eric P. Allman. All rights reserved.

    # Copyright (c) 1988, 1993

    #       The Regents of the University of California. All rights reserved.

    #

    # By using this file, you agree to the terms and conditions set

    # forth in the LICENSE file which can be found at the top level of

    # the sendmail distribution.

    #

    #

    #

    #  This is a generic configuration file for Linux.

    #  It has support for local and SMTP mail only. If you want to

    #  customize it, copy it to a name appropriate for your environment

    #  and do the modifications there.

    #


    divert(0)dnl

    VERSIONID(''$Id: gen-linux.mc,v 8.1 1999/09/24 22:48:05 gshapiro Exp $'')

    OSTYPE(linux)dnl

    DOMAIN(generic)dnl

    MAILER(local)dnl

    MAILER(smtp)dnl

    ```


    # **Listing C: *Building your .cf file***


    ```

    [stew@omnibook cf]$ sh Build mysite.cf


    Using M4=/usr/bin/m4

    rm -f mysite.cf

    /usr/bin/m4 ../m4/cf.m4 mysite.mc > mysite.cf || ( rm -f mysite.cf && exit 1 )

    chmod 444 mysite.cf

    ```


    To finish your install, back up your current *sendmail.cf* and the *sendmail*
    binary. (Usually */usr/sbin/sendmail* in Linux.) Now copy your new configuration
    file over and install the new binary, after stopping *sendmail*. (You''ll need
    to either *su* to root or use *sudo* for these steps.)


    ```

    cd ../../

    sh Build install

    ```


    There are also a number of utilities in the directories under *sendmail*. These
    include *makemap*, *mailstats*, *vacation*, and others. Contrary to what the INSTALL
    document says, these will also be installed when you run the install script in
    the top-level directory.


    ```

    /etc/rc.d/init.d/sendmail stop

    cp mysite.cf /etc/mail/sendmail.cf

    ```'
