  md: 'The machine you are on is 172.22.1.24. The machine we want to access is a production
    machine (named *Help*) that has the IP address of 172.22.1.33, and the share we
    wish to mount is called *documentation*. We''d like to mount this share to our
    home directory in a subdirectory called *work* (this directory has already been
    created). To mount this directory, you''ll need to run (as user and on your own
    machine) the command


    ```

    smbmount //172.22.1.33/documentation ~/work

    ```


    When you run this command, you''ll see output such as:


    ```

    [jwallen@giles jwallen]$ smbmount \

    //172.22.1.33/documentation ~/work

    Added interface ip=172.22.1.24

    bcast=172.22.1.255

    nmask=255.255.255.0

    session request to Help failed

    Password:

    ```


    When you enter your password (your network password, not your Linux logon password),
    you''ll see your *bash* prompt (if all goes well). Once you receive your *bash*
    prompt, you can check the success of the mount by issuing the *ls* command on
    the directory. So,


    ```

    ls ~/work

    ```


    should report to you the directory/file listing from the machine to which you''re
    mounting.


    # Problems ahead


    (Of course, this method has its problems. The first—and most obvious—is that you
    may be on a larger network that uses DHCP to dole out IP addresses. Because of
    DHCP, you won''t know the IP addresses of the machines you need to use. This is
    a problem in pretty much any situation. Even with the Microsoft Network Neighborhood,
    you cannot discern this information. There is, of course, a way around this obstacle.
    In order to get the IP address of a machine, you must follow this procedure:


    +   1. Find out the NetBIOS name of the machine.

    2. Ping the name.

    3. Note the IP reported for the name.


    Finding out a NetBIOS name is usually as simple as asking the user or the network
    administer of the machine for the name. Usually when a machine is used for production
    (especially when it''s needed by multiple users), the name of the machine will
    be known to the users. If no one knows the name of the machine and you have physical
    access to it, you can go to the machine''s Control Panel, click the Networking
    icon, and choose the Identification tab. Under the Identification tab you''ll
    see a computer name—this is the name of the machine you want to access.


    Once you have the name, it''s a simple matter of pinging that name to determine
    the IP address. Keeping with our example, you know that the machine''s name is
    *Help*, and the machine you''re using is on the same DHCP network. Run the command


    ```

    ping -v Help

    ```


    and you''ll receive the IP address of that machine. Write down that IP address
    so you can plug it into the *smbmount* command.


    # smbclient to the rescue


    Of course, this won''t help you if you don''t know what shares are available to
    you. The *smbmount* command requires the form *//hostname/share* and will return
    errors if you attempt to mount without a valid sharename. Now what do you do?
    You find the sharename! How do you find the sharename? Simple—with the help of
    Samba! In order to get the available sharenames from the Help machine, you''ll
    use Samba''s *smbclient* command (which I''ll revisit later) as shown here:


    ```

    smbclient -L Help

    ```


    > **AUTHOR''S NOTE:**

    You can substitute the IP address of the machine named *Help* if you don''t know
    the NetBIOS name.


    Here''s a snippet of output from the above command:


    ```

    Domain=[TECH] OS=[Windows NT 4.0]

    Server=[NT LAN Manager 4.0]


    Sharename    Type     Comment

    ----------    ----     -------

    NETLOGON     Disk     Logon server share

    BizDev       Disk     Business Development

    ```


    Finding out a NetBIOS name is usually as simple as asking the user or the network
    administer of the machine for the name. Usually when a machine is used for production
    (especially when it''s needed by multiple users), the name of the machine will
    be known to the users. If no one knows the name of the machine and you have physical
    access to it, you can go to the machine''s Control Panel, click the Networking
    icon, and choose the Identification tab. Under the Identification tab you''ll
    see a computer name—this is the name of the machine you want to access.'
