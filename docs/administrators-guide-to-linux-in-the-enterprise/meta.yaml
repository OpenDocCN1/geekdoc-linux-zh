    # Linux in Network Neighborhood:

    Using *smbmount* and *smbclient* to see through Windows


    *By Jack Wallen, Jr.*


    Many times I''ve had to put a Linux workstation into a field of Windows cattle,
    but it''s been difficult to make Linux work properly with Network Neighborhood.


    There are, of course, methods to make this madness a bit less, well, maddening.
    In this article, I''ll try show you the methods and lay some groundwork to aid
    you in speeding up your Linux playtime in the Network Neighborhood.


    Since its inception, *smbmount* has undergone a rewrite, so its syntax has actually
    changed. The first thing I will assume is you have Samba installed properly on
    your machine with the *smbmount setuid* root. To set this bit, you must *su* into
    root and run these commands:


    ```

    chmod u+s /usr/sbin/smbmount

    chmod u+s /usr/sbin/smbumount

    ```


    Once the bit is set, you can run the command to mount your SMB shares.


    # **What I want to accomplish**


    By the end of this article, I hope you''ll have a better understanding of how
    *smbmount* and *smbclient* work and whether or not there''s a GUI client that
    supports these tools that''s right for you.


    > **AUTHOR''S NOTE:**

    Setting the above bit has many security risks. Please do not set this bit if you''re
    unsure about the security of your network. If you decide not to set this bit to
    s, then you must have root access and run the *smbmount* command as root.


    By accomplishing these things, you should find yourself more easily integrating
    with those around you. The *smbmount* and *smbclient* commands will enable you
    to view the machines within your network and read and write to their directories.


    # **smbmount**


    The *smbmount* command is actually a front end for *smbmnt*. The *smbfs* is the
    application that contains both the *smbmount* and *smbumount* commands. To the
    average user, *smbmount* and *smbumount* will behave exactly as *mount* and *umount*
    do—except that you''ll be mounting SMB shares across a LAN.


    # **The long way home**


    First off, we''re going to play around with mounting our SMB shares the long,
    difficult way (as difficult as typing a command can be), and eventually we''ll
    develop a method for making this process much less painful.


    > **AUTHOR''S NOTE:**

    Once I''ve covered all the commands, I''ll visit a couple of GUI applications
    that can make your life even easier!'
  merge: -1
  pgno: 178
- img_proc: false
  md: 'The *smbmount* command has the following structure:

    `smbmount service mountpoint`

    `[ -o options ]`

    but it can be run as simply as

    `smbmount //shared/drive /mount/point`


    As you can see, we''re already whittling away at many of the steps to make viewing
    the SMB neighborhood as easy as possible. Just wait—you''ll be shocked at how
    easy it is!


    # smbmount


    Let''s take a look at the *smbmount* command and see just what it has to offer.
    The *smbmount* command, like all good Linux commands, has a few options to pass
    to the command. The biggest difference in these options is they are passed as
    a comma-separated list of *key=value* pairs. The possible options are shown here:


    +   - *username=<arg>* —This option specifies the username with which to connect.
    If this is not given, then the environment variable USER is used. This option
    can also take the form *user%password* or *user/workgroup* or *user/workgroup%password*
    to allow the password and workgroup to be specified as part of the username.

    - *password=<arg>* —This specifies the SMB password. If not given, then *smbmount*
    will prompt for a password (unless the *guest* option is given).

    - *netbiosname=<arg>* —This sets the source NetBIOS name. It defaults to the local
    hostname.

    - *uid=<arg>* —This argument sets the user id that files will be mounted as. It
    may be specified as either a username or a numeric *uid*.

    - *gid=<arg>* —This option sets the group id that files will be mounted as. It
    may be specified as either a groupname or a numeric *gid*.

    - *port=<arg>* —This one sets the remote SMB port number. The default port number
    is 139.

    - *fmask=<arg>* —This option sets the file mask. This determines the permissions
    that remote files have in the local filesystem. The default is based on the current
    *umask*.

    - *dmask=<arg>* —This one sets the directory mask. It determines the permissions
    that remote directories have in the local filesystem. The default is based on
    the current *umask*.

    - *debug=<arg>* —This argument sets the debug level. This is useful for tracking
    down SMB connection problems.

    - *ip=<arg>* —This option sets the destination host or IP address.

    - *workgroup=<arg>* —This sets the workgroup on the destination.

    - *sockopt=<arg>* —This one sets the TCP socket options. See the *smb.conf* socket
    options option.

    - *scope=<arg>* —This argument sets the NetBIOS scope.

    - *guest* —This means don''t prompt for a password.

    - *ro* —This means to mount as read-only.

    - *rw* —This means to mount as read-write.


    This is quite a lengthy list of arguments. There are, I''m sure, situations in
    which you''ll need to pass a few of the above to Samba. Say, for example, you
    need to get into a Windows machine on the network from another user''s Linux machine.
    To do this, you''ll need to pass both the *username=* and the *password=* arguments
    (of course, after the =, you''d need to supply your own username and password).


    Another possible scenario: You want to allow a user to mount a Windows share with
    read access only (a share that would normally have both read and write privileges).
    To do this, you would mount your coworker''s machine, passing the *ro* argument.
    Granted, you could achieve this with the proper configuration in the *smb.conf*
    file; however, there are times when you might wish to allow someone access to
    a share to which you would not normally allow access. Because of this, it''s nice
    to have the flexibility inherent in Samba.


    Okay, back to the command. Let''s first set up a hypothetical network with which
    you can play. This network will be a 172.22.1.0 scheme.'
