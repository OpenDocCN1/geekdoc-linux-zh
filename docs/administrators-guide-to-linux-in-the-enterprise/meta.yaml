  md: '# # Configuring Linux sound services with ALSA


    *By Jim McIntyre*


    The Advanced Linux Sound Architecture (ALSA) is intended to be a replacement for
    the Open Sound System (OSS), which is the current standard for Linux sound services.
    The ALSA architecture provides several important advantages over the standard
    drivers:


    +   - ALSA is more modular than the standard Linux sound card drivers.

    - ALSA is easier to install than other Linux sound configuration architectures.

    - ALSA can emulate the standard OSS sound drivers.

    - ALSA simplifies the process of configuring more than one sound card for your
    system.

    - ALSA uses a very flexible interface, making it easier to develop applications
    that use sound.

    - ALSA may be configured as a dummy driver on systems with no sound card installed.


    # ## What you need


    +   - A 2.2 series or newer version of the Linux kernel running on an x86 computer

    - Some familiarity with the Linux shell

    - Experience compiling and installing the Linux kernel


    With this knowledge and experience, you''re ready to begin. Installing ALSA is
    a seven-step process:


    +   1. Download ALSA.

    2. Determine the type of sound card your system is using.

    3. Compile the kernel with sound support.

    4. Install the ALSA drivers.

    5. Build the device files required by ALSA.

    6. Configure ALSA to use your sound card.

    7. Test ALSA on your system.


    # ## Step one: Download ALSA


    Unfortunately, the ALSA packages are not yet available as binary executable programs.
    The source code for the ALSA packages must be downloaded from the Alsa-project
    site at **www.alsa-project.org**.


    There are four packages you need to install ALSA:


    +   - **Alsa-driver:** The ALSA kernel modules

    - **Alsaconf:** The ALSA setup utility

    - **Alsa-utils:** The sound card configuration utility

    - **Alsa-lib:** The interface to ALSA


    # ## Step two: Identify your sound card


    Once ALSA is downloaded, the next step is to identify your sound card. The ALSA
    Web site provides a list of cards and chipsets currently supported by ALSA. If
    you already know which type of card you''re running, check the sound card matrix
    at the ALSA Web site to confirm which module is required. The ALSA installation
    also includes an autoprobe capability, but if this method fails to detect your
    card properly, use one of the following methods to determine the type of sound
    card you have. In particular, you will need to know the chipset the card uses
    to load the correct module into the kernel.


    If you use a PCI sound card, use the following command:


    ```

    lspci

    ```


    This command is included with the pciutils package and will provide useful information.


    If you use an ISA card, use the command:


    ```

    pnpdump

    ```


    This command is part of the isapnptools package.


    If you use a dual-boot system with Linux and Windows installed, run Windows and
    go to Start | Settings | Control Panel | System | Device Manager to identify your
    sound card.


    Once you have identified your sound card, you''re ready to compile the Linux kernel
    with support for sound.'
  merge: -1
  pgno: 90
