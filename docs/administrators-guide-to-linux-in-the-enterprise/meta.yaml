    the Windows systems, and possibly the Linux system, to load shares automatically.


    # Mapping Linux shares to a Windows network drive


    On the Windows clients, you can mount the user''s Linux share automatically by
    opening the Network Neighborhood window, right-clicking the share you want to
    mount, and choosing Map To Network Drive. In the Map To Network Drive dialog box,
