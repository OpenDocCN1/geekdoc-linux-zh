    # Logging in


    Typically in an enterprise-level environment, users are required to log in. The
    process of logging in to the desktop brings the user''s own personal settings
    to that particular machine (or it should). KDE offers this same function. Upon
    pressing any key on the keyboard, the user will be greeted with a login window
    where they will enter their user name and password. Once the password is accepted,
    their desktop configurations are read from the *~/.kde/Autostart* and the *~/Desktop*
    directories.


    # Getting to know KDE


    It would probably be worth your while to get to know the KDE desktop before you
    begin training your end users. KDE is a desktop environment for the Linux operating
    system. It''s the most Windows-like desktop envir- onment not created by Microsoft.
    KDE is pretty. KDE is highly flexible. I could go on and on. But first, let me
    explain the desktop environ- ment (hereafter referred to as DE).


    > **~/**

    The *~/* character combination is shorthand for the user''s home directory. For
    example, if my username was *jlwallen*, the directory that would correlate to
    *~/* would be */home/jlwallen*. If my username was *bob*, *~/* would relate to
    */home/bob*.


    The DE, simply put, is where the users work. It''s the desktop, the icons, the
    start menus, the task bars, the windows, and all that coherently joins the user
    to the operating sys- tem. KDE strives to make that as simple and user-friendly
    as possible.


    Created by Matthias Ettrich in 1996, KDE''s goal was simply to bring UNIX to the
    desk- top. Since its inception, KDE has grown to fulfill the prophecy with all
    the typical bells and whistles users have come to expect on a computer.


