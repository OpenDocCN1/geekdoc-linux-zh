  md: '# The recipes


    Now we get into the heart of the matter—the primary force behind *procmail*. The
    onions and potatoes (sorry, I''m a vegetarian, so no meat here), so to speak.


    A *procmail recipe* is just what it sounds like—a recipe that is cooked up that
    will act upon an incoming e-mail. As I said before, there are delivering and nondelivering
    types of recipes, and here I''m going to help you understand delivering recipes
    (in different forms). What we will do is start piecing together a very simple
    recipe and graduate to more advanced recipes as we go.


    # Recipes—the basics


    The basic *procmail* recipe looks like this:


    ```

    :0

    action

    ```


    Adding in a few more possibilities gives you


    ```

    :0 * flags: lockfile_name

    * condition 1

    * condition 2

    action

    ```


    The first recipe has two lines. The first line, :0, marks the beginning of the
    recipe (all recipes will have this), and the second line, *action*, is the action
    that is to be taken on incoming mail. For instance, you can replace *action* with
    something as simple as


    ```

    ! xxx@xxxx.xxx

    ```


    which will forward all mail to the indicated e-mail address (where *xxx@xxxx.xxx*
    is replaced with a legitimate e-mail address).


    The second recipe contains two (or more) extra lines that are marked *condition1*
    and *condition2*. The second recipe also adds to the first line both flags and
    a user-defined lockfile. A lockfile is very important within *procmail*, but you
    should understand it before using it. (We''ll discuss lockfiles in the next article.)
    The list of possible flags used in *procmail* is extensive and can be found within
    the *procmailrc* man page (at a prompt, type *man procmailrc*).


    The conditions of a *procmail* recipe are all user-defined and are limited only
    by your imagination. You''ll spend the greatest amount of time and energy—as well
    as patience—with this section. A condition can be thought of as


    "if the e-mail meets these requirements, then pass it along to the following action
    statements." Conditions can be stacked to an unlimited depth, which makes them
    both very powerful and very confusing.


    # Delivering recipes


    The first recipes we''re going to look at are delivering recipes. Delivering recipes
    are those that cause the header and/or body of the mail to be written into a file,
    absorbed by a program, or forwarded to a mail address.


    Before we actually begin cooking up our recipes, let''s first write a safety net
    into our *$HOME/.procmailrc* file. Inserting the following two recipes above all
    other recipes will ensure that of all arriving mail, the last 32 messages will
    be preserved. In order for it to work as intended, you must create a directory
    named *backup* in your *$MAILDIR* before writing these recipes into your *procmail''s*
    rc file. Create this directory with the following:


    ```

    mkdir ~/mail/backup

    ```


    (assuming that *~/mail/* is your user mail directory), and you are good to go.


    With the *backup* directory in place, you can now create the first recipe in your
    *~/.procmailrc* file. Open the *rc* file in your favorite editor and enter the
    following two recipes after the header section:


    ```

    :0 c

    backup


    :0 ic

    | cd backup && rm -f dummy ''ls -t msg.* | sed -e 1,32d''

    ```


    So you know what the above command is doing, let''s break it down.


    First recipe:


    +   ► **:0 c**—Begin the recipe and make a carbon copy of all mail.

    ► **backup**—Save all copies to the *backup* directory.


    Second recipe:


    +   ► **:0 ic**—Begin the recipe, ignore any write errors on this recipe, and
    make a carbon copy of all mail.

    ► **| cd backup && rm -f dummy ''ls -t msg.* | sed -e 1,32d''**—Change to the
    *backup* directory'
