  md: 'Once *sendmail* is built, you need to configure it. *Sendmail* uses m4 to build
    its final /etc/sendmail.cf file from .mc source configuration files. This allows
    you to define some fairly complex mailer behavior by simply defining an m4 option
    and then building your /etc/sendmail.cf. The alternative is to hack at /etc/sendmail.cf
    manually, which is sometimes okay for a simple change, but unless you feel completely
    confident fooling with stuff like **Listing A**, I''d recommend against doing
    so. (Of course, if you''re a Perl hacker, you''re probably wondering why they
    chose to make the file so readable.)


    +   - **divert(-1):** This just means to ignore anything following, up until a
    **divert(0)** command appears.

    - **VERSIONID:** This drops the version information in the resulting configuration
    file.

    - **OSTYPE:** This is very important. If you don''t properly define the OSTYPE,
    you''ll have a number of problems getting things up and running.

    - **DOMAIN:** You can enter your domain name here or leave it as generic and let
    *sendmail* get the name from the system.

    - **MAILER(local):** The local mailer is always included automatically.

    - **MAILER(smtp):** It should be noted that, if you intend to add other FEATURE
    directives, the MAILER directives should be at the end.


    Some of the options at the top of the /etc/sendmail.cf file are not quite so cryptic
    and can be easily changed right there. The downside of even making minor changes
    in the configuration file is that, if you ever need to regenerate from the m4,
    your changes may be lost.


    So, from the newly created *sendmail-x.x.x* directory, run the commands


    ```

    cd cf/cf

    cp generic-linux.mc mysite.mc

    ```


    which will copy the *generic-linux.mc* file to the *mysite.mc* file. By doing
    this, you will ensure that you still have a copy of the original, should you need
    to start over.


    You should pick a template file that most closely resembles your environment.
    I''m building on a Linux system, so *generic-linux* seems appropriate.


    Let''s take a look at the template file, which is shown in **Listing B**.


    Not too much to be seen here. Remember, this is just a generic template. For many
    sites, this would be enough. Let''s talk about the directives in the file:


    That''s it. Each one of these directives will generate from one to many lines
    in the resulting .cf file, which you build with the command shown in **Listing
    C**.


    You''ll end up with about a 1200-line *myfile.cf*, similar to the sample configuration
    file that you can access via the CD-ROM that accompanies this book. You''ll also
    notice in the above output the commands you would need to run if you wanted to
    manually process an .mc file into a .cf:


    ```

    /usr/bin/m4 ../m4/cf.m4 mysite.mc > mysite.cf

    ```


    Recent versions of *sendmail* keep the configuration files in /etc/mail, rather
    than just /etc.


    **Listing A:** *Stripping syntax*

    # strip group: syntax (not inside angle brackets!) and trailing semicolon


    ```

    R$*                                          $: $1 <>                            mark
    addresses

    R$* < $* > $* <>               $: $1 < $2 > $3                      unmark <addr>

    R@ $* <>                         $: @ $1                                  unmark
    @host:...

    R$* :: $* <>                  $: $1 :: $2                              unmark
    node::addr

    R:include: $* <>              $: :include: $1                          unmark
    :include:...

    R$* [ $* : $* ] <>           $: $1 [ $2 : $3 ]                        unmark IPv6
    addrs

    R$* : $* [ $* ]                 $: $1 : $2 [ $3 ] <>              remark if leading
    colon

    ```'
