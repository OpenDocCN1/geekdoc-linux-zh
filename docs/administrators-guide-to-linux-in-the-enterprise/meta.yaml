- img_proc: false
  md: 'the user(s) can actually run many tasks at once. In a multiuser operating system
    like Linux, the operating system also protects each user from the actions of all
    the other users.


    Since the common PC typically boots off a hard disk, that''s where we will install
    the operating system. You could design a system to boot from other devices, such
    as the network interface, the tape drive, a floppy drive, or even from firmware.
    However, we will only concern ourselves with the installation of the operating
    system on a hard drive and with the installation of the boot loader on a hard
    drive.


    Linux prefers its own custom filesystem, called ext2, to the FAT16 filesystem
    or FAT32 filesystem found in Windows-based computers. You could probably get Linux
    to run within these Windows filesystems, but this would seriously impact security
    and performance. The ext2 filesystem associates an owner, a group, and a privilege
    specification with each filename. This allows Linux to protect against unauthorized
    access to privileged files, which is not supported in the Windows filesystems.


    Already, we can see the challenges involved in installing Linux on a computer.
    Somehow, we have to install a Linux ext2 filesystem on a hard drive. Then, we
    have to install the Linux operating system into that filesystem, and lastly, we
    need to install a boot loader onto the disk that will allow us to boot our Linux
    operating system. Since many people will want to run both Linux and Windows on
    the same computer, I shall discuss methods for providing this dual-boot capability.


    # The install strategy


    Regardless of which Linux distribution you want to install, all of them use the
    same basic strategy. In this section, I will discuss the sequence of events that
    must happen in order to create a Linux system. Then, in the following sections,
    I will discuss the specifics of the Slackware installation and the Red Hat installation.


    Installing an operating system reminds me of the old chicken and egg problem.
    What better way to build a Linux system than to start with an existing Linux system?
    Linux already has the ability to partition disks and to format disk partitions
    for the ext2 filesystem and for Linux swap partitions. So to this end, we will
    use a working Linux system, fully contained within two floppy disks.


    The floppies contain a boot loader, the Linux kernel, and a minimal filesystem
    complete with the required utilities. When the Linux kernel is loaded, the user
    can then log in and run any of the command files contained within the floppy filesystem.
    Before doing anything else, we must use the fdisk command to partition a hard
    drive. Once we have at least one ext2 partition and one Linux swap partition,
    we can save the new partition table back to the disk. When we do this for real,
    we must be very careful not to destroy any existing Windows partitions! If you
