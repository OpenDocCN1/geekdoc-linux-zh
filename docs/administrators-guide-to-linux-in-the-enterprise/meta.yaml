  md: '# Arguments


    There are two kinds of arguments: options and a file name or list of file names.
    An argument is sent with a command, often to inform the command what file to act
    on or how to act on the specified file. For example, the ls command (for listing
    files/directories and their attributes) can be run by typing ls. You can also
    add arguments to the command, such as ls -l, which is the long format—it returns
    permissions, ownership, size, and modification date of the entire directory in
    which you ran the command. However, suppose you don''t want to see the entire
    contents of the directory and you want to list the attributes of only the file
    chump.txt. To do so, run:


    ```

    ls -l chump.txt

    ```


    The ls command above uses two arguments: -l, and chump.txt.

    Command arguments aren''t limited to a one-at-a-time instance. Let''s say you
    wish to list all files in a directory, including hidden files (files that begin
    with a period [.]), and you also want:


    +   - Long lists.

    - The listing in human-readable form.

    - To only print one entry per line of output.

    - To list the files by status change time (not creation/modification time).

    - Times listed fully, not abbreviated.

    - The output in color.


    This command would look like:


    ```

    ls -alh -1 --full-time --color

    ```


    When you run this command, you''ll see entries such as:


    ```

    -rw-r--r-- 1 jlwallen jlwallen 2.1k Tue Dec 21 01:12:11 1999 .Xdefaults

    ```


    Some commands require that all arguments be combined with a single [-]


    # Directing output of a command


    It''s also possible to direct the output of a command to a file in order to make
    reading and analyzing data more efficient and flexible. Say, for instance, you
    need the output of uptime (a simple application that lists how long your machine
    has been running) but you don''t have time to read it (although the output is
    very brief) or you would like to catalog its output. To run uptime in the standard
    fashion, type uptime and you''ll see output similar to:


    ```

    11:14am up 33 days, 22:23, 1 user, load average: 0.00, 0.02, 0.03

    ```


    Some admins like to keep a running diary of this output, which would append the
    output of each run of uptime to the end of a particular file. To see how this
    works, type touch uptime.diary to create an empty file called uptime.diary. Next,
    output your first run of uptime to the newly created file. To do this, type uptime
    > uptime.diary, then type less uptime.diary to see the first entry. To add the
    next entry or append the entry, you''ll use the append operator, or >>:


    ```

    uptime >> uptime.diary

    ```


    Now when you run less uptime.diary you''ll see two entries. Now let''s say you
    want this file appended at a certain time or times each day. To do this, use cron
    to run the command and append the file daily. As root, cd to /etc/cron.daily,
    open your favorite text editor, and type the following:'
  merge: -1
