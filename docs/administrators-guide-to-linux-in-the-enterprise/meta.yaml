  md: 'we define labels like *linux-nofb* for a nonframebuffer kernel and *linux2.2*
    for a 2.2 kernel.


    You also need to define the root directory for this Linux installation with the
    *root* keyword. Here, we define */dev/hde1*, which we mount as / (root).


    If you have a SCSI adapter or if you use the ReiserFS filesystem, you will probably
    need an *initrd* image. This image is the initial ramdisk to be loaded for the
    specified kernel. This is particularly needed in systems where you boot off a
    SCSI drive or you have your root partition formatted to ReiserFS. The *initrd*
    image will contain the modules for those devices; without the modules available,
    you will not be able to boot off of your SCSI devices or mount your root partition.


    The *append* keyword tells LILO what options to pass to the kernel when booting.
    In this case, we pass "hdb=ide-scsi" to the kernel, which tells the kernel that
    the device */dev/hdb*, our IDE CD writer, is to be used with the ide-scsi module.
    This allows us to use tools like *cdrecord* to write to our IDE CD-RW with the
    SCSI emulation for IDE devices driver.


    The *read-only* keyword tells LILO to mount the root partition as read-only. Don''t
    worry, because later the startup procedures will remount the root filesystem as
    read-write, after performing a check on it. This is just a safety precaution.


    You can have as many image definitions as you want. As stated earlier, I have
    a system that boots between 10 different Linux distributions, so my *lilo.conf*
    file is full of image directives. You can also see here that you can tell LILO
    to boot from other devices, like the floppy disk. This can be beneficial because
    it will allow you to prevent people from putting their own floppy boot disk into
    the system to boot off of by telling the BIOS to boot from the hard drive only.
    By password-protecting LILO and your BIOS, you can ensure that only authorized
    people will be able to boot from a floppy.


    To save your changes and regenerate the boot image, you will need to run the *lilo*
    command. I suggest using:


    ```

    /sbin/lilo -v

    ```


    This will tell LILO to be verbose and tell you what it is doing as it does it.
    This way, if you do have any errors in your file, you can determine quickly what
