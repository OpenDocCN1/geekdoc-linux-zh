  md: 'What we are asking for here is that the *HOLD_EXPENSIVE* flag in *sendmail.cf*
    be set to true and that all SMTP mailers be marked as expensive. We''re also going
    to pass all the outgoing mail to the *SMART_HOST* server at our ISP—smtp.myisp.com.


    The effect on the resulting *sendmail.cf* will look like **Listing G**.


    And finally, if you look at the definitions of the SMTP mailers near the end of
    the *sendmail.cf* file, you''ll note the addition of the *e* flag for expensive:


    ```

    Msmtp,     P=[IPC],      F=mDFMuXe

    ```


    The local mailers will not have the *e* flag.


    Now all outgoing mail will be held, until you run the command:


    ```

    /usr/sbin/sendmail -q -v

    ```


    By default, relaying through *sendmail* is now disabled. Relaying from/to any
    host used to be fairly commonplace, before the wild explosion of the Internet
    and the corresponding spam e-mail we all receive. Most mail servers now deny relaying
    by any host outside their own domain or certain "trusted" hosts. In the next article,
    we''ll cover how to fine-tune this behavior, as well as how to control usage of
    the mail system by folks both inside and outside of your system.


    # ## Conclusion


    We''ve touched on a handful of features that you can enable in the *.mc* files,
    as well as a bit about the database files that *sendmail* uses. As I mentioned
    earlier in this article, *sendmail* is an extremely flexible, configurable program
    with a long history. There are many more features and "hacks" that can be enabled.
    The O''Reilly "bat" book has 1,000 pages of *sendmail* and related documentation,
    which may give you an idea of just how deep the subject can be. Some people have
    written off *sendmail* as a dinosaur and tout the virtues of other mailers, such
    as *qmail*. These mailers are good too, but *sendmail* still runs many a high-volume
    mail site quite satisfactorily.


    # ### Listing G: *Smart relaying*


    ```

    # "Smart" relay host (may be null)

    DSsmtp.myisp.com


    # avoid connecting to "expensive" mailers on initial submission?

    O HoldExpensive=True

    ```


    # # Sendmail from the ground up: Features, testing, and performance tuning


    *By Stewart Benedict*


    In "Understanding sendmail from the ground up," I covered where to get *sendmail*,
    as well as how to build it from source and set up a basic *sendmail.cf* using
    the *sendmail .mc* files and options. This time, I''m going to cover some additional
    *.mc* options and the effect they have on *sendmail.cf*. I''ll also cover some
    command-line switches and ways you can use *sendmail* itself to test any address
    rewriting you do using aliases or masquerading. Finally, I''ll offer a little
    information on performance tuning and how to analyze the *sendmail* statistics
    and log files.'
