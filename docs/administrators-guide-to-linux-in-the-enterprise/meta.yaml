  md: '+   1. 0—Halt (Do not set *initdefault* to this run-level.)

    2. 1—Single-user mode

    3. 2—Multiuser—with no networking support

    4. 3—Full multiuser mode—with networking support

    5. 4—Unused

    6. 5—X11—with multiuser and networking support

    7. 6—Reboot (Do not set *initdefault* to this run-level.)


    It’s possible to specify multiple run-levels in the same *init* configuration
    line. For example, to specify a configuration for both run-level 1 and run-level
    3, use the following syntax:

    `id:13:action:process [arguments]`.

    **Table A** lists the possible actions for system run-levels.


    # **The /etc/rc.d/rc.sysinit script**


    When a Linux system is booted, the kernel runs *init*, which in turn runs the
    `/etc/rc.d/rc.sysinit` script. This script is run before any other actions are
    taken because of the following line in the `/etc/inittab` file:

    `si::sysinit: /etc/rc.d/rc.sysinit`

    The run-level field in this line is empty because *init* recognizes *sysinit*
    as a system initialization action. The *rc.sysinit* performs several tasks, including
    setting the hostname, enabling the swap partition, checking filesystems, and loading
    kernel modules. Normally, you will not have to modify the `/etc/rc.sysinit` script.


    # **The /etc/rc.d/rc script**


    When *init* is told to change to one of the seven possible run-levels, a script
    specified in one of the following seven lines in the `/etc/inittab` file is run:


    # **Table A: Possible actions for system run-levels**


    | Action | Description |

    |---|---|

    | respawn | The process is restarted whenever it terminates. |

    | wait | The process is run once, and init waits until it terminates. |

    | once | The process is run once. |

    | boot | The process is run during system boot, regardless of the run-level. |

    | bootwait | The process is run during system boot, and init waits for the process
    to terminate. |

    | off | No action is taken. Used to disable a configuration line without removing
    it. May be used instead of a comment (#). |

    | ondemand | Normally not used. |

    | initdefault | Specifies the default run-level for the system. The process filed
    is ignored. |

    | sysinit | The process is run once during system boot. A sysinit action takes
    precedence over boot or bootwait actions. |

    | powerwait | Run when init receives a SIGPWR signal. An uninterruptible power
    supply (UPS) will issue the SIGPWR signal when a power problem. Is detected. When
    the SIGPWR signal is issued, init will wait until the process terminates. |

    | powerfail | Same as powerwait, but init does not wait for the process to terminate.
    |

    | powerokwait | Run when init receives a SGIPWR signal and the /etc/powerstatus
    file contains the text string OK. This file is normally created by the UPS monitoring
    software and is used to indicate that the power problem is corrected. |

    | ctrlaltdel | Run when init receives a SIGINT signal. |

    | kbrequest | Run when init receives a keyboard signal from the keyboard handler.
    |'
