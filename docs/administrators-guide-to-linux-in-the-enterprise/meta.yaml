    # Jack Wallen, Jr.''s one-hour Linux tutorial, part 2


    *By Jack Wallen, Jr.*


    In part one of this series, I explained what to do when you first start your new
    Linux machine, as well as how to run simple commands, get connected to the Internet,
    install via .rpm files, move around the desktop, and do a bit of customizing.
    This time around, I''m going to dive a bit deeper into the system and explain
    how to safely shut down your machine, manage power with various applications,
    and modify and augment simple commands. Again, this tutorial makes the same assumptions
    as part one:


    +   - Linux is already installed on your computer.

    - This computer will be used as a desktop machine.

    - You''re using the Red Hat 6.1 Linux distribution.


    So grab your best geek wear and your favorite caffeinated beverage, put on some
