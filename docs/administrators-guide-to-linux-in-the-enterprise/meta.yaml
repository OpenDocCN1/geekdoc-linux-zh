  md: '# ## Down to business


    Now you''re ready to tackle Samba itself. Like most configuration activities in
    Linux, Samba is configured using a text file, *smb.conf*, in the */etc* directory.
    However, before you begin editing this file to meet your needs, let''s make a
    copy of it. Issue the following command:


    ```

    cd /etc


    cp smb.conf /usr/doc/samba-2.x

    ```


    Replace **x** with your version of Samba.


    The second command above copied your *smb.conf* file into the directory that contains
    the documentation files included with Samba. Now you can dig in to *smb.conf*.
    From the */etc* directory, you''ll use a text editor to open the file by issuing
    the following command:


    ```

    pico smb.conf

    ```


    For this article, I''ll use the text editor *pico* for the examples because I
    feel it is the best one for beginners; however, you can use any text editor for
    these tasks.


    Once you open *smb.conf*, you''ll notice several types of text lines in this file.
    The lines with a **#** preceding them contain comments on the configuration options.
    Lines that are preceded by a semicolon (;) indicate configuration variables that
    have been "turned off." Both symbols do the same thing: They keep the information
    that follows them from being parsed for configuration data.


    To simplify the Samba configuration and make *smb.conf* easier to work with, use
    your text editor to delete all the lines that begin with a **#**. In *pico*, you
    can do this by using the arrows to place the cursor at the beginning of the line
    and then pressing [Ctrl]K to delete the entire line. Do this for each of the commented
    lines in the *smb.conf* file. Remember that if you want to go back and refer to
    these comments, you can look at the copy of *smb.conf* that we copied to the */usr/doc/samba-2.x*
    directory.


    # ## Optimizing Samba for Linux-NT integration


    Now that you''ve cleaned up the *smb.conf* file, you''ll notice numerous bracketed
    fields such as *[global]* and *[printers]* and lines such as *workgroup = MYDOMAIN*
    underneath them. The bracketed fields represent share and printer names, with
    a few exceptions, and the *variable = value* lines are the configuration options
    for those shares and printers.


    The crux of a good Samba configuration centers on properly setting the *[global]*
    variables. While most other bracketed fields refer to one share, this one manages
    the settings that govern all the shares. It can be a little intimidating at first
    because of the number of variables; however, I''ll walk you through the settings
    of the most important variables, and we''ll delete the nonessential ones.


    The following is an example of a file with *[global]* settings that are optimized
    for basic integration of a Linux Samba file server in a Windows NT domain:


    ```

    [global]


    security = domain


    password server = NTServer, NTServer2


    workgroup = AAC


    netbios name = LINUX1


    server string = Testing Samba


    nt acl support = yes


    wins server = 10.1.10.5


    dns proxy = no


    name resolve order = wins lmhosts bcast


    encrypt passwords = yes


    log file = /var/log/samba/log.%m


    max log size = 50


    remote announce = 10.1.10.255


    remote browse sync = 10.1.10.255 10.1.20.255


    socket options = TCP_NODELAY SO_RCVBUF=8192 SO_SNDBUF=8192


    printcap name = /etc/printcap


    load printers = yes

    ```


    Of all the setting variables listed above, the most important is *security = domain*.
    This setting tells Samba how to authenticate users. There are four available options:


    +   - user

    - share'
