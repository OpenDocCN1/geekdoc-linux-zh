  md: 'Yes, there it is. As you can see, our older Apache is also running, but you
    can tell that the processes starting at PID 8068 in the output example belongs
    to our new Apache server.


    The next step is to point your Web browser to localhost:8080 or www.yourdomain.com:8080,
    depending on where you are in relation to the new server. If you see the Apache
    welcome page, congratulations! Apache is working successfully on your system!
    But since we are a little paranoid and want to make extra sure, we''ll do the
    following:


    ```

    telnet localhost 8080

    ```


    You will then see:


    ```

    Trying 127.0.0.1...

    Connected to localhost.localdomain.

    Escape character is ''^]''.

    ```


    At this point, type the following and press [Enter]:


    ```

    HEAD / HTTP/1.0

    ```


    You should then see something very similar to the following:


    ```

    HTTP/1.1 200 OK

    Date: Fri, 22 Jun 2001 01:26:57 GMT

    Server: Apache/1.3.20 (Unix)

    PHP/4.0.6

    ..

    ```


    The rest we can ignore. If you were to do this same test to the Web server running
    on port 80, you would probably see an older version of Apache and possibly an
    older PHP, as well. But here, as you can see, it reports the server running Apache
    1.3.20 and PHP 4.0.6, both of which we installed just now.


    There''s one final test to make sure that PHP works properly: Go to your /usr/local/apache/htdocs
    directory and, using your favorite editor, create a new file called test.php,
    which contains:


    ```

    <? phpinfo(); ?>

    ```


    Now point your browser to localhost:8080/test.php or a similar URL for your new
    Apache installation. Do you see a page full of information pertaining to PHP,
    such as system information, the correct version of PHP, and details on configuration
    directives? If you do, PHP is working correctly as well. Congratulations!


    # Conclusion


    What we have accomplished today is something many people balk at. We''ve all been
    spoiled by nicely packaged RPM and DEB packages of some of our favorite software;
    however, you must keep in mind that the packagers make some rather liberal assumptions
    about how the server is going to be run, and they try to build it in such a way
    that it will work for everyone. This sometimes creates extra bloat, takes up more
    space than it needs to, and may not be quite as efficient as a streamlined self-compiled
    application. The same can be and has been said for kernels for a long time now,
    so why not applications such as Apache? While Apache is using DSOs now and this
    has slimmed down the application itself, some of the generic options used to compile
    the package may not be to your liking or suit your needs.


    Being able to build server applications that you use is a helpful skill. And,
    if nothing else, you can take these same skills and use them on operating systems
    that do not prepackage many applications for you, such as OpenBSD and some other
    UNIX variants.


    At any rate, being able to build and streamline both Apache and PHP is something
    every system administrator should be able to do. As you can see, it can be a little
    complicated, but with a little work and this article in front of you, you''ll
    be able to manage just fine.'
