  md: 'the most commonly used. You will need, for example, to enable the MySQL support
    if you wish PHP to interact with your MySQL database.


    Finally, you will need to build PHP. This is accomplished the same way as with
    Apache, by running the two magic commands:


    Make


    make install


    And that''s it! You have now installed the Apache Web server and PHP support for
    it.


    # Testing Apache and PHP


    The next step is to test the server. The configuration files for your new Apache
    server are located in the /usr/local/apache/conf directory. Change to that directory
    and edit the httpd.conf file you find there. Find the line that contains the keyword
    Port, which should be line 314 for those of you using Apache 1.3.20. Change the
    value of the keyword from the default 80 to 8080. This will tell Apache to bind
    to port 8080, which is suitable for testing.


    You will also need to uncomment support for PHP. In the same file, go to line
    843 and uncomment the following two lines:


    AddType application/x-httpd-php .php


    AddType application/x-httpd-php-source .phps


    Save your changes. Now we want to start Apache, and to do so, we will use the
    following command:


    /usr/local/apache/bin/apachectl start


    You should see something like this if all went well:


    ./apachectl start: httpd started


    Next, we''ll take a look at the process list to see if the httpd service is listed
    by issuing:


    ps aux|grep httpd


