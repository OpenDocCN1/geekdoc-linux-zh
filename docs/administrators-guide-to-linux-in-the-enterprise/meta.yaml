  md: '# Enabling additional features


    Let''s look at some more of the features that can be enabled in the .mc file,
    which is used to generate sendmail.cf. Just as a refresher, we define our configuration
    in the .mc file and then use the m4 processor to generate the .cf file:


    /usr/bin/m4 ../m4/cf.m4 mysite.mc > mysite.cf


    Sendmail now ships with relaying disabled. In the early days of the Internet,
    these things weren''t such an issue, but with the overwhelming amount of spam
    we all get, it''s been necessary for responsible system administrators to tighten
    up the control on whose mail passes through their systems. If you want to reenable
    relaying, add the following feature to your .mc file:


    FEATURE(''promiscuous_relay'')


    If you want to only open up relaying to your own domain, then use:


    FEATURE(''relay_entire_domain'')


    The other side of the coin is how to set up a server to appear to be another domain.
    This is useful if you are relaying mail from an unqualified domain, such as a
    small business or home server, but want to queue up the mail and batch it through
    to your ISP. This involves masquerading and, like relaying, there are several
    layers of control that can be enabled. The simplest level of masquerading is:


    MASQUERADE_AS(host.domain)


    So if your machine is mymailer.fakedomain.org, and you want outgoing mail to look
    like it came from your valid e-mail account at myisp.com, you would use myisp.com
    as the host.domain entry. In the sendmail.cf file, it generates the line shown
    in **Listing A**, plus a number of addressing rulesets further down the file (rulesets
    93 and 94).


    Some sites will still bounce this mail, so you may need to masquerade the envelope:


    FEATURE(''masquerade_envelope'')


    If you want to expose certain users, you can enter them in:


    EXPOSED_USER(usernames)


    You can also set up a virtual hosting setup, where your mailserver can act as
    a virtual host for a number of domains:


    FEATURE(''virtusertable'')


    In this case, you map the incoming mail address to the local system recipient:


    info@somedomain.com larry


    To map the outgoing mail in the same way, use the genericstable feature:


    FEATURE(''genericstable'')


    and set up /etc/mail/genericstable like virtusertable, but with the entries reversed:


    larry info@somedomain.com


    If you have a number of machines and want to relay all mail through one before
    going to the ISP, then enable:


    define(''LOCAL_RELAY'', ''mailer:hostname'')


    All mail with unqualified addresses (no @host) will get relayed to the local relay
    machine. In sendmail.cf, the resultant line looks like that shown in **Listing
    B**.


    A related feature is:


    define(''SMART_HOST'', ''mailer:hostname'')


    mailer defaults to relay, but smtp is also common. This generates the following
    line in sendmail.cf:


    ```

    Listing A: Masquerading

    # who I masquerade as (null for no masquerading) (see also $=M)

    DMmyisp.com

    ```


    ```

    Listing B: Relaying

    # who I send unqualified names to (null means deliver locally)

    DRmymailer.mynet.net

    ```'
