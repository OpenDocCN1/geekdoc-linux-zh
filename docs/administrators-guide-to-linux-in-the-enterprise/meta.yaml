    # Using Linuxconf


    Routing can be configured in a more intuitive way if you have the Linuxconf program,
    or something similar, available to you.


    With Linuxconf, you can easily set up routing. To do so, fire up Linuxconf and
    select the Networking section. Click on Routing And Gateways. Here, you have a
    few options from which you can choose.


    You''ll first need to set the defaults. Click the Defaults button, and define
    your default gateway by entering 192.168.10.1. If this were a router you were
    configuring, you would click Enable Routing to tell the kernel to allow packets
    from other systems to be routed through your system to the defined gateway.


    Here, you can also define routes to other networks, routes to other hosts, and
    routes to alternate local networks. To define routes to other networks, you would
    use the route command. Click Route To Other Networks, and you will be given a
    list of the currently defined routes. Click Add to add a new route.


    In the Add New Route window, you define the gateway to the other network, the
    destination network, and the netmask, which is an optional setting. In this case,
    you might set 192.168.10.25 as the gateway with 10.0.0.0 as the destination. You
    could optionally select 255.0.0.0 as the netmask. Click Accept to save the routing
    definition.


    You can similarly define the route to another host. For instance, if you only
    wanted to be able to reach the computer at IP address 10.0.0.28, you might select
    the Route To Other Hosts option and add a new route with the gateway of 192.168.10.25
    and the destination of 10.0.0.28. In this way, you don''t have to do blanket routing,
    because you would only be dealing with the one host. If you want to deal with
    more than one host in the 10.0.0.0 network, you probably want to define a route
    to the entire network. This is handy if you have multiple gateways routing to
    different parts of the same network. For instance, if 10.0.0.28 was located behind
    a gateway at 192.168.10.125, while the rest of the 10.0.0.0 network you need was
    located behind 192.168.10.25, you might define the gateway here of 192.168.10.125
    for the destination 10.0.0.28 and have the blanket route to 10.0.0.0 defined in
    the Route To Other Networks section. Since the packet will always be routed with
    the best match (or shortest path), it is safe to define routing in this fashion.


    Finally, you can define other local networks in the Route To Alternate Local Networks
    section. Unlike the previous definitions, this does not work by going through
    a defined network but by broadcasting through the defined Ethernet interface.
    For instance, if you were configuring your router, the defined local network may
    be 192.168.10.0 for eth0 and 10.0.0.0 for eth1. You could define the interface
    as eth1, the destination as 10.0.0.0, and the netmask as 255.0.0.0. This would
    tell the kernel to route all traffic to the 10.0.0.0 network directly over the
    eth1 interface instead of through a gateway.


    Another likely interface would be running a multilayered network where your primary
    address is in the 192.168.10.0 network with a secondary address as an alias in
    the 10.0.0.0 network. For instance, your primary eth0 address might be 192.168.10.12
    and your alias—which would be listed as eth0:0—might be 10.0.0.12. You would define
    the interface as eth0, the destination as 10.0.0.0, and the netmask as 255.0.0.0.
    Your system would then handle traffic for both the 192.168.10.0 and 10.0.0.0 networks
    transparently.'
