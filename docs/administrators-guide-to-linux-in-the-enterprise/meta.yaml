    # Decisions, decisions: Plain text vs. encrypted passwords


    Next, you''ll need to consider whether you want to use plain text or encrypted
    passwords. If you want to use plain text passwords, you''ll have to modify the
    Windows clients; if you want to use encrypted passwords, you''ll need to modify
    your Samba installation, as explained in the next section.


    Which is best, plain text or encrypted passwords? The short version: Use encrypted
    passwords. Here''s why: By default, Samba uses plain text passwords, which means
    that passwords are sent as ordinary text over the network. These passwords could
    be detected by an intruder and used to gain access to confidential resources.
    This isn''t a problem in a small network in which all users are reasonably trustworthy.
    Still, it''s not a bad idea to use encrypted passwords, even on a small network.


    As you''ve just learned, the most convenient way to configure Samba passwords
    involves using exactly the same usernames and passwords for the user''s Linux
    and Windows accounts. The downside lies in what might happen if people use a packet
    sniffer to detect user passwords: They''ll get access to all of the user''s accounts—including
    their Linux accounts—and from there it''s not very difficult to get into the rest
    of the server. In a large network connected to the Internet, or in a private network
