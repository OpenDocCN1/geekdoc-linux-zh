    # STARTUP AND SHUTDOWN


    # Creating Linux boot disks from both Linux and DOS


    By Jack Wallen, Jr.


    Have you ever been in a situation where your machines have been rendered unbootable,
    only to find that you skipped the creation of a boot disk at installation? Even
    worse, have you ever attempted a Linux installation only to find that your CD-ROM
    was unbootable? What can you do in such a situation? You can create all sorts
    of boot and rescue disks.


    There are a number of ways to create boot and rescue disks as well as a number
    of types of boot disks to create. In this article, I''ll walk you through the
    creation of boot disks from both a Linux and a DOS environment so that you will
    have all the help you need—in most situations.'
