  md: 'aren''t the same on both systems. If there are discrepancies, you must fix
    them before proceeding.


    This isn''t the place to go into all the details of modifying user and group names.
    Chances are you can use a user-friendly utility for this purpose, such as the
    KDE user manager or, on Red Hat systems, *linuxconf*. If you prefer the command
    line, you can use *usermod* to make the necessary changes—but don''t forget to
    use *chown* -R (in recursive mode) to change the ownership of all the files in
    the user''s home directories.


    # Modifying /etc/hosts.allow and /etc/hosts.deny


    Get started by securing your system. You''ll modify the */etc/hosts.allow* and
    */etc/hosts.deny* files so that you''re protected against a whole series of possible
    attacks. This protection isn''t bulletproof, to be sure, but it will eliminate
    a number of tricks that the script kiddies have been pulling for years.


    +   1. Open a terminal window and switch to superuser (type *su* followed by your
    password).


    +   2. Use your favorite text editor to open */etc/hosts.deny*.


    +   3. On a blank line, type *portmap: ALL*.


    +   4. Save the file.


    +   5. Open */etc/hosts.allow*.


    +   6. On a blank line, type *portmap:* followed by a space, the IP address of
    the client machine, a forward slash mark, and the netmask of the client machine.
    For a Class C network, which is what you''re probably using, the default netmask
    is 255.255.255.0. If you''re not sure what the client''s netmask is, go to the
    client, open a terminal window, type *ifconfig*, and press [Enter]. Look for the
    IP address and netmask under the Ethernet network interface (eth0, unless the
    machine has more than one Ethernet card). In */etc/hosts.allow*, an example of
    a valid entry is portmap: 192.168.100.10/255.255.255.0. If you would like to make
    the exported directories available to all the machines on your network, you can
    use a


    wildcard, as in this example: portmap: 192.168.100.*/255.255.255.0.


    +   7. Save the file.


    # Getting all your daemons in a row


    To work with NFS, you will need the following daemons (memory-resident programs)
    running on both servers *and* clients:


