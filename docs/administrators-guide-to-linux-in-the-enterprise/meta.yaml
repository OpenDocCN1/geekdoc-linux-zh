  md: 'many lines as you like. Basically, Qmail runs the specified program in a shell
    and uses *sh -c [command]* to execute the command that''s listed in the dot-qmail
    file. When Qmail runs the shell command, it also provides a number of environment
    variables from the message that will be processed, including:


    ```

    SENDER The envelope''s sender address

    RECIPIENT The envelope''s recipient address (local@domain)

    USER The user''s username

    HOME The user''s home directory

    ```


    There are several other useful variables. (To obtain more information, use *man
    qmail-command 8* and view the manual pages.) Qmail also makes the message text
    available by using standard input for whatever command you''re running.


    > The best thing about the *supervise* program is that it''s not limited just
    to usage with Qmail; it can be used for any service that you want to run supervised.


    # ## Restarting Qmail after configuration


    You need to restart Qmail each time you change a control file. When you make changes
    to dot-qmail files, however, you don''t need to restart Qmail. Qmail reads that
    information dynamically; changes or additions to aliases are immediate. If you''re
    adding support for virtual domains or adding new hosts for which Qmail needs to
    receive mail, however, you need to restart Qmail. On a Red Hat or a Linux Mandrake
    system that uses the */etc/rc.d/init.d* startup scripts, you can use:


    ```

    /etc/rc.d/init.d/qmail.init restart

    ```


    You don''t need to restart the SMTP and POP3 daemons—just Qmail itself.


    # ## Supervise


    If Qmail is supervised, you could use the following line:


    ```

    svc -h /service/qmail

    ```


    This line sends the HUP signal to the qmail-send process. To have the *supervise*
    program watch the Qmail programs, you need to install the *daemontools* package.
    Then, issue the following command line as root:


    ```

    mkdir /service/qmail

    ln -s /var/qmail/rc /service/qmail/run

    ```


    Now, in your startup scripts, you''ll find the following line:


    ```

    /var/qmail/rc

    ```


    Change it to this line:


    ```

    supervise /service/qmail

    ```


    The benefit of having *supervise* control Qmail is that you can use the *svc*
    program to start, stop, and restart Qmail safely. You can use the *svstat* program
    to see if Qmail is even running. It can restart Qmail if Qmail ever exits, and
    it will ensure that Qmail is running constantly. The best thing about the *supervise*
    program is that it''s not limited just to usage with Qmail; it can be used for
    any service that you want to run supervised.


    Qmail offers numerous FAQs and extension programs that will help you to get the
    best performance from your Qmail system.


    # ## Virtual domains


    Qmail also supports virtual domains. If your system (*mydomain.com*) wishes to
    accept e-mail for *virtual.com*, just tell Qmail to accept e-mail for *virtual.com*.
    Add the following line to your */var/qmail/control/rcpthosts* file:


    ```

    virtual.com

    ```


    This line will give every user on your system a *user@virtual.com* address, along
    with their normal *user@mydomain.com* addresses. If you want to forward all e-mail
    for the virtual domain to one specific user, however, you''ll need to create a
    file called */var/qmail/control/virtualdomains*. If you want all e-mail for *anyone@virtual.com*
    to be forwarded to Joe, add this line to the new *virtualdomains* file:


    ```

    virtual.com:joe

    ```


    You''ll still need to include *virtual.com* in your */var/qmail/control/rcpthosts*
    file. Otherwise, Qmail will refuse e-mail for that domain.'
