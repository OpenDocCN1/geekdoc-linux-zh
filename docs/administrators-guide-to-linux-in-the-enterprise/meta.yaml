  md: "```\n--with-modules=mod_linuxprivs:\n  mod_ratio:mod_readme\nmake\nmake install\n\
    ```\n\nThe first command will set up the *make* environment. Here you tell it\
    \ to use the */usr* directory as the top-level directory for the installation,\
    \ and it will place binaries into *usr/bin*, manpages into */usr/man*, and so\
    \ forth. You also tell it to look for the *proftpd.conf* file in the */etc* directory\
    \ and to provide local-state files (PID, or Process Identification files) in the\
