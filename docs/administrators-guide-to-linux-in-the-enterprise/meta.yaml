  md: 'provided to a competitor in exchange for a job offer. (Yes, it happens.)


    For this reason, today''s NFS implementations, including those found on Linux,
    implement a feature called *root squashing* (it''s enabled by default). In brief,
    root squashing comes into play when you establish a root user session on a client
    and try to access server directories that are owned by the root user. NFS steps
    in and changes the client root user''s ID to an anonymous ID, nobody, which is
    specifically designed to make it very difficult to do any damage. The nobody user
    might well be named Nowhere Man after The Beatles'' song; this user doesn''t know
    what he or she is missing, because most of the server''s file system is quite
    deliberately protected from view.


    # Gotcha!


    Root squashing helps to solve the underlying security deficiencies of NFS, at
    least at the level of leaving servers vulnerable to root user attacks. But this
    leads us to NFS Gotcha #1. On most Linux distributions, the NFS mount utility
    is configured so that you can''t run it from your ordinary user account; you see
    the message *Only root can do that.* So you switch to root and try to mount the
    remote directory. But you''re refused permission! Why? As far as the server is
    concerned, you''re trying to log on as nobody, and this user has very few privileges.
    So what should you do? Disable root squashing? That''s not a very good idea, since
    it leaves the non-squashed system open to any intruder who gains root user status
    somewhere on the network. For this reason, you''ll want to set up NFS so that
    ordinary users can access their *own* directories, or publicly accessible directories,
    on remote servers. You''ll learn how later in this article. (In brief, what''s
    involved is defining the remote directory in `/etc/fstab` as if it were a user-mountable
    device, such as a CD ROM or floppy disk drive.)


    You *can* set up NFS so that ordinary users can mount the directories that they
    own on remote servers. But this leads us to NFS Gotcha #2. For ordinary user accounts,
    NFS requires that users have exactly the same username—and numerical user IDs—on
    both systems (the server and the client). On lothlorien,


    I''m set up as the user named bryan (ID 501), and I belong to the group named
    strider (ID 101). Unless rivendell knows me as the bryan (ID 501) who belongs
    to the strider group (ID 101), NFS isn''t happy. In short, in order to set up
    NFS so that users can mount directories on a remote NFS server, you need to make
    sure that their accounts are defined exactly the same way on both the client and
    the server.


    "So that''s why it didn''t work," you''re probably thinking. "Why isn''t this
    explained more clearly?" It is, actually—it''s in the man (manual) pages. All
    too often, how-to authors assume you''ve read the man pages and memorized everything
    that''s in them. That''s understandable, but it would be nice if they would at
    least mention that they''re assuming some knowledge—and in this case, a considerable
    amount of knowledge.


    # Getting NFS to work: An overview


    To get NFS working successfully, you''ll tackle the following tasks:


    +   - Make sure your user and group IDs match on the client and server systems.

    - On the server, modify `/etc/hosts.allow` and `/etc/hosts.deny` so that the server
    will accept portmap requests from clients on your network.

    - Make sure all the needed daemons and utilities are running happily.

    - On the server, create or modify the `/etc/exports` file so that the server will
    make specified directories available to other machines on the network.

    - On the client, modify `/etc/fstab` so that the client will automatically load
    the exported directories when you start the client system.


    # Making sure user and group IDs are the same


    NFS comes into its own when ordinary users are able to access their remote directories
    smoothly, as if these directories were part of the user''s file system. However,
    as I explained earlier, NFS won''t work smoothly (or at all) if the user and group
    names and numerical IDs'
