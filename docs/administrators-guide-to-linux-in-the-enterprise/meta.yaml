    # Linux installation made easy


    By Ed Gold


    I wrote this article to ease the fears of the Linux-curious admin or hobbyist.
    If you ever thought that Linux was too labor intensive or too intellectual for
    you, then I urge you to read this article! I will show you that even the most
    computer-illiterate person amongst us can set up a Linux system. I have a fair
    amount of experience with both the Slackware Linux distribution and the Red Hat
    Linux distribution. Since these represent the least and most user-friendly Linux
    distributions, I will discuss the installation process for each. This will give
    the reader a fairly good overview of the full Linux installation spectrum.


    Linux is just a name for a UNIX knockoff operating system. The operating system
    is nothing more than a fancy collection of programs and other files that govern
    the system resources and provide services for user tasks. You are already probably
    familiar with several other operating systems, such as DOS and Windows.


    The operating system normally manages the system processor, the memory, the disk
    resources, the system interfaces, and the peripherals. In the case of a multitasking
    operating system like Linux, the operating system also manages the scheduling
    of user tasks so that'
  merge: -1
