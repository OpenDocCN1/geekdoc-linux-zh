  md: 'defining a home directory for a group, you will create a directory (for that
    group), which is owned by user and group *root* with a permission set of drwxr-xr-x
    (user/group/other can execute, user/group can read, and user can write). The only
    problem with this method is that when you create a group with a home directory,
    the home directory is owned by both user and group *root*. This will make it impossible
    for anyone belonging to the new group to write to this directory. If you want
    to allow group members to write to this directory, you need to change the directory''s
    group ownership. To change this ownership, open a command console, *su* to root,
    and run the proper command. Let''s say you have created the group *accounting*
    and you want any member of this group to be able to write to the new group directory
    */home/accounting*. To do this, run the following set of commands:


    ```

    cd /home

    chgrp accounting accounting

    chmod o+rw accounting

    ```


    Now any member of the group *accounting* will be able to write and read to this
    directory.


    # NOTE


    Please use extreme caution with this process because it can open up many security
    holes.


    # Conclusion


    Although there are many other uses for the *userconf* tool (changing the root
    password, creating special accounts, setting up e-mail aliases, and creating special
    policies for users), the most obvious and useful is the ability to create, delete,
    and modify user and group accounts.


    I''d like to let you in on a bit of admin fun! Within the *userconf* tool (click
    Message Of The Day under the Policies tab), you can create a message of the day
    that your users will see upon logging in to their machines. You can use this to
    many different ends—benign and malevolent!'
