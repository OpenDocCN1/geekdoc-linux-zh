  md: 'can positively transform the lives of people with disabilities, enabling them
    to contribute—and often to become stellar employees—in ways that would not have
    been imaginable a generation ago. And we''re not talking about small numbers here.
    According to a recent estimate, more than 30 million Americans have disabilities
    that could be negatively impacted by poor computer software or system design.
    At a time when companies are struggling to find competent employees in a tight
