    # Shutdown


    The process of shutting down a Linux machine, like Windows, must follow certain'
  merge: -1
  pgno: 73
- img_proc: false
  md: 'steps in order to ensure data coherence. When a Linux machine shuts down, there
    are certain steps that must be taken. The first step is that all logged-in users
    (if it''s a single desktop machine, then that''s you) are notified that the system
    is going down, and login is blocked. Next, all processes are first notified that
    the system is going down by the signal SIGTERM (signal termination). This gives
    programs like vi the time to save the file being edited, and mail and news processing
    programs a chance to exit cleanly. The *shutdown* command does its job by signaling
    the *init* process and asking it to change the runlevel to 0. Runlevel 0 (configured
    in the */etc/inittab* file) is used to halt the system, runlevel 6 is used to
    reboot the system, and runlevel 1 is used to put the system into a state where
    administrative tasks can be performed.


    The format of the command is:

    `/sbin/shutdown [-t sec] [-arkhncfF] time [warning-message]`


    In order to run the *shutdown* command manually, you must bring up a console (aterm,
    cterm, rxvt, Xterm) and run the command with the necessary flags and the time
    in which you would like shutdown to occur. For general use, there are two common
    flags for shutdown: -r and -h. The *-r* flag tells the *shutdown* command that
    you are rebooting the system, which will lead the machine through a standard shutdown/startup
    process. The *-h* flag tells the system that you are halting the shutdown process
    or, in more common terms, shutting down the system.


    You must also enter a time command for shutdown to take effect. The most common
    time for shutdown is *now*, so the command:

    `shutdown -r now`

    immediately reboots your machine. The command:

    `shutdown -h now`

    immediately shuts down your machine.


    The time argument can have different formats. First, it can be an absolute time
    in the format hh:mm, in which hh is the hour (one or two digits) and mm is the
    minute of the hour (in two digits). Second, it can be in the format +m, in which
    m is the number of minutes to wait. The word *now* is an alias for +0. So the
    command:

    `shutdown -r 17:00`

    will shut down your machine at 17:00 hours (or 5:00 P.M.) and will broadcast a
    message to all users that the machine is going down at 17:00. When issuing *shutdown*
    to bring down the system at a later time, it''s advisable to put the process in
    the background by adding the [&] character to the end of the command. By adding
    & to the command, you will still be able to use your machine (until the decided
    shutdown time). So now the command looks like:

    `shutdown -r 17:00 &`


    Once the *shutdown* command is issued, it''s possible to cancel the process. Depending
    on whether the shutdown command is in the foreground (no &) or background (&),
    you can terminate shutdown by pressing [Ctrl][C] if the command is in the foreground
    and you have no prompt, or you can type *shutdown -c* if the command is in the
    background.


    # Power management


    Power management is a topic of great debate within the Linux community. Although
    this topic primarily affects laptop users, it does have weight in the desktop
    community. I''ll discuss power management in a general sense, but be aware that
    many of its uses and aspects will relate primarily to laptops.


    Because most laptops are created with the assumption that Windows will be the
    OS, manufacturers use hardware that works in conjunction with Windows software.
    Take, for instance, Linux''s worst nemesis, the WinModem. Most vendors use WinModems
    because they''re cheap and because CPU speeds have risen to the point that the
    extra cycles the WinModems place on the CPU have little to no impact. Linux, however,
    can''t work with WinModems.


    Unfortunately, many of the power management features won''t work with Linux. For
    this reason, it''s best to take other precautions with your laptop; otherwise
    you''ll end up with a dead battery, as I did after only three months of use.


    This list of basic tips will help you reduce your laptop''s power waste. These
    tips are from the Battery Powered Linux Mini-HOWTO.'
