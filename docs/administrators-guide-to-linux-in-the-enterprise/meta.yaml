  md: '# Everything you wanted to know about Linux networking but were afraid to ask


    By Larry Mintz


    In this article, I''ll dive into the heart of networking. I''ll discuss setting
    up a LAN, setting up a TCP/IP network, and writing the files you need. For the
    purpose of example, let''s assume that Linux is being set up for a LAN for a company
    called linux_stuff.com.


    You might be familiar with Red Hat''s *Linuxconf* tool. This tool is a user-friendly
    GUI that allows the administrator to configure, graphically, many aspects of a
    networking environment. The *Linuxconf* GUI writes to the following scripts:


    +   - **Networking | Name Server Specification:** This section writes to `/etc/resolv.conf`.

    - **Networking | Basic Host Information:** This section writes to `/etc/HOSTNAME`.

    - **Networking | Misc | Information About Other Networks:** This section writes
    information about your network to `/etc/networks`.


    # How does TCP/IP work?


    TCP/IP is constructed of four layers:


    +   - The Application layer

    - The Transport layer

    - The Internet layer

    - The Network Access layer


    These layers are logical rather than physical. All network transactions move throughout
    these layers as they travel through the hardware (cables, LAN cards, and computers).


    Here are some specifics about each layer:


    +   - The Application layer handles everything that is not TCP/IP.

    - The Transport layer handles data routing and delivery, including session initiation,
    error control, and sequence checking.

    - The Internet layer is responsible for data addressing, transmission, and packet
    fragmentation and reassembly (IP protocol).

    - The Network Access layer is responsible for transmitting data across the network,
    including determining how to access the physical medium.


    # TCP/IP protocols


    I''ve briefly described how TCP/IP is logically layered, but there''s still more
    to discuss. Let''s look at the numerous protocols that make up TCP/IP:


    +   - **TCP (Transmission Control Protocol):** This is a connection-based service,
    which means that sending and receiving are dedicated.

    - **UDP (User Datagram Protocol):** This is a connectionless service, which means
    that you send data with an address but you don''t know whether your mail arrives.


    Then there are the routing protocols:


    +   - **IP (Internet Protocol):** This protocol handles the actual transmission
    of data.

    - **ICMP (Internet Control Message Protocol):** This protocol handles messages
    for IP.

    - **RIP (Routing Information Protocol):** This protocol determines the best routing
    method for delivering a message.

    - **OSPF (Open Shortest Path First):** This is another method for delivering messages.


    These are the network address protocols:


    +   - **ARP (Address Resolution Protocol):** This protocol determines the unique
    numeric addresses of machines on the network.

    - **DNS (Domain Name Service):** This protocol determines numeric addresses from
    machine names.

    - **RARP (Reverse Address Resolution Protocol):** This protocol determines the
    addresses of machines on the network but in a reverse order from ARP.


    These are the user-based services:


    +   - **BootP (Boot Protocol):** This protocol boots a network by reading information
    from a server.'
  merge: -1
  pgno: 132
- img_proc: false
  md: '+   - **FTP (File Transfer Protocol):** This protocol allows the transfer of
    files across a network. FTP is not secure because it sends and receives unencrypted,
    plain-text passwords.

    - **Telnet:** This protocol allows users to remotely log in to another machine.
    Like FTP, it is not secure.


    Finally, there are the gateway-based services:


    +   - **EGP (Exterior Gateway Protocol):** This protocol governs the transfer
    of routing information for external networks.

    - **GGP (Gateway-to-Gateway Protocol):** This protocol handles the routing of
    information between gateways.

    - **IGP (Interior Gateway Protocol):** This protocol handles the routing of information
    for internal networks.


    # ## What is the inet daemon?


    When Linux starts up network services, the *inet* superserver activates Internet
    tools and services that make life a whole lot easier for you. The *inet* superserver
    is actually a daemon that activates other daemons via the *`/etc/inetd.conf`*
    file. This file is shown in **Listing A**.


    > > **NOTE**

    > The inetd system is no longer used in the Red Hat 7.0 release. The latest versions
    of many other Linux distributions, however, still use this system.


    A bit of explanation about how this file is put together is in order: *<proto>*
    refers to transport protocol; *<args>* is the command line you give the service
    upon startup; *<flags>* refer to dgrams only.


    You should use a *wait* flag if the service is single-threaded; this means that
    the service will read all the dgrams that come at a specified time and then wait
    for more. If none arrive, the service will time out. Examples are *talk* and *comsat*.
    You should use a *nowait* flag for services that read dgrams continuously.


    The *inetd* superserver is a script. When you boot your computer, it calls this
    script. The script from the Red Hat 6.1 distribution is shown in **Listing B**.


    If networking is possible, then *inetd* goes to the *start* option and executes
    *`/usr/sbin/inetd`* using *`/etc/ined.conf`*.


    # ## What are the most common services?


    The *`/etc/services`* file lists all the Internet and networking services available
    to Linux. A partial listing of this file is shown in **Listing C**.


    These are the services available to Linux. The first column represents the service.
    The second column represents *<port>/<protocol>*; *<protocol>* is either *tcp*
    or *udp*. The third column represents alternative service names. The ports listed
    are the common ones.


    # ## Configuring the kernel and hardware


    Now I''ll show you how to configure the Linux kernel for networking. I''m basing
    the kernel


    # **Listing A:** *A snippet of the /etc/inetd.conf file*


    ```

    # Modified for RHS Linux by Marc Ewing <marc@redhat.com>

    #

    # <service_name> <sock_type> <proto> <flags> <user> <server_path> <args>

    #

    # Echo, discard, daytime, and chargen are used primarily for testing.

    #

    # To reread this file after changes, just do a ''killall -HUP inetd''

    <snip>

    # These are standard services.

    #

    ftp     stream   tcp   nowait   root   /usr/sbin/tcpd   in.ftpd -l -a

    telnet  stream   tcp   nowait   root   /usr/sbin/tcpd   in.telnetd

    ftp     stream   tcp   nowait   root   /usr/sbin/tcpd   in.ftpd -l -a

    telnet  stream   tcp   nowait   root   /usr/sbin/tcpd   in.telnetd

    ```'
