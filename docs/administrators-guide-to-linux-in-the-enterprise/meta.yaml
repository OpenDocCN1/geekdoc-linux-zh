    network. So what happens if you have a system in the 192.168.10.0 network you
    want to be able to talk to systems in the 10.0.0.0 network?


    This creates the final entry shown by *netstat* and tells Linux to route all packets
    not destined for the 192.168.10.0 network or the loopback network to the defined
    gateway, in this case 192.168.10.1.


    In the same way, you can delete networks using the *del* command with *route*
    like this:


    On each system in the 192.168.10.0 network, you will have to configure your routing
    table a little differently. Here, you would traditionally use:


    ```

    route del -net 192.168.10.0

    ```


    ```

    route add -net 192.168.10.0 netmask 255.255.255.0 dev eth0

    route add default gw 192.168.10.1

    ```


    This will delete the routing table entry for the 192.168.10.0 network.


    This configures the network and the default gateway. However, in this case, 192.168.10.1
    knows nothing about the 10.0.0.0 network, so your packets would get lost because
    192.168.10.1 has no idea where to send the packets and will attempt to send them
    through


    # Multinetwork routing


    So what happens if you have a more complicated network? Let''s assume for a moment
    that you have two LANs, the first with the 10.0.0.0 network and a second with
    the 192.168.10.0 network.'
