  md: 'think it''s fair to say that even for a Linux expert, it takes much more time
    to configure Linux on the front end than it does to configure similar server functionality
    on Windows NT/2000. Again, this effort is often rewarded by a stable and reliable
    Linux server that does not need as much babysitting as many Windows NT/2000 servers
    require.


    What does this mean? If you are going to deploy Linux, you must have some well-trained
    Linux experts around. So you''ll need to train your current staff or find some
    Linux consultants to assist in the process. Either way, you''re going to be looking
    at incurring considerable expenses to deploy Linux.


    Support is another area where Linux costs can exceed the costs of Windows NT/2000.
    Linux/UNIX administration is more complex and therefore more expensive. It also
    takes longer to train your staff on Linux, which increases the cost even further.
    Finding Linux consultants and good Linux support can also be a major challenge.


    In addition to being more complex and challenging to configure, Linux can be more
    difficult to troubleshoot when things do go wrong. This makes it even more essential
    to have well-trained Linux professionals available whenever you are deploying
    Linux for a mission-critical function in your organization. Unfortunately, finding
    good training programs, first-class Linux support, and competent Linux consultants
    can all be challenging at this point. These things need to be nailed down before
    any Linux deployments move forward.


    Back to the plus side, remote administration of servers is much easier and more
    efficient on Linux than on Windows NT/2000 because all administration tasks can
    be accomplished from the command line. Thus, a remote technician can dial in to
    the server on a phone line or make a secure shell (encrypted Telnet) connection
    over the Internet and set up, modify, or troubleshoot the server.


    # Not on the desktop


    I have to address one final topic. Many members, frustrated by Microsoft''s antipiracy
    techniques, have vowed to switch their desktop machines to Linux if Microsoft
    continues its plans for restriction licensing on Windows and Office XP. While
    I fully identify with their frustration, I think that nine out of 10 of the people
    who make this claim must have never used Linux on the desktop. If they had, they
    would know that Linux still does not offer a common, viable desktop solution.


    While Linux servers are rock-solid stable, the Linux desktop is notoriously buggy
    and unstable. Key Linux desktop applications such as StarOffice, WordPerfect,
    and Netscape Navigator are prone to frequent crashes. Some Linux distributions
    and versions have no trouble with these applications, while others deliver pitiful
    performance or can''t even get them to run at all. Many of those who attempt to
    use these applications will long for the stability and performance of Microsoft
    Office and Internet Explorer. I believe that this is mostly due to a lack of standards
    between different Linux distributions and desktop environments. Unfortunately,
    the Linux desktop is inconsistent across the different platforms, versions, and
    GUIs. Thus, it simply isn''t ready for prime time yet.


    # The final word


    When it comes to Linux, I am a realist and not the kind of convert or zealot that
    characterized the early Linux user base. I am the kind of IT professional that
    Linux needs to win over in order to build a lasting niche in this industry. In
    this article, I''ve tried to take a sober look at Linux''s advantages and disadvantages
    to help administrators see through the hype and make sound business decisions
    when considering a Linux deployment. 🏴'
