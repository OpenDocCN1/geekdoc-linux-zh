  md: 'This line tells Qmail to accept any messages that are addressed to *anyone@otherdomain.com*.
    Now, you need to tell Qmail to forward these messages to another host machine
    for processing. If the file doesn''t exist already, you''ll need to create a new
    file called */var/qmail/control/smtproutes*. Then, add the following line to this
    file:


    ```

    otherdomain.com:anotherhost.com

    ```


    This line tells Qmail to forward all e-mail messages addressed to *anyone@otherdomain.com*
    to the *anotherhost.com* host. If the host has a static IP address instead of
    a domain name, you could use this line (where *1.2.3.4* is the IP address of the
    host computer to which Qmail will forward e-mail):


    ```

    otherdomain.com:1.2.3.4

    ```


    Of course, *1.2.3.4* might have the SMTP server listening on port 1025 instead
    of on the standard SMTP port 25 in an attempt to discourage people from connecting
    to the SMTP server too easily. If so, Qmail needs to forward e-mail both to a
    remote host and to an alternate SMTP port. Thus, you should use something like
    the following line:


    ```

    otherdomain.com:1.2.3.4:1025

    ```


    You can use the same method on a local machine or within a local network. For
    example, if you run two SMTP servers on the same computer, you can forward e-mail
    for a subdomain to a secondary SMTP server. If you need to forward e-mail for
    the *sub.myhost.com* subdomain to another SMTP server that''s on the same computer
    but that listens to port 1025, you must place the following line in */var/qmail/control/smtproutes*:


    ```

    sub.myhost.com:sub.myhost.com:1025

    ```


    Since *sub.myhost.com* points to the same IP address that *myhost.com* does, all
    mail for *anyone@sub.myhost.com* will be forwarded to the secondary SMTP server
    that''s listening to port 1025. (Remember, this server is on the same computer
    that houses Qmail, which listens to the standard SMTP port 25.) Of course, you
    also need to add *sub.myhost.com* to your */var/qmail/control/rcpthosts* file.
    It will tell Qmail to accept e-mail that''s addressed to this domain name.


    # Users and alias users


    Qmail uses a different method of handling users and aliases than do other SMTP
    servers, such as *sendmail*. In *sendmail*, all system aliases are defined in
    the */etc/aliases* file. In Qmail, these aliases are defined in "dot-qmail" files,
    which are found in the */var/qmail/alias* directory for system-wide aliases or
    in the user''s home directory for user-specific aliases.


    You may need to set up e-mail forwarding on your system. For example, suppose
    that you''ve defined the address *webmaster@mydomain.com* as an e-mail address
    where people contact you via your Web site. Instead of creating a Webmaster username
    on your server and connecting via POP3 to retrieve your e-mail, you can tell Qmail
    to forward all mail for that user to your primary e-mail address, such as *myemail@mydomain.com*.


    It makes sense to perform e-mail forwarding. If you already have an existing account
    on the system, why log in twice to retrieve mail for both accounts? Or if you
    log in remotely with POP3 to retrieve mail, why connect to the same server twice
    for two accounts? It''s redundant. Qmail allows you to keep things simple; you
    can log into your *myemail* account and retrieve e-mail for both *myemail* and
    *Webmaster*. Of course, you''ll need to create a new dot-qmail file. Since it''s
    a system alias, you must create the file in the */var/qmail/alias* directory,
    like so:


    ```

    cd /var/qmail/alias

    joe .qmail-webmaster

    ```


    Use your favorite text editor to create a new file: *.qmail-webmaster*. (I used
    the *joe* editor.) The format for these dot-qmail files is *.qmail-[alias-name]*.
    Since you want to create an alias for *webmaster@mydomain.com*, you''ll need to
    create *.qmail-webmaster*. Here''s the only thing you need to place in the file:


    ```

    &myemail

    ```


    This line tells Qmail to forward all of Webmaster''s e-mail to the *myemail* account.
    The ampersand (&) indicates that this is a forwarding operation. If you want to
    forward the e-mail for *webmaster@mydomain.com* to an e-mail account on a different
    system, however, you would use the same syntax, but you would'
