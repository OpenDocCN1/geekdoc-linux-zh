  md: 'With the 2.2 kernel, Linux''s most acute enterprise problems were in the area
    of SMP. Although Linux 2.2 technically supported SMP up to four processors, the
    additional processors did not help Linux get things done any faster, and the OS''s
    internal dealings with multiple processors were clunky at best. In other words,
    Linux 2.2 was not optimized for SMP, a necessity for enterprise environments.

    The 2.4 kernel has effectively removed this obstacle. Linux 2.4 is well optimized
    and tested on SMP machines with up to eight processors. There have even been reports
    of development and deployment teams using the kernel on SMP machines with anywhere
    from 32 to 64 processors. Officially, the number of processors supported by Linux
    2.4 is eight, but look for this number to expand with further testing.

    Another SMP-related Linux 2.4 improvement is support for multiple Advanced Programming
    Interrupt Controllers (APICs). These I/O controllers are used in SMP to spread
    the load for processing interrupt requests among the various CPUs, thus allowing
    for faster and better use of multiprocessor. Memory support had been another Linux
    drawback. Enterprise servers, especially database servers, require very large
    amounts of RAM, and Linux 2.2 was limited to 2 gigabytes. With the 2.4 kernel,
    Linux now supports up to 64 gigabytes.

    Benchmarks such as the one done by Mindcraft a couple years ago showed that the
    Linux 2.2 kernel also had some networking limitations. As a result, Linux developers
    completely rewrote the networking layer for the 2.4 kernel to better handle multithreading
    and thus improve the networking speed and efficiency of the kernel.

    The expanded hardware support of the Linux 2.4 kernel will also have implications
    for the enterprise. Linux 2.4 can support up to 10 IDE controllers, up to 20 hard
    disks, and up to 16 network cards. (Linux 2.2 did not handle multiple network
    cards very well.) Linux 2.4 also improves RAID support and performance, another
    key for enterprise SMP servers. Additionally, the kernel has been expanded to
    support the Intel 64-bit Itanium processor and the IBM S/390 mainframe.


    In terms of storage, the 2.4 kernel contains support for Logical Volume Management
    (LVM), which enables administrators to manage and make changes to storage systems
    while they are live. Obviously, this is very important in a 24/7 enterprise environment,
    and this feature has been a mainstay of other UNIX-based enterprise operating
    systems.

    Another key in making Linux ready for the enterprise was addressing limitations
    in file size and volume of users and groups. In Linux 2.2, file size was limited
    to 2 gigabytes, and the number of user and group objects was limited to 65,563.
    Linux 2.4 allows up to 1-terabyte files and up to 4.2 billion user and group objects.

    Additional 2.4 kernel enhancements include faster I/O between the kernel and peripherals,
    support for NFS version 3 (which boasts increased performance and stability),
    support for ISA Plug and Play cards, built-in kernel Web daemon (kHTTP), which
    will increase performance in serving static Web pages and will integrate with
    Apache, and PPP support for DSL and ATM.


    # Measuring up


    So how does Linux now measure up against its enterprise competitors, such as Novell,
    Microsoft, and Sun? Well, the big boys definitely have reason for concern. Linux
    2.4 matches, and in some areas exceeds, the enterprise capabilities of its competitors.
    Let''s compare Linux with some of the other enterprise products.

    Despite its steep decline in recent years, Novell NetWare still makes its home
    on a lot of enterprise servers. Windows NT stole nearly all of the small and midsize
    business accounts from Novell, but NT''s scalability problems kept it out of most
    enterprise shops, at least as the network backbone. However, NetWare is still
    a very expensive product. And with Novell''s PR problems and Linux matching it
    feature for feature for a lot less money, NetWare could be in trouble.

    Linux even beats NetWare in some categories. NetWare 5.1 supports up to 32 processors
    and 4 gigabytes of RAM. Linux 2.4 would clearly have much more strength running
    an enterprise database server because of its'
