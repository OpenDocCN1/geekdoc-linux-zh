    ```\n\n```\n# AddType allows you to tweak\n# mime.types without actually editing\n\
    # it, or to make certain files to be\n# certain types.\n\nAddType application/x-httpd-php\
    \ .php\n  .php3 .php4\n```\n\nNotice that these directives have comments located\
    \ before them that help to explain the syntax and functionality. Almost every\
    \ configuration option is explained to some degree in the files themselves—a nice\
    \ feature if you're like me and tend to read the documentation only when you can't\
    \ figure something out otherwise. An important one to notice is the *LoadModule*\
    \ command. Upon installing programs related to Apache, you may need to edit the\
    \ configuration file(s) to load the modules at start-up. If you installed PHP\
    \ after Apache, you will need the above command in combination with an *AddType*\
    \ directive to make sure Apache will process PHP files.\n\nThe above examples\
    \ are fairly standard and may not need editing. Some directives, however, will\
    \ change from server to server. Some examples of these are:\n\n+   - *ServerName*\n\
    - *ServerAdmin*\n- *BindAddress*\n\nThe *ServerName* directive sets the host name\
    \ of the server and is usually a fully qualified domain name. This saves the server\
    \ from trying to do a lookup of the host name by IP address, which may not return\
    \ the result you want. An example of how to use this would be:\n\n```\nServerName\
    \ www.techrepublic.com\n```\n\nThe *ServerAdmin* option is also straightforward.\
    \ It is merely the e-mail address of the person to whom administrative and error\
    \ e-mails are sent. If multiple Web servers are being run, a centralized address\
    \ used here can be helpful.\n\n*BindAddress* tells Apache to listen to either\
    \ all IP addresses on the machine or just one. This can be important if you are\
    \ multihoming and don't want certain IP addresses to respond to HTTP requests.\
    \ The default for this command is *BindAddress \\**, which tells the server to\
    \ listen for connections on every IP address.\n\n# ## Starting Apache\n\nApache\
    \ can either be started manually or automatically at boot time. For manual operation,\
    \ you use the command *apachectl*. As mentioned previously, multiple arguments\
    \ can be passed to this command. To start Apache, you execute *apachectl start*.\
    \ To restart the server after making changes to the configuration, you use *apachectl\
    \ restart* or *apachectl graceful*. The *graceful* switch sends a SIGUSR1, as\
    \ opposed to the SIGHUP used with *restart*.\n\nTo load the server during boot\
    \ time, you can either place a script in *init.d* or *rc.N* or place a call to\
    \ *apachectl* from *rc.local* or *rc.boot*. (These files and locations will vary\
    \ depending on your distribution.) For example, **Listing A** shows my script\
    \ in */etc/init.d/* on a Debian/GNU system.\n\nThere will be as many ways to load\
    \ Apache at boot time as there are versions of Linux. You may need to consult\
    \ your specific"
