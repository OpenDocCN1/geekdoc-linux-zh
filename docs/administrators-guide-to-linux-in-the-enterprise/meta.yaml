    will soon be history.


    Once the partition table is correctly written, the ext2 partitions must be formatted
    using mke2fs. Once they are formatted, they can then be "mounted," or incorporated
    into the filesystem. Next, files can be copied from a distribution media into
    the new filesystems. Normally, these distributions are supplied on CD-ROM or they
    will have been previously copied into an existing DOS filesystem. People with
    fast Internet connections could actually copy the distribution files over the
    Internet, but I highly recommend installing from CD-ROM or from files that have
    already been downloaded. You don''t want to get halfway through the install and
    then crash because your ISP went down!


    The Linux distribution files for Slackware are stored in a compressed archive
    format, which can be uncompressed and retrieved using the tar command. The Red
    Hat distribution uses the Red Hat Package Manager (RPM) format, which requires
    a different application for unpacking the distribution. Either way, the distribution
    files contain all the executable files, library files, configuration files, etc.
    Everything you need to operate your system exists in these distributions.


    Once the distributions are unpacked into your new Linux hard disk filesystems,
    you technically have a working Linux system! At this point, however, you have
    no method to gain access to your new Linux system. To complete your system, you
    must install the boot loader.'
