    *By Vincent Danen*


    T


    here are a number of mail transfer agents (MTAs) that are designed for Linux,
    but most distributions install *sendmail* by default because it''s one of the
    oldest and most mature mail systems available. There are other SMTP servers, however,
    including *postfix* and *Exim*, which are gaining in popularity. There''s another
