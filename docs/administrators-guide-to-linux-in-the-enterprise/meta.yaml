  md: '# Is Linux a cost-effective enterprise solution?


    By V. Edward Gold


    Linux is rapidly growing in popularity, but is it ready to handle the demands
    of a business enterprise system? Such a system must support e-mail transport and
    delivery, file sharing, printer/device sharing, firewall and gateway functions,
    and remote access capabilities. If a business were to migrate to Linux, would
    users still be able to perform basic word processing tasks, use spreadsheets,
    access databases, manage contact information, and create fancy presentations?
    In this article, I will present my argument for why Linux can be trusted to host
    your enterprise system.


    I will illustrate how Linux frees the business user from dependency upon any software
    vendor and also how Linux meets all the business user''s needs. In addition, I
    will show how Linux offers capabilities well beyond those that the typical business
    user has come to expect from his or her existing system.


    Not only do I believe that Linux is more than capable of offering all these benefits,
    I also believe it will soon become one of the most cost-effective approaches.
    Microsoft has announced its intention to change its current ownership paradigm
    so that users will have to lease software rather than own it. In the very near
    future, Microsoft plans to sell customers a software license that will work for
    a fixed time period, after which the customer will have to pay again. (Of course,
    if you take into consideration how often most enterprises upgrade their operating
    systems, you might see that having to renew a regular license is virtually already
    in effect.)


    # Linux: A "free" choice


    Linux possesses a number of features that make it a very desirable OS choice.
    First, it''s freely available, complete with source code. This ensures that if
    it doesn''t perfectly meet your requirements, you can find someone who will be
    able to modify the code to meet your needs! That''s a huge bonus that is just
    not available in a proprietary operating system. Second, once you own Linux, it''s
    yours forever. As other users discover improvements, they will make those improvements
    available freely, so there is no recurring cost.


    # Feature-by-feature comparison


    Let''s examine each feature that an enterprise system must possess.


    # File sharing


    Perhaps the most important feature of a networked system is its ability to share
    resources. A typical enterprise system must be able to share files and printers.
    Linux and UNIX, in general, will give you much more in the way of resource sharing.
    Linux offers Network File System (NFS) to share files between computers. Using
    this facility, any directory on a host computer can be exported to any other computer
    within the enterprise system. Any authorized client can then import the shared
    directory and map it to any location within the directory structure of the client
    computer.


    # NFS


    NFS under Linux is somewhat more flexible than file sharing in Windows. NFS allows
    the user to optimize performance for the user''s specific use. In general, UNIX/Linux
    allows the user to format disks optimally for a specific use. The user can specify
    the block size and other drive parameters to tweak performance. You might prefer
    a larger block size if you were going to be manipulating large data files. This
    would allow you to read larger chunks of data in one transfer.


    The same parameters can be adjusted for NFS transfers. Block sizes, priorities,
    and the number of processes dedicated to performing NFS data transfers can all
    be adjusted in Linux.


    # Other forms of file sharing


    Of course, Linux offers a number of other ways to share files as well. The old
    reliable FTP can always be used to share files, though this is fairly cumbersome.
    Linux also supports a remote copy or *rcp*, which allows you to copy files from
    one machine to another. This command has the following syntax:'
  merge: -1
  pgno: 15
- img_proc: false
  md: '```

    rcp dest_host:path/filename

    src_host:path/filename

    ```


    # Printer sharing


    Linux also supports printer sharing. A printer attached to any Linux host can
    be accessed by any other host. The printer is normally managed by a daemon (called
    *lpd*), which implements a printer queue. The queue contains all the print jobs
    that are waiting to be printed. Remote hosts submit print jobs to the queue via
    TCP/IP over the network.


    If you can afford a printer that understands Adobe PostScript (typically labeled
    PS, PS2, PS3, or EPS), then your Linux system is fully capable of printing documents
    full of graphics, text, etc. Fortunately for those people who don''t want to spend
    a fortune on a printer, the GNU'' foundation has an exceptionally good alternate
    solution. It has developed a free software application called *Ghostscript*, which
    translates PostScript language into the special graphics language for almost every
    known printer. You can easily construct a script that determines whether a printer
    job should be preprocessed with *Ghostscript* before being sent to the printer.
    You could either call this script when submitting jobs to the printer daemon or
    you could call the script directly from the printer daemon. Either way, *Ghostscript*
    makes up for the fact that most printer manufacturers didn''t design their products
    with Linux in mind.


    # CPU sharing


    Linux offers additional resource sharing capabilities that go way beyond those
    of Windows. Linux allows any authorized host to submit a remote procedure call
    (RPC), which will cause the Linux host to execute the remotely initiated command.
    Of course, the Linux host can also support remote login, which would allow a user
    to connect to a different Linux host and then execute a process on that remote
    host. So with these capabilities, we can see that Linux facilitates processor
    sharing, which is an extremely powerful feature, indeed. Below are some examples
    of how to implement RPC requests to other machines:


    ```

    rlogin host -l user

    rcp -? Host -l user task

    ```


    How would someone take advantage of processor sharing? Let''s imagine that you
    needed to read one data record from a very large file, perform some calculations
    on the data, and then write results for that record into an output file. If we
    assume that each record is processed independently from all others, then we can
    separate the file into smaller files and copy each one to a different machine.
    We would then remotely log in to each machine and run our processing job on each
    of the smaller files so that each machine would process one smaller file. Ideally,
    if we broke a large file into four smaller files and ran our processing task on
    four machines, we should finish the task in one-fourth the time that would otherwise
    be required for a single machine. So we can see that Linux can implement distributed
    computing!


    # Video, mouse, and keyboard sharing


    XWindows, which is freely available with Linux, enables the user to redirect input
    and output from any host to any other host. So, using XWindows along with remote
    procedure execution, a user could run a process on a remote machine and still
    monitor that process from the machine that''s directly in front of him or her.
    XWindows also allows the user to put pictures up on a remote display or grab video
    directly off a remote display and bring it to the local machine!


    # Networking functions


    Linux provides far more capability than Windows in networking functions. Any Linux
    host may become a gateway, router, firewall, switch, etc. In addition, it may
    do any number of these functions while still serving as a workstation, file server,
    print server, etc. In summary, a Linux host can do any of these functions, in
    any combination.


    For a Linux host to become a gateway, basically all you need is a number of network
    connections and the right kernel options. A gateway merely routes packets to the
    appropriate host whenever it receives something not intended for it. A host that
    is not intended to be a gateway will just ignore packets when it notices that
    they have any other delivery'
  merge: -1
  pgno: 16
- img_proc: false
  md: 'address. In order to make Linux perform gateway functions, you first have to
    notify the kernel that it should not ignore packets not addressed to it. You do
    this by typing the following as a privileged user:


    ```

    echo "1" > /proc/sys/net/ipv4/ip_forward

    ```


    Once you have done this, the kernel will occupy itself with every single packet
    that arrives at any of its network interfaces. Of course, this alone will not
    get packets to go where they need to go, but at least the kernel won''t ignore
    them! Next, you have to declare where you want packets to go if you get them.
    This means that you must properly configure all your network interfaces, using
    the *ifconfig* command, and then use the *route* command to declare the various
    routes that packets should take. Of course you don''t even have to use the command
    line! Instead, you can visit one of the many GUI configuration tools (such as
    Red Hat Linux''s *netconf* tool).


    If you want to turn a Linux machine into a router, just design yourself a Linux
    gateway, and then don''t use the machine for anything but routing packets! The
    Linux Router Project is dedicated to doing exactly that. Its goal is to create
    a minimal Linux system that can be used in place of a router. This would allow
    users to have complete control of the routing algorithms, and it might just give
    purpose to a great number of otherwise useless 486 machines.


    Linux has a multitude of firewall options available. Any Linux host may be configured
    to run either a packet level firewall such as *iptables* or *ipchains*, or a more
    intelligent proxy firewall like Squid. A packet level firewall will allow the
    Linux host to selectively allow or deny packets to enter the system based on a
    set of rules. The rules are fairly primitive, since they are based on lower-level
    information, such as the source address, protocol, and port. You can establish
    rules that only allow certain hosts to send specific types of packets using this
    strategy. I found some great information on *ipchains* at Trod and micronet. I
    found some good information on *iptables* on the dyndns.org site at <http://t245.dyndns.org/~monmotha/firewall/index.php>.


    Using a proxy-based firewall, you can control which users are allowed to access
    specific services on your host. The proxy firewall can produce high-level log
    files that can identify exactly what each user accessed, which can be valuable
    information to many system administrators.


    Linux can implement a number of different mechanisms to facilitate remote access.
    I already discussed how Linux enables remote hosts to run processes and remotely
    log in to a host. Linux also supports the usual telnet and FTP servers. The telnet
    daemon enables Linux to allow remote users to connect to a specified shell and
    perform tasks as if they were sitting right at the console. The FTP server allows
    the remote user to send and receive files.


    Additionally, Linux can be used as a PPP server if the appropriate external hardware
    is connected. A small business might be interested in doing this to allow employees
    to access their work from home. Assuming you have a modem connected to a serial
    port, you can get the Linux *getty* or *mgetty* process to watch the serial port
    for activity. If you have ever connected to a dial-up ISP, *getty* generates the
    initial "login:" and "password:" greeting that you see. Once a user authenticates
    past *getty*, Linux goes to the password file and retrieves the shell command,
    as it would for any other login process. However, in the case of a PPP dial-up
    user, instead of running the shell, you would instead want to run the PPP daemon
    *pppd*.


    # Available applications


    Microsoft Office is no doubt the world''s favorite and most widely used desktop
