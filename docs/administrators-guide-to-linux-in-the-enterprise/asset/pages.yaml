  md: '* X-Loop: jwallen@techreportpublic.com —Avoid mail loops (if an e-mail comes
    from your account and is auto-reposted from your account back to your account,
    which could cause a possibly infinite loop).


    * |format| 8192 vacation.cache —The header has been piped to this line, which
    uses format to create a cache of e-mail addresses to compare.


    * 0—If the immediate recipe fails, it will execute this script, feeding the header
    to the next pipe and making a carbon copy of the mail. No lockfile is used.


    * |format| ''Precedence'', ''junk'' —Append a custom header field (Precedence),
    set it to junk, strip away all others.


    * A-X-Loop: jwallen@techreportpublic.com —Append the X-Loop to our newly generated
    e-mail so that we can guarantee avoidance of e-mail loops.


    * echo—The next four lines (all beginning with echo) are the lines of text you
    wish to include in your auto-responder.


    ) |$SENDMAIL=-t —Pipe the new created message created with


    the conditions and within ()—to sendmail for delivery to recipients.


    Why is this considered a nondelivering recipe when it obviously delivers to an
    outside e-mail address? The main reason is because it is using an external program
    (format) to generate a response, leaving procmail''s sole purpose to write to
    a file (vacation.cache). Even though the ultimate action is that an auto-generated
    e-mail is mailed many times no e-mail will be generated (for instance, when someone''s
    e-mail address is already in the vacation.cache file). Now is it why this is considered
    a nondelivering recipe?


    # Conclusion


