  md: '# # Installing Apache and PHP


    **By Vincent Danen**


    In this article, we are going to take a look at installing one of the most popular
    server packages for Linux: the Apache Server. Apache is an open source Web server
    that is found with almost every Linux distribution, and it is perhaps one of the
    most popular Web servers on the Internet today. It has excellent portability as
    it can run on Linux, BSD, *IX, Windows, OS/2, and even BeOS.


    Because most Linux distributions come with Apache, you will only need to build
    from scratch very quickly. More than not, you will use RPM or DEB packages to
    upgrade your system, but the occasion may warrant a system administrator building
    and installing Apache from scratch. This is often the case on older systems with
    dependency issues for newer versions of the server. Installing Apache via RPM
    and DEB packages seems perfectly straightforward, but we recommend taking a look
    at that method of installation, but we will deal directly with the source.


    # ## Building Apache


    Configuring Apache is done via the configure script. This is not the configuration
    you get in your actual configuration files. This is where you configure some of
    the defaults for Apache, such as the location to install files, support for extra
    features and modules, and so forth.


    Let''s assume you already have Apache installed and simply want to get the new
    version of Apache to test run before you move your entire system over to it. This
    is handy to ensure that you have no difficulties with the new Apache before switching,
    and it will minimize downtime you encounter problems.


    To do this, we will install Apache in /usr/local instead of the /usr directory
    tree. This means that the Web server will be installed into /usr/local/apache
    instead of /usr/bin. To do so, we will configure, like:


    ```

    /configure --prefix=/usr/local/apache

    ```


    But since we''re not going to install Apache because it gives us the functionality
    we might need for. Instead, we will run configure Listing A.


    This does a few more things than the previous example, which might be essential
    to your site. Tell the configure that we want the end installation to be in /usr/local/apache,
    and also tell it to enable all modules. By default, Apache enables modules, but
    not all of them, and there are some useful modules, like *mod_rewrite*. The next
    thing we are enabling is Dynamic Shared Object (DSO) support for the maximum number
    of modules, which in our case is all of them. Enabling DSO support is important
    because it allows you to load and unload modules in Apache by simply reconfiguring
    and restarting it, without requiring you to recompile if you wish to remove support
    for a particular module or add support for another one.


    # ## Obtaining Apache source


    The first thing you need is to obtain the source code. You can choose the latest
    version of Apache, or you can choose the most recent development, which is 2.016
    as (beta) of this. Let download the latest version from http://apache.org/dist/file/apache_1.3.20.tar.gz.
    Save this file to /usr/local src directory.


    The next step is to unpack the archive. This is accomplished by using, as root:

    cd /usr/local/src


    ```

    tar xzvf apache_1.3.20.tar.gz

    ```


    You will now have an apache_1.3.20/subdirectory located beneath your /usr/local/src
    tree. Now change to directory. It''s time to run the configure script, which will
    set up our Apache options.


