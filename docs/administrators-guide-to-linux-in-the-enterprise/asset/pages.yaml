  md: '# Save big by replacing NT servers with Linux Samba


    By Jason Hines, MCSE.


    The word is out. Using Samba to set up a Linux server in a Windows domain offers
    network administrators some great options. Samba brings excel lent stability,
    performance, integration, and significant cost savings over a Windows server doing
    the same tasks. However, a successful Samba implementation into an NT domain depends
    upon using the best Samba settings for NT integration and avoiding common configuration
    errors.


    In this article, I will go step-by-step through the process of setting up a Samba
    server on Linux and optimizing it for security and performance in a Windows domain.
    I will also explain how to avoid common configuration errors and how to set up
    archives. Samba can be used as an excellent server, but this article will focus
    on configuring it properly. Once you set up your Samba configuration, you can
    easily add printing services by learning the Linux method of setting up network
    printers.


    This article assumes that you have a solid understanding of Windows domains but
    are beginning to intermediate Linux. The only exceptions from the Linux side are
    that you have a Linux distribution installed on your target machine and that you
    have a basic understanding of the Linux file system and how to use a text editor.


    # Preliminary Linux configuration


    Samba comes preinstalled on many Linux distributions, and it''s available as an
    option on all the major distributions. If you''re running an older distribution,
    I would recommend you go to Samba''s Web site at www.samba.org, download the latest
    version of Samba, and install it on your Linux machine.


    Once you have Samba, log in to your Linux system as the root user. Before you
    begin configuration, you will need to stop the Samba daemons (services) if they
    are currently


    You can issue the following command to display all of the currently running daemons:


    ```

    ps aux | more

    ```


    Look for smbd -D and nmbd -D. (These are the Samba daemons.) Locate the PID numbers
    for these two daemons in the second column from the left. Issue the following
    command (replace 1010 with the smbd PID):


    ```

    kill -9 1010

    ```


    Next, issue this command (replacing 0101 with the nmbd PID number):


    ```

    kill -9 0101

    ```


    Before digging into the Samba configuration, you will need to set up users and
    groups on Linux to correspond to the users and groups in your Windows domain.
    To set up groups in Linux, issue the following command for group:


    ```

    groupaddname

    ```


    Then, set up users by issuing the command for each user:


    ```

    adduser username -g groupname

    ```


    For an enterprise with a large number of users, I would recommend using a product
    such as Microsoft''s NT Services for UNIX or MS Toolkit to set up username/password
    synchronization between Linux and Windows NT. Both work well, but Microsoft''s
    product is more economical, and MS Toolkit is more robust.


    You also need to set up the main directory that you''ll share with the NT network.
    Issue the following commands:


    ```

    cd /

    ```


    ```

    mkdir winshare

    ```


    followed by this command:


    ```

    chmod 777

    ```


    This creates the /winshare read/write/execute ability to anyone who gives permission
    to mount the share.


