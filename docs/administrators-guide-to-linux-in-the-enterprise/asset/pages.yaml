  md: '# PHP


    The latest version of PHP—a popular server-side, HTML-embedded scripting language—can
    be downloaded from www.php.net. Once, you have the option of configuring PHP during
    the installation of Apache or adding it later. Regardless of which route you take,
    you need to configure and install PHP before performing either method.


    +   - configure the PHP with the --auth-path=/to apache module, then make, and
    finally install. It would also be a good idea to include mod_mysql if you want
    to add MySQL database support. During the installation of Apache, you can configure
    the Apache module with the following arguments:


    ```

    /configure --activate-module=src/modules/libphp3.a (for PHP version 3)

    ```


    ```

    /configure --activate-module=src/modules/libphp4.a (for PHP version 4)

    ```


    To install a system with a preconfigured version of Apache, be sure to stop the
    server first with the apache stop command. Next, configure PHP as:


    ```

    /configure --with-apxs --with-mysql

    ```


    The apache allows for the creation and installation of extension modules for the
    Apache HTTP server. This involves building a DSO (Dynamic Shared Object) and having
    it loaded into Apache at runtime. To use this, be sure to build Apache with the
    mod_so module enabled. This should be done by default, you can verify by running
    apache -M, which will print out a list of compiled modules. Now we need to add
    a LoadModule command in httpd.conf and an AddType command in rm.conf.

    LoadModule php4_module /usr/lib/apache/1.3/libphp4.so

    AddType application/x-httpd-php .php3


    # SSL


    Secure Socket Layer (SSL) enables your Web site to send confidential information
    over the wire in an encrypted state. It is now a standard component for nearly
    every Web site. Apache SSL comes in a couple of main.


    You can download Apache-SSL which is the complete web server built with SSL. By
    compiling and installing it in similar ways to the original, you can run an SSL
    compatible server in the same amount of time to install standard Apache. Another
    option is provided by mod_ssl, which provides SSL support in the form of an Apache
    module. You can add this after or before compilation, just like PHP and mod_perl.
    If you already have Apache up running and do not feel like recompiling add SSL
    support, this is the way to go. To accomplish this, simply download the mod_ssl
    module and load it. However, be sure to have OpenSSL installed prior to adding
    to Apache.


    # Conclusion


    When all is said and done, Apache provides an extremely cost-effective and robust
    Web server that has great flexibility since you can add various modules. With
    the addition of compiled- or dynamic module support for such packages as Perl,
    PHP, and SSL, you can build a fast, secure Web site.


