    +   - Class B: Networks ranging from 128.0.0.0 to 191.255.0.0


    +   - Class C: Networks ranging from 192.0.0.0 to 233.255.255


    +   - Classes D, E: Networks ranging from 224.0.0.0 to 254.0.0.0


    For the sake of argument, let''s suppose your company will grow a Class C network.
