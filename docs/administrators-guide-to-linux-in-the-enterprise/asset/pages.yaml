  md: '# Printer sharing


    Linux also supports printer sharing. A printer attached to any Linux host can
    be accessed by any other host. The printer is normally managed by a daemon (called
    pdpd), which implements a printer queue. The queue contains all the print jobs
    that are waiting to be printed. Remote hosts submit jobs to the queue via TCP/IP
    over the network.


    If you can afford a printer that understands Adobe PostScript (typically labeled
    PS2, PS3, or EPS), then your Linux system is fully capable of printing documents
    with full-page graphics, test, etc.. Fortunately for those who don''t want to
    spend a fortune on a printer, the GNU foundation has an excellent free software
    called Ghostscript, which translates PostScript language into graphics language
    for almost every printer. You can easily construct a script that determines whether
    a printer job should be sent to the printer. With Ghostscript you could either
    call this script when submitting jobs to the printer daemon or could call the
    script directly from the printer daemon. Ghostscript makes up for the fact that
    most printer manufacturers didn''t design their products with Linux in mind.


    # CPU sharing


    Linux offers resource sharing capabilities that go beyond those of Windows. Linux
    allows any authorized host to submit a remote procedure call (RPC), which allows
    the Linux host to execute the remotely installed command. Of course, the Linux
    host can also support remote login, which would allow a user to connect to a different
    Linux host and then execute a process on that remote host. With these capabilities,
    we can see that Linux facilitates processor sharing, which is an extremely powerful
    feature, indeed. Below are some examples of how to implement RPC


    ```

    login host -1 user

    cp ? -1 user task

    ```


    How would someone take advantage of processor sharing? Let''s imagine that you
    need to read data from a large file, perform calculations on the data, and then
    write results for that record into an output file. If we assume that each record
    is processed independently from all others, then we can separate the file into
    smaller files and copy each one to a different machine. We could then remotely
    login to each machine and run our processing on each of the smaller files so that
    each machine would process one smaller file. Ideally, if we broke a large file
    into four smaller files and ran our processing on four machines, we should finish
    the task in one-fourth the time that would otherwise be required for a single
    machine.


    # Video, mouse, and keyboard sharing


    Windows, is freely available with Linux, allows us to redirect input and output
    from any other host. Using Windows with remote execution, a user could run a process
    on a remote machine and monitor it from the machine that''s directly in front
    of him or her. Windows allows the user to put up pictures on a remote display
    or grab video directly off a remote display and bring it to the local machine!


    # Networking functions


    Linux provides far more capability than Windows functions. Any Linux host may
    be a gateway, router, firewall, etc. In addition, it may do any number of the
    functions while still serving as a workstation, file server, etc. In summary,
    Linux can do any of these functions, in combination.


    For a Linux host to become a gateway, basically you need is a number of network
    connections and the right kernel options. A gateway merely routes packets to the
    appropriate host when it receives something unintended for it. A host that is
    not intended to be a gateway will just ignore packets when it notices that they
    have any other delivery'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'address. In order to make Linux perform gateways, you first have to notify
    the kernel that it should not ignore packets addressed to it. You can do this
    by typing the following as a privileged user:


    ```

    echo "1" > /proc/sys/net/ipv4/ip_forward

    ```


    Once you have done this, the kernel will occupy itself with every single packet
    that arrives at its network interfaces. Of course, this will not get packets to
    where they need to go, but at least the kernel will not ignore them! Next, you
    have to decide where you want packets to go if you get them. This means you must
    properly configure all your network interfaces, using the ifconfig command, and
    then use the route command to declare the various routes that packets should take.
    Of course you don''t even have to use the command line! You can visit one of many
    GUI configuration tools (such as Red Hat''s netconf).


    If you want to turn a Linux machine into a router, design your own Linux Gateway,
    and don''t use the machine for routing packets! The Linux Router Project is dedicated
    to doing exactly that. Its goal is to create a minimal Linux system that can be
    used in place of a router. This would allow you to have complete control of the
    routing algorithms, and give just purpose to a great number of unused 486 machines.


    Linux has a multiple of firewalls available. Any Linux host may be configured
    to run a packet firewall such as iptables or ipchains, or a more intelligent proxy
    firewall like Squid. A packet firewall will allow the Linux host to selectively
    allow or deny packets. The rules are firstly, since they are based on lower-level
    information, such as the source address, protocol, and port. You can establish
    rules that only allow hosts to specific types of packets using this strategy.
    I found some great information on iptables at Trocod, and I found some good information
    on the dyndns.org at http://245.dyndns.org/~monotha/firewall/index.php.


    Using a proxy-based firewall, you can control which users are allowed to access
    specific services on your host. The proxy firewall produce high-level logs that
    can identify exactly what user accessed, which can be valuable information to
    many system administrators.


    Linux can implement a number of mechanisms to facilitate remote access. Also discussed
    how Linux enables hosts to run processes and remotely log in to a host. Linux
    also supports the usnet and FTP servers. The telnet daemon allows users to connect
    to a shell and perform tasks as if they were sitting right at the console. The
