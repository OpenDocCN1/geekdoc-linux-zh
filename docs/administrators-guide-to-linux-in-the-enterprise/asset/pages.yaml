    ```


    The first four lines are simply comment

    lines. You begin your comments with the hash

    (#) sign that bash can recognize the hash.

    The shell will ignore anything that begins with

    hash.


    The backquote () after the command

    whoami is there to demonstrate the use of

    command substitution. The \" is an option

