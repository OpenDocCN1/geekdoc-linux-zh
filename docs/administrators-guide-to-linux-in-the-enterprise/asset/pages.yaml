  md: '# Working with NFS


    By Bryan Pfaffenberger


    Network File System (NFS) is the local area networking protocol not only for Linux,
    but for all UNIX-like operating systems. As you may have discovered, the Linux
    implementations of NFS can be a bear to configure. If NFS has been giving you
    fights, you''ve come to the right place. In this, I will reveal the secrets, and
    magical incantations needed to get NFS working on your system.


    You''ll begin by surveying precisely what you''ll need to install—on the server
    as well as the client—with NFS you''ll learn how to export directories from the
    server so that they are available to other computers on your network. Next, you''ll
    learn how to mount remote directories on the client machines, just as they were
    part of the client''s file system. You''ll also learn how to deal with the error
    messages you''re likely to encounter. By the time you''ve finished reading this
    article, you''ll have mastered the essentials of NFS, and you''ll be on your way
    to taking full advantage of this powerful, transparent technology.


    your network includes Windows 95/98 boxes, you may wish to consider Samba instead.


    In brief, Samba is a cross-platform networking protocol that implements the messaging
    system native to Microsoft Windows. The Linux implementation of this messaging
    technology is very neat—in fact, that a few Linux-only networks are running Samba,
    even though there aren''t any Windows boxes on these networks! Still, Samba isn''t
    tightly integrated with NFS as is. For example, it can configure NFS so that the
    needed software runs automatically at startup and the remote directories are mounted
