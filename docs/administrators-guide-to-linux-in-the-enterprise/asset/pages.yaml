  md: '# Step three: Compile the kernel with sound support


    To enable sound support on a Linux system, two features need to be compiled into
    the kernel:


    +   1. Support for loadable modules


    +   2. Support for sound


    This article won''t cover the steps necessary to compile and install a new Linux
    kernel. It is assumed that you have the experience necessary to compile the kernel
    with the required support.


    # NOTE


    When you compile the kernel, remove any sound card drivers from the kernel prior
    to compiling. ALSA will load the driver required by your sound card later.


    # Step four: Install the ALSA drivers


    Once the kernel is compiled and installed, the next step is to install the ALSA-driver.
    First, unpack and uncompress the alsa-driver package with the command:


    ```

    tar -Ixvf alsa-driver-0.5.18a.bz2

    ```


    The next step is to enter the directory containing the alsa-driver package with
    the command:


    ```

    cd alsa-driver-0.5.18a

    ```


    Prior to running the configure script, make sure of the configuration you require.
    The following options are supported by the alsa-driver package:


    +   --isapp=yes/no: Selects the ALSA isnap tool, or the standard Linux isnap tool.
    If you don''t use an ISA sound card, select no.


    +   --sequencer=yes/no: Select yes for ALSA to emulate the OSS sound system.


    +   --with-cards: Provides a comma-separated list of the card or cards ALSA will
    provide support for. The option "ALL" will provide support for all ALSA-supported
    sound cards. The option "dummy" may be used if


    no sound card is installed but sound support is required.


    > --with-prefix-directory:► ALSA directory package includes C header files to
    build other ALSA utilities. The default location is /usr/include. If another location
    is required, the directory path to that location (e.g., /usr/local/).


    On my system, if you use a Creative-Blaster ens1371 PCI sound card, the driver
    will load the isnap package, and I don''t need use OSS emulation. However, I do
    need MIDI support, and I use the default location for the C header files. To configure
    ALSA with these options, I use the command


    ```

    ./configure --isannap=no

    --sequencer=yes

    --with-oss=no

    --with-cards=ens1371

    ```


    The next step is to build and install the modules with the following commands:


    +   make

    make install


    The ALSA drivers and header files are installed, and script to load and unload
    ALSA when the system is booted and shut down is generated.


    # Step five: Building the ALSA device files


    The next step is to create the ALSA device files. The driver package uses the
    device scripts to create these files. The procedure interfaces to interface with
    sound relies heavily on the /proc filesystem. The device scripts create dynamic
    files in


    ```

    /proc/asound/

    ```


    The sounddevices link /proc/asound/ to /dev/asound and also creates entries in
    /dev/ to provide OSS emulation. To run the sounddevices, run the following command
    from the alsa-driver directory as:


    ```

    ./sounddevices

    ```


