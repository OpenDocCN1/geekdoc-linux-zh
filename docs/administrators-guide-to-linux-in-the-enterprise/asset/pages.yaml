    \ computer, you have only one hostname and one domain name. This domain name will\
    \ become your primary domain because it's the one used across network.\n\n# Final\
    \ tips\n\nNow, I'm going to give you two tips that will save you lot of headaches.\
    \ If this is the first DNS server you've ever set up, you'll pay close attention\
    \ to these tips. First, due to various RFCs that relate to domain names, you must\
    \ keep in mind that NS and MX records can't point to CNAME records. These record\
    \ type must point to an explicitly defined record. If not, named will remind you\
    \ by writing an error to the syslog. Although named will run with NS and MX records\
    \ pointing to CNAMEs, it's not proper, and this method may cause problems. Pointing\
    \ to a name called bunny.xy.com instead of mys.xy.com may not be cosmetic, but\
    \ it is proper. This difference is invisible to everyone except other DNS servers,\
    \ it doesn't really matter. When you define a CNAME to point to bunny.xy.com,\
    \ you'll be worried about cosmetics, but you can tell your users to use mys.xy.com\
    \ as the DNS server for normal hostname resolving.\n\n# Forwarding DNS requests\n\
    \nForwarding DNS requests to another DNS server is a simple way of lessening the\
    \ load on your DNS server. If the local server receives any query that it can't\
    \ resolve from its local cache, it will forward hostname requests to a specific\
    \ list of servers. The method builds a cache on the selected server and keeps\
    \ the load down on secondary servers. If possible, this server should exist on\
    \ your local network. That way, you will prevent your servers from reaching out\
    \ to the Internet to resolve hostname lookups. Only one server on your network\
    \ will look up hostnames on the Internet, which can become very helpful if you're\
    \ paying for Internet usage. Here is an example of named.conf file using the following\
    \ options:\n\nSecond, if you want to set up primary and secondary servers, make\
    \ sure that they exist on separate machines. Remember, named doesn't like it if\
    \ you tell it as both primary and secondary DNS for any given zone or domain.\
    \ It will write to the syslog if it encounters this configuration.\n\n```\noptions\
    \ {\n  directory \"/var/named\";\n  forwarders {\n    192.168.1.1;\n  };\n}\n\
    ```\n\n# Conclusion\n\nThese lines tell the local server to try the forwarders\
    \ before it tries to get an answer from any external server (such as the root\
    \ servers that InterName runs). The forwarders first; option is redundant because\
    \ it tells the local server to try the forwarders before trying anything else,\
    \ which is the default setup. An alternative option is the forwarders only; option,\
    \ which tells the local server to talk to forwarders only. With the forwarders\
    \ only; option, any queries not resolved by the forwarders will remain unresolved\
    \ the\n\n\nAnother excellent source of information on DNS is the DNS Resources\
