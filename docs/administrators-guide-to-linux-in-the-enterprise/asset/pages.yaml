    all of this quickly and efficiently.


    You''ll notice that you''re no longer limited to sizes of 2 GB as with the ext2
    file system. Files and directories can be as large as you want to be. You''ll
    suffer a marginal performance hit with larger directories, but not as much as
    you would using ext2 (if you''re in an ext2 partition!).


    # What is a journaling file system?


    Due to complexity, I''m going to give you a brief overview of a journaling file
    system. Describing the theory and architecture behind a journaling file system
    and ReiserFS itself is beyond the scope of this article.


    To say more simply, a journaling file system uses a database to store information
    about the file system as opposed to the way a traditional file system (like ext2)
    uses a program, like fsck, to check the entire partition. Consequently, with a
    system crash (or an accidental reset), ReiserFS merely needs to consult the transaction
    log to determine or not there are any problems with the system.


    # Compile ReiserFS into your kernel


    ReiserFS is being used on Linux systems as replacement for ext2. While there are
    other journaling file systems in works, ReiserFS is by far the most mature. In
    terms of overall design, however, after all, XFS has been used on IRIX systems
    for years but in Linux usability. ReiserFS can be used by people running Linux
    now, whereas SGI''s XFS and IBM''s JFS have some work ahead to be able to port
    their file systems and associated units to Linux.


    The term "journaling" comes from fact that ReiserFS and any other journaling file
    system-journals (or logs) by writing them to a log buffer, then asynch writing
    to the disk log. After a crash, ReiserFS''s recovery tool, reiserck, reads the
    log. If necessary, transactions are repeated to ensure that the file system remains
    in a consistent state.


