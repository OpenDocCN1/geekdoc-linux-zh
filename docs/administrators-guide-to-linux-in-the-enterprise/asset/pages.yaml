  md: '# The recipes


    Now we get into the heart of the matter—the primary force behind promail. The
    onions and potatoes (sorry, I''m a vegetarian, so no meat here), to speak.


    A promail recipe is just what it sounds like—a recipe that is cooked up that will
    act upon incoming-mail. As I said before, there delivering and nondelivering types
    of recipes, and here I''m going to help you understand delivering recipes (in
    different formats). What we will do is starting together a very simple recipe
    and graduate to more recipes as we


    # Recipes–the basics


    The basic promail recipe looks like this:


    +   - action

    - flags: lockfile_name

    - condition 1

    - condition 2


    Adding in more possibilities gives you


    +   - action


    The first recipe has two lines. The first line, marks the beginning of the recipe
    (all recipes will have this), and the second line, action, is what is to be taken
    on incoming mail. For instance, you can replace action with as simple as


    > > XXX XXX. XXX

    Which will forward all mail to the e-mail address (where xxx@example.com is replaced
    with a legitimate e-mail address).


    The second recipe contains two (or more) lines that are marked condition1 and
    condition2. The second recipe also adds to the first line flags and a user-defined
    lockfile. A lockfile is very important promail, which you should understand before
    using it. (The discussion of lockfiles in promail is extensive and can be found
    within the promail page at a prompt, type promail).


    The conditions of a promail recipe are all user-defined and limited only by your
    imagination. You''ll save the greatest amount of time and energy—as well as patience—with
    this section. You can think of that


    "if the e-mail meets these requirements, then pass along to the following action
    states." Conditions can be stacked to an unlimited depth, which makes them both
    powerful and very confusing


    # Delivering recipes


    The first we are going to look at delivering recipes. Delivering recipes are those
    that cause the header andor body of the mail to be written into a file, absorbed
    by a program, or forwarded to a mail address.


    Before we begin coding our recipe, let''s first write a safety net into $HOME/$promail.
    Inserting the following two recipes cover all other recipes which ensure that
    all arriving mail, the last 32 messages will be preserved. In order for you to
    create a directory backup in your $MAIL_DIR before creating these recipes in promail''s
    rc file. Create this directory with the:


    ```

    mkdir ~~/backup

    ```


    (assuming that ~ is your mail directory), and you are good to go. With the backup
    in place, you can create the first recipe rc file. Open the rc file in your editor
    and enter the two recipes after the header section:


    ```

    : 0 c

    backup

    ```


    ```

    : 0 ic

    | backup |& rm -f dummy ''l -1 msg. | sed -e 1,32d''

    ```


    So you know how the command breaks down. First recipe:


    +   - >0c–Begin the recipe and make a cake copy of all mail.


    +   - >backup–Save all copies to the backup directory.


    Second recipe:


    +   - >0ic–Begin the recipe, ignore any errors on this recipe, and make a copy
    of all mail.


    ```

    | backup |& rm -f dummy ''l -1 msg. | sed -e 1,32d''–Change to the backup directory

    ```'
