    # Customizing the Linux boot and shutdown processes


    By Jim McIntyre


    The ability to manage the Linux boot and shutdown processes is essential for a
    system administrator. The administrator must know which services are running on
    the system, how to add new services, and how to remove services that are not required.
    This article provides Linux administrators with the information necessary to customize
    the files and directories involved in the Linux boot and shutdown processes and
    will explain the tools available to customize these processes.


    After the root filesystem is mounted as read-write, the kernel executes a program
    init. When init has completed its execution, the system is up and running. The
    init process is highly configurable, via the /etc/initab file and directories
    with the init configuration process.


    The syntax used for configuration in the /etc/initab file:

    id:run:process [arguments]


    +   - The first field is a unique label, which identifies the entry in the initab
    file.


    +   - The second field specifies which run-levels this applies to.


    +   - The third field specifies the action to be taken.


    +   - The fourth field identifies the process to be run and any arguments that
    apply to process. Command-line arguments may also be specified in the fourth field.


    # An overview of the boot process


    When a Linux system is booted, the boot loader (LILO) loads the kernel. When called
    by LILO the kernel is uncompressed, the display device is initialized, and the
    kernel starts checking hardware attached to your system. As it finds devices,
    it loads kernel modules to support for these devices. Once hardware support is
    loaded, the kernel mounts the root (/) filesystem as read-only. If no problems
    are detected in /, the root filesystem is mounted as read-write.


    The state of a Linux system is specified by its run-level. There are seven run-levels
    available on a Linux system.'
