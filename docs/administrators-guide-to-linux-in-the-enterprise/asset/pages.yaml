    # The header


    I like to think the first section of the procmail header. This section of the
    file sets up the location of the user''s mailbox and the log file, as well as
    sets for debugging purposes


    This section contains (is not limited to) the following lines:


    +   SHELL=/bin/sh

    MAILDIR=$HOME/mail

    DEFAULT=$MAILDIR/log

    LOGFILE=$MAILDIR/log

    #ABSTRACT=all

    VERBOSE=


    These are the main entries for the header section:


    +   SHELL—Sets your shell (in this case to handle any unnecessary problems.)

    MAILDIR=$HOME/mail—Creates the default directory in which your mail will be stored.
    Typically (but not necessarily), it is in $HOME/USER-MAIL2.

    LOGFILE=$PMDDIR/log—Sets the location of the procmail log. This is typically set
    within the actual procmail directory.


    ##ABSTRACT=all—This is for debugging purposes. Remove the ## when you need more
    information for debugging


    VERBOSE=no—Again, this is for debugging. Set this option to yes when you need
    to debug a recipe


    Other environment variables for the header section:


    +   ORGMAIL=/path/to/system/mailbox—Usually the system mailbox—if some reason,
    the mail cannot be deleted, then mailbox will be the last resort.


    +   LOCKFILE=/path/to/global/logfile—Global semaphore file (The use of a global
    lock is discouraged; whenever possible, use local locks on a per-basis instead.


    +   TIMEOUT=—Number of seconds (x) that must pass before procmail decides that
    child has started. If procmail decides a process has hung, then offending process
    will receive a TERMINATE signal from procmail, and the r file will continue. If
    the number is zero, no timeout will be used, and procmail will wait until the
    child has terminated. The default is 960 seconds.


    +   HOST—Hostname of the machine

    NORRETRY—Number of retries to be made if any process table is full, out of memory,
    or space error should occur. If this is negative, procmail will wait indefinitely;
    if it is not specified, it defaults to four times.


    +   SUSPEND=—Number of seconds (x) that procmail will fail if it has to wait for
    something that is currently unavailable (memory, fork, etc.)—if it is not specified,
    it will fail to 16 seconds.


    +   MATCH—This variable is assigned by procmail whenever it wants to extract text
    from a matching regular expression. It will contain all text matching the regular
    expression \ characters.


    +   INCLUDEER=/path/to/re/file—An r file (relative to the current directory) that
    will be included here if it were part of the current r file


