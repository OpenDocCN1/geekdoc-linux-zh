  md: '# How a Linux solution saved this company $35K


    By Mike Walton


    Linux is often lauded as an economical solution. In fact, we recently heard from
    one administrator who saved his company $35,000 by using a Linux solution. However,
    his Linux strategy did more than just save money on the front end—it helped to
    deliver a better enterprise solution that increased his ability to monitor and
    manage network uptime.


    In this article, we''re going to follow Ed, who was a manager overseeing network
    administration at a communications company when a major reconfiguration crashed
    his laptop. The project required him to divide A LAN into five smaller virtual
    LANs with switches that, at the time he needed them, did not pass DHCP or DNS
    traffic.


    We will see:


    +   - Ed to subdivide his LAN into five VLANs


    +   - The switches wouldn''t work on his LAN and how he got around it by using
    workstations in Linux DNS/DHCP servers;


    +   - Ed''s workaround saved his company by $35,000,


    +   - Solving the problem of monitoring old hardware created the additional benefit
    of enhancing network uptime.


    # GET INSIGHTS FROM THE TRENCHES


    You can learn a bit by reading the methods other administrators and engineers
    use to resolve challenging issues. Our hope is that this article will provide
    you with unique values and although techniques that can help you become a better
    IT professional. All administrators and their companies remain anonymous so that
    no sensitive company or network information is revealed.


    # Addressing the problem


    When Ed was placed in charge of the call center network in Bellevue, WA, the company
    in communications was in the process of subdividing the 700 to 800-node network
    into five VLANs.


    Under the original topology, when all the PC workstations in the company would
    be between 8:00 and 8:30 morning, they were using DHCP to request an IP address
    from a Windows NT Server, which was also doing DNS queries. Multiply the requests
    by more than 700, and there was a lot of network traffic being broadcast on the
    company''s network. Traffic to dozens servers compounded the situation.


    When the VLANs were set up, the marketing department would have its own LAN, the
    MIS department would have its own LAN, and so on.


    Ed picked a Saturday to make the change, and after some few wrong planning that
    led to everything was going smoothly. Then another administrator could come to
