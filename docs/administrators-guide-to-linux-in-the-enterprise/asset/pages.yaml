  md: 'Record, MBR, or at the beginning of the bootable partition. Every operating
    system uses a boot loader of some sort; without it, the computer could not boot
    into your operating system. Windows comes with its own boot loader that is transparent
    to the user, the same as in DOS. It will simply boot Windows or DOS, whichever
    you have installed. You can purchase third-party loaders for Windows, which allow
    you to dual boot different operating systems on your computer. One example is
    PowerQuest''s BootMagic, which is also used for the OS/2 operating system.


    With Linux, you can also use BootMagic if you feel like a boot loader. BootMagic
    comes with PartitionMagic and you may have the need for an on-the-fly utility.
    If you do not need this, Linux comes with two extra boot loaders: LILO and GRUB.


    # Introduction to LILO and GRUB


    LILO (http://biblio.org/linux/system/boot/LILOINDEX.html) was the first Linux
    loader, and its name stands for "Linux Loader". You will need to download it because
    all Linux distributions come with it.


    GRUB is a newer boot loader at one point was a little more advanced than LILO.
    Its name stands for Grand Unified Boot Loader. GRUB is a little more difficult
    to use than LILO, and it is no longer more advanced than LILO. It offered a graphical
    boot menu before LILO did, and it was a text ANSI-based menu at that. Now, LILO
    offers a true graphical boot menu and is as powerful, if not more, so GRUB.


    # Using LILO


    We will first look at LILO. The LILO configuration file is typically /etc/lilo.conf
    and contains information on possible kernels, boot images, and details for LILO.
    LILO can dual boot between Linux and Windows, as well as many other operating
    systems; your LILO configuration file can become quite confusing. On one system,
    I have LILO configured to boot between eight versions of Linux-Mandrake, Debian,
    and SuSE. So, as


    you can see, there no real limits to what you can accomplish with LILO.


    ```

    Let''s take a look at an example lilo.conf:

    boot=/dev/hde

    map=/boot/map

    install=/boot/boot.b

    vga=ext

    default=linux

    lba32

    prompt

    timeout=50

    password=secret

    restricted

    message=/boot/message-graphic

    menu-scheme=bw:bw:bw

    image=/boot/vmlinuz

    label=linux

    root=/dev/hd1

    ininitrd=/boot/initrd.img

    append="hde=ide-scsi"

    read-only

    image=/boot/vmlinuz

    label=failsafe

    root=/dev/hd1

    initrd=/boot/initrd.img

    append="hde=ide-scsi failsafe"

    read-only

    other=/devfd

    label=floppy

    image=/boot/vmlinuz-2.2

    label=linux.2

    root=/dev/hd1

    initrd=/boot/initrd-2.img

    append="hde=ide-scsi"

    read-only

    ```


    This is the configuration file you use on Linux-Mandrake 8.0 system. It''s very
    straightforward and easy to follow.


    # Keywords


    The boot keyword tells LILO which hard drive contains the boot sector that should
    be the first drive in your system. We see that /dev/hde is the value, which specifies
    the first ATA100 drive in your. If you have ATA33 or ATA66 drives, this will likely
    be /dev/hd1 instead.


    The map keyword specifies the location of the map file. This is typically /boot/map.
    If you do a directory listing in your /boot directory, you should see the map
    file there.


    ![](img/18a4efcf5db19984d10d986ab04de74b_52_0.png)


