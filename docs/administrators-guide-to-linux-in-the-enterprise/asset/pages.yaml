  md: '# What are variables?


    Every language must have some way of storing information, and most languages use
    some form of variable. The shell programming language has its built-in variables
    such as PATH, PS, and the parameters 1 and 2. You can also create your own customized
    variables. A variable is merely a place in memory that holds some value or information.
    You have to give it a name and assign it a value.


    In the bash-scripting language, you can assign a value to a variable by simply
    typing the variable name by the equal sign and giving it a value. For instance,
    if you wanted to create a variable called weekday for Wednesday, then you would
    do this:


    ```

    weekday=3

    ```


    This saves a place in memory, it weekday, and gives it a value of 3. In the following
    example,

    name=elizabeth


    the variable stores the name elizabeth. Now you have stored two kinds of information
    in the variables. A numerical value is stored in variable. We''ve stored alphabetical
    information. How do you get the information out or to use it once you''ve put
    the variable name, like:

    echo weekday or echo $name


    Variables can be very useful for storing and retrieving information. You must
    be careful not to use the same variable name for two different values in the same
    scripting program. Give each variable a name that means something to you and others
    who might be using your program.


    # What are conditional statements?


    The bash, pdsh, and tc shell have two kinds of conditional statements. These are
    the if and case statements that are similar to the ones you''ve proved used in
    other languages such as BASIC. These statements are used to execute different
    parts of the program depending on whether certain conditions are true. The syntax
    is a little different between the


    various shells, so than try to cover all of them, we''ll use bash and pdsh for
    your examples.


    # The if statement


    The conditional statements allow you to perform complicated conditional tests
    in your shell programs. The syntax of the if statement is as follows:


    ```

    if [ expression ]

    then

    commands

    elif [ expression2 ] (an abbreviation of words else if)

    then

    commands

    else

    commands

    fi (used to use the end of the statement)

    ```


    In the syntax described above, the statement is executed only if one of the expressions
    with the if statement or any elif statements before it are true. The commands
    with the else statement are executed only if one of the expressions associated
    with the if statement or any of the elif statements are true.


    # The shell case statement


    The case statement, as it applies to the shell, enables you to compare a variable
    with other conditions and execute a block of code if a match found. The correct
    syntax for bash and pdsh is as follows:


    ```

    case string1

    str1

    commands:

    str2

    commands:

    *

    commands:

    esac (indicator of termination)

    ```


    In this syntax, we have string1 being compared to str1 and str2. If one of the
    two strings matches string1, the commands following the semicolon are executed.
    But, if neither str1 nor str2 matches string1, the commands associated with the
    asterisk are executed.


