  md: '# Everything you wanted to know about Linux networking but were afraid to ask


    **By Larry Mintz**


    In this article, I''ll dive into the heart of working: I''ll discuss setting up
    a LAN, using a TCP/IP network, and writing the files you need. For the purpose
    of example, let''s assume that Linux is set up for a company using linuxstuff.com.


    You might be familiar with Red Hat''s Linuxconf! This is a user-friendly GUI that
    allows the administrator to configure, graphically, many aspects of a networking
    environment. The Linuxconf writes the following:


    +   * Networking | Server Specification: This section writes to /etc/resolv.conf.


    +   * Networking | Basic Host Information: This section writes to /etc/HOSTNAME.


    +   * Networking | Misc | Information About Other Networks: This section writes
    information about your network to etc/networks.


    # ### How does TCP/IP work?


    TCP/IP is constructed of four layers:


    +   * The Application layer


    +   * The transport layer


    +   * The Internet layer


    +   * The Network Access layer


    These layers are logical rather than physical. All network transactions move throughout
    them as they travel through the hardware (cables, LAN cards, and computers).


    Here are some specifics about each layer:


    +   * The Application layer handles everything that is not TCP/IP.


    +   * The Transport layer handles data routing and delivery, including session
    initiation, error control, and sequence checking.


    +   * The Internet layer is responsible for data addressing, transmission, and
    packet fragmentation and reassembly (IP protocol).


    +   * The Network Access layer is responsible for transmitting data across the
    network,


    including determining how to access the physical medium.


    # ### TCP/IP protocols


    I''ve briefly described how TCP/IP is logically layered, but there''s still more
    to discuss. Let''s look at the numerous protocols that use TCP/IP.


    +   * TCP (Transmission Control Protocol): This is a connection-based service,
    which means that sending and receiving are dedicated.


    +   * UDP (User Datagram Protocol): This is a connectionless service, which you
    send data to an address but you do not know your mail address.


    Then are the routing protocols:


    +   * IP (Internet Protocol): This protocol handles the transaction of data.


    +   * ICMP (Internet Control Message Protocol): This protocol handles messages
    for IP.


    +   * RIP (Routing Information Protocol): This protocol determines the best routing
    for delivering a message.


    +   * OSPF (Open Shortest Path First): This is another method for delivering messages.
    Here are the address address protocols:


    +   * ARP (Address Resolution Protocol): This protocol determines the unique numeric
    addresses of machines on the network.


    +   * DNS (Domain Name Service): This protocol determines numeric addresses from
    machine names.


    +   * RARP (Reverse Address Resolution Protocol): This protocol determines the
    addresses of machines on the network but in reverse order of ARP.


    These are the user-based services:


    +   * BootP (Boot Protocol): This protocol boots a network by reading information
    from a server.'
