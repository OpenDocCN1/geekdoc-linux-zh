    # Process administration in Linux


    By Jim McIntyre


    When you run a program on a Linux system, an instance of that program is loaded
    into memory. When a program is loaded into memory, it becomes a process on your
    Linux system. Because processes consume resources, such as memory, CPU time, and
    disk space, being able to manage processes is an important administrative skill.
    The scale of a Linux system at any time, or any process for that, is determined
    by the process running on the system at that moment. In this article, I''ll provide
    an introduction to process management on a Linux system.


    gram, which is the first process to run on the system. Depending on the system''s
    run level, init may start other processes. Every process on a Linux system gets
    a process identification (PID) number. Because init is the first process loaded
    into memory, it will always have a PID of 1.


    # Daemon process


    A daemon is a process that runs continually on your system or is loaded into memory
    when asked to do. During the Linux startup, several daemons are loaded into memory.
    Some of the common daemon processes are dhpd (Dynamic Host Configuration Protocol
    Daemon), crond (Cron Daemon), and pd (Line Printer Daemon). A daemon is usually
    identified by the letter d at the end of the process name.


    # Starting processes in Linux


    Before we get involved in processes, I''d like to explain some concepts. Below
    are the main processes and their explanations.


    # Init


    When a Linux system is booted, init.conf loads the kernel. The kernel in turn
