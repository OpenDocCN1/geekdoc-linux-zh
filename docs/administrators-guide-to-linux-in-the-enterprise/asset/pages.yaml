    this claim must have used Linux on the desktop. If they had, they would know that
    Linux still does not offer a common, viable desktop.


    While servers are rock-solid


    # The final word


    When it comes to Linux, I am a realist and not the kind of convert or a zealot
    that characterized the early Linux user base. I am the kind of IT professional
    that needs to win over in order to build a niche in this industry. In this article,
    I tried to take a sober look Linux''s advantages and disadvantages to help administrators
    see through the hype and make sound decisions when considering a Linux deployment.'
