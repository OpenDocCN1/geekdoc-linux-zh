    # Adding modules


    The installation is a good time to configure some Apache modules that are helpful
    in building a robust and secure Web site. You could also install additional modules
    at any time, since Apache supports for dynamically loaded modules. Some popular
    options we will look at are Perl, PHP, and SSL.


    # Installing from RPM


    RPM was created by Red Hat and is an excellent packaging system. A package in
    this format either a precompiled binary or source code and will install everything
    on the system defaults. It will also maintain a database of packages currently
    installed and will notify you of dependencies and conflicts. While this does not
    allow for much specificity as compiling from original source, it does make the
    task incredibly simple. Additional support for other software can be loaded later
    without the need to compile any source, so if we from RPM, execute the following
    command:


    ```

    rpm -ivh apache-1.3.20.1386.rpm

    [use the name of the file you downloaded]

    ```


    This will install the package properly and show a mark progress indicator. You
    should also start the server automatically, but check the list of processes to
    be sure. For more information and options, visit http://rpm.com. You will find
    the latest version of RPM, as well as detailed documentation on how to use it.


    # Installing under Debian


    Debian is a Linux distribution and contains its own packaging system. Known as
    Apt, the system provides for the on-fly installation of thousands of packages.
    Just like RPM, it will maintain a database of installed packages and will download
    dependencies automatically. Make sure you have an updated list by using apt-get
    update prior to your apt-get install. Another option is to install packages the
    old-fashioned way (the original Debian method) with dpkg, as in the following
    example:


    ```

    dpkg -i apache-1.3.9-32.deb

    [use the name of the file you downloaded]

    ```


    Perl integration with Apache is provided by the mod_perl package. This package
    allows for the creation of Apache modules in Perl, as well as providing the benefits
    of an embedded interpreter. This translates into an alternative to CGI, offering
    power and speed.


