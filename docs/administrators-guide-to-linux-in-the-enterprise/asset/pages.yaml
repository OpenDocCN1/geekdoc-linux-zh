  md: 'The initial/lilo keyword contains the name of the file to be used as the new
    boot loader.


    With versions of LILO 21.5 and higher, this can be either boot-text.b or boot-menu.h.
    In our case, we use /boot/boot.h which is actually a symbolic link to boot-menu.h.
    You will typically want to use boot-menu.h, as that provides the graphical menu
    when you start your computer, boot-text.b only exists for those who prefer a simple
    LILO instead of the menu.


    The vga keyword determines which VGA mode LILO will boot. If you wish to boot
    into straight 80x25, use the word "normal" here; if you wish to boot into 80x50,
    use ext. If VGA modes are available, use the word ask and LILO will present you
    with a list of VGA modes to choose.


    The default keyword determines which image is to be loaded. In this case, we want
    the linux image to be loaded by default.


    The lba32 keyword tells LILO to generate 32-bit block addresses instead of sector/head/cylinder.
    This is recommended for all recent devices, as it allows LILO to boot from partitions
    beyond the 1024-cylinder barrier.


    The prompt keyword tells LILO to issue the boot prompt and wait for user input
    before proceeding. The timeout keyword tells LILO how long to wait in tenths of
    a second. A value of 50 in the timeout section tells LILO to wait 5 seconds.


    The password keyword defines a password that must be used to boot the system.
    In our case, password is secret. If you wish to the system require a password
    to boot, remove the restricted keyword from the file. If you only want a password
    to be required if the user tries to access the kernel at the boot prompt, leave
    the restricted keyword where it is. The restricted keyword is generally used when
    you want the system to be able to


    boot without human intervention but want to prevent people from changing kernel
    options. These keywords can also be used in the image sections, so you can password-protect
    certain images completely, using the restricted keyword with only other images.
    If you wish to mix and match restricted and unrestricted images, define the keyword
    in the global section and use the images you wish to boot without human intervention
    (the default image) and omit it from the other sections so that a password is
    required to boot them.


