    # Making Linux accessible to people with disabilities


    By Bryan Pfaffenegger


    Linux is going big time, and it''s going to run into big-time challenges. One
    challenges concerns accessibility—the degree that a computer system is usable
    by people with limited vision, hearing, or dexterity. As organizations increasingly
    move toward using Linux as the platform for desktop computing, Linux system and
    network administrators need to take accessibility seriously. In this article,
    you''ll learn why accessibility is so important, why poorly designed systems and
    programs can come very frustrating to people with disabilities,—and best of all—Linux


    may well be the platform of choice for organizations committed to taking accessibility
    seriously. You''ll also learn about the many Linux utilities and programs that
    can enable an employee with disabilities to make a greater contribution.


    # Why does accessibility matter?


    Organizations should make sure that they''ve equipped people with disabilities
    with computer systems that are as accessible as possible, given the limitations
    of current technology. The main reason, and by far the most important one, is
    that it''s simply the right thing to do. Properly designed and equipped computers


    80 Administrator''s Guide to Linux in the Enterprise'
