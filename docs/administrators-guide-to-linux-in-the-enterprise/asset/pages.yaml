  md: '# Enabling additional features


    Let''s look at some more of the features that can be enabled in the mail file,
    which is used to generate sendmail.cf. As a refresher, we define our configuration
    in the mail file and use the m44 processor to generate the cf file: /usr/bin/m44
    ...cf.cf mysite.mc < mysite.cf


    Sendmail now ships with relay delivering. In the early days of the Internet, these
    things weren''t an issue, but with the over-whelming amount of spam we all get,
    it''s necessary for system administrators to tighten the control on whose mail
    passes through their systems. If you want to enable relay, add the following feature
    to your mail file:


    FEATURE (''promiscuous relay'')


    If you want to only relay to your own domain, use:


    FEATURE (''relay_domain_'')


    The other side of the coin is how to set up a server to accept another domain.
    This is useful if you are relaying from an unqualified domain, such as a small
    business or home server, but want to queue the mail and batch it to your ISP.
    This involves masquerading and relating, leaving several layers of control that
    can be enabled. The simplest level of masquerading is:


    ```

    MASQUADE_AS (host.domain)

    ```


    So if your machine is mailer.fakedomain.org, and you want outgoing mail to look
    like from your valid e-mail account at myisp.com as the host.domain entry. In
    the sendmail.cf file, it generates the line shown in Listing A, plus a few


    # List A: Masquerading


    +   # who i masquer as (null for no masquerading) (also see =$)

    DMisp.com


    ber of addressing rules further down the file (rulesets 93 and 94).


    Some sites will still bounce this mail, so you may need to masquerade the envelope:


    If you want to expose certain users, use


    ```

    EXPOSED_USER (usernames)

    ```


    You can also set up a virtual hosting, where your mailserver can act as a virtual
    host for a number of domains:


    ```

    FEATURE (''vertustable'')

    ```


    In this case, you incoming mail address to the local system recipient:


    ```

    info@somedomomain.com

    larry

    ```


    To map the outgoing mail in this way, use the generable feature:


    ```

    FEATURE (''genericstable'')

    ```


    and set up /etc/mail/genericstable like virtual, but with the entries relaxed:


    ```

    larry info@somedomomain.com

    ```


    If you have a number of machines and want to relay all mail through one before
    going to the ISP, then


    ```

    define (''LOCAL_RELAY'',

    mail:hostname'')

    ```


    All with unqualified addresses (no @host) will get relayed to the local relay
    machine. In sendmail.cf, the result line looks like that in Listing B.


    A related feature is:


    ```

    define (''SMART_HOST'',

    mail:hostname'')

    ```


    mailer defaults to relay, but smtp is also common. This generates the line in
    sendmail:


    # List B: Relaying


    +   # who i as unqualified names to (null means deliver locally)

    DRmymailer.mynet.net'
