    # Configuring Squid


    It''s time to configure Squid. To do this, you must change the /etc/squid directory.
    This directory will contain a few files, but the most important one and the one
    we will use is squid.conf. Open squid.conf in your favorite editor.


    Squid will theoretically operate with all of the defaults enabled. If a keyword
