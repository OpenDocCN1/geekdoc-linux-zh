    # domain


    You''ll often see administrators use the security server when setting up Samba
    in a Windows NT document. But since Samba version 2x, the domain option has been
    enabled.


    Domain security makes Samba authenticate like an NT machine, while server security
    makes Samba authenticate like a Windows 95/98 machine. Domain security gives the
    advantage of participating in NT domains in an enterprise environment. It cuts
    down on PDC/BDC connection resources, unlike server security, which always keeps
    an RPC connection to the PDC or BDC as long as the daemon is running, domain security
    connects to the PDC or BDC only when authenticating a user. This conserves valuable
    resources on NT domain controllers.


