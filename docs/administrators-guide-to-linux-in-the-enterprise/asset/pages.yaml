    Actually, in a situation as this, Linux can save you more than the cost of the
    licenses because the hardware requirements for Linux are significantly less than
    for Windows NT or 2000 for accomplishing the tasks. Whereas a Windows 2000 server
    really a minimum of 256 megabytes of RAM, a Linux server can offer comparable
    performance when handling the tasks with 64 to 128 megabytes of RAM.


    Ultimately, my goal here was to dispel the myth that Linux is inherently more
    secure than Windows NT/2000; clearly, it is not. That being said, I''re ready
    to have a look at some of the areas where Linux has considerable value, as well
    as the penguin''s drawbacks. Figure A shows a rundown of the Linux pros and cons
    that we''ll be discussing.


    # Deployment and support


    One of the most widely extoled virtues of Linux is its stability. Once Linux properly
    configured—a task that not for the faint of heart or the inexperienced—you can
    certainly reap the benefits of excellent stability. I have enough stories from
    other administrators about Linux Web servers, DNS servers, and firewalls that
    were configured and not touched for a year to believe fully in the stability of
    Linux. I can also personally watch for the Linux firewall on my network without
    a hit for four months, and a Linux server I set up ran uninterrupted for over
    six months.


    Figure A

    Linux advantages

    ► No licensing fees

    ► Most software is stable and reliable

    ► Requires minimum hardware resources

    ► Open source allows for greater security


    Linux disadvantages

    ► Supporting is expensive

    ► Troubleshooting is difficult

    ► Configuration is complicated and timeconsuming

    ► Desktop software is unstable and buggy


    However, this stability does not come without a price. Setting up and configuring
    any kind of server functionality on Linux takes considerable effort and often
    an initial period of trial and error to make it work.


    # A look at the true costs


    You can''t talk about the advantages of Linux without talking about dollars (whatever
    your national currency may be). One of the tried-'
