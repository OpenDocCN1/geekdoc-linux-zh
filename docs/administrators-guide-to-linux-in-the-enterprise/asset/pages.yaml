  md: '# Evaluating Linux: Reality vs. hype


    By Jason Hiner, CCNA


    I''m a huge fan of Linux. However, I don''t want to oversell Linux. Linux continues
    to suffer from too much hype and exaggeration. My goal with this article is to
    help you out the real advantages and disadvantages of deploying, and supporting
    Linux in a corporate environment.


    that it is not susceptible to these kinds of damaging activities are flawed arguments
    from a network security standpoint. It''s like saying, "Let''s go to the second
    floor of our house because the people are throwing stones only at the first floor
    now." Eventually, they''ll start throwing stones upstairs, too, and eventually,
    hackers and virus writers will start targeting Linux. A switch to Linux will keep
    your organization out of harm''s way a temporary solution, and is not a good security
    strategy.


    # Why Linux is getting so much attention


    A lot of the attention has received in the last few years is based on what Linux
    is and more on what Linux is not. Quite simply, Linux is not Microsoft. In fact,
    Linux may adequately be the antithesis of Microsoft.


    Microsoft and its products are centralized, polished (at least in terms of image),
    proprietary, user-friendly, and greatly expensive. Linux and software products
    are decentralized (in most cases), open source, a little difficult to use, and
    generally quite inexpensive (at least out).


    Much of the hype that swirls around Linux is centered on the hopes of many people,
    both within and outside the IT community, that Linux will loosen Microsoft''s
    strangle on the marketplace. However, IT professionals seeking to deploy the best
    linux solutions must cut through this when evaluating whether OS meets the requirements
    of various situations.


    No operating system is inherently secure, with the possible exception of something
    like Trusted Solaris, which is built entirely secure in order to serve the needs
    of government contractors and high-security industries. The security of most operating
    systems (including Trusted, to an extent) depends heavily on the configuration
    of the administrators who design, implement, and manage.


    Linux enthusiasts often point to the fact that Red is continually releasing new
    patches for Windows as an indicator that Microsoft products are less secure. However,
    these numerous flaws are found because of the sheer number of administrators,
    security experts, and hackers that put Windows under the microscope every single
    day.


    They say that Microsoft should not make security a higher priority in development
    efforts. Obviously, but putting Linux under the same microscope reveals a plethora
    of flaws, too, as evidenced by the fact that companies like Red Hat are also releasing
    security patches for their Linux distribution.


    # The Linux security myth


    The first, and most prevalent, of hype I must dispel is the "Linux security myth."
    I have read a number of flawed and misleading arguments about Linux security.
    Many assert that Linux is inherently more secure than Microsoft''s popular Windows
    NT/2000 platform. I strongly believe that argument is wrong, and I will tell why.


    Arguments that use the example that Linux hasn''t been hit by the ILOVEYOU virus
    to claim


    In defense of Linux security, I will side with Linux partisans in agreeing that
    an administrator can more thoroughly lock down a Linux system than a Windows NT/2000
    system because of the open source nature of Linux and the fact that you can get
    in and look at every aspect of a Linux system—something


    ![](img/18a4efcf5db19984d10d986ab04de74b_12_0.png)'
