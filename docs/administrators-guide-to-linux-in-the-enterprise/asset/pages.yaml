  md: 'You can specify the cache''s memory size with the cache_mem keyword. This keyword
    defines the amount of memory Squid uses for in-transit objects, hot objects, and
    negativecached objects. These objects are pieces of data, such as graphics, sound
    or Web pages. Since all data for objects is stored in 4-KB blocks, your specification
    must be a multiple of 4 KB. And that''s a reasonable amount of memory to allocate
    to the cache. Note that this is not the total amount of memory Squid will use.
    This is merely for the cache, but more memory. On a larger load server, the size
    defined may be third or half of the overall process usage. In other words, if
    you define 8 MB, it is prepared for Squid to use up to 24 MB of memory under higher
    load situations. Here''s an example of the command to specify the cache''s memory
    size:


