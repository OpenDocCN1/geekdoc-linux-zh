  md: '# # Plan your enterprise Linux installation properly


    By Judith Samson


    You''ve been trying for months to convince your management to give the money for
    a pilot Linux installation, and they finally bought into the idea. You''ve performed
    countless Linux installations on your own computers and machines, so installing
    it for any company shy should be no different, right?


    Many aspects of Linux installations remain the same regardless of hardware, environment,
    or distribution, there are also several critical differences. If you''re a system
    administrator or a team leader who is responsible for performing an enterprise
    Linux installation for the first time, you''ll want to pay attention.


    In this article, we''ll assume you''re installing Linux for a business or organization,
    that you have more than 10 workstations to build, and that you have experience
    installing Linux for your personal use.


    # ## First things


    The first step is to plan the installation carefully. Answering the following
    questions will help you develop a framework for your plan:


    +   - Why did your organization decide to install Linux?


    +   - How Linux-savvy are the users?


    +   - How much time do you have for install tion, configuration, troubleshooting,
    and user training?


    +   - Will the users need access to another operating system?


    Next, you''ll need to gather information from the users to determine their specific
    needs:


    +   - How well do they know Linux?


    +   - Will they have a choice of desktop environments?


    +   - What software will they need?


    +   - What does the team do?


    +   - Does each user perform the same function, or do users have different jobs
    with different requirements?


    As you gather questions and find answers, you can begin to create a list of requirements.


    # ## Which distribution?


    Although you can create your own distribution from scratch with the Linux kernel,
    it''s easier to choose an existing distribution that closely matches your users''
    needs and then customize to meet your specific requirements. Selecting a distribution
    for your company is from choosing one for your personal use. Some of the factors
    that you''ll need to consider are:


    +   - Stability


    +   - User-friendliness


    +   - Tech support


    +   - Ease of installation


    +   - Ease of upgrade


    +   - Cost


    +   - Included applications


    # ## What software will you need?


    The next step in planning your Linux installation is to prepare a list of software
    that the users require. Not only will you need to find out what software is required,
    but you will have to make sure that the software you need is compatible with Linux.
    Keep in mind how many requirements can be satisfied within the base Linux distribution,
    which includes free software, (if any) requirements can be satisfied only with
    Windows products, and which applications require licenses.


