    # # System accounting in Linux


    By Jim McIntyre


    The ability to monitor user activity on a Linux system is one of the first skills
    a Linux administrator should master. This ability provides a first line of defense
    in discovering unauthorized activity. This article discusses the monitoring tools
    that are available as part of the Linux operating system, and demonstrates how
    to employ system accounting procedures to enhance system security.


    # # Connection accounting


    Connection accounting is the process of tracking current users and logins. Connection
    accounting on a Linux system is managed through the following utilities:


    +   - utmp—Converts raw data from /var/run/utmp or var /log/utmp into readable
    ASCII text. Best suited for use in scripts.


    +   - acct—Reads var/log/utmp and outputs connect time in hours. The default is
    a sum for all users.


    +   - last—Shows a list of logged-in users. Provides more details than the ac
    command.


    +   - who—Shows currently logged-in users.


    +   - wtmp—Used to log user sessions.


    +   - wtmp—Used to record login and logout activity. The wtmp utility also records
    system reboots and run-level changes.


    +   - var/run/utmp—Contains all data associated with utmp.


    +   - var/log/wtmp—Contains all data associated with wtmp.


    Several programs are involved in providing information related to connection accounting.
    This eliminates the need to run a specific daemon to initiate connection accounting.
    The following files must exist on your system:


    If these files do not exist on your system, the following commands will create
    them:


    ```

    touch /var/run/utmp

    ```


    ```

    touch /var/log/wtmp

    ```


    These files are created by root, and the permissions will be set to 644 (rw-r--r--).


