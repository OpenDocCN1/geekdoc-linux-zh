  md: '# # Virus scanning with Qmail


    By Danen


    In previous articles, I introduced the Qmail mail server ("An overview of Qmail,
    part 1: Installing Qmail, part 2: Configuring Qmail") as an alternative to the
    postfix and sendmail servers. Qmail is a high-capacity, scalable mail scanner
    that runs under Linux and other UNIX variants. It can be used as a single-user
    MTA or as a full-blown enterprise mail system.


    With the proliferation of viruses on the Internet, many ISP and company-run mail
    server administrators are looking at options to filter attachments and viruses
    at the mail-server level. While virus scanners for Linux are not as numerous as
    those for Windows, there are several commercial virus solutions available. Integrating
    the virus scanner into Qmail at the queuing level can be a challenge, but the
    end result is a scanner that scans for every incoming and outgoing message.


    In this article, I will explain how to install the AMavis wrapper program based
    on the usage of the Sophos Anti-Virus solution, but you may choose to use a different
    virus scanner. I will also list and explain other virus-scanning options.


    try as many of them you can before settling on a solution. The most expensive
    one may not be the best for your needs, and the cheapest may actually work better.
    Another important factor to keep in mind is the speed of the scanner. If the scanner
    takes seconds to scan an e-mail and your site has high traffic, you may encounter
    a significant slowdown in your e-mail processing time. This is another reason
    you will want to experiment with the different scanners before making the final
    decision.


    # ## AUTHOR’S NOTE


    You may also want to invest in some extra horsepower for your system. Qmail does
    not require anything fancy, but if you are scanning each message coming into or
    leaving your system, you may want something with more power to handle the load.


    For those who run a mail server for their company or serve external customers,
    removing viruses before the offending message is delivered to the client minimizes
    the risk of spreading. So, if Outlook users try to open and run every virus that
    hits their system, by wrapping a virus program with an antivirus solution on Qmail,
    you can reduce the number of infections. If every mail server on the Internet
    scans for viruses at a server level, the spread of viruses would decrease.


    Since there are many scanners to choose from with Linux, you have limited options,
    the available virus scanners out vary greatly in performance. Sophos, the virus
    scanner I will use in my installation, has the best customer support system out
    of all the vendors, and the cost involved is more for the support than anything
    else. However, it also perhaps the most expensive virus-scanning solution available.
