  md: '# # All the wonders of procmail, part 1


    **By Jack Wallen, Jr.**


    Imagine being able to configure your mailprocessing agent on your own personal
    computer to do whatever you want it to! Imagine being able to configure, with
    simple file edit, autofill, autoreplying, playing sounds, filtering, and many
    other actions. Now imagine which application can do this. And finally, imagine
    which operating system you must be using to have these awesome features!


    If you''re not familiar with procmail, you don''t know what you''re missing. procmail
    works in conjunction with your local Mail Transport MTA as a local mail delivery
    agent and a powerful filtering system. Say what? Okay, let me explain this one
    more time. Linux has MTAs (mail transfer), fetch your configured mail server (or
    your ISP''s mail server), and bring your e-mail to you. The MDA (Mail Delivery
    Agent) takes the mail from where the MTA leaves off and drops into your mailbox.
    If the U.S. Postal Service is yours, your postal carrier is MDA, and your postal
    carrier has permission to sort through your mail and remove all the junk (you
    don''t).


    procmail does what it does (delivers your e-mail to mailbox and filters out the
    unwanted) with amazing flexibility you could spend the rest of your computing
    life with its options and configurations. In this article, I''ll highlight some
    of the most useful options and help you create a highly personal and usable procmail
    recipe.


    # **Recipe what?**


    First of all, procmail uses an re file (resource configuration) that resides in
    either the user''s home directory or the / directory. If there is no procmail
    file in the user''s home directory, the application will default to the file in
    /.


    **NOTE**

    Use caution when writing the default file because it will be executed with root
    privileges.


    We''ll begin with the single-user procmail and eventually migrate to a more complex
    procmail system that will aid the administrator with such tasks as redelivery
    of e-mail, notification of e-mail, and filtering.


    The procmail recipe is made up of various recipe that pull off all the stunts
    procmail is capable of achieving. Some of these recipes are simple, and some of
    them are complex. Regardless of the complexity of the recipe, there are commonalities
    throughout of procmail we use.


    # **Writing procmail recipes**


    procmail has two kinds of recipes: delivering and nondelivering. If a delivering
    recipe is found to match, procmail considers the mail delivered and will process
    the procmail filter after successfully executed. If a nondelivering recipe is
    found to match, procmail will continue after the action line of this recipe has
    executed. In other, a delivering recipe ends on an e-mail, and a nondelivering
    recipe allows the action to continue.


    The procmail recipe is written in mailfile syntax, so you can imagine the vastness
    of its capabilities. Within this, I will enlighten you on some of the syntax for
    procmail recipes.


    I like to the philosophy of creating procmail recipes in a very simple way: How
    do you want to accept an incoming e-mail, and what key section of that e-mail
    will allow you to accomplish my goal? For you''ll want to look at an email containing
    the following sections:


    +   - Destination header (To, Cc, Bec, etc.)


    +   - From header


    +   - Date header


    +   - Subject header


    +   - Body


    Finally, you will want to look at procmail having these basic actions:


    +   - Directing


