  md: '# # Understanding sendmail from the ground up


    By Stewart


    sendmail has been around almost as long as UNIX itself. The authors of the famed
    O''Reilly''s ''...'' book compare it to the ''Gordian knot'' of ancient history.
    It''s true; sendmail is a fairly complex program. A casual read of /etc/sendmail
    by means can scare the uninitiated away in fear. But like most things, in small
    bits, with a methodical approach, we can get beyond complexity and come to understand
    what sendmail is all about. I''m not saying you''ll be a master after one short
    article, but you will have a better level with the program, should you deal with
    it.


    use it not worry about how it works. If you have a valid Internet domain name
    and sendmail is serving just one properly configured with the fully qualified
    domain name, sendmail should just magically do its thing.


    Where you can run into trouble is if you need to ''tweak'' sendmail''s functionality
    or if you need to upgrade due to security issues and from source.


    If you think about it, e-mail has quite a magical revolution in communication.
    Unlike the phone, you can communicate with everyone if you''re not available at
    the same time. Unlike traditional ''snail mail,'' message delivery can happen
    in minutes; if you''re vacationing in Australia, you could read the e-mail sent
    to you in Milwaukee, you have access to the Internet.


    In Greek legend, the Gordian knot was given to an intricate knot used by Gordius
    to secure his oxford. Gordius was a poor peasant, arrived with his wife in a public
    square of Phrygia and an oracle told the populace that their future could come
    riding in a wagon. Seeing Gordius, the people made him king. In gratitude, Gordius
    dedicated his oxford to Zeus, tying it with a peculiar knot. An oracle foretold
    that he tied the knot would rule all of Asia. As to a later legend, Alexander
    cut the knot with his sword. From that time, ''cutting the Gordian knot'' came
    meant to solve a difficult problem.


    # NOTE


    The most current version of this as writing is 8.12.0.Beta7. I''m going to download
    and discuss version 8.11.3 from ftp://sendmail.org/pub/sendmail/sendmail_8.11.3.tar.gz.



    # What is sendmail?


    sendmail is an MTA, or Mail Transfer Agent. Its sole purpose in life is to move
    mail from one system to another or deliver mail on a system from one to another.
    Sounds simple enough, until you consider the wide variety of systems and network
    protocols out there and sendmail manages to communicate with most of them. Most
    UNIX operating systems come with sendmail out of the box, configured for the most
    common configuration. In many cases, you can just


    # Compiling sendmail


    Compiling sendmail from source is pretty easy, you''re set up with the necessary
    tools to build programs from source:


    ```

    tar -xzf sendmail.8.11.3.tar.gz

    cd sendmail-8.11.3

    build

    ```


    If you need special library or include options, they can be included while calling
    the script with the -l or -L flags and specifying your options.


    There are extensive notes on other options, as well as various compiler/OR quirks
    at www.sendmail.org/compiling.html.


    # Networking


    171'
