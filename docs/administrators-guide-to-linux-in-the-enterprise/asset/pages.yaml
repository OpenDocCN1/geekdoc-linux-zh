  md: "# Using database maps\n\nIf you are using any database maps, you'll need to\
    \ rebuild them with makemap from the original text source, (do keep your original\
    \ text source, don't) to make sure the format is compatible with your new setup.\n\
    \nThis is generally done like this (example is using the mailterable database—more\
    \ on this later):\n\n```\nmakemap /etc/mailterable.db \n/etc/mailterable\n```\n\
    \nhath is one of three database options that makemap use. The others are derm\
    \ and btree. Sendmail exports a format by default, it can read a number of database\
    \ formats, provided you've compiled support for them inside the binary and you\
    \ specify the technique in the .smtp configuration. You can leave the lookup in\
    \ plain text format, but lookups become slow if your list is large. The implied\
    \ database lookup command is:\n\n```\nhath -o /etc/mail/somedabase.db\n```\n\n\
    But you can also define any of other lookup techniques, calling an external program:\n\
    \n```\ndbm -o /etc/mail/virtuers\nprogram /path/to/program -d data.file\n```\n\
    \nThe option being looked up is passed as the last parameter by sendmail.\n\n\
    # Using procmail\n\nSendmail exports procmail as the local delivery for Linux.\
    \ Chances are, if you were running sendmail, you have procmail installed. You\
    \ can always check quickly:\n\n```\n[stew@omnibus stew] $ procmail\n/usr/bin/procmail\n\
    ```\n\nIf not, you can get a recompiled RPM for your distribution or get source\
    \ from the proccmail site at www.procmail.org. Procmail is much more a simple\
    \ delivery agent with quite powerful filtering techniques.\n\n# Host names and\
    \ aliases\n\nOne item not mentioned in the sendmail documentation is the existence\
    \ of /etc/mail/local-host. Sendmail will fail on startup without this file. It\
    \ should contain the names of the hosts you will accept for mail. You can easily\
    \ create one, like D.\n\nYou will also need an alias table. Chances are, you already\
    \ have one in /etc/aliases, so you just need to move it to /etc/aliases. Otherwise,\
    \ you may see the error message when trying to send or check mail status:\n\n\
    ```\nhash map \"Alias0\": missing map file\n/etc/mail/aliases.db\n```\n\nAfter\
    \ you copy your aliases file to /etc/mail, run newaliases. An aliases file is\
    \ mandatory, with a minimum of the following entries:\n\nListing D: /etc/mail/local-host-names\n\
    [root@omnibus root#] hostname > /etc/mail/local-host-names\n\nListing E: Startup\
    \ sendmail log\n[root@omnibus root#] tail -1 /var/log/messages\n\nApr 14 17:39:36\
    \ omnibus sendmail: sendmail startup succeeded\n\nListing F: Telnet to port 25\n\
    [root@omnibus root#] telnet localhost 25\nTrying 127.0.0.1...\nConnected to localhost.\n\
    Escape character is '^]'.\n\n```\n220 omnibus.ays.net SMTP Sendmail 8.11.3/8.11.3;\
    \ Sat, 14 Apr 2001\n17:45:16 -0400\nQUIT\n```\n\n174 Administrator’s Guide to\
    \ Linux in the Enterprise"
