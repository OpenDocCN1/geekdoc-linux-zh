  md: '# # Installing Apache Web Server on Linux


    By Thomas Nooning, CCNA, CCDA


    More and more, organizations of all sizes are hosting or collocating their own
    sites as they integrate their Web with back-end systems. A large number of entities
    choose Apache Web Server as the platform on which they run their Site because
    of its reputation for reliability and cost-efficiency. It also doesn''t hurt that
    Apache enjoys more than 60 percent market share among the boasts of over million
    Apache Web servers worldwide. Plus, many choose to Apache on Linux, which we''re
    going to talk about in this article. For your options for acquiring and installing
    Apache on Linux.


    you can download the .DEB files from www.debian.org/dist/packages. First, we''re
    going to look at Apache from the source code, and then we will explain how to
    install the package managers.


    # ## Installing from source


    Once you have downloaded the file, the next step will be to log in as root or
    use the us command. Most packages require permissions to install the Apache files
    onto your system and make the necessary changes to the Linux environment. Once
    you have done that, you''ll need to extract Apache from the archive. Go to the
    directory where you downloaded the file and issue the following command: tar xvf
    apache_1.3.20.tar.gz [use the name of the file you downloaded]


    # ## Acquiring Apache


    Apache, like Linux, is an open source development effort, so there is no cost
    for the software. Most distributions include a version of Apache. However, for
    security and stability, it''s good to start with the latest version of Apache.
    You can download the source code and binaries (1.3.20 at the linking of this article)
    from http://apache.org/dist/httpd or from one of the many other mirror sites linked
    from the Apache.Web site.


    The Apache site provides versions of Apache for various processors and in few
    different formats. For the purpose of this article, we will focus on the popular
