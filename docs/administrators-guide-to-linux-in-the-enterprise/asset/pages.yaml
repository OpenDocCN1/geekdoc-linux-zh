    # Defining permissions and logging options


    The TimeoutIdle keyword defines the maximum number of seconds to wait during an
    active data connection between the server and the client in which no data is sent
    (in other words, the connection has stalled). Default is 0 (indefinite).


    Now you can start defining permissions for the server. First, you want to allow
    all users to log into the server, so we have to use a <Limit> directive. Because
    this is outside a <Global> or <VirtualHost> directive, this setting applies to
    all defined servers:


    Finally, the MaxInstances keyword defines the maximum number of child processes
    that the standalone server can spawn at any given time (with no bearing on idle-started
    servers). Because each child process is an active connection, also controls how
    many users can be logged in simultaneously. Any connections beyond the configured
    maximum are written to the syslog and refused. The default is unlimited, but this
    generally is a good idea. Reducing the number depending on your system, you may
    want to configure from 10 to 100 to prevent Denial-of-Service attacks that may
    fork-bomb your server. This is typically caused by repeated connections to the
    FTP port, which cause ProFTPD to spawn a new child process until unable to spawn
    and simply gives up.


