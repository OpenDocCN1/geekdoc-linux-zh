    Well, your system sends the packets consist of your e-mail message to your gateway.
    The gateway forwards the packets to another gateway, or router. The process continues
    until the packet arrives at your friend''s system and he or she reads the message.
    This is for all Internet protocols, whether it is FTP, HTTP, IRC, and so on.


    # What is routing?


    Whether or not you are aware of how it works, every time you connect a computer
    to a network, you are dealing with the issue of routing. Routing is a method of
    sending IP packet from one to another. Instance, when you send an e-message to
    your friend in another country or even across the street, you are transmitting
    a series of IP packets, or datagrams, from your computer to your friend''s computer.
    How does this information get there?


    If you have a simple computer, you do not need to worry about routing. You simply
    tell your computer to use the IP address of the gateway supplied by your ISP and
    off go. However, if you run a network of computers, this can become a bit more
    of an issue. If you place a firewall in front of your network, you need to configure
    further. With this setup, you are actually dealing with two networks: your local
    network and the Internet. Packets coming from one to the other need to be forwarded
    in special ways so they arrive at their appropriate destinations.


