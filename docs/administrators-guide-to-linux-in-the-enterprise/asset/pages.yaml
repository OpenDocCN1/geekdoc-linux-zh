    # Sendmail from ground up: Features, tuning, and performance


    By Stewart Benedict


    “Understanding sendmail from the ground up,” I covered where to get sendmail,
    as well as how to build from source and set up a basic sendmail using the .mc
    files and options. This time, I''m going to cover some additional .mc options
    and the effect they have on sendmail. I''ll also cover


