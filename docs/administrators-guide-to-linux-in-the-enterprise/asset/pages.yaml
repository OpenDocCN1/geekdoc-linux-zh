  md: '# Using expressions


    procmail uses grep expressions. A regular expression is a pattern that describes
    a set of strings (a string that is constructed similarly to arithmetic expressions).
    Regular expressions typically consist of smaller, singular expressions that various
    operators piece them together. procmail uses regular expressions to do such things
    as a search query for a line.


    Let''s use a common example—spam. We all hate it, and we all want to do away with
    it. Within a GUI mail client, you can include keywords and keyrases for the mail
    filters to search for and act upon. procmail does this exact by using expressions.
    For instance, you frequently receive spam with "Money From Home." How do you filter
    so that such a message will never appear in your inbox? With regular expressions,
    of course. Let''s look at a small section of code used to filter the subject line
    "Money From Home." The following section of code where procmail scans the subject
    (another bit of code is used to act upon the mail):


    +   * Subject: Money From Home$

    ^--Marks the beginning of a line.

    .-Means any following character.

    $-Denotes the end of a line.

    ?-The preceding item is optional and will be matched at most once.

    -*The preceding item will be matched zero or more times.

    +-The preceding item will be matched one or more times.

    *[n]-The preceding item will be matched exactly n times.

    *{n,}-The preceding item is matched n or more times.


    {n,m}—The preceding item is matched at least n times, not more than m times.

    So you could look at the snippet of code as two expressions joined together, with
    operators, to form one phrase:


    +   * Subject:

    * Make Money From Home

    You could take this one step further and filter out any mail with a subject that
    contains any of the words "Money From Home" with the following change:

    * Subject: Make Money | From Home$

    We''ve made the following additions:

    |-Tells the condition to match exactly what follows as opposed to:

    |-Can act as a standard Linux pipe symbol or an extraction expression (as in this
    or that) or [ that | that]

    Also, procmail can use the following:

    !-Forward to the specified-email address. (Be careful, this can also insert the
    condition, depending on where and how it''s used.)

    *-Any sequence of zero or more

    +-Any sequence of one or more

    ?-Either zero or one a

    ^-[a-d]—Any character that''s not a da, b, c, or d

    *(abc)—Zero or more times the


    # NOTE


    There are, of course, much complicated (as well as powerful) methods of filtering.
    Also note that the expression will filter any message that has any combination
    of the words, Money, From, and Home within the subject.


    # Keywords and special characters


    Like most applications, the procmail uses keywords and special characters to make
    life easier. Many of these keywords and characters should be obvious to catch
    as well as us. Some examples are:


    +   :0—Beginning of a recipe


