  md: 'To find all processes for all users, the syntax tax is:


    ps a


    To find the parent process of another process, the syntax is:


    ps -1 "PID"


    PID is the process identification number of the process you wish to find it. To
    find which environment variables are available for a process, the syntax is:


    ps e


    The environment is appended to the COMMAND field. To find all processes being
    run by group Web, the syntax is:


    ps --group Web


    # Signaling Processes


    A signal is a way of telling a process to do something it would not normally do.
    For example, to kill a process, the user could use kill of much more than terminating
    processes; however, to use the command line options to


    ```

    kill -1

    ```


    at the command prompt. The output is a list of the options for the kill command.
    Some of the commonly used options are:


    +   - SIGHUP—Hang up. This is used to make a process reload configuration files.

    - SIGINT—Interrupt.

    - SIGQUIT—Quit.

    - SIGTRAP—Trace trap.

    - SIGKILL—This signal cannot be caught, blocked, or ignored.

    - SIGTERM—Termination. This is often sent before a KILL signal is sent.

    - SIGSTOP—Stop. This signal can be caught, blocked, or ignored.


    To catch a signal the signal is handled in a process. Use the kill command, the
    syntax is:


    ```

    kill # PID

    ```


    Example (Let''s assume Netscape is running as process # 670):


    ```

    kill -9 670

    ```


    would Netscape unconditionally.


    # the killall command


    The killall command lets the user to specify a process by name. For example, to
    kill all instances of Netscape type:


    ```

    killall netscape

    ```


    Be careful when using the killall command. Let''s say you are using the killall
    of the Emacs editor, running one to edit the file foo.txt and the other to edit
    /etc/passwd. Say you want to kill the instances of Emacs used to edit foo.txt,
    and you use the command kill emacs, both the instance of Emacs used to edit foo.txt
    and the instance used to edit /etc/passwd will be terminated. This could result
    in the loss of any changes you have made to important.


    # Running a process in the background


    When a command runs from the console it normally in the foreground. Running a
    process in the foreground means that you have to wait for it to finish before
    you initiate another process. However, when a process is in the background, another
    process can run simultaneously. A process can run in the background by adding
    an ampersand (&) at the end of the command line, as in this example:


    ```

    find /etc -name *.conf > ~/conf-file &

    ```


    and write the output to a file named conf-file in user''s home directory. This
    process will be in the background, allowing the user to perform other tasks while
    this command is executing.


