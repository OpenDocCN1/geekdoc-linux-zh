  md: '# Foreword


    The Linux operating system is finally receiving hard-earned and well-deserved
    respect. After all, the "startup" OS provides essential and efficient enterprise
    computing capabilities for networking, file sharing, printer and device sharing,
    e-mail transport and delivery, security, remote access, and more. In addition,
    many of the issues that caused naysayers to previously dismiss Linux as clunky
    and unworkable have been resolved or significantly improved. With proprietary
    licensing costs continually on the rise, most IT managers and administrators are
    ready to acknowledge that Linux may be worth another look.


    If you''re considering whether an open-source solution is right for your organization,
    TechRepublic''s Administrator''s Guide to Linux in the Enterprise is the resource
    for you. You''ll find thoughtful articles that examine the pros and cons of deploying
    Linux in the enterprise and cut through the hype to help you make informed decisions
    about deploying Linux in your organization. The in-depth articles assembled here
    help you:


    +   - Evaluate whether Linux is right for your enterprise.

    - Install and configure Linux servers and clients.

    - Understand basic commands and command processing.

    - Integrate Linux on a Windows network.

    - Configure cross-platform printer sharing.

    - Deploy a Linux-based e-mail and personal information management solution.

    - Learn the ins and outs of user and group administration.

    - Allocate disk space equitably among users.

    - Log system events for performance and security monitoring.

    - And much more!


    As an added bonus, the companion CD-ROM contains several items you won''t find
    in this book, including our Linux server primer and Jack Wallen, Jr.''s exclusive
    e-mail interview with Linux creator Linus Torvalds. The CD''s powerful software
    capabilities provide added flexibility and ease of use.


    If you have comments or suggestions regarding this TechRepublic product, please
    e-mail us at trproproducts@techpublic.com.'
