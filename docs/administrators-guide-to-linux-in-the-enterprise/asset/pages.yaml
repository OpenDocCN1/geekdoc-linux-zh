    # Review the basics, quickly


    If you remember, the basics of a prosmail recipe looks like this:


    +   : o

    : action


    In order to accomplish nondelivery recipes, a lockfile is often used. What is
    a lockfile? I''m glad you asked! In this article, we will unravel the mystery
    of what the Linux (and the UNIX) community calls lockfiles.


    Adding in a few more possibilities gives you:


    +   * flags: lockfile_name

    * condition 1

    * condition 2


    # Lockfiles


    The first recipe has two lines. The first line, 0, matches the beginning of the
    recipe (all recipes have this), and the second line, action, is the action that
    is to be taken incoming. For instance, you can replace a recipe with something
    simple as


    It''s important to understand why lockfiles are used with certain recipes and
    why they''re not used with others. Understanding this difference could keep you
    from losing a good de-mail (as well as a good deal of time in retrieving that
    lock-email).


    ```

    ! xxxx.xxx

    ```


    # What do they do?


    where xxx@xxx.xxx is replaced with a e-mail address. This will forward all mail
    to the indicated e-mail.


    Very simply, a lockfile semaphores within a file that basically says "the file
    that owns lock already has a process acting upon it and cannot be acted upon by
    other process." With this handy-duty tool, you can take an incoming e-mail, attach
    a lockfile to it, run a single process on the e-mail, and be sure until that locked
    process has come to completion.


    The second recipe contains two (or more) extra lines that are marked condition
    and condition2. The second recipe adds to the first line flags and a decoder lockfile.
    The possible flags are fairly valuable:


    +   ► H-egrep the header (the head).

    ► B-egrep the body.


    # How are they used?


    In practice, we use them for basic protection. Let''s say that we have an outbreak
    of viruses that come in the form of _scripts_. A simple way to avoid this virus
    is to mangle the extension so that Windows (poor, poor) cannot inspect the suspect
    file. Once the extension is mangled, the e-mail can be delivered to its rightful
    owner.


    +   A—This will not be executed unless the conditions on the immediately preceding
    recipe are met (or to ignore).


    Without the lockfile, it''s possible that the e-mail could be delivered (through
    another recipe) before the extension is mangled. With the lockfile, this won''t
    happen—unless the lockfile is properly written, in which case no lockfile can
    help you!


    +   D—The internal egrep to distinguish between uppercase and lowercase (contrary
    to the default, is to ignore).

    a—This has the same as the A flag, with the additional condition that the immediately
    preceding recipe must have been successfully completed before this recipe is executed.

    E—This executes only if the immediately preceding recipe was not executed. Execution
    of this recipe also allows immediately following recipes with the E flag. This
    allows you to specify else if actions.


    The fastest way to pinpoint whether a lockfile is needed or not is the trailing:
    :0 at the top of a recipe. There are other times when a lockfile is explicitly
    called and named by a name, such as _: vacation.lock. The advantage of, course,
    is efficiency. We''ll discuss lockfiles more as we go.


