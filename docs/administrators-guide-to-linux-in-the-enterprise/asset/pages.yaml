  md: 'steps to ensure data coherence. When a Linux machine shuts down, there are
    certain steps that must be taken. The first step is that all logged-in users (if
    it''s a single desktop machine, that''s you) are notified that the system is going
    down, and login is blocked. Next, all processes are first notified that the system
    is going down by the signal SIGTERM (signal termination). This gives programs
    a time to save the file being edited, and mail news processes a chance to exit
    cleanly. The shutdown command does its by joining the init process and ack changing
    the runlevel to 0. Runlevel 0 (configured in the /etc/initfile) is used to halt
    the system, and runlevel 1 is used to reboot the system into a state where administrative
    tasks can be performed.


    The format of the command is:

    /sbin/shutdown [-t sec] [-arkhncff] time


    In order to run the shutdown command, you must use a console (term, xterm, rxterm),
    or another (term, with the necessary flags and the time in which you would like
    shutdown to occur. For general there are two flags for shutdown: -r and -b. The
    -r flag tells the shutdown that you are rebooting the system, which will lead
    the machine through a shutdown/startup process. The -b flag tells the system that
    you are halting the system or, in more common terms, shutting down the system.


    wait. The word now is an alias for +0. So the command:

    shutdown -r 17:00


    will shut down your machine (if at 5:00 PM) and will broadcast a message to all
    users that the machine is going down at 17:00. When issuing shutdown to bring
    the system at a later time, it''s advisable to put the process in the background
    by adding [&] to the end of the command. By adding & to the command, you will
    still be able to use your machine (until the decided shutdown time). Now the command
    looks like:


    shutdown -r 17:00 &


    Once the shutdown command is issued, it is possible to cancel the process. Depending
    on whether the shutdown is in the foreground (&) or background (&), you can terminate
    shutdown by pressing [Ctrl]+C if the command is in the foreground and you have
    no prompt, or you type shutdown - if the command is in the background.


