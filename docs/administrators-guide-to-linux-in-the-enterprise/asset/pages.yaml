    taken the time to explore this little thing. If not—I''ll wait for you. To get
    the GHB, click the big button in the panel that has a "? in the cartoon balloon
    (which Linux developers—what a sense of humor they have). To the right of the
    GHB is the heart of configuring the GNOME desktop environment: the Control Center.
    (Assuming you''re using the out-of-box September GNOME that comes with Red Hat
    6.1. The later versions, Octoline and Helix, have more functionality.) This application
    enables you to control all of the desktop configurations, including background,
    screensaver, selector, window manager, keyboard bell, sound, CD properties, keyboard,
    mouse, startup programs, URL handlers, applications, and dialogues. If you want
    to play around a bit within this application, stick to the simpler aspects, such
    as background, screensaver, and theme selector. Like most other applications,
    the Control Center is all-point and very intuitive, so you won''t have any problems
    finding your way around. This is of special interest, it also lets you select
