  md: '# Finding a Linux solution


    Ed knew the company had a bunch of computers in a storage closet in the company
    parking garage, so he sent one of his staff members to the closet with instructions
    to pull out or six machines with the fastest processors and most memory. He said
    most of the machines in the closet had processors between 266 MHz and 400 MHz,
    with eight and 16 megs of RAM.


    Ed installed Red Hat Linux on five of the machines and then ran a little script
    on each machine to configure them with the appropriate IP address and other network
    settings for each VLAN.


    "I guest in at 10:00 A.M. on a Saturday, and by 1:00 P.M., we had the [Linux]
    servers up and running," Ed said. "It was straightforward, and it surprised our
    network administrator, who was a Windows guy."


    Ed said that being close to Seattle, and Microsoft''s headquarters in Redmond,
    there was a natural tendency to use Microsoft at all cost. Thus, when he deployed
    Linux servers, there were many expressions of gloom and doom from his coworkers
    in the IT department.


    "At our time, our DNS server running NT not go down once or twice a week," Ed
    said. "When I left the company, these servers had been running over three months
    straight. I put them in a closet, turned them off, and forgot about them"


    No one should have been surprised, he said. As a communications company doing
    telephone and telecommunications, the company was using a Linux box to gather
    data records of phone switches, process that data, and then feed that to AS/400
    we entered into the billing system. According to Ed, the company had been using
    that machine with success for about a year before this project came up.


    "Linux and the variants like BSD line themselves very well to doing things like—DNS
    services, DHCP services, print servers, file servers, sort of thing. They do it
    economically," he said


    When the updates to the switch firmware, the Linux servers were functioning


    well that Ed''s company didn''t bother with the patch.


    # A good solution gets better


    One concern with the operating systems for duty DHCP/DNS servers was that they
    potentially more likely to experience an equipment failure.


    To solve that problem, Ed wrote a script that would ping the machines every two
    minutes. If there were a change in operating state, the program would send him
    a notice to his cell phone.


    Ed turned one of 486 machines in the storage closet into a ping server. He figured
    that if his new ping server was checking, he would add all the routers and other
    servers to the ping list. This turned out to be fortuit for Ed. He believes he
    may saved his job couple months later.


    The company''s AS/400 was located in Seattle and connected to the Bellevue operations
    via a TI connection, with backup TI connections. His new ping server was constantly
    testing the router at the end of the TI in Bellevue and the router at the other
    end of the TI in Seattle. If either of these refused to respond to a ping, it
    would mean the connection, and all of its alternate connections, were down.


    One morning at 7:30 A.M., ping server sent him an email via cell phone that the
    TI was down. He caught someone in Seattle and were working to fix the problem
    by 8 A.M. By 9 A.M., the TI connection was restored. Without the working system,
    Ed would not have discovered the problem until he went into the office. At that
    point, the TI would have been down all morning while the fix was in progress.


    "I just think to note that there is only a place in corporate America for open
    systems that a company can save a significant amount of money and get a robust
    solution out of," Ed said. "You''d have to spend hundreds of dollars to get a
    solution that works"


    Administrator''s Guide to Linux in the Enterprise'
