    # Debugging/diagnostics with smclient

    The tools you use smclient enable the ability to help with debugging Samba connection
    (anything in all caps is a user-defined variable):


    +   - IP_ADDRESS—This broadcasts the address.


    +   - DEBUG_LEVEL—This shows how in depth your debugging information to be.


    +   - E—This sends messages to stderr instead of stdout.


    +   - IP_ADDRESS—This sets the IP address of the server to which you connect.


    +   - i_SCOPE—This sets a NetBIOS scope identifier.


    +   - LOG_FILE—This sets the logs to the user-defined file.


    +   - NetBIOS_NAME—This allows you to override the NetBIOS name the daemon will
    use to identify.


    +   - SOCKET_OPTIONS—This sets the TCP/IP socket options. This is often used only
    for performance tuning.


    +   - PORT_NUMBER—This sets the port number that the client will use to accept
    requests.


    +   - RESOLVE_ORDER—This sets the resolve name of the server.


    +   - CONFIGURATION_FILE—This declares the location of the Samba configuration
    file (smb.conf).


    +   - TERMINAL_CODE—This sets the terminal code for Asian languages.


    +   - USERNAME—This sets the username and can be used in conjunction with a password,
    for -Uusername@password.


    +   - WORKGROUP—This sets the group name which you want to connect to.


    The above list is pretty healthy and will get you through most issues with Samba.


