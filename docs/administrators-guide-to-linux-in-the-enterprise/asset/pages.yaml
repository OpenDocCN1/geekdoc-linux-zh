  md: 'With the 2.2 kernel, Linux''s most acute enterprise problems were in the SMP
    Although Linux 2.2 supported SMP up to four processors, the additional processes
    did not help Linux get anything faster, and the OS''s internal processors were
    clunky at best. Linux 2.2 was not optimized for SMP, a necessity for enterprise
    environments.


    In storage, the 2.4 kernel contains support for Logical Volume Management (LVM),
    which enables administrators to manage and make changes to storage while they
    are alive. This is very important in a 24/7 enterprise environment, and this feature
    has been a mainstay of UNIX-based operating systems.


    The 2.4 kernel has effectively removed this obstacle. Linux 2.4 is well optimized
    and tested on SMP machines with up to eight processors. There have been reports
    of development and deployment teams using the kernel on SMP machines with anywhere
    from 32 to 64 processors. Officially, the number of processors supported by Linux
    2.4 is enough, but for this we need testing.


    Another key in making Linux ready for the enterprise was addressing limitations
    in file size and users and groups. In Linux 2.2, file size was limited to 2 gigabytes,
    and the number of user and group objects was limited to 65,563. Linux 2.4 allows
    up to 1-terabyte files and to 4 billion per user and group objects.


    Another SMP-related Linux 2.4 improves support for multiple Advanced Programming
    Interrupt Controllers (APICs). These I/O controllers are used in SMP to reduce
    the load for processing requests among the various CPUs, thus for faster and better
    use of multiprocessing. Memory was another bottleneck. Enterprise servers, especially
    databases, require large amounts of RAM, and Linux 2.2 was limited to 2 gigabytes.
    With the 2.4 kernel, Linux now supports up to 64 GB.


    Additional 2.4 enhancements include faster I/O between the kernel and peripherals,
    support for NFS version 3 (which boasts increased performance and stability),
    support for Plug and Play cards, built-in Web daemon (kHTTP), which will increase
    performance in serving static web pages and will integrate with Apache, PPP support
    for DSL and ATM.


