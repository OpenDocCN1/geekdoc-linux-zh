    depending on installation options, these files will usually reside in the /conf
    subdirectory. For example, if you installed Apache with all defaults, the configuration
    files will be located in /etc/local/apache/


    # Working with the configuration files


    As many Linux-based programs, configuration for Apache is done through the placement
    of directives in plain text files. In this case, the files are known as httpd.conf,
    srm.conf, and access.conf. Their location and importance may differ by the particular
    installation, but the format remains the same. Through these files, you may choose
    where to serve your Web documents, what modules are dynamically loaded at start-up,
    and which port Apache will listen on.


    This means that you must use those files every time. The -command line allows
    you to load configuration from a user-defined file at run time. Also, preconfigured
    packages from distributions such as Red and Debian may install to different directories.
    Under the current version of Debian, the configuration files will be in /etc/.
    If you''re using Red Hat, you may want to check at /etc/httpd/conf.


    First, let''s look at the reasoning behind the three separate configuration files.
    This has an almost Holy Trinity-like mystique among community. They are basically
    a legacy of the NCSA 1.3 Web server and can be handled in different ways.


    If you''re running more than one version of Linux, you know that the directory
    structure and file locations can vary. In doubt, running locate httpd or locate
    apache with an updated database of files can be helpful in pinpointing the exact
    location.


    One option is to use httpd.conf as the server-wide configuration, srm.conf for
    controlling names, and access.conf for setting access control for the server.
    Another approach is to use only httpd.conf, which will support any directive that
    can be placed in either of the other two files. By placing the options AccessConf/dev/null
    and ResourceConfig/dev/null in httpd.conf, you can tell Apache to only look to
    it for its configuration.


    # Configuring the server


    Directives are entered into the configuration files one per line and are case-sensitive.
    A backslash at the end of the command can extend entries into multiple lines.
    If you are not sure that the directives are correct, Apache provides for some
