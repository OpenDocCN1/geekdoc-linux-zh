  md: 'Linux shells provide a command line where users may enter the names of commands
    and programs they wish to run. When a user enters a command, e.g., ls -al, or
    a program like ./install.sh, the shell creates a copy of it as a new process and
    replaces the new process with the command or process from the command line. In
    simple terms, the shell runs the command or program as another process.


    # Parent and child processes


    A parent process is any process that starts, or spawns, another process. A parent
    process controls all of its child processes. A child process is any process that
    is initiated by another process. A child process can also be spawned by its parent
    process. Let''s say you''re working in Windows System and you open an xterm (terminal
    emulator). From the xterm, you can run a command --name type to find all files
    in your directory. In example, the terminal window is the process of the command.
    If the window is closed, the command is killed. This is because the command was
    run as a child process of the term. Stopping a parent process automatically stops
    the child process, so when the window is closed, the command process stops running.


    # The ps command


    The ps command is used to produce a report of all processes running on a Linux
    system. If I run ps on my system, I get the following output:


    | PID TIME CMD |

    | 670 ps 00:00:00 bash |

    | 673 ps 00:00:00 ps |


    In this example, ps shows that I am running two processes: the shell and the ps
    process itself. The header at the top of the ps output defines the information
    being shown in each column. The output fields for the ps command are follows:


    +   - USER or UID—Process identification number

    - PID—Process utilization of the process

    - %MEM—Percentage of memory (in kilobytes) used by the process

    - SIZE—Size (in kilobytes) of virtual memory used by the process


    +   - RSS—Resident set size or size of real memory used by the process

    - TTY—Terminal (console) associated with the process

    - STAT—Current state of the process

    - START—Process start time date

    - TIME—Total CPU used by the process

    - CMD—Command being executed

    - NI—Nice priority number

    - PRI—Process ID (PID) of the parent process

    - WCHAN—Name of the kernel process where a process is sleeping

    - FLAGS—Numeric flag associated with the process


    # ps command arguments


    The ps command will accept a wide variety of command arguments. Some of the most
    common are:


    +   - a—Show processes belonging to all users

    e—Show environment variables after the command line

    F—Output in long format

    u—Show user name and process start time

    U—Show processes running by a specific user

    ww—Show process associated with a specific driver type


    +   - g—Show all processes belonging to a particular group

    T—Show all processes associated with a terminal

    t—Show all processes belonging to a terminal

    c—Show all processes associated with a specific command


    # Examples


    To find processes belonging to user Jane, the syntax is:


    ps u'
