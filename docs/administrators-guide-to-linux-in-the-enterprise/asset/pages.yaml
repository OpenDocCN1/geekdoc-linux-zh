  md: '# # The Squid-caching server


    By Vincent Danen


    any people have heard the term proxy server but do not know how it can benefit
    them. We''re all heard of firewalls, and we know the value of a good firewall.
    Some of you might even be using a firewall proxy to make life easier. For those
    of you who are unaware of what proxy server or firewall is, let me explain the
    concept.


    provides a cache for all clients, regardless of their number.


    One last thing to note about Squid is that it is a Web-only cache. This means
    it speaks only the HTTP protocol. It will not cache multimedia items as RealAudio,
    FTP, or anything other than HTTP. Squid can cache FTP requests if they''re made
    through HTTP. It also caches WWW and Gopher information, and of course, it can
    cache SSL transactions using the HTTPS protocol.


    A proxy server is a program that accepts requests from a client, such as a Web
    or FTP client, and forwards the request to the appropriate Internet server. It
    is transparent to the end user beyond the initial setup of the proxy. This method
    is often used when a number of computers sit physically behind another computer,
    which is in turn connected to the Internet. This configuration allows all of the
    computers simultaneous access to the Internet through one specific computer, typically
    the firewall or proxy server.


    To end, using Squid in conjunction with a regular proxy is imposed or encouraged.
    Squid''s benefits are itself and the fact that it caches data. Beyond this, it
    isn''t a replacement. If you use Squid, you should still use your regular proxy.


    Linux has a very unique, high-speed, and top-quality proxy server. Its name is
    Squid and like most applications using Linux, forming an amazing task for no monetary
    cost. However, beyond this, Squid is also a caching program and is referred to
    as a proxy-caching server.


    # ## Installing Squid


    So exactly does this mean, and how does Squid differ from other traditional proxy
    servers? Squid performs the same function as any proxy. It takes requests from
    clients and forwards them to the appropriate Internet server. It stores a copy
    of the returned data to an on-disk cache. This means that if the same data is
    requested multiple times, Squid returns the cache instead of initiating a connection
    to the Internet server. This is where Squid''s speed truly becomes visible. Think
    of it as similar to your browser cache. Netscape, Internet Explorer, and virtually
    every other browser is an on-disk cache as well, which they will refer to in event
    a Web site cannot be reached or if you recently visited it and the data hasn''t
    changed. Instead of using a cache only for one client program, Squid


    can be installed in two ways. You can compile or install the RPM or DEB package
    for your particular distribution. You should run Squid as an unprivileged user,
    meaning that it never runs solely as root. Many people choose to run Squid as
    the user with the group; however, it is highly recommended that you run Squid
    as its own user and group, meaning that it should run as user group and Squid
    group. The choice, of course, is up to you.


    The first thing you need to do is download the source code for Squid or the RPM
    or DEB package. If use RPM, you may need to do nothing more than running

    rpm -1vh squid-2.3.ABLE2-3mdk.


    on a Linux Madrid 7.2. The version and releases may differ, depending on your
    distribution. The latest version of Squid is 2.3 STABLE4. The latest development
    is 2.4 DEVELOP2. Unless you have a pressing desire to install development software,
    you should download the latest version. Connect to the Squid Web site at


