    NFS assumes that there is no big deal; if a user has logged on to one of the networked
    systems and supplied the correct username and password, this system becomes a
    trusted client. If you logged onto a client system as root, you could log onto
    the server as root—and of course, you would do anything malicious,


    # Transition


    Part of the problem with Linux implementations of NFS is the fact that Linux users
    are going through a transition. Since Linux version 2.2, NFS has been directly
    supported in the kernel. That also means that all NFS utilities need to be updated
    with the kernel changes and so does the documentation. The result, predictably,
    buggy software and out-of-date documentation. Perhaps you''ve been lucky and gotten
    NFS working without too much trouble, but many Linux users complain that they
