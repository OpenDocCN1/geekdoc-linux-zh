  md: 'advice: Here at TechRepublic, my network login name is walleng. I use that
    as my Linux login name, which makes using such tools as smbmount, pine, and ssh
    must change.


    The next bit of information you may find critical is Full Name. Why, you ask,
    might Full Name be critical? Within a large organization, you might have any number
    of employees logged on to a system. As an administrator, you might not remember
    what name is associated with a particular user. (Perhaps your users aren''t using
    their network names as their Linux names). In order to find a login name, you
    could simply find the user@domain and discover the full name—simple and quick
    information gathering.


    The last bit of information you will enter into the user account creation window
    (see Figure C) is under the Params tab (see Figure D).


    You can configure a user password to expire on the Params tab. This is often a
    good way to make users change their passwords every so. As you can see in Figure
    D, the default is to set the user change the password after 99999 days. Since
    it''s highly likely users will be using their Linux name after 276.24 years, you
    can configure this section however you like, but remember that you dealing in
    days.


    Within this window, you can set a user account to expire after a number of days
    as well. This can be useful when you need to create a temporary user account.
    By setting the account to expire after a number of days, you can ensure that you
    won''t have stray accounts lingering for inactivity. If you configure an account
    to expire after a given date, you can use the Warn # Before Expiration feature
    on this window to show a warning before the account expires.


    # Group definitions


