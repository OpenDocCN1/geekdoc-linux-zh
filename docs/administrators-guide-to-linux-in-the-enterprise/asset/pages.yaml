  md: 'The smbcommand has the following structure:


    ```

    smb service mountpoint

    [ -o options ]

    but it can run as simply as

    smbount //shared/drive /mountpoint

    ```


    As you can see, we''re already wildly waiting at many of the steps to make viewing
    the SMB neighborhood as easy as possible. Just wait—you''ll be shocked at how
    easy it is!


    # smount


    Take a look at the smbcommand and see what it has to offer. The smbcommand, like
    all good Linux commands, has a few options to pass the command. The biggest difference
    in these options is that they are passed as a comma-separated list of key-value
    pairs. The possible options are shown here:


    +   - username=<arg>This specifies the username with which to connect. If it is
    not given, the environment variable USER is used. This option can also take the
    form user=<password> or workgroup=<password> to pass the password and workgroup
    to be specified as part of the username.

    - password=<arg>This specifies the SMB password. If not given, then smbount will
    prompt for a password (unless the user is given).

    - netname=<arg>This sets the source NetBIOS name. It defaults to the local hostname.

    - uid=<arg>This argument sets the user id that files will be mounted as. It may
    be specified as either a username or a numeric uid.

    - gid=<arg>This option sets the group id that files will be mounted as. It may
    be specified as either a groupname or a numeric gid.

    - port=<arg>This sets the SMB port number. The default port number is 139.

    - fmask=<arg>This option sets the file mask. It determines the permissions that
    the mask


    remote files have in the local filesystem.

    The default is based on the current umask.


    +   - dmask=<arg>This sets the directory mask. It determines the permissions that
    remote directories have in the local filesystem. The default is based on the current
    umask.

    - debug=<arg>This argument sets the debug level. This is useful for tracking down
    SMB connections.

    - host=<arg>This option sets the destination host or IP address.

    - workgroup=<arg>This sets the workgroup on the destination.

    - socket=<arg>This sets the TCP socket options. See the smbconf socket option.

    - scope=<arg>This argument sets the SMB BIOS scope.

    - guest—This doesn''t prompt for a password.

    - ro—This means as read-only.

    - rw—This means as read-write.


    This is quite a list of arguments. In situations which you''ll need to pass a
    few of the above to Samba. For example, you might need to mount a Windows machine
    from the network under Linux machine. To do this, you''ll need to pass both the
    username and argument (of course, if the argument=, you need to supply with your
    username and password).


    You want to allow a user to mount a Windows share with read only (a share that
    would normally both read and write permissions). To do this, you would need your
    coworker''s machine, passing the ro argument. Granted, you could achieve this
    with the smbconf file; however, there are times when you want to allow someone
    to access to a share which you not normally allow access. Because of this, you''ll
    have the flexibility in Samba.


