    For the next step, you''ll need to know the exact name of the share you want to
    mount. To do so, type smbclient -L followed by two slashes and the name of the
    computer that contains your Windows share (such as //lotharrien/suzanne). You''ll
    be asked to supply your password.


    When you''ve done so successfully, you''ll see a list of the available shares.
    From this list, identify the share you want to mount, such as //lotharrien/suzanne.


    Before you can mount the Windows shares on your Linux system, you''ll need to
    create a


    mount directory. It''s convenient to place this directory within your home directory,
    where it''s easily accessible.


    To create the mount directory, log off the superuser account (type exit and press
    [Enter]). In your home directory, create a directory you''ll use to mount the
    share. To create /home/suzanne/lotharrien, for example, type mkdir /home/suzanne/mervfield
    and press [Enter].


    Now that you''ve created the mount directory, you can use smbount to mount your
    share to this directory. To do, log in to your ordinary account and open a terminal
    window.


    Smbount followed by the share''s name (such as //lotharrien/suzanne) and the name
    of the mount point (such as //suzanne/lotharrien), and press [Enter]. Note that
    the mount point—must exist in order command to succeed. Here''s an example: smbount
    //lotharrien/suzanne //suzanne/lotharrien


    You''ll be prompted to supply this user''s password. If you''d like to mount the
    share, just type smbmount followed by the name of the mount point (for example,
    smbmount //home/suzanne/lotharrien). Like to mount this automatically every time
    you log in? Just add the smbount command to your home directory.


