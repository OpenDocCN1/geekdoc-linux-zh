    # # The ins and outs of DHCP


    The Dynamic Host Configuration Protocol

    DHCP is nothing new to many Linux users.

    Most people have a DHCP client installed on

    the computers they can connect to the

    Internet via cable or DSL modems. This

    allows them to have a dynamically assigned IP

    every time they connect to their ISP,

    just by booting the system if they have

    dedicated cable or DSL connection. This is

    a easy for ways to put out semi-permanent IP addresses to clients without giving

    every a real static IP address. In fact,

    y you leave your computer most of the time,

    you may end up with the same IP address for

    very long time since it works on an IP address

    lease/renewal.


    DHCP was designed to provide all possible

    TCP/IP configuration parameters to client

    computers using the client/server model.

