  md: 'to see the /usr/shm/named file exists (it''s the named executable). On Red
    Hat systems or other distributions use RPM (Red Hat Package Manager) technology,
    you can run the following line:


    ```

    rpm -q bind

    ```


    If this package isn''t installed, you will be able to obtain it from the distribution
    vendor, a mirror site, or your installation CD-ROM. Once you''ve installed BIND,
    you''re ready to begin up your new DNS server. For this article, I will install
    and configure BIND on a Linux Mandrake 7.0 computer for the fictional domain xyz.com.


    # SOA resource records


    The first step in setting up the DNS server for xyz.com is to edit a database
    file for the SOA (Start of Zone) resource record. The SOA resource records are
    records of the server; they provide the information that needed to resolve domain
    names to IP addresses. These files are typically stored in /var/named directory,
    but you can name them anything want. For example, I''ll name my SOA file /var/named/xyz.com


    The SOA resource records require a number of fields, of which I will explain.
    You can include comments in the resource file by typing a semicolon (;) before
    the comment. Comments will help you understand what you did and everything it
    means in order to refer to them later. You should write comments in the file as
    you wish. The resulting file will look like this:


    ```

    @INSOA.xyz.com root.titan.xyz.com

    200031601 ; serial number

    7200 ; refresh (2)

    3600 ; retry (1)

    151200 ; expire (1 week)

    86400 ; default TTL

    ```


    This is the beginning of our SOA resource file. The first line gives us few pieces
    of information for the SOA record. The @char represents the domain name for this
    zone. (Later, you''ll see how it gets translated.) The IN statement stands for
    Internet, and SOA tells us that we''re defining the SOA for our domain (xyz.com).
    The first domain name


    after SOA the primary name server for this domain (ns.xyz.com) and the administrative
    e-mail address (root@titan.xyz.com). Note that the e-mail uses a period instead
    of @char in the SOA record, make sure you format the e-mail address correctly.
    After the administrative e-mail address, opening parenthesis to include the following
    parameters:


    The next lines indicate parameters for the server. The first is the serial number.
    Some people use one or two digits for the serial number, but I prefer to use the
    date and a revision number. The actual number translates into "03/16/2000-revision
    01." Every time you change the resource record, you will need to increase the
    serial number so secondary servers will know that they have to perform a zone
    transfer. If the secondary server cannot transfer, your changes will take effect.


    The second number is the refresh rate in seconds they query the primary server
    to see if the records have been updated at. The third number is the retry rate
    in seconds. If the secondary server tries to connect the primary DNS server for
    updates and it can''t it, the secondary server will try again after the number
    of seconds you''ve defined here.


