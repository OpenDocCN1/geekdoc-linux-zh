    DHCP and DNS information to the new VLANs. (Bay Networks is now known by Nortel).


    The network administrator who came with the bad news recommended buying five Windows
    NT Servers to perform the DHCP/DNS server duties. "I know my boss wouldn''t want
    to spend $35,000 to make this work. To make the situation work, it was a temporary
