  md: '# # "Smart" relay host (may be null)

    ssmtp.myisp.com


    An interesting feature allows relying based on the MX records of the host portion
    of an incoming address. If this is enabled, another domain can add you as an MX
    record in its DNS setup and relay its mail through your system, with no prior
    arrangement with you. Consequently, use caching in this feature.


    Similarly, the feature


    ```

    FEATURE(''relay_local_from'')

    ```


    allows spammers to relay through your system by simply returning a path, which
    is local domain. Again, caution is advised. You can control this by using


    ```

    FEATURE(''relay_mail_from'')

    ```


    This allows if the sender is listed as RELAY in the access map.


    If you''ve set up your Linux box with a made-up domain and tried to send Internet
    mail back at you, you might encounter a system that had not enabled the following
    feature:


    ```

    FEATURE(''unresolvable_domains'')

    ```


    Your fake mysmessagingmachine.house domain name is not resolvable out the greater
    Internet''s DNS, so whatever server received the message refused to accept it.
    By default, sendmail catches this feature.


    If you want to fine-tune control of which domains (and even users) you will accept
    mail from, use:


    ```

    FEATURE(''access_db'',

    #hash /etc/mail/access'')

    ```


    You can specify a second parameter with the name of the access file; dont you''ll
    need to use makedmap again to create a database from the text file. You can specify
    domains or individuals on the left-hand


    # Listing C: Using a "blacklist"


    ```

    ERROR:550 Mailbox disabled for this user

    ```


    localmailabuser


    Many ISP''s use now:


    ```

    HACK(''.popauth'')

    ```


    side of the file, with REJECT, OK, RELAY, or various ERROR messages on the right-hand:


    ```

    spammer@yahoo.com      REJECT

    ciberspam@cyber.com     REJECT

    mybody@cyber.com        OK

    ```


    You can also set up "blacklist" for your systems and users, using


    ```

    FEATURE(''blacklist_recipients'')

    ```


    Again, this is a tabular list and can have users and domains (using C), which
    clients to check their incoming mail on the POP server before they send outgoing
    mail through the Simple Mail Transfer Protocol (SMTP) server.


    Since many clients can act in this manner, special is required of the user, and
    only users with authorized can relay mail through the server.


    That covers most of the common concerns on what will pass through your server.
    There are others, and the sendmail site shows them at www.sendmail.org.


    # Running in test mode


    Another interesting you can run sendmail is in test mode, which allows you to
    check your aliases and rewriting rules. You can do this by running sendmail with
    the -bv or -bt switches.


    Say you have the following alias, with two administrators that receive root''s
    mail, as well as an alias list of users called "management


    root           stew      Dianne

    management   stew      Fred. Justin


    ```

    [sendbook mail]$ /usr/sbin/

    sendmail -bv root

    dianne... User unknown

    stew... deliverable: mailer, local user stew

    ```


