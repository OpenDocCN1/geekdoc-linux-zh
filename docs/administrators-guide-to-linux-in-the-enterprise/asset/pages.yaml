  md: '+   FTP (File Transfer Protocol): This protocol allows the transfer of files
    across a network. FTP is not secure because it sends and receives unencrypted,
    plain-text passwords.


    +   Telnet: This protocol allows users to remotely log in to another machine.
    Like FTP, it is not secure.


    Finally, there are the gateway-services:


    +   EGP (External Gateway Protocol): This protocol governs the transfer of information
    for external networks.


    +   GGP (Gateway-to-Gateway Protocol): This protocol handles the routing of information
    between gateways.


    +   IGP (Internal Gateway Protocol): This protocol handles the routing of information
    for internal networks.


    When Linux starts network services, the inet superserver activates Internet tools
    and services that make life a lot easier for you. The inet superserver is a daemon
    that activates others via the /etc/inetd.conf file. This file is in Listing A.


    # What is the inet daemon?


    A bit of explanation about how this file is put together in order: <proto> refers
    to transport protocol; <args> is the command line you give startup; <flags> refer
    to options.


    You should use a flag if the service is single-threaded; this means that the service
    will read all the dramas that come at a specific time and wait for more. If none
    arrive, the service will time out. Examples are like concat. You should use a
    now flag for services that run continuously.


    The inet superserver is a script. When you boot your computer, it calls this script.
    The script from the Red Hat 6.1 is shown in Listing B.


    If networking is possible, then inet needs to start the start option and executes
    /usr/sbin/inetd via /etc/inetd.conf.


    # What are the most common services?


    The /etc service file lists all the Internet and networking services available
    to Linux. A particular listing of this file is shown in Listing C.


    These are the services available to Linux. The first column represents the service.
    The second column represents <port><protocol>; <protocol> is either tcp or udp.
    The third column represents alternative service names. The ports listed are common
    ones.


    # Configuring the kernel and hardware


    Now I will show you how to configure the Linux kernel for networking. I am basing
    the kernel


    > NOTE

    The inet superserver is no longer used in the Red Hat 7.0 release. The latest
    versions of many other Linux distributions, however, still use this system.


