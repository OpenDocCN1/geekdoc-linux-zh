  md: '# Adding a second drive in Linux


    By Jack Wallen, Jr.


    I''ve now had the pleasure of installing a second drive in my Linux machine. To
    be exact, I installed my old drive into a new system as a secondary drive. The
    new system was from PuppyLinux and contained a single drive with plenty for more.
    I was thinking it was going to be an arduous experiment, but it turned out to
    be as simple as plugging and playing.


    which clearly indicated the old Western Digital existed (within Linux) as /dev/hdd.


    With this information, I was halfway home! The next step was to create a location
    to mount the drive. Since this machine was a single user machine, I decided to
    mount the drive on a newly created directory in /home/jallen xander. The command
    to create this directory is follows:


    Let me show how I managed to pull this off.


    ```

    mkdir /home/jallen/xander

    ```


    With the new directory, it was time to mount the drive.


    # The specifics


    As mentioned, the new machine was from PuppyLinux and already contained one removable
    drive. I decided to add a second removable drive to make the machine as flexible
    as possible.


    Mounting of this type needs to be done by the root user. Once you have root access,
    you can issue a command to


    ```

    mount -t ext2 /dev/hdd1 /home/jallenxander

    ```


    The current drive in the Puppy machine was a UDMA 100-20 GB drive, booting Red
    Hat 7 and Windows Me. The old drive was an Western Digital 6-GB drive that already
    had a working Red Hat 6.2 installation. I was concerned that installing a second
    drive with an already configured OS would completely bring the system down. Thanks
    to Linux, I was wrong.


    and the newly installed drive may not mount. In my case, I had a couple of issues
    with which I had to deal. The first was that the drive had been mounted uncleanly
    and needed a check. To check this, I unmounted the drive


    ```

    umount /home/jallen/xander

    ```


    ran fsk with


    ```

    fsck /dev/hdd1

    ```


    and found that there were, some corrupt inodes. Fortunately, fsk fixed those issues,
    and I attempted to remount the drive. With the command


    ```

    mount -t ext2 /dev/hdd1 /home/jallenxander

    ```


    the drive mounted without failing.


    # The BIOS


    After the hardware installation was complete, the first thing to do was with the
    BIOS. Because the primary drive used the UDMA controller, I had to make sure IDE
    controller for the newly installed drive was disabled. Once that taken care of,
    the boot process went as usual.


    # Cleaning it up


    Okay, so I had the ability to mount the Western Digital drive. However, running
    every command after boot (and remounting to reboot a necessary) is not as simple
    as a best-case scenario. To make this I first needed the command and put it into
