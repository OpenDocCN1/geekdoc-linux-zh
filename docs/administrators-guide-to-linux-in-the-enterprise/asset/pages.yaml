  md: 'can transform the lives of people with disabilities, enabling them to contribute—and
    often to become stellar employees—in ways that would not have been imaginable
    a generation ago. We''re not talking about small numbers here. More than 30 million
    Americans with disabilities could be negatively impacted by poor computer software
    or system design. At a time when people are struggling to find competent employees
    in a tight labor market, it makes sense to hire people with disabilities and give
    them the support they need. It''s not only the right thing to do; it''s the smart
    thing to do.


    Often, the problem lies in thoughtless design, such as a program that provides
    key information by means of a beep but without any visual signal. For a person
    with limited hearing, this fundamental design error—one that is too common—could
    result in lost time and frustration.


    When it comes to accessibility, thoughtful-counts, only if it''s implemented throughout
    the system or program''s design. For many people with limited vision use screen-reading
    programs to navigate the maze of GUI applications. Often, they cannot see well
    to click on an icon with mouse, so they''re limited to keyboard navigation techniques.
    But too many applications cannot


    It''s also the law. In the United States, the 10-year-old Americans with Disabilities
    Act (ADA), companies with more than 15 employees must be prepared to make accommodations
    for the needs of employees and customers with disabilities. Such accommodations
    include providing accessible computer systems and assistive technologies, such
    as text-to-speech readers, and the cost of providing such accommodations is not
    prohibitively high. Companies that refuse to make reasonable accommodations run
    the risk of a lawsuit. For example, the National Federation of the blind customers
    filed a lawsuit against Mellon Bank last year, alleging that the bank''s ATMs
    do not include voice guidance features that are available in the market. As a
    result, visually impaired Mellon customers must depend on friends or colleagues
    to accompany them to an ATM. Although the ATMs are equipped with Braille-labeled
    keyboards, these labels are static and do not explain the prompts on the computer
    screen.


    Poorly designed computers may contain traps, dead ends, inconveniences, or stumbling
    blocks that, for a person with limited vision or dexterity, transform the computing
    experience into a nightmare.


    # What does accessibility mean?


    For disabilities, computers represent a double-edged sword. On the one hand, they''re
    often the key to attaining and productive membership in society. But poorly designed
    computer systems and software may contain traps, dead ends, inconveniences, or
    stumbling blocks, for a person with limited vision or dexterity, transform the
    computing experience into a nightmare.


    thoughtless traps, situations where the user cannot proceed without using the
    mouse. All too often, users find themselves at the end of a long series of dialog
    boxes with a lot of unsaved work in the application''s window, and the result
    may be hours of effort lost.


    If you''d like to experience this sense of frustration for yourself, just open
    a GNOME or KDE application and see how far you get with the keyboard. With KMail,
    for example, you''ll be stopped pretty quickly; you can find no documented method
    for switching to the inbox if it''s not already open. Does not mean to call out
    KMail here; it certainly isn''t alone, but it''s sufficient to make your point:
    The application could have been designed more thoughtfully, and so would have
    meant a user with limited vision might have been able to use the program quite
    happily. The National Federation of the blind made a similar point recently launching
    a lawsuit against America Online. AOL''s proprietary software prevents users from
    going online unless they''re able to locate and click unlabelled graphics—a deficiency


