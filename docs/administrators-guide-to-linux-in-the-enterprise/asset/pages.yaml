  md: '# Down to business


    Now you''re ready to tackle Samba itself. Most configuration activities in Linux,
    Samba is configured with a text file, smb.conf, in the /etc directory. However,
    before you begin this file to meet your needs, let''s make a copy of it. Issue
    the following command:


    ```

    cd /cp smb.conf /usr/doc/samba-2.x

    ```


    Replace x with your version of Samba.

    The second command above copied your smb.conf file into the directory that contains
    the documentation files included with Samba.

    Now you can dig into smb.conf, use a text editor to edit the file by using the
    following command:


    ```

    pico smb.conf

    ```


    For this article, I''ll use the text editor for the examples and feel it is the
    best for beginners; however, you can use any text editor for these tasks.

    Once opening smb.conf you''ll notice plenty of types of lines in the file. The
    lines with a # preceding them them comments on the configuration options. Lines
    that are marked by a semicolon (;) have been "turned off". Both symbols do the
    same thing: They keep the information that follows them from being parsed for
    configuration.


    To simplify the Samba configuration and smb.conf easier to work with, use your
    text editor to delete all the lines that have a #. In pico, you can do this by
    using the arrows to place the cursor at the beginning of the line and pressing
    [Ctrl+K] to delete the entire line. Do this for each of the commented lines in
    smb.conf. If you want to go back and refer to these comments, you can look at
    the copy of smb.conf that we copied to /usr/doc/samba-2.directory.


    # Optimizing Samba for Linux-NT integration


    Now you''ve opened the smb.conf file, you''ll notice numerous bracketed fields
    such as [global] and [printers] and lines such as workgroup = MYDOMAIN-UNDERneath.
    The bracket fields represent share and printer names,


    with a few exceptions, the variable = lines are the configuration options for
    those shares and printers.


    The crux of a Samba configuration centers on properly setting the [global] variables.
    While other bracketed fields refer to one share, this one manages the settings
    that govern all shares. It can be quite intimidating at first because of the number
    of variables; however, I will walk you through the most important variables, and
    delete the nonessential ones.


    The following is an example of a file with [global] settings that are optimized
    for integration of a Linux Samba server in Windows NT:


    ```

    [global]

    security = domain

    password server = NTServer,NTServer2\workgroup = AAC

    netbios name = LINUX

    server string = Samba

    wins = 10.1.10.5

    dns proxy = no

    name resolve order = winshosts bcast

    ```


    ```

    encrypt passwords = yes

    log file = /var/log/samba/log.%m

    max log size = 50.100

    ```


    ```

    remote announce = 10.1.20.255

    remote bounce sync = 10.1.20.255

    ```


    ```

    socket options = TCP NODELAY

    SO_RCBUF=8192 SO_SNDBUF=8192

    printcap name = /etc/printcap

    ```


    printers = yes

    All of the settings listed above, the most important is security = domain. This
    setting tells Samba how to authenticate users. There are four available options:


    +   * user

    * share


