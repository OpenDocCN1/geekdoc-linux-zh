  md: '# # Is Linux a cost-effective enterprise solution?


    By V. Edward Gold


    Linux is rapidly growing in popularity, but it is ready to handle the demands
    of a business enterprise system? Such a system must support e-mail transport and
    delivery, file sharing, printer/device sharing, firewall and gateway functions,
    and remote access capabilities. If a business was to migrate to Linux, users would
    still be able to perform basic word processing tasks, spreadsheets, access databases,
    manage information, and create fancy presentations? In this article, I will present
    my argument for why Linux is best to host your enterprise system.


    I will illustrate how Linux frees the user dependency from any software vendor
    and how Linux meets all the business''s needs. I will show how Linux offers capabilities
    beyond those that the typical user has to expect from his or her system.


    Not do I believe that Linux is more than capable of offering all these benefits,
    I also believe it will become one of the most cost-effective approaches. Microsoft
    has announced its intention to change its current ownership paradigm rather than
    out it. In the near future, Microsoft plans to sell customers a software license
    that will work for a fixed period, after which the customer will have to pay again.
    (Of course, if you take into consideration how many most enterprises upgrade their
    operating systems, you might see that having to review a regular license is virtually
    in effect.)


    # ## Linux: a "free" choice


    Linux possesses a number of features that make it a very desirable OS. First,
    it''s freely available, with source code. This ensures that if it doesn''t perfectly
    meet your requirements, you can find someone who will be able to modify the code
    to meet your needs! That''s a huge bonus that is not just a proprietary operating
    system. Second, once you own Linux, it''s yours for-


    ever. As other users discover improvements, they will make those improvements
    available freely, so there is no recurring cost.


    # ## Feature-by-feature comparison


    Let''s examine each feature that an enterprise system must possess.


    # ## File sharing


    Perhaps the most important feature of a networked system is its ability to share
    resources. A typical enterprise system must be able to share files and printers.
    Linux and UNIX, in general, will give you more in the way of resource sharing.
    Linux offers Network File System (NFS) to share files between computers. Using
    this functionality, a directory on any computer can be exported to any other computer
    within the enterprise system. Any authorized client can import the shared directory
    and map it to any location within the directory structure of the client computer.


    # ## NFS


    NFS under Linux is somewhat more flexible than file sharing in Windows. NFS allows
    the user to optimize performance for the user''s specific use. In general, UNIX/Linux
    allows the user to format disks optimally for the specific use. You can specify
    the block size and drive pointers to peak performance. You might prefer a larger
    block size if you were going to be manipulating large data sets. This would also
    allow you to read larger chunks of data in one transfer.


    The parameters can be adjusted for NFS transfers. Block sizes, priorities, and
    the number of processes dedicated to performing NFS data transfers can all be
    adjusted in Linux.


    # ## Other forms of file sharing


    Of course, Linux offers a number of ways to share files as well. The old reliable
    FTP can be used to share files, though this is fairly cumbersome. Linux also supports
    a remote copy or np, which allows you to copy files from one machine to another.
    This command has the following syntax:


    ![](img/18a4efcf5db19984d10d986ab04de74b_15_0.png)


    Administrator''s Guide to Linux in the Enterprise'
  merge: -1
  pgno: 15
