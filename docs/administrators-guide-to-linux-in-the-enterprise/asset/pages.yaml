  md: '# Setting up a secure ftp server with ProFTPD


    By Vincent Danen


    ne of the most important services available on the Internet today—with the exception
    of Web serving—is the ability to exchange files via File Transfer Protocol (FTP),
    FTP sites are a cornerstone of the Internet, and no one can dispute that. Because
    of the popularity of FTP, a number of FTP server packages have been released for
    a variety of platforms. In the Linux world, the most popular of these FTP servers
    is the wu-ftpd.


    figurable, nonprivileged user in standalone mode in order to decrease the chance
    of attacks might exploit its root capabilities (like Apache running as nobody).
    It provides multiple forms of logging with the wu-ftpd logging standard, and it
    provides extended paranoid logging. It also supports full password shadowing,
    including support for expired accounts.


    While wu-ftpd is a good product and provides excellent performance, it lacks a
    number of features in newer products. It has a poor security felt that the only
    way to get wu-ftpd up to spec was to completely redesign it from the ground up.
    It was at this time that a new server, ProFTPD, was born. In this article, Unlike
    FTP servers, ProFTPD is designed to be lightweight, secure, and configurable.
    (If you''re familiar with Apache, you should have no trouble adapting the configuration
    for ProFTPD using a simple syntax.) Other FTP servers may provide an extremely
    secure setup at the expense of flexibility. ProFTPD doesn''t do it. It provides
    an extremely fast FTP service, with a high level of configurability and security.
    Frankly, ProFTPD offers some features that I''ll quickly outline


    # Installing ProFTPD


    The first thing you do is install ProFTPD. ProFTPD is a full server, it conflicts
    with wu-ftpd and you must first remove wu-ftpd from your system. To do this on
    a Linux Mandrake or any other RPM-based system, use the


    ```

    rpm -e anftpd

    rpm -e wu-ftpd

    ```


    The annuity provides anonymous FTP services for wu-ftpd and must be removed first
    because it depends on the wu-ftpd package. Finally, you remove wu-ftpd itself.


    At this point, you can install ProFTPD. Some distributions provide a packaged
    version of ProFTPD, usually via user contributions. If your distribution does
    this, it would be easiest to install the ProFTPD RPM. If that''s not possible,
    you''ll have to download the source code from the ProFTPD site at www.proftpd.org
    and compile it yourself. To download and compile the latest tarball from the downloads
    of the Web site (216.24.5.22)


    # Features


    ProFTPD features per-directory access control similar to Apache''s access files.
    ProFTPD makes it simple to configure multiple FTP servers and anonymous access.
    It can run either as a standalone or from inetd, depending on your needs. The
    FTP service it provides does not need a specific directory structure or other
    system files like the annuity package for wu-ftpd if you don''t want it. ProFTPD
    allows for hidden directories and files based on user/group ownership and UNIX-style
    permissions. It can run as a


    ```

    /--configure-prefix=/usr

    --localstatedir=/var/run/ \

    ```


