    and so forth. You may use a group limit (like <Limit>) or a specific command limit.


    The precedence of <Limit> directives is defined by which one comes first. The
    configuration file is basically read top to bottom, so the first <Limit> directive
    will control all the servers unless <Limit> directives are used within <Directory>
