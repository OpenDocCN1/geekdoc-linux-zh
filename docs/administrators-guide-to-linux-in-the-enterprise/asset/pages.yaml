  md: 'that could have been easily remedied by means of a keyboard shortcut.


    As the above example indicates, creating accessible software does not require
    all that effort, but it does require thoughtfulness and knowledge of the challenges
    faced by users with disabilities. The following guidelines specify the basic principles
    of accessible software design:


    +   - Allow users to customize screen display size, foreground and background
    colors, and selection colors to their needs. Ensure that all information conveyed
    with color is also available without color.


    +   - Implement a high-contrast option without requiring the user to alter a document
    or run specially designed software.


    +   - Provide well-documented keyboard access to all features and thoroughly test
    keyboard controls to make sure that a user with limited vision not become trapped
    or run into unintended consequences while attempting to navigate the application
    using only the keyboard. There''s a need for keyboard-standards that are uniformly
    applied and utilized both at the desktop environment and application levels; consistency
    is an important element of software accessibility.


    +   - Provide notification of the focus location in a way that is not too subtle
    for people with limited vision.


    +   - Provide visual as auditory information; don''t convey information by sound
    alone.


    In summary, an accessible program is designed with the needs of people with limited
    vision, hearing, and dexterity in mind. Perhaps most important, it is extensively
    designed and tested so that it can be successfully navigated using only the mouse
    or the keyboard. It''s worth noting that this design imperative creates value
    for users who do not have impaired vision or dexterity; many people hate the mouse
    and prefer to navigate their applications by means of the keyboard.


    Accessible software alone can''t fully address the needs of people with more serious
    vision


    or dexterity limitations. These disabilities call for assistive technologies,
    such as text-to-speech readers, which are not part of the computer operating system
    or software environment. However, assistive technologies work best with software
    designed with accessibility in mind. A text-to-speech reader won''t help a user
    who is blind blind if the program leads the user to a dialog box, from which the
    only escape is assistance from a sighted user who can locate the correct icon
    to click.


    # Accessibility in the Linux environment


    In every other desktop computing, Microsoft has a lead in the accessibility department.
    Thanks to the efforts of Greg Lowry and other employees who internally championed
    the accessibility cause, Microsoft has implemented a set of accessibility guidelines
    for software design that meet all of the accessibility criteria mentioned. What''s
    more, Microsoft''s Windows programs require independent software vendors to meet
    their accessibility standards. As the platform for employers who want to do the
    right thing for their employees—and reduce the risk of lawsuits in process—the
    Gmail example makes clear, the current crop of Windows desktop environments falls
    behind Microsoft''s accessibility standards.


    But that does not mean Linux is out of the running in the accessibility sweepstakes.
    With a bit of conscious-raising, we can bring GNOME and KDE up to the minimum
    accessibility standards found in Windows—it''s easy. But there''s a deeper point
    here, and it is why Linux is in a superior computing environment when it comes
    to accessibility concerns: Microsoft has improved the accessibility of Windows
    and Windows applications, but by far the best computing environment for people
    with disabilities combines a fully developed text-only environment with a highly
