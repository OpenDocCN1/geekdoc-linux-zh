  md: '# Casting Spells With Absolute Paths


    During your tour of the Tower, you saw a lot of spells in the /bin, /usr/bin,
    and maybe even the /usr/local/bin directories -- but how do you cast them? Up
    until now, you''ve just been typing in a spell name hitting and it magically works.
    Now you''ll learn how to cast any of the spells in any directory.


    First, try casting this:


    ```

    joe$ ls -l //

    Casting Is

    ```


    You''ve cast similar things before. Nothing new here. But how about this:


    ```

    joe$ /bin/ls -l //

    Casting Is with an Absolute Path

    ```


    It did the same thing! Except we used an absolute path with ls. How does that
    work? With some-thing called the Path Variable.


    A variable is something that holds information. It''s called a variable because
    it can hold water along with almost anything else -- it''s not stuck to one thing.


    The Path Variable is a special variable that holds some paths for us. We can see
    what paths are stored in the Path Variable like this:


    ```

    joe$ echo $PATH

    /bin:/sbin:/usr/bin/sbin

    Viewing the Path Variable

    ```


    echo is a simple command that prints things out for us. Variables always start
    with a $ -- that''s the way we know $PATH is a variable. Don''t get this confused
    with the one in the prompt, though.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'What echo returned kind of confusing at first. But if you break it up by the
    colon (:), it looks a little familiar.


    ```

    /bin /sbin /usr/bin /usr/sbin

    ```


    Notice something? They''re paths! The Path Variable stores paths with colons between
    them. Yeah, I know, big deal -- but here''s where it comes together. Whenever
    you cast a spell, the Path Variable will go through it''s list of Paths and see
    if the spell is inside that directory. So when you cast ls, it kind of looks like
    this:


    ```

    joe$ ls

    hmm.. is that /bin/ls? Yep! I''ll use /bin/ls and you won''t notice

    ```


    That was a simple example. Here''s something more involved. There is a spell cal
    that will print a new calendar to your screen (go on, try it, you know you want
    to!). Here''s what happens now:


    ```

    joe$ cal

    hmm.. is that /bin/cal? No. no cal there.

    what about /sbin/cal? Nope. not there, either.

    /usr/bin/cal? Yes! There it is, I''ll cast that one!

    ```


    So with the Path Variable, these two spells are just the same:


    ```

    joe$ cal

    joe$ /usr/bin/cal

    ```


    What happens when the Path Variable can''t find a match at all? It will go through
    it''s list of paths, see that the spell is not located in any of those directories
    and tell you it can''t find a match:'
