- img_proc: true
  md: '# # Chapter 3 Advanced Lesson


    # ## A Shell of a Time


    In this lesson, you''re going to learn all about *shells*. A *shell* does a lot
    of things -- it runs the command when you enter it, provides your prompt, it keeps
    variables for you -- lots!


    Think of Unix as some foreign stranger you bump into on the street. All of the
    sudden you''re both yelling at each other in two different languages -- you in
    English and Unix in binary. Neither of you understand one thing and another gets
    accomplished.


    This is where the shell comes in. The shell is that guy that runs out of the deli,
    breaking the fight between you and Unix, speaking languages.


    The name *shell* originally came about because it''s viewed as the outermost layer
    of Unix. Like an egg -- the egg and the yolk are the Operating System while the
    shell is, well, the shell.


    Without the shell, you''d have no way of communicating with Unix -- just two guys
    yelling in the street.


    Historically, the very first shell was known as sh. As time went on, more shells
    were created: csh, tcsh, and bash for instance. bash is the most popular one today,
    and chances are, it''s what you''re currently using. You can see what shell you''re
    using by echoing an environment variable. Variables and echo will be explained
    in a later chapter. (This is an *advanced lesson*, after all!)


    ```

    joe$ echo $SHELL

    /bin/bash

    joe$

    Echoing the $SHELL variable

    ```


    bash uses the $SHELL variable while others use $shell. Remember, Unix is case
    sensitive -- uppercase and lowercase letters make a difference! If nothing showed
    up on your screen, try the next example.


    ```

    joe$ echo $shell

    /bin/tcsh

    joe$

    Echoing the $shell variable

    ```'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Shells can provide us with some cool features. We''ll be looking at three of
    them: history, command completion, and customizing your prompt.


    # Shell History


    You''re being watched. Every command you type is being recorded -- by the shell!
    Why? Just once you forget how to run a command or maybe you want to see how someone
    else typed a command.


    You can see your history of commands by typing just that -- history.


    You can also view commands you''ve previously used by using your up and down cursor
    keys. Pretty neat, huh?


    # Command Completion


    What if you couldn''t remember how a command was spelled, but you knew it began
    with ca? With command completion, you can type the letters ca then press twice.
    A list of all the commands that start with ca will appear!


    If there is only one command that fits the description you''re typing, pressing
    tab will complete the command for you. So how do you know to use tab or two? Rule
    of thumb is to hit tab once, if nothing comes up, try twice.


    You can even use the completion feature for directories, too! Try using the cd
    command to go into the closet directory, but instead of typing closet, type:


    ```

    joe$ cd clo (press your tab key after o)

    ```


    Notice how the directory will automatically complete for you! The same rule applies
    here with the tab key: if there''s only one result, one press tab will do, but
    if there''s more than one, you need to hit tab twice.


    # Customizing Your Prompt


    OK, it''s time to Pimp your Prompt! Well, customizing your prompt isn''t that
    cool, but if you want to think of it that way, then go for it!


    In order to change your prompt, you have to set an environment variable. It isn''t
    as hard as it sounds.


    If you''re using the bash shell, here''s how you change your prompt:


    ```

    joe$ PS1="My New Prompt>

    My New Prompt>

    Changing your bash prompt

    ```


    34'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'If you''re using another shell, like tcsh or csh, here''s how to change your
    prompt:


    ```

    joe$ set prompt="My New Prompt> "nMy New Prompt>

    Changing you csh or tcsh prompt

    ```


    Here are two websites that have more examples on prompt customization:


    +   - http://www2.linuxjournal.com/article/3215

    - http://www.freebsddiary.org/prompt-tcsh.php


    That''s all for this advanced lesson!'
  merge: -1
