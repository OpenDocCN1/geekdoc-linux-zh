  md: 'We''ve been making progress so far, Young Mage! Why don''t we take a little
    break and walk around the Tower for some fresh air. I''ll show you all the different
    rooms that are here. Cast cd to teleport to root (/) and we''ll begin!


    If you cast here, you''ll lose spells /bin /dev again, you won''t be learning
    about all of them, but I''ll teach you about the most important ones.


    ![](img/6457f3fa8117ed6c662b495cac2762d4_37_0.png)


    The first floor of the Tower


    The first one we look at is /bin. Inside /bin are lots of files -- not just any
    kind of files, these are all spells /bin holds all of most important spells in
    the Tower. We give it the name binary because bin is short for binaries. A binary
    is an executable, compiled program that only Unix can-understand. If you speak
    of cat, casting on a binary file, you''ll get nothing but gibberish cat.


    Speaking of cat, there is it in /bin/cat. In fact, almost all of the spells you
    have learned so far are free! There are also lots and lots of spells you''ve never
    heard of. Unfortunately, I can''t teach you of all, but I''ll show you how to
    learn them, later on.


    Next, we go into /dev. If you cast in /dev, you''ll see lots of flies. /dev stands
    for devices and these files are device files. They are special spells that can
    interact with hardware -- like your monitor and CDROM drive and your Keyboard.
    There are lots of different ways we can use dev files, but we needn''t worry about
    that now.


    The next room is /etc. /etc is our board room where config files are stored. Laws
    and rules that govern how the Tower runs are made and kept here. For example,
    if the Tower wanted to make a law that kept a certain mage out of the tower because
    he''s causing problems, we place that law in /etc.


    /home is next. These are the dorms of The, as you already know. Each mage who
    lives here has a room in /home. And there we can see yours!


    > There is no /bin in Mac OSX, but there is /usr/lib.


    > Tip:

    If you are using Mac OSX, you will see /Users/instead of /home.


    We come to /lib, our Library. Sometimes when we cast spells, we need to look up
    information on how to cast them properly. Yes! Spells are smart enough to do that!
    Even when they''re being cast, they can still make a quick trip to the Library.
    All of this happens without the mage knowing!


    The next room is /sbin. /sbin is another spell directory, but these are important
    spells that only archmages should use. Some have shields that


    38'
