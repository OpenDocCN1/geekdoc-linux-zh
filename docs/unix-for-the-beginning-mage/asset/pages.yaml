    # Using Paths In Your Spells


    If mv can take paths for its arguments, what other spells can? Well, since mv
    and cp are basically the same thing, cp can be as well. ls can, too. Oh and cat.
    Come to think of it, more and less can. It works with touch. mkdir, also.


    How can all these files use paths? What is the common thing between all of them?
    Their arguments specify files. And anywhere we specify a file, we can specify
