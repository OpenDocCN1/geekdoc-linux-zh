  md: "```\njoe$ fg 1\nBringing job number 1 into the foreground\n```\n\nAnd now top\
    \ will pop up in your terminal! You can press q to exit top. Now cast jobs again\
    \ to see what's left:\n\n```\njoe$ jobs\n[2]+ Stopped    nano\njoe$\nCasting jobs\n\
    ```\n\nAs you can see, nano is left. So go ahead and bring it to the foreground.\n\
    \n```\njoe$ fg 2\nBringing nano into the foreground\n```\n\nTo exit nano, just\
    \ type ctrl+x.\nThe second way to cast multiple spells is to put a spell into\
    \ the background while it's running. You\n do that by pressing ctrl+z inside any\
    \ program. Go ahead and cast top again. Now when it's running, press ctrl+z and\
    \ you will exit out but you'll notice this on your screen:\n\n```\n[1]+ Stopped\
    \    top\nnThe result of pressing ctrl+z inside a spell\n```"
  merge: -1
  pgno: 89
- img_proc: true
  md: 'Like we just covered, this means top is now in the background with a job number
    of 1 and you can bring it to the foreground with


    ```

    joe$ fg 1

    Bringing top to the foreground again

    ```


    So there are two ways to free up your terminal to cast than one spell. When would
    normally use this? Sometimes a spell will take a really long time to run, so you
    can cast it with the & at the end right away to free up your terminal. Other times
    you will need to switch to a new program so you can use ctrl+z. But normally,
    you can just open a new terminal -- there is no limit to them anymore (there used
    to be back in the old days)


    # Killing Processes


    A spell will be awry and you will need to kill it. I know it sounds mean, but
    sometimes just has to be done!


    To kill a disgruntled spell, you cast kill and use the Process ID as an argument.
    For example, if the spell with Process id 699 went bad, you could kill it like
    this:


    ```

    joe$ kill 699

    Killing a spell

    ```


    There are cases when a spell has gone so crazy that even using a normal kill won''t
    put it out of misery. In that case, we have to use a greater killing force. This
    is known as kill -9. You can cast it like this:


    ```

    joe$ kill -9 699

    Using kill -9 on a spell

    ```


    And if that doesn''t do anything, then you''re in some trouble and you should
    contact an archmage!


    There are several other numbers you can use as options with kill -- not just 9.
    To learn about them, read the kill man page.'
