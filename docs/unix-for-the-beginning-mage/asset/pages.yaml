  md: '# Epilogue


    The Young Mage has completed the basic training; A farewell.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'Congratulations, Young Mage, you''ve reached the end of the basic training!
    You''ve definitely learned a lot about the Unix Spellcraft since your training
    began and you should be proud for finishing! As a gift for completing, the Archmages
    of the Tower have decided to raise your rank to a standard Mage! Congratulations!


    But your journey is far from over! There are several topics you can learn from
    here -- creating your spells, managing your Tower, and communicating with other
    Towers.


    If you choose to learn about creating your spells, you''ll be known as a Spellcrafter.
    Spellcrafters use a variety of languages to create their spells such as Python,
    Perl, C, and C++. The Unix Spellcraft provides an amazing environment to create
    your own spells and all Mages are encouraged to learn, at least, the basics of
    spellcrafting.


    Managing your Tower is an art known as System Administration. There are several
    aspects of System Administration such as building and maintaining your Towers,
    keeping your Tower secure, and making sure the data stored in the Tower is properly
    backed up.


    Finally, communicating with other Towers is an art known as Networking. You''ll
    learn about sockets and ports and a numerous amount of daemons. During your training
    of the Networking art, you''ll run into a few different factions of Mages such
    as the White Mages and Black Mages -- and you''ll eventually have to join one
    yourself!


    As you can see, you have several different choices to pick from! Also, don''t
    think that you''re confined to just picking one choice -- if you can''t make up
    your mind, pick all three!


    Good luck with your learning, and above all else, don''t forget to have fun!'
  merge: -1
  pgno: 95
