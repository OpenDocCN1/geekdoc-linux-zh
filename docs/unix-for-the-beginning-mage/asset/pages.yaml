  md: 'In the previous lesson, you heard about something called a system account.
    You''ll learn all about those and much more in this lesson!


    # Daemons (not demons!)

    If we did all the work in the Tower to keep it running normally every day, there
    would be no time to get anything done! The thoughtful people ages, they decided
    to create little helpers. These helpers are called daemons. Each daemon has a
    job to do and they do only thatat job. That''s it! Daemons just sit in the tower
    and wait until they have to do their job.


    What kind of work do the daemons do? Lot''s! Anything from delivering your mail
    to serving web pages cleaning up memory maze left laying around -- they do all.
    The Tower would never run as smooth as it does them.


    But just like the males in the Tower, the daemons need to be registered in /etc/passwd.
    That''s what all those system accounts are -- they''re the daemon registrations.


    Can you see daemons working? Sure! Let''s find out!


    # Processes


    Whenever you cast a spell, you create something called a process. Makes sense,
    though, right? A process is an action -- just like casting a ps spell is an action!
    You can see all the processes you are running by casting the ps spell (which stands
    for process).


    ```

    joe$ ps\PID TT STAT TIME COMMAND

    610 p2 S 0:00.05 -bash

    joe$

    casting the ps spell

    ```


    Let''s look at the different columns.


    The PID column is for the Process ID. Remember in the last lesson I said Unix
    likes to convert everything to numbers? This is another example. All processes
    get a unique number.


    The TT column displays a location for your terminal. Nothing important to worry
    about.


    The STAT column stands for state. It shows the state of the process. The TIME
    column shows much processing time Unix has used on the process. Again, neither
    of these is important right now.


    Finally, the COMMAND field shows you the name of the command. In this case, ps
    shows only one process: bash.


    > 7 Bash is explained in Chapter 3''s Advanced lesson'
