  md: '# Chapter 6 Advanced Lesson


    Unix gives you the ability to channel information through several different streams.
    These streams are also known as *file descriptors* and they''re what you''ll learn
    about in this Advanced Lesson!


    The Three Basic Descriptors

    Unix has the ability to support 10 file descriptors numbered 0 to 9, but you''ll
    only use the first three for the majority of the time. The basic three are standard
    input, standard output, and standard error. Some more information is shown in
    the table:


    | File Descriptor | Short Name | Descriptor Number |

    | --- | --- | --- |

    | Standard Input | STDIN | 0 |

    | Standard Output | STDOUT | 1 |

    | Standard Error | STDERR | 2 |


    Standard Output

    Whenever a command prints something to your screen, STDOUT is being used. You
    may redirect where the output goes by using pipes and redirectors.


    ```

    joe$ echo "Hello" > newfile.txt

    ```


    Redirecting STDOUT


    You''ve seen this example in the previous lesson -- it''s just a simple redirect.
    But what you haven''t seen yet is that there is an implied, hidden File Descriptor
    1 embedded in the command:


    ```

    joe$ echo "Hello" 1> newfile.txt

    ```


    Redirecting STDOUT with the implied File Descriptor


    If you take a look at the contents of newfile.txt, you''ll notice there''s nothing
    different about it than using the 1. When you use a simple > in Unix, it is just
    the same as 1>.


    Standard Error

    If a command responds with an error message, it''s using the STDERR channel. You
    may also redirect STDERR, but an extra step is needed.


    Try saving the error message of this command to a file:'
  merge: -1
  pgno: 70
- img_proc: true
  md: '```

    joe$ ls doesnotext > newfile.txt

    ls: doesnotext: No such file or directory

    ```


    Attempting to redirect STDERR


    If you look at the contents of newfile.txt, you''ll notice it''s empty -- it did
    not redirect the error message. Why not? Because errors use File Descriptor 2.
    In order to properly save the error message, you''ll need to do this:


    ```

    joe$ ls doesnotextist 2> newfile.txt

    ```


    Redirecting STDERR


    If you look at the contents of newfile.txt, you''ll see the error message. Remember,
    when using >, 1 is by default and anything else has to be explicitly typed.


    # Standard Input


    By default, anytime a file receives more information, it''s using File Descriptor
    0. Just what do I mean by “receives more information?” Receiving information can
    be in the form of adding text to a file, reading command line arguments, or having
    information piped to a command.


    The tricky part about STDIN is that it''s a part of almost every command. Using
    the previous STDERR example, the error message is the STDERR of the ls command,
    but becomes the STDIN of newfile.txt. Anything accepts inputs to STDIN.


    When using to redirect output, the content of the left side is STDOUT or STDERR
    and the right side is STDIN. Of course, it''s vice versa with the < redirector
    -- the left is now STDIN and the right is STDOUT or STDERR!


    The same is true with pipes -- the left side is the STDOUT and the right side
    is STDIN. Using that concept, we can prove that (if programmed correctly) any
    command that can take a file as an argument can also take it''s input by STDIN.


    You know that you can use the wc command to count the number of lines, words,
    and characters in a file like this:'
  merge: -1
  pgno: 71
- img_proc: true
  md: '```

    joe$ wc file.txt

    ```


    Using wc with a file as an argument


    You can also pipe information to wc and it will still count the number of lines,
    words, and characters just as you would have specified a file.


    ```

    joe$ cat file.txt | wc

    ```


    Using cat to pipe output to wc


    As you can see, the same output is shown. This proves that (almost) any Unix command
    that can accept a file as an argument can also have information piped to it for
    input. I say almost any command, because programming Unix commands, you have to
    follow a standard set of rules to allow this. Most programs do, but there are
    the odd few that do not conform to this standard way of Unix programming.


    # Combining File Descriptors


    It''s also possible to combine file descriptors. You would do this if you wanted
    to save, both, the input and output to a file. You can combine them like this:


    ```

    joe$ cat newfile.txt > newfile.txt 2>&1

    ```


    Combining STDERR and STDOUT


    What this does is redirect all STDERR to STDOUT. Since STDOUT is being redirected
    to newfile.txt, so all of the error messages (if any exist). Yes, I know it looks
    goofy to have the combination at the end of the command!


    # Disabling Output


    Sometimes you''ll want to run a command and not just see any output -- whether
    it be STDOUT or STDERR. In that case, you can redirect everything to a special
    device known as /dev/null:


    > 5 Using cat in this form is known as a Useless Use of Cat and should be avoided.
    It''s used here for visual purpose only.


    73'
  merge: -1
  pgno: 72
- img_proc: true
  md: '```

    joe$ cat newfile.txt > /dev/null 2>&1

    Redirecting all output to /dev/null

    ```


    /dev/null is your own personal blackhole in Unix. Anything that goes to it just
    vanishes.

    That just about covers everything with File Descriptors and Redirecting!'
  merge: -1
