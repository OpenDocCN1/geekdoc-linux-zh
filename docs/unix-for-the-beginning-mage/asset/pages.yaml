- img_proc: true
  md: '# Casting Your First Spell


    To cast a spell, you simply type the name of the spell and press enter. Let''s
    try a simple spell called whoami.


    ```

    joe$ whoami (enter)

    joe

    joe$ Casting the whoami spell

    ```


    whoami stands for Who Am I. As you can see in the figure, after you typed the
    word whoami and pressed enter, the spell returned the answer or output. The output
    of this spell is, oddly enough, your name (also referred to as a username or login
    name)! The purpose of the whoami spell is to tell us name of the user we are currently
    logged in in Unix. It might sound silly right now, but it''s possible to cast
    spells that turn us into other people!


    Spells can return a wide range of information. Some return one word like whoami,
    some put out pages and pages of text, some put you in interactive programs, and
    some just don''t return anything at all!


    # Familiar Concepts


    As you have noticed, your mouse is not used in the terminal at all. If you''ve
    never used a command line before, this can be a confusing concept -- but fear
    not! You can bring over lot of the concepts you learned in the Mouse and Window
    world to the command line world.


    For example, with a mouse, you would double-click to open a directory or a program.
    With Unix, we call this spell command or command execution. You are also familiar
    with your mouse for common, everyday tasks, such as moving files to directories,
    renaming files, and deleting files. In Unix, we have spells for all actions as
    well! There is the cp spell to copy files, the mv spell to move and rename files,
    and the dangerous rm spell that deletes files.


    You''re also familiar with opening and closing folders with your mouse to reach
    different areas. This is also browsing or exploring in the Windows world. In Unix,
    we call this navigating the filesystem. Also, we call folders directories.


    Speaking of the filesystem, that brings us to our next lesson.


    > 1 Make sure whoami did not return the name root. See Chapter 7 Advanced Lesson
    for more information.


    > 2 We say rm is dangerous since you cannot raise dead files from the grave in
    Unix!'
  merge: -1
  pgno: 9
- img_proc: true
  md: "# An Introduction to the Filesystem\n\nOur world of Unix starts with a single\
    \ character:\n\n```\n/\n```\n\nThis is called root. Just like the root of a tree,\
    \ root is the beginning of the filesystem. A tree can grow several branches with\
    \ leaves on the end. In our filesystem, directories grow from the root and contain\
    \ files. You can even think of root as the front door to your house. Inside your\
    \ house there are several hallways leading to other rooms. The same is true for\
    \ our filesystem; there are several directories and leading to other subdirectories.\n\
    \nLet's say you have a directory called music. In the filesystem, it would look\
    \ like this:\n\n```\n/music\n```\n\nNow let's say you have a song called mice_and_mages.mp3\
    \ in your music folder. That would look like this:\n\n```\n/music/mice_and_mages.mp3\n\
    ```\n\nNotice how root is always at the beginning. We then use slashes (/) to\
    \ separate files and directories. This is so we can tell where one stops and one\
    \ begins. The full line is known as a path.\n\nAs a second example, let's say\
    \ you have a directory inside music called favorites. A directory inside a directory\
    \ is called a subdirectory. Inside your favorites folder you have another song\
    \ called five_mage_army.mp3. Now it looks like this: \n\n```\n/music/favorites/five_mage_army.mp3\n\
    ```\n\nIn the mouse and windows world, it would look like this:\n\n| music | favorites\
    \ | five_mage_army.mp3 |\n|---|---|--|\n| | mice_and_mages.mp3 |\n\n# Paths\n\n\
    Let's discuss paths a bit more. Paths are just that: paths. In a forest, we walk\
    \ along paths so we don't get lost. In the Tower, we follow paths to different\
    \ rooms. Filesystem paths are no different; they will lead you to different directories\
    \ and files.\n\nThere are two types of paths to know about: absolute and relative.\
    \ An absolute path is from the root to your destination. It's like being at the\
    \ front door of your house and walking to the kitchen. You are starting from the\
    \ very beginning of your house. The same is true with a filesystem path -- it\
    \ starts from root (/). So any path you see that starts with a slash is an absolute\
    \ path:"
  merge: -1
  pgno: 10
- img_proc: true
  md: '# /mudroom/hallway/kitchen


    A relative path is from your current location to your destination. For example,
    if you were in your hallway and wanted to go to your bedroom closet, that is a
    relative path. You''re not starting at your front door since you''re already in
    your house.


    # bedroom/closet


    Relative paths do not start with a slash -- which is a very easy way to tell the
    difference between absolute and relative paths!


    Now, say you''re in your bedroom, but you wanted to leave and go to the kitchen.


    # ../hallway/kitchen


    Notice the dot (.. ). That is a special thing in Unix that says "I am leaving
    my current room".


    Now that you understand paths better, let''s start walking around the Tower of
    Nix.


    **Basic Navigation Around the Filesystem**nFirst, it''s always best to know where
    you are. To find that out, cast a spell called pwd.


    ```

    joe$ pwd

    /Users/joe

    joe$

    Casting the pwd spell

    ```


    pwd stands for Print Working Directory and will tell you what directory in the
    filesystem you''re currently in -- or what room of the Tower you are standing
    in.


    The directory you''re now in is also known as your home directory. Think of it
    as your dorm room in the Tower of Nix -- it''s your room to store your belongings.


    In order to move around, you''ll need somewhere to go. Cast the spell of mkdir.
    mkdir stands for Make Directory. It will create a room for us to go in.


    > Tip:

    In OS X, you will see /Users. In Linux or any other Unix, you will see /home.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '```

    joe$ mkdir closet

    joe$

    ```


    Casting mkdir


    Notice two things about this spell. The first is that you specified the word closet
    after mkdir. Some spells ask for extra information -- anything from one word to
    several. These extra words are called arguments. In the case of the mkdir spell,
    this argument told you what to call your room (closet).


    The second thing to notice is that mkdir didn''t tell you anything after you cast
    it. Remember before I mentioned that some spells will never tell us anything?
    This is one of them! On the other hand, if something were to have gone wrong when
    you cast the spell, mkdir would''ve told you. So if everything went OK, it shuts
    up, but if there was a problem, it complains. I think we can handle that!


    ![](img/6457f3fa8117ed6c662b495cac2762d4_12_0.png)


    Here''s a little visualization of the room you just created. It''s an off-shoot
    of the directory you were already in -- just like how a closet is another room
    inside your own room!


    Our new closet directory


    Now that you have a room created, feel free to go inside! In order to do that,
    cast the spell called cd (which stands for change directory).


    ```

    joe$ cd closet

    joe$

    ```


    Casting the cd spell


    When casting cd, you need to specify the room you want to go in as an argument,
    so type it after the name of the spell. The name of the room is just a path. Think
    back to our recent discussion about paths. Since closet doesn''t start with a
    slash, it''s a relative path. This makes sense because you are starting from your
    current room and going into your closet.'
  merge: -1
  pgno: 12
- img_proc: true
  md: "Again, the spell didn't tell you anything, so we'll assume everything went\
    \ OK. To see if you're in the new directory, cast pwd again.\n\n```\njoe$ pwd\n\
    /Users/joe/closet\njoe$ \n```\n\nCasting pwd to see if cd worked\n\nYep! pwd shows\
    \ that you are now in the closet!\n\nHere's what it looked like before you cast\
    \ cd:\n\n![](img/6457f3fa8117ed6c662b495cac2762d4_13_0.png)\n\nAnd here's what\
    \ it looks like after:\n\n![](img/6457f3fa8117ed6c662b495cac2762d4_13_1.png)"
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Now you will learn how to get out of the closet and back to your dorm room.
    There are actually four ways you can do that:


    +   1) Typing cd with no arguments is a shortcut to take you directly to your
    home directory. So if you were ever lost in the middle of a forest, you can just
    type plain cd and you will be teleported directly home!


    ```

    joe$ cd

    ```


    +   2) Typing cd with a tilde at the end will also take you home. The tilde (~)
    is a nickname for your home -- weird, huh?


    ```

    joe$ cd ~

    ```


    +   3) From casting pwd earlier, you know that home is /Users/joe, which is right
    outside the closet. You also know that to go out of one room, you can use the
    magic dot-dot. So you can just cast:


    ```

    joe$ cd ..

    ```


    This will take you out of the room and in to the one before it.


    +   4) Again, you know that home is at /Users/joe, so you could just use the absolute
    directory to get back to it by casting:


    ```

    joe$ cd /Users/joe

    ```


    So may choices! You may choose any way you wish!'
  merge: -1
  pgno: 14
- img_proc: true
  md: "# Turn On the Bright Lights!\n\nNext, you'll learn about a spell ls that stands\
    \ for list. Is will tell you everything that is in the-directory -- kind of like\
    \ turning on the lights in a room! Here's an example of how it works:\n\n```\n\
    joe$ pwd\n/Users/joe\njoe$ ls\ncloset\n```\n\nCasting the ls spell\n\nAs you can\
    \ see, ls shows the closet we made earlier. It might also show you a lot of other\
    \ files and directories, but we're only worried about the closet right now. If\
    \ the directory is empty, ls will show us nothing at all.\n\n```\njoe$ cd closet\n\
    joe$ ls\njoe$ \n```\n\nCasting ls in an empty directory\n\nThat ends this lesson,\
    \ Young Mage. What did all we cover? You learned all about casting spells and\
    \ how it's not that different from using a mouse. You also learned all about the\
    \ different kinds of paths. Finally, you learned how to walk around the Tower\
    \ of Nix. Not bad for a first day!\n\nTry the exercises before the next lesson\
    \ -- but don't stay up too late doing them!"
  merge: -1
  pgno: 15
