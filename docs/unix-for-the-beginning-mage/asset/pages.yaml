  md: '# # Appendix B


    A quick guide to building your own Tower'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'If you would like to build your own Tower of Nix, you''ve got plenty of options
    to choose from. Unfortunately, for beginners, this isn''t exactly a good thing.
    I''ll try to explain as easily as I can the different paths you can take.


    # Mac OS X


    When Apple released OS X, it instantly became the most advanced and user-friendly
    Unix-based operating system. If you''re a Mac user, chances you''re already using
    OS X (as opposed to OS 9), so you already have a Unix-based computer to use. You
    can find the Unix terminal under the Utilities folder of Applications. Just open
    that up and you''re all set!


    # BSD


    If you would like try out the BSD family of operating systems, you have a few
    choices. The two easiest choices would be PC-BSD or a Live FreeBSD CD. If you
    would like to rough it out and start from scratch, you''re more than welcome to
    FreeBSD, OpenBSD, or NetBSD from a clean install. A word of warning, though --
    they''re not very friendly to absolute beginners. I would recommend finding a
    walk-through or online.


    # Linux


    There are several Linux distributions to choose from and many of them are beginner-friendly.
    My choice would be go with Ubuntu - a newer distribution of Linux that''s incredibly
    easy to use. You have two choices with Ubuntu: a full install and a Live CD. I
    would recommend starting with a Live CD.


    If you would rather not go with Ubuntu, you are more than will you with a full
    BSD or installation. When Fedora, Mandriva, Debian, SuSE, Slack, or Gentoo. Please
    be aware that some of these are more difficult to install than others and you
    should follow the instructions.


    # Resources


    +   OS X: http://apple.com/macos

    PC-BSD: http://pcbsd.org

    FreeBSD Live CD: http://livecd.sourceforge.org

    FreeBSD: http://freebsd.org

    OpenBSD: http://openbsd.org

    NetBSD: http://netbsd.org

    Ubuntu: http://ubuntulinux.org

    Fedora: http://fedora.redhat.com

    Mandriva: http://www.mandriva.com/

    Debian: http://debian.org

    SuSE: http://www.novell.com/linux/suse/

    Slackware: http://slackware.com

    Gentoo: http://gentoo.org


    > A Live CD is a CD you can boot your computer up with and will provide you with
    a full BSD or Linux installation. When you are done, simply reboot your computer!'
