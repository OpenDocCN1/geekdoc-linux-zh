  md: '# Chapter One


    Our Guest is greeted and welcomed; a lesson in history; a description of our tools.'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'Hello, Young Mage Welcome to the Tower of Nix! Here you''ll begin your training
    in the skills of Unix. I''ll be your Instructor and Narrator.


    We here at the tower understand if you''re a little nervous or unsure about learning
    something so new and different. However, I can assure you that your stay and training
    at the Tower will be none other than best! Before we begin, I''d like to give
    you a history of the craft you are about to learn.


    # A Brief History of Unix and Unix-like Spellcrafts


    The Unix was created long before other spellcrafts -- Windows, before Macintosh,
    even before DOS. It was first forged by archmages in the Fortress of AT&T back
    in the 1960''s. Later, AT&T allowed other classes of mages to practice Unix --
    for a fee. One of these classes was the University of Berkeley. Their branch of
    Unix became known as BSD, or, Berkeley Software Distribution. Eventually, Berkeley
    modified their craft of Unix so that no remnants of AT&T existed. Berkeley''s
    version of Unix is free for all and not required to pay. Several other branches
    of Unix originated from BSD including FreeBSD, NetBSD, OpenBSD, Darwin, and Mac
    OSX.


    At Vrije Universiteit in Amsterdam, another branch of Unix was created Minix.
    Minix was forged from scratch and had no relation to AT&T at all. Minix was not
    a very popular branch of Unix but it was the inspiration to yet another branch:
    Linux. An archmage named Linux forged Linux and welcomed any other mage to help
    out. Today Linux is still being forged by thousands of mages around the world.


    There are several other branches of Unix which you must pay fee -- but the free
    ones have been gaining strong popularity. The most popular ones are the few I
    mentioned. In the BSD area, there is FreeBSD, OpenBSD, NetBSD, Darwin, and Mac
    OSX. As for Linux, there are several variations as RedHat, Fedora, Debian, and
    SuSE. Though they may look different on the outside, they are all Linux at the
    core.


    # The Terminal


    Before we begin, please make sure you are in front of a Unix Terminal. While describing
    every possible way to access a terminal can take up whole books of their own,
    unfortunately, don''t have time for that. I will assume you have found access,
    one way or another, and are happily sitting in front of a blinking cursor that
    looks like this:


    ![](img/6457f3fa8117ed6c662b495cac2762d4_6_0.png)'
  merge: -1
  pgno: 6
- img_proc: true
  md: "What you see before you is your terminal. The terminal is the main tool of\
    \ our craft -- it's where we cast our spells. Though different terminals may look\
    \ different, they all share a few characteristics.\n\n```\nbash -- ttyp3 -- 75x15\n\
    joe$ \ntue Jul 19 15:27:44 EDT 2005$\njoe-topjians-poverbook-g4-12$\n\n```\n\n\
    Examples of\nPrompts\n\nCursor\n\nSpell Casting\nArea\n\n# Diagram of a Terminal\n\
    \nPrompt: A prompt is just some text to let you know that your terminal is ready\
    \ for you to cast a spell. It also has the ability to tell you other useful information.\
    \ In the examples above, I have prompts set as $, my name, the date, and the name\
    \ of your computer. Prompts usually end with a symbol such as $, >, %, or #.\n\
    \nCursor: The cursor is a block or line to let you know where a letter is going\
    \ to appear when you press a key.\n\nSpell Casting Area: The spell casting area\
    \ is just blank space. Any blank space after the prompt is where the letters you\
    \ type will be displayed. It's in this blank space that you will be casting spells.\n\
    \nNot bad for a first lesson, no? Now that you're a little more familiar with\
    \ what you're about to get into, let's start casting spells!\n\n> Tip:\nSpell\
    \ Casting is known as command execution in the Real World."
  merge: -1
  pgno: 7
