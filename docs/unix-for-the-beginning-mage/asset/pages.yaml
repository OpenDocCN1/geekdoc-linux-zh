- img_proc: true
  md: '# # Chapter Five


    The Young Mage learns that not everything in the Tower is free to use because
    of both privacy and protection.'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'Earlier, I mentioned how of the spells in /sbin have shields to keep you from
    casting them. Actually, all spells, files, and directories have some kind of shields
    on them! Also, not only shields are used to prevent you from casting spells, they
    can also be used to prevent you from reading files and writing information to
    files.


    > Tip:

    Shields are also called permissions.


    Now you''ll learn how to read shields and even place some on your own files!


    Before you begin learning about shields, I need to cover a few basic things. In
    the Tower of Nix, you have your name (which you can find by casting whoami). This
    is also called your login or username. When you create a file or directory in
    Unix, that name is now known as the owner of that file or directory.


    Next, all mages in the Tower belong to groups. You can belong to several groups
    or just one group -- but always have to be in at least one. To see what groups
    you are in, you can cast the groups spell.


    ```

    joe$ groups

    joe appserveradm appserverusr admin

    joe$

    Casting the groups spell

    ```


    As you can see, I am a part of 4 groups: joe, appserveradm, appserverusr, and
    admin.


    Like the name indicates, groups are used to group users together. When you are
    a part of a group, you have access and permission to everything all the other
    members of the group have. It''s like being a part of the Tower''s swim team --
    all members are allowed to use the pool after hours.


    Finally, you need to know about 3 little letters: R, W, and X.


    | Letter | What It Means | What It Does |

    |---|---|--|

    | R | Read | Allows you to Read the file |

    | W | Write | Allows you to create, edit, and delete files |

    | X | Execute | Turns the file into a spell and allows you to cast it |'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'Now let''s get started with shields! First use cd to teleport to /bin. Once
    you''re there, cast ls -l

    -l is another spell modifier that will show lots of details about the files --
    including the shields.


    ```

    joe$ ls -l

    -rwxr-xr-x 1 root wheel 581636 Mar 20 18:39 bash

    -r-xr-xr-x 1 root wheel 14380 Mar 20 18:38 cat

    -r-xr-xr-x 1 root wheel 19108 Mar 21 17:48 cp

    -r-xr-xr-x 1 root wheel 18964 Mar 21 17:49 mv

    joe$

    Casting Is -l

    ```


    The -l option gives us nine columns of information. Let''s go over them (they
    aren''t that bad, don''tworry).


    | 1 | 2 | 3 | 4 | 5 | 6,7,8 | 9 |

    | -rwxr-xr-x | 1 | root | wheel | 581636 | Mar 20 18:39 | bash |


    +   1. The Shield

    2. Number of Links

    3. The Owner of the file

    4. What Group the file belongs to

    5. The Size of the file in bytes

    6. The Month the file was created

    7. The Day the file was created

    8. The Time the file was created

    9. The name of the file


    So there you have it -- all nine columns. Not so bad, right?'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'Let''s go over the first column a little bit more. I''m sure it looks really
    goofy, but in a few minutes, you''ll understand everything about it!


    First, let''s break it up into some sections like this:


    | rwx | rwx | rwx |

    |---|---|---|

    | Breaking the shield up into sections |


    Now we''ve got four sections to look at. Ignore that first dash for now; I''ll
    tell you about it later. Take a look at the other three sections. Each they have
    three letters -- the same three I told you about a little bit ago. Coincidence?
    I think not!


    Now take another look:


    | rwx | rwx | rwx |

    |---|---|---|

    | User | Group | Everyone Else (other) |


    The sections are for the Owner (user) of the file, a Group, and Everyone Else
    (which we''ll call Other). We call this group of three UGO: User, Group, Other.


    Each section explains what shields are turned on for the owner, group, or other.
    If a letter is there, that means action is enabled. If it''s just a dash, that
    means the shield is preventing that action.


    Let''s take a look at one of the files from /bin again:


    ```

    -rwxr-xr-x 1 root wheel 581636 Mar 20 18:39 bash

    nThe bash file from /bin

    ```'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'Like I said before, ignore first dash and just take a look at the other part.
    In your head, break up into the three sections like I did above. Now you have:


    | - rwx | r-x | r-x |


    Finally, let''s put all the pieces together: The owner of the file is allowed
    to read the file, write to the file, and cast (execute) the file as a spell. The
    group can only read and cast the file. The same goes for Other. Who in the world
    is Other? Other is everyone else in the world who is not the owner and does not
    belong to the group.


    See? It''s not so after all! Just remember to break it up into three pieces. If
    there is a dash, the shield is preventing you from action, but if there is the
    letter, you can do that action.


    Finally, it''s time to learn what mysterious dash at the beginning is all about.
    The dash tells you what the file is. Is it a plain file? Is it a directory? Take
    a look for yourself:


    | -rwxr-xr-x 1 root wheel 581636 Mar 20 18:39 bash |

    | drwxr-xr-x 41 root wheel 13944 Jul 13 18:22 bin |


    starts with just a plain dash. This means that it''s a normal, everyday file.
    However, shows ad -- means it''s a directory. So now you can cast ls -l along
    with ls -F to see something in a directory, too!


    # Placing Shields On Files


    Now you''ll learn how to put shields on files. To do that, you can use the chmod.
    chmod stands for Change Mode, but you can actually think of it as Change Shield.
    The only requirement of using chmod is that you have to be the owner of that file.
    We can''t let everyone around change the shields on anyone else''s files!


    Go into your spell cast cast -l on your shelf.


    ```

    -rw-r--r-- 1 joe joe 25 Jul 15 20:35 shelf

    ```


    Casting ls -l on the shelf'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'As you can see, the shields that are currently on the file say that the owner
    can read and write, and the group and everyone else can read. Let''s make it so
    the group joe can write to the shelf as well:


    ```

    joe$ chmod g+w shelf

    joe$ ls -l

    -rw-rw-r-- 1 joe joe 25 Jul 15 20:35 shelf

    joe$

    ```


    Casting chmod notice that it takes two arguments. The second argument


    chmod looks like a really funny spell. You''ll notice that it takes the second
    argument is the name of the file we are changing the shields on. The first argument
    looks strange. g+w?

    What''s that mean?


    Remember UGO? User, Group, Other -- the three parts of the shield. That''s what
    the g means:

    group. The plus sign means that you are adding to the shield, and w, like you
    learned before, means write.


    Now say it to yourself: group add write. And that''s exactly what you did! You
    added write to the shield! Now anyone who belongs to the joe group can write to
    the shelf.


    Taking away from the shield is just as easy:


    ```

    joe$ chmod g-w shelf

    joe$ ls -l

    -rw-r--r-- 1 joe joe 25 Jul 15 20:35 shelf

    joe$

    ```


    Using chmod to take away from the shield


    Instead of using the plus sign, you use the minus sign.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'Here are a couple other examples:


    ```

    joe$ chmod u+rwx shelf

    ```


    Looks a little strange at first, but if you read it and say it silently to yourself,
    it all makes sense. To User we are Adding Read, Write, and Execute. u+rwx.


    ```

    joe$ chmod ugo+rx shelf

    ```


    This second example is just as easy: ugo+rx. To User, Group, and Other, we are
    Adding Read and Execute. This example could also be written as a+rx where a stands
    for All.


    ```

    joe$ chmod u+x,g+rw,o-r shelf

    ```


    Finally, the third example looks different than the others, but it''s just as
    easy: u+x,g+rw,o+x. To User we are Adding Execute, to Group we are Adding Read
    and Write, and to Other we are Taking Away Read.


    **Using the Number Method to Place Shields in Files**

    Sometimes typing all of those letters can get tedious -- once you get the hang
    of using chmod. There''s a faster way to use chmod that uses numbers.


    To understand the numbers, first we have to convert r, w, and x to a number:


    | Letter | R | W | X | None |

    | --- | --- | --- | --- | --- |

    | Number | 4 | 2 | 1 | 0 |


    If we wanted to put **Read** and **Write** on a shield, we add 4 and 2 to get
    6. **Execute** and **Read** would be 5. And all three would equal 7.'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'Next, you group three numbers together for a UGO combination. For example,
    if you wanted User to have Read and Write, Group to have Read and Execute, and
    Other to have Read, it would be 654. 6 = rw, 5 = rx, and 4 = r.


    Finally, to cast chmod the numbers, you would do this:


    ```

    ```njoe$ chmod 654 shelf

    joe$ ls -l

    -rw-r-xr-- 1 joe joe 25 Jul 15 20:35 shelf

    joe$

    ```

    ```


    And you can see that the shield changed to what we wanted!


    Another difference between using numbers and letters is chmod with letters, you
    can use + and - to add and subtract actions. With numbers, you can''t do, you
    have to start over each time.


    So right now, you have Read and Execute for the group shield. If you wanted to
    add Write to it, you would have to add Read, Write, and Execute to get 7.


    Also, there is no way to just change the Users shield and not the Group and Other
    when using the numbers. You always have to cast chmod with the three numbers.
    If you don''t use the three groups, something like this will happen:


    ```

    ```njoe$ chmod 4 shelf

    joe$ ls -l

    ------r-- 1 joe joe 25 Jul 15 20:35 shelf

    joe$

    ```

    ```


    See how it erased everything but Read for Other? That''s because using a single
    4 is just like using 004 -- if you don''t specify one of the three numbers, Unix
    will use a 0 instead. So there''s pros and cons to using the letters and numbers.
    Use either method you feel most comfortable with!'
  merge: -1
  pgno: 51
