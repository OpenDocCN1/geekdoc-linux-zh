- img_proc: true
  md: '# Chapter Three


    The Young Mage learns about files; discovering the world of nano; the many paths
    of Unix; and always make sure you have a backup.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Our next lesson is with Files. A file is anything that stores information.
    While a directory can store files and other directories, a file holds bytes and
    information. Files are the leaves on the tree or the furniture in the room.


    There are many types of files in Unix. Some just contain text (like your research
    paper), some music (like an mp3), some are spells we can cast (like mkdir and
    ls), and others do special functions like provide access to your CDROM.


    # Creating Empty Files


    There are many ways to create files. The first way is with the touch spell. One
    of the things that touch can do is create blank files for us. If you followed
    the exercises from Chapter 2, you now have a special room in your closet to store
    all your spells. Well, you can''t leave them lying around the room so you''ll
    have to create a shelf for them!


    ```

    joe$ cd closet/spells

    joe$ touch shelf

    joe$ ls

    shelf

    joe$

    ```


    As you can see, you also cast your light-giving spell, ls, which tells you that
    the shelf was created.


    # Separating Files and Directories


    Just having the word shelf on your terminal looks pretty confusing. How can we
    tell if it''s a file or directory? One way is to try casting cd and see if you
    can teleport in it. If cd fails, then it''s a file.


    ```

    joe$ cd shelf

    -bash: cd: shelf: Not a directory

    joe$

    ```


    Yep, it failed. cd came back and told us it''s not a directory. It also mentioned
    something about bash³. It would get pretty tedious if we had to cast cd every
    time we wanted to know if something a file or directory. There has to be an easier
    way. Well, there is!'
  merge: -1
  pgno: 20
- img_proc: true
  md: '```

    joe$ ls -F

    shelf

    joe$ Casting ls with the -F argument

    ```


    OK, looks like it did no good at all. In fact, you even did extra work with that
    weird -F thing. Just give me a minute to explain before you call me crazy!


    First, that weird -F is called an option. Anytime you cast a spell with a dash-something
    after it, you''re using options. Options modify the spell to do different things.
    In this case, the -F tells ls to politely give us more detail about what''s in
    the room. Unfortunately, if what''s in the room is just a plain file, -F won''t
    report anything else. However, it will tell us whether there are directories in
    the room. Take a step out of your spell closet -- which takes you to your main
    closet -- and trying ls -F again.


    > Tip: Make sure you are using a capital F. Spells are case-sensitive!


    ```

    joe$ cd

    joe$ ls -F

    spells/

    joe$ Casting ls -F again

    ```


    I''m not crazy after all! Notice the / at the end of spells. This tells us that
    spells is a directory! So when you''re unsure whether or not something is a file
    or directory, casting ls -F will give you the answer. There are a few other methods
    that can tell the difference and we''ll learn about those later.


    # Editing Files


    Now you have your blank file, shelf. Let''s start putting things in it. Why don''t
    you have it hold all of the spells you know so far? In order to do that, you''re
    going to have to edit the file, or modify the information inside it.


    First, go back into your spell closet where the shelf is located.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '```

    joe$ cd spells

    joe$ pwd

    /Users/joe/closet/spells

    joe$


    Going back to the spell directory

    ```


    Next you''ll need to use a spell called a text editor. There are several text
    editors available for Unix, but for now, you''ll use a very simple one called
    nano. In order to have nano edit a file, you need to tell it what file we edited.


    ```

    joe$ nano shelf


    Casting nano

    ```


    Once you hit enter, the spell takes you into a whole new world -- the wonderful
    world of nano. OK, that''s too dramatic. But did you notice that your terminal
    just changed, right? This is called an interactive spell or an active program.
    It doesn''t just return some output quit. Instead, you continue using the spell
    until you''re done.


    Think of nano as a very, basic Microsoft Word. Go ahead and play around for a
    bit. Type some gibberish. Move around with your cursor keys. Play! When you''re
    done erase everything and add your spells. Just type them in -- no need to get
    really fancy. And in any order, too.


    > Tip:

    If you get "command not found" when casting nano, try pico. They are the exact
    same (besides-the names).


    ![](img/6457f3fa8117ed6c662b495cac2762d4_22_0.png)


    The nano text editor'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Also notice the instructions at the bottom. ^ is called a caret and means to
    use your control key on your keyboard. So, to exit, press ctrl+x. It will ask
    if you want to save the file before it quits -- press y to say "yes", then, enter
    to confirm the filename to save to. Now you''ll find yourself outside the nano
    program and back to the terminal.


    You don''t always have to touch files before you edit them. You can cast nano
    on a file that doesn''t exist yet, and when you press ctrl+x to exit and save,
    it will be created.


    Now that you have some information in your file, how can you read it? One way
    is to just cast nano again, but there are other spells that''ll let you read files.


    # Reading Files


    The first spell is cat. will just spit the content of the file to the terminal.
    You can cast it like so:


    ```

    ```

    joe$ cat shelf

    mdir

    cd

    ls

    whoami

    touch

    joe$

    ```

    ```


    As you can see, cat is very simple. It takes a file as an argument and spits the
    content out. But what if the content of the file is too big for the terminal?
    You''ll never be able to see it since it''ll be cut off! Now you''ll need to use
    a spell that supports paging. A paging spell will stop when a screen is filled
    with text and wait for you to press a key to continue. Two paging spells are more
    and less.


    less is the preferred spell to use since you can use your keys to move up and
    down the contents as well as using your space bar to scroll a whole page. When
    you are done reading the file, you hit q to stop lasting (it is another interactive
    spell).


    To cast less, type it with a file name for an argument -- just like you do with
    cat.


    > Tip:

    Hically, more came first, then less, less has more features since less is more!'
  merge: -1
  pgno: 23
- img_proc: true
  md: "![](img/6457f3fa8117ed6c662b495cac2762d4_24_0.png)\n\n# The less spell\n\n\
    Now you know four ways to read files. Believe it or not, there are still many\
    \ other ways to read them! But four is good enough for now -- we've got a lot\
    \ of stuff to cover besides reading files!\n\n# Copying and Moving files\n\nWhat\
    \ if you wanted to make a backup copy of your file just incase your closet caught\
    \ on fire? To do that, we can use the cp spell. cp stands for Copy and, as the\
    \ name indicates, it creates a copy of a file.\n\n```\njoe$ cp shelf shelf-backup\n\
    joe$ ls\nshelf\n      shelf-backup\njoe$\n```\n\nCasting the cp spell\n\nA couple\
    \ things to notice with this spell. First, it's the first spell you use two arguments.\
