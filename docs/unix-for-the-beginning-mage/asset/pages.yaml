    # Reading the Instructions for Spells


    The archmages knew they would never have enough time to teach all the other mages
    every single spell in the Tower, so they wrote instructions on how to do it. We
    call these instructions *man pages* or *manual pages*.


    In order to read the man page, you cast a spell called man like this:


    ```

    joe$ man ls

    Casting the man spell

    ```


    Once you press enter, you''ll see a lot of text appear on your screen. If you
    look close enough, you''ll see that man has actually used either more or less
    program to show you the text.'
