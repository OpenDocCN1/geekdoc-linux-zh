    ```


    Creating the fireproof box


    Notice how ls -F shows you which one is a directory and which ones are files.


    Now you''ll move the backup copy to your fireproof box. Moving files is done with
    the mv spell (guess what stands for). mv takes two arguments just like cp. The
    only difference, between mv and cp is that cp leaves a copy behind while mv doesn''t.


    > Tip:

    mv can also be thought of as ''rename'' as well as ''move''.


    ```

    $ joe mv shelf-backup fireproofbox/shelf-backup

    $ joe ls -F

    fireproofbox/      shelf

    $ joe$

    ```


    Moving the backup copy to the fireproof box


    Again, two things to point out here. One is that ls -F tells you that the backup
    copy is definitely gone from its original location. The second point deals with
    the two arguments of mv. The first argument is the name of the file we are moving
    -- that''s easy to see. But what is with the second argument? There seems to be
    a slash in it. From our last lesson, we know that paths contain slashes. So must
    mean that we can use slashes and paths in all of our spells!


    What the mv spell did give the backup copy a new name, just like we wanted --
    a new name in another directory. And it used a path to do it! Think of it like
    you were physically placing the file inside a shortcut, your fireproof box.


    As a, you didn''t have to cast


    ```

    $ joe mv shelf-backup fireproofbox/shelf-backup

    ```'
