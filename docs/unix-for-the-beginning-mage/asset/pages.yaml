  md: '# Using Grep

    Another important spell in Unix is called grep. grep should have been called grab
    since what it does -- grabs text. Remember the shelf you made that stores all
    the spells you know in it? We''ll use it to practice casting grep on it.


    > Tip:

    grep actually stands for

    "Global Regular Expression" -- what a mouthful!


    ```

    joe$ cd /Users/joe/closet/spells

    joe$ grep d shelf

    mkdir

    cd

    joe$

    ```


    You know that spells like cat, more, and less, you can view the contents of the
    whole file. But if you only wanted to see spells that had the letter "d" in them?
    grep can do that for you!


    Casting grep


    As you can see, grep only printed out the spells with the letter "d" in them --
    just like we wanted! grep is a really easy spell to cast and it works even better
    with pipes.


    Pipes: the Coffee Filters of Spells

    Have you ever seen that vertical bar on your keyboard? The one above your enter
    key? This guy: I? Ever wonder what it was? It was called a pipe. What good is
    it for? Lots! What does it have in common with a coffee filter? Lots!


    Everyone knows what a coffee filter is used for: it''s that you put in your coffee
    machine so only the coffee gets to the pot and not the ground beans. Pipes do
    the same thing -- they only let things you want through.


    Say, for example, you cast


    ```

    joe$ ls /bin

    ```


    Casting a simple ls'
