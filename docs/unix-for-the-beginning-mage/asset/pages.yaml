- img_proc: true
  md: '# Chapter 5 Advanced Lesson


    By using ls -l, you''re able to see a lot of details about a file. One piece of
    information is what kind

    of the file it is. We''ll be going over the different types in this advanced lesson.


    Types of Files

    Remember from earlier, that the first dash in the permission set specifies the
    type of file.


    ```

    -rwx-xr-x 1 root wheel 581636 Mar 20 18:39 bash

    drwxr-xr-x 41 root wheel 1394 Jul 13 18:22 bin

    ```


    Here, we see that the first entry, bash, has just a dash. Therefore, we know it''s
    just a plain file. The

    second entry, however, has a d which stands for directory. There are a few other
    types besides

    plain file and directory.


    | Letter | What it is |

    | - | Plain File |

    | d | Directory |

    | l | Link |

    | p | Pipe |

    | b | Block Device |

    | c | Character Device |


    Plain File

    A File is just that -- a plain file. It can hold any type of information: from
    music to binary to just

    text. A file can also have the x action set on which it turns into a spell.


    Directory

    According to Unix, a Directory is nothing more than a file -- but a special file.
    I know it sounds like a

    catch-2, but it''s true. If a Directory is just a file, then what''s inside it?
    Special information about the

    files contained in the directory. Simply speaking, a Directory is kind of like
    a phone book. When you

    want access to a file, the shell will consult the Directory on how to reach the
    file. This is just another

    way the Shell abstracts the user from the strangeness of Unix -- by making it
    seem like we''re in an

    actual directory, but in fact, the Shell is just reading information from a file.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Link


    A Link is a file that points to another file. When you move, you can leave a change-of-address
    so any mail that goes to your old address gets forwarded to your new one. This
    is kind of a link.


    ```

    joe$ ls -l pico

    lrwwxrrwx 1 root root 9 Jul 22 08:51 pico -> /bin/nano

    joe$

    ```


    Example of a link


    There''s a couple things to notice about the Link:


    +   - It has the l at the beginning of the permissions

    - It has a rwx for User, Group, and Other

    - It shows an arrow that points to the real file

    - Its size is the number of characters of the real file (/bin/nano is 9 characters
    which equals this files size).


    If you were to run the command pico, the Shell will instead run the command /bin/nano
    without knowing.


    You can create links with the ln command. There are two types of links you can
    create, hard and soft (symbolic). A hard link is an exact clone of the file. It
    will not show the arrow in the example because the hard link thinks it''s a real
    file, not a pointer to another. A soft link is a separate file whose only job
    is to point to the correct file (think forwarding address).


    Here''s how you create a hard link:


    ```

    joe$ ln file1 file2

    joe$ ls -l file1 file2

    -rw-r--r-- 2 joe joe @ Jul 31 18:58 file1

    -rw-r--r-- 2 joe joe @ Jul 31 18:58 file2

    joe$

    ```


    Creating a hard link'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'See how both files think they''re separate, but they''re really exact twins.


    Here''s how you create a soft link:


    ```

    joe$ ln -s file1 file2

    joe$ ls -l file1 file2

    -rw-r--r-- 2 joe 0 Jul 31 19:01 file1

    lrwxxr-xr-x 1 joe joe 5 Jul 31 19:01 file2 -> file1

    joe$

    ```


    To create a soft link, you just use ln with the -s option. Notice how file2 has
    an arrow pointing to the file links to plus. It has the l in the permissions set.


    Why would you use one over the other? A hard link takes up no extra disk space
    but can''t span systems (see Chapter 4 Advanced Lesson). Conversely, a soft link
    takes up a few bytes of memory, but it can span filesystems.


    # Pipes


    In mini-golf, some of the holes have a pipe the ball goes down to get to another
    part. Pipes work the same way -- they connect two programs to share information.


    # Block Devices and Character Devices


    Both of these are device files -- meaning they interact with hardware. The difference
    is that a Block Device will read information in blocks while a Character Device
    reads information in a stream.


    What does it mean by “reading in blocks”? Think about putting your hand under
    running water. If you just let the water over your hand, that is like a Character
    Device and streams. However, if you cup your hands until they are full and let
    the water fall, that is a Block Device -- it reads a bunch of stuff then lets
    it all at once


    An example of a Block Device would be your hard drive and an example of a Character
    Device would be a modem.


    That covers just about everything with file types in Unix!'
  merge: -1
  pgno: 56
