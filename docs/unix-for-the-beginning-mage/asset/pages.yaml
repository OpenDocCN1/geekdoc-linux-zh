  md: '# Chapter 4 Advanced Lesson


    You just learned about the different floors to the Tower. While our Tower only
    has three floors, others can have as many as they need. These floors, as you know,
    are nothing but simple subdirectories, but some of them can be known as partitions.
    This is what we''ll cover in this advanced lesson.


    # Raging Rapids


    Let''s say you wake up one morning, grab a cup of coffee, and hear a rumbling.
    You open your front door only to see a huge tidal wave heading toward your house.
    You slam the door shut and start running upstairs. The water breaks in and instantly
    floods the whole first floor. It starts coming up to the second floor, so you
    run up to the attic. Before it reaches the attic, the water, thankfully, stops
    rising.


    Now imagine you had a water-proof hatch going to your second floor. When you climbed
    through it, you sealed the hatch and finished your cup of coffee with confidence.
    When the water rose to the second floor, the hatch prevented anything from coming
    in -- keeping all the water on the first floor.


    The hatch can be thought of as a partition. Partitions are invisible hatches in
    the filesystem that keep things from flooding over.


    What could flood over? Disk space! Let''s say a friend of yours (never you, of
    course) accidentally sign up for a mailing list that turns out to be spam. Now
    yo yo—your friend—has spam coming every 5 minutes! The well keeps coming in and
    taking more and more disk space on the computer. Later on, working on your research
    paper for the past four hours, decide to save it. When you hit "save", an error
    pops up saying "Out of Space! That''s because all that spam hog it. If you were
    to use partitions, you would not have run into that problem. That invisible hatch
    would kick in and say "Hey! Stop right there! You''ve used enough space, buddy,
    settle down!


    # Viewing Partitions


    You can use a command df to see the partitions on the computer. Here''s an example
    of df works:


    | joe df | |

    | Filesystem | 1K-blocks | Available Use% | Mounted on |

    |---|---|---|---||

    | /dev/sda3 | 256665 | 157316 | 86096 | 65% / |

    | /dev/sda1 | 101086 | 10982 | 84885 | 12% /boot |

    | /dev/sda8 | 1035660 | 33508 | 949544 | 4% /home |

    | /dev/sda5 | 3621020 | 614696 | 2822384 | 18% /usr |

    | /dev/sda6 | 2063540 | 362340 | 1596344 | 19% /var |

    | joe$ | | | |'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'There are several columns to df.


    +   1. Filesystem: These are the partitions. Sometimes they’re known as slices,
    too, because a partition slices up a hard drive into pieces. You can see which
    /dev files, as you learned during the Tour, /dev access hardware -- in this case,
    your hard drive.


    +   2. Available Space: This shows you how much total space is available on the
    slice in Kilobytes.


    +   3. Used Space: How much space has been used in Kilobytes.


    +   4. Available: How much space you have left. (Simply Available minus Used.)


    +   5. Used Percentage: Just a percentage representation of how much space is
    used.


    +   6. Mounted On: The directory of the partition.


    Since nobody reads in Kilobytes these days, you tell df to use a more readable
    format by specifying the -h option (which stands for Human Readable).


    | Filesystem | Size Used Avail Use% Mounted on |

    | /dev/sda3 | 251M 154M 85M 65% / |

    | /dev/sda1 | 99M 11M 83M 12% /boot |

    | /dev/sda8 | 1012M 33M 928M 4% /home |

    | /dev/sda5 | 3.5G 601M 2.7G 18% /usr |

    | /dev/sda6 | 2.0G 354M 1.6G 19% /var |


    > Using with the -h option


    Look a little easier to understand?


    Another command to use to view partitions is called fdisk. but only archmages
    should use it since it can break your hard drive if used the wrong way.


    # What Partitions Do


    Like I mentioned before, partitions help disk space from overflowing to other
    directories. Take a look at the /home partition in the df example. Right now,
    only 4% of the space is being used, but what if someone saved a file that took
    all available 928 megabytes up? Then it would look like this:'
  merge: -1
  pgno: 41
- img_proc: true
  md: '| Filesystem | Size | Used | Avail |% | Mounted |

    | --- | --- | --- | --- | --- | --- |

    | /dev/sda3 | 251M | 154M | 85M | 65% / | |

    | /dev/sda1 | 99M | 11M | 83M | 12% | /boot |

    | /dev/sda8 | 1012M | 1012M | 0M | 100% | /home |

    | /dev/sda5 | 3.5G | 601M | 2.7G | 18% | /usr |

    | /dev/sda6 | 2.0G | 354M | 1.6G | 19% | /var |


    # A partition with no space left


    As you can see, 100% of the space is used. Now whenever someone else tries saving
    a file, they will get an error. But notice the other partitions still have free
    space. This ensures that other things on the computer can still function properly
    though /home is full. Going back to the flood example, the /home room is full
    of water, but the waterproof hatch isn''t letting any water out to the other rooms.


    There are other uses for partitions, as well, such as security, mounting, and
    quotas. One security example is the ability to tell a partition that no commands
    that are located in the directory are allowed to be executed. With mounting, you
    are able to effectively move a whole partition (such as /home) to a new hard drive
    (for more space or if your hard drive dies, for example). And finally, with quotas,
    you''re able to restrict the amount of disk space each user is able to take up.


    You don''t need to use partitions when building your own Unix system -- if you''re
    building a computer for important work, it''s recommended that you do so.'
  merge: -1
