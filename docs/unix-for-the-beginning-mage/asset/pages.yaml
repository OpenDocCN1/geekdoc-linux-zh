  md: '# Chapter 7 Advanced Lesson


    Throughout the book, I''ve mentioned the concept of archmage quite a few times.
    Who and what are the architectures? Well, you''ll find out in this lesson!


    # Yet Another Root


    The first slash in the filesystem is known as root. Root is also the name of a
    user in a Unix system. Root has the ability to do anything -- he''s the most powerful
    user in the system. You can lock Root out of any files or directories, nor can
    you prevent him from running any commands. Root can do everything and anything
    in the Unix system -- get it?


    By the way, where''s Roots home directory? It''s not /home/root, it''s just /root
    -- there''s another root for you!


    # How To Become Root


    Although you can log in to your Unix system as root, there''s another way to use
    the root account - by switching to root using the su command. su stands for Switch
    User or Superuser or Substitute User -- take your pick. When you run su, you''ll
    be prompted for the root password. If you have not been given this password, then
    you obviously don''t have permission to use the root account!


    ```

    joe$ su

    Password: (output is not displayed)

    root#

    ```


    Using su to become root


    Notice how your prompt has now changed. Normally root is denoted by a # at the
    end of the prompt. You can also run su with a dash at the end. If you do so, you''ll
    inherit all of Roots specific variables (including the Path) -- but if you don''t,
    you''ll keep your own variables. The choice is yours!


    You can also change into other users using the su command -- of course, you need
    to be root first. To do that, just specify a dash and the logged in name of a
    user as an argument.


    ```

    root# su - merit

    merit$

    ```


    Using su to change to a different user'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'Some newer Unix systems (like Ubuntu and Mac OS X) that have moved away from
    the su command to a different root-enabling command called sudo. sudo allows you
    to run a single command as root instead of switching completely to root. This
    way, owners and administrators on the system can restrict certain root-only commands
    to certain people.


    ```

    joe$ sudo root_only_command

    Password: (output is not displayed)

    ```


    Using sudo to run root commands


    # The Wheel Group


    Some Unix systems have a special group called wheel. Only the group members of
    wheel may su to root and use the root capabilities.


    # Root''s UID


    Root has a UID of 0 -- this is the same across every Unix system. You can effectively
    duplicate the root account just by setting the UID of any other account to 0 in
    /etc/passwd. Keep an eye out for this, though, as it''s something regularly done
    by malicious people.


    And that''s about it for the Root account!'
  merge: -1
