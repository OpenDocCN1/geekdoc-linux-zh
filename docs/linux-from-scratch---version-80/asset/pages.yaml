  md: '# 6.71. About Debugging Symbols


    Most programs and libraries are, by default, compiled with debugging symbols included
    (with gcc -g option). This means when you are debugging a program or a library
    that was compiled with debugging information, the debugger can provide not only
    memory addresses, but also the names of the routines and variables.


    However, the inclusion of these debugging symbols enlarges a program or library
    significantly. The following is an example of the amount of space these symbols
    occupy:


    +   * A bash binary with debugging symbols: 1200 KB

    * A bash binary without debugging symbols: 480 KB

    * Glibc and GCC files (/lib and /usr/lib) with debugging symbols: 87 MB

    * Glibc and GCC files without debugging symbols: 16 MB


    Sizes may vary depending on which compiler and C library were used, but when comparing
    programs with and without debugging symbols, the difference will be a factor between
    two and five.


    Most users will never use a debugger on their system software, a lot of disk space
    can be regained by removing these symbols. The next section shows how to strip
    debugging symbols from the programs and libraries.


    # 6.72. Stripping Again


    If the intended user is not a programmer and does not plan to do any debugging
    on the system software, the size can be decreased by around 90 MB by removing
    the debugging symbols from binaries and libraries. This causes no inconvenience
    other than not being able to debug the software fully.


    Most people who use the command below will not experience any difficulties. However,
    it is easy to make a typo and render the new system unusable, so before running
    the strip command, it is a good idea to make a backup of the LFS system in its
    current state.


    Before stripping, special care to ensure that none of the binaries are to be stripped
    are running. If unsure whether the user entered chroot with the command in Section
    6.4, "Entering the Chroot Environment," first exit from chroot:


    logout


    Then reenter it with:


    ```

    chroot $LFS /tools/bin/env -i \\

    HOME=/root TERM=$TERM PS1=u:\w\$ \

    PATH=/bin:/usr/bin:/sbin:/usr/sbin \

    /tools/bin/bash --login

    ```


    Now the binaries and libraries can be safely stripped:


    ```

    /tools/bin/find /usr/lib -type f -name \*.a \

    -exec /tools/bin/strip --strip-debug {} '';''

    ```


    ```

    /tools/bin/find /lib/usr/lib -type f -name \*.so \

    -exec /tools/bin/strip --strip-unneeded {} '';''

    ```


    ```

    /tools/bin/find /(bin,sbin) /usr/(bin,sbin,libexec) -type f \

    -exec /tools/bin/strip --strip-all {} ''{}''

    ```'
