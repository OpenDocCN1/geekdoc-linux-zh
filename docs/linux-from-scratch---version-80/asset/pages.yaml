- img_proc: true
  md: '# Caution


    If the host system has a separate /boot partition, the files copied below should
    go there. The easiest way to do that is to bind /boot on the host to /mnt/lfs/boot
    before proceeding. As the root user in the host system:


    ```

    mount --bind /boot /mnt/lfs/boot

    ```


    The path to the kernel image may vary depending on the platform being used. The
    filename below can be changed to suit your case, but the stem of the filename
    should be vmlinux to be compatible with the automatic setup of the boot process
    described in the next section. The following command enables an x86 architecture:


    ```

    cp -v arch/x86/boot/bzivmlinux-4.9.9-lfs-8.0

    ```


    System.map is a symbol file for the kernel. It maps the function entry of every
    entry in the kernel API, as well as the addresses of the kernel data structures
    for the running kernel. It is used as a resource when investigating kernel problems.
    Issue the following command to install the map file:


    ```

    cp -v System.map /boot/System.map-4.9.9

    ```


    The configuration file .config produced by the make menuconfig step contains all
    the configuration selections for the kernel that was just compiled. It is a good
    idea to keep this file for future reference:


    ```

    cp -v .config /boot/config-4.9.9

    ```


    Install the documentation for the Linux kernel:


    ```

    install -d /usr/share/doc/linux-4.9.9

    cp -r Documentation/* /usr/share/doc/linux-4.9.9

    ```


    It is important to note that the files in the kernel source directory are not
    owned by root. Whenever a package is unpacked as root user (which we did inside
    root), the files have the user and group IDs of whatever they were on the packer''s
    computer. This is not a problem for any other package to be installed because
    the source tree is removed after the installation. However, the Linux source tree
    is often retained for a long time. Because of this, there is a chance that whatever
    user ID the package used will be assigned to somebody on the machine. That person
    would then have write access to the kernel source.


    # Note


    In many cases, the configuration of the kernel will need to be updated for packages
    that will be installed later in BLFS. Unlike other packages, it is not necessary
    to remove the kernel source tree after the newly built kernel is installed.


    If the kernel source tree is to be retained, run chown -R 0:0 on the linux-4.9.9
    directory to ensure all files are owned by user root.


    # Warning


    Some kernel documentation recommends creating a symlink from /usr/src/linux pointing
    to the kernel source directory. This is specific to kernels prior to the 2.6 series
    and must not be created on an LFS system as it can cause problems for packages
    you may wish to build once your base LFS system is complete.'
