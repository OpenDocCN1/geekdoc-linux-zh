- img_proc: true
  md: '# Chapter 8. Making the LFS System Bootable


    # 8.1. Introduction


    It is time to make the LFS system bootable. This chapter discusses creating an
    fstab file, building a kernel for the new LFS system, and installing the GRUB
    boot loader so that the LFS system can be selected for booting at startup.


    # 8.2. Creating the /etc/fstab File


    The /etc/fstab file is used by some programs to determine where file systems are
    to be mounted, by default, and which must be checked (for integrity errors) prior
    to mounting. Creating a new systems table like this:


    ```

    cat > /etc/fstab << "EOF"

    # Begin /etc/fstab

    # file system mount-point type    options             dump fsck order

    /dev/<xxx>  <fff> defaults       1 0

    /dev/<yyy> swap    swap       pri=1                0

    proc         /proc  proc       nosuid,noexec, nodev 0

    sysfs        /sys    sysfs     nosuid,noexec, nodev 0

    devpts       /dev/pts devpts      gid=5,mode=620      0

    tmpfs        /run    tmpfs     defaults             0 0

    devtmpfs     /dev    devtmpfs  mode=0755,nosuid 0

    # End /etc/fstab

    EOF

    ```


    Replace <xxx>, <yyy>, and <fff> with the values appropriate for the system, sda2,
    sda5, and ext 4.

    For details on the six fields in this file, see man fstab.


    Filesystems with MS-DOS or Windows origin (i.e: vfat, ntfs, smbfs, cifs, iso9660,
    udf) need the "iocharset" option in order for non-ASCII characters in file names
    to be interpreted. The value of this option should be the same as the character
    set of your locale, adjusted such that a kernel understands it. This works if
    the character set definition (found under Files -> Native Language Support) has
    been compiled into the kernel or built as a module. The "codepage" option is also
    needed for vfat and smbfs filesystems. It should be set to the codepage used by
    MS-DOS in your country. E.g., in order to mount USB flash drives, a ru_KOI8-R
    user would need the following in the options portion of their mount line in /etc/fstab:


    ```

    noauto,user,quiet, showexec, iocharset=koi8, codepage=866

    ```


    The corresponding options fragment for ru_RU_UTF-8 is:


    ```

    noauto,user,quiet, showexec, iocharset=utf8, codepage=866

    ```'
  merge: -1
