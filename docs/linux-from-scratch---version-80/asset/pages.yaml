    \ --prefix=/usr \\\n  --withmandir=/usr/share/man \\\n  --with-shared \\\n  --without-debug\
    \ \\\n  --without-normal \\\n  --enable-pc-files \\\n  --enable-wide\n```\n\n\
    The meaning of the new configure options:\n\n+   -enable-wide\nThis switches wide-character\
    \ libraries (e.g., libncursesw.so.6.0) to be built instead of normal ones (e.g.,\
    \ libncurses.so.6.0). These wide-character libraries are usable in multibyte and\
    \ traditional 8-bit locales, while normal libraries work properly in 8-bit locales.\
    \ Wide-character and normal libraries are source-compatible, but not binary-compatible.\n\
    --enable-pc-files\nThis switch generates and installs .pc files for pkg-config.\n\
    --without-normal\nThis switch disables building and installing most static libraries.\n\
    \nCompile the package:\n\n```\nmake\n```\n\nThis package has a test suite, but\
