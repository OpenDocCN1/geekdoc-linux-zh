    --host=$LFS_TGT \\

    --prefix=$tools \\

    --disable-multilib \\

    --disable-nls \\

    --disable-libstdccxx-threads-threads (Wait, the text says threads) \\

    --disable-libstdccxx-pch \\

    --with-gxx-include-dir=/tools/$LFS_TGT/include/c++/6.3.0

    ```


    The meaning of the configure options:


    +   --host=...

    Indicates to use the cross compiler we have just built instead of the one in `/usr/bin`.

    --disable-libstdccxx-threads

    Since we have not yet built the C threads library, the C++ one cannot be either.

    --disable-libstdccxx-pch

    This switch prevents the installation of precompiled include files, which are
    not needed at this stage.

    --with-gxx-include-dir=/tools/$LFS_TGT/include/c++/6.3.0

    This is the location where the standard include files are searched by the C++
    compiler. In a normal build, this information is automatically passed to the Libstdcc++
    `configure` options from the top level directory. In our case, this information
    must be explicitly given.


    Compile Libstdcc++ by running:


    ```

    make

    ```


    Install the library:


    ```

    make install

    ```'
