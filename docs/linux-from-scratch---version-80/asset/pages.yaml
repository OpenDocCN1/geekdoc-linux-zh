  md: '# 1.5.1. Things to Mention


    Apart a brief explanation of the problem being experienced, the essential things
    to include in any request for help are:


    +   - The version of the book being used (in this case 8.0 )

    - The host distribution and version being used to create TFS

    - The output from the Host System Requirements script

    - The package or section the problem was encountered in

    - The exact error message or symptom being received

    - Note whether you have deviated from the book at all


    > Deviating from this book does not mean that we will not help you. After all,
    TFS is about personal preference. Being upfront about any changes to the established
    procedure helps us evaluate and determine possible causes of your problem.


    # 1.5.2. Configure Script Problems


    If something goes wrong while running the configure script, review the config.log
    file. This file may contain errors encountered during configure review the relevant
    lines if you need to ask for help.


    # 1.5.3. Compilation Problems


    Both the screen output and the contents of various files are useful in determining
    the cause of compilation problems. The screen output from the configure script
    and the make run can be helpful. It is not necessary to include the entire output,
    but do include each of relevant information. Below is an example of the information
    to include from your screen make:


    ```

    gcc -DALIASPATH="/mnt/lfs/usr/share/locale:\"

    -DLOCALEDIR="/mnt/lfs/usr/share/locale\"

    -DLDBDIR="/mnt/lfs/usr/lib\"

    -DINCLUDED="/mnt/lfs/usr/include\" -DHAVE_CONFIG_H -I. -I.

    -g -o2 -c getopt1.c

    gcc -g -o2 -static make -o arscan commands.o dir.o

    expand.o file.o getopt implicit.o job main.o

    misc.o read.make rule.o variable.o vpath.o

    default.o remote-stub.o version.o opt1.o-. In function load_too_high:

    /lfs/tmp/make-3.79.1/job.c:1565: undefined reference

    to ''getocldagav''

    collect2: 13 returned 1 status

    make[2]: *** [make] Error 1

    make[2]: Leaving directory ''/lfs/tmp/make-3.79.1/

    make[1]: *** [all-recursive] Error 1

    make[1]: Leaving directory ''/lfs/tmp/make-3.79.1/

    make: *** [all-recursive-am] Error 2

    ```'
