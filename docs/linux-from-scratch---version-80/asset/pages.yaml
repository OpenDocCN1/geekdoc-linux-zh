  md: 'Verify that the compiler is searching for the correct header files:


    ```

    grep -B1 ''^ /usr/include'' dummy.log

    ```


    This command should return the following output:


    ```

    #include <...> search starts here:

    /usr/include

    ```


    Next, verify that the linker is being used with the correct search paths:


    ```

    grep ''SEARCH.*/usr/lib'' dummy.log | sed ''s|;\n|g''

    ```


    References to paths that have components with ''-linux-gnu'' should be ignored,
    but otherwise the output of the last command should be:


    ```

    SEARCH_DIR("/usr/lib")

    SEARCH_DIR("/lib")

    ```


    Next make sure we''re using the correct libc:


    ```

    grep "/lib*/libc.so.6 " dummy.log

    ```


    The output of the last command should be:


    ```

    attempt to open /lib/libc.so.6 succeeded

    ```


    Lastly, make sure GCC is using the correct dynamic linker:


    ```

    grep found dummy.log

    ```


    The output of the last command should be (allowing for platform-specific differences
    in dynamic linker):


    ```

    found ld-linux-x86-64.so.2 at /lib/ld-linux-x86-64.so.2

    ```


    If the output does not appear as above or is not received at all, then something
    is seriously wrong. Investigate

    and retrace the steps to find out the problem is and correct it. The most likely
    reason is that something went

    wrong with the file adjustment. Any issues will need to be resolved before continuing
    on with the process.

    Once everything working correctly, clean up the test files:


    ```

    rm -v dummy.c a.out dummy.log

    ```'
