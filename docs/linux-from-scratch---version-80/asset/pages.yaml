    # # Prerequisites


    Building an LFS system is not a simple task. It requires a certain level of knowledge
    of Unix system administration in order to resolve problems and correctly execute
    the commands listed. In particular, as an absolute novice, you should always have
    the ability to use the command line (shell) to copy or move files and directories,
    directory file and contents, and change the current directory. It is also expected
    that you have a reasonable knowledge of using and installing Linux software.


    Because the LFS book looks least this basic level of skill, the various LFS support
    forums are unlikely to be provide you with much assistance in these areas. You
    will find that your questions regarding such knowledge will likely go unanswered
    or you will be referred to the LFS essential pre-reading list.


    Before building an LFS system, we recommend the following:


    +   * Software-Building-HOWTO http://www.tld.org/HOWTO/Software-Building-HOWTO.html


    This is a comprehensive guide to building and installing "generic" Unix software
    packages over Linux. Although it was written some time ago, it still provides
    a good summary of the basic techniques needed to build and install software.


    +   * Beginner''s Guide to Installing from Source http://mei.vonos.net/linux/beginners-installing-from-source/


    This guide provides a good summary of basic skills and techniques needed to build
    software from source code.


    # # Typography


    To make things easy to follow, there are a few typographical conventions used
    throughout this book. This section contains some examples of the typographical
    format throughout Linux From Scratch.


    ```

    ./configure --prefix=/usr

    ```


    This form of text is designed to be typed exactly as unless otherwise noted in
    the surrounding text. It is also used in the explanation sections to identify
    which of the commands are being referenced.


    In some cases, a logical line is extended to two or more physical lines with a
    backslash at the end of the line.


    ```

    CC=gcc -B/usr/bin/../binutils-2.18/configure \ --prefix=/tools --disable-nls --disable-werrorror

    ```


    Note that the backslash must be followed by an immediate return. Other whitespace
    characters like space or tab will create incorrect results.


    ```

    install-info: unknown option ''--dir-file=mnt/lfs/usr/info/dir/

    ```


    This form (fixed-width text) shows screen output, usually as the result of commands
    issued. This format is also used to show filenames, such as /etc/ld.so.conf.


    *Emphas*


    This form of text is used for several purposes in the book. Its main purpose is
    to emphasize important points or items.


    http://www.linuxfromscratch.org/'
