  md: '# 6.67. Man-DB-2.7.6.1


    The Man-DB package contains programs for finding and viewing man pages.


    Approximate build time: 0.4 SBU

    Required disk space: 30 MB


    # 6.67.1. Installation of Man-DB


    Prepare Man-DB for compilation:


    ```

    ./configure --prefix=/usr \

    --docdir=/usr/share/doc/man-db-2.7.6.1 \

    --sysconfdir=/etc \

    --disable-setuid \

    --enable-cache-owner=bin \

    --with-browser=/usr/bin/lynx \

    --with-vgrind=/usr/bin/vgrind \

    --with-grap=/usr/bin/grap \

    --with-systemdtmpfilesdir=

    ```


    The meaning of the configure options:


    +   --disable-setuid

    This disables making the man program setuid to user man.

    --enable-cache-owner=bin

    This makes the system-wide cache files owned by user bin.


    --with...

    These parameters are used to set some default parameters. lynx is a text-based
    browser (see BLFS for installation instructions), vgrind converts programs to
    Groff input, and grap is used for typesetting graphs in Groff Documents. The vgrind
    and grap programs are not normally needed for viewing manual pages. They are not
    part of LFS or BLFS, but you should be able to install them yourself after finishing
    LFS if you wish to do so.


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


    # 6.67.2. Non-English Manual Pages in LFS


    The following table shows the character set that Man-DB assumes manual pages installed
    under /usr/share/man/<11> will be encoded with. In addition to this, Man-DB correctly
    determines if manual pages installed in that directory are UTF-8 encoded.'
