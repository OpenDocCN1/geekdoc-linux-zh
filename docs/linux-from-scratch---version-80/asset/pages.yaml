- img_proc: true
  md: '# Linux From Scratch - Version 8.0


    +   - When entering chroot, the LFS environment variable must be set for root.
    The LFS variable is not used otherwise.


    +   - The virtual file systems must be mounted. This can be done before or after
    entering chroot by changing to a host virtual terminal, and as root, running the
    commands in Section 6.2.2,"Mounting and Populating /dev" and Section 6.2.3,"Mounting
    Virtual File Systems"


    # 2.4. Creating a New Partition


    Like other operating systems, LFS is usually installed on a dedicated partition.
    The recommended approach to building an LFS system is to use an unpartitioned
    space, if you have enough space, to create one.


    A minimal system requires a partition of around 6 gigabytes (GB). This is enough
    to store all the source tarballs and packages. However, if the LFS is intended
    to be the primary Linux system, additional software will probably be installed
    which will require additional space. A 20 GB partition is a reasonable size for
    growth. The LFS system will not take this much room. A large portion of this partition
    is required to provide free temporary storage as well as for adding additional
    capabilities after LFS is complete. Additionally, compiling packages can require
    a lot of disk space which will be reclaimed after the partition is installed.


    Because there is not enough Random Access Memory (RAM) for compilation processes,
    it is good to use a small swap space. This space is used by the kernel to store
    seldom-used data and leave more memory for active processes. The swap partition
    for an LFS system can be the same as the one used by your system, if it is not
    necessary to create another.


    Start a partitioning program using cfdisk or fdisk with a command line option
    naming the hard disk on the new partition will be created—for example /dev/sda
    for the primary Integrated Drive Electronics (IDE) disk. Create a Linux native
    partition and a swap partition, if needed. Please refer to cfdisk (8) or fdisk
    (8) if you do not know how to use the programs.


    > Note


    > For experienced users, other partitioning schemes are possible. The new LFS
    system can be on a software RAID array or LVM logical volume. However, some of
    these options require initramfs, which is an advanced topic. These partitioning
    methodologies are not recommended for first time LFS users.


    Remember the designation of the new partition (e.g., sda5). This will refer to
    the LFS partition. Also remember the designation of the swap partition. These
    names will be needed later for /etc/fstab.


    # 2.4.1. Other Partition Issues


    Requests for advice on system partitioning are often posted on the LFS mailing.
    This is a highly subjective topic. The default for most distributions is to use
    the entire drive with the exception of one swap partition. This is not optimal
    for LFS for several reasons. It reduces flexibility, makes sharing of data across
    multiple distributions or LFS builds more difficult, takes up more time, and can
    waste space through inefficient allocation of file system structures.


    # 2.4.1.1. The Root Partition


    A root partition (not to be confused with the /root directory) of ten gigabytes
    is a good compromise for most systems. It provides enough space to build LFS and
    most of BLFS, but is small enough so that multiple partitions can be easily created
    for experimentation.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# 2.4.1.2. The Swap Partition


    Most distributions automatically create a swap partition. Generally the recommended
    size of the swap partition is about twice the size of physical RAM, however this
    is rarely needed. If disk space is limited, hold the swap partition to two gigabytes
    and monitor the amount of disk swapping.


    Swapping is never good. You can generally tell if a system is swapping by listening
    to disk activity and observing how the system reacts to commands. The first reaction
    to swapping should be to check for an unreasonable command such as editing a five
    gigabyte file. If swapping becomes a normal occurrence, the best solution is to
    purchase more RAM for your system.


    # 2.4.1.3. The Grub Bios Partition


    If the boot disk has been partitioned with a GUID Partition Table (GPT), then
    a small, typically 1 MB, partition must be created if it does not already exist.
    This partition is not formatted, but must be available for GRUB to use during
    installation of the boot loader. This partition will normally be labeled ''BIOS
    Boot'' if you have a disk of type EF02 or use gdisk.


    > The Grub Bios partition must be on the drive that the BIOS uses to boot the
    system. This is not necessarily the same drive where the LFS root partition is
    located. Disks on a system may use different partition table types. The requirement
    for this partition depends only on the partition type of the boot disk.


    # 2.4.1.4. Convenience Partitions


    There are other partitions that are not required, but should be considered when
    designing a disk layout. The following list is not comprehensive, but is meant
    as a guide.


    +   * boot – Highly recommended. Use this partition to store kernels and other
    booting information. To minimize potential boot problems with larger disks, make
    this first physical partition on your first disk drive. A partition size of 100
    megabytes is quite adequate.

    * home – Highly recommended. Share your home directory and user customization
    across multiple distributions or LFS builds. The size is generally large and depends
    on available disk space.

    * usr – A separate /usr partition is generally used if providing a server for
    a client or diskless workstation. It is not needed for LFS. A size of 5 gigabytes
    will handle most installations.

    * opt – This directory is most useful for BLFS where multiple installations of
    packages like Gnome or KDE can be installed without embedding the files in the
    /usr hierarchy. Using 5 to 10 gigabytes is generally adequate.

    * tmp – A separate /tmp directory is rare, but useful if configuring a thin partition.
    It, if used, will not need to exceed a couple of gigabytes.

    * usr/src – This partition is very useful for providing a location to store BLFS
    source files and share them across LFS builds. It can also be used as a location
    for building BLFS packages. A reasonably large partition of 30-50 gigabytes allows
    plenty of room.


    Any partition that you want automatically mounted boot must be in the /etc/fstab.
    Details about how to specify partitions will be discussed in Section 8.2, “Creating
    the /etc/fstab File”.'
