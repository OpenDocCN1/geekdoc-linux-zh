    \n```\nfor lib ncurses menu; do\n  rm -vf /usr/lib/lib${lib}.so\n  echo \"INPUT-${lib}w\"\
    \ > /usr/lib/lib${lib}.so\n  ln -sf ${lib}w.pc /usr/lib/pkgconfig/${lib}.pc\n\
    done\n```\n\nFinally, make sure old applications that use -lcurses at build time\
    \ are buildable:\n\n```\nrm -vf /usr/lib/libcurses.so\necho \"INPUT-(ncursesw)\"\
