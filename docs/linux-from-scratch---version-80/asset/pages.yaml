  md: "# # 6.50. Coreutils-8.26\n\nThe Coreutils package contains utilities for showing\
    \ and setting the basic system characteristics.\n\n**Approximate build time:**\
    \ 3.1 SBU\n**Required disk space:** 173 MB\n\n# ## 6.50.1. Installation of Coreutils\n\
    \nPOSIX requires that programs from Coreutils recognize character boundaries correctly\
    \ even in multibite locals. The following patch fixes this non-compliance and\
    \ other internationalization-related bugs.\n\n```\npatch -Npl -i ../coreutils-8.26-i18n-1.patch\n\
    ```\n\n> > Note\nIn the past, many bugs were found in this patch. When reporting\
    \ new bugs to Coreutils maintainers, please check if they are reproducible without\
    \ this patch.\n\nSuppress a test on which some machines can loop forever:\n\n\
    ```\nsed -i '/test.lock/$s/^/#/' gnulib-tests/gnulib\n```\n\nNow prepare Coreutils\
    \ for compilation:\n\n```\nFORCE_UNSAFE_CONFIGURE=1 ./configure \\\n  --prefix=/usr\
    \ \\\n  --enable-no-install-program=kill, uptime\n```\n\nThe meaning of the configure\
    \ options:\n\n```\nFORCE_UNSAFE_CONFIGURE=1\nThis environment variable allows\
    \ the package to be built as the root user.\n--enable-no-install-program=kill,\
    \ uptime\nThe purpose of this switch is to prevent Coreutils from installing binaries\
    \ that will be installed by other packages\nlater.\n```\n\nCompile the package:\n\
    \n```\nFORCE_UNSAFE_CONFIGURE=1 make\n```\n\nSkip to \"Install the package\" if\
    \ not running the test suite.\n\nNow the test suite is ready to run first. The\
    \ tests that are meant to be run as user root:\n\n```\nmake NON_ROOT_USERNAME=nobody\
    \ check-root\n```\n\nWe're going to run the remainder of the tests as the nobody\
    \ user. Certain tests, however, require that the user be a member of more than\
    \ one group. So that these tests are not skipped we'll add a temporary group and\
    \ make the user nobody a part of it:\n\n```\necho \"dummy\":x:1000:nobody\" >>\
    \ /etc/group\n```"
