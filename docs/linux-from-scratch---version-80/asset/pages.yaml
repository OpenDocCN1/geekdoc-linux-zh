    # 6.65.2. Configuring Udev


    Information about hardware devices is maintained in the /etc/udev/hwdb.d and /usr/lib/udev.d
    directories. Udev needs information to be compiled into a binary database /etc/udev/hwdb.bin.
    Create the initial database:


    ```

    LD_LIBRARY_PATH=/tools/lib udevadm hwdb --update

    ```


    This command needs to be run each time the hardware information is updated.


    # 6.65.3. Contents of Udev


    +   * Installed programs: udevadm and udevd

    * Installed libraries: libudev.so

    * Installed directories: /etc/udev, /lib/udev, and /usr/share/doc/udev-20140408


    # Short Descriptions


    +   * **udevadm**: Generic udev administration tool: controls the udev daemon,
    provides info from the Udev database, monitors uevents, waits for uevents to finish,
    tests Udev configuration, and triggers uevents for a given device

    * **udevd**: A daemon that listens for uevents on the netlink socket, creates
    devices and runs the configured external programs in response to these

    * **libudev**: A library interface to udev device information

    * **/etc/udev**: Contains Udev configuration files, device permissions, and rules
    for device naming'
