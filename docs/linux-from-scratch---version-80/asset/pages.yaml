  md: '# Linux From Scratch - Version 8.0


    This format is used for hyperlinks both within the LFS community and external
    pages. It includes HOWTOs, download locations, <<EOF|


    ```

    cat $LFS/etc/group << "EOF"

    root:x:0:

    bin:x:1:

    ...

    EOF

    ```


    This format is used when creating configuration files. The first command tells
    the system to create the file $LFS/etc/group from whatever is typed on the following
    lines until the sequence End Of File (EOF) is encountered. Therefore, this entire
    section is generically typed


    <REPLACED TEXT>


    This format is used to encapsulate text that is not to be seen or for copy-paste-and
    operations.


    [OPTIONAL TEXT]


    This format is used to encapsulate text that is optional.


    passwd(5)


    This format is used to refer to a specific manual (man page). The number inside
    parentheses indicates a specific section inside the manuals. For example, passwd
    has two pages. For LFS installation instructions, those two pages will be located
    at /usr/share/man/1/passwd.1 and /usr/share/man5/passwd.5. When the book uses
    passwd(5) it is specifically referring to /usr/share/man5/passwd.5. man passwd
    will print the first page if it finds matches "passwd", which will be /usr/share/man/1/passwd.1.
    For this example, you will need to run man 5 passwd in order to read the specific
    page being referred to. It should be noted that most man pages do not duplicate
    page names in different sections. Therefore, man <program name> is generally sufficient.


    # Structure


    This book is divided into the following parts.


    # Part I - Introduction


    Part I explains a few important notes on how to proceed with the LFS installation.
    This section also provides information about the book.


    # Part II - Preparing for the Build


    Part II describes how to prepare for the building process—making a partition,
    downloading the packages, and compiling temporary tools.


    # Part III - Building the LFS System


    Part III guides the reader through the building of the LFS system—compiling and
    installing all the packages by one, setting up the boot scripts, and installing
    the kernel. The resulting Linux system is the foundation on which other software
    can be built to expand the system as desired. At the end of this book, there is
    easy to use reference listing all of the programs, libraries, and important files
    that have been installed.'
