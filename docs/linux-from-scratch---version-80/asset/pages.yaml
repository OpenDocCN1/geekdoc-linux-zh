  md: '# Linux From Scratch - Version 8.0


    sic -L leapseconds ...nThis creates right time zones, including leap seconds.
    On an embedded system, where space is tight and you do not intend to ever update
    the time zones, or care about the correct time, you could save 1.9MB by omitting
    the right directory.


    sic ... -P

    This creates the posixrules file. We use New York because POSIX requires the daylight
    saving time rules to be in accordance with US rules.


    One way to determine the local time zone is to run the script:


    ```

    tzselect

    ```


    After answering a few questions about the location, the script will output the
    name of the time zone (e.g., America/Edmonton). There are also other possible
    time zones listed in /usr/share/zoneinfo such as Canada/Eastern or EST5ED that
    are not identified by the script but can be used.


    Then create the /etc/localtime file by running:


    ```

    cp -v /usr/share/zoneinfo/<xxx> /etc/localtime

    ```


    Replace <xxx> with the name of the time zone selected (e.g., Canada/Eastern).


    # 6.9.2.3. Configuring the Dynamic Loader


    By default, the dynamic loader (/lib/ld-linux.so.2) searches through /lib and
    /usr/lib for dynamic libraries that are needed by programs as they run. However,
    if there are libraries in directories other than /lib and /usr/lib, these need
    to be added to the /etc/ld.so.conf file in order for the dynamic loader to find
    them. Two directories are known to contain additional libraries are /usr/local/lib
    and /opt/lib, so add those directories to the dynamic loader''s search path.


    Create a new file /etc/ld.so.conf by running the following:


    ```

    cat > /etc/ld.so.conf << "EOF"

    # Begin /etc/ld.so.conf

    /usr/local/lib

    /opt/lib


    EOF

    ```


    If desired, the dynamic loader can also search a directory and include the contents
    of files found. Generally the files in this directory are one line specifying
    the desired library path. To add this capability run the following commands:


    ```

    cat >> /etc/ld.so.conf << "EOF"

    # Add an include directory

    include /etc/ld.so.conf/*.conf


    EOF

    mkdir -pv /etc/ld.so.conf.d

    ```'
