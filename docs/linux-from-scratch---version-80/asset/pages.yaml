  md: '# LFS and Standards


    The structure of LFS follows Linux standards as closely as possible. The primary
    standards are:


    +   - POSIX.1-2008.


    +   - Filesystem Hierarchy Standard (FHS) Version 3.0


    +   - Linux Standard Base (LSB) Version 5.0


    The LFS has four separate sections: Core, Desktop, Runtime Languages, and Imaging.
    In addition to generic requirements there are also architecture specific requirements.
    There are also two areas for trial use: Gtk3 and Graphics. LFS attempts to conform
    to the architectures discussed in the previous section.


    # Note


    > Many do not agree with the requirements of the LSB. The main purpose of defining
    it is to ensure that proprietary software will be able to install and run properly
    on a compliant system. Since LFS is source based, the user has complete control
    over what packages are desired and many choose not to install packages that are
    supplied by the LSB.


    Creating complete LFS system capable of passing the LSB certifications tests is
    possible, but not without many additional packages that are beyond the scope of
    LFS. These additional packages have installation instructions in BLFS.


    # Packages supplied by LFS needed to satisfy the LSB Requirements


    LSB Core:


    Bash, Bc, Binutils, Coreoutils, Diffutils, File, Findinduts, Gawk, Grep, Gzip,
    M4, Man-DB, Ncurses, Propcs, Psmisc, Sed, Shadow, Tar, Util-linux, Zlib


    LSB Desktop:


    None


    LSB Runtime Languages:


    Perl


    LSB Imaging:


    None


    LSB Gtk3 and LSB Graphics (Trial Use):


    None


    # Packages supplied by BLFS needed to satisfy the LSB Requirements


    LSB Core:


    At, Atk (a part of At), Cpio, Ed, Fcrontab, Init-tools, Lsb_release, NSPR, NSS,
    PAM, Pax, Sendmail (or Postfix or Exim), time


    LSB Desktop:


    Als, Cairo, Desktop-file-utils,freetype, Config, Gdk-pixbuf, Glib2, GTK+2, Icon-naming,
    Libjpeg-turbo, Libpng, Libtiff, Libxml2, MesaLib, Pango, Qt4, Xdg-utils, Xorg


    LSB Runtime Languages:


    Python, Libxml2, Libxslt


    LSB Imaging:


    CUPS, Cups-filters, Ghostscript, SANE


    LSB Gtk3 and LSB Graphics (Trial Use):


    GTK+3


    # Packages not supplied by LFS or BLFS needed to satisfy the LSB Requirements


    LSB Core:


    None'
