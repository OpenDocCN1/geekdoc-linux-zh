    unpacked source. If using shadowing, keep in mind that programs which need to
    verify passwords (display managers, FTP programs, pop3 daemons, etc.) must be
    Shadow-compliant. That is, they need to be able to work with shadowed passwords.


    To enable shadowed passwords, run the following command:


    ```

    pwconv

    ```


    To enable shadowed group passwords, run:


    ```

    grpconv

    ```


    Shadow''s configuration for the userrad utility has a few caveats that need some
    explanation. The first action for the userrad utility is to create the user and
    a group of the same name as the user. By default the user ID (UID) and group ID
    (GID) numbers will begin with 1000. This means if you don''t pass parameters to
    userrad, each user will be a member of the group system. This behavior is undesirable,
    you''ll need to pass the -g parameter to userrad. The default parameters are stored
    in the /etc/default/useradd file. You may need to modify two parameters in this
    file to suit your needs.


    /etc/default/useradd Parameter Explanations


    GROUP=1000

    This parameter sets the beginning of the group numbers used in the /etc/group
    file. You can modify it to anything you desire. Note that userrad will never reuse
    a UID or GID If the number identified in this parameter is used, it will use the
    next available number after this. Also note that if you don''t have a group 1000
    on your system the first time you use userrad without the -g parameter, you''ll
    get a message displayed on the terminal that says: userrad: unknown GID 1000.
    You may disregard this message and group number 1000 will be used.


    CREATE_MAILPOOL=yes

    This parameter causes userrad to create a mailbox file for the newly created user.
    userrad will make the group ownership of this file to the mail group with 0660
    permissions. If you would prefer that these mailbox files are not created by userrad,
    issue the following command:


    ```

    sed -i ''s/yes/no/'' /etc/default/useradd

    ```


    # 6.25.3. Setting the root password


    Choose a password for root user and set it by running:


    ```

    passwd root

    ```'
