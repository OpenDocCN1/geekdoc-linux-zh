  md: '# ## 55. GRUB-2.02-beta3


    The GRUB package contains the GRand Unified Bootloader.

    Approximate build time: 0.8 SBU

    Required disk space: 142 MB


    # ### 6.55.1. Installation of GRUB


    Prepare GRUB for compilation:


    ```

    ./configure --prefix=/usr

    --sbindir=/sbin

    --sysconfdir=/etc

    --disable-efiemu

    --disable-werror

    ```


    The meaning of the new configure options:


    +   --disable-werror

    This allows the build to complete with warnings introduced by more recent Flex.

    --disable-efiemu

    This option minimizes what is built by disabling a feature and testing programs
    not needed for LFS.


    Compile the package:


    ```

    make

    ```


    This package does not come with a test suite.


    Install the package:


    ```

    make install

    ```


    Using GRUB to make your L system bootable will be discussed in Section 8.4, "Using
    GRUB to Set Up the Boot Process".


