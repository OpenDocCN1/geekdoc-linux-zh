  md: '# Appendix C. Dependencies


    Every package built in LFS relies on one or more packages to build and install
    properly. Some packages even participate in circular dependencies, that is, the
    first depends on the second which depends on the first. Because of these dependencies,
    the order in which packages are built in LFS is very important. The purpose of
    this page is to document the dependencies of each package built in LFS.


    For each package we build, we have listed three, and sometimes four, types of
    dependencies. The first list lists what packages need to be available in order
    to compile and install the package in question. The second list lists what packages,
    in addition to those on the first list, need be available in order to run the
    test suites. The third list of dependencies are packages that require this package
    to be built and installed in its final location before they are built and installed.
    In most cases, this is because packages will hard code paths to binaries within
    their scripts. If not in a certain order, this could result in /tools/bin/[binary]
    being placed inside installed on the final system. This is obviously not desirable.


    The last list of dependencies are optional packages that are not addressed in
    LFS, but could be useful to the user. These packages may have additional mandatory
    or optional dependencies of their own. For these dependencies, the recommended
    practice is to install them after completion of the LFS book and then go back
    and rebuild the LFS package. In several cases, re-installation is advised in BLFS.


    # acl


    +   * Installation depends on: Attr, Binutils, Coreutils, GCC, Ggetext, Grep,
    M4, Make, Perl, Sed, and Texinfo

    * Test suite depends on: Automake, Diffutils, Findutils, and Libtool

    * Must be installed before: Coreutils, Sed, Tar, Vim

    * Optional dependencies: None


    # attr


    +   * Installation depends on: Bash, Binutils, Coreutils, GCC, Ggetext, Grep,
    M4, Make, Perl, Sed, and Texino

    * Test suite depends on: Automake, Diffutils, Findutils, and Libtool

    * Must be installed before: Acl, Libcap

    * Optional dependencies: None


    # Autoconf


    +   * Installation depends on: Bash, Coreutils, Grep, M4, Make, Perl, Sed, and
    Texinfo

    * Test suite depends on: Automake, Diffutils, Findutils, GCC, and Libtool

    * Must be installed before: Automake

    * Optional dependencies: Emacs


    # Automake


    +   * Installation depends on: Autoconf, Bash, Coreutils, Ggetext, Grep, M4, Make,
    Perl, Sed, and Texinfo

    * Test suite depends on: Binutils, Bison, Bzip2, DejaGNU, Diffutils, Expect, Findutils,
    Flex, GCC, Ggetext, Gzip, Libtool, and Tar.

    * Must be installed before: None

    * Optional dependencies: None'
