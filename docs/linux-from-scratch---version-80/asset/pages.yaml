  md: '# Chapter 2. Preparing the Host System


    # 2.1. Introduction


    In this chapter, the host tools needed for building LFS are checked and, if necessary,
    installed. Then a partition which will host the LFS system is prepared. We will
    create the partition itself, create a file system on it, and mount it.


    # 2.2. Host System Requirements


    Your host system should have the following also with the minimum versions indicated.
    This should not be an issue for most Linux distributions. Also note many distributions
    will place headers into separate packages, often in the form of "<package-name>-devel"
    or "<package-name>-dev". Be sure to install those if your distribution provides
    them.


    Earlier versions of the listed software packages may work, but have not been tested.


    +   - Bash-3.2 (/bin/sh should be a symbolic or hard link to bash)

    - Binutils-2.17 (Versions greater than 2.27 are not recommended as they have not
    been tested)

    - Bison-2.3 (/usr/bin/yacc should be a link to bison or small script that executes
    bison)

    - Bipz2-1.0.4

    - Coreutils-6.9

    - Diffutils-2.8.1

    - Findutils-4.2.31

    - Gawk-4.0.1 (/usr/bin/awk should be a link to gawk)

    - GCC-4.7 including the C++ compiler, g++ (Versions greater than 6.3.0 are not
    recommended as they have not been tested)


    > Note On some distributions, there have been reports that some libraries used
    by gcc can be in an inconsistent state and that this interferes with building
    some LFS packages. To check this, look in /usr/lib and possibly /usr/lib64 for
    libjmp, libmpfr, and libmpc. Either three should be present or absent, but not
    only one or two. If the problem exists on your system, rename or delete the .la
    files or install the missing package.


    +   - Glibc-2.25 (Versions greater than 2.25 are not recommended as they have
    not been tested)

    - Grep-2.5.1a

    - Gzip-1.3.12

    - Linux Kernel-2.6.32


    The reason for the kernel version requirement is that we specify that version
    when building glibc in Chapter 6 at the recommendation of the developers. It is
    also required by udev.


    If the kernel is 2.6.32 you will need to replace the kernel with a more up to
    date. There are two ways you can go about this. First, see if your Linux vendor
    provides a 2.6.32 or later kernel package. you may wish to install it. If your
    vendor doesn''t offer an acceptable kernel package, or if you prefer not to install
    it, you can compile a kernel yourself. Instructions for compiling the kernel and
    configuring the boot loader (assuming the host uses GRUB) are located in Chapter
    8.'
