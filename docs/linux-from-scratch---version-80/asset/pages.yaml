  md: '# Linux From Scratch - Version 8.0


    +   - The temporary libraries will be cross-compiled. Because a cross-compiler
    by its nature cannot rely on anything from its system, this method removes potential
    contamination of the target system by lessening the chance of headers or libraries
    from the host being incorporated into the new tools. Cross-compilation also allows
    for the possibility of building both 32-bit and 64-bit libraries on 64-bit capable
    hardware.


    +   - Careful manipulation of the GCC source will configure the target which dynamic
    linker will be used.


    Binutils is installed first because the configure runs of both GCC and Glibc perform
    various features on the assembler and linker to determine which software features
    enable or disable. This is more important than one first realize. An incorrectly
    configured GCC or Glibc can result in a subtly broken toolchain, where the impact
    of such breakage might not show up until the end of the build of an entire distribution.
    A test suite will highlight this before too much additional work is performed.


    Binutils installs its assembler and linker in two locations:/tools/bin and $LFS_TGT.
    The tools in one location are linked to the host. An important facet of the linker
    is its search order. Detailed information can be obtained from ld by passing the
    --verbose flag. For example, ld --verbose | grep SEARCH will illustrate the search
    paths and their order. By compiling a dummy program and passing the --verbose
    switch to the linker. For example, gcc dummy.c -Wl,--verbose 2>&1 | grep succeeded
    will show all the files opened during the linking.


    The next package is GCC. An example of what can be seen during the run of configure
    is:


    ```

    checking assembler to use.../tools/i686-lfs-linux-gnu/bin/as

    checking linker to use.../tools/i686-lfs-linux-gnu/bin/ld

    ```


    This is for the reasons mentioned above. It also demonstrates that GCC''s configure
    script does not show the PATH directories to which to use. During the actual operation
    of gcc itself, the same search paths are not necessarily used. To find out which
    linker we will use, run: gcc --print-name-in-ld


    Detailed information can be obtained from gcc by passing the -v command line option
    while compiling a dummy program. For example, gcc -v dummy.c will show detailed
    information about the preprocessor, compilation, and assembly stages, including
    gcc''s included search paths and their order.


    Next is sanitized Linux API headers. The standard C library (Glibc) to interface
    with functions,


    The next package installed is Glibc. The most important considerations for building
    Glibc are the compiler, binary tools, and kernel headers. The compiler is not
    general all since Glibc will always use the compiler relating to the --host parameter
    to its configure script;e.g. in our case, the compiler will be i686-lfs-linux-gnu-gcc.
    The binary tools and kernel headers can be much complicated. There are no risks
    and use of the variable switches to enforce the correct selections. After a run
    of configure, check the contents of the configure.make file in the glic-build
    directory for CC="i686-lfs-linux-gcc" to control which binary tools are used and
    of the --nostdinc and -system flags to control the compiler search path. These
    items highlight an important aspect of the Glibc package—it is very self-sufficient
    and build generally does not rely on toolchain defaults.


    During the second pass of Binutils, we are able to utilize the --with-lib-path
    configure switch to control ld''s search path.


    For the second pass of GCC, its sources also need to be modified to GCC to use
    the new dynamic linker. To do so will result in the programs themselves having
    the name of the dynamic linker from the host system''s/lib embedded into them,
    which would defeat the goal of getting away from the host. From this point onwards,
    the toolchain is self-contained and self-hosted. The remainder of the Chapter
    5 packages will all build against the new Glibc in /tools.


