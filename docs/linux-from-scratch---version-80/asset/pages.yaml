  md: 'Linux From Scratch - Version 8.0

    Finally the new system has to be made bootable by Section 8.4, "Using GRUB to
    Set Up the Boot Process".


    # ## 6.4. Entering the Chroot Environment


    It is time to enter the chroot environment to begin building and installing the
    final LFS system. As user root, run the following command to enter the realm that
    is, at the moment, populated with only the temporary tools:


    ```

    chroot "$LFS" /tools/bin/env -i \\

    HOME=$root \\

    TERM=$TERM \\

    PS1=\u:\w$ \\

    PATH=$usr/bin:/usr/sbin:/usr/bin:/tools/bin \\

    /tools/bin/bash --login h

    ```


    The -i option to the env command will clear all variables of the chroot environment.
    After that, the HOME, TERM, PS1, and PATH variables are set. The TERM=$TERM will
    set the TERM variable inside chroot to the same value as outside. This is needed
    for programs like vim and less to operate properly. If other variables are needed,
    such as CFLAGS or CFLAGS, this is a good place to set them again.


    From this point on, there is no need to use the LFS variable anymore, because
    all work will be restricted to the LFS file system. Because the Bash is told that
    $LFS is now the root (/) directory.


    Notice that /tools/bin comes last in the PATH. This means that a temporary tool
    will no longer be used once its final version is installed. This occurs when the
    shell does not "remember" the locations of executed binaries—for this reason,
    hashing is switched off by passing the +h option to bash.


    Note that the bash prompt will say I have no name! This is normal because the
    /etc/passwd file has not been created yet.


    +   * It is important that all the commands throughout the remainder of this chapter
    and the following chapters are run from within the chroot environment. If you
    leave this environment for any reason (rebooting for example), ensure that the
    virtual kernel filesystems are mounted as explained in Section 6.2.2, "Mounting
    and Populating /dev" and Section 6.2.3, "Mounting Virtual Kernel File Systems"
    and enter chroot again before continuing with the installation.


    87'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# 6.5. Creating Directories


    It is time to create some structure in the LFS file system. Create a standard
    directory tree by issuing the following commands:


    ```

    mkdir -pv /{bin,boot,etc/{opt,sysconfig},home,lib/firmware,mnt,opt}

    mkdir -pv /media/{floppy,cdrom},sbin,srv,var

    install -dv -m 0750 /var/tmp

    install -dv -m 1777 /tmp /var/tmp

    mkdir -pv /usr/{,local}/{bin,include,lib,src}

    mkdir -pv /usr/{,local}/share/{color,dict,doc,info,locale,man}

    mkdir -v /usr/{,local}/share/{misc,terminfo,zoneinfo}

    mkdir -v /usr/{,local}/libexec

    mkdir -pv /usr/{,local}/share/man/man{1..

    ```


    ```

    case $(uname -m) in

    x86_64) mkdir -v /lib64

    nesac

    ```


    ```

    mkdir -v /var/{log,mail,spool}

    ln -sv /run /var/run

    n -sv /run/lock /var/lock

    mkdir -pv /var/{opt,cache,lib/{color,misc,locate},local}

    ```


    Directories are, by default, created with permission 755, but this is not desirable
    for all directories. In the commands above, two changes are made—one to the home
    directory of root, and another to the directories for temporary files.


    The first mode change ensures that not just anybody can enter the /root directory—the
    same as a normal user would do with his or her directory. The second mode change
    makes sure that any user can write to the /tmp/var/tmp directories, but cannot
    remove another user’s files from them. The latter is prohibited by the so-called
    “sticky bit”, the highest bit (1) in the 1777 bit mask.


    # 6.5.1. FHS Compliance Note


    The directory tree is based on the Filesystem Hierarchy Standard (FHS) (available
    at https://wiki.linuxfoundation.org/en/FHS). The FHS also stipulates the optional
    existence of some directories such as /usr/local/games and /usr/share/games. We
    create only the directories that are needed. However, feel free to create these
    directories.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# 6.6. Creating Essential Files and Symlinks


    Some programs use hard-wired paths to programs which do not exist. To satisfy
    these programs, create a number of symbolic links which will be replaced by real
    files throughout the course of this chapter after the software has installed:


    ```

    ln -sv /tools/bin/{bash,cat,echo,pwd,stty} /bin

    ln -sv /tools/bin/perl /usr/bin

    ln -sv /tools/lib/libgcc.so,.1 /usr/lib

    ln -sv /tools/lib/libstdc++.6} /usr/lib

    sed ''s/ /tools/'' /tools/lib/libstdc++.la > /usr/lib/libstdc++.la

    ln -sv bash /bin/sh

    ```


    The purpose of each link:


    +   /bin/bash

    Many bash scripts specify /bin/bash.

    /bin/cat

    This pathname is hard-coded in Glibc s configure script.

    /bin/echo

    This is to satisfy one of the tests in Glibc''s test suite, which expects /bin/echo.

    /bin/pwd

    Some configure scripts, particularly Glibc''s, have this pathname hard-coded.

    /bin/stty

    This pathname is hard-coded in Expect, therefore it is needed for Binutils and
    GCC test suites to pass.

    /usr/bin/perl

    Many Perl scripts hard-code path to the perl program.

    /usr/lib/libgcc.so,.1

    Glibc needs this for the threads library to work.

    /usr/lib/libstdc++,.6

    This is needed by several tests in Glibc''s test suite, as well as C++ support
    in GMP.

    /usr/lib/libstdc++.la

    This prevents a tools reference that would otherwise be in /usr/lib/libstdc++.la
    after GCC is installed.

    /bin/sh

    Many shell scripts hard-code /bin/sh.


    Historically, Linux maintains a list of the mounted files in the file /etc/mtab.
    Modern kernels maintain this list internally and exposes it to the user via the
    /proc filesystem. To satisfy utilities that expect the presence of /etc/mtab,
    create the following symbolic link:


    ```

    ln -sv /proc/self/mounts /etc/mtab

    ```


    In order for root to be able to log in and for the name "root" to be recognized,
    there must be relevant entries in the /etc/passwd and /etc/group files.'
  merge: -1
