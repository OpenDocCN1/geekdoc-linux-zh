- img_proc: true
  md: '# The meaning of the make parameter:


    tooldir=/usr

    Normally, the tooldir (the directory where the executables will ultimately be
    located) is set to $(exec_prefix)/$(target_alias). For example, x86_64 machines
    would expand that to /usr/x86_64-unknown-linux-gnu. Because this is a custom system,
    this target-specific directory in /usr is not required. $(exec_prefix) / $(target_alias)
    would be used to cross-compile (for example, compiling a package on an Intel machine
    that generates code that can be executed on PowerPC machines).


    > Important

    The test suite for Binutils in this section is considered critical. Do not skip
    it under any circumstances.


    Test the results:


    ```

    make -k check

    ```


    Install the package:


    ```

    make tooldir=/usr install

    ```


    # 6.13.2. Contents of Binutils


    +   **Installed programs:** addr2line, ar, as, c++filt, elfedit, gprof, ld, bfd,
    nm,众多, objdump, ranlib, size, strings and strip

    **Installed libraries:** libbfd,[a,so] and libcodes.{a,so}

    **Installed directory:** /usr/lib/ldscripts


    # Short Descriptions


    +   **addr2line** Translates addresses to file names and line numbers; given an
    address and the name of an executable, it uses the debugging information in the
    executable to determine which source file and line number are associated with
    the address


    +   **ar** Creates, modifies, and extracts from archives


    +   **as** An assembler that assembles the output of gcc into object files


    +   **c++filt** Used by the linker to de-mangle C++ and Java symbols and to keep
    overloaded functions from crashing


    +   **elfedit** Updates the ELF header of ELF files


    +   **gprof** Displays call graph profile data


    +   **ld** A linker that combines a number of object and archive files into a
    single file, relocating their data and tying up symbol references


    +   **bfd** Hard link ld to ld


    +   **nm** Lists the symbols occurring in a given object file


    +   **objcopy** Translates one type of object file into another


    +   **objdump** Displays information about the given object file, with options
    controlling the particular information to display; the information shown is useful
    to programmers who are working on the compilation tools'
