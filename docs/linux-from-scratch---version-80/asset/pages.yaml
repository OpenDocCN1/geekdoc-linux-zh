- img_proc: true
  md: '# 8.3. Linux-4.9.9


    The Linux package contains the Linux kernel.


    Approximate build time: 4.4 - 66.0 SBU (typically about 6 SBU)

    Required disk space: 960 - 4250 MB (typically about 1100 MB)


    # 8.3.1. Installation of the kernel


    Building the kernel involves a few steps—configuration, compilation, and installation.
    Read the README file in the kernel source tree for alternative methods to the
    way this book configures the kernel.


    Prepare for compilation by running the following command:


    ```

    make mrproper

    ```


    This ensures that the kernel tree is absolutely clean. The kernel team recommends
    that this command be used prior to each kernel compilation. Do not rely on the
    source being clean after un-tarring.


    Configure the kernel via a menu-interface. For general information on kernel configuration
    at http://linuxfromscratch.org/hints/downloads/kernel-configuration.txt. BLFS
    has some information regarding kernel configuration requirements of packages outside
    of LFS at http://www.linuxfromscratch.org/blfs/view/8.0/longindex.html#kernel-config-index.
    Additional information about configuring and building the kernel can be found
    at http://www.koah.com/lnv/


    > Note

    A good place for setting up the kernel configuration is to run make defconfig.
    This will set the base configuration to a good state that takes your current system
    architecture into account.

    Be sure to enable or disable features or the system might not work correctly or
    boot at all:

    Device Drivers --->

    Generic Driver Options --->

    [ ] Support for uevent helper [CONFIG_UEVENT_HELPER]

    [*] Maintain a devtmpfs filesystem to mount at /dev [CONFIG_DEVTMPFS]


    There are several other options that may be desired depending on the requirements
    for the system. For list needed for BLFS packages, see the BLFS Index of Kernel
    Settings (http://www.linuxfromscratch.org/blfs/view/8.0/longindex.html#kernel-config-index).'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# Note


    If your hardware is using UEFI, then the ''make defconfig'' should automatically
    add in some EFI-related kernel options.


    In order to allow LFS kernel to be booted from your host''s UEFI boot environment,
    your kernel must have this following option selected:


    ```

    Processor type and features    --->

    [*] EFI stub support       [CONFIG_EFI_STUB]

    ```


    A full description of managing UEFI environments from within LFS is covered by
    the Lfs-uefi.txt at http://www.linuxfromscratch.org/hints/downloads/files/lfs-uefi.txt.


    The rationale for the above configuration items:


    +   - Support for uevent helper

    Having a dev set may interfere with device management when using Udev/Eudev.

    - Maintain a devmtps

    This will create automated device nodes which are populated by the kernel, without
    Udev running. Udev then runs on top of this, managing permissions and adding symlinks.
    This configuration item is required for all users of Udev/Eudev.


    # make menconfig


    The meaning of optional make environment variables:


    LANG=<host_LANG_value> LC_ALL=

    This establishes the locale setting to the one used on the host. This may be needed
    for a proper ncurses interface line drawing on the UTF-8 console.

    If used, here to replace <host_LANG_value> by the value of the $LANG variable
    from your host. You can alternatively use the host''s value of $LC_ALL or $LC_CTYPE.


    Alternatively, make oldconfig may be more appropriate in some situations. See
    the README file for more information.

    If desired, skip kernel configuration by copying the kernel file .config, from
    the host system (assuming it is available) to the unpacked linux-4.9.9 directory.
    However, do not recommend this option. It is better to explore all the configuration
    menu and create the kernel configuration from scratch.


    Compile the kernel and modules:


    ```

    make

    ```


    If using kernel modules, module configuration in /etc/modprobe.d may be required.
    Information pertaining to modules and kernel configuration is located in Section
    7.3, "Overview of Device and Module Handling" and in the kernel documentation
    in the linux-4.9.9/Documentation directory. Also, modprobe.d(5) may be of interest.


    Install the modules, if the kernel configuration uses them:


    ```

    make modules_install

    ```


    After kernel compilation is complete, additional steps are required to complete
    the installation. Some files need to be copied to the /boot directory.'
