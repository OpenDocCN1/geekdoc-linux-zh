  md: '# Linux From Scratch - Version 8.0


    Feel free to modify the boot process works (after all, it is your own LFS). The
    files given here are an example of how it can be done.


    # 7.6.3. Udev Bootscripts


    The /etc/rc.d/init.d/udev init script starts udev, triggers any "coldplug" devices
    that have already been created by the kernel and waits for rules to compile. The
    script also unsets the udev handler from the default of /sbin/hotplug . This done
    the kernel no longer needs to call out an instance. Udev will listen on a network
    socket for the kernels


    The /etc/init.d/udev_retry init script calls out re-triggering for subsystems
    whose rules rely on filesystems are not mounted until the mounts script is run
    (particular, /usr and var may cause this). This script runs after the mounts script,
    so rules (if re-triggering) should succeed the second time. It is configured from
    /etc/sysconfig/udev_retry; any words in this file other comments are considered
    system names to trigger retry. To find the subsystem of a device, use udevadm
    --attribute-<device> where <device> is an absolute path in /dev or /sys such as
    /dev/s0 or /sys/class.


    # 7.6.3.1. Module Loading


    Device drivers compiled as modules may have aliases built into them. Alias is
    revealed in the output of the modinfo bus-identifiers of supported devices. For
    example, the snd-fm801 driver supports vendor ID 0x1319 and device ID 0x0801,
    and has an alias of "pci:v0000131900000801sv*dbc4c01*\*. For most devices, the
    driver exports the aliases of the driver which would handle the device via sysfs
    e.g., /sys/pci/devices/0000:00:0.d/alias might contain the string "pci:v0000131900000801u0000131900000801e000.
    The default rules provided with Udev will call out to /sbin/modprobe with the
    contents of the MODALIAS environment variable (which should be the same as the
    modalias file in sysfs), loading all modules whose aliases match this string field
    after wildcard.


    In this example, in addition to snd-fm801, the obsolete (and unwanted) forte driver
    will be loaded if it is available. See below for ways in which the loading of
    unwanted drivers can be prevented.


    The kernel is also able to load modules for network protocols, filesystems andNLS
    support on demand.


    # 7.6.3.2. Handling Hotpluggable/Dynamic Devices


    When you plug in a device, such as a Universal Bus (USB) MP3 player, the kernel
    recognizes that the device is now connected and generates an event. This event
    is then handled by udev as described above.


    # 7.6.4. Configuring the System Clock


    The setclock reads the time from the hardware clock, also known as the BIOS or
    the Complementary Metal Oxide Semiconductor (CMOS) clock. If the hardware clock
    is set to UTC, this script will write the hardware clock''s time to the local
    time using the /etc/localtime file (which tells the hwclock which timezone the
    user is in). There is no way to detect or not the hardware clock is set to UTC,
    so this needs to be manually configured.


    The setclock is run when udev detects the kernel detects the hardware capability
    upon boot. It can also be run with the stop parameter to store the system clock
    to the CMOS clock.


    If you cannot remember or not the hardware clock is set to UTC, find out by running
    the hwclock --localtime--show. This command will display the current time is according
    to the hardware clock. If this time matches whatever your watch shows, the hardware
    clock is set to local time. If the output hwclock is not


