  md: 'Linux From Scratch - Version 8.0


    +   * By default, the file system checks are silent. This can appear to be a delay
    during the boot process. To turn on the `fsck` output, set the variable VERBOSE_FSCK=y.


    +   * When rebooting, you may want to skip the filesystem check, `fsck`, completely.
    To do this, either create the file `/fastboot` or reboot the system with command
    `/sbin/shutdown -f` now. On the other hand, you can force all file systems to
    be checking by `/forcefsck` or running shutdown with the `-F` instead of `-f`.


    Setting the FASTBOOT=y will disable fsck during the boot process until it is removed.
    This is not recommended on a permanent basis.


    +   * Normally, all files in the `/tmp` directory are deleted at boot time. Depending
    on the number of files or directories, this can cause a noticeable delay in the
    boot process. To removing these files set the variable `SKIPTMPCLEAN=y`.


    +   * During startup, the init program sends a TERM signal to each process it
    has started (e.g. agetty), waits for a set time (3 seconds), and sends each process
    a KILL signal and waits again. This process is repeated for all processes that
    are not shut down by their own scripts. The delay in `init` can be set by passing
    a parameter. For example remove the delay in `init`, set the -0 parameter when
    shutting down or rebooting (e.g., `/sbin/shutdown -o -r now`). The delay for the
    `sendsignal` script can be clipped by setting the parameter `KLLDELAY=0`.


    # # 7.7 The Bash Startup Files


    The program `/bin/bash` (hereafter referred to as "the shell") uses a collection
    of files to help create an environment to run in. Each file has a specific use
    and may affect login and interactive environments differently. The files in the
    `/etc` directory provide global settings. If an equivalent file exists in your
    home directory, it may override the global settings.


    An interactive login shell is started after a successful login, using `/bin/login`,
    by reading the `/etc/passwd` file. An interactive non-login shell is started at
    the command-line (e.g., `[prompt]$bin/bash`). A non-interactive shell is usually
    present when a shell is running. It is non-interactive because it is processing
    a script and not waiting for user input commands.


    For more information, see **info bash** in the Bash Startup Files and Interactive
    Shells section.


    The files `/etc/profile` and `~/.bash_profile` are read when the shell is invoked
    as an interactive login shell. Setting them sets some environment variables properly
    results in:


    +   * The output of programs translated into the native language


    +   * Correct classification of characters into letters, digits and other classes.
    This is necessary for **bash** to properly accept non-ASCII characters in command
    lines in non-English locales


    +   * The correct alphabetical sorting order for the country


    +   * Appropriate default paper size


    +   * Correct formatting of money, time, and date values


    Replace `<ll>` with the two-letter code for the desired language (e.g., "en")
    and `<CC>` with the two-letter code for the appropriate country (e.g., "GB\).
    `<charmap>` should be replaced with the canonical charset for your chosen locale.
    Optional modifiers such as "@euro" may also be present.


    236'
