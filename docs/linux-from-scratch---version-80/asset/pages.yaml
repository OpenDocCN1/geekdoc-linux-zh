  md: '# Linux From Scratch - Version 8.0


    Create a separate build directory:


    ```

    mkdir -v build

    cd build

    ```


    Before starting to GCC, remember to unset any environment variables that override
    the default optimization flags.

    Now prepare GCC for compilation:


    ```

    CC=$LFS_TGT-gcc

    CXX=$LFS_TGT-g++

    AR=$LFS_TGT-ar

    RANBLIB=$LFS_TGT-ranlib

    ../configure

    --prefix=/tools

    --with-local-prefix=/tools

    --with-native-system-header-dir=/tools/include

    --enable-languages=c,c++

    --disable-listdcxx-pch

    --disable-multilib

    --disable-bootstrap

    --disable-libgccomp

    ```


    The meaning of the new configure options:


    --enable-languages=c,c++

    This option ensures that both the C and C++ compilers are built.


    --disable-listdcxx-pch

    Do not build the pre-compiled header for listdc++. It takes up a lot of space,
    and we have no use for it.


    --disable-bootstrap

    For native builds of GCC, the default is to do "bootstrap" build. This does not
    compile GCC, but compiles it several times. It uses the programs in a first round
    to compile itself a second time, and again a third time. The second and third
    iterations are compared to ensure it can reproduce flawlessly. This also implies
    that it was compiled correctly. However, the LFS build method should provide a
    solid compiler without the need to bootstrap each time.


    Compile the package:


    ```

    make

    ```


    Install the package:


    ```

    make install

    ```


    As a finishing touch, create a symlink. Many programs and scripts run cc instead
    of gcc, which is used to keep programs generic and usable on all kinds of UNIX
    systems where the GNU C compiler is not always installed. Running cc leaves the
    system administrator free to decide which compiler to install:


    ```

    ln -sv gcc /tools/bin/cc

    ```'
  merge: -1
