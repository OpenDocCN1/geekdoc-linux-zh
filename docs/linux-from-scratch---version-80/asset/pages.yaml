    # 7.6.6. Creating Files at Boot


    At times, it is desired to create files at boot. For the instance, the /tmp/.ICE-unix
    directory may be desired. This can be done by creating an entry in the /etc/sysconfig/createfiles
    configuration script. The format of this file is embedded in the comments of the
