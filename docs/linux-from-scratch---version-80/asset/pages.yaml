    # E.1. 55-lfs.rules


    ```

    # /etc/udev/rules.d/55-lfs.rules: Rule definitions for LFS


    # Core kernel devices


    # This causes the system clock to be set as soon as /dev/rtc becomes available.

    SUBSYSTEM="rtc", ACTION="add", MODE="0644", RUN="/etc/rc.cd/init.d/setclock start"

    KERNEL==="rtc", ACTION="add", MODE="0644", RUN="/etc/rc.cd/init.d/setclock start"


