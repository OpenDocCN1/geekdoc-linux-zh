- img_proc: true
  md: 'The PREFIX variable contains the number of bits used in the subnet. Each octet
    in an IP address is 8 bits. The netmask is 255.255.255.0, then it is using the
    first 24 octets (bits) to specify the network number. The netmask is 255.255.255.240
    it is using the first 28 bits that are commonly used by DSL and cable-based Internet
    Service Providers (ISPs). In this example (PREFIX=24), the netmask is 255.255.255.0.
    Adjust the PREFIX variable according to your specific subnet. If omitted, the
    PREFIX defaults to 24.


    For more information see the ifup man page.


    # 7.5.2. Creating the /etc/resolv.conf File


    If the system is going to be connected to the Internet, it will need some means
    of Domain Name Service (DNS) name to resolve Internet names to IP addresses, and
    vice versa. This is best achieved by placing the IP address of the DNS server,
    from the ISP or network administrator, into /etc/resolv.conf. Create the file
    by running the following:


    ```

    cat /etc/resolv.conf << "EOF"

    # Begin /etc/resolv.conf


    domain <Your Domain Name>

    nameserver <IP address of your primary nameserver>

    nameserver <IP address of your secondary nameserver>


    # End /etc/resolv.conf

    EOF

    ```


    The domain statement can be omitted or replaced with a search statement. See the
    page for resolv.conf for more details.


    Replace <IP address of the DNS> with the IP address of the DNS most appropriate
    for the setup. There will be more than one entry (requirements demand secondary
    servers for fallback capacity). If you only need or one DNS server, remove the
    second nameserver line from the file. The IP address may also be a router on the
    local network.


    > Note The Google Public IPv4 DNS addresses are 8.8.8.8 and 8.8.4.4.


    # 7.5.3. Configuring the system hostname


    During the boot process, the file /etc/hostname is used for establishing the system''s
    hostname. Create the /etc/hostname file and enter a hostname by running:


    ```

    echo "<hostname> > /etc/hostname

    ```


    <hostname> needs to be replaced with the name given to the computer. Do not enter
    the Fully Qualified Domain Name (FQDN) here. Information is put in the /etc/hosts
    file.


    # 7.5.4. Customizing the /etc/hosts File


    Decide on the IP address, fully-qualified domain name (FQDN), and possible aliases
    for use in the /etc/hosts file. The syntax is:


    ```

    IP_address myhost.example.org aliases

    ```'
