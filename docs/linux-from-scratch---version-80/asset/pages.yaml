    # FONT


    This variable specifies the arguments for the setfont program. Typically, this
    includes the name, "m" and the name of the application character map to load.
    E.g., in order to load the "lat1-16" font together with the "8859-1" application
    character map (as it is appropriate in the USA), set this variable to "lat1-m
    8859-1". In UTF-8, the kernel uses the application character map for conversion
