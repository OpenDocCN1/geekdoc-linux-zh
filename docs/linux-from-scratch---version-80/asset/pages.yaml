    \ and initiates the boot process.\n\n```\n#!/bin/bash\n################################################################\n\
    # Begin rc\n\n# Description : Main Run Level Control Script\n# Authors : Gerard\
    \ Beekemans - gerard@linuxfromscratch.org\n# : DJ Lucas - dlj@linuxfromscratch.org\n\
    # Update : Bruce Dubbes - bdbubbs@linuxfromscratch.org\n# Version : LFS 7.0\n\
