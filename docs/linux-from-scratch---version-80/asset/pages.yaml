    Prepare Inetutils for compilation:


    ```

    ./configure --prefix=/usr

    --localstatestir=/var

    --disable-logger

    --disable-whois

    --disable-rpc

    --disable-rexec

    --disable-rlogin

    --disable-rsh

    --disable-servers

    ```


    The meaning of the configure options:


    +   --disable-logger

    This option prevents Inetutils from installing the logger program, which is used
    by scripts to pass messages to the System Log Daemon. Do not install if Util-linux
    installs a more recent version.

    --disable-whois

    This option disables the building of the Inetutils whois client, which is out
    of date. Instructions for a better whois client are in the BLFS books.

    --disable-r*

    These parameters disable building obsolete programs that are not used due to security
    issues. The functions provided by these programs can be provided by the openssh
    package in the BLFS books.

    --disable-servers

    This disables the installation of the various network servers included as part
    of the Inetutils package. These servers are deemed not appropriate in a basic
    LFS system. Some are insecure by nature and are only considered safe on trusted
    networks. Note


