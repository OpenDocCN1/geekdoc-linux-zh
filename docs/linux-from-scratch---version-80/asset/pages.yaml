    LSB Gtk3 and LSB Graphics (Trial Use): None


    # Rationale for Packages in the Book


    As stated earlier, the goal of LFS is to build a complete and usable foundation-level
    system. This includes all packages needed to replicate itself while providing
    a relatively minimal base from which to customize a more complete system based
    on the choices of the user. This does not mean that LFS is the smallest possible
    system. Several important packages are included that are not strictly required.
    The lists below document the rationale for each package in the book.


    +   * AclnThis package contains utilities to administer Access Control Lists,
    which are used to define more fine-grained discretionary access rights for files
    and directories.

    * AttrThis package contains programs for administering extended attributes on
    filesystem objects.

    * AutoconfThis package contains programs for producing shell scripts that can
    automatically configure source code from a developer''s template. It is often
    needed to rebuild a package after updates to the build procedures.

    * AutomakeThis package contains programs for generating Make files from a template.
    It is often needed to rebuild a package after updates to the build procedures.

    * BashThis package satisfies an LSB core requirement to provide a Bourne Shell
    interface to the system. It was chosen over other shell packages because of its
    common usage and extensive capabilities beyond basic shell.

    * BcThis package provides an arbitrary precision numeric processing language.
    It satisfies a requirement needed when building the Linux kernel.

    * BinutilsThis package contains a linker, an assembler, and other tools for handling
    object files. The programs in this package are needed to compile most of the packages
    in an LFS system and beyond.

    * BisonThis package contains the GNU version of yacc (Yet Another Compiler) needed
    to build several other LFS programs.

    * Bzip2This package contains programs for compressing and decompressing files.
    It is required to decompress many LFS packages.

    * Check package contains a test harness for other programs. It is only installed
    in the temporary toolchain.'
