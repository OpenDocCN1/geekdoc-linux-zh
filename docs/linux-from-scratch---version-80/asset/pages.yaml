  md: '# # 6.49. E2fsprogs-1.43.4


    The E2fsprogs package contains the utilities for handling the ext2 file system.
    It also supports the ext3 and ext4 journaling file systems.


    Approximate build time: 4.1 SBU

    Required disk space: 57 MB


    # ## 6.49.1. Installation of E2fsprogs


    The E2fsprogs documentation recommends the package be built in a subdirectory
    of the source tree:


    ```

    mkdir -v build

    cd build

    ```


    Prepare E2fsprogs for compilation:


    ```

    LIBS=-L/tools/lib

    CFLAGS=-I/tools/lib/pkgconfig

    PKG_CONFIG_PATH=--prefix=usr

    ../configure --bindir=/bin

    --with-root-prefix=""

    --enable-elf-shlibs

    --disable-libklkid

    --disable-libuuid

    --disable-uiddid

    --disable-fsck

    ```


    The meaning of the environment variable and configure options:


    PKG_CONFIG_PATH, LIBS, CFLAGS

    These variables enable E2fsprogs to be built by using the Section 5.34, “Ut-linux-2.29.1”
    package built earlier.

    --with-root-prefix="" and --bindir=/bin


    Certain programs (such as efsck) are considered essential programs. When example,
    /usr is not mounted, these programs still need to be available. They belong in
    directories like /lib and /sbin. If this option is not passed to E2fsprogs'' configure,
    the programs are installed into the /usr directory.


    --enable-elf-shlibs

    This creates the shared libraries which some programs in this package use.


    --disable-*

    This prevents E2fsprogs from building and installing the libuuid and libklkid
    libraries, and the ffsck wrapper, as Ut-Linux installs more recent versions.


    Compile the package:


    ```

    make

    ```


    To set up and run the test suite we need to first link some libraries from /tools/lib
    to a location where the test programs look. To run the tests, issue:


    ```

    ln -sfv /tools/lib/lib(blk,uu)id.so.1 lib

    make LD_LIBRARY_PATH=/tools/lib check

    ```'
  merge: -1
