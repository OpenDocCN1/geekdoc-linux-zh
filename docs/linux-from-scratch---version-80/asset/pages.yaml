  md: '# 7.3. Overview of Device and Module Handling


    In Chapter 6, we installed the Udev package with eudev built. Before we go into
    the details regarding how this works, a brief history of previous methods of handling
    devices is in order.


    Linux systems in general traditionally used a static device creation method, whereby
    a great many device nodes were created under /dev (sometimes thousands of nodes),
    regardless of whether the corresponding hardware actually existed. This was typically
    done via a MAKED script, which contains a number of calls to the mknod program
    with the relevant major and minor device numbers for every possible device that
    might exist in the world.


    Using the Udev method, only those which are detected by the kernel dev nodes were
    created. Because these device nodes will be created each time the system boots,
    they will be stored on a devtmpfs file system (a virtual file system resides entirely
    in system memory). Device nodes do not require much space, so the memory that
    is used is negligible.


    # 7.3.1. History


    In February 2000, a new filesystem called devfs was merged into the 2.3.46 kernel
    and was made available during the 2.4 series of stable kernels. Although it was
    present in the kernel source itself, this method of creating devices dynamically
    never received overwhelming support from the core kernel developers.


    The main problem with the approach adopted by devfs was the way it handled device
    detection, creation, and naming. The latter issue, that of device node naming,
    was perhaps the most critical. It is generally accepted that if device names are
    allowed to be configurable, then the device naming policy should be a system administrator,
    not imposed by any particular developer(s). The devfs file system also suffered
    from race conditions that were inherent in its design and could not be fixed without
    a substantial revision to the kernel. It was deprecated for a long period – due
    to a lack of maintenance – and was finally removed from the kernel in June, 2006.


    With the development of the unstable 2.5 kernel tree, later released as the 2.6
    series of stable kernels, a new virtual filesystem called sysfs came to be. The
    job of sysfs is to export the system''s hardware configuration to users processes.
    With this userspace-visible representation, the possibility of developing a sysfs
    replacement for devfs became more realistic.


    # 7.3.2. Udev Implementation


    # 7.3.2.1. Sysfs


    The sysfs filesystem was mentioned briefly above. One may wonder how sysfs knows
    about the devices present on a system and what device nodes should be used for
    them. Drivers that have been compiled into the kernel register their objects with
    sysfs (devtmpfs internally) as they are detected by the kernel. For drivers compiled
    modules, this registration will happen when the module is loaded. When the sysfs
    filesystem is mounted on (/sys), data which the drivers register with sysfs are
    available to userspace processes and to us (modifications device nodes).


    # 7.3.2.2. Device Node Creation


    Device files are created by the kernel by the devtmpfs filesystem. Any driver
    that wishes to register a device node will go through the devtmpfs (via the device
    core) to do it. A devtmpfs instance is mounted on (/dev, the device node will
    be initially created with a fixed name, permissions, and owner.'
  merge: -1
