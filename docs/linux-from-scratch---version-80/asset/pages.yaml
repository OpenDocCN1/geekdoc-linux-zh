    # bash library-check.sh


    The files identified by this script should be all present or absent, but not only
    one or two present.


    # 2.3. Building LFS in Stages


    LFS is designed to be built in one session. That is, the instructions ensure that
    the system will not be shut down during the process. That does not mean that the
    system has to be done in one sitting. The issue is that certain procedures have
    to be re-accomplished after a reboot if resuming LFS at different points.


    # 2.3.1. Chapters 1-4


    These chapters are accomplished on the host system. When restarting, be careful
    of the following:


    +   - Procedures do as the root user after Section 2.4 need to have the LFS environment
    variable set FOR THE ROOT USER.


    # 2.3.2. Chapter 5


    +   - The /mnt/lfs partition must be mounted.

    - ALL instructions in Chapter 5 must be done by user lfs. A su - lfs needs to
    be done before any task in Chapter 5.

    - The procedures in Section 5.3, "General Compilation Instructions" are critical.
    If there is any doubt about installing a package, ensure any previously expanded
    tarballs are removed, re-extract the package files, and complete all instructions
    in that section.


    # 2.3.3. Chapters 6-8


    +   - The /mnt/lfs partition must be mounted.'
