  md: '# 7.2. LFS-Bootstraps-20150222


    The LFS-Bootstraps package contains a set of scripts to start/stop the LFS system
    at bootup/shutdown. The configuration files and procedures needed to customize
    the boot process are described in the following sections.


    Approximate build time: less than 0.1 SBU

    Required disk space: 244 KB


    # 7.2.1. Installation of LFS-Bootstraps


    Install the package:


    ```

    make install

    ```


    # 7.2.2. Contents of LFS-Bootstraps


    Installed scripts: checkfs, cleanfs, console, funcs, halt, ifdown, ifup, localnet,
    modules, mountfs, mountvirts, network, reboot, sendsignal, setclock, ipv4-static,
    swatic, syslog, template, update, and dev_retry


    Installed directories: /etc/rc.d, /etc/init.d (symbolic link), /etc/sysconfig,
    /lib/services, /lib/lib (symbolic link)


    # Short Descriptions


    +   - checkfs: Checks the integrity of the file systems before they are mounted
    (with the exception of journal and network based file systems)


    +   - cleanfs: Removes files that should not be preserved after reboots, such
    as those in /var/run/ and /var/log/*; re-creates /var/utmp and removes the possible
    /etc/noglogin, /fastboot, and /forcefsck


    +   - console: Loads the correct keymap for the desired keyboard layout; it also
    sets the screen font


    +   - functions: Contains common functions, such as error and status checking,
    that are used by several bootstraps


    +   - halt: Halts the system


    +   - ifdown: Stops a network device


    +   - ifup: Initializes a network device


    +   - localnet: Sets up the system''s hostname and local loopback device


    +   - modules: Loads kernel modules in /etc/sysconfig/modules, using arguments
    that are also given there


    +   - mountfs: Mount all file systems, except ones that are mouauto or are network
    based


    +   - mountvirts: Mounts virtual kernel file systems, such as proc


    +   - network: Sets up network interfaces, such as network cards, and sets up
    the default gateway (where applicable)


    +   - rc: The master run-level control script; it is responsible for running all
    the other bootstraps one-by-one, in a sequence determined by the name of the links
    being processed


    +   - reboot: Reboots the system


    +   - sendsignal: Makes every process is terminated before the system reboots
    or halts


    +   - setclock: Resets the kernel clock to local time in case the hardware clock
    is not set to UTC time'
