  md: '# Preface


    # Foreword


    My journey to learn and understand Linux began over a decade ago, back in 1998.
    I had just installed my first Linux distribution and had quickly become intrigued
    with the whole concept and philosophy behind Linux.


    To truly make it my own, I resolved to compile everything from source code instead
    of using pre-compiled binary packages. This "perfect" system would have the strengths
    of various systems without their perceived weaknesses. At first, the idea was
    rather daunting. I remained committed to the idea that a system could be built.


    After sorting through issues such as circular dependencies and compile-time errors,
    I finally built a custom-built Linux system. It was fully operational and perfectly
    usable like any of the other Linux systems out there. But it was my own creation.
    It was very satisfying to have put together a system like my own. The only thing
    better would have to create each piece of software myself. This was the next best
    thing.


    As I shared my goals and experiences with other members of the Linux community,
    it became apparent that there was a sustained interest in these ideas. It quickly
    became plain that custom-built Linux systems serve not only to meet specific requirements,
    but also serve as an ideal learning opportunity for programmers and system administrators
    to enhance their (existing) Linux skills. Out of this broadened interest, the
    Linux From Scratch Project was born.


    This Linux Scratch book is the core that project. It provides the background and
    instructions necessary for you to build and own your own. This book provides a
    template that will result in a working system, where you are free to alter the
    instructions to yourself, which is, in, an important part of this project. You
    remain in control; we just lend a hand to get started on your own journey.


    I sincerely hope you will have a great time working on your own Linux From Scratch
    system and enjoy the numerous benefits of having a system that is truly yours.


    ```

    --

    Gerard Beekemans

    gerard@linuxfromscratch.org

    ```


    # Audience


    There are many reasons why you would want to read this book. One of the questions
    many people raise is, "why go through all the hassle of manually building a Linux
    system from scratch when you can just download and install an existing one?'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Linux From Scratch - Version 8.0


    One reason for this project''s existence is to help you learn how a Linux system
    works from the inside out. Building an LFS system demonstrates what makes Linux
    tick, and how things work together and depend on each other. One of the best things
    that this learning experience provide is the ability to customize a Linux system
    to fit your unique needs.


    Another key benefit of LFS is that it allows you to have more control over the
    system without relying on someone else''s implementation. With LFS, you are in
    the driver''s seat and dictate every aspect of the system.


    LFS allows you to create very compact Linux systems. When installing regular distributions,
    you are often forced to install a many programs which are probably never used
    or understood. This wastes resources. You may argue that today''s hard drives
    and CPUs, such resources are no longer a consideration. However, you are still
    constrained by size considerations if not. Think about bootable CDs, USB sticks,
    and embedded systems. Those are areas where LFS can be beneficial.


    Another advantage of a custom Linux system is security. By compiling the entire
    system from source code, you are empowered to edit and verify all the security
    patches included. It is no longer necessary to wait for somebody to compile binary
    packages that fix a security hole. Unless you examine the package and implement
    it, you have no guarantee that the new binary was built correctly and adequately
    fixes the problems.


    The goal of Linux From Scratch is to build a complete and useful foundation-level
    system. If you do not wish to build your own system from scratch, you may not
    benefit from the information in this book.


    There are too many other reasons to build your own LFS system to list them all
    here. In end, the education is by far the most powerful of reasons. As you continue
    in your LFS experience, you will discover the information and knowledge truly
    brings.


    # LFS Target Architectures


    The primary target architectures of LFS are the AMD/x86 (32-bit) and x86_64 (64-bit)
    CPUs. On the other hand, the instructions in this book are also known to work,
    with some modifications, with the Power PC and ARM CPUs. To build a system that
    utilizes one of these CPUs, the main prerequisite, in addition to the next few
    pages, is an existing LFS system such as an earlier LFS installation, Ubuntu,
    Red Hat/Fedora, SuSE, or other distribution that targets the architecture you
    want. You also note that a 32-bit distribution can be built and used as a host
    system on a 64-bit Intel/AMD.


    Some other facts about 64-bit systems need to be added here. When compared to
    a 32-bit system, the size of executable programs are slightly larger and the execution
    speeds are slightly faster. In a test of LFS-6.5 on a Core2 Duo CPU base, the
    following statistics were measured:


    | Architecture | Build Time | Build Size |

    | 32-bit | 198.5 minutes | 64 MB |

    | 64-bit | 190.6 minutes | 709 MB |


    As you can see, the 64-bit build is only 4% faster and 9% larger than the 32-bit
    build. The gain from going to a 64-bit system is relatively minimal. Of course,
    if you want more than 4GB of RAM or want to manipulate data that exceeds 4GB,
    the advantages of a 64-bit system are substantial.


    The default 64-bit build that results from LFS is considered a "pure" 64-bit system.
    That is, it supports 64-bit executables only. Building a "multi-lib" system requires
    compiling many times, is not directly supported in LFS because it would interfere
    with the educational objective of providing the instructions needed for a straightforward
    Linux system. You can refer to the Cross Linux Scratch project for this advanced
    topic.'
  merge: -1
