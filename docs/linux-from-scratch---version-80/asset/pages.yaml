  md: '# Linux From Scratch - Version 8.0


    LD_PRELOAD environment variable can be set to point to a library before installation.
    During installation, this library tracks the packages that are being installed
    by attaching itself to various executables such as cp, install, mv and tracking
    all calls that modify the filesystem. For this approach, all the executables need
    to be dynamically linked without the suid or gid bit. Preloading the library may
    cause unwanted side-effects during installation, it is advised that one performs
    some tests to ensure that the package manager does not break anything and loses
    all appropriate files.


    The second technique is to use strife, which makes all system calls during the
    execution of the installation scripts.


    # 6.3.2. Creating Package Archives


    In this scheme, the installation is faked into a separate tree as described in
    the Symlink style package management. After an installation, a package archive
    is created using the installed files. This archive is then used to install the
    package either on the local machine or even used to install the package on other
    machines.


    This approach is used by most of the package managers found in the commercial
    distributions. Examples of package managers that follow this approach are RPM
    (which, incidentally, is required by the Linux Standard Base Specification), pkg-utils,
    Debian''s and Gent''s Portage system. A hint describing how to adopt this style
    of package management for LFS systems is located at http://www.linuxfromscratch.org/hints/downloads/files/fakeroot.txt.


    Creation of packages include dependency information is complex and beyond the
    scope of LFS. Slack uses a tar based system for package archives. This system
    purposely does not handle package dependencies as more as complex package managers
    do. For details of Slack package management, see http://www.slackbook.org/html/package-management.html.


    # 6.3.2.7. Using Based Management


    This scheme, unique to LFS, was devised by Matthias Benmann, and is available
    from the Hints Project. In this scheme, each package is installed as a separate
    user into the standard locations. Files belonging to a package are easily identified
    by checking the user ID. The features and shortcomings of this approach are too
    complex to describe in this section. For the details please see the hint at http://www.linuxfromscratch.org/hints/downloads/files/more_control_and_pkg_man.txt.


    # 6.3.3. Deploying LFS on Multiple Systems


    One of the advantages of LFS system is that there are no files that differ on
    the position of files on a disk system. Cloning LFS to build another computer
    with the same architecture as the base system is as simple as using tar on the
    LFS partition that contains the root directory (250MB uncompressed for a base
    LFS build), copying that via network transfer or CD-ROM to the new system and
    expanding it. From point, a few configuration files will have to be changed. Configuration
    files that may need to be updated: /etc/hosts, /etc/fstab, /etc/passwd, /etc/group,
    /etc/shadow, /etc/ld.so.conf, /etc/sysconfig/rc.site, /etc/sysconfig/network,
    and /etc/sysconfig/ifconfig.eth.


    A custom kernel may need to be built for the new system depending on differences
    in hardware and the original kernel configuration.


    > There have been some reports of issues when copying between similar but not
    identical architectures. For an instance, the instruction for an Intel system
    is not identical with an AMD processor and later versions of some processors may
    have instructions that are unavailable in earlier versions.


