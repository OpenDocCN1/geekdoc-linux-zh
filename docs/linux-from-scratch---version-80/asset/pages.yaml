    init)


    # Short Descriptions


    +   **bootlogd** Log boot messages to a log file

    **fstab-decode** Run a command with fstab-encoded arguments

    **halt** Normally invokes **shutdown** with the -h option, except when already
    in run-level 0, then it tells the kernel to halt the system; it notes in the file
