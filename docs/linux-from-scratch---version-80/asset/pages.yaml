    ```\n\nThis tells Glibc to compile the library with support for 2.6.32 and later\
    \ Linux kernels. Workarounds for older kernels are not enabled.\n\n```\n--with-headers=/tools/include\n\
    ```\n\nThis tells Glibc to compile itself after the headers recently installed\
