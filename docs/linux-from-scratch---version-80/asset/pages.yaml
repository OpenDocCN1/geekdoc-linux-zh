  md: 'Fix some of the permissions so that the non-root user can compile and run the
    tests:


    ```

    chown -Rv nobody .

    ```


    Now run the tests. Make sure the PATH in the su environment includes /tools/bin.


    ```

    su nobody -s /bin/bash \

    -c "PATH=$PATH make RUN_EXPENSIVE_TESTS=yes check"

    ```


    The test-login test is known to fail on a virtual console such as the chroot environment
    here, but passes if run in an X terminal.


    Remove the temporary group:


    ```

    sed -i ''/dummy/d'' /etc/group

    ```


    Install the package:


    ```

    make install

    ```


    Move programs to the locations specified by the FHS:


    ```

    mv -v /usr/bin/{cat,chgrp,chmod,chown,cp,date,dd,df,de,echo} /bin

    mv -v /usr/bin/{false,ls,mkdir,knod,mv,mv,pwd,rm} /bin

    mv -v /usr/bin/{rmdir,stty,sync,true,uname} /bin

    mv -v /usr/bin/chroot /usr/bin

    mv -v /usr/share/man/man1/chroot.1 /usr/share/man/man8/chroot.8

    sed -i s/\1\8"/1 /usr/share/man/man8/chroot

    ```


    Some of the LFS-Bootscripts package depend on head, sleep, and nice. As /usr may
    not be available during the early stages of booting, these binaries are not on
    the root partition:


    ```

    mv -v /usr/bin/{head, sleep,nice,test, []} /bin

    ```


