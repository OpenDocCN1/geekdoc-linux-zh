    # 6.3. Package Management


    Package Management is an often requested addition to the LFS Book. A Package Manager
    allows tracking the installation of files making it easy to remove and upgrade
    packages. As well the binary and library files, a package manager will handle
    the installation of configuration files. Before you begin to wonder, NO—this section
    will not talk about any particular package manager. What it provides is a rundown
    of the more popular techniques and how they work. The perfect package manager
    for you may be among these techniques or a combination of two or more of these
    techniques. This section briefly mentions issues that may arise when upgrading
    packages.


    Some reasons why package management is mentioned in LFS or BLFS include:


    +   - Dealing with package management takes the focus away from the goals of these
    books—teaching how a Linux system is built.


    +   - There are multiple solutions for package management, each having its strengths
    and drawbacks. One that satisfies all is elusive.


    There are some hints written on the topic of package management. Visit the Hints
    Project and see if one of them fits your need.


    # 6.3.1. Upgrade Issues


    A Package Manager makes it easy to upgrade to newer versions when they are released.
    Generally the instructions in the LFS and BLFS Book can be used to upgrade to
    the newer versions. Here are some points that you should be aware of when upgrading
    packages, especially on a running system.


    +   - If glibc needs to be upgraded to a newer version (e.g. from glibc-2.19 to
    glibc-2.20, it is safer to rebuild LFS. You may have to rebuild all the packages
    in their dependency order, or we do not recommend it.


    +   - If a package containing a shared library is updated, and if the name of
    the library changes, (Note that there is no correlation between the package version
    and the name of the library). For example, a package foo-1.2.3 that installs a
    shared library with name libfoo.so.1. Say you upgrade the package to a newer version
    foo-1.2.4 that installs all packages that are dynamically linked to libfoo.so.1
    need to be recompiled to link against libfoo.so.2. Note that you should not remove
    the previous libraries until the dependent packages are recompiled.


    # 6.3.2. Package Management Techniques


    The following are some common package management techniques. Before making a decision
    on a package manager, do some research on the various techniques, particularly
    the drawbacks of the particular scheme.


    # 6.3.2.1. It is All in My Head


    Yes, this is a package management technique. Some folks do not find the need for
    a package manager because they know the packages intimately and know what files
    are installed by each package. Some users also do not need any package management
    because they plan on rebuilding the entire system when a package is changed.


    84'
