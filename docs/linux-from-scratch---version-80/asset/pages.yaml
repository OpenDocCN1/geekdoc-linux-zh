  md: '# 67.0. Vim-8.0.069


    The Vim package contains a powerful text editor.


    Approximate build time: 1.3 SBU

    Required disk space: 141 MB


    > If you prefer another editor—such as Emacs, Joe, or Nano—please refer to http://www.linuxfromscratch.org/blfs/view/8.0/postifs/editors.html
    for suggested installation instructions.


    # 67.0.1. Installation of Vim


    First, change the default location of the vimrc configuration to /etc:


    ```

    echo ''##fine SYS_VIMRC_FILE "/etc/vimrc" >> src/feature.h

    ```


    Prepare Vim for compilation:


    ```

    ./configure --prefix=/usr

    ```


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make -j1 test

    ```


    However, this suite outputs a lot of binary data to the screen, which can cause
    issues with the settings of the current terminal. This can be resolved by redirecting
    the output to a log file. A successful test will result in the words "ALL DONE"
    at completion.


    Install the package:


    ```

    make install

    ```


    Many users are to use vi instead of vim. To allow vim when users habitually enter
    vi, create a symlink for both home and the man page in the provided directories:


    ```

    ln -sv vim /usr/bin/vi

    for L in /usr/share/man/*}man1/vim.1; do

    ln -sv vim.1 $ $(dirname L)/vi.1

    done

    ```


    By default, Vim''s documentation is installed in /usr/share/vim. The following
    symlink allows the documentation to be accessed via /usr/share/doc/vim-8.0.069,
    making it consistent with the location of documentation for other packages:


    ```

    ln -sv ../vim/vim80 /usr/share/doc/vim-8.0.069

    ```'
