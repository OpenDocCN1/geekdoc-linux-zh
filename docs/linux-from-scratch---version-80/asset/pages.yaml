  md: '# 58. IPRoute2-4.9.0


    The IPRoute2 package contains programs for basic and advanced IP4-based networking.


    **Approximate build time:** 0.2 SBU

    Required disk space: 11 MB


    # 6.58.1. Installation of IPRoute2


    The arpd program included in this package will not be built since it is dependent
    on Berkeley DB, which is not installed in LFS. Documentation files and a directory
    for arpd will still be installed. This prevents by running the commands below.
    If the arpd binary is needed, instructions for compiling Berkeley DB can be found
    in the BLFS Book at http://www.linuxfromscratch.org/blfs/view/8.0/server/databases.html#db.


    ```

    sed -i /Arpd/d Makefile

    sed -i ''s/arpd.8//'' man/man8/Makefile

    rm -v doc/arpd.sgml

    ```


    It is also necessary to disable one module that requires http://www.linuxfromscratch.org/blfs/view/8.0/postlfs/iptables.html.


    ```

    sed -i ''s/m_ipt.//'' tc/Makefile

    ```


    Compile the package:


    ```

    make

    ```


    This package does not have a working test suite.


    Install the package:


    ```

    make DOCDIR=/usr/share/doc/iproute2-4.9.0 install

    ```


    # 6.58.2. Contents of IPRoute2


    +   **Installed programs:** bridge, ctstat (link to Instat), genl, ifcfg, ifstat,
    ip, nstat, routef, routel, rtacct, rtmon, rptrp, rtlink (link to Instat), ss,
    and tc


    +   **Installed directories:** /iproute2, /usr/lib/tc, and /usr/share/doc/iproute2-4.9.0/


    # Short Descriptions


    +   **bridge** Configure network bridges

    **ctstat** Connection status utility

    **genl** Generic netlink frontend

    **ifcfg** A shell wrapper for the **ip** command [Note that it requires the **arping**
    and **rdisk** programs from the iputils package found at http://www.kb.net/iputils/]

    **ifstat** Shows the interface statistics, including the amount of transmitted
