  md: "# ## 8.4. Using GRUB-v Set Up the Boot Process\n\n# ### 8.4.1. Introduction\n\
    \n> **Warning** Configuring GRUB incorrectly can render your system inoperable\
    \ without an alternate boot device such as a CD-ROM. This section is not required\
    \ to boot your LFS system. You may just want to modify your current boot loader,\
    \ e.g. Grub-Legacy, GRUB2, or LILO.\n\nEnsure an emergency boot disk is ready\
    \ to \"rescue\" the computer if the computer becomes unusable (un-bootable). If\
    \ you do not have a boot device, you can create one. In order for the procedure\
    \ below to work, you need to jump ahead to BLFS and install xorriso from the libisoburn\
    \ package.\n\n```\n /tmp\ngrub-mkrescue --output=grub-img.iso\nxorriso -as cdrecord\
    \ -v dev=/dev/cdrom rw blank=as_needed grub-img.iso\n```\n\n> To LFS on systems\
    \ that have UEFI enabled, the kernel needs to have been built with the CONFIG_EFI_STUB\
    \ capability described in the previous section. However, LFS can be booted without\
    \ GRUB without such an addition. To this, the UEFI Mode and Secure Boot capabilities\
    \ in the host system's BIOS need to be off. For details, see the lfs-uefi.txt\
    \ hint at http://www.linuxfromscratch.com/hints/-files/lfs-uefi.txt.\n\n# ###\
    \ 8.4.2 GRUB Naming Conventions\n\nGRUB uses its own naming structure for devices\
    \ and partitions in the form of (hdn,m) where n is the hard drive number and m\
    \ is the partition number. Hard drive partition starts from zero, but the partition\
    \ number starts from one for normal partitions and extended partitions. This not\
    \ is different from earlier versions when both numbers started from zero. For\
    \ example, partition sda1 (hd0,1) to GRUB and sdb3 (hd1,3). In contrast to Linux,\
    \ GRUB does not consider CD-ROM drives to be hard drives. For example, if using\
    \ a CD on hdb and a second hard drive on hdc, that second hard drive would be\
    \ (hd1,).\n\n# ### 8.4.3 Setting Up the Configuration\n\nGRUB works by writing\
    \ to the first physical track of the hard disk. This area is not part of any file\
    \ system. The programs access GRUB modules in the boot partition. The default\
    \ location is /boot/grub.\n\nThe location of the boot partition is a choice of\
    \ the user that affects the configuration. One recommendation is to use a separate\
    \ partition (suggested size is 100 MB) partition for boot information. That way\
    \ each build, LFS or some commercial distro, can access the same boot files and\
    \ access can be made from any booted system. If you choose to do this, you will\
    \ need to mount the separate partition, move all files in the current /boot directory\
    \ (the linux kernel you just installed in the previous section) to the new partition.\
    \ You will then need to unmount the partition and remount it as /boot. do, be\
    \ sure to update /etc/fstab.\n\nUsing the current lfs partition will also work,\
    \ but configuration for multiple systems is more difficult. Using the above information,\
    \ determine the appropriate designator for the root partition (or boot partition,\
    \ if one is used). For the example, it is assumed that the root (or separate boot)\
    \ partition is sda2."
  merge: -1
