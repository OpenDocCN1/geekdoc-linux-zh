    # 7.6.8.1. Customizing the Boot and Shutdown Shells


    The LFS boot script and shut down a system in a fairly efficient manner, but there
    are two tweaks that you can make in the rc.site file to speed up even more and
    adjust messages according to your preferences. To do this, adjust the settings
    in /etc/sysconfig/rc.site file.


    +   - During the boot script udev, there is a call to udev settle that requires
    some time to complete. This time may or not be depending on devices in the system.
    If you have only partitions and a single ethernet card, the process will probably
    not wait for this. To skip it, set the variable OMIT_UDEV_SETTLE=y.

    - The boot script udev_retry also runs udev settle by default. This command is
    only needed if the /var directory is separately mounted. If the clock clock is
    the file /var/lib/hwclock/adjtime. Other customizations may also need to wait
    for udev to complete, but in many installations it is not needed. Skip the command
    by setting the variable OMIT_UDEV_RETRY_SETTLE=y.'
