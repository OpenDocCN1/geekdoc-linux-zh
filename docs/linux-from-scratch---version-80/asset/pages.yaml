    # # 1.4. Resources


    # ## 1.4.1. FAQ


    If during the building of the LFS system you encounter any errors, have any questions,
    or think there is a typo in the book, please start by consulting the Frequently
    Asked Questions (FAQ) that is located at http://www.linuxfromscratch.org/faq.


    # ## 1.4.2. Mailing Lists


    The linuxfromscratch.org server hosts a number of mailing lists used for the development
    of the LFS project. These lists include the main development and support lists,
    among others. If the FAQ does not solve the problem you are having, the next step
    would be to search the mailing lists at http://www.linuxfromscratch.org/search.html.


    For information on the details, how to subscribe, archive locations, and additional
    information, visit http://www.linuxfromscratch.org/mail.html.


    # ## 1.4.3. IRC


    Several members of the LFS community offer assistance on Internet Relay Chat (IRC).
    Before using this support, please make sure that your question is not already
    answered in the FAQ or the mailing list archives. You can find the IRC network
    at irc.reenode.net. The support channel is named #LFS-support.


    # ## 1.4.4. Mirror Sites


    The LFS project has a number of world-wide mirrors to access the website and download
    the required packages convenient. Visit the LFS website at http://www.linuxfromscratch.org/mirrors.html
    for a list of current mirrors.


    # ## 1.4.5. Contact Information


    Please direct all your questions and comments to one of the LFS mailing lists
    (see above).


    # ## 1.5. Help


    If an issue or question is encountered while working through this book, please
    check the FAQ at http://www.linuxfromscratch.org/faq/#generalfaq. Questions are
    often already answered there. If your question is not answered on this page, try
    to find the source of the problem. The following hint will give you some guidance
    for troubleshooting: http://www.linuxfromscratch.org/hints/downloads/files/errors.txt.


    If you cannot find your problem in the FAQ, search the mailing lists at http://www.linuxfromscratch.org/search.html.


    We also have a wonderful LFS community that is willing to offer assistance through
    the mailing lists and IRC (see Section 1,4, “Resources” section of this book).
    However, we get support questions every day and many of them can be answered by
    going to the FAQ and by searching the mailing lists first. For us to offer the
    best assistance, you need to do research on your own first. That allows us to
    focus on the more unusual support needs. If your searches do not produce a solution,
    please include all relevant information (mentioned below) in your request for
    help.'
