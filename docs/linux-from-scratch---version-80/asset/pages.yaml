    ```


    Some keymaps have dead keys (i.e., keys that do not produce a character themselves,
    but put an accent on the character produced by the next key) or define composition
    rules (such as: "press Ctrl+. A to get Æ" in the default keymap). Linux-4.9.9
    interprets dead keys and composition rules in the kernel correctly only when the
    source characters to be composed are not multibyte. This deficiency affects keymaps
    for European languages, because accents are added to unaccented ASCII characters,
    or ASCII characters are composed together. However, in UTF-8 it is a problem,
    e.g., for the Greek language, where one needs to put an accent on the letter "alpha".
    The solution is to avoid the use of UTF-8, or to install the X window system that
    does not have this limitation in its input handling.'
