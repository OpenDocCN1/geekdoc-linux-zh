- img_proc: true
  md: 'SUBSSTEM="net" - This tells Udev to ignore devices that are not network cards.


    ACTION="add" - This tells Udev to ignore this for a uevent that isn''t an add
    (''remove'' and ''change'') events also, but don''t need to rename network interfaces.


    DRIVERS="*" - This exists so Udev will ignore VLAN or bridge sub-interfaces (because
    these sub-interfaces do not have drivers). These sub-interfaces are skipped because
    the name that would be assigned collide with the parent devices.


    ATTR{address} - The value of this key is the NIC''s MAC address.


    ATTR{type="*"} - This ensures the rule only matches the primary interface in the
    case of wireless drivers, which create multiple interfaces. The secondary interfaces
    are skipped for the same reason that VLAN and bridge sub-interfaces are skipped:
    there would be a name collision otherwise.


    NAME - The value of this key is the name that Udev will assign to this interface.


    The value of NAME is the important part. Make sure you know which name has been
    assigned to each of your network cards before proceeding, and sure to use NAME
    when creating your configuration files.


    # 74.2. CD-ROM symlinks


    Some software that you may want to install (e.g., various media players) expect
    the /dev/cdrom and /dev/dvd links to exist, and point to a CD-ROM or DVD-ROM device.
    Also, it may be convenient to refer to these symlinks into /etc/stab with a script
    that generates rules for these symlinks for you, depending on the capabilities
    of each device, and but you need to decide which modes of operation you wish to
    have the script use.


    The first script can operate in "by-path" mode used by default for USB and FireWire
    devices, which the rules creates on the physical path of the CD or DVD device.
    Second, it can operate in "by-id" mode (default for IDE and SCSI devices), where
    the rules creates depend on identification strings stored in the CD or DVD device
    path. The path is determined by Udev''s path_id script, and the identification
    strings are read from the hardware by its ata_id or scsi_id programs, depending
    on which type of device you have.


    There are advantages to each approach; the correct approach to use will depend
    on what kind of devices changes may happen. If you expect the physical path to
    the drive (that is, the ports and/slots that it plugs into) to change, for example
    because you are planning on moving the drive to an IDE port or a different USB
    connector, then you use the "by-id" mode. On the other hand, if you expect the
    device''s identification to change, for example because it may die, and you would
    replace it with a different device with the same capabilities and it plugged into
    the same connectors, then you use the "by-path" mode.


    If either type of change is possible with your drive, choose a mode based on the
    type of change you expect to more often.


