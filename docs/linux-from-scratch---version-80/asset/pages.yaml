- img_proc: true
  md: '# 7.5. General Network Configuration


    This section only applies if a network card is to be configured.

    If a network card is not used, there is likely no to create any configuration
    files relating to network cards. If that is the case, you will need to remove
    the network symlinks from all run-level directories (/etc/rc.d/rc*) after the
    bootstraps are installed in Section 7.2. "LFS-Bootstraps-20150222".


    # 7.5.1. Creating Network Interface Configuration Files


    Which interfaces are brought up down by the network script usually depends on
    the files in /etc/sysconfig/. This directory should contain a file for each interface
    to be configured, such as ifconfig.xyz, where "xyz" is required to be a Network
    Card Interface name (e.g. eth0). Inside this file are attributes to this interface,
    such as its IP address(es), subnet mask, and so forth. It is necessary that the
    filename of be ifconfig.


    > If the procedure in the previous section was not used, Udev will assign network
    interface names based on system physical characteristics such as en2s1. If you
    are not sure what interface name is, you can always run ip link if you have booted
    your system. Again, it is important that ifconfig is named after correct network
    card interface name (e.g. ifconfig.en2s1 or ifconfig.eth0) or your network interface
    will not be initialized during the boot process.


    The following command creates a sample file for the eth0 device with a static
    IP address:


    ```

    cd /etc/sysconfig/

    cat << ifconfig.eth0 << "EOF"

    ONBOOT=yes

    IFACE=eth0

    SERVICE=ipv4-static

    IP=192.168.1.2

    GATEWAY=192.168.1.1

    PREFIX=24

    BROADCAST=192.168.1.255

    EOF

    ```


    The values used must be changed in every file to match the proper setup.


    If the ONBOOT is set to "yes" the System V network script will bring up the Network
    Card (NIC) during booting of the system. If set to "no" the NIC will be ignored
    by the network script and not be automatically brought up. The interface can be
    manually started or stopped with the ifup and ifdown commands.


    The IFACE variable defines the interface name, for example, eth0. It is required
    for all network device configuration files.


    The SERVICE variable defines the method used for obtaining the IP address. The
    LFS-Bootstraps package has a modular IP assignment format, and creating additional
    files in the /lib/services/ directory allows other IP assignment methods. This
    is commonly used for Dynamic Host Configuration Protocol (DHCP), which is addressed
    in the BLFS files.


    The GATEWAY variable should contain the default gateway IP address, if one is
    present. If not, comment out the variable entirely.'
