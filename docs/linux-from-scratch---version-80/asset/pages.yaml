- img_proc: true
  md: '# Linux From Scratch - Version 8.0


    An explanation of this initialization file is in the main page for inittab. For
    LFS, the key command that runs is rc. The initialization file above will instruct
    rc to run all the scripts starting with an S in the /etc/rc.d/ followed by all
    the scripts starting with an S in the /etc/rc.d? where the question mark is specified
    by the default value.


    As a convenience, the rc script reads a library of functions in /lib/lsb/init-functions.
    This library also reads an optional configuration file, /etc/sysconfig/rc.site.
    Any of the system configuration parameters described in subsequent sections can
    be alternatively placed in this file consolidation of all system parameters in
    this one


    As a debugging convenience, the functions script logs all out to /run/var/bootlog.
    The /run directory is a tmpfs, this is not persistent across boots, however it
    is appended to the more permanent file /var/log/boot.log at the end of the boot
    process


    # 7.6.2.1 Changing Run Levels


    Changing run-levels is done with init <runlevel>, where <runlevel> is the target
    run-level. For example, to reboot the computer, a user could use the init 6 command,
    which is an alias for the reboot command. Likewise, init 0 is an alias for the
    halt command.


    There are a number of directories under /etc/rc.d that look like rc?.d(where ?
    is the number of the run-level) and rcinit.d, all containing a number of symbolic
    links. Some begin with a K, the others begin with an S and start a service. All
    of them have two numbers following the initial letter. The K means to stop (kill)
    a service and the S means to start a service. The numbers determine the order
    in which the scripts run, from 00 to 99–the lower the number it gets executed.
    When init switches to another run-level, the appropriate services are either started
    or stopped, depending on the runlevel.


    The real scripts are in /etc/rc.d/init.d. They do the actual work, and the symlinks
    all point to them. K and S links point to the same script in /etc/rc.d/init.d.
    This is because the scripts can be called with different parameters like start.stop.restart.reload.and
    status. When a K is encountered, the appropriate script is run with the stop argument.
    When an S link is encountered, the appropriate script is run with the start argument.


    There is one exception to this explanation. Links that start with an S in the
    rc0.d and rc6.d directories will not cause anything to be started. They will be
    called with the parameter to stop. The logic behind this is that when a user is
    going to reboot or halt the system, the system only needs to be stopped.


    These are descriptions of what the arguments the scripts do:


    ```

    start

    The service is started.

    stop

    The service is stopped.

    restart

    The service is stopped and then started again.

    reload

    The configuration of the service is updated. This is used after the configuration
    file of a service was modified, when the service does not need to be restarted.

    status

    Tells if the service is running and with which PIDs.

    ```


    228'
