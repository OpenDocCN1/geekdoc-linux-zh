  md: '# ### 3.4. Useful Reading


    Additional helpful documentation is available at the following sites:


    +   - A Userspace Implementation of devfs http://www.chroah.com/linux/talks/ols_2003_udev_paper/Reprint-Koah-Hartman-OLS2003.pdf

    - The sysfs Filesystem http://kernel.org/pub/linux/kernel/people/doc/papers/ols-2005-mochedev.pdf


    # ### 7.4. Managing Devices


    # #### 7.4.1. Network Devices


    Udev, by default, names devices according to Firmware/BIOS data or physical characteristics
    like the bus, or MAC address. The purpose of this naming convention is to ensure
    that network devices are named consistently and not based on how the network card
    was discovered. For example, a computer having two network cards made by Intel
    and Realtek, the network card manufactured by Intel may become eth0 and the Realtek
    card be eth1. In some cases, after a reboot the cards get renamed the other way.


    In the new naming scheme, typical network device names would then be like enp5s0
    or wlp3s0. If this naming convention is not desired, the traditional naming scheme
    or a custom scheme can be implemented.


    # #### 7.4.1.1. Disabling Persistence on the Kernel Command Line


    The traditional naming scheme using eth0, eth1, can be restored by adding net.ifnames=0
    to the kernel command line. This is most appropriate for those who have only one
    device of the type. Laptops often have multiple ethernet connections that are
    named eth0 and wlan0 and are also candidates for this method. The command line
    is passed in the GRUB configuration file. See Section 8.4.4, “Creating the GRUB
    Configuration”.


    # #### 7.4.1.2. Creating Udev Rules


    The naming scheme can be customized by creating custom Udev rules. A script has
    been included in the kernel initial. Generate these rules by running:


    ```

    bash /lib/udev/init-persistent-rules.sh

    ```


    Now, inspect /etc/udev/rules.d/70-persistent-net.rules file, to find out which
    name was assigned to which network device:


    ```

    cat /etc/udev/rules.d/70-persistent-net.rules

    ```


    > Note

    In cases when MAC address have been assigned to a network card manually or in
    a virtual environment like Qemu or Xen, the network rules may not have been generated
    because addresses are not consistently assigned. In these cases, this method cannot
    be used.


    The file begins with a comment block followed by rules for each NIC. The first
    is a commented description showing its hardware IDs (e.g. its PCI vendor and device
    IDs, if it''s a PCI card), along with its driver in parentheses, if the driver
    can. Neither the hardware ID nor the driver is used to determine which name give
    an interface; this information is only for reference. The second line is the Udev
    rule that matches this NIC and assigns it a name.


    All Udev rules are made up of several keys, separated by commas and optional whitespace.
    This rule''s keys and explanation of each of them as follows:'
  merge: -1
