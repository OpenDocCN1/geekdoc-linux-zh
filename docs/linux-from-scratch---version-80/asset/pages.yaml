- img_proc: true
  md: 'The list of all locales supported by Glibc can be obtained by running the following
    command:


    | locale -a |


    Charmaps can have a number of aliases, e.g., "ISO-88859-1" is also referred to
    as "iso-88859-1" and "iso888591". Some applications cannot handle the various
    synonyms correctly (e.g., require that "UTF-8" is written as "UTF-8", not "utf8"),
    so it is safe in most cases to choose the canonical name for a particular locale.
    To determine the canonical, run the following command, where <locale name> is
    the output by **locale -a** for your preferred locale "en_GB.iso88591" in our
    example.


    | LC_ALL=<locale name> locale charset |


    For the "en_GB.iso88591" locale, the command will print:


    | ISO-8859-1 |


    This results in a final locale setting of "en_GB.ISO-8859-1". It is important
    that the locale found using the heuristic is tested prior to being added to the
    Bash startup files:


    | LC_ALL=<locale name> locale language

    LC_ALL=<locale name> locale charset

    LC_ALL=<locale name> locale int_curr_symbol

    LC_ALL=<locale name> locale int_prefix |


    The above commands should print the language name, the character encoding used
    by the locale, the local currency, and the prefix to dial the phone number in
    order to get into the country. If any of the commands fail with a message similar
    to the one below, means that your locale was not installed in Chapter 6 or it
    is not supported by the default installation of Glibc.


    | locale: Cannot set LC_* to default locale: No such file or directory |


    If this happens install the desired locale using the **localedef** command, or
    consider choosing a different locale. Further instructions assume that there are
    no error messages from Glibc.


    Some packages LFS may also support for your chosen locale. One is the X library
    (part of the Window System), which outputs the following error message if the
    locale does not exactly match the character map name in its files:


    | Warning: locale not supported by Xlib, locale set to C |


    In several cases Xlib expects the character map will be listed in uppercase notation
    with canonical dashes. For instance, "ISO-8859-1" rather than "iso888591". It
    is also possible to find an appropriate specification by removing the charset
    part of the locale specification. This can be checked by running the **locale
    charset** command in both locales. For example, one would have to change "de_DE.ISO-8859-15@euro"
    to "de_DE@euro" in order to get this local locale recognized by Xlib.


    Other packages can also function incorrectly (but not necessarily display any
    error messages) if the locale does not meet their expectations. In such cases,
    investigating how Linux distributions support your locale might provide some useful
    information.'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'Once the proper locale settings have been determined, create the /etc/profile
    file:


    ```

    cat > /etc/profile << "EOF"

    # Begin /etc/profile


    export LANG=<ll>.<CC>.<charmmap>@modifiers


    # End /etc/profile

    EOF

    ```


    The "C" (default) and "en_US" (the recommended one for United States English users)
    locales are different. "C" uses the US-ASCII 7 bit character set, and treats bytes
    with the high bit as invalid characters. That''s why, e.g., the ls command shows
    them with question marks in that locale. Also, an attempt to send mail with such
    characters from Mutt or Pine results in non-RFC-conforming messages being sent
    (the charset in the outgoing mail is indicated as “unknown 8-bit”). You can use
    the "C" locale only if you are sure that you will never need 8-bit characters.


    UTF-8 based locales are not supported well by some programs. Work is in progress
    to document and, if possible, fix such problems, see http://www.linuxfromscratch.org/blfs/view/8.0/introduction/locale-issues.html.


    # 7.8. Creating the /inputrc File


    The inputrc file is the configuration file for Readline library, which provides
    editing capabilities while the user is entering a line from the terminal. It works
    by translating keyboard inputs into specific actions. Readline is used by Bash
    and most other shells as well as many other applications.


    Most people do not need user-specific functionality the command below creates
    a global /etc/inputrc by everyone who logs in. If you later decide you need to
    override the defaults on a per-user basis, you can create a .inputrc file in the
    user''s home directory with the modified mappings.


    For more information on how to edit the inputrc file, see info bash under the
    Readline Init File section. info readline is also a good source of information.'
