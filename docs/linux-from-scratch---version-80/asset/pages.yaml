  md: '# Warning


    The headers in the system''s `include` directory (`/usr/include`) should `always`
    be the ones against Glibc which was compiled, the sanitised headers in Section
    6.7, "Linux-4.9.9 API Headers". Therefore, they should `never` be replaced by
    either the kernel headers or any other kernel sanitised headers.


    # 8.3.2. Configuring Linux Module Load Order


    Most of time Linux modules are loaded automatically, but sometimes it needs some
    specific direction. The program that loads modules, `modprobe` or `insmod`, uses
    `/etc/modprobe.d/usb.conf` for this purpose. This file needs to be created if
    the USB drivers (ehci_hccd, ohci_hccd and uhci_hccd) have been built as modules,
    they will be loaded in the correct order; ehci_hccd must be loaded prior to ohci_hccd
    and uhci_hccd in order to avoid a warning when booting at time.


    Create a new file `/etc/modprobe.d/usb.conf` by running the following:


    ```

    install -v -m755 -d /etc/modprobe.d

    cat /etc/modprobe.d/usb.conf << "EOF"

    # Begin /etc/modprobe.d/usb.conf


    install ohci_hccd /sbin/modprobe ehci_hccd; /sbin/modprobe ohci_hccd; true

    install uhci_hccd /sbin/modprobe ehci_hccd; /sbin/modprobe -i uhci_hccd; true


    # End /etc/modprobe.d/usb.conf

    EOF

    ```


    # 8.3.3. Contents of Linux


    +   Installed files: config-4.9.9, vmlinux-4.9.9-lfs-8.0, and System.map-uhci-4.9.9


    +   Installed directories: /lib/modules/usr/share/doc/linux-4.9.9


    # Short Descriptions


    +   config-4.9.9

    Contains all the configuration selections for the kernel


    +   vmlinux-4.9.9-lfs-8.0

    The engine of the Linux system. When turning on the computer, the kernel is the
    first part of the operating system that gets loaded. It detects and initializes
    all components of the computer''s hardware, then makes these components available
    as a tree of files to the software and turns a single CPU into a multitasking
    machine capable of running scores of programs seemingly at the same time


    +   System.map-4.9.9

    A list of addresses and symbols; it maps the entry points and addresses of all
    the functions and data structures in the kernel'
