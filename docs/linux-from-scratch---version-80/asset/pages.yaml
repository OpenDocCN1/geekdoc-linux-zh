  md: '# ## 43. Autoconf-2.69


    The Autoconf package contains programs for producing shell scripts that can automatically
    configure source code.

    Approximate build time: less than 0.1 SBU (about 3.5 SBU with tests)

    Required disk space: 17.3 MB


    # ### 6.43.1. Installation of Autoconf


    Prepare Autoconf for compilation:


    ```

    ./.configure --prefix=/usr

    ```


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    This takes a long time, about 3.5 SBUs. In addition, several tests are skipped
    that use Automake. For full test coverage, Autoconf can be retested after Automake
    has been installed. In addition, two tests fail due to changes in libtool-2.4.3
    and later.


    Install the package:


    ```

    make install

    ```


    # ### 6.43.2. Contents of Autoconf


    +   **Installed programs:** autoconf, autoheader, autom4te, autoreconf, autoscan,
    autoupdate, and ifnames

    **Installed directory:** /usr/share/autoconf


    # #### Short Descriptions


    +   **autoconf** produces scripts that automatically configure source code packages
    to adapt to many kinds of Unix-like systems; the configuration scripts it produces
    are independent—running them does not require the **autoconf** program


    +   **autoheader** A tool for creating template files of C #define statements
    for configure to use


    +   **autom4te** A wrapper for the M4 macro processor


    +   **autoreconf** automatically runs **autoconf**, autoheader, aclocal, automake,
    gettextize, and libtool in the correct order to save time when changes are made
    to **autoconf** and template files


    +   **autoscan** helps to create a configure.in file for a software package; it
    examines the files in a directory tree, searching for common portability, and
    creates a configure.scan file that serves as a preliminary configure.in file for
    the package


    +   **autoupdate** modifies a configure.in file that still calls **autoconf**
    macros by their old names to use the current macro names


    +   **ifnames** helps when writing configure.in files for a software package;
    it prints the identifiers that the package uses in C preprocessor conditionals
    [If a package has already been set up to have some'
