    # 7.6.7. Configuring the sysloglog Script


    The syslogd script invokes the syslog program as a part of System V initialization.
    The -m option turns off the periodic timestamp that syslog writes to the logs
    every 20 minutes by default. If you want to turn off this periodic timestamp,
    edit /etc/sysconfig/rc.site and define the variable SYSLOGD_PARMS to the desired
    value. To remove all parameters, set the variable to a null value:


    ```

    SYSLOGD_PARMS=

    ```


    See man syslogd for options.


    # 7.6.8. The rc.site File


    The optional /etc/sysconfig/rc.site file contains settings that are automatically
    set for each SystemBoot script. It can alternately the values set by the hostname,
    console, and clock files in the /etc/sysconfig/ directory. If the associated variables
    are present in both these separate files and rc.site, the values in the script
    files take precedence.


    rc.site also contains parameters that can customize other aspects of the boot
    process. Setting the IMPORT variable will enable running of bootscripts. Other
    options are described in the file contents. The default version of the file is
    as follows:


    ```

    # rc.site

    # Optional parameters for boot scripts


    # Distro Information

    # These values, if specified here, override the defaults

    #DISTRO="Linux From Scratch" # The distro name

    #DISTRO_CONTACT="lfs-dev@linuxfromscratch.org" # Bug report address

    #DISTRO_MINI="IFS" # Short name used in filenames for distro config


    # Define custom colors used in messages printed to the screen

    #n Please consult `console_codes` for more information

    # under the "ECMA-48 Set Graphics Rendition" section

    ```'
