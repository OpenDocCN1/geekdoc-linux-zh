    The Pipeline package contains a library for manipulating pipelines of subprocesses
    in a flexible and convenient way. It is required by the Man-DB package.


    +   - Libtool


    This package contains the GNU library support script. It wraps the complexity
    of using shared libraries in a consistent, portable interface. It is needed by
    the test suites in other LFS packages.


    +   - Linux Kernel


    This package is the Operating System. It is the Linux in the GNU/Linux environment.


    +   - M4


    This package contains a general text macro processor useful as a build tool for
