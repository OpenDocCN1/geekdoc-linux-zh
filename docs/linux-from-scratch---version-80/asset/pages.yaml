- img_proc: true
  md: 'Unless the computer is to be visible to the Internet (i.e., there is a registered
    domain and a value block of assigned addresses—most users do not have this), make
    sure that the IP address is in the private network IP address range. Valid ranges
    are:


    | Private Network Address Range | Normal Prefix |

    | 10.0.0.1 - 10.255.255.254 | 8 |

    | 172.x.0.1 - 172.x.255.254 | 16 |

    | 192.168.y.1 - 192.168.y.254 | 24 |


    x can be any number in the range 16-31. y can be any number in the range 0-255.


    A valid private IP address could be 192.168.1.1. A valid FDN for this IP could
    be lfs.example.


    Even without using a network card, a valid FDN is still required. This is necessary
    for certain programs to operate correctly.


    Create the /etc/hosts file by running:


    ```

    cat /etc/hosts << "EOF"

    # Begin /etc/hosts (network card version)


    127.0.0.1 localhost

    <192.168.1.1> <HOSTNAME.example.org> [alias1] [alias2 ...]


    # End /etc/hosts (network card version)

    EOF

    ```


    <192.168.1.1> and <HOSTNAME.example.org> values need to be changed for specific
    uses or requirements (if assigned an IP address by a network/system administrator
    and the machine will be connected to an existing network). The optional alias
    name(s) can be omitted.


    If a network card is not going to be configured, create the /etc/hosts file by
    running:


    ```

    cat /etc/hosts << "EOF"

    # Begin /etc/hosts (no network card version)


    127.0.0.1 <HOSTNAME.example.org> <HOSTNAME> localhost


    # End /etc/hosts (no network card version)

    EOF

    ```


    # 7.6. System V Bootscript Usage and Configuration


    # 7.6.1. How Do the System V Bootscripts Work?


    Linux uses a special booting facility named SysInit that is based on a concept
    of run-levels. It can be different from one to another, so it cannot be assumed
    that things worked in one particular Linux distribution, they should work the
    same in LFS too. LFS has its own way of doing things, but it respects generally
    accepted standards.'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'SysInit (which will be referred to as "init" from now on) works using a run-level
    scheme. There are seven (numbered 0 to 6) run-levels (actually, there are more
    run-levels, but they are for special cases and are generally not used). See init
    for details, and each one those corresponds to the actions the computer is supposed
    to perform when it starts up. The default run-level is 3. Here are the descriptions
    of the different run-levels as they are implemented:


    ```

    0: halt the computer

    1: single-user mode

    2: multi-user mode without networking

    3: multi-user mode with networking

    4: reserved for customization, otherwise does the same as 3

    5: same as 4, it is usually used for GUI login (like X''s xdm or KDE''s kdm)

    6: reboot the computer

    ```


    # 7.6.2. Configuring Sysvinit


    During the kernel initialization, the first program that is run is either specified
    on the command line or, by default init. This program reads the initialization
    file /etc/inittab. Create this file with:


    ```

    cat /etc/inittab << "EOF"

    # Begin /etc/inittab


    id3:initdefault:

    sii::sysvinit:/etc/rc.d/init.d/rc


    10:0:wait:/etc/rc.d/init.d/rc 0

    11:1:wait:/etc/rc.d/init.d/rc 1

    12:2:wait:/etc/rc.d/init.d/rc 2

    13:3:wait:/etc/rc.d/init.d/rc 3

    14:4:wait:/etc/rc.d/init.d/rc 4

    15:5:wait:/etc/rc.d/init.d/rc 5

    16:6:wait:/etc/rc.d/init.d/rc 6


    ca:12345:ctrlaltdel:/bin/shutdown -tl -a -r now


    su:016:once:/sbin/sulogin


    1:2345:respawn:/sbin/agetty --nuclear tty1 9600

    2:2345:respawn:/sbin/agetty tty2 9600

    3:2345:respawn:/sbin/agetty tty3 9600

    4:2345:respawn:/sbin/agetty tty4 9600

    5:2345:respawn:/sbin/agetty tty5 9600

    6:2345:respawn:/sbin/agetty tty6 9600


    # End /etc/inittab

    EOF

    ```'
