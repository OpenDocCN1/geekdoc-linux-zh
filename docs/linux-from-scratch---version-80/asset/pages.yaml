  md: '# # Chapter 9. The End


    # ## 9.1. The End


    Well done! The new LFS system is installed! We wish you much success with your
    shiny new custom-built Linux system.


    It may be a good idea to create an /etc/lfs-release file. By having this file,
    it is very easy for you (and for us if you need to ask for help at some point)
    to find out which LFS version is installed on the system. Create this file by
    running:


    ```

    echo 8.0 > /etc/lfs-release

    ```


    It is also a good idea to create a file to show the status of your new system
    with respect to the Linux Standards Base (LSB). To create this file, run:


    ```

    cat > /etc/lsb-release << "EOF"

    DISTRIB_ID="Linux From Scratch"

    DISTRIB_RELEASE="8.0"

    DISTRIB_CODENAME="<name here>

    DISTRIB_DESCRIPTION="Linux From Scratch"

    EOF

    ```


    Be sure to put sort of customization for the field ''DISTRIB_CODENAME'' to make
    the system uniquely yours.


    # ## 9.2. Get Counted


    Now that you have finished the book, do you want to be counted as an LFS user?
    Head over to http://www.linuxfromscratch.org/cgi-bin/lfscounter.php and register
    as an LFS user by entering your name and the first LFS version you have used.


    Let''s reboot into LFS.


    # ## 9.3. Rebooting the System


    Now that all of the software has been installed, it is time to reboot your computer.
    However, you should be aware of a few things. The system you have created in this
    book is quite minimal, and most likely will not have the functionality you would
    need to be able to continue. By installing a few extra packages from the BLFS
    book while still in your current environment, you can leave yourself in a much
    better position to continue once you reboot into your new LFS system. Here are
    some suggestions:


    +   - A text browser using Lynx will allow you to easily view the BLFS book in
    one virtual terminal, while building packages in another.

    - The GPM package will allow you to perform copy/paste actions in your virtual
    terminals.

    - If you are in a situation where static IP configuration does not meet your networking
    requirements, installing a package such as dhcped or the client portion of dhcp
    may be useful.

    - Installing sudo may be useful for building packages as a non-root user and easily
    installing the resulting packages in your system.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Linux From Scratch - Version 8.0


    +   * If you want to access your new system from a remote system within a comfortable
    GUI environment, install openssh and its prerequisite, install wget.


    +   * To make fetching files over the internet, install wget.


    +   * If one or more of your disk drives has a GUID partition table (GPT), either
    gptfdisk or parted will be useful.


    +   * Finally, a review of the following configuration files is also appropriate
    at this point.


    +   * /etc/bashrc

    * /etc/dicolors

    * /etc/fstab

    * /etc/hosts

    * /etc/inputrc

    * /etc/profile

    * /etc/resolv.conf

    * /etc/vimrc

    * /root/.bash_profile

    * /root/.bashrc

    * /etc/sysconfig/network

    * /etc/sysconfig/ifconfig.eth0


    Now that we have said, let''s move on booting our shiny new LFS installation for
    the first time! First exit from the chroot environment:


    # logout


    Then unmount the virtual file systems:


    ```

    mount -v $LFS/dev/pts

    mount -v $LFS/dev

    mount -v $LFS/run

    mount -v $LFS/proc

    mount -v $LFS/sys

    ```


    Unmount the LFS file system itself:


    ```

    mount -v $LFS

    ```


    If multiple partitions were created, unmount the other partitions before unmounting
    the main one, like this:


    ```

    mount -v $LFS/usr

    mount -v $LFS/home

    mount -v $LFS

    ```


    Now, reboot the system with:


    ```

    shutdown -r now

    ```


    Assuming the GRUB boot loader was set up as outlined earlier, the menu is set
    to boot LFS 8.0 automatically.'
