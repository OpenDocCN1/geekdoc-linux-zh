  md: 'Create the /etc/passwd file by running the following command:


    ```

    cat /etc/passwd << "EOP"

    root:x:0:0:root:/root:/bin/bash

    bin:x:1::dev/null:/bin/false

    daemon:x:6:6:Daemon User:/dev/null:/bin/false

    messagebus:x:18:18:D-Bus Message Daemon User:/var/run/dbus:/bin/false

    nobody:x:99:99:Unprivileged User:/dev/null:/bin/false

    EOP

    ```


    The actual password for root (the "x" used here is just a placeholder)


    Create the /etc/group file by running the following command:


    ```

    cat /etc/group << "EOP"

    root:x:0:

    bin:x:1:daemon

    sys:x:2:

    kmem:x:3:

    tape:x:4:

    tty:x:5:

    daemon:x:6:

    floppy:x:7:

    disk:x:8:

    lp:x:9:

    dialout:x:10:

    audio:x:11:

    video:x:12:

    utmp:x:13:

    usb:x:14:

    cdrom:x:15:

    mad:x:16:

    messagebus:x:18:

    sysystemd-journal:x:23:

    input:x:24:

    mail:x:34:

    nogroup:x:99:

    users:x:999

    EOP

    ```


    The created groups are not part of any standard—they are groups decided in part
    by the requirements of the Udev configuration in this chapter, and by common convention
    by a number of Linux distributions. In addition, some tests rely only on specific
    users or groups. The Linux Standard Base (LSB, available at http://www.linuxbase.org)
    recommends only that group root with a Group ID (GID) of 0, a group bin with a
    GID of 1 be present. All other groups and GIDs can be chosen by the system administrator
    well-written programs do not depend on GID numbers, but rather use the group''s
    name.


    To remove the "I have no name!" prompt, start a new shell. Since a full Glibc
    was installed in Chapter 5 and the /etc/passwd and /etc/group files have been
    created, user name and group name resolution will work now:


    ```

    exec /tools/bin/bash --login +h

    ```'
