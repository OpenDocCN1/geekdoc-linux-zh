- img_proc: true
  md: '# Linux From Scratch - Version 8.0


    A short time later, the kernel will send a udev. Based on the rules specified
    in the files within the /etc/udev/rules.d, /lib/udev/rules.d, and /run/udev.rules
    directories, udev will create all symlinks to the device node, or change its permissions,
    owner, or group, or modify the udev database (name) for object.


    The rules in these directories are numbered and most directories are merged together.
    If udev can''t find a rule for the device it is creating, it will leave the permissions
    and ownership at whatever devtmpfs used initially.


    # 7.3.2. Module Loading


    Device drivers as modules may have aliases built into them. Aliases are usually
    related to the output of the modinfo program and are specific devices supported
    by a module. For example, the snd-f801 driver supports PCI devices with device
    ID 0xc819 and device ID 0xb801, and has an alias of :pci:v00001319d0000b801s*sdbc4c01ii*.
    The udev creates the aliases of the driver that would handle the device via sysfs.
    E.g., /sys/bus/pci/devices/0000:00:0d.0/modfile might contain the string "pci:v00001319d0000b801sv00001319d00001319bc4c0ii".
    The default rules with Udev will use udev to call /sbin/modprobe with the contents
    of the MODALIAS environment variable (which should be the same as the contents
    of the modalias file in sysfs), loading all modules whose aliases match this string
    wildcard expansion.


    In this example, that addition to snd-f801, the absolute (and unwanted) forte
    driver will be loaded if it is available. See below for ways in which the unloading
    of unwanted drivers can be prevented.


    The kernel is also able to load network protocols, filesystems and NLS support
    on demand.


    # 7.3.4. Handling Hotpluggable/Dynamic Devices


    When you plug in a device, such as a Universal Bus (USB) MP3 player, the kernel
    recognizes that the device is now connected and generates a uevent. This is then
    handled by udev as described above.


    # 7.3.3. Problems with Loading Modules and Creating Devices


    There are a few possible problems when it comes to automatically creating device
    nodes.


    # 7.3.3.1. A kernel module is not automatically loaded


    Udev will only load a module if it has a bus-specific alias and the bus driver
    exports the necessary aliases to sysfs. In other cases, one should order module
    loading by other. With Linux-4.9.9, Udev is known to load properly-written drivers
    for INPUT, PCI, USB, SCSI, SERIO, and FireWire.


    To determine if the device you requires the necessary support for Udev, run modinfo
    with the alias you have. Now look up the device directory under /sys/bus and check
    whether there is a modalias file.


    If the modalias file exists in sysfs, the driver supports the device and can talk
    to it, but doesn''t have the alias, it is in a bus. Load the driver without help
    from Udev and expect the issue to be fixed.


    If there is no modalias file in the relevant directory /sys/bus, this means that
    the kernel developers have not added module support to this bus type. With Linux-4.9.9,
    this is the case with ISA buses. Expect this issue to be fixed in later kernel
    versions.


    Udev is not intended to load "wrapper" drivers as snd-pcm-oss and non-hardware
    drivers as loop at all.


    219'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 7.3.3.2. A kernel module is not loaded automatically, and Udev is not intended
    to load it


    If the “wrapper” only enhances the functionality provided by some other module
    (e.g., snd-pcm enhances the functionality of snd-pcm by making the sound cards
    available to OS applications), configure modprobe to load the wrapper after udev
    loads the module. To do this, add a “softdep” line in any /etc/modprobe.d/<filename>.
    For example:


    ```

    softdep snd-pcm post: snd-pcm-oss

    ```


    Note that the “softdep” command also allows pre: dependencies, or a mixture of
    pre and post:. See the modprobe.d (5) manual page for more information on “softdep”
    syntax and capabilities.


    If the module in question is not a wrapper and is itself useful, configure the
    modules bootsort on your system body. To do this, add the module name to the /etc/sysconfig/modules
    on a single line. It works for wrappers too, which is suboptimal in case


    # 7.3.3.3. Udev loads some unwanted module


    Either do not build the module, or blacklist it in a /etc/modprobe.d/blacklist.conf
    file as done with the forte module in the following example:


    ```

    blacklist forte

    ```


    Blacklisted modules can still be loaded manually with the explicit modprobe command.


    # 7.3.3.4. Udev creates a device incorrectly, or makes a wrong symlink


    This usually happens if a rule unexpectedly matches a device. For a poorly-written
    rule can match both a SCSI device (as desired) and the corresponding SCSI generic
    device (incorrectly) by vendor. Finding the rule and make it more specific, with
    the help of the udevadm info command.


    # 7.3.3.5. Udev rules run wildly


    This may be another manifestation of the previous problem. If not, and your rule
    uses sysfs attributes, it may be the kernel timing issue, for now, you can work
    around it by creating a rule that waits for the sysfs attribute and appending
    it to the /etc/udev/rules.d/10-wait_for_sysfs.rules file (create file if it does
    not exist). Please notify the LFS Development list if you do this and helps


    # 7.3.3.6. Udev does not create a device


    Further assumes that the driver is built statically into the kernel or loaded
    as a module, and that you have already checked that Udev doesn''t create a mismatched
    device.


    Udev has no information to create a device node if a kernel driver does not export
    its data to sysfs. This is most common with third party drivers from outside the
    kernel tree. Create a static device node in /lib/udev/devices with the appropriate
    major/minor numbers (see the devices.txt include the kernel documentation or the
    documentation provided by the third party driver vendor). The static device node
    will be copied to /dev by udev.


    # 7.3.3.7. Device naming changes randomly after rebooting


    This is due to fact that udev, by design, handles uevents and modules in parallel,
    and thus in an unpredictable order. This will never be “fixed”. You should not
    rely the kernel device name by state. Instead, create your rules make symlinks
    with stable names based on some attributes of the device, such as a serial number
    *id installed by udev. See Section 7.4, “Managing Devices” and Section 7.5, “General
    Network Configuration” for examples.'
