- img_proc: true
  md: "# 2.5. Creating a File System on the Partition\n\nNow a blank partition has\
    \ been set up, the file system can be created. LFS can use any file system recognized\
    \ by the Linux kernel, the most common types are ext3 and ext4. The choice of\
    \ file system can be complex and depends on the characteristics of the files and\
    \ the size of the partition. For example:\n\n+   - ext2\n  is suitable for small\
    \ partitions that are updated infrequently such as /boot.\n- ext3\n  is an upgrade\
    \ to ext2 that includes a journal to help recover the partition's status in the\
    \ case of an unclean shutdown.\n- ext4\n  is the latest version of the ext file\
    \ system partition of types. It provides several new capabilities including nano-second\
    \ timestamps, creation and use of very large files (16 TB), and speed improvements.\n\
    \nOther file systems, including FAT32, NTFS, ReiserFS, JFS, and XFS are useful\
    \ for specialized purposes. More information about these file systems can be found\
    \ at http://en.wikipedia.org/wiki/Comparison_of_file_systems.\nLFS assumes that\
    \ the root file system (/) is of type ext4. To create an ext4 file system on the\
    \ LFS partition, run the following:\n\n```\nmkfs -v -t ext4 /dev/<xxx>\n```\n\n\
    If you are using swap partition, there is no need to format it. If a new swap\
    \ partition was created, it will need to be initialized with:\n\n```\nmkswap /dev/<yyyy>\n\
    ```\n\nReplace <yyyy> with the name of your swap partition.\n\n# 2.6. Setting\
    \ The LFS Variable\n\nThroughout this book, the environment variable LFS will\
    \ be used several times. You should ensure that this variable is always defined\
    \ throughout the LFS build process. It should be set to the name of the directory\
    \ where you will be building your LFS system - we will use /mnt/lfs as an example,\
    \ but the choice is up to you. If you are building LFS on a separate partition,\
    \ this directory will be the mount point for the partition. Choose a directory\
    \ location and set the variable with the following command:\n\n```\nexport LFS=/mnt/lfs\n\
    ```\n\nHaving this variable is beneficial in commands such as mkdir -v $LFS/tools\
    \ can be typed literally. The shell will automatically replace \"$LFS\" (or whatever\
    \ the variable was set to) when it processes the command line.\n\n> Caution\\\
    Do not forget to check if LFS is set whenever you leave and reenter the current\
    \ working environment (such as doing a su to root or another user). Check that\
    \ the LFS variable is set up properly with:\n\n```\necho $LFS\n```\n\nMake sure\
    \ the output shows the path to LFS system's build location, which is /mnt/lfs\
    \ if the provided example was followed. If the output is incorrect, use the command\
    \ earlier on this page to set $LFS to the correct directory name."
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Note


    # ## 2.7 Mounting the New Partition


    Now that a file system has been created, the partition needs to be made accessible.
    In order to do this, the partition needs to be mounted at a chosen point. For
    the purposes of this book, it is assumed that the file system is mounted under
    the directory specified by the LFS environment variable as described in the previous
    section.


    Create the mount point and mount the LFS file system by running:


    ```

    mkdir -pv $LFS

    mount -v -t ext4 /dev/<xxx> $LFS

    ```


    Replace <xxx> with the designation of the LFS partition.


    If using multiple partitions for LFS (e.g., one for / and another for /usr), mount
    them using:


    ```

    mkdir -pv $LFS

    mount -v -t ext4 /dev/<xxx> $LFS

    mkdir -v $LFS/usr

    mount -v -t ext4 /dev/<yyy> $LFS

    ```


    Replace <xxx> and <yyy> with the appropriate partition names.


    Ensure that this new partition is not mounted with permissions that are too restrictive
    (such as the nosuid or nodev options). Run the mount command without any parameters
    to see what options are set for the mounted LFS partition. If nosuid or nodev
    are set, the partition will need to be remounted.


    If you are using a swap partition, ensure that it is enabled using the swapon
    command:


    ```

    /sbin/swapon -v /dev/<zzz>

    ```


    Replace <zzz> with the name of the swap partition.


    Now that there is an established place to work, it is time to download the packages.'
  merge: -1
