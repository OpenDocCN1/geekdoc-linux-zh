    \ \\\n  libc_cv_c_cleanup=yes\n```\n\nThe meaning of the following options:\n\n\
    ```\n--host=$LFS_TGT, --build=$(../scripts/config.guess)\n```\n\nThe combined\
    \ effect of these switches is that Glibc's build system configures itself to cross-compile,\
