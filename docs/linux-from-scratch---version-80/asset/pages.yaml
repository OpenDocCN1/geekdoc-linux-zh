  md: '# # Chapter 4. Final Preparations


    # ## 4.1 Introduction


    In this chapter, we will perform a few additional tasks to prepare for building
    the temporary system. We will create a directory in $LFS for an unprivileged user
    to reduce risk, and create an appropriate build environment for that user. We
    will also explain the unit of time we use to measure how long LFS packages take
    to build, or "SBUs", and give some information about package test suites.


    # ## 4.2. Creating the LFS/tools Directory


    All programs compiled in Chapter 5 will be installed under $LFS/tools to keep
    them separate from the programs compiled in Chapter 6. The programs compiled here
    are temporary tools and will not be part of the final LFS system. By keeping these
    programs in a separate directory, they can easily be deleted after their use.
    This prevents programs from ending up in the host production directories (easy
    to do by accident in Chapter 5).


    Create the required directory by running the following as root:


    ```

    mkdir -v $LFS/tools

    ```


    The next step is to create a /tools symlink on the host system. This will point
    to the newly-created directory on the LFS partition. Prun this command as root
    as well:


    ```

    ln -sv $LFS/tools /

    ```


    > Note

    The above command is correct. The ln command has some few syntactic variations,
    so be sure to check info coreutils ln and ln (-l) before reporting what you may
    think is an error.


    The symlink enables the toolchain to be compiled so that it always refers to /tools,
    meaning the compiler, assembler, and linker will work well in Chapter 5 (when
    we are still using some tools from the host) and in the next (when we are "chrooted"
    to the LFS partition).


    # ## 4.3. Adding the LFS User


    When logged in as user root, making a single mistake can damage or destroy a system.
    Therefore, we recommend building the packages in this chapter as an unprivileged
    user. You could use your own user name, but to make it easier to set up a clean
    working environment, create a new user lfs as member of a new group (also named
    lfs) and use this user during the installation process. As root, issue the following
    commands to add the new user:


    ```

    groupadd lfs

    useradd -s /bin/bash -g lfs -m -k /dev/null lfs

    ```


    The meaning of the command line options:


    +   -s /bin/bash

    This makes bash the default shell for user lfs.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Linux From Scratch - Version 8.0


    -g lfs

    This option adds user lfs to group lfs.


    -m

    This creates a home directory for lfs.


    -k /dev/null

    This parameter prevents possible copying of files from a skeleton directory (default
    is /etc/skel) by changing the input location to the special device.


    lfs

    This is the actual name for the created group and user.


    To log in as lfs (as opposed to switching to user lfs when logged in as root,
    which does not require the lfs user to have a password), give lfs a password:


    ```

    passwd lfs

    ```


    Grant lfs full access to $LFS/tools by making lfs the directory owner:


    ```

    chown -v lfs $LFS/tools

    ```


    If a separate working directory was created as suggested, give user lfs ownership
    of this directory:


    ```

    chown -v lfs $LFS/sources

    ```


    Next, log in as lfs. This can be done via a virtual console, through a display
    manager, or with the following substitute user command:


    ```

    su - lfs

    ```


    The "-" instructs to start a login shell as opposed to a non-login shell. The
    difference between these two types of shells can be found in detail bash(1) and
    info bash.


    # 4.4. Setting Up the Environment


    Set up a working environment by creating two startup files for the bash shell.
    While logged in as user lfs, issue the following to create a new .bash_profile:


    ```

    cat ~/.bash_profile << "EOF"

    exec env -i HOME=$HOME TERM=$TERM PS1=u:\w$ /bin/bash

    EOF

    ```


    When logged in as user lfs, the initial is usually a login shell which reads the
    /etc/profile of the host (probably containing some settings and environment variables)
    and .bash_profile. The exec env --bin/bash command in the .bash_profile replaces
    the running shell with a new one with a completely empty environment, except for
    the HOME, TERM, and PS1 variables. This ensures that unwanted and potentially
    hazardous environment variables from the build environment. The technique used
    here achieves the goal of ensuring a clean environment.'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'The new instance of the shell is a non-login shell, which does not read the
    /etc/profile or .bash_profile files, but rather reads the .bashrc file instead.
    Create the .bashrc file now:


    ```

    cat << ~/.bashrc

    umask 022

    LFS=/mnt/lfs

    LC_ALL=$(uname -m)-lfs-linux-gnu

    PATH=$LFS_TGT/tools/bin:/usr/bin

    export LFS LC_ALL LFS_TGT PATH

    EOF

    ```


    The set +h command turns bash''s hash function. Hashing is ordinarily a useful
    feature—bash uses a hash table to remember the full path of executable files to
    avoid searching the PATH time and again to find the same executable. However,
    the new tools should be used as soon as they are installed. By switching off the
    hash function, the shell will always search the PATH when a program is to run.
    As such, the shell will find the newly compiled tools in LFS as soon as they are
    available without removing a previous version of the program in a different location.


    Setting the file-creation mask (umask) 022 ensures that newly created files and
    directories are only writable by their owner, but are readable and executable
    by anyone (assuming default modes are used by the open (2) system call, new files
    will end up with permission 644 and directories mode 755).


    The LC_ALL variable sets the localization of certain programs, making their messages
    follow the conventions of a specified country. Setting LC_ALL to "POSIX" or "C"
    (the two are equivalent) ensures that everything will work as expected in the
    short environment.


    By putting /tools/bin ahead of the standard PATH, all the programs installed in
    Chapter 5 are picked up by the shell immediately after their installation, combined
    with turning off hash, limits the risk that old programs are used when the new
    ones are available in the chapter 5 environment.


    Finally, to have the environment prepared for building the temporary tools, source
    the just-created user profile:


    ```

    source ~/.bash_profile

    ```


    # 4.5. About SBUs


    Many people would like to know beforehand approximately how long it takes to compile
    and install each package. Because Linux From Scratch can be built on many different
    systems, it is impossible to provide accurate time estimates. The biggest package
    (gcc) will take approximately 20 minutes on the fastest systems, but could take
    up to three days on slower systems! Instead of providing actual times, the Standard
    Build Unit (SBU) measure will be used instead.


    The SBU works as follows. The first package be compiled from this book is Binutils
    in Chapter 5. The time it takes to compile this package is what will be referred
    to as the Standard Build Unit or SBU. All other times will be expressed relative
    to this time.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'Linux From Scratch - Version 8.0


    consider a package whose compilation time is 4.5 SBUs. This means that if a system
    takes 10 minutes to compile and install the first pass of Binutils, it will take
    approximately 45 minutes to build this example package. Fortunately, most times
    are shorter than the one for Binutils.


    In general, SBUs are not entirely accurate because they depend on many factors,
    including the host system''s version of GCC. They are provided here to give an
    estimate of how long it might take to install a package, but the numbers can vary
    by as much as dozens of minutes in some cases.


    ![](img/a3d49d284a2c7779eb95d9a015d1bb7a_49_0.png)


    # Note


    For many modern systems with multiple processors (or cores) the compilation time
    for a package can be reduced by performing a "parallel make" by either setting
    an environment variable or telling the make how many programs are available. For
    instance, a Core2Duo can support two simultaneous processes with:


    ```

    export MAKEFLAGS=''j 2''

    ```


    or just building with:


    ```

    make -j2

    ```


    When multiple processors are used in this way, the SBU units in the book will
    vary even more than they normally would. In some cases, the make will simply fast.
    Analyzing the output of the build process will also be more difficult because
    the lines of different processes will be interleaved. If you run into a problem
    with a build step, revert back to a single processor builder to properly analyze
    the error messages.


    # 4.6. About the Test Suites


    Most packages provide a test suite. Running the test suite for a newly built package
    is a good idea because it can provide a "sanity check" indicating everything compiled
    correctly. A test suite that passes its sets of checks usually proves that the
    package is functioning as developer intends. It does not, guarantee that the package
    is totally bug free.


    Some test are more important than others. For example, the test suites for the
    core toolchain packages—GCC, Binutils, and Glibc—are the most important due to
    their central role in a functioning system. The test suites for GCC and Glibc
    can take a very long time to complete, especially on slower hardware, but are
    strongly recommended.


    ![](img/a3d49d284a2c7779eb95d9a015d1bb7a_49_1.png)


    # Note


    Experience has shown that there is little to be gained from the test suites in
    Chapter 5. There is no escaping the fact that the host system always exerts some
    influence on the tests in that chapter, often causing inexplicable failures. Because
    the tools built in Chapter 5 are temporary and eventually discarded, we do not
    recommend running the test suites in Chapter 5 for the average reader. The instructions
    for running those test suites are provided for the benefit of testers and developers,
    but they are strictly optional.


    A common issue with running the test suites for Binutils and GCC is of pseudo
    threads (PTYs). This can result in a high number of failing tests. This may happen
    for several reasons, but the most likely is that the host system does not have
    the devpts file system set up correctly. This issue is discussed in greater detail
    at http://www.linuxscratch.org/lsfqaj.html#no-ptys.


    32'
