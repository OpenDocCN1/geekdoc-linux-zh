  md: '# Linux From Scratch - Version 8.0


    Generally a few tests do not pass, you can generally ignore any of the test failures
    below. Now test the build results:


    # make check


    You will probably see some issues for this version of LFS: The Glibc test suite
    is somewhat dependent on the host system. This is a list of the most common issues


    +   * posix/tst-getaddinfo4 will always fail due to not having the necessary networking
    applications when the tests are run. posix/tst-getaddinfo5 is also known to fail
    on some architectures.

    * rt/tst-cputimer1 and rt/tst-cpuclock2 tests have been known to fail. The reason
    is not completely understood, but indications are that minor issues can trigger
    these failures.

    * The math tests sometimes fail when running on systems where the CPU is not a
    relatively new Intel or AMD processor.

    * The nptl/tst-thread-affinity-[pthread.thread2,sched] tests may fail for reasons
    that have not been determined.

    * Other tests known to fail on some architectures are malloc/tst-malloc-usable
    and nptl/tst-cleanup4.


