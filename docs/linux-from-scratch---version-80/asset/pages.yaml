  md: '# ## 3.36. Stripping


    The steps in this section are optional, but if the LFS partition is rather small,
    it is beneficial to learn that unnecessary items can be removed. The executables
    and libraries built so far contain about 70 MB of unneeded debugging symbols.
    Remove them with:


    ```

    strip --strip-debug /tools/lib/*

    /usr/bin/strip --strip-unneeded /tools/{,bin}*

    ```


    These commands will skip a number of files, reporting that it does not recognize
    their file format. Most of these scripts intend instead. Use the system command
    to include the strip binary in /tools.


    Take care not to use --strip-unneeded on the libraries. The static ones will be
    destroyed and the toolchain packages will be built all again.


    To save your work, remove the documentation:


    ```

    rm -rf /tools/{,info,man,doc}

    ```


    At this point, you should have at least 3 GB of free space in $LFS that can be
    used to build and install Glibc and Gcc in the next phase. If you can build and
    install Glibc, you can install the rest too.


    # ## 3.37. Changing Ownership


    > > Note The commands in the remainder of this book must be performed while logged
    in as user root and no longer as lfs user. Also, double check that $LFS is in
    root''s environment.


    Current, the $LFS/tools directory is owned by the user lfs, a user that exists
    only on the host system. If the $LFS/tools directory is kept as is, the files
    are owned by a user ID without a corresponding account. This is dangerous because
    a user account created could get this user ID and own the $LFS/tools directory
    and all the files therein, thus exposing these files to malicious manipulation.


    To avoid this, you could add the lfs user to the new LFS system later when creating
    the /etc/passwd file, taking care to assign it the same user and group IDs on
    the host system. But yet, change the ownership of the $LFS/tools directory to
    user root by running the following command:


    ```

    chown -R root:root $LFS/tools

    ```


    Although the $LFS/tools directory can be deleted once the LFS system has been
    finished, it can be retained to build additional LFS systems of the same book
    version. How best to backup $LFS/tools is a matter of personal preference.


    > > Caution If you intend to keep the temporary tools for use in building future
    LFS systems, now is the time to back them up. Subsequent commands in chapter 6
    will alter the tools currently in place, rendering them useless for future builds.'
