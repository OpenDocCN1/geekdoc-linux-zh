- img_proc: false
  md: "```\nuntil CONDITION\ndo\n  ACTION\ndone\n```\n\nYou can write it in one line\
    \ the same way as `while`:\n\n```\nuntil CONDITION; do ACTION; done\n```\n\nLet's\
    \ replace the `while` statement with `until` in Listing 3-18. You should remove\
