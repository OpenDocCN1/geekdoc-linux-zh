    tells you.


    If you want to install Windows on your computer, you should buy it from Microsoft.
    However, manufacturers of computers pre-install Windows on their devices often.
    In this case, the final cost of the computer includes the price of the OS.


    The target devices for Windows are relatively cheap PCs and laptops. Many people
    can buy such a device. Therefore, there is a huge market of potential users. Microsoft
    tends to keep its competitive edge in this market. The best way to reach it is
    to prevent appearing of Windows analogs with the same features from other companies.
    For reaching this goal, Microsoft takes care of protecting its intellectual property.
    The company does it in both technical and legal ways. An example of legal protection
    is the user agreement. It prohibits you to explore the internals of the OS.


    The Windows OS family has a long history. Also, it is popular and widespread.
    It leads many developers to chose this OS as the target for their applications.
    However, the Microsoft company has developed the first Windows applications on
    its own. An example is the package of office programs [Microsoft Office](#footnote-82).
    Such applications became a standard to follow for other developers.


    Microsoft followed the same principle when developing both Windows and applications
    for it. It is a secrecy principle:


    +   - Source codes are not available to users.

    - Data formats are undocumented.'
