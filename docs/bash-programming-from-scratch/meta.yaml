  md: '# Bash Shell


    Programming is an applied skill. If you want to learn it, you should choose a
    programming language and solve tasks. This is the only way to get practical skills.


    We use the Bash language in this book. This language is convenient for automating
    computer administration tasks. Here are few examples of what you can do with Bash:


    +   - Create data backups.

    - Manipulate [directories](https://en.wikipedia.org/wiki/Directory_(computing))
    and files.

    - Run programs and transfer data between them.


    Bash was developed in the Unix environment. Therefore, it bears the imprint of
    the [Unix philosophy](https://en.wikipedia.org/wiki/Unix_philosophy). Despite
    its roots, you can also use Bash on Windows and macOS.


    # Development Tools


    You need a Bash interpreter and a terminal emulator to run the examples of this
    chapter. You can install them on all modern operating systems. Let''s take a look
    at how to do this.


    # Bash Interpreter


    Bash is a [script programming language](https://en.wikipedia.org/wiki/Scripting_language).
    It has the following features:


    +   1. It is interpreted language.

    2. It operates existing programs or high-level commands.

    3. You can use it as a shell to access the OS functions.


    If you use Linux or macOS, you have the preinstalled Bash interpreter. If your
    OS is Windows, you need both Bash interpreter and POSIX-compatible environment.
    Bash needs this environment to work correctly. There are two ways to install it.'
  merge: -1
