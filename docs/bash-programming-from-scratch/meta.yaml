  md: "combine the `LANGUAGE` variable's value and the error code. We get the `print_error`\
    \ function like Listing 5-9 shows.\n\n# Listing 5-9. The script for printing error\
    \ messages\n\n```\n#!/bin/bash\n\nprint_error()\n{\n  declare -A messages\n\n\
    \  messages[\"de_DE\",1]=\"Der Datei wurde nicht gefunden:\"\n  messages[\"de_DE\"\
    ,2]=\"Berechtigung zum Lesen der Datei verweigert:\"\n\n  messages[\"en_US\",1]=\"\
    File not found:\"\n  messages[\"en_US\",2]=\"Permission to read the file denied:\"\
    \n\n  echo \"${messages[$LANGUAGE,$1]} $2\" >> debug.log\n}\n\nprint_error 1 \"\
    readme.txt\"\n```\n\n# Exercise 3-14. Variable scope\n\nThe script in Listing\
    \ 3-37 prints the following text:\n\n```\nmain1: var =\nfoo1: var = foo_value\n\
    bar1: var = foo_value\nbar2: var = bar_value\nfoo2: var = bar_value\nmain2: var\
    \ =\n```\n\nLet's start with the output of \"main1\" and \"main2\" strings. The\
    \ `var` variable is declared as local in the `foo` function. Thus, it is only\
    \ available in the `foo` and `bar` functions. Hence, Bash supposes that `var`\
    \ is undeclared before and after calling the `foo` function.\n\nWhen we print\
    \ the `var` value from the beginning of the `foo` function, we get it equal to\
    \ \"foo_value\". Next is the output of \"bar1\". The variable `var` is declared\
    \ in the `foo` function. This function calls `bar`. Therefore, the body of the\
    \ `bar` function is also the scope of `var`.\n\nThen we assign the new value \"\
    bar_value\" to `var`. Note that we are not declaring a new global variable called\
    \ `var`. We overwrite an existing local variable. We get its value \"bar_value\"\
    \ in both outputs \"bar2\" and \"foo2\"."
