    programs. For example, the computer runs a program until it needs some resource.
    If the resource is busy, the program stops. The computer switches to another program.
    It returns to running the first program when the resource it needs becomes free.


    **Multitasking**[^447] is the parallel execution of several tasks (processes)
    in a certain period of time. The computer does it by switching[^448] between tasks
    and executing them in parts.


    # ## N


    **Network protocol**[^449] is an agreement on the format of messages between nodes
    of a computer network.


