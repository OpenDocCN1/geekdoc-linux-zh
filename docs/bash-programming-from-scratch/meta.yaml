  md: "# Ternary Operator\n\nThe ternary operator is also known as the conditional\
    \ operator and **ternary if**. It first appeared in the programming language [ALGOL](https://en.wikipedia.org/wiki/ALGOL).\
    \ The operator turned out to be convenient and in demand by programmers. Therefore,\
    \ the languages of the next generation ([BCPL](https://en.wikipedia.org/wiki/BCPL)\
    \ and C) inherited ternary if. Then it comes to almost all modern languages: C++,\
    \ C#, Java, Python, PHP, etc.\n\nA ternary operator is a compact form of the `if`\
    \ statement.\n\nHere is an example. Suppose that there is the following `if` statement\
    \ in the script:\n\n```\nif ((var < 10))\nthen\n  ((result = 0))\nelse\n  ((result\
    \ = var))\nfi\n```\n\nHere the `result` variable gets the zero value if `var`\
    \ is less than 10. Otherwise, `result` gets the value of `var`.\n\nThe ternary\
    \ operator can provide the same behavior as our `if` statement. The operator looks\
    \ like this:\n\n```\n((result = var < 10 ? 0 : var))\n```\n\nHere we replaced\
    \ six lines of the `if` statement with one line.\n\nA ternary operator consists\
    \ of a conditional expression and two actions. It looks like this in the general\
    \ form:\n\n```\n(( CONDITION ? ACTION_1 : ACTION_2 ))\n```\n\nIf the CONDITION\
    \ is true, Bash executes the ACTION_1. Otherwise, it executes the ACTION_2. This\
    \ behavior matches the `if` statement. Let's write it down in the general form\
    \ too:"
