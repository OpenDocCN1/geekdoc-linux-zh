  md: "# Variable Scope\n\nNaming conflicts is a serious problem. It occurs in Bash\
    \ when functions declare variables in the global scope. As a result, the names\
    \ of two variables can match. Then two functions will access them at different\
    \ moments. This leads to confusion and data loss.\n\nProcedural languages suggest\
    \ the solution for the naming conflicts problem. They provide features to restrict\
    \ the scope of declared variables. Bash has these features too.\n\nIf you declare\
    \ a variable with the `local` keyword in a function, its body limits the variable's\
    \ scope. In other words, the variable becomes available inside the function only.\n\
    \nHere is our latest version of the `code_to_error` function:\n\n```\ncode_to_error()\n\
    {\n  local _result_variable=$2\n\n  case $1 in\n    1)\n      eval $_result_variable=\"\
    File not found:\"\n      ;;\n    2)\n      eval $_result_variable=\"Permission\
    \ to read the file denied:\"\n      ;;\n  esac\n}\n```\n\nWe have declared the\
    \ `_result_variable` variable using the `local` keyword. Therefore, it becomes\
    \ a local variable. You can read and write its value in `code_to_error` and any\
    \ other functions that it calls.\n\nBash limits a local variable's scope by the\
    \ execution time of the function where it is declared. Such a scope is called\
    \ **dynamic**[^361]. Modern languages prefer to use **lexical** scope. There the\
    \ variable is available in the function's body only. If you have nested calls,\
    \ the variable is not available in the called functions.\n\nLocal variables do\
    \ not come into the global scope. This ensures that no function will overwrite\
    \ them by accident.\n\n**Exercise 3-14. Variable scope**\n\nWhat text will the\
    \ script in Listing 3-37 print to the console when it executes?"
