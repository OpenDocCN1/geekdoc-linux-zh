  md: '+   - Operations on files and directories.

    - Creating data backups.

    - Downloading files from the Internet.

    - Collecting statistics about your computer''s resource usage.


    An example will explain the effectiveness of CLI. Suppose you rename several files
    on the disk. You add the same suffix to their names. If you have a dozen of files,
    you can do this task with [Windows Explorer](https://en.wikipedia.org/wiki/File_Explorer)
    in a couple of minutes. Now imagine that you should rename thousands of files
    this way. You will spend the whole day doing that with the Explorer. If you use
    the shell, you need to launch a single command and wait for several seconds. It
    will rename all your files automatically.


    The example with renaming files shows the strength of the CLI that is scalability.
    Scalability means that the same solution handles well both small and large amounts
    of input data. The solution implies a command when we are talking about the shell.
    The command renames ten and a thousand files with the same speed.


    Experience with the command interface is a great benefit for any programmer. When
    you develop a complex project, you manage plenty of text files with the source
    code. You use the GUI editor to change the single file. It works well until you
    do not need to introduce the same change in many files. For example, it can be
    the new version of the license information in the file headers. You waste your
    time when solving such a task with the editor. Command-line utilities make this
    change much faster.


    You need to understand the CLI to deal with compilers and interpreters. These
    programs usually do not have a graphical interface. You should run them via the
    command line and pass the names of the source code files. The reason for such
    workflow is the poor scalability of the GUI. If you have plenty of source code
    files, you cannot handle them effectively via the GUI.


    There are special programs to edit and compile source code. Such programs are
    called [integrated development environments](https://en.wikipedia.org/wiki/Integrated_development_environment)
    (IDE). You can compile a big project using IDE and its GUI. However, IDE calls
    the compiler via the command line internally. Therefore, you should deal with
    the compiler''s CLI if you want to change its options or working mode.


    If you are an experienced programmer, knowing the CLI encourages you to develop
    helper utilities. It happens because writing a program with a command interface
    is much faster than with a GUI. The speed of development is essential when solving
    one-off tasks.


    Here is an example situation when you would need to write a helper utility. Suppose
    that you have to make a massive change in the source code of your project. You
    can do it with IDE by repeating the same action many times. Another option is
    to spend time writing a utility that will do this job. You should compare the
    required time for both ways of solving your task. If you are going to write a
    GUI helper utility, it takes more time than for a CLI utility. This can lead you
    to the wrong decision to solve the task manually using the IDE. Automating your
    job is the best option in most cases. It saves your time and helps to avoid mistakes.'
