    # Bit Shifts


    A bit shift is a changing of the bit positions in a number.


    There are three types of bit shifts:


    +   1. Logical

    2. Arithmetic

    3. Circular


    The simplest shift is the logical one. Let''s take a look at it first.


    Any bit shift operation takes two operands. The first one is the integer. The
    operation shifts its bits. The second operand is the number of bits to shift.


    You should represent the integer in the two''s complement for doing the logical
    bit shift. Suppose that you do a shift in the right direction by two bits. Then
    you discard the two rightmost bits of the integer. Instead of them, add two zeros
    on the left side.


    You can do the shift to the left in the same way. Discard two leftmost bits of
    the integer. Then add two zeroes on the right side.


    Here is an example. Perform a logical shift of unsigned single-byte integer 58
    to the right by three bits. First, represent the number in the two''s complement:


    ```

    58 = 0011 1010

    ```


    Then discard the three bits on the right side like this:'
  merge: -1
  pgno: 221
- img_proc: false
  md: '```

    0011 1010 << 3 = 1 1010 = 1101 0000 = 208

    ```


    Here we follow the same algorithm as for the right shift. First, discard the outermost
    bits on the left side. Then add zeros to the right side.


    Now let''s consider the second type of shift that is the arithmetic shift. If
    you do it to the left, you follow the logical shift algorithm. The steps are entirely
    the same.


    The arithmetic shift to the right differs from the logical shift to the right.
    When performing it, you should discard the bits on the right side. Then complete
    the result with the bits on the left side. Their value should match the highest
    bit of the integer. If it equals one, add ones to the right. Otherwise, add zeros.
    This way, we keep the sign of the integer unchanged after the shifting.


    For example, let''s do an arithmetic shift of the signed one-byte integer -105
    to the right by two bits.


    First, we represent the number in the two''s complement like this:


    ```

    -105 = 1001 0111

    ```


    Now do the arithmetic shift to the right by two bits. We get:


    ```

    1001 0111 >> 2 -> 1001 01 -> 1110 0101

    ```


    The highest bit of the integer equals one in our case. Thus, we complement the
    result with two ones on the left side.


    This way, we got a negative number in the two''s complement. Let''s convert it
    to SMR and get the decimal like this:


    ```

    1110 0101 = 1001 1011 = -27

    ```


    The result of the shift is the number -27.


    Bash has operators `<<` and `>>`. They do arithmetic shifts. The following commands
    repeat our calculations:


    ```

    $ echo $((58 >> 3))

    7


    $ echo $((58 << 3))

    464


    $ echo $((-105 >> 2))

    -27

    ```'
