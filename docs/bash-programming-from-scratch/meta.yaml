    # **Exercise 3-12. Loop Constructs**


    The player has seven tries to guess a number. The same algorithm handles each
    try. Therefore, we can apply a loop with seven iterations.


    Here is the algorithm for processing a player''s action:


    +   1. Read the input with the read command.

    2. Compare the entered number with the number chosen by the script.

    3. If the player makes a mistake, print a hint and go to step 1.

    4. If the player guessed the number, finish the script.


    The script can pick a random number using the RANDOM Bash variable. The variable
    returns the new random value from 0 to 32767 each time you read it. We need a
    number between 1 and 100. The following algorithm gets it:


    1. Get a random number in the 0 to 99 range. To do this, divide the value from
    the RANDOM variable by 100 using the following formula:


    ⁴⁸⁸https://onlinetoolz.net/bitshift'
