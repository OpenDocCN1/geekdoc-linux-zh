  md: "If the google.com server is available, the utility returns the zero exit status.\
    \ Otherwise, it returns non-zero.\n\nThe ping utility waits for the server's response\
    \ until you do not interrupt it. The -w option limits the waiting time to one\
    \ second. Using the option, we get the following command:\n\n```\nping -c 1 -W\
    \ 1 google.com\n```\n\nNow we have the condition for the while statement. Let's\
    \ write the whole statement like this:\n\n```\nwhile ! ping -c 1 -W 1 google.com\
    \ &> /dev/null\ndo\n  sleep 1\ndone\n```\n\nThe output of the ping utility is\
    \ not interested in our case. Therefore, we redirect it to the /dev/null file.\n\
    \nWe invert the ping result in the while condition. Therefore, Bash executes the\
    \ loop's body as long as the utility returns a non-zero exit status. It means\
    \ that the loop continues as long as the server is unavailable.\n\nWe call the\
    \ sleep utility in the loop's body. It stops the script for the specified number\
    \ of seconds. The stop lasts for one second in our case.\n\n> You can specify\
    \ a suffix for the parameter when using the sleep utility. It defines units of\
    \ time. The suffix \"s\" matches seconds. It is \"m\" for minutes, \"h\" for hours\
    \ and \"d\" for days.\n\nListing 3-18 shows a complete script for checking server\
    \ availability.\n\n**Listing 3-18.** Script for checking server availability\n\
    \n```\n#!/bin/bash\n\nwhile ! ping -c 1 -W 1 google.com &> /dev/null\ndo\n  sleep\
    \ 1\ndone\n\necho \"The google.com server is available\"\n```\n\nThe while statement\
    \ has an alternative form called until. Here the ACTION is executed as long as\
    \ the CONDITION is \"false\". It means that the loop continues as long as the\
    \ CONDITION returns a non-zero exit status. Use the until statement when you want\
    \ to invert the condition of the while loop."
  merge: -1
