  md: 'You can imagine the variable as a value that has a name. For example, you can
    say: "The time now is 12 hours". "Time now" is the variable name. Its value equals
    "12 hours". The computer stores it in memory at some address. You do not know
    the address. However, you can ask a computer the value of the "time now" variable.
    It returns you "12 hours". This is how the variables work.


    The echo command prints strings. It can also show you the value of a variable.
    For example, the following echo call prints the PATH variable:


    ```

    echo "$PATH"

    ```


    Why do we need the dollar sign $ before the variable name? The echo command receives
    the string on input and outputs it. For example, this echo call prints the text
    "123":


    ```

    echo 123

    ```


    The dollar sign before a word tells Bash that it is a variable name. The interpreter
    handles it differently than a regular word. When Bash encounters a variable name
    in a command, it checks its variable list. If the name presents there, Bash inserts
    the variable value into the command. Otherwise, the interpreter places an empty
    string here.


    > Enclosing variable names in double-quotes is a [good practice](#). This way,
    you avoid potential errors. There is an example. Bash replaces the variable name
    by its value. The value contains **control characters**. The interpreter handles
    these characters. As a result, the inserted variable''s value differs from one
    that is stored in memory. This effect leads to incorrect behavior of the program.
    Double-quotes prevent Bash from processing strings.


