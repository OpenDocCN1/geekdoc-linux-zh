    $@ array stores all received parameters.


    Let''s correct the declaration of the cat function. We will pass all parameters
    of the function to the cat utility input. Then the declaration becomes like this:


    ```

    cat() { cat -n $@; }

    ```


    This function would not work either. The problem happens because of unintentional
    **recursion**. When the function calls itself, it is called recursion.


    Bash checks the list of declared functions before executing the command "cat -n
    $@". There is the cat function in the list. Bash executes its body at the moment,
    but it does not change anything. Thus, the shell calls the cat function again
    instead of calling the cat utility. The call repeats over and over again. It leads
    to the infinite recursion, which is similar to an infinite loop.


    Recursion is not a mistake of Bash''s behavior. It is a powerful mechanism that
    simplifies complex algorithms. The example of such algorithms is the traversing
    a **graph**[^356] or **tree**[^357].


    The mistake occurred in our declaration of the cat function. The recursive call
    happened by accident and led to a loop. There are two ways to solve this problem:


    +   1. Use the `command` built-in.

    2. Rename the function so that its name differs from the utility name.


    Let''s look at the first solution. The `command` built-in receives a command as
    parameters. If there are aliases and function names there, Bash ignores them.
    It does not insert the alias value instead of its name. It does not call a function.
    Instead, Bash executes the command as it is.


    If we apply the `command` built-in in the cat function, we get the following result:'
  merge: -1
  pgno: 262
- img_proc: false
  md: '```

    cat() { command cat -n "$@"; }

    ```


    Now Bash calls the `cat` utility instead of the `cat` function.


    The second solution is renaming the function. For example, this version works
    well:


    ```

    cat_func() { cat -n "$@"; }

    ```


    Always be aware of the problem of unintentional recursion. Keep the names of the
    functions unique. They should not match the names of built-in Bash commands and
    GNU utilities.


    Here is a summary of our comparison of functions and aliases. If you want to shorten
    a long command, use an alias.


    You need a function in the following cases only:


    +   1. You need a conditional statement, loop, or code block to perform a command.

    2. The parameters are not at the end of the command.


    The second case needs an example. Let''s shorten the `find` utility call. It should
    search for files in the specified directory. When you search in the home directory,
    the call looks like this:


    ```

    find ~ -type f

    ```


    We cannot write an alias that takes the target path as a parameter. The following
    solution does not work:


    ```

    alias="find -type f"

    ```


    The target path should come before the `-type` option. This is a problem for the
    alias.


    However, we can use the function in this case. We can choose the position to insert
    the parameter in the `find` call. The function declaration looks like this:


    ```

    find_func() { find $1 -type f; }

    ```


    Now we can call it for searching files in the home directory this way:


    ```

    find_func ~

    ```


    # Using Functions in Scripts


    The declaration of functions in scripts is the same as in a shell. There are two
    options: the standard and one-line declarations.


