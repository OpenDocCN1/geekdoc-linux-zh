  md: "# continue\n\nThe continue command skips the current loop iteration. The loop\
    \ does not stop in this case. It starts the next iteration instead.\n\nHere is\
    \ an example. Suppose we want to calculate the sum of positive integers in an\
    \ array. Thus, we should distinguish the signs of the integers. The if statement\
    \ fits well for this task. If the integer's sign is positive, we add the integer\
    \ to the result. Listing 3-35 shows the final script.\n\n> Listing 3-35. The script\
    \ for calculating the sum of positive integers in an array\n\n```\n#!/bin/bash\n\
    \narray=(1 25 -5 4 -9 3)\nsum=0\n\nfor element in \"${array[@]}\"\ndo\n  if ((\
    \ 0 < element ))\n  then\n    ((sum += element))\n  fi\ndone\n\necho \"The sum\
    \ of the positive numbers is $sum\"\n```\n\nIf the element variable is greater\
    \ than zero, we add it to the result sum.\n\nLet's use the continue command to\
    \ get the same behavior. Listing 3-36 shows the result.\n\n> Listing 3-36. The\
    \ script for calculating the sum of positive integers in an array\n\n```\n#!/bin/bash\n\
    \narray=(1 25 -5 4 -9 3)\nsum=0\n\nfor element in \"${array[@]}\"\ndo\n  if ((\
    \ element < 0))\n  then\n    continue\n  fi\n\n  ((sum += element))\ndone\n```"
