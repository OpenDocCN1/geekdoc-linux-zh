    Table 1-3 raises questions. You can read the data from the disk drive at high
    speed. Why is there no way to read these data to the CPU registers directly? The
    high access speed is not so crucial for performance in practice. The critical
    parameter here is the access time. It measures the idle time of the CPU until
    it receives the required data. You can measure this idle time in clock signals
    or cycles. Such a signal synchronizes all operations of the processor. The CPU
    requires roughly from 1 to 10 clock cycles to execute one instruction of the program.


    High access time can cause serious performance issues. For example, suppose that
    the CPU reads the program instructions directly from the hard disk. The problem
    happens because CPU registers have a small capacity. There is no chance to load
