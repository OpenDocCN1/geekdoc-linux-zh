    **Figure 2-21**. The output of the `help` command


    You see a list of all commands that Bash executes on its own. If some command
    is missing in this list, Bash calls a GNU utility or another program to execute
    it.


    Here is an example. The `cd` command presents in the `help` list. It means that
    Bash executes it without calling another program. Now suppose you type the `find`
    command. It is missing in the `help` list. Therefore, Bash looks for an executable
    file with the `find` name on the disk drive. If it succeeds, Bash launches this
    file.


    Where does Bash look for files that execute your commands? Bash has a list of
    paths where it searches utilities and programs. The **environment variable** called
    `PATH` stores this list. The [variable](#footnote-208) is a named area of memory.
    If you write a program in machine code and want to access the memory area, you
    should specify its address. A variable is a mechanism of a programming language.
    It allows you to use the variable name instead of the memory address. Therefore,
    you do not need to remember addresses, which are long numbers.


    Bash stores about a hundred environment variables. They hold data that affect
    the interpreter''s behavior. Most of these data are system settings. We will consider
    Bash variables in the next chapter.


    > **i** Call the `env` utility without parameters. It shows you all the environment
    variables that Bash uses at the moment.'
