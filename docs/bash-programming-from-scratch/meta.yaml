  md: '```

    cp -R ~/docs ~/docs-backup ; cp -R ~/photo ~/photo-backup

    ```


    The command calls the cp utility twice. The second call does not depend on the
    result of copying the docs directory. Even if it fails, Bash copies the photo
    directory.


    Can we do the same with the pipeline? Yes. Bash executes both cp calls in this
    case too. It means that we get the same linear sequence algorithm in both cases.
    Here is the command with the pipeline:


    ```

    cp -R ~/docs ~/docs-backup | cp -R ~/photo ~/photo-backup

    ```


    However, semicolon and pipeline behave differently in general. When you use a
    semicolon, two commands do not depend on each other completely. When you use a
    pipeline, there is dependency. The output stream of the first command is connected
    to the input stream of the second command. In some cases, it changes the behavior
    of the entire algorithm.


    Compare the following two commands:


    ```

    ls /usr/share/doc/bash | grep "README" * -

    ls /usr/share/doc/bash ; grep "README" * -

    ```


    The - option of grep appends data from the input stream to the utility parameters.


    Figure 2-28 shows the results of both commands.


    ![](bbox=[0.063, 0.546, 0.952, 0.826])


    **Figure 2-28. Results of commands with pipeline and semicolon**


    Even the behavior of the ls utility differs in these two commands. With the pipeline,
    ls prints on the screen nothing. Instead, it redirects the output to the grep
    utility input.


    Let''s consider the output of the commands. The second parameter of grep is the
    "*" pattern. Because of it, the utility processes all files in the current directory.
    It founds the "README" word in the xz.txt file. Then it prints this line on the
    screen:'
  merge: -1
