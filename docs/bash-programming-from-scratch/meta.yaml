    The multitasking concept solves the task of processing events in interactive systems.
    There were several versions of multitasking before it comes to the current state.
    Modern OSes use [displacing multitasking](^44) with pseudo-parallel tasks processing.
    The idea behind it is to allow the OS to choose an appropriate task for executing
    at the moment. The OS takes into account the priorities of the running programs.
    Therefore, a higher priority program receives hardware resources more often than
    a lower priority one. OS kernel provides this task-switching mechanism. It is
    called [task scheduler](^45).


    Pseudo-parallel processing means that the computer executes one task only at any
    given time. However, the OS switches tasks so quickly that you can suppose the
    processing of several programs at once. This concept allows the OS to react immediately
    to any event. Even though every program and OS component hardware resources at
    strictly defined moments.


    There are computers with multiple processors or with [multi-core processors](^46).
    Only these computers can execute several programs at once. The number of the running
    programs equals the number of cores of all processors approximately. The preemptive
    multitasking mechanism with constant task switching works on such systems well.
    It is universal and balances the load regardless of the number of cores. This
    way, the computer responds to the user''s actions quickly. The number of processor
    cores does not matter.


