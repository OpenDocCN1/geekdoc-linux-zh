  md: '# General Information


    This chapter explains the basics of how a computer works. It starts with describing
    operating systems and their history. Then the chapter considers families of modern
    operating systems and their features. The last section explains a computer program
    and its execution.


    # Operating Systems


    # History of OS Origin


    Most of the computer users understand why [operating system](#) (OS) is needed.
    Before launching a new [application](#), they usually check its system requirements.
    These requirements specify the [hardware](#) and operating system that a user
    needs to launch the application.


    The system requirements bring us the idea that the OS is a software platform.
    The application requires this platform for correct working. But where did this
    requirement come from? Why can''t you just buy a computer and launch the application
    without any OS?


    Our questions seem meaningless at first blush. But let''s consider them from the
    following point of view. Modern operating systems are multipurpose, and they offer
    users many features. Each specific user would not use most of these features.
    However, you cannot disable them. The OS utilizes the computer''s resources intensively
    for maintaining its features. As a result, the user has much fewer computation
    resources for his applications. This overhead leads to the computer''s slow work,
    hanging of the programs, and even rebooting the whole system.


    Let''s turn to history to find out the origins of operating systems. The first
    commercial OS was called [GM-NAA I/O](#). It appeared for the computer [IBM 704](#)
    in 1956. All earlier computers have worked without any OS. Why didn''t they need
    it?


    The main reason for having an OS is high computational speed. For example, let''s
    consider the first [electromechanical computer](#). [Herman Hollerith](#) constructed
    it in 1890. This computer was called a tabulator. It does not require an OS and
    a [program](#) in the modern sense. The tabulator performs a limited set of arithmetic
    operations only. Its hardware design defines this set of operations.


    <sup>3</sup>[https://en.wikipedia.org/wiki/Operating_system](https://en.wikipedia.org/wiki/Operating_system)

    <sup>4</sup>[https://en.wikipedia.org/wiki/Application_software](https://en.wikipedia.org/wiki/Application_software)

    <sup>5</sup>[https://en.wikipedia.org/wiki/Computer_hardware](https://en.wikipedia.org/wiki/Computer_hardware)

    <sup>6</sup>[https://en.wikipedia.org/wiki/GM-NAA_I/O](https://en.wikipedia.org/wiki/GM-NAA_I/O)

    <sup>7</sup>[https://en.wikipedia.org/wiki/IBM_704](https://en.wikipedia.org/wiki/IBM_704)

    <sup>8</sup>[https://en.wikipedia.org/wiki/Tabulating_machine#1890_census](https://en.wikipedia.org/wiki/Tabulating_machine#1890_census)

    <sup>9</sup>[https://en.wikipedia.org/wiki/Herman_Hollerith](https://en.wikipedia.org/wiki/Herman_Hollerith)

    <sup>10</sup>[https://en.wikipedia.org/wiki/Computer_program](https://en.wikipedia.org/wiki/Computer_program)'
  merge: -1
  pgno: 6
- img_proc: false
  md: 'The tabulator loads input data for computation from [punched cards](https://en.wikipedia.org/wiki/Punched_card)^11.
    These cards look like sheets of thick paper with punched holes. A human operator
    prepares these sheets manually and stacks them in special receivers. The sheets
    are threaded on the needles in the receivers. Then a short circuit happens in
    each punched hole. Each short circuit increases the mechanical counter, which
    is a rotating cylinder. The tabulator displays calculation results on dials that
    resemble watches.


    Figure 1-1 shows the tabulator that Hermann Hollerith has constructed.


    ![](bbox=[0.297, 0.323, 0.716, 0.582])


    By modern standards, the tabulator works very slowly. There are several reasons
    for this. The first one is you need a lot of manual work. At the beginning, you
    should prepare input data. There was no way to punch the cards automatically.
    Then you manually load punched cards into the receivers. Both operations require
    significant efforts and time.


    The second reason for low computation speed is mechanical parts. The tabulator
    contains many of them: needles to read data, rotating cylinders as counters, dials
    to output the result. All these mechanics work slowly. It takes about one second
    to perform one elementary operation. No automation can accelerate these processes.


    If you look at how the tabulator works, you find no place for OS there. OS just
    does not have any tasks to do on such a kind of computer.


    Tabulators used rotating cylinders for performing calculations. The next generation
    of computers replaced the cylinders with [relays](https://en.wikipedia.org/wiki/Relay)^12.
    A relay is a mechanical element that changes its state due to an electric current.


    The German engineer [Konrad Zuse](https://en.wikipedia.org/wiki/Konrad_Zuse)^13
    designed one of [the first relay computers](https://en.wikipedia.org/wiki/Z2_(computer))^14
    called Z2 in 1939. Then he improved this computer in 1941 and called it Z3. These
    machines perform a single'
  merge: -1
  pgno: 7
- img_proc: false
  md: 'elementary operation in milliseconds. They are much faster than tabulators.
    This performance gain happens thanks to applying relays instead of rotating cylinders.


    The increased computation speed is the first feature of Zuse''s computers. The
    second feature is the concept of a computer program. The idea of the universal
    machine, which follows the [algorithm](https://en.wikipedia.org/wiki/Algorithm)
    you choose, was fundamentally new at that time.


    > An algorithm is a finite sequence of instructions to perform a particular calculation
    or task.


    Z3 computer uses two input devices in parallel for supporting programs. The first
    one is a receiver for punched cards that resembles the tabulator''s receiver.
    It reads the program to execute from the card. The second input device is the
    keyboard. It allows the user to type input data for the program.


    The computers with the feature of changing their algorithms became known as **programmable**
    or **general-purpose**.


    The invention of programmable computers was a milestone in the development of
    computer science. Until this moment, machines were able to perform highly specialized
    tasks only. The construction of these machines was too expensive and unprofitable.
    This was a reason why commercial investors did not join the projects to design
    new computers. Only governments invested money there. However, this situation
    has changed since programmable computers came.


    The next step in computer design is the construction of the [ENIAC](https://en.wikipedia.org/wiki/ENIAC)
    (see Figure 1-2) computer in 1946 by [John Eckert](https://en.wikipedia.org/wiki/J._Presper_Eckert)
    and [John Mauchly](https://en.wikipedia.org/wiki/John_Mauchly). ENIAC uses a new
    type of element for performing computations. **Vacuum tubes** replaced relays
    there. The tube is a purely electronic device. It does not have any mechanical
    component as the relay has. Therefore, when the electrical signal comes, the tube''s
    reaction time is much faster than the relay one. This change increased ENIAC performance
    by order of magnitude comparing to relay-based machines. The new computer performs
    single elementary operation in 200 microseconds instead of milliseconds.'
  merge: -1
  pgno: 8
- img_proc: false
  md: '![](bbox=[0.288, 0.089, 0.708, 0.398])


    Most computer engineers were skeptical about vacuum tubes in the 1940s. The tubes
    were known for their low reliability and high power consumption. Nobody believed
    that a tube-based machine could work at all. ENIAC contains around 18,000 vacuum
    tubes. They burn out often. However, the computer performed the calculations efficiently
    between the failures. ENIAC was the first successful case of applying vacuum tubes.
    This case convinced many engineers that such an approach works well.


    ENIAC is a programmable computer. You can set its algorithm using a combination
    of switches and jumpers on the control panels. This task requires considerable
    time and simultaneous work of several people. Figure 1-3 shows one of the panels
    for programming ENIAC.


    ![](bbox=[0.288, 0.622, 0.708, 0.868])


    ENIAC uses punched cards for reading input data and to output results. This is
    the same approach as previous models of computers have used. The new feature of
    ENIAC was storing intermediate results on the cards.'
  merge: -1
  pgno: 9
- img_proc: false
  md: 'When the ENIAC should calculate a complex task, it can come to a leak of computation
    resources. However, you can split the task into several subtasks. Then the computer
    can solve each subtask separately. Storing the intermediate results on the cards
    helps you to move data from one subtask to another while you reprogram the computer.


    Using ENIAC gave a new experience to engineers. It shows that all mechanical operations
    limit computer performance. These are the mechanical operations in ENIAC: manual
    reprogramming with switches and jumpers, reading and punching the cards. Each
    of these operations takes a significant time. Therefore, solving practical tasks
    with ENIAC is ineffective. The computer itself had an unprecedented performance
    at that time. However, it was idling most of the time and waiting for reprogramming
    or receiving input data. These findings initiated the development of new devices
    for both data input and output.


    The next step in computer design is replacing vacuum tubes with [transistors](https://en.wikipedia.org/wiki/Transistor)²¹.
    It again increased the computation speed by an order of magnitude. Transistors
    came together with new [input/output](https://en.wikipedia.org/wiki/Input/output)²²
    devices. It allowed to increase the loading of the computers and reprogram them
    more often.


    When the epoch of transistors started, computers spread beyond government and
    military projects. Banks and corporations began to exploit machines too. It increases
    the number and variety of programs running on computers significantly.


    Commercial usage of computers brings new requirements. When the computer works
    in a company, it should execute programs one after another without any delays.
    Otherwise, the machine does not justify the money spent on it.


    New solutions were needed to meet new requirements. The most time-consuming task
    was switching between programs. Therefore, engineers of General Motors and North
    American Aviation came to an idea to automate it. They created the first commercial
    operating system [GM-NAA I/O](https://en.wikipedia.org/wiki/GM-NAA_I/O)²³. The
    primary goal of the system was managing the execution of programs.


    The heavy load of computers and the variety of their programs brought another
    new task. When the computer of that time loads a program, the program defines
    the hardware''s available features. For example, if the program includes a code
    to control an output device, you can use it. Otherwise, this device is unavailable.


    Suppose that you are a company. You use a particular computer model all the time.
    The hardware always stays the same. Therefore, you do not change the code that
    controls your hardware. You just copy this code from one program to another. It
    takes extra efforts.


    Copying hardware-specific code brought engineers to an idea of a special service
    program. The service program loads together with the user''s application and provides
    the hardware support. These service programs became part of the first-generation
    operating systems after a while.


    Now it is time to come back to the question, why do you need an OS. We found out
    that applications could work without them in general. Such applications are still
    in use today. For example, they are'
  merge: -1
  pgno: 10
- img_proc: false
  md: '**utilities**<sup>24</sup> for memory checks and disk partitioning, antiviruses,
    recovery tools. However, developing such applications takes more time and efforts.
    They should include the code for supporting all required hardware.


    OS usually provides the code for supporting hardware. Why would you not use it?
    Most modern developers choose this way. It reduces the amount of work and speeds
    up the release of the applications.


    However, a modern OS is a vast complex system. It provides much more features
    than just hardware support. Let''s consider them too.


    # ## OS Features


    Why did we start studying programming by considering the OS? OS features are the
    basis for the application. Let''s consider how it works.


    Figure 1-4 demonstrates the interaction between the OS, an application and hardware.
    Applications are programs that solve practical user tasks. Examples are text editor,
    calculator, browser. Hardware is all electronic and mechanical components of a
    computer. For example, these are keyboard, monitor, central processor, video card.'
  merge: -1
  pgno: 11
- img_proc: false
  md: '![](bbox=[0.255, 0.085, 0.745, 0.555])


    **Figure 1-4.** The interaction between the OS, an application and hardware


    According to Figure 1-4, the application does not interact with hardware directly.
    The program does it through [system libraries](#)²⁵. The system libraries are
    part of the OS. There are rules to access the system libraries. Each application
    should follow them.


    **Application Programming Interface**²⁶ or API is the interface that the OS provides
    to an application to interact with system libraries. In general, the API term
    means a set of agreements for interacting components of the information system.
    These agreements become a well-known standard often. For example, the POSIX standard
    describes the API for portable OSes. The standard guarantees the compatibility
    of the OS and applications.


    OS **kernel**²⁷ and **device drivers**²⁸ are part of OS. They dictate which hardware
    features the application can access. When the application interacts with system
    libraries, the libraries request capabilities of kernel and drivers. If you need
    the hardware feature and OS does not support it, you cannot use it.


    When the application accesses the system library, it calls a library''s **function**²⁹.
    A function is a program fragment or an independent block of code that performs
    a certain task. You can imagine'
  merge: -1
  pgno: 12
- img_proc: false
  md: 'the API as a list of all available functions that the application can call.
    Besides that, API describes the following aspects of the interaction between the
    OS and applications:


    +   1. What action does the OS perform when the application calls the specific
    system function?

    2. What data does the function receive as input?

    3. What data does the function return as a result?


    Both the OS and application should follow the API agreements. It guarantees the
    compatibility of their current versions and future modifications. Such compatibility
    is impossible without a well-documented and standardized interface.


    We have discovered that some applications work without an OS. They are called
    [bare-metal software](https://www.quora.com/What-is-bare-metal-programming-in-Embedded-systems).
    This approach works well in some cases. However, the OS provides ready-made solutions
    for interaction with the computer''s hardware. Without these solutions, developers
    should take responsibility for managing hardware. It requires significant efforts.
    Imagine the variety of devices of a modern computer. The application should support
    all popular models of each device (for example, video cards). Without such support,
    the application would not work for all users.


    Let''s consider the features that the OS provides via the API. We can treat the
    computer''s hardware as resources. The application uses these resources for performing
    calculations. The API reflects the list of hardware features that the program
    can use. Also, the API dictates the order of interaction between several applications
    and the hardware.


    There is an example. Two programs cannot write data to the same area of the [hard
    disk](https://en.wikipedia.org/wiki/Hard_disk_drive#Magnetic_recording) simultaneously.
    There are two reasons for that:


    +   1. A single magnetic head records data on the hard disk. The head can do one
    task at a time.

    2. One program can overwrite data of another program in the same memory area.
    It leads to losing data.


    You should place all requests to write data on the disk in a queue because of
    these two problems. Then each request should be performed separately. The OS takes
    care of this task.


    The kernel (see Figure 1-4) of the OS provides a mechanism for managing access
    to the hard drive. This mechanism is called [file system](https://en.wikipedia.org/wiki/File_system).
    Similarly, the OS manages access to all [peripheral](https://en.wikipedia.org/wiki/Peripheral)
    and internal devices of the computer. Besides kernel, there are special programs
    called device drivers (see Figure 1-4). They help the OS to control devices.


    We have mentioned peripheral and internal devices. What is the difference between
    them? Peripherals are all devices that are responsible for inputting, outputting,
    and storing data permanently. Here are the examples:'
  merge: -1
  pgno: 13
- img_proc: false
  md: '+   - Keyboard

    - Mouse

    - Microphone

    - Monitor

    - Speakers

    - Hard drive


    Internal devices are responsible for processing data, i.e. for executing programs.
    These are internal devices:


    +   - **[Central Processing Unit](https://en.wikipedia.org/wiki/Central_processing_unit)**
    (CPU)

    - **[Random-Access Memory](https://en.wikipedia.org/wiki/Random-access_memory)**
    (RAM)

    - **[Video Card](https://en.wikipedia.org/wiki/Video_card)** (graphics processing
    unit or GPU).


    The OS provides access to the computer''s hardware. At the same time, the OS has
    something besides the hardware management to share with user''s applications.
    The system libraries have grown from the program modules to serve the devices.
    However, some libraries of modern OSes provide complex algorithms for processing
    data. Let''s consider an example.


    There is the Windows OS component called **[Graphics Device Interface](https://en.wikipedia.org/wiki/Graphics_Device_Interface)**
    (GDI). It provides algorithms for manipulating graphic objects. GDI allows you
    to create a user interface for your application with minimal efforts. Then you
    can use the monitor to display this interface.


    The system libraries with useful algorithms (like GDI) are software resources
    of the OS. These resources are already installed on your computer. You just need
    to know how to use them. Besides that, the OS also provides access to third-party
    libraries and their algorithms. You can install these libraries separately and
    use them in your applications.


    The OS manages hardware and software resources. Also, it organizes the joint work
    of running programs. The OS performs several non-trivial tasks to launch an application.
    Then the OS tracks its work. If the application violates some agreements (like
    memory usage), the OS terminates it. We will consider launching and executing
    the program in detail in the next section.


    If the OS is multi-user, it controls access to the data. It is an important security
    feature. Thanks to such control, each user can access his own files only. Therefore,
    they can work with the same computer safely.


    Here is the summary. The modern OS has all following features:


    +   1. It provides and manages access to hardware resources of the computer.

    2. It provides its own software resources.

    3. It launches applications.'
  merge: -1
  pgno: 14
- img_proc: false
  md: '+   4. It organizes the interaction of applications with each other.

    5. It controls access to users'' data.


    You can guess that it is impossible to launch several applications in parallel
    without the OS. You are right. When you develop an application, you have no idea
    how a user will launch it. The user can launch your application together with
    another one. You cannot foresee this use case. However, the OS responds for launching
    all applications. It means that the OS has enough information to allocate computer
    resources properly.


    # Modern OSes


    We have reviewed the OS features in general. Now we will consider modern operating
    systems. Today you can pick any OS and get very similar features. However, their
    developers follow different approaches. This leads to implementation difference
    that can be important for some users.


    There is the [software architecture](https://en.wikipedia.org/wiki/Software_architecture)
    term. It means the implementation aspects of the specific software and the solutions
    that led to them.


    All modern OSes have two features that determine the way how users interact with
    them. These features are multitasking and the graphical user interface. Let''s
    take a closer look at them.


    # Multitasking


    All modern OSes support [multitasking](https://en.wikipedia.org/wiki/Computer_multitasking).
    It means that they can execute multiple programs in parallel. The systems with
    this feature displaced OSes without it. Why does multitasking so important?


    The challenge of efficient usage of computers came in the 1960s. Computers were
    expensive at that time. Only large companies and universities were able to buy
    them. These organizations counted every minute of working with their machines.
    They did not accept any idle time of the hardware because of its huge cost.


    Early operating systems executed programs one after another without delays. This
    approach saves time for switching computer tasks. If you use such an OS, you should
    prepare several programs and their input data in advance. Then you should write
