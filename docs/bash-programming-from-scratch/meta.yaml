    # Extra Bash Features


    We have learned the built-in Bash commands and GNU utilities for operating on
    the file system. Now you can run a program and copy a file in the command-line.
    The graphical interface provides the same features. If you are solving such simple
    tasks, the interface does not matter.


    The Bash interpreter provides several features that the GUI does not have. Thanks
    to them, some tasks are faster to perform in the command-line interface. If you
    have such a task, knowing Bash saves you time thanks to automation.


    We will take a look at the following Bash features:


    +   1. I/O redirection.

    2. Pipelines.

    3. Logical operators.


    # Unix Philosophy


    [Douglas McIlroy](#) [^218] is one of the Unix developers. He summarized the philosophy
    of this OS in three points:


    +   1. Write programs that do one thing and do it well.

    2. Write programs to work together.

    3. Write programs to handle text streams, because that is a universal interface.'
  merge: -1
  pgno: 101
- img_proc: false
  md: 'The plain text format is the cornerstone of the Unix philosophy. It is the
    foundation for the first two points.


    The text format allows programs to share data easily. Suppose that two developers
    independently of each other wrote two utilities. Both utilities accept text data
    on input. They print results in text format too. You have a task. If you combine
    two utilities, you solve it. Because of the text interface, it is quite simple
    to do. You have to pass the output of the first utility to the input of the second
    one.


    When it is easy for programs to interact, there is no need to overload them with
    extra features. For example, you write a program to copy files. It does the job
    well. But eventually, you realize that it lacks a search function. With this feature,
    it would be faster to find and copy the files at once. Then you decide that it
    is convenient to create directories and copy files by one program. This example
    shows that the requirements for a self-contained application grow rapidly.


    When applications work together, each solves a single task only. If you need an
    extra feature, you call the corresponding special utility. You don''t have to
    add this feature to your application. The feature is already available and well
    tested. Just call an external utility that does what you need.


    # I/O Redirection


    GNU utilities follow the Unix philosophy. They use a text format for input and
    output. Therefore, they are just as easy to combine as Unix utilities.


    When combining GNU utilities, there is a task to pass text data between them.
    The task has several solutions.


    Suppose the output of a utility fits one line. You need to pass it to another
    utility. Using the clipboard is the simplest solution here. Here are the steps
    to take it:


    +   1. Select the utility output with the mouse.

    2. Type the command to call another utility.

    3. Paste the contents from the clipboard at the end.

    4. Launch the command.


    This simple method does not work for copying multiple lines. When you paste them,
    Bash handles line breaks as commands delimiter. It executes the command right
    after receiving the delimiter. Because of this, the shell loses some copied lines.


    Another solution is to use the file system. Create a temporary file to save the
    utility output. Then pass the file name to another utility. It will read its contents
    and retrieve the data. This approach is more convenient than the clipboard for
    two reasons:


    +   1. There is no limit on the number of lines to transfer.

    2. There are no manual operations with the clipboard.'
  merge: -1
  pgno: 102
- img_proc: false
  md: 'Bash has a mechanism that redirects the command output to the file. The same
    mechanism redirects data from the file to the command input. It means that your
    application does need a feature for interacting with the file system. Instead,
    it should support the text data format on input and output. Bash does all the
    other work of redirecting that data.


    Let''s look at an example. Suppose that you are looking for the files on the disk.
    The search result has to be saved into a file. To solve this task, use the `find`
    utility and the redirect operator `1>`. Then the utility call looks like this:


    ```

    find / -path */doc/* -name README 1> readme_list.txt

    ```


    The command creates the `readme_list.txt` file in the current directory. It contains
    the output of the `find` utility. The output looks the same in the file as it
    is printed on the screen. If the current directory has the `readme_list.txt` file
    already, the command overwrites it.


    What does the `1>` operator mean? It is [redirection](https://en.wikipedia.org/wiki/Redirection_(computing))
    of standard output stream. There are three [standard streams](https://en.wikipedia.org/wiki/Standard_streams)
    in the Unix environment. Table 2-12 explains them.


    | Number | Name | Purpose |

    |--------|------|---------|

    | 0 | Standard input stream (stdin). | A program receives input data from this
    stream. By default, it comes from an input device like a keyboard. |

    | 1 | Standard output stream (stdout). | A program outputs data there. The terminal
    window prints it by default. |

    | 2 | Standard error stream (stderr). | A program outputs the error messages there.
    The terminal window prints it by default. |


    A program operates in the software environment that the OS provides. A thread
    is a communication channel between the program and the environment.


    Early Unix systems have used physical channels for input and output data. The
    input was tied to the keyboard. The same way the output was tied to the monitor.
    Streams were introduced as [abstraction](https://en.wikipedia.org/wiki/Abstraction_layer)
    over these channels. The abstraction makes it possible to work with different
    objects using the same algorithm. It allows replacing input from a real device
    with input from a file. Similarly, printing to the screen can be replaced by output
    to a file. At the same time, the same OS code handles these I/O operations.


    The purpose of the input and output streams is clear. But the error stream causes
    questions. Why do we need it? Imagine that you run the `find` utility to search
    for files. You do not have access to some directories. When the `find` utility
    reads their contents, it is unavailable. The utility prints an error message in
    this case.'
