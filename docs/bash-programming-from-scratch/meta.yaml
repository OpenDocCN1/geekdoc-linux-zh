    the second action only if the first one succeeds. You can apply the logical OR
    explicitly. Then `find` always calls `wc`. Here is the command with logical OR:


    ```

    find / -path "*/doc/bash/*" -name "*.html" -exec cat {} \; -o -exec wc -l {} \;

    ```


