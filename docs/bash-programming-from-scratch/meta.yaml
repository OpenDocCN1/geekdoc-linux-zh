  md: '```

    0000 0100

    ```


    The discarded one affects the final result. We need a second calculation step
    to take it into account. In this step, we add the discarded one as a number to
    the result. It looks like this:


    ```

    0000 0100 + 0000 0001 = 0000 0101 = 5

    ```


    We got the correct result of adding the numbers 10 and -5.


    If the addition results in a negative number, the second calculation step is unnecessary.
    As an example, add the numbers -7 and 2. First, write them in the ones'' complement:


    ```

    -7 = 1111 1000

    2 = 0000 0010

    ```


    Then do the first step of addition:


    ```

    -7 + 2 = 1111 1000 + 0000 0010 = 1111 1010

    ```


    The high bit equals one. It means that we got a negative number. Therefore, we
    should skip the second step of addition.


    Let''s check if the result is correct. For convenience, convert the number from
    ones'' complement to SMR. Invert all bits of the number value for doing that.
    The sign bit should stay unchanged. Here is the result:


    ```

    1111 1010 -> 1000 0101 = -5

    ```


    We got the right result again.


    The ones'' complement solved one problem. Now the adder CPU module can add any
    signed integers. There is one disadvantage of this solution. Addition requires
    two steps in some cases. It slows down computations.


    SMR has the second problem. It represents zero in two ways. Ones'' complement
    did not solve it.


    # Two''s Complement


    The two''s complement solves both problems of SMR. First, it allows the standard
    adder to add negative numbers. In the ones'' complement, this operation requires
    two steps. In two''s complement, one step is sufficient. Second, there is only
    one way to represent zero.


    Positive integers in the two''s complement look the same as in SMR. The highest
    bit equals zero there. The remaining bits store the value of the number. Negative
    integers have the highest bit equal to one. The value bits are inverted the same
    way as in the ones'' complement. The result is increased by one.


    Table 3-16 shows the two''s complement representation of some numbers.'
