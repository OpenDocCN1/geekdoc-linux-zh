    # xargs


    The `find` utility has the `-exec` parameter. It calls a command for each found
    object. This behavior resembles a pipeline: `find` passes its result to another
    program. These mechanisms look similar but their internals differs. Choose an
    appropriate mechanism depending on your task.'
