  md: '# Computer Memory


    A hard disk stores all instructions of the program. If the program is relatively
    small and simple it fits a single file. Complex applications occupy several files.


    Suppose that you have a single file program. When you launch it, the OS loads
    the file into the computer memory called RAM. Then the OS allocates a part of
    processor time for the new task. This way, the processor performs the program''s
    instructions at specified intervals.


    The first step of launching a program is to load it into RAM. We should consider
    the computer memory internals to understand this step better.


    The single unit of the computer memory is [byte](https://en.wikipedia.org/wiki/Byte)^103^.
    The byte is the minimum amount of information that the processor can reference
    and load into its memory. However, the CPU can handle smaller amounts of data
    if you apply special techniques. You operate bits in this case. A [bit](https://en.wikipedia.org/wiki/Bit)^104^
    is the smallest amount of information you cannot divide. You can imagine the bit
    as a single logical state. It has one of two possible values. There are several
    ways to interpret them:


    +   - 0 or 1

    - True or False

    - Yes or No

    - + or -

    - On or Off.


    Another way to imagine one bit is to compare it with a lamp switch. It has two
    possible states:


    +   - The switch closes the circuit. Then the lamp is on.

    - The switch opens the circuit. Then the lamp is off.


    A byte is a memory block of eight bits. Here you can ask why do we need this packaging?
    CPU can operate a single bit, right? Then it should be able to refer to a specific
    bit in memory.


    CPU cannot refer to a single bit. There are technical reasons for that. The primary
    task of the first computers was arithmetic calculations. For example, these computers
    calculated the [ballistic tables](https://www.wikiwand.com/en/Ballistic_table)^105^.
    You should operate integers and fractional numbers to solve such a task. The computer
    does the same. However, a single bit is not enough to store a number in memory.
    Therefore, the computer needs memory blocks to store numbers. The bytes became
    such blocks.


    Introducing bytes affected the architecture of processors. Engineers have expected
    that the CPU performs most operations over numbers. Therefore, they added a feature
    to load and process all bits of the number at once. This solution increased computers''
    performance by order of magnitude. At the same time, loading of the single bit
    in the CPU happens rarely. Supporting this feature in hardware brings significant
    overhead. Therefore, engineers have excluded it from modern processors.'
