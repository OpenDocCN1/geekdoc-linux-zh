  md: '# Sign-Magnitude Representation


    All numbers in computer memory are represented in binary form. It means that the
    computer stores any number as a sequence of zeros and ones. Number representation
    defines what those zeros and ones mean.


    First, we consider the simplest numbers representation that is the sign-magnitude
    representation or SMR. There are two options to use it:


    +   1. To store only positive integers (unsigned).

    2. To store both positive and negative integers (signed).


    The computer allocates a fixed block of memory for any number. When you choose
    the first option of SMR, all bits of the allocated memory are used in the same
    way. They store the value of the number. Table 3-13 shows how it looks like.


    | Decimal | Hexadecimal | SMR       |

    |---------|-------------|-----------|

    | 0       | 0           | 0000 0000 |

    | 5       | 5           | 0000 0101 |

    | 60      | 3C          | 0011 1100 |

    | 110     | 6E          | 0110 1110 |

    | 255     | FF          | 1111 1111 |


    Suppose that the computer allocates one byte of memory for a number. Then you
    can store unsigned integers from 0 to 255 there using SMR.


    The second option of SMR allows you to store signed integers. In this case, the
    highest bit of the number stores its sign. Therefore, there are fewer bits left
    for the value of the number. Suppose that there is one byte to keep the number.
    The number''s sign takes one bit. Then only seven bits can store the value of
    the number.


    Table 3-14 shows the sign-magnitude representation of the signed integers.


    | Decimal | Hexadecimal | SMR       |

    |---------|-------------|-----------|

    | -127    | FF          | 1111 1111 |

    | -110    | EE          | 1110 1110 |

    | -60     | BC          | 1011 1100 |

    | -5      | 85          | 1000 0101 |

    | -0      | 80          | 1000 0000 |

    | 0       | 0           | 0000 0000 |

    | 5       | 5           | 0000 0101 |

    | 60      | 3C          | 0011 1100 |'
  merge: -1
  pgno: 199
- img_proc: false
  md: '# Table 3-14. The sign-magnitude representation of the signed integers


    | Decimal | Hexadecimal | SMR         |

    |---------|-------------|-------------|

    | 110     | 6E          | 0110 1110   |

    | 127     | 7F          | 0111 1111   |


    The highest (leftmost) bit of all negative numbers equals one. It equals zero
    for positive numbers. Because of the sign, it is impossible to store numbers greater
    than 127 in one byte. For the same reason, the minimum allowed negative number
    is -127.


    There are two reasons why SMR is not widespread nowadays:


    +   1. Arithmetic operations on negative numbers complicate the processor architecture.
    A processor module for adding positive numbers is not suitable for negative numbers.

    2. There are two representations of zero: positive (0000 0000) and negative (1000
    0000). It complicates the comparison operation because these values are not equal
    in memory.


    Take your time and try to understand SMR. Without getting it, you won''t understand
    the other two ways of representing integers.


    # Ones'' Complement


    SMR has two disadvantages. They have led to technical issues when using the representation
    in practice. Therefore, the engineers have looked for an alternative approach
    to store numbers in memory. This way, they came to ones'' complement representation.


    The first problem of SMR is related to operations on negative numbers. The ones''
    complement solves it. Let''s consider the root cause of this problem.


    Here is an example. We want to add the numbers 10 and -5. First, we should write
    them in SMR. Assume that each number occupies one byte in computer memory. Then
    we get the following result:


    ```

    10 = 0000 1010

    -5 = 1000 0101

    ```


    Now the question arises. How does the processor add these numbers? Any modern
    processor has a standard module called adder³¹³. It adds two numbers in a bitwise
    manner. If we apply it in our task, we get the following result:


    ```

    10 + (-5) = 0000 1010 + 1000 0101 = 1000 1111 = -15

    ```


    The result is wrong. It means that the adder cannot add numbers in SMR. The calculation
    mistake happens because the adder does not consider the highest bit of the number.
    This bit stores the sign.


    There are two ways for solving the problem:


    > ³¹³https://en.wikipedia.org/wiki/Adder_(electronics)'
  merge: -1
  pgno: 200
- img_proc: false
  md: '+   1. Add a special module to the processor. It should process operations
    on negative integers.

    2. Change the integer representation in memory. The representation should fit
    the adder logic when it adds negative integers.


    The development of computer technology followed the second way. It is cheaper
    than complicating the processor architecture.


    The ones'' complement reminds SMR. The sign of the number occupies the highest
    bit. The remaining bits store the value. The difference is all bits of the value
    are inverted for negative numbers. It means zeros become ones and ones become
    zeros. Bits of positive numbers are not inverted.


    Table 3-15 shows the ones'' complement representation of some numbers.


    **Table 3-15. The ones'' complement of the signed integers**


    | Decimal | Hexadecimal | Ones'' Complement |

    |---------|-------------|------------------|

    | -127    | 80          | 1000 0000        |

    | -110    | 91          | 1001 0001        |

    | -60     | C3          | 1100 0011        |

    | -5      | FA          | 1111 1010        |

    | -0      | FF          | 1111 1111        |

    | 0       | 0           | 0000 0000        |

    | 5       | 5           | 0000 0101        |

    | 60      | 3C          | 0011 1100        |

    | 110     | 6E          | 0110 1110        |

    | 127     | 7F          | 0111 1111        |


    The memory capacity when using SMR and the ones'' complement is the same. One
    byte can store numbers from -127 to 127 in both cases.


    What is the effect of inverting the value bits for negative numbers? Let''s have
    a look at how the addition of negative numbers works now. First, we will write
    10 and -5 in the ones'' complement. Then add them using the adder CPU module.


    Here is how the numbers look like in memory:


    ```

    10 = 0000 1010

    -5 = 1111 1010

    ```


    Their addition gives the following result:


    ```

    10 + (-5) = 0000 1010 + 1111 1010 = 1 0000 0100

    ```'
