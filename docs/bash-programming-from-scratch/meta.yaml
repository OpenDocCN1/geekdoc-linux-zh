  md: 'The interaction of programs is crucial in Linux. Even monolithic graphical
    Linux applications usually provide a command-line interface. This way, they fit
    smoothly into the ecosystem. It leads that you can integrate them with other utilities
    and applications.


    Suppose that you are solving a complex task in Linux. You should assemble a single
    computing process from a combination of highly specialized utilities. It means
    that you make a computation algorithm that can be complex by itself. Linux provides
    a tool for this specific task. The tool is called [shell](https://en.wikipedia.org/wiki/Unix_shell).
    Using the shell, you type commands and the system performs them. The first Unix
    shell appeared in 1979. It was called [Bourne shell](https://en.wikipedia.org/wiki/Bourne_shell).
    Now it is deprecated. The [Bash](https://en.wikipedia.org/wiki/Bash_(Unix_shell))
    shell has replaced it in most Linux distributions. We will consider Bash in this
    book.


    We have considered Linux and Windows cultures. You cannot give a preference to
    one or another. Comparing them causes endless disputes on the Internet. Each culture
    has its advantages and disadvantages. For example, the Window-style monolithic
    applications cope well the tasks that require intensive calculations. When you
    combine specialized Linux utilities for the same task, you get an overhead. The
    overhead happens because of launching many utilities and transferring data between
    them. This requires extra time. As a result, you wait longer to complete your
    task.


    Today, we observe a synthesis of Windows and Linux cultures. More and more commercial
    applications are being ported to Linux: browsers, development tools, games, messengers,
    etc. However, their developers are not ready for changes that the Linux culture
    dictates. Such changes require too much time and effort. They also make it more
    challenging to maintain the product. Instead of one application, there are two:
    each platform has a different version. Therefore, developers port their applications
    without significant changes. As a result, you find more and more Windows-style
    applications on Linux. One can argue about the pros and cons of this process.
    However, the more applications run on the specific OS, the more popular it becomes,
    thanks to the network effect.


    > Read more about the development culture in Unix and Linux in Eric Raymond''s
    book "[The Art of Programming in Unix](https://en.wikipedia.org/wiki/Unix_philosophy#Eric_Raymond''s_17_Unix_Rules)".


