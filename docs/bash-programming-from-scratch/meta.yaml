    \ This code block looks confusing.\n\nThe `if` statement is a solution for executing\
    \ command blocks on specific conditions. We can write the statement in the general\
    \ form like this:\n\n```\nif CONDITION\nthen\n  ACTION\nfi\n```\n\nYou can write\
    \ this statement in one line too. For doing that, add a semicolon before the `then`\
    \ and `fi` words like this:\n\n```\nif CONDITION; then ACTION; fi\n```\n\nBoth\
    \ the CONDITION and ACTION here are a single command or a block of commands. If\
    \ the CONDITION completes successfully with the zeroed exit status, Bash executes\
    \ the ACTION.\n\nHere is an example of the `if` statement:\n\n```\nif cmp file1.txt\
    \ file2.txt &> /dev/null\nthen\n  echo \"Files file1.txt and file2.txt are identical\"\
    \nfi\n```\n\nThe CONDITION here is the `cmp` utility call. The utility compares\
    \ the contents of two files. If they differ, `cmp` prints the position of the\
    \ first character that is different. The exit status is non-zero in this case.\
    \ If the files are the same, the utility returns the zero status.\n\nWhen we call\
    \ a utility in the `if` condition, its exit status matters only. Therefore, we\
    \ redirect the `cmp` output to the [/dev/null](https://en.wikipedia.org/wiki/Null_device)\
    \ file. It is a special system file. Writing there always succeeds. OS deletes\
    \ all data that you write there.\n\nIf the contents of the `file1.txt` and `file2.txt`\
    \ files match, the `cmp` utility returns the zero status. Then the `if` condition\
    \ equals \"true\". In this case, the `echo` command prints the message.\n\nWe\
    \ have considered a simple case. When the condition is met, the script does an\
    \ action. But there are cases where a condition selects one of two possible actions.\
    \ The `if-else` statement works in this way. Here is the statement in the general\
    \ form:"
