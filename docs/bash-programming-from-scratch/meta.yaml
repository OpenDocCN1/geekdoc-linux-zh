    \ 0111 1110 1110 = 2030\n\n49608 & 33036 = 1100 0001 1100 1000 & 1000 0001 0000\
    \ 1100 = 1000 0001 0000 1000 = 33032\n\n49608 | 33036 = 1100 0001 1100 1000 |\
    \ 1000 0001 0000 1100 = 1100 0001 1100 1100 = 49612\n\n49608 ^ 33036 = 1100 0001\
    \ 1100 1000 ^ 1000 0001 0000 1100 = 0100 0000 1100 0100 = 16580\n```\n\nIf the\
    \ integers are signed, the bitwise operations for the first pair (1122 and 908)\
    \ are the same. For the second pair, the calculation is different. Let's consider\
    \ it.\n\nFirst, we get the value of the 49608 and 33036 numbers in the two's complement:"
