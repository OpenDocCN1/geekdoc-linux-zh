    # Exercise 3-6. The `case` statement


    The script for switching between configuration files will create symbolic links.


    > You cannot create a symbolic link in a Unix environment running on Windows.
    Instead, the `ln` utility copies the file or directory corresponding to the link.
    The utility works fine on Linux and macOS.


    Symbolic links are useful when you want to access a file or directory from the
    file system''s specific location. When you open a link, you edit the file to which
    it points. The link to a directory works the same way. Any changes apply to the
    target directory.


    The algorithm for switching between configuration files looks like this:


    +   1. Remove the existing symbolic link or file in the `~/.bashrc` path.

    2. Check the command-line option passed to the script.

    3. Depending on the option, create a symlink to the `.bashrc-home` or `.bashrc-work`
    file.


    Let''s implement this algorithm by using the `case` operator. Listing 5-4 shows
    the result.'
  merge: -1
  pgno: 305
- img_proc: false
  md: "# Listing 5-4. The script for switching configuration files\n\n```\n#!/bin/bash\n\
    \nfile=\"$1\"\n\nrm ~/.bashrc\n\ncase \"$file\" in\n  \"h\")\n    ln -s ~/.bashrc-home\
    \ ~/.bashrc\n    ;;\n\n  \"w\")\n    ln -s ~/.bashrc-work ~/.bashrc\n    ;;\n\n\
    \  *)\n    echo \"Invalid option\"\n    ;;\nesac\n```\n\nThe `ln` calls differ\
    \ only by the target filename. This similarity hints that you can replace the\
    \ `case` statement with an associative array. Then we get a script similar to\
    \ Listing 5-5.\n\n# Listing 5-5. The script for switching configuration files\n\
    \n```\n#!/bin/bash\n\noption=\"$1\"\n\ndeclare -A files=(\n  [\"h\"]=\"~/.bashrc-home\"\
    \n  [\"w\"]=\"~/.bashrc-work\")\n\nif [[ -z \"$option\" || ! -v files[\"$option\"\
    ] ]]\nthen\n  echo \"Invalid option\"\n  exit 1\nfi\n\nrm ~/.bashrc\n\nln -s \"\
    ${files[\"$option\"]}\" ~/.bashrc\n```"
