- img_proc: false
  md: '```

    xz.txt: README This file

    ```


    On the next step, grep processes the ls output that it receives on the input stream.
    This data also contains the "README" word. Then grep prints the following line:


    ```

    (standard input):README

    ```


    This way, the grep utility processed two things at once:


    +   - Files of the current directory.

    - Data on the input stream.


    When you combine the commands with the semicolon, the ls utility prints its result
    on the screen. Then Bash calls the grep utility. It processes all files in the
    current directory. Next, grep checks its input stream. But there is no data there.
    This way, grep finds the "README" word in the xz.txt file only.


