- img_proc: false
  md: 'Now imagine that the utility found many files. It is easy to miss error messages
    in a huge file list. Separating the output and error streams helps in this case.
    If you redirect the output stream to the file, the utility prints error messages
    only on the screen.


    Use the `2>` operator to redirect the standard error stream. Here is an example
    of the `find` utility call with this operator:


    ```

    find / -path */doc/* -name README 2> errors.txt

    ```


    The number before the angle bracket in the operator means the number of the redirected
    stream. For example, the `2>` operator redirects stream number two.


    Use the `0<` operator to redirect the standard input stream. Here is an example
    for searching the "Bash" pattern in the `README.txt` file:


    ```

    grep "Bash" 0< README.txt

    ```


    This example is not entirely correct. The command uses the `grep` utility interface
    that handles the standard input stream. But `grep` can read the contents of a
    specified file. It is always better to pass the filename to the utility. Here
    is an example:


    ```

    grep "Bash" README.txt

    ```


    Let''s take a more complicated example. Some Bash manuals recommend the `echo`
    command to print the contents of the file. For example, the command for printing
