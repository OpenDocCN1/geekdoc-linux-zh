  md: "# Conditional Statements\n\nWe have met the conditional statements when learning\
    \ the `find` utility. Then we found out that Bash has its own logical operators\
    \ AND (`&&`) and OR (`||`). The Bash language has other options to make branches.\n\
    \nWe will consider the `if` and `case` operators in this section of the book.\
    \ The scripts use them often. Both operators provide similar behavior. However,\
    \ each of them fits better for some specific tasks.\n\n# If Statement\n\nImagine\
    \ you are writing a one-line command. Such a command is called **one-liner**.\
    \ You are trying to make it as compact as possible because a short command is\
