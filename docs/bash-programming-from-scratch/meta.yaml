    # Variables and Parameters


    Variables in Bash have already been mentioned several times in this book. We have
    learned the list of system paths in the `PATH` variable. We have used positional
    parameters in the backup script. It is time to get a good grasp on the topic.


    First, let''s find out what the term "variable" means in programming. The variable
    is an area of memory where some value is stored. In most cases, this is short-term
    memory (RAM, CPU cache and registers).


    There was a generation of the first programming languages (for example [assembler](https://en.wikipedia.org/wiki/Assembly_language)).
    When using such a language, you should refer to a variable by its address. If
    you want to read or write its value, you have to specify its memory address.'
