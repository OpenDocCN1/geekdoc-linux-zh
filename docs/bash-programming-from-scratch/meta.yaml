  md: '+   1. **Imperative programming**[^349]. The developer explicitly specifies
    to the computer how to change its state. In other words, he writes a complete
    algorithm for calculating the result.

    2. **Declarative programming**[^350]. The developer specifies the properties of
    the desired result but not the algorithm to calculate it.


    Bash follows the first paradigm. It is an imperative language.


    The imperative and declarative paradigms define general principles for writing
    a program. There are different methodologies (i.e. approaches) within the same
    paradigm. Each methodology offers specific programming techniques.


    The imperative paradigm has two dominant methodologies:


    +   1. Procedural programming.

    2. **Object-oriented programming**[^351].


    These methodologies suggest structuring the source code of a program in different
    ways. Bash follows the first methodology.


    Let''s take a closer look at procedural programming. This methodology suggests
    features for combining the program''s instruction sets into independent blocks
    of code. These blocks are called subroutines or functions.


    You can call a function from any place of a program. The function can receive
    input parameters. This mechanism works similarly to passing command-line parameters
    to a script. This is a reason why a function is called "a program inside a program"
    sometimes.


    The main task of the functions is to manage the complexity of a program. The larger
    the size of the source code, the harder it is to maintain. Repeating code fragments
    make this situation worse. They are scattered throughout the program and may contain
    errors. After fixing a mistake in one fragment, you have to find and fix all the
    rest. If you put the fragment into a function, it is enough to fix the error only
    there.


    Here is an example of a repeating code fragment. Suppose that you are writing
    a large program. The program prints text messages to the error stream when handling
    errors. Then there will be many places in the source code where you call the `echo`
    command. These calls can look like this:


    ```

    >&2 echo "The N error has happened"

