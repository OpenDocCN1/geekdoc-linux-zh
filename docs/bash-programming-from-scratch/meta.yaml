    ```


    Close and reopen the terminal window. Now you can start Notepad++ by the following
    command:


    ```

    notepad++.exe

    ```


    There is an alternative solution. Instead of changing the `PATH` variable, you
    can declare an alias. The alias mechanism replaces the entered command with another
    one. It allows you to abbreviate long lines in the terminal window.


    Let''s declare an alias with the `notepad++` name for the following command:


    ```

    "/c/Program Files (x86)/Notepad++/notepad++.exe"

    ```


    The following call of `alias` Bash built-in does that:


    ```

    alias notepad++="/c/Program\ Files\ \(x86\)/Notepad++/notepad++.exe"

    ```


    After declaring the alias, Bash translates the command "notepad++" into the absolute
    path of the editor''s executable. This solution has one problem. You should declare
    the alias whenever launching the terminal window. There is a way to automate this
    declaration. Just add the `alias` command at the end of the `~/.bashrc` file.
    Bash executes all commands of this file at every terminal startup.


    Now you can open the source code files in Notepad++ via command-line. To do that,
    pass the filename as the first parameter to the `notepad++` executable. Here is
    an example:'
