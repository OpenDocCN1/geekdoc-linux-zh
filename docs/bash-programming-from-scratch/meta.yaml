- img_proc: false
  md: "We can solve the task by combining the `if` statement and the `grep` utility.\
    \ Put the `grep` call in the `if` condition. Then if the utility succeeds, it\
    \ returns zero exit status. In this case, the `if` condition equals \"true\" and\
    \ the script prints the message.\n\nThe `grep` utility prints its results on the\
    \ output stream. We do not need this output when calling the utility in the `if`\
    \ condition. The `-q` option disables the `grep` output. Finally, we get the following\
    \ `if` statement:\n\n```\nif grep -q -R \"General Public License\" /usr/share/doc/bash\n\
    then\n    echo \"Bash has the GPL license\"\nfi\n```\n\nNow suppose that the `if`\
    \ condition compares two strings or numbers. Bash has a special operator `[[`\
    \ for this purpose. The double square brackets are [reserved word](#) of the interpreter.\
    \ Bash handles the brackets on its own without calling a utility.\n\n> The Bourne\
    \ shell does not have the `[[` operator. The POSIX standard does not have it too.\
    \ Therefore, if you should follow the standard, use the obsolete `test` operator\
    \ or its synonym `[`. Never use `test` in Bash. It has limited capabilities comparing\
    \ with the operator `[[`. Also, it has error-prone syntax.\n\nLet's start with\
    \ a simple example of using the `[[`. We need to compare two strings. In this\
    \ case, the `if` condition looks like this:\n\n```\nif [[ \"abc\" = \"abc\" ]]\n\
    then\n    echo \"The strings are equal\"\nfi\n```\n\nRun this code. You see the\
    \ message that the strings are equal. A check of this kind is not really useful.\
    \ Usually, you want to compare some variable with a string. The `[[` operator\
    \ compares them this way:\n\n```\nif [[ \"$var\" = \"abc\" ]]\nthen\n    echo\
    \ \"The variable equals the \\\"abc\\\" string\"\nfi\n```\n\nDouble-quotes are\
    \ optional in this condition. Bash skips globbing and word splitting when it substitutes\
    \ a variable in the `[[` operator. The interpreter uses a variable as it is in\
    \ this operator. The quotes prevent problems if the string on the right side has\
    \ spaces. Here is an example of such a string:"
  merge: -1
  pgno: 182
- img_proc: false
  md: "```\nif [[ \"$var\" = abc def ]]\nthen\n  echo \"The variable equals the \\\
    \"abc def\\\" string\"\nfi\n```\n\nBash cannot execute the condition of this if\
    \ statement because of word splitting. Always use quotes when working with strings.\
    \ This way, you avoid such problems. Here is the fixed if condition:\n\n```\n\
    if [[ \"$var\" = \"abc def\" ]]\nthen\n  echo \"The variable equals the \\\"abc\
    \ def\\\" string\"\nfi\n```\n\nThe [[ operator can compare two variables with\
    \ each other. It looks like this:\n\n```\nif [[ \"$var\" = \"$filename\" ]]\n\
    then\n  echo \"The variables are equal\"\nfi\n```\n\nTable 3-8 shows all string\
    \ comparisons that the [[ operator allows.\n\n### Table 3-8. String comparisons\
    \ in the [[ operator\n\n| Operation | Description | Example |\n| --- | --- | ---\
    \ |\n| > | The string on the left side is larger than the string on the right\
    \ side in the [lexicographic order](#301). | [[ \"bb\" > \"aa\" ]] && echo \"\
    The \"bb\" string is larger than \"aa\"\" |\n| < | The string on the left side\
    \ is smaller than the string on the right side in the lexicographic order. | [[\
    \ \"ab\" < \"ac\" ]] && echo \"The \"ab\" string is smaller than \"ac\"\" |\n\
    | = or == | The strings are equal. | [[ \"abc\" = \"abc\" ]] && echo \"The strings\
    \ are equal\" |\n| != | The strings are not equal. | [[ \"abc\" != \"ab\" ]] &&\
    \ echo \"The strings are not equal\" |\n| -z | The string is empty. | [[ -z \"\
    $var\" ]] && echo \"The string is empty\" |\n| -n | The string is not empty. |\
    \ [[ -n \"$var\" ]] && echo \"The string is not empty\" |"
