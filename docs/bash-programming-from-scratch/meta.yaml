    \ of the loop body.\n\nSometimes it does not make sense to continue the script\
    \ when interrupting the loop. Use the `exit` command instead of `break` in this\
    \ case.\n\nFor example, it can be an error in the input data that we catch in\
    \ the loop body. Then printing an error message and calling the `exit` command\
    \ is the best choice to stop the script.\n\nThe `exit` command makes your code\
    \ cleaner if you process the result in the loop body. Just call `exit` when you\
