    # Operator ((


    Bash performs integer arithmetic in **math context**. Its syntax resembles the
    C language.


    Suppose that you want to store the result of adding two numbers in a variable.
    Declare it with the `-i` integer attribute. Then assign its value in the declaration.
    Here is an example:


    ```

    declare -i var=12+7

    ```


    Bash assigned the number 19 to the variable but not the "12+7" string. When you
    add the `-i` attribute to the declaration, Bash calculates the assigned value
    in the mathematical context. It happened in our example.


    You can declare the mathematical context explicitly. The `let` built-in command
    does that.


    Suppose you declare the variable without the `-i` attribute. Then the `let` command
    allows you to assign an arithmetic expression result to the variable. Here is
    an example:


    ```

    let text=5*7

    ```


    The `text` variable equals 35 in the result.


    When declaring the variable with the `-i` attribute, you do not need the `let`
    command. It looks like this:


    ```

    declare -i var

    var=5*7

    ```


    Now the `var` variable equals 35 too.


    Declaring a variable with the `-i` attribute creates the mathematical context
    implicitly. It can lead to errors. Therefore, try to avoid using the `-i` attribute.
    It does not affect the way how the Bash stores the variable in memory. Instead,
    converting a string to a number and back takes place every time you assign the
    variable.


    The `let` command allows you to treat a string variable as an integer variable.
    This way, you can do the following assignments:'
  merge: -1
