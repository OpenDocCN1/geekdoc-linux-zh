  md: 'Table 3-16. The two''s complement of the signed integers


    | Decimal | Hexadecimal | Two''s Complement |

    | --- | --- | --- |

    | -127 | 81 | 1000 0001 |

    | -110 | 92 | 1001 0010 |

    | -60 | C4 | 1100 0100 |

    | -5 | FB | 1111 1011 |

    | 0 | 0 | 0000 0000 |

    | 5 | 5 | 0000 0101 |

    | 60 | 3C | 0011 1100 |

    | 110 | 6E | 0110 1110 |

    | 127 | 7F | 0111 1111 |


    The memory capacity stays the same when using the two''s complement. One byte
    can store the numbers from -127 to 127.


    Let''s consider adding negative numbers in the two''s complement. For example,
    we add 14 and -8. First, write them in the two''s complement. Here is the result:


    ```

    14  = 0000 1110

    -8  = 1111 1000

    ```


