  md: '# # Package Manager


    We are already familiar with the basic Bash built-in commands and the standard
    set of GNU utilities. These tools are installed in the Unix environment by default.
    It can happen that their features are not enough to solve your task. You can solve
    this problem by installing additional programs and utilities.


    Installing software in the Unix environment is not the same as in Windows. Let''s
    look at how to properly install and update software in any Unix environment or
    Linux distribution.


    # ## Repository


    Whenever you install software in the Unix environment, you should use [repository](#footnote-362)^362^.
    A repository is a server that stores all available applications. **Maintainers**
    take open sources of these applications and build them. Most maintainers are volunteers
    and free software enthusiasts.


    The repository stores each application as a separate file. This file has a special
    format. The format depends on the Linux distribution. Thus, each Linux distribution
    has its own software repository. Examples of the formats are deb, RPM, zst, etc.
    A file with an application is called a **package**. A package is a unit for installing
    software in a system.


    The repository stores packages with applications and libraries. Besides, the repository
    has meta-information about all packages. One or more files store this meta-information.
    They are called **the package index**.


    You can install packages in a Unix environment from several repositories at once.
    For example, one repository provides new versions of packages, and another offers
    special builds of them. Depending on your requirements, you can choose the repository
    for installing the package.


    # ## Package Operating


    The Unix environment provides a special program to work with the repository. It
    is called [package manager](#footnote-363)^363^.


    Why does the Unix environment need a package manager? For example, Windows does
    not have one. Users of this OS download programs from the Internet and install
    them manually.


    The package manager installs and removes packages in the Unix environment. Its
    main task is to keep track of **package dependencies**. Suppose a program from
    one package uses features of an application or library from another package. Then
    the first package depends on the second one.'
  merge: -1
  pgno: 275
- img_proc: false
  md: 'Package dependency prevents the same application or library from being installed
    multiple times on the system. Instead, the packages you need are installed once.
    All dependent programs know where to install them on disk and share them.


    Package dependency prevents duplicating of applications and libraries in your
    system. It is enough to install all required packages once. Then all dependent
    programs know where to access files from these packages.


    Install applications in a Unix environment or Linux system using the package manager
    only. This rule has one exception. If you need a proprietary program, you have
    to install it manually. Usually, such a program is distributed in a single package.
    It includes all dependencies (necessary libraries and applications). There is
    no need to track dependencies in this case. Therefore, you can install the program
    without the package manager.


    Here is the algorithm to install a package from the repository:


    +   1. Download a package index from the repository.

    2. Find the required application or library in the package index.

    3. Download the package with the application or library from the repository.

    4. Install the downloaded package.


    The package manager does all these steps. You need to know its interface and call
    it with the right parameters.


    The MSYS2 environment uses the package manager pacman[^364]. It is designed for
    the Arch Linux distribution. The pacman manager operates packages, which have
    a simple format. You do not need any special skills or experience to build applications
    and libraries into these packages.


    Let''s take the pacman manager as an example and look at the commands for working
    with the repository.


    The following command downloads a package index from the repository:


    ```

    pacman -Syy

    ```


    This command finds the package by the keyword in the loaded index:


    ```

    pacman -Ss KEYWORD

    ```


    Suppose you are looking for a utility for accessing MS Word documents. Then the
    following command finds the right package for that:


    > [^364]: https://wiki.archlinux.org/index.php/Pacman'
  merge: -1
