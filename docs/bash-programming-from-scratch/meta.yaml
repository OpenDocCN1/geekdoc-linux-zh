  md: 'significantly every year. The speed of peripherals has remained almost the
    same. It led to CPU idles all the time while waiting for input/output.


    > Bottleneck is a component or resource of an information system that limits its
    overall performance or bandwidth.


    Why does CPU idle and wait for peripheral devices? Here is an example. Suppose
    that the computer from the 1960s runs programs one by one. It reads data from
    a magnetic tape and prints the results on the printer. The OS loads each program
    and executes its instructions. Then it loads the next one, and so on.


    The problem happens when reading data and printing the results. The time for reading
    data on the magnetic tape is huge on the CPU scale. This time is enough for the
    processor to perform many calculations. However, it does not do that. The reason
    for that is the currently loaded program occupies all computer resources. The
    same CPU idle happens when printing the results. The printer is a slow mechanical
    device.


    The CPU idle led OS developers to the concept of [multiprogramming](#). This concept
    implies that OS loads several programs into the computer memory at the same time.
    The first program works as long as all resources it needs are available. It stops
    executing once a required resource is busy. Then OS switches to another program.


    Here is an example. Suppose that your application wants to read data from your
    hard disk. While the disk controller reads the data, it is busy. It cannot process
    the following requests from the program. Thus, the application waits for the controller.
    In this case, OS stops executing it and switches to the second program. The computer
    executes it to the end or until it has all the required resources. When the second
    program finishes or stops, OS switches tasks again.


    Multiprogramming differs from multitasking that modern OSes have. Multiprogramming
    fits the batch processing mode very well. However, this load balancing concept
    is not suitable for [interactive systems](#). An interactive system considers
    each user action as an event (for example, a keystroke). The system should process
    events immediately when they happen. Otherwise, the user cannot work with the
    system.


    Here is an example of workflow with an interactive system. Suppose that you are
    typing text in the MS Office document. You press a key and expect to see this
    symbol on the screen. If the computer requires several seconds to process your
