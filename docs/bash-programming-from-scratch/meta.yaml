    # Source Code


    Machine code is a low-level representation of a program. This format is convenient
    for the processor. However, it is hard for a human to write a program in machine
    code. Software engineers developed the first programs this way. It was possible
    for early computers because of their simplicity. Modern computers are much more
    powerful and complex devices. Their programs are huge and have a lot of functions.


    Computer engineers invented two types of special applications. They solve the
    problem of the machine code complexity. These applications are **compilers**[^142]
    and **interpreters**[^143]. They translate the program from a human-readable language
    into machine code. Compilers and interpreters solve this task differently.


    Software developers use **programming languages**[^144] in their work nowadays.
    Compilers and interpreters take programs written in such languages and produce
    the corresponding machine code.


    Humans use one of **natural language**[^145] to communicate with each other. Programming
    languages are different from them. They are formal and very limited. Using a programming
    language, you can express only actions that a computer can perform. There are
    strict rules on how you should write these actions. For example, you can use a
    small set of words and combine them in specific orders. **Source code**[^146]
    is a text of the program you write in a programming language.


    The compiler and interpreter process source code differently. The compiler reads
    the entire program text, generates machine code instructions and saves them on
    a disk drive. The compiler does not execute the resulting program on its own.
    The interpreter reads the source code in parts, generates machine code instructions
    and executes them immediately. The interpreter stores its results in RAM temporarily.
    When the program finishes, you lose these results.'
