- img_proc: false
  md: "```\nwhile true\ndo\n  sleep 1\ndone\n```\n\nThe `true` command always returns\
    \ the \"true\" value. It means that it returns zero exit status. There is the\
    \ symmetric command called `false`. It always returns exit status one that matches\
    \ the \"false\" value.\n\n> Words \"true\" and \"false\" are **literals**[^342]\
    \ in most programming languages. Literals are reserved words for representing\
    \ fixed values. In our case, they represent the \"true\" and \"false\" values.\n\
    \nYou can replace the `true` command in the `while` condition with a colon. This\
    \ way, you get the following:\n\n```\nwhile :\ndo\n  sleep 1\ndone\n```\n\nThe\
    \ colon is synonymous with the `true` command. The synonymous solves the **compatibility\
    \ task**[^343] with the Bourne shell. This shell does not have `true` and `false`\
    \ commands. Therefore, Bourne shell scripts use colons and Bash should support\
    \ them.\n\nThe POSIX standard includes all three commands: colon, `true`, and\
    \ `false`. However, avoid using a colon in your scripts. It is a deprecated syntax\
    \ that makes your code harder to understand.\n\nHere is an example of an infinite\
    \ loop. We want to write a script that displays statistics of disk space usage.\
    \ The `df` utility can help us in this case. It prints the following when called\
    \ without parameters:\n\n```\n$ df\nFilesystem      1K-blocks      Used Available\
    \ Use% Mounted on\nC:/msys64       41940988  24666880  17274108  59% /\nZ:   \
    \          195059116 110151748  84907368  57% /z\n```\n\nThe utility shows \"\
    Used\" and \"Available\" disk space in bytes. We can add the `-h` option to the\
    \ utility call. Then it shows kilobytes, megabytes, gigabytes and terabytes instead\
    \ of bytes. Also, we add an option `-T`. It shows the file system type for each\
    \ disk. This way, we get the following output:"
  merge: -1
  pgno: 237
- img_proc: false
  md: "```\n$ df -hT\nFilesystem    Type  Size  Used Avail Use% Mounted on\nC:/msys64\
    \     ntfs  406G   24G   17G  59% /\nZ:            hgfs  187G  106G   81G  57%\
    \ /z\n```\n\nIf you want to get information about all mount points, add the `-a`\
    \ option.\n\nNow let's write an infinite loop. It calls the `df` utility on each\
    \ iteration. This way, we get a simple script to monitor the file system. Listing\
    \ 3-20 shows the script.\n\n# **Listing 3-20. The script to monitor the file system**\n\
    \n```\n#!/bin/bash\n\nwhile :\ndo\n  clear\n  df -hT\n  sleep 2\ndone\n```\n\n\
    The first action of the cycle iteration is the `clear` utility call. It clears\
    \ the terminal window of text. Thanks to this step, the terminal shows the output\
    \ of our script only.\n\nExecuting a command in a cycle is a common task that\
    \ arises when working with Bash. The `watch` utility solves this task. The utility\
    \ is a part of the `procps` package. The following command installs this package\
    \ to the MSYS2 environment:\n\n```\npacman -S procps\n```\n\nNow you can replace\
    \ the script from listing 3-20 with a single command. It looks like this:\n\n\
    ```\nwatch -n 2 \"df -hT\"\n```\n\nThe `-n` option of the `watch` utility specifies\
    \ the interval between command calls. The command to execute follows all utility\
    \ options.\n\nThe `-d` utility option highlights the difference in the command's\
    \ output at the current iteration and the last iteration. This way, it is easier\
    \ to keep track of changes that have occurred.\n\n# **Reading a Standard Input\
    \ Stream**\n\nThe `while` loop fits well for handling an input stream. Here is\
    \ an example of such a task. We want to write a script that reads a text file.\
    \ The script makes an associative array from the file's content."
