    ```

    echo $( 0< README.txt )

    ```


    Here `echo` receives the output of the following command:


    ```

    0< README.txt

    ```


    **Command substitution** is substituting the command result where it was called.
    When the interpreter encounters the `$(` and `)` characters, it executes the command
    enclosed between them and substitutes its output.


    Because of the command substitution, Bash executes our `echo` call in two steps:'
