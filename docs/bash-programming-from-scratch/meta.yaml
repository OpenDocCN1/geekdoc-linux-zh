    " command.


    If you replace the echo command by the cat utility, it solves the problem. The
    find call would look like this:


    ```

    find / -path */doc/* -name README -exec cat {} \;

    ```


    This command prints the contents of all found files.


    The redirection operators of standard input and output streams are used frequently.
    Therefore, developers have added short forms for them:


    +   - The < operator redirects the input stream.

    - The > operator redirects the output stream.


    The `find` call with the short form of stream redirection looks like this:


    ```

    find / -path */doc/* -name README > readme_list.txt

    ```


    Here is an example of the `echo` call with the short redirection form:


    ```

    echo $( < README.txt )

    ```


    Suppose that you redirect the standard output stream to a file. This file already
    exists and its contents should stay. In that case, append the command output to
    the end of the file. The >> operator does it.


    For example, your computer has installed applications in the `/usr` and `/opt`
    system paths. Then the following two calls find their README files:


    ```

    find /usr -path */doc/* -name README > readme_list.txt

    find /opt -name README >> readme_list.txt

    ```'
