    When assigning elements of an array, you can read them from other variables. Here
    is an example:


    ```

    bash_doc="/usr/share/doc/bash/README"

    flex_doc="/usr/share/doc/flex/README.md"

    xz_doc="/usr/share/doc/xz/README"

    files=("$bash_doc" "$flex_doc" "$xz_doc")

    ```


    This command writes values of the variables `bash_doc`, `flex_doc` and `xz_doc`
    to the `files` array. If you change these variables after this declaration, it
    does not affect the array.


    When declaring an array, you can explicitly specify an index for each element.
    Do it like this:


    ```

    bash_doc="/usr/share/doc/bash/README"

    flex_doc="/usr/share/doc/flex/README.md"

    xz_doc="/usr/share/doc/xz/README"

    files=([0]="$bash_doc" [1]="$flex_doc" [5]="/usr/share/doc/xz/README")

    ```


    Here there are no spaces before and after each equal sign. Remember this rule:
    when you declare any variable in Bash, there are no spaces before or after the
    equal sign.


    Instead of initializing the entire array at once, you can assign its elements
    separately. Here is an example:


    ```

    files[0]="$bash_doc"

    files[1]="$flex_doc"

