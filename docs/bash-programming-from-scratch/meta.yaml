    # Arithmetic Expressions


    Bash can calculate integers. It does simple arithmetic operations: addition, subtraction,
    multiplication and division. Also, Bash does bitwise and logical operations. They
    are often used in programming. We consider them in detail now.


    Bash does not support floating-point arithmetic. For doing that, use the [bc](https://en.wikipedia.org/wiki/Bc_(programming_language))
    or [dc](https://en.wikipedia.org/wiki/Dc_(computer_program)) calculator.


    # Integer Representation


    Let''s have a look at how a computer represents integers in its memory. Knowing
    it, you understand how mathematical operations work in Bash.


    Mathematical [integers](https://en.wikipedia.org/wiki/Integer) can be positive
    or negative. They match the data type with the same name [integer](https://en.wikipedia.org/wiki/Integer_(computer_science)).


    If an integer type variable accepts positive values only, it is called **unsigned**.
    If it allows both positive and negative values, the variable is called **signed**.


    There are three most common ways of representing integers in computer memory:


    +   - [Sign-Magnitude representation](https://en.wikipedia.org/wiki/Signed_number_representations#Sign-and-magnitude_method)
    (SMR)

    - [Ones'' complement](https://en.wikipedia.org/wiki/Signed_number_representations#Ones''_complement)

    - [Two''s complement](https://en.wikipedia.org/wiki/Signed_number_representations#Two''s_complement)'
