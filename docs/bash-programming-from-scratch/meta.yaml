  md: "```\nnumber=$((RANDOM % 100))\n```\n\n2. Get a number in the 1 to 100 range.\
    \ To do this, add one to the previous result. Here is the complete formula for\
    \ calculating a random number from 1 to 100:\n\n```\nnumber=$((RANDOM % 100 +\
    \ 1))\n```\n\nListing 5-6 shows the script that implements the game's algorithm.\n\
    \n# Listing 5-6. The script for playing More or Fewer\n\n```\n1   #!/bin/bash\n\
    2\n3   number=$((RANDOM % 100 + 1))\n4\n5   for i in {1..7}\n6   do\n7   \techo\
    \ \"Enter the number:\"\n8\n9   \tread input\n10\n11  \tif (( input < number ))\n\
    12  \tthen\n13  \t\techo \"The number $input is less\"\n14  \telif (( number <\
    \ input ))\n15  \tthen\n16  \t\techo \"The number $input is greater\"\n17  \t\
    else\n18  \t\techo \"You guessed the number\"\n19  \t\texit 0\n20  \tfi\n21  done\n\
    22\n23  echo \"You didn't guess the number\"\n```\n\nTo guess a number in seven\
    \ tries, use the **binary search**[^489]. The idea behind it is to divide an array\
    \ of numbers into halves. Let's look at an example of applying the binary search\
    \ for the \"More or Fewer\" game.\n\nOnce the game has started, we guess a number\
    \ in the range from 1 to 100. The middle of this range is the number 50. Enter\
    \ this value first. The script will give you the first hint. Suppose the script\
    \ prints that 50 is less than the number you are looking for. This means that\
    \ you should search in the\n\n> [^489]: https://en.wikipedia.org/wiki/Binary_search_algorithm"
  merge: -1
