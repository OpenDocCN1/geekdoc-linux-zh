    # Command Interpreter


    All interpreters have two working modes: non-interactive and interactive. When
    you choose the non-interactive mode, the interpreter loads the source code file
    from the disk and executes it. You do not need to type any commands or control
    the interpreter. It does everything on its own.


    When you choose the interactive mode, you type each command to the interpreter
    manually. If the interpreter is integrated with the OS and works in the interactive
    mode, it is called a [command shell](https://en.wikipedia.org/wiki/Shell_(computing))
    or shell.


    A command shell provides access to the settings and functions of the OS. You can
    perform the following tasks using it:'
