  md: '**Escape sequence**[^422] is a set of characters that have no meaning of their
    own. Instead, they control the output device. For example, the line break character
    `\n` commands the output device to start a new line.


    **Exit status**[^423] is an integer value from 0 to 255 that the shell command
    returns when finishing. The zero status means successful execution of the command.
    All other codes indicate an error.


    # F


    **File descriptor**[^424] is an abstract pointer to a file or communication channel
    (stream, pipeline or network socket). Descriptors are part of the POSIX interface.
    They are non-negative integers.


    **Filename expansion**[^425] is a Bash mechanism that replaces patterns to filenames.
    The patterns can contain the following wildcards: `?`, `*`, `[`. Here is an example:


    ```

    rm -rf *

    ```


    **Filename extension**[^426] is a suffix of the filename. The extension defines
    the type of file.


    **File system**[^427] is a set of rules to store and read data from storage media.


    **Foreground**[^428] is a default process execution mode in Bash. When used, the
    process identifier belongs to the [identifier group](#) of the terminal. The executed
    process handles keyboard interrupts.


    **Function** is another name for a subroutine.


    # G


    **General-purpose programming language**[^430] is a language that you can use
    to develop applications for various applied domains. It does not contain constructs
    that are useful in one domain and useless in others.


    **Globbing**[^431] or glob is another name for filename expansion in Bash.


    **Glob pattern**[^432] is a search query. It includes regular and [wildcard characters](#)
    (`*` and `?`). The wildcards correspond to any characters. For example, the "R*M?"
    pattern matches strings that begin with R and whose penultimate letter is M.'
