    # W


    **Word splitting**<sup>484</sup> is the Bash mechanism that splits command-line
    arguments into words. Then it passes them to the command as separate parameters.
    The mechanism uses the characters from the IFS variable as delimiters. It skips
    arguments that are enclosed in quotes. Here is an example:


