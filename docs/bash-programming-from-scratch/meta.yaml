  md: "# Listing 3-25. The script for printing all elements of the array\n\n```\n\
    #!/bin/bash\n\narray=(Alice Bob Eve Mallory)\n\nfor element in \"${array[@]}\"\
    \ndo\n    echo \"$element\"\ndone\n```\n\nSuppose you need the first three elements.\
    \ Then you should expand only the elements you need in the loop condition. Listing\
