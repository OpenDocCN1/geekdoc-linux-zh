  md: "```\nprint_error()\n{\n  case $LANG in\n    de_DE)\n      local func=\"code_to_error_de\"\
    \n      ;;\n    en_US)\n      local func=\"code_to_error_en\"\n      ;;\n    *)\n\
    \      local func=\"code_to_error_en\"\n      ;;\n  esac\n\n  echo \"${func $1}\
    \ $2\" >> debug.log\n}\n```\n\nThere is a second option to solve the code duplication\
    \ problem. We can replace the case statements in the functions code_to_error_de\
    \ and code_to_error_en with indexed arrays. Here is an example:\n\n```\ncode_to_error_de()\n\
    {\n  declare -a messages\n\n  messages[1]=\"Der Datei wurde nicht gefunden:\"\n\
    \  messages[2]=\"Berechtigung zum Lesen der Datei verweigert:\"\n\n  echo \"${messages[$1]}\"\
    \n}\n\ncode_to_error_en()\n{\n  declare -a messages\n\n  messages[1]=\"File not\
    \ found:\"\n  messages[2]=\"Permission to read the file denied:\"\n\n  echo \"\
    ${messages[$1]}\"\n}\n```\n\nWe can simplify the code and go without code_to_error\
