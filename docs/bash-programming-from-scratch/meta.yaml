  md: "It is time to come back to our backup script. The script has a block of commands.\
    \ The result of the bsdtar utility decides if Bash should execute this block.\
    \ When we meet the code block and condition, it is a hint to apply the if statement\
    \ here.\n\nWe apply the if-else statement to the bsdtar call and handling its\
    \ result. Then we get the following code:\n\n```\nif bsdtar -cjf \"$1\".tar.bz2\
    \ \"$@\"\nthen\n  echo \"bsdtar - OK\" > results.txt\nelse\n  echo \"bsdtar -\
    \ FAILS\" > results.txt\n  exit 1\nfi\n```\n\nDo you agree that it is easier to\
    \ read the code now? We can simplify it even more. The [early return](https://medium.com/swlh/return-early-pattern-3d18a41bba8)\
    \ pattern does that. Replace the if-else statement with if like this:\n\n```\n\
    if ! bsdtar -cjf \"$1\".tar.bz2 \"$@\"\nthen\n  echo \"bsdtar - FAILS\" > results.txt\n\
    \  exit 1\nfi\n\necho \"bsdtar - OK\" > results.txt\n```\n\nThe code behaves the\
    \ same as with the if-else statement. The logical negation inverts the bsdtar\
    \ utility result. Now, if it fails, the condition of the if statement becomes\
    \ \"true\". Then the script prints the \"bsdtar - FAILS\" message to the log file\
    \ and terminates. Otherwise, the script skips the command block of the if statement.\
    \ The further echo call prints the \"bsdtar - OK\" message to the log file.\n\n\
    The early return pattern is a useful technique that makes your code cleaner and\
    \ easier to read. The idea behind it is to terminate the program as early as possible\
    \ when an error appears. This solution allows you to avoid the nested if statements.\n\
    \nHere is an example. Imagine the algorithm that does five actions. Each action\
    \ depends on the result of the previous one. If the previous action fails, the\
    \ algorithm stops. We can implement this algorithm with the following nested if\
    \ statements:"
  merge: -1
  pgno: 178
- img_proc: false
  md: "```\nif ACTION_1\nthen\n  if ACTION_2\n  then\n    if ACTION_3\n    then\n\
    \      if ACTION_4\n      then\n        ACTION_5\n      fi\n    fi\n  fi\nfi\n\
    ```\n\nThese nested statements look confusing. If you add the else blocks for\
    \ handling errors, this code becomes even harder to read.\n\nThe nested if statements\
    \ make the code hard to read. It is a serious problem. The early return pattern\
    \ solves it. Let's apply the pattern to our algorithm. Then we get the following\
    \ code:\n\n```\nif ! ACTION_1\nthen\n  # error handling\nfi\n\nif ! ACTION_2\n\
    then\n  # error handling\nfi\n\nif ! ACTION_3\nthen\n  # error handling\nfi\n\n\
    if ! ACTION_4\nthen\n  # error handling\nfi\n\nACTION_5\n```\n\nWe got the same\
    \ algorithm. Its behavior did not change. There are still five actions. If any\
    \ of them fails, the algorithm stops. But the early return pattern made the code\
    \ simpler and clearer."
