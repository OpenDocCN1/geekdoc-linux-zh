    When removing a write-protected file, the rm utility shows you a warning. You
    can see how it looks like in Figure 2-26.


    ![](bbox=[0.092, 0.345, 0.909, 0.619])


    When you see such a warning, there are two options. You can press the Y (short
    for yes) and Enter. Then the rm utility removes the file. Another option is to
    press N (no) and Enter. It cancels the operation.


    If you want to suppress any rm warnings, use the `-f` or `--force` option. The
    utility removes files without confirmation in this case. Here is an example call:


    ```

    rm -f ~/docs/reports/2019/report*.txt

    ```


