    # Pipelines


    It is inconvenient to create temporary files for sharing data between programs.
    Managing these files takes extra effort. You should remember their paths and removing
    them after usage.


    Unix environment provides an alternative solution. It is called **pipeline**[^224].
    This mechanism is more convenient than temporary files. It shares data between
    programs by passing messages without using the file system.


    Let us consider an example. Suppose that you need information about the Bash **license**[^225].
    You can find this information in the Bash documentation. The following `grep`
    utility call does it:


    ```

    grep -R "GNU" /usr/share/doc/bash

    ```


    Another solution is to search license information on the `info` help page. The
    pipeline allows you to connect the output of one program with the input of another
    one. If we apply the pipeline, we can call the `grep` utility to process the `info`
    page. The following command does it:


    ```

    info bash | grep -n "GNU"

    ```'
