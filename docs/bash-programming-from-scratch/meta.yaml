  md: '**Sublime Text**[^242] is a proprietary **cross-platform**[^243] source code
    editor. Cross-platform means that the program runs on several OSes and hardware
    configurations. You can use Sublime Text for free without activation or buying
    a license. Download it on the [official website](https://www.sublimetext.com/)[^244].


    *Visual Studio Code*[^245] is a free cross-platform source code editor from Microsoft.
    It is open-source software. It means that the program is available for free and
    without a license. Download the editor on the [official website](https://code.visualstudio.com/)[^246].


    All three editors have the following features for working with source code:


    +   - [Syntax highlighting](https://en.wikipedia.org/wiki/Syntax_highlighting)[^247].

    - [Auto-complete](https://en.wikipedia.org/wiki/Autocomplete)[^248].

    - Support of commonly used [character encodings](https://en.wikipedia.org/wiki/Character_encoding)[^249].


    It is possible to edit the source code without these features. But they speed
    up your work, make it easier to edit the program and find bugs in it. They also
    help you to get used to the Bash syntax.


    # Launching the Editor


    You can launch the source code editor through the graphical interface of the OS.
    In the case of Windows, do it via the Start menu or the icon on the desktop.


    There is another possibility. You can launch the editor from the command-line
    interface. This approach is more convenient in some cases. For example, when the
    Bash command returns a filename, you can quickly open it via command-line.


    There are three ways to run the application in Bash:


    +   1. By absolute path.

    2. By relative path.

    3. By executable file name.


    The last approach is the fastest and most commonly used. If you want to apply
    it, you should add the program''s installation path to the `PATH` variable.


    Let''s consider how to run the Notepad++ editor by the executable name. The editor
    has the following installation path by default:'
