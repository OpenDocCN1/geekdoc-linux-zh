- img_proc: false
  md: "```\nread -r contact < contacts.txt\n```\n\nThis command writes the \"Alice=alice@gmail.com\"\
    \ string into the contact variable.\n\nWe can write the name and contact information\
    \ into two different variables. Let's define the equal sign as a delimiter to\
    \ do that. Then our read command looks like this:\n\n```\nIFS=$'=' read -r name\
    \ contact < contacts.txt\n```\n\nNow the name variable gets the \"Alice\" name.\
    \ The e-mail address comes into the contact variable. Let's try the following\
    \ while loop for reading the entire contacts.txt file:\n\n```\nwhile IFS=$'='\
    \ read -r name contact < \"contacts.txt\"\ndo\n  echo \"$name = $contact\"\ndone\n\
    ```\n\nUnfortunately, it does not work. Here we got an infinite loop accidentally.\
    \ It happens because the read command always reads only the first line of the\
    \ file. Then the command returns the zero exit status. The zero status leads to\
    \ the loop body execution. It happens over and over again.\n\nWe should force\
    \ the while loop to pass through all lines of the file. The following form of\
    \ the loop does it:\n\n```\nwhile CONDITION\ndo\n  ACTION\ndone < FILE\n```\n\n\
    You can handle the input from the keyboard this way. Specify the /dev/tty file\
    \ in this case. The loop will read keystrokes until you press Ctrl+D.\n\nHere\
    \ is the right while loop to read the contacts.txt file:\n\n```\nwhile IFS=$'='\
    \ read -r name contact\ndo\n  echo \"$name = $contact\"\ndone < \"contacts.txt\"\
    \n```\n\nThis loop prints the entire contents of the contact file.\n\nThere is\
    \ the last step left to finish our task. We should write the name and contact\
    \ variables to the array on each iteration. The name variable is the key and contact\
    \ is the value.\n\nListing 3-22 shows the final version of the script for reading\
    \ the contacts from the file."
