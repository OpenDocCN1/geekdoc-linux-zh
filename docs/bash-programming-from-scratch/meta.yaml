  md: "# Listing 3-16. The wrapper script for the archiving utilities\n\n```\n#!/bin/bash\n\
    \nutility=\"$1\"\n\ncase \"$utility\" in\n  \"-b\"|\"--bsdtar\")\n    bsdtar \"\
