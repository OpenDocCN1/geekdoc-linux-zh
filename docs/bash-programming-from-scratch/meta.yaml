- img_proc: false
  md: '```

    find ~/photo -type d -path */2019/* -o -path */2020/* -print0 | xargs -0 -I% bsdtar
    --strip-components=3 -cjf %.tar.bz2 %

    ```


    # Exercise 2-8. Logical operators


    Let''s implement the algorithm step by step. The first action is to copy the README
    file to the user''s home directory. The following command does it:


    ```

    cp /usr/share/doc/bash/README ~

    ```


    Use the `&&` operator and the `echo` command to print the command''s result into
    the log file. The command became like this:


    ```

    cp /usr/share/doc/bash/README ~ && echo "cp - OK" > result.log

    ```


    Call the `bsdtar` or `tar` utility to archive a file. Here is an example:


    ```

    bsdtar -cjf ~/README.tar.bz2 ~/README

    ```


    We can print the result of archiving operation using the `echo` command again:


    ```

    bsdtar -cjf ~/README.tar.bz2 ~/README && echo "bsdtar - OK" >> result.log

    ```


    In this case, the echo command appends a line to the end of the existing log file.


    Let''s combine the `cp` and `bsdtar` calls into one command. We should call the
    `bsdtar` utility only if the `README` file has been successfully copied. To achieve
    this dependency, we put the `&&` operator between the commands. We get the following
    command:


    ```

    cp /usr/share/doc/bash/README ~ && echo "cp - OK" > result.log && bsdtar -cjf
    ~/README.tar.bz2 ~/README && echo "bsdtar - OK" >> result.log

    ```'
