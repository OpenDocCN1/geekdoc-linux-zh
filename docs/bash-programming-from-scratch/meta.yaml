    of the CPU.


    These parameters vary for devices on each level of the memory hierarchy. Table
    1-3 shows the ratio of parameters for modern storage devices.


    **Table 1-3. Memory levels**


    | Level | Memory | Capacity | Access speed | Access time | Cost |

    |-------|--------|----------|--------------|-------------|------|

    | 1 | [CPU registers](https://en.wikipedia.org/wiki/Processor_register) | up to
    1000 bytes | - | 1 tick | - |

    | 2 | [CPU cache](https://en.wikipedia.org/wiki/CPU_cache) | from one KB to several
    MB | from 700 to 100 GBps | from 2 to 100 cycles | - |

    | 3 | RAM | dozens of GB | 10 GBps | up to 1000 clock cycles | $10⁻⁹/byte |

    | 4 | Disk drive ([hard drive](https://en.wikipedia.org/wiki/Hard_disk_drive)
