    to serve the network. You need them, for example, to check if some computer is
    available.


    The ping utility takes one mandatory input parameter. It is [URL](https://en.wikipedia.org/wiki/URL)
    or [IP address](https://en.wikipedia.org/wiki/IP_address) of the target host.
    A host is any computer or device connected to the network.


    Here is the command to call the ping utility:


    ```

    ping google.com

    ```


    We have specified the Google server as the target host. The utility sends ICMP
    messages to it. The server replies to each of them. The output of the utility
    looks like this:


    ```

    PING google.com (172.217.21.238) 56(84) bytes of data.

    64 bytes from fra16s13-in-f14.1e100.net (172.217.21.238): icmp_seq=1 ttl=51 time=17.8
    ms

    64 bytes from fra16s13-in-f14.1e100.net (172.217.21.238): icmp_seq=2 ttl=51 time=18.5
    ms

    ```


    You see information about each ICMP message sent by the utility. The "time" field
    means the delay between sending the request and receiving the server''s response.


    The utility runs in an infinite loop by default. You can stop it by pressing Ctrl+C.


    You do not need to send several requests to check the availability of a server.
    It is sufficient to send a single ICMP message instead. The `-c` option of the
    `ping` utility specifies the number of messages to send. Here is an example of
    how to use it:


    ```

    ping -c 1 google.com

    ```'
