    \ nicht gefunden:\"\n      ;;\n    2)\n      echo \"Berechtigung zum Lesen der\
    \ Datei verweigert:\"\n      ;;\n  esac\n}\n```\n\nNow we have to choose which\
    \ `code_to_error` function to call from `print_error`. We can check the regional\
    \ settings to make the right choice. The environment variable `LANG` stores these\
    \ settings. If the variable's value matches the \"de_DE\" pattern, call the function\
