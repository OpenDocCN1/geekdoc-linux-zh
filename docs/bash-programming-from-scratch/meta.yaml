    alphabet characters in upper and lower case, numbers, punctuation marks and mathematical
    operations.


    Six-bits encodings were insufficient for representing control and box-drawing
    characters. Therefore, these encodings were extended to seven bits in the early
    1960s. The [ASCII encoding](https://en.wikipedia.org/wiki/ASCII) appeared at that
    moment. It became the standard for encoding characters. ASCII defines characters
    for codes from 0 to 127. The maximum seven-bit number 127 limits this range.


    Then IBM released the computer [IBM System/360](https://en.wikipedia.org/wiki/IBM_System/360)
