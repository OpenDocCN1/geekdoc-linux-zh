    \      echo \"Der Datei wurde nicht gefunden:\"\n      ;;\n    2)\n      echo\
    \ \"Berechtigung zum Lesen der Datei verweigert:\"\n      ;;\n  esac\n}\n\ncode_to_error_en()\n\
    {\n  case $1 in\n    1)\n      echo \"File not found:\"\n      ;;\n    2)\n  \
