    **Synchronous**[^477] means events or actions that occur in the main program flow.


    # ## T


    **Tilde expansion**[^478] (tilde expansion) is the Bash mechanism that replaces
    the ~ character by the user''s home directory. The shell takes the path to the
    directory from the `HOME` variable.


    **Time-sharing**[^479] is the approach when several users utilize computer resources
    simultaneously. It is achieved by multitasking and multiprogramming.


    # ## U


    **Unix environment**[^480] is another name for a POSIX environment.


    **Utility software**[^481] is a special program for managing the OS or hardware.


    # ## V


    **Variable**[^482] is an area of memory that can be accessed by its name.

    There is another meaning of this term for Bash. A variable is a parameter that
    is accessible by its name. The user or the interpreter defines variables.

    Here is an example of the variable declaration:'
