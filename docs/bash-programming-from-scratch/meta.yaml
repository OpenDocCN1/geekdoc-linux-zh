    Table 3-11 raises questions. The operations there are harder to remember than
    the usual number comparisons: <, >, and =. Why aren''t comparison signs used in
    the [[ operator? To answer this question, let''s look at the operator''s history.


    The [[ operator came into Bash to replace its obsolete test analog. The utility
    has implemented the test command in the first version of the Bourne shell in 1979.
    This command becomes the built-in starting with the System III shell version in
    1981. But this change did not affect the test syntax. The reason for that is backward
    compatibility. Software developers have written a lot of shell code by 1981. This
    code has used the old syntax. Therefore, the new System III shell version had
    to support it.


    Let''s take a look at the syntax of the test operator. When it was a utility,
    the format of its input parameters had to follow Bourne shell rules. For example,
    here is a typical test call to compare the var variable with the number five:


    ```

    test "$var" -eq 5

    ```


    This command does not raise any questions. Here we pass three parameters to the
    test utility:


    +   1. The value of the var variable.

    2. The -eq option.

    3. The number 5.


    We can use this call in the `if` condition this way:'
  merge: -1
  pgno: 186
- img_proc: false
  md: "```\nif test \"$var\" -eq 5\nthen\n  echo \"The variable equals 5\"\nfi\n```\n\
    \nThe Bourne shell introduces the [ synonym for the test operator. The only difference\
    \ between them is the presence of the closing parenthesis ]. The test operator\
    \ does not need it but the synonym does.\n\nUsing the [ synonym, we rewrite the\
    \ if condition this way:\n\n```\nif [ \"$var\" -eq 5 ]\nthen\n  echo \"The variable\
    \ equals 5\"\nfi\n```\n\nThe synonym [ improves readability of the code. That\
    \ was an idea behind it. Thanks to the synonym, the if statement in Bourne shell\
    \ looks the same as in other programming languages (e.g., C). The problem is that\
    \ the [ and test operators are equivalent. It is easy to lose sight of this fact.\
    \ Mostly it happens when you have experience in other languages. This mismatch\
    \ between expected and real behavior leads to errors.\n\nFor example, programmers\
    \ often forget the space between the bracket [ and the following character. This\
    \ way, they get a condition like this:\n\n```\nif [\"$var\" -eq 5]\nthen\n  echo\
    \ \"The variable equals 5\"\nfi\n```\n\nReplace the bracket [ with the test call\
    \ in the condition. Then the error becomes obvious:\n\n```\nif test\"$var\" -eq\
    \ 5\nthen\n  echo \"The variable equals 5\"\nfi\n```"
  merge: -1
  pgno: 187
- img_proc: false
  md: "```\ntest \"$var\" > 5\n```\n\nAs you remember, the > symbol is a short form\
    \ of the redirect operator 1>. Thus, our test call does the following steps:\n\
    \n+   1. Calls the built-in test command and pass the var variable to it.\n2.\
    \ Redirects the test output to a file named 5 in the current directory.\n\nWe\
    \ expect another behavior. Such an error is easy to make and hard to detect. To\
    \ prevent it, shell developers introduced the two-letter comparison operations.\
    \ The Bash operator [[ inherited these operations. It was done for backward compatibility.\n\
    \nImagine that the [[ operator replaces two-letter operations with comparison\
    \ signs. Then you have the legacy code written on Bourne shell. You want to port\
    \ it on Bash. There is the following `if` statement in the legacy code:\n\n```\n\
    if [ \"$var1\" -gt 5 -o 4 -lt \"$var2\" ]\nthen\n  echo \"The var1 variable is\
    \ greater than 5 or var2 is less than 4\"\nfi\n```\n\nHere you should replace\
    \ the -gt operation to > and -lt to <. It is easy to make a mistake while doing\
    \ that. Putting an extra parenthesis at the beginning and end of an expression\
