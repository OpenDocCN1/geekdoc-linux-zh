    However, our current result is not good enough. Imagine that the backup command
    contains 100 actions. If an error occurs at the 50th action, all the remaining
    operations print their failed results into the log file. Such output prevents
    you from finding the problem. The best solution here is to terminate the command
    after the first error. To do that, we can group calls of utilities and their output
    with parentheses. Here is the result:


    ```

    (B && O1 || ! F1) && (C && O2 || F2)

    ```


    Let''s check what happens if the "B" operand is false. Then Bash executes the
    "F1" action. The negation inverts "F1" result. Therefore, the entire left side
    of the expression equals "false". Here is the left side:


    ```

    (B && O1 || ! F1)

    ```


    Then short-circuit evaluation happens. Because of it, Bash does not calculate
    the right operand of the logical AND. It means that the shell skips all actions
    on the right side of the expression. Here is the right side:


    ```

    (C && O2 || F2)

    ```


    It is the behavior we wanted.


    We can add one more improvement. The "F2" operand should be inverted. Then the
    whole expression equals "false" if "C" is "false". It means that the backup command
    fails if the `cp` utility fails. It sounds reasonable. Also, you would need such
    behavior for integrating the backup command with other commands.


