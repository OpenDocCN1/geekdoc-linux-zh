  md: "```\n    esac\n}\n\nprint_error()\n{\n  if [[ \"$LANG\" == de_DE* ]]\n  then\n\
    \    echo \"$(code_to_error_de $1) $2\" >> debug.log\n  else\n    echo \"$(code_to_error_en\
    \ $1) $2\" >> debug.log\n  fi\n}\n\nprint_error 1 \"readme.txt\"\n```\n\nYou can\
    \ replace the `if` statement in the `print_error` function with `case`. For example,\
    \ do it like this:\n\n```\nprint_error()\n{\n  case $LANG in\n    de_DE*)\n  \
    \    echo \"$(code_to_error_de $1) $2\" >> debug.log\n      ;;\n    en_US*)\n\
    \      echo \"$(code_to_error_en $1) $2\" >> debug.log\n      ;;\n    *)\n   \
    \   echo \"$(code_to_error_en $1) $2\" >> debug.log\n      ;;\n  esac\n}\n```\n\
    \nThe `case` statement is convenient if you need to support more than two languages.\n\
    \nThere is code duplication in the `print_error` function. The same `echo` command\
    \ is called in each block of the `case` statement. The only difference between\
    \ the blocks is the name of the function for converting the error code into text.\
    \ We can introduce the `func` variable to get rid of the code duplication. The\
    \ variable will store the function name. Use the variable this way:"
