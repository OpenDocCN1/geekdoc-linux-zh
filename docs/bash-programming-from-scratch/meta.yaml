    **Compiler**[^414] is a program for translating source code from a programming
    language to the machine code.


    **Computer program**[^415] is a set of instructions that a computer can execute.
    Each program solves an applied task.


    **Conditional statement**[^416] is a construct of a programming language. It executes
    a block of commands depending on the result of the Boolean expression.


    **Control character**[^417] is a separate character in the control sequence.


    **Control flow**[^418] is the order in which the program executes its instructions
    and functions.


    # D


    # E


    **Endianness**[^419] is the byte order the computer uses to store numbers in memory.
    The CPU defines the supported endianness. There are two commonly used options
    today: big-endian and little-endian. Some CPUs support both (bi-endian). Here
    is an example of storing a four-byte number `0x0A0B0C0D` for different orders:


    ```

    0A 0B 0C 0D   big-endian

    0D 0C 0B 0A   little-endian

    ```


    **Environment variables**[^420] is an unordered set of variables that the child
    process copies from the parent one. The `env` utility changes environment variables
    at the program startup. If you call the utility without parameters, it prints
    all variables declared in the current shell.


    **Error-prone**[^421] (error-prone) is a definition of failed programming techniques
    and solutions. These solutions work correctly in particular cases but cause errors
    with certain input data or conditions. An example of an error-prone solution is
    handling the `ls` utility output in the pipeline:


    ```

    ls | grep "test"

    ```


