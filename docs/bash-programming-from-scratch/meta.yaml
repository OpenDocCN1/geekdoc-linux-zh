    The `mkdir` utility creates a new directory. Specify its target path in the first
    parameter of the command. Here is an example `mkdir` call for creating the `docs`
    directory:


    ```

    mkdir ~/docs

    ```


    We specified the absolute path to the `docs` directory. You can pass the relative
    path instead. There are two steps to take it:


    +   1. Navigate the home directory.

    2. Call the `mkdir` utility here.


    Here are the corresponding commands:


    ```

    cd ~

    mkdir docs

    ```


    The utility has an option `-p`. It creates the nested directories. Here is an
    example of when to use it. Suppose you want to move the documents into the `~/docs/reports/2019`
    path. However, the `docs` and `reports` directories do not exist yet. If you use
    `mkdir` in the default mode, you should call it three times to create each of
    the nested directories. Another option is to call `mkdir` once with the `-p` option
    like this:


    ```

    mkdir -p ~/docs/reports/2019

    ```


    This command succeeds even if the `docs` and `reports` directories already exist.
    It creates only the missing `2019` directory in this case.


    # rm


    The `rm` utility deletes files and directories. Specify the object to delete by
    its absolute or relative path. Here are examples of `rm` calls:


    ```

    rm report.txt

    rm ~/docs/reports/2019/report.txt

    ```'
