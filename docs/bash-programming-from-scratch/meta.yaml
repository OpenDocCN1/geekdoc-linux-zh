    # Associative Arrays


    We have considered the indexed arrays. Their elements are strings. Each element
    has an index that is a positive integer. The indexed array gives you a string
    by its index.


    The developers introduced associative arrays in the 4th version of Bash. The elements''
    indexes are not numbers but strings in such arrays. This kind of string-index
    is called key. The associative array gives you a string-value by its string-index.
    When is this feature useful?


    Here is an example. Suppose we need a script that stores the list of contacts.
    The script adds a person''s name, email or phone number to the list. We can omit
    the person''s last name for simplicity. When you need these data back, the script
