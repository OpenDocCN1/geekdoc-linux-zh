  md: '# Glossary


    # A


    **Abstraction**[^387] is a software module, application, or library that replicates
    the basic properties of a real object. Abstractions help manage the complexity
    of software systems. They hide irrelevant details. Abstractions allow the same
    algorithm to handle different objects.


    **Algorithm**[^388] is a finite sequence of instructions understandable to the
    executor. The goal of an algorithm is to calculate something or solve a task.


    **Alias**[^389] is a built-in Bash command for shortening long strings. It is
    used when the interpreter works in shell mode.


    **Application programming interface**[^390] (API) is a set of agreements on interaction
    components of the information system. The agreements answer the following questions:


    +   - What function the called component performs?

    - What data does the function need on the input?

    - What data does the function return on the output?


    **Argument**[^391] is a word or string that the program receives via the command-line
    interface. Here is an example of arguments for the grep utility:


    ```

    grep "GNU" README.txt

    ```


    **Arithmetic expansion**[^392] calculates an arithmetic expression and substitutes
    its result into the Bash command or statement. Here is an example of the expansion:


    ```

    echo $((4+3))

    ```


    **Array**[^393] is a data structure consisting of a set of elements. The sequence
    number or index determines the position of each element. The array elements are
    placed one by one in computer memory.


    **ASCII**[^394] is an eight-bit character encoding standard. It includes the following
    characters:'
  merge: -1
  pgno: 283
- img_proc: false
  md: '+   - decimal digits

    - Latin alphabet

    - national alphabet

    - punctuation marks

    - control characters


    **Asynchrony**[^395] means events that occur independently of the main program
    flow. Asynchrony also refers to methods for processing such events.


    # B


    **Background**[^396] is a process execution mode in Bash. When activated, the
    process identifier does not belong to the **identifier group**[^397] of the terminal.
    Also, the executed process does not handle keyboard interrupts.


    **Bash**[^398] (Bourne again shell) is a command-line interpreter developed by
    Brian Fox. Bash has replaced the Bourne shell in Linux distributions and some
    proprietary Unix systems. Bash is compatible with the POSIX standard. However,
    the standard does not include some of the interpreter''s features.


    **Bash script**[^399] is a text file containing interpreter commands. Bash executes
    scripts in non-interactive mode.


    **Best practices**[^400] are recommended approaches for using a programming language
    or technology. An example of best practice for Bash is enclosing strings in double-quotes
    to avoid word splitting.


    **Bottleneck**[^401] is a component or resource of a computer system that limits
    its performance or throughput.


    **Boolean expression**[^402] is a programming language construct. When calculated,
    It results in either the "true" or "false" value.


    **Bourne shell**[^403] is a command-line interpreter developed by Stephen Bourne.
    It replaced the original [Ken Thompson''s interpreter](#)[^404] in [Unix version
    7](#)[^405]. The [POSIX standard](#)[^406] contains all features of the Bourne
    shell. But the shell misses some features from the standard.'
