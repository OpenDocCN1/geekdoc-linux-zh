  md: 'Let''s consider how the compiler works step by step. Suppose that you have
    written the program. You saved its source code to a file on the hard disk. Then
    you run a compiler that fits the language you have used. Each programming language
    has the corresponding compiler or interpreter. The compiler reads your file, processes
    it and writes the resulting machine code in the executable file on a disk. Now
    you have two files: one with source code and one with machine code. Every time
    you change the source code file, you should generate the new executable file.
    You can run the executable file to launch your program.


    Figure 1-15 shows how the compiler processes a program written in C and C++ languages.


    ![](bbox=[0.088, 0.289, 0.91, 0.516])


    The compilation process consists of two steps. The compiler does the first step.
    The second step is called **linking**. The special program called [linker](https://en.wikipedia.org/wiki/Linker_(computing))
    performs it.


    The compiler produces intermediate **object files**. The linker takes them and
    converts them to one executable file.


    Why do you need two steps for compiling the source code? In theory, you can combine
    the compiler and linker into a single application. However, such a solution has
    several problems.


    The limited RAM size causes the first problem. There is a common practice to split
    source code into several files. Each file matches a separate part of the program
    that solves the specific task. This way, you simplify your work with the source
    code. The compiler processes these files separately. It produces an object file
    for each source code file. They store the intermediate results of compilation.
    If you combine the compiler and linker into one application, there is no chance
    to save the intermediate results to the disk. It means you should compile the
    whole program at once. If you deal with a big program, the compilation process
    consumes all your RAM and crashes.


    The second problem of the compiler-linker application is resolving **dependencies**.
    There are blocks of commands that call each other in the source code. Such references
    are called dependencies. Tracking them is the linker task. However, if you combine
    compiler and linker, you need extra passes through the whole program source code
    for resolving dependencies. The compiler needs much more'
