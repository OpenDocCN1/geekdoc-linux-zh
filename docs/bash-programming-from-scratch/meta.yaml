  md: '# Exercise 3-5. The [[ operator


    Let''s compare the contents of the two directories. The result of the comparison
    is a list of files that are different.


    First, we have to go through all the files in each directory. The `find` utility
    does this task. Here is a command to search files in the `dir1` directory:


    ```

    find dir1 -type f

    ```


    The command''s output can look like this:


    ```

    dir1/test3.txt

    dir1/test1.txt

    dir1/test2.txt

    ```


    We got a list of files in the `dir1` directory. We should check that each of them
    presents in the `dir2` directory. Add the following `-exec` action for this check:


    ```

    cd dir1

    find . -type f -exec test -e ../dir2/{} \;

    ```


    Here we use the `test` command instead of the `[[` operator. The reason is the
    built-in interpreter of the `find` utility can not handle this operator correctly.
    This is one of the exceptions when `[[` must be replaced by the `test` command.
    In general, prefer the `[[` operator.


    If the `dir2` directory does not contain some file, let''s print its name. We
    need two things for doing that. The first one is inverting the `test` command''s
    result. Then we should add the second `-exec` action with the `echo` command call.
    Place the logical AND between these two actions. This way, we got the following
    command:


    ```

    cd dir1

    find . -type f -exec test ! -e ../dir2/{} \; -a -exec echo {} \;

    ```


    We found files of the `dir1` directory that miss in `dir2`. Now we should do vice
    versa. The similar `find` call can print `dir2` files that miss in `dir1`.


    Listing 5-3 shows the complete `dir-diff.sh` script for directory comparison.'
  merge: -1
  pgno: 304
