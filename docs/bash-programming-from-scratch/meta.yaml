  md: '# # Finalwords


    Here we finish our introduction to Bash. We have covered the basics of the language
    only. This book leaves many topics out of the scope. They are required for advanced
    Bash development. Most probably, you would not need them for daily work with a
    computer.


    These advanced topics can be interesting for you if you want to go deeper in Bash:


    +   - Manipulating Strings[^365]

    - Regular Expressions[^366]

    - The sed stream editor[^367]

    - The awk text processing language[^368]


    These topics are important. They are material for advanced study. You can skip
    them if you are using Bash for simple tasks and basic automation. Learn these
    topics if you are going to write complex applications in Bash.


    Perhaps you enjoyed programming. You found it useful. What to do next after reading
    this book?


    First of all, let''s admit that Bash is not a general-purpose programming language.
    This term refers to languages for developing applications in various domains[^369].
    Such languages do not contain constructs that are suitable for one domain only
    and useless in another.


    Bash is the domain-specific language[^370]. Does that mean it is useless? No,
    it does not. Bash is a powerful auxiliary tool for each software developer. Today
    it is used for integrating large projects, testing, building software and automating
    routine tasks. You would not find a commercial project written in Bash only. This
    language copes well with the tasks for which it was created. But it is inferior
    to modern general-purpose languages in many application domains.


    Nobody creates a programming language just for fun. Its author faced some applied
    tasks. The languages existing at that time were not suitable to solve them. Then
    this developer wrote the new language that is focused on specific tasks. Therefore,
    modern general-purpose languages have advantages in a few domains only. No language
    fits any type of task perfectly. This leads that the applied domain dictates you
    the language for software development.'
  merge: -1
