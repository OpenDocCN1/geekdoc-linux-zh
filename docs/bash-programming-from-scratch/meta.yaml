    for searching for a contact. The script should traverse over all array elements.
    It compares each element with the person''s name that you are looking for. The
    script prints the corresponding contacts if it finds the person.


    An associative array makes searching for contacts faster. The script should not
    pass through all array elements in this case. Instead, it gives the key to the
    array and gets the corresponding value back.


