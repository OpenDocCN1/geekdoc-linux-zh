- img_proc: false
  md: '**Table 3-8. String comparisons in the [[ operator**


    | Operation | Description | Example |

    | --- | --- | --- |

    | -v | The variable is set to any value. | `[[ -v var ]] && echo "The string is
    set"` |

    | = or == | Search the pattern on the right side in the string on the left side.
    Put the pattern without quotes here. | `[[ "$filename" = READ* ]] && echo "The
    filename starts with "READ""` |

    | != | Check that the pattern on the right side does not occur in the string on
    the left side. Put the pattern without quotes here. | `[[ "$filename" != READ*
    ]] && echo "The filename does not start with "READ""` |

    | =~ | Search the [regular expression](https://mywiki.wooledge.org/RegularExpression)
    on the right side in the string on the left side. | `[[ "$filename" =~ ^READ.*
    ]] && echo "The filename starts with "READ""` |


    You can use the logical operations AND, OR and NOT in the [[ operator. They combine
    several expressions into a single condition. Table 3-9 gives examples of such
    conditions.


    **Table 3-9. Logical operations in the [[ operator**


    | Operation | Description | Example |

    | --- | --- | --- |

    | && | Logical AND. | `[[ -n "$var" && "$var" < "abc" ]] && echo "The string is
    not empty and it is smaller than "abc""` |

    | \|\| | Logical OR. | `[[ "abc" < "$var" \|\| -z "$var" ]] && echo "The string
    is larger than "abc" or it is empty"` |

    | ! | Logical NOT. | `[[ ! "abc" < "$var" ]] && echo "The string is not larger
    than "abc""` |


    You can group expressions using parentheses in the [[ operator. Here is an example:


    ```

    [[ ( -n "$var" && "$var" < "abc") \|\| -z "$var" ]] && echo "The string is not
    empty and less than \abc\ or the string is empty"

    ```


    Comparing the strings is one feature of the [[ operator. Also, it can check files
    and directories for various conditions. Table 3-10 shows operations for doing
    that.'
