    notepad++ test.txt &

    ```


    This command starts the Notepad++. The editor still prints error messages to the
    terminal window. But at the same time, you can type and execute commands there.


    There is an option to separate the terminal window and the running GUI application
    completely. Run the application in the background mode. Then call the `disown`
    Bash built-in with the `-a` option. Here is an example:


    ```

    notepad++ test.txt &

    disown -a

    ```


    Notepad++ stops printing its messages to the terminal after these commands. Also,
    if you close the terminal window, the editor continues its work.


    You can combine Notepad++ and `disown` calls into one command. Here is an example:


    ```

    notepad++ test.txt & disown -a

    ```


    The `-a` option of the `disown` command detaches all programs that work in the
    background. You can detach the specific application instead. There is the Bash
    environment variable called `$!`. It stores the [process identifier](https://en.wikipedia.org/wiki/Process_identifier)
    (PID) of the last launched application. PID is a unique number that OS assigns
    to each process. You can manipulate the process by this number. Also, you can
    pass the PID to the `disown` command for detaching the specific application. Here
    is an example of doing that:


    ```

    notepad++ test.txt & disown $!

    ```


    If you want to list all applications that work in the background, use the `jobs`
    Bash built-in. It has the `-l` for that. Here is an example:


    ```

    jobs -l

    ```


    The command shows the PIDs of all background processes you have launched in the
    current terminal window.


    # Why Do We Need Scripts?


    We learned how to write complex Bash commands using pipelines and logical operators.
    The pipeline combines several commands into one. You get a linear sequence algorithm
    this way. Logical operators add conditions to the algorithm. You get a complete
    program in the result.


    Why isn''t the shell enough for Bash programming? Bash scripts are programs that
    the hard drive stores. Let''s figure out why users need them.'
