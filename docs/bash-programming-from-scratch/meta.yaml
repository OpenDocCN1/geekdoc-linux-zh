    # Variable Content Type


    # Variable Types


    In compiled programming languages (such as C), it is common to use **static type
    system**[^278]. When using this system, you decide how to store the variable in
    memory. You should specify the variable type when declaring it. Then the compiler
    allocates the memory and chooses an appropriate format for this type of variable.


    Here is an example of how the static type system works. Suppose we declare a variable
    called `number`. We should specify its type in the declaration. We choose the
    unsigned integer type, which has a size of two bytes. Then the compiler allocates
    exactly two bytes of memory for this variable.


    When the application starts, we assign the 203 value to the variable. It is equal
    to `0xCB` in hexadecimal. Then the variable looks this way in the memory:


    `00 CB`


    A modern computer uses the binary form to store information in the memory. Here
    we use the hexadecimal format instead for clarity.'
  merge: -1
  pgno: 161
- img_proc: false
  md: 'One byte is enough to store the 203 value. But we force the compiler to reserve
    two bytes for that. The unused byte stays zero. No one can use it in the scope
    of the `number` variable. If the variable has the global scope, the byte is reserved
    and unused while the application works.


    Suppose that we assign the 14037 value to the variable. It is equal to `0x36D5`
    in hexadecimal. Then it looks like this in the memory:


    ```

    36 D5

    ```


    The CPU determines the byte order when storing data in the computer memory. This
    byte order is called [endianness](https://en.wikipedia.org/wiki/Endianness)^279^.
    It is **big-endian** in our example. The alternative order is **little-endian**.


    Now we want to store the value 107981 (`0x1A5CD`) in the variable. This number
    does not fit into two bytes. But the variable''s size is defined in the declaration.
    The compiler cannot extend it automatically afterward. Therefore, the 107981 value
    will be truncated to two bytes. It looks like this in the memory:


    ```

    A5 CD

    ```


    The first digit of the value has been discarded. If you read the `number` variable,
    you get 42445 (`0xA5CD`). It means that the original 107981 is lost. You cannot
    recover it anymore. This problem is called [integer overflow](https://en.wikipedia.org/wiki/Integer_overflow)^280^.


    Here is another example of the static type system. Suppose we want to store the
    username in a variable called `username`. We declare this variable of the string
    type. When doing that, we should specify the maximum length of the string. Let''s
    choose the length of the ten characters.


    Now we write the name "Alice" to the variable. If you use the C compiler, the
    string looks like this in memory:


    ```

    41 6C 69 63 65 00 00 00 00 00

    ```'
  merge: -1
  pgno: 162
- img_proc: false
  md: '**Dynamic type system** is an alternative to the static system. Here there
    is another way to choose how to store a variable in memory. This choice happens
    whenever you assign the new value to the variable. Together with the value, the
    variable gets new **metadata**. The metadata defines the variable type. They can
    change during the application work. Thus, the variable''s representation in memory
    changes too. Most interpreted programming languages use the dynamic type system
    (for example, Python).


    > Metadata is additional information about some object or data. The library catalog
    is an example of metadata. It has a card for each book. The card contains the
    author, title of the work, publisher, year of publication, and the number of pages.
    Thus, The card contains metadata about the book.


    Strictly speaking, Bash does not have the type system. It is not a language with
    the static or dynamic type system. Bash stores all **scalar variables** as strings
    in memory.


    The scalar variable stores data of **primitive type**. These data are the minimal
    building blocks to construct more complex **composite types**. The scalar variable
    is just a name for the memory address where its value is stored.


    Here is how Bash represents scalar variables in memory. There is the following
    declaration:


    ```

    declare -i number=42

    ```


    Bash stores the `number` variable in memory as the following string:


    ```

    34 32 00

    ```


    The language with the type system needs one byte to store this number. But Bash
    needs three bytes. The first two bytes store each character of the number: 4 and
    2. The third byte stores the null character.


    The Bourne Shell language has the scalar variables only. Bash introduces two new
    composite types: **indexed array** and **associative array**.


    The indexed array is a numbered set of strings. There each string corresponds
    to the sequence number. Bash stores such an array as **linked list** in memory.
    A linked list is a data structure that consists of nodes. Each node contains data
    and the memory address of the next node. Node data are strings in this case.'
  merge: -1
  pgno: 163
- img_proc: false
  md: 'The associative array is a more complicated thing. It is a set of elements.
    Each element consists of two strings. The first one is called the "key". The second
    is "value". When you want to access the array''s element, you should specify its
    key. It works the same as for the indexed array, where you should specify the
    element''s index. The keys are unique. It means that two elements with the same
    keys are not allowed. Bash stores associative array as [hash-table](#291) in memory.


    Why are Bash "arrays" called arrays? Actually, they are linked lists and hash
    tables. A real array is the data structure whose elements are stored in memory
    one after another. Each element has a sequential number called an **index** or
    identifier. Bash "arrays" do not store their elements sequentially in memory.
    Thus, they are not arrays by definition.


    Here is an example of how a real array stores its elements in memory. Suppose
    we have an array with numbers from five to nine. Each element takes one byte.
    Then the size of the array is five bytes. The array looks like this in memory:


    ![](bbox=[0.105, 0.37, 0.25, 0.4])


    The indexing of arrays'' elements starts with zero. It means that the first element
    has the 0 index. The second one has the 1 index and so on. In our example, the
    first element with the 0 index equals the number 5. The second element equals
    6. Elements follow each other in memory. Their indexes match the memory offset
    from the beginning of the array. Thus, the element with the 3 index has three
    bytes offset and equals the number 8.


    Let''s come back to the question about naming the Bash "arrays". Only the authors
    of the language can answer it. However, we can guess. The name "array" gives the
    user a hint on how to work with them. When the user has experience in another
    language, he knows how to operate with a regular array. This way, he can start
    using Bash "arrays" immediately. The user does not need knowledge on how Bash
    stores these "arrays" internally.


    # Attributes


    The Bash language does not have the type system. It stores all scalar variables
    in memory as strings. But Bash has composite types that are arrays. The Bash array
    is the combination of strings.


    When you declare the Bash variable, you should choose if it is scalar or composite.
    You can do that by specifying metadata for the variable. Such metadata is called
    **attributes** in Bash. The variable''s attributes also define its constancy and
    scope.


    The `declare` built-in command specifies the variable''s attributes. The command
    prints all local and environment variables when calling without parameters. The
    `set` command prints the same output.


    The `declare` command has the `-p` option. It adds variable attributes to the
    output.


    If you want information on a particular variable, pass its name to the `declare`
    command. Here is an example for the `PATH` variable:'
  merge: -1
  pgno: 164
- img_proc: false
  md: '```

    declare -p PATH

    ```


    The declare command also prints information about declared [subroutines](https://en.wikipedia.org/wiki/Subroutine).
    They are called **functions** in Bash. A function is a program fragment or an
    independent block of code that performs a certain task.


    Suppose you are interested in declarations of the function but not in variables.
    Then use the -f option of the declare command. It filters out variables from the
    output. The declare call looks the following in this case:


    ```

    declare -f

    ```


    You can specify the function name right after the -f option. Then the declare
    command prints information about this function only. Here is an example for the
    function quote:


    ```

    declare -f quote

    ```


    This command displays the declaration of the function.


    The quote function receives a string on the input. It encloses the string in single-quotes.
    If the string already contains the single-quotes, the function escapes them. You
    can call the function in the same way as a built-in Bash command. Here is an example:


    ```

    quote "this is a ''test'' string"

    ```


    The declare command without the -p option does not print the function declaration.
    It means that the following call shows nothing:


    ```

    declare quote

    ```


    The declare command shows information about already declared variables and functions.
    Also, the command sets attributes for new variables.


    Table 3-7 shows the frequently used options of the declare command.'
