    # Functions


    Bash is **procedural programming language**[^346]. Procedural languages allow
    you to divide a program into logical parts called **subroutine**[^347]. A subroutine
    is an independent block of code that solves a specific task. A program calls subroutines
    when it is necessary.


    Subroutines are called **functions** in modern programming languages. We have
    already met functions when considering the `declare` command. Now let''s study
    the structure and purposes of functions.


    # Programming Paradigms


    We should start with the terminology. It will help us to understand why functions
    have appeared and which tasks they solve.


    What is procedural programming? It is one of **paradigms**[^348] of software development.
    A paradigm is a set of ideas, methods and principles that define how to write
    programs.


    There are two dominant paradigms today. Most modern programming languages follow
    one of them. The paradigms are the following:


    [^346]: https://en.wikipedia.org/wiki/Procedural_programming

    [^347]: https://en.wikipedia.org/wiki/Subroutine

    [^348]: https://en.wikipedia.org/wiki/Programming_paradigm'
