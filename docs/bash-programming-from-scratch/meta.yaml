    `wc` utility counts the lines. It takes the filename as an input parameter. If
    you combine `cat` and `wc` calls, you get the following `find` command:


    ```

    find / -path "*/doc/bash/*" -name "*.html" -exec cat {} \; -exec wc -l {} \;

