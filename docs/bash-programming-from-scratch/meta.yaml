- img_proc: false
  md: "Listing 3-22. The script for managing the contacts\n\n```\n#!/bin/bash\n\n\
    declare -A array\n\nwhile IFS='=' read -r name contact\ndo\n  array[$name]=$contact\n\
    done < \"contacts.txt\"\n\necho \"${array[\"$1\"]}\"\n```\n\nThis script behaves\
    \ the same way as one in Listing 3-10.\n\n# ## For Statement\n\nThere is another\
    \ loop statement in Bash called `for`. Unlike `while`, use it when you know the\
    \ number of iterations in advance.\n\nThe `for` statement has two forms. The first\
    \ one processes words in a string sequentially. The second form applies an arithmetic\
    \ expression in the loop's condition.\n\n# ### The First Form of For\n\nLet's\
    \ start with the first form of the `for` statement. It looks like this in general:\n\
    \n```\nfor VARIABLE in STRING\ndo\n  ACTION\ndone\n```\n\nYou can write the same\
    \ construction in a single line like this:\n\n```\nfor VARIABLE in STRING; do\
    \ ACTION; done\n```\n\nThe ACTION in the `for` statement is a single command or\
    \ a block of commands. It is the same as in the `while` statement.\n\nBash performs\
    \ all expansions in the `for` condition before starting the first iteration of\
    \ the loop. What does it mean? Suppose you specified the command instead of a\
    \ `STRING`. Then Bash executes this command and replaces it with its output. Also,\
    \ you can specify a pattern instead of `STRING`. Then Bash expands it before starting\
    \ the loop."
  merge: -1
  pgno: 242
- img_proc: false
  md: "BASH splits the STRING into words when there are no commands or patterns left\
    \ in the for condition. It takes separators for splitting from the IFS variable.\n\
    \nThen Bash executes the first iteration of the loop. The first word of the STRING\
    \ is available via VARIABLE inside the loop body on the first iteration. Then\
    \ Bash writes the second word of the STRING to the VARIABLE and starts the second\
    \ iteration. It happens again and again until we pass all words of the STRING.\n\
    \nHere is an example of the for loop. We want to write a script to print words\
    \ in a string one by one. The script receives the string via the first parameter.\n\
    \nListing 3-23 shows the script.\n\n# Listing 3-23. The script for printing words\
    \ of a string\n\n```\n#!/bin/bash\n\nfor word in $1\ndo\n  echo \"$word\"\ndone\n\
    ```\n\nHere you should not enclose the position parameter $1 in quotes. Quotes\
    \ prevent word splitting, but we want it in this case. Otherwise, Bash passes\
    \ the whole string to the first iteration of the for loop. Then the loop finishes.\
    \ We do not want this behavior. The script should process each word of the string\
    \ separately.\n\nWhen you call the script, you should enclose the input string\
    \ in double-quotes. Then the whole string comes into the $1 parameter. Here is\
    \ an example of calling the script:\n\nThere is a way to get rid of the double-quotes\
    \ when calling the script. Replace the $1 parameter in the for condition with\
    \ $@. Then the loop statement becomes like this:\n\n```\nfor word in $@\ndo\n\
    \  echo \"$word\"\ndone\n```\n\nNow both following script calls work properly:\n\
    \n```\n./for-string.sh this is a string\n./for-string.sh \"this is a string\"\n\
    ```\n\nThe for loop condition has a short form. Use it when you want to pass through\
    \ all input parameters of the script. This short form looks like this:"
  merge: -1
  pgno: 243
- img_proc: false
  md: "```\nfor word\ndo\n  echo \"$word\"\ndone\n```\n\nIt does the same as the script\
    \ in Listing 3-23. We just dropped the \"in $@\" part in the condition. It did\
