  md: 'Calculating the remainder of the division is a complex but essential operation
    in programming. Let''s take a closer look at it. Suppose we have divided one integer
    number by another. A result is a fractional number. In this case, we say that
    the division produced a **remainder**<sup>320</sup>.


    For example, let''s divide 10 (the dividend) by 3 (the divisor). If we round the
    result, we get 3.3333 (the quotient). In this case, the remainder of the division
    is 1. To find it, we should multiply the divisor 3 by the integer part of the
    quotient 3 (the incomplete quotient). Then subtract the result from the dividend
    10. It gives us the remainder, which is equal to 1.


    Let''s write our calculations in formulas. We can introduce the following notation
    for that:


    +   - a is a dividend

    - b is a divisor

    - q is an incomplete quotient

    - r is a remainder


    Using the notation, we can write the formula for calculating the dividend:


    ```

    a = b * q + r

    ```


    Then we derive the formula for finding the remainder:


    ```

    r = a - b * q

    ```


    The choice of an incomplete quotient q raises questions. Sometimes several numbers
    fit this role. The restriction helps to choose the right one. The q quotient must
    be such that the absolute value of the r remainder is less than the b divisor.
    In other words, you should fulfill the following inequality:


    ```

    |r| < |b|

    ```


    The percent sign denotes the operation of finding the remainder in Bash. Some
    languages use the same symbol for the **modulo operation**<sup>321</sup>. These
    two operations **are not the same**<sup>322</sup>. They give the same results
    only when the signs of the dividend and the divisor match.


    For example, let''s calculate the remainder and modulo when dividing 19 by 12
    and -19 by -12. We get these results:'
  merge: -1
