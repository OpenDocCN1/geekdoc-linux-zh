  md: '+   - Run programs and system services.

    - Manage the file system.

    - Control peripherals and internal devices.

    - Access the kernel features.


    # Demand of the CLI


    Why would somebody learn the command-line interface (CLI) today? It appeared 40
    years ago for computers that are thousands of times slower than today. Then the
    graphical interface supplanted CLI on PCs and laptops. Everybody prefers to use
    GUI nowadays.


    The CLI seems to be outdated technology. However, this statement is wrong. It
    should be a reason why developers include Bash in all modern macOS and [Linux
    distributions](https://en.wikipedia.org/wiki/Linux_distribution)^{161}. Windows
    also has a command shell called [Cmd.exe](https://en.wikipedia.org/wiki/Cmd.exe)^{162}.
    Microsoft has replaced it with [PowerShell](https://en.wikipedia.org/wiki/PowerShell)^{163}
    in 2006. Just think about this fact. The developer of the most popular desktop
    OS has created a new command shell in the 2000s. All these points confirm that
    CLI is still in demand.


    What tasks does the shell perform in modern OSes? First of all, it is a tool for
    [system administration](https://en.wikipedia.org/wiki/System_administrator)^{164}.
    The OS consist of the kernel and software modules. These modules are libraries,
    services and system utilities. Most of the modules have settings and special modes
    of operation. You do not need them in your daily work. Therefore, you cannot access
    these settings via GUI in most cases.


    > The Bash shell has good integration with Linux and macOS. You can access most
    OS functions using Bash there. However, it does not work with Windows smoothly.
    Microsoft offers you their own PowerShell. We study Bash in this book for two
    reasons. First, it is compatible with the POSIX standard. Second, Bash is more
    common than PowerShell. You can use it on all modern OSes.


    If the OS fails, you need system utilities to recover it. They have a command-line
    interface because a GUI often is not available after the failure.


    Besides the administration tasks, you would need CLI when [connecting computers
    over a network](https://en.wikipedia.org/wiki/Remote_desktop_software)^{165}.
    There are GUI programs for such connection. The examples are TeamViewer and Remote
    Desktop. They require a stable and fast network connection for working well. If
    the connection is not reliable, these programs are slow and fail often. The command
    interface does not have such a limitation. The remote server receives your command
    even if the link is poor.'
