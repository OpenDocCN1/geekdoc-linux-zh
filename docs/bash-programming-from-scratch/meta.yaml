  md: "The case statement compares a string with a list of patterns. Each pattern\
    \ has a corresponding code block. When the string matches the pattern, Bash executes\
    \ the corresponding code block.\n\nEach case block consists of the following elements:\n\
    \n+   1. A pattern or a list of patterns separated by vertical bars.\n2. Right\
    \ parenthesis.\n3. A code block.\n4. Two semicolons. They mark the end of the\
    \ code block.\n\nBash checks patterns of the case blocks one by one. If the string\
    \ matches the first pattern, Bash executes its code block. Then it skips other\
    \ patterns. Instead, Bash executes the command that follows the case statement.\n\
    \nThe * pattern without quotes matches any string. It is usually placed at the\
    \ end of the list. The corresponding code block handles cases when none of the\
    \ patterns match the string. It usually means an error.\n\nAt first sight, it\
    \ may seem that the `if` and `case` statements are equivalent. They are not. They\
    \ allow you to achieve the same behavior.\n\nLet's compare the statements from\
    \ Listings 3-12 and 3-13. First, we write them in a general form. Here is the\
    \ result for the `if` statement:\n\n```\nif CONDITION_1\nthen\n  ACTION_1\nelif\
    \ CONDITION_2\nthen\n  ACTION_2\nelif CONDITION_3\nthen\n  ACTION_3\nelse\n  ACTION_4\n\
    fi\n```\n\nThe case statement looks like this:"
  merge: -1
  pgno: 191
- img_proc: false
  md: "```\ncase STRING in\n  PATTERN_1)\n    ACTION_1\n    ;;\n  PATTERN_2)\n   \
    \ ACTION_2\n    ;;\n  PATTERN_3)\n    ACTION_3\n    ;;\n  PATTERN_4)\n    ACTION_4\n\
    \    ;;\nesac\n```\n\nThe difference between the constructs is evident now. First,\
    \ `if` checks the results of Boolean expressions. The `case` statement compares\
    \ the string with the patterns. Therefore, it makes no sense to pass a Boolean\
    \ expression to the `case` condition. Doing that, you handle two cases only: when\
    \ the expression is \"true\" and \"false\". The `if` statement is more convenient\
    \ for such checking.\n\nThe second difference between `if` and `case` is the number\
    \ of conditions. Each branch of the `if` statement checks a separate Boolean expression.\
    \ In general, these expressions are independent of each other. In our example,\
    \ they check the same variable, but that is a particular case. The `case` statement\
    \ checks one string that you pass to it.\n\nThe `if` and `case` statements are\
    \ fundamentally different. They are not interchangeable. In each case, use the\
    \ statement depending on the nature of the check. The following questions will\
    \ help you to make the right choice:\n\n+   - How many conditions should you check?\
    \ Use `if` for checking several conditions.\n- Would it be enough to check one\
    \ string only? Use `case` when the answer is yes.\n- Do you need compound Boolean\
    \ expressions? Use `if` when the answer is yes.\n\nThere are two possible delimiters\
    \ between `case` blocks:\n\n+   1. Two semicolons `;;`.\n2. Semicolons and ampersand\
    \ `;&`.\n\nThe ampersand delimiter is allowed in Bash, but it is not part of the\
    \ POSIX standard. When Bash meets this delimiter, it executes the next block's\
    \ code without checking its pattern. It can be useful"
  merge: -1
