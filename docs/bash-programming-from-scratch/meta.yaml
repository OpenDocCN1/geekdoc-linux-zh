  md: 'Let''s look at how the find utility performs the -exec action. Some program
    performs this action. The built-in find interpreter runs it. The interpreter passes
    to the program whatever the find utility has found. Note that the Bash interpreter
    is not involved in the -exec call. Therefore, you cannot use the following Bash
    features in the call:


    +   - built-in Bash commands

    - functions

    - pipelines

    - stream redirection

    - conditional statements

    - loops


    Try to run the following command:


    ```

    find ~ -type f -exec echo {} \;

    ```


    The find utility calls the echo Bash built-in here. It works correctly. Why? Actually,
    find calls another utility with the same name echo as the Bash command. Unix environment
    provides several utilities that duplicate Bash built-ins. You can find them in
    the /bin system path. For example, there is the /bin/echo file there.


    Some tasks require the Bash features in the -exec action. There is a trick to
    access them in this case. Run the interpreter explicitly and pass a command to
    it. Here is an example:


    ```

    find ~ -type f -exec bash -c ''echo {}'' \;

    ```


    This command does the same as the previous one that calls the echo utility. It
    prints the results of the find search.


    You can apply the pipeline and redirect the find output to another command. In
    this case, you pass the text through the pipeline rather than filenames and directories.
    Here is an example of such passing:


    ```

