  md: '```

    19 % 12 = 19 - 12 * 1 = 7

    19 modulo 12 = 19 - 12 * 1 = 7


    -19 % -12 = -19 - (-12) * 1 = -7

    -19 modulo -12 = -19 - (-12) * 1 = -7

    ```


    Now consider cases when the signs of the dividend and the divisor differ. Here
    are the results:


    ```

    19 % -12 = 19 - (-12) * (-1) = 7

    19 modulo -12 = 19 - (-12) * (-2) = -5


    -19 % 12 = -19 - 12 * (-1) = -7

    -19 modulo 12 = -19 - 12 * (-2) = 5

    ```


    The reminder and the modulo are different for the same pairs of numbers.


    The same formula calculates the remainder and modulo. But the choice of the q
    incomplete quotient differs. For calculating the reminder, you get q this way:


    ```

    q = a / b

    ```


    You should round the result to the lowest absolute number[^323]. It means discarding
    all decimal places.


    Calculation of the incomplete quotient for finding the modulo depends on the signs
    of a and b. If the signs are the same, the formula for the quotient stays the
    same:


    ```

    q = a / b

    ```


    If the signs differ, here is another formula:


    ```

    q = (a / b) + 1

    ```


    In both cases, you should round the result to the lowest absolute number.


    When one speaks of the remainder of division r, he usually assumes that both the
    divisor a and the divisor b are positive. That is why reference books often mention
    the following condition for r:


