  md: '# Declaration Mechanism


    # User-Defined Variables


    The purpose of user variables is obvious from their name. The user declares them
    for his purposes. Such variables usually store intermediate results of the script,
    its state and frequently used constants.


    To declare the user-defined variable, specify its name, put an equal sign, and
    type its value.


    Here is an example. We declare a variable called `filename`. Its value equals
    the filename `README.txt`. The declaration of the variable looks like this:


    ```

    filename="README.txt".

    ```


    Spaces before and after the equal sign are not allowed. Other programming languages
    allow them, but Bash does not. It leads to an error when Bash handles the following
    declaration:


    ```

    filename = "README.txt"

    ```


    Bash misinterprets this line. It assumes that you call the command with the `filename`
    name. Then you pass there two parameters: `=` and `"README.txt"`.


    Only Latin characters, numbers and the underscore are allowed in variable names.
    The name must not start with a number. Letter case is important. It means that
    `filename` and `FILENAME` are two different variables.


    Suppose we have declared a variable `filename`. Then Bash allocates the memory
    area for that. It writes the `README.txt` string here. You can read this value
    back by specifying the variable name. But when you do that, Bash should understand
    your intention. If you put a dollar sign before the variable name, it would be
    a hint for Bash. Then it treats the word `filename` as the variable name.


    When you reference the variable in a command or script, it should look like this:


    ```

    $filename

    ```


    Bash handles words with a dollar sign in a special way. When it encounters such
    a word, it runs the **parameter expansion** mechanism. The mechanism replaces
    all occurrences of a variable name by its value. Here is the command for example:


    ```

    cp $filename ~

    ```


    After parameter expansion, the command looks like this:'
  merge: -1
