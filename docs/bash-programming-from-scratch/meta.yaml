  md: 'What is the && operator? It is a logical AND operation. Here its operands are
    Bash commands (actions) instead of Boolean expressions (conditions). Let''s have
    a look at how the logical operation works in this case.


    The POSIX standard requires each running program to provide [exit status](#233)
    when it finishes. The zero code means that the program completed successfully.
    Otherwise, the code takes a value from 1 to 255.


    When you apply a logical operator to a command, the operator handles its exit
    status. First, Bash executes the command. Then its exit status is used as the
    Boolean expression in the logical operator.


    Let''s go back to our example:


    ```

    cp -R ~/docs ~/docs-backup && echo "OK" > result.log

    ```


    Suppose the cp utility completes successfully. It returns the zero code in this
    case. The zero code matches the value "true" in Bash. Therefore, the left part
    of the && operator equals "true". This information is not enough to deduce the
    result of the whole expression. It can be "true" or "false" depending on the right
    operand. Then the && operator has to execute the echo command. It always succeeds
    and returns the zero code. Thus, the result of the && operator equals "true".


    It is not clear how do we use the result of the && operator in our example. The
    answer is we do not. Logical operators are needed to calculate Boolean expressions.
    But they are often used for their side effect in Bash. This side effect is a strict
    order of operands evaluation.


    Let''s consider the case when the cp utility finishes with an error in our example.
    Then it returns a non-zero exit status. It is equivalent to the "false" value
    for Bash. In this case, the && operator can already calculate the value of the
    whole Boolean expression. It does not need to calculate the right operand. Because
    If at least one operand of the logical AND is "false", the entire expression is
    "false". Thus, the exit status of the echo command is not required. Then the &&
    operator does not execute it. In this case, there is no "OK" output in the log
    file.


    Now you get the [short-circuit evaluation](#234). It means calculation only those
    operands that are sufficient to deduce the value of the whole Boolean expression.


    > Bash stores the exit status of the last executed command in the environment
    variable. Its name is the question mark. The echo command displays its value like
    this:


    ```

    echo $?

    ```


    We have done only the first part of our task. Now the command prints the "OK"
    line in the log file when copying succeeds. But we should handle the false case.
    The "Error" line should appear in the log file in this case. We can do it with
    the logical OR operator. It is called || in Bash.


    With the OR operator, our command looks like this:'
  merge: -1
  pgno: 120
- img_proc: false
  md: '```

    cp -R ~/docs ~/docs-backup && echo "OK" > result.log || echo "Error" > result.log

    ```


    This command implements the conditional algorithm that we need. If the cp utility
    finishes successfully, the command writes "OK" in the log file. Otherwise, it
    writes "Error". To understand how it works, let''s consider the priority of the
    operation first.


    First, we would make our command simpler for reading. Let''s denote all operands
    by Latin letters. The "A" letter matches the cp call. The "B" letter marks the
    first echo call with the "OK" line. The "C" letter is the second echo call. Then
    we can rewrite our command this way:


    ```

    A && B || C

    ```


    The && and || operators have the same priorities in Bash. The Boolean expression
    is calculated from the left to the right side. The operators are called [left-associative](https://en.wikipedia.org/wiki/Operator_associativity)
    in this case. Given this, we can rewrite our expression this way:


    ```

    (A && B) || C

    ```


    Adding parentheses does not change anything. First, Bash evaluates the expression
    (A && B). Then, it calculates the "C" operand if it is necessary.


    What happens if "A" equals "true"? The && operator calculates its right operand
    "B" in this case. It leads to printing the "OK" line to the log file. Next, Bash
    processes the || operator. The interpreter already knows the value of its left
    operand (A && B). It equals "true". The OR operator''s value equals "true" when
    at least one of its operands is "true". Therefore, the right operand''s value
    does not affect the expression result. Bash skips it. It leads that the "Error"
    line absents in the log file.


    If the "A" value is "false", the expression (A && B) equals "false" too. In this
    case, Bash skips the operand "B". It leads to the missing "OK" output in the log
    file. Then Bash handles the next || operator. The interpreter already knows that
    its left operand equals "false". Thus, it should evaluate the right operand for
    deducing the whole expression. It leads to the execution of the second echo command.
    Then the "Error" line comes to the log file.


    The principle of short-circuits evaluation is not obvious. You would need some
    time to figure it out. Please do your best for that. Every modern programming
    language supports Boolean expressions. Therefore, understanding the rules of their
    evaluation is essential.


    We already know how to combine Bash commands with pipelines and logical operators.
    There is a third way to do that. You can use a semicolon. When two commands have
    the semicolon in between, Bash executes them one by one without any conditions.
    You get the linear sequence algorithm in this case.'
  merge: -1
