  md: '**Table 3-10. Operations for checking files and directories in the `[[` operator**


    | Operation | Description | Example |

    |----------|-------------|---------|

    | -e | The file exists. | `[[ -e "$filename" ]] && echo "The $filename file exists"`
    |

    | -f | The specified object is a regular file. It is not a directory or [device
    file](https://en.wikipedia.org/wiki/Device_file)<sup>303</sup>. | `[[ -f "~/README.txt"
    ]] && echo "The README.txt is a regular file"` |

    | -d | The specified object is a directory. | `[[ -f "/usr/bin" ]] && echo "The
    /usr/bin is a directory"` |

    | -s | The file is not empty. | `[[ -s "$filename" ]] && echo "The $filename file
    is not empty"` |

    | -r | The specified file exists. The user who runs the script can read the file.
    | `[[ -r "$filename" ]] && echo "The $filename file exists. You can read it"`
    |

    | -w | The specified file exists. The user who runs the script can write into
    the file. | `[[ -w "$filename" ]] && echo "The $filename file exists. You can
    write into it"` |

    | -x | The specified file exists. The user who runs the script can execute the
    file. | `[[ -x "$filename" ]] && echo "The $filename file exists. You can execute
    it"` |

    | -N | The file exists. It was modified since you read it last time. | `[[ -N
    "$filename" ]] && echo "The $filename file exists. It was modified"` |

    | -nt | The file on the left side is newer than the file on the right side. Either
    the file on the left side exists and the file on the right side does not. | `[[
    "$file1" -nt "$file2" ]] && echo "The $file1 file is newer than $file2"` |

    | -ot | The file on the left side is older than the file on the right side. Either
    the file on the right side exists and the file on the left side does not. | `[[
    "$file1" -ot "$file2" ]] && echo "The $file1 file is older than $file2"` |

    | -ef | There are paths to the same file on the left and right sides. If your
    file system supports **hard links**, it can be the links to the same file on the
    left and right sides. | `[[ "$file1" -ef "$file2" ]] && echo "The $file1 and $file2
    files match"` |


