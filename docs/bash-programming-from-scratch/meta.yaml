    \ prints messages in English. Let's rename it to `code_to_error_en`. Then the\
    \ language of the messages will be clear from the function name.\n\nLet's add\
    \ a function `code_to_error_de` to the script. It prints the message in German\
    \ according to the received error code. The function looks like this:"
