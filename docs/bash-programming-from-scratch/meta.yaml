    Here is a logical OR for the operands (B && O1) and "F1". The "F1" operand always
    equals "true". Therefore, the whole expression is always "true".


    We can solve the problem by inverting the result of "F1". The logical NOT operator
    does that. This way, we get the following expression:


    ```

    B && O1 || ! F1 && C && O2 || F2

    ```


    Now, if the "B" operand fails, Bash evaluates "F1". It always equals false because
    of negation. Then Bash skips the "C" and "O2" command. It happens because there
    is a logical AND between them and "F1". The "F2" command is the next one that
    Bash performs. The shell needs its result because it has a logical OR in front
    of it.


    The following parentheses would make the expression clearer:


    ```

    (B && O1 || ! F1 && C && O2) || F2

    ```


    It is evident that Bash executes the "F2" action when the parenthesized expression
    equals "false". Otherwise, it cannot evaluate the value of the entire expression.


    This command writes the following output into the log file:'
