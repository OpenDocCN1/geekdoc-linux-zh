  md: "```\nfor (( EXPRESSION_1; EXPRESSION_2; EXPRESSION_3 )); do ACTION; done\n\
    ```\n\nBash executes the `for` loop with an arithmetic condition this way:\n\n\
    +   1. Bash calculates the EXPRESSION_1 once before the first iteration of the\
    \ loop.\n2. The loop continues as long as EXPRESSION_2 remains true. The loop\
    \ stops when it returns \"false\".\n3. Bash calculates the EXPRESSION_3 at the\
    \ end of each iteration.\n\nLet's replace the `seq` utility call with the arithmetic\
    \ expression in Listing 3-31. Listing 3-32 shows the result.\n\n# Listing 3-32.\
    \ The script for calculating a factorial\n\n```\n#!/bin/bash\n\nresult=1\n\nfor\
    \ (( i = 1; i <= $1; ++i ))\ndo\n  ((result *= i))\ndone\n\necho \"The factorial\
    \ of $1 is $result\"\n```\n\nThis script works faster. It uses Bash built-in commands\
    \ only. There is no need to create new processes here.\n\nThe `for` statement\
    \ in the script follows this algorithm:\n\n+   1. Declare the `i` variable before\
    \ the first iteration of the loop. Assign it integer 1. The variable is a loop\
    \ counter.\n2. Compare the loop counter with the input parameter `$1`.\n3. If\
    \ the counter is smaller than the `$1` parameter, do the loop iteration.\n4. If\
    \ the counter is greater than the parameter, stop the loop.\n5. Calculate the\
    \ arithmetic expression \"`result *= i`\" in the loop's body. It multiplies the\
    \ `result` variable by `i`.\n6. When the loop iteration is done, calculate the\
    \ \"`++i`\" expression of the `for` condition. It increments the `i` variable\
    \ by one.\n7. Go to the 2nd step of the algorithm."
