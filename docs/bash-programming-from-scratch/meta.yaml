    \nuntil ping -c 1 -W 1 google.com &> /dev/null\ndo\n  sleep 1\ndone\n\necho \"\
    The google.com server is available\"\n```\n\nThe scripts in Listing 3-18 and Listing\
    \ 3-19 behave the same.\n\nChoose the `while` or `until` statement depending on\
    \ the loop condition. Try to avoid negations in conditions. Negations make the\
    \ code harder to read.\n\n# Infinite Loop\n\nThe `while` statement fits well to\
    \ implement infinite loops[^341]. This kind of loop continues as long as the program\
    \ is running.\n\nYou can find infinite loops in system software that runs until\
    \ the computer is powered off. Examples are OS or microcontroller firmware. Computer\
    \ games and monitor programs for collecting statistics also use such loops."
