- img_proc: false
  md: 'Listing 3-10 shows the script for managing the list of contacts. The script
    stores contacts in the format of the Bash array declaration. It makes adding a
    new person to the list inconvenient. The user must know the Bash syntax. Otherwise,
    he can make a mistake when initializing an array element. It will break the script.


    We can solve the problem of editing the contacts list. Let''s put the list in
    a separate text file. Our script should read it at startup. This way, we separate
    data and code. It is a well-known and good practice in software development.


    Listing 3-21 shows a possible format of the file with contacts.


    Listing 3-21. The file with contacts `contacts.txt`


    ```

    Alice=alice@gmail.com

    Bob=(697) 955-5984

    Eve=(245) 317-0117

    Mallory=mallory@hotmail.com

    ```


    Let''s write a script to read this file. It is convenient to read the list of
    contacts directly into the associative array. This way, we keep the searching
    mechanism over the list as effective as before.


    When reading the file, we should process its lines in the same manner. It means
    that we will repeat our actions. Therefore, we need a loop statement. At the beginning
    of the loop, we don''t know the size of the file. Thus, we do not know the number
    of iterations to do. The `while` statement fits this case perfectly.


    Why do we not know the number of iterations in advance? It happens because the
    script reads the file line by line. It cannot count the lines before it reads
    them all. We can make two loops. The first one counts the lines. The second loop
    processes them. However, this solution works slower and less ineffective.


    We can use the `read` built-in command for reading lines of the file. The command
    receives a string from the standard input stream. Then it writes the string into
    the specified variable. You can pass the variable''s name as a parameter. Here
    is an example of doing that:


    ```

    read var

    ```


    Run this command. Then type the string and press Enter. The `read` command writes
    your string into the `var` variable. You can call `read` without parameters. It
    writes the string into the reserved variable `REPLY` in this case.


    When `read` receives the string, it removes backslashes `\` there. They escape
    special characters. Therefore, the `read` command considers the backslashes unnecessary.
    The `-r` option disables this feature. Use it always to prevent losing characters
    of the input string.


    You can pass several variable names to the `read` command. Then it divides the
    input text into parts. The command uses the delimiters from the reserved variable
    `IFS` in this case. Default delimiters are spaces, tabs and line breaks.'
  merge: -1
  pgno: 239
- img_proc: false
  md: 'Here is an example of multiple variables for the `read` command. Suppose that
    we want to store the input string into two variables. They are called `path` and
    `file`. The following command reads them:


    ```

    read -r path file

    ```


    The user types the following string for this command:


    ```

    ~/Documents report.txt

    ```


    Then the `read` command writes the `~/Documents` path into the `path` variable.
    The filename `report.txt` comes into the `file` variable.


    If the path or filename contains spaces, an error occurs. Suppose the user type
    the following string:


    ```

    ~/My Documents report.txt

    ```


    Then the command writes the `~/My` string into the `path` variable. The `file`
    variable stores the rest part of the input: `Documents report.txt`. This is a
    wrong result. Don''t forget about such behavior when using the `read` command.


    We can solve the problem of splitting the input string. This can be done by redefining
    the `IFS` variable. Here is an example to specify comma as only one possible delimiter:


    ```

    IFS=$'','' read -r path file

    ```


    Here we have applied the Bash-specific [type of quotes](#footnote344) `$''...''`.
    Bash does not perform any expansions inside them. At the same time, you can place
    some control sequences there: `\n` (new line), `\\` (escaped backslash), `\t`
    (tabulation) and `\xnn` (bytes in hexadecimal).


    The new `IFS` declaration allows to process the following input string properly:


    ```

    ~/My Documents,report.txt

    ```


    The comma separates the path and filename. Therefore, the `read` command writes
    the `~/My Documents` string into the `path` variable. The `report.txt` string
    comes into the `file` variable.


    The `read` command receives data from the standard input stream. It means that
    you can redirect the file contents to the command.


    Here is an example to read the first line of the `contacts.txt` file from Listing
    3-21. The following command does it:'
