- img_proc: false
  md: 'The third step of the algorithm is called **conditional statement**[^194].
    All modern programming languages have such a statement.


    The conditional statement works according to the following algorithm:


    +   1. Evaluate the Boolean expression in the condition.

    2. If the expression produces "true", perform the first action.

    3. If the expression produces "false", perform the second action.


    The robot evaluates the value of the Boolean expression "there is no obstacle"
    in our example. If there is an obstacle, the expression produces "false" and the
    robot stops. Otherwise, the robot moves to point B.


    When writing the conditional statement, you can combine several Boolean expressions
    using logical operators. Here is an example. Suppose that the robot tries to pick
    up a box at point A, but there is no box. Then there is no reason for him to move
    to point B. You can check this situation in the conditional statement. Add the
    new Boolean expression there using **logical AND**[^195] (conjunction). Then the
    robot''s algorithm becomes like this:


    +   1. Move to point A.

    2. Pick up the box at point A.

    3. If there is a box AND no obstacle, move to point B. Otherwise, stop.

    4. Put the box at point B.


    Logical operators produce Boolean values when evaluated. The result of a logical
    AND equals "true" when both operands are "true". In our example, it happens when
    the robot has a box and there is no obstacle on its way. Otherwise, the result
    of logical AND equals "false". It forces the robot to stop.


    You have used two more logical operators when learning the `find` utility. These
    operators are **OR**[^196] (disjunction) and **NOT**[^197] (negation).


    Actually, you have already applied logical NOT in the robot''s algorithm. It stays
    implicitly in the expression "there is no obstacle". It equals the following negation:
    "there is NOT an obstacle". You can specify the logical NOT in the algorithm explicitly
    this way:


    +   1. Move to point A.

    2. Pick up the box at point A.

    3. If there is a box AND there is NOT an obstacle, move to point B. Otherwise,
    stop.

    4. Put the box at point B.


    [^194]: https://en.wikipedia.org/wiki/Conditional_(computer_programming)

    [^195]: https://en.wikipedia.org/wiki/Logical_conjunction

    [^196]: https://en.wikipedia.org/wiki/Logical_disjunction

    [^197]: https://en.wikipedia.org/wiki/Negation'
  merge: -1
