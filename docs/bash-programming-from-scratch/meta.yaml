    ((var = 12 + 7))

    ```


    Here we use opening double-parentheses instead of the `let` command. There are
    closing double-parentheses at the end. This form of the `((` operator returns
    exit status zero if it succeeds. It returns exit status one if it fails. After
    calculating the expression, Bash replaces it with its exit status.


    The second form of the `((` operator is called **arithmetic expansion**[^316].
    It looks like this:


    ```

    var=$((12 + 7))

    ```


    Here we put a dollar sign before the `((` operator. In this case, Bash calculates
    the value of the expression. Then Bash inserts this value in place of the expression.
    This behavior differs from the first form of the `((` operator. Bash inserts the
    exit status there.


    > The second form of the `((` operator is part of the POSIX standard. Use it for
    writing portable code. The first form of the operator is available in Bash, ksh
    and zsh interpreters only.


    You can skip the dollar sign before variables names in the `((` operator. Bash
    still inserts their values correctly in this case. For example, here are two equivalent
    expressions for calculating the `result` variable:


    ```

    a=5 b=10

    result=$((a + $b))

    result=$((a + b))

    ```


    Both expressions assign the value of 15 to the `result` variable.


    Do not use the dollar sign in the `((` operator. It makes your code clearer.


    > Bash has an obsolete form of arithmetic expansion that is the "$[" "]" operator.
    Never use it. There is a GNU utility called `expr` for calculating arithmetic
    expressions. Bash needs it for launching old Bourne Shell scripts. Never use `expr`
