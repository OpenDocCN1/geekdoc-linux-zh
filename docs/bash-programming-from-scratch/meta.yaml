  md: '# Pipelines Pitfalls


    Pipelines are a popular feature of the Unix environment. Users apply them frequently.
    Unfortunately, it is quite simple to make a mistake using pipelines. Let''s consider
    the common mistakes by examples.


    You can expect that the following two commands give the same result:


    ```

    find /usr/share/doc/bash -name "*.html"

    ls /usr/share/doc/bash | grep "\.html"

    ```


    The commands'' results differ in some cases. There is no problem in processing
    the search pattern differently by the find and grep utilities. The problem happens
    when you pass the filenames through the pipeline.


    The POSIX standard allows all printable characters in filenames. It means that
    spaces and line breaks are allowed too. The only forbidden character is null character[^228]
    (NULL). This rule can lead to unexpected results.


    Here is an example. Create a file in the user''s home directory. The filename
    should contain the line break. This control character matches the `\n` escape
    sequence[^229] in ASCII encoding. You can add escape sequences in filenames with
    the touch utility. Call it this way:


    ```

    touch ~/$''test\nfile.txt''

    ```


    The touch utility updates the modification time of the file. It is a primary task
    of the utility. If the file does not exist, touch creates it. It is a side effect[^230]
    feature of the utility.


    Create extra two files for our example: test1.txt and file1.txt. The following
    command does that:


    ```

    touch ~/test1.txt ~/file1.txt

    ```


    Now call the ls utility in the user''s home directory. Pass its output to grep
    via pipeline. Here are the examples:


    ```

    ls ~ | grep test

    ls ~ | grep file

    ```


    Figure 2-27 shows the output of these commands.


    > [^228]: https://en.wikipedia.org/wiki/Null_character

    [^229]: https://en.wikipedia.org/wiki/Escape_sequence

    [^230]: https://en.wikipedia.org/wiki/Side_effect_(computer_science)'
  merge: -1
  pgno: 116
- img_proc: false
  md: '![](bbox=[0.13, 0.13, 0.86, 0.42])


    **Figure 2-27**. The result of combining the `ls` and `grep` utilities


    Both commands truncate the `test\nfile.txt` filename. Remove the `grep` calls
    in the commands. You see that the `ls` utility prints the filename properly in
    this way: `''test$''\n''''file.txt''`. When you pass it via the pipeline, the
    escaping sequence `\n` is replaced by the line break. It leads to splitting the
    filename into two parts. Then `grep` handles the parts separately as two different
    filenames.


    There is another potential problem. Suppose you search and copy the file. Its
    name has space (for example, "test file.txt"). Then the following command fails:


    ```

    ls ~ | xargs cp -t ~/tmp

    ```


    In this case, `xargs` constructs the following call of the `cp` utility:


    ```

    cp -t ~/tmp test file.txt

    ```


    The command copies the `test` and `file.txt` files to the `~/tmp` path. But none
    of these files exists. The reason for the error is the word splitting mechanism
    of Bash. It splits lines in words by spaces. You can disable the mechanism by
    double-quotes. Here is an example for our command:


    ```

    ls ~ | xargs -I % cp -t ~/tmp "%"

    ```


    It copies the "test file.txt" file properly.


    Double-quotes do not help if the filename has a line break. The only solution
    here is not to use `ls`. The `find` utility with the `-exec` action does this
    job right. Here is an example:'
