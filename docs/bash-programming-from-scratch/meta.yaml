    # Alternative to the Case Statement


    The case statement and the associative array solve similar tasks. The array makes
    the relationship between data (key-value). The case statement does the same between
    data and commands (value-action).


    Usually, it is more convenient to work with data than with code. It is easier
    to modify data and check them for correctness. Therefore, it is worth replacing
    the case statement with an associative array in some cases. Converting data into
    code is easy in Bash comparing with other programming languages.


    Here is an example. We want to write a wrapper script for the archiving utilities.
    It receives command-line options. They define if the script calls the bsdtar or
    tar utility.


    Listing 3-16 shows the script. It handles the command-line options in the case
    statement.'
