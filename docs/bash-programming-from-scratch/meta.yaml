- img_proc: false
  md: "range from 50 to 100. Enter the middle of this range, i.e. the number 75. The\
    \ answer is that 75 is also less than the number you are looking for. The conclusion\
    \ is that the number you are looking for is between 75 and 100. You can calculate\
    \ the middle of this range this way:\n\n```\nX = 75 + (100 - 75) / 2 = 87.5\n\
    ```\n\nRound the result up or down. It doesn't matter. Round it down and get the\
    \ number 87 for the next input. If the number is still not guessed, keep dividing\
    \ the range of expected numbers in half. Then you will have enough seven steps\
    \ to find the right number.\n\n# **Exercise 3-13. Functions**\n\nWe have considered\
    \ the `code_to_error` function in the section \"Using Functions in Scripts\".\n\
    \nLet's combine the code of the `print_error` and `code_to_error` functions into\
