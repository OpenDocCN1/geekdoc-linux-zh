    # grep


    The GNU utilities have one more searching tool besides `find`. It is called `grep`.
    This utility checks file contents when searching.


    How to choose the proper utility for searching? Use `find` for searching a file
    or directory by its name, path or [metadata](#footnote198)[^198]. Metadata is
    extra information about an object. Examples of the file metadata are size, time
    of creation and last modification, permissions. Use the `grep` utility to find
    a file when you know nothing about it except its contents.


    Here is an example. It shows you how to choose the right utility for searching.
    Suppose that you are looking for a documentation file. You know that it contains
    the phrase "free software". If you apply the `find` utility, the searching algorithm
    looks like this:


    +   1. Call `find` to list all the files with the `README` name.

    2. Open each file in a text editor and check if it has the phrase "free software".


    Using a text editor for checking dozens of files takes too much effort and time.
    You should perform several operations with each file manually: open it, activate
    the editor''s searching mode, type the "free software" phrase. The `grep` utility
    automates this task. For example, the following command finds all lines with the
    "free software" phrase in the specified `README` file:


    ```

    grep "free software" /usr/share/doc/bash/README

    ```


    The first parameter of the utility is a string for searching. Always enclose it
    in the double-quotes. This way, you prevent Bash expansions and guarantee that
    the utility receives the string unchanged. Without the quotes, Bash splits the
    phrase into two separate parameters. This mechanism of splitting strings into
    words is called [**word splitting**](#footnote199)[^199].


    The second parameter of `grep` is a relative or absolute path to the file. If
    you specify a list of files separated by spaces, the utility processes them all.
    In the example, we passed the `README` file path only.


    Figure 2-18 shows the result of the `grep` call.'
