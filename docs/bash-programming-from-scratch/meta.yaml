  md: '# find


    It is inconvenient to search for a file or directory with `cd` and `ls` commands.
    The special `find` utility does it better.


    If you run the `find` utility without parameters, it traverses the contents of
    the current directory and prints it. The output includes hidden objects. Figure
    2-14 shows the result of running `find` in the home directory.


    ![](bbox=[0.35, 0.26, 0.654, 0.564])


    The first parameter of `find` is the directory to search in. The utility accepts
    relative and absolute paths. For example, the following command shows the contents
    of the root directory:


    ```

    `find /`

    ```


    You can specify search conditions starting from the second parameter. If the found
    object does not meet these conditions, `find` does not print it. The conditions
    form a single expression. The utility has an embedded interpreter that processes
    this expression.


    An example of the `find` condition is the specific filename. When you call the
    utility with such a condition, it prints the found files with this name only.


    Table 2-3 shows the format of commonly used conditions for the `find` utility.'
  merge: -1
