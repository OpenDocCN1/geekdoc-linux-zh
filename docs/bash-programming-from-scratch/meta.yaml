    # Exercise 2-6. Operations with files and directories


    First, you should create directories for saving photos by each year and month.
    The following commands do this task:


    ```

    mkdir -p ~/photo/2019/11

    mkdir -p ~/photo/2019/12

    mkdir -p ~/photo/2020/01

    ```


    Suppose that the D:\Photo directory contains all photos. You can use the find
    utility for searching files with a creation date equals to November 2019. The
    -newermt option of the utility checks the creation date. Here is an example command:


    ```

    find /d/Photo -type f -newermt 2019-11-01 ! -newermt 2019-12-01

    ```


    This command looks for files in the /d/Photo directory. It corresponds to the
    D:\Photo path in the Windows environment.


    The first expression -newermt 2019-11-01 means to search for files changed since
    November 1, 2019. The second expression ! -newermt 2019-12-01 excludes files modified
    since December 1, 2019. The exclamation point before the expression is a negation.
    There is no condition between expressions. But the find utility inserts the logical
    AND by default. The resulting expression looks like: "files created after November
    1, 2019, but no later than November 30, 2019". It means "files for November".


    The file search command is ready. Now add the copy action to it. The result looks
    like this:'
  merge: -1
  pgno: 297
- img_proc: false
  md: '```

    find /d/Photo -type f -newermt 2019-11-01 ! -newermt 2019-12-01 -exec cp {} ~/photo/\2019/11
    \;

    ```


    This command copies the November 2019 files into the `~/photo/2019/11` directory.


    Here are similar commands for copying the December and January files:


    ```

    find /d/Photo -type f -newermt 2019-12-01 ! -newermt 2020-01-01 -exec cp {} ~/photo/\2019/12
    \;

    find /d/Photo -type f -newermt 2020-01-01 ! -newermt 2020-02-01 -exec cp {} ~/photo/\2020/01
    \;

    ```


    Let''s assume that you do not need old files in the `D:\Photo` directory. Then
    replace copying action with renaming. The result is the following commands:


    ```

    find /d/Photo -type f -newermt 2019-11-01 ! -newermt 2019-12-01 -exec mv {} ~/photo/\2019/11
    \;

    find /d/Photo -type f -newermt 2019-12-01 ! -newermt 2020-01-01 -exec mv {} ~/photo/\2019/12
    \;

    find /d/Photo -type f -newermt 2020-01-01 ! -newermt 2020-02-01 -exec mv {} ~/photo/\2020/01
    \;

    ```


    Note the scalability of our solution. The number of files in the `D:\Photo` directory
    is not important. You need only three commands to break them up into three months.


    # Exercise 2-7. Pipelines and I/O streams redirection


    First, let''s figure out how the `bsdtar` utility works. Call it with the `--help`
    option. It shows you a brief help. The help tells you that the utility archives
    the directory if you apply the `-c` and `-f` options. The name of the archive
    follows the options. Here is an example call of the `bsdtar` utility:


    ```

    bsdtar -c -f test.tar test

    ```


    This command creates an archive named `test.tar`. It has the contents of the `test`
    directory inside. Note that the command does not compress data[^486]. It means
    that the archive occupies the same disk space as the files it contains.


    The purposes of archiving and compression operations are different. Archiving
    is for storing and copying large numbers of files. Compression reduces the amount
    of the occupied disk memory. Often these operations are combined into one. But
    they are not the same.


    To create an archive and compress it, add the `-j` option to the `bsdtar` call.
    Here is an example:'
  merge: -1
  pgno: 298
- img_proc: false
  md: '```

    bsd​tar -c -j -f test.tar.bz2 test

    ```


    You can combine the ``-c``, ``-j`` and ``-f`` options into one group. Then you
    get the following command:


    ```

    bsd​tar -cjf test.tar.bz2 test

    ```


    Let''s write a command to navigate through the catalog of photos. It should create
    a separate archive for each month.


    The following ``find`` utility call finds directories that match specific months:


    ```

    find ~/photo -type d -path */2019/* -o -path */2020/*

    ```


    Next, we redirect the output of this command to the ``xargs`` utility. It will
    generate the ``bsd​tar`` call. Our command looks like this now:


    ```

    find ~/photo -type d -path */2019/* -o -path */2020/* | xargs -I% bsd​tar -cf
    %.tar %

    ```


    We can add the ``-j`` option to force ``bsd​tar`` to compress archived data. The
    command became like this:


    ```

    find ~/photo -type d -path */2019/* -o -path */2020/* | xargs -I% bsd​tar -cjf
    %.tar.\ bz2 %

    ```


    The data compression takes longer than archiving.


    We pass the ``-I`` parameter to the ``xargs`` utility. It specifies where to insert
    the arguments into the generated command. There are two such places in the ``bsd​tar``
    utility call: the archive''s name and the directory''s path to be processed.


    Do not forget about filenames with line breaks. To process them correctly, add
    the ``-print0`` option to the ``find`` utility call. This way, we get the following
    command:


    ```

    find ~/photo -type d -path */2019/* -o -path */2020/* -print0 | xargs -0 -I% bsd​tar
    \

    -cjf %.tar.bz2 %

    ```


    Suppose that we want to keep the files in the archives without relative paths
    (e.g. ``2019/11``). The ``--strip-components`` option of ``bsd​tar`` removes them.
    Here is the command with this option:'
