    Program instructions are called **machine code**[^129]. The processor executes
    them one by one. A single instruction is an elementary operation on the data from
    the CPU registers.


    The CPU has logical blocks for executing each type of instruction. The available
    blocks determine the operations that the CPU can perform. If the processor does
    not have an appropriate logical block to accomplish a specific instruction, it
    combines several blocks to do this job. The execution takes more clock cycles
    in this case.


    When the OS has loaded the program instructions and its data into RAM, it allocates
    the CPU time slots for that. The program becomes a **computing process**[^130]
    or process since this moment. The process means the running program and the resources
    it uses. Examples of the resources are memory area and OS objects.


    How do the program instructions look like? We can see them using the special program
    for reading and editing executable files. Such a program is called **hex editor**[^131].
    The editor represents the program''s machine code in **hexadecimal numeral system**[^132].
    The actual contents of the executable file is **binary code**[^133]. This code
    is a sequence of zeros and ones. The CPU receives program instructions and data
    in this format. The hex editor makes them easy to read for humans.


    There are advanced programs to read machine code. They are called **disassemblers**[^134].
    These programs guess how the program instructions look like in terms of the CPU
    commands. You can get a better representation of the program using the disassembler
    than the hex editor.


    If you take a specific number, it looks different in various numeral systems.
    The numeral system determines the symbols and their order to write a number. For
    example, binary allows 0 and 1 symbols only.


