  md: '# Bash Scripts


    We have learned the basics of how to operate the file system in Bash. Now we do
    the next step. We come from the standalone shell commands to programs. When you
    write a program in Bash, it is called **script**. Let`s learn how to write scripts.


    # Development Tools


    In the previous chapter, we typed Bash commands in the terminal window. Then the
    memory of the terminal process stores these commands. It means that physically
    the computer`s RAM stores them. RAM is a place for the temporary storage of information.
    Whenever you shut down the computer, this memory is cleared.


    The terminal window is not sufficient for program development. You would need
    a convenient [source code editor](https://en.wikipedia.org/wiki/Source-code_editor)^236^.
    This application allows you to create, edit and save source code files on your
    hard drive. The hard disk stores information for the long-term.


    # Source Code Editor


    You can write Bash scripts in any text editor. Even the standard Windows application
    [Notepad](https://en.wikipedia.org/wiki/Microsoft_Notepad)^237^ fits. But this
    application is inconvenient for editing the source code. Notepad does not have
    features for that. Such features can increase your productivity. Try several special
    editors and choose the one you like.


    Here there is a list of three popular source code editors. If none of the three
    fits you, please look for alternatives on the Internet. There are many editors
    of this kind.


    > > MS Office and its open-source counterpart [LibreOffice](https://en.wikipedia.org/wiki/LibreOffice)^238^
    are not suitable for writing source code. They save files in binary or [XML-like](https://en.wikipedia.org/wiki/XML)^239^
    formats. Interpreters and compilers cannot read them. They require text files.
    Text data is the format of source code editors.


    [Notepad++](https://en.wikipedia.org/wiki/Notepad%2B%2B)^240^ is a fast and minimalistic
    open-source editor. It runs on Windows only. If you use macOS or Linux, it is
    better to consider other editors. You can download the latest version of Notepad++
    on the [official website](https://notepad-plus-plus.org/downloads/)^241^.'
  merge: -1
  pgno: 124
