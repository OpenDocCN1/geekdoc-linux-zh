- img_proc: false
  md: "We use [comments](https://en.wikipedia.org/wiki/Comment_(computer_programming))\
    \ in the last example. They look like this: \"# error handling\". A comment is\
    \ a string or part of a string that the interpreter ignores. In Bash, a comment\
    \ is anything that comes after the hash symbol.\n\n> The usefulness of comments\
    \ is the subject of endless debates in the programming community. They are needed\
    \ to explain the code. However, some people consider that comments are a sign\
    \ of incomprehensible, poorly written code. If you just started learning to program,\
    \ comment your code without doubts. Explain the complex constructions in your\
    \ scripts. You can forget what do they mean afterward. Thus, you save your time\
    \ in the future when you come back to the old code.\n\nAssume that each action\
    \ of the algorithm corresponds to one short command. The `exit` command handles\
    \ all errors. There is no output to the log file. In this case, the `||` operator\
    \ can replace the `if` statement. Then the code remains simple and clear. It will\
    \ look like this:\n\n```\nACTION_1 || exit 1\nACTION_2 || exit 1\nACTION_3 ||\
    \ exit 1\nACTION_4 || exit 1\nACTION_5\n```\n\nThere is only one case when the\
    \ `&&` and `||` operators are more expressive than the `if` statement. The case\
    \ is short commands do actions and error handling.\n\nLet's rewrite the backup\
    \ script using the `if` statement. Listing 3-11 shows the result.\n\n# Listing\
    \ 3-11. The backup script with the early return pattern\n\n```\n#!/bin/bash\n\n\
    if ! bsdtar -cjf \"$1\".tar.bz2 \"$@\"\nthen\n  echo \"bsdtar - FAILS\" > results.txt\n\
    \  exit 1\nfi\n\necho \"bsdtar - OK\" > results.txt\n\nmv -f \"$1\".tar.bz2 /d\
    \ &&\n  echo \"cp - OK\" >> results.txt ||\n  ! echo \"cp - FAILS\" >> results.txt\n\
    ```\n\n[298](https://en.wikipedia.org/wiki/Comment_(computer_programming)): https://en.wikipedia.org/wiki/Comment_(computer_programming)"
