    pacman -Ss word

    ```


    The list of results will contain two packages:


    +   - mingw-w64-i686-antiword

    - mingw-w64-x86_64-antiword


    These are builds of the `antiword` utility for 32-bit and 64-bit systems. The
    utility converts MS Word documents to text format.


    Run the command to install the package:


    ```

    pacman -S PACKAGE_NAME

    ```


    This command installs the `antiword` utility:


    ```

    pacman -S mingw-w64-x86_64-antiword

    ```


    As a result, `pacman` will install `antiword` and all the packages that it needs
    for running.


    Now you can launch the `antiword` utility by the following command:


    ```

    antiword

    ```


    You have installed a package in the system. If it becomes unnecessary, uninstall
    it. The package manager will uninstall all dependencies of the package if other
    applications do not use them. Here is the command to uninstall a package:


    ```

    pacman -Rs PACKAGE_NAME

    ```


    This command uninstalls the `antiword` utility:


    ```

    pacman -Rs mingw-w64-x86_64-antiword

    ```


    Suppose you have installed several packages in your system. After a while, their
    new versions appear in the repository. You decide to upgrade your packages to
    the new versions. The following command does it:


    ```

    pacman -Syu

    ```


    The command updates all installed packages to their actual versions in the repository.


    We have considered the basic `pacman` commands. Other package managers work along
