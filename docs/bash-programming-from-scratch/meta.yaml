  md: 'time for a single pass over the source code than the linker needs it for object
    files. Therefore, when you have the compiler and linker separated, you speed up
    the overall compilation process.


    The program can call blocks of commands from the library. The linker process the
    library file together with the object files of your program in this case. The
    compiler cannot process the library. Its file contains machine code but not the
    source code. Therefore, the compiler does not understand it. Splitting the compilation
    into two steps resolves the task of using libraries too.


    We have considered the basics of how the compiler works. Now suppose that you
    choose an interpreter instead to execute your program. You have the file with
    its source code on the disk drive. The file is ready for execution. When you run
    it, the OS loads the interpreter first. Then the interpreter reads your source
    code file into RAM and executes it line by line. The translation of source code
    commands to machine code instructions happens in RAM. Some interpreters save files
    with an intermediate representation of the program to the disk drive. It speeds
    up the program execution if you restart it. However, you always need to run an
    interpreter first for executing your program.


    Figure 1-16 shows the process of interpreting the program.


    ![](bbox=[0.135, 0.502, 0.864, 0.72])


    > Figure 1-16. **Interpreting the program**


    Figure 1-16 can give an idea that the interpreter works the same way as the compiler
    and linker combined into one application. The interpreter loads source code files
    into RAM and translates them into machine code. Why are there no problems with
    the RAM overflow and dependency resolution?


    The interpreter avoids problems because it processes the source code differently
    than the compiler does. The interpreter processes and executes the program code
    line by line. Therefore, it does not store the machine code of the whole program
    in memory. The interpreter processes the parts of the source code file that it
    requires at the moment. When the interpreter executes them, it unloads these parts
    and frees the corresponding RAM area.'
  merge: -1
  pgno: 43
- img_proc: false
  md: 'Interpreting the program looks more convenient for software development than
    compiling. However, it has some drawbacks.


    First, all interpreters work slowly. It happens because every time you run the
    program, the interpreter should translate its source code to machine code. This
    process takes some time. You should wait for it. Another reason for the low performance
    of interpreters is disk operations. Loading the program''s source code from the
    disk drive into RAM causes the CPU to idle. It takes up to 10000000 clock cycles,
    according to Table 1-3.


    Second, the interpreter itself is a complex program. It requires some portion
    of the computer''s hardware resources to launch and work. Therefore, the computer
    executes both interpreter and your program in parallel and shares resources among
    them. It is an extra overhead that reduces the performance of your program.


    Interpreting the program is slow. Does it mean that compilation is better? The
    compiler generates an executable file with machine code. Therefore, you reach
    almost the program''s performance when you compile it or write machine code on
    your own. However, you pay for using the programming language at the compilation
    stage. A couple of seconds and a few megabytes of RAM are enough to compile a
    small program. When you compile a large project (for example, the Linux kernel),
    it takes several hours. If you change the source code, you should recompile the
    project and wait hours again.


    Keep in mind the overhead of interpreters and compilers when choosing a programming
    language for your project. The interpreter is a good choice in the following cases:


    +   - You want to develop a program quickly.

    - You do not care about the program''s performance.

    - You work on a small and relatively simple project.


    The compiler would be better in the following cases:


    +   - You work on a complex and large project.

    - Your program should work as fast as possible.

    - You want to speed up debugging of your program.


    Both compilers and interpreters have an overhead. Does it make sense to discard
    a programming language and write a program in machine code? You do not waste your
    time waiting for compilation in this case. Your program works as fast as possible.
    These benefits sound reasonable. Please do not hurry with your conclusions.


    One simple example helps you to realize all advantages of using a programming
    language. Listing 1-1 shows the source code written in C. This program prints
    the "Hello world!" text on the screen.'
  merge: -1
