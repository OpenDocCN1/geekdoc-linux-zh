  md: 'You can always replace logical AND by OR with some extra changes. Let''s do
    it for our example but keep the robot''s behavior the same. You should add the
    negation to the first Boolean expression and remove it from the second one. Also,
    you have to change the order of actions in the conditional statement. If the condition
    produces "true", the robot stops. If it produces "false", the robot moves to point
    B. The new algorithm looks this way:


    +   1. Move to point A.

    2. Pick up the box at point A.

    3. If there is NOT a box OR there is an obstacle, stop. Otherwise, move to point
    B.

    4. Put the box at point B.


    Read the new conditional statement carefully. The robot follows the same decisions
    as before. It stops if it has no box or if there is an obstacle on its way. However,
    you have exchanged the logical AND to OR. This trick helps you to keep your conditional
    statements clear. Choose between logical AND and OR depending on your Boolean
    expressions. Pick one that fits your case better.


    You wrote the Boolean expressions as sentences in English in our example. Such
    a sentence sounds unnatural. You have to read it several times to understand it.
    This happens because the natural humans'' language is not suitable for writing
    Boolean expressions. This language is not accurate enough. Boolean algebra uses
    mathematical notation for that reason.


    We have considered logical AND, OR and NOT. You will deal with three more operators
    in programming often:


    +   - Equivalence

    - Non-equivalence

    - Exclusive OR


    Table 2-5 explains them.


    | Operator | Evaluation Rule |

    | --- | --- |

    | AND | It produces "true" when both operands are "true". |

    | OR | It produces "true" when any of the operands is "true". It produces "false"
    when all operands are "false". |

    | NOT | It produces "true" when the operand is "false" and vice versa. |

    | Exclusive OR (XOR) | It produces "true" when the operands have different values
    (true-false or false-true). It produces "false" when the operands are the same
    (true-true, false-false). |

    | Equivalence | It produces "true" when the operands have the same values. |

    | Non-equivalence | It produces "true" when the values of the operands differ.
    |'
