    Windows Explorer allows you the following actions to navigate the file system:


    +   - Display the current directory.

    - Go to a specified disk drive or directory.

    - Find a directory or file on the disk.


    You can do the same actions with the shell. It provides you a corresponding command
    for each action. Table 2-1 shows these commands.


    **Table 2-1. Commands and utilities for navigating the file system**


    | Command | Description | Examples |

    | --- | --- | --- |

    | `ls` | Display the contents of the directory. If you call the command without
    parameters, it shows you the contents of the current directory. | `ls`<br>`ls
    /c/Windows` |

    | `pwd` | Display the path to the current directory. When you add the `-W` parameter,
    the command displays the path in the Windows directory structure. | `pwd` |

    | `cd` | Go to the directory at the specified relative or absolute path. | `cd
    tmp`<br>`cd /c/Windows`<br>`cd ..` |

    | `mount` | Mount the disk to the root file system. If you call the command without
    parameters, it shows a list of all mounted disks. | `mount` |

    | `find` | Find a file or directory. The first parameter specifies the directory
    to start searching. | `find . -name vim`<br>`find /c/Windows -name *vim*` |

    | `grep` | Find a file by its contents. | `grep "PATH" *`<br>`grep -Rn "PATH"
    .`<br>`grep "PATH" * .*` |


    Bash can perform `pwd` and `cd` commands of Table 2-1 only. They are called **built-ins**[^181].
    Special utilities perform all other commands of the table. Bash calls an appropriate
