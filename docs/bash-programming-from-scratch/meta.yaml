    It looks like functions and aliases work the same way. What should you choose
    then?


    Functions and aliases have one similar aspect only. They are built-in Bash mechanisms.
    From the user''s point of view, they reduce the input of long commands. But these
    mechanisms work in completely different ways.


    An alias replaces one text with another in a typed command. In other words, Bash
    finds text in the command that matches the alias name. Then it replaces that text
    with the alias value. Finally, Bash executes the resulting command.


    Here is an example of an alias. Suppose you have declared an alias for the cat
    utility. It adds the -n option to the utility call. The option adds line numbers
    to the cat output. The alias declaration looks like this:


    ```

    alias cat="cat -n"

    ```


    Whenever you type a command that starts with the word "cat", Bash replaces it
    with the "cat -n". For example, you type this command:


    ```

    cat ~/.bashrc

    ```


    When Bash inserts an alias value, the command becomes like this:


    ```

    cat -n ~/.bashrc

    ```


    Bash has replaced the word "cat" with "cat -n". It did not change the parameter,
    i.e. the path to the file.


    > You can force Bash to insert an alias before executing the command. Type the
    command and press the Ctrl+Alt+E keystroke for doing that.


    Now let''s look at how functions work. Suppose that Bash meets the function name
    in the typed command. Unlike an alias, the shell does not replace the function''s
    name with its body. Instead, Bash executes the function''s body.


    Here is an example to explain the difference. We want to write the function that
    behaves the same way as the cat alias. If Bash functions work as aliases, the
    following declaration solves our task:


    ```

    cat() { cat -n; }

    ```


    We expect that Bash will add the -n option to the following command:'
