  md: "```\narray=(Alice Bob Eve Mallory)\n\nfor i in {0..2}\ndo\n  echo \"${array[i]}\"\
    \ndone\n```\n\nThe loop behaves the same way. It prints the first three elements\
    \ of the array.\n\nDo not iterate over the element's indexes when processing arrays\
    \ with gaps. Expand the array's elements in the loop condition instead. Listing\
    \ 3-25 and Listing 3-26 show how to do that.\n\n# **Files Processing**\n\nThe\
    \ `for` loop fits well for processing a list of files. When solving this task,\
    \ you should compose the loop condition correctly. There are several common mistakes\
    \ here. Let's consider them by examples.\n\nThe first example is a script that\
    \ prints types of files in the current directory. We can do it by calling the\
    \ `file` utility for each file.\n\nThe most common mistake when composing the\
    \ `for` loop condition is neglecting patterns (globbing). Users often call the\
    \ `ls` or `find` utility to get the STRING. It happens this way:\n\n```\nfor filename\
    \ in $(ls)\nfor filename in $(find . - type f)\n```\n\nThis is wrong. Such a solution\
    \ leads to the following problems:\n\n+   1. Word splitting breaks names of files\
    \ and directories with spaces.\n2. If the filename contains an asterisk, Bash\
    \ performs globbing before starting the loop. Then it writes the expansion result\
    \ to the `filename` variable. This way, you lose the actual filename.\n3. The\
    \ output of the `ls` utility depends on the regional settings. Therefore, you\
    \ can get question marks instead of the national alphabet characters in filenames.\
    \ Then the `for` loop cannot process these files.\n\nAlways use patterns in the\
    \ `for` loop to enumerate filenames. It is the only correct solution for this\
    \ task.\n\nWe should write the following `for` loop condition in our case:\n\n\
    ```\nfor filename in *\n```"
  merge: -1
  pgno: 246
- img_proc: false
  md: "Listing 3-27. The script for printing the file types\n\n```\n#!/bin/bash\n\n\
    for filename in *\ndo\n  file \"${filename}\"\ndone\n```\n\nDo not forget to use\
    \ double-quotes when accessing the `filename` variable. They prevent word splitting\
    \ of filenames with spaces.\n\nYou can still use the pattern in the `for` loop\
    \ condition if you want to process files from a specific directory. Here is an\
    \ example of such a pattern:\n\n```\nfor filename in /usr/share/doc/bash/*\n```\n\
    \nA pattern can filter out files with a specific extension or name. It looks like\
    \ this:\n\n```\nfor filename in ~/Documents/*.pdf\n```\n\nThere is a new feature\
    \ for patterns in Bash version 4. You can pass through directories recursively.\
    \ Here is an example:\n\n```\nshopt -s globstar\n\nfor filename in **\n```\n\n\
    This feature is disabled by default. Activate it by enabling the `globstar` interpreter\
    \ option with the `shopt` command.\n\nWhen Bash meets the `**` pattern, it inserts\
    \ a list of all subdirectories and their files starting from the current directory.\
    \ You can combine this mechanism with regular patterns.\n\nFor example, let's\
    \ process all files with the PDF extension from the user's home directory. The\
    \ following `for` loop condition does that:\n\n```\nshopt -s globstar\n\nfor filename\
    \ in ~/**/*.pdf\n```\n\nThere is another common mistake when using the `for` loop.\
    \ Sometimes you just do not need it. For example, you can replace the script in\
    \ Listing 3-27 with the following `find` call:"
  merge: -1
  pgno: 247
- img_proc: false
  md: "```\nfind . -maxdepth 1 -exec file {} \\;\n```\n\nThis command is more efficient\
    \ than the `for` loop. It is compact and works faster because of fewer operations\
    \ to do.\n\nWhen should you use the `for` loop instead of the `find` utility?\
    \ Use `find` when one short command processes found files. If you need a conditional\
    \ statement or block of commands for this job, use the `for` loop.\n\nThere are\
    \ cases when patterns are not enough in the `for` loop condition. You want to\
    \ do a complex search with checking file types, for example. In this case, use\
    \ the `while` loop instead of `for`.\n\nLet's replace the `for` loop in Listing\
    \ 3-27 with `while`. The `find` utility will provide us a list of files. But we\
    \ should call it with the `-print0` option. This way, we avoid word splitting\
    \ issues. Listing 3-28 shows how to combine the `find` utility and `while` loop\
