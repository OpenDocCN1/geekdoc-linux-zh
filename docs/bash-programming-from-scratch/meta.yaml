    # **Exercise 2-3. Searching for files with the `find` utility**


    The following command searches text files in the system paths:


    ```

    find /usr -name "*.txt"

    ```


    The /usr path stores text files. So, there is no reason to check other system
    paths.


    Now let''s count the number of lines in the found files. We should add the `-exec`
    action with the `wc` utility call to do this. The resulting command looks like
    this:


    ```

    find /usr -name "*.txt" -exec wc -l {} +

    ```


    You can find all text files on the disk if you start searching from the root directory.
    Here is the example command:


    ```

    find / -name "*.txt"

    ```


    If you add the `wc` call to the command, it fails when running in the MSYS2 environment.
    In other words, the following command does not work:


    ```

    find / -name "*.txt" -exec wc -l {} +

    ```


    The problem happens because of the error message that Figure 2-17 shows. The `find`
    utility passes the message to the `wc` input. The `wc` utility treats each word
    it receives as a file path. The error message is not a path. Therefore, `wc` fails.'
