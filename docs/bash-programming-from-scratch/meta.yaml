  md: 'Here is an example of how to convert data into a command. For the first time,
    we will do it in the shell but not in the script. The first step is declaring
    the variable like this:


    ```

    ls_command="ls"

    ```


    Now the `ls_command` variable stores the command to call the `ls` utility. After
    such a declaration, we can use the variable name for calling the utility. It looks
    the following way:


    ```

    $ls_command

    ```


    This command calls the `ls` utility without parameters. How does it happen? Bash
    inserts the value of the `ls_command` variable. Then the command becomes like
    this:


    ```

    ls

    ```


    After parameter expansion, Bash executes the resulting command.


    Why don''t we use double-quotes when inserting the `ls_command` variable? One
    small change would help to answer this question. Let''s add an option to the `ls`
    utility call. Here is an example of such `ls_command` variable:


    ```

    ls_command="ls -l"

    ```


    In this case, parameter expansion with double-quotes leads to the error:


    ```

    1. $ "$ls_command"

    2. ls -l: command not found

    ```


    Double-quotes cause the problem because they prevent word splitting. Therefore,
    the command looks like this after parameter expansion:


    ```

    "ls -l"

    ```


    This command means that Bash must call a built-in or utility named "ls -l". As
    you remember, the POSIX standard allows spaces in filenames. Therefore, "ls -l"
    is the correct executable filename. Removing the quotes solves the problem. We
    meet one of the rare cases when you do not need double-quotes for parameter expansion.


    It can happen that you still need double-quotes when reading the command from
    the variable. This task has the solution. Use the `eval` built-in in this case.
    It constructs a command from its input parameters. Then Bash does word splitting
    for this command regardless of double-quotes.'
