    cp README.txt ~

    ```


    There are nine kinds of expansions that Bash does. There is a strict order in
    which the interpreter performs them. The order is important. If you miss it, errors
    can occur. Let''s consider an example of such an error.


    Suppose we manipulate the "my file.txt" file in the script. For the sake of convenience,
    we put the filename into a variable. Its declaration looks like this:


    ```

    filename="my file.txt"

    ```


    Then we use the variable in the cp call. Here is the command:


    ```

    cp $filename ~

    ```


    Bash does word splitting after parameter expansion. They are two different expansion
    mechanisms. When both of them are done, the cp call looks like this:


    ```

    cp my file.txt ~

    ```


    This command leads to an error. Bash passes two parameters to the cp utility:
    "my" and "file.txt". There are no such files.


    Another error happens if the variable''s value contains a special character. Here
    is an example:


    ```

    filename="*file.txt"

    rm $filename

    ```


    The rm utility deletes all files ending in file.txt. The globbing mechanism causes
    such behavior. It happens because Bash does globbing after parameter expansion
    too. Then it substitutes files of the current directory whose names match the
    "*file.txt" pattern. It leads to unexpected results. Here is an example of the
    possible command:'
