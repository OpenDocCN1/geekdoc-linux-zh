  md: "> In the general case, you do not need the dollar sign for variables names\
    \ in the (( operator and let command. However, it is necessary for code in Listing\
    \ 3-32. Without the sign, Bash confuses the $1 parameter and literal 1.\n\nWe\
    \ use the prefix increment form in the loop. It works faster than the postfix\
    \ form.\n\nUse the second form of the for whenever you should calculate the loop\
    \ counter. There are no other effective solutions in this case.\n\n# Controlling\
    \ the Loop Execution\n\nThe loop stops according to its condition. There are additional\
    \ ways to control the loop execution. They allow you to interrupt it or skip the\
    \ current iteration. Let's consider them in detail.\n\n# break\n\nThe break command\
    \ stops the loop immediately. It is useful for handling an error or finishing\
    \ an infinite loop.\n\nHere is an example. We want to write the script that searches\
    \ an array's element by value. When the script finds it, there is no reason to\
    \ continue the loop. We can finish it immediately with the break command. Listing\
    \ 3-33 shows how to do it.\n\n```\n#!/bin/bash\n\narray=(Alice Bob Eve Mallory)\n\
    is_found=\"0\"\n\nfor element in \"${array[@]}\"\ndo\n  if [[ \"$element\" ==\
    \ \"$1\" ]]\n  then\n    is_found=\"1\"\n    break\n  fi\ndone\n\nif [[ \"$is_found\"\
    \ -ne '0' ]]\nthen\n  echo \"The array contains the $1 element\"\nelse\n  echo\
    \ \"The array does not contain the $1 element\"\nfi\n```"
