- img_proc: false
  md: "```\nif CONDITION\nthen\n  ACTION_1\nelse\n  ACTION_2\nfi\n```\n\nThe same\
    \ `if-else` written in one line looks like this:\n\n```\nif CONDITION; then ACTION_1;\
    \ else ACTION_2; fi\n```\n\nBash executes `ACTION_2` if `CONDITION` returns the\
    \ non-zero exit status. The condition is \"false\" in this case. Otherwise, Bash\
    \ executes the `ACTION_1`.\n\nYou can extend the `if-else` statement by the `elif`\
    \ blocks. Such a block adds an extra condition and the corresponding action. Bash\
    \ executes the action if the condition equals \"true\".\n\nHere is an example.\
    \ Suppose you choose one of three actions depending on the value of a variable.\
    \ The following `if` statement provides this behavior:\n\n```\nIf CONDITION_1\n\
    then\n  ACTION_1\nelif CONDITION_2\nthen\n  ACTION_2\nelse\n  ACTION_3\nfi\n```\n\
    \nThere is no limitation for the number of `elif` blocks in the statement. You\
    \ can add as many of them as you need.\n\nLet's extend our example of file comparison.\
    \ We want to print the message in both cases: when the files match and when they\
    \ do not. The `if-else` statement does the job. It looks like this:\n\n```\nif\
    \ cmp file1.txt file2.txt &> /dev/null\nthen\n  echo \"Files file1.txt and file2.txt\
    \ are the same.\"\nelse\n  echo \"Files file1.txt and file2.txt differ.\"\nfi\n\
    ```"
