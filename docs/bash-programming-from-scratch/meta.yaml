    # Navigating the File System


    Let''s start introducing the Unix environment and Bash with a [file system](https://en.wikipedia.org/wiki/File_system).
    A file system is a software that dictates how to store and read data from disks.
    It covers the following topics:


    +   - API to access data on the disk that programs can use.

    - Universal way for accessing different storage devices.

    - Physical operations on the disk storage.


    First, we will look at the differences between the directory structure in Unix
    and Windows. Then we will learn the Bash commands for navigating the file system.


    # Directory Structure


    There is an address bar at the top of the Windows Explorer window. It displays
    the **absolute path** to the current directory. An absolute path shows the place
    of the file system object regardless of the current directory.


    Another way to specify the file system object place is using the **relative path**.
    It shows you how to reach the object from the current directory.


    A [directory](https://en.wikipedia.org/wiki/Directory_(computing)) is a file system
    cataloging structure. It can contain references to files and other directories.
    Windows terminology calls it [folder](https://en.wikipedia.org/wiki/Directory_(computing)#Folder_metaphor).
    Both names mean the same kind of file system object.


    Figure 2-6 shows an Explorer window. The address bar equals `This PC > Local Disk
    (C:) > msys64` there. It matches the `C:\msys64` absolute path. Thus, we see the
    contents of the `msys64` directory on the `C` drive in the Explorer window.'
