  md: "We replaced the `&&` and `||` operators in the `bsdtar` call with the `if`\
    \ statement. The behavior of the script has not changed.\n\nLogical operators\
    \ and the `if` statement are not equivalent in general. Here is an example. Suppose\
    \ there is an expression of three commands A, B and C:\n\n```\nA && B || C\n```\n\
    \nIt might seem that the following `if-else` statement gives the same behavior:\n\
    \n```\nif A\nthen\n  B\nelse\n  C\nfi\n```\n\nIf A is \"true\", then Bash executes\
    \ B. Otherwise, it executes C. But there is another behavior in the expression\
    \ with logical operators. Here, if A is \"true\", then Bash executes B. Then C\
    \ execution depends on the result of B. If B is \"true\", Bash skips C. If B is\
    \ \"false\", it executes C. Thus, execution of C depends on both A and B. There\
    \ is no such dependence in the `if-else` statement.\n\n# ### Exercise 3-4. The\
    \ `if` statement\n\n```\nHere is the Bash command:\n( grep -RIZ \"123\" target\
    \ | xargs -0 cp -t . && echo \"cp - OK\" || ! echo \"cp - FAILS\" \\\n) && ( grep\
    \ -RLZ \"123\" target | xargs -0 rm && echo \"rm - OK\" || echo \"rm - FAILS\"\
    \ \\\n)\n\nIt looks for the string \"123\" in the files of the directory named\
    \ \"target\".\nIf the file contains the string, it is copied to the current directory.\n\
    If there is no string in the file, it is removed from the target directory.\n\n\
    Make the script from this command.\nReplace the `&&` and `||` operators with the\
    \ `if` statements.\n```\n\n# ## Operator `[[`\n\nWe got acquainted with the `if`\
    \ statement. It calls a built-in Bash command or utility in the condition.\n\n\
    For example, let's solve a task. We should check if the text file contains a phrase.\
    \ When the phrase present, our script prints the message in the log file."
