    \n```\nfind . -type f -print0 | xargs -0 -I % bsdtar -cf %.tar %\n```\n\nThe -print0\
    \ option changes the find output format. It separates the paths to found objects\
    \ by the null character. Without the option, the separator is a line break.\n\n\
    We changed the find output format. Then we should notify the xargs utility about\
    \ it. By default, the utility separates the strings on the input stream by line\
    \ breaks. The -0 option changes this behavior. With the option, xargs applies\
    \ the null character as the separator. In this way, we have reconciled the output\
    \ and input formats of the utilities.\n\nYou can change the output format of the\
    \ grep utility in the same manner. It allows you to pass its output through the\
    \ pipeline. The -Z option does that. The option separates filenames with the null\
    \ character. Here is an example:\n\n```\ngrep -RIZ \"GNU\" . | xargs -0 -I % bsdtar\
    \ -cf %.tar %\n```\n\nThe command searches files that contain the \"GNU\" pattern.\
    \ Then it passes their names to the xargs utility. The utility constructs the\
    \ bsdtar call for archiving the files.\n\nHere are the general advices for using\
    \ pipelines:\n\n+   1. Be aware of spaces and line breaks when passing filenames\
    \ through the pipeline.\n2. Never process the ls output. Use the find utility\
    \ with the -exec action instead.\n3. Always use -0 option when process filenames\
    \ by xargs. Pass null separated names to the utility.\n\n# Exercise 2-7. Pipelines\
