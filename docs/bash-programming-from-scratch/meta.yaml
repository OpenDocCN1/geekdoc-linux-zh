    \ Then the loop gives you an index on each iteration. The loop looks like this:\n\
    \n```\narray=(Alice Bob Eve Mallory)\n\nfor i in 0 1 2\ndo\n    echo \"${array[i]}\"\
    \ndone\n```\n\nThis loop passes only through elements with indexes 0, 1 and 2.\n\
