  md: '# Logic Expressions


    The search conditions of the `find` utility are **[Boolean expressions](#footnote-192)**.
    A Boolean expression is a programming language statement. It produces a Boolean
    value when evaluated. This value equals either "true" or "false".


    The `find` condition is a statement of the utility''s language. It produces the
    "true" value if the found object meets its requirement. Otherwise, the condition
    produces "false". If there are several conditions in the `find` call, they make
    a single compound Boolean expression.


    When we have considered the binary numeral system, we already met Boolean algebra.
    This section of mathematics studies **[logical operators](#footnote-193)**. They
    differ from the arithmetic operations: addition, subtraction, multiplication,
    and division.


    You can apply a logical operator to Boolean values or expressions. Using an arithmetic
    operation does not make sense in this case. Addition or subtraction is trivial
    for Boolean values. It yields nothing. When you apply a logical operator, you
    get a condition with strict evaluation rules. This way, you wrote search conditions
    for the `find` utility. When you combine several conditions, you get a program
    with complex behavior.


    An **operand** is an object of a logical operator. Boolean values and expressions
    can be operands.


    Let''s consider Boolean expressions using an example. The example is not related
    to the `find` utility or Bash for simplicity. Imagine that you are programming
    a robot for a warehouse. Its job is to move boxes from point A to point B. You
    can write the following straightforward algorithm for the robot:


    +   1. Move to point A.

    2. Pick up the box at point A.

    3. Move to point B.

    4. Put the box at point B.


    This algorithm does not have any conditions. It means that the robot performs
    each step independently of external events.


    Now imagine that an obstacle happens in the robot''s way. For example, another
    robot stuck there. Executing your algorithm leads to the collision of the robots
    in this case. You should add a condition in the algorithm to prevent the collision.
    For example, it can look like this:


    +   1. Move to point A.

    2. Pick up the box at point A.

    3. If there is no obstacle, move to point B. Otherwise, stop.

    4. Put the box at point B.


    <sup>192</sup>[https://en.wikipedia.org/wiki/Boolean_expression](https://en.wikipedia.org/wiki/Boolean_expression)


    <sup>193</sup>[https://en.wikipedia.org/wiki/Logical_connective](https://en.wikipedia.org/wiki/Logical_connective)'
  merge: -1
