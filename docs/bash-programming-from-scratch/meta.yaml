  md: '**Brace expansion** is a Bash mechanism for generating words from given parts.
    The POSIX standard misses this mechanism.


    Here is an example of the brace expansion:


    ```

    cp test.{txt,md,log} Documents

    ```


    It generates the following command:


    ```

    cp test.txt test.md test.log Documents

    ```


    **Builtin commands** are the commands that the interpreter executes by itself.
    It does not call utilities or programs for that. An example is the `pwd` built-in
    command.


    # C


    **Child process** a process spawned by another process called the parent.


    **Code style** is a set of rules and conventions for writing the source code for
    programs. The rules help several programmers write, read, and understand common
    source code.


    **Command** is the text entered after the command prompt. This text matches the
    action that the interpreter performs on its own or with another application''s
    help.


    **Command-line parameter** is a type of the command''s argument. It passes information
    to the program. The parameter can also be a part of some option. For example,
    it specifies the selected mode of the program''s operation.


    Here is the `find` utility call:


    ```

    find ~/Documents -name README

    ```


    The first parameter `~/Documents` specifies the path to start the search. The
    second parameter `README` refers to the option `-name`. It specifies the file
    or directory name for searching.


    **Command prompt** is a sequence of characters. The shell prints a prompt when
    it is ready to process the user''s command.


    **Command substitution** is the Bash mechanism that replaces a command''s call
    to its output. The subshell executes the command call. Here is an example:'
