- img_proc: false
  md: 'The first `find` call creates the `readme_list.txt` file and writes the result
    there. If the file already exists, the command overwrites its contents. The second
    `find` call appends its result to the end of `readme_list.txt`. If the file does
    not exist, the `>>` operator creates it.


    The full form of the `>>` operator looks like `1>>`. If you want to redirect the
    error stream without overwriting the file, use the `2>>` operator.


    Sometimes you need to redirect both the output and the error streams to the same
    file. The `&>` and `&>>` operators do it. The first operator overwrites an existing
    file. The second one appends data to its end. Here is an example:


    ```

    find / -path */doc/* -name README &> result_and_errors.txt

    ```


    This command works in Bash properly. But it can fail in other shells. If you want
    to use the POSIX standard features only, use the `2>&1` operator. Here is an example:


    ```

    find / -path */doc/* -name README > result_and_errors.txt 2>&1

    ```


    This redirection is called **stream duplicating**. Use it for redirecting both
    output and error streams to the same target.


    Be careful when using streams duplicating. It''s easy to make a mistake and mix
    up the operator order in a command. If you work in Bash, always prefer the `&>`
    and `&>>` operators.


    Here is an example of the error with duplicating streams:


    ```

    find / -path */doc/* -name README 2>&1 > result_and_errors.txt

    ```


    The command outputs the error stream data on the screen. However, we expect that
    these data appear in the `result_and_errors.txt` file. The problem happens because
    the `2>&1` operator has the wrong position in the command.


    The POSIX standard has the concept of [file descriptor](#) [^222]. The descriptor
    is a pointer to a file or communication channel. The descriptor works as an abstraction
    that simplifies handling of the streams.


    When you start a program, descriptors of output and error streams point to the
    terminal window. You can change it and associate them with the file. The streams
    descriptors point to that file in this case. The [BashGuide article](#) [^223]
    describes this mechanism in detail.


    Let''s go back to our `find` utility call. Bash applies redirection operators
    one by one from left to right. Table 2-13 shows this order for our example.'
