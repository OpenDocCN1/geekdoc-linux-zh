    # Using Bitwise Operations


    Bitwise operations are widely used in system programming. It happens because working
    with computer networks and peripheral devices requires translating data from one
    format to another.


    Here is an example. Suppose you are working with a peripheral device. The byte
    order on the device is big-endian. Your computer uses another order, which is
    little-endian.


    Now suppose that the device sends an unsigned integer to the computer. It equals
    0xAABB in hexadecimal. Because of the different byte orders, your computer cannot
    receive the integer as it is. You should convert the integer to 0xBBAA. Then the
    computer reads it correctly.


    Here are the steps for converting the 0xAABB integer into the computer''s byte
    order:


    +   1. Read the lowest (rightmost) byte of the integer and shift it to the left
    by eight bits, i.e. one byte. The following Bash command does that:


    ```

    little=$(((0xAABB & 0x00FF) << 8))

    ```


    +   2. Read the highest (leftmost) byte of the number and shift it to the right
    by eight bits. Here is the command:'
