    # ## Returning a Function''s Result


    Procedural languages have a reserved word for returning the function''s result.
    It is called `return` in most cases. Bash also has a command with this name. But
    it has another purpose. The `return` command in Bash does not return a value.
    Instead, it passes a function''s exit status, which is an integer between 0 and
    255.


    The complete algorithm for calling and executing the function looks like this:


    +   1. Bash meets the function name in the command.

    2. The interpreter goes to the body of the function and executes it from the first
    command.

    3. If Bash meets the `return` command in the function body, it stops executing
    it. The interpreter jumps to the place where the function is called. The special
    parameter `$?` stores the exit status of the function.

    4. If there is no `return` command in the function''s body, Bash executes it until
    the last command. Then, the interpreter jumps to the place where the function
    is called.


    In procedural languages, the `return` command returns the variable of any type
    from a function. It can be a number, a string or an array. You need other mechanisms
    for doing that in Bash. There are three options:


    1. Command Substitution.'
