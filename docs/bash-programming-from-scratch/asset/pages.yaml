    Endianness$^{419}$ is the byte order the computer uses to store numbers in memory.
    The CPU defines the supported endianness. There are two commonly used options:
    big-endian and little-endian. Some CPUs support both (bi-endian). Here is an example
    of storing a four-byte number 0xA0B0C0DD for different orders:


    ```

    0A 0B 0C 0D  big-endian

    0D 0C 0B 0A  little-endian

    ```


    Environment variables$^{420}$ is an unordered set of variables that the child
    process copies from the parent. The env utility changes environment variables
    at the program startup. If you call the utility without parameters, it prints
    all variables declared in the current shell.


    Error-prone$^{421}$ (error-prone) is a definition of failed programming techniques
    and solutions. Solutions work well in particular cases but cause errors with certain
    input data or conditions. An example of an error-prone solution is handling the
    utility in the pipeline:


