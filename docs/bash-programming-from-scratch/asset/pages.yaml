    or its output. Here is an example. Suppose some document needs a part of the Bash
    README file. Use the clipboard¹¹¹⁸ to copy it. The clipboard is temporary storage
    for text data. When you select something in the terminal window with a mouse,
    the clipboard saves it automatically. Then you can paste this data to any other
    window.


    These are the steps to copy text from the terminal window:


    +   1. Select the text with the mouse. Hold down the left mouse button and drag
    the cursor over the required text.

    2. Press the middle mouse button to paste the text from the clipboard to the same
    or another terminal window. You insert the text at the current cursor position.

    3. Right-click and select the "Paste" item to paste the text to the application
    other than the terminal.'
