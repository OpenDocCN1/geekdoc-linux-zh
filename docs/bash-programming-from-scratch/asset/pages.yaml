    C. Bash copied them from C.


    First, let''s consider the assignments. It helps to get the meaning of increment
    and decrement. A regular assignment in arithmetic evaluation looks like this:


    ```

    ((var = 5))

    ```


    This command assigns the integer 5 to the variable.

    Bash allows you to combine an assignment with arithmetic or bitwise operation.
