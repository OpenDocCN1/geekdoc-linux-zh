  md: '![](img/10069385f0665422da9fa132eaf1027c_9_0.png)


    Most computer engineers were skeptical about vacuum tubes in the 1940s. The tubes
    were known for their low reliability and high power consumption. Nobody believed
    that a tube-based machine could work at all. ENIAC contains around 18,000 vacuum
    tubes. They burn out often. However, the computer performed the calculations efficiently
    between the failures. ENIAC was the first successful case of applying vacuum tubes.
    This case convinced many engineers that such an approach works well.


    ENIAC is a programmable computer. You can set its algorithm using a combination
    of switches and jumpers on the control panels. This task requires considerable
    time and simultaneous work of several people. Figure 1-3 shows one of the panels
    for programming ENIAC.


    ![](img/10069385f0665422da9fa132eaf1027c_9_1.png)


    ENIAC uses punched cards for reading input data and to output results. This is
    the same approach as previous models of computers have used. The new feature of
    ENIAC was storing intermediate results on the cards.'
