  md: '# Introduction


    motivation to work with examples. The author offers you to read and understand
    a lot of code. Often, the code demonstrates a specific principle and does not
    have a practical use case. Therefore, such examples are not attractive to readers.


    Modern general-purpose languages are complex. It means that you should know a
    lot about the language before dealing with real-life tasks Here we meet a vicious
    cycle. Examples are not interesting because they are useless. But useful real-life
    programs are too hard to understand for a beginner.


    This book follows another approach. It starts with a general theory about a computer.
    Here we pay attention to the reasons for the technical solutions of the past.
    These solutions defined the basic features of a modern computer. Following the
    reasons helps you to learn the material quickly.


    The general theory about a computer helps you when you start programming in a
    particular language. You will certainly meet problems. For example, your program
    runs too slow or ends with an error all the time. Knowing the internals of a computer
    helps you to understand the reasons for such behavior.


    The next part of this book introduces you to the Bash programming language. Contrary
    to popular belief, it is a complex domain-specific language. However, there are
    some practical tasks that it solves easily and iconically. We will use them as
    examples. This way, we will learn the basic concepts of programming.


    Our first step is replacing the graphical user interface with the shell. It will
    teach you basic operations on files and directories using Bash commands. When
    we get this basic syntax, we apply it and write our first Bash programs.


    Please do not consider learning Bash as a necessary or useless exercise. Every
    professional faces tasks of automating processes and executing commands on a Unix-like
    system. Bash knowledge is irreplaceable in both cases.


    If you are not to complete some example or exercise, do not be upset. It means
    that the book does not disclose material sufficiently. Please write to me about
    this. We will consider it out together.


    There is a glossary at the end of the book. Here you can clarify an unknown term
    that you met while reading the book.


