    for that is the currently loaded program occupies all computer resources. The
    same CPU idle happens when printing the results. The printer is a slow mechanical
    device.


    The CPU idle led developers to the concept of multiprogramming². This implies
    that OS loads several programs into the computer memory at the same time. The
    first program works as long as all resources it needs available. It stops executing
    once a required resource is busy. Then OS switches to another one.


    Here is an example. Suppose that your application waits to read data from your
    hard disk. While the disk controller reads the data, it is busy. It cannot process
    the following requests from the program. Thus, the application waits for the controller.
    In this case, OS stops executing and switches to the second program. The computer
    executes it to the end or until it has all the required resources. When the second
    program finishes or stops, OS switches tasks again.


    Multiprogramming differs from multitasking that modern OS have. Multiprogramming
    fits the batch processing mode well. However, this load balancing is not suitable
