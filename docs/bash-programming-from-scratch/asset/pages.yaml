    The graphical interface provides the same features. If you are solving simple
    tasks, the interface does not matter.


    The Bash interpreter provides several features that the GUI does not have. Thanks
    to them, Bash tasks are faster to perform in the command-line interface. If you
    have such a task, knowing Bash saves you time thanks to automation.


    We will take a look at the following Bash features:


    +   1. I/O redirection.

    2. Pipelines.

