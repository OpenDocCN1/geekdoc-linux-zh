  md: '# Application Software


    ![](img/10069385f0665422da9fa132eaf1027c_12_0.png)


    Figure 1-4. The interaction between the OS, an application and hardware


    According to Figure 1-4, the application does not interact with hardware directly.
    The program does through it through system libraries$^{23}$. The system libraries
    are part of the OS. There are rules to access the system libraries. Each application
    should follow them.


    Application Programming Interface$^{26}$ or API is the interface that the OS provides
    to an application to interact with system libraries. In general, the API term
    means a set of agreements for interacting components of the information system.
    These agreements become a well-known standard often. For example, the POSIX standard
    describes the API for portable OSes. The standard guarantees the compatibility
    of the OS and applications.


    OS kernel$^{27}$ and device drivers$^{28}$ are part of OS. They dictate which
    hardware features the application can access. When the application interacts with
    system libraries, the libraries request capabilities of kernel and drivers. If
    you need the hardware and OS does not support it, you cannot use it.


    When the application accesses the library, it calls a library’s function$^{29}$.
    A function is a program fragment or an independent block of code that performs
    a certain task. You can imagine


