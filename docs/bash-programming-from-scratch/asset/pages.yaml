  md: '# General Information


    What are the differences between the OS families? Windows and Linux are remarkable
    because they do not depend on the hardware. It means you can install them on any
    modern PC or laptop. macOS runs on Apple computers only. If you want to use macOS
    on different hardware, you need the unofficial modified version of OS.


    Hardware compatibility is an example of the design decision of the OS development.
    There are many such decisions. Together they define the features and design of
    each OS family.


    There is one more important point for software development besides the OS design.
    OS dictates the infrastructure for the programmer. The infrastructure means development
    tools. Tools for IDE, compiler, build system. Tools with OS API impose some design
    decisions for the applications. It leads to a specific culture for program development.
    Please keep in mind that you should develop applications for each OS. Take into
    account when you design your programs.


    Let’s consider the origins of software development cultures for Windows and Linux.


    # Windows


    Windows is proprietary software. The source code of such software is unavailable
    for users. You cannot read or modify it as you want. In other words, there is
    no legal way to know proprietary software more than its documentation tells you.


    If you want to install Windows on your computer, you should buy it from Microsoft.
    However, manufacturers of computers preinstall Windows on their devices often.
    In this case, the final cost of the computer includes the price of the OS.


    The target devices for Windows are relatively cheap PCs and laptops. Many people
    can buy such a device. Therefore, there is a huge market of potential users. Microsoft
