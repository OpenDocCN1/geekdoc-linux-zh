    After these two commands, both variables result and var store the integer 2. It
    means the prefix increment first adds one and returns the result.

    If you break the prefix into steps, you get the following commands:


    ```

    var=1

    ((var = var + 1))

    ((result = var))

    ```


    The postfix increment behaves differently. Here we change the increment''s form
    in our example:


    ```

    var=1

    ((result = var++))

    ```


    These commands write the integer 1 to the result variable and the integer 2 to
    the var variable. Thus, postfix increment returns the value first. Then it adds
    one.

    If you break the postfix increment into steps, you get the following commands:


    ```

    var=1

    ((tmp = var))

    ((var = var + 1))

    ((result = tmp))

    ```


    Note the order of steps in the postfix increment. First, it increments the var
    by one. Then it returns the past value of var. Therefore, the increment requires
    the temporary variable tmp to store the past value.

    The postfix and prefix forms of decrement work similarly to increment.

    Always use the prefix increment and decrement instead of the postfix form. First,
    the CPU performs them faster. The reason is it does not need to save the past
    value of the variable in the registers. Second, it is easier to make an error
    using the postfix form. It happens because of the non-obvious assignment order.'
