  md: 'Package Manager


    274


    pacman -Ss word


    The list of results will contain two packages:


    +   - mingw-w64-i686-antiword

    - mingw-w64-x86_64-antiword


    These are builds of the antiiword utility for 32-bit and 64-bit systems. The utility
    converts MS Word documents to text format.


    Run the command to install the package:


    ```

    pacman -S PACKAGE_NAME

    ```


    This command installs the antiiword utility:


    ```

    pacman -S mingw-w64-x86_64-antiword

    ```


    As a result, pacman will install antiiword and all the packages that it needs
    for running.

    Now you can launch the antiiword utility by the following command:


    ```

    antiiword

    ```


    You have installed a package in the system. If it becomes unnecessary, uninstall
    it. The package manager will uninstall all dependencies of the package if other
    applications do not use them.

    This is the command to uninstall a package:


    ```

    pacman -Rs PACKAGE_NAME

    ```


    This command uninstalls the antiiword utility:


    ```

    pacman -Rs mingw-w64-x86_64-antiword

    ```


    Suppose you have installed several packages in your system. After a while, their
    new versions appear in the repository. You decide to upgrade your packages to
    the new versions. The following command is:


    ```

    pacman -Syu

    ```


    The command updates all installed packages to their actual version the basic pacman
    commands. Other package managers work along the same lines. They follow the same
    steps as pacman to install and remove packages. The only differences are their
    name and their command-line parameters.


    Table 4-1 shows the commands for working with packages in different Linux distributions.'
