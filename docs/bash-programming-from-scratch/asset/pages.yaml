    The developers introduced associative arrays in the 4th version of Bash. The elements''
    indices are not numbers but strings in such arrays. This kind of string-index
    is called key. The associative array gives you a string-value by string-index.
    When is this useful?


    Here is an example. Suppose we write a script that stores the list of contacts.
    The script adds a person''s name, email or phone number to the list. We can omit
