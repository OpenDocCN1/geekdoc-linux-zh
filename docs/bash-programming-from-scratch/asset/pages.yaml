    The first parameter of `find` is the directory to search in. The utility accepts
    relative and absolute paths. For example, the following command shows the contents
    of the root directory:


    ```

    find /

    ```


    You can specify search conditions starting from the second parameter. If the found
    object does not meet these conditions, `find` does not print it. The conditions
    form a single expression. The utility has an embedded interpreter that processes
    this expression.


    An example of the find condition is the specific filename. When you call the utility
    with such a condition, it prints the found files with this name only.


    Table 2-3 shows the format of commonly used conditions for the `find` utility.'
