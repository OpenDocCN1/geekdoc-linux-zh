  md: '# General Information


    The tabulator loads input data for computation from punched cards¹. These cards
    look like sheets of thick paper with punched holes. A human operator prepares
    these sheets manually and stacks them in special receivers. The sheets are threaded
    on the needles in the receivers. Then a short circuit happens in each punched
    hole. Each circuit increases the mechanical counter, which is a rotating cylinder.
    The tabulator displays calculation results on dials that resemble watches.


    Figure 1-1 shows the tabulator that Hermann Hollerith has constructed.


    ![](img/10069385f0665422da9fa132eaf1027c_7_0.png)


    Figure 1-1. Hollerith tabulating machine


    By modern standards, the tabulator works very slowly. There are several reasons
    for this. The first one is you need a lot of manual work. At the beginning, you
    should prepare input data. There was no way to punch the cards automatically.
    Then you manually load punched cards into the receivers. Both operations require
    significant efforts and time.


    The second reason for low computation speed is mechanical parts. The tabulator
    contains many of them: needs to read data, rotating cylinders as counters, dials
    to output the result. All these mechanics work slowly. It takes about one second
    to perform one elementary operation. No automation can accelerate these processes.


    If you look at how the tabulator works, you find no place for OS. Just does not
    have any tasks to do on such a kind of computer.


    Tabulators used rotating cylinders for performing calculations. The next generation
    of computers replaced the cylinders with relays². A relay is a mechanical element
    that changes its state due to an electric current.


    The German engineer Konrad Zuse³ designed the first relay computers¹⁴ called Z2
    in 1939. He improved the computer in 1941 and called it Z3. These machines perform
    a single


