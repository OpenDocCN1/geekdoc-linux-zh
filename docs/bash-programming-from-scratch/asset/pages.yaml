    The full form of parameter expansion helps when the variable has not been defined.
    In that case, you can insert the specified value instead. Do it like this:


    ```

    cp file.txt "${directory:-}"

    ```


    Here Bash checks if the directory variable is defined and has a non-empty value.
    If it is, Bash performs a regular parameter expansion. Otherwise, it inserts the
    value that follows the minus character. It is the user''s home directory in our
    example.


    The full form of parameter expansion has several variations. Table 3-3 shows all
    of them.


    Table 3-3. The full form of parameter expansion


    | Variation | Description |

    | --- | --- |

    | ${parameter:-word} | If the "parameter" variable is not declared or has an empty
    value, Bash inserts the specified "word" value. Otherwise, it inserts the variable''s
    value. |

    | ${parameter:=word} | If a variable is not declared or has an empty value, Bash
    assigns it the specified value. Then it inserts this value. Otherwise, Bash inserts
    the variable''s value. You cannot override positional and special parameters in
    this way. |

    | ${parameter?word} | If the variable is not declared or has an empty value, Bash
    prints the specified value on the error stream. Otherwise, it terminates the script
    with a non-zero exit status. Otherwise, Bash inserts the variable''s value. |

    | ${parameter:+word} | If the variable is not declared or has an empty value,
    Bash skips the expansion. Otherwise, it inserts the specified value. |'
