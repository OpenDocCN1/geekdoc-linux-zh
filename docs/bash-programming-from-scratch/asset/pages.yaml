  md: '# General Information


    This chapter explains the basics of how a computer works. It starts with describing
    operating systems and their history. Then the chapter considers families of modern
    operating systems and their features. The last section explains a computer program
    and its execution.


    # Operating Systems


    # History of OS Origin


    Most of the computer users understand why operating system (OS) is needed. Before
    launching a new application, they usually check its system requirements. These
    requirements specify hardware and operating system that a user needs to launch
    the application.


    The system requirements give us the idea that the OS is a software platform. The
    application requires this platform for correct working. But where does this requirement
    come from? Why can’t you buy a computer and launch the application without any
    OS?


    Our questions seem meaningless at first brush. But let''s consider from the following
    point of view. Modern operating systems are multipurpose, and they offer many
    features. Each specific user would not use most of these features. However, you
    cannot disable them. The OS utilizes the user’s resources intensively for maintaining
    its features. As a result, the user has much fewer computer resources for his
    applications. This overhead leads to the computer’s slow work, handling of the
    programs, and rebooting the whole system.


    Let’s turn to history to find out the origins of operating systems. The first
    commercial computer was called GM-NAA I/O. It appeared for the computer IBM 704
    in 1956. All earlier computers have worked without OS. Why didn’t they need it?


    The main reason for having an OS is high computational performance. For example,
    let’s consider the first electromechanical computer. Herman Hollerith constructed
    it in 1890. This computer was called a tabulator. It does not require an OS and
    a program in the modern sense. The tabulator performs a limited set of arithmetic
    operations. Its hardware design defines this set of operations.


