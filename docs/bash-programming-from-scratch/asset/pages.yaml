    ```


    The /usr path searches text files. So, there is no reason to check other system
    paths.

    Now let''s count the number of lines in the found files. We should add the -exec
    action with the wc utility to do this. The resulting command looks like this:


    ```

    find /usr -name "*.txt" -exec wc -l +

    ```


    You can find all text files on the disk if you start searching from the root directory.
    Here is the example:


    ```

    find / -name "*.txt"

    ```


    If you add the wc to the command, it fails when searching in the MSYS2 environment.
    In other words, the command does not work:


    ```

