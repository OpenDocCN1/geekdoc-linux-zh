    However, this mode was inconvenient for development and debugging applications.


    +   Debugging a program is searching and eliminating its errors.


    Suppose that you are writing a program for the computer with batch processing.
    You should prepare your code and write it to the storage device. When the device
    is ready, you put it in a queue. The computer''s operator takes devices from the
    queue and loads them to the computer one by one. Therefore, your task can wait
    in the queue for several hours. Now assume an error happened in your program.
    In this case, you should fix it, prepare the new version of the program and write
    it to the device. You put it in the queue again and wait for hours. Because of
    this workflow, you need several days to make even a small program working.


    The software development differs when you use an interactive mode. You prepare
    your program and load it to the computer. It launches the program and shows you
    results. You can analyze a possible error, fix it and relaunch the program. This
    workflow accelerates software development and debugging tasks significantly. Now
    you spend fewer hours on the task that requires days with batch processing.


    The interactive mode brought new challenges for computer engineers. This mode
    requires the system to reacts to users actions immediately. And providing a short
    reaction time required a new load-balancing mechanism. The multitasking concept
    became a solution for this task.


