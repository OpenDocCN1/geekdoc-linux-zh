    both tasks. It is called loader$^{139}$. Thanks to preloading libraries, the CPU
    does not idle too much when the program accesses them. The instructions of the
    required library are already in RAM. Therefore, the CPU waits for a few clock
    cycles to access. When the loader finishes his job, the program becomes a process.
