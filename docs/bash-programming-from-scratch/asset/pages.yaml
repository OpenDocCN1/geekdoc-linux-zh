    KEYWORD | yum search KEYWORD | dnf search KEYWORD |

    | Install the package from the repository | pacman -S PACKAGE_NAME | apt-get install
    PACKAGE_NAME | yum install PACKAGE_NAME | dnf install PACKAGE_NAME |

    | Install the package from the local file | pacman -U FILENAME | dpkg -i FILENAME
    | yum install FILENAME | dnf install FILENAME |

    | Remove the installed package | pacman -Rs PACKAGE_NAME | apt-get remove PACKAGE_NAME
    | yum remove PACKAGE_NAME | dnf erase PACKAGE_NAME |

    | Update all installed packages | pacman -Syu | apt-get upgrade | yum update |
    dnf upgrade |'
