- img_proc: true
  md: '# Table 2-3. Commonly used conditions for the find utility


    | Condition | Meaning | Example |

    | --- | --- | --- |

    | -type f | Search files only. | find -type f |

    | -type d | Search directories. | find -type d |

    | -name <pattern> | Search for a file or directory with the name that matches
    a glob pattern¹¹⁹⁰. The pattern is case-sensitive. | find -name README find -name
    READ* find -name READ?? |

    | -iname <pattern> | Search for a file or directory with the name that matches
    a glob pattern. The pattern is case-insensitive. | find -iname readme |

    | -path <pattern> | Search for a file or directory with the path that matches
    a glob pattern. The pattern is case-insensitive. | find -path */doc/bash/* |

    | -ipath <pattern> | Search for a file or directory with the path that matches
    a glob pattern. The pattern is case-insensitive. | find -ipath */DOC/BASH/* |

    | -a or -and | Combine several using the logical AND. If the found object fits
    all conditions, the utility prints it. | find -name README -a -path */doc/bash/*
    |

    | -o or -or | Combine several using the logical OR. If the object fits at least
    one condition, the utility prints it. | find -name README -o -path */doc/bash/*
    |

    | ! or -not | The logical negation (NOT) of the condition. If the object does
    not fit the condition, the utility prints it. | find -name README find ! -name
    README |


    A glob pattern is a search query that contains wildcard characters¹¹⁹⁰ Bash allows
    three wildcard characters: *, ?, and []. The asterisk stands for any number of
    any characters. A question mark means a single character of any. The string README
    matches all following patterns:


    Here is an example of glob patterns:


    +   * *ME

    * READ?

    * *M?

    * R*M*


