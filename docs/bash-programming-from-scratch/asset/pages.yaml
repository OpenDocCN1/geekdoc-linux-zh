  md: '# General Memory


    +   1. Access speed defines the amount of data that you can read or write to the
    device per unit of time. Units of measure are bytes per second (KBps).


    +   2. Capacity is the maximum amount of data that a device can store. The units
    are bytes.


    +   3. Cost is the price of a device exceeding its capacity. The units are dollars
    or cents per byte or bit.


    +   4. Access time is the time between the moment when the process needs some
    data from the device and when it receives them. Units are clock signals$^{116}$
    of the CPU.


    These parameters vary for devices on each level of the memory hierarchy. Table
    1-3 shows the ratio of parameters for modern storage devices.


    # Table 1-3. Memory levels


    | Level | Capacity | Access speed | Access time | Cost |

    |---|---|---|---|-|

    | 1 | CPU registers$^{119}$ | up to 1000 bytes | - | 1 tick | - |

    | 2 | CPU cache$^{120}$ | from one KB to several MB | from 700 to 100 Gbps | 2
    to 100 cycles | - |

    | 3 | RAM | dozens of GB | 10 GBps | up to 1000 clock cycles | $10$/byte |

    | 4 | Disk (hard drive$^{121}$ or solid drive$^{122}$) | several TB | 2000 Mbps
    | up to 10000000 cycles | $12$/byte |


    Table 1-3 raises questions. You can read the data from the disk drive at high
    speed. Why is there no way to read these data to the CPU registers directly? The
    high speed is not so crucial for performance in practice. The critical parameter
    here is the access time. It measures the idle time of the CPU until it receives
    the required data. You can measure this idle time in clock signals or cycles.
    Such a signal synchronizes all operations of the processor. The CPU requires 1
    to 100 clock cycles to execute one instruction of the program.


    High access time can cause serious performance issues. For example, suppose that
    the CPU reads the program instructions directly from the hard disk. The problem
    happens because CPU registers have a small capacity. There is no chance to load
    the whole program from the hard disk to the registers. Therefore, the CPU did
    not part any of the program, it should load the next one. This loading operation
    takes up to 10000000 clock cycles. Its loading data from the disk takes a much
    longer time than processing them. The CPU spends most of the idle time. The memory
    hierarchy solves this problem.


    Let''s consider data flow between memory levels. For example, suppose you launch
    a sample program. It reads a file from the hard disk and displays its contents
    on the screen. Reading data


