  md: '# Finalwords


    We finish our introduction to Bash. We have covered the basics of the language
    only. This book leaves many topics out of the scope, They are required for advanced
    Bash development. Most probably, you would not need them for daily work with a
    computer.


    These advanced topics can be interesting for if you want to go deeper in Bash:


    +   - Manipulating Strings³⁶⁶⁵.

    - Regular Expressions³⁶⁶⁶.

    - The stream editor³⁶⁶⁷.

    - The awk text processing language³⁶⁶⁸.


    These topics are important. They are material for advanced study. You can skip
    them if you are using Bash for simple tasks and basic automation. Learn these
    topics if you are to write complex applications in Bash.


    Perhaps you enjoyed programming. You found it useful. What to do after reading
    this book?


    First of all, let''s admit that Bash is not a general-purpose programming language.
    This term refers to languages for developing applications in various domains³⁶⁶⁷.
    Such languages do not contain constructs that are useful for one domain and useless
    in another.


    Bash is the domain-specific language³⁷⁰. Does that mean it is useless? No, it
    does not. Bash is a powerful auxiliary tool for software developer. Today it is
    used for integrating large projects, building software and automating routine
    tasks. You would not find a commercial project written in Bash only. This language
    copes well with what it was created. But it is inferior to modern general-purpose
    languages in many domains.


    Nobody creates a programming language just for fun. Its author faced some tasks.
    The languages existing at that time were not suitable to solve them. Then this
    developer wrote the new language that is focused on specific tasks. Therefore,
    modern general-purpose languages have advantages in a few domains. No language
    fits any type of task perfectly. This leads that the application you dictates
    the language for software development.


    So, you have read this book. Now it is time to choose an domain that interests
    you. Read articles on the Internet. Think about it: which area of software development
    is right for you? Only after answering this question, choose a programming language
    for study.


