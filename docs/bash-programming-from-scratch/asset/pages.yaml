    # I/O Redirection


    GNU utilities follow the Unix philosophy. They use a text format for input and
    output. Therefore, they are just as easy to combine as Unix utilities.


    When combining utilities, there is a task to pass text data between them. The
    task has several solutions.


    Suppose the output of a utility fits one line. You need to pass it to another
    utility. Using the clipboard is the simplest solution here. Here are the steps
    to take it:


    +   1. Select the utility output with the mouse.

    2. Type the command to call another utility.

    3. Paste the contents from the clipboard at the end.

    4. Launch the command.


    This simple method does not work for copying multiple lines. When you paste them,
    Bash handles line breaks as delimiter. It executes the command right after receiving
    the delimiter. Because of this, the shell loses copied lines.


    Another solution is to use the file system. Create a temporary file to save the
    utility output. When you pass the file name to another utility. It will read its
    contents and retrieve the data. This approach is more convenient than the clipboard
    for two reasons:


