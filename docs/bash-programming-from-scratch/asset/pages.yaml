    the API as a list of all available functions that the application can call. Besides,
    API describes the following aspects of the interaction between the OS and applications:


    +   1. What action does the OS perform when the application calls the specific
    system function?

    2. What data does the function receive as input?

    3. What data does the function return as a result?


    Both the OS and application should follow the API agreements. It guarantees compatibility
    of their current versions and future modifications. Such compatibility is impossible
    without a well-documented and standardized interface.


    We have discovered that some applications work without the OS. They are bare-metal
    software$^{30}$. This approach works well in some cases. However, the OS provides
    ready-made solutions for interaction with the computer''s hardware. With those
    solutions, developers should take responsibility for managing hardware. It requires
    significant efforts. Imagine the variety of devices of a modern computer. The
    application should support popular models of each device (for example, video cards).
    Without support, the application would not work for all users.


    Let''s consider the features that the OS provides via the API. We can treat the
    computer''s hardware resources as these resources for performing calculations.
    The API reflects the list of hardware features that the program can use. Also,
    the API dictates the order of interaction between several applications and the
    hardware.


    There is an. Two programs write data to the same area of the hard disk$^{31}$
    simultaneously. There are two reasons for that:


    +   1. A single magnetic head records data on the hard disk. The head can do one
    task at a time.

    2. One program can overwrite data of another program in the same memory area.
    It leads to losing data.


    You should place all requests to write data on the disk in a queue because of
    these problems. Each request should be performed separately. The OS takes care
    of this.


    The kernel (see Figure 1-4) of the OS provides a mechanism for managing access
    to the hard drive. This mechanism is called file system$^{32}$. Similarly, the
    OS manages access to all peripheral$^{33}$ and internal devices of the computer.
    Besides kernel, there are special programs called device drivers (see Figure 1-4).
    They help the OS to control devices.


