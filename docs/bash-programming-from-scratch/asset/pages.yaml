    # Scope


    Environment Variables are divided into scopes (scope) in any software system.
    A scope is a part of a program or system where the variable name remains associated
    with its value. In other words, you can convert the variable name into the address
    in the scope of that variable only. Outside the scope, the same name can point
    to another variable.


    A scope is called global if it spreads to the whole system. For example, the variable
    called filename is in the global scope. You can access it by its name from any
    part of the system.


    Bash keeps all its internal variables in the global scope. They are called environment
    variables. It means that all internal variables are environment variables. The
    user can declare his variable in the global scope. Then it becomes an environment
    variable.


    Why does Bash store variables in the global scope? It happens because Unix has
    a special set of settings. They affect the behavior of the applications users
    run. An example is local settings. According to them, each running adapts its
    interface. Applications share such kinds of settings through environment variables.


    Suppose one process spawns a child process. The process process inherits environment
    variables of the parent. Thus, all utilities and applications launched from the
    shell inherit its environment variables. This way, global Unix settings are spread
    to all user programs.


    The child process can change its environment variables. Then it spawns another
    process. This new process inherits the changed variables. However, when the child
    changes its environment variables, it does not affect the corresponding variables
    of the parent process.


