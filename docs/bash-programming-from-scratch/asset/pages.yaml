    # Demand of the CLI


    Why would somebody learn the command-line interface (CLI) today? It appeared 40
    years ago for computers that are slower than today. The graphical interface supplanted
    CLI on PCs and laptops. Everybody prefers to use GUI nowadays.


    The CLI seems to be outdated. However, this statement is wrong. It should be a
    reason why developers include Bash in all modern macOS and Linux distributions.
    Windows also has a command shell called Cmd.exe. Microsoft has replaced it with
    PowerShell in 2006. Just think about this fact. The developer of the most popular
    OS has created a new command shell in the 2000s. All these points confirm that
    CLI is still in demand.


    What does the shell perform in modern OS? The OS consists of the kernel and software
    modules. These modules are libraries, services and system utilities. Most of the
    modules have settings and special modes of operation. You do not need them in
    your daily work. Therefore, you cannot access these settings via GUI in most cases.


    > Bash shell has good integration with Linux and macOS. You can access most OS
    functions using Bash there. However, it does not work with Windows smoothly. Microsoft
    offers you your PowerShell. We study Bash in this book for two reasons. First,
    it is compatible with the POSIX standard. Second, Bash is more common than PowerShell.
    You can use it on all modern OS.


    If the OS fails, you would need systems to recover it. They have a command-line
    interface because a GUI is often not available after the failure.

    Besides the administration, you would need CLI when connecting computers over
    a network. There are GUI programs for such connection. The examples are TeamViewer
    and Remote Desktop. They require a stable and fast network connection for working
    well. If the connection is not reliable, these programs are also fail off. The
    command interface does not have a limitation. The remote server receives your
    command even if the link is poor.


    You can say that a regular user does not need for administration tasks and network
    connections. Even if you do not have tasks, using command shell speeds up your
    daily work with the computer. Here are few that you can do more with CLI than
