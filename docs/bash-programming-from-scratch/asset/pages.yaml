    Typing is a bad idea you can make a mistake easily.


    The Bash history saves all commands that you execute in the terminal. Each user
    has this file

    in his home directory. Its path is ~/.bash_history. When you press Ctrl+R keys
    in the terminal,

    Bash calls the quick search over the history file. You can quickly find the required
    command

    this way.


    We can use the history file for storing the backup command permanently. You can
    find and

    execute the command every time you need it. This solution seems to be reliable
    and convenient.

    Don''t jump to conclusions. Let''s take a look at all possible problems.


    First, the history has a limit size. By default, the file saves only the 500 most
    recently executed

    commands. If this number is exceeded, each new command overwrites the oldest ones
    in the file.

    This way, you can accidentally lose the backup.


    It is possible to increase the maximum size of the history file. What size would
    be enough?

    Whatever size we choose, there is a risk of exceeding it. There is an option to
    remove the size

    limitation at all. Then the history file saves all commands without overwriting
    the old ones.


    It seems we find a way to store the backup command effectively. The Bash history
    file with unlimited

    size does it. Could this solve any problems?


    Suppose you use Bash for a couple of years. All commands you entered during this
    time

    in ~/.bash_history file. If you execute the command twice, it appears in the file
    twice.

    Therefore, the file size will reach hundreds of megabytes in two years. You do
    not need most of these

    commands. Instead, only a small part of them are needed for regular usage. It
    leads to inefficient

    h of disk space.


    You might argue that storing the extra hundred megabytes is not a problem for
    modern

    computers. Yes, it is true. But there is an overhead that you miss. When you press
    Ctrl+R, Bash

    searches the command in the entire ~/.bash_history file. The larger it is, the
    longer the search takes.

    Over time, you will wait several seconds even on a powerful computer.'
