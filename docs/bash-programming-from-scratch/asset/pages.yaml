    # Modern OSes


    We have reviewed the OS features in general. Now we will consider modern operating
    systems. Today you can pick any OS and get very similar features. However, their
    developers follow different approaches. This leads to implementation difference
    that can be important for some users.


    There is the software architecture³⁸ term. It means the implementation aspects
    of the specific software and the solutions that led to it.


    All modern OSes have two features that determine the way how users interact with
    them. These features are multitasking and the graphical user interface. Let’s
    take a closer at them.


    # Multitasking


    All modern OSes support multitasking³⁹. It means they can execute multiple programs
    in parallel. The systems with this displaced OSes without it. Why does multitasking
    so important?


    The challenge of efficient usage of computers in the 1960s. Computers were expensive
    at that time. Only companies and universities were able to buy them. These organizations
    counted every minute of working with their machines. They did not accept any idle
    time of the hardware because of its huge cost.


    Early operating systems executed programs one after another without delays. This
    approach saves time for switching computer tasks. If you use an OS, you should
    prepare several programs and their input data in advance. You should write them
    on the storage device (e.g., magnetic tape). You load the tape to the computer’s
    reading device. Afterward, the computer executes the programs sequentially and
    presents their results to an output device (e.g., a printer). This mode of operation
    is called batch processing⁰.


    Batch processing increased the efficiency of using computers in the 1960s. This
    approach has automated program loading. The human operators became unnecessary
    for this task. However, the computers still bottleneck⁴¹. The computational power
    of processors was increasing


