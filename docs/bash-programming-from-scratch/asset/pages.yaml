  md: '# Logic Expressions


    The search conditions of the find utility are Boolean expressions¹⁹².. A Boolean
    expression is a programming language statement. It produces a Boolean value when
    evaluated. This value equals either "true" or "false".


    The find is a statement of the utility''s language. It produces the "true" value
    if the found object meets its requirement. Otherwise, the condition produces "false".
    If there are several conditions in the find, they make a single compound Boolean
    expression.


    When we have considered the binary numeral system, we already met Boolean algebra.
    This section of mathematics studies logical operators¹⁹³. They differ from the
    arithmetic operations: addition, subtraction, multiplication, and division.


    You can apply a logical operator to Boolean values or expressions. Using an arithmetic
    operation does not make sense in point A. Addition or subtraction is trivial for
    Boolean values. It yields nothing. When you apply a logical operator, you get
    a condition with strict evaluation rules. This way, you search search for the
    find utility. When you combine several conditions, you get a program with complex
    behavior.


    An operand is an object of a logical operator. Boolean values and expressions
    can be operands.

    Let''s consider Boolean expressions using an example. The example is not related
    to the find utility or Bash for simplicity. Imagine that you are programming a
    robot for a warehouse. Its job is to move boxes from point A to point B. You can
    write the following straightforward algorithm for the robot:


    +   1. Move up to point A.

    2. Pick up the box at point A.

    3. Move to point B.

    4. Put the box at point B.


    This algorithm does not have any conditions. It means the robot performs each
    step independently of elements.


    Now imagine that an obstacle happens in the robot''s way. For example, another
    robot stuck there. Executing your algorithm leads to the collision of the robots
    in this case. You should add a condition to the algorithm to prevent the collision.
    For example, it can look like this:


    +   1. Move to point A.

    2. Pick up the box at point A.

    3. If there is no obstacle, move to point B. Otherwise, stop.

    4. Put the box at point B.


    > ¹⁹https://en.wikipedia.org/wiki/Boolean_expression

    ¹⁹https://en.wikipedia.org/wiki/Logical_connective'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Bash Shell 72


    The third step of the algorithm is called conditional statement¹⁹⁴. All modern
    programming languages have such a statement.


    The conditional statement works according to the following algorithm:


    +   1. Evaluate the Boolean expression in the condition.

    2. If the expression produces "true", perform the first action.

    3. If the expression produces "false", perform the second action.


    The robot evaluates the value of the Boolean expression "there is no obstacle"
    in our example. If there is an obstacle, the expression produces "false" and the
    robot stops. Otherwise, the robot moves to point B.


    When writing the conditional statement, you can combine several Boolean expressions
    using logical operators. Here is an example. Suppose the robot tries to pick up
    a box at A, but there is no box. Then there is no reason for him to move to point
    B. You can check this situation in the conditional statement. Then add the new
    Boolean expression using logical AND¹⁹⁵ (conjunction). Then the robot''s algorithm
    becomes like this:


    +   1. Move to point A.

    2. Pick up the box at point A.

    3. If there is a box AND no obstacle, move to point B. Otherwise, stop.

    4. Put the box at point B.


    Logical operators produce Boolean values when evaluated. In our example, the result
    of a logical AND equals "true" when both operands are "true". It happens when
    the robot has a box and there is no obstacle on its way. Otherwise, the result
    of logical AND equals "false". It forces the robot to stop.


    You have used two logical operators when learning the find utility. These operators
    are OR¹⁹⁶ (disjunction) and NOT¹⁹⁷ (negation).


    Actually, you have already applied logical NOT in the robot''s algorithm. It strictly
    implies in the expression "there is no obstacle". It equals the following negation:
    "there is NOT an obstacle". You can specify the logical NOT in the algorithm this
    way:


    +   1. Move to point A.

    2. Pick up the box at point A.

    3. If there is a box AND is NOT an obstacle, move to point B. Otherwise, stop.

    4. Put the box at point B.


    > ¹⁹⁴https://en.wikipedia.org/wiki/Conditional_(computer_programming)

    ¹⁹⁵https://en.wikipedia.org/wiki/Logical_conjunction

    ¹⁹⁶https://en.wikipedia.org/wiki/Logical_disjunction

    ¹⁹⁷https://en.wikipedia.org/wiki/Negation'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Bash Shell


    You can always replace logical AND by OR with some extra changes. Let''s do it
    for our example and keep the robot''s behavior the same. You should add the negation
    to the first Boolean expression and remove it from the second one. Also, you have
    to change the order of actions in the conditional statement. If the condition
    produces "true", the robot stops. If it produces "false", the robot moves to point
    B. The new algorithm shows this:


    +   - Move to point A.

    - Pick up the box at point A.

    - If there is NOT a box OR there is an obstacle, stop. Otherwise, move to point
    B.

    - Put the box at point B.


    Read the new conditional statement carefully. The robot follows the same decisions
    as before. It stops if it has no box or if there is an obstacle on its way. You
    have exchanged the logical AND to OR. This trick helps you keep your conditional
    statements clear. Choose between logical AND and OR depending on your Boolean
    expressions. Pick one that fits your case better.


    You wrote the Boolean expressions as sentences in English or for example. Such
    a sounds unnatural. You have to read it several times to understand it. This happens
    because the natural humans'' language is not suitable for writing Boolean expressions.
    This language is not accurate enough. Boolean algebra uses mathematical notation
    for that reason.


    We have considered logical AND, OR and NOT. You will deal with three more operators
    in programming:


    +   - Equivalence

    - Non-equivalence

    - Exclusive OR


    Table 2-5 explains them.


    Table 2-5. Logical operators


    | Operator | Evaluation Rule |

    | --- | --- |

    | AND | It produces "true" when both operands are "true". |

    | OR | It produces "true" when any of the operands is "true". It produces "false"
    when all operands are "false". |

    | NOT | It produces "true" when the operand is "false" and vice versa. |

    | Exclusive OR (XOR) | It produces "true" when the operands have different values
    (true-false or false-true). It produces "false" when the operands are the same
    (true-true, false-false). |

    | Equivalence | It produces "true" when the operands have the same values. |

    | Non-equivalence | It produces "true" when the values of the operands differ.
    |'
