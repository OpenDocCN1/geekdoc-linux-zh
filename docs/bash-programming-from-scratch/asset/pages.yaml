  md: '# Package Manager


    We are already familiar with the basic Bash built-in commands and the standard
    set of GNU utilities. These tools are installed in the Unix environment by default.
    It can happen that their features are not enough to solve your task. You can solve
    this problem by installing additional programs and utilities.


    Installing software in the Unix environment is not the same as in Windows. Let''s
    look at how to properly install and update software in any Unix environment or
    Linux distribution.


    # Repository


    Whenever you install software in the Unix environment, you should use repository³.
    A repository is a server that stores all available applications. Maintainers take
    open of these applications and build them. Most maintainers are volunteers and
    free software enthusiasts.


    The repository stores each application as a separate file. This file has a special
    format. The format depends on the Linux distribution. Each Linux distribution
    has its own repository. Examples of the formats are deb, RPM, zst, etc. Each file
    with an application is called a package. A package is a unit for installing software
    in a system.


    The repository stores packages with applications and libraries. Besides, the repository
    has meta-information about all packages. One or more files store this meta-information.
    They are called the package index.


    You can install packages in a Unix environment from several repositories at once.
    For example, one repository provides new versions of packages, and offers special
    builds of them. Depending on your requirements, you can choose the repository
    for installing the package.


    # Package Operating


    The Unix environment provides a special program to work with the repository. It
    is called package manager⁴.


    Why does the Unix environment need a package manager? For example, Windows does
    not have one. Users of this OS download programs from the Internet and install
    them manually.


    The package manager installs and removes packages in the Unix environment. Its
    main task is to keep track of package dependencies. Suppose a program from one
    package uses features of an application or library from another package. Then
    the first package depends on the second one.


    > ³https://help.ubuntu.com/community/Repositories


    > ⁴https://en.wikipedia.org/wiki/Package_manager'
  merge: -1
  pgno: 275
