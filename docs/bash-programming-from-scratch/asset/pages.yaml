  md: "# Bash Scripts\n\nWill the check_license function run correctly? Yes. It happens\
    \ thanks to hiding a global variable. This mechanism works in the following way.\
    \ When Bash meets the filename variable in the function's body, it accesses the\
    \ local variable instead of the global one. It happens because the local variable\
    \ is declared later than the global one. Because of the hiding mechanism in the\
    \ function's body, you cannot access the global filename there.\n\nAccidental\
    \ hiding of global variables leads to errors. Try to avoid any possibility of\
    \ getting such a situation. To do this, add a prefix or suffix for local variables.\
    \ For example, it can be an underscore at the end of the name.\n\nA global variable\
    \ becomes unavailable in a function's body only after declaring the local variable\
    \ with the same name. Consider the following variant of the check_license function:\n\
    \n```\n#!/bin/bash\nfilename=\"$1\"\ncheck_license() {\n  local filename=\"$filename\"\
    \n  grep \"General Public License\" \"$filename\"\n}\n```\n\nHere we initialize\
    \ the local variable filename by the value of a global variable with the same\
    \ name. This assignment operation works as expected. It happens because Bash does\
    \ parameter expansion before executing the assignment.\n\nSuppose that you rename\
    \ the README to the script. Then the assignment looks like this after parameter\
