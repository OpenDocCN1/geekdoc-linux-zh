  md: '# Exercise 3-5. The [[ operator


    Let''s compare the contents of the two directories. The result of the comparison
    is a list of files that are different.


    First, we have to go through all the files in each directory. The `find` utility
    does this task. Here is a command to search files in the `dir` directory:


    ```

    find dir1 -type f

    ```


    The command''s output can look like this:


    ```

    dir1/test3.txt

    dir1/test1.txt

    dir1/test2.txt

    ```


    We get a list of files in the `dir` directory. We should check that each of them
    presents in the `dir2` directory. Adding the following `-exec` action for this
    check:


    ```

    cd dir1

    find . -type f -exec test ../dir2/{} \;

    ```


    Here we use the command instead of the [[ operator. The reason is the built-in
    interpreter of the find utility cannot handle this operator correctly. This is
    one of the exceptions where [[ must be replaced by the test command. In general,
    we prefer the `[[` operator.


    If the `dir2` directory does not contain some file, let''s print its name. We
    need two things for doing that: the first is inverting the test command''s result.
    Then we should add the second `-exec` action with the `echo` command call. Place
    the logical AND between these two actions. This way, we get the following command:


    ```

    cd dir1

    find . -type f -exec test ! -e ../dir2/{} \ -a -exec echo {} \;

    ```


    We found files of the `dir1` directory that miss in `dir2`. Now we should do vice
    versa. The similar find can print `dir2` files that miss in `dir1`.


    Listing 5-3 shows the complete `dir-diff.sh` script for directory comparison.'
