  md: '# Bash Scripts


    The last step is the most confusing. When script completes successfully, the script
    does one action only. When an error happens, there are two actions. These actions
    are combined into the single command block^294 by curly brackets^295. This code
    block looks confusing.


    The if statement is a solution for executing command blocks on specific conditions.
    We can run the script in the general form like this:


    ```

    if CONDITION

    then

    ACTION

    fi

    ```


    You can write this statement in one line too. For doing that, add a semicolon
    before the then and fi words like this:


    ```

    if CONDITION; then ACTION; fi

    ```


    Both the CONDITION and ACTION are a single command or a block of commands. If
    the CONDITION completes successfully with the zeroed exit status, Bash executes
    the ACTION.

    Here is an example of the if statement:


    ```

    if cmp file1.txt file2.txt > /dev/null

    then

    echo "Files file1.txt and file2.txt are identical"

    fi

    ```


    The CONDITION here is the cmp utility. The utility compares the contents of two
    files. If they differ, cmp prints the position of the first character that is
    different. The exit status is non-zero in case. If the files are the same, the
    utility returns the zero status.


    When we call a utility in the if condition, its exit status matters only. Therefore,
    we redirect the cmp output to the /dev/null^296 file. It is a special file. Writing
    always succeeds. OS deletes all data that you write.


    If the contents of the file1.txt and file2.txt match, the cmp utility returns
    the zero status. Then the if equals "true", the echo command prints the message.


    We have considered a simple case. When the condition is met, the script does an
    action. But there are cases where a condition selects one of two possible actions.
    The if-else statement works in this way. Here is the statement in the general
    form:


