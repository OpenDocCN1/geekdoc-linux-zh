    # Exercise 3-2. The full form of parameter expansion


    The find utility searches for files recursively. It starts from the specified
    path and passes through subdirectories. Use the -maxdepth option to exclude subdirectories
    from the search.


    The command for searching TXT files in the current directory looks like:


    ```

    find . -maxdepth 1 -type f -name "*.txt"

    ```


    Let''s add an action to copy the files to the user''s home directory. The command
    became this:


    ```

    find . -maxdepth 1 -type f -name "*.txt" -exec cp -t {} \;

    ```


    Now create a script and name it copy.sh. Your copy should receive an input parameter.
    The parameter defines an action to apply for each found file. There are two possible
    actions: copy or move. It is convenient to use the utility''s name as a parameter.
    Then it can be cp or mv. The script will call the utility by its name.


    According to our idea, the script copies the files when it is called like this:'
