    elementary operation in milliseconds. They are much faster than tabulators. This
    performance gain happens thanks to relaying instead of rotating cylinders.


    The increased computation speed is the first feature of Zuse''s computers. The
    second feature is the concept of a computer program. The idea of the universal
    machine, which follows the algorithm¹¹ you choose, was fundamentally new at that
    time.


    An algorithm is a finite sequence of instructions to perform a particular calculation
    or task.


    Z3 computer uses two input devices in parallel for supporting programs. The first
    one is a receiver for punched cards that resembles the tabulator''s receiver to
    execute from the code. The second input device is the keyboard. It allows the
    user to type input data for the program.


    The computers with the feature of changing their algorithms known as programmable¹²
    or general-purpose.


    The invention of programmable computers was a milestone in the development of
    computer science. Until this moment, machines were able to perform highly specialized
    tasks only. The construction of these machines was too expensive and unprofitable.
    This was a reason commercial investors did not join the projects to design new
    computers. Only governments invested money there. However, this situation has
    changed since programmable computers came.


    The next step in computer design is the construction of the ENIAC¹³ (see Figure
    1-2) computer in 1946 by John Eckert¹⁴ and John Mauchly¹⁵ ENIAC uses a new type
    of element for performing computations. Vacuum tubes¹⁶ replaced relays. The tube
    is a electronic device. It does not have any mechanical component as the relay
    has. Therefore, when the electrical signal comes, the tube''s reaction time is
    much faster than relay-based machines. This change increased ENIAC performance
    by order of magnitude compared to 200 microseconds instead of milliseconds.


