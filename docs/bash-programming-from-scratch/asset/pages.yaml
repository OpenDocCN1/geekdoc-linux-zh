    ```

    1 cp -f ~/photo.tar.bz2 /d &&&

    2 echo "cp - OK" >> results.txt ||

    3 echo "cp - FAILS" >> results.txt

    ```


    The single command should perform the backup operation. Therefore, we can combine
    the bdtar and cp with the local AND.


    ```

    bdtar -cjf ~/photo.tar.bz2 ~/photo &&

    echo "bdtar - OK" >> results.txt ||

    echo "bdtar - FAILS" >> results.txt &&

    cp -f ~/photo.tar.bz2 /d &&

    echo "cp - OK" >> results.txt ||

    echo "cp - FAILS" >> results.txt

    ```


    Let''s consider how this works. For convenience, we will rewrite it in the form
    of a Boolean expression. The letter replaces each command and utility. Then we
    will get the following result:


    B & O1 | F1 & C && O2 | F2


    The letters "B" and "C" represent the bdtar and cp commands. "O1" and "F1" are
    the commands for printing the bdtar result. "O1" command prints the bdtar - OK
    line into the log file. The "F1" command prints the bdtar - FAIL line. Similarly,
    "O2" and "F2" are the commands for logging the cp result.


    If the bdtar call succeeds, the "B" operand equals "true". Then Bash performs
    the following steps:


    +   1. B

    2. O1

    3. C

    4. O2 or F2


    If the bdtar fails, the "B" operand equals false. Then Bash does the following
    actions:


    +   1. B

    2. F1

    3. C

    4. O2 or F2


    The copy operation does not make sense if the archiving step fails. The bdtar
    utility makes even more confusing. It creates an empty archive if you pass to
    it an unavailable file or directory. Then the cp utility copies the empty archive
    successfully. These operations lead to the following output to the log file:'
  merge: -1
