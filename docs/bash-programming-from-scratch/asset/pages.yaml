    The File Allocation Table172 (FAT) file system dictates how Windows manages and
    provides access to them. Microsoft developed this file system for the MS-DOS173
    OS. The principles of FAT became the basis of the ECMA-107174 standard. The next-generation
    file system from Microsoft is called NTFS175. It replaced the obsolete FAT in
    modern versions of Windows. However, the basic principles of disks and directory
    structure are the same in NAT and FAT. The reason for that is the backward compatibility
    requirement.


    The Unix directory structure follows the POSIX standard176. This structure is
    more limited and strict than the Windows. It has several predefined directories
    that you cannot move or rename. You are allowed to put your data in the specific
    paths only.


    The POSIX standard says that the file system has a top-level directory. It is
    called the root directory177. The slash sign / denotes it. All directories and
    files of connected disk drives are inside the root.


    If you want to access the contents of a disk drive, you should mount it. Mounting
    means enrolling the contents of a disk into the root directory. When mounting
    is done, you can access the disk contents through some path. This path is called
    mount point178. If you go to the mount point, you enter the file system of the
    disk.


