  md: '# Pipelines Pitfalls


    Pipelines are a popular feature of the Unix environment. Users apply them frequently.
    Unfortunately, it is quite simple to make a mistake using pipelines. Let''s consider
    the common mistakes by examples.


    You can expect that the following two commands give the same result:


    ```

    find /usr/share/doc/bash -name "*.html"

    ls /usr/share/doc/bash | grep ".html"

    ```


    The commands result differ in some cases. There is no problem in processing the
    search pattern differently by the find and grep utilities. The problem happens
    when you pass the filenames through the pipeline.


    The POSIX standard allows all printable characters in filenames. It means that
    spaces and line breaks are allowed too. The only forbidden character is null character228
    (NULL). This rule can lead to unexpected results.


    Here is an example. Create a file in the user''s home directory. The filename
    should contain the line break. The \n escape sequence229 in ASCII encoding. You
    can add escape sequences in filenames with touch utility. Call it this way:


    ```

    touch ~/''test\n.txt''

    ```


    The touch utility updates the modification time of the file. It is a primary task
    of the utility. If the file does not exist, touch creates it. It is a side effect230
    feature of the utility.


    Create two files for our example: test.txt and file1.txt. The following command
    shows that:


    ```

    touch ~/test.txt ~/file1.txt

    ```


    Now call the ls utility in the user''s home directory. Pass its output to grep
    via pipeline. Here are the examples:


    ```

    ls ~ | grep test

    ls ~ | grep file

    ```


    2-27 shows the output of these commands.


