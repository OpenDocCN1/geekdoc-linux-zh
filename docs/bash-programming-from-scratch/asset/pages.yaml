    Let''s consider how the compiler works step by step. Suppose that you have written
    the program. You saved your source code to a file on the hard disk. Then you run
    a compiler that fits the language you have used. Each programming language has
    the corresponding compiler or interpreter. The compiler reads your file, processes
    it and writes the resulting machine in the executable file on a disk. Now every
    time you change the source code file, you should generate the new executable file.
    You can run the executable file to launch your program.


    Figure 1-15 shows how the compiler processes a program in C and C++ languages.


    # Compiling


    # Linking


    ![](img/10069385f0665422da9fa132eaf1027c_42_0.png)


    Figure 1-15. The compilation process


    The compilation process consists of two steps. The compiler does the first step.
    The second step is called **linking**. The special program called **linker**$^{147}$
    performs it.


    The compiler produces intermediate object files. The linker takes them and converts
    them to one executable file.


    Why do you need two steps for compiling the source code? In theory, you can combine
    the compiler and linker into a single application. However, such solution has
    several problems.


    The limited RAM size causes the first problem. There is a common practice to split
    source code into several files. Each file matches a separate part of the program
    that solves the specific task. This way, you simplify your work with the source
    code. The compiler processes these files separately. It produces an object file
    for each source file. They store the intermediate results of compilation. If you
    combine the compiler and linker into one application, there is no chance to save
    the intermediate results to the disk. It you should compile the whole program
    at once. When you deal with a big program, the compilation process consumes all
    your RAM and crashes.


    The second problem of the compiler-linker application is resolving **dependencies**.
    There are blocks of commands that call each other in the source code. Such references
    are called dependencies. Tracking them is the linker task. However, if you combine
    compiler and linker, you need extra passes through the whole program source code
    for resolving dependencies. The compiler needs much more


    > $^{147}$://en.wikipedia.org/wiki/Linker_(computing)'
