  md: '# Computer Memory


    A hard disk stores all instructions of the program. If the program is relatively
    small and simple it fits a single file. Complex applications occupy several files.


    Suppose that you have a single file program. When you launch it, the OS loads
    the file into the computer memory called RAM. Then the OS allocates a part of
    processor for the new task. This way, the computer performs the program''s instructions
    at specified intervals.


    The first step of launching a program is to load it into RAM. We should consider
    the computer memory internals to understand this step.

    The single unit of computer memory is byte¹¹. The byte is the minimum amount of
    information the processor can reference and load into its memory. However, the
    CPU can handle smaller amounts of data if you apply special techniques. You operate
    byte in this case. A bit¹² is the smallest amount of information you cannot divide.
    You can imagine the bit as a single logical state. It has two possible ways to
    interpret it:


    +   - 0 or 1

    - True or False

    - Yes or No

    - + or -

    - On or Off.


    Another way to imagine one bit is to compare it with a lamp switch. It has two
    possible states:


    +   - The switch closes the circuit. Then the lamp is on.

    - The switch opens the circuit. Then the lamp is off.


    A byte is a memory block of eight bits. Here you can ask why we do need this packaging?
    CPU can operate a single bit, right? Then would it refer to a specific bit in
    memory.

    CPU cannot refer to a single bit. There are technical reasons for that. The primary
    task of the first computers was arithmetic calculations. For example, the computers
    calculated the ballistic tables¹¹¹. You should operate integers and fractional
    numbers to solve such a task. The computer does the same. However, a bit is not
    enough to store a number in memory. Therefore, the computer needs memory blocks
    to store numbers. The bytes become such blocks.


    Introducing bytes affected the architecture of processors. Engineers have expected
    that the CPU performs operations over numbers. Therefore, they added a feature
    to load and process all bits of the number at once. This increased complex computers''
    performance by order of magnitude. At the same time, loading of single bit in
    the CPU happens rarely. Supporting this feature in hardware brings significant
    overhead. Therefore, engineers have excluded it from modern processors.


    ¹¹https://en.wikipedia.org/wiki/byte

    ¹²https://en.wikipedia.org/wiki/bit

    ¹³https://www.wikiwand.com/en/Ballistic_table'
