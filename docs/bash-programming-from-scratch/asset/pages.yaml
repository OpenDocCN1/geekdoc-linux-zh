  md: "# Bash Scripts\n\n```\ncase STRING in\n  PATTERN_1)\n    ACTION_1\n    ;\n\n\
    \  PATTERN_2)\n    ACTION_2\n    ;\n\n  PATTERN_3)\n    ACTION_3\n    ;\n\n  PATTERN_4)\n\
    \    ACTION_4\n    ;\nesac\n```\n\nThe difference between the constructs is evident\
    \ now. First, if checks the results of Boolean expressions. The case statement\
    \ compares the string with the patterns. Therefore, it makes no sense to pass\
    \ a Boolean expression to the case condition. Doing that, you have two cases:\
    \ when the expression is \"true\" and \"false\". The if statement is more convenient\
    \ for such checking.\n\nThe second difference between if and case is the number\
    \ of conditions. Each branch of the if statement checks a separate Boolean expression.\
    \ In general, these expressions are independent of each other. In our example,\
    \ they check the same variable, but that is a particular case. The case statement\
    \ checks one string that you pass to it.\n\nThe if and case statements are fundamentally\
    \ different. They are not interchangeable. In each case, use the statement depending\
    \ on the nature of the check. The following questions will help you to make the\
    \ right choice:\n\n+   - How many conditions should you check? Use if for checking\
    \ several conditions.\n- Would it be enough to check one string only? Use case\
    \ when the answer is yes.\n- Do you need compound Boolean expressions? Use if\
