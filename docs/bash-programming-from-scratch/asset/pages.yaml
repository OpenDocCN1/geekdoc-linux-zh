    The command performs two actions:


    +   1. It adds the integer 5 to the current value of the var variable.

    2. It writes the result to the variable.


    All other assignment operations work the same way. First, they do a mathematical
    or bitwise operation. Second, they assign the result to the variable. The assignments’
    syntax makes the code shorter and clearer.


    Now we are ready to consider the increment and decrement operations. They have
    two forms: postfix and prefix. They are written in different ways. The ++ and
    – signs come after the variable name in the postfix form. They come before the
    variable name in the prefix form.


    Here is an example of the prefix increment:


    ```

    ((++var))

    ```


    This command provides the same result as the following assignment operation:


    ```

    ((var*=1))

    ```


    The increment operation increases the variable’s value by one. The decrement operation
    decreases it by one.


    Why does it make sense to introduce separate operations for adding and subtracting
    one? The Bash language has similar assignments like += and -=.


    The most probable reason to add increment and decrement to the programming language
    is a loop [counter*](https://en.wikipedia.org/wiki/For_Loop_counters). This counter
    keeps the number of loop iterations. When you want to interrupt the loop, you
    check your counter in a condition. The result defines the loop or not.


    Increment and decrement make it easier to serve the loop counter. Besides, that
    modern processors perform these operations at the hardware level. Therefore, they
    work faster than addition and subtraction combined with the assignment.


    What is the difference between prefix and postfix forms of increment? If the expression
    consists only of an increment operation, it gives the same result for both forms.


    For example, the following two commands increase the variable’s value by one:


    > *33https://en.wikipedia.org/wiki/For_Loop_counters'
