  md: '# Bash Shell


    How does the command work in detail? It calls the cp utility for each HTML file
    it found. When the utility, find inserts each found object instead of curly braces
    []. Therefore, two cp calls happen. They look like this:


    ```

    cp /.usr/share/doc/bash.html ~

    cp /.usr/share/doc/bashref.html ~

    ```


    Each cp calls one HTML file to the home directory.


    Good job! You just wrote your first program in the language of the find utility.
    The program works according to the following algorithm:


    +   - Find HTML files starting from the root directory. Their paths match the
    */doc/bash/* pattern.

    - Copy each found file into the home directory.


    The program is quite simple and consists of two steps. However, it is a scalable
    solution for finding and copying files. The program processes two or dozens of
    HTML files with the same speed.

    You can combine the -exec actions in the same way as the search conditions. For
    example, let''s print the contents of each found HTML file and count the number
    of its lines. You should call the cat utility to print the file contents. wc utility
    counts the lines. It takes the filename as an input parameter. If you combine
    cat and wc, you get the following command:


    ```

    find /path "*/doc/bash/*" -name "*.html" -exec cat {} \; -exec wc -l {} \;

    ```


    There is no logical operation between the -exec actions. The find utility inserts
    logical AND by default. This has a consequence in our case. If the cat utility
    finds, find does not call the wc utility. It means that find executes the second
    action only if the first succeeds. You can apply the logic OR explicitly. Then
    find always calls wc. Here is the command with logical OR:


    ```

    find /path "*/doc/bash/*" -name "*.html" -exec cat {} \; -o wc -l {} \;

    ```


    You can group the -exec actions with escaped parentheses (\ and \). It works the
    same way as grouping conditions.


