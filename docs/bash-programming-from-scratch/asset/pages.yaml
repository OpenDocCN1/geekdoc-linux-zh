    The second step for solving your task is adding the -exec action. The action should
    call the cp utility. This utility copies files and directories to the specified
    path. It takes two parameters. The first one is the source object to copy. The
    second parameter is the target path. When you apply the -exec action, you get
    the following find call:


    ```

    find /path "*/doc/bash/*" -name "*.html" -exec cp {} ~;

    ```


