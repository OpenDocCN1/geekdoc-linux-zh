    Let''s apply the -exec action in practice. Suppose that you want to copy files
    with the Bash documentation into the home directory. You are interested in the
    HTML files only.


    The first step is preparing the correct find call searching the files. You should
    apply two conditions here. The first one checks the directory of the Bash documentation.
    The second condition checks the extensions files. If you combine these conditions,
    you get the following find call:


    ```

    find /path "*/doc/bash/*" -name "*.html"

    ```


    When you pass the glob pattern to the find utility, always enclose it in double-quotes.
    The quotes are the same as the backslash before parentheses. They prevent Bash
    from expanding the patterns. Instead, Bash passes them to the find utility.


    Figure 2-17 shows the result of your find call. You can see that it found HTML
    files correctly.


