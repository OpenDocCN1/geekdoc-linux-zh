    Each machine instruction is called opcode$^{140}$. The opcode dictates the CPU
    logic gates should apply for data in the specific registers. When the operation
    is done, the opcode specifies the register for storing the result. Opcodes have
    a binary format that is a natural language of the CPU.


    While the program is running, its instructions, resources and required libraries
    occupy the RAM area. The OS clears this memory area when the program finishes.
    Other applications can use it.


    # Source Code


    Machine code is a low-level representation of a program. This format is convenient
    for the processor. However, it is hard for a human to write a program in machine
    code. Software engineers developed the first programs this way. It was possible
    for early computers because of their simplicity. Modern computers are much more
    powerful and complex devices. Their programs are huge and have a lot of functions.


    Computer engineers invented two types of special applications. They solve the
    problem of the machine code complexity. These applications are compilers$^{141}$
    and interpreters$^{142}$. They translate the program from a human-readable language
    into machine code. Compilers and interpreters solve this task differently.


    Software developers use programming languages$^{143}$ in their work nowadays.
    Compilers and interpreters take programs written in these languages and produce
    the corresponding machine code.


    Humans use one natural language$^{144}$ to communicate with each other. Programming
    languages are different from them. They are formal and very limited. Using a programming
    language, you can express only actions that a computer can perform. There are
    strict rules on how you should write these actions. You can use a small set of
    words and combine them in specific orders. Source code$^{145}$ is a type of text
    you write in a programming language.


    The compiler and interpreter process source code. The compiler reads the entire
    program, generates machine code instructions and saves them on a disk. The compiler
    does not execute the resulting program on its own. The interpreter reads the source
    code in, generates machine code and executes them immediately. The interpreter
    stores its results in RAM temporarily.


