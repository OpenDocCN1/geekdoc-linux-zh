    # Functions


    Bash is procedural programming language¹³⁴⁶. Procedural languages allow you to
    divide a program into logical parts called subroutine³⁴⁷. A subroutine is an independent
    block of code that solves a specific task. A program calls subroutines when it
    is necessary.


    Subroutines are called functions in modern programming languages. We have already
    met functions considering the declare command. Now let''s study the structure
    and properties of functions.


    # Programming Paradigms


    We should start with the terminology. It will help us to understand why functions
