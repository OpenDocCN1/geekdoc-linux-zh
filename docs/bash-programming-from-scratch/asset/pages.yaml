    * Microphone

    * Monitor

    * Speakers

    * Hard drive


    Internal devices are responsible for processing data, i.e. for executing programs.
    These are internal devices:


    +   * Central Processing Unit$^{34}$ (CPU)

    * Random-Access Memory$^{35}$ (RAM)

    * Video Card$^{36}$ (graphics processing unit or GPU).


    The OS provides access to the computer''s hardware. At the same time, the OS has
    something besides the hardware management to share with user''s applications.
    The system libraries have grown from the program modules to serve the devices.
    However, some modern OSes provide complex algorithms for processing data. Let''s
    consider an example.


    There is the Windows OS component Graphics Device Interface$^{37}$ (GDI). It provides
    algorithms for manipulating graphic objects. GDI allows you to create a user interface
    for your application with minimal efforts. Then you can use the monitor to display
    this interface.


    The system libraries with useful algorithms (like GDI) are software resources
    of the OS. These are already installed on your computer. You just need to know
    how to use them. Besides, the OS also provides access to third-party libraries
    and their algorithms. You can install these libraries separately and use them
    in your applications.


    The OS manages hardware and software resources. Also, it organizes the joint work
    of running programs. The OS performs several non-trivial tasks to launch an application.
    Then the OS tracks its work. If the application violates some agreements (like
    memory usage), the OS terminates it. We will consider launching and executing
    the program in the next section.


    If the OS is multi-user, it controls access to the data. It is an important security
    feature. Thanks to control, each user can access his own files only. Therefore,
    they can work with the same computer safely.


    Here is the summary. The modern OS has all these features:


