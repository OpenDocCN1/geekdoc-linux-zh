    Recursive traversal means repeating visiting of subdirectories. The traversal
    algorithm looks like this:


    +   1. Check the contents of the current directory.

    2. If there is an unvisited subdirectory, go to it and start from the 1st step
    of the algorithm.

    3. If all subdirectories are visited, go to the parent directory and start from
    the 1st step of the algorithm.

    4. If it is impossible to go to the parent directory, finish the algorithm.


    Following this algorithm, we bypass all subdirectories from the selected file
    system point. It is a universal traversal algorithm. You can add any action to
    it for processing each subdirectory. The action of the du utility is calculating
    disk space usage.


