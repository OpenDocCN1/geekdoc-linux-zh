    +   1. Add a special module to the processor. It should process operations on
    negative integers.

    2. Change the integer representation in memory. The representation should fit
    the adder logic when it adds negative integers.


    The development of computer technology followed the second way. It is cheaper
    than complicating the processor architecture.

    The ones'' complement reminds SMR. The sign of the number occupies the highest
    bit. The remaining bits store the value. The difference is all bits of the value
    are inverted for negative numbers. It means zeros become ones and ones become
    zeros. Bits of positive numbers are not inverted.


    Table 3-15 shows the ones'' complement representation of some numbers.


    # Table 3-15. The ones'' complement of the signed integers


    | Decimal | Hexadecimal | Ones'' Complement |

    |---|---||

    | -127 | 80 | 1000 0000 |

    | -110 | 91 | 1001 0001 |

    | -60 | C3 | 1100 0011 |

    | -5 | FA | 1111 1010 |

    | -0 | FF | 1111 1111 |

    | 0 | 0 | 0000 0000 |

    | 5 | 5 | 0000 0101 |

    | 60 | 3C | 0011 1100 |

    | 110 | 6E | 0110 1110 |

    | 127 | 7F | 0111 1111 |


    The memory capacity when using SMR and the ones'' complement is the same. One
    byte can store numbers from -127 to 127 in both cases.


    What is the effect of inverting the value bits for negative numbers? Let''s have
    a look at how the addition of negative numbers works now. First, we write 10 and
    -5 in the ones'' complement. Then add them the adder CPU module.


    Here is how the numbers look in memory:


    ```

    10 = 0000 1010

    -5 = 1111 1010

    ```


    Their addition gives the following result:


    ```

    10 + (-5) = 0000 1010 + 1111 1010 = 1 0000 0100

    ```


    The addition caused an overflow. The highest one does not fit into one byte. In
    this case, it is discarded. Then the result of the addition becomes like this:'
