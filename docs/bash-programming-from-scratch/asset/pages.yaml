  md: '# General Information


    When the ENIAC should calculate a complex task, it can come to a leak of computer
    resources. However, you can split the task into several subtasks. Then the computer
    can solve each subtask separately. Storing the intermediate results on the cards
    helps you to move data from one subtask to another while you reprogram the computer.


    Using ENIAC gave a new experience to engineers. It shows that all mechanical operations
    limit computer performance. These are the mechanical operations in ENIAC: manual
    programming with switches, jumpers and punching the cards. Each of these operations
    takes a significant time. Therefore, solving practical tasks with ENIAC is ineffective.
    The computer itself had an unprecedented performance at that time. However, it
    was idling most of the time while reprogramming or receiving input data. These
    findings initiated the development of new devices for both data input and output.


    The next step in computer design is replacing vacuum tubes with transistors²¹.
    It again increased the computation speed by an order of magnitude. Transistors
    came together with new input/output² devices. It allowed to increase the loading
    of the computers and reprogram them more often.


    When the epoch of transistors started, computers spread beyond government and
    military projects. Banks and corporations began to exploit machines too. It increases
    the number and variety of programs running on computers significantly.


    Commercial usage of computers brings new requirements. When the computer works
    in a company, it should execute programs one after another without any delays.
    Otherwise, the machine does not justify the money on it.


    New solutions were needed to meet requirements. The most-consuming task was switching
    between programs. Therefore, engineers of General Motors and North American Aviation
    came to an idea to automate it. They created the first commercial operating system
    GM-NAA I/O²²³. The primary goal of the system was managing the execution of programs.


    The heavy load of computers and the variety of their programs brought another
    new task. When the computer of that loads a program, the program defines the hardware''s
    available features. For example, if the program includes a code to control an
    output device, you can use it. Otherwise, this is unavailable.


    Suppose that you are a company. You use a particular model all the hardware always
    stays the same. Therefore, you do not change the code that controls your hardware.
    You just copy this code from one program to another. It takes extra efforts.


    Copying hardware-specific code brought engineers to an idea of a special program.
    The service programs logs together with the user’s application and provides the
    hardware support. These service programs became part of the first-generation operating
    systems for a while.


    Now it is time to come back to the question, why do you need an OS. We found out
    that applications could work without in general. Such applications are still in
    today. For example, they are


