  md: '# Files Execution


    Windows has strict rules for executable files. The file extension defines its
    type. The Windows loader runs only files with the EXE and COM extensions. These
    are compiled executable of programs. Besides them, you can run scripts. The script''s
    extension defines the interpreter that launches it. Windows cannot run the script
    if there is no installed interpreter for it. The possible extensions of the scripts
    are BAT, JS, PY, RB, etc.


    Unix rules for executing files differ from Windows ones. Here you can run any
    file if it has permissions for reading and executing. Its extension does not matter,
    unlike Windows. For example, the file called report.txt can be executable.


    There is no convention for extensions of the executable files in Unix. Therefore
    you cannot deduce the file type from its name. Use the file utility to get it.
    The command receives the file path on input and prints its type. Here is an example
    of calling file:


    ```

    file /usr/bin/ls

    ```


    If you launch the command in the MSYS2 environment, it prints the following information:


    ```

    /usr/bin/ls: PE32+ executable (console) x86-64 (stripped to external PDB), for
    MS Windows

    ```


    The output says that the /usr/bin/ls file has the PE32 type. Files of this type
