    time for a single pass over the source code the linker needs it for object files.
    Therefore, when you have the compiler and linker separated, you speed up the overall
    compilation process.


    The program can call blocks of commands from the library. The linker process the
    library file together with the object files of your program in this case. The
    compiler cannot process the library file. Its file contains machine code but not
    the source code. Therefore, the compiler does not understand it. Splitting the
    compilation into two steps resolves the task of using libraries too.


    We have considered the basics of how the compiler works. Now suppose that you
    choose an interpreter to execute your program. You have the file with its source
    code on the disk drive. The file is ready for execution. When you run it, the
    OS loads the interpreter file. Then the interpreter reads your source code into
    RAM and executes it by line. The translation of source code commands to machine
    code instructions happens in RAM. Some interpreters save files with an intermediate
    representation of the program to the disk drive. It speeds up the program execution
    if you restart it. However, you always need to run an interpreter first for executing
    your program.


    Figure 1-16 shows the process of interpreting the program.


    ![](img/10069385f0665422da9fa132eaf1027c_43_0.png)


    Figure 1-16. Interpreting the program


    Figure 1-16 can give an idea that the interpreter works the same way as the compiler
    and linker combined into one application. The interpreter loads source code into
    RAM and translates them into machine code. Why are there no problems with the
    RAM overflow and dependency resolution?


    The interpreter avoids problems because it processes the source code differently
    than the compiler does. The interpreter processes and executes the program code
    by line. Therefore, it does not store the machine code of the whole program in
    memory. The interpreter processes the parts of the source code file that it requires
    at the moment. When the interpreter executes them, it unloads these parts and
    frees the corresponding RAM area.'
