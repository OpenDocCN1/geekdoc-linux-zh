    from the disk happens in several steps. The hardware does them.


    The first step is reading data from the hard disk into the RAM according to Figure
    1-13. The next step is loading data from RAM to the CPU cache. There is a sophisticated
    caching mechanism. It guesses the data from RAM that the CPU requires next. This
    mechanism reduces the access time to the data and decreases the idle time of the
    CPU.


    When data comes to the CPU chip, it manages it on its own. The processor needs
    the required data from the cache to registers and manipulates them. The program
    instructions each the CPU the same way as the data.


    The program displays data on the screen in our example. It should call the corresponding
    API function for that. The system library creates the screen picture. The CPU
    does actual work here. It loads instructions of the system library and the video
    card driver. The CPU applies these instructions to the data in its registers.
    This way, the video card displays the data on the screen.


    The required data may absent in the specific memory level. Here are few examples.
    Suppose the CPU needs to process them in the video driver code. If these data
    are in the CPU cache but not in the registers, the processor waits for 2-100 clock
    cycles to get them. If data are in the RAM, the CPU''s waiting time increases
    by order of magnitude up to 1000 cycles.


    Our program can display both small and big files. Some file does not fit the RAM.
    Then the RAM contains only part of it. The CPU can require the missing file part.
    In this case, the CPU idle time increases by four orders of magnitude up to 1000000
    clock cycles. This is a really a lot. For comparison, the processor could execute
    about 1000000 program instructions instead of this idle time. This is really a
    lot.


    Both CPU and disk drives use hardware caching mechanisms. The idea of caching
    for disk drives¹ is to store data in the small and fast access memory. It speeds
    up reading and writing blocks of data. There are caching mechanisms on the software
    level too. They are parts of the OS in cases.


    All caching mechanisms increase a CPU''s performance significantly. When such
    a mechanism makes a mistake, it leads to the CPU idle. This mistake is called
    cache miss. Any cache miss is expensive from the performance point of view. Therefore,
    remember the memory hierarchy and caching mechanisms. Consider them when developing
    algorithms. Some algorithms and data structures create more cache misses than
    others.


    The storage devices with lower access times are placed closer to the CPU. Figure
    1-14 demonstrates this principle. For example, registers and cache are the internal
    CPU memory. They are part of the processor''s chip.


    Both and RAM are two chips that are plugged into the motherboard² near each other.
    The high-frequency data bus³ connects them. This data provides low access time.


