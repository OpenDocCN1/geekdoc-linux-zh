    it on the screen.


    We can solve the task using the associative array. This solution is inefficient
    for searching for a contact. The script should traverse all array elements. It
    compares each element with the person''s name that you are looking for. The script
    prints the corresponding contacts if it finds the person.


    An associative array searches for contacts. The script should not pass through
    all array elements in this case. Instead, it gives the key to the array and gets
    the corresponding value back. Here a possible way to declare and initialize the
    associative array with contacts:


