  md: '# Bash Scripts


    1 bsdtar - FAILS

    2 cp - OK


    Such output confuses the user instead of clarifying the issue.

    Let''s come back to our expression:


    ```

    B && O1 || F1 && C & O2 || F2

    ```


    Why does Bash call the cp utility after an error in bsdtar? It happens because
    the echo command always succeeds. It returns zero code, which means “true”. Thus,
    the “O1”, “F1”, “O2” and “F2” operands are always “true”.


    Now we focus on bsdtar call and corresponding echo commands. They match the following
    part of the Boolean expression:


    ```

    B && O1 || F1

    ```


    We can put its left side into brackets without changing the result. Then it looks
    like this:


    ```

    (B && O1) || F1

    ```


    Here is a logical OR for the operands (B & O1) and “F1”. The “F1” operand always
    equals “true”. Therefore, the whole expression is always “true”.


    We can solve the problem by inverting the result of “F1”. The logical NOT operator
    does that. This way, we get the following expression:


    ```

    B && O1 || F1 && C & O2 || F2

    ```


    Now, if the “B” fails, Bash evaluates “F1”. It always equals false because of
    negation. Bash skips the “C” and “O2” command. It happens because there is a logical
    AND between them and “F1”. The “F2” command is the next one that Bash performs.
    The shell needs its result because it has a logical OR in front of it.

    The following parentheses would make the expression:


    ```

    (B && O1 || F1 && C & O2) || F2

    ```


    It is evident that Bash executes the “F2” action when the parenthesized expression
    equals “false”. Otherwise, it cannot evaluate the value of the entire expression.


    This command writes the following output into the log file:'
