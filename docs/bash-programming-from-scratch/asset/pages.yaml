  md: '# Operations on files and directories.


    +   - Creating backups.

    - Downloading files from the Internet.

    - Collecting statistics about your computer''s resource usage.


    An example will explain the effectiveness of CLI. Suppose you rename several files
    on the disk. You add the same suffix to the names. If you have a dozen of files,
    you can do this task with Windows Explorer¹ in a couple of months. Now imagine
    that you should rename thousands of files this way. You will spend the whole day
    that with the Explorer. If you use the shell, you need to launch a single command
    and wait for several seconds. It will rename all of them automatically.


    The example with renaming files shows the strength of the CLI that is scalability.
    Scalability means that the same solution handles both small and large amounts
    of input data. Scalability implies a command when we are talking about the shell
    and a thousand files with the speed.


    Experience with the command interface is a great benefit for any programmer. When
    you develop a complex project, you manage plenty of text with the source code.
    You use the GUI editor to change the file. It works well until you do not to introduce
    the same change in many files. For example, it can be the new version of the license
    information in the file headers. You waste your time when solving such a task
    with the editor. Command-line utilities may make this change faster.


    You need to use CLI to deal with compilers and interpreters. These programs usually
    do not have a graphical interface. You run them via the command line and pass
    the names of the source code files. The reason for such workflow is the poor scalability
    of the GUI. If you use plenty of source code files, you cannot handle them effectively
    via the GUI.


    There are special programs to edit and compile source code. Programs are called
    integrated environments² (IDE). You can compile a big project using IDE and its
    GUI. However, IDE calls the compiler via the command line internally. Therefore
    you deal with the compiler''s CLI if you want to change its options or working
    mode.


    If you are experienced programmer, knowing the CLI encourages you to develop helper
    utilities. It happens writing a program with a command interface is much faster
    than with a GUI. The speed of development is essential when solving one-off tasks.


    Here is an example situation when you would need to write a helper utility. Suppose
    that you have to make a massive change in the source code of your project. You
    can do it with IDE by repeating the same action times. Another option is to spend
    time writing a utility that will do this job. You should compare the required
