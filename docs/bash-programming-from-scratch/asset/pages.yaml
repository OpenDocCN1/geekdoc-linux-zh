    # Exercise 3-6. The case statement


    The script for switching between configuration files will create symbolic links.


    > You cannot create a symbolic link in a Unix environment running on Windows.
    Instead, the ln utility copies the file or directory corresponding to the link.
    The utility works fine on Linux and macOS.


    Symbolic links are useful when you want to access a file or directory from the
    file system''s specific location. When you open a link, you edit the file to which
    it points. The link to a directory works the same way. Any changes applies to
    the target directory.


    The algorithm for switching between configuration files looks like this:


    +   1. Removing the existing symbolic link or file in the ~/.bashrc path.

    2. Check the command-line option passed to the script.

    3. Depending on the option, create a symlink to the .bashrc-home or .bashrc-work
    file.


    Let''s implement this algorithm by using the case operator. Listing 5-4 shows
    the result.'
