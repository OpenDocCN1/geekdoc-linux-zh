  md: '# Solutions for Exercises


    ```

    ./txt-copy.sh cp

    ```


    When you want to move files, you call the script like this:


    ```

    ./txt-copy.sh mv

    ```


    You can access the first parameter of the script by the $1 name. Place this name
    in the -exec of the find call. When this, we get the following command:


    ```

    find -maxdepth 1 -type f -name "*.txt" -exec "$1" -t {} \;

    ```


    If you do not specify an argument, the script should copy the files. It means
    that the calling all is acceptable:


    ```

    ./txt-copy.sh

    ```


    To make this work, add a default value to the parameter expansion. Listing 5-1
    shows the final script that we get this way.


    Listing 5-1. The script for copying TXT files


    ```

    #!/bin/bash

    find -maxdepth 1 -type f -name "*.txt" -exec "${1:-cp}" -t {} \;

