  md: '# Introduction


    You are going to study a new and complex subject. It will require strong motivation.
    Therefore, consider your goals before you continue reading this book. What do
    you expect from your new skills? What tasks will your programs solve? Answers
    to these questions help you to choose an effective way to study.


    If firmly intend to become a professional programmer in the shortest possible
    time, you need a mentor. Enroll yourself in a full-time or online course. It accelerates
    your progress significantly. You will get a chance to communicate directly with
    the mentor, ask him questions, and clarify unclear topics.


    You can learn programming without a mentor you do it for curiosity. Do you want
    a new hobby or a new fancy thing? In this case, self-study with the book is the
    right way. It will bring you practical benefits for relatively small effort. After
    all, basic programming skills are helpful for anyone who works with the computer.
    Perhaps this book would be a starting point for you. It will help you to choose
    a direction for your further development.


    Today there are plenty of books available in online shops and libraries. A reader
    with any technical level can find appropriate material for them. You can ask about
    the reason for writing this particular book.


    Programming is a practical domain. Yes, it has a lot of theory. But mathematics
    has a lot of theory too. However, knowing formulas does not make you a mathematician.
    In the same way, knowing the fundamental principles of software development does
    not make you a programmer.


    You have to write a lot of code on your own to become a professional. At first,
    this code won''t work. Then, it will contain errors. Gradually, you will learn
    to anticipate and fix the mistakes in advance. Knowledge of a particular language
    does not indicate your progress. But an evaluation of your old code does it. When
    you read your code several months later and notice its disadvantages, it confirms
    your progress.


    So what is wrong with existing books? Many of them focus on a specific language
    or technology. They consider the chosen detail. In this case, the author does
    not pay enough attention to practical exercises. A beginner programmer does not
    need such a volume of specialized knowledge. It brings him the wrong idea of how
    to learn program. It is rarely that somebody reads books for specific technologies
    from cover to cover. More often, they are used as a reference manual when the
    specific practical question arises.


    Books of another type teach you some programming language by examples. When you
    study such a book, your progress goes faster. But there is one problem here. Many
    do not find the'
