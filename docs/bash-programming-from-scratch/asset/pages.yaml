  md: '# Backup Command


    To understand Bash scripts better, we would write the command. It makes a backup
    of photos on the external hard drive^1. The command consists of two actions: archiving
    and copying.


    Suppose that the ~/photo directory keeps all photos. The mount point of the external
    drive is /d. Then the backup command can be like this:


    ```

    bsdtar -cfj ~/photo.tar.bz2 ~/photo & cp -f ~/photo.tar.bz2 /d

    ```


    Because of the local AND, copying happens when the archiving succeeds. If the
    bsdtar utility returns an error, there is no cp call.


    +   In our example, the backup operation happens in two steps: archiving and copying.
    This separation of actions is necessary for educational purposes. You can do the
    same by the single bsdtar call:


    bsdtar -cfj /photo.tar.bz2 ~/photo


    Suppose that our backup command runs automatically. For example, it launches every
    day by scheduling. In this case, you cannot read error messages of utilities if
    they fail. You need a log file to store the results of utilities. The bsdtar call
    with the debug output:


    ```

    bsdtar -cfj ~/photo.tar.bz2 ~/photo &&

    echo bsdtar - OK > results.txt ||

    echo bsdtar - FAILS > results.txt

    ```


    You can split a Bash command into multiple lines. There are two ways for doing
    that:


    +   1. Line break immediately after the logical operator (& or ||).

    2. Line break after backslash.


    We applied the first option in the last bsdtar call. The second option looks like
    this:


    ```

    bsdtar -cfj ~/photo.tar.bz2 /photo \

    \& echo bsdtar - OK > results.txt \\

    || echo bsdtar - FAILS > results.txt

    ```


    Here is the command to print the cp utility in the log file:


    > ^1https://en.wikipedia.org/wiki/Hard_disk_drive#EXTERNAL'
  merge: -1
