    The memory capacity stays the same when using the two''s complement. One byte
    can store the numbers from -127 to 127.


    Let''s consider adding negative numbers in the two''s complement. For example,
    we add 14 and -8. First, we write them in the two''s complement. Here is the result:


    ```

    14 = 0000 1110

    -8 = 1111 1000

    ```


    Now add this number like this:


    ```

    14 + (-8) = 0000 1110 + 1111 1000 = 1 0000 0110

    ```


    The addition leads to the overflow. The highest one did not fit into one byte.
    We should discard it. Then the final result looks like this:


    ```

    0000 0110 = 6

    ```


    When addition gives a negative result, you should not discard the highest bit.
    For example, we want to add the numbers -25 and 10. When we write them in two''s
    complement, they look like this:


    ```

    -25 = 1110 0111

    10 = 0000 1010

    ```


    The addition of these numbers gives the following result:


    ```

    -25 + 10 = 1110 0111 0000 1010 = 1111 0001

    ```


