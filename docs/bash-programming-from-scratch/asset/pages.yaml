  md: '# Indexed Arrays


    declare -gr filename="README.txt"


    Bourne Shell has scalar variables only. The interpreter stores them as strings
    in memory. Such variables were not enough for users. Therefore, Bash developers
    have added arrays. When do you need an array?


    Strings have a serious limitation. When you write a value to the scalar variable,
    it is a single unit. For example, you write a list of files in the variable called
    files. You separate filenames by spaces in this list. However, the files variable
    stores a single string from the Bash point of view. This fact leads to errors.


    Here is an example. The POSIX standard allows any characters except the null character
    (NULL). NULL means the end of a string in Bash. Therefore, a string variable can
    contain NULL at the end. It turns out that you have no reliable way to separate
    filenames in a string. You cannot use NULL. But any other delimiter character
    can occur in these names.


    The delimiter problem prevents processing of the ls utility output reliably. The
    utility cannot separate its output units with NULL. It leads to a recommendation
    to avoid parsing of the ls output. Also, do not use ls in variable declarations
    like this:


    ```

    files=$(ls Documents/*.txt)

    ```


    This declaration writes all files of the Documents directory to the files variable.
    If there are spaces or line breaks in the filenames, it will be hard to restore
    them.


    Bash arrays solve this problem. An array stores a list of separate units. It is
    simple to read them in their original form. Therefore, use arrays to store filenames
    instead of strings with the ls output. Here is a better declaration of the files
    variable:


    ```

    declare -a files=(Documents/*.txt)

    ```


    This command declares and initializes the array. Initializing means assigning
    values to the array''s elements. You can do that in the declaration or afterward.


    Bash can deduce the array type of the variable by itself. This mechanism works
    when you skip the declare command in a variable declaration. Bash adds the appropriate
    attribute automatically. Here is an example:


    ```

    files=(Documents/*.txt)

    ```


    The command declares the indexed array files.


    Suppose that you know the array elements in advance. In this case, you can assign
    them explicitly in the declaration. It looks like this:'
