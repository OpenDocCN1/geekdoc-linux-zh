    cp -R ~/docs-backup && echo "OK" > result.log || echo "Error" > result.log


    This command implements the conditional algorithm that we need. The cp utility
    finishes successfully, the command writes "OK" in the log file. Otherwise, it
    writes "Error". To understand how it works, let''s consider the priority of the
    operation first.


    First, we would make our command simpler for reading. Let''s denote all operands
    by Latin letters. The "A" letter matches the cp call. The "B" letter marks the
    first echo call with the "OK" line. The "C" is the second echo call. Then we can
    rewrite our command this way:


    A & B || C


    The && || operators have the same priorities in Bash. The Boolean expression is
    calculated from the left to the right side. The operators are called left-associative²³⁵
    in this case. Given this, we can rewrite our expression this way:


    (A & B) || C


    Adding parentheses does not change anything. First, Bash evaluates the expression
    (A & B). Then, it calculates the "C" operand if it is necessary.


    What happens if "A" equals "true"? The && operator calculates its right operand
    "B" in this case leads to printing "OK" to the log file. Next, Bash processes
    the || operator. The interpreter already knows the value of its left operand (A
    & B). It equals "true". The OR operator''s value equals "true" when at least one
    of its operands is "true". Therefore, the right operand''s value does not affect
    the expression. Bash skips it. It leads that the "Error" line absent in the log
    file.


    If the "A" value is "false", the expression (A & B) equals "false" too. In this
    case, Bash skips the operand "B". It leads to the "OK" output to the log file.
    Bash handles the || operator. The interpreter already knows that its left operand
    "false". Thus, it should evaluate the right operand for deducting the whole expression.
    It leads to the execution of the second echo command. The "Error" line goes to
    the log file.


    The principle of short-circuit evaluation is not obvious. You would need some
    to figure it out. Please do by your best. Every programming language uses Boolean
    expressions. Therefore, understanding the rules of evaluation is essential.


