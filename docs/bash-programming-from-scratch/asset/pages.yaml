  md: '# Bash Shell


    What is the && operator? It is a logical AND operation. Here operands are Bash
    commands (actions) instead of Boolean expressions (conditions). Let''s have a
    look at how the logical operation works in this case.


    The POSIX standard requires each running program to provide exit status²³¹ when
    it finishes. The zero code means that the program completed successfully. Otherwise,
    the code takes a value from 1 to 255.


    When you apply a logical operator to a command, the operator handles its status.
    First, Bash executes the command. Then its exit status is used as the Boolean
    expression in the logical operator.


    Let''s go back to example:


    ```

    cp -R ~/docs ~/docs-backup && echo "OK" > result.log

    ```


    Suppose the cp utility completes successfully. It returns the zero code in this
    case. The zero code matches the value "true" in Bash. Therefore, the information
    is not enough to reduce the result of the whole expression. It can be "true" or
    "false" depending on the right operand. Then the && operator has to execute the
    echo command. It succeeds and returns the zero code. Thus, the result of the &&
    operator equals "true"


    It is not clear how we use the result of the && operator in our example. The answer
    is we do not. Logical operators are needed to calculate Boolean expressions. But
    they are often used for their side effect in Bash. This side effect is a strict
    order of operands evaluation.


    Let''s consider when the cp utility finishes with an error in our example. It
    returns a non-zero exit status. It is equivalent to the "false" value for Bash.
    In this case, the && operator can already calculate the value of the whole Boolean
    expression. It does not need to calculate the right operand. If at least one of
    the logical AND is "false", the entire expression is "false". Thus, the status
    of the echo command is not required. Then the && operator does not execute it.
    in this case, there is no "OK" output in the log file.


    Now you get the short-circuit evaluation²³². It means calculation only those operands
    that are sufficient to decode the value of the whole Boolean expression.


    > Bash stores the exit status of the last executed command in the environment
    variable. Its name is the question mark. The echo command displays its value like
    this:


    ```

    echo $?

    ```


    We have done only the first part of our task. Now the command prints the "OK"
    line in the log file when copying succeeds. But we should handle the false case.
    The "Error" line should appear in the log file in this case. We can do it with
    logical OR operator. It is called || in Bash.


    With the OR operator, our command looks like this:


