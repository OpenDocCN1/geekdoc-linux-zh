    This command writes the values of the variables bash_doc, flex_doc and xz_doc
    to the files array. If you change these variables after this declaration, it does
    not affect the array.


    When declaring an array, you can specify an index for each element. Do it like
    this:


    ```

    1 bash_doc="/usr/share/doc/bash/README"

    2 flex_doc="/usr/share/doc/flex/README.md"

    3 xz_doc="/usr/share/doc/xz/README"

    4 files[0]="$bash_doc" [1]="$flex_doc" [5]="/usr/share/doc/xz/README"

