  md: '# Command Information


    We got acquainted with commands for navigating the file system. Each command has
    several options and parameters. We have covered the most common ones only. What
    if you need a rare feature that is missing in this book? You would need official
    documentation in this case.


    All modern OS and applications have documentation. However, you rarely need it
    when using the graphical interface. It happens because graphic elements are self-explanatory
    in most cases. Therefore, most PC users do not care about documentation.


    When working with the CLI, the only way to know about available features of the
    software is reading documentation. Besides that, you do not have anything that
    gives you a quick hint. When using CLI utility, it is crucial to know its basics.
    The negligence can lead to loss or corruption of your data.


    The first versions of Unix had paper documentation. Using it was inconvenient
    and time-consuming. Soon it became even worse because the documentation volume
    grew rapidly. It exceeded the size of a single book. The Unix developers introduced
    the system called man page to solve the issue with documentation. Using this software,
    you can quickly find the required topic. It contains information about OS features
    and all installed applications.


    The man page system is a centralized place to access documentation. Besides it,
    every program in Unix provides brief information about itself. For example, the
    Bash interpreter has its own documentation system. It is called help.


    Suppose that you want to get a list of all Bash built-ins. Launch the help command
    without parameters. Figure 2-21 shows its output.


