  md: '# history


    The history stores the command that you have executed. It does not keep the command
    that you typed and then erased.


    There is a trick to save the command to the history without executing it. Add
    the hash symbol # before the command and press Enter. Bash stores the typed line,
    but it does not execute it. This happens because the hash symbol means comment.
    When the interpreter meets a comment, it ignores this line. However, Bash has
    the commented lines in the history because they are legal constructions of the
    language.


    Here is an example of the trick with comment for our cat utility call:


    ```

    #cat README

    ```


    You have saved the commented command in the history. Now you can find it there
    by pressing the arrow key. Remove the hash symbol at the beginning of the line
    and press Enter. Bash will execute your command.


    You can do the comment trick by the Alt+Shift+3 shortcut. It works in most terminal
    emulators. Here are the steps for using the shortcut:


    +   1. Type a command, but do not press Enter.

    2. Press Alt+Shift+3.

    3. Bash saves the command in the history without executing it.


