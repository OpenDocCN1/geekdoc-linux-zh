  md: '# General Information


    Interpreting the program looks more convenient for software development than compiling.
    However, it has some drawbacks.


    First, all interpreters work slowly. It happens every time you run the program,
    the interpreter should translate its source code to machine code. This process
    takes some time. You should wait for it. Another reason for the low performance
    of interpreters is disk operations. Loading the program source from the disk drive
    into RAM causes the CPU to idle. It takes up to 10000000 clock cycles, according
    to Table 1-3.


    Second, the interpreter itself is a complex program. It requires some portion
    of the computer''s resources to launch and work. Therefore, the computer executes
    both interpreter and your program in parallel and shares resources among them.
    It is extra overhead that reduces the performance of your program.


    Interpreting the program is slow. Does it mean compilation is better? The compiler
    generates an executable file with machine code. You reach the program''s performance
    when you compile or write machine code on your own. However, you pay for the programming
    language at the compilation stage. A couple of seconds and a few megabytes of
    RAM are enough to compile a small program. When you compile a large project (for
    example, the Linux kernel), it takes several again. If you change the source,
    you should recompile the project and wait hours again.


    Keep in mind the overhead of interpreters and compilers when choosing a programming
    language for your project. The interpreter is a good choice in the following cases:


    +   - You want to develop a program quickly.

    - You do not care about the program''s performance.

    - You work on a small and relatively simple project.


    The compiler would be better in the following cases:


    +   - You work on a complex and large project.

    - Your program should work as fast as possible.

    - You want to speed up debugging of your program.


    Both compilers and interpreters have an overhead. Does it make sense to discard
    a programming language and write a program in machine code? Do you not waste your
    time waiting for compilation in this. Your program works as fast as possible.
    These benefits sound reasonable. Please do not hurry with your conclusions.


    One simple example helps you to realize all advantages of using a programming
    language. Listing 1-1 shows the source code written in C. This program prints
    the "Hello world! text on the screen.'
