    # Files Processing


    The loop fits well for processing a list of files. When solving this task, you
    should compose the loop condition correctly. There are several common mistakes
    here. Let''s consider them by examples.


    The first example is a script that prints types of files in the current directory.
    We can do it by calling the file utility for each file.


    The most common mistake when composing the loop condition is neglecting patterns
    (globbing). Users often call the ls to find the STRING. It happens this way:


    ```

    for filename in $(ls)

    for filename in $(find . type f)

    ```


    This is wrong. Such a solution leads to the following problems:


    +   1. Word splitting breaks names of files and directories with spaces.

    2. If the filename contains an asterisk, Bash performs globbing before starting
    the loop. Then it writes the expansion result to the filename variable. This way,
    you lose the actual filename.

    3. The output of the ls utility depends on the regional settings. Therefore, you
    can get question marks instead of the national alphabet characters in filenames.
    Then the for cannot process these files.


    Always use patterns in the loop to enumerate filenames. This is the only correct
    solution for this task.


    We should write the following for loop condition in our case:


    ```

    for filename in *

    ```


    Listing 3-27 shows the complete script.'
