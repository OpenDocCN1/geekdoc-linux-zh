- img_proc: true
  md: "# Listing 5-4. The script for switching configuration files\n\n```\n```bash\n\
    !/bin/bash\nfile=\"$1\"\nrm ~/.bashrc\ncase \"$file\" in\n  \"h\")\n    ln -s\
    \ ~/.bashrc-home ~/.bashrc\n    ;;\n  \"w\")\n    ln -s ~/.bashrc-work ~/.bashrc\n\
    \    ;;\n  *)\n    echo \"Invalid option\"\n    ;;\nesac\n```\n```\n\nThe in calls\
    \ differ only by the target filename. This similarity hints that you can replace\
