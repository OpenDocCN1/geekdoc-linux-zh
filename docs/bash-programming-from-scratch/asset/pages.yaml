  md: '# # Bash Scripts


    We have learned the basics of how to operate the file system in Bash. Now we do
    the next step. We come from the standard shell commands to programs. When you
    write a program in Bash, it is called script. Let''s learn how to write scripts.


    # ## Development Tools


    In the previous chapter, we typed Bash commands in the terminal window. Then the
    memory of the terminal process stores these commands. It means that physically
    the computer''s RAM stores them. RAM is a place for the temporary storage of information.
    Whenever you shut down the computer, this memory is cleared.


    The terminal window is not sufficient for program development. Now you need a
    convenient source code editor²⁶. This application allows you to create, edit and
    save source code files on your hard drive. The hard disk stores information for
    the long-term.


    # ## Source Code Editor


    You can write Bash scripts in any text editor. Even the standard Windows applications
    Notepad²⁷ fits. But this application is inconvenient for editing the source code.
    Notepad does not have features for that. Such features can increase your productivity.
    Try several special editors and choose the one you like.


    Here is a list of three popular source code editors. If none of the three fits
    you, please look for alternatives on the Internet. There are many editors of this
    kind.


    > MS Office and its open-source counterpart LibreOffice⁸ are not suitable for
