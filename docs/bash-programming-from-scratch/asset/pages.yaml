  md: '# Conditional Statements


    We have met the conditional statements when learning the find utility. Then we
    found out that Bash has its own logical operators AND (&&) and OR (||). The Bash
    language has other options to make branches.


    We will consider the if and case operators in this section of the book. The scripts
    use them often. Both operators provide similar behavior. However, each of them
    fits better for specific tasks.


    # If Statement


    Imagine you are writing a one-line command. Such a command is called one-liner.
    You are trying to make it as compact as possible because a short command is faster
    to type. Also, there is less chance to make a mistake when typing.


    Now imagine you are writing a script. Your hard drive stores it. You call the
    script regularly and change it. The compactness is not important. You follow another
    goal to make the script easy to read and debug.


    The && and || operators fit well one-liners. But Bash has better options for scripts.
    Actually, it depends on the particular case. Sometimes you can use these operators
    in the script and keep its clean. But they are hard-to-read code in most cases.
    Therefore, it is better to replace them with the if and case statements.


    Here is an example. Have a look at Listing 3-9. There is a backup script. It calls
    the bsdtar utility this way:


    ```

    bsdtar -cjf "$.tar.bz" "@" &&

    echo bsdtar - OK > results.txt ||

    { echo bsdtar - FAILS > results.txt; exit 1; }

    ```


    We have tried to make this script better to read. We split calls of bsdtar and
    mv utilities. However, it is not enough. The bsdtar call is still too long and
    complicated for reading. Therefore, it is easy to make a mistake when modifying
    it. Each error-prone code is called fragile. A poor technical solution introduces
    it in most cases.


    Let''s improve the bsdtar call. First, we should write its algorithm by by step.
    It looks like this:


    +   1. Read a list of files and directories from the @$ variable. Archive and
    compress them.

    2. If the archiving and compression were successful, write the line "bsdtar -
    OK" into the log file.

    3. If an error occurred, write the line "bsdtar - FAILS" into the log file. Then
    terminate the script.'
