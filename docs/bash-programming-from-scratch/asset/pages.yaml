    ```

    let var=12+7

    let var="12 + 7"

    let var = 12 + 7

    let var = 12 + 7

    ```


    All four commands give the same result. They set the variable''s value to 19.

    The let command takes parameters on input. Each of them must be a valid arithmetic
    expression. If there are spaces in the expression, Bash splits it into parts because
    of word splitting. In this case, let computes each part of the expression separately.
    It can lead to an error.

    The following command demonstrates the issue:


    ```

    let var=12 + 7

    ```


    Here the let command receives three expressions after word splitting. These are
    the expressions:


    +   * var=12

    * +

    * 7


    When calculating the second one, let reports about an error. The plus means an
    arithmetic addition. It requires two operands. But in our case, there are no operands
    at all.


    Suppose that you pass correct expressions to the let command. Then the command
    evaluates them one by one. Here are the examples:


    ```

    let a=1+1 b=5+1

    let "a = 1 + 1" "b = 5 + 1"

    let ''a = 1 + 1'' ''b = 5 + 1''

    ```


    All three commands give the same result. The variable a gets the value of 2. The
    variable b gets the value of 6.

    You can prevent word splitting of the let parameters. Use single or double-quotes
    for that.

    The let command has a synonym that is the (( operator. Bash skips word splitting
    inside the operator. Therefore, you can use quotes. Always use the (( operator
    instead of the let command. This way, you will avoid mistakes.


    > The relationship of the (( operator and let command remains of test and the
    [[ operator. In both cases, use operators rather than commands.


    The (( operator has two forms. The first one is called arithmetic evaluation¹⁵.
    It is a synonym for the let command. The arithmetic evaluation looks like this:


    ¹⁵https://wiki.bash-hackers.org/syntax/ccmd/arithmetic_eval'
