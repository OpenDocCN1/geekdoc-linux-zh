  \n### 11. 专利。\n\n“贡献者”是指授权根据本许可使用程序或基于该程序的作品的版权所有者。此类许可的作品被称为贡献者的“贡献者版本”。\n\n贡献者的“核心专利权利要求”是指贡献者拥有或控制的所有专利权利要求（无论已获得还是此后获得），这些权利在以本许可允许的某种方式制造、使用或销售其贡献者版本时可能被侵犯，但不包括仅由于对贡献者版本进行进一步修改而可能被侵犯的权利要求。就此定义而言，“控制”包括以符合本许可要求的方式授予专利许可的权利。\n\
  \n每位贡献者都根据其核心专利权利要求，授予您一项非排性的、全球性的、免版税的专利许可，允许您制造、使用、销售、报价出售、进口以及其他方式运行、修改和传播其贡献者版本的内容。\n\
  \n在以下三段中，“专利许可”是指任何明确的协议或承诺，无论如何计价，即不执行专利（例如允许实施某专利的明确许可或承诺不就专利侵权提起诉讼）。向某方“授予”此类专利许可意味着做出该项协议或承诺，不对该方执行专利。\n\
  \n如果您在传输受保护的作品时知地依赖于专利许可，且该作品的相应源代码无法任何人通过公开的网络服务器或其他易于访问的手段免费且根据本许可条款进行复制，那么您必须：(1)\
  \ 使相应源代码变得可用，或 (2) 安排放弃获得该特定作品专利许可的利益，或 (3) 按照符合本许可要求的方式，将专利许可扩展到下游接收者。“知地依赖”意味着您实际知道，如果没有该专利许可，您在某个国家传输受保护的作品，或您的接收者在该国家使用受保护的作品，将侵犯该国家内您有理由认为有效的或多个可识别的专利。\n\
