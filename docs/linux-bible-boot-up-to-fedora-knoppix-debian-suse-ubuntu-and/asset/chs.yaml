  \n5. 拒绝授予根据商标法使用某些商号、商标或服务标记的权利；\n\n\n\n6. 任何传输该材料（或其修改版本）的人，均须通过合同假设承担对接收方的责任，补偿该材料的许可者和作者，对于这些合同假设直接施加给许可者和作者的任何责任。\n\
