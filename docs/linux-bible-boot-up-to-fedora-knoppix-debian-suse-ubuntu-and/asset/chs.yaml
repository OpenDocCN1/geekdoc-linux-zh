  \ `systemctl` 命令在 `Host-A` 上启动了另一个服务 `ssh`（参见第 15 章）。这为 `nmap` 工具提供一个更有趣的扫描目标。\n\
  \n```\n# systemctl start sshd.service\n# systemctl status sshd.service\nsshd.service\
