  \ Sleeva\n\n**封面设计**Wiley\n\n# 致谢\n\n自从六多年前被红帽公司聘用以来，我接触到了世界上许多优秀的 Linux 开发者、测试人员、支持专家和讲师。由于我无法逐一感谢每个人，我向这种每天提升我\
  \ Linux 技能的合作与卓越文化致敬。\n\n\n\n我之所以没有充分评价红帽（Red Hat），是因为我在那里工作；而我之所以在红帽工作，是因为它对开源软件理念的践行契合了我自己的信念。我想要特别感谢红帽的几位同事。与\
