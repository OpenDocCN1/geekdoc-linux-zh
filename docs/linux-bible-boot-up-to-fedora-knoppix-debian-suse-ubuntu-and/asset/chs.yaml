  \n定期审查你的安全策略也非常重要。审计有助于确保你的 Linux 系统是安全的，并且已经实施了适当的安全策略和实践。\n\n你已经完成了收集基础安全程序和原则知识的第一步。但仅仅了解基础是不够的。你还需要将高级的\
  \ Linux 安全工具添加到你的安全工具箱中。在下一章中，将涵盖加密和身份验证模块等高级安全主题。\n\n## 练习\n\n参考本章的材料完成以下任务。如果你遇到困难，附录\
  \ B 中提供了任务的解决方案（尽管在 Linux 中，通常有多种方法可以完成任务）。在参考答案之前，请尝试每项练习。这些任务假设你正在运行 Fedora 或红帽企业\
  \ Linux 系统（尽管某些任务在其他 Linux 系统上同样有效）。\n\n1. 检查 `systemd` 日中以下服务的日志消息：`NetworkManager.service`、`sshd.service`\
  \ 和 `auditd.service`。\n2. 列出包含系统用户密码的文件的权限，并判断这些权限是否合适。\n3. 使用单个命令确定你的账户密码过期情况以及它是否会过期。\n\
  4. 使用 `auditd` 守护进程启动对 `/etc/shadow` 的写入审计，然后检查你的审计设置。\n5. 使用 `auditd` 守护进程创建 `/etc/shadow`\
  \ 文件的报告，然后关闭该文件的审计。\n6. 安装 `lemon` 软件包，破坏 `/usr/bin/lemon` 文件（或许将 `/etc/services`\
  \ 复制到那里），验证文件是否已被篡改，并移除 `lemon` 包。\n7. 你怀疑今天你的系统遭受了恶意攻击，重要的二进制文件已被修改。你应该使用什么命令来寻找这些被修改的文件？\n\
  8. 安装并运行 `chkrootkit`，以查看练习 7 中的恶意攻击是否安装了根内核程序（rootkit）。\n9. 找到设置了 `SetUID` 或 `SetGID`\
  \ 权限的文件。\n10. 安装 `aide` 包，运行 `aide` 命令初始化 aide 数据库，将数据库复制到正确的位置，并运行 `aide` 命令检查你的系统上是否有任何重要文件被修改。\n\
  \n# 第 23 章：理解高级 Linux 安全\n\n由于威胁不断变化和增长，实施基础计算机安全措施已不再足够。当恶意用户获得高级工具的访问权限和知识时，Linux\
  \ 系统管理员也必须如此。理解高级计算机安全主题和工具必须成为你准备工作的一部分。在本章中，你将学习加密基础知识，例如密码算法和加密。你还将学习身份验证模块实用程序如何简化你的管理工作，尽管它是一个高级安全主题。\n\
  \n## 使用加密实现 Linux 安全\n\n使用加密可以增强你的 Linux 系统及其网络通信的安全性。`Cryptography` 是隐藏信息的科学。它有着悠久而丰富的历史，可以追溯到计算机出现很久以前。由于大量使用了数学算法，加密很容易过渡到计算机。Linux\
  \ 自带许多加密工具供你使用。\n\n为了理解加密概念和各种 Linux 工具，你应该了解一些加密术语：\n\n* **明文（Plaintext）**——人类或机器可以读取和理解的文本\n\
  * **密文（Cipher text）**——人类或机器无法读取和理解的文本\n* **加密（Encryption）**——使用算法将明文转换为密文的过程\n\
  * **解密（Decryption）**——使用算法将密文转换为明文的过程\n* **密码（Cipher）**——用于将明文加密为密文以及将密文解密为明文的算法\n\
  * **分组密码（Block cipher）**——在加密前将数据拆分为块的密码\n* **流密码（Stream cipher）**——在不拆分数据的情况下加密数据的密码\n\
  * **密钥（Key）**——密码成功加密或解密数据所需的一段数据\n\n父母经常使用某种形式的加密。他们通过拼写单词而不是口说单词。一位父母可以将明文单词“candy”通过对另一位父母说“C-A-N-D-Y”将其转换为密文。另一位父母使用相同的拼写密码解密该单词，并识别出单词是“candy”。遗憾的是，孩子们并很快就能学会如何通过拼写密码进行解密。\n\
  \n你可能注意到，在之前的加密定义列表中没有包含哈希（hashing）。哈希需要一些关注，因为它经常与加密混淆。\n\n### 理解哈希\n\n哈希不是加密，但它是加密的一种形式。记住第\
  \ 22 章提到的，`hashing` 是一种用于创建密文的单向数学过程。然而，与加密不同，在你创建哈希之后，你无法将其反哈希回原始明文。\n\n为了让哈希算法在计算机安全中被使用，它必须是**无冲突的**（collision-free），这意味着哈希算法不会两个完全不同的输入输出相同的哈希。每个输入都必须有唯一的哈希输出。因此，`cryptographic\
  \ hashing` 是一种无冲突的单向数学过程。\n\n默认情况下，Linux 系统上已经在使用加密。例如，`/etc/shadow` 文件包含哈希后的密码。哈希在\
  \ Linux 系统中用于：\n\n* 密码（第 22 章）\n* 验证文件\n* 数字签名\n* 病毒签名（第 22 章）\n\n哈希也称为消息摘要、校验和、指纹或签名。一种生成消息摘要的\
  \ Linux 实用程序是 `md5sum`。在第 10 章“获取和管理软件”中，你学习了获取软件。当你下载一个软件文件时，可以确保它没有损坏。\n\n图 23.1\
  \ 显示了下载 Linux 发行版的网站（存储为称为 ISO 镜像的形式）。该网页包含一个消息摘要 5（MD5）数字，你可以使用它来确保下载的 ISO 镜像没有损坏。\n\
  \n![image](img/00066.jpeg)\n\n图 23.1 Linux Mint ISO 下载网页提供了一个 MD5 数字。哈希是使用 MD5 算法对原始位置的软件文件生成的。哈希结果可以公开发，如图\
  \ 23.1 所示。为了确保你下载的软件文件的完整性，你在本地位置对软件文件创建一个 MD5 哈希。然后，你将你的哈希结果与发布的哈希进行比较。如果它们匹配，说明软件文件在下载过程中没有损坏。\n\
  \n要创建你的哈希，在下载 ISO 镜像后使用 `md5sum` 运行哈希算法。下载的软件文件的 `md5sum` 哈希结果所示：\n\n```\n$ md5sum\
  \ linuxmint-17.1-cinnamon-64bit.iso\n0307ffcd5046c176599904193899426e  linuxmint-17.1-cinnamon-64bit.iso\n\
  ```\n\n生成的哈希与图 23.1 网站上发布的哈希匹配。这意味着下载的 ISO 文件没有损坏，可以使用。\n\n除了哈希之外，你还可以在 Linux 系统上实现更多的加密。用于这些的\
  \ Linux 实用程序非常易用。然而，你你需要理解更多底层的加密概念。\n\n### 理解加密/解密\n\n\n\n\n\n在 Linux 系统中，加密的主要用途是对数据进行编码，以防止未经授权的视线查看（加密），然后供授权用户对数据进行解码（解密）。在\
  \ Linux 系统上，你可以加密以下内容：\n\n* 单个文件\n* 分区和卷\n* 网页连接\n* 网络连接\n* 备份文件\n* Zip 文件\n\n这些加密/解密过程使用特殊的数学算法来完成任务。这些算法被称为\
  \ `cryptographic ciphers`（加密算法）。\n\n### 理解加密算法\n\n原始算法之一的凯撒密码是由尤利斯·凯撒创建并使用的。然而，它非常容易破解。今天可以使用更多安全的算法。理解每种算法的工作原理是非常重要的，因为你选择的加密强度应该与你的数据安全需求直接相关。表\
  \ 23.1 列出了几种现代算法。\n\n| 方法 | 说明 |\n| :--- | :--- |\n| AES (高级加密标准)也称为 Rijndael |\
  \ 对称加密。块加密，使用 128 位、192 位或 256 位密钥对 128 位、192 位或 256 位块的数据进行加密/解密。 |\n| Blowfish\
  \ | 对称加密。块加密，使用相同的 32 位到 448 位密钥对 64 位块的数据进行加密/解密。 |\n| CAST5 | 对称加密。块加密，使用相同的最高\
  \ 128 位密钥对 64 位块的数据进行加密/解密。 |\n| DES (数据加密标准) | 再再被认为是安全的。对称加密。块加密，使用相同的 56 位密钥对\
  \ 64 位块的数据进行加密/解密。 |\n| 3DES | 改进的 DES 算法。对称加密。在加密过程之前，数据会使用 3 个不同的 56 位密钥进行多达 48\
  \ 次加密。 |\n| El Gamal | 非对称加密。使用从对数算法派生的两个密钥。 |\n| 椭圆曲线加密系统 | 非对称加密。使用从包含椭圆曲线上两个随机选择点的算法派生的两个密钥。\
  \ |\n| IDEA | 对称加密。块加密，使用相同的 128 位密钥对 64 位块的数据进行加密/解密。 |\n| RC4 也称为 ArcFour 或 ARC4\
  \ | 流加密，使用可变密钥大小对 64 位块的数据进行加密/解密。 |\n| RC5 | 对称加密。块加密，使用相同的最高 2,048 位密钥对 32 位、64\
  \ 位或 128 位块的数据进行加密/解密。 |\n| RC6 | 对称加密。与 RC5 相同，但速度稍快。 |\n| Rijndael 也称为 AES | 对称加密。块加密，使用\
  \ 128 位、192 位或 256 位密钥对 128 位、192 位或 256 位块的数据进行加密/解密。 |\n| RSA | 最流行的非对称加密。使用从两个随机生成的质数的倍数的算法派生的两个密钥。\
  \ |\n\n**表 23.1** 加密算法\n\n### 理解加密密钥\n\n加密算法需要一段称为“密钥”的数据来完成其加密/解密的数学过程。密钥可以是单个密钥，也可以是一对密钥。\n\
  \n注意 表 23.1 中列出的不同加密密钥大小。密钥大小与算法破解的难易程度直接相关。密钥越大，破解算法的机会就越小。例如，`DES` 因为其 56 位的短密钥而不再被认为是安全的。然而，密钥大小为\
  \ 256 位或 512 位的算法被认为是安全的，因为暴力破解此类密钥加密算法需要数万年时间。\n\n#### 对称密钥加密\n\n`Symmetric cryptography`（对称加密），也称为密钥或私钥加密，使用单一密钥算法对明文进行加密。解密数据需要相同的密钥。对称密钥加密的优点是速度快。缺点是如果加密数据要由另一个人解密，就需要共享该密钥。\n\
  \nLinux 系统上对称密钥加密的一个示例是使用 OpenPGP 工具 GNU Privacy Guard，即 `gpg2` 完成的。Fedora 和 RHEL\
  \ 默认安装了 `gnupg2` 软件包。对于 Ubuntu，你需要安装 `gnupg2` 包来获取 `gpg2` 命令。\n\n接下来的示例显示了使用 `tar`\
  \ 命令创建压缩归档包（`backup.tar.gz`）以及用于加密文件的 `gpg2` 工具。使用 `-c` 选项，`gpg2` 使用对称密钥加密文件。保留原始文件并创建一个新的加密文件\
  \ `backup.tar.gz.gpg`。\n\n```\n# tar -cvzf /tmp/backup.tar.gz /etc\n# gpg2 -c --force-mdc\
  \ -o tmp/backup.tar.gz.gpg /tmp/backup.tar.gz\nEnter passphrase: ******\nRepeat\
  \ passphrase: ******\n# cd /tmp ; file backup*\nbackup.tar.gz: gzip compressed data,\
  \ last modified: ...\nbackup.tar.gz.gpg: GPG symmetrically encrypted data (CAST5\
  \ cipher)\n```\n\n用于加密文件的单一密钥受密码短（passphrase）保护。该密码短仅是用户在加密时选择的密码或短语。\n\n要解密文件，再次使用\
  \ `gpg2` 工具。例如，如果你将文件交给另一个用户，该用户可以运行带有 `-d` 选项的 `gpg2` 并提供私密钥的密码短。\n\n```\n$ gpg2\
  \ -d --force-mdc /tmp/backup.tar.gz.gpg > /tmp/backup.tar.gz\n<弹出的窗口要求输入密码短>\ngpg:\
  \ CAST5 encrypted data\ngpg: encrypted with 1 passphrase\nThis is my secret message.\n\
  ...\n```\n\n结果是原始的 tar 文件被解密并复制到 `/tmp/backup.tar.gz`。如果系统上运行着 `gpg-agent` 守护进程，该密码短会被缓存，因此再次解密该文件时无需输入。\n\
  \n对称密钥加密相当简单易懂。非对称加密复杂得多，且往往令人困惑。\n\n#### 非对称密钥加密\n\n`Asymmetric cryptography`（非对称加密），也称为私钥/公钥加密，使用两个密钥，称为\
  \ `key pair`。密钥对由公钥和一个私钥组成。公钥正如其名是公开的。不需要保密。私钥则需要保密。\n\n非对称加密的基本思想如图 图 23.2 所示。使用密钥对的公钥对明文文件进行加密。加密后的文件可以安全地传输给其他人。解密文件使用私钥。该私钥必须来自该公私密钥对。因此，使用公钥加密的数据只能用其私钥解密。非对称加密的优点是安全性更高。缺点是速度和密钥管理。\n\
  \n![image](img/00067.jpeg)\n\n**图 23.2** 基本非对称密钥加密\n\n你可以使用 `gpg2` 在 Linux 系统上执行非对称加密。它是一个多功能的加密工具。在加密文件之前，你必须先创建密钥对和“密钥环”。在接下来的示例中，使用了\
  \ `gpg2 --gen-key` 命令。该命令根据用户 `johndoe` 的指定规格创建一个公私钥密钥对。它还生成了一个密钥环来存储他的密钥。\n\n\n\
  \n\n\n```\n$ gpg2 --gen-key\ngpg (GnuPG) 2.0.22; Copyright (C)\n 2013 Free Software\
  \ Foundation, Inc.\n...\nPlease select what kind of key you want:\n   (1) RSA and\
  \ RSA (default)\n   (2) DSA and Elgamal\n   (3) DSA (sign only)\n   (4) RSA (sign\
  \ only)\nYour selection? 1\nRSA keys may be between 1024 and 4096 bits long.\nWhat\
  \ keysize do you want? (2048) 2048\nRequested keysize is 2048 bits\nPlease specify\
  \ how long the key should be valid.\n         0 = key does not expire\n      <n>\
  \  = key expires in n days\n      <n>w = key expires in n weeks\n      <n>m = key\
  \ expires in n months\n      <n>y = key expires in n years\nKey is valid for? (0)\
  \ 7\nKey expires at Mon 05 Dec 2016 03:55:29 AM EST\nIs this correct? (y/N) y\n\
  You need a user ID to identify your key.\nReal name: John Doe\nEmail address: jdoe@example.com\n\
  Comment: The User\nYou selected this USER-ID:\n    \"John Doe (The User) <jdoe@gmail.com>\"\
  \nChange (N)ame, (C)omment, (E)mail or (O)kay/(Q)uit? O\nYou need a Passphrase to\
  \ protect your secret key.\nEnter passphrase: **********\nRepeat passphrase: **********\n\
  ...\ngpg: /home/johndoe/.gnupg/trustdb.gpg: trustdb created\ngpg: key 3B2E46D5 marked\
  \ as ultimately trusted\npublic and secret key created and signed.\n...\npub   2048R/3B2E46D5\
  \ 2015-12-08 [expires: 2015-12-15]\n      Key fingerprint = E202 8E43 3784 69EF\
  \ 118B\n  275C BA45 7DBF 3B2E 46D5\nuid                  John Doe (The User) <jdoe@example.com>\n\
  sub   2048R/0F0E0672 2015-12-087 [expires: 2016-12-15]\n```\n\n在在上述示例中，`gpg2` 工具请求了若干项规范以生成所需的私钥/公钥：\n\
  \n*   **加密算法（Cryptography cipher）**——示例中选择了 RSA。\n*   **位长度（Bit size）**——更长的密钥长度提供更高的安全性。\n\
  *   **有效期（Validity period）**——示例中选择了七天。\n*   **用户 ID（User ID）**——这用于标识公钥/私钥对中的公钥部分。\n\
  *   **密码短（Passphrase）**——这用于识别和保护公钥/私钥对中的私钥部分。\n\n用户 `johndoe` 可以通过 `gpg2 --list-keys`\
  \ 命令检查他的密钥环，如后续代码所示。注意公钥的用户 ID (UID) 的显示方式与其创建时完全一致，包含了 `johndoe` 的真实姓名、注释和电子邮件地址。\n\
  \n```\n$ gpg2 --list-keys\n/home/johndoe/.gnupg/pubring.gpg\n--------------------------------\n\
  pub   2048R/3B2E46D5 2015-12-08 [expires: 2016-12-15]\nuid                  John\
  \ Doe (The User) <jdoe@example.com>\nsub   2048R/0F0E0672 2015-12-08 [expires: 2016-12-15]\n\
  ```\n\n生成密钥对和密钥环后，就可以对文件进行加密和解密。首先，必须从密钥环中提取公钥以便共享。在接下来的示例中，使用了 `gpg2` 工具从 `johndoe`\
  \ 的密钥环中提取公钥。提取出的密钥被放在文件中进行共享。文件名可以是任何你喜欢的名称。在这种情况下，用户 `johndoe` 选择了文件名 `JohnDoe.pub`。\n\
  \n```\n$ gpg2 --export John Doe > JohnDoe.pub\n$ ls *.pub\nJohnDoe.pub\n```\n\n\
  包含公钥的文件可以通过多种方式共享。它可以作为电子邮件的附件发送，甚至可以发布在网页上。公钥被认为是公开的，因此不需要隐藏。在接下来的示例中，`johndoe`\
  \ 将包含其公钥的文件交给了用户 `jill`。`jill` 使用 `gpg2 --import` 命令将 `johndoe` 的公钥添加到她的密钥环中。用户\
  \ `jill` 使用 `gpg2 --list-keys` 命令查看她的密钥环，以验证 `johndoe` 的公钥已添加。\n\n```\n$ ls *.pub\n\
  JohnDoe.pub\n$ gpg2 --import JohnDoe.pub\ngpg: directory '/home/jill/.gnupg' created\n\
  ...\ngpg: key 3B2E46D5:\n public key \"John Doe (The User) <jdoe@example.com>\"\
  \ imported\ngpg: Total number processed: 1\ngpg:               imported: 1  (RSA:\
  \ 1)\n$ gpg2 --list-keys\n/home/jill/.gnupg/pubring.gpg\n-----------------------------------\n\
  pub   2048R/3B2E46D5 2016-12-08 [expires: 2016-12-15]\nuid                  John\
  \ Doe (The User) <jdoe@example.com>\nsub   2048R/0F0E0672 2016-12-08 [expires: 2016-12-15]\n\
  ```\n\n将密钥添加到密钥环后，该公钥即可用于为公钥原始所有者加密数据。在后续的示例代码中，请注意以下点：\n\n*   `jill` 为用户 `johndoe`\
  \ 创建了一个文本文件 `MessageForJohn.txt`。\n*   她使用他的公钥对文件进行加密。\n*   加密后的文件 `MessageForJohn`\
  \ 通过 `--out` 选项创建。\n*   `--recipient` 选项仅使用其公钥 UID 中的真实姓名部分 `\"John Doe\"` 来识别 `johndoe`\
  \ 的公钥。\n\n```\n$ gpg2 --out MessageForJohn --recipient \"John Doe\" \\\n --encrypt\
  \ MessageForJohn.txt\n...\n$ ls\nJohnDoe.pub  MessageForJohn  MessageForJohn.txt\n\
  ```\n\n从明文文件 `MessageForJohn.txt` 创建的加密消息文件 `MessageForJohn` 可以安全地发送给用户 `johndoe`。为了解密此消息，`johndoe`\
  \ 使用他的私钥，该密钥通过最初创建密钥时使用的密码进行识别和保护。在 `johndoe` 提供正确的密码后，`gpg2` 会解密消息文件并将其放入 `--out`\
  \ 选项指定的物理 `JillsMessage`。解密后，他就可以读取明文消息。\n\n```\n$ ls MessageForJohn\nMessageForJohn\n\
  $ gpg2 --out JillsMessage --decrypt MessageForJohn\nEnter passphrase: **********\n\
  Repeat passphrase: **********\ngpg: key 3B2E46D5: decrypted\ngpg: Total number processed:\
  \ 1\ngpg:               decrypted: 1\n```\n\n\n\n\n\n正如你所见，数字签名包含了密码哈希和非对称密钥加密。这个复杂的过程通常由已配置好的应用程序处理，而不是直接由\
  \ Linux 系统用户来处理。然而，你可以手动为文档添加自己的数字签名。\n\n假设用户 `johndoe` 准备向用户 `christineb` 发送一条消息，并带上他的数字签名。他创建了一个包含要发送的明文消息的文件。他使用\
  \ `gpg2` 工具来创建签名文件并加密消息文件。`--sign` 选项告诉 `gpg2` 工具 `MessageForChristine.txt` 是要加密的文件并用于创建数字签名。作为响应，`gpg2`\
  \ 工具执行了以下操作：\n\n*   创建消息文件的消息摘要（也称为哈希值）\n*   加密消息摘要，从而创建数字签名\n*   加密消息文件\n*   将加密后的内容放入由\
  \ `--output` 选项指定的文件 `JohnDoe.DS` 中\n\n`JohnDoe.DS` 文件现在包含一个经过加密并带有数字签名的消息。下面的代码演示了这一过程：\n\
  \n```\n$ gpg2 --output JohnDoe.DS --sign MessageForJill.txt\nYou need a passphrase\
  \ to unlock the secret key for\nuser: \"John Doe (The User) <jdoe@example.com>\"\
  \n2048-bit RSA key, ID 3B2E46D5, created 2016-12-08\n```\n\n在用户 `jill` 接收到经过签名和加密的文件后，她可以使用\
  \ `gpg2` 工具一步到位完成检查数字签名和解密文件的操作。在接下来的代码中，使用了 `--decrypt` 选项配合数字签名文件的文件名 `JohnDoe.DS`。文件的消息被解密并显示出来。文件的数字签名经过检查，结果显示为有效。\n\
  \n```\n$ gpg2 --decrypt JohnDoe.DS\nI am the real John Doe!\ngpg: Signature made\
  \ Mon 27 Feb 2016 09:42:36 AM EST\n using RSA key ID 3B2E46D5\ngpg: Good signature\
  \ from \"John Doe (The User) <jdoe@example.com>\"\n...\n```\n\n如果她的密钥环中没有 `johndoe`\
  \ 的公钥，`jill` 将无法解密此消息并检查数字签名。\n\n理解一些密码学基础将帮助你开始使用加密来保护你的 Linux 系统。请记住，我们在本书中仅涵盖了基础知识。还有许多更多密码学主题，例如数字证书和公密钥基础设施，非常值得花时间学习。\n\
  \n## 实现 Linux 密码学\n\n你的 Linux 系统上有许多密码学工具。选择哪种工具取决于你组织的安全需求。以下是对可用 Linux 密码学工具的简要回顾。\n\
  \n### 确保文件完整性\n\n在本章之前，使用消息摘要工具 `md5sum` 检查了 ISO 文件的完整性。另一个常用的消息摘要工具是使用 SHA-1 哈希的\
  \ `sha1sum`。它在命令行中的工作方式与 `md5sum` 工具相同，如下代码所示。如果 ISO 文件列出的是 SHA-1 哈希而不是 MD5 校验和，你可以使用以下命令来检查哈希。\n\
  \n```\n$ sha1sum Fedora-Live-Desktop-x86_64-20-1.iso\na4cec536ed5bd0c0754eb8840d5af475\
  \  Fedora-Live-Desktop-x86_64-20-1.iso\n```\n\n不幸的是，截至 2005 年，SHA-1 哈希标准由于某些“数学上的弱性”不再被认为是密码哈希。然而，与\
  \ MD5 一样，这并没有降低它在检查文件完整性方面的流行。\n\n如果你的特定组织需要真正的密码哈希工具，你必须使用 SHA-2 密码哈希工具之一。在 Linux\
  \ 上，这些工具包括：\n\n*   `sha224sum`\n*   `sha256sum`\n*   `sha384sum`\n*   `sha512sum`\n\
  \n这些工具的工作方式与 `sha1sum` 命令完全相同，只不过它们使用的是 SHA-2 密码哈希标准。各种 SHA-2 工具之间的唯一区别在于它们使用的密钥长度。`sha224sum`\
  \ 命令使用 224 位的密钥，`sha256sum` 命令使用 256 位的密钥，依此类推。记住，密钥越长，破解密码的可能性就越小。\n\nSHA-2 密码哈希标准由国家安全局（NSA）创建。他们很快还将发布另一个密码哈希标准\
  \ SHA-3。\n\n### 加密 Linux 文件系统\n\n你可能需要对你的 Linux 服务器上的整个文件系统进行加密。可以通过多种方式实现，包括使用自由开源软件（FOSS）第三方工具，如\
  \ TrueCrypt（[`www.truecrypt.org`](http://www.truecrypt.org)）或 Linux 统一密钥设置（LUKS）（[`https://code.google.com/p/cryptsetup/`](https://code.google.com/p/cryptsetup/)））。\n\
  \nLinux 中的选项之一是在安装时加密根分区（参见第 9 章，“安装 Linux”）。许多 Linux 发行版在安装过程中都包含加密选项。图 23.3 显示了\
  \ Fedora 安装期间的加密选项。\n\n![image](img/00068.jpeg)\n\n图 23.3 Linux Fedora 安装加密选项\n\n\
  在安装期间选择此选项后，系统会要求输入密码。这是使用密码保护单个密钥的对称密钥加密。图 23.4 显示了安装所需的密钥密码。密码至少要有八个字符。\n\n![image](img/00069.jpeg)\n\
  \n图 23.4 Linux Fedora 加密对称密钥密码\n\n如果你选择了此加密选项，每当启动系统时，都会被要求输入对称密钥密码。图 23.5 显示了它的样子。这保护了根分区，防止其所在的磁盘被盗。\n\
  \n![image](img/00070.jpeg)\n\n图 23.5 启动时请求加密对称密钥密码\n\n如果你继承了一个带有加密磁盘的系统，可以使用 root\
  \ 权限通过 `lvs` 和 `cryptsetup` 命令以及 `/etc/crypttab` 文件来帮助。在下面，`lvs` 命令显示了系统当前所有的逻辑卷及其底层设备名称。请参见第\
  \ 12 章，“管理磁盘和文件系统”以对 `lvs` 命令进行回顾。\n\n```\n# lvs -o devices\n  Devices\n  /dev/mapper/luks-b099fbbe-0e56-425f-91a6-44f129db9f(56)\n\
  \  /dev/mapper/luks-b099fbbe-0e56-425f-91a6-44f129db9f(0)\n```\n\n在该系统中，请注意底层设备名称以\
  \ `luks` 开头。这表示使用了 Linux 统一密钥设置（LUKS）标准。\n\n加密的逻辑卷在启动时使用 `/etc/crypttab` 文件中的信息进行挂载，如下所示。注意\
  \ `luks` 名称与 `lvs` 命令列出的名称相同。\n\n```\n# cat /etc/crypttab\nluks-b099fbbe-0e56-425f-91a6-44f129db9f4b\n\
  \     UUID=b099fbbe-0e56-425f-91a6-44f129db9f4b none\n```\n\n你还可以使用 `cryptsetup`\
  \ 命令帮助你获取有关 Linux 系统加密卷的更多信息。在下面的示例中，使用了 `status` 选项配合 `luks` 设备名称确定进一步信息。\n\n```\n\
  # cryptsetup status luks-b099fbbe-0e56-425f-91a6-44f129db9f4b\n/dev/mapper/luks-b099fbbe-0e56-425f-91a6-44f129db9f4b\n\
  \ is active and is in use.\n  type:    LUKS1\n  cipher:  aes-xts-plain64\n  keysize:\
  \ 512 bits\n  device:  /dev/sda3\n  offset:  4096 sectors\n  size:    493819904\
  \ sectors\n  mode:    read/write\n```\n\n### 加密 Linux 目录\n\n你也可以使用 `ecryptfs` 工具在\
  \ Linux 系统上进行加密。`ecryptfs` 工具并不是名称所暗示的文件系统类型。相反，它是一个符合 POSIX 标准的工具，允许你在任何文件系统之上创建加密层。\n\
  \n\n\n\n\n`ecryptfs` 实用在 Fedora 和 RHEL 上没有默认安装。要安装该工具，你必须使用命令 `yum install ecryptfs-utils`。如果\
  \ Debian 系统上未安装，请使用命令 `sudo apt-get install ecrypt-utils`。\n\n在接下来的示例中，用户 `johndoe`\
  \ 将使用 `ecryptfs` 工具对一个子目录进行加密。首先，在加密之前，该目录中不应有任何文件。如果该处有文件，请将它们移动到安全的地方，直到加密完成。如果你不移动它们，在目录加密期间你将无法访问它们。\n\
  \n现在，要加密 `/home/johndoe/Secret` 目录，请使用 `mount` 命令。查看后续示例中使用的 `mount` 命令。它与普通的 `mount`\
  \ 命令相似，不同之处使用的分区类型是 `ecryptfs`。要挂载的项及其挂载点是同一个目录！你实际上是在加密该目录并将其挂载到自身。该 `mount` 命令的另一个不寻之处在于它会启动\
  \ `ecryptfs` 工具，该工具会询问几个交互式问题。\n\n```\n# mount -t ecryptfs /home/johndoe/Secret\
  \ /home/johndoe/Secret\nSelect key type to use for newly created files:\n 1) tspi\n\
  \ 2) passphrase\n 3) pkcs11-helper\n 4) openssl\nSelection: 2\nPassphrase: **********\n\
  Select cipher:\n 1) aes: blocksize = 16;\n min keysize = 16; max keysize = 32 (loaded)\n\
  \ 2) blowfish: blocksize = 16;\n min keysize = 16; max keysize = 56 (not loaded)\n\
  \ 3) des3_ede: blocksize = 8;\n min keysize = 24; max keysize = 24 (not loaded)\n\
  \ 4) twofish: blocksize = 16;\n min keysize = 16; max keysize = 32 (not loaded)\n\
  \ 5) cast6: blocksize = 16;\n min keysize = 16; max keysize = 32 (not loaded)\n\
  \ 6) cast5: blocksize = 8;\n min keysize = 5; max keysize = 16 (not loaded)\nSelection\
  \ [aes]: 1\nSelect key bytes:\n 1) 16\n 2) 32\n 3) 24\nSelection [16]: 16\nEnable\
  \ plaintext passthrough (y/n) [n]: n\nEnable filename encryption (y/n) [n]: n\n\
  Attempting to mount with the following options:\n  ecryptfs_unlink_sigs\n  ecryptfs_key_bytes=16\n\
  \  ecryptfs_cipher=aes\n  ecryptfs_sig=70993b8d49610e67\nWARNING: Based on the contents\
  \ of [/root/.ecryptfs/sig-cache.txt]\nit looks like you have never mounted with\
  \ this key\nbefore. This could mean that you have typed your\npassphrase wrong.\n\
  Would you like to proceed with the mount (yes/no) : yes\nWould you like to append\
  \ sig [70993b8d49610e67] to\n[/root/.ecryptfs/sig-cache.txt]\nin order to avoid\
  \ this warning in the future (yes/no)? : yes\nSuccessfully appended new sig to user\
  \ sig cache file\nMounted eCryptfs\n```\n\n`ecryptfs` 工具允许你选择以下内容：\n\n* 密钥类型\n*\
  \ 密码\n* 密算法\n* 密钥大小（字节）\n* 启用或禁用明文透传\n* 启用或禁用文件名加密\n\n当你首次挂载此加密目录时，它也会发出警告，因为该密钥之前没有使用过。该工具允许你对挂载的目录应用数字签名，这样当你再次\
  \ `mount` 它时，它只需要挂载目录而不需要密码。\n\n你可以再次使用 `mount` 命令验证加密目录是否已挂载。在示例中，使用了 `mount` 命令并通过\
  \ `grep` 以搜索 `/home/johndoe/Secret` 目录。该目录以 `ecryptfs` 类型挂载。\n\n```\n# mount | grep\
  \ /home/johndoe/Secret\n/home/johndoe/Secret on /home/johndoe/Secret type ecryptfs\n\
  (rw,relatime,ecryptfs_sig=70993b8d49610e67,ecryptfs_cipher=aes,\necryptfs_key_bytes=16,ecryptfs_unlink_sigs)\n\
  ```\n\n到目前，你还没有看到这个挂载并加密目录的效果。在接下来的文中，文件 `my_secret_file` 被复制到加密目录中。用户 `johndoe`\
  \ 仍然可以使用 `cat` 命令以明文形式显示文件。该文件由 `ecryptfs` 层自动解密。\n\n```\n$ cp my_secret_file Secret\n\
  $ cat /home/johndoe/Secret/my_secret_file\nShh... It's a secret.\n```\n\nroot 用户也可以使用\
  \ `cat` 命令以明文形式显示文件。\n\n```\n# cat /home/johndoe/Secret/my_secret_file\nShh... It's\
  \ a secret.\n```\n\n然而，在使用 `umount` 命令卸载加密目录后，文件将不再能够自动解密。文件 `my_secret_file` 现在变成了乱码，即使是\
  \ root 用户也无法读取。\n\n```\n# umount /home/johndoe/Secret\n```\n\n因此，`ecryptfs` 工具允许你在文件系统上创建一个位置来快速加密和解密文件。然而，当该目录不再作为\
  \ `ecryptfs` 类型挂载后，文件就是安全的，无法解密。\n\n### 加密 Linux 文件\n\nLinux 系统上最流行的文件加密工具是 OpenPGP\
  \ 工具 GNU Privacy Guard，即 `gpg`。它的灵活性和多种选项，加上它在大多数 Linux 发行版中默认安装的特性，增加了它的吸引力。\n\n\
  然而，你可以使用 Linux 系统上的其他几种加密工具来加密文件。就像 `gpg` 一样，这些许多工具都允许你执行比文件加密多多的操作。以下是一些你可以用于加密文件的常用\
  \ Linux 加密工具：\n\n* `aescrypt`——它使用对称密钥密码 Rijndael，也称为 AES。该工具可以在 [`aescript.com](http://www.aescript.com)\
  \ 下载。\n* `bcrypt`——它使用 blowfish 密算法。它没有默认安装。安装 `bcrypt` 后查看手册页。\n    * Fedora 和\
  \ RHEL：`yum install bcrypt`\n    * Ubuntu：`sudo apt-get install bcrypt`\n* `ccrypt`——它使用对称密钥密码\
  \ Rijndael，也称为 AES。它是为了取代标准的 Unix `crypt` 工具而创建的，没有默认安装。安装 `ccrypt` 后查看手册页。\n  \
  \  * Fedora 和 RHEL：`yum install ccrypt`\n    * Ubuntu：`sudo apt-get install ccrypt`\n\
  * `gpg`——该工具可以使用非对称密钥对或对称密钥。它是默认安装的，是 Linux 服务器的首选加密工具。默认算法在 `gpg.conf` 文件中设置。\n\
  \n### 使用杂工具加密 Linux\n\n你可以加密 Linux 中的几乎一切。除了文件和目录，你还可以加密备份、Zip 文件、网络连接等。\n\n[表 23.2]\
  \ 列出了杂杂 Linux 加密工具及其功能。如果你想查看当前 Linux 发行版上安装的所有加密工具列表，请在命令行输入 `man -k crypt`。\n\n\
  | 工具 | 描述 |\n| :--- | :--- |\n| `Duplicity` | 加密备份。在 Fedora 和 RHEL 上默认安装。在 Ubuntu\
  \ 上安装，请输入 `sudo apt-get install duplicity`。 |\n| `gpg-zip` | 使用 GNU Privacy Guard\
  \ 对存档进行加密或签名。默认安装。 |\n| `Openssl` | 实现安全套接层 (SSL) 和传输层安全 (TLS) 协议的工具包。这些协议需要加密。默认安装。\
  \ |\n| `Seahorse` | 一个 GNU Privacy Guard 加密密钥管理器。在 Ubuntu 上默认安装。在 Fedora 和 RHEL\
  \ 上安装，请输入 `yum install seahorse`。 |\n| `Ssh` | 加密跨远程访问。默认安装。 |\n| `Zipcloak` | 加密\
  \ Zip 文件中的项目。默认安装。 |\n\n\n\n\n与 Linux 系统上的许多其他项目一样，可用的加密工具非常丰富。这为你提供了所需的灵活性和多样性，以实现你特定组织所需的加密标准。\n\
  \n## 从桌面使用加密\n\n“密码和密钥”（Passwords and Keys）窗口提供了从 GNOME 桌面查看和管理密钥及密码的方法。可以通过从“活动”屏幕选择“密码和密钥”图标或通过运行\
  \ `seahorse` 命令来启动此窗口。在出现的窗口中，你可以进行以下操作：\n\n*   **密码 (Passwords)**——当你访问网站并输入用户名和密码（且选择保存该密码）时，它会被存储在你的系统中，以便下次访问该网站时使用。选择“密码”标题下的`Login`条目可以查看每个保存的用户名和密码。\n\
  *   **证书 (Certificates)**——你可以查看与 Gnome2 密钥存储（Gnome2 Key Storage）、用户密钥存储（User Key\
  \ Storage）、系统信任（System Trust）和默认信任（Default Trust）关联的证书。\n*   **PGP 密钥**——你可以选择`GnuPG\
  \ keys`条目查看查看创建的 GPG 密钥。图 23.6 显示了选择在本章早些创建的 John Doe 条目的结果，以查看该用户私钥的详情。\n*   **安全外壳\
  \ (Secure shell)**——你可以创建公的和私有的 OpenSSH 密钥，让你使用这些密钥而不是密码通过 `ssh`、`scp`、`rsync`、`sftp`\
  \ 以及相关命令登录远程系统。选择 OpenSSH keys 以查看你为此目的创建的任何密钥。（有关创建此类类型密钥的信息，请参阅第 13 章的“使用基于密钥的无密码身份验证”章节。）\n\
  \n![image](img/00071.jpeg)\n\n**图 23.6 从“密码和密钥”窗口 (seahorse) 查看系统上的私钥。**\n\n对于图\
  \ 23.6，我选择了早些为 John Doe 创建的私钥的“详情”选项卡。从该选项卡，你可以看到此类信息，如密钥的创建时间和过期时间、密钥类型及其指纹，以及可以过期或撤销的子密钥。\n\
  \nLinux 上提供的另一个极其强大的安全工具是 PAM。本章的下一节将涵盖 PAM 的基本概念，以及你如何使用此工具进一步增强你的 Linux 系统的安全性。\n\
  \n## 使用 PAM 实现 Linux 安全\n\n*可插身份验证模块 (Pluggable Authentication Modules, PAM)* 由太阳微系统（Sun\
  \ Microsystems）发明，最初在 Solaris 操作系统中实现。Linux-PAM 项目始 1997 年。今天，大多数 Linux 发行版都使用 PAM。\n\
  \nPAM 简化了身份验证管理过程。请记住，*身份验证*（参见第 22 章“理解基础 Linux 安全”）是确定主体（即用户或进程）确实是其所称身份的过程。这个过程有时被称为“识别和身份验证”。PAM\
  \ 是一种为 Linux 系统和应用程序提供身份验证的集中方法。\n\n应用程序可以编写为使用 PAM，并被称为“PAM 感知”（PAM-aware）。PAM\
  \ 感知应用程序不需要重写和重新编译即可更改其身份验证设置。任何所需的更改都在 PAM 感知应用程序的 PAM 配置文件内完成。因此，这些应用程序的身份验证管理是集中且简化的。\n\
  \n你可以查看特定的 Linux 应用程序或实用是否是 PAM 感知的。检查它是否用 PAM 库 `libpam.so` 编译。在接下来的示例中，正在检查 `crontab`\
  \ 应用程序的 PAM 感知性。`ldd` 命令检查文件的共享库依赖。为了简单起见，使用 `grep` 搜索 PAM 库。如你所见，此特定 Linux 系统上的\
  \ `crontab` 是 PAM 感知的。\n\n```\n# ldd /usr/bin/crontab | grep pam\nlibpam.so.0 =>\
  \ /lib/libpam.so.0 (0x44d12000)\n```\n\n在你的 Linux 系统上使用 PAM 的益处包括：\n\n*   从管理员角度简化并集中身份验证管理\n\
  *   简化应用程序开发，因为开发者可以使用有文档说明的 PAM 库编写应用程序，而不是编写自己的身份验证程序\n*   身份验证的灵活性：\n    *  \
  \ 根据传统标准（如识别）允许或拒绝访问资源\n    *   根据额外标准（如时间段限制）允许或拒绝访问\n    *   设置主体限制，如资源使用情况\n\n\
  尽管 PAM 的益处简化了身份验证管理，但 PAM 的实际工作原理并不简单。\n\n### 理解 PAM 身份验证过程\n\n当主体（用户或进程）请求访问 PAM\
  \ 感知的应用程序或实用程序时，会使用两个主要组件来完成主体身份验证过程：\n\n*   PAM 感知应用程序的配置文件\n*   配置文件使用的 PAM 模块\n\
  \n每个 PAM 感知应用程序配置文件都是过程的核心。PAM 配置文件调用特定的 PAM 模块来执行所需的身份验证。PAM 模块从系统授权数据中验证主体，例如使用\
  \ LDAP 的集中用户账户（参见第 11 章“管理用户账户”）。\n\nLinux 自带了许多 PAM 感知的应用程序，它们所需的配置文件和 PAM 模块已经安装完毕。如果你有任何特殊的身份验证需求，你很可能找到已经为该需求编写好的\
  \ PAM 模块。但在开始调整 PAM 之前，你需要更深入了解它的运行方式。\n\nPAM 使用模块和配置文件采取了一系列步骤以确保发生正确的应用程序身份验证：\n\
  \n1.  主体（用户或进程）请求访问应用程序。\n2.  打开并读取应用程序的 PAM 配置文件，该文件包含访问策略。访问策略通过要使用的 PAM 模块列表来设置。这个\
  \ PAM 模块列表被称为*栈*（stack）。\n3.  栈中的每个 PAM 模块按照其列出的顺序被调用。\n4.  每个 PAM 模块返回成功或失败状态。\n\
  5.  栈继续按顺序读取，不会因为单个失败状态返回而停止。\n6.  将所有 PAM 模块的状态结果合并为单一的身份验证成功或失败结果。\n\n通常情况下，如果单个\
  \ PAM 模块返回失败状态，则拒绝访问应用程序。然而，这取决于配置文件的设置。\n\n大多数 PAM 配置文件位于 `/etc/pam.d`。PAM 配置文件的通用格式为：\n\
  \n```\n上下文   控制标志   PAM 模块[模块选项]\n```\n\n以下显示了 `poweroff` 命令的 PAM 配置文件。注意文件开头是一个注释行。所有以\
  \ `#` 字符头的行都会被忽略。\n\n```bash\n$ cat /etc/pam.d/poweroff\n#%PAM-1.0\nauth       sufficient\
  \   pam_rootok.so\nauth       required     pam_console.so\n#auth       include \
  \     system-auth\naccount    required     pam_permit.so\n```\n\n记住，配置文件栈中列出的所有\
  \ PAM 模块按顺序被调用并要求返回状态。在前面的 PAM 中，通过返回三个状态来决定主体是否可以访问 `poweroff` 命令。为了更好地理解如何使用这些配置文件，你需要审查通用格式的每个部分。\n\
  \n### 理解 PAM 上下文\n\n\n\n\n\nPAM 模块具有标准功能，可以提供不同的身份验证服务。PAM 模块中的这些标准功能可以分为功能类型，称为\
  \ `contexts`（上下文）。上下文也可以称为 `module interfaces`（模块接口）或 `types`（类型）。表 23.3 列出了不同的\
  \ PAM 上文以及它们提供的身份验证服务类型。\n\n| 上下文 | 服务描述 |\n| :--- | :--- |\n| `auth` | 提供身份验证管理服务，例如验证账户密码\
  \ |\n| `account` | 提供账户验证服务，例如访问时间段限制 |\n| `password` | 管理账户密码，例如密码长度限制 |\n| `session`\
  \ | 管理已认证会话的开始和结束，例如向安全日志发送信息 |\n\n**表 23.3** PAM 上文\n\n在处再次显示的 `poweroff` 配置文件中，只使用了两个\
  \ PAM 上文：`auth` 和 `account`。因此，该应用程序不需要 PAM `password` 或 `session` 管理服务。注意，其中一个\
  \ `auth` 上文被忽略了，因为它该行以 `#` 字符开头：\n\n```\n$ cat /etc/pam.d/poweroff\n#%PAM-1.0\n\
  auth       sufficient   pam_rootok.so\nauth       required     pam_console.so\n\
  #auth       include      system-auth\naccount    required     pam_permit.so\n```\n\
  \n在上述代码所示的配置文件，`auth` 上文出现了两次。对于每个 `auth` 上文，使用了不同的控制标志和 PAM 模块。每个控制标志都有特殊的含义和功能。\n\
  \n### 理解 PAM 控制标志\n\n在 PAM 配置文件中，控制标志用于确定返回给应用程序的整体状态。控制标志是以下两种之一：\n\n*   **简单关键字**——这里关注的是相应的\
  \ PAM 模块返回的是“失败”（failed）还是“成功”（success）响应。参见表 23.4 查看如何处理这些状态。\n*   **一系列操作**——返回的模块状态通过文件中列出的系列操作进行处理。\n\
  \n| 控制标志 | 响应处理描述 |\n| :--- | :--- |\n| `required` | 如果失败，则在栈中运行完其余的上下文后，向应用程序返回失败状态。例如，对于一个必需的（requisite）控制，当有人输入无效用户名时，可能会导致登录失败。但在用户输入密码之前可能不会被告知失败，从而隐藏了错误用户名导致失败的事实。\
  \ |\n| `requisite` | 如果失败，则立即向应用程序返回失败状态，而不运行栈的其余部分。（注意您在栈中放置此控制标志的位置。）例如，一个必需的（requisite）控制可能要求基于密钥的身份验证，并在未提供有效密钥时立即失败。在这种情况下，它可能在提示用户名/密码之前就失败了。\
  \ |\n| `sufficient` | 如果失败，则忽略模块状态。如果成功，则立即向应用程序返回成功状态，而不运行栈的其余部分。（注意您在栈中放置此控制标志的位置。）\
  \ |\n| `optional` | 此控制标志仅对最终的成功或失败整体返回状态重要。可以将其视为一个平局者。当配置文件栈中的其他模块返回的状态不是明确的失败或成功状态时，将使用此可选（optional）模块的状态来确定最终状态或打破平局。在栈中的其他模块返回明确的失败或成功路径的情况下，此状态将被忽略。\
  \ |\n| `include` | 获取此特定 PAM 配置文件栈的所有返回状态，并将其包含在此栈的整体返回状态中。这就像是命名配置文件的整个栈现在都在此配置文件中一样。\
  \ |\n| `substack` | 与 `include` 控制标志类似，不同在于某些错误和评估如何影响主栈。这强制要求包含的配置文件栈作为主栈的子栈运行。因此，某些错误和评估只影响子栈，而不影响主栈。\
  \ |\n\n**表 23.4** PAM 配置控制标志和响应处理**\n\n表 23.4 显示了各种关键字控制标志及其对返回的模块状态的响应。注意，几个控制标志需要仔细放置在配置文件的栈中。某些控制标志会导致身份验证过程立即停止，而不调用其余的\
  \ PAM 模块。控制标志仅控制如何将 PAM 模块状态结果组合成单一的整体结果。表 23.4 演示了状态结果是如何组合的。\n\n你应该知道，PAM 模块返回的状态结果代码比比“成功”或“失败”多得多。例如，模块可能会返回\
  \ `PAM_ACCT_EXPIRED` 状态代码，这意味着用户账户已过期。这会被视为“失败”。\n\n### 理解 PAM 模块\n\nPAM 模块实际上是存储在\
  \ `/lib/security` 中的一组共享库模块（`DLL` 文件）。你可以在命令行中输入 `ls /lib/security/pam*.so` 来查看系统上安装的各种\
  \ PAM 模块列表。\n\n你的 Linux 系统已经预装了许多所需的 PAM 模块。你不能自己编写任何 PAM 模块。如果你确实需要一个尚未安装的模块，很可能别人已经写好了。检查以下来源：\n\
  \n*   [`http://www.openwall.com/pam/`](http://www.openwall.com/pam/)\n*   [`http://puszcza.gnu.org.ua/software/pam-modules/download.html`](http://puszcza.gnu.org.ua/software/pam-modules/download.html)\n\
  \n### 理解 PAM 系统事件配置文件\n\n到目前为止，重点一直是感知 PAM 的应用程序及其配置文件。然而，其他系统事件（例如登录 Linux 系统）也使用\
  \ PAM。因此，这些事件也有配置文件。\n\n以下是 PAM 配置文件目录的部分目录列表。注意，既有感知 PAM 的应用程序配置文件（如 `cond`），也有系统事件配置文件（如\
  \ `postlogin-ac`）。\n\n```\n# ls -l /etc/pam.d\ntotal 204\n-rw-r--r--. 1 root root\
  \  272 Nov 15 10:06 atd\n...\n-rw-r--r--. 1 root root  232 Jan 31 12:35 config-util\n\
  -rw-r--r--. 1 root root  293 Oct 26 23:10 crond\n...\n-rw-r--r--. 1 root root  109\
  \ Feb 28 01:33 postlogin-ac\n-rw-r--r--. 1 root root  147 Oct  3 11:51 poweroff\n\
  ...\n-rw-r--r--. 1 root root  981 Feb 28 01:33 system-auth-ac\n...\n```\n\n你可以修改这些系统事件配置文件来实现实施组织的特定安全需求。例如，可以修改\
  \ `system-auth-ac` 文件以强制某些密码限制。\n\n\n\n\n\n此外，PAM 的功能不仅限于前面描述的应用程序身份验证步骤。PAM 还可以限制资源、限制访问时间、强制执行良好的密码策略等。\n\
  \n## 管理感知 PAM 的应用程序配置文件\n\n您应该检查为感知 PAM 的应用程序和工具的 PAM 配置文件，以确保它们的身份验证过程符合贵组织预期的身份验证流程。您的访问控制矩阵（参见第\
  \ 22 章，“理解基础 Linux 安全”）以及本章中提供的关于理解 PAM 的信息，将帮助您对 PAM 配置文件进行审计。\n\n每个感知 PAM 的应用程序都应该有自己独立的\
  \ PAM 配置文件。每个配置文件定义了该应用程序使用了哪些特定的 PAM 模块。如果不存在配置文件，可能会为该应用程序创建一个安全漏洞。该漏洞可能被用于恶意目的。作为安全预防措施，PAM\
  \ 自带了一个“other”配置文件。如果一个感知 PAM 的应用程序没有 PAM 配置文件，它将默认使用“other” PAM 配置文件。\n\n您可以使用\
  \ `ls` 命令验证您的 Linux 系统是否具有 `/etc/pam.d/other` 配置文件。接下来的示例显示该系统确实存在 `/etc/pam.d/other`\
  \ PAM 配置文件。\n\n```\n$ ls /etc/pam.d/other\n/etc/pam.d/other\n```\n\nPAM `/etc/pam.d/other`\
  \ 配置文件应该拒绝所有访问，这在安全领域中被称为“隐式拒绝”（Implicit Deny）。在计算机安全访问控制中，`Implicit Deny` 意味着如果不明确满足某些标准，则必须拒绝访问。在这种情况下，如果感知\
  \ PAM 的应用程序不存在配置文件，则对它的所有访问都将被拒绝。以下显示了 `/etc/pam.d/other` 文件的内容：\n\n```\n$ cat /etc/pam.d/other\n\
  #%PAM-1.0\nauth     required       pam_deny.so\naccount  required       pam_deny.so\n\
  password required       pam_deny.so\nsession  required       pam_deny.so\n```\n\n\
  注意所有的 PAM 上下文——`auth`、`account`、`password` 和 `session` 都被列出了。每个上下文都使用了 `required`\
  \ 控制标志和 `pam_deny.so` 模块。`pam_deny.so` PAM 模块用于拒绝访问。\n\n即使有了“other”配置文件，如果感知 PAM\
  \ 的应用程序没有 PAM 配置文件，也必须创建它。将此项添加到您的 PAM 审计检查列表中。您还应该检查 Linux 系统上的 PAM “other”配置文件，以确保它执行了隐式拒绝。\n\
  \n## 管理 PAM 系统事件配置文件\n\n与感知 PAM 的应用程序和工具配置文件类似，您的 PAM 系统事件配置文件也需要根据组织的访问控制矩阵进行审计。然而，对这些文件进行任何所需的修改，必须采取额外的步骤。\n\
  \n在后续内容中，您将学习如何在 Linux 系统上通过 PAM 设置特殊的安全需求，例如账户登录时间限制。许多特殊需求要求您对 PAM 系统事件配置文件进行更改，例如\
  \ `/etc/pam.d/system-auth-ac`。\n\n修改某些 PAM 系统事件配置文件的问题是，`authconfig` 工具可能会重写这些文件并移除任何本地进行的更改。幸运的是，每个面临此风险的\
  \ PAM 配置文件都在内部注释行中进行了说明。使用 `grep`，您可以快速找到哪些 PAM 配置文件存在此潜在问题。\n\n```\n# grep \"authconfig\"\
  \ /etc/pam.d/*\n/etc/pam.d/fingerprint-auth:# User changes will be destroyed\n \
  \  the next time authconfig is run.\n/etc/pam.d/fingerprint-auth-ac:# User changes\
  \ will be destroyed\n   the next time authconfig is run.\n...\n/etc/pam.d/system-auth:#\
  \ User changes will be destroyed\n    the next time authconfig is run.\n/etc/pam.d/system-auth-ac:#\
  \ User changes will be destroyed\n    the next time authconfig is run.\n...\n```\n\
  \n这些 PAM 系统事件配置文件使用符号链接（参见第 4 章，“在文件系统中移动”）。例如，您可以看到文件 `system-auth` 实际上是指向 `system-auth-ac`\
  \ 文件的符号链接。文件权限第一个字符是 `l`，这表示该文件是链接。`->` 符号显示该文件是符号链接。\n\n```\n# ls -l system-auth\n\
  lrwxrwxrwx. 1 root root 14 Feb 28 01:36\n system-auth -> system-auth-ac\n```\n\n\
  `authconfig` 工具不使用符号链接，也不修改它们。因此，您可以创建一个新的本地 PAM 系统事件配置文件，并将符号链接指向它。这允许您的系统实现所需的安全修改，并让您能够避免配置文件被\
  \ `authconfig` 工具覆盖。基本步骤如下，包括对 `system-auth-ac` 文件执行这些步骤的示例：\n\n1. 将当前 PAM 系统事件配置文件复制到新文件，添加一个新的文件名后缀，例如“local.”。\n\
  \n   ```\n   # cp system-auth-ac system-auth-local\n   ```\n\n2. 对新配置文件进行必要的更改。\n\
  \n   ```\n   # vi system-auth-local\n   ```\n\n3. 删除旧的符号链接文件。\n\n   ```\n   # ls\
  \ -l system-auth\n   lrwxrwxrwx. 1 root root 14 Feb 28 01:36\n    system-auth ->\
  \ system-auth-ac\n   # rm system-auth\n   ```\n\n4. 创建一个指向新文件的符号符号链接。\n\n   ```\n\
  \   # ln -s system-auth-local system-auth\n   ```\n\n在完成这些更改后，您可以对“local”（local）系统事件配置文件进行任何所需的更改，而无需担心被\
  \ `authconfig` 工具覆盖。\n\n## 使用 PAM 实现资源限制\n\n管理资源不仅是系统管理任务，也是安全管理任务。设置资源限制可以帮助您避免\
  \ Linux 系统上的许多问题。此类炸弹（fork bombs）问题可以通过限制单个用户创建的进程数来避免。炸弹是指进程递归地产生另一个进程，直到系统资源被耗尽。炸弹可能是恶意的，也可能是由于开发不当意外产生的。\n\
  \nPAM 模块 `pam-limits` 使用特殊的配置文件设置这些资源限制：`/etc/security/limits.conf`。默认情况下，该文件中没有设置资源限制。因此，您需要检查文件并设置符合组织安全需求的限制。\n\
  \n以下片段显示了 `/etc/security/limits.conf` 文件。该文档齐全。您应该阅读该文件的内容，以获取的格式说明和可以设置的限制示例。\n\
  \n```\n$ cat /etc/security/limits.conf\n# /etc/security/limits.conf\n#每行描述用户的限制，格式如下：\n\
  #<domain>        <type>  <item>  <value>\n#其中：\n...\n*               soft    core\
  \            0\n*               hard    rss             10000\n#@student       \
  \ hard    nproc           20\n#@faculty        soft    nproc           20\n#@faculty\
  \        hard    nproc           50\n#ftp             hard    nproc           0\n\
  #@student        -       maxlogins       4\n# 文件结束\n```\n\n格式项 `domain` 和 `type`\
  \ 比配置文件中记录的需要更详细的解释：\n\n- `domain`——该限制适用于列出的用户或组。如果定义域为“*”，则它适用于*所有*用户。\n\n- `type`——`hard`（硬限制）不能超出。`soft`（软限制）可以超出，但仅是暂时的。\n\
  \n\n\n\n\n查看下面的 `limits.conf` 文件设置示例。列表中列出了 `faculty` 组，但请注意 `nproc`。`nproc` 限制设置了用户启动的最大进程数。此设置可以防止\
  \ fork 炸弹（fork bomb）。注意到 `type` 选择类型为 `hard`（硬限制）；因此不能超过 50 个进程的限制。当然，由于该行被 `#`\
  \ 符号注释掉了，因此该限制并未生效。\n\n```\n#@faculty        hard    nproc           50\n```\n\n\
  限制设置是按登录设置的，并且仅在登录会话期间有效。恶意用户可能会多次登录以创建 fork 炸弹。因此，为这些用户账户设置最大登录次数限制也是一个好主意。\n\n\
  限制最大登录次数可能需要按用户进行。例如，`johndoe` 只需要登录 Linux 系统一次。为了防止他人使用 `johndoe` 的账户，请将其账户的 `maxlogins`\
  \ 设置为 1。\n\n```\njohndoe        hard    maxlogins           1\n```\n\n限制此资源的最后一步是确保使用\
  \ `limits.conf` 的 PAM 模块包含在某个 PAM 系统事件配置文件中。使用 `limits.conf` 的 PAM 模块是 `pam_limits`。在接下来的部分列表中，使用\
  \ `grep` 来验证 PAM 模块是否已在系统事件配置文件中使用。\n\n```\n# grep \"pam_limits\" /etc/pam.d/*\n\
  ...\nsystem-auth:session        required      pam_limits.so\nsystem-auth-ac:session\
  \     required      pam_limits.so\nsystem-auth-local:session  required      pam_limits.so\n\
  ```\n\n访问服务和账户的时间限制并不由 PAM `/etc/security/limits.conf` 配置文件处理。相反，它们由 `time.conf`\
  \ 文件处理。\n\n### 使用 PAM 实现时间限制\n\nPAM 可以让你的整个 Linux 系统按照“PAM 时间”运行。时间限制（例如在一天中的特定时间访问特定应用程序，或仅允许指定的星期几登录）都由\
  \ PAM 处理。\n\n处理这些限制的 PAM 配置文件位于 `/etc/security` 目录。以下代码显示了文档良好的 `/etc/security/time.conf`\
  \ PAM 配置文件。\n\n```\n$ cat /etc/security/time.conf\n# this is an example configuration\
  \ file for the pam_time module\n...\n# the syntax of the lines is as follows:\n\
  #\n#       services;ttys;users;times\n...\n```\n\n我建议你通读 `time.conf` 文件的内容。注意每个有效条目的格式遵循此语法：`services`;`;`ttys`;`;`users`;`;`times`。字段之间由分号分隔。有效的字段值已在\
  \ `time.conf` 配置文件中记录。\n\n虽然 `time.conf` 有详细的文档，但有一个示例总是有帮助的。例如，你决定普通用户仅可以在工作日（周一至周五）在终端上登录。他们可以在这些工作日的上午\
  \ 7 点到下午 7 点之间登录。以下列表描述了需要设置的元素：\n\n*   `services`—登录 (Login)\n*   `ttys`—`*`（指定包含所有终端）\n\
  *   `users`—除 root 以外的所有 (`!root`)\n*   `times`—允许在工作日 `(Wd)` 上午 7 点 (`0700`) 到下午\
  \ 7 点 (`1900`)\n\n`time.conf` 中的条目看起来如下：\n\n```\nlogin; * ; !root ; Wd0700-1900\n\
  ```\n\n实现此示例时间限制的最后一步是确保使用 `time.conf` 的 PAM 模块包含在某个 PAM 系统事件配置文件中。使用 `time.conf`\
  \ 的 PAM 模块是 `pam_time`。在接下来的部分列表中，`grep` 显示了 PAM 模块；`pam_time` 未在任何系统事件配置文件中使用。\n\
  \n```bash\n# grep \"pam_time\" /etc/pam.d/*\nconfig-util:auth              sufficient\
  \   pam_timestamp.so\nconfig-util:session           optional     pam_timestamp.so\n\
  selinux-polgengui:auth        sufficient   pam_timestamp.so\nselinux-polgengui:session\
  \     optional     pam_timestamp.so\nsystem-config-selinux:auth    sufficient  \
  \ pam_timestamp.so\nsystem-config-selinux:session optional     pam_timestamp.so\n\
  ```\n\n由于 `pam_time` 未在列表中，你必须修改 `/etc/pam.d/system-auth` 文件，以便 PAM 强制执行时间限制。PAM\
  \ 配置文件 `system-auth` 用于 PAM 在系统登录和修改密码期间。该配置文件会检查许多项目，例如时间限制。\n\n在配置文件的“account”部分顶部添加以下内容。现在，`pam_time`\
  \ 模块将检查你在 `/etc/security/time.conf` 文件中设置的登录限制。\n\n```\naccount    required   pam_time.so\n\
  ```\n\n记住 `system-auth` 是一个符号链接文件。如果你修改了此文件，必须采取额外步骤以防止修改内容被 `authconfig` 工具覆盖。请查阅本章较之前的“管理\
  \ PAM 系统事件配置文件”部分。\n\n你可以使用额外的 PAM 模块和配置文件对主体设置更多的限制。其中一个重要的模块是 `pam_cracklib`。\n\
  \n### 使用 PAM 强制执行强密码\n\n当修改密码时，`pam_cracklib` 模块会检查其强度。你可以通过修改 `/etc/pam.d/passwd`\
  \ 文件来更改 `cracklib` 使用的规则。`/etc/pam.d/passwd` 文件包含了 `system-auth`。\n\n`/etc/pam.d/passwd`\
  \ 的内容所示：\n\n```\n# cat /etc/pam.d/passwd\n%PAM-1.0\nauth       include     system-auth\n\
  account    include     system-auth\npassword   substack    system-auth\npassword\
  \   optional    pam_gnome_keyring.so use_authtok\npassword   substack    postlogin\n\
  ```\n\n此处显示 `system-auth` 文件的设置。目前，有一个条目调用了 `pam_cracklib`。\n\n```\n# cat /etc/pam.d/system-auth\n\
  %PAM-1.0\n# This file is auto-generated.\n# User changes will be destroyed the time\
  \ authconfig is run.\nauth        required      pam_env.so\nauth        sufficient\
  \    pam_fprintd.so\nauth        sufficient    pam_unix.so nullok try_first_pass\n\
  auth        requisite     pam_succeed_if.so uid >= 1000\nauth        required  \
  \    pam_deny.so\naccount     required      pam_unix.so\naccount     sufficient\
  \    pam_localuser.so\naccount     sufficient    pam_succeed_if.so uid < 1000 quiet\n\
  account     required      pam_permit.so\npassword    requisite     pam_cracklib.so\
  \ try_first_pass retry=3\n```\n\n上述列表中的 `pam_cracklib` 条目使用了 `retry` 关键字。`cracklib`\
  \ 可用以下关键字：\n\n*   `retry=``N`\n    *   默认 = 1\n    *   在返回错误之前，最多提示用户 `N` 次。\n*\
  \   `difok=``N`\n    *   默认 = 5\n    *   新密码中必须不同于旧密码的字符数量。\n    *   异常 1：如果新密码中有一半的字符是不同的，则接受新密码。\n\
  \    *   异常 2：查看 `difignore`。\n*   `difignore=``N`\n    *   默认 = 23\n    *   在忽略\
  \ `difok` 设置之前，密码所拥有的字符数。\n*   `minlen=``N`\n    *   默认 = 9\n    *   新密码的最小接受长度。\n\
  \    *   查看 `dcredit`、`ucredit`、`lcredit` 和 `ocredit` 以了解它们的设置如何影响 `minlen`。\n*\
  \   `dcredit=``N`\n    *   默认 = 1\n\n\n\n\n\n- `If (N >= 0)`: 新密码中包含数字的最高信用分。如果数字个数少于\
  \ `N` 个，则每个数字都会为满足当前的 `minlen` 值计加 +1 分分。\n- `If (N < 0)`: 新密码必须满足的数字数量。\n- `ucredit=N`\n\
  \    - 默认值 = 1\n    - `If (N >= 0)`: 新密码中包含大写字母的最高信用分。如果大写字母少于 `N` 个，则每个字母都会为满足当前的\
  \ `minlen` 值计加 +1 分分。\n    - `If (N < 0)`: 新密码必须满足的大写字母数量。\n- `lcredit=N`\n    -\
  \ 默认值 = 1\n    - `If (N >= 0)`: 新密码中包含小写字母的最高信用分。如果小写字母少于 `N` 个，则每个字母都会为满足当前的 `minlen`\
  \ 值计加 +1 分分。\n    - `If (N < 0)`: 新密码必须满足的小写字母数量。\n- `ocredit=N`\n    - 默认值 = 1\n\
  \    - `If (N >= 0)`: 新密码中包含其他字符的最高信用分。如果其他字符少于 `N` 个，则每个字符都会为满足当前的 `minlen` 值计加\
  \ +1 分分。\n    - `If (N < 0)`: 新密码必须满足的其他字符数量。\n- `minclass=N`\n    - 默认值 = 0\n \
  \   - 新密码需要满足四种字符类中的 `N` 类。这四类分别是：数字、大写字母、小写字母和其他字符。\n- `maxrepeat=N`\n    - 默认值\
  \ = 0\n    - 拒绝包含超过 `N` 个相同连续字符的密码。\n- `reject_username`: 检查新密码是否包含正序或反序的用户名。如果发现，则拒绝该新密码。\n\
  - `try_first_pass`: 尝试从之前的 PAM 模块获取密码。如果失败，则提示用户输入密码。\n- `use_authtok`: 此参数用于强制模块不向用户提示新密码。相反，新密码将由之前堆叠的\
  \ `password` 模块提供。\n- `dictpath=/path`: `cracklib` 字典路径。\n\n例如，如果你的组织要求密码长度为十个字符且必须包含两个数字，你可以在\
  \ `/etc/pam.d/system-auth` 文件中添加类似下行的内容：\n\n```\npassword required pam_cracklib.so\
  \ minlen=10 dcredit=-2\n```\n\n在此示例中配合 `pam_cracklib` 使用的关键字是：\n- `minlen=10`—新密码至少必须有十个字符。\n\
  - `dcredit=-2`—新密码必须包含两个数字。\n\n## 使用 PAM 鼓励使用 sudo\n\n为了允许跟踪个人对 root 账户的使用并避免出现不可否认的情况（参见第\
  \ 22 章，“理解基础 Linux 安全性”），你应该限制 `su` 命令的使用并鼓励使用 `sudo`。如果你的组织有此类策略，只需几步即可通过 PAM 实现。\n\
  \n`su` 命令是感知 PAM 的，这极大地简化了操作。它使用 PAM 模块 `pam_wheel` 来检查 `wheel` 组中的用户。此处显示 `/etc/pam.d/su`\
  \ 配置文件：\n\n```\n# cat /etc/pam.d/su\n#%PAM-1.0\nauth        sufficient    pam_rootok.so\n\
  # 取消下面行的注释以隐式信任\n# \"wheel\" 组中的用户。\n#auth        sufficient  pam_wheel.so trust\
  \ use_uid\n# 取消下面行的注释以要求用户必须\n# 在 \"wheel\" 组中。\n#auth        required    pam_wheel.so\
  \ use_uid\nauth        include       system-auth\nauth        include       postlogin\n\
  account     sufficient    pam_succeed_if.so uid = 0 use_uid quiet\naccount     include\
  \       system-auth\npassword    include       system-auth\nsession     include\
  \       system-auth\nsession     include       postlogin\nsession     optional \
  \     pam_xauth.so\n```\n\n首先，为了限制 `su` 的使用，如果你使用 `wheel` 组作为管理组，你需要将你的管理组重新分配到一个新组（参见第\
  \ 11 章，“管理用户账户”）。如果你未使用 `wheel` 组，只需确保在将来不要将任何人分配到该组。\n\n接下来，你需要编辑 `/etc/pam.d/su`\
  \ 配置文件。从以下行移除注释标记 `#`：\n\n```\n#auth        required    pam_wheel.so use_uid\n```\n\
  \n通过这些修改，PAM 禁用了 `su` 命令的使用。现在管理用户现在必须使用 `sudo`，系统会对其进行跟踪，并提供预期的不可否认环境（参见第 22 章，“理解基础\
  \ Linux 安全性”）。\n\n## 使用 PAM 锁定账户\n\n组织的特定安全要求可能要求在一定次数的登录尝试后锁定账户。典型的标准是在失败三次后锁定账户。这是为了防止针对账户的暴力破解攻击。\n\
  \n用于管理登录尝试的 PAM 模块是 `pam_tally2`。需要编辑的 PAM 配置文件是 `/etc/pam.d/system-auth`。\n\n再次，你应该对本地的\
  \ `system-auth-local` 文件进行更改，而不是 `system-auth-ac`，因为 `authconfig` 在下次运行时会覆盖你的修改。你需要添加到\
  \ `system-auth-local` 中的 `tally2` 所在的行在随后的示例文件中已高亮显示。它们在文件中的位置至关重要。\n\n```\n# cat\
  \ system-auth-local\n#%PAM-1.0\n# 本地 system-auth 文件。\n# 更改不会被 authconfig 破坏\nauth\
  \        required      pam_tally2.so deny=3 quiet\nauth        required      pam_env.so\n\
  auth        sufficient    pam_fprintd.so\nauth        sufficient    pam_unix.so\
  \ nullok try_first_pass\nauth        requisite     pam_succeed_if.so uid >= 1000\
  \ quiet\nauth        required      pam_deny.so\naccount     required      pam_tally2.so\n\
  account     required      pam_unix.so\naccount     sufficient    pam_localuser.so\n\
  account     sufficient    pam_succeed_if.so uid < 1000 quiet\naccount     required\
  \      pam_permit.so\n...\n```\n\n在上述代码中涉及 `pam_tally.so` 的第一个 `auth` 上文行上，注意添加了两个选项\
  \ `deny=3` 和 `quiet`。`deny=3` 选项允许用户在账户锁定之前只有三次登录的机会。\n\n`quiet` 选项在账户被锁定时不会告诉用户账户已锁定。它会继续向用户发送“密码错误”的消息。如果你正受到恶意攻击，让用户对账户发生了什么一无所知是有帮助的。恶意攻击者并不知道账户已被锁定，认为自己只是又输了一次错误的密码。这可以为你留出时间追踪正在发生的情况。\n\
  \n然而，使用 `quiet` 可能会给你的用户带来很多问题。例如，用户可能没有意识到自己输入错误密码的次数已经足够锁定账户。这可能会导致寻求帮助的延迟。你可以从设置文件中移除\
  \ `quiet` 选项，这样当用户登录尝试过多时，他们会收到诸如“由于 4 次失败登录，账户已锁定”之的消息。\n\n`pam_tally2` 模块还包含一个你可以用于监控登录失败尝试的命令行界面。如果\
  \ `pam_tally2` 模块包含在你的 PAM 系统事件配置文件中，它会记录系统上发生了多少次失败登录尝试。要查看这些失败情况，你输入 `pam_tally2`\
  \ 命令，如下所示：\n\n```\n# pam_tally2\nLogin           Failures Latest failure     From\n\
  Samantha            2    03/10/15 06:24:01  pts/1\n```\n\n\n\n\n用户名、失败次数和最后尝试将与发生最后失败的终端一起列出。你还可以使用\
  \ `pam_tally2` 命令在用户账户被 PAM `pam_tally2` 模块锁定后解锁。\n\n当账户被 PAM 锁定时，它在 `/etc/shadow`\
  \ 文件中不会被列为锁定，且你无法通过 `usermod -U username` 命令来解锁它。要解锁它，你需要使用 `pam_tally2` 命令。\n\n\
  在接下来的示例中，用户账户 `Samantha` 有多次失败登录尝试。然而，通过 `passwd` 命令显示，该账户在 `/etc/shadow` 文件中并未被锁定。使用\
  \ `usermod -L` 命令锁定账户会导致账户通过 `/etc/shadow` 文件锁定，而不是通过 PAM。\n\n```\n# pam_tally2\n\
  Login           Failures Latest failure     From\nSamantha            5    03/10/16\
  \ 06:32:24  pts/1\n# passwd -S Samantha\nSamantha PS 2016-03-09 0 99999 7 -1 (Password\
  \ set, SHA512 crypt.)\n# usermod -L Samantha\n# passwd -S Samantha\nSamantha LK\
  \ 2016-03-09 0 99999 7 -1 (Password locked.)\n# usermod -U Samantha\n# passwd -S\
  \ Samantha\nSamantha PS 2016-03-09 0 99999 7 -1 (Password set, SHA512 crypt.)\n\
  ```\n\n在接下来的代码中，执行了 `pam_tally2 -r -u Samantha` 命令来解锁用户账户 `Samantha`。注意，`pam_tally2`\
  \ 命令在移除“锁定”状态时再次列出了失败尝试的次数。当再次执行 `pam_tally2` 命令时，用户 `Samantha` 的失败尝试记录已被移除，因为锁定已被移除。\n\
  \n```\n# pam_tally2 -r -u Samantha\nLogin           Failures Latest failure    \
  \ From\nSamantha            5    03/10/15 06:34:09  pts/1\n# pam_tally2\n```\n\n\
  你可以在 `pam_tally2` 使用更多选项。要进一步探索此 PAM 模块，请在命令行执行 `man pam_tally2`。\n\n### 获取更多关于\
  \ PAM 的信息\n\nPAM 是 Linux 系统上提供的另一种丰富且多功能的安全工具。在你 Linux 系统的 `man` 页面中，你可以阅读有关管理 PAM\
  \ 配置文件以及 `/lib/security` 目录下的模块的内容。\n\n*   要获取更多关于 PAM 配置文件的信息，请使用命令 `man pam.conf`。\n\
  *   你可以通过命令行输入 `ls /lib/security/pam*.so` 查看系统中所有可用的 PAM 模块。要获取关于每个 PAM 模块的更多信息，请输入\
  \ `man pam_module_name`。确保在 `pam_module_name.` 后省略“so”文件后缀。例如，输入 `man pam_lastlog`\
  \ 来学习更多关于 `pam_lastlog.so` 模块的信息。\n\n一些网站可以提供关于 PAM 的额外信息：\n\n*   Linux-PAM 官网：[`http://linux-pam.org`](http://linux-pam.org)\n\
  *   Linux-PAM 系统管理员指南：[`http://linux-pam.org/Linux-PAM-html/Linux-PAM_SAG.html`](http://linux-pam.org/Linux-PAM-html/Linux-PAM_SAG.html)\n\
  *   PAM 模块参考：[`http://linux-pam.org/Linux-PAM-html/sag-module-reference.html`](http://linux-pam.org/Linux-PAM-html/sag-module-reference.html)\n\
  \n## 总结\n\n加密工具提供了保护和验证你在 Linux 系统上使用的数据有效性的方法。PAMset 提供了一种创建策略的方法，以保护用于在系统中验证用户的工具。\n\
  \n在学习 Linux 的过程中，应该小心处理加密工具和 PAM。在将任何修改应用于生产机器之前，请务必在测试 Linux 系统或虚拟化 Linux 系统上对其进行测试。\n\
  \n下一章将介绍 SELinux。虽然加密和 PAM 是可以在 Linux 系统上使用的工具，但 SELinux 是一个整个安全增强层。\n\n## 练习\n\n\
  使用这些练习来测试你对使用加密工具和 PAM 的知识。这些任务假设你正在运行 Fedora 或 Red Hat Enterprise Linux 系统（尽管某些任务也适用于其他\
  \ Linux 系统）。如果你遇到困难，任务的解决方案可以在附录 B 中（尽管在 Linux 中，通常有多种方法来完成一项任务）。\n\n1.  使用 `gpg2`\
  \ 实用和对称密钥加密文件。\n2.  使用 `gpg2` 实用生成公密钥环。\n3.  列出你生成的密钥环。\n4.  使用 `gpg2` 实用加密文件并添加你的数字签名。\n\
  5.  访问 Linux Mint 首页 [`www.linuxmint.com`](http://www.linuxmint.com)。在下载页面，选择一个\
  \ Linux Mint 发行版进行下载。下载完成后，使用适当的消息摘要工具确保下载的文件没有损坏。\n6.  使用命令 `which su` 确定 `su`\
  \ 命令的完整文件名。，确定你 Linux 系统上的 `su` 命令是否感知 PAM。\n7.  `su` 命令是否有 PAM 配置文件？如果是，在屏幕上显示该配置文件并列出它使用的\
  \ PAM 上下文。\n8.  在屏幕上列出系统上的各种 PAM 模块。\n9.  在你的系统中找到 PAM “other”配置文件。它是否存在？它是否强制执行隐式拒绝（Implicit\
  \ Deny）？\n10. 找到 PAM 限制配置文件。它是否有设置可以防止系统上发生派叉炸（fork bomb）？\n\n# 第 24 章：使用 SELinux\
  \ 增强 Linux 安全\n\n安全增强 Linux (SELinux) 是由国家安全局 (NSA) 以及其他安全研究组织（如 Secure Computing\
  \ Corporation (SCC)）开发的。SELinux 于 2000 年发布给开源社区，并在 Red Hat 在其 Linux 发行版中包含 SELinux\
  \ 后流行起来。现在，SELinux 被许多组织使用并广泛可用。\n\n## 理解 SELinux 的益处\n\nSELinux 是部署在 Linux 之上的安全增强模块。它提供了额外的安全措施，默认包含，并在\
  \ RHEL 和 Fedora 中被设置为强制（Enforcing）模式。\n\nSELinux 通过通过实施基于角色的访问控制（RBAC）对主体和对象（即进程和资源），在\
  \ Linux 上提供了改进安全性。“传统”Linux 安全使用的是自主性访问控制（DAC）。\n\nSELinux 不是 DAC 的替代品。相反，它是一个额外的安全层。\n\
  \n*   在使用 SELinux 时仍然使用 DAC 规则。\n*   首先检查 DAC 规则，如果允许访问，则检查 SELinux 策略。\n*   如果\
  \ DAC 规则拒绝访问，则不检查 SELinux 策略。\n\n如果用户尝试执行一个他没有访问权限的文件（`rw-`），传统的 Linux DAC 控制将拒绝访问。因此，SELinux\
  \ 策略甚至不会被检查。\n\n尽管传统的 Linux 安全控制措施仍然有效，但使用 SELinux 有许多益处。以下是 SELinux 的几项益处：\n\n\
  *   它实现了 RBAC 访问控制模型。这被认为是最强大的访问控制模型。\n*   对主体使用最小权限访问。这意味着每个主体都获得一组有限的权限，仅足以使其执行其任务所需的运行。实施最小权限后，用户或进程对对象可能造成的意外（或故意）损害受到了限制。\n\
  *   它允许进程沙箱化。这意味着每个进程都在自己的区域（沙箱）中运行。除非授予特殊权限，否则它无法访问其他进程或其文件。这些进程运行的区域被称为“域”。\n\
  *   在实施之前对其功能进行测试。SELinux 有一个允许（Permissive）模式，允许你查看强制 SELinux 对系统产生的影响。在允许模式下，SELinux\
  \ 仍然会记录它认为的安全违规行为（称为 AVC 拒绝），但它不会阻止这些行为。\n\n\n\n\n观察 SELinux 益处的另一种方法是检查当你的 Linux\
  \ 系统未运行 SELinux 时会发生什么。例如，你的 Web 服务器守护进程 (`httpd`) 正在监听某个端口以等待事件发生。来自 Web 浏览器的简单请求进入以查看主页。按照常规流程，`httpd`\
  \ 守护进程接收到请求，并且仅应用了“传统的” Linux 安全机制。由于不受 SELinux 约束，`httpd` 可以执行以下操作：\n\n*   根据关联所有者和组的读/写/执行权限，访问\
  \ `any` 文件或目录。\n*   执行潜在的不安全活动，例如允许文件上传或更改系统限制。\n*   监听它喜欢的任何端口以接收传入请求。\n\n在受 SELinux\
  \ 约束的系统中，`httpd` 守护进程受到了更严格的控制。使用前面的示例，`httpd` 只能监听在 SELinux 允许它监听的端口上。SELinux 防止\
  \ `httpd` 访问任何未设置正确安全上下文的文件，并拒绝 SELinux 中未显式启用的不安全活动。从本质上说，SELinux 严重限制了你 Linux\
  \ 系统上的恶意代码和活动。\n\n## 理解 SELinux 如何工作\n\nSELinux 可以被比作门前的守卫：在这一类比中，主体（用户）想要访问房间内的对象（文件）。为了获得对该对象的访问权限：\n\
  \n1.  主体必须向守卫出 ID 证。\n2.  守卫检查 ID 证和存储在大型手册中的访问规则。\n    *   如果访问规则允许此特定的 ID 证进入内部，主体即可进入房间访问对象。\n\
  \    *   如果访问规则不允许此特定的 ID 证访问对象，则守卫将拒绝进入。\n\nSELinux 提供了基于角色的访问控制 (RBAC) 与 `类型强制\
  \ (Type Enforcement)` 或 `多级安全 (Multi-Level Security MLS)` 的结合。在基于角色的访问控制中，对对象的访问基于主体在组织中被分配的角色。因此，它不是基于主体的用户名或进程\
  \ ID。每个角色都被授予了访问权限。\n\n### 理解类型强制\n\n类型强制 (TE) 是实现 RBAC 模型必不可少的手段。`Type Enforcement`\
  \ 通过以下方法保护系统安全：\n\n*   将对象标记为特定的安全类型\n*   将主体分配到特定的域和角色\n*   提供规则允许某些域和角色访问某些对象类型\n\
  \n接下来的示例使用 `ls -l` 命令显示文件 `my_stuff` 的 DAC 控制。该文件列出了所有者和组，以及其读、写、执行的分配。如果你需要审查文件权限，请参第\
  \ 4 章，“在文件系统中移动”。\n\n``````\n$ ls -l my_stuff\n-rw-rw-r--. 1 johndoe johndoe 0 Feb\
  \ 12 06:57 my_stuff\n```\n\n接下来的示例包含了 `ls -Z` 和同一个文件 `my_stuff`，但不仅仅是 DAC 控制，`-Z`\
  \ 选项还显示了 SELinux 安全 RBAC 控制。\n\n```\n$ ls -Z my_stuff\n-rw-rw-r--. johndoe johndoe\n\
  unconfined_u:object_r:user_home_t:s0 my_stuff\n```\n\n`ls -Z` 示例显示了与文件相关的四个特定于 SELinux\
  \ 的项目：\n\n*   一个用户 `(unconfined_u)`\n*   一个角色 `(object_r)`\n*   一个类型 `(user_home_t)`\n\
  *   一个级别 `(s0)`\n\n这四个 RBAC 项目（用户、角色、类型和级别）被用于 SELinux 访问控制，以确定适当的访问级别。这些项目合称为 SELinux\
  \ `security context`（安全上下文）。安全上下文（ID 证）有时被称为“安全标签”。\n\n这些安全上下文被分配给主体（进程和用户）。每个安全上下文都有特定的名称。名称的赋予取决于它被分配的对象或主体：文件有文件上下文，用户有用户上下文，进程有进程上下文（也称为“域”）。\n\
  \n允许访问的规则被称为“允许规则 (allow rules)”或“策略规则”。`policy rule` 是 SELinux 用于授予或拒绝访问特定系统安全类型的过程。回到\
  \ SELinux 与守卫的类比，SELinux 充当守卫，必须查看主体的安全上下文（ID 证）并审查策略规则（访问规则手册），才能允许或拒绝对对象的访问。因此，类型强制确保了只有某些“类型”的主体可以访问某些“类型”的对象。\n\
  \n### 理解多级安全\n\n在 SELinux 中，默认策略类型称为 `targeted`，它主要控制网络服务（如 Web 服务器和文件服务器）如何访问 Linux\
  \ 系统。`targeted` 策略对合法用户账户在系统上可以执行的操作限制较少。对于更严格的策略，你可以选择多级安全 (MLS)。MLS 使用类型强制以及额外的安全许可\
  \ (security clearances) 功能。它还提供了多分类安全 (Multi-Category Security)，为对象提供了分类级别。\n\n\
  多级安全执行 Bell-LaPadula 强制性访问安全模型。Bell-LaPadula 模型是由美国政府开发的，用于实施信息机密性。该模型的实现是通过根据角色的安全许可和对象的分类级别授予对象访问权限。\n\
  \n`Security clearance`（安全许可）是授予角色的属性，允许访问机密对象。`Classification level`（分类级别）是授予对象的属性，防止具有过低安全许可属性的主体访问。你很可能听过“绝密\
  \ (Top Secret)”这种分类级别。虚构的小说和电影角色詹姆斯·邦德拥有绝密级安全许可，这让他能够访问绝密分类信息。这是 Bell-LaPadula 模型的经典示例。\n\
  \nRBAC 与类型强制 (TE) 或多级安全 (MLS) 的结合，使得 SELinux 能够提供如此强大的安全增强。SELinux 还提供了不同的运行模式 (Operational\
  \ Modes) 供使用。\n\n### 实现 SELinux 安全模型\n\n基于角色的访问控制模型、类型强制、多级安全以及 Bell-LaPadula 模型都是有趣的话题。SELinux\
  \ 通过四个主要的 SELinux 组件的组合来实现这些模型：\n\n*   运行模式\n*   安全上下文\n*   策略类型\n*   策略规则包\n\n\
  虽然我提到了其中一些设计元素，但接下来将让你对它们进行深入的理解。在开始在系统上配置 SELinux 之前，需要具备这些理解。\n\n#### 理解 SELinux\
  \ 运行模式\n\nSELinux 带有三种运行模式：禁用 (Disabled)、许可 (Permissive) 和强制 (Enforcing)。每种模式都为\
  \ Linux 系统安全提供了不同的益处。\n\n##### 使用禁用模式\n\n在禁用模式下，SELinux 是关闭的。取而代之的是默认的访问控制方法——自主访问控制\
  \ (DAC)。这种模式适用于不需要增强安全性的情况。\n\n如果可能，红帽建议将 SELinux 设置为许可模式而非禁用它。然而，有时禁用 SELinux 是合适的。\n\
  \n如果你运行的应用程序工作正常（从你的角度来看），但产生了海量的 SELinux AVC 拒绝信息（即使在许可模式下也是），你可能会导致日志文件填满，使得系统无法使用。更好的方法是为应用程序需要的文件设置正确的安全上下文。但禁用\
  \ SELinux 是更快的解决办法。\n\n然而，在禁用 SELinux 之前，请考虑你以后是否可能想在那个系统上重新启用它。如果你以后决定将其设置为强制或许可模式，当你下次重启系统时，系统将在启动前通过一次自动的\
  \ SELinux 文件重标记。\n\n##### 使用许可模式\n\n\n\n\n\n在宽容模式（Permissive mode）下，SELinux 虽然已开启，但不会执行安全策略规则。当安全策略规则本应拒绝访问时，系统仍然允许访问。然而，系统会向日志文件发送消息，表示该访问本应被拒绝。\n\
  \nSELinux 宽容模式用于以下场景：\n\n* 审计当前的 SELinux 策略规则\n* 测试新应用程序，查看 SELinux 策略规则会对它们产生什么影响\n\
  * 测试新的 SELinux 策略规则，查看新规则对当前服务和应用程序产生什么影响\n* 故障排除，查找为什么特定服务或应用程序在 SELinux 下无法正常工作\n\
  \n\n\n在某些情况下，你可以使用 `audit2allow` 命令读取 SELinux 审计日志并生成新的 SELinux 规则，以选择性地允许被拒绝的操作。这是一种在不禁用\
  \ SELinux 的情况下，让你的应用程序在 Linux 系统上运行的快速方法。\n\n### 使用强制模式（Enforcing mode）\n\n此名已经说明了一切。在强制模式（Enforcing\
  \ mode）下，SELinux 处于开启，且所有安全策略规则都会被执行。\n\n### 理解 SELinux 安全上下文\n\n如前所述，SELinux 安全上下文（security\
  \ context）是用于分类对象（如文件）和主体（如用户和程序）的方法。定义的安全上下文允许 SELinux 对主体访问对象的行为执行策略规则。安全上下文由四个属性组成：`user`、`role`、`type`\
  \ 和 `level`。\n\n* `user`——`user` 属性是 Linux 用户名到 SELinux 名称的映射。这与用户的登录名不同，被专门称为 SELinux\
  \ 用户。SELinux 用户名以 `u` 结尾，以便在输出中更容易识别。在默认的目标型策略（default targeted policy）中，普通无限制用户具有\
  \ `unconfined_u` 用户属性。\n\n* `role`——公司中指定的角色被映射到 SELinux 角色名。然后将 `role` 属性分配给各种主体和对象。根据角色的安全许可级别和对象的分类级别，每个角色都将被授予访问其他主体和对象的权限。具体而言，对于\
  \ SELinux，用户被分配一个角色，而角色针对特定的类型或域被授权。使用角色可以强制如 root 等的账户进入较低权限的位置。SELinux 角色名以“r”结尾。在目标型\
  \ SELinux 系统上，root 用户运行的进程具有 `system_r` 角色，而普通用户在 `unconfined_r` 角色下运行。\n\n* `type`——此属性定义了进程的域类型、用户的类型以及文件的文件类型。此属性也称为“安全类型”（security\
  \ type）。大多数策略规则都涉及进程的安全类型，以及该进程可以访问的哪些文件、端口、设备和其他系统元素（根据它们的安全类型）。SELinux 类型名以 `t`\
  \ 结尾。\n\n* `level`——`level` 是多级安全（MLS）的一个属性，并用于强制执行 Bell-LaPadula 模型。在类型强制（TE）中它是可选的，但如果你正在使用\
  \ MLS，它是强制要求的。\n\nMLS 级别是敏感性（sensitivity）值和类别（category）值的组合，共同构成了安全级别。一个级别写为 `sensitivity\
  \ : category`。\n\n    * `sensitivity`\n        * 代表对象的安全或敏感性级别，例如机密或绝密。\n      \
  \  * 是分级结构，通常 `s0`（未分类）是最低级别。\n        * 如果级别不同，则列为敏感性级别对 `lowlevel-highlevel`。\n\
  \        * 如果没有低、高级别，则列为单一敏感性级别（`s0`）。但在某些情况下，即使没有低、高级别，范围仍会显示（`s0-s0`）。\n\n   \
  \ * `category`\n        * 代表对象的类别，例如无权限、高权限等。\n        * 传统上，这些值介于 `c0` 和 `c255`\
  \ 之间。\n        * 如果级别不同，则列为类别级别对 `lowlevel:highlevel`。\n        * 如果没有低、高级别，则列为单一类别级别\
  \ `level`。\n\n### 用户拥有安全上下文\n\n要查看 SELinux 用户上下文，请在 shell 提示符处输入 `id` 命令。以下是用户 `johndoe`\
  \ 的安全上下文示例：\n\n```\n$ id\nuid=1000(johndoe) gid=1000(johndoe) groups=1000(johndoe)\n\
  \ context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\n```\n\n用户的安全上下文列表显示了如下：\n\
  \n* `user`——Linux 用户 `johndoe` 被映射到 SELinux 用户 `unconfined_u`。\n* `role`——SELinux\
  \ 用户 `unconfined_u` 被映射到角色 `unconfined_r`。\n* `type`——该用户被赋予了 `unconfined_t` 类型。\n\
  * `level`——\n    * `sensitivity`——该用户只有一个敏感性级别，即最低级别 `s0`。\n    * `categories`——该用户具有访问\
  \ `c0.c1023` 的权限，即所有类别（从 `c0` 到 `c1023`）。\n\n### 文件拥有安全上下文\n\n文件也有安全上下文。要查看单个文件的上下文，请使用\
  \ `ls` 命令的 `-Z` 选项。以下是文件 `my_stuff` 的上下文：\n\n```\n$ ls -Z my_stuff\n-rw-rw-r--.\
  \ johndoe johndoe\n unconfined_u:object_r:user_home_t:s0 my_stuff\n```\n\n文件上下文列表显示了如下：\n\
  \n* `user`——文件被映射到 SELinux 用户 `unconfined_u`。\n* `role`——文件被映射到角色 `object_r`。\n\
  * `type`——该文件被认为是 `user_home_t` 域的一部分。\n* `level`——\n    * `sensitivity`——敏感性级别为\
  \ `s0`。\n\n\n\n\n\n### 目标策略 (Targeted policy)\n\n目标策略的主要目的是限制“目标”守护进程（daemon）。然而，它也可以限制其他进程和用户。目标守护进程是沙箱化的。`sandbox`\
  \ 是一个程序可以运行的环境，但它们对其他对象的访问受到严格控制。\n\n运行在此类环境中的进程被称为“沙箱化”的。因此，目标守护进程受到限制，使得通过它发起的任何恶意攻击都不会影响其他服务或整个\
  \ Linux 系统。目标策略让您共享打印服务器、文件服务器、Web 服务器或其他服务变得更加安全，同时限制了访问这些服务对您系统上其他资产可能构成的风险。\n\
  \n所有未被目标化的的主体和对象都运行在 `unconfined_t` 域中。`unconfined_t` 域没有 SELinux 策略限制，因此仅使用“传统的”Linux\
  \ 安全机制。\n\nSELinux 默认带有目标策略集作为默认。因此，在默认情况下，SELinux 仅针对少数几个守护进程。\n\n### MLS（多级安全）策略\n\
  \nMLS 策略的主要目的是执行 Bell-LaPadula 模型。它根据角色的 `security clearance`（安全许可）和对象的 `classification\
  \ level`（分类级别）授予对其他主体和对象的访问权限。\n\n在 MLS 策略中，安全上下文的 MLS 属性至关重要。否则，策略规则将不知道如何执行访问限制。\n\
  \n### 最小策略 (Minimum policy)\n\n该策略顾如其名——极简。它最初是为低内存机器或设备（如智能手机）创建。\n\n最小策略本质上与目标策略相同，但仅使用基础策略规则包。这种“精简”策略可以用于测试\
  \ SELinux 对单个指定守护进程的影响。对于低内存设备，最小策略允许 SELinux 在不消耗大量资源的情况下运行。\n\n#### 了解 SELinux\
  \ 策略规则包\n\n`Policy rules`（策略规则），也称为 `allow rules`（允许规则），是 SELinux 用于确定主体是否具有对象访问权限的规则。策略随\
  \ SELinux 一起安装，并被分组为包，也称为 `modules`（模块）。每个特定的策略包文件以 `*.pp` 结尾。\n\n`/etc/selinux/policy_type/modules/active/modules`\
  \ 目录包含许多策略包 (`*.pp`) 文件。接下来的示例显示了实现目标策略的 Linux 系统的策略规则包：\n\n```\n# ls /etc/selinux/targeted/modules/active/modules/*.pp\n\
  /etc/selinux/targeted/modules/active/modules/abrt.pp\n/etc/selinux/targeted/modules/active/modules/accountsd.pp\n\
  /etc/selinux/targeted/modules/active/modules/acct.pp\n/etc/selinux/targeted/modules/active/modules/ada.pp\n\
  /etc/selinux/targeted/modules/active/modules/afs.pp\n...\n/etc/selinux/targeted/modules/active/modules/xserver.pp\n\
  /etc/selinux/targeted/modules/active/modules/zabbix.pp\n/etc/selinux/targeted/modules/active/modules/zarafa.pp\n\
  /etc/selinux/targeted/modules/active/modules/zebra.pp\n/etc/selinux/targeted/modules/active/modules/zosremote.pp\n\
  ```\n\n在您的 Linux 系统上，有以 HTML 文件形式提供的关于这些策略模块的用户文档。要在 Fedora 或 RHEL 上查看此文档，请打开系统浏览器并输入以下\
  \ URL：[`file:///usr/share/doc/selinux-policy-selinuxversion#/html/index.html`](http://file:///usr/share/doc/selinux-policy-selinuxversion#/html/index.html)。对于\
  \ Ubuntu，URL 为 [`file:///usr/share/doc/selinux-policy-doc/html/index.html`](http://file:///usr/share/doc/selinux-policy-doc/html/index.html)。如果您的系统上没有策略文档，您可以在\
  \ Fedora 或 RHEL 系统上通过命令行输入 `yum install selinux-policy-doc` 来进行安装。在 Ubuntu 上，在命令行输入\
  \ `sudo apt-get install selinux-policy-doc`。\n\n您可以查阅此策略文档，以了解策略规则是如何创建和打包的。\n\n\
  策略规则包同 SELinux 运行模式、策略类型以及各种安全上下文共同工作，通过 SELinux 保护您的 Linux 系统。下一节将介绍如何开始配置 SELinux\
  \ 以满足您特定组织的安全需求。\n\n### 配置 SELinux\n\nSELinux 是预先配置好的。您无需任何配置工作即可使用 SELinux 功能。然而，预设设置很少能满足您\
  \ Linux 系统的所有安全需求。\n\nSELinux 配置只能由 root 用户设置和修改。配置和策略文件位于 `/etc/selinux` 目录。主配置文件是\
  \ `/etc/selinux/config`，其内容如下：\n\n```\n# cat /etc/selinux/config\n# 此文件控制系统上 SELinux\
  \ 的状态。\n# SELINUX= 可以取以下三个值之一：\n#      enforcing - 强制执行 SELinux 安全策略。\n#      permissive\
  \ - SELinux 打印警告而非强制执行。\n#      disabled - 完全禁用 SELinux。\nSELINUX=enforcing\n# SELINUXTYPE=\
  \ 使用中策略的类型。可能的值有：\n#      targeted - 仅保护目标网络守护进程。\n#      strict - 全的 SELinux 保护。\n\
  SELINUXTYPE=targeted\n```\n\n此 SELinux 主配置文件允许您设置模式和策略类型。\n\n#### 设置 SELinux 模式\n\
  \n要查看系统上 SELinux 的当前模式，请使用 `getenforce` 命令。要同时查看当前模式和配置文件中设置的模式，请使用 `sestatus` 命令。两个命令均在代码所示：\n\
  \n```\n# getenforce\nEnforcing\n# sestatus\nSELinux status:                 enabled\n\
  SELinuxfs mount:                /sys/fs/selinux\nSELinux root directory:       \
  \  /etc/selinux\nLoaded policy name:             targeted\nCurrent mode:       \
  \            enforcing\nMode from config file:          enforcing\nPolicy MLS status:\
  \              enabled\nPolicy deny_unknown status:     allowed\nMax kernel policy\
  \ version:      28\n```\n\n要更改模式设置，可以使用 `setenforce newsetting`，其中 `newsetting`\
  \ 为：\n\n*   `enforcing` 或 `1`\n*   `permissive` 或 `0`\n\n注意，您不能使用 `setenforce` 命令将\
  \ SELinux 改为 `disabled`。\n\n下面的示例显示了通过 `setenforce` 命令将 SELinux 模式立即切换到 `permissive`\
  \ 模式。`sestatus` 命令显示当前的运行模式和配置文件中的模式（未修改）。系统重启时，它将从配置文件确定运行模式。因此，示例中设置的 `permissive`\
  \ 模式是临时的。\n\n```\n# setenforce 0\n# getenforce\nPermissive\n# sestatus\nSELinux\
  \ status:                 enabled\nSELinuxfs mount:                /sys/fs/selinux\n\
  Loaded policy name:             targeted\nCurrent mode:                   permissive\n\
  Mode from config file:          enforcing\n```\n\n要禁用 SELinux，您必须编辑 SELinux 配置文件。重启系统始终会将模式改回该文件中设置的值。更改\
  \ SELinux 模式的首选方法是修改配置文件然后重启系统。\n\n从 `disabled` 切换到 `enforcing` 或 `permissive` 模式时，SELinux\
  \ 会在重启后自动对文件系统进行重新标记。这意味着 SELinux 会检查并更改任何具有错误安全上下文（例如，标记错误的文件）的文件，防止可能引起新模式的问题。此外，任何未标记的文件都会被赋予上下文。此重新标记过程可能需要很长时间，因为每个文件的上下文都会被检查。以下是系统在重启后进行重新标记过程时接收的消息：\n\
  \n```\n*** Warning -- SELinux targeted policy relabel is required.\n*** Relabeling\
  \ could take a very long time, depending on file\n*** system size and speed of hard\
  \ drives.\n```\n\n\n\n\n要修改 `/etc/selinux/config` 文件中的模式，请将 `SELINUX=` 行更改为以下内容之一：\n\
  \n* `disabled`\n* `enforcing`\n* `permissive`\n\n接下来的 SELinux 配置文件示例显示模式已设置为 `permissive`。现在，当系统发生重启时，模式会发生变化。\n\
  \n```\n# cat /etc/selinux/config\n# 此文件控制系统上 SELinux 的状态。\n# SELINUX= 可以取以下三个值之一：\n\
  #      enforcing - 强制执行 SELinux 安全策略。\n#      permissive - SELinux 打印警告而非强制执行。\n\
  #      disabled - 完全禁用 SELinux。\nSELINUX=permissive\n...\n```\n\n主要的 SELinux 配置文件不仅包含模式设置。它还指定了将执行的策略类型（policy\
  \ type）。\n\n### 设置 SELinux 策略类型\n\n你选择的策略类型决定了 SELinux 是执行 TE、MLS 还是基础包。该类型设置直接决定了用于规定对象可以访问内容的策略规则集。\n\
  \n默认情况下，策略类型设置为 `targeted`。要更改默认策略类型，请编辑 `/etc/selinux/config` 文件。将 `SELINUXTYPE=`\
  \ 行更改为以下内容之一：\n\n* `targeted`\n* `mls`\n* `minimum`\n\n如果你将 SELinux 类型设置为 `mls`\
  \ 或 `minimum`，则需要确保已安装了相应的策略包。通过输入以下命令检查：`yum list selinux-policy-mls` 或 `yum list\
  \ selinux-policy-minimum`。\n\n接下来的 SELinux 配置文件示例显示类型已设置为 `mls`。现在，当系统发生重启时，策略类型会发生变化。\n\
  \n```\n# cat /etc/selinux/config\n# 此文件控制系统上 SELinux 的状态。\n...\n# SELINUXTYPE= 使用使用的策略类型。可能的值：\n\
  #      targeted - 仅保护目标网络守护进程。\n#      strict - 完整的 SELinux 保护。\nSELINUXTYPE=mls\n\
  ```\n\n### 管理 SELinux 安全上下文\n\nSELinux 安全上下文允许 SELinux 对访问对象的主体强制执行策略规则。你的 Linux\
  \ 系统已分配了安全上下文。\n\n要查看当前的 SELinux 文件和进程安全上下文，请使用 `secon` 命令。表 24.1 列出了 `secon` 命令可用的选项。\n\
  \n| 选项 | 说明 |\n| :--- | :--- |\n| `-u` | 使用此选项显示安全上下文的用户。 |\n| `-r` | 使用此选项显示安全上下文的角色。\
  \ |\n| `-t` | 使用此选项显示安全上下文的类型。 |\n| `-s` | 使用此选项显示安全上下文的敏感性级别。 |\n| `-c` | 使用此选项显示安全上下文的许可级别。\
  \ |\n| `-m` | 使用此选项以 MLS 范围显示安全上下文的敏感性和许可级别。 |\n\n表 24.1 secon 命令选项\n\n如果你在不带参数的情况下使用\
  \ `secon` 命令，它将显示当前进程的安全上下文。要查看另一个进程的安全上下文，请使用 `-p` 选项。接下来的示例展示了如何使用 `secon` 查看当前以及\
  \ `systemd` 进程的安全上下文。\n\n```\n# secon -urt\nuser: unconfined_u\nrole: unconfined_r\n\
  type: unconfined_t\n# secon -urt -p 1\nuser: system_u\nrole: system_r\ntype: init_t\n\
  ```\n\n要查看文件的安全上下文，你可以使用 `-f` 选项，如下：\n\n```\n# secon -urt -f /etc/passwd\nuser:\
  \ system_u\nrole: object_r\ntype: etc_t\n```\n\n用户的安全上下文不是通过 `secon` 命令查看的。要查看用户的安全上下文，必须使用\
  \ `id` 命令。要查看除你自己之外的用户安全上下文，命令语法为 `id -Z username`。\n\n#### 管理用户安全上下文\n\n记住，每个系统用户登录\
  \ ID 都映射到特定的 SELinux 用户 ID。要在你的系统上查看映射列表，请输入 `semanage login -l` 命令。接下来的代码显示了 `semanage`\
  \ 命令及其输出。如果用户登录 ID 未列出，则它将使用“默认”登录映射，即 `_default_` 的登录名称（Login Name）。注意，还显示了与每个\
  \ SELinux 用户关联的 MLS/MCS 设置。\n\n```\n# semanage login -l\nLogin Name           SELinux\
  \ User         MLS/MCS Range     Service\n__default__          unconfined_u    \
  \     s0-s0:c0.c1023    *\nroot                 unconfined_u         s0-s0:c0.c1023\
  \    *\nsystem_u             system_u             s0-s0:c0.c1023    *\n```\n\n要显示当前\
  \ SELinux 用户，`semanage login -l` 命令显示如下：\n\n```\n# semanage login -l\nLogin Name\
  \           SELinux User         MLS/MCS Range     Service\n__default__        \
  \  unconfined_u         s0-s0:c0.c1023    *\nroot                 unconfined_u \
  \        s0-s0:c0.c1023    *\nsystem_u             system_u             s0-s0:c0.c1023\
  \    *\n```\n（注：原文中关于显示 SELinux 用户的部分存在多次重复，此处在保留核心内容的基础上进行了去冗处理。）\n\n\n\n\n进程如何获取安全上下文取决于启动它的进程。请记住\
  \ `systemd`（以前为 `init`）是所有进程的“母进程”（参见第 15 章）。因此，许多守护进程和进程是由 `systemd` 启动的。`systemd`\
  \ 启动的进程会被赋予新的安全上下文。例如，当 `systemd` 启动 `apache` 守护进程时，它会被分配类型（即域）`httpd_t`。分配的上下文由专门为该守护进程编写\
  \ SELinux 策略处理。如果进程不存在策略，则分配默认类型 `unconfined_t`。\n\n对于用户（父进程）运行的程序或应用程序，新进程（子进程）继承用户的安全上下文。当然，这只有在用户允许运行该程序时才会发生。进程也可以运行程序。在这种情况下，子进程也会继承其父进程的安全上下文。因此，子进程在相同的域中运行。\n\
  \n所以，进程的安全上下文在程序运行之前设置，并取决于是谁启动了它。你可以可以使用命令来更改运行程序的安全上下文：\n\n*   `runcon`——使用选项运行程序，以确定用户、角色和类型（即域）。\n\
  *   `sandbox`——在受严格控制的域（即沙箱）中运行程序。\n\n使用 `runcon` 可能会导致许多问题，因此请谨慎慎用。然而，`sandbox`\
  \ 提供了大量的保护。它允许在 Linux 系统上测试新程序时具有灵活性。\n\n### 管理 SELinux 策略规则包\n\n策略规则是 SELinux 用于判断主体是否具有访问对象的权限规则。它们被分组为包（也称为模块），并与\
  \ SELinux 一起安装。查看系统上模块的简单方法是使用 `semodule -l` 命令。它列出了所有策略模块及其当前的版本号。这里显示了 `semodule\
  \ -l` 命令的一个示例：\n\n```\n# semodule -l\nabrt          1.2.0\naccountsd     1.0.6\n\
  acct          1.5.1\n...\nxserver       3.8.4\nzabbix        1.5.3\nzarafa     \
  \   1.1.0\nzebra         1.12.0\nzoneminder    1.1.1\nzosremote     1.1.1\n```\n\
  \n若干工具可以帮助你管理甚至创建你自己的策略模块。表 24.3 显示了 Fedora 系统上可用的各种策略规则包工具。\n\n| 策略工具 | 描述 |\n\
  | :--- | :--- |\n| `audit2allow` | 从被拒绝的操作日志中生成策略 `allow`/`dontaudit`规则 |\n| `audit2why`\
  \ | 从被拒绝的操作日志中生成为何访问被拒绝的描述 |\n| `checkmodule` | 编译策略模块 |\n| `checkpolicy` | 编译 SELinux\
  \ 策略 |\n| `load_policy` | 将新策略加载到内核 |\n| `semodule` | 管理策略模块 |\n| `semodule_deps`\
  \ | 列出策略包之间的依赖关系 |\n| `semodule_expand` | 扩展策略模块包 |\n| `semodule_link` | 将策略模块包链接在一起\
  \ |\n| `semodule_package` | 创建策略模块包 |\n\n表 24.3 SELinux 策略包工具\n\n以下是一个通常用创建本地策略规则框架的策略示例。示例策略相当长，因此只显示了部分内容。\n\
  \n```\n# cat /usr/share/selinux/devel/example.te\npolicy_module(myapp,1.0.0)\n########################################\n\
  #\n# 声明\n#\ntype myapp_t;\ntype myapp_exec_t;\ndomain_type(myapp_t)\ndomain_entry_file(myapp_t,\
  \ myapp_exec_t)\ntype myapp_log_t;\nlogging_log_file(myapp_log_t)\ntype myapp_tmp_t;\n\
  files_tmp_file(myapp_tmp_t)\n...\nallow myapp_t myapp_tmp_t:file manage_file_perms;\n\
  files_tmp_filetrans(myapp_t,myapp_tmp_t,file)\n```\n\n上述示例代码显示策略代码中使用了特殊的语法。要创建和修改策略规则，你需要学习这种策略规则语言语法，学习如何使用\
  \ SELinux 策略编译器，并学习如何将策略规则文件链接起来形成模块；你可能需要上几节全天的课程。此时，你可能会想放弃 SELinux。然而，使用布尔值（Booleans）修改策略要简单得多。\n\
  \n### 通过布尔值管理 SELinux\n\nSELinux 策略规则编写和模块创建是一项相当复杂且耗时的活动。创建错误的策略规则可能会损害你 Linux\
  \ 系统的安全性。坦率地说，SELinux 提供了布尔值。\n\n布尔值是一个用于开启或关闭设置的切换开关。布尔开关允许你在不了解策略编写知识的情况下，更改 SELinux\
  \ 策略规则的一部分。这些策略更改也可以无需重启系统即可完成！\n\n要查看所有布尔值的列表，使用 `getbool -a` 命令。以下是 `getbool -a`\
  \ 命令的示例：\n\n```\n# getbool -a\nabrt          off\naccountsd     off\nacct      \
  \    off\n...\nxserver       off\nzabbix        off\nzarafa        off\nzebra  \
  \       off\nzoneminder    off\nzosremote     off\n```\n\n要更改特定的布尔值，使用 `setbool`\
  \ 命令。例如，要开启 `httpd_can_network`，使用：\n\n```bash\n# setbool httpd_can_network on\n\
  ```\n\n如果你需要更改在重启后仍然有效，使用 `-P` 选项：\n\n```bash\n# setbool -P httpd_can_network on\n\
  ```\n\n要切换布尔值状态，使用 `togglebool` 命令：\n\n```bash\n# togglebool httpd_can_network\n\
  ```\n\n要使切换永久，使用 `-P` 选项：\n\n```bash\n# togglebool -P httpd_can_network\n```\n\n\
  ### 监控和排排除 SELinux\n\nSELinux 是另一个监控你系统的工具。它记录所有访问拒绝情况，这可以帮助你判断是否正在尝试攻击。这些 SELinux\
  \ 日志文件对于排排除 SELinux 问题同样有用。\n\n#### 理解 SELinux 日志\n\nSELinux 在审查特定安全上下文的策略规则时使用一个名为访问向量缓存（AVC）的缓存。当访问被拒绝（称为\
  \ AVC 拒绝）时，拒绝消息会被放入日志。\n\n这些记录的拒绝消息可以帮助你诊断和解决常规的 SELinux 策略违规。这些拒绝消息记录的位置取决于 `auditd`\
  \ 和 `rsyslogd` 守护进程的状态：\n\n*   如果 `auditd` 守护进程正在运行，拒绝消息记录到 `/var/log/audit/audit.log`。\n\
  \n\n\n\n\n- 如果 `auditd` 未在运行，但 `rsyslogd` 守护进程正在运行，则拒绝信息将记录在 `/var/log/messages`\
  \ 中。\n\n### 在审计日志中查看 SELinux 消息\n\n如果你已经运行了 `auditd` 守护进程，你可以使用 `aureport` 命令快速查看是否记录了任何\
  \ AVC 拒绝信息。下面的示例展示了如何使用 `aureport` 和 `grep` 搜索 AVC 拒绝信息。至少有一个拒绝信息已记录在 `/var/log/audit/audit.log`\
  \ 中：\n\n```\n# aureport | grep AVC\nNumber of AVC's: 1\n```\n\n在发现 `audit.log` 中记录了\
  \ AVC 拒绝信息后，你可以使用 `ausearch` 来审查拒绝信息。下面的示例展示了如何使用 `ausearch` 命令查看已记录的 AVC 拒绝信息。\n\
  \n```\n# ausearch -m avc\ntype=AVC msg=audit(1411184014.986:69860): avc: denied\
  \ { create } for\n  pid=21875 comm=\"vsftpd\" name=\"services\"\n  scontext=system_u:system_r:ftpd_t:s0-s0:c0.c1023\n\
  \  tcontext=system_u:object_r:user_home_t:s0 tclass=file\n```\n\n显示内容提供了谁尝试访问的信息，以及其在尝试访问时的安全上下文。在\
  \ AVC 拒绝消息中查找以下这些关键词：\n\n- `type=AVC`\n- `avc: denied`\n- `pid=`\n- `exe=`\n- `subj=`\n\
  \n这可以为你提供足够的数据来开始修复问题或追踪恶意活动。\n\n### 在 messages 日志中查看 SELinux 消息\n\n如果你运行了 `rsyslogd`，你可以通过\
  \ `grep` 搜索 `/var/log/messages` 文件来查找 AVC 拒绝消息。对于 RHEL 7、Fedora 21 或任何使用 `systemd`\
  \ 的 Linux 发行版，你可以运行 `journalctl` 命令来检查 AVC 拒绝日志消息。每条日志消息都包含一个 `sealert` 命令行，你可以运行该命令来获取有关每个\
  \ AVC 拒绝的信息。例如：\n\n```\n# journalctl | grep sealert\nSep 18 23:58:03 fedora20.example.com\
  \ setroubleshoot[13449]:\n  SELinux is preventing /usr/sbin/vsftpd from getattr\
  \ access on the\n  directory /home/chris/Music. For complete SELinux messages.\n\
  \  run sealert -l 8f52dd56-8025-4208-af41-7d296bdaa46b\n```\n\n从示例中，你可以看到一个 Linux\
  \ 用户尝试以特定用户登录 FTP 服务 (`vsftpd`)。由于 FTP 使用明文密码，该操作被认为是不安全的，因此被 SELinux 拒绝了。请注意，AVC\
  \ 拒绝消息告诉你可以运行 `sealert -l` 命令来获取更多信息。\n\n`sealert` 工具程序允许你获取有关某个特定 AVC 拒绝消息的更多信息。`sealert`\
  \ 提供的信息格式可以帮助你诊断问题。下面的示例展示了 `sealert` 针对上一个示例中 AVC 拒绝信息提供的信息。注意，使用的命令与上一个日志文件中建议的命令完全相同。`sealert`\
  \ 命令中使用的长数字是 AVC 拒绝消息的 ID 数字。\n\n```\n# sealert -l 8f52dd56-8025-4208-af41-7d296bdaa46b\n\
  SELinux is preventing /usr/sbin/vsftpd from getattr access\n   on the directory\
  \ /home/chris/Music.\n*****  Plugin catch\n```\n\n\n\n你使用了 `cp` 命令将文件从 `/etc` 临时移动到\
  \ `/tmp` 目录。然后，你使用 `mv` 命令将其移回。现在，该文件具有临时目录的安全上下文，而不是其原始的安全上下文，当使用该文件的服务尝试启动时，你的系统就会收到\
  \ AVC 拒绝消息。\n\n得益于 `restorecon -R` 命令，修复这个问题非常简单。只需输入 `restorecon -R file`，文件就会恢复其原始的安全上下文。\n\
  \n### 布尔值设置错误\n\n另一个常见问题是错误设置了布尔值（Boolean）。这会导致你遇到多个 AVC 拒绝。\n\n例如，如果你的系统脚本无法连接到网络，并且你在日志中看到了\
  \ AVC 拒绝，你需要检查 `httpd` 的布尔值。使用 `getsebool -a` 命令并将其管道到 `grep` 中搜索任何影响 `httpd` 的布尔值。示例展示了这些命令用法：\n\
  \n```\n# getsebool -a | grep http\n...\nhttpd_can_network_connect --> off\n...\n\
  ```\n\n`getsebool` 命令显示布尔值 `httpd_can_network_connect` 被设置为 off。要更改此布尔值，请使用以下命令：`setsebool\
  \ -P httpd_can_network_connect on`。注意使用了 `-P` 选项使设置永久生效。现在，你的脚本应该能够连接网络了。\n\n随着你遇到\
  \ SELinux 的各种问题，你的故障排除技巧将不断提高。同时，这里有另一个帮助你排除故障的优秀资源：[`http://docs.redhat.com`](http://docs.redhat.com)。红帽文档“Red\
  \ Hat Enterprise Linux”有一个整个章节（第 8 章）专门用于 SELinux 的故障排除。\n\n## 综合运用\n\n\n\n显然，SELinux\
  \ 是一个相当复杂且丰富的工具。你现在对 SELinux 的基础知识有了良好且结实的掌握。在你开始在系统中实现 SELinux 时，这里是一些建议。\n\n你可以使用默认的\
  \ `targeted` SELinux 模式来保护大多数基础网络服务（`httpd`、`vsftpd`、Samba 等），而无需分配特殊的用户角色或以此锁定你的系统。在这种情况下，你需要做的主要工作是将文件放在标准位置（或运行命令为非标准位置分配正确的文件上下文），确保对你本来想要使用的安全性较低的功能开启布尔值，并监控\
  \ AVC 拒绝情况以发现问题。\n\n*   从 **permissive**（宽容）运行模式开始。这允许 SELinux 认为不安全的请求执行成功。\n*\
  \   在 Permissive 模式下运行你的当前系统一段时间。检查日志并查看默认 SELinux 设置可能会出现哪些问题。然后你可以更改布尔值或文件上下文，以便允许被不当拒绝的功能通过。解决问题后，开启\
  \ `enforcing`（强制）模式。\n*   总的来说，请在测试环境或使用 Permissive 模式，一次实施一项 SELinux 配置更改。在移动到下一个更改之前，查看每项配置更改产生了什么种影响。然后你可以使用\
  \ `audit2allow` 命令选择性地允许导致 AVC 拒绝的操作添加到服务的允许列表策略中。\n\n## 获取更多关于 SELinux 的信息\n\n\
  以下几个额外信息源可以帮助你在 Linux 系统上使用 SELinux：\n\n*   **你的系统 `man` 页面**——执行命令 `man -k selinux`\
  \ 来找到你可以审查的针对系统中已安装 SELinux 实用程序的各种 `man` 页面。如果你正在为常用服务（如 `httpd`、`vsftpd`、Samba\
  \ 等）调试 SELinux 问题，可能有一个专门关于如何修复该服务 SELinux 问题的 `man` 页面。\n*   **Red Hat Enterprise\
  \ Linux 手册**——位于[`http://docs.redhat.com`](http://docs.redhat.com)，该网站包含整本关于 SELinux\
  \ 的手册。\n*   **Fedora Project SELinux 指南**——位于[`http://docs.fedoraproject.org`](http://docs.fedoraproject.org)，该网站有一个安全增强\
  \ Linux 指南。然而，该指南并未针对每个 Fedora 版本更新，因此你可能需要查看旧版本来查找它。此外，SELinux 指南并不位于安全手册中，但安全手册也是非常值得审查的手册。\n\
  *   **Ubuntu  SELinux**——由于 RHEL/Fedora 和 Ubuntu 上的 SELinux 存在差异，[`https://wiki.ubuntu.com/SELinux`](https://wiki.ubuntu.com/SELinux)\
  \ 网站为你提供了所需的额外帮助。\n*   **SELinux Project Wiki**——这是官方 SELinux 项目页面。位于[`http://selinuxproject.org`](http://selinuxproject.org)\
  \ 的该网站提供了多种资源。\n*   **SELinux News**——顾如其名，[`http://selinuxnews.org`](http://selinuxnews.org)\
  \ 有关于 SELinux 的最新新闻。\n\n## 总结\n\nSELinux 为 Linux 提供了安全增强，并在许多 Linux 发行版中都是默认安装的。在本章中，你学习了\
  \ SELinux 的益处、它的工作原理、如何设置它、如何修复各种 SELinux 问题，以及如何获取更多关于这一重要安全增强的更多信息。\n\nSELinux\
  \ 初看之下相当复杂。然而，在将其拆解为各个组成部分——运行模式、安全上下文、策略类型和策略包之后，你就可以看到各个部分是如何协同工作的。每个组件对于执行和测试你机构选定的安全需求都起着重要作用。\n\
  \n你已经学习了配置 SELinux 的各种步骤。尽管 SELinux 是预先配置好的，但你可能需要进行一些修改以满足你机构的安全需求。每个组件都有自己的配置步骤和供选择的设置。虽然没有涵盖策略规则创建，但你学习了如何通过布尔值修改提供的策略。\n\
  \nSELinux 提供了另一个监控你 Linux 系统安全的工具。因为 SELinux 会记录所有的访问拒绝，它可以帮助你判断是否发生了或正在尝试攻击。即使是完美的计划也可能出问题。因此，在本章中，你学习了如何修复常见的\
  \ SELinux 配置问题。\n\n在下一章，你将学习如何在网络上保护你的 Linux 系统。你将学习控制访问、管理防火墙和保护远程访问。\n\n## 练习\n\
  \n使用这些练习来测试你对使用 SELinux 的知识。这些任务假设你正在运行 Fedora 或 Red Hat Enterprise Linux 系统（尽管某些任务也适用于其他\
  \ Linux 系统）。如果你卡住了，任务的解决方案位于附录 B（尽管在 Linux 中，通常有多种方法可以完成任务）。\n\n1.  在不更改 SELinux\
  \ 主配置文件的情况下，写下将你的系统设置为 SELinux Permissive 运行模式的命令。\n2.  在不更改 SELinux 主配置文件的情况下，写下将你的系统设置为\
  \ SELinux Enforcing 模式的命令。\n3.  你的系统上设置了哪些当前和永久的 SELinux 策略类型？你是如何找到它们的？\n4.  列出\
  \ `/etc/hosts` 文件的安全上下文，并识别其不同的安全上下文属性。\n5.  在主目录下创建一个名为 `test.html` 的文件，将其类型分配为\
  \ `httpd_sys_content_t`。（这是你可能执行的操作，以便让 Web 服务器共享 `/var/www/html` 之外的内容。）\n6.  列出运行中的\
  \ `crond` 进程的安全上下文，并识别其安全上下文属性。\n7.  创建一个 `/etc/test.txt` 文件，将其文件上下文更改为 `user_tmp_t`，恢复其正确的上下文（`/etc`\
  \ 目录的默认上下文），然后删除该文件。使用 `ls -Z /etc/test.txt` 命令在过程的每个点检查文件。\n\n\n\n\n8. 你在私有网络上有一个\
  \ FTP 服务器，并且你想允许用户使用其普通用户账户登录该服务器（此时 SELinux 处于强制模式）。确定哪个 Boolean 值允许用户通过 FTP 访问其主目录，并开启该\
  \ Boolean 值。\n\n9. 使用什么命令可以列出系统上所有的 SELinux 策略模块及其版本号？\n\n10. 准备你的系统以运行受 SELinux\
  \ 保护的 `vsftpd` FTP 服务器（我在 Fedora 系统上是做的）。然后以普通用户身份登录，并尝试如下复制文件（这应该会导致 AVC 拒绝）：\n\
  \n```bash\n# getenforce\nEnforcing\n# yum install vsftpd lftp rsyslog setroubleshoot-server\n\
  # systemctl start syslog\n# systemctl start vsftpd\n# semodule -DB\n# getsebool\
  \ ftp_home_dir\nftp_home_dir --> off\n# lftp -u chris localhost\nPassword: ********\n\
  lftp chris@localhost:~> put /etc/services\nput: Access failed: 553 Could not create\
  \ file. (services)\nlftp chris@localhost:~> quit\n```\n\n你的任务是从系统日志消息中列出 AVC 拒绝信息。查看有关该拒绝的信息，并按照\
  \ AVC 拒绝描述的建议更改 Boolean 值以允许 FTP 访问。\n\n## 第 25 章：网络上的 Linux 安全\n\n在网络（尤其是公共网络）上设置你的\
  \ Linux 系统在安全方面会带来全新的挑战。保护你的 Linux 系统的最好方法是让它脱离所有网络。然而，这通常不是一个可行的方案。\n\n整本书都满了关于如何保护网络上计算机系统的信息。许多组织聘佣全职计算机安全管理员来监控其网络连接的\
  \ Linux 系统。因此，请将本章视为对网络 Linux 安全的简要介绍。\n\n## 审核网络服务\n\n大多数用于大型企业的 Linux 系统都被配置为服务器，正如其名，它们通过网络向远程客户端提供服务。`network\
  \ service` 是计算机执行的任何需要使用一组预定义的规则在网络上发送和接收信息的任务。路由电子邮件是一种网络服务，提供网页也是如此。\n\nLinux\
  \ 服务器有提供数千种服务的潜力。其中许多列在 `/etc/services` 文件中。考虑 `/etc/services` 文件的以下部分：\n\n```bash\n\
  $ cat /etc/services\n# /etc/services:\n# $Id: services,v 1.55 2013/04/14 ovasik\
  \ Exp $\n#\n# Network services, Internet style\n# IANA services version: last updated\
  \ 2013-04-10\n#\n# Note that it is presently the policy of IANA to assign ...\n\
  # 每行描述一个服务，格式如下：\n#\n# service-name  port/protocol  [aliases ...]   [# comment]\n\
  ...\necho            7/tcp\necho            7/udp\ndiscard         9/tcp       \
  \    sink null\ndiscard         9/udp           sink null\nsystat          11/tcp\
  \          users\nsystat          11/udp          users\ndaytime         13/tcp\n\
  daytime         13/udp\nqotd            17/tcp          quote\nqotd            17/udp\
  \          quote\n...\nchargen         19/tcp          ttytst source\nchargen  \
  \       19/udp          ttytst source\nftp-data        20/tcp\nftp-data        20/udp\n\
  # 21 is registered to ftp, but also used by fsp\nftp             21/tcp\n...\nhttp\
  \            80/tcp      www www-http    # WorldWideWeb HTTP\nhttp            80/udp\
  \      www www-http    # HyperText Transfer Protocol\nhttp            80/sctp  \
  \                   # HyperText Transfer Protocol\nkerberos        88/tcp      kerberos5\
  \ krb5  # Kerberos v5\nkerberos        88/udp      kerberos5 krb5  # Kerberos v5\n\
  ...\nblp5            48129/udp           # Bloomberg locator\ncom-bardac-dw   48556/tcp\
  \           # com-bardac-dw\ncom-bardac-dw   48556/udp           # com-bardac-dw\n\
  iqobject        48619/tcp               # iqobject\niqobject        48619/udp  \
  \             # iqobject\n```\n\n在注释行之后，注意有三列信息。左列包含每个服务的名称。中间列定义了该服务使用的端口号和协议类型。右列包含该服务的可选别名或别名列表。\n\
  \n许多 Linux 发行版带有许多运行的不需要的网络服务。不必要的服务会让你的 Linux 系统暴露在恶意攻击之下。例如，如果你的 Linux 服务器是打印服务器，那么它应该只提供打印服务。它不应该同时提供\
  \ Apache Web 服务。这只会不必要地让你的打印服务器暴露在任何利用 Web 服务漏洞的恶意攻击中。\n\n### 使用 nmap 评估网络服务的访问\n\
  \n`nmap` 安全扫描器是一个帮助你从网络角度审查网络服务的极工具。`nmap` 工具在大多数 Linux 发行版存储库中可用，并在 [`http://nmap.org`](http://nmap.org)\
  \ 上有一个包含丰富信息的网页。\n\n在 Fedora 或 RHEL 发行版上安装 `nmap`，按照下面的示例使用 `yum` 命令（使用 root 权限）。\n\
  \n```bash\n# yum install nmap -y\nLoaded plugins: langpacks, product-id, subscription-manager\n\
  ...\nResolving Dependencies\n--> Running transaction check\n---> Package nmap.x86_64\
  \ 2:6.40-4.el7 will be installed\n--> Finished Dependency Resolution\nDependencies\
  \ Resolved\n...Installing:\n nmap     x86_64   2:6.47-1.fc21y    rhel-7-server-rpms\
  \   4.0 M\n...\nInstalled:  nmap-6.47-1.fc21\nComplete!\n```\n\n在 Ubuntu 发行版上安装\
  \ `nmap` 工具，请在命令行输入 `sudo apt-get install nmap`。\n\n`nmap` 工具的全名是 Network Mapper。它在安全审计和网络探索方面有多种用途。使用\
  \ `nmap` 进行各种端口扫描允许你可以查看本地网络所有服务器上运行的服务，以及它们是否正在发布其可用性。\n\n为了审核你的服务器端口，`nmap` 工具提供了几种实用的扫描类型。`nmap`\
  \ 网站有一个关于你可以使用的所有端口扫描技术的完整手册，位于 [`http://nmap.org/book/man-port-scanning-techniques.html`](http://nmap.org/book/man-port-scanning-techniques.html)。这里是两种基本的端口扫描，帮助你开始服务审计：\n\
  \n*   **TCP 连接端口扫描（TCP Connect port scan）**——对于这种扫描，`nmap` 尝试使用传输控制协议（TCP）连接服务器上的端口。如果端口正在监听，则连接尝试将成功。\n\
  \n    TCP 是 TCP/IP 网络协议套件中的一种网络协议。TCP 是一种面向连接的协议。它的主要目的是使用所谓的“三次握手”来协商并启动连接。TCP\
  \ 向远程服务器发送一个同步包（SYN），在数据包中指定特定的端口号。远程服务器接收 SYN 并向源计算机回复一个确认包（SYN-ACK）。原始服务器随后对响应进行确认（ACK），TCP\
  \ 连接便正式建立。。这种三次握手通常被称为 SYN-SYN-ACK 或 SYN, SYN-ACK, ACK。\n\n    如果你选择了 TCP 连接端口扫描，`nmap`\
  \ 工具将使用这种三次握手对远程服务器进行一些调查活动。任何使用 TCP 协议的服务都会对扫描做出响应。\n\n*   **UDP 端口扫描（UDP port\
  \ scan）**——对于这种扫描，`nmap` 向被扫描系统上的每个端口发送一个 UDP 数据包。UDP 是 TCP/IP 网络协议套件中的另一种流行协议。然而，与\
  \ TCP 不同，UDP 是无连接协议。如果端口正在监听并且有一个使用 UDP 协议的服务，它就会对扫描做出响应。\n\n当你运行 `nmap` 工具时，它会提供一个实用的小报告，包含你正在扫描的系统及其看到的端口的信息。端口被赋予一个“状态”（state）。`nmap`\
  \ 报告了六种可能的端口状态：\n\n\n\n\n\n*   `open`—这是 `nmap` 扫描针对端口可以报告的最危险状态。`open` 端口表示服务器有一个服务正在处理该端口的请求。将其想象成门上的告示牌，写着“请进！我们在这里为您提供帮助。”当然，如果你正在提供公共服务，你自然会希望该端口是开启的。\n\
  *   `closed`—`closed` 端口是可以访问的，但在这扇门的另一侧没有服务在等待。然而，扫描状态仍然表明在该特定的 IP 地址上确实有一台 Linux\
  \ 服务器。\n*   `filtered`—这是保护你不希望被任何人访问的端口的最佳状态。无法确定扫描的 IP 地址上是否真的有一台 Linux 服务器。可能某个服务正在监听特定端口，但防火墙阻止了对该端口的访问，从而有效地防止了通过特定的网络接口对该服务进行任何访问。\n\
  *   `unfiltered`—`nmap` 扫描可以看到该端口，但无法确定该端口是 `open` 还是 `closed`。\n*   `open|filtered`—`nmap`\
  \ 扫描可以看到该端口，但无法确定该端口是 `open` 还是 `filtered`。\n*   `closed|filtered`—`nmap` 扫描可以看到该端口，但无法确定该端口是\
  \ `closed` 还是 `filtered`。\n\n为了帮助你更好地理解如何使用 `nmap` 工具，请查看以下示例。为了构建网络服务列表，示例中的 `nmap`\
  \ 扫描是在 Fedora 系统上进行的。第一次扫描是从命令行执行的 TCP Connect 扫描，使用了回环地址 `127.0.0.1`。\n\n```\n\
  # nmap -sT 127.0.0.1\nStarting Nmap 5.51 ( http://nmap.org ) at 2016-03-22 10:33\
  \ EDT\nNmap scan report for localhost.localdomain (127.0.0.1)\nHost is up (0.016s\
  \ latency).\nNot shown: 998 closed ports\nPORT    STATE SERVICE\n25/tcp  open  smtp\n\
  631/tcp open  ipp\nNmap done: 1 IP address (1 host up) scanned in 1.34 seconds\n\
  ```\n\nTCP Connect `nmap` 扫描报告有两个 TCP 端口是开启的，并且 localhost (`127.0.0.1`) 上有服务监听这些端口的请求：\n\
  \n*   简单邮件传输协议 (SMTP) 正在 TCP 端口 25 上。\n*   互联网打印协议 (IPP) 正在 TCP 端口 631 上。\n\n下一次\
  \ `nmap` 扫描是针对 Fedora 系统回环地址的 UDP 扫描。\n\n```\n# nmap -sU 127.0.0.1\nStarting Nmap\
  \ 5.51 ( http://nmap.org ) at 2016-03-22 10:36 EDT\nNmap scan report for localhost.localdomain\
  \ (127.0.0.1)\nHost is up (0.00048s latency).\nNot shown: 997 closed ports\nPORT\
  \     STATE         SERVICE\n68/udp   open|filtered dhcpc\n631/udp  open|filtered\
  \ ipp\nNmap done: 1 IP address (1 host up) scanned in 2.24 seconds\n```\n\nUDP `nmap`\
  \ 扫描报告有两个 UDP 端口是开启的，并且这些端口上有服务在监听：\n\n*   动态主机配置协议客户端 (`dhcpc`) 正在端口 68 上。\n* \
  \  互联网打印协议 (`ipp`) 正在端口 631 上。\n\n注意，端口 631 的 IPP 同时被列在 `nmap` 的 TCP Connect 扫描和\
  \ UDP 扫描中，因为 IPP 协议同时使用了 TCP 和 UDP 协议，因此在两次扫描中都会列出。\n\n通过在回环地址上使用这两个简单的 `nmap` 扫描（TCP\
  \ Connect 和 UDP），你可以构建一个你的 Linux 服务器提供的网络服务列表。\n\n请记住，端口号与特定的协议（TCP 或 UDP）以及特定的网络接口相关联。例如，如果你计算机上有一个面向互联网的网卡\
  \ (NIC)，另一个面向私有网络的网卡，你可能想向面向私有网络的网卡提供提供私有服务（例如用于打印的 CUPS 服务）。但你可能想在面向互联网的网卡上过滤该端口\
  \ (631)。\n\n### 使用 nmap 审计你的网络服务公告\n\n你可能希望许多人访问你的网站（`httpd` 服务）。你可能并不希望互联网上的每个人都能访问你的\
