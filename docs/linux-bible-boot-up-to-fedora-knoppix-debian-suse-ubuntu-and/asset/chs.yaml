  \n## 6. 传输非源码形式。\n\n您可以根据第 4 条和第 5 条的条款，以目标代码形式传输受保护的作品，前提是您还根据本许可证的条款，通过以下方式之一传输机器读的\
  \ `Corresponding Source`：\n\n1. 在物理产品（包括物理分发介质）中或封装在其中传输目标代码，并附带固定在通常用于软件交换的耐用物理介质上的\
