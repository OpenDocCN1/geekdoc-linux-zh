  \ Host-A 发起移动到在 Host-B 发起。现在从 Host-B 对 Host-A 的端口尝试 TCP Connect 扫描。\n\n```\n$ nmap\
  \ -sT 10.140.67.23\nStarting Nmap 5.21 ( http://nmap.org ) at 2015-03-22 05:34\n\
