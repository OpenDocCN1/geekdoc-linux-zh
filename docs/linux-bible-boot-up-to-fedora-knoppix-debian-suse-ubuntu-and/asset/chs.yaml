  \ 和高级经理 Sam Knuth 的大力支持，我能够在广泛的技术领域开展工作，他们总是向我推荐很酷的项目，但从不阻碍我的发展。\n\n在这一版中，我特别感谢\
  \ Ryan Sawhill Aroha 的帮助，他帮我简化了关于加密技术的写作内容。对于我在书中编写的关于 Linux 云技术的新内容，我要感谢 `OpenStack`、`Docker`\
  \ 和 `RHEV` 团队的成员们，他们每天帮助我学习前沿云技术。\n\n至于 Wiley 的同事们，感谢你们多年来一直让我继续开发和完善这本书。Marty Minner\
