  \n*一如既往，我将本书献给我的妻子 Sheree。*\n\n# 关于作者\n\n**Chris Negus** 是红帽认证讲师 (RHCI)、红帽认证考官 (RHCX)、红帽认证架构师\
  \ (RHCA) 以及红帽公司的首席技术写作人员。在红帽工作的六多年里，Chris 教导了数百名渴望成为红帽认证系统工程师 (RHCE) 的 IT 专业人士。\n\
  \n在红帽的目前职位上，Chris 为红帽客户门户编写文章。他参与的项目包括红帽企业版 Linux 7、红帽企业 OpenStack 平台、红帽企业虚拟化以及\
  \ Docker 格式的 Linux 容器。\n\n除了 RHCA 认证外，Chris 还是红帽认证虚拟化管理员 (RHCVA) 和红帽认证数据中心专家 (RHCDS)。他还拥有部署与系统管理、集群与存储、云存储以及服务器加固方面的专家证书。\n\
  \n在加入红帽之前，Chris 编写了多本关于 Linux 的书籍，包括《Red Hat Bible》系列、《CentOS Bible》、《Fedora Bible》和《Linux\
  \ Troubleshooting Bible》以及《Linux Toys》。\n\n除了 RHCA 认证外，Chris 还编写或合写了多本针对高级用户的 Linux\
  \ 工具书，包括《Fedora Linux Toolbox》、《SUSE Linux Toolbox》、《Ubuntu Linux Toolbox》、《Mac\
  \ OS X Toolbox》以及《BSD UNIX Toolbox》。\n\n在加入红帽之前，Chris 曾在开发 UNIX 的 ATT 组织工作了多年，随后在\
  \ 20 世纪 90 年代搬到犹他参与 Novell 的 UnixWare 项目。如果不写 Linux，Chris 喜欢踢足球并和妻子在一起。\n\n# 关于技术编辑\n\
  \n**Richard Blum, LPIC-1** 在 IT 行业工作了 20 多年，担任系统和网络管理员，并出版了大量 Linux 和开源书籍。他管理过 UNIX、Linux、Novell\
  \ 和 Microsoft 服务器，并协助设计和维护了一个使用 Cisco 交换机和路由器的 3500 用户网络。他使用 Linux 服务器和脚本执行自动化网络监控，并在常用的环境中编写过脚本。Rich\
  \ 是美国大学使用的 Linux 入门课程的在线讲师。他不当电脑时，Rich 在不同的教会崇拜乐队中担任电贝斯手，并与妻子和两个女儿共度时光。\n\n# 制作人员\n\
