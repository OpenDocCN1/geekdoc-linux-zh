  \ Source` 的书面承诺副本。这种替代方案仅在偶尔和非商业性的情况下允许，且仅在您根据第 6b 小节收到了带有此类承诺的目标代码时才可行。\n\n4. 通过从指定地点（免费或收费）提供访问来传输目标代码，并以相同方式通过相同地点无额外费用提供\
