  Nmap done: 1 IP address (1 host up) scanned in 0.40 seconds\n# nmap -sU 10.140.67.23\n\
  [sudo] password for johndoe: ***************\nStarting Nmap 5.21 ( http://nmap.org\
  \ ) at 2012-03-22 06:22 HADT\nNmap scan report for 10.140.67.23\nHost is up (0.00072s\
  \ latency).\nNot shown: 997 closed ports\nPORT     STATE         SERVICE\n68/udp\
  \   open|filtered dhcpc\n631/udp  open|filtered ipp\n...\nNmap done: 1 IP address\
  \ (1 host up) scanned in 1081.83 seconds\n```\n\n为了进行彻底的审计，请务必包含 UDP 扫描。此外，还有一些额外的\
  \ `nmap` 扫描可能对你的组织有益。请查看 `nmap` 工具的网站获取更多建议。\n\n你仍然需要对 Linux 服务器应该提供的那些服务实施控制。实现这一目标的方法是通过\
  \ TCP 封装器（TCP wrappers）。\n\n### 控制网络服务的访问\n\n完全禁用一个不使用的服务是可以，但对于需要的网络服务，你必须设置访问控制。对于集成\
  \ TCP Wrapper 支持的 Linux 系统，可以通过 `/etc/hosts.allow` 和 `/etc/hosts.deny` 文件对选服务实现这种必要的访问控制。\n\
  \n如果支持 TCP Wrapper，网络服务将使用 `libwrap`。检查 `libwrap` 可以在网络服务守护进程上运行 `ldd` 命令。下面的示例显示\
  \ `ssh` 守护进程使用了 TCP Wrapper。如果你的 Linux 系统的 `sshd` 没有使用 TCP Wrapper，则没有输出。\n\n```\n\
  $ ldd /usr/sbin/sshd | grep libwrap\nlibwrap.so.0 => /lib/libwrap.so.0 (0x0012f000)\n\
  ```\n\n当请求包含 TCP Wrapper 支持的网络服务时，系统会扫描 `hosts.allow` 和 `hosts.deny` 文件，并检查是否存在匹配请求的远程系统地址的条目。当远程系统请求访问\
  \ TCP Wrapper 服务时，会发生以下步骤：\n\n1. **检查 `hosts.allow` 文件。**\n    *   如果远程系统的地址列表中：\n\
  \        *   允许访问。\n        *   不再进行后续 TCP Wrapper 检查。\n    *   如果远程系统的地址不在列表中，TCP\
  \ Wrapper 检查继续到 `hosts.deny` 文件。\n\n2. **检查 `hosts.deny` 文件。**\n    *   如果远程系统的地址列表中，拒绝访问。\n\
  \    *   如果远程系统的地址不在列表中，允许访问。\n\n`hosts` 文件的评估顺序非常重要。例如，你不能在 `hosts.deny` 文件中拒绝一个已经在\
  \ `hosts.allow` 中被允许访问的主机的访问。\n\n\n\n\n基于主机的防火墙是运行并保护单个主机或服务器的防火墙。你很可能在自家的电脑上有一个防火墙，这就是基于主机的防火墙。另一个基于主机的防火墙示例是\
  \ `firestarter` 应用程序。你可以在 [`http://www.fs-security.com`](http://www.fs-security.com)\
  \ 更多关于 `firestarter` 的信息。\n\n*   **防火墙可以是硬件防火墙，也可以软件防火墙。** 防火墙可以位于网络设备（如路由器）。它们的过滤器配置在路由器的固件中。在家里，你的互联网服务提供商（ISP）可能会提供\
  \ DSL 或电缆调制解调器来接入互联网。该调制解调器包含防火墙固件，被视为硬件防火墙。\n\n防火墙也可以的形式的形式位于计算机系统中。应用程序允许设置过滤规则，以过滤入站流量。这就是软件防火墙的一个示例。软件防火墙也被称为基于规则的防火墙。\n\
  \n*   **防火墙可以是网络层过滤器，也可以应用层过滤器。** 检查单个数据包的防火墙也称为 `packet filter`（数据包过滤器）。网络层防火墙仅允许特定的数据包进入或离开系统。它运行在\
  \ OSI 参考模型的较低层。\n\n应用层防火墙在 OSI 参考模型的较高层上进行过滤。这种防火墙仅允许特定的应用程序访问系统或从系统访问。\n\n你可以看到这些防火墙类别是如何重叠的。最佳的防火墙设置是所有类别的组合。与许多安全实践一样，层级越多，恶意活动就越难以渗透。\n\
  \n## 实现防火墙\n\n在 Linux 系统上，防火墙是一个由 `iptables` 实用程序管理的基于主机、网络层的软件防火墙。通过 `iptables`，你可以为通过你的\
  \ Linux 服务器的每个网络数据包创建一系列规则。你可以对这些规则进行精细调整，以允许来自某个位置的网络流量，但不允许来自另一个位置的流量。这些规则本质上构成了你\
  \ Linux 服务器的网络访问控制列表。\n\nFedora、RHEL 和其他 Linux 发行版在 `iptables` 之上添加了 `firewalld`\
  \ 服务，以提供一种更动态的方法管理防火墙规则。防火墙配置窗口（`firewall-config` 命令）提供了一种简单的方法，可以在你的防火墙上打开端口并进行伪装（将私有地址路由到公共网络）或端口转发。`firewalld`\
  \ 服务可以对条件的变化做出反应，而静态的 `iptables` 服务本身无法做到这一点。通过启用对服务的访问，`firewalld` 还可以执行加载允许访问服务所需的模块的操作。\n\
  \n### 从 firewalld 开始\n\n`firewalld` 服务可能已经安装在你的 Linux 系统上。如果没有安装，你可以安装该服务以及相关的图形用户界面，然后如下所示启动\
  \ `firewalld` 服务：\n\n```\n# yum install firewalld firewall-config\n# systemctl start\
  \ firewalld.service\n# systemctl enable firewalld.service\n```\n\n要管理 `firewalld`\
  \ 服务，你可以启动防火墙配置窗口。通过输入以下命令：\n\n```\n# firewall-config &\n```\n\n图 25.1 显示了防火墙配置窗口的一个示例。\n\
  \n![image](img/00073.jpeg)\n\n**图 25.1** 防火墙配置\n\n如果你只需要打开一些防火墙端口以允许访问选定的服务，在防火墙配置窗口中操作非常简单。在选择公共区域（public\
  \ zone）的情况下，只需点击你想打开的服务。允许访问该服务的端口将立即打开（当你选择运行时配置时）并永久打开（当你选择永久性配置时）。\n\n防火墙配置窗口的一个非常很棒的功能是，当你选择允许访问某个服务时，你做的不仅仅是打开一个端口。例如，启用\
  \ FTP 服务还会加载连接跟踪模块，允许在需要时通过防火墙访问非标准端口。\n\n如前提到的，`firewalld` 服务的底层是 `iptables` 设施。如果你使用的是没有\
  \ `firewalld` 服务的 Linux 系统（或禁用了 `firewalld`），你仍然可以使用 `iptables` 服务。下一节将描述你如何能够手动设置\
  \ `iptables` 防火墙规则并直接使用 `iptables` 服务，而不使用 `firewalld` 服务。\n\n## 理解 iptables 实用程序\n\
  \n在开始通过 `iptables` 实用程序更改防火墙规则之前，你需要了解 `netfilter/iptables` 的基础知识，包括以下内容：\n\n* \
  \  表 (Tables)\n*   链 (Chains)\n*   策略 (Policies)\n*   规则 (Rules)\n\n这些每一个基础知识对于正确设置和管理你的\
  \ Linux 服务器防火墙都至关重要。\n\n### netfilter/iptables 表\n\n`iptables` 防火墙具有超出低级数据包过滤的能力。它定义了正在发生的防火墙功能类型。`iptables`\
  \ 实用程序中有四个表，SELinux 扩展额外添加了一个表。这些表提供了以下功能：\n\n*   `filter`——`filter` 表是防火墙的数据包过滤功能。在此表中，对于流向、来自和通过你的\
  \ Linux 系统的的数据包做出访问控制决策。\n*   `nat`——`nat` 表用于网络地址转换 (NAT)。防火墙可以配置为 NAT，这与数据包过滤是不同的安全功能。\n\
  *   `mangle`——`mangle` 表用于修改数据包的 TTL（生存时间）。\n*   `raw`——`raw` 表用于使数据包免受连接跟踪。\n*\
  \   `security`——`security` 表仅在具有 SELinux 的发行版上可用。\n\n### netfilter/iptables 链\n\n\
  `netfilter/iptables` 防火墙将网络数据包分为不同的类别，称为“链”（chains）。网络数据包可以被指定的五种链如下所示：\n\n*   `INPUT`——*进入*\
  \ Linux 服务器的网络数据包。\n*   `FORWARD`——进入 Linux 服务器并准备*路由*到其他地方的网络数据包。\n*   `OUTPUT`——*离开*\
  \ Linux 服务器的网络数据包。\n*   `PREROUTING`——用于 NAT，在数据包进入 Linux 服务器时修改网络数据包。\n*   `POSTROUTING`——用于\
  \ NAT，在数据包离开 Linux 服务器之前修改网络数据包。\n\n你选择操作哪个 `netfilter/iptables` 表决定了哪些链可用于网络数据包分类。表\
  \ 25.1 显示了每个表可用的链。\n\n\n\n\n\n网络数据包被分类到特定的链（chain）后，`iptables` 可以决定对该数据包应用什么策略或规则。\n\
  \n### netfilter/iptables 规则、策略和目标\n\n对于每个网络数据包，都可以设置规则来定义如何处理该数据包。`netfilter/iptables`\
  \ 防火墙可以通过多种方式识别网络数据包。以下是方法：\n\n* 源 IP 地址\n* 目的 IP 地址\n* 网络协议\n* 入站端口\n* 出站端口\n*\
  \ 网络状态\n\n如果特定数据包不存在规则，则使用整体策略。每个数据包类别或链都有默认策略。当网络数据包匹配特定规则或落入默认策略后，就会对数据包执行操作。采取的操作取决于设置了什么\
  \ `iptables` 目标（target）。以下是可以采取的操作（目标）：\n\n* `ACCEPT`—网络数据包被接受进入服务器。\n* `REJECT`—网络数据包被丢弃且不允许进入服务器。会发送一个拒绝消息。\n\
  * `DROP`—网络数据包被丢弃且不允许进入服务器。不发送拒绝消息。\n\n虽然 `REJECT` 会提供拒绝消息，但 `DROP` 是静默的。你可能考虑对内部员工使用\
  \ `REJECT`，告诉他们你拒绝了他们的出站网络流量以及原因。对于入站流量考虑使用 `DROP`，这样任何恶意人员都不会意识到他们的流量正在被拦截。\n\n\
  `iptables` 工具通过 `filter` 表的策略和规则实现了一个软件防火墙。现在你已经对软件防火墙的实现有了通俗了解，就可以开始深入研究通过 `iptables`\
  \ 工具实现防火墙的具体命令了。\n\n#### 使用 iptables 工具\n\n你的 Linux 服务器应该已经带有了正在运行的防火墙。然而，检查一下它是否确实启用是一个好主意。在检查之前，你必须先了解\
  \ `netfilter/iptables` 防火墙服务取决于 Linux 发行版的有不同：\n\n* **RHEL 6 或更早版本的 netfilter/iptables\
  \ 防火墙**—在该发行版上运行的防火墙接口服务是 `iptables`。在命令行中输入 `service iptables status` 查看该防火墙服务是否运行。\n\
  \    * 要启用防火墙，在命令行中输入 `service iptables start`。\n    * 要禁用防火墙，在命令行中输入 `service iptables\
  \ stop`。\n* **RHEL 7 和近期 Fedora 系统的 netfilter/iptables 防火墙**—在这些发行版上运行的防火墙接口服务是\
  \ `firewalld`。这些系统默认并不直接运行 `iptables` 服务。在命令行中输入 `systemctl status firewalld.service`\
  \ 查看防火墙服务是否运行。\n    * 要启用防火墙，在命令行中输入 `systemctl start firewalld.service`。\n    *\
  \ 要禁用防火墙，在命令行中输入 `systemctl stop firewalld.service`。\n* **Ubuntu netfilter/iptables\
  \ 防火墙**—在该发行版上运行的防火墙接口服务是 `ufw`。在命令行中输入 `sudo ufw status` 查看防火墙服务是否运行。`ufw` 服务是\
  \ `iptables` 工具的接口，在 Ubuntu 上不作为服务运行。你可以使用 `ufw` 命令来操作防火墙规则。然而，所有的 `iptables` 工具命令对\
  \ Ubuntu 仍然有效：\n    * 要启用防火墙，在命令行中输入 `sudo ufw enable`。\n    * 要禁用防火墙，在命令行中输入 `sudo\
  \ ufw disable`。\n\n幸运的是，在你检查了状态并启用或禁用 `netfilter/iptables` 防火墙后，发行版之间的差异就结束了。\n\n\
  要查看当前 `filter` 表的策略和规则，在命令行中输入 `iptables -t filter -vnL`。在接下来的示例中，该命令在 Linux Mint\
  \ 系统上输入。\n\n```\n# iptables -t filter -vnL\nChain INPUT (policy ACCEPT 0 packets,\
  \ 0 bytes)...\n```\n\n注意，在启用了 `firewalld` 的系统上，默认列出的 iptables 链和规则比你在直接使用 iptables\
  \ 的系统上看到的多得多。这样做是为了允许将规则划分为不同类型接口的区域（zones），从而在构建防火墙时提供更大的灵活性。\n\n前面的示例仅显示了 iptables\
  \ 输出的第一行。该行显示 `INPUT` 链的默认策略适用于所有不匹配其他规则的网络数据包。目前，所有默认的 `INPUT`、`FORWARD` 和 `OUTPUT`\
  \ 策略都设置为 `ACCEPT`。所有网络数据包都允许进入、通过和流出。在这种状态下，防火墙基本上是禁用的，直到添加了特定的 `REJECT` 或 `DROP`\
  \ 规则。\n\n### 修改 iptables 策略和规则\n\n在开始修改 `netfilter/iptables` 防火墙之前，了解一些命令选项会有帮助。以下是修改防火墙的几个选项：\n\
  \n* `-t `table` 与此开关一起列出的 `iptables` 命令将应用于 `table`。默认情况下使用 `filter` 表。例如：\n  ```\n\
  \  # iptables -t filter -P OUTPUT DROP\n  ```\n* `-P `chain target` 为特定的 `chain`\
  \ 设置整体策略。检查 `chain` 中的规则是否匹配匹配。如果没有发生匹配，则使用 `chain` 列出的 `target`。例如：\n  ```\n  #\
  \ iptables -P INPUT ACCEPT\n  ```\n* `-A `chain` 设置一条规则“追加规则”（appended rule），它是指定\
  \ `chain` 整体策略的例外。例如：\n  ```\n  # iptables -A OUTPUT -d 10.140.67.25 -j REJECT\n\
  \  ```\n* `-I `rule# chain` 将追加规则插入到指定 `chain` 的追加规则列表中由 `rule#`指定的特定位置。例如：\n  ```\n\
  \  # iptables -I 5 INPUT -s 10.140.67.23 -j DROP\n  ```\n* `-D `chain rule#` 从指定的\
  \ `chain` 中删除由 `rule#`指定的特定规则。例如：\n  ```\n  # iptables -D INPUT 5\n  ```\n* `-j\
  \ `target` 如果满足规则中的标准，防火墙应跳转到此 `target` 进行处理。例如：\n  ```\n  # iptables -A INPUT -s\
  \ 10.140.67.25 -j DROP\n  ```\n* `-d `IP address` 将列出的规则分配到目的 `IP address`。例如：\n\
  \  ```\n  # iptables -A OUTPUT -d 10.140.67.25 -j REJECT\n  ```\n* `-s `IP address`\
  \ 将列出的规则分配到源 `IP address`。例如：\n  ```\n  # iptables -A INPUT -s 10.140.67.24 -j ACCEPT\n\
  \  ```\n* `-p `protocol` 将列出的规则分配到指定的 `protocol`。例如：\n  ```\n  # iptables -A INPUT\
  \ -p icmp -j DROP\n  ```\n* `--dport `port#` 将列出的规则分配到进入 `port#` 的某些协议数据包。例如：\n\
  \  ```\n  # iptables -A INPUT -p tcp --dport 22 -j DROP\n  ```\n* `--sport `port#`\
  \ 将列出的规则分配到离开 `port#` 的某些协议数据包。例如：\n  ```\n  # iptables -A OUTPUT -p tcp --sport\
  \ 22 -j ACCEPT\n  ```\n* `-m `state` `--state `network state` 将列出的规则分配到指定的 `network\
  \ state`(s)。例如：\n  ```\n  # iptables -A INPUT -m state --state RELATED,ESTABLISH\
  \ -j ACCEPT\n  ```\n\n为了查看 `iptables` 选项如何，请考虑以下示例。你有一台 IP 地址为 10.140.67.23 的 Linux\
  \ 服务器（Host-A）。你的网络中还有两台 Linux 服务器。一台是 IP 地址为 10.140.67.22 的 Host-B，另一台是 IP 地址为 10.140.67.25\
  \ 的 Host-C。你的目标是实现以下目标：\n\n* 允许 Host-C 完全访问 Host-A。\n* 禁止从 Host-B 使用 `ssh` 远程登录\
  \ Host-A。\n\n\n\n\n\n## 设置 DROP 策略。\n\n以下代码显示了 Host-A 防墙的默认策略。在此示例中，防火墙是完全开放的，没有实施任何限制。没有设置任何规则，所有策略都设置为\
  \ `ACCEPT`。\n\n```\n# iptables -vnL\nChain INPUT (policy ACCEPT)\ntarget     prot\
  \ opt source               destination\nChain FORWARD (policy ACCEPT)\ntarget  \
  \   prot opt source               destination\nChain OUTPUT (policy ACCEPT)\ntarget\
  \     prot opt source               destination\n```\n\n首先，如果将 `INPUT` 策略从 `ACCEPT`\
  \ 改为 `DROP` 会发生什么？这能达到目标吗？看看尝试这种操作会发生什么。记住，如果入站数据包没有列出规则，则将遵循链（chain）的策略（policy）。在接后的示例中，对\
  \ Host-A 的防火墙进行了此更改。\n\n```\n# iptables -P INPUT DROP\n# iptables -vnL\nChain INPUT\
  \ (policy DROP)\ntarget     prot opt source               destination\nChain FORWARD\
  \ (policy ACCEPT)\ntarget     prot opt source               destination\nChain OUTPUT\
  \ (policy ACCEPT)\ntarget     prot opt source               destination\n```\n\n\
  Host-B 尝试 `ping` Host-A，然后按照后续示例所示尝试建立 `ssh` 连接。如你所见，两次尝试都失败了。由于 `ping` 命令被阻止，这并没有实现仅阻塞来自\
  \ Host-B 的 `ssh` 远程登录连接的目标。\n\n```\n$ ping -c 2 10.140.67.23\nPING 10.140.67.23\
  \ (10.140.67.23) 56(84) bytes of data.\n--- 10.140.67.23 ping statistics ---\n2\
  \ packets transmitted, 0 received, 100% packet loss, time 1007ms\n$ ssh root@10.140.67.23\n\
  ssh: connect to host 10.140.67.23 port 22: Connection timed out\n```\n\n当 Host-C\
  \ 尝试 `ping` Host-A 并建立 `ssh` 连接时，两次尝试都失败了。因此确认，防火墙设置 `INPUT` 策略等于 `DROP` 并不是达到目标所需的配置。\n\
  \n```\n$ ping -c 2 10.140.67.23\nPING 10.140.67.23 (10.140.67.23) 56(84) bytes of\
  \ data.\n--- 10.140.67.23 ping statistics ---\n2 packets transmitted, 0 received,\
  \ 100% packet loss, time 1008ms\n$ ssh root@10.140.67.23\nssh: connect to host 10.140.67.23\
  \ port 22: Connection timed out\n```\n\n## 阻塞源 IP 地址。\n\n如果只阻塞 Host-B 的 IP 地址会怎样？这将允许\
  \ Host-C 访问 Host-A。这种设置能达到目标吗？\n\n在接后的示例中，必须首先在 Host-A 的 `iptables` 中将 `DROP` 策略改为\
  \ `ALLOW`。之后，必须追加一条特定规则来单独阻塞来自 Host-B IP 地址 10.140.67.22 的网络包。\n\n```\n# iptables\
  \ -P INPUT ACCEPT\n# iptables -A INPUT -s 10.140.67.22 -j DROP\n# iptables -vnL\n\
  Chain INPUT (policy ACCEPT)\ntarget     prot opt source               destination\n\
  DROP       all  --  10.140.67.22             anywhere\nChain FORWARD (policy ACCEPT)\n\
  target     prot opt source               destination\nChain OUTPUT (policy ACCEPT)\n\
  target     prot opt source               destination\n```\n\nHost-C 现在可以成功地 `ping`\
  \ 并 `ssh` 进入 Host-A，满足了设定的目标之一。\n\n```\n$ ping -c 2 10.140.67.23\nPING 10.140.67.23\
  \ (10.140.67.23) 56(84) bytes of data.\n64 bytes from 10.140.67.23: icmp_req=1 ttl=64\
  \ time=11.7 ms\n64 bytes from 10.140.67.23: icmp_req=2 ttl=64 time=0.000 ms\n---\
  \ 10.140.67.23 ping statistics ---\n2 packets transmitted, 2 received, 0% packet\
  \ loss, time 1008ms\nrtt min/avg/max/mdev = 0.000/5.824/11.648/5.824 ms\n$ ssh root@10.140.67.23\n\
  root@10.140.67.23's password:\n```\n\n然而，Host-B 既不能 `ping` 也不能 `ssh` 进入 Host-A。因此，追加的规则并不完全是整个目标所需的。\n\
  \n```\n$ ping -c 2 10.140.67.23\nPING 10.140.67.23 (10.140.67.23) 56(84) bytes of\
  \ data.\n--- 10.140.67.23 ping statistics ---\n2 packets transmitted, 0 received,\
  \ 100% packet loss, time 1007ms\n$ ssh root@10.140.67.23\nssh: connect to host 10.140.67.23\
  \ port 22: Connection timed out\n```\n\n## 阻塞协议和端口。\n\n如果不是完全阻塞 Host-B 的 IP 地址，而是只阻塞来自\
  \ Host-B IP 地址的 `ssh` 端口（22 端口）连接呢？这能否达到允许 Host-C 全面访问 Host-A 且仅阻塞来自 Host-B 的 `ssh`\
  \ 连接的目标？\n\n在接后的示例中，修改了 Host-A 的 `iptables` 规则，以尝试阻止来自 22 端口的 Host-B IP 地址。注意，`--dport`\
  \ 选项必须配合特定的协议，例如 `-p tcp`。在添加新规则之前，必须使用 `-D` 选项删除上一个示例中的规则。否则，上一个示例中的规则将仍会被 Host-A\
  \ 防火墙处理 Host-B 的数据包。\n\n```\n# iptables -D INPUT -s 10.140.67.22 -j DROP\n# iptables\
  \ -A INPUT -p tcp -s 10.140.67.22 --dport 22 -j DROP\n# iptables -vnL\nChain INPUT\
  \ (policy ACCEPT)\ntarget     prot opt source               destination\nChain FORWARD\
  \ (policy ACCEPT)\ntarget     prot opt source               destination\nChain OUTPUT\
  \ (policy ACCEPT)\ntarget     prot opt source               destination\n```\n\n\
  首先，通过 Host-C 测试新规则以确保 `ping` 和 `ssh` 均不受影响。\n\n```\n$ ping -c 2 10.140.67.23\nPING\
  \ 10.140.67.23 (10.140.67.23) 56(84) bytes of data.\n64 bytes from 10.140.67.23:\
  \ icmp_req=1 ttl=64 time=11.7 ms\n64 bytes from 10.140.67.23: icmp_req=2 ttl=64\
  \ time=0.000 ms\n--- 10.140.67.23 ping statistics ---\n2 packets transmitted, 2\
  \ received, 0% packet loss, time 1008ms\nrtt min/avg/max/mdev = 0.000/5.824/11.648/5.824\
  \ ms\n$ ssh root@10.140.67.23\nroot@10.140.67.23's password:\n```\n\n接下来，通过 Host-B\
  \ 测试新规则以确保 `ping` 正常但 `ssh` 连接被阻止。这也成功了！\n\n```\n$ ping -c 2 10.140.67.23\nPING\
  \ 10.140.67.23 (10.140.67.23) 56(84) bytes of data.\n64 bytes from 10.140.67.23:\
  \ icmp_req=1 ttl=64 time=11.7 ms\n64 bytes from 10.140.67.23: icmp_req=2 ttl=64\
  \ time=0.000 ms\n--- 10.140.67.23 ping statistics ---\n2 packets transmitted, 2\
  \ received, 0% packet loss, time 1008ms\nrtt min/avg/max/mdev = 0.000/5.824/11.648/5.824\
  \ ms\n$ ssh root@10.140.67.23\nssh: connect to host 10.140.67.23 port 22: Connection\
  \ timed out\n```\n\n### 保存 iptables 配置\n\n在你完成了创建 Linux 服务器防火墙配置和规则的所有繁琐工作后，你将希望保存它们。所有修改都必须保存到\
  \ `iptables` 配置文件 `/etc/sysconfig/iptables`，因为这是启动时用于加载防火墙的文件。\n\n在接后的示例中，早之前的修改仍然存在于防火墙中。在将它们保存到配置文件之前，会制作原始文件的备份。这始终是一个好主意。然后使用\
  \ `iptables-save` 命令保存修改。注意，使用重定向符号 `>` 将输出定向到 `/etc/sysconfig/iptables` 文件（参见示例中的最后一行代码）。\n\
  \n```\n# iptables -vnL\nChain INPUT (policy ACCEPT)\ntarget     prot opt source\
  \     destination\nDROP       tcp  --  10.140.67.22    anywhere     tcp dpt:ssh\n\
  Chain FORWARD (policy ACCEPT)\ntarget     prot opt source     destination\nChain\
  \ OUTPUT (policy ACCEPT)\ntarget     prot opt source     destination\n# cp /etc/sysconfig/iptables\
  \ /etc/sysconfig/iptables.bck\n# iptables-save > /etc/sysconfig/iptables\n```\n\n\
  \n\n\n\n```bash\n# iptables -F\n# iptables -vnL\nChain INPUT (policy ACCEPT)\ntarget\
  \     prot opt source     destination\nChain FORWARD (policy ACCEPT)\ntarget   \
  \  prot opt source     destination\nChain OUTPUT (policy ACCEPT)\ntarget     prot\
  \ opt source     destination\n```\n\n清空规则不会影响 `iptables` 配置文件。要将防火墙恢复到原始状态，请使用 `iptables-restore`\
  \ 命令。在接下来的示例中，将 `iptables` 配置文件重定向到 `restore` 命令中，并恢复了针对 `10.140.67.22` 的原始 `DROP`\
  \ 规则。\n\n```bash\n# iptables-restore < /etc/sysconfig/iptables\n#  ptables -vnL\n\
  Chain INPUT (policy ACCEPT)\ntarget     prot opt source     destination\nDROP  \
  \     tcp  --  10.140.67.22   anywhere   tcp dpt:ssh\nChain FORWARD (policy ACCEPT)\n\
  target     prot opt source     destination\nChain OUTPUT (policy ACCEPT)\ntarget\
  \     prot opt source     destination\n```\n\n你还可以保存你的 `netfilter/iptables` 防火墙规则以创建审计报告。定期检查这些规则应该是你组织系统生命周期审计/评审阶段的一部分。\n\
  \n## 总结\n\n在网络中保护你的 Linux 服务器是至关重要的。从本质上说，大多数恶意攻击源于网络，特别是互联网。本章涵盖了一些基础知识，例如 OSI\
  \ 模型，这些都是你启动这一过程所需的知识。\n\n在确定并移除任何不需要的网络服务后，保护你的网络服务可以变得简单。`nmap` 工具可以在这方面为你提供帮助。此外，你还可以使用\
  \ `nmap` 审计你的 Linux 服务器所发布的网络服务。这些审计有助于确定需要哪些防火墙修改。\n\n对于需要的网络服务，必须实施访问控制。TCP wrappers\
  \ 可以协助这项工作。可以以每个服务为单位允许或拒绝访问，从而对每个网络服务的访问进行精细化调整。\n\n较新版本的 Fedora 和 RHEL 添加了 `firewalld`\
  \ 服务，作为 Linux 内核内置的 `iptables` 防火墙设施的前端。使用 `firewalld-config` 窗口，你可以轻松地打开防火墙中的端口以允许访问所选的服务。`netfilter/iptables`\
  \ 防火墙设施是一种基于主机的、网络层的软件防火墙。它由 `iptables` 和 `ip6tables` 工具管理。通过这些工具，可以为通过你 Linux 服务器的每个网络数据包创建一系列策略和规则。这些策略和规则本质上构成了你\
  \ Linux 服务器网络的访问控制列表。\n\n在书的目前阶段，你应该很好地掌握了设置和保护 Linux 桌面和服务器系统所涉及的知识。在接下来的两个章节中，我将帮助你将这些知识扩展到云计算和虚拟化。\n\
  \n## 练习\n\n参考本章的材料完成以下任务。如果你遇到了困难，附录 B 显示了任务的解决方案（尽管在 Linux 中，你通常可以通过多种方式完成一项任务）。在参考答案之前，请尝试每项练习。这些任务假设你正在运行\
  \ Fedora 或红帽企业级 Linux 系统（尽管某些任务在其他 Linux 系统上同样适用）。请勿在生产系统上尝试这些练习中的 `iptables` 命令。虽然这里显示的命令不会永久更改你的防火墙（防火墙服务重启时旧规则将恢复），但不当地修改防火墙可能会导致意外的访问。\n\
  \n1. 在你的本地 Linux 系统上安装 Network Mapper 工具。\n2. 在你的本地回环地址上运行 TCP 连接扫描。哪些端口上运行着服务？\n\
  3. 从远程系统在你的 Linux 系统上运行 UDP 连接扫描。\n4. 检查你 Linux 系统上的 `ssh` 守护进程是否使用 TCP Wrapper\
  \ 支持。\n5. 使用 TCP Wrapper 文件，允许从指定的远程系统访问你 Linux 系统上的 `ssh` 工具。拒绝所有其他访问。\n6. 确定你\
  \ Linux 系统当前的 `netfilter/iptables` 防火墙策略和规则。\n7. 清空你 Linux 系统当前的防火墙规则，然后恢复它们。\n\
  8. 针对你 Linux 系统的防火墙，将 input 链（输入链）的过滤表策略设置为 reject（拒绝）。\n9. 将你 Linux 系统防火墙的 input\
  \ 链的过滤表策略改回 accept（接受），然后添加一条规则来丢弃来自 IP 地址 10.140.67.23 的所有网络数据包。\n10. 在不清空或恢复你\
  \ Linux 系统防火墙规则的情况下，删除你上面添加的规则。\n\n# 第六部分：将 Linux 扩展到云\n\n## 第 26 章：使用 Linux 进行云计算\n\
  \n对于云用户来说，云计算意味着能够从他们的本地计算机向网络上的某些服务器请求某些计算服务，而无需一定知道这些请求是如何实现的。之所以称之为“云”，取决于提供这些服务的人如何设置他们的计算机基础设施来满足这些请求。\n\
  \n今天的云技术使得将数据中心视为大型、流动的主机池（虚拟机管理程序）、控制器、存储节点、网络配置以及许多其他组件成为可能。你可能会好奇 Linux 与云计算有什么关系。事实上，Linux\
  \ 恰好是今天许多公共云和私有云技术的核心。\n\n本章向你介绍了云计算的一般概念，特别是与 Linux 相关的云技术。在介绍云概念后，本章将让你设置云技术的一些基础构建模块：虚拟机管理程序、虚拟机和共享存储。\n\
  \n在你尝试了这些基础云技术之后，本章描述了企业级云如何扩展这些基础概念，以便它们能够扩展以满足现代数据中心的需求。\n\n### Linux 与云计算概述\n\
  \n云将我们带入领域，在这个领域中，你在书中学到的所有内容都被抽象化和自动化了。对于云，当你安装一个系统时，你可能不是从物理 DVD 启动、擦除本地硬盘并直接在坐在面前的电脑上安装\
  \ Linux。你不是使用 `/etc/passwd` 文件中的条目登录，也不是利用单台机器的处理能力。\n\n相反，你正在安装到运行在云端某些主机系统上的虚拟机或容器中。你看到的网络接口可能不是由物理交换机表示，而是存在于单台计算机上或跨越多个虚拟机管理程序的虚拟网络。\n\
  \n今天，云计算的每个软件方面都可以使用在 Linux 系统上的开源技术来实现。我在这里的目标不是描述如何使用基于 Linux 的云环境的每个方面。相反，我想告诉您新兴技术如何扩展我们在书中涵盖的所有内容，以便在云环境中高效运行。然后，我将给你机会去配置一些基础云技术，以感受这一切是如何运作的。\n\
  \n### 云虚拟机管理程序（又计算节点）\n\n在云计算中，为云服务的操作系统并不直接运行在计算机硬件上。相反，虚拟机管理程序被配置为运行许多操作系统，即所谓的虚拟机。\n\
  \n取决于你的云环境，你可能会听到虚拟机管理程序被称为 `compute node`（计算节点）或简单称为 `host`（主机）。由于虚拟机管理程序往往是商品化的（一个位置可能会设置几十或数百个虚拟机管理程序），Linux\
  \ 是直接在硬件上作为虚拟机管理程序运行的操作系统的逻辑选择。\n\n基于内核的虚拟机 (`KVM`) 是实现将 Linux 系统变为虚拟机管理程序的基础虚拟化技术。`KVM`\
  \ 支持 Ubuntu、红帽企业 Linux、Fedora 以及许多其他 Linux 系统。\n\n\n\n\n\n另一种可以替代 KVM 将 Linux 系统变为虚拟机监控程序的主要技术是\
  \ Xen（[`www.xenproject.org`](http://www.xenproject.org) ）。Xen 的出现时间比 KVM 更早，并且受到了\
  \ Citrix Systems 和 Oracle 产品的支持。\n\n在本章的稍后部分，我将介绍如何检查计算机是否具有作为虚拟机监控程序的硬件特性，以及如何配置它以与\
  \ KVM 使用。\n\n### 云控制器\n\n由于云配置可能包含多个虚拟机监控程序、存储池、多个虚拟网络以及许多虚拟机，因此你需要集中化的工具来管理和监控这些功能。你可以使用图形界面和基于的工具来控制云环境。\n\
  \n虽然不被认为是完整的云控制器，但虚拟机管理器（`virt-manager`）GUI 和 `virsh` 命令可以管理小型类云环境。通过使用 `virt-manager`，你可以体验跨越多个虚拟机监控程序管理多个虚拟机，并学习如何处理虚拟网络和共享存储池。\n\
  \n全功能云平台有自己的控制器，用于在云组件之间提供更复杂的交互。对于 OpenStack 云平台，OpenStack 面板（Horizon 项目）为 OpenStack\
  \ 组件提供了基于 Web 的界面。对于红帽企业虚拟化（RHEV），RHEV Manager 提供了相同的功能。\n\n在本章的稍后部分，我将介绍如何使用 `virt-manager`\
  \ 管理你的第一个微类云环境。\n\n### 云存储\n\n当你将操作系统和应用程序迁移到云环境时，对数据存储产生了新需求。为了虚拟机能够移动到另一个虚拟机监控程序上运行，其存储必须在该新的虚拟机监控程序可用。云的存储需求包括：存储虚拟机后端存储的地方、启动虚拟机的镜像，以及存储云本身信息的数据库。\n\
  \n虚拟机监控程序之间的共享存储可以简单地通过 NFS 共享（参见第 20 章）并将其挂载到多个虚拟机监控程序的相同挂载点。NFS 是实现共享存储最简单的方法之一。\n\
  \n更健壮的能够处理磁盘故障并提供更好性能的共享存储对于提供关键服务的云更为有效。共享块存储（你挂载整个磁盘或磁盘分区）可以使用 iSCSI 或光纤通道技术实现。\n\
  \nCeph（[`http://ceph.com`](http://ceph.com)）是一个用于管理块和对象存储的开源项目，在管理云环境存储方面非常流行。GlusterFS（[`www.gluster.org`](http://www.gluster.org)）是一种经常用于云环境的可扩展文件系统。\n\
  \n对于本章中简单的微云示例，我使用 NFS 在虚拟机监控程序之间提供共享存储。\n\n### 云身份验证\n\n为了能够限制用户消耗云资源，并可能对该用途进行跟踪和更改，你需要身份验证机制。对于使用云功能的人以及允许管理云功能的人来说，身份验证都是必要的。\n\
  \n云平台项目有时允许你连接集中的身份验证机制来验证和授权云用户。这些包括 Kerberos、Microsoft Active Directory 等。在 Linux\
  \ 中，身份、策略和审计 (IPA) 软件（参见 [`www.freeipa.org`](http://www.freeipa.org)）提供了一套可用于企业云平台的完整身份验证功能。\n\
  \n### 云部署与配置\n\n如果你正在管理大型云基础设施，你不希望在每次想向网络中添加虚拟机监控程序或其他节点时，都要走到每台机器并点击图形化安装。今天，许多工具只需通过重启电脑并使其启动到预配置的安装程序，即可部署和配置\
  \ Linux 系统。\n\n在第 9 章中，我将介绍如何使用 PXE 服务器（通过你的网卡在网络上自动启动 Linux 安装程序）和 kickstart 文件（用于识别完成安装所需的所有答案）。在完成这些设置后，你只需从网络接口启动计算机，稍过一段时间回来就会发现一个已完全安装的\
  \ Linux 系统。\n\n计算机部署后，可以使用 Puppet（[`http://puppetlabs.com`](http://puppetlabs.com)）和\
  \ Chef（[`www.chef.io`](http://www.chef.io)）等工具对系统进行配置并可能进行监控和更新。可以使用 Vagrant（[`www.vagrantup.com`](http://www.vagrantup.com)）在虚拟机中部署整个工作环境。Ansible（[`www.ansible.com`](http://www.ansible.com)）是另一种自动化\
  \ IT 基础设施及其运行应用程序的工具。\n\n### 云平台\n\n如果你想在组织内部实现自己的私有云，开源的 OpenStack 项目可能是最流行的选择。它在配置和使用方面提供了巨大的灵活性威力。\n\
  \n红帽企业虚拟化（RHEV）是另一个流行的云平台。RHEV 让你能够从简单的 RHEV Manager 和一个或两个虚拟机监控程序开始，通过添加更多虚拟机监控程序、存储池和其他功能不断增长。\n\
  \n如果你想使用基于开源技术的公共云来运行你所需的操作系统，可以使用任何几个不同的云供应商。你可以运行 Linux 虚拟机的公共云供应商包括 Amazon Web\
  \ Services（[`www.amazon.com/aws`](http://www.amazon.com/aws)）、Google Cloud Platform（[`https://cloud.google.com`](https://cloud.google.com)）和\
  \ Rackspace（[`www.rackspace.com`](http://www.rackspace.com)）。第 27 章涵盖了如何向其中一些云供应商部署\
  \ Linux。\n\n现在你已经了解了构成 Linux 云计算的许多技术，可以在下一节通过建立你自己的微云，初步体验 Linux 云的一些基础技术。\n\n\
  ## 尝试基础云技术\n\n为了帮助你从零理解云技术，本节将说明现代云基础设施的一些基本构建模块。通过使用三台计算机，我将帮助你创建一个包含以下内容的设置：\n\
  \n*   **虚拟机监控程序 (Hypervisors)**——虚拟机监控程序是一种允许你在其上运行其他计算机系统的系统。那些其他系统被称为 `virtual\
  \ machines`。云基础设施可能有几十个或数百个虚拟机监控程序在运行，并可能运行着数千个虚拟机。\n*   **虚拟机 (Virtual machines)**——你在\
  \ Linux 虚拟机监控程序上运行的虚拟机可以是相同类型的 Linux 系统、不同的 Linux 系统、Windows 系统或任何与虚拟机监控程序运行硬件兼容的其它类型系统。因此，在我们在此构建的虚拟机监控程序上运行的虚拟机可能包括\
  \ Fedora、Ubuntu、RHEL、CentOS、Microsoft Windows 等。\n*   **共享存储 (Shared storage)**——为了提供最大的灵活性，虚拟机监控程序提供虚拟机的存储通常在虚拟机监控程序池之间共享。这允许一组虚拟机监控程序共享一组它们用于安装或启动虚拟机的镜像。它还允许同一组虚拟机运行在该组的任何一个虚拟机监控程序上，甚至在不关闭虚拟机的情况下移动到另一个虚拟机监控程序上。如果虚拟机监控程序过载或需要关机维护，移动运行中的虚拟机将非常有用。\n\
  \n我们在在此过程中过程中构建的设置允许你通过以下方式与虚拟机协作：\n\n*   在虚拟机监控程序上安装新的虚拟机\n*   在你的虚拟机上设置功能\n* \
  \  登录并使用运行在虚拟机监控程序上的虚拟机\n\n\n\n\n\n# 将运行中的虚拟机迁移到另一个虚拟机监控程序\n\n我们在这里探索的技术包括：\n\n\
  * `内核虚拟化模块 (KVM)`——KVM 是基础内核技术，允许虚拟机与 Linux 内核进行交互。\n* `QEMU 处理器模拟器`——系统上每个活跃的虚拟机都运行一个\
  \ `qemu` 进程。QEMU 提供的功能使得每台虚拟机看起来都像是运行在物理硬件上。\n* `Libvirt 服务守护进程 (`libvirtd`)`——每个虚拟机监控程序上运行着一个\
  \ `libvirtd` 服务。`libvirtd` 守护进程监听启动、停止、暂停以及其他管理虚拟机监控程序上的请求。这些请求可能来自用于管理虚拟机的应用程序（如\
  \ `virt-manager` 或 OpenStack Dashboard），也可能来自你创建的直接与 `libvirt` 接口通信的应用程序。\n* `虚拟机管理器`——虚拟机管理器（`virt-manager`\
  \ 命令）是一个用于管理虚拟机的 GUI 工具。除了允许你请求启动和停止虚拟机外，`virt-manager` 还允许你以不同的方式安装、配置和管理虚拟机。你可以使用\
  \ `virsh` 命令将选项传递给命令行来操作虚拟机，而不是在 GUI 窗口中点击。\n* `虚拟机查看器`——`virt-viewer` 命令在你的桌面上启动一个虚拟机控制台窗口。出现的窗口允许你从控制台窗口工作到所选虚拟机的桌面或命令行界面（这取决于该虚拟机提供什么功能）。\n\
  \n在构建完这个微型的类云基础设施后，你就拥有了有时被称为平台即服务（或 PaaS）云的基础。这意味着使用你 PaaS 的人可以将他们自己的操作系统、应用程序、配置文件和数据打包在一起并部署。他们将依靠你的\
  \ PaaS 提供运行包含其应用程序的虚拟机所需的计算能力、存储、内存、网络接口和管理功能。\n\nPaaS 的示例包括 OpenStack 和红帽企业虚拟化\
  \ (RHEV)。这些项目提供了一种更精细的访问 PaaS 资源的方法。然而，我们的微型 PaaS 也能获得类似的结果。\n\n## 构建小型云\n\n通过在网络上连接三台物理机器，你可以阐明构建自己的私有云时需要理解的一些基本概念。这三台运行\
  \ Fedora 21 的计算机以及连接它们的网络配置如下：\n\n* `网络`——建立了一个高速有线网络来连接这三台计算机。快速的网络连接对于虚拟机迁移至关重要。在示例中，每个虚拟机监控程序还配置了网络网桥，以便每台虚拟机可以直接从网络上的\
  \ DHCP 服务获取 IP 地址。\n* `虚拟机监控程序`——三台计算机中的两台被配置为虚拟机监控程序。虚拟机监控程序（有时称为主机或计算节点）允许你运行虚拟机。在\
  \ Fedora 21 中，基础虚拟机监控程序技术被称为基于内核的虚拟机 (KVM)，而实际虚拟机由 `libvirtd` 服务管理。\n* `存储`——其中一台计算机配置为在两个虚拟机监控程序之间提供共享存储。为了简单起见，使用了\
  \ NFS 创建共享存储，尽管在生产环境中 iSCSI 或光纤通道（Fibre Channel）是更好的解决方案。\n\n### 配置虚拟机监控程序\n\n在此过程中，我在两台物理计算机上安装了\
  \ Fedora 21，并将它们配置为运行 `libvirtd` 服务的 KVM 主机。按照以下步骤自己完成这些操作。\n\n#### 步骤 1：获取 Linux\
  \ 软件\n\n前往 Get Fedora 页面 ([`getfedora.org`](https://getfedora.org)) 并下载 Fedora 21。我选择了下载\
  \ Fedora 21 64 位工作站版 DVD ISO。如果可用更高版本的 Fedora，你可能可以使用它。\n\n使用任何可用的 DVD 刻录程序将镜像刻录到\
  \ DVD，或通过其他方式使镜像可用安装（例如通过 PXE 启动）。\n\n#### 步骤 2：检查你的计算机在在 Fedora 21 中用虚拟机监控程序的计算机需要满足几项要求。在开始安装之前，你应该在计算机上检查这些内容：\n\
  \n* `支持虚拟化`——你可以通过查看 CPU 设置的标志位来检查虚拟化支持。\n* `内存`——计算机必须有足够的 RAM 不仅运行主机操作系统，还要满足你在系统上运行的每个虚拟机。\n\
  * `处理能力`——记住，每个虚拟机都会为自身以及内部运行的任何应用程序消耗处理能力。\n\n存储是另一个考虑因素。但由于我们打算从网络上的独立节点配置存储，因此我们稍后处理这个问题。\n\
  \n要检查计算机的可用功能是否满足要求，请启动 Linux Live CD 或 DVD，打开终端窗口并输入以下命令：\n\n```bash\n# cat /proc/cpuinfo\
  \ | grep --color -E \"vmx|svm|lm\"\nflags  : fpu vme de pse tsc msr pae mce cx8\
  \ apic sep mtrr pge mca\n   cmov pat pse36 clflush dts acpi mmx fxsr sse sse2 ss\
  \ ht tm pbe\n   syscall nx pdpe1gb rdtscp lm constant_tsc arch_perfmon pebs bts\n\
  \   rep_good xtopology nonstop_tsc aperfmperf pni pclmulqdq dtes64\n   monitor ds_cpl\
  \ vmx smx es...\n...\n```\n\n上一条命令显示这台计算机是 64 位计算机 (`lm`)，且 Intel 芯片支持虚拟化功能 (`vmx`)。如果\
  \ CPU 是 AMD 芯片，你看到的不是 `vmx` 而是高亮的 `svm`（如果该 AMD 芯片支持虚拟化）。这些设置显示这台计算机可以用虚拟机监控程序。\n\
  \n当你在主机上运行虚拟机时，内存通常是瓶颈。对于内存需求，你必须将主机所需的内存加到每个虚拟机所需的内存需求上。你可以通过不安装桌面软件来降低内存需求，大多数虚拟机监控程序都是这样做的。但在这种情况下，我安装了\
  \ Fedora 工作站版，它带有桌面。要检查计算机上的内存和交换分区（swap），我输入了以下命令：\n\n```bash\n# free -m\n    \
  \     total    used     free   shared  buff/cache   available\nMem:      7867  \
  \  3433     2835      298        1598        3860\nSwap:    12287       0    12287\n\
  ```\n\n该系统有约 8GB 内存和 12GB Swap。我估计 4GB 对于桌面系统是足够的。如果我允许每个虚拟机使用 1GB 或 2GB，该系统应该能够带桌面运行二到四个虚拟机。检查计划运行的操作系统和应用程序的内存需求，以更好地确定你的内存需求。\n\
  \n要检查计算机上处理器的数量和类型，请输入：\n\n```bash\n# grep processor /proc/cpuinfo\nprocessor :\
  \ 0\n...\nprocessor : 6\nprocessor : 7\n# head /proc/cpuinfo\nprocessor  : 0\nvendor_id\
  \  : GenuineIntel\ncpu family : 6\nmodel      : 60\nmodel name : Intel(R) Core(TM)\
  \ i7-4800MQ CPU @ 2.70GHz\nstepping   : 3\ncpu MHz    : 2701.000\ncache size : 6144\
  \ KB\n...\n```\n\n上述代码中的第一条命令显示计算机上有八个（0 到 7）处理器。通过第二条命令，对于第一个处理器，你可以看到它是 GenuineIntel、型号、型号名称、CPU\
  \ 速度和其他信息。\n\n要在两个虚拟机监控程序之间进行实时虚拟机迁移，CPU 必须属于同一家族。如果它们没有兼容的 CPU，你可以通过在一个虚拟机监控程序上关闭虚拟机并从另一个的共享存储上启动它来迁移虚拟机。\n\
  \n在你评估了两台虚拟机监控程序计算机后，开始在它们上安装 Fedora。\n\n#### 步骤 3：在虚拟机监控程序上安装 Linux\n\n使用 Fedora\
  \ 21 工作站安装媒体，开始安装两个虚拟机监控程序。参考第 9 章中的描述来安装 Fedora。你需要了解此过程中特定的安装内容：\n\n\n\n\n\n*\
  \   **命名虚拟机主机**——我将虚拟机主机的主机名设置为 [`host1.example.com`](http://host1.example.com)\
  \ 和 [`host2.example.com`](http://host2.example.com)。\n\n*   **分区**——在分区时，我删除了整个硬盘。然后，我创建了一个\
  \ 500MB 的 `/boot` 分区和一个 12GB 的交换分区，并将剩余的磁盘空间分配给根分区（/`）。`/var/lib/libvirt/images`\
  \ 目录存储了系统上的大部分数据，但这是一个共享目录，可以从网络上的另一个系统访问并在两个虚拟机主机之间共享。（稍后会详细介绍这一点。）\n\n*   **网络配置**——如果有选项，请为每个虚拟机主机开启有线网络接口。虚拟机主机和存储设备应该在同一个局域网内，因为这些机器之间的网络连接速度对于获得良好的性能至关重要。\n\
  \n*   **软件包**——在安装期间，我只安装了默认的 Fedora Workstation 软件包。安装完成并重启系统后，我为每个虚拟机主机安装了更多软件。\n\
  \n安装完成后重启电脑（弹出 DVD 并从硬盘启动）。系统重启后，按照如下步骤更新 Fedora 软件、添加新软件包并重启系统：\n\n```bash\n# yum\
  \ update -y\n# yum install virt-manager libvirt-daemon-config-network\n# reboot\n\
  ```\n\n`virt-manager` 软件包包含了用于管理虚拟机的 GUI 工具。`libvirt-daemon-config-network` 软件包创建了默认网络接口，允许虚拟机通过网络地址转换（NAT）通过宿主机访问外部网络。分配给虚拟机的默认地址范围是\
  \ `192.168.122.2` 到 `192.168.122.254`。\n\n你可能需要的其他软件包应该已经包含在 Fedora Workstation\
  \ 的安装中了。如果你使用了不同的安装类型，请确保也添加了以下软件包：`libvirt-client`（用于 `virsh` 命令）和 `libvirt-daemon`（用于获取\
  \ `libvirtd` 服务）。\n\n### 第 4 步：在虚拟机主机上启动服务\n\n你需要确保 `libvirtd` 服务在两个虚拟机主机上都在运行。同时也启动\
  \ `sshd` 服务。它们可能已经在运行，但为了确保起见，请在两个虚拟机主机上以 root 执行以下操作：\n\n```bash\n# systemctl start\
  \ sshd.service\n# systemctl enable sshd.service\n# systemctl start libvirtd.service\n\
  # systemctl enable libvirtd.service\n```\n\n`sshd` 服务允许你在必要时通过网络登录虚拟机主机。`libvirtd`\
  \ 服务是你可能不太熟悉的那个。它负责监听对每个主机上管理你虚拟机的请求。\n\n### 第 5 步：编辑 /etc/hosts 或设置 DNS\n\n为了方便虚拟机主机与存储系统之间的通信，你应该为每个系统分配主机名，并将这些名称映射到\
  \ IP 地址。设置一个所有系统都指向的 DNS 服务器可能是最好的方法。但是，对于我们的简单示例，你只需要编辑每个系统上的 `/etc/hosts` 文件，并为每个主机添加条目即可。\n\
  \n以下是在此过程中使用的三个系统在 `/etc/hosts` 文件中可能包含的额外条目示例：\n\n```\n192.168.0.138  host1.example.com\
  \ host1\n192.168.0.139  host2.example.com host2\n192.168.0.1    storage.example.com\
  \ storage\n```\n\n接下来，你需要配置存储。\n\n### 配置存储\n\n在此过程中，你可以通过许多方式为虚拟机主机提供网络化存储。我选择在与虚拟机主机相同的局域网内设置一个独立的\
  \ Fedora 系统，并使用 NFS 将共享存储挂载到两个虚拟机主机上。\n\nNFS 不是虚拟机主机之间共享存储最高效的方法，但它是最简单、最常用的方法之一。在此过程中，我使用虚拟机管理器窗口（`virt-manager`）来配置\
  \ NFS 存储池。\n\n为了一致，从存储系统设置的 NFS 共享是 `/var/lib/libvirt/images` 目录。它挂载在每个虚拟机主机的相同位置。（为了测试，如果你只有两台机器，可以从其中一个虚拟机主机配置存储。但请记住，这意味着你不能在不关闭所有虚拟机的情况下关闭该虚拟机主机。）\n\
  \n#### 第 1 步：安装 Linux 软件\n\n要在 NFS 服务器上设置存储，你可以使用几乎任何可用 NFS 服务的 Linux 系统。安装 Linux\
  \ 时，请考虑以下因素：\n\n*   **磁盘空间**——确保包含共享目录的分区有足够的可用存储空间。在本示例中，`/var/lib/libvirt/images`\
  \ 是共享目录。\n*   **性能**——为了获得最佳性能，你希望磁盘具有快速的访问时间和数据传输率。\n\n对于 Fedora 和 RHEL，NFS 服务器软件可以通过\
  \ `nfs-utils` 软件包获得。对于 Ubuntu，你需要 `nfs-kernel-server` 软件包。\n\n初始安装完成后，检查是否安装了 NFS\
  \ 服务器软件。如果没有，你可以通过此命令在 Fedora 或 RHEL 上安装它：\n\n```bash\n# yum install nfs-utils\n\
  ```\n\n对于 Ubuntu 和类似的系统，输入以下内容：\n\n```bash\n# apt-get install nfs-kernel-server\n\
  ```\n\n#### 第 2 步：配置 NFS 共享\n\n要创建 NFS 共享，你需要识别要共享的目录并将其相关信息添加到 `/etc/exports` 文件中。按照以下步骤操作：\n\
  \n1.  **创建目录**。你可以共享任何包含你想要共享空间的目录。考虑创建一个新目录并将整个硬盘或分区挂载到上面。在本示例中，我创建了一个名为 `/var/storage`\
  \ 的目录：\n\n```bash\n# mkdir -p /var/storage\n```\n\n2.  **允许导出**。在你的存储系统上，在 `/etc/exports`\
  \ 文件中创建一个条目，向指定的系统（通过名称或 IP 地址）共享该目录。在本示例中，我允许 192.168.0 子网络上的所有系统具有读写权限（`rw`）：\n\
  \n```\n/var/storage 192.168.0.*(no_root_squash,rw,sync)\n```\n\n#### 第 3 步：启动 NFS\
  \ 服务\n\n启动 NFS 服务并打开存储系统上的防火墙以允许该服务。方法如下：\n\n1.  **启动并启用 NFS**。在最新的 Fedora 和 RHEL\
  \ 系统上，输入以下命令启动 NFS 服务器：\n\n```bash\n# systemctl start nfs-server.service\n# systemctl\
  \ enable nfs-server.service\n```\n\n在 RHEL 6、旧版 Fedora 和某些 Ubuntu 系统上，使用这些命令启动并启用\
  \ NFS 服务：\n\n```bash\n# service nfs start\n# chkconfig nfs on\n```\n\n2.  **打开防火墙**。为了让本地系统之外可以使用你的\
  \ NFS 共享，在 Fedora 21 上执行以下操作：\n\n```bash\n# firewall-cmd --permanent --add-service=rpc-bind\n\
  # firewall-cmd --permanent --add-service=nfs\n# systemctl restart firewalld\n```\n\
  \n对于直接使用 `iptables` 的系统，请参考第 20 章有关如何为 NFS 服务打开防火墙的信息。\n\n#### 第 4 步：在虚拟机主机上挂载 NFS\
  \ 共享\n\n登录每个虚拟机主机并按照以下步骤使共享本地可用。注意，每个主机上的挂载点位置必须相同。方法如下：\n\n1.  **检查 NFS 共享可用性**。从两个虚拟机主机中的每一个，输入以下命令确保你可以看到可用共享：\n\
  \n```bash\n# showmount -e storage.example.com\nExport list for storage.example.com:\n\
  /var/storage 192.168.0.*\n```\n\n2.  **挂载 NFS 共享**。将共享信息添加到 `/etc/fstab` 文件中。在本示例中，为了在每次系统启动时都将来自\
  \ 192.168.0.1 系统的目录挂载到本地相同目录，`/etc/fstab` 文件中的条目如下：\n\n```\nstorage.example.com:/storage\
  \ /var/lib/libvirt/images nfs defaults 0 0\n```\n\n\n\n\n\n### 3. 测试 NFS 挂载。要检查挂载项是否正确，请运行以下命令挂载\
  \ `/etc/fstab` 文件中所有尚未挂载的项，并检查 NFS 共享是否已挂载：\n\n```\n# mount -a\n# mount | grep libvirt\n\
  storage.example.com:/var/storage on /var/lib/libvirt/images type\nnfs4\n(rw,relatime,vers=4.0,rsize=1048576,wsize=1048576,namlen=255,hard,\n\
  proto=tcp,port=0,timeo=600,retrans=2,sec=sys,\nclientaddr=192.168.0.1,local_lock=none,addr=192.168.0.138)\n\
  ```\n\n现在你的宿主机程序和存储已经就绪，你现在可以开始创建虚拟机了。\n\n### 创建虚拟机\n\n虚拟机管理器（`virt-manager`）是创建第一台虚拟机的良好工具。它会引导你完成虚拟机的安装和设置，并提供查看和更改现有虚拟机状态的方法。\n\
  \n稍后，当你理解了创建虚拟机涉及各种功能后，你可以使用 `virt-install` 命令来创建虚拟机。`virt-install` 的优势在于你可以通过脚本化或轻松地复制粘贴命令行来创建虚拟机，而无需反复点击\
  \ GUI 窗口。\n\n你在本章的早些部分下载了 Fedora 21 Workstation ISO 镜像，因此我将在创建虚拟机的示例中使用它。不过，如果你愿意，你也可以安装许多不同版本的\
  \ Linux 或 Windows 作为你的虚拟机。\n\n#### 步骤 1：获取制作虚拟机的镜像\n\n你可以通过多种方式创建虚拟机。通常情况下，你从一个预构建的镜像（基本上是运行中的虚拟机的副本）或直接从安装\
  \ ISO 镜像到新的存储区域。在这里，我们将采用后者，从 Fedora 21 Workstation 安装 ISO 镜像创建一个虚拟机。\n\n假设你已以 root\
  \ 登录其中一个宿主机，且 ISO 镜像位于当前目录，将 ISO 拷贝到 `virt-manager` 用于存储的默认目录（`/var/lib/libvirt/images`）：\n\
  \n```\n# cp Fedora-Live-Workstation-x86_64-21-5.iso /var/lib/libvirt/images/\n```\n\
  \n由于该目录被两个宿主机共享，你可以去任一台宿主机使用该镜像。\n\n#### 步骤 2：检查网络桥接\n\n在每个宿主机上，都应该有一个默认的网络桥接名称\
  \ `virbr0`。所有宿主机都将添加到此网络接口并自动分配 IP 地址。默认情况下，宿主机使用 `192.168.122.2` 到 `192.168.122.254`\
  \ 的地址范围分配给虚拟机。通过网络地址转换（NAT），宿主机可以将来自使用这些私有地址的数据包路由到外部网络接口。\n\n在每个宿主机上执行以下操作以检查其桥接情况：\n\
  \n```\n# brctl show virbr0\nbridge name  bridge id            STP enabled  interfaces\n\
  virbr0      8000.001aa0d7483e    yes           vnet0\n# ip addr show virbr0\n5:\
  \ virbr0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue\n        state\
  \ UP group default\n   link/ether fe:54:00:57:71:67 brd ff:ff:ff:ff:ff:ff\n   inet\
  \ 192.168.122.1 brd 192.168.122.255 scope global dynamic virbr0\n```\n\n#### 步骤\
  \ 3：启动虚拟机管理器 (virt-manager)\n\n在任一宿主机的桌面上执行以下操作以打开虚拟机管理器并连接到宿主机：\n\n1. **启动** `virt-manager`。进入活动（Activities）屏幕，在搜索框中输入\
  \ **Virtual Machine Manager** 并回车，或在 shell 中输入 `virt-manager`。提示时输入 root 密码。你应该看到虚拟机管理器窗口。\n\
  \n2. **检查与宿主机的连接。** 在添加连接（Add Connection）弹出窗口，宿主机（QEMU/KVM）应该已经设置好且自动连接（Autoconnect）复选框已勾选。如果尚未完成，点击连接（Connect）以连接到本地宿主机。\n\
  \n#### 步骤 4：检查连接详情\n\n连接到宿主机后，设置一些连接详情。在虚拟机管理器窗口中执行以下操作：\n\n1. **查看连接详情。** 选择编辑\
  \ ![arr](img/00017.jpeg) 连接详情（Connection Details）显示连接详情窗口。选择概览（Overview）、虚拟网络（Virtual\
  \ Networks）、存储（Storage）和网络接口（Network Interfaces）选项卡，熟悉你宿主机的连接信息。例如，存储选项卡出现在图 26.1\n\
  \n**图 26.1** 启动虚拟机管理器并检查连接详情。\n\n#### 步骤 5：创建一个新虚拟机\n\n要在虚拟机管理器窗口中创建一个新虚拟机，执行以下操作：\n\
  \n1. **启动向导。** 要启动创建新虚拟机向导，选择文件 ![arr](img/00017.jpeg) 新虚拟机（New Virtual Machine）。出现创建新虚拟机窗口。\n\
  \n2. **选择安装方法。** 将提供四种创建虚拟机的方法。前三种是识别安装介质位置的方法。第四种允许你导入现有磁盘镜像。对于我们的示例，选择第一个选项（本地安装介质）并点击下一步。\n\
  \n3. **选择 ISO。** 选择使用 ISO 镜像（Use ISO Image）按钮并点击浏览（Browse）。在弹出的窗口中，选择或浏览到 Fedora\
  \ 21 Workstation ISO，选择选择卷（Choose Volume），并点击下一步继续。\n\n4. **选择内存和 CPU。** 为虚拟机选择可用\
  \ RAM 容量和处理器数量，并点击下一步。我建议至少使用 1024MB RAM 和至少一个处理器。如果可用，使用 2048MB RAM 更好。\n\n5. **启用存储。**\
  \ 选择你想让虚拟机消耗的磁盘空间。对于 Fedora Workstation，我建议至少 10GB，但可能更少也可以。创建的 `qcow2` 镜像会增长到你实际消耗的大小（最高达到分配量），因此在实际尝试使用该空间之前，过度分配空间没有问题。点击下一步。\n\
  \n6. **在安装开始前检查设置。** 为虚拟机命名，并检查你安装的其他设置。点击高级选项（Advanced Options），并确保选中了 `bridge0`\
  \ 项。选择在安装前自定义配置（Customize Configuration Before Install）以进一步检查设置。目前让其他设置保持默认值，并点击完成。\n\
  \n7. **检查硬件设置。** 如果你在上一个屏幕上选择了“自定义”，则可以更详细地检查设置。满意后，选择开始安装（Begin Installation）。\n\
  \n8. **安装虚拟机。** 系统将提示你安装，就像你直接安装到硬件上一样。完成安装并重启虚拟机。如果虚拟机窗口没有打开，双击 `virt-manager`\
  \ 窗口中的虚拟机项（在此例中为 fedora21）并登录。图 26.2 显示了带有 Fedora 21 Workstation 虚拟机的 `virt-manager`\
  \ 窗口示例。\n\n![image](img/00075.jpeg)\n\n**图 26.2** 打开虚拟机并开始使用。\n\n### 管理虚拟机\n\n在宿主机上安装一个或多个虚拟机后，你可以以与直接安装在硬件上的计算机系统相似的方式管理每台虚拟机。你可以执行这些操作：\n\
  \n\n\n\n\n- **从控制台查看系统。** 在 `virt-manager` 窗口中双击正在运行的虚拟机。这将打开一个虚拟机的控制台窗口，允许你像从物理控制台访问直接安装在硬件上的操作系统一样使用虚拟机。\n\
  - **关闭虚拟机。** 右键点击虚拟机条目，并选择 `Shut down`。然后选择 `Shut down`（正常关机）或 `Force off`（相当于拔掉电源）。或者你可以选择\
  \ `Reboot`。\n- **启动虚拟机。** 如果虚拟机当前处于关闭状态，右键点击该条目并选择 `Run` 来启动虚拟机。\n- **删除虚拟机。** 如果你已完全不再需要该虚拟机，选择\
  \ `Delete`。系统会询问你是否也删除存储器。如果你想保留与虚拟机关联的存储，请取消勾选该框。\n\n现在你已经熟练掌握了使用虚拟机，可以尝试将虚拟机迁移到另一个虚拟机程序了。\n\
  \n## 迁移虚拟机\n\n能够在不同的虚拟机程序之间迁移虚拟机，可以为你管理计算机工作负载提供极大的灵活性。以下是一些优势：\n\n- **提高性能**：将虚拟机从负载过载的虚拟机程序移动到具有更多可用内存和\
  \ CPU 容量的程序。\n- **进行常规维护**：在保持虚拟机运行的同时对虚拟机程序进行维护。\n- **将虚拟机从利用率低的虚拟机程序中移出**：这样你可以将其关闭以节省能源，直到再次需要。\n\
  - **异地迁移虚拟机**：如果你预计要关闭数据中心，或者预计飓风或其他灾难袭击你的数据中心。\n\n如果你需要虚拟机的工作在不中断的情况下继续进行，那么热迁移尤为有价值。实现虚拟机热迁移的关键在于正确配置环境。请确保以下条件到位：\n\
  \n- 虚拟机程序之间共享网络存储\n- 每个虚拟机程序上配置了相同的网络接口\n- 虚拟机程序之间的 CPU 兼容（通常，一组虚拟机程序具有完全相同的硬件。）\n\
  - 虚拟机程序与存储之间有快速的网络连接\n- 虚拟机程序上运行相同或相似版本的虚拟化软件（在案例中，我们在双方都使用了 Fedora 21 并以类似的方式进行了安装。）\n\
  \n在完成所有准备后，热迁移只需要几步即可开始。\n\n### 步骤 1：识别其他虚拟机程序\n\n假设虚拟机管理器窗口仍在其中一个虚拟机程序上打开并运行，转到该窗口并执行以下操作以连接到另一个虚拟机程序：\n\
  \n1. **连接到虚拟机程序。** 选择 `File` ![arr](img/00017.jpeg) `Add Connection`。会出现 `Add Connection`\
  \ 窗口。\n2. **添加连接。** 勾选 `Connect to Remote Host` 框，选择 `SSH` 作为 `Method`，使用用户名 `root`，并输入另一个虚拟机程序的主机（例如[`host1.example.com`](http://host1.example.com)）。当你点击\
  \ Connect 时，可能会提示输入远程虚拟机 root 用户的密码和其他信息。\n\n虚拟机管理器窗口上会出现一个新的虚拟机程序条目。\n\n### 步骤\
  \ 2：将运行中的虚拟机迁移到另一个虚拟机程序\n\n右键点击任何正在运行的虚拟机，并选择 `Migrate`。出现 `Migrate the Virtual\
  \ Machine` 窗口，如图 26.3 所示。\n\n![image](img/00076.jpeg)\n\n**图 26.3**](#part0033_split_004.html_c26-fig-anc-0003)\
  \ 选择将虚拟机迁移到哪个虚拟机程序。\n\n选择新主机。在我的示例中，虚拟机当前运行在 `host2` 上，因此我想选择 `host1` 作为新主机。等待一段时间让虚拟机的内存镜像复制到另一个主机后，虚拟机应该会显示在该主机上运行。\n\
  \n如果由于某些原因你的迁移失败了（CPU 不兼容或其他问题），你始终可以在一个主机上关闭虚拟机并在另一个主机上重新启动它。这样做只需要你的共享存储到位。在第二个主机上，只需运行\
  \ `Create a new virtual machine` 向导，但选择运行现有镜像而不是安装 ISO。\n\n我刚才向你展示的虚拟机程序配置可能非常适合你的家庭工作站，即使是小型企业。虽然帮助你开发整个云计算平台超出了本书书的范畴，但帮助你使用不同的云平台来运行你的\
  \ Linux 系统是我们的职责范围。下一章将帮助你实现这一点。\n\n## 总结\n\nLinux 是当今大多数新兴云技术构建的基础。本章描述了构建基于 Linux\
  \ 和其他开源技术的云所涉及的许多基本组件。然后，它将通过设置几个虚拟机程序并启动虚拟机来帮助你了解其中一些基础技术。\n\n## 练习\n\n本节中的练习描述了与设置虚拟机程序（KVM\
  \ 主机计算机）以及使用它运行虚拟机相关的任务。如果你卡住了，附录 B 中显示了任务的解决方案。请记住，附录 B 中显示的解决方案通常是完成任务的多种方法之一。\n\
  \n虽然本章中显示的设置虚拟机程序的示例使用了三台物理机器，但这些练习可以在单台物理机器上完成。\n\n1. 检查你的电脑查看它是否支持 KVM 虚拟化。\n\
  2. 安装 Linux 系统以及用作 KVM 主机和运行虚拟机管理器应用程序所需的包。\n3. 确保 `sshd` 和 `libvirtd` 服务在系统上运行。\n\
  4. 获取一个与你的虚拟机程序兼容的 Linux 安装 ISO 镜像，并将其复制到虚拟机管理器用于存储镜像的默认目录。\n5. 检查默认网络桥接 (`virbr0`)\
  \ 当前是否处于激活状态。\n6. 使用你之前复制的 ISO 镜像安装虚拟机。\n7. 确保你可以登录并使用虚拟机。\n8. 检查你的虚拟机是否可以连接到虚拟机程序之外或其他网络。\n\
  9. 停止虚拟机使其不再运行。\n10. 再次启动虚拟机使其运行并可用。\n\n# 第 27 章\n\n## 将 Linux 部署到云端\n\n为了获取一个新的\
  \ Linux 系统使用，而不是仅仅从物理 DVD 运行标准安装程序，你可以获取 Linux 镜像并将其部署到云端。一种方法是获取一个通用的 Linux 镜像（可启动但未配置的镜像），并提供配置信息以根据你的需求配置该镜像。另一种方法是访问云提供商，选择一个镜像，点击选项进行配置，并启动它。\n\
  \n重点在于，云计算正在提供启动和使用 Linux 系统的新方法。在第 26 章 中，我让你执行了标准的 Linux 安装，以创建一个运行在 Linux 虚拟机程序上的虚拟机。在本章中，我将向你展示如何使用云镜像启动全新的\
  \ Linux 系统。\n\n首先，我将描述如何使用 `cloud-init` 手动将 Linux 云镜像与配置信息相结合，使其能够在各种环境中运行。接下来，我将告诉你在\
  \ OpenStack 云或 Amazon 弹性计算云 (EC2) 上如何进行类似的过程，通过点击易于使用的云控制器来选择镜像和设置，以运行你所需的 Linux\
  \ 云实例。\n\n## 在云中运行 Linux\n\n云平台对于快速高效地启动新的虚拟机来说非常出色。它们能够做到这一点，是因为每次当你需要一个新的操作系统实例时，都不需要重新安装。\n\
  \n\n\n\n\n公有云（例如 Amazon EC2（[`http://aws.amazon.com/ec2`](http://aws.amazon.com/ec2)））提供了不同\
  \ Linux 发行版的实例供你启动和使用。你可以选择一个 Linux 实例，例如 Ubuntu、红帽企业 Linux (RHEL) 或 SUSE Linux\
  \ 企业版服务器 (SLES)，这些实例针对特定目的进行了调优。例如，某些实例专门针对高性能处理或内存密集型应用程序进行了优化。\n\n云实例的内容本质上通常是通用的。预计云用户或云提供商会使用\
  \ `cloud-init` 等服务在镜像中附加更多信息。这些信息分为两个大类：元数据（meta-data）和用户数据（user-data）：\n\n*   `meta-data`——元数据包含了镜像启动之前所需的信息。这些数据是镜像内容之外的，通常由云提供商管理。其中部分数据源于：存储、内存和处理能力等资源是从资源池调取的，而不是来自你正在安装的物理机器。因此，元数据告诉云提供商在启动实例的早期阶段分配多少此类资源（以及可能的其他资源）。\n\
  *   `user-data`——用户数据信息被插入到镜像上存在的操作系统中。这些数据是由使用虚拟机的人提供的。这可能包括用户账户和密码、配置文件、首次启动时运行的命令、软件仓库的标识，或者你可能想在操作系统内部运行或更改的任何内容。\n\
  \n当你要在云环境中运行 Linux 实例时，通常通过从基于 Web 的云控制器（如 OpenStack 面板或红帽企业虚拟化管理器）点击勾选框并填写表单来输入元数据和用户数据信息。当你通过云控制器配置实例时，这些信息可能不会被明确标识为元数据用户数据。\n\
  \n你运行 Linux 虚拟机时使用的云可以是公有云、私有云或混合云。你选择的云类型取决于你的需求和预算：\n\n*   `Public cloud`——Amazon\
  \ EC2 和 Google Compute Engine 是云平台的示例，允许你从基于 Web 的界面启动并使用 Linux 虚拟机。你为实例运行的时间付费。运行服务所使用的内存、存储和虚拟\
  \ CPU 数量也会计入成本。公有云的优势在于，你不需要购买和维护自己的云基础设施。\n*   `Private cloud`——通过私有云，你部署自己的计算基础设施（虚拟化程序、控制器、存储、网络配置等）。建立自己的私有云意味着要承担更多的前期成本来拥有和维护基础设施。但它为你的计算资源提供了额外的安全性和控制权。因为你控制了基础设施，你可以在自己的\
  \ OpenStack 基础设施中创建用户可以访问的镜像，并以自己的方式对用户对该基础设施的使用进行管理。\n*   `Hybrid cloud`——许多公司正转向混合云解决方案。混合云允许由一个中心设施管理多个云平台。例如，Red\
  \ Hat CloudForms 可以在 OpenStack、VMware vSphere 和红帽企业虚拟化平台上部署和管理虚拟机，将不同类型的工作负载配置到适当的环境中。在需求高峰时期，CloudForms\
  \ 还可以引导虚拟机在 Amazon EC2 云上运行。\n\n这些云环境有不同的方式来备备和配置虚拟机。然而，云在虚拟机管理方面需要提供的功能是相似的。了解这些功能可以帮助你在配置运行在云中的\
  \ Linux 系统时如得得手。\n\n为了更好地了解如何配置 Linux 云实例，下一节将描述 `cloud-init` 如何工作以配置 Linux 云实例。随后，它将帮助你创建自己的元数据和用户数据文件，并将其应用于你的云实例，以便在云镜像启动时可以使用这些信息。\n\
  \n## 为云创建 Linux 镜像\n\n回想你在第 9 章中安装 Linux 系统时做了什么。在手动安装过程中，你设置了 root 密码，创建了普通用户账户和密码，可能定义了网络接口，并执行了其他任务。你输入的信息成为了操作系统的永久部分，每次启动系统时都会存在。\n\
  \n当你从预构建的云镜像作为 Linux 系统开始时，可以使用 `cloud-init` 让 Linux 系统准备就绪运行。`cloud-init` 设施（[`http://launchpad.net/cloud-init`](http://launchpad.net/cloud-init)））会设置一个通用的虚拟机实例，以你想要的方式运行，而无需经过安装过程。下一节将描述使用\
  \ `cloud-init` 的一些方法。\n\n### 配置并运行 cloud-init 云实例\n\n在接下来的步骤中，我将向你展示如何手动创建可以与启动的\
  \ Linux 云镜像结合的数据，这样当该镜像启动时，它将根据你的数据进行配置。在运行时将数据与镜像结合，允许你在每次运行镜像之前更改数据，而不是将其永久安装在镜像中。\n\
  \n我建议你在第 26 章中配置的虚拟化程序之一上运行此步骤。这不仅允许你为你的 Linux 云镜像创建自定义数据，还让你能够在该虚拟化程序上作为虚拟机运行该镜像。\n\
  \n要添加数据并运行现有的云镜像，此步骤要求你获取云镜像、创建数据文件并生成一个结合这些元素的新镜像。此步骤旨在非常简单地启动云镜像。稍后我会告诉你如何向这些数据文件添加功能。要配置和运行云镜像，请遵循以下步骤：\n\
  \n1.  **创建 cloud-init 元数据文件**。创建一个名为 `meta-data` 的文件，包含从外部标识云实例的信息。例如，你可以添加实例标识（`instance-id`）、主机名（`local-hostname`）和其他信息。为了初尝试简单，我分配了两个字段：\n\
  \n    ```\n    instance-id: FedoraWS01\n    local-hostname: fedora01\n    ```\n\n\
  2.  **创建 cloud-init 用户数据文件**。创建一个名为 `user-data` 的文件，包含配置镜像本身操作系统内部的数据。在这个简单用例中，我为默认用户（fedora）设置了密码，并设置\
  \ `cloud-init` 不让密码过期：\n\n    ```\n    #cloud-config\n    password: cloudpass\n\
  \    chpasswd: {expire: False}\n    ```\n\n3.  **将数据合并为独立镜像**。在当前目录下有 `meta-data`\
  \ 和 `user-data` 文件的情况下，创建一个包含这些数据的 ISO 镜像。稍后我们将此镜像作为 CD-ROM 呈现给 Linux 镜像，这样 `cloud-init`\
  \ 就知道如何配置 Linux 镜像。（如果没有，请先安装 `genisoimage` 包。）\n\n    ```\n    # yum install genisoimage\n\
  \    # genisoimage -output fedora21-data.iso -volid cidata \\\n          -joliet\
  \ -rock user-data meta-data\n    ```\n\n4.  **获取基础云镜像**。Ubuntu、Fedora 和 RHEL 的云镜像已配置好用于\
  \ `cloud-init`。获取官方 Fedora 云镜像（其他发行版将在稍后描述），并执行以下操作：\n\n    *   **访问**[`getfedora.org`](http://getfedora.org)。。打开\
  \ Web 浏览器，访问 [`https://getfedora.org/en/cloud/download/`](https://getfedora.org/en/cloud/download/)。\n\
  \n\n\n\n\n- **点击 OpenStack。** 点击“General Purpose”（通用用途）下的“Are you an OpenStack user”链接，并点击出现的“Download”（下载）按钮以获取可以在\
  \ OpenStack 环境中使用的 `qcow2` 镜像。镜像名称类似于：`Fedora-Cloud-Base-20141203-21.x86_64.qcow2`。\n\
  \n5. **对镜像快照。** 在获得所需的镜像之前，你可能需要执行此过程。因此，不要直接使用下载的镜像，而是对其创建一个快照。为了跟踪版本，我在新的快照名称中加入了\
  \ `01`：\n\n```bash\n# qemu-img create -f qcow2 \\\n   -o backing_file=Fedora-Cloud-Base-20141203-21.x86_64.qcow2\
  \ \\\n   Fedora-Cloud-Base-01.qcow2\n```\n\n6. **将文件复制到 images 目录。** 在虚拟机程序（`libvirtd`\
  \ 服务）上使用时，将镜像拷贝到 `/var/lib/libvirt/images/` 目录是一个良好习惯。例如，将云镜像和数据镜像拷贝到该目录，输入以下命令：\n\
  \n```bash\n# cp Fedora-Cloud-Base-20141203-21.x86_64.qcow2 \\\n    Fedora-Cloud-Base-01.qcow2\
  \ \\\n    fedora21-data.iso          \\\n    /var/lib/libvirt/images/\n```\n\n7.\
  \ **启动云实例。** 文件放置完成后，运行以下命令启动你的云镜像实例：\n\n```bash\n# cd /var/lib/libvirt/images\n\
  # virt-install --import --name fedora21-01 --ram 4096 --vcpus 2 \\\n  --disk path=Fedora-Cloud-Base-01.qcow2,format=qcow2,bus=virtio\
  \ \\\n  --disk path=fedora21-data.iso,device=cdrom \\\n  --network bridge=virbr0\
  \ &\n```\n\n上一个 `virt-install` 示例显示虚拟机被分配了 4GB 内存（`--ram 4096`）和两个虚拟 CPU（`--vcpus\
  \ 2`）。取决于你计算机的资源，系统上的 RAM 和 VCPU 值可能会有所不同。\n\n此时，虚拟机程序上正在运行一个名为 `fedora21-01` 的虚拟机。随着虚拟机启动，应该打开一个控制台窗口，允许你登录新的云虚拟机。\n\
  \n### 调查云实例\n\n为了调查我们创建的云镜像，你可以打开运行中的实例并查看内部情况。如果它尚未打开，一种方法是使用 `virt-viewer` 打开虚拟机：\n\
  \n```bash\n# virt-viewer fedora21-01\n```\n\n在弹出的控制台窗口，使用我们添加到镜像的数据进行登录。使用 `fedora`\
  \ 作为用户，`cloudpass` 作为密码登录。`fedora` 用户具有 `sudo` 权限，因此你可以使用该账户通过输入命令来调查实例：\n\n在这里，你可以看到\
  \ `user-data` 是如何拷贝到实例的：\n\n```bash\n$ sudo cat /var/lib/cloud/instances/FedoraWS01/user-data.txt\n\
  #cloud-config\npassword: cloudpass\nchpasswd: {expire: False}\n```\n\n基础云配置在 `/etc/cloud/cloud.cfg`\
  \ 文件中完成。你可以在这里看到 root 用户账户默认是被禁用的。在文件底部，你可以看到名为 `fedora` 的用户是默认用户，并且具有不需要密码的 `sudo`\
  \ 权限。\n\n```bash\n$ sudo cat /etc/cloud/cloud.cfg\nusers:\n - default\ndisable_root:\
  \ 1\n...\nsystem_info:\n  default_user:\n    name: fedora0\n    lock_paswd: true\n\
  \    gecos: Fedora Cloud User\n    groups: [wheel, adm, systemd-journal]\n    sudo:\
  \ [\"ALL=(ALL) NOPASSWD:ALL\"]\n    shell: /bin/bash\n  distro: fedora\n  paths:\n\
  \    cloud_dir: /var/lib/cloud\n    templates_dir: /etc/cloud/templates\n  ssh_svcname:\
  \ sshd\n# vim:syntax=yaml\n```\n\n你也可以在 `cloud.cfg` 文件看到其他内容。你可以看到初始化期间运行了哪些 `cloud_init_modules`（例如设置主机名或启动\
  \ `rsyslog` 日志的模块）。你可以看到设置本地区域、设置时区并运行进一步配置工具（如 chef 和 puppet）的 `cloud_config_modules`。\n\
  \n由于启用了 `yum` 仓库，只要你有可用的网络连接（DHCP 默认应该为虚拟机分配了地址），你就可以从 Fedora 仓库中安装任何可用包。\n\n###\
  \ 克隆云实例\n\n如果你决定喜欢创建的云实例，可以通过克隆组成云实例的两个镜像（云镜像和数据镜像）来保存其副本以供以后运行。要使用 `virt-manager`\
  \ 克隆运行中的云实例，请执行以下操作：\n\n1. **启动 `virt-manager`**。在运行虚拟机的宿主机系统上运行 `virt-manager`\
  \ 命令，或从桌面的“活动”屏幕启动虚拟机管理器。\n\n2. **暂停虚拟机**。在 `virt-manager` 中右键点击虚拟机实例项，选择“Pause”（暂停）。这将使虚拟机处于非活动状态。\n\
  \n3. **克隆虚拟机**。再次右键点击虚拟机实例项，选择“Clone”（克隆）。出现“克隆虚拟机”窗口，如图 27.1 所示。\n\n4. **选择克隆设置**。对于云基础镜像和数据镜像，你可以选择创建新副本或与现有的虚拟机共享。完成后，选择“Clone”（克隆）。\n\
  \n![image](img/00077.jpeg)\n\n图 27.1 克隆允许你保存云实例的永久副本。\n\n克隆的云实例现在可以在虚拟机管理器中随你进行启动、停止或其他管理。\n\
  \n### 尝试 Ubuntu 镜像\n\n任何启用了 `cloud-init` 的 Linux 镜像都可以以与所示的方式进行配置。为了让 Ubuntu 镜像文件运行，你需要添加软磁盘镜像使云实例可启动：\n\
  \n1. **下载 Ubuntu tar 包**。访问 Ubuntu 网站，选择你需要的版本和特定镜像。我是从 `http://cloud-images.ubuntu.com/releases/`\
  \ 下载的。\n\n2. **解压云 tar 包**。我输入以下命令来提取文件：\n\n```bash\n# tar xvf ubuntu-14.10-server-cloudimg-amd64.gz\n\
  ```\n\n3. **将数据合并到单独的镜像中**。从用于 Fedora 的相同 `meta-data` 和 `user-data` 文件开始。将元数据名称从\
  \ `fedora` 改为 `ubuntu`。运行此命令创建数据镜像：\n\n```bash\n# genisoimage -output ubuntu.iso\
  \ -volid cidata -rock user-data meta-data\n```\n\n4. **对镜像快照**。对镜像进行快照：\n\n```bash\n\
  # qemu-img create -f qcow2 \\\n   -o backing_file=utopic-server-cloudimg-amd64.img\
  \ \\\n   utopic-server-01.img\n```\n\n5. **拷贝镜像文件**。将 Ubuntu 镜像文件拷贝到相应的目录。为了让 Ubuntu\
  \ 镜像文件运行，你需要添加软磁盘镜像使云实例：\n\n```bash\n# cp ubuntu-data.iso      \\\n     utopic-server-cloudimg-amd64-floppy\
  \  \\\n     utopic-server-cloudimg-amd64.img /var/lib/libvirt/images/\n```\n\n6.\
  \ **启动云实例**。要启动 Ubuntu 云实例，运行以下命令：\n\n```bash\n# cd /var/lib/libvirt/images\n# virt-install\
  \ --import --name ubuntu1410-01 --ram 4096 --vcpus 2 \\\n  --disk path=utopic-server-cloudimg-amd64-floppy,device=floppy\
  \ \\\n  --disk path=utopic-server-cloudimg-amd64.img,format=raw,bus=virtio \\\n\
  \  --disk path=ubuntu-data.iso,device=cdrom --network bridge=virbr0 &\n```\n\n此时，你有一个精简的\
  \ Ubuntu 云实例正在运行。使用用户 `ubuntu` 和 `user-data` 文件中定义的密码登录。\n\n### 扩展你的 cloud-init\
  \ 配置\n\n\n\n\n\n你可以向元数据（meta-data）和用户数据（user-data）文件添加更多信息来配置你的云实例。`cloud-init`\
  \ 设置的示例可以在 Cloud-Init 配置示例页面找到（[`http://cloudinit.readthedocs.org/en/latest/topics/examples.html`](http://cloudinit.readthedocs.org/en/latest/topics/examples.html)）。以下章节显示了你可以添加到用户数据文件中的设置示例。\n\
  \n## 使用 cloud-init 添加 ssh 密钥\n\n你不再使用密码登录云实例，而是可以使用密钥认证并结合 `ssh` 命令通过网络进行登录。云提供商通常会使用这种方法，以允许用户访问云镜像。\n\
  \n如果你已经为计划用于 `ssh` 登录云实例的用户账户生成了公钥和私钥 `ssh` 密钥，你可以在此过程中使用该公钥。如果你生成了 RSA 密钥对，公钥默认位于\
  \ `id_rsa.pub` 文件中：\n\n```\n# cat $HOME/.ssh/id_rsa.pub\nssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDMzdq6hqDUhueWzl7rIUwjxB/rrJY4o\n\
  ZpoWINzeGVf6m8wXlHmmqd9C7LtnZg2P24/ZBb3S1j7vK2WymOcwEoWekhbZHBAyYeqXK\nYQQjUB2E2Mr6qMkmrjQBx6ypxbz+VwADNCwegY5RCUoNjrN43GVu6nSOxhFf7hv6dtCjv\n\
  osOvtt0979YS3UcEyrobpNzreGSJ8FMPMRFMWWg68Jz5hOMCIE1IldhpODvQVbTNsn/ST\nxO7ZwSYV6kfDj0szvdoDDCyh8mPNC1kIDhf/qu/Zn1kxQ9xfecQ+SUi+2IwN69o1fNpex\n\
  JPFr+Bwjkwcrk58C6uowG5eNSgnuu7GMUkT root@host2.example.com\n```\n\n该文件中的公钥通常会被复制到你想登录的远程系统用户的\
  \ `$HOME/.ssh/authorized_keys` 文件中。我们可以通过用户数据文件中的如下所示条目，将密钥添加到我们云实例的该文件中：\n\n```\n\
  users:\n  - default\n  - name: wsmith\n    gecos: William B. Smith\n    primary-group:\
  \ wsmith\n    sudo: ALL=(ALL) NOPASSWD:ALL\n    lock-passwd: true\n    ssh-authorized-keys:\n\
  \      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDMzdq6hqDUhueWzl7rIUwjx\nB/rrJY4oZpoWINzeGVf6m8wXlHmmqd9C7LtnZg2P24/ZBb3S1j7vK2WymOcwEoWekhbZH\n\
  BAyYeqXKYQQjUB2E2Mr6qMkmrjQBx6ypxbz+VwADNCwegY5RCUoNjrN43GVu6nSOxhFf7\nhv6dtCjvosOvtt0979YS3UcEyrobpNzreGSJ8FMPMRFMWWg68Jz5hOMCIE1IldhpODvQV\n\
  bTNsn/STxO7ZwSYV6kfDj0szvdoDDCyh8mPNC1kIDhf/qu/Zn1kxQ9xfecQ+SUi+2IwN6\n9o1fNpexJPFr+Bwjkwcrk58C6uowG5eNSgnuu7GMUkT\
  \ root@host2.example.com\n```\n\n从上述信息中你可以看到 `wsmith` 是默认用户。gecos 条目通常是用户的全名，用于\
  \ `/etc/passwd` 文件的第五字段。该用户的密码已锁定。然而，由于我在 [`host2.example.com`](http://host2.example.com)\
  \ 上的 root 账户 `ssh-rsa` 条目已在此提供了该用户的 `ssh-authorized-keys`，可以通过 `ssh` 以 wsmith 身份登录云实例而无需输入密码（只要我的私钥与该公钥相关）。\n\
  \n## 使用 cloud-init 添加网络接口\n\n如果你希望在启动过程早期在云实例上配置网络接口，可以为这些云实例的元数据文件添加 `network-interfaces`\
  \ 条目。这是一个示例：\n\n```\nnetwork-interfaces: |\n  iface eth0 inet static\n  address\
  \ 192.168.100.50\n  network 192.168.100.0\n  netmask 255.255.255.0\n  broadcast\
  \ 192.168.1.255\n  gateway 192.168.100.1\nbootcmd:\n  - ifdown eth0\n  - ifup eth0\n\
  ```\n\n此处显示的 `network-interfaces` 值标识云实例内的 `eth0` 接口包含静态地址（换句话说，不是来自 DHCP）。接口的 IP\
  \ 地址设置为 `192.168.100.50`，而路由数据包到世界的网关设置为 `192.168.100.1`。为了在新地址上启用该接口，`bootcmd`\
  \ 设置为先关闭接口（`ifdown eth0`）然后重新启动（`ifup eth0`）。\n\n## 使用 cloud-init 添加软件\n\n你不局限于云镜像中已有的软件。在你的用户数据文件中，你可以定义\
  \ `yum` 仓库（在 Fedora 和 RHEL 中）或 `apt` 仓库（在 Ubuntu 或 Debian 中），然后指定你想在云实例启动时安装的任何包。\n\
  \n以下示例显示了用户数据文件条目可能的内容，用于向你的云实例添加 `yum` 仓库（针对 Fedora 或 RHEL），然后从该仓库或任何其他启用的仓库安装包：\n\
  \n```\nmyownrepo:\n    baseurl: http://myrepo.example.com/pub/myrepo/\n    enabled:\
  \ true\n    gpgcheck: true\n    gpgkey: file:///etc/pki/rpm/\n    name: My Repository\n\
  \    packages:\n     - nmap\n     - mycoolcmd\n```\n\n注意：最后一个示例的原始文本被截断/不完整，但我根据提供的上下文对逻辑进行了格式化。\n\
  \n\n\n\n\n至于元数据（meta-data）和用户数据可能包含的内容，可以为你的云实例开发更为复杂的配置方案。`Cloud-init` 支持配置工具，例如\
  \ Puppet ([`puppetlabs.com/puppet/puppet-open-source``](http://puppetlabs.com/puppet/puppet-open-source))\
  \ 和 Chef ([`www.chef.io/chef/`](https://www.chef.io/chef/))。这些工具允许你将配置信息脚本应用于你的云实例，甚至可以根据需要替换组件或重启服务，将系统恢复到所需状态。\n\
  \n然而，到目前，我的任务并不是让你成为一个完全的云管理员（几百页之前，你可能只是个 Linux 新手）。相反，我想让你了解如果你最终进入了云数据中心，你将面对什么\
  \ . . . 因为许多人相信，在不遥远的将来，大多数数据中心将作为云基础设施进行管理。\n\n到本章为止，你已经了解了为云计算配置 Linux 的内部细节。接下来，让我们退一步，看看如何使用两个最流行的基于\
  \ Linux 的云平台来运行你自己的 Linux 虚拟机：OpenStack 和 Amazon EC2。\n\n## 使用 OpenStack 部署云镜像\n\
  \n根据大多数说法，OpenStack 是今天最热门的开源项目。通过 OpenStack，你获得了一个不断进化的平台，用于管理你的物理云计算基础设施以及运行在上面的虚拟系统。OpenStack\
  \ 允许你部署自己的私有云，或将其作为公有云提供给世界。\n\n我不会让你自己搭建 OpenStack 云，而是将向你展示如何使用 OpenStack Dashboard（控制面板）部署虚拟机。如果你想自己尝试，可以通过以下方式获取\
  \ OpenStack：\n\n*   **Linux 发行版**——Fedora、Ubuntu 和 CentOS 都有免费的 OpenStack 版本，你可以自己部署。红帽企业级\
  \ Linux 提供了通过订阅提供的 OpenStack 版本。它设置起来比较复杂。某些 OpenStack 的合一安装可以在单机上运行，但我认为如果你从三台物理机器开始：一个控制器节点和两个虚拟化程序（hypervisors），将会获得更好的体验。\n\
  *   **公有 OpenStack 云**——你可以以不同的成本尝试公有 OpenStack 云。OpenStack 项目网站提供了公有 OpenStack\
  \ 云列表 ([`www.openstack.org/marketplace/public-clouds/``](http://www.openstack.org/marketplace/public-clouds/))。\n\
  \n我的第一个观点是帮助你在没有能力在自己的计算机上完成想要的操作时，在云中运行 Linux 系统。然而，我的另一个观点是向你展示云提供商的 Web 界面（如\
  \ OpenStack Dashboard）如何极大简化我们在本章早期通过 `cloud-init` 手动进行的云配置。\n\n### 从 OpenStack\
  \ Dashboard 开始\n\n我将从一个已经就绪的 OpenStack 设置开始。OpenStack 环境管理员为我创建了一个名为 `cnegus-test-project`\
  \ 的项目以及一个允许我访问该项目的用户账户（`cnegus`）。以下是我计划要执行的操作：\n\n*   **配置网络**——就像我要设置路由器并将计算机物理上插入该路由器一样，我将设置一个虚拟网络。该虚拟网络将包含一组地址，通过\
  \ `DHCP` 分发到我的虚拟机上。\n*   **配置虚拟机**——我将逐步完成选择、配置和部署几台虚拟机的过程。\n\n本次演示使用的 OpenStack\
  \ 版本是红帽企业 Linux OpenStack 平台 (RHEL-OSP)。然而，在任何 OpenStack 环境中的体验都是类似的。下一节将向你展示如何开始配置网络。\n\
  \n#### 配置你的 OpenStack 虚拟网络\n\n1.  **登录 OpenStack。** 使用 OpenStack 管理员分配给你的用户名和密码，从\
  \ 浏览器登录 OpenStack Dashboard。你应该能看到一个 Overview（概览）屏幕，类似于图 27.2 所示所示。\n2.  **创建网络。**\
  \ 要创建网络，从 Overview 页面的左侧列选择 Networks（网络）。在出现的 Networks 屏幕上，创建一个新网络（我使用的示例在括号中）：\n\
  \    1.  **选择 Create Network（创建网络）按钮。**\n    2.  **在 Network 选项卡中，输入网络名称 (`mynet`)。**\n\
  \    3.  **在 Subnet（子网）选项卡中，输入子网名称 (`mysub01`)、网络地址 (`192.168.100.0/24`)、IP 版本 (`IPv4`)\
  \ 和网关 IP (`192.168.100.1`)，并取消勾选 Disable Gateway（禁用网关）。**\n    4.  **在 Subnet Detail（子网详情）选项卡中，在\
  \ Allocation Pool（分配池）框中输入逗号分隔的 IP 地址范围。** 对于我的示例，我选择了 `192.168.100.10,192.168.100.50`，向客户端分发从\
  \ 192.168.100.10 到 192.168.100.50 的 IP 地址范围。从你的 OpenStack 云管理员处获取名称服务器建议或使用公共 DNS\
  \ 服务器（如 Google 的 8.8.8.8 或 8.8.4.4）。\n    5.  **选择 Create（创建）以创建新网络。**\n3.  **创建路由器。**\
  \ 为了让你的虚拟机能够访问互联网，你需要一个连接到你的私有网络的路由器以及一个可以访问互联网的网络。以下是操作方法：\n    1.  **从 Networks\
  \ 屏幕的左侧列选择 Routers（路由器）。**\n    2.  **点击 Create Router（创建路由器）按钮。**\n    3.  **输入路由器名称\
  \ (`myrouter1`)**并点击 Create。\n    4.  **点击 Set Gateway（设置网关）。**\n    5.  **在 Set\
  \ Gateway 屏幕上，点击 External Network（外部网络）框并从可用的外部网络中选择。** 保持 Router Name 和 Router\
  \ ID 不变。点击 Set Gateway。新路由器出现在 Routers 屏幕上。\n4.  **将网络连接到路由器。** 在 Routers 屏幕上（你仍在此处），选择你刚刚创建的路由器名称：\n\
  \    1.  **在 Router Details（路由器详情）屏幕，点击 Subnet 框并选择你之前创建的子网 (`mynet: 192.168.100.0/24\
  \ mysub01`)。** 你不需要更改 Router Name 或 Router ID。\n    2.  **点击 Add Interface。**\n\
  5.  **查看网络拓扑。** 从左侧列点击 Topology。然后将鼠标指针悬停在路由器名称 (`myroute1`) 上。图 27.3 显示了你的网络配置的一个示例。\n\
  \n\n\n\n\n1. **输入密钥对名称（`mycloudkey`），并点击“创建密钥对”（Create Keypair）按钮。** 弹出窗口询问你是否要打开或保存\
  \ `*.pem` 文件。\n2. **选择“保存文件”（Save File），并点击“确定”（OK）。** 在提示保存位置时，请将其保存到家目录下的 `.ssh`\
  \ 目录。\n\n你现在已准备好部署 OpenStack 实例（云端虚拟机）。\n\n### 在 OpenStack 中启动虚拟机\n\n要开始启动新的云虚拟机实例，转到左侧列并选择\
  \ `Instances`（实例）。然后点击“启动实例”（Launch instance）按钮。将出现“启动实例”屏幕。要填写启动实例所需的信息，请按照以下步骤操作：\n\
  \n1. **选择详细信息（Details）。** 在“详情”（Details）选项卡中，选择以下项：\n    * **可用性区域（Availability\
  \ Zone）**——可用性区域由一组计算主机组成。有时会创建单独区域来识别物理位置相邻的计算机组（例如在同一机架上）或具有相同硬件特征的计算机（因此可以用于相同类型的应用程序）。从列表中选择其中一个区域。\n\
  \    * **实例名称（Instance Name）**——为实例提供任何有助于你记住它用途的名称。\n    * **规格（Flavor）**——通过选择规格，你为你的虚拟机实例分配一组资源。这些资源包括虚拟\
  \ CPU 核心数、可用内存量、分配的磁盘空间以及可用的临时磁盘空间。（临时空间是实例运行期间从本地磁盘可用的空间，但在实例关闭时不会保存。）默认规格包括 `m1.tiny`、`m1.small`、`m1.medium`、`m1.large`\
  \ 和 `m1.xlarge`。你的云管理员可以添加其他规格。\n    * **实例数量（Instance Count）**——默认情况下，此设置为 1，以启动一个实例。如果你愿意，可以更改数字以启动更多实例。\n\
  \    * **实例启动源（Instance Boot Source）**——实例可以从镜像、快照、卷、包含新卷的镜像或包含新卷的卷快照中引导启动。\n  \
  \  * **镜像名称（Image Name）**——选择你想要启动的镜像。名称通常包含你正在启动的操作系统的名称。\n    * **设备大小和设备名称（可选）**——如果你在选择“实例启动源”时选择了包含新卷，则可以在这些字段中设置卷的大小（以\
  \ GB 为单位）和设备名称。对于“设备名称”，如果你选择 `vda` 作为设备名称（用于虚拟机上的第一个磁盘），则代表该设备的设备将是 `/dev/vda`。\n\
  \n2. **选择访问与安全（Access & Security）。** 选择“访问与安全”（Access & Security）选项卡，并选择你之前创建的密钥对。\n\
  3. **选择网络（Networking）。** 选择“网络”（Networking）选项卡。从可用网络列表中，用鼠标选取你需要的网络并拖入“已选网络”（Selected\
  \ Networks）框中。\n4. **添加创建后设置（Add Post-Creation settings）。** 你可以添加命令和脚本在系统启动后进一步配置系统。在这里你可以添加在本章之前关于\
  \ `cloud-init` 部分中描述的 `user-data` 文件中所添加过的信息。\n\n选择“启动”（Launch）来启动虚拟机。虚拟机运行时，你可以通过选择实例并点击“控制台”（Console）选项卡来登录该系统。虚拟机的控制台窗口应向你显示登录提示。如果你希望能够通过网络使用\
  \ `ssh` 访问虚拟机，请继续下一节。\n\n### 通过 ssh 访问虚拟机\n\n当你的公钥注入到正在运行的虚拟机后，它就已准备好让你使用 `ssh`\
  \ 登录。然而，在在此之前，你必须执行以下步骤：\n\n1. **添加浮空 IP 地址。** 从 OpenStack 面板（Dashboard）中，从左侧列选择\
  \ `Instances`，点击包含该实例的条目上的“更多”（More），并点击“关联浮空 IP”（Associate Floating IP）。选择 IP 地址框旁边的加号\
  \ (+)，选择一个有可用浮空 IP 的池（Pool）。\n2. **使用 ssh 登录。** 当你的公钥已注入到正在运行的虚拟机后，它就准备好让你使用 `ssh`\
  \ 登录。然而，在在此之前，你必须执行以下步骤：\n（此处由于原文似乎存在重复内容，根据指令“不要重复输出原文”，以下翻译逻辑应为：原文中从“然而，在在此之前，你必须执行以下步骤：”之后的内容与前段落有重复，翻译时将按逻辑整合。）\n\
