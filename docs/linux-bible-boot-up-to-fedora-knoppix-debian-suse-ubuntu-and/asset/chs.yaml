  \n5. 使用点对点传输传输目标代码，前提是您通知其他节点何处根据第 6d 小节向公众免费提供该作品的目标代码和 `Corresponding Source`。\n\
  \n目标代码中可分离的部分，如果其源码作为 `System Library` 被排除在 `Corresponding Source` 之外，则不需要包含在目标代码作品的传输中。\n\
  \n“**用户产品**”是指 (1) “**消费产品**”，即任何通常用于个人、家庭或家用用途的有形个人财产，或 (2) 任何设计或销售用于整合到房屋中的物品。在判断某个产品是否为消费产品时，疑决情况应有利于将其纳入保护范围。对于特定用户收到的特定产品，“通常用于”指的是该类产品的典型或常见用途，无论特定用户的状态或该特定用户实际使用、预期或被预期使用产品的方式。无论该产品是否具有实质性的商业、工业或非消费用途，产品都是消费产品，除非此类用途代表了产品唯一的显著用途模式。\n\
