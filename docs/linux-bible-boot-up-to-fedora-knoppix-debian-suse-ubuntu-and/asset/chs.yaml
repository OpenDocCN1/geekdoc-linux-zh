  \n\n\n\n如果你怀疑存在恶意活动，可以快速扫描文件系统，以查看今天（或昨天，取决于你认为入侵何时发生）是否有任何二进制文件被修改或更改。要执行此扫描，请使用\
  \ `find` 命令。\n\n在接下来的示例中，对 `/sbin` 目录进行了扫描。为了查看是否有二进制文件在 24 小时内被修改过，使用了命令 `find\
  \ /sbin -mtime -1`。在示例中，显示了几个文件，表明它们最近被修改过。这表明系统正在发生恶意活动。要进一步调查，可以使用 `stat` `filename`\
  \ 命令查看每个单独文件的时间，如下：\n\n```\n# find /sbin -mtime -1\n/sbin\n/sbin/init\n/sbin/reboot\n\
  /sbin/halt\n# stat /sbin/init\n  File: '/sbin/init' -> '../bin/systemd'\n  Size:\
  \ 14    Blocks: 0      IO Block: 4096   symbolic link\nDevice: fd01h/64769d    Inode:\
  \ 9551        Links: 1\nAccess: (0777/lrwxrwxrwx)\nUid: (    0/    root)   Gid:\
  \ (    0/    root)\nContext: system_u:object_r:bin_t:s0\nAccess: 2016-02-03 03:34:57.276589176\
  \ -0500\nModify: 2016-02-02 23:40:39.139872288 -0500\nChange: 2016-02-02 23:40:39.140872415\
  \ -0500\n Birth: -\n```\n\n你可以为所有二进制文件的原始 `mtime` 和 `ctime` 创建一个数据库，然后运行脚本找到当前的\
  \ `mtime` 和 `ctime`，将它们与数据库进行比较，并记录任何差异。然而，这种类型的程序已经创建且运行良好。它被称为入侵检测系统，在本章的稍后部分将介绍。\n\
  \n你需要定期执行其他几种文件系统扫描。恶意攻击者喜欢的文件或文件设置列在 表 22.6 中。该表还列出了执行扫描的命令以及该文件或文件设置可能有问题的原因。\n\
  \n| 文件或设置 | 扫描命令 | 文件或设置的问题 |\n| :--- | :--- | :--- |\n| SetUID 权限 | `find / -perm\
  \ -4000` | 允许任何人在内存执行文件时临时成为该文件的所有者。 |\n| SetGID 权限 | `find / -perm -2000` | 允许任何人在内存执行文件时临时成为该文件所在组的成员。\
  \ |\n| rhost 文件 | `find /home -name .rhosts` | 允许系统完全信任另一个系统。不应出现在 `/home` 目录。 |\n\
  | 无所有者文件 | `find / -nouser` | 表示未与任何用户名关联的文件。 |\n| 无组文件 | `find / -nogroup` | 表示未与任何组名关联的文件。\
  \ |\n\n表 22.6 附加文件系统扫描\n\n这些文件系统扫描有助于监控系统状况，并帮助检测恶意攻击。然而，你的文件还可能遭受其他类型的攻击，包括病毒和\
  \ rootkit。\n\n### 检测病毒和 rootkit\n\n两种流行的恶意攻击工具是病毒和 rootkit，因为它们在执行恶意活动时保持隐藏。Linux\
  \ 系统需要对这两种工具进行监控。\n\n#### 监控病毒\n\n`计算机病毒` 是恶意软件，它可以附加到已安装的系统软件上，并具有通过介质或网络传播的能力。认为没有\
  \ Linux 病毒是一个误区。病毒的恶意创建者通常关注更流行的桌面操作系统，例如 Windows。然而，这并不意味着没有为 Linux 系统创建病毒。\n\n\
  更重要的是，Linux 系统经常被用于处理服务。Linux 系统需要对这两种工具进行监控。\n\n\n\n\n| tripwire | `yum install\
  \ tripwire` `apt-get install tripwire` | [`http://tripwire.org`](http://tripwire.org)\
  \ |\n\n表 22.7 流行的 Linux 侵入检测系统\n\n高级入侵检测环境 (`aide`) IDS 使用比较法来检测入侵。当你小时候，可能可能玩过比较两张图片并找出它们之间不同之处的游戏。`aide`\
  \ 工具也使用了类似的方法。它会创建一个“第一张照片”数据库。在之后的某个时间，会创建另一个数据库“第二张照片”，然后 `aide` 会比较这两个数据库并报告它们的不同之处。\n\
  \n开始之前，你需要拍摄那“第一张照片”。创建这张照片的最佳时间是系统刚安装时。创建初始数据库的命令是 `aide -i`，运行需要很长时间。以下是部分输出内容。注意，`aide`\
  \ 会告诉你它正在哪里创建初始“第一张照片”数据库。\n\n```\n# aide -i\nAIDE, version 0.15.1\n### AIDE database\
  \ at /var/lib/aide/aide.db.new.gz initialized.\n```\n\n下一步是将初始的“第一张照片”数据库移动到新位置。这可以保护原始数据库不被覆盖。此外，除非移动数据库，否则比较将无法进行。将数据库移动到新位置并给它重命名的命令如下：\n\
  \n```\n# cp /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz\n```\n\n当你准备好检查文件是否被篡改时，你需要创建一个新数据库（“第二张照片”，并将其与原始数据库（“第一张照片”）进行比较。`aide`\
  \ 命令的检查选项 `-c` 会创建一个新数据库并对旧数据库进行比较。接下来的输出说明了正在进行的比较，以及 `aide` 命令对某些问题的报告。\n\n```\n\
