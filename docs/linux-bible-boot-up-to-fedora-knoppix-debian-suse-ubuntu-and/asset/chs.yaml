  \ 工具在 Fedora 系统上运行，该系统被命名为“Host-A”。Host-A 是需要保护其网络服务的 Linux 服务器。Host-B 是一台 Linux\
  \ 服务器，使用 Linux Mint 发行版，并与 Host-A 处于同一网络中。\n\n在此次审计示例中，扫描是从 Host-A 发起的，使用的不是回环地址，而是实际\
  \ IP 地址。首先，使用 `ifconfig` 命令确定 Host-A 的 IP 地址。IP 地址为 10.140.67.23。\n\n```\n# ifconfig\n\
  lo  Link encap:Local Loopback\n    inet addr:127.0.0.1  Mask:255.0.0.0\n    inet6\
  \ addr: ::1/128 Scope:Host\n    UP LOOPBACK RUNNING  MTU:16436  Metric:1\n    RX\
  \ packets:4 errors:0 dropped:0 overruns:0 frame:0\n    TX packets:4 errors:0 dropped:0\
  \ overruns:0 carrier:0\n    collisions:0 txque:0\n```\n*(注：由于原文文本中 `ifconfig` 块似乎不完整，我将严格按照用户提供的文本进行翻译。在用户提供的文本中，`ifconfig`\
  \ 块最后一行确实是 `collisions:0 txque:0`。此处抱歉，我将直接输出最终的翻译结果。)*\n\n现在，使用 Host-A 的 IP 地址，从\
  \ Host-A 发起 TCP Connect 扫描。所有 1000 个端口都报告为 `closed`。\n\n```\n# nmap -sT 127.0.0.1\n\
