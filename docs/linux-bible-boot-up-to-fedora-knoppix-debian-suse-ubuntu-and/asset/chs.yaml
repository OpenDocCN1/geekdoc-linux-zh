  \n## 7. 额外条款。\n\n“**额外权限**”是指通过对本许可证的一项或多个条件进行例外处理来补充本许可证条款的条款。适用于整个程序的额外权限，在适用法律有效的范围内，应被视为已包含在本文许可证中。如果额外权限仅适用于程序的某部分，则该部分可以根据这些权限单独使用，但整个程序仍受本许可证的约束，不受额外权限的影响。\n\
  \n当您传输受保护作品的副本时，您可以根据自己的意愿从该副本或从其任何部分中移除任何额外权限。（在某些情况下，当您修改作品时，额外权限可能被写明要求被移除。）您可以在您添加到受保护作品的材料上放置额外权限，只要您拥有或可以提供该材料的适当版权许可。\n\
