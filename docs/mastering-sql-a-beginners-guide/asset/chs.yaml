  表格：旧员工 (Old Employee)\n\n以下 `INSERT` 查询向新员工表（New Emp table）添加了一条新员工记录：\n\n```sql\n\
  INSERT INTO New_Employee (Emp_Id, Emp_Name, Emp_Age,\nEmp_Salary) VALUES (01, Jack,\
