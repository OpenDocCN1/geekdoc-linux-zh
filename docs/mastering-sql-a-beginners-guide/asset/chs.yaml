  \n\n\n\n\n| 152 | Khilan | 25 | Delhi | 1,500.00 |\n| 178 | kaushik | 23 | Kota\
  \ | 2,000.00 |\n\n## UNION 子句\n\n顾如其名，该运算符/子句用于合并两个或多个 `SELECT` 查询的结果。我们也可以使用此命令从表格的特定列中访问特定的记录。每个\
  \ `SELECT` 语句中的列数以及它们在 `UNION` 语句中使用的顺序必须匹配。此外，所有 `SELECT` 语句中每列的数据类型必须相同。`UNION`\
  \ 子句仅返回唯一值。如果需要保留所有重复值，则需要使用 `UNION ALL` 子句。\n\n**语法：**\n\n```\nSELECT column_1,\
  \ column_2,...column_n\nFROM table_1\nUNION\nSELECT column_1, column_2,...column_n\n\
  FROM table_2;\n```\n\n结果表中的重复行将使用 `UNION` 子句删除。若要保留副本，请检查 `UNION ALL`。可以使用 `UNION`\
  \ 语句合并许多 `SELECT` 语句，`UNION` 和 `UNION ALL` 都可连接不同的表。如果你想将不同的 `SELECT` 语句合并为一个，且在不考虑唯一性的情况下，可以使用\
  \ `UNION ALL` 以获得更好的性能。\n\n以下限制适用于联合（union）：\n\n- `SELECT` 语句必须返回相同数量的列。\n- 虽然列名不需要匹配，但\
  \ `SELECT` 操作返回的列在顺序和数据类型必须匹配。\n- `SELECT` 语句中不允许单独的 `ORDER BY` 子句。\n\n在最后一个 `SELECT`\
  \ 语句之后，为结果表添加 `ORDER BY` 子句以对数据进行排序。联合操作根据初始 `SELECT` 语句命名其返回的结果列。连接通常默认从左到右解析。你可以使用括号来定义评估顺序。`UNION`\
  \ 子句允许你组合任意数量的 `SELECT` 语句。\n\n### Union 与 Union All\n\n`UNION` 和 `UNION ALL` 之间的主要区别之一是\
  \ `UNION` 会消除重复行，而 `UNION ALL` 不删除重复行。\n\n### SQL 中的 Union 运算符示例\n\n让我们创建两个独立的表并在表中插入记录。\n\
  \n以下查询生成了 **旧员工（Old Employee）** 表，该表有四个字段：\n\n```\nCREATE TABLE Old_Employee\n(\n\
  Employee_Id INT NOT NULL,\nEmployee_Name Varchar (40),\nEmp_Age INT,\nEmp_Salary\
