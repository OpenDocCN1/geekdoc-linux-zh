  \ New_Employee\n(\nEmp_Id INT NOT NULL,\nEmp_Name Varchar (40),\nEmp_Age INT,\n\
  Emp_Salary INT\n);\n```\n\n该查询生成新的员工表，该表有四个字段：\n\n```sql\nINSERT INTO Old_Employee\
  \ (Emp_Id, Emp_Name, Emp_Age,\nEmp_Salary) VALUES (11, Akhima, 12 , 15000),\n(12,\
