  \ 学校，并目前与许多大学和机构合作。\n\n欲了解更多信息，请访问 [`zeba.academy`](https://zeba.academy)\n\n# 第\
  \ 1 章 SQL 基础\n\nDOI: [10.1201/9781003358435-1](https://doi.org/10.1201/9781003358435-1)\n\
  \n## 本章内容\n\n*   ➢ SQL 基础\n*   ➢ SQL 的用途\n*   ➢ SQL 的特性\n*   ➢ SQL 及其组件\n*   ➢ NoSQL\
  \ 简介\n*   ➢ 优点与缺点\n\n\n\n\n\n数据如今是任何专业人士的基石。企业计算是数据驱动型组织的巅峰。组织化数据存储的重要性已不言而喻。我们每天都会产生海量数据。按照目前的速度，每天产生的数据超过了\
  \ 2.5 极亿字节。预计到 2025 年，世界每天将产生约 463 艾（exabytes）的数据。这证明了数据管理的重要性，而这正是数据库用用场。我们都知道数据源于各种来源且是非结构化的。数据库是以组织化方式存储这些数据的地方。数据库由行和列组成。数据在这里以表格的形式分类和保存。数据库是一个结构化的数据集合，可以快速检索。数据库管理系统（DBMS）用于管理这些数据库（图\
  \ 1.1）。\n\n![](img/Fig01_01.jpg)\n\nFIGURE 1.1 数据库的类型。\n\n因此，对这种分层数据存储和检索范式有基本的理解是非常重要的。另一方面，初学者无疑会在浩杂的知识海洋中感到迷失。结构查询语言（`SQL`）是一种用于处理关系型数据库的查询语言。我们可以使用\
  \ `SQL` 从数据库更新、删除和检索数据。表格用于定义数据/对象。这些表格由行和列组成，并通过其字段名唯一标识。\n\n## 关系型数据库管理系统 (RDBMS)\n\
  \n它考虑了使用主键、外键和索引表之间的关系。这使其在数据检索和存储方面比 DBMS 具有显著优势。它被企业用于存储大量的复杂数据。\n\n## SQL 中的键\n\
  \n键是关系型数据库范式的根本部分。它们用于定义和识别表与表的关系，以及识别表中的任何记录或数据行。\n\n- `super key`（候选键）用于识别表中的行。\n\
  - `primary key`（主键）是一个或多个表字段的集合，用于唯一标识数据库表中的记录。它不能接受空值或重复值。一个表只包含一个主键。\n- `Alternate\
  \ Key`（备用键）：唯一标识数据库中每一行的字段或字段集。一个表可以有多个主键，但只能有一个被设置为主键。另一个键是任何不是主键的键。\n- `unique\
  \ key`（唯一键）是一个或多个字段的集合，用于唯一标识数据库中的记录。它与主键相比，可以有一个空值。\n- `foreign key`（外键）是一个表中的字段，它是另一个表中的主键。它在两个表之间创建关系，同时确保数据完整性和导航性。\n\
  \n`SQL` 已经存在了四十多年。尽管如此，它确实发生了巨大的变化。在我们的学术生涯中，我们都在某个点遇到过 `SQL`。我们聚在这里是为了通过远离过时的工具和方法让事情变得更好。当我们学习一个使用旧方法和程序的系统时，在我们成为其成员后，必须将其内在化并重新考虑其在现代工业中的用途。`SQL`\
  \ 是结构查询语言的缩写。它是一种常用作关系型数据库管理系统（RDBMS）和数据操作的语言。\n\n要理解 `SQL` 短时间内不会消失。由于微软等公司目标的影响，它变得更加强大，微软最近也让\
  \ Linux 支持 `SQL`。众多的云产品，例如 Microsoft Azure 和 Amazon Web Services——市场最大的两个参与者——对关系型数据库模型特别是\
  \ `SQL` 采取了更加专注的方法。而且，这只是一个新纪元的开始。当你进入这一时期时，理解运行机制至关重要，这样你就能将你拥有或支持的公司推向新的高度。\n\n\
  ## 什么是结构查询语言 (SQL)?\n\n它是一种用于执行数据库操作的计算机语言，例如对数据库和视图进行升级、添加、删除以及构建和编辑。`SQL` 是一种查询语言，而不是数据库系统。假设你想使用\
  \ `SQL` 语言对数据库数据运行查询。任何数据库管理系统，如 `Oracle`、`MySQL`、`MongoDB`、`PostgreSQL`、`SQL Server`\
  \ 和 `DB2` 必须安装在你的系统中。这种数据库语言的主要目的是在关系型数据库管理系统中维护数据。数据专家利用这个专用工具处理结构化数据（以表格形式存储的数据）。它也是为\
  \ RDSMS 的流式处理设计的。此外，你还可以快速创建和管理数据库，以及访问和更改表的行列。1986 年，ANSI 批准了这一查询语言作为标准，1987 年，ISO\
  \ 也随其后。如果你想在数据科学领域工作，掌握这种查询语言至关重要。Facebook、Instagram 和 LinkedIn 等大公司使用 `SQL` 在后端存储数据。\n\
  \n## 结构查询语言 (SQL) 的起源\n\n1970 年，著名的计算机科学家 E.F. Codd 编写了一篇名为《大型共享数据库的数据关系模型》的信息检索论文。¹\
  \ 在学习了 E.F. Codd 的文章后，IBM 的两位研究员 Raymond Boyce 和 Donald Chamberlin 开发了 `SEQUEL`（结构英语查询语言）。1970\
  \ 年，他们在 IBM 圣何塞研究实验室共同创建了 `SQL`。Relational Software Inc. 在 20 世纪 70 年代末遵循 E.F. Codd、Raymond\
  \ Boyce 和 Donald Chamberlin 的思想创建了第一个 `SQL`。这个 `SQL` 完全基于 RDBMS。1979 年 6 月，Relational\
  \ Software Inc.（现在被称为 Oracle Corporation）发布了 `Oracle V2`，这是 `SQL` 的首次实现。\n\n## 结构查询语言\
  \ (SQL) 的目的\n\n`SQL` 最近被广泛用于数据科学和分析。上述是其需求广泛的一些原因之一：\n\n- 对于数据专业人士和 `SQL` 用户，`SQL`\
  \ 最基本的用途是在关系型数据库中插入、更新和删除数据。\n- `SQL` 可用于用户和数据专业人士从关系型数据库管理系统中获取数据。\n- 此外，它有助于结构化数据的描述。\n\
  - `SQL` 用户可以创建、删除和管理数据库及表。\n- 它还促进了关系数据库视图、存储过程和函数的创建。\n- 它允许用户定义和更新维护在关系型数据库中的信息。\n\
  - `SQL` 客户端还可以为表列、视图和存储过程定义访问和条件。\n\n## SQL 的安装\n\n`MySQL` 是一个开源的关系型数据库管理系统，可以从官网\
  \ [`dev.mysql.com/downloads`](https://dev.mysql.com/) 下载。安装后启动 `MySQL` 服务（图 1.2）。\n\
  \n![](img/Fig01_02.jpg)\n\nFIGURE 1.2 MySQL 安装页面。\n\n## 结构查询语言 (SQL) 中的操作\n\n当我们在关系型数据库管理系统上运行\
  \ `SQL` 命令时，系统将自动定位适当的程序来执行我们的请求，`SQL` 引擎将决定如何解释该命令。\n\n结构查询语言过程的四个组成部分如下：\n\n-\
  \ 优化引擎。\n- `SQL` 查询引擎。\n- 经典查询引擎。\n- 查询分发器。\n\n数据专业人士和用户可以使用经典查询引擎来维护非 SQL 查询。图\
  \ 1.3 展示了 `SQL` 架构风格。\n\n![](img/Fig01_03.jpg)\n\nFIGURE 1.3 SQL 框架。\n\n\n\n\n\n\
  ## 有哪些类型的函数？\n\n执行数据操作的方法被称为函数。SQL 提供了许多内置函数，用于文本拼接、数学计算和其他任务。\n\n以下是 SQL 函数的不同类型：\n\
  \n- 聚合函数（Aggregated Functions）。\n- 标量函数（Scalar Functions）。\n\n让我们分别检查每种函数。\n\n###\
  \ 聚合函数\n\n在 SQL 中，聚合函数将一组值相加并返回单一结果。下面列出了一些最常用的聚合函数：\n\n| 函数 | 描述 |\n| --- | ---\
  \ |\n| `SUM()` | 用于计算一组值的总和。 |\n| `COUNT()` | 获取行的总数，无论是否带有条件。 |\n| `AVG()` | 使用此函数计算数值列的平均值。\
  \ |\n| `MIN()` | 返回列的最小值。 |\n| `MAX()` | 返回列的最大值。 |\n| `FIRST()` | 返回列的第一个值。 |\n\
  | `LAST()` | 返回列的最后一个值。 |\n\n### 标量函数\n\nSQL 中的标量函数根据输入值返回一个单个值。下面列出了一些最常用的标量函数（注：原文此处误为\
  \ Aggregate Functions）：\n\n| 函数 | 描述 |\n| --- | --- |\n| `LCASE()` | 将字符串列值转换为小写。\
  \ |\n| `UCASE()` | 将字符串列值转换为大写。 |\n| `LEN()` | 返回列中文本值的长度。 |\n| `MID()` | 从具有字符串数据类型的列值中提取子字符串。\
  \ |\n| `ROUND()` | 将数值舍入到最近的整数。 |\n| `NOW()` | 返回当前的系统日期和时间。 |\n| `FORMAT()` | 设置字段显示格式。\
  \ |\n\n## 结构化查询语言 (SQL) 的特性\n\n在当今的技术环境中，无论表面上看起来如何，每个程序或开发工具最终都会将查询和其他命令转换为 SQL。SQL\
  \ 的特性有很多，可以进行更深入的描述，但我们关注的是帮助 SQL 至今保持领先地位的最流行且关键的元素。由于这些强大的能力，没有其他数据库系统能够取得 SQL\
  \ 同样的成功。\n\n### 基础关系\n\nSQL 是一种关系型数据库语言。关系型数据库的表格布局提供了直观的用户界面，使 SQL 易学习和使用。此外，关系模型具有深厚的理论基础，影响了关系型数据库的发展和部署。由于关系范式的普及，SQL\
  \ 已经成为关系型数据库的数据库语言。\n\n### 高性能\n\n可以快速高效地检索大量数据。此外，简单的数据操纵任务（如插入、删除和修改数据）可以在短时间内完成。SQL\
  \ 之所以如此快速，是因为数据库产品在被请求时必须快速交付数据集才能成功。公司许多最顶尖的人才日夜不停地工作于查询引擎，以确保它能生成运行快速的“优化”查询策略。\n\
  \n### 可扩展性\n\nSQL 数据库是可垂直扩展的，这意味着通过增加更多的 RAM、SSD 或 CPU，你可以增加单个服务器的负载。由于数据存储方式（连接表对比于不相关的集合），SQL\
  \ 数据库只能进行垂直扩展——水平扩展仅在 NoSQL 数据库中是可能的。\n\n### 身份验证与安全\n\nSQL Server 包含了多项增强安全的功能，包括通过\
  \ SSL/TLS 进行加密通信、用于加密静态数据的 Windows 数据保护 API (DPAPI)、身份验证和权限。根据登录和密码识别用户或人员的过程被称为身份验证。SQL\
  \ Server 用户的凭据用于对其进行验证。SQL Server 有两种验证模式：Windows 身份验证和混合模式验证。\n\n- Windows 身份验证是默认身份验证技术，也称为集成安全，由于其与\
  \ Windows 的紧密集成。要连接到 SQL Server，特定的 Windows 用户和组账户是被信任的。已经通过身份验证的用户不需要额外的凭据。\n-\
  \ 混合模式验证同时支持 Windows 和 SQL Server。模式和混合模式会跟踪用户名和密码。\n\n### 独立厂商\n\n尽管所有主要的 DBMS\
  \ 制造商都提供了 SQL 支持，但在过去的十年中，没有任何新的 DBMS 产品非常成功。通过极少的转换工作，基于 SQL 的数据库和程序可以从一个厂商的 DBMS\
  \ 移动到另一个厂商的 DBMS。因此，厂商独立是 SQL 最基本的特性之一，也是它在早期吸引人们的关键原因。\n\n### 对各种计算机系统的适应性\n\n\
  基于 SQL 的数据库产品支持大型主机、PC、工作站、专用服务器甚至手持设备。\n\n由于 SQL 的特性：\n\n- 随着应用程序的增长，它们可以从单用户或部门服务器迁移到更大的服务器系统。\n\
  - 来自企业 SQL 数据库的数据也可以被提取并下载到部门或个人数据库中。\n- 在迁移到更昂贵的多用户系统之前，可以在廉价的个人电脑上构建基于 SQL 的数据库应用程序原型。\n\
  \n### IBM (DB2) 的认可与承诺\n\nSQL 由 IBM 研究人员建立，现在已演变为基于 IBM 旗舰 DB2 数据库的关键产品。SQL 支持所有主要的\
  \ IBM 平台，从个人电脑到中型系统再到大型主机。得益于 IBM 的早期努力，其他数据库和系统供应商也效仿 IBM 开发了 SQL 和关系型数据库，由于 IBM\
  \ 的广泛支持和奉献，SQL 更加迅速被市场接受。IBM 的 SQL 产品不仅在 IBM 自己的硬件上，还运行在 HP 和 Sun 等新兴竞争对手的硬件上。\n\
  \n### 结构类似于英语\n\nSQL 基础且易于理解，因为它使用了像 `create`、`select`、`delete` 和 `update` 这样的英语单词。SQL\
  \ 数据库中的列和表可以有长的描述性名称。因此，大多数 SQL 语句都有清晰的意思，可以像自然句子一样阅读。\n\n### 通过编程访问数据库\n\n在编写应用时，程序员利用\
  \ SQL 访问数据库。由于使用相同的 SQL 语句使得交互式和程序化的数据库访问成为可能，与为编程和非计划请求提供分离工具的传统数据库不同，程序的数据库访问组件在嵌入程序之前可以先通过交互式\
  \ SQL 进行测试。\n\n### 事务控制语言\n\n在事务控制语言中，数据库更改的传播被称为事务。事务是数据库管理系统的重要部分，而 TCL（事务控制语言）用于管理这些事务。TCL\
  \ 包括诸如 `commit`、`rollback` 和 `save point` 等命令。\n\n### 数据的多种视角\n\n数据库的创建者可以使用 SQL\
  \ 为不同的用户提供数据库结构和内容的不同视图。例如，可以对组织数据库进行设置，使得每个用户只能访问其所属部门的数据。此外，来自许多数据库表的数据可以合并并以简单的行/列表格形式显示给用户。\n\
  \n### 动态\n\n\n\n\n\nSQL 与其他静态数据库相比，最显著优势之一是能够动态更新和扩展数据库结构，即使在用户访问数据库材料时也是如此。因此，SQL\
  \ 提供了最大的灵活性，允许在线应用程序在数据库适应变化的需求的同时不中断地运行。\n\n## 客户端/服务器架构\n\n客户端-服务器关系是指客户端（或一组客户端）连接到服务器（一个）。SQL\
  \ 实现非常适合具有分布式客户端/服务器系统的应用程序。SQL 数据库将侧重于用户界面的“前端”计算机系统与侧重于数据库管理的“后端”计算机系统连接起来，允许每个系统发挥其最擅长的功能。SQL\
  \ 还允许个人电脑充当网络服务器或大型机数据库的前端，允许通过桌面应用程序访问公司数据。\n\n## SQL 与 Java 的集成\n\n近年来，SQL 与 Java\
  \ 的集成已成为 SQL 开发的一个重点。为了将 Java 语言连接到现有的关系型数据库，Sun Microsystems（`JAVA` 的创建者）发布了 Java\
  \ Database Connectivity `JDBC`（一种允许 Java 程序使用 SQL 访问数据库的标准 API）。它确保了 SQL 在新兴的 Java\
  \ 编程环境中继续保持适用。\n\n## 一些 SQL 语句\n\nSQL 命令用于创建和管理数据库。列表包含了一些最常用的 SQL 命令：\n\n* `Create`:\
  \ 该函数便于创建新的数据库、表、表视图和其他数据库对象。\n* `Update`: 此操作用于更新或更改数据库中存储的数据。\n* `Delete`: 可以此函数从数据库表中删除或移除已保存的记录。它一次从数据库表中清除一个或多个元组（tuples）。\n\
  * `Select`: 该函数允许您从一个或多个数据库表中访问单行或多行。此命令也可以配合 `WHERE` 子句使用。\n* `Drop`: 该函数可用于删除整个表、表视图或任何数据库项。\n\
  * `Insert`: 该函数便于向数据库表中输入数据或记录。记录可以方便地插入到表的单行或多行中。\n\n## 结构化查询语言 (SQL) 的优势\n\n在数据科学领域，由于各种优点，SQL\
  \ 变得越来越流行。它是用户和数据专业人员与数据库通信的优秀查询语言。结构化查询语言的优势或好处如下：\n\n* **不需要编程**：对于数据库管理，SQL 不需要大量的代码行。通过简单的\
  \ SQL 语法规则，我们可以快速访问和维护数据库。得益于这些简单的准则，SQL 是非常用户友好的。\n* **高频率查询处理**：SQL 查询用于快速、有效地从数据库中访问大量数据。插入、删除和更新等数据操作所需的时间更短。\n\
  * **标准化语言**：SQL 符合 ISO 和 ANSI 标准，为全球用户提供了一个统一的平台。\n* **便利性**：结构化查询语言可以在桌面式计算机、笔记本电脑、平板电脑、甚至智能手机上使用。\n\
  * **交互式语言**：SQL 语言易于学习和理解。因为它是一种基础查询语言，我们也可以用它与数据库进行通信。这种语言还用于对复杂的查询接收即时回复。\n* **存在多个数据视图**：SQL\
  \ 语言也为不同的数据库用户构建多个数据库结构视图变得更加容易。\n\n## 结构化查询语言 (SQL) 的缺点\n\n尽管 SQL 拥有所有优势，它也有某些缺点，包括以下：\n\
  \n* **价格**：某些 SQL 版本具有显著的运营成本。因此，某些程序员可能无法使用结构化查询语言。\n* **用户界面困难**：结构化查询语言界面的复杂性使得\
  \ SQL 用户在使用和管理上面临挑战，这是另一个另一个重要的缺点。\n* **部分数据库控制**：公司规定被保密。因此，使用这种查询语言的数据专业人员和用户无法拥有完全的数据库。\n\
  \n## 结构化查询语言 (SQL) 中的数据类型\n\n`SQL Server` 中的每一列、局部变量、表达式和参数都有对应的数据类型。对象可以存储的数据类型（如二进制字符串、日期时间、字符、货币、日期和整数）是由对象的数据类型属性指定的。`SQL\
  \ Server` 自带了一系列系统数据类型，描述了所有可以与之配合的数据类型。\n\n对于每个数据库，数据类型分为三类（图 1.4）：\n\n![](img/Fig01_04.jpg)\n\
  \nFIGURE 1.4 SQL 数据类型。\n\n* 字符串数据类型。\n* 数值数据类型。\n* 时间和日期类型。\n\n### 精确数值类型\n\n它们用于存储精确的数字，如整数、小数和金额。位（bit）可以存储三个值之一：0（零）、1（一）或\
  \ `NULL`（空）。整数数据存储在 `int`、`bigint`、`smallint` 和 `tinyint` 数据类型中。固定精度和刻度的数字存储在 `decimal`\
  \ 和 `numeric` 数据类型中。值得注意的是，`decimal` 和 `numeric` 术语是可以互换。货币值存储在 `money` 和 `small\
  \ money` 数据类型中。\n\n精确数值类型的特征如下表所示：\n\n| 数据类型 | 下限 | 上限 | 内存 |\n| --- | --- | ---\
  \ | --- |\n| **Big int** | –2⁶³ (–9,223,372, 036,854,775,808) | 2⁶³–1 (–9,223,362,\
  \ 036,854,775,807) | 8 字节 |\n| **int** | –2³¹ (–2,147, 483,648) | 2³¹–1 (–2,147,\
  \ 483,647) | 4 字节 |\n| **smallint** | –2¹⁵ (–32,767) | 2¹⁵ (–32,768) | 2 字节 |\n\
  | **tinyint** | 0 | 255 | 1 字节 |\n| **bit** | 0 | 1 | 1 字节/8 位列 |\n| **decimal**\
  \ | –10³⁸+1 | 10³⁸¹–1 | 5–17 字节 |\n| **numeric** | –10³⁸+1 | 10³⁸¹–1 | 5–17 字节 |\n\
  | **money** | –922,337, 203, 685,477.5808 | +922,337, 203, 685,477.5807 | 8 字节 |\n\
  | **Small money** | –214,478.3648 | +214,478.3647 | 4 字节 |\n\n### 数值数据类型\n\n浮点数值数据存储在近似数值数据类型中。它们在科学计算中经常被使用。\n\
  \n| 数据类型 | 下限 | 上限 | 内存 | 精度 |\n| --- | --- | --- | --- | --- |\n| **float(n)**\
  \ | −1.79E + 308 | 1.79E + 308 | 取决于 n 的值 | 7 位 |\n| **real** | −3.40E + 38 | 3.40E\
  \ + 38 | 4 字节 | 15 位 |\n\n### 日期和时间类型\n\n日期时间数据以及日期偏移存储在日期和时间类型中。\n\n| 数据类型 | 存储大小\
  \ | 精度 | 下范围 | 上范围 |\n| --- | --- | --- | --- | --- |\n| **Date time** | 8 字节 |\
  \ 舍入到 .000, .003, .007 的增量上 | 1753-01-01 | 9999-12-31 |\n| **Small date time** |\
  \ 4 字节，固定 | 1 分钟 | 1900-01-01 | 2079-06-06 |\n| **date** | 3 字节，固定 | 1 天 | 0001-01-01\
  \ | 9999-12-31 |\n| **time** | 5 字节 | 100 纳秒 | 00:00:00.0000000 | 23:59:59.9999999\
  \ |\n| **Date time offset** | 10 字节 | 100 纳秒 | 0001-01-01 | 9999-12-31 |\n| **datetime2**\
  \ | 6 字节 | 100 纳秒 | 0001-01-01 | 9999-12-31 |\n\n在开发新应用程序时，使用 `time`、`date`、`datetime2`\
  \ 和 `datetimeoffset` 数据类型。因为这些类型更具可移植性且符合 SQL 标准。此外，`time`、`datetime2` 和 `datetimeoffset`\
  \ 提供了更高的秒精度，且 `datetimeoffset` 支持时区。\n\n### 字符字符串数据类型\n\n\n\n\n\n你可以在字符字符串数据类型（`varchar`）中存储固定长度（`char`）或变长度（`var`）数据。在服务器的代码页中，文本类型可以存储非\
  \ Unicode 数据。\n\n| 数据类型 | 下限 | 上限 | 内存 |\n| --- | --- | --- | --- |\n| `char` |\
  \ 0 字符 | 8000 字符 | n 字节 |\n| `varchar` | 0 字符 | 8000 字符 | n 字节 + 2 字节 |\n| `varchar\
  \ (max)` | 0 字符 | 2³¹ 字符 | n 字节 + 2 字节 |\n| `text` | 0 字符 | 2,147,483,647 字符 | n\
  \ 字节 + 4 字节 |\n\n### Unicode 中的字符字符串数据类型\n\nUnicode 字符字符串数据类型存储固定长度（`nchar`）或变长度（`nvarchar`）的\
  \ Unicode 字符数据。\n\n| 数据类型 | 下限 | 上限 | 内存 |\n| --- | --- | --- | --- |\n| `nchar`\
  \ | 0 字符 | 4,000 字符 | 2 倍 n 字节 |\n| `nvarchar` | 0 字符 | 4,000 字符 | 2 倍 n 字节 + 2\
  \ 字节 |\n| `ntext` | 0 字符 | 1,073,741,823 字符 | 字符串长度的 2 倍 |\n\n### 二进制字符串数据类型\n\n\
  二进制数据类型存储固定和变长度的二进制数据。\n\n| 数据类型 | 下限 | 上限 | 内存 |\n| --- | --- | --- | --- |\n|\
  \ `binary` | 0 字节 | 8,000 字节 | n 字节 |\n| `varbinary` | 0 字节 | 8,000 字节 | 输入数据的长度\
  \ + 2 字节 |\n| `image` | 0 字节 | 2,147,483,647 字节 | |\n\n### 其他数据类型\n\n| 数据类型 | 说明\
  \ |\n| --- | --- |\n| `cursor` | 用于包含游标引用的变量或存储过程输出 参数 |\n| `row version` | 打开数据库以自动创建的唯一的二进制数字。\
  \ |\n| 树层次结构中的树位置 | 由 `hierarchyid` 表示。 |\n| `unique identifier` | 16 字节的 GUID |\n\
  | `sql_variant` | 存储其他数据类型的值 |\n| `XML` | XML 数据应存储在列或 XML 类型的变量中。 |\n| `spatial\
  \ geometry` | 使用平面坐标系表示数据。 |\n| `Type of spatial geography` | 保留椭球（圆地球）信息，例如 GPS\
  \ 经纬度坐标。 |\n| `a table` | 临时存储结果集以供以后处理。 |\n\n## 结构化查询语言 (SQL) 命令\n\nSQL 是一种免费使用的的数据管理解决方案。使用\
  \ SQL 查询检索并操作表中的数据。它被用于在数据库上运行命令或创建数据库。我们可以使用 SQL 命令对数据库中的数据进行查询、过滤、排序、连接、分组和更改。SQL\
  \ Server 中的所有命令分为四类：DML、DDL、DCL 和 TCL 命令（图 1.5）。\n\n![](img/Fig01_05.jpg)\n\n图 1.5\
  \ SQL 命令。\n\n### 数据定义语言 (DDL)\n\n可用于定义数据库模式的 SQL 指令称为 DDL，或数据定义语言。它只管理数据库模式的描述，用于构建和更改数据库中数据库对象的结构。与数据相比，DDL\
  \ 指的是一组用于添加、删除和更改数据库结构的 SQL 指令。这些步骤不应由普通用户执行，普通用户应该使用应用程序访问数据库。\n\nDDL 命令列举如下：\n\
  \n*   **Create (创建)：** 通过此命令创建数据库及其对象（如表、索引、函数、视图、存储过程和触发器）。\n\n    在 SQL 中，你可以使用两种\
  \ `CREATE` 语句之一：\n\n    * `CREATE A TABLE`。\n    * `CREATE A DATABASE`。\n\n### 创建数据库\n\
  \n是计划的数据集合。为了以良好的结构方式存储数据，SQL 的第一步是建立数据库。在 SQL 中构建新数据库，使用 `CREATE DATABASE` 语句。\n\
  \n**语法：**\n\n```\nCREATE DATABASE data_name;\n```\n\n**示例：**\n\n在 SQL 中创建一个新数据库并将数据库命名为\
  \ m_database。\n\n```\nCREATE DATABASE m_database;\n```\n\n### 创建表\n\n我们已经学习了如何创建数据库。为了保存信息，我们需要一个表。在\
  \ SQL 中，使用 `CREATE TABLE` 语句来创建表。众所周知，表由行和列组成。因此，在构建表时，我们必须向 SQL 提供所有相关信息，例如列名、列中存储的数据类型、数据大小等。让我们更详细查看如何利用\
  \ `Construct TABLE` 语句在 SQL 中创建表。\n\n**语法：**\n\n```\nCREATE TABLE t_name\n(\ncol1\
  \ data_type (size),\ncol2 data_type (size),\ncol3 data_type (size),\n);\n```\n\n\
  其中 `t_name`：表名；`col1`、`col2`、`col3`：表的第一、第二、第三列的名字；`data_type`：存储我们想要存储在特定列中的数据类型。\n\
  \n例如，声明的数据类型 `int` 用于整数数据；`size`：定义了可以在特定列中存储的大小，比如我们指定 `data_type` 为 `int` 且 `size`\
  \ 为 15，那么该列就可以存储最大容量限制为 15 位的整数。\n\n此查询将创建一个名为 `Stud_Info` 的表，该表将有三列：`R_NO`、`NAME`\
  \ 和 `SUBJECT`。\n\n```\nCREATE TABLE Stud_info\n(\nR_NO int (5),\nNAME varchar(35),\n\
  SUBJECT varchar(35),\n);\n```\n\n此查询的结果将创建一个名为 `Stud_Info` 的表。`R_NO` 字段类型为 `int`，可以包含五位整数值。接下来的两列\
  \ `NAME` 和 `SUBJECT` 是 `varchar` 类型，可以存储字符，大小 35 表示这两个字段最多可以包含 35 个字符。\n\n*   **Drop\
  \ (删除)：** 用于破坏数据库对象（整个数据库或仅是一个表）。`DROP` 语句删除现有对象，如数据库、表、索引和视图。在 SQL 中，`DROP` 命令停用关系型数据库管理系统\
  \ (RDBMS) 中的某个组件。\n\n**语法：**\n\n```\nDROP object object_name\n```\n\n**示例：**\n\n\
  ```\nDROP TABLE t_name; //t_name: 要删除的表的名。\nDROP DATABASE data_name; //data_name:\
  \ 要删除的数据库名。\n```\n\n*   **Alter (修改)：** 用于更改数据库的结构。`ALTER TABLE` 用于通过添加、删除或丢弃列来修改现有表。它可以用于从现有表中创建和移除约束。\n\
  \n### 向表中添加列\n\n要向现有表添加列，请使用 `ADD`。我们有时需要添加额外信息；在这种情况下，我们不需要重新创建整个数据库；相反，`ADD` 为我们解决了问题。\n\
  \n**语法：**\n\n```\nALTER TABLE t_name\nADD (Col name_1 datatype,\n     Col name_2\
  \ datatype,\n     Col name_n datatype);\n```\n\n### 删除表\n\n`DROP COLUMN` 命令用于从表中删除列。表中不需要的列将被移除。\n\
  \n**语法：**\n\n```\nALTER TABLE t_name\nDROP COLUMN col_name;\n```\n\n*   **Truncate\
  \ (截空)：** 用于删除表中的所有记录，以及为记录预留的所有空间。\n\n**语法：**\n\n```\nTRUNCATE TABLE t_name;\n\
  ```\n\n**示例：**\n\n```\nTRUNCATE TABLE Stud_Info;\n```\n\n*   **Comment (注释)：** 这会将你的备注放入数据字典中。\n\
  \n**语法：**\n\n```\n--(notes, examples)\n```\n\n**示例：**\n\n```\n--select the student\
  \ data\nSELECT * FROM Stud_Info;\n```\n\n*   **Rename (重命名)：** 用于重命名现有的数据库对象。\n\n\
  **语法：**\n\n```\nRENAME old_ob_type ob name TO new_ob_name;\n```\n\n> 为了对上面的代码提供适当的解释，如果我们没有删除‘customers\
  \ old data’表，我们可以如下所示将其重命名为‘customer new data’：\n\n```\nRENAME TABLE customers TO\
  \ customer old_data;\n```\n\n\n\n\n\n这有助于将数据插入到表中。在操作表时，你可以添加额外的记录或行。该语句通过关键字 `INTO`\
  \ 和 `VALUES` 完完成。请考虑下方的用例：\n\n```\nINSERT INTO Student_Info (joining date , year\
  \ of\nBirth) VALUES\n(2014-2-21, ‘1995’);\n```\n\n*   `Update` 修改现有信息。\n\n    我们可以使用\
  \ SQL 来选择和插入数据，但也可以对其进行更改。要更改表中当前现有的数据，请使用 `UPDATE` 命令。它有一个独特的特性，最好通过示例来描述。\n\n\
  \    我们可以使用以下代码，将旧的插入入职日期 2014-2-21 和出生年份 1995 替换为不同的内容。在实例中，这将是 2014 年 9 月 12 日：\n\
  \n```\nUPDATE Stud_Info\nSET Date of joining = ‘2014-09-12’\nWHERE year of Birth\
  \ = 1995;\n```\n\n*   `Delete` 是一个删除数据的命令。\n\n    `DELETE` 命令与 `TRUNCATE` 相同，但有一个显著的例外。`DELETE`\
  \ 允许我们只删除表中所需的记录，而 `TRUNCATE` 则允许我们删除表中的所有记录。\n\n    例如，下行代码将删除“sales”表中的所有记录：\n\
  \n```\nDELETE FROM Student_Info;\n```\n\n## 数据控制语言 (DCL)\n\n数据控制语言是一种 SQL 语法，允许您仅通过几条指令管理用户对数据库的访问。如果数据库管理员拥有数据库的完全访问权限，他们也可以管理用户访问。\n\
  \nDCL 有两种命令：\n\n*   `Grant`：`GRANT` 赋予用户访问特定功能的权限。要运行该命令，请使用以下语法：\n\n```\nDELETE\
  \ FROM sales;GRANT type_of_permission ON\ndatabase_name.table_name TO ‘@username’@’localhost’\n\
  ```\n\n> 该行代码可用于授予特定类型的权限，例如对特定数据表中的资源的完全访问或受限访问。\n\n*   `Revoke`：`REVOKE` 子句是 `GRANT`\
  \ 语句的相反，用于撤销数据库用户的权限和权利。另一方面，它们的语法是相同的：\n\n```\nREVOKE type_of_permission ON database_name.table_name\n\
  FROM ‘username’@’localhost’\n```\n\n> 句话说，与其授予某人权限，不如撤销他们的权限。\n\n## 事务控制语言 (TCL)\n\
  \n在专业环境中使用关系型数据库管理系统时，保持事务控制至关重要。换句话说，每当你在数据库中插入、删除或更改数据时。\n\n为了处理这些，你必须熟悉 TCL 命令，特别是：\n\
  \n*   `Commit`：你所做的更改将永久保留在数据库中，其他用户将能够访问更新后的版本。\n\n    假设你想将“Customers”表中记录中第二个客户的姓氏从\
  \ Amit 改为 Astitiva：\n\n```\nUPDATE customers\nSET last_name = ‘Astitiva’\nWHERE\
  \ customer_id = 2;\n```\n\n> 然而，任务尚未完成，因为数据库系统的其他用户无法检测到我们是否进行了任何修改。要完成操作，请在 `UPDATE`\
  \ 块的末尾添加 `COMMIT` 语句：\n\n```\nUPDATE customers\nSET last_name = ‘Astitiva’\nWHERE\
  \ customer_id = 2\nCOMMIT;\n```\n\n> 当你使用 `COMMIT` 时，事务会被保存到数据库中。修改是不可逆的。\n\n* \
  \  `Rollback`：致力于该事业的国家数量可能会迅速增加。例如，如果你是管理员，可能每天需要使用 `COMMIT` 20 次。\n\n    结果，你可能会意外插入或更改数据。事务控制语言函数\
  \ `ROLLBACK` 允许通过将数据库恢复到原始提交状态来撤销任何不想永久保留的更改。\n\n    在代码末尾添加 `ROLLBACK;` 使用此功能：\n\
  \n```\nUPDATE customers\nSET last_name = ‘Astitiva’\nWHERE customer_id = 2\nCOMMIT;\n\
  ROLLBACK;\n```\n\n*   `Savepoint`：`SAVEPOINT` 是事务中的逻辑回滚点。如果你设置了保存点然后遇到错误，可以利用回滚选项撤销到该点为止所做的一切。\n\
  \n```\nSAVEPOINT savepoint_name;\n```\n\n## SQL 中的事务\n\n事务是在数据库上执行的逻辑工作单元。事务是人类手动完成或由数据库应用程序自动完成的逻辑顺序单元或工作序列。事务是向数据库传输一个或多个更改。表事务的一个示例是创建、更新或从该表中删除记录。为了保护数据完整性并处理数据库问题，跟踪这些事务至关重要。\n\
  \n在实践中，你会将多个 SQL 查询组合在一起并作为事务的一部分同时运行。\n\n### 事务的特性\n\n事务包含下面列出的四个标准属性，通常缩写为 ACID。\n\
  \n*   `Atomicity`（原子性）确保工作单元内的所有过程成功完成。否则，事务将在失败点中止，所有之前的活动都将被撤销。\n\n*   当事务成功提交时，`consistency`（一致性）确保数据库状态切换正确。\n\
  \n*   `Isolation`（隔离性）允许事务相互独立执行，同时对它们彼此保持透明。\n\n*   `Durability`（持久性）确保数据库状态切换正确。\n\
  \n### 控制事务的命令\n\n*   `Isolation`（隔离性）允许事务相互独立执行，同时对它们彼此保持透明。\n\n*   `Durability`（持久性）确保数据库状态切换正确。\n\
  \n### 事务命令\n\n*   `Atomicity`（原子性）确保工作单元内的所有过程成功完成。否则，事务将在失败点中止，所有之前的活动都将被撤销。\n\n\
  *   当事务成功提交时，`consistency`（一致性）确保数据库状态切换正确。\n\n*   `Isolation`（隔离性）允许事务相互独立执行，同时对它们彼此保持透明。\n\
  \n*   `Durability`（持久性）确保数据库状态切换正确。\n\n### 事务命令\n\n*   `Atomicity`（原子性）确保工作单元内的所有过程成功完成。否则，事务将在失败点中止，所有之前的活动都将被撤销。\n\
  \n*   当事务成功提交时，`consistency`（一致性）确保数据库状态切换正确。\n\n*   `Isolation`（隔离性）允许事务相互独立执行，同时对它们彼此保持透明。\n\
  \n*   `Durability`（持久性）确保数据库状态切换正确。\n\n### 事务命令\n\n*   `Atomicity`（原子性）确保工作单元内的所有过程成功完成。否则，事务将在失败点中止，所有之前的活动都将被撤销。\n\
  \n*   当事务成功提交时，`consistency`（一致性）确保数据库状态切换正确。\n\n*   `Isolation`（隔离性）允许事务相互独立执行，同时对它们彼此保持透明。\n\
  \n*   `Durability`（持久性）确保数据库状态切换正确。\n\n### 事务命令\n\n*   `Atomicity`（原子性）确保工作单元内的所有过程成功完成。否则，事务将在失败点中止，所有之前的活动都将被撤销。\n\
  \n*   当事务成功提交时，`consistency`（一致性）确保数据库状态切换正确。\n\n*   `Isolation`（隔离性）允许事务相互独立执行，同时对它们彼此保持透明。\n\
  \n*   `Durability`（持久性）确保数据库状态切换正确。\n\n### Commit（命令）\n\n`COMMIT` 命令用于将更改保存到数据库中。\n\
  \n**示例：**\n\n考虑 CUSTOMERS 中的以下记录：\n\n| 序号 | ID | 姓名 | 年龄 | 地址 | 工资 (USD) |\n| ---\
  \ | --- | --- | --- | --- | --- |\n| **1** | LBR114 | Alex | 23 | New York | 25,000\
  \ |\n| **2** | LBR115 | Joshua | 21 | Vegas | 52,000 |\n| **3** | LBR116 | Nick\
  \ | 22 | Maryland | 47,000 |\n| **4** | LBR117 | Johnny | 20 | Boston | 89,000 |\n\
  | **5** | LBR118 | Chris | 28 | Ohio | 53,000 |\n| **6** | LBR119 | Zyndaya | 25\
  \ | Omaha | 48,000 |\n| **7** | LBR120 | Tom | 30 | California | 36,000 |\n\n下例将删除表中所有年龄为\
  \ 30 的所有记录，然后将更改提交到数据库。\n\n```\nSQL> DELETE FROM CUSTOMERS\n   WHERE AGE = 30;\n\
  SQL> COMMIT;\n```\n\n结果是，表中将移除行，SELECT 命令产生以下结果：\n\n| 序号 | ID | 姓名 | 年龄 | 地址 | 工资\
  \ (USD) |\n| --- | --- | --- | --- | --- | --- |\n| **1** | LBR114 | Alex | 23 |\
  \ New York | 25,000 |\n| **2** | LBR115 | Joshua | 21 | Vegas | 52,000 |\n| **3**\
  \ | LBR116 | Nick | 22 | Maryland | 47,000 |\n| **4** | LBR117 | Johnny | 20 | Boston\
  \ | 89,000 |\n| **5** | LBR118 | Chris | 28 | Ohio | 53,000 |\n| **6** | LBR119\
  \ | Zyndaya | 25 | Omaha | 48,000 |\n\n### Rollback（命令）\n\n它是一个允许你回到过去的命令。该事务命令用于撤销尚未记录到数据库中的事务。该命令仅用于撤销自\
  \ COMMIT 或 ROLLBACK 命令之后发生的事务。\n\n\n\n\n\n`ROLLBACK` 命令具有以下语法：\n\n```\nROLLBACK;\n\
  ```\n\n**示例：**\n\n考虑 `CUSTOMERS` 表中的以下记录：\n\n| Sr. No. | ID | Name | Age | Address\
  \ | Salary (USD) |\n| --- | --- | --- | --- | --- | --- |\n| **1** | LBR114 | Alex\
  \ | 23 | New York | 25,000 |\n| **2** | LBR115 | Joshua | 21 | Vegas | 52,000 |\n\
  | **3** | LBR116 | Nick | 22 | Maryland | 47,000 |\n| **4** | LBR117 | Johnny |\
  \ 20 | Boston | 89,000 |\n| **5** | LBR118 | Chris | 28 | Ohio | 53,000 |\n| **6**\
  \ | LBR119 | Zyndaya | 25 | Omaha | 48,000 |\n| **7** | LBR120 | Tom | 30 | California\
  \ | 36,000 |\n\n以下示例将删除表中所有年龄为 30 的记录，然后回滚（ROLLBACK）数据库的修改。\n\n```\nSQL> DELETE\
  \ FROM CUSTOMERS\n   WHERE AGE = 25;\nSQL> ROLLBACK;\n```\n\n结果是，删除操作对表没有影响，`SELECT`\
  \ 命令产生以下结果。\n\n| Sr. No. | ID | Name | Age | Address | Salary (USD) |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| **1** | LBR114 | Alex | 23 | New York | 25,000 |\n\
  | **2** | LBR115 | Joshua | 21 | Vegas | 52,000 |\n| **3** | LBR116 | Nick | 22\
  \ | Maryland | 47,000 |\n| **4** | LBR117 | Johnny | 20 | Boston | 89,000 |\n| **5**\
  \ | LBR118 | Chris | 28 | Ohio | 53,000 |\n| **6** | LBR119 | Zyndaya | 25 | Omaha\
  \ | 48,000 |\n| **7** | LBR120 | Tom | 30 | California | 36,000 |\n\n### Savepoint（命令）\n\
  \n它允许你保存一个时间点，让我们能够回到之前的状态，而无需回滚整个事务。\n\n`SAVEPOINT` 命令具有以下语法。\n\n```\nSAVEPOINT\
  \ SAVEPOINT_NAME;\n```\n\n此命令仅用于在所有事务语句中间创建一个 `SAVEPOINT`。若要撤销一组事务，请使用 `ROLLBACK`\
  \ 命令。\n\n以下是回滚到 `SAVEPOINT` 的语法。\n\n```\nROLLBACK TO SAVEPOINT_NAME;\n```\n\n示例显示了如何从\
  \ `CUSTOMERS` 数据库中删除三条独立的记录。在每次删除之前，你应该创建一个 `SAVEPOINT`，这样你就可以随时 `ROLLBACK` 到任何\
  \ `SAVEPOINT`，从而将所需的数据恢复到之前的状态。\n\n**示例：**\n\n考虑 `CUSTOMERS` 表中的以下记录。\n\n| Sr. No.\
  \ | ID | Name | Age | Address | Salary (USD) |\n| --- | --- | --- | --- | --- |\
  \ --- |\n| **1** | LBR114 | Alex | 23 | New York | 25,000 |\n| **2** | LBR115 |\
  \ Joshua | 21 | Vegas | 52,000 |\n| **3** | LBR116 | Nick | 22 | Maryland | 47,000\
  \ |\n| **4** | LBR117 | Johnny | 20 | Boston | 89,000 |\n| **5** | LBR118 | Chris\
  \ | 28 | Ohio | 53,000 |\n| **6** | LBR119 | Zyndaya | 25 | Omaha | 48,000 |\n|\
  \ **7** | LBR120 | Tom | 30 | California | 36,000 |\n\n操作列在下面的代码块：\n\n```\nSQL>\
  \ SAVEPOINT SP1;\nSavepoint created.\nSQL> DELETE FROM CUSTOMERS WHERE ID=LBR114;\n\
  1 row deleted.\nSQL> SAVEPOINT SP2;\nSavepoint created.\nSQL> DELETE FROM CUSTOMERS\
  \ WHERE ID= LBR117;\n1 row deleted.\nSQL> SAVEPOINT SP3;\nSavepoint created.\nSQL>\
  \ DELETE FROM CUSTOMERS WHERE ID=LBR120;\n1 row deleted.\n```\n\n现在三次删除已经发生，让我们假设你改变了主意，并决定\
  \ `ROLLBACK` 到 `SP3` `SAVEPOINT`。因为 `SP2`是在初始删除之后建立的，所以最后两次删除被撤销了。\n\n```\nSQL>\
  \ ROLLBACK TO SP3;\nRollback complete.\n```\n\n由于你回滚到了 `SP3`，因此只发生了第一次删除。\n\n```\n\
  SQL> SELECT * FROM CUSTOMERS;\n```\n\n| Sr. No. | ID | Name | Age | Address | Salary\
  \ (USD) |\n| --- | --- | --- | --- | --- | --- |\n| **1** | LBR114 | Alex | 23 |\
  \ New York | 25,000 |\n| **2** | LBR115 | Joshua | 21 | Vegas | 52,000 |\n| **3**\
  \ | LBR116 | Nick | 22 | Maryland | 47,000 |\n| **4** | LBR117 | Johnny | 20 | Boston\
  \ | 89,000 |\n| **5** | LBR118 | Chris | 28 | Ohio | 53,000 |\n| **6** | LBR119\
  \ | Zyndaya | 25 | Omaha | 48,000 |\n选择了 6 行\n\n### Release Savepoint\n\n这是一个允许你释放保存状态的命令。\n\
  \n`RELEASE SAVEPOINT` 命令用于删除之前建立的 `SAVEPOINT`。\n\n`RELEASE SAVEPOINT` 命令具有以下语法。\n\
  \n```\nRELEASE SAVEPOINT SAVEPOINT_NAME;\n```\n\n如果 `SAVEPOINT` 已被释放，我们无法再次使用 `ROLLBACK`\
  \ 命令撤销自上一个 `SAVEPOINT` 之后进行的事务。\n\n### Set Transaction\n\n这是一个允许你设置事务的命令。可以使用 `SET\
  \ TRANSACTION` 命令启动数据库事务。该命令用于定义下一个事务的属性。例如，你可以使事务变为只读或读写。\n\n`SET TRANSACTION`\
  \ 命令具有以下语法。\n\n```\nSET TRANSACTION [READ WRITE | READ-ONLY ];\n```\n\n## SQL 中的视图\
