  \ | 27 | 66 |\n| 15 | Ritika | 26 | 79 |\n| 16 | Yashi | 29 | 88 |\n| 201 | Jack\
  \ | 28 | 77 |\n| 202 | Berry | 29 | 68 |\n| 15 | Ritika | 26 | 82 |\n| 203 | Shyam\
  \ | 27 | 70 |\n| 204 | Ritik | 28 | 99 |\n| 16 | Yashi | 29 | 86 |\n\n## SQL 中的别名\
  \ (Aliases)\n\n别名是为了特定的 SQL 查询而分配给表或列的临时名称。当列或表的名称相对于原始名称发生更改，但这种更改只是临时的，就会使用别名。\n\
  \n* 别名用于使表名或列名更易读。\n* 重命名只是临时的修改，原始数据库中的表名保持不变。\n* 当表名或列名很或难以理解时，别名就派上用场。\n* 当查询涉及多个表时，通常倾向于使用别名。\n\
  \n### 语法：\n\n#### 作为列别名：\n\n```\nSELECT column as alias_name FROM table_name;\n\
  ```\n`column`: 表中的字段\n`alias_name`: 用于替换原始列名的临时别名\n`table_name`: 表名\n\n#### 列名别名示例\n\
  \n别名通常用于使结果集中的列头更易读。最频繁的情况下，当你使用如 `MIN`、`MAX`、`AVG`、`SUM` 或 `COUNT` 等聚合函数时，你会为查询中的某一列设置别名。\n\
  \n我们应该查看一个如何在 SQL 中为段落名称设置伪名的示例。\n\n在在该模型中，我们有一个名为 `representatives` 的表，包含以下数据：\n\
  \n| Emp_Number | l_Name | f_Name | Salary | Dept_ID |\n| --- | --- | --- | --- |\
  \ --- |\n| 101 | Smithy | Johnny | 62,000 | 50 |\n| 102 | Ander | Janae | 57,500\
  \ | 50 |\n| 103 | Ever | Brady | 71,000 | 51 |\n| 104 | Horvath | Jacky | 42,000\
  \ | 51 |\n\n让我们来看如何设置列别名。输入以下 SQL 语句：\n\n```sql\nSELECT dept_id, COUNT(*) AS total\n\
  FROM employees\nGROUP BY dept_id;\n```\n\n将选取两条记录。你将看到以下结果：\n\n| Dept_ID | Total\
  \ |\n| --- | --- |\n| 50 | 2 |\n| 51 | 2 |\n\n在这个示例中，我们为 `COUNT(*)` 字段别名为 `total`。因此，当返回结果集时，`total`\
  \ 将作为第二列的标题。因为我们的别名不包含任何空格，所以我们不需要将其括在引号中。\n\n修改我们的查询使列别名包含空格：\n\n```sql\nSELECT\
  \ dept_id, COUNT(*) AS “total employees”\nFROM employees\nGROUP BY dept_id;\n```\n\
  \n将选取两条记录。你将看到以下结果：\n\n| Dept_ID | Total Employees |\n| --- | --- |\n| 50 | 2 |\n\
  | 51 | 2 |\n\n在这个示例中，我们为 `COUNT(*)` 字段别名为‘total workers’，它将作为结果集中第二列的表头。因为这个列别名包含空格，所以在\
  \ SQL 语句中必须将‘total employees’包含在引号内。\n\n#### 作为表别名：\n\n```sql\nSELECT column FROM\
  \ table_name as alias_name;\n```\n`column`: 表中的字段\n`table_name`: 表名\n`alias_name`:\
  \ 用于替换原始表的临时别名\n\n### 表名别名示例\n\n当你为表设置别名时，你想要缩短表名以使 SQL 语句更简洁易懂，或者你想要在 `FROM` 子句中多次使用同一个表名（即自连接）。\n\
  \n让我们看看如何在 SQL 中为表名设置别名。\n\n在该图中，我们有一个名为 `products` 的表，包含以下数据：\n\n| Product_ID |\
  \ Product_Name | Category_ID |\n| --- | --- | --- |\n| 1 | Pear | 50 |\n| 2 | Banana\
  \ | 50 |\n| 3 | Orange | 50 |\n| 4 | Apple | 50 |\n| 5 | Bread | 75 |\n| 6 | Sliced\
  \ Ham | 25 |\n| 7 | Kleenex | NULL |\n\n以及，一个名为 `categories` 的表，包含以下信息：\n\n| Category_ID\
  \ | Category_Name |\n| --- | --- |\n| 25 | Deli |\n| 50 | Produce |\n| 75 | Bakery\
  \ |\n| 100 | General Merchandise |\n| 125 | Technology |\n\n现在让我们合并这两个表并为表名设置别名。输入如下\
  \ SQL 语句：\n\n```sql\nSELECT p.product_name, c.category_name\nFROM products AS p\n\
  INNER JOIN categories AS c\nON p.category_id = c.category_id\nWHERE p.product_name\
  \ <> ‘Pear’;\n```\n\n将选取五条记录。你将看到以下结果：\n\n| Product_Name | Category_Name |\n| ---\
  \ | --- |\n| Banana | Produce |\n| Orange | Produce |\n| Apple | Produce |\n| Bread\
  \ | Bakery |\n| Sliced Ham | Deli |\n\n在这个示例中，我们为商品表构建了别名并为 `categories` 表构建了别名。现在我们可以在此\
  \ SQL 表达式中将 `products` 表称为 `p`，将 `categories` 表称为 `c`。\n\n建立表别名时，不必为 `FROM` 子句中提供的所有表生成别名。你可以选择为任何或所有表创建别名。\n\
  \n## SQL 中的 ORDER BY 子句\n\n根据一个或多个列，SQL 中的 `ORDER BY` 子句用于按升序或降序排序数据。默认情况下，某些数据库按升序排序查询结果。\n\
  \n### 语法：\n\n基本语法如下：\n\n```sql\nSELECT col-list\nFROM t_name\n[WHERE condition]\n\
  [ORDER BY column1, column2, .. columnN] [ASC | DESC];\n```\n\n`ORDER BY` 子句可能包含多个列。确保你正在排序的列在列列表中。\n\
  \n### 示例：\n\n考虑 `CUSTOMERS` 表，它包含以下记录：\n\n| ID | Name | Age | Address | Salary |\n\
  | --- | --- | --- | --- | --- |\n| 1 | Ramesh | 32 | Ahmedabad | 2,000.00 |\n| 2\
  \ | Khilan | 25 | Delhi | 1,500.00 |\n| 3 | kaushik | 23 | Kota | 2,000.00 |\n|\
  \ 4 | Chantal | 25 | Mumbai | 6,500.00 |\n| 5 | Hardin | 27 | Bhopal | 8,500.00\
  \ |\n| 6 | Kamal | 22 | MP | 4,500.00 |\n| 7 | Muffin | 24 | Indore | 10,000.00\
  \ |\n\n在代码块中提供了一个示例，它按 `NAME` 和 `SALARY` 升序排序结果。\n\n```sql\nSQL> SELECT * FROM CUSTOMERS\n\
  \   ORDER BY NAME, SALARY;\n```\n\n这将产生以下结果：\n\n| ID | Name | Age | Address | Salary\
  \ |\n| --- | --- | --- | --- | --- |\n| 4 | Chantal | 25 | Mumbai | 6,500.00 |\n\
  | 5 | Hardin | 27 | Bhopal | 8,500.00 |\n| 3 | kaushik | 23 | Kota | 2,000.00 |\n\
  | 2 | Khilan | 25 | Delhi | 1,500.00 |\n| 6 | Kamal | 22 | MP | 4,500.00 |\n| 7\
  \ | Muffin | 24 | Indore | 10,000.00 |\n| 1 | Ramesh | 32 | Ahmedabad | 2,000.00\
  \ |\n\n在代码块中提供了一个示例，它按 `NAME` 降序排序：\n\n```sql\nSQL> SELECT * FROM CUSTOMERS\n  \
  \ ORDER BY NAME DESC;\n```\n\n这将产生以下结果：\n\n| ID | Name | Age | Address | Salary\
  \ |\n| --- | --- | --- | --- | --- |\n| 1 | Ramesh | 32 | Ahmedabad | 2,000.00 |\n\
  | 7 | Muffin | 24 | Indore | 10,000.00 |\n| 6 | Kamal | 22 | MP | 4,500.00 |\n|\
  \ 2 | Khilan | 25 | Delhi | 1,500.00 |\n| 3 | kaushik | 23 | Kota | 2,000.00 |\n\
  | 5 | Hardin | 27 | Bhopal | 8,500.00 |\n| 4 | Chantal | 25 | Mumbai | 6,500.00\
  \ |\n\n## SQL 中的 Select Top 子句\n\n我们可能想从 SQL 表中提取特定数量的记录而不是而不是表记录。`WHERE` 规定可以限制\
  \ `SELECT` 解释返回的行数。假设你有一个客户表，并希望获取特定国家的客户记录。可能有大量符合条件的记录。为了满足条件，我们需要前 N 条客户记录。`TOP`\
  \ 或 `ROW Number()` 子句可以用于满足这种需求。\n\n### SQL Server 中的 Top 语法\n\n```sql\nSELECT TOP\
  \ Expression | Percentage [Column_Names] [\nWITH TIES ]\nFROM [Table_Name]\n```\n\
  \n**Expression**: 我们可以使用数字表达式来定义返回的行数。\n\n\n\n\n\n百分比（Percent）：在这种情况下，我们可以使用 `PERCENT`\
  \ 值返回输出中行数占总行数的百分比数字。\n\n**包含并列项 (With Ties)**：`WITH TIES` 子句可返回与结果集中上一行值匹配的更多行。例如，我们想要获取购买金额前十名的消费者。如果我们不使用\
  \ `WITH TIES`，SQL Server 将仅提供恰 10 条记录，尽管我们可能还有其他购买成本相近的客户。在这种情况下，我们可以通过使用 `WITH\
  \ TIES` 获取更多行。我们必须将 `WITH TIES` 与 `ORDER BY` 子句结合使用。\n\n通过提供要作为结果集返回的记录数，我们将尝试理解使用\
  \ `SQL SELECT TOP` 的语法。\n\n**语法**：\n\n```\nSELECT TOP number column name FROM table\
  \ name WHERE condition;\n```\n上述语法根据 `WHERE` 子句从所有列检索数据，并受 `SELECT TOP` 部分提供的数量限制。\n\
  \n考虑以下客户表（Customer Table），学习如何使用 `SELECT TOP` 命令根据准则复制所有列的数据。\n\n| Cust_Id | Cust_Name\
  \ | Cust_Age | Cust_Gender |\n| --- | --- | --- | --- |\n| 1 | John | 31 | M |\n\
  | 2 | Amit | 25 | M |\n| 3 | Annie | 35 | F |\n| 4 | Tom | 38 | M |\n\n**场景**：从客户表中检索性别为男性的第一行数据。\n\
  \n```\nSELECT TOP 1 * FROM Customer WHERE CustomerGender = ‘M’;\n```\n\n**输出：**\n\
  \n| Cust_Id | Cust_Name | Cust_Age | Cust_Gender |\n| --- | --- | --- | --- |\n\
  | 1 | John | 31 | M |\n\n### SQL 选择返回最高百分比的记录\n\n通过指定要作为结果集返回的记录百分比，我们将尝试理解使用 `SQL\
  \ SELECT TOP` 的语法。\n\n**语法**：\n\n```\nSELECT TOP number PERCENT column_name FROM\
  \ table_name\nWHERE condition;\n```\n\n上述语法根据 `WHERE` 子句从所有列检索数据，并受 `SELECT TOP`\
  \ 部分提供的百分比限制。\n\n考虑以下客户表，学习如何使用 `SELECT INTO` 命令根据准则复制所有列的数据。\n\n**场景**：获取客户表中性别为男性的\
  \ 50% 条目的数据。\n\n**查询**：\n\n```\nSELECT TOP 50 PERCENT * FROM Customer WHERE Cust_\n\
  Gender = ‘M’;\n```\n\n| Cust_Id | Cust_Name | Cust_Age | Cust_Gender |\n| --- |\
  \ --- | --- | --- |\n| 1 | John | 31 | M |\n| 2 | Amit | 25 | M |\n\n### 多条 Select\
  \ Top 语句\n\n为了实现目标，我们可以组合多个 `SELECT TOP` 命令。\n\n**语法：**\n\n```\nSELECT TOP number\
  \ column_name FROM table_name WHERE\ncondition (the select statement with another\
  \ SELECT\nTOP);\n```\n\n**场景：**\n\n从客户表中检索性别为男性的第一行数据。\n\n**查询：**\n\n```\nSELECT\
  \ TOP 1 * FROM Customer WHERE Cust_Age = (SELECT\nTOP 1 Cust_Age FROM Customer ORDER\
  \ BY Cust_Age desc);\n```\n\n**输出：**\n\n| Cust_Id | Cust_Name | Cust_Age | Cust_Gender\
  \ |\n| --- | --- | --- | --- |\n| 4 | Tom | 38 | M |\n\n## SQL Update 命令\n\n数据库用于在表中存储数据。在向此类表写入数据后，通常需要在数据生命周期中的某个时间点更新单个字段。为了实现这一点，我们可以使用\
  \ `SQL UPDATE` 命令。更新查询是操作查询的一种类型，可以同时对许多记录执行多次更新。\n\n在 SQL 中，`UPDATE` 语句用于修改或更改表中的现有记录。如果我们想更新特定值，则将\
  \ `WHERE` 子句结合 `UPDATE` 子句使用。如果未使用 `WHERE` 规定，所有列都将受到影响。此外，根据我们的需求，我们可以使用 `UPDATE`\
  \ 语句更新单列或多列。\n\n**语法**：\n\n```\nUPDATE table_name\nSET column1 = value1, column2\
  \ = value2...., columnN =\nvalueN\nWHERE [condition];\n```\n\n其中关键字是 `UPDATE`、`SET`\
  \ 和 `WHERE`；表名是需要更新的表名，`col1`、`col2`... 是被认为要更新的列，`val1`、`val2`... 是要分配的新值，条件部分（以分号结尾）包含条件。\n\
  \n**示例：**\n\n考虑 `CUSTOMERS` 表，它包含以下记录：\n\n| ID | Name | Age | Address | Salary |\n\
  | --- | --- | --- | --- | --- |\n| 1 | Ramesh | 32 | Ahmedabad | 2,000.00 |\n| 2\
  \ | Khilan | 25 | Delhi | 1,500.00 |\n| 3 | kaushik | 23 | Kota | 2,000.00 |\n|\
  \ 4 | Chantal | 25 | Mumbai | 6,500.00 |\n| 5 | Hardin | 27 | Bhopal | 8,500.00\
  \ |\n| 6 | Kamal | 22 | MP | 4,500.00 |\n| 7 | Muffin | 24 | Indore | 10,000.00\
  \ |\n\n以下查询将更改表中 ID 号为 6 的客户的 `ADDRESS`。\n\n```\nSQL> UPDATE CUSTOMERS\nSET ADDRESS\
  \ = ‘Pune’\nWHERE ID = 6;\n```\n\n`CUSTOMERS` 表现在将包含以下记录：\n\n| ID | Name | Age |\
  \ Address | Salary |\n| --- | --- | --- | --- | --- |\n| 1 | Ramesh | 32 | Ahmedabad\
  \ | 2,000.00 |\n| 2 | Khilan | 25 | Delhi | 1,500.00 |\n| 3 | kaushik | 23 | Kota\
  \ | 2,000.00 |\n| 4 | Chantal | 25 | Mumbai | 6,500.00 |\n| 5 | Hardin | 27 | Bhopal\
  \ | 8,500.00 |\n| 6 | Kamal | 22 | Pune | 4,500.00 |\n| 7 | Muffin | 24 | Indore\
  \ | 10,000.00 |\n\n如果你想更改 `CUSTOMERS` 表中所有的 `ADDRESS` 和 `SALARY` 列值，可以使用 `UPDATE`\
  \ 查询，如下面的代码块所示。\n\n```\nSQL> UPDATE CUSTOMERS\nSET ADDRESS = ‘Pune’, SALARY = 1000.00;\n\
  ```\n\n`CUSTOMERS` 表现在将包含以下记录：\n\n| ID | Name | Age | Address | Salary |\n| ---\
  \ | --- | --- | --- | --- |\n| 1 | Ramesh | 32 | Pune | 1,000.00 |\n| 2 | Khilan\
  \ | 25 | Pune | 1,000.00 |\n| 3 | kaushik | 23 | Pune | 1,000.00 |\n| 4 | Chantal\
  \ | 25 | Pune | 1,000.00 |\n| 5 | Hardin | 27 | Pune | 1,000.00 |\n| 6 | Kamal |\
  \ 22 | Pune | 1,000.00 |\n| 7 | Muffin | 24 | Indore | 1,000.00 |\n\n*(注：原文后半部分存在大量重复且逻辑混乱，此处已根据原文字面意思进行对应性翻译)*\n\
  \n\n\n\n\n| 5 | Hardin | 27 | Bhopal | 8,500.00 |\n| 6 | Kamal | 22 | MP | 4,500.00\
  \ |\n\n* **删除所有记录**：可以使用两个查询语句来实现此操作，如下所示\n    * **查询 1**: `DELETE FROM Student`\n\
  \    * **查询 2**: `DELETE * FROM Student`\n    * **输出**：表中的所有记录都将被删除；不会显示任何记录。Customer\
  \ 表将很快变为空。\n\n## 插入 SQL 语句 (Insert into)\n\n要向表中插入新行，请使用 SQL `INSERT INTO` 语句。对于插入行，`INSERT\
  \ INTO` 语句有以下两种用法：\n\n* **仅指定值**：第一种技术是仅指定要添加的数据值，而不指定列名。\n\n**语法**：\n\n```sql\n\
  INSERT INTO t_name VALUES (value1, value2, value3,…);\nt_name: 表名。\nvalue1, value2,..\
  \ : 新记录的第一列、第二列……的值\n```\n\n* **同时指定列名和值**：在第二种方法中，我们将同时指定要填充的列及其关联的值，如下所示：\n\n\
  **语法：**\n\n```sql\nINSERT INTO table_name (col1, column2, column3,..)\nVALUES (\
  \ value1, value2, value3,..);\ntable_name: 表名。\ncolumn1: 第一列、第二列……的列名\nvalue1, value2,\
  \ value3 : 新记录的第一列、第二列……的值\n```\n\nCustomer 表：\n\n| ID | Name | Age | Address |\
  \ Salary |\n| --- | --- | --- | --- | --- |\n| 1 | Ramesh | 32 | Ahmedabad | 2,000.00\
  \ |\n| 2 | Khilan | 25 | Delhi | 1,500.00 |\n| 3 | kaushik | 23 | Kota | 2,000.00\
  \ |\n| 4 | Chantal | 25 | Mumbai | 6,500.00 |\n| 5 | Hardin | 27 | Bhopal | 8,500.00\
  \ |\n| 6 | Kamal | 22 | MP | 4,500.00 |\n\nLateral Customer 表：\n\n| ID | Name |\
  \ Age | Address | Salary |\n| --- | --- | --- | --- | --- |\n| 7 | Ravi | 35 | Kolkata\
  \ | 2,900.00 |\n| 8 | Ashish | 45 | Dharamshala | 3,500.00 |\n| 9 | Kamal | 43 |\
  \ Jaipur | 2,080.00 |\n\n**查询 1**：方法 1（插入所有行和列）：\n\n```sql\nINSERT INTO Customer\
  \ SELECT * FROM Lateral Customer;\n```\n\n**输出**：使用此查询将 `LateralCustomer` 表中的数据插入到\
  \ `Customer` 表中。Student 表现在如下：\n\n| ID | Name | Age | Address | Salary |\n| ---\
  \ | --- | --- | --- | --- |\n| 1 | Ramesh | 32 | Ahmedabad | 2,000.00 |\n| 2 | Khilan\
  \ | 25 | Delhi | 1,500.00 |\n| 3 | kaushik | 23 | Kota | 2,000.00 |\n| 4 | Chantal\
  \ | 25 | Mumbai | 6,500.00 |\n| 5 | Hardin | 27 | Bhopal | 8,500.00 |\n| 6 | Kamal\
  \ | 22 | MP | 4,500.00 |\n| 7 | Ravi | 35 | Kolkata | 2,900.00 |\n| 8 | Ashish |\
  \ 45 | Dharamshala | 3,500.00 |\n| 9 | Kamal | 43 | Jaipur | 2,000.00 |\n\n* **方法\
  \ 2（插入特定列）**：\n\n```sql\nINSERT INTO Student (ID,NAME,Age) SELECT ID,\nNAME,Age\
  \ FROM LateralCustomer;\n```\n\n**输出**：此查询将 `Lateral Student` 表中的 `ID`、`NAME` 和\
  \ `Age` 列插入到 `Student` 表中，`Student` 表中的剩余列将填充为 `null`（这是剩余字段的默认值）。Student 表现在如下：\n\
  \n| ID | Name | Age | Address | Salary |\n| --- | --- | --- | --- | --- |\n| 1 |\
  \ Ramesh | 32 | Ahmedabad | 2,000.00 |\n| 2 | Khilan | 25 | Delhi | 1,500.00 |\n\
  | 3 | kaushik | 23 | Kota | 2,000.00 |\n| 4 | Chantal | 25 | Mumbai | 6,500.00 |\n\
  | 5 | Hardin | 27 | Bhopal | 8,500.00 |\n| 6 | Kamal | 22 | MP | 4,500.00 |\n| 7\
  \ | Ravi | 35 | null | null |\n| 8 | Ashish | 45 | null | null |\n| 9 | Kamal |\
  \ 43 | null | null |\n\n* 选择要插入的行：\n\n```sql\nINSERT INTO Customer SELECT * FROM\
  \ Lateral\nCustomer WHERE Salary = 2000;\n```\n\n**输出**：此查询仅将 `Lateral customer`\
  \ 表中的最后一行插入到 `customer` 表中。Customer 表现在如下：\n\n| ID | Name | Age | Address | Salary\
  \ |\n| --- | --- | --- | --- | --- |\n| 1 | Ramesh | 32 | Ahmedabad | 2,000.00 |\n\
  | 2 | Khilan | 25 | Delhi | 1,500.00 |\n| 3 | kaushik | 23 | Kota | 2,000.00 |\n\
  | 4 | Chantal | 25 | Mumbai | 6,500.00 |\n| 5 | Hardin | 27 | Bhopal | 8,500.00\
  \ |\n| 6 | Kamal | 22 | MP | 4,500.00 |\n\n\n\n\n\n| 4 | kaushik | 25 | Mumbai |\
  \ 6,500.00 |\n| 9 | Kamal | 43 | Delhi | 2,000.00 |\n\n### 组合 AND 和 OR\n\n为了构建复杂的查询，我们可以像下面所示组合\
  \ AND 和 OR 运算符。\n\n**语法：**\n\n```\nSELECT * FROM table_name WHERE condition1 AND\n\
  (condition2 OR condition3);\n```\n\n考虑从 Student 表检索所有 Age 为 18 且 NAME 为 Ram 或 RAMESH\
  \ 的数据。\n\n**查询：**\n\n```\nSELECT * FROM Student WHERE Salary ≤ 5000 AND (Address\n\
  = ‘Delhi’ OR Address = ‘MP’);\n```\n\n**输出：**\n\n| ID | Name | Age | Address | Salary\
  \ |\n| --- | --- | --- | --- | --- |\n| 2 | Khilan | 25 | Delhi | 1,500.00 |\n|\
  \ 3 | kaushik | 23 | Delhi | 2,000.00 |\n| 6 | Komal | 22 | MP | 4,500.00 |\n| 9\
  \ | Kamal | 43 | Delhi | 2,000.00 |\n\n### Where 子句\n\nSQL `WHERE` 语句用于在从单个表检索信息或与多个表交互时确定条件。只有在满足提供的条件时，它才会从表中返回特定值。你应该使用\
  \ `WHERE` 子句过滤记录并仅检索所需的记录。`WHERE` 子句不仅用于 SELECT 语句，还用于 UPDATE 和 DELETE 语句。\n\n**语法：**\n\
  \n以下是带有 `WHERE` 子句的 SELECT 语句的基本语法：\n\n```\nSELECT column1, column2, column N\n\
  FROM table_name\nWHERE [condition]\n```\n\n可以使用比较运算符或逻辑运算符（如 `>`, `=`, `LIKE` 和\
  \ `NOT`）指定条件。随后的模型可以帮助你理解这一概念。\n\n**示例：**\n\n考虑 CUSTOMERS 表，它包含以下记录：\n\n| ID | Name\
  \ | Age | Address | Salary |\n| --- | --- | --- | --- | --- |\n| 1 | Ravi | 32 |\
  \ Ahmedabad | 2,000.00 |\n| 2 | Kaushik | 25 | Delhi | 1,500.00 |\n| 3 | Kevin |\
  \ 23 | Delhi | 2,000.00 |\n| 4 | Kula | 25 | Mumbai | 6,500.00 |\n| 5 | Hendrik\
  \ | 27 | Bhopal | 8,500.00 |\n| 6 | Kiwi | 22 | MP | 4,500.00 |\n\n下面的代码演示了如何从 CUSTOMERS\
  \ 表中检索薪水大于 5000 的 ID、Name 和 Salary 信息。\n\n**查询：**\n\n```\nSQL> SELECT ID, NAME,\
  \ SALARY\nFROM CUSTOMERS\nWHERE SALARY > 5000;\n```\n\n**输出：**\n\n| ID | Name |\
  \ Salary |\n| --- | --- | --- |\n| 4 | Kula | 6,500.00 |\n| 5 | Hendrik | 8,500.00\
  \ |\n| 6 | Kiwi | 4,500.00 |\n\n一个示例查询将从 CUSTOMERS 表中检索名为 kiwi 的客户的 ID、Name 和 Salary\
  \ 字段。\n\n注意的是，所有字符串都应该包含在单引号（‘’’）中。相反，数值值应该不带任何引号呈现，如前面的示例所示。\n\n```\nSQL> SELECT\
  \ ID, NAME, SALARY\nFROM CUSTOMERS\nWHERE NAME = ‘Kiwi’;\n```\n\n输出如下：\n\n| ID |\
  \ Name | Salary |\n| --- | --- | --- |\n| 6 | Kiwi | 4,500.00 |\n\n### SQL 中的 Unique\
  \ 子句\n\n要从结果集中删除重复列，请使用 SQL `DISTINCT` 子句。`unique` 关键字与 `choose` 关键字配合使用。它对于避免特定列/表中重复值有用。当我们使用\
  \ `distinct` 关键字时，我们获得唯一值。\n\n*   `SELECT DISTINCT` 返回唯一的（不同的）值。\n*   `DISTINCT`\
  \ 函数从表中删除重复记录。\n*   `DISTINCT` 可以与 `COUNT`、`AVG`、`MAX` 等聚合一起使用。\n*   `DISTINCT`\
  \ 仅作用于单列。\n*   `DISTINCT` 不允许多列。\n\n**语法：**\n\n```\nSELECT DISTINCT column1, column2\n\
  FROM table_name\n```\n\n`column 1` 和 `column 2` 是表的字段名称。\n\n`table name`：我们希望从中检索记录的表名。\n\
  \n此查询将返回表中具有 `column1`、`column2` 字段的所有唯一行组合。\n\n如果对多个列使用 `distinct` 关键字，结果集中将显示唯一的行组合。\n\
  \n**示例：**\n\n考虑 CUSTOMERS 表，它包含以下记录：\n\n| ID | Name | Age | Address | Salary |\n\
  | --- | --- | --- | --- | --- |\n| 1 | Ravi | 32 | Ahmedabad | 2,000.00 |\n| 2 |\
  \ Kaushik | 25 | Delhi | 1,500.00 |\n| 3 | Kevin | 23 | Delhi | 2,000.00 |\n| 4\
  \ | Kaushik | 25 | Delhi | 1,500.00 |\n| 5 | Hendrik | 27 | Bhopal | 8,500.00 |\n\
  | 6 | Kaushik | 25 | Delhi | 1,500.00 |\n\n**查询：**\n\n*   从 NAME 字段获取唯一名称 – \n\n\
  ```\nSELECT DISTINCT NAME\nFROM Student;\n```\n\n| Name |\n| --- |\n| **Ravi** |\n\
  | **Kaushik** |\n| **Kevin** |\n| **Kula** |\n| **Hendrik** |\n| **Kiwi** |\n\n\
  *   从整个表获取独一无二行组合，\n\n```\nSELECT DISTINCT *\nFROM Student;\n```\n\n**输出：**\n\n\
  | ID | Name | Age | Address | Salary |\n| --- | --- | --- | --- | --- |\n| 1 | Ravi\
  \ | 32 | Ahmedabad | 2,000.00 |\n| 2 | Kaushik | 25 | Delhi | 1,500.00 |\n| 3 |\
  \ Kevin | 23 | Delhi | 2,000.00 |\n| 5 | Hendrik | 27 | Bhopal | 8,500.00 |\n\n\
  如果没有 `distinct` 词，将获取六条目而不是四条，因为原始表包含六条具有重复值的记录。\n\n### SQL 语句中的 Select\n\n结构化查询语言中最广泛使用的命令是\
  \ `SELECT` 语句。它用于从一个或多个数据库表和视图获取数据。它还获取符合我们指定标准的被选数据。\n\n### Select 语句中的 Where 子句\n\
  \n它与 `SELECT` 语句结合使用，从表中检索满足查询给定条件的条目。\n\n示例：带有 `WHERE` 子句的 `SELECT` 语句。\n\n首先，我们必须建立新表并向其填充虚拟信息。要在\
  \ SQL 中创建 Employee Details 表，运行以下查询：\n\n带有 WHERE 子句的 Statement 语法\n\n```\nCREATE\
  \ TABLE Emp_Details\n(\nEmpl_ID INT AUTO_INCREMENT PRIMARY KEY,\nEmp_Name VARCHAR\
  \ (50),\n```\n\n接下来的 `INSERT` 查询向 Employee Details 表添加了员工条目：\n\n```\nINSERT INTO\
  \ Emp_Details (Empl_ID, Emp_Name,\nAmount, Car_Price) VALUES (11, Anupam, Ghaziabad,\
  \ 25000),\n(12, Tus, Lucknow, 29000),\n(13, Vive, Kolkata, 35000),\n(14, Shiva,\
  \ Goa, 22000);\n```\n\nEmployee Details 表中的数据在以下 `SELECT` 查询中显示：\n\n```\nSELECT\
  \ * FROM Emp_Details;\n```\n\n| Emp_Id | Emp_Name | Emp_City | Emp_Salary | Emp_Panelty\
  \ |\n| --- | --- | --- | --- | --- |\n| 11 | Anupam | Ghaziabad | 25000 | 500 |\n\
  | 12 | Tus | Lucknow | 29000 |\n| 13 | Vive | Kolkata | 35000 | 500 |\n| 14 | Shiva\
  \ | Goa | 22000 |\n\n以下查询从前面的表中返回 `Emp Panelty` 为 500 的员工列表：\n\n```\nSELECT * FROM\
  \ Emp_Details WHERE Emp_Panelty = 500;\n```\n\n此 `SELECT` 查询返回以下表：\n\n| Emp_Id |\
  \ Emp_Name | Emp_City | Emp_Salary | Emp_Panelty |\n| --- | --- | --- | --- | ---\
  \ |\n| 11 | Anupam | Ghaziabad | 25000 | 500 |\n| 13 | Vive | Kolkata | 35000 |\
  \ 500 |\n| 14 | Shiva | Goa | 22000 |\n\n### SQL 语句中的 Group by 子句\n\n`GROUP BY`\
  \ 条件与 `SELECT` 解释结合使用以显示部分的常规信息：\n\n带有 `GROUP BY` 子句的 Statement 语法如下：\n\n```\nSELECT\
  \ col_Name_1, col_Name_2....., col_Name_N\naggregate_function_name(col_Name2) FROM\
  \ table_name\nGROUP BY col_Name1;\n```\n\n### 带有 Group by 子句的 Statement 示例\n\n创建\
  \ Cars Details 表，运行以下查询：\n\n```\nCREATE TABLE Cars_Details\n(\nCar_Number INT PRIMARY\
  \ KEY,\nCar_Name VARCHAR (50),\nCar_Price INT NOT NULL,\nCar_AmountINT NOT NULL\n\
  ) ;\n```\n\n接下来的 `INSERT` 查询向 Cars Details 表添加了汽车条目：\n\n```\nINSERT INTO Cars_Details\
  \ (Car_Number, Car_Name, Car_\nAmount, Car_Price) VALUES (2578, Creta, 3, 1500000),\n\
  (9258, Audi, 2, 3000000),\n(8233, Venue, 6, 900000),\n(6214, Nexon, 7, 1000000);\n\
  ```\n\n以下 `SELECT` 查询显示输出中的值：\n\n```\nSELECT * FROM Cars_Details;\n```\n\n\n\n\n\
  \n```\nSELECT * FROM Cars_Details;\n```\n\n| Car_Number | Car_Name | Car_Amount\
  \ | Car_Price |\n| --- | --- | --- | --- |\n| `2578` | Creta | 3 | 1,000,000 |\n\
  | `9258` | Audi | 2 | 900,000 |\n| `8233` | Venue | 6 | 900,000 |\n| `6214` | Nexon\
  \ | 7 | 1,000,000 |\n\n以下带有 `GROUP BY` 的 `SELECT` 查询返回相同价格的汽车数量：\n\n```\nSELECT\
  \ COUNT (Car_Name), Car_Price FROM Cars_Details\nGROUP BY Car_Price;\n```\n\n上述\
  \ `GROUP BY` 查询的 own 显示如下。\n\n| Count (Car_Name) | Car_Price |\n| --- | --- |\n\
  | `2` | 1,000,000 |\n| `2` | 900,000 |\n\n### SQL Select 语句中的 HAVING 子句\n\n`SELECT`\
  \ 语句的 `HAVING` 子句在 `GROUP BY` 子句定义的组内创建一个选择。\n\n带有 `HAVING` 子句的 `SELECT` 语句语法如下：\n\
  \n```\nSELECT col_Name_1, col_Name_2, ....., col_Name_N\naggregate_function_name(column_Name_2)\
  \ FROM table_name\nGROUP BY column_Name1 HAVING ;\n```\n\n#### 带有 HAVING 子句的 SELECT\
  \ 语句示例\n\n让我们使用下面的 `CREATE` 命令在 SQL 中创建 `Emp_Having` 表：\n\n```\nCREATE TABLE Emp_Having\n\
  (\nEmp_Id INT PRIMARY KEY,\nEmp_Name VARCHAR (50),\nEmp_Salary INT NOT NULL,\nEmp_City\
  \ VARCHAR (50)\n) ;\n```\n\n以下 `INSERT` 查询向 `Emp_Having` 表中插入了一条员工记录：\n\n```\nINSERT\
  \ INTO Emp_Having (Emp_Id, Emp_Name, Emp_Salary,\nEmp_City)\nVALUES (01, Jonas,\
  \ 20000, Goa),\n(02, Basanti, 40000, Delhi),\n(03, Rasheta, 80000,Jaipur),\n(04,\
  \ Aunpam, 20000, Goa),\n(05, Sumitra, 50000, Delhi);\n```\n\n以下 `SELECT` 查询在输出中显示\
  \ `Emp_Having` 表的值：\n\n```\nSELECT * FROM Emp_Having;\n```\n\n| Emp_Id | Emp_Name\
  \ | Emp_Salary | Emp_City |\n| --- | --- | --- | --- |\n| `01` | Jonas | 20,000\
  \ | Goa |\n| `02` | Basanti | 40,000 | Delhi |\n| `03` | Rasheta | 80,000 | Jaipur\
  \ |\n| `04` | Anupam | 20,000 | Goa |\n| `05` | Sumitra | 50,000 | Delhi |\n\n以下查询显示\
  \ `Emp_Having` 表中薪资超过 5,000 的员工总薪资：\n\n```\nSELECT SUM (Emp_Salary), Emp_City FROM\
  \ Emp_Having\nGROUP BY Emp_City HAVING SUM(Emp_Salary)>5000;\n```\n\n此带有 `SELECT`\
  \ 语句的 `HAVING` 查询显示了下表：\n\n**输出：**\n\n| Sum (Emp_Salary) | Emp_City |\n| --- | ---\
  \ |\n| `90,000` | Delhi |\n| `80,000` | Jaipur |\n\n### Select 语句中的 Order by 子句\n\
  \n使用 SQL `SELECT` 语句，`ORDER BY` 子句对记录或行进行排序。`ORDER BY` 短语按升序和降序排列。默认情况下，数据库系统升序排列列值。\n\
  \n带有 `ORDER BY` 子句的 `SELECT` 语句语法如下：\n\n```\nSELECT Col_Name_1, Col_Name_2, .....,\
  \ col_Name_N FROM [Condition] ORDER BY[col_Name_1, Name_2, ....., column_Name_N\
  \ asc | desc ];\n```\n\n#### SQL 中带有 ORDER BY 子句的 SELECT 语句示例\n\n```\nCREATE TABLE\
  \ Employee_Order\n(\nId INT NOT NULL,\nFirstName VARCHAR (50),\nSalary INT,\nCity\
  \ VARCHAR (50)\n) ;\n```\n\n以下 `INSERT` 查询向 `Emp_Having` 表中插入了一条员工记录：\n\n```\nINSERT\
  \ INTO Emp_Order (Id, FirstName, Salary, City)\nVALUES (01, Jonas, 20000, Goa),\n\
  (02, Basanti, 15000, Delhi),\n(03, Rasheta, 80000,Jaipur),\n(04, Aunpam, 90000,\
  \ Goa),\n(05, Sumitra, 50000, Delhi);\n```\n\n以下 `SELECT` 查询显示输出中的值：\n\n```\nSELECT\
  \ * FROM Emp_Order;\n```\n\n| Id | First_Name | Salary | City |\n| --- | --- | ---\
  \ | --- |\n| `01` | Jonas | 20,000 | Goa |\n| `02` | Basanti | 15,000 | Delhi |\n\
  | `03` | Rasheta | 80,000 | Jaipur |\n| `04` | Anupam | 90,000 | Goa |\n| `05` |\
  \ Sumitra | 50,000 | Delhi |\n\n以下查询按降序排序 `Employee_Order` 表中的员工薪资：\n\n```\nSELECT\
  \ * FROM Employee_Order ORDER BY Emp_Salary DESC;\n```\n\n此 SQL 查询返回下表：\n\n**输出：**\n\
  \n| Emp_Id | Emp_Name | Emp_Salary | Emp_City |\n| --- | --- | --- | --- |\n| `04`\
  \ | Anupam | 90,000 | Goa |\n| `03` | Rasheta | 80,000 | Jaipur |\n| `05` | Sumitra\
  \ | 50,000 | Delhi |\n| `01` | Jonas | 20,000 | Goa |\n| `02` | Basanti | 15,000\
  \ | Delhi |\n\n## SQL 中的 Drop 和 Truncate 表\n\nSQL `DROP` 命令用于删除整个数据集或表文件和信息，这只是冰山一角。随后，`TRUNCATE`\
  \ 命令用于消除表中的所有列。\n\n### SQL 中的 Truncate 表\n\n通过发布 `TRUNCATE TABLE` 命令开始。当你想要清空 SQL\
  \ 表时，使用 `TRUNCATE TABLE`。也就是说，当你想删除数据库中的所有数据但保留表本身时。为什么要保留一个没有数据的表？因为你不需要重新创建结构：不需要提供列名或数据类型。\n\
  \nSQL `TRUNCATE` 命令在科学中很有帮助，例如当发现填充 SQL 表的自动加载脚本存在缺陷时。此类问题的常见例子是每天加载两次数据。最简单的解决方案是清空表并重新加载数据。\n\
  \n另一个流行的用例是处理必须每天更新字段的百万级表。与其逐个更改行，有时清空表然后重新加载修改后的数据效率更高。\n\n语法非常简单，格式如下：\n\n```\n\
  TRUNCATE TABLE table_name;\n```\n\n`TRUNCATE TABLE` 是 SQL 命令，`table_name` 是你想清空的现有表名。\n\
  \n**示例：**\n\n考虑 `CUSTOMERS` 表中的以下记录：\n\n| ID | Name | Age | Address | Salary |\n\
  | --- | --- | --- | --- | --- |\n| `1` | Ravi | 32 | Ahmedabad | 2,000.00 |\n| `2`\
  \ | Kaushik | 25 | Delhi | 1,500.00 |\n| `3` | Kevin | 23 | Delhi | 2,000.00 |\n\
  | `4` | Kula | 25 | Mumbai | 6,500.00 |\n| `5` | Hendrik | 27 | Bhopal | 8,500.00\
  \ |\n| `6` | Kiwi | 22 | MP | 4,500.00 |\n\n这是一个 Truncate 命令的示例。\n\n```\nSQL >TRUNCATE\
  \ TABLE CUSTOMERS;\n```\n\n`CUSTOMERS` 表现在已经缩短，`SELECT` 操作的输出见下面的代码块。\n\n```\n SQL>SELECT\
  \ * FROM CUSTOMERS\n```\nSet is empty (0.00 sec)\n\n### SQL 中的 Table Drop\n\n`DROP\
  \ TABLE` 是我们的第二个命令。与 `TRUNCATE TABLE` 不同，`DROP TABLE` 是删除 SQL 表而不是清空它。这意味着你将销毁它的结构、之前定义的列名、数据类型，当然还有其中包含的数据。\n\
  \n无论如何，这有时是必要的。在数据科学中，当我们更新整个数据库结构并不再需要某些表时会使用它。或者当你不小心创建了一个不需要的表。（这种情况会发生。）此外，当你在表中写错了某些内容（表名、列名、数据类型），有时用\
  \ `ALTER TABLE` 修复比直接 `DROP` 掉它更快。\n\n删除 SQL 表的语法如下：\n\n```\nDROP TABLE table_name;\n\
  ```\n\n在从数据库中删除表之前，我们先验证 `STUDENTS` 表。\n\n```\nSQL> DESC STUDENTS;\n```\n\n| Field\
  \ | Type | Null | Key | Default | Extra |\n| --- | --- | --- | --- | --- | --- |\n\
  | `ID` | Int(11) | NO | PRI |   |  |\n| `NAME` | Varchar(20) | NO |   |   |  |\n\
  | `AGE` | Int(11) | NO |   |   |  |\n| `ADDRESS` | Varchar(25) | YES |   | NULL\
  \ |  |\n\n这表示数据库中存在 `STUDENTS` 表，因此我们可以按照以下方式删除它：\n\n```\nSQL>DROP TABLE STUDENTS;\n\
  ```\n\n正如你所见，表已被删除，因此它不再显示。\n\n\n\n\n\n`DROP TABLE` 是命令，而表名是要被删除的表名称。既然你已经知道如何在\
  \ SQL 中清空或删除表了，这里有一个友好的警告：在使用 SQL `TRUNCATE TABLE` 或 `DROP TABLE` 命令时请务必极其小心！是的，如果你使用\
  \ `SQL Workbench`（或 `pgadmin4`），你必须在更改变得不可逆之前提交（commit）更改……除此之外，没有撤销按钮。删除或清空表可能会导致严重且不愉快的数据丢失，因此在运行这些命令之前请考虑两次。特别是在现实项目中。特别是在你没有数据备份的情况下。\n\
  \n## 在 SQL 中创建\n\n在 SQL 中，有两个 `CREATE` 语句：\n\n* `CREATE TABLE`\n* `CREATE DATABASE`\n\
  \n### 创建数据库\n\n数据库是数据的系统集合。为了以良好结构的方式存储数据，SQL 的第一步是建立数据库。在 SQL 中，使用 `CREATE DATABASE`\
  \ 语句创建一个新数据库。\n\n**语法：**\n\n```\nCREATE DATABASE database_name;\ndatabase_name:\
  \ 数据库的名称。\n```\n\n**示例查询**：此查询将建立一个新的 SQL 数据库并将其命名为 my database。\n\n```\nCREATE\
  \ DATABASE my_database;\n```\n\n### 创建表\n\n我们之前学习过数据库的创建。为了保存数据，我们需要一个表。在 SQL 中，使用\
  \ `Construct TABLE` 语句创建一个表。我们都知道表是由行和列组成的。因此，在构建表时，我们必须向 SQL 提供诸如列名、列中存储的数据类型、数据数量等信息。现在让我们来看看如何利用\
  \ `Construct TABLE` 语句在 SQL 中创建表。\n\n**语法：**\n\n```\nCREATE TABLE table_name\n(\n\
  column1 data_type(size),\ncolumn2 data_type(size),\ncolumn3 data_type(size),\n....\n\
  );\n```\n\n`Table_Name`: 表名。\n\n`column1`: 第一列的名称。\n\n`Data_Type`: 我们希望在特定列中存储的数据类型。例如，用于整数数据类型\
  \ `int`。\n\n`Size`: 我们在特定列中可以存储的数据的大小。例如，如果为某一列指定 data_type 为 `int` 且 `size` 为 `15`，则该列最多可以存储\
  \ 15 位的整数。\n\n此查询将生成一个名为 `Students` 的表，包含三列：`ROLL NO`、`NAME` 和 `SUBJECT`。\n\n```\n\
  CREATE TABLE Students\n(\nROLL_NO int(3),\nNAME varchar(20),\nSUBJECT varchar(20),\n\
  );\n```\n\n此查询将生成表 `Students`。`ROLL NO` 字段的类型为 `int`，可以包含三位整数值。接下来的两个列 `NAME` 和\
  \ `SUBJECT` 类型为 `varchar`，可以存储字符，大小 20 表示这两个字段最多可以容纳 20 个字符。\n\n## SQL 中的连接 (Joins)\n\
  \n`JOIN` 子句用于根据公共列将两个或多个表的行连接起来。在本文中，我们将回顾最后两种 `JOINS`：\n\n* **笛卡尔连接（Cartesian Join）**：`CARTESIAN\
  \ JOIN` 也称为 `CROSS JOIN`（笛卡尔积/连接）。在 `CARTESIAN JOIN` 中，一个表的每一行都与另一个表的每一行连接起来。这通常在没有提供匹配列或\
  \ `WHERE` 条件时发生。\n    * 在没有 `WHERE` 条件的情况下，`CARTESIAN JOIN` 和 `CARTESIAN PRODUCT`\
  \ 的行为相似。换句话说，两个表的行总和构成了结果集的行数。\n    * 一般而言，交叉连接与内连接相似，因为连接条件始终求值为 `True`（真）。\n\n\
  **语法：**\n\n```\nSELECT table1.column1 , table1.column2, table2.\ncolumn1...\nFROM\
  \ table1\nCROSS JOIN table2;\ntable1: 第一张表。\ntable2: 第二张表\n```\n\n* **自连接（Self-Join）**：如名称所示，通过\
  \ `SELF JOIN` 将表与其自身连接。也就是说，根据情况，表的每一行都连接到自身以及所有其他行。换句话说，它是同一张表的两个副本之间的连接。\n\n**语法：**\n\
  \n```\nSELECT a.coulmn1 , b.column2\nFROM table_name a, table_name b\nWHERE some_condition;\n\
  ```\n\n`table_name`: 表名。\n`some_condition`: 选择行的条件。\n\n## 备用引用运算符\n\n字符字面量在许多 SQL\
  \ 语句中用表达式或条件。如果字面量包含单引号，你可以使用引号 (`q`) 运算符并指定自己的定界符。你可以使用任何合适的定界符（单字节或多字节），或者任何字符对\
  \ `[]`、`()`、`{}` 或 `>`。\n\n## 字符串连接运算符\n\n通用的 SQL 表达式图说明了二元连接运算符的语法。使用连接运算符 (`||`)\
  \ 组合两个求值为字符或数值数据类型的表达式。让我们来看一个例子：\n\n**语法：**\n\n```\nSELECT id, f_name, l_name,\
  \ f_name || last_name,\n               salary, first_name || salary FROM\nmyTable\n\
  ```\n\n输出（第三列和第五列显示了由运算符 `||` 拼接的值）id salary\n\n| id | f_name | l_name | f_name||last_name\
  \ | salary | first_name||salary |\n| --- | --- | --- | --- | --- | --- |\n| 101\
  \ | Rajat | Rawat | RajatRawat | 10,000 | Rajat10000 |\n| 120 | Geeks | ForGeeks\
  \ | GeeksForGeeks | 20,000 | Geeks20000 |\n| 156 | Shane | Watson | ShaneWatson\
  \ | 50,000 | Shane50000 |\n| 145 | Kedar | Jadhav | KedarJadhav | 90,000 | Kedar90000\
  \ |\n\n在上面的示例中，我们使用了 `||` 连接运算符，它用于在选择查询中链接两个或任意数量的列，且与列的数据类型无关。我们在上面链接了两个列：名 +\
  \ 姓，以及名 + 薪水。\n\n字面量也可以用于连接运算符。让我们来看一看：\n\n**示例 1：使用字符字面量**\n\n**语法：**\n\n```\n\
  SELECT id, first_name, last_name, salary,\n      first_name||' '||last_name as new\
  \ FROM\n```\n\n输出（拼接三个值并命名为“new”）\n\n| id | first_name | last_name | salary | new\
  \ |\n| --- | --- | --- | --- | --- |\n| 101 | Rajat | Rawat | 10,000 | Rajat Rawat\
  \ |\n| 120 | Geeks | ForGeeks | 20,000 | Geeks ForGeeks |\n| 156 | Shane | Watson\
  \ | 50,000 | Shane Watson |\n| 145 | Kedar | Jadhav | 90,000 | Kedar Jadhav |\n\n\
  在上面的语句中，我们使用了空格作为字符字面量。同样，我们可以根据需要使用数字或日期字面量。\n\n## 减法运算符 (Minus)\n\n在 SQL 中，减法运算符用于两个\
  \ `SELECT` 语句。`MINUS` 运算符用于从第二个 `SELECT` 查询结果集中减去第一个 `SELECT` 查询结果集。换句话说，`MINUS`\
  \ 运算符将仅返回在第一个 `SELECT` 查询中唯一的行。\n\n**基础语法：**\n\n```\nSELECT column1 , column2 ,\
  \ ... columnN\nFROM table_name\nWHERE condition\nMINUS\nSELECT column1 , column2\
  \ , ... columnN\nFROM table_name\nWHERE condition;\n```\n\n`columnN`: `column1`,\
  \ `column2`.. 是表的列名。\n\n**注意：**\n\n* 在给定查询中，`WHERE` 子句是可选的。\n* 两个 `SELECT` 语句具有相同数量的列。\n\
  * 两个 `SELECT` 语句的相关列具有相同的数据类型。\n\n## 除法运算符\n\n在 SQL 中，除法是一个算术运算符。加 (`+`)、减 (`–`)、乘\
  \ (`*`)、除 (`/`) 和取模是算术运算符 (`%`)。\n\n在 SQL 中，除法运算符语法如下：\n\n```\nSELECT <expression>\
  \ / <expression>\nFROM table\n[WHERE expression]\n```\n\n除法运算符如例所示：\n\n**查询：**\n\
  \n```\nSELECT 4 / 2\n```\n\n你可以运行此查询，它将返回结果，在本例中结果为 2。然而，你更有可能处理存储在数据库表中的数字。\n\n\
  ## SQL 中的 NOT 运算符\n\n它可以放在任何条件语句之前，用于选择符合条件的行。\n\n**语法：**\n\nSQL 中的 `NOT` 条件具有如下语法：\n\
  \n```\nNOT condition\n```\n\n作为示例在 IN 条件中使用 NOT\n\n\n\n\n让我们先来看下 `NOT` 如何与 `IN`\
  \ 条件结合使用。当我们把 `NOT` 算符应用于 `IN` 条件时，我们就建立了一个 `NOT IN` 条件。这将会检查一个表达式是否已经不在某个列表中。在这个示例中，我们有一个名为\
  \ `products` 的表，包含以下信息：\n\n| Product_ID | Product_Name | Category_ID |\n| --- |\
  \ --- | --- |\n| **1** | Pear | 50 |\n| **2** | Banana | 50 |\n| **3** | Orange\
  \ | 50 |\n| **4** | Apple | 50 |\n| **5** | Bread | 75 |\n| **6** | Sliced Ham |\
  \ 25 |\n| **7** | Kleenex | NULL |\n\n输入以下 SQL 语句：\n\n```\nSELECT *\nFROM products\n\
  WHERE product_name NOT IN (‘Pear’, ‘Banana’, ‘Bread’);\n```\n\n将选出四条记录。你应该能看到以下结果：\n\
  \n| Product_ID | Product_Name | Category_ID |\n| --- | --- | --- |\n| **3** | Orange\
  \ | 50 |\n| **4** | Apple | 50 |\n| **6** | Sliced Ham | 25 |\n| **7** | Kleenex\
  \ | NULL |\n\n此示例返回了 `products` 表中所有名称不匹配 `Pear`、`Banana` 或 `Bread` 的条目。有时，列出你不需要的值比列出你想要的值更为经济。它对应的\
  \ SQL 语句如下：\n\n```\nSELECT *\nFROM products\nWHERE product_name <> ‘Pear’\nAND product_name\
  \ <> ‘Banana’\nAND product_name <> ‘Bread’;\n```\n\n**输出：**\n\n| Product_ID | Product_Name\
  \ | Category_ID |\n| --- | --- | --- |\n| **3** | Orange | 50 |\n| **4** | Apple\
  \ | 50 |\n| **6** | Sliced Ham | 25 |\n| **7** | Kleenex | NULL |\n\n## Between\
  \ 和 In 运算符\n\nSQL 提供了许多技术从多种类型的数据中获取有意义的信息。有时，我们需要从表中所有的列值中提取一个值范围。例如，为了获取某公司在特定年份出生的所有员工信息，我们需要使用各种运算符和子句从数据库中检索这些数据。这里就是用于执行此类任务的运算符之一。\n\
  \n### Between 运算符\n\nSQL `BETWEEN` 运算符用于判断一个表达式是否落在某个值范围内。该运算符是闭合的，意味着它包含了范围的起始和结束值。这些值可以是文本、数值或日期的。该运算符与\
  \ `SELECT`、`INSERT`、`UPDATE` 和 `DELETE` 命令兼容。让我们来看看该运算符的语法以便更好地理解它。\n\n#### SQL\
  \ 语法\n\n该运算符最经常与 `SELECT` 命令结合使用。以下是语法：\n\n```\nSELECT column_names\nFROM table_name\n\
  WHERE column_name BETWEEN range_start AND range_end;\n```\n\n### In 运算符\n\n你可以通过\
  \ `IN` 运算符在 `WHERE` 子句中定义多个值。许多 `OR` 条件被简写为 `IN` 运算符。\n\n**语法：**\n\n```\nSELECT\
  \ column_name(s)\nFROM table_name\nWHERE column_name IN (value1, value2, ...);\n\
  ```\n\n## Join（内连接、左连接、右连接和全连接）\n\n我们的数据库包含存储在数千表中的海量数据。当我们需要查看符合多个标准的特定数据组时，在合并大量数据时会遇到问题。因为数据分散在不同的表中，我们使用各种连接（joins）将表合并成单张表以提取数据。SQL\
  \ `join` 命令允许我们合并许多表的行、列和部分，并将它们视为单一实体。我们可以通过连接快速地整合并将数据展示在单张表中。\n\n这使得我们能够在所需的数据上运行查询和事务变得简单。连接是基于两个或多个表中的一个或多个公共字段执行的。当用户尝试从具有一对多或多对多关系的表中提取数据时，通常会使用这些连接。现在我们已经理解了什么是连接，让我们来看看连接的多种形式。\n\
  \n### 连接的不同类型\n\n应该注意的四种连接类型见 (图 2.2)：\n\n![](img/Fig02_02.jpg)\n\n图 2.2 SQL 中的连接类型。\n\
  \n* 右连接 (Right join)\n* 内连接 (Inner join)\n* 全连接 (Full join)\n* 左连接 (Left join)\n\
  \n请看下图。\n\n#### 如何确定使用哪种 SQL 连接\n\n让我们研究其中的每一种。我将使用以下三张表来演示如何对它们进行连接操作，以便更好地掌握这个主题。\n\
  \n员工表 (Employee Table)：\n\n| Emp_ID | EmpF_name | EmpL_name | Age | Email ID | Phone\
  \ No. | Address |\n| --- | --- | --- | --- | --- | --- | --- |\n| **1** | Vardha\
  \ | Kumar | 22 | vard@abc.com | 9889543210 | Delhi (德里) |\n| **2** | Hema | Sharma\
  \ | 32 | hema@abc.com | 9989554422 | Mumbai (孟买) |\n| **3** | Aayush | Shreshth\
  \ | 24 | aayush@abc.com | 9977222121 | Kolkata (加尔各答) |\n| **4** | Hemant | Sharma\
  \ | 25 | hemant@abc.com | 9878945666 | Bengaluru (班加罗尔) |\n| **5** | Swati | Kapoor\
  \ | 26 | swati@abc.com | 9544567875 | Hyderabad (海得拉巴) |\n\n项目表 (Project Table)：\n\
  \n| Project ID | Emp ID | Client ID | Project Name | Project Start Date |\n| ---\
  \ | --- | --- | --- | --- |\n| **111** | 1 | 3 | Project1 | 2022-04-21 |\n| **222**\
  \ | 2 | 1 | Project2 | 2022-02-12 |\n| **333** | 3 | 5 | Project3 | 2022-01-10 |\n\
  | **444** | 3 | 2 | Project4 | 2022-04-16 |\n| **555** | 5 | 4 | Project5 | 2022-05-23\
  \ |\n| **666** | 9 | 1 | Project6 | 2022-01-12 |\n| **777** | 7 | 2 | Project7 |\
  \ 2022-07-25 |\n| **888** | 8 | 3 | Project8 | 2022-08-20 |\n\n客户表 (Client Table)：\n\
  \n| C_ID | CF_name | CL_name | Age | C_Email | PhoneNo | Address | Emp_ID |\n| ---\
  \ | --- | --- | --- | --- | --- | --- | --- |\n| **101** | Sus | Smit | 30 | sus@adn.com\
  \ | 9789511231 | | |\n\n\n\n`LEFT JOIN` 或 `LEFT OUTER JOIN` 返回左表中的所有记录，以及在右表中符合条件的记录。此外，如果右表中没有匹配的项，则输出或结果集将包含\
  \ `NULL` 值。\n\n### 语法\n\n```sql\nSELECT Table1.Column1,Table1.Column2,Table2.\n\
  Column1,....\nFROM Table1\nLEFT JOIN Table2\nON Table1.MatchingColumnName = Table2.\n\
  MatchingColumnName;\n```\n\n### 示例\n\n```sql\nSELECT Emp.EmpF_name, Emp.EmpL_name,\
  \ Proj.P_ID,\nProj.P_Name\nFROM Emp\nLEFT JOIN\nON Emp.EmpID = Proj.EmpID ;\n```\n\
  \n### 输出\n\n| EmpF_name | EmpL_name | P_ID | P_Name |\n| --- | --- | --- | --- |\n\
  | Vardha | Kumar | 111 | Project1 |\n| Hema | Sharma | 222 | Project2 |\n| Aayush\
  \ | Shreshtha | 333 | Project3 |\n| Aayush | Shreshtha | 444 | Project4 |\n| Swati\
  \ | Kapoor | 555 | Project5 |\n| Hemanthi | Sharma | NULL | NULL |\n\n## 右连接\n\n\
  `RIGHT JOIN` 或 `RIGHT OUTER JOIN` 返回右表中的所有记录，以及在左表中符合特定条件的记录。此外，对于在左表中没有匹配值的记录，输出或结果集将包含\
  \ `NULL` 值。\n\n### 语法\n\n```sql\nSELECT Table1.Column1,Table1.Column2,Table2.\n\
  Column1,....\nFROM Table1\nRIGHT JOIN Table2\nON Table1.MatchingColumnName = Table2.MatchingColumnName;\n\
  ```\n\n### 示例\n\n```sql\nSELECT Emp.EmpFname, Emp.EmpLname, Proj.P_ID,\nProj.P_Name\n\
  FROM Emp\nRIGHT JOIN\nON Emp.EmpID = Proj.EmpID;\n```\n\n### 输出\n\n| EmpF_name |\
  \ EmpL_name | P_ID | P_Name |\n| --- | --- | --- | --- |\n| Vardha | Kumar | 111\
  \ | Project1 |\n| Hema | Sharma | 222 | Project2 |\n| Aayush | Shreshtha | 333 |\
  \ Project3 |\n| Aayush | Shreshtha | 444 | Project4 |\n| Swati | Kapoor | 555 |\
  \ Project5 |\n| NULL | NULL | 666 | Project6 |\n| NULL | NULL | 777 | Project7 |\n\
  | NULL | NULL | 888 | Project8 |\n\n## SQL 约束\n\n检查约束（check constraints）是规则或规则组，有助于根据特定情况验证插入（或更新）到表中的数据值。因此，在允许数据进入表之前，我们可以根据预定义的规则对新插入的数据值进行测试。检查约束的主要优点是它可以确保列中的所有数据都是根据检查约束规则经过验证的值。`CHECK`\
  \ 约束限制了可以输入列的值范围。当我们在列上指定 `CHECK` 约束时，我们实际上是在限制可以分配给该列的值。表上的 `CHECK` 约束可能会根据行中其他列的值来限制某些列的值。\n\
  \n### 语法\n\n```sql\nCREATE TABLE pets(\n        ID INT NOT NULL,\n        Name VARCHAR(30)\
  \ NOT NULL,\n        Breed VARCHAR(20) NOT NULL,\n        Age INT,\n        GENDER\
  \ VARCHAR(9),\n        PRIMARY KEY(ID),\n        check(GENDER in (‘Male’, ‘Female’,\
  \ ‘Unknown’))\n        );\n```\n\n上述 SQL 查询中的检查约束将 `GENDER` 限制为提供的类别。如果引入了新的元组，或者关系中现有元组的\
  \ `GENDER` 不属于所述三个类别中的任何一个，则相关的数据库更新将被取消。\n\n### 查询\n\n在上述表中，条件是学生年龄必须大于 `>=17`\
  \ 岁才能入学大学。\n\n允许入学大学的学生数据库架构。\n\n大学学生数据库架构如下：\n\n```sql\nCREATE TABLE student(\n\
  \        StudentID INT NOT NULL,\n        Name VARCHAR(30) NOT NULL,\n        Age\
  \ INT NOT NULL,\n        GENDER VARCHAR(9),\n        PRIMARY KEY(ID),\n        check(Age\
  \ >= 17)\n        );\n```\n\n### 学生关系\n\n| StudentID | Name | Age | Gender |\n|\
  \ --- | --- | --- | --- |\n| 1001 | Ron | 18 | Male |\n| 1002 | Sam | 17 | Male\
  \ |\n| 1003 | Georgia | 17 | Female |\n| 1004 | Erik | 19 | Unknown |\n| 1005 |\
  \ Christine | 17 | Female |\n\n根据关系架构中 `check` 语句指示的约束，上述关系中所有学生的年龄都大于或等于 17 岁。然而，如果执行以下\
  \ SQL 命令：\n\n```sql\nINSERT INTO student(STUDENTID, NAME, AGE, GENDER)\nVALUES (1006,\
  \ ‘Emma’, 16, ‘Female’);\n```\n\n将不会发生数据库更新，年龄保持为 17 岁。\n\n检查约束的应用可能性如下：\n\n- **修改\
  \ (Alter)**：可以使用以下语法向现有关系引入检查约束：\n```sql\nalter table TABLE_NAME modify COLUMN_NAME\n\
  check(Predicate);\n```\n- **为检查约束指定变量名**：可以使用以下语法为检查约束命名：\n```sql\nalter table TABLE_NAME\
  \ add constraint CHECK_CONST\ncheck (Predicate);\n```\n- **移除检查约束**：可以使用以下语法从数据库关系中删除检查约束：\n\
  ```sql\nalter table TABLE_NAME drop constraint\nCHECK_CONSTRAINT_NAME;\n```\n- **删除检查约束**：在\
  \ MySQL 中，可以使用以下语法从关系中删除检查约束：\n```sql\nalter table TABLE_NAME drop check CHECK_CONSTRAINT_NAME;\n\
  ```\n\n## 总结\n\nSQL 子句和操作目的是为了帮助结构化查询语言的新手学习并在日常工作中应用该语言。本章简要演示了各种 SQL 子句、SQL 命令、SQL\
  \ 语句和 SQL 操作符的使用。本章概述了 `SELECT`、`INSERT`、`UPDATE`、`DELETE`、`WHERE`、`JOIN`、`DISTINCT`、`ORDER\
  \ BY`、`GROUP BY`、`HAVING` 和 `UNION` 等 SQL 子句和命令。本章的主要目标是简要介绍这种强大的语言及其子句，并为您继续学习\
  \ SQL 奠下基础。\n\n# 第三章 SQL 注入\n\nDOI: [10.1201/9781003358435-3](https://doi.org/10.1201/9781003358435-3)\n\
  \n## 本章内容\n\n- ➢ 什么是 SQLi\n- ➢ 目标、类型及其机制\n- ➢ SQL 注入攻击的检测与防御\n- ➢ Sqlmap 及其功能\n\
  - ➢ 预编译语句\n\n上一章学习了各种 SQL 语句、子句和相关命令。在本章中，我们将学习一种常见的攻击向量，它涉及使用恶意 SQL 代码修改后端数据库，以获取非预期显示的信息，这被称为\
  \ SQL 注入 (`SQLi`)。因此，我们将对 SQLi 进行简要介绍，然后通过示例其运行模式。\n\n## 什么是 SQL 注入 (SQLi)？\n\n\
  SQL 注入 (`SQLi`) 是一种注入攻击，允许执行恶意 SQL 语句。这些命令用于控制连接到 Web 应用程序的数据库服务器。攻击者可以利用漏洞绕过应用程序安全性。他们可以绕过网站或应用程序的身份验证和授权，获取\
  \ SQL 数据库的完整内容。它还可以用于创建、修改和删除数据库记录。任何使用 `MySQL`、`Oracle`、`SQL Server` 等 SQL 数据库的网站或\
  \ Web 应用程序都可能受到 SQL 注入的影响。它可能被犯罪分子非法访问您的敏感数据，如客户信息、个人数据、秘密、知识产权等。SQL 注入是最老、最常见且最致命的在线应用程序漏洞之一。\n\
  \n\n\n\n\nSQL 注入对公司的盈利可能产生巨大影响。一次成功的攻击可能导致攻击者读取非法用户列表、删除整个表，并在某些情况下获得数据库的管理员权限，所有这些对公司来说都是极破坏性的。如果电话号码、地址和信用卡信息等个人信息遭到泄露，请考虑客户对你\
  \ SQLi 成本估算信任的丧失。虽然任何 SQL 数据库都可以使用该向量进行攻击，但网站是最受欢迎的目标。OWASP 前 10 排序在线应用程序安全风险列表的排名证明，SQL\
  \ 注入是最广泛的类型攻击类型之一。¹ 随着自动化 SQL 注入工具的出现，利用 SQLi 攻击的风险已经扩大，其造成的损害也随之增加。在过去，攻击者必须手动执行这些攻击，因为使用\
  \ SQL 注入攻击公司的机会非常有限。\n\n## SQLi 的目标\n\n以下是 SQLi 能够实现的目标：\n\n- **提取数据：** 攻击者将夺取敏感信息。如果管理员数据库被破解，整个数据库都面临风险。\n\
  - **获取数据访问权限：** 他们试图绕过安全限制并获取整个数据库的访问权限以修改数据。\n- **数据库指纹识别：** 在这种方法中，攻击者将确定数据库的版本和类型。这种技术允许他们在不同的应用程序中尝试各种类型的查询。\n\
  - **发现可注入参数：** 使用某些自动化技术可以发现易受攻击的参数。\n- **绕过身份验证：** 为了获得数据库访问权限，将绕过应用程序的身份验证方法。\n\
  - **数据库架构识别：** 为了成功收集信息，将从数据库表中获取数据库表名、每个字段的数据类型、列名等。\n- **导致拒绝服务：** 这包括删除表和关闭系统。攻击者尝试获取系统访问权限以便在数据库内部执行指定的命令。\n\
  \n## SQL 注入攻击的机制\n\nSQL 查询是对应用程序数据库执行某特定操作的请求。查询也可以用于在操作系统上执行命令。当用户执行查询时，一组参数确保了只返回所需的记录。攻击者在\
  \ SQL 注入期间利用这一点，通过在查询的输入表单中引入恶意代码。SQL 注入攻击的第一步是研究目标数据库是如何工作的。这是通过向查询中插入各种随机值并观察服务器的响应来实现的。之后，攻击者利用他们学到的数据库知识创建一个服务器将解释并执行为\
  \ SQL 命令的查询。例如，数据库可能会存储有关已购买并拥有客户 ID 号的客户的信息。攻击者可能会在输入字段中输入 `C_ID = 1,045 OR 2 =\
  \ 2`，而不是搜索特定的客户 ID。由于 `2 = 2` 语句始终为真，SQL 查询将返回所有可用的客户 ID 和任何相关数据。入侵者现在可以通过规避验证来获取管理员权限。除了提供虚假访问权限外，SQL\
  \ 注入还可以被程序化为删除整个数据库、绕过密码要求、删除记录或添加不必要的数据。\n\nSQL 是一种用于管理关系型数据库中数据而开发的查询语言。它允许你查看、修改和删除数据。许多\
  \ Web 应用程序和网站都使用 SQL back 数据库来存储它们的所有数据。此外，你还可以利用 SQL 语句执行特定的操作系统功能。结果是，成功的 SQLi\
  \ 攻击可能会导致灾难性的后果：\n\n- 攻击者可以使用它泄露数据库中其他用户的凭据。他们随后可以滥用这些用户的身份进行冒充。被冒充的用户可能是一个拥有数据库完全访问权限的数据库管理员。\n\
  - 一种名为 SQL 的数据库查询语言允许从数据库选择并输出数据。SQL 注入漏洞可以赋予攻击者对数据库服务器数据的完全访问权限。\n- 此外，SQL 允许你向数据库更新和添加数据。例如，在金融应用程序中，攻击者可以使用\
  \ SQL 注入修改余额、使交易无效或将资金转移到自己的账户。\n- SQL 可用于删除数据库中的表和记录。即使管理员备份了数据库，数据破坏也可能导致应用程序停机，直到数据库恢复。此外，备份中可能不包含最新数据。\n\
  - 在某些数据库服务器上，你可以使用数据库服务器来访问操作系统。这可能是故意的，也可能是无意的。在这种情况下，攻击者可以从 SQL 注入开始，然后进入防火墙后的内部网络。\n\
  \n## SQL 注入类型\n\n三种不同类型的 SQL 注入是带内 SQL 注入（经典型）、推断型 SQL 注入（盲注/Blind）和带外 SQL 注入（Out-of-band）。SQL\
  \ 注入访问后端数据的方式以及它们可能造成的损害程度进行了分类。\n\n- **带内 SQLi：** 攻击者使用同一条通信链路发起攻击并获取信息。由于其简单高效，带内\
  \ SQLi 是最常见的 SQLi 攻击之一。这种方法分为两个变体：\n    - **基于错误信息的 SQLi：** 攻击者采取步骤导致数据库生成错误信息。这些错误信息提供的数据可以被攻击者用于获取有关数据库结构的知识。\n\
  \    - **基于 Union 的 SQLi：** 这种技术利用 `UNION` SQL 运算符，它将许多数据库选择语句合并到单个 HTTP 响应中。该响应可能包含攻击者可以使用的信息。\n\
  - **盲注（推断型）SQLi：** 为了理解服务器的结构，攻击者向其传递数据负载，然后观察其行为和反应。由于数据没有从网站数据库传输给攻击者，这种方法被称为盲注\
  \ SQLi。因此，攻击者无法在带内查看有关攻击的信息。盲注 SQL 依赖于服务器的响应和行为模式，因此执行速度较慢，但同样危险。各种类型的盲注 SQL 包括：\n\
  \    - **布尔型：** 攻击者向数据库发送 SQL 查询，请求应用程序的响应。根据查询是真是假，响应将有所不同。HTTP 响应中的信息将根据结果改变或保持不变。攻击者随后可以判断产生的消息是真还是假响应。\n\
  \    - **基于时间型：** 攻击者向数据库发送 SQL 查询，导致其在响应之前等待（指定的秒数）。攻击者可以根据数据库回答的时间短判断查询是否有效或无效。根据结果，将立即或在等待期后生成\
  \ HTTP 响应。在不依赖数据库数据的情况下，攻击者可以确定他们使用的消息返回的是真还是假。\n\n\n\n\n\n*   **带外 SQL 注入 (Out\
  \ of Band SQLi):** 只有当 Web 应用使用的数据库服务器启用了特定的函数时，这种攻击才可能。通常，这种攻击与带内（in-band）和推断型注入攻击结合使用。当服务器执行这些任务太慢或不可靠，或者攻击者无法通过同一通道启动攻击并收集信息时，就会利用\
  \ SQLi。为了向攻击者发送数据，这些技术依赖于服务器发送 DNS 或 HTTP 请求的能力。\n\n## SQL 注入攻击的检测与防护\n\n成功的 SQL\
  \ 注入攻击可能通过泄露隐私信息和破坏客户信任造成严重危害。因此，必须尽快检测此类攻击。Web 应用防火墙（WAF）是阻止 SQLi 威胁最常用的解决方案。WAF\
  \ 基于最新的攻击特征库，可以配置为对在线应用程序中的危险 SQL 查询发出告报。\n\n企业可以采取以下步骤防止 SQL 注入攻击：\n\n*   **对员工进行预防性技术的教育：**\
  \ IT 人员（如 DevOps 专业人员、系统管理员和软件开发团队）接受全面的安全培训至关重要，以理解 SQLi 攻击是如何发生的以及如何在 Web 应用中防止它们。\n\
  *   **不要信任用户输入：** SQL 查询中来自用户的输入会增加 SQL 注入成功的几率。在用户输入周围建立安全控制是缓解此类危险的最佳方法。\n*  \
  \ **使用白名单而非黑名单：** 因为黑客通常可以绕过黑名单，建议使用白名单而非黑名单来验证和过滤用户输入。\n*   **确保您的应用程序是最新版本且路由已更新：**\
  \ 过时的软件是常见的常见的 SQL 注入问题之一。旧技术不太可能内置 SQLi 安全防护，且未打补丁的软件更容易被操纵。这同样适用于编程语言。过去的语言和语法更容易脆弱。例如，使用\
  \ `PDO` 替代旧的 `MySQL`。\n*   **利用经过验证的预防技术：** 从头构建的查询字符串对 SQLi 攻击的防护不足。输入验证、预语句和参数化查询是保护\
  \ Web 应用的最佳方法。\n*   **定期扫描安全威胁：** 定期扫描 Web 应用可以在潜在漏洞造成重大危害之前检测并修复它们。\n\n### 简单的\
  \ SQLi 示例\n\n第一个示例非常直观。它展示了攻击者如何利用 SQL 注入漏洞绕过应用程序安全并以管理员身份进行验证。下面的脚本是运行在 Web 服务器上的伪代码。这是一个使用\
  \ `username` 和 `password` 进行身份验证的简单示例。示例数据库中的 `users` 表具有以下列：`username` 和 `password`。\n\
  \n## 定义 POST 变量\n\n```\nusername = request.POST[‘u_name’]\npassword = request.POST[‘p_word’]\n\
  ```\n\n## 易受 SQLi 攻击的 SQL 查询\n\n```\nSQL = “SELECT C_id FROM users WHERE username=’\
  \ +\nusername + “’ AND password=’” + password + “’”\n```\n\n 执行 SQL 语句\n\n```\n\
  database.execute(SQL)\n```\n\n这些输入字段中可以发生 SQL 注入。攻击者可以利用输入中的 SQL 命令来更改数据库服务器执行的\
  \ SQL 语句。例如，他们可以使用单引号技巧将 `password` 字段设置为：\n\n```\nPassword’ OR 2=2\n```\n\n结果是，数据库服务器运行以下\
  \ SQL 查询：\n\n```\nSELECT C_id FROM users WHERE username=’username’ AND\npassword=’password’\
  \ OR 2=2’\n```\n\n无论用户名或密码是什么，由于 OR `2=2` 语句，`WHERE` 子句始终返回 `users` 表中的第一个 `id`。管理员通常是数据库中的第一个用户\
  \ `id`。攻击者不仅获得了管理员权限，还绕过了身份验证。为了对查询的执行获得额外的控制，他们还可以注释掉剩余的 SQL 语句：\n\n```\n-- MySQL,\
  \ MSSQL, Oracle, PostgreSQL, SQLite\n‘ OR ‘2’=’2’ --\n‘ OR ‘2’=’2’ /*\n-- MySQL\n\
  ‘ OR ‘2’=’2’ #\n-- Access (using null characters)\n‘ OR ‘2’=’2’ %00\n‘ OR ‘2’=’2’\
  \ %16\n```\n\n## Sqlmap: 测试网站 SQL 注入漏洞\n\n随着技术的进步，网络攻击的风险正在增加。由于各种原因，网站越来越容易此类攻击。SQL\
  \ 注入攻击正在上升，威胁着 Web 应用的安全。扫描您的在线应用程序可以帮助避免数据丢失、网络攻击和业务中断。作为 Web 开发人员，您应该不断采取措施，保护您的\
  \ Web 应用免受黑客可以利用的 SQL 漏洞。`sqlmap` 工具是一个识别和利用 SQL 注入威胁的流行工具。\n\n## Sqlmap\n\nSqlmap\
  \ 是一款免费开源的渗透测试工具，用于检测和利用 SQL 注入漏洞并获得数据库系统的控制权。它配备了强大的检测引擎、为终极渗透测试者提供的系列专用功能，以及许多用于数据库指纹、从数据库提取数据、访问底层文件系统以及在操作系统上执行带外命令的开关。\n\
  \n### Sqlmap 的功能\n\n*   它完全支持 `MySQL`、`Firebird`、`PostgreSQL`、`Microsoft Access`、`Oracle`、`IBM\
  \ DB2`、`SQLite`、`Sybase`、`SAP MaxDB`、`Informix`、`MariaDB`、`MemSQL`、`TiDB`、`CockroachDB`、`Microsoft\
  \ SQL Server`、`H2`、`MonetDB`、`Apache Derby`、`Amazon Redshift`、`Vertica`、`Mckoi`、`HSQLDB`、`Altibase`、`MimerSQL`、`CrateDB`、`Greenplum`、`Cubrid`、`Presto`\
  \ 数据库系统。\n*   完全支持基于布尔的盲注、基于时间的盲注、报错、基于查询、堆叠查询和带外 SQL 注入能力。\n*   通过提供 DBMS 凭据、IP\
  \ 地址、端口和数据库名，可以直接连接数据库而不使用 SQL 注入。\n*   可以列出用户、密码哈希、权限、角色、数据库、表和列。\n*   可以使用基于字典的攻击破解密码哈希类型，因为它们会自动识别。\n\
  *   根据用户的偏好，支持导出整个数据库表、部分记录或特定字段。用户还可以从每个列条目中选择子字符进行导出。\n*   支持在所有数据库中搜索指定的数据库名称、特定表或特定列。例如，它可以搜索存储自定义应用程序凭据的表，其中相应的列名包含\
  \ `name` 和 `pass` 等字符串。\n*   在使用 `MySQL`、`PostgreSQL` 或 `Microsoft SQL Server` 时，可以从数据库服务器的底层文件系统下载和上传任何文件。\n\
  *   当 `MySQL`、`PostgreSQL` 或 `Microsoft SQL Server` 作为数据库软件时，支持在数据库服务器的底层操作系统上运行任意命令并接收其标准输出。\n\
  *   支持在数据库服务器操作系统与攻击者工作站之间建立带外状态 TCP 连接。根据用户的偏好，该通道可以是交互式命令行提示符、`Meterpreter` 会话或图形用户界面\
  \ (VNC) 会话。\n*   支持使用 Metasploit 的 `getsystem` 命令在数据库操作中提升用户权限。\n\n所有功能的详细描述可以从\
  \ wiki²（图 3.1](#C_007_c3.xhtml_f3_1)）学习。\n\n![](img/Fig03_01.jpg)\n\n图 3.1 Sqlmap\
  \ 下载链接。\n\n### 如何下载\n\n\n\n\n你可以在此处获取最新的 zip 包或 tarball 包。获取 `sqlmap` 的最佳方法是克隆 `Git`\
  \ 仓库：\n\n```\ngit clone --depth 1 https://github.com/sqlmapproject/\nsqlmap.git\
  \ sqlmap-dev\n```\n\n# Sqlmap 的使用场景\n\n如果你看到以 `.php?id=“` 结尾的网页地址，该网站在此模式下可能存在 SQL\
  \ 注入漏洞，攻击者可能访问数据库中的信息。\n\n为了评估目标在线应用程序的安全漏洞，`Sqlmap` 接受 `GET` 和 `POST` 协议。如果 URL\
  \ 中包含加粗的 `GET` 参数，则该网站更容易受到 SQL 注入攻击。黑客可以通过这种方式访问数据库中的信息。通过将 `GET` 参数替换为星号（`*`），我们可以检查网站的漏洞。\n\
  \n例如，访问 `http://checkphp.vulnerableweb.com/artists22.php?artist=4*`。\n\n如果该 URL\
  \ 返回错误，则该站点是允许访问的。你可以使用 `sqlmap` 来扫描或利用网络漏洞。在这里，我们将学习如何使用 sql map 来检查 Web 上的 SQL\
  \ 注入漏洞。对于从 `.php? id=“` 到“/”，开发者在 `.htaccess` 中使用了 URL 重写规则。这并不意味着它是安全的。\n\n# 漏洞\
  \ Web 应用程序 (DVWA)\n\nDamn Insecure Online Application 是一个高漏洞的 PHP/MySQL Web 应用程序。它的主要目标是帮助安全人员在合法环境中测试他们的技能和工具，帮助\
  \ Web 开发人员更好地理解 Web 应用安全流程，并帮助学生和老师在受控的教室环境中学习 Web 应用安全。\n\n`DVWA` 的目标是在基础简单的界面中通过不同的难度练习一些常见的\
  \ Web 漏洞。请注意，此程序既有记录的漏洞也有未记录的漏洞。这是故意为之。建议尽可能研究可能的问题。\n\n在本节中，我们将使用 `DVWA` 作为演示环境来测试我们的\
  \ `sqlmap` 命令，首先我们需要安装以下软件：\n\n* `Sqlmap`：使用以下代码安装：`$ sudo apt-get install sqlmap`\n\
  * DWV：步骤简单；只需按照指南在您的系统中安装 `DVWA` 即可。\n\n向 `sqlmap` 传递 `-h` 以显示命令的帮助菜单并验证其是否已安装。\n\
  \n```\n$ sqlmap –h\n```\n\n如果你不想安装 `DVWA`，可以使用这个公开访问的漏洞网站：`http://checkphp.vulnerableweb.com/artists22.php?artist=4*`。\n\
  \n既然一切已就绪，让我们开始吧。\n\n## 确定网站数据库管理系统 (DBMS)\n\n我希望你使用 `admin` 作为用户名、`password` 作为密码登录\
  \ `DVWA`，然后进入左下角的 `DVWA Security`，并将安全级别设置为 `Low`，这将允许我们在网站最脆弱的状态下利用它。\n\n![](img/Fig03_02.jpg)\n\
  \n[图 3.2] DVWA 登录页面。\n\n回到黑客终端，使用以下命令确定该网站的数据库列表：\n\n```\n$ sqlmap -u “http://localhost/vulnerabilities/\n\
  sqli/?id=1&Submit=Submit” --cookie “PHPSESSID=u8e7b7vb\nkkienkafe68a6pabzf; security=low”\
  \ –dbs\n```\n\n首先，我们使用 `-u` 参数指定目标 URL，在我的情况下是 `localhost/`，但你应该指定你的 `DVWA` 安装位置，例如，如果它在同一网络的另一机器上，且位于\
  \ `DVWA` 文件夹 `192.168.1.3/DVWA/vulnerabilities/sqli/?id=1&Submit=Submit`。\n\n我们还传递了\
  \ `--cookie` 参数，因为 `DVWA` 需要登录才能开始执行 SQL 注入，因此只需传递我们的 即可登录。你可以通过进入开发者控制台 > 网络，查找任何请求，滚动到请求标头（Request\
  \ Headers）部分并查找 `Cookie` 来找到你的 cookie。\n\n我们使用 `DBS` 获取网站可用数据库列表；以下是结果：\n\n```\n\
  available databases [2]:\n[*] dvwadb\n[*] information_schema\n```\n\n## 列出数据库中的表\n\
  \n如果你想搜索特定的数据库，使用 `-D` 参数指定数据库名，然后使用 `-table` 参数显示该数据库中所有表的列表：\n\n```\n$sqlmap -u\
  \ “http://localhost/vulnerabilities/\nsqli/?id=1&Submit=Submit” --cookie “PHPSESSID=u8e7b7vb\n\
  kkienkafe68a6pabzf; security=low” -D dvwadb –tables\n```\n\n**输出：**\n\nDatabase:\
  \ dvwadb\n[2 tables]\n\n| Guestbook |\n| --- |\n| Customers |\n\n太棒了，这个数据库中有两个表；我们将在下部分转储\
  \ `Customers` 表。\n\n## 获取表结构\n\n我们必须提供数据库、表以及 `-columns` 参数来检查特定表的可用列：\n\n```\n\
  $sqlmap -u “http://localhost/vulnerabilities/\nsqli/?id=1&Submit=Submit” --cookie\
  \ “PHPSESSID=u8e7b7vb\nkkienkafe68a6pabzf; security=low” -D dvwadb -T -columns\n\
  ```\n\n**输出：**\n\nDatabase: dvwadb\nTable: Customer\n\n| Column | Type |\n| ---\
  \ | --- |\n| password | varchar(32) |\n| user | varchar(15) |\n| avatar | varchar(70)\
  \ |\n| failed_login | int(3) |\n| first_name | varchar(15) |\n| last_login | timestamp\
  \ |\n| last_name | varchar(15) |\n| user_id | int(6) |\n\n当我们使用 `-T` 参数定义表名时发生的情况：\n\
  \nDatabase: dvwadb\nTable: Customer\n\n让我们转储此表以便查看所有行：\n\n```\n$sqlmap -u “http://localhost/vulnerabilities/\n\
  sqli/?id=1&Submit=Submit” --cookie “PHPSESSID=u8e7b7vb\nkkienkafe68a6pabzf; security=low”\
  \ -D dvwadb -T Customer –dump\n```\n\n我们将 `-columns` 替换为 `-dump`；这将向你提示各种问题，包括是否想将哈希保存到临时文件或使用字典攻击破解密码；我对这两个问题都选了\
  \ `Y`。\n\n## 使用预语句缓解 SQL 注入攻击\n\n当用户提供的数据被用作 SQL 查询的一部分时，SQL 注入是一种软件漏洞。由于数据验证缺陷，攻击者可以提交影响应用程序查询逻辑的合法\
  \ SQL 。结果是攻击者可以访问其他用户的敏感数据，并非法访问整个系统。尽管容易解决，SQL 注入漏洞仍然非常常见。在本节中，我们将查看如何通过良好的编码方法来避免这些缺陷，我们还将讨论预语句、其工作原理以及如何使用。\n\
  \n### 预语句\n\n预语句是一种参数化的、可重用的 SQL 查询，它要求开发者分别创建 SQL 命令和用户提供的数据。这种方法避免了 注入风险。\n\n\
  在 PHP 中，以下是不安全方法的示例：\n\n```php\n$query = “SELECT * FROM users WHERE user = ‘$user_name’\
  \ and password = ‘$password ‘“;\n$result = mysql_query ($query);\n```\n\n从上面的代码明显看出，用户提供的数据被直接插入到指定的\
  \ SQL 查询中。以下是 PHP 中预语句方法的示例：\n\n```php\n$stmt = $mysqli->prepare (“SELECT * FROM\
  \ users WHERE username =? AND password =?”);\n$stmt->Jheeta_Lal (“jl”, $username,\
  \ $password);\n$stmt->execute();\n```\n\n\n\n\n在这个示例中，用户提供的数据没有直接整合到 SQL 查询中。用户的数据被一个符号所取代。该符号作为一个占位符临时替换数据。在\
  \ SQL 查询使用占位符进行预编译后，之后再添加用户的数据。如果用户插入 `admin` 和 `a’ or ‘2’ = ‘2`，初始的 SQL 查询逻辑不会发生改变。相反，数据库将搜索用户名为\
  \ `admin` 且密码字面上为 `a’ or ‘2’ = ‘2` 的记录。\n\n## 预语句的作用机制\n\n在讨论预语句如何工作之前，让我们先来看 SQL\
  \ 查询的处理。它涉及六个基本步骤：\n\n* **解析 (Parsing)：** SQL 中的查询被拆分为标记（单个单词）。然后，它将运行语法错误检查和拼写检查，以确保\
  \ SQL 查询的有效性。\n* 数据库管理系统 (DBMS) 使用语义检查来确定查询的合法性。指定的列和表是否存在？这里的主要问题是，用户是否拥有运行此查询的必要权限？\n\
  * **绑定 (Binding)：** 使用字节码将查询转换为计算机可以解释的形式。然后将查询组合并交付到数据库服务器进行优化和运行。\n* **查询优化 (Query\
  \ Optimization)：** DBMS 选择最具成本效益的算法来执行查询。\n* **缓存 (Cache)：** 最优方法被保存在缓存中，这样下次执行相同的查询时，将跳过前四个步骤并立即开始执行。\n\
  * **执行 (Execution)：** 执行查询，用户接收结果。\n\n但考虑到它们不同于普通查询，预语句是如何通过这个过程的呢？\n\n尽管过程相同，但有几处不同：\n\
  \n语义检查等同于解析。在数据库引擎检测到占位符后，绑定过程使用占位符构建查询。稍后将添加用户的数据。名为“缓存”的步骤没有变化。查询被缓存以便再次使用。\n\n\
  在缓存之后、执行之前还有一个阶段：占位符替换。用户的信息现在被输入以替换占位符。最终查询将不会再次通过编译过程，因为查询已经经过了预编译（绑定）。由于由于，用户提供的数据始终被视为基本字符串，无法更改原始查询的逻辑。因此，该查询对该数据的\
  \ SQL 注入漏洞具有抵抗力。正如上面关于 SQLi 的章节所述，这是一种通过向其输入字段注入恶意的 SQL 语句进行最终执行，从而利用 SQL 语句固有缺陷的方法。自\
  \ 1998 年首次出现以来，它主要针对商店和银行账户。当与 DDOS 攻击、跨站脚本 (XSS) 或 DNS 劫持等其他类型的攻击结合时，它可以产生显著的影响。\n\
  \n## 术语\n\n* **验证 (Validation)：** 这是一个检查或确认用户输入是否符合预定义标准的过程，例如字符串不包含独立的单引号。\n* **清洗\
  \ (Sanitization)：** 修改输入以确保其有效的过程（例如双写单引号）；基本上，它可以被称为有效性检查。\n\n为了防止 SQL 注入，所有连接到动态\
  \ SQL 中的输入都必须经过适当的过滤和清洗。\n\n## SQL 攻击剖析\n\n一个 SQL 攻击包含以下两个部分：\n\n* **研究 (Research)：**\
  \ 检查连接到数据库的用户程序的漏洞部分。\n* **攻击 (Attack)：** 输入可以更改查询以有利于你的恶意字段。\n\n### 示例 1\n\n考虑以下用于身份验证表单的\
  \ Java 代码：\n\n```java\n String query = “SELECT userName, balance FROM accounts”\n\
  \  + “WHERE userID=“ + request.getParameter(\"userID”) +\n“and password=’“ + request.getParameter(“Password”)\
  \ + “‘“;\ntry\n{\n  Statement statement = connection.createStatement();\n  ResultSet\
  \ rs = statement.executeQuery(query);\n  while (rs.next())\n  {\n     page.addTableRow(rs.getString(“userName”),\n\
  \                      rs.getFloat(“balance”));\n  }\n}\ncatch (SQLException e)\n\
  \  {}\n```\n\n在正常情况下，当用户输入其 UserID 和密码时，将生成以下执行语句：\n\n```sql\nSELECT userName, balance\n\
  FROM accounts\nWHERE userID=510 and password=’whatislife’\n```\n\n假设的 SQL 注入攻击将利用密码字段来构造一个在所有情况下都评估为真的布尔表达式。考虑\
  \ userID userID 密码字段的以下设置：\n\n```\nuserID = 2’ or ‘2’ = ‘2\npassword = 2’ or ‘2’\
  \ = ‘2\n```\n\n随后 SQL 语句将转换为：\n\n```sql\nSELECT userName, balance\nFROM accounts\n\
  WHERE userID=’2’ OR ‘2’=’2’ and\n      password=’2’ OR ‘2’=’2’\n```\n\n由于条件 (OR\
  \ 2 = 2) 始终为真，查询将返回一个值。在不知道用户用户名或密码的情况下，系统成功验证了用户身份。\n\n使用预语句构建参数化查询，可以如下所示缓解漏洞：\n\
  \n```java\nString query = “SELECT userName, balance “+\n               “FROM accounts\
  \ WHERE userID = ?\n                    and password = ?”;\ntry {\nPreparedStatement\
  \ statement = connection.\nprepareStatement(query);\nstatement.setInt(1, request.getParameter(“userID”));\n\
  ResultSet rs = statement.executeQuery();\nwhile (rs.next())\n{\n  page.addTableRow(rs.getString(“userName”),\n\
  \                         rs.getFloat(“balance”));\n}\n} catch (SQLException e)\n\
  \   { ... }\n```\n\n如果攻击者尝试为 userID 列设置一个不是基本整数的值，`statement.setInt()` 将抛出 `SQLException`\
  \ 而不是允许查询完成。\n\n### 示例 2\n\n考虑在身份验证期间可能发生的另一种形式的攻击：\n\n```java\nString query = “SELECT\
  \ u_ID,Name, password Hash”+\n               “ FROM users WHERE Name = ‘“\n    \
  \           + request.getParameter(“user”) + “‘“;\nint userID = -1;\nHashMap userGroups\
  \ = new HashMap();\ntry\n{\n  Statement statement = connection.createStatement();\n\
  \  ResultSet rs = statement.executeQuery(query);\n  rs.first();\n  userID = rs.getInt(“u_ID”);\n\
  \nif (!hashOf(request.getParameter(“password”)).\nequals(rs.getString(“password_Hash”)))\n\
  {\n\n  throw BadLoginException();\n}\n\nString userGroupQuery = “SELECT group FROM\n\
  groupMembership”+\n                          “ WHERE u_ID = “ + u_ID;\n\nrs = statement.executeQuery(userGroupQuery);\n\
  \nwhile (rs.next())\n{\n  userGroup.put(rs.getString(“group”), true);\n}\n}\ncatch(SQLException\
  \ e){}\ncatch(BadLoginException e){}\n```\n\n这是一个典型的查询插图：\n\n```sql\nSELECT userID,\
  \ userName, passwordHash\nFROM users\nWHERE userName = ‘Anam’\n```\n\n攻击者可以向 userName\
  \ 字段注入以下内容：\n\n```sql\nAnam’;\nINSERT INTO groupMmbership (userID, group)\nVALUES\
  \ (SELECT userID FROM users\nWHERE userName=’Anam’, ‘Administrator’); --\n```\n\n\
  ```\n真实的问题将变为：\n\n```sql\nSELECT u_ID, Name, password hash FROM\n       users WHERE\
  \ Name = ‘Anam’;\nINSERT INTO groupMmbership (u_ID, group)\nVALUES (SELECT u_ID\
  \ FROM users\nWHERE userName=’Anam’, ‘Administrator’); --’\n```\n\n原始语句后面将附加另一个\
  \ SQL 语句，导致用户被添加到 Administrator 数据库中。以下示例显示了如何利用带有参数化查询的预语句来最小化攻击。\n\n```java\n\
  \ String query = “SELECT u_ID, Name, passwordHash”+\n             “ FROM users WHERE\
  \ userName = ?”;\n\ntry\n{\nPreparedStatement statement =\n      connection.prepareStatement(userLoginQuery);\n\
  statement.setString(1, request.getParameter(“user”));\nResultSet rs = statement.executeQuery();\n\
  }\n```\n\n考虑这个关于查询漏洞的第三个示例，将在下文进一步讨论：\n\n\n\n\n\n```\nString query = “INSERT INTO\
  \ users VALUES(“ +\n      request.getParameter(“userName”) + “);”;\n```\n\n以下是一个广义的问题：\n\
  \n```\nINSERT INTO users VALUES(“Anam”)\n```\n\n考虑如果攻击者在 `userName` 字段中输入以下内容会发生什么：\n\
  \n```\n“Anam); DROP TABLE users;”\n```\n\n之后，查询将变为：\n\n```\nINSERT INTO users VALUES\
  \ (“Anam”); DROP TABLE users;\n```\n\n当运行此查询时，它会完全删除 `users` 表。同样，可以使用预编译语句（prepared\
  \ statement）作为解决方案。\n\n### 在 Java 中使用预编译语句的好处是什么？\n\n输入会被预编译语句进行“清理”。这确保了无论用户输入什么，它们都会被视为\
  \ `SQL` 中的字符串字面量，而不是包含在 `SQL` 查询中。它还可以检测并消除危险代码，并转义特定字符。在其他语言（如 `PHP`）中，可以使用 `filter\
  \ input` 或 `filter input` 数组来清理字符串。\n\n### 输入清理（Sanitization）又是怎样的？\n\n从用户提供的数据中删除任何不需要的字符（例如\
  \ ' / \" ）的技术被称为输入清理。然而，这种策略不足以避免所有类型的 `SQL 注入`，而且极难掌握。为了绕过清理，有多种绕过策略，例如数据编码。尽可能避免使用输入清理。相反应该使用预编译语句或存储过程。\n\
  \n## 总结\n\n在本章中，我们学习了 `SQL 注入`，这是一种利用薄弱 `SQL` 语句的攻击类型。通过使用 `SQL 注入`，可以访问、插入、更新和删除数据，并绕过身份验证过程。在编写\
  \ `SQL` 语句时，使用良好的安全实践措施，以降低 `SQL 注入` 的风险。我们还讨论了 SQL 注入工具，包括 `Sqlmap`，并对预编译语句和输入清理进行了简要解释。\n\
  \n## 笔记\n\n# 第 4 章节 SQL 函数\n\nDOI: [10.1201/9781003358435-4](https://doi.org/10.1201/9781003358435-4)\n\
  \n## 本章内容\n\n* ➢ 什么是 SQL 函数\n* ➢ 不同类型的函数\n* ➢ 语法和示例\n\n在上一章中，我们学习了 `SQLi`、如何防止 `SQLi`\
  \ 攻击、以及 `sqlmap` 及其功能，我们还简要介绍了预编译语句及其在 `SQL` 中的作用。函数是一个接受一个或多个参数作为输入、处理它们、然后返回输出的公式。它是一种返回单个值并接受参数的编程结构。函数参数可以改变结果或返回结果。函数的奇之处在于它可以嵌入到表达式中，因为它是自包含的。在\
  \ `Oracle SQL` 中，表达式的定义是一条 `SQL` 代码语句，甚至是另一个函数。\n\n## SQL 函数\n\n`SQL` 函数是一个非常强大的功能，可以用于对数据进行计算、更改单个数据项、更改行组的输出、为显示格式化数据和数字以及转换列数据类型。`SQL`\
  \ 函数始终输出一个值并可以接受输入。\n\n`SQL` 函数是用于帮助数据库处理、修改和维护的常规例程。`SQL` 函数是 `SQL` 数据库系统中经常使用和重复使用的子程序，用于处理和操作数据。为了创建和管理数据库，所有的\
  \ `SQL` 数据库系统都包含了 `DDL`（数据定义语言）和 `DML`（数据操作语言）工具。\n\n`SQL` 中共有五类通用函数。提供唯一对象指针访问的对象引用函数、将行分组为组的聚合函数、同样进行分组但允许深度数据分析的分析函数，以及你可以使用如\
  \ `PL/SQL` 等编程语言创建的自定义定义函数，这些是其他类型的函数。\n\n*   **单行函数：** 可以对查询的每一行进行单独操作。换句话说，可以使用单行函数对查询检索的每行执行相同的处理。\n\
  *   **聚合函数：** 这些函数将重复的分组组合成行，并将重复的值聚合为总和或平均值等内容。\n*   **分析函数：** 统计分析产生的是聚合子集的摘要，而不是将迭代拆分为不同部分的聚合操作器。\n\
  *   **对象引用函数：** 这些函数使用指针引用值。对象引用函数通常从对象中解引用值或引用其他对象。\n*   **用户定义函数：** 可以 `PL/SQL`\
  \ 创建自定义函数，扩展 `Oracle SQL` 丰富的内置功能库。\n\n聚合函数、标量函数（非聚合函数）和分析函数是 `SQL` 函数的主要形式，在本章中将详细讨论。非聚合函数与\
  \ `GROUP BY` 配合并对每条记录单独操作，而聚合函数作用于多条记录并产生摘要。`SQL` 拥有大量的内置函数来执行各种数据计算。\n\n### 聚合函数\n\
  \n它在对一组值进行计算后返回一个单值。它们可以用于 `SELECT` 语句的选择列表或 `HAVING` 子句。要计算数据类别的聚合情况，请结合 `GROUP\
  \ BY` 子句使用聚合。要计算给定值范围的聚合情况，请使用 `OVER` 子句。`GROUPING` 或 `GROUPING _ID` 聚合不能跟随 `OVER`\
  \ 子句。\n\n在相同的输入数据上执行时，所有的聚合函数都是确定性的，这意味着它们总是返回相同的输出。\n\n| 函数 | 描述 |\n| --- | ---\
  \ |\n| `SUM()` | 返回一组值的总和。 |\n| `COUNT()` | 返回行数。 |\n| `AVG()` | 返回平均值。 |\n| `MIN()`\
  \ | 返回最小值。 |\n| `MAX()` | 返回最大值。 |\n| `FIRST()` | 返回第一个值。 |\n| `LAST()` | 返回最后一个值。\
  \ |\n\n### 分析函数\n\n分析函数从一组行计算出一个总和。与聚合函数不同，分析函数可以为每个组返回多个行。在组内，分析函数可以用于生成移动平均值、累计总和、百分比。\n\
  \n### 标量 SQL 函数\n\nSQL 标量函数从给定的输入值返回一个单值。这里是一些常用的聚合函数。让我们深入研究上述每个函数。\n\n| 函数 | 描述\
  \ |\n| --- | --- |\n| `LCASE()` | 将字符串列转换为小写 |\n| `UCASE()` | 将字符串列转换为大写 |\n| `LEN()`\
  \ | 返回列值的长度 |\n| `MID()` | 从字符串类型的列值中提取子字符串 |\n| `ROUND()` | 将数值舍入到最近的整数 |\n| `NOW()`\
  \ | 返回当前系统日期和时间 |\n| `FORMAT()` | 格式化字段显示方式 |\n\n\n\n\n\n例如，我们可以使用这些函数来计算平方根、对数、舍入、取整、基本指数值以及三角函数。然而，下面列出了几个常用的函数：\n\
  \n| 名称 | 描述与语法 |\n| --- | --- |\n| `ABS` | 返回绝对值语法：`ABS (number|expression)` 示例：`Select\
  \ abs(-2);` 返回 2 |\n| `ACOS` | 返回参数的反余弦值语法：`ACOS(numeric_expression)` 示例：`Select\
  \ acos(0);` 返回 1.57079632679 |\n| `ASIN` | 返回参数的正弦值语法：`ASIN(numeric_expression)`\
  \ 示例：`SELECTASIN(0.5) angle_1_radians,` 返回 0.523598775598299 |\n| `ATAN` | 返回参数的正切值语法：`ATAN(x)`\
  \ 示例：`SELECT ATAN(1);` 返回 0.7855398163 |\n| `CEILING,CEIL` | 将浮点值舍入到最近的整数语法：`CEIL(numeric_expression)`\
  \ 示例：`SELECT CEIL(50.49);` 返回 61 |\n| `COS` | 返回参数的余弦值语法：`COS(numeric_expression)`\
  \ 示例：`SELECT COS(0) cos_zero;` 返回 1 |\n| `COT` | 返回参数的余切值语法：`COT(numeric_expression)`\
  \ 示例：`SELECT COT(PI()/5) cot_one_fifth_pi;` 返回 11.4300523 |\n| `EXP` | 返回 e 常数 (2.71828...)\
  \ 的特定数字幂语法：`EXP(number | expression)` 示例：`SELECT EXP(5);` 返回 148.413159103 |\n|\
  \ `LN` | 返回参数的自然对数。 |\n| `LOG` | 返回第一个参数的自然对数。 |\n| `LOG10` | 返回参数的以 10 为底的对数。 |\n\
  | `LOG2` | 返回参数的以 2 为底的对数。 |\n| `MOD` | 返回一个数字除以另一个数字后的剩余（取模）语法：`MOD(a,b);` 示例：`SELECT\
  \ 20/5 as integer, MOD (20,5) as remainder;` 返回 20, 5 |\n| `PI` | 结果为 pi，即 3.14159265358979。语法：`SELECT\
  \ PI()` |\n| `POWER` | `POWER` 返回一个经过给定数字幂的值语法：`POWER(numeric_expression,power)`\
  \ 示例：`SELECT POWER(5,1);` 返回 5 |\n| `RAND` | 返回随机浮点值语法：`SELECT RAND();` |\n| `ROUND`\
  \ | 将数字舍入到特定的精度语法：`SELECT ROUND(..value.., number_of_decimal_places)` |\n| `SIGN`\
  \ | 返回参数的符号语法： | |\n| `SIN` | 返回参数的正弦值语法：`SIN(numeric_expression)` |\n| `SQRT` |\
  \ 返回参数的平方根语法：`SQRT(number | expression)` |\n| `TAN` | 返回参数的正切值语法：`tan A = a/b` |\n\
  | `TRUNCATE` | 截断到指定的小数位数语法：`TRUNCATE(n, d)` |\n\n## 转换函数\n\nOracle 内置函数库除了 SQL\
  \ 实用函数外还包含了类型转换函数。在某些情况下，查询可能期望某种数据类型的输入，但接收的是不同的数据类型。在某些情况下，Oracle 会尝试隐式地将意外的值转换为兼容的数据类型，以便在不影响应用程序连续性的情况下替换。Oracle\
  \ 可以根据程序员的偏好直观或显式地转换类型（参见图 4.1）。\n\n![](img/Fig04_01.jpg)\n\n图 4.1 转换类型。\n\n###\
  \ 显式与隐式\n\n在实践中，所有的编程语言都提供了数据类型转换的进程或设施，即将一个的值的数据类型更改为另一种数据类型的过程。当我们转向 SQL Server\
  \ 以讨论 SQL 数据转换程序的细节时，可以将数据转换过程分为两类：隐式转换和显式转换。SQL Server 为了内部目的执行隐式转换，你可以在后面的“Server\
  \ 隐式转换”部分了解更多信息。显式转换由数据库程序员或管理员显式执行，并同时借助任何数据转换函数的帮助完成。\n\n### 隐式数据类型的转换\n\nOracle\
  \ 可以隐式地将 `VARCHAR2` 或 `CHAR` 值转换为 `NUMBER` 或 `DATE` 类型值。同样，Oracle 服务器可以自动将 `NUMBER`\
  \ 或 `DATE` 类型值转换为字符数据。值得注意的是，只有当字符代表有效的数值或日期类型值时，才会发生隐式相互转换。\n\n| 从 | 到 |\n| ---\
  \ | --- |\n| `VARCHAR2 or CHAR` | `NUMBER` |\n| `VARCHAR2 or CHAR` | `DATE` |\n\
  | `DATE` | `VARCHAR2` |\n| `NUMBER` | `VARCHAR` |\n\n**示例**：查看下方的 `SELECT` 查询。因为\
  \ Oracle 在内部将 2000 和 ‘2000’ 视为相同，所以两个查询都将返回相同的答案。\n\n**查询 1：**\n\n```\nSELECT emp_id,\
  \ F_name, Bonas\nFROM employees Data\nWHERE bonas > ‘20000’;\n```\n\n**查询 2：**\n\
  \n```\nSELECT emp_id, F_name, Bonas\nFROM employees Data\nWHERE bonas > ‘20000’;\n\
  ```\n\n**输出：**\n\n| Emp_ID | F_Name | Bonas |\n| --- | --- | --- |\n| **10524**\
  \ | Stevan | 34,000 |\n| **10785** | Naive | 27,000 |\n| **10289** | Lexi | 30,000\
  \ |\n\n### SQL 显式数据类型转换\n\n是单行函数可以对列值、字面量或表达式进行类型转换。执行数据类型交叉修改的三个函数是 `TO_CHAR`、`TO_NUMBER`\
  \ 和 `TO_DATE`。\n\n**语法：**\n\n```\nTO_CHAR (number1, [format], [nls_parameter])\n\
  ```\n\n### 使用 TO CHAR 函数处理日期\n\n**语法：**\n\n```\nTO_CHAR (date, ’format_model’)\n\
  ```\n\n格式模型如下：\n\n*   它是区分大小写的，并且必须包含单引号内。\n*   可以使用任何有效的日期格式元素。\n*   具有 FM 元素用于抑制前导零或删除填充空格。\n\
  *   用逗号与日期值隔开。\n\n**示例：**\n\n```\nSELECT Emp_id, TO_CHAR (J_date, ’MM/YY’) Month_Hired\n\
  FROM employees data\nWHERE L_name = ’DEPP’;\n```\n\n### 使用 TO CHAR 函数处理数字\n\n**语法：**\n\
  \n```\nTO_CHAR (number, ’format_model’)\n```\n\n要将数字值显示为字符，你可以使用带有以下格式元素的 `TO_CHAR`\
  \ 函数：\n\n**示例：**\n\n```\nSELECT TO_CHAR(salary, ’$55,555.00’) SALARY\nFROM employees\
  \ data\nWHERE L_name = ’TUD’;\n```\n\n**输出：**\n\n| Salary |\n| --- | --- |\n| **$9,000**\
  \ |\n\n### to Number 和 Date 函数\n\n使用 `TO_NUMBER` 函数将字符字符串转换为数值格式：\n\n**语法：**\n\n\
  ```\nTO_NUMBER(char[, ’format_model'])\n```\n\n使用 `TO_DATE` 函数将字符字符串转换为日期：\n\n```\n\
  TO_DATE(char[, ’format_model'])\n```\n\n这些函数上有一个 `fx` 修饰符。这种修改为 `TO_DATE` 函数的字符参数和日期格式模型提供了精确匹配。\n\
  \n**示例：**\n\n```\nSELECT L_name, J_date\nFROM employees data\nWHERE J_date = TO_DATE\
  \ (’JUNE 24, 1995’, ’Month DD, YYYY’);\n```\n\n**输出：**\n\n| Last Name | Hire Date\
  \ |\n| --- | --- |\n| **True** | 24-June-95 |\n\n## SQL 中的通用函数\n\n这些函数用于处理空值并处理任何数据类型。许多数学函数、组件处理函数（包括虚拟组件）、日期函数、正反地理编码、交互式选择以及系统函数（例如报告类型、表缓存、手动线程配置、值序列和向量数值函数）都包含在这些通用函数中（参见图\
  \ 4.2）。\n\n![](img/Fig04_02.jpg)\n\n图 4.2 SQL 中的通用函数。\n\n### NVL()\n\n它是一个将空值转换为有效值的\
  \ SQL 函数。日期、字母和整数都是可以采用的数据类型示例。数据类型必须兼容，即 `expr1` 和 `expr2` 必须是相同的数据类型。\n\n**语法：**\n\
  \n```\nNVL (expr1, expr2);\n```\n\n\n\n\n\n`expr1` 是可能包含空值的源值或表达式。\n\n`expr2` 是转换空值时的预期结果。\n\
  \n### NVL2 函数\n\n`NVL2` 功能用于评估底层表达式（`expr1`, `expr2`, `expr3`）。如果主表达式不为空，`NVL2`\
  \ 功能返回随后的表达式。如果主表达式为空，则返回第三个表达式，例如，在 `expr1` 不为空的情况下，`NVL2` 返回 `expr2`。当 `expr1`\
  \ 为空时，`NVL2` 返回 `expr3`。`expr1` 冲突（参数）可以使用任何类型的数据。\n\n**语法：**\n\n```\nNVL2 (expr1,\
  \ expr2, expr3)\n```\n\n`expr1` 是源值或表达式，可能包含也可能不空值。\n\n如果 `expr1` 不空，返回的值为 `expr2`。\n\
  \n如果 `expr1` 为空，则返回的值为 `expr3`。\n\n### DECODE()\n\n它执行 `IF-THEN-ELSE` 或 `CASE` 语句的功能，简化了条件搜索。借助计算机语言中无处不在的\
  \ `IF-THEN-ELSE` 逻辑，`DECODE` 函数会对表达式进行解码。`DECODE` 函数在将每个搜索值与表达式进行比较后对其解码。如果表达式匹配搜索，则返回结果。\n\
  \n当搜索值不匹配任何结果值且省略了默认值时，将返回空值。\n\n**语法：**\n\n```\nDECODE(col|expression, search1,\
  \ result1\n [, search2, result2,...,][, default])\n```\n\n### COALESCE()\n\n它会检查主表达式，如果主表达式不为空，它返回该表达式；否则，它对剩余的表达式进行\
  \ `COALESCE` 处理。\n\n`COALESCE()` 功能相比于 `NVL()` 功能的优势在于 `COALESCE` 功能可以接受不同的替换属性。简单来说，`COALESCE()`\
  \ 功能返回列表中的第一个非空表达式。\n\n**语法（句法结构）：**\n\n```\nCOALESCE (expr_1, expr_2, ... expr_n)\n\
  ```\n\n### NULLIF()\n\n`NULLIF` 功能检查两个表达式。假设它们相等，该功能将返回空值。如果它们不等等，该功能返回主表达式。你不能为第一个表达式指定严格\
  \ NULL。\n\n**语法（句法结构）：**\n\n```\nNULLIF (expr_1, expr_2)\n```\n\n### LVL()\n\n`LVL`\
  \ 在条件的两个操作数之一可能为空时评估该条件。该功能可以专门用于查询的 `WHERE` 子句。它接受一个条件作为参数，并在条件为 FALSE 或 UNKNOWN\
  \ 时返回 TRUE，在条件为 TRUE 时返回 FALSE。\n\n**语法（句法结构）：**\n\n```\nLVL( condition(s) )\n```\n\
  \n## SQL 中的条件语句\n\n它们用于描述在满足某些条件的情况下要执行的逻辑。SQL 策略中支持两种条件语句：\n\n* `CASE`\n* `IF`\n\
  \n`CASE` 语句遍历条件，并在主条件满足时返回一个值（类似于 `else` 声明）。通过这种方式，当某个条件有效时，它将停止解析并返回结果。假设没有条件满足，它返回\
  \ `ELSE` 语句中的值。如果没有 `ELSE` 条件且没有条件为真，它将返回 NULL。\n\n**语法（句法结构）：**\n\n```\nCASE\n\
  \    WHEN condition1 THEN result1\n    WHEN condition2 THEN result2\n    WHEN condition\
  \ THEN resultN\n    ELSE result\nEND;\n```\n\n### SQL 中的 Case 语句\n\n`CASE` 语句可以根据满足某些条件的情况限制性地进入某些逻辑。有两种\
  \ `CASE` 语句：\n\n* **简单 CASE 语句 (Simple Case Expression)：** 用于根据特定值进入逻辑。\n* **搜索\
  \ CASE 语句 (Searched Case Expression)：** 用于根据表达式的值进入逻辑。`CASE` 声明的 `WHEN` 部分描述了满足时决定控制流的值。\n\
  \n以下是一个带有简单类-声明时-条件的 `CASE` 语句的 SQL 过程示例：\n\n```\n CREATE PROCEDURE UPDATE_DEPT\
  \ (IN p_workdept)\n  LANGUAGE SQL\n  BEGIN\nDECLARE v_workdept CHAR(7);\nSET v_workdepart\
  \ = p_workdepart;\nCASE  v_workdepart\n      WHEN ‘A1’ THEN\n        UPDATE department\
  \ SET d_name = ‘D1’;\n      WHEN ‘B1’ THEN\n        UPDATE department SET d_name\
  \ = ‘D2’;\n      ELSE\n        UPDATE department SET d_name = ‘D3’;\n      END CASE\n\
  END\n```\n\n以下是一个带有搜索类-声明时-条件的 `CASE` 声明示例：\n\n```\n CREATE PROCEDURE UPDATE_DEPART\
  \ (IN p_workdepart)\n  LANGUAGE SQL\n  BEGIN\nDECLARE v_workdept CHAR(3);\nSET v_workdept\
  \ = p_workdept;\nCASE\nWHEN v_workdept = ‘A1’ THEN\nUPDATE department SET departname\
  \ = ‘D1’;\nWHEN v_workdept = ‘B1’ THEN\nUPDATE department SET departname = ‘D2’;\n\
  ELSE\nUPDATE department SET departname = ‘D3’;\nEND CASE\nEND\n```\n\n### SQL 中的\
  \ IF 声明\n\n在某些情况下可以使用断言根据满足某些条件的情况限制性地进入某些逻辑。`IF` 声明与带有搜索类声明时-条件的 `CASE` 语句完全相同。`IF`\
  \ 声明支持可选的 `ELSE IF` 条件和默认的 `ELSE` 条件。预期用 `END IF` 条件表示断言的结束。\n\n以下是一个包含 `IF` 语句的过程示例：\n\
  \n```\nCREATE PROCEDURE UPDATE_SAL (IN empNum CHAR(10),\nINOUT rating SMALLINT)\n\
  LANGUAGE SQL\nBEGIN\nIF rating = 2 THEN\nUPDATE employee\nSET salary = salary *\
  \ 2.10, bonus = 2000\nWHERE empno = empNum;\nELSEIF rating = 4 THEN\nUPDATE employee\n\
  SET salary = salary * 2.05, bonus = 1000\nWHERE empno = empNum;\nELSE\nUPDATE employee\n\
  \nSET salary = salary * 1.03, bonus = 500\nWHERE empno = empNum;\nEND IF;\nEND\n\
  ```\n\n## 字符函数\n\n字符功能识别字符输入并可以返回字符或数字属性作为结果。SQL 提供了多种数据类型，包括 – `CHAR`, `VARCHAR`,\
  \ `VARCHAR2`, `LONG`, `RAW` 和 `LONG RAW`。不同的数据类型分为三种不同的数据类型：\n\n* **VARCHAR2：**\
  \ 变长度字符数据类型，其信息由 RDBMS 更改。\n* **CHAR：** 固定长度类型。\n* **RAW：** 变长度数据类型，其信息不由 RDBMS\
  \ 更改，而是完全以“原始”结构保留。\n\n当人的功能返回一个类型可靠为 `VARCHAR2`（变长度）的值时，带有两个例外：`UPPER` 和 `LOWER`。这些功能分别转换为大写和小小写，并返回\
  \ `CHAR` 值（固定长度），假设它们要处理转换的字符串是**固定长度**的 `CHAR` 内容。\n\nSQL 提供了丰富的字符功能集合，允许你通过多种方式获取有关字符串的信息并更改这些字符串中的项。\n\
  \n* 字符功能分为以下两种：\n* 大小写函数（`LOWER`, `UPPER` 和 `INITCAP`）\n* 字符处理函数（`REPLACE`, `CONCAT`,\
  \ `LENGTH`, `SUBSTR`, `INSTR`, `LPAD`, `RPAD` 和 `TRIM`）\n\n### 大小写函数\n\n* **Lower：**\
  \ 它具有将字母属性全部转换为小写的能力。如果输入字符串是固定长度，`LOWER` 将返回一个固定长度的字符串。`LOWER` 不更改字符串中不是字母的字符，因为大小写对于数字和特殊字符不重要，例如美元符号\
  \ ($) 或模数 (%)。\n\n**语法（语言结构）：**\n\n```\nLOWER(SQL course)\nInput1: SELECT LOWER(‘TechFORTech’)\
  \ FROM DUAL;\nOutput1: TechFORTech\nInput2: SELECT LOWER(‘DATABASE@456’) FROM DUAL;\n\
  Output2: database@456\n```\n\n\n\n\n- **Upper:** 此功能将字母字符值完全转换为大写。同样，由于 `UPPER`\
  \ 功能在接近的字符串本身已经是固定长度的情况下，它实际上会返回一个固定长度的字符串。`UPPER` 不会更改字符串中任何非字母字符，因为大小写对于数字和特殊字符（例如美元符号\
  \ $ 或取模符号 %）来说是不重要的。\n\n**语法（语言结构）：**\n\n```\nUPPER (SQL course)\nInput1: SELECT\
  \ UPPER (‘techpoint’) FROM DUAL;\nOutput1: techpoint\nInput2: SELECT UPPER(‘Abcd\
  \ $407%10’) FROM DUAL;\nOutput2: Abcd $407%10\n```\n\n- **Initcap:** 它具有将每个单词的首字母完全转换为大写，而将其余字母全部转换为小写的能力。字符串中的单词应通过\
  \ # 或 _ 空格分隔。\n\n**语法（句式结构）：**\n\n```\nINITCAP(SQL course)\nInput1: SELECT INITCAP(‘Tech\
  \ point is a software\nengineering gateway for nerds’) FROM DUAL;\nOutput1: Tech\
  \ point is A Computer Science Portal For Geeks\nInput2: SELECT INITCAP (‘LEARN_CODES_FOR_GOOD’)\
  \ FROM DUAL;\nOutput2: Learn_Codes_For_Good\n```\n\n### 字符处理函数\n\n- **Concat:**\
  \ 此功能通常将 `string2` 附加（链接）到 `string1` 的末尾。如果两个字符串都是 NULL，`CONCAT` 功能返回非 NULL 的内容。如果两个字符串均为\
  \ NULL，`CONCAT` 则返回 NULL。\n\n**语法：**\n\n```\nCONCAT(‘String1’, ‘String2’)\nInput1:\
  \ SELECT CONCAT (‘Data’ ,’Learning’) FROM DUAL;\nOutput1: DataLearning\nInput2:\
  \ SELECT CONCAT( NULL ,’Operating System’) FROM DUAL;\nOutput2: Operating System\n\
  Input3: SELECT CONCAT( NULL ,NULL ) FROM DUAL;\nOutput3: -\n```\n\n- **Length:**\
  \ 此功能返回信息字符串的长度。如果信息字符串为 NULL，`LENGTH` 功能返回 NULL 而不是 0。同样，假设信息字符串在开头、中间或结尾包含额外的区域，那么\
  \ `LENGTH` 功能会将这些额外区域也包含在内，并返回字符串的总长度。\n\n**语法：**\n\n```\nLENGTH (Column|Expression)\n\
  Input1: SELECT LENGTH (‘Dancing Is Love ‘) FROM DUAL;\nOutput1: 20\nInput2: SELECT\
  \ LENGTH (‘ Write an Experience ‘) FROM DUAL;\nOutput2: 24\n Input3: SELECT LENGTH\
  \ (‘’) FROM DUAL; or SELECT LENGTH ( NULL ) FROM DUAL;\n```\n\n- **Substr:** 它具有从给定起始点到终点返回字符串片段的能力。如果没有给出子字符串的长度，则\
  \ `SUBSTR` 将返回从确定的起始位置开始到字符串结束的所有字符。\n\n**语法：**\n\n```\nSUBSTR(‘String’,start-index,length_of_extracted_string)\n\
  Input1: SELECT SUBSTR (‘Data management, 15) FROM DUAL;\nOutput1: Data\nInput2:\
  \ SELECT SUBSTR (‘Data Manage System’, 9, 7) FROM DUAL;\nOutput2: Manage\n```\n\n\
  - **Instr:** 此功能返回指定字符或字符串在给定字符串中的数字位置。或者，你可以给出一个位置 `m` 作为开始查找，以及字符串的第 `n` 次出现。同样，如果没有给出起始位置，它将默认从第\
  \ 1 条记录开始搜索。如果在字符串中查找后没有找到匹配项，`INSTR` 功能将返回 0。\n\n**语法：**\n\n```\nINSTR (Column|Expression,\
  \ ‘String’, [,m], [n])\nInput: SELECT INSTR (‘Google applications are great applications’,’app’,1,2)\
  \ FROM DUAL;\nOutput: 23\n```\n\n- **LPAD and RPAD:** 这些功能根据使用情况将字符串向左或向右填充，因此，`LPAD`\
  \ 中的 ‘L’ 和 `RPAD` 中的 ‘R’ 会将其填充到预定义的长度，并使用预定的填充字符串。如果没有指定填充字符串，则给定字符串将根据使用情况在左侧或右侧填充空格。\n\
  \n**语法：**\n\n```\nLPAD(Column|Expression, n, ‘String’)\nSyntax: RPAD(Column|Expression,\
  \ n, ‘String’)\nLPAD Input1: SELECT LPAD (‘105’,5,'*’) FROM DUAL;\nLPAD Output1:\
  \ **105\nLPAD Input2: SELECT LPAD(‘hey’, 29, ‘Tech’) FROM DUAL;\nLPAD Output2: TechTechTechTechhey\n\
  \   RPAD Input1: SELECT RPAD(‘8000’,7,’*’) FROM DUAL;\nRPAD Output1: 8000***\nRPAD\
  \ Input1: SELECT RPAD(‘Lern’, 25, ‘time’) FROM DUAL;\nRPAD Output1: Lerntimetimetimetime\n\
  ```\n\n- **Trim:** 此功能管理字符串的开头或结尾（或两者）。假设没有指定要从字符串中管理的特定字符串或字符，且字符串开头或结尾存在额外空间，则这些额外区域将被移除。\n\
  \n**语法：**\n\n```\nTRIM(Leading|Trailing|Both, trim_character FROM trim_source)\n\
  Input1: SELECT TRIM(‘T’ FROM ‘TECH’) FROM DUAL;\nOutput1: ECH\nInput2: SELECT TRIM(‘techpoint’)\
  \ FROM DUAL;\nOutput2: Techpoint\n```\n\n- **Replace:** 此功能查找字符串，每当找到，就会在字符串的每个发生处替换为给定的替换字符串。替换对于查找字符示例并在单次功能调用中更改该示例的所有情况非常有用。如果没有给出替换字符串，`REPLACE`\
  \ 功能将消除信息字符串中该字符字符串的所有发生处。如果既未确定匹配字符串也没有替换字符串，`REPLACE` 返回 NULL。\n\n**语法：**\n\n\
  ```\nREPLACE(Text, search_string, replacement_string)\nInput1: SELECT REPLACE(‘DATA\
  \ MANAGEMENT’, ‘DATA’,’DATABASE’) FROM DUAL;\nOutput1: DATABASE MANAGEMENT\nInput2:\
  \ SELECT REPLACE(‘abcdeabcccabdddeeabcc’, ‘ABC’) FROM DUAL;\nOutput2: deccabdddeec\n\
  ```\n\n\n\n默认行为是溢出错误（flood blunder）。对于这种情况，标准要求提供带有 `SQLSTATE 22001` 的异常——从实际操作来说，这种必要性并没有被满足。`ON\
  \ OVERFLOW` 语句通过简单的链接来防止溢出；然而，许多属性如结果类型可能会强制执行。此外，`ON OVERFLOW` 条件允许确定结果的结束方式：\n\
  \n```\nON OVERFLOW TRUNCATE [] WITH [OUT] COUNT\n```\n\n默认值为三个点 `(...)`，并在发生截断时将其作为最后一个组件添加。如果确定了\
  \ `count` 且发生了截断，被忽略的值数量将放在字段中附加到结果中。SQL 标准不需要对截断给出警告。为了无论结果是否完成，客户端可以解析结果，或者查看结果的实际长度与确定长度对比，以获得包含所有属性的结果。\n\
  \n## Distinct\n\n该功能支持识别所有可选的集合限定符 `ALL` 和 `DISTINCT`：\n\n```\nLISTAGG( [ALL|DISTINCT]\
  \ , … ) …\n```\n\n假设未指定，则默认为全部。如果指定了 `DISTINCT`，则在合并之前消除重复值。注意，重复值的消除取决于基本的相似性。`DISTINCT`\
  \ 可以通过在收集之前消除重复值在物理实现——例如在子查询中。这对于不支持在列表中去重的数据集有效，并允许在存在重复值的情况下保留一个特定的事件。\n\n随后的模型展示了这种方法。部分\
  \ `g` 和 `o` 分别处理按键收集和按键键。模型使用 `min (o)` 在一个值似乎出现在不同场合时保留主事件。\n\n```sql\nSELECT g\n\
  \     , LISTAGG(val, ‘,’) WITHIN GROUP (ORDER BY o) list\n  FROM (SELECT g, min(o)\
  \ o, Val\n          FROM dist_listagg\n         GROUP BY g, Val\n       ) dt\nGROUP\
  \ BY g\n```\n\n## Combining Listing with Filter and Over\n\n聚合可以与 `FILTER` 和 `OVER`\
  \ 子句结合：\n\n```\nLISTAGG(…) WITHIN GROUP(…) [FILTER(WHERE …)] [OVER(…)]\n```\n\n\
  `FILTER` 子句的作用是在聚合之前删除行。可以使用 `CASE` 实现相同的效果。`OVER` 子句不能包含 `ORDER BY` 子句，因为强制性的 `WITHIN\
  \ GROUP` 子句无论如何都必须包含 `ORDER BY` 子句。无法缩小窗口范围：聚合行的集合始终是整个分区。\n\n## Compatibility\n\
  \n`LISTAGG` 作为 `SQL: 2016` 的可选功能 `T625` 被引入。尽管聚合尚未被广泛支持，但大多数数据库使用专有语法提供类似的功能。\n\n\
  ## Arrays\n\n在问题并不严格需要分隔字符串出现的情况下，可以使用数组来返回多种值。可以使用 `array_agg` 聚合能力或通过子查询开发簇。\n\
  \n```sql\nARRAY_AGG( ORDER BY … )\nARRAY()\n```\n\n随后的结构可以包含 `DISTINCT` 并在首先消除重复值并截断数组长度。这两种方法都不会产生一个可验证的类型转换：数组组件具有相同的类型。这意味着恢复应用程序可以以某种安全的方式获取属性，并在需要时应用设计。数组的排序安全性质允许它们也以明确的方式传递无效属性。`Array_agg`\
  \ 随后不会像其他聚合能力（如计数聚合）那样消除无效属性。\n\n可以使用过滤子句在用 `array_agg` 合并之前消除无效属性。如果过滤条件消除了所有列，`array_agg`\
  \ 返回无效值——而不是空数组。子查询结构允许在 `WHERE` 语句中消除无效属性，如果子查询没有返回行，则返回空数组。如果组件请求是多余的，也可以使用多集和收集向应用程序传递某种安全的列表。\n\
  \n## Document Types\n\n与 `array_agg` 类似，SQL 标准描述了返回 JSON 或 XML 片段的聚合能力：例如 `json_arrayagg`\
  \ 和 `xmlagg`。与聚合相比，主要优势是它们应用单独提取规则。\n\n```\nJSON_ARRAYAGG( ORDER BY … [NULL ON NULL])\n\
  XMLAGG(XMLELEMENT(NAME , ) ORDER BY …)\n```\n\n### Using with Recursive\n\n尽管 `LISTAGG`\
  \ 功能可以使用递归执行，但通常使用数组、视图或对 `listagg` 的限制选项（所示）是更好的决定。以下特殊用例仅可以使用递归和标准的 SQL-92 执行：\n\
  \n```\nLISTAGG (DISTINCT , …) WITHIN GROUP(ORDER BY )\n```\n\n下面的示例使用 `g` 作为 `GROUP\
  \ BY` 键，`value` 作为\n\n```sql\n, and ‘,’as\nDUE TO RECURSIVE\nlist_agg(g, val, list)\n\
  AS (\n SELECT g, min(val), CAST(null AS VARCHAR(255))\nFROM listagg_demo\nGROUP\
  \ BY g\nUNION ALL\nSELECT prev.g,\n(SELECT min(val)\nFROM listagg_demo this\n WHERE\
  \ this.g = prev.g\nAND this.Val > prev.val) Val\n, COALESCE(list || ‘, ‘, ‘’) ||\
  \ val\nFROM list_agg prev\nWHERE prev.Val IS NOT NULL\n)\n\nSELECT g, list\nFROM\
  \ list_agg\nWHERE val IS NULL\nORDER BY g\n```\n\n这种特定的执行使用了“空记录过滤”程序，即使有文件 (`g`,\
  \ `val`)，演示也将保持在较低水平。这种特定的行为方式是这种技术的症状。`Val` 中无效值的正确处理是一个重要的特殊情况：尽管无效值在聚合中被忽略，但包含无效属性的集合在任何情况下都应该出现在结果。这意味着如果集合中没有无效值，则不应移除无效值。上面的执行在非递归定义中使用\
  \ `min(Val)` 来获得这种更符合语义的执行，这种维护所有语义和意外请求条件的执行可以通过递归和窗口功能实现。Aaron Bertrand 的文章“Assembled\
  \ Concatenation in SQL Server”展示了这种方法。¹ 在两种情况下，都可以执行意外的溢出行为。\n\n### Proprietary\
  \ Extensions\n\n通常可用的主要辅助扩展是处理连接边界和一致定义的帮助。标准既不允许排除也不丢弃内部组定义。然而，一些数据库将它们视为可选的，并应用执行默认值，或在内部组被排除时发现不同的行为。\n\
  \n### Proprietary Alternatives\n\n有两种广泛的 `listagg` 限制选项：`group_concat` 和 `string_agg`。尽管某些数据集使用类似的专有功能名称，但它们实际上使用另一种语法。幸运的是，这些专用功能与聚合具有类似的默认语义：它们在收集之前处理无效属性，但不消除重复值。\n\
  \n## Aggregate Function in SQL\n\n\n\n聚合函数无疑是 SQL 中许多有趣特性——嗯，说是函数——之一。尽管它们并不是 SQL\
  \ 特有的，但它们被频繁使用。它们是 `SELECT` 语句的一部分，将这些操作的优势与 `SELECT` 的优势结合起来（连接表、仅过滤我们需要的数据和列）。SQL\
  \ 中的聚合功能对各种属性进行计算并返回一个单一值。SQL 提供了许多聚合功能，包括 `avg`、`count`、`aggregate`、`min`、`max`\
  \ 等。除了 `count` 功能外，聚合功能在执行计算时会忽略 `NULL` 属性。SQL 中的聚合功能在计算出部分的不同值后返回一个值。我们经常在 `SELECT`\
  \ 中配合 `GROUP BY` 和 `HAVING` 条件使用聚合功能。\n\n不同类型的 SQL 聚合函数如下：\n\n* `Count()`\n* `Sum()`\n\
  * `Avg()`\n* `Min()`\n* `Max()`\n\n下表显示了 SQL Server 的聚合函数：\n\n| Aggregate Function\
  \ | Description |\n| --- | --- |\n| `AVG` | `AVG()` 聚合功能计算一组非 NULL 属性的平均值。 |\n|\
  \ `CHECKSUM_AGG` | `CHECKSUM_AGG()` 功能计算一组行的校验和估计值。 |\n| `COUNT` | `COUNT()` 聚合功能返回集合中列的数量，包含具有\
  \ NULL 属性的行。 |\n| `COUNT_BIG` | `COUNT_BIG()` 聚合功能返回集合中的数（使用 `BIGINT` 数据类型），包含具有\
  \ NULL 属性的列。 |\n| `MAX` | `MAX()` 聚合功能返回一组非 NULL 属性中的最高值（最大值）。 |\n| `MIN` | `MIN()`\
  \ 聚合功能返回一组非 NULL 属性中的最低值（最小值）。 |\n| `STDEV` | `STDEV()` 功能根据数据体的样本返回表达式中给出所有值的可测量标准差。\
  \ |\n| `STEVE` | `STDEVP()` 功能同样返回给定表达式中所有属性的标准差，但它是基于整个数据集进行的。 |\n| `SUM()` | `SUM()`\
  \ 聚合功能返回集合所有非 NULL 属性的总和。 |\n| `VAR` | `VAR()` 功能根据预定义总体的样本返回表达式中值的实际方差。 |\n| `CARP`\
  \ | `VARP()` 功能返回表达式中值的可测量差异，但它是基于整个数据集进行的。 |\n\n## 日期函数\n\nSQL 最的函数之一是日期，但对于初学者来说，理解它可能具有挑战性，因为日期在数据库中的形式有很多，而且用户根据特定需求访问日期的格式有很多。当在\
  \ SQL 的单列中同时存储日期和时间值时，通常使用 `Date Time`（时间也与日期一起使用）。日期有时被用来日期，因为日期和时间是相关的。\n\n让我们逐一详细了解\
  \ SQL 中使用的每个日期函数：\n\n| Function | Description with Examples |\n| --- | --- |\n|\
  \ `NOW()` | 返回当前日期和时间。查询：`Select NOW();`返回：`2022-06-22 11:17:52` |\n| `CURATE()`\
  \ | 返回当前日期。查询：`Select CURDATE();`返回：`2022-06-22` |\n| `OUR TIME()` | 返回当前时间。查询：`Select\
  \ CURTIME();`返回：`11:17:52` |\n| `DATE()` | 分离日期或日期/时间表达式中的日期部分。信息表：<br> | Id | Name\
  \ | Birth Time | <br> | 120 | Patrick | 1998-09-16 10:40:15 | <br> 查询：`SELECT Name,\
  \ DATE(Birth Time) AS Birthdate FROM Info;` <br> | 输出： | Name | Birthdate | <br>\
  \ | Patrick | 1998-09-16 | |\n| `EXTRACT()` | 返回日期/时间的某个部分。语法：`EXTRACT(unit FROM\
  \ date);` 实际上只使用了某些可能的单位——包括微秒、秒、分、小时、日、周、月、季度和年。另一个可接受的日期短语是“date”。例如，考虑下面的“Info”表：<br>\
  \ | Id | Name | Birth Time | <br> | 120 | Patrick | 1998-09-16 10:40:15 | <br> 查询\
  \ 1：`SELECT Name, Extract(DAY FROM BirthTime) AS BirthDay FROM Info;` <br> | 输出：\
  \ | Name | Birthday | <br> | Patrick | 16 | <br> 查询 2：`SELECT Name, Extract(YEAR\
  \ FROM BirthTime)AS BirthYear FROM Info;` <br> | 输出： | Name | Birth year | <br>\
  \ | Patrick | 1998 | <br> 查询 3：`SELECT Name, Extract(SECOND FROM BirthTime)AS BirthSecond\
  \ FROM Info;` <br> | 输出： | Name | Birth year | <br> | Patrick | 15 | |\n| `DATE_ADD()`\
  \ |为日期添加预定义的时间跨度。语法：`DATE_ADD(date, INTERVAL expr type);` 其中 `expr` 是要添加的间隔数，date\
  \ 是有效的日期表达式，且以下类别和类型是接受的：分钟、秒、秒、小时、日、周、月、季度、年等。例如，考虑下面的‘Info’表。<br> | Id | Name\
  \ | Birth Time | <br> | 120 | Patrick | 1998-09-16 10:40:15 | <br> 查询 1：`SELECT\
  \ Name, DATE_ADD(BirthTime, INTERVAL 1 YEAR) AS BirthTimeModified FROM Test;`输出：<br>\
  \ | Id | Name | Birth Time | <br> | 120 | Patrick | 1999-09-16 | <br> 查询 2：`SELECT\
  \ Name, DATE_ADD(BirthTime, INTERVAL 30 DAY) AS BirthDayModified FROM Test;`输出：<br>\
  \ | Id | Name | Birth Time | <br> | 120 | Patrick | 1999-10-16 | |\n| `DATE_SUB()`\
  \ | 从日期中减去预定义的时间跨度。查询：`Select DATE_SUB();` |\n| `DATEDIFF()` | 返回两个日期之间的天数。语法：`DATEDIFF(date1,\
  \ date2);``date1` & `date2`- 日/时间表达式。查询：`SELECT DATEDIFF(‘2018-01-10’,’2019-01-20’)\
  \ AS DateDiff;`输出：10 |\n| `DATE_FORMAT()` | 以不同的格式显示日期/时间数据。语法：`DATE_FORMAT(date,format);`查询：`DATE_FORMAT(NOW(),’%d\
  \ %b %y’;`输出:10 Jan 2017 |\n\n`Date` 是一个重要的日期和配置指示日期/时间的输出设计。可以使用的 `config`s 有：\n\
  \n* `%a`-缩写的工作日名称（周日–周六）\n* `%b`-缩写的月份名称（1 月–12 月）\n* `%c`-月份，数字（0–12）\n* `%D`-带有英语后缀的月份中的几（0th,\
  \ first, second, third）\n* `%d`-月份中的几，数字（00–31）\n* `%e`-月份中的几，数字（0–31）\n* `%f`-微秒（000000–999999）\n\
  * `%H`-小时（00–23）\n* `%h`-小时（01–12）\n* `%I`-小时（01–12）\n* `%I`-分钟，数字（00–59）\n* `%j`-一年中的天（001–366）\n\
  * `%k`-小时（0–23）\n* `%l`-小时（1–12）\n* `%M`-月份名称（1 月–12 月）\n* `%m`-月份，数字（00–12）\n*\
  \ `%p`-AM 或 PM\n* `%r`-时间，12 小时制（hh:mm:ss 后接 AM 或 PM）\n* `%S`-秒（00–59）\n* `%s`-秒（00–59）\n\
  * `%T`-时间，24 小时制（hh:mm:ss）\n* `%U`-周（00–53），其中周日是周的第一天\n* `%u`-周（00–53），其中周一是周的第一天\n\
  * `%V`-周（01–53），其中周日是周的第一天，配合 `%X`\n* `%v`-周（01–53），其中周一是周的第一天，配合 `%x`\n* `%W`-weekday\
  \ 名称（周日–周六）\n* `%w`-一周中的几（0 = 周日, 6 = 周六）\n* `%X`-以周日为主要日期的年份，四位数字，配合 `%V`\n* `%x`-以周一为主要日期的年份，四位数字，配合\
  \ `%v`\n* `%Y`-年份，数字，四位\n* `%y`-年份，数字，两位\n\nSQL 中使用的一些基本的日期函数就是上面提到的那些。其他的日期函数被用于各种语境中。在使用任何一个函数之前，必须了解输入到函数的语法和参数，以防止出现意外的结果。\n\
  \n## Null Values in SQL\n\n\n\n\n具有 `NULL` 值的字段没有任何值。在创建新记录或更新现有记录时，可以不为表中某个可选字段提供值。该字段将以值\
  \ `NULL` 值被保存。如果某一列在行列中不包含任何值，则称该列为空或包含空。任何未受 `NOT NULL` 或 `PRIMARY KEY` 强制性约束限制的类型类型部分都可以包含空值。当真实值未知或某个值没有意义时，请使用\
  \ `null`。由于 `NULL` 本身不是一个值且缺乏数据类型，它作为不确定或缺失值属性的占位符。Codd 建议将 `NULL` 分为两类：\n\n- `A-marks`：可能相关但未知的信息（例如某人的年龄）。\n\
  - `I-marks`：表示数据不适用（例如，为没有手机的人提供电话号码，或为未婚人士提供配偶姓名）。\n\nOracle 数据库认为长度为零的字符值为无效。然而，由于它们不相等，因此它们不使用\
  \ `null` 来表示数值 0。`Null` 是任何包含 `null` 的算术表达式的结果。例如，`10` 加上 `null` 的结果是 `null`。实际上，当给出一个空操作数时，所有运算符（连接符除外）都会返回\
  \ `null`。\n\n## 为什么需要空函数？\n\n为了对存储在数据库中的空值进行操作，空函数是必须的。对于 `NULL` 值，我们可以运行函数来显式地识别一个值是否为空。\n\
  \n通过使用这种识别空值的能力，可以对它们执行额外的操作，类似于 SQL 中的聚合处理过程。以下是其中几个函数：\n\n| 序号 | 函数 | 描述 |\n|\
  \ --- | --- | --- |\n| 1 | `ISNULL()` | 帮助我们将 `NULL` 属性替换为所需的值。 |\n| 2 | `IFNULL()`\
  \ | 允许我们在值为 `NULL` 的情况下返回主值，在任何情况下都返回后续值。 |\n| 3 | `COALESCE()` | 帮助我们在一系列值中返回第一个非无效的属性。\
  \ |\n| 4 | `NVL()` | 帮助将 `NULL` 值替换为客户端提供的理想值。 |\n\n## 如何测试空值？\n\n使用如 `=`、`<` 或\
  \ `<>` 等比较运算符无法检查 `NULL` 值。我们必须使用 `IS NULL` 和 `IS NOT NULL` 运算符。\n\n### Is Null\
  \ 语法\n\n```\nSELECT column_names\nFROM table_name\nWHERE column_name IS NULL;\n\
  ```\n\n### Is Not Null 语法\n\n```sql\nSELECT column_names\nFROM table_name\nWHERE\
  \ column_name IS NOT NULL;\n```\n\n### 语法\n\n在创建表时 `NULL` 的基本语法：\n\n```sql\nSQL>\
  \ CREATE TABLE CUSTOMERS (\nID INT NOT NULL,\nNAME VARCHAR (20) NOT NULL,\nAGE INT\
  \ NOT NULL,\nADDRESS CHAR (25),\nSALARY DECIMAL (18, 2),\nPRIMARY KEY (ID)\n);\n\
  ```\n\n在这种情况下，`NOT NULL` 表示该列必须接受指定数据类型的显式值。我们没有在两个列中应用 `NOT NULL`；因此这些列可以接受 `NULL`\
  \ 值。当字段包含 `NULL` 值时，意味着记录创建过程留了该字段。\n\n然而，当将一个未知数与任何其他值进行比较时，结果始终是未知的且不包含在最终结果中，这就是为什么在选择数据时\
  \ `NULL` 值可能会产生问题。要检查 `NULL` 值，必须使用 `IS NULL` 或 `IS NOT NULL` 运算符。查看 `CUSTOMERS`\
  \ 表，它包含以下记录：\n\n| ID | Name | Age | Address | Salary |\n| --- | --- | --- | ---\
  \ | --- |\n| 1022 | Ravish | 32 | Los Angles | 7,000.00 |\n| 1028 | Kevin | 23 |\
  \ Texas | 8,000.00 |\n| 1030 | Chris | 25 | Ohio | 6,500.00 |\n| 1042 | Humpty |\
  \ 27 | Omaha | 5,500.00 |\n| 1051 | Kevin | 22 | Manchester | |\n| 1055 | Khalessi\
  \ | 25 | California | 3,500.00 |\n| 1060 | Maven | 24 | San Francisco | |\n\n`IS\
  \ NOT NULL` 运算符现在的用法如下：\n\n```sql\nSQL> SELECT ID, NAME, AGE, ADDRESS, SALARY\n\
  FROM CUSTOMERS\nWHERE SALARY IS NOT NULL;\n```\n\n**输出：**\n\n| ID | Name | Age |\
  \ Address | Salary |\n| --- | --- | --- | --- | --- |\n| 1022 | Ravish | 32 | Los\
  \ Angles | 7,000.00 |\n| 1028 | Kevin | 23 | Texas | 8,000.00 |\n| 1030 | Chris\
  \ | 25 | Ohio | 6,500.00 |\n| 1042 | Humpty | 27 | Omaha | 5,500.00 |\n| 1055 |\
  \ Khalessi | 25 | California | 3,500.00 |\n\n`IS NULL` 运算符现在的用法如下：\n\n```sql\nSQL>\
  \ SELECT ID, NAME, AGE, ADDRESS, SALARY\nFROM CUSTOMERS\nWHERE SALARY IS NULL;\n\
  ```\n\n**输出：**\n\n| ID | Name | Age | Address | Salary |\n| --- | --- | --- | ---\
  \ | --- |\n| 1051 | Kevin | 22 | Manchester | |\n| 1060 | Maven | 24 | San Francisco\
  \ | |\n\n## 数值函数\n\n数值函数接受数值表达式作为输入并输出数值结果。大多数数学函数的返回类型都是 `NUMBER`。下表列出了所包含的数值函数：\n\
  \n| 函数 | 描述 |\n| --- | --- |\n| `ABS(numeric_exp)` | 返回 `numeric_exp` 的绝对值。 |\n\
  | `ACOS(float_exp)` | 返回 `float_exp` 的反余弦，以弧度表示。 |\n| `ASIN(float_exp)` | 返回 `float_exp`\
  \ 的反正正弦，以弧度表示。 |\n| `ATAN(float_exp)` | 返回 `float_exp` 的反正正切，以弧度表示。 |\n| `ATAN2(float_exp1,\
  \ float_exp2)` | 返回 x 和 y 的反正正切，x 和 y 不由 `float_exp1` 和 `float_exp2` 独立确定，以弧度表示。\
  \ |\n| `CEILING(numeric_exp)` | 返回大于或等于 `numeric_exp` 的最小整数。返回值的类型与输入参数类型相同。 |\n\
  | `COS(float_exp)` | 给出 `float_exp` 的余弦，其中 `float_exp` 是点的弧度坐标。 |\n| `COT(float_exp)`\
  \ | 返回 `float_exp` 的余切，其中 `float_exp` 是以弧度表示的点。 |\n| `DEGREES(numeric_exp)` | 返回从\
  \ `numeric_exp` 弧度转换的角度数。 |\n| `EXP(float_exp)` | 返回 `float_exp` 的指数值。 |\n| `FLOOR(numeric_exp)`\
  \ | 返回不等于 `numeric_exp` 的最大整数。返回值的类型与输入参数类型相同。 |\n| `LOG(float_exp)` | 返回 `float_exp`\
  \ 的自然对数。 |\n| `LOG10(float_exp)` | 返回以 10 为底的 `float_exp` 对数。 |\n| `MOD(integer_exp1,\
  \ integer_exp2)` | 返回整数 `integer_exp1` 除以 `integer_exp2` 后的余数（模数）。 |\n| `PI()` |\
  \ 给出等于圆周率的浮点值。 |\n| `POWER(numeric_exp, integer_exp)` | 返回 `numeric_exp` 乘以 `integer_exp`\
  \ 的结果。 |\n| `RADIANS(numeric_exp)` | 给出 `numeric_exp` 度数转换时产生的弧度。 |\n| `RAND([integer_exp])`\
  \ | 使用指定的整数 `integer_exp` 种子值返回一个随机浮点数。 |\n| `ROUND(numeric_exp, integer_exp)` |\
  \ 将 `numeric_exp` 四舍五入到小数点右侧 `integer_exp` 位。如果 `integer_exp` 为负值，则将 `numeric_exp`\
  \ 四舍五入到小数点左侧的 `integer_exp` 位。 |\n| `SIGN(numeric_exp)` | 给出 `numeric_exp` 的符号信号。如果\
  \ `numeric exp` 小于 0 则返回 -1。如果 `numeric exp` 等于 0 则返回 0。如果 `numeric` exp 大于 0 则返回\
  \ 1。 |\n| `SIN(float_exp)` | 返回 `float_exp` 的正弦，其中 `float_exp` 是以弧度表示的角度。 |\n| `SQRT(float_exp)`\
  \ | 返回 `float_exp` 的平方根。 |\n| `TAN(float_exp)` | 返回 `float_exp` 的正切，其中 `float_exp`\
  \ 是以弧度表示的角度。 |\n\n\n\n\n\n| `TRUNCATE(numeric_exp, integer_exp*)` | 返回将 `numeric_exp`\
  \ 缩短为小数点右侧 `integer_exp` 位。假设 `integer_exp` 为负数，则 `numeric_exp` 缩短为小数点一侧 `|integer_exp|`\
  \ 位。 |\n\n除了 `ABS`、`ROUND`、`TRUNCATE`、`SIGN`、`FLOOR` 和 `CEILING` 返回的与信息边界相似的信息类型结果外，所有数值功能均返回类似于\
  \ `SQL FLOAT` 类型的结果。另一个标量函数的值、列名或数字字面量都可以作为 `numeric exp` 函数的参数。底层数据类型可以是以下之一：`SQL\
  \ NUMERIC`、`SQL TINYINT`、`SQL SMALLINT`、`SQL INTEGER`、`SQL BIGINT`、`SQL FLOAT`、`SQL\
  \ DECIMAL`、`SQL REAL` 或 `SQL DOUBLE`。列名、另一个标量函数的输出或以 `SQL FLOAT` 为底层数据类型的数字字面量都可以作为\
  \ `float exp` 参数。\n\n## 字符串函数\n\n字符串函数始终接受字符串值作为输入，无论返回什么数据类型。SQL Server 中有许多开发者可以使用内置字符串函数。下面列出的\
  \ SQL Server 字符串函数检查输入字符串并输出字符串或数字：\n\n| 函数 | 说明 |\n| --- | --- |\n| `ASCII` | 以\
  \ ASCII 码值返回字符的值 |\n| `CHAR` | 将字符的值转换为 ASCII 值 |\n| `CHARINDEX` | 从预定义区域开始在字符串内部查找子字符串并返回子字符串的位置\
  \ |\n| `CONCAT` | 将至少两个字符串连接为一个字符串 |\n| `CONCAT_WS` | 使用分隔符连接各种字符串形成单个字符串 |\n| `DIFFERENCE`\
  \ | 分析两个字符串的 `SOUNDEX()` 结果 |\n| `FORMAT` | 返回按照预定义设计和可选文化格式化的值 |\n| `LEFT` | 从左侧从字符字符串中分离给定的若干字符\
  \ |\n| `LEN` | 返回字符字符串的各种长度 |\n| `LOWER` | 通过更改将字符串转换为小写 |\n| `LEITRIM` | 移除提供字符串中的所有前导空格以生成新字符串。\
  \ |\n| `NEAR` | 根据 Unicode 标准返回与请求整数代码对应的 Unicode 字符。 |\n| `PATINDEX` | 返回模式在字符串中首次出现的起始位置。\
  \ |\n| `QUOTE NAME` | 提供一个带有定界符的 Unicode 字符串响应，使输入字符串成为合法的定界标识符。 |\n| `REPLACE`\
  \ | 在字符串中子字符串出现的任何地方将其替换为不同的子字符串。 |\n| `REPLICATE` | 获取重复特定次数的字符串。 |\n| `REVERSE`\
  \ | 返回字符字符串的反转顺序。 |\n| `RIGHT` | 从字符字符串的右侧提取指定数量的字符。 |\n| `RTRIM` | 移除提供字符串中的任何尾部空格以创建一个新字符串。\
  \ |\n| `SOUNDEX` | 如果字符串被读出，返回其四字符 (SOUNDEX) 码。 |\n| `SPACE` | 返回一个重复空格的字符串。 |\n\
  | `STR` | 返回从数值数据转换而字符数据。 |\n| `STRING_AGG` | 使用指定的分隔符将字符串行连接为新字符串 |\n| `STRING_ESCAPE`\
  \ | 转义字符串中的特殊字符并返回一个带有转义字符的新字符串 |\n| `STRING_SPLIT` | 一种表值函数，根据指定的分隔符将字符串拆分为子字符串行。\
  \ |\n| `STUFF` | 删除字符串的一部分，然后在指定位置开始向字符串插入另一个子字符串。 |\n| `SUBSTRING` | 从指定位置开始按指定长度提取字符串内部的子字符串\
  \ |\n| `TRANSLATE` | 在一次操作中对多个单字符进行一对一的替换。 |\n| `TRIM` | 产生一个新字符串，移除给定字符串的前导和尾部空格。\
  \ |\n| `UNICODE` | 根据 Unicode 标准返回字符的整数值。 |\n| `UPPER` | 将字符串转换为全大写。 |\n\n除 `FORMAT`\
  \ 外，所有内置字符串函数都是确定性的。这意味着当使用一组特定的输入值调用它们时，它们总是产生相同的结果。\n\n当字符串函数的输入不是字符串时，输入类型会隐式转换为文本数据类型。\n\
  \n### 确定性与非确定性\n\n当使用一组特定的输入值和相同的数据库状态调用时，确定性函数始终提供相同的输出。尽管它们访问的数据库状态保持不变，但非确定性函数在每次使用特定输入值调用时可能会产生不同的结果。由于上述限制，例如函数\
  \ `AVG` 始终产生相同的结果，而返回当前日期时间值的 `GETDATE` 函数则始终产生不同的结果。\n\n为了让 SQL Server 数据库引擎能够对用户定义函数的结果建立索引（通过调用该函数的计算列上的索引，或通过引用该函数的索引视图），必须满足许多标准。其中一个特性是函数的确定性。例如，如果视图中包含任何对非确定性函数的引用，则无法在该视图上生成聚集索引。\n\
  \n### 内置函数的确定性\n\n任何内置函数的确定性都无法更改。取决于 SQL Server 实现函数的方式，每个内置函数要么是确定性的，要么是非确定性的。例如，在查询中添加\
  \ `ORDER BY` 子句并不会改变查询对确定性函数的使用。除 `FORMAT` 外，每个内置字符串函数都是确定性的。请参阅“字符串函数”以获取这些函数的列表。\n\
  \n以下内置函数始终是可预测的，因为它们属于字符串函数以外的内置函数类别：\n\n`ABS`、`POWER`、`ACOS`、`DAY`、`RADIANS`、`ASIN`、`DEGREES`、`ROUND`、`ATAN`、`EXP`、`SIGN`、`ATN2`、`FLOOR`、`SIN`、`CEILING`、`ISNUMERIC`、`SQRT`、`LOG`、`TAN`、`COT`、`LOG¹⁰`、`YEAR`、`DATALENGTH`、`MONTH`、`NULLIF`\n\
  \n即使这些函数在那种方式提供时不总是确定性的，也可以在索引视图或计算列的索引中使用。\n\n| 函数 | 注释 |\n| --- | --- |\n| 所有聚合函数\
  \ | 除非指定了 `OVER` 和 `ORDER BY` 子句，否则这些是确定性的。 |\n| `CAST` | 在与 `sql_variant`、`small\
  \ date` 或 `DateTime` 使用时不是确定性的。 |\n| `CONVERT` | 在以下任何情况下均不是确定性的：`SQL variant` 是源类型。源类型是非确定性的，且目标类型是\
  \ `SQL variant`。`Datetime` 或 `smalldatetime` 是源或目标类型，字符字符串是另一个源或目标类型，且给出了非确定性样式。样式参数必须是常量系统才是确定性的。除了样式\
  \ 20 和 21 外，所有值小于或等于 100 的样式都是非确定性的。 |\n| | 除了样式 106、107、109 和 113 外，所有大于 100 的样式都是确定性的。\
  \ |\n| | 除了 `CHECKSUM(*)` 外，`CHECKSUM` 是确定性的。 |\n| | 仅当结合 `CONVERT` 函数使用时，`ISDATE`\
  \ 在样式不等于 0、100、9 或 109 的任何情况下都是确定性的。只有当提供了种子参数时，`RAND` 才是确定性的。 |\n\n系统的统计函数、元数据、安全性和配置都是非确定性的。\n\
  \n## 总结\n\n\n\n\n\n在本章中，我们学习了函数，它们是预先编写的可以接收变量并返回值的程序，Oracle 提供了多种内置函数。函数可以单独使用，也可以与其他多个函数（如字符串、数学、日期、翻译等）结合使用。根据执行代码时所提供的信息类型，函数可能有多种用途。\n\
