  \n---\n\n**最终翻译结果如下：**\n\n[content]\n\n`ROLLBACK` 命令具有以下语法：\n\n```\nROLLBACK;\n\
  ```\n\n**示例：**\n\n考虑 `CUSTOMERS` 表中的以下记录：\n\n| Sr. No. | ID | Name | Age | Address\
  \ | Salary (USD) |\n| --- | --- | --- | --- | --- | --- |\n... (此处省略重复表格，见下文)\n\n\
  以下是一个示例，它将删除表中所有年龄为 30 的记录，然后回滚（ROLLBACK）数据库的修改。\n\n```\nSQL> DELETE FROM CUSTOMERS\n\
  \   WHERE AGE = 25;\nSQL> ROLLBACK;\n```\n\n结果是，删除操作对表没有影响，`SELECT` 命令产生以下结果。\n\n\
  | Sr. No. | ID | Name | Age | Address | Salary (USD) |\n| --- | --- | --- | ---\
  \ | --- | --- |\n| **1** | LBR114 | Alex | 23 | New York | 25,000 |\n| **2** | LBR115\
  \ | Joshua | 21 | Vegas | 52,000 |\n| **3** | LBR116 | Nick | 22 | Maryland | 47,000\
  \ |\n| **4** | LBR117 | Johnny | 20 | Boston | 89,000 |\n| **5** | LBR118 | Chris\
  \ | 28 | Ohio | 53,000 |\n| **6** | LBR119 | Zyndaya | 25 | Omaha | 48,000 |\n|\
  \ **7** | LBR120 | Tom | 30 | California | 36,000 |\n\n### Savepoint (命令)\n\n它允许你保存一个时间点，让我们能够回到之前的状态，而无需回滚整个事务。\n\
  \n`SAVEPOINT` 命令具有以下语法。\n\n```\nSAVEPOINT SAVEPOINT_NAME;\n```\n\n此命令仅用于在所有事务语句中间创建一个\
  \ `SAVEPOINT`。若要撤销一组事务，请使用 `ROLLBACK` 命令。\n\n以下是回滚到 `SAVEPOINT` 的语法。\n\n```\nROLLBACK\
  \ TO SAVEPOINT_NAME;\n```\n\n下例显示了如何从 `CUSTOMERS` 数据库中删除三条独立的记录。在每次删除之前，你应该创建一个\
  \ `SAVEPOINT`，这样你就可以随时 `ROLLBACK` 到任何 `SAVEPOINT`，从而将所需的数据恢复到之前的状态。\n\n**示例：**\n\
  \n考虑 `CUSTOMERS` 表中的以下记录。\n\n| Sr. No. | ID | Name | Age | Address | Salary (USD)\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| **1** | LBR114 | Alex | 23 | New York\
  \ | 25,000 |\n| **2** | LBR115 | Joshua | 21 | Vegas | 52,000 |\n| **3** | LBR116\
  \ | Nick | 22 | Maryland | 47,000 |\n| **4** | LBR117 | Johnny | 20 | Boston | 89,000\
  \ |\n| **5** | LBR118 | Chris | 28 | Ohio | 53,000 |\n| **6** | LBR119 | Zyndaya\
  \ | 25 | Omaha | 48,000 |\n| **7** | LBR120 | Tom | 30 | California | 36,000 |\n\
  \n操作列在下面的代码块中：\n\n```\nSQL> SAVEPOINT SP1;\nSavepoint created.\nSQL> DELETE FROM\
  \ CUSTOMERS WHERE ID=LBR114;\n1 row deleted.\nSQL> SAVEPOINT SP2;\nSavepoint created.\n\
  SQL> DELETE FROM CUSTOMERS WHERE ID= LBR117;\n1 row deleted.\nSQL> SAVEPOINT SP3;\n\
  Savepoint created.\nSQL> DELETE FROM CUSTOMERS WHERE ID=LBR120;\n1 row deleted.\n\
  ```\n\n现在三次删除已经发生，让我们假设你改变了主意，并决定 `ROLLBACK` 到 `SP3` `SAVEPOINT`。因为 `SP2` 是在初始删除之后建立的，所以最后两次删除被撤销了。\n\
  \n```\nSQL> ROLLBACK TO SP3;\nRollback complete.\n```\n\n由于你回滚到了 `SP3`，因此只发生了第一次删除。\n\
  \n```\nSQL> SELECT * FROM CUSTOMERS;\n```\n\n| Sr. No. | ID | Name | Age | Address\
  \ | Salary (USD) |\n| --- | --- | --- | --- | --- | --- |\n| **1** | LBR114 | Alex\
  \ | 23 | New York | 25,000 |\n| **2** | LBR115 | Joshua | 21 | Vegas | 52,000 |\n\
  | **3** | LBR116 | Nick | 22 | Maryland | 47,000 |\n| **4** | LBR117 | Johnny |\
  \ 20 | Boston | 89,000 |\n| **5** | LBR118 | Chris | 28 | Ohio | 53,000 |\n| **6**\
  \ | LBR119 | Zyndaya | 25 | Omaha | 48,000 |\n选择了 6 行\n\n### Release Savepoint\n\
  \n这是一个允许你释放保存状态的命令。\n\n`RELEASE SAVEPOINT` 命令用于删除之前建立的 `SAVEPOINT`。\n\n`RELEASE\
  \ SAVEPOINT` 命令具有以下语法。\n\n```\nRELEASE SAVEPOINT SAVEPOINT_NAME;\n```\n\n如果 `SAVEPOINT`\
  \ 已被释放，我们无法再次使用 `ROLLBACK` 命令撤销自上一个 `SAVEPOINT` 之后进行的事务。\n\n### Set Transaction\n\
  \n这是一个允许你设置事务的命令。可以使用 `SET TRANSACTION` 命令启动数据库事务。该命令用于定义下一个事务的属性。例如，你可以使事务变为只读或读写。\n\
  \n`SET TRANSACTION` 命令具有以下语法。\n\n```\nSET TRANSACTION [READ WRITE | READ-ONLY ];\n\
  ```\n\n## SQL 中的视图 (Views in SQL)\n\nSQL 中的视图可以比作虚拟表。视图的行和列与数据库表中的行和列相同。通过从一个或多个数据库表中选择字段，可以创建一个视图。根据标准，视图可以包含表的所有行，也可以仅包含其部分子集。\n\
  \n在本文中，我们将发现如何构建、删除和更新视图。\n\n| Sn_ID | Name | Address | | Sn_ID | Name | Age | Marks\
  \ |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| **LRB123** | Alex | New\
  \ York | | **LRB123** | Alex | | |\n*(注：由于原文表格数据存在重复且混乱，译文仅翻译核心正文逻辑)*\n\n\n\n\n\n\
  只有在满足特定条件时，才能更新视图。如果不满足以下任何一项要求，我们将无法更新视图：\n\n-   用于生成视图的 `SELECT` 语句中不应包含 `GROUP\
  \ BY` 子句或 `ORDER BY` 子句。\n-   `SELECT` 语句中不应使用 `DISTINCT` 关键字。\n-   视图的值应全部为 `NOT\
  \ NULL`。\n-   不使用复杂或嵌套查询来构建视图。\n-   应使用单表生成视图。如果视图是使用多个表创建的，则无法进行修改。\n\n可以使用 `CREATE\
  \ OR REPLACE VIEW` 语句向视图添加或删除字段。\n\n### 语法：\n\n```\nCREATE OR REPLACE VIEW view_name\
  \ AS\nSELECT column1,coulmn2,..\nFROM table_name\nWHERE condition;\n```\n\n例如，如果你想修改\
  \ `MarksView` 视图并包含 `StudentMarks` 表中的 `AGE` 字段，我们可以这样实现：\n\n```\nCREATE OR REPLACE\
  \ VIEW MarksView AS\nSELECT StudentDetails.NAME, StudentDetails.ADDRESS,\nStudentMarks.MARKS,\
  \ StudentMarks.AGE\nFROM StudentDetails, StudentMarks\nWHERE StudentDetails.NAME\
  \ = StudentMarks.NAME;\n```\n\n如果我们现在按如下方式从 `MarksView` 获取所有数据：\n\n```\nSELECT *\
  \ FROM MarksView;\n```\n\n#### 输出：\n\n| Name | Address | Age | Marks |\n| --- |\
  \ --- | --- | --- |\n| Alex | New York | 15 | 91 |\n| Joshua | Vegas | 16 | 95 |\n\
  | Nick | Maryland | 14 | 80 |\n| Johnny | Boston | 16 | 87 |\n\n### 视图中的行插入\n视图中的行插入与表中的行插入类似。可以使用\
  \ SQL `INSERT INTO` 语句向视图添加行。\n\n### 语法：\n\n```\nINSERT INTO view_name(column1,\
  \ column2 , column3,..)\nVALUES(value1, value2, value3..);\nview_name: 视图的名称\n```\n\
  \n> **示例**：在下面的示例中，我们将之前在“从单表构建视图”部分中构建的视图 `DetailsView` 添加一个新行。\n\n```\nINSERT\
  \ INTO DetailsView (NAME, ADDRESS)\nVALUES(“Jaques”, Texas”);\n```\n\n> 如果我们现在按如下方式从\
  \ `DetailsView` 获取所有数据，\n\n```\nSELECT * FROM DetailsView;\n```\n\n#### 输出：\n\n\
  | Name | Address |\n| --- | --- |\n| Alex | New York |\n| Joshua | Vegas |\n| Nick\
  \ | Maryland |\n| Johnny | Boston |\n| Jaques | Texas |\n\n### 从视图中删除行\n就像从表中删除行一样，从视图中删除行也很简单。使用\
  \ SQL `DELETE` 语句，我们可以从视图中删除行。此外，从表中删除某行后，从视图中删除它会导致更改显示在视图中。\n\n### 语法：\n\n```\n\
  DELETE FROM view_Name\nWHERE condition;\nview_Name: 想要从中删除行的视图名称\ncondition: 选择行的条件\n\
  ```\n\n### 示例：\n\n在这种种情况下，我们将删除 `DetailsView` 视图的最后一行，该行是我们上一个行插入示例中放入的。\n\n```\n\
  DELETE FROM DetailsView\nWHERE NAME=”Jaques”;\n```\n\n如果我们现在按如下方式从 `DetailsView`\
  \ 获取所有数据，\n\n```\nSELECT * FROM DetailsView;\n```\n\n#### 输出：\n\n| Name | Address\
  \ |\n| --- | --- |\n| Alex | New York |\n| Joshua | Vegas |\n| Nick | Maryland |\n\
  | Johnny | Boston |\n\n#### 带有检查选项\n在 SQL 中，`WITH CHECK OPTION` 子句对视图非常有用。它可以与可更新视图一起使用。如果视图不可更新，则在\
  \ `CREATE VIEW` 语句中插入此子句是没有意义的。`WITH CHECK OPTION` 用于在不满足 `CREATE VIEW` 语句中 `WHERE`\
  \ 子句条件的情况下，禁止向视图插入行。如果在 `CREATE VIEW` 语句在使用 `WITH CHECK OPTION`，且 `UPDATE` 或 `INSERT`\
  \ 子句不满足条件，将返回错误。\n\n**示例**：使用 `WITH CHECK OPTION` 子句，我们从 `StudentDetails` 表创建一个视图\
  \ `SampleView`。\n\n```\nCREATE VIEW SampleView AS\nSELECT S_ID, NAME\nFROM StudentDetails\n\
  WHERE NAME IS NOT NULL\nWITH CHECK OPTION;\n```\n\n该视图在构建时对 `NAME` 列设置了 `NOT NULL`\
  \ 条件，因此如果我们尝试插入一条 `Name` 列为空空值的新行，我们将看到错误。\n\n例如，尽管该视图是可更新的，但此视图的以下查询是无效的：\n\n```\n\
  INSERT INTO SampleView(S_ID)\nVALUES(8);\n```\n\n`NAME` 列的默认值为 null。\n\n## 视图及其应用\n\
  由于下面列出的原因，视图在良好的数据库中是必要的：\n\n-   限制了数据访问。\n-   视图通过限制对数据库中预定义的行和列集合的访问，为表增加了另一层保护。\n\
  -   保持数据复杂性隐藏——视图可以用于隐藏多表连接的复杂性。\n-   简化用户操作——视图允许用户从多个表中选择数据，而无需知道如何执行连接。\n-  \
  \ 在视图中存储复杂查询——视图可以用于跟踪复杂查询。\n-   由于视图中的列数与 select 语句中指定的列数相匹配，视图还可以用于重命名列，而不影响底层表。因此，更改基表的列可以帮助隐藏列名。\n\
  -   允许针对同一张表的不同用户在多个视图之间进行切换。\n\n## SQL 注释\n注释可以帮助你更轻松地阅读和管理应用程序。例如，你可以为语句添加注释，说明该语句在应用程序中的用途。SQL\
  \ 语句中的注释（提示/hints 除外）对语句的执行没有影响。\n\n在语句中，注释可以存在任何关键字、参数或标点符号之间。在语句中包含注释有两种方法：\n\n\
  -   使用斜杠和星号（`/*`）开始注释。继续编写注释文本。该文本可以跨越许多行。应使用星号和斜杠（`*/`）结束注释。起始和结束字符与文本之间不需要空格或换行。\n\
  -   以单词 `--`（两个连字符）开始注释。继续编写注释文本。该文本的长度不足以填充新的一行。应使用换行来结束注释。某些用于输入 SQL 的工具还存在额外的限制。SQL\
  \ 语句中可以找到这两种形式的多个注释。注释文本可以包含来自数据库字符集的任何可打印字符。\n\n有以下三种格式可用于注释：\n\n### 单行注释（Single\
  \ line comments）\n单行注释是指起始和结束在同一行内的注释。\n注释是以 `--` 开头的行，且不会被执行。\n\n### 语法：\n\n```\n\
  -- 单行注释\n-- 另一个注释\nSELECT * FROM Customers;\n```\n\n### 多行注释（Multi-line comments）\n\
  起始于某行并结束于不同行的注释被称为多行注释。以 `/*` 开头的行被视为注释的开始，并在 `*/` 出现时被删除。\n\n### 语法：\n\n```\n/*\
  \ 多行注释\n另一个注释 */\nSELECT * FROM Customers;\n```\n\n### 行内注释（In line comments）\n\
  注释可以提到在语句之间，并包含在 `/*` 和 `*/` 之间。多行注释的扩展是行内注释；它们可以说明在语句之间，并包含在 `/*` 和 `*/` 之间。\n\n\
  ### 语法：\n\n```\nSELECT * FROM /* Customers; */\n```\n\n### 示例：\n-   这些语句中有许多注释：\n\
  \n\n\n\n\n```sql\nSELECT last_name, salary + NVL(commission_pct, 0),\n   job_id,\
  \ e.department_id\n/* 选择所有薪资高于\nPataballa 的员工。*/\n  FROM employees e, departments\
  \ d\n       /* DEPARTMENTS 表被用于获取\n部门名称。*/\n  WHERE e.department_id = d.department_id\n\
  \    AND salary + NVL(commission_pct,0) >  /*\n子查询：       */\n   (SELECT salary\
  \ + NVL(commission_pct,0)\n /* 总薪酬为薪资 + 佣金比例 */\n      FROM employees\n      WHERE\
  \ last_name = ‘Pataballa’);\n\nSELECT last_name,                   -- 选择姓名\n   \
  \ salary + NVL(commission_pct, 0),-- 总薪酬\n    job_id,                         --\
  \ 职位\n    e.department_id                 -- 以及部门\n  FROM employees e,         \
  \       -- 所有员工\n       departments d\n  WHERE e.department_id = d.department_id\n\
  \    AND salary + NVL(commission_pct, 0) >    -- 薪资\n                          \
  \     -- 高于\n                               \n      (SELECT salary + NVL(commission_pct,0)\
  \    -- 薪酬\n    FROM employees\n    WHERE last_name = ‘Pataballa’)     -- Pataballa\
  \ 的。\n;\n```\n\n# SQL 中的约束\n\n约束（Constraints）是表中的数据列必须遵守的准则。这些约束用于限制可以添加到表中的数据类型。这保证了数据库数据的可靠性和准确性。约束可以在列级或表级使用。列级约束仅适用于单列，而表级约束则应用于整张表。\n\
  \n在 SQL 中，可以使用以下约束：\n\n在 SQL 中可以实现以下限制：\n\n- `Not Null`（非空）：根据此约束，列中不能保留空值。也就是说，如果列被标记为\
  \ `NOT NULL`，则我们无法在该列中保存空值。\n- 与列结合使用时，`UNIQUE`（唯一）约束要求列中的每一个值都是唯一的。换句话说，列的值不能在任何行中重复。\n\
  - 称为 `PRIMARY KEY`（主键）的字段允许识别表中的每一行。表字段通过此约束被指定为主键。\n- 其他表中的每一行可以通过称为 `FOREIGN KEY`（外键）的字段被唯一标识。字段也可以通过此限制被指定为外键。\n\
  - `Check`（检查）：此约束有助于将列的值与一组要求进行比较。换句话说，它有助于确保列中的值满足一组要求。\n- 当用户没有输入任何值时，此约束为列指定一个默认值（Default）。\n\
  \n### 应该如何指定约束？\n\n可以在使用 `CREATE TABLE` 语句创建表时指定。在表构建之后，也可以使用 `ALTER TABLE` 语句指定限制。\n\
  \n在创建表使用 `CREATE TABLE` 语句创建限制的语法如下：\n\n```\nCREATE TABLE sample_table\n(\ncol1\
  \ data_type(size) constraint_name,\ncol2 data_type(size) constraint_name,\ncol3\
  \ data_type(size) constraint_name,\n....\n);\n```\n`sample table` 是即将创建的表的名称。\n\
  `data type`：字段中可以存储的信息类别。\n`constraint name`：约束的名称。`UNIQUE`、`PRIMARY KEY` 等是一些示例。\n\
  \n### 让我们详细检查每种限制。\n\n- `Not Null`：此规定必须被满足。如果表字段被标记为 `NOT NULL`，那么之后，该字段永远不会接受空值。换句话说，如果你不为此列输入值，你将无法向数据库中添加新行。例如，以下查询生成了一个名为\
  \ `Student` 的表，其中 `ID` 和 `NAME` 字段被设置为 `NOT NULL`。也就是说，每当我们想要插入新行时，都必须为这两个字段指定值。\n\
  \n```\nCREATE TABLE Student\n(\nID int(8) NOT NULL,\nNAME varchar(12) NOT NULL,\n\
  ADDRESS varchar(25)\n);\n```\n\n- `Unique`：借助此约束可以唯一地标识表中的每一行。换句话说，对于给定的列，所有行应该具有相同的值。我们可以在表中有很多唯一列。\n\
  \n例如，给出的以下查询创建了一个字段 `ID` 为 `UNIQUE` 的 `Student` 表。换句话说，注意到没有两个学生具有相同的 `ID`。\n\n\
  ```\nCREATE TABLE Student\n(\nID int(6) NOT NULL UNIQUE,\nNAME varchar(10),\nADDRESS\
  \ varchar(20)\n);\n```\n\n- `Primary Key`：主键是表中的一个唯一标识每一行的字段。如果表中的某个字段被指定为主键，则所有行在该字段上必须具有唯一值，且它不能包含\
  \ `NULL` 值。换句话说，这结合了 `NOT NULL` 和 `UNIQUE` 限制。\n\n此键在表中只能有一个字段。以下查询将创建一个名为 `Student`\
  \ 的表，并将 `ID` 字段设为主键。\n\n```\nCREATE TABLE Student\n(\nID int(6) NOT NULL UNIQUE,\n\
  NAME varchar(10),\nADDRESS varchar(20),\nPRIMARY KEY(ID)\n);\n```\n\n- `Foreign\
  \ Key`：它是一个唯一标识另一个表每一行的表字段。也就是说，此字段引用了表的主键。这通常会导致表与表之间的连接。\n\n考虑以下两个表：\n\n**Orders（订单表）**\n\
  \n| ID | O_NO | C_ID |\n| --- | --- | --- |\n| 1 | 22 | 2 |\n| 2 | 33 | 4 |\n| 3\
  \ | 44 | 3 |\n| 4 | 55 | 1 |\n\n**Customers（客户表）**\n\n| ID | NAME | ADDRESS |\n\
  | --- | --- | --- |\n| 1 | NAME | NOIDA |\n| 2 | MAHESH | GURGAON |\n| 3 | SURESH\
  \ | DELHI |\n\n`Orders` 表中的 `C_ID` 字段显然是 `Customers` 表的主键，即它唯一标识了 `Customers` 数据集中的每一行。因此，`Orders`\
  \ 表有一个 `Foreign Key`（外键）。\n\n**语法：**\n\n```\nCREATE TABLE Orders\n(\nO_ID int NOT\
  \ NULL,\nORDER_NO int NOT NULL,\nC_ID int,\nPRIMARY KEY (O_ID),\nFOREIGN KEY (C_ID)\
  \ REFERENCES Customers(C_ID)\n)\n```\n\n- `Check`：我们可以使用 `CHECK` 约束在输入数据时为字段的实现提供要求。\n\
  \n例如，下面的查询创建了一个名为 `Student` 的表，带有列 `AGE` 和条件 `(AGE >= 18)`。在这种情况下，用户将不允许向数据库添加任何年龄小于\
  \ 18 岁的记录。\n\n```\nCREATE TABLE Student\n(\nID int(6) NOT NULL,\nNAME varchar(10)\
  \ NOT NULL,\nAGE int NOT NULL CHECK (AGE >= 18)\n);\n```\n\n- `Default`：字段的默认值由此限制提供。换句话说，如果用户在向数据库添加新记录时没有指定值，则这些字段将被设置为这些默认值。例如，以下查询将创建一个名为\
  \ `Student` 的表，并将 `AGE` 列的默认值设置为 18。\n\n```sql\nCREATE TABLE Student\n(ID int(6)\
  \ NOT NULL,\nNAME varchar(10) NOT NULL,\nAGE int DEFAULT 18\n);\n```\n\n# SQL 创建角色（Role）\n\
  \n角色（Role）的设计目的是使安全模型的设置和维护变得更简单。它是可以授予用户的一组相关权限。当数据库中有大量用户时，向用户授予或撤销权限是非常困难的。因此，如果你如下定义角色。\n\
  \n你可以通过提供或移除权限来自动向用户授予或撤销权限。我们可以创建自己的角色，也可以使用预定义的系统角色。以下是系统角色的一些权限：\n\n| 系统角色 |\
  \ 授予 Connect 角色 |\n| --- | --- |\n| 某些权限 | 例如，创建表、视图、同义名、序列或会话 |\n| Resource | 创建触发器、表、过程、序列等。Resource\
  \ 角色的主要功能是限制对数据库对象的访问。 |\n| DBA | 所有的系统权限。 |\n\n### 创建并分配角色\n\n角色必须首先由数据库管理员（DBA）创建。然后，\
  \ DBA 可以为角色提供权限并将其分配给用户。\n\n**语法：**\n\n```\nCREATE ROLE manager;\n角色已创建。\n```\n\
  要形成角色的语法称为 `manager`。\n\n\n\n\n\n- 现在既然角色已经形成，DBA 可以使用 `GRANT` 语句将用户分配给角色，并为角色分配权限。\n\
  - 与单独为每个用户授予权限相比，通过角色向用户 `GRANT` 或 `REVOKE` 权限更为简单。\n- 如果角色通过密码识别，则也必须使用该密码来标识 `GRANT`\
  \ 和 `REVOKE` 权限。\n\n### 给角色授予权限\n\n```\nGRANT create table, create view\nTO manager;\n\
  Grant succeeded.\n```\n\n### 为用户分配角色\n\n```\nGRANT manager TO Johnny, Alex;\nGrant\
  \ succeeded.\n```\n\n### 移除角色的权限\n\n```\nREVOKE create table FROM manager;\n```\n\
  \n### 删除角色\n\n```\nDROP ROLE manager;\n```\n\n### 上述语法的解释\n\n该语句首先建立了一个名为 manager\
  \ 的角色，随后允许经理创建表和视图。随后将 manager 角色分配给 Johnny 和 Alex。现在 Johnny 和 Alex 能够构建表和视图了。如果一个用户被分配了多个角色，他们将拥有所有角色的权限。然后，使用\
  \ `Revoke` 从 ‘manager’ 角色中撤回创建表的权限。`Drop` 用于从数据库中删除该角色。\n\n## SQL 索引\n\nSQL 索引是一种允许你快速访问数据库数据的索引类型。毫无疑问，提高查询和应用程序性能的最佳方法之一就是对数据库或视图建立索引。SQL\
  \ 索引是一个快速查找表，用于查找经常搜索的记录。索引是一种极其微小、速度快且针对快速查找进行优化的数据结构。它非常适合链接关系表和搜索大型数据库。在 SQL\
  \ Server 中，索引被用于加速查询过程，从而获得卓越的性能。它们非常像教科索引。如果你需要查看教科书中的某个章节，你会查看索引，确定章节的页码，然后直接跳转到该页。如果没有索引，寻找选定的章节将极其耗费时间。\n\
  \n数据库索引也是如此。如果没有索引，数据库管理系统 (DBMS) 必须遍历表中所有的记录来提取所需的结果。这被称为表扫描，是一个非常缓慢的过程。另一方面，当你创建索引时，数据库会先查找索引然后直接获取表记录。\n\
  \n### 创建索引的语法\n\n```\nCREATE INDEX index\nON TABLE column;\n```\n\n其中 `index` 是指定的名称，`TABLE`\
  \ 是构建索引的表名，`column` 是应用索引的列名。\n\n### 用于多列\n\n**语法：**\n\n```\nCREATE INDEX index\n\
  ON TABLE (column1, column2,.....);\n```\n\n### 唯一索引\n\n唯一索引用于维护表中数据的完整性，并通过防止向表中输入重复项来提高性能。\n\
  \n**语法：**\n\n```\nCREATE UNIQUE INDEX index\n ON TABLE column;\n```\n\n索引有两种类型：\n\
  \n- 聚集索引（带有聚簇的索引）\n- 非聚集索引（不聚簇的索引）\n\n### 聚集索引\n\n聚集索引指定了数据在表中存储的物理顺序。每个表只能包含一个聚集索引，因为表数据的排序方式只有一种。SQL\
  \ Server 中的主键约束会自动在该列上构建一个聚集索引。\n\n### 非聚集索引\n\n表内部的物理数据并不通过非聚集索引进行排序。实际上，非聚集索引存储在一个位置，而表数据存储在另一个位置。这类似于教科书的组织方式，信息在一个位置，而索引在另一个位置。这允许每个表拥有多个非聚集索引。\n\
  \n值得注意的是，表内部的数据将使用聚集索引进行排序。然而，数据在非聚集索引中按所需的顺序保存的。索引包含了索引列的值以及该列值所属记录的地址。\n\n###\
  \ 何时应该构建索引？\n\n- 一列可能包含多种类型的值。\n- 一列中没有大量的空值。\n- 在 `when` 子句或连接条件中，通常会将一个或多个列一起使用。\n\
  \n### 何时应该避免使用索引\n\n需要考虑下面提到的某些条件：\n\n- 表的较小。\n- 列没有经常作为查询条件。\n- 列经常被更新。\n\n## 删除索引\n\
  \n通过此命令，你可以从数据字典中删除索引。\n\n**语法：**\n\n```\nDROP INDEX index;\n```\n\n你必须是索引的所有者或拥有\
  \ `DROP ANY INDEX` 权限才能删除索引。\n\n## 修改索引\n\n修改索引涉及重建或重构现有表的索引。\n\n```\nALTER INDEX\
  \ IndexName\nON TableName REBUILD;\n```\n\n## 确认索引\n\n你可以验证由用户或服务器提供的表中存在的不同索引的唯一性。\n\
  \n**语法：**\n\n```\nselect * from USER_INDEXES;\n```\n\n它将显示服务器所有的索引，你也可以在其中找到你自己的表。\n\
  \n## 重命名索引\n\n你可以使用系统存储函数 `sp_rename` 重命名数据库中的任何索引。\n\n**语法：**\n\n```\nEXEC sp_rename\n\
  \   index_name,\n   new_index_name,\n   N’INDEX’;\n```\n\n## SQL 中的序列\n\n序列（sequence）是整数集合，例如\
  \ 1, 2, 3 等，某些数据库系统构建并支持这些序列以便立即产生唯一值。序列是模式绑定的用户定义对象，用于生成数值列表。许多数据库使用序列，因为许多应用程序需要表中的每行都包含一个唯一值，而序列提供了一种简单的方法。数字序列按照定义的间隔升序或降序生成，并可以在超过最大值时调整为恢复。\n\
  \n**语法：**\n\n```\nCREATE SEQUENCE “sequence_name”\nSTART WITH “initial_value”\n\
  INCREMENT BY “increment_value”\nMINVALUE “minimum value”\nMAXVALUE “maximum value”\n\
  CYCLE|NOCYCLE ;\n```\n\n- `sequence_name`: 序列名称。\n- `initial_value`: 序列开始的起始值。`Initial_value`\
  \ 应大于或等于 `minimum value` 且小于等于 `maximum value`。\n- `increment_value`: 序列自增的值。`Increment_value`\
  \ 可以是正数或负数。\n- `minimum_value`: 序列的最小值。\n- `maximum_value`: 序列的最大值。\n- `cycle`:\
  \ 当序列达到其 `set_limit` 时，它从头开始。\n- `nocycle`: 如果序列超过其 `max_value`，将抛出异常。\n\n**示例：**\n\
  \n下面显示了按升序创建序列的查询。\n\n**示例 1：**\n\n```\nCREATE SEQUENCE sequence_1\nstart with 1\n\
  increment by 1\nmin value 0\nmaxvalue 100\ncycle;\n```\n\n上面的查询将导致创建一个名为 `sequence\
  \ 1` 的序列。该序列将从 1 开始，每次递增 1，直到达到最大值 100。超过 100 后，序列将从头开始重复。\n\n**示例 2：**\n\n使用序列查询降序创建一个系列。\n\
  \n```\nCREATE SEQUENCE sequence_2\nstart with 100\nincrement by -1\nmin value 1\n\
  maxvalue 100\ncycle;\n```\n\n上述查询的结果将创建 `sequence_2`。该序列将从 100 开始，每次递减 1，最小值为 1，且应小于等于最大值。\n\
  \n创建一个名为 `students` 的表，带有 `id` 和 `name` 列，作为如何使用序列的示例。\n\n```\nCREATE TABLE students\n\
  (\nID number(10),\nNAME char(20)\n);\n```\n\n现在向表中插入值。\n\n```\nINSERT into students\
  \ VALUES(sequence_1.nextval, ‘Johnny’);\nINSERT into students VALUES(sequence_1.nextval,\
  \ ‘Simon’);\n```\n\n其中 `sequence_1.nextval` 将在 `sequence 1` 中定义的序列中向 `id` 列添加 id。\n\
  \n\n\n\n\n| ID | 姓名 |\n| --- | --- |\n| LB 1 | Johnny |\n| LB 2 | Simon |\n\n###\
  \ SQL 中的查询处理\n\n查询处理涉及将高级查询翻译为可在文件系统物理层使用的低级表达式、查询优化以及查询执行，以获得所需的结果（图 1.6）。\n\n\
  ![](img/Fig01_06.jpg)\n\n图 1.6 SQL 中的查询处理。\n\n该图显示了第一步是将查询转换为标准形式。查询被翻译为 `SQL` 并转换为关系代数表达式。在此过程中，`解析器（Parser）``会检查语法并验证查询中所使用的关系和属性。第二步是`查询优化器（Query\
  \ Optimiser）``，它帮助将查询转换为执行效率效率的等价表达式。第三步是`查询评估（Query evaluation）``，它将执行上述查询执行计划并返回结果。\n\
  \n### SQL 中的通用表表达式 (CTE)\n\n标准 SQL 添加了通用表表达式（`CTE`），以方便各种派生表并不合适的 `SQL` 查询。它是一个简短的命名结果集，你可以在\
  \ `SELECT`、`INSERT`、`UPDATE` 或 `DELETE` 查询中引用它。它是在 `SQL Server 2005` 中引入的。你也可以将\
  \ `CTE` 作为 `CREATE` 视图中 `SELECT` 查询的一部分。此外，从 `SQL Server 2008` 开始，你可以在新的 `MERGE`\
  \ 语句中使用 `CTE`。\n\n#### 定义 CTEs\n\n可以通过在任何 `SELECT`、`INSERT`、`UPDATE`、`DELETE` 或\
  \ `MERGE` 语句之前包含 `WITH` 子句来定义 CTE。在 `WITH` 子句中可以用逗号分隔一个或多个 `CTE`。你可以使用以下语法：\n\n\
  ```\n[WITH [, ...]]\n ::=\ncte_name [(column_name [, ...])]\nAS (cte_query)\n```\n\
  \n在定义了带有 `CTEs` 的 `Using` 子句后，你可以像引用任何其他表一样引用 `CTEs`。你只能在 `WITH` 子句之后语句的执行作用范围内引用\
  \ `CTE`。一旦运行了你的语句，结果集对其他语句将不可用。\n\n#### 创建通用表表达式（递归）\n\n递归 `CTE` 是指在内部引用其自身的 CTE。在处理层级数据时，递归\
  \ `CTE` 非常有用，因为它会持续执行，直到查询返回整个层级结构。一个包含员工列表的表是层级数据的一个很好的示例。该表包含一个指向每个员工经理联系方式的链接。在同一张表中，这种引用是员工\
  \ ID。可以使用递归 `CTE` 来显示员工数据的层级结构。如果 `CTE` 构建不当，`CTE` 可能会陷入无限循环。可以在主 `SELECT`、`INSERT`、`UPDATE`、`DELETE`\
  \ 或 `MERGE` 语句的 `OPTION` 子句后附加 `MAXRECURSION` 提示以防止这种情况。\n\n#### 通用表表达式的类型\n\nCTEs\
  \ 分为两类：递归函数有两种类型：递归和非递归。\n\n*   **非递归 CTEs**\n\n    非递归 `CTEs` 是不使用递归或在子程序中进行重复处理的简单\
  \ `CTEs`。我们将创建一个简单的非递归 `CTE` 来显示从 1 到 10 的行数。每一个 `CTE` 查询都将根据 `CTE` 语法以“With，”开头，随后是\
  \ `CTE` 表达式名称和列列表。\n\n    **示例：** 创建表\n\n```\nCREATE TABLE Empl_Info\n(\n  Emp_ID\
  \ int NOT NULL PRIMARY KEY,\n  F_Name varchar(50) NOT NULL,\n  L_Name varchar(50)\
  \ NOT NULL,\n  M_ID int NULL\n)\nINSERT INTO Employees VALUES (1, ‘Kalvin’, ‘Thom’,\
  \ NULL)\nINSERT INTO Employees VALUES (2, ‘Troy’, ‘Bolton’, 1)\nINSERT INTO Employees\
  \ VALUES (3, ‘Rob’, ‘Durello’, 1)\nINSERT INTO Employees VALUES (4, ‘Robby’, ‘Bailey’,\
  \ 2)\nINSERT INTO Employees VALUES (5, ‘Ken’, ‘Erickson’, 2)\nINSERT INTO Employees\
  \ VALUES (6, ‘Bill’, ‘Goldberg’, 3)\nINSERT INTO Employees VALUES (7, ‘Robert’,\
  \ ‘Miller’, 3)\nINSERT INTO Employees VALUES (8, ‘Duke’, ‘Mark’, 5)\nINSERT INTO\
  \ Employees VALUES (9, ‘Chugs’, ‘Matthew’, 6)\nINSERT INTO Employees VALUES (10,\
  \ ‘Morson’, ‘Jhonson’, 6)\n```\n\n> 在创建 `Empl_Info` 之后，接下来的 `SELECT` 语句由 `WITH`\
  \ 子句引导，该子句包含一个名为 `cteReports` 的 `CTE`：\n\n```\nWITH cteReports AS (\n    SELECT\
  \ 1 AS ID\n    UNION ALL\n    SELECT 2\n    UNION ALL\n    SELECT 3\n    UNION ALL\n\
  \    SELECT 4\n    UNION ALL\n    SELECT 5\n    UNION ALL\n    SELECT 6\n    UNION\
  \ ALL\n    SELECT 7\n    UNION ALL\n    SELECT 8\n    UNION ALL\n    SELECT 9\n\
  \    UNION ALL\n    SELECT 10\n)\nSELECT * FROM cteReports;\n```\n*(注：原文在此处似乎有截断，或未提供完整的非递归\
  \ CTE 示例代码，此处根据逻辑补全以保持格式完整)*\n\n\n\n\n假设架构包含某些数据：\n\n```\nmysql> select * from book_det;\n\
  ```\n\n| Bid | Battle | Copies |\n| --- | --- | --- |\n| 1 | MySql | 10 |\n| 2 |\
  \ C++ | 5 |\n| 3 | Java | 15 |\n| 4 | Oracle DBMS | 10 |\n\n```\nmysql> select *\
  \ from book_issue;\n```\n\n| Bid | sid | title |\n| --- | --- | --- |\n\n为了创建这种机制，当系统向\
  \ `book_issue` 数据库录入数据时，触发器应该自动调用并将 `copies` 属性减 1，从而实现准确的书籍追踪。\n\n系统的触发器：\n\n```\n\
  create trigger book_copies_deducts\nafter INSERT\non book_issue\nfor each row\n\
  update book_det set copies = copies -1 where bid =\nnew.bid;\n```\n\n当在 `book_issue`\
  \ 数据库中执行插入操作时，会触发上述触发器，`book_det` 架构中的 `copies` 字段根据当前书籍 ID (`bid`) 减 1。\n\n结果 –\n\
  \n```\nmysql> insert into book_issue values(1, 100, “Java”);\n```\n\nQuery OK, 1\
  \ row affected (0.09 sec).\n\n```\nmysql> select * from book_det;\n```\n\n| Bid\
  \ | Battle | Copies |\n| --- | --- | --- |\n| 1 | MySql | 10 |\n| 2 | C++ | 5 |\n\
  | 3 | Java | 15 |\n| 4 | Oracle DBMS | 10 |\n\n```\nmysql> select * from book_issue;\n\
  ```\n\n| Bid | Sid | Title |\n| --- | --- | --- |\n| 1 | 100 | MySql |\n\n如上述结果所示，一旦插入数据，系统\
  \ `book schema` 中的书籍 `copies` 就会被扣除。\n\n# NoSQL 简介（非关系型 SQL）\n\nNoSQL 数据库代表“非 SQL”或“非关系型”，是一种允许进行数据存储和检索的数据库。除了关系型数据库中使用的表关系外，这些数据以不同的方式进行建模。尽管这些数据库最早出现于\
  \ 20 世纪 60 年代后期，但“NoSQL”这一术直到 2000 年代初才被创造出来。大规模数据分析和实时互联网应用越来越多地使用 NoSQL 数据库。“不仅是\
  \ SQL”这一短语用于强调 NoSQL 系统可能支持类 SQL 查询语言。NoSQL 数据库的优势在于其设计简单、支持服务器集群的水平扩展以及对可用性的更紧密的控制。NoSQL\
  \ 数据库采用与关系型数据库不同的默认数据结构，这使得 NoSQL 能够更快地执行某些操作。NoSQL 数据库旨在解决的问题决定了它的适用性。存在一种误解，认为\
  \ NoSQL 数据库的数据结构比关系型数据库的表更具适应性。\n\n许多 NoSQL 数据库在一致性和可用性、性能和分区容错之间进行权衡。低级查询语言的使用、缺乏标准化接口以及对关系型数据库的大量投入都是广泛采用\
  \ NoSQL 存储的障碍。尽管大多数 NoSQL 数据库缺乏真正的 ACID 事务（原子性、一致性、隔离性和持久性），但包括 `MarkLogic`、`Aerospike`、`FairCom\
  \ c-treeACE`、`Google Spanner`（尽管技术上是 NewSQL 数据库）、`Symas LMDB` 和 `OrientDB` 在内的少数数据库已将其整合到设计核心。\n\
  \n大多数 NoSQL 数据库允许最终一致性，这允许数据库修改在所有节点之间逐渐传播。过时读取（读取旧数据产生的问题）可能会由于数据搜索没有立即返回新结果而发生。此外，某些\
  \ NoSQL 系统可能会发生丢失写入和其他类型的数据丢失。某些 NoSQL 系统提供了如预写日志之类的解决方案来防止数据丢失。在许多数据库上进行分布式事务处理时，实现数据一致性要困难得多。NoSQL\
  \ 和关系型数据库都面临着这一难题。即使是今天的关系型数据库也不允许跨数据库的引用完整性约束。很少有系统同时支持分布式事务处理的 `X/Open XA` 标准和\
  \ ACID 事务。\n\n# NoSQL 数据库简史\n\n* 1998 年：Carlo Strozzi 使用“NoSQL”这一名称描述他的轻量级开源关系型数据库，`Neo4j`\
  \ 于 2000 年发布。\n* `Google BigTable` 于 2004 年发布。\n* `CouchDB` 于 2005 年发布。\n* 关于 `Amazon\
  \ Dynamo` 的研究论文于 2007 年发表。\n* Facebook 于 2008 年向公众发布 `Cassandra` 项目。\n* NoSQL 术语在\
  \ 2009 年复兴。\n\n## NoSQL 数据库的类型\n\nNoSQL 数据库有四种：键值对、列式、基于图和文档型。每组都有自己的特性和局限性。上述列出的数据库没有哪一个长于解决所有困难。用户应该选择符合其产品要求的数据库。\n\
  \nNoSQL 数据库有多种形式和维度。\n\n* 键值对\n* 基于对的列式\n* 基于图\n* 文档型图\n\n## 键值对\n\n它们用于存储数据，并设计用于承受巨大的负载和海量数据。键值对存储数据库使用哈希表存储数据；每个\
  \ `key` 必须是唯一的，而 `value` 可以是文本、`JSON`、`BLOBs`（二进制大对象）或其他格式。\n\n## 列式\n\n这些基于 `Google’s\
  \ BigTable` 论文，并以列运行。每一列都被独立处理。单列数据库的值存储在一起。\n\n## 文档型\n\nNoSQL 数据库数据的价值部分作为文档保留，而\
  \ `键值对 以键值对的形式存储`。使用 `JSON` 或 `XML` 格式存储文档。数据库识别值并可以进行查询。CMS 系统、博客平台、实时分析和电子商务应用都使用这种文档类型。它不应用于涉及多个操作或对不同聚合模型查询的复杂事务。\n\
  \n流行的文档 DBMS 系统包括 `Amazon SimpleDB`、`CouchDB`、`MongoDB`、`Riak`、`Lotus Notes` 和 `MongoDB`。\n\
  \n## 基于图\n\n它同时维护实体及其之间的关系。实体表示为节点，而关系表示为边。边建立了节点之间的连接。每个节点和边都被分配一个唯一的标识符。它在本质上是多关系的，与具有松散连接表格的关系型数据库不同。遍历关系非常快，因为它们已经存储在数据库中，不需要计算。图数据库通常用于社交网络、物流和地理数据。\n\
  \n流行的图数据库包括 `Neo4J`、`Infinite Graph`、`OrientDB` 和 `FlockDB`。\n\n## NoSQL 的特性\n\n\
  以下是特性：\n\n### 非关系型数据库管理系统 (NoSQL) 特性\n\n* NoSQL 数据库从不遵循关系模型。\n* 永远不使用具有扁平固定列记录的表。\n\
  * 与 `BLOBs` 或自包含聚合一起工作。\n* 不需要数据规范化和对象关系映射。\n* 没有查询语言、查询规划器、引用完整性连接或 ACID 遵循等高级功能。\n\
  \n* 无模式 (Schema-Free)\n\n* NoSQL 数据库要么无模式的，要么包含更松散的模式。\n* 不需要任何类型的数据模式规范。\n* 在同一领域内提供异构的数据结构。\n\
  \n### 易于使用的 API\n\n* 提供提供低级数据操作和选择方法的 API，以及用于存储和访问数据的易用接口。\n* 基于文本的协议；通常与 `HTTP\
  \ REST` 和 `JSON` 使用。\n* 作为面向服务的服务的 Web 数据库大多采用 NoSQL 查询语言，该语言不基于任何标准。\n\n### 分布式\n\
  \n* 许多 NoSQL 数据库可以进行分布式执行。\n* 包含自动扩展和故障转移能力。\n\n\n\n\n-   为了扩展性和吞吐量，`ACID` 原则经常被忽视。\n\
  -   跨远程节点的异步复制几乎不存在。例如：`HDFS Replication`、`Asynchronous Multi-Master Replication`、`Peer-to-Peer`。\n\
  -   仅确保长期一致性。\n-   架构中没有任何共享内容。导致协调性较少，分散性更高。\n\n## NoSQL 查询机制工具\n最常见的数据检索方法是基于\
  \ `REST` 的 `GET` 资源，它根据键或 `ID` 获取值。由于它们通过键值对组合捕获值，因此文档存储数据库允许进行更具挑战性的搜索。例如，使用 `MapReduce`\
  \ 和 `CouchDB` 允许你定义视图。\n\n## 什么是 CAP 定理？它是如何工作的？\nBrewer 定理是 `CAP` 定理的另一个名称。它声称分布式数据存储无法提供三种保证中的两种。\n\
  \n- 一致性 (Consistency)\n- 可用性 (Availability)\n- 分区容错 (Tolerance for Partitions)\n\
  \n### 一致性\n即使在操作完成后，数据也应该保持一致。这意味着一旦数据被写入，它应该包含在任何后续读取请求中。例如，在更改订单状态后，所有客户端都应该看到相同的信息。\n\
  \n### 可用性\n数据库应该随时可访问并有响应。不应该有停机。\n\n### 分区容错\n分区容错意味着即使服务器之间的连接并不总是可靠，系统也应该继续工作。例如，服务器可以分为若干组，这些组之间可以通信也可以不相互通信。如果数据库的某部分宕机，其他部分始终保持运行。\n\
  \n## 长期一致性\n为了实现高可用性和扩展性，“最终一致性”指的是在几台机器上拥有数据的副本。因此，对一个系统中的数据项进行的任何修改都必须复制到所有其他副本上。数据复制可能不是瞬时的，因为某些副本会立即更新，而另一些则需要更长时间。这些副本最初可能是不一致的，但随着时间的推移，它们会变得一致。因此，产生了“最终一致性”这一术语。\n\
  \n`BASE` 代表 `Basic Availability`（基本可用性）、`Soft State`（软状态）和 `Eventual Consistency`（最终一致性）。\n\
  \n根据 `CAP` 定理，可用性表示数据库始终可用。\n\n“软状态”一术指的是系统在没有提供输入时也能更改的能力。\n\n“最终一致性”一术指的是系统随时间推变得一致的能力。\n\
  \n## 何时应该使用 NoSQL？\n- 当你需要存储和检索大量数据时。\n- 你保留的数据之间的关系并没有像你想象的那么重要。\n- 信息是碎片化且动态的。\n\
  - 在数据库级别，没有必要支持约束（constraints）和连接（joins）。\n- 数据在不断增长，你需要定期扩展数据库以跟上增长。\n\n## 优势\n\
  使用 `MongoDB` 和 `Cassandra` 等 NoSQL 数据库具有许多优势，例如高扩展性和高可用性：\n\n-   **高扩展性：** NoSQL\
  \ 数据库使用 `sharding`（分片）来提供水平扩展。在保持数据顺序的同时将数据划分并分布到多台机器被称为 `sharding`。为了管理数据，必须水平地添加新机器，并垂直地向现有机器上添加更多资源。虽然水平扩展容易执行，但垂直扩展更具挑战性。具有水平扩展能力的数据库示例包括\
  \ `MongoDB`、`Cassandra` 等。由于 NoSQL 是可扩展的，因此它可以处理大量数据。随着数据的扩展，NoSQL 会扩展以有效且高效地处理。\n\
  -   **高可用性：** NoSQL 数据库中的自动复制功能使其具有高度可用性，因为一旦发生故障，数据会自动复制到之前的一致状态。\n\n### 缺点\nNoSQL\
  \ 具有以下缺点：\n\n-   **重点狭：** NoSQL 数据库的重点非常有限，因为它们主要为存储而构建，提供的功能非常少。在 `Transaction\
  \ Management`（事务管理）主题上，关系型数据库优于 NoSQL 数据库。\n-   **开源：** `NoSQL` 是一种免费使用的数据库。目前没有可靠的\
  \ `NoSQL` 标准。因此，两个数据库系统之间存在很大差异的可能性。\n-   **管理挑战：** 大数据工具的目标是让海量数据的管理尽可能简单。但并不那么简单。`NoSQL`\
  \ 中的数据管理比关系型数据库要复杂得多。它以设置困难著称，日常管理也更加困难。\n-   **无 GUI 模式：** 市场上用于访问数据库的 `GUI` 模式工具并不灵活。\n\
  -   **备份：** 对于某些 NoSQL 数据库（如 `MongoDB`），备份是一个主要缺陷。`MongoDB` 不包含以一致方式备份数据的方法。\n-\
  \   **大文档大小：** 在某些数据库系统（如 `MongoDB` 和 `CouchDB`）中，数据以 `JSON` 格式存储。这意味着文档非常巨大（由于\
  \ `BigData`、网络带宽和速度），而详细的键名实际上会通过增加文档大小。\n\n## 总结\n在本章中，我们涵盖了 `SQL` 的所有基础，包括命令、语句、数据类型、视图、创建角色的注释、索引、查询处理、`CTE`、数据库管理以及对\
  \ `NoSQL` 的简要介绍。\n\n## 注意\n# 第二章 子句/运算符\nDOI: [10.1201/9781003358435-2](https://doi.org/10.1201/9781003358435-2)\n\
  \n## 本章内容\n- ➢ `SQL` 基础子句/运算符\n- ➢ `SQL` 中各种子句/运算符的特性\n- ➢ 语法和示例\n\n运算符是保留字或字符，用于\
  \ `SQL` 语句中的 `WHERE` 子句以执行比较和算术计算等操作。这些运算符用于在 `SQL` 语句中表示条件，并作为单个查询中多个条件的连接符。\n\n\
  - 算术运算符\n- 比较运算符\n- 逻辑运算符\n- 否定运算符用于反转条件\n\n## SQL 中的 WITH 子句\nOracle 在 `Oracle\
  \ 9i` 版本的两个数据库中引入了 `WITH` 子句。`SQL WITH` 子句允许你为子查询块命名（这一过程称为子查询重构），该名称可以在 `SQL` 查询的多个位置被引用。\n\
  \n- 该子句用于定义一个临时关系，以便该临时关系的输出是可用的，并可以被与其连接的查询使用。\n- 带有链接 `WITH` 子句的查询可以使用嵌套子查询创建，这提高了\
  \ `SQL` 查询的易读性和调试能力。\n- 并不是所有的数据库系统都支持 `WITH` 子句。\n- 给子查询的名称被处理为类似于表或内联视图。\n- Oracle\
  \ 在 `Oracle` 数据库中引入了 `WITH` 子句。\n\n**语法：**\n\n```\nWITH temporaryTable (averageValue)\
  \ as\n     (SELECT avg(Attr1)\n     FROM Table)\n     SELECT Attr1\n     FROM Table,\
  \ temporaryTable\n     WHERE Table.Attr1 > temporaryTable.average value;\n```\n\n\
  `WITH` 子句用于创建一个仅有一个属性 `average Value` 的临时表。关系 `Table` 中列 `Attr1` 的平均值存储在 `average\
  \ Value` 中。在 `WITH` 子句之后，`SELECT` 语句将返回 `Table` 中 `Attr1` 的值大于从该子句获取的 `avg` 值的元组。\n\
  \n当运行带有 `WITH` 子句的查询时，首先评估子句查询，评估结果保存在临时关系中。然后执行与 `WITH` 子句链接的主查询，该查询将使用创建的临时关系。\n\
  \n**查询：**\n\n\n\n\n\n## 示例 1：在这里，我们识别所有薪资高于员工平均水平的员工。\n\n关系名称：`Employee`\n\n| E_ID\
  \ | Name | Salary |\n| --- | --- | --- |\n| **11** | Steve | 45,000 |\n| **22**\
  \ | Johnny | 95,000 |\n| **27** | Simon | 78,550 |\n| **45** | Waltz | 60,000 |\n\
  | **85** | Sheldon | 68,000 |\n| **97** | Katherine | 99,000 |\n\n#### SQL 查询：\n\
  \n```sql\nWITH temporary Table(averageValue) as\n    (SELECT avg(Salary)\n    from\
  \ Employee)\n        SELECT EmployeeID,Name, Salary\n        FROM Employee, temporaryTable\n\
  \        WHERE Employee.Salary > temporaryTable.\n        averageValue;\n```\n\n\
  **解释**：所有员工的平均薪资为 74,258。因此，所有薪资高于平均水平的员工包含在输出关系中。\n\n| E_ID | Name | Salary |\n\
  | --- | --- | --- |\n| **22** | Johnny | 95,000 |\n| **27** | Simon | 78,550 |\n\
  | **97** | Katherine | 99,000 |\n\n#### 输出：\n\n## 示例 2：定位那些航空公司，该航空公司所有飞行员的总薪资超过数据库中所有飞行员的平均总薪资。Pilot\
  \ 是关系的名称。\n\n| E_ID | Airline | Name | Salary (Rupees) |\n| --- | --- | --- | ---\
  \ |\n| **40007** | Air India | Kumar | 80,000 |\n| **40002** | Jet Airways | Lawrence\
  \ | 50,000 |\n| **20027** | Air India | Watson | 40,050 |\n| **60778** | Indigo\
  \ | Crick | 80,780 |\n| **85585** | Jet Airways | Steve | 25,000 |\n| **94070**\
  \ | Air India | Kim | 78,000 |\n\n**解释**：所有 Air India 飞行员的总收入为 66,016.6，而所有 Jet\
  \ Airways 飞行员的总薪资为 37,500。在 `Pilot` 表中，所有飞行员的平均收入为 58,971.6。因为只有 Air India 所有飞行员的总收入高于平均薪资，因此\
  \ Air India 出现在输出关系中。\n\n#### 输出：\n\n| Airline |\n| --- |\n| **Air India** |\n\n\
  在处理复杂的 SQL 语句而非基础语句时，SQL 的 `WITH` 子句非常有用。它还允许你将大型 SQL 查询拆分为较小的块，使得调试和处理查询变得简单得多。SQL\
  \ 中的 `WITH` 子句本质上是子查询的直接替代品。\n\n## SQL 中的 With Ties 子句\n\n`WITH TIES` 允许你返回更多与限制性结果集中最后一行值匹配的行。需要注意的是，`WITH\
  \ TIES` 结果的行数可能比你在表达式中指定的多。`WITH TIES` 子句只能与 `TOP` 和 `ORDER BY` 结合使用；这两个子句都是不可少的。\n\
  \nSQL Server `SELECT TOP` 命令从一个或多个 SQL Server 表检索记录，同时根据指定的数值或百分比限制返回的条目数量。\n\n\
  ### 语法：\n\n```sql\nSELECT TOP (top_value) [ PERCENT ] [ WITH TIES ]\nexpressions\n\
  FROM tables\n[WHERE conditions]\n[ORDER BY expression [ ASC | DESC ]];\n```\n\n\
  ## SQL 中的算术运算符\n\nSQL 中的算术运算符用于对数据库表中存储的数据执行数学运算，例如加法、减法、乘法、除法和模等。如果查询中有需要满足的多个条件，这些算术运算符可以在\
  \ SQL 语句的 `WHERE` 子句中使用，但如果表中存在任何 Null 值，对 Null 值执行算术运算会导致错误。\n\nSQL 中的前五大算术运算符是：\n\
  \n加法（`+`）、减法（−）、乘法（`*`）、除法（`/）和模（%`）是 SQL 中各种算术运算符，用于对数据库表中存储的数据进行数学运算。让我们看看下面的示例，了解\
  \ SQL 中各种算术运算符是如何工作的。\n\n### 加法运算符 (+)\n\n某些物的相加用加号（`+`）表示。该运算符 `+` 用于两个数字相加。我们可以从下面的示例看到如何使用加法运算符将\
  \ 110 和 320 相加。\n\n```sql\nSELECT 110 + 320 as Addition;\n```\n\n**输出：**\n\n| Addition\
  \ |\n| --- |\n| **430** |\n\n**示例**：为了说明运算符是如何工作的，请考虑下面的 `EMPLOYEES` 表：\n\n| ID\
  \ | Name | Age | Salary |\n| --- | --- | --- | --- |\n| **100** | SARESH | 27 |\
  \ 30,000 |\n| **150** | SUNIL | 21 | 45,000 |\n| **185** | RISHABH | 22 | 50,000\
  \ |\n| **200** | SHASHANK | 25 | 35,000 |\n\n该表列出了许多员工及其联系信息。让我们在 `SALARY` 列中将两列合并在一起。在下面的查询中，`SALARY`\
  \ 列增加了 10,000。\n\n```sql\nSELECT SALARY+10000 as new_salary FROM EMPLOYEES;\n```\n\
  \n**输出：**\n\n| N_Salary |\n| --- |\n| **40,000** |\n| **55,000** |\n| **60,000**\
  \ |\n| **45,000** |\n\n让我们像下面的查询所示，使用加法运算符将两列相加。\n\n```sql\nSELECT SALARY+ID as\
  \ add_salary FROM EMPLOYEES;\n```\n\n上述查询具有以下结果，以及薪资列和 ID 列。\n\n**输出：**\n\n| Add_Salary\
  \ |\n| --- |\n| 40,100 |\n| 55,150 |\n| 60,185 |\n| 452,000 |\n\n### 减法运算符 (–)\n\
  \n使用减法运算符 `–`，将右操作数从左操作数中减去。让我们看看下面的示例，看看如何从 360 中减去 100。\n\n```sql\nSELECT 360-100\
  \ as Subtract;\n```\n\n减去\n\n260\n\n例如，考虑之前提到的 `EMPLOYEES` 表。我们可以看到在下面的查询从 `SALARY`\
  \ 列中减了 500。\n\n```sql\nSELECT SALARY-500 as S_Sal FROM EMPLOYEES;\n```\n\n**输出：**\n\
  \n| S_Sal |\n| --- |\n| **29,500** |\n| **44,500** |\n| **49,500** |\n| **34,500**\
  \ |\n\n执行了两个列的减法，即下面的查询中。显示了以下信息：`SALARY` 和 `ID`。\n\n```sql\nSELECT SALARY-ID as\
  \ N_Sal FROM EMPLOYEES;\n```\n\n在上述查询中，`ID` 列从 `SALARY` 列中减去，结果如下：\n\n| N_Sal |\n\
  | --- |\n| **29,400** |\n| **44,500** |\n\n### 乘法运算符 (*)\n\n通过此运算符执行两个操作数的乘法。在下面的示例中可以看到\
  \ 10 和 80 的乘法。\n\n```sql\nSELECT 10*80 as Multiplication;\n```\n\n乘法\n\n800\n\n\
  以 `EMPLOYEES` 表为起点，如下所示，将 `SALARY` 列乘以 10：\n\n```sql\nSELECT SALARY*10 as Multi_Salary\
  \ FROM EMPLOYEES;\n```\n\n上述查询具有以下结果，我们可以看到 `SALARY` 列被乘以 10。\n\n| Multi_Salary\
  \ |\n| --- |\n| **300,000** |\n| **450,000** |\n| **500,000** |\n| **350,000** |\n\
  \n下面的查询显示了 `EMPLOYEES` 表中两个列的乘法，即 `SALARY` 和 `ID`。\n\n```sql\nSELECT SALARY*ID as\
  \ A_Salary FROM EMPLOYEES;\n```\n\n**输出：**\n\n| A_Salary |\n| --- |\n| 300,000 |\n\
  | 6,750,000 |\n| 9,250,000 |\n| 7,000,000 |\n\n### 除法运算符 (/)\n\n通过此运算符执行两个操作数的除法。在下面的示例中执行了除法运算，即将\
  \ 20 除以 5。\n\n```sql\nSELECT 20/5 as Division;\n```\n\n上述操作的输出是除法的商，在这种情况下为四。\n\n\
  **输出：**\n\n除法\n\n4\n\n考虑之前讨论过的 `EMPLOYEES` 表。下面的查询显示了如何将 `SALARY` 列除以 5。\n\n```sql\n\
  SELECT SALARY/5 as Sal_Div FROM EMPLOYEES;\n```\n\n| Sal_Div |\n| --- |\n| **6,000**\
  \ |\n| **9,000** |\n| **10,000** |\n| **7,000** |\n\n### 模运算符 (%)\n\n使用此算术运算符获得左操作数除以右操作数的余数。\n\
  \n```sql\nSELECT 12%4 as result;\n```\n\n前面的问题指示，当 12 除以 4 时，除法的余数 0 作为输出返回，如结果所示。\n\
  \n**结果：**\n\n0\n\n使用 `EMPLOYEES` 表的 `SALARY` 列来执行模运算。\n\n```sql\nSELECT SALARY%100\
  \ as result FROM EMPLOYEES;\n```\n\n\n\n\n\n上述查询执行了取模运算，当员工薪水除以 100 时，结果显示除法的余数，并作为输出。\n\
  \n| 薪水 |\n| --- |\n| `300` |\n| `450` |\n| `500` |\n| `350` |\n\n如果我们对 `NULL` 执行任何算术操作，结果将始终为\
  \ `null`。SQL 算术运算符对于在数据库表数据上执行复杂的数学计算至关重要。对于开发者来说，熟练掌握这些运算符非常关键。\n\n## SQL 通配符：概述\n\
  \n在 SQL 中，通配符用于替换字符串中的零或任意数量字符。这些通配符通常与 SQL 运算符 `LIKE` 配合使用。这是一种字符搜索运算符，广泛用于 SQL\
  \ 的 `WHERE` 子句，以查找特定的字符集。正则表达式和通配符的目的相同。这种字符可以替换字符串中的任何其他字符或多个字符。当我们需要在数据库中进行快速搜索时，这些通配符就非常有用。\n\
  \n在 SQL 中，有两种常用的通配符。`%` 符号可以表示零、一个或任意数量的字符。下划线符号 `_` 指定单个字符，可以是字母也可以是数字。排列这些符号有许多方法。\n\
  \n我们将详细查看这些通配符，以及一些额外的基本通配符。\n\n| 通配符 | 描述 | 示例 |\n| --- | --- | --- |\n| `%` (百分号)\
  \ | 零或多个字符 | `bl%` 找到 bl, black, blue 和 blob |\n| `_` (下划线) | 仅限一个字符 | `p_t` 发现匹配的\
  \ pot, pit 和 put。 |\n| `[]` (方括号) | 匹配括号内提供的单个字符 | 通配符 `p[oi]t` 找到 pot 和 pit，但不是\
  \ put， |\n| `^` (脱号) | 此通配符匹配括号之外出现的字符 | `p[oi]t` 找到 put 但不是 pot 和 pit |\n\n为了匹配零或多个字符，Microsoft\
  \ Access 使用星号符号 `*` 代替百分号通配符，并使用问号字符 `?` 代替下划线通配符来表示单个字符。\n\n### SQL 通配符语法\n\n让我们看看“百分号”和“_”通配符可能有几种不同的写法：\n\
  \n```\nSELECT FROM table_name\nWHERE column LIKE ‘BB%’\n```\n\n`BB%` 允许我们搜索以 `BB`\
  \ 开头并以单个字符或多个字符结尾的字符串。\n\n或者\n\n```\nSELECT FROM table_name\nWHERE column LIKE ‘%BB%’\n\
  ```\n\n我们可以使用 `%BB%` 找到以任意数量字符开头、中间包含字符串 `BB` 且以 0 到无限个任意数量字符结尾的字符串。\n\n或者\n\n```\n\
  SELECT FROM table_name\nWHERE column LIKE ‘_BB’\n```\n\n`_BB` 允许我们搜索以单个特定字符开头并以\
  \ `BB` 结尾的字符串。\n\n或者\n\n```\nSELECT FROM table_name\nWHERE column LIKE ‘BB_’\n```\n\
  \n`BB_` 允许我们找到任何以 `BB` 模式开头并以不同字符结束的字符串。\n\n或者\n\n```\nSELECT FROM table_name\n\
  WHERE column LIKE ‘_ BB _’\n```\n\n`_BB_` 允许我们搜索以唯一字符开头、中间包含模式 `BB` 且以单个唯一字符结尾的字符串。\n\
  \n正则表达式和通配符的作用相同。为了提高搜索效果和结果，我们可以在单个字符串中混合多个通配符。在某些数据库（如 MS Access）中，不同的 SQL 通配符可以用于类似的功能。\n\
  \n## Except 和 Intersect 运算符\n\n让我们按照下面的描述单独学习每个运算符。\n\n**Intersect 子句（交集）：** 正如其名，它用于表示两个\
  \ `SELECT` 语句的交集结果。这意味着结果将包含两个 `SELECT` 命令共同的所有行。\n\n**语法：**\n\n```\nSELECT column-1,\
  \ column-2 ……\nFROM table 1\nWHERE…..\nINTERSECT\nSELECT column-1, column-2 ……\n\
  FROM table 2\nWHERE…..\n```\n\n考虑以下场景：\n\n| 员工信息 (表 1) | 员工信息 (表 2) |\n| ID | Name\
  \ | City | ID | Bonas_ID | Bonas(Dollar) |\n| --- | --- | --- | --- | --- | ---\
  \ |\n| `1` | William | Vegas | 1 | 44 | 45,000 |\n| `2` | Kevin | California | 2\
  \ | 49 | 72,000 |\n| `3` | Nick | Texas | 3 | 51 | 30,000 |\n\n**语法：**\n\n```\n\
  SELECT ID, Name, Bonus\nFROM\ntable1\nLEFT JOIN\ntable2\nON table1.ID = table2.Employee_ID\n\
  INTERSECT\nSELECT ID, Name, Bonus\nFROM\ntable1\nRIGHT JOIN\ntable2\nON table1.ID\
  \ = table2.Employee_ID;\n```\n\n## Except 子句（差集）\n\n| ID | Name | Bonas(Dollar)\
  \ |\n| --- | --- | --- |\n| 1 | William | 45,000 |\n| 2 | Kevin | 72,000 |\n| 3\
  \ | Nick | 30,000 |\n\n`INTERSECT` 子句的反反是 `EXCEPT` 子句。在这种情况下，两个 `SELECT` 语句之间共享行之外的所有行都包含在结果中。\n\
  \n语法如下：\n\n```\nSELECT column-1, column-2 ……\nFROM table 1\nWHERE…..\nEXCEPT\nSELECT\
  \ column-1, column-2 ……\nFROM table 2\nWHERE…..\n```\n\n引用上述员工信息 (表 1) 和员工信息 (表\
  \ 2) 示例中的：\n\n**查询：**\n\n```\nSELECT ID, Name, Bonus\nFROM\ntable1\nLEFT JOIN\n\
  table2\nON table1.ID = table2.Employee_ID\nEXCEPT\nSELECT ID, Name, Bonus\nFROM\n\
  table1\nRIGHT JOIN\ntable2\nON table1.ID = table2.Employee_ID;\n```\n\n## Using\
  \ 子句\n\n| `3` | `Nick` | `Null` |\n| --- | --- | --- |\n\n如果多个列具有相同的名称但不同的数据类型，可以将\
  \ `NATURAL JOIN` 子句更改为 `USING` 子句，以指定哪些列应用于 `EQUIJOIN`（等值连接）。当匹配多于一列时，使用 `USING`\
  \ 子句仅匹配其中一个。\n\n*   `NATURAL JOIN` 和 `USING CLAUSE` 项是互斥的。\n*   在所引用的列中不应有限定符（表名或别名）。\n\
  *   `NATURAL JOIN` 通过使用所有名称和数据类型相同的列来连接表。`USING` 子句允许你定义哪些列应用于 `EQUIJOIN`。\n\n**语法：**\n\
  \n```\nSELECT <table_name>.<column_name> AS <column_name>\n    FROM <table_name>\
  \ JOIN <table_name> USING\n(<column_name>)\n```\n\n作为说明，考虑本节中的以下两个表。\n\n| Pet_ID\
  \ | Animal | Name | Owner ID |\n| --- | --- | --- | --- |\n| `101` | Dog | Rika\
  \ | 123 |\n| `202` | Cat | Charms | 134 |\n| `303` | Mouse | Mick | 123 |\n| `404`\
  \ | Parrot | Howdy | 156 |\n| `505` | Rabbit | Smith | 134 |\n| `606` | Hamster\
  \ | Muffin | 156 |\n\n表：Owner\n\n| Owner ID | Nick |\n| --- | --- |\n| `123` | Tiru\
  \ |\n| `134` | Tarous |\n| `156` | Surfit |\n\n**查询：** 学习宠物所有者的名字。\n\n```\nSELECT\
  \ Owner.name AS owners, PETS.name AS pet, PETS.\nAnimal\nFROM Owner JOIN PETS USING\
  \ (ownerid);\n```\n\n**输出：**\n\n| Owners | Pet | Animal |\n| --- | --- | --- |\n\
  | Tiru | Rocky | Dog |\n| Tarous | Charles | Cat |\n| Tiru | Mickey | Mouse |\n\
  | Surfit | Honey | Parrot |\n| Tarous | Smudge | Rabbit |\n| Surfit | Fluffy | Hamster\
  \ |\n\n## 如何使用 SQL Merge 语句\n\nSQL `MERGE` 子句是一个常用的子句，它允许你在一个事务中管理插入、更新和删除，而无需为每种操作创建单独的逻辑。你可以指定其他情况下，`MERGE`\
  \ 语句在什么情况下插入、更新或删除数据。在使用 `MERGE` SQL 函数时，你有额外的可能性来更改复杂的 SQL 脚本，同时提高可读性。`MERGE` 命令根据与其他表的键字段比较结果更新现有表。\n\
  \n\n\n\n\n随附图表演示了 SQL `MERGE` 命令的基本操作。如你所见，两个圆——分别称为 `Source`（源）和 `Target`（目标）代表两个表。`MERGE`\
  \ 命令根据键字段比较源表和目标表，然后进行某些处理。`MERGE` 语句将 `INSERT`、`UPDATE` 和 `DELETE` 操作合并到单个语句中。虽然\
  \ `MERGE` 语句比基本的 `INSERT` 或 `UPDATE` 更复杂，但如果你理解了基本原理，你将能够比单独的 `INSERT` 或 `UPDATE`\
  \ 更频繁地使用它。\n\n## SQL Merge 命令及其应用\n\n在标准的 SQL 数据仓库系统中，维护数据仓库中的历史数据并引用给 ETL 工具的源数据通常是非常必要的。这是在尝试处理数据仓库中的“缓慢变化维度”（SCD）时的一个典型用例。在这种情况下，需要更新仓库中那些在源数据中值已发生变化的记录值，并删除或标记不再存在于数据源中的记录。随着\
  \ SQL Server 2008 增加了 SQL `MERGE` 命令，数据库程序员现在可以更轻松地实现实现在 ETL 中进行 SCD 所需的逻辑，同时简化了围绕\
  \ `INSERT`、`UPDATE` 和 `DELETE` 命令的复杂代码。\n\n## 提高 SQL Merge 语句的性能\n\n通过关注几个标准，你可能提高\
  \ `MERGE` 语句的效率。你现在可以创建一个包含所有 DML 语句（`INSERT`、`UPDATE` 和 `DELETE`）的单个语句。从数据处理的角度来看，这是非常有益的，因为它减少了三个断言的磁盘\
  \ I/O 操作次数，现在只需要从源读取一次数据。\n\n用于匹配源表和目标表的索引对 `MERGE` 命令的执行速度影响很大。除了使用索引外，优化连接条件也关重要。此外，我们应该考虑过滤源表，使语句只检索操作所需的记录。\n\
  \n## SQL Merge 语句详解\n\n如上文所述，SQL 中的 `MERGE` 语句是 `INSERT`、`DELETE` 和 `UPDATE` 命令的混合体。因此，如果需要合并\
  \ `Source` 表和 `Target` 表，`MERGE` 语句可以同时完成所有三个操作（`INSERT`、`UPDATE` 和 `DELETE`）。\n\
  \n将通过一个简单的示例来演示 `MERGE` 语句的使用。\n\n假设有两个表：\n\n`PRODUCT LIST` 是一个包含可用物品当前信息的表，字段 `Prd_ID`、`Prd_NAME`\
  \ 和 `Prd_PRICE` 分别对应每个产品的 ID、名称和价格。\n\n`UPDATED LIST` 是一个持有产品更新信息的表，字段 `Upd_ID`、`Upd_NAME`\
  \ 和 `Upd_PRICE` 分别对应产品的 ID、名称和价格。\n\n**Product List:**\n\n| Prd_ID | Prd_Name |\
  \ Prd_Price |\n| --- | --- | --- |\n| 10 | Sauces | 22.00 |\n| 12 | Bakery | 30.00\
  \ |\n| 14 | Tea | 45.00 |\n\n**Updated List:**\n\n| Prd_ID | Prd_Name | Prd_Price\
  \ |\n| --- | --- | --- |\n| 10 | Sauces | 25.00 |\n| 12 | Bakery | 39.00 |\n| 17\
  \ | Juices | 75.00 |\n\n目标是更新 `PRODUCT LIST` 的产品数据以与 `UPDATED LIST` 一致。\n\n### 解决方案\n\
  \n让我们此示例分解为几个步骤以便于理解。\n\n*   **步骤 1**: 识别 `TARGET` 和 `SOURCE` 表。\n    在本示例中，由于 `PRODUCT\
  \ LIST` 是 `TARGET` 表而 `UPDATED LIST` 是 `SOURCE` 表，因此 `PRODUCT LIST` 将作为 `TARGET`\
  \ 表，`UPDATED LIST` 将作为 `SOURCE` 表。\n\n*   **步骤 2**: 识别必须完成的任务。\n    可以观察到 `TARGET`\
  \ 表和 `SOURCE` 表之间有三处不匹配，如下：\n\n    *   `TARGET` 中 `COFFEE` 的价格为 15.00，但在 `SOURCE`\
  \ 中为 25.00。\n\n    ```\n     PRODUCT_LIST\n    12     Bakery     30.00\n\n     \
  \    UPDATED_LIST\n    12     Bakery     39.00\n    ```\n\n    *   `SOURCE` 没有茶产品，但\
  \ `TARGET` 有。\n\n    ```\n    PRODUCT_LIST\n    14     tea     45.00\n    ```\n\n\
  \    *   `TARGET` 没有 Juices 产品，但 `SOURCE` 有。\n\n    ```\n    UPDATED_LIST\n    17\
  \     Juices     75.00\n    ```\n\n    *   由于上述不一致性，必须在 `TARGET` 中执行三个操作。它们如下：\n\
  \n        1.  `UPDATE` 操作\n            ```\n            10     SAUCE     25.00\n\
  \            ```\n        2.  `DELETE` 操作\n            ```\n            4     TEA\
  \     45.00\n            ```\n        3.  `INSERT` 命令\n            ```\n       \
  \     104     JUICES     75.00\n            ```\n\n*   **步骤 3**: 编写 SQL 查询。\n\n\
  \    ```\n    /* Selecting the Target and the Source */\n    MERGE PRODUCT_LIST\
  \ AS TARGET\n          USING UPDATE_LIST AS SOURCE\n          /* 1\\. 执行 UPDATE\
  \ 操作 */\n          /* 如果 Prd_ID 相同，\n          检查 Prd_NAME 或 Prd_PRICE 是否变化 */\n\
  \          ON (TARGET. Prd_ID = SOURCE.Prd_ID)\n          WHEN MATCHED\n       \
  \         AND TARGET. Prd_NAME <> SOURCE.Prd_NAME\n            OR TARGET. Prd_PRICE\
  \ <> SOURCE.Prd_PRICE\n          /* 更新 TARGET 中的记录 */\n          THEN UPDATE\n \
  \               SET TARGET. Prd_NAME = SOURCE.Prd_NAME,\n                TARGET.\
  \ Prd_PRICE = SOURCE.Prd_PRICE\n          /* 2\\. 执行 INSERT */\n          /* 当没有匹配\
  \ TARGET 表的记录时，\n     将记录插入目标表 */\n          WHEN NOT MATCHED BY TARGET\n      \
  \    THEN INSERT (Prd_ID, Prd_NAME, Prd_PRICE)\n                VALUES (SOURCE.Prd_ID,\
  \ SOURCE.Prd_NAME,\n    SOURCE.Prd_PRICE)\n          /* 3\\. 执行 DELETE */\n    \
  \      /* 当没有匹配 SOURCE 表的记录时，\n     从目标表中删除这些记录 */\n          WHEN NOT MATCHED BY\
  \ SOURCE\n          THEN DELETE\n    /* END OF MERGE */\n    ```\n\n    **输出：**\
  \ `PRODUCT_LIST`\n\n    | Prd_ID | Prd_Name | Prd_Price |\n    | --- | --- | ---\
  \ |\n    | 10 | Sauces | 25.00 |\n    | 12 | Bakery | 39.00 |\n    | 17 | Juices\
  \ | 75.00 |\n\n    因此，通过 `MERGE` 语句的帮助，我们可以同时执行 SQL 中的三个主要语句。\n\n## DDL, DML, DCL\
  \ 和 TCL 命令\n\n结构查询语言（SQL）正如我们所知，是一种数据库语言，允许我们对现有数据库执行特定操作，并构建新数据库。SQL 通过使用 `Create`、`Drop`\
  \ 和 `Insert` 等命令来执行基本活动。\n\n这些 SQL 命令分为四类，即数据修改语言（DML）、数据定义语言（DDL）、数据控制语言（DCL）和事务控制语言（TCL）。关于单个命令的详细信息已在第一章中描述。\n\
  \n在 SQL 中创建域 (Domain)\n\n此语句可用于创建和定义域。`CREATE DOMAIN` 是创建一个新域的命令。域只是带有约束条件的数据类型（对允许值范围的限制）。创建域的用户将成为该域的所有者。如果指定了模式名称（例如\
  \ `CREATE DOMAIN myschema.mydomain...`），则域将在指定的模式中形成。\n\n如果没有，它将在当前模式中创建。域名必须与模式中的其他类型和域区分。域对于在单元位置存储和维护公共字段约束非常有用。例如，许多表可能包含电子邮件地址列，所有这些列都需要相同的\
  \ CHECK 约束来确保地址格式正确。与其单独为每个表设置约束，不如定义一个域。\n\n**参数：** `create domain` 包含多种参数：\n\n\
  *   `✓ Name`\n    要创建的域的名称（可选的模式限定）。\n\n*   `✓ Data type`\n    域的底层数据类型。数组标识符就是一个例子。\n\
  \n*   `✓ Collation`\n    域的排序规则，可选的。如果没有提供排序规则，则使用底层数据类型的默认排序规则。如果给定了 `COLLATE`，则底层类型必须是可排序的。\n\
  \n*   `✓ EXPRESSION BY Default`\n\n\n\n\n对于具有域数据类型的列，通过 `DEFAULT` 子句提供默认值。可以使用任何不含变量的表达式作为值（但不允许子查询）。默认表达式的数据类型必须与域的数据类型匹配。如果没有提供默认值，则使用\
  \ `null` 值作为默认值。\n\n任何未指定列值的 `insert` 操作都将使用默认表达式。如果为特定列提供了默认值，则与域关联的任何默认值都将被覆盖。因此，任何与底层数据类型相关的默认值都被域默认值覆盖。\n\
  \n- `✓ NOT NULL`\n该域的值为 `null`。\n\n- `✓ NULL`\n该域的值允许 `null`。这是默认行为。此子句仅用于兼容非标准的\
  \ SQL 数据库。不建议在新应用程序中使用它。\n\n- `✓ CHECK (expression)`\n`CHECK` 子句定义了域数据必须通过的完整性限制或测试。每个约束必须是一个产生布尔结果的表达式。应使用术语\
  \ `VALUE` 来指代正在检查的值。评估为 `TRUE` 或 `UNKNOWN` 的表达式将成功。如果表达式的结果为 `FALSE`，则会报告错误，且该值无法更改为域类型。目前\
  \ `CHECK` 表达式不能包含子查询，也不能引用 `VALUE` 以外的变量。当一个域中有多个 `CHECK` 约束时，将按照名称字母顺序进行测试。\n\n\
  ### 创建新域\n\n要创建新域，请按照以下步骤操作 (SQL)：\n\n- 连接到数据库。\n- 使用 `CREATE DOMAIN` 语句创建一个新域。\n\
  \n#### 简单域（示例 1）\n\n数据库的某些列将用于存储姓名，而另一些将用于存储地址。然后可以定义跟随域的类型。\n\n```\nCREATE DOMAIN\
  \ persons_Name CHAR (30)\nCREATE DOMAIN street_Address CHAR (35)\n```\n\n在指定这些域后，您可以像使用内置数据类型一样使用它们。例如，这些定义可以用于创建以下表。\n\
  \n```sql\nCREATE TABLE customer (\n   id INT DEFAULT AUTOINCREMENT PRIMARY KEY\n\
  \   name persons_name\n   address street_address\n)\n```\n\n#### 示例 2：默认值、检查限制和标识符。\n\
  \n在上面的示例中，表的主键被声明为整数类型。您的许多表可能需要相同的标识符。在这些应用程序中使用标识符域要比说它们是整数要方便得多。\n\n在创建域时，您可以定义默认值和检查约束，以确保向此类类型的任何列中输入不当的值。\n\
  \n表标识符通常由整数值组成。正数是唯一 ID 的可靠选择。由于此类标识符可能在多个表中使用，可以定义以下域：\n\n```sql\nCREATE DOMAIN\
  \ identifier INT\nDEFAULT AUTOINCREMENT\nCHECK ( @col > 0 )\n```\n\n变量 `@col` 用于此检查约束中。您可以使用此定义重写上述\
  \ `customer` 表的定义。\n\n```sql\nCREATE TABLE customer (\n   id identifier PRIMARY\
  \ KEY\n   name persons_name\n   address street_address\n)\n```\n\n#### 示例 3：内置域\n\
  \nAdaptive Server Anywhere 中预定义了一些域。您可以像使用自定义域一样使用这些预定义域。例如，下例货币域已经为您构建好。\n\n**语法：**\n\
  \n```sql\nCREATE DOMAIN name [ AS ] data_type\n    [ COLLATE collation ]\n    [\
  \ DEFAULT expression ]\n    [ constraint [ ... ] ]\nwhere constraint is:\n[ CONSTRAINT\
  \ constraint_name ]\n{ NOT NULL | NULL | CHECK (expression) }\n```\n\n**示例：**\n\n\
  此示例创建了印度邮政编码数据类型，然后将其用于表定义。为了确保值看起来像真实的印度邮政编码，使用了正则表达式测试：\n\n```sql\nCREATE DOMAIN\
  \ Indian_postal_code AS TEXT\nCHECK(\n   VALUE ~ ‘^\\d{5}$’\nOR VALUE ~ ‘^\\d{5}-\\\
  d{4}$’\n);\nCREATE TABLE us_snail_addy (\n  address_id SERIAL PRIMARY KEY,\n  street1\
  \ TEXT NOT NULL,\n  street2 TEXT,\n  street3 TEXT,\n  city TEXT NOT NULL,\n  postal\
  \ Indian_postal_code NOT NULL\n);\n```\n\n## Describe 语句\n\nSQL `DESCRIBE TABLE`\
  \ 命令负责提供数据库中特定表的信息。要显示服务器上数据库表或多个表的结构，我们将使用 SQL 命令 `DESCRIBE` 或另一个术 `DESC`，它等同于\
  \ `DESCRIBE`。我们将使用 `DESCRIBE` 或 `DESC` 来检索数据库中表的信息并定位与它相关的属性。两者都不区分大小写，且产生可比较的结果。我们使用\
  \ `DESCRIBE TABLE` 查询来获取列名、数据类型、其 `NULL` 或 `NOT NULL` 属性以及表的数据库大小准确性，以及 `NUMERIC`\
  \ 类型的标度信息。\n\n**语法：**\n\n```sql\nDESCRIBE one;\n  OR\nDESC one;\n```\n\n注意，可以使用\
  \ `DESCRIBE` 或 `DESC`（两者都不区分大小写）。假设我们的表名为 `one`，有三列：`F_NAME`、`L_NAME` 和 `SALARY`，每列都可以有\
  \ `null` 值。\n\n**输出：**\n\n| Name | Null | Type |\n| --- | --- | --- |\n| F_NAME\
  \ | | CHAR (25) |\n| L_NAME | | CHAR (25) |\n| SALARY | | NUMBER (6) |\n\n我们可能可以使用\
  \ `DESC` 或 `DESCRIBE` 查看表的结构，但在控制台上看不到；表结构在数据库系统软件的 describe 选项卡中可见。因此，`desc` 或\
  \ `describe` 命令显示表的结构，包括列名、数据类型和可空性，可空性指示列是否可以存储 `null` 值。表的所有这些特征在创建时都已描述了。\n\n\
  考虑以下场景：\n\n- 创建表或指定表的结构\n\n```sql\ncreate table one\n(\nS_id int not null,\nS_name\
  \ char(25)\n)\n```\n\n我们构建了一个名为 `one` 的表，列为 `S_ID`、`S_NAME` 和 `S_ID`，其中 `S_ID` 是非空类型，这意味着我们不能在\
  \ `S_ID` 列中放入 `null` 值，但在 `S_NAME` 字段中可以。\n\n为了解释 `DESC`，请以下示例：\n\n- 定义表的结构或创建表：\n\
  \n```sql\ncreate table one\n(\n S_id int not null, S_name char(25),\n city varchar2(25)\n\
  )\n```\n\n- 显示表的结构\n\n```sql\nDESC one\n  OR\nDESCRIBE one\n```\n\n**输出：**\n\n|\
  \ Name | Null | Type |\n| --- | --- | --- |\n| S_ID | Not Null | INT |\n| S_NAME\
  \ | | CHAR (25) |\n| CITY | | VARCHAR2 (25) |\n\nID 字段非空；然而，另外两列可以有 `null` 值。我们必须仅在您的系统软件上使用\
  \ `DESC` 命令；它在任何编辑器中都不会生效。请确保您只在自己的数据库上运行此命令。\n\n## SQL 中的 Case Statement\n\n如果您需要根据其他单元格条件地向单元格添加值，将使用\
  \ SQL 的 `case` 语句。\n\nSQL 中的 `case` 语句等于其他语言中的 `if` 语句或 `switch` 语句。它允许您以条件方式定义值，根据条件是否满足来更改单元格的值。\n\
  \n#### SQL Case Statement 的语法\n\n语法很复杂，但仍然简单：`CASE` 术语表示 case 语句的开始，`END` 关键字表示结束。然后，您可以输入\
  \ `WHEN` 关键字，后跟单个条件的条件。`THEN` 术后面跟着该条件的值，例如 `WHEN condition> THEN stuff>`。\n\n之后可以添加其他\
  \ `WHEN`/`THEN` 语句。通过 `ELSE` 关键字，可以在所有标准都不成立时添加一个默认值，如下：\n\n```sql\nCASE\n   WHEN\
  \ condition1 THEN stuff\n   WHEN condition2 THEN other stuff\n   ...\n   ELSE default\
  \ stuff\nEND\n```\n\n让我们通过练习来更好地理解它。\n\nSQL Case Statement 的示例如下：\n\n\n\n\n让我们来看一个\
  \ CASE 语句的示例。有一张列有学生列表及其考试成绩的表格。我们需要为每个学生分配一个等级，可以使用 CASE 语句自动完成。\n\n| ID | 姓名 |\
  \ 分数 |\n| --- | --- | --- |\n| 1 | Simon | 60 |\n| 2 | Iris | 80 |\n| 3 | Maliki\
  \ | 52 |\n| 4 | Chrissy | 98 |\n| 5 | Lemma | 84 |\n| 6 | Alex | 82 |\n| 7 | Uranus\
  \ | 69 |\n| 8 | Raza | 78 |\n| 9 | Calvin | 87 |\n| 10 | Alvin | 57 |\n| 11 | Gabriela\
  \ | 89 |\n| 12 | Marcel | 99 |\n| 13 | Christopher | 55 |\n| 14 | Nick | 81 |\n\
  | 15 | Elvin | 71 |\n| 16 | Leo | 90 |\n| 17 | Johnny | 90 |\n| 18 | Anais | 90\
  \ |\n| 19 | Ryan | 97 |\n| 20 | Simpson | 61 |\n| 21 | Elena | 63 |\n| 22 | Kathrin\
  \ | 51 |\n\n我们可以使用 CASE 语句为每个学生分配等级，该等级将存储在一个名为 `grade` 的新列中。让我们先编写 CASE 语句，其中包含等级的划分标准。如果分数为\
  \ 94 或以上，该行将被赋予值 A。如果分数为 90 或以上，将分配字母 A-，以此此类推。\n\n```\nCASE\n    WHEN score >=\
  \ 94 THEN “A++”\n    WHEN score >= 90 THEN “A+”\n    WHEN score >= 87 THEN “B++”\n\
  \    WHEN score >= 83 THEN “B+”\n    WHEN score >= 80 THEN “B-”\n    WHEN score\
  \ >= 77 THEN “C++”\n    WHEN score >= 73 THEN “C+”\n    WHEN score >= 70 THEN “C-”\n\
  \    WHEN score >= 67 THEN “D++”\n    WHEN score >= 60 THEN “D+”\n    ELSE “F”\n\
  \  END\n```\n\n在我们编写完 CASE 语句后，将在查询中使用它。然后，使用 `AS` 关键字为该列命名为 `grade`：\n\n```sql\n\
  SELECT *,\n  CASE\n        WHEN score >= 94 THEN “A++”\n    WHEN score >= 90 THEN\
  \ “A+”\n    WHEN score >= 87 THEN “B++”\n    WHEN score >= 83 THEN “B+”\n    WHEN\
  \ score >= 80 THEN “B-”\n    WHEN score >= 77 THEN “C++”\n    WHEN score >= 73 THEN\
  \ “C+”\n    WHEN score >= 70 THEN “C-”\n    WHEN score >= 67 THEN “D++”\n    WHEN\
  \ score >= 60 THEN “D+”\n    ELSE “F”\n  END AS grade\nFROM students_grades;\n```\n\
  \n此查询返回的表格所示——每个学生现在都根据其表现有了一个等级。\n\n| ID | 姓名 | 分数 | 等级 |\n| --- | --- | --- |\
  \ --- |\n| 1 | Simon | 60 | D+ |\n| 2 | Iris | 80 | B- |\n| 3 | Maliki | 52 | F\
  \ |\n| 4 | Chrissy | 98 | A++ |\n| 5 | Lemma | 84 | B++ |\n| 6 | Alex | 82 | B+\
  \ |\n| 7 | Uranus | 69 | D++ |\n| 8 | Raza | 78 | B- |\n| 9 | Calvin | 87 | B++\
  \ |\n| 10 | Alvin | 57 | F |\n| 11 | Gabriela | 89 | B++ |\n| 12 | Marcel | 99 |\
  \ A++ |\n| 13 | Christopher | 55 | F |\n| 14 | Nick | 81 | B- |\n| 15 | Elvin |\
  \ 71 | C- |\n| 16 | Leo | 90 | A+ |\n| 17 | Johnny | 90 | A+ |\n| 18 | Anais | 90\
  \ | A+ |\n| 19 | Ryan | 97 | A++ |\n| 20 | Simpson | 61 | D+ |\n| 21 | Elena | 63\
  \ | D+ |\n| 22 | Kathrin | 51 | F |\n\n**CASE 语句的示例 1：** 例如，我们可以使用 `ORDER BY` 来排列行，使得最高等级出现在最。\n\
  \n```sql\nSELECT name,\n  CASE\n    WHEN score >= 94 THEN “A++”\n    WHEN score\
  \ >= 90 THEN “A+”\n    WHEN score >= 87 THEN “B++”\n    WHEN score >= 83 THEN “B+”\n\
  \    WHEN score >= 80 THEN “B-”\n    WHEN score >= 77 THEN “C++”\n    WHEN score\
  \ >= 73 THEN “C+”\n    WHEN score >= 70 THEN “C-”\n    WHEN score >= 67 THEN “D++”\n\
  \    WHEN score >= 60 THEN “D+”\n    ELSE “F”\n  END AS grade\nFROM students_grades\n\
  ORDER BY score DESC;\n```\n\n因为字母顺序与根据价值划分的等级顺序不同，所以我们根据分数（数字）进行排名，而不是根据等级列。为了以降序排列显示，我们使用\
  \ `DESC` 关键字，将最高值排在顶部。\n\n我们得到的表格所示：\n\n| 姓名 | 等级 |\n| --- | --- |\n| Simon | D+\
  \ |\n| Iris | B- |\n| Maliki | F |\n| Chrissy | A++ |\n| Lemma | B++ |\n| Alex |\
  \ B+ |\n| Uranus | D++ |\n| Raza | B- |\n| Calvin | B++ |\n| Alvin | F |\n| Gabriela\
  \ | B++ |\n| Marcel | A++ |\n| Christopher | F |\n| Nick | B- |\n| Elvin | C- |\n\
  | Leo | A+ |\n| Johnny | A+ |\n| Anais | A+ |\n| Ryan | A++ |\n| Simpson | D+ |\n\
  | Elena | D+ |\n| Kathrin | F |\n\n**CASE 语句的示例 2：** 让我们更详细地查看有多少学生获得了某个等级。\n\n\
  ```sql\nSELECT,\n  CASE\n    WHEN score >= 94 THEN “A++”\n    WHEN score >= 90 THEN\
  \ “A+”\n    WHEN score >= 87 THEN “B++”\n    WHEN score >= 83 THEN “B+”\n    WHEN\
  \ score >= 80 THEN “B-”\n    WHEN score >= 77 THEN “C++”\n    WHEN score >= 73 THEN\
  \ “C+”\n    WHEN score >= 70 THEN “C-”\n    WHEN score >= 67 THEN “D++”\n    WHEN\
  \ score >= 60 THEN “D+”\n    ELSE “F”\n  END AS grade,\n  COUNT(*)\nFROM students_grades\n\
  GROUP BY grade;\n```\n\n**唯一约束 (Unique Constraints)**\n\n唯一约束确保列或多个列的组合在表中是唯一的。你可以使用\
  \ SQL Server Management Studio 或 Transact-SQL 来定义唯一约束。\n\n以下语句创建了一个具有唯一列的表：\n\n\
  ```sql\nCREATE SCHEMA Hr;\nGO\nCREATE TABLE Hr_persons(\n    E_id INT PRIMARY KEY,\n\
  \    F_name VARCHAR (255) NOT NULL,\n    L_name VARCHAR (255) NOT NULL,\n    Email\
  \ VARCHAR (255) UNIQUE\n);\n```\n\n唯一约束也可以定义为表约束，如下：\n\n```sql\nCREATE TABLE Hr_persons(\n\
  \    E_id INT PRIMARY KEY,\n    F_name VARCHAR (255) NOT NULL,\n    L_name VARCHAR\
  \ (255) NOT NULL,\n    Email VARCHAR (255),\n    UNIQUE (email)\n);\n```\n\n为了确保唯一约束中的的信息是唯一的，SQL\
  \ Server 会后台创建一个唯一索引。作为结果，尝试插入重复记录将导致 SQL Server 拒绝修改并返回违反约束的消息。\n\n以下语句在 `Hr_persons`\
  \ 表中创建了一行：\n\n```sql\nINSERT INTO Hr_persons (F_name, L_name, Email)\nVALUES ('Joe',''Johnas','J.johnas@king.burger');\n\
  ```\n\n该语句按预期执行。然而，由于重复的邮箱，以下语句失败：\n\n```sql\nINSERT INTO Hr_persons (F_name, L_name,\
  \ Email)\nVALUES ('Joe',''Johnas','J.johnas@king.burger');\n```\n\nSQL Server 发布的以下错误信息：\n\
  \n```\nViolation of UNIQUE KEY constraint ‘UQ__persons__\nLR7E1724E’. In the object\
  \ “HR people,” a duplicate\nkey cannot be inserted. The value of the second key\
  \ is\n(J.johnas@king.burger).\n```\n\n如果不命名唯一约束，SQL Server 会生成一个名称。在这种情况下，约束名称为\
  \ `UQ people LR7E1724E`，这并不非常易读。使用 `CONSTRAINT` 关键字为唯一约束分配特定的名称，如下所示：\n\n```sql\n\
  CREATE TABLE Hr_persons (\n    E_id INT PRIMARY KEY,\n    F_name VARCHAR (255) NOT\
  \ NULL,\n    L_name VARCHAR (255) NOT NULL,\n    Email VARCHAR (255),\n    CONSTRAINT\
  \ unique_email UNIQUE(email)\n);\n```\n\n\n\n\n为 `UNIQUE` 约束指定唯一的名称有以下益处：\n\n* ➢\
  \ 现在对错误信息进行分类要容易得多了。\n* ➢ 当你想要更改约束时，可以引用它的名称。\n\n### 主键与唯一约束的对比\n\n尽管 `UNIQUE` 和\
  \ `PRIMARY KEY` 限制都存在数据的唯一性，但当你想要强制某个列或一组非主键列的唯一性时，你应该使用 `UNIQUE` 而不是 `PRIMARY KEY`。\n\
  \n`UNIQUE` 约束与 `PRIMARY KEY` 约束不同，它允许存在 `NULL`。此外，由于 `UNIQUE` 约束将 `NULL` 视为普通值，因此每列只允许一个\
  \ `NULL`。\n\n以下语句在 email 列中插入了一条带有 `NULL` 值的记录：\n\n```\nINSERT INTO hr.persons(\
  \ F_name, L_name)\nVALUES(‘Johny’,’Depp’);\n```\n\n如果你现在尝试向 email 列插入另一个 `NULL`，你将得到以下错误：\n\
  \n```\nINSERT INTO Hr_persons(F_name, L_name)\nVALUES(‘Amber’,’Turd’);\n```\n\n\
  以下是结果：\n\n```\nViolation of UNIQUE KEY constraint ‘UQ__persons__\nLR7E617240EE’.\
  \ In the object “Hr people,” a duplicate\nkey cannot be inserted. The value for\
  \ the duplicate\nkey is (NULL>).\n```\n\n### 组列的唯一约束\n\n你可以将一组列构建为一个 `UNIQUE` 表约束，列名用逗号分隔，如下所示：\n\
  \n```\nCREATE TABLE table_name (\n    key_column data_type PRIMARY KEY,\n    column1\
  \ data_type,\n    column2 data_type,\n    column3 data_type,\n    ...,\n    UNIQUE\
  \ (column1,column2)\n);\n```\n\n下面的示例创建了一个包含两个列（person id 和 skill id）的 `UNIQUE`\
  \ 约束：\n\n```\nCREATE TABLE hr.person_skills (\n    id INT IDENTITY PRIMARY KEY,\n\
  \    person_id int,\n    skill_id int,\n    updated_at DATETIME,\n    UNIQUE (person_id,\
  \ skill_id)\n);\n```\n\n#### 为现有列添加唯一约束\n\n当你向数据库中的现有列或列组添加 `UNIQUE` 约束时，SQL Server\
  \ 会检查这些列中的现有数据，以确保所有值都是唯一的。如果 SQL Server 检测到重复值，将生成错误且不会添加 `UNIQUE` 约束。\n\n向表添加\
  \ `UNIQUE` 约束的语法如下：\n\n```\nALTER TABLE table_name\nADD CONSTRAINT constraint_name\n\
  UNIQUE(column1, column2,...);\n```\n\n假设你有如下所示的 `Hr_persons` 表：\n\n```\nCREATE TABLE\
  \ Hr_persons (\n    E_id INT IDENTITY PRIMARY KEY,\n    F_name VARCHAR (255) NOT\
  \ NULL,\n    L_name VARCHAR (255) NOT NULL,\n    Email VARCHAR (255),\n    Phone\
  \ VARCHAR (20),\n);\n```\n\n在 email 列中，以下语句引入了一个 `UNIQUE` 约束：\n\n```\nALTER TABLE\
  \ Hr_persons\nADD CONSTRAINT unique_email UNIQUE (email);\n```\n\n例如，以下语句在 phone\
  \ 列上添加了 `UNIQUE` 约束：\n\n```\nALTER TABLE Hr_persons\nADD CONSTRAINT unique_phone\
  \ UNIQUE (phone);\nUNIQUE limitations 应该被移除。\n```\n\n#### Alter Table 删除约束的语句\n\n\
  它用于如下定义删除一个 `UNIQUE` 约束：\n\n```\nALTER TABLE table_name\nDROP CONSTRAINT constraint_name;\n\
  ```\n\n使用以下语句删除 `Hr_persons` 表中的唯一手机约束：\n\n```\nALTER TABLE hr.persons\nDROP CONSTRAINT\
  \ unique_phone;\n```\n\n更改唯一性限制。因为 SQL Server 中没有直接修改 `UNIQUE` 约束的查询，所以如果你想更新它，必须先删除约束然后重新创建它。\n\
  \n## 创建表扩展\n\nSQL 中的 `CREATE TABLE` 子句有一个扩展，可以生成一个与数据库中现有表具有相同架构的新表。它被用于在一个新表中临时存储复杂搜索的结果。新表的架构与被引用的表相同。新表默认继承引用表的列名和数据类型。\n\
  \n**语法：**\n\n```\nCREATE TABLE newTable LIKE pets;\n```\n\n**示例：**\n\n```\nCREATE\
  \ TABLE newTable as\n            (SELECT *FROM pets\n             WHERE pets.BREED\
  \ = ‘shitzu’)\n```\n\n**查询：**\n\n**Pets 表：**\n\n| ID | Name | Breed | Gender |\n\
  | --- | --- | --- | --- |\n| **441** | Tom | Lasa | Male |\n| **442** | Pizu | Golden\
  \ Retriever | Male |\n| **443** | Simba | Poodle | Male |\n| **444** | Pixel | Shitzu\
  \ | Female |\n| **445** | Lobby | Labrador | Female |\n| **446** | Liza | German\
  \ Shepherd | Male |\n\n**查询 1：**\n\n```\nCREATE TABLE newTable LIKE pets;\nSELECT\
  \ *\nFROM newTable\nwhere newTable.GENDER = ‘Female’;\n```\n\n**结果：**\n\n| ID |\
  \ Name | Breed | Gender |\n| --- | --- | --- | --- |\n| **444** | Pixel | Shitzu\
  \ | Female |\n| **445** | Lobby | Labrador | Female |\n\n**解释：** `newTable` 是 `pets`\
  \ 表的副本。结果是在是在 `newTable` 中筛选性别为 `Female` 的行。\n\n**查询 2：**\n\n```\nCREATE TABLE newTable\
  \ as\n            (SELECT *FROM pets\n             WHERE pets.BREED = ‘German Shepherd’);\n\
  ```\n\n**输出：**\n\n| ID | Name | Breed | Gender |\n| --- | --- | --- | --- |\n| **446**\
  \ | Liza | German Shepherd | Male |\n\n## 在 SQL 中重命名\n\n数据库管理员和用户可能想要更改数据库中某个表的名称，以便使其更有意义。通过使用\
  \ `RENAME TABLE` 和 `ALTER TABLE` 语句，可以在某些情况下实现这一点。\n\n在 SQL 中，`RENAME` 查询的语法如下：\n\
  \n```\nRENAME table_name TO new_name;\n```\n\nSQL 中有多个 `RENAME` 示例。\n\n我们选择了以下两个\
  \ SQL 示例来演示如何使用 `RENAME` 语句修改表名：\n\n让我们查看名为 `Cars` 的表示例：\n\n| Car Name | Colour\
  \ | Cost |\n| --- | --- | --- |\n| Hyundai i20 | White | 1085000 |\n| Renault KWID\
  \ | White | 950000 |\n| Toyota Fortuner | Red | 900000 |\n| Mahindra Scorpio | White\
  \ | 1000000 |\n| Kia Seltos | Black | 800000 |\n| Lamborghini Urus | Red | 795000\
  \ |\n\n**表：Automobiles**\n\n*   假设你想重命名上面的表 `Car 2022`。你必须输入以下 `RENAME` 查询来完成操作：\n\
  \n```\nRENAME Cars TO Car_2022;\n```\n\n\n*   让我们查看名为 `Employee` 的表示例：\n\n| E_Id\
  \ | E_Name | E_Salary | E_City |\n| --- | --- | --- | --- |\n| **01** | Amirah |\
  \ 25000 | Goa |\n| **02** | Anisette | 45000 | Delhi |\n| **03** | Bheem | 30000\
  \ | Goa |\n| **04** | Rashid | 29000 | Goa |\n| **05** | Suyash | 40000 | Delhi\
  \ |\n\n假设你想使用 `ALTER TABLE` 语句将上述表重命名为 `Coding Employees`。输入此操作的 SQL 查询如下：\n\n```\n\
  ALTER TABLE Employee RENAME TO Coding Employees;\n```\n\n\n\n\n\n```\nALTER TABLE\
  \ table_name\nDROP COLUMN column_name;\n```\n\n## 修改表\n\n它用于更改表中现有的列。也可以同时更改多个列。不同数据库的语法可能略有不同。\n\
  \n**语法：**\n\n```\nALTER TABLE table_name\nALTER COLUMN column_name column_type;\n\
  ```\n\n让我们通过一个示例来理解：\n\n示例表：Student\n\n| Roll_No. | Name |\n| --- | --- |\n| **1**\
  \ | Ram |\n| **2** | Abhi |\n| **3** | Tanu |\n| **4** | Rahul |\n\n**查询：**\n\n\
  * ➢ 向 `Student` 表添加 2 个列 `AGE` 和 `COURSE`。\n* ```o\n  ALTER TABLE Student ADD (AGE\
  \ number(3),COURSE\n    varchar(40));\n  ```\n\n**输出：**\n\n| Roll_No. | Name | Age\
  \ | Course |\n| --- | --- | --- | --- |\n| **1** | Ram |  |  |\n| **2** | Abhi |\
  \  |  |\n| **3** | Rahul |  |  |\n| **4** | Tanu |  |  |\n\n* 修改 `Student` 表中的 `COURSE`\
  \ 列。\n\n```\nALTER TABLE Student MODIFY COURSE varchar(20);\n```\n\n运行上述查询后，`Course`\
  \ 列的最大大小从 40 减小到 20。\n\n* 从 `Student` 表中删除 `COURSE` 列。\n\n```\nALTER TABLE Student\
  \ DROP COLUMN COURSE;\n```\n\n**输出：**\n\n| Roll_No. | Name | Age |\n| --- | ---\
  \ | --- |\n| **1** | Ram |  |\n| **2** | Abhi |  |\n| **3** | Rahul |  |\n| **4**\
  \ | Tanu |  | |\n\n## Limit 子句\n\nSQL 中最重要的子句之一是 `LIMIT`。开发者在处理海量数据库时，必须对脚本进行过滤，以获取精确的数量。这正是\
  \ `LIMIT` 的功能，它可以帮助你以所希望的方式、经过良好的过滤来提供所需的结果。\n\n### Limit 子句：它是什么？\n\n大表从 SQL `LIMIT`\
  \ 子句中受益匪浅，它使得多页结果或 SQL 分页的编码变得简单。当返回结果时，大量的记录可能会影响成功。即使许多记录满足了查询要求，一次也只能显示少数元组。`LIMIT`\
  \ 子句限制了 SQL 可以返回的元组数量。\n\n* 注意，并不是所有的 SQL 版本都支持此子句。\n* 你也可以定义 SQL 2008 的 `OFFSET/FETCH\
  \ FIRST` 子句。\n* 对于 `LIMIT/offset` 表达式，必须是一个非负整数。\n\n当你需要在不使用任何条件语句的情况下选取班级前三的学生时，可以使用\
  \ `LIMIT` 操作符。\n\n* 当使用 `LIMIT x OFFSET y` 命令时，初始的 `y` 输入会在返回下一个 `x` 输入之前被保存。\n\
  * `Offset` 只会用在 `ORDER BY` 子句中。你无法单独看到它。\n\n`OFFSET` 的值必须大于零或等于零。负反馈不是一个选项，因为错误会再次发生。\n\
  \n**举例说明：** MySQL 中的 `LIMIT` 子句控制返回的日志数量。\n\n如果你决定从‘Orders’ 表中从 1 到 30 之间选择任何记录，SQL\
  \ 查询将如下所示：\n\n```\n$sql = “SELECT * FROM Orders LIMIT 30”;\n```\n\n当运行上述 SQL 查询时，它们返回了前\
  \ 30 条记录。\n\n如果你想选择 16 到 25 条记录（包含边界）怎么办？\n\n在 MySQL 中使用 `OFFSET` 是另一个选项。\n\nSQL\
  \ 语句“仅返回 10 条记录，从第 16 条记录开始（OFFSET 15)”读取如下：`$sql = “SELECT * FROM Orders LIMIT\
  \ 10 OFFSET 15”;`\n\n### Select Limit 语句定义、语法和参数值是什么？\n\n`SELECT` 参数使用 `LIMIT` 子句来\
  \ `LIMIT` 返回记录的数量。`LIMIT` 子句接受一个或两个声明。两个语句的值必须为真或为假。\n\n接下来的两个参数演示了 `LIMIT` 子句的语法：\n\
  \n```\nSELECT\nselect list\nFROM\ntable name\n\nLIMIT [offset], “row count;”\n```\n\
  \n假设我们与 `Student` 表有关。\n\n**Student 表：**\n\n| Roll No. | Name | Grade |\n| --- |\
  \ --- | --- |\n| **1200** | Adi | 7 |\n| **1202** | Suhail | 8 |\n| **1203** | Himani\
  \ | 9 |\n| **1204** | Rob | 10 |\n| **1205** | Simar | 11 |\n| **1206** | Annei\
  \ | 12 |\n| **1207** | Yusufa | 13 |\n| **1208** | Ali | 14 |\n\n**查询：**\n\n```\n\
  SELECT *\nFROM Student\nLIMIT 5;\n```\n\n**输出：**\n\n| 1201 | Adi | 9 |\n| --- |\
  \ --- | --- |\n| **1202** | Suhail | 6 |\n| **1203** | Himani | 8 |\n| **1204**\
  \ | Rob | 9 |\n| **1205** | Sita | 7 |\n\n```\n```\nSELECT *\nFROM Student\nORDER\
  \ BY Grade DESC\nLIMIT 3;\n```\n\n**输出：**\n\n| **12006** | **Anne** | **10** |\n\
  | --- | --- | --- |\n| **12001** | Aditya | 9 |\n| **12004** | Robin | 9 |\n\n当我们需要识别班级前三名学生但不想使用任何条件语句时，可以在像上面描述的情况中使用\
  \ `LIMIT` 操作符。\n\n### 参数或论据\n\n* **Expressions (表达式)**：你想要获取的计算结果或列。\n* **Tables\
  \ (表)**：你想要从中获取记录的表。`FROM` 子句至少至少列出一表。\n* **Where Conditions (Where 条件)**：选择记录时必须满足的前提条件。\n\
  * **Order by Expression (排序表达式)**：它用于 `SELECT LIMIT` 语句中，帮助你定位想要返回的记录并对结果排序。升序为\
  \ `ASC`，降序为 `DESC`。\n* **Limit Number_Rows (限制行数)**：它根据将返回的行数决定结果集的最大行数。例如，使用 `LIMIT\
  \ 10` 将返回满足 `SELECT` 标准的前 10 条目。在这种情况下，排序顺序很重要，因此请明智地使用 `ORDER BY` 子句。\n* **Offset_Value\
  \ (偏移量值)**：`LIMIT` 将使用偏移量值来选择首先返回哪行。\n\n### 使用 Limit 关键字\n\n`LIMIT` 关键字限制了返回的结果集中中的行数。\n\
  \n* `LIMIT` 数字可以是 0 到 255 之间的任何数字。如果 `LIMIT` 设置为 0 (0)，则不会从结果集中返回任何行。\n* 你可以使用 `OFFSET`\
  \ 值来选择从哪一行开始数据恢复。\n* `LIMIT` 的语法与选择性更新或 `DELETE` 顺序配合得很好。\n\n### 什么时候应该使用 Limit\
  \ 子句？\n\n假设你正在开发一个使用 `MyFlixDB` 数据库的程序。系统设计人员要求你限制屏幕上显示的记录数量为 20 条，以解决加载缓慢的问题。应该如何实现满足这些客户需求的框架？在这些情况下，`LIMIT`\
  \ 关键字非常有帮助。查询返回的数据可以限制每个标签页仅 20 份文档。\n\n### Limit 子句的好处\n\n根据 `LIMIT` 子句，结果集中仅包含最大数量的行（如果最大行数小于符合条件的行数，则正好为最大行数）。不会返回满足查询集合条件的额外行。它还可以使用主机变量或设置为\
  \ SPL 输入值的局部变量设置最大值。如果 `LIMIT` 子句位于 `ORDER BY` 子句之后，则返回的行将通过 `ORDER BY` 进行排序。`ORDER\
  \ BY` 可能对通过限制行顺序来返回符合条件的行子集的搜索有效，因为查询结果通常不是按精确顺序交付的。\n\n## Insert Ignore 语句\n\n\
  `INSERT` 语句用于在向数据库表插入数据时执行此操作。`IGNORE` 关键字可以添加到 `INSERT` 语句语法中。通常建议使用 `INSERT IGNORE`\
  \ 语句而不是 `INSERT` 语句。这样做是为了通过 `INSERT IGNORE` 语句处理在添加重复记录时产生的错误，使 MySQL 数据库中的记录不会变得不一致或冗余。\n\
  \n### MySQL 的 Insert Ignore 功能是如何工作的？\n\n\n\n\n\n当使用 `INSERT` 语句向 MySQL 数据库的特定表插入许多条记录并由于某种原因发生错误时，MySQL\
  \ 将停止执行查询并报告错误，而不会向我们尝试插入的表中添加任何行。然而，如果我们使用 `INSERT IGNORE` 而不是简单的插入命令，`Mysql` 将发出警告并插入所有正确的记录，同时跳过并排除导致错误的行。\n\
  \n### 语法\n\n`INSERT IGNORE` 语句的语法如下：\n\n```\nINSERT IGNORE INTO table(list_of_columns)\n\
  VALUES(record1),\n(record2),\n```\n\n其中 `list of columns` 是你打算包含在记录中的列名，用用逗号分隔；`record1`、`record2`\
  \ 是你在 `list of columns` 中指出的列的值，其顺序与在列表中给出的顺序一致。\n\n### 缺点\n\n由于某些错误可能不会被报告，大多数用户并不倾向于使用\
  \ `INSERT IGNORE` 而非 `INSERT`。这可能会导致表中出现差异，使得某些元组无法插入，且没有给用户修复它们的机会。因此，`INSERT IGNORE`\
  \ 只能在非常特殊的情况下使用。\n\n### 示例\n\n假设我们有一个关系 `Employee`。\n\n**Employee 表：**\n\n| Emp_ID\
  \ | Name | City |\n| --- | --- | --- |\n| 1501 | Aakash | Dehradun |\n| 1503 | Salil\
  \ | Bangalore |\n| 1509 | Joe | Hyderabad |\n| 1508 | Shelli | Delhi |\n| 1502 |\
  \ Ana | Mumbai |\n| 1504 | Semma | Pune |\n\n我们可以注意到，这些目并不是根据其主键（即 `Emp_ID`）排序的。\n\
  \n**示例查询：**\n\n```\nINSERT IGNORE INTO Employee (EmployeeID, Name, City)\nVALUES\
  \ (15010, ‘Rameshwar’, ‘Mumbai’);\n```\n\n**输出：**\n\n未插入记录。\n\n**插入多条记录：**\n\n一次性插入多条记录时，任何无法插入的记录都不会被插入，但可以插入的将被插入：\n\
  \n* `INSERT IGNORE INTO Employee (EmployeeID, Name, City)`\n* `VALUES (15007, ‘Shikha’,\
  \ ‘Delhi’), (15002, ‘Ram’, ‘Mumbai’), (15009, ‘Sam’, ‘Ahmedabad’);`\n\n**输出：**\n\
  \n第一条和最后一条已添加；中间的记录仅被忽略。没有弹出错误信息。\n\n由于 `Mysql` 会尝试更改值以按正确方式排列，并插入除产生问题的之外的所有正确记录，使用\
  \ `INSERT IGNORE` 语句而不是简单的插入语句始终是一种推荐的做法。\n\n## Like 操作符\n\n为了确定特定的字符串是否匹配给定的模式，使用了逻辑运算符\
  \ `LIKE`。它通常用于 `Where` 子句，在列中搜索特定模式。当需要模式匹配而不是等于或不等于时，该运算符会很有帮助。当我们希望在给定的字符串匹配预定模式时返回行时，我们使用\
  \ `SQL Like` 函数。模式中既可以使用普通字符也可以通配符。普通字符必须与字符串中提供的字符完全匹配才能返回行。字符串的任何部分都可以使用通配符进行匹配。\n\
  \n### 语法\n\n```\nSELECT * FROM table_name\nWHERE column_name LIKE ‘pattern’\n```\n\
  \n在使用 `LIKE` 操作符可以使用以下通配符来指定模式：\n\n| Pattern | Description |\n| --- | --- |\n| %\
  \ | 百分比匹配 0–1 个多个大写或小写字母或数字。例如，‘B%’将匹配所有以‘B’开头，后跟任意数量字符或数字的字符串。 |\n| – | 下划线符号 `_`\
  \ 可以代表单个字母或数字。例如，‘B_’将匹配所有两个字符的字符串，其中第一个字符必须是‘B’，第二个可以是任意字符。 |\n| [] | `[]` 搜索 `[]`\
  \ 指定范围内的任何单个字符。例如‘B[e,l,p]’将匹配‘Ball’、『Bat’、『Bird’等。 |\n| [^] | `[^]` 搜索 `[^]` 指定范围之外的任何单个字符。例如‘B\
  \ [^e,l,p]’将匹配任何以‘B’开头的字符，但不是‘Bpple’、『Belp’、『Blep’、『Bple’等。 |\n\n在使用 `LIKE` 操作符时，这些通配符可以单独使用也可以组合使用。\n\
  \n例如：让我们在所有示例中使用员工信息表：\n\n| EmpId | FirstName | LastName | Email | Salary | HireDate\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| 1 | ‘John’ | ‘King’ | john.king@abc.com\
  \ | 33,000 | 2018-07-25 |\n| 2 | ‘James’ | ‘Bond’ | | | 2018-07-29 |\n| 3 | ‘Neena’\
  \ | ‘Kochhar’ | neena@test.com | 17,000 | 2018-08-22 |\n| 4 | ‘Lex’ | ‘De Haan’\
  \ | lex@test.com | | 2018-09-8 |\n| 5 | ‘Amit’ | ‘Patel’ | | 18,000 | 2019-01-25\
  \ |\n| 6 | ‘Abdul’ | ‘Kalam’ | abdul@test.com | 25,000 | 2020-07-14 |\n\n*(注：提供的文本包含高度重复且碎片化的示例；为了清晰起见，这些示例在保持原始来源核心逻辑和数据的基础上进行了合并。)*\n\
  \n\n\n\n\n```sql\nSELECT *\nFROM Employee\nWHERE FirstName NOT LIKE ‘j%’;\n```\n\
  \n上句中的 `FirstName NOT LIKE ‘j%’` 用于检索 `FirstName` 值不以‘j’开头的记录。\n\n| EmpId | FirstName\
  \ | LastName | Email | Salary | HireDate |\n| --- | --- | --- | --- | --- | ---\
  \ |\n| **3** | ‘Neena’ | ‘Kochhar’ | [neena@test.com] | 17,000 | 2018-08-22 |\n\
  | **4** | ‘Lex’ | ‘De Haan’ | [lex@test.com] | 15,000 | 2018-09-8 |\n| **5** | ‘Amit’\
  \ | ‘Patel’ | | 18,000 | 2019-01-25 |\n| **6** | ‘Abdul’ | ‘Kalam’ | [abdul@test.com]\
  \ | 25,000 | 2020-07-14 |\n\n## 某些 SQL 运算符\n\n当一个值与查询结果列表中的每个值进行比较时，使用 SQL Server\
  \ 的 `SOME` 运算符来确定内部查询结果是否至少存在一行。比较运算符必须位于 `SOME` 之前，以便其匹配子查询中的至少一个项。请注意，当使用 `SOME`\
  \ 时，大于符号（`>`）表示大于至少一个值。\n\n### 语法：\n\n```sql\nSELECT [col_name... | express1 ]\n\
  FROM [t_name]\nWHERE express2 comparison_operator {ALL | ANY | SOME}\n( subquery\
  \ )\n```\n\n### 参数：\n\n| 名称 | 描述 |\n| --- | --- |\n| **Col_name** | 表中列的名称。 |\n\
  | **Express1** | 表达式可以是 SQL 查询的一部分，用于执行计算或与其他值进行值比较，并由单个常量、变量、标量函数或列名组成。 |\n| **Table\
  \ name** | 表名。 |\n| **Where expression2** | 在 `SOME` 运算符找到匹配项之前比较标量表达式。要使 `SOME`\
  \ 运算符返回布尔值 TRUE，必须有一行或多行匹配该表达式。 |\n| **Comparison operator** | 比较子查询和表达式。比较中必须使用标准的比较运算符（`=`，\
  \ `>`, `!=`, `>=`, `<=`）。 |\n\n让我们通过一个示例来理解一些运算符：\n\n**教师表 (Instructor Table)：**\n\
  \n| Name | 系 | |资 |\n| --- | --- | --- |\n| **Chandra** | 计算生物学 | 1 |\n| **Visweswaran**\
  \ | 电子学 | 1.5 |\n| **Abraham** | 计算机科学 | 1.3 |\n| **John** | 电子学 | 1.2 |\n| **Samantha**\
  \ | 计算机科学 | 2 |\n| **Jyoti** | 电子学 | 1.2 |\n| **Debarka** | 计算机科学 | 2 |\n| **Ganesh**\
  \ | 计算生物学 | 0.9 |\n\n**示例查询与输出：**\n\n```sql\nselect name\nfrom instructor\nwhere\
  \ Salary > some(select Salary\nfrom instructor\nwhere dept=’Computer Science’);\n\
  ```\n\n**输出：**\n\nVisweswaran\nSamantha\nDebarka\n\n**解释：**\n\n工资超过“计算机科学”部门一名或多名教师工资的教师被要求离开。“计算机科学”部门支付的工资为\
  \ 1.3、2 和 2。这意味着任何工资高于 1.3 的教师都可以计入结果中。\n\n## SQL Server 中的 Offset Fetch\n\n在受限内存的情况下获取记录时，使用\
  \ `OFFSET FETCH` 功能可以避免内存溢出异常（exception）。在 SQL Server 中，`SELECT` 和 `ORDER BY` 子句与\
  \ `FETCH` 和 `OFFSET` 子句结合，以指定查询返回的记录范围。为了执行结果集分页，它首次在 SQL Server 2012 版本中引入。当我们的数据库拥有海量数据时，非常有帮助。\n\
  \n### Offset 和 Fetch 的应用\n\n**OFFSET**：使用此子句指定从结果集中返回行的起始点。本质上，它忽略了第一批记录。在 SQL Server\
  \ 中，它可以配合 `ORDER BY` 子句使用。如果其值为负，将返回错误。因此，它必须始终大于等于零。\n\n**FETCH**：在查询中，此可选子句指定我们在\
  \ `OFFSET` 之后想要返回的行数。如果没有 `OFFSET`，我们就无法使用它。与 `OFFSET` 类似，它的值不能为负。因此，为了避免错误，它必须始终大于等于零。\n\
  \n### 语法：\n\n用于演示如何利用 `OFFSET` 和 `FETCH` 子句的语法如下：\n\n```sql\nSELECT * FROM table_name\n\
  ORDER BY columns [ASC |DESC]\nOFFSET no_of_rows_to_skip\nFETCH {FIRST | NEXT} no_of_rows_to_return\
  \ {ROW | ROWS}\nONLY\n```\n\n我们在此语法中指定了获取数据的表名。对于按升序或降序显示的记录，我们接着指定了 `ORDER BY`\
  \ 子句。然后使用 `OFFSET` 指定要跳过的记录数量，最后使用 `FETCH` 返回记录集。\n\n让我们看看 `OFFSET` 和 `FETCH` 子句在实际中是如何使用的。假设我们有一个如下信息的“my\
  \ table”：\n\n| a | b |\n| --- | --- |\n| 1 | 100 |\n| 2 | 99 |\n| 3 | 98 |\n| 4\
  \ | 97 |\n| 5 | 96 |\n| 6 | 95 |\n| 7 | 94 |\n\n#### Fetch and Offset\n\n```sql\n\
  SELECT * from “my table” order by a offset 3 rows\nfetch next 2 rows only;\n```\n\
  \n**结果：**\n\n| a | b |\n| --- | --- |\n| 4 | 97 |\n| 5 | 96 |\n\n#### Offset Only\n\
  \n```sql\n查询: SELECT * from “my table” order by a offset 3\nrows;\n```\n\n**结果：**\n\
  \n| a | b |\n| --- | --- |\n| **4** | 97 |\n| **5** | 96 |\n| **6** | 95 |\n| **7**\
  \ | 94 |\n\n#### Fetch Only\n\n**查询：**\n\n```sql\nSELECT * from “my table” order\
  \ by a fetch next 2 rows\nonly;\n```\n\n**结果：**\n\n| a | b |\n| --- | --- |\n| **1**\
  \ | 100 |\n| **2** | 99 |\n\n## SQL Except 语句\n\n当使用两个 `SELECT` 查询选择记录时，`EXCEPT`\
  \ 语句是过滤记录最常用的语句之一。它返回左侧 `SELECT` 查询中但在 `EXCEPT` 语句右侧 `SELECT` 查询结果中不存在的项。SQL `EXCEPT`\
  \ 语句的操作方式与数学减法运算符的操作非常相似。Microsoft SQL Server 2005 引入了 `EXCEPT` 语句。\n\n### SQL Except\
  \ 语句的准备条件\n\n在 SQL Server 中使用 `EXCEPT` 语句之前，必须满足几个前提条件：\n\n* 执行 `SELECT` 操作的表具有相同数量的列和顺序。\n\
  * 相关的 `SELECT` 查询对于两个表的对应列应使用兼容或相同的数据类型。\n\n考虑以下场景：学生和助教（TA）。所有不是助教的学生都应该返回，如下述形式的问题所示：\n\
  \n**学生表 (Students Table)：**\n\n| StudentID | Name | Course |\n| --- | --- | ---\
  \ |\n| **1** | Rohan | DBMS |\n| **2** | Kevin | OS |\n| **3** | Mansi | DBMS |\n\
  | **4** | Mansi | ADA |\n| **5** | Rekha | ADA |\n| **6** | Megha | OS |\n\n**助教表\
  \ (TA Table)：**\n\n| StudentID | Name | Course |\n| --- | --- | --- |\n| **1** |\
  \ Kevin | TOC |\n| **2** | Sita | IP |\n| **3** | Manik | AP |\n| **4** | Rekha\
  \ | SNS |\n\n**语法：**\n\n```sql\nSELECT Name\n       FROM Students\nEXCEPT\nSELECT\
  \ NAME\n       FROM TA;\n```\n\n**输出：**\n\nRohan\nMansi\nMegha\n\n为了保留重复项，我们必须专门使用\
  \ `EXCEPTALL` 而不是 `EXCEPT`。\n\n```sql\nSELECT Name\n       FROM Students\nEXCEPTALL\n\
  SELECT Name\n       FROM TA;\n```\n\n**输出：**\n\nRohan\nMansi\nMansi\nMegha\n\n##\
  \ 在 SQL 中使用 Join 和 Over 子句聚合与非聚合值\n\n聚合函数将多个数字相加并返回单个结果。考虑员工表 `EMP` 和部门表 `DEPT`\
  \ 的以下结构：\n\n员工表 (Employee Table)\n\n| Name | Name | Course |\n| --- | --- | ---\
  \ |\n| **EMPNO** | NOT NULL | NUMBER(4) |\n| **ENAME** | | VARCHAR2(10) |\n| **JOB**\
  \ | | VARCHAR2(9) |\n| **MGR** | | NUMBER(4) |\n| **HIREDATE** | | DATE |\n| **SAL**\
  \ | | NUMBER(7, 2) |\n| **COMM** | | NUMBER(7, 2) |\n| **DEPTNO** | | NUMBER(2)\
  \ |\n\n部门表 (Department Table)\n\n| Name | Null | Type |\n| --- | --- | --- |\n|\
  \ **DEPTNO** | | NUMBER(2) |\n| **DNAME** | | VARCHAR2(14) |\n| **LOC** | | VARCHAR2(13)\
  \ |\n\n此外，还需要以下结果：\n\n* 显示员工名称、`sal` 和职位，以及所有相同工作的员工工资的最大、最小、平均和总 `sal`。\n* 显示部门名称和其中的员工人数。\n\
  \n\n\n\n\n无法通过直接组合聚合和非聚合值来获得结果。因此，可以使用以下方法：\n\n## 使用连接 (Joins)\n\n- 创建一个包含已聚合值的子表。\n\
  - 使用 `Join` 将子表中的结果与其原始值一起。\n\n使用 `JOIN` 解决问题 1 的方案：\n\n```sql\nSELECT ENAME, SAL,\
  \ EMP.JOB, \n            SUBTABLE.MAXSAL, SUBTABLE.MINSAL, \n            SUBTABLE.AVGSAL,\
  \ SUBTABLE.SUMSAL\nFROM EMP\nINNER JOIN\n        (SELECT JOB, MAX(SAL) MAXSAL, MIN(SAL)\
  \ \n                MINSAL, AVG(SAL) AVGSAL, SUM(SAL)\nSUMSAL \n         FROM EMP\
  \ \n          GROUP BY JOB) SUBTABLE\n                  ON EMP.JOB = SUBTABLE.JOB;\n\
  ```\n\n### 示例输出：\n\n| Ename | Sal | Job | MaxSal | MinSal | AvgSal | SumSal |\n\
  | --- | --- | --- | --- | --- | --- | --- |\n| SCOTT | 3,300 | ANALYST | 3,300 |\
  \ 1,925 | 2,841.67 | 8,525 |\n| HENRY | 1,925 | ANALYST | 3,300 | 1,925 | 2,841.67\
  \ | 8,525 |\n| FORD | 3,300 | ANALYST | 3,300 | 1,925 | 2,841.67 | 8,525 |\n| SMITH\
  \ | 3,300 | CLERK | 3,300 | 1,045 | 1,746.25 | 6,985 |\n| MILLER | 1,430 | CLERK\
  \ | 3,300 | 1,045 | 1,746.25 | 6,985 |\n\n## Over 子句\n\n- `Partition by` 和 `over`\
  \ 子句用于将数据划分为分区。\n- 对于每个分区，指定的函数处于激活状态。\n\n使用 `OVER` 子句解决问题 2 的方案：\n\n```sql\nSELECT\
  \ DISTINCT(DNAME),\nCOUNT(ENAME) OVER (PARTITION BY EMP.DEPTNO) EMP\nFROM EMP\n\
  RIGHT OUTER JOIN DEPT\nON EMP.DEPTNO=DEPT.DEPTNO\nORDER BY EMP DESC;\n```\n\n| Dname\
  \ | Emp |\n| --- | --- |\n| SALES | 6 |\n| RESEARCH | 5 |\n| ACCOUNTING | 3 |\n\
  | OPERATIONS | 0 |\n| OTHERS | 0 |\n\n## SQL ANY 和 ALL 操作符\n\n你可以使用 `ANY` 和 `ALL`\
  \ 运算符将单个列值与多种值进行比较。\n\n### SQL 中的 ANY 操作符\n\nANY 操作系统的：结果是，如果子查询中的**任何一个**值满足条件，则返回\
  \ `TRUE`。`ANY` 表示如果操作对于范围内的任何一个值为真，则该条件为真。\n\n**语法：**\n\n```sql\nSELECT column_name(s)\n\
  FROM table_name\nWHERE column_name operator ANY\n (SELECT column_name\n FROM table_name\n\
  \ WHERE condition);\n```\n\n### SQL 操作符 ALL\n\n名为 `SQL ALL` 的逻辑运算符将单个结果与子查询在单列中返回的一组值进行比较。`SQL\
  \ ALL` 操作符的语法所示：\n\n```sql\nWHERE column_name comparison_operator ANY (subquery);\n\
  ```\n\n比较运算符（如 `>`, `>=`, `=`, 或 `<>`）必须放在 `SQL ALL` 操作符之前，且子查询必须跟随其后。在某些数据库系统（如\
  \ `Oracle`）中，可以使用字面值列表代替子查询。请记住，如果子查询没有返回行，则 `WHERE` 子句的条件始终为 `true`。下表演示了 `SQL\
  \ ALL` 操作符的意义，假设子查询产生行或多行：\n\n演示数据库\n\n## SQL 中的 Exists\n\nSQL 关键操作符之一 `exists`\
  \ 允许你指定一个子查询，以检查特定对象是否存在于数据库。它使用下面列出的语法执行查询。\n\n**语法：**\n\n```sql\nSELECT [column_name...\
  \ | expression1 ]\nFROM [table_name]\nWHERE EXISTS (subquery)\n```\n\n如果子查询返回任何行，该操作符返回\
  \ `TRUE`；否则返回 `FALSE`。`SELECT`、`UPDATE`、`INSERT` 或 `DELETE` 命令都可以配合 `exists` 操作符使用。以下是语法参数的解释。\n\
  \n| 参数 | 说明 |\n| --- | --- |\n| Col_name | 列名 |\n| Express 1 | 这可以是任何由单个变量、常量甚至列名组成的表达式。\
  \ |\n| t_name | 你正在操作的列/表标题 |\n| Where exists | 它查找子查询中是否存在行或多行。如果存在行，则布尔值为 `TRUE`；否则为\
  \ `FALSE` |\n\n**查询：**\n\n```sql\nSELECT col_name FROM t_name\nWHERE EXISTS\n(SELECT\
  \ col_name FROM t_name WHERE condition);\n```\n\n返回值\n\n它返回一个 `True` 或 `False` 的布尔值。\n\
  \n**示例：**\n\n下方代码段中的 `Employee` 表包含以下列：`Employee id`（员工 ID）、`first name`（名）、`last\
  \ name`（姓）、`salary`（工资）和 `department`（部门）。\n\n```sql\n-- 创建员工表\nCREATE table Employee(\n\
  \    Employee_id int,\n    first_name varchar(100), \n    last_name varchar(100),\n\
  \    salary int,\n    department varchar(100),\n\nPRIMARY KEY(Employee_id));\n\n\
  -- 创建奖金表\nCREATE table bonus(\n    Employee_id int,\n    bonus_amt int,\n\nFOREIGN\
  \ KEY(Employee_id) REFERENCES\nEmployee(Employee_id));\n\n-- 在员工表中插入记录\nINSERT INTO\
  \ Employee\nvalues (1, “Charlie”, “Arora”, 100000, “Engineering”),\n       (2, “Niharika”,\
  \ “Verma”, 80000, “Admin”),\n       (3, “Thomas”, “Martin”, 300000, “HR”),\n   \
  \    (4, “William”, “O’Brien”, 500000, “Admin”),\n       (5, “Vivek”, “Bhati”, 500000,\
  \ “Admin”),\n       (6, “Vipul”, “Diwan”, 200000, “Account”),\n       (7, “Satish”,\
  \ “Kumar”, 75000, “Account”),\n       (8, “Anderson”, “Lee”, 90000, “Admin”);\n\n\
  -- 在奖金表中插入记录\nINSERT INTO bonus \nvalues (1, 5000),\n       (2, 5500),\n       (3,\
  \ 4000),\n       (1, 4500),\n       (2, 3500);\n\n-- 此嵌套查询将返回唯一的员工 ID，\n-- 条件是 bonus\
  \ 表中的员工 ID 等于\n-- employee 表中的员工 ID 且奖金金额小于\n-- 5500\nSELECT Employee_id FROM Employee\n\
  WHERE EXISTS (SELECT Employee_id FROM bonus WHERE\n              bonus.Employee_id\
  \ = Employee.Employee_id\n              AND bonus_amt < 5500);\n```\n\n**输出：**\n\
  \nEmployee_id\n1\n2\n3\n\n## SQL 中的 Group by 语句\n\n为了将相似的数据分组，使用了 `SELECT` 语句和 `SQL\
  \ GROUP BY` 子句。在 `SELECT` 语句中，该 `GROUP BY` 子句位于 `WHERE` 子句之后、`ORDER BY` 子句之前。\n\n\
  **语法：**\n\n以下代码块展示了 `GROUP BY` 子句的基本语法。如果有 `ORDER BY` 子句，它必须位于 `GROUP BY` 子句之后、`WHERE`\
  \ 子句约束条件之前。\n\n```sql\nSELECT col1, col2\nFROM t_name\nWHERE [ conditions]\nGROUP\
  \ BY col1, col2\nORDER BY col1, col2\n```\n\n**示例：**\n\n考虑 `CUSTOMERS` 表中的以下记录：\n\
  \n| ID | Name | Age | Address | Salary |\n| --- | --- | --- | --- | --- |\n| 111\
