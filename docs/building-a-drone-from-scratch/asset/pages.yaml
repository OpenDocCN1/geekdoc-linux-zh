  md: "# Intro - what is this about?\n\n+   - Learning-by-doing project\n- Attempt\
    \ to build a drone of acceptable quality, while:\n    - keeping the cost low;\n\
    \    - keeping the overall complexity low;\n    - using off-the-shelf components\
    \ easily obtainable through major worldwide retailers.\n    - achieving sufficient\
    \ modularity to support various configurations"
  merge: -1
