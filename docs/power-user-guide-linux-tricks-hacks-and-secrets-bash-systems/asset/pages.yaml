  md: "GIT CheatSheet\n\n \n\nThis git cheat sheet contains summaries and examples\
    \ of some of the git\n\ncommands. This section provides a quick reference of how\
    \ to create, manage\n\nand delete repositories, branches and files, as well as\
    \ modifying the\n\nconfiguration.\n\n \n\n**Creating Repositories**\n\n \n\ngit\
    \ init \\[ project\\_name \\]\n\nInitialize GIT in an existing directory.\n\n\
    \ \n\n**GIT Configuration**\n\ngit config\n\nConfigures the user information for\
    \ all the local repositories.\n\n --list\n\nshows current GIT configuration.\n\
    \n --global user.name : \"\\[name\\]\"\n\nSets the user name you want to use to\
    \ commit your transactions.\n\n --global user.email : \"\\[email address\\]\"\n\
    \nSets the email address you want to use to commit your transactions.\n\n --global\
    \ color.ui auto\n\nEnables colorization of the command line output.\n\n \n\n**Cloning\
    \ a remote repository (created or forked on GitHub)** git clone \\[ path |\n\n\
    URL\\]\n\nClones (i.e. copies or downloads) a remote repository to your local\n\
    \nmachine into a directory."
  merge: -1
  pgno: 199
- img_proc: true
  md: "**Ex:** git clone \\[https://URL\\_repo\\_to\\_clone\\]\n\ngit remote -v\n\n\
    Displays the handles for a remote repository.\n\ngit remote show \\[ handle\\\
    _name \\]\n\nInspect the details about a remote repository.\n\n \n\n**Manage (Committing/Tracking/Pushing)\
    \ Changes** git add \\[ file\\_name | \\* \\]\n\nAdding new or modified into repository\
    \ to be stage before committing\n\nthem.\n\ngit commit -m \"message\"\n\nCommits\
    \ all changes that have been staged, and adds a message.\n\ngit push origin master\n\
    \nPushes all the committed changes to the master branch of origin.\n\ngit reset\
    \ \\[ file\\_name \\]\n\nUnstages a file, and preserves its contents.\n\ngit checkout\
    \ \\[ branch\\_name \\]\n\nSwitches the branch, and updates working directory.\n\
    \n \n\n**Fetching/Merging Repositories**\n\n \n\ngit fetch origin\n\nTo reset\
    \ (delete all changes) to your whole repository, with a fresh copy.\n\ngit merge\
    \ master\n\nFrom the working directory to fetch and merge remote changes.\n\n\
    \ \n\n**Checking the Status of the Repository** git diff\n\nDisplays the diff\
    \ for files that are modified but have not been staged.\n\n --staged"
  merge: -1
  pgno: 200
- img_proc: true
  md: "Shows the diff for files that are staged but not committed.\n\ngit status\n\
    \nShows which files have been modified and/or staged since the last\n\ncommit.\n\
    \n \n\n**Managing Branches**\n\n \n\ngit branch\n\nDisplays a lists of all local\
    \ branches in the current repository.\n\ngit branch -d \\[ branch\\_name \\]\n\
    \nDeletes a branch in the current repository.\n\ngit branch \\[ branch\\_name\
    \ \\]\n\nCreates a new branch in the current repository.\n\ngit checkout \\[ branch\\\
    _name \\]\n\nSwitches branches and updates the working directory.\n\ngit merge\
    \ \\[ branch\\_name \\]\n\nMerges specific branch history into the current branch.\n\
    \n \n\n**Removing, deleting, and reverting files** git rm \\[ file\\_name \\]\n\
    \nDeletes a file from the local storage, then stages its deletion.\n\n --cached\
    \ \\[ file\\_name \\]\n\nStops tracking of a file, then stages its deletion (but\
    \ does not delete\n\nit from the local storage) git mv \\[ old\\_file\\_name \\\
    ] \\[ new\\_file\\_name \\]\n\nRenames the file on disk, then stages the deletion\
    \ of the old name and\n\naddition of the new name.\n\ngit checkout -- \\[ file\\\
    _name \\]\n\nReverts a modified file on local storage back to the last committed\n\
    \nversion."
  merge: -1
