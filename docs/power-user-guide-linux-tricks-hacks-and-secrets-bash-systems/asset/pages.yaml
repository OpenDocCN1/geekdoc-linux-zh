  md: "NFS (Network File System)\n\n \n\nIn Linux you can share files with other computers\
    \ over the network using a\n\nservice called NFS (Network File System). This service\
    \ allows remote operating\n\nsystems, to mount a directory over the network to\
    \ move files around between\n\nsystems and devices.\n\nNFS is mostly used for\
    \ Linux systems, where Samba the service uses the SMB\n\nprotocol which is used\
    \ by Microsoft Windows computers for sharing files. The\n\nMacintosh OSX and higher\
    \ have native support for NFS. While Windows 7\n\noffers basic support for this\
    \ service, Windows 10 has better builtin support (this\n\ncan vary depending on\
    \ the edition that you’re running).\n\nTo install NFS, you have to install the\
    \ client and service separately. This allows\n\nyou to install the client or service\
    \ without having to install the other if you don’t\n\nneed it.\n\n**Installing/Configuring\
    \ the NFS Service** In order to host NFS shares on a\n\ndevice you will need the\
    \ client installed to make them available to remote\n\ndevices. To install the\
    \ NFS service on your local system to make files available\n\nto devices or computers.\n\
    \n \n\nThe first thing you need to do is check if the NFS service is already\n\
    \ninstalled and running on your system, type: dpkg -l | grep nfs-kernel-server\n\
    \n \n\nIf this service is not already installed, type: sudo apt-get install nfs-kernel-\n\
    \nserver\n\n\\-OR-sudo yum install nfs-utils\n\n \n\n**Setting NFS Directory**\n\
    \n \n\nIt is important to note that Root (superuser) permissions are ignored by\
    \ NFS by\n\ndefault. So even if you’re logged in with root permission, any related\
    \ actions\n\nwith those permissions will be ignored by default. This is a security\
    \ measure to"
  merge: -1
  pgno: 180
- img_proc: true
  md: "prevent a remote takeover of the system. Although if needed, it is possible\
    \ to\n\ngrant root permissions on a per share basis.\n\n \n\nFirst you have to\
    \ create a mount point for the NFS shares that you're going\n\nto mount, type:\
    \ sudo mkdir -p *var*nfs/myshare .\n\n \n\nIt’s important to note, that these\
    \ directories *var*nfs and *var*nfs/myshare\n\nwill have 777 permissions, type:\
    \ sudo chmod -R 777 *var*nfs/myshare\n\n \n\nAs a security measure, NFS will translate\
    \ all root operations as to the\n\nclient as the nobody:nogroup credentials. Therefore,\
    \ it may be necessary\n\nto change the directory ownership to match the credentials.\
    \ To do this,\n\ntype: sudo chown nobody:nogroup *var*nfs/myshare To configure\
    \ file\n\npermissions on the share, you need to add them to the *etc*exports file.\
    \ You\n\nwill need to create a line for each directory that you want to share.\
    \ For\n\nexample: *var*nfs/myshare 192.168.0.100(rw,sync,no\\_subtree\\_check)\n\
    \n**Notes:** *The file comment in the* *etcexports file show the general syntax\
    \ for each*\n\n*line, which looks like:* *share\\_directory client\\_ip\\_address(share\\\
    _option1, …*\n\n*,share\\_optionN)* *rw : Grants the client computer both read\
    \ and write access to*\n\n*the share.*\n\n*sync : This option forces NFS to write\
    \ changes to local storage before replying.*\n\n*no\\_subtree\\_check : This option\
    \ prevents subtree checking, which has some*\n\n*mild security implications. Although,\
    \ it can improve reliability in some*\n\n*circumstances.*\n\n*no\\_root\\_squash\
    \ : By default, NFS translates requests from a root user remotely*\n\n*into a\
    \ non-privileged user on the server. This option disables this behavior for*\n\
    \n*certain shares.*\n\n \n\nAfter you modified the *etcexports* file, you have\
    \ to restart the NFS service\n\nfor the changes to take effect, type: sudo service\
    \ nfs-kernel-server restart\n\n \n\n**Setting up Firewall for NFS**"
  merge: -1
  pgno: 181
- img_proc: true
  md: " \n\nIf a firewall is running on the host machine, and in most cases it generally\
    \ will.\n\nYou will need to open up specific ports on the firewall to make the\
    \ NFS service\n\navailable to remote systems.\n\n \n\n**Note:** *This section\
    \ assumes you have the UFW utility installed on*\n\n*your computer for managing\
    \ the firewall. For more information*\n\n*about the UFW utility, see the following\
    \ section \"**Making*\n\n*IPTABLES easier**\"*\n\n \n\nThe first thing you want\
    \ to do is check the status of your firewall, type:\n\nsudo ufw status\n\n \n\n\
    **Note:** *If the firewall is not enabled, it is recommended that you*\n\n*enable\
    \ this feature.*\n\n \n\nTo see what applications are enabled in the firewall,\
    \ type: sudo ufw app\n\nlist\n\n \n\n**Note:** *The UFW utility will check the\
    \ etcservices* *for the port and*\n\n*protocol a service uses.*\n\n \n\nTo add\
    \ the port to the firewall, type:\n\nsudo ufw allow from any to any port nfs\n\
    \n \n\nIt is important to note, that NFS best practice recommends restricting\
    \ the\n\nconnection to a specific client, type: sudo ufw allow from **192.168.0.100**\
    \ to any\n\nport nfs **Installing/Configuring the NFS Client** In order to access\
    \ and manage\n\nan NFS connection you need to have the NFS client installed. It\
    \ is possible to\n\ninstall the client by itself without the related NFS services."
  merge: -1
  pgno: 182
- img_proc: true
  md: " \n\nTo install the NFS client, type:\n\nsudo apt-get install nfs-common\n\n\
    \\-OR-sudo yum install nfs-utils Next you have to create directories\n\nthat will\
    \ be NFS mount points for the client, type: sudo mkdir -p\n\n*var*nfs/remoteshare\n\
    \n \n\nTo issue NFS mount command to access a remote share, type: sudo mount\n\
    \n**192.169.0.100:*****var*****nfs/myshare *****var*****nfs/remoteshare** To automatically\n\
    \nmount an NFS share every reboot, you need to add a line the *etc*fstab , for\n\
    \nexample: **192.169.0.100:*****var*****nfs/myshare** ***var*****nfs/remoteshare**\
    \ nfs auto 0 0\n\n \n\nTo display all the attached NFS mount points, type: mount\n\
    \n\\-OR—\n\ndf -h\n\n**Locking down the NFS Service (optional)** To lockdown the\
    \ NFS service to\n\nonly be accessed by remote servers that you want to grant\
    \ access. You need to\n\ntell the system to only accept connections from approved\
    \ remote devices. This is\n\na multi-step process, first you have to tell the\
    \ system to block all connections,\n\nexcept those that have been approved.\n\n\
    \ \n\nTo block all unapproved client connections to the NFS service. Open the\n\
    \n*etc*hosts.deny file, then add the following line: rpcbind mountd nfsd statd\n\
    \nlockd rquotad : ALL\n\n \n\nTo grant a system or device permission to connection\
    \ to the service, add\n\nthe IP address(es) to the following file. Open the *etc*hosts.allow\
    \ file, then\n\nadd the following line: rpcbind mountd nfsd statd lockd rquotad\
    \ :\n\n**approved\\_IP\\_address\\_list** After you modified the permission files,\
    \ you\n\nhave to restart the NFS service for the changes to take effect, type:\
    \ sudo\n\nservice nfs-kernel-server restart"
  merge: -1
  pgno: 183
