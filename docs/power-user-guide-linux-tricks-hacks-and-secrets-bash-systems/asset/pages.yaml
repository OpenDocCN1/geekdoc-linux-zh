  md: "Managing the Syslog\n\n \n\nWhen the system or applications need to write events\
    \ (i.e. warnings, alerts,\n\ninformation, etc.), it writes them into the system\
    \ log (aka syslog).\n\n \n\nTo check the contents of the syslog, type:\n\nless\
    \ *var*log/syslog\n\n \n\n**Note:** *There are other system related log files\
    \ in the* *varlog/*\n\n*directory. To see all of them type:* *ls -l varlog/\\\
    *.log*\n\n \n\nTo find out where the syslog is located, type: less *etc*syslog.conf\n\
    \n \n\nTo send a message into syslogd, type:\n\necho **HelloWorld** | logger\n\
    \n**Note:** *It is possible that* *etcsyslog.conf file is really named etcrsyslog.conf*\n\
    \n*depending on the distro.*\n\n \n\n**Monitoring log files**\n\n \n\nLinux provides\
    \ several different tools for searching and displaying your log files.\n\nThe\
    \ ones I am covering next are just the basic ones. Although, they might be the\n\
    \nones that you use the most often.\n\n \n\nTo see the last few lines, type:\n\
    \ntail ***var*****log/syslog** To continuously displays the latest changes to\
    \ a log file,\n\ntype: tail -f ***var*****log/syslog**\n\n**Tip:** *To see the\
    \ top of the log file, type:* *head ****varlog/syslog***"
