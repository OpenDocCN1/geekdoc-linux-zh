  md: " \n\n**Case Statement**\n\n \n\nIn Bash the Case statement is another form\
    \ of conditional branching that utilizes\n\nrelational operators to test if a\
    \ condition(s) have been met. The command will\n\nthen execute code if a depending\
    \ if the condition was true or false.\n\nThe logic of the case statement is similar\
    \ to an If - Then - Else statement, but its\n\nsimpler and easier to read.\n\n\
    \ \n\nExample:\n\n*case $Variable in*\n\nPattern\\_1)\n\nCOMMANDS...\n\n;;\n\n\
    Pattern\\_2)\n\nCOMMANDS...\n\n;;\n\n*esac*\n\n \n\nHere is a basic example of\
    \ what a case statement looks like: var=test2\n\n\\# Case statement example\n\n\
    case $var in\n\n\\# Pattern 1\n\ntest1)\n\necho 'test #1'\n\n;;\n\n\\# Pattern\
    \ 2\n\ntest2)\n\necho 'test #2'"
  merge: -1
  pgno: 137
