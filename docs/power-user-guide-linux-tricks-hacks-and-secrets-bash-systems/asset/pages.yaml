  md: "Introduction to the Console\n\n \n\n**Overview:** The first thing you have\
    \ to learn is how to start up the Linux\n\nterminal. On each device this procedure\
    \ can vary a little depending on the Linux\n\ndistro that you are using and how\
    \ you have it configured.\n\n \n\nIf you're running one of many of the Linux distros\
    \ that boots into the command\n\nline, then there are no problems you can start\
    \ running commands right away. If\n\nyou're using version Linux where the GUI\
    \ starts up first, just launch the terminal\n\n(or console).\n\n \n\n![](img/0f524874379aa171ff08f51cdf3cfa83_34_0.png)\n\
