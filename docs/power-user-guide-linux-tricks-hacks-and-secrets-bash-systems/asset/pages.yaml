  md: "Making IPTABLES easier\n\n \n\nThere are several utilities available that can\
    \ make iptables a little easier to\n\nmanage. For example, Ubuntu comes with the\
    \ ufw command. ufw , or\n\nUncomplicated Firewall, is a front-end for iptables\
    \ . The main goal of this utility\n\nto make managing the firewall easier by providing\
    \ a simpler interface.\n\n \n\nCheck the status of the firewall, type:\n\nsudo\
    \ ufw status\n\n \n\nEnable/disable the firewall, type:\n\nsudo ufw \\[ enable\
    \ | disable \\]\n\n \n\nAdd a firewall rule, type:\n\nsudo ufw allow \\[ 22/tcp\
    \ | ssh/tcp \\]\n\n \n\nTo delete a firewall rule, type:\n\nsudo ufw delete deny\
    \ 443/tcp\n\n \n\nEnable/disable firewall logging, type:\n\nsudo ufw logging \\\
    [ on | off \\]"
  merge: -1
  pgno: 263
