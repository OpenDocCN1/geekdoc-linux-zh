  md: "Installing Docker (Containerization)\n\n \n\n**Overview:** Docker is a technology\
    \ for managing processes that are run in\n\nDocker containers. Docker Containers\
    \ run applications in resource-isolated\n\nprocesses. The technology is similar\
    \ to virtual machines (VMs), but Docker\n\ncontainers are more portable, more\
    \ resource-friendly, and dependent on the host\n\noperating system.\n\n \n\nDocker\
    \ and virtual machine technology offer process resource-isolation. Unlike\n\n\
    Docker, VMs run independently of the host operating system. Each VM has to\n\n\
    maintain a complete copy of the OS and related dependencies, and applications.\n\
    \nSo VMs require more system resources in order to execute.\n\n \n\n**Prerequisites:**\
    \ *This section requires that you have:* - *A system with*\n\n*reasonable amount\
    \ of resources (i.e. 2 CPUs, 8GB RAM and 50GB*\n\n*storage, 1 NIC)* - *An updated/patched\
    \ Linux Distro.*\n\n\\- *Root permissions on the system to install services and\
    \ make*\n\n*changes to the system* - *An account on the Docker Hub web*\n\n*site\
    \ (**https://hub.docker.com/**). If you don't already have an*\n\n*account, you\
    \ should login now and create one.*"
  merge: -1
  pgno: 220
- img_proc: true
  md: "Docker vs. Hypervisor Infrastructure\n\n \n\nIn a Docker infrastructure, you\
    \ only need one copy of the OS (per server). All\n\nthe containers only contain\
    \ the dependencies (i.e. libraries, executables, etc.) and\n\nthe code that is\
    \ needed for it to run the service it provides. It is very scalable, and\n\nefficient,\
    \ but does have a downside of having to rewrite existing code to utilize\n\nit.\
    \ One of the main benefits of the technology is that it allows your services to\n\
    \nscale (up or down) very quickly.\n\n \n\n**Docker Overview** (more optimized\
    \ use of system resources) Layer 4:\n\n**Docker** **Containers** (A \"running\
    \ copy\" of a Docker Image) *\\[Multiple*\n\n*Docker Containers can run in the\
    \ systems memory\\]*\n\nLayer 3: **Docker** **Images** (holds the\n\nPrograms/Services/Libraries/Data)\
    \ *\\[Popular Docker Images are*\n\n*maintained on the Docker Hub\\]*\n\nLayer\
    \ 2: **Docker Service** Layer 1: **Host OS** (i.e. Kernel, Libraries,\n\netc.)\
    \ Layer 0: **Infrastructure** (i.e. Hardware, VM, Cloud, IoT, etc.)\n\nIn a Hypervisor\
    \ infrastructure, every VM has its own copy of the\n\nOS, and related dependencies.\
    \ This allows for traditional code\n\nwriting or the running of legacy code, but\
    \ it lacks the resource\n\nefficiency and scalability of Docker. You also need\
    \ to maintain\n\npatches on each VM independently.\n\n \n\n**Hypervisor Overview**\
    \ (great for Legacy applications) Layer 4:\n\n**Applications/Services/Data** Layer\
    \ 3: **Virtual Machines **(w/OS\n\n\\[Windows, Linux\\]) *\\[Multiple virtual\
    \ machines can run in the systems*\n\n*memory\\]*\n\nLayer 2: **Host OS** (i.e.\
    \ Windows, Linux) Layer 1: **Hypervisor **(i.e.\n\nVMWare, Hyper-V, Xen) Layer\
    \ 0: **Infrastructure** (i.e. Hardware,\n\nVM, Cloud, IoT, etc.) Docker containers\
    \ are built from Docker\n\nimages. By default, images are pulled from the Docker\
    \ Hub\n\n(https://hub.docker.com). The Docker Hub is the Docker registry\n\nmanaged\
    \ by the company that owns the technology. Anyone can\n\nhost their images on\
    \ the Docker Hub, so the most popular"
  merge: -1
  pgno: 221
- img_proc: true
  md: "applications and Linux distributions will already have images hosted\n\nthere.\n\
    \n \n\n**Note:** *There could be variations with the install procedure*\n\n*depending\
    \ on the distro you're using. If you have problems, please*\n\n*look up specific\
    \ guides that maybe available for your version of the*\n\n*distro you're running\
    \ on your system.*\n\n \n\nTo understand the importance of Docker, it helps to\
    \ understand a very basic\n\nprogramming concept called a 'function'. In traditional\
    \ programming functions\n\nallow a programmer to write reusable blocks of code\
    \ that can be repeatedly used\n\nas many times as they are needed. Functions are\
    \ only limited by the capabilities\n\nof the programming language and the programmer's\
    \ imagination.\n\nA Docker container is similar to a function, in respects that\
    \ it contains reusable\n\ncode that can be repeatedly used as many times as they\
    \ are needed. When using\n\nthe Docker technology, a developer can create a program\
    \ that is very scalable.\n\nInstead of writing a large monolithic program, they\
    \ can break up their code into\n\nDocker containers.\n\nWhen the developer needs\
    \ to scale the system resources up or down all they\n\nhave to do is start or\
    \ stop containers based on the images that contain the code\n\nthat they need.\
    \ This is an over simplified explanation of the technology, but\n\nhopefully you\
    \ will see the power of it.\n\nYou can literally start or stop a Docker container\
    \ in microseconds, verses\n\nspinning up a VM which can take several seconds to\
    \ a few minutes. The Docker\n\ncontainers also have the advantage of a smaller\
    \ system resource footprint,\n\nbecause they don't have their own independent\
    \ operating system.\n\nThis chapter only covers Docker at a very high-level, it\
    \ should be good enough\n\nto get you started understanding what it does. Although,\
    \ it really doesn't provide\n\nanything more than a quick introduction to the\
    \ technology, and how to do basic\n\nadministration of it."
  merge: -1
  pgno: 222
- img_proc: true
  md: "Installing Docker from official Docker repository\n\n \n\nYou can use your\
    \ distros builtin repositories for Docker, but they might not\n\nalways have the\
    \ latest version available. To get the latest version of Docker you\n\nneed to\
    \ point your package manager to use the official repositories.\n\n \n\nTo update\
    \ your package manager repository information, type: sudo apt-\n\nget update\n\
    \n \n\nMake sure your apt package manager has the prerequisites to use HTTPS\n\
    \ndownload, type: sudo apt-get install apt-transport-https ca-certificates curl\n\
    \nsoftware-properties-common Add the official Docker repository GPG key\n\nto\
    \ the apt package manager, type: curl -fsSL\n\nhttps://download.docker.com/linux/ubuntu/gpg\
    \ | sudo apt-key add -\n\n \n\nAdd the Docker repository to the apt sources, type:\
    \ sudo add-apt-\n\nrepository \"deb \\[arch=amd64\\] https://download.docker.com/linux/ubuntu\n\
    \nbionic stable\"\n\n \n\nUpdate the apt package database with the Docker packages,\
    \ type: sudo\n\napt-get update\n\n \n\nMake sure you're installing Docker from\
    \ the correct apt repository, and\n\nnot the default, type: apt-cache policy docker-ce\n\
    \n \n\nYou should see the following message to tell you that the installation\n\
    \npackage is from the Docker repository:"
  merge: -1
  pgno: 223
- img_proc: true
  md: "![](img/0f524874379aa171ff08f51cdf3cfa83_224_0.png)\n\n \n\nInstalling the\
    \ Docker service, type\n\nsudo apt-get install docker-ce\n\n \n\nCheck to make\
    \ sure the Docker service is running, type sudo systemctl\n\nstatus docker\n\n\
    \ \n\nYou should see the following message to tell you that the service is\n\n\
    running: ... Active: active (running) ...\n\n \n\n**Notes:** *When installing\
    \ Docker, you get the Docker service*\n\n*(daemon) and* *docker* *command line\
    \ utility. The* *docker* *command*\n\n*line utility is how you interact with the\
    \ service, images and the*\n\n*containers.*\n\n*The docker* *command has to be\
