  md: "Core Linux philosophies\n\n \n\nAs stated earlier, every distro seems to do\
    \ things slightly different and in their\n\nown way/style of doing things. Although,\
    \ there are some general philosophies\n\nand principles that most versions of\
    \ Linux follow, that are outline below.\n\n \n\nAt the core of Linux is the kernel,\
    \ it controls all the lower level functions\n\n(for example, communication between\
    \ the application and the hardware).\n\nThe kernel was originally designed by\
    \ Linus Torvalds, and still\n\nmaintained by him and an army of other people (https://www.kernel.org/).\n\
    \nThe Linux kernel is shared by all of the distributions.\n\n \n\nThere are three\
    \ main distributions, almost all of the available distros are\n\nbased on one\
    \ of these versions of the Linux operating system.\n\n \n\n**Debian** is a distribution\
    \ that emphasizes free software. It supports\n\nmany hardware platforms.\n\n \n\
    \n**Red Hat** Linux was one of the original major distributions that was\n\ndivided\
    \ into commercial and community-supported distributions.\n\nThe community-supported\
    \ Red Hat Linux sponsored distribution\n\nnamed Fedora, and the commercially supported\
    \ distribution called\n\nRed Hat Enterprise Linux.\n\n \n\n**Slackware** is a\
    \ highly customizable distribution that stresses ease of\n\nmaintenance and reliability\
    \ over cutting-edge software and\n\nautomated tools. Generally considered a distribution\
    \ for advanced\n\nusers.\n\n \n\nSince Linux was originally based on UNIX it used\
    \ to use \"runlevels\",\n\nwhich are the operational levels that describe the\
    \ state of the system with\n\nrespect to what services are available. For example,\
    \ if the system is using"
  merge: -1
  pgno: 24
- img_proc: true
  md: "a runlevel of 1, then it is in single user mode. You would commonly be in\n\
