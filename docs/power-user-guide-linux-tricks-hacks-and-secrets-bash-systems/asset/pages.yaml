  md: "Package Management\n\n \n\nOne of the many ways to install new or remove old\
    \ programs, including\n\nupdating them, is by utilizing the package manager that\
    \ comes with your Distro.\n\nThe package manager takes care of finding and downloading\
    \ all the necessary\n\nlibraries and removing the dependencies that are no longer\
    \ needed. It then\n\ninstalls the program on the local system.\n\nThere are three\
    \ very popular package managers, but only two are covered in this\n\nbook: apt\
    \ : Debian family package management utility, and utilizes the DPKG\n\n(Debian\
    \ Package) files.\n\n \n\n**Note:** *The* *apt utility is intended as a simplified\
    \ version of the*\n\n*traditional* *apt-get tools. Although, it is not intended\
    \ as a complete*\n\n*replacement of these programs. So, if you are using package*\n\
    \n*management commands inside a script or a shell pipeline, use the*\n\n*apt-get\
    \ and apt-cache .*\n\n \n\nyum : Fedora family package management utility, and\
    \ utilizes the RPM\n\nfiles.\n\n \n\nzipper : SUSE family package management utility,\
    \ and utilizes the RPM\n\n(Red Hat Package Manager) files.\n\n \n\n**Basic management\
    \ commands**\n\n \n\nDisplays a list of all packages installed on your system,\
    \ type: dpkg -l\n\n \n\n**Tip:** *For Fedora systems, type :* *sudo yum list installed*\n\
    \n \n\nTo search for a specific package that in apt cache, type : sudo apt-cache"
  merge: -1
  pgno: 169
- img_proc: true
  md: "search **zip** To get detailed information for a specific package that in apt\n\
    \ncache, type : sudo apt-cache show **zip**\n\n**Note:** *Red Hat equivalent to\
    \ these commands, type:* *sudo* *yum search ****zip*** *sudo*\n\n*yum info ****zip***\n\
    \n \n\nUpdating the System\n\n \n\napt (Advanced Package Tool) and yum (Yellow\
    \ dog Updater Modified) are\n\ncommand line utilities for interacting with the\
    \ package management systems.\n\napt sits on top of the dpkg subsystem. While,\
    \ yum sits on top of the RPM\n\nsubsystem.\n\nBoth the apt and yum utilities provide\
    \ a more friendly way to handle\n\npackaging subsystems. They allow you to find\
    \ and install new packages,\n\nupgrade existing packages, clean up the package\
    \ cache, *etc.*\n\n \n\napt-get : Debian family of package managers, based on\
    \ DPKG files apt-get\n\nupdate : Updates the repository information.\n\napt-get\
    \ upgrade : Downloads and install applications/library\n\nupdates.\n\napt-get\
    \ dist-upgrade : Downloads and upgrades the distribution.\n\n \n\nyum : Fedora\
    \ family of package managers, based on RPM files yum\n\nupdate : Updates the repository\
    \ information.\n\nyum upgrade : Downloads and install applications/library updates.\n\
    \n \n\nCleaning Up the Local Storage Space\n\n \n\nOccasionally you will have\
    \ to free up local storage space on your Linux\n\nmachine. Before you randomly\
    \ start to delete stuff, there are a few commands\n\nyou can try to free up local\
    \ storage space."
