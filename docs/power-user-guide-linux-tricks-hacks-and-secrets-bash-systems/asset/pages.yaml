    \ -OR-\n\nsudo apt-get install **package\\_name** (On Debian based systems)\n\n\
    **Note:** *There are several different methods for installing new programs. Using\
    \ a*\n\n*package manager just makes the install of new utilities or programs easier.*\n\
    \n*Other installation methods could include downloading a repository from Git*\n\
    \n*and compiling it, while other programs may require even a different method.*\n\
    \n \n\nLinux is **case sensitive** in reference to commands, options, file paths,\
    \ *etc.*\n\nIf you’re used to an operating system like Windows before, this will\
    \ be\n\none of the first things that you have to get used to. In all Linux filesystem\n\
