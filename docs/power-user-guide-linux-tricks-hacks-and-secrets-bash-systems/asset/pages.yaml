  md: "/PROC Virtual Files\n\n \n\nThe /proc directory is a virtual filesystem that\
    \ provides information about the\n\nprocesses, filesystem, kernel and more. This\
    \ is very useful for profiling the\n\nsystem or for troubleshooting purposes.\n\
    \nAll you have to do is cat the information, for example: cat *proc*filesystems\
    \ . To\n\nsee a complete list of everything that is made available by your OS,\
    \ type: tree\n\n/proc | less\n\n \n\nBelow are a few examples that you can check\
    \ out to see what information is\n\navailable for you to access. This information\
    \ is very technical, so depending on\n\nyour depth of knowledge on a particular\
    \ technology will determine your ability\n\nto understand it.\n\n \n\nDisplays\
    \ CPU related information, type:\n\ncat *proc*cpuinfo Shows information regarding\
    \ filesystems that are\n\ncurrently in use, type: cat *proc*filesystems Displays\
    \ the interrupts that are\n\ncurrently being used, type: cat *proc*interrupts\
    \ Lists of the I/O addresses\n\nused by devices connected to the server, type:\
    \ cat *proc*ioports Displays\n\nthe memory usage information for both physical\
    \ memory and swap cat\n\n*proc*meminfo Lists currently loaded kernel modules,\
    \ type:\n\ncat *proc*modules Shows currently mounted filesystems, type:\n\ncat\
    \ *proc*mounts Displays various statistics about the system, type: cat\n\n*proc*stat\
    \ Shows the swap file utilization information, type: cat *proc*swaps\n\nLists\
    \ Linux version information, type:\n\ncat *proc*version"
  merge: -1
  pgno: 190
