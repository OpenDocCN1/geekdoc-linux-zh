  md: "Managing Docker Images and Containers\n\n \n\nWhen you have several Docker\
    \ containers running in memory. You need to\n\nunderstand the basic administration\
    \ commands needed to manage them (i.e.\n\nstarting, stopping, etc.).\n\n \n\n\
    To display active (running) containers on your system, type: docker ps\n\n \n\n\
    To display active (running) and inactive containers on your system, type:\n\n\
    docker ps -a\n\n \n\nTo start the Docker container (i.e. with the Ubuntu image\
    \ that was\n\ndownloaded earlier) use the container id of the image you want to\
    \ start,\n\ntype: docker start **d57e5d79b88d**\n\n**Note:** *The container ID\
    \ and names will constantly change as you start and stop*\n\n*these processes.\
    \ These are only included as an example of what the complete*\n\n*command looks\
    \ like.*\n\n \n\nTo stop a Docker container use the container id, or the assigned\
    \ name (see\n\nthe output of the ps ) of the image you want to stop, type: docker\
    \ stop\n\n**happy\\_villani** After you no longer need a container you can delete\
    \ it, type\n\ndocker rm **happy\\_villani**\n\n**Note:** *It is possible to override\
    \ any of the options like the automatic name*\n\n*creation. All you have to do\
    \ is add the correct switches (i.e.* *\\--name ) to the*\n\n*commands to create\
    \ the container.*"
  merge: -1
  pgno: 229
- img_proc: true
  md: "Committing a Docker Image\n\n \n\nAfter you modify a container the way you\
    \ want it, you have to commit the\n\nchanges and create a new Docker image from\
    \ the changes you made to it.\n\nOtherwise if you don't want to keep the changes\
    \ you can delete that container,\n\nand the changes that were made will be lost.\n\
    \n \n\nThis is the syntax for the commit command:\n\ndocker commit -m \"commitment\
    \ message\" -a \"author name\" container\\_id\n\nrepository/new\\_image\\_name\n\
    \n**Note:** *For example,** repository **\\= Docker Hub username (i.e.* *jane2020\
    \ )*\n\n \n\nThis is a full example of the commit command:\n\ndocker commit -m\
    \ \"added apps\" -a \"jane\" d57e5d79b88d\n\njane2020/Ubuntu\\_testapp1\n\n \n\
    \nTo see all the Docker images installed on your local system, type: docker\n\n\
    images\n\n \n\nYou will notice a size difference between the source (or base)\
    \ image you started\n\nwith vs. the new image you just created. The differences\
    \ are the modifications\n\nmade up of the changes (i.e. new repositories, commands,\
    \ etc.) that you added."
  merge: -1
  pgno: 230
- img_proc: true
  md: "Pushing Images to the Docker Repository\n\n \n\nAfter the Docker image has\
    \ been customized to the way that you want it. You\n\ncan then upload these changes\
    \ to the Docker Hub to use on other systems or to\n\nmake them available for others\
    \ to use.\n\n \n\nLog into Docker Hub account, type:\n\ndocker login -u **docker-user\\\
    _name** After you authenticate with your\n\naccount password, you can push your\
    \ own image, type: docker push\n\n**docker-registry-username/docker-image-name**\
    \ For example, to push\n\nthe image to your Docker Hub account, type: docker push\n\
    \n**jane2020/Ubuntu\\_testapp1**\n\n \n\n**Note:** *After pushing the image to\
    \ the Docker Hub repository, the*\n\n*Docker image will be listed on your account's\
    \ dashboard.*\n\n \n\nTo pull the image from the Docker Hub account on another\
    \ computer,\n\ntype: docker pull **jane2020/Ubuntu\\_testapp1**"
