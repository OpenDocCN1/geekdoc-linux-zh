  md: "Anatomy of a command\n\n \n\nAs stated earlier in the book, most commands are\
    \ composed of two or more\n\nelements (i.e.: kill -p 2300 ). They will always\
    \ have a name (i.e.: kill ), and most\n\nwill also have an optional or required\
    \ set of arguments (i.e.: -p ). This example\n\nalso includes values (i.e.: 2300\
    \ ). When this command is executed, it will kill the\n\nprocess id 2300.\n\n \n\
    \n**Tip:** *If you typed a command like,* *echo \"no typozs\" and press Enter,\
    \ it*\n\n*will display no typozs . To correct the problem, type* *^ozs^os and\
    \ press*\n\n*Enter, it will displays* *no typos .*\n\n \n\nSystem commands\n\n\
    \ \n\nThe system commands and utilities listed in this section are for performing\
    \ basic\n\nsystem functions and operations. For example, managing command history,\n\
    \nchecking system process information, and more.\n\nYou will discover that Linux\
    \ has a very robust command history feature, with\n\nlots of shortcuts and tricks\
    \ to make accessing previous used commands.\n\n \n\nTo see a list of previous\
    \ commands you entered, type: history\n\n \n\n**Note:** *The history of commands\
    \ you typed is stored in the file:*\n\n*~/.bash\\_history*\n\nTo execute a specific\
    \ command in the list, type: !**#** (replace **#** with\n\nnumber of the command\
    \ you want to run (ex: !100 )\n\n**Tips:** *If you put a space before a command,\
    \ it will be omitted from the shell*\n\n*history.*"
  merge: -1
  pgno: 53
