  md: "Creating a Procedure\n\n \n\nThe next script can be copied into a script or\
    \ just pasted into the shell. Once a\n\nprocedure is defined, you don’t have to\
    \ define it again, all you have to do is call\n\nit by procedure name. When a\
    \ user calls the procedure by using its name (i.e.\n\nProcedureExample ), they\
    \ can also pass a parameter (i.e. \"This is a test...\" ).\n\nThe next procedure\
    \ displays the parameter or a value passed to it. When\n\nProcedureExample \"\
    This is a test...\" is called, it will display This is a test... on\n\nthe screen.\n\
    \n \n\n#!*bin*bash\n\n\\# Creates the procedure\n\nProcedureExample () {\n\n\\\
    # Outputs the parameter that was passed\n\necho $1\n\n}\n\n\\# Calls the procedure,\
    \ and passes a parameter\n\nProcedureExample \"This is a test...\""
