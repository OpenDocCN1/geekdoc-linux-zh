  md: "Systemd Init (Newer Systems)\n\n \n\nSystemd is a suite of subsystems that\
    \ provides the fundamental building blocks\n\nfor a Linux operating system. The\
    \ name Systemd adheres to the UNIX\n\nconvention of naming daemons by appending\
    \ the letter \"D\" to the end of the\n\nname.\n\nIt is a replacement for the traditional\
    \ UNIX System V and Berkeley Software\n\nDistribution (BSD) init systems (aka\
    \ Runlevels). It features \"System and Service\n\nManager,\" used to initialize\
    \ and bootstrap the user space and to manage system\n\nservices after the boot\
    \ process.\n\nOne of the main goals of the project is unification of basic Linux\
    \ configurations\n\nand service behaviors across all Linux distributions. As of\
    \ 2015, most Linux\n\ndistributions have adopted systemd as their default init\
    \ system.\n\n \n\n**Tip:** *To see a list of all the systemd related commands,\
    \ type:* *man*\n\n*systemd.index*"
  merge: -1
  pgno: 149
- img_proc: true
  md: "Managing Services\n\n \n\nServices (aka daemons) are programs and scripts that\
    \ run in the background, and\n\ndon't require user input. The services can provide\
    \ advanced functionality like\n\nweb server services (such as Apache), or database\
    \ services (such as MySQL)\n\nand a great deal more.\n\nWhen managing services,\
    \ you generally have four operations, Status, Start, Stop,\n\nand Restart. I believe\
    \ all these functions are self-explanatory, so I won’t go into\n\ndetail about\
    \ what they do.\n\nYou can add new or remove old services by utilizing the package\
    \ manager that\n\ncomes with your system. The package manager takes care of all\
    \ the background\n\ntasks of getting the necessary libraries and removing the\
    \ dependencies that are\n\nno longer needed.\n\n \n\nTo see a list of all services\
    \ and their status, type: systemctl\n\n\\-OR—\n\nservice --status-all\n\n \n\n\
    **Note:** The* service* *command is for running System V init script.*\n\n*This\
    \ should be used on systems that still utilize runlevel technology.*\n\n*For newer\
    \ system based systems use* *systemctl.*\n\n \n\n**Tips:** *To display the top\
    \ control groups by their resource usage,*\n\n*type:* *systemd-cgtop* *To display\
    \ a list of services and the ports they*\n\n*are using, type:* *netstat -tulpn*\n\
    \n \n\n**Note:** *Control Groups provide a way of partitioning off system*\n\n\
    *resources for groups of users and/or tasks. For example, control*\n\n*groups\
    \ can set the limits of CPU and memory usage on a shared*\n\n*computer between\
    \ two different sets of users and the programs that*\n\n*they're running.*"
  merge: -1
  pgno: 150
