- img_proc: true
  md: "Key Concepts\n\n \n\nWe have already covered some important topics, such as:\
    \ where are the server\n\nand client. This section deals with the other important\
    \ key concepts, for\n\nexample: repositories, branching, *etc.*\n\n \n\n**Repositories**\n\
    \n \n\nAll the projects in git are stored in what is called a repository. A repository\
    \ is\n\nwhere all the related objects (i.e. images, source code, etc.) that make\
    \ up the\n\nproject are stored. You can access a repository locally or remotely.\n\
    \nA local repository consists of three ‘trees’ that are maintained by git . The\
    \ three\n\ntrees are the Working Directory, Index, and Head.\n\nEach of these\
    \ trees are outlined below.\n\n \n\n**Working Directory**: this is where all the\
    \ actual files are stored. In order to\n\nwork with an existing repository you\
    \ have to create a new one or clone it\n\nlocally on your computer. When you clone\
    \ an existing repository, it makes\n\na full copy of itself that is under your\
    \ control.\n\n \n\nIf you wanted to create a new repository for yourself. The\
    \ first thing\n\nto do is make a directory (i.e. mkdir **directory\\_name**) to\
    \ hold the\n\nrepository. Then you need to switch to that location (i.e. cd\n\n\
    **directory\\_name**), then type: git init (this will create a new hidden\n\n\
    directory called .git that stores the configuration files) To work with\n\na remote\
    \ repository you will have to clone it (basically making a\n\nlocal copy of it).\
    \ Type: git clone\n\n**user\\_name@host:*****path*****to/repository** To work\
    \ with a local copy of\n\na repository, type: git clone ***path*****to/repository**\
    \ **Index**: acts as a\n\nstaging area for the recent changes that you have made\
    \ to the local\n\ncopies of the files. Generally these are saved changes that\
    \ you make\n\nas you are testing your code. If there is a problem you can revert\
    \ to\n\nprevious saved versions of the files."
  merge: -1
  pgno: 193
- img_proc: true
  md: " \n\nTo add files into the Index, you have to ‘propose’ changes by\n\nadding\
    \ them into the Index, type: git add **file\\_name** -OR—\n\ngit add \\*\n\n \n\
    \n**Head**: Holds the latest versions of the commit(s) that you've made to the\n\
    \nfiles in the local repository. When you’re ready to commit all the changes\n\
    \nthat are placed in to the Index, you have to ‘commit’ them to the ‘head’.\n\n\
    After they are committed into the head, they can be merged into the master\n\n\
    repository that is on a remote system.\n\n \n\nTo commit the propose file changes\
    \ into the head, type: git commit -\n\nm **\"Commit message\"**\n\n \n\n**Note:**\
    \ *It is recommended to create tags for each software*\n\n*release. For example,\
    \ type:* *git tag ****1.2.3 1a2b3c4d5e**** (the*\n\n*last part is the first 10\
    \ characters of the commit id, which can*\n\n*be found in the log.*\n\n \n\nGenerally,\
    \ once you have completed making your changes to the files in\n\nyour local repository.\
    \ You will want to send them to the master server so\n\nthat they can be merged\
    \ with the other changes.\n\n \n\nIn order to do this you have to tell git to\
    \ push the changes stored on\n\nyour local system in the ‘head’, to the master\
    \ repository stored on a\n\nremote server, type: git push origin **master** (*Change*\
    \ **master** *to*\n\n*whatever branch you want to push your changes to.*)\n\n\
    **Note:** *If you don’t have an existing cloned remote repository, you have to*\n\
    \n*establish a connection with a remote server you will need to add one. To add\
    \ a*\n\n*remote repository, type:* *git remote add origin ****server\\_address***\n\
    \n \n\n**Branching**"
  merge: -1
