  md: "Updating the system\n\n \n\nIf this is a new installation of Linux or it has\
    \ not been updated in a little while,\n\nyou should make sure it is up-to-date,\
    \ by installing the latest libraries,\n\napplication fixes and security patches.\
    \ From a security perspective this is very\n\nimportant as it can help keep your\
    \ system from getting compromised.\n\nDepending on the distribution you’re using,\
    \ this procedure will vary. The first\n\ncommand in both scenarios gets the information\
    \ about the updates about the\n\nutilities, libraries, *etc.* The second command\
    \ executes the updates.\n\n \n\nFor Debian based distributions, run the following\
    \ commands (requires root\n\npermission): sudo apt-get update\n\nsudo apt-get\
    \ upgrade\n\n \n\nFor Red Hat based distributions, run the following commands\
    \ (requires root\n\npermission): sudo yum update\n\nsudo yum upgrade"
  merge: -1
  pgno: 36
