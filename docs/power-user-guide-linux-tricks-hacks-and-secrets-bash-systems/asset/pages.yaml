  md: "External commands\n\n \n\nAll shells have two types of commands, builtin and\
    \ external. BASH has several\n\nbuiltin commands, meaning that they don't require\
    \ being installed, and they can't\n\nbe uninstalled.\n\nMost external commands,\
    \ have to be installed (or removed) using some type of\n\ninstallation package\
    \ manager like apt-get , yum , *etc.* The commands/utilities\n\nthat are installed\
    \ by default will vary between distros.\n\n \n\nTo get help from any external\
    \ command and see their options, type:\n\ncommand\\_tool --help\n\n\\-ORman command\\\
    _tool .\n\n \n\nFor example, type:\n\nmkdir --help\n\n\\-ORman mkdir.\n\n \n\n\
    **Tips:** *To make it easier to search man pages for what you’re looking for,*\n\
    \n*use the following arguments followed by the command or search string.*\n\n\
    *man -f ****runlevel**** (containing a string in their name)* *man -k ****runlevel***\n\
    \n*(displays a list of the man pages discussing the subject)* *man -a ****runlevel***\n\
    \n*(displays all pages with the given name in all chapters, one after the*\n\n\
    *other.)* *info* *is an alternative system to provide manual (i.e.* *man ) pages*\n\
    \n*for commands. It is provided mainly for GNU commands and utilities.*\n\n*The\
    \ navigation keys are: 'n' for next node, 'p' for previous node, 'u' for up*\n\
    \n*node in index*\n\n \n\nMost commands are composed of two or more elements (i.e.:\
    \ kill -p 2300 ).\n\nThey will always have a name (i.e.: kill ), and most will\
    \ also have an optional or\n\nrequired set of arguments (i.e.: -p ). This example\
    \ also includes values (i.e.:\n\n2300 ). When this command is executed, it will\
    \ kill the process id 2300."
  merge: -1
  pgno: 42
