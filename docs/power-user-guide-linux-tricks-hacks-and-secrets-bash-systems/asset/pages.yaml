  md: "Advanced Fun\n\n \n\nThis section requires more skills and knowledge then some\
    \ of the earlier sections\n\nin this chapter. Although that should not stop you\
    \ from trying these things out if\n\nit is interesting to you.\n\n \n\n**Adding\
    \ New Characters to Cowsay**\n\nThe cowsay command comes with a default set of\
    \ characters (i.e. daemon, tux,\n\netc.) in what are called .COW files. You can\
    \ expand the number of available\n\ncharacters by adding a new set of COW files.\
    \ Follow the instructions to\n\ndownload and install them.\n\n \n\n\\# Change\
    \ to the home directory\n\ncd ~\n\n \n\n\\# Download files from github\n\ngit\
    \ clone https://github.com/paulkaefer/cowsay-files # Move the .COW\n\nfiles to\
    \ correct location\n\nsudo mv ~/cowsay-files/cows/\\*.cow *usr*share/cowsay/cows/\n\
    \n \n\n\\# Display one of the new cows\n\nfortune | cowsay -f dalek\n\n \n\n![](img/0f524874379aa171ff08f51cdf3cfa83_288_0.png)"
  merge: -1
  pgno: 288
- img_proc: true
  md: " \n\n***Tip:*** *To display all the available cowsay characters, type:* *cowsay\
    \ -l*\n\n*| sed '1d;s/ g' | while read f; do cowsay -f $f $f; done*\n\n \n\n**Expanding\
    \ the Fortune Quotes Database (w/ChuckNorris)** It is possible to\n\ncreate a\
    \ custom quotes database that can be utilized by the fortune command.\n\nFirst\
    \ you need to put your quotes into a text file that has every quote separated\n\
    \nby a line with a percent (\"%\") as a delimiter. After that it has to be converted\n\
    \ninto a special binary file that can be used by the fortune command.\n\n \n\n\
    \\# Change to the home directory\n\ncd ~\n\n\\# Download the file from GitHub,\
    \ it should be called chucknorris wget\n\nhttps://raw.githubusercontent.com/robbyrussell/oh-my-\n\
    \nzsh/master/plugins/chucknorris/fortunes/chucknorris # Create a random\n\naccess\
    \ string file used by the fortune command strfile chucknorris\n\n \n\n\\# Copies\
    \ chucknorris, chucknorris.dat files to the fortune directory.\n\nsudo cp chucknorris\\\
    * *usr*share/games/fortunes # Tests the new fortune\n\nchucknorris strings\n\n\
    fortune chucknorris | cowsay\n\n \n\n![](img/0f524874379aa171ff08f51cdf3cfa83_289_0.png)\n\
    \n \n\n**Script: Let It Snow**\n\nThis script needs to be copied into a file and\
    \ made executable to run. Use the"
  merge: -1
  pgno: 289
- img_proc: true
  md: "following commands to make the script file for you, make it executable and\
    \ the\n\nopen it up, type: echo \\\\#\\\\!*bin*bash > snow.sh; chmod u+x snow.sh;\
    \ nano snow.sh\n\nCopy the lines below into the file that was created: #!*bin*bash\n\
    \nLINES=$(tput lines)\n\nCOLUMNS=$(tput cols)\n\ndeclare -A snowflakes\n\ndeclare\
    \ -A lastflakes\n\nclear\n\nfunction move\\_flake() {\n\n i=\"$1\"\n\n if \\[\
    \ \"${snowflakes\\[$i\\]}\" = \"\" \\] || \\[ \"${snowflakes\\[$i\\]}\" = \"$LINES\"\
    \ \\];\n\nthen snowflakes\\[$i\\]=0\n\n else\n\n if \\[ \"${lastflakes\\[$i\\\
    ]}\" != \"\" \\]; then printf \"\\\\033\\[%s;%sH \\\\033\\[1;1H \"\n\n${lastflakes\\\
    [$i\\]} $i fi\n\n fi\n\n printf \"\\\\033\\[%s;%sH\\*\\\\033\\[1;1H\" ${snowflakes\\\
    [$i\\]} $i\n\nlastflakes\\[$i\\]=${snowflakes\\[$i\\]}\n\n snowflakes\\[$i\\]=$((${snowflakes\\\
    [$i\\]}+1))\n\n}\n\nwhile :\n\ndo\n\n i=$(($RANDOM % $COLUMNS))\n\n move\\_flake\
    \ $i\n\n for x in \"${!lastflakes\\[@\\]}\"\n\n do\n\n move\\_flake \"$x\"\n\n\
    \ done\n\n\\# Only use this line to slow it down if too fast.\n\n #sleep 0.1\n\
    \ndone\n\n \n\nTo run the script type:\n\n./snow.sh"
  merge: -1
  pgno: 290
