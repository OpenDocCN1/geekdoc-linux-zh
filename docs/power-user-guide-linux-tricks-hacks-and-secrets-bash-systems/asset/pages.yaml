  md: "Introduction\n\n \n\nLike anything in life, you expect something to work correctly\
    \ the first time you\n\nuse it. You don’t want to have to spend the extra time\
    \ reading the manual trying\n\nto figure out how it operates correctly.\n\nFor\
    \ example, when you buy a car, most people don't care about how advanced\n\nthis\
    \ or that feature is. You just want to put the keys into the ignition and drive\
    \ it\n\nlike you would any other vehicle. Then when you need to know something\n\
    \nspecific, then you go to the manual for that specific information.\n\nThis book\
    \ is not meant to be an in-depth reference of Linux, it is meant to\n\nprovide\
    \ a brief introduction to several Linux commands and utilities, and try to\n\n\
    provide useful examples of how they work. The intent is to demonstrate what\n\n\
    Linux can do for you. Rather than wasting your time giving you lots of boring\n\
    \ndata that you probably won’t care to remember.\n\nIf you need more information\
    \ about something, then you can use the basic\n\nunderstanding that you have,\
    \ and do a deeper investigation of how the command\n\nworks. I have always discovered,\
    \ when I have a basic foundational knowledge of\n\nanything, I will generally\
    \ know where to look for or what questions to ask to get\n\nthe information I\
    \ need. It is when I don't have that foundational knowledge, that\n\nI may not\
    \ know where to start, which makes it a great deal more difficult.\n\nThere is\
    \ a plethora of information out on the web or in other references that will\n\n\
    go into much greater depth on most of the topics in the book then what I will\
    \ be\n\ncovering. Although, most of us don't have the time or interest to read\
    \ those\n\nreferences.\n\nIf you do discover you need more information about a\
    \ command or utility,\n\nplease check out any of the other references (i.e. help\
    \ files, web pages, etc.) that\n\nare available to you so that you can acquire\
    \ more in-depth information.\n\nMy objective in writing this book is to provide\
    \ you the quickest and hopefully\n\nmost enjoyable introduction to Linux. It is\
    \ also meant to help you get started\n\nlearning the OS more quickly by giving\
    \ you a sampler platter of commands that\n\nyou can try and see the results."
  merge: -1
