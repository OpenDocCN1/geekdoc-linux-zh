  md: "Installing the SSH Server\n\n \n\nSecure Shell (SSH) is the default remote\
    \ administration tool for working with\n\nmodern versions of Linux. It provides\
    \ an encrypted communication channel to\n\ncontrol a remote server.\n\nThe SSH\
    \ service supersedes the older Telnet service that provided similar\n\nremote\
    \ administration functionality, all communication was unencrypted.\n\nAnyone on\
    \ the network could see all the data and passwords in plain text if they\n\nwere\
    \ monitoring traffic.\n\nThere are two components to SSH, the service and client.\
    \ The service waits and\n\nallows you to connect to the system to perform remote\
    \ administration. The client\n\nallows you to connect and send commands to the\
    \ remote service.\n\n \n\nTo install and configure the service, follow the next\
    \ instructions.\n\n \n\nIf this service is not already installed, type: sudo apt-get\
    \ install openssh-\n\nserver\n\n \n\n**Tip:** *Check the status of it (if necessary\
    \ change 'status', to 'start' or*\n\n*'restart' if the service is not running),\
    \ type:* *sudo systemctl status*\n\n*ssh* *If the* *ssh service is not running,\
    \ type:* *sudo systemctl enable*\n\n*ssh* *sudo systemctl start ssh*\n\n \n\n\
    Make sure port 22 is enabled on the firewall, type: sudo ufw allow ssh\n\nsudo\
    \ ufw enable\n\nsudo ufw status\n\n \n\n**Note:** *For more information on how\
    \ to utilize the SSH client and*\n\n*SCP (Secure Copy), see the following section\
    \ \"**Remote Console and*\n\n*File Transfer**\"*"
