  md: "Disabling Ctrl+Alt+Delete\n\n \n\nIn most distros, when pressing the Ctrl+Alt+Delete\
    \ keys it will cause the system\n\nto be rebooted. This might not be a desired\
    \ functionality, the following\n\ninstructions discuss how to change this feature.\n\
    \n \n\nRed Hat based: To disable this feature, in the **sudo nano *****etc*****inittab**\
    \ file,\n\nuncomment out the following line under # Trap Ctrl+Alt+Delete .\n\n\
    ca::ctrlaltdel:*sbin*shutdown -t3 -r now -OR—\n\nDebian based: To disable this\
    \ feature, run the following two commands,\n\ntype: sudo systemctl mask Ctrl+alt-del.target\n\
    \nsudo systemctl daemon-reload"
  merge: -1
  pgno: 246
