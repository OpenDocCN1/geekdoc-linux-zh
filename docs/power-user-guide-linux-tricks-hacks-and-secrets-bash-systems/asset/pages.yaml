  md: "User Account Restrictions\n\n \n\n**Manually Disabling an Account**\n\n \n\n\
    There is an ability to manually disable (i.e. lock) or re-enable (i.e. unlock)\
    \ an\n\naccount without having to delete it. This is useful when a user leaves\
    \ for a\n\nvacation or something else, you can disable it instead of deleting\
    \ it.\n\n \n\nIf someone tries to login to the disabled account, they will get\
    \ the\n\nfollowing message, \"*This account is currently not available.*\"\n\n\
    \ \n\nTo lock an account, type:\n\nsudo passwd -l **user\\_name** To unlock an\
    \ account, type:\n\nsudo passwd -u **user\\_name** **Stronger Password Enforcement**\n\
    \n \n\nUsers by default will use a weak password for their account if the system\
    \ will let\n\nthem. This makes it easier for an attacker to compromise your system,\
    \ using\n\nbasic attacks (i.e. dictionary based or brute-force attacks).\n\nThe\
    \ ‘pam\\_cracklib‘ module is available in PAM (Pluggable Authentication\n\nModules)\
    \ that will force a user to utilize a strong passwords.\n\nTo implement this technology,\
    \ follow the instruction below Open a text editor,\n\ntype:\n\nsudo nano *etc*pam.d/system-auth\
    \ .\n\n \n\nAdd the following line using any of the following parameters, such\
    \ as:\n\nlcredit, ucredit, dcredit and/or ocredit respectively lowercase, upper-case,\n\
    \ndigit and others). For example, type: *lib*security/$ISA/pam\\_cracklib.so\n\
    \nretry=3 minlen=8 lcredit=-1 ucredit=-2 dcredit=-2 ocredit=-1\n\n \n\n**Locking\
    \ Down the User Accounts**"
  merge: -1
  pgno: 242
- img_proc: true
  md: " \n\nDisallow users from using old passwords, using the PAM module.\n\n \n\n\
    RHEL *CentOS *Fedora, type:\n\nsudo nano *etc*pam.d/system-auth\n\n\\-OR—\n\n\
    Ubuntu *Debian *Linux Mint, type:\n\nsudo nano *etc*pam.d/common-password\n\n\
    \ \n\nAdd the following line to **auth** section, type: auth sufficient pam\\\
    _unix.so\n\nlikeauth nullok Add the next line to the **password** section (this\
    \ will\n\ndisallow a user from reusing the last 5 passwords), type: password\n\
    \nsufficient pam\\_unix.so nullok use\\_authtok md5 shadow remember=5\n\n \n\n\
    **Note:** *The old password file is located at:* *etcsecurity/opasswd*\n\n \n\n\
    **Manage User Password Expiration**\n\n \n\nIn Linux, user passwords are stored\
    \ in an encrypted *etc*shadow file. To display a\n\nuser’s password expiration\
    \ information, you need to use the chage command. It\n\nwill display the password\
    \ expiration details, and last date the password was\n\nchange. Type: chage -l\
    \ username\n\n \n\nTo change password aging options for any user, use the following\n\
    \ncommand, type: sudo chage -M **90 user\\_name** -OR—\n\nchage -M **90** -m **7**\
    \ -W **5 user\\_name**"
  merge: -1
  pgno: 243
