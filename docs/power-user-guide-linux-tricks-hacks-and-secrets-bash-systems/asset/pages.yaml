  md: " \n\n**Note:** *Regular expressions are case sensitive*\n\n \n\n*HelloWorld*\
    \ Matches lines containing HelloWorld *^HelloWorld$* Matches\n\nlines containing\
    \ HelloWorld only *^\\[a-zA-Z\\]* Matches lines starting with\n\nany letter.\n\
    \n/^\\[a-z\\].\\*/ Matches lines starting with a-z, followed by at least one\n\
    \ncharacter.\n\n*1234$* Matches lines that end with 1234\n\n*\\\\(43|76\\\\)*\
    \ Matches lines contains 43 or 76.\n\n \n\n**Note:** *Use of ( ) and the pipe\
    \ symbol specifies an 'or' condition.*\n\n \n\n/\\[0-9\\]\\*/ Matches zero or\
    \ more numbers in the line *^\\[^#\\]* Matches if the\n\nfirst character is not\
    \ the # on the line **Ranges**\n\n \n\nRanges causes actions to be executed on\
    \ one line or more lines. You have to be\n\nin the command mode to use these features.\
    \ For example, press the ESC key and\n\nthen type :3,7d to delete the lines 3-7.\n\
    \n \n\n:$ Last line :% All lines in file :. Current line :n,m Lines n-m\n\n**Note:**\
    \ *Ranges can be combined with the* *:s command to perform a replacement*\n\n\
