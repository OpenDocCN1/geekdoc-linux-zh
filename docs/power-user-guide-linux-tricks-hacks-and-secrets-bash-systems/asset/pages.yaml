  md: "*To clear the current session history, type:* *history -r*\n\nRe-execute the\
    \ last command you entered, type: !!\n\n \n\nReruns the last command, with root\
    \ permissions, type: sudo !!\n\n \n\n**Tip:** *Repeats the last command until\
    \ it executes successfully, type:*\n\n*until !!; do :; done*\n\n \n\nEcho the\
    \ last command to the terminal, type: !!:p\n\n \n\nFind and execute the last command\
    \ in the search history that matches a\n\nsearch string (i.e. *echo* ), type:\
    \ !?**echo**\n\n**Tip:** *To search and execute the last command that matches\
    \ the string, type:* *!?*\n\n***echo****?:p*\n\n \n\nRe-execute the options from\
    \ the last command, type: !$\n\n \n\nExample: Lists a directory folder, then changes\
    \ the path to it, type:\n\nls /bin (press Enter) cd !$ (press Enter) Inserts the\
    \ last command\n\nwithout the last argument, type: !:-\n\n \n\nPress Ctrl+R to\
    \ reverse search the command history.\n\n \n\n***Note:*** *This only works one\
    \ command at a time, Ctrl+R for the next*\n\n*one (press Ctrl+C to cancel).*\n\
    \n \n\n**Tip:** *Get more information (i.e. date and time) from the history*"
