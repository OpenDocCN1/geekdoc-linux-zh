  md: "different directories.\n\n \n\nAny file that has a .conf file extension generally\
    \ means it is a text file\n\nholding a configuration for an application (i.e.\
    \ *etc*yum.conf ).\n\n \n\nThe available commands, directories, and configuration\
    \ files and locations\n\ncan very between Linux distros. Jokingly, ‘It’s all exactly\
    \ the same, except\n\nfor what is different.’ You might need to research where\
    \ these files are\n\nstored, and what they may be named for different distros.\n\
    \n \n\nLinux makes its components available via files or objects that look like\n\
    \nfiles. Processes, devices, and network sockets are all represented by file-\n\
    \nlike objects, and can often be worked with using the same utilities used for\n\
    \nregular files.\n\n \n\nThe reason why there are some many commands and utilities\
    \ is because of\n\nthe Linux design philosophy. Commands are designed to do one\
    \ function\n\nor operation very well.\n\n \n\nPrograms are commonly stored in\
    \ one of the following paths, /bin ,\n\n*usr*bin , /sbin , *usr*sbin . This can\
    \ change based on the distro and\n\napplication that you’re using.\n\n \n\nBy\
    \ default, all permissions (even if you’re signed in as root) start out\n\nrunning\
    \ under basic user account security (so you can run commands like:\n\nls , cp\
    \ , rm , etc.). A command that needs elevated permissions, requires\n\nthat you\
    \ put the prefix command sudo in front of it (i.e. sudo command -\n\noptions ).\
    \ After you press Enter, you will then be required to type your\n\nadmin password\
    \ and press Enter again.\n\n \n\n**Note:** *The root (super user, aka root) account\
    \ is very powerful and*\n\n*has full access to the system.*"
