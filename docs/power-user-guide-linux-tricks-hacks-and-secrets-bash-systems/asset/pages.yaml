  md: "Managing Users\n\n \n\nOne of the basic functions of any system administrator\
    \ is the managing of users\n\n(adding, modifying and deleting) and groups on the\
    \ local system. The next\n\ncommands will help you get started performing these\
    \ functions.\n\n \n\nDisplays a list of all the users, type:\n\ncat *etc*passwd\n\
    \n \n\n**Tip:** To make the output easier to read, type: cat *etc*passwd |\n\n\
    column -t -s :\n\n \n\nTo add a user to the local system, type:\n\nsudo useradd\
    \ -c \"**Jane Doe**\" -m -s *bin*bash **jane** To modify an existing\n\nuser,\
    \ type:\n\nsudo usermod -u 3000 **Jane** To delete a user, type:\n\nsudo userdel\
    \ --remove-all-files **jane**\n\n**Note:** *The --remove-all-files flag makes\
    \ sure that files created by the user are*\n\n*also deleted.*\n\n \n\nTo create\
    \ a user group, type:\n\nsudo groupadd **app\\_admins** To modify a user group,\
    \ type: sudo\n\ngroupmod -g 300 **app\\_admins** To delete a user group, type:\
    \ sudo\n\ngroupdel **app\\_admins** To change your user password, type:\n\npasswd\n\
    \n \n\nTo change the password of another user, type: sudo passwd **jane**\n\n\
    **Tips:** *To display a user’s account details, type:* *getent passwd jane* *Another*\n\
    \n*alternative to this command, type:* *grep -i jane etcpasswd* *To display a\
    \ user’s*\n\n*group details (real and effective user and group IDs), type:* *id\
    \ jane* *Display all*"
  merge: -1
