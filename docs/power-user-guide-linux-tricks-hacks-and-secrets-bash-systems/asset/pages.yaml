  md: "Variables\n\n \n\nOne of the first things that we need to cover is how to deal\
    \ with variables. They\n\nwere briefly talked about in the other chapters, but\
    \ they will be cover in slightly\n\nmore depth here.\n\nThe variable functionality\
    \ provides a way for the script to get input, store data\n\ntemporarily, and display\
    \ output to the user or sending data to a calling script.\n\nThere are two categories\
    \ that variables can be divided into: **Environment**\n\n**Variables:** are maintained\
    \ by the system, they are inherited by the current and\n\nany child shells or\
    \ processes that are spawned.\n\n \n\n**Shell Variables:** are contained exclusively\
    \ within the shell in which they\n\nwere set or defined. They are mostly used\
    \ to keep track of temporal data,\n\nlike the current working directory in a session.\n\
    \n \n\nShell Variables\n\n \n\nThere are generally two types of shell variables.\
    \ Those that are maintained by\n\nthe system, and the others that are user defined\
    \ for scripts or passing information\n\ninto other commands, scripts or programs.\n\
    \nAs stated earlier, the values in the shell variables can be user defined. Meaning\n\
    \nthat the user is responsible for updating these values.\n\n \n\n**Note:** *Variable\
    \ names are case sensitive, so test, Test, TEST are three*\n\n*different variables.*\n\
    \n \n\n**Examples:**\n\nTo create a custom variable, type:\n\ntest=**HelloWorld**\
    \ To display the contents of a custom variable, type: echo\n\n$test"
  merge: -1
  pgno: 120
