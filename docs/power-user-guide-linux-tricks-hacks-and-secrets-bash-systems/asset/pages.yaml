  md: "Checking Your System for Malware\n\n \n\nEven Linux is not immune to malware,\
    \ ClamAV is one of the most popular anti-\n\nmalware scanners available for the\
    \ OS. It is recommended that you regularly\n\nscan your system for malicious code.\n\
    \nThere are other anti-malware scanner options available to help protect your\n\
    \nsystem, but unfortunately they won’t be covered at this time.\n\n \n\nTo install\
    \ this scanner use one of these methods:\n\n \n\nFor Debian-based systems:\n\n\
    sudo apt-get install clamav\n\n\\-OR—\n\nOn Red Hat-based systems:\n\nsudo yum\
    \ install epel-release\n\nsudo yum install clamav\n\n \n\nTo run the scanner,\
    \ you first need to update it with the latest signatures,\n\ntype: sudo freshclam\n\
    \n \n\nTo scan a specific folder, type:\n\nsudo clamscan -r --bell -i / (*scans\
    \ from the root down*) -OR-sudo clamscan\n\n\\-r --bell -i /home (*scans ****/home****\
    \ directory*)\n\n**Tip:** *To install GUI version (X-Windows) of the client, type:*\
    \ *sudo apt-get*\n\n*install clamtk*\n\n**More information:**\n\nhttps://www.clamav.net/"
  merge: -1
