  md: "Lockdowning Physical Access to the System\n\n \n\nAny production system should\
    \ be in a locked environment, with physical access\n\ncontrol, backup power and\
    \ cooling. If a malicious actor has physical access to\n\nthe equipment, they\
    \ could bypass most system security features.\n\nAlthough, you can still make\
    \ it harder for them. Here are some suggestions:\n\nLockdown the firmware (BIOS/UEFI),\
    \ configure it to disable booting from an\n\noptical disk, or an external device\
    \ (such as a USB flash device). Also make sure\n\nyou enable a firmware password.\n\
    \n \n\n**Note:** *Refer to your computer or motherboard manufacture’s web*\n\n\
    *site for instructions on how to perform these actions.*\n\n \n\nEnable GRUB with\
    \ a password to help restrict access to the local\n\nfilesystem. Encrypt the local\
    \ filesystem, file permissions, data in\n\ndatabases, *etc.*\n\n \n\nEncrypt all\
    \ network communications. This will make it harder for a\n\nmalicious actor from\
    \ sniffing your data while it is in transit Don't use root\n\naccount names, like\
    \ root, admin, or administrator. Get creative with the\n\nusername.\n\n \n\nMake\
    \ sure to use strong passwords for all accounts, and change them on a\n\nregular\
    \ basis."
  merge: -1
  pgno: 238
