  md: "Logical Volume Management\n\n \n\nLogical Volume Management (or LVM) allows\
    \ you to abstract the physical\n\ncharacteristics of several different block storage\
    \ devices, to make them appear as\n\na single larger block device. It is then\
    \ possible to partition the large drive into\n\nsmaller logical volumes.\n\nLVM\
    \ is also utilized to overcome the limitations of traditional storage partitions.\n\
    \nFor example, an LVM volume can be expanded, spanned across multiple\n\ndevices,\
    \ snapshot partitions, and moving volumes around drives.\n\n \n\nMore information,\
    \ type:\n\nman lvm\n\n \n\n**LVM Commands**\n\nThe following commands implement\
    \ the core LVM functionality.\n\n \n\nlvchange : Changes attributes of a Logical\
    \ Volume.\n\nlvconvert : Converts a Logical Volume from linear to mirror or snapshot.\n\
    \nlvcreate : Creates a Logical Volume in an existing Volume Group.\n\nlvdisplay\
    \ : Displays attributes of a Logical Volume.\n\nlvextend : Extends the size of\
    \ a Logical Volume.\n\nlvmchange : Changes attributes of the Logical Volume Manager.\n\
    \nlvmconfig : Displays the configuration information after loading lvm.conf\n\n\
    and any other configuration files.\n\nlvmdiskscan : Scans for all devices visible\
    \ to LVM2.\n\nlvmdump : Creates LVM2 information dumps for diagnostic purposes.\n\
    \nlvreduce : Reduces the size of a Logical Volume.\n\nlvremove : Removes a Logical\
    \ Volume.\n\nlvrename : Renames a Logical Volume."
  merge: -1
  pgno: 271
