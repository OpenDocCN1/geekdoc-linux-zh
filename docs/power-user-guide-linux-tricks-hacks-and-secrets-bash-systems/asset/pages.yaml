  md: "Starting a Docker Container\n\n \n\nI believe it is important to emphasize\
    \ the difference between the Docker image\n\nand container. The Docker image is\
    \ a digital template, and stores all the\n\nresources (i.e. programs, libraries,\
    \ etc.) and data. When you run an image, a copy\n\nof it gets loaded into memory\
    \ and then it becomes a Docker container.\n\n \n\nTo download the official Ubuntu\
    \ image, type:\n\ndocker pull ubuntu\n\n \n\n![](img/0f524874379aa171ff08f51cdf3cfa83_227_0.png)\n\
    \n \n\nTo run a container with the latest image of Ubuntu, type: docker run -it\n\
    \nubuntu\n\n \n\n**Note:** *The* *\\-i and -t switches provide interactive shell\
    \ access into*\n\n*the container.*\n\n*The output will look something like:* *root@d57e5d79b88d:/#*\n\
    \n*d57e5d79b88d is the CONTAIN\\_ID, you will need that later if you*\n\n*want\
    \ to delete it.*\n\n \n\nAny Linux command can be executed (as long as it is installed)\
    \ inside the\n\ncontainer, and all changes will only be made in the container.\
    \ For example, you\n\ncan install Midnight Commander (MC), execute it, and then\
    \ exit the container.\n\n \n\n**Note:** *When inside of the container, you don't\
    \ need to prefix any*\n\n*command with sudo, this is because you're always operating\
    \ as the*"
  merge: -1
