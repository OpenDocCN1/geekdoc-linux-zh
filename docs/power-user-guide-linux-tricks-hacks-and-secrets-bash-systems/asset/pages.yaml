- img_proc: true
  md: " \n\n**Non-Interactive**: A shell session is one that is not attached to a\
    \ terminal\n\nsession, and not currently in use. For example, when you a run script\
    \ from\n\nthe command line run in a non-interactive, non-login shell. Non-\n\n\
    interactive shell sessions first read the environment variable named\n\nBASH\\\
    _ENV , and then reads the file specified in this variable to setup the\n\nnew\
    \ shell environment.\n\n \n\n**Tip:** To force your current shell session to re-read\
    \ the config file, type:\n\nsource ~/.bashrc\n\n \n\n**Notes:** *Individual user\
    \ defined variable (not system wide) that can be*\n\n*made available to both login\
    \ and non-login shell sessions can be define in*\n\n*the* *~/.bashrc* *file.*\n\
    \n*To create system wide environmental variables, you need to add the*\n\n*variable\
    \ definition(s) to one of the following files:* *etcprofile*\n\n*etcbash.bashrc*\
    \ *etcenvironment*\n\n \n\nShell vs. Environment vs. Persistent Variables\n\n\
    \ \n\nIf you look at a hierarchical chart showing the different layers of the\
    \ operating\n\nsystem, with the user layer where you run your commands at the\
    \ top, and\n\nhardware at bottom. This is where you can see the difference between\
    \ shells vs.\n\nenvironment variables.\n\nEnvironment variables are run at a lower\
    \ level, they are available to all shell\n\ninstances. Also since persistent variables\
    \ are loaded from a configuration file at\n\nthe computer or shell startup, they\
    \ can withstand the process being killed or\n\ncomputer being turned off.\n\n\
    \ \n\n**System Layers: Shell/Environment/Persistent Variables** **User Layer**\n\
    \nCommands/Programs (Console)"
