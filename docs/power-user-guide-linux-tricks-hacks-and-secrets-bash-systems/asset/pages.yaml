- img_proc: true
  md: "view the information stored in the logs, type: git log\n\n \n\n**Tips:** *git\
    \ supports a lot of options to format the output of the logs,*\n\n*for example\
    \ type:* *git log --graph --oneline --decorate --all* *(type:*\n\n*git log --help*\
    \ *for more information)* *git also supports a lot of*\n\n*options for searching\
    \ the logs, for example type:* *git log --*\n\n*author=****jim*** *(type: git\
    \ log --help* *for more information)*\n\n \n\n**Reverting a File/Repository**\n\
    \n \n\nSometimes it is necessary to revert or reset a file back to its previous\
    \ state since\n\nit was last committed. These commands help you manage file reversions:\
    \ To\n\nrevert a file back to its previous state since it was last committed to\
    \ a local\n\nrepository, type: git checkout -- **file\\_name**\n\n**Warning:**\
    \ *Use this command carefully, it will destroy data.*\n\n \n\nTo reset (i.e. delete\
    \ all changes, and it is non-reversable) in your local\n\ncopy of the repository.\
    \ Then it will download a fresh copy of the data from\n\nthe master repository,\
    \ type: git fetch origin\n\ngit reset --hard origin/master"
