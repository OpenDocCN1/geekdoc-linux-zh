  md: "Hardening CORNTAB\n\nIf your system is utilizing CRON jobs, it is important\
    \ to lock the access to them\n\ndown. The CRON service allows you to specify who\
    \ may or who you may not\n\nwant to allow them to run jobs.\n\nThis service is\
    \ controlled by the use of two files called *etc*cron.allow and\n\n*etc*cron.deny\
    \ .\n\n \n\nTo prevent a user from being allowed to utilize the CRON service,\
    \ simply\n\nadd the user names in the *etc*cron.deny file.\n\n \n\nTo disable\
    \ all users from being able to use the CRON service, add the\n\nkeyword ‘ALL‘\
    \ line to the *etc*cron.deny file, type: sudo echo ALL\n\n^>>*etc*cron.deny\n\n\
    \ \n\nTo allow a user to run a CRON job add them into *etc*cron.allow file.\n\n\
    \ \n\n**Note:** *It is important to lock down script permissions so that a malicious*\n\
    \n*user can’t replace it and do a privilege elevation attack. This is where*\n\
    \n*they replace a script that runs with a higher level access account to*\n\n\
    *execute a specific action to raise their system permissions.*"
  merge: -1
  pgno: 249
- img_proc: true
  md: "Blocking USB Drives\n\nIt is possible to prevent a user from utilizing a USB\
    \ flash drive on your system.\n\nThis can help protect against someone from installing\
    \ new software or stealing\n\ndata from it.\n\nAlthough, like any security change\
    \ it may seem small, but it is only one\n\nproverbial spoke in the hub of any\
    \ security model.\n\n \n\nUse the lsmod command to display all loaded kernel drivers,\
    \ filter out\n\nUSB storage sudo lsmod | grep usb\\_storage\n\n \n\n**Note:**\
    \ *To verify that the next operation completed successfully, run*\n\n*the previous\
    \ command again that the line isn't there.*\n\n \n\nYou should see that sub\\\
    _storage module is in use by UAS module. You\n\nnow need to unload both USB storage\
    \ modules from kernel.\n\nsudo modprobe -r usb\\_storage\n\nsudo modprobe -r uas\n\
    \n \n\nYou have block USB storage module form loading into kernel after future\n\
    \nreboots. To do this, rename the usb-storage.ko.xz module to usb-\n\nstorage.ko.xz.block\
    \ .\n\ncd *lib*modules/\\`uname -r\\`/kernel/drivers/usb/storage/\n\nsudo mv usb-storage.ko\
    \ usb-storage.ko.block (For Debian based systems)\n\n\\-OR-sudo mv usb-storage.ko.xz\
    \ usb-storage.ko.xz.block (For Red Hat\n\nbased systems)\n\n**Tip:** *To revert\
    \ the functionality on the system back to its original state. All you*\n\n*have\
    \ to do is rename the* *usb-storage.ko file back to its original name (then*\n\
    \n*reboot the system), type:* *cd libmodules/\\`uname -r\\`/kernel/drivers/usb/storage/*\n\
    \n*sudo mv usb-storage.ko usb-storage.ko.block (For Debian based systems)* *\\\
    -*\n\n*OR-sudo mv usb-storage.ko.xz usb-storage.ko.xz.block (For Red Hat based*"
  merge: -1
