  md: "Security Tips (System Lockdown)\n\n \n\n**Overview:** Every day you read about\
    \ how this or that company has been\n\ncompromised by a malicious person or organization.\
    \ One of the main things you\n\ncan do to protect yourself and your business,\
    \ is lockdown the security on your\n\nservers and desktops.\n\n \n\n**Prerequisites:**\
    \ *This section requires that you have root permissions on*\n\n*the system to\
    \ install services and make changes to the OS.*\n\n \n\nThis section covers some\
    \ of the things that you can do to make it harder for \"bad\n\nactors\" (i.e.\
    \ hackers) from compromising your systems. Please note, this section\n\nonly provides\
    \ a high-level overview of some of the options that are available.\n\nYou may\
    \ have to look up how to implement these changes for the distro that\n\nyou’re\
    \ using.\n\n \n\n**Warning:** *Like any type of change, it should never be made\
    \ to a*\n\n*production system, without testing it on a development or pre-production*\n\
    \n*system first. You need to make sure that any of these changes don’t affect*\n\
    \n*your applications operation.*\n\n \n\nMost new installations of any operating\
    \ system are more secure then they use to\n\nbe when doing a default installation.\
    \ Although, if you have an older existing\n\nsystem, it can probably use some\
    \ hardening to make it more secure against an\n\nattack.\n\nThis chapter contains\
    \ a list of suggested security tools and tips for performing\n\ndifferent types\
    \ of system security administration tasks and diagnostics."
  merge: -1
