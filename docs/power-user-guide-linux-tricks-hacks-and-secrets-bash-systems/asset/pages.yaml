  md: "A Quick Guide to Samba\n\n \n\nSamba is a service that allows Linux to host\
    \ or access Microsoft SMB-based\n\nresources, such as file shares, printers, and\
    \ other computer resources across a\n\nnetwork. With this service a Linux client\
    \ can connect to a Microsoft SMB-based\n\nnetwork and share files with other Windows-based\
    \ server and clients.\n\nWith this service a Linux server can also host a Microsoft\
    \ SMB-based network\n\nfiles shares so that other Windows clients can access them.\
    \ Although, this\n\nfunctionality is not covered in this version of the book and\
    \ may be included in\n\nfuture versions.\n\n \n\n**Installing the Samba Service**\n\
    \n \n\nTo install the Samba service, type:\n\nsudo apt-get install samba\n\n \n\
    \n**Securing File Sharing**\n\nTo password-protect a samba file share, you need\
    \ to create a group called\n\n\"smbgrp\" and set a password for each user.\n\n\
    \ \n\n$ sudo addgroup smbgrp\n\n$ sudo usermod user\\_name -aG smbgrp\n\n$ sudo\
    \ smbpasswd -a user\\_name\n\n \n\n**Note:** *user\\_name account must belong\
    \ to the local system, or else it*\n\n*won't save.*\n\n**Configuring Samba**"
  merge: -1
  pgno: 185
- img_proc: true
  md: "Create a directory for your Samba shares, type: mkdir ~/samba\\_share/\n\n\
    \ \n\n**Note:** *To create the secure directory where the shared files will be\
    \ stored.*\n\n*sudo mkdir -p srvsamba/secure\\_shares* *Next, set the appropriate*\n\
    \n*permissions on the directory.*\n\n*sudo chmod -R 0770 srvsamba/secure\\_shares*\
    \ *sudo chown -R root:smbgrp*\n\n*srvsamba/secure\\_shares*\n\n \n\nEdit the Samba\
    \ configuration file, type:\n\nnano *etc*samba/smb.conf\n\n \n\nAt the bottom\
    \ of the file, add the following lines:\n\n \n\n\\[sambashare\\]\n\ncomment =\
    \ My Samba Share\n\npath = *home*user\\_name/samba\\_share\n\nread only = no\n\
    \nbrowsable = yes\n\n \n\n(To save the file and exit the editor, press **Ctrl+X**,\
    \ type: **y** and press Enter) More\n\nadvanced directives are available for creating\
    \ different types of shares (i.e. read,\n\nread/write, anonymous only, etc.) To\
    \ put the changes into effect, you have to\n\nrestart the Samba daemon, type:\
    \ sudo systemctl restart smbd\n\n\\-OR-sudo service smbd restart\n\n \n\n**Tip:**\
    \ *To test your current Samba settings, type:* *testparm*\n\n \n\n**Connecting\
    \ to an SMB Share**"
  merge: -1
  pgno: 186
- img_proc: true
  md: "Open up the default file manager in X-Windows, click Connect to Server,\n\n\
    type: smb://domain\\_or\\_ip\\_address/sambashare\n\n \n\n**Enabling Samba in\
    \ the UFW Firewall** If the UFW firewall is enabled on your\n\nsystem, you have\
    \ to add the following rules to allow Samba traffic to pass\n\nthrough the firewall.\
    \ Depending on the type of network you're on, this will cause\n\nyou to have to\
    \ change these commands to specify the proper IP ranges (in the\n\nexample this\
    \ is a class C).\n\n \n\nsudo ufw allow proto udp to any port 137 from 192.168.1.0/24\n\
    \nsudo ufw allow proto udp to any port 138 from 192.168.1.0/24\n\nsudo ufw allow\
    \ proto tcp to any port 139 from 192.168.1.0/24\n\nsudo ufw allow proto tcp to\
    \ any port 445 from 192.168.1.0/24"
