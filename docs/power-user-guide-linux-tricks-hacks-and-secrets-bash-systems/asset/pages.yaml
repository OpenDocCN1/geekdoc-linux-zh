  md: "SECONDS\n\nDisplays a count of the number of\n\nseconds the shell has been\n\
    \nrunning.\n\necho $SECONDS\n\nSHELLOPTS\n\nShell options that can be\n\nconfigured\
    \ with the set option.\n\necho\n\n$SHELLOPTS\n\nUID\n\nThe user ID of the current\
    \ logged\n\nin user.\n\necho $UID\n\n \n\nPersistent Variables\n\n \n\nSince variables\
    \ (i.e. Environment and Shell) are stored in RAM they are\n\ntemporal, and will\
    \ disappear when the shell's process is killed or the computer is\n\nshutdown.\
    \ Persistent variables are stored in a configuration file and loaded when\n\n\
    the system is loaded or when the shell starts.\n\nWhen creating predefined variables\
    \ at login depends upon how Bash was started\n\nand which configuration file gets\
    \ loaded. There are basically four different user\n\nsession types (aka login\
    \ shell), Login, Non-Login, Interactive, and Non-\n\nInteractive.\n\n \n\n**Login**:\
    \ A shell session begins after a user authenticates (i.e. local or ssh\n\nterminal\
    \ session). The login shell session, reads the configuration details\n\nfrom the\
    \ *etc*profile file. It will then search for the first user login shell\n\nconfiguration\
    \ file in the user’s home directory to load any user-specific\n\nconfiguration\
    \ (i.e. ~/.bash\\_profile -OR- ~/.bash\\_login -OR- ~/.profile ).\n\n \n\n**Non-Login**:\
    \ When a new shell is started from within an authenticated\n\nlogin session. For\
    \ example, when you run a Bash command from the\n\nterminal, a non-login shell\
    \ session (under the logged in user's credentials)\n\nis started. A non-login\
    \ shell session reads the *etc*bash.bashrc file and then\n\nthe user-specific\
    \ ~/.bashrc file to configure the environment.\n\n \n\n**Interactive**: A shell\
    \ session that is attached to a terminal and in use. For\n\nexample, an ssh session\
    \ is defined as an interactive login shell."
