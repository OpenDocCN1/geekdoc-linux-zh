  md: "Installing Linux\n\n \n\n**Overview:** This chapter covers the Linux getting\
    \ started considerations with a\n\nLinux Distribution. There are several types\
    \ of Distros (i.e. Distributions)\n\navailable to choose from. Some are just Linux\
    \ clients, others are for server\n\npurposes, and some are for general purpose\
    \ use, while others are for specific\n\npurposes.\n\n \n\nThe first step, is choosing\
    \ the right distribution for what you want to do. The\n\nsecond step, is choosing\
    \ how and where you’re going to install the distro you\n\nhave chosen.\n\nSometimes\
    \ this choice will be made for you depending on what you’re trying to\n\nachieve\
    \ or by the options that are available to you. Other times it will require\n\n\
    research about the distro that you want to use with the end result in mind."
  merge: -1
  pgno: 29
- img_proc: true
  md: "Choosing a Distro\n\n \n\nThere are literally hundreds of distros available\
    \ to choose from. This list is far\n\nfrom complete, and only provides a few popular\
    \ available options. One major\n\nsuggestion before selecting any distro is to\
    \ make sure it is still being actively\n\ndeveloped by the community that supports\
    \ it.\n\nDepending on the application that you’re trying to install will determine\
    \ the\n\ndistro and version that you can use. Other people have personal preference\
    \ for\n\none distro versus another.\n\n \n\n**Debian**: A noncommercial distro\
    \ and one of the earliest, maintained by a\n\nvolunteer developer community with\
    \ a strong commitment to free\n\nsoftware principles and democratic project management.\
    \ (More\n\ninformation: https://www.debian.org/) **Ubuntu**: A desktop and server\n\
    \ndistro derived from Debian, maintained by British company Canonical\n\nLtd.\
    \ (More information: https://www.ubuntu.com/) **Fedora**: A community\n\nsupported\
    \ distro supported by Red Hat. This distro is a technology testbed\n\nfor Red\
    \ Hat's commercial Linux offering, where it prototypes new open\n\nsource applications\
    \ before integrating them into its commercial Red Hat\n\nEnterprise Linux. (More\
    \ information: https://getfedora.org/) **Slackware**:\n\nOriginally created in\
    \ 1993, it was one of the first Linux distros and among\n\nthe oldest that is\
    \ still maintained. This distro has a commitment to remain\n\nhighly UNIX-like\
    \ and easily modifiable by end users. (More information:\n\nhttp://www.slackware.com/)\
    \ **Additional information:**\n\nDistroWatch (distrowatch.com) Latest information\
    \ about Distros\n\n \n\nCommercial Linux Distros\n\n \n\nJust because Linux is\
    \ free and open-source, doesn’t mean that all distros are free,\n\nand don’t contain\
    \ some closed source software (i.e. any software that is not open\n\nsource).\
    \ This is a point of contention with the free and open source software (aka\n\n\
    FOSS) purists."
  merge: -1
  pgno: 30
- img_proc: true
  md: "Red Hat was one of the early companies in the 90s that help legitimize Linux,\n\
    \nincluding the idea of paying for professional support. Before this, all Linux\n\
    \nsupport had to come through the online community.\n\nIf you’re a professional\
    \ organization, such as a business or government then you\n\nmight want to consider\
    \ using one of the commercial Linux distros because they\n\noffer paid 24x7 support.\
    \ When using a community distro, the support model is\n\n‘best effort’ (i.e. no\
    \ guarantees), which you don’t want to hear when you’re in a\n\ncritical situation.\n\
    \n \n\n**Red Hat Enterprise Linux** (RHEL), a derivative of Fedora, maintained\n\
    \nand commercially supported by Red Hat. It seeks to provide tested, secure,\n\
    \nand stable Linux server and workstation support to businesses."
  merge: -1
  pgno: 31
