  md: "Core Security Philosophies\n\n \n\nThere are core security philosophies that\
    \ every person in Information\n\nTechnology should follow. This section is very\
    \ high-level and may oversimplify\n\nthe subject, but be aware it is much broader\
    \ then what is covered here.\n\nThe most common type of malicious actors (someone\
    \ or group looking to steal\n\nwhat they can), are looking for easy targets that\
    \ they can compromise quickly.\n\nThese type of attacks are easier to defend against,\
    \ you mostly just need to make\n\nsure your systems are locked down and updated.\n\
    \nWhile the more determined malicious actors (generally going to be nation\n\n\
    states), are much harder. They generally have a specific target that they are\n\
    \ngoing after and will use any method that they want to achieve their end goal.\n\
    \nThe core security philosophies listed below, are only a few of many, but these\n\
    \nare a good place to start: **Least Privilege**: Only grant privileges that are\
    \ needed\n\nfor a user to do their job. Don't grant admin access to a user because\
    \ it will make\n\nyour job easier.\n\n**Defense in Depth**: Create multiple layers\
    \ of security or defense. For\n\nexample, have an external firewall to protect\
    \ your perimeter, utilize the\n\nlocal firewalls on the OS, and then encrypt all\
    \ your data and\n\ncommunications.\n\n**Be Persistent**: Malicious actors are\
    \ constantly changing their attack\n\nmethods, so you have to constantly adapt\
    \ new methods to defend against\n\nthese new types of attacks.\n\n \n\n**Reduce\
    \ your Attack Surface:** Turn off services that are not needed,\n\nchange default\
    \ passwords and accounts, make sure your firewalls are\n\nconfigured properly,\
    \ *etc.*\n\n \n\nThe following security diagram is a high-level tool to help visualize\
    \ the different\n\nlayers that you need to consider protecting against attack.\
    \ It also briefly\n\ndescribes some of the considerations that you will need to\
    \ do to protect that layer"
  merge: -1
  pgno: 235
