  md: "Background and Foreground Jobs\n\n \n\nIn the terminal, commands run serially,\
    \ meaning you have to wait for the first\n\ncommand to finish before running the\
    \ next command. If a command is running\n\nfor a long time, this can be annoying\
    \ if you have to wait for it to finish before\n\nyou can run the next command.\n\
    \nSometimes, this can be an unacceptable behavior, and you just need to run the\n\
    \nnext command. To overcome this limitation, you have two choices. If you're\n\
    \nrunning X-Windows, you can open up another terminal window. Although, if\n\n\
    you’re running a text terminal shell you might want to just run these commands\n\
    \nin the background.\n\n \n\nTo run a command in the background (use the ampersand\
    \ '&' at the end of\n\nthe command), type: tree *\\> ~*output\\_file.txt **&**\n\
    \n**Note:** *When using a command like* *tree > ~***output\\_file***& , output\
    \ (such as*\n\n*errors) may still go to the terminal even though the process is\
    \ running in the*\n\n*background, try the following to stop it:* *command ****&>devnull****\
    \ &*\n\n \n\nTo see all commands running in the background, type: jobs\n\n \n\n\
    To send a stopped process (Ctrl+Z) into the background, type: bg\n\n \n\nTo bring\
    \ a command running in the background to the foreground,\n\ntype: fg\n\n \n\n\
    Press Ctrl+Z to pause an application, type: fg restarts the application or\n\n\
    bg to run it in background.\n\n \n\nTo stop a background job, type:\n\nkill %1\
    \ **job\\_number** To stop a running process, type:\n\nkill **process\\_id** If\
    \ the KILL command doesn't stop the process, type: kill"
  merge: -1
