  md: "Using the console\n\n \n\nThe main goal of any shell is to facilitate the execution\
    \ of commands or scripts\n\nby supplying them with the needed information (aka\
    \ arguments). Some of the\n\nadditional functionality that the shell provides\
    \ is: variables, conditional\n\nbranching (i.e. if-statements), loops, functions,\
    \ *etc.* for creating scripts that\n\nmanage the operating system, files, permissions,\
    \ *etc.*\n\nThe first and most critical thing that you have to learn is the editing\
    \ features of\n\nthe terminal. You will use these keyboard shortcuts the most\
    \ often and they will\n\nmake your life easier in the terminal once you have master\
    \ them.\n\n \n\n**Note:** *The terminal uses a set of similar editing function\
    \ keys that are*\n\n*also utilized by* *vi and other similar editors (i.e.* *vim\
    \ ,* *emacs , etc.).*\n\n \n\n**Keyboard Shortcuts**\n\nEditing in the command\
    \ terminal (Note: these commands are BASH shell\n\nspecific, and other shells\
    \ may have different options) Press **Ctrl+A** (or press the\n\n**Home** button)\
    \ to move to the beginning of a line Press **Ctrl+E** (or press the **End**\n\n\
    button) to move to the end of a line.\n\n \n\nPress **Ctrl+L** to clear the screen.\n\
    \n**Tip:** *If the terminal is giving you problems, type:* *reset*\n\n \n\nPress\
    \ **Ctrl+K** to delete everything until the end of the line.\n\n \n\nPress **Ctrl+D**\
    \ quits the current shell.\n\n \n\nPress **Ctrl+U** to cut the text from the current\
    \ cursor position to the"
  merge: -1
  pgno: 38
- img_proc: true
  md: "beginning of the line.\n\n \n\nPress **Ctrl+Y** to paste the cut text.\n\n\
    \ \n\nPress **Ctrl+W** to cut backwards one word.\n\n \n\nPress** Ctrl+Y** to\
    \ paste the cut text.\n\n \n\nPress **Ctrl+T** swaps the two characters before\
    \ the cursor.\n\n \n\nPress **ESC+T** swaps the two words before the cursor.\n\
