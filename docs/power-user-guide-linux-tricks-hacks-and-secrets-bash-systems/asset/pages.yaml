  md: "Enabling SELinux\n\n \n\nSecurity-Enhanced Linux (SELinux) is a compulsory\
    \ access control security\n\nmechanism provided in the kernel. Disabling SELinux\
    \ means removing security\n\nmechanisms from the system.\n\nIt is recommend that\
    \ you enable this feature if your system is attached to the\n\ninternet and is\
    \ accessible by the public.\n\n \n\nTo check if SELinux is enabled, type:\n\n\
    sudo sestatus\n\n\\-OR—\n\ngetenforce .\n\n \n\nTo enable this feature if it is\
    \ disabled, type: sudo setenforce enforcing .\n\n \n\n**Notes:** *It also can\
    \ be managed (enabled or disabled) from the*\n\n***etcselinux/config**** file.*\n\
    \n*SELinux provides three basic modes of operation and they are:*\n\n***Enforcing****:\
    \ This is the default mode which enables and enforces the*\n\n*SELinux security\
    \ policy on the machine.*\n\n***Permissive****: In this mode, SELinux will not\
    \ enforce the security policy on*\n\n*the system, only warn and log actions. This\
    \ mode is very useful in terms*\n\n*of troubleshooting SELinux related issues.*\n\
    \n***Disabled****: SELinux is turned off.*"
  merge: -1
  pgno: 252
- img_proc: true
  md: "Monitoring User Activities\n\n \n\nTo protect against outsider (i.e. malicious\
    \ users) or insider (i.e. your employees)\n\nthreats, you need to monitor user\
    \ activities. The malicious user (or the outside\n\nattacker) are the easiest\
    \ threats to understand. While the insider threat, is the\n\nmost difficult to\
    \ protect against, because generally this is a person that is trusted\n\nby the\
    \ organization.\n\nThere are two utilities that can monitor user activity: psacct\
    \ (for Red Hat based\n\nsystems) or acct (for Debian based systems) that are useful\
    \ for monitoring user\n\nactivities and processes on a system. These tools run\
    \ in the system in\n\nbackground tracking each user activity on a system and resources\
    \ consumed by\n\nservices such as Apache, MySQL, SSH, FTP, *etc.*\n\n \n\nTo install\
    \ these utilities, use one of the following commands: For Red Hat\n\nbased systems:\n\
    \nsudo yum install psacct\n\n \n\nFor Debian based systems:\n\nsudo apt-get install\
    \ acct"
  merge: -1
  pgno: 253
- img_proc: true
  md: "Monitoring Log Files\n\n \n\nProtecting your logs is critical to help you troubleshoot\
    \ problems with your\n\nsystem or applications. They can also tell you if an intruder\
    \ attacks your system,\n\nand possibly how they may have compromised it. This\
    \ is why you will want to\n\nprevent an intruder from easily deleting or modifying\
    \ the local log files.\n\n \n\nTo help prevent intruders from easily modifying\
    \ or destroying local logs.\n\nNext are the common Linux default log files name\
    \ and their usage.\n\n \n\n*var*log/auth.log : Authentication logs.\n\n*var*log/boot.log\
    \ : System boot log.\n\n*var*log/cron.log : Crond logs (cron job).\n\n*var*log/kern.log\
    \ : Kernel logs.\n\n*var*log/message : System logs (current system activity).\n\
    \n*var*log/mysqld.log : MySQL database server log file.\n\n*var*log/secure : Authentication\
    \ log.\n\n*var*log/utmp -OR- *var*log/wtmp : Login log file.\n\n*var*log/yum.log\
    \ : Yum log files.\n\n \n\n**Note:** *The availability of these logs and locations\
    \ will vary between*\n\n*distros and versions of application and services that\
    \ are installed. There*\n\n*might be other logs that you should monitor as well,\
    \ it might require*\n\n*additional research on your part to identify which ones.*"
  merge: -1
  pgno: 254
