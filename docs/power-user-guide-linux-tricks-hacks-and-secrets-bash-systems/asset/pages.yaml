  md: "Saving the Changes\n\n \n\nWhen you’re done making changes to the firewall,\
    \ you need to commit them in\n\norder to save them. Otherwise they will be lost\
    \ the next reboot, or if the firewall\n\nget is restarted.\n\n \n\nTo commit the\
    \ firewall change, type:\n\nsudo *sbin*iptables-save\n\n \n\n**Note:** *Depending\
    \ on the distro you’re running this can be different.*\n\n \n\n**Tip:** *To clear\
    \ all the currently configured rules, use the flush command,*\n\n*type:* sudo\
    \ *iptables -F*"
  merge: -1
