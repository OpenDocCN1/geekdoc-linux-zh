  md: "Command Piping and Output Redirection\n\n \n\nMost commands and scripts, may\
    \ accept some type of Standard Input (aka\n\nSTDIN) and write to the Standard\
    \ Output (aka STDOUT).\n\nSTDIN comes in the form of arguments or data that has\
    \ been passed from the\n\ncommand or script.\n\n \n\nExample: If you typed, echo\
    \ HelloWorld , you are passing the argument\n\nHelloWorld in to the echo command\
    \ . The echo command will then\n\ndisplay the output to the terminal.\n\n \n\n\
    ***Note:*** *Every command automatically has three data streams connected to*\n\
    \n*it.*\n\n*STDIN (0) - Standard input (data fed into the program)* *STDOUT (1)\
    \ -*\n\n*Standard output (data printed by the program, defaults to the terminal)*\n\
    \n*STDERR (2) - Standard error (for error messages, also defaults to the*\n\n\
    *terminal)*\n\n \n\nSTDOUT is data that the command or script generates, then\
    \ sends it to the\n\nterminal by default. Although, the output can be redirected\
    \ to another command\n\nand used as input, sent to a printer, or file, *etc.*\n\
    \n \n\nUsing the example that was used earlier, if you typed echo **HelloWorld**\
    \ ,\n\nthe output of HelloWorld would be displayed on the terminal.\n\n \n\n**Note:**\
    \ *This output can also be redirected to a file using >* , for example:\n\n*echo\
    \ ****HelloWorld**** > output\\_file.txt*\n\n \n\nCommand Piping"
  merge: -1
  pgno: 46
- img_proc: true
  md: "Piping redirects the output from one command and sends it to another command\n\
    \nfor processing. This is a very powerful, and well used operator. It allows you\
    \ to\n\nget information from one command as output, and send it into another as\
    \ input.\n\n \n\nExample:\n\nls -al | less\n\n(Press Q to quit, or use the arrow\
    \ keys to move up and down)\n\nOutput Redirection\n\n \n\nBy default, every command\
    \ reads from the STDIN and writes to the STDOUT.\n\nHowever, you can change that\
    \ and redirect the output. For example, you can\n\nredirect your output to a file.\n\
    \nThere are several types of redirect operators that perform different actions,\
    \ so it\n\nis important to get to know the difference between them.\n\n \n\ncommand\
    \ > **output\\_file** sends the STDOUT of the command to a file.\n\n \n\nExample:\n\
    \nls -l *\\> ~*output\\_file.txt\n\ncat ~/output\\_file.txt\n\n \n\n**Note:**\
    \ *This will overwrite a file if it already exists.*\n\n \n\ncommand >> **output\\\
    _file** appends an existing file with the STDOUT of\n\nthe command.\n\n \n\nExample:\n\
    \nls -l *\\>> ~*output\\_file.txt\n\ncat ~/output\\_file.txt"
  merge: -1
  pgno: 47
- img_proc: true
  md: " \n\ncommand 2> **output\\_file** would redirect STDERR to a file, or in the\n\
    \nexample below its redirected to *dev*null so it doesn't display anything on\n\
    \nthe console.\n\n \n\nExample:\n\nls -l / 2> *devnull* command &> **output\\\
    _file** would redirect both\n\nSTDOUT and STDERR to a file, or in the example\
    \ below its\n\nredirected to *dev*null so it doesn't display anything on the console.\n\
    \n \n\nExample:\n\nls -l / &> *devnull* command < **input\\_file** redirects the\
    \ contents of a\n\nfile back into the command (i.e. provide it as an input.) Example:\n\
    \nwc -l < **input\\_file** 2>&1 redirect both STDERR and STDOUT\n\noutput to the\
    \ same file Example:\n\ndu / > **output\\_file** 2>&1\n\n \n\n**Tip:** *By redirecting\
    \ the output to* *devnull nothing will be display on the*\n\n*console. The device*\
    \ *devnull can be thought of as a type of black hole,*\n\n*that has infinite size\
    \ but nothing can be retrieved from it.*\n\n \n\n**Note:** *All the redirection\
    \ operators are:* ***<****, ****\\>****, ****\\>|****, ****<<****, ****\\>>****,\
    \ ****\\>&****, ****<> .***\n\n*Several of these redirection operators were discussed\
    \ earlier in this*\n\n*section, but there some other ones that you may use less\
    \ often or never.*\n\n*There are more that are even more obscure but not covered\
    \ in the book,*\n\n*because they only provide limited value or are for special\
    \ case scenarios.*\n\n*cmd ****\\>|**** file* *Overwrites the file, even if the\
    \ shell has this feature turned off.*\n\n*cmd1 ****\\>&**** cmd2* *Redirect both\
    \ STDERR and STDIN from cmd1 into cmd2*\n\n*cmd ****<>**** file* *Opens a file\
    \ for reading and writing on STDIN (or cmd).*"
  merge: -1
  pgno: 48
