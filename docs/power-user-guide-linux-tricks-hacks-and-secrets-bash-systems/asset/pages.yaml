  md: "Linux Boot Loader\n\n \n\nThe Linux boot loader is a small program that loads\
    \ at boot (after the firmware\n\nperform system checks, and when the MBR \\[master\
    \ boot record\\] is loaded from\n\nthe storage device). It can automatically start\
    \ a Linux distro, or another operating\n\nsystem (such as Windows) depending how\
    \ it is configured. It can also be\n\nconfigured to stop and allow the user to\
    \ select which OS they want to load.\n\nThe most popular boot loader is called\
    \ GRUB (GRand Unified Bootloader).\n\nAlternative boot loaders utilized by Linux\
    \ distros are the LILO (LInux LOader)\n\nand LOADLIN (LOAD LINux). There are more\
    \ boot loaders available, but these\n\nare some of the most popular.\n\nIf you\
    \ want more information on this subject, in your favorite search engine\n\ntype:\
    \ \"Linux Boot Loaders OR BootLoader\"\n\n \n\n![](img/0f524874379aa171ff08f51cdf3cfa83_146_0.png)\n\
    \n \n\n**Tip:** *Hold down the Shift key during startup to access the GRUB boot*\n\
    \n*menu.*"
  merge: -1
  pgno: 146
- img_proc: true
  md: "Runlevels Init (Older Systems)\n\n \n\nIn Linux, \"runlevels\" are the operational\
    \ levels that describe the state of the\n\nsystem with respect to what services\
    \ are loaded when the system starts. If the\n\nsystem is set to a runlevel of\
    \ 1, it is restrictive and normally only used for\n\nmaintenance. The system will\
    \ usually be set to a runlevel of 2-5, which is\n\nmultiuser mode.\n\nThe default\
    \ systems (the one that will be used when the system starts up) is\n\ngenerally\
    \ configured in the *etc*inittab file. Some Linux distros may not use this\n\n\
    file.\n\nThe processes that are executed by each runlevel, depend on the contents\
    \ of the\n\n*etc*rc?.d directory (i.e. *etc*rc1.d, *etc*rc2.d, *etc*rc3.d , etc.).\
    \ To see all the\n\nprocesses for all the runlevels directories, type: ls *etc*rc?.d\n\
    \n \n\nAll the files in this directory are symbolic links that point to scripts\
    \ in the\n\n*etc*init.d directory that start the services. The names of the files\
    \ are important,\n\nbecause they determine the order in which the scripts will\
    \ run. To see the\n\nprocesses for a specific runlevel, type: ls -l *etc*rc3.d\n\
    \n \n\n**Runlevel Reference**\n\n0 = halted (system shutdown)\n\n1 = single user\
    \ (maintenance mode)\n\n2 = multiuser with no networking configured\n\n3 = multiuser\
    \ with networking (normal operation) 4 = not used (user\n\ndefined)\n\n5 = Normal\
    \ operation, plus GUI\n\n6 = reboot\n\n \n\n**Tip:** *To see the runlevel that\
    \ the system is currently running in, type:*\n\n*runlevel*"
  merge: -1
