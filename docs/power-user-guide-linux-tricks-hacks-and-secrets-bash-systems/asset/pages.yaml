  md: "Monitoring Accounts for Empty Passwords\n\n \n\nThere is an easy way to check\
    \ if any user accounts have an empty password,\n\nthese types of accounts are\
    \ a large security risk. These accounts could allow an\n\nunauthorized user access\
    \ to your system by just pressing the Enter key, and they\n\nalso make your system\
    \ more vulnerable to attack.\n\n \n\nTo check if any accounts have an empty password,\
    \ type: sudo cat\n\n*etc*shadow | awk -F: '($2==\"\"){print $1}'"
