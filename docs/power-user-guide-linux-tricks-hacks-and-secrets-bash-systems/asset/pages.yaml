  md: "Creating a Bootable USB Drive\n\n \n\n**Overview:** Learn how to create a bootable\
    \ version of a Linux distro that can be\n\ninstalled on a USB flash drive. With\
    \ this drive you can boot into a physical\n\ncomputer without modifying it, or\
    \ you can also use it in the repair and\n\ndiagnostics of that system.\n\n \n\n\
    **Prerequisites:** *This section requires that you have root permissions on*\n\
    \n*the system to install services and make changes to the OS.*\n\n*An 8GB USB\
    \ Flash Drive (the size requirement depends on the distro that*\n\n*you want to\
    \ use)* *Downloaded Linux distro*\n\n \n\nIt is possible to create a bootable\
    \ version of a Linux OS that can be installed on a\n\nUSB flash drive. This will\
    \ allow you to load a version of the Linux OS on a local\n\nsystem. This has several\
    \ advantages, such as testing out a distro to see if you like\n\nit, or perform\
    \ local diagnostics or repairs on a broken version of the OS, or\n\ntrying to\
    \ recover a failed filesystem on a local storage device."
  merge: -1
  pgno: 277
- img_proc: true
  md: "Creating a Bootable Flash Drive\n\n \n\nDownload the USB bootable version of\
    \ a Linux distro that you want to\n\nboot from.\n\n \n\n**USB Bootable Linux Distros**\n\
    \n \n\n**Puppy Linux** - an ultra-small Linux distro. Has a very small\n\nstorage,\
    \ and hardware requirement. (More information:\n\nhttp://puppylinux.org/) **Slax**\
    \ - Like Puppy Linux, this is an\n\nultra-small Linux distro. Has a very small\
    \ storage, and\n\nhardware requirement. (More information:\n\nhttps://www.slax.org/)\
    \ **Kali Linux** - This version of Linux is\n\ndesigned for data security experts,\
    \ it contains several utilities\n\nthat are specific to this field. (More information:\n\
    \nhttps://www.kali.org/) **Knoppix** - One of the earliest live CD\n\ndistros\
    \ to become popular. This distro packs more than\n\nthousand software packages.\
    \ (More information:\n\nhttp://knoppix.net/) Plug in the USB flash drive in to\
    \ your\n\ncomputer.\n\n \n\n**Warnings:** *All data on USB drive will be destroyed.\
    \ Backup any*\n\n*important data before proceeding*\n\n \n\nTo see all block devices\
    \ and find the name of the USB device (**generally**,\n\nit can be something like\
    \ sd**X** ), type: sudo lsblk\n\n \n\n**Warnings:** *Don’t mix up drives, you\
    \ can destroy data. These*\n\n*designations can change between distros versions.\
    \ If you’re not*\n\n*sure what you’re doing stop here.*\n\n \n\nCopy the contents\
    \ on your USB drive (Replace **X** with the proper letter"
  merge: -1
  pgno: 278
- img_proc: true
  md: 'from lsblk ), type: sudo dd if=***path*****to/file.iso** of=*dev*sd**X** bs=4M


    status=progress Reboot your computer, and see if there is an option that


    shows up that allows the ability to select booting from a USB drive


    **Note:** *If you don’t have this option, refer to your computer manufacture’s*


    *manual or website on how to configure this setting in the system''s firmware.*'
  merge: -1
