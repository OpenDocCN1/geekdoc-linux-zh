  md: "Firewall Management\n\n \n\n**Overview:** Learn how to manage the builtin Linux\
    \ firewall. This firewall is very\n\nbasic when compared to its compition. Although\
    \ it is still sophisitcied enjoy to\n\ndo just about anything you need to do with\
    \ it.\n\n \n\n**Firewall Overview**\n\nLayer 3: **Shell** (i.e. Application and\
    \ Services) Layer 2: **Network**\n\n**and Firewall** (i.e. Communication) \\[\
    \ iptables chains: input, forward,\n\nand output\\]\n\n\\[Network Protocol: IPv4\
    \ and IPv6\\]\n\nLayer 1: **Host OS** (i.e. Kernel, Libraries, etc.) Layer 0:\n\
    \n**Infrastructure** (i.e. Hardware, VM, Cloud, IoT, etc.) iptables is a\n\ncommand-line\
    \ firewall utility that is used by Linux distributions.\n\nThe Linux firewall\
    \ uses policy chains to allow or deny traffic. When\n\na remote system tries to\
    \ establish a connection with the local\n\nsystem.\n\niptables will look at its\
    \ rules and see if it matches any of them, if it finds a match\n\nit allows the\
    \ packet into the system. If it doesn’t find a matching rule, it will\n\nresort\
    \ to its default action which is generally to block the packets.\n\n \n\n**Prerequisites:**\
    \ *This section requires that you have root permissions on*\n\n*the system to\
    \ install services and make changes to the OS.*\n\n \n\niptables should come preinstalled\
    \ in your distro of Linux, if not check if it is\n\nusing another utility. To\
    \ check if iptables is installed, type: sudo iptables\n\n \n\n***Note:*** *If\
    \ this service is not already installed, type:* *sudo apt-get install*\n\n*iptables*"
  merge: -1
  pgno: 258
- img_proc: true
  md: "I will state there are some command line and GUI apps that will make managing\n\
    \nthe firewall easier. Although, I would highly recommend that you learn how to\n\
    \ndo it from the command line first, it will give you a greater understanding\
    \ of\n\nhow to manage this service.\n\n \n\n**Note:** *The* *iptables utility\
    \ is for IPv4 and the* *ip6tables utility is for IPv6.*\n\n \n\nThere are three\
    \ different iptables chains: input, forward, and output.\n\n \n\nThe input chain\
    \ controls the behavior for incoming network connections\n\n(i.e. ssh connection).\
    \ iptables will try to match the IP address, protocol,\n\nand port to a rule in\
    \ the input chain. Then decide whether it will allow or\n\ndeny the connection.\n\
    \n \n\nThe forward chain controls the outgoing network data that isn’t meant for\n\
    \nthe local system, but instead will be forwarded to another system. Unless\n\n\
    you’re system is providing some type of service that does routing,\n\nNATing,\
    \ or something similar that uses forwarding, you probably won’t\n\neven use this\
    \ feature.\n\n**Tip:** *To tell if your system is using IP forwarding use the\
    \ following*\n\n*command and see if the policy is accepting packets, type:* *sudo*\n\
    \n*iptables -L -v*\n\n \n\nThe output chain controls the outgoing network connections\
    \ (i.e. ping\n\ncommand). iptables will try to match the IP address, protocol,\
    \ and port to\n\na rule in the output chain. Then decide whether it will allow\
    \ or deny the\n\nconnection.\n\n \n\n**Note:** *When using any firewall to lock\
    \ down a system, it is*\n\n*important to remember that several protocols will\
    \ require two-way*"
  merge: -1
  pgno: 259
- img_proc: true
  md: "*communication. So it is important to remember that you might have*\n\n*to\
    \ create both the input and output rules.*\n\nThere are three different iptables\
    \ responses to packets: accept, drop, and reject.\n\nThe accept response accepts\
    \ the connection. The drop response, just drops the\n\npacket like it never received\
    \ it. Finally there is the reject response, which returns\n\nan error to the requesting\
    \ system.\n\nThe way iptables process rules is starts at the top of its list and\
    \ goes through each\n\nrule until it finds one that matches the packet. You need\
    \ to take this into\n\nconsideration when writing your rules. It’s important to\
    \ note that the -A appends\n\nthe rule to an existing chain. The -I \\[chain\\\
    ] \\[number\\] allows you specify the line\n\nnumber in the list where the rule\
    \ should go.\n\n \n\nBlock all connections from a single IP address, type: sudo\
    \ iptables -A\n\nINPUT -s 192.168.0.100 -j DROP\n\n \n\nBlock all connections\
    \ from an IP range using standard slash notation or\n\nnetmask, type: sudo iptables\
    \ -A INPUT -s 192.168.0.0/24 -j DROP\n\n\\-OR-sudo iptables -A INPUT -s 192.168.0.0/255.255.255.0\
    \ -j\n\nDROP\n\n \n\nBlock all connections from a single IP address, type: sudo\
    \ iptables -A\n\nINPUT -s 192.168.0.100 -j DROP\n\n \n\nTo drop a specific protocol\
    \ or port number from a specific IP address,\n\ntype: sudo iptables -A INPUT -p\
    \ tcp --dport ssh -s 192.168.0.100 -j DROP\n\n \n\nTo drop a specific protocol\
    \ or port number from all IP addresses, type:\n\nsudo iptables -A INPUT -p tcp\
    \ --dport ssh -j DROP\n\n \n\nTo insert a rule, type:"
  merge: -1
  pgno: 260
- img_proc: true
  md: "sudo iptables -I INPUT 1 -s 192.168.0.100 -j ACCEPT\n\n \n\nTo replace a rule,\
    \ type:\n\nsudo iptables -R INPUT 1 -s 192.168.0.100 -j ACCEPT\n\n \n\n**Note:**\
    \ *When working on this service remotely, be careful because*\n\n*you could lock\
    \ yourself out of a remote system playing with this*\n\n*feature. Once you lock\
    \ yourself out, you will need to have some*\n\n*type of terminal access to the\
    \ system to fix the problem.*\n\n \n\nAs stated earlier in this section, some\
    \ applications and service only require a\n\none-way connection. While other applications\
    \ and services may require a two-\n\nway connection. For example, ssh requires\
    \ bi-directional communications.\n\nSome additional functionality of the firewall\
    \ if you need it, is called connection\n\nstate that allows two way communication,\
    \ but only allows one-way to establish\n\nit. For example, you can make a new\
    \ connection from the local system to a\n\nremote server and they are allowed\
    \ to have two-way communication. Although,\n\nnew connections from the remote\
    \ server to the local systems are not allowed.\n\n \n\nsudo iptables -A OUTPUT\
    \ -p tcp --dport 22 -m 192.168.0.100 --ctstate\n\nNEW,ESTABLISHED -j ACCEPT\n\n\
    \ \n\nsudo iptables -A INPUT -p tcp --sport 22 -m 192.168.0.100 --ctstate\n\n\
    ESTABLISHED -j ACCEPT\n\n \n\n**Note:** *You can also specify other protocols,\
    \ such as:* *udp* *\\-OR- icmp . To*\n\n*control ICMP traffic on* *ip6tables ,\
    \ use the protocol:* *ipv6-icmp .*"
  merge: -1
  pgno: 261
