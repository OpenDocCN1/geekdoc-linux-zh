  md: ";;\n\n\\# Pattern 3\n\ntest3)\n\necho 'test #3'\n\n;;\n\n\\# Catch all (matches\
    \ anything) if three is not an available # pattern\n\nmatch\n\n\\*)\n\necho 'Did\
    \ not understand'\n\n;;\n\nesac\n\n \n\n**Note:** *The last part of the of previous\
    \ script (i.e.* ***\\*)**** ) is a catch all, if the*\n\n*patterns before it didn't\
