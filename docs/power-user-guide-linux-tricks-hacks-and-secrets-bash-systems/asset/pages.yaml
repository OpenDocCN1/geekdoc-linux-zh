  md: "Monitoring Connections\n\n \n\nYour computer can have tens or hundreds of connections\
    \ going on at one time.\n\nSometimes you can identify an attacker by noticing\
    \ a strange connection from an\n\nodd port or service.\n\n \n\nTo check the connections\
    \ to the computer, type: netstat -tulpn\n\n \n\nDisplays all TCP sockets:\n\n\\\
    # ss -t -a\n\n \n\n**Note:** *There are many more examples of the* *netstat* *and*\
    \ *ss*\n\n*commands throughout the book, these are only provided as*\n\n*reference.*"
