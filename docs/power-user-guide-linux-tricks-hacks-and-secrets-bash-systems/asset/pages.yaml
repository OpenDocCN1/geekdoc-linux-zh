  md: "Basic Shell commands\n\n \n\n**Overview:** This chapter contains a beginning\
    \ set of commands. These\n\ncommands provide the more common operations (i.e.\
    \ copying, deleting,\n\nviewing, etc.), and they may be utilized more often than\
    \ the more advanced\n\ncommands that will be talked about in later chapters.\n\
    \n \n\nIf you have used Linux before some of these might be very familiar to you,\
    \ but\n\nyou also might learn a few tricks about the commands that you didn't\
    \ know.\n\nThese commands are also the basic foundation on which a lot of other\n\
    \ncommands will be based.\n\nIf you never used Linux before, you may find most\
    \ of the commands to be very\n\npowerful or versatile. So it is not possible to\
    \ fully demonstrate all of their\n\nfunctionality within the context of this book.\n\
    \nIf you want to learn more about how to fully utilize any of the commands\n\n\
    discussed here. I would highly recommend that you do some additional research\n\
    \non them. So you can learn the full scope of the limits of what can be done with\n\
    \nthem.\n\n**Remember:** *Linux sees everything (i.e. files, devices, etc.) as\
    \ a file.*"
