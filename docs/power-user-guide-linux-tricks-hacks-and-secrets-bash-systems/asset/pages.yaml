  md: "Bash Scripting\n\n \n\n**Overview:** This chapter provides an introduction\
    \ to scripting using the BASH\n\nbuiltin and external commands. This overview\
    \ provides you with the basics you\n\nwill need to get started scripting using\
    \ this technology.\n\n \n\nThis chapter assumes that you have written a script\
    \ before, and you have a basic\n\nunderstanding of Linux and BASH. This topic\
    \ will only be covered at a high-\n\nlevel in order to provide a basic foundation\
    \ on which you can build upon. If you\n\nneed a more basic tutorial, I would highly\
    \ recommend checking out other\n\nresources available (i.e. web sites or books).\n\
    \nA script is nothing more than a text file with a predefined list of commands\
    \ in a\n\nsequential order with some conditional branching and looping included\
    \ to\n\ncomplete a specific task. The commands are passed into a command interpreter\n\
    \nthat processes them.\n\nFor example, by following the instructions below, it\
    \ will create a script that lists\n\nall the files in the root directory with\
    \ the following command: ls -al / . By adding\n\nmore commands to this script\
    \ you can add additional functionality.\n\nIf you're going to do programming using\
    \ the BASH shell, this shell only\n\nprovides very basic command support. If you\
    \ need to do more advanced\n\nscripting then you will have to use another language.\n\
    \nRight now, I would suggest checking out Python, or any of the other popular\n\
    \ngeneral purpose scripting languages. There are also other languages like Perl,\n\
    \nRuby, etc., there is nothing wrong with them. Python is just the most popular\
    \ at\n\nthe time of writing of this book"
  merge: -1
  pgno: 116
- img_proc: true
  md: "Creating your first script file\n\n \n\nThere are a few basic steps that are\
    \ required to setup a script and execute it. If\n\nyou don’t follow these basic\
    \ steps your script will not run properly.\n\n \n\nIn the example below, you first\
    \ have to create a basic file that will hold the\n\ninitial sets of commands.\
    \ Once the file is created, you can then modify it\n\nin any way that you would\
    \ like.\n\n \n\nTo create the script, type:\n\nnano ~/**script\\_file.sh** Add\
    \ the following commands to the\n\nscript, type: #!*bin*bash\n\nls -al /\n\n \n\
    \n(To save the file and exit the editor, press **Ctrl+X**, type: **y** and press\n\
    \nEnter) You should note the first line of the script (i.e. #!*bin*bash ),\n\n\
    this is an important line because it tells the shell which interpreter to\n\n\
    use to process the script. In this example, it tells the shell the\n\ncommands\
    \ to follow are going to be Bash.\n\n \n\nAfter the file is created you have to\
    \ grant it execute permissions so the OS\n\nknows that it has authorization to\
    \ run the script.\n\n \n\nChange the user file permission to execute, type: chmod\
    \ u+x\n\n~/**script\\_file.sh** After you grant execute permissions, you then\n\
    \ninstruct the shell to execute the code by typing the file name of the\n\nscript\
    \ that you want to run.\n\n \n\nTo run the script, type:\n\n./**script\\_file.sh**\
    \ All the examples that you have learned in the\n\nprevious chapters can be integrated\
    \ into scripts. There are some\n\ntopics that will have to be briefly covered\
    \ in this chapter to help you"
