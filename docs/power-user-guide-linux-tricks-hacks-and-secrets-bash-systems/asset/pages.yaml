  md: "Systems Administration\n\n \n\n**Overview:** Any Linux user has to learn some\
    \ the system administration\n\nfunctions (i.e. managing users, disks, shutting\
    \ down the system, etc.) to fully\n\nutilize their system. This chapter covers\
    \ these functions by providing a high-\n\nlevel overview of how to handle these\
    \ tasks.\n\n \n\n**Linux Distro Overview**\n\nLayer 5: **Application** (i.e. Programs\
    \ that don't utilize the Shell for\n\ninput) Layer 4: **Shell** (i.e. Commands\
    \ and scripts) Layer 3:\n\n**Filesystem** (i.e. Files and directories) Layer 2:\
    \ **Network** **and**\n\n**Firewall** (i.e. Communication) Layer 1: **Host OS**\
    \ (i.e.\n\nKernel/Services/Libraries/Data) Layer 0: **Infrastructure** (i.e.\n\
    \nHardware, VM, Cloud, IoT, etc.)\n\n**Prerequisites:** *This section requires\
    \ that you have root permissions on the*\n\n*system to install services and make\
    \ changes to the OS.*\n\n*Before starting this section, make sure that you get\
    \ the updated list of the*\n\n*package manager repositories, so that you get the\
    \ latest versions of the*\n\n*programs, services and libraries, type:* *sudo apt-get\
    \ update* *\\-OR-sudo yum*\n\n*update*"
  merge: -1
