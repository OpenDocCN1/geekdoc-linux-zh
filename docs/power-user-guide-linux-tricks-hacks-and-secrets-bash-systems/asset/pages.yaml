    \ (i.e. etcpasswd), e.g.* *passwd, group, resolv.conf*\n\n*(6) - Games* *(7) -\
    \ Miscellaneous (including macro packages and*\n\n*conventions), e.g.* *man(7),\
    \ groff(7)* *(8) - System administration commands*\n\n*(usually only for root),\
    \ e.g.* *useradd, ifconfig* *(9) - Kernel routines*\n\n*\\[Nonstandard\\]*\n\n\
    ***Ex:**** To access the section in the man page (i.e.* *man(7) ), type:* *man\
    \ 7 man*\n\n*For more information about this subject, type:* *man -s 1 man*"
