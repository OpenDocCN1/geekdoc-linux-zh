  md: "Managing Administrators\n\n \n\nAfter creating a user you can grant them root\
    \ privileges to the OS to allow them\n\nto perform lower level systems tasks (i.e.\
    \ maintaining security, hardware, etc.).\n\nBe careful who you give this access\
    \ because it means that they can do anything\n\nthey want on the system locally\
    \ or remotely.\n\nGenerally there are two ways to do this, the first one involves\
    \ running with root\n\npermissions all the time. This is not recommended, because\
    \ it is a security issue.\n\nFor example, if your account has malware in it, the\
    \ malware can now do\n\nwhatever it wants. The second way, is the recommended\
    \ way, and that is to use\n\nthe sudo command.\n\nThe sudo command allows a regular\
    \ user account to elevate a command and run\n\nwith root level access temporarily.\
    \ This is a security feature, so you don’t have\n\nto run as root all the time.\
    \ Once you run a sudo followed by the command and\n\narguments, you will be requested\
    \ to enter your password. You will then not have\n\nto reenter your password again\
    \ until the command timesout after non-use.\n\n \n\nTo see all the users in the\
    \ sudoers file, type: sudo cat *etc*sudoers\n\n \n\nThe sudoers file allows you\
    \ to control who has access to the sudo command. To\n\naccess this command requires\
    \ root access. Newer distros, may have security\n\ngroups such as: sudo or root\
    \ , which are referenced in the sudoers file will\n\nallow you to control who\
    \ has access to this file.\n\n \n\nTo see all the users in the sudo group, type:\
    \ awk -F':' '*sudo*{print $4}'\n\n*etc*group There is a command called, visudo\
    \ that allows you edits the\n\nsudoers file. It also checks the syntax of the\
    \ file to ensure you are not\n\nlocked out due to a corrupted sudoers file. To\
    \ execute this command,\n\ntype: sudo visudo\n\n \n\n**Tip:** *To add a user to\
    \ the end of a etcsudoers file, type:* *sudo echo*\n\n*'****user\\_name ****ALL=(ALL:ALL)\
    \ ALL' >> etcsudoers*"
