  md: "Scheduling Tasks\n\n \n\nThere are two subsystems in Linux for scheduling a\
    \ task to execute at a future\n\ntime. There is the AT and the CRONTAB scheduling\
    \ subsystems. Each one of\n\nthese services has its advantages and disadvantages\
    \ to using them.\n\n \n\n**AT Scheduler**\n\n \n\nThe first method is at command,\
    \ this is very basic and easy to use. The thing\n\nthat you have to understand\
    \ about the at command is that it can only run a set of\n\ncommands once at a\
    \ specific time/date.\n\n \n\nTo run commands at a specific time, type: at 9:30\
    \ AM 05/10/2025 press\n\nEnter. Then enter a sequence of command(s) to run (example:\
    \ ls -l *\\>*\n\n*~*at\\_output.txt ) press Enter after each command, then press\
    \ Ctrl+D to exit\n\nthe at editor.\n\n \n\nAT service management commands:\n\n\
    \ \n\natq : Lists user’s pending AT command jobs.\n\n \n\natrm **job\\_number**\
    \ : Deletes user’s pending AT command jobs.\n\n \n\nbatch : Executes commands\
    \ when system load levels permit.\n\n \n\n**Tip:** *Using the* *batch command\
    \ you can run another command or*\n\n*script when the CPU load average is below\
    \ a certain threshold,*\n\n*type:* *rm -rf ****largedirectory/\\***** | batch*\
    \ *( batch is part of the* *at , and*\n\n*relies on its service. **Warning: use\
    \ with care, because this*\n\n*command will delete files recursively**)*"
  merge: -1
  pgno: 177
- img_proc: true
  md: " \n\n**Note:** *The AT scheduling daemon (or service) must be running for*\n\
    \n*this command to work.*\n\n \n\n**CRONTAB Scheduler**\n\n \n\nThe second command\
    \ is crontab , this command is more robust then the AT\n\nservice. The crontab\
    \ command, can run jobs at regular intervals. That will be one\n\nof the main\
    \ differentiators when choosing which scheduler you want to use.\n\nThe first\
    \ thing you have to learn when using crontab is the command has six\n\narguments.\
    \ Arguments one thru five, defines the date and time the command is\n\nsupposed\
    \ to be execution. The sixth argument defines the command or script to\n\nbe executed.\n\
    \n \n\n**Note:** *The* crontab *syntax are as following: \\[Minute (0-59)\\] \\\
    [hour (0-23)\\]*\n\n*\\[Day\\_of\\_the\\_Month (1-31)\\] \\[Month\\_of\\_the\\\
    _Year\\] (1-12)*\n\n*\\[Day\\_of\\_the\\_Week (0-6, 6 = Sunday)\\] \\[command\
    \ (i.e. path2script)\\].*\n\n \n\nTo create a CRON scheduled job (aka CRON Job),\
    \ first type: crontab . Then you\n\nwill be put into a mini-editor (very limited\
    \ editing functionality). To create a job\n\nthat runs on 8:05am on January 8th,\
    \ then executes the command, echo \"Hello,\n\nWorld\" .\n\n \n\nIf type crontab\
    \ . You would have to type: 05 08 08 01 \\* echo \"Hello,\n\nWorld\" > test\\\
    _file.txt Then press Ctrl+D when done.\n\n \n\nBy default, crontab entries are\
    \ for the currently logged in user. To see all\n\nthe defined jobs, type: crontab\
    \ -l\n\n \n\nTo edit the CRONTAB entries in an editor, type: crontab -e"
  merge: -1
  pgno: 178
- img_proc: true
  md: " \n\nTo edit another user’s CRONTAB use the following arguments, type:\n\n\
    crontab -u **user\\_name** -e\n\n**Notes:** *Wildcard: The attics (\\*) matches\
    \ anything* *Ranges: Use the hyphen (-),*\n\n*to define ranges (i.e. Mon-Fri,\
    \ 6-11, Jan-Feb, etc.)* *Multiple ranges: Use a*\n\n*comma to separate more than\
    \ one range.*\n\n \n\n**Keywords Shortcuts**\n\n \n\nCRON supports also supports\
    \ some predefined special keywords shortcuts for\n\ncommon time equivalents (i.e.\
    \ hourly, daily, etc.). The table shows the keywords\n\nand time equivalents:\
    \ **Keyword** **Equivalent** @yearly 0 0 1 1 \\*\n\n@daily 0 0 \\*\n\n@hourly\
    \ 0\n\n@reboot Run at startup.\n\n \n\n**Note:** *The CRONTAB file is located:\
    \ etccrontab*"
  merge: -1
  pgno: 179
