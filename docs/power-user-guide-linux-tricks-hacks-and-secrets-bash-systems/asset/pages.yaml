  md: "Using Git (For Beginners)\n\n \n\n**Overview:** This chapter is meant as an\
    \ introduction to the git command. It\n\nfocuses on how to use the git client\
    \ to manage data in the server. It doesn’t deal\n\nwith how to setup a remote\
    \ git server, and only briefly covers how to manage the\n\ndata in the repositories.\n\
    \n \n\n**Git Overview**\n\nLayer 5: **Application** (i.e. IDE, Complier, etc.)\
    \ Layer 4: **Shell** (Git\n\ncommand management) Layer 3:** Filesystem** (Local\
    \ Git repository)\n\nLayer 3a: Working Directory (local files) Layer 3b: Index\
    \ (Pre-\n\nstaged) Layer 3c: Head (Pre-final commit) Layer 2: **Network** **and**\n\
    \n**Firewall** (Remote Git repository http://github.com) Layer 1: **Host**\n\n\
    **OS** (Kernel/Programs/Services/Libraries/Data) Layer 0:\n\n**Infrastructure**\
    \ (i.e. Hardware, VM, Cloud, IoT, etc.)\n\n**Prerequisites:** *Before starting\
    \ this section, make sure that you get the updated*\n\n*list of the package manager\
    \ repositories, so that you get the latest versions of*\n\n*the programs, services\
    \ and libraries, type:* *sudo apt-get update* *\\-OR-sudo yum*\n\n*update*\n\n\
    \ \n\nIf you use Linux (or just about any other major OS) you’re going to learn\
    \ about\n\ngit . git is what is known as a VCS (or Version Control System). Basically\
    \ VCS\n\nlike git are commonly used by programmers (and many others) to store\
    \ their\n\nsource code (or other types of content), to track changes made to it\
    \ (also known\n\nas ‘versions’), as well as sharing it by making it available\
    \ to others like yourself\n\nto download or contribute changes to it.\n\nThere\
    \ are two main components of a git system, there is the server and the client.\n\
    \nThe server component holds the master set of data, and feeds content to the\n\
    \nclients and accepts changes from the clients. The client components job is to\
    \ pull\n\ndata from the server, and collects changes from the local client and\
    \ submits them\n\nback to the server.\n\n \n\n**Note:** *There are GUI based*\
    \ git *clients that will not be covered. For more*"
  merge: -1
  pgno: 191
- img_proc: true
  md: "*information do a search for ‘graphical Git clients’*\n\n \n\nOne of the most\
    \ popular online public git repositories is known as GitHub\n\n(https://github.com/).\
    \ This site is synonymous with git , and is the default choice\n\nfor a lot of\
    \ open source projects. Although, this is not the only choice, there are\n\nseveral\
    \ git repositories providers to choose from. Some are free, while others\n\noffer\
    \ premium services.\n\n \n\n**Getting Started**\n\n \n\nBefore you can do anything,\
    \ you have to make sure that the git client is installed.\n\nIf the client is\
    \ not installed then you need to add it to the local system in order to\n\nutilize\
    \ it.\n\nTo check if you have the git client installed, type: git --version( If\
    \ it returns\n\nresults such as ‘git version 2.x.x’, then the client is installed).\n\
    \n \n\n**Note:** *If you don’t have* *git , to install it, type:* *sudo apt-get\
    \ install git* *\\-*\n\n*OR-sudo yum install git*"
  merge: -1
