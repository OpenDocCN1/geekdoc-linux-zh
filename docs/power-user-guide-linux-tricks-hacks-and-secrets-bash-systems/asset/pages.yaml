  md: "My First System Information script\n\n \n\nThe following script uses some of\
    \ the techniques that were talked about in this\n\nchapter, and demonstrates how\
    \ they can be used. This script will collect and\n\ndisplay information about\
    \ your system.\n\n \n\n#!*bin*bash\n\n\\# Gets system's host name\n\n\\_HOSTNAME=$(hostname)\n\
    \n\\# CPU Architecture\n\n\\_CPUTYPE=$(echo $HOSTTYPE)\n\n\\# Get total amount\
    \ of memory from *proc*meminfo in gigabytes\n\n\\_MEM=$(awk '( $1 == \"MemTotal:\"\
    \ ) { print $2/1048576 }'\n\n*proc*meminfo) echo ----------------------\n\n\\\
    # Displays the system host name\n\necho Name: $\\_HOSTNAME\n\n\\# Checks if the\
    \ system is 32 or 64-bit\n\nif \\[ $\\_CPUTYPE == 'x86\\_64' \\]\n\nthen\n\necho\
    \ \"Arch: 64-Bit\"\n\nelse\n\necho \"Arch: 32-Bit\"\n\nfi\n\n\\# Displays the\
    \ total amount of RAM.\n\necho RAM: $\\_MEM GB\n\necho ----------------------"
