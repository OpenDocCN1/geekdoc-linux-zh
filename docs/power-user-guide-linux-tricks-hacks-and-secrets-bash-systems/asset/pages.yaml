  md: "Managing Storage Devices\n\n \n\nAs stated earlier, all devices are treated\
    \ as a file. All storage devices are\n\nrepresented as files in the /dev directory.\
    \ These file names generally start with\n\nSD or HD followed by another letter.\
    \ For example, one hard drive name might\n\nbe *dev*hda , or *dev*hdb .\n\nPartitions\
    \ are also treated as files, and are stored in the /dev directory. Every\n\nstorage\
    \ device with a partition has a number added to the end of the device\n\nname.\
    \ For example, partition 1 the device name will be *dev*hda1 , partition 2\n\n\
    device name will be *dev*hda2 .\n\n \n\n**Notes** *The Linux kernel decides which\
    \ device gets which name on each*\n\n*boot. This can lead to confusing scenarios\
    \ where a device’s name can*\n\n*change.*\n\n \n\nThe Filesystem Hierarchy Standard\
    \ (FHS) recommends using /mnt\n\nsubdirectory or another one under it for temporarily\
    \ mounted filesystems.\n\nThere are no recommendations where to mount more permanent\
    \ storage,\n\nbut /mnt subdirectories can be used."
  merge: -1
  pgno: 269
- img_proc: true
  md: "Permanent Mount Points\n\n \n\nLinux loads files systems using a file called\
    \ *etc*fstab (filesystem table), this file\n\ntells the operating system which\
    \ filesystem to load during the boot process. Any\n\nfilesystem that doesn’t have\
    \ an entry in the file will not be automatically\n\nmounted.\n\nThe *etc*fstab\
    \ is just a basic text file. Each line represent a different filesystem\n\nthat\
    \ is supposed to be mounted at startup. Each line is formatted with the name\n\
    \nof the block device, the mount point to associate it with, the type of filesystem\n\
    \nthe block device uses, mounting options and any additional information.\n\n\
    \ \n\n**Note:** *A unit configuration with an extension \".mount\" holds information*\n\
    \n*about a filesystem mount point controlled by systemd process.*"
  merge: -1
  pgno: 270
