  md: "One-Liners\n\n \n\nOne-liners are a useful composite of related commands, arguments,\
    \ and values\n\nthat combined multiple operations into one line. These one-liners\
    \ can be used in\n\nday-to-day operations to perform specific tasks or added to\
    \ automation scripts.\n\n \n\n**Remember:** *Linux commands are generally designed\
    \ to do one*\n\n*function/operation very well (core design philosophy). This means\
    \ that*\n\n*you will usually not see one command designed to do several general*\n\
    \n*functions, but it will have lots of options related to what it was designed*\n\
    \n*to do.*\n\n \n\nSystem commands\n\n \n\nThese oneliner commands are for performing\
    \ different system level operations\n\nand functions. For example, creating aliases\
    \ to other commands, monitoring\n\nprocessing, *etc.*\n\n \n\nWhen you type 'path'\
    \ it will expand the contents of the PATH variable and\n\nmake it easier to read\
    \ by displaying each item on its own line, type: alias\n\npath='echo -e ${PATH//:/\\\
    \\\\\\n}'\n\n \n\nGenerate a random password that is 20 (just change the size\
