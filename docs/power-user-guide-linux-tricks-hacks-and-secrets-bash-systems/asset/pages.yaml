  md: "Personal Opinion\n\n \n\nFirst of all if you’re getting started with Linux\
    \ for the first time, for some people\n\nit can be overwhelming at first because\
    \ of its learning curve. Realize this OS has\n\nbeen matured over several decades,\
    \ and things work a specific way for a reason.\n\nFor example, several of the\
    \ basic console editing commands also work in\n\nutilities like the vi editor.\n\
    \nWhat I am trying to say, don’t worry if you don’t understand a command or\n\n\
    concept at first. The more you work with it the more things will make sense\n\n\
    later. Don’t let the sophistication of the operating system overwhelm you.\n\n\
    The more you dig into the Linux command line tools, features, and options, I\n\
    \nhope you will see some tricks that makes you say ‘that is cool, I didn't know\
    \ you\n\ncan do that in the terminal’. To be honest, when I first started using\
    \ the Linux\n\nconsole a lot I remember being really impressed with the amount\
    \ of things you\n\ncan do with it, compared to other OSes.\n\nAs much as I will\
    \ sing the praises of Linux, but I will also criticize it for its\n\ncomplexity\
    \ for new users and its inconsistencies. Although, even in all the\n\nbeauty and\
    \ chaos that is Linux, there are many things that do feel right about it\n\nas\
    \ well. Maybe that is too much of my personal opinion, but I thought I would\n\
    \nshare so you can compare it to how you feel about it.\n\nLinux is constantly\
    \ evolving, and the developers are adding new utilities and\n\nfunctionality on\
    \ a regular basis, and this has been happening for decades. Linux\n\nseems to\
    \ have a million ways to do the same thing. Several other OSes, suffer\n\nfrom\
    \ this problem. Although the available terminal features and commands in\n\nthose\
    \ other operating systems are just not as robust as they are in Linux.\n\nYou\
    \ may feel a little overwhelmed when trying to select the right application or\n\
    \nutility for performing a specific task because there may be several great options\n\
    \nto choose from. I believe the most important thing when picking the best\n\n\
    application, utility or method of doing something is not always picking, the\n\
    \nproverbial newest shiniest toy that is currently available. It’s more important\
    \ to\n\npick a tool that feels right and makes sense to you, does what you need\
    \ it to do,\n\nand is available for the distro that you want to use.\n\nNever\
    \ forget that great tools regularly fallout of favor by the support community\n\
    \nor are no longer maintained by the developers. This happens on all platforms,"
  merge: -1
