  md: "Miscellaneous Tips\n\n \n\n**System**\n\nAccurate system time is crucial for\
    \ modern encryption and other system\n\nfunctions like logging, file management,\
    \ *etc.* If your system doesn't have\n\naccurate time, certain features may not\
    \ work correctly.\n\nSystemd provides the systemd-timesyncd.service client, which\
    \ queries\n\nremote time servers and adjusts your system time. Configure your\
    \ servers\n\nin the following file: *etc*systemd/timesyncd.conf . You manage this\
    \ service\n\nwith the command systemd-timesyncd.\n\n \n\n**Note:** *Most Linux\
    \ distros provide a default configuration that*\n\n*points to time servers that\
    \ they maintain.*\n\n**Networking**\n\n \n\nReliable and trustworthy DNS is critical\
    \ for network security. If you are\n\nusing public DNS outside an organization,\
    \ use a trusted DNS source such\n\nas: Google Public DNS (set your DNS to: 8.8.8.8\
    \ and 8.8.4.4) -OR—\n\n1.1.1.1 (set your DNS to: 1.1.1.1 and 1.0.0.1) \\[Partnership\
    \ between\n\nCloudflare and APNIC\\]."
  merge: -1
