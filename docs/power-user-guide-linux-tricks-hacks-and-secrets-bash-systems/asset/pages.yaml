    \ variable is NOT EQUAL to the value (i.e. \\[ integer1 **\\-ne**\n\ninteger2\\\
    ] ) **Ex:** var=2 && \\[ $var -ne 1 \\] && echo \"True\"\n\n**Ex:** var=2 && ((\
    \ $var != 1 )) && echo \"True\"\n\n \n\n\\-gt = Tests if the variable is GREATER\
    \ THEN the value (i.e. \\[ integer1 **\\-**\n\n**gt** integer2\\] ) **Ex:** var=2\
