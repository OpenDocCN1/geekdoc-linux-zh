  md: "Docker Commands (Version 18)\n\n \n\nThis is a list of the current docker commands\
    \ (as of the writing of this book), and\n\na description of what they do. All\
    \ of these commands need to be prefixed by the\n\ndocker command.\n\nFor example,\
    \ docker info displays information about the running Docker service.\n\n \n\n\
    For more information on a specific command, type: docker COMMAND -\n\n\\-help\n\
    \n \n\nattach : Attach local the STDIN, output, and error streams to a running\
    \ container.\n\nbuild : Build an image from a Docker file.\n\ncommit : Create\
    \ a new image from a container's changes.\n\ncp : Copy files/folders between a\
    \ container and the local filesystem.\n\ncreate : Create a new container.\n\n\
    diff : Inspect changes to files or directories on a container's filesystem.\n\n\
    events : Get real time events from the server.\n\nexec : Run a command in a running\
    \ container.\n\nexport : Export a container's filesystem as a tar archive.\n\n\
    history : Show the history of an container image.\n\nimages : List the container\
    \ images.\n\nimport : Import the contents from a tarball to create a filesystem\
    \ image.\n\ninfo : Display system-wide information.\n\ninspect : Return low-level\
    \ information on Docker objects.\n\nkill : Kill one (or more) running containers.\n\
    \nload : Load a container image from a tar archive or STDIN.\n\nlogin : Login\
    \ to a Docker registry.\n\nlogout : Logout from a Docker registry.\n\nlogs : Retrieve\
    \ the logs of a specific container."
  merge: -1
