  md: "Filesystem\n\n \n\nThese are more advanced one-liners and commands, they are\
    \ for performing\n\nfilesystem level operations and functions. For example, performance\
    \ testing your\n\nstorage system, creating logical shortcuts to files and directories,\
    \ managing files,\n\nand more.\n\n**Creating File Shortcuts (Links)**\n\n \n\n\
    There are two types of file shortcuts (aka links) that can be created in Linux,\n\
    \nthey are hard and soft links. Hard links can be created to files and directories\
    \ on\n\nthe same volume. Soft links (aka symbolic Links) can be created to files\
    \ and\n\ndirectories on different volumes.\n\nThe advantage of using links (hard\
    \ or soft) is that when you modify the link file\n\nit is like modifying the original\
    \ file, because they may exist in a different\n\nlocation then the original file.\
    \ It is just a pointer (i.e. it literally points to the file\n\non the disk) that\
    \ directs the filesystem to use the correct file.\n\n \n\nThe hard link is a separate\
    \ file which contains information about the\n\noriginal file and where it is located,\
    \ type: cp -l **file\\_name1**\n\n**file\\_name2**\n\n \n\n**Note:** *If you delete\
    \ the original file, the hard link will prevent*\n\n*the file from being deleted.\
    \ If you want to delete the file, you*\n\n*will also have to remove the hard link.*\n\
    \n \n\nAn alternative command to create a hard link, type: ln\n\n**file\\_name1\
    \ file\\_name2**\n\n \n\nIf you need to create links on a different physical drive,\
    \ you’ll have\n\nto create a soft link instead, type: cp -s **file\\_name1 file\\\
    _name2**"
