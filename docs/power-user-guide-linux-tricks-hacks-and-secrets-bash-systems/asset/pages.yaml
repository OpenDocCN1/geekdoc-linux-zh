  md: "Removing Unused Software\n\n \n\nRemoving or disabling any applications, services,\
    \ or packages that you're not\n\nusing can help protect your computer. By doing\
    \ so, you reduce the attack target a\n\nmalicious person can utilize to take over\
    \ your system.\n\nBy removing this software it also has a side benefit of freeing\
    \ up space, CPU and\n\nother system resources that would be wasted by this application.\n\
    \n \n\nNext are some commands that can help you find and remove things that you\
    \ no\n\nlonger need.\n\n \n\nList all available packages, type : sudo apt-cache\
    \ pkgnames\n\n \n\nGet a brief description of a package name, type : sudo apt-cache\
    \ search\n\n**package\\_name** Get detailed information about a package, type\
    \ : sudo apt-\n\ncache show **package\\_name** Check the dependencies for particular\n\
    \nsoftware package, type : sudo apt-cache showpkg **package\\_name** Check\n\n\
    the software package cache statistics, type : sudo apt-cache stats\n\n \n\nUninstall\
    \ software packages (keeps configuration files, for reinstall), type:\n\nsudo\
    \ apt-get remove **package\\_name** Completely Uninstall software\n\npackages\
    \ (deletes configuration files), type: sudo apt-get purge\n\n**package\\_name**"
  merge: -1
  pgno: 240
