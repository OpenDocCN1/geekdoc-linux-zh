    \ that may be\n\navailable.\n\n \n\ntermsaver is a fancy ASCII screensaver. It\
    \ includes several different\n\nscreen savers, such as the: matrix, clock, star\
    \ wars, and a couple of not-\n\nsafe-for-work ones as well. To start using this\
    \ utility, after you enter the\n\ncommand it will show a list of available options,\
    \ type: termsaver\n\n\\-OR—\n\ntermsaver clock\n\n \n\nTo install the command,\
