  md: "Partitioning Your Data\n\n \n\nWhen creating a new system, it is important\
    \ to setup multiple partitions to hold\n\ndata, this can help prevent data corruption,\
    \ and some types of system resource\n\nexhaustion attacks.\n\nFor example, if\
    \ the swap area and logs are not each on their own partition. If an\n\nattacker\
    \ tries to fill them up with some type of attack (i.e. DDoS), it could force\n\
    \nthe system to shut down or fail.\n\n \n\n**Note:** *Third party applications\
    \ should be installed on separate filesystems*\n\n*and partitions under the /opt*\
    \ *directory.*"
  merge: -1
  pgno: 239
