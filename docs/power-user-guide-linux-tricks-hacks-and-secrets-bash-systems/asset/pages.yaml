  md: "Ignore ICMP or Broadcast Requests\n\n \n\nIt is possible to tell Linux to ignore\
    \ ICMP or network broadcast requests. An\n\nattacker can use this information\
    \ to quickly check if a system exists.\n\nIt also can tell the attacker if system\
    \ has not been hardened. This is such a basic\n\nprecaution, that if you didn’t\
    \ implement this you probably have not performed\n\nother common hardening technique.\n\
    \n \n\nTo force Linux to ignore pings, type:\n\nsudo sysctl -w net.ipv4.icmp\\\
    _echo\\_ignore\\_all=1\n\n \n\nTo tell Linux to ignore broadcast requests, type:\
    \ sudo sysctl -w\n\nnet.ipv4.icmp\\_echo\\_ignore\\_broadcasts=1 .\n\n \n\n**Note:**\
    \ *When the following commands are run, they modify the*\n\n***etcsysctl.conf****\
    \ file. *To force the settings to load, type: *sudo* sysctl -p.\n\n \n\n**Tip:**\
    \ *To re-enable these features, type:* *sudo* *sysctl -w*\n\n*net.ipv4.icmp\\\
    _echo\\_ignore\\_all=0*\n\n*sysctl -w net.ipv4.*icmp\\_echo\\_ignore\\_broadcasts*\\\
    =0*"
  merge: -1
  pgno: 255
