  md: "Installing Your Distro\n\n \n\nYou can install and boot Linux on several different\
    \ classes of devices (i.e.\n\nphysical, virtual, etc.). This decision should be\
    \ made with the end goal in mind\n\ndepending on what you’re trying to achieve.\
    \ Otherwise, it should be made on the\n\nhardware you have available and is supported\
    \ by the distro you want to run.\n\nLinux is legendary for running on older hardware\
    \ that newer OSes may not\n\nsupport any more. The major consideration when installing\
    \ Linux on new\n\ncomputer hardware is the availability of drivers support for\
    \ all the devices (i.e.\n\ngraphic cards, printers, etc.) that you want to use.\
    \ You will need to make sure\n\nthat there is driver compatibility before you\
    \ install it.\n\n \n\nIoT devices (i.e. routers, single-board computer, and other\
    \ types of\n\nelectronics), such as a Raspberry Pi, or any of the hundreds of\
    \ other\n\ncompetitors. Check with the manufacture of the device to find out the\n\
    \ndistros that are available for it. Using the Raspberry Pi as an example,\n\n\
    there are several popular distros that are available for it.\n\n \n\nA physical\
    \ computer (i.e. desktop, laptop or server), using single boot\n\n(Linux only),\
    \ or dual boot (Linux and another OS like Windows). This\n\noption provides the\
    \ greatest amount of available distro choices.\n\n \n\nThere are also ‘live boot’\
    \ options for running Linux, where you can boot\n\nfrom a USB flash drive or optical\
    \ disk. This doesn’t use a system’s\n\ninternal storage device, so it can leave\
    \ no trace behind. Otherwise these\n\ndistros can also be used for trying to repair\
    \ a failed computer.\n\n \n\n**Knoppix**: One of the first Live CD distribution\
    \ to run completely\n\nfrom removable media without installation on local storage,\
    \ derived\n\nfrom Debian.\n\n \n\n**Note:** *Your system’s firmware (BIOS or UEFI)\
    \ has to be able*\n\n*support booting off of removable media (i.e. optical or\
    \ USB). Most*"
  merge: -1
  pgno: 32
- img_proc: true
  md: "*modern systems support this feature generally through a boot menu*\n\n*option.\
    \ Check with your hardware manufacturer if you have any*\n\n*issues on how to\
    \ configure this.*\n\n \n\nYou can also run a distro on a virtual machine (VM),\
    \ running off a\n\nhypervisor on a physical computer or in a cloud infrastructure.\
    \ Not all\n\ndistros maybe supported in these environments, review what is supported\n\
    \nby your hypervisor or cloud provider.\n\n \n\nThe MacOS X, and Chromebook have\
    \ native UNIX/Linux support. The\n\nMacOS X was built on top of a UNIX compatible\
    \ OS. Google recently\n\ngave the Chromebook native Linux support.\n\n \n\nWindows\
    \ 10 now offers a Linux subsystem called WSL. WSL already\n\nsupports a few popular\
    \ distros that are available for download from the\n\nWindows store."
