  md: " \n\nTo set the time on the local system, type:\n\nsudo date --set=\"**20:20:00**\"\
    \n\n \n\nDisplay an ASCII chart, type:\n\nman 7 ascii\n\n \n\n**Managing MultiUser\
    \ Systems**\n\n \n\nUNIX (and later Linux) have been multiuser systems from the\
    \ beginning of their\n\nexistence as an operating system. Linux has several utilities\
    \ and commands for\n\ndisplaying and managing logged in users.\n\n \n\nDisplays\
    \ a summary of the current logged in user(s), type: who\n\n\\-OR—\n\nusers\n\n\
    \ \n\nShow when a user last logged (including the real and effective user and\n\
    \ngroup IDs) into the system, type: last **user\\_name** -OR—\n\nlast -ap now\n\
    \n \n\nDisplay information about known users on the system (it is more robust\n\
    \nthen the who command), type: lslogins -u\n\n \n\n**Note:** *The* ***utmp, wtmp,\
    \ btmp**** files keep track of all logins and*\n\n*logouts to the system. These\
    \ files are used by the following*\n\n*commands,* *last ,* *lastb , and* *lslogins\
    \ , etc.*\n\n*utmp:* *maintains a full accounting of the current status of the*\n\
    \n*system, system boot time (used by uptime), recording user logins at*\n\n*which\
    \ terminals, logouts, system events etc.*"
