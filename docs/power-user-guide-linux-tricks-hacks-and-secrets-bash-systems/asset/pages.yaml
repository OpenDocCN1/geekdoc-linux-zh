  md: "Disabling X-Windows\n\n \n\nIf you’re running X-Windows on a production machine,\
    \ it should be removed.\n\nX-Windows adds extra overhead to the system that is\
    \ not needed, consumes\n\nextra resources (i.e. RAM, CPU, storage), and overall\
    \ can make the system less\n\nsecure.\n\n \n\nTo disable GDM, the GNOME Display\
    \ Manager, type: sudo update-rc.d -f\n\ngdm remove\n\n \n\n**Note:** *To enable\
    \ the GDM again, type:* *sudo update-rc.d -f gdm defaults*"
