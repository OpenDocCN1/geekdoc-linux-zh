  md: "Repository Maintenance\n\n \n\nOnce you have your repositories setup, you will\
    \ need to maintain (i.e. pulling,\n\npushing, merging code changes) them and to\
    \ keep them up-to-date.\n\n \n\n**Commits and Merges**\n\n \n\nThe following commands\
    \ for pulling latest commits to your local repository. As\n\nwell as merging the\
    \ changes you made back into the master reposttory so others\n\ncan access them.\n\
    \n \n\nTo update your local repository with the latest commits, type: git pull\n\
    \n \n\nFrom the working directory to fetch and merge remote changes, type: git\n\
    \nmerge **master**\n\n**Note:** *git will try to auto-merge changes. Unfortunately,\
    \ conflicts can and will*\n\n*happen. It is up to you to merge any conflicts manually\
    \ by modifying the files*\n\n*displayed by* *git . After updating them, you need\
    \ to mark them as merged, type:*\n\n*git add ****file\\_name***\n\n \n\n**Tip:**\
    \ *Before merging changes, you can also preview them by using,*\n\n*type:* *git\
    \ diff ****source\\_branch*** ***target\\_branch***\n\n \n\n**Logging**\n\n \n\
    \nThe git log command shows you the commits and the commit message history.\n\n\
    The logs are useful for finding what changes have happened and if there were\n\
    \nany errors or problems during these commits.\n\n \n\nTo review the history of\
    \ the changes made to the repository you need to"
  merge: -1
