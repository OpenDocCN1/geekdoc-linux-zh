  md: "Regular expressions\n\n \n\nThese are some basic regular expression commands\
    \ that can enhance your\n\nability to search very specific text patterns within\
    \ a document that you're\n\nworking in.\n\n \n\n. Any single character (except\
    \ newline) \\* zero or more occurrences of any\n\ncharacter \\[...\\] Any character(s)\
    \ specified in the set \\[^...\\] Any character(s)\n\nNOT specified in the set\
    \ ^ Beginning of the line (Anchor) $ End of line\n\n(Anchor) \\\\(...\\\\) Grouping\
    \ - usually used to group conditions \\\\< Beginning\n\nof word (Anchor) \\\\\
    > End of word (Anchor) \\\\n Contents of (n)th grouping\n\n**Examples: Sets \\\
    [...\\] (Medium)**\n\nSets are extensions of regular expression functionality,\
    \ can be used for fine\n\ntuning searching text. For example, it is possible to\
    \ create a set that represents all\n\ncapital letters A through Z (i.e. \\[A-Z\\\
    ] ). It is possible to create a set that\n\nrepresents all lowercase letters a\
    \ through z (i.e. \\[a-z\\] ). It is possible to create a\n\nset that represents\
    \ all capital and lowercase letters A through Z and a through z\n\n(i.e. \\[A-Za-z\\\
    ] ).\n\n \n\n\\[A-Z\\] Contains: capital letters A through Z\n\n\\[a-z\\] Contains:\
    \ lowercase letters a through z \\[0-9\\] Contains: numbers from\n\n0 to 9\n\n\
    \\[./=+\\] Contains: . (dot), / (slash), =, and +\n\n\\[-A-N\\] Contains: capital\
    \ letters A through N and the dash \\[0-9 A-Z\\]\n\nContains: all capital letters\
    \ and numbers and a space \\[A-Z\\]\\[a-zA-Z\\]\n\nContains: Capital A to Z in\
    \ the first position, and any letter in the second.\n\n \n\n**Examples: Regular\
    \ Expression (Advanced)** These are some more advanced\n\nregular expression commands\
    \ that can enhance your ability to search very\n\nspecific text patterns within\
    \ a document that you're working in. You have to be\n\nin the command mode to\
    \ use these features. For example, press the ESC key and\n\nthen type /HelloWorld/\
    \ to match all lines containing HelloWorld."
