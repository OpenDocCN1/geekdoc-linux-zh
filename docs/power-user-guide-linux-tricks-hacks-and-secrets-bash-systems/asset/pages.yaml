  md: "Advanced: Using command Substitution\n\n \n\nIt is possible to use the output\
    \ from one utility as the input to another command,\n\nthis is known as command\
    \ substitution. This output can be used as an argument\n\nfor another command,\
    \ to assign a value to a variable, or for generating the\n\nargument list for\
    \ a loop in script.\n\n \n\nTo utilize this feature, use a dollar sign followed\
    \ by a set parenthesis to\n\nsurround a command. For example, type: echo Today\
    \ is $(date)\n\n \n\nThe older form of command substitution uses backticks (\\\
    `) to surround a\n\ncommand. For example, type: echo Today is \\`date\\`"
  merge: -1
  pgno: 50
- img_proc: true
  md: "Advanced: Variable Expansion\n\n \n\nVariable expansion is when a command is\
    \ executed it replaces the variable name\n\nwith the value it contains. For example,\
    \ if you typed: echo $SHELL , it could\n\nreturn: *bin*bash . The output from\
    \ the echo command displays the results of the\n\nenvironmental variable $SHELL\
    \ .\n\n \n\n**Tip:** *The following function is handy for command and script debugging*\n\
    \n*because it will show the results of variable* *expansion. To create the*\n\n\
    *function type:* *v () { echo \"$@\"; \"$@\"; }*\n\n*To utilize the function that\
    \ was created, type:* *v *echo $SHELL\n\n \n\n**More information**\n\nSystem Layers:\
    \ Linux Distro\n\nSystem Layers: Linux OS"
  merge: -1
  pgno: 51
