  md: "Linux Everywhere\n\n \n\nLinux seems to run on everything from watches to mainframes,\
    \ and all things in\n\nbetween. A good portion of the infrastructure that runs\
    \ the Internet is Linux\n\nbased servers.\n\nThere are several different versions/variants\
    \ of the OS that run on physical\n\nservers, desktops, laptops, VMs, cloud infrastructure,\
    \ *etc.* It is also the\n\nunderlying OS for Mac OS X, iOS, Android. Most IoT\
    \ (Internet of Things)\n\ndevices, such as the Raspberry PI, and countless other\
    \ similar devices.\n\n \n\n![](img/0f524874379aa171ff08f51cdf3cfa83_23_0.png)\n\
    \n***Raspberry Pi 3 B+ single-board computer, ******Gareth Halfacree****** from\
    \ Bradford,***\n\n***UK***\n\n \n\nThe latest edition of Windows 10 now includes\
    \ a Linux subsystem, called WSL.\n\nThis allows the user to launch a Linux terminal\
    \ in the native Windows OS,\n\nwithout having to use a VM, or another product\
    \ like Cygwin."
