  md: "Interstation and Command Modes\n\n \n\nvi has two main modes, Insertion and\
    \ command mode. This section includes\n\ncore concepts that are utilized, it's\
    \ important to understand the differences\n\nbetween these two modes.\n\nThe editor\
    \ starts in command mode, in which cursor movement can happen,\n\nalong with text\
    \ pasting and deletion can occur. When in Insertion mode (in the\n\ncommand Mode,\
    \ press \"i\" or \"I\" key) is activated, the user can enter and modify\n\ntext\
    \ in the file. Pressing the ESC key (while in Insertion mode) returns the editor\n\
    \nback to command mode (for example, where you can save and quit, by typing\n\n\
    :x ).\n\nWhen in command mode most commands are executed as soon as they are\n\
    \ntyped, except for \"colon\" commands (i.e. :q! ) they're executed after you\
    \ press\n\nthe Enter key.\n\n \n\n**Quitting the program**\n\nThese commands are\
    \ for quitting the program, and save the file changes or\n\nabandoning them.\n\
    \n:x Exit, and saving changes :wq **file** Quits the program (creates a new file\n\
    \nif specified) :q! Quit (force, even if unsaved) :qa! Quit everything (force,\n\
    \neven if unsaved) **Inserting text**\n\nThese commands are for modifying text,\
    \ by inserting, appending, and replacing\n\nit. You have to be in the command\
    \ mode to use these features.\n\ni Insert before cursor I Insert before line a\
    \ Append after cursor A Append\n\nafter line o Open new line after the current\
    \ line O Open new line before\n\nthe current line r Replace one character R Replace\
    \ many characters\n\n**Cursor Movement**"
  merge: -1
  pgno: 70
