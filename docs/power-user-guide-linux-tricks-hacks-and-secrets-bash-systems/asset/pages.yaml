  md: "Getting Started\n\n \n\n**Overview:** This book focuses on the Linux command\
    \ line. It doesn't provide any\n\nhelp for X-Windows the Linux GUI (graphical\
    \ user interface). There are a few\n\nmentions of it, but it is not the primary\
    \ focus.\n\n \n\nThe content of this book is written for the BASH (short for Bourne-Again\
    \ Shell)\n\nshell. This book doesn’t try to favor one distro over another, it\
    \ tries to be more\n\ngeneral in then specific whenever possible.\n\nThe one drawback\
    \ to writing the book this way, is that I may not be targeting the\n\nversion\
    \ of Linux that you’re using now. If you want a book that targets a specific\n\
    \ndistro, then I would recommend another resource.\n\nPlease note, depending on\
    \ the distribution (aka Distro) you could be using\n\nanother shell (i.e. csh,\
    \ tcsh, ksh, ash, zsh, etc.). If you are in another shell, from\n\nthe console\
    \ just type the command bash and press Enter to start it.\n\nIf you are running\
    \ X-Windows just start the command terminal, often known as\n\nthe terminal or\
    \ console. Otherwise you can exit the GUI all together, and\n\nhopefully it will\
    \ put you at the command line. If not you will have to lookup\n\nhow to do this\
    \ for your Distro."
  merge: -1
  pgno: 22
