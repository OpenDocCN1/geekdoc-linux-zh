  md: "Storage Management\n\n \n\n**Overview:** Linux provides a robust set of utilities\
    \ for managing storage devices.\n\nThis section provides a high-level overview\
    \ of these commands, and a synopsis\n\nof how storage is utilized by the filesystem.\n\
    \n \n\nStorage Overview\n\nLayer 4: **File and directories** Layer 3: **Filesystem**\
    \ (i.e. EXT4, etc.)\n\nLayer 2: **Partition** (i.e. MBR or GPT) \\[Optional: Abstraction\n\
    \nsublayer, such as RAID, LUN, etc.\\]\n\nLayer 1: **Storage** (Physical or Virtual)\
    \ Layer 0: **Infrastructure** (i.e.\n\nHardware, VM, Cloud, IoT, etc.) **Block\
    \ Storage**\n\n \n\nThe first key concept is called 'block storage' or known by\
    \ the kernel as a 'block\n\ndevice'. A block device, can be a traditional spinning\
    \ disk like a hard drive\n\n(HDD), or solid-state storage device such as an SSD\
    \ or USB flash drive.\n\nThe kernel stores and retrieves data from these devices\
    \ in fixed sized units of\n\nstorage called 'blocks'. This is just a different\
    \ way to think about traditional\n\nstorage attached to the computer that is access\
    \ by the filesystem.\n\nWhen the filesystem partitions a storage device, it segments\
    \ the available storage\n\non the device into smaller units. So let’s say you\
    \ have a storage device that has 1\n\nterabyte of storage. Instead of storing\
    \ everything in a 1TB drive, it is possible to\n\nsplit the local storage into\
    \ two 512 gigabyte partitions, and make it look like to\n\ndifferent disks to\
    \ the filesystem. This allows you to logically separate the data.\n\nFor example,\
    \ on the first partition is the OS and applications, and on the second\n\npartition\
    \ is your data.\n\n \n\n**Partition**\n\n \n\nWhen you create a partition, you\
    \ have to create a partition table, which is an\n\nindex of all the data and where\
    \ it is stored in that partition. There are few\n\ndifferent types of partition\
    \ tables."
  merge: -1
  pgno: 266
- img_proc: true
  md: "There is an older one that has modern limitations due to its age, and offers\n\
    \nbackwards compatibility with older filesystems. There is a newer one that\n\n\
    overcomes the technical limitations of the previous one, but offers forward\n\n\
    compatibility with newer filesystems.\n\n \n\nMBR (Master Boot Record), has been\
    \ around for several decades and it is\n\nstill utilized by older applications,\
    \ but only allows for four primary\n\npartitions, and the partition size can’t\
    \ be greater then 2TB. It is possible to\n\nsubdivide a primary partition into\
    \ smaller logical partitions, called an\n\nextended partition.\n\n \n\nGPT (GUID\
    \ Partition Table) is a more modern standard, and overcomes\n\nthe limitation\
    \ of MBRs. Although, it requires newer hardware and\n\nfirmware in order to support\
    \ these features. Most modern hardware should\n\nhave no problem utilizing it.\n\
    \n \n\nIn most cases if you have to make a selection between the two types of\
    \ partition\n\ntables. GPT is going to be your better choice because of the forward\
    \ support.\n\nUnless you have a need to support older applications or hardware\
    \ that is not\n\ncompatible with the newer file system.\n\n \n\n**Filesystem**\n\
    \nOnce the storage device is properly partitioned, it needs to be formatted for\
    \ the\n\nfilesystem to actually utilize it. Formatting prepares the partitioned\
    \ area for the\n\nstorage device to hold data. Without the formatting you can’t\
    \ store data on the\n\ndevice.\n\nLinux supports several different filesystems,\
    \ each has their advantages and\n\ndisadvantages, including operating system support.\
    \ At the highest level most\n\nfiles systems operate the same (i.e. managing files),\
    \ it is how they perform\n\noperations at lower-levels that differentiates them.\
    \ For example, commands and\n\nrelated mechanisms used to perform the maintenance\
    \ operations can be different."
  merge: -1
  pgno: 267
- img_proc: true
  md: "The current most popular Linux filesystems, are:\n\n \n\nBTRFS: is a newer\
    \ filesystem, which utilizes copy-on-write technology.\n\nThis architecture allows\
    \ for volume management functionality to be\n\nhandled at the filesystem level.\
    \ This allows for features such as, snapshots\n\nand the cloning of volumes. The\
    \ problem with the filesystem is the lack of\n\nmaturity. Some administrators\
    \ are waiting for problems to be fixed before\n\nits ready for production workloads.\n\
    \n \n\nEXT4: this is the forth extension of the filesystem, and it tends to be\
    \ the\n\ndefault choice when formatting a volume. EXT4 is a mature journaling\n\
    \nfilesystem that offers backwards compatibility with legacy systems. It has\n\
    \na very extensive utility support, and has a good track record for reliability.\n\
    \n \n\nXFS: Is designed for performance when dealing with very large data files.\n\
    \nIt has better throughput characteristics when dealing with large storage\n\n\
    devices. It also supports features like snapshotting. Unlike EXT4, it uses\n\n\
    metadata journaling as opposed to journaling both the metadata and data.\n\nXFS\
    \ offers great performance, but is very sensitive to data corruption if\n\nthere\
    \ is a power loss.\n\n \n\nZFS: utilizes a copy-on-write filesystem and has a\
    \ mature and robust\n\nvolume manager. It supports data integrity features, can\
    \ handle large files\n\nsizes and includes features like snapshotting, cloning,\
    \ and a software\n\nRAID support for redundancy and performance purposes. ZFS\
    \ does have a\n\ncontroversial history because of licensing concerns. It also\
    \ has mixed\n\nsupport among different distros."
  merge: -1
  pgno: 268
