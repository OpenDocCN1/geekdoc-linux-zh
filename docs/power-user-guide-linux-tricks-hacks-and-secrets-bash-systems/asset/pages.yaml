  md: "Locking Down SSH\n\n \n\nMake sure to lock down ssh (Secure Shell) configuration\
    \ used for remote\n\nmanagement. Otherwise an attacker can utilize this service\
    \ to their advantage for\n\ntaking over a system remotely.\n\nTo lock it down\
    \ you have to open the main ssh configuration file, verify, add or\n\nchange the\
    \ following items: Disable root Login:\n\nPermitRootLogin no\n\n \n\nOnly allow\
    \ specific users:\n\nAllowUsers **user\\_name** Only use the ssh version 2 Protocol:\
    \ Protocol 2\n\n \n\n**Note:** *There are two ways to display a message when a\
    \ user logs*\n\n*into a system. First, there is the* ***etcissue.net**** file\
    \ that displays a*\n\n*message banner before the user gets a login prompt. Second,\
    \ there*\n\n*is the* ***etcmotd**** file that displays a message banner after\
    \ the user*\n\n*has logged in.*\n\n*To implement this type of user notification,\
    \ open the* ssh\n\n*configuration file, type:* *nano etcssh/sshd\\_config* *Then\
    \ search for*\n\n*the word\" Banner \". Update the line to look like:* *Banner*\n\
    \n*etcissue.net .*\n\n*Restart the* ssh* process, type:* *etcinit.d/sshd restart*"
  merge: -1
  pgno: 245
