  md: "Exit Status Codes\n\n \n\nEvery command has an exit status code that can influence\
    \ the behavior of other\n\nshell commands. If a command completes normal or successfully,\
    \ it has an exit\n\nstatus code of zero for, and non-zero for failure, error,\
    \ *etc.*\n\nFor example, if there is a file call myfile1.txt , and you type: cat\
    \ myfile1.txt it\n\nwould have an exit status code of **0** if it completed successfully.\
    \ Although if by\n\nmistake you type: cat myfile.txt by mistake. It would have\
    \ an exit status code of\n\n**1** if it completed unsuccessfully. To see the exit\
    \ status code of the last command\n\nyou have to check the following system variable:\
    \ $? .\n\n \n\nTo see the status of the last command, type:\n\necho $?\n\n \n\n\
    To test the exit status code to see if it was successful or not, type: if \\[\
    \ $? -\n\neq 0 \\]; then echo success; else echo failure; fi If you want to control\
    \ the\n\nexit status code of a custom script or function. It is possible to pass\
    \ it after\n\nthe code completes running. The exit command accepts integers from\
    \ 0 -\n\n255, in most cases 0 and 1 will suffice. Although, there are reserved\
    \ status\n\nexit codes that can be used for more specific errors.\n\n \n\n**Notes:**\
    \ *The man page for each command should indicate the various exit*\n\n*status\
    \ codes and their meaning.*\n\n*Builtin commands return exit status codes, as\
    \ does an executed shell*\n\n*function.*\n\n \n\n*Below are the reserved exit\
    \ codes numbers, and their general meaning* *1*\n\n*This is a catch-all general\
    \ error. Used for miscellaneous error, such*\n\n*as \"divide by zero\" or other\
    \ impermissible operation.*\n\n*2* *Misused shell builtins. Such as a missing\
    \ keyword or command, or*"
