  md: "Commands and Functions\n\n \n\nBASH allows you to group similar commands together\
    \ into one line using a\n\nspecial separators. Some of these will run the commands\
    \ in order, and others\n\nwill have different results if one command fails or\
    \ succeeds. It all depends on the\n\nseparator that is used.\n\nThe examples below,\
    \ show commands can be executed using different types of\n\nseparators to control\
    \ the order in which they are executed.\n\n \n\nRun multiple commands in a single\
    \ line (separate with ';' semicolon),\n\nexample: command\\_1; command\\_2; command\\\
    _3\n\n \n\nOnly run the next command if the first command is successful, example:\n\
    \ncommand\\_1 && command\\_2\n\n \n\nOnly run the next command if the first command\
    \ fails, example:\n\ncommand\\_1 || command\\_2\n\n \n\nTo automatically answer\
    \ a prompt, pipe in the response. For example\n\n(send the letter 'y' into a command\
    \ or script): y | some\\_command It is easy\n\nto create custom commands by grouping\
    \ together other commands inside a\n\nfunction. To call the function all you have\
    \ to do is type its name and pass\n\narguments in to it.\n\nIn the examples below,\
    \ create the function by typing the first line, then type the\n\nfunction name\
    \ to execute it (i.e. red, green, or blue) and type the text you want to\n\ndisplay.\n\
    \n \n\n**Notes:** *These functions can be placed into a script, and utilized from\
    \ the*\n\n*command line as well. These functions will only exists as long as the\
    \ shell*\n\n*is active and in memory, unless it is added it the* ~/.bashrc* file.*"
