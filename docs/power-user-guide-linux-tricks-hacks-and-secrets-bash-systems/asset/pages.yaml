  md: "Preparing a Second Drive\n\n \n\n**Prerequisites:** *This section requires\
    \ that you have root permissions on*\n\n*the system to install services and make\
    \ changes to the OS.*\n\n \n\nAs stated earlier in the book, in Linux (and other\
    \ Unix-like operating systems),\n\nthe entire system, regardless of how many physical\
    \ storage devices are involved,\n\nare represented by a single tree structure.\
    \ When a filesystem on a drive or\n\npartition is mounted to the system, it must\
    \ be join into the existing tree.\n\nMounting is the process of attaching a formatted\
    \ partition or drive to a directory\n\nwithin the Linux filesystem. The drive's\
    \ contents can then be accessed from that\n\ndirectory.\n\nTo mount a drive follow\
    \ the next steps:\n\n \n\nTo display the available disks, type:\n\nls -l *dev*sd\\\
    *\n\n \n\n**Note:** *devsda* *is the first physical disk, and* *devsda1* *is partition\
    \ 1*\n\n*devsdb is the second physical disk, and* *devsdb1 is partition 1*\n\n\
    \ \n\n**Tip:** *If the local storage you're trying to mount needs formatting,*\n\
    \n*and it already is mounted, it needs to be unmounted first, type:*\n\n*sudo\
    \ umount -f \\[mount\\_point\\]*\n\n*(If you don't know the name of the mount\
    \ point, to see a list of local*\n\n*storage and mount points, type:* *mount )*\n\
    \n \n\nPrepare (partition and format) the mount point, type: sudo fdisk *dev*sdb\n\
    \n( Type the following options: **n** (new part), **p** (primary), **1**, **\\\
    [enter\\]**,\n\n**\\[enter\\]**, **w**)."
  merge: -1
