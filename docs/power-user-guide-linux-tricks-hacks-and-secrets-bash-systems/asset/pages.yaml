  md: "Wildcards and Regular Expression\n\n \n\n**Overview:** This chapter provides\
    \ an overview of Wildcards and Regular\n\nExpressions. Wildcards are used to give\
    \ you the ability to substitute one or more\n\ntext characters. While Regular\
    \ Expressions gives you the ability to write an\n\nexpression to match text patterns.\n\
    \n \n\nWildcards give you the ability to substitute one or more characters in\
    \ a string of\n\ncharacters. These patterns that are replaced tend to be very\
    \ simple.\n\nFor example, if there were three files that you wanted to delete,\
    \ with the\n\nfollowing filenames: file1.txt, file2.txt, file3.txt . The command\
    \ rm file**?**.txt ,\n\nwould delete these files. The ‘?’ (question mark) is a\
    \ wildcard for any single\n\nletter or number.\n\nRegular Expression gives you\
    \ the ability to write an expression to match string\n\npatterns of characters\
    \ in a file or program output (i.e. STDOUT). These patterns\n\ntend to range from\
    \ simple to very complex, depending on what you’re trying to\n\nmatch.\n\nExamples\
    \ of some Regular Expression pattern matching will be discussed in\n\nmore depth\
    \ later in this section. Although, this is only a primer meant to give\n\nyou\
    \ a brief introduction to the technology."
  merge: -1
  pgno: 108
- img_proc: true
  md: "Wildcards\n\n \n\nWildcards are very often used in the selection of a set of\
    \ files that have a similar\n\nname to perform some type of file operation. Although,\
    \ other applications use\n\nwildcards for searching other types of data as well.\n\
    \nThere two types wildcard operators:\n\n \n\n**?** = represents only one character\
    \ \\[a-z\\],\\[A-Z\\], \\[0-9\\]\n\n \n\n**Example:**\n\nchmod **777 ???file**\
    \ (Effects files in the current directory with names\n\nlike: 001file, 002file,\
    \ etc.) **\\*** = represents one or more characters \\[a-\n\nz\\],\\[A-Z\\], \\\
    [0-9\\]\n\n \n\n**Example:**\n\nchmod **777 \\***\n\n(Effects all files in the\
    \ current directory)"
  merge: -1
  pgno: 109
- img_proc: true
  md: "Regular Expression\n\n \n\nRegular Expression often referred to as RegEx for\
    \ short, allows you to write\n\nsimple or complex search patterns that can match\
    \ strings in a file's name, data in\n\na file (i.e. logs), *etc.* RegEx can be\
    \ very powerful, and very confusing until you\n\nget used to it. If it doesn’t\
    \ make sense first, keep working with it.\n\n \n\n**Example:**\n\n**^\\\\D+\\\\\
    d{4}.jpg** MATCHES** PICP0119.jpg*** (or any other four-digit*\n\n*number preceded\
    \ by at least one non-digit character).*\n\n \n\nThis subchapter, only provides\
    \ a very brief introduction to the RegEx, if you\n\nwould like to learn more about\
    \ it, I would like to refer you to the many great\n\nreferences that are available.\n\
    \n \n\n**Note:** *There are a few different variants of RegEx, so this reference\
    \ may*\n\n*not properly align with all versions that are available. Although,\
    \ it should*\n\n*provide enough general reference that you can apply what you\
    \ learn from*\n\n*it.*\n\n \n\n**Token**\n\n**Description**\n\n**Example**\n\n\
    **(a|b)**\n\nCharacters a or b (Groups and\n\nRanges)\n\n**(?:...)**\n\nPassive\
    \ (non-capturing) group\n\n(Groups and Ranges)\n\n**\\\\n**\n\nnth group/subpattern\
    \ (Groups\n\nand Ranges)\n\n^\n\n\\-or-\n\n**\\\\A**\n\nThe caret sign is used\
    \ as an\n\nanchor to search the start of a\n\nstring. (Anchor)\n\n**^abc** matches\
    \ ‘**abc**def’ OR\n\n‘**abc**123’, NOT ‘123abc’"
  merge: -1
