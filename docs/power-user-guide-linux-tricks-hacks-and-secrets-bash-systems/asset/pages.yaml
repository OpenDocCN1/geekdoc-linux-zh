  md: "Linux Diagnostics Tools\n\n \n\nThe following tools provide a brief overview\
    \ of some of the tools that you can\n\nuse to help you check your system. These\
    \ tools can help you isolate different\n\ntypes of problems with the hardware,\
    \ OS, and filesystem.\n\n \n\nUse the following command to check if your keyboard\
    \ is working\n\nproperly, or to display an ASCII code for a pressed key, type:\
    \ showkey -a\n\n \n\n**Note:** *Press Ctrl+D to stop the program from running.*\n\
    \n \n\nForce a filesystem check on the next boot of the computer, type: sudo\n\
    \ntouch /forcefsck\n\n \n\nDisplay if there is any unwritten data waiting to be\
    \ written to disk, type:\n\ngrep ^Dirty *proc*meminfo\n\n \n\n**Note:** *This\
    \ is useful to know if you have to reset your system, but*\n\n*you still have\
    \ enough control to get this information. This would*\n\n*tell you have if you\
    \ might have some data loss.*\n\n \n\n**Stress Test the CPU**\n\n \n\nIf you want\
    \ to put a heavy CPU load on all the cores of the processor, the\n\nfollowing\
