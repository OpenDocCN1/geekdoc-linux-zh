    \ for looping. Each method of\n\nlooping has its advantages and disadvantages\
    \ for different situations. When\n\nprograming, you will have consider what condition\
    \ you’re testing for, and how\n\nyou want it to be handled.\n\n \n\n**For Loop\
    \ (Variable)**\n\n \n\nThe FOR loop generally will continue until a certain number\
    \ of operations are\n\ncompleted. Any code between the FOR and DONE command will\
    \ be repeated.\n\nOnce the number of iterations is completed, it will drop out\
    \ of the loop."
