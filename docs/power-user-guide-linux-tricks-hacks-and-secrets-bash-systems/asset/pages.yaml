    \ how many cores it has. Just repeat the command in the curly\n\nbrackets as many\
    \ times for the number of threads you want to produce (the\n\ndefault is 4 threads),\
    \ type: fullload() { dd if=*dev*zero of=*dev*null | dd if=*dev*zero\n\nof=*dev*null\
    \ | dd if=*dev*zero of=*dev*null | dd if=*dev*zero of=*dev*null & }; fullload;\n\
