    \ group talked about earlier. If not, you will need to\n\nprefix the docker command\
    \ with the sudo command.\n\n \n\nThe Docker command syntax looks like:\n\ndocker\
    \ \\[option\\] \\[command\\] \\[arguments\\]\n\n \n\nTo check if Docker is running\
    \ and the connectivity is working properly,\n\ntype: docker run hello-world\n\n\
