  md: "Installing PHP\n\n \n\n**Overview:** This section provides instructions on\
    \ how to install the PHP engine.\n\nPHP is a server side scripting language utilized\
    \ to generate files (mostly web\n\npages) to respond to HTTP requests from clients\
    \ or remote systems.\n\n \n\nThe PHP language is designed for Web development,\
    \ but also can be used as a\n\ngeneral-purpose programming language. PHP originally\
    \ stood for Personal\n\nHome Page, but it now stands for the recursive acronym\
    \ PHP: Hypertext\n\nPreprocessor.\n\n \n\n**Prerequisites:** *This section assumes\
    \ that the Apache and MySQL services*\n\n*are working and configured properly.\
    \ This includes that you have root*\n\n*permissions on the system to install the\
    \ PHP engine.*\n\n \n\nInstall the PHP engine and the additional helper packages\
    \ that are needed\n\nfor accessing the Apache and MySQL services, type: sudo apt-get\
    \ install\n\nphp libapache2-mod-php php-mysql Modify Apache to accept index.php\n\
    \nfile, type: sudo nano *etc*apache2/mods-enabled/dir.conf In nano on the\n\n\
    line below (i.e. DirectoryIndex ) , move the PHP index file (i.e.\n\nindex.php\
    \ ) to the first position: <IfModule mod\\_dir.c>\n\nDirectoryIndex index.php\
    \ ...\n\n</IfModule>\n\n \n\n(To save the file and exit the editor, press **Ctrl+X**,\
    \ type: **y** and press Enter)\n\nThen restart the Apache service, type:\n\nsudo\
    \ systemctl restart apache2\n\n \n\nTo check the status of the service, type:\n\
    \nsudo systemctl status apache2"
