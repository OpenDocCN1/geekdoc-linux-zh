  md: "Securing the phpMyAdmin Console\n\n \n\n**Overview:** This section is a practical\
    \ introduction to the .htaccess file. The\n\n.htaccess file allows you to override\
    \ the default Apache settings, by applying the\n\ncommands/instructions in this\
    \ file. Even if you don't need to utilize this feature\n\nfor phpMyAdmin, it will\
    \ give you information you can later apply to web\n\nsites/apps at a later time.\n\
    \n \n\n**Prerequisites:** *This section assumes that your Apache, MySQL, PHP and*\n\
    \n*PHPMyAdmin are working and configured properly. This includes your*\n\n*firewall\
    \ settings, and that you have root permissions on the system.*\n\n \n\nYou need\
    \ to enable the use of the .htaccess file to override the Apache\n\nconfiguration\
    \ settings. You do this by modifying the *etc*apache2/conf-\n\navailable/phpmyadmin.conf\
    \ file.\n\n \n\nAdd the following line ' AllowOverride All ' in the following\
    \ section:\n\n<Directory *usr*share/phpmyadmin> , type: sudo nano *etc*apache2/conf-\n\
    \navailable/phpmyadmin.conf <Directory *usr*share/phpmyadmin>\n\nAllowOverride\
    \ All\n\n...\n\n \n\n(To save the file and exit the editor, press **Ctrl+X**,\
    \ type: **y** and press Enter)\n\nRestart the Apache service, type:\n\nsudo systemctl\
    \ restart apache2\n\n \n\nTo apply the security permissions you need to create\
