  md: "**Security Overview**\n\nLayer 8: **System Backups** (Last line of defense,\
    \ needs regular\n\ntesting) Layer 7: **Applications/Services** (i.e. Needs patching\n\
    \n\\[Docker, web services, database\\]) Layer 6: **User Security** (i.e.\n\nenforce\
    \ strong passwords, and rotate regularly) Layer 5: **Filesystem**\n\n(i.e. Reduce\
    \ file permission privileges, encrypt data) Layer 4:\n\n**Network/Firewall** (i.e.\
    \ Block unnecessary ports, encrypt\n\ncommunications) Layer 3: **Operating System**\
    \ (i.e. Needs patching)\n\nLayer 2: **Infrastructure** (i.e. Needs patching \\\
    [hardware,\n\nhypervisors, switches, VMs, etc.\\]) Layer 1: **Perimeter** (i.e.\
    \ Needs\n\nmonitoring \\[routers/firewall\\]) Layer 0: **Public Network** (i.e.\n\
    \nInternet) \\[No Protection\\]\n\n \n\nI would encourage more reading on this\
    \ subject if you have time."
