  md: "Advanced Firewall Operations\n\n \n\nThis section covers advanced firewall\
    \ operations such as backing up, exporting\n\nand reimporting firewall rules sets\
    \ into other systems. It also covers the basics of\n\nblock some types of network\
    \ attacks with a firewall that involves invalid\n\npackets.\n\nYou can leverage\
    \ the knowledge from this section to block more modern and\n\nadvanced threats\
    \ that are constantly changing every day.\n\n \n\n**Exporting and Reimporting\
    \ Firewall Rules** It is possible to export the existing\n\nfirewall rules, then\
    \ edit and then reimport them. Use the first command to dump\n\nthe current rules,\
    \ you can edit them, and then you can upload the edited rules\n\nback into the\
    \ firewall.\n\nThis is also a good way to back up a set of rules that work properly,\
    \ and/or\n\nimport them on another system.\n\n \n\nTo export the firewall rules,\
    \ type:\n\nsudo iptables-save > ip\\_tables\\_v4.rules\n\n \n\nTo import the firewall\
    \ rules, type:\n\nsudo iptables-restore < ip\\_tables\\_v4.rules\n\n \n\n**Note:**\
    \ *The IPv6 equivalents of these commands are:* *ip6tables-save* *and*\n\n*ip6tables-restore.*\n\
    \n \n\nBlocking invalid TCP packets\n\n \n\nThere are some rules that you can\
    \ use to block invalid TCP packets. This feature\n\nhelps protect your system\
    \ from certain types of attacks.\n\nThe TCP module supports an argument called\
    \ --tcp-flags that allows for the"
  merge: -1
  pgno: 264
- img_proc: true
  md: "monitoring of individual TCP flags. This argument takes two values: \"mask\"\
    \ and\n\na set of \"compared flags\". The mask tell the firewall which flags that\
    \ should be\n\nchecked, while the compared flags directs which of the flags should\
    \ be checked\n\nin the packet.\n\n \n\nDrops all packets that contain the following\
    \ flags (utilized by a Christmas\n\ntree attack), type: sudo iptables -A INPUT\
    \ -p tcp -m tcp --tcp-flags ALL\n\nFIN,PSH,URG -j DROP\n\n \n\nDrops all packets\
    \ that contain the following flags (drops invalid SYN, and\n\nFIN packets), type:\
    \ sudo iptables -A INPUT -p tcp -m tcp --tcp-flags\n\nSYN,FIN SYN,FIN -j DROP"
  merge: -1
  pgno: 265
