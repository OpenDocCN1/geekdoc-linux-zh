  md: "Installing SSL Certificate\n\n \n\n**Overview:** Let's Encrypt is a Certificate\
    \ Authority (CA) that provides free\n\nTLS/SSL certificates, that allow you to\
    \ enable encrypted HTTPS communication\n\non your web server(s). HTTPS is critical\
    \ to the security of your site and users.\n\n \n\nSearch engines like Google give\
    \ higher priority in the search results to sites that\n\nsupport encrypted communications.\n\
    \n \n\n**Prerequisites:** *A server running a recent version of Linux and apache.*\n\
    \n*A fully registered domain name, i.e. example.com.*\n\n*DNS 'A records' (and\
    \ 'CNAME record', which is optional) that point to*\n\n*your server's public IP\
    \ address. i.e.: example.com (123.321.123.321),*\n\n*www.example.com** (123.321.123.321).*\n\
    \n \n\n**Installing Certbot**\n\nEFF's Certbot can automatically enable HTTPS\
    \ on your website by deploying\n\nLet's Encrypt certificates. You might ask why\
    \ you may need Certbot to help you.\n\nFirst, it automates the process of requesting\
    \ installing the certificate, this can\n\nrelieve you of that administration.\n\
    \nSecond, the Let's Encrypt Certificate has a hard coded lifetime of 90 days,\
    \ before\n\nthey have to be renewed. The Certbot takes care of the renewal process\n\
    \nautomatically. This feature is designed to help prevent a malicious person or\n\
    \ngroup from abusing the certificate if they are able to get a hold of it.\n\n\
    \ \n\nTo install the Certbot repository, type:\n\nsudo add-apt-repository ppa:certbot/certbot"
  merge: -1
  pgno: 216
- img_proc: true
  md: " \n\nTo install Certbot's Apache package, type:\n\nsudo apt-get install python-certbot-apache\n\
    \n \n\nOpen the virtual host file for the domain, type: sudo nano\n\n*etc*apache2/sites-available/example.com.conf\
    \ Find the **ServerName**, it\n\nshould look like the example: ...\n\nServerName\
    \ example.com;\n\n...\n\n \n\n**Note:** *If it doesn't match, update the file\
    \ and save the changes.*\n\n \n\nTo verify the syntax of your configuration edits,\
    \ type: sudo apache2ctl\n\nconfigtest\n\n \n\n**Note:** *If there is an error,\
    \ reopen the virtual host file and check for*\n\n*mistakes (i.e. typos, missing\
    \ characters, etc.).*\n\n \n\nTo reload apache service to force the loading of\
    \ the new configuration,\n\ntype: sudo systemctl reload apache2\n\n \n\n**Allow\
    \ HTTPS through the Firewall**\n\n \n\nYou need to make sure the HTTPS ports (TCP/443)\
    \ are open in the firewall in\n\norder for remote systems to communicate with\
    \ the service.\n\n \n\nCheck the current status of the firewall status, type:\
    \ sudo ufw status\n\n \n\nTo clear out the old firewall configuration (if it exists)\
    \ and replace it with"
  merge: -1
  pgno: 217
- img_proc: true
  md: "a new one, type: sudo ufw delete allow 'Apache'\n\nsudo ufw allow 'Apache Full'\n\
    \n \n\nTo check the current firewall status, type:\n\nsudo ufw status\n\n \n\n\
    **Obtaining an SSL Certificate**\n\nCertbot provides a variety of ways to obtain\
    \ SSL certificates through plugins.\n\nThe Apache plugin will take care of reconfiguring\
    \ Apache and reloading the\n\nconfig whenever necessary.\n\n \n\nTo use this plugin,\
    \ type:\n\nsudo certbot --apache -d example.com -d www.example.com If this is\n\
    \nyour first time running certbot, you will be prompted to enter an email\n\n\
    address and agree to the terms of service. After doing so, certbot will\n\ncommunicate\
    \ with the Let's Encrypt server, then run a challenge to verify\n\nthat you control\
    \ the domain you're requesting a certificate for.\n\nIf that's successful, certbot\
    \ will ask how you'd like to configure your HTTPS\n\nsettings. Select your choice\
    \ then hit ENTER. The configuration will be updated,\n\nand Apache will reload\
    \ to pick up the new settings.\n\nYour certificates are downloaded, installed,\
    \ and loaded. Try reloading your\n\nwebsite using https:// and notice your browser's\
    \ security indicator. It should\n\nindicate that the site is properly secured,\
    \ usually with a green lock icon.\n\n \n\n**Tip:** *If you test your server using\
    \ the SSL Labs Server Test*\n\n*(**https://www.ssllabs.com/ssltest/**), it should\
    \ give your site an A grade.*\n\n**Verifying Certbot Auto-Renewal**"
  merge: -1
  pgno: 218
- img_proc: true
  md: "As stated earlier Let's Encrypt certificates are only valid for ninety days.\
    \ This is\n\nto encourage users to automate their certificate renewal process.\
    \ The certbot\n\npackage that was installed takes care of this for you by adding\
    \ a renew script to\n\nthe *etc*cron.d . This script runs twice a day and will\
    \ automatically renew any\n\ncertificates that are about to expire within next\
    \ thirty days.\n\n \n\nTo test the renewal process, type:\n\nsudo certbot renew\
    \ --dry-run\n\n \n\nWhen necessary, Certbot will renew your certificates and reload\
    \ Apache to pick\n\nup the changes. If the automated renewal process ever fails,\
    \ Let’s Encrypt will\n\nsend a message to the email you specified, warning you\
    \ when your certificate(s)\n\nare about to expire."
  merge: -1
  pgno: 219
