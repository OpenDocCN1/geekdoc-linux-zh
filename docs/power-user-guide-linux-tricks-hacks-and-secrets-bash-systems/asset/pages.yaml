  md: " \n\nAnother key concept in git is called Branching. The master branch is known\
    \ as\n\nthe DEFAULT branch when you create a repository. Branching allows a user\
    \ to\n\nmake an isolated copy of a feature to develop it locally, then later merge\
    \ it back\n\ninto the master branch when it is completed.\n\n \n\nTo create a\
    \ new branch named new\\_feature , and then switch to it, type:\n\ngit checkout\
    \ -b **new\\_feature** To switch back to the master branch, type:\n\ngit checkout\
    \ master\n\n \n\nTo delete the branch that was created, type:\n\ngit branch -d\
    \ **new\\_feature**\n\n**Note:** *A branch is not available to others unless you\
    \ push the branch to the*\n\n*remote master repository, type:* *git push origin\
    \ ****new\\_feature***"
