- img_proc: true
  md: "Like If - Then Statement there are two ways to write this code, the short form\n\
    \nand long form. The short form is used from a command line. While the long\n\n\
    form is used inside of a script.\n\n \n\nThe short form uses semicolons \\[;\\\
    ] as separators, instead of new lines, and looks\n\nlike this: for VARIABLE in\
    \ LIST...; do commands...; done The long form\n\nutilizes indenting to make the\
    \ code more readable (this is a highly recommended\n\ntechnique), looks like this:\
    \ for VARIABLE in LIST... do\n\nCOMMANDS...\n\ndone\n\n \n\nExample #1 (*Displays:\
    \ 1 iteration, 2 iteration, 3 iteration)* for i in 1 2 3;\n\ndo echo $i iteration;\
    \ done Example #2 (*Displays: 0-9*) for ((i=0; i < 10; i++)) do\n\necho $i\n\n\
    done\n\n \n\n**While Loop (*****Displays: 0-9*****)** The way the WHILE loop works,\
    \ it will continue\n\nwhile a certain condition exists. Any code between the WHILE\
    \ and DONE\n\ncommand will be repeated.\n\nIn the next example, the condition\
    \ is $x is less than 10. When $x is greater than\n\nor equal to 10, the loop will\
    \ exit.\n\n \n\nx=0\n\nwhile \\[ $x -lt 10 \\]\n\ndo\n\necho $x\n\nx=$(( $x +\
    \ 1 ))\n\ndone\n\n \n\n**Note:** *There are two loop control commands, to help\
    \ manage loop*\n\n*iteration. The* *continue command stops the current loop iteration\
    \ and*\n\n*begins the next; the* *break command exits the loop currently being*\n\
    \n*executed.*"
