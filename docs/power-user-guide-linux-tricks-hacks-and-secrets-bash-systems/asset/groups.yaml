  - "[PAGE 178]\n\n \n\n**Note:** *The AT scheduling daemon (or service) must be running\
    \ for*\n\n*this command to work.*\n\n \n\n**CRONTAB Scheduler**\n\n \n\nThe second\
    \ command is crontab , this command is more robust then the AT\n\nservice. The\
    \ crontab command, can run jobs at regular intervals. That will be one\n\nof the\
    \ main differentiators when choosing which scheduler you want to use.\n\nThe first\
    \ thing you have to learn when using crontab is the command has six\n\narguments.\
    \ Arguments one thru five, defines the date and time the command is\n\nsupposed\
    \ to be execution. The sixth argument defines the command or script to\n\nbe executed.\n\
    \n \n\n**Note:** *The* crontab *syntax are as following: \\[Minute (0-59)\\] \\\
    [hour (0-23)\\]*\n\n*\\[Day\\_of\\_the\\_Month (1-31)\\] \\[Month\\_of\\_the\\\
    _Year\\] (1-12)*\n\n*\\[Day\\_of\\_the\\_Week (0-6, 6 = Sunday)\\] \\[command\
    \ (i.e. path2script)\\].*\n\n \n\nTo create a CRON scheduled job (aka CRON Job),\
    \ first type: crontab . Then you\n\nwill be put into a mini-editor (very limited\
    \ editing functionality). To create a job\n\nthat runs on 8:05am on January 8th,\
    \ then executes the command, echo \"Hello,\n\nWorld\" .\n\n \n\nIf type crontab\
    \ . You would have to type: 05 08 08 01 \\* echo \"Hello,\n\nWorld\" > test\\\
    _file.txt Then press Ctrl+D when done.\n\n \n\nBy default, crontab entries are\
    \ for the currently logged in user. To see all\n\nthe defined jobs, type: crontab\
    \ -l\n\n \n\nTo edit the CRONTAB entries in an editor, type: crontab -e"
  - "[PAGE 179]\n\n \n\nTo edit another user’s CRONTAB use the following arguments,\
    \ type:\n\ncrontab -u **user\\_name** -e\n\n**Notes:** *Wildcard: The attics (\\\
    *) matches anything* *Ranges: Use the hyphen (-),*\n\n*to define ranges (i.e.\
    \ Mon-Fri, 6-11, Jan-Feb, etc.)* *Multiple ranges: Use a*\n\n*comma to separate\
    \ more than one range.*\n\n \n\n**Keywords Shortcuts**\n\n \n\nCRON supports also\
    \ supports some predefined special keywords shortcuts for\n\ncommon time equivalents\
    \ (i.e. hourly, daily, etc.). The table shows the keywords\n\nand time equivalents:\
    \ **Keyword** **Equivalent** @yearly 0 0 1 1 \\*\n\n@daily 0 0 \\*\n\n@hourly\
    \ 0\n\n@reboot Run at startup.\n\n \n\n**Note:** *The CRONTAB file is located:\
    \ etccrontab*"
  - "[PAGE 180]\n\nNFS (Network File System)\n\n \n\nIn Linux you can share files\
    \ with other computers over the network using a\n\nservice called NFS (Network\
    \ File System). This service allows remote operating\n\nsystems, to mount a directory\
    \ over the network to move files around between\n\nsystems and devices.\n\nNFS\
    \ is mostly used for Linux systems, where Samba the service uses the SMB\n\nprotocol\
    \ which is used by Microsoft Windows computers for sharing files. The\n\nMacintosh\
    \ OSX and higher have native support for NFS. While Windows 7\n\noffers basic\
    \ support for this service, Windows 10 has better builtin support (this\n\ncan\
    \ vary depending on the edition that you’re running).\n\nTo install NFS, you have\
    \ to install the client and service separately. This allows\n\nyou to install\
    \ the client or service without having to install the other if you don’t\n\nneed\
    \ it.\n\n**Installing/Configuring the NFS Service** In order to host NFS shares\
    \ on a\n\ndevice you will need the client installed to make them available to\
    \ remote\n\ndevices. To install the NFS service on your local system to make files\
    \ available\n\nto devices or computers.\n\n \n\nThe first thing you need to do\
    \ is check if the NFS service is already\n\ninstalled and running on your system,\
    \ type: dpkg -l | grep nfs-kernel-server\n\n \n\nIf this service is not already\
    \ installed, type: sudo apt-get install nfs-kernel-\n\nserver\n\n\\-OR-sudo yum\
    \ install nfs-utils\n\n \n\n**Setting NFS Directory**\n\n \n\nIt is important\
    \ to note that Root (superuser) permissions are ignored by NFS by\n\ndefault.\
    \ So even if you’re logged in with root permission, any related actions\n\nwith\
    \ those permissions will be ignored by default. This is a security measure to"
  - "[PAGE 181]\n\nprevent a remote takeover of the system. Although if needed, it\
    \ is possible to\n\ngrant root permissions on a per share basis.\n\n \n\nFirst\
    \ you have to create a mount point for the NFS shares that you're going\n\nto\
    \ mount, type: sudo mkdir -p *var*nfs/myshare .\n\n \n\nIt’s important to note,\
    \ that these directories *var*nfs and *var*nfs/myshare\n\nwill have 777 permissions,\
    \ type: sudo chmod -R 777 *var*nfs/myshare\n\n \n\nAs a security measure, NFS\
    \ will translate all root operations as to the\n\nclient as the nobody:nogroup\
    \ credentials. Therefore, it may be necessary\n\nto change the directory ownership\
    \ to match the credentials. To do this,\n\ntype: sudo chown nobody:nogroup *var*nfs/myshare\
    \ To configure file\n\npermissions on the share, you need to add them to the *etc*exports\
    \ file. You\n\nwill need to create a line for each directory that you want to\
    \ share. For\n\nexample: *var*nfs/myshare 192.168.0.100(rw,sync,no\\_subtree\\\
    _check)\n\n**Notes:** *The file comment in the* *etcexports file show the general\
    \ syntax for each*\n\n*line, which looks like:* *share\\_directory client\\_ip\\\
    _address(share\\_option1, …*\n\n*,share\\_optionN)* *rw : Grants the client computer\
    \ both read and write access to*\n\n*the share.*\n\n*sync : This option forces\
    \ NFS to write changes to local storage before replying.*\n\n*no\\_subtree\\_check\
    \ : This option prevents subtree checking, which has some*\n\n*mild security implications.\
    \ Although, it can improve reliability in some*\n\n*circumstances.*\n\n*no\\_root\\\
    _squash : By default, NFS translates requests from a root user remotely*\n\n*into\
    \ a non-privileged user on the server. This option disables this behavior for*\n\
    \n*certain shares.*\n\n \n\nAfter you modified the *etcexports* file, you have\
    \ to restart the NFS service\n\nfor the changes to take effect, type: sudo service\
    \ nfs-kernel-server restart\n\n \n\n**Setting up Firewall for NFS**"
  - "[PAGE 182]\n\n \n\nIf a firewall is running on the host machine, and in most\
    \ cases it generally will.\n\nYou will need to open up specific ports on the firewall\
    \ to make the NFS service\n\navailable to remote systems.\n\n \n\n**Note:** *This\
    \ section assumes you have the UFW utility installed on*\n\n*your computer for\
    \ managing the firewall. For more information*\n\n*about the UFW utility, see\
    \ the following section \"**Making*\n\n*IPTABLES easier**\"*\n\n \n\nThe first\
    \ thing you want to do is check the status of your firewall, type:\n\nsudo ufw\
    \ status\n\n \n\n**Note:** *If the firewall is not enabled, it is recommended\
    \ that you*\n\n*enable this feature.*\n\n \n\nTo see what applications are enabled\
    \ in the firewall, type: sudo ufw app\n\nlist\n\n \n\n**Note:** *The UFW utility\
    \ will check the etcservices* *for the port and*\n\n*protocol a service uses.*\n\
    \n \n\nTo add the port to the firewall, type:\n\nsudo ufw allow from any to any\
    \ port nfs\n\n \n\nIt is important to note, that NFS best practice recommends\
    \ restricting the\n\nconnection to a specific client, type: sudo ufw allow from\
    \ **192.168.0.100** to any\n\nport nfs **Installing/Configuring the NFS Client**\
    \ In order to access and manage\n\nan NFS connection you need to have the NFS\
    \ client installed. It is possible to\n\ninstall the client by itself without\
    \ the related NFS services."
- md: "\nTo install the NFS client, type:\n\n`sudo apt-get install nfs-common`\n\n\
    -OR-\n\n`sudo yum install nfs-utils`\n\nNext you have to create directories that\
    \ will be NFS mount points for the client, type: \n\n`sudo mkdir -p /var/nfs/remoteshare`\n\
    \nTo issue NFS mount command to access a remote share, type: \n\n`sudo mount 192.169.0.100:/var/nfs/myshare\
    \ /var/nfs/remoteshare` \n\nTo automatically mount an NFS share every reboot,\
    \ you need to add a line to the `/etc/fstab` file, for example: \n\n`192.169.0.100:/var/nfs/myshare\
    \ /var/nfs/remoteshare nfs auto 0 0`\n\nTo display all the attached NFS mount\
    \ points, type:\n\n`mount`\n\n-OR-\n\n`df -h`\n\n## Locking down the NFS Service\
    \ (optional)\n\nTo lockdown the NFS service to only be accessed by remote servers\
    \ that you want to grant access. You need to tell the system to only accept connections\
    \ from approved remote devices. This is a multi-step process, first you have to\
    \ tell the system to block all connections, except those that have been approved.\n\
    \nTo block all unapproved client connections to the NFS service. Open the `/etc/hosts.deny`\
    \ file, then add the following line: \n\n`rpcbind mountd nfsd statd lockd rquotad\
    \ : ALL`\n\nTo grant a system or device permission to connection to the service,\
    \ add the IP address(es) to the following file. Open the `/etc/hosts.allow` file,\
    \ then add the following line: \n\n`rpcbind mountd nfsd statd lockd rquotad :\
    \ approved_IP_address_list` After you modified the permission files, you have\
    \ to restart the NFS service for the changes to take effect, type: \n\n`sudo service\
    \ nfs-kernel-server restart`\n\n**Note:** *There are three NFS configuration files:\
    \ `/etc/default/nfs-kernel-server`, `/etc/default/nfs-common`, `/etc/exports`*\n\
    \n## A Quick Guide to Samba\n\nSamba is a service that allows Linux to host or\
    \ access Microsoft SMB-based resources, such as file shares, printers, and other\
    \ computer resources across a network. With this service a Linux client can connect\
    \ to a Microsoft SMB-based network and share files with other Windows-based server\
    \ and clients.\n\nWith this service a Linux server can also host a Microsoft SMB-based\
    \ network files shares so that other Windows clients can access them. Although,\
    \ this functionality is not covered in this version of the book and may be included\
    \ in future versions.\n\n### Installing the Samba Service\n\nTo install the Samba\
    \ service, type:\n\n`sudo apt-get install samba`\n\n### Securing File Sharing\n\
    \nTo password-protect a samba file share, you need to create a group called \"\
    smbgrp\" and set a password for each user.\n\n`$ sudo addgroup smbgrp`\n`$ sudo\
    \ usermod user_name -aG smbgrp`\n`$ sudo smbpasswd -a user_name`\n\n**Note:**\
    \ *user_name account must belong to the local system, or else it won't save.*\n\
    \n## Configuring Samba\n\nCreate a directory for your Samba shares, type: `mkdir\
    \ ~/samba_share/`\n\n**Note:** *To create the secure directory where the shared\
    \ files will be stored. `sudo mkdir -p /srv/samba/secure_shares` Next, set the\
    \ appropriate permissions on the directory. `sudo chmod -R 0770 /srv/samba/secure_shares`\
    \ `sudo chown -R root:smbgrp /srv/samba/secure_shares`*\n\nEdit the Samba configuration\
    \ file, type:\n\n`nano /etc/samba/smb.conf`\n\nAt the bottom of the file, add\
    \ the following lines:\n\n```\n[sambashare]\ncomment = My Samba Share\npath =\
    \ /home/user_name/samba_share\nread only = no\nbrowsable = yes\n```\n\n(To save\
    \ the file and exit the editor, press **Ctrl+X**, type: **y** and press Enter)\
    \ More advanced directives are available for creating different types of shares\
    \ (i.e. read, read/write, anonymous only, etc.) To put the changes into effect,\
    \ you have to restart the Samba daemon, type: \n\n`sudo systemctl restart smbd`\n\
    \n-OR-\n\n`sudo service smbd restart`\n\n**Tip:** *To test your current Samba\
    \ settings, type: testparm*\n\n## Connecting to an SMB Share\n\nOpen up the default\
    \ file manager in X-Windows, click Connect to Server, type:\n\n`smb://domain_or_ip_address/sambashare`\n\
    \n### Enabling Samba in the UFW Firewall\n\nIf the UFW firewall is enabled on\
    \ your system, you have to add the following rules to allow Samba traffic to pass\
    \ through the firewall. Depending on the type of network you're on, this will\
    \ cause you to have to change these commands to specify the proper IP ranges (in\
    \ the example this is a class C).\n\n`sudo ufw allow proto udp to any port 137\
    \ from 192.168.1.0/24`\n`sudo ufw allow proto udp to any port 138 from 192.168.1.0/24`\n\
    `sudo ufw allow proto udp to any port 139 from 192.168.1.0/24`\n`sudo ufw allow\
    \ proto tcp to any port 445 from 192.168.1.0/24`\n\n## Installing the SSH Server\n\
    \nSecure Shell (SSH) is what is known as an encrypted channel that allows you\
    \ to connect to the remote server. It supersedes the older Telnet, which provided\
    \ plain text communication.\n\n## /PROC Virtual Files\n\nThe /proc directory is\
    \ a virtual filesystem that provides information about processes, kernel and more.\
    \ This is useful for profiling the system.\n\n## Using Git (For Beginners)\n\n\
    git is what is known as a VCS (or Version Control System). Basically VCS like\
    \ git are commonly used by programmers (and many others) to store their source\
    \ code (or other types of content), to track changes made to it (also known as\
    \ ‘versions’), as well as sharing it by making it available to others like yourself\
    \ to download or contribute to it.\n"
  mdcn: "\n\n要安装 NFS 客户端，请输入：\n\n`sudo apt-get install nfs-common`\n\n-或者-\n\n`sudo\
    \ yum install nfs-utils`\n\n接下来，你必须创建作为客户端 NFS 挂载点的目录，输入：\n\n`sudo mkdir -p /var/nfs/remoteshare`\n\
    \n执行 NFS 挂载命令以访问远程共享，输入：\n\n`sudo mount 192.169.0.100:/var/nfs/myshare /var/nfs/remoteshare`\
    \ \n\n要在每次重新启动时自动挂载 NFS 共享，你需要在 `/etc/fstab` 文件中添加一行，例如：\n\n`192.169.0.100:/var/nfs/myshare\
    \ /var/nfs/remoteshare nfs auto 0 0`\n\n显示所有已连接的 NFS 挂载点，输入：\n\n`mount`\n\n-或者-\n\
    \n`df -h`\n\n## 锁定 NFS 服务（可选）\n\n将 NFS 服务锁定为仅允许你想要授予权限的远程服务器访问。你需要告诉系统仅接受来自已批准远程设备的连接。这是一个多步骤过程，首先你必须告诉系统阻止所有连接，除非是已批准的连接。\n\
    \n要阻止所有未经批准的客户端连接到 NFS 服务。打开 `/etc/hosts.deny` 文件，然后添加以下行：\n\n`rpcbind mountd\
    \ nfsd statd lockd rquotad : ALL`\n\n要授予系统或设备连接服务的权限，请将 IP 地址（或）添加到以下文件中。打开 `/etc/hosts.allow`\
    \ 文件，然后添加以下行：\n\n`rpcbind mountd nfsd statd lockd rquotad : approved_IP_address_list`\
    \ 修改权限文件后，你必须重启 NFS 服务使更改生效，输入：\n\n`sudo service nfs-kernel-server restart`\n\n\
    **注意：** *有三个 NFS 配置文件：`/etc/default/nfs-kernel-server`、`/etc/default/nfs-common`,\
    \ `/etc/exports`*\n\n## Samba 快速指南\n\nSamba 是一项允许 Linux 托管或访问基于 Microsoft SMB\
    \ 的资源的服务，例如跨网络的文件共享、打印机和其他计算机资源。通过此服务，Linux 客户端可以连接到基于 Microsoft SMB 的网络，并与其他\
    \ Windows 服务器和客户端共享文件。\n\n通过此服务，Linux 服务器也可以托管基于 Microsoft SMB 的网络文件共享，以便其他 Windows\
    \ 客户端可以访问它们。尽管如此，本书中未涵盖此功能，可能会包含在未来的版本中。\n\n### 安装 Samba 服务\n\n要安装 Samba 服务，请输入：\n\
    \n`sudo apt-get install samba`\n\n### 安全文件共享\n\n要对 Samba 文件共享设置密码保护，你需要创建一个名为\
    \ \"smbgrp\" 的组，并为每个用户设置密码。\n\n`$ sudo addgroup smbgrp`\n`$ sudo usermod user_name\
    \ -aG smbgrp`\n`$ sudo smbpasswd -a user_name`\n\n**注意：** *user_name 账户必须属于本地系统，否则无法保存。*\n\
    \n## 配置 Samba\n\n为你的 Samba 共享创建一个目录，输入：`mkdir ~/samba_share/`\n\n**注意：** *用于创建存储共享文件的安全目录。`sudo\
    \ mkdir -p /srv/samba/secure_shares` 接下来，在目录上设置适当的权限。`sudo chmod -R 0770 /srv/samba/secure_shares`\
    \ `sudo chown -R root:smbgrp /srv/samba/secure_shares`*\n\n编辑 Samba 配置文件，输入：\n\
    \n`nano /etc/samba/smb.conf`\n\n在文件末尾，添加以下行：\n\n```\n[sambashare]\ncomment = My\
    \ Samba Share\npath = /home/user_name/samba_share\nread only = no\nbrowsable =\
    \ yes\n```\n\n（要保存文件并退出编辑器，按 **Ctrl+X**，输入：**y** 并按回车）有更多更高级的指令用于创建不同类型的共享（例如：只读、读写、仅限匿名等）。要使更改生效，你必须重启\
    \ Samba 守护进程，输入：\n\n`sudo systemctl restart smbd`\n\n-或者-\n\n`sudo service smbd\
    \ restart`\n\n**提示：** *要测试你当前的 Samba 设置，输入：testparm*\n\n## 连接到 SMB 共享\n\n打开 X-Windows\
    \ 中的默认文件管理器，点击“连接到服务器”（Connect to Server），输入：\n\n`smb://domain_or_ip_address/sambashare`\n\
    \n### 在 UFW 防火墙中启用 Samba\n\n如果你的系统上启用了 UFW 防火墙，你必须添加以下规则以允许 Samba 流量通过防火墙。根据你所在的网络类型，你可能需要更改这些命令以指定正确的\
    \ IP 范围（示例中为 C 类）。\n\n`sudo ufw allow proto udp to any port 137 from 192.168.1.0/24`\n\
    `sudo ufw allow proto udp to any port 138 from 192.168.1.0/24`\n`sudo ufw allow\
    \ proto udp to any port 139 from 192.168.1.0/24`\n`sudo ufw allow proto tcp to\
    \ any port 445 from 192.168.1.0/24`\n\n## 安装 SSH 服务\n\nSecure Shell (SSH) 是一种加密通道，允许你连接到远程服务器。它取代了旧的\
    \ Telnet，后者提供的是明文通信。\n\n## /PROC 虚拟文件\n\n/proc 目录是一个虚拟文件系统，提供了有关进程、内核等的信息。这对于系统性能分析非常有用。\n\
    \n## 使用 Git（针对初学者）\n\ngit 是众所知的 VCS（或版本控制系统）。基本上，像 git 这样的 VCS 被程序员（以及许多其他人）常用于存储源代码（或其他类型的内容）、跟踪对其进行的更改（也称为“版本”），并通过将其公开供像你这样的人下载或贡献来共享它。\n\
    \n"
