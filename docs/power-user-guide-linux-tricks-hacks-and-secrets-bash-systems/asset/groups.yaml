    \ sudo apt-get install emacs\n\n**Note:** *To quit emacs, press Ctrl+X, and Ctrl+C,\
    \ check the bottom of the screen for any questions if you modified the buffer.*\n\
    \n## Text Based Games\n\nBelow are some text based games that can be played in\
    \ the Linux console. This might be old school for some people, but it also demonstrates\
    \ the flexibility of the command line.\n\nbastet (or Bastard Tetris) is a classical\
    \ version of Tetris that uses ASCII that can be played at the command line.\n\n\
    If this package is not already installed, type: sudo apt-get install bastet\n\n\
    Dwarf fortress is a text based fantasy game that uses ASCII art to graphically\
    \ represent the game environment To install the game, go to the following site\
    \ and follow the installation instructions http://www.bay12games.com/dwarves/\n\
    \nfreesweep is a Minesweeper clone that uses ASCII graphics that can be played\
    \ at the command line.\n\nIf this package is not already installed, type: sudo\
    \ apt-get install freesweep\n\nnethack is a single player rogue-like dungeon exploration\
    \ game. To install the game, go to the following site and follow the installation\
    \ instructions http://nethack.org/\n\n## Advanced Fun\n\nThis section requires\
    \ more skills and knowledge then some of the earlier sections. Although should\
    \ not stop you from trying these things out if it is interesting to you.\n\n###\
    \ Adding New Characters to Cowsay\n\nThe cowsay command comes with a default set\
    \ of characters (i.e. daemon, tux, etc.) in what are called .COW files. You can\
    \ expand the number of available characters by adding a new set of COW files.\
    \ Follow the instructions to download and install them.\n\n```bash\n# Change to\
    \ the home directory\ncd ~\n# Download files from github\ngit clone https://github.com/example/cowsay-files\
    \ # Move .COW files to correct location\nsudo mv ~/cowsay-files/*.cow /usr/share/cowsay/\n\
    # Display one of the new cowsay\n```\n\n**Tip:** *To display all available cowsay\
    \ characters, type:* *cowsay -l | sed '1d;s/ //' | while read f; do cowsay -f\
    \ $f; done*\n\n### Expanding Fortune Quotes (Chuck Norris)\n\nIt is possible to\
    \ create a custom quotes database that can be utilized by fortune command. First\
    \ you need to put your quotes into a text file that has every quote separated\
    \ by a line (\"%\") as a delimiter. After that it has to be converted into a special\
    \ binary file that can be used by fortune command.\n\n```bash\n# Change to the\
    \ home directory\ncd ~\n# Download the file from GitHub, it should be called chucknorris\n\
    wget https://raw.githubusercontent.com/robbyrussell/oh-my-zsh/master/plugins/chucknorris/fortunes/chucknorris\
    \ # Create a random string file used by fortune command\ncp chucknorris /usr/share/games/fortunes\
    \ # Tests the new fortune\nfortune | cowsay\n```\n\n### Script: Let It Snow\n\n\
    This script needs to be copied into a file and made executable to run. Use the\
    \ following commands to make the script file for you, make it executable and open\
    \ it up, type:\n\n```bash\necho \"#!/bin/bash\" > snow.sh\nchmod+x snow.sh\nnano\
    \ snow.sh\n```\n\nCopy the lines below into the file that was created:\n\n```bash\n\
    #!/bin/bash\nLINES=$(tput lines)\nCOLUMNS=$(tput cols)\ndeclare -A snowflakes\n\
    declare -A lastflakes\nclear\nfunction move_flake() {\n  i=\"$1\"\n  if [ \"${snowflakes[$i]}\"\
    \ = \"\" ] || [ \"${snowflakes[$i]}\" = \"$LINES\" ]; then\n    snowflakes[$i]=0\n\
    \  else\n    if [ \"${lastflakes[$i]}\" != \"\" ]; then printf \"\\033[%s;%sH\\\
    033[1H \"${lastflakes[$i]}\" $i; fi\n  fi\n  printf \"\\033[%s;%sH\\033[1H\" ${snowflakes[$i]}\
    \ $i\n  lastflakes[$i]=${snowflakes[$i]}\n  snowflakes[$i]=$((snowflakes[$i]}+1))\n\
    }\nwhile :\ndo\n  i=$((RANDOM % $COLUMNS))\n  move_flake $i\n  for x in \"${!lastflakes[@]}\"\
    \n  do\n    move_flake \"$x\"\n  done\n  # Only use this line to slow it down\
    \ if too fast.\n  # sleep 0.1\ndone\n```\n\nTo run the script type:\n./snow.sh\n\
    \n## Experimental Fun\n\nThis section contains code that is experimental, and\
