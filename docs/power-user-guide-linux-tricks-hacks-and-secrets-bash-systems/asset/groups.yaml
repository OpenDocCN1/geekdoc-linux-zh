    \ -A 365\n\n**提示：** *还有其他几个日历可用：*calendar -f /usr/share/calendar/calendar.pagan\
    \ -A 365, calendar -f /usr/share/calendar/calendar.music -A 365, calendar -f /usr/share/calendar/calendar.computer\
    \ -A 365, calendar -f /usr/share/calendar/calendar.history -A 365*\n\nvim 编辑器包含了一些小彩蛋，运行编辑器后尝试使用以下命令：对于道格拉斯·亚当斯的粉丝，输入：:help\
    \ 42\n\n对于蒙蒂·派森的粉丝，输入：:Ni!\n\n**注意：** *要退出 vim，按下 ESC 键，然后（按下冒号键）:q!如果你修改了缓冲区，请检查屏幕底部是否有任何问题。*\n\
    \nemacs 编辑器包含了一些小技巧，启动应用后，按下 Esc 然后 X。在 M-x 提示符处，输入以下游戏之一并按回车：**snake** - 这是一个小型吃蛇类游戏，使用方向键吃掉掉落的区块，并尝试不要吃到自己。**tetris**\
