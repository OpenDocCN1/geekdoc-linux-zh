    ## 持久变量 (Persistent Variables)


    由于变量（即环境变量和 变量）存储在 RAM 中，它们是临时的，当 shell 进程被杀死或计算机关闭时将会消失。持久变量存储在配置文件中，并在系统加载或
    shell 启动时加载。


    在登录时创建预定义变量取决于 Bash 如何启动的以及加载了哪个配置文件。基本上有四种用户会话类型（也称为登录 shell）：登录（Login）、非登录（Non-Login）、交互式（Interactive）和非交互式（Non-Interactive）。


    - **登录 (Login)**：shell 会话在用户验证后开始（例如本地或 ssh 终端会话）。登录 shell 会话从 *etc/profile* 文件读取配置详情。然后，它将在用户目录下查找第一个用户登录
    shell 配置文件，以加载任何用户特定的配置（即 ~/.bash_profile -或- ~/.bash_login -或- ~/.profile）。


    - **非登录 (Non-Login)**：当从已验证的登录会话内部启动新的 shell。例如，当你从终端运行 Bash 命令时，会启动一个（位于登录用户凭据）非登录
    shell 会话。非登录 shell 会话读取 *etc/bash.bashrc* 文件，然后读取用户特定的 ~/.bashrc 文件来配置环境。


    - **交互式 (Interactive)**：连接到终端并正在使用的 shell 会话。例如，ssh 会话被定义为交互式登录 shell。


    - **非交互式 (Non-Interactive)**：未连接到终端会话且当前未使用的 shell 会话。例如，当你在从非交互式、非登录 shell 运行的命令行中运行脚本时。非交互式
    shell 会话首先读取名为 BASH_ENV 的环境变量，然后读取该变量指定的文件来设置新的 shell 环境。


    **提示：** 要强制当前的 shell 会话重新重读配置文件，请输入：

    `source ~/.bashrc`


    **注意：** *单个用户定义的变量（非系统范围）可以在登录和非登录 shell 会话中均可用，可以在 ~/.bashrc 文件中定义。*

    *要创建系统范围的环境变量，你需要将变量定义添加到以下文件之一：/etc/profile, /etc/bash.bashrc, /etc/environment*


    ## Shell vs. 环境 vs. 持久变量


    如果你查看一个显示操作系统不同层级的分级图，其中你运行命令的用户层位于顶部，硬件位于底部。在这里你可以看到 shell 与环境变量之间的区别。环境变量运行在较低的级别，它们对所有
    shell 实例都可用。此外，由于持久变量是在计算机或 shell 启动时从配置文件加载的，它们可以不受进程被杀死或计算机关闭的影响。


    ### 系统层：Shell/环境/持久变量


    | 层级 | 说明 |

    | :--- | :--- |

    | **用户层 (User Layer)** | 命令/程序（控制台） |

    | **Shell (实例)** | Shell 变量：这些变量仅在 shell 的当前实例中可用。可以运行多个 shell 实例，每个实例都有自己独特的变量集。
    |

    | **操作系统层** | 环境变量：这些变量对所有 shell 实例可用。持久变量：这些变量在计算机或 shell 启动时从配置文件加载。 |

    | **内核 (Kernel)** | 这是模块、驱动程序等加载的地方。 |

    | **硬件层 (Hardware Layer)** |（例如 CPU、RAM、存储、网卡） |


    ## 字符串类型 (String Types)


    Bash 只支持几种不同类型的变量，例如：字符串、整数、数组和只读（readonly）。默认情况下，除非另有声明，否则 Bash 将所有变量视为字符串。你甚至允许对字符串进行数学运算，即使它不是整数。


    例如，如果你输入：

    ```bash

    a=1234

    let "a += 1"

    echo "a = $a"

    ```

    $a 的输出将是 1235


    现在如果你将 $a 声明为整数：

    ```bash

    a=1234

    declare -i a

    let "a += 1"

    echo "a = $a"

    ```

    $a 的输出将是 1235


    使用 `declare` 命令，你还可以使变量变为只读，这意味着它不能被修改，只能被删除。


    例如，如果你输入：

    ```bash

    declare -r a=1234

    let "a += 1"

    echo "a = $a"

    ```

    $a 的输出将是 1234


    Bash 还支持数组变量，允许一个变量持有相关信息（或值）。它基本上是一个像许多变量的变量，每组值都有从 0 到……的索引值。


    例如，创建一个 Linux 发行版的数组，输入：

    ```bash

    Distro[0]=''Red Hat''

    Distro[1]=''Debian''

    Distro[2]=''Ubuntu''

    ```

    要查看索引为 2 的数组中的值，输入：`echo ${Distro[2]}`


    **提示：** 要创建一个 Linux 发行版的数组，输入：`Distro[0]=''Red Hat''`, `Distro[1]=''Debian''`,
