    \ apt-get install rig\n\nbb 是一个用于文本终端的高质量视听演示，输入：bb\n\n如果此包尚未安装，请输入：sudo apt-get\
    \ install bb\n\naafire 是一个在终端中渲染燃烧火苗的 asciiart 动画，输入：aafire\n\n如果此包尚未安装，请输入：sudo\
