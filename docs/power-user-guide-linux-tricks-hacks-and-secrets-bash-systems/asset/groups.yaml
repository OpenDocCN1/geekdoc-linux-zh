    ## Installing Docker from official Docker repository


    You can use your distros builtin repositories for Docker, but they might not always
    have the latest version available. To get the latest version of Docker you need
    to point your package manager to use the official repositories.


    To update your package manager repository information, type: `sudo apt-get update`


    Make sure your apt package manager has the prerequisites to use HTTPS download,
    type: `sudo apt-get install apt-transport-https ca-certificates curl software-properties-common`


    Add the official Docker repository GPG key to the apt package manager, type: `curl
    -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -`


    Add the Docker repository to the apt sources, type: `sudo add-apt-repository "deb
    [arch=amd64] https://download.docker.com/linux/ubuntu bionic stable"`


    Update the apt package database with the Docker packages, type: `sudo apt-get
    update`


    Make sure you''re installing Docker from the correct apt repository, and not the
    default, type: `apt-cache policy docker-ce`


    You should see the following message to tell you that the installation package
    is from the Docker repository:


    ![](img/0f524874379aa171ff08f51cdf3cfa83_224_0.png)


    Installing the Docker service, type: `sudo apt-get install docker-ce`


    Check to make sure the Docker service is running, type: `sudo systemctl status
    docker`


    You should see the following message to tell you that the service is running:
    ... Active: active (running) ...


    **Notes:** *When installing Docker, you get the Docker service (daemon) and docker
    command line utility. The docker command line utility is how you interact with
    the service, images and the containers. The docker command has to be run by the
    root user or by a user in the docker group that is automatically created during
    the Docker''s installation process. To add your name to the Docker group, type:
    `sudo usermod -aG docker ${USER}` (if you''re having a problem, manually enter
    your username in the command). Then logout and log back in, or type: `su - ${USER}`,
    to confirm that you''re in the Docker group, type: `id -nG`.*


    ## Using and Testing the Docker Service


    In this section and the rest of this chapter assumes that you added your user
    account to the docker security group talked about earlier. If not, you will need
    to prefix the docker command with the sudo command.


    The Docker command syntax looks like:

    `docker [option] [command] [arguments]`


    To check if Docker is running and the connectivity is working properly, type:
    `docker run hello-world`


    **Note:** *If the image is not already installed in your local repository, it
    will be automatically downloaded from the Docker Hub site [the default repository].*


    ![](img/0f524874379aa171ff08f51cdf3cfa83_225_0.png)


    To display the images that have been downloaded to your computer, type: `docker
    images`


    ![](img/0f524874379aa171ff08f51cdf3cfa83_226_0.png)


    To search for an available Docker image on the Docker Hub site (https://hub.docker.com/).
    Use the following command return a listing of all images that match the search
    string, type: `docker search hello-world`


    ![](img/0f524874379aa171ff08f51cdf3cfa83_226_1.png)


    **Note:** *If the OFFICIAL column indicates [OK] for a Docker image that means
    it is built and supported by the company behind the project.*


    ## Starting a Docker Container


    I believe it is important to emphasize the difference between the Docker image
    and container. The Docker image is a digital template, and stores all the resources
    (i.e., programs, libraries, etc.) and data. When you run an image, a copy of it
    gets loaded into memory and then becomes a Docker container.


    To download the official Ubuntu image, type: `docker pull ubuntu` ![](img/0f524874379aa171ff08f51cdf3cfa83_227_0.png)


    To run a container with the latest image of Ubuntu, type: `docker run -it ubuntu`


    **Note:** *The -i and -t switches provide interactive shell access into the container.
    The output will look like: `root@d57e5d79b88d:/#`. d57e5d79b88d is the ID, you
    will need that later if you want to delete it.*


    Any Linux command can be executed (as long as it is installed) inside the container,
    and all changes will only be made in the container. For example, you can install
    Midnight, execute it, and then exit.


    **Note:** *When inside the container, you don''t need to prefix any command with
    sudo, this is because you''re always operating as root user.*


    `root@d57e5d79b88d:/# apt update`

    `root@d57e5d79b88d:/# apt install mc`

    `root@d57e5d79b88d:/# mc`

    `root@d57e5d79b88d:/# exit`


    ## Managing Docker Images and Containers


    When you have several Docker containers running in memory, you need to understand
    the basic commands needed to manage them (i.e., starting, stopping, etc.).


    To display active (running) containers on your system, type: `docker ps`


    To display active (running) and inactive containers on your system, type: `docker
    ps -a`


    To start the Docker container (i.e. with the Ubuntu image that was downloaded
    earlier) use the container id of the image you want to start, type: `docker start
    d57e5d79b88d`


    **Note:** *The container ID and names will constantly change as you start and
    stop these processes. These are only included as example of what the complete
    command looks like.*


    To stop a Docker container use the container id, or the assigned name (see the
    output of ps) of the image you want to stop, type: `docker stop happy_container`
    After you no longer need a container you can delete it, type: `docker rm happy_container`


    **Note:** *It is possible to override any of the options like the automatic name
    creation. All you have to do is add the correct switches (i.e., --name) to the
    commands to create the container.*


    ## Committing a Docker Image


    After you modify a container the way you want it you have to commit the changes
    and create a new Docker image from the changes you made to it. Otherwise if you
    don''t want to keep the changes you can delete that container and the changes
    that were made will be lost.


    This is the syntax for the commit command:

    `docker commit -m "commitment message" -a "author name" container_id repository/new_image_name`


    **Note:** *For example, repository = Docker Hub username (i.e. jane2020).*


    This is a full example of the commit command:

    `docker commit -m "added apps" -a "jane" d57e5d79b88d jane2020/ubuntu_testapp`


    To see all the Docker images installed on your local system, type: `docker images`


    You will notice a size difference between the source (or base) image you started
    with vs. the new image you just created. The differences are the modifications
    made up of the changes (i.e., new repositories, commands, etc.) that you added.


    ## Pushing Images to the Docker Repository


    After the Docker image has been customized to the way that you want it you can
    then upload these changes to the Docker Hub to use on other systems or to make
    them available for others to use.


    Log into Docker Hub account, type: `docker login -u docker_user_name` After you
    authenticate with your account password, you can push your own image, type: `docker
    push docker-registry-username/docker-image-name` For example, to push the image
    to your Docker Hub account, type: `docker push jane2020/ubuntu_testapp`


    **Note:** *After pushing the image to the Docker Hub repository, the Docker image
    will be listed on your account''s dashboard.*


    To pull the image from the Docker Hub account on another computer, type: `docker
    pull jane2020/ubuntu_testapp`


    ## Docker Commands (Version 18)


    This is a list of the current docker commands (as of the writing of this book),
    and a description of what they do. All of these commands need to be prefixed by
    the docker command. For example, docker info displays information about the running
    Docker service.


    For more information on a specific command, type: `docker COMMAND --help`


    - attach: Attach local STDIN, output, and error streams to a running container.

    - build: Build an image from a Docker file.

    - commit: Create a new image from a container''s changes.

    - cp: Copy files/folders between a container and the local filesystem.

    - create: Create a new container.

    - diff: Inspect changes to files or directories on a container''s filesystem.

    - events: Get real time events from the server.

    - exec: Run a command in a running container.

    - export: Export a container''s filesystem as a tar archive.

    - history: Show the history of an container image.

    - images: List the container images.

    - import: Import the contents from a tarball to create a filesystem image.

    - info: Display system-wide information.

    - inspect: Return low-level information on Docker objects.

    - kill: Kill one (or more) running containers.

    - load: Load a container image from a tar archive or STDIN.

    - login: Login to a Docker registry.

    - logout: Logout from a Docker registry.

    - logs: Retrieve the logs of a specific container.

    '
