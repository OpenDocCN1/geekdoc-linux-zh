    on a USB flash drive. This will allow you to load a version of the Linux OS on
    a local system. This has several advantages, such as testing out a distro to see
    if you like it, or perform local diagnostics or repairs on a broken version of
    the OS, or trying to recover a failed filesystem on a local storage device.


