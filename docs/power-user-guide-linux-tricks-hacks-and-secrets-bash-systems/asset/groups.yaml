    **Volume 1**


    ***Power User Guide: Linux Tricks, Hacks and Secrets [Bash Systems Administration]***


    ## Introduction


    Like anything in life, you expect something to work correctly the first time you
    use it. You don’t want to have to spend the extra time reading the manual trying
    to figure out how it operates correctly.


    For example, when you buy a car, most people don''t care about how advanced this
    or that feature is. You just want to put the keys into the ignition and drive
    it like you would any other vehicle. Then when you need to know something specific,
    then you go to the manual for that specific information.


    This book is not meant to be an in-depth reference of Linux, it is meant to provide
    a brief introduction to several Linux commands and utilities, and try to provide
    useful examples of how they work. The intent is to demonstrate what Linux can
    do for you. Rather than wasting your time giving you lots of boring data that
    you probably won’t care to remember.


    If you need more information about something, then you can use the basic understanding
    that you have, and do a deeper investigation of how the command works. I have
    always discovered, when I have a basic foundational knowledge of anything, I will
    generally know where to look for or what questions to ask to get the information
    I need. It is when I don''t have that foundational knowledge, that I may not know
    where to start, which makes it a great deal more difficult.


    There is a plethora of information out on the web or in other references that
    will go into much greater depth on most of the topics in the book then what I
    will be covering. Although, most of us don''t have the time or interest to read
    those references.


    If you do discover you need more information about a command or utility, please
    check out any of the other references (i.e. help files, web pages, etc.) that
    are available to you so that you can acquire more in-depth information.


    My objective in writing this book is to provide you the quickest and hopefully
    most enjoyable introduction to Linux. It is also meant to help you get started
    learning the OS more quickly by giving you a sampler platter of commands that
    you can try and see the results.


    ## Additional information


    - Kernel (kernel.org) The main site for the Linux kernel information.

    - Linux (linux.org) Main site for the information about Linux.

    - Linux Journal (linuxjournal.com) Latest news and information on Linux


    ## Personal Opinion


    First of all if you’re getting started with Linux for the first time, for some
    people it can be overwhelming at first because of its learning curve. Realize
    this OS has been matured over several decades, and things work a specific way
    for a reason. For example, several of the basic console editing commands also
    work in utilities like the vi editor.


    What I am trying to say, don’t worry if you don’t understand a command or concept
    at first. The more you work with it the more things will make sense later. Don’t
    let the sophistication of the operating system overwhelm you.

    '
