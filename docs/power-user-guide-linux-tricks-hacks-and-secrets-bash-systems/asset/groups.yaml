    \n \n\nThe following script will secure the MySQL installation. It does this by\n\
    \nremoving some dangerous default settings and locking down access to the\n\n\
    database system, type: sudo mysql\\_secure\\_installation\n\n \n\n**Note:** *You'll\
    \ be ask if you want to configure the: VALIDATE*\n\n*PASSWORD PLUGIN. This option\
