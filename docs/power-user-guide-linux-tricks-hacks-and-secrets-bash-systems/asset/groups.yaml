    ## Advanced commands


    **Overview:** This chapter contains an advanced set of commands and one-liners.
    These one-liners are more advanced than the ones in the previous chapter. They
    can perform lower level functions or require more knowledge to utilize them.


    This chapter has been broken up into different sections (i.e. system commands,
    filesystem, networking, etc.) in order to organize the content. So it is easier
    to find and understand.


    **Note:** *Some commands and utilities might not be part of your default distro,
    and these applications may have to be installed in order to utilize them.*


    ## System commands


    These system commands and utilities listed in this section are for performing
    advanced system functions and operations. For example, managing system time, processes,
    packages and more.


    Synchronize the time clock, type: sudo ntpdate -s us.pool.ntp.org


    Run the same command on multiple Linux servers, type: for in $i$(cat list.txt);
