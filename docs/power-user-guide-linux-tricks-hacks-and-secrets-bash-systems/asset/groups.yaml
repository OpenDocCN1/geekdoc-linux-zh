- md: '

    **Midnight commander** Deleting large files (erases the content and leaves an
    empty file), type: > ***path*****to/large\_file.log** How to fix a mess you created
    by accidentally un-TARing files into the wrong directory, type: tar ztf ***path*****to/file\_name.tar.gz**
    | xargs -d''\n'' rm -v See a list of all file and subdirectories for a path, type:
    tree **/home** To install the command, type: sudo apt-get install tree OR-sudo
    yum install tree


    Easily convert text files to and from a Windows or UNIX format, type: Using awk
    to convert a Windows text file to UNIX, type: awk ''{ sub("\r$", ""); print }''
    **windows\_file.txt **> unix\_file.txt** Using awk to convert a UNIX text file
    to Windows, type: awk ''sub("$", "\r")'' **unix\_file.txt **> windows\_file.txt**
    The diff utility can compare the output of two commands without creating a temporary
    file: diff <(ls **directory\_name1**) <(ls **directory\_name2**) Create a function
    that will automatically do an ls when you type cd (i.e. cd ''/bin'' ), type :
    cd() { builtin cd -- "$@" && { \[ "$PS1" = "" \] || ls -hrt --color; }; }


    Create an Info Bar at the top of your screen, type: PS1=''\\[\\e\[s\\e\[7m\\e\[1;1H\]\\w\\n\\t
    \\j *\!\\#\\[\\e\[u\\e\[0m\\e\[33;1m\\]\[@\\h \\[\\e\[34m\\]\\W\\[\\e\[0m\\]\\$
    ''


    **Tip:** *To enhance the ''clear'' command to work with the Info Bar,* type:*
    *alias clear=''echo -e "\e\[2J\n"''*


    Find all world-writable files on your system, type: find / -type f -perm -o+w
    -exec ls -l {} \;


    ## Networking


    These are more advanced one-liners and commands, they are for performing networking
    operations and functions. For example, scanning remote ports on a machine, listing
    connections to remote machines, setting up temporary file servers, and more.


    NMAP: is a very versatile tool for scanning a network (for more information, go
    to: https://nmap.org) To install the command, type: sudo apt-get install nmap
    OR-sudo yum install nmap


    **Tip:** *To play around with nmap, type:* *nmap -oS ****example.com*** OR-nmap
    -oS - ***scanme.nmap.org*** *(The extra [-] dash puts the output in L33t, aka
    ''Script Kiddie'' mode)*


    To obtain network traffic statistics, type: iptraf-ng To install the command,
    type: sudo apt-get install iptraf-ng OR-sudo yum install iptraf-ng


    To identify which files have an open process, use: lsof


    **Note:** *In Linux environments, a file can be a network connection.*


    NETCAT ( nc ) is a tool designed to be used as a destination of a redirect (one
    pipe or |).


    Example: echo -e "GET http://example.com HTTP/1.0\n\n" | nc example.com 80 (Downloads
    a webpage source code)


    Analyze log files while the application is still running, type: tail -f **path\_to\_log**
    | grep **search\_term** Server logs can be gzip compressed to save local storage
    space, also see the ''Z'' commands alternatives (i.e. zless, zcat, zgrep , etc.)
    can deal with compressed log files.


    vnstat collects all traffic needed from any configured interface. To install the
    command, type: sudo apt-get install vnstat OR-sudo yum install vnstat


    **Note:** *Collects kernel data instead of the interface data, has a lighter execution
    on the system.*


    Lists open network ports that are in the Listening state, type: netstat -lnp


    Filter the ''netstat'' command, type: netstat -c | grep ''**State**''


    Use Python to setup a temporary http server: python -m SimpleHTTPServer (*this
    will make the current directory the command was run in available via HTTP via
    the machine’s IP address on port 8000*), then use the following command to download
    and extract the file on a remote system, type: wget -qO - http://192.168.0.100:8000/file\_name.bz2
    | tar xjvf -


    **Tip:** *To make an alias to this command, type:* *alias webshare=''python -m
    SimpleHTTPServer''*


    Run commands after you log out of an ssh session, type: nohup wget http://mirror.example.com/mirror/64bit.iso
    & For example, if downloading a large file on Raspberry without using nohup command
    you would have to wait for the download to finish before logging off the ssh session
    and shutting down your laptop. Watch a text version web page be refreshed every
    10 seconds, type: watch --interval=10 lynx -dump http://example.com/statistics.html
    To install the command, type: sudo apt-get install lynx OR-sudo yum install lynx


    Flushing the DNS cache, type: sudo service network restart OR-sudo init.d/network
    restart List all network connections and related apps, type: lsof -nP Display
    the number of IP connections to the web server on port 80, type: netstat -plane
    | grep :80 | awk ''{print $5}'' | grep -Eo ''[0-9]{1,3}\.){3}[0-9]{1,3}'' | sort
    | uniq -c


    ## Advanced Functions


    Broadcast output of shell thru ports 5000, 5001, 5002 (or whatever want), type:
    script -q | tee >(5000) >(5001) >(5002) To access the shell broadcast, type: your\_ip\_address
    Intercept the STDOUT and STDERR of another process, type: strace -ff -e trace=write
    -e 1,2 -p Process\_ID **Note:** *To test this command, open two terminals, run
    ps -aux in one terminal and get the process ID for the second terminal (i.e. "username
    23 0.0 25816 tty2 04:16 bash"). In first terminal run strace -ff -e trace=write
    -e 1,2 -p 23 . In second terminal, you will see trace.*


    View the contents/values of RAM as a string (plain text), type: sudo dd if=/dev/mem
    | cat | strings


    Watch the progress of a file copy, type: pv **input\_file** > **output\_file**
    **Note:** *The pv allows a user to see the progress of data going through pipeline,
    by displaying information such as time elapsed, percentage completed (with progress
    bar), current throughput rate, total data transferred, and ETA.*


    Creates a digest hash for file, type: openssl dgst -sha256 -hex **sample.txt**
    **Note:** *A digest hash can tell you if a file has changed since it was last
    hashed.*


    Split terminal screens either vertically andor horizontally, type: tmux Vertical
    split, press: Ctrl+B then Shift+5 Horizontal split, press: Ctrl+B then Shift+"
    Navigate screens, press: Ctrl+B then arrow keys To kill screen, press: Ctrl+B
    then X OR-type: exit To get help, type: man tmux


    asciiview generates a composite image of a picture out of text, type: asciiview
    **input\_file.png** Press ''H'' for help, or press ''Q'' to quit. To install the
    command, type: sudo apt-get install asciiview Extract text from a picture with
    tesseract (i.e. OCR), type: tesseract input\_file.png output\_file.txt To install
    the command, type: sudo apt-get install tesseract-ocr OR-RPM based installation,
    see: https://github.com/tesseract-ocr/tesseract/wiki


    **Tip:** *If you''re having problems OCRing a document, try to upscale image file
    by 480%, change it to greyscale, backfill it with white, sharpen it, and then
    try to extract the text. Otherwise if the document has very large fonts, change
    the upscale to 200% or 300%.* $ convert -colorspace gray -fill white -resize 480%
    -sharpen 0x1 file.png file.jpg **Note:** *More information: https://github.com/tesseract-ocr/tesseract*


    Convert an image from one size to another size, type: convert -resize 50% **input\_file.png
    output\_file.jpg** If this package is not already installed, type: sudo apt-get
    install imagemagick OR-RPM based installation, see: http://www.imagemagick.org/script/download.php#unix
    Show library calls that are being made (used for program debugging), type: ltrace
    echo HelloWorld Show system calls that are being made (used for program debugging),
    type: strace echo HelloWorld Records a screencast and convert it to an mpeg video,
    type: ffmpeg -f x11grab -r 25 -s 800x600 -i :0.0 tmp*****output\_file.mpg** **Note:**
    *Grabs X11 input and creates an MPEG at 25 fps with the resolution of 800x600*
    To download YouTube videos, type: youtube-dl **URL\_of\_video** If this package
    is not already installed, type: sudo apt-get install youtube-dl OR-sudo yum install
    youtube-dl Taking the audio from a video file, type: mplayer -ao pcm -vo null
    -vc dummy -dumpaudio -dumpfile **output\_file** **input\_file** Transcoding (i.e.
    converting one digital format to another) video from one format to another format,
    type: mencoder **sample\_movie.wmv** -o **sample\_movie.avi** -ovc lavc -oac lavc
    **Note:** *References to youtube-dl, mencoder, mplayer are only provided as an
    example of some of the audio and video tools and functionality that is available
    in Linux.*

