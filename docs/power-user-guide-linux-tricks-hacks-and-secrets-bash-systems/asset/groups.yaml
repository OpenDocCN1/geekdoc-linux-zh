- md: "\n## Builtin commands\n\nAs stated earlier, BASH has several builtin commands,\
    \ meaning that they don't require being installed, and they can't be uninstalled.\n\
    \nAnother important difference between the builtin vs. external commands. The\
    \ external commands will have man pages associated with them, while the builtin\
    \ commands will be listed in the help pages.\n\nA partial list of builtin commands\n\
    \n- alias : Defines new aliases. Otherwise displays existing aliases if no input\
    \ is given \n- bind : Displays or sets the current Readline key or function bindings\
    \ \n- echo : Output the arguments, separated by spaces, terminated with a newline.\n\
    \n**Tip:** *To see the complete list of all the built in tools, type:* *help*\n\
    \n## GUI Based Help System\n\nDepending on the X-Windows desktop environment (GNOME\
    \ and KDE) that you're using, it will have a different help system. Depending\
    \ on the environment that you're using, type one of the following commands: \n\
    \n- gnome-help : for help in GNOME\n- OR —\n- khelpcenter : for help in KDE\n\n\
    ## Command Piping and Output Redirection\n\nMost commands and scripts, may accept\
    \ some type of Standard Input (aka STDIN) and write to the Standard Output (aka\
    \ STDOUT).\n\nSTDIN comes in the form of arguments or data that has been passed\
    \ from the command or script.\n\nExample: If you typed, `echo HelloWorld`, you\
    \ are passing the argument HelloWorld in to the echo command. The echo command\
    \ will then display the output to the terminal.\n\n***Note:*** *Every command\
    \ automatically has three data streams connected to it.*\n- STDIN (0) - Standard\
    \ input (data fed into the program)\n- STDOUT (1) - Standard output (data printed\
    \ by the program, defaults to the terminal)\n- STDERR (2) - Standard error (for\
    \ error messages, also defaults to the terminal)\n\nSTDOUT is data that the command\
    \ or script generates, then sends it to the terminal by default. Although, the\
    \ output can be redirected to another command and used as input, sent to a printer,\
    \ or file, etc.\n\nUsing the example that was used earlier, if you typed `echo\
    \ HelloWorld`, the output of HelloWorld would be displayed on the terminal.\n\n\
    **Note:** *This output can also be redirected to a file using >, for example:\
    \ `echo HelloWorld > output_file.txt`*\n\n## Command Piping\n\nPiping redirects\
    \ the output from one command and sends it to another command for processing.\
    \ This is a very powerful, and well used operator. It allows you to get information\
    \ from one command as output, and send it into another as input.\n\nExample:\n\
    `ls -al | less`\n(Press Q to quit, or use the arrow keys to move up and down)\n\
    \n## Output Redirection\n\nBy default, every command reads from the STDIN and\
    \ writes to the STDOUT. However, you can change that and redirect the output.\
    \ For example, you can redirect your output to a file.\n\nThere are several types\
    \ of redirect operators that perform different actions, so it is important to\
    \ get to know the difference between them.\n\n- `command > output_file` sends\
    \ the STDOUT of the command to a file.\n\nExample:\n`ls -l > ~/output_file.txt`\n\
    `cat ~/output_file.txt`\n\n**Note:** *This will overwrite a file if it already\
    \ exists.*\n\n- `command >> output_file` appends an existing file with the STDOUT\
    \ of the command.\n\nExample:\n`ls -l >> ~/output_file.txt`\n`cat ~/output_file.txt`\n\
    \n- `command 2> output_file` would redirect STDERR to a file, or in the example\
    \ below its redirected to *dev/null* so it doesn't display anything on the console.\n\
    \nExample:\n`ls -l / 2> /dev/null`\n\n- `command &> output_file` would redirect\
    \ both STDOUT and STDERR to a file, or in the example below its redirected to\
    \ *dev/null* so it doesn't display anything on the console.\n\nExample:\n`ls -l\
    \ / &> /dev/null`\n\n- `command < input_file` redirects the contents of a file\
    \ back into the command (i.e. provide it as an input.)\nExample:\n`wc -l < input_file`\n\
    \n- `2>&1` redirect both STDERR and STDOUT output to the same file\nExample:\n\
    `du / > output_file 2>&1`\n\n**Tip:** *By redirecting the output to devnull nothing\
    \ will be display on the console. The device devnull can be thought of as a type\
    \ of black hole, that has infinite size but nothing can be retrieved from it.*\n\
    \n**Note:** *All the redirection operators are: `<`, `>`, `>|`, `<<`, `>>`, `&>`,\
    \ `<>`.* Several of these redirection operators were discussed earlier in this\
    \ section, but there are some other ones that you may use less often or never.\
    \ There are more that are even more obscure but not covered in the book, because\
    \ they only provide limited value or are for special case scenarios.*\n\n- `cmd\
    \ >| file` : Overwrites the file, even if the shell has this feature turned off.\n\
    - `cmd1>& cmd2` : Redirect both STDERR and STDIN from cmd1 into cmd2\n- `cmd <>\
    \ file` : Opens a file for reading and writing on STDIN (or cmd).\n\n## Advanced:\
    \ Using Command Substitution\n\nIt is possible to use the output of one command\
    \ as input, this is known as command substitution. To utilize this feature, use\
    \ dollar sign followed by parenthesis. For example, type `$(date)`\n\nThe older\
    \ form of command substitution uses backticks (\\`) to surround command. For example,\
    \ type `echo \\`date\\`\n\n## Advanced: Variable Expansion\n\nVariable expansion\
    \ is when a command is executed it replaces variable name with value. For example,\
    \ if you typed `echo $VAR`, it will display the value of the variable.\n\n**Tip:**\
    \ *The following function is handy for debugging because it will show the results:*\
    \ `() { echo \"$@\"; }*\n\n## Basic Shell commands\n\n**Overview:** This chapter\
    \ contains a beginning set of commands. These commands provide common operations\
    \ (i.e. copying, deleting, viewing, etc.), and they may be utilized more often\
    \ than advanced commands.\n\nIf you used Linux before some of these might be familiar\
    \ to you, but you also might learn a few tricks about them. If you never used\
    \ Linux before, you may find most of the commands to be powerful or versatile.\
    \ So it is not possible to demonstrate all of their functionality within the context\
    \ of this book. If you want to learn more about how to fully utilize any of the\
    \ commands, I would highly recommend that you do some research on them.\n\n##\
    \ Anatomy of a command\n\nAs stated earlier in the book, most commands are composed\
    \ of two or more elements (i.e.: kill -p 2300 ). They will always have a name\
    \ (i.e.: kill ), and most will also have an optional or required set of arguments\
    \ (i.e.: -p ). This example also includes values (i.e.: 2300 ). When this command\
    \ is executed, it will kill the process id 2300.\n\n**Tip:** *If you typed a command\
    \ like, echo \"no typs\" and press Enter, it will display no typs . To correct\
    \ the problem, type ^ozs^os and press Enter, it will displays no typos .*\n\n\
    ## System commands\n\nThe system commands and utilities listed in this section\
    \ are for performing basic system functions and operations. For example, managing\
    \ command history, checking system process information, and more.\n\nYou will\
    \ discover that Linux has a very robust command history feature, with lots of\
    \ shortcuts and tricks to make accessing previous used commands.\n\nTo see a list\
    \ of previous commands you entered, type: history\n\n**Note:** *The history of\
    \ commands you typed is stored in the file: ~/.bash_history*\n\nTo execute a specific\
    \ command in the list, type: !**#** (replace **#** with number of the command\
    \ you want to run (ex: !100 ))\n\n**Tips:** *If you put a space before a command,\
    \ it will be omitted from the shell history.*\n"
  mdcn: '


    ## 内置命令


    如前所述，BASH 具有几个内置命令，这意味着它们不需要安装，且无法被卸载。


    这是内置命令与外部命令之间的另一个重要区别。外部命令会有与之关联的手页（man pages），而内置命令将列在帮助页面中。


    内置命令部分列表


    - alias ：定义新的别名。如果没有给出输入，则显示现有的别名

    - bind ：显示或设置当前的 Readline 键位或函数绑定

    - echo ：输出参数，参数之间用空格分隔，并以换行符结束。


    **提示：** *要查看所有内置工具的完整列表，请输入：* *help*


    ## 基于 GUI 的帮助系统


    取决于你使用的 X-Windows（此处通常指 X-Window）桌面环境（GNOME 和 KDE），它会有不同的帮助系统。根据你使用的环境，输入以下命令之一：


    - gnome-help ：用于 GNOME 帮助

    - 或 —

    - khelpcenter ：用于 KDE 帮助


    ## 命令管道与输出重定向


    大多数命令和脚本都可能接受某种类型的标准输入（又称 STDIN）并写入标准输出（又称 STDOUT）。


    STDIN 以参数或从命令或脚本传递的数据形式出现。


    示例：如果你输入 `echo HelloWorld`，你正在将参数 `HelloWorld` 传递给 `echo` 命令。`echo` 命令会将输出显示在终端上。


    ***注意：*** *每个命令都自动连接了三个数据流。*

    - STDIN (0) - 标准输入（输入程序的数据）

    - STDOUT (1) - 标准输出（程序打印的数据，默认输出到终端）

    - STDERR (2) - 标准错误（用于错误消息，默认输出到终端）


    STDOUT 是命令或脚本生成的数据，然后默认发送到终端。尽管如此，输出可以重定向到另一个命令并用输入，或者发送到打印机、文件等。


    使用之前的示例，如果你输入 `echo HelloWorld`，`HelloWorld` 的输出将显示在终端上。


    **注意：** *此输出也可以使用 `>` 重定向到文件，例如：`echo HelloWorld > output_file.txt`*


    ## 命令管道


    管道将一个命令的输出重定向并发送到另一个命令进行处理。这是一个非常强大且广泛使用的操作符。它允许你从一个命令获取信息作为输出，并将其作为输入发送到另一个命令。


    示例：

    `ls -al | less`

    （按 Q 退出，或使用方向键上下移动）


    ## 输出重定向


    默认情况下，每个命令都从 STDIN 读取并写入 STDOUT。然而，你可以更改这一点并重定向输出。例如，你可以将输出重定向到文件。


    有几种类型的重定向操作符执行不同的操作，因此了解它们之间的区别是非常重要的。


    - `command > output_file` 将命令的 STDOUT 重定向到文件。


    示例：

    `ls -l > ~/output_file.txt`

    `cat ~/output_file.txt`


    **注意：** *如果文件已存在，这将覆盖该文件。*


    - `command >> output_file` 将命令的 STDOUT 追加到现有文件中。


    示例：

    `ls -l >> ~/output_file.txt`

    `cat ~/output_file.txt`


    - `command 2> output_file` 将 STDERR 重定向到文件，或者在下面的示例中，它被重定向到 *dev/null*，这样它就不会在控制台上显示任何内容。


    示例：

    `ls -l / 2> /dev/null`


    - `command &> output_file` 将 STDOUT 和 STDERR 都重定向到文件，或者在下面的示例中，它们被重定向到 *dev/null*，这样它们就不会在控制台上显示任何内容。


    示例：

    `ls -l / &> /dev/null`


    - `command < input_file` 将文件内容重定向回命令（即将其作为输入）。

    示例：

    `wc -l < input_file`


    - `2>&1` 将 STDERR 和 STDOUT 输出重定向到同一个文件

    示例：

    `du / > output_file 2>&1`


    **提示：** *通过将输出重定向到 devnull，控制台上不会显示任何内容。devnull 设备可以被认为一种黑洞，它具有无限的大小，但无法从中检索到任何内容。*


    **注意：** *所有的重定向操作符有：`<`, `>`, `>|`, `<<`, `>>`, `&>`, `<>`。这些重定向操作符中的几个在本节之前已经讨论过，但还有另一些你可能较少使用或从不使用的。还有更晦晦的，但书中未涵盖，因为它们仅提供有限的价值或用于特殊情况场景。*


    - `cmd >| file` ：覆盖文件，即使 shell 禁用了此功能。

    - `cmd1>& cmd2` ：将 cmd1 的 STDERR 和 STDIN 都重定向到 cmd2

    - `cmd <> file` ：在 STDIN（或 cmd）上打开一个文件进行读写。


    ## 进阶：使用命令替换


    可以使用一个命令的输出作为输入，这被称为命令替换。要利用此功能，使用美元符号后跟括号。例如，输入 `$(date)`


    命令替换的旧形式使用反引号（` \ `）来包围命令。例如，输入 `echo \date\`


    ## 进阶：变量扩展


    变量扩展是在执行命令时将变量名替换为值。例如，执行 `echo $VAR`，它将显示变量的值。


    **提示：** *以下函数对调试很有用，因为它会显示结果：* `() { echo "$@"; }*


    ## 基础 Shell 命令


    **概述：** 本章包含一组命令。这些命令用于执行基础系统功能和操作，例如管理命令历史、检查系统进程信息等。


    你会发现 Linux 有一个非常强大的命令历史功能，具有许多快捷键和技巧可以方便访问以前使用的命令。


    要查看你以前输入的命令列表，输入：history


    **注意：** *你输入的命令历史存储在文件中：~/.bash_history*


    要执行列表中的特定命令，输入：!**#** （将 **#** 替换为运行的命令编号（例如：!100 ))


    **提示：** *如果你在命令前加一个空格，它将不会从 shell 历史记录中省略。*


    '
