    or change its formatting.

    - Print columns 1 and 3 from input_file and output it into output_file, type:
    awk ''{print $1,3}'' input_file > output_file

    - **Tip:** *col1..9 is a simple alternative to using awk commands. col1 is just
    a simple script that splits and prints given column based on name that used.*

    - Ex 1a: mount | awk ''{print $3}''

    - Ex 1b (equivalent): cat etcpasswd | awk -F":" ''{print $7}''

    - Output characters from 8 to 15 from input_file and output it into output_file,
    type: cut -c 8-15 input_file > output_file

    - Replace string of text from input_file and output it into output_file, type:
    sed "s/**search_word1/**/**search_word2**/g" input_file > output_file

    - Replace any character with another character, type: cat input_file.txt | tr
    -t

    - Convert the contents of a file to upper case, type: cat input_file.txt | tr
    a-Z > output_file.txt

    - Displays a count of all the different occurrences of data from output, type:
    history | awk ''{ print $2 }'' | sort | uniq -c | sort -rn

    - (removes invisible characters) the contents of a file, type: while IFS= read
    -r line; do echo "$line"; done < input_file.txt > output_file.txt

    - **Note:** *Replace somefile.txt with the file you want to filter. The output
    will be written to ''newfile.txt''.*


    ## Networking


    These oneliner commands are for performing network level operations and functions.
    For example, sharing files, monitoring connections, etc.

    - Graph the number of connections for each host, type: netstat -an | grep ESTABLISHED
    | awk ''{print $5}'' | awk -F: ''{print $1}'' | sort | uniq -c | awk ''{ printf("%s\t%s\t",$2,$1)
    ; for (i = 0; i < $1; i++) {printf("*") }''

    - Share file through HTTP port: 80, type: sudo nc -v -l 80 < **file_name.ext**

    - **Note:** *Open the web browser to the local IP address of the machine from
    which you’re sharing from. To test out this feature, type:* 127.0.0.1 OR-LocalHost

    - Query the domain and owner information, type: whois **example.com**

    - To install the command, type: sudo apt-get install whois OR-sudo yum install
    whois

    - Download an entire website, type: wget --random-wait -r -p -e robots=off -U
    Mozilla http://www.example.com

    - Search and filter network packets, type: ngrep -O network_capture.pcap -q ''HTTP''

    - To install the command, type: sudo apt-get install ngrep OR-sudo yum install
    ngrep

    - Captures traffic for Wireshark (https://www.wireshark.org/) from a specific
    ETH1 interface, type: tcpdump -i eth1 -s0 -v -w ***tmp*****capture.pcap**

    - Shows all the local users on the system, type: lslogins OR—lslogins **user_name**

    - Backup files from one location to another location, type: rsync -vare ssh user@192.168.0.100:***path*****to/directory/******home*****user/backup/**

    - Testing a remote port to see if it is open, type: curl -s **example.com:80**
    >*/dev/null && echo Success. || echo Fail.

    - More advanced version, type (replace the IP and PORT parameter as appropriate),
    type: IP="example.com" ; PORT="80" ; curl -s "$IP:$PORT" > */dev/null && echo
    "Success connecting to $IP on port $PORT." || echo "Failed to connect to $IP on
    port $PORT."

    - Another version of the example of the previous oneline, type: timeout 1 bash
    -c "<*dev*/tcp/**example.com/80**" && echo Port open || echo Port closed

    - A simpler version, type: nc -vz **example.com 80** OR—telnet **example.com 80**

