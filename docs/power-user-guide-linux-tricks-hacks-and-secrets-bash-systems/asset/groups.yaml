    ## Blocking USB Drives


    It is possible to prevent a user from utilizing a USB flash drive on your system.


    This can help protect against someone from installing new software or stealing


    data from it.


    Although, like any security change it may seem small, but it is only one


    proverbial spoke in the hub of any security model.


    Use the `lsmod` command to display all loaded kernel drivers, filter out


    USB storage: `sudo lsmod | grep usb_storage`


    **Note:** *To verify that the next operation completed successfully, run

    the previous command again that the line isn''t there.*


    You should see that sub_storage module is in use by UAS module. You

    now need to unload both USB storage modules from kernel.


    `sudo modprobe -r usb_storage`

    `sudo modprobe -r uas`


    You have blocked USB storage module from loading into kernel after future


    reboots. To do this, rename the `usb-storage.ko.xz` module to `usb-storage.ko.xz.block`.


    `cd /lib/modules/`uname -r`/kernel/drivers/usb/storage/`

    `sudo mv usb-storage.ko usb-storage.ko.block` (For Debian based systems)

    -OR- `sudo mv usb-storage.ko.xz usb-storage.ko.xz.block` (For Red Hat based systems)


    **Tip:** *To revert the functionality on the system back to its original state.
    All you

    have to do is rename the* `usb-storage.ko` file back to its original name (then

    reboot the system), type:* `cd /lib/modules/`uname -r`/kernel/drivers/usb/storage/`

    `sudo mv usb-storage.ko usb-storage.ko.block` (For Debian based systems)

    -OR- `sudo mv usb-storage.ko.xz usb-storage.ko.xz.block` (For Red Hat based systems)


    **Note:** *This method only applies to the current runtime kernel

    modules. If there are any other available kernels on the system, you

    will need to modify each of the kernel module directory version

    path and rename the files.*


    ## Enabling SELinux


    Security-Enhanced Linux (SELinux) is a compulsory access control security


    mechanism provided in the kernel. Disabling SELinux means removing security


    mechanisms from the system.


    It is recommended that you enable this feature if your system is attached to the


    internet and is accessible by the public.


    To check if SELinux is enabled, type:

    `sudo sestatus`

    -OR-

    `getenforce`


    To enable this feature if it is disabled, type: `sudo setenforce enforcing`.


    **Notes:** *It also can be managed (enabled or disabled) from the*

    ***etc/selinux/config**** file.*

    *SELinux provides three basic modes of operation and they are:*

    ***Enforcing**: This is the default mode which enables and enforces the

    SELinux security policy on the machine.

    ***Permissive**: In this mode, SELinux will not enforce the security policy on

    the system, only warn and log actions. This mode is very useful in terms

    of troubleshooting SELinux related issues.

    ***Disabled**: SELinux is turned off.*


    ## Monitoring User Activities


    To protect against outsider (i.e. malicious users) or insider (i.e. your employees)


    threats, you need to monitor user activities. The malicious user (or the outside

    attacker) are the easiest threats to understand. While the insider threat, is
    the

    most difficult to protect against, because generally this is a person that is
    trusted

    by the organization.


    There are two utilities that can monitor user activity: psacct (for Red Hat based

    systems) or acct (for Debian based systems) that are useful for monitoring user

    activities and processes on a system. These tools run in the system in

    background tracking each user activity on a system and resources consumed by

    services such as Apache, MySQL, SSH, FTP, etc.


    To install these utilities, use one of the following commands: For Red Hat

    based systems:

    `sudo yum install psacct`


    For Debian based systems:

    `sudo apt-get install acct`


    ## Monitoring Log Files


    Protecting your logs is critical to help you troubleshoot problems with your

    system or applications. They can also tell you if an intruder attacks your system,

    and possibly how they may have compromised it. This is why you will want to

    prevent an intruder from easily deleting or modifying the local log files.


    To help prevent intruders from easily modifying or destroying local logs.

    Next are the common Linux default log files name and their usage.


    - `/var/log/auth.log`: Authentication logs.

    - `/var/log/boot.log`: System boot log.

    - `/var/log/cron.log`: Crond logs (cron job).

    - `/var/log/kern.log`: Kernel logs.

    - `/var/log/message`: System logs (current system activity).

    - `/var/log/mysqld.log`: MySQL database server log file.

    - `/var/log/secure`: Authentication log.

    - `/var/log/utmp` OR `/var/log/wtmp`: Login log file.

    - `/var/log/yum.log`: Yum log files.


    **Note:** *The availability of these logs and locations will vary between*

    distros and versions of application and services that are installed. There

    might be other logs that you should monitor as well, it might require*


    ## Ignoring ICMP or Broadcast Requests


    It is possible to tell Linux to ignore ICMP or broadcast requests.


    Accurate time is crucial for modern encryption. If system doesn''t have

    accurate time, certain features may not work.


    Systemd provides the systemd-timescd client, which queries

    remote servers and adjusts system time. Configure this

    in the following file: `/etc/systemd/timesyncd.conf`.


    **Note:** *Most distros provide a default configuration that

    points to time servers.*


    ## Networking


    Reliable and trustworthy DNS is critical for network security. If you are

    using public DNS outside an organization, use a trusted DNS such as:

    Google Public DNS (set DNS to 8.8.8.8 and 8.8.4.4) -OR-

    1.1.1.1 (set DNS to 1.1.1.1 and 1.0.0.1) [Partnership between

    Cloudflare and APNIC].

    '
