- md: '

    ## System performance


    Test the performance of your hard drive, type: `hdparm -Tt /dev/hda`


    Check local storage write speed, type: `dd if=/dev/zero of=/tmp/output.img bs=8k
    count=256k conv=fdatasync; rm -rf /tmp/output.img`


    Shows the processor and memory bandwidth in GB/s, type: `dd if=/dev/zero of=/dev/null
    bs=1M count=32768`


    By holding down the ''Alt'' and ''SysRq'' keys on your keyboard and whilst they
    are held down type the following slowly: R E I S U B


    **Warning:** *This will restart your computer without having to hold the power
    button.*


    ## Scheduling Tasks


    There are two subsystems in Linux for scheduling a task to execute at a future
    time. There is the AT and the CRONTAB scheduling subsystems. Each one of these
    services has its advantages and disadvantages to using them.


    ### AT Scheduler


    The first method is `at` command, this is very basic and easy to use. The thing
    that you have to understand about the `at` command is that it can only run a set
    of commands once at a specific time/date.


    To run commands at a specific time, type: `at 9:30 AM 05/10/2025` press Enter.
    Then enter a sequence of command(s) to run (example: `ls -l > /tmp/at_output.txt`)
    press Enter after each command, then press Ctrl+D to exit the at editor.


    AT service management commands:


    - `atq` : Lists user’s pending AT command jobs.

    - `atrm job_number` : Deletes user’s pending AT command jobs.

    - `batch` : Executes commands when system load levels permit.


    **Tip:** *Using the batch command you can run another command or script when the
    CPU load average is below a certain threshold, type: `rm -rf /largedirectory/*
    | batch` (batch is part of the at, and relies on its service. **Warning: use with
    care, because this command will delete files recursively**)*


    **Note:** *The AT scheduling daemon (or service) must be running for this command
    to work.*


    ### CRONTAB Scheduler


    The second command is `crontab`, this command is more robust then the AT service.
    The crontab command, can run jobs at regular intervals. That will be one of the
    main differentiators when choosing which scheduler you want to use.


    The first thing you have to learn when using crontab is the command has six arguments.
    Arguments one thru five, defines the date and time the command is supposed to
    be execution. The sixth argument defines the command or script to be executed.


    **Note:** *The crontab syntax are as following: [Minute (0-59)] [hour (0-23)]
    [Day_of_the_Month (1-31)] [Month_of_the_Year] (1-12) [Day_of_the_Week (0-6, 6
    = Sunday)] [command (i.e. path2script).*


    To create a CRON scheduled job (aka CRON Job), first type: `crontab`. Then you
    will be put into a mini-editor (very limited editing functionality). To create
    a job that runs on 8:05am on January 8th, then executes the command, `echo "Hello,
    World"`.


    If type `crontab`. You would have to type: `05 08 08 01 * echo "Hello, World"
    > test_file.txt` Then press Ctrl+D when done.


    By default, crontab entries are for the currently logged in user. To see all the
    defined jobs, type: `crontab -l`


    To edit the CRONTAB entries in an editor, type: `crontab -e`


    To edit another user’s CRONTAB use the following arguments, type: `crontab -u
    user_name -e`


    **Notes:** *Wildcard: The asterisk (*) matches anything. Ranges: Use the hyphen
    (-), to define ranges (i.e. Mon-Fri, 6-9, Jan-Feb). Multiple ranges: Use comma
    to separate more than one range.*


    Keywords Shortcuts


    CRON also supports some predefined keywords shortcuts for common time equivalents
    (i.e. hourly, daily, etc.). The table shows keywords and time equivalents:


    | Keyword | Equivalent |

    | :--- | :--- |

    | @yearly | 0 0 1 * |

    | @daily | 0 0 * |

    | @hourly | 0 * * * |

    | @reboot | at startup |


    **Note:** *The CRONTAB file is located: /etc/crontab*


    ## NFS (Network File System)


    In Linux you can share files with other computers over the network using a service
    called NFS (Network File System). This service allows remote systems to mount
    a directory over the network to move files around between systems. NFS is mostly
    used for Linux systems where Samba uses SMB protocol which is used by Microsoft
    computers. OSX and higher have native support for NFS. While Windows 7 offers
    basic support for this, Windows 10 has better support (this can vary depending
    on edition). To install NFS, you have to install the client and service separately
    if you don’t need it.


    ### Installing/Configuring the NFS Service


    In order to host NFS shares on a device you will need the client installed to
    make them available remote. The first thing you need to do is check if the NFS
    service is already installed and running on your system, type: `dpkg -l | grep
    nfs-kernel-server`


    If this service is not already installed, type: `sudo apt-get install nfs-kernel-server`
    OR `sudo yum install nfs-utils`


    ### Setting NFS Directory


    It is important to note that Root (superuser) permissions are ignored by NFS by
    default. So even if you’re logged in with root permission, any related actions
    will be ignored by default. This is a security measure to prevent a remote takeover
    of the system. Although if needed, it is possible to grant root permissions on
    a share basis.


    First you have to create a mount point for the NFS shares that you''re going to
    mount, type: `sudo mkdir -p /var/nfs/myshare`. It’s important to note, these directories
    /var/nfs and /var/nfs/myshare will have 777 permissions, type: `sudo chmod -R
    777 /var/nfs/myshare`.


    To configure permissions on the share, you need to add them to the /etc/exports
    file. You will need to create a line for each directory that you want to share.
    For example: `share_directory client_ip_address(share_option1,...)`.


    - **rw**: Grants the client computer both read and write access to the share.

    - **sync**: This option forces NFS to write changes to local storage before replying.

    - **no_subtree_check**: This option prevents subtree checking, which has some
    mild security implications. Although, it can improve in some circumstances.

    - **no_root_squash**: By default, NFS translates requests from a root user remotely
    into a non-privileged user on the server. This option disables this behavior for
    certain shares.


    After you modified the /etc/exports file, you have to restart the NFS service
    for the changes to take effect, type: `sudo service nfs-kernel-server restart`


    ## Setting up Firewall for NFS


    If a firewall is running on the host machine, and in most cases it generally will.
    You will need to open up specific ports on the firewall to make the NFS service
    available to remote systems.


    **Note:** *This section assumes you have the UFW utility installed on your computer
    for managing the firewall. For more information about the UFW utility, see the
    following section "Making IPTABLES easier"*


    The first thing you want to do is check the status of your firewall, type: `sudo
    ufw status`


    **Note:** *If the firewall is not enabled, it is recommended that you enable this
    feature.*


    To see what applications are enabled in the firewall, type: `sudo ufw app list`


    **Note:** *The UFW utility will check the /etc/services for the port and protocol
    a service uses.*


    To add the port to the firewall, type: `sudo ufw allow from any to any port nfs`


    It is important to note, that NFS best practice recommends restricting the connection
    to a specific client, type: `sudo ufw allow from 192.168.0.100 to any port nfs`

