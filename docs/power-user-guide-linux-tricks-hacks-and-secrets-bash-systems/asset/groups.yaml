- md: '

    There is an older one that has modern limitations due to its age, and offers backwards
    compatibility with older filesystems. There is a newer one that overcomes the
    technical limitations of the previous one, but offers forward compatibility with
    newer filesystems.


    MBR (Master Boot Record), has been around for several decades and it is still
    utilized by older applications, but only allows for four primary partitions, and
    the partition size can’t be greater then 2TB. It is possible to subdivide a primary
    partition into smaller logical partitions, called an extended partition.


    GPT (GUID Partition Table) is a more modern standard, and overcomes the limitation
    of MBRs. Although, it requires newer hardware and firmware in order to support
    these features. Most modern hardware should have no problem utilizing it.


    In most cases if you have to make a selection between the two types of partition
    tables, GPT is going to be your better choice because of the forward support.
    Unless you have a need to support older applications or hardware that is not compatible
    with the newer file system.


    ## Filesystem


    Once the storage device is properly partitioned, it needs to be formatted for
    the filesystem to actually utilize it. Formatting prepares the partitioned area
    for the storage device to hold data. Without the formatting you can’t store data
    on the device.


    Linux supports several different filesystems, each has their advantages and disadvantages,
    including operating system support. At the highest level most files systems operate
    the same (i.e. managing files), it is how they perform operations at lower-levels
    that differentiates them. For example, commands and related mechanisms used to
    perform the maintenance operations can be different.


    The current most popular Linux filesystems, are:


    - BTRFS: is a newer filesystem, which utilizes copy-on-write technology. This
    architecture allows for volume management functionality to be handled at the filesystem
    level. This allows for features such as, snapshots and the cloning of volumes.
    The problem with the filesystem is the lack of maturity. Some administrators are
    waiting for problems to be fixed before its ready for production workloads.


    - EXT4: this is the forth extension of the filesystem, and it tends to be the
    default choice when formatting a volume. EXT4 is a mature journaling filesystem
    that offers backwards compatibility with legacy systems. It has a very extensive
    utility support, and has a good track record for reliability.


    - XFS: Is designed for performance when dealing with very large data files. It
    has better throughput characteristics when dealing with large storage devices.
    It also supports features like snapshotting. Unlike EXT4, it uses metadata journaling
    as opposed to journaling both the metadata and data. XFS offers great performance,
    but is very sensitive to data corruption if there is a power loss.


    - ZFS: utilizes a copy-on-write filesystem and has a mature and robust volume
    manager. It supports data integrity features, can handle large files sizes and
    includes features like snapshotting, cloning, and a software RAID support for
    redundancy and performance purposes. ZFS does have a controversial history because
    of licensing concerns. It also has mixed support among different distros.


    ## Managing Storage Devices


    As stated earlier, all devices are treated as a file. All storage devices are
    represented as files in the /dev directory. These file names generally start with
    SD or HD followed by another letter. For example, one hard drive name might be
    /dev/hda, or /dev/hdb.


    Partitions are also treated as files, and are stored in the /dev directory. Every
    storage device with a partition has a number added to the end of the device name.
    For example, partition 1 the device name will be /dev/hda1, partition 2 device
    name will be /dev/hda2.


    **Notes** The Linux kernel decides which device gets which name on each boot.
    This can lead to confusing scenarios where a device’s name can change.


    The Filesystem Hierarchy Standard (FHS) recommends using /mnt subdirectory or
    another one under it for temporarily mounted filesystems. There are no recommendations
    where to mount more permanent storage, but /mnt subdirectories can be used.


    ## Permanent Mount Points


    Linux loads files systems using a file called /etc/fstab (filesystem table), this
    file tells the operating system which filesystem to load during the boot process.
    Any filesystem that doesn’t have an entry in the file will not be automatically
    mounted.


    The /etc/fstab is just a basic text file. Each line represent a different filesystem
    that is supposed to be mounted at startup. Each line is formatted with the name
    of the block device, the mount point to associate it with, the type of filesystem
    the block device uses, mounting options and any additional information.


    **Note:** A unit configuration with an extension ".mount" holds information about
    a filesystem mount point controlled by systemd process.


    ## Logical Volume Management


    Logical Volume Management (or LVM) allows you to abstract the physical characteristics
    of several different block storage devices, to make them appear as a single larger
    block device. It is then possible to partition the large drive into smaller logical
    volumes.


    LVM is also utilized to overcome the limitations of traditional storage partitions.
    For example, an LVM volume can be expanded, spanned across multiple devices, snapshot
    partitions, and moving volumes around drives.


    More information, type:

    man lvm


    ### LVM Commands


    The following commands implement the core LVM functionality.


    - lvchange : Changes attributes of a Logical Volume.

    - lvconvert : Converts a Logical Volume from mirror or snapshot.

    - lvcreate : Creates a Logical Volume in an existing Volume Group.

    - lvdisplay : Displays attributes of a Logical Volume.

    - lvextend : Extends the size of a Logical Volume.

    - lvmchange : Changes attributes of the Volume Manager.

    - lvmconfig : Displays the configuration information after loading lvm.conf and
    any other configuration files.

    - lvmdiskscan : Scans for all devices visible to LVM.

    - lvmdump : Creates LVM2 information dumps for diagnostic purposes.

    - lvreduce : Reduces the size of a Logical Volume.

    - lvremove : Removes a Logical Volume.

    - lvrename : Renames a Logical Volume.

    - lvresize : Resizes a Logical Volume.

    - lvs : Reports information about Logical Volumes.

    - lvscan : Scans (all disks) for Logical Volumes.

    - pvchange : Changes attributes of a Physical Volume.

    - pvck : Checks Physical Volume metadata.

    - pvcreate : Initializes a local storage or partition for use by LVM.

    - pvdisplay : Displays attributes of a Physical Volume.

    - pvmove : Moves Physical Extents.

    - pvremove : Removes a Physical Volume.

    - pvresize : Resizes a local storage or partition in use by LVM.

    - pvs : Reports information about Physical Volumes.

    - pvscan : Scans all disks for Physical Volumes.

    - vgcfgbackup : Backups Volume Group descriptor area.

    - vgcfgrestore : Restores Volume Group descriptor area.

    - vgchange : Changes attributes of a Volume Group.

    - vgck : Checks Volume Group metadata.

    - vgconvert : Converts Volume Group metadata format.

    - vgcreate : Creates a Volume Group.

    - vgdisplay : Displays attributes of Volume Groups.

    - vgexport : Makes volume Groups unknown to the system.

    - vgextend : Adds Physical Volumes to a Volume Group.

    - vgimport : Makes exported Volume Groups known to the system.

    - vgimportclone : Imports and rename duplicated Volume Group (i.e. a hardware
    snapshot).

    - vgmerge : Merges two Volume Groups.

    - vgmknodes : Recreates Volume Group directory and Logical Volume special files.

    - vgreduce : Reduces a Volume Group by removing one or more Physical Volumes.

    - vgremove : Removes a Volume Group.

    - vgrename : Renames a Volume Group.

    - vgs : Reports information about Volume Groups.

    - vgscan : Scans all disks for Volume Groups and rebuild caches.

    - vgsplit : Splits a Volume Group into two, moving any logical volumes from one
    Volume Group to another by moving an entire Physical Volumes.

