- md: '

    - To clear the current session history, type: *history -r*

    - Re-execute the last command you entered, type: !!

    - Reruns the last command, with root permissions, type: sudo !!

    - **Tip:** *Repeats the last command until it executes successfully, type:* *until
    !!; do :; done*

    - Echo the last command to the terminal, type: !!:p

    - Find and execute the last command in the search history that matches a search
    string (i.e. *echo*), type: !?echo**

    - **Tip:** *To search and execute the last command that matches the string, type:*
    *!?echo**?:p*

    - Re-execute the options from the last command, type: !$

    - Example: Lists a directory folder, then changes the path to it, type: ls /bin
    (press Enter) cd !$ (press Enter) Inserts the last command without the last argument,
    type: !:-

    - Press Ctrl+R to reverse search the command history.

    - **Note:** *This only works one command at a time, Ctrl+R for the next one (press
    Ctrl+C to cancel).*

    - **Tip:** *Get more information (i.e. date and time) from the history command,
    type:* *HISTTIMEFORMAT="%d/%m/%y %T " && history*

    - To save the last long command that was run into a script: echo "!!" > script_file.sh

    - **Tip:** *Pressing ESC then \* (asterisk or the TAB key) will insert the auto-completion
    command line results, type:* *lsb_<ESC>\**

    - **Note:** *Pressing ESC then . (period) will insert the last argument of the
    last command*

    - See free memory in GBs, type: free -g

    - See all running process, type: ps -A

    - A more useful version if several processes are running, type: ps -aux | less

    - List all running processes containing the string (i.e. stuff): ps aux | grep
    search_query

    - See the current date and time, type: date

    - **Tip:** *Display the local time for 10AM next Wednesday on the west coast of
    the US, type:* *date --date=''TZ="America/Los_Angeles" 09:00 next Fri''*

    - Record whatever is typed in your shell (with timing) to a file named ''typescript'',
    type: script -t 2> timing.txt -a session.txt

    - Run some commands here, when done type: Ctrl+D or exit. To play back the recorded
    script, type: scriptreplay timing.txt session.txt

    - Display the name and version of the distro that you''re running, type: uname
    -a OR— lsb_release -a

    - To install the command, type: sudo apt-get install lsb OR—sudo yum install redhat-lsb-core

    - Another method for checking the distro, type: cat /etc/issue

    - See what username you''re logged in as, type: whoami

    - If you don''t want to learn a text editor like vi, or vim, type: nano filename.txt

    - **Note:** *nano is a very basic text editor, designed to be easy to use (it
    is not as powerful as the other text editors).*

    - To create a variable that can be used by your scripts, type: export test=HelloWorld
    To display contents of the variable, type: echo $test

    - **Tip:** *To see all the environment variables, type:* *env*

    - To enumerate defined variables that begin with the letter ''S'' (or any other
    letter), type: echo ${!S\*}

    - To see the contents of a variable, type: echo $SECONDS

    - Move a file from its current directory location to the previous one you were
    in, type: mv file_name.ext $OLDPWD

    - **Note:** *$OLDPWD is a defined variable that stores the last directory you
    were in. For example, type: cd /home , then type: echo $OLDPWD . It will display
    name of the previous directory.*

    - Improvised stop watch (press Ctrl+D to stop it), type: time read

    - Need help finding a command to perform an operation, type: apropos "directory"
    OR— apropos "file"

    - To see a calendar for the current year or any other date, type: cal OR- cal
    -y OR- cal 2025

    - Displays the system uptime (i.e. the time since the operating system started),
    type: uptime OR— uptime -p

    - Time how long it takes for a command to complete, type: time ls -al /

    - To set the time on the local system, type: sudo date --set="20:20:00"

    - Display an ASCII chart, type: man 7 ascii


    ## Managing MultiUser Systems


    UNIX (and later Linux) have been multiuser systems from the beginning of their
    existence as an operating system. Linux has several utilities and commands for
    displaying and managing logged in users.


    - Displays a summary of the current logged in user(s), type: who OR— users

    - Show when a user last logged (including the real and effective user IDs) into
    the system, type: last user_name OR— last -ap

    - Display information about known users on the system, type: logins -u


    **Note:** *The utmp, wtmp, btmp keep track of all logins and logouts to the system.
    These files are used by the following commands, last, and logins; utmp maintains
    a full accounting of the current status, system boot time (used by uptime), recording
    terminals, system events; wtmp records failed login attempts (including the last
    processes they ran); btmp displays a summary of the current activity and logged
    in user(s), type: last; lastlog shows the details of a recent login of all users,
    type: cat /var/log/auth.log*


    ## Filesystem Commands


    These commands and utilities perform basic management functions. example, for
    managing files, and storage. Linux has a very robust set of commands for managing
    storage devices, filesystems (including partitions and volumes), and the related
    files. **Notes:** *For more information about the filesystem, see the following
    section "Storage Management", basically this means that output is not listed as
    a long number of blocks that are easy to understand (i.e. M = Megabytes, G = Gigabytes,
    etc.). Some commands and utilities support this feature, while others’t.*


    | Format | Filesystem | Size | Used | Available |

    | :--- | :--- | :--- | :--- | :--- |

    | Regular | root | 23701280 | 14417528 | 9284332 |

    | Human Readable | Root | 227G | 138G | 89G |


    - See free local storage space in human readable format, type: df -h

    - To see the files in a directory, type: ls OR- ls -l To see all (including hidden
    ones) the files in a directory, type: ls -al

    - **Note:** *If a filename has a ''.'' in front of it, the file will not be displayed
    with the normal ''ls'' command.*

    - List files sorted by size (human readable), type: ls -Srh

    - **Tip:** *A shortcut for ls -l (list directory in long format), type: ll*

    - Changes path to user''s home directory, type: cd ~ OR- Takes you back to the
    previous directory, type: cd -

    - **Note:** *To see the current path, type: pwd*

    - To make a directory, type: mkdir folder_name

    - To copy a file, type: cp input_file output_file Use the -r to make it recursive,
    type: cp -r dir1 dir2

    - To delete a file, type: rm file_name.ext

    - **Warning:** *Be careful when using wildcards or other recursive features with
    a command that destroys data, you can end up deleting a great deal of data quickly
    that you didn’t intend to.*

    - **Tip:** *Delete all files except those that match search string (i.e. .txt),
    type: rm !(.txt)*

    - To delete a folder, type: rmdir folder_name

    - To delete a directory recursively (i.e. subdirectories, folder1/folder2/folder3),
    type: rm -r folder_name

    - **Tip:** *The command is interactive, it will ask for permissions before deleting
    anything, to make it not prompt, type: rm -rf folder_name*

    - To find the location of system files, type: locate samba.conf

    - To find out where a file is located, type: locate -i .bashrc

    - **Note:** *The locate command works by searching a database that is maintained
    by the updatedb command.*

    - See the contents of a file, type: cat file_name.ext

    **Example Output:** user@localhost:~$ cat text_file.txt Lorem ipsum dolor sit
    amet, consectetur adipiscing elit. In quis metus facilisis aliquam quis non nisl.-
    **Tips:** *To see the contents of a file one page at a time, type: more file_name.ext
    The less utility is an advanced version of the more command, type: less file_name.ext*

    '
