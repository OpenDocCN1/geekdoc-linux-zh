    ## 警告


    请自行承担风险并使用本书中的信息。所有内容可能随时更改。这不受我的控制。作者和出版商对使用本书内容可能引起的任何损坏或问题不承担责任。


    我已尽力保持信息尽可能有用且相关。因此，如果您在使用我的某个命令时遇到问题，我深表歉意。请告知，我将尽力在书的后续版本中修复此问题。


    不要在生产环境中测试这些命令。请先在开发区域进行测试，并确保它们在您的基础设施中能够正常工作。


    这些某些命令可能会并破坏数据，因此**在使用它们之前，请确保您已经对数据进行了良好的测试备份。**


    ## 兼容性


    Linux 命令、URL、*等等* 一直在不断更新、淘汰或被取代。因此，我无法保证您阅读本书时书中内容的准确性。导致准确性问题的因素还包括不同的发行版、发行版版本、shell、命令和实用程序。即使是制作发行版的公司和人员也一直在使用最新工具演进操作系统，并淘汰旧工具。


    ## 入门


    **概述：** 本书侧重于 Linux 命令行。它没有为 X-Windows（Linux 的 GUI 图形用户界面）提供任何帮助。书中提提到它，但它不是重点。


    本书的内容为 BASH（Bourne-Again Shell 的缩写）shell 编写。本书并不试图偏向某一个发行版，而是试图在具体问题上尽可能保持通用性。


    以这种方式编写书的一个缺点是，我可能并不是针对您当前正在使用的 Linux 版本。如果您想要一本针对特定发行版的书，我建议您查看其他资源。


    请注意，取决于您使用的发行版（又称 Distro），您可能使用另一个 shell（例如 csh, tcsh, ksh, ash, zsh 等）。如果您处于另一个
    shell 中，只需在控制台中输入命令 `bash` 并按回车即可启动它。


    如果您正在运行 X-Windows，只需启动命令行终端（通常称为 terminal 或 console）。否则，您可以完全退出 GUI，希望它能让您回到命令行界面。如果不是，您将需要查找如何在您的发行版中执行此操作。


    ## Linux 无处不在


    Linux 似乎运行在一切设备上，从手表到大型机，以及其之间的所有设备。运行互联网的基础设施很大一部分是基于 Linux 的服务器。


    运行在物理服务器、桌面、笔记本电脑、虚拟机、云基础设施*等等*上的操作系统有多个不同的版本/变体。它还是 Mac OS X、iOS、Android 的底层操作系统。大多数
    IoT（物联网）设备，如树莓派以及无数其他类似设备。


    ***树莓派 3 B+ 单板计算机，由英国布拉德福的 Gareth Halfacree 设计。***


    Windows 10 的最新版本现在包含一个 Linux 子系统，称为 WSL。这允许用户在原生 Windows 系统中启动 Linux 终端，而无需使用虚拟机或类似
    Cygwin 的产品。


    ## Linux 核心哲学


    如前所述，每个发行版处理问题的方式似乎略有不同，并有自己的方式/风格。尽管如此，大多数 Linux 版本都遵循一些通用哲学和原则，下文概述。


    Linux 的核心是内核，它控制所有低层功能（例如应用程序与硬件之间的通信）。内核最初由 Linus Torvalds 设计，目前仍由他和其他许多人（https://www.kernel.org/）维护。Linux
    内核由所有发行版共享。


    三个主要的发行版，几乎所有可用的发行版都是基于这些 Linux 操作系统版本之一。


    - **Debian** 是一个强调自由软件的发行版。它支持许多硬件平台。

    - **Red Hat** Linux 是原始主要发行版之一，分为商业版和社区支持的发行版。社区支持的 Red Hat Linux 赞助版名为 Fedora，商业支持的版称为
    Red Hat Enterprise Linux。

    - **Slackware** 是一个高度定制的发行版，强调维护的便利性和可靠性，而非尖端软件和自动化工具。通常被认为是面向高级用户的发行版。


    由于 Linux 最初基于 UNIX 的，因此它曾使用“运行级别”（runlevels），即描述系统相对于可用服务状态的操作层级。例如，如果系统使用运行级别
    1，则它处于单用户模式。您通常处于运行级别 2-5 中，这是多用户模式。有关文件系统的更多信息，请参见后续章节“Linux 运行级别”。


    **注意：** *大多数现代 Linux 发行版不再使用运行级别。运行级别技术不支持启动并行运行多个服务的系统。*


    Linux 是一个完全多任务（一种同时执行多个任务的方法）、多用户操作系统，其服务进程被称为守护进程（daemons）。Linux 有四种账户：root、System、Normal、Network。root（超级用户，又称管理员）账户最强大，拥有对系统的完全访问权限。


    新实用程序的安装过程取决于发行版。例如：


    `sudo yum install package_name`（基于 Red Hat 的系统上）或

    `sudo apt-get install package_name`（基于 Debian 的系统上）


    **注意：** *安装新程序有多种不同方法。使用包管理器只是让安装新实用程序更容易。其他方法可能包括从 Git 下载仓库并进行编译，而其他程序可能需要不同的方法。*


    Linux 在命令、选项、文件路径、*等等*方面是**区分大小写**的。如果您以前习惯于 Windows 等操作系统，这将是您必须适应的内容之一。在 Linux
    文件系统的目录或文件名中，如 /boot、/Boot 和 /BOOT 代表不同的目录。


    可用的命令、目录以及配置文件的位置在不同的 Linux 发行版之间可能会不同。开玩笑地说，“它们完全一样，除了不同之处之外。”您可能需要研究这些文件存储在哪里，以及它们在不同发行版中可能被命名。


    任何具有 .conf 后缀的文件通常意味着它是一个持有应用程序配置的文本文件（例如 yum.conf）。Linux 通过文件或类似于文件的对象提供其组件。进程、设备和网络套接字由类文件对象表示，并且通常可以使用用于普通文件的相同工具进行操作。


    之所以有许多命令和实用程序，是因为 Linux 的设计哲学。命令被设计用来很好地执行一个功能或操作。程序通常存储在以下路径之一：/bin, /usr/bin,
    /sbin, /usr/sbin。这会根据您使用的发行版和应用程序而变化。


    默认情况下，所有权限（即使您以 root 登录）都将从基础用户账户安全下运行（因此您可以运行 ls, cp, rm 等命令）。需要提升权限的命令要求您在前面加上前缀命令
    `sudo`（例如 sudo command -options）。在您按回车后，将需要您输入管理员密码并再次按回车。


    '
