    (2019 Edition)


    # Power User Guide:

    Linux Tricks,

    Hacks and Secrets

    [Volume 1]


    ***Power User Guide:*** ***Linux Tricks,***


    ***Hacks and Secrets*** ***(2019 Edition)***


    ***Ultimate Edition*** ***[Volume 1 & 2]***


    (Learning Linux by Example *Administrator commands, Guides and* *References* For:
    Beginners/Intermediate/Advanced)


    ![](img/0f524874379aa171ff08f51cdf3cfa83_1_0.png)


    **Book Summary:**


    Linux runs on everything these days, from things as small as watches, IoT devices
    (such as a Raspberry Pi, and other single board computers), smartphones, laptops,
    desktops, servers, network devices, and even mainframes. Linux is also used by
    many cloud services for management or running infrastructure, on Amazon Web Services
    (AWS), Microsoft Azure, or Google Cloud.


    There are three versions of this book, Volume 1 which is the **Bash Systems Administration**
    edition. There is also Volume 2 which is the **Bash Systems Reference** edition.
    There is also the **Ultimate Edition**, which contains all the content of both
    Volume 1 & 2.


    Volume 1, the **Bash Systems Administration** edition is for people wanting to
    learn Linux (for a job interview [i.e. Linux Systems Administration or Engineer,
    DEVOPS, DEVSECOPS, etc.] or creating an IoT device), or have been using it for
    years. This book is written for everyone that wants to start learning to master
    the Linux OS and the Bash shell. As well as learn how to take advantage of the
    advanced features. This book is designed to help you get started quickly or advance
    your existing skills without wasting your time.


    Volume 2 which is the **Bash Systems Reference** edition, contains references
    to hundreds of commands, examples, tips and notes to give you additional insight
    on commands or topics being covered. This book also includes a comprehensive quick
    reference (with examples) of over 600+ Linux commands. There are also several
    Linux and related quick start guides included on several advanced topics, including
    applications, networking topics, Bash keyboard shortcuts and a great deal more.


    **Topics covered:** Linux Operating Systems, Linux Commands, Bash One-liners and
    Scripting. How to install: Apache Web Server, MySQL, PHPMyAdmin, and PHP. How
    to install and manage Docker, and Git. System administration topics include: troubleshooting,
    networking, and more. Security topics include: overviews on firewall management,
    and how to lock down your Linux Operating System.


