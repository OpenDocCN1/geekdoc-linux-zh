    在当前目录下所有文件中搜索字符串 **search_pattern**（末尾的 \* 是搜索所有文件的通配符），请输入：grep -RnisI **search_pattern**
    \*


    将长文件（即段落）重新格式化为短行，请输入：fmt file_name.txt


    **示例输出：**


    *user@localhost:~$ cat text_file.txt* *Lorem ipsum dolor sit amet, consectetur
    adipiscing elit. In quis metus facilisis aliquam quis non nisl.*


    *user@localhost:~$ fmt text_file.txt* *Lorem ipsum dolor sit amet, consectetur
    adipiscing elit. In quis metus facilisis aliquam quis non nisl.*


    显示文件的详细统计信息和属性，请输入：stat file_name.ext


