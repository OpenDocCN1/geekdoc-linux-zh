    Every time you run a command (i.e. ls, cp, rm, etc.), this will generally

    start a process that runs under your user account.


    **Note:** *Every process has a process ID (i.e. PID) and will consume*

    some system resources. The most obvious ones are CPU time,*

    memory, open files, and devices. Some commands, utilities or*

    applications are more resource intensive then others.*


    Just about every command has some type of options (aka arguments) to

    expand its functionality. For example, if you type the command ls it will

    give you basic file information in a directory. If you type the command

    and option ls -l, it will give you additional information. If you add

    additional options such as ls -al shows an additional set of files that were

    not shown earlier.


    In Linux (and other UNIX-like operating systems), the entire system,

    regardless of how many physical storage devices are involved, are

    represented by a single tree structure. The root directory of the tree

    structure is represented by the ‘/’.


    When a filesystem on a drive or partition is mounted to the operating

    system, it must be joined into the existing tree structure.


    **Example of Linux Tree Structure** /


    | Path |

    | :--- |

    | /bin |

    | /boot |

    | /dev |

    | /etc |

    | /home |

    | /lib |


    **Note:** *The Filesystem Hierarchy Standard (FHS) defines the*

    directory structure and contents in Linux distributions. This*

    standard is maintained by the Linux Foundation. For more*

    information on FHS, see the following section "**Filesystem**Hierarchy Standard**"*


    ## Installing Linux


    **Overview:** This chapter covers the Linux getting started considerations with
    a

    Linux Distribution. There are several types of Distros (i.e. Distributions)

    available to choose from. Some are just Linux clients, others are for server

    purposes, and some are for general purpose use, while others are for specific

    purposes.


    The first step, is choosing the right distribution for what you want to do. The

    second step, is choosing how and where you’re going to install the distro you

    have chosen.


    Sometimes this choice will be made for you depending on what you’re trying to

    achieve or by the options that are available to you. Other times it will require

    research about the distro that you want to use with the end result in mind.


    ## Choosing a Distro


    There are literally hundreds of distros available to choose from. This list is
    far

    from complete, and only provides a few popular available options. One major

    suggestion before selecting any distro is to make sure it is still being actively

    developed by the community that supports it.


    Depending on the application that you’re trying to install will determine the

    distro and version that you can use. Other people have personal preference for

    one distro versus another.


    - **Debian**: A noncommercial distro and one of the earliest, maintained by a

    volunteer developer community with a strong commitment to free

    software principles and democratic project management. (More

    information: https://www.debian.org/)

    - **Ubuntu**: A desktop and server

    distro derived from Debian, maintained by British company Canonical

    Ltd. (More information: https://www.ubuntu.com/)

    - **Fedora**: A community

    supported distro supported by Red Hat. This distro is a technology testbed

    for Red Hat''s commercial Linux offering, where it prototypes new open

    source applications before integrating them into its commercial Red Hat

    Enterprise Linux. (More information: https://getfedora.org/)

    - **Slackware**:

    Originally created in 1993, it was one of the first Linux distros and among

    the oldest that is still maintained. This distro has a commitment to remain

    highly UNIX-like and easily modifiable by end users. (More information:

    http://www.slackware.com/)


    **Additional information:**

    DistroWatch (distrowatch.com) Latest information about Distros


    ## Commercial Linux Distros


    Just because Linux is free and open-source, doesn’t mean that all distros are
    free,

    and don’t contain some closed source software (i.e. any software that is not open

    source). This is a point of contention with the free and open source software
    (aka

    FOSS) purists.


    Red Hat was one of the early companies in the 90s that help legitimize Linux,

    including the idea of paying for professional support. Before this, all Linux

    support had to come through the online community.


    If you’re a professional organization, such as a business or government then you

    might want to consider using one of the commercial Linux distros because they

    offer paid 24x7 support. When using a community distro, the support model is

    ‘best effort’ (i.e. no guarantees), which you don’t want to hear when you’re in
    a

    critical situation.


    **Red Hat Enterprise Linux** (RHEL), a derivative of Fedora, maintained

    and commercially supported by Red Hat. It seeks to provide tested, secure,

    and stable Linux server and workstation support to businesses.


    ## Installing Your Distro


    You can install and boot Linux on several different classes of devices (i.e.

    physical, virtual, etc.). This decision should be made with the end goal in mind

    depending on what you’re trying to achieve. Otherwise, it should be made on the

    hardware you have available and is supported by the distro you want to run.

    Linux is legendary for running on older hardware that newer OSes may not

    support any more. The major consideration when installing Linux on new

    computer hardware is the availability of drivers for all the

    devices (i.e. cards, printers, etc.) that you want to use.


    You can also run a distro on a virtual machine (VM), running off a

    hypervisor on a physical computer or in a cloud infrastructure. Not all

    distros maybe supported in these environments, review what is supported

    by your hypervisor or cloud provider.


    There are also ‘live boot’ options for running Linux, where you can boot

    from a USB drive or optical disk. This doesn’t use

    internal storage, so it can leave no trace.


    - **Knoppix**: One of the first Live CD distribution to run completely

    from removable media without installation on local storage, derived

    from Debian.


    **Note:** *Your system’s firmware (BIOS or UEFI) has to be able to*

    *support booting off removable media (i.e. optical). Most*

    *modern systems support this feature through a boot menu.* (Wait, the original
    text says: "Your system’s firmware (BIOS or UEFI) has to be able support booting
    off removable media (i.e. optical)."


    The MacOS X, and Chromebook have native UNIX/Linux support. The

    MacOS X was built on top of a UNIX compatible OS. Google recently

    gave the Chromebook native Linux support.


    Windows 10 now offers a Linux subsystem called WSL. WSL already

    supports a few popular distros that are available for download from the

    Windows store.


    ## Introduction to the Console


    **Overview:** The first thing you have to learn is how to start up the Linux

    terminal. On each device this procedure can vary a little depending on the Linux

    distro that you are using and how you have it configured.


    If you''re running one of many of the Linux distros that boots into the command

    line, then there are no problems you can start running commands right away. If

    you''re using version Linux where the GUI starts first, just launch the terminal

    (or console).


    I am only going to briefly cover this topic. Next is a

    very quick introduction to starting a terminal using popular versions of different

    OSes. These procedures can also vary depending on how you’re running your

    Linux distro. For example, is it on a physical computer or device, is it a VM,
    or

    is it running in the cloud?


    **To start a terminal on a Linux GUI (Ubuntu):** If you running Unity: open

    the Dash, type: terminal , press Return.


    Under the application menu, select **Applications** > **Accessories** >

    **Terminal**.

    '
  mdcn: '

    每当你运行一个命令（例如 `ls`、`cp`、`rm` 等），这通常会

    启动一个在你用户账户下运行的进程。


    **注意：** *每个进程都有一个进程 ID（即 PID），并会消耗*

    某些系统资源。最明显的包括 CPU 时间、

    内存、打开的文件和设备。某些命令、实用程序或*

    应用程序比其他的更消耗资源。*


    几乎每个命令都有某些类型的选项（也称为参数）来

    扩展其功能。例如，如果你输入命令 `ls`，它将向你

    提供目录中的基本文件信息。如果你输入命令和

    选项 `ls -l`，它将将为你提供额外信息。如果你添加

    额外的选项，如 `ls -al`，它会显示一组之前未显示的额外文件。


    在 Linux（以及其他 UNIX 类操作系统）中，整个系统无论

    涉及多少个物理存储设备，都由单一的树形结构表示。

    树形结构的根目录由 ‘/’ 表示。


    当驱动器或分区上的文件系统被挂载到操作系统时，

    它必须加入现有的树形结构中。


    **Linux 树形结构示例** /


    | 路径 |

    | :--- |

    | /bin |

    | /boot |

    | /dev |

    | /etc |

    | /home |

    | /lib |


    **注意：** *文件系统层次结构标准 (FHS) 定义了 Linux 发行版的*

    目录结构和内容。这个*

    标准由 Linux 基金会维护。关于 FHS 的更多*

    信息，请参见后续章节“**文件系统**层次结构标准**”


    ## 安装 Linux


    **概述：** 本章涵盖了使用 Linux 发行版入门 Linux 的考虑因素。

    有几种类型的发行版（即 Distros）可供选择。有些仅仅是 Linux 客户端，另一些用于服务器目的，还有一些用于通用目的，而另一些用于特定的

    用途。


    第一步是根据你想做的事情选择合适的发行版。第二步

    是选择如何以及在何处安装你选择的发行版。


    有时，这个选择将根据你尝试实现的目标或你可用的选项

    为你做决定。在其他情况下，它需要你根据最终结果

    对你想要使用的发行版进行研究。


    ## 选择发行版


    市面上实际上有数百个发行版可供选择。这个列表远为

    不完整，仅提供了几个流行的选项。在选择任何发行版之前，

    一个主要的建议是确保它仍然由支持它的社区进行活跃开发。


    取决于你尝试安装的应用程序，这决定了你可以使用的

    发行版和版本。其他的人对某一个发行版相对于另一个可能

    有个人偏好。


    - **Debian**: 一种非商业发行版，也是最早的发行版之一，由志愿者开发者社区维护，该社区对自由软件原则和民主项目管理有坚决的承诺。（更多信息：https://www.debian.org/）

    - **Ubuntu**: 一种源自 Debian 的桌面和服务器发行版，由英国 Canonical Ltd. 公司维护。（更多信息：https://www.ubuntu.com/）

    - **Fedora**: 一个由 Red Hat 支持的社区支持发行版。该发行版是 Red Hat 商业 Linux 方案的技术测试平台，在将新的开源应用集成到其商业
    Red Hat Enterprise Linux（红帽企业级 Linux）之前，对其进行原型设计。（更多信息：https://getfedora.org/）

    - **Slackware**: 最初创建于 1993 年，它是最早的 Linux 发行版之一，也是仍在维护的最老的发行版之一。该发行版致力于保持高度类 UNIX
    并且易于终端用户修改。（更多信息：http://www.slackware.com/）


    **额外信息：**

    DistroWatch (distrowatch.com) 关于发行版的最新信息


    ## 商业 Linux 发行版


    仅仅 Linux 是免费开源的，并不意味着所有发行版都是免费的，

    并且不包含某些闭源软件（即任何非开源软件）。这是自由和开源软件（又称 FOSS）纯主义者的一个的争议点。


    红帽（Red Hat）是 90 年代帮助 Linux 合法化的早期公司之一，

    包括为专业支持付费的想法。在此之前，所有的 Linux 支持都必须通过在线社区获得。


    如果你是一个专业机构，例如企业或政府，那么你可能

    考虑使用一种商业 Linux 发行版，因为它们提供付费的 24x7 支持。当使用社区发行版时，支持模型是“尽力而为”（即不保证），当你处于关键时刻时，你并不希望听到这种话。


    **红帽企业级 Linux** (RHEL) 是 Fedora 的衍生版本，由红帽

    维护并提供商业支持。它寻求为企业提供经过测试、安全且稳定的 Linux 服务器和工作站支持。


    ## 安装你的发行版


    你可以在几种不同类别的设备（即物理、虚拟等）上安装并启动

    Linux。这一决定应该根据你尝试实现的目标以最终目标为中心进行做出。否则，它应该根据你拥有的且被你想要运行的

    发行版支持的硬件做出。Linux 以在旧硬件上运行而闻名，而较新的操作系统可能不再支持这些硬件。在新计算机硬件上

    安装 Linux 时，主要的考虑因素是你想要使用的所有设备

    （即显卡、打印机等）的驱动程序的可用性。


    你还可以在虚拟机 (VM) 上运行发行版，从虚拟机运行。

    这取决于你的虚拟机化程序或云环境支持

    哪些发行版。


    Linux 还有“现场启动”（live boot）选项，你可以从 U 盘或

    光盘运行。这不使用本地存储，因此不会留下痕迹。


    - **Knoppix**: 最早从可移动介质运行的 Linux 发行版之一，源自

    Debian。


    **注意：** *你的系统固件 (BIOS 或 UEFI) 必须能够从可移动

    介质启动（即光盘）。大多数*

    *系统通过启动菜单支持此功能。*

    '
