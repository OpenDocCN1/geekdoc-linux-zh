    \ of what a case statement looks like: var=test2\n\n\\# Case statement example\n\
    \ncase $var in\n\n\\# Pattern 1\n\ntest1)\n\necho 'test #1'\n\n;;\n\n\\# Pattern\
    \ 2\n\ntest2)\n\necho 'test #2'"
  - "[PAGE 138]\n\n;;\n\n\\# Pattern 3\n\ntest3)\n\necho 'test #3'\n\n;;\n\n\\# Catch\
    \ all (matches anything) if three is not an available # pattern\n\nmatch\n\n\\\
    *)\n\necho 'Did not understand'\n\n;;\n\nesac\n\n \n\n**Note:** *The last part\
    \ of the of previous script (i.e.* ***\\*)**** ) is a catch all, if the*\n\n*patterns\
    \ before it didn't execute, then this code will execute. This can be*\n\n*useful\
    \ to error handling, if the users input the incorrect option. Although,*\n\n*it\
    \ has several other uses.*\n\n \n\nLooping\n\n \n\nBASH provides a few different\
    \ control structures for looping. Each method of\n\nlooping has its advantages\
    \ and disadvantages for different situations. When\n\nprograming, you will have\
    \ consider what condition you’re testing for, and how\n\nyou want it to be handled.\n\
    \n \n\n**For Loop (Variable)**\n\n \n\nThe FOR loop generally will continue until\
    \ a certain number of operations are\n\ncompleted. Any code between the FOR and\
    \ DONE command will be repeated.\n\nOnce the number of iterations is completed,\
    \ it will drop out of the loop."
  - "[PAGE 139]\n\nLike If - Then Statement there are two ways to write this code,\
    \ the short form\n\nand long form. The short form is used from a command line.\
    \ While the long\n\nform is used inside of a script.\n\n \n\nThe short form uses\
    \ semicolons \\[;\\] as separators, instead of new lines, and looks\n\nlike this:\
    \ for VARIABLE in LIST...; do commands...; done The long form\n\nutilizes indenting\
    \ to make the code more readable (this is a highly recommended\n\ntechnique),\
    \ looks like this: for VARIABLE in LIST... do\n\nCOMMANDS...\n\ndone\n\n \n\n\
    Example #1 (*Displays: 1 iteration, 2 iteration, 3 iteration)* for i in 1 2 3;\n\
    \ndo echo $i iteration; done Example #2 (*Displays: 0-9*) for ((i=0; i < 10; i++))\
    \ do\n\necho $i\n\ndone\n\n \n\n**While Loop (*****Displays: 0-9*****)** The way\
    \ the WHILE loop works, it will continue\n\nwhile a certain condition exists.\
    \ Any code between the WHILE and DONE\n\ncommand will be repeated.\n\nIn the next\
    \ example, the condition is $x is less than 10. When $x is greater than\n\nor\
    \ equal to 10, the loop will exit.\n\n \n\nx=0\n\nwhile \\[ $x -lt 10 \\]\n\n\
    do\n\necho $x\n\nx=$(( $x + 1 ))\n\ndone\n\n \n\n**Note:** *There are two loop\
    \ control commands, to help manage loop*\n\n*iteration. The* *continue command\
    \ stops the current loop iteration and*\n\n*begins the next; the* *break command\
    \ exits the loop currently being*\n\n*executed.*"
- md: "\n## Creating a Procedure\n\nThe next script can be copied into a script or\
    \ just pasted into the shell. Once a procedure is defined, you don’t have to define\
    \ it again, all you have to do is call it by procedure name. When a user calls\
    \ the procedure by using its name (i.e. ProcedureExample), they can also pass\
    \ a parameter (i.e. \"This is a test...\").\n\nThe next procedure displays the\
    \ parameter or a value passed to it. When ProcedureExample \"This is a test...\"\
    \ is called, it will display This is a test... on the screen.\n\n```bash\n#!/bin/bash\n\
    # Creates the procedure\nProcedureExample () {\n    # Outputs the parameter that\
    \ was passed\n    echo $1\n}\n\n# Calls the procedure, and passes a parameter\n\
    ProcedureExample \"This is a test...\"\n```\n\n## Exit Status Codes\n\nEvery command\
    \ has an exit status code that can influence the behavior of other shell commands.\
    \ If a command completes normal or successfully, it has an exit status code of\
    \ zero for success, and non-zero for failure, error, etc.\n\nFor example, if there\
    \ is a file called myfile1.txt, and you type: `cat myfile1.txt` it would have\
    \ an exit status code of **0** if it completed successfully. Although if by mistake\
    \ you type: `cat myfile.txt` by mistake, it would have an exit status code of\
    \ **1** if it completed unsuccessfully. To see the exit status code of the last\
    \ command you have to check the following system variable: `$?`.\n\nTo see the\
    \ status of the last command, type:\n```bash\necho $?\n```\n\nTo test the exit\
    \ status code to see if it was successful or not, type:\n```bash\nif [ $? -eq\
    \ 0 ]; then echo success; else echo failure; fi\n```\n\nIf you want to control\
    \ the exit status code of a custom script or function, it is possible to pass\
    \ it after the code completes running. The exit command accepts integers from\
    \ 0 - 255, in most cases 0 and 1 will suffice. Although, there are reserved status\
    \ exit codes that can be used for more specific errors.\n\n**Notes:** *The man\
    \ page for each command should indicate the various exit status codes and their\
    \ meaning.* *Builtin commands return exit status codes, as does an executed shell\
    \ function.*\n\n*Below are the reserved exit codes numbers, and their general\
    \ meaning:*\n\n| Exit Code | Meaning |\n| :--- | :--- |\n| 1 | This is a catch-all\
    \ general error. Used for miscellaneous error, such as \"divide by zero\" or other\
    \ impermissible operation. |\n| 2 | Misused shell builtins. Such as a missing\
    \ keyword or command, or permission problem. |\n| 126 | Command invoked cannot\
    \ execute. Such as possible permission problem or the command cannot be executed.\
    \ |\n| 127 | Command cannot be found. Possible problem with $PATH or a typo. |\n\
    | 128 | Invalid argument to exit. Exit only takes integer arguments in the range\
    \ 0 - 255. |\n| 128 | Fatal error signal \"n\". |\n| 130 | Script terminated by\
    \ Ctrl+C, and creates a fatal error signal 2. |\n| 255 | Exit status out of range,\
    \ exit takes only integer arguments in the range 0 - 255. |\n\n## My First System\
    \ Information script\n\nThe following script uses some of the techniques that\
    \ were talked about in this chapter, and demonstrates how they can be used. This\
    \ script will collect and display information about your system.\n\n```bash\n\
    #!/bin/bash\n# Gets system's host name\nHOSTNAME=$(hostname)\n# CPU Architecture\n\
    CPUTYPE=$(echo $HOSTTYPE)\n# Get total amount of memory from /proc/meminfo in\
    \ gigabytes\nMEM=$(awk '( $1 == \"MemTotal:\" ) { print $2/1048576 }' /proc/meminfo)\n\
    echo \"----------------------\"\n# Displays the system host name\necho \"Name:\
    \ $HOSTNAME\"\n# Checks if the system is 32 or 64-bit\nif [ $CPUTYPE == 'x86_64'\
    \ ]; then\n    echo \"Arch: 64-Bit\"\nelse\n    echo \"Arch: 32-Bit\"\nfi\n# Displays\
    \ the total amount of RAM.\necho \"RAM: $MEM GB\"\necho \"----------------------\"\
    \n```\n\n## Systems Administration\n\n**Overview:** Any Linux user has to learn\
    \ some the system administration functions (i.e. managing users, disks, shutting\
    \ down the system, etc.) to fully utilize their system. This chapter covers these\
    \ functions by providing a high-level overview of how to handle these tasks.\n\
    \n**Linux Distro Overview**\n\n- Layer 5: **Application** (i.e. Programs that\
    \ don't utilize the Shell for input)\n- Layer 4: **Shell** (i.e. Commands and\
    \ scripts)\n- Layer 3: **Filesystem** (i.e. Files and directories)\n- Layer 2:\
    \ **Network and Firewall** (i.e. Communication)\n- Layer 1: **Host OS** (i.e.\
    \ Kernel/Services/Libraries/Data)\n- Layer 0: **Infrastructure** (i.e. Hardware,\
    \ VM, Cloud, IoT, etc.)\n\n**Prerequisites:** *This section requires that you\
    \ have root permissions on the system to install services and make changes to\
    \ the OS.* *Before starting this section, make sure that you get the updated [system].*\n\
    \n### Linux Loader\n\nThe Linux loader is a small program that loads the OS after\
    \ the boot process. The most popular loader is called GRUB. Alternative boot loaders\
    \ available by distros are LILO andand. If you want more information on this subject,\
    \ in your favorite search engine \"Linux Booters\".\n\n**Tip:** *Hold down the\
    \ Shift key during startup to access the GRUB menu.*\n\n### Runlevels Init (Older\
    \ Systems)\n\nIn Linux, \"runlevels\" are the operational levels that describe\
    \ the state of the system with respect to what services are loaded when the system\
    \ starts. The system is usually set to runlevel 1, it is restrictive and normally\
    \ only used for maintenance. The processes that are executed by each runlevel\
    \ depend on the contents of the /etc/rc? directories. All the files in this directory\
    \ are symbolic links that point to scripts in the /etc/init.d directory that start\
    \ the services. The names of the files are important, because they determine the\
    \ order in which the scripts will run.\n\n**Runlevel Reference**\n\n- 0: halted\
    \ (system shutdown)\n- 1: single user (maintenance mode)\n- 2: multiuser with\
    \ networking configured\n- 3: multiuser with networking (normal operation)\n-\
    \ 4: not used (user defined)\n- 5: Normal operation, plus GUI\n- 6: reboot\n\n\
    **Note:** *To see the runlevel that the system is currently running in, Some recent\
    \ distros like Ubuntu, no longer utilize runlevels. The runlevel technology doesn't\
    \ support starting the system with multiple services.*\n\n### Systemd Init (Newer\
    \ Systems)\n\nSystemd is a suite of subsystems that provides the fundamental building\
    \ blocks for a Linux operating system. The name Systemd adheres to the UNIX convention\
    \ of naming daemons by appending the letter \"D\" to the end of the name.\n\n\
    It is a replacement for the traditional UNIX System V and Berkeley Software Distribution\
    \ (BSD) init systems (aka Runlevels). It features \"System and Service Manager,\"\
    \ used to initialize and bootstrap the user space and to manage system services\
    \ after the boot process.\n\nOne of the main goals of the project is unification\
    \ of basic Linux configurations and service behaviors across all Linux distributions.\
    \ As of 2015, most Linux distributions have adopted systemd as their default init\
    \ system.\n"
  mdcn: "\n\n## 创建过程\n\n下一个脚本可以复制到脚本文件中，也可以直接粘贴到 shell 中。一旦定义了过程，你就不需要再次定义它，你做的就是通过过程名调用它。当用户使用其名称（例如\
    \ ProcedureExample）调用过程时，他们也可以传递参数（例如 \"This is a test...\"）。\n\n下一个过程将显示传递它的参数或值。当调用\
    \ `ProcedureExample \"This is a test...\"` 时，它将在屏幕上显示 This is a test...。\n\n```bash\n\
    #!/bin/bash\n# 创建过程\nProcedureExample () {\n    # 输出传递的参数\n    echo $1\n}\n\n\
    # 调用过程并传递参数\nProcedureExample \"This is a test...\"\n```\n\n## 退出状态码\n\n每个命令都有一个退出状态码，该代码可以影响其他\
    \ shell 命令的行为。如果命令正常或成功完成，其退出状态码为 0 表示成功，非零表示失败、错误等。\n\n例如，如果有一个名为 myfile1.txt\
    \ 的文件，并且你输入：`cat myfile1.txt`，如果执行成功，它的退出状态码将为 **0**。但如果你不小心输入了：`cat myfile.txt`，如果执行失败，它的退出状态码将为\
    \ **1**。要查看上一个命令的退出状态码，你需要检查以下系统变量：`?$`。\n\n要查看上一个命令的状态，输入：\n```bash\necho $?\n\
    ```\n\n要测试退出状态码是否成功，输入：\n```bash\nif [ $? -eq 0 ]; then echo success; else echo\
    \ failure; fi\n```\n\n如果你想控制自定义脚本或函数的退出状态码，可以在代码运行完成后传递它。`exit` 命令接受 0 - 255 之间的整数，在大多数情况下\
    \ 0 和 1 就足够了。尽管如此，还有保留的状态退出码用于更特定的错误。\n\n**注意：** *每个命令的 man page（帮助文档）应该说明各种退出状态码及其含义。*\
    \ *内置命令会返回退出状态码，执行的 shell 函数也是如此。*\n\n*以下是保留的退出码数字及其通用含义：*\n\n| 退出码 | 含义 |\n|\
    \ :--- | :--- |\n| 1 | 这是一个通用的错误。用于杂项错误，例如“除以零”或其他不允许的操作。 |\n| 2 | 误用 shell内置置。例如缺少关键字或命令，或权限问题。\
    \ |\n| 126 | 调命令无法执行。可能是权限问题或命令无法执行。 |\n| 127 | 找不到命令。可能是 $PATH 的问题或拼写错误。 |\n\
    | 128 | exit 的参数无效。exit 只接受 0 - 255 范围内的整数参数。 |\n| 128 | 致命错误信号 \"n\"。 |\n| 130\
    \ | 脚本被 Ctrl+C 终止，产生致命错误信号 2。 |\n| 255 | 退出状态超出范围，exit 只接受 0 - 255 范围内的整数参数。 |\n\
    \n## 我的第一个系统信息脚本\n\n下面的脚本使用了本章中提到过的技术，并演示了如何使用它们。该脚本将收集并显示有关你的系统信息。\n\n```bash\n\
    #!/bin/bash\n# 获取系统主机名\nHOSTNAME=$(hostname)\n# CPU 架构\nCPUTYPE=$(echo $HOSTTYPE)\n\
    # 从 /proc/meminfo 获取总内存（单位：GB）\nMEM=$(awk '( $1 == \"MemTotal:\" ) { print $2/1048576\
    \ }' /proc/meminfo)\necho \"----------------------\"\n# 显示系统主机名\necho \"Name:\
    \ $HOSTNAME\"\n# 检查系统是 32 位还是 64 位\nif [ $CPUTYPE == 'x86_64' ]; then\n    echo\
    \ \"Arch: 64-Bit\"\nelse\n    echo \"Arch: 32-Bit\"\nfi\n# 显示 RAM 总量。\necho \"\
    RAM: $MEM GB\"\necho \"----------------------\"\n```\n\n## 系统管理\n\n**概述：** 任何\
    \ Linux 用户都必须学习一些系统管理功能（例如管理用户、磁盘、关闭系统等），以充分利用他们的系统。本章通过提供处理这些任务的高层概述，涵盖了这些功能。\n\
    \n**Linux 发行版概述**\n\n- 第 5 层：**应用**（即不利用 Shell 进行输入输入的程序）\n- 第 4 层：**Shell**（即命令和脚本）\n\
    - 第 3 层：**文件系统**（即文件和目录）\n- 第 2 层：**网络与防火墙**（即通信）\n- 第 1 层：**主机 OS**（即内核/服务/库/数据）\n\
    - 第 0 层：**基础设施**（即硬件、虚拟机、云、IoT 等）\n\n**前提条件：** *本节要求你在系统中拥有 root 权限以安装服务并更改操作系统。*\
    \ *在开始本节之前，请确保你获取了更新的[系统]。*\n\n### Linux 加载器\n\nLinux 加载器是一个在启动过程后加载操作的小型程序。最流行的加载器称为\
    \ GRUB。其他发行版提供的替代启动加载器还有 LILO 和其他。如果你想了解关于此主题的更多信息，可以在你喜欢的搜索引擎中搜索 \"Linux Boot\"\
    。\n\n**提示：** *启动时按住 Shift 键进入 GRUB 菜单。*\n\n### 运行级别初始化（旧系统）\n\n在 Linux 中，“运行级别”（runlevels）是描述系统启动时加载哪些服务的操作级别。系统通常被设置为运行级别\
    \ 1，它具有限制性，通常用于维护。每个运行级别执行的进程取决于 /etc/rc 目录的内容。该目录中的所有文件都是符号链接，指向 /etc/init.d\
    \ 目录中启动服务的脚本。文件的名称非常重要，因为它们决定了脚本运行的顺序。\n\n**运行级别参考**\n\n- 0：停机（系统关机）\n- 1：单用户（维护模式）\n\
    - 2：已配置网络的多用户模式\n- 3：带网络的多用户模式（正常运行）\n- 4：未使用（用户定义）\n- 5：正常运行，并带 GUI\n- 6：重新启动\n\
    \n**注意：** *要查看系统当前运行的运行级别，某些如 Ubuntu 等最新发行版不再使用运行级别。运行级别技术不支持带有多个服务的启动系统。*\n\n\
    ### Systemd 初始化（新系统）\n\nSystemd 是一套子系统，为 Linux 操作系统提供了基础构建模块。Systemd 的名称遵循 UNIX\
    \ 在名称末尾添加 \"D\" 来命名守护程序的传统。\n\n它是传统 UNIX System V 和自由软件发行版（BSD）初始化系统（即运行级别）的替代品。它具有“系统和服务管理器”，用于初始化和引导用户空间并在启动过程后管理系统服务。\n\
    \n该项目的主要目标之一是统一所有 Linux 发行版的基础配置和服务行为。截至 2015 年，大多数 Linux 发行版已采用 systemd 作为默认初始化系统。\n\
    \n"
