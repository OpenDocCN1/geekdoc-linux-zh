    要查找可执行文件的存储位置，请输入：which **mkdir**


    **提示：** *此命令的替代方案是，输入：* *type -a ****mkdir***


    要查找可执行文件的功能，请输入：


    whatis **mkdir** 要将标准输出 (STDOUT) 显示在终端并同时写入文件，请输入：ls -l | **tee** ***file_name.ext***
    要创建多个具有顺序命名的空文件（例如 file1, file2, file3 等），请输入：touch **file_name**{1..100}


    或—


    touch **file_name**{a..z}


    **示例输出：**


