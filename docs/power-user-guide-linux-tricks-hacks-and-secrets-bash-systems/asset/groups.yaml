  - "[PAGE 205]\n\nInstalling the Apache Web Server\n\n**Overview:** This section\
    \ provides instructions on how to install and do a basic\n\nsetup of the Apache\
    \ HTTP service, and how to modify the firewall. The Apache\n\nservice is used\
    \ to deliver files using the HTTP protocol to remote clients and\n\nsystems.\n\
    \nThe Apache HTTP Server, is a free and open-source cross-platform web server.\n\
    \nIt was originally based on the NCSA HTTPd server. Development of Apache\n\n\
    began in early 1995 after work on the NCSA code stalled.\n\nAs of March 2018,\
    \ it was estimated to serve 43% of all active websites and 37%\n\nof the top million\
    \ websites.\n\n \n\nInstall the latest version of the Apache web server, type:\
    \ sudo apt-get\n\ninstall apache2\n\n\\-OR-sudo yum install httpd\n\n \n\nModifying\
    \ the Firewall\n\n \n\nThis section covers how to open up the necessary ports\
    \ in the local firewall so\n\nthat http traffic (port 80), and HTTPS (port 443)\
    \ traffic to pass through. The ufw\n\n(Uncomplicated Firewall) utility is for\
    \ managing iptables (a netfilter firewall\n\ndesign) to be easy to use. It uses\
    \ a command-line interface consisting of a small\n\nnumber of simple commands,\
    \ and uses iptables for configuration.\n\n \n\n**Note:** *These instructions assume\
    \ that you have the UFW firewall*\n\n*utility installed on your system.*\n\n \n\
    \nLists all the apps that are currently supported by the firewall, look for\n\n\
    'Apache Full', type: sudo ufw app list"
