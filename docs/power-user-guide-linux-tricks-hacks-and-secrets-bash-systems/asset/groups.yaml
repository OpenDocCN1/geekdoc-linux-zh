- md: '

    **Ex:** git clone [https://URL_repo_to_clone]


    git remote -v


    Displays the handles for a remote repository.


    git remote show [ handle_name ]


    Inspect the details about a remote repository.


    ## Manage (Committing/Tracking/Pushing) Changes


    git add [ file_name | * ]


    Adding new or modified into repository to be stage before committing them.


    git commit -m "message"


    Commits all changes that have been staged, and adds a message.


    git push origin master


    Pushes all the committed changes to the master branch of origin.


    git reset [ file_name ]


    Unstages a file, and preserves its contents.


    git checkout [ branch_name ]


    Switches the branch, and updates working directory.


    ## Fetching/Merging Repositories


    git fetch origin


    To reset (delete all changes) to your whole repository, with a fresh copy.


    git merge master


    From the working directory to fetch and merge remote changes.


    ## Checking the Status of the Repository


    git diff


    Displays the diff for files that are modified but have not been staged.


    git diff --staged


    Shows the diff for files that are staged but not committed.


    git status


    Shows which files have been modified and/or staged since the last commit.


    ## Managing Branches


    git branch


    Displays a lists of all local branches in the current repository.


    git branch -d [ branch_name ]


    Deletes a branch in the current repository.


    git branch [ branch_name ]


    Creates a new branch in the current repository.


    git checkout [ branch_name ]


    Switches branches and updates the working directory.


    git merge [ branch_name ]


    Merges specific branch history into the current branch.


    ## Removing, deleting, and reverting files


    git rm [ file_name ]


    Deletes a file from the local storage, then stages its deletion.


    git rm --cached [ file_name ]


    Stops tracking of a file, then stages its deletion (but does not delete it from
    the local storage)


    git mv [ old_file_name ] [ new_file_name ]


    Renames the file on disk, then stages the deletion of the old name and addition
    of the new name.


    git checkout -- [ file_name ]


    Reverts a modified file on local storage back to the last committed version.


    ## Viewing Commit History


    git log


    Displays history details.


    git log -1


    Shows the last commit.


    git log --stat


    Shows stats instead of diff details.


    git log --name-status


    Shows a simpler version of stat.


    git log --oneline


    Shows commit comments.


    ## Installing L.A.M.P.


    **Overview:** LAMP is an acronym for a group of open source software services
    that are typically installed together on a server to host dynamic web applications.
    The term is an acronym for Linux (the operating system), Apache (the web server
    service), MySQL (the database service), and PHP or Python (for dynamic content
    generation).


    ## LAMP Overview


    - Layer 4: **Shell** (i.e. System and service management)

    - Layer 3: **Apache and MySQL Service**

    - Layer 3a: **PHP Engine** (Called by the Apache Service)

    - Layer 3b: **PHP Webpage and Apps** (i.e. MyPHPAdmin)

    - Layer 2: **Network and Firewall** (i.e. Communication)

    - Layer 1: **Host OS** (i.e. Kernel, Libraries, etc.)

    - Layer 0: **Infrastructure** (i.e. Hardware, VM, Cloud, IoT, etc.)


    If you''re still learning Linux this is a great chapter because it will give you
    exercises to get an idea of what it takes for installing a set of Linux applications
    and services. This chapter will teach you the basics of installing services, controlling
    them, managing configuration files, and more.


    Even if you''re not going to be using LAMP services, but want to get more experience
    installing and managing them. This chapter will provide a great introduction to
    this type of Linux administration.


    **Prerequisites:** *This section requires that you have root permissions on the
    system to install services and make changes to the OS. Before starting this section,
    make sure that you get the updated list of the package manager repositories, so
    that you get the latest versions of the programs, services and libraries, type:
    *sudo apt-get update* -OR-sudo yum update*


    **Notes:** *These instructions can require that you make modification to the service(s)
    or OS depending on the distro and versions of the software that you''re running.
    Although, this section is a good framework you can use to complete the installs.
    The application developers are always enhancing their software, and over time
    these instructions can change.*


    ## Installing the Apache Web Server


    **Overview:** This section provides instructions on how to install and do a basic
    setup of the Apache HTTP service, and how to modify the firewall. The Apache service
    is used to deliver files using the HTTP protocol to remote clients and systems.


    The Apache HTTP Server, is a free and open-source cross-platform web server. It
    was originally based on the NCSA HTTPd server. Development of Apache began in
    early 1995 after work on the NCSA code stalled. As of March 2018, it was estimated
    to serve 43% of all active websites and 37% of the top million websites.


    Install the latest version of the Apache server, type: sudo apt-get install apache2
    -OR-sudo install httpd


    ## Modifying the Firewall


    This section covers how to open necessary ports. The ufw (Uncomplicated Firewall)
    utility is easy to use. It uses a command-line interface consisting of a small
    number of simple commands, and uses iptables for design.


    **Notes:** *These instructions assume that you have UFW utility installed on your
    system.*


    Lists all the apps that are currently supported by the firewall, type: sudo ufw
    list


    Make sure traffic is allowed for ports 80 and 443, type: sudo ufw allow


    To test to make sure the Apache service is working correctly, type: http://domain_name_or_ip


    To find your local machine''s IP address, type: ip addr show eth0 | awk ''{ print
    $2; }'' | sed ''s///''


    To find your local machine''s hostname, type: hostname


    ## Installing MySQL Database


    **Overview:** This section provides instructions on how to install the MySQL database
    service. This service is utilized by web apps to store or retrieve data it needs.


    MySQL is an open-source relational database management system (RDBMS). Its name
    is a combination of "My", the name of co-founder Michael Widenius'' daughter,
    and "SQL", the abbreviation for Query Language.


    **Prerequisites:** *This section assumes that your Apache service is working and
    configured properly. This includes that you have root permissions on the system
    to install the service.*


    To install the service, type: sudo apt-get install mysql-server


    The following script will secure the MySQL installation. It does this by removing
    some dangerous default settings and locking down access to the database system,
    type: sudo mysql_secure_installation


    **Notes:** *You''ll be asked if you want to configure the: VALIDATE PASSWORD PLUGIN.
    This option enables strong password validation. This is recommended for a production
    environment. Then just accept the defaults for the rest of the questions by answering
    ''Y''. This will disable things like anonymous users, remote root logins, etc.*


    To test the MySQL connection, type: sudo mysql


    **Note:** *If you''re going to install the phpMyAdmin web app for managing MySQL
    databases. For the root MySQL user to login, you need to switch the authentication
    method from AUTH\_SOCKET to MYSQL\_NATIVE\_PASSWORD. This will be discussed later
    in the chapter, and is only needed if you''re going to install that web app.*


    To validate if the AUTH\_SOCKET plugin is being used (which is generally enabled
    by default), from the mysql> prompt, type: SELECT user,authentication\_string,plugin,host
    FROM mysql.user; To exit the MySQL application, from the mysql> prompt, type:
    exit

    '
