    ## Preparing a Second Drive


    **Prerequisites:** *This section requires that you have root permissions on the
    system to install services and make changes to the OS.*


    As stated earlier in the book, in Linux (and other Unix-like operating systems),
    the entire system, regardless of how many physical storage devices are involved,
    are represented by a single tree structure. When a filesystem on a drive or partition
    is mounted to the system, it must be joined into the existing tree. Mounting is
    the process of attaching a formatted partition or drive to a directory within
    the Linux filesystem. The drive''s contents can then be accessed from that directory.


    To mount a drive follow the next steps:


    To display the available disks, type: own`ls -l /dev/sd*`


    **Note:** *devsda* is the first physical disk, and *devsda1* is partition 1; *devsdb*
    is the second physical disk, and *devsdb1 is partition 1.


    **Tip:** *If the local storage you''re trying to mount needs formatting, and it
    already is mounted, it needs to be unmounted first, type:*

    `sudo umount -f [mount_point]`

    *(If you don''t know the name of the mount point, to see a list of local storage
    and mount points, type: `mount`)*


    Prepare (partition and format) the mount point, type: `sudo fdisk /dev/sdb`

    (Type the following options: **n** (new part), **p** (primary), **1**, [enter],
    [enter], **w**).


    **Tip:** *If you need to incorporate formatting the partition into a script to
    automate entering the letters, type:*

    `echo -e "n\np\n1\n\n\nw\n" | sudo fdisk /dev/sdb`


    To create the filesystem on the new disk, type: `sudo s/mkfs.ext4 -l /opt/app_name
    /dev/sdb1`


    To create the directory that acts as a mount point, type: `sudo mkdir /opt/app_name`


    To change permissions to the mount point, type: `sudo chmod 755 /opt/app_name`


    To map the drive to the mount point, type:

    `sudo mount /dev/sdb1 /opt/app_name`


    To change to mount point directory, type:

    `cd /opt/app_name`


    To get the UUID (Universally Unique Identifier) from the drive: `sudo blkid`


    To backup and update /etc/fstab file, type: `sudo cp /etc/fstab /etc/fstab.bak`


    **Note:** *The fstab file is used by the filesystem to automatically load mount
    points during the boot process.*


    Edit the /etc/fstab , type: `sudo nano /etc/fstab`

    Add the following line:

    `UUID="<UUID from the drive>" /app_name ext4 defaults 0 2`

    (To save the file and exit the editor, press **Ctrl+X**, type: **y** and press
    Enter)


    Displays all mount points, type:

    `mount -a`


    ## Creating a Bootable USB Drive


    **Overview:** Learn how to create a bootable version of a Linux distro that can
    be installed on a USB flash drive. With this drive you can boot into a physical
    computer without modifying it, or you can also use it in the repair and diagnostics
    of that system.


