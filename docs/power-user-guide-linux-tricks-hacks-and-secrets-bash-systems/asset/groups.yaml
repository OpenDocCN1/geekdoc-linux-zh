    on the disk) that directs the filesystem to use the correct file.\n\n \n\nThe\
    \ hard link is a separate file which contains information about the\n\noriginal\
    \ file and where it is located, type: cp -l **file\\_name1**\n\n**file\\_name2**\n\
    \n \n\n**Note:** *If you delete the original file, the hard link will prevent*\n\
    \n*the file from being deleted. If you want to delete the file, you*\n\n*will\
    \ also have to remove the hard link.*\n\n \n\nAn alternative command to create\
    \ a hard link, type: ln\n\n**file\\_name1 file\\_name2**\n\n \n\nIf you need to\
    \ create links on a different physical drive, you’ll have\n\nto create a soft\
    \ link instead, type: cp -s **file\\_name1 file\\_name2**"
