    - u 撤销上一次更改。

    - U 撤销该行的所有更改。

    - ; 重复上一次 f F t 或 T 搜索命令。


    ## Shell 函数


    这些是一些 shell 命令，用于从其他程序引入数据并在文本编辑器中进行管理。你必须处于命令模式才能使用这些功能。例如，按下 ESC 键然后输入 !! **ps
    -aux** 执行一个 shell 命令，并将命令输出放在当前行。


    - :! **cmd** 执行 shell 命令


    **注意：** *添加这些特殊字符以表示：% 当前文件名 # 上一次编辑的文件名。*


