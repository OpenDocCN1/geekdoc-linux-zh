    ## Warnings


    Use the information in this book at your own risk. All the content is subject
    to change at any time. This is beyond my control. The author and publisher are
    not liable for any damage or problems that can occur from using the contents in
    this book.


    I have done my best to try to keep the information useful and relevant as possible.
    So if you run into a problem with one of the commands I apologize. Please inform
    me, and I will do my best to fix this issue in future versions of the book.


    Do not test these commands in a production environment. Test them in a development
    area first and make sure that they will work properly in your infrastructure.


    Some of these commands can and will destroy data, so **make sure you have good
    tested backups of your data before using them.**


    ## Compatibility


    The Linux commands, URLs, *etc.* are always being updated, retired, or superseded.
    So I can’t guarantee the accuracy of the contents of this book at the time you''re
    reading it. Other factors that contribute to the accuracy issues are the different
    distros, versions of the distro, shells, commands and utilities. Even the companies
    and people that make the distros are always evolving the OS with the latest tools,
    and retiring older ones.


    ## Getting Started


    **Overview:** This book focuses on the Linux command line. It doesn''t provide
    any help for X-Windows the Linux GUI (graphical user interface). There are a few
    mentions of it, but it is not the primary focus.


    The content of this book is written for the BASH (short for Bourne-Again Shell)
    shell. This book doesn’t try to favor one distro over another, it tries to be
    more general in the specific whenever possible.


    The one drawback to writing the book this way, is that I may not be targeting
    the version of Linux that you’re using now. If you want a book that targets a
    specific distro, then I would recommend another resource.


    Please note, depending on the distribution (aka Distro) you could be using another
    shell (i.e. csh, tcsh, ksh, ash, zsh, etc.). If you are in another shell, from
    the console just type the command bash and press Enter to start it.


    If you are running X-Windows just start the command terminal, often known as the
    terminal or console. Otherwise you can exit the GUI all together, and hopefully
    it will put you at the command line. If not you will have to lookup how to do
    this for your Distro.


    ## Linux Everywhere


    Linux seems to run on everything from watches to mainframes, and all things in
    between. A good portion of the infrastructure that runs the Internet is Linux-based
    servers.


    There are several different versions/variants of the OS that run on physical servers,
    desktops, laptops, VMs, cloud infrastructure, *etc.* It is also the underlying
    OS for Mac OS X, iOS, Android. Most IoT (Internet of Things) devices, such as
    the Raspberry PI, and countless other similar devices.


    ***Raspberry Pi 3 B+ single-board computer, by Gareth Halfacree from Bradford,
    UK.***


    The latest edition of Windows 10 now includes a Linux subsystem, called WSL. This
    allows the user to launch a Linux terminal in the native Windows OS, without having
    to use a VM, or another product like Cygwin.


    ## Core Linux philosophies


    As stated earlier, every distro seems to do things slightly different and in their
    own way/style of doing things. Although, there are some general philosophies and
    principles that most versions of Linux follow, that are outlined below.


    At the core of Linux is the kernel, it controls all the lower level functions
    (for example, communication between the application and the hardware). The kernel
    was originally designed by Linus Torvalds, and still maintained by him and an
    army of other people (https://www.kernel.org/). The Linux kernel is shared by
    all of the distributions.


    There are three main distributions, almost all of the available distros are based
    on one of these versions of the Linux operating system.


    - **Debian** is a distribution that emphasizes free software. It supports many
    hardware platforms.

    - **Red Hat** Linux was one of the original major distributions that was divided
    into commercial and community-supported distributions. The community-supported
    Red Hat Linux sponsored distribution named Fedora, and the commercially supported
    distribution called Red Hat Enterprise Linux.

    - **Slackware** is a highly customizable distribution that stresses ease of maintenance
    and reliability over cutting-edge software and automated tools. Generally considered
    a distribution for advanced users.


    Since Linux was originally based on UNIX it used to use "runlevels", which are
    the operational levels that describe the state of the system with respect to what
    services are available. For example, if the system is using a runlevel of 1, then
    it is in single user mode. You would commonly be in a runlevel 2-5, which is multiuser.
    For more information about the filesystem, see the following section "Linux Runlevels".


    **Note:** *Most modern distros of Linux no longer use runlevels. The runlevel
    technology doesn''t support starting the system with multiple services running
    in parallel.*


    Linux is a fully multitasking (a method where multiple tasks are performed at
    the same time), multiuser operating system, with service processes known as daemons.
    Linux has four types of accounts: root, System, Normal, Network. The root (super
    user, aka administrator) account is the most powerful and has full access to the
    system.


    The installation procedure for new utilities depends on the distro. For example:


    sudo yum install package_name (On Red Hat based systems) OR

    sudo apt-get install package_name (On Debian based systems)


    **Note:** *There are several different methods for installing new programs. Using
    package manager just makes the install of new utilities easier. Other methods
    could include downloading a repository from Git and compiling it, while other
    programs may require a different method.*


    Linux is **case sensitive** in reference to commands, options, file paths, *etc.*
    If you’re used to an operating system like Windows before, this will be one of
    the first things that you have to get used to. In Linux filesystem directory or
    file names such as /boot, /Boot, and /BOOT represent different directories.


    The available commands, directories, and configuration files and locations can
    vary between Linux distros. Jokingly, ‘It’s all exactly the same, except for what
    is different.’ You might need to research where these files are stored, and what
    they may be named for different distros.


    Any file that has a .conf extension generally means it is a text file holding
    a configuration for an application (i.e. yum.conf). Linux makes its components
    available via files or objects that look like files. Processes, devices, and network
    sockets are all represented by file-like objects, and can often be worked with
    using the same utilities used for regular files.


    The reason why there are many commands and utilities is because of the Linux design
    philosophy. Commands are designed to do one function or operation very well. Programs
    are commonly stored in one of the following paths: /bin, /usr/bin, /sbin, /usr/sbin.
    This can change based on the distro and application that you’re using.


    By default, all permissions (even if you’re signed in as root) start out running
    under basic user account security (so you can run commands like ls, cp, rm, etc.).
    A command that needs elevated permissions requires that you put the prefix command
    sudo in front of it (i.e. sudo command -options). After you press Enter, you will
    then be required to type your admin password and press Enter again.

    '
