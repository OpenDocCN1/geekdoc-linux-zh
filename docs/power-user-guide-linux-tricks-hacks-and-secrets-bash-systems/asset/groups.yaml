    ## Security Tips (System Lockdown)


    **Overview:** Every day you read about how this or that company has been compromised
    by a malicious person or organization. One of the main things you can do to protect
    yourself and your business, is lockdown the security on your servers and desktops.


    **Prerequisites:** *This section requires that you have root permissions on the
    system to install services and make changes to the OS.*


    This section covers some of the things that you can do to make it harder for "bad
    actors" (i.e. hackers) from compromising your systems. Please note, this section
    only provides a high-level overview of some of the options that are available.
    You may have to look up how to implement these changes for the distro that you’re
    using.


    **Warning:** *Like any type of change, it should never be made to a production
    system, without testing it on a development or pre-production system first. You
    need to make sure that any of these changes don’t affect your applications operation.*


    Most new installations of any operating system are more secure than they used
    to be when doing a default installation. Although, if you have an older existing
    system, it can probably use some hardening to make it more secure against an attack.


    This chapter contains a list of suggested security tools and tips for performing
    different types of system security administration tasks and diagnostics.


    ## Core Security Philosophies


    There are core security philosophies that every person in Information Technology
    should follow. This section is very high-level and may oversimplify the subject,
    but be aware it is much broader than what is covered here.


    The most common type of malicious actors (someone or group looking to steal what
    they can), are looking for easy targets that they can compromise quickly. These
    type of attacks are easier to defend against, you mostly just need to make sure
    your systems are locked down and updated.


    While the more determined malicious actors (generally going to be nation states),
    are much harder. They generally have a specific target that they are going after
    and will use any method that they want to achieve their end goal.


    The core security philosophies listed below, are only a few of many, but these
    are a good place to start:


    - **Least Privilege**: Only grant privileges that are needed for a user to do
    their job. Don''t grant admin access to a user because it will make your job easier.

    - **Defense in Depth**: Create multiple layers of security or defense. For example,
    have an external firewall to protect your perimeter, utilize the local firewalls
    on the OS, and then encrypt all your data and communications.

    - **Be Persistent**: Malicious actors are constantly changing their attack methods,
    so you have to constantly adapt new methods to defend against these new types
    of attacks.

    - **Reduce your Attack Surface:** Turn off services that are not needed, change
    default passwords and accounts, make sure your firewalls are configured properly,
    etc.


    The following security diagram is a high-level tool to help visualize the different
    layers that you need to consider protecting against attack. It also briefly describes
    some of the considerations that you will need to do to protect that layer.


    ## Security Overview


    | Layer | Name | Description |

    | :--- | :--- | :--- |

    | Layer 8 | System Backups | Last line of defense, needs regular testing |

    | Layer 7 | Applications/Services | i.e. Needs patching [Docker, web services,
    database] |

    | Layer 6 | User Security | i.e. enforce strong passwords, and rotate regularly
    |

    | Layer 5 | Filesystem | i.e. Reduce file permission privileges, encrypt data
    |

    | Layer 4 | Network/Firewall | i.e. Block unnecessary ports, encrypt communications
    |

    | Layer 3 | Operating System | i.e. Needs patching |

    | Layer 2 | Infrastructure | i.e. Needs patching [hardware, hypervisors, switches,
    VMs, etc.] |

    | Layer 1 | Perimeter | i.e. Needs monitoring [routers/firewall] |

    | Layer 0 | Public Network | i.e. Internet [No Protection] |


    I would encourage more reading on this subject if you have time.


    ## Checking Your System for Malware


    Even Linux is not immune to malware, ClamAV is one of the most popular anti-malware
    scanners available for the OS. It is recommended that you regularly scan your
    system for malicious code, but unfortunately they won’t be covered at time. To
    install this scanner use one of these methods:


    - For Debian-based systems: `sudo apt-get install clamav`

    - On Red Hat-based systems: `sudo yum install epel-release`, `sudo yum install
    clamav`


    To run the scanner, you first need to update it with the latest signatures, type:
    `sudo freshclam`


    To scan a specific folder, type: `sudo clamscan -r -i /` (scans from root) or
    `sudo clamscan -r -i /home` (scans home).


    **Tip:** To install GUI version (X-Windows) of the client, type: `sudo apt-get
    install clamtk`


    **More information:** https://www.clamav.net/


    ## Lockdown Physical Access to the System


    Any production system should be in a locked environment, with physical access
    control, backup power and cooling. If a malicious actor has physical access to
    the equipment, they could bypass most system features. Although, you can still
    make it harder for them. Here are some suggestions:


    Lockdown the firmware (BIOS/UEFI), configure it to disable booting from an optical
    disk or an external device (such as a USB flash device). Also make sure you enable
    a firmware password. Enable GRUB with a password to help restrict access to the
    local filesystem. Encrypt the local filesystem, file permissions, data in databases,
    etc.


    Encrypt all network communications. This will make it harder for a malicious actor
    from sniffing your data while it is in transit. Don''t use root account names,
    like root, admin, or administrator. Get creative with the username.


    Make sure to use strong passwords for all accounts, and change them on a regular
    basis.


    ## Partitioning Your Data


    When creating a new system, it is important to setup multiple partitions to hold
    data, this can help prevent data corruption, and some types of system resource
    exhaustion attacks. For example, if the swap area and logs are not each on their
    own partition. If an attacker tries to fill them up with some type of attack (i.e.
    DDoS), it could force the system to shut down or fail.

