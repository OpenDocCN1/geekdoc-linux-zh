  - "[PAGE 157]\n\nUser Notification\n\n \n\nIf you need to send notification to users\
    \ logged in to a local or remote system.\n\nYou can use the write command to display\
    \ a message on the user’s console\n\nscreen.\n\n \n\nTo write a message to another\
    \ user on the same system, type: write\n\n**user\\_name** After you start the\
    \ command, you can write the user a\n\nmessage that will display on their terminal,\
    \ and press Ctrl+D when done.\n\n \n\n**Note:** *Use the *lslogins -OR-who -a*\
    \ command to see the users*\n\n*logged into the system.*"
  - "[PAGE 158]\n\nManaging the Syslog\n\n \n\nWhen the system or applications need\
    \ to write events (i.e. warnings, alerts,\n\ninformation, etc.), it writes them\
    \ into the system log (aka syslog).\n\n \n\nTo check the contents of the syslog,\
    \ type:\n\nless *var*log/syslog\n\n \n\n**Note:** *There are other system related\
    \ log files in the* *varlog/*\n\n*directory. To see all of them type:* *ls -l\
    \ varlog/\\*.log*\n\n \n\nTo find out where the syslog is located, type: less\
    \ *etc*syslog.conf\n\n \n\nTo send a message into syslogd, type:\n\necho **HelloWorld**\
    \ | logger\n\n**Note:** *It is possible that* *etcsyslog.conf file is really named\
    \ etcrsyslog.conf*\n\n*depending on the distro.*\n\n \n\n**Monitoring log files**\n\
    \n \n\nLinux provides several different tools for searching and displaying your\
    \ log files.\n\nThe ones I am covering next are just the basic ones. Although,\
    \ they might be the\n\nones that you use the most often.\n\n \n\nTo see the last\
    \ few lines, type:\n\ntail ***var*****log/syslog** To continuously displays the\
    \ latest changes to a log file,\n\ntype: tail -f ***var*****log/syslog**\n\n**Tip:**\
    \ *To see the top of the log file, type:* *head ****varlog/syslog***"
- md: "\nTo review a log file from the start, type:\n\nless /var/log/syslog\n\n To\
    \ quickly find line in a log file that contains specific text, type: grep \"find\
    \ this text\" /var/log/syslog\n\n## Background and Foreground Jobs\n\nIn the terminal,\
    \ commands run serially, meaning you have to wait for the first command to finish\
    \ before running the next command. If a command is running for a long time, this\
    \ can be annoying if you have to wait for it to finish before you can run the\
    \ next command.\n\nSometimes, this can be an unacceptable behavior, and you just\
    \ need to run the next command. To overcome this limitation, you have two choices.\
    \ If you're running X-Windows, you can open up another terminal window. Although,\
    \ if you’re running a text terminal shell you might want to just run these commands\
    \ in the background.\n\nTo run a command in the background (use the ampersand\
    \ '&' at the end of the command), type: tree > ~output_file.txt &\n\n**Note:**\
    \ *When using a command like tree > ~output_file& , output (such as errors) may\
    \ still go to the terminal even though the process is running in the background,\
    \ try the following to stop it:* command &>devnull &*\n\nTo see all commands running\
    \ in the background, type: jobs\n\nTo send a stopped process (Ctrl+Z) into the\
    \ background, type: bg\n\nTo bring a command running in the background to the\
    \ foreground, type: fg\n\nPress Ctrl+Z to pause an application, type: fg restarts\
    \ the application or bg to run it in background.\n\nTo stop a background job,\
    \ type: kill %1 **job_number** To stop a running process, type: kill **process_id**\
    \ If the KILL command doesn't stop the process, type: kill -9 process_id\n\n**Note:**\
    \ *The '-9' is a signal that stands for SIGKILL, which means it will 'cause any\
    \ process to terminate immediately'. More information, type:* *man signal*\n\n\
    ## Shutting down and Rebooting\n\nThis section is pretty self-explanatory, *i.e.*\
    \ restart and shutting down a local or remote system. Use care when using this\
    \ command as it will stop all processes until the system is restarted.\n\nTo shut\
    \ down (or halt) the system, type:\n\nsudo shutdown -h now\n\nTo restart the system,\
    \ type:\n\nsudo shutdown -r now\n\nTo cancel a shutdown, type:\n\nsudo shutdown\
    \ -c\n\n**Tip:** *To shut down the system at a specific time, type:* *sudo shutdown\
    \ 21:00*\n\n*-OR-sudo shutdown +15*\n\n**Note:** *If the shutdown -c doesn’t work,\
    \ you can type:* *sudo pkill shutdown -OR-sudo killall shutdown.*\n\n## Network\
    \ Troubleshooting Tools\n\nThese tools will help you troubleshoot your network\
    \ problems connecting to local and remote systems. There are a great deal more\
    \ tools that are available to help you diagnose problems, but these are a good\
    \ place to start.\n\nTo check basic connectivity between your local system to\
    \ a remote system (press Ctrl+C to stop), type: ping example.com\n\nIf the command\
    \ above doesn't work, there are some other things to check. Make sure the local\
    \ system has an IP address (if it is not displaying correctly there could be a\
    \ network setup problem), type:\n\nip addr\n\n-OR—ifconfig\n\n**Note:** *Make\
    \ sure you see all the correct information, such as: IP address, default gateway,\
    \ DNS servers for the local system. If your system uses DHCP or has a static IP\
    \ address, make sure the system is properly configured.*\n\nCheck to make sure\
    \ the networking subsystem is working (press Ctrl+C to stop). If it doesn't ping\
    \ your network subsystem or if the network card failed, type: ping localhost -ORping\
    \ 127.0.0.1\n\nTry pinging your default gateway. If it doesn't ping either your\
    \ router is down or local system network settings are wrong, type: ping 192.168.1.1\n\
    \nTo test the DNS connectivity, try pinging a remote resource if it doesn't resolve\
    \ check your DNS settings (or if your DNS server could be down), type: ping google.com\n\
    \nTo display the network route path (i.e. hops) a packet takes to get to a destination,\
    \ type: traceroute example.com\n\n**Note:** *If you're trying to troubleshoot\
    \ an IPv6 address, please make sure to IPv6 versions of these commands or add\
    \ the appropriate arguments. Such as: ping6 , traceroute6 , netstat -A inet6 -rn\
    \ , ip-6 neighbor show , etc.*\n\nTo track the speed of the systems connection,\
    \ type: mtr -report example.com\n\nList the open network ports that are in the\
    \ Listening state on the system, type: netstat -lnp\n\nTo view the HOSTS file\
    \ (which overrides DNS on the local host). Make sure there are no entries in the\
    \ file that can prevent your connection, type: cat /etc/hosts\n\nTo manage entries\
    \ in the HOSTS file, type: sudo nano /etc/hosts\n\n**Note:** *etcresolv.conf ,\
    \ contains a list of Domain Name Servers (DNS) that are used by the local machine.*\n\
    \n## Deprecated and Replacement Tools\n\nIf you have been using Linux for several\
    \ years, there are tools that you might still use that could have been deprecated,\
    \ such as the ifconfig utility to manage the network connection. Sometimes these\
    \ older tools are replaced with newer tools such as the ip command.\n\nAnother\
    \ example of deprecated tools are the traceroute has been replaced with mtr .\
    \ The mtr command combines the functionality of the traceroute and ping programs\
    \ into a single network diagnostic tool.\n\nThe newer tools are generally are\
    \ more sophisticated as far as the information they provide and offer a great\
    \ deal of new features.\n\n**Older Method (** ifconfig )** See the machine's TCP/IP\
    \ configuration, type: ifconfig\n\n- To disable a network adapter, type: ifdown\
    \ eth1\n- To enable a network adapter, type: ifup eth1\n- To view wireless network\
    \ adapters and the wireless-specific information for them, type: ifconfig\n\n\
    **Newer Method (** ip )** ip is a utility for displaying and modification of routing,\
    \ devices, and tunnels To show summary for the local system, type: ip addr show\n\
    \n- To show all active links that are up, type: ip link show\n- To display IPv4\
    \ information, type: ip -4\n- To display IPv6 information, type: ip -6\n- To bring\
    \ a network interface up, type: sudo ip link eth1 up\n- To bring a network interface\
    \ down, type: sudo ip link eth1 down\n- To display the routing table, type: ip\
    \ route show\n- To add a static IP address to a network interface, type: sudo\
    \ ip addr add 192.168.0.100/24 dev eth1\n- To delete a static IP address from\
    \ a network interface, type: sudo ip addr del 192.168.0.100/24 dev eth1\n\n##\
    \ Remote Console and File Transfer\n\nSometimes you will need to remote in to\
    \ another system, or transfer files to it. ssh is a secure shell (i.e. encrypted\
    \ communications tool to give you remote control of another system. SCP is a secure\
    \ copy (i.e. encrypted communications) program that will transfer files from one\
    \ system to another.\n\nTo run a secure terminal on a remote system, type: ssh\
    \ user@hostaddress\n\n**Note:** *For Windows, use PUTTY https://www.putty.org/**\
    \ to communicate with ssh .*\n\n**Tips:** *To create an alias (i.e. jane, this\
    \ can be whatever you want) for an ssh login (it also adds this to the .bash_aliases\
    \ so it will load automatically), type: echo alias jane=\\'ssh user@hostaddress\\\
    ' >> ~/.bash_aliases; source ~/.bash_aliases * To enable tab completion for known\
    \ ssh hosts, using the.bash\\_history file, type: complete -W \"$(echo $(grep\
    \ '^ssh ' .bash_history | sort -u | sed 's/^ssh //'))\" ssh *Directions: type\
    \ ssh , then press the TAB key to see the auto-complete options (if available).\
    \ For this feature to work, you will have already had to connect to some ssh hosts\
    \ in the past.*\n\nTo securely upload a file(s) to a remote server, type: scp\
    \ file\\_name.tar.gz user\\_name@example.com:/path/to/directory/\n\n**Tip:** *To\
    \ copy the file to the user directory so it is easy to find later, type: scp file\\\
    _name.tar.gz user\\_name@example.com:./*\n\n**Notes:** *Requires the ssh service\
    \ to be installed on the remote server. It also requires ssh client to on the\
    \ local system connecting to the server in order to use this service. It is also\
    \ expected that the*\n"
  mdcn: "\n\n要从头开始查看日志文件，输入：\n\nless /var/log/syslog\n\n要快速在日志文件中找到特定文本的行，输入： grep\
    \ \"find this text\" /var/log/syslog\n\n## 后台与前台作业\n\n在终端中，命令是串行执行的的，这意味着你必须等待第一个命令完成后才能运行下一个命令。如果一个命令运行时间很长，而你必须等待它完成才能运行下一个命令，这可能会让你感到困扰。\n\
    \n有时，这种行为可能是不可接受的，你只需要运行下一个命令。为了克服这个局限性，你有两个选择。如果你运行的是 X-Windows，可以打开另一个终端窗口。尽管如果你运行的是文本终端\
    \ shell，你可能只想在后台运行这些命令。\n\n要在后台运行命令（在命令末尾使用 符号 `&`），请输入：tree > ~output_file.txt\
    \ &\n\n**注意：** *当使用像 tree > ~output_file& 的命令时，即使进程在后台运行，输出（如错误信息）仍可能仍然终端，尝试以下操作来停止它：*\
    \ command &>devnull &*\n\n要查看所有在后台运行的命令，输入：jobs\n\n要将停止的进程 (Ctrl+Z) 发到后台，输入：bg\n\
    \n要将在后台运行的命令带回前台，输入：fg\n\n按下 Ctrl+Z 暂停应用程序，输入 fg 重启应用程序或输入 bg 将其在后台运行。\n\n要停止后台作业，输入：kill\
    \ %1 **job_number**（作业编号）。要停止运行中的进程，输入：kill **process_id**（进程 ID）。如果 KILL 命令没有停止进程，输入：kill\
    \ -9 process_id\n\n**注意：** *'-9' 是一个代表 SIGKILL 的信号，意味着它将“导致任何进程立即终止”。更多更多信息，请输入：*\
    \ *man signal*\n\n## 关机与重启\n\n这一部分非常显而易懂，*即*重启和关机本地或远程系统。使用此命令时要小心，因为它将停止所有进程，直到系统重启为止。\n\
    \n要关机（或停止）系统，输入：\n\nsudo shutdown -h now\n\n要重启系统，输入：\n\nsudo shutdown -r now\n\
    \n要取消关机，输入：\n\nsudo shutdown -c\n\n**提示：** *要在特定时间关机系统，输入：* *sudo shutdown 21:00*\n\
    \n*-OR-sudo shutdown +15*\n\n**注意：** *如果 shutdown -c 不起作用，你可以输入：* *sudo pkill\
    \ shutdown -OR-sudo killall shutdown.*\n\n## 网络排错工具\n\n这些工具将帮助你排查连接本地和远程系统的网络问题。还有许多可用工具可以帮助你诊断问题，但这些是很好的起点。\n\
    \n要检查本地系统与远程系统之间的基本连接性（按 Ctrl+C 停止），输入：ping example.com\n\n如果上面的命令不起作用，还有其他一些需要检查的内容。确保本地系统具有\
    \ IP 地址（如果没有正确显示，则可能存在网络设置问题），输入：\n\nip addr\n\n-OR—ifconfig\n\n**注意：** *确保你看到了所有正确的信息，例如：本地本地的\
    \ IP 地址、默认网关、DNS 服务器。如果你的系统使用 DHCP 或具有静态 IP 地址，请确保系统已正确配置。*\n\n检查并确保网络子系统工作正常（按\
    \ Ctrl+C 停止）。如果它无法 ping 通你的网络子系统或网卡故障，输入：ping localhost -ORping 127.0.0.1\n\n\
    尝试 ping 你的默认网关。如果都 ping 不通，说明路由器宕机或本地系统网络设置错误，输入：ping 192.168.1.1\n\n要测试 DNS 连接性，如果无法解析，尝试\
    \ ping 远程资源，请检查你的 DNS 设置（或如果你的 DNS 服务器可能宕机了），输入：ping google.com\n\n要显示数据包到达目的地所经过的网络路由路径（即跳数/hops），输入：traceroute\
    \ example.com\n\n**注意：** *如果你正在尝试排查 IPv6 地址，请确保使用这些命令的 IPv6 版本或添加相应的参数。例如：ping6\
    \ , traceroute6 , netstat -A inet6 -rn , ip-6 neighbor show 等等。*\n\n要跟踪系统连接的速度，输入：mtr\
    \ -report example.com\n\n列出系统上处于监听 状态的开放网络端口，输入：netstat -lnp\n\n查看 HOSTS 文件（该文件会覆盖本地主主机上的\
    \ DNS）。确保文件中没有可以阻止你连接的条目，输入：cat /etc/hosts\n\n要管理 HOSTS 文件中的条目，输入：sudo nano /etc/hosts\n\
    \n**注意：** *etcresolv.conf 包含了本地机器使用的域名服务器 (DNS) 列表。*\n\n## 已弃用与替代工具\n\n如果你已经使用\
    \ Linux 几年了，你可能仍在使用的工具可能已经被弃用，例如用于管理网络连接的 ifconfig 实用程序。有时，这些旧工具会被更新工具（如 ip 命令）所取代。\n\
    \n已弃用工具的另一个例子是 traceroute 已被 mtr 取代。mtr 命令将 traceroute 和 ping 程序的功能合并到了单一的网络诊断工具中。\n\
    \n较新的工具在提供的信息方面通常更加复杂，并提供了许多新功能。\n\n**旧方法 (** ifconfig )** 查看机器的 TCP/IP 配置，输入：ifconfig\n\
    \n- 禁用网络适配器，输入：ifdown eth1\n- 启用网络适配器，输入：ifup eth1\n- 查看无线适配器的信息，输入：ifconfig\n\
    \n**新方法 (** ip )** ip 是一个用于显示和修改路由、设备和隧道的实用程序。显示本地系统的摘要，输入：ip addr\n\n- 显示所有激活的链路，输入：ip\
    \ link\n- 显示 IPv4 信息，输入：ip -4\n- 显示 IPv6 信息，输入：ip -6\n- 将网络接口启用，输入：sudo ip link\
    \ up eth1\n- 将网络接口禁用，输入：sudo ip link down eth1\n- 显示路由表，输入：ip route show\n- 为网络接口添加静态\
    \ IP 地址，输入：sudo ip addr add 192.168.0.100/24 dev eth1\n 从网络接口删除静态 IP 地址，输入：sudo\
    \ ip addr del 192.168.0.100/24 dev eth1\n\n## 远程控制与文件传输\n\n有时你需要登录另一个系统，或向其传输文件。ssh\
    \ 是一种安全外壳，用于对对系统的远程控制。SCP 是一种安全拷贝程序，用于将文件从一个系统传输到另一个系统。\n\n要在远程系统上运行安全终端，输入：ssh\
    \ user@address\n\n**注意：** *对于 Windows，使用 PUTTY https://www.putty.org/** 与 ssh\
    \ 通信。*\n\n**提示：** 为 ssh 登录创建一个别名（例如 jane，你可以用任何名称）（它也会被添加到 .bash_aliases 中，这样它会自动加载），输入：echo\
    \ alias jane=\\'ssh user@address\\' >> ~/.bash_aliases; source ~/.bash_aliases\
    \ * 使用.bash\\_history 文件启用已知 ssh 主机的标签补全，输入：complete -W \"$(echo $(grep '^ssh\
    \ ' .bash_history | sort -u | sed 's/^ssh //'))\" ssh *说明：输入 ssh ，按下 TAB 键查看自动完成选项（可用）。要使此功能工作，你过去必须连接过某些\
    \ ssh 主机。*\n\n要安全地向远程服务器上传文件(s)，输入：scp file\\_name.tar.gz user\\_name@example.com:/path/to/directory/\n\
    \n**提示：** 将文件拷贝到用户目录以便以后以后查找，输入：scp file\\_name.tar.gz user\\_name@example.com:./*\n\
    \n**注意：** *需要在远程服务器上安装 ssh 服务。它还需要连接服务器的本地系统安装 ssh 客户端才能使用此服务。还预计该*\n\n"
