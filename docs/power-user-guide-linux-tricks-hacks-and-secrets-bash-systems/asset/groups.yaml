    ## Creating File Shortcuts (Links)


    There are two types of file shortcuts (aka links) that can be created in Linux,
    they are hard and soft links. Hard links can be created to files and directories
    on the same volume. Soft links (aka symbolic Links) can be created to files and
    directories on different volumes.


    The advantage of using links (hard or soft) is that when you modify the link file
    it is like modifying the original file, because they may exist in a different
    location then the original file. It is just a pointer (i.e. it literally points
    to the file on the disk) that directs the filesystem to use the correct file.


    The hard link is a separate file which contains information about the original
    file and where it is located, type: cp -l **file_name1** **file_name2**


    **Note:** *If you delete the original file, the hard link will prevent the file
    from being deleted. If you want to delete the file, will also have to remove the
    hard link.*


    An alternative command to create a hard link, type: ln **file_name1** **file_name2**


    If you need to create links on a different physical drive, you’ll have to create
    a soft link instead, type: cp -s **file_name1** **file_name2**


    **Notes:** *If you delete the original file test.txt it will also delete the shortcut
    test1.txt. The output shows the link to test1.txt which is the shortcut to the
    original file: test.txt : lrwxrwxrwx 1 jane root 11 May 20 12:23 test1.txt ->
    test.txt -rw-rw-rw-1 jane root 1242 May 20 12:19 test.txt An alternative command
    to create a hard link, type: ln -s **file_name1** **file_name2** (Note: The OCR
    suggests this is for soft links).*


