- md: '

    Press Ctrl+Alt+T


    **To start a terminal on a Mac OS X device:** To launch terminal by using

    Spotlight search, type: terminal and press Enter.


    **To start a terminal on Windows 10**


    If you are using Windows 10, you can utilize a VM to run an instance of

    the OS or can use the new Linux Subsystem (known as WSL) that is now

    included with it.


    Launch the Distro Terminal that you install from the Start menu.


    **Note:** *To install the Linux Subsystem, run the following command*

    *from an administrator PowerShell console* Enable-WindowsOptionalFeature -Online
    -FeatureName Microsoft-Windows-Subsystem-Linux . Then the user has to go to the

    *Windows Store (**https://aka.ms/wslstore**) and download the version

    *of Linux that they want to use.*


    ## Updating the system


    If this is a new installation of Linux or it has not been updated in a little
    while,

    you should make sure it is up-to-date, by installing the latest libraries,

    application fixes and security patches. From a security perspective this is very

    important as it can help keep your system from getting compromised.


    Depending on the distribution you’re using, this procedure will vary. The first

    command in both scenarios gets the information about the updates about the

    utilities, libraries, *etc.* The second command executes the updates.


    For Debian based distributions, run the following commands (requires root

    permission): sudo apt-get update, sudo apt-get upgrade


    For Red Hat based distributions, run the following commands (requires root

    permission): sudo yum update, sudo yum upgrade


    ## Introduction to the Linux Shell


    **Overview:** This book assumes that you know how to log in to the operating

    system, and that you already have an account setup with the proper permissions.

    This book also assumes that you are already logged into the terminal and it is

    using the BASH shell.


    When you start Linux it will either start in GUI or text terminal mode. If your

    system starts in a GUI mode, then you will need to start a console or terminal

    session. Otherwise, log into whatever system that you’re going to use.


    ## Using the console


    The main goal of any shell is to facilitate the execution of commands or scripts

    by supplying them with the needed information (aka arguments). Some of the

    additional functionality that the shell provides is: variables, conditional

    branching (i.e. if-statements), loops, functions, *etc.* for creating scripts
    that

    manage the operating system, files, permissions, *etc.*


    The first and most critical thing that you have to learn is the editing features
    of

    the terminal. You will use these keyboard shortcuts the most often and they will

    make your life easier in the terminal once you have master them.


    **Note:** *The terminal uses a set of similar editing function keys that are*

    also utilized by *vi and other similar editors (i.e.* *vim , *emacs , etc.).*


    ### Keyboard Shortcuts


    Editing in the command terminal (Note: these commands are BASH shell

    specific, and other shells may have different options)


    - Press **Ctrl+A** (or press the **Home** button) to move to the beginning of
    a line

    - Press **Ctrl+E** (or press the **End** button) to move to the end of a line.

    - Press **Ctrl+L** to clear the screen.


    **Tip:** *If the terminal is giving you problems, type: reset*


    - Press **Ctrl+K** to delete everything until the end of the line.

    - Press **Ctrl+D** quits the current shell.

    - Press **Ctrl+U** to cut the text from the current cursor position to the

    beginning of the line.

    - Press **Ctrl+Y** to paste the cut text.

    - Press **Ctrl+W** to cut backwards one word.

    - Press **Ctrl+T** to swap the two characters before the cursor.

    - Press **ESC+T** swaps the two words before the cursor.

    - Press **Ctrl+\] (character)**: quickly jump forward to the typed character.

    - Press **Ctrl+\_** to undo the last change.

    - Press **Alt+F** to go forward one word in the line.

    - Press **Alt+B** to go one word backward in a line.

    - Press **Alt+(.)** to display the previous command and pull the last argument

    from it.

    - Press **Alt+Backspace** to cut the previous word.

    - Press **Alt+Delete** to cut the characters before cursor.

    - Press the **up** and **down arrows** to move through the previous command

    history.


    - Press the TAB key to auto-complete filenames/directories after a command, type:
    mkdir /(press the TAB key)


    **Note:** *If there are multiple values (i.e. multiple files or directories),
    press the

    TAB key multiple times to see all the available choices.*


    **Tips:** *If you have to write or edit a long command, type: fc *(this

    will open up an editor, and display the last command typed. From

    here you can edit the command. Press **Ctrl+X**, type **Y** and press

    **Enter** to execute it when you’re done)* *It is possible to expand

    aliases before pressing enter*


    ## Auto-Complete Shortcuts


    If there are multiple values (i.e. multiple files or directories), press the

    TAB key multiple times to see all the available choices.


    **Tips:** *If you have to write or edit a long command, type: fc *(this

    will open up an editor, and display the last command typed. From

    here you can edit the command. Press **Ctrl+X**, type **Y** and press

    **Enter** to execute it when you’re done)* *It is possible to expand

    aliases before pressing enter*


    ## External commands


    All shells have two types of commands, builtin and external. BASH has several

    builtin commands, meaning that they don''t require being, and they can''t

    uninstalled. Most external commands, have to be installed (or removed) using some

    installation manager like apt-get, yum . The commands

    are installed by default will vary between distros.


    To get help from any external command and see their options, type:

    command --help


    For example, type:

    mkdir --help


    **Tips:** *To make it easier to search man pages for what you’re looking for,*

    use the following arguments followed by the command or search string.*

    man -f (containing a string)

    man -k (containing a string)

    man -a (displays all pages with the given name in all chapters)


    info is an alternative system to provide manual pages for GNU commands.

    The navigation keys are: ''n'' for next node, ''p'' for previous node, ''u'' for
    up

    node in index


    Most commands are composed of two or more elements (i.e. kill -p 2300).

    They will always have a name (i.e.: kill ), and most will also have an optional

    set of arguments (i.e.: -p ). When this command is executed, it will kill the
    process id 2300.


    **Note:** *Often when you use the with man pages, you will see command

    with number in parentheses (i.e. man(7)). The table below describes

    what each of those numbers means.*


    | Section | Description |

    | :--- | :--- |

    | 1 | Executable programs or shell commands, e.g., date, who |

    | 2 | System calls (functions provided by the kernel), e.g., read(), write() |

    | 3 | Library calls (functions within program libraries), e.g., fread(), fwrite()
    |

    | 4 | Special files (usually found in /dev), e.g., null, fifo, zero, hd |

    | 5 | File formats and conventions (i.e. etcpasswd), e.g., passwd, group, resolv.conf
    |

    | 6 | Games |

    | 7 | Miscellaneous (including macro packages and conventions), e.g., man(7),
    groff(7) |

    | 8 | System administration commands (usually only for root), e.g., useradd, ifconfig
    |

    | 9 | Kernel routines [Nonstandard] |


    **Ex:** To access the section in the man page (i.e. man(7) ), type: man 7 man

    For more information about this subject, type: man -s 1 man

