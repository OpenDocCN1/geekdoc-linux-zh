    *information do a search for ‘graphical Git clients’


    One of the most popular online public git repositories is known as GitHub (https://github.com/).
    This site is synonymous with git, and is the default choice for a lot of open
    source projects. Although this is not the only choice, there are several git repositories
    providers to choose from. Some are free, while others offer premium services.


    ## Getting Started


    Before you can do anything, you have to make sure that the git client is installed.
    If the client is not installed then you need to add it to the local system in
    order to utilize it.


    To check if you have the git client installed, type: `git --version` (If it returns
    results such as ‘git version 2.x.x’, then the client is installed).


    **Note:** *If you don’t have git, to install it, type: sudo apt-get install git
    - OR - sudo yum install git*


    ## Key Concepts


    We have already covered some important topics, such as: where are the server and
    client. This section deals with the other important key concepts, for example:
    repositories, branching, etc.


    ### Repositories


    All the projects in git are stored in what is called a repository. A repository
    is where all the related objects (i.e. images, source code, etc.) that make up
    the project are stored. You can access a repository locally or remotely.


    A local repository consists of three ‘trees’ that are maintained by git. The three
    trees are the Working Directory, Index, and Head. Each of these trees are outlined
    below.


    - **Working Directory**: this is where all the actual files are stored. In order
    to work with an existing repository you have to create a new one or clone it locally
    on your computer. When you clone an existing repository, it makes a full copy
    of itself that is under your control.


    If you wanted to create a new repository for yourself, the first thing to do is
    make a directory (i.e. `mkdir directory_name`) to hold the repository. Then you
    need to switch to that location (i.e. `cd directory_name`), then type: `git init`
    (this will create a new hidden directory called .git that stores the configuration
    files). To work with a remote repository you will have to clone it (basically
    making a local copy of it). Type: `git clone user_name@host:path/to/repository`.
    To work with a local copy of a repository, type: `git clone path/to/repository`.


    - **Index**: acts as a staging area for the recent changes that you have made
    to the local copies of the files. Generally these are saved changes that you make
    as you are testing your code. If there is a problem you can revert to previous
    saved versions of the files.


    To add files into the Index, you have to ‘propose’ changes by adding them into
    the Index, type: `git add file_name` - OR - `git add *`


    - **Head**: Holds the latest versions of the commit(s) that you''ve made to the
    files in the local repository. When you’re ready to commit all the changes that
    are placed into the Index, you have to ‘commit’ them to the ‘head’. After they
    are committed into the head, they can be merged into the master repository that
    is on a remote system.


    To commit the propose changes into the head, type: `git commit -m "Commit message"`


    **Note:** *It is recommended to create tags for each software release. For example,
    type: git tag v1.2.3 1a2b3c4d5e (the last part is the first 10 characters of the
    commit id, which can be found in the log.*


    Generally, once you have completed making your changes to the files in your local
    repository, you will want to send them to the master server so that they can be
    merged with the other changes.


    In order to do this you have to tell git to push the changes stored on your local
    system in the ‘head’, to the master repository stored on a remote server, type:
    `git push origin master` (Change master to whatever branch you want to push your
    changes to.)


    **Note:** *If you don’t have an existing cloned remote repository, you have to
    establish a connection with a remote server you will need to add one. To add a
    remote repository, type: git remote add origin server_address*


    ## Branching


    Another key concept in git is called Branching. The master branch is known as
    the DEFAULT branch when you create a repository. Branching allows a user to make
    an isolated copy of a feature to develop it locally, then later merge it back
    into the master branch when it is completed.


    To create a new branch named `new_feature`, and then switch to it, type: `git
    checkout -b new_feature`. To switch back to the master branch, type: `git checkout
    master`


    To delete the branch that was created, type: `git branch -d new_feature`


    **Note:** *A branch is not available to others unless you push the branch to the
    remote master repository, type: git push origin new_feature*


    ## Repository Maintenance


    Once you have de-synchronized your local repository with the remote, you need
    to perform maintenance tasks to ensure everything is up to date.


    ### Commits and Merges


    The following commands help you manage and merge:

    - To update your local repository with the latest commits, type: `git pull`

    - To fetch changes from the remote: `git fetch`


    ### Logging


    The `git log` command shows you the commits and message history. The logs are
    useful for finding what changes happened during commits.


    To see the results of this command, type: `git log`


    ### Reverting a File/Repository


    Sometimes it is necessary to revert or reset a file back to its previous state
    since it was committed. These commands help manage reversions:

    - To revert a file back to its state since it was committed in the local repository,
    type: `git checkout -- file_name`

    - To reset (i.e. delete all changes) in your local copy of the repository to a
    fresh copy from the master, type: `git reset --hard origin/master`


    ## Useful Tricks


    These commands can make git a little easier to use or more useful:

    - Display colorful git output, type: `git config color.ui true`

    - Show one line per commit in the logs, type: `git config format.pretty oneline`

    - Put git into interactive mode (menu selection), type: `git add -i`


    **Note:** *More information: Check out the official Git site: https://git-scm.com/*


    ## CheatSheet


    This git cheat sheet contains summaries and examples of some of the git commands.
    This section provides a quick reference of how to create, manage and delete repositories,
    branches and files, as well as modifying the configuration.


    ### Creating Repositories


    `git init [project_name]` Initialize GIT in an existing directory.


    ### GIT Configuration


    `git config`: Configures the user information for all the local repositories.

    - `--list`: shows current GIT configuration.

    - `--global user.name = "[name]"`: Sets user name you want to use to commit your
    transactions.

    - `--global user.email = "[email address]"`: Sets email address you want to use
    to commit your transactions.

    - `--global color.ui auto`: Enables colorization of the command line output.


    ### Cloning a remote repository


    `git clone [path | URL]`: Clones (i.e. copies or downloads) a remote repository
    to your local machine into a directory.

