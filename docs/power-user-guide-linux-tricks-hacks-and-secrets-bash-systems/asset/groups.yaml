    \ Linux (the operating system), Apache (the web\n\nserver service), MySQL (the\
    \ database service), and PHP or Python (for dynamic\n\ncontent generation).\n\n\
    \ \n\n**LAMP Overview**\n\nLayer 4:** Shell** (i.e. Sytem and service management)\
    \ Layer 3:\n\n**Apache and MySQL Service** Layer 3a: **PHP Engine** (Called by\n\
    \nthe Apache Service) Layer 3b: **PHP Webpage and Apps** (i.e.\n\nMyPHPAdmin)\
    \ Layer 2: **Network** **and Firewall** (i.e.\n\nCommunication) Layer 1: **Host\
    \ OS** (i.e. Kernel, Libraries, etc.)\n\nLayer 0: **Infrastructure** (i.e. Hardware,\
    \ VM, Cloud, IoT, etc.) If\n\nyou're still learning Linux this is a great chapter\
    \ because it will give\n\nyou exercises to get an idea of what it takes for installing\
    \ a set of\n\nLinux applications and services. This chapter will teach you the\n\
    \nbasics of installing services, controlling them, managing\n\nconfiguration files,\
    \ and more.\n\nEven if you're not going to be using LAMP services, but want to\
    \ get more\n\nexperience installing and managing them. This chapter will provide\
    \ a great\n\nintroduction to this type of Linux administration.\n\n \n\n**Prerequisites:**\
    \ *This section requires that you have root permissions on*\n\n*the system to\
    \ install services and make changes to the OS.*\n\n*Before starting this section,\
    \ make sure that you get the updated list of the*\n\n*package manager repositories,\
    \ so that you get the latest versions of the*\n\n*programs, services and libraries,\
    \ type:* *sudo apt-get update* *\\-OR-sudo*\n\n*yum update*"
