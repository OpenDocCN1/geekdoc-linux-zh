    \ copy\" of a Docker Image) *\\[Multiple*\n\n*Docker Containers can run in the\
    \ systems memory\\]*\n\nLayer 3: **Docker** **Images** (holds the\n\nPrograms/Services/Libraries/Data)\
    \ *\\[Popular Docker Images are*\n\n*maintained on the Docker Hub\\]*\n\nLayer\
    \ 2: **Docker Service** Layer 1: **Host OS** (i.e. Kernel, Libraries,\n\netc.)\
    \ Layer 0: **Infrastructure** (i.e. Hardware, VM, Cloud, IoT, etc.)\n\nIn a Hypervisor\
    \ infrastructure, every VM has its own copy of the\n\nOS, and related dependencies.\
    \ This allows for traditional code\n\nwriting or the running of legacy code, but\
    \ it lacks the resource\n\nefficiency and scalability of Docker. You also need\
    \ to maintain\n\npatches on each VM independently.\n\n \n\n**Hypervisor Overview**\
    \ (great for Legacy applications) Layer 4:\n\n**Applications/Services/Data** Layer\
    \ 3: **Virtual Machines **(w/OS\n\n\\[Windows, Linux\\]) *\\[Multiple virtual\
    \ machines can run in the systems*\n\n*memory\\]*\n\nLayer 2: **Host OS** (i.e.\
    \ Windows, Linux) Layer 1: **Hypervisor **(i.e.\n\nVMWare, Hyper-V, Xen) Layer\
    \ 0: **Infrastructure** (i.e. Hardware,\n\nVM, Cloud, IoT, etc.) Docker containers\
    \ are built from Docker\n\nimages. By default, images are pulled from the Docker\
    \ Hub\n\n(https://hub.docker.com). The Docker Hub is the Docker registry\n\nmanaged\
    \ by the company that owns the technology. Anyone can\n\nhost their images on\
    \ the Docker Hub, so the most popular"
  - "[PAGE 222]\n\napplications and Linux distributions will already have images hosted\n\
    \nthere.\n\n \n\n**Note:** *There could be variations with the install procedure*\n\
    \n*depending on the distro you're using. If you have problems, please*\n\n*look\
    \ up specific guides that maybe available for your version of the*\n\n*distro\
    \ you're running on your system.*\n\n \n\nTo understand the importance of Docker,\
    \ it helps to understand a very basic\n\nprogramming concept called a 'function'.\
    \ In traditional programming functions\n\nallow a programmer to write reusable\
    \ blocks of code that can be repeatedly used\n\nas many times as they are needed.\
    \ Functions are only limited by the capabilities\n\nof the programming language\
    \ and the programmer's imagination.\n\nA Docker container is similar to a function,\
    \ in respects that it contains reusable\n\ncode that can be repeatedly used as\
    \ many times as they are needed. When using\n\nthe Docker technology, a developer\
    \ can create a program that is very scalable.\n\nInstead of writing a large monolithic\
    \ program, they can break up their code into\n\nDocker containers.\n\nWhen the\
    \ developer needs to scale the system resources up or down all they\n\nhave to\
    \ do is start or stop containers based on the images that contain the code\n\n\
    that they need. This is an over simplified explanation of the technology, but\n\
    \nhopefully you will see the power of it.\n\nYou can literally start or stop a\
    \ Docker container in microseconds, verses\n\nspinning up a VM which can take\
    \ several seconds to a few minutes. The Docker\n\ncontainers also have the advantage\
    \ of a smaller system resource footprint,\n\nbecause they don't have their own\
    \ independent operating system.\n\nThis chapter only covers Docker at a very high-level,\
    \ it should be good enough\n\nto get you started understanding what it does. Although,\
    \ it really doesn't provide\n\nanything more than a quick introduction to the\
    \ technology, and how to do basic\n\nadministration of it."
