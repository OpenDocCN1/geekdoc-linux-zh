    **注意：** *大括号 ‘{}’ 扩展允许你扩展一组字符。例如，* *{1..100} 将 1 到 100 之间的数字递增地添加到字符串或文件名中。例如，*
    *{ a..z }* 将 A 到 Z 之间的字母递增地添加到字符串或文件名中。* 其他大括号扩展的示例，输入：* *echo {0,1}{0..9}* *echo
