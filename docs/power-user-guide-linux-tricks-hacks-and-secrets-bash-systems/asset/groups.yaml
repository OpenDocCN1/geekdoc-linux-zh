  - "[PAGE 19]\n\nOrigins of Linux\n\n \n\nThe original UNIX concept was based on\
    \ a multiuser operating system (that also\n\nincluded single-level storage, dynamic\
    \ linking, and a hierarchical filesystem) in\n\na project called ‘Multics’. This\
    \ OS was developed at the Bell Laboratories’\n\nComputer Sciences Research Center.\
    \ The Multics OS was abandoned by Bell\n\nLabs in 1969.\n\nKen Thompson and Dennis\
    \ Ritchie, and a group of other researched continued\n\nworking with the project’s\
    \ core principles. Then In 1973 they chose to rewrite\n\nthe OS in C, which made\
    \ UNIX uniquely portable (i.e. the ability to move it to\n\nnewer hardware). Unlike\
    \ other operating systems at the time.\n\nUNIX continued to be developed at Bell\
    \ Labs (later AT&T), and under UNIX\n\nSystem Laboratories in partnership with\
    \ Sun Microsystems. While at the\n\nComputer Systems Research Group at the University\
    \ of California Berkeley,\n\nthey produced a UNIX variant the Berkeley Software\
    \ Distribution (BSD), or\n\nBSD UNIX. This version of the OS inspired others,\
    \ such as NeXTStep from\n\nNeXT, which later became the basis for the MacOS. It\
    \ also MINIX an\n\neducational version of the OS, and Linus Torvalds inspiration\
    \ to develop Linux.\n\nRichard Stallman, one of the central figures that helped\
    \ inspire the open source\n\nsoftware movement, which was seeking non-proprietary\
    \ alternatives to UNIX.\n\nStallman initiated work on the GNU project (recursive\
    \ for \"GNU’s not UNIX!\")\n\nwhile working at MIT’s Artificial Intelligence Laboratory.\
    \ In 1984 he left to\n\ndistribute the GNU components as free software, and founded\
    \ the Free Software\n\nFoundation (FSF) in 1985.\n\nLinus Torvalds a Finnish undergraduate\
    \ student frustrated with the MINIX OS\n\nlicensing. Later announced on August\
    \ 25, 1991 to a MINIX user group that he\n\nwas developing his own operating system\
    \ that was similar to MINIX. He\n\ninitially developed the Linux Kernel using\
    \ the GNU C compiler on MINIX. This\n\nquickly became a unique project, with Torvalds\
    \ and core set of developers who\n\nreleased version 1.0 of the kernel in 1994.\n\
    \nTorvalds used the GNU C Compiler to write the Linux kernel, and many Linux\n\
    \ndistributions utilize the GNU components. Stallman lobbied to expand the term\n\
    \nLinux to GNU/Linux, which he felt would capture both contributions of Linux’s\n\
    \ndevelopment and the GNU project in underlying ideals that fostered Linux."
