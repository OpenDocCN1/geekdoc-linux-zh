    \ local machine's hostname address, type: hostname"
  - "[PAGE 207]\n\nInstalling MySQL Database\n\n \n\n**Overview:** This section provides\
    \ instructions on how to install the MySQL\n\ndatabase service. This service is\
    \ utilized by web apps to store or retrieve data it\n\nneeds.\n\n \n\nMySQL is\
    \ an open-source relational database management system (RDBMS).\n\nIts name is\
    \ a combination of \"My\", the name of co-founder Michael Widenius's\n\ndaughter,\
    \ and \"SQL\", the abbreviation for Structured Query Language.\n\n \n\n**Prerequisites:**\
    \ *This section assumes that your Apache service is working*\n\n*and configured\
