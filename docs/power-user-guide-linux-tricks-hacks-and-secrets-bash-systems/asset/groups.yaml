  mdcn: "\n\n## 系统性能\n\n测试您的硬盘性能，输入：`hdparm -Tt /dev/hda`\n\n检查本地存储写入速度，输入：`dd if=/dev/zero\
    \ of=/tmp/output.img bs=8k count=256k conv=fdatasync; rm -rf /tmp/output.img`\n\
    \n显示处理器和内存带宽（单位为 GB/s），输入：`dd if=/dev/zero of=/dev/null bs=1M count=32768`\n\n\
    按住键盘上的 'Alt' 和 'SysRq' 键，在按住它们的同时，缓慢输入以下字母：R E I S U B\n\n**警告：** *这将重启您的电脑，而无需按电源按钮。*\n\
    \n## 任务调度\n\nLinux 中有两个子系统用于调度在未来时间执行的任务。它们分别是 AT 和 CRONTAB 调度子系统。这些服务在使用时各有其优缺点。\n\
    \n### AT 调度器\n\n第一种方法是 `at` 命令，它非常基础且易于使用。你需要了解的 `at` 命令是：它只能在特定的时间/日期运行一次一组命令。\n\
    \n要在特定时间运行命令，输入：`at 9:30 AM 05/10/2025` 并按回车。然后输入要运行的命令序列（例如：`ls -l > /tmp/at_output.txt`），每个命令后按回车，最后按\
    \ Ctrl+D 退出 at 编辑。\n\nAT 服务管理命令：\n\n- `atq` ：列出用户等待中的 AT 命令作业。\n- `atrm job_number`\
    \ ：删除用户等待中的 AT 命令作业。\n- `batch` ：在系统负载水平允许时执行命令。\n\n**提示：** *使用 batch 命令，你可以在\
    \ CPU 平均负载低于特定阈值时运行另一个命令或脚本，输入：`rm -rf /largedirectory/* | batch`（batch 是 at 的一部分，并依赖于其服务。**警告：谨慎使用，因为此命令将递归删除文件**）*\n\
    \n**注意：** *AT 调度守护进程（或服务）必须处于运行状态，此命令才能起作用。*\n\n### CRONTAB 调度器\n\n第二种命令是 `crontab`，该命令比\
    \ AT 服务更健壮。crontab 命令可以按固定间隔运行作业。这将是在选择使用何种调度器时主要的区别点之一。\n\n使用 crontab 时首先需要学习的是该命令有六个参数。前五个参数定义了命令预期执行的日期和时间。第六个参数定义了要执行的命令或脚本。\n\
    \n**注意：** *crontab 语法如下：[分钟 (0-59)] [小时 (0-23)] [日期 (1-31)] [月份 (1-12)] [星期几 (0-6,\
    \ 6 = 周日)] [命令（例如，脚本路径）]。*\n\n要创建一个 CRON 调度任务（也称为 CRON Job），首先输入：`crontab`。然后你将进入一个微编辑器（编辑功能非常有限）。要创建一个在\
    \ 1 月 8 日早上 8:05 运行并执行命令 `echo \"Hello, World\"` 的任务。\n\n如果输入 `crontab`，你需要输入：`05\
    \ 08 08 01 * echo \"Hello, World\" > test_file.txt`，完成后按 Ctrl+D。\n\n默认情况下，crontab\
    \ 条目针对当前登录用户。要查看所有定义的作业，输入：`crontab -l`\n\n要在编辑器中编辑 CRONTAB 条目，输入：`crontab -e`\n\
    \n要编辑其他用户的 CRONTAB，使用以下参数，输入：`crontab -u user_name -e`\n\n**注意：** *通配符：星号 (*)\
    \ 匹配任何内容。范围：使用连字符 (-) 定义范围（例如：周一至周五，6-9，1月至2月）。多个范围：使用逗号分隔多个范围。*\n\n 关键字快捷键\n\n\
    CRON 还支持一些针对常用时间等的定义的关键字快捷键（例如：每、每日等）。表格显示了关键字和等效时间：\n\n| 关键字 | 等效时间 |\n| :---\
    \ | :--- |\n| @yearly | 0 0 1 * |\n| @daily | 0 0 * |\n| @hourly | 0 * * * |\n\
    | @reboot | 启动时 |\n\n**注意：** *CRONTAB 文件位于：/etc/crontab*\n\n## NFS (网络文件系统)\n\n\
    在 Linux 中，你可以使用名为 NFS (Network File System) 的服务通过网络与其他计算机共享文件。该服务允许远程系统通过网络挂载目录，以便在系统之间移动文件。NFS\
    \ 主要用于 Linux 系统，而 Samba 使用微软计算机所用的 SMB 协议。OSX 及更高版本对 NFS 有原生支持。虽然 Windows 7 提供了基本支持，但\
    \ Windows 10 有更好的支持（这取决于版本而定）。如果你不需要 NFS，则必须单独安装客户端和服务。\n\n### 安装/配置 NFS 服务\n\n\
    为了在设备上托管 NFS 共享，你需要安装客户端以便其远程可用。你首先需要做的是检查你的系统上是否已经安装并运行了 NFS 服务，输入：`dpkg -l |\
    \ grep nfs-kernel-server`\n\n如果尚未安装此服务，输入：`sudo apt-get install nfs-kernel-server`\
    \ 或 `sudo yum install nfs-utils`\n\n### 设置 NFS 目录\n\n需要注意的是，NFS 默认会忽略 Root（超级用户）权限。因此，即使你以\
    \ root 权限登录，任何相关操作默认都会被忽略。这是一种安全措施，防止系统被远程接管。尽管如果需要，可以按共享范围授予 root 权限。\n\n首先，必须为你要挂载的\
    \ NFS 共享创建一个挂载点，输入：`sudo mkdir -p /var/nfs/myshare`。需要注意的是，这些目录 /var/nfs 和 /var/nfs/myshare\
    \ 将具有 777 权限，输入：`sudo chmod -R 777 /var/nfs/myshare`。\n\n要配置共享的权限，你需要将它们添加到 /etc/exports\
    \ 文件中。你将为想要共享的每个目录创建一行。例如：`share_directory client_ip_address(share_option1,...)`。\n\
    \n- **rw**：授予客户端计算机对共享内容的读写权限。\n- **sync**：此选项强制 NFS 在回复之前写入本地存储。\n- **no_subtree_check**：此选项防止子树检查，具有轻微的安全影响。但在某些情况下可以提高性能。\n\
    - **no_root_squash**：默认情况下，NFS 将远程 root 用户转换为服务器上的非特权用户。此选项禁用了这种行为。\n\n在修改 /etc/exports\
    \ 文件后，必须重启 NFS 服务使更改生效，输入：`sudo service nfs-kernel-server restart`\n\n## 为 NFS\
    \ 设置防火墙\n\n如果主机上运行了防火墙（通常情况下如此），你需要在防火墙上开放特定端口，以便 NFS 服务对远程系统可用。\n\n**注意：** *本节假设你的电脑上安装了\
    \ UFW 工具来管理防火墙。有关 UFW 工具的更多信息，请参见下一节“让 IPTABLES 简单”。*\n\n你首先想做的是检查防火墙状态，输入：`sudo\
    \ ufw status`\n\n**注意：** *如果防火墙未启用，建议启用此功能。*\n\n查看防火墙启用了哪些应用程序，输入：`sudo ufw app\
    \ list`\n\n**注意：** *UFW 工具将检查 /etc/services 以服务使用的端口和协议。*\n\n要将端口添加到防火墙，输入：`sudo\
    \ ufw allow from any to any port nfs`\n\n需要注意的是，NFS 最佳实践建议限制连接到特定的客户端，输入：`sudo\
    \ ufw allow from 192.168.0.100 to any port nfs`\n\n"
