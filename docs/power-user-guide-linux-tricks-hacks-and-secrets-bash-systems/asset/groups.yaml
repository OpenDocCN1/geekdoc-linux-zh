    ## Filesystem


    These oneliner commands are for performing filesystem level operations and functions.
    For example, finding and managing files, managing file permissions and more.


    - Find files in a specific date range, type: find . -type f -newermt "2025-01-01"
    ! -newermt "2025-12-31"

    - Delete all files in a directory that don''t match a certain file extension,
    type: rm !(\*\*.html | *****.php | *****.png\)

    - Recursively remove all empty directories in the current path, type: find . -type
    d -empty -delete

    - Display how much storage a directory is consuming (advanced), type: du -kx |
    egrep -v "\./.+/" | sort -n See the top six files that are consuming all your
    local storage space, type: du -hsx /* | sort -rh | head -6

    - Search for a file that has a specific size, type: find . -type f -size 10M

    - Change permissions on a specific set of files, type: find ***path*****to/directory/**
    -type f -exec chmod 644 {} \;

    - **Tip:** Reset directories permissions find . -type d -exec chmod 0755 {} \;

    - Perform a command on every file in directory: for x in `ls -1`; do echo $x;
    done

    - Create multiple folders under a specific path, type: mkdir -p **new_folder/**{**folder\_1,folder\_2,folder\_3,folder\_4**}

    - Copy a file in to multiple directories, type: echo ***path*****to*****directory1***
    ***path*****to/directory2/** ***path*****to/directory3/** | xargs -n 1 cp ***path*****to/file\_name.ext**

    - Count the number of files in a directory, type: ls -l /bin | grep -v ^c | wc
    -l

    - See all the files on your system (or a specific directory), type: find **/bin**
    -type f | less

    - See all the directories on your system (or a specific directory) one page at
    a time, type: find / -type d | less

    - Create a file of any size, type: dd if=/dev*/zero of=**output_file.txt** bs=1M
    count=10

    - List files that were only changed today, type: ls -al --time-style=+%D | grep
    `date +%D`

    - Display only non-blank lines (also removes comment lines) within a configuration
    file grep ''^\[^#\]'' */etc*/syslog.conf

    - To create a compressed archive (i.e. TAR file), type: tar -czvf **file_name.tar.gz**
    ***path*****to/directory/**

    - To decompress the archive, type: tar -xzvf **file_name.tar.gz**

    - Move and rename files with suffixes quickly, type: cp ***path*****to/directory/Really_Long_File_Name.cpp**{,,-old}

    - **Note:** *This command will generate a new copy of the file called:* ***pathto/directory/Really_Long_File_Name.cpp-old***

    - Use ''pushd'' and ''popd'' for treating your paths as an array, type: cd ***directory1*****directory2/directory3*;
    pushd .; cd /bin; popd

    - **Note:** *''pushd'' stores the last directory path, the ''popd'' allows you
