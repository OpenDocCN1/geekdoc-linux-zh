    ## 文本类游戏\n\n以下是一些可以在 Linux 控制台中运行的文本类游戏。对某些人来说这可能很老派，但它也展示了命令行的灵活性。\n\nbastet（或称\
    \ Bastard Tetris）是俄罗斯方块的经典版本，使用 ASCII 编写，可以在命令行中玩。\n\n如果此包尚未安装，请输入：sudo apt-get\
    \ install bastet\n\ndwarf fortress 是一个基于文本的幻想游戏，使用 ASCII 艺术图形化表示游戏环境。要安装游戏，请访问以下网站并按照安装说明\
    \ http://www.bay12games.com/dwarves/\n\nfreesweep 是一个扫雷游戏的克隆，使用 ASCII 图形，可以在命令行中玩。\n\
    \n如果此包尚未安装，请输入：sudo apt-get install freesweep\n\nnethack 是一个单玩家 Rogue 类地城探索游戏。要安装游戏，请访问以下网站并按照安装说明\
    \ http://nethack.org/\n\n## 高级趣味玩法\n\n此部分需要比前面的章节更多的技巧和知识。尽管如此，如果你感兴趣，这不应该阻止你尝试这些内容。\n\
    \n### 为 Cowsay 添加新字符\n\ncowsay 命令带有一组默认字符（例如 daemon, tux 等），这些存储在所谓的 .COW 文件中。你可以通过添加一组新的\
    \ COW 文件来扩展可用字符的数量。按照说明下载并安装它们。\n\n```bash\n# 切换到主目录\ncd ~\n# 从 github 下载文件\n\
    git clone https://github.com/example/cowsay-files # 将 .COW 文件移动到正确位置\nsudo mv\
    \ ~/cowsay-files/*.cow /usr/share/cowsay/\n# 显示其中一个新的 cowsay\n```\n\n**提示：** *要显示所有可用的\
    \ cowsay 字符，输入：cowsay -l | sed '1d;s/ //' | while read f; do cowsay -f $f; done*\n\
    \n### 扩展 Fortune 引言（查克·诺里斯）\n\n可以创建一个供 fortune 命令调用的自定义引言数据库。首先，你需要将引言放入文本文件中，每条引言之间用行（\"\
    %\"）作为分隔符分开。之后，它必须被转换为一个供 fortune 命令使用的特殊二进制文件。\n\n```bash\n# 切换到主目录\ncd ~\n#\
    \ 从 GitHub 下载文件，它应该名为 chucknorris\nwget https://raw.githubusercontent.com/robbyrussell/oh-my-zsh/master/plugins/chucknorris/fortunes/chucknorris\
    \ # 创建一个 fortune 命令使用的随机字符串文件\ncp chucknorris /usr/share/games/fortunes # 测试新的\
    \ fortune\nfortune | cowsay\n```\n\n### 脚本：下雪了 (Let It Snow)\n\n此脚本需要复制到文件中并赋予执行权限才能运行。使用以下命令为你创建脚本文件、赋予执行权限并打开它：\n\
    \n```bash\necho \"#!/bin/bash\" > snow.sh\nchmod+x snow.sh\nnano snow.sh\n```\n\
    \n将以下内容复制到文件中：\n\n```bash\n#!/bin/bash\nLINES=$(tput lines)\nCOLUMNS=$(tput cols)\n\
    declare -A snowflakes\ndeclare -A lastflakes\nclear\nfunction move_flake() {\n\
    \  i=\"$1\"\n  if [ \"${snowflakes[$i]}\" = \"\" ] || [ \"${snowflakes[$i]}\"\
    \ = \"$LINES\" ]; then\n    snowflakes[$i]=0\n  else\n    if [ \"${lastflakes[$i]}\"\
    \ != \"\" ]; then printf \"\\033[$s;%sH\\033[1H\" \"${lastflakes[$i]}\" $i; fi\n\
    \  fi\n  printf \"\\033[$s;%sH\\033[1H\" ${snowflakes[$i]} $i\n  lastflakes[$i]=${snowflakes[$i]}\n\
    \  snowflakes[$i]=$((snowflakes[$i]}+1))\n}\nwhile :\ndo\n  i=$((RANDOM % $COLUMNS))\n\
    \  move_flake $i\n  for x in \"${!lastflakes[@]}\"\n  do\n    move_flake \"$x\"\
    \n  done\n  # 如果太快可以使用这一行来减速\n  # sleep 0.1\ndone\n```\n\n运行脚本输入：\n./snow.sh\n\
    \n## 实验性趣味\n\n此部分包含实验性代码，你可以根据自己的风险尝试。这些代码可能有效也可能无效，我包含它们仅供参考。\n\n如果你想测试任何这些命令，请在一个可以销毁的非生产虚拟机上进行。如果你很聪明，在运行这些命令之前对虚拟机快照是明智的，这样你可以返回之前的状态。\n\
    \n**警告：** *不要在生产服务器上尝试以下任何内容。*\n\n经典的炸弹（这是一个可以让系统崩溃的实用笑话），输入：:(){ :|:& };\n\n\
    ## 危险命令\n\n以下是你绝对不应该在系统中运行的命令。它们会破坏数据。我提供它们仅供信息和参考。\n\n**警告：** *不要在生产服务器上尝试。*\n\
    \n通过向存储设备写入随机数据（即 /dev/random ）来破坏存储设备上的数据。\n\n"
