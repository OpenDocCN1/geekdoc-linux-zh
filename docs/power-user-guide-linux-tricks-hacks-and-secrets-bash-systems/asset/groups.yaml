    \nattack.\n\nThis chapter contains a list of suggested security tools and tips\
    \ for performing\n\ndifferent types of system security administration tasks and\
    \ diagnostics."
  - "[PAGE 235]\n\nCore Security Philosophies\n\n \n\nThere are core security philosophies\
    \ that every person in Information\n\nTechnology should follow. This section is\
    \ very high-level and may oversimplify\n\nthe subject, but be aware it is much\
    \ broader then what is covered here.\n\nThe most common type of malicious actors\
    \ (someone or group looking to steal\n\nwhat they can), are looking for easy targets\
    \ that they can compromise quickly.\n\nThese type of attacks are easier to defend\
    \ against, you mostly just need to make\n\nsure your systems are locked down and\
    \ updated.\n\nWhile the more determined malicious actors (generally going to be\
    \ nation\n\nstates), are much harder. They generally have a specific target that\
    \ they are\n\ngoing after and will use any method that they want to achieve their\
    \ end goal.\n\nThe core security philosophies listed below, are only a few of\
    \ many, but these\n\nare a good place to start: **Least Privilege**: Only grant\
    \ privileges that are needed\n\nfor a user to do their job. Don't grant admin\
    \ access to a user because it will make\n\nyour job easier.\n\n**Defense in Depth**:\
    \ Create multiple layers of security or defense. For\n\nexample, have an external\
    \ firewall to protect your perimeter, utilize the\n\nlocal firewalls on the OS,\
    \ and then encrypt all your data and\n\ncommunications.\n\n**Be Persistent**:\
    \ Malicious actors are constantly changing their attack\n\nmethods, so you have\
    \ to constantly adapt new methods to defend against\n\nthese new types of attacks.\n\
    \n \n\n**Reduce your Attack Surface:** Turn off services that are not needed,\n\
    \nchange default passwords and accounts, make sure your firewalls are\n\nconfigured\
    \ properly, *etc.*\n\n \n\nThe following security diagram is a high-level tool\
    \ to help visualize the different\n\nlayers that you need to consider protecting\
    \ against attack. It also briefly\n\ndescribes some of the considerations that\
    \ you will need to do to protect that layer"
  - "[PAGE 236]\n\n**Security Overview**\n\nLayer 8: **System Backups** (Last line\
    \ of defense, needs regular\n\ntesting) Layer 7: **Applications/Services** (i.e.\
    \ Needs patching\n\n\\[Docker, web services, database\\]) Layer 6: **User Security**\
    \ (i.e.\n\nenforce strong passwords, and rotate regularly) Layer 5: **Filesystem**\n\
    \n(i.e. Reduce file permission privileges, encrypt data) Layer 4:\n\n**Network/Firewall**\
    \ (i.e. Block unnecessary ports, encrypt\n\ncommunications) Layer 3: **Operating\
    \ System** (i.e. Needs patching)\n\nLayer 2: **Infrastructure** (i.e. Needs patching\
    \ \\[hardware,\n\nhypervisors, switches, VMs, etc.\\]) Layer 1: **Perimeter**\
    \ (i.e. Needs\n\nmonitoring \\[routers/firewall\\]) Layer 0: **Public Network**\
    \ (i.e.\n\nInternet) \\[No Protection\\]\n\n \n\nI would encourage more reading\
    \ on this subject if you have time."
  - "[PAGE 237]\n\nChecking Your System for Malware\n\n \n\nEven Linux is not immune\
    \ to malware, ClamAV is one of the most popular anti-\n\nmalware scanners available\
    \ for the OS. It is recommended that you regularly\n\nscan your system for malicious\
    \ code.\n\nThere are other anti-malware scanner options available to help protect\
    \ your\n\nsystem, but unfortunately they won’t be covered at this time.\n\n \n\
    \nTo install this scanner use one of these methods:\n\n \n\nFor Debian-based systems:\n\
    \nsudo apt-get install clamav\n\n\\-OR—\n\nOn Red Hat-based systems:\n\nsudo yum\
    \ install epel-release\n\nsudo yum install clamav\n\n \n\nTo run the scanner,\
    \ you first need to update it with the latest signatures,\n\ntype: sudo freshclam\n\
    \n \n\nTo scan a specific folder, type:\n\nsudo clamscan -r --bell -i / (*scans\
    \ from the root down*) -OR-sudo clamscan\n\n\\-r --bell -i /home (*scans ****/home****\
    \ directory*)\n\n**Tip:** *To install GUI version (X-Windows) of the client, type:*\
    \ *sudo apt-get*\n\n*install clamtk*\n\n**More information:**\n\nhttps://www.clamav.net/"
  - "[PAGE 238]\n\nLockdowning Physical Access to the System\n\n \n\nAny production\
    \ system should be in a locked environment, with physical access\n\ncontrol, backup\
    \ power and cooling. If a malicious actor has physical access to\n\nthe equipment,\
    \ they could bypass most system security features.\n\nAlthough, you can still\
    \ make it harder for them. Here are some suggestions:\n\nLockdown the firmware\
    \ (BIOS/UEFI), configure it to disable booting from an\n\noptical disk, or an\
    \ external device (such as a USB flash device). Also make sure\n\nyou enable a\
    \ firmware password.\n\n \n\n**Note:** *Refer to your computer or motherboard\
    \ manufacture’s web*\n\n*site for instructions on how to perform these actions.*\n\
    \n \n\nEnable GRUB with a password to help restrict access to the local\n\nfilesystem.\
    \ Encrypt the local filesystem, file permissions, data in\n\ndatabases, *etc.*\n\
    \n \n\nEncrypt all network communications. This will make it harder for a\n\n\
    malicious actor from sniffing your data while it is in transit Don't use root\n\
    \naccount names, like root, admin, or administrator. Get creative with the\n\n\
    username.\n\n \n\nMake sure to use strong passwords for all accounts, and change\
    \ them on a\n\nregular basis."
  - "[PAGE 239]\n\nPartitioning Your Data\n\n \n\nWhen creating a new system, it is\
    \ important to setup multiple partitions to hold\n\ndata, this can help prevent\
    \ data corruption, and some types of system resource\n\nexhaustion attacks.\n\n\
    For example, if the swap area and logs are not each on their own partition. If\
    \ an\n\nattacker tries to fill them up with some type of attack (i.e. DDoS), it\
    \ could force\n\nthe system to shut down or fail.\n\n \n\n**Note:** *Third party\
    \ applications should be installed on separate filesystems*\n\n*and partitions\
    \ under the /opt* *directory.*"
- md: '

    ## Removing Unused Software


    Removing or disabling any applications, services, or packages that you''re not
    using can help protect your computer. By doing so, you reduce the attack target
    a malicious person can utilize to take over your system.


    By removing this software it also has a side benefit of freeing up space, CPU
    and other system resources that would be wasted by this application.


    Next are some commands that can help you find and remove things that you no longer
    need.


    - List all available packages, type: `sudo apt-cache pkgnames`

    - Get a brief description of a package name, type: `sudo apt-cache search **package_name**`

    - Get detailed information about a package, type: `sudo apt-cache show **package_name**`

    - Check the dependencies for particular software package, type: `sudo apt-cache
    showpkg **package_name**`

    - Check the software package cache statistics, type: `sudo apt-cache stats`

    - Uninstall software packages (keeps configuration files, for reinstall), type:
    `sudo apt-get remove **package_name**`

    - Completely Uninstall software packages (deletes configuration files), type:
    `sudo apt-get purge **package_name**`


    ## Monitoring Connections


    Your computer can have tens or hundreds of connections going on at one time. Sometimes
    you can identify an attacker by noticing a strange connection from an odd port
    or service.


    To check the connections to the computer, type: `netstat -tulpn`


    - Displays all TCP sockets: `# ss -t -a`


    **Note:** *There are many more examples of the netstat and ss commands throughout
    the book, these are only provided as reference.*


    ## User Account Restrictions


    ### Manually Disabling an Account


    There is an ability to manually disable (i.e. lock) or re-enable (i.e. unlock)
    an account without having to delete it. This is useful when a user leaves for
    a vacation or something else, you can disable it instead of deleting it.


    If someone tries to login to the disabled account, they will get the following
    message, "*This account is currently not available.*"


    To lock an account, type: `sudo passwd -l **user_name**`

    To unlock an account, type: `sudo passwd -u **user_name**`


    ### Stronger Password Enforcement


    Users by default will use a weak password for their account if the system will
    let them. This makes it easier for an attacker to compromise your system, using
    basic attacks (i.e. dictionary based or brute-force attacks).


    The ‘pam_cracklib‘ module is available in PAM (Pluggable Authentication Modules)
    that will force a user to utilize a strong passwords.


    To implement this technology, follow the instruction below Open a text editor,
    type: `sudo nano /etc/pam.d/system-auth`


    Add the following line using any of the following parameters, such as: lcredit,
    ucredit, dcredit and/or ocredit respectively lowercase, upper-case, digit and
    others). For example, type: `lib_security/$ISA/pam_cracklib.so retry=3 minlen=8
    lcredit=-1 ucredit=-2 dcredit=-2 ocredit=-1`


    ### Locking Down the User Accounts


    Disallow users from using old passwords, using the PAM module.


    RHEL CentOS Fedora, type: `sudo nano /etc/pam.d/system-auth`

    OR—

    Ubuntu Debian Linux Mint, type: `sudo nano /etc/pam.d/common-password`


    Add the following line to **auth** section, type: `auth sufficient pam_unix.so
    likeauth nullok` Add the next line to the **password** section (this will disallow
    a user from reusing the last 5 passwords), type: `password sufficient pam_unix.so
    nullok use_authtok md5 shadow remember=5`


    **Note:** *The old password file is located at: /etc/security/opasswd*


    ### Manage User Password Expiration


    In Linux, user passwords are stored in an encrypted /etc/shadow file. To display
    a user’s password expiration information, you need to use the chage command. It
    will display the password expiration details, and last date the password was change.
    Type: `chage -l username`


    To change password aging options for any user, use the following command, type:
    `sudo chage -M 90 user_name`

    OR—`chage -M 90 -m 7 -W 5 user_name`


    ## Disabling X-Windows


    If you’re running X-Windows on a production machine, it should be removed. X-Windows
    adds extra overhead to the system that is not needed, consumes extra resources
    (i.e. RAM, CPU, storage), and overall can make the system less secure.


    To disable GDM, the GNOME Display Manager, type: `sudo update-rc.d -f gdm remove`


    **Note:** *To enable the GDM again, type: sudo update-rc.d -f gdm defaults**


    ## Locking Down SSH


    Make sure to lock down ssh (Secure Shell) configuration used for remote management.
    Otherwise an attacker can utilize this service to their advantage for taking over
    a system remotely.


    To lock it down you have to open the main ssh configuration file, verify, add
    or change the following items:

    - Disable root: `PermitRootLogin no`

    - Only allow specific users: `AllowUsers **user_name**`

    - Protocol: `Protocol 2`


    **Note:** *There are two ways to display a message. First, there is the /etc/issue
    file that displays message before login. Second, is the /etc/motd file that displays
    message after the user has logged in.*


    To implement this, open the /etc/ssh/sshd_config file, then search for the word
    "Banner". Update the line to look like: `Banner /etc/issue`


    Restart the ssh process, type: `sudo /etc/init.d/sshd restart`


    ## Disabling Ctrl+Alt


    In most distros, pressing the Ctrl+Alt keys will cause the system to be rebooted.
    This might not be desired functionality, the following instructions discuss how
    to change this.


    Red Hat based: To disable this feature, in the /etc/inittab file, uncomment out
    the line `::shutdown -t -r now`

    Debian based: To disable this feature, run the following commands: `sudo systemctl
    mask ctrlalt.target; systemctl daemon-reload`


    ## Monitoring Accounts for Empty Passwords


    There is an easy way to check if any accounts have an empty password, these types
    of accounts are a large security risk. These accounts could allow unauthorized
    user access to your system by just pressing the Enter key, and they make your
    system more vulnerable to attack.


    To check if any accounts have an empty password, type: `sudo cat /etc/shadow |
    awk -F: ''($2==""){print $1}''`


    ## Keeping Your System Up-Date


    It is critical to keep your system and applications up-to-date, depending on the
    distro will vary which set of commands that you need to use. This has been covered
    before in the book, it is covered again to prevent having to find the information
    in previous sections.


    - Debian based: `sudo apt-get update; apt-get upgrade`

    - Red Hat based: `sudo yum updates; yum check-update`


    ## HardeningNTAB


    If your system is utilizing CRON jobs, it is important to lock the access to them
    down. The CRON service allows you to specify who may or who may not want to allow
    to run jobs.


    This service is controlled by the use of two files called /etc/cron.allow and
    /etc/cron.deny.


    To prevent a user from being allowed to utilize the CRON service, simply add the
    user names in the /etc/cron.deny file.


    To disable all users from being able to use the CRON service, add the keyword
    ‘ALL‘ line to the /etc/cron.deny file, type: `sudo echo ALL >> /etc/cron.deny`


    To allow a user to run a CRON job add them into /etc/cron.allow file.


    **Note:** *It is important to lock down script permissions so that a malicious
    user can’t replace it and do a privilege elevation attack. This is where they
    replace a script that runs with a higher level access account to execute a specific
    action to raise their system permissions.*

