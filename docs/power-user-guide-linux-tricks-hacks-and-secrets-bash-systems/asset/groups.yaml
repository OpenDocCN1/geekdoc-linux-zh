    ## Miscellaneous commands


    These are some miscellaneous commands, for performing various functions in the
    program. You have to be in the command mode to use these features. For example,
    press the ESC key and then type u to undo last change.


    - ~ Toggle UPPER/lower case.

    - . Repeat last text-changing command

    - J Join lines nJ Joins the next (n) lines together; Omitting (n) joins the beginning
    of the next line to the end of the current line.

    - u Undo last change.

    - U Undo all changes to line.

    - ; Repeats last f F t or T search command.


    ## Shell Functions


    These are some shell commands, for bringing data in from other programs and being
    able to manage it in the text editor. You have to be in the command mode to use
    these features. For example, press the ESC key and then type !! **ps -aux** executes
    a shell command, and places the command output at the current line.


    - :! **cmd** Executes shell command


    **Note:** *Add these special characters to indicate: % name of current file# name
    of last file edited.*


    - !! **cmd** Executes shell command, and places the command output at the current
    line

    - :!! Executes last shell command

    - :r! **cmd** Inserts the output from command

    - :f **file** Renames current file

    - :w !**cmd** Sends currently edited file to command as STDIN and executes it.


    - :cd **dir** Changes current working directory.

    - :sh Starts a sub-shell (CTRL+D returns to editor)

    - :so **file** Reads and executes commands in file (file is a shell script)

    - !}sort Sorts from current position to end of paragraph and replaces text.


    ## Settings commands


    The following commands allow you to configure vi(m) settings. These commands allow
    you to enable and disable features within vi(m), or change how they work.


    You have to be in the command mode to use these features. For example, press the
    ESC key and then type set all to display all the set options on the screen.


    The list below is not complete, but it does provide some examples of some of the
    things that you can do with these features.


    - :set all Displays all options to the screen.

    - :set ai Turns on auto indentation. (default: noai)

    - :set list Shows tabs (^l) and end of line ($). (default: nolist)

    - :set nu Shows line numbers. (default: nonu)

    - :set sm Show matching { or ( as ) or } is typed. (default: nosm)

    - :set wm=n Sets automatic wraparound (n) spaces from right margin. (default:
    wm = 0)


    **Note:** *The SET commands can be put into .exrc file to automatic configure
    settings at VI startup.*


    ## Linux One-Liners


    **Overview:** This chapter contains an intermediate set of commands/one-liners.
    The commands in this chapter are more advanced than the ones in the previous ones.
    They can perform lower level functions or require more knowledge to utilize them.


    This chapter also introduces the concept of command one-liners, which come in
    very handy for more advanced application, system and device operations.


    ***Note:*** *Some commands and utilities might not be part of your default distro,
    and these applications may have to be installed in order to utilize them.*


    ## Commands and Functions


    BASH allows you to group similar commands together into one line using a special
    separators. Some of these will run the commands in order, and others will have
    different results if one command fails or succeeds. It all depends on the separator
    that is used.


    The examples below, show commands can be executed using different types of separators
    to control the order in which they are executed.


    - Run multiple commands in a single line (separate with '';'' semicolon), example:
    command_1; command_2; command_3

    - Only run the next command if the first command is successful, example: command_1
    && command_2

    - Only run the next command if the first command fails, example: command_1 ||
    command_2

    - To automatically answer a prompt, pipe in the response. For example (send the
    letter ''y'' into a command or script): y | some_command


    It is easy to create custom commands by grouping together other commands inside
    a function. To call the function all you have to do is type its name and pass
    arguments in to it.


    In the examples below, create the function by typing the first line, then type
    the function name to execute it (i.e. red, green, or blue) and type the text you
    want to display.


    **Notes:** *These functions can be placed into a script, and utilized from the
    command line as well. These functions will only exists as long as the shell is
    active and in memory, unless it is added it the ~/.bashrc file.*


    - function blue() { echo -e "\033[34m$@\033[0m"; }

    - function green() { echo -e "\033[32m$@\033[0m"; }

    - function red() { echo -e "\033[31m$@\033[0m"; }


    ## One-Liners


    One-liners are a useful composite of commands, arguments, and values that combined
    multiple operations into one line. These one-liners can be used in day-to-day
    operations to perform specific tasks or added to scripts.


    **Remember:** *Linux commands are generally designed to do well (core philosophy).
    This means that you will usually not see command designed to do several functions,
    but will have lots of options related to what it was designed.*


    ## System commands


    - for i in {1..10}; do tr -cd ''[:alnum:]'' < /dev/urandom | fold -w20 | head
    -n1; done


    - Define a simple calculator function, type: ? { echo "$*" | bc -l; } Example:
    ? "4+5" (When you type ''?'' it will pass the equation into the function) Puts
    the system time in top right corner of the terminal window, type: while sleep
    1;do tput sc;tput cup 0 ($(tput cols));date;tput rc;done Displays system information
    and the current time in top right corner of the terminal window, type: while true;
    do tput sc;tput cup 0 ($(tput cols));w | grep load; tput rc; sleep 10; done


    - Create an alias to a command, type: alias ai=''sudo apt-get install'' OR alias
    au=''sudo-get update''


    **Notes:** *To execute these aliases to install the new package, type: ai package_name.
    To execute the second alias to update the package, type: au. To delete any alias,
    type: unalias alias_name*


    **Tip:** *To see all aliases that have been setup in the terminal, type: alias*


    To see all processes that are run by you, type: ps -aux | grep -v `whoami`

