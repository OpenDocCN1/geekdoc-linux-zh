    ## Creating your first script file


    There are a few basic steps that are required to setup a script and execute it.
    If you don’t follow these basic steps your script will not run properly.


    In the example below, you first have to create a basic file that will hold the
    initial sets of commands. Once the file is created, you can then modify it in
    any way that you would like.


    To create the script, type:

    nano ~/script_file.sh Add the following commands to the script, type: #!/bin/bash


    ls -al /


    (To save the file and exit the editor, press **Ctrl+X**, type: **y** and press
    Enter) You should note the first line of the script (i.e. #!/bin/bash), this is
    an important line because it tells the shell which interpreter to use to process
    the script. In this example, it tells the shell the commands to follow are going
    to be Bash.


    After the file is created you have to grant it execute permissions so the OS knows
    that it has authorization to run the script.


    Change the user file permission to execute, type: chmod u+x ~/script_file.sh After
    you grant execute permissions, you then instruct the shell to execute the code
    by typing the file name of the script that you want to run.


    To run the script, type:

    ./script_file.sh All the examples that you have learned in the previous chapters
    can be integrated into scripts. There are some topics that will have to be briefly
    covered in this chapter to help you get started.


    ## Commenting your code


    To comment your code, you have to use the # (pound sign or hash) in front of your
    notes or comments.


    Example:

    # This is a test


    ## Variables


    One of the first things that we need to cover is how to deal with variables. They
    were briefly talked about in the other chapters, but they will be cover in slightly
    more depth here.


    The variable functionality provides a way for the script to get input, store data
    temporarily, and display output to the user or sending data to a calling script.
    There are two categories that variables can be divided into: **Environment Variables:**
    are maintained by the system, they are inherited by the current and any child
    shells or processes that are spawned.


    **Shell Variables:** are contained exclusively within the shell in which they
    were set or defined. They are mostly used to keep track of temporal data, like
    the current working directory in a session.


    ### Shell Variables


    There are generally two types of shell variables. Those that are maintained by
    the system, and the others that are user defined for scripts or passing information
    into other commands, scripts or programs.


    As stated earlier, the values in the shell variables can be user defined. Meaning
    that the user is responsible for updating these values.


    **Note:** *Variable names are case sensitive, so test, Test, TEST are three different
    variables.*


    **Examples:**

    To create a custom variable, type:

    test=HelloWorld To display the contents of a custom variable, type: echo $test


    To clear out (or undefine it) a shell variable, type: unset shell_variable_name


    **Notes:** *To see all the shell variables, type: set | less.*


    *To demote an environment variable to a shell variable, type: export -n env_variable_name*


    **Tip:** *You can assign the STDOUT of a command and its arguments to a variable
    then perform another operation with the information, for example: x=$(cmd a1 a2
    a3) To see the contents of variable x, type: echo $x For more information on command
    substitution (i.e. $() ), see the following section "Advanced: Using command Substitution"*


    The next table is a list of the commonly used shell variables in Linux. Depending
    on your distro and version some of these variable may or may not exist.


    | Shell Variable | Variable Description | Viewing Variable |

    | :--- | :--- | :--- |

    | _ (underscore) | The most recent used previously executed command. | echo $_
    |

    | HOME | Stores the home directory of the current user. | echo $HOME |

    | LANG | The current language and localization settings, including character encoding.
    | echo $LANG |

    | LS_COLORS | Defines the color codes that are used to add colored output to the
    ls command. | echo $LS_COLORS |

    | OLDPWD | Displays the previous working directory path. | echo $OLDPWD |

    | PPID | The process ID of the parent process of the shell. | echo $PPID |

    | PWD | Displays the current working directory path. | echo $PWD |

    | SHELL | Displays which login shell is being utilized. | echo $SHELL |

    | TERM | Displays the terminal emulation type. | echo $TERM |

    | USER | Displays the logged in user name. | echo $USER |


    ## Environmental Variables


    There are also two types of environment variables. Those that are maintained by
    the system, and the others that are user defined for scripts or passing information
    into other commands, scripts or programs.


    As stated earlier, the values in the environment variables are maintained by the
    system and are configured at startup by a configuration file. Meaning that the
    system will automatically create and update these variables.


    **Examples:**

    To create or modify an environment variable, type: export TEST=HelloWorld To display
    the contents of environment variable, type: echo $TEST


    **Note:** *To see all the system maintained environmental variables, type: env
    | less. These are only system variables.*


    **Tip:** *The printenv command is an equivalent of env to display values of all
    variables.*


    The next table is a list of the commonly used environmental variables in Linux.
    Depending on your distro and version some of these variable may or may not exist.


    | Environment Variables | Variable Description | Viewing Variable |

    | :--- | :--- | :--- |

    | BASH_VERSINFO | Stores the version of BASH for this instance (machine readable)
    | echo $BASH_VERSINFO |

    | BASH_VERSION | Stores the version of BASH for this instance | echo $BASH_VERSION
    |

    | BASHOPTS | The list of options that were used when BASH was started. | echo
    $BASHOPTS |

    | CDPATH | The search path used with the cd builtin command. | echo $CDPATH |

    | COLUMNS | The number of characters wide that output can be written on the screen.
    | echo $COLUMNS |

    | DIRSTACK | The stack of directories that are available with pushd and popd commands.
    | echo $DIRSTACK |

    | HISTFILE | Stores the name of command history file. | echo $HISTFILE |

    | HISTFILESIZE | Stores the maximum number of lines that can be held by the history
    file. | echo $HISTFILESIZE |

    | HISTSIZE | Stores the maximum number of commands that can be held by the history
    in memory. | echo $HISTSIZE |

    | HOSTNAME | Stores the system name of the computer. | echo $HOSTNAME |

    | IFS | Input Field Separators. This is normally set to space ⟩, tab ⟩, and newline
    ⟩. | echo $IFS |

    | MAIL | The name of a mail file that''s checked for new mail. | echo $MAIL |

    | MAILCHECK | How frequently in seconds that the shell checks for new mail in
    the files specified by MAILPATH or MAIL file. | echo $MAILCHECK |

    | MAILPATH | A colon ":" separated list of file names, for the shell to check
    for incoming mail. (Note: This environment setting overrides the MAIL setting.
    There is a maximum of 10 mailboxes that can be monitored at once.) | echo $MAILPATH
    |

    | PATH | The search path for commands. | echo $PATH |

    | PS1 | The shell prompt settings. (Note: The PS2 variable is used to declare
    secondary prompt when a command spans multiple lines.) | echo $PS1 |

    | PS2 | The secondary prompt string, which defaults to "> ". | echo $PS2 |

    | PS4 | Output before each line when execution trace (set -x) is enabled, defaults
    to “+ ”. | echo $PS4 |

    '
