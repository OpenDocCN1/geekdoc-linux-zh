    \ has access to this file.\n\n \n\nTo see all the users in the sudo group, type:\
    \ awk -F':' '*sudo*{print $4}'\n\n*etc*group There is a command called, visudo\
    \ that allows you edits the\n\nsudoers file. It also checks the syntax of the\
    \ file to ensure you are not\n\nlocked out due to a corrupted sudoers file. To\
    \ execute this command,\n\ntype: sudo visudo\n\n \n\n**Tip:** *To add a user to\
    \ the end of a etcsudoers file, type:* *sudo echo*\n\n*'****user\\_name ****ALL=(ALL:ALL)\
    \ ALL' >> etcsudoers*"
  - '[PAGE 156]


