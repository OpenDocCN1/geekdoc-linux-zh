    ## Package Management


    One of the many ways to install new or remove old programs, including updating
    them, is by utilizing the package manager that comes with your Distro. The package
    manager takes care of finding and downloading all the necessary libraries and
    removing the dependencies that are no longer needed. It then installs the program
    on the local system.


    There are three very popular package managers, but only two are covered in this
    book: apt : Debian family package management utility, and utilizes the DPKG (Debian
    Package) files.


    **Note:** *The apt utility is intended as a simplified version of the traditional
    apt-get tools. Although, it is not intended as a complete replacement of these
    programs. So, if you are using package management commands inside a script or
    a shell pipeline, use the apt-get and apt-cache .*


    - yum : Fedora family package management utility, and utilizes the RPM files.

    - zipper : SUSE family package management utility, and utilizes the RPM (Red Hat
    Package Manager) files.


    ### Basic management commands


    Displays a list of all packages installed on your system, type: dpkg -l


    **Tip:** *For Fedora systems, type : sudo yum list installed*


    To search for a specific package that in apt cache, type : sudo apt-cache search
    **zip** To get detailed information for a specific package that in apt cache,
    type : sudo apt-cache show **zip**


    **Note:** *Red Hat equivalent to these commands, type: sudo yum search **zip**
    sudo yum info **zip***


    ## Updating the System


    apt (Advanced Package Tool) and yum (Yellow dog Updater Modified) are command
    line utilities for interacting with the package management systems. apt sits on
    top of the dpkg subsystem. While, yum sits on top of the RPM subsystem. Both the
    apt and yum utilities provide a more friendly way to handle packaging subsystems.
    They allow you to find and install new packages, upgrade existing packages, clean
    up the package cache, *etc.*


    - apt-get : Debian family of package managers, based on DPKG files

    - apt-get update : Updates the repository information.

    - apt-get upgrade : Downloads and install applications/library updates.

    - apt-get dist-upgrade : Downloads and upgrades the distribution.


    - yum : Fedora family of package managers, based on RPM files

    - yum update : Updates the repository information.

    - yum upgrade : Downloads and install applications/library updates.


    ### Cleaning Up the Local Storage Space


    Occasionally you will have to free up local storage space on your Linux machine.
    Before you randomly start to delete stuff, there are a few commands you can try
    to free up local storage space.


    - Updates the package cache and check broken for dependencies, type: sudo apt-get
    check

    - Cleans the APT cache (clears entire cache), type: sudo apt-get clean

    - Cleans the APT cache (clears outdated packages), type: sudo apt-get autoclean


    ***Note:*** *Try keeping your system up-to-date with the package manager regularly,
    Linux will regularly try to free up space when this process is run.*


    ***Tip:*** *To see the size of the APT cache, type: sudo du -sh var/cache/apt*


    - Remove all the thumbnails files that are created when viewing files in the file
    manager, type: rm -rf ~/.cache/thumbnails/*


    ***Tip:*** *To see the size of thumbnail files, type: du -sh ~/.cache/thumbnails*


    - To purge old system kernels that where left behind after a distro upgrade, type:
    sudo apt-get autoremove --purge -OR sudo apt-get remove linux-image-KERNEL_VERSION


    **Note:** *Replace KERNEL_VERSION with the version of the kernel that needs to
    be removed.*


    **Tip:** *To list all installed Linux kernels, type: sudo dpkg --list ''linux-image\*


    - Uninstall programs that you no longer need, type: sudo apt-get remove package_name_1
    package_name_2


    ### Cleaning Orphaned Packages


    Let''s say you installed a package called some_program, and it had a dependency
    library called some_lib. This library will generally be automatically downloaded
    when some_program is installed. When some_program, is removed the uninstall procedure
    that removed it could have left some_lib installed in the system. Thus the some_lib
    now becomes an orphaned package because there are no programs that have a dependency
    on it in order to be run.


    To remove packages and dependencies that are no longer required, type: sudo apt-get
    autoremove


    Another GUI utility called gtkorphan can be used to remove orphaned packages.
    If this package is not already installed, type: sudo apt-get install gtkorphan


    **Note:** *This is a GUI app, and requires X-Windows.*


    ## Hardware Information


    The tools listed below can display technical information about the (physical or
    virtual) hardware attached to your local system. This can be very useful if you
    need to write script that tells the user about the peripherals that are available
    to the OS.


    - See technical information about the CPU, type: lscpu

    - Display information about your computer, type: lshw

    - List all devices the Abstraction Layer (HAL) knows about: lhal

    - See all devices on USB bus, type: lsusb

    - See all devices connected to the PCI bus, type: lspci

    - Display information about block devices: lsblk


    ### Battery Status and Temperature


    - upower : Provides an interface to enumerate power sources and control system-wide
    upower -i. If this package is not already installed, type: sudo apt-get install
    upower -OR yum install upower

    - acpi : Shows ACPI information (such as battery): acpi -V. If this package is
    not already installed, type: sudo apt-get install acpitool -OR yum install acpitool


    **Note:** *There is an older deprecated method (before kernel 2.6) for checking
    ACPI, it was using the proc/acpi/ directory.*


    **Tip:** *There is a GUI (X-Windows) utility called gnome-power-statistics (aka
    Statistics). It visualizes the user power consumption on mobile devices such as
    laptops, etc.*


    ## Linux Diagnostics Tools


    The following tools provide a brief overview of some of the tools you can use
    to help check your system. These tools can help you isolate different types of
    problems with the hardware, OS, and filesystem.


    - Use the following command to check if your keyboard is working properly, or
    to display an ASCII code for a pressed key, type: showkey -a


    **Note:** *Press Ctrl+D to stop the program from running.*


    - Force a filesystem check on the next boot of the computer, type: sudo touch
    /forcefsck

    - Display if there is any unwritten data waiting to be written to disk, type:
    grep ^Dirty /proc/meminfo


    **Note:** *This is useful to know if you have to reset your system, but you still
    have enough control to get this information. This would tell you if you might
    have some data loss.*


    ### Stress Test the CPU


    If you want to put a heavy CPU load on all the cores of the processor, the following
    oneline can help. You will have to expand it for your system depending on how
    many cores it has. Just repeat the command in the curly brackets as many times
    for the number of threads you want to produce (the default is 4 threads), type:
    fullload() { dd if=/dev/zero of=/dev/null | dd if=/dev/zero of=/dev/null | dd
    if=/dev/zero of=/dev/null | dd if=/dev/zero of=/dev/null & }; fullload; read;
    killall dd To stop it, just press the Enter key (make sure no other user is running
    DD on the system or it will get killed as well).

