- md: "\n## Installing PHP\n\n**Overview:** This section provides instructions on\
    \ how to install the PHP engine.\n\nPHP is a server side scripting language utilized\
    \ to generate files (mostly web pages) to respond to HTTP requests from clients\
    \ or remote systems.\n\nThe PHP language is designed for Web development, but\
    \ also can be used as a general-purpose programming language. PHP originally stood\
    \ for Personal Home Page, but it now stands for the recursive acronym PHP: Hypertext\
    \ Preprocessor.\n\n**Prerequisites:** *This section assumes that the Apache and\
    \ MySQL services are working and configured properly. This includes that you have\
    \ root permissions on the system to install the PHP engine.*\n\nInstall the PHP\
    \ engine and the additional helper packages that are needed for accessing the\
    \ Apache and MySQL services, type: `sudo apt-get install php libapache2-mod-php\
    \ php-mysql` \n\nModify Apache to accept index.php file, type: `sudo nano /etc/apache2/mods-enabled/dir.conf`.\
    \ In nano on the line below (i.e. DirectoryIndex), move the PHP index file (i.e.\
    \ index.php) to the first position: \n\n```apache\n<IfModule mod_dir.c>\n    DirectoryIndex\
    \ index.php ...\n</IfModule>\n```\n\n(To save the file and exit the editor, press\
    \ **Ctrl+X**, type: **y** and press Enter)\n\nThen restart the Apache service,\
    \ type:\n`sudo systemctl restart apache2`\n\nTo check the status of the service,\
    \ type:\n`sudo systemctl status apache2`\n\n## Testing the PHP Installation\n\n\
    To make sure the PHP engine is working properly. Use the following commands to\
    \ create a file called info.php in the web root `/var/www/html/`, type: `echo\
    \ \"<?php phpinfo(); ?>\" > /var/www/html/info.php`. To test the page, and see\
    \ if PHP is installed correctly. In a browser type: `http://domain_name_or_ip/info.php`.\
    \ If everything is working properly a page will displays with a great deal of\
    \ information about the OS and related subsystems.\n\nTo delete this file, type:\n\
    `sudo rm /var/www/html/info.php`\n\n**Additional Resources:**\nTo help manage\
    \ your MySQL databases from the web browser, check out PHPMyAdmin.\nTo add a free\
    \ TLS/SSL certificate, check out Let's Encrypt.\n\n## Installing PHPMyAdmin\n\n\
    **Overview:** This section provides instructions on how to install the PHPMyAdmin\
    \ web app. This tool allows you to manage your MySQL databases using a browser\
    \ through a web user interface (WUI).\n\nWith the popularity and power of the\
    \ phpMyAdmin tool, it makes it a target by Internet attackers. I would never recommend\
    \ running this web app on a production system. If you do have to run it, make\
    \ sure it has been locked down and regularly patched. It is also highly recommended\
    \ that you encrypt all communications with this tool using SSL.\n\n**Prerequisites:**\
    \ *This section assumes that your Apache, MySQL, and PHP are working and configured\
    \ properly. This includes your firewall settings, and that you have root permissions\
    \ on the system.*\n\nTo install the phpMyAdmin web app, type:\n`sudo apt-get install\
    \ phpmyadmin php-mbstring php-gettext`\n\n**Notes:** *For server selection, choose\
    \ \"apache2\", then select \"Yes\" when asked to use dbconfig-common to set up\
    \ the database. Then you will be asked to choose and confirm a MySQL application\
    \ password for phpMyAdmin. The installation process adds the phpMyAdmin Apache\
    \ configuration file into the /etc/apache2/conf-enabled/.*\n\nTo explicitly enable\
    \ the mbstring PHP extension, type: `sudo phpenmod mbstring`\n\nRestart Apache\
    \ to recognize the changes, type: `sudo systemctl restart apache2`\n\n**Note:**\
    \ *phpMyAdmin automatically creates a database in MySQL called phpmyadmin.*\n\n\
    To login with your root MySQL user, you need to switch the authentication method\
    \ from AUTH_SOCKET to MYSQL_NATIVE_PASSWORD, type: `sudo mysql`\n\nTo display\
    \ the current authentication method configuration that is being used by MySQL,\
    \ from the mysql> prompt, type: `SELECT user,authentication_string,plugin,host\
    \ FROM mysql.user;`.  To alter the authentication method configuration to use\
    \ mysql_native_password, from the mysql> prompt, type: `ALTER USER 'root'@'localhost'\
    \ IDENTIFIED WITH mysql_native_password BY 'password';`\n\n**Note:** *Make sure\
    \ to change 'password' to a strong password.*\n\nTo put the configuration changes\
    \ into effect, from the mysql> prompt, type: `FLUSH PRIVILEGES;`\n\nTo make sure\
    \ the new configuration changes have been implemented in the system, from the\
    \ mysql> prompt, type: `SELECT user,authentication_string,plugin,host FROM mysql.user;`.\
    \ From the mysql> prompt, type: `exit`\n\nTo access the PHPMyAdmin web interface,\
    \ the machines domain name or public IP address, in a browser type: `https://domain_name_or_ip/phpmyadmin`\n\
    \n**Note:** *When password authentication is enabled, you will need to login using\
    \ a different command. To login with the traditional method, type:* *mysql -u\
    \ root -p*\n\nTo create a unique user rather than using the root user, modify\
    \ the steps about with the following commands. From the mysql> prompt, type: `CREATE\
    \ USER 'new_user'@'localhost' IDENTIFIED BY 'password';`\n\n**Note:** *Change\
    \ 'new_user' to whatever you want, and 'password' be a strong password.*\n\nThis\
    \ command grants the new user appropriate privileges; \n\n## Securing the phpMyAdmin\n\
    \n**Overview:** This section is a practical introduction to the .htaccess file.\
    \ The .htaccess file allows you to override the default Apache settings, by applying\
    \ instructions even if you don't need to utilize this feature.\n\n**Prerequisites:**\
    \ *This section assumes that your Apache, MySQL, and PHP are working and configured\
    \ properly. This includes your firewall settings, and that you have root permissions\
    \ on the system.*\n\nYou need to enable the use of .htaccess file to do this by\
    \ modifying the /etc/apache2/conf-available/phpmyadmin.conf file.\n\nAdd the following\
    \ line ' AllowOverride ' in the following section:\n\n```apache\n<Directory /usr/share/phpmyadmin>\n\
    AllowOverride All\n</Directory>\n```\n\n(To save the file and exit the editor,\
    \ press **Ctrl+X**, type: **y** and press Enter)\n\nRestart the Apache service,\
    \ type:\n`sudo systemctl restart apache2`\n\nTo apply the security permissions\
    \ you need to create .htaccess file, type: `sudo nano /usr/share/phpmyadmin/.htaccess`\n\
    \n**Note:** *Within the file, type the following information: (it is okay to leave\
    \ out comments, I am only providing them for clarity.*\n\n```apache\n# specifies\
    \ the authentication type being implemented (i.e. password file)\nAuthType Basic\n\
    \n# Specifies message for the authentication dialog box.\n# Suggestion: keep messaging\
    \ generic, for security reasons.\nAuthName \"Restricted Files\"\n\n# specifies\
    \ the location of the password file used for authentication\n# Suggestion: store\
    \ this file outside of the directories that are being served by the web service.\n\
    AuthUserFile /etc/phpmyadmin/.htpasswd\n\n# specifies only authenticated users\
    \ should be granted access to the resource.\nRequire valid-user\n```\n\n(To save\
    \ the file and exit the editor, press **Ctrl+X**, type: **y** and press Enter)\n\
    \nTo create the password file, you will be prompted to enter a password, type:\
    \ `sudo htpasswd -c /etc/phpmyadmin/.htpasswd user_name`. To create additional\
    \ users, do this without using the -c flag, type: `sudo htpasswd /etc/phpmyadmin/.htpasswd\
    \ new_user_name`. When you access the PHPMyAdmin interface, you will be prompted\
    \ for an additional user account name and password that was created, type:\n\n\
    https://domain_name_or_ip/phpmyadmin\n"
  mdcn: "\n\n## 安装 PHP\n\n**概述：** 本节提供了如何安装 PHP 引擎的说明。\n\nPHP 是一种服务器端脚本语言，用于生成文件（主要是\
    \ Web 页面）以响应来自客户端或远程系统的 HTTP 请求。\n\nPHP 语言专为 Web 开发设计，但用作通用编程语言。PHP 原本代表 Personal\
    \ Home Page（个人主页），但现在代表的是递归缩写 PHP：Hypertext Preprocessor（超文本预处理器）。\n\n**前提条件：**\
    \ *本节假设 Apache 和 MySQL 服务已正常运行并配置妥。这包括你拥有系统上的 root 权限来安装 PHP 引擎。*\n\n安装 PHP 引擎以及访问\
    \ Apache 和 MySQL 服务所需的额外辅助包，输入：`sudo apt-get install php libapache2-mod-php php-mysql`\n\
    \n修改 Apache 以接受 index.php 文件，输入：`sudo nano /etc/apache2/mods-enabled/dir.conf`。在\
    \ nano 编辑器中，找到下方（即 DirectoryIndex），将 PHP 索引文件（即 index.php）移动到第一位置：\n\n```apache\n\
    <IfModule mod_dir.c>\n    DirectoryIndex index.php ...\n</IfModule>\n```\n\n（要保存文件并退出编辑器，按\
    \ **Ctrl+X**，输入 **y** 并按回车键）\n\n然后重启 Apache 服务，输入：\n`sudo systemctl restart apache2`\n\
    \n检查服务状态，输入：\n`sudo systemctl status apache2`\n\n## 测试 PHP 安装\n\n为了确保 PHP 引擎正常工作。使用以下命令在\
    \ Web 根目录 `/var/www/html/` 中创建一个名为 info.php 文件，输入：`echo \"<?php phpinfo(); ?>\"\
    \ > /var/www/html/info.php`。测试该页面以检查 PHP 是否安装正确。在浏览器中输入：`http://domain_name_or_ip/info.php`。如果一切运行正常，页面将显示大量关于操作系统和相关子系统的信息。\n\
    \n要删除此文件，输入：\n`sudo rm /var/www/html/info.php`\n\n**其他资源：**\n为了帮助从浏览器管理你的 MySQL\
    \ 数据库，请查看 PHPMyAdmin。\n要添加免费的 TLS/SSL 证书，请查看 Let's Encrypt。\n\n## 安装 PHPMyAdmin\n\
    \n**概述：** 本节提供了如何安装 PHPMyAdmin Web 应用程序的说明。该工具允许你通过 Web 用户界面 (WUI) 使用浏览器管理你的 MySQL\
    \ 数据库。\n\n由于 phpMyAdmin 工具的流行和强大功能，使其成为了互联网攻击者的目标。我绝不建议在生产系统中运行此 Web 应用程序。如果你必须运行它，请确保它已经锁定并定期进行补丁更新。强烈建议使用\
    \ SSL 加密与该工具的所有通信。\n\n**前提条件：** *本节假设你的 Apache、MySQL 和 PHP 已正常运行并配置妥。这包括你的防火墙设置，以及你拥有系统上的\
    \ root 权限。*\n\n安装 phpMyAdmin Web 应用程序，输入：\n`sudo apt-get install phpmyadmin php-mbstring\
    \ php-gettext`\n\n**注意：** *对于服务器选择，选择 \"apache2\"，然后在询问是否使用 dbconfig-common 设置数据库时选择\
    \ \"Yes\"。然后你将被要求选择并确认用于 phpMyAdmin 的 MySQL 应用程序密码。安装过程会将 phpMyAdmin Apache 配置文件添加到\
    \ /etc/apache2/conf-enabled/。*\n\n要显式启用 mbstring PHP 扩展，输入：`sudo phpenmod mbstring`\n\
    \n重启 Apache 以识别更改，输入：`sudo systemctl restart apache2`\n\n**注意：** *phpMyAdmin 会自动在\
    \ MySQL 中创建一个名为 phpmyadmin 的数据库。*\n\n要使用你的 root MySQL 用户登录，你需要将验证方法从 AUTH_SOCKET\
    \ 切换到 MYSQL_NATIVE_PASSWORD，输入：`sudo mysql`\n\n要显示 MySQL 正在使用的当前验证方法配置，在 mysql>\
    \ 提示符下输入：`SELECT user,authentication_string,plugin,host FROM mysql.user;`。要将验证方法配置更改为使用\
    \ mysql_native_password，在 mysql> 提示符下输入：`ALTER USER 'root'@'localhost' IDENTIFIED\
    \ WITH mysql_native_password BY 'password';`\n\n**注意：** *请确保将 'password' 更改为强密码。*\n\
    \n要使配置更改生效，在 mysql> 提示符下输入：`FLUSH PRIVILEGES;`\n\n要确保新的配置更改已在系统中实施，在 mysql> 提示符下输入：`SELECT\
    \ user,authentication_string,plugin,host FROM mysql.user;`。在 mysql> 提示符下输入 `exit`\n\
    \n要访问 PHPMyAdmin Web 界面，在浏览器中输入机器域名或公网 IP 地址，`https://domain_name_or_ip/phpmyadmin`\n\
    \n**注意：** *当启用密码认证时，你需要使用不同的命令登录。要使用传统方法登录，输入：*mysql -u root -p*\n\n要创建一个唯一用户而不是使用\
    \ root 用户，请按照以下命令修改步骤。在 mysql> 提示符下输入：`CREATE USER 'new_user'@'localhost' IDENTIFIED\
    \ BY 'password';`\n\n**注意：** *将 'new_user' 更改为你想要的名称，并将 'password' 设为强密码。*\n\n\
    此命令授予新用户适当的权限；\n\n## 固 phpMyAdmin\n\n**概述：** 本节是对 .htaccess 文件的实用介绍。.htaccess\
    \ 文件允许你在即使不需要使用此功能的情况下应用指令来覆盖默认 Apache 设置。\n\n**前提条件：** *本节假设你的 Apache、MySQL 和\
    \ PHP 已正常运行并配置妥。这包括你的防火墙设置，以及你拥有系统上的 root 权限。*\n\n你需要通过修改 /etc/apache2/conf-available/phpmyadmin.conf\
    \ 文件来启用对 .htaccess 文件的使用。\n\n在以下部分添加 ' AllowOverride ' 行：\n\n```apache\n<Directory\
    \ /usr/share/phpmyadmin>\nAllowOverride All\n</Directory>\n```\n\n（要保存文件并退出编辑器，按\
    \ **Ctrl+X**，输入 **y** 并按回车键）\n\n重启 Apache 服务，输入：\n`sudo systemctl restart apache2`\n\
    \n要应用安全权限，你需要创建 .htaccess 文件，输入：`sudo nano /usr/share/phpmyadmin/.htaccess`\n\n\
    **注意：** *在文件中，输入以下信息：（可以省略注释，我提供它们仅为了清晰起见。*\n\n```apache\n# 指定正在实施的身份验证类型（例如，密码文件）\n\
    AuthType Basic\n\n# 指定身份验证对话框的消息。\n# 建议：出于安全考虑，请保持消息的通用性。\nAuthName \"Restricted\
    \ Files\"\n\n# 指定用于认证的密码文件位置\n# 建议：将此文件存储在 Web 服务所提供的目录之外。\nAuthUserFile /etc/phpmyadmin/.htpasswd\n\
    \n# 指定仅允许经过身份验证的用户访问资源。\nRequire valid-user\n```\n\n（要创建密码文件，系统将提示你输入密码，输入：`sudo\
    \ htpasswd -c /etc/phpmyadmin/.htpasswd user_name`。要创建额外用户，在不使用 -c 标志的情况下执行，输入：`sudo\
    \ htpasswd /etc/phpmyadmin/.htpasswd new_user_name`。当你访问 PHPMyAdmin 界面时，系统将提示输入创建的额外用户名和密码，输入：\n\
    \nhttps://domain_name_or_ip/phpmyadmin\n\n"
