    \ start a Linux distro, or another operating\n\nsystem (such as Windows) depending\
    \ how it is configured. It can also be\n\nconfigured to stop and allow the user\
    \ to select which OS they want to load.\n\nThe most popular boot loader is called\
    \ GRUB (GRand Unified Bootloader).\n\nAlternative boot loaders utilized by Linux\
    \ distros are the LILO (LInux LOader)\n\nand LOADLIN (LOAD LINux). There are more\
    \ boot loaders available, but these\n\nare some of the most popular.\n\nIf you\
    \ want more information on this subject, in your favorite search engine\n\ntype:\
    \ \"Linux Boot Loaders OR BootLoader\"\n\n \n\n![](img/0f524874379aa171ff08f51cdf3cfa83_146_0.png)\n\
    \n \n\n**Tip:** *Hold down the Shift key during startup to access the GRUB boot*\n\
    \n*menu.*"
  - "[PAGE 147]\n\nRunlevels Init (Older Systems)\n\n \n\nIn Linux, \"runlevels\"\
    \ are the operational levels that describe the state of the\n\nsystem with respect\
    \ to what services are loaded when the system starts. If the\n\nsystem is set\
    \ to a runlevel of 1, it is restrictive and normally only used for\n\nmaintenance.\
    \ The system will usually be set to a runlevel of 2-5, which is\n\nmultiuser mode.\n\
    \nThe default systems (the one that will be used when the system starts up) is\n\
    \ngenerally configured in the *etc*inittab file. Some Linux distros may not use\
    \ this\n\nfile.\n\nThe processes that are executed by each runlevel, depend on\
    \ the contents of the\n\n*etc*rc?.d directory (i.e. *etc*rc1.d, *etc*rc2.d, *etc*rc3.d\
    \ , etc.). To see all the\n\nprocesses for all the runlevels directories, type:\
    \ ls *etc*rc?.d\n\n \n\nAll the files in this directory are symbolic links that\
    \ point to scripts in the\n\n*etc*init.d directory that start the services. The\
    \ names of the files are important,\n\nbecause they determine the order in which\
    \ the scripts will run. To see the\n\nprocesses for a specific runlevel, type:\
    \ ls -l *etc*rc3.d\n\n \n\n**Runlevel Reference**\n\n0 = halted (system shutdown)\n\
    \n1 = single user (maintenance mode)\n\n2 = multiuser with no networking configured\n\
    \n3 = multiuser with networking (normal operation) 4 = not used (user\n\ndefined)\n\
    \n5 = Normal operation, plus GUI\n\n6 = reboot\n\n \n\n**Tip:** *To see the runlevel\
    \ that the system is currently running in, type:*\n\n*runlevel*"
  - '[PAGE 148]


    **Note:** *Some recent distros like Ubuntu, no longer utilize runlevels. The*


    *runlevel technology doesn''t support starting the system with multiple*


    *services running in parallel.*'
  - "[PAGE 149]\n\nSystemd Init (Newer Systems)\n\n \n\nSystemd is a suite of subsystems\
    \ that provides the fundamental building blocks\n\nfor a Linux operating system.\
    \ The name Systemd adheres to the UNIX\n\nconvention of naming daemons by appending\
    \ the letter \"D\" to the end of the\n\nname.\n\nIt is a replacement for the traditional\
    \ UNIX System V and Berkeley Software\n\nDistribution (BSD) init systems (aka\
    \ Runlevels). It features \"System and Service\n\nManager,\" used to initialize\
    \ and bootstrap the user space and to manage system\n\nservices after the boot\
    \ process.\n\nOne of the main goals of the project is unification of basic Linux\
    \ configurations\n\nand service behaviors across all Linux distributions. As of\
    \ 2015, most Linux\n\ndistributions have adopted systemd as their default init\
    \ system.\n\n \n\n**Tip:** *To see a list of all the systemd related commands,\
    \ type:* *man*\n\n*systemd.index*"
- md: '

    ## Managing Services


    Services (aka daemons) are programs and scripts that run in the background, and
    don''t require user input. The services can provide advanced functionality like
    web server services (such as Apache), or database services (such as MySQL) and
    a great deal more.


    When managing services, you generally have four operations: Status, Start, Stop,
    and Restart. I believe all these functions are self-explanatory, so I won’t go
    into detail about what they do.


    You can add new or remove old services by utilizing the package manager that comes
    with your system. The package manager takes care of all the background tasks of
    getting the necessary libraries and removing the dependencies that are no longer
    needed.


    To see a list of all services and their status, type: `systemctl` -OR— `service
    --status-all`


    **Note:** *The *service* command is for running System V init script.* *This should
    be used on systems that still utilize runlevel technology.* *For newer system
    based systems use *systemctl.*.*


    **Tips:** *To display the top control groups by their resource usage, type: *systemd-cgtop*
    To display a list of services and the ports they are using, type: *netstat -tulpn***


    **Note:** *Control Groups provide a way of partitioning off system resources for
    groups of users and/or tasks. For example, control groups can set the limits of
    CPU and memory usage on a shared computer between two different sets of users
    and the programs that they''re running.*


    To check the status of the daemon service, type: `systemctl status sshd` -OR—
    `service atd status`. If the service is not started, type: `sudo systemctl [start
    | stop] sshd` -OR- `sudo service_name atd [start | stop]`.


    Alternatives to these commands for older systems are: To check status, type: `/etc/init.d/atd
    status`. To start or stop a service, type: `sudo /etc/init.d/atd [start | stop]`.


    **Tip:** *Find and replace the text in the last command ''sudo systemctl stop
    nginx.service'', type: ^stop^start***


    ## Managing Users


    One of the basic functions of any system administrator is the managing of users
    (adding, modifying and deleting) and groups on the local system. The next commands
    will help you get started performing these functions.


    Displays a list of all the users, type: `cat /etc/passwd`


    **Tip:** *To make the output easier to read, type: *cat /etc/passwd | column -t
    -s :***


    To add a user to the local system, type: `sudo useradd -c "Jane Doe" -m -s /bin/bash
    jane`. To modify an existing user, type: `sudo usermod -u 3000 Jane`. To delete
    a user, type: `sudo userdel --remove-all-files jane`.


    **Note:** *The --remove-all-files flag makes sure that files created by the user
    are also deleted.*


    To create a user group, type: `sudo groupadd app_admins`. To modify a user group,
    type: `sudo groupmod -g 300 app_admins`. To delete a user group, type: `sudo groupdel
    app_admins`. To change your user password, type: `passwd`.


    To change the password of another user, type: `sudo passwd jane`.


    **Tips:** *To display a user’s account details, type: *getent passwd jane* Another
    alternative to this command, type: *grep -i jane /etc/passwd* To display a user’s
    group details (real and effective user and group IDs), type: *id jane* Display
    all group(s) a user belongs to, type: *groups jane***


    **Notes:** *Important system file locations: Group account information: /etc/group
    * User account information: /etc/passwd * Secure user account information: /etc/shadow
    * Encrypted passwords for each group, and group membership: /etc/gshadow***


    ### Important user files


    There are hidden files in every user home directory, these files contain shell
    and application configuration and initialization data. They are used every time
    you login or load a program like vi or vim.


    To view the contents of one of these files use the cat command. To see a list
    of all the hidden files in your user directory, type: `ls -al ~`


    This is not a complete list of all these files that you might run across, but
    it will cover some of the more popular ones.


    - .bash_history: Contains a list of the most recent used commands.

    - .bash_logout: A Bash script that is run by the shell when the user logs out.

    - .bash_profile: A Bash script that initializes the shell upon login, to setup
    variables and aliases.

    **Note:** *If this file is not found, it will try to use .bash_login. If that
    file is not found, it will then try to load the .profile file.*

    - .bashrc: Stores a Bash initialization script that is executed whenever the shell
    is started, and is not related to the user logging in.

    **Note:** *It is better to use .bashrc.*

    - .profile: Contains user-wide settings.

    - .viminfo: Initialization file for the vim editor.


    ## Managing Administrators


    After creating a user, you can grant them root privileges. Generally there are
    two ways to do this: the first one involves adding the user to the sudo group.
    The second way is to edit the sudoers file.


    To add a user to the sudo group, type: `sudo usermod -aG sudo user_name`. This
    will allow the user to run commands with root privileges.


    To edit the sudoers file, always use the `visudo` command. This is important because
    it checks for syntax errors before saving, preventing you from being locked out
    of the system.


    To use visudo, type: `sudo visudo`.


    **Tip:** *To add a user to the end of sudoers file, type: *sudo echo ''user_name
    ALL=(ALL) ALL'' >> /etc/sudoers***


    ## User Notification


    If you need to send notification to users logged in to a local or remote system,
    you can use the write command to display a message on the user’s console.


    To write a message to another user on the same system, type: `write user_`. After
    you start the command, you can write the user a message that will display on their
    terminal, and press Ctrl+D when done.


    **Note:** *Use the *who -a command to see the users logged into the system.*


    ## Managing the Syslog


    When the system or applications need to write events (i.e. warnings, alerts, information,
    etc.), it writes them into the system log (aka syslog).


    To check the contents of the syslog, type: `less /var/log/syslog`


    **Note:** *There are other system related log files in the /var/log/ directory.
    To see all of them type: *ls -l /var/log/*.log***


    To find out where the syslog is located, type: `less /etc/syslog.conf`


    To send a message into syslog, type: `echo "HelloWorld" | logger`


    ### Monitoring log files


    Linux provides several different tools for searching and displaying your log files.
    The ones I am covering next are just the basic ones.


    - To see the last few lines, type: `tail /var/log/syslog`

    - To continuously display the latest changes to a log file, type: `tail -f /var/log/syslog`

    '
  mdcn: '


    ## 管理服务


    服务（又称守护进程）是在后台运行且不需要用户输入的程序和脚本。服务可以提供高级功能，例如 Web 服务器服务（如 Apache）、数据库服务（如 MySQL）等许多功能。


    在管理服务时，你通常有四种操作：状态（Status）、启动（Start）、停止（Stop）和重启（Restart）。我认为这些功能都是不言自明的的，因此我不会详细介绍它们的作用。


    你可以利用系统自带的包管理器添加新服务或删除旧服务。包管理器会处理所有获取必要库和移除不再需要的依赖的后台任务。


    要查看所有服务的列表及其状态，输入：`systemctl` -OR— `service --status-all`


    **注意：** *service 命令用于运行 System V init 脚本。* *这应该用于在使用运行级别（runlevel）技术的系统。* *对于较新的系统，请使用
    systemctl。*


    **提示：** *要按资源使用情况显示顶部控制组，输入：*systemd-cgtop*。要显示服务列表及其使用的端口，输入：*netstat -tulpn***


    **注意：** *控制组（Control Groups）提供了一种为用户组和/或任务划分系统资源的方法。例如，控制组可以为共享计算机上的两组不同用户及其运行程序设置
    CPU 和内存使用限制。*


    要检查守护进程服务的状态，输入：`systemctl status sshd` -OR— `service atd status`。如果服务未启动，输入：`sudo
    systemctl [start | stop] sshd` -OR- `sudo service_name atd [start | stop]`。


    旧系统中这些命令的替代方案是：要检查状态，输入：`/etc/init.d/atd status`。启动或停止服务，输入：`sudo /etc/init.d/atd
    [start | stop]`。


    **提示：** *在最后一个命令 ''sudo systemctl stop nginx.service'' 中查找并替换文本，输入：^stop^start***


    ## 管理用户


    任何系统管理员的基本功能之一都是管理本地系统的用户（添加、修改和删除）和组。接下来的命令将帮助你开始执行这些功能。


    显示所有用户列表，输入：`cat /etc/passwd`


    **提示：** *为了让输出更易读，输入：*cat /etc/passwd | column -t -s :***


    向本地系统添加用户，输入：`sudo useradd -c "Jane Doe" -m -s /bin/bash jane`。修改现有用户，输入：`sudo
    ususer -u 3000 Jane`。删除用户，输入：`sudo userdel --remove-all-files jane`。


    **注意：** *--remove-all-files 标志确保由用户创建的文件也会被删除。*


    创建用户组，输入：`sudo groupadd app_admins`。修改用户组，输入：`sudo groupmod -g 300 app_admins`。删除用户组，输入：`sudo
    groupdel app_admins`。更改用户密码，输入：`passwd`。


    更改另一个用户的密码，输入：`sudo passwd jane`。


    **提示：** *要显示用户的账户详情，输入：*getent passwd jane*。此命令的另一种替代方案，输入：*grep -i jane /etc/passwd*。显示用户的组详情（真实和有效用户及组
    ID），输入：*id jane*。显示用户所属的所有组，输入：*groups jane***


    **注意：** *重要的系统文件位置：组账户信息：/etc/group * 用户账户信息：/etc/passwd * 安全用户账户信息：/etc/shadow
    * 每个组的加密密码及组组成：/etc/gshadow***


    ### 重要用户文件


    每个用户主目录下都有隐藏文件，这些文件包含了 shell 和应用程序的配置和初始化数据。每当你登录或加载像 vi 或 vim 程序时，都会使用它们。


    使用 cat 命令查看其中一个文件的内容。要查看你用户目录下的所有隐藏文件列表，输入：`ls -al ~`


    这并不是你可能遇到的这些文件的完整列表，但它将涵盖一些最常用的文件。


    - .bash_history：包含最近使用的命令列表。

    - .bash_logout：用户在注销登录时由 shell 运行的 Bash 脚本。

    - .bash_profile：在登录时初始化 shell 的 Bash 脚本，用于设置变量和别名。

    **注意：** *如果未找到此文件，它将尝试使用 .bash_login。如果未找到该文件，它将尝试加载 .profile 文件。*

    - .bashrc：存储 Bash 初始化脚本，该脚本在每次启动 shell 时都会执行，与用户登录无关。

    **注意：** *最好使用 .bashrc。*

    - .profile：包含用户级设置。

    - .viminfo：vim 编辑器的初始化文件。


    ## 管理员


    创建用户后，你可以授予他们 root 权限。通常有两种方法可以实现：第一种涉及将用户添加到 sudo 组。第二种方法是编辑 sudoers 文件。


    要将用户添加到 sudo 组，输入：`sudo usermod -aG sudo user_name`。这将允许用户以 root 权限运行命令。


    编辑 sudoers 文件时，务始终使用 `visudo` 命令。这很重要，因为它会在保存之前检查语法错误，防止你被锁定在系统之外。


    要使用 visudo，输入：`sudo visudo`。


    **提示：** *将用户添加到 sudoers 文件的末尾，输入：*sudo echo ''user_name ALL=(ALL) ALL'' >> /etc/sudoers***


    ## 用户通知


    如果你需要向登录本地或远程系统的用户发送通知，可以使用 write 命令在用户的控制台上显示消息。


    要向同一系统上的另一个用户写入消息，输入：`write user_`。启动命令后，你可以为用户写一条消息，该消息将显示在他们的终端上，完成后按 Ctrl+D。


    **注意：** *使用 who -a 命令查看登录到系统的用户。*


    ## 管理 Syslog


    当系统或应用程序需要写入事件（例如警告、警报、信息等）时，它们会将事件写入系统日志（又称 syslog）。


    要检查 syslog 内容，输入：`less /var/log/syslog`


    **注意：** */var/log/ 目录下还有其他系统相关的日志文件。要查看所有文件，输入：*ls -l /var/log/*.log***


    要查找 syslog 所在，输入：`less /etc/syslog.conf`


    向 syslog发送消息，输入：`echo "HelloWorld" | logger`


    ### 监控日志文件


    Linux 提供了多种不同的工具来搜索和显示日志文件。接下来涵盖的只是基础工具。


    - 查看最后几行，输入：`tail /var/log/syslog`

    - 持续显示日志文件的最新更改，输入：`tail -f /var/log/syslog`


    '
