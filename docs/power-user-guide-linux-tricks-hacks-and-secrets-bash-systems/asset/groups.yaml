    ## Installing SSL Certificate


    **Overview:** Let''s Encrypt is a Certificate Authority (CA) that provides free

    TLS/SSL certificates, that allow you to enable encrypted HTTPS communication

    on your web server(s). HTTPS is critical to the security of your site and users.


    Search engines like Google give higher priority in the search results to sites
    that

    support encrypted communications.


    **Prerequisites:**

    - A server running a recent version of Linux and apache.

    - A fully registered domain name, i.e. example.com.

    - DNS ''A records'' (and ''CNAME record'', which is optional) that point to

    your server''s public IP address. i.e.: example.com (123.321.123.321),

    www.example.com (123.321.123.321).


    ## Installing Certbot


    EFF''s Certbot can automatically enable HTTPS on your website by deploying

    Let''s Encrypt certificates. You might ask why you may need Certbot to help you.

    First, it automates the process of requesting installing the certificate, this
    can

    relieve you of that administration.


    Second, the Let''s Encrypt Certificate has a hard coded lifetime of 90 days, before

    they have to be renewed. The Certbot takes care of the renewal process

    automatically. This feature is designed to help prevent a malicious person or

    group from abusing the certificate if they are able to get a hold of it.


    To install the Certbot repository, type:

    `sudo add-apt-repository ppa:certbot/certbot`


    To install Certbot''s Apache package, type:

    `sudo apt-get install python-certbot-apache`


    Open the virtual host file for the domain, type: `sudo nano /etc/apache2/sites-available/example.com.conf`.
    Find the **ServerName**, it

    should look like the example:

    `ServerName example.com;`

    ...


    **Note:** *If it doesn''t match, update the file and save the changes.*


    To verify the syntax of your configuration edits, type: `sudo apache2ctl configtest`


    **Note:** *If there is an error, reopen the virtual host file and check for

    mistakes (i.e., typos, missing characters, etc.).*


    To reload apache service to force the loading of the new configuration,

    type: `sudo systemctl reload apache2`


    ## Allow HTTPS through the Firewall


    You need to make sure the HTTPS ports (TCP/443) are open in the firewall in

    order for remote systems to communicate with the service.


    Check the current status of the firewall status, type: `sudo ufw status`


    To clear out the old firewall configuration (if it exists) and replace it with

    a new one, type: `sudo ufw delete allow ''Apache''`

    `sudo ufw allow ''Apache Full''`


    To check the current firewall status, type:

    `sudo ufw status`


    ## Obtaining an SSL Certificate


    Certbot provides a variety of ways to obtain SSL certificates through plugins.

    The Apache plugin will take care of reconfiguring Apache and reloading the

    config whenever necessary.


    To use this plugin, type:

    `sudo certbot --apache -d example.com -d www.example.com`. If this is

    your first time running certbot, you will be prompted to enter an email

    address and agree to the terms of service. After doing so, certbot will

    communicate with the Let''s Encrypt server, then run a challenge to verify

    that you control the domain you''re requesting a certificate for.


    If that''s successful, certbot will ask how you''d like to configure your HTTPS

    settings. Select your choice then hit ENTER. The configuration will be updated,

    and Apache will reload to pick up the new settings.


    Your certificates are downloaded, installed, and loaded. Try reloading your

    website using https:// and notice your browser''s security indicator. It should

    indicate that the site is properly secured, usually with a green lock icon.


    **Tip:** *If you test your server using the SSL Labs Server Test (**https://www.ssllabs.com/ssltest/**),
    it should give your site an A grade.*


    ## Verifying Certbot Auto-Renewal


    As stated earlier Let''s Encrypt certificates are only valid for ninety days.
    This is

    to encourage users to automate their certificate renewal process. The certbot

    package that was installed takes care of this for you by adding a renew script
    to

    the /etc/cron.d. This script runs twice a day and will automatically renew any

    certificates that are about to expire within next thirty days.


    To test the renewal process, type:

    `sudo certbot renew --dry-run`


    When necessary, Certbot will renew your certificates and reload Apache to pick

    up the changes. If the automated renewal process ever fails, Let’s Encrypt will

    send a message to the email you specified, warning you when your certificate(s)

    are about to expire.


    ## Installing Docker (Containerization)


    **Overview:** Docker is a technology for managing processes that are run in

    Docker containers. Docker Containers run applications in resource-isolated

    processes. The technology is similar to virtual machines (VMs), but Docker

    containers are more portable, more resource-friendly, and dependent on the host

    operating system.


    Docker and virtual machine technology offer process resource-isolation. Unlike

    Docker, VMs run independently of the host operating system. Each VM has to

    the host operating system.


    **Prerequisites:**

    - A system with reasonable amount of resources (i.e. 2 CPUs, 8GB RAM, 50GB storage).

    - An updated Linux.

    - An account on Docker Hub (https://www.docker.com).

    '
  mdcn: '


    ## 安装 SSL 证书


    **概述：** Let''s Encrypt 是一个证书颁发机构（CA），提供免费的 TLS/SSL 证书，允许您在您的 Web 服务器上启用启用加密的 HTTPS
    通信。HTTPS 对于您的网站和用户的安全性至关重要。


    Google 等搜索引擎会对支持加密通信的网站在搜索结果中给予更高的优先级。


    **前提条件：**

    - 一台运行最新版本 Linux 和 apache 的服务器。

    - 一个已完全注册的域名，例如 example.com。

    - 指向您的服务器公共 IP 地址的 DNS“A 记录”（以及“CNAME 记录”，后者是可选的）。例如：example.com (123.321.123.321)，www.example.com
    (123.321.123.321)。


    ## 安装 Certbot


    EFF 的 Certbot 可以通过部署 Let''s Encrypt 证书自动在您的网站上启用 HTTPS。您可能会问为什么需要 Certbot 来帮助您。首先，它自动化了请求和安装证书的过程，这可以减轻您的管理负担。


    其次，Let''s Encrypt 证书具有硬编码的 90 天有效期，在在此之前必须续期。Certbot 会自动处理续期过程。此功能旨在防止恶意人员或团体在获取证书后进行滥用。


    要安装 Certbot 仓库，输入：

    `sudo add-apt-repository ppa:certbot/certbot`


    要安装 Certbot 的 Apache 软件包，输入：

    `sudo apt-get install python-certbot-apache`


    打开该域名的虚拟主机文件，输入：`sudo nano /etc/apache2/sites-available/example.com.conf`。找到 **ServerName**，它看起来
    own示例：

    `ServerName example.com;`

    ...


    **注意：** *如果不匹配，请更新文件并保存更改。*


    要验证您编辑的配置语法，输入：`sudo apache2ctl configtest`


    **注意：** *如果有错误，请重新打开虚拟主机文件并检查错误（例如拼写错误、缺失字符等）。*


    要重新加载 apache 服务以强制加载新配置，输入：`sudo systemctl reload apache2`


    ## 通过防火墙允许 HTTPS


    您需要确保防火墙中开放了 HTTPS 端口 (TCP/443)，以便远程系统与该服务通信。


    检查防火墙的当前状态，输入：`sudo ufw status`


    要清除旧的防火墙配置（如果存在）并将其替换为新的，输入：`sudo ufw delete allow ''Apache''`

    `sudo ufw allow ''Apache Full''`


    检查当前防火墙状态，输入：

    `sudo ufw status`


    ## 获取 SSL 证书


    Certbot 提供了通过插件获取 SSL 证书的多种方法。Apache 插件将在需要时自动处理重新配置 Apache 并重新加载配置。


    要使用此插件，输入：

    `sudo certbot --apache -d example.com -d www.example.com`。如果您是第一次运行 certbot，系统将提示您输入电子邮件地址并同意服务条款。完成操作后，certbot
    将与 Let''s Encrypt 服务器通信，然后运行挑战以验证您控制了所请求证书的域名。


    如果成功，certbot 将询问您希望如何配置 HTTPS 设置。选择您的选项并按回车键。配置将得到更新，Apache 将重新加载以采用新设置。


    您的证书已下载、安装并加载。请尝试使用 https:// 重新加载您的网站，并注意浏览器的安全指示。它应该指示网站已正确保护，通常带有一个绿色锁图标。


    **提示：** *如果您使用 SSL Labs Server Test (**https://www.ssllabs.com/ssltest/**) 测试您的服务器，它应该为您的网站授予
    A 等。*


    ## 验证 Certbot 自动续期


    如前所述，Let''s Encrypt 证书有效期仅为十天。这样做是为了鼓励用户自动化证书更新过程。安装的 certbot 包通过在 /etc/cron.d
    中添加续期脚本来为您处理此问题。该脚本每天运行两次，并将自动续期任何将在未来三十天内过期的证书。


    要测试续期过程，输入：

    `sudo certbot renew --dry-run`


    在需要时，Certbot 将更新您的证书并重新加载 Apache 以采用更改。如果自动化续期过程发生故障，Let’s Encrypt 将向您指定的电子邮件发送消息，警告您您的证书即将过期。


    ## 安装 Docker（容器化）


    **概述：** Docker 是一种管理运行在 Docker 容器中的进程的技术。Docker 容器在资源隔离的进程中运行应用程序。该技术与虚拟机 (VMs)
    类似，但 Docker 容器更具移植性、更节省资源，并且依赖于主机操作系统。


    Docker 和虚拟机技术提供了进程资源隔离。与 Docker 不同，虚拟机独立于主机操作系统运行。每个虚拟机都需要宿主机操作系统。


    **前提条件：**

    - 具有合理资源量的系统（例如：2 个 CPU、8GB 内存、50GB 存储）。

    - 更新过的 Linux。

    - Docker Hub (https://www.docker.com) 上的账户。


    '
