    Result: 45


    **OR:**

    ```bash

    B="12345"

    C=${B%45}

    echo $C

    ```

    Result: 123


    ## Passing Arguments into a Script


    There will be times you’re going to need to pass arguments into a script. Passing
    arguments into a script from the command line, works the exact same way when you
    pass them. Although, it''s up to the script to process them, and then the appropriate
    actions.


    For example, let’s say you have a script called myfirst.sh. This is a simple script
    that only displays the arguments that are passed to it. Every arguments that is
    passed to a script, is assign one of variable based on its position "$1", "$2"
    and so on. The count of arguments is in the shell variable "$#"


    ```bash

    cat myfirst

    echo "First argument: $1"

    echo "Second argument: $2"

    ```


    When you execute the script, when you pass arguments to it it will display them.


    $ ./myscript hello world

    First argument: hello

    Second argument: world


    ## Conditional branching and Looping


    Conditional branching and looping are slightly more advanced functionality. This
    gives the script intelligence to make choices when specific conditions are met.
    For example, if something happens happens, then do this, otherwise do something
    else.


    ### Branching


    Conditional branching utilizes relational operators to test if a condition has
    been met. The command will then execute code depending on if the condition was
    true or false.


    **Note:** *The spaces between the brackets and the expression are very important
    (i.e. \[ $test = "true" ]), do not leave them out.*


    ### If - Then Statement


    Test if a condition has been met utilizing the relational operators, THEN executes
    code. Otherwise if the condition was not met it will not execute the code.


    There are two ways to write this code, the short form and long form. The short
    form is used from a command line. While the long form is used inside a script.


    The short form uses semicolons \[;\] as separators, instead of new lines, and
    looks like this: if CONDITION; then commands...; fi


    The long form utilizes indenting to make the code more readable (this is a highly
    recommended technique), looks like this: if CONDITION

    then

