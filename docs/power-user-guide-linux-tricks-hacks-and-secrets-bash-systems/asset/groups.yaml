    Block: 512 regular file Device: 2h/2d* Inode: 83035118129644079 Links: 1* *Access:
    (0666/-rw-rw-rw-) Uid: (1000/jane) Gid: (1000/jane)* *Access: 2018-03-29 19:39:11.953837000
    -0700* *Modify: 2018-03-29 19:39:11.958023900 -0700* *Change: 2018-05-13 21:05:23.751088300
    -0700* *Birth: -*


    将文件移动到特定目录，请输入：mv **file_name1** path/to/directory Linux 没有特定的文件重命名命令，你必须使用 MV
    来更改文件名，请输入：mv **file_name1** **file_name2**


    显示关于文件类型的信息，请输入：file **file_name.ext**


    **示例输出：**


    *user@localhost:~$ capture.jpg* *capture.jpg: JPEG image data, JFIF standard 1.01,
    resolution (DPCM), density 66x66, segment length 16, baseline, precision 8, 120x120,
    frames 3*


    更改文件的所有者，请输入：chown user1 path/to/file_name 文件权限，请输入：chmod 644 path/to/file_name


    **注意：** *权限部分：所有者、所有组和其他其它（例如 754，**owner** = 所有，**group** = 读+执行，**world** =
    读）。文件权限为：读 = 4，写 = 2，执行 = 1（例如，读(4)+写(2) = 6)*


    **提示：** *将 file2 的权限更改为与 file1 相同，输入：* chmod --reference file_name1 file_name2


    递归更改当前路径下所有文件的权限，并忽略目录，请输入：find ./ -type f -exec chmod 777 {} \;


    显示目录占用了多少存储空间，请输入：du -sh /directory


