    ![](img/0f524874379aa171ff08f51cdf3cfa83_1_0.png)


    **书籍摘要：**


    如今 Linux 运行在各种设备上，从微小的手表、IoT 设备（如树莓派和其他单板计算机）、智能手机、笔记本电脑、台式电脑、服务器、网络设备，甚至是大型机。许多云服务也使用
    Linux 在亚马逊云服务 (AWS)、Microsoft Azure 或 Google Cloud 上进行管理或运行基础设施。


    本书共有三个版本，第1卷是 **Bash 系统管理**版。还有第2卷，即 **Bash 系统参考**版。此外还有一个**终极版**，它包含了第1卷和第2卷的所有内容。


    第1卷——**Bash 系统管理**版适用于想要学习 Linux（为了工作面试 [例如 Linux 系统管理员或工程师、DEVOPS、DEVSECOPS 等]
    或创建 IoT 设备）或已已多年多年的人士。本书专为所有想要开始学习并掌握 Linux 操作系统和 Bash Shell 的人员编写，同时也学习如何利用高级功能。本书旨在帮助你快速上手，或在不浪费时间的情况下提升你现有的技能。


    第2卷即 **Bash 系统参考**版，包含了数百个命令的参考、示例、技巧和注释，以让你对所涵盖的命令或主题有额外的见解。本书还包含了一份超过 600 多个
    Linux 命令的全面快速参考（附示例）。此外，还包含了针对若干高级主题的多个 Linux 及相关快速入门指南，包括应用程序、网络主题、Bash 键盘快捷键等许多更多内容。


    **涵盖主题：** Linux 操作系统、Linux 命令、Bash 单行命令和脚本。如何安装：Apache Web 服务器、MySQL、PHPMyAdmin
    和 PHP。如何安装和管理 Docker 以及 Git。系统管理主题包括：故障排除、网络等。安全主题包括：防火墙管理概述，以及如何锁定你的 Linux 操作系统。


