    ## If - Then - Else Statement


    Test if a condition has been met utilizing the relational operators, THEN executes
    code. If the condition was not met it will test the next condition (if available).
    If all the conditions fail, then it will execute the code in the ELSE clause.


    Example:


    *if [ condition ]*

    *then*

    COMMANDS...

    *elif [ condition ]*

    *then*

    COMMANDS...

    *else*

    COMMANDS...

    *fi*


    ## Nested If - Then Statement


    Similar to an If - Then - Else statement, the nested If - Then statements (i.e.
    an if statement inside of another if statement) have their place.


    The next example checks if $x is greater than 200, then checks if it is even.
    This is something that you could not do with the If - Then - Else statement by
    itself.


    Example:


    *x=300*

    *if [ $x -gt 200 ]*

    *then*

    *echo It''s a large number.*

    *if (( $x % 2 == 0 ))*

    *then*

    *echo This number is even.*

    *fi*

    *fi*


    ## Relational Operators


    The relational operators exist to test variables or values if specific conditions
    (i.e. true, false, greater or less then, etc.) have been met or not. A few different
    type of commands use these relational operators.


    - **! expression** = Expression is false **Ex:** var=2 && [ ! $var -eq 1 ] &&
    echo "True"


    ## String Operators


    These operators test the contents of a variable or command output that contains
    a string (i.e. A-Z, 0-9, @, #, $, %, ^, &, *, -, =, _, +, etc.) to check if specific
    condition(s) have been met then performs a true or false operation (i.e. running
    specified code).


    - **-n string** = Tests if the string length GREATER THAN ZERO (i.e. not empty)
    **Ex:** var="abc" && [ -n "$var" ] && echo "Not Empty"


    - **-z string** = Tests if the string length EQUALS ZERO (i.e. empty) **Ex:**
    var="" && [ -z "$var" ] && echo "Empty"


    - **=** = Tests if the strings are EQUAL to each other (i.e. [ $string1 = $string2
    ] ) **Ex:** var="abc" && [ $var = "abc" ] && echo "True"


    - **!=** = Tests if the strings are NOT EQUAL to each other (i.e. [ $string1 !=
    $string2 ] ) **Ex:** var="abc" && [ $var != "abc" ] && echo "True"


    - **>** = Tests if the first strings SORTS BEFORE the second (i.e. "string" >
    "string" ) **Ex:** var="aac" && [[ $var > "abc" ]] && echo "True"


    **Note:** The "<" needs to be escaped within a [ ] construct.

    **Ex:** var="aac" && [ $var \< "abc" ] && echo "True"


    - **<** = Tests if the first strings SORTS AFTER the second (i.e. "string" < "string"
    ) **Ex:** var="xxz" && [[ $var < "xyz" ]] && echo "True"


    **Note:** The ">" needs to be escaped within a [ ] construct.

    **Ex:** var="xxz" && [ $var > "xyz" ] && echo "True"


    ## Numeric Operators


    These operators test the contents of a variable or command output that contains
    an numeric number to check if specific condition(s) have been met then performs
    a true or false operation (i.e. running specified code).


    - **-eq** = Tests if the variable is EQUAL to the value (i.e. [ integer1 -eq integer2
    ] ) **Ex:** var=1 && [ $var -eq 1 ] && echo "True"

    **Ex:** var=1 && (( $var == 1 )) && echo "True"


    - **-ne** = Tests if the variable is NOT EQUAL to the value (i.e. [ integer1 -ne
    integer2 ] ) **Ex:** var=2 && [ $var -ne 1 ] && echo "True"

    **Ex:** var=2 && (( $var != 1 )) && echo "True"


    - **-gt** = Tests if the variable is GREATER THEN the value (i.e. [ integer1 -gt
    integer2 ] ) **Ex:** var=2 && [ $var -gt 1 ] && echo "True"

    **Ex:** var=2 && (( $var > 1 )) && echo "True"


    - **-lt** = Tests if the variable is LESS THEN the value (i.e. [ integer1 -lt
    integer2 ] ) **Ex:** var=1 && [ $var -lt 2 ] && echo "True"

    **Ex:** var=1 && (( $var < 2 )) && echo "True"


    - **-ge** = Tests if the variable is GREATER THEN the value (i.e. [ integer1 -ge
    integer2 ] ) **Ex:** var=2 && [ $var -ge 1 ] && echo "True"

    **Ex:** var=2 && (( $var >= 1 )) && echo "True"


    - **-le** = Tests if the variable is LESS THEN the value (i.e. [ integer1 -le
    integer2 ] ) **Ex:** var=1 && [ $var -le 2 ] && echo "True"

    **Ex:** var=1 && (( $var <= 2 )) && echo "True"


    ## File Operators


    These operators test the contents of a variable or command output that contains
    a file (i.e. path/filename) to check if specific condition(s) have been met then
    performs a true or false operation (i.e. running specified code).


    - **-d** = Tests if a path is a directory

    - **-e** = Tests if a file exists

    - **-r** = Tests file has read permissions

    - **-s** = Tests file size is greater than zero (not empty)

    - **-w** = Tests file has write permissions

    - **-x** = Tests file has execute permissions

    - **-f** = Tests file is a regular file

    - **-h** = Tests file is a symbolic link

    - **-O** = Tests file is owned by you (effective permission)

    - **-G** = Tests file is owned by group (effective permission)

    - **-nt** = Tests if the first file is newer than the second

    - **-ot** = Tests if the first file is older than the second


    ## Boolean Operators


    These operators test the contents of a variable or command output that contains
    Boolean values (i.e. true or false values) to check if specific condition(s) have
    been met then performs a true or false operation (i.e. running specified code).


    - **true** = Has the value True **Ex:** test=true && [ $test = true ] && echo
    "True"

    - **false** = Has the value False **Ex:** test=false && [ $test = false ] && echo
    "True"

    - **&&** = AND operator **Ex:** str1=test1 && str2=test2 && [ $str1 = ''test1''
    ] && [ $str2 = ''test2'' ] && echo "True"

    - **||** = OR operator (i.e. [ $str1 = ''test1'' ] || [ $str2 = ''test2'' ] )
    **Ex:** str=test1 && [ $str1 = ''test1'' ] || [ $str2 = ''test2'' ] && echo "True"


    **Note:** The variable $? holds the exit status of the previously run command.
    0 means TRUE (or the command run successfully). 1 = FALSE (or the command failed
    to run).


    ## Case Statement


    In Bash the Case statement is another form of conditional branching that utilizes
    relational operators to test if a condition(s) have been met. The command will
    then execute code depending if the condition was true or false. The logic of the
    case statement is similar to an If - Then - Else statement, but its simpler and
    easier to read.


    Example:


    *case $Variable in*

    Pattern_1)

    COMMANDS...

    ;;

    Pattern_2)

    COMMANDS...

    ;;

    *esac*


    Here is a basic example of what a case statement looks like: var=test2

    # Case example

    case $var in

    # Pattern 1

    test1)

    echo ''test #1''

    ;;

    # Pattern 2

    test2)

    echo ''test #2''

    ;;

    # Pattern 3

    test3)

    echo ''test #3''

    ;;

    # Catch all (matches anything) if three is not an available pattern match

    *)

    echo ''Did not understand''

    ;;

    esac


    **Note:** The last part of the script (i.e. *) is a catch all, if the patterns
    before it didn''t execute, then this code will execute. This can be useful to
    error handling, if the users input the incorrect option. Although, it has several
    other uses.


    ## Looping


    BASH provides a few different control structures for looping. Each method of looping
    has its advantages and disadvantages for different situations. When programming,
    you will have consider what condition you’re testing for, and how you want it
    to be handled.


    ## For Loop (Variable)


    The FOR loop generally will continue until a certain number of operations are
    completed. Any code between the FOR and DONE command will be repeated. Once the
    number of iterations is completed, it will drop out of the loop.


    Like If - Then Statement there are two ways to write this code, the short form
    and long form. The short form is used from a command line. While the long form
    is used inside of a script.


    The short form uses semicolons (;) as separators, instead of new lines, and looks
    like this: `for VARIABLE in LIST... do commands...; done` The long form utilizes
    indenting to make the code more readable (this is a highly recommended technique),
    looks like this:


    for VARIABLE in LIST... do

    COMMANDS...

    done


    Example #1 (*Displays: 1 iteration, 2 iteration, 3 iteration*) for i in 1 2 3;
    do echo $i iteration; done Example #2 (*Displays: 0-9*) for ((i=0; i < 10; i++))
    do echo $i done

