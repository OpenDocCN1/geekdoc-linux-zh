    I will state there are some command line and GUI apps that will make managing
    the firewall easier. Although, I would highly recommend that you learn how to
    do it from the command line first, it will give you a greater understanding of
    how to manage this service.


    **Note:** *The *iptables utility is for IPv4 and the* *ip6tables utility is for
    IPv6.*


    There are three different iptables chains: input, forward, and output.


    The input chain controls the behavior for incoming network connections (i.e. ssh
    connection). iptables will try to match the IP address, protocol, and port to
    a rule in the input chain. Then decide whether it will allow or deny the connection.


    The forward chain controls the outgoing network data that isn’t meant for the
    local system, but instead will be forwarded to another system. Unless you’re system
    is providing some type of service that does routing, NATing, or something similar
    that uses forwarding, you probably won’t even use this feature.


    **Tip:** *To tell if your system is using IP forwarding use the following command
    and see if the policy is accepting packets, type:* *sudo iptables -L -v*


    The output chain controls the outgoing network connections (i.e. ping command).
    iptables will try to match the IP address, protocol, and port to a rule in the
    output chain. Then decide whether it will allow or deny the connection.


    **Note:** *When using any firewall to lock down a system, it is important to remember
    that several protocols will require two-way communication. So it is important
    to remember that you might have to create both the input and output rules.*


    There are three different iptables responses to packets: accept, drop, and reject.
    The accept response accepts the connection. The drop response, just drops the
    packet like it never received it. Finally there is the reject response, which
    returns an error to the requesting system.


    The way iptables process rules is starts at the top of its list and goes through
    each rule until it finds one that matches the packet. You need to take this into
    consideration when writing your rules. It’s important to note that the -A appends
    the rule to an existing chain. The -I [chain] [number] allows you specify the
    line number in the list where the rule should go.


    Block all connections from a single IP address, type: `sudo iptables -A INPUT
    -s 192.168.0.100 -j DROP`


    Block all connections from an IP range using standard slash notation or netmask,
    type: `sudo iptables -A INPUT -s 192.168.0.0/24 -j DROP` -OR- `sudo iptables -A
    INPUT -s 192.168.0.0/255.255.255.0 -j DROP`


    Block all connections from a single IP address, type: `sudo iptables -A INPUT
    -s 192.168.0.100 -j DROP`


    To drop a specific protocol or port number from a specific IP address, type: `sudo
    iptables -A INPUT -p tcp --dport ssh -s 192.168.0.100 -j DROP`


    To drop a specific protocol or port number from all IP addresses, type: `sudo
    iptables -A INPUT -p tcp --dport ssh -j DROP`


    To insert a rule, type: `sudo iptables -I INPUT 1 -s 192.168.0.100 -j ACCEPT`


    To replace a rule, type: `sudo iptables -R INPUT 1 -s 192.168.0.100 -j ACCEPT`


    **Note:** *When working on this service remotely, be careful because you could
    lock yourself out of a remote system playing with this feature. Once you lock
    yourself out, you will need to have some type of terminal access to the system
    to fix the problem.*


    As stated earlier in this section, some applications and service only require
    a one-way connection. While other applications and services may require a two-way
    connection. For example, ssh requires bi-directional communications. Some additional
    functionality of the firewall if you need it, is called connection state that
    allows two way communication, but only allows one-way to establish it. For example,
    you can make a new connection from the local system to remote server and they
    are allowed to have two-way communication. Although, new connections from the
    remote server are not allowed. `sudo iptables -A OUTPUT -p tcp --dport 22 -m 192.168.0.100
    --ctstate NEW,ESTABLISHED -j ACCEPT` `sudo iptables -A INPUT -p tcp --sport 22
    -m 192.168.0.100 --ctstate ESTABLISHED -j ACCEPT`


    **Note:** *You can also specify other protocols, such as: udp -OR- icmp. To control
    ICMP traffic on ip6tables, use ipv6.*


    When you’re done making changes to the firewall, you need to commit them to save
    them. Otherwise they will be lost the next reboot, or if the firewall is restarted.
    To commit the firewall change, type: `sudo iptables-save` **Note:** *Depending
    the distro you’re running this can be different.* **Tip:** *To clear all the currently
    configured rules, use flush command:* sudo iptables -F*


    There are several utilities available that can make iptables a little easier to
    manage. For example, Ubuntu comes with the ufw command. ufw is a front-end for
    iptables. The main goal of this utility to make managing the firewall easier by
    providing a simpler interface.


    Check the status of the firewall, type: `sudo ufw status`


    Enable/disable the firewall, type: `sudo ufw enable | disable`


    Add a firewall rule, type: `sudo ufw allow 22/tcp | ssh/tcp`


    To delete a firewall rule, type: `sudo ufw delete 443/tcp`


    Enable/disable firewall logging, type: `sudo ufw logging on | off`


    This section covers advanced firewall operations such as backing up, exporting
    and reimporting firewall sets into other systems. It also covers the basics of
    blocking some types of network attacks with a firewall. You can leverage the knowledge
    from this section to block modern and advanced threats that are constantly changing
    every day.


    **Exporting and Reimporting Firewall Rules** It is possible to export the existing
    firewall rules, then edit and then reimport them. Use the command to dump the
    current rules, you can edit them, and then you can upload the edited rules back
    into the firewall. This is also a good way to back up a set of rules that work
    properly, and/or import them on another system. To export the firewall rules,
    type: `sudo iptables-save > iptables_v4.rules`


    To import the firewall rules, type: `sudo iptables-restore < iptables_v4.rules`


    **Note:** *The IPv6 equivalents of these commands are ip6tables-save and ip6tables-restore.*


    There are some rules that you can use to block invalid TCP packets. This feature
    helps protect your system from certain types of attacks. The TCP module supports
    an argument called --tcp-flags that allows for monitoring of individual TCP flags.
    This argument takes two values: "mask" and a set of "compared flags". The mask
    tell the firewall which flags that should be checked, while the compared flags
    directs which of the flags should be checked in the packet.


    Drops all packets that contain the following flags (utilized by Christmas tree
    attack), type: `sudo iptables -A INPUT -p tcp -m tcp --tcp-flags ALL FIN,PSH,URG
    -j DROP`


    Drops all packets that contain the following flags (drops invalid SYN and FIN
    packets), type: `sudo iptables -A INPUT -p tcp -m tcp --tcp-flags SYN,FIN SYN,FIN
    -j DROP`


    Linux provides a robust set of utilities for managing storage devices. This section
    provides a high-level overview of these commands, and a synopsis of how storage
    is utilized by the filesystem.


    - Layer 4: **File and directories**

    - Layer 3: **Filesystem** (i.e. EXT4, etc.)

    - Layer 2: **Partition** (i.e. MBR or GPT) [Optional: Abstraction sublayer, such
    as RAID, LUN, etc.]

    - Layer 1: **Storage** (Physical or Virtual)

    - Layer 0: **Infrastructure** (i.e. Hardware, VM, Cloud, IoT, etc.)


    The first key concept is called ''block storage'' or known by the kernel as a
    ''block device''. A block device, can be a traditional spinning disk like a hard
    drive (HDD), or solid-state storage device such as an SSD or USB flash drive.
    The kernel stores and retrieves data from these devices in fixed sized units of
    storage called ''blocks''. This is just a different way to think about traditional
    storage attached to the computer that is access by the filesystem. When the filesystem
    partitions a storage device, it segments the available storage on the device into
    smaller units. So let’s say you have a storage device that has 1 terabyte of storage.
    Instead of storing everything in a 1TB drive, it is possible to split the local
    storage into two 512 gigabyte partitions, and make it look like to different disks
    to the filesystem. This allows you to logically separate the data. For example,
    on the first partition is the OS and applications, and on the second partition
    is your data.


    **Partition**


    When you create a partition, you have to create a partition table, which is an
    index of all the data and where it is stored in that partition. There are few
    different types of partition tables.

