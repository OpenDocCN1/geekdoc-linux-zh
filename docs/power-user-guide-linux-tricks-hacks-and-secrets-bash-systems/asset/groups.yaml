    ## Persistent Variables


    Since variables (i.e. Environment and Shell) are stored in RAM they are temporal,
    and will disappear when the shell''s process is killed or the computer is shutdown.
    Persistent variables are stored in a configuration file and loaded when the system
    is loaded or when the shell starts.


    When creating predefined variables at login depends upon how Bash was started
    and which configuration file gets loaded. There are basically four different user
    session types (aka login shell), Login, Non-Login, Interactive, and Non-Interactive.


    - **Login**: A shell session begins after a user authenticates (i.e. local or
    ssh terminal session). The login shell session reads the configuration details
    from the *etc/profile* file. It will then search for the first user login shell
    configuration file in the user’s home directory to load any user-specific configuration
    (i.e. ~/.bash_profile -OR- ~/.bash_login -OR- ~/.profile ).


    - **Non-Login**: When a new shell is started from within an authenticated login
    session. For example, when you run a Bash command from the terminal, a non-login
    shell session (under the logged in user''s credentials) is started. A non-login
    shell session reads the *etc/bash.bashrc* file and then the user-specific ~/.bashrc
    file to configure the environment.


    - **Interactive**: A shell session that is attached to a terminal and in use.
    For example, an ssh session is defined as an interactive login shell.


    - **Non-Interactive**: A shell session is one that is not attached to a terminal
    session, and not currently in use. For example, when you run a script from the
    command line run in a non-interactive, non-login shell. Non-interactive shell
    sessions first read the environment variable named BASH_ENV, and then reads the
    file specified in this variable to setup the new shell environment.


    **Tip:** To force your current shell session to re-read the config file, type:

    `source ~/.bashrc`


    **Notes:** *Individual user defined variable (not system wide) that can be made
    available to both login and non-login shell sessions can be define in the ~/.bashrc
    file.*

    *To create system wide environmental variables, you need to add the variable definition(s)
    to one of the following files: /etc/profile, /etc/bash.bashrc, /etc/environment*


    ## Shell vs. Environment vs. Persistent Variables


    If you look at a hierarchical chart showing the different layers of the operating
    system, with the user layer where you run your commands at the top, and hardware
    at bottom. This is where you can see the difference between shells vs. environment
    variables. Environment variables are run at a lower level, they are available
    to all shell instances. Also since persistent variables are loaded from a configuration
    file at the computer or shell startup, they can withstand the process being killed
    or computer being turned off.


    ### System Layers: Shell/Environment/Persistent Variables


    | Layer | Description |

    | :--- | :--- |

    | **User Layer** | Commands/Programs (Console) |

    | **Shell (Instance)** | Shell Variables: These variables are only available in
    the current instance of the shell. Multiple instances of the shell can be running,
    each with own unique set of variables. |

    | **Operating System Layer** | Environmental variables: These variables are available
    to all shell instances. Persistent Variables: These are loaded from a configuration
    file at startup of the computer or shell. |

    | **Kernel** | This is where the modules, drivers, etc. are loaded. |

    | **Hardware Layer** | (i.e. the CPU, RAM, Storage, NIC) |


    ## String Types


    Bash only supports a few different types of variables, such as: strings, integers,
    arrays and readonly. By default Bash will treat all variables as strings, unless
    otherwise declared. You''re even allowed to perform mathematical operation on
    a string even though it''s not an integer.


    For example, if you typed:

    ```bash

    a=1234

    let "a += 1"

    echo "a = $a"

    ```

    The output of $a would be 1235


    Now if you declare $a as being an integer:

    ```bash

    a=1234

    declare -i a

    let "a += 1"

    echo "a = $a"

    ```

    The output of $a would be 1235


    Using the declare command, you can also make a variable readonly, which means
    it can''t be modified, it can only be deleted.


    For example, if you typed:

    ```bash

    declare -r a=1234

    let "a += 1"

    echo "a = $a"

    ```

    The output of $a would be 1234


    Bash also supports array variables, which allow one variable to hold related information
    (or values). It basically is one variable that acts like many, each set of values
    has an index value of 0 to ….


    For example, to create an array of Linux distros, type:

    ```bash

    Distro[0]=''Red Hat''

    Distro[1]=''Debian''

    Distro[2]=''Ubuntu''

    ```

    To see the value in the array under the Index of 2, type: `echo ${Distro[2]}`


    **Tip:** To create an array of Linux distros, type: `Distro[0]=''Red Hat''`, `Distro[1]=''Debian''`,
    `Distro[2]=''Ubuntu''`. To see the value in the array under the Index of 2, type:
    `echo ${Distro[2]}`.


    **Notes:** *Individual user defined variable (not system wide) that can be made
    available to both login and non-login shell sessions can be define in the ~/.bashrc
    file.*

    *To create system wide environmental variables, you need to add the variable definition(s)
    to one of the following files: /etc/profile, /etc/bash.bashrc, /etc/environment*


