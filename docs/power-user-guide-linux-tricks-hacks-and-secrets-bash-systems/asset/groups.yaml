    建议这是用于软链接）。*


    tree 命令的替代方案，类型：ls -R | grep ":$" | sed -e ''s/:$/*'' -e ''s\[^-\][^\/\]\//--/g''
    -e ''s/^/ *'' -e ''s\-/|/''


