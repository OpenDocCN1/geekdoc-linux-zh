- md: "\n## Wildcards and Regular Expression\n\n**Overview:** This chapter provides\
    \ an overview of Wildcards and Regular Expressions. Wildcards are used to give\
    \ you the ability to substitute one or more text characters. While Regular Expressions\
    \ gives you the ability to write an expression to match text patterns.\n\nWildcards\
    \ give you the ability to substitute one or more characters in a string of characters.\
    \ These patterns that are replaced tend to be very simple. For example, if there\
    \ were three files that you wanted to delete, with the following filenames: file1.txt,\
    \ file2.txt, file3.txt. The command rm file???.txt would delete these files. The\
    \ ‘?’ (question mark) is a wildcard for any single letter or number.\n\nRegular\
    \ Expression gives you the ability to write an expression to match string patterns\
    \ of characters in a file or program output (i.e. STDOUT). These patterns tend\
    \ to range from simple to very complex, depending on what you’re trying to match.\n\
    \nExamples of some Regular Expression pattern matching will be discussed in more\
    \ depth later in this section. Although, this is only a primer meant to give you\
    \ a brief introduction to the technology.\n\n## Wildcards\n\nWildcards are very\
    \ often used in the selection of a set of files that have a similar name to perform\
    \ some type of file operation. Although, other applications use wildcards for\
    \ searching other types of data as well.\n\nThere two types wildcard operators:\n\
    \n- **?** = represents only one character [a-z], [A-Z], [0-9]\n  **Example:**\
    \ `chmod 777 ???file` (Effects files in the current directory with names like:\
    \ 001file, 002file, etc.)\n- ***** ** = represents one or more characters [a-z],\
    \ [A-Z], [0-9]\n  **Example:** `chmod 777 *` (Effects all files in the current\
    \ directory)\n\n## Regular Expression\n\nRegular Expression often referred to\
    \ as RegEx for short, allows you to write simple or complex search patterns that\
    \ can match strings in a file's name, data in a file (i.e. logs), etc. RegEx can\
    \ be very powerful, and very confusing until you get used to it. If it doesn’t\
    \ make sense first, keep working with it.\n\n**Example:** `^\\D+\\d{4}.jpg` MATCHES\
    \ PICP0119.jpg (or any other four-digit number preceded by at least one non-digit\
    \ character).\n\nThis subchapter, only provides a very brief introduction to the\
    \ RegEx, if you would like to learn more about it, I would like to refer you to\
    \ the many great references that are available.\n\n**Note:** *There are a few\
    \ different variants of RegEx, so this reference may not properly align with all\
    \ versions that are available. Although, it should provide enough general reference\
    \ that you can apply what you learn from it.*\n\n| Token | Description | Example\
    \ |\n| :--- | :--- | :--- |\n| (a\\|b) | Characters a or b (Groups and Ranges)\
    \ | |\n| (?:...) | Passive (non-capturing) group (Groups and Ranges) | |\n| \\\
    n | nth group/subpattern (Groups and Ranges) | |\n| ^ | -or- The caret sign is\
    \ used as an anchor to search the start of a string. (Anchor) | ^abc matches ‘abcdef’\
    \ OR ‘abc123’, NOT ‘123abc’ |\n| \\$ | -or- The dollar sign is used as an anchor\
    \ to search the end of a string. (Anchor) | abc$ matches ‘123abc’, NOT ‘abc123’.\
    \ Advanced: ^abc(.*)123$ matches abcxyz123 |\n| . | The period character matches\
    \ any single character (except new line [\\n]). (Groups and Ranges) | a.c MATCHES\
    \ abc OR adc, NOT abd |\n| \\* | The asterisk matches zero or more occurrences\
    \ of a previous expression. **Note:** *Combine the asterisk with a period to form\
    \ a ‘match anything’ expression (.*).* | ab\\*c MATCHES abc OR abbc, NOT adc |\n\
    | + | The plus sign matches one or more occurrences of the previous expression.\
    \ | ab+c MATCHES abc OR abbc NOT ac |\n| ? | The question mark matches either\
    \ zero or one occurrence of the previous expression. | ab?c MATCHES ac OR abc\
    \ NOT abbc |\n| \\| | The piping (vertical bar) separates two or more characters\
    \ or expressions, any of which may match. [Logical OR] | a\\|b MATCHES a OR b;\
    \ a(b\\|c)d MATCHES abd OR acd |\n| {} | Braces indicate that the preceding expression\
    \ must match an exact number of times. [Quantifier] | ab{2}c MATCHES abbc NOT\
    \ abc OR abbbc |\n| [] | Matches any single character in the set of specified\
    \ characters. [Character Set] (Groups and Ranges) | \\[abc\\] MATCHES a, b OR\
    \ c; \\[af-j\\] MATCHES f, g, h OR j |\n| [^] | Matches any character not in the\
    \ set of specified characters. [Negative character set] (Groups and Ranges) |\
    \ \\[^qr\\] MATCHES any except pqr |\n| () | Parentheses combine multiple characters\
    \ into an expression. [Capture Group/Expression] (Groups and Ranges) | a|(bc)\
    \ MATCHES |\n| \\\\ | The backslashes escape characters in order to match those\
    \ characters literally. [Escape Character] **Note:** *The backslash is used before\
    \ a non-token character to indicate the following special characters:* \\t = tab\
    \ ($9); \\r = return ($d); \\v = vertical tab ($b); \\f = form feed ($c); \\n\
    \ = new line ($a); \\e = escape ($b); \\O = matches an octal digit (Character\
    \ Class); \\x = matches an ASCII character specified as a two-digit hexadecimal\
    \ number, e.g. \\x20 matches a space. (Class); \\U = matches a Unicode character\
    \ specified as a four-digit hexadecimal number, e.g.* | |\n| \\b | Restricted\
    \ by word boundary (Anchor) | |\n| \\B | Not restricted by word boundary (Anchor)\
    \ | |\n| \\< | Start of word (Anchor) | |\n| > | End of word (Anchor) | |\n| \\\
    w | Matches any word character. Equivalent to [a-zA-Z0-9]. [Word Character] |\
    \ ^w+[0-9]{4} MATCHES PICP0119 (or any other four-digit number preceded by at\
    \ least one word character). |\n| \\W | Matches any non-word character, equivalent\
    \ to [^a-zA-Z0-9]. [Non-Word Character] | |\n| \\s | Matches any whitespace character.\
    \ Equivalent to [\\n\\r\\t]. [Space Character] (Character Class) | |\n| \\S |\
    \ Matches any non-whitespace character. Equivalent to [^\\n\\r\\t]. [Space Character]\
    \ (Character Class) | |\n| \\d | Matches any decimal digit. Equivalent to [0-9].\
    \ [Digit Character] (Character Class) | |\n| \\D | Matches any decimal digit.\
    \ Equivalent to [^0-9]. [Non-Digit Character] (Class) | ^\\D+\\d{4} MATCHES PICP0119\
    \ (or any other four-digit number preceded by at least one non-digit character).\
    \ |\n| |= | Look ahead assertion (Assertion) | |\n| ?! | Negative look ahead (Assertion)\
    \ | |\n| ?<= | Look behind assertion (Assertion) | |\n| ?!= | Negative look behind\
    \ (Assertion) | |\n| ?<! | (Assertion) | |\n| ?> | Once-only Subexpression (Assertion)\
    \ | |\n| ?() | Condition [if then] (Assertion) | |\n| ?()| Condition [if then\
    \ else] (Assertion) | |\n| ?# | Comment (Assertion) | |\n| $n | nth non-passive\
    \ group (String Replacement) | |\n| $2 | \"xyz\" in ^abc(xyz))$ (String Replacement)\
    \ | |\n| $1 | \"xyz\" in ^(?:abc)(xyz)$ (String Replacement) | |\n| \\` | Before\
    \ matched string (String Replacement) | |\n| $' | After matched string (String\
    \ Replacement) | |\n| $+ | Last matched string (String Replacement) | |\n| \\\
    & | Entire matched string (String Replacement) | |\n| \\* | 0 or more (Quantifier)\
    \ | |\n| + | 1 or more (Quantifier) | |\n| ? | or 1 (Quantifier) | |\n| {3} |\
    \ Exactly 3 (Quantifier) | |\n| {3,} | 3 or more (Quantifier) | |\n| {3,5} | 3,\
    \ 4 or 5 (Quantifier) | |\n\n## Bash Scripting\n\n**Overview:** This chapter provides\
    \ an introduction to scripting using the BASH builtin and external commands. This\
    \ overview provides you with the basics you will need to get started scripting\
    \ using this technology.\n\nThis chapter assumes that you have written a script\
    \ before, and you have a basic understanding of Linux and BASH. This topic will\
    \ only be covered at a high level in order to provide a basic foundation on which\
    \ you can build upon. If you need a more basic tutorial, I would highly recommend\
    \ checking out other resources available (i.e. web sites or books).\n\nA script\
    \ is nothing more than a text file with a predefined list of commands in a sequential\
    \ order with some conditional branching and looping included to complete a specific\
    \ task. The commands are passed into a command interpreter that processes them.\n\
    \nFor example, by following the instructions below, it will create a script that\
    \ lists all the files in the root directory with the following command: ls -al\
    \ / . By adding more commands to this script you can add additional functionality.\n\
    \nIf you're going to do programming using the BASH shell, this shell only provides\
    \ very basic command support. If you need to do more advanced scripting then you\
    \ will have to use another language. Right now, I would suggest checking out Python,\
    \ or any of the other popular general purpose scripting languages. There are also\
    \ other languages like Perl, Ruby, etc., there is nothing wrong with them. Python\
    \ is just the most popular at the time of writing of this book.\n"
  mdcn: "\n\n## 通配符与正则表达式\n\n**概述：** 本章将概述通配符（Wildcards）和正则表达式（Regular Expressions）。通配符允许你替换一个或多个文本字符。而正则表达式允许你编写一个表达式来匹配文本模式。\n\
    \n通配符允许你在一个字符字符串中替换一个或多个字符。这些被替换的模式通常非常简单。例如，如果你有三个想要删除的文件，文件名如下：file1.txt, file2.txt,\
    \ file3.txt。执行命令 `rm file???.txt` 就会删除这些文件。`?`（问号）是任意单个字母或数字的通配符。\n\n正则表达式允许你编写一个表达式来匹配文件或程序输出（即标准输出\
    \ STDOUT）中的字符字符串模式。这些模式的范围从简单到非常复杂，取决于你尝试匹配的内容。\n\n在本节的后后部分，我们将更深入地讨论一些正则表达式模式匹配的示例。不过，这只是一个旨在向你简要介绍该技术的入门教程。\n\
    \n## 通配符\n\n通配符经常用于选择一组具有相似名称的文件以执行某种类型的文件操作。尽管如此，其他应用程序也会使用通配符来搜索其他类型的数据。\n\n\
    有两种类型的通配符运算符：\n\n- **?** = 代表仅一个字符 [a-z], [A-Z], [0-9]\n  **示例：** `chmod 777 ???file`（影响当前目录中名称类似于\
    \ 001file, 002file, 等的文件）\n- ***** ** =** 代表一个或多个字符 [a-z], [A-Z], [0-9]\n  **示例：**\
    \ `chmod 777 *`（影响当前目录下的所有文件）\n\n## 正则表达式\n\n正则表达式通常简称为 RegEx，允许你编写简单或复杂的搜索模式，可以匹配文件名、文件中的数据（如日志）等字符串。RegEx\
    \ 可以非常强大，但在你习惯之前会让你非常困惑。如果起初看起来不合逻辑，请继续尝试使用。\n\n**示例：** `^\\D+\\d{4}.jpg` 匹配 PICP0119.jpg（或任何在至少一个非数字字符之前的四位数字）。\n\
    \n本小节仅提供对 RegEx 的非常简短的介绍，如果你想了解更多信息，我想向你推荐许多优秀的参考资料。\n\n**注意：** *RegEx 有几种不同的变体，因此此参考可能无法与所有可用版本完美对齐。尽管如此，它应该提供足够的通用参考，让你能够应用从中中学到的知识。*\n\
    \n| 标记 (Token) | 说明 | 示例 |\n| :--- | :--- | :--- |\n| (a\\|b) | 字符 a 或 b（分组和范围）\
    \ | |\n| (?:...) | 惰性（非捕获）分组（分组和范围） | |\n| \\n | 第 n 组/子模式（分组和范围） | |\n| ^ | -或-\
    \ 插入符号（脱字符符号错误，此处为caret符号）用作锚点搜索字符串的开头。（锚点） | ^abc 匹配 ‘abcdef’ 或 ‘abc123’，不匹配\
    \ ‘123abc’ |\n| \\$ | -或- 美元符号用作锚点搜索字符串的末尾。（锚点） | abc$ 匹配 ‘123abc’，不匹配 ‘abc123’。高级：^abc(.*)123$\
    \ 匹配 abcxyz123 |\n| . | 点字符匹配任意单个字符（换行符 [\\n] 除外）。分组和范围） | a.c 匹配 abc 或 adc，不匹配\
    \ abd |\n| \\* | 星号匹配前一个表达式的零次或多次。**注意：** *将星号与点结合形成“匹配任意”表达式 (.*)。* | ab\\*c\
    \ 匹配 abc 或 abbc，不匹配 adc |\n| + | 加号匹配前一个表达式的一次或多次。 | ab+c 匹配 abc 或 abbc，不匹配 ac\
    \ |\n| ? | 问号匹配前一个表达式的零次或一次出现。 | ab?c 匹配 ac 或 abc，不匹配 abbc |\n| \\| | 管道（竖线）分隔两个或多个字符或表达式，其中任何一个都可能匹配。[逻辑“或”]\
    \ | a\\|b 匹配 a 或 b；a(b\\|c)d 匹配 abd 或 acd |\n| {} | 大括号表示前面的表达式必须匹配精确的次数。[量化符]\
    \ | ab{2}c 匹配 abbc，不匹配 abc 或 abbbc |\n| [] | 匹配指定字符集中的任意单个字符。[字符集]（分组和范围） | \\\
    [abc\\] 匹配 a, b 或 c；\\[af-j\\] 匹配 f, g, h 或 j |\n| [^] | 匹配不在指定字符集中的任意字符。[否定字符集]（分组和范围）\
    \ | \\[^qr\\] 匹配 pqr 以外的任意字符 |\n| () | 括号将多个字符组合为一个表达式。[捕获组/表达式]（分组和范围） | a|(bc)\
    \ 匹配 |\n| \\\\ | 反斜杠转义字符以字面意思匹配这些字符。[转义字符] **注意：** *反斜杠用于非标记字符之前指示后续特殊字符：* \\\
    t = 制表符 ($9); \\r = 回 ($d); \\v = 垂直制表符 ($b); \\f = 符 ($c); \\n = 换行 ($a); \\\
    e = 转义 ($b); \\O = 匹配八进制数字（字符类）；\\x = 匹配 ASCII | |\n\n## Bash 脚本\n\n**概述：** 本章将介绍使用\
    \ BASH 内置命令和外部命令进行脚本。本概述为你提供了使用该技术所需的基础知识。\n\n本章假设你以前写过脚本，并且对 Linux 和 BASH 有基础了解。此主题仅从高层次进行涵盖，以提供一个你可以在其基础上构建的基础。脚本本质上是一个按顺序排列的命令列表的文本文件，并包含条件分支和循环以完成特定任务。这些命令被传递给命令解释器进行处理。\n\
    \n例如，通过下面的指令，将创建一个列出根目录下所有文件的脚本，使用的命令为 `ls -al /` 。通过向此脚本添加更多命令，你可以添加额外功能。\n\n"
