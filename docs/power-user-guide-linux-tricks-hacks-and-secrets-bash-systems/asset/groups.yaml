    勘误、更新与书籍支持


    我们尽力确保本书的准确性并。你可以通过 http://www.jasonsavitt.info/linuxsecrets/errata 以提交的勘误列表及其相关更正的形式访问本书的更新。如果你发现了未列出的错误，请发送电子邮件至
    support@jasonsavitt.info。请注意，微软软件和硬件的产品支持不通过之前的地址提供。如需微软软件或硬件的帮助，请访问 http://support.microsoft.com。


