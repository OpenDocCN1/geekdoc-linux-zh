- md: "\nThere is a newer and improved version of vi called vim, which is a contraction\
    \ of \"Vi IM Improved\". It was first released publicly in 1991 on the Amiga computer.\
    \ It is backwards compatible with vi and includes several enhancements.\n\n**Note:**\
    \ *Some distros, include only vim and alias from vi to it.*\n\n## Starting the\
    \ program\n\nBelow are commands for starting the text editor, more options are\
    \ available in the help files (i.e. man vim ): \n\n- `vi **file**` Edits or creates\
    \ a file (creates a new file if specified).\n- `vi -r` Shows rescued files.\n\
    - `vi -r **file**` Recovers a rescued file.\n- `vi +n **file**` Edits file and\
    \ places cursor at line (n).\n\nInsertion and Command Modes\n\nvi has two main\
    \ modes, Insertion and command mode. This section includes core concepts that\
    \ are utilized, it's important to understand the differences between these two\
    \ modes.\n\nThe editor starts in command mode, in which cursor movement can happen,\
    \ along with text pasting and deletion can occur. When in Insertion mode (in the\
    \ command Mode, press \"i\" or \"I\" key) is activated, the user can enter and\
    \ modify text in the file. Pressing the ESC key (while in Insertion mode) returns\
    \ the editor back to command mode (for example, where you can save and quit, by\
    \ typing :x ).\n\nWhen in command mode most commands are executed as soon as they\
    \ are typed, except for \"colon\" commands (i.e. :q! ) they're executed after\
    \ you press the Enter key.\n\n## Quitting the program\n\nThese commands are for\
    \ quitting the program, and save the file changes or abandoning them.\n\n- `:x`\
    \ Exit, and saving changes\n- `:wq **file**` Quits the program (creates a new\
    \ file if specified)\n- `:q!` Quit (force, even if unsaved)\n- `:qa!` Quit everything\
    \ (force, even if unsaved)\n\n## Inserting text\n\nThese commands are for modifying\
    \ text, by inserting, appending, and replacing it. You have to be in the command\
    \ mode to use these features.\n\n- `i` Insert before cursor\n- `I` Insert before\
    \ line\n- `a` Append after cursor\n- `A` Append after line\n- `o` Open new line\
    \ after the current line\n- `O` Open new line before the current line\n- `r` Replace\
    \ one character\n- `R` Replace many characters\n\n## Cursor Movement\n\nThese\
    \ commands are moving the cursor around the screen and document. You have to be\
    \ in the command mode to use these features.\n\n- `h` Move cursor left\n- `j`\
    \ Move cursor down\n- `k` Move cursor up\n- `l` Move cursor right\n- `w` Next\
    \ word\n- `W` Next blank delimited word\n- `b` Beginning of the word\n- `B` Beginning\
    \ of blank delimited word\n- `e` End of the word\n- `E` End of Blank delimited\
    \ word (Sentence back)\n- `;` Sentence forward\n- `{` Paragraph back\n- `}` Paragraph\
    \ forward\n- `0` Beginning of line\n- `$` End of line\n- `1G` Beginning of file\n\
    - `G` End of file\n- `nG` (n)th line of the file\n- `:n` (n)th line of the file\n\
    - `fc` Forward to (c)[character]\n- `Fc` Back to (c)[character]\n- `tc` Forward\
    \ to before (c)[character]\n- `Tc` Back to before (c)[character]\n- `H` Top of\
    \ screen\n- `M` Middle of screen\n- `L` Bottom of screen\n- `%` Move to associated\
    \ ( ), { }, [ \\]\n\n## Deleting text\n\nThese commands are for deleting text\
    \ on the screen and document. You have to be in the command mode to use these\
    \ features.\n\n- `x` Deletes character, right of cursor\n- `X` Deletes character,\
    \ left of cursor\n- `D` Deletes all character to the end of the line\n- `dd` Deletes\
    \ current line\n- `:d` Deletes current line\n\n## Changing text\n\nThese commands\
    \ are for changing text on the screen and document. You have to be in the command\
    \ mode to use these features.\n\n- `C` Changes to end of the line\n- `cc` Changes\
    \ the whole line\n\n**Tip:** *cw changes a word.*\n\n## Yanking text\n\nThink\
    \ of this command as the GUI equivalent of the COPY function. You have to be in\
    \ the command mode to use these features.\n\n- `yy` Yank line\n- `:y` Yank line\n\
    \n**Tip:** *y$ yanks to the end of line.*\n\n## Putting text (used after yanking\
    \ text)\n\nThink of this command as the GUI equivalent of the PASTE function.\
    \ You have to be in the command mode to use these features.\n\n- `p` Puts text\
    \ after position or line\n- `P` Puts text before position or line\n\n**Tips:**\
    \ *Named registers can be specified before you use a delete, change, yank or put\
    \ command. You can prefix any of these commands with any lowercase character,\
    \ for example, if you press \"adw\" (this deletes a word then buffers it into\
    \ 'a'). Now anytime you press \"ap\", it will paste back the text that was modified.*\n\
    \n*Nearly every command may be preceded by a number that specifies how many times\
    \ you want it to be repeated. For example, \"5dw\" will delete 5 words, and 3fe\
    \ will move the cursor forward to the 3rd occurrence of the letter e. Even insertions\
    \ may be repeated. For example, to insert the same line 100 times.*\n\n## Named\
    \ Markers\n\nNamed markers can be set on any line in a file. A marker name can\
    \ be any lowercase letter ('c' represents the named marker that you have chosen).\
    \ Markers may also be used as limits for ranges.\n\n- `mc` Sets marker (c) on\
    \ the current line\n- `` `c `` Move to beginning of marked (c) line.\n- `'c` Move\
    \ to beginning of marked (c) line.\n\n## Searching for Text\n\nThese commands\
    \ are for searching text within the document. You have to be in the command mode\
    \ to use these features.\n\n- `/` Search forward\n- `?` Search backward\n- `n`\
    \ Next occurrence\n- `N` Previous occurrence\n\n## Regular Expressions\n\nThese\
    \ are some regular expression commands that can enhance your ability to search\
    \ specific text.\n\n- `.` Any character\n- `^` Beginning of line\n- `$` End of\
    \ line\n- `\\n` Newline\n- `\\w` Word character\n- `\\d` Digit character\n- `\\\
    b` Start of word\n- `\\B` End of word\n- `*` Zero or more\n- `+` One or more\n\
    - `?` Zero or one\n- `[]` Character set\n- `() ` Grouping\n- `|` OR operator\n\
    \n## Sets\n\nSets are extensions of regular expression functionality, can be used\
    \ for fine tuning.\n\n- `a` Case insensitive search\n- `A` Case insensitive search\
    \ at end of line\n- `c` Match whole word\n- `C` Match whole word at end of line\n\
    - `s` Match except line\n- `S` Match except line at end of line\n- `b` Match before\
    \ word\n- `B` Match after word\n- `u` Lowercase only\n- `U` Uppercase only\n-\
    \ `w` Match word character\n- `W` Match non-word character\n- `s` Match whitespace\
    \ character\n- `S` Match non-whitespace character\n- `d` Match digit character\n\
    - `R` Match non-digit character\n- `v` Match vertical character\n- `V` Match non-vertical\
    \ character\n- `z` Match lowercase character\n- `Z` Match non-lowercase character\n\
    - `^` Match any character except\n- `[^` Match any character except in the set\n\
    \n## Ranges\n\nRanges causes actions to be executed on one line or more lines.\
    \ You have to be in the command mode to use these features.\n\n- `.` Current line\n\
    - `$` Last line\n- `%` All lines in file\n- `:.` Current line\n- `:n,m` Lines\
    \ n-m\n\n**Note:** *Ranges can be combined with the *:s command to perform a replacement\
    \ on several lines. For example, :,$s/pattern/string/g would replace the pattern\
    \ with the string from the current line to the end of the file.*\n\n## Files commands\n\
    \nThese are some file commands for reading data into the editor, and writing data\
    \ back out of it. You have to be in the command mode to use these features.\n\n\
    - `:r` Read a file\n- `:w` Save the file\n- `:x` Save and quit\n\n## Examples:\
    \ Regular Expression (Advanced)\n\nThese are some advanced regular expression\
    \ commands that can enhance your ability to search specific text patterns within\
    \ a document that you're in. You have to be in the command mode to use these features.\
    \ For example, press the ESC key and then type /HelloWorld/ to match all lines\
    \ containing.\n\n**Note:** *Regular expressions are case sensitive*\n\n- `/HelloWorld`\
    \ Matches lines containing HelloWorld\n- `/^HelloWorld$` Matches lines containing\
    \ HelloWorld only\n- `/^[a-zA-Z]` Matches lines starting with any letter.\n- `/^a-z].*/`\
    \ Matches lines starting with a-z, followed by at least one character.\n- `/1234$`\
    \ Matches lines that end with 1234\n- `/(43|76)` Matches lines contains 43 or\
    \ 76.\n\n**Note:** *Use of ( ) and the pipe symbol specifies an 'or' condition.*\n\
    \n- `/[0-9]*` Matches zero or more numbers in the line\n- `/^[^#]` Matches if\
    \ the first character is not the # on the line\n- `[^^]` Match any character except\
    \ in the set\n"
  mdcn: '

    有一个比 vi 更新且改进的版本称为 vim，它是“Vi IM Improved”的缩写。它于1991年在 Amiga 计算机上首次公开发布。它与 vi 向后兼容，并包含了若干增强。


    **注意：** *某些发行版仅包含 vim，并将 vi 的别名别了它。*


    ## 启动程序


    以下是启动文本编辑器的命令，更多选项可以在帮助文件中找到（例如 `man vim`）：


    - `vi **file**` 编辑或创建文件（如果指定了则创建一个新文件）。

    - `vi -r` 显示恢复的文件。

    - `vi -r **file**` 恢复一个已恢复的文件。

    - `vi +n **file**` 编辑文件并将光标置于第 (n) 行。


    ## 插入模式和命令模式


    vi 有两种主要模式：插入模式和命令模式。本节包含了用到的核心概念，理解这两种模式之间的区别至关重要。


    编辑器以命令模式启动，在此模式下可以进行光标移动以及文本的粘贴和删除。当激活插入模式（在命令模式下按下 "i" 或 "I" 键）时，用户可以进入并修改文件中的文本。按下
    ESC 键（在插入模式下）将编辑器返回到命令模式（例如，通过输入 :x 可以保存并退出）。


    在命令模式下，大多数命令在输入后立即执行，但“冒号”命令（例如 :q!）除外，它们在你按下回车键后执行。


    ## 退出程序


    这些命令用于退出程序，并保存文件更改或放弃更改。


    - `:x` 退出并保存更改

    - `:wq **file**` 退出程序（如果指定了则创建一个新文件）

    - `:q!` 退出（强制，即使未保存）

    - `:qa!` 退出所有（强制，即使未保存）


    ## 插入文本


    这些命令用于通过插入、追加和替换来修改文本。你必须在命令模式下才能使用这些功能。


    - `i` 在光标前插入

    - `I` 在行首插入

    - `a` 在光标后追加

    - `A` 在行尾追加

    - `o` 在当前行之后开启新行

    - `O` 在当前行之前开启新行

    - `r` 替换一个字符

    - `R` 替换多个字符


    ## 光标移动


    这些命令用于在屏幕和文档中移动光标。你必须在命令模式下才能使用这些功能。


    - `h` 光标向左移动

    - `j` 光标向下移动

    - `k` 光标向上移动

    - `l` 光标向右移动

    - `w` 下一个单词

    - `W` 下一个空白分隔的单词

    - `b` 单词开头

    - `B` 空白分隔单词的开头

    - `e` 单词结尾

    - `E` 空白分隔单词的结尾（上一个句子）

    - `;` 句子向前移动

    - `{` 段落后退

    - `}` 段落向前移动

    - `0` 行首

    - `$` 行尾

    - `1G` 文件开头

    - `G` 文件末尾

    - `nG` 文件的第 (n) 行

    - `:n` 文件的第 (n) 行

    - `fc` 向前到 (c)[字符]

    - `Fc` 回到 (c)[字符]

    - `tc` 向前到 (c)[字符] 之前

    - `Tc` 回到 (c)[字符] 之前

    - `H` 屏幕顶部

    - `M` 屏幕中部

    - `L` 屏幕底部

    - `%` 移动到关联的 ( ), { }, [ \]


    ## 删除文本


    这些命令用于删除屏幕和文档上的文本。你必须在命令模式下才能使用这些功能。


    - `x` 删除光标右侧字符

    - `X` 删除光标左侧字符

    - `D` 删除到行尾的所有字符

    - `dd` 删除当前行

    - `:d` 删除当前行


    ## 修改文本


    这些命令用于修改屏幕和文档上的文本。你必须在命令模式下才能使用这些功能。


    - `C` 修改到行尾

    - `cc` 修改整行


    **提示：** *cw 修改一个单词。*


    ## 复制文本 (Yanking)


    将此命令视为 GUI 中的“复制”（COPY）功能即可。你必须在命令模式下才能使用这些功能。


    - `yy` 复制当前行

    - `:y` 复制当前行


    **提示：** *y$ 复制到行尾。*


    ## 粘贴文本（用于复制文本后）


    将此命令视为 GUI 中的“粘贴”（PASTE）功能即可。你必须在命令模式下才能使用这些功能。


    - `p` 在位置或行之后粘贴文本

    - `P` 在位置或行之前粘贴文本


    **提示：** *在使用删除、修改、复制或粘贴命令之前，可以指定命名寄存器。你可以在任何这些命令前加上任何小写字母作为前缀，例如，如果你按下 "adw"这会删除一个单词并将其存入缓冲区
    ''a''）。现在，任何时候你按下 "ap"，它都会贴回修改过的文本。*


    *几乎每个命令前面都可以跟一个数字，指定你想要重复的次数。例如，“5dw”将删除 5 个单词，“3fe”将光标向前移动到字母 e 的第 3 次出现。甚至插入也可以重复。例如，插入
    100 行相同的内容。*


    ## 命名标记 (Markers)


    命名标记可以设置在文件的任何一行上。标记名称可以是任何小写字母（''c'' 代表你选择的命名标记）。标记也可以作为范围的限制。


    - `mc` 在当前行设置标记 (c)

    - `` `c `` 移动到标记 (c) 行的开头

    - `''c` 移动到标记 (c) 行的开头


    ## 搜索文本


    这些命令用于在文档中搜索文本。你必须在命令模式下才能使用这些功能。


    - `/`Forward搜索

    - `?` 向后搜索

    - `n` 下一次出现

    - `N` 上一次出现


    ## 正则表达式


    这些是一些正则表达式命令，可以增强你搜索特定文本的能力。


    - `.` 任意字符

    - `^` 行首

    - `$` 行尾

    - `\n` 换行

    - `\w` 单词字符

    - `\d` 数字字符

    - `\b` 单词边界

    - `\B` 单词边界

    - `*` 零或多个

    - `+` 一个或多个

    - `?` 零或一个

    - `[]` 字符集

    - `()` 分组

    - `|` OR运算符


    ## 集合 (Sets)


    集合是正则表达式功能的扩展，可以用于微调。


    - `a` 不区分大小写的搜索

    - `A` 不区分大小写的在行尾搜索

    - `c` 匹配整个单词

    - `C` 匹配整个单词在行尾

    - `s` 匹配行除

    - `S` 匹配行除，在行尾

    - `d` 匹配数字字符

    - `R` 匹配非数字字符

    - `v` 匹配垂直字符

    - `V` 匹配非垂直字符

    - `z` 匹配小写字符

    - `Z` 匹配非小写字符

    - `w` 匹配单词字符

    - `W` 匹配非单词字符

    - `s` 匹配空白字符

    - `S` 匹配非空白字符

    - `^` 匹配任意字符

    - `[^` 匹配集合外的字符


    ## 范围 (Ranges)


    范围在一或多行上执行操作。你必须在命令模式下才能使用这些功能。


    - `.` 当前行

    - `$` 最后一行

    - `%` 文件所有行

    - `:.` 当前行

    - `:n,m` n 到 m 行


    **注意：** *范围可以与 *:s 命令结合，对多行进行替换。例如，,:s/pattern/g 将从当前行到文件结束的 pattern。*


    ## 文件命令


    这些是一些文件命令，用于将数据读入编辑器并将其写回。你必须在命令模式下才能使用这些功能。


    - `:r` 读取文件

    - `:w` 保存文件

    - `:x` 保存并退出


    ## 示例：正则表达式（高级）


    这些是一些高级正则表达式命令，可以增强你在所在文档中搜索特定文本模式的能力。你必须在命令模式下才能使用这些功能。例如，按下 ESC 键然后输入 /HelloWorld/
    来匹配所有包含的行。


    **注意：** *正则表达式是区分大小写的*


    - `/HelloWorld` 匹配包含 HelloWorld 的行

    - `/^HelloWorld$` 匹配仅包含 HelloWorld 的行

    - `/^[a-zA-Z]` 匹配以字母头的行

    - `/^[a-z].*/` 匹配以 a-z开头且至少跟一个字符的行

    - `/1234$` 匹配以 1234 结尾的行

    - `/(43|76)` 匹配包含 43 或 76 的行


    **注意：** *使用 ( ) 和管道符号指定“或”条件。*


    - `/[0-9]*` 匹配行中的零或多个数字

    - `/^[^#]` 匹配如果行首字符不是 #

    - `[^^]` 匹配集合外的任意字符


