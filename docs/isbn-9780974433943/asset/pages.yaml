    \ that use functions as a structured way of handling series of commands. On some\
    \ Linux systems, for instance, you will find the /etc/rc.d/init.d/functions definition\
    \ file, which is sourced in all init scripts. Using this method, common tasks\
    \ as checking if a process runs, starting or stopping a daemon, only have to be\
