  md: '# Chapter 10: More on variables


    variables. If no arguments are given, or if -p is supplied, a list of all read-only
    variables is displayed. Using the -p option, the output can be reused as input.

    The return status is zero, unless an invalid option was specified, one of the
    vari-ables or functions do not exist, or -f was supplied for a variable name instead

    of for a function name.


    ```

    [bob in ] readonly TUX=penguin

    [bob in ] TUX=Mickeysoft

    bash: TUX: readonly variable

    ```


    # 10.2 Array variables


    An array is a variable containing multiple values. Any variable may be used as
    an array. There is no maximum limit to the size of an array, nor any requirement
    that member variables be indexed or assigned contiguously. Arrays are zero-based:the
    first element is indexed with the number 0.


    Indirect declaration is done using the following syntax to declare a variable:


    ```

    ARRAY[INDEXNR]=value

    ```


    The INDEXNR is treated as an arithmetic expression that must evaluate to a pos-itive
    number.


    Explicit declaration of an array is done using the declare built-in:


    ```

    declare -a ARRAYNAME

    ```


    A declaration with an index number will also be accepted, but the index number
    will be ignored. Attributes to the array may be specified using the declare and
    readonly built-ins. Attributes apply to all variables in the array; you can''t
    have mixed arrays.


    Array variables may also be created using compound assignments in this format:


    ```

    ARRAY=(value1 value2 ... valueN)

    ```


    Each value is in the form of [indexnumber]=string. The index number is op-tional.
    If it is supplied, index is assigned to it; otherwise the index of the element
    assigned is the number of the last index that was assigned, plus one. This format
