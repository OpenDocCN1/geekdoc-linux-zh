  md: '# Chapter 5: The GNU sed editor


    # 5.1 Introduction


    A StreamEditor is used to perform basic transformations on text read from a file
    or a pipe. The result is sent to standard output. The syntax for the sed command
    has no output file specification, but results can be saved to a file using output
    redirection. The editor does not modify the original input.


    What distinguishes sed from other editors, such as vi and ed, is its ability to
    filter text that it gets from a pipeline feed. You do not need to interact with
    the editor while it is running; that is why sed is sometimes called a batch editor.
    This feature allows you of editing commands in scripts, greatly easing repetitive
    editing tasks. When facing replacement of text in a large number of files, sed
    is a great help.


    # 5.1.1 sed commands


    The sed program can perform text pattern substitutions and deletions using regular
    expressions, the ones used with the grep command; see Section 4.2.


    The editing commands are similar to the ones used in the vi editor:


    Table 5.1: Sed editing commands


    | Command | Result |

    |---|---|

    | a\ | Append text below current line. |

    | c\ | Change text in the current line with new text. |

    | d | Delete text. |

    | i\ | Insert text above current line. |

    | p | Print text. |

    | r | Read a file. |

    | s | Search and replace text. |

    | w | Write to a file. |


    Apart from editing commands, you can give options to sed. An overview is in the
    table below:


    Table 5.2: Sed options


    | Option | Effect |

    |---|---|

    | -e SCRIPT | Add the commands in SCRIPT to the set of commands to be run while
    processing the input. |

    | -f | Add the commands contained in the file SCRIPT-FILE to the set of commands
    to be run while processing the input. |

    | -n | Silent mode. |'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# 5.2 Interactive editing


    The sed info pages contain more information; we only list the most frequently
    used commands and options here.


    In this section, we examine several common tasks you may want to do interactively
    with sed, as opposed to running the tasks to completion without human intervention.


    # 5.2.1 Printing lines containing a pattern


    This is something you can do with grep, of course, but you can’t do a “find and
    replace” using that command. This is just to get you started.


    Here is our example file:


    ```

    sandy > cat -n example

    1 This is the first line of an example text.

    2 It is a text with errors.

    3 Lots of errors.

    4 So much errors, all these erros are making me sick.

    5 This is a line not containing any errors.

    6 This is the last line.

    ```


    We want sed to find all the lines containing our search pattern, in this case
    “erors”. We use the p to obtain the result:


    ```

    sandy > sed ''/erors/p'' example

    This is the first line of an example text.

    It is a text with errors.

    It is a text with errors.

    Lots of errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    So much errors, all these errors are making me sick.

    This is a line not containing any errors.

    This is the last line.

    ```


    As you notice, sed prints the entire file, but the lines containing the search
    string are printed twice. This is not what we want. In order to only print those
    lines matching our pattern, use the -n option:'
