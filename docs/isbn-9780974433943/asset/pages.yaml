    Any character string may be used as the output field separator by setting the
    built-in variable.


    # 6.3.3 The output record separator


    The output from an entire print statement is called an output record. Each print
    command results in one output record, and then outputs a string called the output
    record separator, OR. The default value for this variable is "\n", a newline character.
    Thus, each print statement generates a separate line.


    To change the output fields and records are separated, assign new values to OFS
    and OR:


    ```

    kelly@octarine ~//test> awk ''BEGIN { OFS=";"; OR="\n-->\n" } \

    { print $1,$2}'' test

    record1:datal

    -->

    record2:data2

    -->

    ```


    ```

    kelly@octarine ~//test>

    ```


    If the value of OR does not contain a newline, the program''s output is run together
    on a single line.


    # 6.3.4 The number of records


    The built-in NR holds the number of records that are processed. It is incremented
    after reading a new input line. You can use it at the end to count the total number
    of records, or in each output record:'
