  md: '# 12.1 Signals


    # Finding the signal man page


    Your system contains a man page listing all the available signals, depending on
    your operating system, it might be opened in a different way. On most Linux systems,
    this will be man 7 signal. When doubt, locate the exact man page and section using
    commands like


    ```

    man -k signal | grep list

    ```


    or


    ```

    apropos signal | grep list

    ```


    Signal names can be found using kill -l.


    # Signals to your Bash shell


    In the absence of any traps, an interactive Bash shell ignores SIGTERM and SIGQUIT.
    SIGINT is caught and handled, and if job control is active, SIGTIN, SIGTTO and
    SIGTSTP are also ignored. Commands that can run the result of a command substitution
    also ignore these signals, when keyboard generated.


    SIGHUP by default exits a shell. An interactive shell will send a SIGHUP to all
    jobs, running or stopped; see the documentation on the disown built-in if you
    want to disable this default behavior for a particular process. Use the hunup
    option for killing all jobs upon receiving a SIGHUP signal, using the shop built-in.


    # Sending signals using the shell


    Table 12.1 lists the signals that can be sent using the Bash shell.


    # Terminal settings


    Check your stty settings. Suspend and resume of output is usually disabled if
    you are using “modern” terminal emulations. The standard xterm supports Ctrl+S
    and Ctrl+Q by default.


    # 12.1.1 Usage of signals with kill


    Most modern shells, Bash, have a built-in kill function. In Bash, signal names
    and numbers are accepted as options, and arguments may be job'
