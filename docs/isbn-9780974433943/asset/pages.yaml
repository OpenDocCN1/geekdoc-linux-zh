    # 1.3.2 Executing programs from a script


    When the program being executed is a shell script, bash will create a bash process
    using a fork. This subshell reads the lines from the shell script one line at
    a time. Commands on each line are read, interpreted and executed as if they would
    come directly from the keyboard.


    While the subshell processes each line of the script, the parent shell waits for
    its child process to finish. When there are no more lines in the shell script
    to read, the subshell terminates. The parent shell awakens and displays a new
    prompt.


    # 1.4 Shell building blocks


    If input is not commented, the shell reads it and divides it into words and operators,
    employing quoting rules to define the meaning of each character of input. These
    words and operators are translated into commands and other constructs, which return
    an exit status available for inspection or processing. The above fork-and-exec
    scheme is only applied after the shell has analyzed input in the following way:


    +   - The shell reads its input from a file, from a string or from the user''s
    terminal.

    - Input is broken up into words and operators, obeying the quoting rules; see
    Chapter 3, "The Bash environment". These tokens are separated by metacters. Alias
    expansion is performed.

    - The shell parses (analyzes and substitutes) the tokens into simple and compound
    commands.

    - Bash performs various shell expansions, breaking the expanded tokens into lists
    of filenames and commands and arguments.

    - Redirection is performed if necessary, redirection operators and their operands
    are removed from the argument list.

    - Commands are executed.

    - Optionally the shell waits for the command to complete and collects its exit
    status.


    # Shell commands


    A simple shell command as touch file1 file2 file3 consists of the command itself
    followed by arguments, separated by spaces.


    More complex shell commands are composed of simple commands arranged together
    in a variety of ways: in a pipeline in which the output of one command'
