  md: "# Chapter 7: Conditional statements\n\n# 7.7 Using case statements\n\nNested\
    \ if statements might be nice, but as soon as you are confronted with a couple\
    \ of different possible actions to take, they tend to confuse. For the more complex\
    \ conditionals, use the case syntax:\n\n```\ncase EXPRESSION in CASE1) COMMAND-LIST;;\
    \ CASE2) COMMAND-\nLIST;;    ... CASEN) COMMAND-LIST;; esac\n```\n\nEach case\
    \ is an expression matching a pattern. The commands in the COMMAND-LIST for the\
    \ first match are executed. The \"|\\ symbol is used for separating multiple patterns,\
    \ and the \")\\ operator terminates a list. Each case plus its according commands\
    \ are called a clause. Each clause must be terminated with \";\"; case statement\
    \ is ended with the esac\n\nIn the example, we demonstrate use of cases for sending\
    \ a more selective warning message with the disktest.sh:\n\n```\nanny \"/testdir\
    \ cat disktest.sh\n!/bin/bash\n\n# This script does a very simple test for checking\
    \ disk space.\n\nspace=`df -h | awk '{print $5}' | grep % | grep -v Use | sort\
    \ -n | tail -1 | \\\n  cut -d \" \" -fl1 |\n\ncase Space in\n[1-6]*)\n  Message=\"\
    All is quiet.\"\n  ;\n[7-8]*)\n  Message=\"Start thinking about cleaning up some\
    \ stuff. There is a partition \\\n  that is $space % full.\"\n  ;\n9[1-8]*)\n\
    \  Message=\"Better hurry with that new disk... One partition is $space % full.\"\
    \n  ;\n99)\n  Message=\"I'm drowning here! There's a partition at $space %!\"\n\
    \  ;\n*)\n  Message=\"I seem to be running with an nonexitent amount of disk space...\"\
    \n  ;\nesac\n\necho $Message | mail -s \"disk report 'date' anny\n```\n\n116"
