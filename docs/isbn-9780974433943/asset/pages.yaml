  md: "# Chapter 3: The Bash environment\n\n# 3.1 Shell initialization files\n\nDepending\
    \ on how it is invoked, Bash executes several configuration files before it begins\
    \ a script or interactive session.\n\n/etc/profile\n\nWhen invoked interactively\
    \ with the --login option or when invoked as sh, Bash reads the /etc/profile instructions.\
    \ These usually set the shell variables PATH, USER, MAIL, HOSTNAME and HISTSIZE.\n\
    \nOn some systems, the umask value is configured in /etc/profile; on other systems\
    \ this file points to other configuration files such as:\n\n+   - /etc/inputrc,\
    \ the system-wide Read initialization file where you can configure the command\
    \ line bell-style.\n- /etc/profile.d directory, which contains files configuring\
    \ system-wide behavior of specific programs.\n\nAll settings that you want to\
    \ apply to all your users' environments should be in this file. It might look\
    \ like this:\n\n```\n# /etc/profile\n# System wide environment and startup programs,\
    \ for login setup\nPATH=$PATH:/usr/X11R/bin\n\n# No core files by default\nuulimit\
    \ -s 0 > /dev/null 2>&1\n\nUSER=$(id -u)\nLOGNAME=$USER\nMAIL=/var/spool/$USER\n\
    \nHOSTNAME=$(bin/hostname\nHISTSIZE=1000\n\n# Keyboard, bell, display: the readline\
    \ config file:\nif [ -z \"INPUTRC\" ] && -f \"$HOME/.inputrc\" ]; then\nINPUTRC=/etc/inputrc\n\
    fi\nPS1=\"\\u@\\h \\\n\nexport PATH USER LOGNAME HISTSIZE INPUTRC PS1\n\n# Source\
    \ initialization files for specific programs (ls, vim, less, ...)\nfor i in /etc/profile.d/*;\
    \ do\nif [ -r \"$i\" ]; then\n  \"$i\"\nfi\ndone\n\n# Settings for program initialization\n\
    source /etc/java.conf\nexport NPX PLUGIN_PATH=\"$JRE_HOME/plugin/ns4plugin:/usr/lib/netscape/plugins\"\
    \n```\n\n32"
