    # if/then/elif/else constructs


    This is the full form of the if statement:


    +   if TEST-COMMANDS; then


    CONSEQUENT-COMMANDS;


    elif MORE-TEST-COMMANDS; then


    MORE-CONSEQUENT-COMMANDS;


    else ALTERNATE-CONSEQUENT-COMMANDS; then


    fi


    The TEST-COMMANDS list is executed, and if its return status is zero, the

    CONSEQUENT-COMMANDS list is executed. If TEST-COMMANDS returns

    a non-zero status, each elif list is executed in turn, and if its exit status
    is zero,

    t corresponding MORE-CONSEQUENT-COMMANDS is executed and the

    command completes. If else is followed by an ALTERNATE-CONSEQUENT-

    COMMANDS list, and the final command in the final or elif clause has a

    non-zero exit status, then ALTERNATE-CONSEQUENT-COMMANDS is

    executed. The return status is the exit status of the last command executed, or

    zero if no condition tested true.


