  md: "# 9.7 The shift built-in\n\nThe **shift** command is one of the Bourne shell\
    \ built-ins that comes with Bash. The command takes one argument, a number. The\
    \ positional parameters are shifted to the left by this number, N. The positional\
    \ parameters from N+1 to ## are renamed to variable names from $1 to ## - N+1.\n\
    \nSay you have a command that takes 10 arguments, and N is 4, then $4 becomes\
    \ $1, $5 becomes 2 and so on. $10 becomes $7 and the original $1, $2 and $3 are\
    \ thrown away.\n\nIf N is zero or greater than ## (the total number of arguments);\
    \ see Section 7.2). If N is not present, it is assumed to be 1. The return status\
    \ is zero unless N is greater than ## or less zero; otherwise it is non-zero.\n\
    \n# 9.7.1 Examples\n\nA shift is typically used when the number of arguments to\
    \ a command is not known in advance, for instance when users can give as many\
    \ arguments as they like. In such cases, the arguments are usually processed in\
    \ a **while** loop with a test condition of (($ $)). This condition is true as\
    \ long as the number of arguments is greater than zero. The $1 variable and the\
    \ **shift** statement process each argument. The number of arguments is reduced\
    \ each time **shift** is executed and eventually becomes zero, upon which the\
    \ loop exits.\n\nThe example below, cleanup.sh, uses **shift** statements to process\
    \ each file in the list generated by **find**:\n\n```\n#!/bin/bash\n\n# This script\
    \ can clean up files that were last accessed over 365 days ago.\nUSAGE=\"Usage:\
    \ $0 dir1 dir2 dir3 ... dirN\"\n\nif [ \"$#\" = \"0\" ]; then\n  echo \"$USAGE\"\
    \n  exit 1\nfi\n\nwhile [ \"$#\" -gt 0 ]; do\n  if [ \"$1\" = \"\"\" ]; then\n\
    \    echo \"Empty directory, nothing to be done.\"\n  fi\n  shift\n```"
  merge: -1
