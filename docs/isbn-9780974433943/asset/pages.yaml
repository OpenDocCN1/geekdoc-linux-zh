  md: "# 12.2 Traps\n\n```\n#!/bin/bash\n# traptest.sh\n\ntrap \"echo Boch!\" SIGINT\
    \ SIGTERM\necho \"pid is $$\"\n\nwhile          # This is the same as \"while\
    \ true\".\ndo\n    sleep 60   # This script is not really doing anything.\ndone\n\
    ```\n\n# 12.2.1 How Bash interprets traps\n\nWhen Bash receives a signal for which\
    \ a trap has been set while waiting for a command to complete, the trap will not\
    \ be executed until the command completes. When Bash is waiting for an asynchronous\
    \ command via the wait built-in, the reception of a signal for which a trap has\
    \ been set will cause the wait built-in to return immediately with an exit status\
    \ greater than 128, immediately after which the trap is executed.\n\n# 12.2.2\
    \ More examples\n\nDetecting when a variable is used\n\nWhen debugging longer\
    \ scripts, you might want to give a variable the trace attribute and trap DEBUG\
    \ messages for that variable. Normally you would just declare a variable using\
