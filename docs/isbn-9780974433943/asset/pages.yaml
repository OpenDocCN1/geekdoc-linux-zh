    # Character classes


    Within a bracket expression, a range expression consists of two characters separated
    by a hyphen. It matches any single character that sorts between the two characters,
    inclusive, using the locale''s collation sequence and character set. For example,
    in the default C locale, "[a-d]" is equivalent to "[abcd]". Many locales sort
    characters in dictionary order, and in these locales is typically not equivalent
    to "[a-d]"; it might be equivalent to "[AbCcDd]", for example. To obtain the traditional
    interpretation of bracket expressions, you can use the C locale by setting the
    LC_ALL environment variable to the value "C".


