    you source it:


    ```

    source script.name.sh

    ```


    The Bash source built-in is a synonym for the Bourne shell. (dot) command.


    The script does not execute permission in this case. Commands are executed

    in the current shell context, so any changes made to your environment will be

    visible when the script finishes execution:


    ```

    willy:</scripts> source script1.sh

