    # 5.3 Non-interactive editing


    There are several ways to run sed without any human interaction.


    # 5.3.1 Reading sed commands from a file


    Multiple sed commands can be put in a file and executed using the -f option. When
    creating such a file, make sure that:


    +   - No trailing white spaces exist at the end of lines.

    - No quotes are used.

    - When entering text to add or replace, all except the last line end in a backslash.


    # 5.3.2 Writing output files


    Writing output is done using the output redirection operator >. This is an example
    used to create very simple HTML files from plain text files.


    ```

    sandy > cat script.sed

    li\

    <html>

    <head><title>sed generated html</title></head>

    <body bgcolor="#ffffff">

    <pre>

    $@

    </pre>

    </body>

    </html>

    nsandy > cat txt2html.sh

    #!/bin/bash

    ```


    # This is a simple script that you can use for converting text into HTML.

    # First we take out all newline characters, so that the appending only

    # happens once, then we replace the newlines.'
