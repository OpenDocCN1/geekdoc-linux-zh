    # 12.3 Summary


    Signals can be sent to your programs using the kill command or keyboard shortcuts.
    These signals can be caught, upon which action can be performed, using the trap
    statement.


    Some programs ignore signals. The only signal that no program can ignore is the
    KILL signal.


