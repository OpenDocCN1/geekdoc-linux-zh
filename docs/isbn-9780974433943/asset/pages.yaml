  md: '# Chapter 2: Writing and debugging scripts


    # 2.1 Creating and running a script


    A script is a sequence of commands for which you have a repeated use. This sequence
    is typically executed by entering the name of the script on the command line.
    Alternatively, you can use scripts to automate tasks using the cron facility.
    Another use for scripts is in the UNIX boot and shutdown procedure, where operation
    of daemons and services are defined in unit scripts.


    To create a shell script, open new empty file in your editor. Any text editor
    will do: vim, emacs, edit, dtap et cetera are all valid. You might want to choose
    a more advanced editor like vim or emacs, because these can be configured to recognize
    shell and Bash syntax and can be a great help in preventing those errors that
    beginners frequently make, such as forgetting brackets and semicolons.


    Put UNIX commands in the new file, like you would enter them on the command line.
    As discussed in the previous chapter (see Section 1.3), commands can be shell
    functions, built-in, UNIX commands and other scripts.


    Give your script a sensible name that gives a hint about what the script does.
    Make sure that your script name does not conflict with existing commands. In order
    to ensure that no confusion can rise, script names often end in .sh; even so,
    there might be other scripts on your system with the same name as the one you
    chose. Check using which, whereis and other commands for finding information about
    programs and files:


    ```

    which -a script_name

    whereis script_name

    locate script_name

    ```


    # 2.1.1 script1.sh


    In this example we use the echo Bash built-in to inform the user about what is
    going happen, before the task that will create the output is executed. It is strongly
    advised to inform users about what a script is doing, in order to prevent them
    from becoming nervous because the script is not doing anything. We will return
    to the subject in Chapter 8, "Writing interactive scripts".


    Write this script for yourself as well. It might be a good idea to create a directory
    ~/scripts to hold your scripts. Add the directory to the contents of the PATH
    variable:


    ```

    export PATH="$PATH:/scripts"

    ```


    If you are just starting with Bash, use a text editor that uses different colours
    for different shell constructs. Syntax highlighting is supported by vim,'
  merge: -1
