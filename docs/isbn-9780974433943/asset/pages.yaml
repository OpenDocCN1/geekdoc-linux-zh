    the same option as the kill command, but applies on all instances of a given process.
    Test this command before using it in a production environment, since it might
    not work as expected on some of the commercial Unices.


    # 12.2 Traps


    There might be situations when you don''t want users of your scripts to execute
    timelyely using keyboard abort sequences, for example input has to be provided
    or cleanup has to be done. The trap statement catches these sequences and can
    be programmed to execute a list of commands upon catching those signals.


    The syntax for the trap statement is straightforward:


    ```

    trap [COMMANDS] [SIGNALS]

    ```


    This instructs the trap command to catch the listed SIGNALS, which may be signals
    with or without the SIG prefix, or signal numbers. If a signal is 0 or EXIT, the
    COMMANDS are executed when the shell exits. If one of the signals is DEBUG, the
    list of COMMANDS is executed after every simple command. A signal may also be
    specified as ERR; in that case COMMANDS are executed each time a simple command
    exits with a non-zero exit status. Note that these commands will not be executed
    when the non-zero exit status comes from part of an state, or from a while or
    until loop. Neither will they be executed if a logical AND (&&) or OR (||) result
    in a non-zero exit code, or when a command''s return is inverted using the / operator.


    The return status of the trap command itself is zero unless an invalid specification
    is encountered. The trap command takes a couple of options, which are documented
    in the Bash info pages.


