  md: "# Chapter 1: Bash and Bash scripts\n\n# 1.3 Executing commands\n\nBash determines\
    \ the type of program that is to be executed. Normal programs are system commands\
    \ that exist in compiled form on your system. When such a program is executed,\
    \ a new process is created because Bash makes an exact copy of itself. This child\
    \ process has the same environment as its parent, only the process ID is different.\
    \ This procedure is called forking.\n\nAfter the forking process, the address\
    \ space of the child process is overwritten with the new process data. This is\
    \ done through an exec to the system.\nThe fork-and-exec mechanism switches an\
    \ old command with a new, while the environment in which the new process is executed\
    \ remains the same, including configuration of input and output devices, environment\
    \ variables and priority. This mechanism is used to create all UNIX processes,\
    \ so it also applies to the Linux operating system. Even the first process, init\
    \ with process ID 1, is forked during the boot procedure in the so-called bootstrapping\
    \ procedure.\n\n# 1.3.1 Shell built-in commands\n\nBuilt-in commands are contained\
    \ within the shell itself. When the name of a built-in command is used the first\
    \ word of a simple command, the shell executes the command directly, without creating\
    \ a new process. Built-in commands are necessary to implement functionality impossible\
    \ or inconvenient to obtain with separate utilities.\n\nBash supports 3 types\
    \ of built-in commands:\n\n+   - Bourne built-ins:\n  - :, , break, cd, continue,\
    \ eval, exec, export, getops, hash, pwd, readonly,\n    return, set, shift, test,\
    \ [ , , trap, mask and unset\n- Built-in commands:\n  alias, builtin, command,\
    \ declare, echo, enable, help, let, local, logout,\n    print, read, shop, type,\
    \ typeset, ulimit and unalias.\n- Special built-in commands:\n\nWhen Bash is executing\
    \ in POSIX mode, the special built-ins differ from other built-in commands in\
    \ three respects:\n\n+   1. Special built-ins are found before shell functions\
    \ during command lookup.\n2. If a special built-in returns an error status, a\
    \ non-interactive shell exits.\n3. Assignment statements preceding the command\
    \ stay effect in the shell environment after the command completes.\n\nThe POSIX\
    \ special built-ins are :, , break, continue, eval, exec, exit, export,\nreadonly,\
    \ return, set, shift, trap and unset."
