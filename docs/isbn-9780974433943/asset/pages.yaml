  md: '# 10.1 Types of variables


    Make variables read-only. These variables cannot be asigned values by subsequent
    assignment statements, nor can they be unset.


    Give each variable the trace attribute.


    Mark each variable for export to subsequent commands via the environment.


    Using instead of - turns off the attribute instead. When used in a function, declare
    creates local variables.


    The following example shows how assignment of a type to a variable influences
    the value.


    ```

    bob in ] declare -i VARIABLE=12

    bob in ] VARIABLE=string

    bob in ] echo $VARIABLE

    bob in ] declare -p VARIABLE

    declare -i VARIABLE=""

    ```


    Note that Bash has an option to declare a numeric value, but none for declaring
    string values. This is because, by default, if no specifications are given, a
    variable can hold any type of data:


    ```

    bob in ] OTHERVAR=blah

    bob in ] declare -p OTHERVAR

    declare -- OTHERVAR="blah"

    ```


    As soon as you restrict assignment of values to a variable, it can only hold that
    type of data. Possible restrictions are either integer, constant or array.


    See the Bash info pages for information on return status.


    # 10.1.2 Constants


    In Bash, constants are created by making a variable read-only. The readonly built-in
    marks marks each specified variable as unchanging. The syntax is:


    ```

    readonly OPTION VARIABLE(s)

    ```


    The values of these variables can no longer be changed by subsequent assignment.
    If the -f option is given, each variable refers to a shell function; Chapter 11,
    "Functions". If -a is specified, each variable refers to an array of'
