    # 8.2.2 Redirection and file descriptors


    As you know from basic shell usage, input and output of a command may be redirected
    before it is executed, using a special notation - the redirection operators -
    interpreted by the shell. Redirection may also be used to open and close files
    for the current shell execution environment.


    Redirection can also occur in a script, so that it can receive input from a file,
    for instance, or send output to a file. Later, the user can review the output
    file, or it may be used by another script as input.


    File input and output are accomplished by integer handles that track all open
    files for a given process. These numeric values are known as file descriptors.
    The best known file descriptors are stdin, stdout and stderr, with file descriptor
    numbers 0, 1 and 2, respectively. These numbers and respective devices are reserved.
    Bash can take TCP or UDP ports on networked hosts as file descriptors as well.


