  md: '# Chapter 1: Bash and Bash Scripts


    # Shell arithmetic


    The shell allows arithmetic expressions to be evaluated, as one of the shell expansions
    or by the let built-in.


    Evaluation is done in fixed-width integers with no check for overflow, though
    division by 0 is trapped and flagged as an error. The operators and their precedence
    and associativity are the same as in the C language; see Chapter 3, "The Bash
    environment".


    # Aliases


    Aliases allow a string to be substituted for a word when it is used as the first
    word of a command. The shell maintains a list of aliases that may be set and unset
    with the alias and unalias commands.


    Bash always reads at least one complete line of input before executing any of
    the commands on that line. Aliases are expanded when a command is read, not when
    it is executed. Therefore, an alias definition appearing on the same line as another
    command does not take effect until the next line of input is read. The commands
    following the alias definition on that line are not affected by the new alias.


    Aliases are expanded when a function definition is read, not when the function
    is executed, because a function definition is itself a compound command. As a
    consequence, aliases defined in a function are not available until after that
    function is executed.


    We will discuss aliases in detail in Section 3.5.


    # Arrays


    Bash provides one-dimensional array variables. Any variable may be used as an
    array; the declare built-in will explicitly declare an array. There is no maximum
    limit on the size of an array, nor any requirement that members be indexed or
    assigned contiguously. Arrays are zero-based. See Chapter 10, "More on variables".


    # Directory stack


    The directory stack is a list of recently-visited directories. The pushd built-in
    adds directories to the stack as it changes the current directory, and the pop
    removes specified directories from the stack and changes the current directory
    to the directory removed.


    Content can be displayed issuing the dirs command or by checking the content of
    the DIRSTACK variable.


    More information about the workings of this mechanism can be found in the Bash
    info pages.'
