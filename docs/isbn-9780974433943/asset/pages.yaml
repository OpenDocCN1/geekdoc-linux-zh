  md: '# Chapter 7: Conditional statements


    # 7.9 Exercises


    Here are some ideas to get you started using if in scripts:


    +   Use an if/then/elif/else construct that prints information about the current
    month. The script should print the number of days in this month, and give information
    about leap years if the current month is February.


    +   Do the same, using a case statement and an alternative use of the date command.


    +   Modify /etc/profile so that you get a special greeting message when you connect
    to your system as root.


    +   Edit the least.sh script from Section 7.5 so that it requires one argument,
    the year. Test that exactly one argument is supplied.


    +   Write a script called whichdaemon.sh that checks if the httpd and init daemons
    are running on your system. If an httpd is running, the script should print a
    message like, "This machine is running a web server." Use ps to check processes.


    +   Write a script that makes a backup of your home directory to a remote machine
    using scp. The script should report in a log file, for instance /log/backup.log.
    If you don''t have a second machine to copy the backup to, use scp to test copying
    it to the localhost. This requires SSH keys between the two hosts, or else you
    have to supply a password. The creation of SSH keys is explained in man ssh-keygen.


    The script should use tar cf for the creation of the backup and gzip or bzip2
    for compressing the .tar file. Put all filenames of the remote server and the
    remote directory in a variable. This will make it easier to re-use the script
    or make changes to it in the future.


    The script should check for the existence of a compressed archive. If this exists,
    remove it first in order to prevent output generation.


    The script should also check for available diskspace. Keep in mind that at any
    given moment you could have the data in your home directory, the data in the .tar
    file and the data in the compressed archive all together on your disk. If there
    is not enough diskspace, exit with an error message in the log file.


    The script should clean up the compressed archive before exits.'
