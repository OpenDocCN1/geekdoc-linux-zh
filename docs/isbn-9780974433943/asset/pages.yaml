  md: "# 7.7.1 Initscript example\n\nInitscripts make use of case statements for starting,\
    \ stopping and querying system services. This is an excerpt of the script that\
    \ starts Anacron, a daemon that runs commands periodically with a frequency specified\
    \ in days.\n\n```\ncase \"$1\" in\n    start)\n        start\n        ;;\n   \
    \ stop)\n        stop\n        ;;;\n    status)\n        status anacron\n    \
    \    ;;;\n    restart)\n        stop\n        start\n        ;;\n    condrestart)\n\
    \        if test \"x'pidof anacron'\" != x; then\n            stop\n         \
    \   start\n        fi\n        ;;\n*)\n    echo \"Usage: $0 {start|stop|restart|condrestart|status}\"\
    \n    exit 1\nesac\n```\n\nThe tasks to execute in each case, such as stopping\
    \ and starting the daemon, are defined in functions, which are partially sourced\
    \ from the /etc/rc.d/init.d/functions file. See Chapter 11, “Functions” for more\
    \ explanation."
