    # Conventions used in this document


    Table 1 describes the typographic and usage conventions that occur in this text.


    Table 1: Typographic and usage conventions


    | Text type | Meaning |

    | --- | --- |

    | "Quoted text" terminal view | Quotes from people, quoted computer output. Literal
    computer input and output captured from the terminal, usually rendered in a box.
    |

    | command VARIABLE | Name of a command that can be entered on the command line.
    Name of a variable or pointer to content of a variable, as in $VARNAME. |

    | option argument command options arguments | Option to a command, as in "the
    -a option to the Is Command". Argument to a command, as in "read man 1". Command
    synopsis or general usage, on a separated line. |

    | filename | Name of a file or directory, for example "Change to the /usr/bin
    directory." |

    | Key Button Menu → Choice | Keys to hit on the keyboard, as "type Q to quit".
    Graphical button to click, like the OK button. Choice to select from a graphical
    menu, for instance: "Select Help → About Mozilla in your browser." |

    | Terminology | Important term or concept: "The Linux kernel is the heart of the
    system." |'
