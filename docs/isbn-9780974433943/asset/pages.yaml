  md: '# Chapter 3: The Bash environment


    quotes.

    The backslash retains its meaning only when followed by dollar, backtick, double
    quote, backslash or newline. Within double quotes, the backslashes are removed
    from the input stream when followed by one of these characters. Backslashes preceding
    characters that don''t have a special meaning are left unmodified for processing
    by the shell interpreter.


    A double quote may be quoted within double quotes by preceding it with a backslash.


    ```

    franky > echo "$date"

    20021226


    franky > echo ''`date''

    Sun Apr 20 11:22:06 CEST 2003


    franky > "I''d say: \Go for it!"

    I''d say: "Go for it!"


    franky > echo "*"

    More input>


    franky > echo \\\*

    \

    ```


    # 3.3.5 ANSI-C quoting


    Words in the form "$STRING" are treated in a special way. The word expands to
    a string, with backslash-escaped characters replaced as specified by the ANSI-C
    standard. Backslash escape sequences can be found in the Bash documentation.


    # 3.3.6 Locales


    A double-quoted string preceded by a dollar sign will cause the string to be translated
    according to the current locale. If the current locale is "C" or "POSIX", the
    dollar sign is ignored. If the string is translated and replaced, the replacement
    is double-quoted.'
