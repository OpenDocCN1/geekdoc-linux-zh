    # 1.2.2 Bash startup files


    Bash reads different startup files depending on how you invoke it.


    Invoked as an interactive login shell, or with ‘login’


    Interactive means you can enter commands. The shell is not running because a script
    has been activated. A login shell means that you got the shell after authenticating
    to the system, usually by giving your user name and password.


