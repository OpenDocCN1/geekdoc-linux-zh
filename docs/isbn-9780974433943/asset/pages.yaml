  md: '# 10.1 Types of variables


    As we already saw, Bash understands many different kinds of variables or parameters.
    Thus far, we haven''t bothered much with what kind of variables we assigned, so
    our variables could hold any value that we assigned to them. A simple command
    line example demonstrates this:


    ```

    VARIABLE=12

    echo $VARIABLE 12

    VARIABLE=string

    echo $VARIABLE string

    ```


    There are cases when you want to avoid this kind of behavior, for instance when
    handling telephone and other numbers. Apart from integers and variables, you may
    also want to specify a variable that is a constant. This is often done at the
    beginning of a script, when the value of the constant is declared. After that,
    there are only references to the constant variable name, so that when the constant
    needs to be changed, it has to be done once. A variable may also be a series of
    variables of any type, a so-called array of variables (VAR1, VAR2, ... VARN).


    # 10.1.1 Using the declare built-in


    Using a declare statement, we can limit the value assignment to variables.


    The syntax for declare(s) is the following:


    ```

    declare OPTION(s) VARIABLE=value

    ```


    The following options are used to determine the type of data the variable can
    hold and to assign it attributes:


    Table 10.1: Options to the declare built-in


    | Option | Meaning |

    | -a | Variable is an array. |

    | -f | Use functions only. |

    | -i | The variable is be treated as an integer; arithmetic evaluation is performed
    when the variable is assigned a value (see Section 3.4.5). |

    | -p | Display the attributes and values of each variable. When -p is used, additional
    options are ignored. |'
  merge: -1
