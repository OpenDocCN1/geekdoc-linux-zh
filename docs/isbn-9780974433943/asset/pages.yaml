  md: '# Chapter 1: Bash and Bash scripts


    # # 1.1 Common shell programs


    The UNIX shell program interprets user commands, which are either entered by the
    user, or which can be read from a file called the shell or shell program. Shell
    scripts are interpreted, not compiled. The shell reads commands from the script
    line by line and searches for those commands on the system (see Section 1.2),
    while a compiler converts a program into machine readable form, an an executable
    file - which may then be used in a shell script.


    Apart from passing commands to the kernel, the main task of a shell is providing
    a user environment, which can be configured individually using shell resource
    configuration files.


    # ## 1.1.1 Shell types


    Just like people know different languages and dialects, your UNIX system usually
    offer a variety of shell types:


    +   * **sh** or Bourne shell: the original shell still used on UNIX systems and
    UNIX-related environments. This is the basic shell, a small program with few features.
    While this is not the standard shell, it is still available on every Linux system
    for compatibility with UNIX programs.

    * **bash** or Bourne Again shell: the standard GNU shell, intuitive and flexible.
    Probably advisable for beginning users while being at the same time as a powerful
    tool for the advanced and professional user. On Linux, **bash** is the standard
    shell for common users. This shell is a-called *superset* of the Bourne shell,
    a set of add-ons and plug-ins. This means that the Bourne Again is compatible
    with the Bourne shell: commands that work in **sh**, also work in this book. However,
    the reverse is not always the case. All examples and exercises in this book use
    bash**.

    * **csh** or C shell: the syntax of this shell resembles that of the C programming
    language. Sometimes asked for programmers.

    * **tcsh** or Turbo C shell: a superset of the common C shell, enhancing userfriendliness
    and speed.

    * **ksh** or the Korn shell: sometimes appreciated by people with a UNIX background.
    A superset of the Bourne shell; with standard configuration a nightmare for beginning
    users.


    The file /etc/shells gives an overview of known shells on a Linux system:'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 1.2 Advantages of the Bourne SHell


    ```

    mia:> cat /etc/shells

    /bin/bash

    /bin/sh

    /bin/tcsh

    /bin/csh

    ```


    Your default shell is set in the /etc/passwd file, like this line for user mia:


    ```

    mia:L2NOfqdPrHWE:504:504:mia Maya:/home/mia:/bin/bash

    ```


    To switch from one shell to another, just enter the name of the new shell in the
    active terminal. The system finds the directory where the name occurs using the
    PATH settings, and since a shell is an executable file (program), the current
    shell activates it and it executes. A new prompt is usually shown, because each
    shell has its typical appearance:


    ```

    mia:> tcsh

    [mia@post21 ~]$

    ```


    # 1.2 Advantages of the Bourne Again SHell


    The GNU project (GNU''s UNIX) provides tools for UNIX-like system administration
    which are free software and comply with UNIX standards.


    Bash is an sh-compatible shell that incorporates useful features from the Korn
    shell (ksh) and C shell (csh). It is intended to conform to the IEEE POSIX P1003.2/ISO
    9945.2 Shell and Tools standard. It offers functional improvements over sh for
    both programming and interactive use; these include command line editing, unlimited
    size command history, job control, shell functions and aliases, indexed arrays
    of unlimited size, and integer arithmetic in any base from two to sixty-four.
    Bash can run most sh scripts without modification.


    Like other GNU projects, the bash initiative was started to preserve, protect
    and promote the freedom to use, study, copy, modify and redistribute software.
    It is generally known that such conditions stimulate creativity. This was also
    the case with the bash program, which has a lot of extra features that other shells
    can''t offer.


    # 1.2.1 Invocation


    In addition to the single-character shell command line options which can be configured
    using the set shell built-in command, there are several multi-character options
    that you can use. We will come across a couple of the most'
