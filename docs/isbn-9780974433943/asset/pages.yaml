  md: '# 10.2.1 Dereferencing the variables in an array


    In order to refer to the content of an item in an array, use curly braces. This
    is necessary, as you can see from the following example, to bypass the shell interpretation
    of expansion operators. If the index number is @ or *, all members of an array
    are referenced.


    ```

    [bob in ] ARRAY=(one two three)

    [bob in ] echo ${ARRAY[*]}

    one two three


    [bob in ] echo $ARRAY[*]

    one[*]


    [bob in ] echo ${ARRAY[2]}

    tree


    [bob in ] ARRAY[3]=four

    [bob in ] echo ${ARRAY[*]}

    one two three four

    ```


    Referring to the content of a member variable of an array without providing an
    index number is the same as referring to the content of the first element, the
    one referenced with index number zero.


    # 10.2.2 Deleting array variables


    The unset built-in is used to destroy arrays or member variables of an array:


    ```

    [bob in ] unset ARRAY[1]

    [bob in ] echo ${ARRAY[*]}

    one three four

    [bob in ] unset ARRAY

    [bob in ] echo ${ARRAY[*]}

    <--no output-->

    ```


