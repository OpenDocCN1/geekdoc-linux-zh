  md: '+   • Chapter 4, "Regular expressions": Regular expressions: an introduction.


    +   • Chapter 5, "The GNU sed stream editor": Sed: an introduction to the sed
    line editor.


    +   • Chapter 6, "The GNU awk programming language":Awk: introduction to the awk
    programming language.


    +   • Chapter 7, "Conditional statements": Conditional statements: constructs
    used in Bash to test conditions.


    +   • Chapter 8, "Writing interactive scripts": Interactive scripts: making scripts
    user-friendly, catching user input.


    +   • Chapter 9, "Repetitive tasks": Executing commands repetitively: constructs
    used in Bash to automate command execution.


    +   • Chapter 10, "More on variables": Advanced variables: specifying variable
    types, introduction to arrays of variables, operations on variables.


    +   • Chapter 11, "Functions": Functions: an introduction.


    +   • Chapter 12, "Catching signals": Catching signals: introduction to process
    signalling, trapping user-sent signals.'
