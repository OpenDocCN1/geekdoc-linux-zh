    ```

    ls | more

    gzip file.tar.gz | tar xvf -

    ```


    # Shell functions


    Shell functions are a way to group commands for later execution using a single
    name for the group. They are executed just like a “regular” command. When the
    name of the shell function is used as a simple command name, the list of commands
    associated with that function name is executed.


    Shell functions are executed in the current shell context; no new process is created
    to interpret them.


    Functions are explained in Chapter 11, “Functions”.


    # Shell parameters


    A parameter is an entity that stores values. It can be a name, a number or a special
    value. For the shell’s purpose, a variable is a parameter that stores a name.
    A variable has a value and zero or more attributes. Variables are created with
    the declare shell built-in.


    If no value is given, a variable is assigned the null string. Variables can only
    be removed with the unset built-in.


    Assigning variables is discussed in Section 3.2, advanced use of variables in
    Chapter 10, “More on variables”.


    # Shell expansions


    Shell expansion is performed after each command line has been split into tokens.
    These are the expansions performed:


    +   * Brace expansion

    * Tilde expansion

    * Parameter and variable expansion

    * Command substitution

    * Arithmetic expansion

    * Word splitting

    * Filename expansion


    We’ll discuss these expansion types in detail in Section 3.4.'
