  md: '# Chapter 7: Conditional statements


    # 7.1 Introduction to if


    At times you need to specify different courses of action to be taken in a shell
    script, depending on the success or failure of a command. The if construction
    allows you to specify such conditions.


    The most compact syntax of the if command is:


    ```

    if TEST-COMMANDS; then CONSEQUENT-COMMANDS; fi

    ```


    The TEST-COMMAND list is executed, and if its return status is zero, the CONSEQUENT-COMMANDS
    list is executed. The return status is the exit status of the last command executed,
    or zero if no condition tested true.


    The TEST-COMMAND often involves numerical or string comparison tests, but it can
    also be any command that returns a status of zero when it succeeds and some other
    status when it fails. Unary expressions are often used to examine the status of
    a file. If the FILE argument to one of the primaries is of the form /dev/fd/N,
    then descriptor "N" is checked. stdin, stdout and stderr and their file descriptors
    may also be used for tests.


    # Expressions used with if


    The table below contains an overview of the so-called "primaries" that make up
    the TEST-COMMAND command or list of commands. These primaries are put between
    square brackets to indicate the status of a conditional expression.


    # Table 7.1: Primary expressions


    | Primary | Meaning |

    | --- | --- |

    | -aFILE | True if FILE exists. |

    | -bFILE | True if FILE exists and is a block-special file. |

    | -cFILE | True if FILE exists and is a character-special file. |

    | -dFILE | True if FILE exists and is a directory. |

    | -eFILE | True if FILE exists. |

    | -fFILE | True if FILE exists and is a regular file. |

    | -gFILE | True if FILE exists and its SGID bit is set. |

    | -hFILE | True if FILE exists and is a symbolic link. |

    | -kFILE | True if FILE exists and its sticky bit is set. |

    | -pFILE | True if FILE exists and is a named pipe (FIFO). |

    | -rFILE | True if FILE exists and is readable. |

    | -sFILE | True if FILE exists and has a size greater than zero. |

    | -uFILE | True if file descriptor FD is open and refers to a terminal. |

    | -wFILE | True if FILE exists and its SUID (set user ID) bit is set. True if
    FILE exists and is writable. |'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# 7.1 Introduction to if


    +   - -xFILE | True if FILE exists and is executable.

    - -OFILE | True if FILE exists and is owned by the effective user ID.

    - -GFILE | True if FILE exists and is owned by the effective group ID.

    - -LFILE | True if FILE exists and is a symbolic link.,


    +   - -SFILE | True if FILE exists and is a socket.

    - FILE1-ntFILE2 | True if FILE1 has been changed more recently than FILE2, nor
    if FILE1 exists and FILE2 does not.


    +   - FILE1-otFILE2 | True if FILE1 is older than FILE2, or if FILE2 exists and

    FILE1 does not.


    +   - FILE1-efFILE2 | True if FILE1 and FILE2 refer to the same device and inode
    numbers.


    +   - - OPTIONNAME | True if shell option "OPTIONNAME" is enabled.

    - -z STRING | True of the length of "STRING" is zero.

    - -n STRING or [ True of the length of "STRING" is non-zero.


    STRING1==STRING2 | True if the strings are equal. "==" may be used instead

    for strict POSIX compliance.


    STRING1!=STRING2 | True if the strings are not equal.

    STRING1<STRING2 | True if "STRING1" sorts before "STRING2" lexicographically in
    the current locale.


    STRING1>STRING2 | True if "STRING1" sorts after "STRING2" lexicographically

    in the current locale.


    ARG1 OP ARG2 | "OP" is one of -eq, -ne, -1t, -le, -gt or -ge. These arithmetic
    binary operators return true if "ARG1" is equal to, not equal to, less than, less
    or equal to, greater than, or greater or equal to "ARG2", respectively. "ARG1"
    and "ARG2" are integers.


    Expressions may be combined using the operators in Table 7.2, which are listed

    in decreasing order of precedence.


    # Table 7.2: Combining expressions


    | Operation | Effect |

    | --- | --- |

    | ![ EXPR ] | True if EXPR is false. |

    | ( EXPR ) | Returns the value of EXPR. This may be used to override the normal
    precedence of operators. |

    | EXPR1 -a EXPR2 | True if both EXPR1 and EXPR2 are true. |

    | EXPR1 -o EXPR2 | True if either EXPR1 or EXPR2 is true. |


    103'
