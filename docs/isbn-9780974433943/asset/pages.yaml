    \ with the following lines provide valuable information about what your script\
    \ is:\n\n```\ndeclare -t VARIABLE=value\ntrap \"echo VARIABLE is being used here.\"\
    \ DEBUG\n\n# rest of the script\n```\n\nRemoving rubbish upon exit\n\nThe whatis\
