  md: '# Chapter 1: Bash and Bash Scripts


    # Interactive shells


    An interactive shell generally reads from a terminal, and writes to, a user’s
    terminal: input and output are connected to a terminal. Bash interactive behavior
    is started when the bash command is called upon without non-option arguments,
    except when the option is a string to read from or when the shell is invoked to
    read from standard input, which allows for positional parameters to be set (see
    Chapter 3, "The Bash environment").


    Is this shell interactive? Test by looking at the content of the special parameter
    -, it contains an ''i'' when the shell is interactive:


    ```

    eddy:$> echo $-\$

    himBH

    ```


    In non-interactive shells, the prompt, PS1, is unset.


    # Interactive shell behavior Differences in interactive mode:


    +   - Bash reads startup files.

    - Job control enabled by default.

    - Prompts are set, PS2 is enabled for multi-line commands, it is usually set to
    ">>". This is also the prompt you get when the shell thinks you entered an unfinished
    command, for instance when you forget quotes, command structures that cannot be
    left out, etc.

    - Commands are read by default from the command line using readline.

    - Bash interprets the shell option ignoreof instead of exiting immediately upon
    receiving EOF (End Of File).

    - Command history and history expansion are enabled by default. History is saved
    in the file pointed to by HISTFILE when the shell exits. By default, HISTFILE
    points to "$HOME/.bash_history".

    - Alias expansion is enabled.

    - In the absence of traps, the SIGTERM signal is ignored.

    - In the absence of traps, SIGINT is caught and handled. Thus, typing Ctrl+C,
    for example, will not quit your interactive shell.

    - Sending SIGHUP signals to all jobs on exit is configured with the hunuponxit
    option.


    6'
