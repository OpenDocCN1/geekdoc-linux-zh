    -p PROMPT Display PROMPT, without a trailing newline, before attempting

    to read any input. The prompt is displayed only if input is

    coming from a terminal.

    -r If this option is given, backslash does not act as an escape char-

    acter. The backslash is considered to be part of the line.

    in particular, a backslash-newline pair may not be used as a line

    continuation.

    -s Silent mode. If input is coming from a terminal, characters are

    not echoed.

    -t TIMEOUT Cause read to time out and return failure if a complete line of

    input is not read within TIMEOUT seconds. This option has no

    effect if read is not reading input from the terminal or from a

    pipe.

