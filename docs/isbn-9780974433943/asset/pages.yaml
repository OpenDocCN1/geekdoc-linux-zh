    # 7.1.1 Simple applications of if


    In this section, we explore several useful things you can do with the if command.


    # Testing status


    The ? variable holds the exit status of the previously executed command (the most
    recently completed foreground process).


    The following example shows a simple test:


    ```

    anny > if [ $? -eq 0 ]

