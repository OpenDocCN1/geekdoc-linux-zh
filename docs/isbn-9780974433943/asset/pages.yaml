  md: '# 6.4 Summary


    The gawk utility interprets a special-purpose programming language, handling simple
    data-reformatting jobs with just a few lines of code. It is the free version of
    the general UNIX awk command.


    This tools reads lines of input data and can easily recognize columned output.
    The print program is the most common for filtering and formatting fields.


    On-the-fly variable declaration is straightforward and allows for simple calculation
    of sums, statistics and other operations on the processed input stream. Variables
    and commands can be put in awk scripts for background processing.


