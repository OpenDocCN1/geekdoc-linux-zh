  md: '# 7.2 if/then/else constructs


    # Dummy example


    This is the construct to use one course of action if the if commands test true,
    and another if it tests false. An example:


    ```

    freddy scripts gender="male"


    freddy scripts> [ [ "$gender" == "f" ]

    More input> echo "Pleasure to meet you, Madame."

    More input> else echo "How the lady hasn''t got a drink yet?"

    More input> fi

    How the lady hasn''t got a drink yet?


    freddy scripts>

    ```


    Like the CONSEQUENT-COMMANDS list following the then statement, the ALTERNATE-CONSEQUENT-COMMANDS
    list following the else statement can hold any UNIX-style command that returns
    an exit status.


    Another example, extending the one from Section 7.1.1:


    ```

    anny > su -

    Password:

    [root@elegance]# # if grep $USER /etc/passwd 1>/dev/null

    > then echo "your user account is not managed locally"

    > else echo "your account is managed from the local /etc/passwd file"

    > fi

    your account is managed from the local /etc/passwd

    [root@elegance]#

    ```


    We switch to the root account to demonstrate the effect of the else statement
    - your root is usually a local account while your user account might be managed
    by a central system, such as an LDAP server.


    # Check command line arguments


    Instead of setting a variable and then executing a script, it is frequently more
    elegant to put the values for the variables on the command line.


    We use the positional parameters $1, $2, ..., $N for this purpose. $$ refers to
    the number of command line arguments. $0 refers to the name of the script.'
