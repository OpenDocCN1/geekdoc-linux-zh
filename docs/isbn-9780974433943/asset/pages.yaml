    ```


    Backslash.

    The eight-bit character whose value is the octal value NNN (zero to three octal
    digits).


    The eight-bit character whose value is the octal value NNN (one to three octal
    digits).


    The eight-bit character whose value is the hexadecimal value (one or two hexadecimal
    digits).


    For more information about the printf command and the way it allows you to format
    output; see the Bash info pages.


    # 8.2 Catching user input


    The read built-in command is the counterpart of the echo and printf commands.
    The syntax of the read command is as follows:


    ```

    read [options] NAME1 NAME2 ... NAMEN

    ```


    One line is read from the standard input, or from the file descriptor supplied
    as an argument to the -u option. The first word of the line is assigned to the
    first name, NAME1, the second to the second name, and so on, with leftover words
    and their intervening separators assigned to the last name, NAMEN. If there are
    fewer words read from the input stream than there are names, the remaining names
    are assigned empty values.


    The characters in the value of the IFS variable are used to split the input line
    into words or tokens; see Section 3.4.7. The backslash character may be used to
    remove any special meaning for the next character read and for line continuation.


    If no names are supplied, the line read is assigned to the variable REPLY.


    The return code of the read command is zero, unless an end-of-file character is
    encountered, if read times out or if an invalid file descriptor is supplied as
    the argument to the -u option.


    The following options are supported by the Bash read built-in:


    Table 8.2: Options to the read built-in


    | Option | Meaning |

    | -a ANAME | The words are assigned to sequential indexes of the array variable
