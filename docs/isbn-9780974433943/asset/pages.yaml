    # Redirection of errors


    From the previous examples, it is clear that you can provide input and output
    files for a script (see Section 8.2.3 for more), but some tend to forget about
    redirecting errors - output which might be depended upon later on. Also, if you
    are lucky, errors will be mailed to you and eventual cases of failure might get
    revealed. If you are not as lucky, errors will cause your script to fail and won''t
    be caught or sent anywhere, so that you can''t start to do any worthwhile debugging.


    When redirecting errors, note that the order of redirection is significant. For
    example, this command, issued in /var/spool


    ```

    ls -l 2 > /var/tmp/inaccessible-in-spool

    ```


    will redirect output of the ls command to the file inaccessible-in-spool in /var/tmp.
    The command


    ```

    ls -l * 2 > /var/tmp/spoollist 2>&

    ```


    will direct both standard input and standard error to the file spoollist. The
    command


    ```

    ls -l * 2>& > /var/tmp/spoollist

    ```


    directs only the standard output to the destination file, because the standard
    error is copied to standard output before the standard output is redirected.


    For convenience, errors are often redirected to /dev/null, if it is sure they
    will not be needed. Hundreds of examples can be found in the startup scripts for
    your system.


    Bash allows for both standard output and standard error to be redirected to the
    file whose name is the result of the expansion of FILE with this construct:


    ```

    &> FILE

