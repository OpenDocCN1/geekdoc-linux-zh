    When first trying to read the value of full_name in a subshell, it is not there
    (echo shows a null string). The subshell quits, and full_name is exported in the
    parent - a variable that can be exported after it has been assigned a value. Then
    a new subshell is started, in which the variable exported from the parent is visible.
    The variable is changed to hold another name, but the value for this variable
    in the parent stays the same.


