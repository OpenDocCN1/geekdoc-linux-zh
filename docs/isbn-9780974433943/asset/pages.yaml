  md: '# 1.2 Advantages of the Bourne Again SShell


    Invoked with the sh command


    Bash tries to behave as the historical Bourne sh program while conforming to the
    POSIX standard as well.


    Files read:


    +   - /etc/profile

    - /.profile


    When invoked interactively, the ENV variable can point to extra startup information.


    # POSIX mode


    This option is enabled either using the set built-in:


    ```

    set -o posix

    ```


    or by calling the bash program with the --posix option. Bash will then try to
    behave as compliant as possible to the POSIX standard for shells. Setting the
    POSIXLY_CORRECT variable does the same.


    Files read:


    +   - defined by ENV variable.


    # Invoked remotely


    Files read when invoked by rshd:


    +   - /.bashrc


    > Avoid use of r-tools


    Be aware of the dangers when using tools such as rlogin, telnet, rsh and rcp.
    They are intrinsically insecure because confidential data is sent over the network
    unencrypted. If you need tools for remote execution, file transfer and so on,
    use an implementation of Secure Shell, generally known as SSH, freely available
    from <http://www.openssh.org>. Different client programs are available for non-UNIX
    systems as well; see your local software mirror.


    # Invoked when UID is not equal to EUID


    When the effective user ID (EUID) of the Bash process is different from the user
    ID of the person invoking the script, Bash does not read any startup files. This
    situation generally arises from setuid scripts; see the setuid man page for more
    information.'
