  md: "# Chapter 7: Conditional statements\n\nThe (or test) built-in evaluates conditional\
    \ expressions using a set of rules based on the number of arguments. More information\
    \ about this subject can be found in the Bash documentation. Just like the if\
    \ is closed with fi, the opening angular bracket should be closed after the conditions\
    \ have been listed.\n\n# Commands following the then statement\n\nThe CONSEQUENT-COMMANDS\
    \ list that follows the then statement can be any valid UNIX command, any executable\
    \ program, any executable shell script or any shell statement, with the exception\
    \ of the closing fi. It is important to remember that the then and fi are considered\
    \ to be separated statements in the shell. Therefore, when issued on the command\
    \ line, they are separated by a semi-colon.\n\nIn a script, the different parts\
    \ of the if statement are usually well-separated. Be-low, a couple of simple examples.\n\
    \n# Checking files\n\nThe first example checks for the existence of a file:\n\n\
    ```\nanny > cat msgcheck.sh\n#!/bin/bash\necho \"This scripts checks the existence\
    \ of the messages file.\"\necho \"Checking...\"\nif [ -f /var/log/messages ]\n\
    then\n    echo \"/var/log/messages exists.\"\nfi\necho \"...done.\"\nanny > ./msgcheck.sh\n\
    This scripts checks the existence of the messages file.\nChecking...\n/var/log/messages\
    \ exists.\n\ndone.\n```\n\n# Checking shell options\n\nTo add in your Bash configuration\
    \ files:\n\n```\n# These lines will print a message if the noclobber option is\
    \ set:\nif [ -o noclobber ]\nthen\n    echo \"Your files are protected against\
    \ accidental overwriting using redirection.\"\nfi\n```"
