    To print the file starting from a certain line until the end of the file, use
    a command similar to this:


    ```

    sandy > sed ''3,$d'' example

    This is the first line of an example text.

    It is a text with errors.


    sandy >

    ```


    This only prints the first two lines of the example file.


    The following command prints the first line containing the pattern "a text", up
    to and including the next line containing the pattern "a line":


    ```

    sandy > sed -n ''/a text/,/This/p'' example

    It is a text with errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    This is a line not containing any errors.


    sandy >

    ```


    ## 5.2.4 Find and replace with sed


    In the example file, we will now search and replace the errors instead of only
    (de)selecting the lines containing the search string.


    ```

    sandy > sed ''s/errors/errors/'' example

    This is the first line of an example text.

    It is a text with errors.

    Lots of errors.

    So much errors, all these errors are making me sick.

    This is a line not containing any errors.

    This is the last line.


    sandy >

    ```


    As you can see, this is not exactly the desired effect: in line 4, only the first
    occurrence of the search string has been replaced, and there is still an ''error''
    left. Use the g command to indicate to sed that it should examine the entire line
    instead of stopping at the first occurrence of your string:


