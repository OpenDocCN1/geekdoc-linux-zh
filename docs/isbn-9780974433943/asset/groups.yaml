- md: "\n# Chapter 10: More on variables\n\n```bash\n[bob in ] cat vartest.sh\n#!/bin/bash\n\
    \n# This script tests whether a variable is set. If not,\n# it exits printing\
    \ a message.\n\necho ${TESTVAR?:\"There's so much I still wanted to do...\"}\n\
    echo \"TESTVAR is set, we can proceed.\"\n\n[bob in testdir] .vartest.sh\n./vartest.sh:\
    \ line 6: TESTVAR: There's so much I still wanted to do...\n\n[bob in testdir]\
    \ export TESTVAR=present\n\n[bob in testdir] .vartest.sh\npresent\nTESTVAR is\
    \ set, we can proceed.\n```\n\nUsing \"+\" instead of the exclamation mark sets\
    \ the variable to the expansion of WORD; if it does not exist, nothing happens.\n\
    \n## Removing substrings\n\nTo strip a number of characters, equal to OFFSET,\
    \ from a variable, use this syntax:\n`${VAR:OFFSET:LENGTH}`\n\nThe LENGTH parameter\
    \ defines how many characters to keep, starting from the first character after\
    \ the offset point. If LENGTH is omitted, the remainder of the variable content\
    \ is taken:\n\n```bash\n[bob in ] export STRING=\"thisisisaverylongname\"\n[bob\
    \ in ] echo ${STRING:4}\nisaverylongname\n[bob in ] echo ${STRING:6:5}\navery\n\
    ```\n\n```bash\n${VAR#WORD}\n```\n\nand\n${VAR##WORD}\n\nThese constructs are\
    \ used for deleting the pattern matching just as in expansion of WORD in VAR.\
    \ WORD is expanded to produce a pattern just in file name expansion. If the pattern\
    \ matches the beginning of the expanded value of VAR, the result of the expansion\
    \ is the expanded value of VAR with the shortest matching pattern (\"#\") or the\
    \ longest matching pattern (indicated with \"##\").\n\nIf VAR is * or @, the pattern\
    \ removal operation is applied to each positional parameter in turn, and the expansion\
    \ is the resultant list.\nIf VAR is an array variable subscribed with \"*\" or\
    \ \"*\", the pattern removal operation is applied to each member of the array\
    \ in turn, and the expansion is the resultant list. This is shown in the following\
    \ examples:\n\n```bash\n[bob in ] echo ${ARRAY[*]}\none one two three four\n\n\
    [bob in ] echo ${ARRAY[*]}#one\ntwo three four\n\n[bob in ] echo ${ARRAY[*]}#t\n\
    wo wo one three four\n\n[bob in ] echo ${ARRAY[*]}#t*\none wo one three four\n\
    \n[bob in ] echo ${ARRAY[*]}##t*\none one one four\n```\n\nThe opposite effect\
    \ is obtained using \"%%\" and \"%%\", as in this example below.\nWORD should\
    \ match a trailing portion of:\n\n```bash\n[bob in ] echo $STRING\nthisisaaverylongname\n\
    \n[bob in ] echo ${STRING%name}\nthisisaaverylong\n```\n\n## Replacing parts of\
    \ variable names\n\nThis is done using the\n`${VAR/PATTERN/STRING}`\nor\n`${VAR//PATTERN/STRING}`\n\
    \nsyntax. The first form replaces only the first match, the second replaces all\
    \ matches of PATTERN with STRING.\n\n```bash\n[bob in ] echo ${STRING/name/string}\n\
    thisisaaverylongstring\n```\n\nMore information can be found in the Bash info\
    \ pages.\n\n# Chapter 10: More on variables\n\n## 10.4 Summary\n\nNormally, a\
    \ variable can hold any type of data, unless variables are declared explicitly.\
    \ Constant variables are set using the readonly built-in command.\n\nAn array\
    \ holds a set of variables. If a type of data is declared, then all elements in\
    \ the array will be set to hold only this type of data.\n\nBash features allow\
    \ for substitution and transformation of variables \"on the fly\". Standard operations\
    \ include calculating the length of a variable, arithmetic on variables, substituting\
    \ variable content and substituting part of the content.\n\n## 10.5 Exercises\n\
    \nHere are some brain crackers:\n\n- 1. Write a script that does the following:\n\
    \  - Display the name of the script being executed.\n  - Display the first, third\
    \ and tenth argument given to the script.\n  - Display the total number of arguments\
    \ passed to the script.\n  - If there were more than three positional parameters,\
    \ use shift to move all the values 3 places to the left.\n  - Print all the values\
    \ of the remaining arguments.\n  - Print the number of arguments.\n- 2. Write\
    \ a script that implements a simple web browser (in text mode), using wget and\
    \ links -dump to display HTML pages to the user. The user has 3 choices: enter\
    \ a URL, enter b for back and q to quit. The last 10 URLs entered by the user\
    \ are stored in an array, from which the user can restore the URL by using the\
    \ back functionality.\n\n# Chapter 11\n\n# Functions\n\nIn this chapter, we will\
    \ discuss\n\n- What functions are\n- Creation and displaying of functions from\
    \ the command line\n- Functions in scripts\n- Passing arguments to functions\n\
    - When to use functions\n\n# Chapter 11: Functions\n\n## 11.1 What are functions?\n\
    \nShell functions are a way to group commands for later execution, using a single\
    \ name for this group, or routine. The name of the routine must be unique within\
    \ the shell or script. All commands that make up a function are executed like\
    \ regular commands. When calling on a function as a simple command name, the list\
    \ of commands associated with that function name is executed. A function is executed\
    \ within the shell in which it has been declared: no new process is created to\
    \ interpret the commands.\n\nSpecial built-in commands are found before shell\
    \ functions during command lookup. The special built-ins are: break, continue,\
    \ eval, exit, export, readonly, return, set, trap and unset.\n\n### 11.1.1 Function\
    \ syntax\n\nFunctions use the syntax\n\n```bash\nfunction { COMMANDS; }\n```\n\
    \nor\n\n```bash\n() { COMMANDS; }\n```\n\nBoth define a shell function. The use\
    \ of function is optional; however, parentheses are needed. The curly braces must\
    \ be separated from the body by spaces, otherwise they are interpreted in the\
    \ wrong way. The body of a function should end in a semicolon or a newline.\n\n\
    ### 11.1.2 Positional parameters in functions\n\nWhen a function is executed,\
    \ the arguments to the function become the positional parameters during its execution.\
    \ The special parameter # that expands to the number of positional parameters\
    \ is updated to reflect the change. Positional parameter $0 is unchanged. The\
    \ Bash variable FUNCNAME is set to the name of the function, while it is executing.\n\
    \nIf the return built-in is executed in a function, the function completes and\
    \ resumes with the next command after the function call. When a function completes,\
    \ the values of the positional parameters and the special parameter # are restored\
    \ to the values they had prior to the function's execution. If a numeric argument\
    \ is given to return, that status is returned. A simple example:\n\n```bash\n\
    [bob in ] cat vartest.sh\n#!/bash\n\n# This script tests whether a variable is\
    \ set. If not,\n# it exits printing a message.\n\necho ${TESTVAR?:\"There's so\
    \ much I still wanted to do...\"}\necho \"TESTVAR is set, we can proceed.\"\n\n\
    [bob in testdir] .vartest.sh\n./vartest.sh: line 6: TESTVAR: There's so much I\
    \ still wanted to do...\n\n[bob in testdir] export TESTVAR=present\n\n[bob in\
    \ testdir] .vartest.sh\npresent\nTESTVAR is set, we can proceed.\n```\n\nFunctions\
    \ are like mini-scripts: they can accept parameters, they can use variables only\
    \ known within the function (using local built-in) and they can return values\
    \ to the calling shell. Note that the value or exit code of the function is often\
    \ stored in a variable, so that it can be probed at a later point. The init scripts\
    \ often use the technique of probing the retval variable in a conditional test,\
    \ like this one:\n\n```bash\nif [ $RETVAL -eq 0 ]; then\n  <start the daemon>\n\
    ```\n\nOr like this example from the /etc/init.d/amd script, where Bash’s optimaza-\n"
  mdcn: "\n\n# 第 10 章：关于变量更多\n\n```bash\n[bob in ] cat vartest.sh\n#!/bin/bash\n\n\
    # 此脚本测试变量是否设置。如果没有设置，\n# 它将打印消息并退出。\n\necho ${TESTVAR?:\"There's so much I still\
    \ wanted to do...\"}\necho \"TESTVAR is set, we can proceed.\"\n\n[bob in testdir]\
    \ .vartest.sh\n./vartest.sh: line 6: TESTVAR: There's so much I still wanted to\
    \ do...\n\n[bob in testdir] export TESTVAR=present\n\n[bob in testdir] .vartest.sh\n\
    present\nTESTVAR is set, we can proceed.\n```\n\n使用 `+` 代替感叹号会将变量设置为 `WORD` 的展开值；如果该变量不存在，则什么都不会发生。\n\
    \n## 移除子字符串\n\n要从变量中删除等于 `OFFSET` 的字符，请使用以下语法：\n`${VAR:OFFSET:LENGTH}`\n\n`LENGTH`\
    \ 参数定义了从偏移点后的第一个字符开始保留多少个字符。如果省略 `LENGTH`，则取变量内容的剩余部分：\n\n```bash\n[bob in ] export\
    \ STRING=\"thisisisaverylongname\"\n[bob in ] echo ${STRING:4}\nisaverylongname\n\
    [bob in ] echo ${STRING:6:5}\navery\n```\n\n```bash\n${VAR#WORD}\n```\n\n以及\n\
    ${VAR##WORD}\n\n这些结构用于删除模式匹配，就像在 `VAR` 中展开 `WORD` 一样。`WORD` 被展开以产生一个模式，就像在文件名扩展中一样。如果模式匹配了\
    \ `VAR` 展开值的开头，则展开的结果为 `VAR` 的展开值减去最短的匹配模式（用 `\"#\"` 表示）或最长的匹配模式（用 `\"##\"` 表示）后的值。\n\
    \n如果 `VAR` 是 `*` 或 `@`，则模式移除操作将依次应用于每个位置参数，展开结果为生成的列表。\n如果 `VAR` 是一个带有 `*` 或 `@`\
    \ 索引的数组变量，模式移除操作将依次应用于数组的每个成员，展开结果为生成的列表。下例所示：\n\n```bash\n[bob in ] echo ${ARRAY[*]}\n\
    one one two three four\n\n[bob in ] echo ${ARRAY[*]}#one\ntwo three four\n\n[bob\
    \ in ] echo ${ARRAY[*]}#t\nwo wo one three four\n\n[bob in ] echo ${ARRAY[*]}#t*\n\
    one wo one three four\n\n[bob in ] echo ${ARRAY[*]}##t*\none one one four\n```\n\
    \n使用 `\"%%\"` 和 `\"%\"` 可以获得相反的效果，如下例所示。\n`WORD` 应该匹配字符串尾部的一部分：\n\n```bash\n[bob\
    \ in ] echo $STRING\nthisisaaverylongname\n\n[bob in ] echo ${STRING%name}\nthisisaaverylong\n\
    ```\n\n## 替换变量名的部分\n\n这是通过\n`${VAR/PATTERN/STRING}`\n或\n`${VAR//PATTERN/STRING}`\n\
    语法实现的。第一种形式只替换第一个匹配项，第二种形式将所有的 `PATTERN` 替换为 `STRING`。\n\n```bash\n[bob in ] echo\
    \ ${STRING/name/string}\nthisisaaverylongstring\n```\n\n更多信息可以在 Bash info 页面找到。\n\
    \n# 第 10 章：变量更多\n\n## 10.4 总结\n\n通常情况下，变量可以持有任何类型的数据，除非显式声明变量。常量变量使用 `readonly`\
    \ 内置命令设置。\n\n数组持有一组变量。如果声明了数据类型，则数组中的所有元素都将设置为仅持有该类型的数据。\n\nBash 特性允许“对”变量进行替换和转换。标准操作包括计算变量长度、对变量进行算术运算、替换变量内容以及替换部分内容。\n\
    \n## 10.5 练习\n\n这里有一些脑筋急：\n\n- 1. 编写一个脚本实现以下功能：\n  - 显示正在执行的脚本名称。\n  - 显示传递给脚本的第一、第三和第十参数。\n\
    \  - 显示传递给脚本的参数总量。\n  - 如果位置参数超过三个，使用 `shift` 将所有值向左移动 3 位。\n  - 打印剩余参数的所有值。\n\
    \  - 打印参数数量。\n- 2. 编写一个实现简单的 Web 浏览器（文本模式），使用 `wget` 和 `links -dump` 向用户显示 HTML\
    \ 页面。用户有 3 个选择：输入 URL、输入 `b` 返回、输入 `q` 退出。用户输入的最后 10 个 URL 存储在一个数组中，用户可以使用返回功能恢复这些\
    \ URL。\n\n# 第 11 章\n\n# 函数\n\n在本章中，我们将讨论\n\n- 什么是函数\n- 从命令行创建和显示函数\n- 脚本中的函数\n\
    - 向函数传递参数\n- 何时使用函数\n\n# 第 11 章：函数\n\n## 11.1 什么是函数？\n\nShell 函数是将命令分组以便稍后执行的方法，为该组或例程使用单个名称。例程的名称在\
    \ shell 或脚本中必须是唯一的。组成函数的所有命令都像普通命令一样执行。当作为简单命令名调用函数时，与该函数名关联的命令列表将被执行。函数在它定义的\
    \ shell 中执行：不会创建新进程来解释这些命令。\n\n在命令查找期间，shell 函数之前会找到特殊的内置命令。这些特殊内置命令是：`break`,\
    \ `continue`, `eval`, `exit`, `export`, `readonly`, `return`, `set`, `trap` 和\
    \ `unset`。\n\n### 11.1.1 函数语法\n\n函数使用以下语法：\n\n```bash\nfunction { COMMANDS; }\n\
    ```\n\n或者\n\n```bash\n() { COMMANDS; }\n```\n\n两者都定义了一个 shell 函数。`function` 的使用是可选的；但括号是必要的。大括号必须与正体分开，否则它们会被错误解释。函数体应以分号或换行结束。\n\
    \n### 11.1.2 函数中的位置参数\n\n当执行函数时，传递给函数的参数在执行期间成为位置参数。展开为参数数量的特殊参数 `#` 会更新以反映这一变化。位置参数\
    \ `$0` 保持不变。在执行期间，Bash 变量 `FUNCNAME` 被设置为函数的名称。\n\n如果在函数内部执行 `return` 内置命令，函数将完成并从调用后的下一个命令继续执行。当函数完成时，位置参数和特殊参数\
    \ `#` 将恢复到函数执行前的值。如果给 `return` 传递一个数字参数，则返回该状态。一个简单的示例：\n\n```bash\n[bob in ]\
    \ cat vartest.sh\n#!/bash\n\n# 此脚本测试变量是否设置。如果没有设置，\n# 它将打印消息并退出。\n\necho ${TESTVAR?:\"\
    There's so much I still wanted to do...\"}\necho \"TESTVAR is set, we can proceed.\"\
    \n\n[bob in testdir] .vartest.sh\n./vartest.sh: line 6: TESTVAR: There's so much\
    \ I still wanted to do...\n\n[bob in testdir] export TESTVAR=present\n\n[bob in\
    \ testdir] .vartest.sh\npresent\nTESTVAR is set, we can proceed.\n```\n\n函数就像微脚本：它们可以接受参数，可以使用仅在函数内部知的变量（使用\
    \ `local` 内置命令），并向调用 shell 返回值。注意，函数的返回值或退出码通常存储在变量中，以便稍后探测。初始化脚本经常使用在条件测试中探测\
    \ `retval` 变量的技术，如下：\n\n```bash\nif [ $RETVAL -eq 0 ]; then\n  <start the daemon>\n\
    ```\n\n或者如 /etc/init.d/amd 脚本中的这个示例，其中 Bash 的 optimaza-\n\n"
