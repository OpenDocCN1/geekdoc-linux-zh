    # Common UNIX Commands


    This section contains an alphabetical overview of common UNIX commands. More information
    about the usage can be found in the man or info pages.


    ## A


    - - a2ps Format files for printing on a PostScript printer.

    - acroread PDF viewer.

    - adduser Create a new user or update default new user information.

    - alias Create a shell alias for a command.

    - anacron Execute commands periodically, does not assume continuously running.

    - apropos Search the whatis database for strings.

    - apt-get APT package handling utility.

    - aspell Spell checker.

    - at, atq, atrm Queue, examine or delete jobs for later execution.

    - aumix Adjust audio mixer.

    - (g)awk Pattern scanning and processing language.


    ## B


    - - bash Bourne Again SHell.

    - batch Queue, examine or delete jobs for later execution.

    - bg Run a job in the background.

    - bitmap Bitmap editor and converter utilities for the X window System.

    - bzip2 A block-sorting file compressor.


    ## C


    - cat Concatenate files and print to standard output.

    - cd Change directory.

    - cdp/cdplay An interactive text-mode program for controlling and playing audio
    CD Roms under Linux.

    - cdparanoia An audio CD reading utility which includes extra data verification
    features.

    - cdrecord Record a CD-R.

    - chattr Change file attributes.

    - chgrp Change group ownership.

    - chkconfig Update or query run level information for system services.

    - chmod Change file access permissions.

    - chown Change file owner and group.

    - compress Compress files.

    - cp Copy files and directories.

    - crontab Maintain crontab files.

    - csh Open a C shell.

    - cut Remove sections from each line of file(s).


    ## D


    - date Print or set system date and time.

    - dd Convert and copy a file (disk dump).

    - df Report file system usage.

    - dhcp DHCP client.

    - diff Differences between two files.

    - dig DNS name query.

    - dmesg Print kernel buffer.

    - du Estimate file space.


    ## E


    - echo Print a line of text.

    - egrep Extended grep.

    - eject Unmount removable media.

    - emacs Start Emacs editor.

    - exec Invoke subprocess.

    - exit Exit current shell.

    - export All or part of environment.


    ## F


    - fetch Fetch mail.

    - fdisk Partition table.

    - find Find files.

    - fortune Print random adage.

    - fg Bring a job in the foreground.

    - file Determine type.


    ## G


    - gale Graphical web browser.

    - gdm Desktop Manager.

    - getty Control console.

    - gimp Image manipulation.

    - grep Print lines matching a pattern.

    - groff Print with groff.

    - grub The boot loader.

    - gzip Compress or expand files.


    ## I


    - id Print real and effective UIDs.

    - ifconfig Configure network interface.

    - info Read Info documents.

    - init Process initialization.

    - iostat I/O statistics.


    ## J


    - jar Java archive tool.

    - jobs List backgrounded tasks.


    ## K


    - kdm Desktop manager for KDE.

    - kill(all) Terminate process.

    - ksh Open a Korn shell.


    ## L


    - ldapmodify Modify an entry.

    - ldapsearch LDAP search tool.

    - less more with features.

    - lilo Linux boot loader.

    - links Make links between.

    - loadkeys Load keyboard tables.

    - locate Find files.

    - logout Close current shell.


    ## M


    - mail Send and receive mail.

    - man Read man pages.

    - mccopy Copy MSDOS files to Unix.

    - mdir Display an MSDOS directory.

    - memusage Display memory usage.

    - memusagetat Display memory usage statistics.

    - mesg Control write access to your terminal.

    - mformat Add an MSDOS file system to a low-level formatted floppy disk.

    - mkbootdisk Creates a stand-alone boot floppy for the running system.

    - mkdir Create directory.

    - mkisof Create a hybrid ISO9660 filesystem.

    - more Filter for displaying text one screen at the time.

    - mount a file system or display information about mounted file systems.

    - mozilla Web browser.

    - mt Control tape drive operation.

    - mtr Network diagnostic tool.

    - mv Rename files.


    ## N


    - named Internet domain name server.

    - ncftp Browser for ftp services (insecure!).

    - netstat Print network connections, routing tables, interface statistics, masqueraded
    connections, and multi-cast memberships.

    - nfsstat Print statistics about networked file systems.

    - nice Run a program with modified scheduling priority.

    - nmap Network exploration tool and security scanner.

    - nsysv Simple interface for configuring run levels.


    ## P


    - passwd Change password.

    - pdf2ps Ghostscript PDF to PostScript translator.

    - perl Practical Extraction and Report Language.

    - pg Page through text output.

    - ping Send echo request to a host.

    - pr Convert text files for printing.

    - printenv Print all or part of environment.

    - procmail Autonomous mail processor.

    - ps Report process status.

    - pstree Display a tree of processes.

    - pwd Print present working directory.


    ## Q


    - quota Display disk usage and limits.


    ## R


    - rpc Remote copy (unsafe!)

    - rdesktop Remote Desktop Protocol client.

    - reboot Stop and restart the system.

    - renice Alter priority of a running process.

