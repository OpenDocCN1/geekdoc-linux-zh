    # 9.6 Making menus with the select built-in


    Use of select


    The select construct allows easy menu generation. The syntax is quite similar
    to that of the for loop:


    ```

    select WORD [in LIST]; do RESPECTIVE-COMMANDS; done

    ```


    LIST is expanded, generating a list of items. The expansion is printed to standard-error,
    each item is preceded by a number. If LIST is not present, the positional parameters
    are printed, as if in $ would have been specified. LIST is only printed once.


    Upon printing all items, the PS3 prompt is printed and one line from standard
    input is. If this line consists of a number corresponding to one of the items,
    the value of WORD is set to the name of that item. If the line is empty, the items
    and the PS3 prompt are displayed again. If an EOF (End Of File) character is read,
    the loop exits. Since most users don''t have a clue which key combination is used
    for the EOF sequence, it is more user-friendly to have a break command as one
    of the items. Any other value of the read line will set WORD to be a null string.


    The read line is saved in the REPLY variable.


    The RESPECTIVE-COMMANDS are executed after each selection until the number representing
    the break is read. This exits the loop.


    Examples


    This is a simple example, but as you can see, it is not very user-friendly:


    ```

    [carol@octarine testdir] cat private.sh

    #!/bin/bash


    echo "This script can make any of the files in this directory private."

    echo "The number of the file you want to protect:"


    select FILENAME in *;

    do

    necho "You picked $FILENAME (\$REPLY), it is now only accessible to you."

    chmod go-rwx "$FILENAME"

    ```


