- md: '

    # Chapter 3: The Bash environment


    The positional parameters are the words following the name of a shell script.
    They are put into the variables $1, $2, $3 and so on. As long as needed, variables
    are added to an internal array. $# holds the total number of parameters, as is
    demonstrated with this simple script:


    ```

    #!/bin/bash


    # positional.sh

    # This script reads 3 positional parameters and prints them out.


    POSPAR1="$1"

    POSPAR2="$2"

    POSPAR3="$3"


    echo "$1 is the first positional parameter, \$1"

    echo "$2 is the second positional parameter, \$2"

    echo "$3 is the third positional parameter, \$3"

    echo

    echo "The total number of positional parameters is $#."

    ```


    Upon execution one could give any numbers of arguments:


    ```

    franky > positional.sh one two three five

    one is the first positional parameter, $1.

    two is the second positional parameter, $2.

    three is the third positional parameter, $3.


    The total number of positional parameters is 5.


    franky > positional.sh one two

    one is the first positional parameter, $1.

    two is the second positional parameter, $2.

    is is the third positional parameter, $3.


    The total number of positional parameters is 2.

    ```


    More on evaluating these parameters is in Chapter 7, "Conditional statements"
    and Section 9.


    Some examples on the other special parameters:


    ```

    franky > grep dictionary /usr/share/dict/words

    dictionary


    franky > echo \_

    /usr/share/dict/words


    franky > echo $$

    10662


    franky > mozilla &\n[1] 11064

    ```


    ## 3.2 Variables


    ```

    franky > echo $!

    11064


    franky > echo $0

    bash


    franky > ls doesnotexist

    ls: doesnotexist: No such file or directory


    franky > echo $?

    0


    franky > echo $?

    1

    ```


    User franky starts entering the command, which results in the assignment of the
    variable. The process ID of his shell is 10662. After putting a job in the background,
    the ! holds the process ID of the backgrounded job. When a mistake is made, ?
    holds an exit code different from 0 (zero).


    ### 3.2.5 Script recycling with variables


    Apart from making the script more readable, variables will also enable you to
    apply a script more quickly in another environment or for another purpose. Consider
    the following example, a very simple script that makes a backup of franky''s home
    directory to a remote server:


    ```bash

    #!/bin/bash


    # This script makes a backup of my home directory

    cd /home


    # This creates the archive

    tar cf /var/tmp/home_franky.tar /dev/null 2>&1


    # First remove the old bzip2 file. Redirect errors because this generates

    # some if the archive does not exist. Then create a new compressed file.

    rm /var/tmp/home_franky.tar.bz2 /dev/null

    bzip2 /var/tmp/home_franky.tar


    # Copy the file to another host - we have ssh keys for making this work

    # without intervention.

    scp /var/tmp/home_franky.tar.bz2 bordeaux:/opt/backup/franky > /dev/null 2>&1


    # Create a timestamp in a logfile.

    date > /home/franky/log/home_backup.log

    echo backup succeeded > /home/franky/log/home_backup.log

    ```


    First of all, you are more likely to make errors if you name files and directories
    manually each time you need. Secondly, suppose franky wants to give this script
    to carol, then carol will have to do some editing before she can use the script
    to back up her home directory. The same is true if franky wants to use this script
    for backing up other directories. For recycling, make all files, directories,
    usernames, servernames etcetera variable. Thus, you only need to edit a value
    once, without having to go through the entire script to check where a parameter
    occurs. This is an example:


    ```bash

    #!/bin/bash

    # This script makes a backup of my home directory.

    # Change the values of the variables to make the script work for you:

    BACKUPDIR=/franky

    TARFILE=/var/home/franky.tar

    BZIPFILE=/var/home/franky.tar.bz2

    SERVER=bordeaux

    REMOTEDIR=/opt/backup/franky

    LOGFILE=/home/franky/log/home_backup.log

    cd $BACKUPDIR

    # This creates the archive

    tar cf $TARFILE $BACKUPFILES /dev/null 2>&1

    # First remove the old bzip2 file. Redirect errors because this generates

    # some if the archive does not exist. Then create a new compressed file.

    rm $BZIPFILE 2 /dev/null

    bzip2 $TARFILE


    # Copy the file to another host - we have ssh keys for making this work

    # without intervention.

    scp $BZIPFILE $SERVER:$REMOTEDIR /dev/null 2>&1


    # Create a timestamp in a logfile.

    date > $LOGFILE

    echo backup succeeded > $LOGFILE

    ```


    ## Large directories and low bandwidth


    The above is purely an example that everybody can understand, using a small directory
    and a host on the same subnet. Depending on your bandwidth, the transfer of the
    directory and the location of the remote server, can take an awful of time to
    make backups using this mechanism. For larger directories and lower bandwidth,
    use rsync to keep the directories at both ends synchronized.


    ## 3.3 Quoting


    ### 3.3.1 Why?


    A lot of keys have special meanings in some context or other. Quoting is used
    to remove the special meaning of characters or words: quotes can disable special
    treatment for characters, they can prevent reserved words from being recognized
    as such and they can disable parameter expansion.


    ### 3.3.2 Escape characters


    Escape characters are used to remove the special meaning from a character. A non-quoted
    backslash is used as an escape character in Bash. It preserves the literal value
    of the next character that follows, with the exception of newline. If a newline
    character appears immediately after the backslash, it marks the continuation of
    a line when it is longer than the width of the terminal; the backslash is removed
    from the input stream and effectively ignored.


    ```

    franky > date=22

    franky > echo $date

    22

    franky > echo \$date

    date

    ```


    In this example, the variable date is created and set. The first displays the
    value, but for the second, the dollar sign is escaped.


    ### 3.3.3 Single quotes


    Single quotes ('''') are used to preserve the literal value of each character
    enclosed within the quotes. A single quote may not occur between single quotes,
    even when preceded by a backslash. We continue with the example:


    ```

    franky > echo \$date

    date

    ```


    ### 3.3.4 Double quotes


    Using double quotes the literal value of all characters enclosed is preserved
    except for the dollar sign, the backticks (`) and the backslash. The dollar sign
    and the backticks retain their special meaning within the quotes. The backslash
    retains its meaning only when followed by dollar, tick, double quote or newline.
    Within double quotes, the backslashes are removed from the input stream when followed
    by one of these characters. Backslashes preceding characters that don''t have
    a special meaning are left unmodified for processing by the shell. A double quote
    may be quoted within double quotes by preceding it with a backslash.


    ```

    franky > "$date"

    22

    franky > echo ''date''

    Sun Apr 20 11:22 CEST 2003

    franky > echo "I''d say: Go for it!"

    I''d say: Go for it!

    franky > echo "*"

    franky > echo \*


    ```


    ### 3.3.5 ANSI-C quoting


    Words in the form "$STRING" are treated in a special way. The word expands to
    a string, with backslash-escaped characters replaced as specified by the ANSI-C
    standard. Backslash escape sequences can be found in the Bash documentation.


    ### 3.3.6 Locales


    A double-quoted string preceded by a dollar sign will cause the string to be translated
    according to the current locale. If the current locale is "C" or "POSIX", the
    dollar sign is ignored. If the string is translated and replaced, the replacement
    is quoted.


    ## 3.4 Shell expansion


    After the command has been split into tokens (see Section 1.4), these tokens or
    words are expanded or resolved. There are eight kinds of expansion performed,
    which we will discuss in the next sections, in the order that they are expanded.
    After all expansions, quote removal is performed.


    ### 3.4.1 Brace expansion


    Brace expansion is a mechanism by which arbitrary strings may be generated. Patterns
    to be brace-expanded take the form of an optional PREAMBLE, followed by a series
    of comma-separated strings between a pair of braces, followed by an optional POSTSCRIPT.
    The preamble is prefixed to each string contained within the braces, and the postscript
    is then appended to each resulting string, expanding left to right. Brace expansions
    may be nested. The results of each expanded string are not sorted; left to right
    order is preserved:


    ```

    franky ~ echo sp{el,il,al}

    spell spall

    ```


    Brace expansion is performed before any other expansions, and any characters special
    to other expansions are preserved in the result. It is strictly textual. Bash
    does not apply any syntactic interpretation to the context of the expansion or
    the text between the braces. To avoid conflicts with parameter expansion, the
    string "$$" is not considered eligible for brace expansion. A correctly-formed
    brace expansion must contain unquoted opening and closing braces, and at least
    one unquoted comma. Any incorrectly formed brace expansion is left unchanged.


    ### 3.4.2 Tilde expansion


    If a word begins with an unquoted tilde character ("~"), all of the characters
    to the first unquoted slash (or all characters, if there is no unquoted slash)
    are considered a tilde-prefix. If none of the characters in the tilde-prefix are
    quoted, the characters in the tilde-prefix following the slash are treated as
    a possible login name. If this login name is the null string, the tilde is replaced
    with the value of the HOME variable. If HOME is unset, the home directory of the
    user executing the shell is substituted instead. Otherwise, the tilde-prefix is
    replaced with the home directory associated with the specified login name. If
    the tilde-prefix is "~+", the value of the shell variable PWD replaces the tilde-prefix.
    If the tilde-prefix is "~-", the value of the shell variable OLDPWD, if it is
    set,

