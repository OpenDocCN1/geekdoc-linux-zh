    \n```\n#!/bin/bash\n#get脚本是 get-tester-address.sh\n#\n# 首先，我们测试 bash 是否支持数组。\n\
    # (最近才添加了对数组的支持。)\n#\nhest[0]='test' || (echo 'Failure: arrays not supported in\
    \ this version of bash.' && exit 2)\n#\n# 我们的候选人列表。（可以添加或\n# 删除候选人。）\nwholist={\n\
    \  'Bob Smith <example.com',\n  'Jane Williams <example.com',\n  'Eric Raymond\
    \ <example.com',\n  'Larry Wall <example.com',\n  'Linus Torvalds <example.com'\n\
    }\n\n# 统计测试者人数\ncount=0\nwhile [ \"${wholist[$count]}\" != \"\" ]; do\n  count=$((count\
    \ + 1))\ndone\n\n# 现在我们计算周\nweek=$(date +%W) # 周模数量\nindex=$(( week % count ))\n\
