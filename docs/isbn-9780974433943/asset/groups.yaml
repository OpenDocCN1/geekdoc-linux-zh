    \ /etc/passwd\n--output omitted-\n```\n\n请仔细选择输入字段分隔符以防止出现问题。这里有一个示例说明这一点：假设你获取的输入形式如下行：\n\
    \n\"Sandy L. Wong, 64 Zoo St., Antwerp, 2000X\"\n\n你编写了一个命令行或脚本，打印出该记录中人员的姓名：\n\
    \n```\nawk 'BEGIN { FS=\",\" } { print $1, $2, $3 }' inputfile\n```\n\n但某人可能拥有博士学位，写法可能如下：\n\
    \n\"Sandy L. Wong, PhD, 64 Zoo St., Antwerp, 2000X\"\n\n你的 awk 将对这一行给出错误的输出。如有需要，使用额外的\
    \ awk 或 sed 来统一数据输入格式。\n\n默认的输入字段分隔符是一个或多个空格或制表符。\n\n## 6.3.2 输出字段分隔符\n\n在输出中，字段通常由空格分隔。当你使用\
    \ print 命令的正确语法时，这一点变得尤为明显，此时参数之间用逗号隔开：\n\n## 6.3 Gawk 变量\n\n```\nkelly@octarine\
    \ ~//test> cat test\nrecord1 data1\nrecord2 data2\n```\n\n```\nkelly@octarine\
    \ ~//test> awk '{ print $1 $2}' test\nrecord1datal\nrecord2data2\n```\n\n```\n\
    kelly@octarine ~//test> awk '{ print $1, $2}' test\nrecord1 data1\nrecord2 data2\n\
    ```\n\n```\nkelly@octarine ~//test>\n```\n\n如果你不输入逗号，print 将要输出的项目视为一个参数，从而省略对默认输出分隔符\
    \ OFS 的使用。\n\n通过设置内置变量，可以使用任何字符串作为输出字段分隔符。\n\n## 6.3.3 输出记录分隔符\n\n整个 print 语句的输出被称为输出记录。每个\
    \ print 命令都会产生一个输出记录，然后输出一个名为输出记录分隔符（OR）的字符串。该变量的默认值为 \"\\n\"，即换行符。因此，每个 print\
    \ 语句都会生成单独的一行。\n\n要更改输出字段和记录的分隔，请为 OFS 和 OR 分配新值：\n\n```\nkelly@octarine ~//test>\
    \ awk 'BEGIN { OFS=\";\"; OR=\"\\n-->\\n\" } \\\n{ print $1,$2}' test\nrecord1:datal\n\
    -->\nrecord2:data2\n-->\n```\n\n```\nkelly@octarine ~//test>\n```\n\n如果 OR 的值不包含换行符，程序的输出将合并在单行中。\n\
    \n## 6.3.4 记录数\n\n内置变量 NR 存储已处理的记录数。它在读取新的输入行后加 1。你可以在末尾使用它来统计总记录数，也可以在每个输出记录中使用：\n\
    \n# 第 6 章：GNU awk 编程语言\n\n```\nkellyoctarine \"/test> cat processed.awk\nBEGIN\
    \ { OPS=\"-\"; ORS=\"\\n--\" done\\n\" \\\n{ print \"Record number \" NR \"\\\
    t\" $1, $2 \\\nEND { print \"Number of records processed: \" NR }\n```\n\n```\n\
    kellyoctarine \"/test> awk -f processed.awk\nRecord number 1: record1-datal\n\
    -- > done\nRecord number 2: record2-data2\n-- > done\nNumber of records processed:\
    \ 2\n-- > done\n```\n\n## 6.3.5 用户定义变量\n\n除了内置变量外，你还可以定义自己的变量。当 awk 遇到对不存在的（即未预定义的）变量引用时，该变量将被创建并初始化为空字符串。对于所有后续引用，变量的值将取决于赋值给它的值。变量可以是字符串，也可以是数值。输入字段的内容也可以赋值给变量。可以使用\
    \ = 运算符直接赋值，或者你也可以将变量的当前值与其他操作符结合使用：\n\n```\nkellyoctarine \\> cat revenues\n\
    20021009 20021013 consultancy BigComp 2500\n20021015 20021020 training EduComp\
    \ 2000\n20021112 20021123 appdev SmartComp 10000\n20021204 20021215 training EduComp\
    \ 5000\n```\n\n```\nkellyoctarine \\> awk -f total.awk\n{ total-bill += $5 \\\n\
    { print \"Send bill for \" $5 dollar to \" $4 \\\nEND { print \"-------------------------\\\
    nTotal revenue: \" total }\n```\n\n```\nkellyoctarine \\> awk -f total.awk\nSend\
    \ bill for 2500 dollar to BigComp\nSend bill for 2000 dollar to EduComp\nSend\
    \ bill for 10000 dollar to SmartComp\nSend bill for 5000 dollar to EduComp\n-------------------------\n\
    Total revenue: 19500\n```\n\n## 6.3.6 更多示例\n\n使用以下内容会让示例变得简单得多：\n\n```\nkellyoctarine\
    \ \\> \n```\n\n## 6.3.7 printf 程序\n\n为了获得比 print 提供的更精确的输出格式控制，请使用 printf。该命令可以指定字段宽度、是否打印指数以及小数点后的多少位。\n\
    \n## 6.4 总结\n\ngawk 工具是一种特殊用途的编程语言，用于处理数据和格式化字段。它是 awk 最常用的版本。动态变量声明非常直观，并允许进行简单的计算。\n\
    \n## 6.5 练习\n\n这里是一些 awk 可以应用的实际示例：\n\n- 1. 对于第一个练习，你的输入是如下行的：\n\n```\nUsername:Firstname:Lastname:Telephone\
    \ number\n```\n\n编写一个 awk 脚本，将此类行转换为格式如下 LDAP 记录：\n\n```\ndn: uid=Username, dc=example,\
    \ dc=com\ncn: Firstname Lastname\nsn: Lastname\ntelephoneNumber: Telephone number\n\
    ```\n\n- 2. 使用 awk 和标准 UNIX 命令创建一个脚本，显示 /home 系统中磁盘空间前三个用户（如果家目录不在单独分区，请为该分区创建脚本；这在每个\
    \ UNIX 系统上都是）。首先从命令行执行命令。然后将其放入脚本。脚本应该产生合理的输出（老板易读的输出）。如果证明一切正常，让脚本将结果发送给你（例如使用\
    \ `mail -s Disk space usage@your.comp`）。\n\n如果配额守护进程正在运行，请使用该信息；如果没有，使用 `find`。\n\
    \n- 3. 从如下制表符列表创建 XML 风格的输出：\n\n```\nMeaning very long line with a lot of description\n\
    \nmeaning another long line\nothermmeaning more longline\ntestmeaning looooooooooooong\
