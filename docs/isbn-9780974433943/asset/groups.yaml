- md: "\n# Chapter 7: Conditional statements\n\n## 7.6 Using the exit statement and\
    \ if\n\nWe already briefly met the exit statement in Section 7.2. It terminates\
    \ execution of the entire script. It is most often used if the input requested\
    \ from the user is incorrect, if a statement did not run successfully or if some\
    \ other error occurred.\n\nThe exit statement takes an optional argument. This\
    \ argument is the integer exit status code, which is passed back to the parent\
    \ and stored in the $ variable.\n\nA zero argument means that the script ran successfully.\
    \ Any other value may be used by programmers to pass back different messages to\
    \ the parent, so that different actions can be taken according to failure or success\
    \ of the child process. If no argument is given to the exit command, the parent\
    \ shell uses the current value of the $ variable.\n\nBelow is an example with\
    \ a slightly adapted penguin.sh script, which sends its exit status back to the\
    \ parent, feed.sh:\n\n```bash\nany /testdir/cat penguin.sh\n#!/bin/bash\n\n# This\
    \ script lets you present different menus to Tux. He will only be\n# happy when\
    \ given a fish. We've also added a dolphin and (presumably)\n# a camel.\n\nif\
    \ [ \"$menu\" == \"fish\" ]; then\n  if [ \"$animal\" == \"penguin\" ]; then\n\
    \    echo \"Hmmmm fish... Tux happy!\"\n  elif [ \"$animal\" == \"dolphin\" ];\
    \ then\n    echo \"Peweeptreetpeterdepweet!\"\n  else\n    echo \"prrrrrrrt*\"\
    \n  fi\nelse\n  if [ \"$animal\" == \"penguin\" ]; then\n    echo \"Tux don't\
    \ like that. Tux wants fish!\"\n    exit 1\n  elif [ \"$animal\" == \"dolphin\"\
    \ ]; then\n    echo \"Pweewishpeeterdepweet!\"\n    exit 2\n  else\n    echo \"\
    Will you read this sign?\"\n    exit 3\n  fi\nfi\n```\n\nThis script is called\
    \ upon the next one, which therefore exports its variables menu and animal:\n\n\
    ```bash\nany \"/testdir\" cat feed.sh\n#!//bin/bash\n# This script acts upon the\
    \ exit status given by penguin.sh\n\nexport menu=\"$1\"\nexport animal=\"$2\"\n\
    \nfeed=\"/nethome/anny/testdir/penguin.sh\"\n$feed menu animal\n\ncase $7 in\n\
    1)\n    echo \"Guard: You'd better give'm a fish, less they get violent...\"\n\
    \    ;;\n2)\n    echo \"Guard: It's because of people like you that they are leaving\
    \ earth \\\nall the time...\"\n    ;;\n3)\n    echo \"Guard: Buy the food that\
    \ the Zoo provides for the animals, you ***, \\\nhow do you think we survive?\"\
    \n    ;;\n*)\n    echo \"Guard: Don't forget the guide!\"\n    ;;\nesac\n\nany\
    \ \"/testdir\" ./feed.sh apple penguin\nTux don't like that. Tux wants fish!\n\
    guard: You'd better give'm a fish, less they get violent.\n```\n\nAs you can see,\
    \ exit status codes can be chosen freely. Existing commands usually have a series\
    \ of defined codes; see the programmer's manual for each command for more information.\n\
    \n## 7.7 Using case statements\n\nNested if statements might be nice, but as soon\
    \ as you are confronted with a couple of different possible actions to take, they\
    \ tend to confuse. For the more complex conditionals, use the case syntax:\n\n\
    ```bash\ncase EXPRESSION in CASE1) COMMAND-LIST;; CASE2) COMMAND-LIST;; ... CASEEN)\
    \ COMMAND-LIST;; esac\n```\n\nEach case is an expression matching a pattern. The\
    \ commands in the COMMAND-LIST for the first match are executed. The \"|\" symbol\
    \ is used for separating multiple patterns, and the \")\" operator terminates\
    \ a list. Each case plus its according commands are called a clause. Each clause\
    \ must be terminated with \";\"; case statement is ended with the esac\n\nIn the\
    \ example, we demonstrate use of cases for sending a more selective warning message\
    \ with the disktest.sh:\n\n```bash\nany \"/testdir\" cat disktest.sh\n#!//bin/bash\n\
    \n# This script does a very simple test for checking disk space.\n\nspace=`df\
    \ -h | awk '{print $5}' | grep % | grep -v Use | sort -n | tail -1 | \\\n  cut\
    \ -d \" \" -f1`\n\ncase $Space in\n[1-6]*)\n  Message=\"All is quiet.\"\n  ;;\n\
    [7-8]*)\n  Message=\"Start thinking about cleaning up some stuff. There is a partition\
    \ \\\n  that is $space % full.\"\n  ;;\n9[1-8]*)\n  Message=\"Better hurry with\
    \ that new disk... One partition is $space % full.\"\n  ;;\n99)\n  Message=\"\
    I'm drowning here! There's a partition at $space %!\"\n  ;;\n*)\n  Message=\"\
    I seem to be running with an nonexistent amount of disk space...\"\n  ;;\nesac\n\
    \necho $Message | mail -s \"disk report $(date)\" anny\n```\n\n```text\nany \"\
    /testdir\"\nYou have new mail.\n\nany \"/testdir\" tail -f /var/spool/mail/anny\n\
    From anny@octarine Tue Jan 14 22:10:47 2003\nReturn-Path: <anny@octarine>\nReceived:\
    \ from octarine (localhost) Tue Jan 14 22:10:47 2003 by anny@octarine\nDate: Tue\
    \ Jan 14 22:10:47 2003\nSubject: disk report\nStart thinking about cleaning up\
    \ some stuff. There is a partition that is $space % full.\n\nany \"/testdir\"\n\
    ```\n\n### 7.7.1 Init example\n\nInitscripts make use of case statements for starting,\
    \ stopping and querying system services. This is an excerpt of the script that\
    \ starts cron, a daemon that runs periodically with a frequency specified in days.\n\
    \n```bash\ncase \"$1\" in\n    start)\n        start\n        ;;\n    stop)\n\
    \        stop\n        ;;\n    status)\n        status\n        ;;\n    restart)\n\
    \        stop\n        start\n        ;;\n    condrestart)\n        if test !\
    \ $status; then\n            stop\n            start\n        fi\n        ;;\n\
    *)\n    echo \"Usage: $0 {start|stop|restart|status}\"\n    exit 1\nesac\n```\n\
    \nThe tasks to execute in each case, such as stopping and starting the daemon,\
    \ are defined in functions, which are partially sourced from /etc/rc.d/init.d/functions.\
    \ See Chapter 1, \"Functions\" for more.\n\n## 7.8 Summary\n\nIn this chapter\
    \ we learned how to build conditions into our scripts so that different actions\
    \ can be undertaken upon success or failure of a command. The actions can be determined\
    \ using the if statement. This allows you to perform arithmetic and string comparisons,\
    \ and testing of exit code, input and files needed by the script. A simple if/then/fi\
    \ test often precedes commands in a shell script in order to prevent output generation,\
    \ so that the script can easily run in the background or through cron. More complex\
    \ definitions of conditions are usually put in a case statement.\n\nUpon successful\
    \ condition testing, the script can explicitly inform the parent using the exit\
    \ 0 status. Upon failure, any other number may be returned. Based on the return\
    \ code, the parent program can take appropriate action.\n\n## 7.9 Exercises\n\n\
    Here are some ideas to get you started using if in scripts:\n\n- Use an if/then/elif/else\
    \ construct that prints information about the current month. The script should\
    \ print the number of days in this month, and give information about leap years\
    \ if the current month is February.\n- Do the same, using a case statement and\
    \ an alternative use of the date command.\n- Modify /etc/profile so that you get\
    \ a special greeting message when you connect to your system as root.\n- Edit\
    \ the least.sh script from Section 7.5 so that it requires one argument, the year.\
    \ Test that exactly one argument is supplied.\n- Write a script called whichdaemon.sh\
    \ that checks if the httpd and init daemons are running on your system. If an\
    \ httpd is running, the script should print a message like, \"This machine is\
    \ running a web server.\" Use ps to check processes.\n- Write a script that makes\
    \ a backup of your home directory to a remote machine using scp. The script should\
    \ report in a log file, for instance /log/backup.log. If you don't have a second\
    \ machine to copy the backup to, use scp to test copying it to the localhost.\
    \ This requires SSH keys between the two hosts, or else you have to supply a password.\
    \ The creation of SSH keys is explained in man ssh-keygen.\nThe script should\
    \ use tar cf for the creation of the backup and gzip or bzip2 for compressing\
    \ the .tar file. Put all filenames of the remote server and the remote directory\
    \ in a variable. This will make it easier to reuset the script or make changes\
    \ to it in the future.\nThe script should check for the existence of a compressed\
    \ archive. If this exists, remove it first in order to prevent output generation.\n\
    The script should also check for available disk space. Keep in mind that at any\
    \ given moment you could have the data in your home directory, the data in the\
    \ .tar file and the data in the compressed archive all together on your disk.\
    \ If there is not enough disk space, exit with an error message in the log file.\n\
    The script should clean up the compressed archive before exits.\n"
  mdcn: "\n\n# 第 7 章：条件语句\n\n## 7.6 使用 exit 语句和 if\n\n我们在第 7.2 节中简要介绍过 `exit` 语句。它会终止整个脚本的执行。它通常用于用户要求的输入错误、语句未执行成功或发生其他错误等情况。\n\
    \n`exit` 语句接受一个可选参数。该参数是整数退出状态码，它会被传回父进程并存储在 $ 变量中。\n\n参数为 0 表示脚本运行成功。程序员可以使用任何其他值向父进程传递不同的消息，以便根据子进程的成功或失败采取不同的操作。如果没有给\
    \ `exit` 命令提供任何参数，父壳 Shell 将使用 $ 变量的当前值。\n\n下面是一个稍微修改的 `penguin.sh` 脚本示例，它将自己的退出状态返回给父进程\
    \ `feed.sh`：\n\n```bash\nany /testdir/cat penguin.sh\n#!/bin/bash\n\n# 这个脚本允许你向\
    \ Tux 展示不同的菜单。\n# 只有在得到鱼时他才会开心。我们还添加了一只海豚和（可能还有）\n# 一只骆。\n\nif [ \"$menu\" ==\
    \ \"fish\" ]; then\n  if [ \"$animal\" == \"penguin\" ]; then\n    echo \"Hmmmm\
    \ fish... Tux happy!\"\n  elif [ \"$animal\" == \"dolphin\" ]; then\n    echo\
    \ \"Peweeptreetpeterdepweet!\"\n  else\n    echo \"prrrrrrrt*\"\n  fi\nelse\n\
    \  if [ \"$animal\" == \"penguin\" ]; then\n    echo \"Tux don't like that. Tux\
    \ wants fish!\"\n    exit 1\n  elif [ \"$animal\" == \"dolphin\" ]; then\n   \
    \ echo \"Pweewishpeeterdepweet!\"\n    exit 2\n  else\n    echo \"Will you read\
    \ this sign?\"\n    exit 3\n  fi\nfi\n```\n\n该脚本被下一个脚本调用，因此它导出了变量 `menu` 和 `animal`：\n\
    \n```bash\nany \"/testdir\" cat feed.sh\n#!//bin/bash\n# 这个脚本根据 penguin.sh 提供的退出状态执行操作\n\
