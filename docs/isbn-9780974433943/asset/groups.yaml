    \ ##（参数总数；见第 7.2 节）。如果未指定 N，则假设为 1。除非 N 大于 ## 或 小于 0，否则返回状态为 0；否则为非零。\n\n### 9.7.1\
    \ 示例\n\n当无法预知命令的参数数量时，通常会使用 shift，例如用户可以提供任意数量的参数。在这种情况下，参数通常在 **while** 循环中处理，测试条件为\
    \ (($ $#))。只要参数数量大于零，该条件就为真。$1 变量和 **shift** 语句会处理每个参数。每执行一次 **shift**，参数数量就会减少，最终变为零，此时循环退出。\n\
    \n下例 cleanup.sh 使用 **shift** 语句来处理由 **find** 生成的列表中的每个文件：\n\n```bash\n#!/bin/bash\n\
    \n# 此脚本可以清理 365 天前未访问过的文件。\nUSAGE=\"Usage: $0 dir1 dir2 dir3 ... dirN\"\n\nif\
    \ [ \"$#\" = \"0\" ]; then\n  echo \"$USAGE\"\n  exit 1\nfi\n\nwhile [ \"$#\"\
    \ -gt 0 ]; do\n  if [ \"$1\" = \"\" ]; then\n    echo \"Empty directory, nothing\
    \ to be done.\"\n```\n```bash\n  else\n    find $1 -type f -atime +365 -exec rm\
    \ -i {} \\;\n  fi\n\n  shift\ndone\n```\n\n在下一个示例中，我们修改了第 8.2.3 节的脚本，使其一次性接受多个要安装的包：\n\
    \n```bash\n#!/bin/bash\nif [ $1 -lt 1 ]; then\n    echo \"Usage: $0 package(s)\"\
