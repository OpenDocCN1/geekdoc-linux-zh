    - 算术扩展\n- 单词拆分\n- 文件名扩展\n\n我们将在第 3.4 节详细讨论这些扩展类型。\n\n# 1.4 Shell 模块\n\n在执行命令之前，其输入和输出可以使用由\
    \ shell 解释的特殊符号进行重定向。重定向也可以用于为当前 shell 执行环境打开和关闭文件。\n\n# 执行命令\n\n在执行命令时，解析器标记为变量引用赋值（位于命令名之前）和重定向的单词将被保存以备后用。不是变量赋值或重定向的单词将被扩展；扩展后剩余第一个单词被视为命令名，然后执行重定向，接着扩展赋值给变量的字符串。如果没有结果产生命令名，变量将影响当前\
    \ shell 环境。\n\nshell 任务的一个重要部分是搜索命令。Bash 的处理方式如下：\n\n- 检查命令是否包含斜杠。如果没有，首先检查函数列表，查看是否包含我们正在查找的同名命令。\n\
    - 如果命令不是函数，则在内置命令列表中查找。\n- 如果命令既不是函数也不是内置命令，则通过分析 PATH 中列出的目录进行查找。Bash 使用哈希表（内存中的数据存储区域）来记住可执行文件的完整路径名，以避免频繁的\
    \ PATH 搜索。\n- 如果搜索失败，bash 会打印错误信息并返回退出状态 127。\n- 如果搜索成功或命令包含斜杠，shell 在独立的执行环境中执行命令。\n\
    - 如果因为文件不可执行且不是目录导致执行失败，则假定其是一个 shell 脚本。\n\n# Shell 脚本\n\n当一个包含 shell 命令的文件作为调用\
    \ Bash 时的第一个非选项参数使用时（且不带 `-c` 或 `-s`，这将创建一个非交互式 shell），该 shell 首先在当前目录中搜索脚本文件，如果找不到该文件，则在\
    \ PATH 中查找。\n\n# 第 1 章：Bash 与 Bash 脚本\n\n# 1.5 编写良好的脚本\n\n本指南主要关于最后一个 shell 模块：脚本。在继续之前，这里有一些通用的考虑因素：\n\
    \n- 1. 脚本应该在无错误的情况下运行。\n- 2. 它应该执行其预期的任务。\n- 3. 程序逻辑定义清晰且而易见。\n- 4. 脚本不执行不必要的工作。\n\
    - 5. 脚本应该是可重用的。\n\n# 1.5.1 结构\n\nshell 脚本的结构非常灵活。尽管 Bash 赋予了很大的自由，但你必须确保逻辑、流程控制和效率是正确的，以便执行脚本的用户能够轻松正确地操作。\n\
    \n在开始编写新脚本时，问自己以下问题：\n\n- 我是否需要来自用户或用户环境的信息？\n- 我将如何存储这些信息？\n- 是否有任何需要创建的文件？在哪里创建？权限和所有权是什么？\n\
    - 我将使用哪些命令？在不同系统上使用该脚本时，所有系统是否都具有所需版本的这些命令？\n- 用户需要任何通知吗？什么时候以及为什么？\n\n# 1.5.2\
    \ 术语\n\n下表给出了你需要熟悉的编程术语概述：\n\n表 1.1：编程术语概览\n\n| 术语 | 它是什么？ |\n|---|---|\n| 命令控制\
    \ | 测试命令的状态，以确定是否应该执行程序的某部分。 |\n| 条件分支 | 程序中的逻辑点，由条件决定接将发生什么。 |\n| 逻辑流 | 程序的整体设计。决定任务的逻辑顺序，以确保结果成功。\
    \ |\n| 循环 | 程序中执行零或多次的部分。 |\n| 用户输入 | 程序运行时由外部源提供的信息，需要时可以被调用。 |\n\n# 1.5.3 关于顺序与逻辑\n\
    \n为了加快开发过程，应该预先考虑程序的逻辑顺序。这是编写脚本的第一步。\n\n可以使用许多方法；最常用的是处理列表。此示例展示了一个逻辑设计。\n\n-\
