    willy:</scripts>

    ```


    ## 2.2 Script basics


    Which shell will run the script?


    When running a script in a subshell, you should define which shell should

    run the script. The shell type in which you wrote the script might not be the

    default on your system, so commands you entered might result in errors when

    executed by the wrong shell.


    The first line of the script determines the shell to start. The first two characters

    of the first line should be #!, then follows the path to the shell that should

    interpret the commands that follow. Blank lines are also considered to be lines,

    do don''t start your script with an empty line.


    For the purpose of this course, all scripts will start with the line

    #!/bin/bash


    As noted before, this implies that the Bash executable can be found in /bin.


    ## 2.2.1 Adding comments


    You should be aware of the fact that you might not be the only person reading

    your code. A lot of users and system administrators run scripts that were written-


    ten other people. If they want to see how you did it, comments are useful to enlighten
    the reader.


    Comments also make your own life easier. Say that you had to read a lot of man
    pages in order to achieve a particular result with some command that you used
    in your script. You won''t remember how it worked if you need to change your script
    after a few weeks or months, unless you have commented what you did, how you did
    it and/or why you did it.


    Take the script.sh example and copy it to commented-script.sh, which we edit so
    that the comments reflect what the script does. Everything the shell encounters
    a hash mark on a line is ignored and only visible upon opening the shell file:


    ```bash

    #!/bin/bash

    # This script clears the terminal, displays a greeting and gives

    # information about currently connected users. The two example

    # variables are set and displayed.


    # clear terminal window

    echo "The script starts now."

    echo "Hi, $USER!" # dollar sign is used to get content of variable

    echo

    echo "I will fetch you a list of connected users:"

    echo

    w # show who is logged on and

    echo # what they are doing

    echo "I''m setting two variables now." # set a local shell variable

    COLOUR="black" # set a local shell variable

    VALUE=99

    echo "This is a string: $COLOUR" # display content of variable

    echo "And this is a number: $VALUE" # display content of variable

    echo

    echo "I''m giving you back your prompt now."

    echo

    ```


    In a decent script, the first lines are usually comment about what to expect.
    Then each chunk of commands will be commented as needed for clarity''s sake. Linux
    scripts, as an example, in your system''s .d directory, are usually well commented
    since they have to be readable and editable by everyone running Linux.


    ## 2.3 Debugging Bash scripts


    When things don''t go according to plan, you need to determine what exactly causes
    the script to fail. Bash provides extensive debugging features. The most common
    is to start the subshell with the -x option, which will run the entire script
    in debug mode. Traces of each command plus its arguments are printed to standard
    output after the commands have been expanded but before they are executed.


    This is the commented-script.sh script run in debug mode. Note again that the
    added comments are not visible in the output of the script.


    ```bash

    willy:~/scripts bash -x script1.sh

    + clear

    + echo ''The script starts now.''

    The script starts now.

    + echo ''Hi, $USER!''

    Hi, willy!

    + echo

    + echo ''I will fetch you a list of connected users:''

    I will fetch you a list of connected users:

    + echo

    + w

    + echo ''I''m setting two variables now.''

    I''m setting two variables now.

    + COLOUR=''black''

    + VALUE=99

    + echo ''This is a string: $COLOUR''

    This is a string: black

    + echo ''And this is a number: $VALUE''

    And this is a number: 99

    + echo

    + echo ''I''m giving you back your prompt now.''

    I''m giving you back your prompt now.

    + echo

    ```


