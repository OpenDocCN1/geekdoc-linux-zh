    ## Chapter 5: The GNU sed editor


    ### 5.1 Introduction


    Stream editor is used to perform basic transformations on text read from a file
    or a pipe. The result is sent to output. The syntax for sed has no output specification,
    but results can be saved to file.


    What distinguishes sed from other editors, such as vi and ed, is its ability to
    filter text that gets from input. This is why sed is sometimes called a batch
    editor.


    ### 5.1.1 sed commands


    The editing commands are similar to the ones used in vi: see table below.


    Table 5.1: Sed editing commands


    | Command | Result |

    |---|---|

    | a\ | Append text below current line. |

    | c\ | Change text in the current line. |

    | d | Delete text. |

    | i\ | Insert text above current line. |

    | p | Print text. |

    | r | Read a file. |

    | s | Search and replace text. |

    | w | Write to a file. |


    Apart from editing commands, you can give options to sed. An overview is in the
    table:


    Table 5.2: Sed options


    | Option | Effect |

    |---|---|

    | -e SCRIPT | Add the commands in SCRIPT to the set of commands to be run while
    processing the input. |

    | -f | Add the commands contained in the file SCRIPT-FILE to the set of commands
    to be run while processing the input. |

    | -n | Silent mode. |


