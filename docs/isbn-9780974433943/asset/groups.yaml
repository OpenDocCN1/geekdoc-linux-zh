    ## Q


    - quota 显示磁盘使用情况和限制。


    ## R


    - rpc 远程拷贝（不安全！）。

    - rdesktop 远程桌面协议客户端。

    - reboot 停止并重启系统。

    - renice 更改运行进程的优先级。


