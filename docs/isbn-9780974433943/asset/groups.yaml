    This is the most common way to execute a script. It is preferred to execute the
    script like this in a subshell. The variables, functions and aliases created in
    this subshell are only known to the particular bash session of that subshell.
    When that shell exits and the parent retains control, everything is cleaned up
    and all to the state of the shell made by the script, are forgotten.


    If you did not put the scripts directory in your PATH, and . (the current directory)
    is not in the PATH either, you can activate the script like this:


    ```bash

    ./script_name.sh

    ```


    A script can explicitly be executed by a given shell, but generally we do this
    if we want to obtain special behavior, such as checking if the script works with
    another shell or printing traces for debugging:


    ```bash

    bash script_name.sh

    sh script_name.sh

    bash -x script_name.sh

    ```


    The specified shell will start as a subshell of your current shell and execute
    the script. This is done when you want the script to start up with specific options
    or


    ## 2.2 Script basics


    under specific conditions which are not specified in the script.

    If you don''t want to start a new shell but execute the script in the current
    shell,

    you source it:


    ```bash

    source script.name.sh

    ```


    The Bash source built-in is a synonym for the Bourne shell. (dot) command.


    The script does not execute permission in this case. Commands are executed

    in the current shell context, so any changes made to your environment will be

    visible when the script finishes execution:


    ```bash

    willy:</scripts> source script1.sh

    --output committed-


    willy:</scripts> echo $VALUE

