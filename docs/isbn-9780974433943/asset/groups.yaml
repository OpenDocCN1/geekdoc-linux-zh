    # 第 9 章：重复任务\n\n## 9.1 for 循环\n\n`for` 循环是三种 shell 循环结构中的第一个。该循环允许指定值列表。对于列表中的每个值，都会执行一次命令列表。\n\
    \n该循环的语法为：\n\n```\nfor NAME [in LIST ]; do COMMANDS; done\n```\n\n如果 `[in LIST]`\
    \ 不存在，它将被替换为 `$@`，并为每个已设置的位置参数执行一次 `COMMANDS`（详见第 3.2.4 节和第 7.2 节）。\n\n返回状态是最后一个执行的命令的退出状态。如果由于\
    \ `LIST` 没有展开为任何项目导致没有执行命令，则返回状态为零。\n\n`NAME` 可以是任何变量名，尽管经常使用 `i`。`LIST` 可以是任何单词、字符串或数字的列表，可以是字面量，也可以由任何命令生成。`COMMANDS`\
    \ 可以执行任何系统命令、脚本、程序或 shell 语句。在循环第一次运行时时，`NAME` 被设置为 `LIST` 中的第一个项。第二次时，它的值被设置为列表中的第二个项，依此类推。当\
    \ `NAME` 已经取了 `LIST` 中的每个值且没有剩余项时，循环终止。\n\n### 9.1.1 示例\n\n#### 使用命令替换指定 LIST\
    \ 项\n\n第一个是命令行示例，演示了如何使用 `for` 循环为每个 `.xml` 文件创建备份副本。在发布命令后，就可以安全地开始处理源文件：\n\n\
    ```\n[ol@octarine ~/articles] ls *.xml\nfile1.xml file2.xml file3.xml\n[ol@octarine\
    \ ~/articles] ls *.xml > list\n[ol@octarine ~/articles] for i in `cat list`; do\
    \ cp $i \"$i.bak\"; done\n[ol@octarine ~/articles] ls **\nfile1.xml file1.bak\
    \ file2.xml file2.bak file3.xml file3.bak\n```\n\n这一个列出了 `/sbin` 中仅为文本的文件、且可能是脚本的文件：\n\
    \n```\nfor i in `ls /sbin/`; do file /sbin/$i | grep; done\n```\n\n## 9.2 while\
    \ 循环\n\n以下是一个将符合特定方案的 HTML 文件转换为 PHP 文件的特定应用脚本。通过提取第一行和最后一行，并将它们替换为提供头部和页脚的 PHP\
    \ 标签来实现：\n\n```bash\n#!/bin/bash\n# html 文件到 php 的特定转换脚本\nLIST=$(ls *.html)\n\
    for i in $LIST; do\n  NEWNAME=$(echo $i | sed 's/.html/.php/')\n  echo \"<html>\"\
    \n  cat \"$i\" | sed -e '1,2d' | tac | sed -e '1,2d' >> \"$NEWNAME\"\ndone\n```\n\
    \n由于我们在这里没有使用计数器，在到达末尾之前无法知道从哪一行开始删除。这个问题通过使用 `tac` 解决，它会反转文件中的行顺序。\n\n`while`\
    \ 结构允许重复执行命令列表，只要控制循环的命令执行成功（退出状态为零）。其语法为：\n\n```\nwhile CONTROL-COMMAND; do CONSEQUENT-COMMANDS;\
    \ done\n```\n\n`CONTROL-COMMAND` 可以是任何可以以成功或失败状态退出的命令。`CONSEQUENT-COMMANDS` 可以是任何程序、脚本或\
    \ shell 结构。一旦 `CONTROL-COMMAND` 失败，循环就会退出。返回状态是最后一个执行的 `CONSEQUENT-COMMAND` 命令的退出状态，如果没有执行任何命令，则为零。\n\
    \n### 9.2.1 示例\n\n使用 while 的简单示例\n\n```bash\n#!/bin/bash\n# 此脚本打开 4 个终端窗口。\ni=0\n\
    while [ $i -lt 4 ]\ndo\n  xterm &\n  i=$[$i+1]\ndone\n```\n\n#### 嵌套的 while 循环\n\
    \n![](img/2e4e71363595151bf5345bf90e36_157.png)\n\n> 图 9.1：嵌套 while 循环 - 图片\n\n\
    图 9.1 中的示例用于将网络摄像头拍摄的图片复制到网络目录中。每五分钟拍摄一张照片。每小时创建一个新目录，存放该小时的图像。每天创建一个包含 24 个子目录的新目录。该脚本在后台运行。\n\
    \n注意 `true` 语句的使用。这意味着：继续执行直到我们被强制中断（使用 `kill` 或 Ctrl+C）。这个小脚本可以用于模拟测试；它生成文件：\n\
    \n```bash\n#!/bin/bash\n# 每 5 分钟生成一个文件\nwhile true; do\n  touch pic-`date +%s`.jpg\n\
    \  sleep 300\ndone\n```\n\n注意使用 `date` 命令来生成各种文件和目录名称。\n\n使用键盘输入控制 while 循环\n\n\
    当用户输入 Ctrl+C 序列时，用户可以中断此脚本：\n\n```bash\n#!/bin/bash\n# 此脚本提供智慧\nFORTUNE=/usr/games/fortune\n\
    while true; do\n  echo \"你想听哪个话题的建议?\"\n  cat <<-topics\n  politics\n  startrek\n\
    \  kernelnewbies\n  sports\n  bofh-excuses\n  magic\n  love\n  literature\n  drugs\n\
    \  education\ntopics\n  echo -n \"做出你的选择: \"\n  read topic\n  echo\n  echo -n\
    \ \"关于话题 $topic 的免费建议: \"\n  echo\n  $FORTUNE $topic\n  echo\ndone\n```\n\n####\
    \ 计算平均值\n\n此脚本计算用户输入的平均值，在处理之前会对其进行测试：如果输入不在范围内，则打印一条消息。如果按下 `q`，循环将退出。注意最后几行中的变量是如何不加引号，以便进行算术运算。\n\
    \n## 9.3 until 循环\n\n`until` 循环与 `while` 循环非常相似，不同之处在于循环直到 `TEST-COMMAND` 执行成功才会停止。只要该命令失败，循环就会继续。\n\
    \n```\nuntil TEST-COMMAND; do CONSEQUENT-COMMANDS; done\n```\n\n返回状态是 `CONSEQUENT-COMMANDS`\
    \ 列表中最后一个执行的命令的退出状态，如果没有执行任何命令，则为零。`TEST-COMMAND` 同样可以是任何可以以成功或失败状态退出的命令，`CONSEQUENT-COMMANDS`\
    \ 可以是任何 UNIX 命令、脚本或 shell 命令。\n\n正如我们之前解释过的，`;` 可以在任何出现的地方替换为一个或多个换行符。\n\n###\
    \ 9.3.1 示例\n\n```bash\n#!/bin/bash\n# 此脚本将文件从家目录复制到网络服务器目录。\n# 每小时创建一个新目录。\n#\
    \ 如果图片占用空间过多，则删除旧的图片。\nPICSDIR=/home/newuser/cache/\n\nwhile true; do\n  DISKFULL=$(df\
    \ -h $WEBSDIR | grep -v File | awk '{ print $5 }' | cut -d \"%\" -f1)\n  until\
    \ [ $DISKFULL -ge \"90\" ]; do\n    DATE=$(date +%Y%m%d)\n    date $DATE\n   \
    \ mkdir $WEBSDIR/$DATE\n    while [ $HOUR -le 23 ]; do\n      DESTIR=\"$WEBSDIR/$DATE/$$HOUR\"\
    \n      mkdir \"$DESTIR\"\n      mv $PICSDIR/*.jpg \"$DESTIR\"\n      sleep 3600\n\
    \      HOUR=$(date +%H)\n    done\n    DISKFULL=$(df -h $WEBSDIR | grep -v File\
    \ | awk '{ print $5 }' | cut -d \"%\" -f1)\n  done\n\n  REMOVE=$(find $WEBSDIR\
    \ -type d -a -atime +30)\n  for i in $REMOVE; do rm -rf \"$i\"; done\n\ndone\n\
    ```\n\n> 图 9.2：更多嵌套的 while 循环 - safest.sh\n\n"
