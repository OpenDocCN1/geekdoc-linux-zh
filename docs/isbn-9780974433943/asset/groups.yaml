    \ by subsequent assignment. If the -f option is given, each variable refers to\
    \ a shell function; Chapter 11, \"Functions\". If -a is specified, each variable\
    \ refers to an array of\n"
  mdcn: "\n\n## 9.7 shift 内置命令\n\n**shift** 命令是 Bash 自带的 Bourne shell 内置命令之一。该命令接受一个参数，即一个数字。位置参数将根据该数字\
    \ N 向左移动。从 N+1 到 ## 的位置参数将被重命名为从 $1 到 ##-N+1 的变量名。\n\n假设你有一个接受 10 个参数的命令，如果 N\
