    \ ***, \\\nhow do you think we survive?\"\n    ;;\n*)\n    echo \"Guard: Don't\
    \ forget the guide!\"\n    ;;\nesac\n\nany \"/testdir\" ./feed.sh apple penguin\n\
    Tux don't like that. Tux wants fish!\nguard: You'd better give'm a fish, less\
    \ they get violent.\n```\n\n如你所示，退出状态码可以自由选择。现有的命令通常有一系列定义的代码；更多信息请参阅每个命令的程序员手册。\n\
    \n## 7.7 使用 case 语句\n\n嵌套的 `if` 语句可能很好用，但一旦你面临几种可能的采取操作时，它们往往会让人困惑。对于更复杂的条件，请使用\
    \ `case` 语法：\n\n```bash\ncase EXPRESSION in CASE1) COMMAND-LIST;; CASE2) COMMAND-LIST;;\
    \ ... CASEEN) COMMAND-LIST;; esac\n```\n\n每个 `case` 都是一个匹配模式的表达式。第一个匹配项的 `COMMAND-LIST`\
    \ 中的命令将被执行。`|` 符号用于分隔多个模式，`)` 运算符结束一个列表。每个 `case` 及其对应的命令称为一个句（clause）。每个句必须以\
    \ `;` 结束；`case` 语句以 `esac` 结束。\n\n在示例中，我们展示了如何使用 `disktest.sh` 通过 `case` 发送更具选择性的警告消息：\n\
    \n```bash\nany \"/testdir\" cat disktest.sh\n#!//bin/bash\n\n# 这个脚本对磁盘空间进行了一个非常简单的测试。\n\
