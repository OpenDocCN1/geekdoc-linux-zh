    # 引言


    ## 为什么要写这本书？


    写这本书的主要原因是许多读者觉得现有的 [HOWTO](http://tldp.org/HOWTO/Bash-Prog-Intro-HOWTO.html)
    太短且不完整，而 [Bash 脚本指南](http://tldp.org/LDP/abs/html/index.html) 又太像是一本参考书。在这两个极端之间没有中间内容。我写这本书的总体原则是：目前缺乏足够的廉价基础课程，尽管它们本该如此。


    这是一本实用的书籍，虽然并不总是非常严肃，但试图提供真实生活的案例而非理论示例。我部分编写它是因为我不对那些由专业人士编写的、精简且过度简化的示例感兴趣，那些示例展示了一些非常酷炫的
    Bash 特性，但由于脱离了上下文，导致你无法在实际情况下使用。在读完这本书后，你可以阅读后续的练习和示例，它们将帮助你在现实世界中生存。


    根据我作为 UNIX/Linux 用户、系统管理员和培训师的经验，我知道人们可能每天与系统交互多年，却对任务自动化一无所知。因此，他们经常认为 UNIX 不易用，更糟糕的是，他们留下了
    UNIX 缓慢且过时的印象。这个问题可以通过本指南得到补救。


    ## 谁应该读这本书？


    每一个在 UNIX 或类 UNIX 系统上工作并希望让自己的生活变得更轻松的人，无论是高级用户还是系统管理员，都能从阅读本书中受益。已经掌握了如何使用命令行操作系统的读者将学习
    shell 脚本的细节，从而简化日常任务的执行。系统管理很大程度上依赖 shell 脚本；常见任务通常使用简单的脚本进行自动化。本文包含了大量示例，这些示例鼓励你编写自己的脚本，并启发你改进现有脚本。


    ### 先决条件/本课程不包含的内容：


    - 你应该是一个经验丰富的 UNIX 或 Linux 用户，熟悉基础命令、帮助页（man pages）和文档

    - 能够使用文本编辑器

    - 理解系统启动和关机过程、init 和 initscripts

    - 创建用户和组，设置密码

    - 权限、特殊模式

    - 理解设备、分区、文件系统挂载/卸载的命名规范

    - 在你的系统中添加/删除软件


    如果你尚未精通上述某一个主题，请参阅 [Linux 简介](http://tldp.org/LDP/intro-linux/html/index.html)（或你的本地
    TLDP 镜像站 [http://www.tldp.org/mirrors.html)）。更多信息可以在你的系统文档（man 和 info 页）或 [Linux
    文档项目](http://tldp.org) 中找到。


    # 贡献


    感谢所有帮助（或尝试帮助）的朋友们：

    - Dan Bol

    - Dan Ferguson

    - Gerg

    - Hans Marshall

    - Leo Richter

    - Tabatha Marshall


    ## 反馈


    缺失信息或反馈？请发送邮件给作者：production@fultus.com


    ## 你需要什么？


    Bash，可以从 [http://www.gnu.org/software/bash/) 获取。shell 几乎在每个系统中都可用。


    ## 本文档中使用的约定


    表 1 描述了排版和用法约定。


    | 文本类型 | 含义 |

    | --- | --- |

    | "引用文本" | 终端视图，带引号的计算机输出。 |

    | command VARIABLE | 变量名，例如 $VARNAME。 |

    | option argument | 命令选项参数，例如 "-a command"。 |

    | filename | 文件或目录名称，例如 "切换到 /usr/bin"。 |

    | Key Button → Choice | 键盘上需要按的按键，如“输入 Q 退出”。需要点击的图形按钮，如 OK 按钮。 |

    | Terminology | 重要术语或概念：“Linux 内核是系统的核心。” |


    终端视图中或命令概览中的反斜杠 `\` 表示未未完的行。换句话说，如果你看到一个被分成多行的长命令，`\` 表示“先不要按回车！”


    请参阅第 1 章，“Bash 与 Bash 脚本”，链接到指南内的相关主题。


    http://tldp.org> 指向外部网络资源的可点击链接。


    使用了以下图像：


    > 这是一个备注。它包含额外信息或说明。


    > 这是一个警告。意味着要小心。


    > 这是一个提示。


    # 文档结构


    本指南讨论了对严肃 Bash 用户日常生活中有用的概念。虽然需要 shell 使用的基础知识，但我们在前三章中开始讨论基础 shell 组件和实践。


    第四章到第六章讨论了 shell 脚本中常用的基础工具。


    第八章到第十二章讨论了 shell 脚本中最常见的结构。所有章节都带有练习，将测试你为下一章做好准备。


    - 第 1 章，“Bash 与 Bash 脚本”Bash 基础：为什么 Bash 如此优秀、基础、开发脚本的第一指南。

    - 第 2 章，“编写和调试脚本”脚本基础：编写与调试。

    - 第 3 章，“Bash 环境”Bash 环境：初始化文件、变量、引号字符、shell 展开顺序、别名、选项。


