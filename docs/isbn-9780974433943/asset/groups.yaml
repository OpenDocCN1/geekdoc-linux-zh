- md: "\n# Chapter 11: Functions\n\nfunction features are used:\n\n```bash\n$ RETVAL\
    \ = 0 && touch /var/lock/subsys/amd\n```\n\nThe commands after && are only executed\
    \ when the test proves to be true; this is a shorter way to represent an if/then/fi\
    \ structure.\n\nThe return code of the function is often used as exit code of\
    \ the entire script. You'll see a lot of initscripts ending in something like\
    \ exit $RETVAL.\n\n## 11.1.3 Displaying functions\n\nAll functions known by the\
    \ current shell can be displayed using the set built-in without options. Functions\
    \ are retained after they are used, unless they are unset after use. The which\
    \ command also displays functions:\n\n```bash\nlydia@contreau ] which zless\n\
    zless is a function\nzless ()\n  zcat \"$@\" | \"SPAGER\"\nlydia@contreau ] echo\
    \ $SPAGER\nless\n```\n\nThis is the sort of function that is typically configured\
    \ in the user's shell resource configuration files. Functions are more flexible\
    \ than aliases and provide a simple and easy way of adapting the user environment.\n\
    \nHere's one for DOS users:\n\n```bash\ndir ()\n  ls -F --color=auto -lF --color=always\
    \ \"$@\" | less -r\n```\n\n## 11.2. Examples of functions in scripts\n\n### 11.2.1\
    \ Recycling\n\nThere are plenty of scripts on your system that use functions as\
    \ a structured way of handling series of commands. On some Linux systems, for\
    \ instance, you will find the /etc/rc.d/init.d/functions definition file, which\
    \ is sourced in all init scripts. Using this method, common tasks as checking\
    \ if a process runs, starting or stopping a daemon, only have to be written once,\
    \ in a general way. If the same task is needed again, the code is recycled. From\
    \ these functions file the checkpid function:\n\n```bash\n# Check if spid (could\
    \ be plural) are running\ncheckpid() {\n  local i\n\n  for i in $*; do\n    [\
    \ -d \"proc/$i\" ] && return 0\n  done\n  return 1\n}\n```\n\nThis function is\
    \ reused in the same script in other functions, which are reused in other scripts.\
    \ The daemon function, for instance, is used in the majority of the startup scripts\
    \ for starting a server process (on machines that use this system).\n\n### 11.2.2\
    \ Setting the path\n\nThis might be found in your /etc/profile file. The function\
    \ path-munge is defined and then used to set the path for the root and other users:\n\
    \n```bash\npathmunge() {\n  if echo $PATH | /bin/egrep -q \"^([^|])1($|)\"; then\n\
    \    if [ \"$2\" = \"after\" ]; then\n      PATH=$PATH:$1\n    else\n      PATH=$1:$PATH\n\
    \    fi\n  fi\n}\n\n# Path manipulation\nif [ 'id -u' = 0 ]; then\n  pathmunge\
    \ /sbin\n  pathmunge /usr/sbin\n```\n\n```bash\npathberge /usr/local/sbin\nfi\n\
    pathberge /usr/X11R6/bin after\nunset pathberge\n```\n\nThe function takes its\
    \ first argument to be a path name. If this path name is not yet in the current\
    \ path, it is added. The second argument to the function defines if the path will\
    \ be added in front or after the current PATH definition.\n\nNormal users only\
    \ get /usr/X11R6/bin added to their paths, while root gets a couple of extra directories\
    \ containing system commands. After being used, the function is unset so that\
    \ it is not retained.\n\n## 11.2.3 Remote backups\n\nThe following example is\
    \ that I use for making backups of the files for my books. It uses SSH keys for\
    \ enabling the remote connection. Two functions are defined, bplunix and bupbash,\
    \ that each make a .tar file, which is then compressed and sent to a remote server.\
    \ After that, the local copy is cleaned up.\n\nOn Sunday, only bupbash is executed.\n\
    \n```bash\n#!/bin/bash\nLOGFILE=\"/nhome/tille/log/backscript.log\"\necho \"Starting\
    \ backups for 'date' >> \"$LOGFILE\"\nplunix() {\n  DIR=\"/nhome/tille/xml/db/linux-basics/*\"\
    \n  TAR=\"Linux.tar\"\n  BZIP=\"$TAR.bz2\"\n  SERVER=\"incewind\"\n  DIR=\"/var/www/intra/tille/training/\"\
    \n  cd \"$DIR\"\n  tar -cf \"$STAR\" src/*.xml src/images/*.png src/images/*.eps\n\
    \  echo \"Compressing Tar\" >> \"$LOGFILE\"\n  bz2 \"$STAR\"\n  echo \"...done.\"\
    \ >> \"$LOGFILE\"\n  scp \"$BZIP\" \"$SERVER:\\$RDIR\" /dev/null 2>&1\n  echo\
    \ \"...done.\" >> \"$LOGFILE\"\n  echo -e \"Done backing up Linux course:\\nSource.files,\
    \ PNG and EPS images. \\nRubbish removed.\" >> \"$LOGFILE\"\n  rm \"$BZIP\"\n\
    }\n```\n\n```bash\nbupbash() {\n  DIR=\"/nethome/tille/xml/db/\"\n  TAR=\"Bash.tar\"\
    \n  BZIP=\"$STAR.tar.bz2\"\n  FILES=\"bash-programming/\"\n  SERVER=\"recwind\"\
    \n  EDIR=\"/var/www/intra/tille/training/\"\n\n  cd \"$DIR\"\n  tar -cf \"$STAR\"\
    \ \"$FILES\"\n  echo \"Compressing Tar\" >> \"$LOGFILE\"\n  bz2 \"$STAR\"\n  echo\
    \ \"...done.\" >> \"$LOGFILE\"\n  scp \"$BZIP\" \"$SERVER:\\$RDIR\" /dev/null\
    \ 2>&1\n  echo \"...done.\" >> \"$LOGFILE\"\n  echo -e \"Done backing up Linux\
    \ course:\\nSource.files, PNG and EPS images. \\nRubbish removed.\" >> \"$LOGFILE\"\
    \n  rm \"$BZIP\"\n}\n```\n\n# Chapter 12: Catching signals\n\nIn this chapter,\
    \ we will discuss the following subjects:\n\n- Available signals\n- Use of the\
    \ signals\n- Use of the trap statement\n- How to prevent users from interrupting\
    \ your programs\n\n## 12.1 Signals\n\n### Finding the signal man page\n\nYour\
    \ system contains a man page listing all available signals, depending on your\
    \ operating system, it might be opened in a different way. On most Linux systems,\
    \ this will be man 7 signal. When doubt, locate the exact man page and section\
    \ using commands like\n\n```bash\nman -k signal | grep list\n```\n\nor\n\n```bash\n\
    apropos signal | grep list\n```\n\n### Signals to your Bash shell\n\nIn the absence\
    \ of any traps, an interactive Bash shell ignores SIGTERM and SIGQUIT. SIGINT\
    \ is caught and handled, and if job control is active, SIGTIN, SIGTTO and SIGTSTP\
    \ are also ignored. Commands that can run the result of a command substitution\
    \ also ignore these signals, when keyboard generated.\n\nSIGHUP by default exits\
    \ a shell. An interactive shell will send a SIGHUP to all jobs, running or stopped;\
    \ see the documentation on the disown built-in if you want to disable this default\
    \ behavior for a particular process. Use the hunup option for killing all jobs\
    \ upon receiving a SIGHUP signal, using the shop built-in.\n\n## Sending signals\
    \ using the shell\n\nLists the signals that can be sent using the Bash shell.\n\
    \n### Terminal settings\n\nCheck your stty settings. Suspend and resume of output\
    \ is usually disabled if you are using “modern” terminal emulations. The standard\
    \ xterm supports Ctrl+S and Ctrl+Q by default.\n\n### 12.1.1 Usage of signals\
    \ with kill\n\nMost modern shells, Bash, have a built-in kill function. In Bash,\
    \ signal names and numbers are accepted as options, and arguments may be job\n"
