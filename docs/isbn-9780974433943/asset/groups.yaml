    sandy > sed -n ''/This.*errors.*$/p'' example

    This is a line not containing any errors.


    sandy >

    ```


    ## 5.2.3 Ranges of lines


    This time we want to take out the lines containing the errors. In these examples
    are lines 2 to 4. Specify this range to address, together with the d command:


    ```

    sandy > sed ''2,4d'' example

    This is the first line of an example text.

    This is a line not containing any errors.

    This is the last line.


