    这段文本会在每个打印任务开始时打印，并感谢管理员设置了如此出色的打印基础设施。\n\n待过滤的文本。\n\n这段文本会在每个打印任务结束时打印。\n\n###\
    \ 文件描述符 5\n\n使用此文件描述符可能会导致问题；请参阅《高级 Bash 脚本指南 <http://www.tldp.org/LDP/abs/html/io-redirection.html>\
    \ 第 16 章》。强烈建议不要使用它。\n\n在脚本中读取 (Read in scripts) 以下示例展示了你如何在文件输入和命令行输入之间交替使用：\n\
    \n```\nmichel \"/testdir\" cat sysnotes.sh\n#!/bin/bash\n\n# 此脚本为重要的配置文件建立一个索引，将它们合并到一个备份文件中，\n\
    # 并允许为每个文件添加注释。\n\nCONFIG=/var/tmp/sysconfig.out\nrm \"$CONFIG\" 2>/dev/null\n\
    echo \"Output will be saved in $CONFIG.\"\n\nexec 7<&0\n\nexec < /etc/passwd\n\
    \n# 读取 /etc/passwd 第一行\nread rootpasswd\n\necho \"Saving root account info...\"\
