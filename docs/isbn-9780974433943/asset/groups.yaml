- md: "\n# 7.1 Introduction to if\n\n```bash\nif [ \"$(whoami) = 'root' ]; then\n\
    \  echo \"You have no permission to run $0 as non-root user.\"\nfi\n```\n\nWith\
    \ Bash, you can shorten this type of construct. The compact equivalent of above\
    \ test is as follows:\n\n```bash\n[ \"$(whoami) = 'root' ] && echo you are using\
    \ a non-privileged account\n```\n\nRegular expressions may also be used:\n\n```bash\n\
    anny > gender=\"female\"\nanny > if [[ $gender == \"f*\" ]]\nMore input > then\
    \ echo \"Pleasure to meet you, Madame.\"; fi\nPleasure to meet you, Madame.\n\
    anny >\n```\n\nThe info pages for Bash for more information on pattern matching\
    \ with the \"(EXPRESSION ))\" and \"[[ EXPRESSION ]\" constructs.\n\n# 7.2 if/then/else\
    \ constructs\n\n### Dummy example\n\nThis is the construct to use one course of\
    \ action if the if commands test true, and another if it tests false. An example:\n\
    \n```bash\nfreddy scripts gender=\"male\"\n\nfreddy scripts> [ [ \"$gender\" ==\
    \ \"f\" ]\nMore input> echo \"Pleasure to meet you, Madame.\"\nMore input> else\
    \ echo \"How the lady hasn't got a drink yet?\"\nMore input> fi\nHow the lady\
    \ hasn't got a drink yet?\n\nfreddy scripts>\n```\n\nLike the CONSEQUENT-COMMANDS\
    \ list following the then statement, the ALTERNATE-CONSEQUENT-COMMANDS list following\
    \ the else statement can hold any UNIX-style command that returns an exit status.\n\
    \nAnother example, extending the one from Section 7.1.1:\n\n```bash\nanny > su\
    \ -\nPassword:\n[root@elegance]# # if grep $USER /etc/passwd 1>/dev/null\n> then\
    \ echo \"your user account is not managed locally\"\n> else echo \"your account\
    \ is managed from the local /etc/passwd file\"\n> fi\nyour account is managed\
    \ from the local /etc/passwd\n[root@elegance]#\n```\n\nWe switch to the root account\
    \ to demonstrate the effect of the else statement - your root is usually a local\
    \ account while your user account might be managed by a central system, such as\
    \ an LDAP server.\n\n# Check command line arguments\n\nInstead of setting a variable\
    \ and then executing a script, it is frequently more elegant to put the values\
    \ for the variables on the command line.\n\nWe use the positional parameters $1,\
    \ $2, ..., $N for this purpose. $$ refers to the number of command line arguments.\
    \ $0 refers to the name of the script.\n\nThe following is a simple example:\n\
    \n```bash\nanny@octarine:~/testdir\nFile Edit View Terminal Go Help\nanny is in\
    \ ~/testdir cat penguin.sh\n#!/bin/bash\n\n# This script lets you present different\
    \ menus to Tux. He will only be happy\n# when given a fish.\n\nif [ \"$1\" ==\
    \ fish ]; then\n    echo \"Hermann fish... Tux happy!\"\nelse\n    echo \"Tux\
    \ don't like that. Tux wants fish!\"\nfi\nanny is in ~/testdir penguin.sh apple\n\
    Tux don't like that. \nanny is in ~/testdir penguin.sh fish\nHermann fish... Tux\
    \ happy!\nanny is in ~/testdir _\n```\n\nFigure 7.1: Testing of a command line\
    \ argument with if\n\nHere's another example, using two arguments:\n\n```bash\n\
    anny -> cat weight.sh\n#!/bin/bash\n\n# This script prints a message about your\
    \ weight if you give it your\n# weight in kilos and height in centimeters.\nweight=$1\n\
    height=$2\nif [ $weight -le $height - 110 ]; then\n    echo \"You should eat a\
    \ bit more fat.\"\nelse\n    echo \"You should eat a bit more fruit.\"\nfi\nnanny\
    \ -> bash -x weight.sh 55 169\n+ height=169\n+ idealweight=59\n+ '[' 55 -le 59\
    \ ''\n+ echo 'You should eat a bit more fat.'\nanny is at a bit more fat.\n```\n\
    \n# Chapter 7: Conditional statements\n\n# Testing the number of arguments\n\n\
    The following example shows how to change the previous script so that it prints\
    \ a message if more or less than 2 arguments are given:\n\n```bash\nanny > cat\
    \ weight.sh\n#!/bin/bash\n\n# This script prints a message about your weight if\
    \ you give it your\n# weight in kilos and height in centimeters.\n\nif [ $# ==\
    \ 2 ]; then\n  echo \"Usage: $0 weight_in_kilos length_in_centimeters\"\n  exit\n\
    fi\n\nweight=$1\nheight=$2\nidealweight=$[$height] - 110\n\nif [ $weight -le $idealweight\
    \ ]; then\n  echo \"You should eat a bit more fat.\"\nelse\n  echo \"You should\
    \ eat a bit more fruit.\"\nfi\n\nanny > weight sh 70 150\nYou should eat a bit\
    \ more fruit.\n\nanny > weight sh 70 150 33\nUsage: ./weight.sh weight_in_kilos\
    \ length_in_centimeters\n```\n\nThe first argument is referred to as $1, the second\
    \ as $2 and so on. The total number of arguments is stored in $$. \n\nCheck out\
    \ Section 7.6 for a more elegant way to print usage messages.\n\n# Testing that\
    \ a file exists\n\nThis test is done in a lot of scripts, because there's no use\
    \ in starting a lot of programs if you know they're not going to work:\n\n```bash\n\
    #!/bin/bash\n\n# This script gives information about a file.\n\nFILENAME=\"$1\"\
    \n\necho \"Properties for $FILENAME:\"\n\n```bash\nif [ -f $FILENAME ]; then\n\
    echo \"Size is $(ls -lh $FILENAME | awk '{ print $5 }')\"\necho \"Type is $(ls\
    \ -d $FILENAME | cut -d \":\" -f2 -)\"\necho \"Inode number is $(ls -i $FILENAME\
    \ | cut -d \":\" -f1 -)\"\necho \"$(df -h -v Mounted | awk '{ print \"On\",\\\
    $1 }')\"which is mounted as the,$6,\"partition.\")\"\nelse\necho \"File does not\
    \ exist.\"\nfi\n```\n\nNote that the file is referred to using a variable; in\
    \ this case it is the first argument to the script. Alternatively, when no arguments\
    \ are given, file locations are usually stored in variables at the beginning of\
    \ a script, and their content is referred using these variables. Thus, when you\
    \ want to change a file name in a script, you only need to do it.\n\n# if/then/elif/else\
    \ constructs\n\nThis is the full form of if:\n\n```bash\nif condition; then\n\
    \  commands\nelif condition; then\n  commands\nelse\n  commands\nfi\n```\n\nThe\
    \ CONSEQUENT-COMMANDS list following the then statement, the ALTERNATE-CONSEQUENT-COMMANDS\
    \ list following the else statement can hold any UNIX-style command that returns\
    \ an exit status.\n\nWe switch to the root account to demonstrate the effect of\
    \ the else statement - your root is usually a local account while your user account\
    \ might be managed by a central system, such as an LDAP server.\n\n# 7.3.1 Example\n\
    \nHere is an example you can put in crontab:\n\n```bash\nanny /etc/cron.daily>\
    \ cat disktest.sh\n#!/bin/bash\n\n# This script does a very simple test for checking\
    \ disk space.\n\nspace=$(df -h | awk '{print $5}' | grep -v | sort -n | tail -1)\n\
    alertvalue=\"80\"\n\nif [ \"$space\" -ge \"$alertvalue\" ]; then\n    echo \"\
    At least one of my disks is nearly full!\" | mail -s \"daily diskcheck\" root\n\
    else\n    echo \"Disk space normal\" | mail -s \"daily diskcheck\" root\nfi\n\
    ```\n\n# 7.4 Nested if statements\n\nInside the if statement, you can use another\
    \ if statement. You may use as many levels of nested if as you can logically manage.\n\
    \nThis is an example testing leap years:\n\n```bash\n#!/bin/bash\n# This script\
    \ will test if we're in a leap year or not.\n\nyear=$(date +%Y)\n\nif [ [$year\
    \ % 400] -eq 0 ]; then\n    echo \"This is a leap year. February has 29 days.\"\
    \nelif [$year % 4] -eq 0 ]; then\n    if [$year % 100] -ne 0 ]; then\n       \
    \ echo \"This is a leap year, February has 29 days.\"\n    else\n        echo\
    \ \"This is not a leap year. February has 28 days.\"\n    fi\nelse\n    echo \"\
    This is not a leap year. February has 28 days.\"\nfi\n\nanny \"/testdir> date\n\
    Tue Jan 14 20:37:55 CET 2023\n\nanny \"/testdir> testleap.sh\nThis is not a leap\
    \ year.\n```\n\n# 7.5 Boolean operations\n\nThe above script can be shortened\
    \ using the Boolean operators “AND” (&&) and “OR” (||).\n\nFigure 7.2: Example\
    \ using Boolean operators\n\nWe use the double brackets for testing an arithmetic\
    \ expression; see Section 3.4.5. This is equivalent to the let statement. You\
    \ will get stuck using angular brackets here, if you try something like... because\
    \ here, the angular brackets don't represent an actual command by themselves.\n\
    \nAmong other editors, gvim is one of those supporting colour schemes according\
    \ to the file format; such editors are useful for detecting errors in your code.\n"
