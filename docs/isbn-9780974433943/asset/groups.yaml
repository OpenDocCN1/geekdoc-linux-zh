    or make changes to it in the future.


    The script should check for the existence of a compressed archive. If this exists,
    remove it first in order to prevent output generation.


    The script should also check for available diskspace. Keep in mind that at any
    given moment you could have the data in your home directory, the data in the .tar
    file and the data in the compressed archive all together on your disk. If there
    is not enough diskspace, exit with an error message in the log file.


    The script should clean up the compressed archive before exits.'
- md: "\n# Chapter 8\n\n# Writing interactive scripts\n\nIn this chapter we will discuss\
    \ how to interact with the users of our scripts:\n\n- Printing user friendly messages\
    \ and explanations\n- Catching user input\n- Prompting for user input\n- Using\
    \ the file descriptors to read from and write to multiple files\n\n## 8.1 Displaying\
    \ user messages\n\nSome scripts run without any interaction from the user at all.\
    \ Advantages of non-interactive scripts include:\n\n- The script runs in a predictable\
    \ way every time.\n- The script can run in the background.\n\nMany scripts, however,\
    \ require input from the user, or give output to the user as the script is running.\
    \ The advantages of interactive scripts are, among others:\n\n- More flexible\
    \ scripts can be built.\n- Users can customize the script as it runs or make it\
    \ behave in different ways.\n- The script can report its progress as it runs.\n\
    \nWhen writing interactive scripts, never hold back on comments. A script that\
    \ prints appropriate messages is much more user-friendly and can be more easily\
    \ debugged. A script might do a perfect job, but you will get a whole lot of support\
    \ calls if it does not inform the user about what it is doing. So include messages\
    \ that tell the user to wait for output because a calculation is being done. If\
    \ possible, try to give an indication of how long the user will have to wait.\
    \ If the waiting should regularly take a long time when executing a certain task,\
    \ you might want to consider integrating some processing indication in the output\
    \ of your script.\n\nWhen prompting the user for input, it is also better to give\
    \ too much than too little information about the kind of data to be entered. This\
    \ applies to the checking of arguments and the accompanying usage message as well.\n\
    \nBash has the echo and printf commands to provide comments for users, and although\
    \ you should be familiar with at least the echo by now, we will discuss more examples\
    \ in the next sections.\n\n### 8.1.1 Using the echo built-in command\n\nThe echo\
    \ built-in command outputs its arguments, separated by spaces and terminated with\
    \ a newline character. The return status is always zero. echo takes a couple of\
    \ options:\n\n- -e: interpretsslash-escaped characters.\n- -n: suppresses the\
    \ trailing newline.\n\nAs an example of adding comments, we will make the feed.sh\
    \ and penguin from Section 7.2 a bit better:\n\n## 8.1 Displaying user messages\n\
    \n```\nmichel /test> cat penguin.sh\n#!/bin/bash\n# This script lets you present\
    \ different menus to Tux. He will only be\n# happy when given a fish. To make\
    \ it more fun, we added a couple more\n# animals.\n```\n\n```\nif [ \"$menu\"\
    \ == \"fish\" ]; then\n\tif [ \"$animal\" == \"penguin\" ]; then\n\t\techo -e\
    \ \"Hmmmfish.. Tux happy!\\n\"\n\telif [ \"$animal\" == \"dolphin\" ]; then\n\t\
    \techo -e \"\\a\\apweetestrectpeterdeweet!\\a\\a\\n\"\n\telse\n\t\techo -e \"\
    prrrrrrt*\\n\"\n\tfi\nelse\n\tif [ \"$animal\" == \"penguin\" ]; then\n\t\techo\
    \ -e \"Tux doesn't like that. Tux wants fish!\\n\"\n\t\texit 3\n\telif [ \"$animal\"\
    \ == \"dolphin\" ]; then\n\t\techo -e \"\\a\\a\\a\\aApweepwishpeeterdeweet!\\\
    a\\a\\a\"\n\t\texit 2\n\telse\n\t\techo -e \"Will you read this sign?\" Don't\
    \ feed the \"$animal\"s!\\n\"\n\t\texit 3\n\tfi\nfi\n```\n\n```\nmichel /test>\
    \ cat feed.sh\n#!/bin/bash\n# This script acts upon the exit status given by penguin.\n\
    ```\n\n```\nif [ \"$#\" != \"2\" ]; then\n\techo -e \"Usage of the feed script:\\\
    t$0 food-on-menu animal-name\\n\"\n\texit 1\nelse\n\texport menu=\"$1\"\n\texport\
    \ animal=\"$2\"\n\techo -e \"Feeding $menu to $animal...\\n\"\n\n\tfeed=\"/nethome/anny/testdir/penguin.sh\"\
    \n\n\t$feed $menu $animal\n\n\tresult=\"$?\"\n\n\techo -e \"Done feeding.\\n\"\
    \n\n\tcase \"$result\" in\n\t\t1)\n\t\t\techo -e \"Guard: \\\"You'd better give'm\
    \ a fish, less they get violent...\\\"\"\n\t\t\t;;\n\t\t2)\n\t\t\techo -e \"Guard:\
    \ \\\"No wonder they flee our planet...\\\"\"\n\t\t\t;;\n\t\t3)\n\t\t\techo -e\
    \ \"Guard: \\\"Buy the food that the Zoo provides at the entry, you ***\\\"\"\n\
    \t\t\techo -e \"Guard: \\\"You want to poison them, or do you?\\\"\"\n\t\t\t;;\n\
    \t\t*)\n\t\t\techo -e \"Guard: \\\"Don't forget the guide!\\\"\"\n\t\t\t;;\n\t\
    esac\nfi\n```\n\n```\necho \"Leaving...\"\necho -e \"\\a\\a\\aThanks for visiting\
    \ the Zoo, hope to see you again soon!\"\n```\n\n```\nmichel /test> feed.sh camel\n\
    Feeding apple to camel...\n\nWill you read this sign? Don't feed the camels!\n\
    \nDone feeding.\n\nGuard: \"You want to poison them, or do you?\"\n\n...\nThanks\
    \ for visiting the Zoo, hope to see you again...\n\nmichel /test> feed.sh apple\n\
    Usage of the feed script: ./feed.sh food-on-menu animal-name\n```\n\nMore escape\
    \ characters can be found in Section 3.3.2. The following table gives an overview\
    \ of sequences recognized by echo:\n\nTable 8.1: Escape sequences used by echo\n\
    \n| Sequence | Meaning |\n| :--- | :--- |\n| \\a | Alert (bell) |\n| \\b | Backspace\
    \ |\n| \\c | Cut out output |\n| \\e | Escape |\n| \\f | Form feed |\n| \\n |\
    \ Newline |\n| \\r | Carriage return |\n| \\t | Horizontal tab |\n| \\v | Vertical\
    \ tab |\n| \\xHH | Hexadecimal value |\n| \\nnn | Octal value |\n\nThe read built-in\
    \ is the counterpart of echo. The syntax of read is:\n\n```\nread [options] NAME1\
    \ NAME2 ... NAMEN\n```\n\nOne line is read from standard input, or from file descriptor\
    \ specified by -u. If no names are supplied, the line is assigned to REPLY. The\
    \ return code of read is zero, unless an end-of-file is encountered, if read times\
    \ out or an invalid file descriptor is supplied.\n\nTable 8.2: Options to read\n\
    \n| Option | Meaning |\n| :--- | :--- |\n| -a ANAME | The words are assigned to\
    \ sequential indexes of array ANAME, starting at 0. All elements are removed from\
    \ ANAME. Other names are ignored. |\n| -d DELIM | The first character of DELIM\
    \ is used to terminate the input line, rather than newline. |\n| -n NCHARS | returns\
    \ after reading NCHARS rather than waiting for a complete line. |\n| -p PROMPT\
    \ | Display PROMPT, without a trailing newline, before attempting to read any\
    \ input. The prompt is displayed only if input is coming from a terminal. |\n\
    | -r | If this option is given, backslash does not act as an escape character.\
    \ The backslash is considered to be part of the line; in particular, a backslash-newline\
    \ pair may not be used as a line continuation. |\n| -s | Silent mode. If input\
    \ is coming from a terminal, characters are not echoed. |\n| -t TIMEOUT Cause\
    \ read to time out and return failure if a complete line of input is not read\
    \ within TIMEOUT seconds. This option has no effect if read is not reading input\
    \ from the terminal or from a pipe. |\n| -u FD | Read input from file descriptor\
    \ FD. |\n\nThis is a straightforward example, improving on the leaptest.sh script\
    \ from the previous chapter:\n\n```\nmichel /test> cat leaptest.sh\n#!/bin/bash\n\
    # This script will test if you have given a leap year or not.\n\necho \"Type the\
    \ year that you want to check (4 digits), followed by [ENTER]:\"\nread year\n\n\
    if [ (( (\"$year\" % 400) == \"0\" )) || (( (\"$year\" % 4 == \"0\" && (\"$year\"\
    \ % 100 != \"0\") )) ) ]; then\n\techo \"$year is a leap year.\"\nelse\n\techo\
    \ \"$year is not a leap year.\"\nfi\n```\n\n```\nmichel /test> leaptest.sh\nType\
    \ the year that you want to check (4 digits), followed by [ENTER]:\n2000\n2000\
    \ is a leap year.\n```\n\n## 8.2.1 Prompting for user input\n\nThe following example\
    \ shows how you can use prompts to explain what the user should enter.\n"
