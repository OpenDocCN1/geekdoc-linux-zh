    ; done\n[ol@octarine ~/articles] ls **\nfile1.xml file1.bak file2.xml file2.bak\
    \ file3.xml file3.bak\n```\n\nThis one lists the files in /sbin that are just\
    \ text files, and possibly scripts:\n\n```\nfor i in `ls /sbin/`; do file /sbin/$i\
    \ | grep; done\n```\n\n## 9.2 The while loop\n\nThe following is a specific application\
    \ script for converting HTML files compliant with a certain scheme, to PHP files.\
    \ The conversion is done by taking out the first and last lines, replacing these\
    \ with PHP tags that provide header and footer:\n\n```bash\n#!/bin/bash\n# specific\
    \ conversion script for html files to php\nLIST=$(ls *.html)\nfor i in $LIST;\
    \ do\n  NEWNAME=$(echo $i | sed 's/.html/.php/')\n  echo \"<html>\"\n  cat \"\
    $i\" | sed -e '1,2d' | tac | sed -e '1,2d' >> \"$NEWNAME\"\ndone\n```\n\nSince\
    \ we don't do a counter here, there is no way of knowing the line number from\
    \ which to start deleting until reaching the end. The problem is solved using\
    \ tac, which reverses the lines in a file.\n\nThe while construct allows for repetitive\
    \ execution of a list of commands, as long as the command controlling the loop\
    \ executes successfully (exit status of zero). The syntax is:\n\n```\nwhile CONTROL-COMMAND;\
    \ do CONSEQUENT-COMMANDS; done\n```\n\nCONTROL-COMMAND can be any command that\
    \ can exit with a success or failure status. The CONSEQUENT-COMMANDS can be any\
    \ program, script or shell construct. As soon as CONTROL-COMMAND fails, the loop\
    \ exits. The return status is the exit status of the last CONSEQUENT-COMMAND command,\
    \ or zero if none was executed.\n\n### 9.2.1 Examples\n\nSimple example using\
    \ while\n\n```bash\n#!/bin/bash\n# This script opens 4 terminal windows.\ni=0\n\
    while [ $i -lt 4 ]\ndo\n  xterm &\n  i=$[$i+1]\ndone\n```\n\n#### Nested while\
    \ loops\n\n![](img/2e4e71363595151bf5345bf90e36_157.png)\n\n> Figure 9.1: Nested\
    \ while loops - pictures\n\nThe example in Figure 9.1 was written to copy pictures\
