    \n# Chapter 9: Repetitive tasks\n\n## 9.1 The for loop\n\nThe for loop is the\
    \ first of the three shell looping constructs. This loop allows for specification\
    \ of a list of values. A list of commands is executed for each value in the list.\n\
    \nThe syntax for this loop is:\n\n```\nfor NAME [in LIST ]; do COMMANDS; done\n\
    ```\n\nIf [in LIST] is not present, it is replaced with $@ and executes the COMMANDS\
    \ once for each positional parameter that is set (see Section 3.2.4 and Section\
    \ 7.2).\n\nThe return status is the exit status of the last command that executes.\
    \ If no commands are executed because LIST does not expand to any items, the return\
    \ status is zero.\n\nNAME can be any variable name, although i is used very often.\
    \ LIST can be any list of words, strings or numbers, which can be literal or generated\
    \ by any command. The COMMANDS to execute any system commands, script, program\
    \ or shell statement. The first time through the loop, NAME is set to the first\
    \ item in LIST. The second time, its value is set to the second item in the list,\
    \ and so on. The loop terminates when NAME has taken on each of the values from\
    \ LIST and no items are left in.\n\n### 9.1.1 Examples\n\n#### Using command substitution\
    \ for specifying LIST items\n\nThe first is a command line example, demonstrating\
    \ the use of a for loop that makes a backup copy of each .xml file. After issuing\
    \ the command, it is safe to start working on your sources:\n\n```\n[ol@octarine\
