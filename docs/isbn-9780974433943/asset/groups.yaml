    ## 10.2 数组变量\n\n数组是一个包含多个值的变量。任何变量都可以用作数组。数组的大小没有限制，也不要求成员变量必须连续索引或赋值。数组是从零开始索引的：第一个元素的索引号为\
    \ 0。\n\n间接声明使用以下语法来声明变量：\n\n```\nARRAY[INDEXNR]=value\n```\n\n`INDEXNR` 被视为一个算术表达式，必须求得一个正数。\n\
    \n使用 `declare` 内置命令对数组进行显式声明：\n\n```\ndeclare -a ARRAYNAME\n```\n\n带有索引号的声明也会接受，但索引号会被忽略。可以使用\
    \ `declare` 和 `readonly` 内置命令指定数组的属性。属性适用于数组中的所有变量；你不能拥有混合数组。\n\n还可以使用这种格式的复合赋值创建数组变量：\n\
    \n```\nARRAY=(value1 value2 ... valueN)\n```\n\n每个值都采用 `[indexnumber]=string`\
    \ 的形式。索引号是可选的。如果提供，则分配给它；否则，分配的元素索引是上一次赋值的索引号加一。`declare` 同样接受这种格式。如果没有提供索引号，索引将从零开始。\n\
    \n在数组中添加缺失或额外的成员使用以下语法：\n\n```\nARRAYNAME[indexnumber]=value\n```\n\n记住，`read`\
    \ 内置命令提供了 `-a` 选项，允许读取并为数组的成员变量赋值。\n\n### 10.2.1 解引用数组中的变量\n\n为了引用数组中某项项的内容，请使用大括号。正如后续示例所示，这是必要的，以绕过\
    \ shell 对扩展运算符的解释。如果索引号为 `@` 或 `*`，则会引用数组的所有成员。\n\n```\n[bob in ] ARRAY=(one two\
    \ three)\n[bob in ] echo ${ARRAY[*]}\none two three\n\n[bob in ] echo $ARRAY[*]\n\
    one[*]\n\n[bob in ] echo ${ARRAY[2]}\ntree\n\n[bob in ] ARRAY[3]=four\n[bob in\
    \ ] echo ${ARRAY[*]}\none two three four\n```\n\n在不提供索引号的情况下引用数组成员变量的内容，等同于引用索引为零的第一个元素的内容。\n\
    \n### 10.2.2 删除数组变量\n\n使用 `unset` 内置命令删除数组或数组的成员：\n\n```\n[bob in ] unset ARRAY[1]\n\
    [bob in ] echo ${ARRAY[*]}\none three four\n\n[bob in ] unset ARRAY\n[bob in ]\
    \ echo ${ARRAY[*]}\n<--no output-->\n```\n\n### 10.2.3 数组示例\n\n数组使用的实际示例很难找到。你会发现很多脚本并没有在你的系统上真正执行任何事情，但它们使用了数组来计算数学级数，例如。这本该是最有趣的示例之一……大多数脚本只是以过度简化和理论化的方式展示你可以用数组做什么。\n\
    \n这种枯燥的原因是数组是相当复杂的结构。你会发现，大多数可以使用数组的实际示例已经在你的系统中使用数组实现了，不过是在更底层，即在编写大多数 UNIX 命令的\
