    # 12.1 Signals


    # Finding the signal man page


    Your system contains a man page listing all the available signals, depending on
    your operating system, it might be opened in a different way. On most Linux systems,
    this will be man 7 signal. When doubt, locate the exact man page and section using
    commands like


    ```

