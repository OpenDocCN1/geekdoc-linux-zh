    \ httpd 和 init 守护进程。如果 httpd 正在运行，脚本应打印“此机器正在运行 Web 服务器”。使用 `ps` 检查进程。\n- 编写一个脚本使用\
    \ `scp` 将主目录备份到远程机器。脚本应在日志文件中报告，例如 `/log/backup.log`。如果没有第二个机器可以备份，使用 `scp` 测试复制到本地。这需要在两台主机之间建立\
