- md: "\n# Chapter 1: Bash and Bash scripts\n\n## 1.1 Common shell programs\n\nThe\
    \ UNIX shell program interprets user commands, which are either entered by the\
    \ user, or which can be read from a file called the shell or shell program. Shell\
    \ scripts are interpreted, not compiled. The shell reads commands from the script\
    \ line by line and searches for those commands on the system (see Section 1.2),\
    \ while a compiler converts a program into machine readable form, an an executable\
    \ file - which may then be used in a shell script.\n\nApart from passing commands\
    \ to the kernel, the main task of a shell is providing a user environment, which\
    \ can be configured individually using shell resource configuration files.\n\n\
    ### 1.1.1 Shell types\n\nJust like people know different languages and dialects,\
    \ your UNIX system usually offer a variety of shell types:\n\n- **sh** or Bourne\
    \ shell: the original shell still used on UNIX systems and UNIX-related environments.\
    \ This is the basic shell, a small program with few features. While this is not\
    \ the standard shell, it is still available on every Linux system for compatibility\
    \ with UNIX programs.\n- **bash** or Bourne Again shell: the standard GNU shell,\
    \ intuitive and flexible. Probably advisable for beginning users while being at\
    \ the same time as a powerful tool for the advanced and professional user. On\
    \ Linux, **bash** is the standard shell for common users. This shell is a-called\
    \ *superset* of the Bourne shell, a set of add-ons and plug-ins. This means that\
    \ the Bourne Again is compatible with the Bourne shell: commands that work in\
    \ **sh**, also work in this book. However, the reverse is not always the case.\
    \ All examples and exercises in this book use bash.\n- **csh** or C shell: the\
    \ syntax of this shell resembles that of the C programming language. Sometimes\
    \ asked for programmers.\n- **tcsh** or Turbo C shell: a superset of the common\
    \ C shell, enhancing userfriendliness and speed.\n- **ksh** or the Korn shell:\
    \ sometimes appreciated by people with a UNIX background. A superset of the Bourne\
    \ shell; with standard configuration a nightmare for beginning users.\n\nThe file\
    \ /etc/shells gives an overview of known shells on a Linux system:\n\n## 1.2 Advantages\
    \ of the Bourne Shell\n\n```bash\nmia:> cat /etc/shells\n/bin/bash\n/bin/sh\n\
    /bin/tcsh\n/bin/csh\n```\n\nYour default shell is set in the /etc/passwd file,\
    \ like this line for user mia:\n\n```bash\nmia:L2NOfqdPrHWE:504:504:mia Maya:/home/mia:/bin/bash\n\
    ```\n\nTo switch from one shell to another, just enter the name of the new shell\
    \ in the active terminal. The system finds the directory where the name occurs\
    \ using the PATH settings, and since a shell is an executable file (program),\
    \ the current shell activates it and it executes. A new prompt is usually shown,\
    \ because each shell has its typical appearance:\n\n```bash\nmia:> tcsh\n[mia@post21\
    \ ~]$\n```\n\n## 1.2 Advantages of the Bourne Again Shell\n\nThe GNU project (GNU's\
    \ UNIX) provides tools for UNIX-like system administration which are free software\
    \ and comply with UNIX standards.\n\nBash is an sh-compatible shell that incorporates\
    \ useful features from the Korn shell (ksh) and C shell (csh). It is intended\
    \ to conform to the IEEE POSIX P1003.2/ISO 9945.2 Shell and Tools standard. It\
    \ offers functional improvements over sh for both programming and interactive\
    \ use; these include command line editing, unlimited size command history, job\
    \ control, shell functions and aliases, indexed arrays of unlimited size, and\
    \ integer arithmetic in any base from two to sixty-four. Bash can run most sh\
    \ scripts without modification.\n\nLike other GNU projects, the bash initiative\
    \ was started to preserve, protect and promote the freedom to use, study, copy,\
    \ modify and redistribute software. It is generally known that such conditions\
    \ stimulate creativity. This was also the case with the bash program, which has\
    \ a lot of extra features that other shells can't offer.\n\n### 1.2.1 Invocation\n\
    \nIn addition to the single-character shell command line options which can be\
    \ configured using the set shell built-in command, there are several multi-character\
    \ options that you can use. We will come across a couple of the most popular options\
    \ in this and the following chapters; the complete list can be found in the Bash\
    \ info pages, Bash features → Invoking Bash.\n\n### 1.2.2 Bash startup files\n\
    \nBash reads different startup files depending on how you invoke it.\n\n**Invoked\
    \ as an interactive login shell, or with ‘login’**\n\nInteractive means you can\
    \ enter commands. The shell is not running because a script has been activated.\
    \ A login shell means that you got the shell after authenticating to the system,\
    \ usually by giving your user name and password.\n\nFiles read:\n\n- /etc/profile\n\
    - ~/.bash_profile, ~/.bash_login or ~/.profile: first existing readable file\n\
    - ~/.bash_logout upon logout.\n\nError messages are printed if configuration files\
    \ exist but are not readable. If a file does not exist, bash searches for the\
    \ next.\n\n**Invoked as an interactive non-login shell**\n\nA non-login shell\
    \ means that you did not have to authenticate to the system. For instance, when\
    \ you open a terminal using an icon, or a menu item, that is a non-login shell\
    \ shell.\n\nFiles read:\n\n- ~/.bashrc\n\nThis file is usually referred to in\
    \ ~/.bash_profile.\n\n**Invoked non-interactively**\n\nAll scripts use non-interactive\
    \ shells. They are programmed to do certain tasks and cannot be instructed to\
    \ do other jobs than those for which they are programmed.\n\nFiles read:\n\n-\
    \ defined by BASH_ENV\n\nPATH is not used to search for this file, if you want\
    \ to use it, best refer to it by giving the full path and file name.\n\n**Invoked\
    \ with the sh command**\n\nBash tries to behave as the historical Bourne sh program\
    \ while conforming to the POSIX standard as well.\n\nFiles read:\n\n- /etc/profile\n\
    - ~/.profile\n\nWhen invoked interactively, the ENV variable can point to extra\
    \ startup information.\n\n### POSIX mode\n\nThis option is enabled either using\
    \ the set built-in:\n\n```bash\nset -o posix\n```\n\nor by calling the bash program\
    \ with the --posix option. Bash will then try to behave as compliant as possible\
    \ to the POSIX standard for shells. Setting the POSIXLY_CORRECT variable does\
    \ the same.\n\nFiles read:\n\n- defined by ENV variable.\n\n## Invoked remotely\n\
    \nFiles read when invoked by rshd:\n\n- ~/.bashrc\n\n### Avoid use of r-\n\nBe\
    \ aware of the dangers when using tools such as rlogin, telnet, rsh and rcp. They\
    \ are intrinsically insecure because confidential data is sent over the network.\
    \ If you need tools for remote execution, file transfer and so on, use an implementation\
    \ of Secure Shell, generally known as SSH, freely available from <http://www.openssh.org>.\
    \ Different client programs are available for non-UNIX systems as well; see your\
    \ local software.\n\n### Invoked when UID is not equal to EUID\n\nWhen the effective\
    \ user ID (EUID) of the Bash process is different from the user ID of the person\
    \ invoking the script, Bash does not read any startup files. This situation generally\
    \ arises from setuid scripts; see the setuid man page for more information.\n\n\
    ## Interactive shells\n\nAn interactive shell generally reads from a terminal,\
    \ and writes to, a user’s terminal: input and output are connected to a terminal.\
    \ Bash interactive behavior is started when the bash command is called upon non-option\
    \ arguments, except when the option is a string to read from or when the shell\
    \ is invoked to read from standard input, which allows for positional parameters\
    \ to be set (see Chapter 3, \"The Bash environment\").\n\nIs this shell interactive?\
    \ Test by looking at the content of the special parameter -, it contains an 'i'\
    \ when the shell is interactive:\n\n```bash\neddy:$ echo $-\ni\n```\n\nIn non-interactive\
    \ shells, the prompt, PS1, is unset.\n\n Interactive shell behavior Differences\
    \ in interactive mode:\n\n- Bash reads startup files.\n- Job control enabled by\
    \ default.\n- Prompts are set, PS2 is enabled for multi-line commands, it is usually\
    \ set to \">>\". This is also the prompt you get when the shell thinks you entered\
    \ an unfinished command, for instance when you forget quotes, command structures\
    \ that cannot be left out, etc.\n- Commands are read by default from the command\
    \ line using readline.\n- Bash interprets the shell option ignoreeof instead of\
    \ exiting immediately upon receiving EOF (End Of File).\n- Command history and\
    \ history expansion are enabled by default. History is saved in the file pointed\
    \ to by HISTFILE when the shell exits. By default, HISTFILE points to \"$HOME/.bash_history\"\
    .\n- Alias expansion is enabled.\n- In the absence of traps, the SIGTERM signal\
    \ is ignored.\n- In the absence of traps, SIGINT is caught and handled. Thus,\
    \ typing Ctrl+C, for example, will not quit your interactive shell.\n- Sending\
    \ SIGHUP signals to all jobs on exit is configured with the hunuponxit option.\n"
  mdcn: '


    # 第一章：Bash 与 Bash 脚本


    ## 1.1 常见的 shell 程序


    UNIX shell 程序用于解释用户命令，这些命令可以由用户输入，也可以从一个名为 shell 或 shell 程序的文件中读取。shell 脚本是被解释执行的，而不是编译的。shell
    会逐行从脚本中读取命令，并在系统中搜索这些命令（见第 1.2 节），而编译器则将程序转换为机器可读的格式，即一个可执行文件——该文件随后后可以在 shell
    脚本中使用。


    除了向内核传递命令外，shell 的主要任务是提供用户环境，该环境可以使用特定的 shell 资源配置文件进行单独配置。


    ### 1.1.1 Shell 类型


    就像人们了解不同的语言和方言一样，你的 UNIX 系统通常提供多种类型的 shell：


    -   **sh** 或 Bourne shell：在 UNIX 系统和与 UNIX 环境中仍在使用的原始 shell。这是基础 shell，一个功能较少的小程序。虽然它不是标准
    shell，但为了兼容 UNIX 程序，它在每个 Linux 系统上都是可用的。

    -   **bash** 或 Bourne Again shell：标准的 GNU shell，直观且灵活。对于初学者来说可能是理想选择，同时对于高级和专业用户来说也是一个强大的工具。在
    Linux 上，**bash** 是普通用户的标准 shell。这种 shell 被称为 Bourne shell 的*超集*，包含了一系列附加和插件。这意味着
    Bourne Again 兼容 Bourne shell：在 **sh** 中运行的命令在本书中同样有效。然而，反过来则并不总是如此。书中的所有示例和练习都使用
    bash。

    -   **csh** 或 C shell：该 shell 的语法类似于 C 语言语言。有时会被程序员所青睐。

    -   **tcsh** 或 Turbo C shell：常用 C shell 的超集，增强了用户友好性和速度。

    -   **ksh** 或 Korn shell：有时受到具有 UNIX 背景的人的青睐。它是 Bourne shell 的超集；在标准配置下对初学者来说是一场噩梦。


    文件 `/etc/shells` 提供了 Linux 系统上已知 shell 的概览：


    ## 1.2 Bourne Shell 的优点


    ```bash

    mia:> cat /etc/shells

    /bin/bash

    /bin/sh

    /bin/tcsh

    /bin/csh

    ```


    你的默认 shell 设置在 `/etc/passwd` 文件中，如下所示的用户 mia 的行：


    ```bash

    mia:L2NOfqdPrHWE:504:504:mia Maya:/home/mia:/bin/bash

    ```


    要从一个 shell 切换到另一个 shell，只需在活动终端中输入新 shell 的名称。系统通过 PATH 设置找到该名称所在的目录，由于 shell
    是一个可执行文件（程序），当前 shell 会激活并执行它。通常会显示一个新的提示符，因为每个 shell 都有其典型的外观：


    ```bash

    mia:> tcsh

    [mia@post21 ~]$

    ```


    ## 1.2 Bourne Again Shell 的优点


    GNU 项目（GNU 的 UNIX）提供了用于类 Unix 系统管理的工具，这些工具是自由软件并符合 UNIX 标准。


    Bash 是一种兼容 sh 的 shell，它结合了 Korn shell (ksh) 和 C shell (csh) 的有用功能。它旨在符合 IEEE POSIX
    P1003.2/ISO 9945.2 Shell 和工具标准。在编程和交互式使用方面，它相比 sh 提供了功能性改进；这些包括命令行编辑、无限制大小的命令历史、作业控制、shell
    函数和别名、无限制大小的索引数组以及从二到六十四任何基数的整数运算。Bash 可以在不修改的情况下运行大多数 sh 脚本。


    与其他 GNU 项目一样，bash 倡议是为了保留、保护和促进使用、学习、复制、修改和重新发布软件的自由。众所周知，这种条件能激发创造力。bash 程序也是如此，它有很多其他
    shell 无法提供的额外功能。


    ### 1.2.1 调用


    除了可以使用 `set` shell 内置命令配置的单字符 shell 命令行选项外，还有几种你可以使用的多字符选项。我们将在本章及接后的章节中遇到几个最流行的选项；完整列表可以在
    Bash info 页面找到：Bash features → Invoking Bash。


    ### 1.2.2 Bash 启动文件


    Bash 根据你调用它的方式读取不同的启动文件。


    **作为交互式登录 shell 调用，或带有‘login’ 参数**


    交互式意味着你可以输入命令。shell 并不是因为脚本被激活而运行。登录 shell 意味着你在通过系统身份验证（通常通过提供用户名和密码）后获得了 shell。


    读取的文件：


    -   `/etc/profile`

    -   `~/.bash_profile`、`~/.bash_login` 或 `~/.profile`：第一个存在的可读文件

    -   退出登录时读取 `~/.bash_logout`。


    如果配置文件存在但不可读，则会打印错误信息。如果文件不存在，bash 将搜索下一个。


    **作为交互式非登录 shell 调用**


    非登录 shell 意味着你不需要对系统进行身份验证。例如，当你使用图标或菜单项打开终端时，这就是非登录 shell。


    读取的文件：


    -   `~/.bashrc`


    此文件通常在 `~/.bash_profile` 中被引用。


    **非交互式调用**


    所有脚本都使用非交互式 shell。它们被设计为执行某些任务，不能被指令执行除其编写任务之外的其他工作。


    读取的文件：


    -   由 `BASH_ENV` 定义


    如果你想使用此文件，PATH 不用于搜索该文件。


    **通过 sh 命令调用**


    Bash 尝试以符合 POSIX 标准的方式运行，即使是交互式的。


    读取的文件：


    -   `/etc/profile`

    -   `~/.profile`


    在交互式调用时，ENV 变量可以指向额外的启动信息。


    ### POSIX 模式


    此选项通过 `set` 内置命令启用：


    ```bash

    set -o posix

    ```


    或者通过带有 `--posix` 选项调用 bash。此时 bash 将尽可能遵循 POSIX 标准的行为。


    读取的文件：


    -   由 ENV 变量定义。


    **远程调用**


    通过 rsh 调用时读取的文件：


    -   `~/.bashrc`


    ### 避免使用 r-


    注意使用 rlogin、telnet、rsh 和 rcp 等工具的危险性，因为这些数据在网络上传输是不安全的。如果你需要远程执行、文件传输等工具，请使用通常被称为
    SSH 的安全 Shell，从 <http://www.openssh.org> 获取。


    ### 当 UID 不等于 EUID 时调用


    当 Bash 进程的有效用户 ID (EUID) 与调用脚本的用户 ID 不同时，Bash 不读取任何启动文件。这种情况通常出现在 setuid 脚本中；更多信息请参见
    setuid 手页。


    ## 交互式 shell


    交互式 shell 通常从终端读取并写入用户的终端：输入和输出都连接到终端。当 bash 命令作为非选项参数调用时，会启动交互式行为，这允许设置位置参数（见第三章“Bash
    环境”）。


    此 shell 是交互式的？通过查看特殊参数 `-` 的内容进行测试，当 shell 是交互式的，它包含 ''i''：


    ```bash

    eddy:$ echo $-

    i

    ```


    在非交互式 shell 中，提示符 PS1 未设置。


    交互式 shell 行为的区别：


    -   Bash 读取启动文件。

    -   默认启用作业控制。

    -   设置了提示符，多行命令启用 PS2，它通常设置为“>>”。当 shell 认为你输入了未完成的命令（例如忘记引号、命令结构等）时，也会得到这个提示符。

    -   默认使用 readline 从命令行读取命令。

    -   Bash 解释 shell 选项 ignoreeof 而在接收到 EOF（文件结束）时立即退出。

    -   默认启用命令历史和历史扩展。历史在 shell 时保存到 HISTFILE 指向的文件。默认情况下，HISTFILE 指向 "$HOME/.bash_history"。

    -   启用别名。

    -   在没有捕获器的情况下，SIGTERM 信号被忽略。

    -   在没有捕获器的情况下，SIGINT 被捕获并处理。因此，例如输入 Ctrl+C 不会退出交互式 shell。

    -   退出时向所有作业发送 SIGHUP 信号是通过 hunuponxit 选项配置的。


