    # Closing file descriptors


    Since child processes inherit open file descriptors, it is good practice to close
    a file descriptor when it is no longer needed. This is done using the


    ```

    exec fd&-

    ```


    In the above example, file descriptor 7, which has been assigned to standard input,
    is closed each time the user needs to access to the actual standard input device,
    usually the keyboard.


    The following is a simple example redirecting only standard error to a pipe:


    ```

    michel > cat listdirs.sh

    #!/bin/bash


    # This script prints standard output unchanged, while standard error is

    # redirected for processing by awk.


    INPUTDIR="$"


    exec 6>&1

    ls "$INPUTDIR/* 2>&1 >& 6&-

    # Closes fd 6 for awk, but not for ls.


    | awk ''BEGIN { FS=":" } { print "YOU HAVE NO ACCESS TO " $2 }'' 6>&-


    exec 6>&

    ```


    # Here documents


    Frequently, your script might call on another program or script that requires
    input. The here document provides a way of instructing the shell to read input
    from the current source until a line containing only the search string is found
    (no trailing blanks). All of the lines up to that point are then used as the standard
    input for a command.


    The result is that you don''t need to call on separate files; you can use shell-special
    characters, and it looks nicer than a bunch of echo`’s:


    ```

    michel ~ cat startsurf.sh

    #!/bin/bash


    # This script provides an easy way for users to choose between browsers.

    echo "These are the web browsers on this system:"

    ```'
