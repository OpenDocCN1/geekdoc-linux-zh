    ## Chapter 3: The Bash environment


    ## 3.1 Shell initialization files


    Depending on how it is invoked, Bash executes several configuration files before
    it begins a script or interactive session.


    /etc/profile


    When invoked interactively with the --login option or when invoked as sh, Bash
    reads the /etc/profile instructions. These usually set the shell variables PATH,
    USER, MAIL, HOSTNAME and HISTSIZE.


    On some systems, the umask value is configured in /etc/profile; on other systems
    this file points to other configuration files such as:


    - /etc/inputrc, the system-wide Read initialization file where you can configure
    the command line bell-style.

    - /etc/profile.d directory, which contains files configuring system-wide behavior
    of specific programs.


    All settings that you want to apply to all your users'' environments should be
    in this file. It might look like this:


    ```bash

    # /etc/profile

    # System wide environment and startup programs, for login setup

    PATH=$PATH:/usr/X11R/bin


    # No core files by default

    ulimit -s 0 > /dev/null 2>&1


    USER=$(id -u)

    LOGNAME=$USER

    MAIL=/var/spool/$USER


    HOSTNAME=$(hostname)

    HISTSIZE=1000

    ```

