    \    shift\ndone\n```\n\n## 9.8 总结\n\n在本章中，我们讨论了如何将重复命令整合到循环结构中。常见的循环是使用 for、while\
    \ 或 until 语句构建的，或者是这些命令的组合。for 循环按指定的次数执行。如果你不知道命令应该执行多少次，可以使用 until 或 while 来指定循环何时结束。\n\
    \n可以使用 break 和 continue 语句来中断或重迭代循环。\n\n可以使用输入重定向符将文件作为循环的输入，也可以通过管道将命令的输出读取并输入到中。\n\
    \nselect 结构用于在交互式脚本中打印菜单。可以使用 shift 语句对脚本的命令行参数进行循环处理。\n\n## 9.9 练习\n\n记住：在编写脚本时，要分步骤进行，并在将每一步整合到脚本之前对其进行测试。\n\
    \n- 1. 创建一个脚本，对 /etc 中的文件进行（递归）复制，这样初级系统管理员就可以无畏地编辑文件了。\n- 2. 编写一个恰好接受一个参数（目录名）的脚本。如果参数多于或少于一个，打印用法信息。如果参数不是目录，则打印另一个消息。对于给定的目录，打印最大的五个文件和最近修改的五个文件。\n\
