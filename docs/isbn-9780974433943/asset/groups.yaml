    \ localhost\n192.168.42.1 tintagel.kingarthur.com tintagel\nin central DNS\n```\n\
    \n## Chapter 8: Writing interactive scripts\n\n### Assigning file descriptors\
    \ to files Another way of looking at file descriptors is thinking of them as a\
    \ way to assign a numeric value to a file. Instead of using the file name, you\
    \ can use the file descriptor number. The exec built-in command is used to assign\
    \ a file descriptor to a file. Use\n\n```bash\nexec fdN> file\n```\n\nfor assigning\
    \ file descriptor N to file for output, and\n\n```bash\nexec fdN< file\n```\n\n\
    for assigning file descriptor N to file for input. After a file descriptor has\
    \ been assigned to a file, it can be used with the shell redirection operators,\
    \ as is demonstrated in the following example:\n\n```\nmichel > exec 4>result.txt\n\
    michel > filter body.txt | cat header.txt /dev/fd/0 footer.txt >&4\nmichel > cat\
    \ result.txt\n```\n\nThis text is printed at the beginning of each print job and\
    \ thanks the sysadmin for setting up such a great printing infrastructure.\n\n\
    Text to be filtered.\n\nThis text is printed at the end of each print job.\n\n\
    ### File descriptor 5\n\nUsing this file descriptor might cause problems; see\
    \ the Advanced Bash-Scripting Guide <http://www.tldp.org/LDP/abs/html/io-redirection.html>,\
    \ chapter 16. You are strongly advised not to use it.\n\nRead in scripts The following\
    \ is an example that shows how you can alternate between file input and command\
    \ line input:\n\n```\nmichel \"/testdir\" cat sysnotes.sh\n#!/bin/bash\n\n# This\
    \ script makes an index of important config files, puts them together\n# in a\
    \ backup file and allows for adding comment for each file.\n\nCONFIG=/var/tmp/sysconfig.out\n\
    rm \"$CONFIG\" 2>/dev/null\necho \"Output will be saved in $CONFIG.\"\n\nexec\
    \ 7<&0\n\nexec < /etc/passwd\n\n# Read the first line of /etc/passwd\nread rootpasswd\n\
    \necho \"Saving root account info...\"\necho \"Your root account info: >> \"$CONFIG\"\
    \necho rootpasswd >> \"$CONFIG\"\n\nexec 0<&7-\n\necho -n \"Enter comment or [ENTER]\
    \ for no comment: \"\nread comment; echo $comment >> \"$CONFIG\"\necho \"Saving\
    \ hosts information...\"\n\n# first prepare a hosts file not containing any comments\n\
    TEMP=/var/tmp/hosts.tmp\ncat /etc/hosts | grep -v \"#\" > \"$TEMP\"\n\nexec 7<&0\n\
    exec < \"$TEMP\"\n\nread ip1 name alias1\nread ip2 name alias2\n\necho \"Your\
    \ local host configuration:\" >> \"$CONFIG\"\n\necho \"\\$ip1 \\$name \\$alias1\"\
    \ >> \"$CONFIG\"\necho \"\\$ip2 \\$name \\$alias2\" >> \"$CONFIG\"\n\nexec 0<&7-\n\
    \necho -n \"Enter comment or [ENTER] for no comment: \"\nread comment; echo $comment\
    \ >> \"$CONFIG\"\nrm $TEMP\n\nmichel /testdir/ synnotes.sh\nOutput will be saved\
    \ in /var/tmp/sysconfig.out.\n\nSaving root account info...\nEnter comment or\
    \ [ENTER] for no comment: hint for password: blue lagoon\nSaving hosts information.\n\
    \nEnter comment or [ENTER] for no comment: in central DNS\n\nmichel \"<testdir>\
    \ cat /var/tmp/sysconfig.out\nYour root account info:\nroot:0:0:root:/bin/bash\n\
    \nhint for password: blue lagoon\nYour local host configuration:\n127.0.0.1 localhost.localdomain\
    \ localhost\n192.168.42.1 tintagel.kingarthur.com tintagel\nin central DNS\n```\n\
    \n### Closing file descriptors\n\nSince child processes inherit open file descriptors,\
    \ it is good practice to close a file descriptor when it is no longer needed.\
    \ This is done using the\n\n```bash\nexec fd&-\n```\n\nIn the above example, file\
    \ descriptor 7, which has been assigned to standard input, is closed each time\
    \ the user needs to access to the actual standard input device, usually the keyboard.\n\
    \nThe following is a simple example redirecting only standard error to a pipe:\n\
    \n```bash\nmichel > cat listdirs.sh\n#!/bin/bash\n\n# This script prints standard\
    \ output unchanged, while standard error is\n# redirected for processing by awk.\n\
    \nINPUTDIR=\"$\"\n\nexec 6>&1\nls \"$INPUTDIR/*\" 2>&1 >& 6&-\n# Closes fd 6 for\
    \ awk, but not for ls.\n\n| awk 'BEGIN { FS=\":\" } { print \"YOU HAVE NO ACCESS\
    \ TO \" $2 }' 6>&-\n\nexec 6>&\n```\n\n### Here documents\n\nFrequently, your\
    \ script might call on another program or script that requires input. The here\
    \ document provides a way of instructing the shell to read input from the current\
    \ source until a line containing only the search string is found (no trailing\
    \ blanks). All of the lines up to that point are then used as the standard input\
    \ for a command.\n\nThe result is that you don't need to call on separate files;\
    \ you can use shell-special characters, and it looks nicer than a bunch of echo's:\n\
    \n```bash\nmichel ~ cat startsurf.sh\n#!/bin/bash\n\n# This script provides an\
    \ easy way for users to choose between browsers.\necho \"These are the web browsers\
    \ on this system:\"\n\n```\n# Start here document\ncat << BROWSERS\nmozilla\n\
    links\nlynx\nkonqueror\nopera\nnetscape\nBROWSERS\n# End here document\necho -n\
    \ \"Which is your favorite? \"\nread browser\n\necho \"Starting $browser...\n\
    ```\n\nThe result is that you don't need to call on separate files; you can use\
    \ shell-special characters, and it looks nicer than a bunch of echo's:\n\n```bash\n\
    #!/bin/bash\n\n# This script provides an easy way for users to choose between\
    \ browsers.\necho \"These are the web browsers on this system:\"\n\n# Start here\
    \ document\ncat << BROWSERS\nmozilla\nlinks\nlynx\nkonqueror\nopera\nnetscape\n\
    BROWSERS\n# End here document\necho -n \"Which is your favorite? \"\nread browser\n\
    \necho \"Starting $browser...\n```\n\nIf it is below 16, print a message telling\
    \ the user how many years he has to wait before:\n\n```bash\n#!/bin/bash\n\n#\
    \ This script makes an index of important config files, puts them together\n#\
    \ in a backup file and allows for adding comment for each file.\n\nCONFIG=/var/tmp/sysconfig.out\n\
    rm \"$CONFIG\" 2>/dev/null\necho \"Output will be saved in $CONFIG.\"\n\nexec\
    \ 7<&0\n\nexec < /etc/passwd\n\n# Read the first line of /etc/passwd\nread rootpasswd\n\
    \necho \"Saving root account info...\"\necho \"Your root account info: >> \"$CONFIG\"\
    \necho rootpasswd >> \"$CONFIG\"\n\nexec 0<&7-\n\necho -n \"Enter comment or [ENTER]\
    \ for no comment: \"\nread comment; echo $comment >> \"$CONFIG\"\necho \"Saving\
    \ hosts information...\"\n\n# first prepare a hosts file not containing any comments\n\
    TEMP=/var/tmp/hosts.tmp\ncat /etc/hosts | grep -v \"#\" > \"$TEMP\"\n\nexec 7<&0\n\
    exec < \"$TEMP\"\n\nread ip1 name alias1\nread ip2 name alias2\n\necho \"Your\
    \ local host configuration:\" >> \"$CONFIG\"\n\necho \"\\$ip1 \\$name \\$alias1\"\
    \ >> \"$CONFIG\"\necho \"\\$ip2 \\$name \\$alias2\" >> \"$CONFIG\"\n\nexec 0<&7-\n\
    \necho -n \"Enter comment or [ENTER] for no comment: \"\nread comment; echo $comment\
    \ >> \"$CONFIG\"\nrm $TEMP\n```\n\n## 8.3 Summary\n\nIn this chapter, we learned\
    \ how to prompt for user. We also discussed how files can be used as input and\
    \ output using file descriptors, and how this can be combined with getting. We\
    \ stressed the importance of providing ample message for the users. As always\
    \ using your scripts, it is better to give too much information than not enough.\
    \ Here documents is a type of shell construct that allows creation of lists, This\
    \ construct can also be used to execute otherwise tasks in.\n\n## 8.4 Exercises\n\
    \nThese exercises are practical applications of the constructs discussed in this\
    \ chapter. When writing the scripts, you may test by using a test directory that\
    \ does not contain too much data. Write each step, then test that portion, rather\
    \ than writing everything at once.\n\n- 1. Write a script that asks for the user's\
    \ age. If it is equal to or higher than 16, print a message saying that user is\
    \ allowed to drink. If it is below 16, print a message telling the user how many\
    \ years he has to wait before legally allowed to drink. As an extra, calculate\
    \ how much beer an 18+ user has drunk statistically (100 liters/year) and print\
    \ this information for the user.\n- 2. Write a script that takes one file as an\
    \ argument. Use a here document that presents the user with a couple of choices\
    \ for compressing the file. Possible choices could be gzip, bzip2, compress and\
    \ zip\n- 3. Write a script called homebackup that automates tar so the person\
    \ executing the scripts always uses the default options (cvp) and backup destination\
    \ directory (/var/backups) to make a backup of his or her directory. Implement\
    \ the following features:\n- Test for the number of arguments. The script should\
    \ run without arguments. If any arguments are present, exit after printing a usage\
    \ message.\n- Determine whether the backups directory has enough free space to\
    \ hold the backup.\n- Ask the user whether a full or incremental backup is wanted.\
    \ If the user does not have a full backup yet, print a message that a full backup\
    \ will be taken. In case of an incremental backup, only do this if the full backup\
    \ is not older than a week.\n- Compress the backup using any compression tool.\
    \ Inform the user that the script is doing this, because it might take some time,\
    \ during which the user might start worrying if no output appears on the screen.\n\
    - Print a message informing the user about the size of the compressed backup.\n\
    - 4. Write a script called simple-useradd.sh that adds a local user to the system.\
    \ This script should:\n"
  mdcn: "\n\n## 第 8 章：编写交互式脚本\n\n### 读取与执行 (Read and exec)\n\n将文件描述符分配给文件。另一种查看文件描述符的方法将其视为给文件分配数值。与其使用文件名，你可以使用文件描述符编号。`exec`\
    \ 内置命令用于将文件描述符分配给文件。使用：\n\n```bash\nexec fdN> file\n```\n\n将文件描述符 N 分配给文件用于输出，以及：\n\
    \n```bash\nexec fdN< file\n```\n\n将文件描述符 N 分配给文件用于输入。在文件描述符分配给文件后，就可以配合 shell\
