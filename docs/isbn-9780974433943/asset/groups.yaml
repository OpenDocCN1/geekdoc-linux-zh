- md: "\n# Chapter 7\n\n## Conditional statements\n\nIn this chapter we will discuss\
    \ the use of conditionals in Bash scripts. This includes the following topics:\n\
    \n- * The if statement\n- Using the exit status of a command\n- Comparing and\
    \ testing input and files\n- if/then/else constructs\n- if/then/elif/else constructs\n\
    - Using and testing the positional parameters\n- Nested if statements\n- Boolean\
    \ expressions\n- Using case statements\n\n## Chapter 7: Conditional statements\n\
    \n### 7.1 Introduction to if\n\nAt times you need to specify different courses\
    \ of action to be taken in a shell script, depending on the success or failure\
    \ of a command. The if construction allows you to specify such conditions.\n\n\
    The most compact syntax of the if command is:\n\n```bash\nif TEST-COMMANDS; then\
    \ CONSEQUENT-COMMANDS; fi\n```\n\nThe TEST-COMMAND list is executed, and if its\
    \ return status is zero, the CONSEQUENT-COMMANDS list is executed. The return\
    \ status is the exit status of the last command executed, or zero if no condition\
    \ tested true.\n\nThe TEST-COMMAND often involves numerical or string comparison\
    \ tests, but it can also be any command that returns a status of zero when it\
    \ succeeds and some other status when it fails. Unary expressions are often used\
    \ to examine the status of a file. If the FILE argument to one of the primaries\
    \ is of the form /dev/fd/N, then descriptor \"N\" is checked. stdin, stdout and\
    \ stderr and their file descriptors may also be used for tests.\n\n### Expressions\
    \ used with if\n\nThe table below contains an overview of the so-called \"primaries\"\
    \ that make up the TEST-COMMAND command or list of commands. These primaries are\
    \ put between square brackets to indicate the status of a conditional expression.\n\
    \n#### Table 7.1: Primary expressions\n\n| Primary | Meaning |\n| --- | --- |\n\
    | -aFILE | True if FILE exists. |\n| -bFILE | True if FILE exists and is a block-special\
    \ file. |\n| -cFILE | True if FILE exists and is a character-special file. |\n\
    | -dFILE | True if FILE exists and is a directory. |\n| -eFILE | True if FILE\
    \ exists. |\n| -fFILE | True if FILE exists and is a regular file. |\n| -gFILE\
    \ | True if FILE exists and its SGID bit is set. |\n| -hFILE | True if FILE exists\
    \ and is a symbolic link. |\n| -kFILE | True if FILE exists and its sticky bit\
    \ is set. |\n| -pFILE | True if FILE exists and is a named pipe (FIFO). |\n| -rFILE\
    \ | True if FILE exists and is readable. |\n| -sFILE | True if FILE exists and\
    \ has a size greater than zero. |\n| -uFILE | True if file descriptor FD is open\
    \ and refers to a terminal. |\n| -wFILE | True if FILE exists and its SUID (set\
    \ user ID) bit is set. True if FILE exists and is writable. |\n| -xFILE | True\
    \ if FILE exists and is executable. |\n| -OFILE | True if FILE exists and is owned\
    \ by the effective user ID. |\n| -GFILE | True if FILE exists and is owned by\
    \ the effective group ID. |\n| -LFILE | True if FILE exists and is a symbolic\
    \ link. |\n| -SFILE | True if FILE exists and is a socket. |\n| FILE1 -ntFILE2\
    \ | True if FILE1 has been changed more recently than FILE2, nor if FILE1 exists\
