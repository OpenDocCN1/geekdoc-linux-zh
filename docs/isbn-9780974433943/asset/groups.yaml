    ## 2.2 脚本基础


    哪个 shell 将运行该脚本？


    在子 shell 中运行脚本时，你应该定义由哪个 shell 来运行脚本。你编写脚本时的 shell 类型可能不是你系统的默认类型，因此你输入的命令在被错误的
    shell 执行时可能会导致错误。


    脚本的第一行决定了要启动的 shell。第一行的前两个字符应该是 `#!`，然后是解释后续命令所需的 shell 路径。空行也被视为行，因此不要用空行作为脚本的开头。


    出于本课程的目的，所有脚本将以以下行开头：

    #!/bin/bash`


    如之前提到的，这意味着可以在 `/bin` 中找到 Bash 可执行文件。


    ## 2.2.1 添加注释


    你应该意识到你可能不是唯一阅读代码的人。许多用户和系统管理员运行脚本。如果他们想知道你是如何做的，注释对读者非常有帮助。


    注释还能让你的生活变得简单。假设你必须阅读大量的手册（man pages）以便在脚本中使用某些命令来实现特定的结果。在几周或几个月后你需要更改脚本，除非你记得你做了什么、怎么做的以及为什么这样做。将
