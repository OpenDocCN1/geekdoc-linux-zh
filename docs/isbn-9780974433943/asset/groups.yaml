    # Chapter 9: Repetitive tasks


    # 9.1 The for loop


    The for loop is the first of the three shell looping constructs. This loop allows
    for specification of a list of values. A list of commands is executed for each
    value in the list.


    The syntax for this loop is:


    ```

    for NAME [in LIST ]; do COMMANDS; done

    ```


    If [in LIST] is not present, it is replaced with $@ and executes the COMMANDS
    once for each positional parameter that is set (see Section 3.2.4 and Section
    7.2).


    The return status is the exit status of the last command that executes. If no
    commands are executed because LIST does not expand to any items, the return status
    is zero.


    NAME can be any variable name, although i is used very often. LIST can be any
    list of words, strings or numbers, which can be literal or generated by any command.
    The COMMANDS to execute any system commands, script, program or shell statement.
    The first time through the loop, NAME is set to the first item in LIST. The second
    time, its value is set to the second item in the list, and so on. The loop terminates
    when NAME has taken on each of the values from LIST and no items are left in.


    # 9.1.1 Examples


    # Using command substitution for specifying LIST items


    The first is a command line example, demonstrating the use of a for loop that
    makes a backup copy of each .xml file. After issuing the command, it is safe to
    start working on your sources:


    ```

    [ol@octarine ~/articles] ls *.xml

    file1.xml file2.xml file3.xml

    [ol@octarine ~/articles] ls *.xml > list

    [ol@octarine ~/articles] for in i `cat list`; do cp $i "$i.bak"; done

    [ol@octarine ~/articles] ls **

    file1.xml file1.bak file2.xml.bak file3.xml file3.bak

    ```


    This one lists the files in /sbin that are just plain text files, and possibly
    scripts:


    ```

    for i in `ls /sbin/`; do file /sbin/$i | grep ASCII; done

    ```'
