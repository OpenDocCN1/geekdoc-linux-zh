    # # About the Author


    Linux advocate of the first hour, Machtelt Garrels has made many contributions
    to the Open Source community and has been working for over a decade on the wider
    acceptance of Linux and other C products. She is an active member of the Linux
    Documentation Project and a training manager CoreSequence. She writes when she
    has the time, closing gaps in existing documentation and taking the opportunity
    to simplify it with necessary tools, always keeping in mind that practice is the
    only way to learn.


