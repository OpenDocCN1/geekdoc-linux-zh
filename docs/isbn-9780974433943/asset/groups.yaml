    ## 常用 UNIX 命令


    - login 远程登录（telnet，不安全！）。

    - rm 删除文件。

    - rmdir 删除目录。

    - roff 对 roff 排版系统的综述。

    - rpm RPM 软件包管理器。

    - rsh 远程 shell（不安全！）。


    # S


    - scp 安全的远程复制。

    - screen 带有 VT100 仿真功能的屏幕管理器。

    - set 显示或更改变量。

    - setterm 设置终端属性。

    - sftp 安全（加密）ftp。

    - sh 打开一个标准的 shell。

    - shutdown 关系统。

    - sleep 等待指定的时间段。

    - slocate GNU Locate 的安全增强版本。

    - slrn 文本模式 Usenet 客户端。

    - snort 网络入侵检测工具。

    - sort 排序文本文件的行。

    - ssh 安全 shell。

    - ssh-keygen 生成身份验证密钥。

    - stty 修改并打印终端行设置。

    - su 切换用户。


    # T


    - tac 反向连接并打印文件。

    - tail 输出文件的最后部分。

    - talk 与用户交谈。

    - tar 归档工具。

    - **tsh** 打开一个 Turbo C shell。

    - **telnet** TELNET 协议的用户界面（不安全！）。

    - **tex** 文本格式化和排版。

    - **time** 为简单命令计时或提供资源使用情况。

    - **tin** 新闻阅读程序。

    - **top** 显示顶部 CPU 进程。

    - **touch** 修改文件戳。

    - traceroute 打印数据包到达网络主机的路径。

    - tripwire UNIX 系统的文件完整性检查器。

    - troff 格式化文档。

    - twm X 窗口系统的标签窗口管理器。


    # U


    - **ulimit** 限制控制资源。

    - **umask** 设置用户文件创建掩码。

    - **umount** 卸载文件系统。

    - **uncompress** 解压缩压缩文件。

    - **uniq** 删除排序文件中重复行。

    - **update** 内核守护进程，将脏缓冲区刷回磁盘。

    - **uptime** 显示系统运行时间和平均负载。

    - **userdel** 删除用户账户及相关文件。


    # V


    - **vi(m)** 启动 vi（改进型）编辑器。

    - **vimutor** Vim 教程。

    - **vmstat** 报告虚拟内存统计信息。


    # W


    - **w** 显示谁登录以及正在做什么。

    - **wall** 向所有人的终端发送消息。

    - **wc** 打印文件的字节数、单词和行数。


    ## 常用 UNIX 命令


    - which 显示（shell）命令的完整路径。

    - who 显示谁已登录。

    - who am i 打印有效用户 ID。

    - whois 查询 whois 或别名数据库。

    - write 向另一个用户发送消息。


    # X


    - xauth X 权限文件实用工具。

    - xcdroast cdrecord 的图形化前端。

    - xclock 用于 X 的模拟/数字钟。

    - xconsole 用 X 监控系统控制台消息。

    - xdm 支持 XDMCP、主机选择器的显示管理器。

    - xdvi DVI 视器。

    - xfs X 字体服务器。

    - xhost X 的服务器访问控制程序。

    - xinetd 扩展的 Internet 服务守护进程。

    - xload X 的系统负载平均显示。

    - xlsfonts 用于 X 的服务器字体列表。

    - xmmms 用于 X 的音频播放器。

    - xpdf PDF 视器。

    - xterm 用于 X 的终端模拟器。


    # Z


    - zcat 压缩或展开文件。

    - zgrep 在可能的压缩文件中搜索正则表达式。

