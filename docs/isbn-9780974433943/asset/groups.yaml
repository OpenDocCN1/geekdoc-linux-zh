    ```


    ## 5.2.2 Deleting lines of input containing a pattern


    We use the same example text file. Now we only want to see the lines not containing
    the search string:


    ```

    sandy > sed ''/errors/d'' example

    This is the first line of an example text.

    This is a line not containing any errors.

    This is the last line.


    sandy >

    ```


    The d command results in excluding lines from being displayed.


    Matching lines starting with a given pattern and ending in a second pattern are
    showed like this:


