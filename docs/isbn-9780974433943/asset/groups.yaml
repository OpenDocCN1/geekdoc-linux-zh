    \ in /var/tmp/sysconfig.out.\n\nSaving root account info...\n输入注释或按 [ENTER] 跳过:\
    \ hint for password: blue lagoon\nSaving hosts information.\n\n输入注释或按 [ENTER]\
    \ 跳过: in central DNS\n\nmichel \"<testdir> cat /var/tmp/sysconfig.out\nYour root\
    \ account info:\nroot:0:0:root:/bin/bash\n\nhint for password: blue lagoon\nYour\
    \ local host configuration:\n127.0.0.1 localhost.localdomain localhost\n192.168.42.1\
    \ tintagel.kingarthur.com tintagel\nin central DNS\n\n### 关闭文件描述符 (Closing file\
    \ descriptors)\n\n由于子进程会继承已打开的文件描述符，因此在不再需要时关闭文件描述符是一个良好的习惯。可以使用以下命令：\n\n```bash\n\
    exec fd&-\n```\n\n在上面的示例中，分配给标准输入的文件描述符 7 在用户每次需要访问实际标准输入设备（通常是键盘）时都会被关闭。\n\n\
