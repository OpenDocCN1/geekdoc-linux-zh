    operator:x:11:0:operator:/bin/nologin

    cathy > grep -v /etc/passwd | grep -v nologin

    sync:x:5:5:sync:/usr/bin/sync

    shutdown:x:6:0:shutdown:/usr/bin/shutdown

    halt:x:7:0:halt:/usr/bin/halt

    news:x:9:13:news:/var/spool/

    mailinfo:x:47:47:/var/spool/mailqueue/

    xfs:x:43:43:X Font Server:/etc/bin/false

    prpc:x:31:32:Postmaster RPC server:/bin/false

    nscd:x:28:28:NSCD Daemon:/bin/false

    named:x:25:25:Named:/var/named:/bin/false

    squid:x:23:23:/var/spool/squid/dev

    ldap:x:55:55:LDAP User:/var/lib/ldap:/bin/false

    apache:x:48:48:Apache:/var/www:/bin/false

    ```


