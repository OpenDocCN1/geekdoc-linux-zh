    # Redirection of errors


    From the previous examples, it is clear that you can provide input and output
    files for a script (see Section 8.2.3 for more), but some tend to forget about
    redirecting errors - output which might be depended upon later on. Also, if you
    are lucky, errors will be mailed to you and eventual cases of failure might get
    revealed. If you are not as lucky, errors will cause your script to fail and won''t
    be caught or sent anywhere, so that you can''t start to do any worthwhile debugging.


    When redirecting errors, note that the order of redirection is significant. For
    example, this command, issued in /var/spool


    ```

    ls -l 2 > /var/tmp/inaccessible-in-spool

    ```


    will redirect output of the ls command to the file inaccessible-in-spool in /var/tmp.
    The command


    ```

    ls -l * 2 > /var/tmp/spoollist 2>&

    ```


    will direct both standard input and standard error to the file spoollist. The
    command


    ```

    ls -l * 2>& > /var/tmp/spoollist

    ```


    directs only the standard output to the destination file, because the standard
    error is copied to standard output before the standard output is redirected.


    For convenience, errors are often redirected to /dev/null, if it is sure they
    will not be needed. Hundreds of examples can be found in the startup scripts for
    your system.


    Bash allows for both standard output and standard error to be redirected to the
    file whose name is the result of the expansion of FILE with this construct:


    ```

    &> FILE

    ```


    This is equivalent of > FILE 2>&1, the construct used in the previous set of'
  - '[PAGE 146]


    # 8.2 Catching user input


    examples. It is also combined with redirection to /dev/null, for instance when
    you just want a command to execute, no matter what output or errors it gives.


    # 8.2.3 File input and output


    There are several different ways to read from and write to files from your Bash
    scripts.


    # Using /dev/fd


    The /dev/fd directory contains entries named 0, 1, 2, and so on. Opening the file
    /dev/fd/N is equivalent to duplicating file descriptor N. If your system provides
    /dev/stdin, /dev/stdout and /dev/stderr, you will see that these are equivalent
    to /dev/fd/0, /dev/fd/1 and /dev/fd/2, respectively.


    The main use of the /dev/fd files is in the shell. This mechanism allows programs
    to use pathname arguments to handle standard input and standard output in the
    same way as other pathnames. If /dev/fd is not available on a system, you''ll
    have to find a way to bypass the problem. This can be done for instance using
    a hyphen (-) to indicate that a program should read from a pipe. An example:


    ```

    michel > body.txt.gz | cat header.txt footer.txt

    Text is printed at the beginning of each print job and thanks the sysadmin for
    setting up such a great printing infrastructure.

    ```


    Text to be filtered.


    This text is printed at the end of each print job.


    The cat first reads the file header.txt, next its standard input which is the
    output of the filter command, and last the footer.txt file. The special meaning
    of the hyphen as a command-line argument to refer to the standard input or standard
    output is a misconception that has crept into many programs. There might also
    be problems when specifying hyphen as the first argument, since it might be interpreted
    as an option to the preceding command. Using /dev/fd allows for uniformity and
    prevents confusion:


    ```

    michel > filter body.txt cat header.txt /dev/fd/0 footer.txt | 1p

    ```


    In this clean example, all output is additionally piped through lp to send it
    to the default printer.'
