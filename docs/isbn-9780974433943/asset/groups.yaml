- md: "\n## 8.2 Catching user input\n\n```bash\nmichel \"/test> cat friends.sh\n#!/bin/bash\n\
    \n# This is a program that keeps your book up to date.\nfriends=/var/tmp/michel/friends\n\
    echo \"Hello, $USER. This script will register you in Michel's friends database.\"\
    \n\necho -n \"Enter your name and press [ENTER]: \"\nread name\necho -n \"Enter\
    \ your gender and press [ENTER]: \"\nread -n 1 gender\necho\n\ngrep -i \"$name\"\
    \ \"$friends\"\n\nif [ $? == 0 ]; then\n    echo \"You are already registered,\
    \ quitting.\"\n    exit 1\nelif [ $gender == \"m\" ]; then\n    echo \"You are\
    \ added to Michel's friends list.\"\n    exit 1\nelse\n    echo -n \"How old are\
    \ you? \"\n    read age\n    if [ $age -lt 25 ]; then\n        echo -n \"Which\
    \ colour of hair do you have? \"\n        read colour\n        echo \"$name $age\
    \ $colour\" >> \"$friends\"\n        echo \"You are added to Michel's friends\
    \ list. Thank you so much!\"\n    else\n        echo \"You are added to Michel's\
    \ friends list.\"\n        exit 1\n    fi\nfi\n\nmichel \"/test> cp friends.sh\
    \ /var/tmp; cd /var/tmp\nmichel \"/test> touch friends; chmod +w friends\nmichel\
    \ \"/test> friends.sh\nHello, michel. This script will register you in Michel's\
    \ friends database.\nEnter your name and press [ENTER]: michel\nEnter your gender\
    \ and press [ENTER]: :m\nYou are added to Michel's friends list.\n\nmichel \"\
    /test> cat friends\"\n```\n\nNote that no output is omitted here. The script only\
    \ stores information about the people Michel is interested in, but it will always\
    \ say you are added to the list, unless you are already in it.\n\nOther people\
    \ can now start executing the script:\n\n```bash\n[anny@octarine tmp]$ friends.sh\n\
    Hello, anny. This script will register you in Michel's friends database.\nEnter\
    \ your name and press [ENTER]: anny\nEnter your gender and press [ENTER]: f\n\
    How old are you? 22\nWhich colour of hair do you have? black\nYou are added to\
    \ Michel's friends list.\n```\n\nAfter a while, the friends list begins to look\
    \ like this:\n\n```\ntitle 24 black\nanny 22 black\nkatya 22 blonde\nmaria 21\
    \ black\n--output omitted-\n```\n\nOf course, this situation is not ideal, since\
    \ everybody can edit (but not delete) Michel's files. You can solve this problem\
    \ using special access modes on the script file; see “SUID and SGID” in chapter\
    \ 4 of the Introduction to Linux guide, <http://tille.soti.org/training/tldp>.\n\
    \n## 8.2.2 Redirection and file descriptors\n\nAs you know from basic shell usage,\
    \ input and output of a command may be redirected before it is executed, using\
    \ a special notation - the redirection operators - interpreted by the shell. Redirection\
    \ may also be used to open and close files for the current shell execution environment.\n\
    \nRedirection can also occur in a script, so that it can receive input from a\
    \ file, for instance, or send output to a file. Later, the user can review the\
    \ output file, or it may be used by another script as input.\n\nFile input and\
    \ output are accomplished by integer handles that track all open files for a given\
    \ process. These numeric values are known as file descriptors. The best known\
    \ file descriptors are stdin, stdout and stderr, with file descriptor numbers\
    \ 0, 1 and 2, respectively. These numbers and respective devices are reserved.\
    \ Bash can take TCP or UDP ports on networked hosts as file descriptors as well.\n\
    \nThe output below shows how the reserved file descriptors point to actual devices:\n\
    \n```bash\nmichel > ls -1 /dev/std*\nlrwxxrwx root root root   17 Oct 07:46 /dev/stderr\
    \ -> .. /proc/self/fd/2\nlrwxxrwx root root root   17 Oct 07:46 /dev/stdin ->\
    \ .. /proc/self/fd/0\nlrwxxrwx root root root   17 Oct 07:46 /dev/stdout -> ..\
    \ /proc/self/fd/1\n```\n\n```bash\nmichel > ls -1 /proc/self/fd/[0-2]\nlrwx------\
    \ 1 michel 64 Jan 23 12:11 /proc/self/fd/0 -> /dev/pts/6\nlrwx------ 1 michel\
    \ 64 Jan 23 12:11 /proc/self/fd/1 -> /dev/pts/6\nlrwx------ 1 michel 64 Jan 23\
    \ 12:11 /proc/self/fd/2 -> /dev/pts/6\n```\n\nYou might want to check info MAKEDEV\
    \ and info proc for more information about /proc subdirectories and the way your\
    \ system handles standard file descriptors for each running process.\n\nWhen you\
    \ run a script from the command line, nothing changes because the child shell\
    \ process will use the same file descriptors as the parent. When no parent is\
    \ available, for instance when you run a script using the cron facility, the standard\
    \ file descriptors are pipes or other (temporary) files, unless some form of redirection\
    \ is used. This is demonstrated in the example below, which shows output from\
    \ a simple at script:\n\n```bash\nmichel > date\nFri Jan 24 11:05:50 2023\n\n\
    michel > at now + 1 minute\nwarning: commands will be executed (in order)\nshell:\
    \ /bin/sh\nat > ls -1 /proc/self/fd/ > /var/tmp/fdtest.at\nat > 2023-01-24 11:07\n\
    \nmichel > cat /var/tmp/fdtest.at\ntotal 0\nl------- 1 michel 64 Jan 24 11:07\
    \ 0 -> /var/spool/a/a000001\nl------- 1 michel 64 Jan 24 11:07 1 -> /var/tmp/fdtest.at\n\
    l------- 1 michel 64 Jan 24 11:07 2 -> /var/spool/a/a000002\nl------- 1 michel\
    \ 64 Jan 24 11:07 3 -> /proc/self/fd\n```\n\nAnd with one cron:\n\n```bash\nmichel\
    \ > crontab -1\n# DO NOT EDIT THIS FILE - edit the master and reinstall.\n# 0\
    \ * * * * installed on Fri Jan 24 11:30:41 2023\n2 * * * * ls -1 /proc/self/fd/\
    \ > /var/tmp/fdtest.cron\n```\n\n## Chapter 8: Writing interactive scripts\n\n\
    ```bash\nmichel > cat /var/tmp/fdtest.cron\ntotal 0\nlr-x-- 1 michel 64 Jan 24\
    \ 11:07 0 -> pipe:[1234/4440]\nlr-x-- 1 michel 64 Jan 24 11:07 1 -> /var/tmp/fdtest.cron\n\
    lr-x-- 1 michel 64 Jan 24 11:07 2 -> pipe:[1234/4441]\nlr-x-- 1 michel 64 Jan\
    \ 24 11:07 3 -> /proc/self/fd\n```\n\n## Redirection of errors\n\nFrom the previous\
    \ examples, it is clear that you can provide input and output files for a script\
    \ (see 8.2.3 for more), but some tend to forget about redirecting errors output\
    \ which might be depended upon later. Also, if you are lucky, errors will be mailed\
    \ to you and cases of failure might get revealed. If you are not as lucky, errors\
    \ will cause your script to fail and won't be caught or sent anywhere, so that\
    \ you cant start to do any debugging.\n\nWhen redirecting errors, note that the\
    \ order of redirection is significant. For example, this command, issued in /var/spool:\n\
    \n```bash\nls -l 2 > /var/tmp/inaccessible-in-spool\n```\n\nwill redirect output\
    \ of the ls command to the file inaccessible-in-spool in /var/tmp. The command\n\
    \n```bash\nls -l * 2 > /var/tmp/spoollist 2>&\n```\n\nwill direct both standard\
    \ input and standard error to the file spoollist. The command\n\n```bash\nls -l\
    \ * 2>& /var/tmp/spoollist\n```\n\ndirects only the standard output to the destination\
    \ file, because the standard error is copied to standard output before the standard\
    \ output is redirected.\n\nFor convenience, errors are often redirected to /dev/null,\
    \ if it is sure they will not be needed. Hundreds of examples can be found in\
    \ the startup scripts for your system.\n\nBash allows for both standard output\
    \ and standard error to be redirected to the file whose name is the result of\
    \ the expansion of FILE with this construct:\n\n```bash\n&> FILE\n```\n\nThis\
    \ is equivalent of > FILE 2>&1, the construct used in the previous set of examples.\
    \ It is also combined with redirection to /dev/null, for instance when you just\
    \ want a command to execute, no matter what output or errors it gives.\n\n## 8.2.3\
    \ File input and output\n\nThere are several different ways to read from and write\
    \ to files from your Bash scripts.\n\n### Using /dev/fd\n\nThe /dev/fd directory\
    \ contains entries named 0, 1, 2, and so on. Opening the file /dev/fd/N is equivalent\
    \ to duplicating file descriptor N. If your system provides /dev/stdin, /dev/stdout\
    \ and /dev/stderr, you will see that these are equivalent to /dev/fd/0, /dev/fd/1\
    \ and /dev/fd/2, respectively.\n\nThe main use of the /dev/fd files is in the\
    \ shell. This mechanism allows programs to use pathname arguments to handle standard\
    \ input and standard output in the same way as other pathnames. If /dev/fd is\
    \ not available on a system, you'll have to find a way to bypass the problem.\
    \ This can be done for instance using a hyphen (-) to indicate that a program\
    \ should read from a pipe. An example:\n\n```bash\nmichel > body.txt.gz | cat\
    \ header.txt footer.txt\nText is printed at the beginning of each print job and\
    \ thanks the sysadmin for setting up such a great printing infrastructure.\n```\n\
    \nText to be filtered.\n\nThis text is printed at the end of each print job.\n\
    \nThe cat first reads the file header.txt, next its standard input which is the\
    \ output of the filter command, and last the footer.txt file. The special meaning\
    \ of the hyphen as a command-line argument to refer to the standard input or standard\
    \ output is a misconception that has crept into many programs. There might also\
    \ be problems when specifying hyphen as the first argument, since it might be\
    \ interpreted as an option to the preceding command. Using /dev/fd allows for\
    \ uniformity and prevents confusion:\n\n```bash\nmichel > filter body.txt.gz cat\
    \ header.txt /dev/fd/0 footer.txt | 1p\n```\n\nIn this clean example, all output\
    \ is additionally piped through lp to send it to the default printer.\n"
