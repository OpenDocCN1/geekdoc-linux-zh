    echo backup succeeded > /home/franky/log/home_backup.log\n```\n\n首先，如果你每次需要都手动命名文件和目录，就更容易出错。其次，假设\
    \ franky 想把这个脚本给 carol，那么 carol 在使用该脚本备份她的家目录之前将必须进行一些编辑。如果 franky 想用此脚本备份其他目录，情况也是如此。为了循环使用，将所有文件、目录、用户名、服务器名等都变为变量。这样，你只需要编辑一次值，而不需要遍历整个脚本来检查参数出现在哪里。这是一个示例：\n\
    \n```bash\n#!/bin/bash\n# 此脚本对我的家目录备份。\n# 修改变量的值以使脚本适用于你的环境：\nBACKUPDIR=/franky\n\
    TARFILE=/var/home/franky.tar\nBZIPFILE=/var/home/franky.tar.bz2\nSERVER=bordeaux\n\
    REMOTEDIR=/opt/backup/franky\nLOGFILE=/home/franky/log/home_backup.log\ncd $BACKUPDIR\n\
    # 创建归包\ntar cf $TARFILE $BACKUPFILES /dev/null 2>&1\n# 首先删除旧的 bzip2 文件。重定向错误，因为如果归包不存在会#\
    \ 生成一些错误。然后创建一个新的压缩文件。\nrm $BZIPFILE 2 /dev/null\nbzip2 $TARFILE\n\n# 将文件拷贝到另一个主机\
    \ - 我们有 ssh 密钥来实现无干预运行。\nscp $BZIPFILE $SERVER:$REMOTEDIR /dev/null 2>&1\n\n#\
    \ 在日志文件中创建时间戳。\ndate > $LOGFILE\necho backup succeeded > $LOGFILE\n```\n\n## 大目录与低带宽\n\
    \n上述只是每个人都能理解的纯示例，使用了小目录和同一子网上的主机。根据你的带宽、目录传输情况以及远程服务器的位置，使用这种机制进行备份可能会花费大量时间。对于较大的目录，使用\
    \ rsync 来同步目录。\n\n## 3.3 引用\n\n### 3.3.1 为什么\n\n许多字符在某些上下具有特殊含义。引用可以禁用这些含义。 3.3.2\
    \ 转义字符\n\n转义字符用于禁用字符的特殊含义。反斜杠紧跟在字符后面被视为转义。如果反斜杠后面没有字符，则会被忽略。如果反斜杠紧跟在引号后面，则会被视为转义。如果反斜杠紧跟在引号内部，则会被视为转义。如果反斜杠紧跟在反引号后面，则会被视为转义。\n\
    \n 3.3.3 单引号\n\n单引号（''）用于保留引号内字符的字面值。单引号内的字符不会被 shell 解析。\n\n### 3.3.4 双引号\n\n\
    使用双引号可以保留引号内字符的字面值，但美元符号（$）和反除外。在双引号内，美元符号和反引号具有特殊含义。反斜杠在跟在美元符号或反引号时才会被转义。\n\n\
    ### 3.3.5 ANSI-C 引用\n\n$STRING 形式的字符串按照 ANSI-C 标准处理。\n\n### 3.3.6 区域语言\n\n双引号后的美元符号将根据当前的区域语言（locale）对字符串进行翻译。如果当前区域语言是\
    \ \"C\" 或 \"POSIX\"，则字符串会被替换。\n\n## 3.4 Shell 扩展\n\n在命令被拆分为标记（见 1.4 节）后，这些标记将被扩展或解析。有八种扩展类型，我们将按照扩展顺序进行讨论。在所有扩展之后，将执行引用删除。\n\
    \n### 3.4.1 大括号扩展\n\n大括号扩展是一种生成任意字符串的机制。要扩展的模式格式为可选的 PREAMBLE，后跟一对大括号内由逗号分隔的字符串，最后是可选的\
    \ POSTSCRIPT。前缀位于括号内每个字符串之前，后缀则附加每个结果字符串之后。大括号扩展可以嵌套。扩展字符串的结果不会排序；保留从左到右的顺序：\n\
    \n```\nfranky ~ echo sp{el,il,al}\nspell spall\n```\n\n大括号扩展在任何其他扩展之前执行，结果中保留其他扩展特殊的字符。它是纯文本的。Bash\
    \ 不对扩展的上下文或括号之间的文本进行任何语法解释。为了避免与参数扩展冲突，字符串 \"$$\" 不被视为大括号扩展。格式正确的括号扩展必须包含未引号的大括号和至少一个未引号的逗号。任何格式错误的括号扩展将保持不变。\n\
    \n### 3.4.2 波浪号扩展\n\n如果单词以未引号的波浪号（~）开头，则到第一个未引号的反斜杠（如果没有斜杠则到所有字符）为止的所有视为波浪号前缀。如果波浪号前缀中没有任何字符被引用，则斜杠后面的字符被视为可能的登录名。如果此登录名为空字符串，波浪号将被替换为\
    \ HOME 变量的值。如果 HOME 未设置，则替换执行 shell 的用户的家目录。否则，波浪号前缀将被替换为指定登录名相关的家目录。如果波浪号前缀是\
    \ \"~+\"，则 shell 变量 PWD 的值替换波浪号前缀。如果波浪号前缀是 \"~-\"，如果变量 OLDPWD 已设置，\n\n"
