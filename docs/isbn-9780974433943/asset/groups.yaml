- md: "\n## 9.7 The shift built-in\n\nThe **shift** command is one of the Bourne shell\
    \ built-ins that comes with Bash. The command takes one argument, a number. The\
    \ positional parameters are shifted to the left by this number, N. The positional\
    \ parameters from N+1 to ## are renamed to variable names from $1 to ##-N+1.\n\
    \nSay you have a command that takes 10 arguments, and N is 4, then $4 becomes\
    \ $1, $5 becomes $2 and so on. $10 becomes $7 and the original $1, $2 and $3 are\
    \ thrown away.\n\nIf N is zero or greater than ## (the total number of arguments;\
    \ see Section 7.2). If N is not present, it is assumed to be 1. The return status\
    \ is zero unless N is greater than ## or less zero; otherwise it is non-zero.\n\
    \n### 9.7.1 Examples\n\nA shift is typically used when the number of arguments\
    \ to a command is not known in advance, for instance when users can give as many\
    \ arguments as they like. In such cases, the arguments are usually processed in\
    \ a **while** loop with a test condition of (($ $#)). This condition is true as\
    \ long as the number of arguments is greater than zero. The $1 variable and the\
    \ **shift** statement process each argument. The number of arguments is reduced\
    \ each time **shift** is executed and eventually becomes zero, upon which the\
    \ loop exits.\n\nThe example below, cleanup.sh, uses **shift** statements to process\
    \ each file in the list generated by **find**:\n\n```bash\n#!/bin/bash\n\n# This\
    \ script can clean up files that were last accessed over 365 days ago.\nUSAGE=\"\
    Usage: $0 dir1 dir2 dir3 ... dirN\"\n\nif [ \"$#\" = \"0\" ]; then\n  echo \"\
    $USAGE\"\n  exit 1\nfi\n\nwhile [ \"$#\" -gt 0 ]; do\n  if [ \"$1\" = \"\" ];\
    \ then\n    echo \"Empty directory, nothing to be done.\"\n```\n```bash\n  else\n\
    \    find $1 -type f -atime +365 -exec rm -i {} \\;\n  fi\n\n  shift\ndone\n```\n\
    \nIn the next example, we modified the script from Section 8.2.3 so that it accepts\
    \ multiple packages to install at once:\n\n```bash\n#!/bin/bash\nif [ $1 -lt 1\
    \ ]; then\n    echo \"Usage: $0 package(s)\"\n    exit 1\nfi\nwhile (($#)); do\n\
    \    yum install $1 << CONFIRM\ny\nCONFIRM\n    shift\ndone\n```\n\n## 9.8 Summary\n\
    \nIn this chapter, we discussed how repetitive commands can be incorporated in\
    \ loop constructs. Most common loops are built using the for, while or until statements,\
    \ or a combination of these commands. The for loop executes a defined number of\
    \ times. If you don't know how many times a command should execute, use either\
    \ until or while to specify when the loop should end.\n\nLoops can be interrupted\
    \ or reiterated using the break and continue statements.\n\nA file can be used\
    \ as input for a loop using the input redirection operator, loops can also read\
    \ output from commands that is fed into the loop using a pipe.\n\nThe select construct\
    \ is used for printing menus in interactive scripts. Looping through the command\
    \ line arguments to a script can be done using the shift statement.\n\n## 9.9\
    \ Exercises\n\nRemember: when building scripts, work in steps and test each step\
    \ before incorporating it in your script.\n\n- 1. Create a script that will take\
    \ a (recursive) copy of files in /etc so that a beginning system administrator\
    \ can edit files without fear.\n- 2. Write a script that takes exactly one argument,\
    \ a directory name. If the number of arguments is more or less than one, print\
    \ a usage message. If the argument is not a directory, print another message.\
    \ For the given directory, print the five biggest files and the five files that\
    \ were most recently modified.\n- 3. Can you explain why it is so important to\
    \ put the variables in between double quotes in the example from Section 9.4.1?\n\
    - 4. Write a script similar to the one in Section 9.5, but think of a way of quitting\
    \ after the user has executed 3 loops.\n- 5. Think of a better solution move -b\
    \ for the script from Section 9.5.1 to prevent overwriting of existing files.\
    \ For instance, test whether or not a file exists. Don’t do unnecessary work!\n\
    - 6. Rewrite the whichdaemon.sh script from Section 7.5, so that it:\n    - Prints\
    \ a list of servers to check, such as Apache, the SSH server, the NTP daemon,\
    \ a name daemon, power management daemon, and so on.\n    - For each choice the\
    \ user can make, print some sensible information, like the name of the web server,\
    \ NTP trace information, and so on.\n    - Optionally, build in a possibility\
    \ for users to check other servers than the ones listed. For such cases, check\
    \ that at least the given process is running.\n    - Review the script from Section\
    \ 9.2.1. Note how character input other than q is processed. Rebuild this script\
    \ so that it prints a message if characters are given as input.\n\n## Chapter\
    \ 10\n\n## More on variables\n\nIn this chapter, we will discuss the advanced\
    \ use of variables and arguments. Upon completion, you will be able to:\n\n- Declare\
    \ and use an array of variables\n- Specify the sort of variable you want to use\n\
    - Make variables read-only\n- Use set to assign a value to a variable\n\n## 10.1\
    \ Types of variables\n\nAs we already saw, Bash understands many different kinds\
    \ of variables or parameters. Thus far, we haven't bothered much with what kind\
    \ of variables we assigned, so our variables could hold any value that we assigned\
    \ to them. A simple command line example demonstrates this:\n\n```bash\nVARIABLE=12\n\
    echo $VARIABLE 12\nVARIABLE=string\necho $VARIABLE string\n```\n\nThere are cases\
    \ when you want to avoid this kind of behavior, for instance when handling telephone\
    \ and other numbers. Apart from integers and variables, you may also want to specify\
    \ a variable that is a constant. This is often done at the beginning of a script,\
    \ when the value of the constant is declared. After that, there are only references\
    \ to the constant variable name, so that when the constant needs to be changed,\
    \ it has to be done once. A variable may also be a series of variables of any\
    \ type, a so-called array of variables (VAR1, VAR2, ... VARN).\n\n### 10.1.1 Using\
    \ the declare built-in\n\nUsing a declare statement, we can limit the value assignment\
    \ to variables.\n\nThe syntax for declare(s) is the following:\n\n```\ndeclare\
    \ OPTION(s) VARIABLE=value\n```\n\nThe following options are used to determine\
    \ the type of data the variable can hold and to assign attributes:\n\nTable 10.1:\
    \ Options to the declare built-in\n\n| Option | Meaning |\n| :--- | :--- |\n|\
    \ -a | Variable is an array. |\n| -f | Use functions only. |\n| -i | The variable\
    \ is treated as an integer; arithmetic evaluation is performed when the variable\
    \ is assigned a value (see 3.4.5). |\n| -p | Display the attributes and values\
    \ of each variable. When -p is used, additional options are ignored. |\n\n###\
    \ 10.1 Types of variables\n\nMake variables read-only. These variables cannot\
    \ be assigned by subsequent assignment statements, nor can they be unset.\n\n\
    Give each variable the trace attribute.\n\nMark each variable for export to subsequent\
    \ commands via the environment.\n\nUsing instead of - turns off the attribute\
    \ instead. When used in a function, declare creates local variables.\n\nThe following\
    \ example shows how assignment of a type to a variable influences the value.\n\
    \n```bash\nbob in ] declare -i VARIABLE=12\nbob in ] VARIABLE=string\nbob in ]\
    \ echo $VARIABLE\nbob in ] declare -p VARIABLE\ndeclare -i VARIABLE=\"\"\n```\n\
    \nNote that Bash has an option to declare a numeric value, but none for declaring\
    \ string values. This is because, by default, if no specifications are given,\
    \ a variable can hold any type of data:\n\n```bash\nbob in ] OTHERVAR=blah\nbob\
    \ in ] declare -p OTHERVAR\ndeclare -- OTHERVAR=\"blah\"\n```\n\nAs soon as you\
    \ restrict assignment of values to a variable, it can only hold that type of data.\
