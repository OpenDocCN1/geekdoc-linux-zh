    # Chapter 1: Bash and Bash scripts


    # 1.5 Developing good scripts


    This guide is mainly about the last shell building block, scripts. Some general
    considerations before we continue:


    +   1. A script should run without errors.

    2. It should perform the task for which it is intended.

    3. Program logic is clearly defined and apparent.

    4. A script does not do unnecessary work.

    5. Scripts should be reusable.


    # 1.5.1 Structure


    The structure of a shell script is very flexible. Even though in Bash a lot of
    freedom is granted, you must ensure correct logic, flow control and efficiency
    so that users executing the script can do so easily and correctly.


    When starting on a new script, ask yourself the following questions:


    +   * Will I be needing information from the user or from the user’s environment?

    * How will I store that information?

    * Are there any files that need to be created? Where and with which permissions
    and ownerships?

    * What commands will I use? When using the script on different systems, do all
    these systems have these commands in the required versions?

    * Does the user need any notifications? When and why?


    # 1.5.2 Terminology


    The table below gives an overview of programming terms that you need to be familiar
    with:


    Table 1.1: Overview of programming terms


    | Term | What is it? |

    |---|---|n| Command control | Testing status of a command in order to determine
    whether a portion of the program should be executed. |

    | Conditional branch | Logical point in the program when a condition determines
    what happens next. |

    | Logic flow | The overall design of the program. Determines logical sequence
    of tasks so that the result is successful and controlled. |'
