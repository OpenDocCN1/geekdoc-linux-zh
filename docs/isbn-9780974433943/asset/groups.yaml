    $friends\"\n        echo \"你已加入 Michel 的朋友列表。非常感谢！\"\n    else\n        echo \"\
    你已加入 Michel 的朋友列表。\"\n        exit 1\n    fi\nfi\n\nmichel \"/test> cp friends.sh\
    \ /var/tmp; cd /var/tmp\nmichel \"/test> touch friends; chmod +w friends\nmichel\
    \ \"/test> friends.sh\nHello, michel. 这个脚本将你注册到 Michel 的朋友数据库中。\n输入你的名字并按 [ENTER]:\
    \ michel\n输入你的性别并按 [ENTER]: :m\n你已加入 Michel 的朋友列表。\n\nmichel \"/test> cat friends\"\
    \n```\n\n注意，这里没有省略任何输出。脚本只存储 Michel 感兴趣的人，但除非你已经在列表中，否则它总是会说你已加入列表。\n\n其他人现在开始执行该脚本了：\n\
    \n```bash\n[anny@octarine tmp]$ friends.sh\nHello, anny. 这个脚本将你注册到 Michel 的朋友数据库中。\n\
    输入你的名字并按 [ENTER]: anny\n输入你的性别并按 [ENTER]: f\n你多大了? 22\n你的头发是什么颜色的? black\n你已加入\
    \ Michel 的朋友列表。\n```\n\n过了一段时间，朋友列表开始像这样：\n\n```\ntitle 24 black\nanny 22 black\n\
    katya 22 blonde\nmaria 21 black\n--output omitted-\n```\n\n当然，这种情况并不理想，因为每个人都可以编辑（但不能删除）Michel\
    \ 的文件。你可以使用脚本文件上的特殊访问模式来解决这个问题；请参阅《Linux 入门》第 4 章中的“SUID 和 SGID”，<http://tille.soti.org/training/tldp>。\n\
    \n## 8.2.2 重定向和文件描述符\n\n正如你在基础 shell 使用中所知的，命令的输入和输出可以在执行之前使用特殊的符号——重定向运算符进行重定向，由\
    \ shell 解释。重定向也可以用于为当前 shell 执行环境打开和关闭文件。\n\n重定向也可以发生在脚本中，以便它可以从文件接收输入，或者将输出发送到文件。稍后，用户可以查看输出文件，或者它可以被另一个脚本作为输入。\n\
    \n文件的输入和输出是通过整数句柄实现的，这些句柄跟踪给定进程的所有打开文件。这些数值被称为文件描述符。最为人知的文件描述符是 stdin、stdout 和\
    \ stderr，对应的文件描述符数字分别为 0、1 和 2。这些数字和相应的设备是被保留的。Bash 还可以网络主机上的 TCP 或 UDP 端口作为文件描述符。\n\
    \n下面的输出显示了预留的文件描述符指向实际设备：\n\n```bash\nmichel > ls -1 /dev/std*\nlrwxxrwx root\
    \ root root   17 Oct 07:46 /dev/stderr -> .. /proc/self/fd/2\nlrwxxrwx root root\
    \ root   17 Oct 07:46 /dev/stdin -> .. /proc/self/fd/0\nlrwxxrwx root root root\
    \   17 Oct 07:46 /dev/stdout -> .. /proc/self/fd/1\n```\n\n```bash\nmichel > ls\
    \ -1 /proc/self/fd/[0-2]\nlrwx------ 1 michel 64 Jan 23 12:11 /proc/self/fd/0\
    \ -> /dev/pts/6\nlrwx------ 1 michel 64 Jan 23 12:11 /proc/self/fd/1 -> /dev/pts/6\n\
    lrwx------ 1 michel 64 Jan 23 12:11 /proc/self/fd/2 -> /dev/pts/6\n```\n\n你可能想检查\
    \ `info MAKEDEV` 和 `info proc` 以获取有关 `/proc` 子目录以及系统处理每个运行进程的标准文件描述符方式的信息。\n\n\
    当你从命令行运行脚本时，没有任何变化，因为子 shell 进程将使用与父进程相同的文件描述符。在没有父进程的情况下（例如使用 cron 功能运行脚本时），除非使用了某种形式的重定向，否则标准描述符是管道或其他（临时）文件。下面的示例演示了这一点，显示了来自\
    \ at 脚本的输出：\n\n```bash\nmichel > date\nFri Jan 24 11:05:50 2023\n\nmichel > at\
    \ now + 1 minute\nwarning: commands will be executed (in order)\nshell: /bin/sh\n\
    at > ls -1 /proc/self/fd/ > /var/tmp/fdtest.at\nat > 2023-01-24 11:07\n\nmichel\
    \ > cat /var/tmp/fdtest.at\ntotal 0\nl------- 1 michel 64 Jan 24 11:07 0 -> /var/spool/a/a00001\n\
    l------- 1 michel 64 Jan 24 11:07 1 -> /var/tmp/fdtest.at\nl------- 1 michel 64\
    \ Jan 24 11:07 2 -> /var/spool/a/a00002\nl------- 1 michel 64 Jan 24 11:07 3 ->\
    \ /proc/self/fd\n```\n\n以及使用 cron：\n\n```bash\nmichel > crontab -1\n# DO NOT EDIT\
    \ THIS FILE - edit the master instead.\n0 * * * installed on Fri Jan 24 11:30\
    \ 2023\n2 * * * ls -1 /proc/self/fd/ > /var/tmp/fdtest.cron\n```\n\n## 第 8 章：编写交互式脚本\n\
    \n```bash\nmichel > cat /var/tmp/fdtest.cron\ntotal 0\nlr-x-- 1 michel 64 Jan\
    \ 24 11:07 0 -> pipe:[1234/444]\nlr-x-- 1 michel 64 Jan 24 11:07 1 -> /var/tmp/fdtest.cron\n\
    lr-x-- 1 michel 64 Jan 24 11:07 2 -> pipe:[1234/441]\nlr-x-- 1 michel 64 Jan 24\
    \ 11:07 3 -> /proc/self/fd\n```\n\n## 错误的重定向\n\n从之前的示例可以清楚，你可以为脚本提供输入和输出文件（见 8.2.3），但有些人倾向于忘记重定向可能需要的错误输出。此外，如果你足够幸运，错误将通过邮件发送给你并显示失败情况。如果你不幸，错误将导致你的脚本失败且不会被捕获或发送到任何地方，因此你无法开始调试。\n\
    \n在重定向错误时，注意重定向的顺序很重要。例如，在 `/var/spool` 中发出的此命令：\n\n```bash\nls -l 2 > /var/tmp/inaccessible-in-spool\n\
    ```\n\n会将 ls 命令的输出重定向到 `/var/tmp` 中的 `inaccessible-in-spool` 文件。命令：\n\n```bash\n\
    ls -l * 2 > /var/tmp/spoollist 2>&\n```\n\n会将标准输入和错误都指向 `spoollist` 文件。命令：\n\n\
    ```bash\nls -l * 2>& /var/tmp/spoollist\n```\n\n只将标准输出重定向到目标文件，因为标准错误被复制到标准输出。为了方便，如果确定不需要，错误通常重定向到\
    \ `/dev/null`。在你的系统启动脚本可以找到数百个示例。\n\nBash 允许将标准输出和错误都重定向到 `FILE` 扩展结果的文件：\n\n\
    ```bash\n&> FILE\n```\n\n这等于上组示例中使用的 `> FILE 2>&1`。它也与重定向到 `/dev/null` ，例如当你只想让命令执行，无论它产生什么输出或错误。\n\
    \n## 8.2.3 文件输入和输出\n\n有几种不同的方法从你的 Bash 脚本读取和写入文件。\n\n### 使用 /dev/fd\n\n`/dev/fd`\
    \ 目录包含名为 0、1、2 等的条目。打开文件 `/dev/fd/N` 等于复制文件描述符 N。如果你的系统提供了 `/dev/stdin`、`/dev/stdout`\
    \ 和 `/dev/stderr`你会发现它们分别等于 `/dev/fd/0`、`/dev/fd/1` 和 `/dev/fd/2`。\n\n`/dev/fd`\
    \ 文件的主要用途是在 shell 中。这种机制允许程序使用路径参数以与其他路径相同的方式处理标准输入和输出。如果系统中没有 `/dev/fd`，你必须找到一种绕过问题的方法。例如，可以使用连字符\
    \ (-) 表示程序应该从管道读取。一个示例：\n\n```bash\nmichel > body.txt.gz | cat header.txt footer.txt\n\
    文本在每个打印任务开始时打印，并感谢系统管理员设置了如此优秀的打印基础设施。\n```\n\n待过滤的文本。\n\n这段文本在每个打印任务结束时打印。\n\n\
    cat 首先读取 `header.txt` 文件，接着是它的标准输入（即过滤命令的输出），最后是 `footer.txt` 文件。连字符作为指向标准输入或标准输出的命令行参数的特殊含义是一个早已进入许多程序的误解。在指定连字符作为第一个参数时也可能出现问题，因为它可能被解释为前一个命令的选项。使用\
    \ `/dev/fd` 可以实现统一性并防止混淆：\n\n```bash\nmichel > filter body.txt.gz cat header.txt\
    \ /dev/fd/0 footer.txt | 1p\n```\n\n在这个清晰的示例中，所有输出额外通过 `lp` 管道发送到默认打印机。\n\n"
