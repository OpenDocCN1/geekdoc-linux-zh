    # Chapter 11: Functions


    # 11.1 What are functions?


    Shell functions are a way to group commands for later execution, using a single
    name for this group, or routine. The name of the routine must be unique within
    the shell or script. All commands that make up a function are executed like regular
    commands. When calling on a function as a simple command name, the list of commands
    associated with that function name is executed. A function is executed within
    the shell in which it has been declared: no new process is created to interpret
    the commands.


    Special built-in commands are found before shell functions during during command
    lookup. The special built-ins are: break, ;, continue, eval, exec, exit, export,
    readonly, return, set, shift, trap and unset.


    # 11.1.1 Function syntax


    Functions either use the syntax


    ```

    function FUNCTION { COMMANDS; }

    ```


    or


    ```

    FUNCTION () { COMMANDS; }

    ```


    Both define a shell function FUNCTION. The use of the built-in command function
    is optional; however, if it is not used, parentheses are needed.


    The commands listed between curly braces make up the body of the function. These
    commands are executed whenever FUNCTION is specified as the name of a command.
    The exit status is the exit status of the last command executed in the body.


    # Common mistakes


    > The curly braces must be separated from the body by spaces, otherwise they are
    interpreted in the wrong way.


    > The body of a function should end in a semicolon or a newline.


    # 11.1.2 Positional parameters in functions


    Functions are like mini-scripts: they can accept parameters, they can use variables
    only known within the function (using the local shell built-in) and they can return
    values to the calling shell.


    A function also has a system for interpreting positional parameters. However,
    the positional parameters passed to a function are not the same as the ones passed
    to'
