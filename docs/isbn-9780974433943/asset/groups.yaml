    or a nine at the beginning of a word, followed by one other number and a percentage
    sign. An end message is added.


    ![](img/2e4e7136355955151bf53454bf90e936_108_0.png)


    Awk is a programming language. Its syntax is recognized by most editors that can
    do syntax highlighting for other languages, such as C, Bash, HTML, etc.


    ## 6.3 Gawk variables


    As awk is processing the input file, it uses several variables. Some are editable,
    some are read-only.


    ### 6.3.1 The input field separator


    The field separator, which is either a single character or a regular expression,
    controls the way awk splits up an input record into fields. The input record is
    scanned for character sequences that match the separator definition; the fields
    themselves are the text between the matches.


    The field separator is represented by the built-in variable FS. Note that this
    is something different from the IFS variable used by POSIX-compliant shells.


    The value of the field separator can be changed in the awk program with the assignment
    operator =. Often the right time to do this is at the beginning of execution before
    any input has been processed, so that the very first record is read with the proper
    separator. To do this, use the special BEGIN pattern.


