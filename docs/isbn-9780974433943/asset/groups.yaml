    # 3.4.5 Arithmetic expansion


    Arithmetic expansion allows the evaluation of an arithmetic expression and the
    substitution of the result. The format for arithmetic expansion is:


    ```

    $(( EXPRESSION ))

    ```


    The expression is treated as if it were within double quotes, but a double quote
    inside the parentheses is not treated specially. All tokens in the expression
    undergo parameter expansion, command substitution, and quote removal. Arithmetic
    substitutions may be nested.


    Evaluation of arithmetic expressions is done in fixed-width integers with no check
    for overflow - although division by zero is trapped and recognized as an error.
    The operators are the same as in the C programming language. In order of decreasing
    precedence, the list looks like this:


