    <entry>Meaning</entry>\n<entry>\nvery long line\n</entry>\n</row>\n<row>\n<entry>meaning</entry>\n\
    <entry>\nlong line\n</entry>\n</row>\n<row>\n<entry>othermmeaning</entry>\n<entry>\n\
