    # The continue built-in


    The continue statement resumes iteration of an enclosing for, while, until or
    select loop.


    When used in a for loop, the controlling variable takes on the value of the next
    element in the list. When used in a while or until construct, on the other hand,
    execution resumes with TEST-COMMAND at the top of the loop.


    # 9.5.1 Examples


    In following example, file names are converted to lower case. If no conversion
    needs to be done, a continue statement restarts execution of the loop. These commands
    don''t eat system resources, and most likely, similar problems can be solved using
    sed and awk. However, it is useful to know about this kind of construction when
    executing heavy jobs, that might not even be necessary when tests are inserted
    at the correct locations in a script, sparing system resources.


