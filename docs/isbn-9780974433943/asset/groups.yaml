    \ 是：重复第 1 步。\n  - (b) 如果否：跳转到第 3 步。\n- 3. 退出\n\n# 第 1 章：Bash 与 Bash 脚本\n\n## 1.5.4\
    \ 示例脚本：mysystem.sh\n\n下面的 mysystem.sh 脚本执行了一些常用命令（date, w, uptime）来显示关于你和你的机器的信息。\n\
    \n```\ntom:> cat -n mysystem.sh\n1 #!/bin/bash\n2 clear\n3 echo \"This is information\
    \ provided by mysystem.sh. Program starts now.\"\n4\n5 echo \"Hello, $USER\"\n\
    6 echo\n7\n8 echo \"Today's date is $(date), this is week $(date +%U)\"\n9 echo\n\
    10\n11 echo \"These users are currently connected:\"\n12 w | cut -d \" -f 1 |\
    \ grep USER | sort -u\n13 echo\n14\n15 echo \"This is $(uname -s) running on a\
    \ $(uname -m) processor.\"\n16 echo\n17\n18 echo \"This is the uptime information:\"\
    \n19 uptime\n20 echo\n21\n22 echo \"That's all folks!\"\n```\n\necho 和 printf\
    \ 都是 Bash 内置命令。前者总是以 0 状态退出，并简单地打印参数后跟换行符到标准输出；而后者允许定义格式化字符串并在失败时给出非零退出状态码。\n\n"
