- md: "\n## Chapter 9: Repetitive tasks\n\n9.2 shows an improved picturesort.sh script\
    \ (see Section 9.2.1), tests for available disk space. If not enough disk space\
    \ is available the script moves pictures from the previous months.\n\nNote the\
    \ initialization of the HOUR and DISKFULL variables and the use of options with\
    \ -is and date in order to obtain a correct listing for TOREMOVE.\n\n## 9.4 I/O\
    \ redirection and loops\n\nInstead of controlling a loop by testing the result\
    \ of a command or by user input, you can specify a file from which to read input\
    \ that controls the loop. In such cases, read is often the controlling command.\
    \ As long as input lines are fed into the loop, execution of the loop commands\
    \ continues. As soon as the input lines end, the loop exits.\n\nSince the loop\
    \ is considered to be one command structure (such as while TEST-COMMAND; do CONSEQUENT-COMMANDS;\
    \ done), the redirection should occur after the done statement, so that it completes\
    \ with the form\n\n```bash\ncommand < file\n```\n\nThis kind of redirection also\
    \ works with other kinds of loops.\n\n## 9.4.1 Output redirection\n\nIn the example\
    \ below, output of the find command is used as input for the read command controlling\
    \ a while loop:\n\n```bash\ncarol@octarine ~/testdir) cat archiveoldstuff.sh\n\
    #!/bin/bash\n\n# This script creates a subdirectory in the current directory,\
    \ to which\n# old files are moved.\n# Might be something for cron (if slightly\
    \ adapted) to execute weekly or\n# monthly.\nARCHIVER='date +%Y%m%d'\nDESTDIR=\"\
    $PWD/archive-$ARCHIVER\"\n\nmkdir $DESTDIR\n\nfind $PWD -type f -a -mtime +5 |\
    \ while read file\ndo\n  gzip \"$file\"; mv \"$file\".gz \"$DESTDIR\"\n  echo\
    \ \"$file archived\"\ndone\n```\n\nFiles are compressed before they are moved\
    \ into the archive directory.\n\n## 9.5 Break and continue\n\n### The break built-in\n\
    \nThe break statement is used to exit the current loop before its normal ending.\
    \ This is done when you don't know in advance how many times the loop will have\
    \ to execute, for instance because it is dependent on user input.\n\nThe example\
    \ below demonstrates a while loop that can be interrupted. This is a slightly\
    \ improved version of the wisdom.sh script from Section 9.2.1.\n\n```bash\n#!/bin/bash\n\
    \n# This script provides wisdom\n# You can now exit in a decent way.\n\nFORTUNE=/usr/games/fortune\n\
    \nwhile true; do\n  echo \"On which topic do you want advice?\"\n  echo \"1. politics\"\
    \n  echo \"2. startrek\"\n  echo \"3. kernelnewbies\"\n  echo \"4. sports\"\n\
    \  echo \"5. bofh-excuses\"\n  echo \"6. magic\"\n  echo \"7. love\"\n  echo \"\
    8. literature\"\n  echo \"9. drugs\"\n  echo \"10. education\"\n  echo\n\n  echo\
    \ -n \"Enter your choice, or 0 for exit: \"\n  read choice\n  echo\n\n  case $choice\
    \ in\n    1)\n      $FORTUNE politics\n      ;;\n    2)\n      $FORTUNE startrek\n\
    \      ;;\n    3)\n      $FORTUNE kernelnewbies\n      ;;\n    4)\n      echo\
    \ \"Sports are a waste of time, energy and money.\"\n      echo \"Go back to your\
    \ keyboard.\"\n      echo -e \"\\t\\t\\t\\t -- \\\"Unhealthy is my middle name\\\
    \" Soggie\"\n      ;;\n    5)\n      $FORTUNE bofh-excuses\n      ;;\n    6)\n\
    \      $FORTUNE magic\n      ;;\n    7)\n      $FORTUNE love\n      ;;\n    8)\n\
    \      $FORTUNE literature\n      ;;\n    9)\n      $FORTUNE drugs\n      ;;\n\
    \    10)\n      $FORTUNE education\n      ;;\n    0)\n      echo \"OK, see you\"\
    \n      break\n      ;;\n    *)\n      echo \"That is not a valid choice, try\
    \ a number from 0 to 10.\"\n      ;;\n  esac\ndone\n```\n\nMind that break exits\
    \ the loop, not the script. This can be demonstrated by adding an echo command\
    \ at the end of the script. This echo will also be executed upon input that causes\
    \ break to be executed (when the user types \"0\").\n\nIn nested loops, break\
    \ allows for specification of which loop to exit. See the Bash info pages for\
    \ more.\n\n### The continue built-in\n\nThe continue statement resumes iteration\
    \ of an enclosing for, while, until or select loop.\n\nWhen used in a for loop,\
    \ the controlling variable takes on the value of the next element in the list.\
    \ When used in a while or until construct, on the other hand, execution resumes\
    \ with TEST-COMMAND at the top of the loop.\n\n## 9.5.1 Examples\n\nIn following\
    \ example, file names are converted to lower case. If no conversion needs to be\
    \ done, a continue statement restarts execution of the loop. These commands don't\
    \ eat system resources, and most likely, similar problems can be solved using\
    \ sed and awk. However, it is useful to know about this kind of construction when\
    \ executing heavy jobs, that might not even be necessary when tests are inserted\
    \ at the correct locations in a script, sparing system resources.\n\n```bash\n\
    carol@octarine \"/test\" cat tolower.sh\n#!/bin/bash\n\n# This script converts\
    \ all file names containing upper case characters\n# file names containing only\
    \ lower case.\n\nLIST=$(ls)\n\nfor name in \"$LIST\"; do\n  if [[ \"$name\" !=\
    \ *([[:upper:]])* ]]; then\n    continue\n  fi\n  ORIG=\"$name\"\n  NEW=$(echo\
    \ $name | tr 'A-Z' 'a-z')\n  mv \"$ORIG\" \"$NEW\"\n  echo \"new name for $ORIG\
    \ is $NEW\"\ndone\n```\n\nThis script has at least one disadvantage: it overwrites\
    \ existing files. The no-clobber option to Bash is only useful when redirection\
    \ occurs. The -b option to the mv command provides more security, but is only\
    \ safe in case of accidental overwrite, as is demonstrated in this test:\n\n```bash\n\
    carol@octarine \"/test\" rm *\ncarol@octarine \"/test\" touch test Test TEST\n\
    \ncarol@octarine \"/test\" bash -x tolower.sh\n++ ls\n+ LIST=test\nTest\nTEST\n\
    + [[ test != *([[:upper:]])* ]]\n  + continue\n  + [[ Test != *([[:upper:]])*\
    \ ]]\n+ ORIG=Test\n++ echo Test\n++ tr A-Z a-z\n++ NEW=test\n+ mv -b Test test\n\
    + echo 'new name for Test is test'\nnew name for Test is test\n+ [[ TEST != *([[:upper:]])*\
    \ ]]\n+ ORIG=Test\n++ echo Test\n++ tr A-Z a-z\n++ NEW=test\n+ mv -b Test test\n\
    ```\n\n## 9.6 Making menus with the select built-in\n\nThe select construct allows\
    \ easy menu generation. The syntax is quite similar to that of for:\n\n```bash\n\
    select item in LIST; do\n```\n\nThe select statement displays a list of items.\
    \ The PS3 variable controls the prompt. If the user selects a number, WORD is\
    \ set to the name of that item. If the line is empty, the PS3 prompt is displayed\
    \ again. If an EOF (End Of File) character is read, the loop exits. Since most\
    \ users don't have a clue which combination is used for EOF, it is more user-friendly\
    \ to have a break command as one of the items. The read line is saved in REPLY\
    \ variable.\n\nThis is a simple example, but as you can see, it is not very user-friendly:\n\
    \n```bash\ncarol@octarine testdir] cat private.sh\n#!/bin/bash\n\necho \"This\
    \ script can make any of the files in this directory private.\"\necho \"The number\
    \ of the file you want to protect:\"\n\nselect FILENAME in *;\ndo\necho \"You\
    \ picked $FILENAME ($REPLY)\"\nchmod go-wx \"$FILENAME\"\ndone\n```\n\nSetting\
    \ the PS3 prompt and adding a possibility to quit makes it better:\n\n```bash\n\
    #!/bin/bash\n\necho \"This script can make any of the files in this directory\
    \ private.\necho \"Enter the number of the file you want to protect:\"\n\nPS3=Your\
    \ choice: \"\nQUIT=\"QUIT THIS PROGRAM - I feel safe now.\"\ntouch \"SQUIT\"\n\
    \nselect FILENAME in *;\ndo\ncase $FILENAME in\n    \"$QUIT\")\n        echo \"\
    Exiting.\"\n        break\n        :;\n    *)\n        echo \"You picked $FILENAME\
    \ ($REPLY)\"\n        chmod go-wx \"$FILENAME\"\n        :;\nesac\ndone\nrm \"\
    SQUIT\"\n```\n\n### 9.6.1 Submenus\n\nAny statement within a select construct\
    \ can be another select loop, enabling (a) submenu(s) within a menu.\n\nBy default,\
    \ the PS3 variable is not changed when entering a nested select loop. If you want\
    \ a different prompt in the submenu, be sure to set it at the appropriate time(s).\n"
  mdcn: "\n\n## 第 9 章：重复性任务\n\n9.2 显示了一个改进后的 `picturesort.sh` 脚本（见第 9.2.1 节），它可以测试可用磁盘空间。如果磁盘空间不足，脚本将移动上几个月的文件。\n\
    \n注意 `HOUR` 和 `DISKFULL` 变量的初始化，以及使用 `-is` 选项和 `date` 命令来为 `TOREMOVE` 获取正确的列表。\n\
    \n## 9.4 I/O 重定向与循环\n\n与其通过测试命令结果或用户输入来控制循环，你也可以指定一个从该文件中读取输入来控制循环。在这种情况下，`read`\
    \ 通常是控制命令。只要输入行不断送入循环中，循环命令的执行就会持续进行。一旦输入行结束，循环就会退出。\n\n由于循环被视为一个命令结构（例如 `while\
    \ TEST-COMMAND; do CONSEQUENT-COMMANDS; done`），因此重定向应该发生在 `done` 语句之后，以便它以如下形式完成：\n\
    \n```bash\ncommand < file\n```\n\n这种重定向也适用于其他类型的循环。\n\n## 9.4.1 输出重定向\n\n在下面的示例中，`find`\
    \ 命令的输出被用作控制 `while` 循环的 `read` 命令的输入：\n\n```bash\ncarol@octarine ~/testdir) cat\
    \ archiveoldstuff.sh\n#!/bin/bash\n\n# 此脚本在当前目录下创建一个子目录，并将旧文件移动到其中。\n# 可能会用于 cron（如果稍作修改）每周或每月执行一次。\n\
    ARCHIVER='date +%Y%m%d'\nDESTDIR=\"$PWD/archive-$ARCHIVER\"\n\nmkdir $DESTDIR\n\
    \nfind $PWD -type f -a -mtime +5 | while read file\ndo\n  gzip \"$file\"; mv \"\
    $file\".gz \"$DESTDIR\"\n  echo \"$file archived\"\ndone\n```\n\n文件在移动到归档目录之前会进行压缩。\n\
    \n## 9.5 Break 和 continue\n\n### break 内置命令\n\n`break` 语句用于在循环正常结束之前退出当前循环。这在你预先不知道循环需要执行多少次时使用，例如因为它依赖于用户输入。\n\
    \n下面的示例演示了一个可以中断的 `while` 循环。这是第 9.2.1 节中 `wisdom.sh` 脚本的稍微改进版本。\n\n```bash\n\
