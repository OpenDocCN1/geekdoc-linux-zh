    ## 5.3 Non-interactive editing


    There are several ways to run sed without any human interction.


    ### 5.3.1 Reading sed commands from a file


    Multiple sed commands can be put in a file and executed using the -f option. When
    creating such a file, make sure that:


    - No trailing white spaces exist at the end of lines.

    - No quotes are used.


    ### 5.3.2 Writing output


    Writing output is done using redirection: This makes sed fit for non-interactive
    use.


    ```bash

    #!/bin/bash

    # This is a simple script that converts text into HTML.

    # $1 holds the first argument, in this case the name of the file to convert.


    SCRIPT="/home/sandy/script.sed"

    NAME="$1"

    TEMPFILE="/var/tmp/sed.tmp"


    echo "converting..."

    cat $1 | sed -f $SCRIPT | sed "s/n/" > $TEMPFILE


    echo "done."

    ```


