    ## Table 3.1: Reserved Bourne shell variables


    | Variable name | Definition |

    | --- | --- |

    | CDPATH | A colon-separated list of directories used as a search path for the
    cd built-in command. |

    | HOME | The current user''s home directory; the default for the cd built-in.
    The value of this variable is also used by tilde expansion. |

    | IFS | A list of characters that separate fields; used when the shell splits
    words as part of expansion. |

    | MAIL | If this parameter is set to a file name and the MAILPATH variable is
    not set, Bash informs the user of the arrival of mail in the specified file. |

    | MAILPATH | A colon-separated list of file names which the shell periodically
    checks for new mail. |

    | OPTARG | The value of the last option argument processed by the getopts built-in.
    |

    | OPTIND | The index of the last option argument processed by the getopts built-in.
    |

    | PATH | A colon-separated list of directories in which the shell looks for commands.
    |

    | PS1 | The primary prompt string. The default value is "\s-\v\$". |

    | PS2 | The secondary prompt string. The default value is "\> " |


    ## Bash reserved variables


    These variables are set or used by Bash, but other shells do not normally treat
    them specially.


    ## Table 3.2: Reserved Bash variables


    | Variable name | Definition |

    | --- | --- |

    | auto_resume | This variable controls how the shell interacts with the user and
    job control. |

    | BASH | The full pathname used to execute the current instance of Bash. |

    | BASH_ENV | If this variable is set when Bash is invoked to execute a shell script,
    its value is expanded and used as the name of a startup file to read before executing
    the script. |

    | BASH_VERSION | The version number of the current instance of Bash. |

    | BASH_VERSINFO | A read-only array variable whose members hold version information
    for this instance of Bash. |


    ## Chapter 3: The Bash environment


    COLUMNS


    Used by the select built-in to determine the terminal width when printing selection
    lists. Automatically set upon receipt of a SIGWINCH signal.


    COMP_CWORD


    An index into ${COMP_WORDS} of the word containing the current cursor position.


    COMP_LINE


    The current command line.


    COMP_POINT


    The index of the current cursor position relative to the beginning of the current
    command.


    COMP_WORDS


    An array variable consisting of the individual words in the current command line.


    COMPREPLY


    An array variable from which Bash reads the possible completions generated by
    a shell function invoked by the programable completion facility.


    DIRSTACK


    An array variable containing the current contents of the directory stack.


    EUID


    The numeric effective user ID of the current user.


    FCEDIT


    The editor used as a default by the -e option to the fc built-in command.


    FIGNORE


    A colon-separated list of suffixes to ignore when performing file name completion.


    FUNCNAME


    The name of any currently-executing shell function.


    GLOBIGNORE


    A colon-separated list of patterns defining the set of file names to be ignored
    by file name expansion.


    GROUPS


    An array variable containing the list of groups of which the current user is a
    member.


    histchars


    Up to three characters which control history expansion, quick substitution, and
    tokenization.


    HISTCMD


    The history number, or index in the history list, of the current command.


    HISTCONTROL


    Defines whether a command is added to the history file.


    HISTFILE


    The name of the file to which the command history is saved. The default value
    is ~/.bash_history.


    HISTFILESIZE


    The maximum number of lines contained in the history file, defaults to 500.


    HISTIGNORE


    A colon-separated list of patterns used to decide which commands should be saved
    in the history list.


    HISTSIZE


    The maximum number of commands to remember on the history list, default is 500.


    HOSTFILE


    Contains the name of a file in the same format as /etc/hosts that should be read
    when the shell needs to complete a hostname.


    ## 3.2 Variables


    HOSTNAME


    The name of the current host.


    HOSTTYPE


    A string describing the machine Bash is running on.


    IGNOREEOF


    Controls the action of EOF.


    INPUTRC


    The name of the Readline initialization file.


    LANG


    Used to determine the locale.


    LC_ALL


    This variable overrides LANG.


    LC_COLLATE


    This variable determines the sorting order.


    LC_CTYPE


    This variable determines the character sets.


    LC_MESSAGES


    This variable determines the messages.


    LC_NUMERIC


    This variable determines the numeric format.


    LINENO


    The line number in the script.


    LINES


    Used by the select built-in to determine the column.


    MACHYPE


    A string describing the system.


    MAILPATH


    A colon-separated list of file names which the shell periodically checks for new
    mail.


    OLDPWD


    The previous working directory.


    PWD


    The current directory.


    RANDOM


    Each time this variable is referenced, a random integer between 0 and 32767 is
    generated.


    REPLY


    SECONDS


    The number of seconds since the shell started.


    SHELLOPTS


    A colon-separated list of enabled shell options.


    SHLVL


    Incremented each time a new instance of Bash starts.


    TMOUT


    If set to a value greater than zero, TMOUT is treated as the timeout for input.
    In an interactive shell, the value is interpreted as the number of seconds to
    wait for input after issuing the primary prompt. Bash terminates after that number
    of seconds if input does not arrive.


    UID


    The numeric, real user ID of the current user.


    PPID


    The process ID of the parent process.


    PS4


    The value of this parameter is used as a format string.


    PROMPT_COMMAND


    The command to execute before the primary prompt.


    ## 3.2.4 Special parameters


    The shell treats several parameters specially. These parameters may only be referenced;
    assignment to them is not allowed.


    ## Table 3.3: Special bash variables


    | Character | Definition |

    | --- | --- |

    | $* | Expands to the positional parameters, starting from one. When the expansion
    occurs within double quotes, it expands to a word with the value of each parameter
    separated by the first character of the IFS special variable. |

    | $@ | Expands to the positional parameters, starting from one. When the expansion
    occurs within double quotes, each parameter expands to a separate word. |

    | $# | Expands to the number of positional parameters in decimal. |

    | $? | Expands to the exit status of the most executed foreground pipeline. |

    | $- | A hyphen expands to the current option flags as specified upon shell invocation,
    by the set built-in command, or those set by the shell itself (such as the -1).
    |

    | $! | Expands to the process ID of the shell. |

    | $0 | Expands to the name of the shell or script being executed at shell startup
    and contains the absolute file name of the shell or script being executed as passed
    in the argument list. |

    | $_ | Expands to the last argument to the previous command, after expansion.
    It is also set to the full pathname of each command executed and placed in the
    environment exported to that command. When checking mail, this parameter holds
    the name of the mail file. |

