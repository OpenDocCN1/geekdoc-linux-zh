    在经过长天的搜索后，我终于找到了这个在互联网提供商运行的示例。它将 Apache 服务器配置文件分发到 Web 中的主机上：\n\n```\n#!/bin/bash\n\
    \nif [ $(whoami) != 'root' ]; then\n    echo \"Must be root to run $0\"\n    exit\
