    # Shell functions


    Shell functions are a way to group commands for later execution using a single
    name for the group. They are executed just like a “regular” command. When the
    name of the shell function is used as a simple command name, the list of commands
    associated with that function name is executed.


    Shell functions are executed in the current shell context; no new process is created
    to interpret them.


    Functions are explained in Chapter 11, “Functions”.


    # Shell parameters


    A parameter is an entity that stores values. It can be a name, a number or a special
    value. For the shell’s purpose, a variable is a parameter that stores a name.
    A variable has a value and zero or more attributes. Variables are created with
    the declare shell built-in.


    If no value is given, a variable is assigned the null string. Variables can only
    be removed with the unset built-in.


    Assigning variables is discussed in Section 3.2, advanced use of variables in
    Chapter 10, “More on variables”.


    # Shell expansions


    Shell expansion is performed after each command line has been split into tokens.
    These are the expansions performed:


    +   * Brace expansion

    * Tilde expansion

    * Parameter and variable expansion

    * Command substitution

    * Arithmetic expansion

    * Word splitting

    * Filename expansion


    We’ll discuss these expansion types in detail in Section 3.4.'
  - "[PAGE 28]\n\n# 1.4 Shell building blocks\n\nBefore a command is executed, its\
    \ input and output may be redirected using a special notation interpreted by the\
    \ shell. Redirection may also be used to open and close files for the current\
    \ shell execution environment.\n\n# Executing commands\n\nWhen executing a command,\
    \ the words that the parser has marked as variable reference assignments (preceding\
    \ the command name) and redirections are saved for later reference. Words that\
    \ are not variable assignments or redirections are expanded; the first remaining\
    \ word after expansion is taken to be the name of the command and then redirections\
    \ are performed, then strings assigned to variables are expanded. If no command\
    \ name results, variables will affect the current shell environment.\n\nAn important\
    \ part of the tasks of the shell is to search for commands. Bash does this as\
    \ follows: \n\n+   * Check whether the command contains slashes. If not, first\
    \ check with the function list to see if it contains a command by the name we\
    \ are looking for.\n* If command is not a function, check for it in the built-in\
    \ list.\n* If command is neither a function nor a built-in, look for it analyzing\
    \ the directories listed in PATH. Bash uses a hash table (data storage area in\
    \ memory) to remember the full path names of executables so extensive PATH searches\
    \ can be avoided.\n* If the search is unsuccessful, bash prints an error message\
    \ and returns an exit status of 127.\n* If the search was successful or if the\
    \ command contains slashes, the shell executes command in a separate execution\
    \ environment.\n* If execution fails because the file is not executable and not\
    \ a directory, it is assumed to be a shell script.\n\n# Shell scripts\n\nWhen\
    \ a file containing shell commands is used as the first non-option argument when\
    \ invoking Bash (without -c or -s, this will create a non-interactive shell. This\
    \ shell first searches for the script file in the current directory, then looks\
    \ in PATH if the file cannot be found."
