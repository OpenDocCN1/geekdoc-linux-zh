    # 9.4 I/O redirection and loops


    Instead of controlling a loop by testing the result of a command or by user input,
    you can specify a file from which to read input that controls the loop. In such
    cases, read is often the controlling command. As long as input lines are fed into
    the loop, execution of the loop commands continues. As soon as the input lines
    are the loop exits.


    Since the loop is considered to be one command structure (such as while TEST-COMMAND;
    do CONSEQUENT-COMMANDS; done), the redirection should occur after the done statement,
    so that it completes with the form


    command < file


    This kind of redirection also works with other kinds of loops.


    # 9.4.1 Output redirection


    In the example below, output of the find command is used as input for the read
    command controlling a while loop:


    ```

    carol/octarine ~/testdir) cat archiveoldstuff.sh

    !/bin/bash


    # This script creates a subdirectory in the current directory, to which

    # old files are moved.

    # Might be something for cron (if slightly adapted) to execute weekly or

    # monthly.

    ARCHIVER=''date +%Y%m%d''

    DESTDIR="$PWD/archive-$ARCHIVER"


    mkdir $DESTDIR


    find $PWD -type f -a -mtime +5 | while read file

    do

    gzip "$file"; mv "$file".gz "$DESTDIR"

    echo "$file archived"

    done

    ```


    Files are compressed before they are moved into the archive directory.'
