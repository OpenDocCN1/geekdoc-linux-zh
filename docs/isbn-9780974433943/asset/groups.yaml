    Better hurry with that new disk... One partition is $space % full.\"\n  ;;\n99)\n\
    \  Message=\"I'm drowning here! There's a partition at $space %!\"\n  ;;\n*)\n\
    \  Message=\"I seem to be running with a nonexistent amount of disk space...\"\
