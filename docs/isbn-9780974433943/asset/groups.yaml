    \ name.\n\n```\n[bob in ] readonly TUX=penguin\n[bob in ] TUX=Mickeysoft\nbash:\
    \ TUX: readonly variable\n```\n\n## 10.2 Array variables\n\nAn array is a variable\
    \ containing multiple values. Any variable may be used as an array. There is no\
    \ maximum limit to the size of an array, nor any requirement that member variables\
    \ be indexed or assigned contiguously. Arrays are zero-based:the first element\
    \ is indexed with the number 0.\n\nIndirect declaration is done using the following\
    \ syntax to declare a variable:\n\n```\nARRAY[INDEXNR]=value\n```\n\nThe INDEXNR\
    \ is treated as an arithmetic expression that must evaluate to a pos-itive number.\n\
    \nExplicit declaration of an array is done using the declare built-in:\n\n```\n\
    declare -a ARRAYNAME\n```\n\nA declaration with an index number will also be accepted,\
    \ but the index number will be ignored. Attributes to the array may be specified\
    \ using the declare and readonly built-ins. Attributes apply to all variables\
    \ in the array; you can't have mixed arrays.\n\nArray variables may also be created\
    \ using compound assignments in this format:\n\n```\nARRAY=(value1 value2 ...\
    \ valueN)\n```\n\nEach value is in the form of [indexnumber]=string. The index\
    \ number is op-tional. If it is supplied, index is assigned to it; otherwise the\
    \ index of the element assigned is the number of the last index that was assigned,\
    \ plus one. This format is accepted by declare as well. If no index numbers are\
    \ supplied, indexing starts at zero.\n\nAdding missing or extra members in an\
    \ array is done using the syntax:\n\n```\nARRAYNAME[indexnumber]=value\n```\n\n\
    Remember that the read built-in provides the -a option, which allows for reading\
    \ and assigning values for member variables of an array.\n\n### 10.2.1 Dereferencing\
    \ the variables in an array\n\nIn order to refer to the content of an item in\
    \ an array, use curly braces. This is necessary, as you can see from the following\
    \ example, to bypass the shell interpretation of expansion operators. If the index\
    \ number is @ or *, all members of an array are referenced.\n\n```\n[bob in ]\
    \ ARRAY=(one two three)\n[bob in ] echo ${ARRAY[*]}\none two three\n\n[bob in\
    \ ] echo $ARRAY[*]\none[*]\n\n[bob in ] echo ${ARRAY[2]}\ntree\n\n[bob in ] ARRAY[3]=four\n\
    [bob in ] echo ${ARRAY[*]}\none two three four\n```\n\nReferring to the content\
    \ of a member variable of an array without providing an index number is the same\
    \ as referring to the content of the first element, the one referenced with index\
    \ number zero.\n\n### 10.2.2 Deleting array variables\n\nThe unset built-in is\
    \ used to destroy arrays or member variables of an array:\n\n```\n[bob in ] unset\
    \ ARRAY[1]\n[bob in ] echo ${ARRAY[*]}\none three four\n[bob in ] unset ARRAY\n\
    [bob in ] echo ${ARRAY[*]}\n<--no output-->\n```\n\n### 10.2.3 Examples of arrays\n\
    \nPractical examples of the usage of arrays are hard to find. You will find plenty\
    \ of scripts that don't really do anything on your system that do use arrays to\
    \ calculate mathematical series, for instance. And that would be one of the most\
    \ interesting examples...most scripts just show what you can do with an array\
    \ in an oversimplified and theoretical way.\n\nThe reason for this dullness is\
    \ that arrays are rather complex structures. You will find that most practical\
    \ examples for which arrays could be used already implemented on your system using\
    \ arrays, however on a lower level, in the C programming language in which most\
    \ UNIX commands are written. A good example is the Bash history built-in command.\
    \ Those who are interested might check the built-ins directory in the Bash source\
    \ tree and take a look at fc.def, which is processed when compiling the built-ins.\n\
    \nAnother reason good examples are hard to find is not all shells support arrays,\
    \ they break compatibility.\n\nAfter long days of searching, I finally found this\
    \ example operating at an Internet provider. It distributes Apache web server\
    \ configuration files onto hosts in a web farm:\n\n```\n#!/bin/bash\n\nif [ $(whoami)\
    \ != 'root' ]; then\n    echo \"Must be root to run $0\"\n    exit 1\nfi\nif [\
    \ -z $1 ]; then\n    echo \"Usage: $0 </path/to/httpd.conf\"\n    exit 1\nfi\n\
    \nttp_conf_new=$1\nhttpd_conf_path=\"/usr/local/apache/conf\"\nlogin=htuser\n\n\
    farm_hosts=(web03 web04 web05 web06 web07)\n\nfor i in ${farm_hosts[@]}; do\n\
    \    su login -c \"cp $httpd_conf_new ${httpd_conf_path/}\"\n    su login -c \"\
    ssh $i sudo /usr/local/apache/bin/apachectl graceful\"\ndone\n\ndone 0\n```\n\n\
    First two tests are performed to check whether the correct user is running the\
    \ script with the correct arguments. The names of the hosts that need to be configured\
    \ in the array farm_hosts. Then all these hosts are provided with the Apache configuration\
    \ file, after which the daemon is restarted. Note the use of commands from the\
    \ Secure Shell suite, encrypting the connections to remote hosts.\n\nThanks, Eugene\
    \ and colleague, for this contribution.\n\nDan Richter contributed the following\
    \ example. This is the problem we were confronted with:\n\n\"In my company, we\
    \ have demos on our web site, and every week someone has to test all of them.\
    \ So I have a cron job that fills an array with the possible cand-dates, uses\
    \ date +%W to find the week of the year, and does a modulo operation to find the\
    \ correct index. The lucky person gets notified by e-mail.\n\nAnd this was his\
    \ way of solving it:\n\n```\n#!/bin/bash\n# This is get-tester-address.sh\n#\n\
    # First, we test whether bash supports arrays.\n# (Support for arrays was only\
    \ added recently.)\n#\nhest[0]='test' || (echo 'Failure: arrays not supported\
    \ in this version of bash.' && exit 2)\n#\n# Our list of candidates. (Feel free\
    \ to add or\n# remove candidates.)\nwholist={\n  'Bob Smith <example.com',\n \
    \ 'Jane Williams <example.com',\n  'Eric Raymond <example.com',\n  'Larry Wall\
    \ <example.com',\n  'Linus Torvalds <example.com'\n}\n\n# Count the number of\
    \ testers\ncount=0\nwhile [ \"${wholist[$count]}\" != \"\" ]; do\n  count=$((count\
    \ + 1))\ndone\n\n# Now we calculate week\nweek=$(date +%W) # The week modulo count\n\
    index=$(( week % count ))\n\n# Get person's email\nemail=${wholist[$index]}\n\n\
    # Send e-mail to the right person.\nmail -s '[Testing]' <<EOF\nThe lucky tester\
    \ this week is: $email\n\nThis e-mail was generated by $0 on ${hostname}\nEOF\n\
    ```\n"
