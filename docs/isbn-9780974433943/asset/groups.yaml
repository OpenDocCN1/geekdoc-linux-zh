    # Chapter 3: The Bash environment


    # Variables by content


    Apart from dividing variables in local and global variables, we can also divide
    them in categories according to the sort of content the variable contains. In
    this respect, variables come in 4 types:


    +   * String variables

    * Integer variables

    * Constant variables

    * Array variables


    We''ll discuss these types in Chapter 10, "More on variables". For now, we will
    work with integer and string values for our variables.


    # 3.2.1 Creating variables


    Variables are case sensitive and capitalized by default. Giving local variables
    a lowercase name is a convention which is sometimes applied. However, you are
    free to use the names you want or to mix cases. Variables can also contain digits,
    but a name starting with a digit is not allowed:


    ```

    prompt> export 1number=1

    bash: export: ''1number=1'': not a valid identifier

    ```


    To set a variable in the shell,


    ```

    VARNAME="value"

    ```


    Putting spaces around the equal sign will cause errors. It is a good habit to
    quote content strings when assigning values to variables: this will reduce the
    chance that you make errors.


    Some examples using upper and lower cases, numbers and spaces:'
  - '[PAGE 56]


    # 3.2 Variables


    ```

    franky > MYVAR1="*2"

    franky > echo $MYVAR1

    2


    franky > first_name="Franky"

    franky > echo $first_name

    Franky


    franky > full_name="Franky M. Singh"

    franky > echo $full_name

    Franky M. Singh


    franky > MYVAR-2="*2"

    bash: MYVAR-2=2: command not found


    franky > MYVAR1="*2"

    bash: MYVAR1: command not found


    franky > MYVAR1="*2"

    bash: 2: command not found


    franky > unset MYVAR1 first_name full_name


    y > echo $MYVAR1 $first_name $full_name

    <--no output-->


    franky >

    ```


    # 3.2.2 Exporting variables


    A variable created like the ones above is is only available to the current shell.
    It is a local variable: processes of the current shell will not be aware of this
    variable. In order to pass variables to a subshell, we need to export them using
    the export built-in command. Variables that are exported are referred to as environment
    variables. Setting and exporting is usually done in one step:


    ```

    export VARNAME="value"

    ```


    A subshell can change variables that it inherited from the parent, but the changes
    made by the child don''t affect the parent. This is demonstrated in the example:'
  - '[PAGE 57]


    # Chapter 3: The Bash environment


    ```

    franky > full_name="Franky M. Singh"

    franky > bash

    franky > echo $full_name


    franky > exit

    franky > export full_name

    franky > bash


    franky > echo $full_name

    Franky M. Singh


    franky > export full_name="Charles the Great"

    franky > echo $full_name

    Charles the Great

    franky > exit

    franky > echo $full_name

    Franky M. Singh

    franky >

    ```


    When first trying to read the value of full_name in a subshell, it is not there
    (echo shows a null string). The subshell quits, and full_name is exported in the
    parent - a variable that can be exported after it has been assigned a value. Then
    a new subshell is started, in which the variable exported from the parent is visible.
    The variable is changed to hold another name, but the value for this variable
    in the parent stays the same.


    # 3.2.3 Reserved variables


    There are several variables that have special meaning in Bash scripts. Some of
    these reserved variables come from the original Bourne shell, while others are
    specific to Bash.


    Bourne shell reserved variables


    Bash uses certain shell variables in the same way as the Bourne shell. In some
    cases, Bash assigns a default value to the variable. Table 3.1 gives an overview
    of these plain shell variables.'
