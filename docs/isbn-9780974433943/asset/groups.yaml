    # Chapter 6: The GNU awk programming language


    - In this chapter we will discuss:

    - What is gawk?

    - Using gawk commands on the command line

    - How to format text with gawk

    - How gawk uses regular expressions

    - Gawk in scripts

    - Gawk and variables


    To make it more fun


    With sed, entire books have been written about various versions of awk. This introduction
    is far from complete and is only intended for understanding examples in the following
    chapters. For more information, best start with the documentation that comes with
    GNU awk: "GAWK: Effective AWK Programming: A User''s Guide for GNU Awk".


    ## 6.1 Getting started with gawk


    Gawk is the GNU-uixed version of the commonly available UNIX awk program, another
    popular stream editor. The awk program is often just a link to gawk, we will refer
    to it as awk.


    The basic function of awk is to search stream files for lines or other text units
    containing one or more patterns. When a line matches one of the patterns, special
    actions are performed on that line.


    Programs in awk are different from programs in most other languages, because awk
    programs are “data-driven”: you describe the data you want to work with and then
    what to do when you find it. Most other languages are “procedural”. You have to
    describe, in great detail, every step the program is to take. When working with
    procedural languages, it is usually much harder to clearly describe the data your
    program will process. For this reason, awk programs are often refreshingly easy
    to read and write.


    ### 6.1.1 Awk commands


    When you run awk, you specify an awk program that tells awk what to do. The program
    consists of a series of rules. (It may also contain function definitions, loops,
    conditions and other programming constructs, advanced features that we will ignore
    for now.) Each rule specifies one pattern to search for and one action to perform
    upon finding the pattern.


    There are several ways to run awk. If the program is short, it is easiest to run
    it on the command line:


    ```

    awk PROGRAM inputfile(s)

    ```


    If multiple changes have to be made, regularly and on multiple files, it is easier
    to put the awk commands in a script. This is read like this:


    ```

    awk -f PROGRAM-FILE inputfile(s)

    ```


    ## 6.2 The print program


    The print command in awk outputs selected data from the input file.


    When awk reads a line of a file, it divides the line in fields based on the specified
    input field separator, FS, which is an awk variable (see Section 6.3.2). This
    variable is predefined to be one or more spaces or tabs.


    The variables $1, $2, $3, ... hold the value of the first, second, third until
    the last field of an input line. The variable $0 (zero) holds the value of the
    entire line. This is depicted in the image below, where we see six columns in
    the output of the df command:


    ![](img/2e4e7136355955151bf53454bf90e936_104_0.png)


    > Figure 6.1: Fields in awk


    The output of ls is -1, there are 9 columns. The print statement uses these fields
    as follows:


    ```

    kelly@octarine `/test` ls -l | awk ''{ print $9 $5 }''

    160orig

    121script.sed

    120temp_file

    126test

    120wolines

    441txthtml.sh

    ```


    This command printed the fifth column of a long file listing, which contains the
    file size, and the last column, the name of the file. This output is not very
    readable- unless you use the official way of referring to columns, which is to
    separate the ones that you want to print with, a comma. In that case, the default
    output separator character, usually a space, will be put in between each output
    field.


    ### 6.2.1 Formatting fields


    Without formatting, using only the output separator, the output looks rather poorer.
    Inserting a couple of tabs and a string to indicate what output this will make
    it look a little better:


    ```

    kelly@octarine `/test` ls -ldh * | grep -v total | \

    awk ''{ print "Size is " $5 bytes for " $9" }''

    Size is 160 bytes for orig

    Size is 121 bytes for script.sed

    Size is 120 bytes for temp_file

    Size is 126 bytes for test

    Size is 120 bytes for wolines

    Size is 441 bytes for txt2html.sh

    ```


    Note the use of the backslash, which makes long input continue on the next line
    without the shell interpreting this as a separate command. While your line input
    can be virtually unlimited length, your monitor is not, and printed certainly
    isn''t. Using the backslash also allows for copying and pasting of the above lines
    into a terminal window.


    The -h option to ls is for supplying human readable size formats for bigger files.
    The output of a long listing displaying the total amount of blocks in the directory
    is given when a directory is the argument. This is useless unless us, so we add
    an asterisk. We also add the -d option for the same reason, in case asterisk expands
    to a directory.


    The backslash in this example marks the continuation of the line. See Section
    3.3.2. You can take out any number of columns and even reverse the order. In the
    example below this is demonstrated for showing the most critical partitions:


    ```

    kelly@octarine ~> df -h | sort -rnk 5 | head -3 | \

    awk ''{ print ''Partition '' $6 ''\t: '' $5 ''full!'' }''

    Partition /var : 86% full;

    Partition /usr : 85% full;

    Partition /home : 70% full;

    ```


    Table 6.1: Formatting characters for gawk


    | Sequence | Meaning |

    | :--- | :--- |

    | \a | Bell character |

    | \n | Newline character |

    | \t | Tab |


    ### 6.2.2 The print command and regular expressions


    A regular expression can be used as a pattern by enclosing it in slashes. The
    regular expression is then tested against the entire text of each record. The
    syntax is as follows:


    ```

    awk ''/expression/'' file(s)

    ```


    The following example displays only local device information, networked file systems
    are not shown:


    ```

    kelly@octarine ~> df -h | awk ''/dev/ { print ''\t: $5 }''

    / : 46%

    /boot : 10%

    /opt : 84%

    /usr : 97%

    /var : 73%

    ```


    Slashes need to be escaped, because they have a special meaning to the awk program.
    Below another example where we search the /etc directory for files ending in "conf"
    and starting with "a":


    ```

    kelly@octarine ~> ls -l | awk ''/^[a-z]\*.conf$/ { print $9 }

    amd.conf

    antivir.conf

    xcdrost.conf

    xinetd.conf

    ```


    This example illustrates the special meaning of the dot in regular expressions:
    the first one indicates that we want to search for any character after the first
    string, the second is escaped because it is part of a string to find (the end
    of the file name).


    ### 6.2.3 Special patterns


    In order to precede output with comments, use the BEGIN statement:


    ```

    kelly@octarine ~> ls -l | awk BEGIN { print "Files found:\n" } /^[a-z]\*.conf$/
    { print $9 }

    Files found:

    amd.conf

    antivir.conf

    xcdrost.conf

    xinetd.conf

    ```


    The END statement can be added for inserting text after the entire input is processed:


    ```

    kelly@octarine ~> ls -l | awk ''/^[a-z]\*.conf$/ { print $9 } END { print "Can
    I do anything else for you, mistress?" }

    amd.conf

    antivir.conf

    xcdrost.conf

    xinetd.conf

    Can I do anything else for you, mistress?

    ```


    ### 6.2.4 Gawk scripts


    As commands tend to get a little longer, you might want to put them in a script,
    so they are reusable. An awk script contains awk statements defining patterns
    and actions.


    As an illustration, we will build a report that displays our most loaded partitions.
    See Section 6.2.1.


    ```

    kelly@octarine ~> cat diskrep.awk

