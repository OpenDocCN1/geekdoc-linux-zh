    # Appendix A: Shell Features


    # A.1 Common features


    The following features are standard in every shell. Note that the stop, suspend,
    jobs, bg and fg commands are only available on systems that support job control.


    # A.2 Differing features


    The table below shows major differences between the standard shell (sh), Bourne
    Again SHell (bash), Korn shell (ksh) and the C shell (csh).


    ![](img/2e4e7136355955151bf53454bf90e936_197_0.png)


    Since the Bourne Again SHell is a superset of sh, all sh commands will also work
    in bash - but not versa. bash has many more features of its own, and, as the table
    below demonstrates, features incorporated from other shells.


    Since the Turbo C shell is a superset of csh, all csh commands will work in tcsh,
    but not the other way round.


    The Bourne Again SHell has many more features not listed here. This table is just
    to give you an idea of how this shell incorporates all useful ideas from other
    shells: there are no blanks in the column for bash. More information on features
    found only in Bash can be retrieved from the Bash info pages, in the “Bash Features”
    section.


    More information:


    You should at least read one manual, being the manual of your shell. The preferred
    choice would be info bash, bash being the GNU shell and easiest for beginners.
    Print it out and take it home, study it whenever you have 5 minutes.'
