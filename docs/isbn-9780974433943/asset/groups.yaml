    \ {start|stop|status|restart}\"\n    exit 1\nesac\n```\n\n启动停止守护进程的任务定义在函数中，参见“函数函数”。\n\
    \n## 7.8 总结\n\n在本章中，我们学习了如何在脚本中构建条件，以便根据成功或失败采取不同的操作。我们通过 `if` 语句处理退出码、输入和字符串比较。更复杂的条件定义通常放在\
    \ `case` 语句中。简单的 `if/then/fi` 测试通常位于命令执行之前，以防止输出生成。\n\n## 7.9 练习\n\n这里是一些帮助你开始在脚本中使用\
    \ `if` 的思路：\n\n- 使用 `if/then/elif/else` 结构打印当前月份的信息。脚本应该打印当月的天数，如果是二月则提供闰年信息。\n\
