    ```

    kelly@octarine ~> df awk -f diskrep.awk

    *** WARNING WARNING ***

    Partition - 97% full!

    *** Give money for new disks URGENT! ***

    ```


    awk 首先打印消息，然后格式化所有开头为 8 或 9、后面跟着一个数字和一个百分号的行。添加了结束消息。


    ![](img/2e4e7136355955151bf53454bf90e936_108_0.png)


    Awk 是一种编程语言。大多数可以进行其他语言语法高亮的编辑器（如 C、Bash、HTML 等）都能识别其语法。


