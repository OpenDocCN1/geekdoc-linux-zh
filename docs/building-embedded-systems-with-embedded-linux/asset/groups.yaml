  mdcn: '

    RTOS 基本上有两种类型。一种是硬实时 RTOS。另一种是软实时 RTOS 的形式。我们将理解这两种东西。我们将学习何时需要使用硬实时 RTOS，以及何时需要使用形式或软实时
    RTOS。硬实时意味着你必须绝对赶上每一个截止时间（deadline）。极少数系统有此要求。示例包括核能系统、某些医疗应用（如起搏器）、大量的国防应用、航空电子设备等。现在我们将看到软实时系统的形式。在这里，我们可以错过一些截止时间，但如果错过的次数太多，性能最终会退化。


    ![](img/20a8a1dba21eed48c328710bf57d85d0_96_0.png)


    一个很好的例子是你电脑上的音响系统。如果你错过了一个节拍或几个比特（bits），并大碍。但错过过多可能会降低系统质量，你可以在某些音乐系统中分析出或听出这一点。如果你的声音出现很多问题，意味着你错过了太多的比特。RTOS
    的示例有：


    VxWorks、QNX 和 Ucos。VxWorks 非常流行且强大。它基本上用于国防、航空航天等领域，但非常非常贵。我们需要购买它的许可证。


    ![](img/20a8a1dba21eed48c328710bf57d85d0_97_0.png)


    - 应用处理器（Application processor）提供了一个自包含的运行环境，提供支持设备应用所需的所有系统能力，包括内存管理、图形处理和多媒体解码。

    - 简单来说，你可以将 AP 考虑为可以运行操作系统的普通 PC。

    - 同样，AP 上可以运行不同的操作系统，最常见的是 Linux 和 Android。

    - 如今，AP 以 SOC（片上系统）这一单一包的形式提供。


    现在我们将转向应用处理器，这将是我们接后项目的主要目标。我们将仅在嵌入嵌入式 Linux 系统上工作。因此，应用处理器基本上设计用于运行一个具有类操作系统能力的完整独立系统。处理器提供了一个自包含的运行环境，提供支持设备应用所需的所有系统能力，包括内存管理、图形处理和多媒体解码。简单来说，你可以将
    AP 视为可以运行不同操作系统的普通 PC。同样，不同的操作系统可以运行在 AP 上。


    - SoC 是 System on a Chip（片上系统）的缩写，是一种将计算机所有主要组件集成到单个芯片上的集成电路。将你的 CPU、显卡、内存控制器和其他组件全部合入一个芯片中，这本质上就是一个
    SoC。

    - 有许多应用处理器供应商。其中最著名的是 Nvidia（英伟达）及其五核 Tegra 处理器、Qualcomm（高通）的 Snapdragon，以及三星的
    Exynos 系列。许多廉价智能手机由 MediaTek（联发科）处理器驱动。

