    C 和其他语言的索引高亮，就像 Windows 上的 Notepad++ 一样。它与 Notepad++ 非常相似，可以用于你的编码，如 C、python
    等，因为它为不同的语言提供了语法高亮，并且可以带颜色高亮识别不同语言的索引、匹配括号等。它主要存在于所有的 Linux 发行版中；它不支持命令行界面。如果你想使用
    gedit 的最大功能，我们需要使用下面的命令安装插件。现在我们将进入实操环节，看看它长什么样。如果你只是想看看它的样子，它看起来就像幻灯片中展示的那样。现在我将进入实操环节，对
