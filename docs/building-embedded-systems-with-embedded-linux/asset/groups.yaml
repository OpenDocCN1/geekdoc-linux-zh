    ## 带网络支持的 QEMU


    我们将看到如何在 QEMU 中启用网络支持，但在那之前，我们将进行一些理论项目并理解如何创建它。让我们开始。我们将尝试理解第一个 tap 和 tan 网络。这需要在
    Qemu 中启用网络支持。TUN 和 TAP 接口是纯软件接口，意味着它们只存在于内核中，与普通网络接口不同，它们没有物理硬件组件，因此没有物理线连接到它们。TUN
    网络主要用于模拟网络层设备，它通过 IP 包等三层数据包运行。TAP 基本上用于模拟链路层设备，它通过以太网帧等链路层数据包运行。它的行为就像网络适配器，只不过它是一个虚拟网络适配器。我们主要将为
    RPi 使用 tap 网络，这将创建一个虚拟以太网设备，该设备仅存在于软件中，而不是真实的以太网设备。TUN 基本用于路由，TAP 用于创建我们的网络桥接。较低的流量开销仅传输目标为
    VPN 客户端的流量。


    ![](img/20a8a1dba21eed48c328710bf57d85d0_136_0.png)


    操作系统通过 tun 和 tap 设备发送的数据包包被传递到附加到该设备的用户空间程序。用户空间程序也可以将数据包传递到 tun 或 tap 设备。这些就是功能。你可以从互联网上探索更多关于
    tap 或 tun 网络知识。这仅供参考。现在我们将进入实操环节，开始运行带网络支持的 RPI。从上一个项目来看，只有两个参数发生了变化，其他的保持不变。我们将提供
    `-net` 和 `-net tap` 接口名称以及脚本文件。正如我之前讨论过的，tap 用于创建虚拟网络。这就是为什么我们提供 tap 参数，接口名称是
    `vnet0`。这将在主机端创建，现在我们将去 Ubuntu 端查看所有项。现在我们去 Ubuntu 运行这条命令。


    ```bash

