    # EXAMPLE CODE


    1. Initializing a Git Repository:


    ```

    Bash

    git init

    Use code with caution.

    This command initializes a new Git repository in the current directory. This creates
    a hidden folder called .git where Git stores all the version control information.

    ```


    2. Adding Files to Staging Area:


    ```

    Bash

    git add <filename>

    # or

    git add .

    Use code with caution.

    git add <filename>: This adds a specific file to the staging area, which tells
    Git you want to include those changes in the next commit.

    git add . : This adds all tracked files (files already added to the repository)
    in the current directory to the staging area.

    ```


    3. Committing Changes:


    ```

    Bash

    git commit -m "<commit message>"

    Use code with caution.

    ```'
