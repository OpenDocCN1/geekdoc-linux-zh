    \ packages from source, we need three steps. First is, we need to configure that\
    \ package, then build and install that package. Configuration is the most important\
    \ part where we have full control of feature tweaking or we can customize it even\
    \ if we can add our code in that package and build. Now I will go to Ubuntu and\
    \ do all those things one by one. First we need to get the source using git clone.\
    \ This one we have already covered in the git project. I will get the source first.\n\
    \n```bash\n# Get the source\ngit clone https://github.com/qemu/qemu.git\n\n# Configure\n\
    ./configure --target-list=arm-softmu,arm-linux-user --disable-vnc --enable-sdl\
    \ --prefix=$PWD/sysroot\n\n# Build\nmake\n\n# Install\nmake\n```\n\nWe will go\
    \ for the configuration and installation process. It is downloaded in the Qemu\
    \ folder. We need to go into the Qemu folder.\n\n# qemu-VirtualBox: ~/rpi/qemu\n\
    \n```bash\nqemu@qemu-VirtualBox: ~/rpi/test_cmd\nqemu@qemu-VirtualBox:~/rpi$ cd\
    \ qemu\nqemu@qemu-VirtualBox:~/rpi/qemu$ ls\nqemu@qemu-VirtualBox:~/rpi/qemu$\
    \ git clone https://github.com/qemu/qemu.git\nCloning into 'qemu'\nremote: Enumerating\
    \ objects: 2, done.\nremote: Counting objects: 100% (2/2), done.\nremote: Compressing\
    \ objects: 100% (2/2), done.\nremote: Total 402898 (delta 0), reused 0 (delta\
    \ 0), pack-reused 402898\nReceiving objects: 100% (402898/402898), 20.15 MiB |\
    \ 1.05 MiB/s, done.\nResolving deltas: 100% (324332/324332), done.\nchecking connectivity...\
    \ done.\nqemu@qemu-VirtualBox:~/rpi/qemu$\n```\n\nJust press the \"ls\" command\
    \ and see it has downloaded successfully. To see if it is actually a git source\
    \ or not.\n\ntype git log and you will be able to see if it is git or not. From\
    \ the git log we are able to see the commit message. It means it is a git repo.\
    \ Now we will go for configuration. For configuration we will give a target list.\
    \ We are billing for ARM that's why we will give only ARM related configuration\
    \ files. arm-softmmu and arm-linux-user. The first parameter is for giving hints\
    \ that we are going to run our OS. Second parameter is for giving hints that we\
    \ are going to run the application too, then we are disabling the VNC otherwise\
    \ it will not start automatically on your console. Then we need to enable SDL\
    \ and the last parameter we are providing is where it will build and install so\
    \ it will install in your sysroot directory but before that we need to create\
    \ this directory. So we will create this directory. Now this directory is created.\n\
    \n```bash\n$ qemu-VirtualBox: ~/rpi/qemu/qemu\nqemu@qemu-VirtualBox: ~/rpi/test_cmd\n\
