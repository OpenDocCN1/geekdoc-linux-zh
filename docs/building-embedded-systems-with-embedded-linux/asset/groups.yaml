    # LINUX 内核介绍 (INTRODUCTION)


    在今天的项目中，我们将理解 Linux 内核的一些基本概念。让我们开始吧。Linux 内核，或者基本上说任何内核，都是操作系统的核心。没有了它，你就无法获得操作系统的完整功能。这意味着我们需要在系统中运行一个内核，它将控制你所有的资源。所以我将解释它的角色。任何内核都具有如进程管理、内存管理、设备控制、网络等功能。Linux
    内核也支持相同的功能。内核是所有资源的主宰。如果用户想要访问任何资源，这意味着没有内核，用户无法访问任何资源，它们必须向内核请求资源。这指的是硬件资源，甚至是软件资源。但用户如何实际访问它们呢？内核提供了两个常用的功能，如系统调用（system
    call）和 `ioctl` 调用。除此之外，还有许多其他方法。


    ![](img/20a8a1dba21eed48c328710bf57d85d0_164_0.png)


    但这两个方法是最经常被使用的。现在我来看看操作系统被分为哪三个部分：硬件层、内核层和用户层。在硬件层，是你所有与硬件相关的驱动程序，或者说硬件本身位于那里。内核层是你所有控制所在的地方。在用户层，基本上居住着我们的应用程序和实用程序。假设我想访问我们的硬盘，在这种情况下，用户只需要请求内核资源以获得访问权限，然后内核层将允许你访问。假设我想从硬盘拷贝一个文件，然后使用它来调用
    `copy` 系统调用，内核将检查该文件是否存在，如果存在，它将给你硬件级的访问权限，以便用户可以拷贝特定的资源。这就是该框架的工作方式。现在我将看看为什么需要内核。即使没有内核，我们也可以从
    u-boot 运行应用程序。但它不具备多实例应用程序的所有优势，而且没有任何内存保护。这意味着我们无法运行我们的线程应用程序，而且我们在内存方面会遇到问题。我们不知道将使用哪些内存，万一我的应用程序导致系统崩溃怎么办？没有验证内存的方法。内存可能被占用、已使用，如果你使用任何无效内存或获取的内存，可能会导致系统崩溃或损坏该特定内存。因此，在内核中，所有如内存管理、进程管理和设备控制等设施得到了得到了。没有了这些功能，我们的操作系统无法顺畅运行。这就是为什么需要内核。


