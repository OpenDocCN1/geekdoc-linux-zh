    ## BUSYBOX 深入理解


    在今天的项目中，我将介绍 busybox。这是一个纯理论项目。在下一个项目中，我们将学习如何配置、构建和部署 busybox。但现在，我们只涵盖理论性项目。所以，让我们开始吧。Busybox
    通常被称为嵌入式 Linux 的“瑞士军刀”。这是因为它提供了大部分的常用工具。Busybox 将许多常用 Linux 工具的精简版本合并成一个单一型的可执行文件。这一点我可以从快照中告诉你。我们将查看第四张幻灯片。在这里，你可以看到
    Busybox 是一个工具，而像 `cp`、`dd`、`df` 等其他命令只是 busybox 的符号链接。这意味着所有命令都派生自 busybox。


    ## 基于 BUSYBOX 的一些基础命令


    ```

    lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 base64 -> busybox

    -lrwrxwrfwx 1 qemu qemu 1023344 Nov 9 17:43 busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 cat -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 chattr -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 chgrp -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 chnod -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 chown -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 conspy -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 cp -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 ctyhtack -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 date -> busybox

    -rwxr-xr-x 1 qemu qemu 207552 Nov 10 09:47 dbclient

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 dd -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 df -> busybox

    -lrwrxwrfwx 1 qemu qemu 7 Dec 19 09:41 dmesg -> busybox

    ```


    我们将在实践课程中看到如何制作任何命令。但现在，只需要理解所有这些东西都是派生自 busybox。现在我们回到原始幻灯片。busybox 中的工具提供的选项通常比其功能完整的
    GNU 兄弟版本少。这意味着如果我们在使用 busybox 中的某些工具，同时直接使用某些工具（或者说功能性工具），它们将是类似的，但对于高级用户，你可能会看到一些差异。不过对于普通用户来说没关系。这就是为什么它被称为选项比功能完整的
    GNU 兄弟版本少。对于小型系统，或者你可以说是空间受限的嵌入式平台，Busy Box 提供了几乎所有我们需要的环境，我们可以说一个 Busybox 就足以满足我们嵌入式平台的大部分需求。Busybox
    基本上在编写时考虑了尺寸和有限的资源。它具有极强的模块化方法。你可以轻松地包含或排除其中的一个包。我们将查看如何创建一个可以运行的系统。对于运行系统，我们需要
    `bin` 文件夹、`sbin` 文件夹、`dev` 文件夹等。


    这些内容可以创建，但 busybox 提供了我们的 `bin` 文件夹、`sbin` 文件夹和配置文件。除此之外，我们需要创建设备节点、`proc`、`sys`，就可以了。只需在启动时包含
    Linux 内核和引导程序，你的系统就准备好部署了。在 busybox 中，你将获得像 `menuconfig` 这样的功能（我们在 Linux 内核中见过它），它可以让我们灵活地包含或排除特定的包。默认情况下，大多数常用工具都会被包含。


    - BusyBox 的编写考虑了尺寸优化和有限的资源。

    - 它也具有极强的模块化特征，因此你可以在编译时轻松地包含或排除命令（或功能）。

    - 这使得自定义你的嵌入式系统变得简单。

    - 要创建一个运行的系统，需要在 `/dev` 中添加一些设备节点，在 `/etc` 中添加一些配置文件，以及 Linux 内核和引导程序 (u-boot)。

