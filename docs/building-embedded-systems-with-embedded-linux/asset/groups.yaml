    \ 1.05 MiB/s, done.\nResolving deltas: 100% (324332/324332), done.\nchecking connectivity...\
    \ done.\nqemu@qemu-VirtualBox:~/rpi/qemu$\n```\n\n只需输入 \"ls\" 命令查看它是否已成功下载。为了检查它是否真的是\
    \ git 源码，\n\n输入 `git log` 你就能看到它是否为 git 仓库。从 `git log` 中我们可以看到提交信息，这意味着这是一个 git\
    \ 仓库。现在我们将进行配置。对于配置，我们将提供目标列表。我们正在为 ARM 编译，因此只提供 ARM 相关的配置文件：`arm-softmmu` 和 `arm-linux-user`。第一个参数提示我们要运行我们的\
    \ OS。第二个参数提示我们要运行应用程序，并禁用 VNC，否则它不会在控制台上自动启动。最后一个参数我们提供了构建和安装的 `sysroot` 目录，但在之前我们需要创建这个目录。现在这个目录创建了。\n\
    \n```bash\n$ qemu-VirtualBox: ~/rpi/qemu\nqemu@qemu-VirtualBox: ~/rpi/test_cmd\n\
    qemu@qemu-VirtualBox:~/rpi$ cd qemu\nqemu@qemu-VirtualBox:~/rpi/qemu$ ls\nqemu@qemu-VirtualBox:~/rpi/qemu$\n\
    qemu@qemu-VirtualBox:~/rpi/qemu$ git clone https://github.com/qemu/qemu.git\n\
