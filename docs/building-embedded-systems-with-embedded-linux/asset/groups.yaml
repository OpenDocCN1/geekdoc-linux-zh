    一起提供，如果没有，在安装增强包时它会自动下载并安装在你的客机操作系统中。


    这样之后我们将去 Virtualbox 官网，并尝试下载包含 Virtualbox 和 Virtualbox 扩展包的必要包。这里我们需要注意版本必须相同。否则，你的
