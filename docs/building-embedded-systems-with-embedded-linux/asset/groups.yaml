    -no-reboot serial stdio -net mlic -net tap,ifname=vnet0,script=no,downscript=no


    在客户端侧：

    sudo ifconfig eth0 10.0.0.15

    在主机侧：

    #检查 vnet0 接口

    ifconfig -a

    sudo ifconfig vnet0 10.0.0.16

    ```


