    # 基础模块介绍


    到目前为止，我们立即讨论了选定的构建模块对比。因此，让我们从基础模块的概念开始。现在我们正在讨论家庭诊所的构建模块。在整个项目中，我们将使用 QEMU 作为硬件参考。在整个项目过程中，我们将在
    QEMU 上进行仿真，以便在不购买新硬件的情况下理解它们的工作内存。我们已经涵盖了如何根据我们的目的选择板卡，通过更好地了解家庭诊所的基础模块，可以很容易根据自己的目的选择板卡，而不会浪费时间和金钱。


    ![](img/20a8a1dba21eed48c328710bf57d85d0_140_0.png)


    让我们从基础模块开始。它们被称为基础模块。第一个是工具链。第二个是 QEMU。第三个是根文件系统上的内核核心。在本节中，我们将讨论导致工具链的原因，因为另外三个基础模块的内容非常广泛，需要在接下来的幻灯片中进行更多的扩展和耗时。我们将单独介绍
    QEMU，并尝试理解每个部分在主程序中的需求，并将取一个示例来构建一个“Hello World”程序，并查看如何在 QEMU 上运行它，就这些。


    # 工具链


    我们将学习工具链。让我们开始吧。学习工具链的一些概念，然后进入实操环节。工具链是一个完整的包，包含调试器以及许多其他东西，基本上设计用于构建、调试和分析你的代码的工具，它至少由两个新工具组成：你的汇编器、链接器等。然后是编译器、运行你最小代码的
    C 库。其次是用于调试你编译代码的调试器。现在，基本上有两种类型的工具链：一种是原生的（Native），另一种是交叉的（Cross）。原生工具链基本上是在直接在你的主机上或直接在目标板卡上运行代码时需要的。例如，假设你正在为你的
    Linux 或目标板卡编写代码，并在与主机或目标机器相同的系统上进行编译，那么它被称为原生。


    # 工具链的类型


    - 原生（Native）：在目标板卡上运行编译器。例如，你在 Linux 桌面面上写了一段 C 代码，编译然后在同一台机器上运行。

    - 交叉（Cross）：在主机上编译代码，在目标机器上运行。例如，在你的 Linux 机器上编写并构建你的代码，然后部署到目标嵌入式板卡上执行。如果你的目标嵌入式板卡处理能力低和/或磁盘空间，这基本上是需要的，因为在主机
    PC 上开发比在目标板上更容易。


    然后还有其他东西，比如交叉编译器，如果你在目标机器的缺失按钮上编译代码，那么它将变成交叉编译器。交叉编译器基本上是为了满足这样一个需求：如果你因为尺寸限制或处理能力限制而无法在目标机器上运行代码，那么你可以使用交叉编译的概念，这意味着在主机上编译代码，然后部署到你的目标机器上运行。现在我们将进入另一页幻灯片，查看如何在
