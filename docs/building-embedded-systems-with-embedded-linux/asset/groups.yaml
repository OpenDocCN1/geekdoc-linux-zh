    Player。


    ## 流行虚拟机


    - Virtualbox - 它是一款开源且跨平台的虚拟化软件。你可以在 Windows、Linux、Mac 和 BSD 系统上安装它。

    - VMware - 它与 Virtualbox 类似，增加了一些功能。但它不是免费的。

    - Qemu - 除了提供常规虚拟机支持外，它还设计用于模拟不同的架构，允许运行为其他 CPU 或架构编写的软件应用程序和操作系统。


    如果我们选择 VMware Workstation，你需要获取许可。如果你选择 VMware Player，它实际上是免费的，我们可以使用。然后是 Qemu。Qemu
    提供了与 VMware 类似的功能，虽然没有完全实现，但它基本上设计用于模拟不同的架构。这意味着如果你为 ARM 编写了代码并进行了交叉编译，你可以在 Qemu
    上测试这些代码。它提供的另一个功能是，如果你有一个为 ARM 或其他架构设计的操作系统，使用 Qemu 我们可以直接运行它。


    ## 安装 Virtualbox


    首先，我先来看我们工具箱的一些基本概念，之后我们将安装我们的“孩子们”。让我们开始吧：Virtualbox，一款开源且跨平台的虚拟化软件。它可以安装在 Windows、Linux、Mac
    和 Vista 上。这意味着它为它支持的所有平台都提供了相应的级别。如果你为某一个平台创建虚拟机，那么它可以移植到另一个平台以支持我们。我在 Windows
    中安装了一个虚拟机。同样的操作也可以在支持 Linux 的的另一个宿主机上进行。Virtualbox 提供了快照（Snapshots）功能。只需导入该格式的文件，它就能在你的机器或另一个宿主机上运行。Virtualbox
    提供了快照功能。这意味着你可以保存虚拟机的不同状态，这对于你的开发是需要的。假设你有两个或三个开发环境，你可以将不同阶段保存为快照，只需快照，你就可以在它们之间切换并此进行工作。


    ## 简介


    - Virtualbox 是一款开源且跨平台的虚拟化软件。你可以在 Windows、Linux、Mac 和 BSD 系统上安装它。

    - 它是可移植的。在宿主机上创建的虚拟机可以使用开放虚拟格式 (OVF) 轻松地在另一个宿主机上运行。用户需要在需要时导入和导出虚拟机。

    - Virtualbox 提供了虚拟机状态信息的保存快照功能。你可以回到过去并还原虚拟机。


    现在我们理解了材料中用到的一些基本术语。有两点：一个是宿主机（Host），另一个是客机（Guest）。宿主机是指虚拟机运行的地方。例如，如果你在 Windows
    上安装 VMware，那么你的 Windows 将充当宿主机，而你的虚拟机将充当客机。在我们实际开始使用 Virtualbox 之前，我们需要满足一些前提条件。首先，我们需要下载
