    并使用 gedit 选项，现在它将打开进行编辑。你可以看到所有的侧边栏，这里有一个侧边面板。我可以打开任何文件，假设我想在驱动器中打开一个新文件。我会打开它，然后我想从块驱动器打开的任何文件，我可以点击任何一个文件，它就会打开，此外还有一个功能：编辑。它会在多个标签页中打开，如果你正在处理大量文件，这样工作会更方便，你可以轻松地在一个标签页之间切换。这个侧边栏可以通过
