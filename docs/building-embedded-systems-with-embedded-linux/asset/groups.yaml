    # Linux SHELL (BASH 和 SH)


    让我们开始吧。Shell 是一个充当你与 Linux 系统之间接口的程序，它允许你输入命令供操作系统执行。在在这方面，它类似于 Windows 的命令提示符。有很多
    Shell，如 sh、csh、bash 等，但最常用的 Shell 是 bash，它是 Ubuntu 以及大多数其他 Linux 发行版的默认 Shell。你可以仅通过输入
    Shell 名称来在不同的 Shell 之间切换，例如，如果你想切换回 sh，只需输入 `sh`；如果你想切换回 bash，则输入 `bash`。


    ![](img/20a8a1dba21eed48c328710bf57d85d0_31_0.png)


    但在 Ubuntu 中，默认运行的 Shell 是 bash。现在我们将看下一个，Shell 架构。Shell 驻留在用户空间，它用于从用户处接收命令并将其发送到内核空间，内核空间将为你提供输出。一旦有了输出，bash
    或 SH 就会向你显示命令输出。现在我们将进入 bash 并尝试理解 bash 的特性是什么？Bash 通常存在于大多数没有大小限制问题的发行版中。它通常是大多数
    Linux 变体的默认 Shell，也用于许多嵌入式平台。它非常易用且对用户友好。在这里你可以非常轻松地运行命令。这里你有一个自动补全功能，所以我将尝试理解一下在终端中输入命令时自动补全功能的作用。你会发现有时你无法完全记得命令，但你知道命令的某些字母。只需输入命令的几个字母并按
    Tab 键，就会向你显示命令提示，然后你就可以完成你的命令。现在我们将进入 SH 并了解它是什么。SH 通常用于轻量级嵌入式操作系统 busybox，它由许多用于嵌入式平台的微型实用程序组成。它非常简单且轻量，但没有用户友好的界面。此外，你找不到
    Tab 自动补全功能以及其他特性，这意味着你需要准确记住命令，否则你无法运行命令。现在我们将进入实操环节，看看如何使用 SH 和 BASH。现在我们启动 Ubuntu
    并观察此功能。


    ![](img/20a8a1dba21eed48c328710bf57d85d0_33_0.png)


    目前你的 Shell 是 BASH。现在我们将看到如何在两个 Shell 之间切换。但首先，我们将查看当前运行的 Shell 是什么。为此，输入命令 `echo
    $SHELL`，它将给你当前工作的 Shell。现在你可以看到它显示的是 bash。在这里我们将看到我们是如何输入命令的，以及我们如何方便地使用补全功能。例如，假设我们要获取当前目录列表，你知道命令
    `pwd`，只需输入 `pw` 并按 Tab 键，它就会向你显示提示。现在我们按下 W 看看我们能多方便地运行命令。即使我们只知道几个字母，现在我们将切换回
    SH Shell 并看看它是如何工作的。现在我们切换回 SH。你会发现那里没有我们运行位置的提示以及其他功能，这意味着你需要准确输入命令，否则你无法运行命令。

