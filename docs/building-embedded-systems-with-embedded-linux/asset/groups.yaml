  mdcn: "\n\n一种更简单的文件传输协议，通常用于网络设备的初始配置或固件更新。\nTFTP 服务器（在你的 Linux 机器上）：\n\n```bash\n\
    tftpd & # 在后台启动 TFTP 服务\n```\n\n请务必谨慎使用代码。\nTFTP 客户端（在另一台机器上）：\n\n```bash\ntftp\
    \ <hostname> <filename> # 从 TFTP 服务器下载文件\ntftp -p <local_port> <hostname> <filename>\
    \ # 下载文件并指定本地端口（可选）\n```\n\n注意：TFTP 不提供加密或身份验证，因此在不可信的网络上使用时请谨慎。\n\n这些都是基础示例。每个工具都提供了更多选项和功能。请参考它们的手册或在线资源获取详细信息：\n\
    \n- SSH: https://man7.org/linux/man-pages/man1/ssh.html\n- SCP: https://www.zdnet.com/article/how-to-use-the-scp-command-in-linux/\n\
    - WinSCP: https://winscp.net/eng/index.php\n- TFTP: https://datatracker.ietf.org/doc/rfc1350/\n\
    \n# 从源码编译 QEMU\n\n我们将学习如何从源码编译 QEMU，但在开始之前，我们将先了解从源码编译的必要性。在 Linux 中有两种可用方式：我们可以直接下载安装包，也可以下载源代码并针对我们的目的进行交叉编译。我们可以对其进行自定义，可以修改功能后再进行使用。这种功能在\
    \ Windows 中很少使用。在这里，我们只需要下载工具然后就可以使用这些代码。如果我们使用源码并进行编译，我们将对源代码拥有完全的控制权，可以根据我们的目的和所需功能进行定制。此外还有一点：我们可以控制代码的版本，既可以获取最新的更改，也可以获取任何适合我们目的的提交（commit）。但在二进制文件中，我们没有太大的控制权，它取决于发行版。接下来我将介绍\
    \ QEMU 的前提条件。QEMU 需要安装一些先决条件。如果使用源码进行构建，则需要 SDL 库、pixman 库以及 flex 和 bison 库。在所有库中，最重要的是我们的\
    \ SDL。这是一款跨平台多媒体库，旨在为音频、键盘、鼠标以及任何其他硬件特性提供低级访问。没有这个库，QEMU 将无法正常工作。\n\n# 前提条件\n\n\
    - * sudo apt-get install libsdl2-dev libpixman-1-dev flex bison\n- Simple DirectMedia\
    \ Layer (SDL) 是一款跨平台多媒体库，旨在通过 OpenGL 和 2D 视频帧缓冲区为音频、键盘、鼠标、摇杆以及 3D 硬件提供低层级访问。\n\
    - 没有这个库，你将无法使用 QEMU 的大部分功能。\n\n现在还需要理解一个概念，为了从源码构建任何包，我们需要三个步骤。首先，我们需要配置该包，然后构建并安装该包。配置是最重要的部分，我们对功能微调拥有完全控制权，或者可以对其进行自定义，甚至可以在包中添加我们的代码并进行构建。现在我将进入\
    \ Ubuntu 并逐一完成这些操作。首先，我们需要使用 `git clone` 获取源码。这部分已经在 git 项目中涵盖过了。我先获取源码。\n\n```bash\n\
    # 获取源码\ngit clone https://github.com/qemu/qemu.git\n\n# 配置\n./configure --target-list=arm-softmu,arm-linux-user\
    \ --disable-vnc --enable-sdl --prefix=$PWD/sysroot\n\n# 构建\nmake\n\n# 安装\nmake\n\
    ```\n\n我们将进行配置和安装过程。它被下载在 Qemu 文件夹中。我们需要进入 Qemu 文件夹。\n\n# qemu-VirtualBox: ~/rpi/qemu\n\
    \n```bash\nqemu@qemu-VirtualBox: ~/rpi/test_cmd\nqemu@qemu-VirtualBox:~/rpi$ cd\
    \ qemu\nqemu@qemu-VirtualBox:~/rpi/qemu$ ls\nqemu@qemu-VirtualBox:~/rpi/qemu$\
    \ git clone https://github.com/qemu/qemu.git\nCloning into 'qemu'\nremote: Enumerating\
    \ objects: 2, done.\nremote: Counting objects: 100% (2/2), done.\nremote: Compressing\
