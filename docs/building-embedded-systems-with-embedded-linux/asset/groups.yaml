  - '[PAGE 163]


    # INTRODUCTION OF LINUX KERNEL


    Today in this project we will understand some of the basic concepts of the Linux
    kernel. So let''s start. Linux kernel or basically any of the kernels is the core
    operating system. Without that you cannot get the full features of the operating
    system. This means we need to have a kernel running on the system which will control
    all your resources. So I will understand what the role is. Any of the kernels
    has features like Process Management memory management, device control networking
    and other. The same feature is supported by the Linux kernel too. Kernel is the
    master of all resources. So if the user wants access to any of the resources.
    This means without kernel users cannot access any of the resources it needs to
    ask the kernel for their resources. This means hardware resources or even software
    resources. But how the user will actually access that kernel has provided two
    most common features like system call and ioctl call. Apart from that also there
    are so many other methods.'
  - '[PAGE 164]


    ![](img/20a8a1dba21eed48c328710bf57d85d0_164_0.png)


    But these two methods are often used. Now I''ll go and see what architecture the
    operating system is divided into three parts. Hardware level, kernel level and
    user level. In hardware level all your hardware related drivers or you can say
    a hardware resides in itself. The kernel layer all your controls go. In the user
    layer, basically our applications and utilities reside. Suppose, I want to access
    our hard drive, in case users just need to ask for a kernel resource to get access
    and then the kernel layer will allow you to get access. Suppose I want to copy
    one file from my harddrive then use it to invoke a copy system call then the kernel
    will check for that if it resides then it will give you the access to hardware
    level so that user can copy that particular resource. So this is how this framework
    works. Now I will see why the kernel is required. Even without a kernel we can
    run our application from u-boot. But it does not have all the advantages of multiple
    instances of application and also there is no end to any memory protection. This
    means we cannot run our thread application and even we have a problem with memory.
    We'
  - '[PAGE 165]


    don''t know which memory we are going to use in case, my application can crash
    the system. There is no way to validate memory. It may be occupied, already used
    and if you are going to use any invalid memory or acquired memory it may either
    crash the system or it will corrupt that particular memory. So in the kernel all
    those facilities like memory management, process management and device control
    are taken care of. Without all those features our OS cannot run smoothly. That''s
    why a kernel is needed.'
  - '[PAGE 166]


    # LINUX KERNEL

    DIRECTORY STRUCTURE


    Today in this project we tried to understand kernel directory structure. So let''s
    start. To understand the working of the linux kernel, one needs to know the directory
    structure of the kernel. Once you have a better understanding of it can easily
    find a piece of the code that will be required to change for your custom device
    added to the board. Suppose if you want to do any changes in your real hardware
    devices like RPi or you can say any of the Linux boards, we need to know which
    piece of the code we need to change. Suppose we have modified our RAM size and
    we have changed our booting option from MMC to NAND or NOR. We have increased
    the size of NAND or NOR, in that case we need to know where our driver resides
    so that we can go to that folder. we understand the code and change it. But before
    doing all those things, we need to know the exact location concept of all the
    basic drivers and then we are ready to go. For understanding of kernel source
    code, we did not have to download it, directly will go to the link below. This
    is just a kernel source repo of 4.9.142 and see what are the drivers or we can
    say what are the different folders available inside this one. Let''s copy this
    link now, go to the browser and paste it. This see is in the form of GIT and what
    is GIT I have already covered in the GIT separate project.'
