    \ Better you people go for practicing all those things. With practice you'll get\
    \ hands on and you will feel comfortable with the VIM editor.\n\n## REVISION CONTROL\
    \ (GIT)\n\nWe will be discussing GIT. So let's start. We'll start with the features\
    \ of GIT. Git is a version control system for tracking changes in computer files\
    \ and coordinating work on those files among multiple people. Just like a SVN,\
    \ it is primarily used for source code management in software development but\
    \ it can also be used to keep track of changes in any set of files. Git is more\
    \ powerful than SVN and in most open source projects, it is quite common. Now\
    \ we'll see some of the basic commands before going to the practical system. First\
    \ mandatory thing is we need to configure our user name and email-id using `git\
    \ config --global user.name` and `git config --global user.email`. The next step\
    \ is we need to create a repo. Without creating a repo, we cannot do anything\
    \ in the git. For that we can use `git init`. Now if a repo is already available,\
    \ then we can clone it either local or remote. So far cloning local repo, `git\
    \ clone <path_of_repo>`. If you are cloning a remote repo, we need to give additional\
    \ information like username and host IP address and then path. To add file to\
    \ repo just need the command `git add .`. After adding the file to repo, we need\
    \ to commit it then only those changes will go to repo. There is one concept here,\
    \ in git there are two copies, one is local copy and another is remote copy or\
    \ server copy. If you do `git commit .`, it will be stored in your local copy.\
    \ For making your changes to go in the master branch of the remote server or local\
    \ server, we need to push it using `git push` or `git push origin master`. Now\
    \ for checking our commit log. We can use `git log` and see how many codes we\
    \ have checked out. Similarly there is a command for checking the status of your\
    \ file changes using `git status` and one more thing I would like to say in any\
    \ of the version control only in git in SVN also or any other version control\
    \ tool, there is a concept of branch. So we can create multiple branches and we\
    \ can work in parallel. Checking out branches can be done using `git checkout\
    \ <branch_name>`. So any of the branches we can check out and work it out. Now\
    \ I will go to a practical session and see all those things. For that I will go\
