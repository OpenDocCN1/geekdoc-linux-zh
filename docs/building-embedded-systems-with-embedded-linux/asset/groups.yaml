    # INTRODUCTION


    We will try to understand some basic concepts of Linux and will see why Linux
    is required and what is the advantage of using Linux over Windows. So let us start,
    Linux is an open source operating system. Open source means it is free for use
    if you are doing in development then you''ll get the source code freely. You don''t
    have to pay for it unlike licensed software. It was developed from Unix by Linus
    Torvalds. One can use Linux free of cost unlike Windows. This means that unlike
    Windows we did not have to buy licenses. One can easily download from any of the
    Linux servers and use it. In Linux, most of the OS is free from the license. One
    can easily download... and use it. It is running on most platforms like computers,
    mobile servers and so on. For example if you''re running Ubuntu or Android this
    means directly or indirectly you are using Linux. Android is basically based on
    your Linux, only GUI front end is in Android which is written in Java. But the
    underlying structure is your Linux Kernel, root file system concept and others
    are based on the Linux environment. Based on the size and flavor, we''ll have
    flexibility to select so many choices and it is very powerful. One can run Linux
    even without installing in computer from either CD/DVD or pendrive.


    - Linux is an open source operating system.

    - It was developed from UNIX by Linus Torvalds.

    - One can use Linux OS free of cost unlike Windows.

    - It runs on most of the platforms like computer, mobile, server and so on.

    - It is very powerful and comes in different size and flavours.

    - One can run Linux OS even without installing in computer from either CD/DVD
    or pendrive.


    In the case of Windows, we need to install it fully then only can use Windows.
    But this is not the case in any Linux OS, without installing Linux provides functionality
    to test it. And if you want to try out some features before going for installation,
    you can install it directly from CD/DVD. Now we will see Linux flavor. Basically
    Linux comes in two types: one is Debian based, another one is RedHat based. Debian
    based most popular are Ubuntu. In RedHat based most popular are Fedora and CentOS.
    RedHat is very popular, basically it is used for server.


    # LINUX FLAVORS


    LINUX COMES IN MAINLY TWO TYPES FLAVORS:

    1. DEBIAN BASED

    2. REDHAT BASED


    ![](img/20a8a1dba21eed48c328710bf57d85d0_6_0.png)


    We''ll see why we should use Linux over Windows:

    First, already we have covered that Linux is free, not need to buy. Second, unlike
    Windows, we don''t have to stick to a particular distribution. In Linux we have
    multiple options based on size and GUI features. Because of that, Windows is huge
    and will be very slow, but if you have faster processing then you can opt for
    any small version of Linux and can do more processing tasks here without installing
    it directly from CD/DVD. This also we have covered for development purposes, Linux
    is much better than Windows. Here environment setup is very easy, and if you are
    a normal user, you don''t have to install it, most of Linux OS like Ubuntu are
    pre-installed. And also if you want to install any other packages through the
    command line will automatically set your environment. Now for protection of view,
    Linux OS are always less vulnerable for viruses and malware and other attacks.
    Viruses and malware are very less in comparison to Windows.


    ![](img/20a8a1dba21eed48c328710bf57d85d0_7_0.png)


    That''s why we generally don''t use any malware software or antivirus inside it.
    Now if you''re worried about using MS office tools then you don''t have to worry,
    it already provides open source tools. Now I will go for scope. Now we''ll see
    if there is scope of Linux engineer who is related to embedded environment. In
    terms of scope, there''s a vast market available for embedded engineers. Nowadays
    most of companies are moving their product design to Linux. This is basically
    because of the open source nature of Linux and the vast majority of support is
    available on the internet. You can design your code and can discuss with lot of
    other communities because it is open source and most of the people are doing their
    development. For example, in your house if you see some products, you''ll see
    it is based on embedded Linux like your router, smart TV, mobile phone and so
    on. In a smart TV, if you see based on Android and others, those are actually
    Linux based OS. All your Android based devices are based on embedded Linux customized
    to fit Android.


    # BASIC OF VIRTUAL MACHINE


    If you are able to see three pictures on the current slide, all three are virtual
    machines. First one is VirtualBox. Second one is VMware. And the third one is
    QEMU. All of the three are very popular and will see one by one all of the three.
    So let us start, we will start with the introduction. In computing a virtual machine
    is an emulation of a computer system. This means virtual machine will emulate
    complete computer system that is hard drive, RAM and other interfaces. It runs
    on your current operating system that is called host operating system and provides
    virtual hardware to guest operating system. From the guest operating system perspective,
    virtual machine is a real physical computer. Virtual virtual machine emulation
    engine call hypervisor it handle virtual hardware including CPU, memory, hard
    drive network interface and other virtual hardware devices provided by hypervisor
    map to real hardware on your physical machine.


    # INTRODUCTION


    - In computing, a virtual machine (VM) is an emulation of a computer system.

    - It runs on your current operating system (the host operating system) and provides
    virtual hardware to guest operating systems.

    - From the guest operating system''s perspective, the virtual machine is a real,
    physical computer.

    - The virtual machine''s emulation engine, called a hypervisor, handles the virtual
    hardware, including a CPU, memory, hard drive, network interface, and other devices.


    This means whatever resource is physically available on your real computer will
    be mapped with the virtual hardware through hypervisor. Even if it is software-wise
    related, internally it will be connected with your physical hardware. For example
    a virtual machine virtual harddisk is a file located on your harddisk. Now I will
    see types of VM. Basically they are two types of VM: one is a system virtual machine
    and another one is a process virtual machine. System virtual machine is your full
    virtualization VM where you will be running complete OS and provide functionality
    to execute complete operating systems. For example VirtualBox, VMware player,
    QEMU, etc. Now we will see a process virtual machine. It is sometimes called an
    application virtual machine. Basically, it is designed to run any application
    which is designed for another OS. For example Wine which is designed to run applications
    written for Windows is not full-fledged software but at least some of the common
    software which is written for Windows application can be run on Ubuntu or any
