  mdcn: "\n\n你经常会看到它要求你选择其中一个版本，那就是你的 GRUB。现在是嵌入式设备的启动程序。两种常见的启动程序是 U-boot 和 RedBoot。U-boot\
    \ 主要用于嵌入式设备，因为它的内存占用较小。由于占用较小，它缺乏图形界面（GUI）。它提供文本模式以进行快速处理，并且占据的空间非常小，小于 512 Kb，因为在大多数嵌入式设备中空间非常有限。这就是为什么优先选择\
    \ u-boot 而不是 GRUB。这非常常见，你可以在大多数 ARM 开发板上看到它。\n\n## U-BOOT 概念\n\n我们将讨论 u-boot 的概念。让我们开始吧。我们将从介绍开始，并尝试理解\
    \ u-boot 的基础知识。u-boot 代表通用启动加载程序（universal bootloader），通常缩写为 u-boot。它是许多嵌入式平台使用的开源主启动程序，用于启动设备操作系统内核并加载文件系统。它支持多种计算机架构，如\
    \ ARM、ARM 64位、x86、MIPS、microblaze 等。u-boot 既是第一阶段启动程序，也是第二阶段启动程序。它从支持的启动设备（如 SD\
    \ 卡、NOR、NAND flash）中的系统 ROM 读取。在这里我将尝试理解什么是系统 ROM。系统 ROM 是由制造商提供的第一阶段引导。系统 ROM\
    \ 会检查下一阶段，该阶段被视为 u-boot 的第一阶段。如果存在尺寸限制，u-boot 会将自己拆分为两个分区，如 SPL 和 u-boot。SPL 非常小，因为它需要加载到\
    \ SDRAM 中。它将执行基本的硬件配置，然后将控制权交给 u-boot。u-boot 将处理其他初始化。因此，无论是否使用 SPL，u-boot 都会执行第一阶段（即配置内存控制器和\
    \ SDRAM）以及第二阶段启动（通过多个步骤从各种必须配置的设备如 SD 卡、NAND、NOR、U 盘等上加载现代操作系统）。因此，u-boot 在串口上运行命令行界面。通过控制台，用户可以启动内核，并可能更改默认参数。有命令可以读取设备信息、读/写闪存内存、查看内存，然后从串口或网络下载文件。此外，我们还可以根据项目需要操作设备树并处理环境变量，然后还可以保存所有这些数据。默认启动命令和自动启动前的超时将在板卡中设置。现在看看什么是配置文件。在进入配置文件之前，我将尝试解释一点：对于任何\
    \ TI 板卡，你会在启动介质中看到两个文件：MLO 和 u-boot。所以 MLO 是 u-boot 提供的第一阶段启动程序。\n\n![](img/20a8a1dba21eed48c328710bf57d85d0_151_0.png)\n\
    \n- 在 uboot 中，用户需要首先为你的板卡选择默认配置文件。\n- 例如，对于 RPi 的真实 uboot 编译，defconfig 文件是 \"\
    rpi_3_32b\"。\n- 我们需要在其后面添加 `_defconfig`，然后进行交叉编译。\n- 配置文件的位置是 \"include/configs\"\
    。\n\n因此，系统 ROM 会拾取 MLO 并快速启动它，而 MLO 会检查后续步骤，即作为启动程序的 u-boot。现在我们来看看到如何编译我们的 u-boot。为此，我们需要理解配置文件是什么。配置文件是用来存放所有硬件配置的主文件。因此，我们需要知道并为你的板卡选择正确的配置文件。例如，RPi\
    \ 有 rpi_3_32b 作为默认配置文件，所有配置文件都存储在 include config 目录下。另一点，我们需要理解，为了交叉编译我们的 u-boot\
    \ 代码，我们需要在配置文件的末尾添加 `__defconfig`。这样我们就能对其进行交叉编译。现在是时候理解 u-boot 环境了，因为它是所有 u-boot\
    \ 设置的核心。没有它，u-boot 无法启动到下一个阶段（即我们的内核和根文件系统）。让我们了解它是什么。U-boot 环境是 u-boot 中用于启动板卡的独立区域。它存储了与\
    \ u-boot 和板卡相关的配置、设置和信息。我们可以使用 `help` 查看支持的命令列表。一些非常流行的命令是 `printenv`、`setenv`\
    \ 和 `saveenv`。这三个命令会被频繁使用，因为通过这些命令可以设置、分析并保存大部分参数。让我们了解一下\n\n## U-BOOT 环境\n\n\
    - 它是 uboot 中用于存储 u-boot 和板卡相关配置设置和信息的独立区域。\n- 我们可以使用 `help` 查看支持的命令列表。\n- 一些非常基础的命令是：\n\
    \  - Printenv - 显示当前的 uboot 环境。\n  - Setenv - 用于设置 uboot 中的环境变量。此设置仅保留在 RAM 中。\n\
    \  - Saveenv - 用于将 `setenv` 设置的环境保存到非易失性内存中。\n  - boot - 启动默认，即运行 'bootcmd'。\n\
    \  - bootd - 启动默认，即运行 'bootcmd'。\n\n`Printenv` 用于显示当前的 u-boot 环境。`setenv` 用于设置\
    \ u-boot 中的环境，但它只是将环境变量设置到 RAM 中，因此重启后设置会丢失。假设你想保存设置，我们需要执行 `saveenv` 命令。这样它就会将这些设置从\
    \ RAM 移动到你的非易失性内存中。现在有一个启动命令。\n"
