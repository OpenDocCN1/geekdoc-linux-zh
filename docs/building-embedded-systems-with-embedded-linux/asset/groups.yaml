  mdcn: "\n只有你可以使用 cursor 和模式。此外，不支持插件，它的功能并不全，就像 VIM 一样。我们现在将在实操环节查看所有这些内容，然后进入 Ubuntu\
    \ 查看所有这些功能。现在我将打开一个 hello world 示例来向你们展示 VI 的所有功能。所以这是我们普通的 VI 吗？看，这段代码没有语法高亮，现在它处于命令模式。要开始输入，我们需要按\
    \ `i`。然后我们才能开始使用键盘打字，现在光标移动已启用，因为我们处于命令模式。现在一旦开始输入，我们就不能使用光标方向键了。现在我会按它。要进入追加模式，我会使用\
    \ `a`。现在我可以使用 `i` 命令进入插入模式，再次按回车，如果你愿意，可以写任何内容，比如打印 Hello。现在我们将看到如何复制粘贴。假设我想复制这一行。我可以使用\
    \ `yy` 命令，然后粘贴，它就会为我粘贴。看它是怎么粘贴的。假设我想删除一行。我可以使用 `dd` 命令删除它。我们将看到一个撤销功能，只允许撤销一次。看，我们不能撤销超过一次，至于保存，我们可以使用\
    \ `w` 命令，它会保存。\n\n```c\n#include <stdio.h>\n\nint main() {\n    printf(\"Hello\
    \ \\n\");\n    printf(\"Hello \\n\");\n    return 0;\n}\n```\n\n现在我们可以使用 `q` 命令退出此窗口。这只是\
    \ VI 的基础。开始练习它，因为它在嵌入式平台上是必需，因为你找不到 VIM 编辑器，所以也开始练习这个。但为了开发目的，我们将使用 VIM 编辑器，因为\
    \ VIM 非常用户友好并且具有语法高亮。\n\n# 编辑器 (VIM)\n\n我们将讨论 VIM 编辑器。由于我们已经涵盖了 VI 编辑器，所以我们将看到\
    \ VI 与 VIM 有何不同。让我们从 VIM 的功能开始，查看一些命令。之后，我们将针对我们的目的直接编辑 VIM 文件。我们将从功能开始。从功能性来说，VIM\
    \ 几乎是 VI 的一个真正的超集。因此，VI 中的所有内容在 VIM 中都是可用的。这可能预装也可能没有。它非常强大，但需要更多的磁盘空间。这就是为什么通常在嵌入式\
    \ Linux 操作系统中找不到它。但为了开发目的，我们将使用 VIM 编辑器而不是 edit nano 或 VI，因为正如已经讨论过的，它是这四个编辑器中最功能强大的。\n\
    \n![](img/20a8a1dba21eed48c328710bf57d85d0_59_0.png)\n\nVIM 包含了对语法高亮、代码折叠等支持。它适用于大多数流行的编程语言。它与\
    \ Cscope 和 ctags 集成。这些内容稍后我们会介绍。Cscope 和 ctag 基本上用于代码搜索，非常强大。没有它们，你无法解析非常大的代码。因此使用\
    \ VIM，我们可以集成 Cscope 和 ctag。VIM 包含多级撤销和重做。在 Vi 中，我们看到没有提供多级撤销和重做，但在 vim 中是可用的。VIM\
    \ 允许为了编辑目的拆分屏幕。因此，使用 VIM，我们实际上可以将屏幕分成两个并行窗口。VIM 无法编辑 zip、tar 等压缩归包内部的文件。我们也可以用它来区分两个文件。它被用于编辑，甚至是编辑二进制文件。我们可以使用\
    \ VIM 编辑甚至二进制文件。它包含了对插件的支持，以及对配置和启动文件的最终控制。现在我们将看到一些基本命令，之后我们将进入实操环节，在那里我们将运行\
    \ VIM 命令。光标移动由方向键控制。\n\n* Vim 与 cscope 和 ctags 集成。\n* Vim 包含多级撤销/重做。\n* Vim 允许拆分屏幕以编辑多个文件。\n\
    * Vim 可以编辑压缩归包（zip, tar, 等）内部的文件。\n* Vim 包含了内置的 diff 用于比较文件 (vimdiff)。\n* Vim\
    \ 可以显示并编辑甚至是二进制文件。\n* Vim 包含了对插件的支持以及对启动文件的更精细的控制。\n\n可以使用普通的删除键或退格键来删除字符。可以通过\
    \ `dd` 命令完成删除行。同样复制行也是如此。你可以使用 `yy` 复制，粘贴可以使用 `p` 命令，并且存在模式切换，正如我们在 VI 项目中已经讨论过的样，使用\
    \ `escape` 和 `insert` 我们可以切换模式，从命令模式切换到写入模式，然后使用 `q` 命令退出。你现在退出 Vim。如果你想在不保存的情况下退出，只需输入\
    \ `:q!`。你可以使用 `w` 命令保存文件。同样，在 VIM 内部搜索，你可以使用斜杠命令，并且我们已经看到了拆分等功能。拆分有两种类型：一种是水平拆分，另一种是垂直拆分。到为止，水平拆分我们可以给出\
    \ `split` 命令，而垂直拆分我们可以使用 `vsplit` 命令。\n\n```\n* 不保存退出: q!\n* 保存文件: w\n* 文本搜索:\
    \ /\n* 拆分: split (水平) 和 vsplit (垂直) 命令。然后你可以使用 Ctrl-W 方向来切换窗口（方向是方向键之一）。\n* 快速查表:\
    \ http://vimsheet.com/\n```\n\n实际上，你可以使用 `control w` 方向从此拆分窗口的一个窗口切换到另一个窗口，其中方向是方向键之一。所以现在你看到一个方向键之一。一个窗口......到到到到到....to..to.........\
    \ to... 的方向键..，我们能够上下移动。\n"
