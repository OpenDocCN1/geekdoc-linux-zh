    - Open a terminal window.

    - Navigate to the directory where you saved the script using the cd command.

    - Make the script executable by running `chmod +x calculate_sum.sh`.

    - Run the script by typing ./calculate_sum.sh and pressing Enter.

    - Follow the prompts to enter two numbers.

    - The script will then calculate the sum and display the result in the terminal.


