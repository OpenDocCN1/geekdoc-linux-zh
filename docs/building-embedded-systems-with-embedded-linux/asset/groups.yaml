    # INTRODUCTION


    +   * In computing, a virtual machine (VM) is an emulation of a computer system.

    * It runs on your current operating system (the host operating system) and provides
    virtual hardware to guest operating systems.

    * From the guest operating system''s perspective, the virtual machine is a real,
    physical computer.

    * The virtual machine''s emulation engine, called a hypervisor, handles the virtual
    hardware, including a CPU, memory, hard drive, network interface, and other devices.


    This means whatever resource is physically available on your real computer will
    be mapped with the virtual hardware through hypervisor. Even if it is software-wise
    related, internally it will be connected with your physical hardware. For example
    a virtual machine virtual harddisk is a file located on your harddisk. Now I will
