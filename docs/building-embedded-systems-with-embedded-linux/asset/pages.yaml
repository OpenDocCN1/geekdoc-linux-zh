    SSH (Secure Shell):

    Connects to a remote Linux machine securely.

    Bash

    sh <username>@<hostname> # Connects to

    t remote machine

    Use code with caution.

    Once connected, you can use standard Linux

    commands on the remote machine.

    2. SCP (Secure Copy):

    Securely copies files between local and remote

    machine (uses SSH).

    Bash

    scp <source_file> <username>@<hostname>:

    <destination_file> # Copy to remote machine

    scp <username>@<hostname>:<source_file>

    <destination_file> # Copy from remote machine

    Use code with caution.

    3. WinSCP (Windows):

    A graphical SFTP client for Windows for secure

    file transfer (similar to SCP).

    Use the WinSCP interface to browse files on the

    remote server, upload/download files, and

    manage directories.

    4. TFTP (Trivial File Transfer Protocol):

    ```'
