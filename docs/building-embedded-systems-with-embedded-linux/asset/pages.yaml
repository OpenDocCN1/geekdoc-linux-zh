  md: '# QEMU WITH NETWORK SUPPORT


    We will see how to enable network support in Qemu but before that we will go some
    of the theory projects and understand how to create this one. Let us start. We
    will try to understand the first tap and tan network. That will be required enabling
    network support in Qemu. TUN and TAP interfaces are software only interfaces meaning
    that they exist only in the kernel and unlike regular network interfaces they
    have no physical hardware component, and so there is no physical wire connected
    to them. TUN network is mainly used to simulate network layer devices and it operates
    with layer three packets like IP packets. TAP is basically used to simulate link
    layer devices and it operates with layer packets like ethernet frames. It behaves
    like just a network adapter except it is the virtual network adapter. Mainly we
    will be using a tap network. for the RPi which will create a virtual ethernet
    device that will be only in software not a real ethernet device. TUN is basically
    used in routing, TAP is used for creating our network. bridge. A lower traffic
    overhead transports only traffic which is destined for VPN clients.'
  merge: -1
