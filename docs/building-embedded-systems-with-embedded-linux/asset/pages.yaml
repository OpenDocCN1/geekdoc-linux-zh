  md: '# INTRODUCTION


    +   * In computing, a virtual machine (VM) is an emulation of a computer system.

    * It runs on your current operating system (the host operating system) and provides
    virtual hardware to guest operating systems.

    * From the guest operating system''s perspective, the virtual machine is a real,
    physical computer.

    * The virtual machine''s emulation engine, called a hypervisor, handles the virtual
    hardware, including a CPU, memory, hard drive, network interface, and other devices.


    This means whatever resource is physically available on your real computer will
    be mapped with the virtual hardware through hypervisor. Even if it is software-wise
    related, internally it will be connected with your physical hardware. For example
    a virtual machine virtual harddisk is a file located on your harddisk. Now I will
    see types of VM. Basically they are two types of VM. One is a system virtual machine
    and another one is a process virtual machine. System virtual machine is your full
    virtualization VM where you will be running our Complete Os and provide functionality
    to execute complete operating systems. For example virtual box, vmware player
    ,qemu, etc. Now we will see a process virtual machine. It is sometimes called
    an application virtual machine. Basically, it is designed to run any application
    which is designed for another OS. For example Wine which is designed to run applications
    written for Windows is not full fledged software but at least some of the common
    software which is written for Windows application can be run on Ubuntu or any
    of the Linux flavors using Wine software. In process virtual'
