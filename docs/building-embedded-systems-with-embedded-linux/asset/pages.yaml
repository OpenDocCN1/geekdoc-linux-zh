  md: '# BOARD SUPPORT

    PACKAGE


    Today in this project I will try to understand the board support packages. This
    is the heart of any bring up. Inside board support packages, we need to configure
    our packages so that it will fit for our custom board. So let us understand what
    board support packages are. Now we will go to basic. Mainline kernel works out
    of box for a number of development boards like RPi, beaglebone black and so on.
    But in most cases, you will need a BSP from a board or chip vendor. It may lag
    the mainline kernel but the fine level of support varies between vendors. That''s
    why we need to choose a vendor properly so that we''ll get proper support. If
    you''re developing your board you need to have your own code. You need to write
    some BSP code to bring up your board. Now we will see what the level of board
    support is. Basically it is divided into three categories. One is architecture,
    another one is chip level support and third one is board level support.'
  merge: -1
  pgno: 174
- img_proc: true
  md: "# LEVELS OF BOARD SUPPORT\n\n+   - Architecture\n- arm,mips, powerpc, x86,...\n\
