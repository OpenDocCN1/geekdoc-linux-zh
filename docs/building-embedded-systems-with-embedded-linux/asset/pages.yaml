  md: '# U-BOOT CONCEPT


    We will be discussing the u-boot concept. So let''s start. We''ll start with the
    introduction and try to understand the basics of u-boot. So u-boot stands for
    universal bootloader. It is often shortened to u-boot. It is the open source primary
    bootloader used in many of the embedded platforms to boot device operating system
    kernel and Load File System. It is available for a number of computer architectures
    like ARM, ARM 64 bit , x86, MIPS, microblaze and so on. U-boot is both first stage
    and second stage bootloader. It is system ROM from a supported boot device such
    as SDCard, NOR, NAND flash. Here I will try to understand what system ROM is.
    System ROM is the first stage BO provided by your manufacturer. The system ROM
    will check for the next stage that will be considered as the first stage for the
    u-boot. If there is a size constraint u-boot splits itself into two partitions
    like SPL and u-boot. SPL is very small because it needs to be loaded into SDRAM.
    It will do basic hardware configuration and then it will give the control to u-boot.
    That will take care of other initialization. So regardless of whether SPL is used
    u-boot performs first stage that is configuring memory controller and SDRAM and
    second stage booting, performing multiple step to load a modern operating system
    from a variety of devices that must be configured like SD card, NAND, NOR, pendrive
    and so on. So u-boot runs a command line interface on a serial port. Using a console
    user can boot a kernel, possibly changing parameters from the default. There are
    commands to read device information, read, write flash memory, memory then download
    files from the serial port or network. Also we can manipulate device trees and
    work with the environment'
