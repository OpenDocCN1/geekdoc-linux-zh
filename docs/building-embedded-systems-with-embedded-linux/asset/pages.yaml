  md: '# EXAMPLE CODE


    ```

    This script takes two numbers as input and calculates their sum:

    !/bin/bash


    # Prompt the user to enter the first number

    echo "Enter the first number:"

    read num1


    # Prompt the user to enter the second number

    echo "Enter the second number:"

    read num2


    # Calculate the sum

    sum=$((num1 + num2))


    # Display the result

    echo "The sum of $num1 and $num2 is: $sum"

    ```


    To run this script:

    Open a text editor and copy the code into it.

    Save the file with a .sh extension, for example, calculate_sum.sh.

    Open a terminal window.

    Navigate to the directory where you saved the script using the cd command.\nMake
    the script executable by running chmod +x calculate_sum.sh.

    Run the script by typing ./calculate_sum.sh and pressing Enter.

    Follow the prompts to enter two numbers.

    The script will then calculate the sum and display the result in the terminal.'
