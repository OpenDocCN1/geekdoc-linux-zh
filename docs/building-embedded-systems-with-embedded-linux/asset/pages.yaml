    - Board\n  - SoC manufacturer evaluation boards\n  - TI EVM, RPI board\n  - COTS\
    \ boards\n    - Digi, Eurotech, etc\n\nIn architecture, you will see support like\
    \ ARM, PowerPC and so on. In chip level support, you will get support for your\
    \ particular chip like RPI, TI board related support and so on. For board related\
    \ support, we need to know two terms. One is evaluation board support and another\
    \ one is COTS board support. In the evaluation board support, you will see TI\
    \ EVM and RPI boards. In the COTS board, basically, This is provided by Digi and\
    \ Euro tech and many other vendors. Now I will see what COTS board is. COTS board\
    \ is called commercial off-the-shelf. It is used as it is. COTS boards are designed\
    \ to be easily installed. Almost all the software bought by the average computer\
    \ user fits the COTS category, operating system, Office suits, word processing\
    \ and e-mail programs are among the common examples. Major benefits of COTS boards\
    \ are mass produced and that's why it is low cost. Now we'll see chip level support\
    \ and board level support. Chip level support is basically done by"
