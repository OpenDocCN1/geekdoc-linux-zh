  md: 'A simpler file transfer protocol, often used for initial configuration or firmware
    updates on network devices.

    TFTP Server (on your Linux machine):


    ```

    Bash

    tftpd & # Start the TFTP server in the background

    ```


    Use code with caution.

    TFTP Client (on a different machine):


    ```

    Bash

    tftp <hostname> <filename> # Download a file from the TFTP server

    tftp -p <local_port> <hostname> <filename> # Download, specifying a local port
    (optional)

    ```


    Note: TFTP doesn''t offer encryption or authentication, so use it with caution
    on untrusted networks.


