    \ 客户端，但 OES Linux 不需要 Novell 客户端即可实现完全的管理功能。\n\n你可以选择三种方法之一在工作站上安装 Novell 客户端：\n\
    \n- 从 http://download.novell.com 下载并安装 Novell 客户端。Novell 定期发布带有新功能的更新客户端，因此互联网上的客户端文件可能比这里描述的版本更新。定期检查此位置以获取更新。\n\
    - 从 Web 服务器安装 Novell 客户端。\n- 使用 Novell 客户端升级程序升级现有工作站。\n\nNovell 提供了 Windows XP/2000（当前版本为\
    \ v4.91）和 Windows 9x（当前版本为 v3.4）的 Novell 。这两个版本的安装过程相同，无论运行的是何种版本的 Windows，都可以使用安装、配置和删除说明。\n\
    \nNovell 也即将完成 Linux 工作站 Novell 客户端的开发。尽管在写作时还没有完整信息，但预计这种新客户端将许多对 Windows 用户非常重要的客户端功能带到\
