    ## Chapter 10. Identity Manager Bundle Edition


    - Instant Access

    - How Identity Manager Works

    - Installing the Identity Manager Engine

    - Installing Remote Loaders and Drivers

    - Installing Identity Manager on a Secondary eDirectory Tree

    - Configuring an Identity Manager Driver

    - Identity Manager Password Synchronization


    ## Instant Access


    Installing the Identity Manager Bundle Edition


    - Install the Identity Manager engine from the Identity Manager Bundle Edition
    CD-ROM using the command-line installation program.

    - Install Identity Manager drivers and management plug-ins (for iManager) from
    the Identity Manager Bundle Edition CD-ROM at the application server or workstation
    destination.


    ## Configuring Identity Manager Bundle Edition


    - Use the Identity Manager management plug-ins to configure and manage your Identity
    Manager environment from iManager.


    Originally released in the fall of 2001 as DirXML, Identity Manager has become
    an award-winning and groundbreaking tool for integrating the diverse systems in
    today''s modern networks. OES Linux includes a fully functional version of Identity
    Manager suitable for linking today''s most common directory systems into a cohesive
    whole.


    NOTE


    The rename of DirXML to Identity Manager was a fairly recent change. As such,
    a number of utilities still reference Identity Manager as DirXML. For all practical
    purposes, these two terms are synonymous.


    Derived from Nsure Identity Manager 2, Identity Manager Bundle Edition enables
    you to bidirectionally synchronize data and passwords between Novell Directory,
    Microsoft Active Directory, and Microsoft NT domains.


    ## How Identity Manager Works


    Identity Manager Bundle Edition allows to link your disparate network data sources
    together, as shown in Figure 10.1.


    Figure 10.1. Logical architecture of Identity Manager


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_180_0.png)


    The Identity Manager architecture consists of several components that work together:


    - Identity Manager Engine: Running on OES Linux, the Identity Manager engine functions
    as the hub. It uses Extensible Markup Language (XML) to process events. If you
    have selected to install the DirXML server, it will be the central repository.
    This publish/subscribe model gives you complete control over the nature of data.

    - Identity Manager Drivers: To participate in synchronization, Identity Manager
    drivers act as "spokes" or channels that subscribe to data changes in the central
    directory and publish them locally.


    NOTE


    To simplify configuration, Identity Manager Bundle Edition provides configuration
    files you can import to set up driver rules and filters.


    ## Installing the Identity Manager Engine


    Identity Manager components are installed on those servers that will participate
    in the synchronization. iManager components must also be installed on your iManager
    server. To install the Identity Manager engine on your OES Linux server, complete
    the following steps:


    1. At the OES Linux server where you want to install Identity Manager, insert
    the Identity Manager Edition CD-ROM.

    2. Mount the CD-ROM, and then locate and execute the installation program /setup/dirxml.bin.
    You must execute this command as the root user.

    3. Review the Welcome information and press Enter to continue.

    4. At the License Agreement screen, review the agreement and enter Y to accept
    the usage terms.

    5. Specify the appropriate number for the components you want to install. Remember
    that Identity Manager drivers and management components can be installed on separate
    servers from the Identity Manager engine. To install multiple components on the
    local server, either perform the installation multiple times, or select option
    4 and customize the component list.

    6. (Optional) Depending on the options you entered, you may be prompted for LDAP
    credentials or the server''s SSL port.

    7. Verify the summary information and press Enter to begin the package installation.
    If you have selected to install the DirXML server, your eDirectory server will
    be shut down during the installation.

    8. After the installation has completed, press Enter to close the installation
    program.

    9. (Optional) If you only installed the DirXML engine, repeat the installation
    and install the web-based Administrator components (option 3) on your iManager
    server. This is required to install the DirXML-plugins for iManager. After installing
    the plug-ins, restart Apache before the plug-ins will take effect.

