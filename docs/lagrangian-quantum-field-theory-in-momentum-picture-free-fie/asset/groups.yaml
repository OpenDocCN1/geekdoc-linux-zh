    # Editing Text Files


    A chapter on working with SLES would not be complete without a discussion on one
    more important topic editing text files. Although editing text files may not look
    like a difficult subject, common tools used when editing text files under Linux
    to be rather cryptic. Developing some space in this chapter to help up confusion
    in this area should make first-administrators much more comfortable and effortless
    with any task involved editing.


    # The Vi Utility


    It is possible to use graphical-editing tools under SLES. Many such tools are
    easily available in both the KDE and GNOME graphical environments. However, a
    reliance on graphical editors (such as Kate or Gedit) produces a dependence on
    a graphical environment. This graphical environment is often not running on a
    SLES machine. Also, when using a remote shell for SLES administration, graphical
    tools require tunneling over SSH. Rather than tunneling this or using a graphical
    session on the server, learning and using a command-line editor is ever a better
    solution for the long term.


    As in the graphical environment, every command-line text editor is available.
    Among the choices for command-line editors are pico, emacs, and vi. Pico and emacs
    are powerful text editing utilities that offer several appealing qualities. However,
    these utilities are not always available on SLES installations. The vi utility
    is the only utility guaranteed to be available with any Linux installation.


    NOTE


    The vi on SLES is actually the Vi Improved, or vim utility. As vim is designed
    to be compatible with vi, it is still referred to as vi.


    The vi is an extremely powerful text-editing utility. Unfortunately, the almost
    limitless capabilities of vi have caused its usage to become fairly cryptic and
    challenging for new users. The most important concept to understand is that vi
    operates in a bimodal fashion. Bimodal means that when using vi, you can be in
    one of two possible modes—command mode or insert mode.


    The command-mode environment is used for tasks such as performing file operations,
    copying and pasting text, performing global search-and-replace operations, and
    working with macros. The insert mode of vi is used for normal text-editing operations.
    Probably more important than the two modes is the ability to determine what mode
    vi is currently in!


    When is launched, the interface is left in command mode. It is important to understand
    that direct file editing is not possible in command mode. Text can be copied and
    pasted, and various actions such as deleting text can be accomplished, adding
    additional text to the file by typing is not possible. In order to add text to
    the document, you must first switch to insert mode.


    Insert mode is entered by pressing "i" or one of the few insert text keys. When
    in insert mode, the bottom of the window will display the " INSERT \ Prior to
    adding text to the file, be sure you are in the correct mode by looking at the
    bottom of the window for that. When you''re in insert mode, you can switch back
    to command mode by pressing the ESC key.


    Table 3.20. Commands Used to Enter Insert Mode


    | KEYSTROKE | DESCRIPTION |


    | i | Change to insert mode and place the active cursor before the current character.'
