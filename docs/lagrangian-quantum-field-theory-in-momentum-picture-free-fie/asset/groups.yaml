    \ is complete, you are ready to configure eGuide.\n\n# Configuring eGuide\n\n\
    # Additional OES Linux Web Services\n\nIn addition to the web application, OES\
    \ Linux includes other pieces to the web services, including MySQL. Although an\
    \ in-depth discussion of these utilities is beyond the scope of this book, a brief\
    \ introduction to these services is in order.\n\n# MySQL\n\nMySQL is an open source\
    \ SQL (Structured Query Language) database program. It is easy to install and\
    \ use, but offers exceptional power, security, and scalability. In fact, because\
    \ of its small size and speed, it is an ideal platform for delivering database\
    \ capabilities. MySQL runs on a wide variety of operating systems other than Linux,\
    \ making it ideal for today's heterogeneous network. MySQL platforms include,\
    \ in addition to Linux, NetWare, Microsoft Windows NT/2000, Solaris, IBM AIX,\
    \ FreeBSD, OS/2, and others. You don't have to learn different database systems\
    \ just you have different platforms.\n\nMySQL can be installed during the OES\
    \ installation, or thereafter through YaST.\n\n# Perl and PHP Scripting Support\n\
    \nCommon Gateway Interface (CGI) scripting is the most common way for a web server\
    \ to interact with users It provides the capability to create dynamic content\
    \ and increase the sophistication and functionality of your web pages. Because\
    \ of this, Novell offers multiple scripting languages with OES Linux, with the\
    \ goal of not making you learn another coding method to get your job done.\n\n\
    The most commonly recognized scripting languages are Perl (Practical Extraction\
    \ and Report Language) and PHP (Hypertext Preprocessor).\n\nPerl is an open-source\
    \ language that was originally created specifically to process text. Because of\
    \ this, it is particularly good at text parsing and web page generation and task\
    \ automation.\n\nPHP is a server-side HTML-embedded scripting language. It can\
    \ be used to create dynamic web pages, collect form data, and receive cookie information.\
    \ It can also be used for talking to other services through protocols such as\
    \ IMAP, SNMP, and HTTP. PHP supports a wide range of web services and databases,\
    \ but is most commonly used with Apache Web server and MySQL. This makes it a\
    \ natural choice for the OES Linux web environment.\n\nBoth Perl and PHP support\
    \ for Novell services offered with OES Linux is provided in the Novell Developer\
    \ Kit (NDK) that is included with OES. For more information on the NDK, see the\
    \ OES online documentation, and visit http://developer.novell.com/ndk.\n"
