    # Instant Access


    Effective management of a SLES environment requires a working knowledge of the
    SLES startup process, including an understanding of the GRUB bootloader configuration
    and all boot-related files.


    Processes can be administered through the use of signals and process-related commands.


    Kernel and kernel module management involves understanding the contents of the
    /boot directory and configuration files found in the /etc directory.


    SLES administration is centrally located in the YaST command-line or graphical
    utility. All major SLES components can be managed via this interface.


    Although command-line editing of configuration files can also be used to accomplish
    administrative tasks, SuConfig may overwrite changes unless these changes are
    performed via YaST.


    System updates must be installed via the Red-Carpet software management system
    after installing OES. Using the YaST Online Update module can result in an inoperable
    server!


    Effective troubleshooting of SLES should involve the use of log files found within
    the /var/log directory. If additional investigation is required, Rescue Mode and
    a large number of additional investigative tools are available.


    SLES administration is a broad and complex topic. This chapter will discuss core
    server administration tasks and important OES component administration concepts.
    Specifically, this chapter will cover the system startup process, process management,
    logging facilities, and kernel management concepts. SLES and OES component administration
    through the YaST utility, and software installation options will also be discussed.


    In addition to the administration concepts mentioned here, there are many other
    Linux topics you may be interested in exploring. Novell Education has several
    Linux-specific programs that will provide a more comprehensive insight into Linux
    administration. For more information on Novell''s SUSE Linux certification options,
    see the Novell Education website at http://www.novell.com/education.


    # SLES Startup Procedures


    After you power on your SLES, the operating system is initialized and background
    services (including OES daemons) are started by the server providing a login prompt.
    As an administrator, it is important for you to understand the process your SLES
    server follows to bring the server up to this usable state.


    ## Bootloader Configuration


    By default, a SLES installation uses the GRUB Unified Bootloader (GRUB) to load
    the Linux kernel into memory. GRUB performs this task by writing a loader program
    to the Master Boot Record (MBR) of the first hard disk in the computer system.
    Following the computer''s Power-On SelfTest (POST) process, GRUB will be initialized
    and able to load the appropriate Linux kernel into memory.


    GRUB employs a dual-stage loader in which the configuration of GRUB is stored
    on the local filesystem under /boot/grub/. This directory is known as the GRUB
    Root Partition and contains the configuration files used by GRUB loader. With
    a SLES installation, the file containing GRUB menu options is called menu.list
    and resides within this GRUB Root Partition. An example of menu.list is shown
    in Figure 6.1.


    Figure 6.1. A sample SLES9 menu.list configuration file.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_103_0.png)


    The menu.list contains a listing of possible boot configurations for the computer.
    These configurations typically include at least a normal boot and a failsafe configuration.
    All possible boot configurations are listed in menu.list and identified using
    the title directive. Each of these entries includes a reference to the kernel
    being used and any of kernel parameters, which are used during the initialization
    process. The kernel parameters are required for proper hardware initialization
    and can be customized to meet requirements of the SLES server.


    Table 6.1. Common Kernel Parameters


    | PARAMETER | DESCRIPTION |

    |---|---|

    | acpi=off | When this parameter is set to off, Advanced Configuration and Power
    Interface (ACPI) system is completely disabled. |


    # Interacting with Processes


    All processes within Linux are assigned a Process ID (PID). This PID can be used
    to manage and interact with each process. To locate the PID of a running process,
    you can use the ps command, as shown in Figure 6.5.


    Figure 6.5. The output of the ps command.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_106_0.png)


    By default, the ps command produces a listing of all running processes in the
    current shell session. Using command-line switches, processes running in other
    sessions and background daemons can also be viewed. The information displayed
    for each process includes such things as the user who initiated the process, the
    Process ID (PID), and the Parent Process ID (PPID).


    The first process started on a Linux server is the init process. All other processes
    are either spawned by init or by a process already started by init. This produces
    a hierarchical structure for running processes. Using the PPID and the PID, the
    path back to the init daemon can be tracked and is useful when tracking down rogue
    or problematic processes.


    Another command useful for tracking down processes is top, shown in Figure 6.6.
    The top utility can be used to viewing processes and also has the advantage of
    viewing processes based on statistics such as CPU utilization, memory usage, or
    other parameters.


    Figure 6.6. The output of the top command.


    [View full size image]


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_106_1.png)

