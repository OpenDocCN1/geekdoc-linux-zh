    \ Windows 资源管理器中，其功能与通过 Novell 映射的驱动器相同。基本上，映射驱动器的功能已从 Novell 客户端中提取，可以独立于所有 Novell\
    \ 客户端功能使用。有关 Novell 客户端的更多信息，请参阅第 4 章“OES Linux Clients”。\n\n# NetDrive 前提条件\n\
    \nNetDrive 可运行任何 Windows 工作站上，包括 Windows 95/98/Me 以及 Windows XP/2000/NT。您只需要在硬盘上有\
    \ 2MB 的可用空间即可安装并运行 NetDrive 客户端。\n\n# 警告\n\n如果您在 Windows 95 工作站上安装 NetDrive 客户端，请确保您已安装了微软提供的\
    \ Winsock 2 更新。该更新可以在微软网站上找到。\n\nNetDrive 支持三种访问网络文件的协议：\n\n- WebDAV：NetDrive\
    \ 与 NetStorage 集成，提供一种客户端开销极小的文件访问解决方案。在使用 WebDAV 的 NetDrive 之前，必须安装并配置 NetStorage。\n\
    \n- FTP：NetDrive 可以使用标准文件传输协议（FTP）访问网络文件。在使用 FTP 的 NetDrive 之前，必须在您的网络上安装并配置 FTP\
    \ 服务器。在 OES 中，您可以使用本章稍后描述的优化 FTP 服务器之一来提供此类访问。\n\n- iFolder：NetDrive 可以访问从您的目录到\
    \ iFolder 服务器的访问。在使用 iFolder 的 NetDrive 之前，必须安装 iFolder 并配置您的 iFolder 账户。\n\n\
    协议的选择在很大程度上取决于您的网络环境。没有哪种协议是优于其他的。请使用适合您网络策略的协议。\n\n# 使用 NetDrive\n\n最新版本的 NetDrive\
    \ 客户端可以通过在 http://support.novell.com/finder 搜索 netrive 来获取。如果您需要安装 NetDrive 客户端的帮助，请参阅第\
    \ 4 章。\n\n安装 NetDrive 客户端后，您可以使用标准的 Internet 协议访问任何 OES Linux 服务器上的文件。然而，并非每个\
    \ Windows 版本都支持所有协议。\n\n- iFolder：Windows NT 和 XP/2000\n- FTP：Windows 95, 98,\
    \ NT 以及 XP/2000\n- WebDAV (HTTP)：Windows 95, 98, NT 以及 XP/2000\n\n# Novell iFolder\n\
    \nNovell iFolder 为您的硬盘和 iFolder 服务器之间的文件提供自动、安全且透明的同步，从而可以随时随地地访问个人文件。能够从任何位置的任何计算机访问您的文件，消除了当本地文件无法通过网络访问时频繁需要进行的更新。\n\
    \nNovell iFolder 有三个组件：\n\n- iFolder 服务器：在您在服务器上安装了 iFolder 服务器后，用户可以安装 iFolder\
    \ 客户端来访问您的文件。管理员使用 iFolder 管理控制台来管理 iFolder 用户账户。iFolder 管理控制台允许您对所有 iFolder 用户账户执行管理任务，并根据您组织的视觉效果和感受进行自定义。\n\
    \n- iFolder 客户端：Novell iFolder 客户端兼容 Windows 95/98、Windows XP/2000/NT 和 Linux。在您用于访问\
