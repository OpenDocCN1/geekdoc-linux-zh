    # 概览


    作为 SUSE Linux 系统上 Novell Open Enterprise Server 的管理员，你正在寻找利用该系统作为平台来提供 Novell
    强健网络服务的方法。无需另处寻觅。《SUSE Linux 和 Open Enterprise Server 管理员手册》将为你提供所需信息，以便在运行 SUSE
    的系统上利用各种 Novell 工具。你将涵盖 SUSE Linux 平台上 Open Enterprise Server (OES) 的主要组件和功能。通过关注
    OES 在 SUSE Linux 上的实现，你将理解如何将 OES 的优势集成到现有环境中。本书并非一部关于网络理论、协议或架构的参考性著作；它将为你提供建立建立功能所需概念的简要介绍。《SUSE
    Linux Novell Open Enterprise Server 管理员手册》将帮助你快速获取完成工作所需的技术、概念或工具信息。


