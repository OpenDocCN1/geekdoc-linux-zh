    nThe Windows tab, not shown in Figure 4.6, is only available prior to logging
    in to Windows. From this tab, you can specify the Windows username and workstation
    name that will be used by the Novell Client to transparently log you into the
    workstation part of the Novell login process.


    # NDS Tab


    The NDS tab, as shown in Figure 4.6, allows you to specify the eDirectory tree,
    name context, and server to use during login. All users should specify their eDirectory
    tree and name context. A server needs to be specified only when connection to
    a NetWare 3 server is needed or when you are trying to log in to a specific server.
    When logging into a Linux server, that must be running OES. In order to map drives
    to that Linux server, the NCP Server OS component must be installed.


    # Script Tab


    The Script tab (see Figure 4.7) is used to manage the execution of login scripts.
    It allows you to specify whether or not to run scripts; whether or not to display
    the login results (close it automatically); and which profile and user login scripts
    to execute. The Variables button allows you to specify values for any script variables
    that might be included in the login scripts.'
