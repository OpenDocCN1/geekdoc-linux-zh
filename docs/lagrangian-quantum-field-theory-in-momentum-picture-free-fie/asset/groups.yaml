    # # SLES Startup Procedures


    After you power on your SLES, the operating system is initialized and background
    services (including OES daemons) are started by the server providing a login prompt.
    As an administrator, it is important for you to understand the process your SLES
    server follows to bring the server up to this usable state.


    # ## Bootloader Configuration


    By default, a SLES installation uses the GRUB Unified Bootloader (GRUB) to load
    the Linux kernel into memory. GRUB performs this task by writing a loader program
    to the Master Boot Record (MBR) of the first hard disk in the computer system.
    Following the computer''s Power-On SelfTest (POST) process, GRUB will be initialized
    and able to load the appropriate Linux kernel into memory.


    GRUB employs a dual-stage loader in which the configuration of GRUB is stored
    on the local filesystem under /boot/grub/. This directory is known as the GRUB
    Root Partition and contains the configuration files used by GRUB loader. With
    a SLES installation, the file containing GRUB menu options is called menu.list
    and resides within this GRUB Root Partition. An example of menu.list is shown
    in Figure 6.1.


    Figure 6.1. A sample SLES9 menu.list configuration file.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_103_0.png)


    The menu.list contains a listing of possible boot configurations for the computer.
    These configurations typically include at least a normal boot configuration and
    a failsafe configuration. All possible boot configurations are listed in menu.list
    and identified using the title directive. Each of these entries includes a reference
    to the kernel being used and any of possible kernel parameters, which are used
    during the initialization process. The kernel parameters are required for proper
    hardware initialization and can be customized to meet specific requirements of
    the SLES server.


    Table 6.1. Common Kernel Parameters


    | PARAMETER | DESCRIPTION |

    |--- |--- |

    | acpi=off | When this parameter is set to off, the Advanced Configuration and
    Power Interface (ACPI) system is completely disabled. |'
