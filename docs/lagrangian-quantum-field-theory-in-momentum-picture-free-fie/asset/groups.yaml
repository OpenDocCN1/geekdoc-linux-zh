    # Installing the Client Software


    To install the Novell client software on a Windows workstation from an OES Linux
    server, download the latest client from http://download.novell.com and complete
    the following steps:


    NOTE


    You can use the following procedure whether you''re installing a new network workstation
    or upgrading an existing workstation. If you are upgrading an existing workstation,
    the installation program will detect existing settings (such as the protocol used,
    the network card, and other features) and use those same settings as the defaults
    for the upgraded workstation.


    +   1. (Conditional) Ifnecessary, install a network card in the workstation according
    to the manufacturer''s documentation and connect the work-station to the network.
    It''s a good idea to record the card''s configuration settings, such as its interrupt
    and port address.


    +   2. (Optional) If you are planning to upgrade a workstation and to run the
    installation program from the network, create a directory called SYS.PUBLIC, and
    extract the contents of the Novell Client ZIP file to the newly created network
    directory.


    NOTE


    With OES Linux, the NCP Server component is required for hosting a client upgrade
    directory for workstations. On an OES Linux server, the full path to the system
    volume is /nfs/novell/sys. The CLIENT directory must have Read and Execute rights
    to the directory so that users can locate the installation files. For more information
    on file system rights, see Chapter 11 "OES File Storage and Management." SETUP.EXE
    (Windows XP/2000) and SETUP.EXE (Windows 9x).


    +   3. Run either Typical or Custom installation and click Install. If you select
    Custom, continue with step 8. If you choose Typical installation, skip to step
    13. The Typical installation configures the Novell client as follows:


    +   * The Typical installs only the Novell client files, the NICI client, and
    the NMAS client. If you want to install optional components such as NDPS, Novell
    Workstation Manager, and ZENworks Application Launcher, use the Custom installation.


    +   * Both IP and IPX protocols.


    +   * Directory-based authentication (eDirectory).


    +   5. Select the components you want to install and click Next. If the installation
    program detects that any of these options are already installed on workstation,
    those options will be checked.


    +   6. Select the additional products you want to install, and click Next:


    +   * Novell Modular Authentication Services (NMAS) The NMAS client provides advanced
    authentication options to the standard Novell Client. The NMAS client is discussed
    later in this chapter.


    +   * NetIdentity The NetIdentity agent agents authentication to popular Novell
    services. NetIdentity is discussed in this chapter.'
