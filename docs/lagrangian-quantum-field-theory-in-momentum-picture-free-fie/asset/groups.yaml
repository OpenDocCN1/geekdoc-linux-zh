    # Novell iFolder


    Novell iFolder gives you automatic, secure, and transparent synchronization of
    files between your hard drive and the iFolder server, which results in easy access
    to personal files anywhere, anytime.


    Being able to access your files from any computer, in any location, eliminates
    mistakes and the updating that is frequently necessary when your local files are
    not accessible over the network.


    Novell iFolder has three components:


    +   - iFolder server software After you have installed the iFolder server software
    on your server, users can install the iFolder client in order to access your iFolder
    files. Administrators use the iFolder Management console to manage iFolder user
    accounts.


    NOTE


    The iFolder Management console enables you to perform administrative tasks for
    all iFolder user accounts. From the iFolder website, iFolder downloads the iFolder
    client. It is also where you can access the Java applet and view your iFolder
    files from a browser. The iFolder website can, and be customized to the look and
    feel of your organization.


    +   - iFolder client software Novell iFolder client is compatible with Windows
    95/98, Windows XP/2000/NT, and Linux workstations. The iFolder client must be
    installed on every workstation that you will use to access your iFolder files.
    When the iFolder client is installed, it does three things:


    +   - It creates a shortcut to your iFolder directory on your desktop. The iFolder
    directory, which by default in a Windows client is located in My Documents\iFolder\userid\Home,
    is where you will keep the files you want to synchronize with the iFolder server.
    When a file is placed in the iFolder directory, from which it can be accessed
    by all workstations that are logged in your iFolder account.


    +   - On Windows workstations, an iFolder icon is placed in the workstation system
    tray. Right-clicking the system icon gives users access to their user-configurable
    preferences and the iFolder status screen, which displays a history of the transactions
    that occurred between the iFolder server and the client.


    +   - A user account is created on the iFolder server. iFolder user accounts are
    created automatically when a user downloads and installs the iFolder client. When
    you log in, iFolder asks you for a username and a password. Next, iFolder prompts
    you for a passphrase. This passphrase is used to encrypt files that are uploaded
    to the server.


    NOTE


    Uninstalling the iFolder client does not delete the associated user account on
    the iFolder server. This can be done only from the iFolder Management console.


    +   - iFolder Java applet use the iFolder Java applet to access iFolder files
    from a workstation on which the iFolder client is not installed.'
