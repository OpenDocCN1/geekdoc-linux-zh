    commands in Table A.5 are commonly used to manipulate the contents of text files.
    These commands work normally by outputting the data to standard out (otherwise
    known as the screen), to capture these changes, you normally redirect the output
    to another text file using the greater-than (>). For example:


    ```

    sort /etc/passwd > /tmp/users.txt

    ```


