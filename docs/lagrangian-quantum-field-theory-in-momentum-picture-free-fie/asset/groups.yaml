    ## 管理 eDirectory 对象


    要创建和管理 eDirectory 对象，你应该使用 iManager。如果现有基础设施可用或专门下载，也可以使用 ConsoleOne 执行某些任务。


    ## 管理副本和分区


    要管理副本和分区，请使用 iManager。


    要管理 eDirectory 架构，请使用 iManager。


    ## 使用索引


    eDirectory 自动管理大多数常用索引，无需你干预。


    你可以使用 iManager 中的索引管理模块（位于 eDirectory 维护下）查看默认索引列表。也可以在此模块中创建自定义索引。


    ## 合并 eDirectory 树


    使用 iManager 选择 eDirectory 维护下的“合并树”选项来合并 eDirectory 树。你也可以使用基于终端的 nddsmerge 工具。


    ## 在 eDirectory 中使用额外服务


    eDirectory 的 LDAP 服务为 LDAP 客户端提供强大的 eDirectory 访问。使用 ConsoleOne iManager，通过 eDirectory
    中的 LDAP 服务器和 LDAP 组对象配置 LDAP。


    ## 故障排除


    要监控 eDirectory 消息，请使用 iMonitor 中的 Trace 或 shell 控制台中的 ndtrace 工具。


    使用 iMonitor 修复 eDirectory 树（点击页眉框架中的修复图标）。你也可以使用 iManager 中的 eDirectory 选项。某些修复操作还需要使用基于终端的
    ndsrepair 工具。


    ## 什么是 eDirectory？


    为了理解 Novell eDirectory，你必须首先反转网络架构的标准视图。许多人假设目录需要一个网络操作系统（NOS）来运行，或者它是 NOS 的一部分。实际上，恰恰相反。eDirectory
    定义了你网络的“世界”。因此，网络服务器是目录的一部分，反相反。如果你要在当今复杂的计算环境中有效地与目录工作，这种思维转变至关重要。


    简单来说，eDirectory 是一个分布式且复制的网络信息数据库，为你的网络提供四项关键服务：


    - 发现：eDirectory 让浏览、搜索和检索有关网络的信息成为可能。你可以搜索用户、打印机和应用程序等对象，或者搜索对象的特定属性（如名称、电话号码和配置）。


    - 安全：eDirectory 为你的整个网络提供了身份验证和访问控制的中心点。你可以向用户或用户组授予特定权限，控制跨网络的数据流，并通过使用加密技术保护敏感个人信息。最重要的是，eDirectory
    为跨网络的安全管理提供了基础，你可以安全、高效地与合作伙伴、供应商和客户通信，而无需创建单独的基础设施。


    - 存储：eDirectory 的核心是数据库。因此，它包含了安全地存储网络数据并保护其免受损坏的能力。它还提供了一种分类不同类型数据的方法，以便你可以管理
    eDirectory 中的数据类型。最后，eDirectory 允许将数据库拆分为部分并将这些部分分布在多个服务器上，以提供容错能力并提高性能。


    - 关系：eDirectory 你对网络对象之间的关系。这允许你将配置信息离开设备并变为全局。在实践中，这意味着用户无论位置、连接设备或访问点，都可以访问配置、权限和服务。


    Novell 在 1993 年随 NetWare 4 发布了 eDirectory 的第一个版本，称为 NetWare Directory Services
    (NDS)。那时起，它不断改进，成为世界上最先进、最广泛使用的目录。1998 年发布 NetWare 5 时，名称更改为 Novell eDirectory。2000
    年，Novell 的目录更名为 eDirectory，并进行了模块化，使其可以安装在 NetWare 以外的平台上，包括 Linux、Windows 2000/XP
    以及各种版本的 Unix。后续章节将为你提供 eDirectory 架构、设计考虑以及常见管理任务及其工具的概述。


    ## eDirectory 架构


    eDirectory 架构三个三个方面：


    - 物理数据库

    - 数据规则

    - 数据组织


    这些内容将在后续章节逐一介绍。


    ## 物理数据库


    在底层，eDirectory 是一个数据库。典型的数据库由数据集以及从数据集中搜索和检索特定数据的方法组成。eDirectory 是面向对象的层次结构数据库。层次数据库在逻辑树结构中维护数据（对象）。特定对象通过遍历（行走）树来定位。eDirectory
    数据库中的每个对象都可以通过对象名称（或通用名，CN）结合描述该对象在树中位置的信息（或上下文，Context）进行唯一标识。通用名和上下文的组合被称为区分名（Distinguished
    Name）。


