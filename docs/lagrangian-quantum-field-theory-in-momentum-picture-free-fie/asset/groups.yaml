    # 第 3 章：使用 SUSE Linux Enterprise Server 9


    - 快速上手

    - 登录 Linux

    - Shell 与图形用户界面 (GUI)

    - 熟悉文件系统路径

    - 获取帮助

    - 编辑文本文件


    ## 快速上手


    使用 SUSE Linux Enterprise Server (SLES) 需要对登录过程有理解，包括本地账户系统、身份验证和身份管理。


    使用控制台外（shell）或图形环境是在 SLES 机器上工作的两种可能方法。


    熟悉 SLES 安装后的路径需要对文件系统布局有深入的了解。本章记录并解释了基本的文件系统组件，还描述了基础的文件系统权限。


    SLES 帮助系统允许同时使用 man 页面和 info 页面。


    在控制台会话中编辑文本文件通常使用 `vi` 编辑器。本文解释了 `vi` 的模式，并提供了常用 `vi` 命令对照表。


    尽管使用 SUSE Linux Enterprise Server (SLES) 的完整指南超出了本书的范围，但要成功部署 OES Linux，理解 Linux
    及其基本功能是必须的。


    本章将讨论重要的 Linux 概念，例如理解登录过程、使用命令行和图形环境、熟悉文件系统路径、使用可用帮助以及理解文本编辑工具。精通 Linux 的管理员可能想跳过第
    6 章，但浏览本章以获取 SUSE 特有工具和环境的介绍可能会有所帮助。如果你是 Linux 新手，本章可以帮助你入门，但其初衷并非提供一份全面的或学者指南。


    如果你想更深入地研究 Linux 基础知识或 SLES 管理，Novell Education 的认证 Linux 专业人员 (CLP) 和认证 Linux
    工程师 (CLE) 计划都非常关注。有关 Novell 的 SUSE Linux 认证选项的更多信息，请参阅附录 A，“CLE 认证选项”。


    ## 登录 Linux


    在安装并启动 SLES 服务器后，你将看到文本或图形登录提示。输入适当的用户名和密码即可访问服务器。对于管理员来说，理解如何授予访问以及如何配置本地 SLES
    用户账户至关重要。在实施作为 Linux 用户管理 (LUM) 的 OES 组件之前，具备相关知识也是至关重要的。下一节将简要讨论本地用户账户以及本地身份验证过程的工作原理。


    ### 本地账户文件


    在 SLES9 服务器上，本地用户账户定义在 `/etc/passwd` 文件中，如图 3.1 所示。该文件中定义的每个用户都必须包含服务器用于确定用户权限和登录名称等的属性。`/etc/passwd`
    的格式为每行一个用户条目。


    图 3.1 `/etc/passwd` 文件示例。


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_37_0.png)


    `passwd` 文件中的每一行都由冒号分隔的五个字段组成。这些字段为用户账户被操作系统视为所需的所需的属性。表 3.1 解释了条目 `jdoe:x:1000:100:John
    Doe:/home/jdoe:/bin/bash` 的每个字段。


    表 3.1 /etc/passwd 条目解释


    | 字段项 | 描述 |

    | --- | --- |

    | jdoe | 用户登录名。 |

    | x | 密码字段。如果此字段为“x”，则启用了影子密码 (shadow passwords)。此字段中的“*”会阻止大多数类型的本地登录。 |

    | 1000 | 该账户的数字用户 ID (UID)。 |

    | 100 | 该账户的数字主组 ID (GID)。 |

    | John Doe | 通用电气公司综合操作系统 (GECOS)，通常用于用户的全名或描述。 |

    | /home/jdoe | 用户家目录。 |


    ## Shell 与 GUI


    你可以通过两种方法之一与 SLES 交互。第一种方法是使用 Shell 或控制台，第二种方法是图形用户界面 (GUI)。本节将解释并讨论这两种环境，并为使用
    SLES 的这两个组件提供技巧。


    ### Shell


    SLES 操作系统的核心是 Linux 内核。内核的主要职责是管理运行中的进程及其与计算机各种硬件组件的交互。这包括对内存 (RAM)、处理器 (CPU)、硬盘和其他硬件组件的管理。在独立运行的情况下，内核可以良好地管理这些组件。然而，如果没有用户或管理员的指导，内核绝不会完成任何工作！


    对于管理员来说，与 Linux 内核交互的能力可能比内核本身更重要。促进内核交互的一种重要方式是通过使用“Shell”。


    Shell 是一种设计用于接受用户输入、根据某些标准（如语法和权限）验证该输入，然后将指令传递给内核处理的程序。此功能与 Microsoft Windows
    环境中常用的 DOS Shell 非常相似。然而，Linux Shell 比非 Unix Shell 强大得多，因此更复杂、更熟练。


    这种复杂性的原因之一是 Linux 环境提供了多种 Shell。尽管这些 Shell 的目的在所有变体中基本上是相同的，但它们的实现方式可能有巨大差异。差异通常体现在语法和功能集能力上，但每个
    Shell 都可能大不相同。


    表 3.7 常用 Shell


    | Shell | 二进制程序 | 注释 |

    | --- | --- | --- |

    | Bourne Shell (SH) | /bin/sh | 标准命令解释器。在 Linux 上，sh 通常是 |

    | GNU Bourne-Again Shell (BASH) | /bin/bash | 改进的 Bourne Shell。功能如 |

    | Domain Shell | /bin/ksh | Korn Shell 的开源版本。在其他 |

    | C Shell | /bin/tcsh | Korn Shell 的增强版本。编程类型 |

    | The Z Shell | /bin/zsh | ksh 的增强。功能具有 |


    ## 熟悉文件系统路径


    现在你已经熟悉了图形和控制台环境，但你可能仍处于环境内部。本节提供了文件系统布局的介绍，并对文件系统权限和拒绝提供了见解。


    ### 系统文件系统


    在系统启动过程中，Linux 内核将访问所需的模块加载到内存中。通过这些模块，可以建立与硬盘的物理连接。


    在 Microsoft Windows 和其他操作系统下，文件系统通过分配分区访问。Linux 则通过单一虚拟目录访问所有分区。


    将分区与文件系统关联的过程被称为“挂载”(mounting)。在系统初始化期间，包含核心文件的分区被挂载到目录树的根 (/)。该分区被称为系统或根分区。


    根成功挂载后，其余分区将挂载到根目录下的特定目录。`/etc/stab` 文件作为配置文件，决定每个分区的挂载位置。用于挂载文件系统的目录被称为“挂载点”。


    # 注意


    分区时，目标挂载点必须存在于原始目录树中。该目录不需要为空。在挂载期间，作为挂载点的目录是无法访问的。在使用挂载点的分区卸载后，目录内容将再次可以访问。


    表 3.8 列出了安装 SLES 后的主要目录，并简要描述了它们的用途。


    | 目录 | 内容与目的 |

    | --- | --- |

    | /bin | 所有用户使用的命令。 |

    | /boot | 启动特定文件，包括 Linux 内核和 GRUB 配置。 |

    | /dev | 代表可能的硬件组件的设备文件。 |

    | /etc | 主机特定配置文件。 |

    | /home | 本地用户账户的家目录。 |

    | /lib | 共享库和内核模块目录。 |

    | /media | 移动介质（如光盘）的默认挂载目录结构。 |


