    \ the Novell organization, including stints in Novell Technical Services, has\
    \ written books, articles, marketing collateral, and technical white papers on\
    \ several products and technologies, including directories, network and Internet\
    \ security, network protocols, and proxy caching. Mr. Harris has a B.S. in Computer\
    \ Science and a Masters of Business Administration (MBA).\n\n# Acknowledgments\n\
    \nI must first thank Jeff Harris for asking me to participate in this collaboration\
    \ project. Without his foundation work, this book would not have been possible.\n\
    \nI would also like to thank my co-workers on the Worldwide Support Linux team\
    \ for their advice and support on this project. In particular, Dave Muhlstein,\
    \ Ken Johnson, Scott Ivie, and Dell Harris all offered invaluable advice on this\
    \ project.\n\nMike Latimer\n\nAs is usually the case, this book wouldn't have\
    \ been possible without the willing collaboration of many who provided information,\
    \ support, and encouragement. My support group includes the following folks who\
    \ lent their talent and resources along the way:\n\nRyan Taylor, Ron Warren, Scott\
    \ Rhoades, Tim Boisvert, Eric Michelson, Denise Jewkes, Matt Ryan, and Jeff Fischer.\n\
    \nI would like to give a special thanks to my team of editors, who made this project\
    \ much more enjoyable through their hard work.\n\nJeff Harris\n\n# We Want to\
    \ Hear from You!\n\nAs the reader of this book, you are our most important critic\
    \ and commentator. We value your opinion and want to know what we're doing right,\
    \ what we could do better, what topics you'd like to see over, and any other words\
