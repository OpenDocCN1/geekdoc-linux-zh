    # Finding Your Way


    Now that you are familiar with the graphical and console working environments
    in SLES, you might still find yourself somewhat within the environment itself.
    This section provides an introduction to the filesystem layout and offers an insight
    into filesystem permissions and permission denial pitfalls.


    # System Filesystem


    During the system startup process, the Linux kernel loads modules required to
    access the hard disks into memory. With these modules, physical connections to
    the hard disk partitions can be established.


    Under Microsoft Windows and other operating systems, the filesystem is accessed
    through drive letters assigned to each individual partition. Linux, on the other
    hand, provides access to all partitions through a single, virtual directory structure.
    Accessing partitions is a matter of navigating to the root directory.


    The process of associating a partition to a directory within the filesystem is
    known as "mounting." During system initialization, the partition containing the
    core operating-system files is mounted to the root (/) of the directory tree.
    This partition is known as the system or "root" partition.


    After root has been successfully mounted, remaining partitions are mounted to
    specific directories within the root directory structure. The /etc/stab file is
    used as a configuration file, which determines where each partition will be mounted.
    Directories used for mounting filesystems are known as "mount points."


    # NOTE


    When partitioning, the destination mount point must exist within the original
    directory tree. This directory does not have to be empty. Contents of directories
    used as mount points are inaccessible for the duration of the partition being
    mounted. Directory contents will again be accessible when the partition using
    the mount point is unmounted.


    [Table 3.11](#) lists the main directories found after a SLES installation and
    briefly describes their purposes.


    | DIRECTORY | CONTENTS AND PURPOSE |

    | --- | --- |

    | /bin | Commands used by all users. |

    | /boot | Boot-specific files, including the Linux kernel and GRUB configuration
    files. |

    | /dev | Device files representing possible hardware components. |

    | /etc | Host-specific configuration files. |

    | /home | Home directory for local user accounts. |

    | /lib | Shared library and kernel module directory. |

    | /media | Default mount directory structure for removable media such as CD-ROMs.
