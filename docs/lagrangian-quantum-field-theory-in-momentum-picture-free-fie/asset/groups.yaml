    # Novell Virtual Office


    Novell Virtual Office allows network administrators to quickly and easily personalize
    user portals through browser-based access to network resources. Effectively, Virtual
    Office enables you to create portals which users can access their data and applications
    from a single website. Not only that, but Virtual Office also provides the capability
    to create virtual teams, ad-hoc shared portals that can support a project or any
    other group that needs access to shared resources.


    Virtual Office provides services that allow you to access network resources through
    the Virtual Office interface. Services are little Java-based servlets or applications
    that provide specific access to network resources. OES includes default Virtual
    Office services for accessing network resources and performing common network
    tasks:


    +   - NetStorage Provides access to the Novell NetStorage service. NetStorage
    provides Internet-based access to file storage on an OES server, indexing access
    to iFolder. Both NetStorage and iFolder were discussed in Chapter 12, "OES Linux
    File Access."


    +   - iPrint provides access to Internet printing by iPrint. For more information
    on iPrint, see Chapter 13, "OES Printing Services."


    +   - Email Provides support for popular email applications and protocols, including
    Novell GroupWise, Microsoft Exchange, Lotus Notes, Novell NetMail, POP3, and IMAP.


    +   - eGuide provides a simplified screen to access phone numbers and other user
    information stored in eDirectory, eGuide is discussed in more detail later in
    this chapter.


    +   - Change Password Links to a page where users can change their password in
    eDirectory.


    +   - Web Search provides integration with a Novell Web Search, or QuickFinder,
    server. QuickFinder is discussed in more detail later in this chapter.


    +   - ZENworks provides integration with Novell ZENworks for Desktops functionality,
    such as application delivery, through the Virtual Office interface.


    Perhaps most important to you as a network administrator, Virtual Office doesn''t
    require any complicated development or programming. It''s pretty quick to go right
    out of the box.


    # Installing Virtual Office


    Virtual Office can be installed on a dedicated server using the Novell Virtual
    Office Server pattern or as an optional component during the OES Linux installation.
    Virtual Office can also be installed later through YaST.


    NOTE


    For most networks, you will need to install Virtual Office on only one server
    in each eDirectory tree.'
