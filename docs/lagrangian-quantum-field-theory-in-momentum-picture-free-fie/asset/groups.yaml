    ## Chapter 5. OES Management Tools


    - Instant Access

    - Welcome Pages

    - ConsoleOne

    - iManager

    - Novell Remote Manager

    - iMonitor


    ## Instant Access


    ## Welcome Pages


    OES Linux Welcome Pages provide an introduction to OES components and links to
    administrative and user-level tools. You can access these Welcome Pages using
    a web browser to connect to the IP address or DNS name of the OES server. For
    example:


    http://www.quills.com


    or

    http://192.168.1.100


    ## ConsoleOne


    ConsoleOne is a Java-based tool for managing your network and its resources. Although
    not shipped as part of OES Linux, ConsoleOne for Linux, and several other platforms,
    it can be downloaded from http://support.novell.com.


    ConsoleOne is not capable of managing all components of OES Linux. However, some
    administrative tasks (as eDirectory administration) can still be performed via
    ConsoleOne.


    ## iManager


    iManager provides role-based management of your OES Linux network, together with
    a nearly comprehensive set of administrative tools. When you''ve loaded iManager,
    you use it to perform most of the day-to-day administrative tasks in your OES
    environment, including management of most services available with OES Linux.


    You can access the iManager web page by appending the iManager path (/nps/iManager.html)
    to the IP address or DNS name of the server running iManager. For example:


    https://www.quills.com/nps/iManager.html


    or

    https://192.168.1.100/nps/iManager.html


    To force iManager into Simple mode to support Federal accessibility guidelines,
    use the Simple mode path (/nps/Simple.html). For example:


    https://www.quills.com/nps/Simple.html


    or

    https://192.168.1.100/nps/Simple.html


    ## Welcome Pages


    Prior to discussing the various administrative tools themselves, there is one
    important OES Linux tool to point out the OES Linux Welcome Pages. These pages,
    shown in Figure 5.1, are a collection of introduction pages for each OES Linux
    web-based utility. These utilities are both administrative utilities, such as
    iManager and NRM, and user-level utilities, such as Virtual Office and NetStorage.


    Figure 5.1. The OES Linux Welcome Pages.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_87_0.png)


    To view the OES Linux Welcome Pages, use a web browser to access your OES Linux
    server''s IP address or DNS. For example:


    http://www.quills.com


    or


    http://192.168.1.100


    The Welcome Pages are made up of two frames. The left-hand frame is the navigation
    frame and contains links to all Utility Welcome Pages divided into five categories.
    Beneath each category are links to introduction pages for specific utilities.
    Selecting one of these utilities opens the appropriate introductory page in the
    right-hand frame of the Welcome Pages.


    Welcome Page categories and introductory pages found within each category are
    described in the following list:


    - End User Software Category contains introductory pages that end users may be
