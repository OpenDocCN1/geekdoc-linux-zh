    # Other Novell Clients


    In addition to the traditional Novell client, there are three other clients compatible
    with OES Linux. They are as follows:


    +   - NICI client


    +   - NMAS client


    +   - NetDrive client


    In addition to these three feature-specific clients, there are a few others that
    are installed automatically with their respective software document. Each of these
    will be discussed as part of its product overview in other chapters throughout
    this book.


    # NICI Client


    The Novell International Cryptographic Infrastructure (NICI) is the modular foundation
    for all crypto-services offered in Novell products and services. NICI client provides
    cryptographic services to client-side applications and services. NICI client has
    received FIPS 140-1 (Level 1) certification, which is as good as it for client-based
    cryptographic services.


    The NICI client is included with the Novell Client download, available from http://download.novell.com.
    In an OES NetWare environment, the NICI client is required for several components,
    including Deployment Manager, Novell Nsure Audit, and Native File Access. With
    OES Linux, the only components that require the NICI client are the Novell Modular
    Authentication Service and ConsoleOne (when downloaded and installed on a local
    Windows workstation).


    The NICI client is installed automatically as part of the Novell installation
    process, declared earlier. It can also be installed by completing the following
    steps:


    +   1. Locate the /nici folder created when the Novell client are extracted from
    the ZIP file downloaded from http://download.novell.com. For example, for Novell
    client for Windows XP/2000, the NICI folder is located in \WINNT\386\.


    +   2. Launch WNCICIU.EXE from the /nici folder.


    +   3. At the NICI client Welcome screen, click Next.


    +   4. At the License Agreement screen, click Yes.


    +   5. At the Setup Complete screen, click Finish.


    This completes the installation of the NICI client.


