    ## Appendix A. The Most Essential Linux Commands


    If you are new to the world of Linux, working on the command line can seem a daunting
    challenge. Although there is no substitute for a quality training course and in-depth
    personal practice and experimentation, simply finding the right command can be
    the difference between endless suffering and a quick solution to your problem.


    To help your transition to the Linux world, this appendix has been compiled with
    some of the more common and important commands used at the terminal. Please keep
    in mind that this appendix is certainly not intended to provide every command
    you will likely need in your command-line work, but if you are struggling for
    that important command, you may find this guide useful.


    With that in mind, these commands have been organized in the following sections:


    - Getting Help

    - File Management

    - Permissions and Identity

    - Viewing Files

    - Text Processing

    - Finding Files and Text

    - Regular Expressions

    - Environmental Commands

    - Working with Processes

    - Troubleshooting Tools

    - Compression Utilities

    - Networking Utilities

    - Working with Filesystems

    - System Shutdown and Restart


    ## Getting Help


    Perhaps the most important tools on the command line are those that you can use
    to help. Table A.1 lists a few of these important tools.


    Table A.1. Using Terminal-Based Help Systems


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | apropos | apropos STRING | Searches the NAME field of all manual pages. Same
    as man -k [string]. |

    | info | info [OPTIONS] INFO_PAGE | Displays the information pages for the specified
    command. |

    | man | man [OPTIONS] MANPAGE | Displays the manual pages for the specified command,
    configuration file, system call, and so on. Common options include -k [string]
    Searches NAME field of man pages for specified string |

    | whatis | whatis KEYWORD | Displays the NAME field from the man page for the
    specified keyword. |


    ## File Management


    File management tools include those for navigation and general file and directory
    manipulation. Refer to [A.2](#) for these commands.


    Table A.2. Filesystem Navigation Commands


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | cd | cd DIR | Changes directories. |

    | cp | cp [OPTIONS] SOURCE DEST | Copies files or directories. Common options
    include -d Copy symbolic links -R Copy directories recursively |

    | ln | ln [OPTIONS] SOURCE TARGET | Creates a link between two files. Common options
    include -s Create a symbolic, rather than hard, link |

    | ls | ls [OPTIONS] FILE | Lists directory contents. Common options include -a
    Show all files, including hidden files starting with "." -A Show almost all files,
    ".", and "*" -d List directory entries rather than contents -l Display a long
    listing of contents, including file mode, ownership, and timestamp -R Perform
    a recursive listing |

    | pwd | pwd | Prints the path of the current working directory. |

    | mkdir | mkdir [OPTIONS] DIR | Creates the specified directory. Common options
    include -p Create parent directories if |


    ## Permissions and Identity


    Your ability to manipulate files and directories at the command line is directly
    limited by your identity and the permissions available to that. Table A.3 lists
    commands that can be used to adjust file-level permissions, and commands used
    to temporarily change your identity.


    Table A.3. Permissions and Identity Commands


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | chgrp | chgrp GROUP FILE | Changes file and directory group ownership. |

    | chmod | chmod [OPTIONS] MODE FILE | Changes access permissions on files and
    directories on Linux filesystems. |

    | chown | chown [OPTIONS] OWNER:[GROUP] FILE | Changes file and directory user
    and group ownership. |

    | su | su [OPTIONS] USERNAME | Substitutes current user credentials with the specified
    user''s identification. Common options include -s Causes a complete login process
    to be performed using the new user identification |

    | sudo | sudo [OPTIONS] USERNAME | Performs an su the new user credentials, but
    also creates an Xauthority file for accessing the local X server. Common options
    include -s Causes a complete login process to be performed using the new user
    identification |

    | whoami | whoami | Displays current user identification. |


    ## Viewing Files


    When working on the command line, you will most likely encounter plenty of opportunities
    for viewing log files, configuration files, or any other type of normal file.
    Table A.4 lists commands used for this purpose.


    Table A.4. Commands Used to View Files


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | cat | cat FILE | Concatenates files and displays output on standard out (typically
    the screen). |

    | head | head [OPTIONS] FILE | Displays the first 10 lines of text from the specified
    file. Common options include -[N] Displays the first N number of lines |

    | less | less FILE | Paging utility used to display text files. |

    | more | more FILE | Paging utility used to display text files. |

    | od | od [OPTIONS] FILE | Displays the specified file in octal mode. Common options
    include -h Hexadecimal display |

    | strings | strings FILE | Prints text strings four characters long or longer
    from binary files. |

    | tail | tail [OPTIONS] FILE | Displays the last 10 lines of text from the specified
    file. Common options include -[N] Displays the last N amount of lines -f Follows
    an active log file |


    ## Text Processing


    Manipulating text files can be a time-consuming process if done manually. The
    commands in Table A.5 are commonly used to manipulate the contents of text files.
    These commands work normally by outputting the data to standard out (otherwise
    known as the screen), to capture these changes, you normally redirect the output
    to another text file using the greater-than (>). For example:


    ```

    sort /etc/passwd > /tmp/users.txt

    ```


    Table A.5. Commands Commonly Used to Process Text Files


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | expand | expand FILE | Converts tab characters to spaces in the specified file.
    |

    | joe | joe FILE | Text-editing utility. |

    | nl | nl FILE | Assigns line numbers and displays the specified file. |

    | pr | pr [OPTIONS] FILE | Formats a text file for printing. |

    | sort | sort FILE | Alphabetically sorts and displays the specified file. |

    | unexpand | unexpand FILE | Converts spaces to tab characters in the specified
    file. |

    | uniq | uniq FILE | Displays all unique lines in the specified file. |

    | vi | vi FILE | Text-editing utility. Use vim for an introduction to this utility.
    |

    | wc | wc [OPTIONS] FILE | Returns the number of lines, words, and characters
    in the specified file. |


    ## Finding Files and Text


    There are several methods for finding files and text within files from a terminal.
    [Table A.6] contains the common methods used.


    Table A.6. Commands Used to Find Files and Text Within Files


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | egrep | egrep [OPTIONS] PATTERN [FILE] | Searches the contexts of text files
    for the specified pattern. The pattern specified for egrep must be created using
    extended regular expressions. Common options include -i Ignore case for searches
    -r Recursive search for matching files For example: egrep (root|admin) /etc/*
    |

    | fgrep | fgrep [OPTIONS] PATTERN [FILE] | Searches the contexts of text files
    for the specified pattern. The pattern specified for fgrep will be interpreted
    literally and not as a regular expression. This allows for searching on such things
    as wildcard characters (*,?). Common options include -i Ignore case for searches
    -r Recursive search for matching files For example: fgrep ''*15'' /etc/crontab
    |

    | find | find [PATH] EXPRESSION | Searches a directory structure as file or files
    matching the specified expression. Common expression options include -name File
    name search |

    '
