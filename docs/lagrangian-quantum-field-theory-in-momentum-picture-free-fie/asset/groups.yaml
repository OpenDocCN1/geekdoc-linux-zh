    ## Accessing OES Through Native Methods


    In addition to accessing files through the OES NCP server, clients easily access
    native methods. The two most common options for remote file access are the Network
    File System and Samba.


    ### Network File System (NFS)


    The Network File System (NFS) was originally created to provide seamless disk
    access across a network. Through the use of an NFS server, local disk contents
    are exported to NFS clients. NFS clients access the NFS directories as they were
    on the local disk.


    SLES includes both client and server components of NFS. Although NFS access to
    the local disks is not required when using the NCP server, it is sometimes necessary
    or useful to provide NFS access to clients. The following section will briefly
    describe the server configuration and client access methods used by NFS.


    ### Configuring NFS Access


    Configuring NFS file on SLES is performed using the YaST management utility. YaST
    is discussed in detail in Chapter 6 "SUSE Linux Server Management." To configure
    NFS, the "NFS Server" module within YaST''s Networking Services must be used.


    - Directory Absolute of a local directory must be entered for proper functioning
    on the NFS server.

    - Hosts Wildcard Representation of clients that are allowed to connect to the
    current exported directory. A valid hosts list can contain a set of asterisks
    (*) to indicate all clients or a specific IP address. Range of IP addresses and
    DNS names are also valid entries.

    - The Options list of an NFS export is used to configure the permissions of that
    export. Common options include ro for read-only access, root_squash for disabling
    root access to the export, and sync for synchronize file access.


    NOTE

    For more information on host wildcards and export options, see man 5 exports.


    Upon completing the NFS Server configuration module, the NFS server is started
    automatically and clients can begin accessing NFS exports.


    ### Mounting an NFS Exported Directory


    When a SLES directory has been exported for NFS clients, it is imported to a remote
    filesystem for access. Linux systems use the mount command to accomplish this.
    To mount an exported directory on a Linux system, complete the following steps:


    - Use the mkdir command to create a directory that will hold the OES Linux NFS
    export, for example: mkdir /OESFiles.

