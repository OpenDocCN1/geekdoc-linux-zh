    # Troubleshooting


    Troubleshooting SLES can be a complex process. The following section contains
    important log files, procedures, and tools used during the troubleshooting.


    ## System Log Files


    SLES uses the System Logger (syslog) utility to track events from all running
    processes. These events are written to log files that can be used for troubleshooting
    and system analysis. When you''re troubleshooting nearly any type of problem on
    SLES, these log files are the best place to begin. Table 6.7 identifies key log
    files found on SLES.


    Table 6.7. Important Log Files Found on SLES


    | LOG FILE | PURPOSE |

    | :--- | :--- |

    | /var/log/messages | The majority of syslog messages are stored in this file.
    |

    | /var/log/boot.msg | All boot-related messages are written to this file upon
    system startup. |

    | /var/log/YaST2 | This directory contains log files for the operation of YaST
    and YaST modules. |

    | /var/log/cups | CUPS-related log files can be found in this directory. |

    | /var/log/mail | Log file for mail-related messages. |

    | /var/log/XFree86.0.log | Log file containing messages relating to the XFree86
    server. |

    | yast2 view_anymsg-or-yast view_anymsg | Command used to launch YaST into the
    system log monitoring module. (yast2 is the graphical utility, and yast is the
    command-line version). |


    ## NOTE


    Log files for OES components can normally be located in /var/opt/novell/log.


    ## /proc and /sys Filesystems


    When you''re troubleshooting hardware-related problems, it is important to determine
    exactly what the kernel has of all hardware devices attached to the server. The
    /proc filesystem is a virtual filesystem that allows an insight into the running
    kernel. Many kernel configuration values can be analyzed by viewing the appropriate
    file within the /proc directory structure.


    Beginning with the 2.6 kernel, the sysfs filesystem has been added for accessing
    additional information regarding kernel data and attributes. This filesystem is
    mounted at the /sys directory and can be used to query specific settings of hardware
    devices recognized by the current kernel. Not all devices have interfaces within
    the sysfs filesystem, both the /proc and /sys files must be used for low-level
    device management.


