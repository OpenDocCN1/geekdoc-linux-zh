    \ iFolder 目录的快捷方式。iFolder 目录默认位于 `My Documents\\iFolder\\Home`，这是您存放想要与 iFolder\
    \ 服务器同步的文件的地方。\n    - 在 Windows 工作站上，系统托盘中会放置一个 iFolder 图标。右键点击系统图标允许用户访问用户可配置的偏设置和\
    \ iFolder 状态屏幕，该屏幕显示事务历史。\n    - 自动创建一个用户账户。当您登录时，iFolder 会要求您输入用户名和密码。此口令用于加密上传到服务器的文件。\n\
    \n注意：卸载 iFolder 客户端不会删除 iFolder 服务器上的关联用户账户。这只能通过 iFolder 管理控制台完成。\n\n- iFolder\
    \ applet：使用 iFolder applet 在未安装 iFolder 客户端的工作站上访问 iFolder 文件。\n\n# FTP 服务器\n\n\
    Linux 平台有多个 FTP 服务器供选择。对于 SLES，两个常用的 FTP 服务器是 Pure-FTP (pure-ftpd) 和 VSFTP (vsftpd)。这两个\
    \ FTP 服务器都适用于 SLES 发行版，并可能在 OES 安装期间进行优化安装。\n\nPure-FTP 旨在为 Linux 服务器提供快速、轻量级的\
    \ FTP 访问。它提供了与 Linux 内核的紧密集成以及符合标准的、安全意识的设计。\n\nVSFTTP（或 Very Secure FTP）是一个专注于安全编码的\
    \ FTP 服务器。鉴于该服务器的重点，它是 SLES 最常用的 FTP，并将是本文讨论的中心。\n\n无论您选择哪种服务器，FTP 服务器的目的是提供通过网络连接轻松传输文件的方法。所有文件传输协议（FTP）服务器都通过\
    \ TCP/IP 通信并应符合 RFC 959。VSFTTP 符合这些要求。当启动主 VSFTP 守护进程 (vsftpd) 时，您可以从任何客户端向 OES\
    \ Linux 服务器执行文件传输。这通常通过通过本地用户身份登录 FTP 服务器来完成。然而，如果您还使用 OES 的 LUM 组件，可以配置 FTP 用户重定向回其主目录。如果没有\
    \ LUM，FTP 用户将仅限于身份验证本地用户。有关 LUM 的更多信息，请参阅第 8 章“用户与网络安全”。\n\nVSFTTP 服务器是一个功能完备的\
    \ FTP 服务器，具有许多功能，如下。本节提供了基本的安装和配置信息，以便您可以使用 FTP 访问 NetDrive。\n\n- 基于 xinetd 的服务管理：扩展互联网守护进程\
    \ (inetd) 管理 vsftpd 进程。这允许 xinetd 为 vsftpd 提供额外的安全层。当遇到传入请求时，xinetd 验证请求，如果允许则生成\
    \ vsftpd 进程。通过这种集成，通过 YaST 网络服务 (inetd) 模块执行 FTP 服务管理。\n\n- 身份验证用户访问：可以使用本地用户账户为本地和\
    \ LUM 用户提供完全访问。可以通过 CHROOT jail 将这些账户锁定在其目录。\n\n- 匿名用户访问：可以设置匿名用户账户以让用户访问公共文件。使用\
    \ CHROOT jail可以将匿名访问锁定在特定的目录结构中，以减少安全风险。\n\n- 防火墙支持：如果 FTP 客户端位于防火墙后，FTP 服务器支持被动模式数据传输并配置被动数据端口范围。\n\
    \n- FTP 日志：FTP 服务维护活动日志，包括 FTP 会话、登录登录尝试、活动详情和系统错误消息。\n\n有关所有 VSFTP 服务器功能的详细信息，请访问\
    \ VSFTP 首页：http://vsftpd.beasts.org/\n\n# 安装 FTP 服务器\n\nVSFTTP 服务器可以在 OES Linux\
    \ 安装期间作为可选组件安装，也可以以后通过 YaST 安装。使用 YaST 安装 VSFTP：\n\n1. 从终端访问 YaST，或从图形化环境使用 yast2\
    \ 或 YaST 启动器访问\n\n"
