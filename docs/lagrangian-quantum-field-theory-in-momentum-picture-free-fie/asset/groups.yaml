    # 为 OES Linux 准备


    无论您是使用 OES Linux 构建新网络，还是安装现有网络，您都应该进行某些准备，以确保安装过程尽可能顺利。


    对于那少数想要从零开始构建新网络的人来说，您有机会完成所有能让以后管理变得更简单的小事。请仔细考虑您的地址方案选择、命名方案、访问方法等。作为您网络的技术基础，这些内容在后续过程中非常难以更改。请考虑业务因素，例如公司增长、合并或收购、重组以及
    21 世纪的所有其他业务考量。如果您不这样做，您的网络可能缺乏适应组织战略和结构性变化的灵活性。


    遗憾的是，所有这些规划都必须根据预算的实际情况进行权衡。妥协是所不可避免的，但这种高级规划将确保在网络运行时，这些妥协不会反噬你（不再来困扰你）。


    # 服务器硬件规划


    在为 OES Linux 准备服务器硬件时，请考虑以下内容：


    - 处理器速度：服务器必须配备 Intel Pentium II 或 AMD K7 处理器或更高型号。Novell 建议多处理器系统使用 Pentium III
    700MHz 或更高频率的处理器。

    - CD-ROM 驱动器：服务器必须具有兼容 ISO9660 的 CD-ROM 驱动器。Novell 还建议使用兼容 El Torito 规范的启动 CD-ROM
    驱动器，以便直接从 CD 启动。

    - 服务器内存：OES Linux 服务器必须具备 512MB 系统内存（RAM）。

    - 存储适配器和设备类型：OES Linux 安装程序将正确检测大多数存储适配器和设备，但您应该熟悉服务器存储控制器（SCSI 板、IDE 控制器等）的品牌和类型，以及连接到这些控制器的存储设备（如硬盘、CD-ROM/DVD
    驱动器、磁带驱动器）的品牌、类型、容量和其他规格。

    - 硬盘大小：OES Linux 基础安装需要 2GB 的未分区空间。如果您计划完全实现 OES Linux，那么该磁盘空间可能会显得非常小。请检查您的计划，并确保本地磁盘或共享存储设备足够。

    - 网络适配器：了解安装在服务器中的网络适配器类型。这本不是必须，但如果安装程序在识别您的适配器时遇到困难，随手准备这些信息可以帮助快速解决问题。请记住，不支持的硬件驱动程序可能只能直接从第三方供应商处获得。如需认证硬件，请访问
    http://www.novell.com/partner/

    - 显示和输入设备：建议为 OES Linux 使用 VGA 或更高级视频适配器和显示器，并配备标准键盘和鼠标用于直接控制台操作。然而，由于 OES 提供了强大的基于
    Web 的管理工具，可以在没有任何直接输入或输出设备的情况下操作“无头”服务器。


    # 安装 OES Linux


    安装 OES Linux 是一个简单直接的过程，但在开始过程之前，您应该熟悉安装的几个方面。当您了解预期情况时，就可以开始安装新服务器或将现有服务器升级到
    OES 的流程。


    本节包含以下主题：


    - 准备安装 OES Linux

    - 安装新的 OES Linux 服务器

    - 将 SLES9 升级到 OES


    ## 准备安装 OES Linux


    在开始安装 OES Linux 之前，双检安装前提条件是一个好主意。本节包含了 OES Linux 服务器的官方前提条件。


    理解 OES 安装模式也很重要。这些模式决定了默认安装哪些 OES 组件。如有需要，可以对每个模式进行定制以满足特定需求。


    最后，创建一个基于网络的安装源是执行多次安装或在不依赖 CD 介质的情况下维护安装的高效方法。


    当您完全理解这些主题后，就可以准备开始实际的 OES Linux 安装了。


    ## 安装前提条件


    在尝试为 Linux 安装 OES 之前，请检查以下最低硬件要求，以确保您的服务器符合这些要求：


    - 配备 Pentium II 或 AMD K7 450MHz 处理器的服务器级计算机（建议 Pentium III、Pentium 4、AMD K8 或更高）

    - 512MB RAM（建议 1GB）

    - 2GB 可用的未分区硬盘空间（建议 10GB；根据 OES 组件的实现情况可能需要额外的空间）

    - 4X CD-ROM 驱动器

