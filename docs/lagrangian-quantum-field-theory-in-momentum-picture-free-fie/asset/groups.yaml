    # Instant Access


    # The Novell Client and OES Linux


    The Novell Client provides NetWare Protocol (NCP) services to client workstations.
    Used in conjunction with the NCP server component of OES Linux, the Novell Client
    allows workstations to log in to eDirectory, map local drives to OES Linux volumes,
    and seamlessly authenticate to OES services.


    The Novell Client provides a single method of accessing files in mixed NetWare
    and OES Linux environments.


    The Novell Client is an optional component that is not required for administration
    of OES Linux.


    # Installing/Upgrading the Novell Client


    Two Novell Clients are currently available: one for Windows 9x and one for Windows
    XP/2000. The Novell Client for Linux is expected to become available shortly after
    OES ships. Novell Client files may be downloaded from http://download.novell.com
    and installed directly, or copied to any convenient location, such as a network
    server, for installation by any client with existing network access.


    Use the Novell Client Upgrade Agent to periodically check for updated client files.
    When updated files are found, the Upgrade Agent will automatically start the client
    upgrade routine.


    If you upgrading existing Novell or Microsoft clients for OES, you can use the
    Automatic Client Upgrade (ACU) feature to automate this process. Place ACU commands
    in a profile or container login script to detect whether the client software needs
    to be installed, and then the ACU updates the workstation automatically, if necessary,
    when the user logs in.


    To install the Novell Client from a web server, copy the client files to the web
    server and use the WebIP utility to create a SETUPIP executable that will download
    the Novell Client install files from the web server and launches the client install
    routine.


    # Configuring the Novell Client


    After installing the Novell Client, you can configure it by using the Novell Client
    properties page. Right-click on the red "N" icon in the system and select Novell
    Client Properties.


    To configure the login for a Novell user, create a login script. Login scripts
    can be associated with Container, Profile, and User objects. A login script can
    control what happens when a user logs into your Novell network. For information
    and syntax on login scripts, see Appendix B, "The Most Essential Commands."


    # The NICI Client'
  - '[PAGE 54]


    <!-- no content -->'
  - '[PAGE 55]


    # The Traditional Novell Client


    The Novell Client installation automatically copies all client files to the workstation
    and edits any configuration files that require modification. Although the Novell
    Client is required for OES NetWare and mixed environments, OES Linux does not
    require the Novell Client for full administrative capabilities.


    You can choose one of three methods for installing the Novell Client on your workstation:


    +   - Download and install the Novell Client from http://download.novell.com.
    Periodically, Novell releases updated clients with new features, so the client
    files on the Internet may be newer than those versions described here. It''s a
    good idea to check this location occasionally for updates.

    - Install the Novell Client from a web server.

    - Upgrade existing workstations with the Novell Client Update Agent.


    Novell offers a Nov Client for Windows XP/2000 (currently v4.91) and for Windows
    9x (currently v3.4). The installation procedure for both versions is identical,
    you can use the installation, configuration, and removal instructions regardless
    of the version of Windows you are running.


    Novell is also nearing completion of development on a Novell client for Linux
    workstations. Although complete details were not available at the time of writing,
    this new client is expected to bring many of the client features so important
    to Windows users to the Linux platform as well. Release of the Linux client is
    expected to be shortly after the shipping of OES.


    For either Windows platform, if you are installing a new client, you should have
    an Internet connection to access the Novell client files. If you''re upgrading
    an existing workstation that already has a connection to the network, you can
    run the installation program from a network directory instead.'
- md: "\n## Installing the Client Software\n\nTo install the Novell client software\
    \ on a Windows workstation from an OES Linux server, download the latest client\
    \ from http://download.novell.com and complete the following steps:\n\nNOTE\n\n\
    You can use the following procedure whether you're installing a new network workstation\
    \ or upgrading an existing workstation. If you are upgrading an existing workstation,\
    \ the installation program will detect existing settings (such as the protocol\
    \ used, the network card, and other features) and use those same settings as the\
    \ defaults for the upgraded workstation.\n\n- 1. (Conditional) If necessary, install\
    \ a network card in the workstation according to the manufacturer's documentation\
    \ and connect the workstation to the network. It's a good idea to record the card's\
    \ configuration settings, such as its interrupt and port address.\n\n- 2. (Optional)\
    \ If you are planning to upgrade a workstation and to run the installation program\
    \ from the network, create a directory called SYS.PUBLIC, and extract the contents\
    \ of the Novell Client ZIP file to the newly created network directory.\n\nNOTE\n\
    \nWith OES Linux, the NCP Server component is required for hosting a client upgrade\
    \ directory for workstations. On an OES Linux server, the full path to the system\
    \ volume is /nfs/novell/sys. The CLIENT directory must have Read and Execute rights\
    \ to the directory so that users can locate the installation files. For more information\
    \ on file system rights, see Chapter 11 \"OES File Storage and Management.\" SETUP.EXE\
    \ (Windows XP/2000) and SETUP.EXE (Windows 9x).\n\n- 3. Run either Typical or\
    \ Custom installation and click Install. If you select Custom, continue with step\
    \ 8. If you choose Typical installation, skip to step 13. The Typical installation\
    \ configures the Novell client as follows:\n\n  - The Typical installs only the\
    \ Novell client files, the NICI client, and the NMAS client. If you want to install\
    \ optional components such as NDPS, Novell Workstation Manager, and ZENworks Application\
    \ Launcher, use the Custom installation.\n\n  - Both IP and IPX protocols.\n \
    \ - Directory-based authentication (eDirectory).\n\n- 5. Select the components\
    \ you want to install and click Next. If the installation program detects that\
    \ any of these options are already installed on workstation, those options will\
    \ be checked.\n\n- 6. Select the additional products you want to install, and\
    \ click Next:\n\n  - Novell Modular Authentication Services (NMAS) The NMAS client\
    \ provides advanced authentication options to the standard Novell Client. The\
    \ NMAS client is discussed later in this chapter.\n  - NetIdentity The NetIdentity\
    \ agent agents authentication to popular Novell services. NetIdentity is discussed\
    \ in this chapter.\n\n## Removing the Client Software\n\nTo remove the Novell\
    \ client software from a Windows workstation, use the Novell control panel. The\
    \ Novell uninstall will remove all components from the workstation, but will leave\
    \ behind a minimal footprint in the Windows Registry. That way, if you reinstall\
    \ the client at a later time, the installation program can automatically load\
    \ the same settings that you used previously.\n\nTo remove the Novell client from\
    \ Windows XP/2000, complete the following steps:\n\n- 1. Open the Network control\
    \ panel by right-clicking My Network Places and selecting Properties.\n\n- 2.\
    \ Right-click Local Area Connection and selecting Properties.\n\n- 3. Select the\
    \ Novell Client for Windows entry from the list of installed network services\
    \ and click Uninstall.\n\n- 4. Click Yes to confirm your decision.\n\n- 5. Reboot\
    \ the workstation to complete the client removal.\n\nTo remove the Novell client\
    \ from Windows 9x, complete the following steps:\n\n- 1. Open the Network Control\
    \ Panel applet by selecting Start, Settings, Control Panel and then selecting\
    \ Network. Alternatively, you can access this utility by right-clicking Network\
    \ Neighborhood.\n\n- 2. Select Novell NetWare Client from the list of installed\
    \ network services and click Remove.\n\n- 3. Click Yes to confirm your decision.\n\
    \n- 4. Reboot the workstation to complete the client removal.\n\nNOTE\n\nYou can\
    \ also remove the client from the Control Panel by selecting the Add/Remove Programs\
    \ option, selecting Novell Client for Windows, and then clicking Remove. You will\
    \ still have to reboot to complete the removal of the client software.\n\nTo remove\
    \ the Novell client from Windows 9x, complete the following steps:\n\n- 1. Open\
    \ the Network Control Panel applet by selecting Start, Settings, Control Panel\
    \ and then selecting Network. Alternatively, you can access this utility by right-clicking\
    \ Network Neighborhood.\n\n- 2. Select Novell NetWare Client from the list of\
    \ installed network services and click Remove.\n\n- 3. Click Yes to confirm your\
    \ decision.\n\n- 4. Reboot the workstation to complete the client removal.\n\n\
    When the workstation has been rebooted, the removal of the Novell client is complete.\n\
    \n## Installing from a Web Server\n\nYou can set up a Novell Client installation\
    \ from any server by completing the following steps:\n\n- 1. Copy the complete\
    \ \\WINNT or \\WIN95 directory to the desired location on the web server. This\
