    # Backing Up and Restoring Files


    Although current storage technologies, such as RAID, hot-swappable hard drives,
    and network-attached storage are making servers ever more secure in their capability
    to maintain data, there are still many ways in which data can be lost or corrupted.
    For those situations, it is necessary to have a backup of your network so that
    lost files can be recovered.


    OES Linux provides a backup-restore infrastructure known as Storage Management
    Services (SMS). SMS makes it possible to copy your network data, including files,
    directories, the eDirectory database, and even data from other servers and clients,
    to an offline storage system such as tape or optical. With a well-developed backup
    strategy, you can be confident that you will always have a current copy of your
    network data, so you can restore files without the unthinkable occur.


    There are several network backup solutions for Linux on the market today. Unfortunately,
    at the time of this writing, none of them built upon this SMS foundation deliver
    a comprehensive backup solution. With third-party backup tools on Linux, you will
    not be able to back up your filesystem, or extended data like NSS ACLs cannot
    be part of backup. However, SMS is designed with working environments in mind.
    Because of SMS-compliant backup programs running on other operating systems you
    effectively back up OES Linux servers. This means that another operating system,
    NetWare or Windows, is required for an enterprise-level backup solution.


    OES Linux does include a fairly basic Linux-based, SMS-aware backup interface
    called nbackup. This utility will back up the data but third-party products lacks
    many of the conveniences, such as flexible scheduling options. This shouldn''t
    last long, as third-party vendors are expected to release native Linux backup
    programs supporting SMS in the future.


    # Planning a Backup Strategy


    Planning is critical to developing an effective backup strategy. A well-planned
    backup strategy will avoid those headaches associated with finding and restoring
    files if that becomes necessary. It will reduce the time it takes to perform data
    backups and keep your network humming along. When planning your backup strategy,
    consider the following:


    - How frequently should you make backups?

    - What type of medium are you going to back up your data?

    - How should you rotate your backup media?

    - Where will your backup copies be stored?

    - How and when will you test the restore procedure?


