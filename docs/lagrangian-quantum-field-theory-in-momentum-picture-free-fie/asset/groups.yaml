    # # NetStorage


    NetStorage provides a transparent WebDAV interface to OES files. Effectively,
    NetStorage allows you to access files on an OES Linux server with a Novell client.
    NetStorage is integrated with iFolder, NetDrive, and Virtual Office to make accessing
    network files as easy and seamless as possible using the traditional Novell Client.


    NetStorage leverages a mid-tier architecture, also called XTier, to provide its
    services. This same architecture is used to support some of the functionality
    of Novell''s ZENWorks line of management solutions.


    # ## Installing NetStorage


    NetStorage can be installed during the installation of the OES Linux server, or
    after the fact through YaST. Typically, you will need to install NetStorage on
    only one OES Linux server in eDirectory, or on one server at each geographical
    site, although very heavy usage might require more than one per site.


    To install NetStorage from YaST, complete the following steps:


    +   1. Access YaST from a terminal using yast, or from a graphical environment
    using yast2 or the YaST launcher from the application menu.


    +   2. Select the Services category in YaST. From this category, locate and select
    the NetStorage module. This module will detect that the RPMs for NetStorage are
    missing and ask if you want to install them. Select Continue to install the necessary
    packages.


    +   3. At the conclusion of the software installation, SuSEConfig is executed
    to update the system configuration. When this completes, the OES component will
    begin automatically.


    +   4. At the NetStorage LDAP Server Configuration screen, enter the following
    information and click Next:


    +   - Local or Remote Server Select the radio button that indicates whether eDirectory
    is running on the local server or a remote server.


    +   - Directory Server Address If a remote eDirectory is in use, enter the IP
    address for this server.


    +   - Admin Name with Context the eDirectory administrator''s credentials using
    fully qualified dot notation, for example, cn=admin,o=novell.


    +   - Admin Password Enter necessary, select this button to change the configured
    ports for the eDirectory server you


    +   - Port Details Enter the port for the eDirectory server specified earlier.
    The default LDAP port for unencrypted communications is 389 and port 636 is used
    for SSL-encrypted communications.


    +   5. At the NetStorage Configuration screen, enter the required information
    (see Figure 12.1), and click Next. You can change these settings after the installation
    through iManager by navigating the NetStorage link and selecting Authentication
    Domains.


    +   - (Optional) Enter the iFolder 2 server address Specify DNS name or IP address
    of your iFolker 2 server if you want to be able to access iFolder data through
    NetStorage. More information on iFolder is available later in this chapter.


    +   - Authentication Domain Host the DNS name or IP address of a server in your
    eDirectory that hosts a master or read/write replica of eDirectory. This does
    not have to be the server where NetStorage is being installed. NetStorage will
    use this to authenticate users when they attempt to log to NetStorage.'
- md: "\n# Novell NetDrive\n\nNovell NetDrive enables you to map a network drive to\
    \ any OES Linux server without using Novell client software. This means that with\
    \ NetDrive, you can access and modify your files from any workstation using an\
    \ Internet connection. After a network drive is mapped, the drive you assigned\
    \ during the mapping appears in Windows Explorer and functions just like those\
    \ mapped through Novell. Basically, the capability to map drives has been extracted\
    \ from the Novell client where it can be used independently of all the Novell\
    \ client features. For more information on the Novell client, see Chapter 4. \"\
    OES Linux Clients.\"\n\n# NetDrive Prerequisites\n\nNetDrive runs on any Windows\
    \ workstation, including Windows 95/98/Me and Windows XP/2000/NT. You need only\
    \ 2MB of available space on your hard drive to install and run the NetDrive client.\n\
    \n# WARNING\n\nIf you are installing the NetDrive client on a Windows 95 workstation,\
    \ make sure you have installed the Winsock 2 update from Microsoft. It is available\
    \ on the Microsoft website.\n\nNetDrive supports three protocols for accessing\
    \ network files:\n\n- WebDAV: NetDrive integrates with NetStorage to provide a\
    \ comprehensive file access solution with little client overhead. NetStorage must\
    \ be installed and configured prior to using NetDrive with WebDAV.\n\n- FTP: NetDrive\
    \ can access network files using the standard File Transfer Protocol (FTP). An\
    \ FTP server must be installed and configured on your network before using NetDrive\
    \ with FTP. With OES, you can use one of the optimal FTP servers, described later\
    \ in this chapter, to provide this type of access.\n\n- iFolder: NetDrive can\
    \ access files from your directory to the iFolder server. iFolder must be installed,\
    \ and your iFolder account configured, prior to using NetDrive with iFolder.\n\
    \nThe choice of protocol depends largely on your network environment. One is not\
    \ preferable to another. Use the protocol that fits your network strategy.\n\n\
    # Using NetDrive\n\nThe latest version of the NetDrive client is available by\
    \ searching on netrive at http://support.novell.com/finder. If you need help installing\
    \ the NetDrive client, see Chapter 4.\n\nWith the NetDrive client installed, you\
    \ can access files on any OES Linux servers using standard Internet protocols.\
    \ However, not every protocol is supported on every version of Windows.\n\n- iFolder:\
    \ Windows NT and XP/2000\n- FTP: Windows 95, 98, NT, and XP/2000\n- WebDAV (HTTP):\
    \ Windows 95, 98, NT, and XP/2000\n\n# Novell iFolder\n\nNovell iFolder gives\
    \ you automatic, secure, and transparent synchronization of files between your\
    \ hard drive and the iFolder server, which results in easy access to personal\
    \ files anywhere. Being able to access your files from any computer, in any location,\
    \ eliminates the updating that is frequently necessary when local files are not\
    \ accessible over the network.\n\nNovell iFolder has three components:\n\n- iFolder\
    \ server: After you have installed the iFolder server on your server, users can\
    \ install the iFolder client in order to access your files. Administrators use\
    \ the iFolder Management console to manage iFolder user accounts. The iFolder\
    \ Management console enables you to perform administrative tasks for all iFolder\
    \ user accounts and be customized to the look and feel of your organization.\n\
    \n- iFolder client: Novell iFolder client is compatible with Windows 95/98, Windows\
    \ XP/2000/NT, and Linux. The iFolder client must be installed on every workstation\
    \ that you will use to access iFolder files. When the iFolder client is installed,\
    \ it does three things:\n    - It creates a shortcut to your iFolder directory\
    \ on your desktop. The iFolder directory, which by default is located in My Documents\\\
    iFolder\\Home, is where you will keep the files you want to synchronize with the\
    \ iFolder server.\n    - On Windows workstations, an iFolder icon is placed in\
    \ the system tray. Right-clicking the system icon gives users access to user-configurable\
    \ preferences and the iFolder status screen, which displays a history of the transactions.\n\
    \    - A user account is created automatically. When you log in, iFolder asks\
    \ you for a username and a password. This passphrase is used to encrypt files\
    \ that are uploaded to the server.\n\nNOTE: Uninstalling the iFolder client does\
    \ not delete the associated user account on the iFolder server. This can be done\
    \ only from the iFolder Management console.\n\n- iFolder applet: use iFolder applet\
    \ to access iFolder files from a workstation on which iFolder client is not installed.\n\
    \n# FTP Server\n\nSeveral FTP servers are available for the Linux platform. With\
    \ SLES, two commonly used FTP servers are Pure-FTP (pure-ftpd) and VSFTP (vsftpd).\
    \ Both of these FTP servers are available for SLES distributions and may be installed\
    \ optimally during the OES installation.\n\nPure-FTP is intended to provide fast,\
    \ lightweight FTP access to a Linux server. It offers tight integration with the\
    \ Linux kernel and a standards-compliant, security-aware design.\n\nVSFTTP, or\
    \ Very Secure FTP, is an FTP server that was coded with a focus on security. Given\
    \ the focus of its server, it is the FTP most commonly used with SLES and will\
    \ be the center of this discussion.\n\nRegardless of the server you select, the\
    \ purpose of FTP server is to provide a means of easily transferring files over\
    \ network connections. All File Transfer Protocol (FTP) servers communicate over\
    \ TCP/IP and should conform to RFC 959. VSFTP meets these requirements. When the\
    \ primary VSFTP daemon (vsftpd) is started, you can perform file transfers from\
    \ any client to the OES Linux server. This is normally done by authenticating\
    \ as a local user to the FTP server. However, if you are also using the LUM component\
    \ of OES, FTP users can be configured for redirection back to their home directory.\
    \ Without LUM, the FTP server will be limited to authenticating locally stored\
    \ users. For more information on LUM, please see Chapter 8 \"Users and Network\
    \ Security.\"\n\nThe VSFTP server is a fully functional FTP server with many features,\
    \ such as those in the following. This section provides basic installation and\
    \ configuration information so that you can use FTP file access with NetDrive.\n\
    \n- xinetd-based service management: The Internet Server Daemon Extended, or xinetd,\
    \ manages the vsftpd process. This allows xinetd to provide an additional layer\
    \ of security for vsftpd. As incoming requests are encountered, xinetd verifies\
    \ the request, and if allowed, spawns the vsftpd process. With this integration,\
    \ FTP service management is performed via the YaST Network Services (inetd) module.\n\
    \n- Authenticated user access: Local user accounts can be used to provide local\
    \ and LUM users with complete access to private files. These accounts can be locked\
    \ into their home directory through the use of a CHROOT jail.\n\n- Anonymous user\
    \ access: Anonymous user accounts can be set up to provide users with basic access\
    \ to public files. Using a CHROOT jail, anonymous access can be locked into a\
    \ specific directory structure to reduce potential security risks.\n\n- Firewall\
    \ support: If the FTP client is behind a firewall, FTP server supports passive\
    \ mode data transfer and the configuration of a range of passive data ports.\n\
    \n- FTP logs: The FTP service maintains a log of several activities, including\
    \ FTP sessions, unsuccessful login attempts, active session details, and system\
    \ error FTP overruled messages.\n\nFor detailed information on all VSFTP server\
    \ features, see the VSFTP homepage at http://vsftpd.beasts.org/\n\n# Installing\
    \ FTP Server\n\nThe VSFTP server can be installed as an optional component during\
    \ the OES Linux installation or can be installed later through YaST. To install\
    \ VSFTP using YaST:\n\n1. Access YaST from a terminal using, or from a graphical\
    \ environment using yast2 or the YaST launcher\n"
  mdcn: "\n\n# Novell NetDrive\n\nNovell NetDrive 允许您将网络驱动器映射到任何 OES Linux 服务器，而无需使用\
