    # Upgrading the Novell Client


    There are a couple of options for upgrading workstations with existing Novell
    Client installations. You have the option of automatically checking for updates,
    and running fully or partially automated upgrade routines for your users, depending
    on your needs.


    # Novell Client Install Manager


    The Novell Client platform-specific installation utilities each read a configuration
    file in order to properly install and configure the various properties of the
    client. This file is stored in the same folder as the installation utility, and
    provides information such as where to copy drivers during installation and the
    most recent version number. This configuration file is configurable through the
    Novell Client Install Manager (NCIMan).


    NOTE


    For Windows 9x workstations, options that were previously stored in NWSETUP.INI
    or made available from the command line in previous versions of Novell Client
    are now configured through NCIMan.


    To create or modify a configuration file with NCIMan, complete the following steps:


    +   1. Copy the /WINT or /WIN95 directory structure to the server from which users
    will access the client files. This structure is created when you extract the Novell
    Client files from the ZIP file downloaded from http://download.novell.com.


    +   2. Launch Novell Client Install Manager (see Figure 4.2):

    * Windows XP/2000 NCIMAN.EXE is located in /WINT\t386\admin.

    * Windows 9x NCIMAN.EXE is located in /WIN95\IBM_<lan>\ADMIN\ where <lan> is one
    of the languages supported by the Novell Client.


    Figure 4.2. NCIMan utility from the Novell Client.


    [View full size image]


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_65_0.png)


    +   3. Click the New button.


    +   4. Specify the platform for which you are creating a configuration file and
    click OK.'
