    # 第 8 章 用户与网络安全


    ## 快速上手


    - OES Linux 中的用户概述

    - eDirectory 用户相关对象

    - eDirectory 身份验证

    - eDirectory 授权

    - 预置 Linux 用户


    ## 快速上手


    ### 创建用户和组


    - 使用 iManager 创建用户和组对象。

    - 若要设置模板以使您创建的所有用户都能获得一组共同特征，请使用 iManager 创建模板（Template）对象对象。


    ### 确保登录安全


    - 若要创建账户限制，通过 iManager 访问用户或组属性。

    - 若要设置或更改密码，通过 iManager 访问用户对象属性。


    ### 使用 eDirectory 安全功能


    - 使用 iManager 查看或更改 eDirectory 对象或属性权限。


    ## OES Linux 中的用户概述


    从根本上说，OES Linux 为终端用户提供文件和打印服务以及支持网络功能的应用程序支持。这些感知用户的服务需要某种方法来定位有效的用户账户，然后对请求的用户进行该账户的身份验证。在确定身份和权限后，服务将在相应的环境中启动。


    所有的 OES 用户账户都存储并管理在 eDirectory 中。然而，并非所有的应用程序和服务都直接集成或支持 eDirectory。为了尽可能将 eDirectory
    的功能引入尽可能多的应用程序，OES Linux 提供了两种主要的身份验证方法支持：


    - 原生 eDirectory

    - LDAP


    ### 原生 eDirectory


    感知 eDirectory 的服务是指理解 eDirectory 应用程序接口（API）的服务。理解此 API 的服务的优势可以直接与 eDirectory
    通信，并利用 eDirectory 多年来提供的许多高级功能。


    OES Linux 提供了多个通过此 API 直接与 eDirectory 通信的服务。示例包括 iManager、Virtual Office、iFolder、Novel
    Client 等。通过与 eDirectory 进行直接 API 通信，这些服务可以利用卷上提供的高级身份验证机制和复杂的权限结构。


    ### LDAP


    不利用 eDirectory API 的服务仍然可以 eDirectory 进行用户存储和账户管理。为了实现这一点，这些服务依赖于一种被称为轻级目录访问协议（LDAP）的行业标准。


    LDAP 是一种用于与包含某些信息的目录通信的协议。在 eDirectory 的情况下，请求的信息通常是用户账户详情。带有 eDirectory 的 OES
    Linux 安装自动支持用于此目的 LDAP 连接。可以配置感知 LDAP 的服务通过使用到 eDirectory 的 LDAP 连接来利用这一点。该连接随后被用于在启动服务之前定位并验证用户账户。


    OES Linux 许多重要的 Linux 服务依赖于此功能。一个示例是 Samba 软件套件为 Windows 用户提供 Linux 资源，就像 Linux
    服务器实际上运行 Windows 一样。此功能要求 Windows 用户像访问任何其他 Windows 一样对 Linux 服务器进行身份验证。传统的，Samba
    将用户存储在 Samba 特有的本地文件中。在 OES Linux 中，Samba 配置为使用 LDAP 定位允许 Samba 资源的 eDirectory
    用户。


    另一种情况是将启用插件式身份验证模块（PAM）的服务到 eDirectory。在 Samba 中，通过 OES 修改 eDirectory 用户对象，以便通过
    LDAP 和 eDirectory 为任何感知 PAM 的服务提供 Linux 身份验证。这是通过 OES 的 Linux 用户管理提供的。可以使用此功能的服务如
    SSH、FTP 和本地登录。


    重要的是，对于这些不原生支持 eDirectory 的服务，必须满足三个条件才能支持对账户的 LDAP 存储和身份验证：


    ## eDirectory 用户相关对象


    OES 用户都存储在 eDirectory 中。除了在服务器之间注册这些对象并提供基础账户身份验证外，eDirectory 还提供了一个坚实的安全模型，包括受托人分配、管理角色、继承权限和过滤器。理解用户相关对象以及
    eDirectory 提供的安全模型，对于实现安全的用户环境至关重要。


    有三个 eDirectory 对象帮助组织你的网络用户。你可以使用 iManager 创建并管理这些对象的每一种类型（有关关于 iManager 的更多信息，请参见第
    5 章“OES 管理工具”）：


    - 用户对象（User object）

    - 组对象（Group object）

    - 组织角色（Organizational role）


    这些对象形成了最终交付基于 eDirectory 的网络和服务权限的基础。毕竟，在安装新的 OES Linux 和 eDirectory 后，唯一存在的 eDirectory
    用户对象是 Admin（根用户确实存在，但作为本地用户，而不是存储在 eDirectory 中）。虽然认为单节点网络可能让你感到安慰，但你将为每一个用户创建用户账户。用户账户创建后，你的用户就可以在网络上工作了。在大多数情况下，网络上的用户会注意到与在独立计算机上工作的一点不同。他们仍然使用以前使用的应用程序。他们仍然以相同的方式打开、保存和删除文件。如果你限制了他们，他们仍然可以玩以前玩过的游戏！


    这就是网络安全的目标：防止用户由于无意或故意的采取某些可能损害网络完整性或以可能对网络或组织造成损害的方式暴露网络资源的操作。在当今的网络中，有多个级别的网络安全，OES
    Linux 让你对每个层级都有大量的控制。


    ### 用户对象


    要创建 eDirectory 用户对象，请完成以下步骤：


    1. 启动 iManager。在导航框架中，打开 Users 组并选择 Create User（见图 8.1）。


    图 8.1. 在 iManager 中创建新用户。


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_147_0.png)


    ## eDirectory 身份验证


    身份验证提供了访问网络资源的门径。如果没有强大的身份验证机制，敏感的网络资源将对任何人开放。目前用于 eDirectory 的主要验证方法是用户名/密码组合。插件式身份验证模块（NMAS）使得集成更多的身份验证和授权技术到环境中成为。此外，NMAS
    提供了通用密码，改进了传统的基于密码的身份验证方法。


    ### 插件式身份验证模块


    NMAS 旨在帮助保护你的网络。NMAS 为保护你的 OES Linux 环境提供了更健壮的框架。如果你不熟悉 NMAS 的不同组件，你应该了解以下概念。有关每个概念的更多信息在
    OES 在线文档中。


    ### 操作阶段


    在某些特定时刻，NMAS 有助于保护你的网络环境：


    - 用户识别发生在实际身份验证过程之前。它提供了一种自动收集用户身份验证信息并使用其填充 Novel Client 登录框的方法。

    - 身份验证是用户证明他们是其声称身份的机会。NMAS 支持多种身份验证方法。

    - 设备移除检测是在身份验证后确定用户不再存在时锁定工作站的能力。


    每个操作阶段都是完全独立的。你可以选择为每个阶段使用相同或完全不同的身份验证技术。为了提供此功能，NMAS 为 eDirectory 身份验证引入了一些额外的概念：


    - 登录因子

    - 登录方法和序列

    -  分级身份验证


    ### 登录因子


    NMAS 使用三种登录网络的方法，被称为登录因子。这些登录因子描述了用户可以用于验证网络的不同项目或属性：


    - 密码身份验证 也称为“你所知道的”，密码身份验证是传统的网络身份验证方法。它仍然负责正在进行的网络身份验证的大部分，包括 LDAP 身份验证、浏览器身份验证和大多数其他目录。


