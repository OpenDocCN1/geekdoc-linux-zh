    # Novell 虚拟办公室


    Novell Virtual Office 允许网络管理员通过浏览器访问网络资源，快速、方便地个性化用户门户。有效而言，Virtual Office 允许您创建一个门户，用户可以从单一网站访问其数据和应用程序。不仅如此，Virtual
    Office 还提供了创建虚拟团队的能力，即即时共享门户，可以支持项目或任何其他需要访问共享资源的组。


    Virtual Office 提供了允许您通过 Virtual Office 接口访问网络服务的各项。这些服务是基于 Java 的小型 Servlet（servlets）或应用程序，用于提供对网络资源的特定访问。OES
    包含了默认的 Virtual Office 服务，用于访问网络资源和执行常见的网络任务：


    - NetStorage：提供对 Novell NetStorage 服务的访问。NetStorage 提供基于互联网的 OES 服务器上文件存储的访问，并对
    iFolder 访问进行索引。NetStorage 和 iFolder 都在第 12 章“OES Linux 文件访问”中讨论过。

    - iPrint：提供通过 iPrint 进行互联网打印的访问。有关 iPrint 的更多信息，请参阅第 13 章“OES 打印服务”。

    - 电子邮件（Email）：支持流行的电子邮件应用程序和协议，包括 Novell GroupWise、Microsoft Exchange、Lotus Notes、Novell
    NetMail、POP3 和 IMAP。

    - eGuide：提供一个简化的界面来访问 eDirectory 中存储的电话号码和其他用户信息，eGuide 将在本章稍后部分进行详细讨论。

    - 修改密码（Change Password）：链接到用户可以在其中更改 eDirectory 密码的页面。

    - Web 搜索（Web Search）：提供与 Novell Web Search（或 QuickFinder）服务器的集成。QuickFinder 将在本章稍后部分进行详细讨论。

    - ZENworks：通过 Virtual Office 接口提供与 Novell ZENworks 桌面功能的集成，例如应用程序分发。


    对于作为网络管理员的您来说，最重要的是，Virtual Office 不需要任何复杂的开发或编程。它开箱即用，非常快速。


    # 安装 Virtual Office


    可以使用 Novell Virtual Office Server 模式将 Virtual Office 安装在专用服务器上，或者在 OES Linux 安装期间作为可选组件安装。Virtual
    Office 也可以稍后通过 YaST 安装。


    注意


    对于大多数网络，您需要在每个 eDirectory 树中的一台服务器上安装 Virtual Office。


    # Novell QuickFinder


    虽然 QuickFinder 不是 OES Linux 的强制性 Web 服务，但它能尽可能快速、准确地为员工和客户提供 Web 资源。QuickFinder
    支持从简单的内部搜索到您可以为组织提供的付费复杂搜索服务等所有功能，QuickFinder 是目前可用最快、最准确的搜索引擎之一。


    Novell QuickFinder（以前称为 Novell Web Search）提供了一个强大的全文搜索引擎，您可以使用它为您的网络或互联网网站添加搜索功能。这些功能可以通过自定义的搜索表单和搜索结果页集成到
    Apache Web 服务器环境中。这些页面可以从零开始创建，也可以基于包含的页面模板之一创建。


    本节向您介绍 QuickFinder 及其基础安装和配置。然而，要获取全面信息，请参阅 OES Linux 在线文档。


    ## QuickFinder 功能


    通过 Novell QuickFinder，您可以：


    - 支持从单一界面搜索多语言索引

    - 为多个组织托管搜索服务

    - 将来自不同来源的相关的文件集组织成单个文档

    - 创建自定义搜索、打印结果、错误和响应消息，并将其应用于单个搜索或跨所有支持的语言

    - 通过查看搜索来收集客户指标，以识别您的客户最寻找什么

    - 通过帮助他们更快地找到信息来提高员工生产力


    ## 安装 QuickFinder


    Novell QuickFinder 可以使用 Novell QuickFinder Server 安装模式安装在专用服务器上，或者在自定义 OES Linux
    安装期间作为可选组件安装。QuickFinder 也可以在完成后通过 YaST 安装。


    要使用 YaST 安装 QuickFinder，请完成以下步骤：


    1. 从终端使用 `yast` 访问 YaST，或从图形环境使用 `vast2` 或应用程序菜单中的 YaST 启动器访问 YaST。

    2. 在 YaST 中选择“网络服务”（Network Services）。在此类别下，找到并选择 Novell QuickFinder 模块。该模块将检测到缺少
    QuickFinder 的 RPM 并询问您是否要安装。选择“继续”（Continue）安装必要的包。

    3. 软件安装完成后，将执行 `SoConfig` 以更新系统配置。完成完成后，OES 组件的配置将自动开始。


    # Novell eGuide


    Novell eGuide 是一个“黄页”应用程序，提供了一个简单的基于浏览器的界面，员工可以通过该界面在其 LDAP 目录（即 eDirectory）中搜索可能需要定位的所有、地点和物品。


    eGuide 看起来像标准的地址录，但它是完全独立于平台和应用程序的。任何授权用户都可以通过标准 Web 浏览器访问。


    eGuide 还能根据用户运行的搜索启动次级应用程序。例如，当用户找到他们寻找的人时，eGuide 允许他们启动任何符合其当前需求的通信类型，即时消息，甚至是视频会议。


    # 安装 eGuide


    Novell eGuide 可以作为 OES Linux 分发版的可选组件安装，也可以在安装后通过 YaST 安装。


