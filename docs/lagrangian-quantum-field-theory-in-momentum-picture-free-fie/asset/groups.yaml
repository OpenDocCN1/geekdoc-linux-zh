    ## Novell 课程与认证


    如果您希望在课堂环境中学习 Linux、NetWare 或任何其他 Novell 服务或产品，Novell 培训提供了各种实操实验室和知识丰富的讲师。作为
    IT 培训和认证的先驱，Novell 提供了广泛的培训机会。有关 Novell 课程、认证和材料的最新信息，请访问 Novell 培训网站：


    http://www.novell.com/training/


    Novell 课程在全球范围内一千多家 Novell 培训服务伙伴 (NTSP) 授授。它们还在 100 多个 NATP（Novell 学术培训伙伴）授授，这些机构是教授此类课程的大学和学院。


    认证课程提供了一种在几天内获得直接实操培训的绝佳方式。如果您更愿意按照自己的进度学习材料而不是参加课程，也可以选择计算机培训（CBT）形式的课程。


    如果您想成为 CNE（认证 Novell 工程师），这标志着您是 Novell 专业人士，这些课程也将对您有所帮助。


    Novell CNE 计划提供了一种方式，确保网络专业人员符合安装和管理 NetWare 的必要标准。要获得 CNE 身份，您需要在 NetWare 的不同方面参加一系列考试。在许多情况下，您可能希望参加
    Novell 通过其 NTSP 提供的课程来准备考试，但这些课程并非强制性。


    您参加的课程和考试在某种程度上取决于您想要实现的认证级别。虽然所有级别都需要通过某些核心考试，但您也可以参加额外的选修课程以获得您所需的认证和专业领域。


    目前提供以下级别的认证：


    - CNA (认证 Novell 管理员) 此认证是最基础的级别。它让您准备好管理自己的 NetWare 网络。它不涉及 NetWare 更复杂和技术性的方面。如果您是
    NetWare 的初新手，强烈建议参加该认证提供的课程。

    - CNE (认证 Novell 工程师) 此认证级别确保您能够充分地安装、管理和支持 NetWare 网络。在追求 CNE 认证期间，您需要“申报主修”，这意味着您选择专攻某个特定的
    Novell 产品族。例如，您可以成为 Novell 6 CNE 或 GroupWise CNE。获得这一级别的认证涉及几项考试（以及相应的课程）。

    - Master CNE 此认证允许您超越 CNE 认证。要获得 Master CNE，您需要申报“研究生主修”。您将在网络运行的集成和以解决方案为导向方面比
    CNE 级别更深入。

    - CNI (认证 Novell 讲师) CNI 授权通过 NTSP 教授 NetWare 课程。这一级别的测试和课程确保参加的人员能够充分教授他人如何安装和管理
    NetWare。


    ## 高级技术培训


    除了标准的 Novell 培训课程，Novell 还提供了被称为高级技术培训 (ATT) 的高技术性研讨会。ATT 是 Novell 提供的高级培训，涵盖了广泛的高级主题，包括支持问题、深度评审和高级企业解决方案。ATT
    是让您和您的 IT 员工技能保持最佳状态以便有效支持新兴技术和复杂网络基础设施解决方案的绝佳方式。有关 ATT 的更多信息，请访问网站：


    http://www.novell.com/training/pep/att/def.html


    ## Novell 用户国际协会


    Novell 用户国际 (NUI) 是一个网络专业人士的非营利协会。在全球范围内有 250 多个附属小组，NUI 为网络专业人士提供了一个面对面交流、相互学习、交换建议或仅仅分享经验故事的论坛。


    通过加入您所在地区的 Novell 用户组，您可以与当地的其他 Novell 专业人士建立联系并拓展人脉，参加定期的当地用户组会议进行培训，并参加在不同地点举办的区域
    NUI 大会。更多信息，请访问 NUI 网站：


    http://www.novell.com/nui/


    '
