    # Chapter 3. Working with SUSE Linux Enterprise Server 9


    - Instant Access

    - Logging in to Linux

    - The Shell and the GUI

    - Finding Your Way

    - Getting Help

    - Editing Text Files


    ## Instant Access


    Working with SUSE Linux Enterprise Server (SLES) requires an understanding of
    the login process, including local account systems, authentication, and managing
    identities.


    Using a console shell or the graphical environment are two possible methods of
    working on a SLES machine.


    Finding your way around a SLES installation requires an in-depth knowledge of
    the filesystem layout. Essential filesystem components are documented and explained
    in this chapter. Basic filesystem permissions are also described.


    The SLES help system enables the use of both man and info pages.


    Editing text files from a console session is normally done with the vi editor.
    Modes of vi are explained and tables of common commands used with vi are provided.


    Although a complete guide to using SUSE Linux Enterprise Server (SLES) is beyond
    the scope of this book, an understanding of Linux and basic Linux functionality
    is necessary for successful deployment of OES Linux.


    This chapter will discuss essential Linux concepts, such as understanding the
    login process, using the command-line and graphical environments, finding your
    way around the filesystem, using the available helps, and understanding text-editing
    tools. Linux-proficient administrators may want to skip Chapter 6, but browsing
    through this chapter for an introduction to SUSE-specific utilities and environments
    might be helpful. If you are new to Linux, this chapter should get you started,
    but this is not intended to be a comprehensive or beginner''s guide.


    If you''d like a more thorough investigation into Linux fundamentals or SLES administration,
    Novell Education''s Certified Linux Professional (CLP) and Certified Linux Engineer
    (CLE) programs are all worth looking into. For more information on Novell''s SUSE
    Linux certification options, see Appendix A, "CLE Certification Options."


    ## Logging in to Linux


    After installing and booting a SLES server, you should be presented with either
    a text or graphical login prompt. Entering an appropriate username and password
    will give you access to the server. For an administrator, it is important to understand
    how access is granted and how local SLES user accounts are configured. It is also
    important to have knowledge prior to implementing O components as Linux User Management
    (LUM). The following section will briefly discuss local user accounts and how
    the local authentication process works.


    ### Local Account Files


    On a SLES9 server, local user accounts are defined in the /etc/passwd file as
    shown in Figure 3.1. Every user defined in this file must contain attributes that
    are used by the server for determining such things as user permissions and login
    name. The format of /etc/passwd is one user entry per line.


    Figure 3.1. An example of the /etc/passwd file.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_37_0.png)


    Each line within the passwd file is made up of five fields, separated by colons.
    These fields provide the necessary attributes for user accounts to be considered
    valid by the operating system. The purpose of each field is documented in Table
    3.1 for the entry jdoe:x:1000:100:John Doe:/home/jdoe:/bin/bash.


    Table 3.1. Explanation of /etc/passwd Entry


    | FIELD ENTRY | DESCRIPTION |

    | --- | --- |

    | jdoe | User login name. |

    | x | Password field. If an "x" is in this field, shadow passwords are enabled.
    A "*" in this field prevents most types of local logins. |

    | 1000 | Numeric User ID (UID) of this account. |

    | 100 | Numeric primary Group ID (GID) of this account. |

    | John Doe | General Electric Comprehensive Operating System (GECOS) Commonly
    used for the user''s full name or description. |

    | /home/jdoe | User''s home directory. |


    ## The Shell and the GUI


    You can interact with SLES using one of two methods. The first method is the use
    of a shell or console, and the second method is a Graphical User Interface (GUI).
    This section will explain and discuss both environments and provide tips for using
    these two components of SLES.


    ### The Shell


    The heart of the SLES operating system is the Linux kernel. The kernel''s primary
    responsibility is to manage running processes and their interaction with the various
    hardware components of a computer. This includes management of memory (RAM), processors
    (CPU), hard disks, and other hardware components. Left on its own the kernel manages
    these components well. However, without the guidance of a user or administrator,
    the kernel will certainly not accomplish anything!


    For an administrator, the ability to interact with the Linux kernel can be more
    important than the kernel itself. One important way to facilitate interaction
    with the kernel is through the use of a "shell".


    A shell is a program designed to accept user input, validate that input based
    on certain criteria (such as syntax and permissions), and then pass instructions
    to the kernel for processing. This functionality is very similar to the familiar
    DOS shells used in Microsoft Windows environments. Linux shells, however, are
    much more powerful than non-Unix shells and therefore more complex and master.


    One reason for this complexity is that several shells are available for Linux
    environments. Although the purpose of these shells is essentially the same across
    all variations, the implementations can differ dramatically. The differences are
    typically manifest in syntax and feature-set capabilities, but each shell can
    be substantially different.


    Table 3.7. Common Shells


    | SHELL | BINARY PROGRAM | COMMENTS |

    | --- | --- | --- |

    | Bourne Shell (SH) | /bin/sh | The standard command interpreter. On Linux, sh
    is often |

    | GNU Bourne-Again Shell (BASH) | /bin/bash | An improved version of the Bourne
