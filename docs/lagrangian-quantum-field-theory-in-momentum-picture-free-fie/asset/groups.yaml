    # Instant Access


    # Managing Logical Volumes


    - To create, delete, or enlarge a logical volume, use the volume management options
    in iManager, or the console-based nssmu.

    - To mount/dismount or activate/deactivate a logical volume, use the volume management
    options in iManager, or the console-based nssmu.

    - To verify or rebuild a logical volume or pool, use the console-based rasvui.


    # Managing Disk Space


    - To manage file compression, use nsscon to set file compression parameters.

    - To limit users'' disk space, use volume management options in iManager.


    # Managing Files


    - To salvage or purge deleted files, use the NetWare Utilities option in the Novell
    Client or ConsoleOne.

    - To display information about files and directories, view the NetWare Info tab
    of the file or directory properties using the Novell Client.


    # NSS Directory and File Security


    - To view or change filesystem trustee assignments, use the rights command-line
    utility. The Novell Client and NetStorage can also be used.

    - To view or change directory and file attributes, use chmod or NetStorage.


    # Backing Up and Restoring Files


    - To back up and restore network files, use nbackup from the server console. For
    a more comprehensive backup/restore solution, use a third-party backup product
    that is SMS-compliant.


    File storage and management are the core of any network server, and Novell NetWare
    has long offered the capability to manage files in many ways. The primary tool
    for file management has been Novell Storage Services (SSS). With OES Linux, Novell
    has brought this powerful filesystem to the Linux world.


    This chapter looks various file storage capacities and options available in OES
    Linux and discusses the advantages and potential pitfalls of each. This chapter
    also covers the SMS services offered by OES.


    # Novell Storage Services


    Novell Storage Services (SSS) is a powerful filesystem that provides efficient
    ways to manage storage devices. One of the main features of NSS is its integration
    with eDirectory, which allows for powerful security capabilities. With NSS, each
    directory and file has its own permissions, which can be managed through iManager
    or command-line tools.


    Another benefit of NSS is its support for Access Control Lists (ACLs), which allow
    for more granular control over files and directories. This is particularly useful
    for organizations that have complex security requirements.


    NSS also offers a variety of other features, such as compression, encryption,
    and snapshots. These features can help you manage your storage more efficiently
    and protect your data.

