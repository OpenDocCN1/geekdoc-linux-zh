    # # Removing the Client Software


    To remove the Novell client software from a Windows workstation, use the Novell
    control panel. The Novell uninstall will remove all components from the workstation,
    but will leave behind a minimal footprint in the Windows Registry. That way, if
    you reinstall the client at a later time, the installation program can automatically
    load the same settings that you used previously.


    To remove the Novell client from Windows XP/2000, complete the following steps:


    +   1. Open the Network control panel by right-clicking My Network Places and
    selecting Properties.


    +   2. Right-click Local Area Connection and selecting Properties.


    +   3. Select the Novell Client for Windows entry from the list of installed network
    services and click Uninstall.


    +   4. Click Yes to confirm your decision.


    +   5. Reboot the workstation to complete the client removal.


    To remove the Novell client from Windows 9x, complete the following steps:


    +   1. Open the Network Control Panel applet by selecting Start, Settings, Control
    Panel and then selecting Network. Alternatively, you can access this utility by
    right-clicking Network Neighborhood.


    +   2. Select Novell NetWare Client from the list of installed network services
    and click Remove.


    +   3. Click Yes to confirm your decision.


    +   4. Reboot the workstation to complete the client removal.


    NOTE


    You can also remove the client from the Control Panel by selecting the Add/Remove
    Programs option, selecting Novell Client for Windows, and then clicking Remove.
    You will still have to reboot to complete the removal of the client software.


    To remove the Novell client from Windows 9x, complete the following steps:


    +   1. Open the Network Control Panel applet by selecting Start, Settings, Control
    Panel and then selecting Network. Alternatively, you can access this utility by
    right-clicking Network Neighborhood.


    +   2. Select Novell NetWare Client from the list of installed network services
    and click Remove.


    +   3. Click Yes to confirm your decision.


    +   4. Reboot the workstation to complete the client removal.


    When the workstation has been rebooted, the removal of the Novell client is complete.'
