    ## The Client Login


    When the Novell Client has been installed, you can view and set login options
    from the Novell Login by clicking the Advanced button, as shown in Figure 4.6.


    Figure 4.6. Novell client login screen showing the Advanced options.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_68_0.png)


    NOTE

    The Windows tab, not shown in Figure 4.6, is only available prior to logging in
    to Windows. From this tab, you can specify the Windows username and workstation
    name that will be used by the Novell Client to transparently log you into the
    workstation part of the Novell login process.


    ## NDS Tab


    The NDS tab, as shown in Figure 4.6, allows you to specify the eDirectory tree,
    name context, and server to use during login. All users should specify their eDirectory
    tree and name context. A server needs to be specified only when connection to
    a NetWare 3 server is needed or when you are trying to log in to a specific server.
    When logging into a Linux server, that must be running OES. In order to map drives
    to that Linux server, the NCP Server OS component must be installed.


    ## Script Tab


    The Script tab (see Figure 4.7) is used to manage the execution of login scripts.
    It allows you to specify whether or not to run scripts; whether or not to display
    the login results (close it automatically); and which profile and user login scripts
    to execute. The Variables button allows you to specify values for any script variables
    that might be included in the login scripts.


    ## Configuring the Client


    After you have installed the Novell client software, you can configure the client
    software by modifying its properties. The client properties enable you to specify
    information such as login preferences, protocol settings, default capture settings,
    and so on. To open the client properties pages, right-click the red N in the system
    tray and click Novell Client Properties, which will open the Novell Client Configuration
    options (see Figure 4.10).


    **Figure 4.10. Configuration options for the Novell Client.**


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_71_0.png)


    Several configuration pages are available in Novell Client properties. For detailed
    information on Novell Client property pages, see the online OES documentation.


    - The Client Page page lets you define basic login preferences


    ## NetIdentity


    The NetIdentity agent leverages what is known as the XTier framework used with
    NetStorage, Apache, and Tomcat services to provide single sign-on across all Novell
    services that use eDirectory authentication. The only caveat to is that the first
    service with which a user authenticates must be NetIdentity-enabled. The list
    of NetIdentity-enabled services includes the following:


    - Novell Client (v3.4x for Windows 9x and v4.9x for Windows XP/2000)

    - iFolder 2.x

    - iPrint

    - NetStorage

    - Novell Portal Services


    When you have authenticated with one of these services, accessing any other service,
    such as iManager, that uses eDirectory authentication will prompt a transparent,
    background authentication so that you aren''t required to re-enter your authentication
    information.


    To enable NetIdentity-based single sign-on on Novell services, complete the following
    tasks:


    - Make sure that the XTier framework is installed on all OES NetWare servers to
    which users will authenticate.

    - Install the NetIdentity Agent on the workstation where you want NetIdentity
    services enabled.


    The XTier framework is installed automatically when you install NetStorage, Apache,
    and Tomcat services. It cannot be selected and installed separately, so if you
    want to use NetIdentity, install one or more of these services on your OES Linux
    server prior to continuing. If you are using XTier installed on a given server,
    point your browser to the following:


    ```

    http://<server IP or DNS name>/oneNet/xtier-login

    ```


    If XTier is installed you will see an authentication box, indicating that the
    server can recognize credentials passed by NetIdentity.


    To install the NetIdentity Agent, complete the following steps:


    1. Locate the netidentity folder where the Novell Client files are extracted from
    the ZIP file downloaded from http://download.novell.com. For example, Novell client
    for Windows XP/2000, the NetIdentity folder is located in WINNT\x86\.

    2. Run SETUP.EXE located in the netidentity folder.

    3. Select the Installation language and click OK.


    ## Other Novell Clients


    In addition to the traditional Novell client, there are three other clients compatible
    with OES Linux. They are as follows:


    - NICI client

    - NMAS client

    - NetDrive client


    In addition to these three feature-specific clients, there are a few others that
    are installed automatically with their respective software document. Each of these
    will be discussed as part of its product overview in other chapters throughout
    this book.


    ## NICI Client


    The Novell International Cryptographic Infrastructure (NICI) is the modular foundation
