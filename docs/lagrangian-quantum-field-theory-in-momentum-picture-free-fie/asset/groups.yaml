    # eDirectory Errors


    There are a wide variety of error codes and conditions that can be reported in
    your Novell Directory environment. Specific information on each error is available
    in the Novell online documentation. You can also link to error code information
    from iMonitor by clicking an error directly within the DTrace screen. eDirectory
    error codes are usually displayed in decimal numbers.


    NOTE


    Because the eDirectory is designed as a loosely consistent database, temporary
    errors are normal. Don''t be alarmed if temporary error conditions occur and go
    as part of normal eDirectory operation. However, if errors persist for a significant
    period of time, you might need to take some action to resolve the problem.


    eDirectory error codes can be categorized as shown in the following subsections.


    ## eDirectory Agent Errors


    These are the error codes with which you will typically work when tackling some
    eDirectory problem. They come in two ranges:


    - 601 to 799

    - 6001 or higher


    The 6001 range is new to recent versions of eDirectory. These error codes identify
    errors originating in the eDirectory Agent running on your OES Linux server.


    ## Operating System Errors


    Certain eDirectory background processes or operations, such as network communications
    or time synchronization, require the use of functionality by the operating system
    on which eDirectory is running. These functions can return operating-system-specific
    error codes to eDirectory. These error codes are passed on to the eDirectory process
    or operation that initiated a request.


    Generally, negative numbers identify all eDirectory-generated operating system
    errors, whereas positive numbers identify all other operating system errors:


    - 1 to 256 eDirectory-generated operating system errors

    - 1 to 255 Operating system-generated errors


    This is an esoteric distinction for your information only. During trouble-shooting,
    you should treat occurrences of operating system errors with the same name, whether
    negative or positive, as relating to the same event.


    ## Client Errors


    In some cases, an eDirectory server will function as a client directory in order
    to perform certain background processes or operations. This can result in client-specific
    error codes being returned to eDirectory background processes and operations.
    The eDirectory client that is built into nsdg generates these error codes. Client
    error codes are in the range of 301 through 399.


    ## Appendix C. Where to Go for More Information


    Open Enterprise Server for Linux is a very large and complex product. It also
    includes a large number of services that many traditional Linux or NetWare administrators
    might not have seen before. Fortunately, Novell products are so popular and widely
    used that an entire support industry has developed around them. If you are looking
    for more information about Novell, Open Enterprise Server (for Linux or NetWare),
    or SUSE Linux, you''re in luck. You can go to a variety of places for help.


    This appendix points you toward sources of information that will help you:


    - Dig further into Novell''s vision and strategy

    - Find more information on OES Linux configuration and troubleshooting

    - Get more information on the new products and services offered with SUSE Linux


    ## General Novell Product Information


    If you encounter a problem with your network that you can''t solve on your own,
    there are several places you can go for help:


    - Try calling your reseller or consultant.

    - Call online, and if anyone in the online forums or Usenet forums knows about
    the problem or can offer a solution. The knowledge of the people in those forums
    is broad and deep. Don''t hesitate to take advantage of it, and don''t forget
    to return the favor if you know some tidbit that might help others.

    - Call Novell technical support. You might want to reserve this as a last resort,
    simply because Novell technical support charges a fee for each service request.
    The fee depends on the product for which you''re requesting support.


    When you call technical support, make sure you have all the necessary information
    ready, such as the versions of SUSE Linux or NetWare and any utility or application
    you''re using, the type of hardware you''re using, network or node addresses and
    hardware settings for any workstations or other machines being affected, and so
    on. You''ll also need a major credit card if you don''t already have a technical
    support contract.


    Novell''s technical support department also offers online information, technical
    bulletins, downloadable patches and drivers, offered on a subscription basis,
    that includes the support knowledge base, product evaluation library, and other
    useful support tools to help you support your Novell environment and plan for
    the future.


    To get in touch with Novell''s technical support, or to find out more about Novell''s
    technical support options, visit Novell''s support website:


    http://support.novell.com


    To open a technical support incident call, call 1-800-858-4000.


    ## Novell Cool Solutions


    Novell Cool Solutions is another way of hooking up with users. It offers product
    reviews, tips and tricks, and the opportunity to share knowledge with all over
    the world. To check out Cool Solutions, visit the website:


    http://www.novell.com/coolsolutions


    ## Novell AppNotes


    Novell Research produces a monthly publication called AppNotes. Each issue of
    AppNotes contains research reports and articles on a wide range of topics including
    network design, implementation, administration, and integration. AppNotes are
    available online:


    http://developer.novell.com/research


    ## Novell Connection


    Novell Connection is a bimonthly publication devoted to providing the latest strategy
    overviews, product reviews, and customer case studies. The Connection is written
    at a higher level than AppNotes, so it is ideal for helping you communicate IT
    messages to business executives. Best of all, Novell Connection is available online
    free! To check out the latest edition of Novell Connection, or past issues, visit
    the website:


    http://www.novell.com/connectionmagazine/


    ## Novell on the Internet


    A tremendous amount of information about SUSE Linux, NetWare and other products
    is available on the Internet. You can find information on Novell through official
    and unofficial sites like:


    http://www.novell.com/documentation


    The forums are not managed by Novell, but offer access to information about SUSE,
    NetWare and other Novell products. These forums can be found at:


    http://support.novell.com/forums

