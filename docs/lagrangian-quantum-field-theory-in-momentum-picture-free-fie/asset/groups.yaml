    # Instant Access


    # Using Virtual Office


    +   - Use preconfigured services to make OES Linux files, as well as common services
    such as NetStorage, iPrint, and email, available through a single portal website.


    +   - Access Virtual Office at https://<server name or IP address>/vo.


    +   - Configure Virtual Office through Administration links visible within Virtual
    Office to users with eDirectory administrative rights.


    +   - Virtual teams are a specialized instance of Virtual Office that you can
    use to create ad-hoc portals to support a community, group, or team focused on
    a specific project or topic of discussion.


    # Working with Novell QuickFinder


    +   - QuickFinder creates a web search engine for use by internal users (indexes
    relevant Internet websites) or by external users (indexes your web server information
    so that it can be effectively searched.)


    +   - QuickFinder can be configured and managed through the QuickFinder Server
    Manager pages, which are accessible at https://<server name or IP address>/qsearch/admin.
    Links to this management page are also available via iManager.


    # Working with eGuide


    +   - eGuide provides robust and secure LDAP white pages to access company information.


    +   - Access the eGuide search page at https://<server name or IP address>/eGuide.


    +   - Access the eGuide Administration Utility at https://<server name or IP address>/eGuide/admin/index.html.'
- md: "\n# Novell Virtual Office\n\nNovell Virtual Office allows network administrators\
    \ to quickly and easily personalize user portals through browser-based access\
    \ to network resources. Effectively, Virtual Office enables you to create portals\
    \ which users can access their data and applications from a single website. Not\
    \ only that, but Virtual Office also provides the capability to create virtual\
    \ teams, ad-hoc shared portals that can support a project or any other group that\
    \ needs access to shared resources.\n\nVirtual Office provides services that allow\
    \ you to access network resources through the Virtual Office interface. Services\
    \ are little Java-based servlets or applications that provide specific access\
    \ to network resources. OES includes default Virtual Office services for accessing\
    \ network resources and performing common network tasks:\n\n- NetStorage: Provides\
    \ access to the Novell NetStorage service. NetStorage provides Internet-based\
    \ access to file storage on an OES server, indexing access to iFolder. Both NetStorage\
    \ and iFolder were discussed in Chapter 12, \"OES Linux File Access.\"\n- iPrint:\
    \ Provides access to Internet printing by iPrint. For more information on iPrint,\
    \ see Chapter 13, \"OES Printing Services.\"\n- Email: Provides support for popular\
    \ email applications and protocols, including Novell GroupWise, Microsoft Exchange,\
    \ Lotus Notes, Novell NetMail, POP3, and IMAP.\n- eGuide: Provides a simplified\
    \ screen to access phone numbers and other user information stored in eDirectory,\
    \ eGuide is discussed in more detail later in this chapter.\n- Change Password:\
    \ Links to a page where users can change their password in eDirectory.\n- Web\
    \ Search: Provides integration with a Novell Web Search, or QuickFinder, server.\
    \ QuickFinder is discussed in more detail later in this chapter.\n- ZENworks:\
    \ Provides integration with Novell ZENworks for Desktops functionality, such as\
    \ application delivery, through the Virtual Office interface.\n\nPerhaps most\
    \ important to you as a network administrator, Virtual Office doesn't require\
    \ any complicated development or programming. It's pretty quick to go right out\
    \ of the box.\n\n# Installing Virtual Office\n\nVirtual Office can be installed\
    \ on a dedicated server using the Novell Virtual Office Server pattern or as an\
    \ optional component during the OES Linux installation. Virtual Office can also\
    \ be installed later through YaST.\n\nNOTE\n\nFor most networks, you will need\
    \ to install Virtual Office on only one server in each eDirectory tree.\n\n# Novell\
    \ QuickFinder\n\nAlthough QuickFinder isn't a required web service for OES Linux,\
    \ it is all making your web resources available to employees and customers as\
    \ quickly and accurately as possible. Supporting everything from simple internal\
    \ search to complex search services that you can offer to organizations for a\
    \ fee, QuickFinder is one of the fastest and most accurate search engines currently\
    \ available.\n\nNovell QuickFinder, previously called Novell Web Search, offers\
    \ a powerful, full-text search engine that you can use to add search capabilities\
    \ to your Network or internet websites. These capabilities can be integrated into\
    \ Apache Web Server environment through custom search forms and search result\
    \ pages. These pages can be created from scratch or based on one of the included\
    \ page templates.\n\nThis section introduces you to QuickFinder and its basic\
    \ installation and configuration. However, for comprehensive information, see\
    \ the OES Linux online documentation.\n\n## QuickFinder Capabilities\n\nWith Novell\
    \ QuickFinder, you can:\n\n- Support searching multiple-language indexes from\
    \ a single interface\n- Host search services for multiple organizations\n- Organize\
    \ collections of related files from diverse sources as a single document\n- Create\
    \ custom search, print results, error and response messages and apply them to\
    \ individual searches or across all supported languages\n- Gather customer metrics\
    \ by reviewing searches to identify what your customers look for the most\n- Improve\
    \ employee productivity by helping them find information more quickly\n\n## Installing\
    \ QuickFinder\n\nNovell QuickFinder can be installed on a dedicated server using\
    \ the Novell QuickFinder Server installation pattern or as an optional component\
    \ during a custom OES Linux installation. QuickFinder can also be installed after\
    \ the fact through YaST.\n\nTo install QuickFinder using YaST, complete the following\
    \ steps:\n\n1. Access YaST from a terminal using yast, or from a graphical environment\
    \ using vast2 or the YaST launcher from the application menu.\n2. Select the Network\
    \ Services in YaST. From this category, locate and select the Novell QuickFinder\
    \ module. This module will detect the RPMs for QuickFinder are missing and ask\
    \ if you want to install them. Select Continue to install the necessary packages.\n\
    3. At the conclusion of the software installation, SoConfig is executed to update\
    \ the system configuration. When this completes, the configuration of the OES\
    \ component will begin automatically.\n\n# Novell eGuide\n\nNovell eGuide is a\
    \ \"white pages\" application that provides a simple browser-based interface from\
    \ which your employees can search through their LDAP directory (as eDirectory)\
    \ for all the people, places, and things they may need to locate.\n\neGuide may\
    \ look like a standard address book, but it is completely platform- and application-independent.\
    \ It can be accessed by any authorized user via a standard web browser.\n\neGuide\
    \ is also capable of launching secondary applications depending on the search\
    \ of a user runs. For example, when users find the people they are looking for,\
    \ eGuide allows them to launch whatever type of communication fits their current\
    \ needs, instant messaging, and even video conferencing.\n\n# Installing eGuide\n\
