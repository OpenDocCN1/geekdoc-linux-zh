    \ 结合了开源和企业级网络操作系统的优点：NetWare 6.5 和 SUSE Linux Enterprise Server 9 (SLES)，并配备了一套通用的服务、应用程序和管理工具。这不仅为客户提供了价值，还避免了他们被锁定在单一技术基础之上。\n\
    \n# 为什么选择 Open Enterprise Server？\n\nNovell 的 Open Enterprise Server (OES) 是一个安全、高可用的信息平台，在开放环境中提供强大的网络、通信、协作和应用程序服务。随着网络操作系统日益趋商品化，Novell\
    \ 意识到，为客户提供价值的方法不是将他们锁定在单一技术基础之上。为此，OES 结合了开源和企业级网络操作系统的优点：NetWare 6.5 和 SUSE\
    \ Linux Enterprise Server 9 (SLES)，并配备了一套通用的服务、应用程序和管理工具。\n\n随着 OES 的发布，机构可以根据实际业务需求选择\
    \ NetWare、SUSE Linux 或两者的结合。此外，通用的管理、目录和升级工具允许机构使用一套工具管理两个平台，从而简化了日常管理工作。\n\n\
    通过 OES，Novell 展现了其对传统 NetWare 客户的承诺，同时也拥抱了 Linux 和开源运动所代表的力量和新机遇。\n\n# 什么是 Open\
    \ Enterprise Server？\n\nOES 允许您部署任何组合的基于 NetWare 和 Linux 的技术。OES 的核心组件包括：\n\n\
    - NetWare 6.5 Service Pack 3 操作系统以及所有相关的 NetWare 6.5 服务\n- 基于 Linux v2.6 内核的 SLES9\
    \ 操作系统以及所有相关的 SLES9 服务\n- 最新的 Novell Ns Linux 服务\n- 允许两个操作系统无缝共存和管理的通用管理工具\n\n\
    鉴于 NetWare 和 Linux 是非常不同的操作系统，发现两个平台提供的服务之间存在某些差异并不意外。然而，Novell 在跨平台为两个平台提供一套通用服务方面做出了出色的工作，但每个平台提供的某些特定服务之间仍存在差异。表\
