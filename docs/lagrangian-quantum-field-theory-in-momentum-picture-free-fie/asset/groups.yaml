    # Instant Access


    # Managing eDirectory Objects


    To create and manage eDirectory objects, you should use iManager. If available
    through an existing infrastructure or specifically downloaded, ConsoleOne can
    also be used for some tasks.


    # Managing Replicas and Partitions


    To manage replicas and partitions, use iManager.


    To manage the eDirectory schema, use iManager.


    # Using Indexes


    eDirectory manages most popular indexes automatically, with no intervention on
    your part.


    You can view the list of default indexes using the Index Management module (under
    eDirectory Maintenance) of iManager. You can also create custom indexes from this
    module.


    # Merging eDirectory Trees


    Use iManager to merge eDirectory trees by selecting the Merge Tree option under
    eDirectory Maintenance. You can also use the terminal-based nddsmerge utility.


    # Using Additional Services with eDirectory


    LDAP services for eDirectory provide robust eDirectory access to LDAP clients.
    Using ConsoleOne iManager, configure LDAP through the LDAP Server and LDAP Group
    objects in eDirectory.


    # Troubleshooting


    To monitor eDirectory messages, use Trace from iMonitor or the ndtrace utilities
    from a shell console.


    Use iMonitor to repair an eDirectory tree (click the Repair icon in the header
    frame). You can also use the eDirectory option in iManager. Some repair operations
    will also require the use of the terminal-based ndsrepair utility.'
