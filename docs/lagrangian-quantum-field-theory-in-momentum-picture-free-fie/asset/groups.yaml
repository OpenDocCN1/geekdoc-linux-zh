    ## Introduction to Linux Kernel Management


    At the heart of the SLES operating system is the Linux kernel. As mentioned in
    the "SLES Startup Procedures" section of this chapter, the Linux kernel is found
    in the /boot directory and is typically named vmlin-<kernel>. The default kernel
    with OES Linux installation is 2.6.5-7-default. The kernel version can actually
    be divided into the following three numbers:


    - Major Number: This represents the current major version of the Linux kernel.
    The Linux kernel is currently at major number of 2.

    - Minor Number: This represents the minor version of the Linux kernel. Modern
    distributions are based on either minor number 4 or 6. SLES9 uses a kernel with
    minor number of 6. This kernel is commonly referred to as 2.6. The minor number
    can also be used to represent the status of the kernel. If the minor number is
    odd (such as 5), that version of the kernel is a non-stable or developmental release.
    Minor numbers using even (such as 6) are known as production or stable versions.

    - Revision Number: The final number of the Linux kernel is the revision number.
    SUSE adds some information to this field to indicate the build of the kernel as
    well as the specific environment it was intended for. In the OES kernel version
    2.6.5-7-default, the revision number is 7 and the SUSE build and environment designations
    are default.


    NOTE: The uname -r command can be used to display the version of the currently
    running kernel. The most common administrative task relating to the kernel is
    applying kernel updates. Applying kernel updates through YaST Online Update (YOU)
    is a very straightforward process, but if problems are encountered, you may need
    to know more details regarding the layout of kernel-related files. Table 6.5 outlines
    the important kernel-related files found within the /boot directory.


    | FILE | DESCRIPTION |

    |---|---|

    | vmlinuz-2.6.5-7-default | A symbolic link that points to the current version
    of the Linux kernel. The /boot/grub/menulist file configures GRUB to use this
    vmlinuz file rather than the actual vmlin-<kernel> file. |

    | initrd-2.6.5-7-default | Initialization RAM Disk used by the startup routine
    to provide hardware drivers to the initialized kernel. This is used prior to the
    root filesystem being mounted. |


    ## Managing SLES with YaST


    The Another Setup Tool (YaST) is the central management console of SLES installation.
    YaST is available in a graphical version (yast), shown in Figure 6.7, and a command-line
    version (yast). Each of these utilities relies on the same system for managing
    installed components of SLES. Although the look and feel of these modules may
    change between the graphical and console-based utilities, the functionality of
    these modules is identical across each version.


    Figure 6.7. The Another Setup Tool (YaST) utility.


    YaST management modules are divided into seven categories: Software, Hardware,
    System, Network Devices, Network Services, Security and Users, and Miscellaneous.
    Modules found within each category can be selected from within the YaST utility
    itself or initiated directly from the command line. To specifically execute a
    particular module starting with YaST, the following command line should be:


    ```

    yast <module_name>

    ```


    TIP: To retrieve a list of all available YaST modules, use yast.


    Modules used for initial configuration of many of Novel OES components are also
    found in YaST. These components are all represented in the graphical environment
    with an icon containing a red "N" for Novel. Although many of these modules are
    found in the Network Services category, the actual category where each module
    is found depends on the module in question.


    ## Updating OES Linux


    YaST provides several modules for installing and updating software on a normal
    SLES server. However, after installing OES, the Another software management system
    should be used. This is true when installing updates to both OES components and
    the core operating system.


    NOTE: To prevent SLES updates, which may not be aware of OES components, the normal
    YaST Online Update (YOU) utility is disabled during the OES installation. It is
    still possible to manually execute the terminal-based YOU. This can potentially
    cause severe corruption and should be avoided.


    The Another software management system is made up of the following two basic components:


    - Another daemon (rcd): This daemon receives commands from the Another client
    and follows those instructions to perform tasks such as updating installed components.
    If necessary, the startup script /etc/init.d/rcd can be used to stop or restart
    the rcd daemon.

    - Another client: The portion of Another is the interface for administrators to
    subscribe to software updates, and to determine which updates will be applied
    to the local server.


    Two Another clients ship with OES:

    - Terminal-based client, which is installed by default with OES.

    - Graphical client, which is an optional component during an OES installation.


    WARNING: In the shipping version of OES, the graphical Another utility was not
    working as expected. Novell recommends that you use the command-line utility to
    update OES until the fix for Another is made available. When the patch is available,
    the command-line utility to update OES is:


    ```

    yast-update

    ```


    To display the list of currently running services, use:


    ```

    yast-service-list

    ```


    To add a service, if it is not already listed, use the following command:


    ```

    yast-service-add <address>

    ```


    To remove a service, use the following command line be:


    ```

    yast-service-remove <service_name>

    ```

    ```


    ## Monitoring SLES with Health Monitoring Services


    An important aspect of managing SLES is simply being aware of how your server
    is performing. OES Linux reduces the complexity of this through Web-Based Enterprise
    Management (WBEM). WBEM is a standard, Internet-based technology designed to configure
    various tasks. Through WBEM, Health Monitoring Services (HMS) can be used to easily
    monitor important server factors including CPU utilization, memory processes,
    and network utilization.


    OES Linux uses the Common Information Model (CIM) daemon, from the OpenWBEM project,
    to manage environment. The CIM daemon performs this function by one or more Providers
    that conform to WBEM standards. These Providers facilitate the gathering of SLES
    and OES statistics. One of the greats about HMS is its potential for future capabilities.
    This is the first release of HMS and is geared at monitoring essential health-related
    information.


    ## Installing HMS


    Health Monitoring Services can be installed as an optional component during the
    OES Linux installation. HMS can also be installed later through YaST.


    To install Health Monitoring Services using YaST, complete the following steps:


    - Select the Network category in YaST. From this category, locate and select the
    Novel Health Monitoring module. This module will detect the RPMs for HMS and ask
    if you want to install them. Select Continue to install the necessary packages.

    - At the conclusion of the software installation, SuConfig is executed to update
    the system configuration. When this completes, the configuration of the OES component
    will begin automatically.

    - At the Novel Health Monitoring LDAP Server Configuration screen, enter the following
    information and click Next to complete the installation:


    - Local or Remote Directory Server: Select the radio button that indicates whether
    eDirectory is running on the local server or a remote server.

    - Directory Server Address: If a remote eDirectory server is in use, enter the
    IP address for this server.

    - Admin Name: Enter the eDirectory administrator''s credentials using fully qualified
    dot notation, for example, cn=admin.o.novel

    - Admin Password: Enter the password for the administrator user.

    ```

