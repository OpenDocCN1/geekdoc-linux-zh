    网络中，eDirectory 架构会扩展以提供对新对象类和属性的支持。为了让 ConsoleOne 识别这些新对象，需要相应的特定产品插件（snap-in）。


    OES Linux 提供了许多没有对应 ConsoleOne 插件件的新组件。然而，由于由于，对于 eDirectory 管理，可以从 http://support.novell.com
    下载 ConsoleOne v1.3.6。提供 Linux、Windows、NetWare 和 Solaris 的下载版本。运行在这些任一平台上的 ConsoleOne
    都可以连接并管理 OES Linux 上的 eDirectory 对象。


    请记住，ConsoleOne 无法管理 OES Linux 的每一个组件。使用 eDirectory 的现有基础设施可以继续使用 ConsoleOne 进行
    eDirectory 管理，但全面的 OES Linux 管理只能通过 iManager 实现。有关 ConsoleOne 的更多信息可以通过在线 OES
    文档获取。


    ## iManager


    OES Linux 包含 iManager 2.5，这是一个基于 Web 的工具，用于管理、配置和配置 OES 组件、服务和 eDirectory。iManager
    允许基于角色的服务 (RBS) 让您能够关注由用户角色确定的特定任务和对象的顺序。用户访问 iManager 时看到的内容取决于他们的角色。


    （注：OCR 文本在 iManager 部分包含大量重复，我在下方为了可读性合并了唯一内容。）

