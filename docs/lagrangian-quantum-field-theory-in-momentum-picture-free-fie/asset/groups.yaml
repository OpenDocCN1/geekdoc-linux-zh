    ## Always-Available Network Services


    When you are ready to start loading applications and services in a clustered environment,
    there are some extra steps you have to take beyond the standard implementation
    and configuration provided by the application or service. As with a cluster volume,
    you will most likely need to cluster-enable the application or service. You might
    also have to make some changes to the Cluster object and the cluster nodes so
    that they can properly support the new application or service.


    ## Cluster Resource Applications


    When creating a resource for NCS cluster, you need to be familiar with the following
    types of applications:


    - Cluster-aware: Cluster-aware applications are specifically designed to take
    advantage of a clustered environment. These applications and services recognize
    when they are running on a cluster. They will automatically tweak their internal
    settings to be more tolerant of communication lapses that occur in a clustered
    system.

    - Cluster-naive: Although you can cluster-enable any application, if it is not
    designed to recognize that it is running on a cluster, the application is referred
    to as cluster-naive. For a cluster-naive application or service, NCS does all
    the work to ensure that the resource is reloaded on another node if the assigned
    cluster node fails.

    - Apache Web Server and Tomcat Servlet Engine

    - GroupWise (MTA, POA, GWIA, WebAccess)

    - iFolder

    - iManager

    - iPrint

    - Novell clients (Windows 98 and Windows XP/2000)

    - NetStorage


    Many OES Linux services, and some third-party applications as well, are designed
    to take advantage of Novell Clustering Services when it is detected. For example:


    ## Cluster-Enabling an Application


    You cluster-enable a service or application by creating a Cluster Resource object
    for it in eDirectory.


    ## Understanding Resource States


    When running or testing an NCS cluster, you can view valuable information about
    the current state of your cluster, and its various resources, from the Cluster
    Management view in iManager (see Figure 9.5).


    Figure 9.5. View of cluster status in iManager.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_180_0.png)


    In order for the Cluster Manager to report your cluster configuration, you must
    locate and select your cluster object from eDirectory using the Cluster link.
    After you select the object, the Cluster Manager page will refresh and display
    information on the current cluster.


    Some of the specific cluster information you can gather from the Cluster Manager
    view includes the following:


    - An icon represents each node in your cluster. The yellow disk indicates the
    node that is functioning as the master server in the cluster. The master server
    can change over time due to failover or migration events that take place.

    - Epoch indicates the number of times the cluster state has changed. The epoch
    number will increment time a node joins or leaves the cluster.

    - The Run Report link provides a detailed report of your cluster. This report
    includes the cluster settings, quorum member information, and load and unload
    scripts.

    - In the Cluster State View, each node of the cluster is listed along with its
    node type and associated resource state.


    Table 9.1 describes different resource states you might see in the Cluster State
    View window of the Cluster Manager page in iManager and provides some possible
    actions for each state.


