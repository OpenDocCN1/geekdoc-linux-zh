    ## Instant Access


    ## Managing eDirectory Objects


    To create and manage eDirectory objects, you should use iManager. If available
    through an existing infrastructure or specifically downloaded, ConsoleOne can
    also be used for some tasks.


    ## Managing Replicas and Partitions


    To manage replicas and partitions, use iManager.


    To manage the eDirectory schema, use iManager.


    ## Using Indexes


    eDirectory manages most popular indexes automatically, with no intervention on
    your part.


    You can view the list of default indexes using the Index Management module (under
    eDirectory Maintenance) of iManager. You can also create custom indexes from this
    module.


    ## Merging eDirectory Trees


    Use iManager to merge eDirectory trees by selecting the Merge Tree option under
    eDirectory Maintenance. You can also use the terminal-based nddsmerge utility.


    ## Using Additional Services with eDirectory


    LDAP services for eDirectory provide robust eDirectory access to LDAP clients.
    Using ConsoleOne iManager, configure LDAP through the LDAP Server and LDAP Group
    objects in eDirectory.


    ## Troubleshooting


    To monitor eDirectory messages, use Trace from iMonitor or the ndtrace utilities
    from a shell console.


    Use iMonitor to repair an eDirectory tree (click the Repair icon in the header
    frame). You can also use the eDirectory option in iManager. Some repair operations
    will also require the use of the terminal-based ndsrepair utility.


    ## What Is eDirectory?


    In order to understand Novell eDirectory, you must first invert the standard view
    of network architecture. Many people assume that the directory requires a Network
    Operating System (NOS) on which to run that it is part of the NOS. In reality,
    it is just the opposite. eDirectory defines the "world" of your network. As such,
    network servers are part of the, not vice versa. This is a critical shift in thinking
    if you are going to work effectively with directories in today''s complex computing
    environments.


    In the simplest of terms, e-Directory is a distributed and replicated database
    of network information that provides your network with four key services:


    - Discovery: eDirectory makes it possible to browse, search, and retrieve information
    about the network. You can search for objects such as users, printers, and applications,
    or for specific properties of objects such as names, phone numbers, and configurations.


    - Security: eDirectory provides a central point for authentication and access
    control over your entire network. You can grant specific rights to users or groups
    of users, control the flow of data across the network, and protect sensitive personal
    information through the use of cryptographic technologies. Most importantly, eDirectory
    provides the foundation for managing security across networks, you can safely
    and efficiently communicate with partners, suppliers, and customers without having
    to create a separate infrastructure to do.


    - Storage: eDirectory is at its heart database. As such, it includes the capabilities
    to safely and securely store network data and protect it from corruption. It also
    provides a way to classify different types of data, so you can manage the type
    of data in eDirectory and finally, eDirectory allows you to split the database
    into discrete pieces and distribute those pieces across multiple servers to provide
    fault tolerance and improved performance.


    - Relationship: eDirectory allows you to model relationships between objects on
    the network. This allows you to move configuration information away from devices
    and make it global. Practically, this means that users can access their profiles,
    privileges, and services regardless of location, connection device, or access
    point.


    Novell released its first version of eDirectory, then as NetWare Directory Services
    (NDS), in 1993 with NetWare 4. It has been in constant improvement since that
    time, making it the most advanced and widely used directory in the world. The
    name changed to Novell eDirectory with the release of NetWare 5 in 1998. In 2000,
    Novell''s directory was renamed eDirectory, and was modularized so that it can
    be installed on platforms other than NetWare including Linux, Windows 2000/XP,
    and various flavors of Unix. The following sections provide you with an overview
    of eDirectory architecture, design considerations, and common administrative tasks
    and the tools for doing them


    ## eDirectory Architecture


    The eDirectory architecture has three main aspects:


    - Physical database

    - Rules governing data

    - Organization of data


    Each of these is addressed individually in the sections that follow.


    ## Physical Database


    At its lowest level, eDirectory is a database. A typical database consists of
    a dataset together with methods of searching and retrieving specific data from
    the dataset. eDirectory is object-oriented, hierarchical database. A hierarchical
    database maintains data (objects) in a logical tree structure. Specific objects
    are located by traversing (walking) the tree. Each object in the eDirectory database
    is uniquely identifiable by a combination of the object name, or Common Name (CN),
    together with information describing the location of that object within the tree,
    or Context. The combination of Common Name and Context is known as the Distinguished
    Name.

