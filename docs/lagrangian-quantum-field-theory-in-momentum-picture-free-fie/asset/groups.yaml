    # Instant Access


    Using NetStorage


    - NetStorage provides a WebDAV server interface for all OES Linux files and directories.

    - Use any WebDAV-compliant application, such as web browsers, Windows Explorer
    (My Network Places), or Office 2000 to access OES NetWare files and folders.

    - NetStorage provides clientless access to iFolder files.

    - NetStorage provides the WebDAV support for the NetDrive client.


    # Working with NetDrive


    - NetDrive client is available online by searching for NetDrive http://support.novell.com/filefinder.

    - NetDrive supports access to OES Linux files and folders using standard protocols:
    FTP, WebDAV, or iFolder.


    # Synchronizing Files with Novell iFolder


    - Synchronize files between remote clients and a centralized iFolder server, so
    that user data is available anytime, from anywhere.

    - Configure and manage iFolder server through the iFolder management console,
    available at https://iFolder server DNS or IP address after iFolder installed.

    - Use iFolder client to provide synchronization between the iFolder server and
    regularly used machines.

    - If you are using a machine for one-time access, use NetStorage to access the
    iFolder server without having to synchronize all files.

    - Use NetDrive to access the iFolder server without synchronizing the entire directory.
    Useful when the desktop application is not WebDAV-aware.

    - iFolder access requires that the iFolder server be installed and configured
    prior to use.


    # Introduction to Novell File Access


    One of the major tenets of Novell''s oneNet philosophy is that users should have
    access to their files and data at any time, from anywhere. To help you reach this
    goal, OES Linux includes a host of methods for accessing network data.


    In keeping with Novell''s open-standards approach to network services, these access
    methods are designed to use Internet standards, web browsers, and thin clients,
    minimizing the need to add large amounts of workstation software in order to access
    network resources. Those access methods that do require a client of some sort
    make installation and configuration as easy as possible, so users can get on with
    their business.


    This chapter takes a look at the new and nontraditional forms of file access available
    in OES Linux. These include


    - NetStorage

    - Novell NetDrive

    - Novell iFolder

    - FTP server


    # NetStorage


    NetStorage provides a transparent WebDAV interface to OES files. Effectively,
    NetStorage allows you to access files on an OES Linux server with a Novell client.
    NetStorage is integrated with iFolder, NetDrive, and Virtual Office to make accessing
    network files as easy and seamless as possible using the traditional Novell Client.


    NetStorage leverages a mid-tier architecture, also called XTier, to provide its
    services. This same architecture is used to support some of Novell''s line of
    management solutions.


    # Installing NetStorage


    NetStorage can be installed during the installation of the OES Linux server, or
    after the fact through YaST. Typically, you will need to install NetStorage on
    only one OES Linux server in eDirectory, although very heavy usage might require
    more than one per site.


    To install NetStorage from YaST complete the following steps:


    1. Access YaST from a terminal using yast, or from a graphical environment using
    yast2 or the YaST launcher from the application menu.

    2. Select the Services category in YaST. From this category, locate and select
    the NetStorage module. This module will detect that the RPMs for NetStorage are
    missing and ask if you want to install them. Select Continue to install the necessary
    packages.

    3. At the conclusion of the software installation, SuSEConfig is executed to update
    the system configuration. When this completes, the OES component will begin automatically.

    4. At the NetStorage LDAP Server Configuration screen, enter the following information
    and click Next:


    - Local or Remote Server Select the radio button that indicates whether eDirectory
    is running on the local server or a remote server.

    - Directory Server Address If a remote eDirectory is in use, enter the IP address
    for this server.

    - Admin Name with Context enter the eDirectory administrator''s credentials using
    fully qualified dot notation, for example, cn=admin,o=novell.

    - Admin Password If necessary, select this button to change the configured ports
    for the eDirectory server.

    - Port Details Enter the port for the eDirectory server specified earlier. The
    default LDAP port for unencrypted communications is 389 and port 636 is used for
    SSL-encrypted communications.

    5. At the NetStorage Configuration screen, enter the required information (see
    Figure 12.1), and click Next. You can change these settings after the installation
    through iManager by navigating the NetStorage link and selecting Authentication
    Domains.


    - (Optional) Enter the iFolder 2 server address Specify DNS name or IP address
    of your iFolder 2 server if you want to be able to access iFolder data through
    NetStorage. More information on iFolder is available later in this chapter.


    - Authentication Domain Host the DNS name or IP address of a server in your eDirectory
    that hosts a master or read/write replica of eDirectory. This does not have to
    be the server where NetStorage is being installed. NetStorage will use this to
    authenticate users when they attempt to log to NetStorage.

