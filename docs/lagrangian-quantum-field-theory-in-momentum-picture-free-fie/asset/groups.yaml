    # Novell eGuide


    Novell eGuide is a "white pages" application that provides a simple browser-based
    interface from which your employees can search through their LDAP directory (as
    eDirectory) for all the people, places, and things they may need to locate.


    eGuide may look like a standard address book, but it is completely platform- and
    application-independent. It can be accessed by any authorized user via a standard
    web browser.


    eGuide is also capable of launching secondary applications depending on the search
    of a user runs. For example, when users find the people they are looking for,
    eGuide allows them to launch whatever type of communication fits their current
    needs, instant messaging, and even video conferencing.


    # Installing eGuide


    Novell eGuide can be installed as an optional component for the OES Linux distribution,
    or it can be installed after the fact through YaST.


    To install eGuide using YaST, complete the following steps:


    +   1. Access YaST from a terminal yast, or from a graphical environment yast2
    or the YaST launcher from the application menu.


    +   2. Select the Network Services category in YaST. From within this category,
    locate and select the eGuide module. This module will detect if the RPMs for eGuide
    are missing and ask if you want to install them. Continue to install the necessary
    packages.


    +   3. At the conclusion of the software installation, SUSEConfig is executed
    to update the system configuration. When this completes, the configuration of
    the OES component will be built automatically.


    +   4. At the eGuide LDAP Server Configuration screen, enter the following information
    and click Next:


    +   - Local or Remote Directory Server Select the radio button that indicates
    whether eDirectory is running on the local server or a remote server.


    +   - Directory Server Address If a remote eDirectory server is in use, enter
    the IP address for this server.


    +   - Admin Name with Context Enter the eDirectory administrator''s credentials
    using fully qualified dot name, for example, cn=admin=novell.


    +   - Admin Password Enter the password for the administrator user.


    +   - Port Details If Necessary, select this button to change the configured ports
    for theDirectory server specified above. The default LDAP port for unencrypted
    communications is 389 and port 636 is used for SSL- encrypted communications.


    +   5. For eGuide to be active, select to restart Apache and Tomcat when prompted.


    When the installation is complete, you are ready to configure eGuide for your
    particular environment.


    # Configuring eGuide'
