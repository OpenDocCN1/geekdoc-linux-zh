  mdcn: "\n # 获取帮助\n\nSUSE Linux 提供了数千种可能的命令，用于在服务器上执行各种任务。要亲自熟悉每一个实用工具及其所有功能可能是一项极具挑战的任务！坦率地说，通过使用实用工具手册和应用程序文档，帮助并不遥远。\n\
    \n## 基于控制台的帮助\n\n在命令行界面工作是与 SLES 交互最常用的方法。从该环境中快捷地访问应用程序和实用工具的使用信息，对于在命令行中高效工作至关重要。坦率地说，系统就是围绕这一需求而设计的。该系统由三种不同类型的文档组成：手册或\
    \ man 页面（man pages）；info 页面；以及系统和第三方文档。\n\n## man 页面\n\nLinux  man 页面是实用工具和应用程序的语法级文档，以易于检索且对命令行友好的格式存储。man\
    \ 页面物理存储在 /usr/share/man 目录下，并如[表 3.17]所示分为九部分。\n\n表 3.17，man 页面章节\n\n| man |\
    \ 章节目的 |\n| --- | --- |\n| 1 | 所有用户均可访问的可执行程序和命令 |\n| 2 | 系统调用 |\n| 3 | 函数和库例\
    \ |\n| 4 | 特殊设备文件 (/dev/*) |\n| 5 | 配置文件格式和约定 |\n| 6 | 游戏 |\n| 7 | 宏命令和包 |\n|\
    \ 8 | root 用户使用的系统管理程序和命令 |\n| 9 | 内核例程 |\n\n所有利用 man 系统的程序都应该将其 man 页面存储在正确的章节中。要查看特定命令的\
    \ man 页面，必须使用以下基本语法：\n\n```\nman [section] command\n```\n\n## 注意\n\n## 编辑文本文件\n\
    \n在关于 SLES 操作的章节中，如果不讨论编辑文本文件这一另一个重要话题，内容将是不完整的。虽然编辑文本文件看起来可能不是一个困难的主题，但在 Linux\
    \ 下编辑文本文件时使用的工具往往相当晦涩。在本章中留出一些空间来消除该领域的困惑，将使初级管理员在处理任何编辑任务时感到更加从容不费力。\n\n## Vi\
    \ 实用工具\n\n在 SLES 下可以使用图形化编辑工具。在 KDE 和 GNOME 图形环境中都可以轻松获得此类工具。然而，依赖图形化编辑器（如 Kate\
    \ 或 Gedit）会对图形环境产生依赖。这种图形环境通常没有在 SLES 机器上运行。此外，当使用远程 shell 进行 SLES 管理时，图形化工具需要通过\
    \ SSH 隧道传输。与其建立隧道或在服务器上使用图形会话，长期来看学习并使用命令行编辑器是更好的解决方案。\n\n就像在图形环境中一样，所有的命令行文本编辑器都是可用的。命令行编辑器的选择中包括\
    \ pico、emacs 和 vi。Pico 和 emacs 是强大的文本编辑实用工具，提供了许多吸引人的特性。然而，这些实用工具在 SLES 安装中并不总是可用的。vi\
    \ 实用工具是唯一保证在任何 Linux 安装中都可用的工具。\n\n注意\n\nSLES 上的 vi 实际上是 Vi Improved（改进版），即 vim\
    \ 实用工具。由于 vim 设计为与 vi 兼容，因此它仍被称为 vi。\n\nvi 是一个极其强大的文本编辑实用工具。遗憾的是，vi 几乎无限的能力导致其用法对新用户来说变得相当晦涩且具有挑战性。要理解的最重要概念是\
    \ vi 以双模式方式运行的。双模式意味着使用 vi 时，你可以处于两种可能的模式之一——命令模式或插入模式。\n\n命令模式环境用于执行文件操作、复制和粘贴文本、执行全局搜索和替换操作以及处理宏等任务。vi\
    \ 的插入模式用于普通的文本编辑操作。可能比这两个模式更重要的是判断 vi 当前处于哪种模式的能力！\n\n当启动时，界面会停留在命令模式。重要的一点是理解，在命令模式下无法进行直接的文件编辑。可以复制和粘贴文本，并完成诸如删除文本等各种操作，但无法通过输入向文件添加额外的文本。要向文档中添加文本，你必须先切换到插入模式。\n\
    \n通过按下 \"i\" 或少数几个插入文本键之一进入插入模式。在插入模式下，窗口底部将显示“ INSERT \\”。在向文件添加文本之前，请务必通过查看窗口底部确保你处于正确的模式。当你处于插入模式时，可以按\
    \ ESC 键切换回命令模式。\n\n表 3.20，进入插入模式的命令\n\n| 按键组合 | 描述 |\n| i | 切换到插入模式，并将活动光标置于当前字符之前。\
    \ |\n\n## 第 4 章. OES Linux 客户端\n\n- 瞬时访问\n- 传统的 Novell 客户端\n- 安装客户端软件\n- 移除客户端软件\n\
    - 从 Web 服务器安装\n- 升级 Novell 客户端\n- 客户端登录\n- 配置客户端\n- NetIdentity\n- 其他 Novell 客户端\n\
    - 通过原生 Linux 方法访问 OES\n\n## 瞬时访问\n\n## Novell 客户端与 OES Linux\n\nNovell 客户端为客户端工作站提供\
    \ NetWare 协议 (NCP) 服务。Novell 客户端与 OES Linux 的 NCP 服务器组件结合使用，允许工作站登录 eDirectory，将本地驱动器映射到\
    \ OES Linux 卷，并无缝地进行身份验证以访问 OES 服务。\n\nNovell 客户端提供了在混合 NetWare 和 OES Linux 环境中访问文件的单一方法。\n\
    \nNovell 客户端是一个可选组件，管理 OES Linux 并不需要它。\n\n## 安装/升级 Novell 客户端\n\n目前有两个 Novell\
    \ 客户端：一个用于 Windows 9x，另一个用于 Windows XP/2000。Novell 客户端文件可以从 http://download.novell.com\
    \ 下载并直接安装，或复制到任何网络位置，供具有网络访问的客户端安装。Linux 的 Novell 客户端预计在 OES 发布后不久即可可用。\n\n使用\
    \ Novell 客户端升级程序定期检查更新的客户端文件。当发现更新的文件时，升级程序将自动启动升级程序。\n\n如果你为 OES 升级现有 Microsoft\
    \ 客户端，可以使用自动客户端升级 (ACU) 功能来简化此过程。将 ACU 命令放置在配置文件或登录脚本中，以检测是否需要安装客户端软件，必要时用户登录时\
    \ ACU 会更新工作站。\n\n要从 Web 服务器安装 Novell 客户端，将客户端文件复制到 Web 服务器并使用 WebIP 工具创建一个可执行文件，它将从\
    \ Web 服务器下载 Novell 客户端安装文件并启动安装程序。\n\n## 配置 Novell 客户端\n\n安装 Novell 客户端后，可以使用\
    \ Novell 客户端属性页进行配置。点击系统中的红色“N”图标并选择 Novell 客户端属性。\n\n要配置 Novell 用户登录，请创建一个登录脚本。登录脚本可以与容器、配置文件和用户关联。登录脚本可以控制用户登录你的\
    \ Novell 网络时发生的情况。有关登录脚本的信息和语法，请参见附录 B，“基本命令”。\n\n## NICI 客户端\n\n## 传统的 Novell\
