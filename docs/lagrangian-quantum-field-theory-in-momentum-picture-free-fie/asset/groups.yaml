    ## Apache Web Server


    Apache Web Server 是 OES Linux 的主要 HTTP 栈。Apache 是一个开源 Web 服务器，被全球超过三分之二的互联网 Web
    服务器使用。因此，它运行在所有主要平台上，并可以扩展到数千个并发连接。


    Apache Web Server 是一个复杂且功能齐全的产品，其内容远比此处涵盖的要。然而，由于 Apache 是一个开源应用程序，你想了解的关于它的任何信息都可以在网上找到。如果你打算实现更复杂的
    Web 环境，应该花些时间查阅 Apache 文档，以熟悉其架构和功能。Web 服务器文档可以在线通过地址 http://http.apache.org/docs-2.0
    获取。


    在 OES Linux 上，Apache Web Server 可以以几种不同的形式存在。首先，它会作为专用的 Web 服务器自动安装，用于支持 OES Linux
    及其相关产品和服务的管理工具。你可以在 /etc/opt/novell/conf 目录下找到此 Apache 实例中的所有文件。该管理服务器支持 iManager、Virtual
    Office、iPrint 以及其他需要 Web 界面的 OES 服务。


    如果你使用 iFolder，则需要一个配置好的 Apache 实例。通常，这是通过在其专用服务器上（不包含其他 OES 组件）安装 iFolder 实现的。但也可以在同一服务器上安装其他
    OES 组件。为了确保 iFolder 在两种配置下均可用，使用了独立的、专用的 Apache 实例。iFolder Apache 实例使用的配置文件可以在
    /etc/opt/novell/ifolder/conf 目录下找到。


    ### 注意


    iFolder 版本的 Apache 经过高度定制，专门用于 iFolder 进程。不应手动修改此 Apache 实例的配置文件。有关 iFolder 的更多信息，请参阅第
    15 章“OES Web 服务”。


    Apache 与 OES 结合使用的另一种常用方式是托管你自己的 Web 内容。在这种情况下，你不应该加载另一个 Apache 实例，而应该自定义 Apache
    管理实例以识别虚拟服务器或文档根目录。这将在本章的稍后部分介绍。


    当你使用从任何 Web 浏览器访问的 iManager 时，是 Apache Web Server 的管理配置在为 Web 浏览器和 OES Linux 提供数据服务。


    ## 安装 Apache Web Server


    如果你兴趣将 Apache 作为你的 OES Linux 工具和服务的基础，那么你不需要做任何操作即可让 Apache 运行起来。在大多数 OES 实例中，Apache
    的管理服务器配置会自动安装。


    然而，如果你选择对 OES 进行自定义安装，或者正在向现有的 SLES9 服务器添加 OES 组件，你必须通过 YaST 手动安装 Apache 服务器，并完成以下步骤：


    - 1. 从终端访问 YaST，或者在图形环境中使用 yaast2 或应用程序菜单中的 YaST 启动器。

    - 2. 在 YaST 中选择“软件”（Software）类别（这通常是默认选择的类别）。在软件”类别内部，点击“安装并刷新软件”模块。

    - 3. 使用“过滤器”下拉框选择“选择”（Selections）类别。


    ## Tomcat Servlet 引擎


    Tomcat 是一个开源应用程序。它也被其开源项目名 Jakarta 通称为。有关 Jakarta 项目的更多信息，请访问 http://jakarta.apache.org/。它的特定功能是
    servlet 容器，这是一个根据用户输入生成动态 Web 页面的服务器端程序。Tomcat 提供了一个可以在其中执行和管理 servlet 的运行时环境。Apache
    Web Server 依赖 Tomcat 来处理 servlet 和 Java Server Pages (JSP)。


    作为 Apache，OES Linux 服务器上可以加载两个 Tomcat 实例。第一个是与 Apache 管理服务器配合使用的实例，用于支持 OES Linux
    提供的各种管理工具和其他服务。Tomcat 管理实例在安装 OES Linux 时会自动加载。


    第二个实例是公共副本，用于支持从 OES Linux 服务器提供的 Web 应用程序。你将使用此实例来支持从 OES Linux 服务的 Web 应用。


    ### 注意


    Tomcat 提供了为 OES 提供的基础 servlet 和 JSP 支持。对于更强大的 Web 应用开发环境，Novell 提供了 Novellext。有关
    Novellext 的更多信息，请参阅 OES Linux 在线文档，以及 http://www.novell.com/solutions/extend/


    ## 安装并配置 Tomcat


    由于 Tomcat 如果没有 Web 服务器将无法运行，因此它通常与 Apache 配合安装。


    默认情况下，OES Linux 将 Tomcat 配置文件安装到 /etc/opt/novell/tomcat4 目录。如果安装了第二个公共版本的 Tomcat，这些配置文件将位于
    /etc/tomcat 目录。


    OES 特有的管理版本的 Tomcat 不需要额外的配置即可运行。然而，了解 Tomcat 的重要配置文件是一个好习惯。以下列表包含了：


    - server.xml：Tomcat 的配置文件。该文件位于 /etc/opt/novell/tomcat4 目录。

    - jk_module.conf：Jakarta-Apache 插件的主配置文件。该文件位于 /etc/opt/novell/httpd/conf 目录。

    - workers.properties：包含连接 servlet 到 Tomcat 工作的配置信息。该文件位于 /etc/opt/novell/httpd/conf
    目录。


    公共版本的 Tomcat 使用相同的配置文件；但它们通常位于 /etc/tomcat。有关在 OES 之外配置 Tomcat 的更多信息，请参考 Tomcat
    文档。


    ## 管理 Tomcat


    Tomcat 不需要管理，因为配置在 OES 安装时已完成，且 Tomcat 服务在服务器启动时会自动启动。你可能会


