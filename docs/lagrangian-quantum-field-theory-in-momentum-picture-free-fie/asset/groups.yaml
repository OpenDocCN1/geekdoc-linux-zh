    ## ConsoleOne


    ConsoleOne is a Java-based tool used for managing your eDirectory-based network
    and resources. ConsoleOne is an important tool for the last several versions of
    NetWare, and has also been provided for standalone versions of eDirectory on Linux.


    Naively, ConsoleOne provides support for basic management of eDirectory and core
    eDirectory objects (such as users, groups, and servers). As additional products
    are added to an eDirectory network, the eDirectory schema is extended to provide
    support for new object classes and attributes. In order for ConsoleOne to recognize
    these new objects, a corresponding product-specific snap-in is required.


    OES Linux provides a number of new components that do not have a corresponding
    ConsoleOne snap-in. However, because of this, for eDirectory administration, ConsoleOne
    v1.3.6 can be downloaded from http://support.novell.com. Downloadable versions
    are available for Linux, Windows, NetWare, and Solaris. ConsoleOne running on
    any of these platforms may connect to and manage eDirectory objects on OES Linux.


    It is important to remember that ConsoleOne cannot be used to manage every component
    of OES Linux. Existing infrastructures employing eDirectory can continue to use
    ConsoleOne for eDirectory administration, but comprehensive OES Linux management
    is only available through iManager. Additional information regarding ConsoleOne
    is available through the online OES documentation.


