    # Novell® Open Enterprise Server

    Administrator’s Handbook SUSE® LINUX® Edition


    By Mike Latimer, Jeffrey Harris


    Publisher: Sams Publishing

    Pub Date: May 13, 2005

    Print ISBN: 0-6723-2749-X

    Pages: 600


    | Table of Contents | Index |

