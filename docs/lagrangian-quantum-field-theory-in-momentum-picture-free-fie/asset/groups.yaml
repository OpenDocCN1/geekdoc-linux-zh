    ## Linux 内核管理简介


    SLES 操作系统的核心是 Linux 内核。正如本章“SLES 启动过程”部分提到的，Linux 内核位于 /boot 目录，通常命名为 vmlin-<kernel>。OES
    Linux 安装的默认内核为 2.6.5-7-default。内核版本实际上可以分为以下三个数字：


    - **主版本号（Major Number）**：这代表 Linux 内核的当前主版本。目前 Linux 内核的主版本号为 2。

    - **次版本号（Minor Number）**：这代表 Linux 内核的次版本号。现代发行版基于次版本号 4 或 6。SLES9 使用次版本号为 6 的内核。内核通常被称为
    2.6。次版本号也可以表示内核的状态。如果次版本号是奇数（例如 5），则该版本的内核是非稳定或开发版本。使用偶数（例如 6）的次版本号被称为生产版本或稳定版本。

    - **修订号（Revision Number）**：Linux 内核的最后一个数字是修订号。SUSE 在此字段中添加了一些信息，以指示内核的构建版本以及其旨在针对特定环境。在
    OES 内核版本 2.6.5-7-default 中，修订号为 7，SUSE 的构建和环境标识为 default。


    注意：可以使用 `uname -r` 命令显示当前运行内核的版本。与内核相关的常见的管理任务是应用内核更新。通过 YaST 在线更新 (YOU) 应用内核更新是一个非常直接的过程，但如果遇到问题，你可能需要更多有关内核相关文件布局的细节。表
    6.5 概述了 /boot 目录中重要的内核相关文件。


    | 文件 | 描述 |

    |---|---|

    | vmlinuz-2.6.5-7-default | 指向 Linux 内核当前版本的符号链接。/boot/grub/menulist 文件配置 GRUB
    使用此 vmlinuz 文件而不是实际的 vmlin-<kernel> 文件。 |

    | initrd-2.6.5-7-default | 启动程序使用的初始化 RAM 磁盘，用于向已初始化的内核提供硬件驱动程序。这在挂载根文件系统之前使用。
    |


    ## 使用 YaST 管理 SLES


    Another Setup Tool (YaST) 是 SLES 安装的中央管理控制台。YaST 提供图形版本（yast，如图 6.7 所示）和命令行版本（yast）。这些工具都依赖于同一个系统来管理
    SLES 的安装组件。尽管这些模块在图形和基于控制台的工具之间的外观可能会 way，但这些模块的功能在每个版本中都是相同的。


    图 6.7. Another Setup Tool (YaST) 工具。


    YaST 管理模块分为七类：软件、硬件、系统、网络设备、网络服务、安全与用户以及杂项。每个类别中的模块可以在 YaST 工具内部进行选择，也可以直接从命令行启动。要专门执行从
    YaST 开始的特定模块，应使用以下命令行：


    ```

    yast <module_name>

    ```


    提示：要获取所有可用 YaST 模块的列表，请使用 `yast`。


    用于许多 Novel OES 组件初始配置的模块也可以在 YaST 中找到。这些组件在图形环境中都由一个带有红色“N”（代表 Novel）的图标表示。尽管许多此类模块位于“网络服务”类别中，但每个模块所在的实际类别取决于该模块本身。


    ## 更新 OES Linux


    YaST 提供了多个模块用于在普通的 SLES 服务器上安装和更新软件。然而，在安装 OES 后，应使用 Another 软件管理系统。在更新 OES 组件和核心操作系统时也是如此。


    注意：为了防止可能感知 OES 组件的 SLES 更新，在 OES 安装期间禁用了普通的 YaST 在线更新 (YOU) 工具。仍然可以手动执行基于终端的
    YOU。这可能会导致严重的损坏，应避免。


    Another 软件管理系统由以下两个基本组件组成：


    - Another 守护进程 (rcd)：此守护进程接收来自 Another 客户端的命令并按照这些指令执行更新已安装组件等任务。如有必要，可以使用启动脚本
    /etc/init.d/rcd 来停止或重启 rcd守护进程。

    - Another 客户端：Another 的这部分是管理员订阅软件更新并确定哪些更新将应用于本地服务器的接口。


    OES 带有两个 Another 客户端：

    - 基于终端的客户端，随 OES 默认安装。

    - 图形客户端，是 OES 安装期间的可选组件。


    警告：在 OES 的发行版本中，图形 Another 工具运行不符合预期。Novell 建议您使用命令行工具更新 OES，直到 Another 的修复发布。当补丁可用时，更新
    OES 的命令行工具是：


    ```


    yast-update

    ```


    要显示当前运行服务的列表，请使用：


    ```

    yast-service-list

    ```


    如果服务未在列表中，使用以下命令添加服务：


    ```

    yast-service-add <address>

    ```


    要删除服务，请使用以下命令行：


    ```

    yast-service-remove <service_name>

    ```


    ## 使用健康监控服务监控 SLES


    管理 SLES 的一个重要方面是简单地了解服务器的运行状况。OES Linux 通过基于网络的企业管理 (WBEM) 降低了这种复杂性。WBEM 是一种基于互联网的标准技术，旨在配置各种任务。通过
    WBEM，可以使用健康监控服务 (HMS) 轻松监控重要的服务器因素，包括 CPU 利用率、内存进程和网络利用。


    OES Linux 使用来自 OpenWBEM 项目的通用信息模型 (CIM) 守护进程来管理环境。CIM 守护进程通过一个或多个符合 WBEM 标准的提供来实现。这些者促进了
    SLES 和 OES 统计数据的收集。HMS 的伟大之处之一是其未来功能的潜力。这是 HMS 的第一个版本，旨在监控基本的健康相关信息。


    ## 安装 HMS


    健康监控服务可以在 OES Linux 安装期间作为可选组件安装。HMS 也可以以后通过 YaST 安装。


    使用 YaST 安装健康监控服务，请完成以下步骤：


    - 在 YaST 中选择网络类别。在此类别中，找到并选择 Novel Health Monitoring 模块。该模块将检测 HMS 的 RPM 并询问您是否要安装它们。选择“继续”安装必要的包。

    - 软件安装完成后，将执行 SuConfig 以更新系统配置。完成后，OES 组件的配置将自动开始。

    - 在 Novel Health Monitoring LDAP 服务器配置屏幕上输入以下信息并点击“下一步”完成安装：


