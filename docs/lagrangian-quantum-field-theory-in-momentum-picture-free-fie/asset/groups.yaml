    # iMonitor


    OES Linux ships with iMonitorv2.3. The goal of iMonitor is to provide a web-based
    alternative, and eventual replacement, for many of the traditional Directory management
    and troubleshooting tools such as DSBrowse, DSTrace, DSDiag, and most of DSRepair.


    iMonitor is capable of gathering information not only from OES servers, but from
    any version of eDirectory, including NDS version 4.11 or higher, and NDS or eDirectory
    running on any supported platform (NetWare, Windows NT/2000, Solaris, Linux, and
    Tru64).


    Although iMonitor provides tree-wide management, it is designed to go "down in
    the weeds" just like the console-based tools you may have used in the past. It
    keeps tracks of all the activities of the DSAgent running or so you can get an
    accurate picture of what is happening at any given time.


    The following list identifies some of the major features offered by iMonitor in
    OES:


    +   - General eDirectory tasks This category of features includes search for eDirectory
    object(s), status of DirXML in your environment (if applicable), both preconfigured
    and customizable eDirectory reports, and detailed eDirectory error code and troubleshooting
    references.

    - iMonitor agent health This includes synchronization status, detailed synchronization
    information, known eDirectory servers, and partition and replica status for this
    server.

    - Browse eDirectory agent This lets you view eDirectory objects and attributes
    from the perspective of the server as well as viewing eDirectory schema on the
    server.

    - Configuring eDirectory Configure partition lists, replication filters, background
    processes, agent triggers, login settings, schema and partition synchronization,
    and database cache settings.

    - Server-centric tasks This includes web-based versions of DSTrace, simplified
    DSRepair, and a background process scheduler. These services are available only
    for the server from which iMonitor is running.


    As you can see, most of what was previously accomplished by console-based tools
    is now available via the web-based interface of iMonitor.


    # Installing iMonitor


    iMonitor is installed automatically during the installation of OES Linux. It shares
    resources with NRM, the httpptkd daemon must be loaded on the server in order
    to access iMonitor. The newly-httpptkd daemon is started in runlevels 2 through
    5 to accomplish this.


    After the installation, you must use a web browser from a computer in your network
    or the server itself to access iMonitor. To access iMonitor from an Internet connection
    outside your network, you will need to make sure that TCP port 8030 is opened
    through the firewall to the IP address of your web server. Port 8030 is the default
    port through which you will access the Web manager interface. If you like, can
    change this port as it doesn''t conflict with any other service on the OES Netware
    server.


    To use iMonitor, you must use a web browser such as Konqueror or Mozilla on a
    Linux workstation, or Internet Explorer or Netscape on a Windows workstation.
    Make sure that Java or JavaScript is enabled on your web browser.'
