    \ deselect DirXML Server, DirXML Web Components and Utilities. Then select DirXML\
    \ Connected System, to install the Identity Manager Remote Loader and Drivers,\
    \ and click Next.\n\n- 5. At the Location screen, select the path to where the\
    \ Remote Loader will be installed, and click Next. It is usually best to just\
    \ accept the default path.\n\n- 6. At the Select Drivers for Remote Loader Install\
    \ screen, select the Remote Loader Service and the DirXML Driver for Active Directory,\
    \ and then click Next.\n\n- 7. Review the information on the Installation Summary\
    \ screen, and click Finish. You may see a warning about LDAP connections. If so,\
    \ click OK to close the message box.\n\n- 8. At the Shortcut screen, click Yes.\
    \ This will create a shortcut on your Windows desktop to the DirXML Remote Loader\
    \ Console.\n\n- 9. At the Installation Complete screen, click Close.\n\n- 10.\
    \ Launch the Identity Manager Remote Loader Configuration Wizard using dirxml_remote.exe\
    \ found in the directory specified in step 5, typically c:\\NovellRemote.Loader.\
    \ At the Welcome page, click Next.\n\n- 11. At the Command Port screen, click\
    \ Next. This port will be used by this instance of the remote loader to listen\
    \ for Identity Manager activity. Novell recommends the default port.\n\n- 12.\
    \ At the Configuration File screen, click Next. This is the name and location\
    \ of the log file that will be used to record Remote Loader configuration options.\n\
    \n- 13. At the DirXML driver screen, select Native and make sure ADDDRIVER.DLL\
    \ is listed in the drop-down\n\n# Installing Identity Manager on a Secondary eDirectory\
    \ Tree\n\nEach eDirectory tree that you want to synchronize with Identity Manager\
    \ must have an Identity Manager driver installed and configured on a replica server\
    \ of the secondary eDirectory tree. The first Identity Manager driver for eDirectory\
    \ was installed as part of the Identity Manager engine installation, described\
    \ previously. The Identity Manager driver installation will vary based on the\
    \ platform that the host server is running. Identity Manager supports the following\
    \ operating systems:\n\n- NetWare 6.0 SP3 or later\n- NetWare 6.5\n- Windows NT/2000\n\
    - Red Hat AS/ES 2.1, AS 3.0\n- SUSE Linux Enterprise Server 8 or 9\n- Solaris\
    \ 8 or 9\n- AIX 5.2L\n\nFor more information on installing the Identity Manager\
    \ driver in a secondary eDirectory tree, see the OES online documentation.\n\n\
    # Configuring an Identity Manager Driver\n\nNow that all the Identity Manager\
    \ components are in place, you can do the actual Identity Manager driver configuration.\
    \ This is done through the iManager plug-ins for Identity Manager that were previously\
    \ installed. You can use ConsoleOne to the Identity Manager configuration if desired.\n\
    \nTo simplify the configuration process, you can import the preconfigured driver\
    \ settings that you have copied to your systems as part of the Identity Manager\
    \ installation process. Before to import a preconfigured Identity Manager driver,\
    \ complete the following steps:\n\n- 1. Launch iManager from the server where\
    \ the Identity Manager plug-ins have been installed.\n\n- 2. Open the DirXML Utilities\
    \ link in the Navigation frame and click Import Drivers.\n\n- 3. Select the radio\
    \ button next to In New Driver Set, and click Next.\n\n- 4. Provide the required\
    \ information and click Next.\n  - Name a Name for the driver set.\n  - Context\
    \ Specify the context in which you want the driver set object to be created.\n\
    \  - Server Specify the server object on which Identity Manager is installed.\n\
    \  - Create a New Partition on this Driver Set Selecting this option will create\
    \ a new directory partition in which Identity data will be stored, where it can\
    \ be isolated from the rest of the day-to-day directory activity. Novell recommends\
    \ that you configure Identity Manager in this way.\n\n- 5. Select the specific\
    \ driver configuration file you want to import and click Next. You can select\
    \ multiple drivers, if desired.\n\n- 6. Provide the required information to configure\
    \ the driver and click Next. If you have selected multiple drivers, you will have\
    \ to fill out the appropriate configuration information for each driver. For more\
    \ information on the specific information requested by each driver type, see the\
    \ OES online documentation.\n\n- 7. Provide the required information to configure\
    \ administrative rights for the Identity Manager driver and click Next.\n\n- Click\
    \ Define Security Equivalence, add Admin, and click OK. This grants the Identity\
    \ Manager driver security equivalence to Admin in eDirectory so that sufficient\
    \ rights are granted the driver to perform its synchronization operations.\n-\
    \ Clickclude Administrative Roles, add Admin, and click Next. You should add any\
    \ objects with administrative roles to this list to avoid problems with similar\
    \ objects that may exist in other directories. Typically, administrative roles\
    \ are specific to a directory tree and don't need to be synchronized.\n\n- 8.\
    \ At the summary screen, click Finish. You can also click Finish with Overview\
    \ if you want to view a synopsis of the driver's settings, as shown in Figure\
    \ 10.4.\n\nFigure 10.4. Identity Manager (DirXML) Overview screen.\n\n# Identity\
    \ Manager Password Synchronization\n\nIn addition to the synchronization of data\
    \ between disparate systems such as eDirectory, Active Directory, and NT domains,\
    \ Identity Manager Bundle Edition also enables you to synchronize passwords between\
    \ these systems. Identity Manager Password Synchronization for Windows, known\
    \ as PasswordSync, allows passwords to be transparently and securely synchronized\
    \ between eDirectory and the Active Directory/NT domains for which you have Identity\
    \ Manager configured.\n\nPasswordSync uses filters and agents to capture passwords\
    \ and securely pass those changes to included systems. Identity Manager is capable\
    \ of understanding object mappings across systems so that each user object is\
    \ associated with the proper object in every other system. Because of this, synchronizing\
    \ passwords across the systems becomes much easier.\n\nThe specifics of how PasswordSync\
    \ install depends on the systems involved. For example, because Microsoft clients\
    \ forward password change requests to their respective Domain Controllers for\
    \ processing, PasswordSync Filters are installed on all Domain Controllers in\
    \ Active Directory and NT environments. On the other hand, because Novell client\
    \ sends passwords across the network, PasswordSync filters for eDirectory are\
    \ installed on the client workstation and are part of the Novell clients that\
    \ ship with OES Network.\n\nUnfortunately, password synchronization with Identity\
    \ Manager relies on PasswordSync filters and agents communicating the changes\
    \ throughout the environment, if a password is synchronized through an unsupported\
    \ mechanism, the synchronization will not occur. One example of this is an LDAP\
    \ switch in Novell eGuide. If you use an LDAP switch to change your eDirectory,\
    \ the change will not be synchronized to your Active Directory and/or NT Domain\
    \ environments, because the PasswordSync filters are never involved in the process.\
    \ Similarly, if a password is changed from a non-Windows environment, the change\
    \ will not be synchronized.\n\nBottom line here: Use PasswordSync if you can be\
    \ confident that password changes will only occur in one of the Windows methods\
    \ supported by PasswordSync. For example:\n\n- Workstation running the Novell\
    \ client\n- Workstation not running the Novell client\n- Windows server or workstation\
    \ running Microsoft Management Console\n- Windows workstation or server running\
    \ ConsoleOne\n- Workstation or server running Novell IManager\n\nFor more information\
    \ on configuring and using PasswordSync, see the OES online documentation.\n"
