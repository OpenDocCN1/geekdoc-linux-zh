    # Chapter 13. OES Printing Services


    Instant Access


    Introduction to OES Printing


    Setting Up a Secure Printing Environment


    ## Instant Access


    ### Installing and Configuring iPrint


    - Install iPrint as part of the server installation, or install it after the fact
    through YaST.

    - Configure the Driver Store, iPrint Manager, and Printer objects through iManager.


    The Driver Store and iPrint daemons are automatically started after configuration.
    If necessary, the /etc/init.d/novell-isd and /etc/init.d/novell-ipsmd scripts
    can be used to start and stop the daemons.


    Use the Manage Printers pages in iManager to configure printer objects.


    ## Working with iPrint


    - The iPrint client is required to access and manage iPrint printers. Install
    the client by going to the iPrint home page on your OES Linux server at http://<server_IP_address
    or DNS_name>/ipp.


    ## Defining Print Options


    - To tell the printer how to print a job (the paper form to use, format, and so
    on), open iManager and choose Manage Printer. Specify the printer and select the
    Configurations page to change printer configuration.


    ## Printing Jobs


    - To print files from within an application, simply follow the application''s
    normal printing procedures (making sure the application is configured to print
    to a network printer).

    - To cancel or move a print job, open iManager and choose Manage Printer. Specify
    the printer and select Printer Control, Jobs.


    ## Introduction to OES Printing


    Along with file, printer sharing was one of the original value propositions of
    Novell NetWare back in the early 1990s. OES Linux continues this on a Linux platform
    by delivering a powerful printing solution that allows users print to any printer
    to which they have given right if that printer is on the other side of the world!
    OES Linux uses ipt as its default print engine. ipt leverages the powerful foundation
    of Novell Distributed Print Services (NDPS), but puts a face to print and removes
    the dependence on the Novell client for print services. With ipt, office, mobile
    employees, business partners, and even customers can access their printers through
    connecting Internet networks. iPrint uses the Internet Printing Protocol (IPP),
    an industry standard, to make it possible to print seamlessly over the Internet,
    thus making location-based printing a reality.


    The benefits of IPP include the following:


    - IPP enjoys vendor support.

    - IPP works over local networks as well as the Internet.

    - IPP provides encrypted print services via SSL or TLS.

    - IPP provides accessibility to print services from any platform (Windows, Macintosh,
    Linux, Unix, and so on).


    Because iPrint is implemented on the foundation of NDPS, you also get all the
    advantages of robust network printing services coupled with the interoperability
    and ease-of-use of an Internet standard. So, through the combination of IPP and
    NDPS, you are gaining the following capabilities:


    - Global access to printers managed through eDirectory

    - Web-based printer location tool and driver installation

    - Capability to print from anywhere to anywhere

    - Web-based user controls and print status

    - Printers don''t have to be IPP-aware to function with iPrint


    When your iPrint environment is configured, you can enjoy powerful printing options
    suitable for the web-based business world, such as:


    - Printing across the Internet Remote employees can actually print directly to
    a printer located at office office iPrint resources are available as standard
    web URLs. Simply enter the appropriate URL for a company''s print services, locate
    the printer to which you want to print, and iPrint takes care of relinquishing
    the installation of the iPrint client software, if necessary.


    - Printing away from "home" Setting up printing when visiting a different company
    location used to be an ordeal. Now, simply access the company print services URL,
    browse to the office at which you are


    ## Setting Up a Secure Printing Environment


    iPrint is designed to take full advantage of eDirectory security and ease of management.
    Setting up a secure printing environment can be done on two ways:


    - Print access control Create a secure printing management infrastructure by assigning
    users to User, Operator, or Manager roles. This restricts the list of those who
    can control printers, iPrint Managers, and Driver Stores.

    - Securing iPrint with SSL This option not encrypts print communications over
    the wire, but also requires users to authenticate before installing and printing
    to a printer.


    These levels are discussed in the following sections.


    ## Print Access Control


    Print security is ensured through the assignment of the Manager, Operator, and
    User Access Control roles, and by the strategic placement of printers and printer
    configurations. For more information on eDirectory access control in general,
    see Chapter 7.


    The access controls for iPrint allow you to specify the access each User, Group,
    or Container object will have to your printing resources. It is important to remember
    that all iPrint print function independently. For example, assigning as a printer
    manager does not automatically grant said person rights of a printer user.


    In most cases, the default assignments will prevent any problems that this role
    independence might cause. For example, a manager is automatically assigned as
    a printer operator and user for printer. Similarly, a printer operator is automatically
    assigned as a user of that printer as well. You cannot remove the user role from
    an operator, and you cannot remove the operator and user roles from a manager.


    The creator of an iPrint object is automatically assigned to all supported roles
    for the type of object being created.


    You can assign printer objects to a given printer, but simultaneously make different
    access assignments to each.


    ### PRINTER ROLES


    As previously alluded, three roles are associated with iPrint: Manager, Operator,
    and User. Table 13.3 describes the rights granted to each.


    | ROLE | ASSOCIATED RIGHTS |

    | --- | --- |

    | Manager | Tasks performed exclusively by the manager are those that require
    the creation, modification, or deletion of printer objects, as well as eDirectory
    administrative functions. Printer managers are automatically designated as printer
    operators and users as well, so they can perform all tasks assigned to the operator
    role. |


