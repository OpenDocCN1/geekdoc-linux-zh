    # The Shell and the GUI


    You can interact with SLES using one of two methods. The first method is the use
    of a shell or console, and the second method is a Graphical User Interface (GUI).
    This section will explain and discuss both environments and provide tips for using
    these two components of SLES.


    # The Shell


    The heart of the SLES operating system is the Linux kernel. The kernel''s primary
    responsibility is to manage running processes and their interaction with the various
    hardware components of a computer. This includes management of memory (RAM), processors
    (CPU), hard disks, and other hardware components. Left on its own the kernel manages
    these components well. However, without the guidance of a user or administrator,
    the kernel will certainly not accomplish!


    For an administrator, the ability to interact with the Linux kernel can be more
    important than the kernel itself. One important way to facilitate interaction
    with the kernel is through the use of a "shell",


    A shell is a program designed to accept user input, validate that input based
    on certain criteria (such as syntax and permissions), and then pass instructions
    to the kernel for processing. This functionality is very similar to the familiar
    DOS shells used in Microsoft Windows environments. Linux shells, however, are
    much more powerful than non-Unix shells and therefore more complex and master.


    One reason for this complexity is that several shells are available for Linux
    environments. Although the purpose of these shells is essentially the same across
    all variations, the implementations can differ dramatically. The differences are
    typically manifest in syntax and feature-set capabilities, but each shell can
    also be substantially different from a usability perspective.


    Table 3.7 offers a list of the shells commonly found in Linux environments.


    Table 3.7. Common Linux Shells


    | SHELL | BINARY PROGRAM | COMMENTS |

    | --- | --- | --- |

    | Bourne Shell (SH) | /bin/sh | The standard command interpreter. On Linux, sh
    is often a symbolic link to /bin/bash. |

    | GNU Bourne-Again Shell (BASH) | /bin/bash | An improved version of the Bourne
    Shell. Supports some advanced features of the C and Korn Shells. Excellent shell
    for new Linux users. |

    | Public Domain Korn Shell | /bin/ksh | An open source version of the Korn Shell.
    Among other things, supports advanced floating-point arithmetic features. |

    | C Shell | /bin/tcsh | Enhanced version of the Berkeley Unix C shell. Features
    a programming type of command-line syntax support. |

    | The Z Shell | /bin/zsh | An enhancement of the ksh shell. Features such capabilities
    as |'
