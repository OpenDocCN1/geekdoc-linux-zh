  - '[PAGE 310]


    # Novell Ngage


    Because of the complexity of many of the modern information solutions offered
    by Novell, it''s not practical to assume that you are going to stay on top of
    every aspect of your modern network environment. To help you cope, and make the
    most of your investment in Novell solutions, Novell offers comprehensive, fee-based
    consulting services, marketed under the brand Novell Ngage, to help you with system
    planning and custom development, and comprehensive solution implementation.


    For more information about Novell Ngage services, visit the Ngage website:


    http://www.novell.com/ngage/'
  - '[PAGE 311]


    # DeveloperNet: Novell''s Developer Support


    Developers who create applications designed to run on Linux or NetWare might join
    to Novell''s program for professional developers, called DeveloperNet. Subscription
    fees for joining DeveloperNet vary, depending on the subscription level and options
    you choose. If you are a developer, some of the benefits you can receive by joining
    DeveloperNet are


    +   - Novell development CD-ROMs, which contain development tools you can use
    to create and test your applications in NetWare environments

    - Special prereereleases and early access releases of upcoming Novell products

    - Special technical support geared specifically toward developers

    - Discounts on various events, products, and Novell Press books


    For more information, visit Novell''s developer website:


    http://developer.novell.com


    You can also apply for membership or order an SDK by calling 1-800-REDWORD.'
  - '[PAGE 312]


    <!-- no content -->'
  - '[PAGE 313]


    # Novell Training Classes and Certification


    If you are looking for a way to learn about Linux, NetWare, or any other Novell
    service or product, in a classroom setting, Novell Training offers a variety of
    hands-on labs and knowledgeable instructors. As a pioneer of IT training and certification,
    Novell has a broad range of training opportunities available. For the most current
    information on Novell courses, certifications, and materials, visit the Novell
    Training website:


    http://www.novell.com/training/


    Novell classes are taught at more than thousand Novell Training Service Partners
    (NTSPs) throughout the world. They are also taught at more than 100 NATPs (Novell
    Academic Training Partners), which are universities and colleges that teach these
    courses.


    Certification courses offer an excellent way to get direct, hands-on training
    in just a few days. Classes are also available in Computer-Based Training (CBT)
    form, if you''d rather work through the material at your own pace, attend a class.


    These classes also help you if you want to become a CNE, signifying that you are
    a Novell professional.


    The Novell CNE program provides a way to ensure that networking professionals
    meet the necessary criteria to adequately install and manage NetWare. To achieve
    CNE status, you take a series of exams on different aspects of NetWare. In many
    cases, you may want to take the classes Novell offers through its NTSPs to prepare
    for the exams, but the classes aren''t required.


    The classes and exams you take depend somewhat on the level of certification you
    want to achieve. Although certain core exams are required for all levels, you
    can also take additional electives to achieve the certification and specialize
    you want.


    The following levels of certification are available:


    +   CNA (Certified Novell Administrator) This certification is the most basic
    level. It prepares you to manage your own NetWare network. It does not delve into
    the more complex and technical aspects of NetWare. If you are relatively new to
    NetWare, the class offered for this certification is highly recommended.


    +   CNE (Certified Novell Engineer) This certification level ensures that you
    can adequately install, manage, and support NetWare networks. While pursuing your
    CNE certification, you "declare a major." meaning that you choose to specialize
    in a particular Novell product family. For example, you can become a Novell 6
    CNE or a GroupWise CNE. There are several exams (and corresponding classes) involved
    in achieving this level of certification.


    +   Master CNE This certification allows you to go beyond CNE certification. To
    get a Master CNE, you declare a "graduate major." You will delve deeper into the
    integration- and solution-oriented aspects of running a network than you would
    at the CNE level.


    +   CNI (Certified Novell Instructor) CNIs are authorized to teach NetWare classes
    through NTSPs. The tests and classes of this level ensure that the individual
    taking them will be able to adequately teach others how to install and manage
    NetWare.'
  - '[PAGE 314]


    <!-- no content -->'
  - '[PAGE 315]


    # Advanced Technical Training


    In addition to standard Novell Training courses, Novell also offers highly technical
    and specialized seminars known as Advanced Technical Training (ATT). ATT is the
    most advanced training offered by Novell, and covers a wide range of advanced
    topics including support issues, in-depth architectural reviews, and advanced
    enterprise solutions. ATT is an excellent way to keep your skills, and those of
    your IT staff, in top form so that you are able to effectively support emerging
    technologies and complex network infrastructure solutions. For more information
    on ATT, visit the website:


    http://www.novell.com/training/pep/att/def.html'
  - '[PAGE 316]


    # Novell Users International


    Novell Users International (NUI) is a nonprofit association for networking professionals.
    With more than 250 affiliated groups worldwide, NUI provides a forum for networking
    professionals to meet face to face, to learn from each other, to trade recommendations,
    or just to share war stories.


    By joining the Novell user group in your area, you can build relationships and
    network with other Novell professionals in your area, attend regularly scheduled
    local user group meetings for training, and have access to regional NUI conferences,
    held in different major cities throughout the year. Best of all, there is usually
    little or no fee associated with joining an NUI user group.


    For more information or to join an NUI user group, visit the NUI website:


    http://www.nuinet.com


    You can also call 1-800-228-4NUI.'
  - '[PAGE 317]


    # Network Professional Association


    If you''ve achieved, or are working toward, your CNE certification, you might
    want to join the Network Professional Association (NPA). The NPA is an organization
    for network computing professionals, including those who have certified as networking
    professionals in Novell, Microsoft, Cisco, and other manufacturers'' products.
    Its goal is to keep its members current with the latest technology and information
    in the industry.


    If you''re a certified CNE, you can join the NPA as a full member. If you''ve
    started the certification process, but are not finished yet, or if you''re a CNA,
    you can join as an associate member (which gives you all the benefits of a full
    member except for the right to vote in the NPA''s elections).


    When you join the NPA, you can enjoy the following benefits:


    +   - NPA chapters (more than a hundred worldwide) that hold regularly scheduled
    meetings that include presentations and hands-on- demonstrations of the latest
    technology

    - A subscription to Network Professional Journal

    - Access to NPA Labs that contain up-to-date technology and software for hands-on
    experience

    - Job postings

    - NPA''s own professional certification programs

    - Discounts or free admission to major trade shows and conferences, including
    NPA''s own conferences


    For more information on the NPA, visit the website:


    http://www.npanet.org'
