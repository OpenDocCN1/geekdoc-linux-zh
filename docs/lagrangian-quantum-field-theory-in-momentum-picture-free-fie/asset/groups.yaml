    ## Novell Remote Manager


    Another management tool with OES Linux is the traditional NetWare utility Novell
    Remote Manager. In NetWare environment, NRM combines the functionality of console
    utility, together with functionality from other utilities, and NRM makes it available
    from browser.


    You can use NRM to monitor your health, change the configuration and perform diagnostic
    and debugging tasks. The following list outlines some of the major tasks you can
    perform with NRM:


    - Manage server health Monitoring the health status of one or more servers, building
    groups of servers to monitoring servers not running OES

    - Configure server environment Viewing information about kernel modules, hardware
    resources, disk partitions, and processor(s); viewing and managing running processes;
    monitoring server memory and swap statistics; accessing and uploading files on
    local partitions; managing, installing, and removing software packages

    - Troubleshoot server problems by Finding CPU hogs, finding high memory users,
    locating server process hogs, finding disk space


    Primary features of NRM include the following:


    - Logging in When you use your browser at NRM, you will be prompted to authenticate
    before seeing any pages.

    - Health Monitoring Health aspects of the server, including memory, swap, and
    disk partition statistics, can easily be monitored. Thresholds for warning notifications
    can then be set to ensure that action is taken for critical situations.

    - Process package management Software packages can be managed, removed, and installed
    directly from the NRM interface.

    - Process management All running processes, and memory and CPU resources they
    are consuming, can be quickly viewed and sorted in several manners. Rogue processes
    can be killed from this interface


    ## Accessing NRM


    With most installations and patterns for OES Linux, NRM is installed automatically.
    After the installation, we use a browser from a client computer in your network
    to access the NRM interface. In order to access NRM from an Internet connection
    outside you will need to make sure that TCP port 8009 is opened through the firewall
    to IP address of your server. Port 8009 is the default port through which you
    will access the NRM interface. If you like, this can be changed as long as it
    doesn''t conflict with any other service on the OES server.

