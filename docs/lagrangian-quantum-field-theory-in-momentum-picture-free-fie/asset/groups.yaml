    # eDirectory Architecture


    The eDirectory architecture has three main aspects:


    +   - Physical database

    - Rules governing data

    - Organization of data


    Each of these is addressed individually in the sections that follow.


    # Physical Database


    At its lowest level, eDirectory is a database. A typical database consists of
    a dataset together with methods of searching and retrieving specific data from
    the dataset. eDirectory is object-oriented, hierarchical database. A hierarchical
    database maintains data (objects) in a logical tree structure. Specific objects
    are located by traversing (walking) the tree. Each object in the eDirectory database
    is uniquely identifiable by a combination of the object name, or Common Name (CN),
    together with information describing the location of that object within the tree,
    or Context. Figure 7.1 shows a possible tree structure and the relationship between
    object name and logical position within the directory. The combination of Common
    Name and Context is known as the Distinguished Name.


    Figure 7.1. A sample eDirectory tree structure showing how location determines
    name.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_127_0.png)'
- md: '

    # eDirectory Tree Design


    A key purpose of implementing a network directory is to make the operation of
    the network more efficient and easy to use. Unfortunately, the directory cannot
    be rolled out without any consideration for the environment into which it is installed.
    There are a few basic rules that should be followed when designing an eDirectory
    tree:


    - The top of the tree reflects the physical layout.

    - The bottom of the tree reflects the organizational structure.

    - Organize objects to facilitate access and administration.

    - Partition and replicate for scalability and fault tolerance.


    Each of these issues is addressed in the sections that follow.


    # Top of the Tree Reflects Physical Layout


    The one or two levels of an eDirectory tree form the foundation for everything
    that comes later. If these levels are not configured properly, the whole tree
    suffers. Similar to the construction of a house, the eDirectory tree foundation
    needs to be stable and not prone to changes in structure.


    The stable part of an organization tends to be its capital assets (buildings and
    equipment). Organizational structure might change and merge, but it still generally
    uses the same physical facilities. Make use of this stability by designing the
    foundation of the eDirectory tree around physical locations.


    There are four main points to address when designing the top levels of the eDirectory
    tree:


    - Name the tree [Root].

    - Determine use of Country and Locality objects.

    - Define the Organization object.

    - Define location-based Organizational Unit objects.


    When you name your eDirectory tree, you are naming the [Root] object. Make the
    name descriptive and unique. It should also be different from other Container
    objects. Many use the following tree name convention: Name_TREE.


    Next have to decide how to create the first level in your eDirectory tree. This
    involves determining whether you are going to incorporate the use of a Country
    or Locality (L) object into your eDirectory tree, as shown in Figure 7.4.


    Figure 7.4. eDirectory Country and Locality objects.


    # Managing eDirectory


    When you have an understanding of the basics of eDirectory architecture and design,
    it is important to understand the activities and tools necessary to maintain eDirectory
    on a day-to-day basis.


    As the rest of OES Linux, eDirectory management is performed through web-based
    tools. Specifically, comprehensive eDirectory management is available through
    iManager and nconfig. For information on installing and configuring both iManager
    and nconfig, see Chapter 5, "Management Tools."


    iManager provides comprehensive role-based management capabilities for the eDirectory
    environment. nconfig monitors the monitoring and data-gathering aspects of several
    terminal-based utilities, including browse and sed. The nconfig interface is shown
    in Figure 7.8.


    Figure 7.8. The nconfig interface.


    iManager provides a complete set of eDirectory management tools for partition
    and replica operations. Much of this functionality is also available from nconfig.
    As mentioned in Chapter 5, although nconfig is not provided with OES Linux, this
    utility can still be used in existing infrastructures or downloaded from novell.com.
    You can also use SSH for remote access to the server.


    This section gives you an overview of common eDirectory tasks and the tools used
    to perform them. eDirectory management tasks can be organized into categories:


    - Partition operations

    - Replica operations

    - Tree operations


    # Using LDAP with eDirectory


    Lightweight Directory Access Protocol (LDAP) services for eDirectory let clients
    access information stored in eDirectory. LDAP is the preferred directory access
    protocol on the Internet. Because eDirectory lets give clients different levels
    of access, you can manage external and internal information from the same directory.
    eDirectory also supports secure connections so that privileged users can access
    internal information securely without any special client. All you need is LDAP
    support and connectivity to the LDAP server.


    # Installing LDAP Services


    Novell LDAP for eDirectory are installed automatically during the OES Linux installation
    routine. For more information on OES Linux installation options, see Chapter 2.


    Two types of objects are defined in the eDirectory schema to support LDAP services:


    - LDAP Server object: Use this object to configure the LDAP environment for a
    single LDAP server.

    - LDAP Group object: Use this object to configure LDAP client access to eDirectory.


    LDAP services for eDirectory are an integrated component of OS and cannot be manually
    loaded and unloaded.


    # LDAP OBJECT


    The LDAP Server stores configuration information in eDirectory about an LDAP server.
    The LDAP Server object is created in the same container as your server object.
    Each LDAP Server object configures one LDAP server.


    To configure an LDAP server, complete the following steps in iManager:


    1. In the Navigation frame, open the LDAP group and select LDAP Overview.

    2. Select the LDAP Servers tab, and click the LDAP Server object with which you
    want to work.

    3. Enter the configurable parameters in the property pages, and click the Refresh
    button to reset the LDAP server. Click OK when you''re finished.


    There are six pages of configuration parameters for the LDAP Server object:


    - Information: Set the general configuration of your LDAP server on this page.
    The following entries are available:

    - LDAP Group: Specify the name of the LDAP group to which this server should belong.

    - Dereference Aliases When Resolving Names: Check this option to force the LDAP
    server to resolve the actual object when it encounters an alias object.

    - Connections: Sets the secure connection settings for this LDAP server with the
    following options


    # DNS and DHCP Services


    DNS and DHCP services in OES Linux are provided by the traditional open source
    Bind and ISC DHCP Server programs. Programs are not installed by default in OES
    Linux, and if desired must be manually after the main server installation, or
    installed during a custom installation of OES Linux. Unlike OES NetWare, these
    components are not integrated into eDirectory or managed through iManager.


    DNS and DHCP manage the assignment and discovery of IP addresses on a network.
    Both of these services are managed via YaST modules, under the Network Services
    category. Complete configuration of both of these services can be quite complex
    and is beyond the scope of the book. This section will provide a brief introduction
    to these services, as well as basic configuration information. For complete information
    on these services, refer to specific documentation for each service.


    # Installing DNS and DHCP Services


    DNS and DHCP services can be installed as an optional service during the OES Linux
    installation routine. It can also be installed as a post-installation task through
    YaST.


    To install DNS/DHCP services from YaST, each component (DNS and DHCP) must be
    installed separately. Complete the following steps to install the DHCP server:


    1. Access YaST from a terminal using yast, or from a graphical environment yast2
    or the YaST launcher from the application menu.

    2. Select the Network Services category in YaST. From this category, locate and
    select the DHCP Server module. This module will detect that the prompt for dhcp-server
    is missing and if you want to install it. Select Continue to install the necessary
    packages.

    3. At the conclusion of the software installation, SuSEconfig is executed to update
    the system configuration. When this completes, the configuration of the DNS server
    will begin automatically.

    4. The first step of configuring the DHCP server is determining which interface
    the DHCP server will run on. Select the appropriate interface and click Next.

    5. At the DHCP Global Settings page, enter the following information and click
    Next:


    - LDAP Support to store the DHCP configuration in LDAP, select this option. This
    is not normally used with eDirectory.

    - Domain Name Contains the domain name when leasing addresses to clients.

    - Primary Name Server IP Enter the IP address of the primary DNS server. If you''re
    using DNS, this may be the address of the local server.

    - (Optional) Secondary Name Server Enter the IP address of a secondary DNS server.

    - Default Gateway (Router) Enter the IP address of the default gateway on the
    current LAN segment.

    - (Optional) Time Server Enter the IP address of the NTP server for synchronization
    time.

    - (Optional) Print Server Enter the IP address of the print server to be offered
    to clients. If you are using iPrint, this is not necessary.

    - (Optional) WINS Server Enter the IP address of a Windows Internet Name Service
    (WINS) server if desired.

