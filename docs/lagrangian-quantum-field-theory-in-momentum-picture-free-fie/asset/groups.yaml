    \ your name and email address or phone number. I will carefully review your comments\
    \ and share them with the author and editors who worked on the book.\n\nEmail:\n\
    \nfeedback@novellpress.com\n\nMail:\n\nMark Taber\nAssociate Publisher\nNovell\
    \ Press/Pearson Education\n800 East 96th Street\nIndianapolis, IN 46240 USA\n\n\
    # Reader Services\n\nFor more information about this book or others from Novell\
    \ Press, visit our Web site at http://www.novellpress.com. Type the ISBN or the\
    \ title of a book in the Search field to find the page you're looking for.\n\n\
    # Part I: Open Enterprise Server Overview\n\n- 1 Introduction to Open Enterprise\
    \ Server\n- 2 Installing OES for Linux\n- 3 Working with SUSE Linux Enterprise\
    \ Server 9\n- 4 OES Linux Clients\n- 5 OES Management Tools\n\n# Chapter 1. Introduction\
    \ to Open Enterprise Server\n\nInstant Access\n\nWhy Open Enterprise Server?\n\
    \nWhat Is Open Enterprise Server?\n\n# Instant Access\n\nOpen Enterprise Server\
    \ (OES) incorporates the best of both open source and enterprise network operating\
    \ systems: NetWare 6.5, and SUSE Linux Enterprise Server 9 (SLES), with a common\
    \ set of services, applications, and management tools. Not only does this provide\
    \ value to customers, but it keeps them from being locked into a single-technology\
    \ foundation.\n\n# Why Open Enterprise Server?\n\nNovell's Open Enterprise Server\
    \ (OES) is a secure, highly available information platform that provides powerful\
    \ networking, communication, collaboration, and application services in an open\
    \ environment. As network operating systems have become increasingly commoditized,\
    \ Novell has recognized the way to provide value to its customers is not to lock\
    \ them into a single-technology foundation. To that end, OES incorporates the\
    \ best of both open-source and enterprise network operating systems: NetWare 6.5,\
    \ and SUSE Linux Enterprise Server 9 (SLES), with a common set of services, applications,\
    \ and management tools.\n\nWith the release of OES, organizations can choose NetWare,\
    \ SUSE Linux, or a combination of both platforms, as dictated by real business\
    \ needs. Moreover, common management, directory, and upgrade utilities allow organizations\
    \ to manage both platforms with a single set of tools, simplifying daily administration.\n\
    \nWith OES, Novell demonstrates its commitment to its traditional NetWare customers\
    \ while embracing the power and new opportunity represented by Linux and the Open\
    \ Source movement.\n\n# What Is Open Enterprise Server?\n\nOES lets you deploy\
    \ any combination of NetWare- and Linux-based technologies. Core OES components\
    \ include\n\n- The NetWare 6.5 Service Pack 3 operating system, and all related\
    \ NetWare 6.5 services\n- The SLES9 operating system, based on the Linux v2.6\
    \ kernel, and all SLES9related services\n- The latest Novell Ns Linux Services\n\
    - Common management tools that allow seamless coexistence and management of the\
    \ two operating systems\n\nGiven NetWare and Linux are very different operating\
    \ systems, it's not surprising to find a certain amount of variation between the\
    \ services available between the platforms. However, Novell has done an admirable\
    \ job of providing a common set of services across both platforms, but there are\
    \ specific differences to some of the services offered on each platform. Table\
    \ 1.1 lists the main OES services and the platform on which they are offered.\
    \ As you can see, the majority of services are available on both platforms, organizations\
    \ can pick their services and implement them on the platform that makes the most\
    \ sense in their specific environment. This table also refers to the part of this\
    \ book in which each service is discussed.\n\nTable 1.1. Platform Support for\
    \ OES Services\n\n| OES SERVICE | OFFERED ON | COMMENTS |\n| --- | --- | --- |\n\
    | iManager | Both | Web-based OES administration console. |\n| Novell Remote Manager\
    \ | Both | Web-based NetWare and Linux operating-system management console. |\n\
    | iMonitor | Both | Web-based eDirectory monitoring and maintenance console. |\n\
    | Novell Client | Both | Client utility used to access NetWare and Linux NCP services.\
    \ |\n| NetIdentity | Both | Provides transparent eDirectory authentication. |\n\
    | NetDrive Client | Both | File redirector used to map local drives without the\
    \ full Novell Client. |\n| NICI Client | Both | Novell International Cryptographic\
    \ Infrastructure. Provides access to |\n\n# Chapter 2. Installing OES for Linux\n\
    \nInstant Access\n\nGetting Ready for OES Linux\n\nInstalling OES Linux\n\nUpgrading\
    \ SLES9 to OES Linux\n\nCommon Post-Installation Tasks for OES Linux\n\n# Instant\
    \ Access\n\n# Preparing to Install\n\n- Ensure that your server hardware meets\
    \ the minimum requirements of OES Linux:\n  - Server-class computer with Pentium\
    \ II or AMD K7 450MHz processor (Pentium III, Pentium 4, AMD K8, or higher recommended)\n\
    \  - 512MB of RAM (1GB recommended)\n  - 2GB of available, unpartitioned disk\
    \ space (10GB recommended; additional space may be required depending on OES component\
    \ implementation)\n  - 4X CD-ROM drive (48X recommended)\n- Plan out the layout\
    \ of your OES Linux filesystem, eDirectory tree, and network configuration prior\
    \ to creating a new OES Linux environment.\n- Prior to implementing OES for Linux\
    \ on an existing SLES9 server, ensure that you have a full backup and verify that\
    \ you can recover the data from it.\n\n# Configure Installation Source\n\n- Use\
    \ netInstall.sh to configure a network-based installation source. This script\
    \ is available from the following URL:\nhttp://www.novell.com/documentation/oes/script/netInstall.sh\n\
    - Export your installation source directory using a network protocol such as NFS,\
    \ HTTP, or FTP.\n\n# Installing OES Linux\n\n- To install a new SLES9 server with\
    \ OES, insert the OES CD1 CD-ROM into your server's CD-ROM drive and reboot the\
    \ server. Follow the subsequent installation prompts.\n\n# Upgrading SLES9 to\
    \ OES\n\n- Ensure that Linux authentication is set to use local files for authentication\
    \ rather than OpenLDAP-based LDAP authentication.\n- Ensure a static IP address\
    \ and valid hostname and domain name (resolvable in DNS) are configured on the\
    \ server.\n"
