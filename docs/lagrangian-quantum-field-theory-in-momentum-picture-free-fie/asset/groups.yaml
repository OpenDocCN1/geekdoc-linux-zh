    # NSS Data Security


    One of the most features of NSS is its flexible, yet powerful, security model.
    This security is integrated with eDirectory and offers comprehensive security
    management through command-line tools, NetStorage, or the Novel Client. As mentioned
    earlier in this chapter, NSS operates in two modes, NetWare and Linux mode. NetWare
    requires that eDirectory accounts be used to access NSS volumes. This allows for
    integration with eDirectory, and is the only way for the advanced security capabilities
    described in this section. Linux mode refers to accessing NSS volumes with local
    user accounts. In this mode, you are limited to the traditional POSIX permissions
    seen with other Linux systems. Information about POSIX permissions can be found
    in [Chapter 3, Working with SUSE Linux Enterprise Server 9\].


    With an NSS filesystem in NetWare mode, you can implement two of security tools
    in the filesystem, either together or separately, to protect your files:


    +   - Trustee rights are equivalent to entry rights for eDirectory objects. Trustee
    rights enforce access control that defines the possible actions that can be taken
    with Volume, Folder, and File objects and who can perform those actions.

    - Attributes Attributes define the characteristics of individual Folder or File
    objects. Because attributes trump trustee rights, they control the activities
    of all users, regardless of which trustee rights are assigned.


    # Filesystem Trustee Rights


    Filesystem trustee rights allow eDirectory users and groups to work with files
    and directories on NSS volumes in specific ways. Each right determines whether
    a user can do things such as read, change, rename, delete the file or directory.
    NSS filesystem rights obey inheritance rules just like eDirectory. When rights
    are assigned to a file, they define a user''s allowed actions for that file. When
    rights are assigned to a directory, they affect a user''s allowed actions not
    only the directory itself but also everything stored within that directory.


    Although filesystem rights are similar to the eDirectory rights for objects and
    properties (described in [Chapter 8, Users and Security]), they are not the same.
    Filesystem rights are separate from eDirectory objects. They affect only how users
    work with files and directories. eDirectory affect how users work with other eDirectory
    objects.


    There are eight filesystem trustee rights. You can assign any combination of those
    filesystem rights to a user or group, depending on how you user or group to work.


    [Table 11.2] describes the available filesystem rights and how they affect directory
    and file access.


    Table 11.2. Filesystem Rights


    | FILESYSTEM RIGHT | ABBREVIATION | DESCRIPTION |

    |---|---|---|

    | Read | r | Directory: Allows the trustee to open and read files in the directory.
    File: Allows the trustee to open and read the file. |

    | Write | w | Directory: Allows the trustee to open and write to (change) files
    in the directory. File: Allows the trustee to open and write to the file. |'
