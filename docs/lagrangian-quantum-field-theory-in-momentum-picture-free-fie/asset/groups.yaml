    ## Clustering Terminology


    We all know that clustering provides a high-availability platform for your network
    infrastructure. High availability is becoming increasingly important for two purposes:
    file access and network services. The following sections discuss NCS configuration
    for both of these situations. However, before you starting an NCS cluster, you
    should be familiar with the terms described in the following sections.


    ## Master Node


    The first server that comes up in an NCS cluster assigned the cluster IP address
    and becomes the master node. (Other nodes in the cluster are often referred to
    as slave nodes.) The master node updates information transmitted between the cluster
    and eDirectory, and monitors the heartbeat of the cluster nodes. If the master
    fails, NCS migrates the cluster IP address to another server in the cluster, and
    that server becomes the master node.


    ## Cluster-Enabled Volume


    A cluster-enabled volume is an NSS volume configured to provide location-transparent
    access to OES Linux file services. The volume is associated with an eDirectory
    virtual server object that provides a unique secondary IP address for locating
    the volume on the cluster''s shared storage device. The volume provides read-write
    file access to users.


    NOTE


    OES Linux failover storage pools. This means you can migrate more than one volume
    at to another node if they are part of the same storage pool. For more information
    on Novell Storage Services (NSS), see Chapter 11, "OES Linux File Storage and
    Management."


    ## Cluster Resource


    A cluster resource is an object in eDirectory that represents an application or
    other type of service (such as DHCP or the master IP address) that you can migrate
    or fail over from one node to another in an NCS cluster. The cluster resource
    object includes scripts for unloading the service from one node and loading it
    on another node. In cases, make sure the service is installed on all nodes in
    the cluster that will host the service.


    ## Heartbeats and the Split-Brain Detector


    NCS uses heartbeats on the LAN and a Split-Brain Detector (SBD) on the shared
    storage device to keep all services highly available when the cluster fails. NCS
    determines when a node fails over the LAN and casts the failed node through the
    following process:


    - Every second (by default), each node in an NCS cluster sends out a heartbeat
    message over the network.

    - The master node monitors the heartbeats of all other nodes in the cluster to
    determine whether they are still functioning.

    - If a heartbeat is not received from a node during a predefined timeout (eight
    seconds by default), that node is removed (cast off) from the cluster, and migration
    of services begins.


    ## Installing Novell Cluster Services


    The following list specifies the minimum hardware requirements for installing
    NCS:


    - A minimum of two OES servers.

    - At least 512MB of memory on all servers in the cluster. This provides sufficient
    memory to support failover of multiple applications to the same server node.

    - At least one local disk device on the root filesystem will be installed for
    each node.

    - A shared disk system, either Storage Area Network (SAN) or iSCSI, is required
    for each cluster in order for all cluster data to be available to each node. This
    is how high availability of data is achieved.


    NOTE


    NCS will create a special cluster partition using one cylinder of one drive of
    the shared disk system. This will require roughly 20MB of free disk space on the
    shared disk system for creating the cluster partition.


    WARNING


    Be aware that it is possible to access shared disk systems by servers both in
    and out of the cluster. With NCS, this can cause corruption and loss of the entire
    volume. To avoid this, ensure that only servers within the cluster access the
    shared disk system. If a non-cluster server must access the same disk system,
    ensure that access is only granted to non-cluster volumes.


    - Make sure the disk system is installed and configured in accordance with the
    manufacturer''s instructions.

    - Make sure the disks in the shared disk system are configured in some type of
    fault-tolerant configuration, such as mirroring or RAID 5. If this is not done,
    a single disk error can potentially cause a volume failure across the entire cluster.


    ## Configuring the Shared Disk System


    Prior to installing NCS, access to the shared disk system should be configured.
    One of the easiest methods of accessing a shared disk is through iSCSI. iSCSI
    is a new standard that makes it possible to transmit SCSI communications over
    a network by encapsulating them in standard TCP/IP data packets. This enables
    you to create a low-cost Storage Area Network (SAN) using regular high-speed network
    hardware, and avoid the considerable costs previously associated with fiber-based
    SAN architectures.


    ## ISCSI BASIS


    Two main components are required for iSCSI access to a shared disk:


    ## Configuring Novell Cluster Services


    There are some general configuration options for your NCS environment of which
    you should be aware. All of these configuration options are available from the
    Cluster Options page in iManager, shown in Figure 9.3.


    Figure 9.3. Cluster Options page in iManager.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_171_0.png)


    To access the Cluster Options page in iManager, perform the following steps:


    1. 1. From within iManager, select the Cluster Options link, found under the Clusters
    category.

    2. 2. In the right pane, use the Object Selector or Object Browser tools to locate
    your cluster object. After you select the cluster object, the current page will
    reload.


    To access the Cluster Options page in iManager, perform the following steps:


    From this page, select the Properties button from the Cluster Options page. This
    will open the Cluster Properties page, shown in 9.4. The various settings available
    from this page are described next.


    Figure 9.4. Cluster Properties page in iManager.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_171_1.png)


    ## Always-Available File Access


    To make data constantly available through your newly created cluster, you need
    to create and configure shared pools by any the traditional filesystems (Reiser,
    EXT2/3, and so on) or NSS. Shared volumes must be designated as sharable either
    during or after creation. This is possible through iManager and the command-line
    nssmu utility. To create a cluster-enabled pool during creation via iManager,
    complete the following steps:


    - 1. From iManager, select the Pools link, find under the Storage cluster in the
    left frame.

    - 2. In the right pane, use the Object Selector or Object Browser tools to locate
    your cluster object. After you select the cluster object, the current page will
    reload.

    - 3. Select New to create a new pool.

    - 4. Enter the name of the NSS pool, and click Next.


    NOTE


    Because periods are used as delimiters in fully qualified names inDirectory, periods
    cannot be used in the naming of your pool. If spaces are used in the name, eDirectory
    will convert those spaces to underscores.


    - 6. Select Finish to create the new NSS pool. For more information on NSS pools,
    see Chapter 11.

    - 7. You can choose to cluster-enable the pool now or later. You must cluster-enable
    a pool in order for it to fail during a failure. If you choose to cluster-enable
    the storage pool, you will have to provide the following information:


    - Virtual Server Change the name of the default Virtual Server object. When you
    cluster-enable a pool, the Virtual Server is named by combining the Cluster object
    name and the Pool object name. For example: QuillCluster_SharePool_Server.

    - CIFS Name If you select CIFS as an advertisement protocol, specify a server
    name for CIFS clients will be for this storage when browsing the network.

    - IP Address each cluster-enabled pool requires its own IP address. This address
    is used to provide access and failover capability to the pool. It is assigned
    to the storage pool and volume within the pool. All volumes share the same IP
    address.

    - Advertising Protocols Specify how you want the shared storage pool to advertise
    itself to clients. AFP is used by Macintosh clients, CIFS is used by Microsoft
    Windows, and NCP is used by the Novell client.


    ## Cluster-Enabling a Volume After Pool Creation


    When you have created the NSS pool, you can add shared volumes. Shared volumes
    can be created with either iManager or nssmu. The following steps can be used
    to create a shared volume using iManager:


