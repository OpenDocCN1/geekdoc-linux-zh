    # # Introduction to Linux Kernel Management


    At the heart of the SLES operating system is the Linux kernel. As mentioned in
    the "SLES Startup Procedures" section of this chapter, the Linux kernel is found
    in the /boot directory and is typically named vmlin-<kernel. The default kernel
    with OES Linux installation is 2.6.5-7.112-default. The kernel version number
    can actually be divided into the following three important numbers:


    +   - Major Number This represents the current major version number of the Linux
    kernel. The Linux kernel is currently at a major number of 2.


    +   - Minor Number This represents the minor version number of the Linux kernel.
    Modern distributions are based on either minor number 4 or 6 of the Linux kernel.
    SLES9 uses a kernel with a minor number of 6. This kernel is commonly referred
    to as the 2.6 kernel.


    +   - The minor number can also be used to represent the status of the kernel.
    If the minor number is an odd number (such as kernel version 2.5), that version
    of the kernel is a non-stable or developmental release of the kernel. Minor numbers
    using an even (such as 2.6) are known as production or stable versions of the
    kernel.


    +   - Revision Number The final number of the Linux kernel is the revision number
    of the kernel. SUSE adds some information to this field to indicate the build
    of the kernel, as well as the specific environment the kernel was intended for.
    In the OES kernel version 2.6.5-7.112-default, the revision number is 5-7 and
    the SUSE build number and environment designations are 112-default.


    # NOTE


    The uname -r command can be used to display the version of the currently running
    kernel.


    The most common administrative task relating to the kernel is most likely applying
    kernel updates to resolve security issues. Applying kernel updates through the
    YaST Online Update or Red-Carpet tools is a very straightforward process, but
    if problems are encountered, you may need to know more details regarding the layout
    of the kernel-related files.


    [Table 6.5](#) outlines the important kernel-related files found within the /boot
    directory.


    Table 6.5. Important Kernel-Related Files in /boot


    # FILE


    # DESCRIPTION


    vmlinuz-2.6.5-7.112-default


    2.6.5-7.112-default version of the Linux kernel.


    vmlinuz


    A symbolic link that points to the current version of the Linux kernel. The /boot/grub/memnu.list
    file configures GRUB to use this vmlinuz file rather than the actual vmlinuz-<kernel>
    file.


    initrd-2.6.5-7.112-default


    Initialization RAM Disk used by the startup routine to provide hardware drivers
    to the initialized kernel. This is used prior to the root filesystem being mounted.'
