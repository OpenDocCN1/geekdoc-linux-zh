    ## NetIdentity


    NetIdentity 代理利用了用于 NetStorage、Apache 和 Tomcat 服务的 XTier 框架，为所有使用 eDirectory 认证的
    Novell 服务提供单点登录。唯一的限制条件是，用户进行身份验证的第一个服务必须启用了 NetIdentity。启用了 NetIdentity 的服务列表包括：


    - Novell 客户端（Windows 9x 使用 v3.4x，Windows XP/2000 使用 v4.9x）

    - iFolder 2.x

    - iPrint

    - NetStorage

    - Novell Portal Services


    当你通过这些服务之一通过了身份验证后，访问任何其他使用 eDirectory 认证传输服务（例如 iManager）都将触发透明的后台身份验证，因此你无需重新输入身份验证信息。


    要在 Novell 服务上启用基于 NetIdentity 的单点登录，请完成以下任务：


    - 确保所有用户将进行身份验证的 OES NetWare 服务器上都已安装 XTier 框架。

    - 在你想要启用 NetIdentity 服务的工作站上安装 NetIdentity 代理。


    在安装 NetStorage、Apache 和 Tomcat 服务时，会自动安装 XTier 框架。它无法单独选择并安装，因此如果你想使用 NetIdentity，请在继续之前在
    OES Linux 服务器上安装这些服务中的一个或多个。如果在该服务器上已安装 XTier，请将浏览器指向以下地址：


    ```

    http://<server IP or DNS name>/oneNet/xtier-login

    ```


    如果已安装 XTier，你将看到一个验证框，表示服务器可以识别由 NetIdentity 的凭据。


    要安装 NetIdentity 代理，请按照以下步骤操作：


    1. 找到 netidentity 文件夹，其中是从 http://download.novell.com 下载的 ZIP 文件中解压出的 Novell 客户端文件。例如，对于
    Windows XP/2000 的 Novell 客户端，NetIdentity 文件夹位于 WINNT\x86\。

    2. 运行位于 netidentity 文件夹中的 SETUP.EXE。

    3. 选择安装语言并点击确定。


