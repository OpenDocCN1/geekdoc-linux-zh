    # Chapter 8. Users and Network Security


    ## Instant Access


    - Overview of Users in OES Linux

    - eDirectory User-Related Objects

    - eDirectory Authentication

    - eDirectory Authorization

    - Provisioning Linux Users


    ## Instant Access


    ### Creating Users and Groups


    - To create User and Group objects, use iManager.

    - To set up a template so that all users you create receive a set of common characteristics,
    use iManager to create a Template object.


    ### Ensuring Login Security


    - To create account restrictions, access the user or group properties through
    iManager.

    - To set or change passwords, access User object properties through iManager.


    ### Working with eDirectory Security


    - To view or change eDirectory object or property rights, use iManager.


    ## Overview of Users in OES Linux


    At its fundamental level, OES Linux provides file and print services and network-enabled
    application support to end users. These user-aware services require some method
    of locating a valid user account, and then authenticating the requested user to
    that account. When identity and permissions have been established, the service
    is started with the appropriate environment.


    OES user accounts are all stored and managed within eDirectory. Not all applications
    and services, however, directly integrate or support eDirectory. To bring eDirectory
    functionality to as many applications as possible, OES Linux provides support
    for two primary methods of authentication:


    - Native eDirectory

    - LDAP


    ### Native eDirectory


    eDirectory-aware services are those that understand the eDirectory Application
    Program Interface (API). Services that understand this API have the advantage
    of being able to directly communicate with eDirectory and leverage the many advanced
    features eDirectory has offered for years.


    OES Linux offers several services that communicate directly with eDirectory through
    this API. Examples of this include iManager, Virtual Office, iFolder, the Novel
    Client, and others. Through direct API communication with eDirectory, these services
    can leverage such as advanced authentication mechanisms and complex permissions
    structures offered on volumes.


    ### LDAP


    Services that do not leverage the eDirectory API can still take advantage of eDirectory
    for user storage and account management. To accomplish this, these services rely
    on an industry standard known as Lightweight Directory Access Protocol (LDAP).


    LDAP is a protocol used to communicate with directories containing some form of
    information. In the case of eDirectory, the information requested is quite often
    user account details. OES Linux installations with eDirectory automatically support
    LDAP connections for this purpose. LDAP-aware services can be configured to take
    advantage of this through the use of an LDAP connection to eDirectory. This connection
    is then used to locate and authenticate user accounts prior to the service initiated.


    OES Linux relies on this functionality for many important Linux services. One
    example of this is the Samba software suite provides Linux resources to Windows
    users as the Linux server were actually running Windows. This functionality requires
    Windows users to authenticate to the Linux server as they would with any other
    Windows machine. Traditionally, Samba stores users in a local file, unique to
    Samba. With OES Linux, Samba is configured to use LDAP to locate eDirectory users
    who are allowed to Samba resources.


    Another example of this situation is the Pluggable Authentication Module (PAM)
    enabled services into eDirectory. With Samba, eDirectory user objects are modified
    with OES to provide Linux authentication to any PAM-aware service via LDAP and
    eDirectory. This is provided through the Linux User management of OES. Services
    that can use this functionality such as SSH, FTP, and local logins.


    It is important to ensure that for these services that do not natively support
    eDirectory, the three conditions must be met in order to support LDAP storage
    and authentication of accounts:


    ## eDirectory User-Related Objects


    OES users are all stored within eDirectory. In addition to registering these objects
    across servers and providing base account authentication, eDirectory provides
    a solid security model that includes things as trustee assignments, administrative
    roles, inherited rights, and filters. Understanding user-related objects, as well
    as the security model provided by eDirectory, is critical to implementing a secure
    user environment.


    There are three eDirectory objects that help organize your network users. You
    can use iManager to create and manage each of these types of objects (for more
    information on iManager, see Chapter 5, "OES Management Tool");


    - User object

    - Group object

    - Organizational role


    These objects form the foundation from which eDirectory-based network services
    and privileges are ultimately delivered. After all, new OES Linux and eDirectory
    installation, the only eDirectory User object that exists is Admin (the root user
    does exist, but as a local user, rather than stored within eDirectory). Although
    it might be comforting to think of network of one, you are going to create user
    accounts for every one of your users. After user accounts have been created, your
    users can get working on the network. In most cases, users on a network will notice
    a little difference from working on a standalone computer. They still use the
    applications they were using before. They still open, save, and delete files the
    same way. They can still play the games they were before, if you limit them!


    And thats'' the goal of network security: to prevent users from taking some action,
    either unintentionally or intentionally, that might compromise the integrity of
    the network or expose network resources in such a way that can cause harm to the
    network or the organization. There are several levels of network security in today''s
    networks, and OES Linux gives you a great deal of control over each.


    ### The User Object


    To create an eDirectory User object, complete the following steps:


    1. Launch iManager. In the Navigation frame, open the Users group and select Create
    User (see Figure 8.1).


    Figure 8.1. Creating a new user in iManager.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_147_0.png)


    ## eDirectory Authentication


    Authentication provides the doorway to access network resources. Without a strong
    authentication mechanism, sensitive network resources are essentially bare for
    anyone to access. The primary authentication method currently used with eDirectory
    is the username/password combination. Novel Modular Authentication Service (NMAS)
    makes it possible to integrate more authentication and authorization techniques
    into OES environment. Furthermore, NMAS offers Universal Passwords, which improve
    the traditional password-based authentication method.


    ### Novel Modular Authentication Service


    NMAS is designed to help you protect on your network. NMAS offers a more robust
    framework for protecting your OES Linux environment. If you''re not familiar with
    the different components of NMAS, you should get to know the following concepts.
    More information about each of these is provided in the OES online documentation.


    ### PHASES OF OPERATION


    There are specific times when NMAS can be useful in helping to secure your network
    environment:


    - User identification occurs prior to the actual authentication process. It provides
    a way to automatically gather a user''s authentication information and use it
    to populate the Novell login dialog in the Novell Client.

    - Authentication is the opportunity for users to prove they are who they claim
    to be. NMAS supports multiple authentication methods.

    - Device removal detection is the capability to lock down a workstation after
    authentication it becomes clear that the user is no longer present.


    Each of these phases of operation is completely independent. You can choose to
    use the same, or completely different, authentication techniques for each phase.
    To provide this functionality, NMAS introduces a few additional concepts to eDirectory
    authentication:


    - Login factors

    - Login methods and sequences

    - Graded authentication


    ### LOGIN FACTORS


    NMAS uses three approaches to logging in the network, known as login factors.
    These login factors describe different items or qualities a user can use to authenticate
    the network:


    - Password authentication Also referred to as "something you know," password authentication
    is the traditional network authentication method. It is still responsible for
    the lion''s share of network authentication that goes on, including LDAP authentication,
    browser-based authentication, and most other directories.

