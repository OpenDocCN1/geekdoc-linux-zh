    # 故障排除


    SLES 的故障排除可能是一个复杂的过程。本节包含了故障排除过程中使用的重要日志文件、程序和工具。


    ## 系统日志文件


    SLES 使用系统日志记录（syslog）工具来跟踪所有运行进程的事件。这些事件被写入日志文件中，可用于故障排除和系统分析。当你对 SLES 上的任何类型的问题进行故障排除时，这些日志文件是最佳起点。表
    6.7 列出了在 SLES 上可以找到的关键日志文件。


    表 6.7. SLES 上的重要日志文件


    | 日志文件 | 用途 |

    | :--- | :--- |

    | /var/log/messages | 大多数 syslog 消息存储在此文件中。 |

    | /var/log/boot.msg | 系统启动时，所有与启动相关的消息都会写入此文件。 |

    | /var/log/YaST2 | 该目录包含 YaST 及 YaST 模块运行的日志文件。 |

    | /var/log/cups | 在此目录下可以找到 CUPS 相关的日志文件。 |

    | /var/log/mail | 邮件相关消息的日志文件。 |

    | /var/log/XFree86.0.log | 包含与 XFree86 服务器相关消息的日志文件。 |

    | yast2 view_anymsg-or-yast view_anymsg | 用于启动 YaST 系统日志监控模块的命令。（yast2 是图形化工具，而
    yast 是命令行版本）。 |


    ## 注意


    OES 组件的日志文件通常位于 /var/opt/novell/log。


    ## /proc 和 /sys 文件系统


    在对硬件相关问题进行故障排除时，确定内核关于连接到服务器的所有硬件设备的精确信息至关重要。`/proc` 文件系统是一个虚拟文件系统，允许让你深入了解运行中的内核。通过查看
    `/proc` 目录结构中的相应文件，可以分析许多内核配置值。


    从 2.6 内核开始，增加了 sysfs 文件系统以访问有关内核数据和属性的其他信息。该文件系统挂载在 `/sys` 目录，可查询当前内核识别的硬件设备的特定设置。并不是所有设备在
    sysfs 文件系统中都有接口，低级设备管理必须同时使用 `/proc` 和 `/sys` 文件。


