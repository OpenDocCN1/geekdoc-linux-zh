    ## Apache Web Server


    Apache Web Server is the primary HTTP stack for OES Linux. Apache is an open-source
    web server used by more than two-thirds of the Internet''s web servers. As such,
    it runs on all major platforms and can scale to thousands of simultaneous connections.


    Apache Web Server is a complex and full-featured product, so there is a lot more
    to it than can be covered here. However, because Apache is an open-source application,
    almost anything you want to know about it is available on the web. You should
    take some time to look through the Apache documentation in order to become familiar
    with architecture and capabilities, if you are going to implement a more complex
    web environment. The Web Server documentation is available online at http://http.apache.org/docs-2.0.


    Apache Web Server can be seen in a few different ways on OES Linux. First installed
    automatically as a dedicated web server to support the administrative tools for
    OES Linux and its related products and services. You can find all files in this
    instance of Apache in /etc/opt/novell/conf directory. This administrative server
    supports iManager, Virtual Office, iPrint, and other OES services that need a
    web interface.


    If you use iFolder, a configured instance of Apache is required. Normally, this
    is accomplished by installing iFolder on its dedicated server (with no other OES
    components). However, it is possible to install other OES components on the same
    server. To ensure iFolder is usable in both configurations, a separate, dedicated
    instance of Apache is used. The configuration file used by the iFolder instance
    of Apache can be found in the /etc/opt/novell/ifolder/conf directory.


    ### NOTE


    The iFolder version of Apache is highly customized and specific to the iFolder
    process. Configuration files for this instance of Apache should not be modified
    manually. For more information on iFolder, see Chapter 15, "OES Web Services."


    Another way Apache is commonly used with OES is to host your own web content.
    In this situation, you should not load another instance of Apache, but rather
    customize the administrative instance of Apache to recognize a virtual server,
    or document root directory. This is covered later in this chapter.


    When you use iManager, accessible from any web browser, it is the Admin configuration
    of the Apache Web Server that serves the data from the web browser and OES Linux.


    ## Installing Apache Web Server


    If you are interested in using Apache as the foundation for your OES Linux tools
    and services, you don''t have to do anything to get Apache up and running. The
    admin server configuration of Apache is installed automatically in most OES instances.


    However, if you choose to perform a custom installation of OES, or are adding
    OES components to an existing SLES9 server, you must install Apache Server manually
    through YaST, complete the following steps:


    - 1. Access YaST from a terminal using, or from a graphical environment using
    yaast2 or the YaST launcher from the application menu.

    - 2. Select the Software category in YaST. (This is typically the category selected
    by default.) From within Software category, click on Install and Refresh Software
    module.

    - 3. Use the Filter drop-down box to select the Selections category.


    ## Tomcat Servlet Engine


    As Tomcat, is an open-source application. It is also known by its open-source
    project name, Jakarta. For more information on the Jakarta project, http://jakarta.apache.org/
    Its specific function is as a servlet Container is a server-side program that
    generates dynamic web pages based on user input. Tomcat provides a runtime environment
    within which servants can be executed and managed. Apache Web Server depends on
    Tomcat to process servants and Java Server Pages (JSP).


    As Apache, two instances of Tomcat can be loaded on an OES Linux server. The first
    is an instance that is used in conjunction with the Apache admin server to support
    the various management tools and other services available with OES Linux. The
    admin instance of Tomcat is loaded automatically when OES Linux is installed.


    The second instance is a public copy that is used in support of web applications
    that are served from OES Linux server. You will use this instance to build your
    own web environment.


    ### NOTE


    Tomcat provides basic servlet and JSP support for OES Linux. For a more robust
    web application development environment, Novell offers Novellext Application Server.
    For more information on Novellext offerings, the OES Linux online documentation,
    and http://www.novell.com/solutions/extend/


    ## Installing and Configuring Tomcat


    Because Tomcat is useless without a web server with which to operate, Tomcat is
    normally installed in conjunction with Apache Web Server. For information on installing
    Apache and Tomcat, the Apache installation section earlier in this chapter.


    By default, OES Linux installs Tomcat 4 configuration files into the /etc/opt/novell/tomcat4
    directory structure. If a second instance or public version of Tomcat is installed,
    these configuration files will be installed in the /etc/tomcat directory.


    The admin (OES-specific) version of Tomcat requires no additional configuration
    information in order to be operational. However, it is a good idea to understand
    the important configuration files for Tomcat. The following list contains the
    most important configuration files for the admin of Tomcat:


    - server.xml configuration file for Tomcat. This file is located in the /etc/opt/novell/tomcat4
    directory.

    - jk_module.conf The main configuration file for the Jakarta-Apache plugin-in.
    This file is located in the /etc/opt/novell/httpd/conf.d directory.

    - workers.properties contains configuration information that connects servants
    to Tomcat workers. This file is located in the /etc/opt/novell/httpd/conf.d directory.


    The public version of Tomcat uses the same configuration files; however, they
    are typically located within /etc/tomcat directory. For more information on configuring
    Tomcat for use outside of OES, refer to the Tomcat documentation.


    ## Managing Tomcat


    Tomcat does not require management with OES as the configuration should be completed
    by the OES installation, and the Tomcat service should be started automatically
    at server startup. However, you may encounter


    ## Chapter 15. OES Web Services


    - Instant Access

    - Novell Virtual Office

    - Novell QuickFinder

    - Novell eGuide

    - Additional OES Linux Web Services


    ## Instant Access


    ## Using Virtual Office


    - Use preconfigured services to make OES Linux files, as well as common services
    such as NetStorage, iPrint, and email, available through a single portal website.

    - Access Virtual Office at https://<server name or IP address>/vo.

    - Configure Virtual Office through Administration links visible within Virtual
    Office to users with eDirectory administrative rights.

    - Virtual teams are a specialized instance of Virtual Office that you can use
    to create ad-hoc portals to support a community, group, or team focused on a specific
    project or topic of discussion.


    ## Working with Novell QuickFinder


    - QuickFinder creates a web search engine for use by internal users (indexes relevant
    Internet websites) or by external users (indexes your web server information so
    that it can be effectively searched.)

    - QuickFinder can be configured and managed through the QuickFinder Server Manager
    pages, which are accessible at https://<server name or IP address>/qsearch/admin.
    Links to this management page are also available via iManager.


    ## Working with eGuide


    - eGuide provides robust and secure LDAP white pages to access company information.

    - Access the eGuide search page at https://<server name or IP address>/eGuide.

    - Access the eGuide Administration Utility at https://<server name or IP address>/eGuide/admin/index.html.

