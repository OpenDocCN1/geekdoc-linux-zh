    # Regular Expressions


    Searching for text within files requires the use of regular expressions. Regular
    expressions can be either common regular expressions or extended regular expressions.
    An introduction to both types of expressions can be seen in [Tables A.7](A.7)
    and [A.8](A.8).


    Not all utilities recognize both types of regular expressions, so be sure you
    are using the correct form for whatever you are using.


    Table A.7. Common Regular Expressions


    | COMMAND | EXAMPLE | DESCRIPTION |

    | --- | --- | --- |

    | . | test. matches test1, test2, test3 | Matches any single character |

    | * | test* matches test, tett, testtt | Matches zero or more occurrences of the
    preceding character |

    | ^ | ^test matches any line containing test as the first word | Matches the following
    characters if they are found at the beginning of a line |

    | $ | test$ matches any line containing test as the final word | Matches the preceding
    characters if they are found at the end of a line |

    | \ | test$ matches test$ | Used to escape metacharacters used in other expressions
    |

    | [...] | test[1234] matches test1, test2, test3 and test4[1-4] also produces
    the same results | Matches one character in the specified range of possible characters
    |

    | [^...] | test[^1234] matches test5, test6, test7, and so on. test[^1-4] also
    produces the same | Matches one character not found in the specified range of
    characters |


    Table A.8. Extended Regular Expressions


    | COMMAND | EXAMPLE | DESCRIPTION |

    | --- | --- | --- |

    | ? | test? matches tes, test | Matches zero or one occurrences of the previous
    character |

    | + | test+ matches test, tett, testtt | Matches one or more occurrences of the
    previous character |

    | {} | test{2} matches test {1,4} matches test, tett, testtt | Matches the specified
    number of occurrences of the previous character. Two numbers separated by a comma
    are used to specify a |


    # Environmental Commands


    The environment of your terminal is based on a number of factors, such as what
    you are running, and what customizations you have performed. In-depth customization
    of your shell is quite complex, and entire books are devoted to the subject. Table
    A.9 lists few of the common ways to adjust your working environment.


    Table A.9. Environmental Commands


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | alias | alias NAME=VALUE | Constructs an alias to execute custom commands. (When
    no parameters are specified, current aliases are displayed.) For example: alias=''ls
    -l'' |

    | echo | echo TEXT | Displays the line of text entered as a parameter. (Commonly
    used in shell scripts.) |

    | env | env | Displays exported environment variables. |

    | export | export VARIABLE | Exports the specified variable for use in subsequent
    subshells or command environments. |

    | set | set | Displays environment variables and shell functions. |

    | unset | unset VARIABLE | Removes an environment variable from memory. |


    # Working with Processes


    Interacting with user-level and system-level processes is an important aspect
    of administering Linux. Table A.10 identifies many of the tools used for this
    purpose.


    Table A.10. Commands for Working with Processes


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | at | at TIME COMMAND | Executes a one-time command at the specified time. |

    | bg | bg %JOB | Sends the specified job number to the background. Note: Pressing
    Ctrl+Z will suspend the current foreground process. After the process has been
    suspended, it can be moved to the background using bg. To start a process in the
    back- append an ampersand (&) to the end of the command. For example: `updated
    &` |

    | crontab | crontab [OPTIONS] USERNAME | Used to adjust or view a user''s crontab.
    User crontabs contain commands scheduled for execution on a regular basis. Common
    options include -e Edit user''s crontab -l List user''s crontab |

    | fg | fg %JOB | Brings the specified job number to the foreground. |

    | jobs | jobs | Displays job numbers for all background processes. |

    | kill | kill [SIGNAL] PID | Sends a kill signal to the specified process. Common
    kill signals are SIGHUP (1) Hang-up SIGINT (2) Interrupt SIGTERM (15) Terminate
    (default) SIGKILL (9) Absolute kill |

    | killall | killall [SIGNAL] PROCESS | Sends the specified kill signal to all
    processes using the designated process name |


    # Troubleshooting Tools


    Troubleshooting any operating system can involve a whole suite of specialized
    software. However, sometimes you need a quick tool to report specific aspects
    of your computer. Table A.11 contains some of these utilities found in Linux environments.


    Table A.11. Common Troubleshooting Tools


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | dmesg | dmesg | Displays the kernel ring buffer. |

    | free | free | Displays the amount of free and used memory on the system. |

    | hwinfo | hwinfo | Queries and displays detected hardware. |

    | iostat | iostat [OPTIONS] INTERVAL COUNT | Displays CPU statistics and input/output
    statistics on block devices (hard disks). Common options include -d Print device
    utilization -t Print time for each report -x Print extended statistics |

    | lsof | lsof[OPTIONS] | Lists currently open files. Common options include -b
    Find open files on the specified filesystem mount point |

    | ltrace | ltrace [OPTIONS] COMMAND | Traces library calls made by a process.
    Common options include -c Count time and calls, and return a summary upon completion
    -p Used to attach to a running process |

    | sitar | sitar | Comprehensive reporting tool used to generate a report documenting
    the entire running environment. The report file can be located in /tmp/<SERVER_NAME>
    |


