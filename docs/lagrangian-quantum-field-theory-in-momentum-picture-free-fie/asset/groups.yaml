    # iMonitor


    OES Linux 自带了 iMonitorv2.3。iMonitor 的目标是提供基于 Web 的替代方案，并最终取代许多传统的目录管理和故障排除工具，例如
    DSBrowse、DSTrace、DSDiag 以及大部分 DSRepair。


    iMonitor 不仅能够从 OES 服务器收集信息，还可以从任何版本的 eDirectory 收集信息，包括 NDS 4.11 或更高版本，以及运行在任何支持的平台（NetWare、Windows
    NT/2000、Solaris、Linux 和 Tru64）上的 NDS 或 eDirectory。


    尽管 iMonitor 提供了全树级管理，但它的设计旨在像你过去可能使用的基于控制台的工具一样“深入细节”。它会跟踪运行中的 DSAgent 的所有活动，或者你可以准确获取任何给定时间正在发生情况的状况。


    以下列表列出了 iMonitor 在 OES 中提供的一些主要功能：


    - 通用 eDirectory 任务：此类功能包括搜索 eDirectory 对象(s)、你所在环境中 DirXML 的状态（如适用）、预配置和可自定义的
    eDirectory 报告，以及详细的 eDirectory 错误代码和故障排除参考。

    - iMonitor 代理健康：这包括同步状态、详细的同步信息、已知的 eDirectory 服务器以及此服务器的分区和副本状态。

    - 浏览 eDirectory 代理：这允许你从服务器的角度查看 eDirectory 对象和属性，并查看服务器上的 eDirectory 架构（schema）。

    - 配置 eDirectory：配置分区列表、复制过滤器、后台进程、代理触发器、登录设置、架构和分区同步以及数据库缓存设置。

    - 以服务器为中心的任务：这包括 Web 版本的 DSTrace、简化的 DSRepair 以及后台进程调度器。这些服务仅对运行 iMonitor 的服务器可用。


    如你所见，以前通过基于控制台工具完成的大部分工作现在都可以通过 iMonitor 的 Web 界面完成。


    # 安装 iMonitor


    iMonitor 在安装 OES Linux 期间自动安装。它与 NRM 共享资源；为了访问 iMonitor，必须在服务器上加载 httpptkd 守护进程。新创建的
    httpptkd 守护进程将在运行级别 2 到 5 中启动以实现这一目标。


    安装完成后，你必须使用网络中的计算机或服务器本身的 Web 浏览器访问 iMonitor。要从网络外的 Internet 连接访问 iMonitor，你需要确保通过防火墙将
    TCP 端口 8030 打开到 Web 服务器的 IP 地址。端口 8030 是访问 Web 管理界面的默认端口。如果你愿意，可以更改此端口，因为它不会与
    OES Netware 服务器上的任何其他服务冲突。


    要使用 iMonitor，你必须在 Linux 工作站上使用 Konqueror 或 Mozilla 等 浏览器，或在 Windows 工作站上使用 Internet
    Explorer 或 Netscape。确保你的 浏览器已启用 Java 或 JavaScript。


