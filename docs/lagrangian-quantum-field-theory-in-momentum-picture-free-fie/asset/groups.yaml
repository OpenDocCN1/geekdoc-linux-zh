    ## Instant Access


    ## The Novell Client and OES Linux




    The Novell Client provides NetWare Protocol (NCP) services to client workstations.
    Used in conjunction with the NCP server component of OES Linux, the Novell Client
    allows workstations to log in to eDirectory, map local drives to OES Linux volumes,
    and seamlessly authenticate to OES services.


    The Novell Client provides a single method of accessing files in mixed NetWare
    and OES Linux environments.


    The Novell Client is an optional component that is not required for administration
    of OES Linux.


    ## Installing/Upgrading the Novell Client


    Two Novell Clients are currently available: one for Windows 9x and one for Windows
    XP/2000. The Novell Client for Linux is expected to become available shortly after
    OES ships. Novell Client files may be downloaded from http://download.novell.com
    and installed directly, or copied to any convenient location, such as a network
    server, for installation by any client with existing network access.


    Use the Novell Client Upgrade Agent to periodically check for updated client files.
    When updated files are found, the Upgrade Agent will automatically start the client
    upgrade routine.


    If you upgrading existing Novell or Microsoft clients for OES, you can use the
    Automatic Client Upgrade (ACU) feature to automate this process. Place ACU commands
    in a profile or container login script to detect whether the client software needs
    to be installed, and then the ACU updates the workstation automaticall, if necessary,
    when the user logs in.


    To install the Novell Client from a web server, copy the client files to the web
    server and use the WebIP utility to create a SETUPIP executable that will download
    the Novell Client install files from the web server and launches the client install
    routine.


    ## Configuring the Novell Client


    After installing the Novell Client, you can configure it by using the Novell Client
    properties page. Right-click on the red "N" icon in the system and select Novell
    Client Properties.


    To configure the login for a Novell user, create a login script. Login scripts
    can be associated with Container, Profile, and User objects. A login script can
    control what happens when a user logs into your Novell network. For information
    and syntax on login scripts, see Appendix B, "The Most Essential Commands."


    ## The NICI Client


    ## The Traditional Novell Client


    The Novell Client installation automatically copies all client files to the workstation
    and edits any configuration files that require modification. Although the Novell
