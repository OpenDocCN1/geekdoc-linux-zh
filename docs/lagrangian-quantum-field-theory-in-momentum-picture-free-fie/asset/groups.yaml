    # eDirectory Authorization


    Now that you have accessed the network, you must provide them with access to all
    the resources they need. This also prevents them from accessing resources that
    they do not. It wouldn''t have sensitive documents describing future products
    out to and accessible to anyone. The reality of the corporate world is that some
    resources must be maintained as "need to know."


    Although determining exactly who needs access to what is a decision beyond network
    administrators, Novell eDirectory provides powerful tools for implementing those
    decisions. This discussion discusses eDirectory access control concepts and how
    they work together to provide proper access to objects in the eDirectory tree.


    # Access Control Lists


    Access control lists (ACLs) are stored in each eDirectory object to identify other
    objects that have been granted some sort of control over each. Each object in
    an eDirectory tree maintains two types of attributes. The first set of rights
    is entry rights. Rights define how an object can be manipulated by other directory
    entities, as described in [Table 8.1].


    Table 8.1. Valid Entry Rights in eDirectory


    | ENTRY RIGHT | DESCRIPTION |

    |---|---|

    | Browse | Allows a trustee to discover and view the object in the eDirectory
    tree. |

    | Create | This right applies only to container objects. It allows the trustee
    to create new objects within the container. |

    | Delete | Allows a trustee to delete the object. |

    | Rename | Allows a trustee to rename the object. |

    | Supervisor | Allows a trustee full access to the object and its attributes.
    |


    The second set of rights is property rights. Property rights define how the attributes
    associated with an object can be manipulated. eDirectory property rights are described
    in [Table 8.2].


    Table 8.2. Valid Property Rights in eDirectory


    | PROPERTY RIGHT | DESCRIPTION |

    |---|---|

    | Compare | Allows a trustee to compare or see if an attribute contains a given
    value. |

    | Read | Allows a trustee to read an attribute value. This right confers the Compare
    right. |

    | Write | Allows a trustee to add, delete, or modify an attribute value. This
    right confers the add or delete self right to the attribute. |


    # Provisioning Linux Users


    As mentioned at the beginning of this chapter, not all services support native
    eDirectory authentication. This is especially apparent within the services with
    Linux environments.


    Typical Linux servers provide user authentication for a number of services. Common
    examples of these are local logins, secure shells, Samba, NFS, and HTTP/FTP access.
    Managing user accounts across these access can be the most frustrating part of
    administration! Frankly, OES greatly simplifies this aspect of administration
    through enabling eDirectory as a central storage for all user accounts across
    all services.


    The central component of OES that provides this integration is Linux User Management.


    # Linux User Management


    In a nutshell, Linux User Management (LUM) is a directory-enabled application
    that centralizes the storage and management of user accounts. LUM uses eDirectory
    for the back-end repository of users and therefore benefit from the security,
    scalability, and reliability eDirectory users have to expect.


    LUM extends the capabilities of the Novell Account Management (NAM) software and
    includes the following components:


    - NAM Name Server Switch (libr_nam) redirector This redirector enables user lookup
    through an LDAP connection to eDirectory. This is used to enforce permissions
    when accessing system resources.


    - Command-Line Utilities Many different command-line utilities exist to add to
    Linux administrators. These utilities can be used in place of iManager for basic
    Linux administration. More information on these utilities will be available later
    in this section.


    # LUM-RELATED OBJECTS


    # Chapter 9. OES Clustering Services


    - Instant Access

    - Clustering Benefits

    - Clustering Fundamentals

    - Clustering Terminology

    - Installing Novell Cluster Services

    - Configuring Novell Cluster Services

    - Always-Available File Access

    - Always-Available Network Services

    - Understanding Resource States


    # Instant Access


    # Installing Novell Cluster Services


    - You can install Novell Cluster Services (NCS) for YaST, OES Linux with a license
    for a two-node cluster. Clusters of a larger size require additional licenses,
    which are purchased separately.

    - If you are upgrading an existing NetWare cluster environment to OES Linux, perform
    a rolling conversion by upgrading one node at a time.


    # Configuring Clusters


    - Configure your cluster environment from the Cluster Options page in iMonitor.

    - Cluster-enable a storage pool by selecting New Cluster Pool from the Cluster
    Options page in iManager.

    - Cluster-enable an application or service by creating a new cluster resource
    from the Cluster Options page in iManager.

    - Configure parameters for individual cluster resources in iManager by accessing
    the resource properties of the Cluster Options page.


    # Monitoring Clusters


    - Monitor your cluster environment from the Cluster Management page in iManager.

    - View the status of the cluster and the various cluster resources from the Cluster
    Management page in iManager.


    In order to remain competitive, your organization needs to provide customers and
    employees uninterrupted access to data, applications, websites, and other 24 hours
    a day, 7 days a week, 365 days a year.


    This makes high availability of your organization''s services more than a technical
    issue. It''s a business issue that requires a reliable solution.


    Novell Cluster Services (NCS) is a multinode cluster system for OES Linux that
    is integrated with Novell eDirectory. NCS ensures high availability and management
    of critical network resources including data (server volumes), applications, and
    OES Linux services. NCS supports failover, fallback, and migration (load balancing)
    of individually managed cluster resources.


    # NOTE


    A license for a two-node NCS cluster is included with OES Linux. Licenses for
    additional cluster nodes must be purchased separately from Novell.


    # Clustering Benefits


    NCS allows you to configure up to 32 OES Linux servers into a high-availability
    cluster, resources can be dynamically switched or moved to any node in the cluster.
    Resources can be configured to automatically switch or move to another node in
    the event of a server failure. They can also be moved manually, if necessary,
    to troubleshoot hardware or balance server workload.


    One of the best things about NCS is that it enables you to create a high-availability
    environment from off-the-shelf components. You don''t have to spend millions when
    you create a cluster, and you can add servers to the cluster as your needs change
    and grow over time.


    Equally important is the capability to greatly reduce unplanned service outages
    from server failures of some sort. You can reduce the frequency of planned outages
    for software and hardware maintenance and upgrades because individual nodes can
    be removed from the cluster without affecting service availability to network
    users.


    NCS provides the following advantages over a nonclustered environment:


    - Increased availability

    - Improved performance

    - Low cost of operation

    - Scalability

    - Disaster recovery

    - Shared resources


    Because of these advantages, clustering systems are becoming mandatory for environments
    in which system availability is a must.


    # Clustering Fundamentals


    Suppose you have configured a two-node cluster, with a web server installed on
    each of the nodes. Each of the servers in the cluster hosts two websites. All
    the content for all four websites is stored on a shared disk subsystem connected
    to each of the servers in the cluster. Figure 9.1 shows how such an environment
    might look.


    Figure 9.1. The basic cluster architecture.


    During normal operation, each clustered node is in constant communication with
    the other nodes in the cluster through periodic polling. In this way, a node can
    quickly detect whether something happens to another node in the cluster.


    If node 2 fails due to some hardware or software problems, users currently attached
    to the web server will lose their connections. The IP address associated with
    node 2 and all its services are migrated to node 1. Users would likely reload
    their web pages, which would be available from the new node within a few seconds.


    After the problem in node 2 is located and repaired, it is restarted and automatically
    re-inserts itself into the cluster. Node 1 detects the return of node 2 and seamlessly
    passes back all the addresses and services originally assigned to node 2. The
    cluster returns to its normal configuration without any administrator intervention.

