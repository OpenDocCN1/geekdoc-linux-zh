  md: '# # Configuring the Client


    After you have installed the Novell client software, you can configure the client
    software by modifying its properties. The client properties enable you to specify
    information such as login preferences, protocol settings, default capture settings,
    and so on. To open the client properties pages, right-click the red N in the system
    tray and click Novell Client Properties, which will open the Novell Client Configuration
    options (see Figure 4.10).


