  md: '# # Instant Access


    Using NetStorage


    +   - NetStorage provides a WebDAV server interface for all OES Linux files and
    directories.


    +   - Use any WebDAV-compliant application, such as web browsers, Windows Explorer
    (My Network Places), or Office 2000 to access OES NetWare files and folders.


    +   - NetStorage provides clientless access to iFolder files.


    +   - NetStorage provides the WebDAV support for the NetDrive client.


    # # Working with NetDrive


    +   - NetDrive client is available online by searching for neTDrive http://support.novell.com/filefinder.


    +   - NetDrive supports access to OES Linux files and folders using standard protocols:
    FTP, WebDAV, or iFolder.


    # # Synchronizing Files with Novell iFolder


    +   - Synchronize files between remote clients and a centralized iFolder server,
    so that user data is available anytime, from anywhere.


    +   - Configure and manage iFolder server through the iFolder management console,
    available at https://iFolder server DNS or IP address after iFolder installed.


    +   - Use iFolder client to provide synchronization between the iFolder server
    and regularly used machines.


    +   - If you are using a machine for one-time access, use NetStorage to access
    the iFolder server without having to synchronize all files.


    +   - Use NetDrive to access the iFolder server without synchronizing the entire
    directory. Useful when the desktop application is not WebDAV-aware.


    +   - iFolder access requires that the iFolder server be installed and configured
    prior to use.'
  merge: -1
