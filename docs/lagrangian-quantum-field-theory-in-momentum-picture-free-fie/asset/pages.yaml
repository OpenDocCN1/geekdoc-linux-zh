    the client by going to the iPrint home page on your OES Linux server at http://<server_IP_address
    or DNS_name>/ipp.


    # Defining Print Options


    +   - To tell the printer how to print a job (the paper form to use, format, and
    so on), open iManager and choose Manage Printer. Specify the printer and select
    the Configurations page to change printer configuration.


    # Printing Jobs


    +   - To print files from within an application, simply follow the application''s
    normal printing procedures (making sure the application is configured to print
    to a network printer).


    +   - To cancel or move a print job, open iManager and choose Manage Printer.
    Specify the printer and select Printer Control, Jobs.'
