    In order for the Cluster Manager to report your cluster configuration, you must
    locate and select your cluster object from eDirectory using the Cluster link.
    After you select the object, the Custer Manager page will refresh and display
    information on the current cluster.


    Some of the specific cluster information you can gather from the Cluster Manager
    view includes the following:


    +   - An icon represents each node in your cluster. The yellow disk indicates
    the node that is functioning as the master server in the cluster. The master server
    can change over time due to failover or migration events that take place.


    +   - Epoch indicates the number of times the cluster state has changed. The epoch
    number will increment time a node joins or leaves the cluster.


    +   - The Run Report link provides a detailed report of your cluster. This report
    includes the cluster settings, quorum member information, and load and unload
    scripts.


    +   - In the Cluster State View, each node of the cluster is listed along with
    its node type and associated resource state.


    Table 9.1 describes different resource states you might see in the Cluster State
    View window of the Cluster Manager page in iManager and provides some possible
    actions for each state.


    Table 9.1. Cluster Resource States


    | RESOURCE STATE | DESCRIPTION | ACTION |

    |---|---|---|'
