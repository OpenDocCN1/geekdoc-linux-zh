  md: '# Managing SLES with YaST


    The Yet another Setup Tool (YaST) is the central management console of a SLES
    installation. YaST is available in a graphical version (yast), shown in Figure
    6.7, and a command-line version (yast). Each of these utilities relies on the
    same modular system for managing installed components of SLES. Although the look
    and feel of these modules may change between the graphical and console-based utilities,
    the functionality of these modules is identical across each version.


    Figure 6.7. The Yet another Setup Tool (YaST) utility.


    [View full size image]


    YaST management modules are divided into seven categoriesSoftware, Hardware, System,
    Network Devices, Network Services, Security and Users, and Miscellaneous. Modules
    found within each category can be selected from within the YaST utility itself
    or initiated directly from the command line. To specifically execute a particular
    module starting with YaST, the following command line should be:


    ```

    yast <module_name>

    ```


    TIP


    To retrieve a list of all available YaST modules, use yast.


    Modules used for initial configuration of many of the Novel OES components are
    also found in YaST. These components are all represented in the graphical environment
    with an icon containing a red "N" for Novel. Although many of these modules are
    found in the Network Services category, the actual category where each module
    is found depends on the module in question.


    WARNING'
