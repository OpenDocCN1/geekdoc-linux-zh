  md: '# FTP Server


    Several FTP servers are available for the Linux platform. With SLES, two commonly
    used FTP servers are Pure-FTP (pure-ftpd) and VSFTP (vsftpd). Both of these FTP
    servers are available for SLES distributions and may be installed optimally during
    the OES installation.


    The Pure-FTP is intended to provide fast, lightweight FTP access to a Linux server.
    It offers a focus on tight integration with the Linux kernel and a standards-compliant
    and security-aware design.


    The VSFTP, or Very Secure FTP, is an FTP server that was coded with a focus on
    security. Given the focus of its server, it is the FTP most commonly used with
    SLES and will be the center of this discussion.


    Regardless of the server you select, the purpose of FTP server is to provide a
    means of easily transferring files over network connections. All File Transfer
    Protocol (FTP) servers communicate over TCP/IP and should conform to RFC 959.
    The VSFTP meets these requirements. When the primary VSFTp daemon (vsftpd) is
    started, you can perform file transfers from any client to the OES Linux Server.
    This is normally done by authenticating as a local user to the FTP server. However,
    if you are also using the LUM component of OES, FTP users can be configured for
    redirection back to their Noveldeirect tree. Without LUM, the FTP server will
    be limited to authenticating locally stored users. For more information on LUM,
    please see Chapter 8 "Users and Network Security."


    The VSFTP server is a fully functional FTP server with many features, such as
    those in the following. This section provides basic installation and configuration
    information so that you can use FTP file access with NetDrive.


    +   - xineted-based service management The Internet Server Daemon Extended, or
    xisted, manages the vsftpd process. This allows xineted to provide an additional
    layer of security for vsftpd. As incoming requests are encountered, xineted verifies
    the request, and if allowed, spawns the vsftpd process. With this integration,
    FTP service management is performed via the YaST Network Services (inetd) module.


    +   - Authenticated user access Local user account can be used to provide local
    and LUM users with complete access to private files. These accounts can be locked
    into their home directory through the use of a CHROOT jail.


    +   - Anonymous user access Anonymous user accounts can be set up to provide users
    with basic access to public files. Using a CHROOT jail, anonymous access can be
    locked into a specific directory structure to reduce potential security risks.


    +   - Firewall support If the FTP client is behind a firewall, FTP server supports
    passive mode data transfer and the configuration of a range of passive data ports.


    +   - FTP logs The FTP service maintains a log of several activities, including
    FTP sessions, unsuccessful login attempts, active session details, and system
    error FTP overruled messages.


    For detailed information on all VSFTP server features, see the VSFTP homepage
    at http://vsftpd.beasts.org/


    # Installing FTP Server


    The VSFTP server can be installed as an optional component during the OES Linux
    installation or can be installed later through YaST. To VSFTP using YaST:


    +   1. Access YaST from a terminal using, or from a graphical environment using
    yast2 or the YaST launcher'
