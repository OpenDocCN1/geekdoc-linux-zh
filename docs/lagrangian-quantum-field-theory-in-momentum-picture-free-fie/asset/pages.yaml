  md: "# Environmental Commands\n\nThe environment of your terminal is based on a\
    \ number of factors, such as what you are running, and what customizations you\
    \ have performed. In-depth customization of your shell is quite complex, and entire\
    \ books are devoted to the subject. Table A.9 lists few of the common ways to\
    \ adjust your working environment.\n\nTable A.9. Environmental Commands\n\n| COMMAND\
    \ | GENERAL USAGE | DESCRIPTION |\n| --- | --- | --- |\n| alias | alias NAME=VALUE\
    \ | Constructs an alias to execute custom commands. (When no parameters are specified,\
    \ current aliases are displayed.) \n\nFor example:\nalias='ls -l' | |\n| echo\
    \ | echo TEXT | Displays the line of text entered as a parameter. (Commonly used\
    \ in shell scripts.) |\n| env | env | Displays exported environment variables.\
    \ |\n| export | export VARIABLE | Exports the specified variable for use in subsequent\
    \ subshells or command environments. |\n| set | set | Displays environment variables\
    \ and shell functions. |\n| unset | unset VARIABLE | Removes an environment variable\
    \ from memory. |"
