  md: '# How Identity Manager Works


    Identity Manager Bundle Edition allows to link your disparate network data sources
    together using Novell eDirectory as the central repository for sharing data, as
    shown in Figure 10.1.


    Figure 10.1. Logical architecture of IdentityManagerHub and Spike.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_185_0.png)


    The Identity Manager architecture consists of several components that work together
    to achieve effective data and password synchronization:


    +   - Identity Manager Engine Running on OES Linux, the Identity Manager engine
    functions as the communications hub that provides data and password synchronization
    between your central eDirectory tree and any participating external systems. The
    Identity Manager uses Extensible Markup Language (XML) to create objects of any
    event data. It then applies a set of rules to determine if, and how, the data
    modifications are sent to participating systems. The centralized Identity Manager
    engine sure that data events are processed consistently throughout your network.


    +   - Identity Manager Drivers Customized to system that will participate in Identity
    Manager synchronization, the Identity Manager drivers act as communications "spokes"
    or channels between your central eDirectory tree and any participating external
    systems. Identity Manager drivers are configured to subscribe to data changes
    in the central eDirectory tree, and publish data changes that occur locally to
    the central eDirectory tree. This publish/subscribe model gives you complete control
    over the nature and direction of data synchronization.


    NOTE


    To simplify configuration, Identity Manager Bundle Edition provides configuration
    files that you can import into a driver installation to automatically set up driver
    rules, filters, and transformation documents that dictate what data from this
    system should be exchanged with other systems and how this data should be exchanged.'
  merge: -1
