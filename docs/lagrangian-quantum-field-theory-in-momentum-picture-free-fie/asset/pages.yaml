  md: '# # Novell QuickFinder


    Although QuickFinder isn''t a required web service for OES Linux, it is all making
    your web resources available to employees and customers as quickly and accurately
    as possible. Supporting everything from simple internal search to complex search
    services that you can offer to organizations for a fee, QuickFinder is one of
    the fastest and most accurate search engines currently available.


    Novell QuickFinder, previously called Novell Web Search, offers a powerful, full-text
    search engine that you can use to add search capabilities to your Network or internet
    websites. These capabilities can be integrated into Apache Web Server environment
    through custom search forms and search result pages. These pages can be created
    from scratch or based on one of the included page templates.


    This section introduces you to QuickFinder and its basic installation and configuration.
    However, for comprehensive information, the OES Linux online documentation.


    # ## QuickFinder Capabilities


    With Novell QuickFinder, you can


    +   - Support searching multiple-language indexes from a single interface

    - Host search services for multiple organizations

    - Organize collections of related files from diverse sources as a single document

    - Create custom search, print results, error and response messages and apply them
    to individual searches or across all supported languages

    - Gather customer metrics by reviewing searches to identify what your customers
    look for the most

    - Improve employee productivity by helping them find information more quickly


    # ## Installing QuickFinder


    Novell QuickFinder can be installed on a dedicated server using the Novell QuickFinder
    Server installation pattern or as an optional component during a custom OES Linux
    installation. QuickFinder can also be installed after the fact through YaST.


    To install QuickFinder using YaST, complete the following steps:


    +   1. Access YaST from a terminal using yast, or from a graphical environment
    using vast2 or the YaST launcher from the application menu.

    2. Select the Network Services in YaST. From this category, locate and select
    the Novell QuickFinder module. This module will detect the RPMs for QuickFinder
    are missing and ask if you want to install them. Select Continue to install the
    necessary packages.

    3. At the conclusion of the software installation, SoConfig is executed to update
    the system configuration. When this completes, the configuration of the OES component
    will begin automatically.'
  merge: -1
