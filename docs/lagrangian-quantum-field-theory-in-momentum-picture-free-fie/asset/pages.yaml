  md: "# # Working with Processes\n\nInteracting with user-level and system-level\
    \ processes is an important aspect of administering Linux. Table A.10 identifies\
    \ many of the tools used for this purpose.\n\nTable A.10. Commands for Working\
    \ with Processes\n\n| COMMAND | GENERAL USAGE | DESCRIPTION |\n| --- | --- | ---\
    \ |\n| at | at TIME COMMAND | Executes a one-time command at the specified time.\
    \ |\n| bg | bg %JOB | Sends the specified job number to the background.\n Note:\
    \ Pressing Ctrl+Z will suspend the current foreground process. After the process\
    \ has been suspended, it can be moved to the background using bg. To start a process\
    \ in the back- append an ampersand (&) to the end of the command. For example:\
    \ `updated &` |\n| crontab | crontab [OPTIONS] USERNAME | Used to adjust or view\
    \ a user's crontab. User crontabs contain commands scheduled for execution on\
    \ a regular basis. Common options include -e Edit user's crontab -l List user's\
    \ crontab |\n| fg | fg %JOB | Brings the specified job number to the foreground.\
    \ |\n| jobs | jobs | Displays job numbers for all back- ground processes. |\n\
    | kill | kill [SIGNAL] PID | Sends a kill signal to the specified process. Common\
    \ kill signals are SIGHUP (1) Hang-up SIGINT (2) Interrupt SIGTERM (15) Terminate\
    \ (default) SIGKILL (9) Absolute kill |\n| killall | killall [SIGNAL] PROCESS\
    \ | Sends the specified kill signal to all processes using the designated process\
    \ name |"
  merge: -1
