  md: '# Setting Up a Secure Printing Environment


    iPrint is designed to take full advantage of eDirectory security and ease of management.
    Setting up a secure printing environment can be done on two ways:


    +   * Print access control Create a secure printing management infrastructure
    by assigning users to User, Operator, or Manager roles. This restricts the list
    of those who can control printers, iPrint Managers, and Driver Stores.


    +   * Securing iPrint with SSL This option not encrypts print communications over
    the wire, but also requires users to authenticate before installing and printing
    to a printer.


    These levels are discussed in the following sections.


    # Print Access Control


    Print security is ensured through the assignment of the Manager, Operator, and
    User Access Control roles, and by the strategic placement of printers and printer
    configurations. For more information on eDirectory access control in general,
    see Chapter 7.


    The access controls for iPrint allow you to specify the access each User, Group,
    or Container object will have to your printing resources. It is important to remember
    that all iPrint print function independently. For example, assigning as a printer
    manager does not automatically grant said person rights of a printer user.


    In most cases, the default assignments will prevent any problems that this role
    independence might cause. For example, a manager is automatically assigned as
    a printer operator and user for printer. Similarly, a printer operator is automatically
    assigned as a user of that printer as well. You cannot remove the user role from
    an operator, and you cannot remove the operator and user roles from a manager.


    The creator of an iPrint object is automatically assigned to all supported roles
    for the type of object being created.


    You can assign multiple Printer objects to a given printer agent, but simultaneously
    make different access control assignments to each Printer object. This means that
    users in different containers can be assigned trustee rights to the same printer.


    # PRINTER ROLES


    As previously alluded, three roles are associated with iPrint printing services:
    Manager, Operator, and User. Table 13.3 describes the rights granted to each role.


    Table 13.3. NDPS Print Roles and Their Associated Rights


    | ROLE | ASSOCIATED RIGHTS |

    | --- | --- |

    | Manager | Tasks performed exclusively by the printer manager are those that
    require the creation, modification, or deletion of Printer objects, as well as
    other eDirectory administrative functions. Printer managers are automatically
    designated as printer operators and users as well, so they can perform all tasks
    assigned to the operator role. Typical manager functions include the following:'
