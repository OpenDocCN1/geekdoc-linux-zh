  md: '# Installing Remote Loaders and Drivers


    With the Identity Manager installed, you are ready to start configuring your Identity
    Manager environment. The first step in doing this is to make sure the Remote Loader
    is installed on all systems that will use it. For both Active Directory and NT
    synchronization, the Identity Manager driver and Remote Loader must be installed
    on an appropriate Domain Controller. The Domain Controller should have the following
    characteristics:


    +   - Active Directory Domain Controller running Windows 2000 Server with Support
    Pack 1 and Internet Explorer 5.5 or later

    - NT Domain Primary Domain Controller (PDC) running Windows NT 4 with Service
    Pack 6a or later


    To install Remote Loader and Identity Manager driver on a Windows 2000 server
    running Active Directory, complete the following steps. For more information on
    performing the same type of installation on an NT 4 server, see the OES online
    documentation.


    +   1. At the Windows 2000 server that will host the driver, insert the Identity
    Manager Bundle Edition CD-ROM. After a few minutes, the Identity Manager Bundle
    Edition Installation screen will appear. Click Next.


    +   2. At the License Agreement screen, select the appropriate language to view
    the license agreement. When you have reviewed the agreement, click I Accept.


    +   3. If necessary, review the Identity Manager pages. Click Next to continue
    to the next overview page, and then Next to continue the installation.


    +   4. At the Components screen, deselect DirXML Server, DirXML Web Components
    and Utilities. Then select DirXML Connected System, to install the Identity Manager
    Remote Loader and Drivers, and click Next.


    +   5. At the Location screen, select the path to where the Remote Loader will
    be installed, and click Next. It is usually best to just accept the default path.


    +   6. At the Select Drivers for Remote Loader Install screen, select the Remote
    Loader Service and the DirXML Driver for Active Directory, and then click Next.


    +   7. Review the information on the Installation Summary screen, and click Finish.
    You may see a warning about LDAP connections. If so, click OK to close the message
    box.


    +   8. At the Shortcut screen, click Yes. This will create a shortcut on your
    Windows desktop to the DirXML Remote Loader Console.


    +   9. At the Installation Complete screen, click Close.


    +   10. Launch the Identity Manager Remote Loader Configuration Wizard using dirxml_remote.exe
    found in the directory specified in step 5, typically c:\NovellRemote.Loader.
    At the Welcome page, click Next.


    +   11. At the Command Port screen, click Next. This port will be used by this
    instance of the remote loader to listen for Identity Manager activity. Novell
    recommends the default port.


    +   12. At the Configuration File screen, click Next. This is the name and location
    of the log file that will be used to record Remote Loader configuration options.


    +   13. At the DirXML driver screen, select Native and make sure ADDDRIVER.DLL
    is listed in the drop-down'
