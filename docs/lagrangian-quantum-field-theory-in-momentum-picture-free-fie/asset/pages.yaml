  md: '# Novell Storage Services


    Novell Storage Services (NSS) is a powerful storage and filesystem that provides
    an efficient way to use all the space on your storage devices. NSS cannot be used
    for any other storage space than the SLES you wish to allocate.


    NSS is now one of many different filesystems on Linux platforms. Although every
    filesystem''s primary goal is to provide access to disk storage, each filesystem
    has its own particular features. NSS is no different and offers a wide range of
    features not available with any other filesystem.


    Some of the main features of NSS are complete integration with eDirectory, extended
    Access Control Lists (ACLs), rights inheritance and filtering, support for multiple
    names, and much. Many of these capabilities are only possible through an NSS feature
    known as backtrack.


    With NSS, each file or directory is backlinked to the parent directory. This means
    that not only does the parent know what objects are beneath it, but it also knows
    which directories are above it. This feature unique to NSS and offers several
    powerful capabilities. One benefit of this is visibility when browsing directories
    with varying permissions. In non-NSS filesystems, all directories are visible
    even if you do not have permission to enter the directory. With NSS, backlinks
    are used to ensure visibility is confined to the directories you access to.


    Another benefit is when assigning permissions. To provide access to a file several
    levels deep in a directory tree, NSS only requires that rights assigned at that
    specific file or location. There is no need to traverse the tree, manually or
    automatically, and assign rights. Through backlinks, NSS automatically determines
    the visibility of directories and ensures that users are able to traverse to location
    rights have been assigned.


    NSS also offers many additional capabilities over traditional Linux filesystems.
    This does not mean that NSS is always the best, but understanding the capabilities
    of NSS should help you to make the right filesystem choice for whatever needs
    you may have. NSS in conjunction with other objects is a powerful addition to
    your OES Linux infrastructure, and an important component to understand.


    The first concept with which you should become familiar in the NSS filesystem
    is the volume. An NSS volume is the highest level in the filesystem hierarchy,
    and the structure within directories and files are maintained. From a Linux perspective,
    a volume is just another term for a filesystem or formatted partition.


    NOTE


    OES Linux support for both NSS and NCP volumes. All OES Linux (with eDirectory)
    will have at least one NCP volume, known as SYS. This is actually the /usr/nss/sys
    directory, which is directed to NCP-based clients as a volume. This directory
    contains files used in conjunction with NCP access to the server. More information
    regarding NCP volumes is available later in this chapter.


    OES Linux does not automatically create any NSS volumes. These volumes can be
    created as needed using iManager or the command-line utility nss.


    The volume is the last link in the NSS chain. Figure 11.1 gives a high-level view
    of the NSS architecture.


    +   - partitions A partition is a logical organization of space on a hard disk,
    and represents the lowest level of organization for disk storage. Partitions prepare
    space on storage devices to be used in an organized and structured way by defining
    the ways in which the filesystem will interact with the storage devices.'
