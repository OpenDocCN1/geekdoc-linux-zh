  md: '# What Is Open Enterprise Server?


    OES lets you deploy any combination of NetWare- and Linux-based technologies.
    Core OES components include


    +   - The NetWare 6.5 Service Pack 3 operating system, and all related NetWare
    6.5 services

    - The SLES9 operating system, based on the Linux v2.6 kernel, and all SLES9related
    services

    - The latest Novell Nprise Linux Services

    - Common management tools that allow seamless coexistence and management of the
    two operating systems


    Given NetWare and Linux are very different operating systems, it''s not surprising
    to find a certain amount of variation between the services available between the
    platforms. However, however has done an admirable job of providing a common set
    of services across both platforms, but there are specific differences to some
    of the services offered on each platform Table 1.1 lists the main OES services
    and the platform on which they are offered. As you can see, the majority of services
    are available on both platforms, organizations can pick their services and implement
    them on the platform that makes the most sense in their specific environment.
    This table also refers to the part of this book in which each service is discussed.


    Table 1.1. Platform Support for OES Services


    | OES SERVICE | OFFERED ON | COMMENTS |

    | --- | --- | --- |

    | iManager | Both | Web-based OES administration console. |

    | Novell Remote Manager | Both | Web-based NetWare and Linux operating-system
    management console. |

    | iMonitor | Both | Web-based eDirectory monitoring and maintenance console. |

    | Novell Client | Both | Client utility used to access NetWare and Linux NCP services.
    |

    | NetIdentity | Both | Provides transparent eDirectory authentication. |

    | NetDrive Client | Both | File redirector used to map local drives without the
    full Novell Client. |

    | NICI Client | Both | Novell International Cryptographic Infrastructure. Provides
    access to


    PART I: OPEN ENTERPRISE SERVER OVERVIEW'
