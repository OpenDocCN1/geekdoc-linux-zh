  md: '# Managing eDirectory


    When you have an understanding of the basics of eDirectory architecture and design,
    it is important to understand the activities and tools necessary to maintain eDirectory
    on a day-to-day basis.


    As the rest of OES Linux, eDirectory management is performed through web-based
    tools. Specifically, comprehensive eDirectory management is available through
    iManager and iMonitor. For information on installing and configuring both iMonitor
    and iManager, see Chapter 5, "OES Management Tools."


    iManager provides comprehensive role-based management capabilities for the OES
    Linux environment. iMonitor monitors the monitoring and data-gathering aspects
    of several terminal-based tools, including ndrace and dsrepair. Each includes
    the object viewing and reporting functionality of the NetWare-only utilities,
    DSBrowse and DSDag. The iMonitor interface is shown in Figure 7.8.


    Figure 7.8. The iMonitor interface.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_133_0.png)


    iManager provides a complete set of eDirectory management tools and functions
    for object, partition, and replica operations. Much of this functionality is also
    available from the Partition and Replica view in ConsoleOne. As mentioned in Chapter
    5, although ConsoleOne is not provided with OES Linux, this utility can still
    be used in existing infrastructures or specifically downloaded from download.novell.com.
    You can also use SSH for remote access to a server terminal, from which you can
    run several eDirectory-specific terminal-based utilities.


    This section gives you an overview of common eDirectory tasks and the tools used
    to perform them. eDirectory management tasks can be organized into six main categories:


    +   * Partition operations

    * Replica operations

    * Tree operations

    * eDirectory repair'
