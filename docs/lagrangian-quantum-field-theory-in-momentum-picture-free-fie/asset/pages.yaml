  md: '# Repairing eDirectory with DSRepair


    Every database needs a tool for repairing inconsistencies when they occur. DSRepair
    has been serving in its capacity as long as eDirectory has. Even Novel is shifting
    his focus toward web-based tools, DSRepair is still essential for working on your
    eDirectory on a day-to-day basis. DSRepair offers three main groups of features:


    +   - Unattended full repair

    - eDirectory monitor operations

    - eDirectory repair operations


    To load DSRepair on your Linux server, execute ndsrepair at the server console.
    This utility requires at least one startup switch to determine what operation
    will be performed. These startup switches can be confusing at first, but the page
    and usage sections are available to help with command syntax. To access the ndsrepair
    utility with the -help startup option, as shown in Figure B.4.


    Figure B.4. The ndsrepair–help screen.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_298_0.png)


    All DSRepair operations and results can be logged to a file for review. The default
    log file is /var/ndsrepair.log. The ndsrepair utility also supports a startup
    option (-F) used for configuring the name and location of this log file.


    The following three sections describe the features available in each of the three
    main categories of DSRepair operations: Unattended Full Repair, eDirectory Monitor
    Operations, and eDirectory Repair Operations.


    # Unattended Full Repair (ndfr U)


    The Unattended Full Repair (UFR) is probably the most-used feature in DSRepairalthough
    the huge database sizes now being supported by eDirectory might change that. UFR
    checks for and repairs most non-critical eDirectory in the eDirectory database
    of a given server. UFR is activated by executing ndsrepair with a U startup parameter.


    The UFR performs primary operations each time it runs, none of which require any
    intervention by the administrator. These operations are described in Table B.2.
    During some of these, the local database is'
