  md: "# Configuring an Identity Manager Driver\n\nNow that all the Identity Manager\
    \ components are in place, you can do the actual Identity Manager driver configuration.\
    \ This is done through the iManager plug-ins for Identity Manager that were previously\
    \ installed. You can use ConsoleOne to the Identity Manager configuration if desired.\n\
    \nTo simplify the configuration process, you can import the preconfigured driver\
    \ settings that you have copied to your systems as part of the Identity Manager\
    \ installation process. Before to import a preconfigured Identity Manager driver,\
    \ complete the following steps:\n\n+   1. Launch iManager from the server where\
    \ the Identity Manager plug-ins have been installed.\n\n+   2. Open the DirXML\
    \ Utilities link in the Navigation frame and click Import Drivers.\n\n+   3. Select\
    \ the radio button next to In New Driver Set, and click Next.\n\n+   4. Provide\
    \ the required information and click Next.\n  - Name a Name for the driver set.\n\
    \  - Context Specify the context in which you want the driver set object to be\
    \ created.\n  - Server Specify the server object on which Identity Manager is\
    \ installed.\n  - Create a New Partition on this Driver Set Selecting this option\
    \ will create a new directory partition in which Identity data will be stored,\
    \ where it can be isolated from the rest of the day-to-day directory activity.\
    \ Novell recommends that you configure Identity Manager in this way.\n\n+   5.\
    \ Select the specific driver configuration file you want to import and click Next.\
    \ You can select multiple drivers, if desired.\n\n+   6. Provide the required\
    \ information to configure the driver and click Next. If you have selected multiple\
    \ drivers, you will have to fill out the appropriate configuration information\
    \ for each driver. For more information on the specific information requested\
    \ by each driver type, see the OES online documentation.\n\n+   7. Provide the\
    \ required information to configure administrative rights for the Identity Manager\
    \ driver and click Next.\n\n+   - Click Define Security Equivalence, add Admin,\
    \ and click OK. This grants the Identity Manager driver security equivalence to\
    \ Admin in eDirectory so that sufficient rights are granted the driver to perform\
    \ its synchronization operations.\n\n+   - Exclude Administrative Roles, add Admin,\
    \ and click Next. You should add any objects with administrative roles to this\
    \ list to avoid problems with similar objects that may exist in other directories.\
    \ Typically, administrative roles are specific to a directory tree and don't need\
    \ to be synchronized.\n\n+   8. At the summary screen, click Finish. You can also\
    \ click Finish with Overview if you want to view a synopsis of the driver's settings,\
    \ as shown in Figure 10.4.\n\nFigure 10.4. Identity Manager (DirXML) Overview\
    \ screen."
