  md: '# # Common Post-Installation Tasks for OES Linux


    After the installation of OES Linux has been completed, there are a number of
    tasks you are likely anxious to perform. The majority of these tasks are documented
    in the relevant chapters of this book. However, there are a few basic tasks that
    are appropriate to mention here.


    The following topics are contained in this section:


    +   - Verifying your OES Linux installation

    - Post-install OES component configuration

    - Updating OES Linux components using Red-Carpet


    # ## Verifying Your OES Linux Installation


    Depending on the OES components you selected for installation, there are a number
    of methods you can use to confirm that the installation was successful. The easiest
    way to confirm that your OES components are properly configured and started is
    by accessing the OES Linux Welcome pages.


    To access the Welcome pages, use a browser to access the following URL:


    http://<OES_Linux_Server_IP_Address_Or_DNS_Name>


    If your OES installation was successful, you should see the Welcome pages as shown
    in Figure 2.8.


    **Figure 2.8. OES component Welcome pages.


