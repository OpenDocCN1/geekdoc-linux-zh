  md: '# Compression Utilities


    Compression utilities are a necessity in a Linux environment. Table A.12 contains
    a list of the main tools used in compression tasks.


    Table A.12. Compression Utilities


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | gzip | gzip FILE | Utility used to compress files. (Commonly used to compress
    tar archives.) Files compressed with gzip usually have a .gz extension. |

    | gunzip | gunzip FILE.gz | Utility used tocompress files. (Same as gzip -d.)
    |

    | bzip2 | bzip2 FILE | Utility used to compress files. (Utilizes a different algorithm
