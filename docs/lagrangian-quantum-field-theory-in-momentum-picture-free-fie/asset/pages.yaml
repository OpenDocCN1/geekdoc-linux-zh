  md: '# Network Professional Association


    If you''ve achieved, or are working toward, your CNE certification, you might
    want to join the Network Professional Association (NPA). The NPA is an organization
    for network computing professionals, including those who have certified as networking
    professionals in Novell, Microsoft, Cisco, and other manufacturers'' products.
    Its goal is to keep its members current with the latest technology and information
    in the industry.


    If you''re a certified CNE, you can join the NPA as a full member. If you''ve
    started the certification process, but are not finished yet, or if you''re a CNA,
    you can join as an associate member (which gives you all the benefits of a full
    member except for the right to vote in the NPA''s elections).


    When you join the NPA, you can enjoy the following benefits:


    +   - NPA chapters (more than a hundred worldwide) that hold regularly scheduled
    meetings that include presentations and hands-on- demonstrations of the latest
    technology

    - A subscription to Network Professional Journal

    - Access to NPA Labs that contain up-to-date technology and software for hands-on
    experience

    - Job postings

    - NPA''s own professional certification programs

    - Discounts or free admission to major trade shows and conferences, including
    NPA''s own conferences


    For more information on the NPA, visit the website:


    http://www.npanet.org'
