  md: '# Novell NetDrive


    Novell NetDrive enables you to map a network drive to any OES Linux server without
    using Novell client software. This means that with NetDrive, you can access and
    modify your files from any workstation using an Internet connection. After a network
    drive is mapped, the drive you assigned during the mapping appears in Windows
    Explorer and functions just like those mapped through Novell. Basically, the capability
    to map drives has been extracted from the Novell client where it can be used independently
    of all the Novell client features. For more information on the Novell client,
    see Chapter 4. "OES Linux Clients."


    # NetDrive Prerequisites


    NetDrive runs on any Windows workstation, including Windows 95/98/Me and Windows
    XP/2000/NT. You need only 2MB of available space on your hard drive to install
    and run the NetDrive client.


    # WARNING


    If you are installing the NetDrive client on a Windows 95 workstation, make sure
    you have installed the Winsock 2 update from Microsoft. It is available on the
    Microsoft website.


    NetDrive supports three protocols for accessing network files:


    +   - WebDAV NetDrive integrates with NetStorage to provide a comprehensive file
    access solution with little client overhead. NetStorage must be installed and
    configured prior to using NetDrive with WebDAV.


    +   - FTP NetDrive can access network files using the standard File Transfer Protocol
    (FTP). An FTP server must be installed and configured on your network before using
    NetDrive with FTP. With OES, you can use one of the optimal FTP servers, described
    later in this chapter, to provide this type of access.


    +   - iFolder NetDrive can access files from your directory to the iFolder server.
    iFolder must be installed, and your iFolder account configured, prior to using
    NetDrive with iFolder.


    The choice of protocol depends largely on your network environment. One is not
    preferable to another. Use the protocol that fits your network strategy.


    # Using NetDrive


    The latest version of the NetDrive client is available by searching on netrive
    at http://support.novell.com/finder. If you need help installing the NetDrive
    client, see Chapter 4.


    With the NetDrive client installed, you can access files on any OES Linux servers
    using standard Internet protocols. However, not every protocol is supported on
    every version of Windows.


    +   - iFolder Windows NT and XP/2000

    - FTP Windows 95, 98, NT, and XP/2000

    - WebDAV (HTTP) Windows 95, 98, NT, and XP/2000'
  merge: -1
