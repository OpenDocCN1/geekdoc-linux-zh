  md: '# Monitoring SLES with Health Monitoring Services


    An important aspect of managing SLES is simply being aware of how your server
    is performing. OES Linux reduces the complexity of this through leveraging the
    capabilities of Web-Based Enterprise Management (WBEM). WBEM is a standard, Internet-based
    technology designed to configure the various tasks of enterprise management. Through
    WBEM, Health Monitoring Services (HMS) can be used to easily monitor many important
    server health-factors including CPU utilization, memory running processes, and
    network utilization.


    OES Linux uses the Common Information Model Object (CIM) daemon, from the OpenWBEM
    project, to manage the health monitoring environment. The CIMOM daemon performs
    this function by one or more Providers that conform to WBEM standards. These Providers
    facilitate the gathering of SLES and OES statistics used by HMS. For administrative
    information, this is configured in iManager you can easily keep tabs on your server
    health while performing day-to-day administrative routines.


    One of the greats about HMS is its potential for future capabilities. This is
    the first release of HMS and is geared at monitoring essential health-related
    information. In future releases, system alerts and robust analysis should further
    enhance the capabilities of HMS and make this one of the most important server
    monitoring tools in your arsenal.


    # Installing HMS


    Health Monitoring Services can be installed as an optional component during the
    OES Linux installation. HMS can also be installed later through YaST.


    # NOTE


    Basic server health is available for any server throughout your organization,
    but for complete health monitoring, Health Monitoring Services must be installed
    on all your OES Linux servers.


    To install Health Monitoring Services using YaST, complete the following steps:


    +   Access YaST from a terminal using yast, or from a graphical interface using
    yast or the YaST launcher from the application menu.


    +   Select the Network category in YaST. From this category, locate and select
    the Novel Health Monitoring module. This module will detect the RPMs for HMS and
    ask if you want to install them. Select Continue to install the necessary packages.


    +   At the conclusion of the software installation, SuConfig is executed to update
    the system configuration. When this completes, the configuration of the OES component
    will begin automatically.


    +   At the Novell Health Monitoring LDAP Server Configuration screen, enter the
    following information and click Next to complete the installation:


    +   Local or Remote Directory Server Select the radio button that indicates whether
    eDirectory is running on the local server or a remote server.


    +   Directory Server Address If a remote eDirectory server is in use, enter the
    IP address for this server.


    +   Admin Name Enter the eDirectory administrator''s credentials using fully qualified
    dot notation, for example, cn=admin.o.novel


    +   Admin Password Enter the password for the administrator user.'
