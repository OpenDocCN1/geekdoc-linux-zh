  md: "# Updating OES Linux\n\nYaST provides several modules for installing and updating\
    \ software on a normal SLES server. However, after installing OES, the Red-Carpet\
    \ software management system should be used. This is true when installing updates\
    \ to both OES components and the core operating system.\n\nNOTE\n\nTo prevent\
    \ SLES updates, which may not be aware of OES components, the normal YaST Online\
    \ Update (YOU) utility is disabled during the OES installation. It is still possible\
    \ to manually execute the terminal-based YOU. This can potentially cause severe\
    \ corruption and should be avoided.\n\nThe Red-Carpet software management system\
    \ is made up of the following two basic components:\n\n+   - Red-Carpet daemon\
    \ (rcd) This daemon receives commands from the Red-Carpet client and follows those\
    \ instructions to perform tasks such as updating installed components. If necessary,\
    \ the startup script /etc/init.d/rcd can be used to stop or restart the rcd daemon.\n\
    \n Red-Carpet client The portion of Red-Carpet is the interface administrators\
    \ to subscribe to software updates, and to determine which updates will be applied\
    \ to the local server.\n\n Two Red-Carpet clients ship with OES:\n    - rug Terminal-based\
    \ client, which is installed by default with OES.\n    - red-carpet Graphical\
    \ client, which is an optional component during an OES installation.\n\nWARNING\n\
    \nIn the shipping version of OES, the graphical red-carpet utility was not working\
    \ as expected. Novell recommends that you use the command-line rug utility to\
    \ update OES until the fix for red-carpet is made available. When the patch is\
    \ available, the rug utility will apply it and the red-carpet graphical client\
    \ can then be used safely.\n\nFor the Red-Carpet process to work, a ZENworks Linux\
    \ Management (ZLM) server must be added as a known service to the red configuration.\
    \ After a successful installation of OES, you should already have a known service\
    \ for the Novell Update Service (https://update.novell.com/data). This can be\
    \ confirmed using the command-line rug utility as the following:\n\n```\n# rug\
    \ service-list\n```\n\nThis command should display an entry for the Novell Update\
    \ Service. If no entries are displayed, the Novell Update Service can be manually\
    \ added to your Red-Carpet configuration using the following:\n\n```\n# rug service-add\
    \ https://update.novell.com/data\n```\n\nThe red-carpet utility can also be used\
    \ to check for, and if necessary, add the Novell Update Service. These options\
    \ are found under the Edit, Services menu item of the red-carpet utility."
  merge: -1
