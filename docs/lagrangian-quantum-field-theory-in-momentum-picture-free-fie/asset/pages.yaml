  md: '# Instant Access


    Open Enterprise Server (OES) incorporates the best of both open source and enterprise
    network operating systems: NetWare 6.5, and SUSE Linux Enterprise Server 9 (SLES),
    with a common set of services, applications, and management tools. Not only does
    this provide value to customers, but it keeps them from being locked into a single-technology
    foundation.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Why Open Enterprise Server?


    Novell''s Open Enterprise Server (OES) is a secure, highly available information
    platform that provides powerful networking, communication, collaboration, and
    application services in an open environment. As network operating systems have
    become increasingly commoditized, Novell has recognized the way to provide value
    to its customers is not to lock them into a single-technology foundation. To that
    end, OES incorporates the best of both open-source and enterprise network operating
    systems: NetWare 6.5, and SUSE Linux Enterprise Server 9 (SLES), with a common
    set of services, applications, and management tools.


    With the release of OES, organizations can choose NetWare, SUSE Linux, or a combination
    of both platforms, as dictated by real business needs. Moreover, common management,
    directory, and upgrade utilities allow organizations to manage both platforms
    with a single set of tools, simplifying daily administration.


    With OES, Novell demonstrates its commitment to its traditional NetWare customers
    while embracing the power and new opportunity represented by Linux and the Open
    Source movement.'
  merge: -1
