  md: '# Appendix B. eDirectory Reference Materials


    eDirectory is an extremely complex environment. Fortunately, it is largely self-sufficient.
    Most of the day-to-day tasks of maintaining and protecting directory data are
    handled automatically and transparently. Not only does eDirectory have built-in
    integrity features, but it also employs several background processes that keep
    the directory environment stable and healthy.'
  merge: -1
  pgno: 290
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 291
- img_proc: true
  md: '# eDirectory Background Processes


    This section provides a look at the main background processes that do all the
    heavy lifting associated with eDirectory operations. These processes are


    +   - Database initialization

    - Flat cleaner

    - Janitor

    - Replica sync

    - Replica purger

    - Limber

    - Backlinker

    - Schema sync

    - Time sync


    When you use the various eDirectory monitoring and repair tools, of which some
    were discussed in Chapter 7, "Novell eDirectory Management," and more are discussed
    later in this appendix, these background processes and their effects are what
    you monitor and repair. For this reason, it''s a good idea to know a little bit
    about what you are looking at.


    # Database Initialization


    The Database Initialization (DB Init) background process is automatically initiated
    whenever the file system is mounted on the eDirectory server. It executes whenever
    the eDirectory database is opened or when eDirectory is reloaded. DB Init is responsible
    for


    +   - Verifying the usability of the eDirectory database files on this server

    - Scheduling the running of other eDirectory background processes

    - Initializing the various global variables and data structures used by eDirectory

    - Opening the eDirectory database files for use by the version of eDirectory running
    on this server'
  merge: -1
