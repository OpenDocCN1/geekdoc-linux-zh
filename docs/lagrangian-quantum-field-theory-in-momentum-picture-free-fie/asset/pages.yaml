  md: '# NetIdentity


    The NetIdentity agent leverages what is known as the XTier framework used with
    NetStorage, Apache, and Tomcat services to provide single sign-on across all Novell
    services that use eDirectory authentication. The only caveat to is that the first
    service with which a user authenticates must be NetIdentity-enabled. The list
    of NetIdentity-enabled services includes the following:


    +   - Novell Client (v3.4x for Windows 9x and v4.9x for Windows XP/2000)

    - iFolder 2.x

    - iPrint

    - NetStorage

    - Novell Portal Services


    When you have authenticated with one of these services, accessing any other service,
    such as iManager, that uses eDirectory authentication will prompt a transparent,
    background authentication so that you aren''t required to re-enter your authentication
    information.


    To enable NetIdentity-based single sign-on on Novell services, complete the following
    tasks:


    +   - Make sure that the XTier framework is installed on all OES NetWare servers
    to which users will authenticate.

    - Install the NetIdentity Agent on the workstation where you want NetIdentity
    services enabled.


    The XTier framework is installed automatically when you install NetStorage, Apache,
    and Tomcat services. It cannot be selected and installed separately, so if you
    want to use NetIdentity, install one or more of these services on your OES Linux
    server prior to continuing. If you are using XTier installed on a given server,
    point your browser to the following:


    ```

    http://<server IP or DNS name>/oneNet/xtier-login

    ```


    If XTier is installed you will see an authentication box, indicating that the
    server can recognize credentials passed by NetIdentity.


    To install the NetIdentity Agent, complete the following steps:


    +   1. Locate the netidentity folder where the Novell Client files are extracted
    from the ZIP file downloaded from http://download.novell.com. For example, Novell
    client for Windows XP/2000, the NetIdentity folder is located in WINNT\x86\.

    2. Run SETUP.EXE located in the netidentity folder.

    3. Select the Installation language and click OK.'
  merge: -1
