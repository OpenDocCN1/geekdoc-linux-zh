  md: '# # Novell on the Internet


    A tremendous amount of information about Novell and SUSE products, both official
    and unofficial, is available on the Internet. Officially, you can obtain the latest
    information about Novell and SUSE from Novell''s website. Novell also helps support
    several user forums that deal specifically with SLES, OES, or generally with networking
    and computers.


    Novell''s website is


    [www.novell.com]( )


    Novell user forums can be found at


    [support.novell.com/forums/]( )


    These forums are not managed directly by Novell employees, but offer users access
    to a wide variety of information and files dealing with SUSE Linux, NetWare, and
    other Novell products, as GroupWise. You can receive information such as technical
    advice from sysops (system operators) and other users, updated files and drivers,
