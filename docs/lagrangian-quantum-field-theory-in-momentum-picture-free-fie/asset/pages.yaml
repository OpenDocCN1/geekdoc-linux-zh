  md: "# # iManager\n\nOES Linux includes iManager 2.5, a web-based tool for administering,\
    \ managing, and configuring OES components, services, and eDirectory. iManager\
    \ allows Role Base Services (RBS) to give you a way to focus on the order of a\
    \ specified set of tasks and objects determined by the user's role(s). What users\
    \ see when they access iManager is based on their role assignments eDirectory.\n\
    \niManager has been architected to leverage Novell's extensible web services platform,\
    \ and is in a management portal for Novell's products and services. It runs on\
    \ Apache Server. For more information on Apache Server, see Chapter 14, \"OES\
    \ Web Foundations.\"\n\nAlthough other manag, such as ConsoleOne, can be used\
    \ to administer specific components of OES Linux, nearly all tasks can be done\
    \ through iManager. Although other things, you can define Linux User Management\
    \ (LUM), iPrint, iFolder, IP address management, and perform eDirectory object\
    \ management. iManager is the preferred management platform for OES Linux.\n\n\
    # ## Installing iManager\n\nIn some Linux installations and patterns, iManager\
    \ will not be installed automatically. If you did not select to install iManager\
    \ during the server installation, it can be manually reinstalled by YaST, or the\
    \ command line. To install iManager via YaST, complete the following steps:\n\n\
    +   1. Access YaST from a terminal using yast, or from a graphical environment\
    \ using y2 or the YaST launcher from the application menu.\n2. Select the Network\
    \ Services category in YaST. From within this category, locate and select the\
    \ iManager module. This module will detect the RPMs for iManager and asking you\
    \ if you want to install them. Continue to install the necessary packages.\n3.\
    \ At the conclusion of the software installation, SuSEConfig is executed to update\
    \ the system configuration. When this completes, the configuration of the iManager\
    \ will begin automatically.\n4. At the iManager Configuration screen, enter the\
    \ following information and click Next:\n    * eDirectory Tree Enter the name\
    \ of the eDirectory tree iManager will be serving.\n    * FDN Admin Name with\
    \ Context the eDirectory administrators credentials using fully qualified dot\
    \ notation, for example, cn=admin=novell.\n\n+   5. The iManager configuration\
    \ is now saved, and iManager plugins are automatically installed. Depending on\
    \ the OES components installed, this step can take some time.\n\n+   6. In order\
    \ for iManager to be active, select restart Apache and Tomcat when prompted.\n\
    \nWhen you've installed iManager, you can open it from its URL, using either HTTP\
    \ or HTTPS, at <server IP address>/imager.html. You will be required to authenticate\
    \ to access iManager, and will have access to only those features that you have\
    \ rights. For full access to all iManager features, authenticate as a user with\
    \ Supervisory rights to see the eDirectory tree (see Figure 5.2).\n\nFigure 5.2.\
    \ The iManager 2.5 home page.\n\n[View full size image]"
