  md: "# # Finding Files and Text\n\nThere are several methods for finding files and\
    \ text within files from a terminal. [Table A.6] contains the common methods used.\n\
    \nTable A.6. Commands Used to Find Files and Text Within Files\n\n| COMMAND |\
    \ GENERAL USAGE | DESCRIPTION |\n| --- | --- | --- |\n| egrep | egrep [OPTIONS]\
    \ PATTERN [FILE] | Searches the contexts of text files for the specified pattern.\
    \ The pattern specified for egrep must be created using extended regular expressions.\
    \ Common options include\n -i Ignore case for searches\n -r Recursive search for\
    \ matching files\n For example:\n egrep (root|admin) /etc/* |\n| fgrep | fgrep\
    \ [OPTIONS] PATTERN [FILE] | Searches the contexts of text files for the specified\
    \ pattern. The pattern specified for fgrep will be interpreted literally and not\
    \ as a regular expression. This allows for searching on such things as wildcard\
    \ characters (*,?). Common options include\n -i Ignore case for searches\n -r\
    \ Recursive search for matching files\n For example:\n fgrep '*15' /etc/crontab\
    \ |\n| find | find [PATH] EXPRESSION | Searches a directory structure as file\
    \ or files matching the specified expression. Common expression options include\n\
    \ -name File name search |"
  merge: -1
