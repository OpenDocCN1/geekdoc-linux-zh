  md: '# Always-Available Network Services


    When you are ready to start loading applications and services in a clustered environment,
    there are some extra steps you have to take beyond the standard implementation
    and configuration provided by the application or service. As with a cluster volume,
    you will most likely need to cluster-enable the application or service. You might
    also have to make some changes to the Cluster object and the cluster nodes so
    that they can properly support the new application or service.


    # Cluster Resource Applications


    When creating a resource for NCS cluster, you need to be familiar with the following
    types of applications:


    +   - Cluster-aware Cluster-aware applications are specifically designed to take
    advantage of a clustered environment. These applications and services recognize
    when they are running on a cluster. They will automatically tweak their internal
    settings to be more tolerant of communication lapses that occur in a clustered
    system.

    - Cluster-naive Although you can cluster-enable any application, if it is not
    designed to recognize that it is running on a cluster, the application is referred
    to as cluster-naive. For a cluster-naive application or service, NCS does all
    the work to ensure that the resource is reloaded on another node if the assigned
    cluster node fails.

    - Apache Web Server and Tomcat Servlet Engine

    - GroupWise (MTA, POA, GWIA, WebAccess)

    - iFolder

    - iManager

    - iPrint

    - Novell clients (Windows 98 and Windows XP/2000)

    - NetStorage


    Many OES Linux services, and some third-party applications as well, are designed
    to take advantage ofNovell Clustering Services when it is detected. For example:



    # Cluster-Enabling an Application


    You cluster-enable a service or application by creating a Cluster Resource object
    for it in eDirectory.'
