  md: '# # Logging in to Linux


    After installing and booting a SLES server, you should be presented with either
    a text or graphical login prompt. Entering an appropriate username and password
    will give you access to the server. For an administrator, it is important to understand
    how access is granted and how local SLES user accounts are configured. It is also
    important to have knowledge prior to implementing O components as Linux User Management
    (LUM). The following section will briefly discuss local user accounts and how
    the local authentication process works.


    # ## Local Account Files


    On a SLES9 server, local user accounts are defined in the /etc/passwd file as
    shown in Figure 3.1. Every user defined in this file must contain attributes that
    are used by the server for determining such things as user permissions and login
    name. The format of/etc/passwd is one user entry per line.


    Figure 3.1. An example of the /etc/passwd file.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_37_0.png)


    Each line within the passwd file is made up of five fields, separated by colons.
    These fields provide the necessary attributes for user accounts to be considered
    valid by the operating system. The purpose of each field is documented in Table
    3.1 for the entry jdoe:x:1000:100:John Doe:/home/jdoe:/bin/bash.


    Table 3.1. Explanation of /etc/passwd EnRy


    | FIELD ENTRY | DESCRIPTION |

    | --- | --- |

    | jdoe | User login name. |

    | x | Password field. If an "x" is in this field, shadow passwords are enabled.
    A "*" in this field prevents most types of local logins. |

    | 1000 | Numeric User ID (UID) of this account. |

    | 100 | Numeric primary Group ID (GID) of this account. |

    | John Doe | General Electric Comprehensive Operating System (GECOS) Commonly
    used for the user''s full name or description. |

    | /home/jdoe | User''s home directory. |'
