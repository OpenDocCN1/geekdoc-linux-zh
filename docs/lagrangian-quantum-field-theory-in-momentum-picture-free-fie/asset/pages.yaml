  md: '# Novell Users International


    Novell Users International (NUI) is a nonprofit association for networking professionals.
    With more than 250 affiliated groups worldwide, NUI provides a forum for networking
    professionals to meet face to face, to learn from each other, to trade recommendations,
    or just to share war stories.


    By joining the Novell user group in your area, you can build relationships and
    network with other Novell professionals in your area, attend regularly scheduled
    local user group meetings for training, and have access to regional NUI conferences,
    held in different major cities throughout the year. Best of all, there is usually
    little or no fee associated with joining an NUI user group.


    For more information or to join an NUI user group, visit the NUI website:


    http://www.nuinet.com


    You can also call 1-800-228-4NUI.'
