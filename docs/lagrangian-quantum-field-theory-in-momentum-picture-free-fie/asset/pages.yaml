  md: '# Tomcat Servlet Engine


    As Tomcat, is an open-source application. It is also known by its open-source
    project name, Jakarta. For more information on the Jakarta project, http://jakarta.apache.org/
    Its specific function is as a servlet Container is a server-side program that
    generates dynamic web pages based on user input. Tomcat provides a runtime environment
    within which servants can be executed and managed. Apache Web Server depends on
    Tomcat to process servants and Java Server Pages (JSP).


    As Apache, two instances of Tomcat can be loaded on an OES Linux server. The first
    is an instance that is used in conjunction with the Apache admin server to support
    the various management tools and other services available with OES Linux. The
    admin instance of Tomcat is loaded automatically when OES Linux is installed.


    The second instance is a public copy that is used in support of web applications
    that are served from OES Linux server. You will use this instance to build your
    own web environment.


    # NOTE


    Tomcat provides basic servlet and JSP support for OES Linux. For a more robust
    web application development environment, Novell offers Novellext Application Server.
    For more information on Novellext offerings, the OES Linux online documentation,
    and http://www.novell.com/solutions/extend/


    # Installing and Configuring Tomcat


    Because Tomcat is useless without a web server with which to operate, Tomcat is
    normally installed in conjunction with Apache Web Server. For information on installing
    Apache and Tomcat, the Apache installation section earlier in this chapter


    By default, OES Linux installs Tomcat 4 configuration files into the /etc/opt/novell/tomcat4
    directory structure. If a second instance or public version of Tomcat is installed,
    these configuration files will be installed in the /etc/tomcat directory.


    The admin (OES-specific) version of Tomcat requires no additional configuration
    information in order to be operational. However, it is a good idea to understand
    the important configuration files for Tomcat. The following list contains the
    most important configuration files for the admin of Tomcat:


    +   - server.xml configuration file for Tomcat. This file is located in the /etc/opt/novell/tomcat4
    directory.


    +   - jk_module.conf The main configuration file for the Jakarta-Apache plugin-in.
    This file is located in the /etc/opt/novell/httpd/gconf.d directory.


    +   - workers.properties contains configuration information that connects servants
    to Tomcat workers. This file is located in the /etc/opt/novell/httpd/gconf.d directory.


    The public version of Tomcat uses the same configuration files; however, they
    are typically located within /etc/tomcat directory. For more information on configuring
    Tomcat for use outside of OES, refer to the Tomcat documentation.


    # Managing Tomcat


    Tomcat does not require management with OES as the configuration should be completed
    by the OES installation, and the Tomcat service should be started automatically
    at server startup. However, you may encounter'
