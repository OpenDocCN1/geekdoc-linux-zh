  md: '# # Permissions and Identity


    Your ability to manipulate files and directories at the command line is directly
    limited by your identity and the permissions available to that. Table A.3 lists
    commands that can be used to adjust file-level permissions, and commands used
    to temporarily change your identity.


    Table A.3. Permissions and Identity Commands


    | COMMAND | GENERAL USAGE | DESCRIPTION |

    | --- | --- | --- |

    | Chgrp | chgrp GROUP FILE | Changes file and directory group ownership. |

    | Chmod | chmod [OPTIONS] MODE FILE | Changes access permissions on files and
    directories on Linux filesystems. |

    | Chown | chown [OPTIONS] OWNER:[GROUP] FILE | Changes file and directory user
    and group ownership. |

    | Su | su [OPTIONS] USERNAME | Substitutes current user credentials with the specified
    user''s identification. Common options include - Causes a complete login process
    to be performed using the new user identification |

    | | sux [OPTIONS] USERNAME Performs an su the new user credentials, but also creates
    an Xauthority file for accessing the local X server. Common options include -
    Causes a complete login process to be performed using the new user identification
    |

    | whoami | whoami | Displays current user identification. |'
