  md: '# Getting Ready for OES Linux


    Whether you are building a new network with OES Linux or installing an existing
    network, there are certain preparations you should make so that the installation
    goes as smoothly as possible.


    For those few of creating a new network from the ground up, you have the opportunity
    to do all the little things that will make easier to manage down the road. Carefully
    consider your choices of addressing, naming schemes, access methods, and so forth.
    As the technical foundation of your network, these are very difficult to change
    midstream. Consider business factors such as company growth, mergers or acquisitions,
    reorganations, and all the other business considerations of the twenty-first century.
    If you don''t, your network might lack the flexibility to adapt to strategic and
    structural changes in your organization.


    Unfortunately, the results of all this planning will have to be weighed against
    the realities of your budget. There will be inevitable compromises, but this type
    of advanced planning will make sure such compromises don''t back to haunt you
    when the network is running.


    # Server Hardware Planning


    Consider the following as you prepare your server hardware for the OES Linux:


    +   - Processor speed The server must have an Intel Pentium II or AMD K7 processor
    or higher. Novell recommends Pentium III 700MHz or higher processors for multiprocessor
    systems.


    +   - CD-ROM drive The server must have an ISO9660-compatible CD-ROM drive. Novell
    also recommends using a booting CD-ROM drive compatible with the El Torito specification
    for booting directly from the CD.


    +   - Server memory OES Linux server must have a minimum of 512MB of system memory
    (RAM).


    +   - Types of storage adapters and devices The OES Linux installation routine
    will properly detect most storage adapters and devices, but you should be familiar
    with the brand and type of your server''s storage controllers (SCSI board, IDE
    controller, and so on), as well as the brand, type, capacity, and other specifications
    of the storage devices (such as hard disks, CD-ROM/DVD drives, tape drives) attached
    to those controllers.


    +   - Size of hard disks OES Linux requires 2GB of unpartitioned space for a basic
    installation. Odds are that this disk space will seem awfully if you plan on fully
    implementing OES Linux. Review your planned and ensure that the local disks or
    shared storage devices are sufficient.


    +   - Network adapters Know the type of network adapters installed in the server.
    This should not be necessary, but if the installation routine has trouble identifying
    your adapters, having this information handy can help resolve the problem quickly.
    Keep in mind that drivers for unsupported hardware may only be available directly
    from your third-party vendor. To certified hardware, go to http://www.novell.com/partner/


    +   - Display and input devices An VGA or better video adapter and monitor with
    a standard keyboard and mouse for direct console operation are recommended for
    use with OES Linux. However, with the powerful web-based administrative tools
    available with OES, it is possible to operate a "headless" server without any
    direct input or output devices.'
