  md: '# Getting Help


    SUSE Linux provides thousands of possible commands that can be used to perform
    various tasks on the server. Having firsthand knowledge of every utility and all
    that utility may take a very challenging task! Frankly, through the use of utility
    manuals and application documentation, help is never far away.


    # Console-Based Help


    Working on the command line is the most common method of interacting with SLES.
    Providing easy access to application and utility usage information from this environment
    is essential to effectively working on the command line. Frankly, a system has
    been designed around this need. This system consists of three distinct types of
    documentation: manual or man pages; info pages; and system and third-party documentation.


    # man PAGES


    man pages on Linux are syntax-level documentation of utilities and applications,
    stored in an easily retrievable, command-line-friendly format. man pages are physically
    stored in the /usr/share/man directory and divided into the nine sections in [Table
    3.17].


    Table 3.17, man Page Sections


    | man | SECTION PURPOSE |

    | --- | --- |

    | 1 | Executable programs and commands all users can access |

    | 2 | System calls |

    | 3 | Functions and library routines |

    | 4 | Special device files (/dev/*) |

    | 5 | Configuration file formats and conventions |

    | 6 | Games |

    | 7 | Macro commands and packages |

    | 8 | System administration programs and commands used by the root user |

    | 9 | Kernel routines |


    All programs utilizing the man system should store their man pages within the
    correct section. In order to view man pages for a specific command, the following
    basic syntax must be used:


    ```

    man [section] command

    ```


    # NOTE'
