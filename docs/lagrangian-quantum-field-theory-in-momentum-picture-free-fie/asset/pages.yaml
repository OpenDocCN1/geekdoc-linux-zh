  md: '# # Installing the Identity Manager Engine


    Identity Manager Starter components are installed on those servers that will participate
    in the data synchronization process. iManager components must also be installed
    on your iManager server if it is different from the server running the Identity
    Manager engine. To install the Identity Manager engine on your OES Linux server,
    complete the following steps:


    +   1. At the OES Linux server where you want to install Identity Manager, insert
    the Identity Manager Bundle Edition CD-ROM.


    +   2. Mount the CD-ROM, and then locate and execute the installation program
    /linux/setup/dirxml_linux.bin. You must execute this command as the root user.


    +   3. Review the Welcome information and press Enter to continue.


    +   4. At the License Agreement screen, review the agreement and enter Y to accept
    the usage terms.


    +   5. Specify the appropriate number (14) for the components you want to install.
    Remember that Identity Manager drivers and management components can be installed
    on separate servers from the Identity Manager engine, if you like. To install
    multiple components on the local server, either perform the installation multiple
    times, or select option 4 and customize the component installation list.


    +   6. (Optional) Depending on the options you entered, you may be prompted for
    LDAP credentials or the server''s SSL port.


    +   7. Verify the summary information and press Enter to begin the package installation.
    If you have selected to install the DirXML server, your eDirectory server will
    be shut down during the installation.


    +   8. After the installation has completed, press Enter to close the installation
    program.


    +   9. (Optional) If you only installed the DirXML engine, repeat the installation
    and install the web-based Administrator components (option 3) on your iManager
    server. This is required to install the DirXML-plugins for iManager. After installing
    the plug-ins, restart Apache usingapache2 before the plug-ins will take effect.


    After completing the installation, the eDirectory daemon will be automatically
    restarted. However, if you installed iManager plug-ins, you will be required to
    manually restart the Apache server, as documented in step 9. After everything
    is restarted, iManager should now show two categories in iManager''s Navigation
    frameDirXML and DirXML Utilities. The options available beneath these categories
    are used to configure the actual data synchronization process and are described
    later in this chapter.'
