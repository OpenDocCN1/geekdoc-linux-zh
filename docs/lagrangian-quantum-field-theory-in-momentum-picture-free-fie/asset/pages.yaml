  md: '# Instant Access


    # Installing Apache Web Server and Tomcat Servlet Engine


    +   - Apache Web Server and Tomcat Servlet engine are installed with most configurations
    of OES Linux. If necessary, they can also be installed using YaST.


    # Managing Apache Web Server


    +   - To manage Apache Web Server, use the httpd.conf and various configuration
    directories beneath /etc/apache2.


    +   - Apache Web Server can also be managed using the HTTP Server module in YaST.


    +   - Virtual Hosting should be used to add custom content to the existing instance
    of Apache used for OES administration.


    The Apache Server logs to view errors and access attempts. Important log files
    include


    +   - /var/log/apache2/access_log


    +   - /var/log/apache2/error_log


    # Managing Tomcat Servlet Engine


    Use the Tomcat logs to view configuration information and errors. Important log
    files for Tomcat are


    +   - /var/log/apache2/mod_jk.log


    +   - /var/opt/novell/tomcat4/logs/catalina.out


    +   - /var/opt/novell/tomcat4/logs/localhost_log.*


    This chapter looks at Apache Web Server and Tomcat Servlet Engine. Together, they
    form the foundation necessary for delivering web services on the OES Linux platform:


    +   - Apache Web Server Web Server is an open-source (read: free) web server that
    is responsible for serving more than 60% of all web content on the Internet. In
    OES Linux, Apache provides support for all OES web-based management tools, and
    support for robust server functionality for providing web services and applications.'
