  md: '# Introduction to Novell File Access


    One of the major tenets of Novell''s oneNet philosophy is that users should have
    access to their files and data at any time, from anywhere. To help you reach this
    goal, OES Linux includes a host of methods for accessing network data.


    In keeping with Novell''s open-standards approach to network services, these access
    methods are designed to use Internet standards, web browsers, and thin clients,
    minimizing the need to add large amounts of workstation software in order to access
    network resources. Those access methods that do require a client of some sort
    make installation and configuration as easy as possible, so users can get on with
    their business.


    This chapter takes a look at the new and nontraditional forms of file access available
    in OES Linux. These include


    +   - NetStorage


    +   - Novell NetDrive


    +   - Novell IFStor


    +   - FTP server'
  merge: -1
  pgno: 212
- img_proc: true
