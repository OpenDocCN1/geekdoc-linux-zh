    # Overview


    As an administrator of a Novell Open Enterprise Server on a SUSE Linux system,
    you are looking for ways to leverage it as a platform for delivering Novell’s
    robust network services. Look no further. SUSE Linux and Open Enterprise Server
    Administrator’s Handbook provides you with the information you need to take advantage
    of the various Novell tools on a SUSE powered system. You will cover the major
    components and features of Open Enterprise Server (OES) on the SUSE Linux platform.
    By focusing on the implementation of OES on the SUSE Linux you will understand
    how to integrate the benefits of OES in an existing environment. This is not a
    reference work for network theory, protocols or architectures; it will provide
    you with a brief introduction to the concepts necessary to establish features.
    SUSE Linux Novell Open Enterprise Server Administrator’s Handbook will provide
    you with quick access to the information about a technology, concept or utility
    that you need to get the job done.'
