  md: '# DSTrace with iMonitor


    Now that you have been introduced to the most common eDirectory processes, it''s
    important that you know how to keep track of the health and general operation
    of those processes. To do this you can use iMonitor. iMonitor is presented in
    Chapter 5, "OES Management Tools," as one of the principal management tools for
    EOS Linux. However, this section focuses on the iMonitor options for monitoring
    eDirectory processes and activities. Refer to Chapter 5 for information onMonitor
    installation, general interface, and additional capabilities. For detailed feature
    information, see the EOS Linux online documentation.


    iMonitor is a web-based replacement for several of the console-based management
    utilities used with previous versions of NetWare, including DSBrowse, DSTrace,
    and DSDiag. Because the eDirectory processes previously run on each eDirectory
    server, iMonitor provides a server-level view of eDirectory health as opposed
    to a tree-level view. You can view the health of processes running only on the
    server where you are running iMonitor. To another server, launch iMonitor from
    that server.


    Prior to using DSTrace from iMonitor, you must configure the utility and specify
    the activity you want to monitor. This is accomplished by the Trace Configuration
    page, shown in Figure B.1.


    # Figure B.1. Trace Configuration page in iMonitor.


    ![](img/55b3d14b933dfc9cfb2ca796e31ccc53_295_0.png)


    When you go into Trace Configuration, you will see four new links in the left
    navigation frame:


    +   * Trace Configuration This is the default view you will see when entering
    the Trace Configuration page. From this page, you can define the server-based
    eDirectory events and processes that you want to trace. The following configuration
    options are available from this page:

    * Trace On/Off Enables DSTrace monitoring. When DSTrace is enabled, you will see
    a Trace button (big lightning bolt) in iMonitor''s header frame that you can use
    to view the active trace (see Figure B.2).


    # Figure B.2. Active DSTrace view in iMonitor.'
  merge: -1
