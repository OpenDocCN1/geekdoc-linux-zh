  md: '# # Installing OES Linux


    Installing OES Linux is a straightforward process, but you should be familiar
    with several aspects of the installation prior to beginning the process. When
    you know what to expect, you can begin the process of installing a new server
    or upgrading an existing one to OES.


    The following topics are contained in this section:


    +   - Preparing to install OES Linux

    - Installing a new OES Linux server

    - Upgrading SLES9 to OES


    # ## Preparing to Install OES Linux


    Before beginning the OES Linux installation, it is a good idea to double-check
    the installation prerequisites. This section contains the official prerequisites
    of an OES Linux server.


    It is also important to understand the OES installation patterns. These patterns
    determine what OES components are installed by default. If necessary, each pattern
    can be customized to address specific needs.


    Finally, creating a network-based installation source is an efficient way to perform
    multiple installations, or just maintain the installation without relying on the
    CD media.


    When you fully understand these topics, you''ll be ready to begin the actual OES
    Linux installation.


    # ## INSTALLATION PREREQUISITES


    Before attempting to install OES for Linux, review the following minimum hardware
    prerequisites to ensure your server meets these requirements:


    +   - Server-class computer with Pentium II or AMD K7 450MHz processor (Pentium
    III, Pentium 4, AMD K8 or higher recommended)

    - 512MB of RAM (1GB recommended)

    - 2GB of available, unpartitioned hard disk space (10GB recommended; additional
    space may be required depending on OES component implementation)

    - 4X CD-ROM drive (48X recommended)


    Keep in mind that these requirements are specifically referring to the minimum
    hardware requirements and may not be sufficient for your needs. It is obviously
    a good idea to use the best hardware available to you, and plan for increased
    server use in the future.


    # ## INSTALLATION PATTERNS'
