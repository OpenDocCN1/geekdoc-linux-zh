  md: '# Understanding Resource States


    When running or testing an NCS cluster, you can view valuable information about
    the current state of your cluster, and its various resources, from the Cluster
    Management view in iManager (see Figure 9.5).


    Figure 9.5. View of cluster status in iManager.


