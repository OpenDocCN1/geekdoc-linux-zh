  md: '# Novell Training Classes and Certification


    If you are looking for a way to learn about Linux, NetWare, or any other Novell
    service or product, in a classroom setting, Novell Training offers a variety of
    hands-on labs and knowledgeable instructors. As a pioneer of IT training and certification,
    Novell has a broad range of training opportunities available. For the most current
    information on Novell courses, certifications, and materials, visit the Novell
    Training website:


    http://www.novell.com/training/


    Novell classes are taught at more than thousand Novell Training Service Partners
    (NTSPs) throughout the world. They are also taught at more than 100 NATPs (Novell
    Academic Training Partners), which are universities and colleges that teach these
    courses.


    Certification courses offer an excellent way to get direct, hands-on training
    in just a few days. Classes are also available in Computer-Based Training (CBT)
    form, if you''d rather work through the material at your own pace, attend a class.


    These classes also help you if you want to become a CNE, signifying that you are
    a Novell professional.


    The Novell CNE program provides a way to ensure that networking professionals
    meet the necessary criteria to adequately install and manage NetWare. To achieve
    CNE status, you take a series of exams on different aspects of NetWare. In many
    cases, you may want to take the classes Novell offers through its NTSPs to prepare
    for the exams, but the classes aren''t required.


    The classes and exams you take depend somewhat on the level of certification you
    want to achieve. Although certain core exams are required for all levels, you
    can also take additional electives to achieve the certification and specialize
    you want.


    The following levels of certification are available:


    +   CNA (Certified Novell Administrator) This certification is the most basic
    level. It prepares you to manage your own NetWare network. It does not delve into
    the more complex and technical aspects of NetWare. If you are relatively new to
    NetWare, the class offered for this certification is highly recommended.


    +   CNE (Certified Novell Engineer) This certification level ensures that you
    can adequately install, manage, and support NetWare networks. While pursuing your
    CNE certification, you "declare a major." meaning that you choose to specialize
    in a particular Novell product family. For example, you can become a Novell 6
    CNE or a GroupWise CNE. There are several exams (and corresponding classes) involved
    in achieving this level of certification.


    +   Master CNE This certification allows you to go beyond CNE certification. To
    get a Master CNE, you declare a "graduate major." You will delve deeper into the
    integration- and solution-oriented aspects of running a network than you would
    at the CNE level.


    +   CNI (Certified Novell Instructor) CNIs are authorized to teach NetWare classes
    through NTSPs. The tests and classes of this level ensure that the individual
    taking them will be able to adequately teach others how to install and manage
    NetWare.'
  merge: -1
  pgno: 313
