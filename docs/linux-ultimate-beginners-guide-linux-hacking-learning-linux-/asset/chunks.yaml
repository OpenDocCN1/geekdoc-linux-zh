    `Dd`: 文件将根据已设置的格式选项进行复制和转换。这也适用于磁盘和数据复制。


    `Cp`: 你选择的文件将从其当前位置复制并移动到另一个位置。


    ### 查找


    `~`: 你的搜索将遍历主目录及其所有的子目录。


    `-name report3`: 将定位到任何名为 report3 的文件。


    `-print`: 将打印该文件的完整文件路径。


    `Losetup`: 将设备的设置设置为循环设备。


    `Install`: 在设置其属性的同时，将复制几个不同的文件。


    `Ls`: 你将能够看到子目录中的所有内容。


    `Locate`: 将定位数据库中任何使用 `slocate` 查找的文件。


    `Ln`: 文件之间存在链接。


    `Sum`: 将运行检查并统计该文件内部的块数。


    `Mkdir`: 你将创建一个目录。


    `Stat(l)`: 将打印索引节点（inode）。


    `Mknod`: 将创建块设备或字符文件。


    `Slocate`: 当搜索特定文件时，将使用此代码。你将针对系统中的文件进行构建。


    `Mktemp`: 将创建临时文件。


    ## 第十章


    ![logo](img/0003.jpeg)


    ## 系统管理与安全


    一旦安装了 Linux，你将需要配置你的系统、备份文件、监控系统并处理更新。作为系统管理员，你将学会如何处理存储媒体、管理操作系统上的内存、启动和关机，以及如何处理系统中的用户。


    ## 磁盘与存储


    在连接操作系统后，你将在磁盘上创建所有文件，以便有一个存储数据的地方。你对磁盘进行的一些操作包括格式化它们、移动系统以形成树形结构、分区硬盘以便你可以进行不同的、互不干扰且独立运行的活动。你还可以在设置的每个磁盘上创建文件系统。


    Linux 将识别两种不同的设备：块设备和字符设备。一些设备是随机的，而另一些是顺序访问的。文件系统中的每一个设备都将被表示。这样，当你创建一个设备时，数据将从它所属的设备输入或发送。这使得你不需要任何特殊操作即可访问在
    Linux 系统上使用的设备。


    ## 内存管理


    Linux 拥有虚拟内存，即将磁盘作为 RAM 的扩展，以便你有足够的空间执行所需的操作。任何放置在硬盘上作为内存的内容稍后都会被调用。作为用户，你不会看到所有程序保存在哪里，因为并不是所有的内存都隐藏在硬盘上。在管理内存时，你有创建内存交换（swap）的选项，可以将你选择的文件从其当前所在的预留空间交换出去。


    ## 启动与关机


    每当你启动操作系统时，你都在参与启动它的过程。这是计算机镜像在自引导过程中出现的时候。当计算机经历引导过程时，它将调出某些称为“引导加载程序”（bootstrap
    loader）的代码，这将启动操作系统以便可以使用。你使用的每台计算机通过引导过程的方式各不相同。你需要遵循适当的步骤来确保关闭 Linux 系统。如果你不正常关机，最终可能会导致文件混乱，你的操作系统也会变得错乱。重要的是记住，Linux
    系统使用了磁盘缓存，它不会一次性地将所有内容写入磁盘，而是分间隔地进行，以确保操作系统的性能优于其他系统。因此，遵循正确的关机程序至关重要，这样你才丢失此时正在移动到磁盘的任何数据。


    ## 安全


    许多人决定使用 Linux 是因为服务器提供的安全性。在为用户提供安全性方面，Linux 没有出现过任何重大问题。但并不意味着你不需要关注系统的安全性。


    ## Linux 系统并不能对一切免疫


    诚然，下载 Linux 发行版比从新购买的机器上下载 Windows 要安全；然而，由于 Linux 是免费的，它将存在一些漏洞。但你不会像在其他操作系统那样发现这么多漏洞。这并不意味着没有漏洞，只是意味着较少。如果你在桌面上使用
    Linux，你仍然可能面临基于浏览器的漏洞，例如根内核包（rootkit）。系统的运行并不一定非要获取根权限才能被干扰。因此，作为系统管理员，你仍然需要注意安全，以便保护你自己、你的文件和你的用户。


    ## 没有义务使用杀毒软件


    在 Windows 上工作时，你习惯了使用杀毒软件；但当你迁移到 Linux 时，你不需要。并没有多少杀毒软件可以在 Linux 系统上运行，因为 Linux
    在病毒和恶意软件方面没有出现与 Windows 相同的问题。如果这让你感到安心，你可以根据需要安装杀毒软件。但当你扫描系统时，很可能得不到任何结果，因为系统中没有威胁。Linux
    用户面临的大多数攻击是蠕虫和跨站脚本。其他攻击（如钓鱼尝试）取决于用户决定输入攻击的内容，因为你在上网时可能会被要求提供个人信息，而可能并没有意识到正被试图黑入你电脑的人所欺骗。


    ## 预防胜于治疗


    如果你曾经做过病毒或恶意软件的受害者，你就知道，保持系统正常运行，比在发生安全泄露后花费数小时去尝试找回所有信息要容易得多。你可能想要做的第一件事是加入供应商的安全邮件列表，这样当你使用的发行版出现问题时，你就能立即收到提醒并知道如何修复。


    如果你使用的是第三方发行版，你看到的安全更新速度可能会比使用上游版本要慢。


