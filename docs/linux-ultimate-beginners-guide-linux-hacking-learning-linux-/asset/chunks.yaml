- fmt: '

    Also, make sure you keep your operating system up to date. At least once a week
    you are going to want to run updates so that you can update everything in case
    there are patches that you are going to need to make sure that you are secured.
    If you do not do this, then you are opening yourself up to attacks.


    ## User permissions and encryption


    You can also do your part in making sure that you keep your system locked down
    to just those that need to be on the system. Depending on which distribution you
    are using is going to change which tools are offered for system security. You
    need to go through and learn where these tools are and how to use them so that
    you can lock down your system or turn the tools off if they are not needed.


    It is important that you know the way that Linux allows for for permissions to
    be set up so that others have access to your files but not so much access that
    they can end up getting in and messing up your system. This is vital when it comes
    to a system that is being used by multiple users or if you are running off a host
    service that is being shared.


    It is not a bad idea to encrypt the partition that you have set up either. Whenever
    an individual has physical access to the machine that you are running Linux on,
    they are not going to need to know any of your passwords to get in and get the
    data that is located on that machine if it is not encrypted.


    ## Audit and intrusion detection


    Lastly, you should take into consideration setting aside some time to place intrusion
    detection on the servers that you are a system administrator to running checks
    to verify that your system has not already been compromised.


    Many hackers are experienced enough to be able to get into an operating system
    and compromise it without leaving any signs until it is too late.


    ## Backups


    No matter how reliable your system is, you are going to want to have backups of
    anything that is on your system so that you do not lose everything. While it is
    highly unlikely that you are going to suffer from a security breach when using
    Linux, it is better to be safe than sorry.


    # Chapter Eleven


    ![logo](images/00003.jpeg)


    ## Scripting with Linux


    As you know, Linux is going to run off of commands, and there are millions of
    commands to do everything it is that you are wanting to do. It seems pretty impossible
    to be able to remember all of the commands and what it is that they do. The good
    news is that you do not need to! You are going to want the computer do the work
    for you and use shell so that you have the option to automate things. This is
    going to be why scripts are written.


    If you do not already know, scripts are going to be lines of code that tell the
    computer what to do. Your shell is going to have the ability to read the file
    that contains all of your scripts and execute them as if you were to type them
    out right then and there.


    Scripts are good for a great number of things such as:


    - Getting automatic updates to your Linux system from your vendor.

    - Back up your files to another server so that you do not risk losing them.

    - Managing a website and the files located on it (if you manage a website.)


    ### Your first script


    Obviously, you want your shell script to be successful, and for that to happen,
    you have to make sure you are following these three steps.


    1. Placing the script somewhere that your shell has access to it.

    2. Writing out script correctly so that it can be read by the shell.

    3. Giving the shell the proper permissions that are needed for the script to be
    executed on your operating system.


    The scripting for the shell is going to be in ASCII text; therefore you need to
    have a text editor opened to create the proper shell script. The text editor that
    you use is going to be based on your personal preferences, but some of the ones
    that you can choose from are the notepad or word processor. Just ensure that the
    editor you decide to use is going to be able to read as well as write out the
    ASCII texts.


    After your text editor has been opened, you are going to enter in some text that
    looks like this:


    ```bash

    #!/ bin/ bash


    #the first shell script for Linux


    Echo: “I did it!”

    ```


    The next thing that you are going need to do is to save the file with a name that
    you are going to know what it is and where you can find it.


    When looking at the opening line of your script, you are going to notice that
    it is going to tell the shell which program you are wanting to be used when it
    comes to interpreting your script. You can use other programs such as `Perl` or
    `python` if you prefer.


    Your second line is going to be your comment which is set apart from the rest
    of the code with the hashtag. Anything that is following the hashtag is going
    to be ignored by the interpreter because it is not an actual part of the script.


    The longer your script is, the more comments that you are going to have in your
    script so that you are able to go back and figure out what it is that you are
    doing with your code or so that others can use your code and know what it is that
    you are doing.


    That last line in your script will be the command that is echoed. Basically, this
    is the command that you are going to want to be printed on your display.


    ### Setting permissions


    You have to allow the shell to know that it is okay to run the code that you have
    put into the command prompt. You are going need to use the `chmod` command along
    with the number `755`. The number `755` allows for anyone to execute, read, and
    write the code. But, if you want your code to be private instead, you will use
    the number `700`.


    ### Placing it into your path


    When your script is executed, you should see the “I did it!” message that you
    put into your code back when you first wrote it. On the off chance that you do
    not see your code on the screen, relocate your file in its directory and move
    the shell there rather than the directory that it is currently using.


    Whenever the name of a command is entered into the system, the system is not going
    to go through the entire computer to locate that file. Instead, it is just going
    to search through where you tell it to search specifically. Scanning your entire
    computer would take way too long, and you may not always have that time.


    Your shell is going to keep a list of all the directories in which programs that
    are executable will be located and the only directories that are searched (if
    you do not tell shell where to look) and it will find the file. If the file cannot
    be found, then you are going to get an error message that tells you that your
    command could not be found.


    The list of directories that the shell is going to search will be the path, and
    you are going to be able to look at all the paths by placing `$PATH` into your
    command prompt. The result is going to be the entire list of directories that
    are going to be searched when looking for your command.


    You also have the option to add directories so that the shell looks in that directory
    rather than going into a different directory.


    ## Editing


    Your home directory already has some scripts that are being run by the shell that
    you did not put on your computer but were put there so that it can configure the
    behavior of your sessions while you are on the computer. These scripts can be
    edited by you if you want to edit them.


    Some commands are automatically built into your shell that you are not going to
    be able to change. Your shell is going to understand a handful of commands on
    its own and others are going to have to be taught to it. Some commands that your
    shell is going to know automatically are `cd` and `pwd`.


    Another group of commands are the programs that are executable. A great number
    of commands in this group are going to be found in the files that are located
    in your directory.

