    Deepin is one of the newest desktop environments on the Linux system. It has one
    of the most modern feels while taking a little bit of every other environment
    that Linux has to offer.


    GNOME 3 is what inspired Linux developers to create Deepin. Out of all of the
    desktop environments that you can choose from, Deepin is going to offer you an
    easy to use control panel that is going to make it to where you are able to find
    everything that you need to navigate your desktop.


    The perfect user for this desktop environment is going to be anyone! You do not
    have to have any experience with Linux and Deepin is going to be easy to learn
    and use!


    # Chapter Six


    ![logo](images/00003.jpeg)


    ## The Linux Interface


    There are several different interfaces that you are going to be allowed to use
    depending on what your purpose is for using Linux. The two interfaces that are
    on the API (application programming interface) are the kernel user space and the
    kernel internal.


    The API on Linux is in the kernel user space API. This means that the programs
    on the system are going to have access to the resources and services that are
    on the kernel. The Linux system is made out of the system call interface and the
    kernel that allows for subroutes to the `GNU C Library`.


    The developers of the API for Linux made it to where the API can provide unsable
    features as to the specifications that have been defined by `POSIX` so that it
    is compatible with other features that are going to be useful but have not necessarily
    been defined by `POSIX`.


    The API for Linux is completely stable and has been stable for many decades. This
    occurs thanks to the stability that is granted by the source code. However, while
    the system is stable and never going to break down, those who work on the development
    of the system are conservative when it comes to introducing new calls into the
    system.


    All of the open source software for Linux is free and written specifically for
    the `POSIX` API. Since everything has to go through the Linux kernel, the API
    for the kernel has been bigger because of all of the additional features that
    have been put into the API.


    Because of these added features, there is a technological advantage to the the
    API on Linux that makes it superior to the `POSIX` API. Some of the best-known
    examples are `Weston` and `systemd`. Many people who use Linux have no hesitated
    to state that they prefer the Linux API over the `POSIX` API because of the advantages
    that the Linux API has to offer.


    ### System call interface


    The system call interface is the basis for everything that is implemented and
    even made available for the system calls that are inside of the Linux kernel.
    Several subsystems are going to be empowered to define their own calls.


    ### C standard library


    The C library is going to be what surrounds the system calls done by the Linux
    kernel. There is a combination composed of the system call interface and the C
    library that is going to make up the entire Linux API.


    ### Linux ABI


    The ABI is going to be the kernel user space for the ABI. ABI stands for application
    binary interface, and when speaking of the ABI, you are going to be referring
    to the application binary interface which is all of the binaries that are found
    inside of the machine’s code.


    Any code that is part of the machine’s binary is going to be tied to the instruction
    set. When you are trying to define an ABI that is useful, the developers for the
    Linux kernel and the C library developers are not going to be held responsible.
    Instead, the Linux distributions and the independent software vendors are going
    to be the ones that are held responsible for ensuring that the ABI is stable for
    the user to use.


    # Chapter Seven


    ![logo](images/00003.jpeg)


    ## Distributions


    The Linux distribution is going to be the operating system in which all of the
    software is collected depending on the kernel and the management system that is
    being used. Most users of Linux are going to get their operating system by downloading
    it from one of the distributions of Linux. These distributions offer downloads
    for devices that have been embedded, super computers, and personal computers.


    When downloading a distribution, you are going to be downloading the kernel, the
    libraries, and any additional tools that are needed to ensure that the operating
    system runs the way that it is supposed to. A vast majority of the software that
    is downloaded is going to be software that is open sourced and free to the users
    that are downloading it. The binaries that are compiled in the software along
    with how the source code is written is going to make it where you can modify the
    original software.


    Most of the time the distributions of Linux are going to have some kind of proprietary
    software that is not going to be available in the source code these things are
    going to be things such as device drivers. Distribution can also be described
    as the assortment of applications and utility software that is bound together
    with the kernel for Linux so that the needs of the users are met when they are
    using the system.


    Just like the desktop environment, you are going to want to find the distribution
    that is best for you and your needs.


    ### openSUSE


    the SUSE company moved their `openSUSE` closer to their `SLE` to make it to where
    their users can have a distribution that is going to be similar to the server
    that the enterprise uses. You are going to discover that `openSUSE` is going to
    be similar to `Ubuntu` and even `CentOS`.


    ### Arch Linux


    `Arch Linux` allows for its users to learn everything that there is to learn about
    Linux due to the fact that you are going to be installing everything manually,
    so you are going to be able to touch all of the operating system for Linux that
    you are installing.


    `Arch` is one of the distributions that are most customizable. After you get used
    to how `Arch` is set up, then you are going to be able to build the distribution
    that you are wanting. The bad thing about `Arch` is that there are not any interaction
    problems that there may be. What you see is what you get.


    `Arch` is constantly updated so that the users are running the latest packages
    that `Arch` developers are putting out. The user also has the option to run software
    before it is released, but you are going to running unstable repositories.


    ### Elementary OS


    `Elementary OS` focuses mostly on the design of how the system looks so it is
    geared more towards those who are designers so that they can make the system their
    own. `Elementary OS` is going to be closer to the interface that you are see on
    `Mac OS X`.


    ### Solus


    The `Solus` system was created from scratch by its developers and is not based
    on `Ubuntu` or `Debian`. The `Budgie` desktop which was also developed from scratch,
    however, it is going to operate the same as `GNOME`.


    ### Chrome OS


    `Chrome OS` is going to be based more towards the browser than a regular operating
    system which makes it ideal for those who are online more than not. `Chrome OS`
    does not require any maintenance and is regularly updated so that it can keep
    up with the latest security and online updates that are seen on the internet.
    `Chrome OS` is a popular Linux system on PC as well as mobile devices.


    ### Ubuntu MATE


    `Ubuntu MATE` is best if you are using a laptop that does not have a long battery
    life or a lot of resources. `Ubuntu MATE` is lightweight but is not lacking in
    any of the features that the other distributions are going to have. Just because
    `Ubuntu MATE` is geared towards those who use laptops does not mean that you cannot
    do what you would be able to do on a PC, it only means that it is geared more
    towards the systems that are on the lower end of the spectrum.


    ### Lubuntu


    `Lubuntu` is for those that are working on older hardware through the use of `LXDE`.


    ### Snappy Ubuntu Core

