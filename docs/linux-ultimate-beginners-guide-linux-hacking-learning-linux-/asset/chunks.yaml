  trans: '


    - **内核 (Kernel)**：内核是整个 Linux 系统的一部分。内核是操作系统的核心，负责管理从外围设备到 CPU 的一切。在内核对操作系统的重要性尺度上，内核处于该尺度的最底层。

    - **图形服务器 (Graphical server)**：图形服务器控制你在访问的网站上看到的图形内容。

    - **外壳 (The shell)**：外壳是一个命令处理进程，它允许你通过文本界面向计算机发出命令。在使用 Linux 时，你并不需要直接接触命令行。

    - **桌面环境 (Desktop environment)**：桌面环境是你作为计算机用户时将要使用的界面。你遇到的每一个桌面环境都会包含各种内置应用程序，这些程序是针对特定的桌面。

    - **应用程序 (Applications)**：这些是可以安装在计算机上的软件程序。


    第一批计算机的建造是为了执行一系列中的单项任务，就像计算器工作一样。这些操作系统最早开发于 50 年代，目的是让不同的程序能够相继运行，从而加快处理速度。直到
    60 年代，现代且复杂的操作系统才被开发出来。


    添加的一些硬件包括并行处理和运行时库等。每当个人电脑在 80 年代开始变得流行时，操作系统也随之进化，以便在这些计算机上使用，就像它们最初为设计的大型计算机一样。


    没有操作系统的电子系统最早记录可以追溯到 40 年代。这些电子系统被程序化到必须开启和关闭的开关上。或者它们连接到跳线器，然后连接到插线板。正是这些系统被用来生成军事使用的弹道表，或者用于打印和控制工资单，而这些数据可以从纸卡上找到，纸卡是由工人在工作期间和非工作期间打孔而成的。


    ## 第三章


    ![logo](img/00003.jpeg)


    ## 安装 Linux 和学习系统


    如上所述，你可以免费下载 Linux！以下是你按照这些步骤操作，将 Linux 下载到你的计算机上并开始使用！


    ### 第一步

    首先下载你想要使用的 Linux 发行版。Linux 初学者会倾向于选择轻量级且用户友好的发行版。你可以选择的一些版本包括 Ubuntu 和 Lubuntu。


    ISO 镜像可以在发行版的官方网站上找到，但在将其安装到计算机之前，你需要将其刻录到 U 盘或 CD（如果你有空光盘的话）。将其存放在外部存储设备上将创建一个操作系统的实时存储系统。


    实时版 CD 或 USB 将是你启动操作系统的介质，大多数情况下，你获得的版本将允许你预览该操作系统，该系统将直接从该存储设备运行。


    你需要安装一个镜像刻录程序，或者使用你当前正在使用的操作系统自带的程序。


    ### 第二步

    启动到你的活动存储设备。绝大多数计算机都会优先从你的硬盘启动，因此你必须更改计算机设置，使你的计算机能够从刻录盘启动。


    当你的计算机重启后，你需要按下指定的按键进入启动菜单。


    如果无法进入启动菜单，你必须进入 BIOS 菜单来访问启动菜单。进入此菜单后，选择存有你 Linux 副本的活动存储设备。完成后，保存你所做的更改并退出菜单，以便你的计算机继续启动过程。


    ### 第三步

    在安装 Linux 系统之前，你可能想先尝试一下，看看它是否是适合你的操作系统。这不像使用完整的操作系统，但你可以像它已安装在你的系统中一样导航操作界面，从而对它有一个直观感受。


    ### 第四步

    安装。一旦你完成了 Linux 的试用，你就会想将其安装到计算机上。如果你不想先试用系统，安装将从启动菜单开始。


    ### 第五步

    设置账户。Linux 要求你拥有用户名和密码，以便你能够获得操作系统的管理权限以进行管理维护。


    ### 第六步

    放置你的分区。如果你的计算机上还有另一个操作系统，你必须设置一个分区，使其与其他操作系统隔离开。在打算同时运行两个操作系统时，必须这样做。


    ### 第七步

    启动 Linux。完成安装过程后，你需要重启系统，然后会显示一个新屏幕。这将是你新操作系统的引导加载程序。确保你从列表中选择了合适的发行版。如果你正在运行两个操作系统，可能看不到此屏幕。要进入此屏幕，在看到厂商界面后按下
    Shift 键。


    ### 第八步

    双检你计算机的硬件。你的大部分硬件都能兼容 Linux，但你可能需要安装一些其他驱动程序，以便它能够正常运行。


    ### 第九步

    开始使用 Linux。


    ## 学习 Linux


    ### 第一步

    在安装过程中有机会尝试系统时，你应该已经开始熟悉它了。


    ### 第二步

    尝试做一些你平时使用计算机要做的事情。请注意哪些是可以做的，哪些是不能做的。


    ### 第三步

    熟悉命令行界面。虽然终端看起来可能吓，但你不应该让它阻碍你使用 Linux。命令行界面会让使用 Linux 变得更容易，而且你不会受到在使用 Windows
    时那样的限制。


    ### 第四步

    学习 Linux 文件系统。Linux 中没有 C 盘，但你仍然有一个存放文件的目录。你的文件不在 C 盘中，而是位于主目录下，后面跟着你的用户名。


    ## 第四章


    ![logo](img/00003.jpeg)


    ## Linux 导航


    由于你是第一次使用 Linux，你需要学习如何在操作系统中导航。你所需的核心能力之一是在文件系统中移动，以便对新界面有一个良好的了解。


    ### 通过使用 `pwd` 命令确定你所在的位置


    当你登录桌面后，你将被放置在主目录下。这个主目录将是你所有文件的所在之处，你可以根据需要创建目录。


    为了确定主目录相对于其他文件系统的位置，可以使用 `pwd` 命令。`pwd` 命令将显示你当前所在的目录。


    在使用 `pwd` 命令后，你应该得到类似 `/home/user account` 的结果。


    '
- fmt: '

    Each home directory is going to be named for the user account that you are working
    with. Since the home directory is going to be the very top of the directory, it
    will be the root directory.


    ## Searching the contents of your directory


    Being that you are now able to get into the directory, you need to know what materials
    the directory houses. Being that your root directory is not going to have many
    things in it, you will want to try and find another directory.


    First, you are going to enter `cd /usr/share` into the command prompt before entering
    the `pwd` command again.


    At this point, you should be inside of a new directory. So that you can see the
    files in this directory, you will use the `ls` command. By using this command,
    you will have a list of all of the contents of the directory no matter how many
    items there are in it. You will now have the option to add some flags to the command
    so that you can look for files that follow specific behaviors.


    In case you are wanting to find the hidden files in the directory, you need to
    add in `-a` to your command prompt. Keep in mind that there are no files that
    are actually hidden inside of the user directory. Most of the “hidden” files are
    going to be those that hold special indicators such as configuration files.


    The dot entries that you see are not going to necessarily be directories but methods
    that have been built into the operating system in reference to other directories.
    Single dots are going to be for the directory that you are currently using while
    the double dot is going to be for the parent directory.


    ## Navigating your file system


    You have already made your way into the directory to your home directory, and
    then you moved on to a different directory, but, let’s look at some other things
    you can do in moving through the file system on your new Linux system.


    Go back to your home directory by using the `cd /usr/share` command.


    The command that you have just used will give you the most direct path to the
    directory in question. All files and directories in Linux are going to be located
    in the root directory but will be referenced by the slash that starts out the
    command.


    Absolute paths are going to show you the location of the directory where the file
    is located in the root file. The absolute path is going to be there so that we
    can reference the directories in the most direct way so that you are not getting
    the directory mixed up with another directory.


    Keep in mind that you are going to have to start all of your absolute paths with
    a slash.


    On the other hand, you can use a relative path which will show the directory as
    it is related to the current directory. Whenever the directory that you are trying
    to get to is close to the directory in the hierarchy, then you are going to want
    to use this method because it is going to be the easiest and shortest way for
    you to get to the file that you want. Whenever your directory is inside of the
    directory that you are currently located in, you are going to be able to reference
    this directories name without using a slash.


    ## Chapter Five


    ![logo](images/00003.jpeg)


    ## The Linux Desktop Environment


    Linux allows you to have a choice as to which desktop you want to use. You need
    to think of the desktop in relation to how easy it is going to be for you to do
    the things you are wanting to do with your new operating system.


    There are no set rules as to how you are going to figure out how to choose the
    best desktop for you, and ultimately it is going to be a personal decision. However,
    you need to make certain you do your research on each desktop that is available
    through Linux so that you can make the best decision.


    Every desktop that you have the option of choosing from is going to give you a
    unique experience and have many options that are going to make it to where you
    are able to do what you do on any other operating system.


    The desktops that you have a choice of choosing from are:


    * Deepin

    * Ubuntu unity

    * Xfce

    * Gnome 3

    * Enlightenment

    * Cinnamon

    * And kde


    ## Ubuntu Unity


    The ubuntu unity desktop is going to have a more modern interface that is going
    to allow the user to have access to the data that is on their desktop as well
    as having access to data from other remote sources.


    You are going to have the capability to quickly connect to your social media and
    other websites that you may tend to frequent. One of the things you need to keep
    in mind when it comes to using ubuntu unity is that you are going to have be a
    user that does not spend a lot of time going back and forth between your mouse
    and keyboard.


    Thanks to the Head Up Display you are going to be able to use your keyboard to
    switch between the various menus rather than having to continue to move to your
    mouse.


    The best user for ubuntu unity is someone who does not mind the desktop not being
    individualized to them but offers them access to any information they may want
    at their fingertips.


    ## GNOME 3


    GNOME 3 offers a desktop environment that is full featured but does not show it
    on the desktop. You are going to be able to open up Dash to get to everything
    that GNOME3 has to offer you.


    With GNOME3 you are going to have the ability to work with how the desktop looks
    a little so that you are able to customize it to you and your preferences. In
    the end, GNOME3 is just like ubuntu unity except it allows the user to have a
    little more control of how their interface appears.


    GNOME3 is geared more for those who know how Linux works and want to have a desktop
    that is modern but can be customized to them.


    ## Cinnamon


    Cinnamon is a mixture of GNOME 2 and 3. It still offers that modernized look,
    but you are going to now be using the customization feature of GNOME 3. Cinnamon
    offers a more standard look that is able to be changed through the use of adding
    effects or removing them.


    Cinnamon is going to be for those that want a standard desktop that they are able
    to tweak as they desire but makes it easier for them to navigate through their
    system as on any other system.


    ## KDE


    KDE offers a full desktop and has come to be one of the longest standing environments
    that Linux has to offer. KDE is one of the fastest desktops you are going to be
    able to work with. Everything about this desktop revolves around the system tray.


    Just like the other environments, KDE offers a modern feel, but it is going to
    lean more towards the desktop that you are see on an operating system from Windows.


    The best user for KDE is going to be someone who does not want to learn a new
    desktop environment and is moving from a Windows system.


    ## Enlightenment


    Enlightenment is going to take on a completely different look and feel from the
    previous desktop environments we have discussed. Instead of start menus, you are
    going to see shelves that hold all of your menu options and applications.


    Enlightenment offers a clean look, but it is also configurable. But, you are going
    to have have some patience when it comes to customizing Enlightenment because
    it is so unique in its coding. The themes that are offered by Enlightenment are
    going to change the color and even the way that things are shaped on your desktop.


    If you are a user who is constantly changing your desktop environment and likes
    to change things to fit how you feel that day, then Enlightenment is the perfect
    desktop environment for you.


    ## XFCE


    XFCE is going to be the desktop you are going to use when you are working with
    older hardware because it is such a lightweight desktop. Not just that, but XFCE
    offers speed along with customization.


    You are going to want to be somewhat experienced with Linux if you are going to
    be using XFCE due to the configuration options that are available to you.


    ## Deepin Desktop

