    **Chapter Five**


    ![logo](images/00003.jpeg)


    **The Linux Desktop Environment**


    Linux allows you to have a choice as to which desktop you want to use. You need
    to think of the desktop in relation to how easy it is going to be for you to do
    the things that you are wanting to do with your new operating system.


    There are no set rules as to how you are going to figure out how to choose the
    best desktop for you, and ultimately it is going to be a personal decision. However,
    you need to make certain you do your research on each desktop that is available
    through Linux so that you can make the best decision.


    Every desktop that you have the option of choosing from is going to give you a
    unique experience and have many options that are going to make it to where you
    are able to do what you do on any other operating system.


    The desktops that you have a choice of choosing from are:


    •Deepin


    •Ubuntu unity


    •Xfce


    •Gnome 3


    •Enlightenment


    •Cinnamon


    •And kde


    **Ubuntu Unity**


    The ubuntu unity desktop is going to have a more modern interface that is going
    to allow the user to have access to the data that is on their desktop as well
    as having access to data from other remote sources.


    You are going to have the capability to quickly connect to your social media and
    other websites that you may tend to frequent. One of the things that you need
    to keep in mind when it comes to using ubuntu unity is that you are going to have
    to be a user that does not spend a lot of time going back and forth between your
    mouse and keyboard.


    Thanks to the Head Up Display you are going to be able to use your keyboard to
    switch between the various menus rather than having to continue to move to your
    mouse.


    The best user for ubuntu unity is someone who does not mind the desktop not being
    individualized to them but offers them access to any information that they may
    want at their fingertips.


    **GNOME 3**


    GNOME 3 offers a desktop environment that is full featured but does not show it
    on the desktop. You are going to be able to open up Dash to get to everything
    that GNOME3 has to offer you.


    With GNOME3 you are going to have the ability to work with how the desktop looks
    a little so that you are able to customize it to you and your preferences. In
    the end, GNOME3 is just like ubuntu unity except it allows the user to have a
    little more control of how their interface appears.


    GNOME3 is geared more for those who know how Linux works and want to have a desktop
    that is modern but can be customized to them.


    **Cinnamon**


    Cinnamon is a mixture of GNOME 2 and 3\. It still offers that modernized look,
    but you are going to now be using the customization feature of GNOME 3\. Cinnamon
    offers a more standard desktop look that is able to be changed through the use
    of adding effects or removing them if you do not like them.


    Cinnamon is going to be for those that want a standard desktop that they are able
    to tweak as they desire but makes it easier for them to navigate through their
    operating system as they would on any other operating system.


    **KDE**


    KDE offers a full desktop and has come to be one of the longest standing environments
    that Linux has to offer. KDE is one of the fastest desktops that you are going
    to be able to work with. Everything about this desktop revolves around the system
    tray.


    Just like the other environments, KDE offers a modern feel, but it is going to
    lean more towards the desktop that you are going to see on an operating system
    from Windows.


    The best user for KDE is going to be someone who does not want to learn a new
    desktop environment and is moving from a Windows operating system.


    **Enlightenment**


    Enlightenment is going to take on a completely different look and feel from the
    previous desktop environments that we have discussed. Instead of start menus,
    you are going to see shelves that hold all of your menu options and applications.


    Enlightenment offers a clean look, but it is also configurable. But, you are going
    to have to have some patience when it comes to customizing Enlightenment because
    it is so unique in its coding. The themes that are offered by Enlightenment are
    going to change the color and even the way that things are shaped on your desktop.


    If you are a user who is constantly changing your desktop environment and likes
    to change things to fit how you feel that day, then Enlightenment is the perfect
    desktop environment for you.


    **XFCE**


    XFCE is going to be the desktop you are going to use when you are working with
    older hardware because it is such a lightweight desktop. Not just that, but XFCE
    offers speed along with customization.


    You are going to want to be somewhat experienced with Linux if you are going to
    be using XFCE due to the configuration options that are available to you.


    **Deepin Desktop**'
