  raw: '•Kernel: the kernel is part of the whole Linux system. The kernel is the core
    of the operating system that is going to manage everything from the peripheral
    devices to the CPU. On the scale of how important the kernel is to the operating
    system, the kernel will be the lowest on the scale.


    •Graphical server: the graphical server controls the graphics that you see on
    the websites that you visit.


    •The shell: the shell is the command process that is going to enable you to give
    the computer commands through a text interface. When using Linux, you do not need
    to touch the command line.


    •Desktop environment: the desktop is what you are going to use as the user of
    the computer. Every desktop environment that you encounter is going to have various
    applications that are built into it that are going to be specific to that desktop.


    •Applications: these are the software titles that you can install on your computer.


    The first computers were first built to do single tasks in a series just like
    a calculator does. These operating systems were first developed in the 50’s so
    that different programs could be run in succession so that the processing could
    be sped up. It was not until the sixties that the modern and sophisticated operating
    systems were developed.


    Some of the hardware that was added were things such as parallel processing and
    runtime libraries. Whenever personal computers started becoming more popular in
    the 80’s, the operating systems evolved so that they could be used on these computers
    just as they were the larger computers that they were designed for.


    The earliest record of an electronic system that had no operating system came
    around in the 40’s. these electronic systems were programmed to switches that
    had to be switched on and off. Or they were hooked up to jumper wires that were
    then connected to plug boards. It was these systems that were made to generate
    ballistics tables that were used by the military or for payroll checks to be printed
    and controlled from the data that could be found on a paper card that had been
    punched by the worker for when they were at work and when they were not at work.


    **Chapter Three**


    ![logo](images/00003.jpeg)


    **Installing Linux and Learning the System**


    As mentioned above, you are going to be able to download Linux for free! Here
    are the steps that you are going to follow in order to download Linux onto your
    computer and begin using it!


    **Step One**: first download which Linux distribution that you want to use. Those
    who are new to Linux are going to want to stick to a distribution that is lightweight
    and user-friendly. Some of the choices that you have are going to be known as
    Ubuntu and Lubuntu.


    The ISO can be found on the website for the distributor, but you are going to
    need to burn it onto a USB drive or a CD if you have an empty disk before it can
    be installed on your computer. Placing it on an external storage device will create
    a live storage of the operating system.


    The live CD or USB is going to be what you boot the operating system off of, and
    most of the time you are going to get a version that will allow you to have a
    preview of the operating system that is going to run directly from that storage
    device.


    You will need to install an image burning program or use the one that is already
    on your operating system that you are currently using.


    **Step Two**: boot into your active storage device. A vast majority of computers
    are going to want to boot from your hard drive before anything else, so you are
    going to have to change the settings on your computer that are going to make it
    to where your computer boots into the live disk.


    After your computer has rebooted, you are going to press the indicated key that
    will get you into the boot menu.


    In the event that you are not able to get into the boot menu, you are going to
    have to go to the BIOS menu to access the boot menu. After you have gotten into
    this menu, you are going to select the live storage device that holds your copy
    of Linux. After you are done, you are going to save the changes that you made
    and exit the menu so that your computer can continue with the boot process.


    **Step Three:** before you install the Linux system, you are going to want to
    try it out so that you can see if it is the operating system for you. It is not
    going to be like using the full operating system, but you are going to be able
    to navigate the interface as if it was installed on your system so that you can
    get a feel for it.


    **Step Four:** install. Once you have done your trial with Linux, you are going
    to want to install it onto your computer. The installation is going to be started
    from the boot menu if you do not want to try the system out first.


    **Step Five:** set up an account. Linux is going to require that you have a username
    and a password so that you are able to get administrative access to the operating
    system in order to do administrative maintenance.


    **Step Six:** place your partition. If there is another operating system on your
    computer, you are going to have to set up a partition so that it is separated
    from the other operating system. This has to be done in the event that you are
    going to run both operating systems.


    **Step Seven:** boot Linux. After you have performed the installation process,
    you are going to reboot your system, and then a new screen is going to be displayed.
    This will be the boot loader for your new operating system. Make sure that you
    select the appropriate distro from the list. It is possible that you are not going
    to see this screen if you are running two operating systems. To get to this screen,
    you are going to hit shift after you see the manufacturer screen.


    **Step Eight:** double check the hardware on your computer. Most of your hardware
    is going to work with Linux, but you may need to install a few other drivers that
    are going to allow it to run as it should.


    **Step Nine:** begin using Linux.


    **Learning Linux**


    **Step One:** you should have already tried to become familiar with the system
    when you were in the installation process when you had the opportunity to try
    the operating system out and see if you wanted to use it.


    **Step Two:** try and do some of the things that you would usually use your computer
    for. Be sure to take note of the things that you can do and the things that you
    cannot do.


    **Step Three:** get to know the command interface. While the terminal may see
    scary, it is not something you should allow to stop you from using Linux. The
    command interface will make using Linux easier, and you are not going to be limited
    by the things that you are limited by when you are using Windows.


    **Step Four:** learn the Linux filing system. You are not going to have a C drive
    with Linux, but you are still going to have the directory where your files are
    going to be located. Instead of the c drive, you are not going to have them in
    the home directory followed by your username.


    **Chapter Four**


    ![logo](images/00003.jpeg)


    **Navigation of Linux**


    Since you are new to using Linux, you are going to need how to navigate through
    the new operating system. Some of the core competencies that you require are to
    move around the file system so that you can get a good idea of the new interface.


    **Figuring out where you are through the use of the pwd command**


    After you have logged into your desktop, you are going to be placed in the home
    directory. This home directory is going to be where all your files are located,
    and you are going to be able to create directories as you need them.


    In order to locate your home directory in relation to where all the other file
    systems are, you can use the pwd command. The pwd command will show you which
    register you are currently using.


    After using the pwd command, you should get a result of /home/user account.'
