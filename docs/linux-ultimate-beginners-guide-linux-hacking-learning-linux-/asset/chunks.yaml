    最后一组命令是包含运行环境的命令。当使用这些命令时，系统将在内存库中持有未知数量的实例。内存库中的信息被称为环境，这些环境将是你的文件名、用户名等内容。你可以使用
    `set` 命令来查看此组中的所有环境。


    你的环境命令还包括 shell 函数和别名（aliases）。


    ### 别名 (Aliases)


    为了创建一个别名，你应该处于主目录并打开你的文本编辑器。你需要打开配置文件（profile document）并将别名添加到文件的末尾。


    每当你登录电脑时，shell 都会执行你的该文件。`alias` 命令将创建一个新命令，该命令可以执行其他命令。当你尝试使用你的新命令时，你应该先注销系统并重新登录。通过
    `alias` 命令，你拥有了创建你所独有的自定义命令的能力。


    `alias` 命令是内置在 shell 中的，这让你有机会直接在命令行提示符中创建你的别名，但它们是不会持久的。每当你退出当前正在使用的 shell 会话时，它们就会被擦除。


    ### Shell 函数 (Shell functions)


    Shell 函数比别名函数更复杂。将 shell 函数理解为脚本内部的脚本会更容易。你可以获取之前创建的别名文件，并在文本编辑器中将其替换为 shell 函数。


    你应该知道，`function` 也是内置在 shell 中的命令，就像 `alias` 一样，所以如果你想让命令仅在当前会话中有效，请将命令输入到命令行提示符而不是文本编辑器中。


    ## 第十二章


    ![logo](img/00003.jpeg)


    ### Linux 使用技巧与技巧


    在本书的后续章节中，你已经学习了什么是 Linux 以及你可以用它做的各种事情。然而，虽然 Linux 看起来用起来很简单，但你仍然想知道一些让使用 Linux
    变得更简单的技巧。你在本章中看到的代码将是你用来让这些技巧为你提供服务的语法！


    1. 查看不是由你运行的进程。


    如果你在你的机器上做某些事情，并发现在正在玩激烈的在线游戏时，你的电脑冻结了。你的第一个疑问将是电脑发生了什么导致了这种情况。答案是另一个用户可能正在占用你电脑运行游戏所需的
    CPU。


    要查看正在运行但不是你运行的进程，你需要在命令行提示符中输入以下代码：


    ```

    Ps aux | grep -v ‘whoami.’

    ```


    使用这段代码将调出你电脑上所有占用 CPU 的进程。但是，这也包含了所有在后台运行的进程。所以，为什么不对进程进行排序，以便看到占用 CPU 最高的前十个进程呢？你在提示符中输入此语法：


    ```

    Ps aux - - sort = % cpu | grep – m 11 – v ‘whoami’

    ```


    你可能想在根目录下运行此命令，以便过滤掉后台进程。现在你有了这些杀掉 CPU 的进程，你就能关闭它们并回到你的游戏了！


    2. 在多个文件中替换相同的文本


    在某些时刻，你需要获取相同的文本并在多个位置更改它。你有几种选项可以实现这一点。


    当你尝试在当前工作目录下的所有文件中替换文本时：


    ```

    Perl -i -pe ‘s/windows/Linux/; ‘ test *

    ```


    为了在目录及其子目录中将文本从 windows 更改为 Linux，将使用以下代码：


    ```

    Find. – name’ * .txt’ – print | xargs perl – pi -e’s/windows/Linux/ig’ * .txt

    ```


    或者，如果你尝试在普通文件上替换文本，可以使用此语法。


    ```

    Find – type f – name ‘ * .txt’ -print0 | xargs - - null perl – pi – e ‘s/windows/Linux/’

    ```


    3. 异常的终端 (Wonky terminals)


    有时你会犯错，并需要修复当前正在操作的终端，使其恢复到应有的状态。当你的终端混乱时，你会听到哔哔声，可能会在显示器上看到一些奇怪的颜色。你只需要输入 `reset`
    单词，就能回到正常工作的终端。


    4. Mozilla 关键字 (Mozilla keywords)


    使用 Firefox，你可以选择输入你想要在互联网上搜索的内容，并获得在该浏览器上可以找到的所有结果。为了实现这一点，你需要进入书签并管理书签。从那里，你可以添加一个带有想要搜索的
    URL 的新书签。


    将其放入书签后，你需要获取属性并输入你想要输入的关键词，以便获得搜索结果。URL 中的百分号将将被替换为你的关键词。


    这个技巧可以用于任何你想要快速访问的网站。


    你也可以右键点击搜索字段，并选择“将关键字添加到此搜索”选项；会弹出一个对话框。


    5. 运行多个会话 (Running multiple sessions)


    有时你会与某人共享 Linux，你必须注销他们的会话并重新登录你的。但你不需要每次都这样做。在假设你的电脑是以图形模式启动的情况下，你可以同时按下 control、alt
    和 f1 键，你将得到一个登录提示符。这就是你准备好输入登录信息的地方。之后，你需要运行此语法：


    ```

    Startx - - : 1

    ```


    现在你的电脑应该回到图形环境。当另一个人想使用你的电脑时，他们将使用相同的组合键，只不过他们将按下 f7。当你重新登录时，你执行 `f8`。


    你的 `f1` 到 `f6` 键是标识控制台会话的键，而 `f7` 到 `12` 标识会话。并不是每一个发行版都是这样工作的；你可能需要根据你的发行版使用不同的按键。

