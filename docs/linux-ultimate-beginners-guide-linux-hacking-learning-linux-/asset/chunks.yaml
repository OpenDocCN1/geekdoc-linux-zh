    Should you modify the boot process so that you can have this command, you are
    going to get the correct time every time that your computer is booted up.


    ### 9. Locating big files


    One of the most common problems you are going to find that you have files that
    contain a lot of data that have to be gotten rid of. To do this, you can utilize
    one of these three codes.


    To locate the largest file in the directory, you are currently in:


    ```

    ls -lsrh

    ```


    The `r` that is listed inside of the code is going pull the biggest files and
    put them at the end while the `h` makes it to where you get a readout of how big
    the file is.


    To find MP3 and MPEG files:


    ```bash

    ls -lsrh *.mp*

    ```


    ### 10. Nautilus shortcuts


    Linux has made it to where many file managers are supposed to be used with your
    mouse, but there may be times that you cannot use your mouse or are doing something
    that requires your fingers to stay on your keyboard. There are a few keyboard
    shortcuts that Nautilus offers so that you can find these files.


    - Your `arrow keys` are going to move to the folder that you are located in.

    - `Control` and `L` are going to open a new location.

    - `Control` and `up` will open the parent folder of the current folder you have
    open.


    ### Conclusion


    ![logo](images/00003.jpeg)


    Thank for making it through to the end of `Linux`, let’s hope it was informative
    and able to provide you with all of the tools you need to achieve your goals whatever
    it may be.


    The next step is to download Linux and begin using it in a way that makes your
    work more efficient!


    Linux may still be a little daunting, but you should not let this stop you from
    using Linux. As you have learned in this book, Linux offers more than many other
    operating systems do and you ae going to discover that Linux will ultimately change
    how you use the computer.


    My hope as the author of this book is that you find Linux as useful as I did and
    that you enjoy all of the features that Linux will give you that other operating
    systems are not able to.


    Thank you and good luck!


    Finally, if you found this book useful in any way, a review on Amazon is always
