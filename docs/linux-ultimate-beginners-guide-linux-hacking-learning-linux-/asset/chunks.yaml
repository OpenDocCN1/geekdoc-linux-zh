- fmt: '

    The last group of commands will be the commands that include runtime environments.
    When using these commands, the system is going to be holding an unknown number
    of facts in the memory bank. The information that is in the memory bank is known
    as the environment, and these environments are going to be things like the names
    of your files, your user names, so on and so forth. You can use the `set` command
    to be able to see all of the environments that are in this group.


    Your environment commands are also going to include shell functions and aliases.


    ### Aliases


    In order to make an alias, you should be in the home directory and have your text
    editor opened. You will need to open up the profile document and add the alias
    to the end of the file.


    Your file is going to be executed by shell each time that you log on on your computer.
    The `alias` command is going to create a new command which is going to be able
    to perform other commands. When you attempt to try out your new command you should
    log out of your system and back in first. With the `alias` command, you have the
    ability to create custom commands that are going to be unique to you.


    The `alias` command is built into the shell, and this gives you the chance to
    create your aliases in the command prompt directly, but they are not going to
    last. Whenever you log out of the shell session you are currently using, it is
    going to be erased.


    ### Shell functions


    Shell functions are going to be more complex than an alias function. It is easier
    to think of shell functions as scripts inside of scripts. You can take the alias
    file that you created earlier and replace it with a shell function in your text
    editor.


    You should know that `function` is a command that is built into the shell as well
    just like `alias` is so if you want to make the command last just for your current
    session, enter your command into the command prompt rather than into your text
    editor.


    ## Chapter Twelve


    ![logo](images/00003.jpeg)


    ### Tips and Tricks to Use with Linux


    Throughout the pages of this book you have learned what Linux is and the various
    things that you are going to be able to do with it. However, while Linux seems
    pretty simple to use, you are still going to want to know some tips that are going
    to make using Linux easier. The coding that you see in this chapter is going to
    be the syntax that you are going to use to make these tips and tricks work for
    you!


    1. Look at the processes that are not being run by you.


    If you are doing something on your machine and find that while you are in the
    middle of that intense online game, your computer freezes. Your first inquiry
    is going to be what has happened to your computer to make it do this. The answer
    is that another user could be taking some of the CPU that your computer needs
    to run the game that you are playing.


    To look at the processes that are being run, but not by you, you will need to
    enter this code into your command prompt:


    ```

    Ps aux | grep -v ‘whoami.’

    ```


    Using this code is going to pull up all of the processes that are taking up CPU
    on your computer. But, this is going to all of the processes that are running
    in the background as well. So, why not sort out the processes so that you can
    see the top ten processes that are taking up the most CPU. You will enter this
    syntax into your prompt.


    ```

    Ps aux - - sort = % cpu | grep – m 11 – v ‘whoami’

    ```


    You are probably going to want to run this command out of your root directory
    so that you are getting the background process filtered out. And now that you
    have these CPU killing processes, you are going to be able to shut them down and
    get back to your game!


    2. Replacing the same text across several files


    There are going to be moments that you need to take the same text and change it
    in several locations. You have a few options to do this.


    When you are trying to replace text in all of the files in the directory that
    you are currently working in:


    ```

    Perl -i -pe ‘s/windows/Linux/; ‘ test *

    ```


    In order to change the text from windows to Linux in the directory and its subdirectories
    will be this code:


    ```

    Find. – name’ * .txt’ – print | xargs perl – pi -e’s/windows/Linux/ig’ * .txt

    ```


    Or, if you are trying to replace text on regular files you can use this syntax.


    ```

    Find – type f – name ‘ * .txt’ -print0 | xargs - - null perl – pi – e ‘s/windows/Linux/’

    ```


    3. Wonky terminals


    Sometimes you make mistakes and need to fix up the terminal that you are currently
    working on so that it goes back to the way that it is supposed to be. You are
    going to be hearing a beeping when your terminal is messed up, and you may see
    some odd colors across your display. All you are going need to do is enter the
    word `reset`, and you are going to be back to working with a terminal that works
    properly.


    4. Mozilla keywords


    With Firefox you are going to have the option to type in what you are wanting
    to search the internet for, and you are going to getting all of the results that
    can be found on that browser. In order to do that, you ned to go to your bookmarks
    and manage your bookmark. From there you will add a new bookmark with the URL
    that you want to be searched.


    After it has been put into your bookmarks, you will need to get ahold of the properties
    and enter the keyword that you want to be able to type in so that you get your
    search results. The percentage sign that you see in the URL is going to be replaced
    with your keyword.


    This trick can be used on any website that you are wanting quick access to.


    You also can right-click on the search field and go to the option add keyword
    to this search; a dialog box is going to appear.


    5. Running multiple sessions


    Sometimes you share your Linux with someone, and you are going to have to sign
    out of their session and sign back yours. But, you do not have to do this every
    time. Working under the assumption that your computer is started in graphical
    mode, you are going to be able to press the keys control, alt, and f1 at the same
    time and you are going to get a prompt to log into. This is where you are going
    to be ready to enter your login information. After that, you need to run this
    syntax:


    ```

    Startx - - : 1

    ```


    Now your computer should be back in the graphical environment. When the other
    person wants to use your computer, they will use the same key combination except
    that they are going to press f7. When you log back in, you will do `f8`.


    Your `f1` through `f6` keys are going to be the keys that identify the console
    sessions while `f7` through 12 identify sessions. Not every distribution is going
    to work this way; you may have a different set of keys you have to hit based on
    your distribution.


    6. Faster browsing


    With KDE you are going to have the option to speed up your web browsing. You will
    pull up the control center for KDE and then go to the system option. From here
    you are going to go to KDE performance. Now you have the option to select the
    Konqueror instances that have been preloaded into the distribution.


    Konqueror is going to automatically start when you start your computer but will
    be hidden until it is being used.


    7. Backing up your website


    To back up a directory on your computer, you need to copy the files that have
    been changed over to the location you have chosen to back it up. You can also
    use a `rsync` tool that will do this for you automatically. However, an account
    is going to be required on the other computer that you are backing your files
    up to.


    8. Keeping the clock on the proper time


    There may be times that your clock is not on the correct time. You will need to
    use an `NTP` tool so that you can get your clock synchronized with the proper
    accuracy. First, you have to install the `NTP` tool that is going to include the
    `NTP` package. From here you are going to be able to synchronize with a server.
    The code you are going to use is:


    ```

    Ntpdate NTP. Blueyonder.Co. Uk

    ```

