    如果你修改了启动过程以包含此命令，那么每次电脑启动时你都会获得正确的时间。


    ### 9. 定位大文件


    你将会遇到的最常见问题之一是，你有一些包含大量数据必须被删除的文件。要做到这一点，你可以利用以下三段代码之一。


    要查找当前所在目录中最大的文件：


    ```

    ls -lsrh

    ```


    代码中列出的 `r` 将把最大的文件提取并放在末尾，而 `h` 则能让你读到文件的大小信息。


    要查找 MP3 和 MPEG 文件：


    ```bash

    ls -lsrh *.mp*

    ```


    ### 10. Nautilus 快捷键


    Linux 的设计使得许多文件管理器本应配合鼠标使用，但在某些情况下，你可能无法使用鼠标，或者正在进行某些需要手指不离开键盘的操作。Nautilus 提供了了一些键盘快捷键来帮助你找到这些文件。


    - `arrow keys`（方向键）将移动到你所在的文件夹。

    - `Control` 和 `L` 将打开一个新的位置。

    - `Control` 和 `up` 将打开你当前打开的文件夹的父文件夹。


    ### 结论


    ![logo](img/00003.jpeg)


    感谢你坚持到 `Linux` 之旅最后，希望这些内容提供了丰富的信息，并能够为你提供实现目标所需工具，无论你的目标是什么。


    下一步是下载 Linux 并开始以让你的工作更高效的方式使用它！


    Linux 可能仍然让人感到有些畏畏，但你不应该让这阻止你使用 Linux。正如你在这书中中学到的，Linux 提供的功能比许多其他操作系统都要，你将会发现
    Linux 最终将改变你使用电脑的方式。


    作为本书的作者，我希望你发现 Linux 像我一样有用，并享受 Linux 提供的所有其他操作系统无法提供的功能。


    谢谢你并祝你好运！


    最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在 Amazon 上的评价！

