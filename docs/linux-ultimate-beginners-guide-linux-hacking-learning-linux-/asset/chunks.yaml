- fmt: '

    Snappy is the operating system that you are going to use when you are working
    with Internet of Things. Essentially this operating system is going to be able
    to turn your household appliances into smart devices.


    ## Linux Mint Cinnamon


    If you are working on a powerful desktop or laptop, you are going to want to look
    into this Linux operating system. Cinnamon works on LTS so that it is more stable;
    however, you may still experience some crashes that the developers of Cinnamon
    are working on.


    ## Steam OS


    Many users run Steam OS with Windows so that they are able to play games. But,
    with `Steam OS` you are going to make it to where you do not have to dual run
    operating systems anymore in order to play your games no matter what platform
    you are using.


    ## Tails


    Privacy is a big deal to many people, especially with so many people tracking
    your movements on the internet. Therefore, if you are wanting to keep people out
    of the things that you are doing, then you are going to need an operating system
    that is going to make this possible.


    Tails was created with privacy in mind so that you can do whatever you are wanting
    to do on your operating system without anyone knowing what you are doing. It has
    been reported that this operating system is a threat to the mission that the NSA
    is on to keep tabs on the members of the United States.


    ## Chapter Eight


    ![logo](images/00003.jpeg)


    ## Installing a Firewall with Linux


    By default, Linux Ubuntu is not going to have a firewall installed. Many people
    already have a firewall on their computer, but sometimes they do not, and you
    are going to need a firewall to help with the security on your computer. With
    Ubuntu, you are going to have at least two packages that you are going to be able
    to choose from for a firewall.


    ### Lokkit


    Lokkit is going to be a basic firewall, and it is not going to be hard to configure
    the firewall. The first thing that you need to do is run Lokkit with superuser
    privileges by opening the run command and entering `gksudo gnome-lokkit`. Once
    it comes up you going to be requested to enter your password before going any
    further. Once the password has been inserted, a dialog box will appear asking
    if you want to configure a firewall.


    The wizard that walks you through installing Lokkit is going to be explained on
    the screen. It is recommended that you use the high-security option on your firewall.
    The only time you are not going to want to choose this option is if you are doing
    DCC file transfers to IRC. Another reason you will not choose high security is
    if you are using the `DHCP` in order to get an IP address from cable or DSL modems.


    Whenever the setup wizard asks about turning `DHCP` on, you are going to want
    to click yes. For those using DSL or cable modems, you are going to to have your
    IP address pulled up through the use of `DHCP`.


    As long as your computer is the only computer that is on the network, then you
    do not necessarily have to enable the services that the firewall is going to provide.
    It does not matter if you click no or not; the `SSH` is going to be left open
    to any machines that are on the network you are using. You just need to make sure
    you click yes whenever Lokkit asks about trusted hosts that may be on your network’s
    interface.


    Lokkit is going to ask some more questions about the security that it should offer
    for your computer before the firewall is going to be enabled. Make sure you are
    saving the changes that you make before you start the firewall.


    Should you ever believe that you are having problems with your firewall, you are
    going to need to rerun Lokkit so that you get rid of all of the rules that the
    firewall has set into place.


    ### Guarddog


    You are going to need to open the run dialog box and enter `gksudo guarddog` so
    that guarddog is opened. You do not have to be a superuser to run this firewall,
    but there are going to be special rules that you will have to apply to the firewall
    if you are wanting to use it as a super user.


    This firewall is going to be more complex than the one that we just discussed.
    You are going to see this whenever you start guarddog. The first thing that you
    are going to notice is that there are tabs and in these tabs are going to have
    the settings that are going to allow you to define the various rules that the
    firewall is going to have to abide by.


    Guarddog is going to come with two zones that are already configured. They are
    the internet zone and the one that is set up for all of the IP addresses that
    appear but do not match any of the other zones.


    The guarddog firewall is going to take some time for you to set up correctly because
    there are all kinds of settings that you are going to have to go through, but
    it is going to give you a complete sense of protection on your new operating system.


    ## Chapter Nine


    ![logo](images/00003.jpeg)


    ## File Management


    The files that you keep on your operating system are going to be important to
    you as they are things that you are going to need access to at various points
    in time. Since Linux runs off a command prompt, you will need to enter the command
    that you want the operating system to execute.


    The files that are located on Linux are going to be placed together based on the
    purpose of what the purpose of the file is. Ultimately, all of the files are going
    to be under the root directory.


    The root directory is going to be the home directory where you are going to start
    out when you are looking for a particular file or directory.


    `Home` is going to be where all of your main directories are. These are going
    to be directories for things such as `samba` and `HTTP`.


    `Bin` is the commands that you are going to need to enter when your computer is
    booting up. This is typical commands that an average user will be using.


    `Sbin`: the commands that are going to be used by normal users but are going to
    be run by Linux specifically.


    `Proc`: the `proc` file system will not be located on a disk. Instead, it is a
    file system that will be located in the imagination of the kernels on the Linux
    memory system.


    `Usr`: this directory is going to have everything that you are going to use for
    normal operations on your computer. This directory will also include the `bin`
    and `sbin` file systems along with `include` which is going to be the files for
    the `C` programming language. `Lib`, the files that are not going to change the
    data for any programs or subsystems. `Local`, where all of your local software
    is going to be stored. `Man`, the manual pages for your computer. `Info`, the
    information documents.


    `Boot`: any files that are used that are related to the bootstrap loaded as well
    as any kernel images that are on the computer will be located in this file.


    `Lib`: libraries that are shared by programs.


    `Dev`: the files that are on the device.


    `Etc`: any files that have to be configured specifically to the machine that is
    being used.


    `Var`: files that are for printers, man pages, and temp files will be under this
    library.


    `Mnt`: when temporary mounts need to be placed on the system, they are going to
    be located in this library.


    `Tmp`: any files that are temporarily set up after you begin the bootup.


    ## Commands for managing your files and viewing them


    `Cd`: your current directory will be changed. If you do not put an argument in,
    then the home directory will be changed too.


    `Apropos`: you will be able to search databases for files that have specific strings.


    `Bdflush`: any dirty buffers are going to be placed on the memory by the kernel’s
    daemons.


    `File`: the file type will be determined as well as which library it needs to
    go to.


    `Chown`: the owner of a particular file will be changed


    `Dircolors`: colors for the `ls` command are going to be set up.


    `Chgrp`: the group that you are currently looking at is going to be changed.


    `Dir`: all the contents of the directory are going to be listed out.


    `Cksum`: when this command is entered, the bytes that are on that file are going
    to be counted.

