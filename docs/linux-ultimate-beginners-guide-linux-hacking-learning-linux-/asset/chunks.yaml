- fmt: "\n- **Kernel**: the kernel is part of the whole Linux system. The kernel is\
    \ the core of the operating system that is going to manage everything from the\
    \ peripheral devices to the CPU. On the scale of how important the kernel is to\
    \ the operating system, the kernel will be the lowest on the scale.\n- **Graphical\
    \ server**: the graphical server controls the graphics that you see on the websites\
    \ that you visit.\n- **The shell**: the shell is the command process that is going\
    \ to enable you to give the computer commands through a text interface. When using\
    \ Linux, you do not need to touch the command line.\n- **Desktop environment**:\
    \ the desktop is what you are going to use as the user of the computer. Every\
    \ desktop environment that you encounter is going to have various applications\
    \ that are built into it that are going to be specific to that desktop.\n- **Applications**:\
    \ these are the software titles that you can install on your computer.\n\nThe\
    \ first computers were first built to do single tasks in a series just like a\
    \ calculator does. These operating systems were first developed in the 50’s so\
    \ that different programs could be run in succession so that the processing could\
    \ be sped up. It was not until the sixties that the modern and sophisticated operating\
    \ systems were developed.\n\nSome of the hardware that was added were things such\
    \ as parallel processing and runtime libraries. Whenever personal computers started\
    \ becoming more popular in the 80’s, the operating systems evolved so that they\
    \ could be used on these computers just as they were the larger computers that\
    \ they were designed for.\n\nThe earliest record of an electronic system that\
    \ had no operating system came around in the 40’s. these electronic systems were\
    \ programmed to switches that had to be switched on and off. Or they were hooked\
    \ up to jumper wires that were then connected to plug boards. It was these systems\
    \ that were made to generate ballistics tables that were used by the military\
    \ or for payroll checks to be printed and controlled from the data that could\
    \ be found on a paper card that had been punched by the worker for when they were\
    \ at work and when they were not at work.\n\n## Chapter Three\n\n![logo](images/00003.jpeg)\n\
    \n## Installing Linux and Learning the System\n\nAs mentioned above, you are going\
    \ to be able to download Linux for free! Here are the steps that you are going\
    \ to follow in order to download Linux onto your computer and begin using it!\n\
    \n### Step One\n first download which Linux distribution that you want to use.\
    \ Those who are new to Linux are going to want to stick to a distribution that\
    \ is lightweight and user-friendly. Some of the choices that you have are going\
    \ to be known as Ubuntu and Lubuntu.\n\nThe ISO can be found on the website for\
    \ the distributor, but you are going to need to burn it onto a USB drive or a\
    \ CD if you have an empty disk before it can be installed on your computer. Placing\
    \ it on an external storage device will create a live storage of the operating\
    \ system.\n\nThe live CD or USB is going to be what you boot the operating system\
    \ off of, and most of the time you are going to get a version that will allow\
    \ you to have a preview of the operating system that is going to run directly\
    \ from that storage device.\n\nYou will need to install an image burning program\
    \ or use the one that is already on your operating system that you are currently\
    \ using.\n\n### Step Two\nboot into your active storage device. A vast majority\
    \ of computers are going to want to boot from your hard drive before anything\
    \ else, so you are going to have to change the settings on your computer that\
    \ are going to make it to where your computer boots into the live disk.\n\nAfter\
    \ your computer has rebooted, you are going to press the indicated key that will\
    \ get you into the boot menu.\n\nIn the event that you are not able to get into\
    \ the boot menu, you are going to have to to the BIOS menu to access the boot\
    \ menu. After you have gotten into this menu, you are going to select the live\
    \ storage device that holds your copy of Linux. After you are done, you are going\
    \ to save the changes that you made and exit the menu so that your computer can\
    \ continue with the boot process.\n\n### Step Three\nbefore you install the Linux\
    \ system, you are going to want to try it out so that you can see if it is the\
    \ operating system for you. It is not going to be like using the full operating\
    \ system, but you are going to be able to navigate the interface as if it was\
    \ installed on your system so that you can get a feel for it.\n\n### Step Four\n\
    install. Once you have done your trial with Linux, you are going to want to install\
    \ it onto your computer. The installation is going to be started from the boot\
    \ menu if you do not want to try the system out first.\n\n### Step Five\nset up\
    \ an account. Linux is going to require that you have a username and a password\
    \ so that you are able to get administrative access to the operating system in\
    \ order to do administrative maintenance.\n\n### Step Six\nplace your partition.\
