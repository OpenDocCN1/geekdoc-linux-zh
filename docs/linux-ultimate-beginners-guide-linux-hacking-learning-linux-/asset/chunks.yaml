    ## Introduction


    ![logo](images/00003.jpeg)


    Congratulations on downloading `Linux` and thank you for doing so.


    The subsequent chapters will explain how you can download the Linux system and
    how to use it. The Linux system has its advantages that you are going to learn
    throughout the pages of this book.


    Hopefully, you find that using `Linux` is best for you and the work that you are
    doing! If anything, else, perhaps you will learn something new about `Linux` that
    you did not know before.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, and please enjoy!


    Note: `Linux` may not be for everyone, but this book is going to give you all
    of the information that you need to make an informed decision on if `Linux` is
    right for you. Just because you read this book does not mean that you have to
    download `Linux`, if you go through and look at the information plus you try the
    demo for `Linux` and find that you do not like it, that is entirely your choice!


    ## Chapter One


    ![logo](images/00003.jpeg)


    ### What is Linux?


    `Linux` is an operating system that can work on computers, smartphones, and even
    some household appliances.


    The Linux operating system has been around since the 90’s, and it has evolved
    into an operating system that spans across multiple continents, is used by many
    industries, and is user based. There are not many places that you are going to
    be able to look without finding some sort of trace of `Linux`.


    Most of the supercomputers that are being used to make some of the most historical
    scientific breakthroughs run as well as keeping the internet running so that we
    are able to enjoy it. However, even before the Linux operating system became the
    primary operating system, it was the most reliable operating system that allowed
    its users to use it without having any worries about the security issues that
    many other operating systems have.


    `Linux` is exactly like `Windows 7` and `Windows 8` operating systems. We will
    examine what an operating system is in the next chapter. If you do not have an
    operating system on your computer then your software is not going to function
    the way that it is supposed to.


    You may be wondering why you should choose `Linux` over one of the other operating
    systems. Installing `Linux` means that you have to learn an entirely new user
    interface when you most likely know how to. But, take a step back and look at
    the operating system that you are currently using. Do you have to repair your
    operating system continuously or does it frequently crash?


    With `Linux`, you are not going to have to deal with what you currently dealing.
    Linux evolves with the current computer technology thus making it one of the most
    stable ecosystems on the planet.


    Another added bonus to using `Linux` is that it is completely free. You are not
    going to have to pay anything for any licenses that you may have to pay when you
    are using a different operating system.


    Linux came from `Unix` operating system which was first started in 1969 by Ken
    Thompson, Joe Ossanna, Douglas McIlroy, and Dennis Ritchie. But, in 1971 `Unix`
    was released to the public a programming language that was comply assembled. As
    time went on, `Unix` was rewritten in the `C` programming language thus giving
    it a higher level of language implementations.


    ## Chapter Two


    ![logo](images/00003.jpeg)


    ### Operating Systems – What are they?


    Operating systems are the systems that are going to communicate with the hardware
    inside of the computer so that it can talk to the software and allow the computer
    to run the way that it is supposed to. Every program that you are going to use
    on your computer is going to run off of the operating system. The only exception
    is going to be firmware that you may be running on your computer.


    Operating systems that use a timeshare are going to schedule a variety of tasks
    to be done so that you can use the system more efficiently based on the resources
    that are frequently used.


    Every operating system is going to have these pieces that are going to come together
    to work and make the operating system whole. Without one of these pieces, your
    operating system may still work, but it may not necessary work the way that you
    want it to.


    - **Daemons**: the daemons are services that run in the background and are going
    to start up after your computer is booted up or after you have logged into the
    desktop.

    - **Bootloader**: this is the software that will manage whenever your computer
    boots up. For many users, it is a splash screen that is going to boot up the operating
    system so the computer can run.

