    ## Chapter Ten


    ![logo](images/0003.jpeg)


    ## System Administration and Security


    Once you have installed Linux, you are going to need to configure your systems,
    backup your files, monitor the system, and deal with updates. As the system administrator,
    you are going to know how to do things such as deal with storage media, managing
    memory on the operating system, booting and shutting down, and how to handle users
    that are on the system.


    ## Disks and storage


    After you have connected the operating system, you are going to create all of
    the files on your disk so that you have a place to store. Some of the things you
    are going to do with disks are to format them, move systems around so that you
    can form a tree, Partition a hard disk so that you can do different activities
    that are not going to work against each, but separately. You will also be able
    to make a file system on each disk that you have set up.


    There are two different devices that Linux is going to recognize: block devices
    and character devices. A few of the devices are going to be random while others
    are going to be access. Every device that you have on your file system is going
    to be represented. That way, when you create a device, the data will be inputted
    from the device it belongs to or sent to. This makes it where you do not have
    to have anything special in order to access the devices that you are using on
    the Linux system.


    ## Managing memory


    Linux has virtual memory which is when a disk is used as an extension of the RAM
    so that you have enough room to do what you need to do. Any contents that are
    placed on the hard disk for memory are going to be called upon later. As a user,
    you are not going to see where all of programs are saved because not all part
    of their memory is hiding on the hard disk. While managing the memory, you are
    going to have the option to create a memory swap which is going to swap the file
    that you have selected from where it is currently residing in the reserve space.


    ## Booting and shutting down


    Whenever you start your operating system, you are going to be participating in
    the act of booting it up. This is going to be when the image from the computer
    comes up during bootstraps. When the computer is going through its bootstrap process,
    it is going to pull up some code known as the bootstrap loader which will start
    the operating system so that it can be used. Every computer that you use is going
    to go through the bootstrap process differently. You need to follow the appropriate
    steps to make sure that you shut the Linux system down. If you do not do your
    shutdown properly, you are going to end up causing your files to become scrambled
    and your operating system is going to end up messed up. It is important to remember
    that the Linux system uses a disk cache that is not going to write everything
    onto the disk in one setting but is going to do it in intervals so that the performance
    of the operating system is superior to other systems. That is why it is essential
    to follow the proper shutdown procedures so that you are not wiping out any data
    that is being moved to the disk at that point in time.


    ## Security


    A great many people decide to use Linux because of the security that the server
    offers. Linux has not had any major problems when it comes to the security provided
    to its users. But, this does not mean that you do not need to keep an eye on the
    security of the system.


    ## The Linux system is not going to be immune to everything


    It is true that downloading a Linux distribution is going to be more secure than
    if you were to download Windows out of a box that you just bought; however, due
    to the fact that Linux is free, there are going to be vulnerabilities that Linux
    is going to have. But, you are not going to find as many exploits as you will
    with another operating system. This does not mean that none are found, it just
    means there are less. If you are using Linux on a desktop, you are going to still
    be open to browser-based exploits such as a rootkit. The system does not necessarily
    have to be rooted in order for it to be disrupted in its operating. Therefore,
    you are going to still need to have security in mind as the system administrator
    so that you can protect yourself, your files, and your users.


    ## There is no obligation to have an antivirus


    Working with Windows, you are used to having an antivirus; however, when you move
    over to Linux, you are not going to need one. There are not many antiviruses out
    there that are going to work on a Linux operating system due to the fact that
    Linux does not display the same problems that Windows does when it comes to viruses
    and malware. If it makes you feel comfortable, you are going to be able to install
    an antivirus if you want. But, you are most likely not to get any results back
    when you scan your system because there will not be any threats on your system.
    Most attacks that Linux users are going to be open to are worms and cross-site
    scripting. Other attacks such as phishing attempts are going to be based on what
    the user decides to enter into the attack because you are going to be asked for
    personal information while you are on the internet and it is possible not to realize
    that you are being fooled by someone trying to hack into your computer.


    ## It is better to prevent than it is to cure


    If you have ever been the victim of a virus or malware, then you know that it
    is a lot easier just to maintain it so that it is running properly rather than
    to spend hours upon hours trying to get all of your information back after you
    have had a security breach. The first thing that you are going to want to do is
    to get on the email list for the vendor’s security list that way you are instantly
    alerted when there are problems with the distribution that you are using and how
    it can be fixed.


    If you are using a third party distributor, then you are going to probably see
    updates in security slower than if you were to use an upstream vendor.

