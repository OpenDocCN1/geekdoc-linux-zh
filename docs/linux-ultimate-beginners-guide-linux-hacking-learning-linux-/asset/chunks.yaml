    Deepin 是 Linux 系统上最新的桌面环境之一。它拥有最现代的设计感，同时汲取了 Linux 提供的其他所有环境的优点。


    GNOME 3 是激发 Linux 开发者创建 Deepin 的灵感来源。在所有你可以选择的桌面环境中，Deepin 将为你提供一个易于使用的控制面板，让你能够轻松找到导航桌面时所需的所有内容。


    这个桌面环境的完美用户将是任何人！你不需要任何 Linux 经验，而且 Deepin 将非常易于学习和使用！


    # 第六章


    ![logo](img/00003.jpeg)


    ## Linux 接口


    根据你使用 Linux 的目的，你将被允许使用几种不同的接口。API（应用程序编程接口）上的两个接口是内核用户空间和内核内部空间。


    Linux 上的 API 位于内核用户空间 API 中。这意味着系统上的程序将可以访问内核中的资源和服务。Linux 系统由系统调用接口和内核组成，内核允许通往
    `GNU C Library` 的子路由。


    Linux API 的开发者使得 API 能够提供符合 `POSIX` 定义规范的可用功能，以便其与其他虽然有用但并不一定由 `POSIX` 定义的功能保持兼容。


    Linux API 完全稳定，并且已经保持了数十年的稳定。这归功于源代码提供的稳定性。然而，虽然系统非常稳定且永远不会崩溃，但致力于系统开发的人员在向系统中引入新调用时非常保守。


    Linux 的所有开源软件都是免费的，并且专为 `POSIX` API 编写的。由于所有内容都必须通过 Linux 内核，由于在 API 中加入了许多额外功能，内核
    API 变得更加庞大。


    由于这些新增的功能，Linux API 具有技术优势，使其优于 `POSIX` API。一些最广为人知的例子是 `Weston` 和 `systemd`。许多使用
    Linux 的人毫不犹豫地表示，由于 Linux API 提供的优势，他们倾向于使用 Linux API 而不是 `POSIX` API。


    ### 系统调用接口


    系统调用接口是所有实现的基础，甚至为 Linux 内核内部的系统调用提供了支持。几个子系统将被授权定义它们自己的调用。


    ### C 标准库


    C 库将围绕 Linux 内核执行的系统调用展开。系统调用接口和 C 库的组合构成了整个 Linux API。


    ### Linux ABI


    ABI 是用于 ABI 的内核用户空间。ABI 代表应用程序二进制接口，当谈论 ABI 时，你指的是应用程序二进制接口，即机器代码中找到的所有二进制文件。


    任何作为机器二进制部分的代码都与指令集绑定在一起。当你尝试定义一个实用的 ABI 时，Linux 内核开发者和 C 库开发者不承担责任。相反，Linux 发行版和独立软件供应商将负责确保
    ABI 对用户来说是稳定的。


    # 第七章


    ![logo](img/00003.jpeg)


    ## 发行版


    Linux 发行版是根据所使用的内核和管理系统将所有软件收集的操作系统。大多数 Linux 用户将通过从其中一个 Linux 发行版下载来获取他们的操作系统。这些发行版为嵌入式设备、超级计算机和个人电脑提供了下载。


    在下载发行版时，你将下载内核、库文件以及确保操作系统按预期方式运行所需的任何额外工具。下载的绝大多数软件都是开源软件，并对下载它的用户免费。软件中编译的二进制文件以及源代码的编写方式使得你能够修改原始软件。


    大多数情况下，Linux 发行版会包含某些源代码中不可用的专有软件，这些内容是设备驱动程序等内容。发行版也可以描述为与 Linux 内核绑定在一起的应用程序和实用软件集合，以便在用户使用系统时满足他们的需求。


    就像桌面环境一样，你想要找到最适合你和你个人需求的发行版。


    ### openSUSE


    SUSE 公司将他们的 `openSUSE` 向其 `SLE` 靠拢，以便他们的用户获得一个与企业使用的服务器类似的发行版。你会发现 `openSUSE`
    与 `Ubuntu` 甚至 `CentOS` 相似。


    ### Arch Linux


    `Arch Linux` 允许用户学习关于 Linux 的所有知识，因为你必须手动安装一切，所以你能够接触到你正在安装的 Linux 操作系统的每一个部分。


    `Arch` 是定制化最高的发行版之一。在你习惯了 `Arch` 的设置后，你就能构建你想要的发行版。`Arch` 的坏处在于它可能存在任何交互问题。所见即所得。


    `Arch` 持续更新，以便用户能够运行 `Arch` 推出的软件包。用户还可以选择在软件发布前运行，但你将会运行不稳定的仓库。


    ### Elementary OS


    `Elementary OS` 主要关注系统的外观设计，因此它更倾向于设计师，让他们能够打造属于自己的系统。`Elementary OS` 的界面更接近 `Mac
    OS X` 的界面。


    ### Solus


    `Solus` 系统是由其开发者从零创建的，并不基于 `Ubuntu` 或 `Debian`。`Budgie` 桌面也是从零开发的，但它的运行方式与 `GNOME`
    相同。


    ### Chrome OS


    `Chrome OS` 更多基于浏览器而不是普通的操作系统，这对于那些经常在线的人来说是理想的。`Chrome OS` 不需要维护，并且定期更新以跟上互联网上最新的安全在线更新。`Chrome
    OS` 在 PC 和移动设备上都是流行的 Linux 系统。


    ### Ubuntu MATE


    如果你使用的是电池寿命不长或资源有限的笔记本电脑，`Ubuntu MATE` 是最佳选择。`Ubuntu MATE` 轻量，但缺少其他发行版具备的任何功能。`Ubuntu
    MATE` 针对笔记本电脑用户，并不意味着你不能在 PC 上做同样的事，它仅仅意味着它更适用于处于低端市场的系统。


    ### Lubuntu


    `Lubuntu` 通过使用 `LXDE` 适用于那些在旧硬件上工作的用户。


    ### Snappy Ubuntu Core


