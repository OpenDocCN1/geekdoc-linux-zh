  ## 第一章


  ![logo](img/00003.jpeg)


  ### 什么是 Linux？


  `Linux` 是一种可以在电脑、智能手机甚至某些家电器上运行的操作系统。


  Linux 操作系统自 90 年代以来一直存在，它已经进化成一种跨越大陆、被许多行业使用并以用户为中心的操作系统。在几乎任何地方，你都能找到某种 `Linux`
  的踪迹。


  大多数用于实现某些具有历史意义的科学突破的超级计算机，以及维持互联网运行的计算机都在运行 Linux。然而，即使在 Linux 操作系统成为主要的操作系统之前，它已经是最可靠的操作系统，允许用户在使用时无需担心许多其他操作系统可能存在的安全问题。


  `Linux` 与 `Windows 7` 和 `Windows 8` 操作系统一样。我们将在下一章检查什么是操作系统。如果你的电脑上没有操作系统，你的软件将无法按预期运行。


  你可能在想为什么要选择 `Linux` 而不是其他操作系统。安装 `Linux` 意味着你需要学习全新的用户界面，而你可能已经习惯了。但请回顾一下你正在使用的操作系统。你需要不断修复它吗？还是它会经常崩溃？


  使用 `Linux`，你不需要处理目前的问题。Linux 随着当前的技术的发展演进，使其成为世界上最稳定的生态系统之一。


  使用 `Linux` 的另一个额外优点它是完全免费的。当你使用不同的操作系统时，可能需要支付任何许可费用，而这里不需要。


  Linux 源自 `Unix` 操作系统，后者于 1969 年由 Ken Thompson、Joe Ossanna、Douglas McIlroy 和 Dennis
  Ritchie 创立。但在 1971 年，`Unix` 向公众发布了汇编语言。随着时间的推移，`Unix` 用 `C` 语言进行了重写，从而提供了更高层的语言实现。


  ## 第二章


  ![logo](img/00003.jpeg)


  ### 操作系统 – 它们是什么？


  操作系统是与计算机内部硬件通信的系统，以便硬件能与软件对话，并允许计算机按预期运行。你在电脑上运行的每个程序都运行在操作系统之上。唯一的例外是你可能运行在电脑上的固件。


  使用分时系统的操作系统会调度各种任务，以便你根据频繁使用的资源更高效地使用系统。


  每个操作系统都拥有这些共同工作并使操作系统完整的部分。缺少了其中任何部分，你的操作系统可能仍然运行，但可能无法以你想要的方式运行。


  - **守护进程 (Daemons)**：守护进程是在后台运行的服务，它们会在电脑启动或你登录桌面后启动。

  - **引导加载程序 (Bootloader)**：这是在电脑每次启动时进行管理的软件。对于许多用户来说，它是一个启动操作系统的启动界面，以便电脑能够运行。






  - **内核 (Kernel)**：内核是整个 Linux 系统的一部分。内核是操作系统的核心，负责管理从外围设备到 CPU 的一切。在内核对操作系统的重要性尺度上，内核处于该尺度的最底层。

  - **图形服务器 (Graphical server)**：图形服务器控制你在访问的网站上看到的图形内容。

  - **外壳 (The shell)**：外壳是一个命令处理进程，它允许你通过文本界面向计算机发出命令。在使用 Linux 时，你并不需要直接接触命令行。

  - **桌面环境 (Desktop environment)**：桌面环境是你作为计算机用户时将要使用的界面。你遇到的每一个桌面环境都会包含各种内置应用程序，这些程序是针对特定的桌面。

  - **应用程序 (Applications)**：这些是可以安装在计算机上的软件程序。


  第一批计算机的建造是为了执行一系列中的单项任务，就像计算器工作一样。这些操作系统最早开发于 50 年代，目的是让不同的程序能够相继运行，从而加快处理速度。直到
  60 年代，现代且复杂的操作系统才被开发出来。


  添加的一些硬件包括并行处理和运行时库等。每当个人电脑在 80 年代开始变得流行时，操作系统也随之进化，以便在这些计算机上使用，就像它们最初为设计的大型计算机一样。


  没有操作系统的电子系统最早记录可以追溯到 40 年代。这些电子系统被程序化到必须开启和关闭的开关上。或者它们连接到跳线器，然后连接到插线板。正是这些系统被用来生成军事使用的弹道表，或者用于打印和控制工资单，而这些数据可以从纸卡上找到，纸卡是由工人在工作期间和非工作期间打孔而成的。


  ## 第三章


  ![logo](img/00003.jpeg)


  ## 安装 Linux 和学习系统


  如上所述，你可以免费下载 Linux！以下是你按照这些步骤操作，将 Linux 下载到你的计算机上并开始使用！


  ### 第一步

  首先下载你想要使用的 Linux 发行版。Linux 初学者会倾向于选择轻量级且用户友好的发行版。你可以选择的一些版本包括 Ubuntu 和 Lubuntu。


  ISO 镜像可以在发行版的官方网站上找到，但在将其安装到计算机之前，你需要将其刻录到 U 盘或 CD（如果你有空光盘的话）。将其存放在外部存储设备上将创建一个操作系统的实时存储系统。


  实时版 CD 或 USB 将是你启动操作系统的介质，大多数情况下，你获得的版本将允许你预览该操作系统，该系统将直接从该存储设备运行。


  你需要安装一个镜像刻录程序，或者使用你当前正在使用的操作系统自带的程序。


  ### 第二步

  启动到你的活动存储设备。绝大多数计算机都会优先从你的硬盘启动，因此你必须更改计算机设置，使你的计算机能够从刻录盘启动。


  当你的计算机重启后，你需要按下指定的按键进入启动菜单。


  如果无法进入启动菜单，你必须进入 BIOS 菜单来访问启动菜单。进入此菜单后，选择存有你 Linux 副本的活动存储设备。完成后，保存你所做的更改并退出菜单，以便你的计算机继续启动过程。


  ### 第三步

  在安装 Linux 系统之前，你可能想先尝试一下，看看它是否是适合你的操作系统。这不像使用完整的操作系统，但你可以像它已安装在你的系统中一样导航操作界面，从而对它有一个直观感受。


  ### 第四步

  安装。一旦你完成了 Linux 的试用，你就会想将其安装到计算机上。如果你不想先试用系统，安装将从启动菜单开始。


  ### 第五步

  设置账户。Linux 要求你拥有用户名和密码，以便你能够获得操作系统的管理权限以进行管理维护。


  ### 第六步

  放置你的分区。如果你的计算机上还有另一个操作系统，你必须设置一个分区，使其与其他操作系统隔离开。在打算同时运行两个操作系统时，必须这样做。


  ### 第七步

  启动 Linux。完成安装过程后，你需要重启系统，然后会显示一个新屏幕。这将是你新操作系统的引导加载程序。确保你从列表中选择了合适的发行版。如果你正在运行两个操作系统，可能看不到此屏幕。要进入此屏幕，在看到厂商界面后按下
  Shift 键。


  ### 第八步

  双检你计算机的硬件。你的大部分硬件都能兼容 Linux，但你可能需要安装一些其他驱动程序，以便它能够正常运行。


  ### 第九步

  开始使用 Linux。


  ## 学习 Linux


  ### 第一步

  在安装过程中有机会尝试系统时，你应该已经开始熟悉它了。


  ### 第二步

  尝试做一些你平时使用计算机要做的事情。请注意哪些是可以做的，哪些是不能做的。


  ### 第三步

  熟悉命令行界面。虽然终端看起来可能吓，但你不应该让它阻碍你使用 Linux。命令行界面会让使用 Linux 变得更容易，而且你不会受到在使用 Windows 时那样的限制。


  ### 第四步

  学习 Linux 文件系统。Linux 中没有 C 盘，但你仍然有一个存放文件的目录。你的文件不在 C 盘中，而是位于主目录下，后面跟着你的用户名。


  ## 第四章


  ![logo](img/00003.jpeg)


  ## Linux 导航


  由于你是第一次使用 Linux，你需要学习如何在操作系统中导航。你所需的核心能力之一是在文件系统中移动，以便对新界面有一个良好的了解。


  ### 通过使用 `pwd` 命令确定你所在的位置


  当你登录桌面后，你将被放置在主目录下。这个主目录将是你所有文件的所在之处，你可以根据需要创建目录。


  为了确定主目录相对于其他文件系统的位置，可以使用 `pwd` 命令。`pwd` 命令将显示你当前所在的目录。


  在使用 `pwd` 命令后，你应该得到类似 `/home/user account` 的结果。





  每个主目录都将根据你正在使用的用户账户命名。由于主目录将位于目录结构的最顶端，它将是根目录。


  ## 搜索目录内容


  既然你现在已经能够进入目录，你只需要知道该目录中存放了哪些材料。由于你的根目录中不会有太多东西，因此你可能想要尝试寻找另一个目录。


  首先，你将在命令行提示符中输入 `cd /usr/share`，然后再次输入 `pwd` 命令。


  此时，你应该已经进入了一个新目录。为了查看此目录中的文件，你将使用 `ls` 命令。通过使用此命令，你将获得该目录下所有内容的列表，无论其中有多少项内容。你现在可以选择为命令添加一些标志（flags），以便你能够查找具有特定行为的文件。


  如果你想找到目录中的隐藏文件，你需要在你的命令提示符中添加 `-a`。请记住，用户目录内部实际上并没有真正的隐藏文件。大多数“隐藏”文件将是那些持有特殊指示器（如配置文件）的文件。


  你看到的点点项（dot entries）并不一定是目录，而是操作系统相对于其他目录而内置的方法。单点 `.` 代表你当前正在使用的目录，而双点 `..` 代表父级目录。


  ## 导航文件系统


  你已经进入了你的主目录，然后移动到了另一个目录。但是，让我们看看在你的新 Linux 系统上穿过文件系统时可以做的其他一些事情。


  使用 `cd /usr/share` 命令返回你的主目录。


  你刚刚使用的命令将为你提供通往目标目录的最直接的路径。Linux 中的所有文件和目录都位于根目录中，但会通过命令开头的斜杠 `/` 进行引用。


  绝对路径（Absolute paths）将向你显示文件在根文件系统中所在目录的位置。之所以存在绝对路径，是因为我们能够以最直接的方式引用这些目录，从而而确保你不会将该目录与另一个目录混淆。


  请记住，所有的绝对路径都必须以斜杠 `/` 开头。


  另一方面，你可以使用相对路径（relative path），它将显示相对于当前目录的目录。每当你尝试进入的目录在层级结构中靠近当前目录时，你就应该使用这种方法，因为这是你到达所需文件最简单、快捷的方法。当你的目录位于当前所在的目录内部时，你可以在不使用斜杠的情况下引用该目录的名字。


  ## 第章


  ![logo](img/00003.jpeg)


  ## Linux 桌面环境


  Linux 允许你选择想要使用的桌面。你需要根据桌面对于你想要在新操作系统上完成想做的事情有多么易于实现来考虑它。


  关于如何选择最适合你的桌面，并没有固定的规则，归根结底这取决于个人决定。但是，你需要确保对 Linux 提供的每种桌面都进行研究，以便做出最佳决策。


  可供选择的每种桌面都将为你提供独特的体验，并拥有许多选项，使你能够在任何其他操作系统上完成你所的操作。


  你可以选择的桌面有：


  * Deepin

  * Ubuntu unity

  * Xfce

  * Gnome 3

  * Enlightenment

  * Cinnamon

  * 以及 kde


  ### Ubuntu Unity


  Ubuntu unity 桌面将拥有更现代的界面，允许用户访问桌面上的数据，同时也可以访问来自其他远程源的数据。


  你将能够快速连接到你的社交媒体以及你可能经常访问的其他网站。在使用 Ubuntu unity 时，需要记住的一点是，你将成为一个不花费大量时间在鼠标和键盘之间来回切换的用户。


  得益于抬头显示（Head Up Display），你可以使用键盘在各种菜单之间切换，而不需要不断移动到鼠标。


  Ubuntu unity 的最佳用户是那些不介意桌面没有针对个人定制，但能让他们在指尖获取他们可能需要的任何信息的人。


  ### GNOME 3


  GNOME 3 提供了一个功能齐全的桌面环境，但它并没有在在面上。你可以打开 Dash（启动器）来获取 GNOME3 能为你提供的所有功能。


  通过 GNOME3，你将能够微调桌面的外观，以便根据你和你的喜好对其进行定制。归根结底，GNOME3 与 Ubuntu unity 相似，只是它允许用户对界面的显示有更多的控制权。


  GNOME3 更倾向于那些了解 Linux 如何工作，并希望拥有一个既现代又能为他们定制的桌面的人。


  ### Cinnamon


  Cinnamon 是 GNOME 2 和 3 的混合体。它仍然提供了现代化的外观，但你现在将使用 GNOME 3 的自定义功能。Cinnamon 了一种了一种更标准的外观，可以通过添加或删除效果来更改。


  Cinnamon 适用于那些想要标准桌面的用户，他们可以像在其他系统上一样对其进行调整。


  ### KDE


  KDE 提供了一个全功能的桌面，并且已经成为 Linux 提供的历史悠久的环境之一。KDE 是你能够操作的最快的桌面之一。这个桌面的一切都围绕着系统托展开。


  与其他环境一样，KDE 提供了现代感，但它更倾向于你在 Windows 系统上看到的桌面。


  KDE 的最佳用户是那些不想学习新桌面环境、正从 Windows 系统迁移过来的人。


  ### Enlightenment


  Enlightenment 与我们讨论过的桌面环境有着完全不同的外观和感受。比起启动菜单，你会看到包含所有菜单选项和应用程序的任务（shelves）。


  Enlightenment 提供了一种整洁的外观，但它也是可配置的。但在定制 Enlightenment 时，你需要一些耐心，因为它的编码非常独特。Enlightenment
  提供的主题将改变颜色，甚至是桌面上物品的形状。


  如果你是一个不断更换桌面环境并喜欢根据当天心情改变一切的用户，那么 Enlightenment 是最适合你的桌面环境。





  Deepin 是 Linux 系统上最新的桌面环境之一。它拥有最现代的设计感，同时汲取了 Linux 提供的其他所有环境的优点。


  GNOME 3 是激发 Linux 开发者创建 Deepin 的灵感来源。在所有你可以选择的桌面环境中，Deepin 将为你提供一个易于使用的控制面板，让你能够轻松找到导航桌面时所需的所有内容。


  这个桌面环境的完美用户将是任何人！你不需要任何 Linux 经验，而且 Deepin 将非常易于学习和使用！


  # 第六章


  ![logo](img/00003.jpeg)


  ## Linux 接口


  根据你使用 Linux 的目的，你将被允许使用几种不同的接口。API（应用程序编程接口）上的两个接口是内核用户空间和内核内部空间。


  Linux 上的 API 位于内核用户空间 API 中。这意味着系统上的程序将可以访问内核中的资源和服务。Linux 系统由系统调用接口和内核组成，内核允许通往
  `GNU C Library` 的子路由。


  Linux API 的开发者使得 API 能够提供符合 `POSIX` 定义规范的可用功能，以便其与其他虽然有用但并不一定由 `POSIX` 定义的功能保持兼容。


  Linux API 完全稳定，并且已经保持了数十年的稳定。这归功于源代码提供的稳定性。然而，虽然系统非常稳定且永远不会崩溃，但致力于系统开发的人员在向系统中引入新调用时非常保守。


  Linux 的所有开源软件都是免费的，并且专为 `POSIX` API 编写的。由于所有内容都必须通过 Linux 内核，由于在 API 中加入了许多额外功能，内核
  API 变得更加庞大。


  由于这些新增的功能，Linux API 具有技术优势，使其优于 `POSIX` API。一些最广为人知的例子是 `Weston` 和 `systemd`。许多使用
  Linux 的人毫不犹豫地表示，由于 Linux API 提供的优势，他们倾向于使用 Linux API 而不是 `POSIX` API。


  ### 系统调用接口


  系统调用接口是所有实现的基础，甚至为 Linux 内核内部的系统调用提供了支持。几个子系统将被授权定义它们自己的调用。


  ### C 标准库


  C 库将围绕 Linux 内核执行的系统调用展开。系统调用接口和 C 库的组合构成了整个 Linux API。


  ### Linux ABI


  ABI 是用于 ABI 的内核用户空间。ABI 代表应用程序二进制接口，当谈论 ABI 时，你指的是应用程序二进制接口，即机器代码中找到的所有二进制文件。


  任何作为机器二进制部分的代码都与指令集绑定在一起。当你尝试定义一个实用的 ABI 时，Linux 内核开发者和 C 库开发者不承担责任。相反，Linux 发行版和独立软件供应商将负责确保
  ABI 对用户来说是稳定的。


  # 第七章


  ![logo](img/00003.jpeg)


  ## 发行版


  Linux 发行版是根据所使用的内核和管理系统将所有软件收集的操作系统。大多数 Linux 用户将通过从其中一个 Linux 发行版下载来获取他们的操作系统。这些发行版为嵌入式设备、超级计算机和个人电脑提供了下载。


  在下载发行版时，你将下载内核、库文件以及确保操作系统按预期方式运行所需的任何额外工具。下载的绝大多数软件都是开源软件，并对下载它的用户免费。软件中编译的二进制文件以及源代码的编写方式使得你能够修改原始软件。


  大多数情况下，Linux 发行版会包含某些源代码中不可用的专有软件，这些内容是设备驱动程序等内容。发行版也可以描述为与 Linux 内核绑定在一起的应用程序和实用软件集合，以便在用户使用系统时满足他们的需求。


  就像桌面环境一样，你想要找到最适合你和你个人需求的发行版。


  ### openSUSE


  SUSE 公司将他们的 `openSUSE` 向其 `SLE` 靠拢，以便他们的用户获得一个与企业使用的服务器类似的发行版。你会发现 `openSUSE` 与
  `Ubuntu` 甚至 `CentOS` 相似。


  ### Arch Linux


  `Arch Linux` 允许用户学习关于 Linux 的所有知识，因为你必须手动安装一切，所以你能够接触到你正在安装的 Linux 操作系统的每一个部分。


  `Arch` 是定制化最高的发行版之一。在你习惯了 `Arch` 的设置后，你就能构建你想要的发行版。`Arch` 的坏处在于它可能存在任何交互问题。所见即所得。


  `Arch` 持续更新，以便用户能够运行 `Arch` 推出的软件包。用户还可以选择在软件发布前运行，但你将会运行不稳定的仓库。


  ### Elementary OS


  `Elementary OS` 主要关注系统的外观设计，因此它更倾向于设计师，让他们能够打造属于自己的系统。`Elementary OS` 的界面更接近 `Mac
  OS X` 的界面。


  ### Solus


  `Solus` 系统是由其开发者从零创建的，并不基于 `Ubuntu` 或 `Debian`。`Budgie` 桌面也是从零开发的，但它的运行方式与 `GNOME`
  相同。


  ### Chrome OS


  `Chrome OS` 更多基于浏览器而不是普通的操作系统，这对于那些经常在线的人来说是理想的。`Chrome OS` 不需要维护，并且定期更新以跟上互联网上最新的安全在线更新。`Chrome
  OS` 在 PC 和移动设备上都是流行的 Linux 系统。


  ### Ubuntu MATE


  如果你使用的是电池寿命不长或资源有限的笔记本电脑，`Ubuntu MATE` 是最佳选择。`Ubuntu MATE` 轻量，但缺少其他发行版具备的任何功能。`Ubuntu
  MATE` 针对笔记本电脑用户，并不意味着你不能在 PC 上做同样的事，它仅仅意味着它更适用于处于低端市场的系统。


  ### Lubuntu


  `Lubuntu` 通过使用 `LXDE` 适用于那些在旧硬件上工作的用户。


  ### Snappy Ubuntu Core





  Snappy 是你在处理物联网（Internet of Things）时使用的操作系统。本质上，这个操作系统能够将你的家用电器变成智能设备。


  ## Linux Mint Cinnamon


  如果你正在性能强大的台式电脑或笔记本电脑上工作，你可能想尝试这个 Linux 操作系统。Cinnamon 运行在 LTS（长期支持）版本上，因此更加稳定；不过，你可能仍然遇到一些
  Cinnamon 开发人员正在解决的崩溃问题。


  ## Steam OS


  许多用户在 Windows 上运行 Steam OS 以便玩游戏。但是，通过 `Steam OS`，你可以实现无论你使用什么平台，都不再需要双系统运行操作系统来玩游戏。


  ## Tails


  隐私对许多人来说非常重要，尤其是当有这么多人在追踪你在互联网上的活动时。因此，如果你想防止别人干涉你所做的事情，你需要一个能够实现这一点的操作系统。


  Tails 的创建考虑了隐私，因此你可以在操作系统上做任何你想做的事，而没有任何人知道你在做什么。据报道，这个操作系统对美国安全局（NSA）监控美国公民的任务构成了威胁。


  ## 第八章


  ![logo](img/00003.jpeg)


  ## 在 Linux 上安装防火墙


  默认情况下，Linux Ubuntu 并没有安装防火墙。许多人的电脑上已经安装了防火墙，但有时并没有，这时你需要一个防火墙来帮助保护电脑安全。在 Ubuntu
  中，你至少有两个软件包可以供选择防火墙。


  ### Lokkit


  Lokkit 是一个基础防火墙，配置该防火墙并不困难。你需要做的第一件事是以超级用户权限运行 Lokkit，即打开运行命令框并输入 `gksudo gnome-lokkit`。一旦它启动，你将在继续操作之前被要求输入密码。一旦输入密码，就会弹出一个对话框，询问你是否要配置防火墙。


  引导你安装 Lokkit 的向将在屏幕上进行说明。建议你在防火墙上使用“高安全性”选项。只有在向 IRC 进行 DCC 文件传输时，才不想选择此选项。另一个不选择高安全性的原因是你正在使用
  `DHCP` 从电缆或 DSL 调制器获取 IP 地址。


  每当设置向导询问是否开启 `DHCP` 时，你应该点击“是”。对于使用 DSL 或电缆调制器的用户，你将通过 `DHCP` 获取你的 IP 地址。


  只要你的电脑是网络上唯一的电脑，你就不一定需要启用防火墙提供的服务。无论你点击“否”还是否都没关系；`SSH` 将对你正在使用的网络上的任何机器保持开放。你只需要在
  Lokkit 询问可能位于你网络接口上的信任主机时，确保点击“是”。


  在启用防火墙之前，Lokkit 会向你询问关于它应该为你的电脑提供的安全性问题。确保在启动防火墙之前保存你所做的所有更改。


  如果你认为你的防火墙出了问题，你需要重新运行 Lokkit，以便清除防火墙设置的所有规则。


  ### Guarddog


  你需要打开运行对话框并输入 `gksudo guarddog` 以打开 guarddog。运行此防火墙不需要超级用户权限，但如果你想以超级用户身份使用它，则必须对防火墙应用一些特殊规则。


  这个防火墙比我们刚刚讨论的那个要复杂。每当你启动 guarddog 时，都会看到这个。你首先会注意到会有标签页，这些标签页包含了允许你定义防火墙必须遵守的各种规则的设置。


  Guarddog 自带有两个已经配置好的区域。一个是互联网区域（internet zone），另一个是为所有出现但不匹配任何其他区域的 IP 地址设置的。


  正确设置 guarddog 防火墙需要一些时间，因为你必须经过各种设置，但它将为你的新操作系统提供完整的安全保障。


  ## 第九章


  ![logo](img/00003.jpeg)


  ## 文件管理


  你保存在操作系统上的文件对你来说非常重要，因为你需要在不同时间点访问它们。由于 Linux 通过命令行界面运行，你需要输入你想让操作系统执行的命令。


  位于 Linux 上的文件将根据文件的用途进行分类。归根底，所有文件都位于根目录（root directory）下。


  根目录是你寻找特定文件或目录时开始的家目录（home directory）。


  `Home` 是所有主目录所在地。这些是用于如 `samba` 和 `HTTP` 等内容的目录。


  `Bin` 是你电脑启动时需要输入的命令。这些是普通用户会使用的典型命令。


  `Sbin` 是由 Linux 运行的命令，通常供系统管理员使用。


  `Proc` 系统的 `proc` 文件系统并不位于磁盘上。相反，它是位于 Linux 内存中的文件系统。


  `Usr` 目录包含了你在电脑上操作所需的所有内容。这个目录还包括 `bin` 和 `sbin` 文件系统，以及用于 `C` 语言的 `include` 目录。`Lib`
  是程序共享的库。`Local` 是存储所有本地软件的地方。`Man` 是电脑的手册页。`Info` 是文档。


  `Boot` 任何与引导相关的文件以及电脑上的任何内核镜像都位于此文件系统中。


  `Lib` 程序共享的库。


  `Dev` 设备上的文件。


  `Etc` 任何针对使用的机器进行特定配置的文件。


  `Var` 用于打印机、手册页和临时文件的在此目录下。


  `Mnt` 当需要在系统上临时挂载时，它们位于此目录下。


  `Tmp` 启动后临时设置的任何文件。


  ## 管理和查看文件的命令


  `Cd` 更改当前目录。如果你不提供参数，则将更改家目录。


  `Apropos` 你可以搜索数据库中包含特定字符串的文件。


  `Bdflush` 内核守护进程会将任何脏缓冲区放入内存中。


  `File` 将确定文件类型以及它需要进入哪个库。


  `Dircolors` 设置 `ls` 命令的颜色。


  `Chgrp` 更改你当前查看的组组。


  `Dir` 列出目录的所有内容。


  `Cksum` 当输入此命令时，将统计该文件的字节数。





  `Dd`: 文件将根据已设置的格式选项进行复制和转换。这也适用于磁盘和数据复制。


  `Cp`: 你选择的文件将从其当前位置复制并移动到另一个位置。


  ### 查找


  `~`: 你的搜索将遍历主目录及其所有的子目录。


  `-name report3`: 将定位到任何名为 report3 的文件。


  `-print`: 将打印该文件的完整文件路径。


  `Losetup`: 将设备的设置设置为循环设备。


  `Install`: 在设置其属性的同时，将复制几个不同的文件。


  `Ls`: 你将能够看到子目录中的所有内容。


  `Locate`: 将定位数据库中任何使用 `slocate` 查找的文件。


  `Ln`: 文件之间存在链接。


  `Sum`: 将运行检查并统计该文件内部的块数。


  `Mkdir`: 你将创建一个目录。


  `Stat(l)`: 将打印索引节点（inode）。


  `Mknod`: 将创建块设备或字符文件。


  `Slocate`: 当搜索特定文件时，将使用此代码。你将针对系统中的文件进行构建。


  `Mktemp`: 将创建临时文件。


  ## 第十章


  ![logo](img/0003.jpeg)


  ## 系统管理与安全


  一旦安装了 Linux，你将需要配置你的系统、备份文件、监控系统并处理更新。作为系统管理员，你将学会如何处理存储媒体、管理操作系统上的内存、启动和关机，以及如何处理系统中的用户。


  ### 磁盘与存储


  在连接操作系统后，你将在磁盘上创建所有文件，以便有一个存储数据的地方。你对磁盘进行的一些操作包括格式化它们、移动系统以形成树形结构、分区硬盘以便你可以进行不同的、互不干扰且独立运行的活动。你还可以在设置的每个磁盘上创建文件系统。


  Linux 将识别两种不同的设备：块设备和字符设备。一些设备是随机的，而另一些是顺序访问的。文件系统中的每一个设备都将被表示。这样，当你创建一个设备时，数据将从它所属的设备输入或发送。这使得你不需要任何特殊操作即可访问在
  Linux 系统上使用的设备。


  ### 内存管理


  Linux 拥有虚拟内存，即将磁盘作为 RAM 的扩展，以便你有足够的空间执行所需的操作。任何放置在硬盘上作为内存的内容稍后都会被调用。作为用户，你不会看到所有程序保存在哪里，因为并不是所有的内存都隐藏在硬盘上。在管理内存时，你有创建内存交换（swap）的选项，可以将你选择的文件从其当前所在的预留空间交换出去。


  ### 启动与关机


  每当你启动操作系统时，你都在参与启动它的过程。这是计算机镜像在自引导过程中出现的时候。当计算机经历引导过程时，它将调出某些称为“引导加载程序”（bootstrap
  loader）的代码，这将启动操作系统以便可以使用。你使用的每台计算机通过引导过程的方式各不相同。你需要遵循适当的步骤来确保关闭 Linux 系统。如果你不正常关机，最终可能会导致文件混乱，你的操作系统也会变得错乱。重要的是记住，Linux
  系统使用了磁盘缓存，它不会一次性地将所有内容写入磁盘，而是分间隔地进行，以确保操作系统的性能优于其他系统。因此，遵循正确的关机程序至关重要，这样你才丢失此时正在移动到磁盘的任何数据。


  ## 安全


  许多人决定使用 Linux 是因为服务器提供的安全性。在为用户提供安全性方面，Linux 没有出现过任何重大问题。但并不意味着你不需要关注系统的安全性。


  ### Linux 系统并不能对一切免疫


  诚然，下载 Linux 发行版比从新购买的机器上下载 Windows 要安全；然而，由于 Linux 是免费的，它将存在一些漏洞。但你不会像在其他操作系统那样发现这么多漏洞。这并不意味着没有漏洞，只是意味着较少。如果你在桌面上使用
  Linux，你仍然可能面临基于浏览器的漏洞，例如根内核包（rootkit）。系统的运行并不一定非要获取根权限才能被干扰。因此，作为系统管理员，你仍然需要注意安全，以便保护你自己、你的文件和你的用户。


  ### 没有义务使用杀毒软件


  在 Windows 上工作时，你习惯了使用杀毒软件；但当你迁移到 Linux 时，你不需要。并没有多少杀毒软件可以在 Linux 系统上运行，因为 Linux
  在病毒和恶意软件方面没有出现与 Windows 相同的问题。如果这让你感到安心，你可以根据需要安装杀毒软件。但当你扫描系统时，很可能得不到任何结果，因为系统中没有威胁。Linux
  用户面临的大多数攻击是蠕虫和跨站脚本。其他攻击（如钓鱼尝试）取决于用户决定输入攻击的内容，因为你在上网时可能会被要求提供个人信息，而可能并没有意识到正被试图黑入你电脑的人所欺骗。


  ### 预防胜于治疗


  如果你曾经做过病毒或恶意软件的受害者，你就知道，保持系统正常运行，比在发生安全泄露后花费数小时去尝试找回所有信息要容易得多。你可能想要做的第一件事是加入供应商的安全邮件列表，这样当你使用的发行版出现问题时，你就能立即收到提醒并知道如何修复。


  如果你使用的是第三方发行版，你看到的安全更新速度可能会比使用上游版本要慢。





  此外，请确保你的操作系统保持最新更新。你可能至少每周要运行一次更新，以便在需要某些安全补丁时能够更新所有内容，以确保你的安全。如果你不这样做，就会让自己暴露在攻击的风险之中。


  ### 用户权限与加密


  你也可以尽自己的一力，确保你的系统仅对那些需要使用系统的人开放。根据你所使用的发行版不同，提供的系统安全工具也会会有所不同。你需要去了解并学习这些工具位于何处以及如何使用它们，以便锁定你的系统，或者在不需要时关闭这些工具。


  了解 Linux 如何设置权限非常重要，这样他人就可以访问你的文件，但又不会让他们获得过大的权限，以至于他们最终进入并搞乱你的系统。对于被多个用户使用的系统，或者你运行在共享的主机服务上，这一点至关重要。


  加密你设置的分区也不是一个坏主意。每当个人物理接触到你运行 Linux 的机器时，如果该机器没有加密，他们不需要知道任何密码就可以进入并获取该机器上的数据。


  ### 审计与入侵检测


  最后，你应该考虑花些时间在你作为系统管理员的服务器上部署入侵检测，运行检查以验证你的系统是否已经被入侵。


  许多黑客都非常有经验，能够进入操作系统并破坏它，且在为时已晚之前留下留下痕迹。


  ### 备份


  无论你的系统有多可靠，你都可能想要对系统上的任何内容进行备份，以免丢失所有数据。虽然在使用 Linux 时遭遇安全泄露的可能性极低，但未患于患，胜于其医。


  # 第十一章


  ![logo](img/00003.jpeg)


  ## 使用 Linux 编写脚本


  如你所知，Linux 是通过命令运行的，并且有数百万条命令可以完成你想要做的任何事情。记住所有的命令及其作用似乎几乎是不可能的。好消息是，你不需要这样做！你应该让计算机为你工作，并使用
  shell，这样你就有了自动化处理任务的选项。这就是编写脚本的原因。


  如果你还不知道，脚本是告诉计算机执行操作的代码行。你的 shell 将能够读取包含你所有脚本的文件，并执行它们，就像你当时亲自输入它们一样。


  脚本对很多事情都有用，例如：


  - 从你的供应商那里为你的 Linux 系统获取自动更新。

  - 将你的文件备份到另一个服务器，以避免丢失的风险。

  - 管理网站及其位于上面的文件（如果你管理网站的话）。


  ### 你的第一个脚本


  显然，你希望你的 shell 脚本运行成功，为了实现这一点，你必须确保遵循以下三个步骤。


  1. 将脚本放置在你的 shell 能够访问的地方。

  2. 正确地编写脚本，以便 shell 读取。

  3. 给 shell 必要的权限，以便在你的操作系统上执行脚本。


  shell 脚本将以 ASCII 文本形式存在；因此，你需要打开一个文本编辑器来创建正确的 shell 脚本。你使用的文本编辑器取决于你的个人偏好，但你可以选择的包括记事本或文字处理器。只需确保你决定使用的编辑器能够读取和写入
  ASCII 文本即可。


  打开文本编辑器后，你将输入如下所示的内容：


  ```bash

  #!/ bin/ bash


  #Linux 的第一个 shell 脚本


  Echo: “I did it!”

  ```


  接下来你需要做的是保存文件，并取一个让你知道它是什么以及在哪里可以找到它的名字。


  在查看脚本的第一行时，你会注意到它会告诉 shell 在解释你的脚本时你想要使用哪个程序。如果你愿意，也可以使用其他程序，如 `Perl` 或 `python`。


  你的第二行是注释，它通过井号（#）与其他代码隔离开。井号后的任何内容都会被解释器忽略，因为它们不是脚本的实际部分。


  脚本越长，你脚本中的注释就越多，这样你就能回头搞清楚你正在对代码做什么，或者让其他人可以使用你的代码并知道你在做什么。


  脚本的最后一行将是要被回显（echo）的命令。基本上，这就是你希望在显示器上打印命令。


  ### 设置权限


  你必须允许 shell 知道运行你在命令提示符中输入的代码是允许的。你需要使用 `chmod` 命令配合数字 `755`。数字 `755` 允许任何人执行、读取和写入代码。但，如果你想让你的代码保持私有，你将使用数字
  `700`。


  ### 将其放入路径 (path)


  当你的脚本被执行时，你应该看到你在最初编写代码时放入代码中的“I did it!”消息。如果你在屏幕上没有看到代码，你应该将文件移动到某个目录并让 shell
  使用那里，而不是它当前正在使用的目录。


  每当输入命令名称时，系统不会遍历整个计算机来定位该文件。相反，它只会在你指定的范围内进行搜索。扫描整个计算机将花费太长时间，而你并不总是有那么多时间。


  你的 shell 将维护一个可执行程序所在的目录列表，以及它搜索的目录（如果你没有告诉 shell 去哪里查找），它将找到文件。如果找不到文件，你将收到一条提示找不到命令的错误消息。


  shell 将搜索的目录列表就是路径（path），你可以通过在命令提示符中输入 `$PATH` 来查看所有路径。结果是查找命令时搜索的整个目录列表。


  你还可以添加目录选项，让 shell 查找该目录而不是进入另一个目录。




  最后一组命令是包含运行环境的命令。当使用这些命令时，系统将在内存库中持有未知数量的实例。内存库中的信息被称为环境，这些环境将是你的文件名、用户名等内容。你可以使用
  `set` 命令来查看此组中的所有环境。


  你的环境命令还包括 shell 函数和别名（aliases）。


  ### 别名 (Aliases)


  为了创建一个别名，你应该处于主目录并打开你的文本编辑器。你需要打开配置文件（profile document）并将别名添加到文件的末尾。


  每当你登录电脑时，shell 都会执行你的该文件。`alias` 命令将创建一个新命令，该命令可以执行其他命令。当你尝试使用你的新命令时，你应该先注销系统并重新登录。通过
  `alias` 命令，你拥有了创建你所独有的自定义命令的能力。


  `alias` 命令是内置在 shell 中的，这让你有机会直接在命令行提示符中创建你的别名，但它们是不会持久的。每当你退出当前正在使用的 shell 会话时，它们就会被擦除。


  ### Shell 函数 (Shell functions)


  Shell 函数比别名函数更复杂。将 shell 函数理解为脚本内部的脚本会更容易。你可以获取之前创建的别名文件，并在文本编辑器中将其替换为 shell 函数。


  你应该知道，`function` 也是内置在 shell 中的命令，就像 `alias` 一样，所以如果你想让命令仅在当前会话中有效，请将命令输入到命令行提示符而不是文本编辑器中。


  ## 第十二章


  ![logo](img/00003.jpeg)


  ### Linux 使用技巧与技巧


  在本书的后续章节中，你已经学习了什么是 Linux 以及你可以用它做的各种事情。然而，虽然 Linux 看起来用起来很简单，但你仍然想知道一些让使用 Linux
  变得更简单的技巧。你在本章中看到的代码将是你用来让这些技巧为你提供服务的语法！


  1. 查看不是由你运行的进程。


  如果你在你的机器上做某些事情，并发现在正在玩激烈的在线游戏时，你的电脑冻结了。你的第一个疑问将是电脑发生了什么导致了这种情况。答案是另一个用户可能正在占用你电脑运行游戏所需的
  CPU。


  要查看正在运行但不是你运行的进程，你需要在命令行提示符中输入以下代码：


  ```

  Ps aux | grep -v ‘whoami.’

  ```


  使用这段代码将调出你电脑上所有占用 CPU 的进程。但是，这也包含了所有在后台运行的进程。所以，为什么不对进程进行排序，以便看到占用 CPU 最高的前十个进程呢？你在提示符中输入此语法：


  ```

  Ps aux - - sort = % cpu | grep – m 11 – v ‘whoami’

  ```


  你可能想在根目录下运行此命令，以便过滤掉后台进程。现在你有了这些杀掉 CPU 的进程，你就能关闭它们并回到你的游戏了！


  2. 在多个文件中替换相同的文本


  在某些时刻，你需要获取相同的文本并在多个位置更改它。你有几种选项可以实现这一点。


  当你尝试在当前工作目录下的所有文件中替换文本时：


  ```

  Perl -i -pe ‘s/windows/Linux/; ‘ test *

  ```


  为了在目录及其子目录中将文本从 windows 更改为 Linux，将使用以下代码：


  ```

  Find. – name’ * .txt’ – print | xargs perl – pi -e’s/windows/Linux/ig’ * .txt

  ```


  或者，如果你尝试在普通文件上替换文本，可以使用此语法。


  ```

  Find – type f – name ‘ * .txt’ -print0 | xargs - - null perl – pi – e ‘s/windows/Linux/’

  ```


  3. 异常的终端 (Wonky terminals)


  有时你会犯错，并需要修复当前正在操作的终端，使其恢复到应有的状态。当你的终端混乱时，你会听到哔哔声，可能会在显示器上看到一些奇怪的颜色。你只需要输入 `reset`
  单词，就能回到正常工作的终端。


  4. Mozilla 关键字 (Mozilla keywords)


  使用 Firefox，你可以选择输入你想要在互联网上搜索的内容，并获得在该浏览器上可以找到的所有结果。为了实现这一点，你需要进入书签并管理书签。从那里，你可以添加一个带有想要搜索的
  URL 的新书签。


  将其放入书签后，你需要获取属性并输入你想要输入的关键词，以便获得搜索结果。URL 中的百分号将将被替换为你的关键词。


  这个技巧可以用于任何你想要快速访问的网站。


  你也可以右键点击搜索字段，并选择“将关键字添加到此搜索”选项；会弹出一个对话框。


  5. 运行多个会话 (Running multiple sessions)


  有时你会与某人共享 Linux，你必须注销他们的会话并重新登录你的。但你不需要每次都这样做。在假设你的电脑是以图形模式启动的情况下，你可以同时按下 control、alt
  和 f1 键，你将得到一个登录提示符。这就是你准备好输入登录信息的地方。之后，你需要运行此语法：


  ```

  Startx - - : 1

  ```


  现在你的电脑应该回到图形环境。当另一个人想使用你的电脑时，他们将使用相同的组合键，只不过他们将按下 f7。当你重新登录时，你执行 `f8`。


  你的 `f1` 到 `f6` 键是标识控制台会话的键，而 `f7` 到 `12` 标识会话。并不是每一个发行版都是这样工作的；你可能需要根据你的发行版使用不同的按键。




  如果你修改了启动过程以包含此命令，那么每次电脑启动时你都会获得正确的时间。


  ### 9. 定位大文件


  你将会遇到的最常见问题之一是，你有一些包含大量数据必须被删除的文件。要做到这一点，你可以利用以下三段代码之一。


  要查找当前所在目录中最大的文件：


  ```

  ls -lsrh

  ```


  代码中列出的 `r` 将把最大的文件提取并放在末尾，而 `h` 则能让你读到文件的大小信息。


  要查找 MP3 和 MPEG 文件：


  ```bash

  ls -lsrh *.mp*

  ```


  ### 10. Nautilus 快捷键


  Linux 的设计使得许多文件管理器本应配合鼠标使用，但在某些情况下，你可能无法使用鼠标，或者正在进行某些需要手指不离开键盘的操作。Nautilus 提供了了一些键盘快捷键来帮助你找到这些文件。


  - `arrow keys`（方向键）将移动到你所在的文件夹。

  - `Control` 和 `L` 将打开一个新的位置。

  - `Control` 和 `up` 将打开你当前打开的文件夹的父文件夹。


