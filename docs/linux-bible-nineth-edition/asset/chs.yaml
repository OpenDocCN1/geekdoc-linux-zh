  \ Linux 服务器。（如果你没有另一个 Linux 系统，可以通过输入 `localhost` 代替 IP 地址并以本地用户登录来模拟此。）以下是远程登录到\
  \ `10.140.67.23` 上 `johndoe` 账户的示例：\n\n```\n$ ssh johndoe@10.140.67.23\nThe authenticity\
  \ of host '10.140.67.23 (10.140.67.23)'\n     can't be established.\nRSA key fingerprint\
  \ is\n     a4:28:03:85:89:6d:08:fa:99:15:ed:fb:b0:67:55:89.\nAre you sure you want\
