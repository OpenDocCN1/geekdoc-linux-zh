  \ 平台、红帽企业虚拟化以及 Docker 格式的 Linux 容器。\n\n除了 `RHCA` 认证外，Chris 还是红帽认证虚拟化管理员 (RHCVA)\
  \ 和红帽认证数据中心专家 (RHCDS)。他还拥有部署与系统管理、集群与存储管理、云存储以及服务器加固方面的专家证书。\n\n在加入红帽之前，Chris 编写或合写了数十本关于\
  \ Linux 和 UNIX 的书籍，包括*Red Hat Linux Bible*（所有版本）、*CentOS Bible*、*Fedora Bible*、*Linux\
  \ Troubleshooting Bible*、*Linux Toys* 以及 *Linux Toys II*。Chris 还为面向高级用户的 *Linux\
  \ Toolbox* 系列丛书合写了多本书，包括：*Fedora Linux Toolbox*、*SUSE Linux Toolbox*、*Ubuntu Linux\
  \ Toolbox*、*Mac OS X Toolbox* 以及 *BSD UNIX Toolbox*。\n\n在八年里，Chris 在 AT&T 开发 UNIX\
  \ 的组织工作，直到 20 世纪 90 年代初搬到犹州助力 Novell 的 UnixWare 项目。在不写关于 Linux 时，Chris 喜欢踢足球，以及与妻子\
  \ Sheree 和儿子 Seth 待在一起。\n\n# 关于技术编辑\n\n`Richard Blum, LPIC-1,` 已经在 IT 行业工作了 20 多年，担任过系统和网络管理员，并出版了多部\
  \ Linux 和开源书籍。他曾管理过 UNIX、Linux、Novell 和 Microsoft 服务器，并协助设计和维护了一个使用 Cisco 交换机和路由器、拥有\
  \ 3500 名用户的网络。他使用 Linux 服务器和 shell 脚本执行自动化网络监控，并在大多数常用的 Linux Shell 环境下编写过 shell\
  \ 脚本。Rich 是“Linux 入门”课程的在线讲师，该课程在美国各地的学院和大学使用。当他不沉迷于电脑时，Rich 在几个不同的教会崇拜乐队中弹电贝斯，并享受与妻子\
  \ Barbara 以及两个女儿 Katie Jane 和 Jessica 一起度过的时光。\n\n# 制作谢辞\n\n- **项目编辑**: Martin V.\
