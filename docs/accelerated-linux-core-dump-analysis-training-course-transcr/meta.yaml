  - '[PAGE 13]


    # Part 1: Fundamentals


    Now, I show you some pictures. I use 64-bit examples. Most of the time, fundamentals
    do not change when we move to 32-bit Linux, and the analysis process is mostly
    the same.


    获取完整版，找书加QQ群: 8321178'
  - '[PAGE 14]


    # Memory/Kernel/User Space


    ![](img/c13cca36c746136c8ef7234d0e8b24f6_14_0.png)


    If you come from Windows or Mac OS X background, you find fundamentals almost
    the same. For every process, the Linux memory range is divided into kernel space
    part, user space part, and an inaccessible part to catch null pointers¹. This
    non-accessible region is different from Mac OS X, where it is 1 GB. We follow
    the long tradition of using red color for kernel and blue for user part. Please
    note that there is a difference between space and mode. The mode which code is
    running on Mac OS, for example, code running in kernel space has a higher execution
    privilege than code running in user space. However, kernel can access user space
    and access data there. We say that such code is running in kernel mode. On the
    contrary, the application code from user space is running in user mode, and because
    of its lower privilege, it cannot access kernel space. This division prevents
    accidental kernel modifications. Otherwise, you could easily crash your system.
    It puts addresses on the right. This uniform memory space is called virtual process
    space because it is an abstraction that allows us to analyze core dumps without
    thinking about how it is all organized in physical memory. When we look at process
    dumps, we are concerned with virtual space only.


    ¹ On Debian system it is 0FFFF, as seen from /proc/sys/vm/mmap_min_addr value.


    15'
  - '[PAGE 15]


    # App/Process/Library


    ![](img/c13cca36c746136c8ef7234d0e8b24f6_15_0.png)


    When an app is loaded, all its referenced dynamic libraries are mapped to virtual
    memory space. Different sections of the same file (like code and data) may be
    mapped into a different portion of memory. In contrast, modules in Windows are
    organized sequentially in virtual memory space. A process is then set up for running,
    and a process ID is assigned to it. If you run another such app, it has a different
    virtual memory space.


    获取完整整版，找加QQ群：8321178'
  - '[PAGE 16]


    # # Process Memory Dump


    ![](img/c13cca36c746136c8ef7234d0e8b24f6_16_0.png)


    When we save a process core memory dump, a user space portion of the process space
    is saved without kernel space stuff. However, we never see such large core dumps
    unless we have memory leaks. This is because process space has gaps unfilled with
    code and data. These unallocated parts are not saved in a core dump. However,
    if some parts were paged out and reside in a page file, they are usually brought
    back before saving a core dump.


    获取完整整版，找书加QQ群：8321178'
  - '[PAGE 17]


    # Kernel Memory Dump


    ![](img/c13cca36c746136c8ef7234d0e8b24f6_17_0.png)


    In case of a kernel panic, a kernel memory dump is saved if the appropriate mechanism
    is configured (mostly by default for recent distributions, such as Ubuntu). Virtual
    memories of running processes are not saved, however. For that, you need various
    physical memory acquisition methods and tools that are outside the scope of this
    course.


    获取完整版，找加QQ群：8321178'
- md: '

    The lack of complete memory dumps may be circumvented by dumping individual processes
    and then forcing a kernel memory dump to analyze together. We call the resulting
    dump type Fiber Bindle.


    # Lightweight Processes (Threads)


    Now, we come to another important fundamental concept in Linux core dump analysis:
    a thread or lightweight process (LWP). It is basically a unit of execution, and
    there can be many threads (LWPs) for a given process (all of them share the same
    process space). Every thread executes some code and performs various tasks. Every
    thread has its ID (LWP ID). In this training, we also learn how to navigate between
    process threads. Note that threads transition to kernel space via *libc* dynamic
    library similar to *ntdll* on Windows and *libsystem_kernel* in Mac OS X. Threads
    additional to the main thread (POSIX Threads) originate from *libc* and *libthread*
    dynamic libraries similar to *libsystem_c* in Mac OS X.

    '
  mdcn: '


    缺乏完整内存转储的问题，可以通过转储单个进程，然后强制进行内核内存转储并进行分析来解决。我们将这种生成的转储类型称为 Fiber Bindle。


    # 轻量级进程（线程）


    现在，我们来看 Linux 核心转储分析中的另一个重要基础概念：线程或轻量级进程（LWP）。它基本上是一个执行单元，一个给定的进程可以拥有许多线程（LWP）（它们都共享同一个进程空间）。每个线程执行某些代码并执行各种任务。每个线程都有自己的
    ID（LWP ID）。在本次培训中，我们还将学习如何在进程线程之间切换。请注意，线程通过 *libc* 动态库进入内核空间，类似于 Windows 上的 *ntdll*
    和 Mac OS X 上的 *libsystem_kernel*。主线程之外的线程（POSIX 线程）源自 *libc* 和 *libthread* 动态库，类似于
    Mac OS X 上的 *libsystem_c*。

    '
