  md: '# App/Process/Library


    ![](img/c13cca36c746136c8ef7234d0e8b24f6_15_0.png)


    When an app is loaded, all its referenced dynamic libraries are mapped to virtual
    memory space. Different sections of the same file (like code and data) may be
    mapped into a different portion of memory. In contrast, modules in Windows are
    organized sequentially in virtual memory space. A process is then set up for running,
    and a process ID is assigned to it. If you run another such app, it has a different
    virtual memory space.


