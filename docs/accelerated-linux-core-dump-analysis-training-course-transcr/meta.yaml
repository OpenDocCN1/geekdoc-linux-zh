  md: '# Lightweight Processes (Threads)


    ![](img/c13cca36c746136c8ef7234d0e8b24f6_19_0.png)


    Now, we come to another important fundamental concept in Linux core dump analysis:
    a thread or lightweight process (LWP). It is basically a unit of execution, and
    there can be many threads (LWPs) for a given process (all of them share the same
    process space). Every thread executes some code and performs various tasks. Every
    thread has its ID (LWP ID). In this training, we also learn how to navigate between
    process threads. Note that threads transition to kernel space via *libc* dynamic
    library similar to *ntdll* on Windows and *libsystem_kernel* in Mac OS X. Threads
    additional to the main thread (POSIX Threads) originate from *libc* and *libthread*
    dynamic libraries similar to *libsystem_c* in Mac OS X.'
