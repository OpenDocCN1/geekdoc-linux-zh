- img_proc: true
  md: '# # Process Memory Dump


    ![](img/c13cca36c746136c8ef7234d0e8b24f6_16_0.png)


    When we save a process core memory dump, a user space portion of the process space
    is saved without kernel space stuff. However, we never see such large core dumps
    unless we have memory leaks. This is because process space has gaps unfilled with
    code and data. These unallocated parts are not saved in a core dump. However,
    if some parts were paged out and reside in a page file, they are usually brought
    back before saving a core dump.


