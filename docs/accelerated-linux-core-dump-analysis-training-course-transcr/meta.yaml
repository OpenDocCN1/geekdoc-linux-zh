- md: "\n# About the Author\n\nDmitry Vostakov is an internationally recognized expert,\
    \ speaker, educator, scientist, inventor, and author. He is the founder of the\
    \ pattern-oriented software diagnostics, forensics, and prognostics discipline\
    \ (Systematic Software Diagnostics), and Software Diagnostics Institute (DA+TA:\
    \ DumpAnalysis.org + TraceAnalysis.org). Vostakov has also authored more than\
    \ 50 books on software diagnostics, anomaly detection and analysis, software and\
    \ memory forensics, root cause analysis and software trace reverse engineering,\
    \ and malware analysis. He has over 25 years of experience in software architecture,\
    \ design, development, and maintenance in various industries, including leadership,\
    \ technical, and people management roles. Dmitry also founded Syndromatix, Analogio,\
    \ Software Diagnostics Technology and Services (former Memory Dumping Analysis\
    \ Services) PatternDiagnostics.com, and Software Prognostics. In his spare time,\
    \ he presents various topics on Debugging, TV and explores Software Narratology,\
    \ its further development as Narratology (DoT), Software Pathology, and Quantum\
    \ Diagnostics. His current interest areas are theoretical software diagnostics\
    \ and its mathematical and computer science foundations, application of formal\
    \ logic, artificial intelligence, machine learning and data mining to diagnostics\
    \ and anomaly detection, software diagnostics engineering and diagnostics-driven\
    \ development, software diagnostics workflow and interaction. Recent interest\
    \ areas also include cloud native computing, security, automation, functional\
    \ programming, and applications of category theory to software development and\
    \ big data.\n\n获取完整版，找书QQ群：8321178\n\n# Presentation Slides and Transcript\n\n\
    获取完整版，找书加QQ群：8321178\n\n获取完整整版，找书加QQ群：8321178\n\n# Core Dump Analysis Accelerated\
    \ Second Edition\n\nDmitry Vostokov\nSoftware Diagnostics Services\n\nHello, everyone,\
    \ my name is Dmitry Vostokov, and I teach this training course.\n\n获取完整版，找加QQ群：8321178\n\
    \n# Prerequisites\n\n| GDB Commands |\n| :--- |\n| We use these boxes to introduce\
    \ GDB commands used in practice exercises |\n\n| WinDbg Commands |\n| :--- |\n\
    | We use these boxes to introduce WinDbg commands used in practice exercises |\n\
    \n- Basic Linux troubleshooting\n- Beneficial to know basics of assembly language\
    \ (depends on your platform):\n  - [Practical Foundations of Linux Debugging,\
    \ Disassembling, Reversing](#)\n  - [Practical Foundations of ARM64 Linux Debugging,\
    \ Disassembling, Reversing](#)\n\nThe prerequisites are hard to define. Some of\
    \ you have software development experience, and some do not. However, one thing\
    \ is certain that to get most of this training, you are expected to be familiar\
    \ with hexadecimal notation and other troubleshooting experience. Another I expect\
    \ you to be familiar with what you have seen or can read programming source code\
    \ in some language. The ability to read assembly language has some advantages\
    \ but is not really necessary for this training. Windows memory dump analysis\
    \ experience may help ease the transition but is not absolutely necessary. If\
    \ you read either Accelerated Mac OS X Core Dump Analysis or Accelerated Windows\
    \ Memory Dump Analysis book or both, you may find a similar approach here.\n\n\
    # Training Goals\n\n- Review fundamentals\n- Learn how to collect core dumps\n\
    - Learn how to analyze core dumps\n\nOur primary goal is to learn core dump analysis\
    \ in an accelerated fashion. So first, we review absolutely essential fundamentals\
    \ necessary for core dump analysis. Also, this training is mostly about user process\
    \ core dump analysis with an accelerated transition to kernel core dump analysis\
    \ which is a topic fully explored in the follow-up course and book Advanced Linux\
    \ Core Dump Analysis with Data Structures. An additional goal is to leverage Windows\
    \ or Mac OS X debugging and memory dump analysis experience you may have. 最新完整版，请书加QQ群：8321178\n\
    \n# Training Principles\n\n- Talk only about what I can show\n- Lots of pictures\n\
    - Lots of examples\n- Original content\n\nFor me, there were many training formats\
    \ to consider, and I decided that the best way is to concentrate on hands-on exercises.\
    \ Specifically, for this training, I developed 30 of them, and they utilize the\
    \ same pattern-oriented approach I used in Accelerated Windows Memory Dump Analysis\
    \ and Accelerated Mac OS X Core Dump Analysis training.\n\n获取完整版，找加QQ群：8321178\n\
    \n# Schedule Summary\n\nDay 1\n- Analysis fundamentals (25 minutes)\n- Process\
    \ core dump collection (5 minutes)\n- Process core dump analysis (1 hour 30 minutes)\n\
    \nDay 2\n- Process GDB analysis (1 hour 40 minutes)\n- Process WinDbg analysis\
    \ (20 minutes)\n\nDay 3\n- Kernel dump collection (5 minutes)\n- Kernel core dump\
    \ analysis (55 minutes)\n- Process WinDbg analysis (1 hour)\n\nThis slide shows\
    \ a roughly schedule.\n\n获取完整版，找加QQ群：832178\n\n# Part 1: Fundamentals\n\nNow,\
    \ I show you some 64-bit fundamentals. For 32-bit, it is mostly the same.\n\n\
    获取完整版，找加QQ群：832178\n\n# Memory/Kernel/User Space\n\nIf you come from Windows or\
    \ Mac OS X, you find that Linux memory range is divided into kernel space, user\
    \ space, and an inaccessible region. Please note that it is colored red for kernel\
    \ and blue for user space. Code running in kernel space has a higher privilege\
    \ than code running in user space. However, user space cannot access kernel space.\
    \ This is an abstraction that allows us to analyze dumps without thinking about\
    \ how it is organized in physical memory. When we look at process dumps, we are\
    \ concerned with virtual space only.¹ On Debian system it is 0FFFF, as seen from\
    \ /proc/sys/vm/mmap_min_addr.\n\n# App/Process/Library\n\nWhen an app is loaded,\
    \ all its referenced libraries are mapped to virtual memory space. Different sections\
    \ of the same file (like code and data) may be mapped into a different portion\
    \ of memory. In contrast, modules in Windows are organized sequentially in virtual\
    \ memory space. A process is then set up for running, and a process ID is assigned\
    \ to it. If you run another such app, it has a different virtual memory space.\n\
    \n获取完整版，找加QQ群：832178\n\n# Process Memory Dump\n\nWhen we save a process core memory\
    \ dump, a user space portion of the process space is saved without kernel space\
    \ stuff. However, we never see such large core dumps unless we have memory leaks.\
    \ This is because process space has gaps unfilled with code and data. These unallocated\
    \ parts are not saved in a core dump. However, if some parts were paged out and\
    \ reside in a page file, they are usually brought back before saving a core dump.\n\
    \n# Kernel Memory Dump\n\nIn case of a kernel panic, a kernel memory dump is saved\
    \ if the appropriate mechanism is configured (mostly by default for recent distributions,\
    \ such as Ubuntu). Virtual memories of running processes are not saved, however.\
    \ For that, you need various physical memory acquisition methods and tools that\
    \ are outside the scope of this course.\n"
  mdcn: "\n\n# 关于作者\n\nDmitry Vostakov 是一位国际认可的专家、演讲者、教育者、科学家、发明家和作者。他是面向模式的软件诊断、取证和预诊断学科（系统化软件诊断）以及软件诊断学院（DA+TA:\
    \ DumpAnalysis.org + TraceAnalysis.org）的创始人。Vostakov 还撰写了 50 多本关于软件诊断、异常检测与分析、软件和内存取证、根因分析、软件跟踪反向工程以及恶意软件分析的书籍。他在各行业的软件架构、设计、开发和维护方面拥有\
    \ 25 年以上的经验，担任过领导、技术和人员管理职务。Dmitry 还创立了 Syndromatix、Analogio、Software Diagnostics\
    \ Technology and Services（原 Memory Dumping Analysis Services）、PatternDiagnostics.com\
    \ 以及 Software Prognostics。在空闲时间，他会演讲调试、电视等各种主题，并探索软件叙事学、其作为叙事学（DoT）的进一步发展、软件病理学和量子诊断。他目前关注的领域是理论软件诊断及其数学和计算机科学基础、形式逻辑、人工智能、机器学习和数据挖掘在诊断和异常检测中的应用、软件诊断工程和诊断驱动开发、软件诊断工作流和交互。最近的领域还包括云原生计算、安全、自动化、函数式编程以及范畴论在软件开发和大数据中的应用。\n\
    \n获取完整版，找书QQ群：8321178\n\n# 演示灯片与原文\n\n获取完整版，找书加QQ群：832178\n\n获取完整整版，找书加QQ群：832178\n\
    \n# 核心转储分析加速版\n\nDmitry Vostokov\n软件诊断服务\n\n大家好，我是 Dmitry Vostokov，由我教授这门培训课程。\n\
    \n获取完整版，找加QQ群：832178\n\n# 前提条件\n\n| GDB 命令 |\n| :--- |\n| 我们使用这些框来介绍实践练习中使用的 GDB\
    \ 命令 |\n\n| WinDbg 命令 |\n| :--- |\n| 我们使用这些框来介绍实践练习中使用的 WinDbg 命令 |\n\n- 基础 Linux\
    \ 故障排除\n- 了解汇编语言基础是有益的（取决于你的平台）：\n  - [Linux 调试、反汇编、逆向工程的实用基础](#)\n  - [ARM64\
    \ Linux 调试、反汇编、逆向工程的实用基础](#)\n\n前提条件很难界定。你们中有些人有软件开发经验，而另一些人没有。然而有一点是可以肯：为了获得大部分培训收获，你们需要熟悉十六进制表示法和其他故障排除经验。另外，我希望你们熟悉自己见过的内容或能够阅读某种语言的编程源码。阅读汇编语言的能力有一定的优势，但对于本次培训并非真正必要。Windows\
    \ 内存转储分析经验可能有助于过渡，但并非绝对必要。如果你读过《加速版 Mac OS X 核心转储分析》或《加速版 Windows 内存转储分析》书籍（或两者），你可能会在这里发现类似的方法。\n\
    \n# 培训目标\n\n- 复习基础知识\n- 学习如何收集核心转储\n- 学习如何分析核心转储\n\n我们的首要目标是以加速的方式学习核心转储分析。因此，我们首先回顾进行核心转储分析所绝对必需的基础知识。此外，本次培训主要关于用户进程核心转储分析，并加速过渡到内核核心转储分析，后者是在后续课程和书籍《带数据结构的高级\
    \ Linux 核心转储分析》中充分探讨的主题。另一个目标是利用你可能有的 Windows 或 Mac OS X 调试和内存转储分析经验。最新完整版，请书加QQ群：832178\n\
    \n# 培训原则\n\n- 只讲解我能展示的内容\n- 大量的图片\n- 大量的示例\n- 原创内容\n\n对我来说，有很多培训格式可以考虑，我决定最好的方法是集中在实践练习上。具体来说，针对本次培训，我开发了\
    \ 30 个练习，它们利用了我在《加速版 Windows 内存转储分析》和《加速版 Mac OS X 核心转储分析》培训中使用的相同面向模式的方法。\n\n\
    获取完整版，找加QQ群：832178\n\n# 日程摘要\n\n第一天\n- 分析基础（25 分钟）\n- 进程核心转储收集（5 分钟）\n- 进程核心转储分析（1\
    \ 小时 30 分钟）\n\n第二天\n- 进程 GDB 分析（1 小时 40 分钟）\n- 进程 WinDbg 分析（20 分钟）\n\n第三天\n- 内核转储收集（5\
    \ 分钟）\n- 内核核心转储分析（55 分钟）\n- 进程 WinDbg 分析（1 小时）\n\n此幻灯片显示了一个大致日程。\n\n获取完整版，找加QQ群：832178\n\
    \n# 第一部分：基础知识\n\n现在，我向你们展示一些 64 位基础知识。对于 32 位，大部分相同。\n\n获取完整版，找加QQ群：832178\n\n\
    # 内存/内核/用户空间\n\n如果你来自 Windows 或 Mac OS X，你会发现 Linux 内存范围被分为内核空间、用户空间和一个不可访问区域。请注意，内核显示为红色，用户空间显示为蓝色。运行在内核空间的代码比运行在用户空间的代码权限更高。然而，用户空间无法访问内核空间。这种抽象允许我们在分析转储时无需考虑它在物理内存中是如何组织的。当我们查看进程转储时，我们只关心虚拟空间¹。在\
    \ Debian 系统上，如 /proc/sys/vm/mmap_min_addr 所示。\n\n# 应用/进程/库\n\n当一个应用加载时，其所有引用的库都会映射到虚拟内存空间。同一个文件的不同部分（如代码和数据）可能会被映射到内存的不同部分。相比之下，Windows\
    \ 中的模块在虚拟内存空间中按顺序组织。然后设置一个进程进行运行，并为其分配进程 ID（PID）。如果你运行另一个这样的应用，它将具有不同的虚拟内存空间。\n\
    \n获取完整版，找加QQ群：832178\n\n# 进程内存转储\n\n当我们保存进程核心内存转储时，进程空间的用户空间部分会被保存，而不包含内核空间的内容。然而，除非发生内存泄漏，否则我们永远看不到如此大的核心转储。这是因为进程空间有未被代码和数据填充的间隙。这些未分配部分不会保存在核心转储中。但如果某些部分被交换到磁盘并存在于分页，通常会在保存核心转储之前将它们换回。\n\
    \n# 内核内存转储\n\n在发生内核恐慌（kernel panic）时，如果配置了相应的机制，将保存内核内存转储（对于最近的发行版如 Ubuntu，通常默认开启）。然而，运行进程的虚拟内存不会被保存。对此，你需要各种物理内存获取方法和工具，而这些超出了本课程的范围。\n\
    \n"
