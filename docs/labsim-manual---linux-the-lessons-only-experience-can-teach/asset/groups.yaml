    ## 4.3.10 DETERMINE THE DIRECTORY SIZE


    You are logged on as the wadams user. Your working directory is /home/wadams.
    Use the du command (| more if you need to) to answer the following questions:


    - How big is the /home/wadams directory?

    - What is the largest directory in /home/wadams?

    - What is the size of the /./gnome2 directory?


    ### Explanation


    Click the Simulation button and type the du -h /home/wadams | more command to
    view information for the /home/wadams directory.


    To allocate space in a file system, you must monitor directory space usage to
    know which directories consume the most disk space. The du (disk usage) command
    allows you to view the size of a directory and everything it contains in Kilobytes.
    (If you want a more user-friendly readout, use the -h option.)


    ## 4.3.11 DETERMINE THE AMOUNT OF FREE DISK SPACE


    Use the df -h command to answer the following:


    - How much space is used on /dev/hda2?

    - How much space is available on /dev/hda2?

    - What percentage of space is used on /dev/hda1?


    ### Explanation


    Click the Simulation button and type the df -h command to find the information
    you need.


    Of the file systems mounted to a directory tree, the / file system is the most
    important. It must have enough free space to allow the operating system to work
    uninhibited, and so it requires frequent monitoring. If it falls below 10% free
    space, you may experience performance problems. To monitor the amount of space
    used by a file system, use the df command. (Like the du command, it also takes
