    # ## 4.1.9 CHANGE THE UMASK 1


    Scenario


    You are logged in as wadams. You want to change your default umask to give yourself
    and members of the groups to which you belong full permissions to the files and
    directories you create. You want to deny permissions for everyone else.


    Change your umask value to 007.


    Steps


    By default, files receive rw-rw-rw- (666) permissions, and directories receive
    rwxrwx (777) permissions when they are created. In most cases, the default assignment
    gives excessive permission to files and directories.


    You can customize the default permission assignments by setting a *umask*. The
    umask identifies which permissions are *removed* from the default permissions
    when files and directories are created.'
