    # 4.3.8 CREATE A HARD LINK


    Scenario


    The user madam owns and maintains a database file in /home/wadams called contacts.db.
    The file holds contact information for prospective clients. Users bcassini and
    vedwards want to access and add contact information to the file to share the data
