    -a switch to the CTRL-ALT-DELETE section (add it before the now -or other existing--time
    parameter option). When the switch is present, the shutdown.allow file checks
    to see if a listed user or root is logged on. If so, the system shuts down. If
    not, shutdown is not allowed. If the file does not exist, there are no restrictions
