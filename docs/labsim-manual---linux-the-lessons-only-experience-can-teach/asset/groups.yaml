    ## 5.3.6 终止远程终端服务会话


    ### 场景


    Vera Edwards 启动了一个远程会话，但在关闭会话之前离开了。由于你需要进行一些维护工作，所有其他远程用户已根据你的要求关闭了他们的会话。


    你在本实验中的任务是：


    - 找到打开的远程会话进程 ID (PID)。（远程会话进程名称为 pts/x，其中 x 是启动的远程终端会话数量。）

    - 杀死该远程会话进程。


    ### 步骤


    进程是指在内存和 CPU 中运行的程序。你应该关注以下两种类型的进程：


    - **用户进程**在用户执行程序文件时启动。例如，当你执行 shell 命令时，你就启动了一个用户进程。

    - **守护进程**（Daemon processes）由系统启动的（通常在系统启动时启动），但也可以手动启动。大多数守护进程提供系统服务。


    Linux 还允许你将进程作为前台进程或后台进程运行。


    - **前台进程**绑定到终端并并在终端上运行。

    - **后台进程**在空闲状态下等待。你对等待中的进程的信号控制有限（例如将它们调回前台）。当你运行一个后台进程时，你就创建了一个作业（job）。


    系统使用以下数字来标识进程：


    - **进程 ID (PID)** 唯一标识每个进程。系统启动的进程通常数字较低，而用户启动的进程数字较高。

    - **父进程 ID (PPID)** 识别生成（或启动）该进程的进程。

    - **作业号 (job number)** 识别运行中的作业。


    当你想要管理进程时，PID、PPID 和作业号变得非常重要。这些数字允许你识别进程、父进程和后台进程，以便对它们执行命令。


    完成以下步骤：


    - 1. 输入 **man ps** 来查看 **ps** 命令的文档。

    完成以下表格：


    | 命令开关 | 描述 |

    |------||

    | -A | |

    | -e | |

    | -u | |

    | -U | |

    | -f | |

    | -j | |

    | -l | |

    | -H | |


    **提示：** 按空格键向下滚动帮助内容。按 **q** 退出 man 页面。


    - 2. 要显示所有运行中的进程，输入 **ps -A** | **more**。


    pts/14 进程的进程 ID 是多少？


    - 3. 要终止打开的远程进程，输入 **kill** 加上进程 ID 数字。例如，**kill 1805** 终止进程 1805。


    ## 5.3.7 停止僵尸进程


    ### 场景


    作为日常维护工作的一部分，你可以扫描并杀死系统上的任何僵尸进程。


    你在本实验中的任务是：


    - 找到僵尸进程。

    - 杀死僵尸进程。


    ### 步骤


    僵尸进程是一个孤儿进程（没有父进程的进程）。这发生在父进程未能正确杀死其子进程时。僵尸进程可能会留在系统中，消耗系统所需的资源和 PID。


    完成以下步骤：


    - 1. 要显示所有进程（包括未绑定到终端的进程），输入 **ps -ax** | more。


    **提示：** 使用空格键翻到每一页。在到达最后一个屏幕之前退出，输入 **q**。


    STAT 列是进程状态列。下表列可能可能各种状态代码。


    | 状态代码 | 含义 |

    |---|---|

    | S | 睡眠 |

    | W | 进程内存中无内容 |

    | R | 运行 |

    | Z | 僵尸 |

    | N | 低优先级进程 |

    | < | 高优先级进程 |


    进程 ID 4 的状态是什么？


    哪些进程是僵尸进程？（请确保向下滚动并检查所有列出进程的状态。）


    - 2. 使用 **kill -9** 命令配合进程 ID 数字杀死步骤 1 中识别出的每个僵尸进程。例如，使用 **kill -9 1257** 终止进程
    1257。


