    # 4.1.3 SET DIRECTORY PERMISSIONS


    Scenario


    An assistant administrator has been modifying permissions on the /hr directory.
    You want to quickly change the permissions to match the permission settings documented
    in your security policy.


    Your task in this lab is to modify the permissions on the /hr directory to be
    as follows:


    +   * User = read, write, execute

    * Group = read, execute

    * Other = read, execute


    Steps


    Every file has an *inode* (information node) that stores information about the
    file, including permissions. The portion of the inode that stores permission information
    is called the *mode*. The mode has three sections:


    +   * User (owner) permissions

    * Group (group owner) permissions

    * Other (everyone on the Linux system) permissions


    There are three types of permissions contained in the mode:


    +   * r (Read) – Open and read a file or a directory, list directory contents
    (requires execute permission, also).

    * w (Write) – Open, read, edit a file for a directory, add, delete, and rename
    files (requires execute permission, also).

    * x (Execute) – Execute the file (if it''s a program file) or the shell script,
    or for a directory enter the directory and work with its contents.'
