    ## 2.0 Using Linux


    ### 2.2.3 FIND THE WORKING DIRECTORY


    What is your current working directory?


    ### Steps


    The working directory is the directory a user is currently in. Use the pwd command
    to find the working directory. If you create a file without specifying a path,
    the file saves directly into your working directory.


    Complete the following steps:


    - 1. Click the **Simulation** button to find the information to answer the question.

    - 2. To display the working directory, type: **pwd**.


    What is the working directory?

    3. Type **cd ..** to change the current directory.

    4. Type **pwd** to display the working directory.


    How did the directory change?

    5. Type **cd wadams.**

    6. Type **pwd** to display the working directory.


    What is the current working directory?


    - 7. Type cd hr to try to change to the hr directory.

    What happened? Why?


    - 8. Type cd /hr change to the hr directory.

    What is the current working directory?


    - 9. Type cd to change the current directory.

    What is the current working directory?


    - 10. Click the Done button and answer the question using the information from
    step 2.


    ### 2.2.4 FIND A HIDDEN FILE


    What is the name of the hidden file in the /etc directory?


    ### Steps


    The ls command displays a list of files in a directory. However, many directories
    contain system or configuration files that are rarely edited, which you cannot
    see with just the ls command. To view these hidden files, use the -a switch with
    the ls command. A period (.) precedes a hidden file name.


    Complete the following steps:


    - 1. Click the Simulation button to find the information to answer the question.

    - 2. Type pwd.

    Which directory are you in?

    What two pieces of information can you get from the command prompt?

    - 3. To move to the /etc directory, type: cd /etc.

    How did the command prompt change?

    - 4. To display a list of files, type: ls.

    How many files are listed in the /etc directory?


    - 5. To display all files in /etc (including hidden files), type: ls -a.


    How many files are now listed in the /etc directory?


    What is the hidden file in the /etc directory?


    - 6. Click the Done button and use the information in step 5 to answer the question.


    ### 2.2.5 VIEW FILE INFORMATION


    View detailed information for the /sbin/eltvune file. What is the file size, the
    modified date, and the modified time? (Type the information exactly as it is shown
    on the screen.)


    ### Steps


    You may find it useful to append a path to the end of a directory command rather
    than moving to another directory. For example, if you wanted to view information
    about a file named games in the /etc directory, but you were in the /root directory,
    you could enter the ls -l /etc/games command. This allows you to stay in the root
    directory while viewing information about the games file (the -l option gives
    you a long listing of file information).


    You could also view information about all files in the /etc directory by using
    the more option. For example, the ls -l /etc | more command allows you to view-detailed
    information for all files in /etc (use the space bar to scroll through files that
    don''t appear on the screen).


    Complete the following steps:


    - 1. Click the Simulation button to find the information to answer the question.


    Which directory are you in?


    - 2. Display the detailed information for the /eltvune file by typing: ls -l /sbin/eltvune.

    Complete the following table:


    | Property | Value |

    | :--- | :--- |

    | File size | |

    | Modified date | |

    | Modified time | |


    - 3. Click the Done button and use the information in step 2 to answer the question.


    ### 2.3.4 VIEW A LIST OF AVAILABLE SHELLS


    The /etc/shells file contains a list of shells that are available on the current
    system. View the contents of the file and answer the following question.


    Of the shells listed below, which are *not* available on the system?


    - A. /bin/bsh

    - B. /bin/csh

    - C. /bin/sh

    - D. /bin/tcsh


    ### Explanation


    The correct answer is D.


    To find the answer, click the **Simulation** button and type: `cat /etc/shells`.


    The shell is the interface between the user and the operating system. Via the
    shell, users and programs send commands to the kernel. In many ways, the shell
    is much like the DOS command interpreter. Like everything else in Linux, the shell
    is just a component. This means that you can choose the shell you want to use,
    or have multiple shells installed on your system at the same time. A list of shells
    on your system is stored in the /etc/shells file. To view the contents of a file,
    like /etc/shells, use the **cat** command.


    ### 2.3.5 VIEW THE CONTENTS OF A FILE


    View the contents of the /root/.bash_profile file. What is the last word in the
    file?


    ### Steps


    Linux provides various ways to view file contents, including the cat command,
    which also allows you to manipulate file contents when combined with other options.


    Complete the following steps:


    - Click the Simulation button to find the information to answer the question.


    - Type cat /etc/passwd.

    What happens? Can you determine what the first line in the file is? Why not?


    - To view the /etc/passwd file one page at a time, type cat /etc/passwd | more.

    What happens?


    - Press the Spacebar on the keyboard to page through the file.


    - Type cat /root/.bash_profile.

    Can you read the first line of the file? Why?


    - What is the last word in the file?


    - Click the Done button and use the information in step 5 to answer the question.

