    ## 2.0 使用 Linux


    ### 2.2.3 查找工作目录


    你当前的工作目录是什么？


    ### 步骤


    工作目录是用户当前所在的目录。使用 `pwd` 命令查找工作目录。如果你在创建文件时未指定路径，文件将直接保存到你的工作目录中。


    完成以下步骤：


    - 1. 点击**模拟**按钮以查找回答问题的信息。

    - 2. 要显示工作目录，输入：**pwd**。


    工作目录是什么？

    3. 输入 **cd ..** 切换当前目录。

    4. 输入 **pwd** 显示工作目录。


    目录是如何变化的？

    5. 输入 **cd wadams.**。

    6. 输入 **pwd** 显示工作目录。


    当前的工作目录是什么？


    - 7. 输入 `cd hr` 尝试切换到 hr 目录。

    发生了什么？为什么？


    - 8. 输入 `cd /hr` 切换到 hr 目录。

    当前的工作目录是什么？


    - 9. 输入 `cd` 切换当前目录。

    当前的工作目录是什么？


    - 10. 点击**完成**按钮，并使用第 2 步中的信息回答问题。


    ### 2.2.4 查找隐藏文件


    /etc 目录下的隐藏文件名称是什么？


    ### 步骤


    `ls` 命令显示目录下的文件列表。然而，许多目录包含极少编辑的系统或配置文件，你无法通过 `ls` 命令看到它们。要查看这些隐藏文件，请在 `ls` 命令中使用
    `-a` 选项。隐藏文件名的开头有一个句点 (.)。


    完成以下步骤：


    - 1. 点击**模拟**按钮以查找回答问题的信息。

    - 2. 输入 `pwd`。

    你在哪个目录？

    你可以从命令提示符中获取哪两项信息？

    - 3. 要进入 /etc 目录，输入：`cd /etc`。

    命令提示符是如何变化的？

    - 4. 要显示文件列表，输入：`ls`。

    etc 目录下列出了多少个文件？


    - 5. 要显示 /etc 中的所有文件（包括隐藏文件），输入：`ls -a`。


    现在 /etc 目录下列出了多少个文件？


    /etc 目录中的隐藏文件是什么？


    - 6. 点击**完成**按钮，并使用第 5 步中的信息回答问题。


    ### 2.2.5 查看文件信息


    查看 /sbin/eltvune 文件的详细信息。文件大小、修改日期和修改时间是多少？（请按照屏幕显示的内容输入信息。）


    ### 步骤


    你可能会发现，在目录命令末尾附加路径比移动到另一个目录更有用。例如，如果你想查看 /etc 目录下名为 games 的文件信息，但你正处于 /root 目录，你可以输入
    `ls -l /etc/games` 命令。这允许你在留在 root 目录的同时查看 games 文件的信息（`-l` 选项会提供文件信息的详细列表）。


    你还可以通过使用 `more` 选项查看 /etc 目录下所有文件的信息。例如，`ls -l /etc | more` 命令允许你查看 /etc 中所有文件的详细信息（使用空格键滚动查看屏幕未显示的文件）。


    完成以下步骤：


    - 1. 点击**模拟**按钮以查找回答问题的信息。


    你在哪个目录？


    - 2. 通过输入 `ls -l /sbin/eltvune` 显示 /eltvune 文件的详细信息。

    完成下表：


    | 属性 | 数值 |

    | :--- | :--- |

    | 文件大小 | |

    | 修改日期 | |

    | 修改时间 | |


    - 3. 点击**完成**按钮，并使用第 2 步中的信息回答问题。


    ### 2.3.4 查看可用 Shell 列表


    /etc/shells 文件包含当前系统可用的 Shell 列表。查看文件内容并回答以下问题。


    在下面列出的 Shell 中，哪一个在系统中*不可用*？


    - A. /bin/bsh

    - B. /bin/csh

    - C. /bin/sh

    - D. /bin/tcsh


    ### 解释


    正确答案是 D。


    要找到答案，请点击**模拟**按钮并输入：`cat /etc/shells`。


    Shell 是用户与操作系统之间的接口。通过 Shell，用户和程序向内核发送命令。在许多方面，Shell 看起来像 DOS 命令解释器。与 Linux 中的其他所有东西一样，Shell
    只是一个组件。这意味着你可以选择想要使用的 Shell，或者在系统中同时安装多个 Shell。你系统上的 Shell 列表存储在 /etc/shells 文件中。要查看文件（如
    /etc/shells）的内容，请使用 **cat** 命令。


    ### 2.3.5 查看文件内容


    查看 /root/.bash_profile 文件的内容。文件的最后一个单词是什么？


    ### 步骤


    Linux 提供了多种查看文件内容的方法，包括 `cat` 命令，该命令与其他选项结合时还允许你操作文件内容。


    完成以下步骤：


    - 点击**模拟**按钮以查找回答问题的信息。


    - 输入 `cat /etc/passwd`。

    发生了什么？你能确定文件的第一行是什么吗？为什么不能？


    - 要逐页查看 /etc/passwd 文件，请输入 `cat /etc/passwd | more`。

    发生了什么？


    - 按键盘上的空格键翻页文件。


    - 输入 `cat /root/.bash_profile`。

    你能读取文件的第一行吗？为什么？


    - 文件的最后一个单词是什么？


    - 点击**完成**按钮，并使用第 5 步中的信息回答问题。


