    ## 5.0 Services and Processes


    ## 5.1.3 FIND THE RUNLEVEL


    What is the current system runlevel?


    ### Explanation


    Click the Simulation button, then type runlevel to find the answer to the question.
    The runlevel command returns two numeric values, the first of which is the previous
    runlevel, the second of which is the current runlevel.


    Linux lets you define multiple runlevels. A runlevel identifies a collection of
    services that defines a specific system state.


    ![](img/8d2cfc37d0c66d3d99ab1a5ce6c5f9e3_99_0.png)


    ## 5.1.4 CHANGE THE RUNLEVEL


    ### Scenario


    You''ve come in after hours to perform system maintenance. However, you don''t
    want others who may be working late to log in to the system either remotely or
    locally.


    Your task in this lab is to set the system to a run level that allows you to perform
    your tasks but prevents others from logging in to the system.


    ### Steps


    Complete the following steps:


    1. Type **cat /etc/inittab | more** to view the documentation for the different
    runlevels.

    Complete the following table:


    | Runlevel | Description |

    | :--- | :--- |

    | 0 | |

    | 1 | |

    | 2 | |

    | 3 | |

    | 4 | |

    | 5 | |

    | 6 | |


    2. To exit, type **q**.

    3. To view the current runlevel, type **runlevel**.

    What is the current runlevel?

    4. To change the runlevel, type **init** followed by the necessary runlevel. For
    example, **init 5** changes the runlevel to 5.


    ## 5.1.5 CHANGE THE DEFAULT RUNLEVEL


    ### Scenario


    Your system cannot load at boot. The terminal shows a login prompt, but before
    you can log in, the GUI attempts to load and fails. This process repeats every
    two seconds, preventing you from logging in. However, you can log in remotely,
    so you decide to change the default runlevel to avoid using the GUI.


    Your task in this lab is to:


    - Edit the /etc/initab file and change the default runlevel so the system boots
    without the GUI.


    ### Steps


    The init (initialize) daemon is responsible for loading all the other daemons
    that bring the system to a usable state.(A daemon is a system service.) To load
    the other daemons, init uses the /etc/initab configuration file. The graphic below
    shows an example of part of inittab file.


    ```

    id:5:initdefault:

    # System initialization.

    10:0:wait:/rc.d/rc 0

    11:1:wait:/rc.d/rc 1

    12:2:wait:/rc.d/rc 2

    13:3:wait:/rc.d/rc 3

    14:4:wait:/rc.d/rc 4

    15:5:wait:/rc.d/rc 5

    16:6:wait:/rc.d/rc 6

    # Trap-ALT-DELETE

    ::sbin/shutdown -r now

    ```


    The current default runlevel is the number after id, which in this case is 5.
    You can edit the /etc/initab file to change the runlevel using vi editor.


    Complete the following steps:


    1. To edit the initab file, type `vi /etc/initab`.

    2. Use the arrow keys to place the cursor under the **5** that follows id:

    3. To enter insert mode, press **i**.

    4. Press the **Delete** key to delete the current runlevel.

    5. To insert a runlevel that boots without the GUI, type **3**.

    6. Press the **Esc** key to enter command mode.

    7. Type `:wq` to save the changes to the file and exit vi.


    ## 5.1.6 CHANGE A SERVICE RUNLEVEL


    ### Scenario


    You want to restrict task to single-user mode as a way of ensuring that no else
    accesses the system while you''re performing system maintenance, including the
    scheduling of some tasks.


    Your task in this lab is to:


    - Make atd active in single-user mode (runlevel 1) only


    ### Steps


    In addition to controlling the system runlevel, you can control the runlevel for
    each service using the **chkconfig** command.


    Complete the following steps:


    Type **man chkconfig** to view the documentation for the **chkconfig** command.
    Complete the following table:


    | Command Switch | Description |

    | :--- | :--- |

    | --level | |

    | --add | |

    | --del | |

    | --list | |


    **Tips:** Press the Spacebar to scroll down the help contents. Press **q** to
    exit the man page.


    To get a list of the services registered to work with chkconfig, type **chkconfig
    --list** | more (use the Space bar to advance screens). Type **q** to exit before
    you reach the end.)


    For which levels is atd currently turned off?


    What other service is turned on runlevel 1?


    - To turn atd off at runlevels 3, 4, and 5, type **chkconfig --level 345 atd off.**

    - To turn atd on at runlevel 1, type **chkconfig --level 1 atd on.**

    - To verify your changes, type **chkconfig --list atd.**


    ## 5.2.3 DETERMINE SERVICE STATUS


    Of the services listed below, which service is stopped?


    - A. portmap

    - B. sshd

    - C. xfs

    - D. ypbind


    ### Explanation


    The correct answer is D.


    Click the Simulation button and type: **service --status-all | more** to receive
    a detailed report for all the services. Use the Spacebar to advance each screen
    until you find the status for the services in the question.


    ## 5.2.4 RESTART A SERVICE


    ### Scenario


    You have just finished installing an update to your system. As the final step,
    the documentation suggests that you restart the SSH service.


    Your task in this lab is to restart the sshd daemon.


    ### Steps


    The options available for managing services using the entire service path are
    also available with the service command. In other words, the two commands you
    see below are identical:


    ```

    /etc/rc.d/init.d atd restart

    ```


    ```

    service atd restart

    ```


    Complete the following steps:


    1. To stop the SSH service, type service sshd stop.

    2. To verify the SSH service status, type service --status-all and locate sshd
    toward the bottom of the list.

    What is the status of the ntpd service?


    3. To start the SSH service, type service sshd start.


    4. To restart the SSH service, type **service sshd restart**. Notice that the
    service is stopped, then restarted with a single command


    5. To try to restart a stopped service, type **service ntpd restart**.


    Why did the first task fail?


    What is the final state of the service?

