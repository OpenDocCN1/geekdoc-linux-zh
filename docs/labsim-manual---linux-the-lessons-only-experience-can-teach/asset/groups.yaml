- md: "\n## 2.4.5 MODIFY AN EXISTING FILE\n\nScenario\n\nYou have just added a custom\
    \ entry to your /etc/hosts file. After testing, however, you find that you have\
    \ mistyped the line in the file.\n\nYour task in this lab is to:\n\n- Use vi to\
    \ open the /etc/hosts file.\n- Modify the host name time-a.nis.gov to read time-a.nist.gov\n\
    - Save your changes.\n\n### Steps\n\nA text editor allows you to create and modify\
    \ text files. Vim (vi improved) is the most common command-line text editor included\
    \ with Linux. While there are vi commands that can take you to specific lines\
    \ and positions in a file, you can also use the arrow keys to place the cursor\
    \ in the correct position before you edit the file.\n\nComplete the following\
    \ steps:\n\n- 1. To open the vi editor, type vi.\n2. Press i.\nHow can you tell\
    \ what vi will now allow you to do?\n3. Type your name at the top of the screen.\n\
    How does this affect the screen?\n\n4. Press the Esc (escape) key on the keyboard.\n\
    What happened?\n\n5. Type :q.\nDid you exit vi? Why not?\n\n6. To exit vi without\
    \ saving (writing) changes to the file, type :q!\n\n7. Use the following command\
    \ to open the /etc/hosts file in vi: vi /etc/hosts.\n\n8. Use the arrow keys to\
    \ position cursor under the last period in the time-a.nis.gov.\n\n9. To be able\
    \ to enter text in the file, you must enter insert mode. To do this, type i.\n\
    \n10. Type t to modify the hostname entry.\n\n11. To enter command mode to save\
    \ the change to the file and exit vi, press the Esc key.\n\n12. To exit vi and\
    \ write (save) the change to the file at the same time, use the following command:\
    \ :wq.\n\n## 2.4.6 CREATE A NEW FILE\n\nScenario\n\nIn this lab, you will create\
    \ and edit a file in vi. Complete the following tasks:\n\n- Open the vi editor\
    \ with a new file named /root/shell.\n- Add the following lines to the file:\n\
    ```\nSHELL=/bin/tsch\nexport SHELL\n```\n- Save and close the file.\n\n### Steps\n\
    \nThe vim text editor offers two working modes: command mode or insert mode. By\
    \ default, the editor opens in command mode. To enter a command in command mode,\
    \ generate a : (colon) prompt by typing <Shift> : . There are numerous ways to\
    \ move from command mode to insert mode, but two of the most common ways are to\
    \ type i or a and begin editing the file.\n\nComplete the following steps:\n\n\
