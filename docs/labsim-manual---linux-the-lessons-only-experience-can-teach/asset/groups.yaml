    ## 10.1.4 READ THE BOOT FILE


    This system has been configured to dual boot another operating system. Open the
    lilo.conf file and find the answers to the following questions.


    - What is the label of the default operating system?

    - How many seconds will LILO show the prompt before booting to the default OS?

    - Where is LILO installed?

    - Is LBA support enabled?

    - What is the label for the second operating system?


    ## Explanation


    Click the **Simulation** button and type `cat /etc/lilo.conf` to view the contents
    of the lilo file. Use the following table to navigate the file and find the information
    you need to answer the questions.


    | LILO Keyword Example | Description |

    | --- | --- |

    | boot=/dev/hda | Gives the path to the hard drive on which LILO is installed.
    This line must point to one of the following: <br>If you have two IDE drives,
    it must point to one of them.<br>If you have one IDE drive and SCSI drives, it
    must point to either the IDE drive or the SCSI drive with ID 0 (sda).<br>If you
    have SCSI drives only, it must point to either ID 0 or drive ID 1. |

    | map=/boot/map | Gives the path to the LILO map file. The map file gives the
    location of the Linux kernel on the hard disk. |

    | install=/boot/boot.b | Gives the path to the boot sector image. This line is
    optional. When it is not used, the default setting is /boot/boot.t. It is possible
    to replace this entry with one that points to a boot menu (letting you choose
    which operating system to use). |

    | prompt | Displays a LILO prompt. Use prompt and timeout to build a delay to
    allow the user to choose a boot image. |

    | timeout=40 | Specifies the amount of time (in tenths of a second, so 40 equals
    4 seconds) that LILO waits for user input before proceeding. |

    | message=/boot/message | Gives either a text message or a path to a graphical
    screen to display at startup. (You can override this and receive a prompt by pressing
    Ctrl + c.) You must run lilo if you change the source file that the line points
    to. |


    ## LabSim MANUAL for Linux+


    | LILO Keyword Example | Description |

    | --- | --- |

    | lba32 | Institutes large block addressing (32-bit), and enables LILO to boot
    from anywhere on the disk (above the 1024 limit). Use lba32 only if the BIOS supports
    LBA. Use linear to make LILO linear sector addressing if LBA is not supported.
    |

    | default=linux | Specifies the default OS. The value corresponds to one of the
    operating system labels listed later in the file. |

    | image=/boot/vmlinuz-2.2.5-15 | image sections are for Linux operating systems.
    The first image= in the lilo.conf file is the default. The image= keyword gives
    the path to the kernel. |

    | label=linux | The label= keyword shows the name that appears on the boot menu
    below the prompt (or on the LILO GUI). |

    | initrd=/boot/initrd-2.4.20-8.img | The in-itrd= keyword gives the path to the
    RAM drive image. |

    | read-only root=/dev/hda3 | read-only sets the root partition as read-only during
    the boot process. The root= keyword gives the path to the root partition. other
    sections are for non-Linux operating systems. |

    | other=/dev/hda1 label=W95 table=/dev/hda | The other= keyword gives the path
    to the boot loader on that partition. The label= keyword shows the name that appears
    on the boot menu below the prompt (or on the LILO GUI). The table= keyword gives
    the path to the partition table information. |


    ## 10.2.3 SHUT DOWN IMMEDIATELY


    ### Scenario


    The power has gone out in your facility. You have a UPS (uninterruptible power
    source) that protects your system and provides enough power to allow you to shut
    down safely.


    Your task in this lab is to shut down the system immediately using the command
    line.


    ### Steps


    Complete the following steps:


    - 1. Type **man shutdown** to view the documentation for the **shutdown** command.
    Complete the following table:


    | Command Switch | Description |

    | --- | --- |

    | | Use the /etc/shutdown.allow file |

    | | Define a specific number of seconds to wait before shutting down |

    | | Send a shutdown warning message |

    | | Reboot the machine after shutdown |

    | | Halt after shutdown |

    | | Stop a shutdown command from proceeding |


    **Tips:** Press the Spacebar to scroll down the help contents. Press **q** to
    exit the man page.


    - 2. To shut the system down immediately, type **shutdown -h now**.


    ## 10.2.4 SHUT DOWN WITH NOTIFICATION


    ### Scenario


    You have planned and informed users that you need to bring the machine down at
    the end of the day to perform routine maintenance. However, prior to shutting
    the system down, you want to give users fifteen minutes to save data and exit
    the system.


    Your task in this lab is to:


    - Shut the machine down with a 15 minute delay, sending a message to all logged-in
    users.


    ### Steps


    When using the **shutdown** command, you can replace the **now** option with a
    time parameter. For example +3 allows the system to shut down in three minutes
    rather than shutting down immediately. This is useful when you want to give users
    time to exit before the system goes offline.


    Complete the following step:


    - To shut down the system with a time delay, type `shutdown -h +15`. (At this
    point you may exit the lab; you do not have to wait fifteen minutes before exiting
    to answer the lab correctly.)


    ## 10.2.5 SHUT DOWN AND REBOOT


    ### Scenario


    You''ve encountered problems that require a reboot. You want to inform users that
    the system will shut down.


    Your task in this lab is to: reboot the system in 5 minutes.


    ### Steps


    Complete the following steps:


    - To shut the system down immediately, type **shutdown -h now**.


    - To restart the system, press the **Power** button.


    - To shut the system down with a delay of 5 minutes, type `shutdown -h +5`. (At
    this point you may exit the lab; you do not have to wait fifteen minutes before
    exiting to answer the lab correctly.)


    ## 10.2.6 CONTROL SHUTDOWN USERS


    ### Scenario


    You''ve had a problem with the shutdown command. You want to prevent users except
    those from shutting down.


    Your task in this lab is to:


    - Create the shutdown.allow file.

    - Authorize Cronin and Maggie in the shutdown.allow file.

    - Use the inittab to check the system.


    ### Steps


    The system uses the /etc/shutdown.allow file to verify who can shut down. The
    most common use of this switch is to edit inittab. If the file does not exist,
    there are no restrictions on who can shut down.


    Complete the following steps:


    1. Type vi /etc/shutdown.allow to create shutdown.allow file.

    2. To enter insert mode, press i.

    3. Type Cronin and Maggie on separate lines.

    4. Press the Esc key to enter command mode.

    5. Type :wq to save and exit.

    6. To edit inittab, type vi /etc/inittab.

    7. Press i.

    8. Locate the section. Add -a switch to the following line:

    9. Press the Esc key and type :wq to save and exit.


    ## 13.0 Troubleshooting


    ## 13.1.3 VIEW /PROC INFORMATION 1


    View various files in the /proc directory to find the answers to the following
    questions.


    - What is the CPU speed (in MHz)? Enter the exact total (including decimal places).

    - How much physical memory does the system have in (kB)? Look for the MemTotal
    line in the corresponding file.

    - What is the Linux kernel version? Enter the version in the format of n.n.n-n.


    ### Steps


    The /proc file system is a virtual file system that contains current system information.
    Files and directories inside /proc are referenced by the kernel. Use these files
    to view system information and, in some cases, change the system state by editing
    the files


    Complete the following steps:


    1. Click the Simulation button to start the simulator.

    2. To view the files in the /proc directory, type ls /proc.


    Based on the file name, complete the following table with the filename you think
    should choose to find specific information.


    | To find information about... | View this file |

    | --- | --- |

    | CPU | |

    | I/O Ports | |

    | Linux Kernel Version | |

    | Memory |


    3. Use the cat command to view the contents of the files necessary to answer the
    questions. For example, use cat /proc/ioports to view the contents of that file.

    4. Click the Done button and answer the questions using the information you found
    in step 3.

