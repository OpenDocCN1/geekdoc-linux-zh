    | Command Switch | Option |

    |---|---|

    | | Create a backup of existing destination files |

    | | No prompt before overwriting |

    | | Prompt before overwriting |

    | | Move when a source file is newer than its destination equivalent |


    **Tips:** Press the Spacebar to scroll down the help contents. Press **q** to
    exit the man page.


    - 2. You must be logged on as the root user before you can delete another person’s
    files. To switch to the root user, type **su** - with **1worm4b8** as the password.


    - 3. Type **ls /home/placy** to view the contents of the placy directory.


    - 4. To move the files to the /home/bcassini directory, type the following commands:

    - `mv /home/placy/confid_wh /home/bcassini`

    - `mv /home/placy/projplan_wh /home/bcassini`


    - 5. Type **ls /home/placy** and **ls /home/bcassini** to verify that the files
