    # 9.2.6 CREATE A SWAP AREA


    Scenario


    You have just upgraded your computer and added an extra 512 MB of RAM. Consequently,
    you want to increase your swap space by adding a new swap area. The second hard
    disk has an unused partition (hda2) that you want to format for the swap area.


    Your task in this lab is to:


