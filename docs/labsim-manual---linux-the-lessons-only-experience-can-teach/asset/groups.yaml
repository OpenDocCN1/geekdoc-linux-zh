  mdcn: "\n\n## 13.1.4 查看 /PROC 信息\n\n查看 /proc 目录下的各种文件，以找到以下问题的答案。\n\n- 网卡使用了哪种 IRQ？\n\
    - S3 Trio 显卡使用的 I/O 内存范围是什么？\n- PCI 总线 0、设备 8、功能 0 上的设备是什么？\n\n## 解释\n\n点击 **Simulation**（模拟）按钮，并使用\
    \ **cat** 命令查看各种必要文件的内容，以找到问题所需的信息。\n\n## 13.2.3 启动网卡\n\n### 场景\n\n你从电脑上共享了一些文件，并收到了许多用户的电话，他们说无法连接到这些文件。你检查了电脑，发现以太网线拔掉了。你已经插好了以太网线，现在你需要启动网卡（NIC）。\n\
    \n你在本次模拟中的任务是在不重启电脑的情况下重启网卡（NIC）。\n\n### 步骤\n\n在重启网卡之前，你必须找到它的别名。该网卡由字母 eth 后跟一个数字表示。\n\
    \n请完成以下步骤：\n\n1. 要要查找网卡的别名，输入 `ifconfig -a`。\n   你如何判断该网卡没有运行？\n2. 要启动网卡，输入 `ifup\
    \ eth0`。\n3. 要验证网卡正在运行，再次输入 `ifconfig -a`。\n\n## 13.2.4 停止网卡\n\n### 场景\n\n你遇到了连接问题，怀疑可能是电脑中的某块网卡引起的。\n\
    \n你在本次模拟中的任务是停止 eth1 网卡，作为尝试隔离问题的第一步。\n\n### 步骤\n\n请完成以下步骤：\n\n1. 要查看显卡/网卡状态，输入\
    \ `ifconfig -a`。\n2. 要停止网卡，输入 `ifdown eth1`。\n\n## Linux+\n\nTestOut Corporation\n\
    50 South Main Street\nPleasant Grove UT 84062\n1-800-877-4889 免费电话\n1-801-785-0575\
