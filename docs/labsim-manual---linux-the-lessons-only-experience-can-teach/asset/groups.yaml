    ## 5.3.6 KILL A REMOTE TERMINAL SERVICES SESSION


    ### Scenario


    Vera Edwards started a remote session, but she left before closing out of it.
    Because you need to do some maintenance, all other remote users have closed their
    sessions at your request.


    Your task in this lab is to:


    - Find the open remote session process ID (PID). (Remote session process names
    are pts/x where x is the number of remote terminal sessions instigated.)

    - Kill the remote session process.


    ### Steps


    A process refers to a program that is running in memory and in the CPU. There
    are two types of processes that you should be aware of:


    - User processes are started when a user executes a program file. For example,
    when you execute a shell command, you start a user process.

    - Daemon processes are started by the system (usually when the system boots up),
    but they can be started manually. Most daemons provide system services.


    Linux also allows you to run processes as either foreground processes or background
    processes.


    - Foreground processes are attached to and running on the terminal.

    - Background processes are waiting in idle. You have limited signal control over
    waiting processes (like calling them back to the foreground). When you run a background
    process, you create a job.


    The system uses the following numbers to identify processes:


    - The process ID (PID) uniquely identifies each process. System-started processes
    typically have low numbers, while user-started processes have higher numbers.

    - The parent process ID (PPID) identifies the process that spawned (or started)
    the process.

    - The job number identifies running jobs.


    The PIDs, PPIDs, and job numbers become important when you want to manage your
    processes. These numbers allow you to identify processes, parent processes, and
    background processes to run commands against them.


    Complete the following steps:


    - 1. **Type man ps** to view the documentation for the **ps** command.

    Complete the following table:


    | Command Switch | Description |

    |------||

    | -A | |

    | -e | |

    | -u | |

    | -U | |

    | -f | |

    | -j | |

    | -l | |

    | -H | |


    **Tips:** Press the Spacebar to scroll down the help contents. Press **q** to
    exit the man page.


    - 2. To display all running processes, type **ps -A** | **more**.


    What is the process ID for the pts/14 process?


    - 3. To terminate the open remote process, type **kill** plus the process ID number.
    For example, **kill 1805** terminates process 1805.


    ## 5.3.7 STOP A ZOMBIE PROCESS


    ### Scenario


    As a part of your daily maintenance, you can scan for and kill any zombie processes
    on the system.


    Your task in this lab is to:


    - Find zombie processes.

    - Kill zombie processes.


    ### Steps


    A zombie process is an orphaned process (a process without a parent). This happens
    when the parent process fails to kill its child processes properly. Zombie processes
    can linger in the system, consuming resources and PIDs that the system needs.


    Complete the following steps:


    - 1. To display all processes (including those not attached to a terminal), type
    **ps -ax** | more.


    **Tips:** Use the Spacebar to advance each screen. To exit before reaching the
    final screen, type **q**.


    The STAT column is the process state column. The following table lists the various
    status codes that may appear.


    | Status Code | Meaning |

    |---|---|

    | S | Sleeping |

    | W | Process has no contents in memory |

    | R | Running |

    | Z | Zombie |

    | N | Low priority process |

    | < | High priority process |


    What is the status of process ID 4?


    Which processes are zombie processes? (Be sure to scroll down and examine the
    status of all listed processes.)


    - 2. Use the **kill -9** command with the process ID number to kill each zombie
    process identified in step 1. For example, use **kill -9 1257** to terminate process
    1257.


