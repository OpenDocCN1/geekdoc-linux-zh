    | User | r | | x |\n| Group | r | w | x |\n| Other | r | w | x |\n\nIf you were\
    \ to create a file with the current umask, what would be the default permissions?\n\
    \n+ 2. To change your umask, type **umask 007**.\n\n+ 3. To verify the umask did\
