    # Steps


    Because best security practices dictate that you use an account other than root
    for most of your day-to-day administrative tasks, you''ll regularly find it necessary
    to invoke root privileges with the su command. Using the syntax of the su command
    that you see here, you can execute a single command as the root user.


    ```

    su -c "command" -l name

    ```


    For example, su -c "ls /home/rgurate" -l switches to the root user and executes
    the ls command on the user rgurate''s home directory. (You can enclose the command
    in either single or double quotation marks.) Before the command executes, however,
    you need to submit the root user''s password, which prevents unauthorized use
    of the su command.


    Complete the following steps:


    +   To change the user account name and home directory with a single command,
    type the following:

    su -c "usermod -l bcassini -d /home/bcassini bcasini" -l

    At the password prompt, type 1worm4b8.

    To verify that the user account was modified, type cat /etc/passwd and check to
    see that the account was changed to bcassini.

    To verify that the home directory was changed, type ls /home and check to see
    that the home directory was changed to bcassini.'
