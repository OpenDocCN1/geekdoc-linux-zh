    ## 4.3.8 CREATE A HARD LINK


    Scenario


    The user madam owns and maintains a database file in /home/wadams called contacts.db.
    The file holds contact information for prospective clients. Users bcassini and
    vedwards want to access and add contact information to the file to share the data
    among the three users.


    Your task in this lab is to:


    - Create a hard link file in /home/bcassini called contacts_link to /home/wadams/contacts.db

    - Create a hard link file in /home/vedwards called contacts_link to /home/wadams/contacts.db


    Steps


    Linked files are files that are somehow associated with one another. There are
    two ways to link files:


    - A hard link creates an exact copy of a file in a different location. You can
    have an unlimited number of hard links to a file, but they must all be on the
    file system. If one hard linked file is modified, all copies of the file are also
    modified.

    - A symbolic link creates a shortcut to the original file.


    Complete the following steps:


    - 1. To create the hard links for the files, type the following commands:

    - ln /home/wadams/contacts.db /home/bcassini/contacts_link

    - ln /home/wadams/contacts.db /home/vedwards/contacts_link


    - 2. To verify the hard links exist, type the following commands:

    - ls -l /home/bcassini

    - ls -l /home/vedwards


    Who is the individual owner and group owner of the contacts_link file in each
    directory?


    What is the size of each link?


    - 3. To find information for the contacts.db file, type ls -l /home/wadams.


    Who is the individual owner and group owner of contacts.db?


    What is the size of the contacts.db file?


    ## 4.3.9 CREATE A SOFT LINK


    Scenario


    Your company used a proprietary graphics program called imitator that is stored
    in the root directory to create images before transitioning to a new graphics
    application licensed for each machine. Maggie Brown (username mbrown) needs to
    modify files created with imitator.


    Your task in this lab is to create a symbolic link file in /home/mbrown called
    imitator_link to /imitator.


    Steps


    Because a symbolic link is actually a shortcut to the original file, when you
    open a symbolic link and edit the file, you are editing the original file directly.
    If the original file is deleted from the system, the symbolic link becomes useless,
    as it points to a file that no longer exists.


    Complete the following steps:


    - 1. To create the symbolic link, type ln -s /imitator /home/mbrown/imitator_link.

    2. Type ls -l /home/mbrown to find information about the symbolic link


    What is the size of the symbolic link?


    Who owns the imitator_link file in /home/mbrown?

    - 3. To find information about the imitator file, type ls -l.


    What is the size of the imitator file?

