    ## 3.1.5 FIND THE USER ID


    What is the UID for user schawla?


    ### Steps


    Linux stores user account information in the /etc/passwd and /etc/shadow files.
    Each user has a line that describes the user account. Each account is identified
    with a User Identifier (UID). Accounts with UIDs between 1 and 100 are used by
    various daemons when they log into the system. UIDs for users begin by default
    at 500, with the exception of root, which uses UID 0 (zero).


    You can use the cat command to view the /etc/passwd and /etc/shadow files. The
    /etc/passwd file is divided into seven colon-separated fields, each of which holds
    a specific piece of user data. Shown below is a sample line from the passwd file:


    ```

    pclark:x:501:Petunia Clark:home/pclark:/bin/bash

    ```


    The table below describes each field in the /etc/passwd file.


    | Field Number | Description |

    |---|---|

    | 1 | User account name. |

    | 2 | Password. An x in the field indicates passwords are stored in the /etc/shadow
    file. |

    | 3 | User ID number. |

    | 4 | Primary group ID number, typically this number matches the UID number. |

    | 5 | GECOS field, typically used for a description or the user''s full name.
    |

    | 6 | Path to the home directory. |

    | 7 | Path to the default shell. |


    Complete the following steps:


    - 1. Click the **Simulation** button to find the information to answer the question.

    - 2. To view the /etc/passwd file, type **cat /etc/passwd**.


    How many non-daemon users are listed in the file?


    What is Maggie Brown''s user ID?


    What is Salman Chawla''s group ID?


    What is the default shell for the users listed in the file?


    What is schawla''s UID?


    - 3. Click the **Done** button and answer the question using the information from
    step 2.


    ## 3.1.6 DELETE A USER


    ### Scenario


    Terry Haslam has been dismissed from the organization. His colleagues have harvested
    the files they need from his home and other directories. Your company security
    policy states that upon dismissal, users accounts should be removed in their entirety.


    Your task in this simulation is to remove the thlaslam user account and the home
    directory from the system.


    ### Steps


    To remove a user from the system, use the userdel command. When combined with
    the -r option, the user account and home directory are removed from the system.


    Complete the following steps:


    - 1. To verify that the thlaslam user account exists, type cat /etc/passwd.


    What is the user ID for thlaslam?


    - 2. Type man userdel to view the documentation for the userdel command. (Press
    the Spacebar to scroll down the help contents. Press q to exit the man page.)


    What does the -r option do?


    - 3. To remove the thlaslam user account and its home directory, type userdel
    -r thlaslam.


    What does the system do to indicate the operation succeeded?


    - 4. To verify that the user account was removed, type cat /etc/passwd.


    - 5. To verify that the home directory was deleted, type ls /home.


    ## 3.2.3 ADD USERS TO A GROUP


    ### Scenario


    Maggie Brown (username mbrown) and Corey Flynn (username cflynn) have recently
    hired in the Human Resources department. You have already created the two user
    accounts.


    Make the two user accounts members of the hr group on this computer.


    ### Steps


    In addition to modifying the user account directly, you can use the usermod command
    to add a user to a group when you include the -G option, which allows you to make
    users members of secondary groups. (Because primary group membership affects the
    permission structure for your distribution, it''s best to accept the default primary
    group for your distribution.)


    Like user information, group information is stored in the /etc/group file. Like
    /etc/passwd, the /etc/group file uses a colon-separated list to store information.
    Shown below is a sample line from the group file:


    ```

    sales:x:510:pclark,mmckay,hsamson

    ```


    The table below describes each field in the /etc/group file.


    | Field Number | Description |

    | --- | --- |

    | 1 | Group name. |

    | 2 | Group password. This field will have an x if group passwords are contained
    in the /etc/gshadow file. |

    | 3 | Group ID number. |

    | 4 | Group members. A comma-separated list of user accounts that are members
    of the group. |


    Complete the following steps:


    - 1. Type cat /etc/group to view the contents of the group file.


    What is the GID of the hr group?


    - 2. Type man useradd to view the documentation for the useradd command.


    Complete the following table.


    | Command Switch | Option |

    |---|---|

    | | Assign a new home directory |

    | | Move contents of home directory to the new home directory |

    | | Expiration date |

    | | Lock a user''s password |

    | | Unlock a user''s password |


    **Tips:** Press the Spacebar to scroll down the help contents. Press q to exit
    the man page.


    - 3. To add Maggie Brown to the hr group, type usermod -G hr mbrown.


    - 4. To add Corey Flynn to the hr group, type usermod -G hr cflynn.


    - 5. To verify that the operation succeeded, type cat /etc/group.


    How has the hr group entry changed?


    ## 3.2.4 VIEW GROUP MEMBERSHIP


    To which groups does user cflynn belong? (Select all that apply.)


    - A. mgmt1

    - B. mgmt2

    - C. hr

    - D. sales

    - E. devel

    - F. it

    - G. cflynn


    ### Explanation


    The correct answers are A, C, F, and G.


    Click the Simulation button, then type groups cflynn to display the group membership.


    ## 3.2.5 ADD A USER TO ADDITIONAL GROUPS


    ### Scenario


    The VP of Sales promoted Salman Chawla to Regional Sales Director. He will now
    need the right and permissions assigned to the mgmt2 and hr groups.


    Your task in this simulation is to:


    - Make schawla a member of the mgmt2 and hr groups.

    - Make sure the user is still a member of all groups.


    You are logged on as root.


    ### Steps


    When you use the usermod -G command to assign group membership, the user is removed
    from secondary groups.


    Complete the following steps:


    - 1. To display the groups to which schawla belongs, type cat /etc/group.


    What group is shawla a member of?


    - 2. To make shawla a member of the required groups, type usermod -G mgmt2,hr.


    - 3. To verify the operation succeeded, type cat /etc/group.


    What groups does shawla belong to?


    - 4. To make shawla a member of the original group, type the following: usermod
    -G mgmt2,hr.


    ## 3.2.6 REMOVE A USER FROM A GROUP


    ### Scenario


    Corey Flynn (username cflynn) currently belongs to several groups. Due to some
    restructuring, he no longer needs to be member of the hr group.


    Your task in this simulation is to:


    - Remove cflynn from the hr group.

    - Preserve other group memberships.


    ### Steps


    Complete the following steps:


    - 1. Type cat /etc/group to view the contents of the group file.


    What groups does cflynn belong?


    - 2. To make cflynn a member of the required groups, type the following: usermod
    -G mgmt1,it.


    - 3. To verify the operation succeeded, type groups cflynn.


    ## 3.2.7 REMOVE A USER FROM ALL GROUPS


    ### Scenario


    Salman Chawla is no longer part of the sales team and is awaiting reassignment
    to a new position. In the meantime, you do not want him to have access to sales
    resources.


    Your task in this simulation is to:


    - Remove user *shawla* from all secondary groups.


    ### Steps


    When you use usermod -G command with double quotes, you can remove secondary group
    memberships.


    Complete the following steps:


    - 1. To remove shawla from all secondary group memberships, type usermod -G "".


    - 2. To verify the operation succeeded, type groups shawla.


    ## 3.2.8 RENAME AND CREATE GROUPS


    ### Scenario


    Currently all the Sales people in your company belong to a group called *sales*.
    The VP of Sales wants two Sales groups: western sales division and eastern sales
    division.


    Your task in this simulation is:


    - Rename the sales group to *western_sales_division*.

    - Create the *eastern_sales_division* group.

    - Modify the group membership so that only bcassini is a member of the *western_sales_division*
    group, and only aesinoza is a member of the *eastern_sales_division* group.


    ### Steps


    Just as you can modify existing users, you can use the **groupmod** command to
    modify existing groups, including changing the name of a group with the **-n**
    option. You can also add a group using the **groupadd** command.


    Complete the following steps:


    - 1. To rename the sales group to western_sales_division, type the following:
    `groupmod -n western_sales_division sales`.

    - 2. To create the eastern_sales_division group, type `groupadd eastern_sales_division`.

    - 3. To make aesinoza a member of the eastern_sales_division group, type the following:
    `usermod -G eastern_sales_division aesinoza`.

