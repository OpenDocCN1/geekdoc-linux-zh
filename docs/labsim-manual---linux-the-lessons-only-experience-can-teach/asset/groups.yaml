    ## 6.3.4 创建并从 tar 归档文件中提取文件


    ### 场景


    你从一个中央管理的 /etc 目录接收了一个全公司范围 passwd 文件的 tar 归档。公司新的 IT 策略要求所有系统在个人的 /etc 目录中维护相同的
    passwd 文件。你需要将根目录下 passwd1.tar.gz 归档中的 passwd 文件安装到 /etc 目录。然而，在安装新文件之前，你想备份自己的
    passwd 文件。


    你在本实验中的任务是：


    - 创建 /passwdwbkbup.tar.gz 文件以归档 /etc/passwd 文件。

    - 从 /passwd1.tar.gz 归档中提取 passwd 文件到 /etc。


    ### 步骤


    完成以下步骤：


    - 输入 ls -l /etc/passwd 查看当前 passwd 文件的信息。


    passwd 文件的大小是多少？


    - 要检查你刚收到的 passwd 文件归档，输入 ls -l /passwd1.tar.gz。


    归档文件的大小是多少？


    - 要归档 /etc/passwd 文件，输入以下命令：

    tar -zcvf /passwdwbkbup.tar.gz -C /etc passwd


    - 要提取新的 passwd 文件，输入以下命令：

    tar -zxvf /passwd1.tar.gz -C /etc


    ## 7.0 安装硬件


    ## 7.1.1 修改启动顺序


    ### 场景


    你刚刚构建了一台新电脑。你正准备通过从系统 CD 启动来安装操作系统。更改此电脑的设置，使其在查找硬盘之前在 CD 驱动器查找系统文件。此外，为了避免软磁盘传播病毒，配置计算机始终尝试从硬盘启动，而不是软磁盘。记住保存你的更改。


    注意：如果需要重启模拟计算机，请使用左下角的关闭/开启按钮。


    ### 步骤


    计算机的启动顺序决定了 BIOS 查看启动文件的顺序。你可以使用 Boot 菜单自定义启动顺序。由于一个“启动设备”实际上可能包含多种硬件，你可以通过选择并修改底部的类别（如硬盘或可移动设备）来进一步控制启动顺序。


    完成以下步骤：


    - 1. 模拟窗口打开后快速按下 **F1** 键进入 BIOS 设置程序。（如果你没有及时按下 F1，计算机给了 DOS 提示符，请点击屏幕左下角的 **关闭/开启**
    按钮重启实验。）


    查看 BIOS 设置界面底部的说明。如何选择菜单？


    如何选择一个项目？


    如何保存并退出？


    - 2. 使用右箭头键选择 **Boot** 菜单。


    - 3. 使用向下箭头突出第一个启动设备位置的条目。


    - 4. 将 **可移动设备**移动到第三个启动设备位置，按两次 -（减）键。


    - 5. 使用向上箭头移动到第一个启动设备位置。


    - 6. 将 **硬盘** 移动到第二个启动设备位置，按一次 -（减）键。


    - 7. 要保存更改并退出设置实用程序，按 **F10** 键，然后按回车键接受更改。


    '
