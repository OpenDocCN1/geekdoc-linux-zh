    - Create a hard link file in /home/vedwards called contacts_link to /home/wadams/contacts.db


    Steps


    Linked files are files that are somehow associated with one another. There are
    two ways to link files:


    +   - A hard link creates an exact copy of a file in a different location. You
    can have an unlimited number of hard links to a file, but they must all be on
    the same file system. If one hard linked file is modified, all other copies of
    the file are also modified.

    - A symbolic link creates a shortcut to the original file.'
