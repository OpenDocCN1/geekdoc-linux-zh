    ### 步骤


    除了直接修改用户账户外，在使用 -G 选项时可以使用 usermod 命令将用户添加到组，这允许你让用户成为辅助组的成员。（因为主组组成关系会影响你发行版的权限结构，最好接受你发行版的默认主组。）


    与用户信息一样，组信息存储在 /etc/group 文件中。与 /etc/passwd 类似，etc/group 文件使用冒号隔开的列表来存储信息。下面显示了组文件的示例行：


