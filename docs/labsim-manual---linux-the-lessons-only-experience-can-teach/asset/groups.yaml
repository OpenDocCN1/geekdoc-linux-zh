    # 3.4.6 LOG OUT OF THE SYSTEM


    Scenario


    Your system administrator scheduled a system update that requires all machines
    to be running and all users to be logged out of the system. Log out of the system,
    but do not turn the computer off.


    Steps


    Most users find it advantageous to leave their computers running, even when they
    are away from their terminals. A running computer, however, presents security
    vulnerabilities if the user remains logged in. If you leave your terminal while
    you''re logged in as root, anyone can execute any command on the system, causing
    irreparable harm. To protect your system when you leave, simply issue the logout
    command, which ends your account session but leaves your machine running. When
    you return, submit your username and password, and resume working.


