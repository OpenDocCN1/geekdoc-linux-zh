    \ write, execute\n- Group = read, execute\n- Other = read, execute\n\n### Steps\n\
    \nEvery file has an *inode* (information node) that stores information about the\
    \ file, including permissions. The portion of the inode that stores permission\
    \ information is called the *mode*. The mode has three sections:\n\n- User (owner)\
    \ permissions\n- Group (group owner) permissions\n- Other (everyone on the Linux\
    \ system) permissions\n\nThere are three types of permissions contained in the\
    \ mode:\n\n- r (Read) – Open and read a file or a directory, list directory contents\
    \ (requires execute permission, also).\n- w (Write) – Open, read, edit a file\
    \ for a directory, add, delete, and rename files (requires execute permission,\
    \ also).\n- x (Execute) – Execute the file (if it's a program file) or the shell\
