- md: "\n## 9.2.3 FORMAT A HARD DISK\n\n### Scenario\n\nYou've installed a new hard\
    \ drive. Now you need to format it.\n\nYour task in this lab is to:\n\n- Format\
    \ the /dev/hdb2 volume with the ext3 file system.\n\n### Steps\n\nUnlike other\
    \ operating systems, Linux does not offer a single utility for formatting drives.\
    \ With Linux, each file system type has its own format command. However, there\
    \ is a single command (called mkfs) that acts as a wrapper command and which launches\
    \ the other formatting commands as required.\n\nComplete the following steps:\n\
    \n- 1. Type man mkfs to view the documentation for the mkfs command.\n\nWhat does\
    \ the -t option allow you to?\n\nWhich option can you include to check the disk\
    \ for bad blocks?\n\n- 2. To format the /dev/hdb2 volume with the ext3 file system,\
    \ type the following command: `mkfs -t ext3 /dev/hdb2`.\n\nComplete the following\
    \ table with information about the new file system.\n\n| Parameter | Value |\n\
    |---|---|\n| Block size | |\n| Fragment size | |\n| Total number of inodes | |\
    \ |\n| Automatic filesystem check interval | | |\n\n## 9.2.4 FORMAT A FLOPPY DISK\n\
    \n### Scenario\n\nTo back up some personal files, you have mounted a floppy disk\
    \ drive (ID fd0) and want to transfer some files to it.\n\nYour task in this lab\
    \ is to format the floppy disk with ext2.\n\n### Steps\n\n- 1. To format the /dev/hdb2\
    \ volume with the ext3 file system, type the following command: `mkfs -t ext2\
    \ /dev/fd0`\n\nComplete the following table with information about the new file\
    \ system.\n\n| Parameter | Value |\n|---|---|\n| Block size | |\n| Fragment size\
    \ | | |\n| Total number of inodes | | |\n| Number of blocks per group | | |\n\
    | Automatic filesystem check interval | | |\n\n## 9.2.5 FORMAT A HARD DISK WITH\
    \ REISERFS\n\n### Scenario\n\nYou've installed a new hard drive, and you want\
    \ to use a high-performance file system that provides you with the following features:\n\
    \n- Journaling as a native feature (not as a modification to an older file system\
    \ type)\n- Indexing\n- Stability\n- Fast data transfer rates\n\nYour task in this\
    \ lab is to:\n\n- Format /dev/hdb2 with the file system that supports the listed\
    \ features.\n\n### Steps\n\nReiserFS is the newest Linux file system. Because\
    \ reiserFS was independently built from the ground up, its journaling capability\
    \ is native and more robust, offering a great deal of reliability. It is also\
    \ more efficient at storing small files than other file systems. Because this\
    \ is a newer file system, you need to make sure your system supports it. It is\
    \ quickly becoming a popular file system choice.\n\nComplete the following steps:\n\
    \n- 1. Type **man mkreiserfs** to view the documentation for the **mkreiserfs**\
    \ command.\nComplete the following table:\n\n| Command Switch | Description |\n\
    |---|---|\n| | Set the volume label |\n| | Designate a location for the journal\
    \ |\n| | Set the journal size |\n\n**Tips:** Press the Spacebar to scroll down\
    \ the help contents. Press **q** to exit the main page.\n\n- 2. To format the\
    \ /dev/hdb2 volume, type **mkreiserfs /dev/hdb2.**\n\nWhat happens if you continue\
    \ the operation?\n\n- 3. Press **y**, then press **Enter** to complete the operation.\n\
    \n## 9.2.6 CREATE A SWAP AREA\n\n### Scenario\n\nYou have just upgraded your computer\
    \ and added an extra 512 MB of RAM. Consequently, you want to increase your swap\
    \ space by adding a new swap area. The second hard disk has an unused partition\
    \ (hda2) that you want to format for the swap area.\n\nYour task in this lab is\
    \ to:\n\n- Create a swap area on /dev/hdb2.\n\n### Steps\n\nA swap file system\
    \ is used as virtual memory (the portion of the hard disk used to temporarily\
    \ store portions of main memory) by the operating system. A recommended practice\
    \ is to make the swap file equal in size to the amount of memory in your system.\n\
    \nComplete the following steps:\n\n- 1. To view the swap file on /dev/hda, type\
    \ fdisk -l.\n\nWhat is the size (in blocks) of the swap file on /dev/hda?\n\n\
    - 2. To create the swap space on /dev/hdb2, type mkswap /dev/hdb2.\n\nWhat is\
    \ the size (in kB) of the new swap file?\n\n## 9.3.3 MOUNT A VOLUME\n\n### Scenario\n\
    \nYou've installed a new hard drive with a volume named /dev/hdb2, and formatted\
    \ the volume with the ext3 file system. Now you want to mount the volume.\n\n\
    Your task in this lab is to:\n\n- Create the /mnt/disk directory.\n\n- Mount /dev/hdb2\
    \ to the /mnt/disk directory.\n\n### Steps\n\n**Mounting** is the process of making\
    \ a device accessible to users through the directory tree. When you mount a volume,\
    \ you mount it to a directory. The directory to which the device is attached is\
    \ called the mount point. When you access that directory in the file system, you\
    \ are actually accessing the volume mounted to that directory. (Remember that\
    \ device files are located in the /dev directory.)\n\nTo mount a volume, use the\
    \ following command syntax:\n\n```\nmount /dev/device /mountpoint\n```\n\nTo verify\
    \ that a volume is mounted correctly, use the **mount** command with no arguments.\
    \ Also, remember that the command syntax to create a directory is **mkdir** /path.\n\
    \nComplete the following steps:\n\n- 1. To view the currently mounted devices,\
    \ type **mount**.\n\n   Which filesystem does the hda device use?\n\n   Which\
    \ directory is the hda2 partition mounted to?\n\n   Why is hda1 mounted to the\
    \ /boot directory?\n2. Type **mkdir /mnt/disk** to create the /mnt/disk directory.\n\
    3. To mount the /dev/hdb2 device, type **mount /dev/hdb2 /mnt/disk**.\n4. Type\
    \ **mount** again to verify that /dev/hdb2 is properly mounted.\n\n## 9.3.4 UNMOUNT\
    \ A VOLUME\n\n### Scenario\n\nThe /dev/hdb2 volume is mounted to two different\
    \ locations: /mnt/data and /mnt/disk. You want to remove the redundant mount point.\n\
    \nYour task in this lab is to:\n\n- Unmount /dev/hdb2 from /mnt/data. Do not unmount\
    \ the volume from /mnt/disk.\n\n### Steps\n\nComplete the following steps:\n\n\
    - 1. To verify that /dev/hdb2 is mounted twice, type mount.\n2. Switch to the\
    \ / / directory by typing cd /.\n3. Type unmount /dev/hda2.\n\nWhy does the system\
    \ tell you that you can't unmount the volume?\n\n- 4. Type cd to switch back to\
    \ the root directory.\n5. To unmount /dev/hdb2, type unmount /dev/hdb2.\n\n##\
    \ 9.3.5 MOUNT DEVICES\n\n### Scenario\n\nYou need to install a new application\
    \ from CD-ROM and a license file from a floppy disk. However, neither the CD-ROM\
    \ drive (device ID cdrom) nor the floppy drive (device ID fd0) is mounted.\n\n\
    Your task in this lab is to:\n\n- Mount the CD-ROM drive to /mnt/cdrom directory.\n\
