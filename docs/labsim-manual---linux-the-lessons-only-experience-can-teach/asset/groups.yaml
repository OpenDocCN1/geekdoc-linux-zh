    # Steps


    A computer''s boot order determines the order in which the BIOS looks at devices
    for bootable operating system files. You can customize the boot order using the
    Boot menu. Because a "boot device" might actually include multiple types of hardware,
    you can maintain further control over the boot order by selecting and modifying
    a category at the bottom of the screen such as Hard Drives or Removable Devices.


    Complete the following steps:


    +   1. Quickly after the simulation window opens, press the **F1** key to enter
    the BIOS setup program. (If you don''t press F1 soon enough, and the computer
    gives you a DOS prompt, press the **Power Off/Power On** button in the lower left
    corner of the screen to restart the lab.)


    Examine the instructions at the bottom of the BIOS Setup Utility screen. How do
    you select a menu?


    How do you select an item?


    How do you save and exit?


    +   2. Use the Right arrow key to select the **Boot** menu.


    +   3. Use the Down arrow key to highlight the entry for the First Boot Device
    position.


    +   4. To move **Removable Devices** to the Third Boot Device position, press
    the - (minus) key twice.


    +   5. Use the Up arrow key to move to the First Boot Device position.


    +   6. To move **Hard Drive** to the Second Boot Device position, press the -
    (minus) key once.


    +   7. To save your changes and exit the setup utility, press the **F10** key,
    then press Enter to accept the changes.'
- md: "\n## 7.1.2 DISABLE MEMORY TESTS\n\nScenario\n\nA user complains of a computer\
    \ that counts its memory every time it boots. To speed up the boot process, you\
    \ want the computer to skip the memory count. Configure the computer appropriately.\
    \ Remember to save your changes.\n\n**Note:** If you need to restart the simulated\
    \ computer, use the Power On/Power Off button in the lower left corner of the\
    \ lab.\n\n### Steps\n\nYou can speed up the boot process by enabling Quick Boot\
    \ mode. This allows the BIOS to skip certain POST routines such as counting extended\
    \ memory. However, while this speeds up the boot process, it increases the risk\
    \ of a hardware error going undetected.\n\nComplete the following steps:\n\n-\
    \ 1. Quickly after the simulation window opens, press the **F1** key to enter\
    \ the BIOS setup program. (If you don't press F1 soon enough, and the computer\
    \ gives you a DOS prompt, press the **Power Off/Power On** button in the lower\
    \ left corner of the screen to restart the lab.)\n- 2. Use the Right arrow key\
    \ to select the **Boot** menu.\n- 3. Use the Down arrow key to move to the QuickBoot\
    \ Mode setting.\n- 4. To change the setting to Enabled, press the - (minus) key.\n\
    - 5. Press the **F10** key to save and exit. Press the Enter key to accept the\
    \ changes.\n\n## 7.1.3 ENABLE THE PARALLEL PORT\n\nScenario\n\nA user has connected\
    \ a scanner to a computer's parallel port, but the scanner does not work. You\
    \ verify that the proper driver and other software are loaded. The scanner powers\
    \ on okay, but no communication between the scanner and computer occurs. The user\
    \ admits that this is the first device ever connected to the parallel port. You\
    \ suspect that the parallel port has been disabled in the BIOS. Enable the parallel\
    \ port keeping its default configuration settings. Remember to save your changes.\n\
    \nNote: If you need to restart the simulated computer, use the Power On/Power\
    \ Off button in the lower left corner of the lab.\n\n### Steps\n\nHardware devices\
    \ on a motherboard are either enabled and disabled by setting jumpers on the motherboard\
    \ or by configuring the BIOS, which is most common with modern motherboards. You\
    \ can locate settings for hardware devices by exploring the menus and using the\
    \ Item Specific Help.\n\nComplete the following steps:\n\n- 1. Quickly after the\
    \ simulation opens, press the F1 to enter the BIOS setup program. (If you don't\
    \ press F1 soon enough, and the computer gives you a DOS prompt, press the Power\
    \ Off/Power On button in the lower left corner of the screen to restart the lab.)\n\
    - 2. Use the Right arrow key to select the Advanced menu.\n- 3. Use the Down arrow\
    \ to highlight Peripheral Configuration, then press Enter.\n- 4. Use the Down\
    \ arrow to move to the Parallel port setting.\n- 5. To change the setting to Enabled,\
    \ press the - (minus) key.\n- 6. To save your changes and exit the setup utility,\
    \ press the F10 key, then press Enter.\n\n## 8.0\n## Managing Devices\n\n## 8.1.3\
    \ INSERT A MODULE INTO THE KERNEL\n\nScenario\n\nYou just got a new PowerMate\
    \ input device that you want to use on your computer. You don't think that the\
    \ module has been inserted into the kernel yet.\n\nYour task in this lab is to:\n\
    \n- Insert the *powermate* module into the kernel.\n\n### Steps\n\nA kernel module\
    \ is similar to a device driver. Modules extend the capabilities of the kernel.\
    \ Module types include:\n\n- Device drivers\n- File system drivers\n- System calls\n\
    - Network drivers (protocols and interfaces)\n- TTY line disciplines\n- Executable\
    \ interpreters\n\nWhen the system boots, it uses one of the following files to\
    \ automatically load modules (the exact file used depends on the implementation):\n\
    \n- /etc/modules.conf\n- /etc/conf.modules\n- /etc/modprobe.conf\n\nYou can load\
    \ and unload modules manually. To load a module manually, use the following command\
    \ syntax:\n\n```\ninsmod module_name\n```\n\n**insmod** will fail if the module\
    \ you try to loads has unloaded dependencies. Use the **-p** switch with the name\
    \ to verify that a specific module was loaded successfully.\n\nComplete the following\
    \ steps:\n\n- 1. To view the modules that are loaded in the kernel, type **lsmod**.\n\
    \  Which modules are dependent on (used by) the input module?\n- 2. To insert\
    \ the powermate module into the kernel, type **insmod powermate**.\n- 3. Type\
    \ **lsmod**.\n  Which modules does the powermate module depend on?\n\nWhy does\
    \ it depend on these particular modules?\n\n## 8.1.4 REMOVE A MODULE FROM THE\
    \ KERNEL\n\nScenario\n\nYou've been experiencing problems with your PS/2 mouse,\
    \ so you bought a USB mouse. Now you want to remove the PS/2 mouse driver from\
    \ the kernel.\n\nYour task in this lab is to:\n\n- View the installed modules\
    \ and locate the one with *mouse* in its name.\n- Remove the mouse driver module\
    \ from the kernel.\n\n### Steps\n\nComplete the following steps:\n\n- 1. To view\
    \ the modules that are loaded in the kernel, type `lsmod`.\n- 2. Locate the module\
    \ name that you need to remove. Use the `rmmod` command followed by the module\
    \ name to remove it.\n- 3. Type `lsmod` to verify that the module was removed.\n\
    \n## 8.4.2 PRINT A FILE\n\nScenario\n\nYou are logged on as wadams. As part of\
    \ a presentation, you need to print the sales document. Your task in this lab\
    \ is to print the sales document in /home/wadams.\n\n### Steps\n\nComplete the\
    \ following steps:\n\n- Type man lpr to view the documentation for the lpr command.\n\
    Complete the following table.\n\n| Command Switch | Function |\n| :--- | :---\
    \ |\n| | Encrypt the connection to a printer |\n| | Print to a specific printer\
    \ using the printer name |\n| | Set the job name |\n| | Print a specific number\
    \ of copies |\n| | Delete a job from the queue after printing |\n\nTips: Press\
    \ the Spacebar to scroll down the help contents. Press q to exit the man page.\n\
    \n- To send the document to the print queue, type lpr sales.\n\n## 8.4.3 REMOVE\
    \ A PRINT JOB\n\nScenario\n\nThe user bcassini sent a document called baby1 to\
    \ the printer. The document is a large photo file that is taking up the printing\
    \ resources. Jobs behind baby1 cannot print.\n\nYou must complete the following\
    \ tasks:\n\n- Find the baby1 job number.\n- Delete the baby1 job from the queue.\n\
    \n### Steps\n\nIn addition to printing, you can manage your print jobs as well\
    \ as jobs from other users, as long as you have permissions to print queue management.\n\
    \nComplete the following steps:\n\n- 1. Type **man lpq** to view the documentation\
    \ for the **lpq** command.\n\nWhat does the **-a** option do?\n\nWhat does the\
    \ **-l** option do?\n\n- 2. To view the jobs in the queue, type **lpq**.\n\nWho\
    \ is the owner of the proj_outline job?\n\nWhat is the size (in bytes) of the\
    \ devel_projects print job?\n\nWhat is the print job number for baby1?\n\n- 3.\
    \ To remove the baby1 job, type **lprm** followed by the job number you found\
    \ in step 2.\n- 4. Type **lpq** to verify that the operation succeeded.\n\n##\
    \ 9.0\n## Disks and Volumes\n\n## 9.1.3 FIND THE BOOT DEVICE\n\nUse fdisk -l to\
    \ find the boot disk and answer the following questions about the boot disk.\n\
    \n- Is the a SCSI or IDE disk?\n- Which physical disk is the boot disk on?\n-\
    \ Which disk partition is the boot disk on?\n\n### Explanation\n\nClick the Simulation\
    \ button and type fdisk -l command to find the information to answer the questions.\n\
    \n- An hd at the beginning of a device file name denotes an IDE drive, and an\
    \ sd at the beginning of a device file name denotes a SCSI drive.\n- The boot\
    \ device is defined by an * in the Boot column.\n\n## 9.1.4 FIND THE SWAP DEVICE\n\
    \nUse fdisk -l to find the swap area and answer the following questions about\
    \ the disk that holds the swap area.\n\n- Is the a SCSI or IDE disk?\n- Which\
    \ physical disk is the swap area on?\n- Which disk partition is the swap area\
    \ on?\n\n### Explanation\n\nClick the Simulation button and type fdisk -l command\
    \ to find the information to answer the questions.\n\nA swap file system is used\
    \ as virtual memory (the portion of the hard disk used to temporarily store portions\
    \ of main memory) by the operating system. A recommended practice is to make the\
    \ swap file equal in size to the amount of memory in your system.\n"
  mdcn: "\n\n## 7.1.2 禁用内存测试\n\n场景\n\n用户投诉计算机在每次启动时都会计算内存。为了加快启动过程，你希望计算机跳过内存计数。请适当配置计算机。记得保存你的更改。\n\
    \n**注意：** 如果你需要重启模拟计算机，请使用实验室左下角的开启/关闭（Power On/Power Off）按钮。\n\n### 步骤\n\n你可以通过启用快速启动（Quick\
    \ Boot）模式来加快启动过程。这允许 BIOS 跳过某些 POST 程序，例如计算扩展内存。然而，虽然这加快了启动过程，但增加了硬件错误未被检测到的风险。\n\
    \n完成以下步骤：\n\n- 1. 在模拟窗口打开后，迅速按下 **F1** 键进入 BIOS 设置程序。（如果没有及时按下 F1 且计算机给出了 DOS\
    \ 提示符，请点击屏幕左下角的关闭/开启（Power Off/Power On）按钮重启实验室。）\n- 2. 使用右方向键选择 **Boot** 菜单。\n\
    - 3. 使用下方向键移动到 QuickBoot Mode 设置。\n- 4. 要将设置更改为 Enabled（启用），请按下 -（减号）键。\n- 5.\
    \ 按下 **F10** 键保存并退出。按下 Enter 键接受更改。\n\n## 7.1.3 启用并行端口\n\n场景\n\n用户将一个扫描器连接到计算机的并行端口，但扫描器无法工作。你已确认加载了正确的驱动程序和其他软件。扫描器正常电源，但扫描器与计算机之间没有发生通信。用户承认这是第一个连接到并行端口的设备。你怀疑并行端口在\
    \ BIOS 中被禁用。启用并行端口并保持其默认设置。记得保存你的更改。\n\n注意：如果你需要重启模拟计算机，请使用实验室左下角的开启/关闭（Power\
    \ On/Power Off）按钮。\n\n### 步骤\n\n主板上的硬件设备可以通过设置主板上的跳线帽或通过配置 BIOS 来启用或禁用，后者在现代主板上最为常见。你可以通过浏览菜单和使用项目特定帮助（Item\
    \ Specific Help）来查找硬件设备的设置。\n\n完成以下步骤：\n\n- 1. 在模拟打开后，迅速按下 F1 进入 BIOS 设置程序。（如果没有及时按下\
    \ F1 且计算机给出了 DOS 提示符，请点击屏幕左下角的关闭/开启（Power Off/Power On）按钮重启实验室。）\n- 2. 使用右方向键选择\
    \ Advanced 菜单。\n- 3. 使用下方向键突出 Peripheral Configuration（外设配置），然后按下 Enter。\n- 4.\
    \ 使用下方向键移动到 Parallel port（并行端口）设置。\n- 5. 要将设置更改为 Enabled（启用），请按下 -（减号）键。\n- 6.\
    \ 要保存更改并退出设置程序，按下 F10 键，然后按下 Enter。\n\n## 8.0\n## 设备管理\n\n## 8.1.3 向内核插入模块\n\n\
    场景\n\n你刚获得了一个新的 PowerMate 输入设备并想在计算机上使用它。你不认为该模块尚未插入到内核中。\n\n你在本实验室中的任务是：\n\n\
    - 将 *powermate* 模块插入内核。\n\n### 步骤\n\n内核模块类似于设备驱动程序。模块扩展了内核的功能。模块类型包括：\n\n- 设备驱动程序\n\
    - 文件系统驱动程序\n- 系统调用\n- 网络驱动程序（协议和接口）\n- TTY 行规程\n- 可执行解释器\n\n当系统启动时，它会使用以下文件之一来自动加载模块（具体使用的文件取决于实现）：\n\
    \n- /etc/modules.conf\n- /etc/conf.modules\n- /etc/modprobe.conf\n\n你可以手动加载和卸载模块。要手动加载模块，请使用以下命令语法：\n\
    \n```\ninsmod module_name\n```\n\n如果尝试加载的模块具有未卸载的依赖项，**insmod** 将失败。使用带有名称的 **-p**\
    \ 选项来验证特定模块是否成功加载。\n\n完成以下步骤：\n\n- 1. 输入 **lsmod** 查看内核加载的模块。\n  哪些模块依赖于（被输入模块使用）？\n\
    - 2. 要向内核插入 powermate 模块，输入 **insmod powermate**。\n- 3. 输入 **lsmod**。\n  powermate\
    \ 模块依赖于哪些模块？\n\n为什么它依赖于这些特定的模块？\n\n## 8.1.4 从内核移除模块\n\n场景\n\n你的 PS/2 鼠标一直出现问题，所以你买了一个\
    \ USB 鼠标。现在你想要从内核中移除 PS/2 鼠标驱动程序。\n\n你在本实验室中的任务是：\n\n- 查看已安装的模块并找到名称中包含 *mouse*\
    \ 的模块。\n- 从内核中移除鼠标驱动模块。\n\n### 步骤\n\n完成以下步骤：\n\n- 1. 输入 `lsmod` 查看内核加载的模块。\n-\
    \ 2. 找到你需要移除的模块名称。使用 `rmmod` 命令后跟模块名称来移除它。\n- 3. 输入 `lsmod` 验证模块已成功移除。\n\n## 8.4.2\
    \ 打印文件\n\n场景\n\n你以 wadams 的身份登录。作为演示的一部分，你需要打印销售文档。你在本实验室中的任务是打印 /home/wadams\
    \ 中的销售文档。\n\n### 步骤\n\n完成以下步骤：\n\n- 输入 `man lpr` 查看 lpr 命令的文档。\n完成下表。\n\n| 命令开关\
    \ | 功能 |\n| :--- | :--- |\n| | 加密到打印机的连接 |\n| | 使用打印机名称打印到特定打印机 |\n| | 设置作业名称\
    \ |\n| | 打印指定份数 |\n| | 打印后从队列中删除作业 |\n\n提示：按空格键向下滚动帮助内容。按 q 退出帮助页。\n\n- 要将文档发送到打印队列，输入\
    \ lpr sales。\n\n## 8.4.3 移除打印作业\n\n场景\n\n用户 bcassini 向打印机发送了一个名为 baby1 的文档。该文档是一个大照片文件，正占用打印资源。baby1\
    \ 之后的作业无法打印。\n\n你必须完成以下任务：\n\n- 找到 baby1 的作业号。\n- 从队列中删除 baby1 作业。\n\n### 步骤\n\
    \n除了打印之外，只要你有打印队列管理权限，你就可以管理自己的作业以及其他用户的作业。\n\n完成以下步骤：\n\n- 1. 输入 **man lpq**\
    \ 查看 **lpq** 命令的文档。\n\n**-a** 选项的作用？\n\n**-l** 选项的作用？\n\n- 2. 输入 **lpq** 查看队列中的作业。\n\
    \nproj_outline 作业的所有者是谁？\n\ndevel_projects 打印作业的大小（字节）是多少？\n\nbaby1 的打印作业号是多少？\n\
    \n- 3. 要移除 baby1 作业，输入 **lprm** 后跟步骤 2 中找到的作业号。\n- 4. 输入 **lpq** 验证操作是否成功。\n\n\
    ## 9.0\n## 磁盘与卷\n\n## 9.1.3 查找启动设备\n\n使用 fdisk -l 找到启动磁盘并回答关于启动磁盘的问题后续。\n\n- 它是\
    \ SCSI 还是 IDE 磁盘？\n- 启动磁盘在哪个物理磁盘上？\n- 启动磁盘在哪个磁盘分区上？\n\n### 解释\n\n点击 Simulation（模拟）按钮并输入\
    \ fdisk -l 命令查找回答问题的信息。\n\n- 设备文件名开头的 hd 表示 IDE 驱动器，设备文件名开头的 sd 表示 SCSI 驱动器。\n\
    - 启动设备由 Boot 列中的 * 号定义。\n\n## 9.1.4 查找交换设备\n\n使用 fdisk -l 找到交换区域并回答关于持有交换区域磁盘的问题。\n\
    \n- 它是 SCSI 还是 IDE 磁盘？\n- 交换区域在哪个物理磁盘上？\n- 交换区域在哪个磁盘分区上？\n\n### 解释\n\n点击 Simulation（模拟）按钮并输入\
    \ fdisk -l 命令查找回答问题的信息。\n\n交换文件系统被操作系统用作虚拟内存（用于临时存储主内存内存的硬盘部分）。建议的做法是使交换文件的大小与系统内存的大小相等。\n\
    \n"
