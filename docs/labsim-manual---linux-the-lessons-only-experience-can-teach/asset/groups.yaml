    ## 10.1.4 读取引导文件


    此系统已配置为另一个操作系统进行双启动。打开 `lilo.conf` 文件并找到以下问题的答案。


    - 默认操作系统的标签（label）是什么？

    - LILO 在启动到默认操作系统之前会显示多少秒的提示符（prompt）？

    - LILO 安装在哪里？

    - 是否启 LBA 支持？

    - 第二个操作系统的标签（label）是什么？


    ## 解释


    点击 **Simulation**（模拟）按钮并输入 `cat /etc/lilo.conf` 来查看 lilo 文件的内容。使用下表导航该文件，并找到回答问题所需的信息。


    | LILO 关键字示例 | 描述 |

    | --- | --- |

    | boot=/dev/hda | 提供 LILO 安装的硬盘的路径。此行必须指向以下内容之一：<br>如果你有两个 IDE 驱动器，它必须指向其中一个。<br>如果你有一个
    IDE 驱动器和一个 SCSI 驱动器，它必须指向 IDE 驱动器或 ID 为 0 (sda) 的 SCSI 驱动器。<br>如果你只有 SCSI 驱动器，它必须指向
    ID 0 或驱动器 ID 1。 |

    | map=/boot/map | 提供 LILO map 文件的路径。map 文件提供了 Linux 内核在硬盘上的位置。 |

    | install=/boot/boot.b | 提供引导扇镜像的路径。此行是可选的。如果不使用，默认设置为 /boot/boot.t。你可以将此条目替换为指向引导菜单的条目（让你选择使用哪种操作系统）。
    |

    | prompt | 显示 LILO 提示符。使用 prompt 和 timeout 来建立延迟，允许用户选择引导镜像。 |

    | timeout=40 | 指定 LILO 在继续之前等待用户输入的时间（以十分之一秒为单位，因此 40 等于 4 秒）。 |

    | message=/boot/message | 提供在启动时显示的文本消息或图形化界面的路径。（你可以通过按下 Ctrl + c 来覆盖此设置并接收提示符。）如果你更改了该行指向的源文件，必须运行
    lilo。 |


    ## Linux+ LabSim 手册


    | LILO 关键字示例 | 描述 |

    | --- | --- |

    | lba32 | 建立大块寻址（32位），并允许 LILO 从磁盘上的任何位置（超过 1024 限制）启动。仅在 BIOS 支持 LBA 时使用 lba32。如果不支持
    LBA，使用 linear 使 LILO 进行扇区寻址。 |

    | default=linux | 指定默认操作系统。该值对应于文件中后面列出的操作系统标签之一。 |

    | image=/boot/vmlinuz-2.2.5-15 | image 部分用于 Linux 操作系统。lilo.conf 文件中的第一个 image=
    是默认的。image= 关键字给出内核的路径。 |

    | label=linux | label= 关键字显示在提示符下方引导菜单上（或 LILO GUI 上）显示的显示的名称。 |

    | initrd=/boot/initrd-2.4.20-8.img | in-itrd= 关键字提供 RAM 磁盘镜像的路径。 |

    | read-only root=/dev/hda3 | read-only 在启动过程中将根分区设为只读。root= 关键字提供根分区的路径。其他部分用于非
    Linux 操作系统。 |

    | other=/dev/hda1 label=W95 table=/dev/hda | other= 关键字提供该分区上引导加载程序的路径。label=
    关键字显示在提示符下方引导菜单上（或 LILO GUI 上）显示的名称。table= 关键字提供分区表信息的路径。 |


    ## 10.2.3 立即关机


    ### 场景


    你的设施停电了。你有一个 UPS（不间断电源）可以保护你的系统并提供足够的电力让你安全关机。


    你在本实验中的任务是使用命令行立即关闭系统。


    ### 步骤


    完成以下步骤：


    - 1. 输入 **man shutdown** 以查看 **shutdown** 命令的文档。完成下表：


    | 命令开关 | 描述 |

    | --- | --- |

    | | 使用 /etc/shutdown.allow 文件 |

    | | 定义关机前等待的秒数 |

    | | 发送关机警告消息 |

    | | 关机后重启机器 |

    | | 关机后停止 |

    | | 阻止关机命令执行 |


    **提示：** 按空格键向下滚动查看帮助内容。按 **q** 退出帮助页。


    - 2. 要立即关闭系统，请输入 **shutdown -h now**。


    ## 10.2.4 带通知的关机


    ### 场景


    你计划并通知了用户你需要在一天结束关闭机器进行例行维护。然而，在关闭系统之前，你想给用户十五分钟的时间来保存数据并退出系统。


    你在本实验中的任务是：


    - 延迟 15 分钟关闭机器，并向所有登录用户发送消息。


    ### 步骤


    使用 **shutdown** 命令时，你可以将 **now** 替换为时间参数。例如，+3 允许系统在三分钟后关闭，而不是立即关机。这在你想要给用户在系统离线之前留出退出时间时有用。


    完成以下步骤：


    - 要带时间延迟关闭系统，请输入 `shutdown -h +15`。（此时你可以退出实验；不需要等待十五分钟再退出即可正确回答实验答题。）


    ## 10.2.5 关机并重启


    ### 场景


    你遇到了需要重启的问题。你想通知用户系统将关闭。


    你在本实验中的任务是：在 5 分钟后重启系统。


    ### 步骤


    完成以下步骤：


    - 要立即关闭系统，请输入 **shutdown -h now**。


    - 要重启系统，请按 **Power** 按钮。


    - 要延迟 5 分钟关闭系统，请输入 `shutdown -h +5`。（此时你可以退出实验；不需要等待十五分钟再退出即可正确回答实验答题。）


    ## 10.2.6 控制关机用户


    ### 场景


    你之前的 shutdown 命令出了问题。你想防止除某些用户以外的用户关机。


    你在本实验中的任务是：


    - 创建 shutdown.allow 文件。

    - 在 shutdown.allow 文件中授权 Cronin 和 Maggie。

    - 使用 inittab 检查系统。


    ### 步骤


    系统使用 /etc/shutdown.allow 文件来验证谁可以关机。该开关最常见的用法是编辑 inittab。如果文件不存在，则对谁可以关机没有限制。


    完成以下步骤：


    1. 输入 `vi /etc/shutdown.allow` 创建 shutdown.allow 文件。

    2. 要进入插入模式，按 `i`。

    3. 分行输入 Cronin 和 Maggie。

    4. 按 Esc 键进入命令模式。

    5. 输入 `:wq` 保存并退出。

    6. 要编辑 inittab，输入 `vi /etc/inittab`。

    7. 按 `i`。

    8. 找到该部分。在以下行添加 `-a` 开关：

    9. 按 Esc 键并输入 `:wq` 保存并退出。


    ## 13.0 故障排除


    ## 13.1.3 查看 /PROC 信息 1


    查看 /proc 目录中的各种文件以找到以下问题的答案。


    - CPU 速度是多少（MHz）？输入精确的总数（包括小数）。

    - 系统有多少多少物理内存（kB）？在相应文件中文件中查找 `MemTotal` 行。

    - Linux 内核版本是什么？按 n.n.n-n 的格式输入版本号。


    ### 步骤


    /proc 文件系统是一个虚拟文件系统，包含当前系统信息。/proc 内部的文件和目录由内核引用。使用这些文件可以查看系统信息，并在某些情况下通过编辑文件来更改系统状态。


    完成以下步骤：


    1. 点击 Simulation 按钮启动模拟器。

    2. 要查看 /proc 目录下的文件，请输入 `ls /proc`。


    根据文件名，完成下表，填写你认为应该选择的查找特定信息的对应。


    | 要查找...的信息 | 查看此文件 |

    | --- | --- |

    | CPU | |

    | I/O 端口 | |

    | Linux 内核版本 | |

    | 内存 | |


    3. 使用 `cat` 命令查看回答问题所需的文件。例如，使用 `cat /proc/ioports` 查看该文件的内容。

    4. 点击 Done 按钮，并使用你在第 3 步中找到的信息回答问题。


    '
