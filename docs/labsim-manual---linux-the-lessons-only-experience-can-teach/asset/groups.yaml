  mdcn: "\n\n## 9.2.3 格式化硬盘\n\n### 场景\n\n你安装了一个新的硬盘。现在你需要对它进行格式化。\n\n你在实验中的任务是：\n\n\
    -   使用 ext3 文件系统格式化 /dev/hdb2 卷。\n\n### 步骤\n\n与其他操作系统不同，Linux 并不提供单一的驱动格式化工具。在\
    \ Linux 中，每种文件系统类型都有自己的格式化命令。然而，有一个单一命令（称为 mkfs）作为封装命令，根据需要启动其他格式化命令。\n\n完成以下步骤：\n\
    \n-   1. 输入 `man mkfs` 查看 `mkfs` 命令的文档。\n\n-t 选项允许你做什么？\n\n包含哪个选项可以检查磁盘是否存在坏块？\n\
    \n-   2. 使用 ext3 文件系统格式化 /dev/hdb2 卷，输入以下命令：`mkfs -t ext3 /dev/hdb2`。\n\n用关于新文件系统的信息完成以下表格。\n\
    \n| 参数 | 值 |\n|---|---|\n| 块大小 (Block size) | |\n| 碎片大小 (Fragment size) | |\n\
    | inode 总数 | |\n| 自动文件系统检查间隔 | |\n\n## 9.2.4 格式化软盘\n\n### 场景\n\n为了备份一些个人文件，你挂载了一个软盘驱动器（ID\
    \ fd0），并想将一些文件传输到其中。\n\n你在实验中的任务是使用 ext2 格式化软盘。\n\n### 步骤\n\n-   1. 使用 ext3 文件系统格式化\
    \ /dev/hdb2 卷，输入以下命令：`mkfs -t ext2 /dev/fd0`。\n\n用关于新文件系统的信息完成以下表格。\n\n| 参数 |\
    \ 值 |\n|---|---|\n| 块大小 (Block size) | |\n| 碎片大小 (Fragment size) | |\n| inode\
    \ 总数 | | |\n| 每组块数 | | |\n| 自动文件系统检查间隔 | |\n\n## 9.2.5 使用 REISERFS 格式化硬盘\n\n###\
    \ 场景\n\n你安装了一个新的硬盘，你想使用一种提供以下功能的高性能文件系统：\n\n-   作为原生功能的日志记录（而不是对旧版文件系统类型的修改）\n\
    -   索引\n-   稳定性\n-   快速的数据传输率\n\n你在实验中的任务是：\n\n-   使用支持上述功能的文件系统格式化 /dev/hdb2。\n\
    \n### 步骤\n\nReiserFS 是最新的 Linux 文件系统。由于 ReiserFS 是从头开始独立构建的，它的日志功能是原生且更健壮的，提供了极高的可靠性。它在存储小文件方面比其他文件系统更高。由于这是一个新的文件系统，你需要确保你的系统支持它。\n\
    \n完成以下步骤：\n\n-   1. 输入 **man mkreiserfs** 查看 **mkreiserfs** 命令的文档。\n完成以下表格：\n\n\
    | 命令开关 | 描述 |\n|---|---|\n| | 设置卷标签 |\n| | 指定日志存放位置 |\n| | 设置日志大小 |\n\n**提示：**\
    \ 按空格键向下滚动查看帮助内容。按 **q** 退出主页。\n\n-   2. 格式化 /dev/hdb2 卷，输入 **mkreiserfs /dev/hdb2**。\n\
    \n如果继续该操作会发生什么？\n\n-   3. 按 **y**，然后按 **Enter** 完成操作。\n\n## 9.2.6 创建交换区\n\n###\
    \ 场景\n\n你刚刚升级了电脑并增加了额外的 512 MB 内存。因此，你想通过添加新的交换区来增加交换空间。第二块硬盘有一个未使用的分区 (hda2)，你想将其格式化为交换区。\n\
    \n你在实验中的任务是：\n\n-   在 /dev/hdb2 上创建交换区。\n\n### 步骤\n\n交换文件系统被操作系统用虚拟内存（硬盘上用于临时存储主内存的部分）。推荐的做法是使交换文件的大小与系统内存的大小相等。\n\
    \n完成以下步骤：\n\n-   1. 要查看 /dev/hda 上的交换文件，输入 `fdisk -l`。\n\n/dev/hda 上的交换文件大小（块为单位）是多少？\n\
    \n-   2. 在 /dev/hdb2 上创建交换空间，输入 `mkswap /dev/hdb2`。\n\n新交换文件的大小（KB 为单位）是多少？\n\n\
    ## 9.3.3 挂载卷\n\n### 场景\n\n你安装了一个名为 /dev/hdb2 的卷的新硬盘，并用 ext3 文件系统格式化了该卷。现在你想挂载该卷。\n\
    \n你在实验中的任务是：\n\n-   创建 /mnt/disk 目录。\n-   将 /dev/hdb2 挂载到 /mnt/disk 目录。\n\n###\
    \ 步骤\n\n**挂载 (Mounting)** 是通过目录树使用户可以使用设备的过程。当你挂载一个卷时，你将其挂载到一个目录。设备连接的目录称为挂载点。当你在文件系统中访问该目录时，你实际上是在访问挂载到该目录的卷。（注意设备文件位于\
    \ /dev 目录。）\n\n要挂载卷，使用以下命令语法：\n\n```\nmount /dev/device /mountpoint\n```\n\n要验证卷是否正确挂载，请使用不带参数的\
    \ **mount** 命令。还要记住创建目录的命令语法是 **mkdir** /path。\n\n完成以下步骤：\n\n-   1. 要查看当前挂载的设备，输入\
    \ **mount**。\n\n   hda 设备使用什么文件系统？\n\n   hda2 分区挂载到哪个目录？\n\n   为什么 hda1 挂载到 /boot\
    \ 目录？\n2. 输入 **mkdir /mnt/disk** 创建 /mnt/disk 目录。\n3. 要挂载 /dev/hdb2 设备，输入 **mount\
    \ /dev/hdb2 /mnt/disk**。\n4. 再次输入 **mount** 以验证 /dev/hdb2 已正确挂载。\n\n## 9.3.4 卸载卷\n\
    \n### 场景\n\n/dev/hdb2 卷挂载两个不同的位置：/mnt/data 和 /mnt/disk。你想删除冗余的挂载点。\n\n你在实验中的任务是：\n\
    \n-   从 /mnt/data 卸载 /dev/hdb2。不要从 /mnt/disk 卸载该卷。\n\n### 步骤\n\n完成以下步骤：\n\n- \
    \  1. 要验证 /dev/hdb2 是否挂载了两次，输入 `mount`。\n2. 输入 `cd /` 切换到根目录。\n3. 输入 `unmount\
    \ /dev/hda2`。\n\n为什么系统提示你无法卸载该卷？\n\n-   4. 输入 `cd` 返回根目录。\n5. 要卸载 /dev/hdb2，输入\
    \ `unmount /dev/hdb2`。\n\n## 9.3.5 挂载设备\n\n### 场景\n\n你需要从光盘安装一个应用程序，并从软盘安装一个许可证文件。然而，光盘驱动器（设备\
    \ ID cdrom）和软盘驱动器（设备 ID fd0）都没有挂载。\n\n你在实验中的任务是：\n\n-   将光盘驱动器挂载到 /mnt/cdrom 目录。\n\
    -   将软盘驱动器挂载到 /mnt/floppy 目录。\n\n### 步骤\n\n完成以下步骤：\n\n-   1. 要查看 /etc 目录的内容，输入\
    \ `ls /etc`。注意目录已包含数据（文件和其他目录）。\n\n-   2. 输入 `mount /dev/cdrom /etc` 挂载光盘驱动器。\n\
    \n信息告诉了你关于 cdrom 设备状态什么？\n\n-   3. 输入 `ls /etc`。\n\n使用 /etc 作为挂载点有什么影响？（提示：光盘是空的）。\n\
    \n-   4. 要卸载 /dev/cdrom 设备，输入 `umount /etc`。\n\n-   5. 输入 `ls /etc`。\n\n当你挂载光盘驱动器时，/etc\
    \ 中的文件发生了什么？\n\n-   6. 要将 /dev/cdrom 和 /dev/fd0 设备挂载到相应的挂载点，执行以下命令：\n* mount /dev/cdrom\
    \ /mnt/cdrom\n* mount /dev/fd0 /mnt/floppy\n\n```\nroot@localhost:~# \nFile Edit\
    \ View Terminal Go Help\nLoading Linux...\nUncompressing Linux..., Ok, booting\
