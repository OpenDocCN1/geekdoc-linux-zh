    每个链接的大小是多少？


    - 3. 要查找 contacts.db 文件的信息，输入 ls -l /home/wadams。


    contacts.db 的所有者和组是谁？


    contacts.db 文件的大小是多少？


    ## 4.3.9 创建软链接


    场景


    你的公司使用一种名为 imitator 的专有图形程序（存储在根目录下）在过渡到每台机器授权的新图形应用程序之前创建图像。Maggie Brown（用户名
    mbrown）需要修改用 imitator 创建的文件。


    你在实验中的任务是在 /home/mbrown 创建一个指向 /imitator 的符号链接 imitator_link。


    步骤


    由于符号链接实际上是原始文件的快捷方式，当你打开符号链接并编辑文件时，你正在编辑原始文件。如果从系统中删除原始文件，符号链接将失效，因为它指向一个已不存在的文件。


    完成以下步骤：


    - 1. 创建符号链接，输入 ln -s /imitator /home/mbrown/imitator_link。

    2. 输入 ls -l /home/mbrown 获取关于符号链接的信息


    符号链接的大小是多少？


    /home/mbrown 中 imitator_link 文件的所有者是谁？

    - 3. 要查找 imitator 文件的信息，输入 ls -l。


    imitator 文件的大小是多少？

