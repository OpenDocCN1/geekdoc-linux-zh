    \ for the /usr/bin/passwd and /usr/bin/newgrp files?\n\n+ 4. To remove the SGID\
    \ permission from the files, type the following commands:\n    * `chmod g-s /usr/bin/kdesud`\n\
    \    * `chmod g-s /usr/bin/wall`\n    * `chmod g-s /usr/bin/write`\n\n+ 5. Type\
    \ ls -l /usr/bin | more.\n\nHow do the permissions for the /usr/bin/wall file\
    \ differ from the /usr/bin/kdesud and the /usr/bin/write files?\n\n## 4.1.9 CHANGE\
    \ THE UMASK 1\n\nScenario\n\nYou are logged in as wadams. You want to change your\
    \ default umask to give yourself and members of the groups to which you belong\
    \ full permissions to the files and directories you create. You want to deny permissions\
    \ for everyone else.\n\nChange your umask value to 007.\n\nSteps\n\nBy default,\
    \ files receive rw-rw-rw- (666) permissions, and directories receive rwxrwx (777)\
    \ permissions when they are created. In most cases, the default assignment gives\
    \ excessive permission to files and directories.\n\nYou can customize the default\
    \ permission assignments by setting a *umask*. The umask identifies which permissions\
    \ are *removed* from the default permissions when files and directories are created.\n\
    \nComplete the following steps:\n\n+ 1. To view your current umask, type **umask**.\n\
    \nWhat is your current umask?\n\nIn the following table, cross out the permissions\
