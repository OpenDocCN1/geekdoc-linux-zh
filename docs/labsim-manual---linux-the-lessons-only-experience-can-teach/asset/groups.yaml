    ## 3.1.5 查找用户 ID


    用户 schawla 的 UID 是什么？


    ### 步骤


    Linux 将账户信息存储在 /etc/passwd 和 /etc/shadow 文件中。每个用户都有一行描述该用户账户。每个账户都通过用户标识符 (UID)
    进行标识。UID 在 1 到 100 之间的账户供各种守护进程在登录系统时使用。用户的 UID 默认从 500 开始，root 除外，root 使用 UID
    0（零）。


    你可以使用 cat 命令来查看 /etc/passwd 和 /etc/shadow 文件。/etc/passwd 文件被分为七个用冒号隔开的字段，每个字段包含一个特定的用户数据。下面显示了
    passwd 文件中的示例行：


    ```

