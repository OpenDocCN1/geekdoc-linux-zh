    ### Steps


    One common backup and archive utility is **tar**. (short for tape archiver) creates
    an archive file directly on a file system or directly on a device. **tar** allows
    you to create new archives, extract files from existing archives, update files
    in existing archives, or store additional files in existing archives.


    Complete the following steps:


