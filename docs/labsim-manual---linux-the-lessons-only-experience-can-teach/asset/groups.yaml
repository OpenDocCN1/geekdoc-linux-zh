    program. (If you don''t press F1 soon enough, and the computer gives you a DOS
    prompt, press the Power Off/Power On button in the lower left corner of the screen
    to restart the lab.)

    2. Use the Right arrow key to select the Advanced menu.

    3. Use the Down arrow to highlight Peripheral Configuration, then press Enter.

    4. Use the Down arrow to move to the Parallel port setting.

    5. To change the setting to Enabled, press the - (minus) key.

