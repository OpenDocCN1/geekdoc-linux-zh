- img_proc: true
  md: '# Explanation


    Click the **Simulation** button and type `cat /etc/lilo.conf` to view the contents
    of the lilo file. Use the following table to navigate the file and find the information
    you need to answer the questions.


    | LILO Keyword Example | Description |

    | --- | --- |

    | boot=/dev/hda | Gives the path to the hard drive on which LILO is installed.
    This line must point to one of the following:


    If you have two IDE drives, it must point to one of them.


    If you have one IDE drive and SCSI drives, it must point to either the IDE drive
    or the SCSI drive with ID 0 (sda).


    If you have SCSI drives only, it must point to either ID 0 or drive ID 1. |

    | map=/boot/map | Gives the path to the LILO map file. The map file gives the
    location of the Linux kernel on the hard disk. |

    | install=/boot/boot.b | Gives the path to the boot sector image. This line is
    optional. When it is not used, the default setting is /boot/boot.t. It is possible
    to replace this entry with one that points to a boot menu (letting you choose
    which operating system to use). |

    | prompt | Displays a LILO prompt. Use prompt and timeout to build a delay to
    allow the user to choose a boot image. |

    | timeout=40 | Specifies the amount of time (in tenths of a second, so 40 equals
    4 seconds) that LILO waits for user input before proceeding. |

    | message=/boot/message | Gives either a text message or a path to a graphical
    screen to display at startup. (You can override this and receive a prompt by pressing
    Ctrl + c.) You must run lilo if you change the source file that the line points
    to. |'
  merge: -1
