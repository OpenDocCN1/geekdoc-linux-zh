  md: '# 3.3.7 EDIT QUOTAS 2


    Scenario


    Users have complained that the 7 day default grace period for soft limits is too
    short.


    Increase the grace period for users from 7 to 30 days.


    Steps


    While the hard and soft limits for blocks and inodes are set for each user individually,
    the length of time for which users can exceed soft limits is controlled centrally
    in the grace period file. Use the `edquota -u -t` command to modify the grace
    period for both blocks and inodes. When you use this command without specifying
    a username, the modifications you make apply to every user in the system for whom
    quotas are set.


    Complete the following steps:


