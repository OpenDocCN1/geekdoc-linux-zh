  md: '# 5.1.5 CHANGE THE DEFAULT RUNLEVEL


    Scenario


    To your system cannot load at boot up. The terminal shows a login prompt, but
    before you can log in, the GUI attempts to load and fails. This process repeats
    every two seconds, preventing you from logging in at the terminal. However, you
    can log in remotely, so you decide to change the default runlevel to avoid using
    the GUI at all.


    Your task in this lab is to:


    +   - Edit the /etc/inittab file and change the default runlevel so the system
    boots without the GUI.


    Steps


    The init (initialize) daemon is responsible for loading all the other daemons
    that bring the system to a usable state. (A daemon is a system service.) To load
    the other daemons, init uses the /etc/inittab (init table) configuration file.
    The graphic below shows you an example of part of an inittab file.


    ```

    id:5:initdefault:

    # System initialization.

    sii::sysinit:/etc/rc.d/rc.sysinit

    10:0:wait:/etc/rc.d/rc 0

    11:1:wait:/etc/rc.d/rc 1

    12:2:wait:/etc/rc.d/rc 2

    13:3:wait:/etc/rc.d/rc 3

    14:4:wait:/etc/rc.d/rc 4

    15:5:wait:/etc/rc.d/rc 5

    16:6:wait:/etc/rc.d/rc 6


    # Trap CTRL-ALT-DELETE

    ca::ctrlaltld::/sbin/shutdown -t3 -r now

    ```


    The current default runlevel is the number after id, which in this case is 5.
    You can edit the /etc/-inittab file to change the runlevel using the vi editor.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Complete the following steps:


    +   1. To edit the inittab file, type `vi /etc/initab`.


    +   2. Use the arrow keys to place the cursor under the **5** that follows **id:**


    +   3. To enter insert mode, press **i**.


    +   4. Press the **Delete** key to delete the current runlevel setting.


    +   5. To insert a runlevel that boots without the GUI, type **3**.


    +   6. Press the **Esc** key to enter command mode.


    +   7. Type`:wq` to save the changes to the file and exit vi.'
  merge: -1
