  md: '# 4.1.7 SET THE SUID BIT


    ![](img/8d2cfc37d0c66d3d99ab1a5ce6c5f9e3_70_0.png)


    Scenario


    You have a Linux workstation that you use at home for browsing the Internet, playing
    music, and writing letters. When you run your MP3 player, it sometimes pauses
    in playback. You have heard that you might be able to alleviate the problem by
    raising the priority of the program. You decide to set the SUID bit to automatically
    run the program as root thereby raising its priority.


    Your task in this lab is to set the SUID bit for the /usr/bin/xmms program. Do
    not change any other permissions on the file.


    Steps


    In addition to the read, write, and execute permissions, there are three sets
    of special permissions:


    +   - SUID - Set the User ID.

    - SGID - Set the Group ID.

    - Sticky Bit.


    SUID does not affect directories, but when it is set for a file that is executed,
    the SUID allows the user who executed the file to be the file owner as long as
    the file is executing.


    The most common use of SUID is to allow users to run a command as the root user.
    Users do not become the root user, but rather the command or program runs as if
    executed by the root user. Be careful in setting the SUID bit as it could give
    a program too many permissions.'
  merge: -1
  pgno: 70
