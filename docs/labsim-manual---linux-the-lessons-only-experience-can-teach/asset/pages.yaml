  md: '# 9.2.5 FORMAT A HARD DISK WITH REISERFS


    Scenario


    You''ve installed a new hard drive, and you want to use a high-performance file
    system that provides you with the following features:


    +   - Journaling as a native feature (not as a modification to an older file system
    type)

    - Indexing

    - Stability

    - Fast data transfer rates


    Your task in this lab is to:


    +   - Format /dev/hdb2 with the file system that supports the listed features.


    Steps


    ReiserFS is the newest Linux file system. Because reiserFS was independently built
    from the ground up, its journaling capability is native and more robust, offering
    a great deal of reliability. It is also more efficient at storing small files
    than other file systemsms. Because this is a newer file system, you need to make
    sure your system supports it. It is quickly becoming a popular file system choice.'
