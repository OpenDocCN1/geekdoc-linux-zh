- img_proc: true
  md: "# 13.2.3 START A NIC\n\nScenario\n\nYou share a number of files from your computer,\
    \ and you've received a number of calls from users who say they can't connect\
    \ to the files. You check your computer only to find that the Ethernet cable is\
    \ unplugged. You've plugged the Ethernet cable in, so now you you need to start\
    \ the network interface card (NIC).\n\nYour task in this simulation is to restart\
    \ the network interface card (NIC) without restarting the computer.\n\n# Steps\n\
    \nBefore you can restart a network card, you must find its alias. The card is\
    \ denoted by the letters eth followed by a number.\n\nComplete the following steps:\n\
    \n+   1. To find the network card's alias, type ifconfig -a.\n   How can you tell\
    \ the card is not up and running?\n2. To start the NIC, type ifup eth0.\n3. To\
    \ verify that the card is running, type ifconfig -a again."
  merge: -1
  pgno: 159
- img_proc: true
  md: '# 13.2.4 STOP A NIC


    Scenario


    You''ve experienced connectivity issues, and you suspect it may be one of the
    NICs in your computer.


    Your task in this simulation is to stop the eth1 NIC as the first step to try
    to isolate the problem.


    Steps


    Complete the following steps:


    +   1. To view the card''s status, type ifconfig -a.

    2. To stop the NIC, type ifdown eth1.'
  merge: -1
