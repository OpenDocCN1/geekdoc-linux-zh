  md: '# 3.3.6 EDIT QUOTAS 1


    Scenario


    Salman Chawla (user account schawla) has reached his user quota limit. Rather
    than delete some of his files, he wants more space. Your manager has approved
    an increase in his quota limit.


    Increase the hard and soft block limits on the schawla user account to 1048576
    Kb (1 Gb).


    Steps


    You can set quotas either on the amount of disk space available to a user (blocks)
    or on the number of files a user is allowed to create (inodes). Each setting uses
    both soft and hard limits. Users can exceed a soft limit for a certain period
    of time, but hard limits are absolute.


    Complete the following steps:


    +   - Type man edquota to view the documentation for the edquota command. Complete
    the following table.


    | Command Switch | Option |

    | -u | |

    | -g | |

    | -t | |


    > Tips: Press the Spacebar to scroll down the help contents. Press q to exit the
    main page.


    +   - To edit the quota for schawla, type edquota -u schawla.


    +   - Press i to edit the file.


    +   - Use the arrow keys to move the cursor to the space below the first soft
    and type 1048576 (use the delete key to delete extra spaces caused by the insertion).


    +   - Move the cursor to the space below the first hard and type 1048576 (use
    the delete key to delete extra spaces caused by the insertion).


    +   - Press the Esc key to enter command mode in vi.


    +   - Type :wq to save the changes and exit.'
  merge: -1
