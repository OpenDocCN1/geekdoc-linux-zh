  md: '# 7.1.2 DISABLE MEMORY TESTS


    Scenario


    A user complains of a computer that counts its memory every time it boots. To
    speed up the boot process, you want the computer to skip the memory count. Configure
    the computer appropriately. Remember to save your changes.


    **Note:** If you need to restart the simulated computer, use the Power On/Power
    Off button in the lower left corner of the lab.


    Steps


    You can speed up the boot process by enabling Quick Boot mode. This allows the
    BIOS to skip certain POST routines such as counting extended memory. However,
    while this speeds up the boot process, it increases the risk of a hardware error
    going undetected.


    Complete the following steps:


    +   1. Quickly after the simulation window opens, press the **F1** key to enter
    the BIOS setup program. (If you don''t press F1 soon enough, and the computer
    gives you a DOS prompt, press the **Power Off/Power On** button in the lower left
    corner of the screen to restart the lab.)

    2. Use the Right arrow key to select the **Boot** menu.

