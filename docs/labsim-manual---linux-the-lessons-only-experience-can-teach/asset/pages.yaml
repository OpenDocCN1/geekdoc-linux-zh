  md: '# 3.1.3 CREATE A USER ACCOUNT


    Scenario


    The VP of Marketing has told you that Paul Denunzio will join the company as a
    market analyst in two weeks. You need to create a new user account for him.


    Your task in this simulation is to:


    +   - Create the pdenunzio user account

    - Include the full name as a comment for the user account

    - Set the password to eye8cereal


    Steps


    Linux stores user account information in the /etc/passwd and /etc/shadow files.
    While you can edit these files manually, doing so can disable your system. As
    an alternative, use the useradd or passwd commands and their options to work with
    users.


    Complete the following steps:


    +   1. Type man useradd to view the documentation for the useradd command. Complete
    the following table:


    | Command Switch | Option |

    |---|---|

    | | Add a comment to the user account |

    | | Define the home directory for the user |

    | | Prevent creating the home directory |

    | | Set the password |

    | | Configure an expiration date |

    | | Display default values |


    Tips: Press the Spacebar to scroll down the help contents. Press q to exit the
    man page.'
  merge: -1
