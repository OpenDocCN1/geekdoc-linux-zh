  md: '# # 8.1.3 INSERT A MODULE INTO THE KERNEL


    Scenario


    You just got a new PowerMate input device that you want to use on your computer.
    You don''t think that the module has been inserted into the kernel yet.


    Your task in this lab is to:


    +   * Insert the *powermate* module into the kernel.


    Steps


    A kernel module is similar to a device driver. Modules extend the capabilities
    of the kernel. Module types include:


    +   * Device drivers

    * File system drivers

    * System calls

    * Network drivers (protocols and interfaces)

    * TTY line disciplines

    * Executable interpreters


    When the system boots, it uses one of the following files to automatically load
    modules (the exact file used depends on the implementation):


    +   * /etc/modules.conf

    * /etc/conf.modules

    * /etc/modprobe.conf'
  merge: -1
