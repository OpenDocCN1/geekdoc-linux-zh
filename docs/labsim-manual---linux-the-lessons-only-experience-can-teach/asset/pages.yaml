- img_proc: true
  md: '# 2.4.5 MODIFY AN EXISTING FILE


    Scenario


    You have just added a custom entry to your /etc/hosts file. After testing, however,
    you find that you have mistyped the line in the file.


    Your task in this lab is to:


    +   * Use vi to open the /etc/hosts file.

    * Modify the host name time-a.nis.gov to read time-a.nist.gov

    * Save your changes.


    Steps


    A text editor allows you to create and modify text files. Vim (vi improved) is
    the most common command-line text editor included with Linux. While there are
    vi commands that can take you to specific lines and positions in a file, you can
    also use the arrow keys to place the cursor in the correct position before you
    edit the file.


    Complete the following steps:


    +   1. To open the vi editor, type vi.

    2. Press i.

    How can you tell what vi will now allow you to do?

    3. Type your name at the top of the screen.

    How does this affect the screen?'
  merge: -1
  pgno: 16
- img_proc: true
  md: '4. Press the Esc (escape) key on the keyboard.

    What happened?


    5. Type :q.

    Did you exit vi? Why not?


    6. To exit vi without saving (writing) changes to the file, type :q!


    7. Use the following command to open the /etc/hosts file in vi: vi /etc/hosts.


    8. Use the arrow keys to position cursor under the last period in the time-a.nis.gov.


    9. To be able to enter text in the file, you must enter insert mode. To do this,
    type i.


    10. Type t to modify the hostname entry.


    11. To enter command mode to save the change to the file and exit vi, press the
    Esc key.


    12. To exit vi and write (save) the change to the file at the same time, use the
    following command: :wq.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 2.4.6 CREATE A NEW FILE


    Scenario


    In this lab, you will create and edit a file in vi. Complete the following tasks:


    +   - Open the vi editor with a new file named /root/shell.

    - Add the following lines to the file:

    ```

    SHELL=/bin/tsch

    export SHELL

    ```

    - Save and close the file.


    # Steps


    The vim text editor offers two working modes: command mode or insert mode. By
    default, the editor opens in command mode. To enter a command in command mode,
    generate a : (colon) prompt by typing <Shift> : . There are numerous ways to move
    from command mode to insert mode, but two of the most common ways are to type
    i or a and begin editing the file.


    Complete the following steps:


    +   1. To enter and create the new file at the same time, use the following command:

    vi /root/shell.

    2. To enter insert mode, type i.

    3. To add the first line of text to the file, type SHELL=/bin/tsch and press Enter.

    4. To add the second line of text, type export SHELL.

    5. To enter command mode, press the Esc (escape) key.

    6. To write the changes to the file and exit vi, type :wq.'
  merge: -1
  pgno: 18
- img_proc: true
