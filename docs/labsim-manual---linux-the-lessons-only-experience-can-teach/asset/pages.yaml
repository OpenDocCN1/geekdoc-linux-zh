- img_proc: true
  md: '# Steps


    The system uses the /etc/shutdown.allow file to verify who can shut down the system.
    The most common use of this switch is to edit the /etc/inittab file and add the
    -a switch to the CTRL-ALT-DELETE section (add it before the now -or other existing--time
    parameter option). When the switch is present, the shutdown.allow file checks
    to see if a listed user or root is logged on. If so, the system shuts down. If
    not, shutdown is not allowed. If the file does not exist, there are no restrictions
    on who can shut down the system.


    Complete the following steps:


    +   1. Type vi /etc/shutdown.allow to create the shutdown.allow file.

    2. To enter insert mode, press i.

    3. Type rcronn and mbrown on separate lines.

    4. Press the Esc key to enter command mode.

    5. Type :wq to save file and exit.

    6. To edit the inittab file, type vi /etc/inittab.

    7. Press i.

    8. Locate the Trap CTRL-ALT-DELETE section. Add the -a switch to the following
    line: ca::ctrlaltdel:/sbin/shutdown -t3 -r now (add it before the now parameter
    where the other switches are).\n9. Press the Esc key and type :wq to save and
    exit.'
  merge: -1
