  md: '# 10.1.4 READ THE BOOT FILE


    This system has been configured to dual boot another operating system. Open the
    lilo.conf file and find the answers the following questions.


    +   * What is the label of the default operating system?

    * How many seconds will LILO show the prompt before booting to the default OS?

