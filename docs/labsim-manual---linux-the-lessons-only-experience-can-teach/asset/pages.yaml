  md: "# Steps\n\n**Mounting** is the process of making a device accessible to users\
    \ through the directory tree. When you mount a volume, you mount it to a directory.\
    \ The directory to which the device is attached is called the mount point. When\
    \ you access that directory in the file system, you are actually accessing the\
    \ volume mounted to that directory. (Remember that device files are located in\
    \ the /dev directory.)\n\nTo mount a volume, use the following command syntax:\n\
    \n```\nmount /dev/device /mountpoint\n```\n\nTo verify that a volume is mounted\
    \ correctly, use the **mount** command with no arguments. Also, remember that\
    \ the command syntax to create a directory is **mkdir** /path.\n\nComplete the\
    \ following steps:\n\n+   1. To view the currently mounted devices, type **mount**.\n\
