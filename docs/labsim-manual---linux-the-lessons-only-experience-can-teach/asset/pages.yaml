  md: '# 13.1.3 VIEW /PROC INFORMATION 1


    View various files in the /proc directory to find the answers to the following
    questions.


    +   - What is the CPU speed (in MHz)? Enter the exact total (including decimal
    places).

    - How much physical memory does the system have in (in kB)? Look for the MemTotal
    line in the corresponding file.

    - What is the Linux kernel version? Enter the version in the format of n.n.n-n.


    # Steps


    The /proc file system is a virtual file system that contains current system information.
    Files and directories inside /proc are referenced by the kernel. Use these files
    to view system information and, in some cases, change the system state by editing
    the files


    Complete the following steps:


    +   1. Click the Simulation button to start the simulator.

    2. To view the files in the /proc directory, type ls /proc.


    Based on the file name, complete the following table with the filename you think
    should choose to find specific information.


    | To find information about... | View this file |

    | CPU | |

    | I/O Ports | |

    | Linux Kernel Version | |

    | Memory | |


    +   3. Use the cat command to view the contents of the files necessary to answer
    the questions. For example, use cat /proc/ioports to view the contents of that
    file.

    4. Click the Done button and answer the questions using the information you found
    in step 3.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# 13.1.4 VIEW /PROC INFORMATION 2


    View various files in the /proc directory to find the answers to the following
    questions.


    +   - What IRQ is used for the network card?

    - What is the I/O memory range used for the S3 Trio video card?

    - What device is on PCI bus 0, device 8, function 0?


    # Explanation


    Click the **Simulation** button and use the **cat** command to view the contents
    of the various files necessary to find the information required by the questions.'
  merge: -1
