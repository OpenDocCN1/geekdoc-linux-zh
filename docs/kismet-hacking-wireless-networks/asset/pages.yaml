- pgno: 243
  md: '# Introduction


    The goal of this chapter is to provide an explanation and demonstration of wardriving
    while using Kismet with BackTrack, a live Linux distribution. The focus will be
    on the fact that we''ll be using a live CD, so no installation is required, and
    very little configuration is necessary. This is also useful for those who are
    running Windows and need to use Kismet but don''t necessarily want to install
    an entire Linux distribution. It is also important to note that wardriving is
    just one example of why you might want to use Kismet from a live CD. Other possibilities
    are rogue access point (AP) detection or graphical mapping of networks.


    # Obtaining BackTrack


    This section will focus on acquiring BackTrack by download (direct or torrent),
    and then burning it to CD.


    # Downloading BackTrack


    If you don''t already have BackTrack, it will be necessary for you to download
    it. Point your favorite browser to http://www.remote-exploit.org/backtrack_download.html
    to find the download page for BackTrack (see Figure 10.1).


    # Figure 10.1 Remote-Exploit.org Download Page for BackTrack


    ![](img/d6ac176c353d2b7687c1186a140180a1_243_0.png)'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Both BackTrack 2 and BackTrack 3 Beta are available. Since BackTrack 3 Beta
    has very few bugs and is otherwise stable, this version is recommended (and will
    be the focus of this chapter). Furthermore, there are two versions of BackTrack
    3 Beta: a \~700 MB CD image version (used in this chapter), and a larger (\~1
    GB) version for Universal Serial Bus (USB) thumb drives that includes some additional
    (but unnecessary for our purposes) modules.


    You can download directly via Hypertext Transfer Protocol (HTTP) or File Transfer
    Protocol (FTP) from ten different mirrors, or by torrent. If you have the time,
    it is recommended (and more courteous) to use the torrent so that you can share
    some bandwidth. When you’re finished downloading the ISO, be sure to check the
    MD5 hash of the file. This will save you some hassle later if the burned CD doesn’t
    work correctly. You can find a simple Message Digest 5 (MD5) hash calculator at
    http://www.pc-tools.net/win32/md5sums/ (see Figure 10.2, with BT3b hash inset).
    Simply match the MD5 calculation with the hash posted at the Remote-Exploit download
    page, to confirm that your file is an authentic reproduction of the original,
    free from tampering or errors.


    # Figure 10.2 Confirming the MDS Hash


    ![](img/d6ac176c353d2b7687c1186a140180a1_244_0.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Burning BackTrack to CD


    Your downloaded file is an ISO, or CD image file. To use BackTrack, you''ll need
    to burn the ISO to a CD using any of the many available CD burning programs. A
    good and easy-to-use example is the program *DeepBurner*. A freeware version (DeepBurner
    Free) can be found at [http://www.deepburner.com/](http://www.deepburner.com/).


    While this chapter is not meant to be a tutorial on burning CDs, simply follow
    the wizard that starts when you open DeepBurner. Select a project type (Burn an
    ISO image), browse to and select your image file (bt3b141207.iso), select your
    CD write drive and write speed, and finally click Burn ISO (see Figure 10.3).
    It is that simple.


    > **TIP**

    > While your CD drive may be capable of burning at high speeds (40x and above),
    it is recommended that you burn BackTrack at slower speeds—preferably as slow
    as possible (4x or 8x). For whatever reason, more problems have occurred at higher
    burning speeds, and lower speeds have had better results.


    # Figure 10.3 DeepBurner Burns BackTrack to CD


    ![](img/d6ac176c353d2b7687c1186a140180a1_245_0.png)'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Configuring Kismet


    This section will focus on booting into BackTrack and configuring Kismet.


    # Booting into BackTrack


    To boot into BackTrack, insert the CD and restart your computer, taking care to
    ensure that your BIOS is set to boot from CD. BackTrack will run through the boot
    process. At the graphical boot menu, select the first option, which boots you
    into BackTrack using the KDE graphical desktop. The small, black terminal window
    icon on the left side of the taskbar will open up a console window.


    # Wireless Card Configuration


    Perhaps the most important requirement is a wireless card that is supported by
    Kismet (see the Kismet documentation, section 12 “Capture Sources,” located at
    http://www.kismetwireless.net/documentation.shtml for supported cards). This being
    said, if you start BackTrack and simply type kismet at the prompt, you will likely
    encounter the most common of all Kismet errors, which is the failure to configure
    a capture source (see Figure 10.4).


    ![](img/d6ac176c353d2b7687c1186a140180a1_246_0.png)


    ![](img/d6ac176c353d2b7687c1186a140180a1_246_1.png)'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Before you decide to give up (and sadly, some people do), read the error message
    for an explanation of why Kismet failed to start. In this case, no capture source
    was enabled. As you might expect, this is a fatal error. We can also deduce from
    this error that we can correct this problem by specifying a capture source either
    via the kismet.conf file or the command line.


    # kismet.conf


    To enable a capture source within the kismet.conf file, use your favorite text
    editor (in this example, we used nano) and edit /usr/local/etc/kismet.conf (see
    Figure 10.5).


    Figure 10.5 Editing kismet.conf


    ![](img/d6ac176c353d2b7687c1186a140180a1_247_0.png)


    Scroll down approximately one page to the section that begins with:


    ```

    # Sources are defined as:

    ```


    Be sure to read through the notes within the section as to what is required: the
    source type, the interface, and the name. For source type and driver, refer to
    section 12, "Capture Sources," of the Kismet documentation. The interface is defined
    by Linux,'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'and is dependent upon the particular card (in this example, we’re using an
    Atheros card, which uses the ath/wifi interface). You can also find this information
    within the particular source type listing. Finally, the name is whatever you choose;
    it is only a label.


    # ## Command Line


    To enable a capture source from the command line, start Kismet with the -c switch
    and follow it with the same syntax you used within the kismet.conf file: sourcetype,
    interface, and name:


    ```

    ```

    ht~# kismet -c madwifi, gw wifi 0, Atheros

    ```

    ```


    # ## Log File Configuration


    By default, Kismet will save its log files to the location where you started Kismet.
    For example, if you start Kismet while in /root (the default directory if you
    log on as the root user), the log files will be saved there. In a hard disk installation,
    this may be fine. However, when booting a live CD, these files are only stored
    in a temporary RAM disk and will be gone when you power off the system. In this
    case, you have two options: either copy the files to a thumb drive (or other device)
    before powering off; or better yet, start Kismet from the thumb drive so the files
    are automatically saved there. USB drives are typically mounted as sda#, so simply
    cd to /mnt/sda1 (or whatever the correct number is) and start Kismet from there.


    # ## Other Configuration Issues


    While a Global Positioning System (GPS) receiver is not required to use Kismet,
    it is required if you want location data. If you’re using Kismet to wardrive,
    it becomes a necessity. To configure Kismet to use GPS, you first need a GPS receiver
    that supports NMEA (virtually all of them do). Second, you’ll need to start GPSD
    and point it to the path of your GPS receiver. To find the correct path of your
    receiver, plug in your GPS and look at the results of dmesg (you might try /dev/ttyUSB0
    or /dev/tts/USB0 for a USB device):


    ```

    ```

    ht~# gpsd -P /dev/tts/USB0

    ```

    ```


    You won’t get any feedback, but you can type ps aux | grep gpsd to ensure that
    the process started. To confirm that GPSD is working, Telnet to localhost port
    2947 and type R=1; you should get scrolling NMEA strings with the current latitude
    and longitude.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# **TIP**


    For one reason or another, some people have had trouble running Kismet with the
    most recent version of *GPSD*. To fix some of those problems, a Kismet and Netstumbler
    forums user named Dutch, released an older, scaled down version of *GPSD*, appropriately
    titled *gspsdold*. Those who have used this version (including this author) have
    reported no problems. Dutch’s version of *gpsdold* can be found at http://www.netstumbler.org/158973-post
    1600.html. Download and install to /usr/bin, and then use in the same way you’d
    use *GPSD*.


    # ## Wardriving with Kismet


    If you’ve made it this far, congratulate yourself: you’ve downloaded BackTrack,
    burned it to a CD, booted up the live distro, and properly configured Kismet to
    work with your particular wireless card and GPS receiver. Now it’s time to go
    wardriving.


    # Tools & Traps...


    # ### Optional but Useful Items for Your Wardriving Setup


    In addition to your current setup, if your wireless card supports it, you may
    want to consider an external antenna. A simple 5 dBi omni-directional antenna
    designed for 2.4 GHz will significantly aid in the discovery of networks (an external
    antenna outside the car is eminently preferable to an internal antenna inside
    a wireless card sitting inside a metal car!). Most antennas will also require
    a pigtail, which is a short adapter cable that connects the antenna coaxial cable
    to the antenna jack on your wireless card. For special cases, you may want to
    consider a cantenna or other form of directional antenna. The folks at http://wardrivingworld.com
    and http://www.fab-corp.com are highly respected among wardrivers and will go
    out of their way to ensure you get the right equipment for your setup.


    An additional consideration, especially for longer drives, is a power inverter.
    This device (which typically costs about $25–30) will plug into your cigarette
    lighter (or other vehicle power socket) and convert the vehicle’s DC power to
    AC for your laptop.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Wardriving


    We said that it was time to begin wardriving, but there are a few important tips
    to consider before you start (see also “Notes from the Underground”):


    +   Be sure that your wardriving setup does not physically impair your ability
    to drive, or block your line of sight. This may seem like common sense, but the
    more complex your wardriving setup, the more potential exists for exotic things
    that could get in your way of seeing. Don’t let antennas, cables, or the laptop
    itself prevent you from being a responsible driver.


    +   Once you start Kismet and configure everything to run (see Figure 10.6), close
    your laptop lid. Again, this is a matter of common sense, because an open laptop
    is an invitation for distraction. Closing the lid removes the invitation to constantly
    peek at the screen. And believe me, if the screen is open, you’ll peek at it.


    ![](img/d6ac176c353d2b7687c1186a140180a1_250_0.png)


    +   Law enforcement officers will tell you that many more people talk themselves
    into tickets than the other way around. Should you be stopped by law enforcement,
    it is not necessary to fabricate some far-fetched story about'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'what you''re doing, or make false claims about the secret project you''re working
    on and how they don''t have a need to know. Wardriving is legal, so telling the
    truth is the easiest and simplest explanation.


    # Notes from the Underground...


    # RenderMan''s Stumbler Ethics


    +   1. Do Not Connect! At no time should you ever connect to any APs that are
    not your own. Disable client managers and Transmision Control Protacol (TCP)/Internet
    Protocol (IP) stacks to be sure. Simply associating can be interpreted as computer
    trespass by law enforcement.


    +   2. Obey traffic laws. It''s your community too, and the traffic laws are there
    for everyone''s safety including your own. Doing doughnuts at 3:00 A.M. gets unwanted
    attention from the authorities anyways.


    +   3. Obey private property and no-trespassing signs. Don''t trespass in order
    to scan an area. That''s what the directional antenna is for. You wouldn''t want
    people trespassing on your property would you?


    +   4. Don''t use your data for personal gain. Share the data with like-minded
    people, show it to people who can change things for the better, use it for education,
    but don''t try and make any money or status off your data. It''s just wrong to
    expect these people to reward you for pointing out their own stupidity.


    +   5. Be like the hiker moto of "take only pictures, leave only footprints."
    Detecting SSID''s and moving on is legal; anything else is irresponsible to yourself
    and your community.


    +   6. Speak intelligently to others. When telling others about wardriving and
    wireless security, don''t get sensationalistic. Horror stories and FUD are not
    very helpful to the acceptance of wardrivers. Speak factually and carefully. Point
    out problems, but also point out solutions.


    +   7. If/when speaking to media, remember you are representing the community.
    Your words reflect on the rest of us. Do not do anything illegal no matter how
    much they ask. They may get pissed off, but at least you have demonstrated the
    integrity that this hobby requires. http://www.renderlab.net/projects/wardrive/ethics.html'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'You are wardriving to detect networks. Networks exist where people exist. While
    not absolute, it seems likely that the more people in a given area, the more networks.
    Office buildings, apartment complexes, and college campuses are locations that
    are ripe for wardriving. Furthermore, the closer you can get to buildings, the
    more likely it is that you''ll detect more networks. If you can safely and legally
    drive through a parking lot to get closer to a particular building, by all means
    do so.


    Do you have a goal in mind? Driving aimlessly in your pimpled-out wardriving-mobile,
    especially given recent gas prices, can get mighty expensive. You ought to have
    a specific objective in mind when wardriving: cover a specific section of a particular
    neighborhood, or locate the APs of a particular location (perhaps as part of an
    authorized penetration test). Better yet, you might consider wardriving as a secondary
    effort of something else: while driving to work, visiting family in a different
    city, or on the way to a client''s location. The final reason you ought to be
    wardriving is that it is fun. Wardriving is a hobby. If you''re not enjoying yourself,
    you probably need to find a new hobby!


    # Tools & Traps...


    # GPS Location Data


    Users are often confused about the GPS data that Kismet provides. A common question
    is: how does Kismet geo-locate an access point? Or, Are the GPS coordinates the
    actual location of the access point? While Kismet does take a number of signal
    readings at different locations, the real answer to the question is that it doesn''t
    actually geo-locate anything; and the GPS coordinates are not the actual location
    of the AP.


    The GPS receiver marks your location when you detect an AP. So while you''re driving
    down the street and detect an AP in a house off the street, Kismet sees the AP
    as being in the street at the location where you were when you detected the AP
    (a quick look at street level maps at WGiLE.net will confirm this). When Kismet
    has more than one set of GPS coordinates, the displayed location is the set of
    coordinates where Kismet reported the strongest signal. In an ideal world, this
    would seem to provide you with a fairly accurate "abeam" location: as you detect
    an AP, the signal will be weak, and growing stronger until you pass abeam the
    AP, and then becoming weaker again until it is no longer detected. However, the
    harsh reality of obstructions and multi-path reflection will tend to skew these
    results. Still, all things considered, Kismet does a pretty darn good job.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Before you shut down your laptop, remember to save your log files to a USB
    thumb drive (or other external source) if you didn’t already run Kismet from it.
    Remember, when running a live CD, the log files are saved to a temporary RAM disk,
    which will not be saved when you power off your laptop.


    # ## Managing Your Results


    You’ve returned home from your first wardrive, and have collected hundreds (or
    perhaps even thousands) of networks. Now, what exactly are you going to do with
    this data? Hopefully, as we explained in the previous section, you had an objective
    in mind. If you were wardriving as part of a penetration test, you might want
    to parse out only those networks in the vicinity of your target location. Or,
    you might be interested in compiling statistics on the networks you collected:
    channel usage, encryption, and so forth. Either way, consider uploading your data
    to WiGLE.net.


    # ### WiGLE


    WiGLE.net (Wireless Geographic Logging Engine) is an online database that holds
    in excess of 15 million logged wireless networks, most with geographic coordinates.
    WiGLE gives you access to Service Set Identifier (SSID) and manufacturer statistics,
    octet and channel usage statistics, and a browsable Web map of the world. By creating
    an account, you can upload and track your logged networks, and be credited with
    networks that you found first.


    # ### Obtaining BackTrack


    +   - You can download directly or via torrent from http://www.remote-exploit.
    org/backtrack\_download.html.

    +   - Be sure to check the MD5 hash to ensure your download is free from tampering
    or errors.

