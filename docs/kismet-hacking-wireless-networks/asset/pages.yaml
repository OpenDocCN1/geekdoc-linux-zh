- pgno: 192
  md: '# Introduction


    This chapter hopes to show you the various ways that Kismet drones can be used
    and integrated into your network monitoring. Kismet has a neat trick in terms
    of sources. The server doesn''t need to be on the same system as the source feeding
    it. Kismet just receives packets and parses them into a human readable view; it
    doesn''t care where that data comes from. Kismet supports an installation of remote,
    dumb sensors called drones. Drones sniff data from the air and send it down to
    the server. Kismet can handle several of these and they don''t need to be powerful
    systems. This part of the book will focus on building drones and integrating them
    with Kismet server.


    # Drone Installation


    A drone is a fairly dumb device. It needs nothing more than a compatible network
    device that can support monitor mode. In addition, it needs something resembling
    a CPU that can run a very basic Linux and the drone software. Finally, it needs
    a backhaul method to get the captured data to the server.


    You can run a Kismet drone on any type of system you like, from full, modern PC
    to small embedded computers and everything in between. Kismet is built with x86
    systems in mind, but ARM, MIPS and other processors are possible to use as well.


    In this chapter we will show you both ends of the spectrum in terms of difficulty
    and cost.


    # Linksys WRT54G


    The WRT54GL is the latest version of the WRT54G family of routers that have been
    a great deal of fun for hardware hackers over the last few years. They contain
    a MIPS processor, a wireless chipset, and wired Ethernet connections, everything
    we need.


    As hackable and available as they are, WRT54G''s are limited. The main problems
    with them is that they have a small memory footprint, and a proprietary Broadcom
    chip set that limits what we can do to what the manufacturer''s driver let''s
    us do, and an open source software development cycle that isn''t always up to
    date.


    That being said, their redeeming value of being dirt cheap and well documented
    means that we can squeeze a lot of capabilities out of these units if you don''t
    want to spend money to get extra features of other hardware, or if those other
    features are not necessary.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Notes from the Underground


    # A Word About Cross Compiling


    In some cases it’s not possible to compile software on the device it’s going to
    run on. Small embedded systems often have no space for a full compiler, libraries,
    sources, and so forth, which are needed to build software. The 2 megabytes of
    memory and 200Mhz processor makes it so we can’t compile Kismet directly (natively)
    on the WRT54GL. Cross-compiling is often necessary to build the software in these
    cases. Cross-compiling is basically building software on one architecture for
    another. In the case of the WRT54GL, you can build software on your x86 desktop
    for the MIPS processor.


    Cross-compiling can be more a case of voodoo than an art. Setting up toolchains
    for other architectures is not something for the timid, or even some of the experienced
    users out there. A great deal of time and research was spent to try and document
    building your own cross-compiler to build drones for the WRT54GL, however, it
    was nearly impossible to document all the variables required. In addition, the
    ever-changing sources for OpenWRT, Kismet, and all the other software needed means
    it would require an entire book on it’s own to talk about cross-compiling. For
    the most part though, with drones, you can easily be back several revisions of
    Kismet and not break anything, since the fields coming across the wire have not
    changed across versions.


    It is highly recommended that if you are using Kismet on architectures other than
    x86, let the developers of whatever Linux distribution you will be using on the
    device cross-compile it and package it for you. It will save you from dealing
    with the same headaches and stress the authors went through.


    The OpenWRT Buildroot system is an exception. If everything lines up, the build
    root takes care of setting up the toolchains necessary, and all the source files
    for building your own firmware and packages.


    In short, if you can compile on the system you are going to be running a Kismet
    drone on, it’s best that you do. If you can’t, the developers for your target
    platform may have a packaged solution that’s easier to set up than manually trying
    to build your own cross-compiler.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "# # Installation\n\nInstallation and configuration of a Kismet drone on a WRT\
    \ seems to be a lot of steps, but it’s very easy once you get through your first\
    \ one. These instructions are adapted from instructions available online from\
    \ the authors, which have proven very reliable.\n\n> **NOTE**\n> \n> A whole book\
    \ could be written about the linksys WRT54GL and its many versions. In fact, there\
    \ is one from Syngress, “Linksys WRT54G Ultimate Hacking” by Paul Asadoorian and\
    \ Larry Pesce. A great read if you want to know more about the hardware underlying\
    \ these systems.\n\nThe first step should be to get your hands on a compatible\
    \ WRT54. The best bet is the WRT54GL. The L designates that this version runs\
    \ Linux and is compatible for our needs. The OpenWRT wiki has a huge amount of\
    \ information on specific models and compatibility and should be your first stop.\n\
    \n> **NOTE**\n> \n> Early WRT versions all ran Linux. When linksys released version\
    \ 5 of the ubiquitous router, they changed from a Linux-based firmware to a vvxworks\
    \ proprietary firmware and also changed the amount of memory and a few other specifications.\
    \ The backlash was significant enough that linksys released the wrt54gl models\
    \ with the original amount of memory and running Linux in order to keep feeding\
    \ the tinkerer market. (See http://wiki.openwrt.org/OpenWrtDocs/Hardware.)\n>\
    \ \n> OpenWRT has two versions available: Whiterussian and Kamikaze. Whiterussian\
    \ is the older, stable version, while Kamikaze is the new development version.\
    \ In the first part of the chapter, we will use Whiterussian as an example even\
    \ though it is no longer being developed. The second part will be about Kamikaze.\
    \ The reason Whiterussian is included is first, because it’s stable. Kamikaze\
    \ is a moving target and tricky to write about, because they haven’t sorted out\
    \ all the issues that may affect a drone. In the process of writing, several bugs\
    \ and problems were found and corrected in the development version, so Kamikaze\
    \ will work but needs the additional step of building your own OpenWRT package\
    \ with a cross- compiler."
  merge: -1
  img_proc: true
- pgno: 195
  md: 'First, we need to get the router set up so we can talk to it. This usually
    starts with plugging it into your network or to your computer through a crossover
    cable. A crossover cable is best since you probably don''t want to introduce a
    new Dynamic Host Configuration Protoco (DHC P) server onto your network until
    you have a chance to turn that off.


    Configure the router''s address, Domain Name System (DNS), and gateway, so that
    the router can talk to the rest of the world and we can load packages later. This
    can be done after OpenWRT is loaded, but we will use the GUI Linksys here to make
    life easier.


    # # Whiterrussian


    Download the “OpenWRT Whiterrussian” release from http://downloads.openwrt.org/whiterrussian/newest/default/.
    OpenWRT uses the jffs or the squashfs file system. Both are writable, so added
    files and changes are retained through power cycles, meaning that your drone files
    are not erased on reboot. You can also store scripts for running all the commands,
    to start up the drone on the router or just have it start up the drone on boot.
    The squashfs system makes it easier to keep from messing up the system, since
    the base files are read-only. So unless you have a pressing need for the jffs
    file system, you probably want to get the squashfs image from the download site.


    Select the right firmware for your router type according to the Whiterrussian
    README on the openwrt site (http://downloads.openwrt.org/whiterrussian/newest/00-README)
    If you select the wrong one, you might turn your router into a useless electronic
    brick, so make sure to get the right one.


    Connect to the Web control panel on the router (presuming you have not removed
    the Linksys firmware yet or are using another with a Web utility). Using the Upgrade
    firmware button under Administration | Upgrade Firmware, violate your warranty
    by loading the .bin file you downloaded from the openwrt.org Web site.


    > It is advisable to set the BOOT_WAIT parameter on your router before you flash.
    In case you turn your router into a brick, this gives you a few seconds to try
    and upload a fresh firmware on powerup. If not, it gets ugly. The OpenWRT Users
    guide has instructions for doing this on the default'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'Linksys firmware, or you can make sure it’s the first thing you do after you
    load a firmware that has the `BOOT_WAIT` parameter as an option on the Web control
    panel or command line. At any rate, make sure you turn this on; it will save you
    many headaches!


    It’s recommended that you use Trivial File Transfer Protocol (TFTP) to load firmware
    once you have loaded your first instance of openwrt. This is so you can be sure
    you can do it should your router become a brick. If you have access to a *nix
    system on the same network as the router, run the following:


    ```

    tftp <ip of the router>

    tftp> binary

    tftp> rexmt 1

    tftp> t r a c e t f t p> put openwrt-wrt54g-squashfs.bin

    ```


    Then power cycle the router while the TFTP program tries to send the firmware.
    The TFTP program should upload the new firmware, provided the BOOT_WAIT parameter
    was set and your timing was right on the power cycle.


    Once you have loaded the openwrt firmware and left it for a few minutes to boot
    and sort itself out, Telnet to 192.168.1.1 (or whatever Internet Protocol (IP)
    you manually set it to) and you should get a prompt and the banner for the OpenWRT
    firmware. Once you’ve connected via Telnet, you should immediately set up a root
    password and Secure Shell (SSH). This is easily accomplished with:


    ```

    passwd root

    ```


    Alternatively, you can connect to the Whiterussian Web interface on the router,
    by popping the IP of the newly flashed router into a Web browser and clicking
    on any of the links to change settings. The Web interface will ask you to set
    a root password before you can change any settings. If you need to adjust anything,
    here is the time and place to do so.


    Provided the router has all the settings for talking to the outside world set
    (from the earlier steps), you should just be able to run ipkg from the command
    line via SSH:


    ```

    ipkg update

    ipkg list

    ```'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'If the router complains about not finding hosts, double check your set up DNS
    and gateway. You may need to set a default gateway with the Web interface or from
    the command line using:


    ```

    route add default gw <IP Address>

    ```


    and your name server with:


    ```

    echo "nameserver XX.XX.XX.XX ">/etc/resolv.conf

    ```


    where XX is the IP of your DNS server.


    # **NOTE**


    Because Kismet drones are just shuttling data to the server, they do not need
    to be the same release version to work. You''ll probably find the Kismet drone
    package listed in *ipkg* is from 2006. This is not an issue, as the drone changes
    very little with each release, and as long as the version you use supports the
    wireless device you are trying to use, it''s not a problem.


    You can download and install the *kismet-drone* package through *ipkg* with:


    ```

    ipkg install kismet-drone

    ```


    This will download and install the kismet-drone binaries to /usr/bin on the router
    and the config files to /etc/kismet.


    If you run the Kismet binary now, it will fail in two ways. The *kismet_drone.conf*
    file is using the wrong device and it cannot find the *wl* command (Broadcom Binary
    Driver for the Wireless chipset) to enter monitor mode. The *wl* command is easy
    to install with *ipkg*. Just type:


    ```

    ipkg update

    ipkg install wl

    ```


    Now we need to edit some files to get the Kismet drone to use the correct interface.
    The WRT54G line has several models and the wireless interface changed slightly
    across revisions. We need to edit the /etc/kismet/kismet_drone.conf file *source=*
    line, depending on what model we are using.


    If you are using a v1.0 or v1.1 router:


    ```

    source=wrt54g,eth2,wrt54g

    ```'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'If your using a v2.0, make sure it''s `eth1`.

    `source=wrt54g,eth1,wrt54g`


    If you are using a v3.0 router, change it to:

    `source=wrt54g,eth1,priism0,wrt54g`


    Most users using a v4.0 router, however, WRT54GL or others will use `priism0`

    `source=wrt54g,priism0,wrt54g`


    If you run into problems with the drone not caputuring data or not starting due
    to incorrect interfaces, try another interface name. Revisions to the driver and
    OpenWRT mean that it''s possible for things to change between hardware revisions.


    You also need to change your `allowedhosts` line in the `kismet_drone.conf` file
    to something like:

    `allowedhosts=127.0.0.1,192.168.0.0/24`


    By default, the drone only allows connections from the local system. You will
    need to add your network segment that you will connect your server from to the
    list with no spaces. It can be a single IP address, or a whole network using decimal
    notation and no spaces. If you don''t change this, it is still possible to connect
    to the server, however, no data will come through.


    At this point we should set up our server to talk to the drone.


    # # Server Configuration


    Set up the `Kismet.conf` file on your laptop/workstation to use `source=kismet_drone,<IP
    Address>:3501,drone`. You can run other sources at the same time (e.g., wi-fi
    cards, other drones) on separate `source=` lines.


    The source line breaks down like this:


    +   - **Kismet_drone** indicates this is a remote drone source, as opposed to
    a local card source.

    +   - **<IP Address>:3501** is the Transmisionn Control Protocal (TCP)/IP address
    and port that the drone is running on. You can change the IP address to whatever
    you set your router to. You shouldn''t need to change the port.

    +   - **drone** is just an arbitray description that is shown in the bottom right
    corner of the Kismet window in the sources list. You can change this to whatever
    you want for organizational purposes, be it where the drone is or perhapse what
    channels it''s monitoring.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'To run the drone manually, just SSH into the router in another window or terminal
    and run the following commands:


    +   - **wl ap 0** Put the router in Cilent mode, just to be sure. We don''t want
    anyone associating while we drive by.


    +   - **wl disassoc** To make sure it''s not associated with anything that could
    screw up our detection.


    +   - **wl passive 1** This throws the router scan engine into passive mode, and
    prevents any transmussions.


    +   - **wl promisc 1** Why not put it in promisc mode too?


    Run the drone, specifying where the config file is:


    ```

    `/usr/bin/../kismet_drone -f /etc/kismet/kismet_drone.conf`

    ```


    You should then see something like :


    ```

    ```

    Suid priv-dropping disabled. This may not be secure.

    No specific sources given to be enabled, all will be enabled.

    Enabling channel hopping.

    Disabling channel splitting.

    Source 0 (wrt54g): Enabling monitor mode for wrt54g source interface eth2

    channel 6...

    Source 0 (wrt54g): Opening wrt54g source interface eth2...

    Kismet Drone 2006-04-R1 (Kismet)

    Listening on port 3501 (protocol 8).

    Allowing connections from 192.168.0.0/255.255.0.0

    ```

    ```


    If not, double check your steps.


    The last line is the most important. It means that the drone will now accept connections
    from servers on the 192.168.0.0/24 network, where our server is hopefully set
    up.


    You should then be able to fire up Kismet on your workstation and if everything
    lines up, you''ll see “accepted streamer connection from” in the router SSH session,
    and Kismet will show a drone with channel “--” in the bottom right corner as a
    source (This doesn''t mean it''s not scanning channels, it''s just a limitation
    of the server to know which channel the drone is on). If it''s also your only
    source and you detect networks, you''ll know it is working.


    Kismet cannot control the channel of the WRT54G; this is a known limitation with
    the Kismet drone and server. If you want to monitor just one channel, you''ll
    want to'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'disable channel hopping in the `kismet_drone.conf` file by changing the `channelhop=`
    line to false (purely for organizational purposes, since it doesn’t work anyways):


    ```

    ```

    channelhop=false

    ```

    ```


    Then set which channel you want to monitor in the Web interface, or through the
    command line with:


    ```

    ```

    nvram set channel X

    nvram commit

    ```

    ```


    where X is the channel you want to monitor. This will set the WRT54G to a single
    channel that will remain persistent through reboots.


    In a lot of cases, you’ll want to monitor more than one channel. You can either
    set up one drone per channel (that’s a lot of drones) or have them hop channels.
    As noted before, Kismet cannot control the channels on the WRT54G hardware, however
    the `wl` utility can.


    Joshua Wright of willhackforsushi.com came up with a channel hopping script that
    allows for fine control of what channels are monitored.


    Using the command line, enter the following in a file called `/etc/init.d/S70Wl_scan`:


    ```

    ```

    #!/bin/sh

    while : ; do

    wl channel 1 ; sleep 1

    wl channel 6 ; sleep 1

    wl channel 11 ; sleep 1

    wl channel 2 ; sleep 1

    wl channel 7 ; sleep 1

    wl channel 3 ; sleep 1

    wl channel 8 ; sleep 1

    wl channel 4 ; sleep 1

    wl channel 9 ; sleep 1

    wl channel 5 ; sleep 1

    wl channel 10 ; sleep 1

    done

    ```

    ```


    Now make it executable with:


    ```

    ```

    chmod 777 /etc/init.d/S70Wl_scan

    ```

    ```


    This will start the channel hopping on startup of the router.


    Once you have it there, you can tweak it to your hearts content. Add more sleep
    to spend longer on a channel, change the order, or copy more lines in to check
    certain'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'channels more often. (See the Kismet server.conf chapter for more information
    on tweaking your channel hopping for maximum performance.)


    You probably don''t want to SSH into the router every time you want to start the
    drone. You probably want it as an appliance that starts the drone automatically.


    To do this, use your favorite text editor to create the file `/etc/init.d/S60kismet_drone`
    on the router with the following in it:


    ```

    #! /bin/sh

    echo "Setting radio for kismet_drone"

    mkdir /var/log


    /sbin/ifconfig eth1 up

    /usr/sbin/wl ap 0

    /usr/sbin/wl disassoc

    /usr/sbin/wl passive 1

    /usr/sbin/wl promisc 1

    /usr/sbin/wl monitor 1

    echo "Running kismet_drone"

    /usr/bin/. /kismet_drone -f /etc/kismet/kismet_drone.conf > /dev/null 2>&1 &

    sleep 3

    echo "kismet_drone now running"

    ```


    # Now just make it executable with:


    ```

    chmod 777 /etc/init.d/S60kismet_drone

    ```


    This will start the drone on startup first, followed by the channel hopping script
    if you chose to use it.


    If everything is working fine, you should see data coming in when you start your
    server and hopefully across all channels. If you don''t see anything, check the
    following:


    # Troubleshooting


    If the server is failing to start:


    +   - Is the source line for your drone correct and do you have source entries
    for all sources present?

    +   - Can you ping the drone''s IP address? Is the Kismet drone shown as running
    using the ps command?'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'If the server starts, but no data is coming in:


    +   - Is your server’s network on the allowed hosts line in the `kismet_drone.conf`?
    Is the `source=` line in the `kismet_drone.conf` correct? Is the channel-hopping
    script listed as running using the `ps` command?


    # Kamikaze


    Kamikaze is the latest version of OpenWRT and is still in development. This means
    that things that work today, may change and not work tomorrow. This is why if
    you are building drones for a production environment, you probably want to use
    Whiterussian, since it’s stable and unlikely to change.


    Just like Whiterussian, obtain a compatible WRT54G unit and configure it to connect
    to the Internet.


    +   - Select the appropriate firmware from the openwrt Web site for your hardware.
    Check the release notes for the latest version, to select the right one for your
    unit (http://downloads.openwrt.org/kamikaze/release.txt).


    +   - If you are starting from a fresh router with the default firmware on it,
    installing openwrt Kamikaze, connect to the Web control panel on the router. Using
    the Upgrade firmware button under Administration | Upgrade Firmware, violate your
    warranty by loading the `.bin` file.


    It’s recommended that you use TFTP to load firmware once you have loaded your
    first instance of openwrt. This is so you can be sure you can do it should your
    router become a brick. If you have access to a *nix system on the same network
    as the router, run the following:


    ```

    ```

    tftp <ip of the router>

    tftp> binary

    tftp> rexmt 1

    tftp> trace

    tftp> put openwrt-wrt54g-squashfs.bin

    ```

    ```


    Once you have loaded the openwrt firmware and left it for a few minutes to boot
    and sort itself out, Telnet to 192.168.1.1 (or whatever IP you manually set it
    to) and you should get a prompt and the banner for the OpenWRT firmware. If you
    don’t, try a crossover cable between your station and the router. If that still
    doesn’t work, set up your workstation as 192.168.1.2 and try again. If none of
    those work, try resetting the router, which should hopefully put it back to 192.168.1.1
    and you can try again.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Once you''ve connected via Telnet, you should immediately set up a root password
    and SSH. This is easily accomplished with:


    ```

    passwd root

    ```


    Configuring the router is a bit different than on Whiterussian. The system no
    longer uses nvram, but instead uses configuration files to set up all the parameters.


    There are a lot of options available for configuring your router, and they are
    outside of the scope of this book, however there are a few specific ones worth
    mentioning.


    /etc/config contains most of the base system configuration files. Before we can
    load Kismet, we need to make a few changes.


    To set up the router to talk to the Internet to get some necessary files, edit
    the /etc/config/network file.


    The config files are well documented on the openwrt wiki: http://wiki.openwrt.org/OpenWrtDocs/KamikazeConfiguration
    contains all the options, but the few you will probably want to edit are under
    the “config interface lan” section:


    ```

    option ipaddr 192.168.0.75

    ```


    The IP address of the router, if you wanted to change it for some reason:


    ```

    option netmask 255.255.255.0

    ```


    If you need to change the netmask, here is the place to do it:


    ```

    option gateway 192.168.0.1

    ```


    Set your default gateway so that the router can talk to the rest of the Internet:


    ```

    option dns 64.59.184.13

    ```


    You should also set up the router with a DNS server so it can resolve the openwrt.org
    domain to get software.


    For example, here is my working LAN config:


    ```

    ### LAN configuration


    config interface lan

    option type bridge

    option ifname "eth0.0"

    option proto static

    option ipaddr 192.168.0.75

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: "```\n```\noption netmask   255.255.255.0\noption gateway   192.168.0.1\noption\
    \ dns       64.59.184.13\n```\n```\n\nAfter a reboot, you should be able to SSH\
    \ into the router and ping outside addresses and resolve domains. To install Kismet,\
    \ it gets a little weirder than Whiterussian.\n\n> **NOTE**\n> \n> At the time\
    \ of writing, the Kismet binaries available through the ipkg repository are almost\
    \ 18 months old and don't work properly on the broadcom chips in WRT54GL. By printing\
    \ time, a new version will hopefully be available through ipkg, and things will\
    \ be easy as ipkg installs kismet-drone. If not, there is always building it yourself,\
    \ which will be covered further.\n\nThe easiest way to install the Kismet-drone\
    \ is through ipkg:\n\n```\n```\nipkg update\nipkg install kismet-drone\n```\n\
    ```\n\nAny version after 2007-10-R1 should work fine. If that is not available\
    \ or not working, it is possible to build your own, as you will see later in this\
    \ chapter.\n\nOnce you have the binaries installed, you need to make some adjustments\
    \ to the config file for it to work properly.\n\nEdit the */etc/kismet/kismet_drone.conf*\
    \ file. You can edit it to your liking, but the *source=* and *allowedhosts=*\
    \ parameters are the most important.\n\nFor the *source=* line on a *wrt54g*,\
    \ specify:\n\n```\n```\nsource=wrt54g,wl0,foo\n```\n```\n\n*wrt54g* is the source\
    \ type, *wl0* is the interface name, and *foo* is the designation that shows up\
    \ in the Kismet client in the lower right corner.\n\nIf you want to connect to\
    \ the drone from a remote server, you need to add the server's IP address or network\
    \ to the *allowedhosts* parameter.\n\n```\n```\nallowedhosts=127.0.0.1,192.168.0.0/24\n\
    ```\n```\n\nWhere you specify the IP or the server or the network should be comma\
    \ separated with no spaces. To make sure everything is working, launch the drone\
    \ from the command line:\n\n```\n```\nkismet_drone -f /etc/kismet/kismet_drone.conf\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 205
  md: "Just like with Whiterussian, you probably want to run the drone as an appliance\
    \ running on startup of the WRT54G. The scripting is very different than Whiterussian.\
    \ Kamihaze uses a custom startup scripting system that is fairly easy to use.\
    \ It really boils down to inserting the commands you want to into one script template,\
    \ then that template is used to automatically generate other scripts that are\
    \ needed. All the startup scripts that you need to edit exist in `/etc/init.d`.\
    \ Create a file named Kismet in that directory. Insert the following example script\
    \ framework:\n\n```\n#!/bin/sh /etc/rc.common\n# Example script\n# Copyright (C)\
    \ 2007 OpenWrt.org\n\nSTART=65\nSTOP=70\n\nboot() {\n    echo boot\n    # commands\
    \ to run at boot\n    # continue with the start() section\n    start\n}\n\nstart()\
    \ {\n    echo start\n    # commands to launch application\n}\n\nstop() {\n   \
    \ echo stop\n    # commands to kill application\n}\n```\n\nAs you can see in the\
    \ example script, there are three main sections: *boot*, *start* and *stop*. Each\
    \ section contains the command needed to start, stop, or do whatever for the program\
    \ we want to control.\n\n```\nSTART=65\nSTOP=70\n```\n\nThe start and stop lines\
    \ contain numbers, which control in what order the scripts generated from here\
    \ start or stop. The higher the number, the later it starts. If you"
  merge: -1
  img_proc: true
- pgno: 206
  md: "have one program that needs to start before another (i.e. gpsd starting before\
    \ Kismet), make sure that the first program has a smaller number than the other.\n\
    \n```\nboot() {\n    echo boot\n    # commands to run at boot\n    #continue with\
    \ the start() section\n    start\n}\n```\n\nThe boot section runs commands inside\
    \ it on startup. These commands are run on startup and then the start section\
    \ runs. This is a good place to put preparation commands if you need them.\n\n\
    ```\nstart() {\n    echo start\n    # commands to launch application\n}\n```\n\
    \nThe start section is for commands to be run to start the program, but not necessarily\
    \ on boot. If the boot section does not call the start section, these commands\
    \ can be run by manually running the script with the *start* command (i.e. scriptname\
    \ start)\n\n```\nstop() {\n    echo stop\n    # commands to kill application\n\
    }\n```\n\nThe stop section runs commands to end a program. This section is called\
    \ when the system shuts down. When you have all the commands in the script, make\
    \ the script executable with:\n\n```\nchmod 777 <scriptname>\n```\n\nthen run\
    \ the script with the *enable* parameter:\n\n```\n./<scriptname> enable\n```\n\
    \nThis will link the script properly into the rc.d startup folder and take care\
    \ of things for you.\n\nA lot more information is available from the OpenWRT site:\n\
    \nhttp://downloads.openwrt.org/kamikaze/docs/openwrt.html-x1-270001.3.2"
  merge: -1
  img_proc: true
- pgno: 207
  md: "For your drone appliance, the following script will prep the WRT54G and run\
    \ the drone on startup:\n\n```\n```\n#!/bin/sh /etc/rc.common\n# Example script\n\
    # Copyright (C) 2007 OpenWrt.org\n\nSTART=65\nSTOP=70\n\nboot() {\n  echo boot\n\
    \  # commands to run at boot\n  # continue with the start() section\n  start\n\
    }\n\nstart() {\n  echo start\n  # commands to launch application\n  wl ap 0\n\
    \  wl disassoc\n  wl promisc 1\n  sleep 3\n  kismet_drone -f /etc/kismet/kismet_drone.conf\n\
    }\n```\n```\n\nThe boot section simply calls the start section, which covers the\
    \ preparation of the router and launching the drone. Here's what it does:\n\n\
    ```\n```\nwl ap 0\n```\n```\n\nPut the router in client mode, otherwise you will\
    \ see beacons from the router in your data.\n\n```\n```\nwl disassoc\n```\n```\n\
    \nIf the router is changed to client mode, it may associate with a nearby access\
    \ point, which would be bad for scanning as well as for legal reasons.\n\n```\n\
    ```\nwl promisc 1\n```\n```\n\nThis puts the router in promiscuous mode, mostly\
    \ for the sake of making sure we can get all the data we want."
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Note


    In the Whiterussian setup, the script uses the “wl passive 1” command. This is
    supposed to prevent the router from transmitting anything, however this command
    doesn''t play nice with Kamikaze. It has a nasty habit of changing the wl0 interface
    from wireless to a wired interface (as far as the system is concerned), and causes
    Kismet to fail to start since it''s not seeing the interface as wireless. It''s
    not a problem for it not to be there in this script. It''s a problem if it is
    there, so don''t get confused between OpenWRT versions.


    ```

    sleep 3

    ```


    To make sure the *wl* commands have completed, wait for 3 seconds before moving
    along to the next command.


    ```

    kismet_drone -f /etc/kismet/kismet_drone.conf

    ```


    Run the drone command with the *-f* parameter to specify the config file. To enable
    the script for startup, run the Kismet script with the enable option:


    ```

    /kismet enable

    ```


    The stop section is not needed since there is no way to gracefully shutdown the
    WRT54G. When you pull the plug, the program and everything else stops.


    # Server Configuration


    Setup the *Kismet.conf* file on your laptop/workstation to use *source=kismet_drone,<IP
    Address>::3501,drone*. You can run other sources at the same time (e.g., wi-fi
    cards, other drones) on separate *source* lines.


    The source line breaks down like this:


    +   **kismet_drone** indicates this is a remote drone source, as opposed to a
    local card source.


    +   **<IP Address>::3501** is the TCP/IP address and port that the drone is running
    on. You can change the IP address to whatever you set your router to. You shouldn''t
    need to change the port.


    +   **drone** is just an arbitrary description that is shown in the bottom right
    corner of the Kismet window in the sources list. You can change this to whatever
    you want for organizational purposes, be it where the drone is or perhaps what
    channels it''s monitoring.'
  merge: -1
  img_proc: true
- pgno: 209
  md: "# ## Cross Compiling with OpenWRT-Buildroot\n\nOpenWRT development has a very\
    \ cool tool called a buildroot, which is basically a suite of all the compilers\
    \ and tools you need to build OpenWRT and it's packages. It really takes the sweat\
    \ out of compiling software for OpenWRT, and we can use it to build a bleeding\
    \ edge version of Kismet for Kamikaze.\n\nBuilding your own packages is not the\
    \ easiest way. Keep in mind that this can introduce unknown and unanticipated\
    \ problems. Your mileage may vary.\n\n> **NOTE**\n> \n> This section is meant\
    \ as a guide only. Both Kismet and OpenWRT are constantly developing, and it's\
    \ best to use existing, proven releases to build drone devices. If you have a\
    \ need to experiment or update outside of normal releases, here's how you can\
    \ do so.\n\n# ## Buildroot Installation\n\nFirst, you’ll need to obtain the buildroot.\
    \ This is easily done through the subversion system on the openwrt Web site. Goto\
    \ https://dev.openwrt.org/ and you should see the available options for the buildroots.\
    \ There should be a current release version and a development version. The development\
    \ version is bleeding edge and likely to cause problems. If you have loaded a\
    \ release version, it’s best to use the release version.\n\nYou’ll also want to\
    \ make sure you have enough free space. The buildroot can grow to several gigabytes\
    \ (the author’s testing grew to over 4.5 GB’s).\n\nTo obtain a buildroot, use\
    \ the $ svn $ commands listed on the openwrt development site (this is for the\
    \ stable buildroot):\n\n```\n```\nsvn cohttps://svn.openwrt.org/openwrt/tags/kamikaze_7.09\
    \ openwrt_buildroot\n```\n```\n\nThis takes a while, but will download all the\
    \ software needed to build OpenWRT and it’s package software. Kismet is in the\
    \ extended set of packages, and must be added manually by running the following\
    \ from the command line:\n\n```\n```\nmake package/symlinks\n```\n```\n\nThis\
    \ will install the extra package sources to the buildroot, including the out-of-date\
    \ Kismet. Once it’s downloaded, you can run “make menuconfig” to start up the"
  merge: -1
  img_proc: true
- pgno: 210
  md: 'configuration. There are a huge amount of options here to configure, way more
    than we need to worry about. All that matters is the target system. This is where
    you can specify the architecture you are building for. The target system setting
    for the WRT54GL is “Broadcom BCM947xx/953xx,” and the most stable is the 2.4 kernel.
    For the purposes of this section, we are not going to change anything else except
    to build Kismet through the buildroot.


    The existing Kismet in the buildroot can be enabled in the menuconfig under network
    \ | wireless. Select the Kismet modules you want to build (you can build the server,
    client, and drone) and make sure they are selected as modules (it should say *<M>*
    beside the name). This builds them as packages rather than into the base openwrt
    image.


    Go back to the main screen and exit, then save the config and you are returned
    to the command line. If you type “make” at this point, you will download the sources
    for everything selected, build the base system, base libraries, and any libraries
    needed by Kismet, as well as the Kismet binaries. Now, if you want to upgrade
    the version of Kismet that the buildroot builds, you need to edit the Makefile
    the buildroot uses, and change where it gets its sources from and adjust a few
    build options.


    Within the buildroot, the packages are built according to a Makefile that contains
    the location of the source code, the build options, and a list of dependencies.
    We need to edit this file to use the newer source, as well as make some adjustments
    to version numbers.


    The Kismet package Makefile is located in the buildroot directory under *packages/feeds/packages/kismet*.
    The existing Makefile should look something like this:


    ```

    #

    # Copyright (C) 2006 OpenWrt.org

    #

    # This is free software, licensed under the GNU General Public License v2.

    # See /LICENSE for more information.

    #

    # $Id$

    include $(TOPDIR)/rules.mk

    PKG_NAME:=kismet

    PKG_VERSION:=2007-10-R1

    PKG_RELEASE:=1

    PKG_SOURCE:=$(PKG_NAME)-$(PKG_VERSION).tar.gz

    PKG_SOURCE_URL:=http://www.kismetwireless.net/code

    PKG_MD5SUM:=2100c667e9cb0d0ce3fa2d0c851e2

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: "```\n```\nPKG_BUILD_DEPENDS:=libnotimpl libpcap libncurses uclibcxx\n\ninclude\
    \ $(INCLUDE_DIR)/package.mk\n\ndefine Package/kismet/Default\n  SECTION:=net\n\
    \  CATEGORY:=Network\n  TITLE:=Kismet\n  DEPENDS:= +uclibcxx\n  URL:=http://www.kismetwireless.net/\n\
    \  SUBMENU:=Wireless\nendef\n\ndefine Package/kismet/Default/description\n  An\
    \ 802.11 layer2 wireless network detector, sniffer, and intrusion\n  detection\
    \ system.\nendef\n\ndefine Package/kismet-client\n$(call Package/kismet/Default)\n\
    \  TITLE+= client\n  DEPENDS+= +libncurses\nendef\n\ndefine Package/kismet-client/conffiles\n\
    /etc/kismet/ap_manuf\n/etc/kismet/client_manuf\n/etc/kismet/kismet.conf\n/etc/kismet/kismet_ui.conf\n\
    endef\n\ndefine Package/kismet-client/description\n$(call Package/kismet/Default/description)\n\
    \  This package contains the kismet text interface client.\nendef\n\ndefine Package/kismet-drone\n\
    $(call Package/kismet/Default)\n  DEPENDS+= +libpcap\n  TITLE+= drone\nendef\n\
    \ndefine Package/kismet-drone/conffiles\n/etc/kismet/kismet_drone.conf\nendef\n\
    ```\n```"
  merge: -1
