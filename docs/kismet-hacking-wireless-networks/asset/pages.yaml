    ```

    ./configure

    ```


    Note the “./” in front of the command. If you’re new to Linux, make sure you type
    the period and the forward slash in front of this command. It has to be there
    due to the way the command functions and where it is located in the Linux directory
    paths.


    At this point, you should watch the output scrolling by on the screen. You don’t
