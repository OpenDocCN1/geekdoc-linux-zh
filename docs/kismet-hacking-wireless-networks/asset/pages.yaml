- pgno: 122
  md: '# Introduction


    The Kismet server is controlled primarily from one big scary configuration file.
    Usually located in `/usr/local/etc`, the `kismet.conf` file is where you’ll spend
    most of your configuration time. Anyone who’s spent any time working on config
    files will find themselves pretty comfortable. It is an untapped resource for
    both the Kismet beginner and even for experts who have been using Kismet for a
    while. Not many people go through and check out the extent of the configuration
    options available to them. There’s a great amount of information that can be tracked
    and recorded by Kismet, as well as filtering and targeting of certain information.
    Understanding what options are available will help you use Kismet in the best
    possible way for your needs.


    # The Kismet Config File


    The config file is not as scary as it may seem. It is very large, however, because
    Dragorn was kind enough to leave a lot of very verbose comments about the various
    options. Some areas are fairly self-explanatory while others are not. This section
    will go through, almost line-by-line and examine and explain each of them. The
    comments are good, however some areas are open to tweaks not specified in the
    comments, and a lot of power can be revealed once you start digging into the config
    file.


    # Kismet Parameters


    The `kismet.conf` config file can be edited directly with your favorite UNIX text
    editor (such as vi, pico, emacs), just be aware of word wrapping and UNIX file
    format. The config file is parsed at runtime by the server and expects a UNIX
    text file. DOS and UNIX use different control characters for their text files
    and as such, using a DOS or windows editor on a UNIX text file will probably change
    it and make the file unreadable to the server. In general, if you are editing
    the `kismet.conf` file, use a UNIX editor. This can be either a native Linux application,
    or an editor through Cygwin if you are running under windows or some other UNIX
    text format-capable editor.


    Comments in the `kismet.conf` file are lines starting with a “#” symbol. These
    are often comments or example configurations and can usually guide you to what
    options you need to set. Lines that do not start with a comment are the actual
    parameter variables acted upon by the server. It’s a good idea to comment out
    the existing line by putting a “#” in front of the line and adding a new line
    with'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'the adjusted parameter. This way if something goes wrong, you know what the
    original parameter was.


    # ### Kismet.conf


    ```

    # Kismet config file

    # Most of the "static" configs have been moved to here -- the command line

    # config was getting way too crowded and cryptic. We want functionality,

    # not continually reading --help!

    ```


    The Kismet server used to be controlled through command-line parameters (many
    of which still can be used), but as the program and functionality grew, it became
    a huge effort to set all the command-line arguments for sources, ports, and so
    forth. So everything was moved into the `kismet.conf` file. The above lines are
    the beginning of the `kismet.conf` file, and is a throwback to those early days
    when people spent forever looking at the `--help` command line switches.


    ```

    # Version of Kismet config

    version=2007.09.R1

    ```


    This line indicates the version of the config file itself, not the version of
    the server or any other portion of the program. A lot of people confuse this line
    with the server version and wonder why their server is three versions back. The
    config file doesn''t change as often as the rest of the tool suite, so it has
    a separate version number listed on this line.


    ```

    # Name of server (Purely for organizational purposes)

    servername=Kismet

    ```


    This parameter is one of those often-overlooked sections of the config, and it''s
    right at the top. The `servername` parameter allows you to name the server for
    your own organizational purposes. This is particularly useful if you are monitoring
    several remote servers with one client instance. You could have servers named
    after location (`server_north_east`, `server_north_west_warehouse`) or channel
    (`server_ch1`, `server_ch2`) or however you want to keep things sane. The server
    name must not contain any spaces, so use underscores or dashes in place of spaces.
    This allows you to know which server you''re connected to and its location for
    either troubleshooting purposes or for incident tracking. It has no real affect
    on performance; it''s just useful for keeping you sane, particularly in large
    installations.


    ```

    # User to setid to (should be your normal user)

    uiduser=your_user_here

    ```'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'This line is often a misunderstood by people just beginning with Kismet. This
    is the user that Kismet will run it’s processes as once it’s started. Kismet requires
    root access to set monitor mode and other options, then it drops privileges on
    the Kismet processes to the user specified in this parameter.


    ```

    ``` sqliduser=foo ```

    ```


    The above is an example, where “foo” is a normal user account on the system.


    # NOTE


    As noted in the chapter on basic Kismet install, unless you build Kismet Set User
    ID (SUID) root, you need to have a normal non-privileged user on the system. This
    is for security reasons. The user specified here also has to have write permission
    on the directory where you are storing your captured data and logs. A major problem
    people trip on is that they run Kismet as root and specify root as the SETUID
    user. Unless you built it SETUID root, this will halt Kismet from starting. They
    also make the mistake of logging in as root, running Kismet from /root and the
    server fails to start as the SETUID user does not have write permission on the
    /root directory. The simple solution is to login as a normal user and either su
    to root or use sudo to start Kismet.


    Specify the username of a non-privileged (non-root) user on the system and make
    sure that wherever you store the data it has write permission. The logical place
    for this is the non-privileged users home directory. The best order to run Kismet
    to avoid problems is to login as a normal user, change to the directory you want
    the resulting data saved to, then “su” to root and then run Kismet.


    ```

    # Do we try to put networkmanager to sleep? If you use NM, this is probably #
    what you want to do, so that it will leave the interfaces alone while # Kismet
    is using them. This requires DBus support! networkmanagersleep=true

    ```


    This line in the config file tells Kismet to use Dbus to disable Network Manager,
    the common gnome desktop manager applet, to disable itself for the duration of
    the Kismet session. After Kismet exits, the network manager will resume control.'
  merge: -1
  img_proc: true
- pgno: 125
  md: "NOTE\n\n> Many modern Linux distributions use fancy X widgets to control the\
    \ network cards. It’s an attempt at making the system user friendly and avoiding\
    \ users to have to go to the command line to connect to a wireless network. The\
    \ problem is, if we want to do anything weird with the card, such as monitor mode,\
    \ these network monitor programs fight for control of the card and can cause no\
    \ end of grief for Kismet.\n> \n> If you have any weird scanning situations such\
    \ as things randomly stopping scanning or getting stuck on one channel and not\
    \ hopping, this is a likely candidate. For the most part, you’ll want this option\
    \ enabled.\n> \n> In some situations, this may cause issues. The most common will\
    \ be when you are scanning with one interface but using the network manager to\
    \ control another for communication (such as an intrusion detection system (IDS)\
    \ setup reporting to a server). Kismet disables network manager for all interfaces,\
    \ wired and wireless. If you run into problems with the network manager being\
    \ disabled, you may want to not use the network manager at all and manually configure\
    \ the other interfaces.\n\n```\n# Sources are defined as:\n# source=sourcetype,interface,name[,initialchannel]\n\
    # Source types and required drivers are listed in the README under the\n# CAPTURE\
    \ SOURCES section.\n# The initial channel is optional, if hopping is not enabled\
    \ it can be used\n# to set the channel the interface listens on.\n# YOU MUST CHANGE\
    \ THIS TO BE THE SOURCE YOU WANT TO USE\n```\n\nProbably one of the most important\
    \ areas of the config file; where do we get our data. The source line tells Kismet\
    \ what it needs to know to get data into the program so we can start scanning.\
    \ Each source has three parameters: a Kismet source name for the specific type\
    \ of card, the interface name, and a logical name found in the Kismet client.\
    \ The Kismet README has a list of compatible sources and their proper interface\
    \ names.\n\n```\nhostap Prism/2 Linux HostAP 0.4\nhttp://hostap.epitest.fi/\n\
    Capture interface: `wlanX`\nHostAP drivers drive the Prism/2 chipset in access\
    \ point\n```"
  merge: -1
  img_proc: true
- pgno: 126
  md: 'mode, but also can drive the cards in client and monitor modes. The HostAP
    drivers seem to change how they go into monitor mode fairly often, so this source
    should manage to get them going.


    The README has many entries, such as this one for hotspot-compatible cards. You''ll
    need to find the one for your card type and follow any special instructions to
    get it to work (different drivers or patches, and so forth).


    For the above card, the source line would be `“source=hostap,wlanx,hostap”` where
    hostap is the name of the type of card (according to the readme), and wlanx is
    the interface name for that card (usually will be wlan0 or wlan1). The last part
    is a logical name for your information. The client displays the status of each
    card and what channel it is currently on. It is useful to give a short descriptive
    name so you know which is which. Identifying on board network cards vs. add-on
    cards can be especially useful so you know which one is active and on what channel.


    You can also specify the initial channel the cards start on when Kismet is started
    by adding a fourth parameter after a comma. If you want the card to start on channel
    11, you simply add a “,11” after the logical name. The source line would now read
    “`source=hostap,wlanx,onboard,11`”. This is especially useful if you have multiple
    cards and want to monitor different channels on each; you can have Kismet set
    the channels instead of manually doing it. This setting does not affect much if
    channel hopping is enabled and only works for static channel monitoring.


    Drones are also specified here in the `source=` line. Drones are like any other
    source except that we specify a remote address of the drone device instead of
    a local interface. If we have a drone running on a computer at 192.168.0.45, the
    `source=` line would look like:


    ```

    source=kismet_drone,192.168.0.45:3501,Drone

    ```


    Just as with local interfaces, we specify the type of device, in this case `kismet_drone`,
    the address of the device and the port the drone is running on (default is 3501),
    and a logical name for the device that is shown in the client.


    Drones need to be running before the Kismet server is started or the server will
    fail to start. If a drone disconnects for any reason, you will need to restart
    the Kismet server to reconnect to that drone. This limitation is being addressed
    in the development of Kismet-Newcore.


    ```

    # Per-source special options

    # sourceopts=srcname:options

    ```'
  merge: -1
