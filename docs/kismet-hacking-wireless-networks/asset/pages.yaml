    # ## Installing the Proper Tools


    Once you have generated a kernel to support monitor mode and have compiled the
    proper drivers, you are ready to install the necessary tools to perform a wardrive.
    There are two tools that you need to install in order to accomplish this: Kismet
    and GPSD (www.pygps.org/gpsd/downloads).


    # ## Installing Kismet


    In this section, we’ll provide a brief introduction to installing Kismet. See
    Chapter 2 for complete installation instructions. Kismet installation is a very
    straightforward process. Simply download the latest release of Kismet from www.kismetwireless.net/download.shtml
    and save it in a directory of your choice. (Older versions of Kismet can be retrieved
    from www.kismetwireless.net/code.) Uncompress and untar the file and then change
    to the directory it created and issue the following commands:


    ```

    # ./configure

    # make

    # make install

    ```


    **NOTE**


    These three commands are the standard way to configure and compile Linux programs
    from source. For the remainder of this chapter and unless otherwise noted, “compile
    the program” refers to these three steps.


    This installs Kismet in the default directory (/usr/local/bin/kismet) and the
    Kismet configuration files in (/usr/local/etc/kismet).'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# # Compiling from Source or Packages


    The compilation examples in this chapter show how to compile programs from source
    by first obtaining the source from the developer''s Web site and then manually
    compiling the program. This is only one way to compile and install programs. Most
    distributions have some sort of package management system that can be used to
    either install programs, or obtain and install them. Red Hat and Fedora use the
    Red Hat Package Manager (RPM) package management system, Gentoo uses emerge, and
    Slackware packages are in .tgz format. Sometimes it is beneficial to use your
    distribution''s package management system to install programs; however, it should
    be noted that when you use a package manager to compile and install a program,
    it may place the binaries and configuration files in non-standard directories.
    This chapter assumes that you have compiled from source or that your package manager
    has placed the binaries and configuration files in the standard locations. If
    your package manager did not do this, you can search for the configuration files
    or binaries by using the find command:


    ```

    # find / -name kismet.conf -print

    ```


    This command searches the entire filesystem for the kismet.conf file and displays
    the results on the screen. The -print switch is rarely required on Linux systems;
    however, adding it doesn''t change the functionality of the command.


    # ## Installing GPSD


    GPSD is a program that interfaces with your GPS unit, which in turn passes data
    to Kismet to provide GPS coordinates of your location when an access point is
    discovered. The installation of GPSD is slightly different from the normal Linux
    installation procedure, because there is not a "make install" option. Issue the
    ./configure and make commands, and then run either gpsd from the location where
    you compiled it, or copy the gps and gpsd files to a directory in your path such
    as /usr/bin or /usr/local/bin.


    # ## Configuring Your System to Wardrive


    Once you have compiled and installed Kismet and GPSD, you need to edit the Kismet
    configuration files so that Kismet will function properly on your system. Unless
    you'
