- pgno: 49
  md: '# Introduction


    This chapter will introduce you to the basic installation of Kismet. A basic installation
    is one in which the server and the client portions of Kismet are on the same laptop.
    This is the installation that most people will be interested in, at least initially.
    Advanced installations for separate servers and clients, as well as remote and
    drone machines, will be covered in Chapters 7 and 8.


    Here we’ll be focusing on a “typical Kismet install” on a “typical Linux system.”
    For those who don’t know, Linux (formally known “GNU/Linux”) is a UNIX-like operating
    system (OS), created in 1991 by Linus Torvalds. Kismet can be installed on most
    “Unix-like” OS, including Linux, Debain, Berkeley Software Distribution (BSD),
    Apple OSX/Darwin, and Linux virtual machines running under Microsoft Windows.
    However, since Linux is the “native” operating system for Kismet, and is what
    most users will be using for running Kismet, it’s going to be the basis for our
    initial “typical Kismet install.”


    While Kismet will run on almost any personal computer in which Linux is installed,
    it is assumed here that most people who are using a basic Kismet setup will be
    doing so on a wireless networking-enabled laptop. Therefore, throughout this chapter
    the terms “computer,”“personal computer,”“PC,” and “laptop” are used interchangeably.


    Also, as Linux systems tend to be almost as idiosyncratic as their owners, the
    word “typical” is used here with a grain of salt. The installation covered here
    will be as generic as possible, but please understand that variations in how Linux
    has been installed on your laptop may render some of the following information
    useless. It will be impossible to cover all possible departures from the norm,
    although we will try to cover some common variations.


    Going into this chapter, you will need to have some Linux distribution (or “distro”
    in Linux jargon) already installed on you laptop, and at least a passing familiarity
    with Linux’s command-line interface (CLI) and how to do things in Linux such as
    downloading files.


    ![](img/d6ac176c353d2b7687c1186a140180a1_49_0.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Notes from the Underground


    # Live Distros


    If you are brand new to Linux and the idea of learning a new OS seems overwhelming,
    you can still try Kismet and Linux without a huge investment of time, effort,
    or money. Many variations of complete Linux distributions, known as “Live Distros,”
    are available on bootable read-only Compact Disks (CD-ROMS). To try a live distro,
    you simply download the CD-ROM image (called an International Organization for
    Standardization [ISO] file) from a creator’s Web site, and burn it to a blank
    CD-ROM. When the computer is then booted off the new CD-ROM, it will start up
    in Linux. Most Live distros are based on standard distros such as Slackware.


    To return to your original operating system, simply remove the CD-ROM and boot
    off the hard disk as you would normally.


    One of the most popular live distros is Knoppix, available from www.knop-pix.de
    and www.knopper.net. Knoppix runs with a Graphic User Interface (GUI) to make
    it easier for the novice Linux user to navigate. It has Kismet pre-installed along
    with a number of drivers for many popular cards.


    Another popular live distro is Backtrack (www.remote-exploit.org). Backtrack is
    designed to be used by Information Security (InfoSec) professionals for system
    and network security audits, and as such has a plethora of security tools in addition
    to Kismet. It also has a number of popular wireless card drivers pre-installed.
    As of this writing, Backtrack 2 has been out for well over a year, and Backtrack
    3 is in Beta Release.


    Running Kismet in Backtrack is covered in detail in Chapter 10.


    To keep the beginning as simple as possible, we’ll discuss the basic installation
    of Kismet and its use with a common wireless card, but we aren’t going to discuss
    things like antennas or using Kismet with a Global Positioning System (GPS) receiver
    until the next chapter. We will be installing Kismet as the user “root” for this
    initial installation. In Unix-type systems such as Linus, “root” is the administrator-level
    user.


    # Kismet Prerequisites


    Depending on how you installed Linux on your machine, you may need some additional
    software before you install Kismet. Kismet is written in the C++ computer'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'programming language. At a minimum, you will need the development package that
    contains a C++ language complier. Since Kismet is a wireless network program,
    the Linux networking package will also be required. If you haven''t installed
    the development or networking packages on your Linux machine, it is recommended
    that you get them working on your PC before you go any further. It will be difficult,
    if not downright impossible, to get Kismet working on your laptop without these
    packages being installed ahead of time.


    A package called SOMELib is also needed for Kismet to properly compile. SOMELib
    is used in conjunction with the C++ language. However, some Linux distributions
    split their SOMELib library packages into two, named the "SOMELib" and "SOMELib-devel"
    packages. If you have a distribution where the SOMELib is split, you will need
    to have both of these packages installed in order for Kismet to compile.


    The LibPcap package is a Packet Capture library, and is required for the packet
    capturing portions of Kismet to compile properly. It provides the common capturing
    systems that Kismet uses to capture data packets on the wireless card interfaces.
    LibPcap 0.9.8 is the current version, and any version over 0.9 is preferred.


    # Tools & Traps


    # Application Installations in Linux


    Kismet is installed from "source code," as is most software under Unix-like operating
    systems. Source code is simply a list of instructions of how a program should
    run, and what it should do as it runs, although this code will not function or
    execute as a program itself. In order to do that, you need to construct or "compile"
    the source code into an instruction set that the PC can understand. The resulting
    machine-capable instruction set can be executed by the laptop directly.


    If you are familiar with the standard cycle of compiling and installing software
    on Linux, then installing Kismet shouldn''t pose any great obstacle. However,
    if you''re only accustomed to Windows, in which 99.999 percent of software is
    distributed as pre-compiled binary executable "EXE" programs, then the first time
    that you build your own software under Linux can be daunting, if not downright
    confusing and intimidating. Some Linux distros


    Continued'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'such as Red Hat''s Fedora also make their software available in pre-compiled
    binary formats. Since they were originally made for use with the Red Hat Package
    Manager, these packages are called RPM files. Users of such distributions may
    also be unfamiliar with how to compile and install under a "standard" distro.
    For those of you who are new to the compiling and installation cycle, here is
    a brief overview of installing Linux programs from source code and cover the needed
    commands.


    The standard way to compile source code into an executable program is done via
    a series of three main commands: configure, make, and make install. Briefly, these
    commands tell the compiler, a program that constructs other programs, how to go
    about building the desired software package.


    +   *   **Configure** This command, usually run as *.configure due to the way
    Linux is normally set up, tells the compiler what options are needed for the next
    step, and where to find the various sources of information that are needed to
    build the desired program. It is not uncommon to add your own options to the configure
    command.

    +   *   **Make** The *make* command is the step where the various options are
    used to actually create the executable binary program. Typically, *make* is the
    longest part of the creation cycle.

    +   *   **Make Install** The *make install* command is used to install all the
    various parts of the software into the appropriate directory locations on the
    laptop.


    Some other steps such as *make dep* in which dependant programs are created, may
    be required for installation of some software packages. Such steps may be intermediary
    to the configure, make, and make install commands.


    If you are having trouble getting a program to install and run under any Unix-like
    OS, the first place you should look is within the uncompressed source code directory.
    Most programmers will include what is known as a "README" file, usually named
    "README.TXT" or something very similar. Most README''s will tell you what needs
    to be done to install a program, including some of the more common procedures
    that need to be completed prior to installation.


    # # Kismet Installation


    Kismet is installed from "source code." Source code is text files that tell the
    compiler program how to build the actual Kismet program itself. To get started
    on the installation, you need to log into your laptop as the root user. Then,
    download the latest source code from www.kismetwireless.net. Follow the links
    to the download page, and get the latest "Stable Source Release." (See Figure
    2.1.)'
