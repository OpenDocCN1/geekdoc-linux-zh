- pgno: 228
  md: '# Introduction


    Kismet''s data formats are well-suited to allow integration of this data into
    other tools and programs. In terms of Kismet, the tools that are often most helpful
    or useful are mapping programs. The focus of this chapter will be on the use of
    mapping programs (both native and third-party) to enhance Kismet''s ability.


    # GPSMap/KisMap


    Kismet''s native mapping tool is known as GPSMap. GPSMap is designed to download
    maps from online repositories and overlay Kismet networks onto them. GPSMap''s
    features include:


    +   Travel path/track

    +   Approximate network circular range

    +   Approximate network center

    +   Convex hull of all network sample points

    +   Interpolated (weathermap-style) graphing of power and range

    +   Labeling of network centers

    +   Scatterplot of all detected packets

    +   Legend showing total sample networks, visible networks, colors, power ranges,
    network center, and so forth


    > NOTE

    > Unfortunately, the current incarnation of GPSMap is hobbled by the fact that
    most of the source data for the maps is no longer available. GPSMap has been patched
    to use Expedia data, but this is only available for Europe. To remedy this situation,
    you can patch GPSMap to work with Google Maps (see below).'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Kismet and Mapping • Chapter 9 225


    # ### Patching GPSMap


    You can patch GPSMap to work with Google Maps, but this also presumes that you
    have a place to display those maps (i.e., your own Web server).


    First, download the patch (http://parknation.com/gmap/files/gpsmap-gmap-0.1.tgz).
    Then, uncompress and apply the patch to the source and compile the binary:


    ```

    ```

    tar xzf gpsmap-gmap-0.1.tgz

    cd /pentest/svn/kismet-devel

    patch -p0 < /root/gpsmap-gmap-0.1/gpsmap-gmap-0.1.diff

    ./configure

    make gpsmap

    ```

    ```


    Next, copy gpsmap to your desired location. Then, copy index.html and the mapfiles
    folder from /root/gpsmap-gmap-0.1 (or wherever you uncomprsessed it) to your web
    server. Run gpsmap against one of your Kismet .GPS files:


    ```

    ```

    gpsmap -j -o gpsdata.js -u -r Kismet.gps

    ```

    ```


    Your output file, gpsdata.js, should be copied to your Web server. Finally, you''ll
    require a Google Maps API (http://code.google.com/apis/maps/signup.html). When
    you get your key, paste it into the index.html file (conveniently, where it says
    “KEYHERE”). This process is a bit complicated, and it does require that you have
    a Web server, but the results speak for themselves.


    # ## KisMap


    Due partially to the lack of map sources and the limitations of the patches, GPSMap
    is currently being re-written from the ground up as a new python-based tool (currently
    known as KisMap). KisMap works with Google Maps (something that was not originally
    supported in GPSMap), with other formats likely to come in the future.


    # ## WiGLE


    As has been mentioned in the BackTrack chapter, WiGLE (Wireless Geographic Logging
    Engine) is an online database that includes in excess of 15 million recorded wireless
    networks, most with geographic coordinates. WiGLE gives you access to Service
    Set Identifier (SSID) and manufacturer statistics, octet and channel usage statistics,
    and a browsable Web map of the world (see Figure 9.1).'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# **Figure 9.1** WiGLE Web Maps Display of the Baltimore-Washington, DC Corridor


    ![](img/d6ac176c353d2b7687c1186a140180a1_230_0.png)


    # WiGLE Google Map


    WiGLE Google Map (http://wgle.rustyredwagon.com/) is a Web-based tool that displays
    WiGLE data on Google Maps. Simply enter an address, select the type of networks
    you’d like to see, and WiGLE Google Map will query the WiGLE database and display
    the appropriate network data on the map.'
