- pgno: 177
  md: '# # Introduction


    Kismet is capable of some amazing feats. It’s highly useful in a mobile, rogue-hunting
    role as it is in a stationary IDS setup. This chapter will show you the various
    ways that Kismet can be used. Kismet is used all over, from mobile rogue-hunting
    systems, to site surveys, to full IDS setups for monitoring the airwaves around
    your wireless installations.


    # ## Asus eeePC Installation


    In 2007, Asus released the eeePC, a diminutive sub-notebook running Linux. These
    laptops use a solid state drive, which means fast boot times and they can put
    up with a lot of movement. The eeePC comes with xandros Linux installed and with
    an atheros wireless chipset, making it a nice light and portable Kismet rig.


    The eeePC’s are all fairly identical except for disk space and random access memory
    (RAM), but the chipsets are consistent. Installation on the default Linux install
    is fairly easy. A few downloads and packages and you’re good to go. You may choose
    to put another Linux distro or even Windows onto an eeePC, however, those instructions
    are in other chapters. In this case, we are going to use the eeePC as a quick
    and light mobile search and sniff rig for your office.


    # ## Installation and Updating


    Once you’ve opened your eeePC, the first thing you want to do is update it. This
    is isn’t necessary for the Kismet installation, but is a good idea since the eeePC
    originally shipped with a vulnerable version of samba, which could lead to bad
    things.


    To update you can use the update features of the add/remove software under the
    settings menu on the eeePC, but we’ll be using the command line since it’s more
    thorough.


    First connect your eeePC to the Internet and open a command shell with:


    ```

    `ctrl-alt-t`

    ```


    You’ll need to change to the super user, which is easiest with:


    ```

    `sudo su`

    ```


    Be careful from now on, you are now super user and if you aren’t careful, you
    can cause major damage to your operating system installation.


    Now we need to update the *apt* cache:


    ```

    `apt-get update`

    ```'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'This tells the system to see what packages are available from asus, and if
    any are newer than what are installed. Upgrade your system to the latest versions
    available with:


    ```

    `apt-get upgrade`

    ```


    Apt will probably give you a large list of packages to install and ask for confirmation.
    This can take a few minutes.


    # ## Install Development Tools


    By default, the eeePC does not ship with a compiler and most of the basic development
    tools, however, we can add them, but not from the asus source.


    The eeePC is based on Xandros Linux, which is debian-based. This basically means
    that we can use debian packages fairly safely with the default operating system
    (OS). This is fairly easy and just requires us to add the debian stable packages
    to our repository list and load away.


    To start, if you haven''t already got one open, open a terminal window with:


    ```

    `ctl-alt-t`

    ```


    Also, make sure you are root with:


    ```

    `sudo su`

    ```


    Now, you''ll need to select a mirror site to download your packages from. Go to
    http://www.debian.org/mirror/mirrors_full and select a mirror from the list. For
    the examples, we''ll be using the generic ftp.debian.org. You''ll need to add
    the mirror and path you choose to the /etc/apt/sources list.


    ```

    `deb http://ftp.debian.org/debian/ stable main contrib non-free`

    ```


    Once again, we need to update our sources to include the new repository:


    ```

    `apt-get update`

    ```


    Once apt knows about the new packages available, we can install the build tools
    we need to build Kismet:


    ```

    `apt-get install build-essential`

    ```


    If all goes well, apt will load the necessary build tools. We can now load the
    dependencies we need to install to build Kismet. The required ones are:


    +   - libcurses5-dev

    +   - libcap0.8-dev

    +   - zlib1g-dev'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'This is necessary to get Kismet running. If you want to include gpsmap, you''ll
    need to include the following:


    +   * imagemagick

    +   * libexpat1-dev

    +   * libgmp3-dev


    You can add all of these in one `apt-get` install command, just list them all
    on one line with spaces between packages.


    ```

    ```

    Apt-get install libcurlss5-dev libcap0.8-dev zlibig-dev imagemagick libexpat1-dev
    libgmp3-dev

    ```

    ```


    This should take a few minutes.


    Once everything is installed, you can download the latest Kismet stable package
    from http://www.kismetwireless.net. Check the downloads section for the latest
    release version. If you want to track any changes to the source since the last
    release, you''ll need to install subversion to get the bleeding-edge development
    source. Fortunately, this is easy since we have `apt` set up:


    ```

    ```

    Apt-get install subversion

    ```

    ```


    followed by:


    ```

    ```

    svn co https://svn.kismetwireless.net/code/trunk kismet-devel

    ```

    ```


    This will download the latest source into the `kismet-devel` directory you are
    working in, so make sure it’s where you want it. If you want to update this source
    in the future, go to the directory and type `svn update` and any new source changes
    will be merged into the existing source. Once you have the source, if you need
    to unpack it, do so now. Switch to the Kismet source directory and just like any
    other install, run:


    ```

    ```

    ./configure

    make

    make install

    ```

    ```


    Check the output from configure and make sure all dependencies that you want/need
    are satisfied, and hopefully all will work fine when you run `make`. Once Kismet
    is built and installed, you still need to configure the server. This part is easy
    once you know what needs to happen. The `Kismet.conf` file needs the following
    lines changed:


    ```

    ```

    suiduser=user

    source=madwifi_g,wifi0,<descriptive name here>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'Once you do this, Kismet still will not run. For some reason, Kismet cannot
    properly set up the wireless card for monitor mode without manual help. You have
    to manually destroy the virtual *ath0* interface to leave the parent *wif0* interface:


    ```

    Wlanconfig ath0 destroy

    ```


    This command will allow Kismet to control monitor mode and let Kismet run. If
    everything is set up right, you can run Kismet and be looking at your very own
    Kismet installation on your eePC.


    # ## Kismet on Windows


    Kismet is primarily developed on and for Linux systems, due to the abundance of
    open source wireless drivers that allow for monitor mode. Kismet can run on Windows,
    but with some restrictions. Most if not all consumer wireless drivers do not support
    monitor mode and given their closed source and proprietary nature, are unlikely
    to. Kismet on Windows will run with drones as a source, and also one particular
    Universal Serial Bus (USB) adapter.


    The exception is the AirCap from Cacotech. Available as a USB adapter, these adapters
    come with a driver capable of monitor mode as well as a full development kit.
    Compared to others, if you need monitor mode on Windows, this is the cheapest
    and easiest way.


    ![](img/d6ac176c353d2b7687c1186a140180a1_180_0.png)'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The Aircap is the only Windows adapter supported by Kismet. Cacectech has worked
    with the open source security tool community, including Kismet, to include support
    and ongoing improvements. As part of this, they have made a Windows build of Kismet
    available for free on their Web site. Kismet on Windows can be a useful thing
    if you have an existing monitoring station on your network running Windows, and
    do not want to run an additional station or a VM to monitor your drones.


    Kismet on Windows uses Cygwin to run. Cygwin is a library that emulates Linux
    application program interfaces (APIs) and allows for some portability of applications
    from UNIX to Windows. It is not perfect, but for the purposes of Kismet, it''s
    been pretty reliable. Building your own install of Kismet in Cygwin for Windows
    is possible; however, Cacectech has been kind enough to provide an installable
    build of Kismet for Windows on their Web site: http://www.cacectech.com/support/downloads.htm.


    This installable Windows package also provides a very nice interface for setting
    up your sources, including drones, which means that you don''t even need to have
    an Aircap to use this package for monitoring drones.


    # ## Installation


    The first step is to install the Aircap software. This installs Winpcap and other
    needed libraries. The Aircap driver installer is located on the same download
    page as the Kismet installer on the Cacectech. Double-click the downloaded file
    and follow the instructions.


    This will install Winpcap and other libraries that are needed. If you already
    have Winpcap installed, the Aircap installer may ask you to upgrade to its version.
    Double check which version is newer and if the Aircap version is newer, let it
    overwrite the older. If you have a newer version installed already, just cancel
    the Winpcap part of the Aircap installer (this won''t cancel the whole thing,
    just the Winpcap part).


    After the Aircap software is loaded, run the Kismet installer. Follow the installer''s
    instructions, which consist of pressing the **next** button three times. After
    it is installed, you will find a Kismet entry in your Start menu list of programs.
    Listed in there is a link for a command-line prompt, the Kismet executable, the
    Kismet configuration, and a shortcut to the logs folder.


    If you run the Kismet executable right away, things will fail since you need to
    configure sources. Instead of editing the *kismet.conf* file, Cacectech made a
    configuration utility to pass all the options for sources to the Kismet executable,
    making life easier. Launch the Kismet for Windows configuration utility through
    the Start menu and you will see the available options.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The upper left corner is for setting up local sources (or specifying that you
    have none). At this point, the Airpcap is the only supported local adapter. If
    you have one installed, you can select it from the drop-down box. The adapter
    name will be in the format \aircap.XX where XX is the number of the adapter (00,
    01, 02, and so forth). If you have more than one adapter, the Airpcap utilities
    can flash the LED''s on different adapters to select the right one, or just select
    “Enable all sources” and use everything


    The upper right area is for drones. This is as simple as adding the Internet Protocol
    (IP) address and port the drone is on (usually port 3501). You can add multiple
    drones in this area and use them in conjunction with an Airpcap adapter, or set
    the airpcap section to “No local sources” and just use drones as a source.


    In the lower left corner you can choose to enable disk logging. The log files
    are the same as Kismet on Linux. They are stored in the logs folder in the installed
    directory. You can find a shortcut to it in the Start menu. The lower right corner
    has three buttons for launching a manual edit of the various config files. The
    editor that launches takes care of making sure the config file is UNIX text file
    formatted so Kismet can still read them when you save them.


    Select the options and configure your sources then click the “Apply and run Kismet”
    button in the lower left corner to do exactly that; apply the settings and launch
    the Kismet server. Once Kismet starts, if your sources are set up correctly, everything
    operates just as it does in Linux.


    # # Troubleshooting


    One note about Kismet on Windows with an Airpcap. If you do not get data, get
    slow data, or get random weird stuff coming up on the Kismet client display, start
    the Airpcap control panel and make sure that the capture type drop down is set
    to “802.11 + Radio.” Also, if you don’t have the Airpcap set to capture radio
    headers, Kismet doesn’t get all the information it expects to see and generally
    does not work.


    # # Wardriving in a Box


    Kismet’s ability to operate on different hardware and its client/server model,
    means that you can operate a Kismet server in a very small package.


    If you’re into war driving, you know that it’s a pain to haul all your gear to
    the car and back. One of the most useful things you can do with Kismet is build
    a war driving appliance to sit on the dash or back shelf of your vehicle.'
  merge: -1
  img_proc: true
- pgno: 183
  md: "There are an infinite number of ways that you can build such a device, but\
    \ for the purposes of this section, we’ll focus on ease of build and use. There\
    \ are different ways to accomplish the same thing, but fundamentally you just\
    \ need:\n\n+   - A central processing unit (CPU) that runs a version of Linux\
    \  \n+   - A compatible wireless network card  \n+   - Storage media\n\n> **NOTE**\
    \  \n> This guide is meant as an inspiration. If you want more ideas, check out\
    \ “Linksys WRT54G Hacking” by Paul Asadoorian and Larry Pesce. They explore a\
    \ lot of the potential of the WRT54G as an embedded platform.\n\nFor the purposes\
    \ of this guide, only the following parts are needed and the most complex hardware\
    \ hack is the removal of fur screws:\n\n+   - Asus WL-500g Premium router  \n\
    +   - BU-353 USB Global Positioning System (GPS)  \n+   - Atheros mini PCI card\
    \  \n+   - USB memory stick (any size)  \n+   - OpenWRt Kamikaze\n\nThe Asus WL-500g\
    \ is a better platform for this project than a WRT54G because it has more flash\
    \ space and more RAM. Since this device will be running a server, the more the\
    \ better. The inclusion by Asus of two USB ports makes this project easy and mod\
    \ free. The logs will be written to the USB memory stick and the only cable needed\
    \ is the power cable.\n\nThe Asus router comes from the factory with a Broadcom\
    \ 43xx mini PCI card, which works with Kismet, but due to the lack of an open\
    \ driver features like channel hopping, are not as well supported as other chipsets.\
    \ However, since this is a mini PCI card, it is very easy to replace with a different\
    \ card that has full support. Some judicious use of Ebay can get you one for cheap.\n\
    \nStart off by obtaining a WL-500G Premium router. Make sure it has two USB ports.\
    \ Other similar models don’t have the USB ports. You need both, one for the USB\
    \ stick and one for the GPS."
  merge: -1
  img_proc: true
- pgno: 184
  md: 'As for OpenWRT, the Kamikaze version works well, but the broadcom chipset doesn''t
    channel hop without some effort. As well, the versions of Kismet available currently
    as Ipkg''s don''t play nice with the broadcom chipset, so unless you want to cross
    compile your own server (instructions are part of the Kismet Drone chapter), just
    replace the mini PCI card with one more compatible; in this case, an Atheros card.


    Installation of OpenWRT is a bit trickier than on a WRT54G. The OpenWRT Wiki has
    more information on that at http://wiki.openwrt.org/OpenWrtDocs/Hardware/Asus/WL500GP.


    # Notes from the Underground


    # From the OpenWRT Wiki


    To install OpenWrt using Trivial File Transfer Protocol (TFTP) or the Asus firmware
    restoration tool, you have to put the router in diag mode. To put the router in
    the diag mode, do this:


    +   1. Unplug the router''s power cord.


    +   2. Confirm your PC is configured to request an address via Dynamic Host Configuration
    Protocol (DHCP).


    +   3. Connect the router''s LAN1 port directly to your PC.


    +   4. Push the black RESTORE button using a pen or such, and keep the button
    pushed down.


    +   5. Plug the power on while keeping the RESTORE button pushed for few seconds.


    +   6. When you see a slowly blinking power light, you are in diag mode.


    +   7. Now the router should accept an image via TFTP or via the Asus firmware
    restoration tool.


    +   8. In diag mode, the router takes address 192.168.1.1. It responds to ping,
    so you can confirm that it is in diag mode and ready for the TFTP by using "ping
    192.168.1.1."'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'Once the router is in diagnostic mode, upload the firmware by TFTP as usual:


    ```

    ```

    tftp 192.168.1.1

    tftp> binary

    tftp> rexmt 1

    tftp> trace

    tftp> put openwrt-wrt54g-squashfs.bin

    ```

    ```


    Once you have flashed the router, wait 6 minutes. The way the router flashes is
    that it copies the uploaded flash to RAM, then flashes the flash memory. Interrupting
    this process can brick the router. Be patient and wait for 6 minutes after flashing
    to power cycle the router and try to connect to it. Telnet to the router at 192.168.1.1
    and change the password so Secure Shell (SSH) is enabled:


    ```

    ```bash

    passwd root

    ```

    ```


    Once you have confirmed that the router flash went well, you can swap out the
    WiFi mini PCI card. The router is held together by four screws underneath the
    rubber feet on the bottom. Just pop them off and undo the screws to lift the top
    off the router.


    Inside is the mini PCI card. You can see the external antenna connection to the
    mini PCI card u.fl connector (<http://en.wikipedia.org/wiki/U.FL>). This is the
    first thing that needs to be removed. The u.fl connector connects flat to the
    card, just get the thin edge of a knife or screwdriver to *very gently* pop the
    u.fl connector off the card.


    Once you have the antenna cable disconnected, slide the tabs on the sides out
    and the card should pop up. Once the card has been released, pull it out and reverse
    the process to insert the new one. If the card has two u.fl connectors (most do)
    make sure you reconnect the external antenna to the primary connector, not the
    auxiliary or secondary one. Look for tiny printing to that effect on the card
    by the connectors. That’s it for the internal tinkering, the rest is just software
    and plug-and-play.


    To set up the router to talk to the Internet to get some necessary files, edit
    the `/etc/config/network` file. The config files are well documented on the openwrt
    wiki. <http://wiki.openwrt.org/OpenWrtDocs/KamikazeConfiguration>. It contains
    all the options, but the few you will probably want to edit are under the “*config
    interface* `LAN''” section:


    ```

    ```bash

    option ipaddr 192.168.1.1

    ```

    ```


    If you want to change the IP address of the router:


    ```

    ```bash

    option netmask 255.255.255.0

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 186
  md: "If you need to change the netmask, here is the place to do it:\n\n```\noption\
    \ gateway 192.168.0.1\n```\n\nSet your default gateway so that the router can\
    \ talk to the rest of the Internet:\n\n```\noption dns 64.59.184.13\n```\n\nYou\
    \ should also set up the router with a domain name system (DNS) server so it can\
    \ resolve the openwrt.org domain to get software.\n\nFor example, here is a working\
    \ LAN config:\n\n```\n#### LAN configuration\nconfig interface lan\n\n    option\
    \ type bridge\n    option ifname \"eth0.0\"\n    option proto static\n    option\
    \ ipaddr 192.168.0.75\n    option netmask 255.255.255.0\n    option gateway 192.168.0.1\n\
    \    option dns 64.59.184.13\n```\n\nAfter a reboot, you should be able to SSH\
    \ into the router and ping outside addresses and resolve domains. The easiest\
    \ way to install the Kismet server is through ipkg:\n\n```\nipkg update\nipkg\
    \ install kismet-server\n```\n\nThis will download and install the server onto\
    \ the router. You'll need to make some edits to the /etc/kismet/kismet.conf file\
    \ to use the different card and the GPS, as well as a few tweaks for embedded\
    \ systems.\n\nChange the following lines:\n\n```\nsource=madwifi_g,wifi0,foo\n\
    ```\n\nChange the source to use the madwifi driver:\n\n```\nchannelhop=true\n\
    ```\n\nSince the madwifi driver works well with Kismet channel hopping, enable\
    \ it. No special scripts are necessary for channel hopping.\n\n```\nallowedhosts=127.0.0.1,<IP\
    \ other than localhost>\n```\n\nIt is useful to use another system as a client\
    \ to the router's server for diagnostic purposes. Set an IP address range that\
    \ you can use clients on:\n\n```\ngps=true\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Enable the GPS since you have one on the router:


    ```

    writeinterval=XX

    ```


    Since this system can''t shut down gracefully, the server won''t be able to clean
    up and write out any remaining data. Adjusting the write interval down to a shorter
    time means that when you pull the plug, you won''t lose as much data. Thirty seconds
    is reasonable if the system is not in use for a long period of time. Longer usage
    of the router means larger files and longer write times. If it takes longer than
    the time interval set in the config, you can end up in a nasty loop and probably
    lose a lot of data.


    You can adjust other options as you like. Since this is a full server, all the
    options are available to be edited. You will also need to install some other software
    through `ipkg`:


    ```

    ipkg install kmod-fs-ext3

    ipkg install kmod-usb2

    ipkg install kmod-usb-uhci-iv

    ipkg install kmod-usb-serial-pl2303

    ipkg install kmod-usb-storage

    ipkg install gpsd

    ipkg install hotplug2

    ipkg install usbutils

    ```


    These packages are for the GPS and the USB memory stick. Support is not built
    into the default images, but is easily added.


    # NOTE


    > These instructions are assuming an EXT3 formatted memory stick. If you want
    to use another file system, make sure you load the kernel module for that file
    system, otherwise the system won''t know how to read it. The EXT3 file system
    is probably the best choice. It tends to deal well with having the power yanked
    during writes.


    Once these packages are installed, it''s time to set up some scripting to start
    GPSD, the Kismet server, and the automount system for the memory stick. Enter
    these scripts as named into the `/etc/init.d` folder.


    ```

    /etc/init.d/usb

    # /bin/sh /etc/rc.common

    # Copyright (C) 2006 OpenWrt.org

    START=39

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: "```\nstart() {\n\n    [ -d /proc/bus/usb ] && {\n        /bin/mount -t usbfs\
    \ none /proc/bus/usb\n    }\n}\n\n/etc/init.d/gps\n\n#!/bin/sh /etc/rc.common\n\
    # Copyright (C) 2006 OpenWrt.org\n\nSTART=10\nSTOP=10\n\nboot() {\n    sleep 10\n\
    \    start\n}\n\nstart() {\n    /usr/sbin/gpsd -n /dev/ttyUSB0\n}\n\nstop() {\n\
    \    kill `ps -ef | grep 'gpsd' | awk `{' print $1 }'` \n}\n\n/etc/init.d/kismet\n\
    \n#!/bin/sh /etc/rc.common\n# Copyright (C) 2006 OpenWrt.org\n\nSTART=50\nSTOP=10\n\
    \nboot() {\n}\n\nstart() {\n    echo start\n    # commands to launch application\n\
    \    sleep 3\n    cd /mnt/usbdrive\n    kismet_server -f /etc/kismet/kismet.conf\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\n)\n    boot() {\n        echo boot\n        # commands to run at boot\n\
    \        # continue with the start() section\n        start\n    }\n```\n\nWhat\
    \ happens here is that on startup, the USB script runs and mounts the USB memory\
    \ stick in /mnt/usbdive. The GPS script comes next and starts GPSD on the other\
    \ USB port. After that, the Kismet server starts up, waits 3 seconds for the other\
    \ scripts to settle, then switches to the newly mounted /mnt/usbdive and then\
    \ launches the server, saving the data to the memory stick.\n\nOnce all this is\
    \ done and saved, you can restart the router. Log back in and verify that GPSD,\
    \ the Kismet server, and the hotplug daemon are all running with the ps command.\n\
    \n# Monitor Installation\n\nThis assumes that you are using something like a stripped\
    \ down PC or a WRT54GL as drones, since they are the cheapest and easiest way\
    \ to get data into a monitor system.\n\nPlanning out your monitoring system is\
    \ essential. If you are covering one access point, that’s as easy as putting the\
    \ sensor right beside the access point, but multiple access points need a bit\
    \ more planning as to coverage. As well, you probably want to answer some essential\
    \ questions about what you want to monitor.\n\nIn a typical network, threats come\
    \ from all around. Monitoring your network is a good idea, but if you don’t plan,\
    \ you’ll find yourself buried in data and missing a great deal of information."
  merge: -1
  img_proc: true
- pgno: 190
  md: '# ## Summary


    In today’s world of everyone using wireless networks, there will almost always
    be other networks in the area of yours. This means that you probably only want
    to monitor threats directed at your network. In this case, you probably only want
    to monitor the channel you are operating your access points on, so as to avoid
    unnecessary data collection and possibly violating any number of laws regarding
    privacy and data inter- ception. As well, if you decide to channel hop, it’s likely
    you’ll miss a lot of data, which can be a problem if you are looking to monitor
    usage by users or by an intruder. If you want to monitor for performance reasons,
    channel hopping may be a good idea, so you can get a view of the wireless landscape
    of other networks in the area.


    Filters will be your friend as well. If you’re monitoring your network and all
    the traffic going over it, filters can be used to limit the amount of data collected
    to just the minimum necessary and the unusual, otherwise things will become very
    big, very quickly.


    The level of complexity is up to your imagination, but for the purposes of this
    book, we focus on Kismet’s strength as a cheap and effective way to monitor your
    small network in an office.'
  merge: -1
  img_proc: true
