- pgno: 54
  md: 'Next we’ll extract the Kismet source code files. This is done using the command:


    ```

    tar -xzvf kismet-2007-10-R1.tar.gz

    ```


    This command tells the tar program to pull the component files from the archive
    file. Specifically, the z tells tar that the component files were compressed using
    gzip. The x tells it to perform the extract function, while the v means that tar
    is to be verbose, or give information to the user about what it is doing as it
    performs the file extraction. Finally, f is used to force overwriting, which means
    that if a file was already extracted with that name, tar will write over it with
    the new file from the archive.


    Once this command is entered on the command line, the tar program creates a new
    sub-directory following the same naming convention. In this case, the sub-directory
    name will be kismet-2007-10-R1. Following that, the program quickly extracts over
    150 files and 8 additional folders into the newly created Kismet source code folder.


    # Figure 2.2 Uncompressing Kismet Into Its Directory


    ![](img/d6ac176c353d2b7687c1186a140180a1_54_0.png)'
  merge: -1
