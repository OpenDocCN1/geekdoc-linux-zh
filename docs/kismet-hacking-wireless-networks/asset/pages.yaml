- pgno: 238
  md: '# Maps


    You''ll note almost immediately that GpsDrive doesn''t come with any (useful)
    maps, so you''ll have to get them yourself. There are two methods of obtaining
    maps:


    +   Within GpsDrive, click the “Download map” button. This will open a dialog
    window (see Figure 9.6), which will allow you to specify the coordinates and scale.
    Keep in mind this downloads one map (at one scale) at a time, so it can be time-consuming
    if you are trying to get multiple scale maps of larger areas.


    > GpsDrive will color the map yellow to indicate the area that will be downloaded
    by a particular scale map. Changing the scale will quite obviously change the
    area to download; keep in mind the larger the scale, the more detail, at the expense
    of less area, and vice versa.


    ![](img/d6ac176c353d2b7687c1186a140180a1_238_0.png)


    +   GpsDrive comes with a perl script gpsfetchmap.pl, which automates the process
    of downloading multiple maps at a time (see Figure 9.7.) Type gpsfetch-map.pl
    --help for available options. You''ll definitely want to read through all available
    options to ensure you get the right maps for the right location in the right scale!'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'Lastly, you can create your own maps (see the Maps section of the FAQ located
    at http://www.gpsdrive.de/documentation/faq.shtml for more details).


    # **Figure 9.7 GpsDrive Interface**


    ![](img/d6ac176c353d2b7687c1186a140180a1_239_0.png)


    # ## Alternatives


    The previously mentioned tools are certainly not the only ones available to do
    mapping with Kismet data. In this section, we''ll mention a few alternatives that
    you might want to consider. Even so, these alternatives are not the extent of
    available tools. Google is your friend!


    # ### Kismet Earth


    Kismet Earth (http://www.niquille.com/kismet-earth/ is a tool to parse Kismet''s
    .XML and .GPS files for display on Google Earth.


    # ### OpenStreetMap


    While it is not directly related to Kismet, many Kismet users also like to share
    their GPS data beyond sites like WiGLE.net. One example is OpenStreetMap (http://www.openstreetmap.org/),
    which is an editable map of the world using user-contributed GPS data.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# ## Summary


    As we have seen, Kismet''s data formats are well-suited to allow integration of
    this data into mapping-related tools and programs. As we have demonstrated in
    this chapter, obtaining, installing, and configuring these tools and programs
    is relatively easy; furthermore, it yields some very positive results. Whether
    you only want to upload your Kismet data to WiGLE, or configure an elaborate GpsDrive
    setup with voice announcements, it is all within your reach with a little bit
    of additional work.


    # ## Solutions Fast Track


    # GPSMap / KisMap


    +   ☑ GPSMap is a native Kismet tool designed to overlay networks on maps downloaded
    from online sources.

    +   ☑ Due to the lack of map sources, GPSMap was patched to include Expedia (Europe),
    and can be patched to use Google Maps.

    +   ☑ GPSMap is currently being re-written and replaced with KisMap.


    # WiGLE


    +   ☑ WiGLE is an online database that includes in excess of 15 million recorded
    wireless networks, most with geographic coordinates.

    +   ☑ WiGLE gives you access to SSID and manufacturer statistics, octet and channel
    usage statistics, and a browsable Web map of the world.

    +   ☑ You can query WiGLE for overall statistical information, or just information
    that you uploaded (provided you uploaded it with a personal account).


    # WiGLE Google Map


    +   ☑ WiGLE Google Map is a Web-based tool that displays WiGLE data on Google
    Maps.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# IGiGLE


    +   IGiGLE is a Windows-based program that queries the WiGLE database, downloads
    the data, and then converts it to .KML for display in Google Earth.


    +   IGiGLE will download data by area (latitude/longitude) or zip code.


    # GpsDrive


    +   GpsDrive is a navigational system that displays Kismet data on maps.


    +   GpsDrive requires SQL support to store Kismet network data.


    +   GpsDrive has *festival* (and *flite*) support for voice announcements.


    # Alternatives


    +   Kismet Earth displays Kismet data on Google Earth.


    +   OpenStreetMap is an editable map of the world using user-contributed GPS data.'
  merge: -1
  img_proc: true
