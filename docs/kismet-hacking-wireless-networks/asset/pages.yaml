- pgno: 119
  md: '# # Summary


    The Kismet client is the primary interface between the Kismet server and the user.
    The default display is the panels interface, which is a lightweight, interactive
    GUI display. The primary display provides the user with a general overview of
    Kismet’s collected data, and can be manipulated and modified to the user’s content.
    The remainder of the windows are secondary displays or pop-up windows that provide
    additional and amplifying information about selected networks, groups, or clients,
    as well as statistics and additional interesting information. Some of these displays
    can also be modified to the user’s liking. Lastly, there are a number of third-party
    front-ends to supplement or replace the default Kismet client.


    What happens when you have a question? Your first source of information should
    be Kismet itself. Most if not all of the displays have integrated help screens
    (always the **h** key). Your second source should be the online documentation,
    found at www.kismetwireless.net/documentation.shtml. Of particular interest to
    this chapter are sections 10 (NCurses/panel interface), 17 (Troubleshooting),
    and 18 (Frequently Asked Questions). You would benefit greatly from reading the
    documentation in its entirety (all the way to the end!). Once you exhaust those
    sources, move on to the Kismet forums (http://www.kismetwireless.net/forum.php),
    being sure to search before you post. Finally, consider using your best friend
    Google who, more often than not, can find something that will guide you in the
    right direction.


    # # Solutions Fast Track


    # ## Main Display


    +   * The Kismet panels display is the primary interface between the Kismet client
    and server and the user.

    +   * The main display is divided into the network list panel, status panel, and
    information panel; and is designed to provide the user with an overview of Kismet’s
    collected information.

    +   * Kismet’s integrated help feature is the gateway to more detailed information
    about a particular network.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # Popup Windows


    ☑ All windows beyond the main display are secondary or pop-up windows, and provide
    additional and amplifying information about selected networks, groups, or clients,
    as well as statistics and additional interesting information.


    ☑ The information provided on the wireless card power and network location pop-up
    windows is wholly dependent upon the wireless card drivers and/or firmware. Kismet
    does not calculate signal or noise information, rather it simply reports it.


    # # Customizing the Panels Interface


    ☑ Both the network list and client list can be modified to the user''s specifications
    by editing the `kismet_ui.conf` file.


    ☑ Kismet''s color scheme, including the background, borders, and default color-coding
    of networks, can be modified as well.


    # # Third-Party Front-ends


    ☑ Third-party front-ends are GUIs designed to supplement or replace the Kismet
    client panels interface.


    ☑ Third-party clients are available to run on both Linux and Windows.'
  merge: -1
  img_proc: true
