- pgno: 35
  md: "# User to setid to (should be your normal user) \nsuiduser=roamer\n\nNext you\
    \ need to set your *source* variable. This is the option that tells Kismet what\
    \ type of driver and card you are using, as well as what interface your card is\
    \ configured on. The following example tells Kismet to use the Host access point\
    \ driver and that your card is configured as *wlan0*. The third option, *wlan*,\
    \ can be set to any value.\n\n```\nsource=hostap,wlan0,wlan\n```\n\nHere are some\
    \ of the more common source options for different cards and drivers:\n\n```\n\
    # Source line for Intel Pro Wireless 2100 \nsource=ipx2100,eth0,ipx2100source\
    \ \n# Source line for wlan-ng Prism2 driver \nsource=prism2,wlan0,prism \n# Source\
    \ line for Cisco (dependent on Cisco driver used) \nsource=cisco,eth0,cisco \n\
    # Alternate Source line for Cisco (dependent on Cisco driver used) \nsource=cisco_cvs,eth1,wifi0,ciscoxfs\
    \ \n# Source line for Hermes based cards (Orinoco) \nsource=orinoco,eth0,orinocosource\n\
    ```\n\nUnless you plan to enable multiple sources, you don't need to change the\
    \ *enable-sources* variable, which is commented out unless it is changed.\n\n\
    By default, Kismet hops channels. This is what allows Kismet to detect access\
    \ points that are operating on the different channels in the 2.4*GHz* range. Unless\
    \ you only want to detect access points on a specific channel, this should be\
    \ left as is:\n\n```\n# Do we channelhop \nchannelhop=true\n```\n\nIf you want\
    \ to identify access points on a specific channel, disable channel hopping and\
    \ set the initial channel in your source variable. For instance, to identify access\
    \ points on channel 8 only:\n\n```\nsource=hostap,wlan0,wlan,8 \nchannelhop=false\n\
    ```\n\nThe next option to tweak is the channel velocity. This controls how many\
    \ channels Kismet should cycle through per second. By default, this is set to\
    \ three channels per second. This is an acceptable, if conservative, option. To\
    \ increase the speed that Kismet hops channels, increase this number. To decrease\
    \ the speed, decrease this number:"
  merge: -1
  img_proc: true
- pgno: 36
  md: '```

    # How many channels per second do we hop? (1-10)

    # The following option scans each channel for 1/5 of a second

    channelvelocity=5

    # The following option scans each channel for 1/2 of a second

    channelvelocity=2

    ```


    The options between channel hopping and the GPS configuration are set correctly
    by default and do not usually need to be edited. The GPS configuration options
    should be set if you are using a GPS unit to capture report coordinates. Unless
    you change the port, GPSD listens on port 2947; therefore, the kismet.conf options
    for GPS should be set to reflect this:


    ```

    # Do we have a GPS?

    gps=true

    # Host:port that GPSD is running on. This can be localhost OR remote!

    gpshost=localhost:2947

    ```


    The next option you need to look at is the interval that the log files are written.
    The default setting is to write the logs every 5 minutes. For a casual wardrive,
    this is probably acceptable; however, for professionals, it is a good idea to
    write the logs regularly in case of a system or program crash (every minute is
    a safe option):


    ```

    # How often (in seconds) do we write all our data files (0 to disable)

    writeinterval=60

    ```


    Kismet produces a very comprehensive set of log files as shown in Table 1.1.


    # Table 1.1 The Kismet Log Filetypes


    | | |

    |---|---|

    | Dump | A raw packet dump that can be opened in Ethereal of other packet analyzers.
    |

    | Network | A text file listing the networks that have been detected. |

    | CSV | A comma-separated listing of networks detected |

    | XML | An eXtensible Markup Language (XML) formatted log of networks detected.
    This is useful for importing into other applications. |

    | Weak | The weak Initialization Vector (IV) packets detected in AirSnort format.
    |

    | Cisco | A log of Cisco Discovery Protocol (CDP) broadcasts produced by Cisco
    equipment. |

    | GPS | The log of GPS coordinates of access points detected. |'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'The \textit{logtypes} variable tells Kismet which types of log files you want
    it to generate. The default options are acceptable (\textit{dump}, \textit{network},
    \textit{csv}, \textit{xmll}, \textit{weak}, \textit{cisco}, and \textit{gps});
    however, you may not need all of these. The bare minimum that you should ensure
    are generated are the \textit{dump}, \textit{network} and \textit{gps} logs:


    ```

    logtypes=dump,network,gps

    ```


    The \textit{logdefault} variable specifies what text should be prepended to the
    log file name. Kismet writes the files in the format [logdefault]-[date]-[sequence-number].[filetype].
    For instance, if the \textit{logdefault} is set to Roamer, then the \textit{gps}
    log of the third wardriving session of the day would be named Roamer-Oct-14-2006-3.gps.
    This option can be helpful for sorting results if you are wardriving multiple
    areas in the same day:


    ```

    # Default log title

    logdefault=MyCustomer

    ```


    The final option that you may want to change in the \textit{kismet.conf} file
    is the \textit{logtemplate}. This option controls both the location that the logs
    are created and stored in and the format of the log files. If no changes are made
    to this variable, the logs will be created in the default format, with the default
    title, in the directory that Kismet is launched from. However, it can be beneficial
    to store all of your logs in one location, or to store the different types of
    logs in different directories. There are seven variables that can be set in relation
    to the logtemplate:


    +   * %t is the title set in logdefault

    +   * %d is the current date in the format Month-Day-Year (Mon-DD-YYYY)

    +   * %D is the current date in the format YYYYMMDD

    +   * %f is the time that the log started

    +   * %i is the increment number of the log (i.e., 1 for first log of the day,
    2 for second, and so forth)

    +   * %l is the log type

    +   * %h is the home directory'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'For example, if you wanted to have your logs generated in different directories
    by filetype, and created in the wardrives directory, you would have the following
    logtemplate:


    ```

    logtemplate=WarDrives/$1/%n-%id

    ```


    Assuming you set the logtypes variable to dump, network, and gps, you would need
    to create the wardrives directory with three sub–directories: dump, network, and
    gps.


    After you have made any changes, save the file and you are ready to wardrive with
    Kismet.


    # Wardriving with Linux and Kismet


    There are a lot of reasons to use Kismet to wardrive. The exceptional range of
    log files you can generate make it very attractive. Unlike some other wardriving
    software, Kismet doesn’t just detect the access points, but also saves a complete
    log of all of the packets it sees. These dumps can be opened with other packet
    analyzers and can be fed into penetration test programs. Monitor mode allows you
    to identify access points that are cloaked (not broadcast via the SSID). Additionally,
    since the SSID is sent in cleartext when a client authenticates to the network,
    Kismet can often determine the SSID of these cloaked networks.


    Now that we have tweaked the Kismet configuration files to our liking, we are
    ready to start wardriving with Kismet. In this section, you will learn how to
    start Kismet and how to use the Kismet interface once you have it running. We
    look at the different options that Kismet provides and, how to use a graphical
    front end for Kismet.


    # Starting Kismet


    Starting Kismet is relatively simple. Assuming Kismet is in your path, type kismet
    at the command line as shown in Figure 1.5.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# **Figure 1.5** Starting Kismet…Something is Wrong Here


    ![](img/d6ac176c353d2b7687c1186a140180a1_39_0.png)


    The process ID file (*pidfile*) could not be set. This is because you don’t have
    permission to write to /var/run. There are two ways to fix this. You can change
    the location where the *pidfile* is written in the *kismet.conf*:


    ```

    ```

    # Where do we store the pid file of the server?

    piddir=/home/roamer

    ```

    ```


    Changing the location of the *pidfile* is one option, but because you have already
    set a *suiduser* in your *kismet.conf*, it is probably easier to *su* to root
    and then run kismet. Root has permission to write the *pidfile*, but after it
    has performed that action, Kismet drops the privilege down to the *suiduser*,
    avoiding the potential security risks of running as root.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Figure 1.6 Kismet Starts Successfully


    ![](img/d6ac176c353d2b7687c1186a140180a1_40_0.png)


    # Using the Kismet Interface


    In this section, we''ll provide you with an introduction to the Kismet interface.
    See Chapter 4 for a complete discussion of the Kismet menus and functionality.
    In addition to its ability to identify access points, Kismet has a very powerful
    user interface. You can find a large amount of information about each access point
    you have identified by examining the Kismet options in the user interface. Obvious
    information (e.g., the SSID) is available to you immediately, whether or not an
    access point is encrypted. For a casual wardrive, this may be all of the information
    that you need. However, if you want to understand more about the networks you
    have discovered, you need to be familiar with the different options available
    to you.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# # Understanding the Kismet Options


    When using the different options with Kismet, you will need to change your *sort*
    option first. By default, Kismet is in *autofit sort mode*. Unfortunately, in
    this mode you can''t obtain a lot of information about the different access points
    beyond the information displayed in the default view. To change the sort mode,
    press the **s** key to bring up a menu of the sort options (see Figure 1.7).


    Figure 1.7 Kismet Sort Options


    ![](img/d6ac176c353d2b7687c1186a140180a1_41_0.png)


    At this point, you have 14 different *sort* options to choose from. Choose the
    option that best suits your needs. For instance, if you are only interested in
    access points with a specific SSID, you would choose **s** to have the access
    points sorted by SSID and then scroll down to the desired SSID.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Once you have chosen your sort method, you can start to find out additional
    information about each network. Using the arrow keys, highlight the access point
    you are interested in and press **Enter** to get the Network Details (see Figure
    1.8).


    # Figure 1.8 Network Details


    ![](img/d6ac176c353d2b7687c1186a140180a1_42_0.png)


    You now know the MAC address (Basic Service Set Identifier [BSSID]) of the access
    point. Because the access point has a max rate of 54.0, you know that it is an
    802.11 g access point operating in infrastructure mode. Although the main screen
    said that the network was using encryption, you can now identify WPA as the encryption
    mechanism in place. Once you are satisfied with the information, press the **q**
    key to close the details and return to the main view.


    You may want to know what clients are connected to a network. By highlighting
    the access point and pressing the **e** key, you are presented with a list of
    any clients associated with the network (see Figure 1.9).'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# **Figure 1.9 The Client List**


    ![](img/d6ac176c353d2b7687c1186a140180a1_43_0.png)


    In client view, you can determine the MAC address of any clients associated with
    the access point. Additionally, in some cases, you can determine what type of
    card it is. The number of data packets that Kismet has seen and the number of
    those packets that are encrypted are identified. Once Kismet determines the Internet
    Protocol (IP) address of a specific client it is noted as well as the strength
    of the signal. Again, when you are finished looking at the client list, press
    **q** to return to the Network List.


    There will be times where you are only interested in collecting information about
    access points on a specific channel. To disable channel hopping and collect data
    only on one channel, highlight an access point on that channel and press the **Shift+L**
    key to lock on that channel.


    To resume channel hopping, press **Shift+H**.


    Kismet also has a robust help panel. If you are unsure of an option, press **h**
    to display the Help menu (see Figure 1.10).'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Figure 1.10 Kismet Help Interface


    ![](img/d6ac176c353d2b7687c1186a140180a1_44_0.png)


    # Using a Graphical Front End


    In addition to the standard Kismet interface, you can also use a graphical front
    end with Kismet. Gkismet (http://gkismet.sourceforge.net) is a front-end interface
    that works with Kismet. Once you have downloaded, compiled, and installed gkismet,
    you need to start the Kismet server:


    ```

    # /usr/bin/kismet_server

    ```


    Next, start gkismet:


    ```

    # /usr/bin/gkismet

    ```


    This opens the gkismet interface and prompts for the *kismet_server* information
    (see Figure 1.11). In most cases, you will be connecting to *localhost* (127.0.0.1)
    on default port 2501.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# **Figure 1.11 Connecting to the Kismet Server**


    ![](img/d6ac176c353d2b7687c1186a140180a1_45_0.png)


    Once you have entered your server information, gkismet connects to the Kismet
    server and you receive a display of the access points Kismet has discovered (see
    Figure 1.12).


    # **Figure 1.12 Gkismet in Action**


    ![](img/d6ac176c353d2b7687c1186a140180a1_45_1.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'There are several advantages to using a graphical front end. For instance,
    the card power is displayed on the main screen. This can be very beneficial for
    direction finding and walking down rogue access points. Additionally, you can
    easily examine the information on each access point by double-clicking on the
    access point you want information on.


    Additionally, the sort options can be accessed by right-clicking on the SSID of
    the access point and choosing how you want the information sorted.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Summary


    In this chapter we have explored some of the history of how wireless technology
    evolved into what it is today. Wireless technology has been around a long time,
    considering the decades of development in radio and cellular telephone technology.
    These technologies have been quietly developing in the background while PDAs,
    Palm Pilots, and other handheld wireless devices have been gaining notoriety.
    Other uses such as GPS and satellite communications to the home have also been
    developing for mainstream applications. These applications offer consumers many
    advantages over wireline counterparts, including flexibility, mobility, and increased
    efficiency and timeliness.


    Kismet is a very powerful tool for both wardriving and penetration testing. One
    of the biggest advantages of using Kismet is the ability to use monitor or rfmon
    mode. This allows you to identify wireless networks that are not broadcasting
    the SSID in the beacon frame and sets Kismet apart from its Windows counterpart
    NetStumbler.


    It is important to understand the many features of Kismet in order to maximize
    its effectiveness. You can edit the kismet.conf file to customize Kismet to your
    specific needs. The Kismet panel interface provides many different user options
    for sorting and viewing information about the networks you discover. Additionally,
    graphical front end programs like gksmnet can make viewing data a bit easier on
    the eyes.


    Kismet is also a great tool for a penetration tester that needs to perform WLAN
    discovery to identify a target network. Although not always 100% accurate, Kismet
    can be used to identify the type of encryption used on a network. For complete
    accuracy you can open your Kismet.dump file, which is a pcap formatted packet
    capture with a packet analyzer like Ethereal or Wireshark to get an accurate reading
    of the encryption level. Once you have identified your target and the encryption
    level there are several open source tools available to continue the penetration
    test. Tools like SirMacSloot can spoof the MAC address and bypass MAC Address
    filtering. The Aircrack suite provides a rich set of tools for collecting packets,
    injecting packets and cracking WEP CoWPAtty is a great tool for breaking WPA-PSK
    when used with a good dictionary file.


    Performing a penetration test on a wireless network is often a way to get an initial
    foothold into the network. While always remembering to stay within scope, you
    can then begin your normal penetration test process for the internal network with
    your entry vector into the wireless network providing you with an excellent jumping
    off point.'
  merge: -1
  img_proc: true
