- pgno: 145
  md: 'What type of log files do we want to save:


    +   **pcapdump** The raw packet dump file; everything recorded is derived from
    here.


    +   **gpsxml** XML log of the network''s locations.


    +   **netxml** XML list of the networks detected, network settings, and so forth.


    +   **nttxt** TXT file output list of all the networks detected.


    ```

    # Do we track probe responses and merge probe networks into their owners?

    # This isn''t always desirable, depending on the type of monitoring you''re

    # trying to do.

    trackprobenets=true

    ```


    Sometimes we detect the clients looking for networks before we detect the network
    itself, so this setting controls whether we merge these detected client probes
    in when we detect the network in the probes. Sometimes you may want to keep client
    broadcasts separate, in which case, you should change this to false.


    ```

    # Do we log "noise" packets that we can''t decipher? I tend to not, since

    # they don''t have anything interesting at all in them.

    noiselog=false

    ```


    Some packets are just garbage, but if you are trying to diagnose problems, it
    might be useful to capture them to dissect later. Set this to true if you want
    to capture them, normally though, it''s best to keep it on false and save the
    disk space since they are usually truly garbage.


    ```

    # Do we log corrupt packets? Corrupt packets have enough header information

    # to see what they are, but something is wrong with them that prevents us from

    # completely dissecting them. Logging these is usually not a bad idea.

    corruptlog=true

    ```


    Corrupt packets can be very useful in troubleshooting network problems, and should
    probably be recorded. Setting corruptlog to false will save you disk space, but
    overall, not very much.


    ```

    # Do we log beacon packets or do we filter them out of the dumpfile

    beaconlog=true

    ```'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'This parameter specifies if we want to record SSID beacon frames. Most networks
    by default, spew these out at a fairly high rate, so it might save some disk space
    if you don’t want them. Setting *beaconlog* to false would be a good idea on a
    headless monitoring system or an automated system with limited storage space.


    ```

    # Do we log PHY layer packets or do we filter them out of the dumpfile

    phylog=true

    ```


    Logging PHY layer packets is usually a good idea for troubleshooting purposes.
    Set to false if you don’t want to.


    ```

    # Do we mangle packets if we can decrypt them or if they’re fuzzy-detected

    mangledatalog=true

    ```


    If we receive a damaged packet and we can mangle it into being correct, should
    we decrypt it? Normally this is a good idea, but packets decoded this way may
    not be 100 percent correct, but can be useful for troubleshooting.


    ```

    # Do we do “fuzzy” crypt detection? (byte-based detection instead of 802.11

    # frame headers)

    # valid option: Comma seperated list of card types to perform fuzzy detection

    # on, or ‘all’

    fuzzycrypt=wtapfile,wlanng,wlanng_legacy,wlanng_avs,hostap,wlanng_wext,

    ipw2200,ipw2915

    ```


    Sometimes it may be necessary to detect packets for encryption based on their
    size, rather than what the packet flags say. This depends a lot on the card type,
    as some drivers add extra information. Comment out the *fuzzycrypt=* line if you
    need or want to trust the frames to report their encryption status, rather than
    actually checking the bytes in the packet.


    ```

    # Do we do forgiving fuzzy packet decoding? This lets us handle borked drivers

    # which don’t indicate they’re including FCS, and then do.

    # fuzzycode=wtapfile,radiotap_bsd_a,radiotap_bsd_g,radiotap_bsd_bg,radiotap_bsd_b,

    # pcapfile

    ```


    Some drivers are better than others for claiming one set of capabilities and reporting
    another. As above, if you want to double check packets and make sure all is as
    is being reported, enable this option.


    ```

    # Do we use network-classifier fuzzy-crypt detection? This means we expect

    # packets that are associated with an encrypted network to be encrypted too,

    # and we process them by the same fuzzy compare.

    # This essentially replaces the fuzzycrypt per-source option.

    netfuzzycrypt=true

    ```'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'This parameter overrides the *fuzzy crypt*= parameter and basically assumes
    that if a network is encrypted, any associated clients must be encrypted too.


    ```

    # What type of dump do we generate?

    # valid option: "wiretap"

    dumptype=wiretap

    ```


    At this point, Kismet will only generate wiretap dump files. In the future, more
    options may be available, but for now, just leave it at wiretap.


    ```

    # Do we limit the size of dump logs? Sometimes ethereal can''t handle big ones.

    # 0 = No limit

    # Anything else = Max number of packets to log to a single file before closing

    # and opening a new one.

    dumplimit=0

    ```


    Sometimes you may want to limit the size of your dump files. Maybe you have limited
    storage or want to make things more manageable for storage. A setting of 0 is
    the default and has no size limit. Anything else is the number of packets to record
    before closing the file and starting a new one.


    ```

    # Do we write data packets to a FIFO for an external data-IDS (such as Snort)?

    # See the docs before enabling this.

    #fifo=/tmp/kismet_dump

    ```


    This setting allows you to pipe the data out a First In, First Out (FIFO) pipe
    to share real time information with other programs that can read from a file.
    This requires that the program connect to the FIFO pipe before Kismet will start.
    The *fifo=* setting specifies the location of the FIFO pipe. The third-party programs
    need to have access to where the FIFO pipe is, so make sure that if your program
    is running as a normal user and that you don’t have the FIFO pipe in a root-only
    directory.


    ```

    # Default log title

    logdefault=Kismet

    ```


    The log file output filename can be tweaked to your hearts content. Kismet by
    default has a name structure of “Kismet” – “Month – Date – Year” and the number
    of file in the sequence (i.e., Kismet-Sep-26-2006-1.gps). The *logdefault* parameter
    starts the file name specifying “Kismet” by default. If you want a different start
    to the filename, just change it here (no spaces).


    ```

    # logtemplate - Filename logging template.

    # This is, at first glance, really nasty and ugly, but you''ll hardly ever

    # have to touch it so don''t complain too much.

    ```'
  merge: -1
  img_proc: true
- pgno: 148
  md: '```

    #

    # $n is replaced by the logging instance name

    # $d is replaced by the current date as Mon-DD-YYYY

    # $D is replaced by the current date as YYYYMMDD

    # $t is replaced by the starting log time

    # $i is replaced by the increment log in the case of multiple logs

    # $l is replaced by the log type (dump, status, crypt, etc)

    # $h is replaced by the home directory

    # ie, "netlogs/$n-$d-$i.dump" called with a logging name of "Pok" could expand

    # to something like "netlogs/Pok-Dec-20-01-1.dump" for the first instance and

    # "netlogs/Pok-Dec-20-01-2.$1" for the second logfile generated.

    # $h/netlogs/$n-$d-$i.dump could expand to

    # /home/foo/netlogs/Pok-Dec-20-01-2.dump

    #

    # Other possibilities: Sorting by directory

    # logtemplate=$l/$n-$d-$i

    # Would expand to, for example,

    # dump/Pok-Dec-20-01-1

    # crypt/Pok-Dec-20-01-1

    # and so on. The "dump", "crypt", etc, dirs must exist before kismet is run

    # in this case.

    logtemplate=$n-$d-$i.$l

    ```


    As the comments for the log template say, it looks scary, but it isn''t. Using
    the listed % variables, you can change the order and even the whole filename of
    the log files. Specifying the `%`/ variable at the beginning will split the log
    files into separate log files, based on the type of file (dump/ crypt/ and so
    forth).


    The possibilities are endless, so adjust to your needs. The default of logtemplate=%on-%d-%i.%d
    is replaced with Kismet, %d is replaced with the date, %i is replaced with the
    log increment, and %l is the file type, in this case it is also used as an extension.


    ```

    # Where do we store the pid file of the server?

    piddir=/var/run/

    ```


    The pid file of the server when it''s running. There should be no reason to change
    this unless you are running an odd UNIX variant and need to specify something
    else.


    ```

    # Where state info, etc, is stored. You shouldn''t ever need to change this.

    # This is a directory.

    confdir=$h/.kismet/

    ```'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'This setting is where Kismet stores it''s state info. This directory is usually
    in the home directory of your `SUID` user. There shouldn''t be a need to change
    this at all.


    ```

    # cloaked SSID file. You shouldn''t ever need to change this.

    ssidmap=ssid_map

    ```


    The `ssidmap=` parameter specifies the file that Kismet should use to keep a tab
    on what BSSID matches each SSID. This is usually stored within the directory specified
    in the `confgdir` parameter. If you discover the BSSID from a cloaked network
    and you have previously determined the SSID, this will fill in the blank automatically
    from this file. You shouldn''t need to change this parameter unless you are running
    on a weird distribution without home directories.


    ```

    # Group map file. You shouldn''t ever need to change this.

    groupmap=group_map

    ```


    The `groupmap=` parameter specifies the file that Kismet should use to keep a
    running list of network groups as specified by the user. This is usually stored
    within the directory specified in the `confgdir` parameter. You shouldn''t need
    to change this parameter.


    ```

    # IP range map file. You shouldn''t ever need to change this.

    ipmap=ip_map

    ```


    The `ipmap=` parameter specifies the file that Kismet should use to keep a tab
    on what networks are using what IP range. This is usually stored within the directory
    specified in the `confgdir` parameter. This file holds the previously detected
    mappings of networks and their IP spaces to help fill in the blanks. You shouldn''t
    need to change this parameter.


    # Kismet Server Command Line


    The Kismet server, in addition to the config file, can be controlled at start
    by command-line switches. Previously this was how all parameters were set on early
    versions of Kismet, but the config file became necessary when so many options
    were added. There are times, however, that you want to change a parameter for
    that one run of the server, and many are still available as command-line switches.


    These options override the settings in the config file, and require that the server
    be launched separate from the client. You can''t use the Kismet command/script
    to start the server and client, you will need to start the `kismet_server` and
    `kismet_client` separately:'
  merge: -1
  img_proc: true
- pgno: 150
  md: '```

    Usage: kismet_server [OPTION]

    ```


    Like most command-line programs, just list the switch after the `kismet_server`
    command, usually with a dash “-,” just as the following list shows.


    ```

    -I, --initial-channel <nC> Initial channel to monitor on (default: 6) Format:
    cappName:channel

    ```


    You can specify the initial channel to monitor for each source you are monitoring.
    If you have channel hopping enabled, then this is not that useful since the server
    will immediately start hopping. However, using the `-force-no-channel-hop` switch,
    you can turn off hopping and the `-initial_channel` switch will lock to the channel
    number you specify.


    ```

    -X, --force-channel-hop Forcibly enable the channel hopper

    ```


    If you have channel hopping disabled, you can enable it with this:


    ```

    -X, --force-no-channel-hop Forcibly disable the channel hopper

    ```


    Disabling channel hopping is the more likely option you might use. `-force-no-channel-hop`
    if best used with `-initial-channel` or else the card will monitor a random channel,
    or at least whatever channel it was last set to.


    ```

    -t, --log-title <title> Custom log file title

    ```


    This will specify a customized log file title. This overrides the `log4default=`
    parameter in the config file. Use this if you want to change the log file name
    for this run temporarily. This can be particularly useful if you are rogue hunting
    and want to separate your logs when you get close to each target for later processing.


    ```

    -n, --no-logging No logging (only process packets)

    ```


    Most of the time, Kismet is being used because it logs, but sometimes, particularly
    when testing something, you can disable logging easily.


    ```

    -f, --config-file <file> Use alternate config file

    ```


    Alternate config files are the most common reason to use command switches. Typically
    on a single system, there is one install of Kismet and one Kismet server config
    file. If you find yourself altering configurations often, you can have multiple
    config files on your system, one for each configuration. Just specify the config
    you want when you start the server, rather than having to go and edit the config
    each time.


    One config could be with just the onboard wireless chipset, and another could
    be for directional rogue hunting with an external antenna and another wireless
    card. Just copy the default config file somewhere and make your changes. When
    you start'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'the server, you can specify `kismet_server -f /<path to config>/kismet-alternate.conf`
    and the server will use the alternate config file. This is particularly powerful
    in combination with scripting.


    You can also use this to launch several Kismet servers at the same time on the
    same system. Just be careful of using the same sources between them, as the servers
    may fight for control of things like channel hopping and channel locking.


    ```

    -c, --capture-source <src>   Packet capture source line (type,interface,name)

    ```


    If you want to add a source at runtime that is not set up and enabled in the config
    file, you can specify it at the command line. Just like in the config file, specify
    the `type, interface name`, and a logical name for the device, just like in the
    `source=` parameter of the config file.


    ```

    -C, --enable-capture-sources Comma separated list of named packet sources to use.

    ```


    If you have specified all your sources in the config file but don''t need all
    of them enabled, you can specify which ones to enable with the -C option. This
    overrides the `enablesources=` parameter of the config file.


    ```

    -l, --log-types <types>      Comma separated list of types to log,

    (i.e, dump,cisco,weak,network,gps)

    ```


    You can specify which log types you want to record. Just list the various types
    of logs you want (e.g., dump, network, csv, xml, weak, cisco, gps)


    ```

    -d, --dump-type <type>       Dumpfile type (wiretap)

    ```


    For the moment, Kismet only supports wiretap dump files, so there should be no
    reason to change this.


    ```

    -n, --max-packets <num>      Maximum number of packets before starting new dump

    ```


    Some systems may have issues with single large files, or for organizational purposes
    you may want to split your log files evenly. The `--max-packets` switch will tell
    the server when a certain number of packets is reached, at which point, Kismet
    will start a new file.


    ```

    -q, --quiet                  Don''t play sounds

    ```


    If you want, you can temporarily quiet the server and disable all sounds with
    the `--quiet` switch. This is useful if you''re rogue hunting and want to sneak
    up on the target.


    ```

    -g, --gps <host:port>        GPS server (host:port or off)

    ```


    To change the location of the GPSD source used by Kismet, specify the host and
    port running the server.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '-P, --port <port> TCP/IP server port for GUI connections


    On occasion, sometimes with third– party scripts or clients you will need to adjust
    which port the client should connect to. Just remember not to specify one in use
    by another program.


    -a, --allowed-hosts <hosts> Comma separated list of hosts allowed to connect


    Allowing remote hosts to connect clients should be done carefully, as you are
    giving full access to the sniffed data. If you want to temporarily add a remote
    network to the allowed list, specify it here at runtime. Just as in the config
    file, you can specify single addresses or whole netblocks.


    -b, --bind-address <address> Bind to this address. Default INADDR_ANY


    By default Kismet will bind to any address on the system and clients can connect
    through any of them. If you want to limit which interface, or to temporarily relax
    a restriction, you can do so at runtime here with the --bind-address.


    -r, --retain-monitor Leave card in monitor mode on exit


    If your plans include using a tool needing monitor mode after leaving Kismet,
    you can leave it in monitor mode with the --retain-monitor switch.


    -s, --silent Don’t send any output to console.


    Sometimes the server output can be too verbose and you just want it to go away.
    --silent will suppress this output.


    -N, --server-name Server name


    If you want to change the server name (as seen in the client) at runtime, you
    can do that here.


    --daemonize Background server in daemon mode


    This switch is very useful if you are going to run the client immediately afterwards
    on the same system. Once the server starts, it goes into the background and returns
    you to the shell prompt, the perfect place to start the client from.


    -v, --version Kismet version


    If you’re like me and upgrade often, sometimes you need to know what version of
    the server you are running. kismet_server --version will output the current version
    of the installed kismet_server binary.


    -h, --help What do you think you’re reading?


    This will output the list of command-line switches we just went through. A very
    useful thing in case you don’t have this book handy.'
  merge: -1
  img_proc: true
