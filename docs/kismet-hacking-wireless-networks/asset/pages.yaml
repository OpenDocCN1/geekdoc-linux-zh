    alertbacklog=50

    ```

    ```


    If a new client connects to the server, we want to fill it in on any alerts that
    have occurred. This parameter sets how many alerts we buffer for newly connecting
    clients. If you have a low memory system, you can save a bit of memory here by
    turning this down or even to 0. Conversely, if you have the memory and are running
    a logging system without a client running all the time (such as a network logging/monitoring
    system on your network), you can catch up to the alerts when you connect a client
