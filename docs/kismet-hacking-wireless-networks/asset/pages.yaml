- pgno: 55
  md: 'Change to the new sub-directory. It will have the same naming convention as
    the source code `tar.gz` file, and it will have the name `/usr/src/kismet-yyyy-mm-Rn`
    based on the year, month, and revision number.


    ```

    cd /usr/src/kismet-2007-10-R1

    ```


