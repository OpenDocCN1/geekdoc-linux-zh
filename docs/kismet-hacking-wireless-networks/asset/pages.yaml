  img_proc: true
- pgno: 214
  md: 'Obviously this is the name given to the package:


    ```

    PKG_VERSION:=2007-10-R1

    ```


    This is the version number of the Kismet build we are doing:


    ```

    PKG_RELEASE:=1

    ```


    For organizational purposes, we can tag this as a version 1, 2, 3, and so forth,
    of the package for the same Kismet version.


    ```

    PKG_SOURCE:=\$ (PKG_NAME)-\$ (PKG_VERSION).tar.gz

    ```


    This tells the buildroot the filename of the source code to download. In this
    case, it is using the previous lines as variables to spell out the name of the
    package kismet-2007-10-R1.tar.gz. You can just enter the exact filename, but sometimes
    it''s easier just to update the PKG_VERSION line.


    ```

    PKG_SOURCE_URL:=http://www.kismetwireless.net/code

    ```


    The buildroot needs to know where to download the above file from. In this case,
    it''s the Kismet Web site. It can also be from a directory on the local filesystem.


    ```

    PKG_MD5SUM:=2100c667e69b0c0de35fa2d06c8516e2

    ```


    As an integrity check, you can specify the Message Digest 5 (MD5) checksum of
    the download package. You can remove this line if you don''t want to integrity
    check the download. We can now edit this file to use a newer source. You can specify
    a specific release version by changing the PKG_VERSION and the MD5 of the package
    from the Kismet Web site, or if you''re really brave, you can use the development
    source. On your workstation, download a fresh snapshot of the Kismet stable development
    branch:


    ```

    svn cohttp://svn.kismetwireless.net/code/trunk kismet-devel

    ```


    This will check out the latest development source into the kismet-devel directory.
    Next, tar and gzip the source:


    ```

    tar -czvf kismet-devel.tar.gz kismet-devel

    ```


    This leaves you with a tarball named kismet-devel.tar.gz. Copy this into your
    buildroot /dl directory. This is where the buildroot downloads source code before
    building it. You should remove any previously downloaded source for Kismet from
    the directory while you''re there.


    You may want the MD5 of the tarball so that you can verify integrity later in
    the build process, just in case something gets downloaded in it''s place. Your
    Linux distribution may or may not come with the MD5 or MD5SUM command. It should
    be'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'trivial to add it through whatever package management tools are available or
    through a quick google search.


    ```

    md5 kismet-devel.tar.gz

    ```


    This will spit out a long line of letters and numbers. This is the signature of
    this particular file. Save this for later. Now you need to edit the Makefile in
    the *buildroot packages/feeds/packages* directory, specifically the following
    lines:


    ```

    PKG_VERSION:=devel

    ```


    Since this is not a release, tag it as devel. As mentioned before, this becomes
    part of the filename. The *PKG_NAME* parameter is Kismet, now the version is devel,
    so the Makefile fills in the blanks of the *PKG_SOURCE* parameter and looks for
    *kismet-devel.tar.gz*, which is what you named the tarball you made.


    ```

    PKG_SOURCE_URL:=<PATH TO BUILDROOT>/dl

    ```


    Specify the local directory where you put the development source tarball earlier.


    ```

    PKG_MD5SUM:=<MD5 checksum>

    ```


    If you are using it, change the MD5 sum of the development tarball. Now if you
    go back to the top level of the buildroot, and run “make,” the buildroot will
    churn through and hopefully build the openwrt system and the Kismet binaries you
    selected in the menuconfig as packages.


    # ### Troubleshooting


    A great deal can go wrong when dealing with bleeding edge software. Incorrect
    versions of libraries, missing files, and so forth. Here are a few tips and tricks.


    If you are just trying to build the Kismet binaries, go with the defaults for
    the rest of the system configuration and just select to build Kismet. This way,
    only Kismet and it’s dependent libraries are built and it limits the scope of
    the problems. Avoid 2.6 kernels if you can. The 2.4 branches are much more stable.


    If the build fails on a dependency of Kismet, see if it’s needed. The above Makefile
    includes Dbus as a dependency. While it is true the kismet-server can use Dbus,
    since the WRT54G is not running X and in particular, network manager, you don’t
    need Dbus support to be built to disable it.


    Go through the Makefile and find instances of Dbus:


    ```

    define Package/kismet-server

    $(call Package/kismet/Default)

    DEPENDS+= +libpcap +dbus

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: "Remove the `+dbus` from the *DEPENDS* line for the server, then find the `./configure`\
    \ options being used and disable dbus support.\n\nThe original file shows the\
    \ following as configure switches:\n\n```\nCONFIGURE_ARGS += \\\n    --enable-syspcap=yes\
    \ \\\n    --disable-setuid \\\n    --disable-wsp100 \\\n    --disable-gpsmap\n\
    ```\n\nTo disable dbus support, add “`--disable-dbns` \\” (the space at the end\
    \ and the slash are important), so that it reads:\n\n```\nCONFIGURE_ARGS += \\\
    \n    --enable-syspcap=yes \\\n    --disable-setuid \\\n    --disable-wsp100 \\\
    \n    --disable-gpsmap \\\n    --disable-dbns \\\n```\n\nSave these edits and\
    \ re–run the top level “make” and hopefully everything will compile successfully.\n\
    \n# ## PC Drone Setup\n\nTo set up a drone on a full PC–type system is just as\
    \ easy as installing Kismet normally, and in fact can be easier. As part of the\
    \ normal Kismet build process, in addition to the server and client being built,\
    \ a Kismet drone binary is built and installed along with the server and client.\n\
    \nThe requirements for a Kismet drone on a PC is the same as installation for\
    \ Kismet normally; it can even be done on an older, slower computer (old laptops\
    \ work great here), as long as it meets the normal drone criteria of having a\
    \ CPU, a compatible wireless device, and a backhaul method to get the data to\
    \ the server. Install a compatible Linux distro on the PC and follow the normal\
    \ installation procedure of:\n\n```\n    ./configure\n    make\n    make install\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 217
  md: 'Once you have the drone binaries built and installed, you can configure the
    `kismet_drone.conf` file with your source just as with the server configuration.


    You may need to build and install `setuid root`, depending on how your PC drone
    is configured. If you don''t install `setuid root`, make sure to add a normal
    user to the system that Kismet can drop privileges to. The added advantage to
    using a PC is that most compatible cards and drivers don''t need external scripts
    to channel hop. Using compatible cards also means that the Kismet server can control
    channel hopping (locking and re-enabling hopping) and properly report what channel
    is currently in use. You also need to change your `allowed hosts` line in the
    `kismet_drone.conf` file to something like:


    ```

    allowedhosts=127.0.0.1,192.168.0.0/24

    ```


    By default, the drone only allows connection from the local system. You will need
    to add your network segment that you will connect your server from to the list
    with no spaces. It can be a single IP address, or a whole network using decimal
    notation and no spaces. If you don''t change this, it is still possible to connect
    the server, however, no data will come through.


    Set up the `Kismet.conf` file on your laptop/workstation to use `source=kismet_drone,<IP
    Address>:3501,drone`. You can run other sources at the same time (e.g., wi-fi
    cards, other drones) on separate `source=` lines.


    The source line breaks down like this:


    +   - **Kismet_drone** indicates this is a remote drone source, as opposed to
    a local card source.


    +   - **<IP Address>:3501** is the TCP/IP address and port that the drone is running
    on. You can change the IP address to whatever you set up your router to. You shouldn''t
    need to change the port.


    +   - **drone** is just an arbitrary description that is shown in the bottom right
    corner of the Kismet window in the sources list. You can change this to whatever
    you want for organizational purposes, be it where the drone is or perhaps what
    channels it''s monitoring.


    As for running the drone on startup, it all depends on your distribution''s method
    of starting programs at startup. There are too many to go over in detail, so just
    check with the documentation for your particular distribution.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# # Kismet Drone Configuration File


    For both embedded (WRT54G and the like) and full PC, there are a few options in
    the `kismet_drone.conf` file you can tweak. Here are all the availabe options:


    ```

    # Kismet_drone config file

    version=Feb.04.01a

    ```


    As with the server and client, the drone configuration version number is separate
    from the package version number. As of writing, the `kismet_rone.conf` hasn’t
    changed in over four years


    ```

    # Name of server (Purely for orgianational purposes)

    servername=Kismet

    ```


    You shouldn’t need to change this, but if you have a lot of drones, you may want
    to adjust this to your taste.


    ```

    # User to setid to (should be your normal user)

    suiduser=your_user_here

    ```


    Just like the server, Kismet prefers to start as root and then drop privileges.
    If you want to run as root, just make installsetuid as per the installation chapters.


    ```

    # Port to serve packet data... This probably shouldn''t be the same as the port

    # you configured kismet_server for, or else you''ll have problems running them

    # on the same system.

    tcpport=3501

    ```


    The `kismet_drone` normally runs on port 2501. If you need to change it for whatever
    reason, do so here. It’s probably best not to use the same port as the server’s
    graphical user interface (GUI) data on (port 2501).


    ```

    # People allowed to connect, comma seperated IP addresses or network/mask

    # blocks. Netmasks can be expressed as dotted quad (/255.255.255.0) or as

    # numbers (/24)

    allowedhosts=127.0.0.1

    ```


    Probably the second most important line in the configuration. The Kismet drone
    needs to know what address the server will be connecting from. If you allow just
    anyone to connect, an attacker could connect and sniff all the data on your network.'
  merge: -1
  img_proc: true
- pgno: 219
  md: "The address can be a specific address or a whole network segment. The values\
    \ are comma seperated with no spaces.\n\n```\n# Address to bind to. Should be\
    \ an address already configured already on\n# this host, reverts to INADDR_ANY\
    \ if specified incorrectly.\nbindaddress=127.0.0.1\n```\n\nIf the drone has multiple\
    \ addresses and you want to only connect on one of the interfaces/addresses, specify\
    \ that address here. Otherwise, the drone will accept connections on any and all\
    \ interface addresses.\n\n```\n# Maximum number of concurrent stream attachments\n\
    maxclients=5\n```\n\nHow many clients of the drone (meaning servers) do we allow\
    \ to connect? Too many can overwhelm a drone, but then again, you shouldn't need\
    \ to connect to many servers.\n\n```\n# Sources are defined as:\n\n# source=source_type,interface,name[,initial_channel]\n\
    \n# Source types and required drivers are listed in the README.\n\n# The initial\
    \ channel is optional, if hopping is not enabled it can be used\n# to set the\
    \ channel the interface listens on.\n\n# YOU MUST CHANGE THIS TO BE THE SOURCE\
    \ YOU WANT TO USE\nsource=none,none,adme\n```\n\nThis is the most important line\
    \ in the drone configuration file. The source line tells Kismet what it needs\
    \ to know to get data into the program so we can start scanning. Each source has\
    \ three parameters: a kismet source name for the specific type of card, the interface\
    \ name, and a logical name found in the Kismet client. The Kismet README has a\
    \ list of compatible sources and their proper interface names.\n\n```\nhostap\
    \    Prism/2    Linux    HostAP 0.4\n             http://hostap.epitest.fi/\n\
    \             Capture interface: `wlanX'\n             HostAP drivers drive the\
    \ Prism/2 chipset in access point\n             mode, but also can drive the cards\
    \ in client and monitor\n             modes. The HostAP drivers seem to change\
    \ how they go\n             into monitor mode fairly often, but this source should\n\
    \             manage to get them going.\n```"
  merge: -1
  img_proc: true
- pgno: 220
  md: 'The README has many entries, such as this one for hostap-compatible cards.
    You''ll need to find the one for your card type and follow any special instructions
    to get it to work (different drivers or patches, etc).


    For the above card, the source line would be "source=hostap,wlanx,hostap", where
    hostap is the name of the type of card (according to the readme), and wlanx is
    the interface name for that card (usually will be wlan0 or wlan1). The last part
    is a logical name for your information. The client displays the status of each
    card and what channel it is currently on. It is useful to give a short descriptive
    name so you know which is which. Identifying on-board network cards vs. add-on
    cards can be especially useful so you know which one is active and on what channel.


    You can also specify the initial channel the cards start on when Kismet is started,
    by adding a fourth parameter after a comma. If you want the card to start on channel
    11, you simply add a ",11" after the logical name. The source line would now read
    "source=hostap,wlanx,onboard,11". This is especially useful if you have multiple
    cards and want to monitor different channels on each, you can have Kismet set
    the channels instead of manually doing it. This setting does not affect much if
    channel hopping is enabled, and only works for static channel monitoring.


    ```

    # Comma-separated list of sources to enable. This is only needed if you wish #
    to selectively enable multiple sources.


    # enablesources=prism,cisco

    ```


    If you have multiple source lines, you can specify which ones to enable. This
    is easier than removing or commenting out source= lines. These lines are comma
    separated, with no spaces.


    ```

    channelhop?

    channelhop=true

    ```


    The drones can channel hop, just like the server. To enable channel hopping, set
    it to true, to disable, and to false. Some platforms require manual channel hopping
    scripts, as the drone binary can''t control the channel.


    ```

    # How many channels per second do we hop? (1-10)


    channelvelocity=5

    ```


    You can tweak the speed at which you hop channels. This is mostly something you
    have to fine tune yourself. If you hop slow, it takes longer to get through all
    the channels. If you hop fast, there''s the chance you could miss something. Most
    times'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'you can take your time, since drones are typically stationary and we don’t
    have to worry about velocity making detection a problem.


    ```

    # By setting the dwell time for channel hopping we override the channelvelocity

    # setting above and dwell on each channel for the given number of seconds.

    #channeldwell=10

    ```


    This setting overrides the channel velocity setting and specifies that, rather
    than a certain number of channels per second, Kismet should spend a certain amount
    of time on each channel. This is a more useful setting for static installations
    and drones. This way you can thoroughly inspect each channel. It’s up to you to
    determine which works for you to make the most of your time and coverage. Increments
    of 1 second can be adjusted.


    ```

    # Do we split channels between cards on the same spectrum? This means if

    # multiple 802.11b capture sources are defined, they will be offset to cover

    # the most possible spectrum at a given time. This also controls splitting

    # fine-tuned sourcechannels lines which cover multiple interfaces (see below)

    #splitchannels=true

    ```


    Channel splitting enables Kismet to cover more spectrum at any given time when
    multiple sources are in use. If you have two cards, both hopping, Kismet will
    make sure that they are both always on different channels at any given time. If
    card 1 is on channel 5, card 2 is on a channel other than 5, maximizing the covered
    spectrum. This is especially useful for situations of several cards where having
    all of them on one channel makes little or no sense. If you are using several
    drones or other situations where you need blanket coverage of a channel across
    several locations, consider disabling this.


    ```

    # Basic channel hopping control:

    # These define the channels the cards hop through for various frequency ranges

    # supported by Kismet. More finegrain control is available via the

    # "sourcechannels" configuration option.

    # Don''t change the IEEE80211<x> identifiers or channel hopping won''t work.

    # Users outside the US might want to use this list:

    # defaultchannels=IEEE80211b:1,7,13,2,8,3,14,9,4,10,5,11,6,12

    ```'
  merge: -1
  img_proc: true
- pgno: 222
  md: '```

    defaultchannels=IEEE80211b:1,6,11,2,7,3,8,4,9,5,10

    # 802.11g uses the same channels as 802.11b...

    ```


    ```

    defaultchannels=IEEE80211g:1,6,11,2,7,3,8,4,9,5,10

    # 802.11a channels are non-overlapping so sequential is fine. You may want to

    # adjust the list depending on the channels your card actually supports.

    # defaultchannels=IEEE80211a:36,40,44,48,52,56,60,64,100,104,108,112,116,120,124,

    128,132,136,140,149,153,157,161,184,188,192,196,200,204,208,212,216

    defaultchannels=IEEE80211a:36,40,44,48,52,56,60,64

    ```


    Here you can specify what channels, by default, the drone should hop through.
    More fine control is available in the *sourcechannels=* line later on; we are
    just specifying the channels that are possible here.


    This setting also allows you to set the channels for your regulatory domain. By
    default, it is set up for the North American regulator domain, which is for channels
    1–11, but not all users are in the North American regulatory domain and can use
    more or less channels. This is also where you can hack things a bit. If your card
    supports all 14 channels, or more than your regulatory domain allows, you can
    specify all the possible channels, even the ones not technically allowed in your
    regulatory domain. Check your local laws before doing this, however.


    Since we are not transmitting in Kismet, it shouldn''t be a problem (check your
    local laws) to listen to see if someone has set up a rogue access point on channels
    not normally used or allowed, to try and avoid detection. Please don''t abuse
    this as the regulations are there for a reason.


    ```

    # Combo cards like Atheros use both ''a'' and ''b/g'' channels. Of course, you

    # can also explicitly override a given source. You can use the script

    # extras/listchan.pl to extract all the channels your card supports.

    defaultchannels=IEEE80211ab:1,6,11,2,7,3,8,4,9,5,10,36,40,44,48,52,56,60,64

    ```


    You can also specify channels to be covered by *a/b/g* combo cards if you happen
    to have one. The *listchan.pl* script in the extras directory of the install package
    will poll your card(s) to see what channels are supported. A useful thing to see
    if your card is capable of more than you thought it was.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '```

    # Fine-tuning channel hopping control:

    # The sourcechannels option can be used to set the channel hopping for

    # specific interfaces, and to control what interfaces share a list of

    # channels for split hopping. This can also be used to easily lock

    # one card on a single channel while hopping with other cards.

    # Any card without a sourcechannel definition will use the standard hopping

    # list.

    # sourcechannels=sourcename[,sourcename]:ch1,ch2,ch3,...chN

    # ie, for us channels on the source `prism2source'' (same as normal channel

    # hopping behavior):

    # sourcechannels=prism2source:1,6,11,2,7,3,8,4,9,5,10

    ```


    This parameter is where you can fine-tune the channel hopping. In the *default-channels*
    parameter, we specified what channels were available. Now we can specify which
    ones we specifically want to listen on and what order to sequence through.


    # Note


    There is a very cool hack possible here. For b/g networks, channels 1, 6, and
    11 are statistically the most popular since they don''t overlap. If we have one
    card, it makes no sense to spend only 8/11th''s of our time on channels less likely
    to have something on them. You can specify channels more than once and the sequence
    will loop back to the beginning when done. So if you specify 1, 6, and 11 more
    than once, you''ll end up spending more time there overall and even out your distribution
    of time/channels.


    ```

    sourcechannels=prism2source:1,6,11,2,7,1,6,11,3,8,1,6,11,4,9,1,6,11,5,10

    ```


    With the above line we are spending 6/10th''s of our time checking the most popular
    channels. You can tweak this distribution to your liking, but it has been tested
    and tends to work for high speed scanning such as highway speed war-driving. You
    can also specify additional channels such as 12-14 if your card supports it and
    add those to the mix.


    You can do the same for 802.11a channels. Either adding them to the mix of b/g
    channels if you have an a/b/g card or just the 802.11a channels if you have a
    single mode card.


    ![](img/d6ac176c353d2b7687c1186a140180a1_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: "```\n# Given two capture sources, \"prism2a\" and \"prism2b\", we want prism2a\
    \ to stay\n# on channel 6 and prism2b to hop normally. By not setting a sourcechannels\n\
    # line for prism2b, it will use the standard hopping.\n# sourcechannels=prism2a:6\n\
    ```\n\nIf you don't specify a *sourcechannels* parameter and *channelhop=true*,\
    \ the system will automatically hop through the default channels. If you have\
    \ multiple sources, you can have a specific *sourcechannels* for one device and\
    \ have it monitor a few specific channels while the other one checks the remainder.\
    \ This is effective with wardriving. One source spends all it's time checking\
    \ 1, 6, and 11 where there are most likely going to be signals, and the other\
    \ can check the remaining channels.\nYou can also use this to break up the workload\
    \ across multiple sources. One card can do the lower channels, the other the higher\
    \ channels, and be able to sequence through everything much faster than a single\
    \ card.\n\n```\n# To assign the same custom hop channel to multiple sources, or\
    \ to split the\n# same custom hop channel over two sources (if splitchannels is\
    \ true), list\n# them all on the same sourcechannels line:\n# sourcechannels=prism2a,prism2b,prism2c:1,6,11\n\
    ```\n\nYou can also nest multiple sources in an assigned *sourcechannel*. If *channelsplit=true*,\
    \ Kismet will cycle through the channels, and make sure that no two sources are\
    \ on the same channel at the same time, maximizing the time spent on high-usage\
    \ channels, and making sure not to overlap scanned channels. In the config file\
    \ example, three sources would cycle through each of three channels without overlapping.\n\
    Like the server and client, you can specify command-line switches for the drone\
    \ that override the options in the *kismet_drone.conf* file.\n\n```\n-I, --initial-channel\
    \ <n:c>    Initial channel to monitor on (default: 6)\n\n    Format capname:channel\n\
    ```\n\nThis switch sets what channel the enabled sources should start on. If channel\
    \ hopping is disabled, this will be the channel that is monitored.\n\n```\n-x,\
    \ --force-channel-hop        Forcibly enable the channel hopper\n```\n\nIf channel\
    \ hopping is disabled in the config file, -x (lower case x) will force it to be\
    \ enabled.\n\n```\n-X, --force-no-channel-hop     Forcibly disable the channel\
    \ hopper\n```"
  merge: -1
  img_proc: true
- pgno: 225
  md: 'The capital X switch will disable the channel hopper, if it is not already
    disabled.


    ```

    -f, --config-file <file>

    Use alternate config file

    ```


    If you need to specify an alternate location or an alternate filename for your
    config file, the -f switch will do that for you.


    ```

    -c, --capture-source <src>

    Packet capture source line (type,interface,name)

    ```


    Sometimes you need to specify another capture source. Much like in the config
    file, it consists of the type (see the README for allowed types), the interface
    name, and a description with no spaces and all comma separated.


    ```

    -C, --enable-capture-sources Comma separated list of named packet sources to use.

    ```


    If you have multiple sources in your config file, you can fine tune which ones
    are enabled with the -C switch and listing the descriptions you included in the
    config file.


    ```

    -p, --port <port>

    TCPIP server port for stream connections

    ```


    Due to firewalls or other restrictions, you may need to specify an alternate port
    to serve up connections from on the drone. If you do so, you''ll have to adjust
    the source= line on your server system to connect to the new port.


    ```

    -a, --allowed-hosts <hosts> Comma separated list of hosts allowed to connect

    ```


    To add a host to allow connections from temporarily, use the -a switch and the
    IP address.


    ```

    -b, --bind-address <address>

    Bind to this address. Default: INADDR_ANY.

    ```


    On multi-homed systems the drone defaults to accepting connections from any configured
    address. If you want to restrict connections to one address, use the -b switch.


    ```

    -s, --silent

    Don''t send any output to console.

    ```


    Particularly useful in testing is to suppress output from the drone when it runs.


    ```

    -N, --server-name

    Server name

    ```


    For organizational purposes, you can change the server''s name. This doesn''t
    show up anywhere major with drones, so no need to worry about it.


    ```

    -v, --version

    Kismet version

    ```


    -v outputs the version of the kismet_drone


    ```

    -h, --help

    What do you think you''re reading?

    ```


    If you find yourself without this book handy, the -h switch will show you the
    options available.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Summary


    Drones have limitations and some quirks. You want to be careful how you set up
    the backhaul to make sure you don’t interfere with normal operations. In most
    situations, you want to backhaul from your drone to the server over a wired network.
    Some people try to send the data from the sniffer back over a wireless, which
    can get you into a great deal of trouble. If you are monitoring the data you are
    backhauling, you’re then capturing it again and broadcasting it back to be sniffed
    again and getting into a very ugly loop that will likely saturate things very
    quickly. Also, if you are monitoring a heavily used wireless network and sending
    the captured data back over the same network, you are effectively doubling the
    amount of data going down the wire. This can be an issue if you are already near
    capacity.


    For the headaches it saves and the extra data you have to deal with, it’s best
    to run the drones over a separate network from what you are monitoring. Be it
    through separate wires or Virtual Local Area Networks (VLANS), this will save
    you a great deal of time and effort.


    Currently, drones are a pull-type connection. When the server starts, it connects
    to all the drones listed as *source*= lines and requests data to be sent, and
    if the drone is functional, it does so. The current architecture of Kismet does
    not support dynamically adding sources beyond the startup of the server. This
    means that if a drone goes down, you have to restart the whole server to bring
    it back up. This is being addressed in kismet-newcore but for now, if something
    downs a drone, it takes a server restart to bring it back online.


    Drones can be a very cheap and efficient way of extending your view of the network
    into the RF layer and to see beyond just TCP/IP packets and see what is going
    on in the lower layers of the stack at remote locations. Drones can be nearly
    any type of system that runs Linux, has a backhaul method, and a compatible wireless
    device. Some devices have their own quirks and issues. A bit of research and development
    will save you some headaches and hopefully some money.'
  merge: -1
  img_proc: true
