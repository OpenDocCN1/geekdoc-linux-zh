- pgno: 127
  md: '```

    # srcname * indicates “all sources”. Individual source options can be turned

    # off with “no”, ie “noweakvalidate”. Some sources may have special options.

    # sourceopts=demo:fuzzcrypt,weakvalidate

    # sourceopts=demo2:nofuzzcrypt

    ```


    Sources can have special parameters for what type of data to collect. If we have
    multiple sources, you can specify some sources to collect all data, and others
    to ignore some. For the most part, it’s not necessary to change any of these as
    each driver is unique and there is no way to tell what options are available to
    change.


    ```

    # Comma-separated list of sources to enable. This is only needed if you defined

    # multiple sources and only want to enable some of them. By default, all defined

    # sources are enabled.

    # For example:

    # enableSources=primsour, ciscoSource

    ```


    This is a very useful parameter for multi-source installations, or for situations
    where you use different cards for different types of detection. Define all your
    potential sources (different cards, or configurations of cards) above in the `source=`
    lines and depending on the logical names you specify for each source, you can
    toggle them here by either editing the `enableSource=` line or setting up multiple
    lines with different combinations of cards and commenting out with a `#` at the
    start of the lines you don’t need. Remember that only one `enableSources=` line
    should be uncommented at once.


    For example, if you had a configuration for wardriving with two cards, you could
    have a line that says `“enableSources=enginius1,enginius2”` and another one for
    direction finding as `“enableSources=proxim.”` This becomes particularly useful
    when dealing with large numbers of drones. You can enable and disable groups very
    quickly and easily by setting up multiple lines and just commenting and uncommenting
    different ones.


    ```

    # Automatically destroy VAPs on multi-vap interfaces (like madwifi-ng).

    # Madwifi-ng doesn’t work in rfmon when non-rfmon VAPs are present, however

    # this is a fairly invasive change to the system so it CAN be disabled. Expect

    # things not to work in most cases if you do disable it, however.

    vapdestroy=true

    ```


    Some WiFi drivers create Virtual interfaces, VAP’s, off a parent device for different
    functions. Madwifi-ng is the most common of these. With Madwifi-ng, the parent
    device is typically called something like wifi0 and all VAP’s are named ath0,
    ath1, and so forth, depending on the specifics of the card. You can have a single
    card operating'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'in multiple modes simultaneously, however that doesn''t mean they work properly.
    Madwifi-ng in particular has great problems operating with one VAP in monitor
    mode and channel hopping when there''s another VAP trying to connect and/or stay
    connected to a network.


    Setting vapdestroy=true tells Kismet that if there is a parent/virtual device
    driver in use, destroy all the VAP''s and create an interface for Kismet in monitor
    mode. If you have some reason for needing those other VAP''s, you''ll have to
    create the monitor mode interface manually. Don''t be surprised if things like
    monitor mode and channel hopping don''t get along with other VAP''s present. If
    in doubt, enable it and let Kismet sort out the interfaces.


    ```

    ```

    # Do we channel-hop?

    channelhop=true

    ```

    ```


    This is fairly obvious. It specifies whether or not to invoke the channel-hopping
    sections (if channel hopping is possible on the source). Set to `channelhop=false`
    if you want to lock to a specific channel. This will have the source card scan
    the channel it is on when Kismet is started, or the channel specified in the optional
    initial source parameter on the source= line for that source.


    ```

    ```

    # How many channels per second do we hop? (1-10)

    channelvelocity=5

    ```

    ```


    You can tweak the speed at which you hop channels. This is mostly something you
    have to fine tune yourself. If you hop slow, it takes longer to get through all
    the channels. If you hop fast, there''s the chance you could miss something. Generally,
    if you''re wadriveriving or traveling fast, you want to hop fast. If you''re on
    foot or can take the time to be thorough, you can hop slow. If you are traveling
    fast and only in range of an access point (AP) for a split second, you want to
    scan through as many channels as you can to hopefully be on the correct channel
    when you''re in range. If you''re on foot or moving slow as you would be for rogue
    hunting, you can take your time and make sure to check channels. Default is 5,
    but might need to be tweaked depending on your situation and preference.


    ```

    ```

    # By setting the dwell time for channel hopping we override the channelvelocity

    # setting above and dwell on each channel for the given number of seconds.

    # channeldwell=10

    ```

    ```


    This setting overrides the channel velocity setting and specifies that, rather
    than a certain number of channels per second, Kismet should spend a certain amount
    of'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'time on each channel. This is a more useful setting for static installations
    and drones. This way you can thoroughly inspect each channel. It''s up to you
    to determine which works for you to make the most of your time and coverage. Increments
    of 1 second can be adjusted.


    ```

    # Do we split channels between cards on the same spectrum? This means if

    # multiple 802.11b capture sources are defined, they will be offset to cover

    # the most possible spectrum at a given time. This also controls splitting

    # fine-tuned sourcechannels lines which cover multiple interfaces (see below)

    channelsplit=true

    ```


    Channel splitting enables Kismet to cover more spectrums at any given time when
    multiple sources are in use. If you have two cards, both hopping, Kismet will
    make sure that they are both always on different channels at any given time. If
    card 1 is on channel 5, card 2 is on a channel other than 5, maximizing the covered
    spectrum. This is especially useful for situations of several cards, where having
    all of them on one channel makes little or no sense. If you are using several
    drones or other situations where you need blanket coverage of a channel across
    several locations, consider disabling this.


    ```

    # Basic channel hopping control:

    # These define the channels the cards hop through for various frequency ranges

    # supported by Kismet. More finegrain control is available via the

    # “sourcechannels” configuration option.

    #

    # Don''t change the IEEE80211<x> identifiers or channel hopping won''t work.

    # Users outside the US might want to use this list:

    # defaultchannels=IEEE80211b:1,7,13,2,8,3,14,9,4,10,5,11,6,12

    defaultchannels=IEEE80211b:1,6,11,2,7,3,8,4,9,5,10


    # 802.11g uses the same channels as 802.11b...

    defaultchannels=IEEE80211g:1,6,11,2,7,3,8,4,9,5,10


    # 802.11a channels are non-overlapping so sequential is fine. You may want to

    # adjust the list depending on the channels your card actually supports.

    # defaultchannels=IEEE80211a:36,40,44,48,52,56,60,64,100,104,116,120,124,

    # 128,132,136,140,149,153,157,161,184,188,192,196,200,204,208,212,216

    ```


    Here you can specify what channels, by default, a source should hop through. More
    fine control is available in the *sourcechannels* line later on, we are just specifying
    the channels that are possible here.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Note


    This setting also allows you to set the channels for your regulatory domain. By
    default, it is set up for the North American regulator domain, which is for channels
    1–11, but not all users are in the North American regulatory domain and can use
    more or less channels. This is also where you can hack things a bit. If your card
    supports all 14 channels, or more than your regulatory domain allows, you can
    specify all the possible channels, even the ones not technically allowed in your
    regulatory domain. Check your local laws before doing this, however.


    Since we are not transmitting in Kismet it shouldn’t be a problem (check your
    local laws) to listen to see if someone has set up a rogue AP on channels not
    normally used or allowed, to try and avoid detection. Please don’t abuse this
    as the regulations are there for a reason.


    ```

    ```

    # Combo cards like Atheros use both ''a'' and ''b/g'' channels. Of course, you

    # can also explicitly override a given source. You can use the script

    # extras/listchan.pl to extract all the channels your card supports.

    defaultchannels=IEEE80211ab1:1,6,11,2,7,3,8,4,9,5,10,36,40,44,48,52,56,60,64

    ```

    ```


    You can also specify channels to be covered by a/b/g combo cards if you happen
    to have one. The *listchan.pl* script in the extras directory of the install package
    will poll your card(s) to see what channels are supported. A useful thing to see
    if your card is capable of more than you thought it was.


    ```

    ```

    # Fine-tuning channel hopping control:

    # The sourcechannels option can be used to set the channel hopping for

    # specific interfaces, and to control what interfaces share a list of

    # channels for split hopping. This can also be used to easily lock

    # one card on a single channel while hopping with other cards.

    # Any card without a sourcechannel definition will use the standard hopping

    # list.

    #

    sourcechannels=sourcename(,sourcename):ch1,ch2,ch3,...,chN

    #

    # ie, for us channels on the source ‘prism2source’ (same as normal channel

    # hopping behavior):

    # sourcechannels=prism2source:1,6,11,2,7,3,8,4,9,5,10

    ```

    ```


    This parameter is where you can fine-tune the channel hopping. In the *defaultchannels*
    parameter, we specified what channels were available, now we can specify which
    ones we specifically want to listen on and what order to sequence through.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Notes from the Underground


    # Hack


    There is a very cool hack possible here. For b/g networks, channels 1, 6, and
    11 are statistically the most popular since they don''t overlap. If we have one
    card, it makes no sense to spend only 8/11th''s of our time on channels less likely
    to have something on them. You can specify channels more than once and the sequence
    will loop back to the beginning when done. So if you specify channels 1, 6, and
    11 more than once, you''ll end up spending more time there overall and even out
    your distribution of channels.


    ```

    sourcechannels=prism2source:1,6,11,2,7,1,6,11,3,8,1,6,11,4,9,1,6,11,5,10

    ```


    With the above line we are spending 6/10th''s of our time checking the most popular
    channels. You can tweak this distribution to your liking, but it has been tested
    and tends to work for high-speed scanning such as highway speed wardriving. You
    can also specify additional channels such as 12–14 if your card supports it and
    add those to the mix.


    You can do the same for 802.11a channels. Either adding them to the mix of b/g
    channels if you have an a/b/g card or just the 802.11a channels f you have a single
    mode card.


    ```

    # Given two capture sources, "prism2a" and "prism2b", we want prism2a to stay

    # on channel 6 and prism2b to hop normally. By not setting a sourcechannels

    # line for prism2b, it will use the standard hopping.

    # sourcechannels=prism2a:6

    ```


    If you don''t specify a sourcechannels parameter and channelhop=true, the system
    will automatically hop through the default channels. If you have multiple sources,
    you can have a specific sourcechannels for one device and have it monitor a few
    specific channels, while the other one checks the remainder. This is effective
    with wardriving. One source spends all it''s time checking 1, 6, and 11 where
    there are most likely going to be signals, and the other can check the remaining
    channels.


    You can also use this to break up the workload across multiple sources. Once card
    can do the lower channels, the other the higher channels, and be able to sequence
    through everything much faster than a single card.


    ![](img/d6ac176c353d2b7687c1186a140180a1_131_0.png)


    ![](img/d6ac176c353d2b7687c1186a140180a1_131_1.png)'
