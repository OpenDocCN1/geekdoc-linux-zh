- pgno: 93
  md: '# Figure 4.3 Kismet''s Main Display


    ![](img/d6ac176c353d2b7687c1186a140180a1_93_0.png)


    The display is divided into three panels: the network list panel, the information
    panel, and the status panel.


    # Network List Panel


    The primary source of information on Kismet’s main display is the network list
    panel (see Figure 4.4). This panel consumes a considerable amount of screen space,
    and desires to strike a balance between displaying as many networks as possible,
    while still providing valuable information about each of those individual networks.
    In this section, we’ll discuss the various options to sort networks as well as
    the default columns and colors displayed by Kismet in the network list panel,
    and how they provide information to users.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Figure 4.4 Netwrok List Panel


    ![](img/d6ac176c353d2b7687c1186a140180a1_94_0.png)


    # Sorting


    As you will note in Figure 4.4, Kismet’s default sorting mode is known as *autofit*.
    The goal of autofit is to display as many currently active networks as possible.
    While using autofit, network selection, tagging, grouping, scrolling, and so forth
    is disabled. To use any of these features, simply sort the network list by another
    method. To bring up the sort options, simply press s (see Figure 4.5).


    # Figure 4.5 Sort Options


    ![](img/d6ac176c353d2b7687c1186a140180a1_94_1.png)'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'The sort options displayed in Figure 4.5 are self-explanatory; although, as
    previously explained, you''ll need to choose something other than autofit to do
    anything useful. Service Sent Identifier (SSID) is common, and displayed in Figure
    4.6:


    # **Figure 4.6 Networks Sorted by SSID**


    ![](img/d6ac176c353d2b7687c1186a140180a1_95_0.png)


    Sorting also gives you a cursor-enabled selection bar that indicates which network
    is currently highlighted. Note in Figure 4.6, that the sort is ascending by default.
    In the case of first time seen, latest seen, Basic Service Sent Identifier (BSSID),
    SSID, and packet count, the capital letter equivalent (S rather than s) is a descending
    sort.


    # ### Columns


    Kismet supports in excess of 20 column descriptions, although only the nine listed
    below are displayed by default (see “Customizing the Panels Interface” below for
    more information). Kismet will display as many columns as it can within the space
    provided.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/d6ac176c353d2b7687c1186a140180a1_96_0.png)


    If the Kismet window isn’t big enough to display all of the columns, simply use
    the left and right arrow keys to scroll in the appropriate direction.


    # Decay


    The first column is decay, although it has no header and may not be immediately
    obvious. Decay is a measure of network activity and the amount of time passed,
    and is controlled by the decay variable in the kismet_ui.conf file. The default
    setting is three seconds:


    +   * **Active** If the network is active within the decay time, an exclamation
    point “!” is displayed prior to the network name.

    +   * **Recent** If the network was active within two periods of the decay time
    (i.e., six seconds), a period “.” is displayed prior to the network name. See
    the “WOPR” network in Figure 4.4 for an example.

    +   * **Inactive** In all other cases (i.e., the network has not been active within
    six seconds), nothing is displayed.


    # Name


    The network name is the most prominent column in the network list display. Typically,
    this lists the SSID, although you can change the name of any particular network
    with the “n” pop-up window. If a network is not broadcasting the SSID, Kismet
    can still infer its presence and will publish the network as <No ssid> until it
    can determine the name.


    # Type


    The T column specifies the type of network:


    +   * **A (Access Point)** A wireless access point (AP) or wireless router; by
    far the most common network type

    +   * **D (Data Network)** Data packets have been seen, but Kismet has not captured
    any beacons or management frames and thus cannot yet tell what kind of network
    it is'
  merge: -1
  img_proc: true
- pgno: 97
  md: '+   - **G (Group)** Networks that have been manually grouped together by the
    user (*t* to tag networks, *g* to group tagged networks together)

    +   - **H (Ad-hoc)** Typically a wireless network set up between multiple laptops
    or clients without using an AP

    +   - **P (Probe Request)** A client probing for an AP that has not yet associated

    +   - **T (Turbocell)** Turbocell//Karlmet/Lucent router (uncommon)


    # WEP


    The W column denotes whether or not encryption is being used on the network. However,
    it is more relevant to ask the question, “is *WEP being used, or something else?*”
    to understand the possible responses:


    +   - **Y (Yes)** Wireless Encryption Protocol (WEP) is in use

    +   - **N (No)** The network is not encrypted

    +   - **O (Other)** The network is encrypted with something other than WEP (for
    example, WPA)


    # Channel


    The channel of the network is displayed in the C column:


    +   - For the more common 802.11b//g networks, the associated channels are 1-11
    in the United States and 1-14 outside the United States.

    +   - For 802.11a, the following are allowable channels with the United States:
    36, 40, 44, 48, 52, 56, 60, 64, 149, 153, 157, 161, and 165. Outside of the United
    States, particularly in Europe and Japan, more channels are available.


    # Packets


    “Packets” is simply a cumulative total of packets captured for that particular
    network.


    # Flags


    The Flags column displays brief information about the network:


    +   - **F (Factory Configuration)** The bells should be going off in your head;
    this user has not changed anything from the original factory configuration'
  merge: -1
  img_proc: true
- pgno: 98
  md: '+   ■ **W (WEP Decrypted)** This is a WEP-encrypted network that has been decrypted
    with a user-supplied key


    If Kismet can determine the address range and Internet Protocol (IP), it will
    display in the Flags column the method by which it obtained this information:


    +   ■ **T (TCP)** The address range was determined via Transmission Control Protocol
    (TCP) traffic


    +   ■ **U (UDP)** The address range was determine via User Datagram Protocol (UDP)
    traffic


    +   ■ **A (ARP)** The address range was determined via Address Resolution Protocol
    (ARP) traffic


    +   ■ **D (DHC P)** The address range was determined via Dynamic Host Configuration
    Protocol (DHC P) traffic


    In addition, the T, U, and A flags may display a number (1–4), which indicates
    the number of octets discovered. For example, referring again to Figure 4.4, the
    linksys network displays the A4 flags, indicating that the address was discovered
    using ARP traffic, and all four octets have been discovered.


    # IP


    By monitoring traffic, Kismet attempts to determine the IP address of the network,
    and this is displayed in the “IP Range” column. Kismet will display 0.0.0.0 until
    it finds some useful data via one of the methods described in the Flags section
    above. As you might suspect, more traffic collected from a particular network
    will provide a greater likelihood of finding the IP range, and more particularly,
    the exact IP address.


    # Size


    The size column displays the total size of all the packets collected for that
    particular network.


    # Colors


    While it is not accurately reproduced in a grayscale screenshot, the Kismet interface
    also displays to the shrewd observer, some valuable information by color-coding
    the networks:'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   * **Networks in yellow** are not encrypted, meaning they are not using
    WEP or WPA. While these networks are coded as unencrypted, they still may be using
    a Virtual Private Network (VPN) or some other form of authentication after associating
    with the network. Yellow networks also indicate that at least some settings have
    been changed from their factory defaults.


    +   * **The red** color code is the signature of a network that is using the factory
    defaults. You may also see the F flag with this network. If the user hasn''t changed
    the factory configuration, you just might find that they haven''t changed the
    default password either!


    +   * **Networks in green** are using some form of encryption, usually either
    WEP or WPA. If Kismet cannot determine between the two, the Kismet .dump file
    can be imported into Wireshark, and the exact form of encryption determined there.


    +   * **Blue** networks are using SSID cloaking or are not broadcasting the SSID.
    An active scanner such as Network Stumbler (for Windows), which relies on the
    broadcast frame to determine the SSID, would not be able to locate this network.


    # GPS


    When a supported Global Positioning System (GPS) is used together with Kismet,
    the applicable GPS data will be displayed along the bottom edge of the network
    list panel (see Figure 4.7).


    Figure 4.7 GPS Status Information


    ![](img/d6ac176c353d2b7687c1186a140180a1_99_0.png)


    As is typical of coordinates without north/south/east/west labels, positive latitudes
    indicate north, while negative latitudes indicate south. Likewise, positive longitudes
    indicate the eastern hemisphere, while negative longitudes indicate the western.
    In Figure 4.7, our coordinates are north of the equator, and in the western hemisphere
    (central Maryland to be more precise). Also included is a measure of altitude,
    speed, heading, and quality of fix.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# # Information Panel


    The information panel labeled as “Info” is a small vertical panel to the right
    of the network list panel (see Figure 4.8).


    +   - **Ntwrk** Total number of collected networks

    +   - **Pckets** Total number of collected packets

    +   - **Cryptd** Total number of collected packets that were encrypted

    +   - **Weak** Total number of weak packets collected

    +   - **Noise** Worthless garbage packets

    +   - **Discrd** Total number of discarded packets; includes noise and packets
    discarded from the use of filters

    +   - **Pkts/s** Rate of packet collection (per second)

    +   - **Elapsd** Total time (HH:MM:SS) since the Kismet was started


    **Figure 4.8 Info Panel**


    ![](img/d6ac176c353d2b7687c1186a140180a1_100_0.png)


    # # Status Panel


    The status panel occupies the bottom section of the Kismet interface (see Figure
    4.9). The status panel provides scrolling messages to the user:'
  merge: -1
  img_proc: true
- pgno: 101
  md: '+   ■ **Updates** Kismet will post a message to the status panel when it finds
    a new network, and provide additional information about networks when it becomes
    available


    +   ■ **Problems** Kismet will alert you to information regarding potential problems
    with Kismet’s connection to other services; for example, if Kismet cannot connect
    to gpsd


    +   ■ **Alerts** These are primarily useful when using Kismet as an intrusion
    detection system (IDS); provides integration with third-party systems (i.e., Snort)


    +   ■ **Battery Meter** Kismet will indicate if you are plugged into external
    power (AC), and display the percentage of battery life remaining; when using the
    battery Kismet will display an estimate of how much life is left. Keep in mind
    that you’ll need an APM-enabled kernel for battery life to report correct estimates.


    # NOTE


    > Even though Kismet places your wireless adapter in rfmon mode (meaning it does
    not transmit), simply having your wireless adapter radio on consumes more power
    from your battery. It is estimated that your battery life will be somewhere between
    2–7 percent shorter. While this is not necessarily a hugely significant amount,
    it makes the battery meter all the more useful.


    # Figure 4.9 Status Panel


    ![](img/d6ac176c353d2b7687c1186a140180a1_101_0.png)


    # # Pop-up Windows


    All of Kismet’s windows beyond the main display are secondary displays or pop-up
    windows. These exist primarily as a means of displaying further information on
    a particular network, group, or client; providing statistics and useful information
    regarding packet rates and types; and other interesting data.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Network Details


    The network details window displays the most comprehensive and detailed information
    collected about a particular network. When sorting by any mode other than auto
    fit, simply scroll to the network of your choice and press **enter** or **i**
    (see Figure 4.10).


    The network details window is useful if you need more information then is already
    provided in the network list. For example, the network list may show a particular
    network with the WEP flag "O" which signifies the network is encrypted, but with
    something other than WEP. Under some circumstances, Kismet''s network details
    may be able to tell you specifically what type of encryption is being used. Be
    sure to scroll down as there is likely to be more than one screen of information.


    ![](img/d6ac176c353d2b7687c1186a140180a1_102_0.png)


    From the network details window, **n** will move you to the next network or group,
    while **p** will return you to the previous network or group. Alternately, you
    can close the pop-up (**q**) and scroll to a different network. The network details
    window is one means of getting to the client list (**c**); you can also type (**c**)
    directly from the network list.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# # Cliënt List


    The cliënt list window is very similar in both display and functionality to the
    network list panel. The default sort mode is also autofit, and the cliënt list
    can be sorted in a similar manner.


    # Figure 4.11 Cliënt List Window


    ![](img/d6ac176c353d2b7687c1186a140180a1_103_0.png)


    The **n** and **p** keys display the cliënt list of the next and previous network
    or group, respectively. Once a particular cliënt is highlighted, the **i** key
    (or pressing **enter**) changes to the cliënt details display.


    # ## Columns


    The following columns are displayed by default (again, as with the network list
    panel, see “Customizing the Panels Interface” later on in this chapter for changing
    the defaults):


    # *Decay*


    The decay variable for a cliënt is the same as it is for a network. As with the
    network list panel, the column is unlabeled and unseen unless a cliënt is active
    or recent.'
  merge: -1
  img_proc: true
- pgno: 104
  md: "# Type\n\nThe T column denotes the type of client. The client types are as\
    \ follows:\n\n+   - F (From DS) From a wireless distribution system (WDS) or AP\
    \ to a wireless client; normally this means the client is wired\n+   - T (To DS)\
    \ To a WDS/AP from a wireless client; normally this means the client is wireless\n\
    +   - I (Intra DS) A node of the WDS/AP communicating to another node within the\
    \ system\n+   - E (Established) Most often a wireless client entering and leaving\
    \ the WDS/AP\n+   - S (Sent To) A client that has received data but not yet responded\n\
    +   - (Unknown) Self-explanatory\n\n# Manufacturer\n\nThe “Manuf” displays the\
    \ manufacturer of the client based on the first three octets of the Media Access\
    \ Control (MAC) address, which is known as the Organizationally Unique Identifier\
    \ (OUI). As the name suggests, each manufacturer is assigned a specific block\
    \ of octets that designate their equipment. Kismet attempts to match the client\
    \ MAC with a list of OUIs in the client\\_manuf file. If a match is made, the\
    \ manufacturer will be shown; otherwise unknown will be displayed.\n\n> **NOTE**\
    \  \n> In some cases, Kismet may also be able to fingerprint the fourth octet\
    \ of the MAC address, which is the first octet of the Network Interface Control\
    \ (NIC)-specific portion of the MAC address. In this case, potentially more detailed\
    \ information about a specific wireless adapter may be learned, such as the exact\
    \ model of the particular device. In other cases, especially newer or rare equipment,\
    \ Kismet may return unknown because it simply doesn’t know the MAC address. Likewise,\
    \ a spoofed MAC address will fool Kismet as to the original manufacturer."
  merge: -1
  img_proc: true
- pgno: 105
  md: '# TIP


    Kismet''s ap_manuf and client_manuf files are intentionally small to reduce memory
    use and Central Processing Unit (CPU) consumption. For those users that desire
    to use the full Institute of Electrical & Electronics Engineers, Inc. (IEEE) OUI
    list, Kismet provides a script (in the extras directory) called ieee-manufr-tr.sh,
    which will convert the OUI text file into a Kismet readable format. Of course,
    this will result in increased memory and CPU usage.


    # Data


    This column displays the total number of data packets transferred by the client.


    # Crypt


    The “Crypt” column displays the total number of encrypted packets transferred
    by the client.


    # Size


    Size displays the total amount of data transferred by the client.


    # IP Range


    “IP Range” displays the last known IP address of the client.


    # Sgn


    The “Sgn” column displays the most recent signal strength of the client. As with
    all other issues related to signal strength, the accuracy of this data is entirely
    dependent upon the proper reporting of the data by the driver and/or firmware
    of the wireless adapter you''re using. To reiterate: if your card and/or driver
    does not support proper signal reporting, this value is useless.


    # Client Details


    In the same way that the network details window shows the comprehensive collection
    of details about a particular network, the client details provides the same level
    of data for a particular client. Figure 4.12 provides an example of the level
    of client detail. Notice the client type is now a little clearer. This particular
    client is “From DS” or from the AP to a wireless client. As we know, these clients
    are typically wired. In fact, in this particular case, this client is the AP itself.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Figure 4.12 Client Details Window


    ![](img/d6ac176c353d2b7687c1186a140180a1_106_0.png)


    The **n** and **p** keys display the details of the next and previous client,
    respectively. Similarly to the network details display, scrolling down will provide
    you with more information.


    # Packet rate


    Kismet’s packet rate window will display a 5-minute history of the packet rate
    per second (see Figure 4.13).'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/d6ac176c353d2b7687c1186a140180a1_107_0.png)


    # Packet Types


    Kismet will also dump the packet type information to the screen (see Figure 4.14).


    ![](img/d6ac176c353d2b7687c1186a140180a1_107_1.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'The packet types panel is divided into two sections: the top displays a history
    of packet types by abbreviation (see the list below), while the bottom displays
    a scrolling list of the most recent packets with more detailed information. By
    default, Kismet will display packet types from all networks. However if you have
    tagged individual networks you can toggle between “all” and “tagged” with the
    a key. The following is a list of the applicable packet types:


    +   - `N` - Noise

    +   - `U` - Unknown

    +   - `Mx` - Management frame

    +       - `Ma` - Association request

    +       - `MA` - Association response

    +       - `Mr` - Reassociation request

    +       - `MR` - Reassociation response

    +       - `Mp` - Probe request

    +       - `MP` - Probe response

    +       - `MB` - Beacon

    +       - `MM` - ATIM

    +       - `MD` - Disassociation

    +       - `Mt` - Authentication

    +       - `MT` - Deauthentication

    +       - `M?` - Unknown management frame

    +   - `Px` - Physical frame

    +       - `Pt` - Request to send

    +       - `PT` - Clear to send

    +       - `PA` - Data Ack

    +       - `Pc` - CF End

    +       - `PC` - CF End+Ack

    +       - `P?` - Unknown phy frame

    +       - `Dx` - Data frame

    +       - `DD` - Data frame

    +       - `Dc` - Data+CF+Ack

    +       - `Dp` - Data+CF+Poll

    +       - `DP` - Data+CF+Ack+Poll

    +       - `DN` - Data Null

    +       - `Da` - CF Ack

    +       - `DA` - CF Ack+Poll

    +       - `D?` - Unknown data frame'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Statistics


    Kismet will display overall statistics that include the time you started the program,
    how many servers are currently running, the number of networks (broken down into
    encrypted and default), total number of packets seen, and maximum packet rate.


    In addition, Kismet provides both a graph and chart, which display channel usage
    information. See Figure 4.15 for the statistics window.


    # Figure 4.15 Statistics Display


    ![](img/d6ac176c353d2b7687c1186a140180a1_109_0.png)


    # Wireless Card Power


    The 1 key will display signal power as well as report rise (see Figure 4.16).
    The name of this display is a bit of a misnomer, because it is not reporting the
    power of your wireless card; rather it is reporting the signal strength of the
    particular network or client. Remember that Kismet places your wireless card in
    rfmon mode, therefore your card is precluded from transmitting while Kismet is
    running.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# WARNING


    Kismet does not calculate signal power or noise; rather it simply displays information
    provided by the wireless card driver and/or firmware. Some drivers or firmware
    may not report this information (especially while in rfmon mode), and in this
    case Kismet will not provide you with anything useful. Furthermore, even when
    cards do properly report this data, there is no consistency in terms of a scale,
    so comparing signal and noise levels among different cards is more or less useless.


    # Figure 4.16 Wireless Card Power Display


    ![](img/d6ac176c353d2b7687c1186a140180a1_110_0.png)


    # Network Location


    Kismet has a nice (and not very well known) feature that will attempt to geo-locate
    a network. The accuracy of this information is wholly dependent upon GPS location
    data. Since estimating range based upon non-existent signal and noise standards
    is virtually impossible, this data is (unfortunately) not very useful in geo-location.
    Rather Kismet will guess location based upon a sample of GPS-logged locations.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Furthermore, Kismet does this on the fly; therefore it is advantageous to get
    sample data from a variety of locations to get a better guess. See Figure 4.17
    for an example of the network location feature.


    # Figure 4.17 Network Location Display


    ![](img/d6ac176c353d2b7687c1186a140180a1_111_0.png)


    Essentially, network location compares the location of where you were versus where
    you are now. This also assumes that your laptop is facing the direction of travel.


    # Customizing the Panels Interface


    As has already been noted, Kismet can display a wealth of information about a
    network or client on the network and client lists (respectively), the only limitation
    being size. Should you find your work requires additional information not be available
    to you from one of these two displays, you can easily modify Kismet’s user interface
    configuration file to add or remove columns. Also, Kismet provides the ability
    to change colors to suit your needs.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# # Customizing the Network List Window


    As we have seen, Kismet’s main display contains a significant amount of useful
    information in the network list section. All of the information for a particular
    net-work is available in the network details window. Any or all of this information
    can be displayed in the main window by modifying the `kismet_ui.conf` file. The
    recognized columns, and their appropriate descriptions, are as follows (default
    columns are **bold**):


    +   - bssid: BSSID (MAC address) of the network

    +   - **channel**: Last-advertised channel for network

    +   - **clients**: Number of clients (unique MACs) seen on network

    +   - crypt: Number of encrypted packets

    +   - **data**: Number of data packets

    +   - decay: Displays ‘/’ or ‘.’ or blank, based on network activity in the last
    ‘decay’ seconds (controlled by the ‘decay’ variable in the config file)

    +   - **duplicate**: Number of packets with duplicate IVs seen

    +   - flags: Network status flags (Address size, decrypted, etc)

    +   - info: Extra AP info included by some manufacturers

    +   - **ip**: Detected/guessed IP of the network

    +   - llc: Number of LLC packets

    +   - manuf: Manufacturer, if matched

    +   - maxrate: Maximum supported rate as advertised by AP

    +   - **name**: Name of the network or group

    +   - noise: Last seen noise level

    +   - **packets**: Total number of packets

    +   - shortname: Shortened name of the network or group for small displays

    +   - shortssid: Shortened SSID for small displays

    +   - **signal**: Last seen signal level

    +   - signalbar: Graphical representation of signal strength

    +   - snrbar: Graphical representation of signal-to-noise ratio

    +   - **size**: Amount of data transferred on network

    +   - ssid: SSID/ESSID of the network or group

    +   - **type**: Network type (Probe, Adhoc, Infra, etc)

    +   - **weak**: Number of packets which appear to have weak IVs

    +   - **wep**: WEP status (does network indicate it uses WEP)


    To modify the default columns in the main window, edit the `kismet_ui.conf` file
    at the following location:


    ```

    # What columns do we display? Comma seperated.  Read the documentation for what

    # columns are valid.

    columns=decay,name,type,wep,channel,packets,flags,ip,size

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Figure 4.18 shows a modified network list panel showing network name, manufacturer,
    total number of data packets by network, signal and noise information, and amount
    of data transfered per network.


    # Figure 4.18 Modified Network List Window


    ![](img/d6ac176c353d2b7687c1186a140180a1_113_0.png)


    # Customizing the Client List Window


    Similarly, the columns in the client window can be modified (all are on by default
    except “maxrate”):


    |   | Number of encrypted data packets transferred by client |   |'
  merge: -1
  img_proc: true
- pgno: 114
  md: '+   noise Last seen noise level of client

    +   signal Last seen signal level of client

    +   size Amount of data transferred by client

    +   type Type of client (Established, To-DS, From-DS, etc)

    +   weak Number of packets which appear to have weak IVs


    To modify the default columns in the client window, edit the *kismet_ui.conf*
    file at the following location:


    ```

    # What columns do we display for clients? Comma seperated.

    clientcolumns=decay,type,mac,manuf,data,crypt,size,ip,signal,quality,noise

    ```


    # Customizing Colors


    Kismet''s colors can be turned on or off, the background and border colors can
    be changed, and the default colors listed above can be changed by modifying the
    applicable portion of *kismet_ui.conf*:


    ```

    # Colors (front, back) of text in the panel front. Valid colors are:

    # black, red, yellow, green, blue, magenta, cyan, white

    # optionally prefixed with "hi-" for bold/bright colors, ie

    # hi-red, hi-yellow, hi-green, etc.

    # Enable colors?

    color=true

    # Background

    backgroundcolor=black

    # Default text

    textcolor=white

    # Window borders

    bordercolor=green

    # Titles

    titlecolor=hi-white

    # GPS and APM info

    monitorcolor=hi-white

    # WEP network color

    wepcolor=hi-green

    # Factory network color

    factorycolor=hi-red

    # Open color

    opencolor=hi-yellow

    # Declkared network color

    cloakcolor=hi-blue

    ```'
  merge: -1
  img_proc: true
- pgno: 115
  md: "# Third Party Front-ends\n\nWhile the large majority of this chapter has focused\
    \ on Kismet’s native panels interface, there are a number of third-party interfaces\
    \ that have been developed over the years. These third-party front-ends are designed\
    \ primarily as a way of enhancing the look or changing the interface from an ncurses/panel\
    \ one to a truly graphical one. This section is not meant to be an exhaustive\
    \ review of such graphical user interfaces (GUIs), but rather a brief survey of\
    \ some of the options that are available.\n\n> NOTE  \n> It is important to note\
    \ that these third-party front-ends are simply replacements for the Kismet client\
    \ (interface), and don’t actually do anything by themselves. They still require\
    \ you to run Kismet in server mode and connect to it with the particular interface\
    \ of your choice.\n\n# gkismet\n\nOne example of a popular Linux-based Kismet\
    \ front end is gkismet (see Figure 4.19). The gkismet interface is designed to\
    \ supplement or replace the native Kismet panels interface for those that prefer\
    \ something more GUI-based. Many of the same features are available, and development\
    \ is ongoing to remain compatible with the latest version of Kismet. For more\
    \ information about gkismet, see http://gkismet.sourceforge.net/."
  merge: -1
  img_proc: true
- pgno: 116
  md: '# **Figure 4.19 gkismet**


    ![](img/d6ac176c353d2b7687c1186a140180a1_116_0.png)


    # **KisWin**


    *KisWin* (not to be confused with RenderMan''s Kismet for Windows package also
    known as KisWin, and located at [http://www.renderlab.net/projects/wrt54g/](http://www.renderlab.net/projects/wrt54g/))
