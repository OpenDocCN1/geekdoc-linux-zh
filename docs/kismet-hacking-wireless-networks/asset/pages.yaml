    # # Contributing Authors


    Brad ‘RenderMan’ Haines is one of the more visible and vocal members of the wardriving
    community, appearing in various media outlets and speaking at conferences several
    times a year. Render is usually near by on any wardriving and wireless security
    news, often causing it himself. His skills have been learned in the trenches working
    for various IT companies as well as his involvement through the years with the
    hacking community, sometimes to the attention of carious Canadian and American
    intelligence agencies. A firm believer in the hacker ethos and promoting responsible
    hacking and sharing of ideas, he wrote the ‘Stumbler ethic’ for beginning wardrivers
    and greedly enjoys speaking at corporate conferences to dissuade the negative
    image of hackers and wardrivers.


    His work frequently borders on the absurd as his approach is usually one of ignoring
    conventional logic and just doing it. He can be found in Edmonton, Alberta, Canada,
    probably taking something apart.


    Michael J. Scheerer is an active-duty Naval Flight Officer and Electronic Countermeasures
    Officer with the U.S. Navy. He flew combat missions during Operations Enduring
    Freedom, Southern Watch, and Iraqi Freedom. He later took his electronic warfare
    specialty to Iraq, where he embedded on the ground with Army units to lead the
    counter-IED fight. He currently serves as an instructor of Naval Science at the
    Pennsylvania State University Naval Reserve Officer Training Corps Unit, University
    Park, PA.


    Michael is an active member of the Church of WiFi and has spoken at Shmoocon,
    DEFCON, and Penn State’s Security Day, as well as other forums. His work has been
    cited in Forbes, InfoWorld and Wired.


    Michael is an alumnus of Bloomsburg University where he studied Political Science
    and Georgetown University where he obtained his degree in National Security Studies.
    While at Penn State, he is actively involved in IT issues. He is a licensed amateur
    radio operator, moderator of the Church of WiFi and Remote-Exploit Forums, and
    a regular on the DEFCON and NetStumbler forums.'
