- pgno: 59
  md: '# Tools & Traps


    **Advance Packaging Tool**


    One other type of install is worth mentioning here. Some Linux distributions use
    the **Advance Packaging Tool (APT)**, which is designed to greatly simplify the
    installation of software. The most notable of these distributions is Debian and
    its popular derivative, Ubuntu. To install Kismet using APT, the *apt-get* command
    is used. Since the root user is rarely used, the *sudo* command must prefix the
    *apt-get* command, or the user must switch to the root user using the *su* command
    as previously mentioned.


    ```

    sudo apt-get install kismet

    ```


    Running the *apt-get* command in this way will install Kismet in any system using
    the APT, and eliminates having to download and uncompress the source code, and
    then compile and install the program using the *configure*, *make* and *make install*
    commands.


    # Choosing a Wireless Card Driver


    In order to use Kismet, you obviously need to have some wireless information being
    sent to the server portion of the program, which then passes it on to the client.
    Usually this is accomplished by a wireless card talking to the server. What may
    not be quite as obvious is that the wireless card needs a special program called
    a *driver* to allow it to talk to the server program in the first place. For those
    of you who don''t often delve into the realm of hardware, a driver is nothing
    more than a small program that translates low-level electronic signals from a
    particular piece of hardware into information which can be easily used by a higher
    level program or the operating system itself. In this case, the hardware is your
    wireless card and the higher level program is Kismet.


    Since around 2001, when 802.11b wireless equipment became common consumer items,
    the electronics marketplace has exploded with any number of different brands of
    wireless card. Due to this flood of wireless cards, you need to ask the question
    "Which wireless card am I going to use with Kismet?" In order to answer that question,
    we need to look at the available drivers for cards, and make sure that the card
    that we want to use has a driver that will work with Kismet.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'To determine which card will work under Linux and with Kismet, we first need
    to find out what chipset the wireless card is based upon. Chipsets are exactly
    what the name implies, a collection or set of integrated circuit chips that are
    designed to work together and produce a specific end function. In the case of
    wireless cards, most tend to be based on one of several chipsets.


    To confuse matters further, many cards are actually the same unit, made by the
    same manufacturer, but sold under a different brand name label or “badge.” These
    “rebaged” cards will typically use the same driver as the manufacturer named card.
    The real trick in many cases is to figure out which card was made by what manufacturer,
    and then determine what chipset was used to make the card’s hardware.


    Some manufacturers will change chipsets, but will not change model names or numbers.
    Sometimes the manufacturer’s name changes, as in the case of a buy-out or corporate
    takeover, but the model names remain the same.


    Finally, you will need to find out what kernel your particular Linux distro is
    using. The kernel is the core of a given OS. Although many drivers will work with
    most Linux distribution, some drivers will work differently with different Linux
    kernels. For example, with the introduction of kernel version 2.6.13, Linux has
    a new way that the drivers are able to talk to the kernel, called the “hotplug
    mechanism.” Some distros will have kernels below that number, while other distros
    will have that or a higher kernel. Some drivers will work with the hotplug mechanism,
    and some will not.


    For example, version 0.13e-SN-9 of the Orinoco driver works closely with the hotplug
    mechanism, while the version 0.13e-SN-8 does not. Therefore, version 0.13e-SN-9
    should be used with any kernel 2.6.13 or higher, where 0.13e-SN-8 card would need
    to be used with any Linux kernel 2.6.12 or below.


    If you don’t know which kernel you have currently installed, the Linux command
    uname -r will return the kernel version if entered at a CLI. The CLI is usually
    reached by a terminal or console session, or via an alternate login. For example,
    on one of the author’s machines, typing the command uname -r returns the result
    “2.4.33.3,” indicating that the kernel version is 2.4.33.3.


    ```

    uname -r

    2.4.33.3

    ```


    The command uname -a will show all available system information.


    ```

    uname -a

    Linux ghost 2.4.33.3 #1 Fri Sep 1 01:48:52 CDT 2006 i686 pentium3 i386 GNU/Linux

    ```


    For further information, typing uname --help will give a list of all available
    options for the command.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Once you have the kernel version, the next step is to determine the chipset
    used in the card. To help you figure out which cards and chipsets will work with
    some common wireless cards, their chipsets and their drivers are listed in Table
    2.1. If your card isn’t listed here, our suggestion is that you perform a search
    using your favorite World Wide Web (WWW) search engine. For example, if you have
    an ORiNOCO Gold 11b/g Card, you would search for “ORiNOCO gold 11b/g chipset”.
    Adding the words “Linux” and “driver” to the search string may help you find sites
    where you may download a driver that will work with your particular card.


    In addition, the Kismet README file has a list of known drivers and chipsets.
    The README file comes with the source files and is also available as a Web page
    at the http://www.kismetwireless.net Web site.


