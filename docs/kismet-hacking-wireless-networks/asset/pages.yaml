- pgno: 4
  md: '**Frank Thornton** runs his own technology consulting firm, Blackthorn Systems,
    which specializes in wireless networks. His specialties include wireless network
    architecture, design, and implementation, as well as network troubleshooting and
    optimization. An interest in amateur radio helped him bridge the gap between computers
    and wireless networks. Having learned at a young age which end of the soldering
    iron was hot, he has even been known to repair hardware on ocasion. In addition
    to his computer and wireless interests, Frank was a law enforcement officer for
    many years. As a detective and forensics expert he has investigated approximately
    one hundred homicides and thousands of other crime scenes. Combining both professional
    interests, he was a member of the workgroup that established ANSI Standard “ANSI/NIST-CSL
    1-1993 Data Format for the Interchange of Fingerprint Information.” He co-authored
    *RFID Security* (Syngress Publishing, ISBN: 1597490474), *WarDriving: Drive, Detect,
    and Defend:A Guide to Wireless Security* (Syngress, ISBN: 193183603), as well
    as contributed to *IT Ethics Handbook: Right and Wrong for IT Professionals* (Syngress,
    ISBN: 1931836140) and *Game Console Hacking: Xbox, PlayStation, Nintendo, Atari,
    & Gamepark 32* (ISBN: 1931836310). He resides in Vermont with his wife.'
