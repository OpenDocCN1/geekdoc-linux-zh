- pgno: 231
  md: '# IGiGLE


    IGiGLE (Irongeek’s WiGLE WiFi Database to Google Earth Client for Wardrive Mapping)
    is a simple Windows-based interface between the WiGLE database and Google Earth
    (see Figure 9.2). You can query the WiGLE database by zip code or latitude/longitude,
    and IGiGLE will download the data and convert it to .KML format to display in
    Google Earth (see Figure 9.3). You can choose to download all data for all particular
    areas, or just your data. The latter is especially useful if you use the WiGLE
    database as your primary location to store your own Kismet-collected data. IGiGLE
    can be downloaded at http://www.irongeek.com/1/php?page=security/igigle-wigle-wifi-to-google-earth-client-for-wardrive-mapping.


    # Figure 9.2 IGiGLE Interface


    ![](img/d6ac176c353d2b7687c1186a140180a1_231_0.png)'
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/d6ac176c353d2b7687c1186a140180a1_232_0.png)


    # # GpsDrive


    GpsDrive is a navigation system designed to display your GPS position on a zoomable
    map (see Figure 9.4). While it can be used completely independently of Kismet
    as a standalone mapping program, it integrates nicely with Kismet (and MySQL)
    to display Kismet network data on the map. Furthermore, speech output through
    festival is supported (flite also works); so you can even have GpsDrive tell you
    when it finds new networks. If your GPS receiver works with gpsd (or gpsdold),
    it should work with GpsDrive.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Figure 9.4 GpsDrive Homepage


    ![](img/d6ac176c353d2b7687c1186a140180a1_233_0.png)


    # Installation


    Installation of GpsDrive presumes that you have installed BackTrack 3 Beta (or
    another distribution of Linux) to your hard drive. You will also require the following
    packages: gsd, GTK-+2.x (better >=2.2.x), pango, atk, pcre, xadvel (X11 development),
    gettext, librypt, glIBC, gcc >=3.x, and make. In many cases, some or all of these
    packages will already have been installed. In any case, you ought to check beforehand
    to avoid any problems. Finally, GpsDrive requires Structured Query Language (SQL)
    support to interface with Kismet. In the case of BackTrack, MySQL is already installed;
    on other distributions, you may have to do it yourself.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# **WARNING**


    In Debian and Slackware distributions (including BackTrack), GpsDrive will not
    compile correctly without gcc 3.x. Unfortunately, slapt-get does not work correctly
    out of the box in BackTrack 3 Beta, so you’ll have to do a manual upgrade of gcc
    (http://gcc.gnu.org/) and then compile GpsDrive. Alternatively, you could simply
    download a pre-compiled version of GpsDrive.


    # Install from Source


    To install from source, download the source from the GpsDrive Web site (http://www.gpsdrive.de/).
    The current stable version (although old) is v2.09. Then:


    ```

    ```bash

    tar -zxvf gpsdrive-2.09.tar.gz

    cd gpsdrive-2.09

    ./configure

    make

    make install

    ```

    ```


    # **NOTE**


    If you don’t require support for Garmin’s GPS protocol, configure with the --disable-garmin
    argument.


    # Install from Package


    Alternately, you may want to go with a GpsDrive package that is already compiled.
    Depending upon the distribution you’re using, the package installation procedure
    may vary. You can find a Slackware-compatible (and BackTrack-compatible) GpsDrive
    package at http://slackware-current.net/package.php?id=345 (note that this version
    has Garmin’s GPS protocol already compiled into the package). To install (see
    Figure 9.5):


    ```

    ```bash

    installpkg gpsdrive-2.09-i586-1.tgz

    ```

    ```'
