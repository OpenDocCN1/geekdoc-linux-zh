- pgno: 132
  md: '```

    # To assign the same custom hop channel to multiple sources, or to split the

    # same custom hop channel over two sources (if splitchannels is true), list

    # them all on the same sourcechannels line:

    # sourcechannels=prism2a,prism2b,prism2c;1,6,11

    ```


    You can also nest multiple sources in an assigned *sourcechannel*. If *channelsplit=true*,
    Kismet will cycle through the channels, and make sure that no two sources are
    on the same channel at the same time, maximizing the time spent on high-usage
    channels, and making sure not to overlap scanned channels. In the config file
    example, three sources would cycle through each of three channels without overlapping.


    ```

    # Port to serve GUI data

    tcpport=2501

    ```


    Here you can specify what TCP port the server will serve clients on. There should
    be no real reason to change this setting. If you feel the need to change this,
    make sure to make the appropriate change in the *kismet_ui.conf* file.


    ```

    # People allowed to connect, comma separated IP addresses or network/mask

    # blocks. Netmasks can be expressed as dotted quad (/255.255.255.0) or as

    # numbers (/24)

    allowedhosts=127.0.0.1

    ```


    This is where remote monitoring can be set up. By default, for security reasons,
    only the host running the server can connect a client (localhost). If you want
    to use the Kismet client on another system and connect to a remote server, you
    need to specify the network address of the host that will be connecting to the
    server. This is accomplished by appending it to the existing line with a comma
    and no space.

    `allowedhosts=127.0.0.1,192.168.0.34,10.0.50.45`


    You can also specify valid netblocks; *allowedhosts=127.0.0.1,192.168.0.0/24*
    or *allowedhosts=127.0.0.1,192.168.0.0/255.255.255.0* will allow the entire 192.168.0.x
    netblock to connect.


    It is best to limit what hosts can connect. If you’re monitoring your corporate
    network and you let anyone connect, you could end up giving access to your data
    dumps to an attacker, since Kismet does not do any authentication beyond this.


    ```

    # Address to bind to. Should be an address already configured already on

    # this host, reverts to INADDR_ANY if specified incorrectly.

    bindaddress=127.0.0.1

    ```'
  merge: -1
  img_proc: true
- pgno: 133
  md: "The Kismet server can be bound to specific addresses on a multi-homed system.\
    \ By default, Kismet will bind to all addresses configured and listen on all interfaces.\
    \ If you want to limit it to only one address, specify it here.\n\n```\n# Maximum\
    \ number of concurrent GUI's\nmaxclients=5\n```\n\nThis specifies exactly what\
    \ it says; the maximum number of clients that can connect to a server. The more\
    \ clients, the more work the server has to do, so it’s best not to allow too many\
    \ or run too many.\n\n```\n# Do we have a GPS?\ngps=true\n```\n\nThis is a pretty\
    \ self-explanatory parameter. If you want to use a GPS, you need to set this to\
    \ true in order to use it. If it’s set to false, you can save a little memory\
    \ on really slim systems.\n\n```\n# Host:port that GPSD is running on. This can\
    \ be localhost OR remote!\ngpshost=localhost:2947\n```\n\nKismet uses GPSD for\
    \ getting GPS coordinates into Kismet and in turn into your logs. GPSD interfaces\
    \ with your serial/Universal Serial Bus (USB) port and takes the incoming NMEA\
    \ data and puts it out over a TCP port. Kismet connects to that port and puts\
    \ the data into the server.\n\nSpecify where GPSD is running and on what port.\
    \ Most configurations have GPSD running on the same system as `kismet_server`,\
    \ so it would be set to “`gpshost=localhost:2947`” or “`gpshost=127.0.0.1:2947`”\
    \ depending on if name resolution is working or not.\n\n> **Note**\n> \n> If for\
    \ some reason you have GPSD on another machine on the same network as the `kismet_server`\
    \ and GPSD is available on it, you can specify that system’s address instead.\
    \ Note: If you get your GPS data from a source other than one attached to the\
    \ system running `kismet_server`, then all your locations will seem to be from\
    \ the location at the remote system, skewing your results. This is also true if\
    \ you are running remote drones. If your GPS location is not at the location of\
    \ your sensor, then your GPS data will not be correct."
  merge: -1
  img_proc: true
- pgno: 134
  md: '```

    # Do we lock the mode? This overrides coordinates of lock "0", which will

    # generate some bad information until you get a GPS lock, but it will

    # fix problems with GPS units with broken NMEA that report lock 0

    gpsmodelock=false

    ```


    This parameter is a workaround for GPSs that don''t send proper data until you
    get a lock on the GPS satellites. Set this to "true" if your GPS is giving you
    issues on startup. You may also want to check for updated firmwares for your GPS.


    ```

    # Packet filtering options:

    # filter_tracker - Packets filtered from the tracker are not processed or

    #                recorded in any way.

    # filter_dump  - Packets filtered at the dump level are tracked, displayed,

    #                and written to the csv/xml/network/etc files, but not

    #                recorded in the packet dump

    # filter_export - Controls what packets influence the exported CSV, network,

    #                xml, gps, etc files.

    # All filtering options take arguments containing the type of address and

    # addresses to be filtered. Valid address types are ''ANY'', ''BSSID'',

    # ''SOURCE'', and ''DEST''. Filtering can be inverted by the use of ''!'' before

    # the address. For example,

    # filter_tracker=ANY(!00:00:DE:AD:BE:EF)

    # has the same effect as the previous mac_filter config file option.

    # filter_tracker=...

    # filter_dump=...

    # filter_export=...

    ```


    Kismet can filter out specific MAC addresses at various levels of the program.
    This can be useful if you wish to eliminate known APs and clients from your logs
    or display. You can also limit how far the packet gets in the client server chain
    and if it''s recorded or not in the logs.


    +   filter_tracker= If any packets match the specified parameters, they are not
    added to the display or any of the log files, and are simply dropped on the floor.


    +   filter_export= If any packets match the specified parameters, they are not
    included in the CSV, network, xml, gps, etc files but are recorded in the dump
    file.


    +   filter_netclient= If a packet comes from a specific network client, don''t
    record it.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'The MAC addresses can be specified as SOURCE, DEST (destination), BSSID, and
    ANY. Source and destination are useful for eliminating known clients, BSSID is
    for specifying the MAC of a wireless AP. ANY will filter any packets with that
    MAC, regardless of where it appears in the frame. Just specifying the MAC will
    activate the filter on a match to that address, or you can specify the inverse
    with an exclamation point at the beginning to filter everything but the specified
    address.


    ```

    filter_tracker=ANY("!00:00:DE:AD:BE:EF")

    ```


    This will filter any packet out of the logs and packet tracker that does not match
    the specified MAC of 00:00:DE:AD:BE:EF


    ```

    filter_dump=BSSID("00:00:DE:AD:BE:EF")

    ```


    This line will filter out packets from the AP with the BSSID of 00:00:DE:AD: BE:EF
    from the dump file.


    ```

    filter_tracker=ANY("00:00:DE:AD:BE:EF")

    ```


    This line would drop any packets with the MAC of 00:00:DE:AD:BE:EF from the display
    and the logs. This is particularly good if you want to monitor for rogue networks
    and eliminate known networks and clients from the logs and display.


    ```

    # Alerts to be reported and the throttling rates.


    # alert=name,throttle/unit,burst/unit


    # The throttle/unit describes the number of alerts of this type that are


    # sent per time unit. Valid time units are second, minute, hour, and day.


    # Burst rates control the number of packets sent at a time


    # For example:


    # alert=FOO,10/min,5/sec


    # Would allow 5 alerts per second, and 10 alerts total per minute.


    # A throttle rate of 0 disables throttling of the alert.


    # See the README for a list of alert types.

    ```


    Kismet has some rudimentary IDS capability to detect certain patterns in packets
    known to be attacks, or the presence of certain pieces of software that could
    be used maliciously.


    These alerts can give a network administrator a great deal of power in determining
    if their network is under attack, or if problems are from some other source. While
    a certain amount and types of alerts are normal, excessive amounts can indicate
    problems or attacks.


    These alert patterns are built into the Kismet source and are not easily changed.
    The threshold for triggering an alert is configurable, however. The “alert=” line'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'specifies an alert built in the source and it’s threshold before triggering
    a note in the alert log. If you want to disable the alert, just add a comment
    “#” in front of it.


    Each alert has it’s own parameters. *alert=FOO,10/min,5* would enable the FOO
    alert. When the FOO event happens 5 times in a second. it triggers an alert. After
    that initial trigger, it would spawn another alert if FOO occurred again in the
    same time frame, to a maximum of 10 alerts per minute, so as to avoid clogging
    the alert window with thousands of the same alerts.


    These alerts will clue you in to the presence of some active network discovery
    applications, and some odd patterns that denote attacks. Passive sniffers such
    as Kismet, cannot be detected, and offline attacks obviously cannot be detected
    either. It is not an exhaustive IDS system, but it can be useful for quickly identifying
    common attacks and problems.


    ```

    alert=NFTSTUMBLER,10/min,1/sec

    ```


    This alert detects the presence of the Netstumbler network discovery tool through
    unique packets being broadcast while it is in use.


    ```

    alert=WELLENREITER,10/min,1/sec

    ```


    This alert detects the presence of another network discovery tool, Wellenreiter.
    Specifically this alert detects Wellenreiter’s SSID brute-forcer. If a network
    is not broadcasting it’s SSID, it is possible to reveal the SSID by probing using
    a dictionary and listening for responses. This alert is triggered by certain behaviors
    of Wellenreiter when it is doing this, namely between each probe attempt, it resets
    the card to probe for *“this_is_used_for_wellenreiter.”*


    ```

    alert=LUCENTTEST,10/min,1/sec

    ```


    This alert is for the presence of lucent networks link test. This is a site survey
    tool that could be used for rudimentary stumbling and reconnaissance.


    ```

    alert=DEAUTHFLOOD,10/min,2/sec

    ```


    This detects deauthentication floods. If an attacker is spoofing deauthentication
    packets from the MAC of the AP to clients, an alert is generated. An alert is
    not triggered if the disassociation is normal, and only if excessive deauthentications
    are occurring.


    ```

    alert=BCASTDISCON,10/min,2/sec

    ```


    This alert is for broadcast floods, which should never occur normally. In a broadcast
    flood, the attacker floods a network with disassociation or deauthentication packets
    in'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'an attempt to get clients to disassociate with their current AP and associate
    to a rogue network.


    ```

    alert=CHANGE,5/min,1/sec

    ```


    This alert notes if a previously detected network suddenly changes channels. This
    is a good indication of an attempt at spoofing a network, since most networks
    don’t change channels on a regular basis.


    ```

    alert=AIRJACKSSID,5/min,1/sec

    ```


    This alert looks for the probe SSID name of “airjACK,” the initial SSID of airjACK
    tools. The airjACK tools allow for raw mode injection and reception, and are used
    in a number of possibly malicious tools. This alert only detects the SSID of airjACK
    and not the tools themselves. A skilled attacker could easily change the initial
    SSID to something more innocuous.


    ```

    alert=PROBENOJOIN,10/min,1/sec

    ```


    If a client probes for an existing network and is accepted but does not join,
    this is an indication of some firmware-based network discovery tools such as Netstumbler.
    In some situations, this can generate a great number of false positives and may
    not be indicative of an attack. This can also be triggered by some network client
    applications waiting for user input before associating.


    ```

    alert=DISSASOCTRAFFIC,10/min,1/sec

    ```


    If a client appears to disassociate from the AP, it should normally not be attempting
    to communicate with the AP right afterwards. If this alert is triggered, it is
    likely the client specified in the alert has been the victim of a disassociation
    attack where an attacker sends a forged packet to the AP indicating the client
    is leaving.


    ```

    alert=NULLPROBERESP,10/min,1/sec

    ```


    This is an indication of an attack against some firmware versions by many manufacturers
    that have a fatal error if they receive a SSID probe of null length (no length).
    This can be a sign of a Denial of Service (DoS) attack or misbehaving client.


    ```

    alert=BSSTIMESTAMP,10/min,1/sec

    ```


    Each packet from an AP is time-stamped and should be received in something resembling
    a continuous stream. It is not possible to spoof the time stamp with normal drivers,
    so a wildly different time stamp received is an indication that someone may be
    trying to spoof the AP’s SSID and/or MAC address. This may trigger some false
    positives in situations of high loss where not all packets are being received.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 132  Chapter 5 • Configuring the Kismet Server


    ```

    alert=MSFBOMSSID,10/min,1/sec

    ```


    Several exploits exist for drivers of several manufacturers of wireless cards.
    The Metasploit project exploit framework contains an exploit for some broadcom
    drivers. This exploit uses an overly large SSID to cause a buffer overflow in
    the driver. This alert will tell you if someone is attempting to exploit this.


    ```

    alert=LONGSSID,10/min,1/sec

    ```


    The IEEE spec allows for a maximum of 32 bytes in the SSID field. If frames are
    detected with SSID''s over 32 bytes, it''s a very good indication that someone
    is doing something bad to your network. This alert will let you know if something
    is amiss.


    ```

    alert=MSFDLINKRATE,10/min,1/sec

    ```


    Metasploit contains an exploit for a D-link driver. The exploit revolves around
    how the driver handles an overly long accepted data rate field. This alert detects
    the usage of this exploit, and likely, someone doing something bad.


    ```

    alert=MSFNTEGARBREACON,10/min,1/sec

    ```


    Just like the D-link and Broadcom cards, some drivers for Netgear are exploitable,
    this time through oversized beacon frames. This alert indicates as the others
    do, that someone is using Metasploit to do something possibly bad to your network.


    ```

    alert=DISCONCODEINVALID,10/min,1/sec

    alert=DEAUTHCODEINVALID,10/min,1/sec

    ```


    Both the DISCONCODEINVALID and DEAUTHCODEINVALID are alerts for related issues.
    In this case, it relates to the way some APs and client adapters handle unknown
    or invalid reason codes in disassociation or deauthentication packets. This alert
    is indicative of problems on the network or possibly an attack against exploitable
    equipment.


    ```

    # Known WEP keys to decrypt, bssid,hexkey. This is only for networks where # the
    keys are already known, and it may impact throughput on slower hardware. # Multiple
    wepkey lines may be used for multiple BSSIDs. # wepkey=00:DE:AD:C0:DE:00,FEEDFACEDDEABEEF01020304050607080900

    ```


    If you are monitoring your own network, hopefully it is encrypted. If you use
    WEP it can be useful to have the packets decrypted for passing to snort or other
    third-party programs. With the wepkey= parameter, you can specify the BSSID of
    the particular network and the key in hexadecimal format. Multiple keys can be
    specified with multiple wepkey= lines. Keep in mind that if you are decrypting
    traffic, the server'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'host system has to work harder to decrypt everything on the fly, and that the
    captured data will be in plaintext in the dump file. You want to keep access to
    it secure.


    Hopefully you are not running WEP and are using something stronger like WPA. WEP
    can be cracked in less than *60* seconds using freely available tools. At this
    time, there is no way to decrypt a WPA network on the fly through Kismet.


    ```

    # Is transmision of the keys to the client allowed? This may be a security

    # risk for some. If you disable this, you will not be able to query keys from

    # a client.

    allowkeytransmit=true

    ```


    Depending on your configuration and monitoring needs, you may not want the Kismet
    server to inform the Kismet client what the keys are. Change to `false` if you
    don’t want this, particularly if others can read the data from the server or the
    dump file.


    ```

    # How often (in seconds) do we write all our data files (0 to disable)

    writeinterval=300

    ```


    By default, Kismet writes the logs to disk every 5 minutes (300 seconds). You
    can adjust this if you like, but as the size of the logs grow, the longer it takes
    to save them. If you specify a time too low, then it might cause your system to
    thrash its hard disk in a constant save cycle.


    ```

    # How old (and inactive) does a network need to be before we expire it?

    # This is really only good for limited ram environments where keeping a

    # total log of all networks is problematic. This is in seconds, and should

    # be set to a large value like 12 or 24 hours. This is intended for use

    # on stationary systems like an IDS

    # logexpiry=86400

    ```


    In some situations you may want to have networks expire from the list. If you
    are running the server for several days and want to limit the amount of resources
    used, you can set the `logexpiry=` parameter to a reasonable expiry time. This
    is particularly of interest when used as an IDS and you want to automatically
    remove networks that haven’t been active for quite a while (such as clients passing
    by or way off nets that you might have gotten a lucky reflection and a single
    packet).


    ```

    # Do we limit the number of networks we log? This is for low-ram situations

    # when tracking everything could lead to the system falling down. This

    # should be combined with a sane logexpiry value to flush out very old

    # inactive networks. This is mainly for stationary systems like an IDS.

    # limitnets=10000

    ```'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Some situations such as limited resource machines or noisy environments, might
    make you want to limit the number of networks. Most situations usually require
    that you record everything, so it may not be the best solution. Smart usage of
    the `logexipry=` parameter above can hopefully help keep your system logs from
    growing beyond the capabilities of your system.


    ```

    "# Do we track IVs? this can help identify some attacks, but takes a LOT\n# of
    memory to do so so on a busy network. If you have the RAM, by all\n# means turn
    it on.\ntrackivs=false"

    ```


    This parameter can be useful for some real time tracking of possible attacks.
    If you track IVs, you can keep an eye on the rate at which they appear and see
    if someone is attempting to perform any injection attacks. This can also be useful
    if you are attempting to collect enough IVs to break WEP, and are using Kismet
    to do the collection. On most modern systems it’s not a bad idea to turn it on.


    ```

    "# Do we use sound?\n# Not to be confused with GUI sound parameter, this controls
    whether or not the\n# server itself will play sound. Primarily for headless or
    automated systems.\nsound=false"

    ```


    The server can be made to play sounds on events (new network, and so forth), which
    is not to be confused with sound events from the client (controlled from the `kismet_ui.conf`
    file). This is useful for headless and automated systems. If you have a rig in
    the back of your car with no monitor, there’s not much need to run a client, but
    you still need to keep an eye (or more correctly, an ear) on the status of the
    server to make sure it’s operating properly. So having it beep or squawk it’s
    status is a useful thing to have.


    ```

    "# Path to sound player\nsoundplay=/usr/bin/play"

    ```


    If the server is to play sound, it obviously needs to know what program on your
    system it should use to play them. By default it’s `/usr/bin/play`, but adjust
    to your system’s specific sound player.


    ```

    "# Optional parameters to pass to the player\n# soundopts=- -volume=.3"

    ```


    If you want to get fancy, you can also pass parameters such as sound volume or
    any other command-line parameters for your player program. Simple specify them
    as you would on the command line.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '```

    # New network found

    sound_new=@sharedatadir@/kismet/wav/new_network.wav

    # Wepped new network

    # sound_new_wep=@sharedatadir@/kismet/wav/new_wep_network.wav

    # Network traffic sound

    sound_traffic=@sharedatadir@/kismet/wav/traffic.wav

    # Network junk traffic found

    sound_junktraffic=@sharedatadir@/kismet/wav/junk_traffic.wav

    # GPS lock aquired sound

    # sound_gpslock=@sharedatadir@/kismet/wav/foo.wav

    # GPS lock lost sound

    # sound_gpslost=@sharedatadir@/kismet/wav/bar.wav

    # Alert sound

    sound_alert=@sharedatadir@/kismet/wav/alert.wav

    ```


    Each event can have it’s own sound, and if you want, your own custom sound. Simply
    load your own WAV files onto your system and point each event at the sound you
    want to use. You can also only enable specific event sounds such as the new network
    or GPS lock lost by commenting out un-needed sounds lines.


    ```

    # Does the server have speech? (Again, not to be confused with the GUI’s speech)

    speech=false

    ```


    The server, just like with sounds on a headless system, can also speak. Using
    festival, the server can speak out the names of the networks. If your system has
    festival installed, just change speech to true. This is best used by headless
    and automated systems, and should not be confused with the client speech configuration
    in the kismet_ui.conf file.


    ```

    # Server’s path to Festival

    festival=/usr/bin/festival

    ```


    Kismet also needs to know where festival is installed if you want to use it. Depending
    on your system, just point your config to the festival executable. By default
    it is /usr/bin/festival.


    ```

    # Are we using festival lite? If so, set the above “festival” path to also

    # point to the “flite” binary

    flite=false

    ```


    If you are using festival lite, you can set this option to true and set the path
    on the above festival= line and point it to the flite binary.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "```\n# Are we using Darwin speech?  \n  `darwinsay=false`\n```\n\nIf you built\
    \ Kismet for OSX on a Mac, you can use Darwin’s speech functionality in place\
    \ of festival to speak server events.\n\n```\n# What voice do we use? (Currently\
    \ only valid on Darwin)  \n  `speech_voice=default`\n```\n\nDarwin also has a\
    \ selection of voices that can be used. Choose the voice in the system preferences,\
    \ and Kismet will use that voice as the default option in the config file.\n\n\
    ```\n# How do we speak? Valid options:  \n  # `speech` Normal speech  \n  # `nato`\
    \ NATO spellings (alpha, bravo, charlie)  \n  # `spell` Spell the letters out\
    \ (aye, bee, sea)  \n  `speech_type=nato`\n```\n\nIf we are using festival and\
    \ speech, how do we want it to speak? Setting this to “speech” has festival speak\
    \ (or approximately speak) the names of the networks that are detected. Setting\
    \ *speech_type* to *nato* will use the nato alphabet to “speak” each letter (linksys\
    \ is read out as “LIMA, INDIA, NOVEMBER, KILO, SIERRA, YANKEE, SIERRA”). If you\
    \ set it to “spell”, festival will read out each letter as a normal “L,I,N,K,S,Y,S”\n\
    \n```\n# `speech_encrypted` and `speech_unencrypted` - Speech templates  \n  #\
    \ Similar to the logtemplate option, this lets you customize the speech output.\
    \  \n  # `speech_encrypted` is used for an encrypted network spoken string  \n\
    \  # `speech_unencrypted` is used for an unencrypted network spoken string  \n\
    \  #  \n  # `$b` is replaced by the BSSID (MAC) of the network  \n  # `$s` is\
    \ replaced by the SSID (name) of the network  \n  # `$c` is replaced by the CHANNEL\
    \ of the network  \n  # `$r` is replaced by the MAX RATE of the network  \n  `speech_encrypted=New\
    \ network detected, s.s.i.d. $s, channel $c, network encrypted.`  \n  `speech_unencrypted=New\
    \ network detected, s.s.i.d. $s, channel $c, network open.`\n```\n\nYou can customize\
    \ the output of festival and construct the sentences that it speaks. There are\
    \ separate lines for encrypted and unencrypted networks. Festival will speak whatever\
    \ words you put after the equals sign in the `speech_encrypted=` or `speech_unencrypted=`\
    \ lines, with specific symbols replaced by the settings for the network being\
    \ read out."
  merge: -1
  img_proc: true
- pgno: 143
  md: 'speech_encrypted=New network detected, s.s.i.d. %s, channel %c, network encrypted.


    The default lines would read out the above-detected linksys network as “New network
    detected SSID LINKSYS Channel 6 network encrypted” if it was encrypted. You can
    easily shrink this to “Detected SSID LINKSYS” if you change the line to “speech_encrypted=Detected,
    s.s.i.d. %s” for both the speech_encrypted and speech_unencrypted parameters.


    ```

    # Where do we get our manufacturer fingerprints from? Assumed to be in the

    # default config directory if an absolute path is not given.

    ap_manuf=ap_manuf

    client_manuf=client_manuf

    ```


    All manufacturers register the MAC addresses of their devices with the IEEE OUI
    database. From this we can tell what manufacturer made the devices we are detecting.
    Kismet comes with a database for APs and client devices, but sometimes this gets
    out of date or you may want to adjust or update it. You can adjust or replace
    the files or just set the ap_manuf= line to the path of the file you want Kismet
    to use. If it is not in the default config directory (usually /usr/local/etc/)
    then you should specify an absolute path.


    ```

    # Use metric measurements in the output?

    metric=false

    ```


    Kismet can automatically change measurements from imperial (feet, miles) to metric
    (meters, kilometers). False uses imperial (default) and true uses metric measurements.


    ```

    # Do we write waypoints for gpsdrive to load? Note: This is NOT related to

    # recent versions of GPSDrive’s native support of Kismet.

    waypoints=false

    ```


    If we are using gpsdrive, we can, in semi-realtime, plot discovered networks on
    the GPSDrive map. The file is purged when Kismet_server starts and is read by
    GPSDrive periodically, and used to generate waypoints on the map. This is good
    for a low spec laptop that might not be able to run other mapping utilities. It
    also gives you access at the same time to GPSDrives’ other functions (track log,
    and so forth). It is not able to determine closed or open networks or use special
    symbols, but it is a quick and dirty way of mapping your networks. There is approximately
    a 15-second delay between a network being detected and GPSDrive picking up the
    change to the file.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Provided you have not restarted the _kismet\_server_, you can copy the Kismet
    waypoints file specified in the following parameter to another file name and open
