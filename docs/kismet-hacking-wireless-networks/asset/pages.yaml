- pgno: 155
  md: '# # Introduction


    Like the Kismet server, the Kismet client is controlled from a single configuration
    file. On the surface, this file seems as scary as the server configuration; however,
    it’s just as well commented and fairly easy to understand when you dig in. The
    client configuration file is usually in /usr/local/etc and is named kismet_ui.conf.
    For the most part, after you come up with a client configuration that suits your
    needs you will not need to change it much. That being said, there is a very large
    and often untapped amount of configuration of the client available. Most people
    don’t seem to change much beyond the standard configuration.


    # # The Kismet Client Config File


    The config file is not as large as the server configuration file, but offers the
    same amount of flexibility and options. There are lots of very verbose comments
    about the various options listed. Some areas are fairly self-explanatory while
    others are not. This section will go through, almost line-by-line, and examine
    and explain each of them. The comments are good, however some areas are open to
    tweaks not specified in the comments and a lot of power can be revealed once you
    start digging into the config file.


    # # Kismet Parameters


    The kismet.conf config file can be edited directly with your favorite UNIX text
    editor (such as vi, pico, emacs), just be aware of word wrapping and UNIX file
    format. The config file is parsed at runtime by the server and expects a UNIX
    text file. DOS and UNIX use different control characters for their text files
    and such, using a DOS or windows editor on a UNIX text file will probably change
    it and make the file unreadable to the server. In general, if you are editing
    the kismet_ui.conf file, use a UNIX editor. This can be either a native Linux
    application, or an editor through Cygwin if you are running under windows or some
    other UNIX text format-capable editor.


    Comments in the kismet_ui.conf file are lines starting with a “#” symbol. These
    are often comments or example configurations and can usually guide you to what
    options you need to set. Lines that do not start with a comment are the actual
    parameter variables acted upon by the server. It’s a good idea to comment out
    the existing line by putting a “#” in front of the line and adding a new line
    with the adjusted parameter. This way if something goes wrong, you know what the
    original parameter was.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '```

    ```

    # Kismet GUI config file

    # Version of Kismet config

    version=2004.10.R1

    ```

    ```


    The Kismet client configuration has its own version number, separate from the
    package release number and other config files. The config file doesn''t change
    as often as the rest of the tool suite, so it has a separate version number listed
    on this line.


    ```

    ```

    # Do we show the intro window?

    showintro=true

    ```

    ```


    ![](img/d6ac176c353d2b7687c1186a140180a1_156_0.png)


    By default, Kismet shows an intro screen with some instructions on accessing help
    menus and other information. This is often a very annoying thing for early users
    of Kismet. Changing the *showintro=* line to false will prevent this intro message
    from showing up every time you start the client. This is probably the first thing
    that you should adjust.


    ```

    ```

    # Gui type to use

    # Valid types: curses, panel

    gui=panel

    ```

    ```


    Depending on your system’s capabilities, your options for the type of Graphical
    User Interface (GUI) to use may need to change. By default, Kismet uses panels
    for'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'its display. For most modern Linux-based systems, this is not a problem. For
    some systems like handheld devices, or low power or embedded systems, your options
    for shell GUI’s may be limited, in which case, you may need to use the curses
    libraries, and change the *gui=* parameter to curses if needed. This is a more
    advanced feature, and if you are working on a system with limited resources you
    may need it.


    ```

    # Server to connect to (host:port)

    host=localhost:2501

    ```


    This parameter is where the client is told where the server is to connect to.
    The default is to connect to a server running on the local computer, port 2501.
    If you want to connect to a remote server, this is where to specify it. To connect
    to a remote computer over the Local Area Network (LAN) or Internet, just specify
    the Internet Protocol (IP) address in the *host=* line. To connect to a server
    running on 192.168.0.45, just change the line to "*host=192.168.0.45:2501*". However,
    if you do this, you need to make sure to add the address of the client your connecting
    to the *allowedhosts=* parameter in the server configuration, or the server will
    not allow the remote client to connect.


    Several servers can be specified and monitored at once with separate host lines,
    but all detected data will be mashed together in the client. If you want to keep
    the data separate, it is better to run separate instances of the client for each
    server.


    ```

    # Network traffic decay (active/recent/inactive) and packet click rate - increase

    # this if you are doing prism2 channel hopping.

    Decay=3

    ```


    Traffic decay is the exclamation point and period that appear to the left of the
    SSID in the default client layout. They indicate the presence of activity for
    that network within the recent amount of time. When the data for that network
    is seen, an exclamation point shows beside the Set User ID (SUID). If no data
    is seen, in the next update (typically 1 second) the symbol changes to a period.
    If nothing is seen on the next update, no symbol is shown. In this case, the *decay=*
    parameter allows you to configure how many updates (seconds) this transition takes.
    Some cards, like prism2 (hostap drivers) may take a few updates to properly report
    seeing data. Adjust this higher if things don’t seem to be updating right.


    ```

    # What columns do we display? Comma separated. Read the documentation for what

    # columns are valid.

    columns=decay,name,type,wep,channel,packets,flags,ip,size

    ```'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'This is where the rubber meets the road and some good configuration can make
    Kismet more useful to you. Columns are the various types of info listed in the
    client window. Things like the SSID, channel, number of packets seen, and so forth,
    are all configurable in terms of which are shown and in what order. By default,
    Kismet shows for a typical network, from left to right.


    +   - Recently seen decay (see above parameter)

    +   - The BSSID of the network

    +   - Type of network (ad-hoc, infrastructure)

    +   - Security protocol in use (if any)

    +   - Channel of the network

    +   - Number of packets seen

    +   - Any special flags set on the packets from the network

    +   - IP range in use on the network (if it can be determined)

    +   - Total size of the packets collected for the network


    For most people this is enough information for basic scanning, however there are
    a great many other options available to use in the client beyond the default ones
    listed above. These can allow you to customize the display on the client to whatever
    information you need. Not everyone needs to know what flags are coming from the
    server or the IP range of the network. If you specify more columns than the display
    can handle, the display can be scrolled to the right with the arrow keys.


    To customize the columns displayed, put them in a comma separated list (no spaces)
    on the *columns*= line. The available options are:


    +   - **BSSID**  The BSSID (MAC address) of the network. The BSSID is the advertised
    name of the network.


    +   - **Channel**  The last channel advertised by the network. If the network
    changes channels, the display is updated to reflect this change.


    +   - **Clients**  The number of unique client MAC addresses seen on the network.
    This includes wireless stations and wired stations sending packets (broadcast
    and direct) to wireless stations. The client''s menu will show you which stations
    are which and further info.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   Crypt This is the number of encrypted packets. This is usually the same
    as the data column, unless the network is switching from encrypted to un-encrypted,
    which it should generally not be unless something is going very wrong.


    +   Data The number of data packets. The total number of data packets is just
    the total Transmission Control Protocol (TCP/IP) packets, not the 802.11 management
    frames. This is actual data being passed around the network, not just management
    overhead. Typically if the network is encrypted, the data and crypt counters will
    be the same.


    +   Decay Displays “!” or “,” or blank, based on network activity in the last
    “decay” seconds (controlled by the “decay” variable in the config file). Decay
    is the column mentioned earlier that indicated to the user if there has been data
    seen in the last few updates. Typically if data is seen on the latest update,
    an exclamation point will be shown (!), if the next update doesn’t have any new
    data (as typically happens with channel hopping), a period will be shown (.),
    and if no data is seen recently, this column is blank. The rate at which this
    updates can be controlled by the decay= parameter mentioned earlier.


    +   dupeiv The number of packets with duplicate IVs seen. It is sometimes useful
    to know if networks you’re monitoring are generating a lot of duplicate IV’s,
    particularly in stationary Intrusion Detection System (IDS) situations. This only
    applies to Wireless Encryption Protocol (WEP) networks. If you are seeing excessive
    duplicate IV’s on a WEP network, either the access point (AP) is misbehaving (old
    firmware problems, and so forth) or if you are seeing large numbers of duplicate
    IV’s with excessively high data packet rates, you may be under an active injection
    attack on your network. Not a useful thing for wardriving, but for security monitoring
    of a legacy WEP network, it can be very useful.


    +   Flags Network status flags (address size, decrypted, and so forth). The Kismet
    server sets various flags on each network to indicate some status information.
    This information is a very brief overview of what has been discovered about a
    network.


    The various flags (from the client help menu) are:


    +   F Vulnerable factory configuration. Many people don’t bother to ever change
    the configuration on their WAP. This is bad.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '+   * **T#** Address range of # octets found via TCP traffic


    +   * **U#** Address range of # octets found via User Datagram Protocot (UDP)
    traffic


    +   * **A#** Address range of # octets found via Address Resolution Protocot (ARP)
    traffic


    +   * **D** Address range found via observed Dynanic Host Configuration Protocot
    (DHCP) traffic


    +   * **W** WEP’d network decrypted with user-supplied key


    These flags can be useful to quickly note to other apps that something is amiss
    or should be noted (such as a default-configured network).


    ![](img/d6ac176c353d2b7687c1186a140180a1_160_0.png)


    +   * **Info** The extra AP info included by some manufacturers. Some manufacturers
    include extra information in their traffic about the APs, which may or may not
    be of use to your scans. If you do want it, add “info” to the list of columns
    displayed.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '**IP** The detected./guessed IP of the network. Kismet can make a guessimate
    of what IP addresses are in use on a network through dissection of the packets
    it sees. Kismet will display any IP addresses it sees in the traffic. This only
    applies to open networks. Encrypted networks typically do not divulge their addresses
    since they are encrypted. If there are more than one network address spaces in
    use over a wireless link, Kismet may switch between address spaces on the client
    display.


    **LLC** The number of LLC packets. The LLC column is a counter for beacons and
    other management frames. These are the logical link layer packets that manage
    the wireless link. This counter is separate from the data and crypt columns.


    **Manuf** The manufacturer, if matched. Kismet can guess what manufacturer made
    the network device by comparing the Extended Service Set Identifier (ESSID) (MAC
    address) with the Organizational Unique Identifier (OUI) database. Network device
    manufacturers register the address spaces they make their devices in with the
    Institute of Electrical & Electronics Engineers, Inc. Using this list, Kismet
    can look at the addresses seen and compare to this list to make an educated guess
    about who made the device. This obviously does not work if the network address
    for the device has been changed for whatever reason.


    ![](img/d6ac176c353d2b7687c1186a140180a1_161_0.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   *   **Maxrate** The maximum supported rate as advertised by the AP. Networks
    advertise the maximum data rate available so that incoming clients know what the
    maximum rate they should try when connecting.

    +   *   **Name** The name of the network or group. Typically this is the ESSID
    of the network Service Set Identifier (SSID), but some manufacturers add additional
    fields for things like location or other organizational data.

    +   *   **Noise** The last seen noise level. The noise column shows the noise
    level reported by the wireless driver. The problem with the signal and noise readings
    from wireless cards is that there is no standard unit of measurement across all
    the different chip sets and drivers. This means that any values reported by various
    drivers are pretty much useless. The reason that commercial products can do this
    is that they have access to documentation that open source developers do not,
    to decode some of this information. They typically also have a limited number
    of cards they work with that they have had access to the documentation for.

    +   *   **Pakets** The total number of packets. The packet counter column is the
    cumulative total of all the packets seen, data, crypt, and LLC.


    ![](img/d6ac176c353d2b7687c1186a140180a1_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '**Shortname** The shortened name of the network or group for small displays.
    Use this column for systems with smaller displays. This column is not as wide
    as the “name” column and can fit in skinnier displays without as much whitespace
    on the right. If the name is too long for the column, it is truncated.


    **Shortssid** The shortened SSID for small displays. Much like the shortname column,
    this column is useful for smaller display systems. However, the SSID shown is
    often the same as the name column, so you may be duplicating some information.


    ![](img/d6ac176c353d2b7687c1186a140180a1_163_0.png)


    **Signal** The last seen signal level. Like the noise column, this reports the
    signal level reported by the driver of the card you''re using. Also, like the
    noise column, there is no standard units for reporting this information and it
    is a hit or miss venture to use. However, it can be useful in giving you an idea
    of the relative strength of one network to another.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '+   Signalbar The graphical representation of signal strength. The signalbar
    column just gives a graphical representation of the signal strength. This, however,
    is just as reliable as the numeric values from the signal column for the same
    reasons.


    +   Snrbar The graphical representation of signal-to-noise ratio (SNR). The SNR
    bar column attempts to show graphically, the signal as compared to the noise levels.
    As before however, this graph is hit or miss depending on what driver and chipset
    you are using. It can be useful for comparing the relative strength of the various
    networks detected.


    +   Size The amount of data transferred on network. The size column is the total
    (in Bytes, Kilobytes, etc) of the captured data packets, giving a relative comparison
    of which networks are transmitting the most data.


    +   SSID The SSID/ESSID of the network or group. The SSID column shows the ESSID
    of the network. This is also pretty much the same as the name column.


    +   Type The network type (Probe, Adhoc, Infra, and so forth). The type column
    indicates what type of network this is (probing client, AP, and so forth). From
    the Kismet help menu:


    +   P Probe request No associated connection yet.


    +   A Access point Standard wireless network.


    +   H Ad-hoc point-to-point wireless network.


    +   T Turbocell Turbocell (aka Karlnet or Lucent outdoor router) network.


    +   G Group of wireless networks.


    +   D Data Data only network with no control packets


    This column is only a single character wide and only shows a title of “T.”'
  merge: -1
  img_proc: true
- pgno: 165
  md: '160


    # Chapter 6 • Kismet Client Configuration File


    ![](img/d6ac176c353d2b7687c1186a140180a1_165_0.png)


    +   □

    +   ■ **Weak** The number of packets that appear to have weak IV''s. Weak IV''s
    used to be an issue with early WEP cracking tools. Most modern AP firmware doesn''t
    leak weak packets as much as they used to. It may be useful to use this column
    to monitor for excessive amounts of weak IV''s, which could indicate attack or
    something else going wrong.


    +   □

    +   ■ **WEP** The WEP status (does network indicate it uses WEP). This column
    is one of the most useful but sadly mislabeled, because Kismet grew organically
    with changes and updates being made as they were introduced and integrated into
    the program.


    The WEP column is actually the encryption status. Early on, WEP was the only option
    available, so it was a simple Y/N status indication. Since those days, WPA and
    WPA2 (802.11i) have been added. From the client help:


    +   □

    +   ■ **N** No encryption detected

    +   ■ **Y** Standard WEP encryption

    +   ■ **O** Other encryption methods detected


    The “O” indicator shows if WPA/WPA2 is present, as well as if other proprietary
    methods are available. The network information screen shows more specific information
    of what encryption is available. However, this does not necessarily mean that
    the strongest encryption available is in use.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '![](img/d6ac176c353d2b7687c1186a140180a1_166_0.png)


    ```

    # What columns do we display for clients? Comma seperated.

    ```


    ```

    clientcolumns=decay,type,mac,manuf,data,crypt,size,ip,signal,quality,noise

    ```


    Like the main network display, we can specify the columns to be shown when we
    are in the client information screen that gives us information about the clients
    associated with that network.


    The options, just as with the main screen, are added, comma seperated with no
    spaces, to the `clientcolumns` = line.


    The available columns are:


    +   - **Crypt** The number of encrypted data packets transferred by client. The
    crypt counter, like the main network screen, shows the total number of encrypted
    packets transferred to and from the client. If the network is open, this counter
    does not count anything.


    +   - **Data** The number of data packets transferred by client. The data counter
    counts all data packets to and from the client, both unencrypted and encrypted
    packets.


    +   - **Decay** Displays ““, “, ” or “” based on network activity. Once again,
    the client’s recent activity can be tracked through the decay column. This column
    shows the user if there has been data seen from or too a client in the last few
    updates. Typically if data is seen on the latest update, an exclamation point'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'will be shown (), if the next update doesn''t have any new data (as typically
    happens with channel hopping), a period will be shown (.), and if no data is seen
    recently, this column is blank.


    +   - **IP**  The last seen IP used by client. Kismet can dissect packets to determine
    the IP a client is using. This only works on unencrypted networks.


    +   - **Mac**  The MAC address of client. The MAC address of the client''s are
    on every packet sent to or from the client and is listed here for your tracking
    enjoyment.


    +   - **Manuf**  The manufacturer of the client (if known). As with the APs, we
    can use the OUI database to make a best guess about the manufacturer of the client
    adapters. The manufacturer''s guess is to be taken with a grain of salt, as it''s
    trivial to change the MAC address of client adapters to anything else in the allowable
    range of addresses.


    +   - **Maxrate**  The maximum rate client seen transferring. Kismet can track
    the maximum rate the client has seen transferring. This can be useful in diagnosing
    client''s complaining of low transfer speeds.


    ![](img/d6ac176c353d2b7687c1186a140180a1_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   * **Noise** The last seen noise level of client. The noise level column
    refers to the Kismet server''s level of noise between it and the client, not the
    client to it''s assocated AP. The server could be seeing a lot of noise that is
    not being experienced between the client and the AP. All readings should be taken
    with a grain of salt. Once again, with differences in drivers and a lack of standard
    reporting of signal levels, this value is not an absolute and only useful for
    relative comparison.


    +   * **Signal** The last seen signal level of client. Same as the noise, this
    is the value of the signal strength between the client and the Kismet server,
    not the client and the AP. All values should be taken with a grain of salt due
    to the lack of standards in the drivers and chipsets.


    +   * **Size** The amount of data transferred by the client. The size column counts
    the size of the packets (in bytes, kilobytes, and so forth) collected from and
    to the client.


    +   * **Type** The type of client (Established, To-DS, From-DS, and so forth).
    Clients can be wired or wireless. Kismet can tell this depending on the direction
    of traffic and if telltale wireless traffic is seen.


    The clients list shows the following (from the client help menu):


    +   * **F From DS** The client broadcast from wireless distribution system. These
    clients are typically wired systems.


    +   * **T To DS** The client transmitted over the wireless to the distribution
    system. These clients are typically wireless nodes.


    +   * **I Intra DS** The client is a node of the distribution system talking to
    another node in the distribution system.


    +   * **E Established** The client has been seen entering and leaving the DS.
    These are typically wireless nodes.


    +   * **S Sent-to** The data has been sent to this client, but no data has been
    seen FROM this client, possibly a hidden node.


    +   * **U Unknown** The client is in an unknown state. Depending on what flag
    is set, you can make a reasonable guess as to what clients are wireless and which
    are wired.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '+   - **Weak** The number of packets which appear to have weak IV''s. This
    column counts the number of packets with weak IV''s. Not a problem commonly seen
    nowadays, but excessive weak packets could be an indication of problems or an
    attack.


    ```

    # Does the GUI use sound?

    # NOT to be confused with "sound" option later, which is for the SERVER to make

    # noise on whatever host it''s running on.

    sound=true

    ```


    The sound option enables the client (as opposed to the server) sound options.
    The client can make noises and play sounds on various events (new network, and
    so forth). This can be very useful for systems where you can''t keep your eye
    on the system (like in a moving car).


    It''s best to use either the server sound or the client sound, but not both at
    the same time or it will be awfully confusing and noisy.


    ```

    # Path to sound player

    soundplay=/usr/bin/play

    ```


    If the client is to play sound, it obviously needs to know what program on your
    system it should use to play them. By default it''s /usr/bin/play, but adjust
    to your system''s specific sound player.


    ```

    # Optional parameters to pass to the player

    # soundopts=--volume=.3

    ```


    If you want to get fancy, you can also pass parameters such as sound volume or
    any other command-line parameters for your player program. Simple specify them
    as you would on the command line.


    ```

    # New network found

    sound_new=@sharedatadir@/kismet/wav/new_network.wav

    # Weppd new netwrok

    # sound_new_wep=@sharedatadir@/kismet/wav/new_wep_network.wav

    # Network traffic sound

    sound_traffic=@sharedatadir@/kismet/wav/traffic.wav

    # Network junk traffic found

    sound_junktraffic=@sharedatadir@/kismet/wav/junk_traffic.wav

    # GPS lock acqired sound

    # sound_gpslock=@sharedatadir@/kismet/wav/foo.wav

    ```'
  merge: -1
  img_proc: true
- pgno: 170
  md: '```

    # GPS lock lost sound

    # sound_gpslost=@sharedatadir9/klsmet/wav/bar.wav

    # Alert sound

    sound_alert=@sharedatadir9/klsmet/wav/alert.wav

    ```


    Each event can have its own sound, and if you want, your own custom sound. Simply
    load your own WAV files onto your system and point each event at the sound you
    want to use. You can also enable only specific event sounds such as the new network
    or Global Positioning System (GPS) lock, lost by commenting out un-needed sounds
    lines.


    ```

    # Do we automatically make a group for probed networks or do we show them

    # amidst other networks?

    autogroup_probe=true

    ```


    The client can take and group all the probe networks (clients looking for networks)
    together. They will be listed under the `<probe networks>` group, and can be expanded
    by selecting the group and pressing **Enter** to show information about all the
    probe networks. If a probe is seen and then associated with a network, it will
    be moved to the client list for that network.


    ```

    # Do we autogroup data-only networks?

    autogroup_data=true

    ```


    Like probe networks, the client can group *data-only networks* together in the
    same manner. Select the data networks group and press **Enter** to see the data
    networks.


    ```

    # Do we autogroup adhoc networks?

    autogroup_adhoc=true

    ```


    Once again, we can group ad-hoc networks together just like probe and data networks.
    It is sometimes a good idea to set this as false, to see if anyone may be setting
    up ad-hoc networks that circumvent your security policies.


    ```

    # Dsplay battery status?

    apm=true

    ```


    If your system has APM enabled, Kismet can report your battery status at the bottom
    left of the client. Useful if your running around on battery power and want to
    keep an eye on your time left before you have to plug in and charge up.


    ```

    # Does the GUI talk to us with Festival?

    speech=false

    ```'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Using *festival*, the client can speak out the names of the networks. If your
    system has festival installed, change the speech to true. This should not be confused
    with the server usage of festival.


    ```

    # Where is festival located for the GUI?

    festival=/usr/bin/festival

    ```


    Kismet also needs to know where festival is installed if you want to use it. Depending
    on your system, point your config to the festival executable. By default it is
    /usr/bin/festival.


    ```

    # Are we using festival light? If so, point the above “festival” path to the

    # “flite” binary.

    flite=false

    ```


    If you are using festival lite you can set this option to true and set the path
    on the above festival= line and point it to the flite binary.


    ```

    # Are we using speech on Darwin?

    darwinsay=false

    ```


    If you built Kismet for OS X on a Mac, you can use Darwin''s speech functionality
    in place of festival, to speak server events. Set this to true if you want to
    use Darwin''s speech.


    ```

    # What voice do we use? (currently only supported on darwin)

    speech_voice=default

    ```


    Darwin also has a selection of voices that can be used. Choose the voice in the
    system preferences and Kismet will use that voice as the default option in the
    config file.


    ```

    # How do we speak? Valid options:

    # speech Normal speech

    # nato NATO spellings (alpha, bravo, charlie)

    # spell Spell the letters out (aye, bee, sea)

    speech_type=nato

    ```


    If we are using festival and speech, how do we want it to speak? Setting this
    to “speech” has festival speak (or approximately speak) the names of the networks
    that are detected. Setting *speech_type* to *nato* will use the nato alphabet
    to “speak” each letter (linksys is read out as “LIMA, INDIA, NOVEMBER, KILO, SIERRA,
    YANKEE, SIERRA”). If you set it to “spell,” festival will read out each letter
    as a normal “L,I,N,K,S,Y,S.”'
  merge: -1
  img_proc: true
- pgno: 172
  md: '```

    # speech_encrypted and speech_unencrypted - Speech templates

    # Similar to the logtemplate option, this lets you customize the speech output.

    # speech_encrypted is used for an encrypted network spoken string

    # speech_unencrypted is used for an unencrypted network spoken string

    #

    # %b is replaced by the BSSID (MAC) of the network

    # %s is replaced by the SSID (name) of the network

    # %c is replaced by the CHANNEL of the network

    # %r is replaced by the MAX RATE of the network

    speech_encrypted=New network detected, s.s.i.d. %s, channel %c, network encrypted.

    speech_unencrypted=New network detected, s.s.i.d. %s, channel %c, network open.

    ```


    You can customize the output of festival and construct the sentences that it speaks.
    There are separate lines for encrypted and unencrypted networks. Festival will
    speak whatever words you put after the equals sign in the `speech_encrypted=`,
    or `speech_unencrypted=` lines with specific symbols replaced by the settings
    for the network being read out.


    ```

    speech_encrypted=New network detected, s.s.i.d. %s, channel %c, network encrypted.

    ```


    The default lines would read out the above detected linksys network as "New network
    detected SSID LINKSYS Channel 6 network encrypted" if it was encrypted. You can
    easily shrink this to "Detected SSID LINKSYS" if you change the line to "`speech_encrypted=Detected,
    s.s.i.d. %s`" for both the `speech_encrypted` and `speech_unencrypted` parameters.


    ```

    # Simple borders (use - and | instead of smooth vertical and horizontal

    # lines. This is required on Zaurus, and might be needed elsewhere if your

    # terminal doesn''t display the border characters correctly.

    simpleborders=false

    ```


    Depending on your terminal, you may need to change from straight lines to terminal
    characters. Usually this in not an issue unless you''re running Kismet on some
    exotic hardware and not a standard laptop.


    ```

    # Colors (front, back) of text in the panel front. Valid colors are:

    # black, red, yellow, green, blue, magenta, cyan, white

    # optionally prefixed with "hi-" for bold/bright colors, ie

    # hi-red, hi-yellow, hi-green, etc.

    ```


    ```

    # Enable colors?

    color=true


    # Background

    backgroundcolor=black

    ```


    ![](img/d6ac176c353d2b7687c1186a140180a1_172_0.png)'
  merge: -1
