    ```

    ```python

    # GPSDrive waypoint file. This WILL be truncated.

    waypointdata=$h/.gpsdrive/way_kismet.txt

    ```

    ```


    This parameter specifies the file write network information and location for GPSDrive
    to load as waypoints. By default, it looks in the home directory _.gpsdrive/_
    directory.


    ```

    ```python

    # Do we want ESSID or BSSID as the waypoint name?

    waypoint_essid=false

    ```

    ```


    When Kismet parses the waypoint file, do you want to use the ESSID or the BSSID
