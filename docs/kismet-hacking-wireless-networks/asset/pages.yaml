- pgno: 91
  md: 'Kismet is a text-based application that uses an ncurses/panels interface for
    its default front-end menus. Visually, the front ends are similar, although the
    ncurses interface is black and white, while the panels interface uses color (see
    Figure 4.1). As we will see through this chapter, the value of color is immeasurable
    to Kismet’s panels interface in terms of the amount and value of the information
    it provides. In addition, the ncurses interface is a single, non-interactive display;
    the various secondary and popup menus specified within this chapter do not work.


    # Figure 4.1 Ncurses/Panels Interface


    ![](img/d6ac176c353d2b7687c1186a140180a1_91_0.png)


    The choice of graphical user interface type to use is specified in the *kismet_ui.conf*
    file:


    ```

    # Gui type to use

    # Valid types: cursues, panel

    gui=panel

    ```


    This file is typically located in `/usr/local/etc`. The panel interface is the
    default, and is highly recommended. For the remainder of this chapter, all references
    and figures will use the panels interface.


    An important feature of the Kismet panels interface is the integrated help screen.
    From the primary window, simply press **h** to bring up the help pop-up window
    (see Figure 4.2).'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Figure 4.2 Kismet Panels Interface


    ![](img/d6ac176c353d2b7687c1186a140180a1_92_0.png)


    # Tip


    In any of Kismet''s pop-up windows, the bottom right corner of the window provides
