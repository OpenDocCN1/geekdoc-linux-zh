- pgno: 72
  md: '# # Introduction


    In Chapter 2, our focus was to get Kismet installed and running in a minimal configuration.
    So far we have discussed the very basics needed to get it to operate on a laptop.
    Now, we are going to expand on that basic installation, and take the first steps
    to turning the Kismet laptop into a true wireless analysis tool.


    Kismet has several configuration files that control its functions, most notably
    the `kismet_ui.conf` and `kismet.conf` files contained in the `/etc/kismet` directory.
    We briefly mentioned editing the `kismet.conf` file in Chapter 2. In order to
    make Kismet more functional, this time we’ll be performing editing to both the
    `kismet_ui.conf` and `kismet.conf` files to get Kismet running for everyday use.


    The `kismet_ui.conf` and `kismet.conf` files are fully detailed in Chapters 5
    and 6, but the changes noted in this chapter are those that are likely to be the
    most useful for those who are new to Kismet.


    In addition to editing those files to make Kismet more functional and useful,
    we’ll also discuss adding several pieces of equipment that will help you get the
    most out of the computer that you are using to run Kismet. Many users have an
    expectation that they can immediately use Kismet with little more than a laptop
    and a wireless network card. However, to obtain the best possible results, most
    users quickly find that they must add some extra Radio Frequency (RF) equipment
    in the form of external antennas and associated cables, and a Global Positioning
    Satellite (GPS) receiver.


    In addition to the GPS receiver, the `gpsd` software package will need to be added
    to the basic Kismet installation so that Kismet will work with the GPS receiver.


    # # The Kismet User Interface


    The first thing we should do is edit the `kismet_ui.conf` file, which controls
    how the user interface presents itself to the user. The user interface is the
    client portion of Kismet that the user sees when running the application.


    The `kismet_ui.conf` file is a simple text file that can be edited by any text
    editor. Two common text editors under Linux are `vi` and `nano`, which are used
    on the command-line interface (CLI). Most window managers that run under Linux,
    such as KDE and Gnome, also have graphic text editors that are suitable for editing
    `kismet_ui.conf`.


    To use a text-based editor such as `vi`, you would enter the editor name followed
    by the file name that you to edit on the CLI.


    ```

    ```

    vi /etc/kismet_ui.conf

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# The Introductory Splash Screen


    When Kismet is first run, a small splash screen opens up over the main window.
    The splash screen, entitled “Welcome to Kismet” tells you what Kismet client you''re
    running, including the version and build number. It welcomes you to the Kismet
    panel''s front end and advises you that you can press **h** at any time to get
    help information. It also tells you that you can turn off of the message by editing
    the `kismet_ui.conf` file. Pressing the space bar will get rid of the splash screen.
    This splash screen is shown in Figure 3.1.


    ![](img/d6ac176c353d2b7687c1186a140180a1_73_0.png)


    ![](img/d6ac176c353d2b7687c1186a140180a1_73_1.png)


    Now we want to get rid of the splash screen, so that it doesn''t open whenever
    Kismet is run. To do this, edit the line *showintro=true* to and change it to
    *showintro=false*.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Save the file and restart Kismet. Kismet will now start up without the splash
    screen. Remember, press the h key to open a Help screen. The Help screen is further
    discussed in Chapter 4.


    # Play Sounds


    Kismet, by default, plays sounds when certain events happen or are detected. Those
    events are when:


    +   - A new network is detected

    +   - Traffic is seen on a detected network

    +   - Junk traffic is seen on a detected network

    +   - Alarm conditions are triggered


    Four sound files for these functions are installed in the /usr/share/kismet/wav
    directory when Kismet is installed. Playing sounds can be turned on or off by
    setting the sound value to true or false. By default, the sound is on, and can
    be found on this line: `sound=true`


    The sound application that comes as part of most Linux installations is play,
    and by default, Kismet uses play to present those sounds to the user. This can
    be seen from this line: `soundplay=/usr/bin/play`


    However, some Linux distributions come with different sound applications. If play
    is not the sound application on your laptop, then you will have to change the
    sound-play=/usr/bin/play line to reflect the sound player that is installed. For
    example, aplay is the sound player application that comes with Ubuntu Linux version
    8.04. If you are using Ubuntu v8.04, you have to change the line to soundplay=/usr/bin/aplay,
    so that the play application is used to play the sound files.


    # Additional RF Equipment: Antennas and Cables


    Most people using Kismet for the first time will use it for the activity known
    as “war driving,” or locating Wireless Local Area Networks (WLANs) while driving
    through a given area. The steel and aluminum body panels in most auto bodies block
    radio signals very effectively, and because of this, an antenna is usually one
    of the first'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'accessories purchased to be added to the Kismet laptop. An external antenna
    for WLAN uses functions in the same way as the AM/FM radio antenna on your car.
    It allows a weak signal, which otherwise might not penetrate the car body, to
    be brought in where the receiver—or in the case of Kismet, the wireless networking
    card—is located.


    To help you understand antennas and how they work, here are some basic terms you
    should know when determining what type of antenna you want to use while running
    Kismet:


    +   - **Gain** Gain describes how well an antenna performs. The units used to
    describe gain are the *decibels*.


    +   - **Decibel (dB)** A decibel is the unit of measure for power ratios describing
    loss or increase of apparent radio frequency power, normally expressed in watts.
    A decibel is not an absolute value—it is the measurement of power gained or lost
    between two communicating devices. These units are usually given in terms of the
    logarithm to Base 10 of a ratio.


    +   - **dBi value.** This is the ratio of the gain of an antenna as compared to
    an *isotropic antenna*. The greater the dBi value, the higher the gain. If the
    gain is high, the angle of coverage will be more acute.


    +   - **Isotropic Antenna** An isotropic antenna is a theoretical antenna that
    radiates its signal to cover the area in a perfect sphere. It is used as the starting
    point to describe the performance and gain of a real antenna.


    Generally, an antenna capable of transmitting and receiving the signal equally
    in all directions is preferred. These antenna are known as “omni-directional”
    or “omni” for short. Most war drivers use an omni antenna in the 3 dBi to 8 dBi
    range, as these give the best compromise on signal gain and pattern. Commonly,
    this type of omni-directional antenna has a magnetic base that sticks readily
    to a steel car body roof. Such “mag mount” antennas allow the antenna to be transferred
    between different vehicles without a complicated installation. Two small omni-directional
    antennas along with a wireless card can be seen in Figure 3.2. The antenna on
    the left is approximately 6 inches in height and has a magnetic base that allows
    it to be easily mounted on a car body. The antenna on the right is made for use
    on tabletop. Both have a gain of approximately 5 dBi.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Figure 3.2 3dBi Omni-Directional Antenna with Magnetic Mount Base


    ![](img/d6ac176c353d2b7687c1186a140180a1_76_0.png)


    One common misconception is that the higher the gain of the antenna, the better
    your results will be when using Kismet. This is not true. The important thing
    to understand from the preceding definition of dBi value is the last sentence:
    “If the gain is high, the angle of coverage will be more acute.”


    The signal coverage area of an omni-directional antenna is shaped roughly like
    a donut. The higher (or larger) the gain, the “shorter” the donut. The opposite
    is true as well. A smaller gain antenna has a “taller” donut. Figure 3.3 shows
    the signal donut of a 5 dBi gain omni-directional antenna compared to that of
    an 8 dBi gain omni-directional antenna. The signal donut of the 5 dBi is taller
    than the signal donut of an 8 dBi gain omni-directional antenna. This is illustrated
    in the side view. What this means is that although it has a “weaker” signal, as
    indicated in the overhead view, a 5 dBi gain omni-directional antenna is likely
    to provide better results in a neighborhood with tall buildings, such as an urban
    downtown area. Also, because these antennas rely on line-of-sight communication,
    a 5 dBi gain antenna works well in residential areas where homes and other buildings
    provide obstructions between your antenna and any wireless access points (APs).'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# **Figure 3.3 Omni-directional Antenna Patterns with Different Gain Levels**


    ![](img/d6ac176c353d2b7687c1186a140180a1_77_0.png)


    Antennas of this type usually come with an attached cable, 10 to 20 feet in length.
    This cable allows the signal to be received easily inside a car or truck. The
    cable end opposite the antenna usually terminates in a "Type N–Male" connector.
    If the attached cable is too short or absent, a cable of the appropriate length
    will have to be purchased.


    In addition to an omni-directional antenna, directional antennas of different
    types are available from a wide variety of sources. A directional antenna is confined
    to sending and receiving in a single direction, as the name implies. Directional
    antennas also come in different gain levels, and usually are described as having
    a particular “beam width” in degrees. Think of it like a flashlight beam of light.
    The beam width on a directional antenna is the area the antenna will send and
    pick up radio signals.


    Due to the narrow focus of the beam, directional antennas are of limited use for
    general war driving, since the signal is confined to sending and receiving in
    one area only. Most times while war driving, you are attempting to find as many
    APs as possible, in all directions. However, for those people who are using Kismet
    for purposes such as security auditing of a WLAN, a directional is a must, especially
    if you are attempting to locate a specific AP. For example, when attempting to
    locate an unauthorized or “rogue” AP on a company network, a directional antenna
    is an indispensable tool.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# # Pigtails


    The frequencies used by 802.11 WLANS fall into the microwave area of the radio
    spectrum. In order not to lose too much of the radio energy in the connectors,
    the connectors must be of the proper type and rated for microwave use. The “N”
    type connector is one of the most commonly used for microwave RF communications,
    and is seen on many brands of antennas and cables. Unfortunately, an “N” connector
    is huge in comparison to the average WLAN cards. The combined weight of the cable
    and the connector would almost certainly destroy most cards in short order. For
    this reason, the card manufacturers use tiny connectors on the cards. To convert
    from the tiny connector used on the card to an “N” connector, we need what is
    known as a “pigtail” cable.


    The term “pigtail” comes from radio engineering and ham radios. A pigtail is nothing
    more than a short piece of antenna cable, with different connectors on each end.
    They are used to convert one connector type to another. Usually, the cable used
    for a pigtail is a smaller diameter and type than the main cable, but this is
    not always true. The exact origins of the term seem to be lost, but since most
    small diameter coaxial cables curl rather tightly after being unwound from a cable
    spool, it seems reasonable that the name came from the fact that a small length
    of cable might resemble the curled tail of a pig.


    Two common pigtails used for WLAN antenna connections are the Orinoco proprietary
    connector (Type MC) to a Type N-Female connector, which is a reflection of the
    popularity of the OrinoCO card and the Type MMCX connector to a Type N-Female
    connector. When purchasing a pigtail, you must determine the connectors that you
    need on each end of the cable. This will depend on the brand and model of your
    card, and the connector on the antenna cable. If you have more than one card that
    you will be using with you Kismet laptop, most likely you will need more than
    one pigtail. Most pigtails are about 12 to 18 inches (30 to 45 cm) in length.
    Longer pigtails may be found, but are generally best avoided. This is because
    the thin cables have a high signal loss, and the longer the cable, the more


    ![](img/d6ac176c353d2b7687c1186a140180a1_78_0.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'signal is lost before it gets to the radio card. Figure 3.4 shows an 802.11b
    WiFi card and its pigtail. The connector on the left joins to a standard antenna
    cable, and the connector on the right attaches directly to the card itself.


    # Figure 3.4 Pigtail (Type N to Type MC)


    ![](img/d6ac176c353d2b7687c1186a140180a1_79_0.png)


    # Using a GPS Receiver with Kismet


    In order to physically locate a WLAN AP or to map WLAN locations, you have to
    know where you are when the AP is detected. So how do you track where you are
    when a WLAN is detected? You could take notes, writing down your exact location'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'every time Kismet finds an AP. But this could be rather difficult because getting
    a precise location might involve taking measurements along with detailed notes.
    For instance, “Thirty-five feet north of the ‘No Parking’ sign in front of the
    23 Main St.; five feet from the edge of the sidewalk.” Using such a technique
    might be rather tedious, and you would proceed at a snail’s pace.


    However, there is a much easier way to do this, with a level of precision within
    approximately 25 feet. By attaching a GPS satellite receiver to your computer,
    Kismet will automatically log your location every time it receives an 802.11 frame.


    GPS units are radio receivers that measure a signal from several different global
    position satellites. By using triangulation, the receiver calculates its location
    on the surface of the Earth using those signals. The location is reported in terms
    of the latitude, longitude, altitude, and other data. Most GPS units continuously
    update their location information. The unit then sends out this position data
    over a serial data link, typically about once every second. In turn, Kismet reads
    the data via another program called `gpsd`, and then records the longitude and
    latitude from the GPS whenever it monitors an 802.11 packet or frame. Because
    of this ease of use in recording the location of a detected WLAN, a GPS is the
    second accessory that most users will add to their Kismet laptop.


    Features of GPS receivers vary, but generally they fall into two categories: those
    that have an integral display and those that have no display. Those that are without
    a display are generally referred to as “mouse” or “puck” styles, since they tend
    to resemble either a computer mouse or a hockey puck. Mouse or puck GPS receivers
    without a display are generally less expensive, but they need to be connected
    to a computer (or some other device) to work properly. Those with displays can
    function in a standalone mode. If you plan on using your GPS solely for use with
    Kismet, a mouse or puck style may be fine. However, if you plan on using the GPS
    for other activities such as hiking, then you will want to buy one with a display.
    Figure 3.5 shows three common GPS units. The two on either end have a built-in
    Liquid Crystal Display (LCD), while the center one is a “puck” without a display.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# **Figure 3.5** Typical GPS Receiver Models


    ![](img/d6ac176c353d2b7687c1186a140180a1_81_0.png)


    In addition to the GPS receiver itself, an additional software package known as
    *gpsd* is needed. The *gpsd* program collects the serial data from the GPS receiver
    and makes it available to be queried by Kismet and other programs on Transmission
    Control Protocol (TCP) port 2947. Like other UNIX-type software, the source code
    must be downloaded and the *configure*, *make*, and *make install* commands must
    be run to install the program. If you are unfamiliar with these procedures, complete
    information on downloading, compiling, and installing software packages from source
    code was covered in the last chapter. Documentation for *gpsd* can be downloaded
    from http://gpsd.berlios.de.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Debian-based Linux distributions such as Ubuntu, install `gpsd` by typing this
    command at the CLI:


    ```

    ```bash

    sudo apt-get install gpsd

    ```

    ```


    Once installed, `gpsd` is started on the CLI by typing the command `gpsd` followed
    by the device designator of the port into which the GPS receiver is plugged. The
    `gpsd` program normally runs without further configuration, and will self-determine
    any parameters needed for communicating with the GPS receiver. For example, if
    the GPS receiver is plugged into the first serial port on the laptop, usually
    known as device `/dev/ttyS0`, then the command would be:


    ```

    ```bash

    gpsd -p /dev/ttyS0

    ```

    ```


    If the GPS receiver is plugged into the second Universal Serial Bus (USB) port
    on the laptop, usually known as device `/dev/ttyUSB1`, then the command would
    be:


    ```

    ```bash

    gpsd -p /dev/ttyUSB1

    ```

    ```


    In order to have Kismet report and record the information coming from `gpsd`,
    you also have to edit the `kismet.conf` file. Open `kismet.conf` located in the
    `/etc/kismet` directory, in your favorite text editor, just like you did previously
    with `kismet_ui.conf`. Find the line marked:


    ```

    ```bash

    gps=false

    ```

    ```


    and change it to read:


    ```

    ```bash

    gps=true

    ```

    ```


    Now save the `kismet.conf` file and close the editor. Now, run Kismet again. If
    everything is working correctly, you will see GPS data in the form of the current
    longitude and latitude listed on the bottom border of the main Kismet panel. Additionally,
    you should see a "2D" or "3D" status flag, depending on whether the GPS has locked
    on to enough satellites to determine a full three-dimensional location or only
    a two-dimensional location. A full three-dimensional location has the longitude,
    latitude, and altitude, so if a full three-dimensional location is being tracked
    by the GPS, all three figures will be displayed. Otherwise, for a two-dimensional
    location, only the longitude and latitude will be shown.


    # ## Typical GPS Problems


    There are several potential stumbling blocks to using your GPS receiver with Kismet.
    If you experience problems getting the GPS data, you need to do a bit of troubleshooting.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The first requirement to getting a GPS unit to work with Kismet is to get the
    GPS to transmit its data over some manner of communications link. Most GPS receivers
    will output location data in the National Marine Electronics Association (NMEA)
    0183 data protocol, using a serial cable. Technically, the NMEA 0183 output is
    EIA-422A data, but for all practical purposes it is the same as RS-232 serial
    data. This means a GPS that sends NMEA 0183 data will talk to the serial communications
    (COM) ports used on most computers. Some newer GPS units use Bluetooth low-power
    radio communications to transmit the NMEA data.


    However, before you attempt to use the GPS receiver with Kismet, you must go through
    an initialization procedure. The procedure needs to be done before the GPS will
    send out the correct location data. Be sure to read the instructions for your
    GPS, and go through the setup routine.


    The Map Datum from the GPS should be set to the World Geodetic System of 1984
    (WGS84). This is the default setting for most GPS receivers, but occasionally
    the data output is set to the North American Datum of 1927 (NAD27). While the
    two data sets are very similar, there can be a difference in location of over
    100 meters (320 feet) in different sections of the United States. Therefore, using
    the NAD27 setting may result in inaccurate location information, especially if
    your later try to map the AP site.


    A second problem is that some GPS brands and models need to lock on to the satellite
    signals and establish their location *before* they send any serial data. More
    than one person has started checking cables and connections and analyzing RS-232
    data protocols, only to realize that the receiver had not seen enough satellite
    signals to establish a location, and had not sent anything out of the serial port.


    Conversely, many GPS units will send out data, but it may not be accurate if the
    receiver has not locked onto the satellite signals. One chipset used in some popular
    GPS units is known to initialize itself to Tokyo if it cannot see any satellite
    signals. That’s fine if you happen to be in Tokyo when you start collecting data,
    but probably isn’t much use to people starting outside of Tokyo.


    The lesson here is to make sure your GPS receiver has a satellite lock before
    you head out to use Kismet. GPS satellite signals are relatively weak since the
    satellites are in high orbit, and the GPS receiver may need several minutes to
    figure out where it is on the Earth’s surface. If you are inside a building, moving
    outdoors will help speed up this process, as the receiver will have better “line
    of sight” to the satellites, and therefore have better signal reception. Also,
    anything that blocks the GPS receiver’s clear view of the sky, from heavy tree
    cover to a city’s “concrete canyons,” can hinder the ability of the receiver to
    determine location. When using Kismet with GPS in a'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'vehicle, you should keep the GPS receiver where it can “see” the sky. In most
    vehicles, this will be an area on the dashboard under the windshield, or near
    another window. For the sake of safety, make sure the GPS receiver (or any other
    device) does not obstruct the driver’s field of view.


    # # Tools & Traps


    # ## Troubleshooting GPS Problems


    If Kismet does not seem to be communicating with your GPS receiver, it is sometimes
    difficult to determine if the fault lays with the Kismet, `gpsd`, the GPS unit
    itself, or something else such as the cables and connectors.


    The first step is to check if the GPS is sending data to `gpsd`. The `gpsd` program
    uses TCP 2947 to communicate to other programs and applications; therefore, you
    are able to use the program Telnet to communicate with `gpsd`, to see if it is
    working. First, start `gpsd` using the appropriate device:


    ```

    ```

    gpsd /dev/ttyS0

    ```

    ```


    Then, start Telnet, pointing it to the `gpsd` TCP port on the laptop (known as
    the *localhost*), and type the command `r` to have `gpsd` respond with the NMEA
    data.


    ```

    ```

    # telnet localhost 2947

    # r

    ```

    ```


    If the GPS receiver is working properly, you should see NMEA sentences scroll
    by on the screen. NMEA sentences should look similar to those below, although
    the data will differ slightlyly according to your location.


    ```

    ```

    $GPGSV,3,1,10,17,78,216,38,23,63,311,42,26,56,051,41,15,52,303,43*7E

    $GPGSV,3,2,10,18,46,295,49,09,36,152,29,36,053,,03,09,317,*7C

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 85
  md: '```

    SGPGSV,3,3,10,10,08,097,,06,04,203,……*7C

    SGPGLL,4422.2935,N,07313.8332,W,005702.969,A*21

    SGPGGA,005702.97,4422.2935,N,07313.8332,W,1,05,2.7,00075,M,,,,*3E

    SGPRMC,005702.97,A,4422.2935,N,07313.8332,W,00.0,000.0,150303,15.,W*67

    SGPGSA,A,2,17,23,26,18,15,……,2.7,2.7,*13

    ```


    If you see information similar to this, then the GPS and gpsd are working properly,
    and you may close Telnet by typing the following commands:


    # ^c

    # e


    If no characters show at all, then this indicates a probable cable issue. In this
    case, you may need to purchase a null modem, which will swap the connections of
    several common lines used in serial connections. Null modems for serial cables
    can be obtained at most Radio Shack stores for under $10.


    A third issue is that RS-232 serial data has its own pitfalls. Almost all serial
    connections on the GPS receivers are proprietary, so most users will need to purchase
    a cable from the GPS manufacturer. The plugs and sockets for the PC end of the
    cable are usually DB9 sub-connectors on most laptops, but sometimes those are
    also proprietary. Encountering a plug (or socket) on both the laptop and the GPS
    is quite common, requiring the purchase and use of gender-changer plugs or sockets
    in order to get the equipment to connect to each other. Another common difficulty
    with the RS-232 standard is finding that a null modem is required to switch the
    location of the data lines within the connectors. A gender changer and a null
    modem are shown in Figure 3.6.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Figure 3.6 A “Gender Changer” Plug and a Null Modem Needed to Connect Various
    GPS Cables


    ![](img/d6ac176c353d2b7687c1186a140180a1_86_0.png)


    The final common problem with using a GPS is that many laptops produced in the
    last few years lack RS-232 serial ports. Instead, the serial ports have been replaced
    with the faster and more flexible USB ports. However, many GPS receivers still
    only use an RS-232 serial port. This will require the use of a serial-to-USB converter.
    Several manufactures such as Belkin make serial-to-USB converters.


