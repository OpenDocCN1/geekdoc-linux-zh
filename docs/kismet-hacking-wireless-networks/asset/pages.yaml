    # ## Command-Line Switches


    Just as the server, you can specify command-line switches for the Kismet client.
    This does require you to start the Kismet server separately using *kismet_server*.
    You can’t use the Kismet script that launches both the server and client together.
    The command-line switches override any settings in the *kismet_ui.conf* file.


    +   - *-f, --config-file <file>* Use alternate config file


    Some of the options for the client come from the server config file, so if you
    specify an alternate server config file, the client needs to know about it.


    +   - *-u, --ui-config-file <file>* Use alternate UI config file


    Some users like to have one config file with the columns a certain way, and another
    with different columns listed. Using the *-u* switch, you can easily change from
    one to another.


    +   - *-q, --quiet* Don’t play sounds'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Sometimes sound is useful, other times it''s not. This option will disable
    it for you for this run of the client.


    ```

    -s, --server <host:port>    Connect to Kismet host and port

    ```


    Probably the most common use of command-line switches for the client, is specifying
    an alternate server. If you''re running multiple servers, maybe in an IDS setup,
    you can specify the IP and port at runtime with the -s switch.


    ```

    -g, --gui <type>    GUI type to create (curses, panel)

    ```


    If you need to switch between a panel and curses interface for a session (there
    shouldn''t be many) you can specify it here. There are only two choices: panel
    and curses.


    ```

    -C, --columns <list>    Columns to display initially (comma seperated)

    ```


    Instead of multiple config files, you can manually specify what columns you want,
    in the order you want from the command line. Valid options are the same as in
    the config file, listed earlier in the chapter or in the Kismet README file.


    ```

    -r, --reconnect    Try to reconnect after the client/server connection fails.

    ```


    If you are on a flakey or a high latency connection to a remote server, the client
    might disconnect occasionally. The -r switch will automatically have the client
    try and reconnect the client to the server if it is disconnected.


    ```

    -c, --client-columns <list>    Columns to display for client info

    ```


    As with the network columns, you can specify as comma-separated names, which columns
    and the order you want them for client devices that are detected. Valid options
    are the same as in the config file, listed earlier in the chapter or in the Kismet
    README


    ```

    -v, --version    Kismet version

    ```


    The -v option will print the version number of the client to the command line.


    ```

    -h, --help    What do you think you''re reading?

    ```


    Finally, the -h option will pull up the list of command-line switches in case
    you don''t have this book handy.'
  merge: -1
  img_proc: true
