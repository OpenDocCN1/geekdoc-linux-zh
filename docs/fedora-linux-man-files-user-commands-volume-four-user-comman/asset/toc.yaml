- - '###'
  - 描述 从 sysfs 和 /proc/cpuinfo 获取的架构信息。命令输出可以针对解析或人类可读性进行优化。这些信息包括（例如）CPU 数量、线程、核心、插槽（sockets）和非统一内存访问（NUMA）节点。此外还有关于
    CPU 缓存和缓存共享、系列、型号、bogoMIPS、字节序和步进（stepping）的信息。
