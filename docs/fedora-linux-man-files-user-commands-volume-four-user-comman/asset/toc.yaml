  - 选项
- - '##'
  - -ascii 只转换换行符。这是默认转换模式。
- - '##'
  - -iso DOS 与 ISO-8859-1 字符集之间的转换。参见转换模式。
- - '##'
  - -h, --help 显示帮助并退出。
- - '##'
  - -i[FLAGS], --info=FLAGS FILE ...
- - '##'
  - -d
- - '##'
  - -u
- - '##'
  - -m
- - '##'
  - -b
- - '##'
  - -t
- - '##'
  - -c
- - '##'
  - -k, --keepdate 保留时间戳，使输出文件的时间戳与输入文件相同。
- - '##'
  - -L, --license
- - '##'
  - -l, --newline 添加额外的换行符。
- - '##'
  - -m, --add-bom 在输出文件中写入字节顺序标记 (BOM)。默认写入 UTF-8 BOM。
- - '##'
  - -n, --newfile OUTFILE ... 新文件模式。转换输入文件 FILE 并输出到文件 OUTFILE。文件名必须成对给出，且不应使用通配符名称，否则你将丢失文件。
- - '##'
  - -o, --outfile FILE ... 旧模式模式。转换输入文件并覆盖输出。该程序默认在此文件中运行。可以使用通配符名称。
- - '##'
  - -q, --quiet 静默模式抑制警告和消息。返回值为零。但使用错误的命令行选项除外。
- - '##'
  - -r, --remove-bom 移除字节顺序标记 (BOM)。不在在输出文件中写入 BOM。这是转换为 Unix 换行符时的默认行为。也使用选项 `-s,
    --safe` 跳过二进制文件（默认）。
- - '##'
  - -u, --keep-utf16 保留输入文件的原始 UTF-16 编码。输出文件将以与相同的 UTF-16 编码（小端或大端）写入。这可以防止转换为 UTF-8。将相应地写入一个
    UTF-16 BOM。可以通过 -ascii 选项禁用此选项。
- - '##'
  - -ul, --assume-utf16 假设输入文件格式为 UTF-16。
- - '##'
  - -ub, --assume-utf16be 假设输入文件格式为 UTF-16BE。
- - '##'
  - -v, --verbose 显示详细信息。通过字节标记将额外信息。
- - '##'
  - -F, --follow 跟踪链接。
- - '##'
  - -R, --replace 替换符号。
- - '##'
  - -S, --skip 跳过符号。
- - '##'
  - -V, --version 显示版本。
