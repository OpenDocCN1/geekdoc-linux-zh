  md: '# Volume 1 Preface


    # Background


    This book is a compendium of easy-to-use and essential Raspberry Pi OS system
    administration tasks for the beginner. The Raspberry Pi OS is derived from the
    Debian branch of Linux, and as of this writing, Debian Bullseye was the most current
    version of that operating system. To present the system administration tasks and
    commands here, I have selected some very basic stuff, and a few advanced concepts,
    topics, commands, and details that might not appear in a more complete system
    administration book.


    The overriding idea behind system administration of a modern, 21st-century Linux
    system such as the Raspberry Pi OS, is the use of systemd to ensure the Linux
    kernel works efficiently and effectively to provide these three foundations of
    computer operation and management: computer system concurrency, virtualization,
    and secure persistence.


    And this control of the kernel by a “super-kernel,” which is system essentially
    is, must also promote the highest level of system performance and speed, give
    the use case computer might be put to, and provide needs of the target user base
    that the computer serves. Unless a novice user, or even a more seasoned system
    professional, has not only a basic, but also a more complete knowledge of how
    systemd controls and oversees every process of a modern Linux system, they will
    never be able to master administrating and implementing the kind of functionality
    that their use(s) might ultimately require. Particularly for the user base on
    the system, and the demands that user base makes.


    Everything illustrated in Chapters 0, 1, and 2, in the specific form (and the
    syntax of commands) found there, is explicitly applicable to all Debian-family
    distributions, including the Raspberry Pi OS, and also to all other versions of
    Debian, including Ubuntu and Linux Mint, Red-Hat CentOS, and Slackware distributions,
    such as SU. The major areas of development of Linux over the last several years
    has been the expansion of the role that systemd plays in every aspect of Linux
    operating system.


    Certainly, out of the multitude of possible topics we could have presented, the
    ones we just detailed have basically been selected in somewhat of a subjective
    way. That selective was mainly guided by these concerns:


    +   a. The secure maintenance, in terms of concurrency, virtualization, and persistence,
    of a single Linux computer system that an ordinary novice user can install on
    her own personal computer.'
  merge: -1
