    # 0.2 File Maintenance Commands and Help on Raspberry Pi OS Command Usage


    After your first-time login to a new Raspberry Pi system, one of your first actions
    will be to construct and organize your workspace environment, and the files that
    will be contained in it. The operation of organizing your files according to some
    logical scheme is known as file maintenance. A logical scheme used to organize
    your files might consist of creating bins for files according to the subject matter
    of the contents of the files or to the dates of their creation. In the following
    sections, you will type file creation and maintenance commands that produce a
    structure similar to what is shown in Figure 0.1. Complete the operations in the
    following sections in the order they are presented to get a better overview of
    file maintenance really is. It also is critical that you review what was presented
    in the Preface regarding the structure of a Raspberry Pi OS command, so when you
    begin to type commands for file maintenance, you understand the syntax of what
    you are typing conforms to the general syntax of any Raspberry Pi OS command.


    # 0.2.1 File and Directory Structure


    When you open a terminal, or console, window, you are working in the home directory,
    or folder, of the autonomous user associated with the username and password you
