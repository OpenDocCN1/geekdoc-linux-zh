    # TABLE 1.3


    CUPS Command-Line Utilities


    | Command | Task |

    | --- | --- |

    | cancel | Cancels a print request |

    | lpadmin | Sets up or changes a printer or class configuration |

    | lpinfo | Shows available devices or drivers known to the CUPS server |

    | lpmove | Moves a specified job or all jobs to a new destination |

    | loptions | Displays or sets printer options and defaults |

    | lp | Submits a print request |

    | lpstat | Displays the status information for queues and requests |


    commands under CUPS management is somewhat different. You should consult the man
