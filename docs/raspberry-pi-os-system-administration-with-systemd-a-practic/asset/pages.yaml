  md: '# Basic System Administration


    As discussed in Item (1) of Section 1.5.1, our data storage model for desktop
    computers is capable of deploying two or more external USB2 or 3 drives, and its
    implementation is is made possible by what we show in the following sub-sections.


    The additions in the traditional ext4-based example shown below in Section 1.5.3
    will be for USB flash drives which can also be easily extended to other persistent
    media, such as externally mounted SSDs, spinning hard disks, or other external
    media, as PCIe M.2 cards.


    # SATA Dis and USB Media:


    Generally, when you add a persistent medium, such as USB flash drives, SSDs, or
    PCIe M.2 cards, some significant time after you have installed the operating system
    on the computer, you will want to partition it. You might even want to create
    a new partition table on it, create one or more partitions, and format those partitions
    a standard Linux file system, such as ext4. We emphasize and encourage you to
    use the Gparted GUI-based application to do this.


    When you add an external USB-bus medium, such as a flash drive or other forms
    of persistent storage device, it is generally already formatted to the file type
    known as FAT32 (in the case of most popular commercially available flash drives),
    or to other format depending on the media. Traditionally, you can then partition
    the disk using the **mkfs** command and add a file to the command line. We emphasize
    and encourage the use of **fdisk**, or its newer sister, **gdisk**, to the partitioning,
    if that''s the route you want to go on the commandline.


    The safe removal of USB media can be done manually in the Raspberry Pi OS. For
    example, using the desktop GUI you can click on the Media Eject button on the
    right side from the Taskbar at the top of the screen, and safely remove attached,
    mounted removable media. Unmounting a USB drive, or other USB media, can also
    be done from the command line with the **umount** command.


    When a flash drive or external medium is automatically mounted on a Raspberry
    Pi system, the path to it is **/media/your_home_dir/id**, where **your_home_dir**
    is the name of your home directory on the system, and **id** is the disk id number
    or identifier.


