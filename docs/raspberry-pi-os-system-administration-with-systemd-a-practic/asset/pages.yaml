  md: '# "Quick Start"


    # 0.2.4 Creating, Deleting, and Managing Directories


    Another critical aspect of file maintenance is the set of procedures, and the
    related Raspberry Pi OS commands use you to create, delete, and organize directories
    in your Raspberry Pi OS account on a computer. When moving through the file system,
    you are either ascending or descending to reach the directory you want to use.
    The directory directly above the current working directory is referred to as the
    *parent* of the current working directory. The directory or directories immediately
    under the current working directory are referred to as the *children* of the current
    working directory. The most common mistake for beginners is misplacing files.
    They cannot find the file names listed with the **ls** command because they have
    placed or created the files in the directory either above or below the current
    working directory in the file structure. When you create a file, if you have also
    a logically organized set of directories beneath your home directory, you will
    know where to store the file. In the following set of commands, we create a new
    directory beneath the home directory and use that new directory to store a file.


    To create a directory within the current working directory, you use the **mkdir**
    command. The general syntax for the **mkdir** command is as follows:


    ```

    mkdir [options] dirname

    Purpose: Creates directory or directories specified in dirname

    Output: New directory or directories

    ```


    +   -m MODE Create a directory with given access modes

    -p Create parent directories that don''t exist in the pathnames specified in directories


    To create a child, or subdirectory, named **first** under the current working
    directory, type the following:


    ```

    $mkdir first

    $

    ```


    This command has now created a new subdirectory named **first** under, as a child
    of, the current working directory. Refer back to Figure 0.1 for a graphical description
    of the directory location of this new subdirectory.


    In order to change the current working directory to this new subdirectory, you
    use the **cd** command. The general syntax for the **cd** command is as follows:


    ```

    cd [directory]

    Purpose: Change the current working directory to **directory** or return to the
    home directory when **directory** is omitted

    Output: New working directory

    ```'
  merge: -1
  pgno: 27
