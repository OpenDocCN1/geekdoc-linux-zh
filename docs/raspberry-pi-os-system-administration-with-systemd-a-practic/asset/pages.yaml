  md: '# 216 Raspberry Pi OS System Administration with systemd


    # 2.6.2.6 Boot Process Querying


    Using the journal, you can examine logs of the present boot record and its progress,
    and past boot records. This is useful from a system administration perspective,
    when something goes wrong with the boot process, or when software or hardware
    on the system fails to start or operate properly after the system boots and is
    in the steady state condition.


    # 2.6.2.6.1 Querying Past Boosts


    To display the information from the current boot, there are times when past boot
    sequence records would be helpful to enable and compare to the current one. The
    journal can save information from previous boots, and the journalctl command can
    be made to display that in an effective and comparative way. Note that in order
    for you to retain journal information from past boots, you must complete the procedures
    shown in this section first.


    To enable persistent boot information, you can do the following:


    +   1. Create the directory to store the journal with the following command:


    $ mkdir -p /var/log/journal


    +   2. Edit the journal configuration file with the editor of your choice:


    $ nano /etc/systemd/journal.conf

    Under the [journal] section, uncomment (remove the # sign) the Storage=

    and set it to "persistent" to enable persistent logging:

    /etc/systemd/journal.conf


    ...

    [journal]

    Storage=persistent


    When retaining previous boots via persistence is enabled on your system, the journalctl
    command provides some options for working with boots as a unit. To see the boots
    you know about, use the --list-boots option with journalctl:


    ```

    $ journalctl --list-boots

    0 d536f72b2bd3da64cbfe740e95addffa 2023-03-24 10:13:44 PDT—Sun

    2023-03-30 12:30:15 PDT

    ```


    The above command will display a line for each boot, as shown in Table 2.5.

    To display more verbose information from these boots, you can use information
    from either the first or second column. To see the journal from the previous boot,
    use the -1 relative pointer column with the -b flag:


    ```

    $ journalctl -b 0

    ```'
