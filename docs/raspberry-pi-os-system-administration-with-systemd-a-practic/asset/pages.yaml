    # 1.12 Access Control Credentials: Discretionary (DAC), Mandatory (MAC), and Role-Based
    (RBAC)


    The nomenclature we use in this section deserves some attention. When we talk
    about access control via security checks, here are some important terms:


    > Objects: The entities that are targeted, or worked on, by the processes of a
    program. For example, processes themselves can be objects, or the processes generated
    by executing instances of a program.


    Files/inodes are another form of object, particularly the executable form of file
    objects, and the attendant data structure holding their information. Not to be
    confused with file system objects, which we have far referred to as either an
    ordinary file or a directory.


    Object Ownership: Indicates the owner user and group.

    Object Context: Security checks done when objects are acted upon.


    Subjects: An object that is acted upon by another. Processes are active subjects,
    such as those processes that are created by exec() or fork() system call from
    an originating process.


    Subject Context: Security checks done when an active subject performs its operations.


    Action: What a subject does to an object. This includes reading, writing, creating
    and deleting files; forking or signaling.


    Permissions: Security checks when a subject acts upon an object. Taking the subject
    context, the object context, and the action, and searching one or more sets of
    permissions to see whether the subject is granted or denied permission to act
    in the desired manner on the object, given'
