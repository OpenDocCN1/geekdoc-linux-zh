  md: '# 0.2.2 Viewing the Contents of Files


    To begin working with files, you can easily create a new text file by using the
    cat command. The syntax of the cat command is as follows:


    ```

    `cat [options] [file-list]`

    ```


    Purpose: Join one or more files sequentially or display them in the console window

    Output: Contents of the files in file-list displayed on the screen, one file at
    a time


    +   Commonly used options/features:

    -E Display $ at the end numbers on the displayed lines

    -n Put line numbers on the displayed lines

    -help Display the purpose of the command and a brief explanation of each option


    The cat command, for concatenate, allows you to join files. In the example, you
    will join what you type on the keyboard to a new file being created in the current
    working directory. This is achieved by the redirect character >, which takes what
    you type at the standard input (in this case the keyboard) and directs it into
    the file named myfile. You as considered the keyboard, and the stream of information
    it provides, a file. As stated in the Preface, this usage is an example of a command,
    cat with no options, option arguments, or command arguments. It simply uses the
    command, a redirect character, and a target, or destination, named myfile, where
    the redirection will go


    This is the very simplest example of a multiple command typed on the command line,
    as opposed to a single command, as shown and briefly described in the Preface.
    In a multiple command, you can string together single Raspberry Pi OS commands
    in a chain with connecting operators, such as the redirect character shown here.


    ```

    $ cat > myfile

    This is an example of how to use the cat command to add plain text to a file

    $

    ```


    You can type as many lines of text, pressing <Enter> on the keyboard to distinguish
    between lines in the file, as you want. Then, on a new line, when you hold down
    <Ctrl+D>, the file is created in the current working directory, using the command
    you typed. You can view the contents of the file, since it is a plain text file
    that was created using the keyboard, by doing the following:


    ```

    $ more myfile

    This is an example of how to use the cat command to add plain text to a file

    $

    ```'
