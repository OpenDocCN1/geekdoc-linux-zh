    The [Socket] Section

    Socket unit files are configured because, as seen in many sections and problems
    we present below, many services implement socket-based activation to achieve system
    parallelization and speed.


    Note that each socket unit must have a matching service unit that will be activated
    when the socket receives activity.


    Perhaps the hallmark of control system, the methods of control simplify and enhance
    an administrator''s ability to oversee everything that is happening on the computer.
    By default, the socket name will attempt to start the service of the same name
    upon receiving a connection. When the service is initialized, the socket will
    be passed to it, allowing it to begin processing requests.


    To specify the actual secret, the directive is ListenStream=,which defines an
    address for a stream socket, which supports socket IPC communication. Services
    that use TCP generally use this unit.


    The [Timer] Section

    This section is used to schedule system events. At some specific time, either
    measured on a clock, on the calendar, or after a certain delay. This unit file
    is meant to replace the traditional function of the cron daemon. A unit file,
    such as a service unit, must be created, to be activated when the timer is “triggers",


