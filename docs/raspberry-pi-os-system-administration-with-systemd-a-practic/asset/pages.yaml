    Example, create a simple webserver with the Python built in, on an LXC container,
    and expose it in a public IP address, using bridging, so that it can be viewed
    on the Internet.


    > ***Note***


    Be careful to set the parameters of your router firewall correctly, as well as
    the firewall of the LXC container, so that hackers can’t penetrate both your network,
    the LXC container, and the Raspberry Pi OS system you’re using as an Internet
    server.'
