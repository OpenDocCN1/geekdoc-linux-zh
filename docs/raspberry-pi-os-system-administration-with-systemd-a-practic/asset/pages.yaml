    # 1.6 CUPS Printing


    You can configure and manage a printer for use on your Raspberry Pi system using
    the three basic methods we show in this section. These methods are generally applicable
    to printers that are connected to your computer, and this most likely is via a
    USB connection. We also briefly mention network-attached printers can be configured.

    The three basic methods are:


    +   1. A web-based browser CUPS interface,

    2. Using the Raspberry Pi OS Menu choice Preferences > Print Settings,

    3. Using the Raspberry Pi OS command line in terminal.


    The configured printer in all three methods is controlled and managed with the
    Common UNIX Printing System (CUPS).'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Raspberry Pi OS System Administration with systemd


    In method 1, we show a web-based front end to CUPS that allows you to manage printers,
    print jobs, and other configuration settings.

    In method 2, we show the built-in graphical front to CUPS, accessed via the Menu,
    which comes with the Raspberry Pi OS and achieves much of the same functionality
    as method 1.

    In method 3, we show a completely text-based interface for controlling and managing
    printers from the command line.


    What the Common UNIX Printing System (CUPS) Accomplishes:

    Using CUPS is a standard way of printing in both Linux and Unix. Since it was
    developed to provide as many printer definitions as possible, it will more than
    likely enable you to directly connect your model of printer or connect to a print
    server on your LAN.

    It is basically composed of two parts-a scheduler and a filtering system. The
    scheduler arranges jobs in print queues and sends them to the filtering system
    that translates the print data into device driver information for the particular
    printer you want your documents to print.


    # 1.6.1 Managing CUPS Locally with systemd


    Using systemd, with the systemctl command, allows you to start, stop, reload,
    or restart the CUPS service. This is a higher level of management for your local
    printers via a system service.


    # 1.6.1.1 Starting CUPS Service Using systemd


    In the Raspberry Pi OS, when you attach a new printer via a USB cable to the hardware,
    it will generally be automatically recognized and attached via CUPS. If the CUPS
    service has not already been started, it will be automatically started and run
    when connecting the new printer. To start the CUPS service without having any
    printers attached or powered on, do the following:

    To start the CUPS service, and check its status, use the following commands:


    ```

    $ sudo systemctl start cups

    $ sudo systemctl status cups

    ● cups.service: CUPS Scheduler

    Loaded: loaded (/lib/systemd/system/cups.service; enabled; vendor preset: enabled)

    Active: active (running) 2022-10-06 00:00:45 PDT; 10h ago

    Triggered: ● cups.socket

    ● cups.path

    Docs: cupsd(8)

    Main PID: 11613 (cupsd)

    Status: "Scheduler is running..."

    Tasks: 1 (limit: 4164)

    CPU: 33ms

    CGroup: /system.slice/cups.service

    └-11613 /usr/sbin/cupsd -l

    ```'
