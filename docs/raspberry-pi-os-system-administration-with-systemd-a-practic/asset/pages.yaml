  md: 'Assemble and start all arrays in the default mdadm config file. This command
    will typically go in a system startup file:


    ```

    $ mdadm --stop-scan

    ```


    Shut down all arrays that can be shut down (i.e., are not currently in use). Typically
    found in a system shutdown script:


    ```

    $ mdadm --create /dev/md0 --level=1 -raid-devices=2 /dev/sd[ac]1

    ```


    Creates /dev/md0 as a RAID1 array consisting of /dev/sda1 and /dev/sdc1:


    ```

    $ mdadm --Ac partitions -m 0 /dev/md0

    ```


    Scan all partitions and devices listed in /proc/partitions and assemble / /dev/md0
    out of all devices with a RAID superblock with a minor number of 0:


    ```

    $ mdadm --incremental --rebuild-map --run --scan

    ```


    Rebuild the array map from current arrays, and then start any that be started:


    ```

    $ mdadm /dev/md4 --fail detached --remove detached

    ```


    Any devices which are components of /dev/md4 will be marked as faulty and then
    removed from the array:


    ```

    $ mdadm --grow /dev/md4 --level=6 --backup-file=/root/backup-md4

    ```


    The array /dev/md4, which is currently a RAID5 array, will be converted to RAID6.
    There should normally already be a spare drive attached to the array, as a RAID6
    needs one more drive than a matching RAID5:


    ```

    $ mdadm --create --help

    ```


    Provide help with the Create mode:


    ```

    $ mdadm --help

    ```


    Provide general help:


    ```

    $ mdadm --manage --help

    ```


    Provides help topics on the management commands and options of mdadm RAID.'
