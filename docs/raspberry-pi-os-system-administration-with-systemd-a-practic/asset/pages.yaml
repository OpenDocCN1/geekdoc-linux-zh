    At the time this book was written, "vacuuming", or cleaning out journal files,
    only works on archived files and corrupted files, and does not work on active
    log files!


    You can find out the amount of space that the active and archived journals are
    currently occupying disk by using the --disk-usage option of journalctl command:


    ```

