    Objectives: To create a RAID-1 mirrored pair on two flash drives attached to your
    system, using the facilities of Webmin to accomplish the same things that the
    mdadm commands do. Additionally, clone your home directory on the system to the
    RAID-1 mirrored pair, segregating the system files from your user data files in
    order to maintain a secure level of redundancy, for our recommended data storage
    model.


    Prerequisites:


    +   a. Having two equal-sized USB flash drives available that you want to sacrifice
    for this example.

    b. Having some familiarity with Webmin after doing Section 1.2.


    Background: Webmin has the ability to manage RAID arrays on a Raspberry Pi system.
    In this example, you will use Webmin, mdadm, and the gnu disk management program
    in conjunction, to accomplish the mirroring of two USB flash drives in a RAID-1
    configuration, and also clone your home directory onto mirrored pair.


    If you haven''t done Example 1.5, the following ***Special Note*** is applicable
    to you in this case:


    > ***Special Note***nUpon installation of mdadm on the Raspberry Pi OS, at the
    time of the writing of this book, mdadm was masked by system. It seems the unmask
    command fails when there is no existing unit file in the system other than the
    symlink to /dev/null. If you mask a service, then creates a new symlink to /dev/null
    in the directory /etc/systemd/system, where systemd looks for unit files to load
    when the system boots up. Therefore, in essence, there is no unit file.'
