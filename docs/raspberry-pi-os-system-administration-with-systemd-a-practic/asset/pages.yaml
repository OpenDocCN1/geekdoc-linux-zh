    # 1.18 How a Process Gets Its Credentials


    Each Linux Raspberry Pi OS process, or task, has a number of data identifiers
    that are created by the relevant system calls to maintain process''s autonomy
    and the steady state of the multi-programming model. These identifiers are critical
    to authentication checks on processes. As examples, a child process created by
    the fork system call inherits its parent''s session ID and group ID. A process''s
    session and group ID are maintained across an exec system call. These identifiers
    include objects such as Process (PID), Parent Process ID (PPID), Group ID and
    Session ID, and User and the data structures associated with them, play directly
    into the Raspberry Pi OS security model. Most important to our security are User
    and Group Identifiers.


    In terms of process authentication checks, User and Group Identifiers are listed
    as real user and group ID, the effective user and group ID, the saved set-user-ID
    and set-group-id, the specific file system user and group ID, and supplementary
    group IDs.


    The interaction of assignments of these identifiers is complex but can be prioritized
    as follows:


    +   * Privileged processes (UID=0) have access to everything.

    * The effective UID is the same as the owner''s UID; access is given by the owner''s
    permissions on a file object.

    * The effective GID, or supplementary GID''s matching the owning group GID, permission
    is given by the owning group permissions on the file object.

    * Finally, access permissions are given by the “other” permission on the file
    object.


    Additionally, a process''s user IDs are applied in other ways, such as:


    +   1. When determining the permissions for sending signals, such as the kill
    signal.'
