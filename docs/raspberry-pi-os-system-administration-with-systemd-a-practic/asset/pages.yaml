    In this chapter, we give a novice user a brief, but useful, introduction to the
    Linux “superkernel” known as systemd. Unless that novice user, or even a seasoned
    system professional, finds not only a basic, but also a more complete knowledge
    of how systemd controls and oversees every process operation of a modern Linux
    system, they will never be able to master administrating and implementing the
    kind of functionality that their case(s) might ultimately require. Particularly
    for the user base on the system, and the demands that the user bases makes.


    Everything illustrated in this chapter, in the specific form (and the syntax of
    commands) found here, is explicitly applicable to the Raspberry Pi OS.


    The selective choices of subject matter are made according to the pedagogical
    needs of a beginner, as it follows from the system administration materials that
    precede it in the last chapter.


    Anything that you are required to type on the command line is shown in bold type,
