    \ The following sections detail the use of some of these other important systemd\
    \ commands.\n\n# 2.6.1 Cgroups\n\nControl groups (cgroups), included as part of\
    \ systemd in the Linux kernel, allow you to create prioritized, and structured\
    \ groups of processes running on your system. They are invoked by the systemctl\
    \ command. Considering the various ways of using cgroups, the most important one\
    \ is to monitor and control Raspberry Pi OS resources. Cgroup monitoring, assessment,\
    \ and control is used via systemd unit files. It can be transient or persistent.\n\
    \nThe systemd-run command is used to create and start a transient unit as its\
    \ own cgroup self-contained module, and run a Linux command in that unit.\n\n\
    To create persistent cgroups, it is necessary to build service unit files for\
    \ them in the /etc/systemd/system directory. That directory is the standard location\
    \ for user-installed and user-defined services in system.\n\nThe objective of\
    \ this section is to provide a pictorial description of the cgroup \"tree\", give\
