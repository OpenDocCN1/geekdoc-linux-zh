  md: '# "Quick Start" 7


    The usage of the cp command has two required command arguments. The first argument
    is the source file that already exists and which you want to copy. The second
    argument is the destination file or the name of the file that will be the copy.
    Be aware that many Raspberry Pi OS commands can take plain, ordinary, or regular
    files as arguments, or take directory files as arguments. This can change the
    basic task accomplished by the command. It is also worth noting that not only
    file names are but pathnames as well. A pathname is the route to any particular
    file in the file system structure of the operating system. This changes the site
    or location, in the path structure of the file system, of operation of the command.


    In order to change the name of a file or directory, you can use the mv command.
    The general syntax of the mv command is as follows:


    ```

    mv [options] file1 file2

    mv [options] file-list directory

    ```


    +   Purpose: First syntax: Rename file1 to directory

    Second syntax: Move all files in the file to directory

    Output: Renamed or relocated files

    Commonly used options/features:


    +   -f Force the move regardless of the file access modes of the destination file

    -i Prompt the user before overwriting the destination


    In the following usage, the first argument to the mv command is the source file
    name, and the second argument is the destination name.


    ```

    $ mv myfile2 renamed_file

    ```


    It is important at this point to notice the use of spaces in names of Raspberry
    Pi OS commands. What if you obtain a file from a Windows system that has one or
    more spaces in one of the file names? How can you work with this file in Raspberry
    Pi OS? The answer is simple. Whenever you need to use that name in a command as
    an argument, enclose the file name in double quotes (“”). For example, you might
    obtain a file that you have “detached” from an e-mail message from someone on
    a Windows system, as latest revisions october.txt.


    In order to work with this file on a Raspberry Pi system – that is, to use the
    file name as an argument in a Raspberry Pi OS command – enclose the whole name
    in double quotes. The correct command to rename file to something would be:


    ```

    $ mv “latest revisions october.txt” laterevs.txt

    ```


