    # 1.2 Webmin Download and Installation


    This section details how to install and do a very basic configuration of Webmin
    on the Raspberry Pi OS. Webmin has a GUI control for doing many system administration
    tasks, and most importantly, it is a web-based interface that can be effectively
    used to manage your system. Webmin can set up user and group accounts, install
    web servers, initialize file sharing, and many other common system administration
    activities. Webmin is time-effective for beginners who do not know much about
    the Linux command line or want a simpler, more intuitive graphical interface to
    the system.


    Example 1.1 will lead you through the step-by-step download, installation, and
    initial but critical configuration of Webmin on the Raspberry Pi OS. The instructions
    given here were executed on Raspberry Pi 400.


    # Example 1.1 Webmin Installation on Raspberry Pi OS


    +   Type the following command line to prepare your system by installing dependencies:


    ```

    $ apt-get install perl libnet-ssleay-perl openssl libauthen-pam-\nperl libpam-runtime
    libio-pty-perl apt-show-versions python \

    shared-mime-info

    ```


    +   Type the following to download Webmin.


    ```

    $ wget http://prdownloads.sourceforge.net/webadmin/webmin_\1.998.all.deb

    ```'
