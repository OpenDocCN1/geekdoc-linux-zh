    # 2.6.3 systemd Timers


    systemd takes on many of the functions and facilities that legacy Cron did, via
    support for clock-time-based, and calendar-time-based events.


    From a system administrator''s perspective, systemd can do Cron-like scheduling
    of system events. We give examples of block-time-based running of a single script,
    and calendar-based scheduling of events.


    In order to get a complete description of how systemd deals with time-based specifications
    and operations, see the man page for systemd.


    # 2.6.3.1 An Example of Clock-Time-Based Running of a Script


    If you have a script /usr/local/bin/myscript that you want to run every hour,
    do the following steps:


    +   1. Create a service file, named myscript.service, with your favorite editor.
    Save it in /etc/systemd/system/, with the following content:


    ```

    [Unit]

    Description=Whatever MyScript


    [Service]

    Type=simple

    ExecStart=/home/bob/myscript

    ```


    Note that it is important to set the Type variable to "simple," not "oneshot.\
    If you specify "oneshot", the script will be run the first time, and then systemd
    will not run it again, and will turn off the timer.


    +   2. Create the following timer unit file, in the same directory as the service
    unit above.


    ```

    [Unit]

    Description=Runs myscript every hour


    [Timer]

    # To wait after booting before we run first time

    OnBootSec=10min

    # Time between running each consecutive event

    UnitActiveSec=1h

    Unit=myscript.service


    [Install]

    WantedBy=multi-user.target

    ```'
