  md: '# Applications of systemd for the Beginner 209


    The journal also accepts some relative values, and English-language shortcuts.
    For example, you can use the words “yesterday,” “today,” “tomorrow,” or “now.”
    You do relative times by placing these symbols before arguments: “-" or “+\” to
    a numbered value or using words like “ago.” To get the data from yesterday, use
    this command:


    ```

    $ journalctl -since yesterday

