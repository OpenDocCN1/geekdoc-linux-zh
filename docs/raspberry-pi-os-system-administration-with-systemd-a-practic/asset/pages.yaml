  md: '# Raspberry Pi OS System Administration with systemd


    We will mainly be focusing on .service unit files, and their editing and creation,
    for the ordinary user of a Raspberry Pi system. This is due to the fact that they
    are most useful for an ordinary user, and the cases she might put the system to.
    We will also detail, to some extent, their use by an appointed system administrator
    to manage the state of the system in general. Aside from .service unit files,
    all of the other unit types are basically coordinating and synchronization tools,
    link services to hardware, cgroups, IPC sockets, timing constraints, etc. This
    coordination and synchronization is the hallmark and greatest advantage systemd
    has, and its major advantage over older UNIX or Linux init system(s).


    # 2.3.5 Anatomy of a Unit File


    The internal structure of unit files is segregated into sections. Sections are
    delimited by a pair of square brackets “[" and "]", with the section name enclosed
    in the brackets. Each section extends until the beginning of the next section
    or until the end of the file.


    # 2.3.5.1 An Example Service Unit File – ssh.service


    It would be very instructive at this point to show the structure, and the exact
    contents of a typical service unit file. Figure 2.2 shows the contents of the
    ssh unit file on our Raspberry Pi system, found in /lib/systemd/system. You should
    carefully look at this figure while reading an actual service unit file (perhaps
    the ssh service file on your system) for comparison.


    # 2.3.5.2 The General Format of Unit Files


    As seen in Figure 2.2, the sample file is divided into sections. Section names
    are case-sensitive, and enclosed in square brackets []. Within each section, the
