    # Introduction – Icebreaker with inxi and FileZilla


    To expand your beginner’s knowledge of system administration topics and commands,
    we present more advanced concepts, topics, commands, and details here.


    The overriding idea behind system administration of a modern, 21st-century Linux
    system, and for a Raspberry Pi OS in particular, is the use of systemd to ensure
    the Linux kernel works efficiently and effectively to provide a computer system
    concurrency, virtualization, and secure persistence. And this control of the kernel
    by a “superkernel” (which is systemd essentially essentially) must also promote
    the highest level of system performance and speed, given the use cases the computer
    might be put to and the perceived needs of the target user base that the computer
    serves.


    Certainly out of the multitude of possible topics we could have presented, the
    ones you find here have been selected in somewhat of a subjective way. That selective
    way was mainly given by these concerns:


    +   a. The secure maintenance, in terms of currency, virtualization, and persistence,
    of a single Raspberry Pi computer system that an ordinary user can install on
    their own personal computer.


    +   b. How important are the topics in a perceived ranking of essential system
    administration tasks.


    +   c. How systemd plays into the maintenance regimen chosen by that ordinary
    user.


    +   d. The overall pedagogical integration of the selected topics presented on
    system administration.


    +   e. How well these topics serve to prepare a beginner for entry into any chosen
    Information Technology or Computer Science profession, or how someone already
    in those professions can use this chapter to better their practice of profession.
    For educational and continuing education audiences.'
