    # 2.6.2.2 Using the journalctl Command to Query the Journal


    The journalctl command is a convenient way of querying entries in the

    journal database. Following is a synopsis of the command, extracted from

    the journalctl manpage


    # journalctl - Query the systemd journal


    Syntax:


    ```

    journalctl [options...] [matches...]

    ```


    Purpose:

    journalctl may be used to query the contents of the systemd journal as written

    systemd-journal.service.

    If called without options or arguments, it will show the full contents of the
    journal,

    starting with the oldest entry collected.

    All users are granted access to their private user-journals. However, by default,

    only root users who are members of a few special groups are granted access to
    the

    system journal and the journals of other users.


    +   -a, --all Show all fields in full, even if they include unprintable

    characters or are very long.

    -f, --follow Show only the most recent entries, and continuously

    print new entries as they are appended to the journal.

    -r, --reverse Reverse output so that the newest entries are displayed first.

    -u, --unit=UNIT|PATTERN Show messages for the specified system unit UNIT (such
    as

    a service unit), or for any of the units matched by PATTERN.

    -S, --since=, -U, --until= Start starting entries on or newer than the specified

    date, or on older than the specified date, respectively.

    Date specifications should be of the format "2012-10-30

    18:17:16".


    To get more information about the use of the journalctl command, particu-

    l about the structure that the command uses to query the journal, examine

    the man journalctl command contents as necessary on your system.


    # 2.6.2.3 Journal Logging Basics and Applied to the Webserver2 Program


