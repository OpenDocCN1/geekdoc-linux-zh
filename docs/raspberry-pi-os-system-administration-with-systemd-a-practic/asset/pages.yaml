    # 1.15 Raspberry Pi OS NFS Server and Client Install

    and Setting NFSv4 ACLs on the Client


    The NFSv4 ACL model is very similar to the Windows NT ACL model. The

    major differences between NFSv4 and the POSIX.1e ACLs, as they were

    illustrated in the sections above, are as follows:


    +   - NFSv4 ACLs provide finer-grained permissions than the rw model.

    - NFSv4 ACLs allow for Allow and Deny entries.

    - NFSv4 ACLs provide more complete and extensive inheritance syntax

    and contents. POSIX.1e ACLs also have inheritance, but with

    NFSv4 model, as far as directories are concerned, you can specify

    whether inheritance is applied to the directory itself, to just one level

    of subdirectories below that, or is propagated downward to all

    subdirectories of the upper-level directory.

    - NFSv4 ACL enable administrators to designate the order in which

    ACL entries are verified. With POSIX.1e ACLs, the file system itself

    reorders ACL entries into a definite, strict access checking order.'
