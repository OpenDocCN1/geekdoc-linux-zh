  md: '# 208 Raspberry Pi OS Administration with systemd


    2.6.2.3.2 Journal Query Structures

    The main purpose of collecting the log information together from many sources,
    centralizing them in one place, such as in the journal, is to be able to quickly
    and easily look at and take action based on the entries in the log that are important
    to you for some reason. That could be true of an ordinary desktop user, or a server
    system administrator.


    Because of this, the most important features of the journalctl command''s options,
    and arguments, is its methods of ordering, and making inquiries into the journal,
    or separating out more useful, understandable, and compact information from it.
    Following are some of the ways these searches through the log can be.


    For example, the journal has "field headings" that can be used for inquiry. Each
    of these fields acts as an index, or to specific kinds or sets of entries in the
    journal. Some of these fields are passed to the process being logged, and some
    are applied by the daemon journal, with data it gathers from the system at the
    time the log is from.


    A leading underscore indicates that a field is of the latter type. The journal
    automatically records and indexes logs for that type of query. You can get more
    information about all of the available journal fields by typing:


    ```

    $ systemd-journal-fields

    ```


    2.6.2.3.3 Querying by Time

    You can also see parts of the log in a "from-to" display. You would likely want
    to do this when the system has been operating for a long time without a reboot.
    You can do an inquiry by using the --since and --until options, which limit the
    entries displayed to those after, or before specified times.


    The time parameters are in a variety of formats. For absolute time values, you
    should use the following format:


    ```

    YYYY-MM-DD HH:MM:SS

    ```


    For example, we can see all of the entries since 2022-04-04 07:52:30 PDT using
    this command:


    ```

    $ journalctl --since "2022-04-04 07:52:30 PDT"

    ```


    If parts of the time specification argument are left off, standard defaults are
    used instead. For example, if the date is omitted, the current date will be used.
    If the component is missing, "00:00:00" (midnight) will be used. The seconds field
    can be left off to default to "00":


    ```

    $ journalctl --since "2022-04-04 " --until "2022-04-04 08:30:00 PDT"

    ```'
