    Oct 06 00:00:45 raspberrypi systemd[1]: Starting CUPS Scheduler...

    Oct 06 00:00:45 raspberrypi systemd[1]: Started CUPS Scheduler.


    We see from the output that CUPS is running.


    # 1.6.1.2 Stopping CUPS Service with systemd


    The CUPS service can be stopped using the systemctl stop cups.service command,
    as follows:


    ```

    $ sudo systemctl stop cups.service

    ```


    When you check the status of the CUPS service after stopping the CUPS service,
    its status is inactive (dead), but still enabled.

    Enabled means it will persistently start every time the system is rebooted.


    # 1.6.1.3 Restarting, Enabling, or Disabling the CUPS Service with systemd


    Restarting a service means that a service is stopped and then started again. If
    the service is not currently running, restarting it simply starts the service.
    Use the following command to restart the CUPS service:


    ```

    $ sudo systemctl restart cups.service

    ```


    You can also perform a conditional restart of a service using systemctl. A conditional
    restart only restarts a service if it is currently running. Any service in an
    inactive state is not started.


    ```

    $ sudo systemctl constrestart cups.service

    ```


    In the above command example, the CUPS service was in an inactive state before
    the command was executed. When the conditional restart is accomplished, no error
    messages appear. The dap daemon was not started because conditional only affect
    active services.

    It is always a good practice to check the status of a service after stopping,
    starting, or conditionally restarting it.


    # 1.6.1.4 Configuring CUPS as a Persistent Service Using systemd


    You can use the systemctl command to enable or disable the CUPS services on your
    Raspberry Pi OS server, whether that is local or remote.

    Using the enable option on the systemctl command sets a service to always start
    at boot (be persistent). The following shows exactly how to accomplish this:


    ```

    $ sudo systemctl enable cups.service

    ```'
