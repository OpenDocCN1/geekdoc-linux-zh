  md: '# Disabling a service with systemd:


    You can use the disable option on the systemctl command to keep a service from
    starting at boot. However, it does not immediately stop the service. You need
    to use the stop option discussed in the "Stopping a service with systemd" section.
    The following example shows how to disable a currently enabled service.


    ```

    $ sudo systemctl disable cups.service

    ```


    # 1.6.2 Using Web-Based CUPS Administration


    CUPS offers its own web-based administrative tool for adding, deleting, and modifying
    printer configurations on your computer. The CUPS print service (using the cups
    daemon) listens on port 631 to provide access to the CUPS web-based administrative
    interface and share printers. You can use the CUPS web browser GUI to manage your
    printing environment, both locally and on a LAN or the Internet, in the Raspberry
    Pi OS. This section describes the requirements for using the web browser interface
    and the administrative tasks you can perform.


