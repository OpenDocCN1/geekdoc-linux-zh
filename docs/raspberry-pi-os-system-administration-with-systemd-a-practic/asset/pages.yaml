    # Example 1.11 Setting and Viewing Default ACLs


    Objectives: To give some simple cases of setting and viewing default ACLs. Prerequisites:
    Completion of Example 1.10. Additionally, and perhaps most importantly, review
    material related to umask, particularly the umask is set depending upon whether
    or are not working in a login or non-login terminal. The premise of this example
    is that you are giving the following commands and working in a non-login terminal.

    Background: Directories can have a default ACL, which is a special kind of ACL
    defining the access permissions of objects in the directory inherit when they
    are created. A default ACL affects both sub-directories and files.

    There are two ways the permissions of a directory''s default ACL are passed to
    files and sub-directories: a sub-directory inherits the default ACL of the parent
    directory as its default ACL and as its ACL, or a file inherits the default ACL
    as its ACL.

    If the parent directory does not have a default ACL, the permissions defined by
    the umask are subtracted from the permissions that are given by the system call
    access mode parameter. If a default ACL exists for the parent directory, the permission
    bits assigned to the new object correspond to the overlapping portion or logical
    “intersection” of the permissions of the system call-mode parameter, discussed
    below, and those that are defined in the default ACL.'
