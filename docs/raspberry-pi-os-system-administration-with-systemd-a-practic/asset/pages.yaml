  md: '# Raspberry Pi OS System Administration with systemd


    The following sections give examples of adding directly connected disks to a Raspberry
    Pi OS system.


    Additionally, we suggest an approach, when using the recommended storage model
    we give in Section 1.1, to adding persistent media to your Raspberry Pi OS system.


    That approach is a more traditional method, when you properly connect the device
    to the computer with cables, partition that medium, manually add a file system
    to it (typically the FAT32 or ext4 file system), and then finally create directories
    and files in the partition(s) on the media. The following sections detail this
    more traditional approach.


    According to our organizing scheme, a file system can be separated into three
    hierarchically arranged layers that perform very particular functions. These layers,
    arranged from farthest-to-nearest to the actual hardware of the drives or persistent
    media in this, are as follows:


    # The Logical Layer


    This layer is for interaction with user application programs and the processes
    they consist of Linux system calls. It provides the application programming interface
    (API) for file operations, for example, system calls to OPEN, CLOSE, READ, etc.,
    and connects with the layer below it for processing. The logical layer achieves
    efficient file access, logic-organized directory operations, and provides user
    autonomy and security.


    # The Virtual Layer


    This layer provides the interface mechanisms for maintaining multiple, simultaneously
    executing implementations of physical and virtual file systems on the same computer.
    For example, it is possible to move and use NFSv4, btrfs, ext3, ext4, fat32, and
    ZFS at the same time on the same system and operate with files from all of those
    implementations as if they were all of the same type.


    The Linux IO (LIO) block is known as anSCSI "target," and represents virtual connectivity
    to persistent media from various network connections. These connections traditionally
    use high-speed Fibre Channel technology to create a Storage Area Network (SAN),
    but most importantly can also be achieved using Ethernet and TCP/IP.


    A more detailed approach of classifying virtual file systems further separates
    that layer into block-based, network, stack-, pseudo, and special purpose categories.
    Many of the different implementations of file systems, such as NFSv4, ext4, btrfs,
    initramfs, and the procs, would be situated within the Virtual File Systems blocks.
    Two very contemporary and extremely important virtual file systems are the cgroups
    file system (cgroupsfs) by systemd, and the userland, block-based file system,
    ZFS.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# Basic System Administration


    The Physical Layer


    This layer is concerned with the physical operation of the persistent storage
    device. It processes blocks being read or written. It handles buffering and memory
    management and is responsible for the physical placement of blocks in specific
    locations on the storage medium. The physical file system interacts with the device
    drivers or with the channels that physical devices communicate. At a certain level
    of simplification, this layer can be schematically represented by the integrated
    grouping of the Block Layer, SCSI Layer, and the Physical Device Layer.


    Furthermore, and as a very integral part of the operation of the Linux kernel,
    as it exists in a transient and volatile state as we have defined, the pseudo
    and pseudo-parallel file systems can be viewed as series of conduits through which
    the entire system itself “flows.” Thinking along these lines, when the kernel
    is in the CPU and attendant RAM, the kernel code itself is organized as a file
    system. The kernel (or systemkernel) can be viewed as a file system of volatile
    data structures that maintains the steady state of the hardware and software using
    these conduits exclusively; this achieves the overlapping goals of virtualization,
    concurrency, user-autonomy, security, and necessary archival, long-term data persistence
    on the file systems that are established to do so.


    Over the history of Linux, various file systems have been used to provide speed,
    efficiency, security, and utility to the ordinary user. The most prominent and
    universal of these, across the three major branches of Linux, is the Linux Extended
    File System (ext). The Raspberry Pi OS which we show in this book uses it as the
    default file system.


    The fourth version of ext, ext4, is the current and most robust version so far.
    It has several features, such as large scalability, the ability to map to very
    large disk array sizes, and other very critical features, such as journaling.
    Following is a compact list of some of the features of ext4:


    +   a. It can support volumes with sizes up to 1 exabyte and files with sizes
    up to 16 terabytes.

    b. It uses “extents” mapping scheme, which replaces block mapping used by earlier
    versions of ext. An extent is a range of contiguous physical blocks.

    c. It is backward-compatible with ext3 and ext2. Therefore ext3 and ext2 can be
    mounted as ext4.

    d. It delays block allocation until data is flushed to disk.

    e. It has an unlimited number of subdirectories that can be created.

    f. It has a multi-block allocator that can make better choices about allocating
    files contiguously on disk.

    g. It provides timestamps measured in nanoseconds.'
