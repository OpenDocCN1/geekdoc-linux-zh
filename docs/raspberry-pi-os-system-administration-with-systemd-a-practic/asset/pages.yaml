    # 1.6.13.1 CUPS Command-Line Utilities


    CUPS provides various commands to set up printers and make those printers accessible,
    both on a local machine where the printer is directly connected to, and on systems
    on a LAN or the Internet. In addition, CUPS supports several printer-specific
    options to the command-line utilities that enable you to control printer configuration.
    Table 1.3 lists frequently used CUPS commands.

