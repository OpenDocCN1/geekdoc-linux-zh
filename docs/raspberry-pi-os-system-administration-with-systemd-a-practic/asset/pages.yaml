    # 1.9 Tasks, Processes, Threads, and Traditional Process Control/Monitoring


    Before discussing traditional methods of process control, it is instructive at
    this point to know what a “task” refers to the Raspberry Pi OS. In particular,
    knowing what the difference is, if any, between a process and a thread, in the
    context of Linux tasks. And this is useful knowledge, especially with respect
    to the kernel itself. To clear the differences between tasks, processes, and threads,
    consider this set of comparisons between them:


    A preliminary sketch of what a Linux “task” is, relative to processes and threads,
    and with reference to the kernel, is as follows:


    In Linux, a task and a thread are synonymous on a conceptual level.


    A process at this level can be thought of as a completely independent virtual
    environment, which runs at least one task. A very good example is a single-thread
    process.


    Each task is an independently executing module within the virtual environment
    of process.


    The main task of a process (usually called the “leading thread”), defines the
    Task ID (TID) number, which is same as the nominal Process ID (PID) number.


    Every new thread that is spawned by a process, using system calls, creates a new
    task within the process.


    In order to identify these tasks in the kernel, they get their own individual
    Task ID (TID) number.'
