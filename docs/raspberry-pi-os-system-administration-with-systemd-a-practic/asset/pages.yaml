    # 1.1.2 FileZilla


    FileZilla is nominally a graphics-based ftp client and server program that can
    use ssh as the tunnel or conduit between systems. It has a number of useful functions
    and menu that allows the system administrator to successfully, confidently, and
    efficiently backup and restore single files or directories via a network globally.
    It is most useful for backing up and restoring single-user files and directories.


    It is not a replacement or substitute for the command-line facilities shown in
    the following sections. 1.1 illustrates the screen display and menus available
    in the "client" version of FileZilla.


    Both client and server, in our case, a local machine running the Raspberry Pi
    OS and a remote machine running the OS, must have ssh communications enabled between
    them. To see more about establishing ssh between Raspberry Pi systems, see Section
    1.3. You can have login access to an account on the remote server, or you can
    anonymously log in all if that is enabled.


