  md: '# 1.5.1 Preliminary Considerations When Adding New Media


    If you insert a USB flash drive that you know is functioning properly into your
    computer, and it is not recognized, the chances are that your Raspberry Pi system
    does not have a device driver available to enable communication between the computer
    and the flash drive.


    How do you know if a new disk drive is recognized, and most importantly, is usable
    on your system?


    There are at least three quick and easy ways to know if the new disk drive is
    recognized.


    +   - If it is a USB flash drive and it is formatted to FAT32, the Raspberry Pi
    OS system will auto-mount it, and an icon for it will open on the desktop (along
    with a folder view of its contents).

    - In a terminal window, you can use the command systemctl -f and watch the screen
    display. It will show that a new device has been added, even though, in the case
    of a USB flash drive, it might be formatted to something other than FAT32.

    - Use the before-and-after technique shown in Section 1.5.2.


    The same is true when you connect a SATA hard drive properly, but the probability
    of it being recognized is much lower. The best and easiest way to do in a case
    like this is to use other USB or SATA device. The Raspberry Pi system has facilities
    to find and install device drivers on your system for a device, but this process
    is time-consuming and may not be fruitful for the particular device in question.
    Also, writing a driver for your device is possible, which is even more time-consuming.
    The important thing is that it is not the USB flash drive is formatted to FAT32,
    but that a manufacturer has the device drivers available automatically when their
    device is inserted. This is not always true.


    In many instances, it is important to know the physical device name, the instance
    name, and the logical device name of disk drives on your system, but practically
    speaking, for the Raspberry Pi OS administrator, easily finding the logical device
    name of a disk drive is most important.


    You may want to add an external medium to your Raspberry Pi system that has been
    used on another computer operating system previously. In that case, the primary
    and secondary examples we show can be deployed to repartition and prepare hard
    disk for new use on your system.


