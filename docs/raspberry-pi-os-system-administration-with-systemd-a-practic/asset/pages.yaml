    # How to Read and Use This Book


    ***Note***nThe premise and prerequisite of this book is that you know the correct
    form, or structure, of a single Linux command is, and how to type one in in the
    console or terminal line!


    Just to review, the general syntax or structure of a single Linux command (often
    referred to as a simple command) as it is typed on the command line, is as follows:


    ```

    $ command [-option(s)] [option argument(s)] [command argument(s)]

    ```


    where:


    $ is the command line or shell prompt from the Raspberry Pi OS;

    anything included in [] is not needed.

    command is the name of the valid Linux command for shell in lowercase letters;

    [-option(s)] is one or more modifiers that change the behavior of command;

    [-option argument(s)] is one or more modifiers that change the behavior of

    [-option(s)]: and

    [command argument(s)] is one or more objects that are affected by command.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Volume 1 Preface


    Note the following six essentials:


    +   1. A space separates command, option, option arguments, and command arguments,
    but no space is necessary between multiple option(s) or multiple option arguments.

    2. The order of multiple options or option arguments is irrelevant.

    3. A space character is optional between the option and the option argument.

    4. Always press the <Enter> key to submit the command for interpretation and execution.

    5. Options may be preceded by a single hyphen - or two hyphens, --, depending
    on the form of the option. The short form of the option is preceded by a single
    hyphen, and the long form of the option is preceded by two hyphens. No space character
    should be placed between hyphen(s) and option(s).

    6. A small percentage of commands (like whomami) take no options, option arguments,
    or command arguments.


    Everything on the command line is case-sensitive!


    Also, it is possible, and very common, to type multiple Linux commands (sometimes
    compound commands, to differentiate them from simple commands) on the same command
    line, before pressing the <Enter> key. The components of a multiple Linux command
    are separated with input and output redirection characters, to channel the output
    of one into the input of another.


    As stated in the Series Preface


    An online Github site, with further materials and updates, program code, solutions
    to both In-Chapter and End-of-Chapter Problems, Questions, and Projects, and other
    supplements, is provided for this book. It can be found at www.github.com/bobk48/RaspberryPiOS


    All command line instructions in this volume were tested on either a Raspberry
    Pi 4B, or a Raspberry Pi 400, with 4GB of memory, the latest version of the Raspberry
    Pi OS at the time.'
  merge: -1
