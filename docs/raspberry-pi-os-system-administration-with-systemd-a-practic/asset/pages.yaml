    A unit works and affects traditional system services, network resources, devices,
    file system mounts, resource pools known as Control Groups, and very transient
    tasks such as single Linux commands. Some of the key advantageous features that
    units have:


    +   - socket-based activation: The delay of the start of service until activation
    of its socket(s). This feature is crucial in making the system run faster and
    the startup process itself much faster.

    - D-bus activation: Units can be started when an associated bus is published.

    - path-based activation: A unit can be started based on activity, or on the availability
    of, certain file system paths.

    - udev device-based activation: Start until the first piece of hardware becomes
    available. This feature is also crucial in making the system faster, and startup
    faster.

    - implicit dependency mapping: Most of the dependence between units, during their
    start time, can be built by systemd itself, although by editing and changing the
    dependencies between units, this can be modified by the user.

    - instances and templates: Template unit files can be used to create multiple
    instances of the same general unit. This is very critical and efficient in operating
    system virtualization via containers and virtual machines!

    - security: Units can implement security features, via the use of directives in
    the unit file.

    - drop-ins and snippets extensibility: Units can easily be extended by providing
    modifiers that will override all properties of the system''s unit file.


    We address many of the above features in the following sections.


