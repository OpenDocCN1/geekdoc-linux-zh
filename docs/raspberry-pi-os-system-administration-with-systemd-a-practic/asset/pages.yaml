- img_proc: true
  md: 'All tasks within a process share the same Thread Group ID (TGID) number. A
    more complete description of what the difference is between processes and threads
    is given by the following listing of points:


    +   1. With respect to the Linux kernel, a task that can be run and scheduled
    through the CPU is called a “process.”


    +   2. Each process has a globally unique Process ID (PID) number and a Thread
    Group ID (TGID) number.


    +   3. A “stand alone” process, or “single-threaded” process, has a PID that is
    equal to its TGID, and no other process can have this TGID value.


    +   4. A “threaded” process has its TGID value shared by other processes: they
    all have the TGID value.


    +   5. Processes sharing the same TGID also share the memory space, signal handlers,
    etc.


    +   6. If a “threaded” process has a PID that is equal to its TGID, it can be
    called “the thread lead.”


    In a systems program, making the system call getpid() from within a process will
    return its TGID (or “leading thread” PID).


    +   7. From within a process and making the system call gettid() from within a
    process will return its PID.


    +   8. Both a process and thread can be created with the very important Linux-specific
    clone() system call.


    +   9. “Numbered” folders in /proc, which you can list with the ls command, are
    TGIDs.


    +   10. “Numbered” folders in /proc/TGID/task contain numbers that are PIDs.


    11. Even though you don''t see every PID using ID /proc, you can still give the
    command cd /proc/any_PID, where any_PID is the PID of a process of interest.


    +   12. In conclusion, and with respect to the kernel, only processes exist. Each
    process has its own PID. A thread is just a different kind of process.


    Questions: “Are all processes threads, and why?”, “Is the Linux kernel itself
    a process, and what are the threads created by this process?”


    Answers: Since Linux is a multi-tasking, concurrent execution environment, all
    processes can be created through threads of execution through the system. And
    at the conceptual level we are addressing here, the Linux kernel is not a process,
    but can be thought of as simply a complex interrupt handler, that controls the
    movement of tasks as threads through the CPU and the CPU’s supportive virtualized
    memory system and persistent media.'
