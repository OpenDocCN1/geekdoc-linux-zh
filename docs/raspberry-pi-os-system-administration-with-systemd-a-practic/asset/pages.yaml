  md: '# Basic System Administration


    53


    That way, if one of the drives fails, the data is retained on the other disk

    in the mirror.


    In order to fully support redundancy in our recommended storage model,

    the Raspberry Pi OS makes available a Multiple Device Administration

    (mdadm) program to allow us to securely archive the user data component

    of that model. Redundant Array of Inexpensive Disks (RAID) devices are

    virtual devices created from two or more real block devices, SATA disks,

    or USB flash drives. This allows multiple devices, typically whole disk drives

    but also partitions on disks, to be combined into a single device to

    hold or multiple file systems. RAID “levels” include varying degrees

    of redundancy to enable the storage component to survive varying

    amamounts of device failure.


    To see a complete description of the mdadm command after installing the

    program on your system, see the page for mdadm. The following is a

    brief description, from that page, of mdadm syntax and use:


    mdadm manage md devices or Linux Software RAID

    Syntax: mdadm [mode] <raiddevice> [options] <component-devices>


    +   where-

    Assemble, Build, Create, Monitor, Grow, Incremental

    Assembly, Many, Misc,

    Auto-detect


    +   <raiddevice>

    Name to name your virtual device, eg. /dev/md0

    Mode-selection and other options.


    +   <component-devices>

    The physical devices to be assigned to the array, eg. /dev/sdb

    New software RAID device, or management of

    previously created one.


    +   Common Options:

    --config= Specify the config file or directory. Default is to use

    /etc/mdadm.conf and /etc/mdadm/mdadm.conf, or if those

    are missing then /etc/mdadm.conf and /etc/mdadm.mdadm.conf.


    +   -create Create a new array.

    -A,--assemble Assemble a pre-existing array.

    -G,--grow Change the size or shape of an active array.


    Example: sudo mdadm --create /dev/md0 --level=mirror -raid-devices=2

    /dev/[sd]c1


    As superuser, the array named md0 as a mirror of the first 2 partitions on

    physical devices, /dev/sdb and /dev/sdc


    Some other examples of mdadm syntax and use are as follows:


    $ mdadm --query /dev/name-of-device


    Find out if given device is a RAID array, or is part of one, and will provide

    brief information about the device:


    $ mdadm --assemble--scan'
