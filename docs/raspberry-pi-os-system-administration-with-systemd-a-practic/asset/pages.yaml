    |---|---|

    | 0 | The first column is the offset for the boot from 0, the current boot environment.

    | 0 d536f728b3da464cbf4e740e95addffda | An absolute reference, the boot ID is
    in the second column.

    | 2023-04-24 10:13:44 PDT—Sun 2023-04-30 12:30:15 PDT | The time that the boot
    spans, with two time specifications (from-to).|


    You can also use the boot ID to call back the data from boot 0:


    ```

    $ journalctl -b d536f728b3da464cbf4e740e95addffda

    ```


    2.6.2.2 The Current Boot


    To display journal logs from the current boot, using the following command:


    ```

    $ journalctl -b

    ```


    This will show you all of the journal entries that have been collected since the
    most recent reboot, particularly if you have done the procedures in the previous
    section and rebooted a number of times. You can monitor information about your
    current environment.


    2.6.2.3 Displaying Kernel Messages


    Kernel messages related to booting, those usually found in dmesg output, can be
    retrieved from the journal as well. To display only these messages, you can add
    the -k or --dmesg flag to the journalctl command:


    ```

    $ journalctl -k

    ```


    By default, this will display the kernel messages from the current boot. You can
    specify an alternative boot environment using the normal boot selection above,
    being sure that a persistent boot environment was enabled. For instance, to get
    the messages from five boots ago (if they exist in the journal!) you could type:


    ```

    $ journalctl -k -b -5

    ```


