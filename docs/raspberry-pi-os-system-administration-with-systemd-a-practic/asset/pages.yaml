  md: '# Applications of systemd for the Beginner


    # 2.6.1.3 Linux Namespaces


    There is a kernel-level construct in Raspberry Pi OS Linux, appropriately called
    "namespaces", which segregates and isolates the cgroup processes seen above in
    Section 2.6.1, and their system resources, in a separate and protected environment.
    This allows them to operate in their own process environments on the system. A
    very close analogy of namespaces, which you might be familiar with, is the concept
    of a variable''s "scope" in a high level computer programming language, as C or
    Python.


    Namespaces use the *clone* system to accomplish this process isolation. The biggest
    and most important use of namespaces is in the system-level creation, and maintenance,
    of Linux containers, such as LXD/LXC. For complete reference on namespaces, consult
    the man pages on your Raspberry Pi system for namespaces(7), and *user_namespaces(7)*
    – particularly the EXAMPLE on the user_namespaces man page, which gives an excellent
    and instructive C system programming implementation of the clone system used to
    create a child process that executes a shell command in a new namespace.


    # 2.6.2 Journal Logging


    System logging using log files is extremely useful for system administration.
    The logs record activity and events on a Raspberry Pi Linux system. Journal logging
    with systemd is very similar to the traditional methods available for logging.
    They are created so that the system administrator can carefully, systematically,
    and periodically audit the general operation of the system, especially regard
    to performance enhancements that have been made and to maintain system security.


    # 2.6.2.1 systemd Journal Log Messages


    The systemd journal is created and managed by a special daemon, named journald,
    which channels all the messages produced by the facilities and programs such as
    the kernel, initrd, systemd services, etc. into a database record structure. The
    systemd journal is a single, centralized management program for collecting logs,
    regardless of how the log messages themselves are generated.


    A critical, as well as controversial aspect of systemd journal logging, is that
    the log files are stored as binary data, and can be searched by processes deploying
    a specialized database traversal program. They are not plain text files. Previous
    legacy system logs were text files that could be viewed easily as such, or even
    edited in a text editor that handles binary format like nano, vi, or emacs.


    Storing the log information in a binary format allows the information to be displayed
    in useful output formats specific to proprietary database management technologies.
    Simply stated, using that proprietary technology'
