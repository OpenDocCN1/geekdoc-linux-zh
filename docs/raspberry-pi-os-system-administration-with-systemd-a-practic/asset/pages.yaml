    # # 1.12.1 Types of Credentials


    We are concerned with the five basic types of credentials that the Linux kernel
    supports. These are as follows:

    * Traditional UNIX Credentials


    +   1. Real User ID

    2. Real Group ID


    UID and GID are assigned to most Linux objects. These in large part define the
    object context of that object, processes included in this assignment:


    3. Effective (EUID), Saved (SUID), and FS (FSID) User ID

    4. Effective (EGID), Saved (SGID), and FS (FSGID) Group ID

    5. Supplementary groups


    The additional credentials used by processes, EUID/EGID/GROUPS, are used as the
    subject context, and real UID/GID will be used as the object context.


    # # 1.13 sudo


    The sudo program allows a single command to be run as root, or even as some other
    user. The system administrator utilizes a policy listing file (named sudoers)
    that contains commands that each user can execute. When any user needs to run
    a command that requires root permissions, user types **sudo command** in a console
    terminal, allowing them to run **command**. Then, sudo consults its permissions
    list in the policy file. If the user has permission to run the command, it runs
    the command. If the user does not have permission to run the command, sudo denies
    execution. Running sudo does not require knowing root''s password, but by default,
    requires the user''s own password to execute successfully.


    An important security access consideration, before you allow someone to execute
    the **sudo** command successfully, is finding out what group or groups you, or
    any other user for matter, actually belongs to on system. The user you want to
    include in the sudoers file may already belong to a group that has adequate privileges;
    for you, this can be simple by executing the following command:


    ```

    $ id uid=1000(bob) gid=1000(bob) groups=1000(bob),4(adm),20(dialout),24(cdrom),27(sudo),29(audio),44(video),46(plugdev),60(games),100(users),104(input),106(render),108(netdev),117(lpadmin),997(gpio),998(i2c),999(spi)

    ```


    107'
