    # 1.14.2 Raspberry Pi OS POSIX.1e ACL Model Details


    The default implementation of ACLs on the Raspberry Pi OS POSIX.1e syntax. These
    ACLs are set and displayed with the setfacl and getfacl commands.


    The traditional file system permission model defines three classes of users: owner,
    group, and other. Each of these classes is associated with a set of permissions.
    The permissions defined read (r), write (w), and execute (x). In this model, the
    owner class permissions define the access privileges of the file owner, the group
    class permissions define the access privileges of the owning group, and the other
    class permissions define the access privileges of all users that are not in one
    of the previous classes. The Is -l command displays the owner, group, and other
    class permissions as its output.


    For example, rwxrwx-r- for some regular file, translates to read, write, and execute
    permission for the owner class, read and write permission for the group class,
    and read permission for others.


    # 1.14.21 Basic Types of POSIX.1e ACL Model


    For our purposes in this section, a "file system object" can be both a regular
    file or a directory. As stated above, there are two different types of ACL that
    apply to files and directories. An ACL that defines the current access permissions
    of files and directories is called an access ACL. An ACL, which can only logically
    be set on a directory, and defines the permissions that a directory object inherits
    from its parent directory at the time of its creation, is called a default ACL.
    We give two extended examples of setting and viewing these two basic types of
    ACL in Section 1.14.3.'
