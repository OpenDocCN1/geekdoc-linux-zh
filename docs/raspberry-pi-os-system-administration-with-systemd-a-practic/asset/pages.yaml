    # 1.14.2.4 Drawbacks and Alternatives to the POSIX.1e ACL Model


    Some of the drawbacks of the POSIX.1e ACL model are as follows:


    Unfortunately, at the time of writing this book, the Raspberry Pi OS and the POSIX.1e
    ACL model supports does not easily allow for the interoperability, in terms of
    Network File System, version 4 (FSv4) ACLs, between Linux and non-Linux servers
    and clients.


    For example, if a Linux user were to mount an FSv4 ACL-compliant file system as
    NFS shared resource, the default POSIX.1e implementation on Linux would not be
    able to take advantage of the FSv4 ACL model of file system. As noted above, restriction
    is true even if a user were to install a special tool, nfs4-acl-tools, in addition
    enabling NFS server facilities on the remote system and client facilities on their
    Linux system. Since that is necessarily a more advanced application of ACLs, we
    briefly cover the particular situation of interoperability between POSIX.1e and
    FSv4 ACLs in Section 1.15.


    Another practical limitation in this respect is virtualization with LXC/ LXD containers.
    If you create LXC/LXD containers, on the Linux host for those containers, the
    FSv4 ACLs could not be used on LXD container file objects.


    Additionally, ACLs are not retained by the tar command.


