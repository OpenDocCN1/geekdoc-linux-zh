    # 1.11 systemd Journal Log Messages


    Question: What do we use the systemd journal for primarily?


    Answer: To check for unauthorized entry into our system and monitor system performance.


    But it has many other uses, for example, in monitoring system performance. The
    journal is created and controlled by the journal daemon, which directs all of
    the messages produced by the kernel, init, services, etc., into a binary record
    structure. The systemd journal is a single, centralized management tool for logs,
    regardless of where the log messages are sent from.


    One salient feature of using systemd is that log messages currently can be output
    using the traditional messaging printing APIs with the syslog function, as well
    as using the journal API functions.


    And a critical, somewhat controversial aspect of systemd logging, that the log
    files are stored as binary data, and can be searched by specialized database techniques.


    Storing the log data in a binary format, most importantly, means that the data
    can be displayed in useful output formats.


    Access to the logs kept by the journal daemon is done using the journalctl command.
    In this section, we give you a basic overview of what can be viewed with the journalctl
    command.


