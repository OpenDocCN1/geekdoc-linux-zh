  md: '# Raspberry Pi OS System Administration with systemd


    The previous example demonstrated ACLs that define access permissions of file
    system objects. This examine examines default ACLs.


    It is important to note that only directories can be associated with default ACLs.
    Regular files do not have default ACLs because no file system objects can be created
    “inside” of regular files.


    When a sub-directory is created, the new sub-directory inherits the parent directory’s
    ACL, both as its and default ACL. Regular files inherit the default ACL of the
    directory they are created in as an ACL.


    System calls for accessing and changing file attributes include the following:
    access(), chmod(), chown(), rename(), umask(), and utime().


    The permissions of inherited ACLs are modified by the file access mode parameter
    that each system call creates the file system object exercises. The file access
    mode established by these system calls contains the traditional nine permission
    bits that are the permissions of the owner, group, and other class permissions.
    The effective permissions of each class are set to the logical “intersection”
    of the permissions defined for any class in the ACL and specified in the system
    call access mode parameter. The umask setting no effect if a default ACL exists.


    Requirements: Do the steps presented, in the order shown, to fulfill the requirements
