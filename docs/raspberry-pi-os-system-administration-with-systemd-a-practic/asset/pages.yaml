    system.


    Background: When writing this book, the Raspberry Pi OS automatically recognized
    and mounted a properly formatted USB-connected flash drive that you placed in
    one of the USB ports on the hardware you''re running the system. It is possible,
    and probable, that you want to add a USB3-connected disk, such as an SSD, mounted
    in an exterior enclosure, to the system. These instructions work just as well
    as for situation.


    Requirements: Do the following steps, in the order, to meet the requirements of
    this example:


    +   1. Install the Gparted Partition Editor software if it is not already installed
    on your system. This is most efficiently using the Raspberry Pi OS Menu>Preferences>Add/Remove
    Software. Also, it would be very efficient to place this software on your Raspberry
    Pi OS desktop if you are using a GUI management system.


