  md: '# Basic System Administration


    The following set of commands, executed in sequence, allow you to replace a failed
    disk that is part of a RAID1 array named md0:


    ```

    $ mdadm --manage /dev/md0 --add /dev/sdd1

    ```


    Adds /dev/sdd1 to the array md0 as a spare disk:


    ```

    $ mdadm --manage /dev/md0 --fail /dev/sdb1

    ```


    Mark a RAID device, /dev/sdb1, as faulty:


    ```

    $ mdadm --manage /dev/md0 --replace /dev/sdb1 --with /dev/sdd1

