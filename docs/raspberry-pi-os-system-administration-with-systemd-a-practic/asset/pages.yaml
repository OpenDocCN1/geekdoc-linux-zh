    However, they can still be used: e.g., a permissions field consisting of Wdo generic
    "write" access as well as the ability to delete and change ownership.


    # EXAMPLES


    Assume that the file `foo` has the following NFSv4 ACL for the following examples:


    ```

    A::OWNER@rwatTnnCcy

    D::OWNER@-x

    G:GROUP@rtncy

    D:GROUP@rtncy

    A::EVERYONE@waxtC

    D::EVERYONE@waxtC

    ```


    +   - add ACL `alice@nfsdomain.org` generic "read" and "execute" access (defaults
    to prepending to ACL):

    $ nfs4_setfacacl -a A:alice@nfsdomain.org:rtncy foo


    +   - add the same ACL as above, but using aliases:

    $ nfs4_setfacacl -a A:alice@nfsdomain.org:RX foo


    +   - edit ACL in a text editor and set modified ACL on clean save/exit:

    $ nfs4_setfacacl -e foo


    +   - recursively set the ACLs of all files and subdirectories in the current
    directory, skipping all symlinks encountered, the acl contained in the spec_file
    named newacl.txt'':

    $ nfs4_setfacacl -R -P newacl.txt *


    +   - delete the first ACL, by only printing the result ACL (does not save changes):

    $ nfs4_setfacacl --test - x 1 foo


    +   - delete the last two ACEs:

    $ nfs4_setfacacl -x "A::EVERYONE@rtncy, D::EVERYONE@:waxtC"


    +   - modify (in-place) the previous above ACL:

    $ nfs4_setfacacl -m D:OWNER@:x D:OWNER@:xo foo


    +   - set ACLs of `bar` and `frobaz`:

    $ nfs4_getfacacl foo | nfs4_setfacacl -S bar frobaz'
