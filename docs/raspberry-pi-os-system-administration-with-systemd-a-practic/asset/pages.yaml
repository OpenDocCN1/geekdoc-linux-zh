    +   3. Launch the Gparted Partition Editor, either graphically or from the command
    line with the command gparted.


    +   4. The Gparted screen appears.


    +   5. The current disks attached to the system appear in the menu bar at the
    upper right. Note all the complete paths to the current disks by clicking on the
    down-facing arrow shown in that menu bar in the upper right of the Gparted screen.


    +   6. Scroll in that bar until you reach the disk you just added to the system.
    If the disk drive you just added did not appear automatically in the Gparted listing,
    you can''t easily use that disk drive! If it appears, continue to the next step.
    On our system, the new hard drive appeared as /dev/sda.


