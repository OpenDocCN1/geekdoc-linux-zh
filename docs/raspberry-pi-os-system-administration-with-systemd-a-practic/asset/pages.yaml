  md: '# Basic System Administration


    # 1.17 Encrypting Directories and Files Using tar and gpg


    The Raspberry Pi OS has several utilities that allow you to archive your files
    and directories in a single file, and the tar command is the most popular, widely
    used, and traditional method that allows you to achieve this. But in the 21st
    century, one has to wonder why these traditional commands are still used, with
    the ubiquity and prevalence of cheap and plentiful archival storage media available,
    such as large gigabyte capacity flash drives, SSDs, NAS, and cloud storage? When
    was the last time any ordinary user of the Raspberry Pi reverted to using a tape
    drive? This section offers a rational for the continued use of these traditional
    archiving methods.


    # Contemporary tar on Linux is the Gnu version.


    The tar (short for tape archive) utility was originally designed to save files
    on tape as a backup, so that could be recovered in the event of a system crash.
    It is primarily used now to pack a directory hierarchy as an ordinary disk file.
    That disk file can then be saved for system backup purposes locally or remotely,
    or transmitted to one via the Internet. It is also used commonly with a compression
    utility, such as gzip, via a command-line option. The saving in disk space results
    primarily from the fact that empty space within a cluster is not wasted. A brief
    description of the tar utility follows.


    The Gnu version of tar has some important functional features, and incorporates
    a more friendly syntax, than traditional UNIX tar. Therefore, for beginners, we
    only show the “long form” of the Gnu-style syntax because it is more intuitive
    and easy to understand. Once you get familiar with tar, you may switch to the
    UNIX-style short form at your discretion.


    System administrators normally use a cost-effective archival medium for completing
    file system structures as backups so that, when a system crashes for reason, files
    can be recovered. Linux-based computer systems normally crash for reasons beyond
    the operating system''s control, such as a disk head crash because of a power
    surge. Linux rarely causes a system to crash because it is a well-defined, coded,
    and tested operating system. In a typical commercial server installation, backup
    is done every day during off hours (late night or early morning) when the system
    is not in use.


    # 1.17.1 The tar command General Syntax


    The general syntax of the tar command, shown with Gnu-style syntax as opposed
    to traditional UNIX-style syntax, is as follows:


    ```

    tar

    Syntax: tar [operation mode] [operation modes] [FILE...]

    ```'
  merge: -1
