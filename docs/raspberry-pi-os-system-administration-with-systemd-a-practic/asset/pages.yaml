    Pi system and use it to add a new USB-connected flash drive to the system. We
    format that drive to ext-4.


    In Example 1.4, we show how to boot from and run a Raspberry Pi system from a
    USB-mounted SSD, a system that is recommended to conform with the data storage
    model prescribed in Section 1.1.


