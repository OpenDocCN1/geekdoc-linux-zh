    # Limiting Journal Expansion


    You can limit how much persistent storage on disk the journal can take up. This
    is done by editing the /etc/systemd/journal.conf file. The following items in
    that file can be used to limit the journal growth:


    SystemMaxSize: The maximum disk space that can be used by the journal in persistent
    storage.

    SystemKeepFree: The amount of space that the journal should leave free when adding
    entries to persistent storage.

    SystemFileSize: How large individual journal files can grow to in persistent storage
    before rotated.

    RuntimeMaxSize: The maximum disk space that can be used in volatile storage (within
    the /run file system).

    RuntimeKeepFree: The amount of space to be set aside for other uses when writing
    data to volatile storage (within the /run file system).

    RuntimeFileSize: The amount of space that an individual journal file can take
    up in volatile storage (within the /run file system) before being rotated.'
