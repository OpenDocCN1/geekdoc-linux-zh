    # 1.5 File Systems, Connections to Persistent Media, and Adding Disks to Your
    System


    Question: What is a computer file system?


    Answer: A way of logically ordering data, so that it is persistent, can be securely
    and easily located very quickly, and accessed in a consistent for use.


    Providing persistence, which is the third primary objective of the Raspberry Pi
    OS itself, in part involves establishing and maintaining connections to persistent
    media, such as disk drives. These drives, and the file systems found on, can be
    physically connected inside the Raspberry Pi hardware, such as the microSD card,
    or externally via the USB bus. They can also be some form of remote virtual drive,
    such as a network-available file system on a remote drive, or remote volumes and
    complements of drives.


    And in some cases, a file system may not make use of a persistent storage device
    or medium at all! At this higher level of abstraction, the file system can access,
    organize, and represent any form of data, whether it is persistent or volatile.
    We use the word volatile to mean during the transient lifetime of some process
    or service. Of course, systemd and the Linux kernel control all processes and
    services running on the computer. Pseudo and special-purpose file systems (sometimes
    called synthetic file systems), which can be thought of as virtual file systems,
    have this characteristic.


    There are also established protocols for connecting and accessing physical, virtual,
    or pseudo-file systems in the locations where they may reside. Two examples of
    access protocols that establish and maintain the connections to virtual, network-available
    media and file systems are the Network File System, version 4 (NFSv4), and the
    Internet Small Computer Interface (iSCSI).


    In this section, we first present an organizing scheme that we can use to think
    about types of drives and file systems. A file system may be nominated according
    to what medium it exists on: a directly connected physical medium (such as the
    microSD card or a USB3 SATA SSD), a virtual medium (such as Network-Attached Storage
    or Storage Area Networks that use NFSv4 or a specialized pseudo-file system that
    is not on a persistent medium at all (such as the cgroups or proc file systems).'
  merge: -1
