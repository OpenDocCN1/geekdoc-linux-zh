  md: '# Applications of systemd for the Beginner


    # Timer-Based Activation


    New-style daemons can implement clean-up jobs that are intended to be executed
    in regular intervals. In systemd, this is implemented via timer unit files as
    shown in examples above, as described in the man page for systemd.timer.


    It is possible, and preferable, for services to be activated by more than one
    of the methods above.


    Examples of this are Wi-Fi, Bluetooth, and CUPS printer services, which can be
    made active when their respective devices are plugged in, or when activity we
    first see on a particular port.


    We provide a example of socket-based activation in Section 2.7.1.1.


    ***Note***


    Part of the efficiency and speed advantage systemd gives the Raspberry Pi OS the
    ability to delay the start of services and daemons until they are all needed,
    instead of running all of them when the system boots and enters the steady operating
    state.


    Sockets-activation for a daemon, such as a web server, when a request is made
    on a particular port that the web server is hooked to, the web server starts as
    a daemon. It serves all requests on that port.


    In this example, we use the special systemd-activate command, which is systemd-activate
    “listens” on a port.


    Following are steps you can easily to make a web server application start when
    an HTTP request is made on a particular port of your choosing. You can change
    the port numbers shown in the examples below to any ephemeral ports you want.


