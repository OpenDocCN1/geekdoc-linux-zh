  md: '# 1.14 Raspberry Pi OS POSIX.1e Access Control Lists (ACLs)


    Access Control Lists (ACLs) provide the ordinary, unprivileged user with the ability
    to set finer access controls on directories, and files, than the traditional UNIX
    and Linux permissions, whether they are used on EXT4 or NFS systems. The root
    file system of the Raspberry Pi OS is an EXT4 file system. Two different types
    of ACL apply to files and directories. An ACL that defines the current access
    permissions of files and directories is called an access ACL. An ACL, which only
    makes set on a directory, and defines the permissions that this directory inherits
    from its parent directory at the time of its creation, is a default ACL. Additional
    basic types of ACLs are minimal and extended ACLs. ACL permissions that can be
    equivalent to the traditional file mode permissions are minimal ACLs. Minimal
    ACLs have three entries, which can be the same as the traditional file permissions.
    Extended ACLs also contain a mask entry and may contain any number of named user
    and group entries. These terms, and the conditions under which they are applied,
    are explained in the following sections.


    # 11.4.1 Using Access Control Lists (ACLs) in the Raspberry Pi OS


    The traditional UNIX Linux permissions model, which defines secure access to file
    objects like a regular file or a directory, set permissions of read, write, and
    execute. Other advanced techniques for setting permissions are setting the setuid,
    setgid, and sticky bit. Beyond these, the Access Control List (ACL) model gives
    users finer-grained control over file and directory object security. Every file
    object can be thought of as having associated with it an access ACL that controls
    the discretionary access to that object. As mentioned earlier, for a directory,
    this ACL is referred to as a default ACL.


    Question: Why would an ordinary user, or a system administrator, want to use ACLs
    rather than just rely on the traditional permissions model?


    Answer: To discretionary controls on a file so that more than one group can access
    it. In the traditional permissions model, any file can only belong to one group.
    Therefore, to serve different collections of users, many different groups have
    to exist. Only administrators can create and assign group memberships. With ACLs,
    a file can belong to many groups and, in addition, can be given access privileges
    by an ordinary user.


    # In-Chapter Exercise


    +   16. Does it make any sense to set the permissions on a regular file, so that
    a group, user, or others have access to it, when that group, user, or others do
    not have permissions to set the directory which contains the regular file?'
  merge: -1
  pgno: 128
