    # 2.3.1 Introduction to Units and Unit Files


    In systemd, a unit refers to an object that changes the characteristics of the
    steady state of the Raspberry Pi OS, or its normal operating condition. Units,
    and unit files, are the primary objects that systemd creates and manipulates,
    with user commands such as systemctl. These objects are configured with files
    called unit files. We will introduce you to the different units that systemd can
    handle. We will also be covering some of the many “directives” that can be put
    in unit files in order to configure the way these objects handle resources on
    your system.


    # 2.3.2 Roles systemd Units Play


    Units and unit files take on a very standardized format, which we describe in
