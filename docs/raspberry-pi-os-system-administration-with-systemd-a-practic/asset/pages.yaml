  md: '# 1.16.5 Interpreting ufw Log Entries in systemd Journal


    Question: Why would you want to look at log entries generated by ufw?


    Answer: Someone is trying to crack into your machine from your LAN or the Internet,
    and you want to have information about their method of attack. This section details
    an example procedure for generating ufw-blocked messages in the systemd Journal.
    We give brief descriptions of the details of the components of the log entry.
    The Journal, and the journalctl command in particular, allows you to view consolidated
    log messages from a variety of sources on your system, all using one command.
    We give details of the systemd Journal, in Section 1.11.


