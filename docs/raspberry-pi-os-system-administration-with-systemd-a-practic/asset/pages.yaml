  md: '# Raspberry Pi OS System Administration with systemd


    Most importantly, from the perspective of our recommended data storage model,
    adding a second hard drive, for example, allows you to keep the operating system
    and the user data on two different persistent media. That is, if the operating
    system fails and the system disk is corrupted and unusable, the data survives
    on the user disk and can easily be recovered.


    There are many traditional, legacy methods of achieving the objective of our data
    storage model, using facilities as Linux disk and file maintenance commands, utilities
    such as mdadm (a software RAID manager), and Linux Volume Management (LVM). But
    from our perspective, the modern and contemporary way of implementing the recommended
    data storage model is using ZFS on redundant persistent media. With ZFS, you get
    bit-level data integrity, volume management, RAID capabilities at all levels,
    and a failure-proof backup strategy, rolled all into one utility.


    There are some very important reasons for adding persistent media to your system,
    aside from conforming to our recommended storage model. Your internal microSD
    card may be running out of space or beginning to show signs of failure.


    # Partitioning Schemes and Strategies


    It should be evident that the Raspberry Pi OS organizes everything in files and
    uses a file system to be simply defined as a logical area of the disk that holds
    a file system.


    Once you verify that your Raspberry Pi system can recognize the additional media,
    there are several reasons to adopt a partitioning scheme for a newly added disk
    drive. Creating multiple partitions on your hard drive avoids disk problems by
    segregating directories into those partitions and gives the system administrator
    control over access to those directories and partitions. And you can maintain
    different file system structures simultaneously in different partitions. Even
    installing the system into a customized partitioning scheme allows you to install
    multiple operating systems on your computer.


    When adding new disks, you can use the traditional method of partitioning with
    command-line utilities such as fdisk or gdisk or the option of using a GUI-based
    method with a utility such as Gparted. As we show in the sections below, you can
    implement our recommended data storage model with a traditional ext4 Linux file
    system. We present an example detailing how to do this using the traditional ext4
    scheme.


    To help the administrator of the Raspberry Pi system with the task of adding persistent
    media, the following sections will also address these general concerns:


    +   * The availability of software device drivers for the new hardware to be added.


    +   * How the hardware will be recognized, configured, and deployed on the system.'
