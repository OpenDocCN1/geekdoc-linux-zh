    -x acl_spec | index

    delete ACEs matched from acl_spec or delete the indexth ACE - from file''s ACL.
    Note that the ordering of the ACEs in acl_spec does not matter.


    -X acl_file

    delete ACEs matched from acl_spec in acl_file from file''s ACL. Note that the
    ordering of the ACEs in the acl_spec does not matter.


    -s acl_spec

    deset file''s ACL to acl.spec.


    -S acl_file

    deset file''s ACL to the acl_spec in acl_file.


    -e, --edit

    edit file ACL in the editor defined in the EDITOR environment variable (DEFAULT:
    vi(1)) and set the ACL upon a clean exit, assuming changes made in the editor
    were saved. Note that if multiple files are specified, the editor will be serially
    invoked once per file.


    -m from acl_to_ace

    deletify file''s ACL in-place by replacing from_ace with to_ace.


    -h, --help

    display help text and exit.


    --version

    display this program version and exit.


    NOTE: if ''-'' is given as the acl_file with the -A/-X/-S flags, the acl_spec
    will be read from stdin.


    # OPTIONS


    +   -R, --recursive

    recursively apply to a directory''s files and subdirectories. Similar to setfac(1),
    the default behavior is follows symlinks and skip symbols encountered while recursing
    through directories.


    +   -L, --logical

    in conjunction with -R//recursive, a logical walk follows all symbolic links.


    +   -P, --physical

    in conjunction with -R//recursive, a physical walk skips all symbolic links.


    +   --test

    display results of COMMAND, but do not save changes.


    # PERMISSIONS ALIASES


    With nfs4_setfacl, one can use simple abbreviations ("aliases") to express generic
    "read" (R), generic "write" (W), and generic "execute" (X) permissions, familiar
    from the POSIX bits used by, e.g., chmod(1). To use these aliases, one can put
    them in the permissions field of NFS4 ACE and nfs4_setfacl convert them: an R
    is expanded to rntcy, a W is expanded to wattCCy (with D added to directory ACEs),
    and an X is expanded to xtcy.'
