  md: '# Raspberry Pi OS System Administration with systemd


    those contexts. In simple terms, match subject and object permissions, and let
    the subject act or not on the object.


    There are three basic “classes” of permissions:


    +   1. Discretionary Access Control (DAC):

    Sometimes the object will include sets of rules as part of its description. A
    Raspberry Pi OS file may supply more than one ACL (‘Access Control List’ or ‘ACL’).
    A traditional file, for example, includes a permissions mask that includes with
    three fixed classes of subject (‘user’ or ‘owner’), ‘group’, and ‘other’ or ‘everyone’),
    each of which may be granted privileges (‘read’), ‘write’ and ‘execute’– whatever
    those map to the object in question). File permissions do not allow the arbitrary
    specification of subjects, however, and are so of limited use.


    A file might also support POSIX ACL, or an NFS4 ACL. This is a list of rules that
    grants various permissions to arbitrary subjects.


    +   2. Mandatory access control (MAC):

    The system as a whole may have one or more sets of permissions that get applied
    to all subjects and objects, regardless of their source. Security Extended Linux
    (SELinux) is an example of this.


    +   3. Role-Based Access Control (RBAC):

    Rather than use the user ID to determine what access rights users and groups have
    on the system, the Role-Based Access Control (RBAC) model grants access based
    on the role or roles that a user assumes. The classic RBAC example is the use
    of the sudo command to grant an unprivileged root privileges.


    These forms of access control policies determine what action is allowed on what
    object, under what circumstances (DAC, MAC, or Role-Based Access Control (RBAC)),
    and by what subject.


    A permission, for example, can be thought of as read, write, or execute privilege.
    Most importantly, an object is a process since everything is on files, and the
    data in them are controlled through active processes.


    On the command-line, an ordinary user, the system administrator, is able to implement
    resource restrictions and privileges by controlling process credential assignments,
    exercised on executable image files, via the chmod command. An ordinary unprivileged
    user can be given the required privilege with the sudo command. Then, as root,
    she can issue a privileged chmod, chown, and chgrp to grant or modify file and
    directory access permissions and use the DAC, MAC, or RBAC methods as well.'
