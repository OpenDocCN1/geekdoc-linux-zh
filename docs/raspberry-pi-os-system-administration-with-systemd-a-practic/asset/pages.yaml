    There are two aspects to sudo: the sudo program itself, and the sudoers policy
    file that the program uses. The sudoers policy file can only be edited by root.
    The sudo program includes a special tool, visudo, for editing and validating the
    sudoers policy file. The path to the executable program visudo is /usr/sbin.


    The sudoers policy file must only be edited with visudo, because that special
    editing tool has safeguards built into it. Typing **sudo visudo** on the command
    line of our Raspberry Pi system launches the nano text editor to allow editing
    of the sudoers files. The sudoers file itself is in /etc. At this point, you should
    use the **sudo command** to examine the contents of the sudoers file in /etc on
    your system.


    The sudoers file recognizes seven types of user specification lists. They are
    usernames, group names (such as lxd), aliases defined within the sudoers file
    itself, UID numbers, GID numbers, netgroups, and non-UNIX groups. See the following
    section for applications of some of these specifications.


    The sudoers file is composed of two types of entries: aliases, and user specifications.
    Aliases are names that can be assigned to a variety of groups, like users, hosts,
    etc. User specifications dictate who may run what. When multiple entries match
    a user, they are applied in order. Where the last is used (which is not necessarily
    the most specific match). A user specification determines which commands a user
    may run (and as which user) on specific hosts.


    By default, commands are run as root, but this can be changed on a per-command
    basis.


    In the following two sections, we give examples of alias entries and various forms
    of user specification.'
