  md: '# Basic System Administration


    # 1.16 ufw and Netfilter Interface in the Raspberry Pi OS


    The Raspberry Pi OS uses the Uncomplicated Firewall (ufw) to protect your system.
    By default, the firewall is configured to allow all outgoing connections but deny
    any incoming connection requests. The default configuration file for its rules
    is located in /etc/ufw/ufw.conf. If you want to know more about text-based modifications
    to firewall rules, see the ufw man page on your Linux system.


    It is not absolutely necessary to change the firewall rules, and the basic details
    of using the command-line method of doing this are shown here.


    > ***Note***Be very careful when adding custom rules or modifying the firewall,
    it may endanger your system’s security!


    # 1.16.1 ufw Defaults


    The default firewall configuration utility for the Raspberry Pi OS is ufw. Unlike
    the iptables firewall configuration utility, ufw is a much easier way to create
    an IPv4 or IPv6-based firewall. It is a rule-based system, which means that you
    create rules to control network access to your system. By default, ufw is disabled
    for example. But once enabled, it has a minimal set of rules, as part go into
    effect. ufw’s most basic application is to allow or deny access to ports or from
    specific IP addresses. ufw is based on the Netfilter interface to the Linux kernel,
    particularly the filter table operations and protocols found in that. The rule
    format is also similar to the Packet Filter (PF) syntax in OpenBSD UNIX.

    There is a GUI front end of ufw, known as gufw can be easily installed on your
    system from the Raspberry Pi OS Menu> Preferences> Add/Remove Software. In the
    Questions and Problems section at the end of this chapter, we pose a scenario
    of creation that uses ufw.


    # 1.16.2 Basic Syntax, Use Case, and Rules Examples


    An abbreviated listing of the ufw man page is as follows:


    +   ufw

    **Purpose:** ufw is used to manage a Linux firewall, and provides an easy to use
    interface for the creation of firewall rules. The rules use a basic syntax as
    shown below.

    **Syntax:** ufw [option[s]] [command] [rule[s]]n**Output:** New, modified, or
    deleted firewall rules to/from ports/ IP addresses, devices.'
