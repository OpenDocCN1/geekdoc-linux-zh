    # Example 1.5 Creating and Managing RAID Arrays

    Using mdadm on the Raspberry Pi OS


    Objectives: To use the mdadm program from the command line on a Raspberry Pi OS
    system to create a mirrored pair on two USB flash drives.


    Prerequisites:


    +   - Completion of Examples 1.3 and 1.4.

    - Having two identically sized USB flash drives that are recognized by your system
    and the available ports on your computer to accommodate.


    > ***Special Note***

    Upon initial installation of mdadm on the Raspberry Pi OS, at the time of writing
    of this book, mdadm was masked by systemd. It seems the unmask command fails when
    there is no existing unit file in the system other than the symlink to /dev/null.
    If you mask a service, then that creates a new symlink to /dev/null in the directory
    /etc/systemd/system, where systemd looks for unit files to load when the system
    boots up. In this instance, there is really no unit file.


    To correct this, the general procedure is as follows:


    +   1. Check that the file is a symlink to /dev/null:


    $ file /lib/systemd/system/mdadm.service


    If the service is masked, the above command should return: /lib/systemd/system/mdadm:
    symbolic link to /dev/null

    2. Delete the symlink!


    $ sudo rm /lib/systemd/system/mdadm.service

    3. Because you changed a unit file, reload the systemctl daemon.:


    $ sudo systemctl daemon-reload'
