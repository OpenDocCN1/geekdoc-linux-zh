    # 2.5.7 Other systemctl Options with Target Units


    Targets, as defined and illustrated above, are unit files that describe the system
    state, or points of synchronization. Like other units, they can be identified
    by the file extension .target.


    Targets are used to coordinate and group units together.

    This brings the system to desired states, which then allows us to use-case-dictated
    functionality. For example, the Raspberry Pi OS on hardware that is configured
    as a server, with a text-only CLI, does not have the performance overhead, which
    is essentially a wasted resource, of a graphical display manager, or desktop environment.


    Targets are used as a coordination point, that makes desired functionality available,
    allowing the system administrator to designate the “milestone state (which might
    consist of many inter-dependent targets) rather than designating individual units
    to start to produce that state.


    Target unit files specify, in their content configuration, they are WantedBy=,
    RequiredBy= some individual unit file, thus establishing dependency relationships.
    Units that must be available can specify this condition using the Wants=, Requires=,
    and After= designations to indicate that particular dependency relationship.'
