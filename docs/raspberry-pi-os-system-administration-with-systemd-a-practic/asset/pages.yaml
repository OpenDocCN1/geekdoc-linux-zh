    # 1.18.1 Process Capabilities


    There is also a way to assign credentials to processes through a scheme known

    as "capabilities." Capabilities use a finer-grained technique to limit, or grant

    credentials to processes you want to give privileges to. This is in contrast

    the traditional RBAC method of using sudo to give coarse-grained privileges

    to a process or set of processes initiated by an unprivileged user.


    For a more complete discussion of Linux Capabilities, see the man page for

    capabilities on your system. The scope of capabilities generally follows this

    outline:


    +   1. Set of permitted capabilities

    2. Set of inheritable capabilities

    3. Set of effective capabilities

    4. Capability binding set


