    # 2.7.1 systemd Methods of Changing the Activation Behavior of a New-Style Daemon


    There are several other "new-style" techniques and methods that can be applied
    instead, or to replace an old-style daemon (a traditional UNIX or Linux daemon),
    to update it to systemd-compliant and more effectively, and efficiently controlled
    by systemd.


    These include the following general ways of achieving that:


    +   **Boot-Based Activation**n"Old-style" daemons are started when the system
    boots, and/or by individual script files on a per-service basis, using UNIX BSD
    or SysV initialization. This is the traditional method of service activation,
    used before systemd''s installation in the kernel. systemd uses a modernized version
    of activation, for when the system boots, and at runtime, using minimal service
    description files we have described in the sections above.


    +   **Socket-Based Activation**

    The clear advantage of socket-based activation of daemons is, most importantly,
    the simplification of configuration and the program development process. In socket-based
    activation, the creation and binding of sockets happens in systemd. Using initialization
    and service unit files for daemon configuration, systemd installs the sockets,
    and then assigns them to the systemd-started process when triggering event occurs.


    +   **Bus-Based Activation**

    When the D-Bus InterProcess Communication (IPC) system is used, newdaemons deploy
    bus activation so that they are automatically activated when a client application
    accesses their IPC interfaces, or channels.


    +   **Device-Based Activation**

    New-style daemons that manage a particular type or class of hardware, like disk
    volumes or ZFS datasets, are activated only when the hardware of the respective
    kind is plugged in, or otherwise becomes available.


    +   **Path-Based Activation**

    systemd provides a way to bind service activation to file system changes. This
    is implemented using path-based activation configured in path unit files, as illustrated
    and described in the man page for systemd.path.'
