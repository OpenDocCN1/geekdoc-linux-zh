  md: '# 2.5.8 Using Target Shortcuts


    There are target units available for critical events, such as powering off the
    system, or rebooting. The systemctl command has options that give you faster and
    better methods to allow execution of those critical events.

    To halt the system, you can use the halt command:


    ```

    $ sudo systemctl halt

    ```


    To initiate a full shutdown, you can use the poweroff command:


    ```

    $ sudo systemctl poweroff

    ```


    A restart can be started with the reboot command:


    ```

    $ sudo systemctl reboot

    ```


    The above three commands notify logged-in users that the critical event is about
    to occur (that is very important in a multi-user system, where many users might
    be in the middle of critical operations!) something is running, or isolating a
    particular target will not do.


    > ***Note***


    Ordinary Linux system commands will tie the necessary operations to accomplish
    the above state changes on the system, so that they will work properly with systemd-controlled
    state changes.

    For example, an ordinary Linux command that will do this, to reboot the system,
    is simply:


    ```

    $ sudo reboot

    ```


