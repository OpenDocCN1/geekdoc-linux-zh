  md: '# Raspberry Pi OS System Administration with systemd


    The common commands that perform printing on a Raspberry Pi system are lpr and
    lp. The general syntax of the lpr command is as follows:


    ```

    lpr [options] filename

    Purpose: Send files to the printer

    Output: Files sent to the printer queue as print jobs

    Commonly used options/features:

    -P printer Send output to the named printer

    -# copies Produce the number of copies indicated for each named file

    ```


    The following lpr command accomplishes the printing of the file named order.pdf
    at the printer designated on our system as spr. Remember that no space is necessary
    between the option (in this case -P) and the option argument.


    ```

    $ lpr -Pspr order.pdf

    ```


    The following lpr command accomplishes the printing of the file named memo1 at
    the default printer.


    ```

    $ lpr memo1

    ```


    The following multiple command combines the man command and the lpr command, and
    ties them together with the Raspberry Pi OS pipe (|) redirection, to print the
    man pages describing the ls command at the printer named hp12000


    ```

    $ man ls | lpr -Php12000

    ```


    The following shows how to perform printing tasks using the lp command. The general
    syntax of the lp command is as follows:


    ```

    lp [options][option arguments] file(s)

    Purpose: Submit files for printing on a designated system printer, or alter printing
    jobs

    Output: Printed files or altered print queue

    Commonly used options/features:

    -d destination Print to the specified destination

    -n copies Sets the number of copies to print.

    ```


    In the first command, the file to be printed is named file1. In the second command,
    the files to be printed are named sample and phones. Note that the -d option is
    used to specify which printer to use. The option to specify the number of copies
    is -n for the lp command.'
  merge: -1
