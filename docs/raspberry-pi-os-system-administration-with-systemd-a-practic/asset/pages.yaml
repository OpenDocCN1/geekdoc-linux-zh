    # 2.2 Bootup in the Initial RAM Disk (initrd)


    The initial RAM disk implementation (initrd) can also be set up using systemd,
    and follows a prescribed structure. initrd is a scheme for loading a root file
    system, from a variety of possible sources, into memory, and it is used as part
    of the Raspberry Pi OS startup process.


    # 2.2.1 Querying the Boot Process


    As shown in Section 2.6.2.6 Boot Process Querying, the systemd journal daemon
    and journal give you the ability to view log records of how the system boots.
    In particular, it allows you to look at a log record of the current boot process,
    and past boot processes, with some specific command line tools, and their arguments.
    We refer you to Section 2.6.2.6 for a more complete treatment of the systemd journal,
    and its capabilities with respect to booting logs.


