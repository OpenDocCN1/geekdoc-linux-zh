    # 2.5.3 Changing the Current Target by Isolating Targets


    It is possible to start all of the units with a target at once, and stop all units
    that are not part of the dependency tree for that target. This is similar to changing
    the runlevel on order, legacy init systems.


    For instance, if you are operating in a GUI environment, with graphical target
    currently defining the system state, you can shut down the graphical system, and
    put the system into a multi-user, Character User Interface (CUI) state by what
    is termed “isolating” the multi-user.target. This is achieved with the isolate
    command. Since graphical.target (lower down on the dependency tree) depends on
    multi-user.target, all of the graphical units below multi-user.target will be
    terminated.'
