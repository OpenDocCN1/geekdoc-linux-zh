  md: '# Raspberry Pi OS System Administration with systemd


    The first in a new series exploring the basics of Raspberry Pi Operating System
    (OS) administration, this volume is a compendium of easy-to-use and essential
    system administration for the novice user of the Raspberry Pi OS.


    The overriding idea behind the system administration of a modern, 21st-century
    system such as the use of systemd as the Raspberry Pi OS is to ensure that the
    Linux kernel works efficiently and effectively to provide the three foundation
    stones of computer operation and management: Exercises are included throughout
    to reinforce the readers’ learning goals with solutions and example code provided
    on the accompanying GitHub site.


    This book is aimed at students and practitioners looking to maximize their use
    of the Raspberry Pi OS. With plenty of practical examples, projects, and exercises,
    this volume can also be adopted in a more formal learning environment to supplement
    and extend the basic knowledge of a Linux operating system.


    Robert M. Koretsky is a retired lecturer in Mechanical Engineering at the University
    of Portland School of Engineering. He previously worked as an automotive engineering
    designer at the Freightliner Corp. in Portland, Oregon. He’s married and has two
    kids and two grandchildren.'
