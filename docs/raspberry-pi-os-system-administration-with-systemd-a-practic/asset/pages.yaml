    # 2.6.2.3.4 Querying by Unit


    The most useful, and practical way of querying, is by designating the service
    unit’s name that you are interested in. You use the -u option to query by unit.
    For example, to see all of logs from the webserver2 unit on your system, use the
    following command:


    ```

    $ journalctl -u webserver2.service

    ```


    You can perform compound queries by adding arguments to the above unit query by
    name. To query by time and name, to check on how the status of the service you
    are interested in, use the following command:


    ```

    $ journalctl -u webserver2.service --since today

    ```


    Compound querying is useful when you want to compare log entries from related
    units running on the system. For example, if you want to compare log entries from
    your webserver2 service to the status of another unit, you can view the entries
    from both in chronological order by using the compound query statement:


    ```

    $ journalctl -u webserver2.service -u systemd-log.service --since \nyesterday

    ```


    This allows you to study the interactions between different programs and debug
    tags the the interaction of dependencies, instead of just individual, isolated
    units.


