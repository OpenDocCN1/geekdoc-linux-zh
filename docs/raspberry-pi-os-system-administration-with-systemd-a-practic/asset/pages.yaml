  md: '# Raspberry Pi OS System Administration with systemd


    To use this chapter successfully as a springboard into the remainder of the book,
    you should carefully read, follow, and execute the instructions and command line
    sessions we provide, in the order presented. Each section in this chapter, and
    every subsequent chapter as well, builds on the information that precedes it.
    They will give you the concepts, command tools, and methods that will enable you
    to do system administration using the Raspberry Pi OS. Throughout this book, we
    illustrate everything using the following version of the Raspberry Pi OS, on the
    hardware listed:


    System: raspberry Kernel: 6.21-v8+ aarch64 64-bit compiler: gcc v: 10.2.1 Console:
    tty0 Distro: Debian GNU/Linux 11 (bullseye) Type: ARM Device System: Raspberry
    Pi 400 Rev 1.0


    In this chapter, the major commands we want to illustrate are defined with an
    abbreviated syntax description, which will clarify general components of these
    commands. The syntax description format is as follows:


    **Syntax:** The exact syntax of how a command, its options, and its arguments
    are correctly typed on the command line


    **Purpose:** The specific purpose of the command


    **Output:** A short description of the results of executing the command

    Commonly used options/features:** A listing of the most popular and useful options
    and output arguments


    In addition, the following web link is a site that allows you to type-in in a
    single or multiple Raspberry Pi OS command and get a verbose explanation of the
    components of that command:


    https://explainshell.com/


    # **In-Chapter Exercises


    +   1. Type the following commands on your Raspberry Pi system''s command line,
    and note the results. Which ones are syntactically incorrect? Why? (The Bash prompt
    is shown as the $ character in each, and we assume that **file1** and **file2**
    exist


