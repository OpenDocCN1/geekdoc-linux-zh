    # 1.19 Namespaces and User Namespaces


    These are security-related features built into the Raspberry Pi OS kernel that
    differentiate it from UNIX kernels, particularly FreeBSD and Solaris. They are
    methods of creating a virtual environment for a group of processes. The kinds
    of resources that can be ‘virtualized’ in these environments for groups of processes
    are currently process IDs, hostnames, user IDs, network access, interoper communication,
    and file systems. Namespaces are a fundamental component of the container virtualization
    technique, for systems like Docker, or LXD/LXC.


