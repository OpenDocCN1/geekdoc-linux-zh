    ```


    ```

    Runas_Alias = NAME =''Runas_List

    ```


    ```

    Host_Alias = NAME ='''' Host_List

    ```


    ```

    Cmnd_Alias = NAME =''Cmnd_List

    ```


    ```

    NAME = [A-Z]([A-Z][0-9])*

    ```


    An alias definition is given in the following format:


    ```

    Alias_Type NAME = object1, object2, ...

    ```


    where:


    Alias_Type is one of User_Alias, Runas_Alias, Host_Alias, or underscore characters
    (''_'').

    NAME is a string of uppercase letters, numbers, and underscore characters (''_'').

    NAME must start with an uppercase letter. To put several alias definitions of
    the same type on a single line, joined by a colon ('':''). For example:


    ```

    Alias_Type NAME = object1, object2...: NAME = object4, object5...

    ```


    You cannot redefine an existing alias. But it is possible to use the same name
    for aliases of different types, but a name collision is possible, which would
    generate an error.


    The following is a typical alias in a sudoers file, where group1 can be an alias
    name that includes more than one user. This alias specifies that the user group1
    may run /bin/ps, /bin/nano, / /usr/sbin/vsftpd, but only as the user admin on
    the host Pi400:


    ```

    group1 Pi400 = (admin) /bin/ps, /bin/nano, /usr/bin/vsftpd

    ```


