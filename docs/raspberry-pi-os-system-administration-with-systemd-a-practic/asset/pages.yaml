    # 1.3.1 Connecting via a Secure SHell (SSH) Client between Raspberry Pi OS Machines


    The basic methodology, and the techniques we show below, allow a user on one Raspberry
    Pi OS computer to remote in and log out of another using the SSH protocol. SSH
    is a very secure encrypted channel of communication between a client computer
    and a server on a LAN or the Internet. The computer you are using to log into
    another computer is known as the SSH client. The computer you want to log into
    with SSH is known as the server, or the host system.


    Before this methodology can be used, both client and server systems must be able
    to talk to each other over the SSH channel. In other words, the server system
    must have the SSH server-side software package installed and enabled on it. This
    is usually not the default on most Linux systems, so you have to follow the installation
    and/or enabling instructions given for your particular favor of Linux to accomplish
    this.


    There are a few approaches to enabling SSH server-side software on the latest
    Raspberry Pi OS, as follows:


    +   1. Starting from scratch, you could directly enable it when the system is
    flashed to the microSD card you might be running the system from. At installation,
    a convenient dialog box allows you to do this.

    2. On an already-installed system, in a terminal window, you can use the command
    sudo raspi-config, descend through the Raspberry Pi Software Configuration Tool
    menu chooses Interfaces>SSH, and enable it.

    3. Launch the Raspberry Pi Configuration Tool from the Preferences Menu, and do
    the same thing as in step 2.'
