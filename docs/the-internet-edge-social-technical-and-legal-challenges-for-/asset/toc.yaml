- - '#'
  - 第4章 组织的考试，我们将将其命名为 DPT（数字财产信托）。随后，DPT 验证 Joe 的身份并向他颁发一张物理证书，作为个性化的数字许可供其可信系统使用。在
    DPT 框架下，数字作品的出版商将为每件作品分配公平使用许可者可以行使的特权。出版商还会根据其数字作品权利的预期商业价值宣布保险限额。每当 Joe 执行复制交易以获取数字作品副本时，交易费用包含一笔额外的小额金额——即数字作品保险费的份额。由于拥有公平使用许可，Joe
    可以行使对数字作品的特权，但这些特权使用可能会被监控、记录和报告（受对其隐私的适当法律考虑的影响）。假设 Joe 向互联网上的一个邮件列表发送了数千份数字作品副本，出版商将其诉至法院，声称赔偿金额超过了
    Joe 的支付能力。法院将考虑到数字合同和公平使用的四个因素。如果法院判定支持出版商，公平使用保险将支付部分赔偿。如果法院判定支持 Joe，公平使用保险将支付
    Joe 部分或全部的诉讼和律师费。
