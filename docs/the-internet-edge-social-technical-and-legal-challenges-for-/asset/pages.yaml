    a particular television program. They create advertisements intended to appeal
    to a statistical profile of the watching audience.


    With digital platforms, advertising could easily change. Advertisers could know
    a lot about the person watching or reading a digital work and deliver different
    advertisements to different people. Moving television and magazines to PDRs could
    lead to changes some people might see as effective, directed advertising and others
    might see as intrusions.


    How would advertising on the Net work? Imagine that a distributor creates a so-called
    sponsored browser or reading program that runs on digital systems like PDRs. The
    sponsored browser is analogous to Netscape''s Navigator™ or Microsoft''s Internet
    Explorer™ in that it displays and supports interaction with digital works encoded
    in a particular format. What''s different about this browser is that it is associated
    with an economic model of advertising. Owners of the rights available on the sponsored
    browser receive payments when someone reads their work, and advertisers pay to
    have their messages sent to people whose age, income, address, and coincide with
    the advertiser''s customer profile. When a sponsored browser is accessed by a
    PDR, the browser collects certain information about the person and passes it along
    to a central processing repository. The browser then correlates this information
    with other data gathered to target advertising more effectively. A sponsored browser''s
    advertising arrangement would differ from mass'
