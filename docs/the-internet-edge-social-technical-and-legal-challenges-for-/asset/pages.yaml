    # Books versus Expert Systems


    In the meme model, a carrier is an agent that can remember a meme and communicate
    it to another agent. People are meme carriers, and so are books. However, there
    is an important difference: people can apply knowledge, whereas books only store
    it. Librarians, authors, publishers, and readers are the active elements in the
    printed knowledge medium. Computers can apply knowledge, and this ability makes
    them important for creating an active knowledge medium. When a medium includes
    computer systems, some of its knowledge services can be automated.


    The most promising automated knowledge processors today are expert systems. In
    several well-publicized cases, expert systems have proven to be of substantial
    value, far greater than the cost of their development. Expert systems are computer
    systems that solve narrowly focused problems at an expert level. They are built
    by encoding the rich knowledge'
