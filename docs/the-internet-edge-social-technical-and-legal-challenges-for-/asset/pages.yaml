  img_proc: true
- pgno: 24
  md: '# The Internet Edge 7


    been perfected. Advocates arise, citing economic and social benefits and urging
    action. Opponents arise, citing not only technological barriers but also legal
    and social issues that must be addressed before the technology can be deployed.
    Change is bumpy, coming in breakthroughs and setbacks. The outcome hangs in the
    balance while forces for change wrestle with the status quo. This chaotic initial
    pattern has been particularly evident in technologies of connection.


    We can perhaps understand the uneven pattern of early Internet development by
    looking at similar events in the past. Let us, for example, compare the public
    speeches given about two proposed new technologies and how the arguments used
    reflect beliefs about anticipated changes. The examples are drawn from public
    speeches about the Internet in the early 1990s and about the proposed Erie Canal
    in the early 1800s.


    In his book Erie Water West (1990), Ronald E. Shaw characterizes the Erie Canal
    as work of a remarkable generation of Americans who made the period between 1815
    and 1860 an age of national expansion. In New York this generation proposed to
    build a waterway that would expand the economy of the state beyond the eastern
    areas dominated by the old Knickerbocker society; these dreamers sought to penetrate
    the frontier and to create a new mold for the future of the Old Northwest Territory.
    Futurists such as Alvin Toffler see the Internet as a corresponding symbol of
    another generation, one ushering in a new age carefully called the information
    age, the communication age, or the knowledge economy.


    In 1993, Vice President Al Gore emerged as a prominent advocate of the Internet
    which was still mysterious to most people. The Web had not spread out over the
    world; there were no web browsers, and the wars between the Netscape Navigator,
    Microsoft’s Internet Explorer, and others had not begun. It was several years
    before network addresses became trendy and useful additions to advertisements
    and business cards; “Net Days” were held to connect schools to the Web; before
    the mixture of push and pull approaches to sending information began to define
    and redefine the uses of the Net. Gore’s speech to the National Press Club that
    year was widely quoted and popularized the phrase “information superhighway” as
    a metaphor for the Net.


    It used to be that nations were more or less successful in their competition with
    other nations depending upon the kind of transportation infrastructure they had.'
