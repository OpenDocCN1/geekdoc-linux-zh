  md: '# The Edge of Chaos 189


    Eventually, other, superior technologies come along and roles shift. Those who
    had promoted change by introducing and spreading a technology become the conservatives
    who resist the changes offered by the next technology


    An installed base is both an advantage and a burden. It is an advantage because
    it can provide income to help a technology extend its time on Main Street. It
    can also be a disadvantage when the need for backward compatibility limits the
    technology''s ability to evolve to meet new challenges.


    # Erie Canal Stories—Meeting the Railroads


    [The railroads] . . . can reach no such point of supremacy, but where canals cannot
    be had may they were substituted, and, indeed, superior to any other land conveyance.


    Buffalo (N.Y.) Journal, 1831


    From its opening in 1825 the Erie Canal dominated transportation in New York state,
    bringing with it a new prosperity and a new way of life. The first railroads built
    in New York were used as feeder lines and seen as complementary to the canal.
    They boats would carry the heavy freight. The first railroad construction began
    in the 1830s with the building of the Mohawk and Hudson line from Albany to Schenectady.


    In the early 1840s, when railroads began carrying freight, the canal interests
    intervened politically. The state legislature required the railroads to pay fees
    and refused to issue them licenses to carry freight, except when canal navigation
    was suspended during the winter. Nonetheless, the railroads continued to grow.
    By 1842, the Attica and Buffalo Railroad, the Tonawanda Railroad, and six other
    lines completed the rails link between Albany in the east and Erie in the west.
    By 1843, three daily trains ran each way across the state, charming an average
    passenger fare of three cents a mile.


    Responding to this competition, the canal interests improved and enlarged the
    channels. The first boats were towed by teams of horses from towpaths on both
    sides of the canals. In the 1840s, larger steam-powered canal boats were introduced.
    One builder, Seth Jones of Rochester, produced canal freighters ninety-seven feet
    long'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 190 Chapter 7


    seventeen feet wide with a carrying capacity of a thousand barrels of flour or
    four thousand bushels of wheat. The Canal Board lowered the tolls on freight.
    For a while this reduction, together with the greater efficiency realized with
    the larger boats, lowered the cost of transportation and kept the canal competitive
    with the railroads.


    Throughout the 1840s the freight traffic on the canal grew. The decade freight
    mileage increased from 5,556,950 to 11,733,250. The volume of freight carried
    was greater than that of all of the railroads combined. The Erie Canal seemed
    to be entering its golden age, yet the growth of the railroads foreshadowed its
    fate.


    Ultimately, backward compatibility proved too great a burden. Canal freighters
    floated on water; reaching places away from the canal required feeder channels,
    which were much more expensive to build railroad tracks. Furthermore, the canal
    froze during the long New York winter, forcing the boats to stop for several months.
    By the 1850s, the country east of the Mississippi was criss with railroads. The
    faster service and greater connectivity of the railroads brought dominance, and
    the Erie Canal gradually faded from prominence.


