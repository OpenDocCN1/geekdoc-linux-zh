  img_proc: true
- pgno: 148
  md: 'Focusing the Light 131


    Perhaps the root of the problem lies in the standard measures of information retrieval—call
    and precision. Especially with regard to amplifying bias, using these metrics
    strictly contributes to the effect. Maybe what is needed is a greater appreciation
    of the value of outliers and contrary information. Imagine, for example, a retrieval
    system that returns snippets in three categories: relevant (mainstream), secondary,
    and outliers (contradictory). Indeed, we might be able to develop automatic means
    of representing relationships between the snippets and using such relationships
    to generate suggestions for modifying the sense.


    Another intriguing possibility is the idea that sensemaking systems could provide
    the basis for a kind of accountability of sensemaking. Once during a visit to
    an intelligence organization, I heard about a conversation that took place as
    a senior analyst was reviewing a draft intelligence report written by a junior
    analyst.


    **Senior analyst:** How did you conclude that we would approve building oil pipelines
    through ____? [a middle eastern country]


    **Junior analyst:** My source was a speech the Senator gave at ____. [eastern
    college].


    **Senior analyst:** Don’t you know what senators say in public addresses is for
    public relations and not policy?


    The example suggests that analysts learn a lot about evaluating sources and using
    them for reliable sensemaking. In a similar way, tools for sensemaking systems
    could record the use and disposal of information from different sources and the
    reasons why it is used or not used. One plausible benefit of such tools would
    be that they would record not only the conclusions of sensemaking but also crucial
    parts of the process of making the sense. Such an “audit trail” could become the
    basis of a descriptive practice of sensemaking for teaching. The records could
    be used by junior analysts learning by example or by senior analysts mentoring
    junior analysts about the rules of good sensemaking. Moreover, like the outside
    auditors called in to check a corporation’s books and certify that it has used
    good accounting principles, outside sensemakers could use the record to check
    a sensemaker’s product to certify that he or she followed good sensemaking practice.


    An interesting tension that arises from this example is that the line from implicit
    to explicit rules of interpretation can be fraught with'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 132 Chapter 5


    danger. Is the rule about public speeches valid for all public occasions? Does
    it apply only to senators, or is about other public or private officers? What
    exceptions are there to the rule? If the rule is not made explicit, it cannot
    be acted on automatically, nor even passed on to colleagues easily. If a rule
    is only implicit, an audit of information potentially bearing on a decision would
    turn up sources for no apparent reason. Clearly, formal sensemaking will challenge
    individuals and organizations to be explicit about their criteria and assumptions.


    As we have seen, before the process of inventing the Net—developing tools for
    finding and using the information on the Net—is also a process of shaping ourselves.
    We can design sensemaking systems that reinforce our biases, or can we devise
    ways to leverage our access to information and challenge our interpretations of
    it. Sensemaking, like other uses of the Net, is a fundamentally social process.
    We have an opportunity to design not only technology but also appropriate ways
    of using it together.


    The need for good accounting principles of sensemaking may become more crucial
    as more people rely more and more on the Net for information. A key, and potentially
    dangerous, characteristic of digital information is its intangibility and invisibility.
    As we increase the amount of information we obtain online, we risk becoming less
    familiar and connected to the actual source of the information. Since we are not
    there, we are less able to use the clues and context of the situation to guide
    us in using the information. More than ever, we require expertise and care in
    combining information from multiple sources.


    A good accounting practice for evaluating sensemaking could eventually become
    an important part of how society and individuals think about the effective use
    of the knowledge we generate and, especially, how to weigh our growing reliance
    on the Net to aggregate and distribute that knowledge.'
