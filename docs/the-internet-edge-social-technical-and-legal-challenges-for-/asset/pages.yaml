- pgno: 174
  md: 'A networked economy of knowledge servers could have all the same structure
    as a physical economy of manufacturers of hard goods and still not address all
    the issues salient to creating a knowledge medium. A car can be manufactured by
    the coordinated work of a tire manufacturer, glass manufacturer, engine manufacturer,
    and body manufacturer. Similarly, it can be designed (a knowledge-intensive task)
    by the coordinated work of a tire designer, engine designer, and body designer.
    The example is oversimplified, but it illustrates the principle. A knowledge economy
    needs something quite different: a community of knowledge servers capable of performing
    knowledge work and of exchanging edges that represent, in a mutually intelligible
    way, the results of that work. Such communities of knowledge services already
    exist in the intranet supply chains of many companies. There are intertwined online
    services that manage billing, order filling, and other “back office” functions.
    They fall short of being knowledge media, however, because knowledge itself is
    not what the networks produce, exchange, and consume. In the present state of
    the art, incremental advances in the use and combination of microtheories seem
    like good roads to progress in this area.


    Is it practical yet to create a knowledge medium based on computational knowledge
    services? The current state of the art falls short of realizing this possibility
    fully. Nonetheless, there are growing examples of on-line services—some of which
    are knowledge services. For example, there are configuration systems on-lineline
    that use an underlying shell. The role of the Net in these cases is presently
    limited to delivering the service to people; it plays no role in combining multiple
    knowledge services.


    Where the Net is playing a significant role in the delivery of documents. As more
    documents move-line—on the Internet or corporate intranets—there is an opportunity
    for Xerox, IBM, and knowledge-management and document-management companies all
    call knowledge sharing, in which the combining of knowledge is carried out by
    people.


    As suggested in chapter 5, there is a real opportunity for new kinds of technology—such
    as sensemaking technology—to help people find and combine knowledge from multiple
    sources. Such endeavors illustrate the'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'third approach to trafficking in knowledge in a knowledge medium—documents,
    as contrasted with “parts” and “services.”


    Although the documents approach may seem ordinary and low tech when compared with
    the AI techniques underlying the other approaches, it is not without its issues
    and edges. In earlier chapters we discussed the technological challenges of creating
    portable document readers; considered the difficulties involved in building the
    trusted systems needed to provide a secure economic basis for knowledge sharing;
    and looked at using copyright law and digital contracts as legal foundations for
    a document-based knowledge medium. The Internet edge is presenting us with plenty
    of challenges to creating a knowledge medium, even in a rudimentary digital form.


    # Bootstrapping a Knowledge Medium


    The foregoing discussion might make realizing our vision of a knowledge medium
    seem very distant. How could we bootstrap such a process? The goal of building
    a new knowledge medium is not to replace on expert systems with something completely
    different, or to replace network-based communications media. A knowledge medium
    based on AI technology would be part of a continuum. Unlike books and other passive
    media, which simply store knowledge, expert systems can store and also apply knowledge.
    In between are a number of hybrid systems in which most of the knowledge process
    is done by people. Even now, any opportunities for establishing human-machine
    partnerships and automating tasks incrementally already exist.


    One example of a knowledge medium using AI technology is the Trillium project
    used at Xerox in the late 1980s. The system, designed by Austin Henderson and
    others, created a knowledge economy based on the memes of interface design for
    photocopiers. Because copies, printers, and multi-functional devices possess more-powerful
    functions than the simple early machines, the design of user interfaces has become
    much more challenging. From one perspective, we could view Trillium is a sort
    of computer-aided tool for designing the controls of a copier. It provides a language
    for expressing the actions of a copier interface in terms of buttons, lights,
    actions, and constraints. Initially, Trillium was intended to model prototypes
    of interface designs rapidly so designers could quickly try them'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# The Next Knowledge Medium 159


    out and study the human cognitive factors related to their use. As Trillium evolved
    quickly into the best medium for describing copier interfaces, several other teams
    at Xerox began using it. Some teams, wanting to exchange their design concepts,
    developed software to help combine design concepts, and different versions of
    a prototype evolved at various sites. Trillium became a major (if not the major)
    medium for exchanging knowledge about user interfaces. It was used to design most
    of the interfaces of a whole generation of Xerox copiers.


    Trillium was not, however, conceived as an expert systems project but, rather,
    as a means of augmenting existing media—in case, telephones and e-mail—and it
    did so successfully. The main benefit of Trillium in this respect lies in its
    ability to express the memes of interface design, which are tangible artifacts
    in a knowledge medium.


    Another example of a knowledge-medium project at Xerox is the Eureka project,
    which was developed in the late 1990s. It started with a field study of on-site
    designs for photocopiers and highlighted the importance of field know-how. Eureka''s
    technology consists of a database of tips and hints for diagnosing and repairing
    Xerox printers and copiers. It gives members of service forces the power to create
    and share the working documentation of their communities, reflecting both their
    experience and the particular local differences in practice they have developed.
    Convincing and substantial productivity improvement was observed as the tips and
    hints in the database were contributed by some field representatives and checked
    by others. Eureka shows how the viability and health of an electronic medium is
    enhanced when it enables community members to organize and integrate their knowledge.


    # Toward a Knowledge Medium


    We have seen that the overall goals of building a knowledge medium are quite distinct
    from those conventionally embraced by AI. The vision of AI, as its name suggests,
    is the understanding and building of an autonomous artificial intelligence. Creating
    such an intelligence is compatible, and probably synergistic, with shaping a knowledge
    medium; and the enterprise of building a knowledge medium shares much of the technology
    that has become important to AI. Yet breakthroughs in AI are not prerequisites
    for'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'building or experimenting with such medium. Intelligence developed by AI can
    always be added to a knowledge medium incrementally at later stages.


    In 1977 Ira Goldstein and Seymour Paper announced a shift of paradigm in AI from
    a power-oriented theory of intelligence to a knowledge-oriented one. The fundamental
    problem for understanding intelligence, they argued, is not to identify few powerful
    techniques but rather to learn how to represent large amounts of knowledge in
    a fashion that permits their effective use and interaction. Now, more than twenty
    years later, we recognize that the bottleneck in building expert systems is getting
    knowledge into those systems (knowledge acquisition) and subsequently modifying
    and updating it over time. This recognition puts the field of AI in a position
    to shift even closer to the foundations of knowledge: instead of focusing only
    on mechanisms of intelligence, AI is now studying the role of knowledge in intelligent
    systems and looking for methods to augment the knowledge processes of a medium.


    The conventional, older goal of AI leads to projects for which the creators can
    say, “Look me, no hands!” The knowledge medium, however, requires us to change
    our goal from product to process and introduce new criteria for success. There
    are important questions to be asked. As a project evolves, will the new knowledge
    come from? What experiences will drive the creation of new knowledge? How will
    it be distributed and who will use it? What kinds of knowledge will be distributed
    and what form will this knowledge take?


    # Reflections


    In the late 1980s, many people in the AI and computer business world were watching
    the formation of the Japanese Fifth Generation Project. The original proposal
    for this scheme described a number of roles for knowledge-processing systems:
    increasing their intelligence to better assist humanity, putting stored knowledge
    to practical use, learning, and associating data. In its keynote speech for the
    second ICOT conference, Hiroo Kinoshita of the Japanese Ministry of International
    Trade and Industry hailed the creation of an advanced information society.


    In it, different information systems will be linked into networks, and a variety
    of services will be offered. In addition, rather than individuals playing the
    passive role'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'merely receiving information, they will be able to obtain that information
    which they require, use it, and transmit it among themselves, in what is expected
    to be a society more closely reflecting human nature. (Kinoshita 1985)


    This goal proved, ultimately, too ambitious for the Fifth Generation Project,
    which subsequently focused on narrower objectives and abandoned its plans to build
    experimental knowledge ecologies or knowledge markets. It did, however, demonstrate
    the process of planning for an earlier journey to the Internet edge. The network
    Kinoshita describes would be a knowledge medium in the sense we have used this
    term. Kinoshita, a policymaker, mentioned several of the practical difficulties
    of bringing the network into existence: the length period needed to write software
    and develop mechanisms (and knowledge) for computer security, interoperability,
    and better human-machine interfaces. His concerns are all valid and focus on the
    technical challenges we need to create a vibrant knowledge medium.


    The effect on the human condition of creating a knowledge medium is potentially
    tremendous. Such a medium could greatly enhance our ability as a culture to create
    and use knowledge. At the same time, the technology for knowledge media could
    provoke further pushbacks from the Internet edge. By augmenting the change amplifier
    described in chapter 1, automatic knowledge processes might well upset existing
    equilibria—creating new and unexpected knowledge and insights—as memes cross the
    until-now-impermeable boundaries of human specialization.


    The next knowledge medium will be a variant of our information market that applies
    greater automation to the creation and use of knowledge. In the 1980s and 1990s,
    elements of this dream appeared in the form of data-mining technology and communication
    support for people in a networked medium. With e-mail and the technologies of
    digital publishing, the Net already also function in a significant way as a knowledge
    medium, however, we will need to address the difficult issues of knowledge additivity
    and reusability.'
