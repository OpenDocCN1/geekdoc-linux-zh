    At first glance, the cautionary tales cited by Newell predict disturbing fates
    for those who rely on enchantment, but like all enduring myths, they lend themselves
    to deeper understanding. Such stories have been studied by Joseph Campbell (1988),
    Bruno Bettelheim (1977), Clarissa Polkola Estes (1992), Marie-Louise von Franz
    (1972), and many others. If high technology is, ''Chop wood,'' suggest indistinguishable
    from magic, it is arguably worth mentioning these old stories about misused magic
    for advice about our own relationship to technology.


    In the ''Sorcerer’s Apprentice,'' the technology runs amok. However, when the
    wise and powerful sorcerer discovers the mess, he does not break the brooms or
    blame the technology. Instead, he admonishes the apprentice and requires him to
    mind his ways. His original assignment to his assistant was ''Chop wood, carry
    water.'' This instruction—eerily identical to one ancient Zen masters—is about
    creating mindfulness in everyday activities. By trying to avoid the work of building
    consciousness, the apprentice created disaster. Among other things, the apprentice
    needs to learn awareness, patience, and responsibility.


    Bettelheim suggests two possible interpretations of the folk tale of the Jinni
    and the Bottle. It may be ''bottled up'' feelings that can get out of control,
    or it may point to the need for children (ordinary people) to use their wits when
    dealing with adults (giants). Newell complained that in many discussions of technology
    the original story is diminished by leaving the conclusion in which the child
    tricks the Jinni back into the bottle. (''It’s hard to believe that a big and
    powerful jinni like you could fit in so small bottle!'') The truncated story then
    becomes a cautionary tale, a metaphor for a bad invention—such as the computer
    or the atomic bomb—that, once created, cannot be reinvent. The apparent moral
    is that we need to take responsibility for our creations. If we don''t, or can''t,
    then some things are better not invented at all.


    The various tales of the Jinni in the bottle are often taken to mean that automation
    can be dangerous. When our wishes are fulfilled by machines that mindlessly follow
