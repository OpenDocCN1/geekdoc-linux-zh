    description of it will be brief. Each trusted system sends the digital certificate,
    which is digitally signed by a well-known repository; the certificate confirms
    the system''s identity, public key, and security arrangements. Each system constructs
    a *nonce*—a random sequence of digits—and sends it, encrypted in the other''s
    public key, and sends it back to the other party. Each trusted system decrypts
    the nonce, using its own private key, and sends it back. The systems also synchronize
    clocks and check their "hot lists" of rogue systems. If the trusted player fails
    the nonce, has too much deviance in its clock, or is on the hot list, the trusted
    store terminates the transaction.


