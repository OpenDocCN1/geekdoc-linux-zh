    # Communications Integrity


    Not all attacks on trusted systems require physical contact. Communication attacks
    are made over the wire, when a nontrusted system tricks a trusted system into
    giving up or compromising digital goods, private information, or digital money.
    To carry out their functions, trusted systems must communicate with people and
    other systems. In digital-wallet applications, these communications include the
    transfer and validation of digital tokens representing money. In digital publishing,
    they include the transmission of digital works and billing data.


    In general, a trusted system "views" the world through its communication channel.
    To use an analogy, imagine a trader locked in a room who has to obtain information
    and conduct all or her business by telephone. Like a trusted system for buying
    and selling works or transferring money, the trader can have certain passwords
    and keys. The world of this telephone trader (or trusted system) is rendered more
    complex by pirates, who may make fake telephone calls, masquerade as other parties,
    or listen in calls.


    Trusted systems, like our, need reliable ways to certify the bonafides of the
    party on the other end of a communication line, to verify that the messages exchanged
    are genuine and unchanged, and to keep the data communicated on the line secret
    from eavesdroppers. Meeting these goals requires communications integrity—secure
    and robust communications across insecure lines—lie in encryption technology.'
