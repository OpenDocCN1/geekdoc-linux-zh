    # Power and Rules for a Global Net


    In spite of the fact that the Internet is a working anarchy, still has to be one
    or something that sets the rules. If that sounds paradoxical, it is. The body
    that provides the rules is the Internet Society. It''s sort of a benevolent uncle
    to all the Internet users.


    Network Business Services web page


    The implications of this global communication—or interactive society—are obvious:
    national borders are increasingly disappearing within cyberspace; facts, issues
    and opinions interact anonymously; hypertexts produce new cultural linkages.


    Ingrid Volkmer, “Universalism and Particularism”


    In the 1960s sociologist and critical theorist Adolf Berle wrote a book with the
    simple title Power (1969). In it, he articulates theories about the principles,
    nature, and exercise of power in human affairs, substantiating them with examples
    from world history and corporate life. He observes, for example, that when a given
    power is not being exercised, people spontaneously to take it up. A memorable
    example of this occurred on the streets of New York City during the 1965 electrical
    blackouts when citizens stepped into intersections to direct traffic after the
    traffic lights stopped working.


    A key factor legitimating an individual’s or group’s exercise of power is the
    perception of the majority that the power wielder or leader is acting effectively
    to reduce or prevent chaos. In the electrical blackout, no official appointed
    the self-styled traffic “cops.” No governmental or democratic body sanctioned
    their work or invoked penalties on those who failed to'
