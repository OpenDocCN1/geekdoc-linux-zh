    # Digital News


    There is an old joke about a group of travelers who got lost in the country. Unable
    to find their way to a particular small town, they drive up to a farmer standing
    by a junction and ask him for directions. First he points off in one direction
    and starts giving directions. But then he pauses, and says, “No. That won''t work—the
    bridge is out.” Then he points in another direction and starts talking again.
    But he realizes another problem. Finally, he says, “Sorry. You can''t get there
    from here.”


    The humor of the joke lies in its absurdity. Although we may have to go the long
    way around, we can always get there from here. In cyberspace, we want the same
    thing. We always want to be able to get there from here. Increasingly, devices
    for cruising the Net are also also, one way or another,'
