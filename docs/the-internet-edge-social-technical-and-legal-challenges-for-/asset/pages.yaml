  md: '# Home Automation Meets the Net


    In the late 1990s, interest in linking the Net to home automation and other devices
    for controlling the environment led to the development of new versions of Internet
    protocols for linking devices. The slogan of the World Wide Wide Web conference
    in 1997—"Everyone • Everything • Connected”—refers to the devices in the home
    as well as to the people of the planet.


    Connecting home devices to the Net opens the door to applications that do more
    than turn lights on and off, support systems, and prepare the bath water. The
    key idea is to expand the external information available to home automation systems
    beyond parameters like power consumption, time of day, and temperature. Such Net-connected
    applications could include a much wider range of information services: for example,
    sensors in microwaves and other home appliances could read product codes on food
    labels and look up cooking instructions on the Net; refrigerators that could conduct
    inventories automatically, suggest vacation schedules, and automatically suggest
    ordering new food and discarding food whose life has expired.


    In the mid-1990s, early versions of office systems and information appliances
    that communicated through the Net were built as research prototypes. An example
    of such a project was the Ubiquitous Computing Project at Xerox PARC, headed by
    Mark Weiser. Weiser envisioned an office containing hundreds of small devices,
    all linked. There would be interactive boards of different sizes—ranging from
    post-it notes to blackboard surfaces. Even books could have tiny chips embedded
    in them. Individuals would carry small badges linked through infrared beams to
    the Net keep track of where they were. The project built operational prototypes
    of many of these devices—including badges and communicating handheld digital assistants
    (PDAs)—and installed infrared transceivers over a substantial part of the research
    center. The Ubiquitous Computing Project helped members of the Internet community
    understand'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Indistinguishable from Magic 269


    the need to extend Internet protocols to support lots of small, networked devices.


    Over a period of several years during the 1990s the number of network systems
    connected to the Internet doubled every twelve months. The version of the network
    protocol used in the early 1990s is designated IPv4 (Internet Protocol version
    4). The new version is called IPv6 or IPng (for next generation); in September
    of 1995 it became the proposed standard. By the late 1990s, there were implementations
    for over thirty kinds of systems. As this is written, use of IPv6 is limited mainly
    to research organizations. Deployment to the majority of sites on the Net is expected
    to take place several years.


    IPv6 is designed to run well on high-performance networks as well as low-bandwidth
    networks as might be available with wireless or power networks for home devices.
    It is also intended to accommodate expected growth in the number of Net-connected
    personal computers, portable or mobile computing devices such as PDRs, entered
    entertainment vendors, and devices such as lighting equipment, heating and cooling
    equipment, and home appliances. Members of the Internet Engineering Task Force
    (IETF), which designed IPv6, hope to offer a ubiquitous standard to meet this
    broad range of emerging markets and create a worldwide, interoperable information
    infrastructure with open protocols.


    A serious limitation of the present, IPv4 protocol is its reliance on thirty-bit
    addresses. This address-size limit seemed very generic when it was proposed and
    is probably large enough to carry the Net into the first few years of the twenty-first
    century. IPv6 was designed to expand addresses to 128 bits, a number large enough
    to support 665,570,793,386,943,889,599 devices per square meter of surface area
    on the planet.


    IPv6 also includes many extensions and improvements over earlier Internet protocols.
    Two of the improvements deal with security. One is an authentication header intended
    to prevent tampering with the contents of communications and improve information
    about the sources of data. A second extension, the encapsulating security header,
    provides the same functions but in a more complex manner designed to ensure that
    information is kept confidential.'
