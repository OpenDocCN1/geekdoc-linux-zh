    # Erie Canal Stories—Growth Along the Canal


    The flourishing growth of this city must be attributed almost entirely to the
    Erie Canal, which has opened our internal Commerce with the West, and poured upon
    us a rare, steady, and rapidly increasing stream of wealth.

    Samuel B. Ruggles, 1832


    As the canal was completed, it changed the experience of young people in New York.
    In particular, it encouraged a new and stimulating mobility. The entire population
    along the canal became familiar with new forms of river traffic—pocket boats,
    line boats, freighters, and scows—the commerce they brought. In every town people
    were employed to run the locks. Real estate near the canal took was developed
    to serve the traffic and people passing through.


    In the early years, canal life reflected the sensibilities of the young and restless
    people who built and ran it. Farmers built bridges over the canal to connect their
    lands. These were sometimes low that passengers had to duck or be swept from the
    deck. According to reports and songs from the time, younger passengers found this
    exercise entertaining.


    Oh, low bridge, ev''ry body down!

    Low bridge, for we''re coming to a town!

    You''ll always know your neighbor, you''ll always know your pal

    If you''ve ever navigated the Erie Canal.


    Not everyone was amused. An English visitor, Captain Basil Hall, soon tired of
    the fun. “It was rather amusing to hop down and then hop up again,” he wrote;
    "by, and by, and by this, skipping about became quite tiresome, and marred the
    tranquility of the very much day. There was no alternative but to return to the
    canal and narrow cabin" (Walker and Walker 1963).


    Canal commerce drove the development of western New York as goods and people traveled
    between New York City and the territories of the upper Midwest. The Erie Canal
    provided the cheap transportation that made it practical to ship wheat and other
    agricultural products from west to instead of south to New Orleans.


    Before the construction of the canal, New York City was the nation’s fifth largest
    seaport, after Boston, Baltimore, Philadelphia, and New Orleans. The canal attracted
    Atlantic shipping to New York City. Within fifteen years of the canal''s opening,
    New York was the busiest port in America, moving more freight than Boston, Baltimore,
    and New Orleans'
