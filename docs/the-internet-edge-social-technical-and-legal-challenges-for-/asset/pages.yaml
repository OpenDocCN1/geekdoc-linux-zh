  md: '# 10

    Indistinguishable from Magic: The Real, the

    Magic, and the Virtual


    One might say that our culture is “possessed” by the immature shadow-magician.

    When human beings use their magician potentials in the service of healing and
    comunity, the . . . energies of the immature magician—the trickster—are transformed
    into a mature, shamanic form that heals both self and the larger community.

    Robert L. Moore and Douglas Gillette, King, Warrior, Magician, Lover


    Many of the smart technologies that surround us—computers inside car engines,
    appliances, offices, traffic lights, and many other objects—resemble the visions
    of magic culture glimpsed in archetypal myths and folk tales.

    Handheld remote controls are our magic wands; we push the button and the environment
    responds automatically—opening the garage door or changing the music on the CD
    player. Smart automobiles and programmed trains perform without waiting for directions,
    they whisk us away to our destination. The enchanted castles of fairy tales, smart
    houses and buildings respond to our command, turning up the lights or lighting
    a fire in the fireplace. The small rings or electronic badges we wear for security
    or identification are enchanted, the technological equivalent of magic rings.
    They tell sensors in the environment that we are entitled to the powers, access,
    and privileges of an select group. Like the magical cloaks and suits of ancient
    folk tales, wearable monitors the environment and bring us information just when
    we need it. Even the lowly television set, when connected to the Net, becomes
    a magic mirror and a crystal ball, displaying objects and people far away letting
    us interact with them.


    Through its powers of computation and communication, the Net increasingly gives
    the machines and devices of our physical environment the capacity for intelligent
    action. Networked, they can act with coordinated'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 254  Chapter 10


    purpose and respond to remote or local control. More and more, the comput-ized
    world harkens back to the magic lands of our childhood memories, the Emerald City
    of the Wizard of Oz or the enchanted forests of Grimm.


    Like those magical locales, smart technology raises issues about power and control.
    Technology can offer us almost-inconceivable levels of con-, or it can threaten
    to control us. With so many devices in our envi- being computerized and networked,
    we find the world to be simultaneously real and virtual, magical and mundane.
    Such a world could be friendly and serving, or sinister and observing. Video eyes
    in the envi- ron watch over and take care of us, or they can spy on us and record
    our words and actions. The challenge of magic in every age is not just to develop
