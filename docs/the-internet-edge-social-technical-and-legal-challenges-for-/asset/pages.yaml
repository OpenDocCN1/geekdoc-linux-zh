- pgno: 189
  md: '# 1981


    In the second year of “Technology Watch” the four technologies described above
    continued to compete for ways to deliver information electronically. New technologies
    were entering the market and would soon affect the competition. Potential consumers
    of videodiscs for movies responded enthusiastically to a cheaper alternative as
    imported videocass recorders (VCRs) entered the market in quantity. A fax machine
    cheap enough for consumers was introduced and considered applicable to the home
    and office delivery of hard copies. It could transmit a page through the telephone
    network in under two minutes. The same year, the first relatively inexpensive
    laptop computers—the TRS–80s—were introduced by Radio Shack, and Random House
    developing mathematics curriculum software for them.


    The February 1981 issue described several experiments in delivering information
    electronically. Every AAP publishers were working together to provide a thousand
    “pages” for a teletext experiment in Fort Lauderdale. The information was broadcast
    in an electronic magazine of 125 pages; some pages were updated every hour, every
    hour, some only daily or weekly. “Technology Watch” cited the most frequent complaint
    as the delay between request for a page and its appearance on screen. Although
    the delay could be as little as two seconds, the average was thirty seconds.


    Precursors to the Mitel system began to appear in France, where the telephone
    company was installing fifteen hundred test terminals in the Île Vilaine. The
    expense was justified as an alternative to printing white and yellow pages telephone
    directories. Approximately 270,000 terminals were scheduled to be installed in
    the region in early 1982 at no cost to users. The Source Telecomputing Corporation
    reportedly ordered 250,000 American versions of the terminal.


    The AAP saw the involvement of the French telephone company in videotext as a
    potential threat to publishing. They were afraid that telephone companies would
    retain monopoly control over telephone lines, dominating electronic delivery of
    information to the home and perhaps competing unfairly with other news sources.
    By August, AT&T was apparently feeling some of this pushback. “Technology Watch”
    reported that because of protracted regulatory and legal proceedings, AT&T had'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# The Edge of Chaos 173


    decided to cancel its planned Austin, Texas, experiment in providing electronic
    yellow pages.


    An important part of the evolving story of the different technologies was a 1981
    update on the total numbers of electronic systems deployed. By 1979, “Technology
    Watch” reported, 535,000 desktop computers were installed in the United States;
    the column''s editors estimated that there were 3.1 million by the end 1980. During
    the same period cable television was installed in eight million homes and was
    potentially available to fifty-five million more. Teletext was still in limited
    distribution in the United States, although there were eleven million subscribers
    in the United Kingdom. According to these numbers, television-based systems had
    the greatest base worldwide and were the leading vehicle for electronic text information—in
    spite of their limited success in the United States. Videodisc, on the other hand,
    were poorly and facing increasing competition with VCRs. In 1980, the number of
    videorecorders imported into the United States jumped to 920,000 units, compared
    with 599,000 in 1979. The 1981 imports were projected to be 1.3 million units.


    From a global perspective, the picture of competing information technologies was
    confusing, because the outcome was different in different countries. In Sweden,
    teletext experiments had been conducted since 1975, and several thousand families
    had television sets with decoders. Videotex trials had begun in 1979 but were
    in a very early stage. In the United Kingdom, teletext had 180,000 users—more
    than anywhere else in the world—receiving both public and commercial services.
    Videotex had only 10,877 subscribers though it was available to 62 percent of
    the country. In Germany, teletext subscriptions were very low and videotex, with
    only 6,000 subscribers, was only beginning. There was a good deal of discussion
    about home delivery of information via satellite transmission.


    By the end of 1981, larger videotex were being developed for rural areas of the
    United States. In addition, developers were experimenting with charges for everything
    from books to groceries to determine what services consumers would pay for. On
    some trials paid to the services they chose. On others, experimenters charged
    a flat rate, in order to understand how consumer choices would differ if there
    was no incentive to extensive use.'
