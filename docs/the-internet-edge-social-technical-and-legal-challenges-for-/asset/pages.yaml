    # Technology for Making Sense


    In the late 1990s, the number of documents on-line grew by a factor of ten per
    year. This growth was fueled by the rapid start-up of new commercial and academic
    servers, the increased ease of posting web documents on popular service providers
    like America Online, and by the international expansion of the Internet. Even
    so, much on-line information—such as that provided by the on-line news services
    or posted on the growing body'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Focusing the Light 115


    of private corporate intranets—never gets indexed. As digital rights technology
    is more widely integrated into the Net infrastructure, many more documents containing
    potentially high-quality information will be available on the Net for a fee.


    Meanwhile, users'' experiences with the feast-or-famine phase shifts of search
    services are creating a pushback from the Internet edge. Their leaves many searchers
    feeling that the Net is an unreliable source. To the casual use of search services,
    the growth of information looks like an information explosion caused by network
    technology.


    Although people perceive technology as the cause of the information explosion,
    the most practical solution is also based on technology. It requires us to recast
    the problem from retrieving information to making sense of information.


    # Today''s Leading-Edge Senemakers


    Within the increasing population of computer users there is a growing set who
    spend a large fraction of their work life making sense of on-line information.
    These are people whose work requires them to sift through large quantities of
    data to understand something. Business analysts, are develop plans and strategic
    visions for new and established businesses, are senemakers, as are analysts in
    government intelligence agencies and scientific leaders, especially those who
    work on multidisciplinary problems. Information specialists in libraries, policy
    analysts in think tanks and other information centers, reporters and news analysts
    are all senemakers. Trial lawyers looking for relevant cases are senemakers. Patent
    attorneys looking for related patents and examining records of depositions are
    sensemakers. Students in college preparing reports on the material they are learning—as
    well as professors conducting research in various fields of learning—are senemakers.
    Even people who organize their e-mail into folders or device bookmarks for the
    web are senemakers. As they synthesize information from multiple sources, today''s
    senemakers have to extend their reach as more and more information becomes available
    on-line.


    Senemaking may seem like a solitary activity analogous to the lonely work of a
    scholar who spends years in the dimly lit archives of an old library. Yet senemaking
    involves not only solitary individuals but teams of'
