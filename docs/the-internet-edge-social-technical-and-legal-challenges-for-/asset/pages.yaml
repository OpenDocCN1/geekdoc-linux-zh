- pgno: 54
  md: '# The Portable Network 37


    Internet switches typically connect to the Net over T1 and T3 lines. These lines
    offer, respectively, data rates of 1.54 Mbps and 45 Mbps. The data rates with
    The letters OC in the name of a carrier stand for *optical carrier*. The base
    rate, for OC–1, is 51.84 Mbps; each higher level operates at a speed divisible
    by the base rate. Thus OC–3 runs at 155.52 Mbps. As advances in transmitting over
    copper wires were made, these speed designs began to be used for these lines as
    well. In the late 1990s, data rates above OC–12, earlier obtainable only in experimental
    systems, became commercially available in some locations.


    Asynchronous Transfer Mode technology (ATM) was designed to improve bandwidth
    over existing local and wide-area networks guaranteeing bandwidth for real-time
    traffic. An ATM network consists of a set of ATM switches interconnected by point-to-point
    links. ATM networks are fundamentally *connection-oriented*, meaning that a p
    point-to-point virtual circuit needs to be used across the ATM network prior to
    any data transfer.


    In the 1990s, making a broadband connection for most sites means laying fiber-optic
    cables. Recognizing the expense and practical difficulties of doing so in cities,
    several companies have started experimenting with wireless delivery of high bandwidth
    to fixed locations. Multipoint Distribution Service (LMDS) is an emerging broadband
    service that operates in the 28–31GHz frequency range. It is intended for delivery
    of voice, video, and data to business and residential end-users. The digital bandwidth
    provided by LMDS depends on the frequency bandwidth and degree of sharing the
    channel. CellularVision offers 500-kbps service in parts of Manhattan; it is aimed
    at cable television, data, and telephone use, but that is not an upper limit.
    Some services proposed deliver 1.5 Gbps downstream and 200 Mbps upstream per household.
    LMDS relies on a cellular architecture that provides new capabilities in wireless
    communications. In late 1997, the FCC put 1.3 GHz of spectrum up for licensing
    in 492 trading areas nationwide, the future of LMDS was chaotic and poised for
    rapid expansion. A key technical challenge for growth of a mass market in this
    area is development of low-cost transceivers.


    WinStar is an example of a company that is providing this technology. Its wireless
    technology uses the 38-GHz spectrum to deliver OC–3 (155 Mbps) data rates on a
    100-MHz channel. In a typical application, the'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Chapter 2


    antennas are mounted on rooftops or windows in an unobstructed line-sight configuration.
    The antennas interconnect two customer locations or link a location to a WinStar
    fiber access node. All communications in this frequency range require line-of-sight
    to ensure high reliability. Signals at this part of the radio spectrum propagate
    like light beams and may be blocked by foliage. In residential applications, therefore,
    reliability requires antennas to be mounted above the tree line.


    LMDS is an improved version of an earlier microwave technology known as Multipoint
    Distribution Service (MDS) or wireless cable. MDS is a low-powered broadcasting
    system operating in the UHF bands—2.076 to 2.111 GHz and 2.3 to 2.4 GHz. It was
    designed for low-powered services using transmitter power of 200 watts within
    a service area of thirty kilometers. Multi-channel Multipoint Distribution Service
    (MMDS) is an MDS system that broadcasts on more than one channel to potential
    customers. The main problem with both MDS and MMDS is that the signal tends to
    break up in bad weather. LMDS addresses this problem using repeaters. LMDS also
    relies on new generations of semiconductors capable of operating in the 30-GHz
    range. Speaking of the reliability of LMDS systems at a public forum before the
    FCC, Stagg Newman of Bellcore remarked that “enthusiasm for LMDS is inversely
    proportional to the number of leaves you see when you look out the window”. In
    October 1996, Pacific Telesis Group agreed to buy wireless transmission capacity
    from WinStar. Initially concerned about the reliability of a wireless connection
    in rain and other weather conditions, Pacific Bell tested the service and found
    its reliability to be a par with its wired services.


    Broadband wireless connections are also being offered via satellites. These systems
    can be used in regions that lack an aerial fiber-optics network. General Instrument
    Digital offers satellite connections with 17 Mbps data rates. An example of a
    satellite-based technology for homes and small businesses is DirePC, a 400-kbps
    Internet connection at the 12-GHz frequency. DirePC is offered internationally
    by several companies, including Hughes, Olivetti, and Digital Satellite Source.


    # Toward Mobile Broadband


    In the late 1990s communication technology was co-evolving rapidly along with
    public policy and the allotment of frequency spectra. None of the technologies
    discussed so far can quite offer broadband communication for'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# The Portable Network 39


    mobile application like a PDR. While suitable for e-mail over a wide area, low
    bandwidth communication such as Ricochet is on the slow side for Net surfing and
    is inadequate for most video applications. Wireless LAN technology offers much
    better bandwidth but is limited to a work site. LMDS technology has plenty of
    bandwidth, but does not work for mobile applications.


    At the end of the 1990s a new technology entered the mix. Phased-array antennas,
    originally developed for the military to enhance radar sensitivity, have the potential
    to greatly improve bandwidth at the work site and also to provide higher bandwidth
    to mobile units.


    Several systems using this technology for mobile broadband communication are currently
    at the research stage. For example, the System For Advanced Broadband Application
    (SAMBA) is a joint European project to develop a broadband cellular-radio communication
    system. It is intended to provide ATM connections and other services up to 34
    Mbps. A key idea in SAMBA is the use of phased-array antennas as adaptive, directed
    antennas. Directed antennas focus their transmitted signal in a narrow region
    rather than a circular region, increasing the range for a given power and reducing
    interference with other signals. The ability to focus the signal also means that
    the frequencies can be reused by a base station to communicate simultaneously
    with multiple receivers located in different directions. Direction division increases
    the capacity for sharing channels using Frequency Division Multiple Access (FDMA).
    The latter shares the same frequency with multiple communicators and with Time
    Division Multiple Access (TDMA), which timeshares portions of a channel at a given
    frequency among several communicators.


    In the late 1990s, broadband mobile communication was represented by experimental
    prototypes in research laboratories, but it will be some time before it is commercially
    deployed. The advantages of phased-array antennas, algorithms for tracking and
    roaming computers are known, and experimental access protocols are in. Although
    there appears to be a tight trade-off between bandwidth and the number of mobile
    users and delay, the bandwidth of 34 Mbps in the SAMBA project is more adequate
    for most PDR applications. However, there are still technological obstacles to
    applying directed antennas. To increase their communication range, it will be
    necessary to provide both the base and the mobile unit with directional antennas.
    Mobile'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'tracking will also be needed to aim the beams with adequate precision. These
    technological challenges will need to be surmounted before this approach can be
    put into general use.


    Impulse radio, a radical approach to high bandwidth wireless communication, was
    reported in 1999 by Time Domain Corporation. For communication, impulse radio
    uses long sequences of pulses called “pulse trains.” Each pulse is a short Gaussian
    monocle (“pulse”) with a tightly controlled pulse-to-pulse interval. According
    to the company reports, Time Domain has built prototypes with variable data rate
    at 39 and 156 kbps, communicating over ten miles using only 250 microwatts. Impulse
    radio is predicted to be suitable for site communications at 160–400 megabits
    per second, as well as for communications to miniature cell phones. In 1999 the
    promise of impulse radio was reported in the technology news but the timing of
    its practical application for mobile communication was uncertain owing to a combination
    of development issues and patent litigation.


    In summary, the economic and pragmatic issues related to communications technology
    for providing wireless broadband at either a site or over large areas have to
    be addressed, although the prospects for mobile broadband are improving. As communications
    technology develops, it seems likely that PDRs will have multiple choices, with
    increasing bandwidth available as they shift from wide-ranging mobile use, to
    use within a site, and to wired connections. Finally, for mobile use, there may
    be distinctions between available channels. For example, a PDR may be able to
    receive a constant high-bandwidth public channel for digital mass media and a
    slower or intermittent two-way digital connection for personal communications.


    # Processor Technology


    Watching trends in the early microelectronics industry, Gordon Moore predicted
    in 1965 that the number of transistors on computer chips would double every months.
    For thirty-five years Moore’s prediction has been accurate and has led to the
    widespread view that such incremental progress in chip design is almost inevitable.
    The driving force behind Moore’s Law has been the industry’s success in decreasing
    the feature size'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# The Portable Network 41


    of integrated circuits, that is, computer chips. As chip features get smaller,
    the computers built out of those chips get faster—at the rate of roughly 44 percent
    per year.


    Why do chips get faster when feature sizes get smaller? Although the particulars
    of chip design are complex, there are some simple ways to explain why this is
    generally so. Electrons travel at about half the speed of light. When chips get
    smaller, the electrons that race between registers computations arrive sooner
    because they have shorter distances to travel. This observation would predict
    a roughly linear speedup as feature sizes shrink. But the speedup is actually
    more dramatic than that. A more accurate way to understand the phenomenon is to
    remember that state and communication on chips is carried out by wiring wires
    and gates. Gates and gates have *capacitance*, the ability to hold a charge. The
    capacitance of gates and wires declines with conductor size, and, because they
    are twodimensional areas, they scale with the square of the feature size. Thus,
    small feature size devices can be charged more quickly.


    Chip feature sizes have decreased in size because of improvements in lithography,
    the technology used to inscribe patterns on the silicon chip that are made. Shorter
    wavelengths of light can be used to write smaller features on a chip, as sharper
    pencils can write thinner lines.


    In 1997 the ultraviolet (UV) light chips made to image features state-of-the-art
    chips had a wavelength of 248 nanometers, which enabled them impart features of
    0.25 micrometers. By the year 2001, industry leaders expect to produce features
    of 0.18 micrometers, using UV with a wavelength of 193 nanometers. With a few
    more improvements, they hope to produce features of 0.13 micrometers by 2004.
    Past that point, by 2010 or 2017, different observers predict that incremental
    progress will come into play. There is, general agreement that new approaches,
    such as using X-rays or so-called *extreme ultraviolet*, will be needed to in
    chip features.


    Even in the next few years, fully exploiting smaller feature size for greater
    chip speed will run up against other challenges. Chips made with the mainstream
    production processes of early 1997 had 0.35-micrometer features and speeds of
    233 MHz. At a feature size of 0.18, a 1000-MHz (1-GHz) chip would consume 40 watts
    of power (in the absence of other changes). To reduce power consumption, industry
    leaders will have to set a goal of reducing voltage from 3.3 to half a volt. Progress
    on this front was'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Chapter 2


    announced in 1997, when IBM revealed it had developed the ability to use copper,
    instead of the usual aluminum, for metal connections on chips. The changes enable
    them to use a voltage of 1.8 volts with 0.20-micrometer features. In 1998 IBM
    announced it had developed silicon-on-insulator (SOI) technology. This advance
    involves effective use of a thin layer insulating material that reduces the amount
    of electrical charge a transistor uses to store information. This technology reduces
    the effect of between signals on a chip and the effect of background radiation—giving
    a chip designer an option to lower the voltage, raising the operating frequency,
    or shrink the circuits. Use of SOI is expected to increase the speed of chips
    by as much as 35 percent. These advances exemplify the suite of technologies the
    industry must incorporate as it moves towards the next generation of computers.
    In early 1998, several companies announced laboratory success with gigahertz chips,
    including one made by IBM that consumes only 6.3 watts, even without using copper
    or SOI.


    The availability of capital for manufacturing advanced chips is another challenge,
    as each new generation requires additional capital. A plant for making 0.25-micrometer
    chips costs $2 and $2.5 billion to construct. Manufacturing plants for 0.18-micrometer
    chips are expected to cost between $3 and $4 billion.


    What are the implications of these trends in processor and chip technology for
    PDRs? Following the curves to 2002 suggests that PDRs would run at 1.2 billion
    instructions per second and have a gigabyte of RAM and twenty gigabytes of storage.
    In general, the incremental progress on chips is all good news for the feasibility
    of PDRs. PDRs can make use of the increased speed the next generations of chips
    will provide. Faster hardware for signal processing would be very useful in implementing
    phased-array antennas for mobile communication. Faster hardware for encryption
    could be very useful in designing trusted systems for ensuring electronic commerce
    and privacy on PDRs. Faster hardware for bulk compression and decompression of
    data could help reduce data rates for mobile communication. Integration of the
    processor and memory on a single chip could speed up the general level of processing
    for interactive systems.


    The technology-development curves for processors and chips are encouraging and
    may help to simplify PDR design by compensating for challenges in other areas.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Battery Technology


    Today''s users of laptop computers have an intimate but unintended relationship
    with batteries. In the early 1990s, Radio Shack''s TRS 200™ computer achieved
    almost twenty hours of use on AA batteries available everywhere. It achieved this
    battery life by using a characters-only display with no backlighting. In the late
    1990s, typical laptop users are lucky to get four or five hours on a charge. Thus,
    today''s users must keep track of the state of their batteries and the opportunities
    for recharging. To compensate for the shortage of readily available power outlets
    on airplanes and public places, they often carry a charger plus two or three extra
    batteries, effectively doubling the weight of the computer.


    As a colleague of mine remarked, there is no equivalent of Moore''s Law in battery
    technology. Batteries do not improve every year by incremental and predictable
    advances in materials design but only when there are breakthroughs and new technologies
    are introduced. The timing of breakthroughs, though, is not predictable.


    There are two key measures of battery technology: the total energy capacity of
    a battery and the energy it can store for a given weight or volume. The latter
    is called the gravimetric energy density (GED). An alkaline D-cell can store about
    65,000 joules. In an ideal case, this means that we could draw from it one watt
    of power per second for 65,000 seconds.


    In figuring considerations for PDRs or other portable devices, it is useful to
    consider the GEDs for rechargeable battery technologies that were available in
    the late 1990s (see table 2.3).


    # Table 2.3

    Gravimetric energy density (GED) of rechargeable batteries, 1998


    | Technology | Watt-hours/kilogram | Watt-hours/liter |

    |---|---|--|

    | Nickel cadmium | 40 | 80 |

    | Nickel metal hydride | 60 | 110 |

    | Lithium-ion | 90 | 130 |

    | Zinc-air | 146 | 181 |

    | Zinc-air (button cells) | 340 | 1050 |'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Chapter 2


    Zinc-air batteries, which came on the market in the late 1990s, require significant
    free airflow over the battery. They can power a 20-watt portable device for over
    eight hours and weigh 3.4 pounds. The U.S. Advanced Battery Consortium and others
    are funding development of lithium-ion polymer batteries targeted for use in electric
    cars. These batteries have projected capacities of 200 watt-hours per kilogram.


    The battery situation for PDRs is similar to that for laptop computers, since
    the underlying technologies are so similar. Both kinds of devices need power for
    the processors, for local storage, and for the display. Furthermore, the power
    needed for digital communications will put substantial demands on battery life.
    In the late 1990s, a lightweight battery weighed two to four pounds. Adding wireless
    communication such as Metricrom''s Ricochet wireless modem (including the battery)
    adds another thirteen ounces. Under normal use, the battery for a laptop lasts
    from two to four hours and consumes ten to twenty watts per hour, with the lion''s
    share going to the display. The most advanced model of the wireless modem with
    nickel cadmium battery lasts three hours in continuous use or about twelve hours
    in intermittent use.


    Two trends beyond battery chemistry affect power usage in portable devices. The
    first is use of so-called smart batteries, which include an integrated circuit
    that monitors various parameters such as voltage, charge, and temperature and
    provide precise control of battery charging and output. This increases battery
    life by about 2.5 percent and enables the charge to be precisely controlled. The
    second trend is designing the electronics of the device to conserve power when
    it is out of range of the cellular transceivers and when there is no data to be
    sent. Some laptop sys-tems allow a user to make trade-offs—such as adjusting clock
    speed, display brightness, and disk performance—in order to prolong battery life.
    For portable devices used in a contained environment, another option is to provide
    ubiquitous docking stations where the devices can be easily and conveniently recharged.


    One of the implicit and wonderful properties of paper media is that documents
    can be read in ambient light without requiring power. Although readers cannot
    expect to download a novel at the beach and read it all day without changing batteries,
    they could probably do if they had an extra set of batteries and recharged them
    overnight. In the absence of breakthroughs'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# The Portable Network 45


    in technology—either to increase the power capacity of batteries or to decrease
    the power requirements of displays and other components—PDRs in the near future
    will not be as trouble-free as their paper counterparts.


    # Summary of Technology Trends


    We have seen in the foregoing sections that the technology for building an ideal
    PDR does not exist in the late 1990s but is getting closer.


    LCD displays now available for PDRs have relatively high power requirements. Although
    displays whose apparent resolution approaches of printing on paper are very expensive,
    they are decreasing in price at the rate of 10 to 20 percent per year. LCD technology
    has been improving incrementally, and several competing technologies are waiting
    in the wings.


    The communications technologies currently available for PDRs are not capable of
    broadband data rates over a large geographic area. They can support low bandwidth
    (suitable for e-mail) over a large area and higher bandwidths at a work site.
    Technology for directed phased-array antennas is in the works and could radically
    increase bandwidth and decrease power requirements over large areas and at work
    sites.


    Processor technology continues to follow Moore’s Law, yielding speed increases
    of about 44 percent per year. In the next few years, increases in speed may help
    to overcome other design challenges, as the need for faster processing in signal
    processing, compression, and encryption.


    Battery technology does not follow any trend of predictable improvement. With
    currently available laptop systems, the trade-off between weight and power capacity
    provides a portable life of about four hours between recharges. Contributions
    to the useful life of batteries for PDRs may come fairly soon from the use of
    low-power electronics and reflective displays. A radical breakthrough in either
    display or battery technology will be needed before manufacturers can produce
    the ideal PDR weighing less than a pound.


    # Being Careful What You Wish For


    There are many folk tales in which a character is granted three wishes. He or
    spends the first wish accidentally, on something foolish, and the second deliberately,
    on something seemingly desirable that has unintended and'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Chapter 2


    disastrous consequences. The third wish, of course, is spent on recovery—trying
    to return things to the way they were before the wishes.


    People have been dreaming about and wishing for PDR-like devices for many years.
    It is hard to predict from the technological trends exactly when the technology
    for PDRs will be widespread and cheaply affordable. Nevertheless, the possibility
    of their widespread deployment comes closer every year. Children born in the next
    few years will be used to life with PDRs, as many children born in the 1980s never
    experienced life with- microwave ovens, home, video, or computer games.


    How will PDRs change our lives? To find answers to this question: What could a
    PDR do? What would we do with them?


    PDRs and related devices are more than technological achievements. We started
    our discussion of PDRs by comparing them to paper and consider- ways to make documents
    both digital and portable. Making documents digital and portable changes a lot
    of things, and adding the potential for broadband communications changes a lot
    more. PDRs will change our personal and work lives can and, inevitably, cause
    chaos during the period of change. They will create major discontinuities with
