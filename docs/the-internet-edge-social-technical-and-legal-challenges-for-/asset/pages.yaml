- pgno: 185
  md: '# Watching Technology: Pushbacks from the Internet Edge


    In the United States the leading professional organization of the book publishing
    industry is the Association of American Publishers (AAP). In 1980, the AAP added
    a “Technology Watch” column to its monthly newsletter to monitor and assess technologies
    relevant to electronic publishing (Risher 1980–1985). For publishers, electronic
    publishing is either a dream or a reason for dread, depending on whether they
    see it as a new business opportunity or a threat to existing markets. These competing
    views were reflected in the second column of “Technology Watch,” which carried
    the subtitle “Electronic Publishing: Opportunity or Threat?” Absent from the title
    was a third, cynical, and possibly majority, view: “Bust”! In the following pages,
    as an example of how trend spotters work in a period of rapid change, we consider
    stories from the column that appeared over a four-year period.


    In its first appearance in February 1980, “Technology Watch” reported on three
    new technologies. The first, developed by Microsonics Corporation, was a way of
    encoding sound in printed messages. The technology was being considered by Time
    magazine’s editors to permit readers to hear the voices of people quoted in its
    articles. The second technology was being tested by the Xerox Corporation to modify
    copiers to locate bar codes on documents. These copyright-sensitive copiers would
    produce hard copies only after recording the item in a copyright report. The third
    technology, two devices for reading printed text, was introduced by Kurzweil Computer
    Products. One of the device converted the scanned text to synthetic speech; the
    other converted it to digital text.


    The three technologies led to different pushbacks from the edge. The text-embedded
    sound messages never achieved broad reach, perhaps because they required subscribers
    to buy handheld scanners for this purpose alone. The copyright-sensitive copier
    was immediately shelved when initial tests showed that be profitable the new equipment
    required a volume of copying beyond what was done in most libraries and information
    systems. Several related devices were tested by Xerox over the next few years,
    but ultimately, pushbacks came from both publishers and the competition.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# The Edge of Chaos 169


    Xerox determined that copiers with copy-prevention features would not sell as
    well as those that make unimpeded copies; and publishers calculated expected revenues
    from the transactions would not cover the costs of accounting and assigning bar
    codes to texts. For a while, the Kurzweil products were the viable optical character-recognition
    devices in the niche market. Over the next few years, however, companies with
    greater dedicated resources entered and expanded the market, reducing Kurzweil''s
    market share.


    Of the three technologies in this example, two failed in the market for which
    they were intended and the third succeeded at first but was later displaced by
    a competing technology. The first two failed to make the transition from innovators
    to early adopters, and the third failed to cross the chasm of the adoption cycle
    to Main Street. Such turmoil in the introduction of a technology is not unusual.
    When a new technology requires or enables wide-ranging changes in how something
    is done—as the shift from paper publishing to electronic publishing—the potential
    for payback and chaos is even greater. One way to look at this chaos is a reflection
    of the interaction between creative energies and complex situations. While some
    promoters and early adopters are searching for things that work, others are resisting
    things that do not work for reasons that promoters do not yet understand. Creative
    energy tries to find a way through a complex collective edge.


    # Four Years on Fast Forward


    From the perspective of the late 1990s, early 1980s technology seems primitive
    and tame. Nonetheless, technology watchers trying to anticipate its effects on
    publishing were seeing early versions of systems and witnessing controversialial
    pushbacks that parallel those of the 1990s. New technologies were appearing every
    few months, and publishers were trying to work out strategies for dealing with
    them. To compound the confusion, the mix of technologies offered suggested many
    possible futures. To recreate the sense of anticipation and bewilderment that
    reigned, we trace some of the new technologies of the period as they were evaluated
    in “Technology Watch” over a four-year period.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# 1980


    The opening year of “Technology Watch” saw the public introduction in the United
    States of videotex, teletex, videodiscs, and information utilities for personal
    computers. Each of these technologies seemed to offer new possibilities for electronic
    publishing. Although they all promised to deliver information to the home or office,
    their strategies were quite different. In 1980, technology watchers bet on whether
    information would be delivered on prerecorded discs or over the wire; if over
    the wire, they waged on television sets, mainframes or personal computers.


    The videotex technology linked databases to television sets through telephone
    and cable television lines. Test users received a modified television set and
    a keypad. By pushing appropriate buttons, they could select from a menu of program
    categories including news, shopping, education, health, travel, automotive, puzzles,
    and entertainment. They could order merchandise and select the stories they wanted
    to watch. Promoters expected videotex to grow to reach a mass audience.


    In March of 1980, “Technology Watch” reported that Knight-Ridder’s subsidiary,
    Viewdata Corporation, was wiring around two hundred homes in Coral Gables, Florida,
    for a videotex service called View. Publishers such as Addison-Wesley and Macmillan
    developed materials for the test, and the booksellers B. Dalton offered automatic
    ordering of books from a list of best-sellers.


    One of the limiting factors in the experiments was that only a small number of
    television sets were suitably modified to work with videotex. To test a system,
    developers typically wired only fifty or sixty houses at a time, removed the modified
    sets to try the system with a new batch of users.


    Another technology, teletex, used television sets to carry information, however,
    communication was one-way. Users could select what they wanted to view, but they
    could not send signals back to the broadcaster. The system uses the vertical blanking
    of the standard television signal to carry information and provide users with
    a decoder to retrieve the text and graphic content embedded in the signal.


    The videodiscs of 1980 were large-format discs for storing television signals.
    The May 1980 “Technology Watch” reported that technological advances made it possible
    to store up to fifty-four thousand pages of'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# The Edge of Chaos 171


    digital information on a videodisc for random-access retrieval. The possibility
    of using a videodisc with a computer instead of a television set was seen as opening
    up many new possibilities: video demonstrations at trade shows, educational applications,
    and storage of large databases. Different and and incompatible formats of the
    disc were marketed by MCA/Philips, RCA, and JVC. “Technology Watch” noted that
    the lack of a uniform standard caused confusion for consumers and was inhibiting
    publishers from getting involved.


    Another emerging technology concept in 1980 was the digital information utility.
    This technology differed from videotex and teletext in that it was based on computers
    instead of television sets. A user with a terminal could dial into a time-shared
    mainframe to gain access to on-line information. Some companies offered experimental
    services with specific databases; AT&T experimented with electronic Yellow Pages,
    Dun and Bradley street with an on-line guide, and Nexis and Mead Data Center provided
    dial-up access to stories in the Washington Post, Newsweek, and The Economist.
    An on-line service called the Source offered different kinds of service. Rather
    than billing for access to particular information, the Source and other dial-up
    services based their charges on the time users were connected to the mainframe.


    In 1980, “Technology Watch” reported that several technologies were experimenting
    with on-line education. The Source was distributing lecture notes and offering
    a degree program, and videotex services were trying two-way video classes. The
    same issue announced a new National Science Foundation grant for developing educational
    programs using personal computers. Each of the technologies introduced that year
    was leveraging its unique points: a remote video classroom experience for videotex,
    inexpensive and coordinated information distribution for an information utility,
    and individualized programmable interaction for personal computers.


    The December issue also included a discussion of potential copyright problems
    relating to videotex. Polaroid was promoting a CU–5 close-up camera as ideal for
    making photos from a television screen–which would have been perfect for making
    hard copies of videotex pages. Although the volume of information being distributed
    in videotex was not commercially significant, publishers were already anticipating
    copyright problems.'
