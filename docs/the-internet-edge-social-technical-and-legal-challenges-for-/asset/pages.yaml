- pgno: 304
  md: '# Epilogue: The Next Edge and Discovering Ourselves


    In bringing closure to writing this book, two main questions arise for me: “What
    comes next?” and “What does it all mean?”


    # More Waves from the Net


    What is the next edge? In collective edges like the Internet edge there is no
    single answer. Nonetheless, it seems appropriate to speculate about edges we may
    come to in the future. In that spirit, I return to the trends we looked at in
    the last chapter.


    The trend toward networking devices begun in digital manufacturing is being applied
    in more and more areas of production. This is true not of the relatively exotic
    technology of stereolithography—drilling of materials; folding, cutting, or milling
    metals; printing on various materials; and sewing and weaving. Networking makes
    it possible for people to spend time on manufacturing machines through the Net
    and to receive digital instructions for making objects.


    This is not to say that there will be such a renaissance of interest in making
    things that everyone will be doing it. It is more likely that specialists in designing
    and programming for automated manufacturing will advertise their services on the
    Net; others who want to have something custom made might also advertise their
    needs. Web-based auctions, already used in a small way, could connect people with
    experts whose special skills and excess manufacturing capacity could fulfill them.
    The “Net effect” of all this may be waves of garments and extraordinary gadgets
    designed for special interest groups. Because'
  merge: -1
  img_proc: true
- pgno: 305
  md: "# 288 Epilogue\n\nmuch of the early work and design would be done invisibly\
    \ by people at scattered locations on the Net, these waves of items would appear\
    \ to spring up everywhere at the same time. \n\nImagine teenagers marking their\
    \ “clans” with distinctive kinds of clothing or jewelry not available through\
    \ the usual retail channels. Imagine sports enthusiasts—say bicyclists or surfers—suddenly\
    \ appearing with unusual new kinds of gear. Imagine art objects or car accessories\
    \ s that appear almost overnight, seemingly out of nowhere. The Net could trigger\
    \ waves of cultural experimentation in people and groups who are invisible until\
    \ they show up with their unique and possibly weird artifacts. The Net could trigger\
    \ further reorganizations of business and manufacturing, with outsourcing of design,\
    \ manufacturing, and distribution. This is expected to unfold over the next twenty\
    \ years.\n\n# Discovering Who We Are\n\n+   Q. What is necessary?\nM To grow is\
    \ necessary. Togrow is necessary. To leave behind the good for the sake of the\
    \ better is necessary.\nSri Nisagadatta Maharaj, I Am That\n\nHaving now at delivered\
    \ one answer to the “What’s next?” question—in terms of the growth of radically-distributed\
    \ manufacturing—we turn to the other question, “What does it all mean?”\n\nAn\
    \ interesting property about edges is that new ones keep coming. When we are working\
    \ on one edge—starting, peaking, and trailing—the next one is beginning to take\
    \ shape. Edges are like waves on the ocean, but more varied. Each one prepares\
    \ the way for the next.\n\nIf we imagine ourselves to be swimmers amid these waves\
    \ of change, what is enduring in all this? It is in this spirit that I approach\
    \ the question about meaning.\n\nBhagavan Ramana Maharshi, the great Indian sage,\
    \ was known for his simple teachings. When he taught he asked his visitors to\
    \ ask themselves one question: “Who am I?” This question, like the Western admonition\
    \ to “know thyself,” is asked in some form in most spiritual traditions. Sri Nisagadatta\
    \ Maharaj observes that when one meditates on this question, looking very carefully\
    \ at the answers that come to mind, the self"
  merge: -1
  img_proc: true
- pgno: 306
  md: '# The Next Edge 289


    comes hard to pin down. We are more than our positions in our families, more than
    our occupations, more than our age group, more than our particular interests,
    more than our nationalities, more than our races. Even our thoughts come and go.
    So what is the enduring part of who we are? The ego fades away as the boundary
    between the self and the other fades away.


    It seems to me that the Internet edge raises a collective analogue to this question.
    Who are we? By connecting our cultures more closely, the Net brings us to face
    with our differences and similarities. It challenges diversity. It triggers waves
    of cultural mixing as the Net crosses boundaries. Like the next edge, it may trigger
    new waves of cultural exploration, unleashing forces that simultaneously diminish
    cultural diversity and create new cultural diversity. Either way, it challenges
    the status quo of who we are.


    # Reflections on the Mountain


    The birds have vanished into the sky, and now the last cloud drains away. We sit
    together, the mountain and me, until only the mountain remains.


    Li Po


    And then the mountain disappears without a trace And all it took Was a sudden
    Leap of Faith.


    Kenny Loggings and Guy Thomas, from the Leap of Faith album, Columbia Records


    Mountains are special in many spiritual practices. In the winter, snowstorms may
    swirl around the mountain. When the storm clears, the mountain is still there.
    In the summer, people may swarm the mountain making picnics and hiking to the
    summit. And in the evening, the silence of the mountain is still there. The mountain
    symbolizes an eternal core and presence, impervious to commotion and change.


    In Tibet, where I trekked during the last phase of writing this book, there is
    a holy mountain known as Mount Kailash. With on our trek were three Nepalese shamans,
    who are expected to come to the mountain at least three times during their lives.
    They come once when they receive'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 290 Epilogue


    calling, once in mid-life to renew their power and purpose, and once at the end
    of life, to release their spirit. When shamans die before making this journey,
    their villages have an obligation to perform a ritual for returning the spirit
    to the mountain.


    For the Buddhists, the mountain is holy and is said to be the center of the world.
    A great festival is held there in June to celebrate the birthday of Buddha''s
    enlightenment. Buddhists are expected to walk around the mountain in the clockwise
    direction. A more ancient, indigenous Tibetan religion Bön Po, practiced by the
    mountain as sacred. Its religious symbols are similar to those of Buddhism but
    reversed in some way; they walk around Kailash in the counterclockwise direction.
    On our trek we encountered and met with people of all of these spiritual orders,
    each of them honoring the mountain in their own way.


    For Hindus Mount Kailash is a holy mountain, the home—and also the embodiment—of
    Shiva. Within all the variations and manifestations of Shiva are the essence of
    three faces—creating, sustaining, and destroying. As we saw in earlier chapters
    (especially chapter 7), these faces are also characteristic of the stages of an
    age. Edges mark a change. A new order is created, sustained, and finally passes.
    The faces are metaphors for life’s transformations. Life is full of change.


    It is paradoxical that Mount Kailash should be said to embody Shiva, for the mountain
    that represents the god of transformation also embodies steadiness and changelessness.
    The mystery within that contradiction brought me to select the two short poems.
    The first, by the Chinese philosopher Li Po, speaks of the transitory nature of
    life, as compared with the timeless nature of the mountain. The second, from a
    contemporary popular song, speaks of faith. In this excerpt, it is the mountain
    that disappears. What is timeless is not physical but part of some would call
    our true nature.


    When we see the many different faces of each other, we may recognize them as the
    faces of our selves. In this way the Net as a change amplifier and the Net as
    a portal into cyberspace and the Net as a knowledge medium can also be an agent
    that moves us further into the mystery of life and deeper into an understanding
    of who we are.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# About the Author


    Mark Steefik is a principal scientist at the Xerox Palo Alto Research Center.
    During the writing of this book he was manager of the Secure Document Systems
    area in the Computer Science Laboratory, and manager of the Human-Documents Interaction
    area in the Information Sciences and Technologies Laboratory. He became interested
    in how things work and understanding during his secondary education at Benson
    Polytechnic in Portland, Oregon. At Stanford University he earned a bachelor''s
    degree in mathematics and a doctorate in computer science.


    Steefik''s early research was in hierarchical planning and design in the areas
    of molecular genetics and VLSI design. He has carried out research in object-oriented
    programming languages, computer support for collaborative work, and trusted systems
    for digital property rights. A recurring theme of Steefik''s research and writing
    is using technology to enhance creativity, collaboration, and self-expression.
    He is the author of Introduction to Knowledge Systems (Morgan Kaufmann 1995) and
    Internet Dreams: Archetypes, Myths, and Metaphors (MIT Press 1996). He was elected
    fellow of the American Association for Artificial Intelligence in 1990 and of
    the American Association for the Advancement of Science in 1997. His electronic-mail
    address is stefik@parc.xerox.com.'
