- pgno: 10
  md: '# Introduction


    When I feel it coming on, I unplug the telephone, lock the door, turn off the
    radio and just give myself to the song until it''s finished.

    Kim Baker, 1998


    Creative times bring many changes. This book is written at such a time. People
    are preoccupied with the twentieth-first century and talking about how, in “Internet
    time,” what seems like years of change can happen in only a few months. We discuss,
    enthusiastically or anxiously, innovations such as new kinds of Internet-based
    businesses for on-line shopping and stock trading, winner-take-all markets, hot
    new technology companies, failing companies, journalism on the Net, information
    overload, using the Net for education and making it safe for kids, protecting
    users from Net hackers, privacy issues, and digital publishing.


    This book is some of the changes taking place in Internet time. It examines what
    is passing away with the old millennium and what is coming—and may be coming—in
    the next decade or so. To help us gain perspective, it looks at parallel events
    from long ago—such as the confusion that occurred when the Erie Canal was built
    in the early decades of the nineteenth century and the confusion that accompanied
    development of the phonograph in the early twentieth century. It also looks at
    the more recent efforts of those I call “early travelers to the Internet edge”—innovators
    who, in the 1980s, used various new communications technologies to connect us
    together electronically with e-mail, digital publications, online shopping, and
    digital news wires.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'xii


    Introduction


    # Chaos in a Microcosm: Digital Music


    . . . a sound arose of endless interchanging melodies woven in harmony that passed
    beyond hearing into the depths and the heights.

    J. R. R. Tolkien, The Silmarillion


    Sometimes a technological shift challenges social and legal systems in profound
    ways. The music industry, for example, is currently facing such a challenge. In
    the following I consider current events in the music industry as exemplary of
    the radical changes in our world that are now becoming visible at the Internet
    edge.


    The various cultural regions of the world create wonderfully different kinds of
    music that travel from place to place, influencing each other and producing new
    styles in distant lands. This is not a new phenomenon; for many years, new musical
    styles have evolved, spread across the world, and recombined with other styles
    to form newer styles.


    For most of the twentieth century music was distributed mainly through radio broadcasts
    and recorded media. In the late 1990s, that began to change when the music scene
    discovered the Internet. A garage band called Severe Tire Damage gave the first
    concert over the Net—just beating the Rolling Stones to the punch, and, as they
    put it, annoying people everywhere. Many small, undiscovered bands suddenly realized
    that they could distribute their music over the Net without the blessings or support
    of the big labels. These events hinted that something different was to happen
    in music distribution.


    Over the years, recording companies have maintained their worldwide control of
    music distribution. Although overseas manufacturers make pirate copies of CDs
    and there is some domestic copying of cassette tapes, the level of piracy has
    not threatened the financial foundations of the music publishing business. Since
    about 1993, however, the price of machines that can reproduce CDs has dropped
    steadily: from about forty thousand dollars to fifteen thousand, to four thousand;
    they now cost about two hundred dollars, making it affordable for many people
    to “write” or copy their own CDs.


    In the late 1990s a new digital compression format for music presented an even
    greater challenge to the music publishing industry. The new format, a form of
    digital compression for audio files known as MP3, Motion'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Introduction xiii


    Pictures Expert Group Audio Layer III, was developed for audio compression. The
    MP3 format makes it practical to store, play, and transmit musical recordings
    on computers. Whereas the format used for ordinary CDs requires about ten megabytes
    per minute of music, MP3 is ten times more efficient. Public interest in MP3 exploded
    in 1998. It enabled college and high school students with more time than money
    to distribute their favorite music inexpensively via e-mail and the Net. Today,
    even a casual search of the Net for MP3 turns up hundreds of sites offering music,
    players, encoders, and other services.


    # Portable MP3 and Secure Music Distribution


    Ilúvatar said to them: “Behold your Music!” And he showed to them a vision,ing
    to see where before was calling, and they saw a new world made visible before.


    J.R.R. Tolkien, The Silmarillion


    Some argued that MP3 was no threat to the big labels, because Joe Average does
    not want to listen to music on his computer anyway. In 1998, however, the MP3
    world buzzing about a new handheld music player by Diamond—The Rio—the MP3 equivalent
    of a Walkman. The Rio costs around two hundred dollars, can hold hours of music,
    and downloads from the Net through a computer. Release of comparable products,
    such as the Yepp from Samsung and the MPMan from Saehan, wereexpected in 1999.
    (See chapter 2, “The Portable Network,” for a discussion of the “Cambrian explosion”
    of innovation in other kinds of portable networked.


    When the Rio first hit the market, there was an immediate flurry of legal action.
    Music publishers and record companies sought an injunction to block sales of the
    Rio on the grounds that encouraged unauthorized copying of copyrighted music.
    A great deal of legal precedent related to copyright protection and the manufacture
    of copying devices, especially photocopiers, already exists. (The products of
    Xerox, the company I work for, were central to court decisions on this it relates
    to the Copyright Act of 1976. See chapter 4, “The Bit and the Pendulum,” for a
    broader discussion of the social and legal issues surrounding digital copyright.)
    Historically, a key issue in deciding the merits of such legal cases has been'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# xiv Introduction


    whether a copying device has other legitimate uses. This criterion was also central
    to decisions in cases challenging videocassette recorders when they were first
    introduced. One of defenses used by the makers was that it could not itself be
    used to make copies—a claim that came under scrutiny when two sets of young hackers
    reportedly succeeded in altering the programming of the device to do exactly that.


    Sensing a change in the winds, many technology companies entered the fray. IBM
    announced the Madison Project infrastructure, which would allow music distributors
    to sell music over the Net with a lower risk of copyright infringement. IBM possessed
    many of the components for such an system: high-end servers to store large quantities
    of digital content, a micropayment technology to allow end users to buy either
    a song at a time or an album, and a digital rights management infrastructure (CryptolopesLive™)
    to track payments. Were not IBM, AT&T initiated the a2b Music project for delivering
    songs over the Net. InterTrust, a privately held U.S. company, announced a partnership
    to combine its rights management and protection technologies with MP3 and advanced
    audio coding and compression technology from the Fraunhofer Institute for Integrated
    Circuits. By 1999, Sony Corporation was also ready to enter the market with two
    separate copy-protection systems—MagicGate and OpenMG—both of which scramble music
    files before they are sold and moved, rather than copied, and prevents unauthorized
    copying for streamers. Sony claims its technology allows digital music to be moved,
    ... (See chapter 3, "Digital Wallets and Copyright Boxes," for a discussion of
    the real security in such trusted systems.)


    By 1999 recording-industry groups were meeting to discuss standards for secure
    Net delivery of music. At a meeting organized by the Recording Industry Association
    of America, a hundred companies reportedly agreed to devise a plan to do so. Meanwhile,
    five major companies founded the Secure Digital Music Initiative to create a standardized
    way of distribution in North America, Japan, and Europe. Leonardo Chiariglione,
    an Italian researcher who helped create MP3, was named its head.


    Digital music distribution is controversial not only because it is currently being
    used for unauthorized distribution, but also because it has the potential to upset
    the balance of power in the music industry, enabling recording companies and artists
    to by-pass record stores and sell directly'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Introduction


    to consumers. Changes of this magnitude would shake up any industry. (See chapter
    7, “The Edge of Chaos,” for a discussion of industry dynamics in a time of change.)


    # Do Audiophiles Want Audio Files?


    And in every age there come forth things that are new and have no foretelling.

    J. R. R. Tolkien, The Silmarillion


    What does this all mean for people who are more likely to listen to or buy music
    than to create or distribute it? Will music distribution really work in an altogether
    new way? Will we need to log on our computers to buy or listen to music?


    Prediction is an uncertain game. Nonetheless, as I look in the following chapters
    the grand sweep of changes that are happening now in Internet time, and at shifts
    that resulted from earlier connection technologies, I sense some contours of the
    future. One of the enduring properties of successful technologies in the past,
    and a driving feature of inventions people are now inventing for the Net, is that
    they provide an increased sense of personal control. A reliable rule of thumb
    for judging the potential of a new technology is, therefore, “Convenience rules.”
    If the distribution of digital music follows this rule, we can safely make predictions
    about future music distribution.


    Given MP3, there are now two ways to get a personal copy of a musical recording:
    buy a CD (or cassette tape) or download from the Net. Although both of these methods
    will be around awhile, within ten years I believe they will be secondary to other
    methods. Consider the following scenarios.


    +   *I want that.” You are driving in your car listening to the radio. You hear
    great music and, without taking your hands off the steering wheel, you simply
    say “I want that.” As in some high-end cars equipped with hands-free cellular
    phones, your voice is enough to start a transaction. The digitally-enhanced receiver
    in the car identifies the music and registers your request for it. When you get
    home, you step up to your home entertainment center, which has by now communicated
    with the entertainment system in your car. It brings up all the names of music
    you have asked for recently and lets you listen to samples of them; it makes'
  merge: -1
  img_proc: true
