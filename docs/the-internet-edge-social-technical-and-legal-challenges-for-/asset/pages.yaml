  md: '# Chapter 10


    In the late-twentieth century some scientists began to sense limits to how completely
    they could know and understand the universe—starting with the uncertainty principle
    and moving to other ideas about both the cosmos and the infinitely small. Even
    if the universe is essentially a machine, it may have some counterintuitive properties
    and laws that place limits on what we can know about it. Some things may always
