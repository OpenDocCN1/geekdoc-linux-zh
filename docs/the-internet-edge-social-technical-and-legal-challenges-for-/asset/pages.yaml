    # Millions of Eyes


    PDRs, like other digital devices on the Net, will support two-way communication.
    In the 1990s, the price of video cameras for personal computers dropped drastically.
    It is reasonable to expect that such devices will also be incorporated into PDRs
    and similar handheld devices.'
