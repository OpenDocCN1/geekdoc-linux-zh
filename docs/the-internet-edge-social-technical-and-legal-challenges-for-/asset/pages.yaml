  md: '# The Digital Wallet and the Copyright Box 61


    age house, and the combination door on a bank vault. Arguably tents, houses, and
    banks may all contain things of great value. In a nearsighted theoretical sense,
    it might seem desirable to put a security door on a tent to protect campers from
    wild animals. However, a metal door such as is used on a bank vault would destroy
    the portability of a tent without improving its safety, since a persistent adversary
    could easily come through the canvas wall. The sobering truth about security is
    that there are many potential ways to defeat it, especially when it is not a primary
    design from the beginning.


    Trust is based on two things: responsibility and integrity. When digital works
    are stored and used on trusted systems, the systems are responsible for accurately
    ensuring that they are used in accordance with the rules expressed in the terms
    and conditions. When digital cash is stored in digital wallets and spent on goods
    and services, trusted systems are responsible for accurately following fiducial
    rules for handling cash.


    The integrity of trusted systems depends on three technological foundations: physical
    integrity, communications integrity, and behavioral integrity. Physical integrity
    refers to the capability of a trusted system to resist physical tampering. Communications
    integrity refers to its ability to detect any misinformation or lies it receives
    in its digital communications with other systems. Behavioral integrity refers
    to the persistent ability of trusted systems to enforce terms and conditions and
    to resist unauthorized modifications to their programming.


    # Physical Integrity


    The possibility that a pirate will penetrate the hardware and thereby gain access
    to information stored in a repository is one kind of threat. Sensitive information
    in trusted systems includes not only protected works but also billing logs, encryption
    keys, digital cash tokens, and personal and financial information.


    Different repositories can have different levels of physical integrity. A repository
    that can be compromised with a screwdriver would have a low level of physical
    integrity. A somewhat higher level of physical integrity would be a system with
    built-in sensors that enable it to detect a threat and to erase sensitive data.
    A still-higher level of physical integrity would cause'
