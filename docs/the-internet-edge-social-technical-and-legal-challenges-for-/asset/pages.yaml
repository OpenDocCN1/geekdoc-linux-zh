    Thus, the Internet isn''t turning out to be just something that connects to the
    computers in our offices. It is already developing a myriad of simultaneous, interconnected
    forms.


    # The Wonderfulness of Paper


    Paper . . . provides the highest resolution and truest color images on the cheapest,
    lowest weight display. It allows for annotation, easy disposal and recycling,
    and for dynamic modification of its form factor—that is, it can be folded and
    put in your shirt pocket at a moment''s notice.


    Stu Card, 1997


    In the digital age may seem quite retrograde to praise the virtues of paper. Although
    papyrus came into earlier, in around 3500 B.C., the invention of paper is generally
    dated at about 105 A.D. and attributed to Tsai Lun, a Chinese court official.
    Paper and papyrus were the medium of choice for preserving thoughts and ideas
    as records of agreements, commercial transactions, taxes, or family lineages.


    Paper is wonderful. It has high contrast. It can be written and drawn and printed
    with colorful inks and used to reproduce photographs. Paper makes written ideas
    both durable and portable. The wonderfulness of paper is a big part of the success
    story of Xerox, where I work. When photocopiers were first invented, nobody was
    sure exactly what they would be used for. According to Xerox lore, Chester Carlton,
    the inventor of Xerography, was unable to interest big companies in selling photocopiers,
    because no one believed there was a market for them. Prior to the photocopy, the
    most common means of copying a document'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 24 Chapter 2


    were carbon paper and mimeograph machines. By now those older technologies have
    been so thoroughly displaced that many children born in the United States since
    1980 do not know what they are.


    When photocopying became routine, people could show up at a meeting with notes
    or an agenda and copies for everyone. Attendees could take these copies away with
    them and make more copies for others—spreading ideas more widely and rapidly within
    and without organizations. Scholars at libraries could easily copy sections of
    books and other records, making scholarship more portable. Although these uses
    of paper and photocopy-ing are now easy and ubiquitous, in historical terms they
    are a very recent development.


    When multimedia systems appeared on personal computers in the early 1990s, some
    people said that paper was outmoded, because it is a passive medium. The use of
    paper for documents was expected to fade quickly. Multimedia is flashy. Like television,
    it catches our attention with interactivity, and sound. Kids raised on television
    are immediately drawn to it. Most children, argued the prophets, don’t read; they
    watch and interact. Paper documents were doomed and be superseded by multimedia-media
    documents.


    Yet paper is still used, because there was a pushback from the edge. The resistance
    was felt as skepticism by the not-yet-ready and frustration by the multimedia
    enthusiasts. The debate about multimedia versus paper—reminiscent of the discussions
    of prospects for a “paperless office” in the 1970s and 1980s or about the “future
    of the book” in the 1990s—are a prelude to understanding what is ahead. Although
    new forms of documents and communications have advantages, it is clear that paper
    and passive documents have staying power. In 1997, well over a trillion pages
    were generated by printers and copiers in the United States. Given the fact that
    computer screens have not replaced paper for reading, what is the nature of the
    struggle at this edge?


    We can start by asking, “What do computers (or the new documents they generate)
    have that paper lacks?” To begin with, multimedia documents are lively; and, because
    they are interactive, they can deliver different experiences and information to
    different people. Digital documents in general can be delivered quickly and electronically.
    A digital stock market report can be updated continuously, or at frequent intervals.'
