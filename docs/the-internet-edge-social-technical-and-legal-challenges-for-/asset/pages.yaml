    # Reconsidering the AI Dream


    What is AI anyway? In the light of its short history, how can we think concretely
    about what it is, what it could be, or what it should be?


    Most technologists are consumed with designing, building, and fixing things that
    need to work this year, if not next week. They cant spare much time for planning
    a more distant future. Nonetheless, those who are looking ahead believe AI will
    fundamentally change our way of life. Although predicting the future is a notoriously
    unreliable process—least as regards specifics—it is important to try to understand
    the trends and possibilities.


    In this chapter we consider how AI technology, coupled with the Internet, could
    change civilization dramatically. The first part, “Stories,” describes three examples
    of cultural change as it is studied by anthropologists and historians. The stories
    provide historical contexts for thinking about present and future cultural change.
    Next, to illuminate these stories and their lessons about technology, and to find
    appropriate analogies and metaphors for predicting the future, we consider several
