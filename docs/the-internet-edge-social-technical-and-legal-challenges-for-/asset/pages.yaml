    The Digital Wallet and the Copyright Box:

    The Coming Arms Race in Trusted Systems


    Tell me, people of Orphalese, what have you in these houses? And what is it you
    guard with fastened doors? . . But you, children of space, you restless in rest,
    you shall not be trapped nor named. Your house shall not be an anchor or a mast.
    . . .

    For which is boundless in you abide in the mansion of the sky.

    Kahlil Gibran, *The Prophet*


    The term *trusted* system came originally from military terminology. It refers
    to computer systems that provide access to secret information for national and
    military purposes. In the last few years, its meaning has been broadened to include
    systems that protect and govern the use of digital objects and information for
    commercial purposes.


    In chapter I I considered the development of personal document readers (PDRs),
    devices that many believe will become the delivery vehicle for digital published
    works in a multimedia blend. However, releasing valuable works to a digital medium
    creates a risk for publishers and authors, whose works could be copied and distributed
    without compensation.


    The technological response to this risk is to use trusted systems, which protect
    digital works using a set of rules describing fees, terms, and conditions of use.
    These rules, written in a machine-interpretable-digital language, are designed
    to ensure against unauthorised access and copying and to produce accurate accounting
    and reporting data for billing. Such trusted systems are the “copyright boxes”
    in the title of this chapter.


    Creative works are not, of course, the only digital objects that need secure storage,
    accounting, and machine-governed rules of use. The idea of digital cash, or tokens,
    that can be used as money in cyberspace has caught the public imagination. Handheld
    trusted systems that permit the exchange of such tokens are the “digital wallets”
    of the title. Like physical'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Chapter 3


    coins and bills, and unlike checks, digital cash can be exchanged anonymously,
    and like copyrighted works, according to specific rules. Just as unauthorized
    copying of a published work amounts to copyright infringement, unauthorized copying
    of digital tokens amounts to counterfeiting money. Other rules governing cash—for
    example, those forbidding the anonymous transfer of large sums of money into out
    of countries—could cause users of digital cash to run afoul import regulations
    and laws about money laundering.


    Mondex, one of the companies that offers technology for commerce in digital cash,
    uses trusted systems based on smartcards, plastic cards the size of credit cards
    built with built-in computer chips. These cards have been used in Europe for phonephones
    and other purposes for several years, through the late 1990s, had a limited presence
    in the U.S. market. Mondex''s digital wallet is used to read the amount of cash
    on a card and to transfer money between cards.


    In a conversation about digital cash, John Reed of Citicorp quoted to me, “How
    do you know when Mondex has a bug?” Playing the straight man, I asked:“How do
    you know when Mondex has a bug?” “When M1 rises,” he answered, naming the Federal
    index that measures the amount of cash in circulation. This gallows humor about
    smartcards and trusted systems. is not at all far-fetched. It illustrates an underlying
    fear about digital cash and trusted systems. We may not realize that a system
    is broken or compromised until after the damage has been done.


    In 1998 a phonecard-piracy scam came to light in Germany, where phonecards were
    designed by Siemens for Deutsche Telekom pay phones based on smartcards. Ordinarily,
    once a phonecard reaches zero it is thrown away or given to collectors. A group
    of “pirates” from the Netherlands found a way to bypass the security of the EEPROM
    chip used on the cards without leaving evidence of tampering and to recharge the
    cards. They bought thousands of spent cards from collectors, recharged them, and
    resold them to tobacco shops and retail outlets across Germany. The losses were
    assessed at about $34 million. This was not the first attack on the cards. The
    European digital wallet arms race is producing successive generations of cards
    that are supposed to be more resistant to tampering.'
