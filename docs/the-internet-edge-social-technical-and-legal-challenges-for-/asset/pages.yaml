  md: '# Focusing the Light: Making Sense in the Information Explosion


    The difficulty seems to be . . . publication has been extended far beyond our
    present ability to make use of the rigorous rate. The summation of human experience
    is being expanded at a prodigious rate, and the means we use for threading through
    the consequent maze to the momentarily important item is the same as was used
    in the days of square-rigged ships.

    nVannevar Bush, “As We May Think”


    Before the Internet, or even the widespread availability of digital computers,
    Vannevar Bush argued that society was creating information far faster than it
    could predictably use it. Bush’s 1945 observation—he was then director of the
    Federal Office of Scientific Research and Development, which directed the activities
    of six thousand American scientists—led to the now-familiar metaphor, the “information
    explosion.” Alvin Toffler popularized the phrase in his best-selling book, *Future
    Shock*, 1970.


    The word explosion bounds. People get hurt by explosions. Toffler used it to symbolize
    the difficulty he predicted we would have coping with rapid social and technological
    change and an overstimulating information environment. Information in the news,
    in our areas of work, and even in entertainment is created far more quickly than
    we can consume or make sense of it. For people drowning in information, Toffler
    believed, the explosion would be felt as a shock wave signaling arrival of the
    future.


    According to historical accounts, of course, the information explosion is nothing
    new. We recognize that the volume of information available to people in the developed
    world has been increasing for hundreds of years. That perception comes from the
    ever-growing trail of written history, the growth of the literate population,
    and our easy access to information'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'provided by technology—printing presses, telephones, radio and television,
    computer networks, and electronic information-storage devices. Individuals perceive
    the growth of information differently—depending on their personal and vocational
    situations and the responsibility they feel for keeping current.


    A simple way to limit the explosion would be to stop down the output of information
    is impractical and seems wrong-headed. Would we really want to cut back the scientific
    publication that accelerates the search for the discovery and cure of disease?
    Or curb publication of the daily news? In Western democracies, limiting conflicts
    with a fundamental freedom, freedom of the press. Not sensing a popular cause,
    do we recommend curtailing the creation of movies, television, and other forms
    of entertainment.


    The problem with the information explosion is not really that there is too much
    information. We already realize that we cannot know or read everything; we each
    of us, only to keep up with the documents relevant to our particular interests.
    In modern society people specialize and consume individual information diets.
    We want a certain portion of information about the world at large, a certain amount
    about national and local matters, and a good deal of specific information about
    our circle of friends, our interests, and our occupations. The real problem with
    information explosion is that it presents us with two dilemmas: being overwhelmed
    by useless information and having difficulty finding quickly the specific information
    we need.


    # Organizing the Information Soup


    When Vannevar Bush considered the problem of the information explosion, he proposed
    addressing it with what he called a “memex” device: “It consists of a desk...
    On the top are slanted translucent screens, on which material can be projected
    for convenient reading. There is a keyboard, and sets of buttons and levers...
    Books of all sorts, pictures, current periodicals, newspapers, are thus obtained”
    (1945:107).


    This early sketch of an information desk was extended by J.C.R. Lickider in 1961
    and later described as a networked computer station.'
