  img_proc: true
- pgno: 37
  md: '# Chapter 2


    What comes to mind when you think of someone using the Net? Many people first
    visualize a “net worker” as someone sitting in an office in front of a display
    terminal and typing on a keyboard. Such thinking about the Net is mainstream,
    but it is too narrow. The Net has a larger place in the world than the desktop.


    The real power of the phonocograph could not be realized until people got beyond
    the idea of using it only for office dictation. In the same way, the real power
    of the Net will not be realized until we think beyond office work. To understand
    what the Net can be we need to both expand and contract our range of vision. We
    need to think big, think small, think microscopic. Think built-in, think portable,
    think wearable. Think inside, think outside, ubiquitous. Think mornings, think
    evenings, think continuous. Think getting information from the Net, sending information
    to the Net. Think specialized, think universal.


    So could the Net become, the adjunct to office work?


    +   - The Big Screen: A screen for digital news and entertainment. Lounging on
    a comfortable sofa, you could watch and interact with the presentation from across
    the room.

    - Personal Document Reader: An interactive, lightweight, and portable digital
    device with two-way wireless communication. From an easy home or anywhere else,
    you could watch the digital news and read digital articles while holding the PDR
    in your lap.

    - The Web Reader: A screen on your wrist, like the videophone in old Dick Tracy
    comics. It’s not just a videophone. You could read and send e-mail, check your
    calendar, and download a client’s picture on the small screen.

    - The Web Tricorder: A palm-sized computer with a digital eye or a digitalcam
    with a net connection. It could record digital pictures and videos and post them
    to the Net in real time via wireless connection. It could also retrieve and display
    information and video from the Net.

    - The Insighter: A discrete handheld device that could scan a business card, search
    an information service on the Net, and summarize crucial information about a business
    contact on its screen.

    - The Hiker’s Companion: A pocket-sized information device combining positioning
    with on-line information service. The wanderer in mountain or forest could keep
    informed about trails and events back at camp and summon help in trailside emergencies.

    - The Net Phone: A compact cell phone handset that could also serve up the interactive
    web on a miniscreen.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The Portable Network 21


    +   * The NetMan: A sporty yellow headset with earphones and a stem microphone.
    You could use it to listen to music on an early morning run or interact by voice
    command with e-mail, your calendar, or Net information sources.


    +   * The StreetSmart: A combination Net-based information kiosk and videophone
    built into lamp posts downtown. You could use it to get directions at a street
    corner or to find out nearby stores and restaurants.


    +   * The Web Suit: Radio-linked wearable appliances that sense the environment,
    provide information through glasses and earphones, and interact with the user
    through forearm keyboards or voice commands. The suit would keep the wearer informed
    of events in his or her environment or on the Net and provide digital controls
    for browsing or controlling other devices. (See chapter 10.)


    By the late 1990s, all the functions in these examples were available in some
    form on the Internet. From our desktop we can see and record video, read news,
    check e-mail, consult calendars, get directions, telephone phones, and trade stocks.
    Each of these capabilities changes our view of the Net in a different way. For
    example, they alter our perceptions of the advantageous size and shape for the
    computer. Even though we can watch a movie at our desktop, we''d far rather lounge
    in a comfortable chair. Even if we can read or watch the news at our desktop,
    we generally use our desks for different purposes. We do not carry a big computer
    on the road. Nor, if we are walking, do we want to type. For mobility we need
    something the size of a telephone that we can interact with vocally while keeping
    our hands free.


    # The Digital Cambrian Period


    Bill Buxton (1997), an expert on user interfaces and sometimes musician, argues
    that general purpose computer systems and interfaces cannot deliver their intended
    functionality. When too many of programs are available on an interface it becomes
    too complex to use. In his view, the device itself should become the interface.
    Consider preparing to take a photograph with a camera that has a through-the-lens
    viewer. You turn the camera toward a scene and the scenes come into the viewfinder.
    You turn to the right, and the camera shows the view on the right. You pull the
    lens in and out (or turn it), and the scene comes closer or backs away. These
    motions are the affordances of the camera; they support the choices that a'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Chapter 2


    photographer makes in setting up a picture. Other elements, like adjustments to
    lighting and film speed, have more obscure controls. In a well-designed device
    like a camera the affordances reflect the requirements of the task. For Buxton,
    the enemy in interface and system design is not generality, but rather, generality
    at the expense of complexity.


    To restate the argument: We do many different things, such as taking pictures,
    reading mail, talking to others, and looking for information. Many of these things
    could be wonderfully augmented or amplified by a networked device. But each task
    has different requirements. Trying to put out all of the functions into one multipurpose
    device makes it too complicated. What we need is a family of specialized, networked
    devices that can work together, each device designed to perform one task effectively
    and easily. As the Net becomes ubiquitous, therefore, we should stop looking for
    the perfect Internet device. The Net can become part of the context for all devices.
    It is the infrastructure for communication, information, control, and, especially,
    connection. As the slogan for the 1997 World Wide Web Conference says, “Everyone
    • everything • connected.


    Early versions of many of the Net mentioned above are already being developed.
    Web-TV, laptop and pen-based computers, digital cameras, GSM telephones (global
    system for mobile communications), vertex information booths, and handheld communicating
    devices are all available. The current period of rapid invention and change is
    almost like the Cambrian Era, a period of expansive genetic diversity over 544
    million years ago, when almost all the major phyla of animals first appeared.
    Animals burst forth in a rush of evolutionary activity never since equal. Ocean
    creatures acquired the ability to grow hard shells and a broad range of new body
    plans.


    Similarly, in the late 1990s, new digital and networked devices appeared every
    week, challenging our understanding of both the possibilities and the categories.
    There are desk and cellular telephones with built-in computers that can dial-up
    your e-mail account, and there are computers with built-in telephones that can
    support digitized talk over the Net. There are digital cameras for desktop computers,
    longterm computers with built-in cameras, and cameras with built-in computers
    that become shareable video servers when plugged into the Net. You can make a
    video “telephone call” on a personal computer without using a telephone or make
    a call by'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# The Portable Network 23


    of television without using a personal computer. Communicating flat-panel computers
    in sizes corresponding to the business card, the pocket calculator, the clipboard,
    and the blackboard, and manufacturers are experimenting with sizes in between.
    The run-up to every holiday season and technology show, creative people around
    the Net search for products they hope will be popular. By the next show of last
    year''s offerings have been tossed aside and forgotten. There have been pushbacks
    from the Internet edge, usually some aspect of the new creations wasn''t quite
