    The main point of this example is to illustrate that there are different risks
    and interests surrounding fair use in the digital media. In DPT, fair use is treated
    as a licensed privilege to a driver''s license, rather than a legal defense. From
    a legal perspective, this is a substantial reframing of the fair-use concept that
    takes into account the greater risks of misappropriation in the digital arena.
    The example implicitly raises several interesting policies.


    +   * Does Joe pay for his own license? If fair use is seen as essentially equivalent
    to free expression (a right), fair-use licenses should be free, perhaps subsidized
    in some way by taxes or the publishing industry. If it is a privilege, like a
    driver''s license, the potential licensee should pay fair use modest price for
    it.

    * What rights does a fair-use license grant? In the example, the publisher decides
    what additional rights go with a fair-use license. In an alternative scenario,
    there is a standard set of rights, possibly defaulting to zero-free versions of
    all possible. Fair-use insurance covers the financial risks to the publisher if
    the work is turned loose on the Internet.'
