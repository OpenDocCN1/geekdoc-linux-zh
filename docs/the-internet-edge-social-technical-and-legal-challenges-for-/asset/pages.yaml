    The activity model of a collaborative team shown in figure 5.2 is not a perfect
    fit to all sensemaking situations. The work of any particular sensemaker depends
    on the social and institutional context. Some sensemakers work largely alone or
    in a loosely-connected network of colleagues. In a scientific setting sensemaking
    takes place when group of colleagues and students turn their attention to writing
    a joint paper. A person writing a paper alone is also a sensemaker but collaborates
    with others only indirectly: by using others'' published materials and in the
    peer review that takes place before publication. Some sensemaking tasks are so
    brief that they result in almost no written record. In other, more mature or seasoned
