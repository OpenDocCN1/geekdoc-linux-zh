  md: '# Economic Models


    Economic systems are similar in many ways to ecological systems. Businesses form
    economic subsystems, like species in an ecology, depend on each other. There are
    suppliers, distributors, and consumers. Subcontractors supply parts and services
    to multiple manufacturers. Corporations and goods are said to occupy economic
    niches. New products can drastically change the shape of a market by displacing
    older products from existing niches or by creating new niches.


    Economics brings several concepts not found in ecology, including price, supply,
    and demand. These concepts provide a quantitative basis for explaining action
    in the marketplace. A market is said to “seek its own level” according to the
    laws of supply and demand. When there are many suppliers in a market, some are
    more efficient than others and consumers benefit from lower prices. Such effects
    can ripple through an economy when, for example, the price of a part used in many
    different products is lowered. When there are many consumers, producers can often
    achieve economies of scale by switching to large-scale manufacturing processes
    and mass production.


    Thus, business enables more business. This can also be seen in the proliferation
    of businesses. The first businesses in a rural area are basic and relatively inefficient,
    but as a locality develops a rich mix of more efficient businesses, its economy
    becomes more stable and robust.


    Some economic systems require more sophisticated models than the essentially laissez-faire
    ideas just described. For example, when an economic system interacts with a legal
    or regulatory system, the model may need to explain more subtle phenomena. Nonetheless,
    the concepts described here delineate a reasonable first-order model for many
    situations and are enough for our purposes.


    # Social Processes in the Scientific Community


    Anyone with even a casual familiarity with science has heard of the scientific
    method. It is a formal means to create and validate new knowledge. Studies of
    the actual conduct of science, however, reveal a social dimension to the conduct
    of science that goes beyond the scientific method.'
