- pgno: 49
  md: 'LCDs are relatively narrow, and prices are trending downward, depending on
    resolution and size. Generally, in the past fifteen years displays have dropped
    in price by 10 and 20 percent a year. It is likely that over time higher-resolution
    displays will be incorporated into PDRs and laptop computers as prices drop.


    The power consumption of an LCD depends on its size, with a large portion of it
    used for backlighting. For example, a twelve- or thirteen-inch display is on the
    order of three to four watts. Depending on the brightness required, the backlight
    can raise the power load of the display by an additional ten to twelve watts.
    Efficient reflective LCDs that do not require backlighting are under development,
    although currently, in the late 1990s, the viewing angle on these devices is limited.
    For example, a five-inch color display from Sharp capable of showing 512 colors
    has a power requirement of 0.1 watts. Reflective LCD displays have other shortcomings
    in image quality: the whites are gray and the contrast between white and black
    is much lower than it is in most printed documents. These difficulties make the
    displays difficult to read except under controlled lighting.


    In summary, LCDs remain the leading contender in the search for PDR displays.
    At the time of writing, all types of displays have relatively poor resolution,
    compared with paper, and require substantial power. In the absence of a breakthrough—such
    as a reflective or bi-stable device—LCDs will probably continue to dominate the
    market.


    # Communication Technologies


    Wireless communication was not included in the first portable computing products.
    With the advent of cellular telephones and related technologies in the mid–1990s,
    however, wireless communication came to be seen as a necessary option for portable
    devices. Although PDRs without such capability would be useful for some applications,
    adding it greatly expands the possibilities. Two-way communication takes a PDR
    beyond the dream of a portable, paperlike interface and into the realm of a portable
    networked appliance.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Bandwidth


    What level of communication does a PDR require? A key parameter of communication—the
    rate at which data can be transmitted and received. Although some enthusiasts
    of PDRs insist that PDRs can use caching techniques and intermittent connections
    to minimize bandwidth requirements, others believe that consumers will use as
    much bandwidth as they get. This difference in view about bandwidth derives from
    different views of how PDRs will be used. Some applications, such as sending short
    e-mail messages, require only modest bandwidth. Others work well with only intermittent
    access to high bandwidth or use low bandwidth to trickle large digital objects
    into local storage for later viewing. One application with high bandwidth requirements
    is downloading video, that is, using a PDR to watch digital television.


    High digital bandwidth, measured in bits per second, is usually achieved by transmission
    over a broad band of frequencies, measured in hertz or cycles per second. This
    approach to achieving high-capacity digital transmission is referred to as broadband.
    It is also possible to use other techniques—such as sending data through multiple
    narrower frequency channels or switching a base-carrier frequency and on off.


    How much bandwidth is needed for satisfactory transmission of digital video? Because
    costs tend to rise with increasing bandwidth, many tradeoffs are possible. We
    can reduce bandwidth requirements by various promises in picture quality, as reducing
    the number of pixels in an image, decreasing the rate at which an image is refreshed,
    or limiting the color gamut of the image. There has been active work on reducing
    bandwidth requirements in digital transport of video is the version used in PicTel™
    systems for dial-up video conferencing. This approach uses Integrated Services
    Digital Network (ISDN) for a bandwidth of 128 kilobits per second (kbps). However,
    the visual artifacts and blurring that occur when anything in the visual field
    makes this low bandwidth unacceptable for entertainment. The upper bound for bandwidth
    requirements for digital video is 19 megabits per second (Mbps). This data rate
    comes from the Federal Communications Commission’s Advisory Committee on Advanced
    Television Service, whose recommended standards for high-definition digital'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Chapter 2


    television were adopted by the FCC in auctioning the frequency spectrum. This
    figure is considered an upper limit because high-definition television was originally
    designed for presentation on large screens, rather than on the small screens appropriate
    for portable devices. An upper bound of bandwidth for standard television is 1.5
    Mbps, the data rate provided by the Asymmetric Digital Subscriber Line (ADSL),
    fast digital telephone lines originally designed to deliver movies to the home.


    Another key parameter of wireless communication is range. Some portable devices
    are designed for relatively high bandwidth connectivity but only within a given
    work site. It is also possible to design devices that would use high bandwidth
    within a work site and lower bandwidth over a larger area.


    The standards and technology for providing portable communications are now evolving
    rapidly. In the United States, portions of the broadcast spectrum are being carved
    out and auctioned by the FCC for a variety of purposes. At the same time, technological
    development is fueled by new demand and, in some cases, an industrial shift as
    technology originally developed for military applications is being deployed for
    civilian and commercial purposes.


    # Mobile Bandwidth Today


    With the advent of cellular telephones, it became possible for determined road
    warriors with laptops to connect their portable computers to portable telephones
    to create fairly portable network appliances. In the late 1990s, this became easier
    and cheaper when wireless services like Metrocom''s Ricochet network provided
    small transceivers that can be attached to a laptop computer and a cellular radio
    network. In a way analogous to a radio network for voice communication with cellular
    telephones, the Ricochet network deploys a set of radio transceivers, or microcells,
    in clusters from a half mile to two miles apart. The transceivers are typically
    located on buildings, utility poles, and street lights. A Ricochet modem sends
    data packets to the nearest microcell, which then hands them off across the network
    to a wired access point with land connections to the Net. In 1997, the Ricochet
    network was available throughout the San Francisco Bay Area, the Seattle metropolitan
    area, Washington, D.C., many airports, and on many university campuses.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# The Portable Network 35


    Although the over-the-air data rate for a Ricochet modem is 100 kbps, actual performance
    is slowed by network traffic and the store-and-forward process of moving the digital
    packets through the microcells to the Net. The closer a computer is to a repeater
    radio or wired access point, the higher the bandwidth. Typical communication bandwidth
    is similar to that of a telephone modem, with speeds ranging from 14.4 to 28.8
    kbps. Performance depends on where a person is in the network, the applications
    used, and specific hardware.


    The Ricochet network is one example of the use of a relatively low bandwidth connection
    over a wide area. In the late 1990s, Fujitsu offered a PDR-like device providing
    higher-speed radio communication over limited areas. The device provides data
    rates up to 1.6 Mbps on fifteen independent channels in the 2.4-GHz band. Fujitsu''s
    system is based on a wireless land area network (LAN) system by Proxim, which
    connects devices to each other or to servers on a wireless network over distances
    up to one thousand feet. Because a work site often has sources of radio interference
    from equipment as well as reflections from physical objects, the wireless system
    uses a frequency-hopping, spread-spectrum approach to improve robustness and bandwidth.
    Wireless spread-spectrum systems for local area networks are also available from
    other companies, such as Lucent Technologies.


    We can summarize the wireless digital communication technology available for a
    PDR in 1997 as offering two choices: low-bandwidth radio communication suitable
    for e-mail over reasonably large areas, or higher-bandwidth communication within
    a work site or a very limited area.


    # Wireless but Not Mobile


