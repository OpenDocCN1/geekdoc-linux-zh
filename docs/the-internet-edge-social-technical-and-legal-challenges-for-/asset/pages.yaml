    What happens when the security arrangements for a trusted system fail, without
    the action or intent of the user, a copyrighted document is released? Is the platform
    vendor liable? Or the case of an individual who purchases a digital work through
    a trusted system built by vendor A. That system is later used to transfer the
    work to a trusted system built by vendor B. Subsequently, the work is transferred
    to a third trusted system built by vendor C. This system fails in some way and
    releases the work onto the Net. Are vendors A and B liable because their'
