  md: '# Focusing the Light 113


    for all documents containing the three words haystack, complexity, and search
    in any order. The system found and ranked about fifty documents containing at
    least one of these words. The top-ranked document was about managing complexity
    and included all the query terms, because it used the metaphor of finding a needle
    in a haystack. It then narrowed the query by substituting the verbatim phrase
    complexity barrier for the word complexity. This change reduced the number of
    hits from fifty thousand to twenty-nine. The top-ranked document was an issue
    of an in-house magazine published by Digital Equipment Corporation about a line
    of computers. Thus, with only small changes in the query, the number of documents
    retrieved from seventeen million to zero to fifty thousand to twenty-nine—fluctuating
    between feast and famine.


    As suggested by this example, there are various ways to broaden a query by including
    certain terms or by requiring that they appear together, within a certain distance
    of each other, and so on. Short of running the query, we cannot determine the
    effects of particular changes with any precision.


    This unpredictability and the extreme variation in the number of documents returned
    with small variations to the query indicate a phase shift in a search process;
    the two phases are the feast and famine in the number of documents returned. The
    term phase shift comes from physics and describes the sudden return of a small
    change, such as when a small decrease in temperature near the freezing point of
    water causes it to shift between liquid and solid phases. A point at which a transition
    occurs is called a critical point. A sharp transition from one phase to another
    at the critical point is called a threshold effect, and the region of rapid growth
    near a critical point is called the critical region. The shape of the graph in
    figure 5.1 is characteristic of a phase shift and is referred to as its signature.


    Two standard measures of performance for information-retrieval systems are precision
    and recall. Precision is a measure of whether the documents returned by the process
    are relevant, and recall is a measure of whether all relevant documents are found.
    A deep problem of information retrieval is that near the critical region using
    a simple word-matching approach to retrieving documents forces extreme trade-offs
    between precision and recall. A broad query overwhelms the searcher with a flood
    of documents. However, though narrowing the query reduces'
  merge: -1
  img_proc: true
- pgno: 131
