    # Resisting Change


    God created the universe in six days, and rested on the seventh—but He did not
    have an installed base to worry about.


    Old joke revived by Giuliana Lavendal


    Timing is everything. If you undertake these changes while your company is still
    healthy, while your ongoing business forms a protective bubble in which you can
    experiment with new ways of doing business, you can save much of your company''s
    strength, your people, your employees, and your strategic position.

    Andrew Grove, Only the Paranoid Survive


    After a technology rides the tornado, it becomes the dominant approach with a
    large installed base. The late majority continues to buy the technology and expand
