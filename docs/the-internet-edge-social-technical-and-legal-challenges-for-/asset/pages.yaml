    at Carnegie Mellon University, at which Newell was awarded an endowed chair in
    computer science. (He held until his death in 1992.) In his acceptance speech,
    Newell pointed to the close relationship between fairy tales and technology: “The
    aim of technology, when properly applied, is to build a land of Faerie. ...the
    computer... [is] the technology of enchantment” (Newell 1992: 46).


    Essential to the advanced technology Newell wanted to build two ingredients: a
    capability for intelligent action and physical miniaturization. In other words,
    the technology needs to know what to do. Technology does not seem very magical
    if it does nothing very useful or very well. Secondly, technology needs to be
    small enough to disappear. When we can see the spinning gears and shafts of the
    mechanism behind it, no machine appears magical. Aware of Moore’s Law predicting
    advances in computer technology, Newell was confident that computers would become
    smaller, faster, and more reliable.


    In speech Newell cited as an example of “enchanted” technology antilock brakes,
    which stop safely on wet pavement. The brakes are “smart” enough to sense slippery
    roads and enough to disappear into the car. At a more speculative level, he imagined
    talking streetlights would assist people standing under them, perhaps asking “May
    I help you?” Streetlights programmed with the map of the city could give directions
    or summon help for people who are lost or in trouble.


    Newell recognized the dark side of his fairy tale analogy, pointing to three folk
    tales from which technology writers often draw troubling conclusions.


    The Sorcerer’s Apprentice learns enough magic to start the broom of technology
    hauling water from the River Rhine to the cistern it cannot stop.

    For the Jinn in the bottle, the story is never permitted to go to the conclusion
    in the Arabian Nights, with the Jinn snookered back into the bottle; it is always
    stopped with the Jinni hanging in the air and the question along with it: Can
    we put the Jinni back, or will there be be ink all the sky ‘til the stars go out?


    In the many stories of the three magic wishes, promises of infinite riches are
    just for the asking, but the wishes are always spent, first on foolishness, second
    on disaster, and on bare recovery. (Newell 1992: 46)'
