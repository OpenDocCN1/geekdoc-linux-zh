- pgno: 191
  md: '# Chapter 7


    # 1982


    In 1982 the stories in “Technology Watch” focused increasingly on personal computers.
    The industry reported that there were 150,000 personal computers in education,
    200,000 in small businesses, and 300,000 for scientific use. Technology watchers
    predicted that there would be a computer in every home by 2001.


    Publishers of software for PCs were discovering that their programs were being
    copied and passed among consumers without payment. The problem was rampant: it
    was estimated that four out of five copies of software then in use were pirated.
    Milliken Publishing reported that one school purchased a copy of their educational
    software and reproduced copies to supply all the schools in its district.


    Publishers tried various approaches to prevent copying. They used diskettes with
    features allowing them to be copied only a very limited number of times (typically
    two); they offered software that could not be used without a plug-in microchip;
    they sold systems that were unusable without printed workbooks. Texas Instruments
    offered a cartridge for software distribution that prevented copying, but it was
    only usable on their own computers. Computer networking, glimpsed on the horizon,
    offered yet another threat to copying from people who could download software
    from the network instead of buying their own copies.


    “Technology Watch” continued its world survey of electronic publishing technologies.
    It was a confused picture. Spain was developing an interest in videototex, Japan
    was focusing on VCRs and videodiscs, and most Canadian developers preferred systems
    on personal computers. Australia had only one publisher bringing out electronic
    materials; it offered legal information on using an information utility.


    The Library of Congress began a project to preserve its holdings on optical discs,
    projecting that 95,000 pages could be stored on two sides of an optical disc.
    The public meeting called to discuss the project raised many questions about copyright
    requirements for books stored on discs.


    The Source announced the online publication of The Blind Pharaoh by Burke Campbell
    (1982). The author received royalties whenever someone read or printed the book
    from a terminal. The average cost to the reader was $2.80.'
