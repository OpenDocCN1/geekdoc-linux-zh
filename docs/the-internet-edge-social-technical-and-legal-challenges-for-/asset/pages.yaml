- pgno: 210
  md: '# The Edge of Chaos 193


    During the early stages of the technology adoption cycle when technology is emerging,
    its promoters struggle for change against strong resistance. In this early market
    stage the promoters are dreamers, innovators, and early adopters. Initially, resistance
    stems mainly from technological shortcomings and the challenges of integration.
    At the ch stage, if the challenge to go beyond the early adopters to a broader
    market is met, the bowling pin and tornado stages follow. At that point, the advantages
    of a technology for growing numbers of people create a force for change and resistance
    waves as older technologies are displaced. If successful, technology becomes the
    new dominant technology with a large installed base.


    This installed base is both an asset and a liability. It is a liability because
    its inertia favors backward compatibility but inhibits change. Nothing lasts forever.
    Depending on the circumstances, a technology''s advocates may be able to leverage
    their superior market position to change with the times. They may become locked
    into decreasingly workable approaches.


    When we understand the dynamics of the technology adoption cycle, predictions
    about the rise and fall of technologies seem inevitable. Evolution revolution.
    Once a technology is widely deployed, it is expensive to throw it away too soon.
    During this time, the cycle favors backward compatibility and evolution of the
    technology. Ultimately, though, the limits of its ability to evolve are reached
    and it is replaced. The next revolution happens when the next technology arises.


    # Global Challenges of Rapid Change


    The dynamics of rapid, incremental change are epitomized by progress in integrated
    circuit technology, which for over thirty years has been characterized by Moore''s
    Law. This rapid rate of change in computing devices has left consumers with two
    fundamental choices: what level of performance to pay for and how often to replace
    their equipment. In terms of level, they can choose to buy the hottest equipment
    at the leading edge of technology introduction, ride the middle wave, or go with
    the discounted tail. Prices of systems from one level to the next increase by
    a factor of two to three.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# Chapter 7


    Within each level, the price of a computer stays relatively constant but hardware
    performance improves.


    It is not uncommon for families to keep older computers around as long as they
    are still working. At the time of this writing, the oldest computer in my home
    is an 8-MHz Macintosh™ LC made around 1987. The years since then, with Moore''s
    Law compounding at 44 percent per year, have yielded state-of-the-art computers
    that make old computer seem unimaginabiny slow and outdated. Yet, although too
    slow for browsing the Net, it is still good enough for word processing and exchanging
    e-mail.


    This observation about the usability of old computers and Lederberg''s call for
    a Model T version of the computer raises questions about the value of the seemingly
    frantic pace of change in computer technology. On the other hand, we can view
    rapid technological change as the necessary engine of creation and innovation.
    By buying state-of-the-art systems, a small fraction of the world''s computer
    users are paying for the development of arguably more capable systems every year.


    The argument that the software running on these systems is delivering a corresponding
    increase in useful power is much more difficult to sustain. According to industry
    lore, hardware engineers lament that every advance in the power of hardware is
    eaten up by a corresponding “advance” in software. Cynical observers, however,
    have noted that bloated software and artificial incompatibilities between software
    releases actually help drive the market for new hardware by effectively making
    older systems obsolete.


    The cost differential between computers at the state of the art and computers
    that are years old creates choices that affect the accessibility of computing
    for most of the world, who cannot afford the latest systems. Corporations in wealthy
    nations can afford a more rapid pace of change than those in the poorer, developing
    countries.


    What are the implications of this inequality for the Net? Will the Net become
    more fragmented, increasingly separating the information ha from the information-have-nots?
    Alternatively, will concerns about backward compatibility for a growing installed
    base of old systems across the world create inertia that stifles innovation? We
    consider these questions and the issues surrounding them further in chapter 9.'
