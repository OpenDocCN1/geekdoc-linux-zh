    share would be lost giving a work to someone who couldn''t afford to buy it anyway.
    Furthermore, for formerly poor person rises above poverty, receiving these subsidies
    may pay off in brand loyalty to the giver. The logic behind commercial subsidies
    may make them poor substitutes for public subsidies for the brave, new Net.


    In short, as the Net evolves to become essential to everyday life, differing levels
    of service may always distinguish the wealthy from the poor. The likelihood that
    getting the news, banking, and communicating will all be based on portable Net
    devices means that the issue won''t be whether terminals are located at city hall
    or in the library. The deeper question will remain: How do the haves and the taxpayers
