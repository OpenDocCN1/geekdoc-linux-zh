- pgno: 46
  md: '# Flat-Panel Displays


    The flat-panel display is the “face” of the PDR. It creates the visual appearance
    of the book, video, photograph, or whatever else is shown. The requirements for
    a satisfactory display depend on the specific application. In general, the visual
    requirements for matching the quality of images on paper are the strongest—far
    more demanding than those for ordinary broadcast television. What would an ideal
    PDR display be like?


    It would have high image resolution, which is an especially crucial factor in
    designing a display for text reading. In the late 1990s, high-quality laser printers
    could print twelve-hundred dots per inch or more. In most cases, the dots are
    accurately positioned but irregularly shaped blobs. Experiments with displays
    suggest that a resolution of three hundred pixels per inch, with the pixels accurately
    shaped as squares, would satisfy the visual acuity of the eye and as sharp as
    laser printer. Typical desktop CRT displays and most flat-panel displays, which
    have resolutions of about seventy-two pixels per inch, fall short of this.


    Many displays currently in use have substantial power requirements, either for
    holding and refreshing the data being displayed or for display technologies capable
    of holding data without the need to refresh them are called bi-stable; those illuminated
    by ambient light are termed reflective displays.


    Improvements in all these factors are part of the mix for developing displays
    for use in PDRs. There are presently several competing technologies for building
    flat-panel displays.


    +   - Liquid crystal displays (LCDs), the most widely technology for portable
    computing, are not ideal yet, and there are several competing technologies with
    strong potential.


    +   - Like crystal displays, plasma display panels (PDPs) have been developed
    for several years. They operate on the same basic principle as a fluorescent lamp
    or neon tube. A PDP consists of an array of hair-thin fluorescent tubes in a substrate.
    They may many square feet in area, very bright, and produce excellent color. PDPs
    with several million pixels measuring over forty inches on the diagonal were developed
    in the mid–1990s and are now available from several manufacturers (including Fujitsu,
    Panasonic, and Mitsubishi). PDPs are expected to become widely available about
    the year 2000 for wall-hanging television viewing.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Chapter 2


    Although the price for early models in the late 1990s was very high (on the order
    of $8,000), it is expected to drop drastically as the consumer market develops.
    Because of limitations in resolution and high power requirements, PDPs are not
    expected to be useful for portable devices. They are expected to replace CRTs
    in applications requiring displays ranging in size from twenty to a hundred inches.


    +   - Field-emission displays (FEDs) are a newer display technology with promise
    but several technical hurdles to overcome. Like CRTs, FEDs have a screen with
    a phosphor coating. Unlike CRTs, they work by focusing arrays of microscopic cathode-tip
    emitters at each screen pixel. The electrons light up the phosphor coatings to
    form an image. FEDs are expected to be low cost, lightweight, and rugged and to
    have low power requirements. Research and development of FEDS is taking place
    primarily in Europe and the United States. They are being developed in small sizes
    at several companies, including PixTech, Futaba, and Motorola. Their power requirements
    are about half that ofably sized LCDs: a ten-inch display consumes approximately
    two watts. Furthermore, FEDs do not require backlighting. Remaining technical
    hurdles include reflection of ambient light and a gas build-up known as display
    flashover, which can sometimes damage a pixel by creating an electrical discharge.
    FEDs nonetheless are a potential threat to LCDs for portable applications and
    have the potential to upset the LCD industry.


    +   - Organic electroluminescent displays (ELDs) also have the potential to surpass
    LCDs in performance. The light-emission efficiency of organic EL displays is about
    the same as that of LCDs, but the LCD requires constant backlighting, organic
    ELDs generate their own light. Power consumption is also lower than for LCDs,
    because only the necessary pixels are lit. Historically, the main obstacle to
    practical EL displays has been their limited life, especially for materials that
    emit red. The red emission layer is difficult to maintain because the longer the
    wavelength the higher the drive voltage and the shorter the service life. Except
    for the red layer, materials that last five thousand hours or more have been developed,
    and Pioneer Electronic became volume production of small-sized organic in the
    late 1990s.


    A number of other display technologies—including several kinds of electrophoretic
    displays, micromechanical displays, electrochromic displays, and field-effect
    displays—are in various stages of research and development. All of them have significant
    problems that must be overcome before they can be applied to PDRs. Breakthroughs
    in any of these technologies could create major changes in the display business.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# The Portable Network


    At present, however, LCDs are the preferred technology for portable computers.
    LCDs continue to improve, and they have the advantages of market share, mass production,
    and revenue from ongoing sales. Overcoming these advantages will be a formidable
    task for any competing technology. What, then, is the state of the art for LCDs
    themselves?


    Although LCDs’ image resolution falls somewhat short of paper’s, it is better
    than that of any other available technology. A flat-panel display capable of rendering
    an edge-to-edge image of an 8.5” × 11” piece of paper at 300 pixels per inch would
    require about 8.5 million pixels. Table 2.1 compares this resolution with some
    of the flat-panel displays commercially available in 1997. The closest in overall
    pixel count is a black-and-white display by dPiX, which has 7 million pixels.
    The best flat-panel color displays have 5 million pixels.


    Production economics for flat-panel displays are a major factor in the affordability
    and pricing of PDRs. The cost of manufacturing LCDs depends in large measuring
    the yield of the manufacturing process, which the entire large area of the semiconductor
    or amorphous silicon must emerge from all the steps without a single defect such
    as could be caused by a dust particle anywhere on the plate. Of the displays listed
    in the table, the three highest-resolution displays are in limited production
    for military and special purpose applications. In 1997 the NEC four-inch display
    was available for $1800 in quantities of a thousand month. Smaller ten-inch displays
    with lower resolutions (such as VGA or SVGA) are generally available at about
    a third that cost. Profit margins on


