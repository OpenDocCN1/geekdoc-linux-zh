- pgno: 146
  md: '# Focusing the Light 129


    +   * False positive. This category means that the retrieval process has incorrectly
    collected the snippet. Saved as an example, the snippet can help guide or test
    the semantic matching by modifying the synonyms or other relations or fine-tuning
    the schematic search parameters.


    +   * Misfiled. This category means that the snippet is interesting but belongs
    elsewhere in the sense document. Its appearance in the wrong location suggests
    the sensemaker needs to tune the semantic-matching parameters of some other section
    of the report and use this snippet to guide the matching for it.


    +   * Residue. The snippet challenges the basic categories of the developing sense
    and does not fit anywhere. The sensemaker needs to rethink the sense categories
    and place this snippet where it belongs.


    At the time of this writing, creating a sensemaking system like that described
    above is a-yet-unmet research challenge. Although the elements of such a system
    have been used in various information systems, they have not been tried all together
    in a system for sensemaking. Indeed, the overall approach seems plausible, its
    effectiveness for sensemaking has not been demonstrated.


    What can be said that this proposal stands on fifty years of technology developed
    since Vannevar Bush first proposed the memex and addresses issues not visible.
    It speaks in particular to how we might develop the knowledge needed to make the
    search for information more effective in the critical region. It also structures
    the overall task of sensemaking as an art integration of reading, retrieving,
    organizing, and writing in a way that supports information retrieval from large
    document repositories without the need for formulated queries.


    # Reflections


    The notion of bounded rationality causes one to reformulate what an information
    retrieval system should be in terms of benefit per unit cost instead of precision
    and recall.


    Stuart Card, 1997


    The greatly increased amount of information now available on the Net—it has recently
    passed the haystack complexity barrier—has made the information explosion tangible
    for many people. Although thinkers like Vannevar Bush and J.C.R. Licklier anticipated
    the problem of the information'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 130 Chapter 5


    explosion several decades ago, their solutions for dealing with it were never
    tested—because the large on-line databases needed to do so did not exist in their
    time. Meanwhile, our experience with such systems has revealed deeper issues in
    using large collections of information that they were never anticipated.


    Now, although people expect ready information from the Net, what they usually
    experience is information feast or famine. Often they cannot determine whether
    the information they need is on the Net. They face a threshold effect, either
    finding nothing or being deluded with matching but useless documents.


    Suppose for a moment that we possessed sensemaking systems like those described
    in this chapter. Would they effectively solve the problem of the information explosion
    and the threshold effect? In attempting to answer that question, we are in a position
    unlike that of Bash and Lickider, because we do not yet have the sensemaking systems
    to try out. We can, however, learn from a thought experiment.


    At the core of the sensemaking proposal is the idea that query-free retrievals
    can be generated from the sense document a sensemaker creates. Although this approach
    offers the possibility of great cognitive leverage—manipulating terabytes—it also
    contains the seeds of a possibly dangerous flaw. The system as essentially works
    by first determining and then amplifying the sense the sensemaker begins with.


    A familiar phenomenon occurs when a group of writers passes around a draft of
    an article they are writing together. We call it the first-draft effect, because
    the first draft of the document has such a great influence over the final form
    of the document. If the first draft is fundamentally wrong in some way or blind
    to some issue, then later drafts are likely to be defective the same way.


    The same danger exists in sensemaking. If the first draft or sense is wrong or
    lacking in some essential, the system and further writing will tend to amplify
    the error. As sense is flushed out, it can become more and more difficult to think
    outside of the box. Of course, this problem is not limited to machine-assisted
    sensemaking. Reflective analysts have seen such bias effects in individual and
    collaborative sensemaking in which there is no machine amplification.'
