- pgno: 229
  md: '# Surveillance and Privacy


    Why is it acceptable for passersby to stare through the window of a restaurant
    at the people dining there, but not through the window of a house to see what
    the occupants are up to? Why do people try on clothes in a fitting room, but not
    in other parts of a store? ... In public and private places there are different
    or less implicit rules about acceptable behaviors and interpersonal access rights.
    . . . People learn these rules in the course of normal socialization.


    Victoria Bellotti, “Design for Privacy in Multimedia Computing and Communications
    Environments”


    Security in 1984 isn''t that much different from security now. Just about every
    store, business, parking lot, and airport has security cameras watching you. .
