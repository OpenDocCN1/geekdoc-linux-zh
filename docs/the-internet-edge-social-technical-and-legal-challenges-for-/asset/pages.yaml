    Recognizing that users overwhelmed by the vast of feast-or-famine problem, some
    network search-tool providers hide the problem by not showing them large number
    of hits actually resulting from their search.


    This precision/recall dilemma is a classic example of the difficulties of coping
    with complexity. Knowledge-based systems are computer systems that solve complex
    problems by using representations of knowledge to guide their search for solutions.
    In the design of knowledge-based systems, knowledge is the key to coping with
    complexity. What we need to effectively mine the critical region of figure 5.1
    is a way to identify the relevant documents exactly. Such knowledge for identifying
    documents would enable a search service to pluck out the needed documents without
