    deep emotion as we absorb—when we look at it, read it, hear it, or feel it. We
    feel this emotion when knowledge has been transferred with power. We have little
    doubt that this feeling, which is so wonderful that we wish to experience it over
    and again, is genetically based, for it is tightly intertwined with our existence
    as a highly communicative species.

