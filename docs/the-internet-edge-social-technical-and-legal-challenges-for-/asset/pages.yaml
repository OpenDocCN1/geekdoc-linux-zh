    work. After offering the work on the Net, its publisher has assigned various rights
    to it, declared an insurance limit, and decided on the security level of trusted
    systems required to receive the work. Joan later transfers the work to a friend''s
    system built by vendor B, and, as in the above scenario, the work is transferred
    again, to a system built by vendor C, which fails in some way (or, perhaps, is
    tampered with by an intruder); as a result the work is turned loose on the network.
    All the trusted system vendors, who are part of an industry coalition designed
    to deal with such problems, then take measures to isolate and limit the damage,
    and the publisher''s document insurance evaluates and pays for the losses.


    The example raises several difficult policy issues. Who is liable if a trusted
    system improperly releases a document because of a design failure? Who is liable
    if the security of a trusted system has been undermined by tampering or by a computer
    virus? Who is liable if a computer with outdated security measures participates
    in a transaction? Is it reasonable for publishers to take the entire risk, even
    with informed consent the nature and limitations of the trusted systems? What
    prudent and appropriate actions might vendors take when a model of their system
    is apparently compromised? Should there be mandatory periodic testing and upgrading
    of trusted systems security? Should insurance rates be higher for works on trusted
    systems of low security than for those on high-security systems?'
