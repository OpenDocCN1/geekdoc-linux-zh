    # Beespers Go Berserk!


    Fan-out, one of the powerful properties of electronic communication technologies,
    also creates opportunities for widespread disaster. When they go wrong they can
    go very quickly over a large area. On January 10, 1997, a Wall Street Journal
    (WSJ) front page story described the effects of an apparent technical malfunction
    of the SkyTel paging network. The resulting bout of “beeper madness,” a deluge
    of call-back messages went out to more than a hundred thousand customers.


    What went wrong? It started when a SkyTel customer was trying to activate service
    with her new seven-digit identification number. Somehow, the SkyTel employee assigned
    her a number that was linked to a SkyTel secret code used by the company to beam
    out news simultaneously to a hundred thousand of its 1.2 million customers. The
    SkyTel computed the number assignment, but staff members successfully overcame
    the computer’s “recalcitrance” and assigned the number anyway. When the customer
    tested it, the wireless chain reaction began: a wave of messages went out to a
    hundred thousand customers.


    SkyTel displays a seven-digit number, which can be read as either a local phone
    number or a SkyTel identification number. Hundreds of customers all over the country
    interpreted the number appearing on their beeper as a local phone number, resulting
    in thousands of calls to puzzled folks in different area codes. But the big chain
    reaction was yet to come.


    When about three dozen SkyTel customers—the article called them the “diligent
    three dozen”—decided that the seven-digit number they had received was not a local
    phone number but a SkyTel identification'
