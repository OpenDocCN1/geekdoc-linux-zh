    # Digital Control of Manufacturing


    Neal Stephenson’s The Diamond Age describes an imagined future in which machines
    called matter compilers follow detailed instructions to assemble complicated objects
    according to a programmed design of atoms. The instructions could be sent over
    a network, so that, in effect, an object design created at one place can be transmitted
    to a distant matter compiler, which then assembles the object.


    The people in Merkle Hall were all working on mass-market computer products...
    They worked in symbiosis with big software that handled repetitive aspects of
    the job... An automated design system could always make something work by throwing
    more atoms at it (Stephenson 1995)


    Stereolithography is an analogous reality that arranges plastic materials in arbitrary
    patterns to form an object. It produces three-dimensional parts from a computer
    description of a solid model without tooling, cutting, numerical control, or molding.
    It works with liquid plastics that harden when they are exposed to ultraviolet
    light. There are several variations on this technology. One approach lays down
    a plastic gel one layer at a time and hardens it by exposing it to light from
    a laser. Another version uses a computer-controlled laser beam to draw cross sections
    of the object on the surface of a vat of liquid plastic. The plastic hardens'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 276 Chapter 10


    where it is touched by the laser, forming a thin cross-sectional layer of the
    part. The cross-section is lowered by an elevator and the next layer is drawn
    by the laser, then adhered to the first section. This process is repeated until
    a complete solid plastic model is formed. Other related approaches to making solid
    models under computer control include selective laser sintering, fused deposition
    modeling, shell-production casting, topographic shell fabrication, and controlled
    milling. Laser sintering is a process of creating a solid mass, typically from
    a powdered material—plastics, ceramics, or metals—by selectively heating but not
    melting it.


    The technologies for creating three-dimensional objects are evolving rapidly.
    Different manufacturing methods use materials varying in strength, flexibility,
    transparency and work at different scales. Some methods can produce more accurate
    and predictable shapes than others, and some require later tooling to remove the
    scaffolding at intermediate stages to provide temporary support.


    Automated manufacturing technology goes back to the 1960s, when numerically controlled
    (NC) machines emerged as part of manufacturers'' efforts to reduce costs in fabrication
    processes. As computers were very expensive at the time, the early machines typically
    received their instructions from computer-controlled tapes. The machines had only
    a few sensors, no conditional control programs, and were relatively difficult
    to program. Since then the industry has shifted to computer numerical control
    (CNC) and shop networks for interlinking machines. Computer-controlled manufacturing
    systems are now used widely by many producers, large and small. In the 1990s stereolithography
    for remote manufacturing attracted a lot of attention, but it is by no means the
    only technological option.


