- pgno: 141
  md: '# 124 Chapter 5


    doesn''t take a great many of them. It didn''t strike me as an impossible task
    to do this semantic conversion into a crude intermediate language. Perhaps that''s
    a way my problem might be solved. (1997)


    Consider how this might work in a less-technical example of a person studying
    the telecommunications industry. In this case, the sensemaker is looking for articles
    about non-U.S. companies buying a telecommunications company. Like Lederberg,
    the sentencemaker wants to find documents or snippets in which a certain relationship
    holds among the words. Thus, the phrase “Foreigners buy telecommunications company”
    should match the following snippets:


    +   MCI to merge with British Telecom.


    +   NTT considers buyout of Motorola.


    +   Siemens increases holdings in Deutsche Telecom.


    In these examples, typographical differences indicate the part of the snippets
    that correspond to the desired relationship among terms. Thus, the foreigners
    (boldface) in these snippets are British Telecom, NTT, and Siemens. The act of
    buying (italics) is expressed by the terms merge, considers buyout, and increasing
    holdings. The telecommunications companies (underscore) are MCI, Motorola, and
    Deutsche Telecom.


    The kind of semantic match in these examples is called a schematic search, where
    the initial phrase “foreigners buy communications company” is used to create a
    schema that characterizes the required relationship. A schema indicates what kind
    of terms or phrases be used in the relationship. Filling out a schema requires
    knowledge about the meanings of terms. Thus, to match the examples with non-U.S.
    companies requires knowing that British Telecom, NTT, and Siemens are the names
    of companies incorporated outside the United States. Matching the telecommunications
    company to the examples requires knowing that MCI, Motorola, and Deutsche Telecom
    are telecommunications companies. In the relationship in this example is about
    buying a company. To match the examples requires knowing that merging, buying
    out, and increasing holdings are all ways of changing the ownership or control
    of a company.


    It is possible to create computer systems that work in the way these examples
    suggest. Much of the research directed toward this development is taking place
    as part of the Message-Understanding Conference (MUC) sponsored by the Advanced
    Research Projects Agency (ARPA);'
