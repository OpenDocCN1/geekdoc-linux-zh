- pgno: 214
  md: '# 8nThe Digital Keyhole: Privacy Rights and Trusted Systems


    For now, consider everything you do on the Internet completely public. Your illusion
    surfing the net from your own bedroom late at night with the door closed is just
    an illusion. The FBI might not be there tomorrow, but your risk of exposure lasts
    for years and years.

    Dick Mills, 1996


    It is not easy to observe closely, to take the time and to make the subtle moves
    that allow the soul to reveal itself further.

    Thomas Moore, Care of the Soul


    Privacy itself is nothing new. The dream of finding quiet and private spaces for
    some of life’s activities proactively goes back beyond the historical record.
    In England the legal precedent that “a man’s home is his castle” dates from at
    least 1604; in Semayne’s Case the judge ruled against the officers of James I
    who barred into a house without announcing themselves.


    In the 1970s, people in many countries around the world recognized that computer
    technology was shifting the balance regarding privacy. It was becoming clear that
    computers and networks are efficient instruments for gathering and correlating
    information. They had become progressively more common since the 1960s and were
    being used by governments, private enterprise, and individuals to keep track of
    people. The pervasiveness of computers and networking have challenged our societies
    to come to terms with a question seems both important and elusive: With technology
    evolving faster than our collective understanding of its effects, what aspects
    of privacy are threatened and is it possible to protect them?


    In many ways the privacy issue is analogous to the copyright question discussed
    in chapter 3. Just as copyright law is concerned with the use of published works,
    privacy law is concerned with the use of private and'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'personal data. In both cases, technological developments are overturning established
    protections, expectations, and practices. Programmed in con- ventional ways, computers
    can radically undermine copyright and privacy by allowing the unauthorized use
    of copyrighted works and private data.


    In both cases, the ubiquity of computers and the need for checks and bal- ances
    in an evolving situation have made crafting an appropriate response— legal or
    technological—difficult and often puzzling. Making laws is one thing, but having
    effects to enforce them in the digital world is quite another. There are many
    gray areas, and people sometimes find it onerous to comply with the law. Moreover,
    copyright and privacy laws are themselves evolving; copyright holders, equipment
    manu- facturers, service providers, policymakers, and others are discussing new
    rules, policies, guidelines, and standards. There are competing social values
    at play, and competing interests that will determine just such laws will say.
    At the same time, opportunities for using technology to enhance both privacy and
    copyright by designing computers as trusted systems are emerg- ing. To achieve
    privacy at the Internet edge we will need to combine tech- nical sophistication
    with wisdom.


    # What Is Privacy?


    Information privacy is not an unlimited or absolute right. Individuals cannot
    sup- press public records, nor control information about themselves, by law, is
    used for a permissible purpose (e.g., criminal defendants cannot prevent courts
    from examining their prior record before imposing sentence, and sellers of reality
    cannot prevent a title search of their property). . . . As a practical matter,
    individuals cannot participate fully in society without revealing vast amounts
    of personal data. National Information Infrastructure Task Force, Options for
    Promoting Privacy


    A little pistola isn''t all that crazy. If you have holders of sensitive material,
    don''t saddle yourself with a lightweight cut-up. Value America has GBC models
    that will shred up to 19 pages at a time, at a blazing 45 feet per minute . .
    . even enough capacity for the White House.


    Advertisement for paper shredders, Wall Street Journal


    What is privacy? Who needs it? These questions are not just rhetorical, for privacy
    legislation and debate have recently had to consider several differ- ent notions
    of privacy. The questions are germane to the Internet edge because computers and
    networks are changing the balance and can either'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# The Digital Keyhole 199


    diminish or enhance privacy. One way to get some perspective on what personal
    privacy means is to look at several examples of it.


    Many people value time spent alone no watching, no one to please, no one to interrupt
    our thoughts, and no one to respond, we can relax. Without distractions we can
    notice life’s rhythms. Such time is what some teachers and mystics call soul time.
    Time spent builds equanimity and energy. Although it is possible to have soul
    time without privacy—the phone is ringing, people are knocking at the door, and
    strangers are watching us in places—it is more difficult. Private time can also
    include time spent secluded with friends and family. With close friends, we feel
    differently, act differently, and are less on guard than we are in public.


    Privacy issues also include protection for records—private communications, written
    on paper, saved over a telephone line, sent by e-mail, or recorded on an answering
    machine. Convention, and to some extent the law, assure that when we write a letter
    to a loved one, it will not be opened by a third party. A paper envelope provides
    a barrier to clandestine readers so that skill and effort are required to steam
    it open and then reseal it. However, the real security of a paper envelope derives
    not from its flimsy physical barrier but from the rules of a society that values
    privacy. Similarly, our personal records—whether sentimental, medical, or financial—may
    contain sensitive information that we do not want to be available for public viewing
    and comment.


    We value our privacy, among other reasons, because we believe strangers who know
    too much about us could exert improper control over our lives. They could take
    information out of context and use it against us. Thieves who know our vacation
    plans could time their visits to our homes; gossips who know some of our personal
    business may tarn our reputations; advertisers who know our interests deluge us
    with unwanted sales promotions. In short, personal privacy is about freedom from
    surveillance, freedom from intrusion, and security for our personal records. All
    these themes of privacy concern preventing other people from monitoring our activities
    in detail.


    # Privacy Cues and Cyberspace


    Computers and networks are shifting the grounds of privacy. In the real world,
    physical cues such as closed doors, locked cabinets, and sealed'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Chapter 8


    envelopes remind us to respect privacy. They mark the boundaries between public
    and private spaces. In cyberspace, the physical cues are lost, and extinctions
    between public and private space are blurred.


    The conventions and expectations of privacy we have in the real world do not carry
    over to cyberspace, we feel sure that a letter in the mail will be opened only
    by the recipient. We may expect that to be true in cyberspace too, but it isn''t
    necessarily. Federal law does not apply to e-mail, and unencrypted e-mail can
    often be read by third parties. Indeed, some corporations have asserted a legal
    right to read their employees'' electronic mail.


    When we look at people in the real world, they can generally see us too; vision
    and line-of-sight work both ways. By contrast, the technology by which cameras
    are networked in cyberspace can let other people watch without our knowledge—a
    phenomenon many people find very disturbing.


    # Computers and Data Protection


    It could come as no surprise that advances in computers have led to issues about
    privacy. Computers are designed to process information efficiently, and networks
    are designed to transport it efficiently. They are ideal media for gathering information
    from many places, correlating data and stories from different sources, and assembling
    the related pieces into a dossier on a person or company.


    # Legislating Data Protection


    But where does one “personal information system” end and another begin in the
    decentralized and networked “information highway” environment? Colin J. Bennett,
    "Convergence Revisited"


    Recognizing that computers and computer networks are changing the balance regarding
    privacy, many countries have developed new laws. The literature on privacy legislation
    and the different approaches adopted by national governments is broad. We can,
    at best, only survey the issues it raises by focusing on data protection. Readers
    interested in more information will find several sources in the Further Readings
    section at the end of this book.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# The Digital Keyhole 201


    In the United States, there are three main sources of privacy law: constitutional
    protections, common law or case law (precedent), and statutory law. Although all
    three contribute to the legal basis of privacy, most of the action related to
    electronic information has been stored in statutory law. Most other countries
    have also chosen to enact new laws, especially in the area of data protection;
    worldwide the rapid development of computer technology has raised a series of
    challenges that have reshaped the legal contexts and prompted still-evolving legislative
    responses.


    For the most part, the Constitution and subsequent Supreme Court decisions govern
    the powers and limitations of government, while the activities of private citizens
    and organizations are regulated by statutory law. Although the word *privacy*
    does not appear in the U.S. Constitution, several of its provisions bear on it.
    The Fifth Amendment, for example, states that no defendant in a criminal case
    shall be compelled to be a witness himself or herself. Under this amendment, a
    person who wants to keep hidden information that is stored “in the mind” cannot
    be compelled to produce it. This provision does not, however, compel personal
    information in written form, like letters or a diaries. Instead, such personal
    effects are protected by the Fourth Amendment, which states “the right of the
    people to be secure in their persons, houses, papers, and effects, against unreasonable
    searches and seizures, shall not be violated.” Various cases tried before the
    Supreme Court, such as Katz v. United States in 1967, have broadened the interpretation
    to include protection against wiretapping. The court has ruled that, even without
    physical trespass, wiretapping constitutes an illegal search under the Fourth
    Amendment. Thus, the amendment has been interpreted in a way that protects people
    and not simply places. Over the years, new laws and judicial decisions have refined
    the criteria and procedures defining when wiretapping is legal.


    # The Threat of Centralized Databanks


    Without computers, a modern welfare state could not operate. This explains the
    thinly veiled euphoria of the bureaucracy for the new technology. Viktor Mayer-Schönberger,
    “Generational Development of Data Protection in Europe”


    Privacy legislation has evolved since the 1970s, when computers seemed to fulfill
    the predictions of George Orwell’s *1984* first appeared.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Chapter 8


    As plans for using large computers in government bureaus took shape, many people
    became concerned that the data banks they contained would be used by powerful
    and inhumane bureaucracies. The amalgamation of information would, they feared,
    create more centralized power and be used to advance the narrow goals of bureaucrats
    rather than those of society in general. Legislators, assuming that information
    would be kept in functionspecific, bureaucratically controlled databases, responded
    to the threat by creating regulatory institutions. Germany and Sweden, for example,
    established commissions and boards empowered to investigate compliance with data-protection
    norms.


    In the United States, the first federal legislation specifically regulating the
    use of personal information was the Privacy Act of 1974. Its first principle is
    that the federal government should have no secret systems of record keeping. The
    act requires each agency to publish a notice of all record systems it maintains
    and to set up procedures enabling U.S. citizens—not foreigners or even alien residents—gain
    access to their records and make corrections. There were reportedly about five
    thousand government data banks in the United States at the end of the 1990s. Even
    a casual search of the Net for “Privacy Act of 1974” turns hundreds of postings.


    The Privacy Act also mandates that only information relevant to a specific purpose
    can be collected and that it be accurate, complete, and up to date. Another forbids
    external disclosure of an individual’s personal data without the consent of the
    subject or a judicial authority. However, as the act includes no statutory test
    for judging disclosures, it leaves disclosure policy up to the agencies themselves.
    An agency can decide that a disclosure is compatible with the purpose for which
    a record was collected if it establishes that such disclosures are a “routine
    use.” Privacy advocates have argued that agencies’ ability to make such declarations
    of routine use without external oversight is a major loophole in the Privacy Act.


    # The Flow of Personal Data Across National Borders


    By 1980, governments recognized that national differences in privacy legislation
    are exceptionally important, because of their potential to interfere with the
    flow of information and, thereby, with international trade.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# The Digital Keyhole 203


    Organisation for Economic Co-operation and Development (OECD)—successor to the
    Organisation for European Economic Co-operation (OEEC), which coordinated the
    rebuilding of Europe under the Marshall Plan after World War II—early broadened
    its membership to include the United States, Canada, Japan, and six other countries.
    The OECD’s 1980 guidelines for privacy and the flow of data were an attempt to
    harmonize members’ privacy laws and advise countries that had not yet enacted
    such legislation. The guidelines became the basis of many national privacy laws
    as well as voluntary codes of conduct.


    To remove or avoid creating unnecessary obstacles to the flow of personal data
    or economic information, the OECD guidelines proposed the following principles,
    abbreviated here, to define members’ minimum consensus on privacy policy.


    +    Limitation. There should be limits to the collection of personal data; any
    such data should be obtained by lawful and fair means and, where appropriate,
    with the knowledge and consent of the data subject.


    +    Quality Personal data should be relevant to the purposes for which they are
    collected, and to the extent necessary for those purposes, it should be accurate,
    complete, and up to date.


    +    Specification. The purposes for which personal data are collected should
    be not later than the time of collection; subsequent use of the data should be
    limited to the fulfillment of those purposes or of such others as are compatible
    with them and as specified each time the purpose changes.


    +    Limitation. Personal data should not be disclosed, made available, or otherwise
    used for purposes other than those specified, except with the consent of the subject
    or by authority of law.


    +    Safeguards. Personal data should be protected by reasonable security safeguards
    against risks as loss or unauthorized access, destruction, use, modification,
    or public disclosure.


    +    Openness. There should be a general policy of openness about developments,
    practices, and policies with respect to personal data. Means of establishing the
    existence and nature of personal data held and the purposes of their use should
    be readily available, as well as the identity and usual residence of the data
    controller.


    +    Participation. Individuals should have the right to obtain from a data controller,
    or other official source, information or confirmation of whether data relating
    to them has been collected; they should receive, on request, copies of such data
    within a reasonable time frame at'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 204  Chapter 8


    a charge, if any, that is not excessive and in a readily intelligible form. They
    should be able to challenge any of the data and, if the challenge is succesful,
    have the data erased, rectified, completed, or amended.


    +   * Accountability. A data controller should be accountable for complying with
    measures that give effect to the principles stated above.


    To a large extent these principles were grounded in the experience of the data-protection
    laws of the 1970s. What the OECD brought to the privacy debate was the realization
    that national privacy policies had an international dimension. Many countries,
    including the United States, endorsed these principles.


    When the OECD was crafting its guidelines, it recognized that balancing interests
    in privacy legislation was unlikely to be accomplished quickly or once and for
    all It acknowledged several areas in which members had difficulty reaching agreement;
    the nature and requirements for control and enforcement mechanisms, the application
    of privacy laws to corporations or "legal persons" as well as physical persons,
    and differences in attitude about which categories of data were especially sensitive.
    The overall mission of the OECD was to promote privacy legislation that would
    minimize disruption of trade and to provide a forum for ongoing debate of the
    privacy issue.


    # Informational Self-determination


    By the 1980s the continuing development of technology had undermined the assumption
    that regulating data banks would control data use. Computers were getting smaller,
    faster, and more ubiquitous. Departmental computers, minicomputers, and even personal
    computers became more common. Centralization was no longer the main technological
    challenge, since data could be brought together on small computers and corrected
    at will. The second generation of European privacy laws focused instead on citizen
    rights. The constitutions of Austria, Spain, and Portugal were amended to provide
    citizens with informational privacy rights. New statutes were passed in France,
    Austria, Denmark, and Norway. Legislators assumed that these laws enabled citizens,
    supported by legally established privacy rights, to ensure their own privacy.
    Individuals could not only access and correct their personal data, they could
    also have a say in how data were'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# The Digital Keyhole 205


    used. For example, the Norwegian Data Protection Act gave individuals the right
    to use their data for direct marketing and market research. Privacy institutions
    were evolving from regulatory bodies to boards that could rule on disputes over
    a particular individual''s rights. The French Privacy Commission, for example,
    is responsible for setting up procedures for data processing; it can also rule
    on disputes in individual cases. In Germany a 1983 case before the Constitutional
    Court popularized the phrase informational self-determination, referring to the
    individual''s absolute right to decide on the release and use of his or her personal
    data. Thus, in several European countries—including Germany, Austria, Norway,
    the Netherlands, and Finland—the philosophy behind legislative changes was to
    bring the individual into the loop for making decisions about personal information.


    During 1980s European legislatures were with much more proactive than the U.S.
    Congress in relation to privacy legislation, on two counts. The first is that
    European laws were designed to empower the individual to seek specific privacy
    rights over particular kinds of data, no matter where the data records were kept.
    In other words, laws in Europe sought to protect the rights of citizens rather
    than trying to regulate specific data banks. Secondly, the new European laws governed
    private as well as government records. Legislatures in the United States have
    been reluctant to create an omnibus law to apply to private-sector as well as
    governmental data.


    # Unalienable Privacy Rights


    In the 1990s experience with these laws showed that, even in Europe, the power
    was stacked against the individual. Few individuals could afford the financial
    and time commitment required to determine how information about them was used
    or to demand redress. Under the principle of informational self-determination,
    the forfeiture of privacy rights—as might be specified in the small print of telephone
    or credit card contracts—was legally valid. Unfortunately, experience has shown
    that individuals sharing information easily give up privacy rights without even
    realizing that they had done so or that a choice was available.


    Moving to redress the power imbalance between the citizen and consumer and large
    organizations, more recent European laws have sought to define'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 206 Chapter 8


    certain privacy rights as unalienable and to provide individuals in disputes with
    professional help (such as from ombudsmen). Legislation in several European countries
    has specified, for example, that rights to control the release of credit records
    cannot be bargained away. Roughly speaking, recent European laws about such sensitive
    records have established unalienable rights for individuals and enacted norms
    for data processing.


    Although the U.S. experience during this period has similar elements, the common
    law used to decide many privacy issues has tended to take teeth. An important
    criterion in judging proper use of data in a court case is the “reasonable person”
    text. According to this standard, because computers are now so used to collect
    and combine data, a reasonable person would have a rather lower level of expectation
    about privacy. The privacy battle is thus lost before it starts. Case law is not
    likely to induce a record keeper to follow provisions like those of the Privacy
    Act—that is, to publish descriptions of records, limit data collection, meet quality
    standards, allow access to correction, and restrict internal uses of data.


    During the 1990s, lacking common law and constitutional protections unable to
    reach a consensus for omnibus statutory regulation of data banks, the U.S. Congress
    enacted federal privacy laws to regulate several specific kinds of private data,
    including video-rental records, telephone records, cable-viewing records, and
    educational records. The Fair Credit Reporting Act of 1970, revised in 1996, mandates
    consumer access and correction as well as limits on data use and disclosure. Unlike
    earlier legislation, it spells out legal remedies and provides for administrative
    enforcement. In the late 1990s, use of other sensitive records, such as medical
    records, remained essentially unregulated.


    The pieal approach parallels a recent shift in European law away from the omnibus
    regulation of data banks and informational self-determination and toward guarantees
    of specific unalienable rights over specific kinds of data.


    # European Regulatory Harmonization


    For the past two decades an important activity of the European Commission has
    been the effort to harmonize the data-protection laws of the European Community
    (now European Union, EU). Because it has direct consequences'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# The Digital Keyhole 207


    for individuals and corporations from other countries doing business in Europe,
    the influence of this harmonization process has extended world-wide and has prompted
    public debate and awareness of privacy issues.


    In 1981, the Council of Europe issued a convention for the protection of individuals
    from misuse of personal data resulting from automatic processing systems. Among
    other provisions, this convention lays out of data protection and directives for
    transporting personal data across national borders. The convention is somewhat
    abstract; it lays out general principles for defining categories of data, data
    security, safeguards, sanctions, and such things but leaves specific details of
    implementation and enforcement to EU member states. Moreover, member states, after
    giving notice of their interest, decide individually not to follow the convention.
    The convention, which affects any corporation doing business in Europe, went into
    effect in1985 after it was ratified by France, Germany, Norway, Spain, and Sweden.


    In 1995, the European Commission issued the European Directive on the Protection
    of Personal Data—95/46 EC—which took effect in October 1998. The directive has
    several significant effects on record keeping. For example, each member state
    must establish specific authorities responsible for monitoring data privacy in
    its territory. When an organization collects data from a subject, it must provide
    to the authority the identity of the controller, the purposes of the information
    processing, and information about data recipients. In addition, it must indicate
    which of the data obtained are voluntary and which are obligatory. Finally, the
    directive requires the data controller to whether the subject has the right to
    review and correct her personal data. Combined with the 1981 convention, the directive
    acts to block transfer or exchange of personal data not collected in accordance
    with EU standards.


    In many European countries—and to some extent, in the United States—privacy law
    has evolved toward the view that individuals possess certain unalienable rights
    to privacy from the unchecked collection, storage, and distribution of personal
    data. Under the Freedom of Information Act (1982), U.S. citizens may request access
    to any written or electronic records held by the federal government. Furthermore,
    the Privacy Act of 1974 regulates many aspects of the federal government’s record
    keeping. Although'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'there is no omnibus regulation covering records held by private parties in
    the United States, certain classes of data, such as credit records, are regulated.
    Privacy advocates in the late 1990s often note, however, that the United States,
    unlike member states of the European Union, has no oversight agency for privacy
    enforcement.


    # Commerce and Intrusion


    We can look at your customers and tell you a lot more about them. More than you
    ever thought possible. Not as a group, but as individuals. By exact age. Sex.
    Income. Lifestyle characteristics. Life event. And and more. And we can help you
    decide the most effective ways to use this type of information to achieve your
    marketing goals.


    Advertisement for Metromall, Inc.


    In addition to legislative actions, there are several policies or policy frameworks
    for regulating private data developed by organizations in the commercial sector
    of the United States—for example the Information Technology Industry Council (ITC)
    and TRUSTe. Rather than mandating a particular standard, both organizations recognize
    that personal data varies in levels of sensitivity and the need for protection.
    They advocate a self-regulating approach in which each industry group works out
    a general policy framework that member organizations can adopt; each member or
    licensee then develops a policy whose specific elements are consistent with the
    general framework. Establishing a broad policy framework and letting participating
    companies tailor their own particular policies is easier than obtaining agreement
    on specific elements. However, lack of a uniform code leaves to the concerned
    consumer the work and responsibility for checking the details of an individual
    company’s policy.


    In addition, neither ITC''s nor TRUSTe''s policy framework covers the issue of
    shared collected data with other parties. TRUSTe''s framework does, however, differ
    from the ITC''s in requiring licensees to cooperate with TRUSTe reviews and audits
    of their policies. However, as most privacy policies from commercial entities
    lack independent audit and sanctions provisions, it is doubtful that such policies
    can exert enough influence to head off legislative action.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# The Digital Keyhole 209


    Another organization, the Information Technology Policy Council (ITPC), is a group
    of major high-technology trade associations that includes, among others, the American
    Electronics Association, the Business Software Alliance, the Computer and Communications
    Industry Association, the Computer Systems Policy Project, the Consumer Electronic
    Manufacturers Association, and the Telecommunications Industry Association. In
    the spring 1998 it proposed an eighteen-month plan for adopting and implementing
    an industry-led, self-regulatory scheme to address privacy concerns in on-line
    applications. The “ITPC Self-Regulatory Privacy Plan” expresses its members’ agreement
    on the need for a unified set of privacy principles as a model for the high-tech
    industry. Further, it states that these principles should be codified in such
    a way as to identify alternative avenues for consumer recourse if a company adopting
    violates the guidelines.


    In the late 1990s awareness of issues relating to data privacy in the United States
    expanded to include many kinds of privately held records. The power of computers
    and networks has created risks to privacy because so many ordinary things do in
    the course of a day leave electronic trails.


    When we use a telephone, a record is made of whom we or who called us. If we carry
    a cellular telephone, the cellular network automatically keeps track of where
    we are so to create a connection if someone calls us. Whenever we use a credit
    card or an ATM card, a record of the place and time of the purchase and, often,
    the goods purchased, is made. If we use a supermarket discount card, a record
    is kept of exactly what items we have purchased. Our credit histories, including
    our current credit card balances and any credit disputes we are involved in, are
    maintained on-line and managed by credit bureaus. The structure of the credit-reporting
    business is likely to err on the side of overestimating potential credit problems,
    even when the information in the data base is outdated or incorrect.


    When we surf the computer network, some programs keep track of the places we visit.
    In principle, it is possible to identify every file we read and how long we carry
    over a news story. Most people are not consciously aware of these capabilities.
    If, for example, a woman reads a digital magazine on fishing, should computer
    systems across the country this'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'interest and deluge her with special offers for fishing gear and fishing magazines?
    If a man with a heart condition develops an interest in deep sea fishing, should
    his insurance rates go up because of the risk he will cost the company more money
    if he has a heart attack at sea?


    A particular concern many people have about computers and networks is the way
    they simplify the process of merging data from different sources. For example,
    in 1996 someone in Canada proposed to catch unemployment cheaters by matching
    the customs forms of Canadians returning from a journey vouchers for unemployment
    insurance—a purpose having nothing to do with identifying the value of goods brought
    abroad. This is just one example of the many ways that a piece of information,
    a name or a personal identity number (like a social security number), can make
    it easy to assemble data from diverse sources. When data are routinely collected
    for one purpose they can be routinely used for another. According to some privacy
    advocates, this practice violates the principle that data should be collected
    and used only for a specific purpose.


    In 1988, to address concerns that some federal agencies were employing the routine-ine
    exception to justify widespread electronic comparison of federal databases, the
    U.S. Congress passed the Computer Matching and Privacy Protection Act. The new
    law, amends the Privacy Act, regulates the agencies'' use and exchange of information
    in their data bases and specifies procedures for making automated comparisons.
    Individuals who suffer adverse consequences as a result of such data exchanges—such
    as loss of a government benefit—must be notified and given an opportunity to refuse
