    Although they were almost an afterthought in his book, Dawkins'' memes have been
    taken up by many writers. Memes, somewhat like genes, are carried by people. They
    are the knowledge transmitted in conversations and contained in minds. Memes can
    be reinterpreted in new environments and expressed in new combinations, just like
    genes; and, like genes, they often come in interactive clusters. Memes compete
    for place in meme pools, and if populations of memes become isolated, they undergo
    a sort of memetic drift analogous to genetic drift.


    As Rich Gold points out in the quotation above, we often experience a deep emotion
    when we absorb a piece of information—a meme. We understand a meme about how to
    do something when we see someone do it, or when we read or hear it. The “ha!”
    feeling inventors at the moment of insight is a variant of the same feeling.


    In the light of this feeling, can we reinterpret the slogan “knowledge is power.”
    When we learn something important, uplifting feeling may reflect a little surge
    of power. If Gold’s comment is correct, it suggests something deep about the survival
    strategy of the human species: that we carry genes—curiosity genes, teaching genes,
    and learning genes—that promote the replication and selection of memes. Thus,
    we are wired to enjoy those activities that have great survival value.


    # Toward a Meme’s Eye View


    We can reinterpret the preceding stories of cultural change from a meme’s eye
    view. Cultural change occurs along a wavefront, with the memes competing and spreading
    to new carriers. Basic human capabilities for communication and imitation modulate
    the rate at which memes spread. Differences in the rate of propagation, like those
    between hunting cultures and farm cultures, can be explained by assuming that
    many more memes are needed for farming practices than hunting skills. Apprenticeship
    programs and university courses in science can be seen as social mechanisms for
    communicating memes about the techniques and practices of science.'
