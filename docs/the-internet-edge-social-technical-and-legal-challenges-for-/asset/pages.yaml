- pgno: 128
  md: '# Focusing the Light 111


    checking a page on the Net, the Net was then about complex as five haystacks.
    What surprised me about this field study was not that the Net''s size exceeded
    the "haystack complexity barrier" that it had apparently entirely done so in mid–1997.
    With the growth rate of about a factor of ten per year, searching the Net (albeit
    in an automated fashion) will soon dwarf this proverbially difficult search problem.


    # Information Feast or Famine


    In the early 1990s, when browsers and search tools first appeared in the Internet,
    some of the researchers here told me I consider finding another line of work because
    there would be no further need for librarians. But now they are calling for help
    in greater numbers, asking not for documents but also for data, analysis and search
    the Web. People are overwhelmed by what comes back when they search the Net for
    information. It''s feast or famine.

    Giuliana Lavendel, 1997


    Most people use a search service to search the Net for information. These services
    perform most of the time-consuming work before the searcher contacts it. Search
    services use web walkers (“search engines”) sweep through the Net periodically,
    following links and keeping track of the documents or web pages they have visited
    before. The web walker records the words used in each document visited, then assembles
    them into an inverted index, which records the documents on which each word appears.
    The index is saved and later to quickly match customers’ queries for documents.
    Thus, the time-consuming work of sweeping the Net and constructing the inverted
    index is done ahead of time and does not delay the retrieval of results when a
    user requests a search.


    When someone searching for a document designates the words that should appear
    in it, the search service uses the inverted index to find documents. The disjunctive
    query haystack complexity returns a list of web documents in either the word haystack
    or the word complexity appears. The conjunctive query haystack + complexity returns
    a list of web pages on which both words appear.


    The breadth of a query is an indirect measure of how many matching documents or
    web pages one would expect to find. A broad query matches more documents than
    a narrow query. For example, the disjunctive query'
