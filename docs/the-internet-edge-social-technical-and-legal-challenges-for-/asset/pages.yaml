- pgno: 152
  md: '# The Next Knowledge Medium 135


    Finally, I offer several predictions, drawing on some current innovative projects
    and ideas that suggest how we might build a new knowledge medium—an information
    network with semiautomated services for the generation, distribution, and consumption
    of knowledge. Such a knowledgeedge medium could quite directly change our lives.


    # Stories


    The following three stories illustrate the constant growth of knowledge and cultural
    change in human history. They are representative; the anthropological and historical
    literatures contain many similar stories. Taken together, they demonstrate how
    cultures evolve, not steadily but in fits and starts.


    # The Spread of Hunting Culture


    At the end of the Pleistocene glaciations, a spear-throwing hunting culture swept
    from what is now the northwestern United States and spread throughout the length
    and breadth of the Americas. This Paleo-Indian culture was characterized by the
    use of the spear with a distinctive fluted point and the hunting of very large
    animals, such as bison and mammoths.


    According to the archeological evidence, these weapons, and presumably the culture
