  img_proc: true
- pgno: 70
  md: '# The Portable Network 53


    One of the interesting features of networked digital devices is that they probably
    will not need vast amounts of local storage. With adequate bandwidth, they could
    store pictures, sounds, and videos directly on the Net. When potentially millions
    of people are carrying around devices that can easily record information and post
    it on the Net, there will be a very good chance that whatever they are doing at
    a given moment will be posted to the Net. Such widespread deployment of information
    has, again, many implications that bear on personal privacy (as considered in
    chapter 8). That, too, is part of what we may get when we wish for PDRs.


    # Reflections


    At the beginning of this century Edison believed that the major use of the phonograph
    would be for business dictation. Ultimately, Berliner showed that its most important
    application would be for entertainment. Even the recording business did not stand
    still in the face of emerging technologies. In the 1930s, the advent of the “wireless,”
    or radio, affected the industry, but not in the way people expected. Instead of
    making it unnecessary for people to buy records, radio broadcasting promoted record
    buying. As the businesses co-evolved, radio promotion, record sales, and advertising
    found complementary, mutually supportive niches in the music business. In 1928,
    the Radio Corporation of America (RCA) purchased the Victor Talking Machine Company,
    forming RCA Victor. In 1938, Columbia Records became part of the Columbia Broadcasting
    System (CBS). Manufacturers began to produce entertainment consoles that included
    both radios and phonographs.


    Wireless communication, radio broadcasting, brings mobile connectivity. When media
    became wireless they become untethered. Cellular telephones enable mobile workers
    to connect with home or office from any place at time. They change the implications
    of the advertising line, “reach out and touch someone,” an act no longer limited
    to the place where the telephone plugs in. The combination of radio and PDR displays
    is equally dramatic. The cellular PDR will do for information and knowledge workers
    what the cell phone did for voice and mobile workers. It has the potential to
    accelerate the convergence already happening in the media industries. It has the
    potential to change many things in our lives.'
