    # Trusted Systems and Liability for Security Failures


    Another issue of concern potential digital publishers who will be liable for losses
    incurred through security failures. Copyright law and the preceding scenarios
    for using digital works on trusted systems focus mainly on balancing the rights
    of two parties: rights holders and the public. However, because the trusted system
    technology has ensure the security of digital works and enforce digital contracts,
    the manufacturers and vendors of such systems are central to preventing and dealing
    with the consequences of security failures.


