  img_proc: true
- pgno: 42
  md: '# The Portable Network 25


    animations, interactivity, and rapid delivery, multimedia documents capture the
    pulse of a society on the move.


    Why then does paper survive? What do paper documents have that digital documents
    do not? To publishers of books, newspapers, and magazines, their most important
    property is an established economy for buying and selling them. (I discuss this
    issue in relation to digital publishing in chapter 3.) Other properties of paper
    documents are so obvious that they are portable, cheap to make, usually don''t
    break in ways that affect their readability. Their visual presentation has good
    color and contrast. They require no electronic devices for reading them. Consequently,
    human readers need not contend with low batteries, out-of-date formats, or failures
    of the operating system. Paper can also be wonderfully personalized. You can write
    it, fold it, attach things to it, copy it, bind it together in a package. It has
    no computer program to say “you can''t do that.


    # An Internet Dream: Information on the Go


    What would it take to bring the portability and other properties of paper documents
    to devices for the Net? In the sample list of untethered visions for the Net,
    the one that most directly addresses this question is the portable document reader
    (PDR). In time (perhaps not much much), PDRs may become the new digital paper,
    as useful for reading and marking things up. At their best they could combine
    the interactivity of computers, the connectivity of telephones, the bandwidth
    (the rate at which data can be transmitted or received) of television, and the
    portability of paper. The search for the perfect PDR has been a particularly enduring
    and compelling dream. Looking at the advantages of PDRs and the obstacles to their
    development will help us understand how technology and the Net are co-evolving.


    # The Technology of Portable Document Readers


    Many technologists, librarians, students, and futurists I met during the 1990s
    liked to describe their ideal version of a PDR. Usually they modeled it after
    a tablet or pen-based computer. It would have a bright, high-contrast'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 26 Chapter 2


    display area about large as a letter-size sheet (8½ × 11 inches)—or, for Europeans,
    an A4 sheet (about 8½ × 11). It would weigh less than a pound and have enough
    storage capacity to contain several complete works, if not a small library. When
    used as a portable, the batteries would last for many hours, if not days or weeks.


    For many, an important consideration is ease of reading. Because people often
    imagine using the device while seated in an easy chair, they usually think it
    shouldn''t have a keyboard. They have various ideas about how to interact with
    it. Some suggested communication by hand gestures or hardware buttons or touch-sensitive
    screen buttons for operations such as paging, skipping to a section, highlighting
    passages, or leaving a bookmark. Over time their proposals for downloading documents
    to the device also differed. In the early 1990s, the idea was to load books on
    floppies; later people suggested that on-line books would be loaded by using a
    modem. Still later, the idea was to use a built-in cell phone or other wireless
    technology for cordless and ubiquitous downloading.


    # Not Quite PDRs


    Although laptop computers were the most prominent portable computer products available
    in the 1990s, they are decidedly less “bookish” than PDRs, because keyboards figure
    so prominently as the user interface. Nonetheless, the names of these devices
    allure to their paperlike and booklike properties. In the 1970s, Alan Kay''s vision
    of a laptop computer—complete with fold-down screen, keyboard, audio, and a video
    camera—was called the Dynabook. Apple, Hewlett-Packard, and Sun Microsystems named
    their laptop computer products PowerBook™, OmniBook™, and SPARCbook™, respectively.
    Handheld devices by Franklin Books were loaded with dictionaries, bibles, and
    reference books. Although the displays on these devices were much smaller than
    typical book pages, they introduced many people to the idea of reading on portable
    electronic devices. In the early 1990s, Voyager began publishing several book
    titles on floppies with interfaces for reading them on laptops.


    In the late 1980s, Wang Laboratories demonstrated pen-based interfaces for their
    Freestyle™ system, which ran on their proprietary line of desktop personal computers.
    The interfaces interacted with computers and enabled'
