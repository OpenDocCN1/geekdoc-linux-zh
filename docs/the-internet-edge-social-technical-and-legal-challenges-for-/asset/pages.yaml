- pgno: 250
  md: '# 9

    Strangers in the Net: Access, Diversity, and Borders


    If you give people a chance, they are less interested in turning the Net into
    a world forum than a back-yard fence. There''s a new Tower of Babel, and it has
    an Intel sticker on the side.


    Geoff Nunberg, on National Public Radio''s *Fresh Air*


    What do you mean saying that the world is not a global village? I am from a village
    in India. People from my village go off and marry someone in England or the U.S.
    or Africa. The world is a global village. It''s the strong networking which sets
    the tone for easier, smoother global communication. I can talk to someone in England—by
    e-mail or phone or anything else—easier than I talk with my neighbor.

    Mali Sampang, 1997


    How is the worldwide connectivity of the Net changing our lives? I found myself
    returning to the question again and in the course of writing this book. In several
    chapters I have addressed particular fragments of an answer—the potential for
    a worldwide marketplace in digital goods, devices to make the network more portable
    and ubiquitous in our daily lives, methods to help us make sense of the overabundance
    of information, ways to preserve our more and more elusive personal privacy. I
    found ample evidence of national and international trends on which to base these
    fragments of an answer.


    Still, I felt a nagging sense that the emerging Net was incomplete in important
    ways. In particular, I was concerned that my life in Silicon Valley may be blinding
    me to important phenomena or overwhelming my enthusiasm for the Net. In this part
    of California, the source of so much computer technology and culture, the Net
    has a sheen of reality about it. Here the stuff of somebody''s technological dream
    shows up quickly in the local electronics stores and later spreads throughout
    the'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 234 Chapter 9


    world. The same could be said of only a few other areas of the United States and
    the world. Has this constant reinforcement of our technological dreams led me
    to an exaggerated belief in the importance of the Net that doesn''t reflect the
    reality emerging elsewhere?


    The world, after all, is not the Silicon Valley, and the people of the world are
    not just like the people who live and work here. In this chapter, I try to step
    outside the Valley—to different parts of the United States and the world beyond—to
    ask the question again, seeking answers in the contexts and worlds of people far
    removed from the technological centers. I make no claim that my exploration is
    complete, and I realize that it raises many new questions. The contrasts between
    the various natural and cultural contexts are extreme enough to load, inevitably,
    to very different responses to the Net; they reflect as well the diverse expectations
    that the world''s peoples have about the Net and how it will affect their lives.


    # No Phones, No Electricity


    In 1998 I spent the month of June trekking around Nepal and western Tibet with
    a group of Europeans. This journey raised many questions for me about the influence
    of the Net in third world countries.


    Telephones and electricity—essential infrastructure for Internet communication—are
    rare and only intermittently in western Tibet. In a guest house we stayed at in
    Darchen—a small town visited by many travelers to Mount Kailash—the lights could
    on dimly at 9:00 P.M. and went off at 10:30 P.M. There was no way to plug in an
    electronic device during the day. While the electricity was on, there was no way
    to turn off the lights, except by removing the light bulb. On the frequent nights
    the electricity did not work at all, the proprietor of the guest house brought
    candles to the rooms. The guest house, we were told, had the most reliable electricity
    in town.


    Other factors not directly related to the electricity supply also affected the
    local context for the Net. The ground floors of the guest house, and every other
    establishment in Darchen, were dirt. There was no plumbing of any kind. A nearby
    creek was used by animals and for clothes washing and for cooking water. You boil
    and treat water before drinking it. Western Tibet has practically no paved roads.
    Westerners travel over long distances chiefly by Toyota cruiser or truck, driving
    over faint trails in the high'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Strangers in the Net 235


    desert or along river beds. Locals walk a lot. About 20 percent of the pop-lation
    are nomads who tend their yaks and mountain sheep in the high desert country.


    Telephone service is even more rare than electrical service. Larger towns, especially
    those with a governmental presence, often have a microwave tower that supports
    telephone communication. You go to a dedicated tele-phone building and wait until
    one of the two or three phone booths is avail-able. After making your call, you
    pay cash to a person at a teller''s window. Phone service is intermittent, because
    it depends on the availability of electricity.


    In the few years the planned satellite telephone system will provide greater connectivity
    for Western travelers and relatively wealthy Tibetans, even when they are trekking
    in the mountains or driving on the high desert. However, the need for generating
    equipment to keep batteries charged and the relatively high cost of connection
    are likely to keep the routine use of telephones beyond the reach of most residents
    for many years.


    One might expect from my description that the Net is completely unknown to most
    people in the region, but that wouldstate the case. The majority of trekking expeditions
    to western Tibet begin in Nepal, often in Kathmandu, a third city with an international
    airport and head-quarters for numerous trek organizers. Even though the electricity
    in many portions of Kathmandu goes off for several hours a day, one can hardly
    walk down the street in the city without seeing an advertisement for e-mail. Some
    restaurants feature “cyber corners” with computers set up for Internet access,
    and many trekking companies have their own web pages. The busy-card of a shaman
    that our group visited lists an e-mail address for her earthly communications.


    In short, the Net is present on the fringes of Tibet in the large cities, competing
    with the fax machine as a useful technology for international communication. Tibetans
    are also becoming acquainted with television—the World Cup soccer matches dominated
    the programming we saw in shops and restaurants. Television advertisements mostly
    feature home appliances like refrigerators, but they also mention computers. Messages
    from the outside world already come in via television and the occasional solar-powered
    radio. The Net is coming to Tibet too, but at a much slower pace. In the late
    1990s its growth was greatly limited by the weak economy and government regulation.'
