  img_proc: true
- pgno: 170
  md: '# The Next Knowledge Medium 153


    Although work with shells and experiments that store standardizing terms are the
    right next steps, they are only a beginning. Indeed, making standardization the
    only means of combining knowledge would ultimately defeat the whole enterprise.


    The need for a framework embodying knowledge and intelligence to make knowledge
    additive and reusable has been painfully rediscovered several times. In the 1970s,
    researchers in AI realized that knowledge or facts could be represented in logical
    steps; they believed, then; that all needed to be sure that the knowledge would
    be used appropriately for any purpose was a sufficiently powerful and speedy theorem
    prover they thought they could always add a few facts and derive the consequences
    automatically. Knowledge addivity and reusability were not seen as problems. Just
    pop in the facts and the crank on the theorem prover. What''s the problem?


    The first widely recognized doubt emerged when researchers realized that theorem
    prover could correct but were notoriously inefficient at solving realistic problems.
    Indeed, they were so inefficient that even for routine tasks a theorem prover
    might run for thousands of years without delivering a solution. In the 1980s AI
    researchers shifted their attention to developing efficient search processes and
    encoding knowledge to guide searches heuristically.


    There was an important lesson in the experience: by itself, a theorem prover is
    a fundamentally ignorant system. A theorem prover depends on and benefits from
    standardization of terms, but it lacks the metaknowledge to guide knowledge addivity.
    Indeed, a tacit, and unfortunate, assumption of those who design theorem provers
    has been that all needed to enable knowledge additivity was uniform syntax and
    semantics. The flawed notion has arisen in other visions of how to build intelligent
    systems. For example, a similar story involves the appeal of, and ultimate disappointment
    in, schemes to encode knowledge in terms of production rules or in logic-based
    programming languages. Additivity and reusability of knowledge require more than
    just a database of uniformly encoded statements and a simple interpreter. Knowledge
    additivity in particular requires a fund of metaknowledge used by an agent who
    can combine knowledge.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '154  Chapter 6


    # Effective and Ineffective Committees


    To put the knowledge-additivity issue in experiential terms, imagine that we try
    to impart knowledge to children by telling them things that they are not yet able
    to assimilate productively. Child psychologists tell us that until most children
    reach their early teens, they are unable to work fluently with abstract ideas.
    Even adults are often unable to make use of ideas too far removed from their familiar
    experience. In these cases we say that people lack the context for understanding
    or using the knowledge. Context is just the sort of framework that researchers
    design knowledge shells to provide, albeit in simplistic forms. In this respect,
    theorem proves profoundly less than a young child or the shell of an expert system.
    Without a context, it is not realistic to expect knowledge systems to integrate
    and utilize a wide range of facts.


    Let''s consider another, similar example: the committees and task forces often
    organized to bring together the knowledge of various experts or constituencies.
    Most people''s experience of such groups is mixed. Some of them are very productive
    and come up with solutions or ideas wonderfully superior to anything individual
    members could have created alone. We have probably also participated in groups
    whose work was arguably a waste of time and yielded far lower in quality than
    any one individual in the group could have produced. What makes the difference?
    The key to a committee''s success at combining knowledge is the metanaknowledge
    they use to bring together and integrate what they know separately.


    A dramatic example of the poor use of metanaknowledge by a committee was provided
    by a 1996 chess match. While world chess champion Gary Kasparov was gearing up
    for his historical rematch with IBM''s Deep chess champion, grandmaster Anatoli
    Karpov was using the World Wide Web to take everyone in the world. The world''s
    chess players took on Karpov not individually but collectively. Under the sponsorship
    of Telecom Finland, on-line participants formed a committee against Karpov. Anyone
    with access to a computer could go to a designated page and vote on the possible
    choices for each move in the game. About two hundred people voted on every move;
    the chess players tallied their responses and picked out the most popular move
    of the “world chess committee.\ Chess experts were probably not surprised when'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# The Next Knowledge Medium 155


    Karpov won handily. The committee played very conservatively, and Karpov took
    the offensive on sixth move. A blunder on a sixteenth move sealed the fate of
    the world committee, leading to its surrender on the thirty-second move. What
    this example suggests about knowledge combination is that “averaging” strategies
    for knowledge combination lead to conservatism and mediocrity.


    In this example, the metaknow used to combine knowledge was simply unweighted
    voting. This voting failed to account for the fact that all committee members
    were not equal. They had different levels of skill and, undoubtedly, different
    areas of chess expertise—such as openings, middle games, and endgames. If a committee
    consisting of an electrician, a plumber and a carpenter were designing a house,
    a voting scheme would give all their votes equal weight in deciding what kind
    of wiring to use.


    For the past years Bernardo Huberman and Tad Hogg have been modeling the performances
    and results of cooperating agents solving problems (1995). Their studies provide
    insights into the issues of knowledgeadditivity, the value of diversity, and the
    effectiveness of groups. Their work demonstrates a universal law: that highly
    cooperative systems, when sufficiently large, display universal performance characteristics
    not derived from either the details of members'' individual processes or the particular
    problem being attacked. This law predicts that than following the familiar bell-shaped
    Gaussian curve of performance, such groups can perform according to a log-normal
    distribution—a significant difference, because the log-normal distribution has
    a very long tail in which the wonderful performance of effective groups resides.
    This prediction is expected to apply to any problem whose solution requires successful
    completion of a nearly independent steps or subtasks as long as agents performing
    the subtasks exchange hints about their partial results. Cooperation in the form
    of hints exchanged among agents leads to a nonlinear in overall system performance.
    That occurs because any collection of cooperating agents is likely to have a few
    high performers. In a system with n agents, the expected top performer will be
    in the top 100/n percentile. Huberman and Hogg’s model quantifies improvements
    in performance according to parameters describing the search space, the total
    number of agents, the use of hints, and so on.'
