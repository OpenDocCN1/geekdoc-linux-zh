- pgno: 173
  md: 'Reflecting back on the chess example, the reasons behind the poor performance
    of the world chess committee now become clear. Although the number of participating
    agents—two hundred—was significant, there was no division of labor and no communication
    among members of the committee. Whatever potential strength in diversity and numbers
    the committee possessed was squandered by a voting system that lacked appropriate
    metagna for combining what the members knew. In contrast, familiar and complex
    examples in the real world—such as operational economies and ecologies—thrive
    on diversity, specialization, and communication.


    # Roles in a Knowledge Market: Toward a Knowledge “Services” Approach


    Try to imagine an Internet-based computational knowledge market. Taking a kind
    of industrial systems view of it, we would ask, “What different roles does this
    market require?” Our knowledge of the economics model lead us to expect knowledge
    producers, knowledge distributors (publishers), and knowledge consumers. Drawing
    on our practical knowledge of working markets we might predict many other roles.
    Perhaps there would be knowledge advertisers and knowledge advertising agencies.
    If the market were regulated, knowledge certifiers might be needed. Perhaps there
    would be substantial sprawl in our knowledge ecology, with knowledge providers
    functioning in many specialized niches. There might be a broad distinction between
    those who advise on how to find and apply knowledge (knowledge consultants) and
    those who offer knowledge services that apply knowledge to some end (knowledge
    appliers or servers).


    Experts who have participated in the creation of expert systems commonly report
    the process of articulating their knowledge in order to represent it on computers
    has, itself, yielded a better body of knowledge and a more complete understanding
    of what they know. Reflecting on this experience, Donald Michie has proposed the
    creation of knowledge refinement, where such processes could be used routinely
    to purify and finalize crude knowledge (1983).


    The model of the scientific community yields a different set of ideas about the
    differentiation of roles in our knowledge market. Integrators would combine knowledge
    from different places. Translators would move'
