    Designers of trusted systems for military and national security applications assume
    that the “security threat” will come from a determined, well-funded, malicious,
    and technically astute adversary. The U.S. Department of Defense Orange Book (DOD
    1985) discusses the system requirements that must be met by defense contractors
    building trusted systems for the military. But what are the requirements for trusted
    systems that handle digital money or copyrighted works? The answer is “it depends.”


    # The Economics of Pirateware


    What are the risks that people will develop “pirateware”—hardware and software
    for circumventing trusted systems? Compared to digital cash and military applications,
    the threat to trusted systems for digital publishing is sometimes thought to be
    minimal. But is it? One way to assess the situation is to look at the economic
    motivations. What are the perceived risks, costs, and benefits (or value) for
    those who would infringe? What are the risks for those who would manufacture and
    sell pirateware? And what are the risks, costs, and value of digital publishing
    for rights owners? A basic dictum in the design of secure systems says that, to
    be effective, they must make the costs and costs of pirating much greater than
    the expected benefits.


    As I discuss in chapter 4, the conventional wisdom about paper publishing is the
    cost of making a photocopy of a substantial work is high, compared to its purchase
    price. Publishers believe that what is mainly needed to reduce losses from isolated
    acts of copying is a way to make easier for honest people to stay honest. For
    example, if there were a simple and automated way to pay a modest fee to rights
    owners, such as inserting a credit card into a copy machine, honest people would
    pay the royalty without further added.


    This line of thought suggests that the level of security required for protecting
    digital works is similarly quite modest. But this is misleading. The risks and
    benefits of copying digital works are not really the same as they are for paper
    works. Without trusted systems, digital technology actually increases the publisher’s
    risk by practically eliminating the infringer’s costs of copying and distribution.
    A digital publisher has no'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# The Digital Wallet and the Copyright Box 59


    advantage over an infringer when it comes to manufacturing low-cost copies. With
    a few keystrokes, any computer user can copy a paragraph, an article, a book,
    or a lifetime of work and mail it electronically to thousands of people. In the
    absence of trusted systems, many publishers—fearing that digital distribution
    really means and massive copyright infringement—withhold their valuable works
    from the Net. Because the losses from infringement of digital works are potentially
    so great, the benefits of these encroachments are also high. According to our
    basic dictum about security-system design, if the perceived value of the protected
    goods is high, then the expected cost of defeating the security system must be
    made even higher.


    # The Internet Edge for Trusted Systems


    The dictum about designing for security does not assure us that we will have trusted
    systems. This is where resistance at the Internet edge for trusted systems comes
    into play. It is just as possible that we will not have trusted systems and that
    valuable digital goods (or substantial digital money) will not become available
    on the Internet. For any particular technological proposal, the pushback can be
    that the required security measures—which may include things such as special hardware,
    special software, or impractical changes to computers already in use—are simply
    too expensive.


    The back-and-forth probing at the edge between the forces for creating trusted
    systems and the forces holding them back is fueled by the perceived economic value
    of digital publishing and the perceived dequate security. Each journey to the
    Internet edge is an attempt to find a way to serve some of the potential market.


    The possible outcomes of the journey include prospects for digital publishing
    and digital money, prospects for piracy, and potentially, changes for the legal
    status of protects that determine copyright. Technology consultant Matthew Miller
    (1997) illustrates this point with a perspective on the evolution of technology
    for protecting satellite-television transmissions with descrambler boxes. In the
    late 1980s, anyone who wanted to watch satellite television could set up a large
    antenna, hook up a descrambler box, and pay monthly fees. However, the technology
    of the descrambler box was so simple that it was widely duplicated and sold in
    the'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Chapter 3


    underground and hobbyist markets. What were the risks and benefits of the pirate?
    Because television caters to a broad market, and because the same descrambler
    box would work for anybody with a satellite dish, the black market in descrambling
    boxes had broad appeal. Furthermore, there were legal ambiguities about whether
    signals broadcast in the air were in the public domain anyway. When the satellite
    broadcast approached Congress asking for legislation to prohibit the manufacture
    and sale of the rogue descrambler boxes, they got little support. Legislators
    argued that descramblers had done too little to protect their signals. Enforcement
    would be expensive, and legal relief could not adequately compensate for technological
    weakness. Made no sense to protect satellite transmission, even by a thin legal
    veil, until its trusted system technology attained a reasonable level of security.


    In the years since this example played out, several different approaches to secure
    commercial trusted systems have been developed. No trusted system is perfectly
    secure, and some security arrangements are more costly than others. As it was
    in the satellite example, the legal status of systems for defeating copy protection
    is murky. Attitudes toward copyright and pirateware are still a matter of debate
    on the international scale. Even in countries with strict laws for protecting
    copyright, enforcement is uncertain.


    One size does not fit for all trusted systems. The market for trusted systems
    will probably be stratified, with the least-expensive works and the most-expensive
    trusted systems used for the most-expensive works. This prediction is based on
    several observations. The first is that technology for high security costs more
    than technology for low security. The second is that, with low-priced works, a
    certain amount of leakage may be offset by the broader market served by inexpensive
    or even free trusted systems. The security levels of such systems are not, however,
    appropriate for distributing digital objects when there is high incentive to steal
    them.


    # Technological Foundations of Trust


    In the popular press, the use of encryption technology is often equated with high
    security in computer systems. This is a misleading association. To use the analogy
    of a door, consider the flap of a tent, the front door of the aver'
