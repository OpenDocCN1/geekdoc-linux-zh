- pgno: 264
  md: '# Strangers in the Net 247


    raphy” and to control political and religious expression. Taking such a paternalistic
    approach is not unusual in Singapore, a city-state that credits much of its economic
    well-being to careful and well-informed government regulation. But the lax controls
    of the Internet free-for-all resulted in a culture clash that spilled across Singapore’s
    national border.


    So governs the Net? At one level, the question itself makes no sense. The “Net”
    is not a place, it is not governed. On the other hand, many other things that
    are not places are regulated. Formally, international air traffic is governed
    by authorities in the countries where airplanes land and whose airspace they fly.
    However, when it comes to air safety, the organization that sets standards about
    the construction and inspection of airplanes is the Federal Aviation Administration
    (FAA) of the United States. It is not that the FAA has any official authority
    over its counterparts in other countries. It’s just that, as a practical matter,
    the FAA is larger and better funded, so it makes sense to follow its lead.


    Governance of the Net—or, more generally, leadership and shaping—has also tended
    to be largely American. It has become more international in recent years, and
    the international aspects are now reflected in the standards organizations and
    the commercial firms. As social, political, and legal issues exceed the scope
    and expertise of the existing bodies have arisen, specialized multinational organizations
    with more political connections have exercised their influence; the World Intellectual
    Property Organization (WIPO), for example, has become an important forum for discussions
    and treaties governing global copyright. The organizations concerned with privacy
    and security issues on the Internet (discussed in chapter 8) are also active internationally.


    The lack of centralized leadership for the Net may contribute to the perception
    that it is a home to anarchy, but from the practical perspective the Net is anything
    but anarchy. Within limits, the Net works pretty well. Email arrives. Web pages
    usually work with most browsers. Ecommerce is starting. Other questions with more
    complicated answers—and requiring more work at the Internet edge (e.g., how should
    taxation on the Net?)—are answered more slowly. What’s working on the Net is not
    anarchy and is preferable to chaos: it is a complex of institutions grappling
    with a complex of issues. As the title of a recent movie suggests, that may be
    as good as it gets.'
