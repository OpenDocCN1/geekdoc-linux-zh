  md: '# The Edge of Chaos 183


    which was three times as fast as handwriting. A serious aspect of the- productivity
    problem for IT is that its rapid evolutionary cycle leaves users in a perpetual
    learning mode.


    # Spreading Change


    If the IT community moves too soon, they incur all the trials of early—which is
    to stay premature—adoption, devouring precious resources to debugging systems
    . . and stretching thinning systems in parallel until the new paradigm is reliable....
    If they move too late, on the other hand, they expose their company to competitive
    disadvantages as their industry operate at lower cost and greater speed by virtue
    of their more efficient infrastructures. Worst of all, if they move too late .
    . they run the risk of getting trapped in end-of-life systems. Geoffrey Moore,
    Inside the Tornado


    For a new technology to grow past niches, it must have a broad value and appeal.
    For example, it might enable people to do something they could not do before,
    or do something much better or faster than they could before. That value and appeal
    is the force that spins the tornado during the period of rapid growth and spreading
    change.


    In his analysis of the tornado phenomenon in the information technol odogy, Moore
    looks at the support groups that cut across company and industry boundaries (1995).
    As he sees, these groups are united to answer a single question: Is it time to
    move yet? Executives find themselves balancing the risks of moving too soon with
    the risks of moving too late. As the time to shift starts approaches, the two
    risks become about equal. This he notes, creates an instability.


    As a way of copying they reach agreement about three principles:


    +   1. When it is time to move, let us all move together. . . .

    2. When we pick the vendor to lead us to the new paradigm, let us pick the same
    one. . . .

    3. Once the move starts, the sooner we get it over with the better.


    The herd instinct characterized by these three principles leads to a flash- point
    in the marketplace. That point signals the beginning of a tor- nado, which brings
    about rapid adoption of the new technology and sweeping change. The kind of tornado
    hit New York after 1825.'
