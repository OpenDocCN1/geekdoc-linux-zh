    a salient characteristic. The cycle illuminates the range of sensemaking activities
    that are integrated into the reading, writing, and analysis of documents.


    # External Cognition


    Psychologists who study how people work with knowledge or information pay close
    attention to their use of external representations: that is, to their writings
    and drawings on computer screens, paper tablets, or blackboards. They use the
    term external cognition for the human information processing that combines internal
    cognition with perception and manipulation of external symbols. We create, use,
    and share external representations in ways that augment our mental work.


    I recently encountered a very effective example of a designed external representation
    when I was a member of a planning team preparing a proposal'
