  img_proc: true
- pgno: 260
  md: '# Strangers in the Net 243


    follow their directions. And yet, driver after driver arriving at intersections,
    faced with these volunteers in action, chose, for the most part, to follow their
    directions. In more enduring situations, dictators and others with dubious reputations
    remain in power because there is a widely shared, similar belief that the chaos
    and disorder precipitated by a power vacuum would be worse.


    Do the same kind of issues arise in the context of the Internet? What sort of
    Net activities need governance? What persons or organizations wield power over
    the Net? How—given that the Net crosses national borders—does governance of the
    Net relate to the laws and jurisdictions of existing governmental bodies? What
    are the power dynamics of corporate enterprises operating on the Net?


    One of Belle''s laws of power is exercised through and depends on institutions.
    These institutions limit, come to, and eventually confer or withdraw power. Historically,
    the Internet grew out of ARPANET, and its governance was highly influenced by
    a combination of academic and military interests. The crucial early concern of
    ARPANET users was establishing technical compatibility so that the different kinds
    of computers at time could communicate with each other. A great deal of cooperation
    was needed to accomplish this goal. What evolved from these efforts was a spirit
    of open review and a system of started commenced establishing the standards and
    protocols for the Net. Then, the Net has gone through many stages of shifting
    sponsorship, internationalization, and inevitably, accommodations with other organizations.
    Still, the spirit of cooperation that determined early ARPANET standards lives
    on in an organization known as the Internet Engineering Task Force (IETF). It
    is an international community of network designers, operators, vendors, and researchers
    concerned with the evolution of the Internet. Membership is open to any interested
    individual.


    Figure 9.2, based on an Internet webpage, shows the IETF as part of the Internet
    Society and maps the society’s principal relationships to other organizations.
    The Internet Society, which describes itself as a nonprofit, nongovernment, international,
    professional membership organization, focuses on standards, education, and policy
    issues. Like ARPANET in its early days, its core concerns are technical issues
    about communication standards—such as domain names and Internet addressing. The
    various'
