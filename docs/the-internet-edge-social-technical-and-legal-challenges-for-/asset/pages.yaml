    number of documents returned and increases precision, it sacrifices recall, and
    relevant documents may be missed. The problem is actually worse than that. Even
    at the right-hand side of the phase transition where the searcher is deluge with
    documents, many relevant documents may be missed owing to a mismatch between the
    vocabulary of the query and the vocabulary used in the documents. Thus, the conventional
    tools for retrieving and useful information are deeply flawed.


    The Feast-or-famine signature of a phase shift in information retrieval is more
    of a concern for some sensemakers than for others. The casual browser may be satisfied
    with the results of a single probe if most subsets of documents retrieved include
    at least relevant document. On the other hand, professional sensemakers searching
