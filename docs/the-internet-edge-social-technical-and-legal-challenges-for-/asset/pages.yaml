    If the diagnosis and recovery take place in highly adversarial atmosphere, trusted
    system vendors may have difficulty cooperating and sharing information in a way
    that facilitates expeditious containment of a security problem. Creating an industry
    insurance pool and establishing standards for cooperation can help publishers
    and platform vendors spread their risks and cooperate amicably.


    In summary, the role a trusted system plays in enforcing usage makes vendors of
    trusted systems a party to the system for honoring intellectual property rights.
    The example above illustrates an approach that combines security technology with
    institutional arrangements. That approach is intended to create a business-as-usual
    marketplace in digital works in which risks are amortized by insurance, and coordinated
    action by vendors is prompt, and the compliance and security of trusted systems
    is determined by an independent organization.


    # Governments as Stakeholders in Digital Publishing


    As pundits have observed, international borders are nothing more than speed bumps
    on the information highway. The rapidity of digital communications and their ability
    to deliver information goods across national boundaries through trusted systems
    raises several issues of interest to governments: import and export controls,
    national security, and taxation.


    With regard to taxation, the automatic billing capabilities of trusted systems
    will almost certainly attract the interest of taxing authorities unless nations
    agree to treat the Internet as a free zone. In principle, automatic billing of
    taxes is entirely feasible as long as trusted systems are kept unprematic of changes
    in the tax laws of the trading partners.


    More problematic is the issue of delineating boundaries in cyberspace. To a large
    extent, one computer looks like another in cyberspace, and location is not easy
    to determine reliably. Using intermediate agents, for example, it is possible
    to disguise the ultimate destination of a digital work.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# The Bit and the Pendulum 105


    Furthermore, with portable computers, the actual physical location can change
    continuously or frequently.


    Consider this Frenchman carries a laptop computer into the United States and downloads
    software from a U.S.-based publisher. Has he exported it yet? Does he export it
    when he subsequently carries the laptop through customs? What if an American woman
    in France with a laptop computer she intends to take back to the United States
    logs onto the Net and downloads U.S. software. Has he exported or imported software?
    Is she subject to French taxation? When she returns to the United States with
    the computer, has she exported the software twice or not at all? The traditional
    answers to these questions based on current law may or not make much sense in
    cyberspace.


    One approach to reframing import and export issues is to register computers in
    a way analogous to the way we register ships or establish national embassies in
    foreign lands. If this approach is adopted, export would occur when someone transfers
    software from a U.S.-registered computer onto a French-registered computer, regardless
    of the physical location of the two computers. Trusted systems could carry digital
    certificates that would authenticate their nation of registry no matter where
    they are in the world.


    Although copyright law tends to be a national concern (though mediated internationally
    through the Bern convention), the digital medium connects computers in different
    nations. The possibility of instituting automatic taxation on electronic commerce
    through a system of national registry is therefore likely to become a matter of
    great interest to various national governments.


    # Reflections


    With trusted systems, copyright is potentially alive and well in the digital era,
    as is the balance of interests that copyright represents.


    Trusted systems do not, however, exist in a vacuum. They are complemented by and
    are complementary to the legal, economic, social, and policy frameworks in which
    they operate. The Internet edge for digital publishing arises from the interactions
    among these frameworks and is driven by the desire of publishers and the public
    to utilize the Internet for'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'commerce in digital works. The pushback comes from the need to balance the
    complex of stakeholder interests through copyright and contract law, market forces,
    and technology development. Another component of the pushback comes from traditionalists
    in paper-based printing who resist new business models and seek to impose print-based
    policies on the digital world. In this situation, chaos may arise from the legitimate,
    and often conflicting, interests of the stakeholders in digital publishing—authors,
    publishers, consumers, librarians, trusted systems vendors, financial clearinghouses,
    governments, and the public.


    As we have seen, the pendulum is still in motion. Without trusted systems, digital
    publishing is at risk. If we have the wisdom to understand and institute the right
    policy choices, trusted systems may give us the leverage we need to guide the
    pendulum to an appropriate point of equilibrium.'
