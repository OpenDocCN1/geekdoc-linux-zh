    # Countermeasures


    The difficulty of designing practical trusted systems for digital publishing is
    inherent in the tension between the need for security and the widespread availability
    of computing platforms. If trusted systems are widespread but inadequately secure,
    publishers will not releasing their intellectual property on them. If they are
    demonstrably secure but expensive, publishers will have no incentive to invest
    in trusted systems, because the market size will be insufficient to earn back
    the expenses of creating and distributing digital works. Faced with this seeming
    dilemma, we can come to two conclusions about appropriate courses of action.


    The first suggests that designers need to create different classes of trusted
    systems; works of low value can circulate on low-security systems, and works of
    high value on systems of substantially greater security. This arrangement would
    make crucial to know the difference, that is, to be able to reliably ascertain—by
    communicating with it—the security level of any trusted system. The second conclusion
    is that transmission of many works of intermediate value requires personal computers
    whose security has been augmented by the addition of secure hardware or substantial
    improvements in the installed base. This approach is more practical than expecting
    users to buy dedicated trusted systems for accessing secure documents.


    Most of the trusted system solutions currently on the market augment the system
    security of personal computers but not hardware. Such systems can defend against
    casual attacks by uninformed users but not against determined attacks by knowledgeable
    users with specialized software tools. Nor are they proof against attacks by software
    viruses unknown to the system. Because this approach fails to provide secure memory,
    designers have had to limit the functionality of trusted systems in various ways;
    for example by requiring software-based trusted systems to authorize payments
    up-front while the systems are generally considered inadequate to secure metered,
    they rely on network-accessed servers to keep track of usage, inventory authorization
    certificates, and hold prepaid tickets. Finally, these systems tend to be used
    only for works of relatively low value, because their measures for protecting
    encryption keys are subject to software attack.


    A primary goal of augmenting the hardware of a personal computer is to provide
    secure storage of valuable data: that is, keys, billing logs, pass-'
