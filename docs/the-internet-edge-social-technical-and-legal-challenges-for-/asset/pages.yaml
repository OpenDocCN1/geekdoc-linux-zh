    between Internet sites. Table 2.2 summarizes the data rates available or projected
    for several kinds of wired and fiber-optic connections.


    Integrated Services Digital Network is a dial-up modem service that became available
    in the late 1990s in many regions. It uses one or two channels on a telephone,
    expanding to the second channel as the data rate requires. Asymmetric Digital
    Subscriber Line (ADSL) service became available on a trial basis in the late 1990s
    from several companies in the United States, including Ameritech, NYN, Northern
    Telecom, GTE Telephone Operations, and Pacific Bell. ADSL is designed to transport
    data and'
