    best ourselves, our communities, and our global environment.


    # Once Upon a Time


    The relationship between high technology, magic, and fairy tales has been noticed
    by many writers. Arthur C. Clarke, the futurist, scientist, and sci-ence writer,
    wrote that “any sufficiently advanced technology is indistinguishable from magic.”
    Clarke, the author of over seventy books of fiction and science, was the first
    to propose the geosynchronous earth orbit on which all modern communication satellites
    are based. He is per-haps best known for his screenplay (written with film director
    Stanley Kubrick) for the movie 2001: A Space Odyssey, which is based on the germ
    of an idea in his short story “The Sentinel.”


    Even scientists and technologists usually considered hard-nosed and practical
    recognize the kinship of magic and science. Clarke’s notion of advanced technology
    was similar in that of Allen Newell, the psy-ologist and computer scientist. Newell
    was widely respected as a hard- evidence, no-nonsense experimentalist and theorist
    whose contributions range from innovations in computer design to models of human
    problem solving based on information processing. He thought a about the prac-ice
    of science and even wrote rules for his students to help them manage their careers.
    He especially advised them not to speak in public about wildly speculative theories,
    except on rare ceremonial occasions.'
