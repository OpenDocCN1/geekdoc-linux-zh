- pgno: 16
  md: '# Introduction xvii


    parameters for all types of business at the Xerox edge. I believe they will come
    to dominate the existing modes of music distribution. Convenience rules.


    # Digital Doom or Information Golden Age?


    When hunting, Hawk seeks Mouse . . . and dives directly for it. When hunting,
    Eagle seeks the whole pattern . . . movement in the general pattern . . . and
    dives for the movement, learning only later that it is Mouse . . . So Hawk—the
    tendency to look at the Specific—and Eagle—the tendency to look at the Whole—have
    something to say to one another. . . each encourages the other heightened acuity.


    Paula Underwood Spencer, “A Native American Worldview"


    At a workshop Xerox Palo Alto Research Center (Xerox PARC), where I work, a colleague
    described how the Internet could change the world. He believes that we are on
    the verge of a global transformation in which the individuals in society will
    become much more connected. “Consider your liver,” he said, “or the cells in your
    liver. They are bound together and depend on each other and other cells in your
    body for survival. The world is becoming more like that, where our sense of individuality
    and interdependence is changing.


    This statement conveys a sense of wonder of the kind we often attribute to children.
    Yet the ranks of technology include many whose optimism has been tempered by intense
    struggles with technology that does not work well. What is ahead? Digital doom
    or an information golden age? As a technologist, much of my creative energy goes
    into creating new kinds of things. As a person, I see the effects of our human,
    and often unconscious, actions on each other and on our world.


    From the solitary chair inhabited by all writers, I seek perspective. Gaining
    perspective for breathing, taking wing, sharpening perceptions, and reaching for
    altitude. I have found it crucial to fly with company and have sought out other
    flyers. One benefit of the rapid pace of change is that there is a wonderful resource—travelers
    who have thought deeply about the Net and about change. They are not only people
    who have led the charge, pursuing one technological vision or another, but also
    those who found themselves caught in the middle, on a hot seat, in this process.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Introduction


    My fellow edge travelers include heads of high tech companies, librarians at the
    Library of Congress, copyright attorneys for the music and book industries, technologists
    in computer companies, and planners in the banking industry.


    Many of them have a sense of déjà vu about the Internet. They have experienced
    firsthand commotion that accompanies trips to the edge and can help us sort through
    the confusion. They understand that before people use a new technology they need
    to agree about which version to use. And before they agree and change they will
    argue. Some arguments carry some of the arguments before. They bring back the
    skills of explorers and, sometimes, maps of the territory. Some of these people
    have offered me their stories and insights, especially those recounted in their
    stories and insights, especially those recounted in chapter 7. Yet the journey
    ahead will surely have more surprises. What came before was just practice.


    This book is dedicated to us all—intrepid pioneers, dreamers, couch potatoes,
    web surfers, computer enthusiasts, hard-boiled engineers, and naysayers—whether
    dedicated travelers or interested bystanders hijacked on a journey to the Internet
    edge.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# # 1

    nThe Internet Edge: Change and Connections


    An edge . . . marks the limits of who you are and what you imagine yourself capable
    of . . . The things about an edge is that it represents a really huge identity
    crisis. On the right side . . is a new identity. On the left side is an old identity.
    . . . The edge protects and conserves your old identity.


    Arnold Mindell and Amy Mindell, *Riding the Horse Backwards*, 1991


    Come to the edge, he said.

    They said: We are afraid.

    Come to the edge, he said.

    They came.

    He pushed them . . . and they flew.


    Guillaume Apollinaire, *Abre la puerta*


    New technologies bring change. When they are fundamental to transportation and
    communication they affect more than just the mechanics of how we work and live.
    Because of them, we find ourselves interacting with people from different cultures
    who hold different values, people who used to seem very far away. We learn to
    operate in a global space—experiencing cultural clashes and making cultural accommodations.
    Technological changes leads to cultural changes—especially changes in the social
    and legal institutions that are now co-evolving with the technology of the Internet.
    The Net is not of, of course, transforming the world all at once, for change is
    a bumpy process and sometimes involves pushbacks and retreats as well as advances.


    # ## Confusion at Edges


    One way to understand the changes brought about by the Net is analogy to individuals
    negotiating change in their lives. *Process-oriented*'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Chapter 1


    psychology—the psychology of changing from—describes such changes in terms of
    edges. In the process of changing what we are into what we are becoming we may
    get stuck at an edge, a point of resistance. Psychologists Arnold and Amy Mindell
    write about edges in their books, Riding the Horse Backwards (1991) and Sitting
    in the Fire (1995). Characterize a struggle at an edge as an identity crisis.


    We can experience edges about trivial matters such as changing hair style or important
    issues like taking on new responsibilities, speaking, or asking for help. Even
    though we should speak out or should confront some problem or person, we are afraid
    that doing so will change our lives. We may recognize that we need to change jobs
    but hesitate to leave the comfort of the familiar. We know we need help in doing
    something but are too embarrassed to ask for it. When resistance at an edge itself,
    we may become temporarily confused and forget what we are trying to do. The motivation
    for change fades from consciousness, because it is difficult to keep two conflicting
    points of view in mind at the same time.


    Psychologists often observe people approaching an edge and then away from it,
    only to try again later. The urge for change drives them forward, but resistance
    to it drives them back. Oscillation—going back and forth—is characteristic behavior
    for someone working at an edge. It is not always wise to urge other people to
    cross an edge; they may not be ready for the transformation the edge implies.
    Perhaps they are still practicing the integration steps required for transformation
    to their identity.


    # Collective Edges


    Groups can have edges just as individuals have edges. In a group, confusion at
    an edge usually shows as lack of agreement about the right course of action. Members
    may express contradictory and shifting views. Over time, the people in a group
    align themselves to make a change, then back off, only to try again later. This
    phenomenon is compounded when changes in membership alter the group dynamics.
    New members may join as they see themselves as sharing interests and perspectives.


    Some edges take a very long time to cross, or may never be crossed at all. For
    example, Esperanto has achieved worldwide acceptance as a second language, but
    at a very low level. It trails behind English and several'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# The Internet Edge


    other languages in the number of speakers. By contrast, the use of nuclear fission-based
    reactors for generating electricity is an edge crossed rather quickly, though
    we may be very well cross back again when the costs and risks associated with
    it have been completely evaluated. For all possible edges, there are forces for
    the change and forces that push back.


    # Technology as a Force for Change


    I see many of the developments and issues surrounding the Internet reflecting
    a collective edge for the "tribes" of our planet. The Internet edge is our response
    to changes occurring in our lives as the world becomes more closely connected
    through the Net.


    The historian Derek de Soll Price (1983) has observed that key changes in technology
    have often preceded periods of great scientific discovery. He notes, for example,
    that many of the first elements in the periodic table were identified in the decade
    after the invention of the battery provided a way to isolate elements through
    electrolysis. In analogous fashion, many advances in astronomy, biology, and medicine
    were made immediately following the invention of such instruments of observation
    as the telescope, microscope, and magnetic resonance imager. In the 1980s and
    1990s, devices that enhance our ability to read and manipulate nucleotide sequences
    and genes have led to great advances in the understanding of human biology and
    disease processes. These understandings have led, in turn, to the development
    of specific new drugs and treatments.


    In the social arena as well, technologies are often credited with causing, or
    at least enabling and triggering, many dramatic changes. Vivid examples from the
    history of the past two hundred years includes canals, railroads, automobiles
    and interstate highways, aviation, the telegraph, telephones, radio, television,
    and communication satellites—all technologies of connection that radically improved
    means of transportation and communication. These connection technologies shrink
    distance and bring together people of different communities and cultures. This
    is why for technologies of connection is often a conflict between global and local
    values. Such a conflict can evoke resistance, a pushback, as people seek stability
    and attempt to protect the status quo. The pushback thus acts to preserve cultural
    diversity.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Chapter 1


    Although a new technology changes things, its effects are not always immediately
    evident; often its initial form is not at all the one in which it later appears
    so influential. At first, too, a new technology is likely to interact with rather
    than overthrow existing social processes and the installed base of earlier technologies.
    There can be a long period of co-evolution during which society and technology
    mutually influence each other.


    New technologies inspired by dreams such as the "global village" often start out
    with the crudest of implementations. They are promoted by enthusiasts but disenchanted
    and criticized by many others. As they are used, they are improved. During an
    ensuing period of change and confusion—lasting decades—society and technology
    co-evolve to create a new order, which is eventually replaced by the next one.
    The struggle is between the old order and the new, between what society is and
    what it is becoming.


    The Internet is now at this stage of becoming, a period of rapid growth and change.
    It is still being invented and is characterized by open options, unknown possibilities,
    confusion, and imperfect technology. Our social structures, cultural assumptions,
    and legal structures are co-evolving with the Internet.


    # Recent Journeys to the Internet Edge


    From an eagle''s eye view, the Internet and World Wide Web are events like many
    others in a long series of connection technologies. Indeed, in the years just
    preceding the rapid growth of the Internet, there were many journeys to the edge.


    In 1980, Isaac Asimov, the noted science and fiction writer, spoke to thousands
    of people at the Plaza Hotel in New York City. He announced that the event they
    were celebrating the dawn of the Information Age; computers predicted, would change
    the world. Electronic mail, digital news services, and on-line reference books
    would become available to the general public in homes and businesses across America.
    What was he talking about? It was not the Internet as we know it today, and that''s
    actually my point.


    The occasion was the launch of a dial-up, on-line computer service called The
    Source. Red Boucher, then lieutenant governor of Alaska, was among those captivated
    by the immediate possibilities of connection. He saw in'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# The Internet Edge 5


    The Source called an opportunity for residents of America’s largest but most sparsely
    populated state to become a closely knit electronic community. We wrote a book
    about it that was electronically distributed on the Source. Later he helped place
    digital switches and satellite technology in every Alaskan village with more than
    twenty-five people. Although the Source itself did not spread to everywhere as
    Asimov had predicted, it did later become a part of CompuServe (as recounted in
    chapter 7).


    The Source is just one of many early efforts to create a connection technology
    like the Internet. People have been working for years to realize a similar underlying
    dream. Here are two more examples from the 1980s.


    In 1986 Brandt Redd was an undergraduate at Brigham Young University when he was
    recruited by a technologist and dreamer, Curt Allen, to work on a database system
    for digital publishing. Forseeing a day when people would get the information
    they needed quickly through a computer, Redd and Allen found, with a few others,
    what later became the Folio Corporation. The firm’s articulated vision was “to
    empower people with information.” By the late 1990s Folio was a major technology
    provider and distributor in electronic reference publishing; it was acquired by
    Reed Elsevier and then, in 1997, by Open Market.


    Between 1981 and 1986 several other companies raced to create a technology to
    provide informational services and allow customers to transact certain kinds of
    business from home. The technology was called videotex. Communities were wired
    up with boxes connecting television sets and keyboards in customers’ homes to
    a central computer via telephone. Information as stock prices and news reports
    were instantly accessible and electronically. Videotex users could also read and
    send e-mail, pay bills, and buy airline tickets. About sixty communities in the
    United States were wired up. Videotex systems delivered some of what they promised
    and are still used in France as the Minitel system. In the United States, however,
    quickly faded. A videotex system called Viewpoint bought by Knight-Ridder closed
    in 1986 after losing fifty million dollars.


    One way to view the stories about the Source, Folio, videotex, and other early
    connection technologies is as collective edge work by the communities of the world.
    We consider this in this book is also a leading edge (if not a “bleeding edge”)
    of technology. When the dreamers, inventors, and entrepreneurs among us sense
    that an invention will enable people to do'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 6 Chapter 1


    something new, they organize others, develop the technology, launch a business,
    and work to realize their dreams. Usually there is a pushback, a signal of resistance:
    the technology is not ready; society is not ready; the legal system is not ready.
    Confusion reigns. In effect, the world tries to maintain its balance and diversity
    and insists on moving at its own pace. It may not be ready for the change. The
    dreams and experiments are the edge work by means of which the world tries out
    new things, learns from failures, and backs off to make adjustments and further
    preparations.


    # Local Dreaming, Global Effects


    The dreams behind the early efforts sketched above are similar to those presently
    evoked by the Internet. There are many visions of what the Net can become: a universal
    library where any book is available electronically and instantly to anyone anywhere;
    an online-community, where people can stay in touch with friends and neighbors
    around the world; an electronic democracy, where a vote or a poll on an important
    issue can be taken immediately; a digital shopping mall, where people can buy
    usual goods at great prices in specialized shops all over the world.


    Those dreams give us glimpses into possible new orders: worlds of greater connectivity,
    knowledge, and experience. But life is complicated; changes in technology lead
    to changes in society. Change is difficult, and rapid change is even more difficult.
    When something is new, we often do not understand the problems until we try to,
    experience the difficulties, and take time to reflect on them.


    As awareness of the Internet increases and we approach the new millennium, dreams
    of world connectivity are entering the public consciousness. We can see that some
    of these dreams make good sense. Other, still unrealized dreams may ultimately
    make perfect sense, but something is not yet ready for them.


    # Gore''s Highway and Clinton''s Ditch


    The probe-and-pushback pattern of collective edge behaviors that surround the
    introduction of a new technology is clearly reflected in the historical record.
    In hope and confusion, each new technology appears before it has'
