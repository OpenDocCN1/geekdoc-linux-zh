- pgno: 142
  md: '# Focusing the Light 125


    MUC evaluates empirical methods of extracting information from text. Such computer
    systems (or knowledge-based systems, as they are called) need to have encoded
    into them knowledge that enables them to perform the matches or, in the case of
    MUC, to extract information. This is precisely the kind of knowledge that would
    allow systems to work effectively in the critical region of the phase transition
    in the search process. Such knowledge is part of the critical leverage sensemaking
    systems need to cope with complexity and the sharp trade-off between precision
    and recall—feast or famine—that plagues information retrieval.


    The bad news, however, is that although encoding the potentially enormous amount
    of knowledge for any example is easy, this sort needed to inform the search process
    for arbitrary topics makes this massive task. The good news is when semantic-matching
    edges at least some of the pertinent articles on a given subject, the citations
    in the articles and in published indices can be used to locate related articles.
    Thus, given a starting point, related articles can be rounded up by following
    the citation links among the articles. The assumption that articles cite other
    works best for the scientific and scholarly literature is what happened to Joshua
    Lederberg when, months after he began searching for *Plasmodium* and *viruslike*.
    This netted a few articles, which then led to a treasure of other relevant articles.


    Could the viruslike or virus-like term have have been generated automatically
    by the retrieval-broadening process? There are many possible terms of similar
    meaning, including viroid, *quasi-virus*, *pseudo-virus*, *retrovirus*, *phage*,
    and bacteriophage. One search approach would treat generation and inclusion of
    these terms as domain-specific knowledge for broadening the retrieval; another
    would search the data base for terms that are variants of common roots. Both approaches
    have implications for system design. For example, proper use of such retrieval-broadening
    knowledge interacts with system elements using synonyms, the word stemming system,
    and other linguistic components of the matching software. Even if we solved the
    problem of how to generate a query using synonyms of *virus-like* as terms, we
    would find that including such terms in the search would intensify the precision
    by returning even more articles about secondary infections. In short, these approaches
    create a heightened need for semantic matching.'
