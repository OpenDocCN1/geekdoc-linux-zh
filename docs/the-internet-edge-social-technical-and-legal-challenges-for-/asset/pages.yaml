  md: '# Chapter 5


    A useful technological method of finding relevant articles in the information-soup
    of the Network is using the indexes and search services that retrieve documents
    according to the keywords they contain. Another response to the need to organize
    information on the web is the proliferation of pages listing links—sort of a “home
    brew” approach to particular topics. From a pragmatic perspective, these pages
    serve as fertile starting points for information foraging.


    # The Haystack Complexity Barrier


    When we want to describe something difficult to find, we often use the metaphorical
    expression “as hard to find a needle in a haystack.” To get a sense of scale,
    I wanted to know how difficult that task is. Specifically, I asked, does finding
    a needle in a haystack—or, more generally, finding all of an unknown number of
    needles in a haystack—compare quantitatively with finding a set of relevant pages
    of information on the Internet?


    There are many ways to search a haystack, and some of them provide analogies to
    our later discussion. One colleague suggested sly that finding a needle is easy
    if you walk in the haystack with bare feet. Others using magnets. If a haystack
    can be cut into parts, several searchers could use a divide-and-conquer strategy
    to search different substacks at the same time. In the simplest—and most arduous—approach,
    a person would pick up each piece of the haystack one at a time to see whether
    it is the needle or blade of hay.


    To answer the complexity question, I conducted a “field study” at the nearby Portola
    Feed Center. I assumed that in a haystack is packed about the same density as
    it is in a bale. To my simple observations, blades of hay in a bale are packed
    about ten the linear inch and the average of broken hay in a bale is about eight
    inches long. Thus, a hundreds of hay occupy a volume of about eight inches by
    a square inch and a cubic foot of hay contains about 21,600 blades. A cube-shaped
    haystack feet on a side would contain a little over twenty-million blades of hay.


    By comparison, the end of 1997, the Internet contained about a hundred million
    web pages. If checking a blade of hay is comparable to'
