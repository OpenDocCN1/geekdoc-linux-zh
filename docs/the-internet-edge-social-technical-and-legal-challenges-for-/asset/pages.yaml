  md: '# 246 Chapter 9


    level that discourages the development of alternatives. In extreme cases, the
    world becomes a single global digital pond with a single king frog ruling over
    it.


    Of course, wielding power creates its own edge and ours pushbacks. In the late
    1990s, the first skirmishes about the balance of power and software monopoly were
    still taking shape. As always, the outcomes reflecting competing values. On one
    side value an unregulated market and argue for strong "national companies" in
    the emerging information age. This side points to the resulting order in the marketplace
    and to the danger of chaos and confusion that could stem from having too many
    choices. On the other side are those who value competition and believe that no
    corporation ought to be more powerful than the U.S. Department of Justice. People
    on this side point to the solifying effects of a lack of choice and innovation
    in the marketplace.


    In the context of world history, another crucial question about the sources of
    power is "Who has the army?"Or as Hitler, "How many divisions have the pope?\
    That question is one of variants that lead to the related question, "Who has the
    power to collect taxes?" Traditional concerns at borders include not only taxation
    but also control over materials entering and leaving a country. In the late 1990s,
    governmental bodies in different places and at different levels have struggled
    with the porosity of "sense of place" on the Net. In 1998 the city of Tacoma,
    Washington, was in the news for passing (and then withdrawing) a tax on Internet
    service providers (ISPs) that serve customers in Tacoma. It soon became clear
    that the "city tax" could be applied to organizations around the world. If every
    city on the planet amassed a 6 percent tax, the ISPs would owe far more in taxes
    than they could ever earn.


    So can tax businesses on the Net? Some European countries have watched potentially
    taxable content providers simply move across national border or two to avoid taxes.
    From the perspective of an Internet consumer, it does not matter where a site
    is actually located. It is still only a click away.


    The issue of content control has also loomed. Many parents have been concerned
    about the material their children could access on the Net. In 1996, Singapore
    grappled with this issue by passing regulations characterized by the press as
    intended to keep "its patch of cyberspace free of pornog-'
