  md: '# xvi Introduction


    available information about the artists and other recordings of the same pieces.
    You can choose to buy a copy of the music (for, say, $10); add it to the repertoire
    of your entertainment system and pay a small fee (say, a quarter) each time you
    play the music; or purchase to unlimited pays for a year (for, say, $5). Given
    a system of networked appliances and a user design in which convenience, you don''t
    need to go to the store or even remember the name of the musician or tune. You
    simply apply your degree of interest in the music.


    +   * **Music Club.** In a variant of the first scenario, when you purchase some
    music you are invited to join an “album of the club” your home entertainment system
    keeps a profile of your musical tastes; every month you will get an opportunity
    to listen to and purchase at a discount price among the hundreds or so new albums
    fit your profile. Once again, the operating principle is convenience rules. You
    don''t have to shop, you are kept abreast of new music in your area of interest,
    and you receive a discount through the club. The publishers win, because they
    can rely on fairly level sales from their customer base. In the broader world
    of publishing, a publisher that develops a business based on subscription sales
    generally sticks with because it yields a stable, predictable cash flow.


    +   * **Personalized Radio.** Imagine that you are listening to a radio station
    in your car or at home. This radio station, however, is specialized to your tastes.
    It carries the news programs you find most interesting, plays the music you like
    best, and—most importantly from the perspective of the provider—carries advertisements
    specifically targeted to your taste and buying habits. (See chapter 2, “The Portable
    Network,” for a variant on this idea for reading digital works by means of sponsored
    browsers). Technologically, there are many ways to achieve individualized radio.
    At home, the “radio” channel may be delivered via the Net on optic cable. Your
    home entertainment system may preload music onto your car entertainment system.
    Or it may be programmed to play between news broadcasts. You do not have to pay
    for either the music or the news as the advertisers pay royalties in exchange
    for the time you spend listening to personalized advertisements. (See chapter
    8, “The Digital Keyhole,” for a discussion of related privacy issues on the Net)


    At the time of writing, systems to completely support these scenarios are not
    available. However, all of the elements for creating them are understood and,
    given relatively minor extensions of existing technologies, they are quite possible.
    They represent ways of distributing digital music that are different from the
    current music business but within the foreseeable'
