    When trusted systems connect with each other, they go through a registration process
    by which they identify themselves to each other and establish their bonafides.
    Once they are connected, they put each other through a series of tests—a challenge-response
    protocol—intended to weed out impostors and protect the entrusted. When registration
    succeeds, they establish a trusted session using encrypted communications.


    # Behavioral Integrity


    How do we know that trusted systems will operate properly—even if they have not
    been physically compromised and can communicate securely and prove their identity?
    For the most part, the behavioral integrity of computers is determined by their
    programming. There are no fail-safe ways of writing general programs that guarantee
    correct behavior. They are, however, a number of ways of reducing the risks of
    error in sensitive operations: for example, by designing systems modularly—so
    that all critical operations take place in a small part of a program—or by defining
    system functionality—allowing certain operations to be carried out only under
    restricted conditions. In addition, designers can build into other parts of the
    system checks and balances that log sensitive operations and even prevent them
    from being carried out. Finally, there are ways of writing programs that check
    other programs before they run, ensuring that certain properties are intact under
    all possible operating conditions.


    All of these approaches have blindspots and shortcomings. A rogue programmer can
    violate modularity rules with hidden code, or violate security layers with trap
    doors. Checks and balances can be compromised by hiding transactions. Rogue compilers
    insert statements into a program that a proof checker (or even a clever programmer)
    will never see. Furthermore, when the specifications for ensuring a program’s
    correctness become as complex as the program itself, it becomes very difficult
    to have high confidence in the specifications themselves. In the end, our trust
    in a program is based on the capabilities, methods, and reputation of the organizations
    that certify programs.


    In an ideal model, the operations carried out by programs could be securely isolated.
    For example, a screen saver program could not interrupt an electronic-commerce
    application to steal data or fake an authorized transaction. Similarly, a word-processing
    program could not, under the'
