    # Descartes and Huygens


    In the absence of emotion and feeling, rationality breaks down.

    Antonio Damasio, Descartes'' Error


    The idea that science and technology brought an end to the enchanted world is
    often linked with René Descartes, the noted French philosopher and mathematician.
    Among others, Descartes argued that the sciences—by the seventeenth century all
    knowledge—should be founded on certainty. There was considerable risk for this
    position. In 1633, Descartes suppressed publication of his work The World when
    he heard of Galileo''s condemnation by the Inquisition for publishing similar
    ideas. Such misuse of power undermined the moral authority of the Church and contributed
    to the rise of scientific thought as an alternative, and less political, source
    of truth.


    The rise of science also fostered a new attitude towards the universe, making
    it seem deterministic, a product of natural laws—essentially a machine. By framing
    the universe as fundamentally knowable, Descartes''s science challenged its essential
    mystery and encouraged scientists to discover its laws. Simultaneously, it disputed
    the privileged position of the clergy (or anyone else) in the search for knowledge.


    Another scientist, Christian Huygens, also contributed to the new view of the
    nature of the universe. Although he is most famous for grinding lenses, for his
    wave theory of light, and for his discovery of Saturn''s rings, he was the inventor
    of the pendulum clock. Clocks not only changed the way people regulated their
    days, they also became the people encountered frequently during their lives. If
    the new worldview saw the universe as mechanized, clocks influenced this perception
    by providing a common example of the systematic and mindless nature of machines.
    As the universe was secularized, less room was left for God, mystery, or magic
    in everyday life.'
