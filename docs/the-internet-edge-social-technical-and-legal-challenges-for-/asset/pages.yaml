- pgno: 265
  md: '# Public Access to the Net


    We tend to overlay deep social problems with technical systems. We have these
    deep social chasms within. One way in which they manifest themselves is with technical
    literacy. But technical literacy is not the cause of the social chasm. I think
    there is a lot of wind around providing access, but unless you address the problem,
    I don''t know that installing free computers in the local libraries will change.


    Jeff Crigler, 1997


    We want to avoid creating a society of information “haves” and “have not.”...
    The most important step we can take is to ensure universal service is adopt policies
    that result in lower prices for everyone., . But we''ll still need a regulatory
    safety net to make sure everyone can benefit.


    Vice President Gore, National Press Club, December 21, 1993


    For several years the city of Palo Alto provided two computer terminals at City
    Hall, where anyone could walk in and access the Net. The idea was to foster Net
    literacy and to reflect the social consciousness of the community. In mid–1998,
    however, officials removed the terminals, apparently under pressure from local
    businesses concerned about the impression homeless people using the terminals
    were making on other visitors. They sent the terminals to the public libraries.
    At first thought, it might seem that placing them at libraries, places we go to
    look up information, made sense. For homeless users, however, having the terminals
    raised problems. For one, the libraries in Palo Alto are some distance from the
    business district where homeless people tend to congregate. Moreover, at the libraries
    access to the terminals could be subject to the same requirement that governs
    checking out books—possession of a library card based on a Palo Alto address.
    Homeless people, of course, do not have addresses. This story illustrates some
    of the questions surrounding free access at the Internet edge.


    But the practical aspects of public access to information and participation involve
    more than physical location. They can include, for example, ensuring that work
    stations are easy to use, that access is affordable, and that a useful set of
    information resources is available on-line. Or should we characterize the access
    question solely in terms of the Net as an information source. Real public access
    would include participation in all the services and entertainment the Net offers—including
    e-mail and on-line'
