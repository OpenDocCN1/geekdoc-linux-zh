  md: 'a system to self-destruct when it detects a threat, perhaps setting off alarms
    and telephoning for help.


    Computer peripheral component interface (PCI) cards are devices roughly the size
    of a small paperback book that are used by plugging them into a computer. Using
    trusted systems allows PCI cards to hold central and sensitive data in financial
    services—for example, passwords, keys for authorizations, and possibly secret
    algorithms. To preclude unauthorized electronic probing of information stored
    on the PCI card, designers cover it in a material that has several layers of nanowire.
    To read the signals in the card''s sensitive circuits, an attacker must first
    penetrate the cover material. Drilling a hole to gain access to the circuits is
    likely to break one of the wires, which would be sensed by the circuits and trigger
    a signal to erase sensitive data. This design feature is a first layer of defense
    against a physical attack.


    The arms race in designing secure circuits is like a spy story or a master-level
    game, with systems within systems and feats within. One line of attack takes advantage
    of the physical properties of computer memories, which are susceptible to low
    temperatures. If memory circuits are chilled to low enough, they are unable to
    change state; they cannot, respond to a signal to erase their contents. Knowing
    this, attackers can first chill the card, then drill into it, and even, remove
    its components, confident that the system will be unable to erase its secret information.
    Before the card warms up, they can disconnect all the defense mechanisms, enabling
    them to read the data at leisure. A defense against this attack is to put thermal
    sensors on the card to signal an attack when the temperature drops. There are
    many other possible measures and countermeasures for designing trusted systems.
    The interplay between “attacks” and “countermeasures” makes the term *arms race*
    an appropriate metaphor for the design of trusted systems.


    As trusted systems are elaborated, handling and shipping them can also become
    more difficult. Elaine Palmer of IBM tells a story about some PCI cards built
    by IBM for bank computers. A shipment of cards was bound for a bank in Moscow.
    The bank had already closed when the truck carrying the shipment arrived late
    in the afternoon. The truck had to be parked outside overnight in the cold Moscow
    winter. As the temperature fell, the cards’ thermal sensors signaled “thermal
    attack.” The operational information was erased before the cards could be installed.'
