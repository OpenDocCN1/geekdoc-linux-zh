    continued to improve, designing an expert system is quite different from writing
    a book. In writing a book, an author needs to get the ideas together and write
    them down clearly. Sometimes connecting ideas will be missing or out of order
    or slightly wrong. But authors depend on the intelligence and knowledge of their
    readers to understand and integrate what they read. Not so with computers and
    expert systems. Today''s computers are less sophisticated than humans and, probably
