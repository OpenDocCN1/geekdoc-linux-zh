- pgno: 28
  md: '# The Internet Edge


    # The Change Amplifier


    Nothing changes alone. When something changes, other things are affected. When
    a company opens in a town, new businesses and new jobs are created. Houses get
    built. Stores are expanded. New people meet each other. In ways that no one can
    predict, kids become friends with kids from other places and lives move in new
    directions. These changes are part of the town evolves and adjusts to new situations.
    If a company closes down, the opposite effects may occur. Jobs are lost. The chain
    of causes and effects may lead back to company leaders at a corporate office far
    away or to a slight change in the price of a material in a distant part of the
    world.


    The effects are not always predictable. Change brings chaos. A small change can
    trigger unexpectedly large changes in lives removed from the point of decision.
    From a philosophical point of view, everything is impermanent and change never
    stops. Things are always changing in a cycle that breeds further changes. There
    is always chaos somewhere. Nonetheless, some endure through periods of change
    long enough to let us become accustomed to stable conditions. We notice when there
    are big changes.


    The Internet amplifies change. With all earlier connection technologies, it does
    so by reducing the power of distance. People say that the world is shrinking.
    Of course, the planet hasn''t changed in size, and great distances can still limit
    the pace of change. For the most part, it is still true that the farther apart
    things are the less they interact. In basic physics the law of gravity says that
    the gravitational attraction between two objects decreases with the square of
    their distance from each other. Something analogous can be of social processes.
    In an office building, one of the major factors governing how often people talk
    to each other is how far apart their offices are. The perceived “costs” of walking
    to someone''s office goes up with its distance from ours. We recognize intuitively
    that a work group is more effective when its members'' offices are close together.


    Distance in these examples is not simply straight-line or Euclidean distance.
    When people have to go up or down stairs—working against gravity—to talk to each
    other, the actual reduction in interactions is even greater than when their offices
    are at more distant points on the same floor. When there are walls, locked doors,
    or other barriers in the way,'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'the effort required to get together becomes part of the perceived “cost” of
    the interaction.


    The Internet lowers such costs; it doesn’t eliminate them, but it does foster
    more action at a distance, so that something happening over here can have an effect
    over there. The fan-out of the Net can cause multiple changes at many distant
    locations. And, because each change triggers further changes, the pace of change
    accelerates and the potential for chaos increases.

    The ability of the Internet to cause action at a distance is akin to that of other
    communication technologies—including smoke signals, drum talk, newspapers, radio,
    television, and the telephone. It enormously magnifies the most powerful feature
    of technologies like radio and television: wide dissemination of information.
    Its enormous fan-out allows an idea or an action initiated at one location to
    be sent instantaneously to thousands or millions of other sites. In addition,
    like the telephone, the Internet is interactive. Some have described Internet
    technology in terms of “push and pull.” Imagine a playground full of kids playing
    tug-of-war with long ropes, pushing and pulling, yanking and shoving, creating
    interaction at a distance.


    # Barriers and Change


    Barriers protect us from too much outside influence. Fences are barriers. Locked
    doors are barriers. Walls are barriers. “Good fences make good neighbors,” the
    comment attributed to his neighbor in Robert Frost’s poem Mending Wall, reflects
    our perception that barriers contain or reduce interactions and guard against
    friction.

    In nature, rivers and mountains can act as barriers to the migration of animal
    and plant species. Great distances, as as the distance across the great Australian
    desert, act as similar barriers and play an important part in creating and preserving
    biological diversity. Separated by a barrier, populations of life forms stop interaction.
    The populations on each side become subject to different evolutionary pressures.
    Chance mutations, which in the right conditions may become established in the
    gene pool on one side of the barrier, may not occur on the other side. Over time,
    populations of related life forms that were initially a single population develop
    distinctly dif'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# The Internet Edge 13


    ferent gene pools. When they become so different that they can no longer interbreed,
    they are classified as different species.


    An analogous mechanism involving the separation of populations and independent
    evolution can help explain the diversity of human cultures and languages. Groups
    of people move away from each other, and over time their language patterns diverge.
    After a little drift, they speak different dialects. The French spoken in Montreal
    is not the French spoken in Paris; the English spoken in Australia is not the
    English spoken in England or the United States. The separation lasts long enough
    and interactions between the populations are few, distinctly different languages
    evolve. On the other hand, a contrasting effect can be heard in the French spoken
    in Toronto, which is said to be essentially “Parisian”—because it is constantly
    refreshed by education and new immigration from France.


    For many countries, national borders still cultural and linguistic barriers, reducing
    outside influences and inhibiting interactions. Similarly, countries raise or
    lower tariffs on trade, they are trying to control the rate of economic influence
    from abroad. High tariffs, referred to as “trade barriers,” shelter local interests
    from outside forces that could bring about change.


    It is said that national borders are “speed bumps on the information superhighway.
    The comment reflects our realization that in the 1990s and beyond the Internet
    connects computers on either side of a national border with the same ease as it
    connects computers in the same city. Information packets, e-mail, and digital
    money zip across borders without going through customs, export control officers,
    or any entity that reflects national economic interests. As the effects of borders
    are reduced, a country’s cultural life is equally subject to influence by actions
    taken elsewhere in the world.


    # Barriers in Cyberspace


    From the foregoing discussion, we might suppose that because the Internet easily
    crosses physical borders, there are no barriers within cyberspace. That is not
    the case at all.


    Consider an on-line chat room. People in different parts of the country or world
    can log on to an on-line service provider and search through the topics or discussion
    groups active at a given time. They select a group, and'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 14 Chapter 1


    their computer connects them to the ongoing discussion. The chat room creates
    a sense of place because all the people “in” the chat room can communicate with
    each other in real time, no matter they happen to be physically. A conversation
    in a chat room is akin to a meeting in a real conference room that is separate
    from other rooms in an office building.


    Physical distance is irrelevant to chat rooms. People thousands of miles apart
    interact in a chat room as a closed group, while two people seated in the same
    physical room may be participating in completely different chat rooms. Yet, if
    we consider the memory cells of the server’s computer as the two people send and
    receive messages in their respective chat rooms, one room is probably less than
    a centimeter away from the other, perhaps on a different portion of the same chip.
    The barrier that keeps conversations in different chat rooms separate is determined
    by programming rather than physical distance.


    Chat rooms are not the only Internet phenomenon in which barriers are deliberately
    created. In an effort to keep their private networks (intranets) safe from intruders,
    many organizations use so-called firewalls—programmed gateways that monitor and
    control traffic between two networks. Depending on their programming, the gateways
    allow some kinds of packets through block others.


    There can be barriers to objects that move freely around on the Net. For one example,
    approach to protecting digital documents is to put them in encrypted “digital
    envelopes.” Such envelopes are designed to allow access only to parties or systems
    that possess appropriate digital authorizations and decryption keys. This is analogous
    to passing things around the real world in locked boxes. The boxes are portable,
    and only people with keys can look inside.


    Thus barriers within cyberspace—separate chat rooms, intranet gateways, digital
    envelopes, and other systems to limit access—resemble the effects of national
    borders, physical boundaries, and distance. Programming determines which people
    can access which digital objects and which digital objects can interact with other
    digital objects. How such programming regulates human interactions—and this change—depends
    on the choices made. In the late 1990s, these choices are mostly in the hands
    of such relatively ad hoc technical bodies as the IETF (Internet Engineering Task
    Force). I am not suggesting that such groups are exercising that power'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# The Internet Edge


    improperly but, rather, that as the Net increases in its ability to affect action
    at a distance—especially economic action—political interests are likely to seek
    influence over those choices.


    # Reflections


    Working between the interplay of change and pushback at the Internet edge are
    the people and organizations directly concerned with the development and deployment
    of technology. Engagement at this hot point of change tends to foster a perspective
    shaped mainly by the need to solve economic and technical problems. At the Bandwidth
    Forum sponsored by the Federal Communications Commission (FCC) in January 1997,
    Stagg Newman of Bellcore addressed the question of the design of the National
    Information Infrastructure (NII) in these terms: “In the early 1990s were lots
    of debate over what the NII should be . . I think the Internet has answered for
    us. NII will be IP (Internet Protocol). . . And the key to really unleash the
    potential is having a broad band” (Newman 1997).


    Newman''s comment reflects his reputation as a talented technologist at a major
    communications company. His reference to “what the NII should be” is intriguing,
    however, because it is a question that could be answered at several levels. Newman,
    however, does not risk becoming in metaphor; he focuses on technology. For him,
    the NII is defined by the IP layer—that is, the protocol originally developed
    by Robert Kahn and Vincent Cert for the packet-switched ARPANet and now used throughout
    the Internet. It is the key to creating a whole gamut of digital services; everything
    important from a technological perspective can be built on top of that. What matters
    in realizing the Net''s potential, Newman argues, is providing adequate bandwidth.
    He then goes on to consider various options for achieving efficient digital communications.


    In several technologically advanced nations—including the United States, Japan,
    and a few others—engineers are working to lower the costs of digital networking,
    systems, and services. Companies are scrambling for specialists in different areas
    set solving a cluster of technical problems involving bandwidth, wiring, encryption,
    displays, electronic commerce, batteries, and other system components. As costs
    drop and bugs are worked out, the technology that started in a few technologically'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Chapter 1


    advanced countries is spreading over the world. Simply put, technology drives
    change. The world is going digital. It is at the tip of a wedge of great change.


    But there is another way of looking at “what the NII should be.” Culture and dreams
    shape the conscious and unconscious view of economics, and this drives the development
    of technology. Simply put, culture and dreams drive technology. They also shape
    the pushback from the Internet edge.


    Although the Net has already spread to many parts of the world, it is evolving
    rapidly in the United States, where almost all sectors of society are responding
    to its influence. That response makes the U.S. a good place to sample the global
    Net of the future and to consider issues that go beyond economics and technology.
    This is not to say that what works in the United States will work everywhere in
    the world; nor that systems and technologies developed elsewhere will not affect
    U.S. users. The point is that the levels of development and evolution now seem
    highest in the United States.


    The journey we are all on involves uncertainty, prediction, and choice. While
    the Internet is being created we live in the chaos at the Internet edge, where
    the technological and economics perspectives are not the only ones that matter.
    We experience the tension between local and global values as the world becomes
    more connected. We dream; we design; we build or participate; we see effects;
    we reflect; we make choices; we repeat. We are living the dream at the edge of
    transformation.'
  merge: -1
  img_proc: true
