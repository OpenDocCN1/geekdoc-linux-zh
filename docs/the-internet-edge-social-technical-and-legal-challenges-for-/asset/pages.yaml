    # In the Image of Magic


    The ancient and modern magical technologies described in this chapter provide
    us with several clues to the underlying dreams and issues we face at the Internet
    edge. Wearable computers, the magical clothing of folk tales, are intended to
    protect us from the harshness of the environment and to give us new powers, making
    us invulnerable to discomfort and inconvenience. Automated homes equipped with
    magical appliances are like the enchanted castle—instead of equipping us to live
    in a harsh environment—changes the environment. Even automatic manufacturing systems,
    like Aladdin''s genie, provide whatever we wish for.


    The darker side of magic revealed in cautionary tales is also instructive. Magical
    technologies—like Tolkien''s rings or the red shoes—can have a will of their own.
    We could become too dependent on them and find to horror that the enchanted castle
    has become the haunted house. The robots of automated manufacturing could get
    out of control, producing gremlins or run amok and burying us with things we don''t
    need. We need the magic to control its environment; yet we fear that the magic
    will turn against us, bend us to its will, and diminish ourselves and our world.
    Even cars, the technological analogues of magic carpets, generate pollution as
    a by-product.


    These images—both dreams and nightmares—are about power and control. All three
    technological versions of magic—the smart house, smart clothes, and smart manufacturing—emphasize
    our *separateness* from an environment perceived as inhospitable. Automated houses
    change the environment locally; because we can''t change the environment everywhere,
    we'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Indistinguishable from Magic 281


    wear smart clothes to give us portable protection; the natural environment does
    not provide us everything we think we need, so we use smart manufacturing to create
    it.


    The danger is that the feelings of separateness from the environment induced by
    too much automation may foster a lack of care and respect for the earth. Our efforts
    to control the environment—to bend it to human will—can recur and ultimately bring
    harm to ourselves.


    We do not need to focus on wearable and networked computers to see the effects
    of mistreating the natural world. The early twentieth century environmental movement
    has sought to bring attention to the results of clearing forests, overreuse of
    pesticides, casual dumping of toxins, and overfishing our seas and rivers. A recurring
    effort of the movement has been raising the collective consciousness of the stakeholders.
    To naive consumers, food comes from grocery stores and restaurants. They pay money
    and get food; anything upstream of the point of purchase is out of sight and out
    of mind. From a producer''s point of view farming, cattle rearing, and fishing
    practices are dictated solely by a need to be competitive and meet the consumer''s
    desire for the least-expensive product. The problem with this perspective is that
    people are not just consumers and producers of food products. They are also breathers
    of air, drinkers of water, and beings who are themselves part of the environment.
    When the economic values of consumption dominate other values, the environment
    can be pushed seriously out of balance. The “unconscious machines” in this situation
    are not computers running amok but the aggregate effects of a society unconsciously
    acting contrary to its best interests.


    Thus, the stories of magic and the Internet edge reveal a larger story about the
    exercise of power and unconscious action. An underlying conflict of values—between
    dominating and controlling the environment and caring for it—are at the center
    of most environmental and technological controversies.


    A helpful insight from modern psychology—the concept of projection—can explain
    the unconscious attribution of hidden personal qualities to other people and things.
    We can see unconscious projections in our stories more clearly by mentally changing
    place with our machines and our environments. Are the stories about controlling
    nature or controlling'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Chapter 10


    ourselves? Do we need to tame the environment or tame our unconscious desire to
    control it? Is Nature out of control and threatening to harm us, or are we out
    of control and threatening nature? Are the magical machines acting mindlessly,
    or are we? The point of these questions is not to assign credit or blame, or even
    to find a single answer. Rather, it is to make us conscious of projections we
    may be unaware of.


    Flight from technology and the return to nature is a classic utopian theme. In
    various ways, the utopian literature—and many of us personally—is asking “What
    is missing and what are we trying to achieve?” Perhaps we need to find a way to
    reframe our understanding of what is missing. We may discover that “it” is not
    “out there” in the world but, rather, is something inside ourselves and in the
    world we create. As the Internet edge about magic and machines reflects a deeper
    issue of power and control, it gives us an opportunity to consider carefully what
    we are creating. In shaping the Net, our computers, and our environment, we are
    also ourselves.


    There are always tensions and confusions at an edge. Moving through an edge requires
    us to synthesize a course of action from the opposites in tension. We can consider
    not only what opportunities the Net offers for taking care of us but what it offers
    for taking care of the earth. What are the opportunities for bringing thoughtfulness
    and mindfulness to our machines as well as to ourselves?


    # Technology and Mindfulness


    One of the elders asked, “Where do these white people run to every morning?”

    “To their workplaces, of course.”

    “Why do they have to run to something that is not running away from them?”

    “They do not have time.” I had to say this word in French because there is no
    equivalent in the local language. The conversation came to a halt when the elder
    had to ask what this “time” was.


    Malidoma Somé, Ritual: Power, Healing, and Community


    When the elder asked where the people were running to, he was indirectly pointing
    out that moving quickly can also serve as a distraction. When things move too
    fast, we have difficulty paying attention to them. When we slow down, we discover
    things we would otherwise not see. Slowing down'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Indistinguishable from Magic 283


    gives us the time to focus, withdrawing our minds from some things in order to
    pay attention to others.


    David Levy, a computer scientist and teacher of mindfulness, believes that American
    middle-class culture (and perhaps other cultures as well) is characterized by
    increasing levels of fragmentation: “Being too busy is one of the most common
    complaints of our times. . . There is a sense of being fractured, incomplete,
    less than whole” (Levy 1997). Levy credits James Beniger’s book *The Control Revolution*
    (1989) with providing insights into the speedup he sees as the cause of fragmentation.
    Beniger’s historical account begins with the invention of steam power in the late-eighteenth
    century, steam powered railroads, ocean-going vessels, and many manufacturing
    plants, increasing the rate at which raw materials could be gathered and consumed.
    As organizations became bigger, faster, and more widely distributed, systematic
    management methods were introduced to extend centralized control. Large organizations
    required new information technologies to manage the increasingly complex processes
    of production and distribution. According to Beniger, the new economic era produce
    goods faster than people could consume them; modern advertising methods were invented
    to create new needs and promote higher consumption. In this way, steam power,
    information management, and advertising joined together to accelerate the pace
    of modern life—perhaps leading Some’s elder to older where everyone is running.


    Although Beniger’s account somewhat oversimplifies the history of the modern era,
    the safeguards built into the SkyTel system failed to cope well enough to prevent
    bephysema and the risks associated with fan-out. This episode, and more generally,
    the evolution of beepers and cell telephones during the late 1990s, illuminates
    a fundamental tension in modern living: balancing our need for accessibility with
    the desire for uninterrupted personal time.


    Connection technologies are not static, however; beepers and cell phones are continuing
    to evolve to fit into our lives better. The second generation of beepers features
    quiet vibrational signals, so that annoying beeps do not disturb everyone near
    users. Phone controllers can be programmed with caller-identification signals
    and passwords to screen calls. Even without'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 284  Chapter 10


    such technological innovations, we can mediate the relative priorities of being
    accessible and alone by simply turning off the cell phone and letting our calls
    be transferred to voice mail.


    The edge work related to wearable computers is just beginning to unfold. In principle,
    wearable computers can put us in touch with information and regions that are far
    from our visible environment. At the same time, they can isolate us and distract
    our attention from crucial parts of our immediate environment. Which is the greater
    benefit? Which the greater? The isolation that leads to a sense of personal separateness
    or the telepresence that can foster a sense of social connection? The distraction
    that leads to fragmentation of our consciousness or timely information that brings
    us information in context when we need it? The answers may lie in the skill we
    and others bring to designing such technologies and the wisdom we apply to deciding
    when to use them.


    From a perspective of environmental consciousness, the Net may even provide an
    antidote to unconscious action at a distance. When a baby moves its hand and sees
    its hand moving, it develops a sense of self that identifies the hand as part
    of “self” and identifies a toy, for example, as a part of “not-self.” By analogy,
    if we could readily see or feel the consequences of our actions on the environment,
    we might feel less isolated and separate from it. If the Net could read us and
    immediately the effects of our choices, even at a distance, it might counteract
    the illusion that what we do is not important in the long run.


    The senses and nervous systems of our bodies tell us when we touch something hot,
    warming before we hurt ourselves. At the end of the nineteenth century, Nathaniel
    Hawthorne likened the telegraph to the new “electronic nervous system” of the
    planet. The Internet is potentially a much more powerful instrument than the telegraph
    for providing sensory information from a distance and effectively remote feedback
    and action. It is not to say that simply having communications technology will,
    by itself, lead to solutions for environmental problems. After all, we already
    have phones, magazines, newspapers, televisions, fax machines, and the post office.
    Oil spills notwithstanding, major environmental disasters develop overnight. The
    challenge we face is to find ways to use our communication and information capabilities
    to take more direct responsibility for noticing and regulating the effects of
    our actions on the world and'
  merge: -1
  img_proc: true
- pgno: 302
  md: In his famous silent movie Modern Times, Charlie Chaplin struggles against the
    machinery of a manufacturing plant. The machinery and the society around it are
    racing forward mindlessly, perhaps, eventually, to spin out of control. The opportunity
    for us, in creating the Net, is to build a technology that gives us the space
    not only to move quickly but also to notice where we are, to harness natural energies
    but also to do so with care and deliberation. Ultimately, the choices are ours.
    What will survive into the next generation depends on what we value. Rather than
    letting technology lead to the fragmentation of our lives and consciousness, we
    have to rise to the challenge of wholeness to make choices that enhance our whole
    human development.
  merge: -1
  img_proc: true
