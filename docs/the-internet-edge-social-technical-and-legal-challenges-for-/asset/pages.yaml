    In Detective stories and politics, a crucial question in looking for sources of
    power is “Where is the money?” According to this measure of power, neither the
    Internet Society nor the W3C ranks particularly high on its own. Nonetheless,
    both organizations—through the leverage power of their memberships—are very influential.
    The many large corporations that are W3C members have the ability to allocate
    significant resources to solving technical problems—developing and promoting and
    profits from them they succeed. From a corporate perspective, standards org-anizations
    (including the working bodies of the W3C, IETF, and the International Standards
    Organization) are relatively neutral forums for coordinating activities in the
    marketplace. Sometimes these working groups develop or promote a standard before
    there is demand for it the market-place. TCP/IP, HTTP, and HTML all preceded—and
    in fact enabled—evolution of the Net before commercial organizations became involved.
    In other cases, commercial organizations develop a tech-nology and then bring
    it to standards bodies with a view toward promot-ing it as a standard. Examples
    in this include formats for pictures, audio, and video. In other cases, a company
    with sufficient market clout may try to establish its technology as a standard
    without the time-consuming standards processes. One might argue that the digital
    formats of Microsoft Word, Powerpoint, and Adobe PDF became de facto (and pri-vate
    controlled) standard formats for documents in this way.


    Economic laws in the area of digital goods seems to operate differently than traditional
    laws governing commerce in hard goods. One diff-ference is the so-called law of
    increasing returns, a phenomenon easily observed in the software industry, where
    manufacturing costs are so low. Arguably, this leads to a winner-take-all marketplace
    where the market leader (generally Microsoft) banishes competition. When the whole
    market goes in one direction, it is very difficult for competitors to gain a foothold
    and compete effectively. Purchasers face buying decisions on a playing field that
    has become tilted, and where the tilt is maintained at a'
