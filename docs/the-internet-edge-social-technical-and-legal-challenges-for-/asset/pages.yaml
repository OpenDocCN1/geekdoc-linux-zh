  img_proc: true
- pgno: 108
  md: '# The Bit and the Pendulum 91


    # Contract Law and Digital Contracts


    In many ways, the terms and conditions specified in DPRL are similar to a contract
    or license agreement for using a digital work. However, although for convenience
    we refer to such set of terms and conditions as a digital contract, it differs
    from an ordinary contract in crucial ways. Notably, in an ordinary contract, compliance
    is not automatic; it is the responsibility of the agreeing parties. There may
    be provisions for monitoring and checking compliance, but the actual responsibility
    for acting in accordance with the terms falls on the parties. In addition, enforcement
    of the contract is ultimately the province of the courts. In contrast, with trusted
    systems, a substantial part of the enforcement of a digital contract is carried
    out by the trusted system. In the short term at least, the consumer does not have
    the option of disregarding a digital contract by, for example making unauthorized
    copies of a work. A trusted system refuses to exercise a right that is not sanctioned
    by the digital contract. Over the longer term, consumers or consumer advocacy
    groups may negotiate with publishers to obtain different terms and conditions;
    but even then, the new digital contract will be subject to automatic enforcement
    by trusted systems.


    Contract law is a complex subject that we cannot summarize here in any detail.
    Even so, we need to point out a few of the basic provisions of contract law as
    they relate to stakeholder interests and the design of trusted systems. First,
    however, we should note that at the time of this writing, there is an ongoing,
    controversial effort to add new provisions concerning “licenses of information
    and software contracts” to the Uniform Commercial Code, the body of statutory
    law that governs commercial contracts in most U.S. states. If the proposed provisions
    are adopted into law, they could have significant implications for digital publishing
    in general and for trusted systems in particular.


    Contracts are agreements entered into by two or more parties. In a typical case,
    the parties negotiate and come to an agreement on the terms and conditions under
    each party provides something of economic value to the other. This bargain for
    the mutual exchange of value is an important part of what makes an agreement a
    contract. Typically, a contract includes one or more promises backed by what are
    legally referred to as “valid considerations.” The terms of the contract are usually
    set out in a written'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 92 Chapter 4


    document, and the parties formalize their agreement with the terms by signing
    and dating the document. In cases warranting extra care, the parties'' may also
    be witnessed by a registered third party (a notary public), who asks the parties
    for proof of identity and may even take thumb prints or require other forms of
    personal identification.


    A contract is backed by the force of law. Generally, if one party fails to comply
    with the agreed-upon terms and conditions, the other party or parties can enforce
    the contract through the courts. However, there are various circumstances under
    which the terms and conditions of a contract are not legally enforceable. They
    are preempted, for example, by the provisions of the U.S. Constitution and certain
    statutory laws. The copyright law contains a preemption provision (section 301
    of the 1976 Copyright Act) that may, in some cases, render a contract unenforceable.
    The courts have also developed doctrines that hold contractual provisions to be
    unfair or improper (e.g., on the grounds of fraud, illegality, breaches of public
    policy, etc.) and thus unenforceable.


    Here is one example of an unenforceable contract. It is not unusual for landlords
    to enforce standard rental agreements considering several pages of formal legalese.
    Suppose that a tenant signs a document without noticing a clause in small print
    saying that if he eats mushrooms on Tuesdays he must pay an additional thousand
    dollars in rent. The landlord throws a party on the next Tuesday and slylyfeast
    the tenant mushrooms. Since such a clause is outside the normal scope of what
    belongs in a rental agreement, the courts would very likely refuse to uphold it.
    The courts provide checks and balances in contract law by deciding what contracts
    to enforce and how to interpret the terms and conditions of those contracts.


    # Checks and Balances in a Trusted System


    With properly designed trusted systems, many of these same checks and balances
    can be available automatically. Consider, again, the case of the author who has
    finished a work and gives it to a digital publisher, who assigns it a set of terms
    and conditions. Like the conventional language used in legal contracts (so-called
    “boilerplate”), digital boilerplate in the form of templates and default conditions
    can be used to set up a digital contract.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# The Bit and the Pendulum 93


    Suppose, then, that the publisher has included some very unusual terms and conditions
    in the agreement. When the consumer''s trusted system is connected to the publisher''s
    trusted system, it first retrieves the terms and conditions of the digital contract
    and shows them to the consumer. Before the consumer accepts the digital work,
    his or her system can use a program (“contract checker”) to check for and highlight
    any unusual conditions in the contract (e.g., high fees for unrealistic expiration
    dates, or other uncommon requirements). Because rights-management languages like
    DPRL are formal languages of limited complexity, simple grammar, and predetermined
    metrics, such a check is a straightforward matter for a computer. (As a somewhat
    bizarre example, consider a contract specifying that the consumer can copy a digital
    work for free, but surprisingly—and inconveniently—pay ten dollars to delete it.)
    Before taking delivery of a work on a trusted system, consumers have the opportunity
    to agree to the terms and accept delivery of the work or to refuse and not receive
    it. If a consumer agrees, or if his trusted system digitally sign an acceptance
    form, which can be digitally notarized by a third party (“digital notary”) to
    both parties.


    The sequence of events in this example illustrates several checks and balances
    in the process. Both the publisher and the consumer can use tools to check the
    normalcy and appropriateness of the contract. More than a labor-saving or time-saving
    procedure, this approach is also a compensation for the intangible nature of information
    inside computers. It increases the confidence of both parties that the terms and
    conditions used by the trusted systems are reasonable.


    # One Digital Contract = Several Legal Contracts


    It is helpful to think of a digital contract not as one contract but as combination
    of several distinct legal contracts. There is the contract for access to the copyrighted
    work itself, and a second one for delivering the digital data, irrespective of
    whether the data are be copyrighted. If, for example, publishers use a trusted
    system to provide an uncopyrightable database (ProCD v. Zeidenberg) or a telephone
    white pages directory (Feist v. Rural Telephone 1991), they are entitled to charge
    for this service, even though the consumer could, in principle, the uncopyrightable
    data'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 94 Chapter 4


    elsewhere or put together his or her own database. Similarly, digital publishers,
    like paper publishers, could charge the consumer for delivering a copy of the
    complete works of Shakespeare, even though they are in the public domain. Like
    print publishers, digital publishers make life more convenient for the consumer,
    who must pay for this convenience. Publishers of an uncopyrightable work or one
    in the public domain cannot use copyright law to dissuade another publisher from
    offering consumers the same or a comparable work, as if the work were copyrighted.
    Thus, they must depend on trusted systems and digital contracts to maintain a
    business position.


    Finally, there is a third contract implicit in the digital contract: namely, the
    agreement entitling the consumer to the network of trusted systems in the first
    place. This agreement may be arranged between the consumer and the publisher,
    or between the consumer and one or more network service providers, who may or
    may not be affiliated with the publisher.


    The idea that a digital contract includes multiple legal contracts provides a
    coherent rationale for enforcement of digital contracts, even those pertaining
    to unable works. For example, suppose that a digital publisher provides a customer
    with a work in the public domain, such as the complete works of Shakespeare, under
    a digital contract that prohibits the copying or further trasfer of the work in
    digital form. One consumer, however, is unhappy about this. He knows that the
    work is not protected by copyright, and when the bill arrives from the publisher,
    he refuses to pay it, or he sues to get his money back. In court, the consumer
    argues that charging for a work no longer protected by copyright violates the
    copyright principle of providing only limited-term monopolies for authors. Therefore,
    he claims, the digital contract should be preempted by the Copyright Act and held
    unenforceable. (The consumer might also argue that, because the publisher accepts
    the consumer''s money while providing in return only a public domain work that
    ought to be available for free, the agreement fails for lack of consideration;
    because nothing of value has been delivered.)


    The publisher responds that what is sold is not the work itself, rather, the service
    of delivering it. The publisher says, in effect, "Consumer, by dealing with me,
    you save time and energy and money over other delivery mechanisms, such as conventional
    bookstores. If I, as a vendor, want to'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# The Bit and the Pendulum 95


    provide this service to others, I must be entitled to collect revenue for the
    service, not just for the work itself. Therefore, it is legitimate for me to prevent
    you by digital contract by transferring the copy of the work I sold you.\ We think
    that the publisher has the better argument here. The consumer can still pay the
    publisher for the right to print out the contents of the book and then copy the
    contents—for example, by hand or by scanning with an untrusted optical scanner.
    Moreover, other publishers can produce similar books containing identical texts,
    and a not-for-profit library can make these texts available for free. In short,
    the publisher has not overstepped the bounds of copyright.


    # The Consumer Negotiate?


    Another point of possible concern with a digital contract is the extent to which
    a user can realistically negotiate the terms of the contract. In court cases challenging
    the validity of so-called shrink-wrap licenses—software contracts saying that
    by breaking the plastic seal on a package the purchaser agrees to the terms of
    an enclosed contract—plaintiffs have argued that such licenses give the publisher
    a power advantage and leave the user with only a "take it or leave it" choice.
    Many consumers do not bother to read the license. In principle, with trusted systems,
    it is possible to open a channel with the publisher to negotiate changes in such
    terms. It is worth noting, however, that one of the main advantages of digital
    publishing is the possibility of fully automated, twenty-four-hour shopping convenience.
    In that setting, renegotiating the terms of purchase for a mass market digital
    work is as unlikely as expecting to negotiate the price of buying a best-selling
    paperback at a convenience store in the middle of the night. The consumer would
    simply have to accept the terms offered or postpone the purchase until a human
    agent is available to renegotiate them.


    # Trusted Systems and Fair Use


    In addition to specific statutory exceptions to the exclusive rights to rights
    holders, section 107 of the Copyright Act of 1976 sets forth four factors to be
    considered in determining whether a particular use of a copyrighted work is an
    infringement or a fair use.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Chapter 4


    +   1. The purpose and character of the use, including whether it is commercial
    in nature or for nonprofit educational purposes;

    2. The nature of the copyrighted work;

    3. The amount of the work used and its substantiality in relation to the copyrighted
    work as a whole; and

    4. The effect of the use on the potential market for or value of the copyrighted
    work.


    Fair use, itself, is not a public right. Technically, it is a legal defense that
    can be raised when a copyright owner challenges a particular case of a copyrighted
    work. In a representative case, the fair-use defense works as follows: A copyright
    owner publishes a copyrighted work. Without seeking permission, a second party
    obtains a copy of the work and incorporates portions of it in a new work. The
    copyright owner objects and takes the second party to court, claiming infringement
    of copyright. In court, the second party argues that the use of the work constitutes
    a fair use and should be permitted. The second party might argue, for example,
    that the excerpt was used in a legitimate commentary or satire. The court has
    to consider the facts of the particular case in all the four factors. In practice,
    however, the fourth factor, the undermining effect on the market for the work,
    is often considered the most important.


    One of the concerns some have raised about trusted systems is that they block
    consumers’ access to works that they are entitled to use on a fair-use basis.
    Because a consumer could not extract a portion of a digital work on a trusted
    system, or she would not have the opportunity to create the work that would occasion
    the fair-use defense. Of course, a trusted system would not prevent a user from
    manually retying portions of a copyrighted book or from digitally recording excerpts
    from a copyrighted audio or video work through a computer’s microphone or digital
    camera. It would however, exclude the operations of cutting and pasting excerpts
    directly from a rights-protected digital work unless the consumer of the digital
    work has contracted for the appropriate derivative-work rights. This example shows
    how far, in trusted systems, the pendulum has swung toward giving more power to
    authors and publishers.


    Arguments about fair use for digital works sometimes tacitly (and incorrectly)
    assume that publishing risks in the digital medium are similar to'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# The Bit and the Pendulum 97


    those in the paper medium. However, while it is, as discussed earlier, unlikely
    that an infringer will make and distribute thousands of paper copies of a work,
    he or she can copy and make a thousand digital copies with a single keystroke
    at no expense whatever. In other words, publishers who granted unrestricted access
    to each and every user on the basis of fair use would routinely risk the loss
    of all their copyrighted assets.


    The other side of the coin is that fair use serves the public interest, particularly
    by protecting freedom of speech. Parody, academic and social criticism, satire,
    and other forms of speech that rely on the ability to quote from, paraphrase,
    and modify portions of others'' works are essential ingredients of the medium
    of speech that characterizes a democratic society. Fair use helps ensure that
    such borrowing can occur, even when copyright holders are vehemently opposed to
    the use of even short portions of their work in a critique or a lampoon. Without
    fair use, such rights could effectively crush creativity by preventing critics
    from publishing. The importance of this public interest aspect of fair use is
    amplified in the digital medium, where the ease of wide-area communications promotes
    the ability of everyone to engage in free speech and be heard by all. Ultimately,
    this inclusiveness benefits society as a whole.


    # The Microtransactions Approach to Fair Use


    Is there a way in the digital medium to balance the risks and benefits of fair
    use for publishers and consumers? One approach to the question argues that pricing
    and market forces will, in many instances, render the fair-use issue moot. Currently,
    fair use is a binary decision: either the use of a work is a fair use or it is
    not. When the courts rule that a particular use is fair, rights holders must forfeit
    the income from that use; if the use is declared unfair, the consumer must pay
    to use it. Thus there are high stakes in fair-use cases. The issue is especially
    awkward when the cost of being honest greatly exceeds the profit expected from
    using the work. In contrast, with trusted systems, fees for using copyrighted
    works in the digital medium may be either larger or small and can be collected
    automatically. When market forces prevail, therefore, disputes that might otherwise
    arise over fair use will be resolved by setting fees at levels appropriate to
    specific uses.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Copying Music


    A scenario about music illustrates how the market might resolve the issue of fair
    use. Suppose that a consumer wants to copy a short portion of a song from a friend''s
    CD album. Today, consumers can easily make a recording for which the record company
    and the recording artist are not compensated. Such consumers are seldom found
    out by the record company; but even if they were they would argue that copying
    only a short part of a song is fair use. The company would very likely disagree.
    The point is that this is an all-or-nothing situation: either the consumer has
    to purchase the entire CD just to get a few seconds'' worth of audio or the consumer
    pays nothing (because the copying is deemed a fair use) and the record company
    incurs substantial losses over thousands of such uses.


    With trusted systems, though, a middle ground is possible. The fine-grained control
    offered by trusted systems makes it possible for consumers to purchase exactly
    the portion of the audio CD they want, and for the record company to charge and
    collect a fair price for that audio. In other words, to the extent that fair use
    is the copyright law''s response to market failure, well-designed trusted systems
    can help correct that failure and eliminate the fair-use issue.


    # Copying Software


    Another example of the microtransactions approach to fair use involves a person
    who buys a computer game or other software program for home use and expects to
    share it with other family members. In a household with several computers, he
    or she would probably make multiple copies of the software, one for each. Such
    copying today violates the shrink-wrap license that accompanies software. The
    family might assert, however, that their copying is fair use, because only one
    copy of the software is used at a time; in effect, they are simply sharing a single
    copy of the software.


    In a trusted systems regime, would software publishers prevent this by by each
    family member to pay a separate fee for every use of the software? Such pricing
    practices would substantially increase the family''s costs and provide it with
    no apparent benefit. Publishers would not necessarily take this approach. Even
    with trusted systems, they could keep prices at approximately today''s level.
    They might, for example, soft-'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# The Bit and the Pendulum 99


    ware intended for household use with built-in digital contract provisions designed
    to make sharing the software among family members easy. They would allow a certain
    number of copies to be free but would restrict their use to family members and
    their home computers. A family member who attempted to provide a “free” copy to
    someone not in the family, or to use it on a trusted system at work, would be
    prevented from doing so or required to pay an additional fee.


    # Printing Hard Copies


    Yet another instance of the microtransactions approach to fair use suggests how
    the common practice of photocopying a single page of a book owned by someone else
    might change under trusted systems. Today, people typically make such copies without
    the publishers'' knowledge. So long as the copying is fairly minimal, it is popularly
    considered (rightly or wrongly) to be fair use. With trusted systems, a publisher
    could discourage unauthorized copying and at the same time, benefit consumers.
    For example, the publisher could charge less for the right to view a page of a
    digital book on a display screen for the right to print out a hard copy. This
    would benefit the reader who just wanted to look at one page rather than the whole
    book. The charge to view but not print the page might even be cheaper than the
    cost of making a photocopy.


    A publisher might also charge less for the right to print the page in a form containing
    a machine-readable watermark watermark. The watermarked version of the printout
    would be less prone to unauthorized copying, because trusted digital digital photocopy
    systems would detect the watermark and charge for the privilege of copying it.
    Although consumers could still make copies on older photocopiers, the digital
    watermark would inhibit at least some unauthorized copying.


    # The Fair-Use License Approach


    A second approach to fair use, not grounded in faith in market forces or microtransactions,
    would institute fair-use licenses. In this scenario, Joe, a consumer, applies
    for a fair-use license the same way he might apply for a driver’s license or a
    radio operator’s license. To earn the license, he has to study the rules of fair
    use and pass an examination by an appropriate'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Chapter 4


    organization, which we will call the DPT (for Digital Property Trust). The DPT
    then certifies Joe''s identity and issues him a physical certificate as a personalized
    digital license to use on his trusted system. Under DPT, publishers of digital
    works would assign each work privileged rights that can be exercised by fair-use
    licensees. Publishers would also declare an insurance limit based on the expected
    commercial value of their rights to the digital work. Each time Joe exercises
    a copy transaction to obtain a copy of the digital work, the transaction fee includes
    an additional small amount—a share of the insurance premium the digital work.
    Because of his fair-use license, Joe can exercise privileged rights to the digital
    work, but these privileged uses may be monitored, logged, and reported (subject
    to appropriate legal considerations for his privacy). Suppose, then, that Joe
    sends thousands of copies of the digital work to a mailing list on the Internet,
