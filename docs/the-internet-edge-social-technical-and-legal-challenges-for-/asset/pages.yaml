  md: '# Strangers in the Net 245


    and has its headquarters at the Laboratory for Computer Science at MIT, at the
    Institut national de recherche en informatique et automatique in Europe, and at
    Keio University in Japan. At the time of this writing, it was developing new standards
    and policies for digital signatures, metadata, rat-ings, privacy, security, and
