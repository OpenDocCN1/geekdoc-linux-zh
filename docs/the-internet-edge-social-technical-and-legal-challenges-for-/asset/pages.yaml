    to receive television and radio programs. Digital services like Pointcast also
    make it possible to receive and read multiple digital newspapers.


    What is the future of the newspaper in this situation? Given a portable device
    like a PDR, we can imagine it as an extension of what Pointcast provides, delivered
    to our PDR electronically through wireless broadcast to read at our convenience.
    It would be updated during the day as the news develops. It would be interactive,
    and its stories would be linked to related stories. It would let us retrieve yesterday''s
    story and perhaps even go to an encyclopedia or reference collection to find background
    information on an interesting story. The stories would have pictures. If we clicked
    on the picture, we would get a short video and watch the president get off a plane,
    the crowds at a demonstration, and so on. There would probably be advertising.
    If we clicked on an advertisement for a restaurant, we could make reservations
    for dinner and parking.


    What about the future of the television news program? Given a portable device
    like a PDR, we could watch it at our convenience. The news would be delivered
    electronically through wireless broadcast and updated throughout the day. It would
    be interactive, linking news stories with related stories. And so on. The future
    newspaper and the future vision news program might become the same thing. Once-separate
    industries would first begin to compete and then merge with each other.


    Thus PDR technology and its connections with the Internet will simultaneously
    blur distinctions between existing media and create new media. News writing styles
    and genres will evolve to suit the new media. Newspapers in the 1890s were written
    in a style very different from what we find in today''s newspapers. Back then
    they had much competition for delivering international news, and stories were
    often blunt, biased, and highly politicized. Worldwide communications now put
    greater checks on what is written. It is much harder to maintain credibility with
    a distorted point of view when other, easily accessible voices, pictures, and
    opinion leaders are.


    From one perspective, the blurring of boundaries between digital newspapers and
