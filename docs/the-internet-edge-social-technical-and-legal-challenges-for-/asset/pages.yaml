  md: '# Increasing Precision


    I was interested in knowing whether ever found any viruses that attack the malaria
    parasite. I have all Medline titles and abstracts since 1966. I can search for
    them strings—all the usual—and there’s ever matching vocabulary or thesaurus that
    do some level of equivalence. The trouble is that the nouns are the verbs are
    elusive. I can easily find articles where viruses are mentioned and malaria is
    also mentioned, but none of them have to do with what I’m talking about. I have
    no way to capture “viruses attacking plasmodia.” There are so many synonyms for
    that and I just get hundreds of articles that are about coincidental infections.


    Joshua Lederberg, 1997


    I once had a conversation with the geneticist, Joshua Lederberg, about his use
    of information retrieval. He was looking at new approaches for curing malaria.
    In the late 1990s, malaria killed 2.7 million people each year, mostly children.
    A new generation of vaccines was being tried, but with only partial success. Malaria
    has evolved in a way that keeps it step ahead of the body’s immune response system,
    shifting forms and sites of infection from the bloodstream, to the liver cells,
    to red blood cells. Lederberg believed it might be possible to use a “counterattack”
    approach based on viruses or other infectious agents that attack plasmodia, the
    parasites that cause malaria.


    To this end he tried to construct a query to locate such agents with an electronic
    search service. He knew that retrieving articles about viruses was far too broad.
    He also found that retrieving articles that mention viruses and malaria was inefficient,
    because there were numerous articles about people with malaria who also had secondary
    viral infections. He was overwhelmed by the large number of irrelevant documents
    that matched his query for what he considered accidental reasons. He what wanted
    a way to tell the search system to retrieve all texts that mentioned the two words
    malaria and virus in a particular relationship. That idea is the core of an approach
    schematic search, which is intended to make retrieval more precise. Lederberg
    describes the concept as follows.


    I did a little—I would call it an experiment—a very hasty trial run. But I reckon
    there are only about thirty verb contexts that I would need to formulate and it
    would essentially solve my problem. Think of all the major relational connections
    between nouns. You know, inclusion and exclusion, modification, subtraction—it'
