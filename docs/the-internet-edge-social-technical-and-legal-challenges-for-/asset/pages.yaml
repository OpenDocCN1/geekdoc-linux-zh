- pgno: 267
  md: '# Chapter 9


    As the Net becomes a hub for so many digital services, the issue of subsidy will
    involve far more than subsidized telephone service. Digital publishers could step
    forward and offer discounts to the disadvantaged for access to digital works.
    The logic here is providing digital copies, if digital services, to the poor are
