  img_proc: true
- pgno: 266
  md: '# Strangers in the Net 249


    discussions. In short, it would include becoming a full-fledged netizen—a networked
    citizen.


    The technology and setting of the Net are evolving more rapidly than social responses
    to it. For example, studies of access issues I have seen recently are based on
    outdated census data and on Net usage patterns typical of the late 1980s and early
    1990s—before the World Wide Web had sway. They often discuss models for determining
