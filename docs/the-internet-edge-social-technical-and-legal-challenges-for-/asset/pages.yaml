    Symbol Technologies. A radio-linked wrist computer with a scanner ring. http://www.symbol.com/ST000262.htm


    Virtual Visions. A system combining a speech interface with a head-mounted display.
    http://www.hypervision.co.uk/speech/vvision.htm


    # URLs for Smart Buildings and Appliances


    Technology for smart building and smart homes has been around for several years.
    Here are some on-line sources that refer to it.


    CEBus/PnP. A general description of the common application language and a fact
    about PnP can be found on-line, at http://www.cebus.org/10.htm and http://www.cebus.org/fmain.htm#FAQ_1.2.


    Echelon Corporation. Information about their LonWorks technology is available
    at http://www.hometoys.com/hitnews/dec96/articles/lonworks.htm and http://www.aspgg.com/products/mdad/lonworks.htm.


    IPv6 and IPNg Internet protocols. Information about developments in these protocols
    are available on-line at http://playground.sun.com/pub/ipng/ipng-main.html and
    http://playground.sun.com/pub/ipng/html/INET-Ipng-Paper.html.'
