    subsidiaries began expanding into the entertainment business. One of these lessees,
    the Columbia Phonograph Company, operated in the Baltimore and Washington, D.C.,
    market. By the end of the century Columbia had a catalog of over five thousand
    recordings, including popular songs, military marches by John Philip Sousa, political
    speeches, and various novelties. Indeed, a primary way of distributing political
    information in this period was to play recorded speeches from the stages of public
    auditoriums. For the first time, large numbers of citizens became acquainted with
    the distinct voices of politicians and orators who were Theodore Roosevelt and
    William Jennings Bryan.


    Columbia later became Columbia Graphophone, which, in 1907, split into a business
    segment (which later became the Dictaphone Corporation) and an entertainment company
    (which later became Columbia Records). Columbia had been offering flat discs since
    1901 and in 1912 ceased manufacturing cylinders altogether.


    Looking over this early history of the phonograph, we are struck by how the initial
    visions of the inventors and their companies shaped and limited the opportunities
    they pursued. While sound recording is useful for office work and business dictation,
    its value does not lie merely in that application. Berliner''s goal was to make
    recordings for mass entertainment, and he and Johnson''s work on sound quality
    and mass production followed from this move. Although the rest of the industry
    eventually decided to move in the same direction, Berliner''s sustained focus
    enabled him and his successors and collaborators to catch up from behind, set
    the standards, and dominate the market. With their attention focused on developing
    dictation machines and their energies sucked by patent disputes, the companies
    manufacturing machines invented by Edison, Tainter, and Bell squandered their
    early lead.


    # What Is the Net Good For?


    Today the Internet is in an analogous period of new invention, competing visions,
    advancing technology, and companies scrambling for advantage. The Net has the
    potential to become many things, and people have different views of what it is
    good for. Like the early phonograph companies, today''s Internet companies are
    likely to find that their goals and visions will limit and shape their opportunities.'
