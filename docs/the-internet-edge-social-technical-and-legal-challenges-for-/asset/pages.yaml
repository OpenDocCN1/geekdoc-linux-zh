  img_proc: true
- pgno: 253
  md: '# Chapter 9


    # The Net and Cultural Diversity


    The year before my trekking holiday in Tibet, I took another extended trip, this
    time to Italy. My earlier book, Internet Dreams: Archetypes, Myths, and Metaphors
    (1996), had just been translated into Italian, which gave me the opportunity to
    spend some time talking about the Internet with members of the Italian press.


    One question that came up in these conversations was whether the Internet was
    a pipeline for spreading American culture to other parts of the world. There was
    some sensitivity about this as certain highly visible American products, such
    as McDonald’s restaurants and American movies, had already made inroads into the
    Italian market. The journalists readily agreed that these American imports would
    not be succeeding as well as they are if Italians did not have an “appetite” for
    them. I observed that, in any case, people can put anything they want on the Net—including
    proposals for Net standards—and viewers and consumers can decide for themselves
    what they want. Hearing this, one journalist qui, “It’s the Wild West all over
    again. How American!” This comment stuck with me. It suggested that I was so immersed
    in the Silicon Valley that I sometimes did not notice the elements of culture
    (e.g., the “Wild West attitude”) that permeate my own thinking.


    To many people, unwanted foreign products or influences are akin to species pollution.
    In many parts of the world, local ecologies have been radically changed—sometimes
    in just a few years—by the introduction of foreign species that without check.
    In some coastal and hilly areas of California, South American pampa grass and
    broom from Scotland have overrun native plants. Fishing of native species in many
    bays around the world has been wiped out by foreign organisms introduced when
    foreign ships emptied their ballast tanks in harbor. An exotic Pacific seaweed,
    Caulper taxifolia, escaped from a German aquarium two decades ago; it is now spreading
    throughout the Mediterranean from the southern coast of France. Where it spreads,
    the toxic plant wipes out sea anemones, starfish, crabs, shrimp, and other species
    and suffocates native plant in its path. In Louisiana, swamplands have been overrun
    by the nutria, a small mammal whose population has soared to over twenty million
    since a hundred and fifty animals escaped from a far farm earlier in the decade.
    Extensive changes in Australia’s ecology began many years'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Strangers in the Net 237


    ago when Europeans explorers and settlers introduced dogs, sheep, and other mammals.


    Such damage to native microbial, plant, bird, and insect populations abounds,
    often accompanied by unfortunate consequences for local agriculture. The foreign
    invaders spread quickly because other species that could keep them in check are
    missing in the new environment. Furthermore, since any ecology is a complex system,
    experts are often uncertain about what measures to take to restore balance without
    causing other, unwanted effects.


    The species-pollution metaphor also fits some commercial products well. During
    my stay in Venice, I caught sight of only two or three McDonald''s restaurants.
    Well, in one four-day period I noticed that approximately two out of three pieces
    of litter in the streets before McDonald''s labels. I have no particular dislike
    for McDonald''s, and I eat there on occasion. I cannot explain why so much of
    the litter in Venice comes from McDonald''s. I suspect that McDonald''s uses more
    disposable wrappers and containers than Italian take-out restaurants and are frequented
    by teenagers, who are less inclined to dispose of their trash. However, other
    Venetian establishments—such as bakeries and the wonderful gelato shops—also disperse
    food in paper—and there are many more of them.


    In Tibet, too, I saw a dramatic effect of pollution caused by foreign products.
    Canned soft drinks and bottled beer were apparently introduced into western Tibet
    in a fairly big way during the 1990s. Because there are no effective garbage or
    recycling services in most of the country, the land around the stores and on the
    outskirts of small towns is always piled with several years'' accumulation of
    discarded bottles and cans. They are not buried or organized in any way. Perhaps
    at some point it will become worthwhile to “mine” garbage piles for the gas and
    aluminum they contain. In the meanwhile, the dumps are very visible and unfortunate
    reminders of Western influences and their ecological consequences.


    The proliferation of foreign biological species and consumer waste fit the metaphor
    of ecological pollution quite well. But is it particularly apt for describing
    the cultural effects of the Internet? Digital goods do not pile up in public spaces
    we litter can. Furthermore, the quantity of cultural products on the Internet
    accessible to the average third world person is still small and much less influential
    than that conveyed by television, which is itself relatively rare in many parts
    of the world.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 238    Chapter 9


    So what degree of cultural mixing is actually taking place of the Net? Conversations
    on this subject with acquaintances in Nepal and Tibet gave me a few answers. The
    Net technology itself—ranging from computers, to e-mail, to the creation and browsing
    of web pages—is available to the growing numbers of technologically literate people.
    Although computers and Net communications are not within reach of most people
    in the third world, those who do use the Net to be more influential and entrepreneurial.
    They employ up-to-date technology. The hardware and software on stores in Kathmandu
    are not much different from what is sold in Silicon Valley. It''s not as if the
    stores were carrying ten-year-old computers. There is a time lag—and there are
    some older computers in use—but that''s true in Silicon Valley.


    East Asian weavers carry stories about the Net. People using the Net tend to be
    familiar with the politics and geography of the West and to be interested in Western
    Developments. The usual business reasons for studying English, computers are giving
    young people an incentive. Several people told me that learning English was essential
    for learning computers because the best training materials are available in the
    local dialect, the Net''s rapid pace of change gives those who learn English decided
    advantage.


    The ecological-pollution metaphor would weight for thinking about the effects
    of the Net if we could show that it actually decreases cultural diversity. Does
    it? Certainly the decline of cultural uniqueness was an issue log before the Net
    came being. What is not clear how much the Net contributes to this phenomenon,
    compared with other, pre-existing influences. So far, however, what we see is
    some tangible increase in diversity, as local cultures combine with the Net culture
    and as people special interest groups—sometimes internationally—to pursue topics
    which of their neighbors are sufficiently interested.


    When the Net technology evolves to provide low-cost, high-speed, and portable
    access to all kinds of digital material—supplanting television, newspapers, and
    other media in a single unified medium—the impact of the Net on local cultures
    worldwide will be huge. Many people will carry around portals to the networked
    world, and centralized information and entertainment services will compete for
    world market share—and mind share. Such a picture, however, is not the reality
    of the late 1990s. The Net in the third world is still accessible only from desktops
    over slow and unre-'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Strangers in the Net 239


    liable telephone lines. There are no good examples of cultural displacement on
    the Net—part because so little culture is on the Net anywhere. There are also
    few examples, so far, of cultural mixing on the Net, or of new Net technologies
    originating in third world countries. At present the Net principally excels at
    giving us—Westerners planning a trek in the Himalayas or (say) Nepalese searching
    for information about computers—relatively cheap access.


    A friend of mine recently told me about getting off a plane on a Honduran island
    for a skin-diving trip. An unknown woman approached him in the airport to say
    that her colleague had missed a connecting flight and would be a day late. On
    the island there was an “Internet Cafe” next door to the sole microwave tower
    on the island. While in the cafe, the woman received an e-mail asking her to deliver
    a message to a guy wearing a brown hat who would get off the plane the next morning.
    Such examples give us a sense of the “small world” the Net can create, but do
    not signal an imminent period of rapid change and globalization stemming from
    the Net. Rather reflect the niche uses and applications of the Net that are proliferating
    while the larger issues of economic development are working themselves out in
    the third world at a slower rate of change.


    # Computers and Democracy


    Freedom is fostered when the means of communication are dispersed, decentralized,
    and easily available, as are printing presses or microcomputers. Central control
    is more likely when the means of communication are concentrated, monopolized,
    and scarce.


    > Ithiel De S Pol, Technologies of Freedom


    As a great social level, information technology ranks second only to death. It
    can raise cultural barriers, overwhelm economic inequalities, even compensate
    for intellectual disparities. In short, high technology can put unequal human
    beings on equal footing, and that makes it the most potent democratizing tool
    ever devised. Sam Pitroda, Development, Democracy, and the Village Telephone


    Italy and Tibet, by two major travel destinations during the time I was writing
    this book, represent extremes. Not only do the two countries differ radically
    in their levels of economic modernization and use of high technology, they also
    offer very different opportunities for the exercise of democratic and personal
    freedoms.'
