  md: '# 2

    The Portable Network: Away from the Desktop and into the World


    No matter how much PC vendors want to convince us that sitting in front of a computer
    monitor twenty-four hours is the ultimate fulfillment, it simply will not happen.
    [.. there are far too many places that digital media can be put to good for it
    to remain tethered to the desktop.]

    Denise Caruso, “Digital Commerce”


    The early history of the phonograph is a story of competing inventors, competing
    advances in technology, and competing visions of the nascent market for sound
    recording. In 1877, Charles Cros in France and Thomas Edison in the United States
    both described practical methods of recording sound waves on a disc or cylinder
    and playing them back. Cros developed no working model, but Edison had his machinist,
    John Kruesi, built a device in November of the same year. In 1878 Edison received
    a patent for both disc and cylinder formats. His first models used a sheet of
    tinfoil wrapped around a metal cylinder. As he spoke into a horn, the sound waves
    made a diaphragm vibrating, using a needle to record the vibrations as indentations
    on the foil as the cylinder turned.


    In 1881, Charles Sumner Tainter and Chichester introduced the wax cylinder, which
    had superior recording capabilities and could be reused by simply shaving off
    the layer of wax holding the earlier recording. Their work at the Volta Laboratory
    was sponsored by Alexander Graham Bell, who was interested in adapting his telephone
    invention for remote detection. They called the device the graphophone, received
    a patent on it in 1886, and demonstrated it at a major exhibition in Washington,
    D.C., in 1889. They subsequently sold the patent to the American Graphophone Co.


    In 1887, Emile Berliner patented what he called a gramophone, which engraved sound
    waves in a spiral groove on the surface of a flat disc. He'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 18 Chapter 2


    demonstrated the following year. In 1897 he founded the Berliner Gram-ophone Company
    in Montreal and, and with his brother Joseph, the German company, Deutsche Grammophon.


    # Where an Invention Ends Up Is Not Always Where It Starts Out


    What did these inventors think sound recording would be used for? Even though
    Edison received an enthusiastic reception when he played recordings of music and
    comedy in a public hall, he believed that the major use of his invention would
    be recording dictation in business offices. The sound quality of his early apparatus,
    however, was barely good enough to reproduce intelligible speech. Bell and Tainer
    also expected dictation to be the primary application for sound recording.


    Emile Berliner, however, saw the future more clearly, with the entertainment as
    the major market for sound recording. Even though the sound quality of Berliner''s
    discs was initially poorer than that of Edison''s cylinders, his invention of
    a method to mass-produce recorded discs at low cost made the subsequent development
    of the recording industry possible. Moreover, Berliner''s motor supplier, Eldridge
    Johnson, who took over the patent when Berliner was forced out of business, greatly
    improved the sound quality of the flat disc. In 1901 Johnson used the gramophone
    patent to form the Victor Victor Talking Machine Company. Thereafter the superior
    sound quality and durability of the flat disc steadily attracted performers and
    the public. By 1910 discs recorded at seventy-eight revolutions per minute (78
    rpm) became the dominant format.


    In the late 1890s, however, technical shortcomings and bitter patent battles had
    impeded the growth of the phonograph business. In the years between 1896 and 1901
    the patentholders consolidated and regionalized the industry. The North American
    Phonograph Company controlled interests in both Edison''s and Tainter and Bell''s
    patents. Its primary purpose, at first, was to manufacture office dictation machines.


    At the turn of the century, the main companies in the market for sound recordings
    included Edison''s National Phonograph Company (successor to North American Phonograph)
    and the Victor Talking Machine Company. In begun to lease regional rights to subsidiaries
    doing business under different names. Several of the'
  merge: -1
  img_proc: true
- pgno: 36
