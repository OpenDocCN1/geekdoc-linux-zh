  md: '# 240 Chapter 9


    For several years we have heard numerous reports that communications technology
    is playing a pivotal role in the emergence of democracies-wide. Well-known accounts
    include stories about the use of e-mail and fax machines for exchanging news during
    the break-up of the U.S.S.R in the mid-1990s and during the Tiananmen Square riots
    in China in 1989.


    Until recently, however, evidence for a correlation between democracy and communication
    technology was mostly anecdotal. Does the Net live up to its touted potential
    for profound influence on human freedom and government? At first glance, possibility
    seems at variance with the commercial focus and niche uses of the Net we have
    considered so far. Naturally, we would need to ground any conclusions about such
    a broad question in more than anecdotal accounts and would have to study a wide
    range of national countries to mitigate the hazards of biased sampling. The observations
    and conclusions about this issue I present draw heavily on a study by Christopher
    Kedzie (1997).


    As Kedzie suggests in his definitive article, democracy is an abstract concept
    and difficult to measure. As it has a subjective quality and is susceptible to
    interpretive biases are complex. A democratic country may have nondemocratic organizations
    and practices, and vice versa. Furthermore, democracy is multidimensional. Yet,
    Kedzie observes, democracy rankings of nations by independent authorities using
    different criteria agree quite broadly; this suggests that democracy, whatever
    it is, can be recognized, albeit intuitively, by Western analysts.


    In Kedzie''s study, democracy is the dependent variable. His evaluation of a country''s
    democracy is based principally on the average of two measures: a ranking of political
    rights and one of civil liberties, as established by Freedom House (a nonprofit,
    nonpartisan organization that promotes democratic values). Communications technology,
    the proposed independent variable, is a broad category. Computers can send faxes,
    and radio and television cables decided to focus on e-mail, because it enables
    people to engage in interactive discourse. He therefore created a metric which
    is based on the number of nodes reported in each country on the four primary e-mail
    networks: Internet, BITNET, UUOCCP, and FidoNet. Kedzie''s detailed study also
    takes into account such other variables as wealth, education, and historical factors.
    He considers the nations of the world as a single group and also according to
    regional subgroups.'
