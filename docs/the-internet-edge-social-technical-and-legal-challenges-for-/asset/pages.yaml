    Imagine how we might draw on a collection of knowledge bases from expert systems.
    These knowledge bases, although developed for different purposes, would have some
    important terms in common. For example, consider the term water. A chemistry-knowledge
    base would specify when water freezes and boils and what dissolves in it. A base
    for cooking water would include information about measuring water or using it
    with different kinds of utensils. A desert-survival knowledge base would relate
    water to sweat and night travel. Knowledge bases for farming and boating would
    relay other unique information.


    A partial approach to combining knowledge from these different sources is standardization.
    The goal of standardization is to make interchange and reuse possible. Initially,
    railroads were designed with different-sized gauges for different sets of tracks.
    Now, however, the diversity of railway gauges has almost disappeared, and most
    railway cars can be routed along any of tracks.


    The same idea can be applied to standard vocabularies (using, for example, words
    like water), standard contexts (such as water use in cooking), and ways of defining
    larger things in terms of more basic concepts. This is the conventional approach
    to building knowledge bases, in which the representation language for storing
    and reasoning with knowledge is akin to the communication language used by human
    experts.


    Work on standardization can be coupled naturally to work on shells for expert
    systems. A shell is an environment designed to support applications of a similar
    nature; they are intermediate between specific applications (e.g., a system for
    advising engineers repairing cars) and general purpose knowledge-engineering environments
    (e.g., frame-based knowledge-representation tools). Shells have been built for
    numerous broad applications, such as configuration tasks, scheduling tasks, and
    specialized office tasks. They have four crucial components besides representation
    languages: (1) prepackaged (2) tools for inference and representation tuned to
    perform the task efficiently and perspicuously; (3) specialized user interfaces
    for carrying out the task and entering domain knowledge; and (4) generic knowledge
    of the application area. For example, commercial shells for a configuration task
    have'
  merge: -1
  img_proc: true
- pgno: 169
  md: '152 Chapter 6


    specialized representations of system parts and their parameters, constraints
    on how parts can be combined, and strategies for searching for and evaluating
    candidate configurations. Shells thus have the potential to be used for sharing
    and standardizing knowledge in communities larger than single expert-system projects.
    Shells are a key component in the "parts" approach to creating a knowledge medium.


    # Metaknowledge for Combining Knowledge


    Anyone who has tried to give a computer program common sense has discovered the
    staggering amount of it people acquire on their way to becoming adults. And none
    of it is readily accessible to computers. In the AI field many projects have attempted
    to model common sense reasoning and a qualitative and naive physics. Doug Lenat''s
    CYC project (1995), which began in the early 1980s, is still attempting to encode
    the knowledge of an encyclopedia into an explicit knowledge base. Whether or not
    this project is successful depends on how well it deals with the additivity of
    knowledge.


    Knowledge additivity means that when knowledge is added to a system, it is used
    appropriately for system tasks. Knowledge reusability means that knowledge added
    for one purpose can be reused for another. The fundamental problem—that is, metaknowledge—is
    available and effective in guiding the integration of new knowledge. With the
    right metaknowledge, adding more knowledge can become simpler as the knowledge
    base grows.


    The shells approach to the knowledge-additivity problem is to define a context,
    a set of standard knowledge types, and standard ways of using the knowledge. For
    example, in a configuration the part of the system that searches for configuration
    solutions is capable of using the parts catalog to generate candidate solutions
    and of applying the standard kinds of constraints to prune the search. Knowledge
    for a configuration task is additive as long as it fits within the standard framework
    of the configuration shell. The metaknowledge in shells for knowledge combination
    resides in the categories, operational methods, and assumptions of use that are
    built into the shell architecture.'
