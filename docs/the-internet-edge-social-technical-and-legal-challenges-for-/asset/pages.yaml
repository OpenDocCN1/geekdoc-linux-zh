    copy transaction, in which the store repository transmits an encrypted copy of
    the work. Typically, the work is block-encrypted, and the encryption key is itself
    encrypted in the user''s public key and included with the work. The trusted player
    stores the work in encrypted form, and both systems make billing records of the
    transaction. If the transaction is not completed for any reason, both sides report
    the interruption in their billing records, and the trusted player deletes their
    encrypted partial copy.


