    # Population Genetics


    Beginning biology courses discuss the genetics of individuals, starting from the
    early plant experiments of Gregor Mendel to the more recent research that has
    revealed the chromosomal mechanisms of inheritance and the codon sequencing of
    individual chromosomes. The field of population genetics, on the other hand, goes
    beyond the genes of individuals to consider the variations and percentages of
    genes in populations. The set of genes in a given population is referred to as
    its *gene pool*.


    In the model used by population geneticists, living organisms are carriers and
    a species is defined as a group of organisms capable of interbreeding. Mutation
    occurs randomly in the genes of individuals; over time, reproduction and natural
    selection determine the percentages of different genes in a given population.


    As the environment changes, the selection processes also change, and this is reflected
    in the gene pool. *Genetic drift* refers to a change in the relative distribution
    of genes within a population. A fundamental hypothesis of population genetics
    is that when two groups become isolated from each other, there is always genetic
    drift between the two gene pools; that is, the distribution of genes within the
    two populations begins to diverge. In general, the gene pools of large populations
    have more stable distributions than those of smaller populations.


    Sometimes new species appear and displace species more rapidly than would be predicted
    by apparent changes of environment or the expected rate of genetic drift. This
    phenomenon of speciation and displacement is called a *punctuated equilibrium*,
    because a population is stable for a long period of time and then experiences
    sudden changes. The fossil record may show, for example, a change in the shape
    of a predator’s teeth occurred suddenly.


    The leading process model explaining this phenomenon posits three stages: isolation,
    drift, and displacement. First, a group of organisms becomes geographically isolated
    from the main population; second, it undergoes selection and genetic drift across
    multiple genes more rapidly'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'than the larger body does. Finally, the geographic isolation ends and the slightly
    fitter group competes against and displaces the original population it was once
    part of.


    Both the mathematics and the concepts of genetic drift and gene pools can be adapted
    to other systems, nonbiological systems. Such systems need only have replicating
    elements and mechanisms analogous to genes for transmitting and recombining those
    elements.


    # Ecological Models


    Ecology is the study of systems of organisms in an environment. A primary observation
    of ecology is that systems are composed of various interacting levels. This concept
    is perhaps best exemplified by food chains, in which big animals eat little animals
    and so down to the rudimentary plants and microorganisms.


    Levels are a simple model of relations; in complex ecological systems, the relations
    among species form an intricate web. To describe these relations ecologists have
    developed a rich vocabulary of terms: for example, predators, symbiotes, parasites,
    and pollinators. Each species in a system has its own ecological niche; collectively
    they fill the nooks and crannies needed to make the ecology function efficiently.


    When several species evolve in ways that increase their mutual adaptation, they
    are said to co-evolve. From this mutual adaptation can come increased efficiency,
    which leads to an important ecological principle: life enables more life. Everything
    depends on everything. This degree of interdependency does not mean that ecosystems
    are fragile. They are not constant, nor are they formed all at once. They develop
    under processes of evolution as multiple species compete and create niches. As
    an ecosystem increases in complexity, it also becomes more redundant and thereby
    more robust.


    We can characterize other systems with populations of replicating elements in
    terms of metaphors drawn from population genetics—for example, drift, mutation,
    and selection—and from ecology—for example, ecological niches. All these metaphors
    describe relations between particular groups of elements and the way they co-evolve.'
