    influence of a virus, modify a system file to provide a trapdoor for tampering-with
    financial records. An applet used to drive an animation on a web page could not
    tunnel files elsewhere in the computer, remove information, and alter their contents.
    However, no such protections are built into the operating systems presently in
    wide use today.


    In the absence of trusted operating systems with such secure boundaries between
    programs, any program can principle compromise any other program. In this situation,
    the only guarantee of behavioral integrity is the certification of all programs
    loaded onto the computer and the warranty that no program can be altered after
    it has been certified. However, the brute force needed to carry out this guarantee
    stalls the inertia of the vast installed base of uncertified operating systems
    and popular applications.


    Thus, in theory the foundations for trust in a trusted system are its physical
    integrity, communications integrity, and behavioral integrity. The practical reality
    is that existing standard platforms are poorly suited for trusted systems. In
