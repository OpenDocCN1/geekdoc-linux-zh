  md: '# The Edge of Chaos: Coping with Rapid Change


    Complex systems seem to strike a balance between the need for order and the imperative
    to change. . . . [They] locate at a place we call “the edge of chaos” . . . where
    there is enough innovation to keep a living system vibrant, and enough stability
    to keep it from collapsing into anarchy.


    Michael Crichton, *The Lost World*


    Since the beginning of the decade, the struggling interactive media industry seems
    to have been backing up bad data by forcing itself into existence before its time.
    Its ongoing delusion [is] that its business is the Next Big Consumer Trend . .
    . first on CD-ROM, and now on the Internet.


    Of course, any time that investment money starts flying around, everyone gets
    very excited. . . . Now the dust has begun to settle and the grim reality is that
    customers are not interested. . . . Money is not being made. . . . Something has
    to change.


    Denise Caruso, “Digital Commerce”


    Both the beginning and the closing years of the twentieth century were characterized
    by intense innovation and change. Between 1890 and 1920, automobiles, electric
    lights, telephones, radios, movies, phonographs, and numerous other inventions
    entered the everyday lives of people in the developed world. The last decades
    of the century also introduced many inventions—personal computers, microwave ovens,
    cellular telephones, compact discs, VCRs, and countless inventions in electronics
    and optics to power new forms of communication like the Internet. The computer
    industry came to expect rapid improvement and early obsolescence of its systems,
    while consumers and organizations struggled to balance the potential benefits
    of acquiring new technology against the predictability of retaining older technologies
    in an installed base. The accelerating pace of life itself suggested that some
    variation of Moore’s Law (1991)—which holds that computer'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'processing speed increases 44 percent per year—was at work. In 1997 the phrase
    Internet years came into vogue to describe the phenomenon that innovations in
    technologies and businesses related to the Net seemed to multiply several times
    faster than those off the Net.


    To examine change as a phenomenon, we consider work at the technological edge
    and the different stages of Geoffrey Moore’s model of the technology adoption
    cycle. To do so, we draw on two kinds of historical sources. Because their experiences
    are so crucial to the continuing evolution of the Net, we consider some about
    early travelers to the Internet edge. In addition, to provide depth and perspective
    on the technology cycle, we look at several stories about the Erie Canal. Scattered
    throughout the chapter, they can help us see phenomena present at the Internet
    edge obscured by the freshness of our experiences.


    # Stages of Technology Adoption


    When a change in how some element of one’s business becomes an order of magnitude
    larger than what business is accustomed to, then all bets are off. There''s wind,
    and then there''s a typhoon.


    > Andrew Grove, Only the Paranoid Survive


    During periods of rapid social and technological evolution, changes are felt by
    different people at times. In his books Crossing the Chasm (1991) and Inside the
    Tornado (1995), Geoffrey Moore draws a bell-shaped curve to illustrate what he
    calls the technology adoption life cycle. His curve, depicted in figure 7.1, organizes
    the cycle into stages and names the players or roles pertinent to the various
    stages of a technology’s development and marketing. Each stage requires specific
    kind of edge work as players confront the particular issues related to change
    at that stage. Together, the stages describe the process of a social group meeting
    a collective edge as the influence of a technology rises and falls.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# The Edge of Chaos 165


    ![](img/e8f730d8bc394752c8439960d009418b_182_0.png)


    **Figure 7.1** Technology Adoption Life Cycle. Changes are felt by different people
    at different times. Geoffrey Moore describes the staged process of technology
    adoption in which the influence of a technology rises and falls.


    The first stage, the early market, is a time of great excitement when technology
    enthusiasts are eager to try the new technology. Moore characterizes the players
    in this stage as *innovators* and *early adopters* and includes a third, external
    actor, the *technology watcher*. The innovators pursue products aggressively,
    sometimes before a formal marketing program has been launched. Their interest
    focuses on pilot projects to test the applicability of the technology. Next, early
    adopters—who perhaps be called *early adapters*—are willing to be buying decisions
    on a new technology that is a potentially good match to their needs. Much of what
    they involves making adjustments to integrate the new technology into unprepared
    work sets and practices. The technology watchers are active during this stage
    and before, reporting on emerging technologies and the pilot projects conducted
    by the innovators. These three actors—the innovators, early adopters, and technology
    watchers—are the first to journey to the edge with a new technology.


    Moore’s principal interest, however, is in technologies that make it big and in
    business strategies for company growth. He recognizes that the integration work
    innovators and early adopters must do to use the new technology is much greater
    than less-motivated consumers in a big market will accept. That integration work
    brings us to the stage Moore calls the *chasm*,'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 166 Chapter 7


    when early market enthusiasm has waned but the technology is still too immature
    for market adoption. Many technologies stall at this point and are eventually
    overtaken by other approaches. Successful programs at a chase look for applications
    that can craft the new technology to fit the needs of multiple niche markets.
    Another of Moore''s metaphors for this period, the bowling alley, likens promoters''
    efforts to aim a technology at particular markets to targeting a bowling ball
    at certain pins. If a company chooses its niches wisely, it gains others as well
    (knocks over other pins) and travels the learning curve with a refined technology
    that meets the needs of a larger market.


    If a technology successfully crosses the chasm, what follows a period of mass-market
    adoption when many people—the early majority—switch over to maturing technology.
    Because of the chaos and rapid growth that accompany it, Moore calls this stage
    the tornado. The rapid growth quickly moves the technology, and consequent social
    and work changes, through a large population of users. When a technology rides
    the tornado it reaches the next stage, Moore refers to as Main Street. At Main
    Street the technology is picked up by the late majority, people who prefer to
    wait until a technology has become an established standard and is less expensive.


    Even after a technology is widely deployed and becomes the new base, it can stagnate.
    If there is too little turnover and evolution of the technology, it can become
    the target of new, competing technologies. At this stage, the mass of users and
    the market inertia created by that large installed base can inhibit necessary
    changes. To extend their stay on Main Street, producers of an evolving technology
    and the businesses based on it have to defend the base against newer technologies.
    They can do so by leveraging their market presence and income to finance continuous,
    incremental improvements that stay offset by next-wave technologies. However,
    backward compatibility—refinements to a product that is still usable on systems
    produced earlier—can be both an asset and a liability, as we will see below. Backward
    compatibility takes advantage of the installed base, but at the same time, puts
    limits the degree to which a technology can change. A technology provider must
    determine when the need for incompatible changes outweighs the benefits of compatibility
    and needs to have a transition strategy to avoid losing old customers.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Anticipating Change


    Although I have an ardent wish to live and see many of them effected, yet, by
    accident, I may be writing for a subsequent age: And I have reliance on the American
    character, already established for its inventive genius and enterprise, which
    gives me even grateful expectations that ... my countrymen are capable of encountering
    many difficulties and apparent impossibilities, by which many improvements ...
    will be undertaken and completed in a future day. . . It would be a burlesque
    of civilization and the useful arts, for the inventive and enterprising of European
    Americans, with their large bodies and streams of fresh water for inland navigation
    to be contented with navigating farm brooks in bark canoes.


    Jesse Hawley, 1807\Depend upon it. If we vote for this canal today, we mortgage
    the State. Representative Emmot, a legislator from eastern New York, 1815


    Even before a technology comes into wide use, dreamers and technologists may write
    about it. Jesse Hawley was a dreamer in nineteenth-century New York. When he found
    himself in debtor’s prison for twenty months he began a series of fourteen essays
    describing the benefits to be obtained by building an inland canal linking the
    Hudson River with Lake Erie. Hawley’s essays, signed “Hercules,” were published
    in the Genesee (N.Y.) Messenger in 1807 and 1808. Thus Hawley became the first
    publicist for the Erie Canal, which was completed in 1825.


    Not all dreamers and technology watchers are promoters. Some are more aware of
    its dark side—either unwanted social effects or undesired expenses. The quotation
    from the state legislator also dates from the period before work on the canal
    began. Emmot, realizing that the Erie Canal would be a very large and expensive
    public works project, objected to the special tax assessments for cities along
    the route.


    Technology watchers such as Hawley and Emmot spoke to a public trying to sort
    through the predictions and chaos to understand the choices ahead. In the following
    passages, we revisit the similar chaos experienced by early–1980s technology watchers
    as they considered several promising technologies for electronic publishing.'
