- pgno: 327
  md: '# Suggestions for Further Reading


    Kitchen Sync Project at the MIT Media Lab. Information available at http://www.media.mit.edu/pia/pubs/AprilDemo/kitchenysync/


    Smart House Consortium Home Page. http://www.smart-house.com


    X-10 System. Page describing components from several manufacturers. http://web.csalberta.ca/-wade/HyperHome/Faq/faq_section2.html.


    Michael Schrage''s fictional account of his experiences with his SmartHouse appearing
    in the Los Angeles Times in 1993. When I checked with a search device, I found
    variants of it at about 100 places on the Net. Here''s one of them: http://www.shults.com/hypermial/jokes/007.html.


    On-line toaster jokes have also made their way around the Net. Here''s one source:
    http://web.shortly.com/geeks/96/dec/msg00000.


    # URLs for Stereolithography and Manufacturing


    Brian Curless and Marc Savoy, Stanford University. Describes building a 3-D fax
    machine by combining range-scanning technology with stereolithography. http://www-graphics.stanford.edu/projects/faxing/happy/


    Modern Machine Shop. A professional on-line magazine about trends and technologies
    in automated manufacturing. http://www.mmsonline.com


    University of Utah. Department of Mechanical Engineering Home Page. Information
    on rapid-prototyping technology. Includes extensive lists of commercial systems
    for rapid prototyping, concept modelers, vendors, service providers. and an on-going
    record of research projects, literature, and conferences around the world. http://stress.mech.utah.edu/home/novac/rapid.html


    # Epilogue


    Hodder, Ian. 1982. Symbols in Action. Ethnoarchaeological Studies of Material
    Culture. Cambridge, England: Cambridge University Press.'
