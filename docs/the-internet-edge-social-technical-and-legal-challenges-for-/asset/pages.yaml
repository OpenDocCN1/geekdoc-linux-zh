    # Boundaries and Threats


    We use threat analysis to determine in advance what can go wrong in a system,
    whether through malicious interference or equipment failure. The likely attacks
    on an actual implementation—and the kind of analysis needed—vary according to
    the particulars of the implementation. In practice, what matters is the examination
    of possible threats be systematic, thorough, and as realistic as possible. The
    analysis described in this section is intended to be educational and to provide
    a point of reference for our later discussion of security measures.


    # What''s Worth Stealing?


    To begin, it is worthwhile to account for the potential values (positive or negative)
    of some possible attacks. If a digital work is encrypted, there is little risk
    it will be copied when it is stored or transmitted; but if it can be stored in
    an unencrypted format without authorization, the risk is that the publisher or
    rights owners will lose revenue from unauthorized use or copying. The owner can
    limit this risk in various nontechnological ways—for example, by carrying insurance
    against leakage of works. System design can also be built into all trusted players
    measures test the bonafides of various works, perhaps enabling them to watch for
    and report the sources of works identified as rogue copies. Such measures would
    increase the risks to those trying to defeat security measures (Samuelson 1996a).'
