    Cautionary tales that transform the automated home into the haunted house exemplify
    broader worries about the lack of safeguards in current computing practice. Connecting
    appliances together in a standardized way and linking them to the Net offer innumerable
    opportunities for using information from a wide variety of sources. Without adequate
    safeguards, however- such connectivity risks random interference, counterproductive
    appliance behavior that is difficult to debug and control, and unwanted surveillance
    by computer systems representing other, potentially antagonistic interests.


    These concerns reflect the Internet edge for networked home automation. They need
    to be addressed before home automation and connection to the Net can become widespread.
    How do we know we can trust our home automation systems? How do we know we can
    trust software and information that comes into a home system from the Net? How
    do we know who is using information gathered by sensors in a home automation system,
    or how it is being used? In this regard, the trusted technologies discussed in
    chapter 3 could become crucial for home automation as for digital money and digital
    publishing. For example, they could protect confidential information, reject unauthorized
    programming or control signals, and provide failsafe control policies.


