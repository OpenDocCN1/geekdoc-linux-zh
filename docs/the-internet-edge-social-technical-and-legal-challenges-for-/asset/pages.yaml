    still a long trust boundary to defend. An attack on virtually any module in the
    trusted system can lead to loss of data, privacy, or funds. One response to this
    is to locate all the modules within a secure processor, such as a PCI card, which
    contains memory, a clock, and disk storage. At the current state of the art in
