    # Privacy-Enhancing Technologies


    Sure, you can tuck away few loose threads of information about where you go on
    the Web by surfing anonymously and using re-mailers to hide your email comes from,
    the legal shield that surrounded your real-world records is now as brittle as
    a bird’s egg. Charles Pappas, “To Surf and Protect”


    During the early 1980s, when artificial intelligence (AI) was receiving a great
    deal of commercial and media attention, confusion about the field came from naive
    enthusiasts as well as pessimists. Pessimists tended to demand perfection, which
    may have discouraged researchers with simple ideas from pursuing them through
    a potentially long road of incremental improvement. Enthusiasts, on the other
    hand, suffer from a different illusion: they'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'believe computers are naturally endowed with superhuman capacities. You can
    understand these twin dangers by imagining your favorite complex-world puzzle,
    such as “optimally timing all the traffic lights in a big city” or “perfectly
    diagnosing a patient’s disease.” The sillyest and most unrealistic enthusiast
    would argue that because the problem is difficult and has baffled experts for
    a long time, the only approach with any hope for success is using artificial intelligence—typically,
    a computer with a knowledge-based system. The sillyest pessimist would continue
    to focus on the most difficult cases without noticing that most common cases are
    simple and straightforward.


    However, understanding the confusing relationship between privacy and technology
    brings the same extremes. The complexity of the privacy problem is illustrated
    by the various legislative attempts to address it. There may be, admittedly, no
    perfect solution. It certainly seems that no fixed set of privacy rules can cover
    all situations, the situational requirements and human sensitivities vary so much.
    On the other hand, even though computers aggravate the privacy problem by making
    it easier to collect and correlate data, they may also provide us with leverage
    for alleviating the problem. At the very least, exploring the possibilities of
    using computers to enhance privacy can help illuminate the nature of the requirements.


    # Key Recovery and Key Escrow


    One such form of technology many government agencies and on-line providers rely
    on encryption. Encryption is a process of encoding a digital work by using a secret
    key to render it unusable by anyone without the key. Decoding a work to restore
    it to usable form is called decryption. The preferred method of encoding is public-key
    encryption, in which there are two keys: a public key and a secret private key.
    When the private key is used to encrypt a work, the public key can be used to
    decrypt it.


    Encryption is at the core of many systems for secure communications and electronic
    commerce. Encryption can be used to protect works or documents stored on a file
    system. Even if someone makes an unauthorized copy of a record, it will not be
    readable without the key. Encryption can also be used to protect a work on a communication
    channel (e.g., the'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# The Digital Keyhole 217


    (Internet), so defeating the activities of a wire tamper or hacker. In addition,
    publishers can use encryption to digitally “sign” (identify) a digital work. When
    a person who has published and well-known public key encrypts a message with his
    or her secret private key, the recipient can be sure—because the private key is
    kept secret—that the message actually comes from the public key holder. Without
    the private key, nobody else could have encrypted it.


    There are two basic ways to defeat encryption: cracking the code and stealing
    the private key. The security of cryptographic methods depends on the mathematical
    difficulty of the code and the obstacles to obtaining the key through some other
    covert means, including a computer attack. In a properly designed key, the difficulty
    of cracking a code mathematically increases with its length.


    Throughout the 1980s and 1990s, there was a debate in the United States about
    the regulation of encryption technology. The various turns and twists in this
    story are too complex to review here. However, the debate turned (and still does)
    on the tension between values: national security and law enforcement on one side
    and personal privacy on the other. The commonly accepted national security argument
    against allowing free access to encryption technology is that it would let enemy
    agents transmit secret messages; the use of very long keys would make it unlikely
    that intelligence organizations would be able to intercept such messages and break
    the codes. On the domestic front, encryption technology would allow organized
    criminals to cipher their communications, transmit funds electronically, and easily
    defeat the surveillance capabilities of the civil authorities. Even so, as advocates
    of privacy and personal security point out, the availability of commercial products
    supporting long encryption keys in other parts of the world (including Europe
    and Japan), renders U.S. laws governing key length essentially ineffective.


    Nonetheless, during the early 1990s, the U.S. debate focused on regulating key
    length to control encryption technology. Privacy advocates argued for keys longer
    than the forty-bit and fifty-six bit keys the regulations allow on particular
    kinds of systems. The routine breaking of forty-bit keys by student programmers
    using idle computer time have demonstrated that forty-bit keys are vulnerable.
    Even the fifty-six bit length used in the popular digital encryption standard
    (DES) becomes more'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Chapter 8


    vulnerable every year as computer speeds increase in accordance with Moore''s
    Law. Recognizing that technology does not stand still, we need to add another
    fourteen bits to key length for every twenty years of desired protection.


    By the mid–late–1990s, however, much of the debate had shifted away from the regulation
    of key length to the pros and cons of key recovery, key escrow, and trusted third-party
    encryption systems. These approaches differ in their details. What they have in
    common is the understanding that long secret keys can protect data, they must
    also provide a way for authorized parties to gain access to secret keys under
    certain circumstances.


    Early key-escrow systems depended on a government department that held in escrow
    a master key to each encryption device; the key was released to a law enforcement
    agency as needed. The term key recovery was originally used to refer to systems
    in which a key is broken into parts and stored on different systems; the key can
    then be recovered by a process that brings the parts together. The term is now
    used as a generic name for a variety of techniques.


    The value of key recovery goes beyond law enforcement. In the absence of such
    an approach, owners of data can access to their own data if a key is lost or stolen.
    An organization could be prevented from using the data in its systems when an
    employee leaves without notice or dies suddenly. Thus, for many commercial applications,
    there is an incentive to keep backup copies of keys.


    Much of the debate about key-recovery systems has related to the need to recover
    keys for different purposes. For example, it makes little commercial sense to
    have backup copies of keys used simply to sign messages. A date at which a new
    key becomes valid can easily be established; after an old lost or stolen key is
    no longer valid. Furthermore a key for a single communication session, as one
    telephone call, is not worth backing up, as such keys are generally negotiated
    by encryption equipment at the beginning of each call.


    It has been suggested that, from the perspective of law enforcement, it makes
    sense to be able to recover a key without the knowledge of the user, so that data
    contained in a system can be accessed during an ongoing investigation. Access
    to the key should be rapid—within two hours under some proposed regulations—and
    obtainable at any time of the day. Finally,'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# The Digital Keyhole 219


    all sorts of keys—whether for signing, communication, or for access to stored
    data—should be available to authorities.


    The operational details needed to organize a national key-recovery system are
    many. In the United States alone, there are over seventeen thousand local, state,
    and federal law enforcement agencies. The possibility of insider or corrupt action
    within any agency, the potentially large number of keys needed, and the desire
    for rapid delivery of keys to law enforcement agencies present enormous operational
    challenges as well as the risk of substantially lowering the security of encryption
    systems in general. At the time of this writing, a technical advisory committee
    staffed by representatives from different sectors of the information-processing
    industry is working with the National Institute of Standards and Technology to
    develop recommendations for a Federal Information Processing Standard for key
    recovery.


    Encryption technology is a central element of all modern approaches to security
    and privacy. In the United States, the ongoing debate about the need and practicality
    of regulating encryption devices seeks to balance requirements for national security,
    law enforcement, commercial viability, and personal privacy. Encryption technology
    is not, however, the whole story but a part of what we will need in order to build
    trusted systems.


    # Privacy Preferences and Trusted Systems


    In chapters 3 and 4, we explored the potential for trusted systems in publishing,
    emphasizing the value of security to publishers. That discussion focuses on the
    design of systems to guard against unauthorized use of digital information owned
    by authors and publishers. There is also—from a privacy perspective—a reverse
    kind of danger relating to consumers’ on-line reading or visiting habits. Could
    systems that safeguard publishers’ information also be designed to guard the privacy
    of consumers?


    One step in this direction is the Open Profiling Standard (OPS) proposed in early
    1997 by Netscape Communications, Firefly Network, Inc., and Verising, Inc. Among
    other things, OPS is designed to respond to concerns about the information web
    sites gather about their users. In the late 1990s, web site managers interacting
    through protocols with browsers could employ numerous means of collecting data:
    they could ask users to fill'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'forms; they could record the data trail—known as “cookies”—that users'' activities
    generate; they could gather information from the browser about other sites their
    users have visited; and they could run programs that search individual users''
    files.


    The OPS architecture reflects an interesting blend of commercialism and concern
    for privacy. The philosophy behind centers around three principles: (1) control
    by source, (2) informed consent, and (3) appropriate-value exchange. The control-by-source
    principle says that parties responsible for creating information should control
    its dissemination. These parties include both individual users and any entity
    that gathers profile data. Informed consent means that parties requesting access
    to a user''s profile must receive the sources before collecting and using the
    information; they must also provide complete information about how the data will
    be used. The principle of appropriate-value exchange means that no party should
    collect information about a person without offering something of value exchange.
    Thus, there should be some benefit to the user for providing a profile. If, for
    example, a party requests a user''s e-mail address, the data exchanged might be
    free updates or news delivered by e-mail.


    At the same time OPS was being formulated, the Internet Privacy Working Group
    (IPWG) began to develop what it called the Platform for Privacy Preferences (P3P).
    P3P extends an earlier proposal, the Platform for Internet Content Selection (PICS),
    adding capabilities for notifying users and obtaining consent to negotiate with
    them about preferences, policies, and information exchange. In addition, P3P incorporates
    a machine-readable grammar to facilitate network negotiations. In mid–1997, the
    OPS and P3P projects were unified.


    Although OPS principles fall short of those established by European privacy laws,
    EU directives, and the proposals of privacy advocates, they head in the same direction.
    For example, the principles of 95/46/EC, which describes particular individual
    rights to privacy, are somewhat comparable to the OPS principle that vests control
    over data in the source. However, the EU directive (unlike OPS) also specifies
    certain exceptional cases in which requirements are less stringent; for example,
    when data are collected for national security, statistical, or journalistic purposes.
    It also specifies institutional requirements for oversight authority and enforcement
    that are'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# The Digital Keyhole 221


    missing from the OPS principles. U.S. law too goes beyond OPS by categorizing
    certain kinds of data—such as credit information, telephone records, and educational
    records—as sensitive. In contrast, OPS principles leave these distinctions in
    the hands of the consumer and other sources. On the other hand, the OPS specification
    allows users to name a trusted third party that can certify an agent to handle
    privacy data. If the third party has a reputation for holding privacy values consistent
    with those of the user, and is competent in monitoring the agent''s activities
    and enforcing, users may decide that this is as much assurance as they need.


    An interesting feature of the OPS approach is that it is intended to be mostly
    automatic. It would give users full control of data collected about them by managers
    of a web site. Leaving aside the moment questions about exactly what rules ought
    to govern personal data, a crucial question is whether computer systems can be
    trusted to follow the user’s instructions. This point brings us back again to
    issues about the design of trusted systems.


    # Threat Analysis and P3P


    The threat analysis of trusted-system architectures we discussed in chapter 3
    considered both hardware and software attacks. In a 1990s convention-designed
    personal computer, viruses and rogue software are serious security risks, because
    they can make radically changes to the files and software on a system. Instead
    of redesigning the hardware of the installed base of systems, the approach we
    considered controls the loading of all programs—checking that they have been certified
    and verifying that they have not been tampered with. Any approach with a lower
    level of security this is, in principle, subject to arbitrary attacks by unrecognized
    viruses.


    This is not that OPS or P3P effects, as drafted in 1997, were unaware of trust
    and security issues. In fact, P3P’s developers intended to make it possible for
    web sites to express their privacy practices explicitly and for users to make
    choices about those practices and have their computational agents enforce those
    choices. Indeed, the draft documents outlining the architecture and grammar for
    P3P even mention a “trust engine,” although it is defined only as a mechanism
    for evaluating incoming'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 222 Chapter 8


    statements before a decision is made—typically just some code associated with
    a network browser. It is not specified as a trusted system in the sense we use
    the term in chapter 3. The idea of using digital certificates to certify sites
    actually follow the practices they express is undeveloped in P3P specifications
    (at least as of 1997). Also undetermined are the mechanisms used to ensure that
    computers participating in the dialogue about practices and preferences have not
    themselves compromised or tampered with some way. In short, P3P has no solid provisions
    for protecting personal data from the kinds of threats security analysts consider
    most important.


    This brings us to a vulnerability of OPS as. In the absence of a trusted-system
    architecture, a rogue program or virus could, in principle, render ineffective
    all of the user''s specifications about how he wants his data protected. In other
    words, a virus entering the system at any time could change the user''s profile
    or change the way programs see the profile so to make the protected data available
    to unauthorized systems. It could also cause the system to provide web sites with
    false or bizarre profile about the user and his or her interests or habits, with
    consequences that could last for years.


    Like for copyright protection, the trust issue for OPS and P3P extends to safeguarding
    the information after it has been released. The web itself must be a trusted system
    that will tag the user''s data with instructions about its use and keep that tag
    associated with the data as long as required. In addition, it should provide the
    tagged data only to other trusted data processors upholding the same rules. In
    this regard the privacy rights for personal data are essentially identical to
    usage rights pertaining to digital works. The analogous infrastructure would require
    all systems processing users'' private data to be the kind of trusted systems
    described for copyrighted works. By building systems that benefit both consumers
    concerned about privacy and publishers, trusted-system vendors could greatly increase
    the perceived value of their products.


    The central focus of debate about privacy on the Internet is the handling of personal
    on-line data. The basic goal of P3P and OPS, is to bring the users'' private data
    under their control and put the responsibility for handling the data under the
    automatic control of the computer systems, has not yet'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# The Digital Keyhole 223


    been achieved. In all fairness, we should point out that these architectures were
    proposed as something that could be done right away, without creating a trusted
    system infrastructure. These proposals bring us, therefore, collectively face
    to face with an interesting point at the Internet edge, where the advantages of
    networking and a desire for privacy and security create both risks and opportunities.
    Building an infrastructure to bring reliable balance and security will not be
    a one-off, quick collaboration. It will require more time and a deeper investment.


    # Visibility, Accountability, and Scale


    Enthusiasts of the Internet often rejoice that it has created a virtual “global
    village” replete with opportunities for new and cozy relationships with people
    around the world. Yet, if we compare the current situation with regard to trust
    and computers to the development of trust among people in a small village, we
    find three elements that impede the creation of on-line trust.


    +   *Visibility.* Much of what happens on a computer is just invisible. When data
    are collected by a computer or sent to a third party over a wire, the activity
    is hidden from the data subject.

    * *Accountability.* When data travels from one computer to another, or is combined
    with other data, information about how the data or should not be used is not included.
    Data carry no tags identifying their source or specifying what users have made
    for their use. If people or computers use data in ways that violate such agreements,
    there is no automatic accountability.

    * *Scale.* The methods that work to create cohesion and trust in a small village
    depend on people knowing each other. The methods that work for states and nations
    depend on legislative techniques that also require people to be identifiable and
    they reside within a fairly restricted geographical area or legal jurisdiction.
    The Net, by contrast, connects people and organizations that may be hard to identify
    and live in all parts of the world.


    These elements are central to the fears many people experience about on-line privacy.
    Furthermore, any approach to data protection that fails to address these differences
    will face continued resistance to adoption of a new technology. Without visibility,
    people can fear that things are happening that they cannot see. Without accountability,
    there is a sense that releasing data'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 224 Chapter 8


    is like letting the genie out of the bottle. Nobody knows where the data goes,
    and it becomes difficult to hold people or organizations accountable for their
    use of them. The issue of scale makes it necessary to match the methods for handling
    private data to the scale of the problem. If the problem spans computers across
    networks, then the solution needs to operate in the same space.


    These three factors may seem to make the data-protection problem totally intractable.
    For example, we might think that invisibility and intangibility are inherent to
    electronic computers and communication. Basic physics tells us that something
    in a computer has to move very fast in order to compute quickly and travel long
    distances quickly. The smaller and lighter things are, the more they can move.
    Today’s computers use electrons, which travel at about half the speed of light
    and are far too small for computer users to observe directly. Even, which seems
    instantaneous when we are talking with someone in the same room, is slower than
    the electrons that carry our voices over telephone lines. If telephones used sound
    waves instead of electrons for coast-to-coast calls in the United States, conversation
    would be very silent, because it would take over three hours for the sound of
    our voices to travel one-way across the country. We would need to wait at least
    six hours for the answer to any question. Thus, smallness, lightness, and intangibility
    are fundamentally important to our ability to interact with each other over national
    and global distances.


    However, despite these observations, computers can be among the most powerful
    instruments for making things visible. In the past few years, research on information
    graphics has grown enormously, bringing new methods of visualization to both scientific
    and information-management applications. Computers can pick out tiny events from
    massive amounts of data and highlight them. In short, lack of visibility is not
    an inherent property of computers.


    We might think, too, that lack of accountability is intrinsic to information processing.
    After all, all data can be combined from many sources. Data files can be merged.
    When data appears in a program or computer memory, who can say where it came from?
    How could any computer ever be held accountable? Nonetheless, computers are actually
    among the most powerful instruments for accountability. They are the crucial foundation
    of record keeping and accounting that takes place in the financial houses of'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# The Digital Keyhole 225


    the world and the accounting departments of all small businesses and major corporations.
    They are the most reliable memory for the detailed personal budgets of personal
    computers. In short, lack of accountability is not an inherent property of computers.


    Finally, we might think that scale is as innate to computers and will inevitably
    defeat any system of privacy. As suggested above, there is an interesting parallel
    between copyright and privacy. Copyright law governs the use of published works
    just as data-protection laws in privacy govern the use of personal data. When
    the digital medium and desktop publishing first appeared, publishers were afraid
    that unregulated copying on computers would undercut their ability to make a living.
    They withheld their works from the digital medium. With the network becoming ubiquitous,
    citizens concerned about privacy are experiencing a similar uneasiness. They fear
    that copying and the unregulated use of their personal data will undermine their
    privacy and interfere with the enjoyment and independence of their lives. They
    are inclined to withhold personal data from the Net—even though they are attracted
    to the advantages the Internet could provide if they did not need to worry about
    privacy.


    Their concern brings us back to the idea of creating trusted systems for personal
    data. In such systems, privacy rights for personal data could be tagged the same
    way we can tag usage rights on published works. Analogous benefits would accrue
    to owners of data. The same security issues making making systems worthy of trust
    would have to be met, and similar institutional and infrastructural operational
    problems would have to be solved. The legal basis for our proposed trusted system
    for digital publishing could be established by shifting the basis of protection
    from copyright law to contract law. In trusted systems for privacy, the legal
    basis for protection could also shift, from privacy law to contract law. Privacy
    rights could be treated as digital contracts for using personal data and enforced
    by trusted systems.


    # Privacy Rights and Trusted Systems


    Today''s computers and installed software are not programmed to honor privacy
    rights. As suggested in the discussion of OPS and P3P, one method of ensuring
    privacy with trusted systems is to extend the notion of compliance and trustworthiness
    to other systems in the chain. Billing systems, for'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# Chapter 8


    example, could be tested for compliance with policies for data accuracy, reporting,
    and aggregation. If a consumer’s personal computer or PDR is a trusted system
    and the interacting financial clearinghouse is not, the latter would be unable
    to pass the challenge-response protocol for processing billing and usage data
    and would not gain access to personal data. The user’s trusted system would only
    communicate data to a financial clearing-house or data aggregator that is appropriately
    certified.


    In digital publishing, as discussed in chapter 3, exceptions to allow free use
    of a digital work would be governed by the fire doctrine. Analogous conditions
    of free access to personal data could be limited to rare and suitably qualified
    and regulated interventions in the public interest, such as law enforcement, national
    defense, and (possibly) census taking. For example, government investigators working
    on a criminal or official case might want access to private records contained
    in a trusted system in order to monitor an individual’s reading habits or an organization’s
    publications and subscribers. Depending on the surrounding facts and circumstances,
    such access could be a legitimate use of authority or a violation of civil liberties.
    Presumably, the protections of the Fourth Amendment against unreasonable search
    and seizure would apply to trusted systems. Would present-day laws—such as statutes
    prohibiting unauthorized wiretapping—adequately safeguard the privacy of users
    of trusted systems while making the interests of government into account? Or would
    we need new protective legislation specifically tailored to trusted systems? These
    are important questions that we must leave for another day.


    The trusted-system approach to protecting and accessing personal data would help
    balance commercial interests with privacy interests. However, one consequence
    of introducing the privacy issue into the overall scheme for protection of intellectual
    property is that it adds financial clearinghouses to the set of participants whose
    interests must be balanced. The financial cost of building trusted systems is
    substantial. In its absence, initiatives like OPS and P3P may be workable first
    steps toward a privacy infrastructure. Financial clearinghouses for usage data
    have already been built for applications such as DirectTV subscriptions, suggesting
    that there is a financial incentive to develop such services. Privacy concerns
    argue in favor of going the extra step to create software systems that comply
    with'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'codes of trustworthiness according to specified privacy rights. Stakeholders
    in this area would include financial clearinghouses and data aggregators, because
    their systems would need to keep track of and honor privacy rights.


    # Trusted Systems in Untrusted Institutions


    Ultimately, however, even trusted systems in institutions staffed by fallible
    (and perhaps untrustworthy) individuals will not be able to protect privacy. The
    pragmatic aspects of protecting private data are more difficult than those of
    protecting copyrighted works. A copyrighted multimedia encyclopedia on a CD-ROM
    contains almost a gigabyte of information. Even shorter copyrighted works often
    contain tens of thousands of bytes of data. Because it is quite expensive to create
    such works by hand, trusted-system assurances that a work cannot be casually copied
    from one machine to another will probably be borne out.


    In the case of personal information, however, the amount of information to be
    protected is often much less, and this creates a different risk. A lot of sensitive
    information—such as family names, social security numbers, salaries, credit card
    numbers, birth dates, addresses, and medical records—can be packed into very little
    space. Suppose that a system inhibited the copying of such information to an untrusted
    repository but allowed a clerk to display it on a computer screen. It would take
    only a few keystrokes for him or her to enter the information on a second computer,
    with no safeguards against the trustworthiness of the person at the keyboard.
    This is the “re-keying issue.” Once private information is removed from the trusted
    environment, it can be sent anywhere.


    This scenario suggests that control over individual information might need to
    be much tighter than corresponding controls of copyrighted works. One approach
    to the re-keying problem might be to allow display of personal data only as part
    of a suitable aggregation; the trusted system would therefore refuse to display
    information about a particular person but would provide data about groups so large
    that sensitive information about any individual would be difficult, if not impossible,
    to discern. Another measure would be to periodically create track records, that
    is, records of nonexistent people, then offer this information to suspected untrustworthy
    sources and watch to see whether the data are leaked.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Finally, proactive ways of checking the privacy performance of organizations
    on the Net may be crucial to maintaining privacy. Trusted systems, by themselves,
    will not be able to ensure that small amounts of private data released only to
    trusted organizations will stay private. In this regard, the old advice never
    to divulge truly sensitive information still seems sound.


    # Privacy Services on the Net


    In the absence of trusted systems and widespread adoption of privacy principles,
    a few privacy-related services appeared on the Net in the late 1990s. These included
    anonymous e-mail, anonymous web surfing, and privacy-related search services.
    There are different notions of anonymous e-mail, but the most basic kind is a
    service that will remain an e-mail message without any identifying information
    as its source. Anonymous web surfing is a service for browsing that shields information
    about a user from protocols that attempt to read data off the individual''s computer.
    Finally, subscribers to services such as Privacy Inc. can search through three
    hundred state, local, and law enforcement websites to learn whether their names
    are listed on any of them. Yet other companies are providing services to tell
    a subscriber when anyone requests or her credit information.


    Although these services are intended to advance the cause of privacy, their effectiveness
    is open to question. Anonymous web surfing may prevent the linking of personal
    data for free browsing. In principle, it could be combined with anonymous digital
    cash for privacy in for-fee browsing as well. Anonymous e-mail raises questions
    analogous to those raised about caller-ID services in the telephone system (i.e.,
    about a caller''s true identity). Neither of these approaches has yet gained widespread
    use.


    # Reflections


    We used to live in villages. We are moving toward a global village now, so perhaps
    it''s inevitable . . . we will know all about our neighbors again.

    Carole Lane, *Naked in Cyberspace*


    When Steve Mann asked about the need for surveillance cameras in a department
    store, the clerk''s response was like a line from a bad movie: “You don''t have
    anything to worry about if you haven''t done anything'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# The Digital Keyhole 229


    wrong, do you?” Similar questions come up when people discuss anonymous e-mail
    (“What are you hiding from?”) or anonymous web searching (“What are you looking
    at that you don’t want people to know about?”). However, in a social context,
    trust comes from experience with other people. Our concerns about privacy and
    computers arise from the need to trust people we do not know and whose motives
    are unclear to us, whom we often see and who we will probably never identify.


    The mechanisms we use to create definitions of order and trust in social groups
    vary with the size of the group. The larger the group the more formal are the
    structures and mechanisms—such as codified laws and courts—that regulate our relationships.
    In the area of privacy, creating specific and practical rules has proven to be
    a difficult undertaking.


    Part of the difficulty we have in defining such rules is that the value of privacy
    competes with many other social values. In the middle of a criminal investigation,
    personal privacy competes with effective law enforcement. A video surveillance
    camera in an isolated parking lot pits our desire for privacy against our need
    for personal safety. When someone is gathering facts for a news story, privacy
    competes with freedom of information. When someone uses personal data to target
    potential customers by focusing direct mail on their interests, privacy competes
    with business efficiency. When privacy regulations affect the flow of information
    across national borders, privacy may compete with international trade. When a
    child retreats to his room to dance without anyone watching and evaluating him,
    privacy and individuality compete with socialization and conformity.


    Thus concerns about privacy interact in complex ways with many aspects of our
    social lives. When these values come into competition in real life situations,
    the appropriate point of balance depends on the particulars of the situation.
    Imagine, for example, that computer processing of video images has so much that
    it is possible for computers to recognize faces and identify people automatically.
    This is not yet practical in the late 1990s, although, given some extension of
    the present capabilities of technology, it is no longer utterly unimaginable.
    Suppose that Joe is walking down the street on a summer day near a department
    store. A street camera picks out his image and forwards it to a computer network
    for “customer opportunity” processing. It checks the quality and style of Joe’s'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'clothing, his credit rating, his cellular telephone number, and a few other
    items. Moments later his cell phone rings, and a salesperson at the depart- store
    invites Joe to take advantage of a sale on some coats in his cus-tomary style,
    size, and price range. This surveillance, computer-image processing, and automatic
    use of personal data for very direct marketing a violation of Joe''s privacy?


    If so, consider that in some street markets, essentially the same kind of interaction
    takes place when a streetwise clerk sizes up Joe as he walks and makes a pick.
    In court in which someone claims a violation of privacy, the court''s decision
    has often turned on whether a person in that circumstance can reasonably expect
    privacy. Perhaps in we should have lit-tle expectation of privacy when walking
    down the street, whether the inter-ruption is computed or not. The expectation
    depends on the culture of the street.


    The example illustrates the great complexity of our rules for privacy. Not only
    does privacy interact with many social values, but those values themselves depend
    on culture. Given the wide variations in human culture, it is probably not realistic
    to expect to get a global standard for something as complex and subjective as
    privacy.


    Nonetheless, in 1997 the International Standards Organization''s (ISO) Technical
    Management Board looked into the possibility of establishing a privacy standard.
    The U.S. representatives opposed the idea, arguing that without European commitment
    to write and use such standards, producing them would waste the ISO''s resources.
    At least as mid-1998, neither the EU nor the bodies in charge of individual European
    national standards sup-port the ISO effort.


    # A View from the Edge


    We can look at all the changes that have occurred in privacy regulation over time
    as evidence that the legal definition of privacy is still evolving. From this
    perspective, what we need is to get the laws right. Unfortunately, the dif-ferences
    between cultures and the complex trade-offs in competing values that arise in
    real situations do not bode well for establishing uniform and universal laws of
    privacy. Furthermore, to workable any approach will'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# The Digital Keyhole 231


    have to address the three obstacles to human acceptance—visibility, accountability,
    and scale


    We can, however, thoughtfully consider a different approach to privacy at the
    Internet edge. Computers have helped to create new problems of privacy; some of
    the elements that make them so attractive for electronic commerce and digital
    publishing on the Net can undermine our privacy. Nevertheless, we may find the
    resource we need to deal with and transform the privacy problem in the very nature
    of computers themselves. We need to discover a way to make invisible things, ensure
    accountability, and scale up to a global network.


    In this chapter, I have made the point that although we don''t usually associate
    “publishing works” with “keeping data private,” putting personal data on an Internet-connected
    computer is akin to publishing it. Thus we can also speculate that the form of
    computer best suited to digital publishing, and the usage rights best adapted
    to protecting published works, will be analogous to those needed to ensure privacy
    rights for personal data. Just as usage rights and trusted systems can tame computers
    that are engines of opportunistic copyright infringement, privacy rights and trusted
    systems can prevent computers from being engines of opportunistic intrusion and
    privacy violation. We may find that building trust into our computers will enable
    us to offer a new kind of trust to people we can''t see—people we don''t watch
    on our computers but who share the world with us.'
