  md: '# Chapter 3


    Another potential risk is the change or misappropriation of the user’s private
    encryption key. Changing the user’s private key would be (at the very least) an
    inconvenience, as it would deprive the user of service until the situation is
    straightened out. In the meantime, the misappropriator could make fraudulent changes,
    damage the user’s credit, or violate the user’s privacy. If a user’s private keys
    are taken, the attacker can access all the works on the system, and furthermore,
    acquire additional works until the theft is detected or a credit limit is reached.
    An attacker who accesses or changes the billing log could delete or add billing
    data, resulting in inconvenience and perhaps lost revenues for rights owners.
    One means of reducing this risk is to arrange for transactions involving multiple
    systems to be reported to separate clearinghouses and then reconciled. In such
    cases, events not reported by one system would probably be reported by another.


    Stolen digital certificates would have very little value to the attacker, because
    they need to be validated when used. Tampering with digital tickets is another
    matter. Digital tickets are limited-purpose digital tokens comparable to script
    or coupons for certain rights. They are prepaid and be used once. Copying digital
    tickets is, therefore, very much like stealing or counterfeiting money.


    To summarize: the security of trusted systems depends on protecting users’ private
    keys and passwords, system private keys, digital tickets, and the billing log.
    In addition, attacks can cause damage when no data are stolen. The purpose of
    an attack might be, for example, to destroy a copy of a work, undermine the reputation
    of a competitor, create an inconvenience for a user, or obtain commercially useful
    information in violation of a user’s privacy rights.


