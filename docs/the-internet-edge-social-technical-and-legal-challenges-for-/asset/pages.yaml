    The consumer receives a digital license agreement, selects the one-time-use option,
    and pays for the movie with his or her credit card. The consumer’s computer stores
    an encrypted copy of the agreement and then receives an encrypted version of the
    movie. When the user wants to watch the movie, a special computer program (the
    “player”) matches the encrypted movie with the licenses stored in the computer.
    If a valid license is found, a key unlocks the movie and allows the user to view
    it. Once the movie has been played, all that is left a scrambled file—unless the
    license is updated and another fee is paid.


    Safe as such a system may sound, it is vulnerable to several possible attacks.


    # Copy Attack


    After receiving the movie and the license, but before watching it, the user can
    foil the system by copying the movie and the license to backup storage. To view
    it a second time, the user first deletes the license and the reen-rypted movie
    from the computer, then retrieves the unaltered license and movie from backup
    storage, thus restoring the system to the state it was in before it was played—permits
    the user to watch the movie a second time. If the user’s system has a tamperproof
    clock, this attack can be thwarted by using time stamps that limit the use of
    the movie or certificates to a given time. As most computers do not have tamperproof
    clocks, the user can first reset the system clock to the time at he or she purchased
    the movie.


    # Fake-Player Attack


    A more sophisticated attack can be used by a skillful programmer to decom-pile
    the player module and make a new version of it without the security-'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Chapter 3


    enforcing features. This modified player can be posted on bulletin boards around
    the Net (until authorities find out and object) or sent around more surreptitiously
    to people on underground mailing lists. This attack creates the risk of a catastrophic
    system failure for the publisher that could affect all the works using this technology.


    # Virus Attack


    This attack is like the fake-player attack, except that the modifications to the
    player program are caused by a computer virus turned loose in the network. In
    this case, the people who watch the movie for free are arguably not guilty of
    willful infringement. They can say they did not realize that their free use of
    movies was caused by an undetected virus.


    # Liberator Attack


    This attack is, again, like the fake-player attack, except that the player is
    modified to make an unencrypted copy of the movie, which is then circulated on
    standard video-player applications. This attack can be thwarted to some degree
    by watermarking the movie so that the identity of the original purchaser can be
    determined from any copy in circulation. A hacker defense against such tracing
    is to use a stolen credit card to buy the movie in the first place. In either
    case, the publisher is unlikely to recover damages.


    At the time of this writing, Company X''s product is not in widespread use. Conventional
    wisdom in the security community is that systems like this will be broken when
    they are widely used—resulting in a very public “hostile review” and failure.


    # Reflections


    Trusted systems are at a nexus of several forces at the Internet edge. The market
    opportunity for digital publishing is a powerful force for change. But a countervailing
    pushback for the status quo is the inertia created by the huge installed base
    of computers and software designed for neither security nor commerce.


    Legal and political forces are moving into the fray in several industries. In
    chapter 4 I consider the evolution of laws related to Internet commerce,'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# The Digital Wallet and the Copyright Box 77


    especially with regard to the interplay between copyright and contract law. The
    evolving political issue of U.S. export policy for cryptographic technology will
    also influence the development of trusted systems. Because of their original application
    to military and intelligence communications, cryptographic systems are controlled
    and classified under import and export regulations as “munitions.\ Another concern
    about cryptographic methods is that they could routinely used with impunity in
    socially harmful ways—for example, by enabling organized crime to enjoy secure
    records, secure communications and invisible money-laundering.


    Meanwhile, foreign suppliers of cryptographic technology have begun to use longer
    keys (thereby achieving higher levels of communication security) than their American
    competitors. The overall effect of this situation on the security of trusted systems
    is limited, because they are currently constrained more by the lack of certified
    applications and operating systems by regulations about the length of encryption
    keys.


    At its core, the drive toward digital commerce and publishing is a shift that
    lets local businesses increase their global reach by taking a shortcut through
    cyberspace. However, cyberspace is not only fast and ubiquitous; it is also invisible
    and intangible. Relying on cyberspace as it exists today, we are moving from local
    commerce in tangible goods with neighbors that we know and trust to a trade in
    invisible goods with people we don’t know who use computer systems that we need
    to trust. It is easy to see why this journey to the Internet edge provokes so
    much pushback and uncertainty.


    Political life abounds with issues of boundaries and trust. American currency
    bears the phrase “In God we trust.” President Theodore Roosevelt was widely applauded
    for his advice to “Walk softly and carry a big stick.” When we do give our trust
    to neighbors, governments, foreigners, computers, or ourselves?


    Trust is not simply given; it is built and earned. If we cannot trust systems
    and the invisible and intangible processes that drive them, our only alternative
    is to increase the visibility and tangibility of those processes. The current
    chaos at the Internet edge reflects confusion, because we have no assurances of
    system integrity. To be trustworthy, systems for'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Internet commerce and publishing to visibly demonstrate their integrity and
    the accountability of the entities they represent.

    Computer systems have the potential to provide wonderful visibility and accountability.
    Just as bank systems provide an audit trail in monthly statements, so trusted
    systems could provide accounting summaries. Just as political institutions back
    up the occasional bank failure and respond to claims of errors, so new institutions
    could stand behind computer systems for commerce. Creating institutions that can
    certify trusted systems is part of the overall challenge of enabling the information
    marketplace to grow. Viewing trusted systems in this light makes it clear that
    there is important social and legal work to be done at the Internet edge.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 4 The Bit and the Pendulum: Balancing the Interests of Stakeholders in Digital
    Publishing


    Information doesn''t want to be free.

    It wants to be paid for.

    Member of the audience, Computers, Privacy, and Freedom Conference, March 1997


    The drive toward digital publishing reflects our need to be heard. It speaks powerfully
    to the dream that everyone ought to have instant access to the best ideas, the
    most creative works, and the most useful information. On a global network publishers
    can distribute digital works nearly instantaneously at low production costs, giving
    consumers the convenience of twenty-four-hour automated shopping.


    Technology does not, however, exist in a vacuum. Even if all the technological
    obstacles to trusted systems described in chapter 3 were removed, serious social
    and legal issues related to digital publishing would remain. At present, the potential
    for digital publishing remains just that—a potential. The market remains nascent
    because the medium has failed, so far, to balance the interests of important stakeholders.
    In this chapter, therefore, we consider the dream of digital publishing and the
    co-evolution of technological, business, and legal innovations needed to balance
    those interests.


    # The Pendulum Swings


    Computers and the digital medium itself are sometimes seen as the major barriers
    to digital publishing. When personal computers and desktop publishing first appeared
    in the early 1980s, many publishers saw digital publishing as too risky. At the
    time, numerous factors, such as the lack of an installed base of computers and
    the high costs of production, reinforced'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Chapter 4


    publishers’ doubts. Another deterrent was fear of widespread unauthorized copying.
    Realistically concerned about losing control over their intellectual assets, many
    publishers completely avoided the digital medium. From their perspective, the
    pendulum representing the balance of power between creators and consumers had
    swung too far toward consumers.


    In the late 1990s, several vendors—including Folio, IBM, InterTrust, Xerox, and
    Wave Systems—introduced trusted systems for digital publishing. These systems
    vary in their hardware and software-security arrangements, but they all automatically
    enforce the specific terms and conditions under which a digital work can be used.
    For example, rights may be time-limited, or offered to different people and groups
    (e.g., members of affiliated book clubs) at different fees. Some trusted systems
    differentiate among uses as making a digital copy, rendering a work on a screen,
    printing it on a color printer, or extracting a portion of the work for inclusion
    in a new work. When asked to perform an operation not licensed by a work’s specific
    terms and conditions, a trusted system refuses to carry it out. So dramatically
    are trusted systems expected to alter the balance of power between publishers
    and consumers that some observers have suggested that the pendulum of power is
    now swinging too far toward publishers.


    # Copyright and Paper Publishing


    Copyright law and user practices derive from several centuries of experience with
    publishing on paper. In order to promote the creation and distribution of useful
    works, copyright law grants rights holders—authors and publishers—certain exclusive
    rights. Authors’ exclusive right to control the reproduction and distribution
    of their works protects their interests and those of publishers, who invest heavily
    in the development of works as well as their printing, warehousing, and distribution.
    During the term of the copyright, law forbids a second publisher from undermining
    the market by selling and unauthorized copies. Copyright law also addresses the
    public interest in the free flow of goods and information; for example, through
    the first-sale doctrine—which ensures buyers’ right to dispose of a book in any
    way they wish—and the convention of fair use—which permits the quotation of limited
    portions of a book for review or scholarly purposes.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# The Bit and the Pendulum 81


    Copyright law, by itself, does not prevent unauthorized copying. Where the enforcement
    of copyright law is imperfect, however, technology limitations and the economics
    of paper publishing help to check infringements. Although photocopying makes it
    easy for an individual to make a single copy of a work for personal use, it generally
    does not facilitate large-scale copying and distribution. The offset presses and
    other mass-production equipment used by printers and publishers generate books
    and magazines that are less expensive and higher in quality than photocopied materials.
    Furthermore, the costs of storing and distributing thousands of paper copies are
    usually prohibitive for individuals not in the publishing business. Thus publishers
    of printed materials are protected from infringement by wellfunded publishers
    by legal remedies, and from large-scale photocopying by individuals by quality
    considerations and the relative economies of scale. Together, these forces create
    a point of balance between publishers and consumers of paper-based materials.


    # Copyright and Personal Computers


    This balance of power in the paper medium does not, however, directly translate
    to the digital medium. Even though digital works can be expensive to develop,
    copying them is essentially free. A consumer with a personal computer and a laser
    printer can produce a digital copy of a work as inexpensive and as high in quality
    as the publishers’ original. Furthermore, during the PC revolution, community
    support for copyright has been different for paper and digital media. Whereas
    copyright in paper media is strong and well established, support for copyright
    of digital works is weak, or even absent.


    Many key institutions have long been active in advocating copyrights for work
    on paper. In the United States, these include the Library of Congress, the Copyright
    Clearance Center, and the Association of American Publishers (AAP). Worldwide,
    although there are national differences in copyright law, an international body
    (WIPO, the World Intellectual Property Organization) is active in promoting treaties
    and standards to harmonize national laws. Overall, copyright has worked well enough
    to support the established book, magazine, and newspaper publishing industries.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'As paper publishers began to consider digital publishing, however, they faced
    resistance from the computer community. Many people in community believe deeply
    that computer software and information ought to be free. Although this attitude
    is contrary to ordinary business practice and market theery, it has grown naturally
    out of the history and environment of computer science.


    Before the rise of the personal computer in the 1980s, digital publishing was
    mostly the province of academics and scientists, who shared computers and used
    them to distribute the results of their scientific work. Academic publishing is
    a special case, in that the sharing of research results is rooted in a philosophy
    favoring the free exchange of ideas and the open search for knowledge. Academic
    journals are also unusual in that authors are not paid for their articles, Authors,
    for whom scholarly citation is important for academic reputation and career advancement,
    often pay to be published through page charges, rather than being paid for their
    writings.


    Software developed for various scientific purposes in the computer-using academic
    community was created and freely exchanged among many groups of users. Widely
    used software enhanced its creator''s reputation and standing in the computer
    community. This was a natural extension for a community in which sharing results
    and peer review are key to academic advancement. The free exchange of programs
    that began in the 1960s accelerated the development of computer science, the field
    directly concerned with the creation and study of the algorithms used to construct
    software programs.


    The wider PC community inherited from the academic community the values supporting
    free exchange of information. When the PC community first emerged as a hobbyist
    fringe of academic computer science, these values served it. Many hobbyists built
    their own computers and traded programs. However, as the personal computer culture—and
    industry—matured, the underlying assumptions supporting free sharing no longer
    applied. Fewer users created their own software or built on each other''s programs;
    instead, they bought software from publishers. Publishers did not rely on academic
    grants for support; they had to make a living selling their software.


    To keep prices down, software publishers amortized the costs of development and
    production over their user base. They devised measures—such as rigging computer
    disks in various ways—to make it difficult'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# The Bit and the Pendulum 83


    to copy programs. However, even legitimate customers found such protection approaches
    too inconvenient, and they were eventually dropped. Ultimately, large software
    publishers realized that copying could be good for business. People often learned
    a software program by using pirated copies, then bought legitimate copies of newer
    versions. This process created a market dynamic that helped large publishers dominate
    the field and marginalized smaller ones.


    By the early 1980s software publishers were operating in a legal regime that provided,
    but safeguards against the copying of digital works. The courts pointed out the
    extent to which copyright might protect the structure, sequence, and organization
    of computer programs (e.g., in Computer Associates v. Altair 1992). Certain well-known
    copyright cases—such as Apple''s dispute with Microsoft over the Macintosh graphical
    interface (Apple v. Microsoft 1994)—many years to resolve. Meanwhile in other
    electronic venues suggested that certain kinds of copying were permissible on
    the grounds of fair use (Sony v. Universal Studios 1984). And, as noted in chapter
    3, Congress refused to pass laws to regulate copying of satellite television programs
    until broadcasters developed adequate devices.


    Comparing computers to leaky bottles, John Perry Barlow (1994) argued that once
    a digital work is created, it will inevitably be copied.


    # Copyright and Trusted Systems


    Beginning in the 1990s, computer scientists realized that computers could become
    part of the solution to the copyright problem they had reportedly caused. The
    key was development of trusted systems technology.


    The two main ideas behind trusted systems are (1) the terms and conditions governing
    the authorized use of a digital work can be expressed in a computer-interpretable
    language; and (2) that computers and software can be designed to enforce those
    terms and conditions. Xerox''s DPRL (Digital Property Rights Language) is an example
    of such a rights language.


    Digital rights cluster into several categories. Transport right to copy, transfer,
    or loan a work; render rights pertain to playing and printing a work; and derivative-rights
    govern excerpting portions of a work, limited editing of it, and embedding parts
    of it in other works. Other'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'rights govern the making and restoring of backup copies. With trusted systems,
    a publisher can assign these rights to a digital work and stipulate the fees and
    conditions governing the exercise of each specific right.


    Trusted systems enforce the assigned terms and conditions and allow exchange of
    the work with systems that can prove themselves as trusted systems through challenge-response
    protocols. Trusted systems thus form a closed network of computers that excludes
    non-trusted systems and collectively support use of digital works under established
    rules of commerce. When digital works are sent between trusted systems, the works
    are encrypted. When they are rendered by printing on paper, displayed on monitors,
    or played on speakers, the system can embed in the signal machine-readable watermark
    data that make it easier to trace the source of any unauthorized copies.


    In general, the higher the security of a trusted system, the higher its cost.
    High-security trusted systems can detect physical tampering, set off alarms, and
    erase secret key information. Intermediate-security trusted systems have more
    modest physical, encryption, and programmatic defenses. Using challenge-response
    protocols, all trusted systems can recognize other trusted systems and determine
    their security levels. This enables publishers to specify for each work the security
    level of trusted systems allowed to receive it. A sensitive industry report, for
    example, might require an expensive and secure corporate trusted system with advanced
    security features. On the other hand, a widely distributed digital newspaper subsidized
    by advertisements might require only a modest level of security easily attained
    by home computers.


    # Trusted Systems and the Balance of Interests


    There are many stakeholders in digital publishing. Besides the federal government,
    U.S. copyright law focuses on two parties or categories of people: rights holders
    (that is, the authors and publishers who hold the copyrights) and the public.
    Even in paper-based publishing, however, there are multiple intermediaries, including
    wholesalers, bookstores, used book stores, and libraries. Trusted systems, which
    delegate enforcement and control to computers, introduce other third parties:
    trusted system vendors, financial clearinghouses, and national governments. Thus
    the use of trusted systems complicates the balance of interests by introducing
    new stakeholders.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# The Bit and the Pendulum 85


    Further, the use of trusted systems to enforce terms and conditions provides a
    much finer grain of control than copyright law, and it moves the legal basis of
    protection toward that of contracts and licenses. This more precise degree of
    control distinguishes among usage rights for copying, loaning, printing, displaying,
    backing up a work, and so on. It provides for the identification of specific users,
    rendering devices, and usage fees. In addition, trusted systems bring a finer
    grain of control by enabling rights holders to monitor transactions for the usage
    of works.


    In the following sections we consider the competing interests of stakeholders
    and the technological and institutional implications of these interests in digital
    publishing that uses trusted systems. In particular, we contrast copyright-based
    and contract-based protection of digital works and examine how issues as fair
    use, liability, and national borders are likely to play out in a trusted systems
    regime.


    # Copyright Law


    As excellent summaries of U.S. copyright law are available elsewhere, we will
    not recapitulate them here. However, understanding certain aspects of copyright
    law will clarify how stakeholder interests will influence the design of trusted
    systems.


    Like other forms of legal protection for intellectual property, including patent
    and trademark law, copyright encourages the creation of intellectual property
    by granting exclusive rights to its creators. Article 1, section 8 of the U.S.
    Constitution authorizes Congress to create legislation “to promote the Progress
    of Science and useful Arts, by securing for limited Times Authors ... the exclusive
    Right to their respective Writings.” Over the years, Congress has enacted a series
    of copyright laws, beginning with the Copyright Act of May 31, 1790. The most
    recent overhauls of the copyright law are the Copyright Act of 1909 and the Copyright
    Act of 1976.


    Under copyright law, the federal government grants a copyright owner exclusive
    rights in his or her work. These include the right to reproduce copies of the
    work, to prepare derivative works based on the work, and to distribute copies
    to the public—by sale or other transfer of ownership or by rental, lease, or lending.
    For certain kinds of works, such as literary, musical, and dramatic works, exclusive
    rights to publicly perform and display the work are granted as well.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 86 Chapter 4


    These rights last for relatively long periods of time. For works created after
    January 1, 1978, copyright expires fifty years after the death of the author or
    composer (in the case of works made for hire) the earlier of seventy-five years
    from the date of publication or a hundred years from the date of creation. (Legislation
    passed in Congress in 1999 extends the copyright term to seventy years after the
    author''s death, or for works made for hire, the earlier of ninety-five years
    from publication or a hundred and twenty years from the date of creation.) Although
    the term of copyright is long, it is finite; once it is over, the copyright owner''s
    exclusive rights end. Thereafter, the work falls into the public domain, where
    anyone may publish it.


    Copyright law attempts to strike a balance among the competing interests of various
    stakeholders, especially those of rights holders and the public. It addresses
    this balance by limiting the duration of exclusive rights. The Supreme Court has
    held, for example, that copyright protection afforded does not extend to the “sweat
    of the brow” invested by a work’s creator but only to the author’s clearly original
    contributions. Thus, an alphabetically arranged white pages telephone directory
    may lack sufficient original content to be protected by copyright, even when compiling
    required considerable effort (Feist v. Rural Telephone 1991; Samuelson 1996b).
    Further, copyright protection extends to the expression of ideas but not to the
    ideas themselves. Thus, in the case of computer software, the courts have held
    that although the code of a computer program can be (narrowly) protected by copyright,
    its functionality can be protected, if at all, only by patents or laws governing
    trade secrets, not by copyright (Sega v. Accolade 1993; Atari v. Nintendo 1992).


    Further, in striking the balance between rights holders and the public, copyright
    law provides that reprintings of a copyrighted work for purposes such as criticism,
    new reporting, teaching, scholarship, or research is a fair use and not an infringement
    of copyright. (We consider fair use as it relates specifically to trusted systems
    in a later section.) Additionally, provisions of the law (sections 108 to 120
    of the Copyright Act of 1976) establish a framework—or, as some might say, a patchwork—of
    more specific rights limitations, scope restrictions, and licensing arrangements.
    Many of these provisions are designed to address the concerns of particular interest
    groups, such as religious organizations, small businesses,'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# The Bit and the Pendulum 87


    lending libraries, blind and handicapped persons, cable television stations, and
    noncommercial broadcasters.


    The history of copyright law has been, in part, a history of revisions intended
    to keep pace with changes in technology and media. In 1790 the copyright law governed
    only books and navigational charts; today it pertains not only to texts on paper
    but to all original works in a fixed, tangible medium of expression (e.g., motion
    pictures, architectural plans, sculptures, and sound recordings). Nevertheless,
    major revisions of the copyright law have been few and far; between the 1909 and
    1976 Acts. Even less-fundamental changes achieved through statutory amendment,
    regulation, or case often take years and so lag behind the latest technological
    developments.


    This lag is especially apparent in the era of digital media, which change at an
    unprecedented rate. Moreover, digital media blur the boundaries between traditionally
    separate categories of work; thus statutory provisions intended to protect a particular
    type of work, or to serve a particular set of interest groups, can rapidly and
    unexpectedly become elsewhere. For instance, is a web page that includes an animation
    and an audio stream an audiovisualovisual work or a computer program? Or both?
    Or something entirely new?


    Or consider a packet-switched computer network such as the Internet, in which
    the content-bearing information packets can travel either on cables or over the
    airwaves. The choice of a transmission path depends on moment-to-moment routing
    conditions that are unknown, even unknown, to users. Should provisions of the
    copyright law pertain to cable television or to broadcasting the packets? Does
    it make sense to define a single concept of transmission for the digital media?
    And, if the answer is not less clear, should the law provide for a new exclusive
    right associated with all kinds of information transmission, as some have proposed?
    Yet another gray area involves whether the bits in an information packet traveling
    across the Internet are sufficiently “fixed in a tangible medium of expression”
    to constitute a work subject to copyright.


    Digital media can also create confusion about who is the creator or owner of a
    work. Digital audio processing, for example, allows a composer to take digital
    samples from other (possibly copyrighted) works, process them in various ways,
    and include them in other, derived works. The source or sources of the sampled
    works may or may not be recognizable in their'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 88 Chapter 4


    processed form; the samples can be very short, perhaps only a single drumbeat
    or a single note of music. In the absence of trusted systems, it is difficult,
    to determine the original source of such a short sample. Even if the source can
    be identified as someone else'' copyrighted work, it is not always clear (1) whether
    the person doing the sampling should pay the owner a royalty, and (2) what circumstances
    govern whether borrowing of short segments constitutes fair use. Such digital
    sampling—or, in the absence of trusted systems, the lack of a precise method for
    controlling digital sampling—already posed problems for the recording industry
    and recording artists. These issues have become even more complicated now that
    samples can be traded among musicians worldwide via the Internet.


    Without trusted systems, effective enforcement of copyright in the digital media
    is nearly impossible. Like the effort to plug the proverbial sieve with its thousands
    of little holes, finding all the little infringement leaks of individuals making
    copies is too hard and expensive. Moreover, living with the leaks has its own
    deep risks. By publishing without right enforcement copyright law and creates
    great uncertainty for rights holders, especially for-digital rights holders accept
    the risk that, over time, such copying could become an established practice and
    could be sanctioned by the courts for fair use.


    In summary, the move toward digital media poses numerous challenges for copyright
    law and creates great uncertainty for rights holders, especially for-digital publishers.
    That uncertainty has hampered the adoption of the new media and discouraged most
    publishers from entering them. The impracticalities of enforcing copyright on
    untrusted, networked systems; the gray areas of legal interpretation for digital
    works; the lack of fine-grained control in copyright law; and the risk of an emerging
    legal claim of fair use for digital copying—all motivate aspiring authors and
    publishers in the digital media to find means other than copyright law for protecting
    their interests.


    # Digital Contracts


    To consider one such alternative means, imagine a representative scenario of digital
    publication on a trusted system. The author begins by creating a'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The Bit and the Pendulum 89


    work. When it is complete, the author finds a publisher to further develop the
    work and sell it (or perhaps decides to self-publish). The publishers develop
    a set of terms and conditions governing the use of the work, and using a rights
    management language like DPRL, specify the time period over which the rights apply.
    They also determine what rights are applicable to the work: for example, whether
    printing is allowed, whether the work can be loaned for free, whether members
    of a particular book club will receive a special discount, and so on. They may
    assign different fees for rights; for example, deciding to disallow creation of
    derivative works or to encourage creation of such works as a source of further
    revenue. Or they may require readers of the work to present proof—in the form
    of a digital certificate—that they are eighteen. In DPRL, the statement of each
    right represents the type of right, the time period in which the right is valid,
    the special licenses (if any) required to exercise the right, and the fee. In
    a trusted system, these rights are associated with the digital work either by
    bundling them together in an encrypted file or by assigning the work a unique
    identifier and registering the work and its rights in an on-line database.


    # Owning versus "Renting" Software


    Having a specific and detailed agreement about the terms and conditions of a work’s
    use is clearly an advantage to authors and publishers. But why would a consumer
    prefer such a system to the alternative: paying a single fee to purchase a copyrighted
    work out and then using it in accordance with a set of legal standards applying
    to all digital works?


    I would argue that specialized rules like those described above have potential
    advantages for consumers as well as for publishers. In the present software market,
    a customer typically purchases a software license for a fixed fee; someone who
    expects to make use of the program pays the same fee as a person who will use
    it for many hours a day. In some markets, this situation is bad for both publishers
    and consumers, because low-usage consumers decide not to purchase the software
    at all. In a trusted system with differential pricing and metered use, the amount
    customers pay for software would depend on how much they use it. Metered use would
    therefore allow consumers to “rent” the software under'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 90 Chapter 4


    terms flexible enough to provide for decreasing unit costs for increased usage
    and conversion to purchase if their usage is great enough.


    Another economic advantages might accrue to publishers and consumers of digital
    works through a variation on the first-sale doctrine. When consumers buy a paper
    book, they receive and own the copy of the book. After they have read it they
    are free to give it to a friend or sell it. The first-sale doctrine in copyright
    law guarantees these rights. In the DPRL language, the analogous usage right is
    called a transfer right. Customers who purchase transfer rights can send the work
    from their own trusted system to a second trusted system; when they do so the
    the first system is deleted or deactivated so that it can no longer be used. Like
    handing a book to a friend, a transfer operation maintains the same number of
    copies in circulation. The terms and conditions that allow a work to be transferred
    at no charge are thus analogous to those pertaining to paper books under the first-sale
    doctrine.


    The right to transfer the work without a fee is exactly what a consumer intending
    to share serially with others want. On the other hand, from a publisher''s perspective,
    a free transfer right is a threat to future sales. If all the people who read
    a digital work need to buy their own copy, the publisher will sell more copies.
    One solution would be to offer two combinations of rights with a given work. In
    one combination, the consumer would pay the standard price and be able to transfer
    the work without fee—as in the first-sale doctrine. In another combination, the
    consumer could get a nontransferable copy of the work at a discount price, or
    later pay an additional fee to transfer it. Consumers who buy the work for their
    personal use and do not anticipate giving it away after using it prefer the discounted
    purchase.


    It can be argued that the first-sale doctrine is grounded in an experience with
    paper-based works that treats as physical objects independent of their creative
    content. Like tools, household objects, or automobiles, such physical objects
    can be resold at the owner''s convenience. Enforcing a law to prevent the resale
    or giving of paper books would be difficult in any case; so the first-sale doctrine
    makes practical sense. For digital works exchanged on trusted systems, however,
    these considerations are less relevant. The publisher and the consumer are free
    to enter into whatever agreement they see as economically advantageous.'
