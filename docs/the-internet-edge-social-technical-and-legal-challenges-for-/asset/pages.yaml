    # Reflections


    Each time a boundary is superimposed upon reality, that boundary generates two
    apparently contradictory opposites. And the same thing occurs with the primary
    boundary. For the primary boundary severs unity itself, splitting it right down
    the middle and delivering it up as a subject vs. an object, as a knower vs. a
    known, as a seer vs. a seen, or in more earthly terms, as an organism vs. an environment.


    Ken Wilber, No Boundary


    When most of us meet someone new, our “comparing mind” becomes active to understand
    how we relate to that person. We may think, “we are both Christian” and therefore
    are part of the same flock. We are both Buddhist, or Hindu, or Jewish, or Sufi.
    The criteria need not be about religious orders. “We are both American, or Chinese.”
    We went to the same school or work for the same company. We live in the same neighborhood.
    We have the same profession. We are in the same generation. We like the same music.
    We both have sons and daughters.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Strangers in the Net 251


    Making such distinctions and acting on them is part of the human experience. It
    is bound up with how we construct our sense of personal identity, how we distinguish
    between “self” and other. When a baby is born, psychologists say, it does not
    immediately distinguish between itself and its mother. Only after it develops
    a sense of control over its body and accumulates some experience does a baby develop
    the sense of a separate self.


    The distinction between self and other is also bound up in our collective behavior.
    Nations distinguish between themselves and other nations and enforce rules at
    borders. Corporations distinguish between themselves and other companies, which
    may be customers, suppliers, or the competition. Clubs and special interest groups
    also do this.


    The Net—like other communication and transportation technologies—unsettles and
    challenges our distinctions about identity. It runs right around national borders—challenging
    the control that countries exercise at borders. It connects different social groups.
    By obliterating boundaries that have limited peoples’ interaction in the past,
    the Net has the potential to destabilize some of our collective ideas about self
    and other.


    Marshall McLuhan, the Canadian scholar of mass media, describes the global village
    as a world where everyone is interconnected by vast networks that make communicating
    with people around the world as easy as chatting with a next-door neighbor. This
    lovely vision has inspired many people and influenced the naming of several companies
    and organizations. I believe, however, that the global village metaphor is fundamentally
    misleading.


    The globe is not a village. In a village, people know each other. They share a
    common culture and are often related. Left to themselves, villages tend to maintain
    traditions and change slowly. The diversity of the people, cultures, and institutions
    of the world make it very different from a village. The large scale of the globe
    means that new ideas and changes are always appearing somewhere. Global connectivity
    tends to spread these ideas and changes, bringing them to places distant from
    their origin. From the perspective of an entrepreneur, connectivity makes it possible
    to do things that were previously only possible. From the perspective of a village
    or cultural group, connection technology brings new ways and values from other
    places where people have different values.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'In this chapter I have explored some of the edge work we face at the boundaries
    in our world: the Net in first and third world countries; the perception of cultural
    mixing and cultural pollution; the broad effect of the Net on democratization;
    the cluster of organizations trying to govern the Net and shape its future development;
    the separation and mixing of haves and have-nots on the Net.


    People have different reasons for using the Net. Many companies are trying to
    expand their businesses by going on line, while individuals often connect their
    computers to the Net so that they can explore the world. Neither necessarily recognizes
    consciously any erosion of boundaries. Yet, by using the Net and increasing their
    connectedness with other people, they are altering the boundaries that they perceive.


    The Net is not going to transform the world immediately into a unified place.
    We have many differences in our cultures and values. Travel is broadening, but
    culture is visceral. Embracing too much at once is overwhelming. Even as we connect
    ourselves together, we do other things to preserve our diversity. But our curiosity
    and urge for growth and experience is bringing about new mixtures. We are part
    of a world that is trying to understand itself. The Net is facilitating exploration.'
  merge: -1
  img_proc: true
