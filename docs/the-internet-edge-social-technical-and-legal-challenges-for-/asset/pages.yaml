- pgno: 144
  md: '# Focusing on the Light 127


    Figure 5.3 illustrates the flow of snippets in a tool for sensemaking. As the
    user fills out an outline of the sense, snippets are retrieved from a repository
    and placed in a snippet arrival area. The shading of the snippets indicates how
    they map onto parts of the outlined sense. When a sensemaker selects a snippet,
    he or she can move it to the discard area (trash), the snippet staging area, or
    to the sense.


    An axiom of user interface design for collaborative tasks is that there should
    be a payoff to the user for any work he or she performs. When the user decide
    to discard a snippet into the trash, the system could ask for a specific reason.
    Reasons for rejection might be, for example:


    +   * *Bad source.* The sensemaker does not trust the information source. In this
    case, the system could ask the sensemaker to characterize the reason for rejecting
    the source in various ways, such as by the snippet''s author, the news feed or
    publication that provided, the person referenced in the snippet, or the snippet''s
    genre.


    +   * *Redundant data.* The sensemaker could have enough snippets of essentially
    the same kind, because they are widely reported or because there are duplicates
    in the data base.


    With the sensemaker''s approval, the system then intercept other snippets with
    the same characteristics and automatically toss them into the trash. Thus, as
    a payoff to the user for giving a reason to discard a snippet, the system provides
    greater assistance by discarding other snippets automatically.


    In an ideal case, the snippet is directly useful and can incorporate immediately
    into the sense document. In most cases, however, just copying the snippet into
    the sense document is a suboptimal approach. It is usually better to encapsulate
    it into a digital object with other, similar meta-data. For example, the sensemaker
    could indicate that the snippet will be used as support for an argument, as a
    backup source or footnote to a section, or to present a contrary opinion or counterexample.
    The value of such distinctions is that they enable the system to automatically
    analyze the completed sense report in terms of its use of data and sources.


    The sensemaker may also decide to postpone action on a snippet. In this case,
    he or she put the snippet into the snippet staging area with notes like the following:


    +   *Read later.* The sensemaker needs to read and think about the snippet but
    does not want to consider it right away; it has been selected as interesting but
    too complex for immediate use.'
