    trusted systems gave a copy of the work to vendor C''s system, which proved untrustworthy?


    The following scenario suggests one way in which the risks and liabilities for
    the failure of trusted systems might be handled. Vendor A builds and sells trusted
    systems that include hardware and software. Before bringing the system to market,
    vendor A takes the system to an independent testing organization, the DPT (or
    Digital Trust). The DPT tests the system, gives it a security rating, and issues
    signed digital certificates to be used by the trusted system in its authentication
    protocols. These challenge-response protocols and digital certificates make it
    possible for other trusted systems to determine the identity and security level
    of vendor A''s system. They also make it possible, in particular, to keep track
    of all the transactions entered into by the system and handled which documents.


