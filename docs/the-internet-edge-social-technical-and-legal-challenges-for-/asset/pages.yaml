- pgno: 192
  md: '# 1983


    “Technology Watch” witnessed a rise in the prospects for home computers and a
    loss of confidence in videotex and teletext in 1983. Small computers were reportedly
    use in 48 percent of all U.S. schools. Although only 3.8 percent of all households
    had personal computers, a survey of credit card holders indicated that over 24
    percent of families planned to buy them. Research on advanced computing was also
    given a boost. In the United Kingdom $300 million was being spent on projects
    in computer science and artificial intelligence. In Japan, a large project, the
    Fifth-Generation Computing Project, was started. Senator Edward Kennedy gave an
    impassioned speech before Congress urging federal support for similar U.S. research—including
    work on an infrastructure for networking the universities. “Technology Watch”
    noted the effects of Moore’s Law in its account of a 256K-bit chip manufactured
    by AT&T. It also reported enthusiasm on the rise and benefits of electronic media.


    Difficulties with videotex were being voiced more openly. Although it was featured
    at a big technology show in New York, the column’s editors noticed not particularly
    worthwhile system innovations. The slow pace at which information was displayed
    had still not been addressed, making videotex unsuitable for all but the briefing
    displays (such as weather updates). “Technology Watch” speculated that videotex
    and teletext might soon be overcome by competing technology.


    In January, the Library of Congress announced it was studying the use of optical
    discs for storing photographs. They contracted for a project that used the same
    technology as the Adonis consortium, a group of publishers that included Blackwell
    Scientific Publications, Elsevier Science Publishers, and Springer-Verlag. By
    March, however, the consortium was rethinking its commitment to optical discs.


    Futurists were already anticipating the portable document reader (PDR) discussed
    in chapter 2. Addressing a Subcommittee of Congress looking into issues of technology
    and copyright law, Benjamin Compaine, executive director of Harvard University’s
    Program on Information Resources Policy, said that the terms used to describe
    media limited our understanding of the future. He suggested that we think of media
    in terms of content (the information), process (how it was distributed), and format
    (how it was presented). He noted that the lines of demarcation between'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Chapter 7


    of media are increasingly blurred; for example, that book and newspaper publishers
    were delivering text over television, cable, and computer terminals. He predicted
    that newspapers would be delivered to subscribers electronically on portable,
    flat, high-resolution screens.


    Among other technological developments, voicemail was introduced and Grolier began
    offering an on-line encyclopedia to schools in New Jersey.


    # How the Stories Turned Out


    Whenever we hear the first part of a tangled and engaging story, we will wonder
    how it turned out. Although the themes in the stories that began in 1980 continue,
    in the interim some of the subplots have been.


    By 1986, fewer than five thousand homes in the United States had text viewers,
    encouraging broadcasters to explore other uses for the blank spaces in the television
    signal. The Viewtron system was built by Knight-Ridder in Florida after 1986 after
    losing $50 million. On the West Coast in Orange County, California, the Gateway
    videotex system was built by Times-Mirror Publishing a similar fate. In terms
    of the technology adoption cycle, videotex and teletext never made it across the
    chasm in the United States, although two-thirds of all television sets in the
    United Kingdom can receive a week use of the technology offered by Teletext Ltd.


    Why did television-based systems do so much better in Europe, even with arguably
    less-advanced technology? Several factors probably played a role. In the 1970s,
    the British Broadcasting Company still dominated television broadcasting in the
    U.K.; its decision to use teletext meant that makers had to provide the capability.
    In Great Britain, France, and Germany, government subsidies helped establish the
    communications infrastructure for teletext. In the United States the federal government
    was then in the process of breaking apart AT&T in the name of the free market.
    In that context, government subsidy for a communications infrastructure was virtually
    unthinkable. Without such subsidies, no U.S. company could risk establishing the
    infrastructure needed in such a large country. commercially dominated U.S. broadcasters
    worried that a teletext service would compete with their regular programming.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# The Edge of Chaos 177


    At the end of the 1990s, however, teletext in Europe was showing its age. Compared
    with the personal computer, its graphics are primitive, and only a limited number
    of characters can be displayed at once. Nonetheless, users do not have to buy
    a computer, can access teletext information via their set’s remote control, and
    pay no monthly fee.


    The development road for digital information services has been quite different,
    but equally rocky. The Source was purchased, first by Reader’s Digest and later
    by CompuServe. In 1997, CompuServe itself was purchased by America Online, which
    had best its competitors in the crucial tornado stage of the technology adoption
    cycle. Video faded from the scene. The expense of layer discs, as well as the
    consumers’ inability to make copies, meant the technology could not compete with
    VCRs. Videodis and optical discs for storing digital information were also displaced
    by the CD-ROM, the computer variant of the compact disc (CD) for music. In the
    late 1990s, CD-ROMs, in turn, were being challenged by the higher-density digital
    video discs (DVDs).


    Since the early 1980s the contest between television sets and computers as vehicles
    for information delivery has shifted away from competition and toward convergence.
    One reflection of convergence is WebTV and other systems using set-top boxes.
    Another is high-definition digital television. In 1996 more computers than television
    sets were sold in the United States, though that is not an absolute measure of
    popularity. Approximately 40 percent of U.S. homes had computers in 1997, whereas
    essentially 100 percent had television. The sales figures remind us that computers
    become obsolete and are replaced more frequently than television sets. This rapid
    replacement cycle indicates that the computer industry and related technologies
    are evolving more rapidly. If that trend continues, computers may define new niches
    while, by comparison, stands still.


    In chapter 2 I suggested that PDRs will be better platforms for reading and information
    retrieval than either television sets or desktop computers. In 1985, “Technology
    Watch” reported that a company was soliciting publisher investments to build a
    PDR or “electronic book” based on a micro-processor, liquid crystal display, and
    diskettes for digital book delivery. At the time, the technology constraints for
    building PDRs were much more severe than those we considered in chapter 2. The
    dim and low-contrast LCD displays available in 1985, in particular, were much
    less suitable for'
  merge: -1
  img_proc: true
- pgno: 195
  md: '178 Chapter 7


    reading. Furthermore, in the mid-1980s publishers saw little advantage in investing
    in an unproven technology that had the potential to cannibalize their business
    instead of expanding it. Publishers focused their business strategies on remaining
    content providers and copyright holders and decided to let others take the risk
    of creating and popularizing a PDR technology; publishers would then license the
    copyrighted works to these companies. As the new millennium begins, a reassessment
    of the practicability of PDRs and their impact on digital publishing lies ahead.


    # The Role of Forecasting


    In the early stages of the technology adoption cycle technology watchers and trend
    setters are among the first to react to new technologies. Their job is to spot
    interesting technologies, study new products and the innovators using them, evaluate
    their potential, and pass the news along to consumers and promoters. At this stage,
    when the full potential of a new technology has not yet been explored and the
    likely pushbacks it may evoke are still unknown, watchers'' assessments can easily
    overestimate or underestimate its value.


    One of the ways technology promoters and investors manage risk is by developing
    small-scale pilot projects to sharpen those assessments. "Technology Watch" reported
    on several projects of this kind for videotex and teletext—including those in
    Coral Gables and Fort Lauderdale. These projects, intended to determine what information
    services people would use and what they would be willing to pay for them, revealed
    problems with the speed of information delivery. The problems were noticed early
    but apparently not. Compared with the Net, these projects, which involved only
    hundreds of people and hundreds of pages of information, seem minuscule. It is
    sobering to note, however, that even though in the late 1990s the Net was millions
    of times larger than these projects, the question of delivery speed was still
    relevant.


    With hindsight, it is easy to be smug about the false starts of old technology,
    but it is more productive to find lessons in the earlier efforts. Several decades
    of attempts to create an information marketplace suggest that the Internet edge
    for this dream is not simple. We aren''t through it yet, and each generation must
    face the challenges.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# The Edge of Chaos 179


    # Integrating Change


    In the jargon of Silicon Valley, technology watchers “talk the talk” but don’t
    “walk the walk.” They see and report. They are opinion leaders and can increase
    the attention paid to a new technology or sink early by debunking or ignoring
    it. However, they are not directly involved in making technology work. Innovators
    and early adopters, however, do walk on the front line toward the edge. For them
    the walk can present profound challenges related to integrating a new technology
    within the larger systems of companies and economies.


    # Erie Canal Stories—Bootstrapping and What’s at Hand


    In 1818, repeated experiments with varieties of limestone, [Canvass White, a young
    engineer] found a type in Madison County that when made into a lime cement, had
    the particular virtue of hardening under water. Once under water, the cement became
    increasingly hard with age. Abundantly available and easily prepared, this limestone
    produced a cement superior to any found in America. ... The discovery and application
    of this cement in New York is one of the epochal achievements in the building
    of the Erie Canal

    Ronald Shaw, A History of the Erie Canal


    Engineers proposed to run the Erie Canal 350 miles through northern New York from
    Buffalo. Along the terrain varied widely, and so did the engineering challenges—the
    middle section—ninety-four-mile stretch between the Mohawk and Seneca rivers—was
    the easiest part of the route and became the proving work. In the west and east
    each came later.


    In 1815, no American engineers were expert enough in canal building to train others.
    The canal itself became a school of engineering. Young men joined the canal in
    many capacities and were apprenticed to more experienced men to learn the elements
    of surveying, design, and construction. Workers moved forward as the canal grew,
    gaining experience with each new section. In the introduction to his 1821 book
    of documents on the canal, Charles G. Haines boasted about this on-the-job training:
    “For accuracy, despatch and science, we can now present a corps of engineers equal
    to any in the world . . . The canal line is now one of the most excellent schools
    that be divided [sic], to accomplish men for this pursuit” (quoted in Walker and
    Walker 1963).'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 180 Chapter 7


    Not only was there an initial shortage of engineers, there was a short-age of
    knowledge about working efficiently in the wilderness. Highways and trucks to
    bring distant materials to the canal site, of course, nonexistent.


    White''s discovery of a cement that could harden underwater was a pivotal event
    that greatly simplified the process of lining the canal to prevent seepage. Competitive
    bidding led to other ingenious devices as contractors vowed to make a profit from
    canal building. Some inventions of a rather man made great practical differences.
    One worker, Jeremiah Brainard of Rome (N.Y.), invented a wheelbarrow that was
    lighter, more durable, and easier to unload than previous models; its bottom and
    sides were made of a single board bent to a semicircular shape. Contractors soon
    learned that a plow and scraper to mix cement was more efficient than the European
    method of using a spade and wheelbarrow. A cable secured the trunk of a tree could
    be pulled by turning a crank on an endless wheel and roller. This enabled him
    to fall a tree without using an ax or saw. All inventions contributed to managing
    the challenge of wilderness canal building.


    In short, the Erie Canal spawned more than one new technology. Its success in
    developing new devices and methods as they were needed and training people to
    use them. Such creative discovery and training was a fundamental part of the challenge
    of integration presented by the canal.


    # Upgrading Technology—A Librarian''s Perspective


    Changes come not in a whole deal but in fits and spurts. You see something that
    could be useful to you and you want to introduce it, but it doesn''t come as part
    of an integrated system.


    Giuliana Lavendel, 1997


    Giuliana Lavendel, head of the Information Center at Xerox PARC, is a good example
    of an early adopter. Libraries are always under pressure to have the latest technology
    and, at the same time, to integrate the technologies already in place. As Lavendel
    puts, it''s like trying to build on quicksand. The information manager must be
    extremely flexible and agile, keeping current with new technologies while working
    within a constrained budget.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# The Edge of Chaos 181


    The CD-ROM is generally considered a successful technology that rode the tornado
    to rapid deployment. By the mid-1990s, Grolier had sold over a million copies
    of its CD-ROM encyclopedia, and most personal computers were equipped with drives
    for CD-ROMs.


    Each CD-ROM disc can store about 650 megabytes of information. But how much storage
    capacity is enough? The answer depends on your point of view. One of the goals
    of CD-ROM development was to make large collections of information available on-line,
    which makes libraries a target market for the technology. In the mid-1990s Lavend
    wrestled with the question of whether to buy CD-ROM towers for her customers—information
    consumers at Xerox PARC in Palo Alto and many other Xerox locations. She noted
    that in the mid-1990s the complete publications of the Institute of Electrical
    and Electronic Engineers (IEEE) would occupy 270 CD-ROMs. She concluded that with
    towers held multiple drives, the logistics of maintaining an on-line collection
    were formidable.


    In the late-1990s, as rival DVD companies promoted divergent standards, the issue
    of media capacity remained unresolved. Even with adoption of the proposed two-layer,
    double-sided DVD with a capacity of seventeen gigabytes—twenty-six times the capacity
    of the CD-ROM—it would still take ten DVD players to hold the IEEE collection—and
    that is just the output of one publisher. Should we not expect annual improvements
    in DVD capacity. The whole approach to establishing formats for publishing media
    assumes that there is a large installed base of players for the media. We cannot
    increase density every year without also upgrading players. Suppose, for example,
    that each year developers introduced higher-density media for use with backward-compatible
    players. Publishers, however, would probably resist publishing on the new higherdensity
    DVDs, because in a large organization that upgrades some of its equipment each
    year, users would face a guessing game to determine which players are compatible
    with which. Investments in media formats therefore tend to be generational. Once
    a format has been widely adopted, a generation lasts five to ten years or more.


    At the time that Lavendel was facing the question of investing in CD-ROM towers,
    the World Wide Web began its period of rapid growth'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# 182 Chapter 7


    on the Internet. In principle, libraries could access electronic copies over the
    Net—switching the function of storage and media access back to publishers. However,
    given libraries'' historical role as repositories of information, having access
    to copies at the publishers through the Internet is, though practical, a more
    radical suggestion than investing in CD-ROM towers. Moreover, Net access has its
    own challenges, such as how to protect digital rights (see chapter 3) and how
    to ensure response times will be rapid enough to let readers follow links in a
    hypertext corpus. Depending on the Net for access also troubles librarians, if
    they do not store journals on their own they cannot be sure of continued access
    to back issues if they decide to cancel a subscription. Major debates over how
    to maintain the functionality and traditional fair use publishing with online
    access continue.


    Not all adopters, of course, made the same decision about CDROM towers that Lavendel
    did. She pointed to colleagues in other fields, like the aerospace industry, who
    invested in a massive change: they bought, turnkey CD-ROM tower systems. A year
    after installation, the systems were already becoming obsolete. By contrast, Lavend
    describes her strategy as an information manager as year-at-a-time budgeting:
    “You don’t try to change everything. You change this part, and then that part.”


    Sometimes a piece of technology lasts a long time in an organization, even after
    it is quite outdated. Lavencil recalls that the PARC Information Center once had
    an old Texas Instruments computer and printer used for a specialized task. After
    many years, someone proposed replacing it with more modern equipment. A librarian
    who did not want to switch to new equipment vigorously opposed the change and
    the machine remained. This situation went for several years until a intern accidentally
    spilled a cup of coffee on the machine and it died.


    The advocate for keeping the old technology wanted to avoid the time and costs
    involved in retraining, an argument that was not limited to conservative “diehearts.”
    People who measure increases in worker productivity often point out that knowledge
    workers generally do not achieve greater productivity with information technology.
    By their measures, information technology (IT) compares unfavorably with such
    innovations as the telegraph which sped communication a thousand times, to the
    typewriter,'
