- pgno: 138
  md: '# Focusing the Light 121


    This picking apart of the outline into topics suggests a way to use its structure
    to target the mapping of snippets to the sense of the document. At any level of
    the outline the topic is essentially the conjunction (or logical additive-AND)
    of itself with the topics of “parents” at all higher levels of the outline. As
    much as possible, entries at the same level should represent mutually exclusive
    (logical exclusive-OR) topics.


    We use the term sense map to refer to an external representation that maps the
    snippets to the parts of an evolving sense document. The sensemaker edits the
    sense—adding information, reordering the outline, or combining or splitting snippets—the
    information search system is invoked, recomputes the set of relevant snippets,
    and presents them for possible incorporation.


    In this way, the sense map is an artful way to combine the different positional
    and retrieving aspects of sense. In the community of researchers who have become
    interested in sensemaking, this combination is summarized by the following pseudocode:


    Sensemaking = Reading + Retrieving + Organizing + Authororing.


    The equation says that the work of sensemaking is a process of finding and relevant
    bits of information. Although the electronic editors and browsers of the late
    1990s are said to be integrated, they still split the work of sensemaking between
    separate tools for retrieving information and writing about it. And, working at
    the document level rather than the snippet-level, they still require users to
    formulate queries.


    # Broadening Recall


    The natural advantage of retrieving relatively long documents during a search
    conducted from a query accrues from the fact that many writers use a variety of
    equivalent phrasings to avoid producing a monotonous text. For example, an author
    may mention the United States in one passage, in another use the adjective American,
    and in a third refer metaphorically to Uncle Sam. The retrieval of whole documents
    thus increases the chances that the words of the query will be matched to a rel-event
    document.


    This natural advantage does not apply so much to short document segments, in particular
    snippets. Because snippet retrieval is less likely to'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 122 Chapter 5


    find multiple phrasings of a concept, searches need to use techniques to match
    documents according to meaning rather than just words.


    Semantic matching can improve recall for whole documents too. Some techniques
    reducing the requirements for exact word matching are already routinely applied
    in information retrieval. For example, most retrieval systems use word-stemming
    systems to remove suffixes and prefixes to verbs to a standard form for matching;
    example, the words dreamer, dreaming, and dreams would all be converted to the
    root dream.


    There are a number of relationships that can be used to broaden information retrieval.
    Suppose, for example, that someone is writing an article about mammals eating
    fish. It would be useful to include in the retrieval of an article about a cat
    eating fish, even though the term cat is not a synonym of mammal. As a cat is
    a kind of mammal, there is a class relationship between mammals and cats. Or,
    similarly, suppose someone is writing an article about governments and the taxing
    of citizens and somewhere out in cyberspace is a snippet commenting on court rulings
    on citizens'' taxes. In this case, even though court is not a synonym of government,
    nor is a court a special kind of government, the snippet may be relevant. A court
    is, after all, an arm of government. Thus, there is a variety of relationships
    between terms that can be used to loosen the requirements for exact matching in
    information retrieval.'
