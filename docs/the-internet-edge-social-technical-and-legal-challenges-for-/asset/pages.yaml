    In crafting external representations of a task a sensemaker typically gathers
    information from many places. Making sense begins with the selection and organization
    of the information to be used for making a decision. External representations
    help the group or individual to figure out the problem and communicate the solution.
    In the process initial scribbles and informal notes evolve into a formal report.
    This point in the work invites a useful twist in terminology—referring to the
    external representation itself as the sense—the product of the analytical process.
    Viewed in this way, sense is not just an internal understanding. In writing a
    report or crafting a representation, sensemakers are literally making the sense.


    # Query-free Retrieval


    The industries growing up around the World Wide Web have brought us many generations
    of browsers and integrated suites of tools. The process of developing powerful
    sensemaking tools that scale up to the rapidly increasing amount of information
    available is still in its infancy. In this section, we consider several leverage
    points for producing new, more powerful generations of sensemaking tools—places
    where technology can make a real difference in augmenting human sensemaking.


    Online sensemakers often start with many terabytes of on-line information. However,
    even using external representations, sensemakers can see or manipulate only a
    few pages of information at once. The ability to lever-'
  merge: -1
