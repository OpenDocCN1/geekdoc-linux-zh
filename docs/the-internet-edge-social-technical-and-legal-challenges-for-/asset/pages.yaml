    go out of date quickly, but laptops, they reasoned, would be easy to update and
    also connect students to resources on the Internet. The school board hoped to
    improve education and reduce costs simultaneously by a radical move into the information
    age. They had the right idea, even if their timing was wrong.


    What is it that laptops lack to make this dream realizable? Or, stated in a different
    way, What is the pushback from the edge? There are many things. Laptops are fragile.
    The batteries don''t last long enough. The screens are too small for easy reading.
