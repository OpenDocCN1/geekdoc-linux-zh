    # AI Technology and the Internet: Not Yet a Knowledge Medium


    Precisely defining a knowledge medium is much like defining life; and like life,
    it is better characterized in terms of processes than of properties. Life is usually
    described in terms of such processes as reproduction, adaptation, growth, and
    food consumption. Similarly, a knowledge medium is characterized in terms of processes
    such as the generation, distribution, and application of knowledge and secondly,
    in terms of specialized services such as consultation and knowledge integration.


    There are many borderline cases that defy a simple definition of life. Fires spread
    change their burning patterns, increase in size, and consume fuel, but we do not
    consider them alive. On the other hand, viruses and plasmids are classified as
    living because they take over the life processes of their hosts, even though they
    themselves lack the machinery for reproduction. It can be said that mammals are
    more alive than viruses because the quality of the processes is so much richer.


    Knowledge media also have such borderline cases: for example, communications media
    without knowledge services and databases with limited distribution and services.
    Just as life is thought to come from things that were nearly alive, but too genuine
    knowledge media emerge from borderline media.


    AI research includes many topics relevant to knowledge media: the representation
    of knowledge in symbolic and subsymbolic structures, the creation of knowledge
    bases for storing and retrieving knowledge, the development of problem-solving
    methods that can use and be advised by knowledge, and the creation of knowledge
    systems (or expert systems) that apply knowledge to solve specific problems (e.g.,
    IBM''s Deep Blue or computer-based diagnostic systems). However, even with the
    Internet, AI'
