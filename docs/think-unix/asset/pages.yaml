  md: 'little programs means that the behavior of each program should be easilyhensible—predictable,
    or available by trial and error when not easily predictable. Each word in a sentence
    is, while not definite, limited in some sense, but the-conceptual space of possible
    sentences is unlimited, and we can read whole books in a constant state of wonder
    at the use of language.


    I started thinking about this book nearly two years ago, when I realized that
    I had nothing to recommend to smart, capable friends when they asked what book
    they could use to learn Unix. It seemed that no book took an approach in the spirit
    of the system, and I have tried to do that in this book. I have learned quite
    a bit about the nooks and crannies of Unix while writing this, and I hope you
    have learned at least the basics. While I tried to write a book useful for people
    who have never used Unix before, I also wanted to write a book that would reward
    rereading. Only time will tell if I have met these goals.


    Thank you for sticking with me through these 200 plus pages. I hope the experience
    is as rewarding for you as it has been for me.'
