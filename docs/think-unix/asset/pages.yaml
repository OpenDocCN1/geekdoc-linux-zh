    # Grouping Commands


    Grouping commands do exactly what their name implies:Group commands. Why would
    you want to do that? There are four basic reasons to group commands: First, to
    run a set of commands in a subshell so as not to alter the current environment;
    second, to redirect input and output from more than one command at a time; third,
    to execute a series of commands in the background; and fourth, to group commands
    for what occurs during conditional execution.


    For these purposes we have two grouping commands, the curly braces ({ }) and parentheses
    (( )).The difference between the two is that commands grouped with parentheses
    run in a subshell, whereas commands grouped with curly braces run in the current
    shell and have merely been grouped.


    A subshell, as the itself should make plain, is a shell that runs within the current
    shell. Although it inherits the environment from the current shell, including
    variables, the current directory, and the like, changes made from within that
    subshell do not affect the shell in that subshell executes. Perhaps a simple example
