    \ elif, else, or fi are executed. All that sounds pretty confusing but should\
    \ make more sense in practice:\n\n```\n[jon]@frogbog jon$ if false\nthen\n  echo\
    \ \"The first statement is true\"\nelif true\nthen\n  echo \"The second statement\
