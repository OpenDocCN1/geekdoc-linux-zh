    # Herefiles


    Now that I''ve explained what >, <, and >> do, the obvious question is what does
    that it makes a herefile.


    > “A herefile, huh?” you say.“Never heard of it. What’s it, anyway?””That is a
    pretty good question. A herefile lets you input a bunch of lines of text to STDIN
    until you reach a predefined marker, like:


    ```

    > elvis@frogbog elvis $ cat newfile.txt << STOPHERE

    > This is a new file. I can put lots of text in it.

    >

    > I can put text in all day, if that’s what I want to do.

    >

    > Why would I do this? Because the system will let me.

    >

    > Of course, the system lets me do all sorts of stupid and worthless things.

    >

    > Garbage In, Garbage Out, I guess.

    > STOPHERE

    ```


    It’s immediately apparent that herefiles are more convenient than simply eating
    from STDIN. For one, they provide a nice-looking prompt at the beginning of each
    line, so we know what to expect from them. For another, they avoid having to remember
    that Ctrl+D is the EOF marker on Unix, which an EOF will still stop input without
    the herefile keyword.²


    Even so, herefiles don''t really become important until I talk about shell scripts
    in Part II. Still, this is the logical place to talk about them in the book. And
    if I hadn’t, you’d be wondering precisely what << possibly be used for.


    2. Nothing works in shells, but we''re not trying to cover all shells. Our reference
    platform is the bash shell, almost everything we do in this book identically under
    ksh as well.

    In this case, csh doesn''t provide a prompt when entering text into a herefile,
    although the newer tsh does. We discuss shells in more detail in Chapter 6.'
