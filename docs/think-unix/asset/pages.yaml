  md: '# vi, Dotfiles, and Regular Expressions Chapter 5 115


    A different sort of text editing is accomplished with the change command: c followed
    by a movement command lets you replace the text up to the point marked by the
    movement command. If you continue to type past that point it will insert the text
    rather than replace the old text. es replaces the text from your cursor position
    to the end of the line; ci lets replace the text from the cursor to the beginning
    of the line, and so on. My favorite is ow, which lets replace a given word with
    my choice of words.


    The change command works a little bit differently in versions of vi. My behavior
    follows vi''s behavior when not in compatible mode: vim simply deletes the text
    between your cursor and its destinations and you type away. In compatible mode,
    it behaves like a traditional vi implementation, temporarily replacing the last
    character in the block of text you want to replace with a dollar sign and removing
    extra text when you''re finished. Other vi replacements might still show different;
    try it yourself or check your manual for details.


    There are a few more editing commands that you might find useful. The single r
    replaces one character under the cursor with whatever text you following that
    r replaces characters from your current position until you hit Esc, each time
    replacing the character under the cursor with the one you type on. The join command,
    represented by a j, attaches the line of text below the cursor to the line of
    text which the cursor sits, replacing any whitespace at the end of one line or
    the beginning of the next with a single space. This is useful for combining short
    lines into longer ones as manually reformatting small paragraphs.


    # Blocks of Text


    Lots of times, we want to work with arbitrary blocks of text rather than simple
    words, sentences, or paragraphs. vi lets us work with these arbitrary blocks of
    text. To do so, we can mark points in the document and move these places. Movement
    to these marked points in the document, when combined with yanks and deletions,
    permit us to work with these arbitrary pieces of our editor buffers.


    Instead of a single mark point, vi lets us use any letter as a mark in the document.
    To specify a point as mark ''a,'' type ma to specify a point as mark ''q,'' type
    ma Move to a previously assigned mark and the mark name: v moves to point ''c,''
    and t moves to point ''t''.


    To delete from the cursor position to ''a,'' type da: The movement to the mark
    works identically to other logical units of text, albeit with an extra character.
    You may also type yc to copy text from the cursor to position ''c,'' or cx to
    change the text up to mark ''x.'' You may reassign marks at will; just assign
    them as you would unassigned marks.'
