  md: 'This chapter here to sweep up all the bits and pieces of basic command-line
    Unix knowledge that I haven''t already covered. After this chapter, we move on
    to the X Window System, the Unix GUI environment. This chapter covers grouping
    commands, which are used to (drum roll, please!) group commands. It also covers
    aliases, functions, and shell scripts, all of which can be used to automate complex
