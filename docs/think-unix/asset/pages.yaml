  md: '# Processes


    Unix, if you''re not working on or with files, you''re probably working with processes.
    A process, simply put, is a program running on the system. More precisely, it''s
    an instance of a running program; that is, each time you or someone else the system
    runs that program, another process is created.


    In many ways, processes are similar to files: Every process is owned by a user,
    every process has a name, and every process has a number. Processes are owned
    by the user who ran the process, although itself programs are owned by the user''s
    owner. The name of a process is the name of the command that the system is executing.
    Processes also have a size, although this space in memory, whereas files occupy
    on disk.


    The system provides the process number. The first process, which controls the
    execution of all processes, is init. The process ID (also known as the PID) for
    init is always 1.²


    Processes do not go up and forever; they''re generally of a fixed length, usually
    15 bits (A 15-bit number is a two-byte number with one of bits reserved to indicate
    whether that process is positive or negative.) Some systems have PIDs of 16 bits
    or more, but there are a fixed number of possible processes. The reason for this
    is that when a program is written, a fixed amount of space must be allocated for
    process numbers, and that number must be the same throughout any given system.


    Process IDs are doled sequentially: after process 15321 is created, the next process
    is always 15322, even if 15320 is no longer running. After the top process number
    has been used, the system rolls back to the bottom and starts handing out process
    numbers all over again. If a given process is still running, the system skips
    one and moves to the next, not returning until it has reached the top.


    Each process has a parent process, much as each file is within a directory. The
    consequence of this is that the list of processes on a system can be thought of
    like a directory structure. .init creates several other processes. Each of these
    can parent many more processes, each of which can in turn create any number of
    processes.


    > 2. Usually, computer people start counting with 0. The system administrator''s
    UID is always zero. Sometimes, they forget to begin at 0 and begin counting at
    1, like everyone else. When people say that Unix is inconsistent, they are often
    thinking about things like or about the different arguments taken by commands.
    To me, though, this is part of what makes Unix more like a human language: It
    as though there are verb endings and different sentence constructions. Unix comes
    from many sources, like a language, and there was simply some natural variation
    in those sources.'
