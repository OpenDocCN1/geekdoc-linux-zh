    Most programs reading permission bits exist four digits, though often they are
    three given. Shorter numbers are filled with leading zeros: 222 is treated as
    0222, and 5 is treated as 0005. The three rightmost digits are, as I previously
    mentioned, (owner) permissions, group permissions, and other permissions, from
