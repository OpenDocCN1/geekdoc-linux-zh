  md: '# 154


    # Part II Shell Concepts


    your terminal displays. Theoretically, all programs that want to draw all over
    your screen (full-screen programs such as most mail readers, editors, games, and
    the like) should look at these values to determine where onscreen to draw.


    Unfortunately, some programs make bad assumptions, such as assuming that all screens
    are 80 characters wide or 25 lines high. These programs are, generally speaking,
    beyond hope. Expect that they will miss your screen badly, and there''s not much
    to be done besides rewriting the program if you''ve been blessed with access to
    the source code. Some other programs like SWITCH tells them you''ve resized your
    windows, in which case you might need to exit the shell and restart the programs.
    In some cases, these programs might even have blocked the SWITCH from getting
    to to your shell, and you might need to send that signal to your screen to force
    it to figure out the size of your terminal. The other hand, some programs do an
    excellent job of paying attention to SWITCH and resizing, and those of you who
    are easily amused can have hours of fun resizing editor and email programs.


    The DISPLAY variable is used by the X Window System to determine where programs
    run on terminal should be drawn. X is a distributed multiuser system that is eminently
    capable of handling multiple displays per user. The DISPLAY is made of a hostname
    followed by a colon and a display number, which is two integers separated by a
    decimal point. We''ll discuss the meaning of DISPLAY in Chapter 11, but for now
    it''s best to know that it''s here and that it can be used to display a program
    running on one machine on a machine else, although this is quite slow if you don''t
    have a very fast network. One of the features of $n is that it does a good job
    of setting this automatically.


    The most important of all control variables is TERM. This variable tells Unix
    what sort of display you''re using and what it''s capable of doing. Way back in
    the past, before computers were small and cheap, most people accessed Unix by
    a terminal. A terminal is, so for those of you to remember, a monitor and keyboard
    with a serial cable sticking off the back that connects to the actual computer.
    (The terminal might also be connected to a modem, which could be used to connect
    to the actual computer over a telephone line. On the other end of that telephone
    line, a modem would be directly hooked up to the serial port. It amounts to the
    same thing in the end.) Most Unix boxes (and even many new ones) could support
    dozens of keyboards and monitors connected via serial cables to the system unit.


    This was very good and very bad. It was good because it allowed effective use
    of limited resources; it was bad because dozens of companies made and sold terminals,
    each of them supported a different set of features. Some might have printers and
    keyboards while others might have a CRT screen. Some might have an addressable
    display, where the cursor could be moved about at will, while others might not.
    Some might support color, while others be black and white;


    so.'
