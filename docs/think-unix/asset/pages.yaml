  md: '# The Display Option


    One final option worthy of discussion is the -display option, which is common
    to most X programs. This is the implementation of network transparency, and you''ll
    soon see that it''s not all transparent. -display allows you to specify the name
    of the display upon which the window with the program should appear.


    On a machine with only one display, display is usually :0, which means the first
    display and the first screen of that display. Each keyboard and monitor combination
    is typically one display, and if additional monitors are hooked up to a particular
    keyboard/monitor combination, those are considered additional screens. If the
    program displays its output on a different machine than the current place, the
    machine name before the colon: If you were logged on to razorback from a window
    on dropbox and ran an X program from razorback it has -display dropbox:0 so you
    could use it, I would run it with the option - is legal to omit the screen number
    if it''s zero, the default.


    Rather than run each program with the -display option, you can set an environment
    variable DISPLAY to the correct default display. When you start X, the default
    is usually set to the name of the current display. The command-line option always
    takes precedence over the environment variable, so you can have a default that
    is easy to override.


    Because the display can be any other machine on the network, there are clear security
    issues. It would be bad for anyone to be able to display their client on your
    X server because they could capture your keystrokes and get information from that
    you would keep private. To solve this problem, some of authorization is required
    for a client to get access to a given server. The less good solution is xhost,
    which simply gives all clients on your server. xhost dropbox would give all X
    clients running on dropbox to the current server.


    xhost''s already reversed conversions: If you specify a plus sign before the host
    name, host gets access to the current display, and if you specify a minus sign,
    host is denied access. Therefore, xhost -dropbox would deny dropbox''s access
    to this display, whereas xhost +dropbox would grant access. If you''re living
    dangerously, you can grant every host to your display by running xhost +. This
    is not recommended under any circumstances whatsoever, but people always ask how
    to do it. Similarly, to deny from all hosts, you can run xhost -. This is more
    acceptable. After running this command, you can add particular hosts from which
    you would be accepting connections.


    Even so, xhost is a bad solution. Because Unix is a multiuser operating system,
    it''s difficult to guarantee that you will grant every user on a particular system
    access to your X server. Instead, the xauth command gives you a way to grant access
    on a more particular basis, using authority files and magic cookies.'
