    Figure 10.2


    # **The X Window system client/server model.**


    It''s very important to understand that the display you see might be software
    running elsewhere or on the local machine:The X protocol is said to be network
    transparent because it acts the same regardless of how that data is conveyed.
    All of a sudden, though, we are talking about the X protocol. What does that mean?


    The X Window protocol is a sort of language through which the client conveys what
    must be drawn to the server. A protocol in the same sense as SMTP, POP3, and HTTP
    are protocols: It is a set of rules and procedures through which the two systems
    communicate. In this, communication consists of instructions for drawing the screen.


    Any machine that can interpret the X Window System protocol and draw the right
    things on a screen as a result is an X Server. That X Server can be a standalone
    machine that does nothing draw (an Terminal), a piece of software on a Unix box
    that does other things (an X workstation), or even a piece of software on a Windows
    or Macintosh computer. The client doesn''t care what the server is, although it
    knows the resolution of the screen, number of colors, and so on. As with any piece
    of software''s more than 15 years old, X has evolved. The current version of the
    X Window System at the time it is X11R6.4.That X11,revision 6.4.The revision is
    essentially a traditional version number, and the X11 that precedes the revision
    means that it is 11 of the X protocol.


    Version 11 of X protocol dates back to September 1987, making it over 10 years
    old at the time of this writing. Because so many devices use the X11 protocol,
    it''s probably never going to change;Any change would introduce incompatibilities.
    It stands as now, any device created to support the X11 protocol over the last
    dozen or more years can save graphics for any client created during the same period.
    So if the core protocol doesn''t change, how can new features be added to X? The
    X Window System was designed to be extensible, and one can load extensions on
    an X server. The client can discover what extensions are available and use them
    to improve performance or add features without breaking compatibility.'
