  md: '# Backslash (\)


    Although it''s not technically a sort of quote, the backslash () is used to escape,
    or "quote" individual characters. There are two different ways it is used, and
    in some sense they are opposite to each other, but on a deeper level there is
    a unity of purpose for the lonely backslash. Consider the backslash as a sort
    of toggle. It makes special characters literal and literals special.


    The first use of the backslash is to turn a regular character into a metacharacter.
    We saw this both with the \echo command and with \''s interpretation of the PS1
    and PS2 command strings. \ represents a line break ("new-line") character; or
    represents your username; \ the name of the current working directory; and so
    on while \ represents an actual backslash. For the \echo command, \ is still a
    newline; \ is a tab; \ rings your terminal, if it has; and \ still represents
    an actual backslash.


    The second use of the backslash is to treat the following character literally:
    to disable its special purpose. Any punctuation has a special meaning to the shell,
    including single quotes, back quotes, exclamation marks, question marks, ampersands,
    asterisks, parentheses, semicolons, brackets, greater-signs, less-signs, and tildes.
    Any of these characters can be treated literally rather than having a special
    meaning simply by prepending a backslash to character.


    One of this is when you have a file with a funny name and want to work with it.
    Imagine you have a file whose name is an asterisk, and you want to remove it.
    \* would delete every file in the current directory; unless you use \-i, it won''t
    ever ask before doing so. To remove a file named *, you need to escape it; \*
    or \* will remove that file. Similarly, if you have a file named !, you may cat
    it by using cat \. When it gives another character a special meaning, \ represents
    a literal backslash.


    Because in most circumstances it tells the shell to treat the next character literally,
    you can use a backslash to tell the shell that the next line is part of the command:


    ```

    [@frogbog jon]$ echo one

    \> two

    \> three

    \> four

    [@frogbog jon]$

    ```


    Consider for a moment what just occurred: The shell told that the line break was
    to be treated literally, so why didn''t one, two, three, and four appear on separate
    lines? The shell essentially ignores whitespace. In practice, this newlines are
    discarded and one space between words is compressed into a single space:


    ```

    [@frogbog jon]$ echo one two

    one

    two

    [@frogbog jon]$ *

    ```'
  merge: -1
  pgno: 167
