  md: '# Configuring vi


    The more we customize our software to work like us, the more powerful and flexible
    that software is. Language-like software, that with a full set of ideas which
    can be put together in a deeply expressive fashion, is certainly the most powerful.
    Even in these software packages, however, there''s a need to change simple behavior
    in a simple fashion.


    vi has several variables that can be used to configure the program. These variables
    are set with :set command. Those variables that require strings or numbers are
    set with a command that looks like :set variable=value, where variable is the
    setting you would like to change, and value is what this variable should contain.
    For example, :set wrapmargin=8 sets an eight-character margin at the end of each
    line. On an 80-character-wide display, the default on many systems, this produces
    column output. (You can unset this by typing set wrapmargin=0 if you no longer
    want a margin.)


    Some settings are either on or off. Programmers call these Boolean values, after
    George Boole, who invented the binary (true/false, 0/1, yes/no) logic at the heart
    of modern computing. To set line numbering on, you can simply :set number="no"
    to turn it off, showmode variable determines whether an indicator at the bottom
    of your screen indicates when you insert in mode.


    Useful variables differ among vi flavors. Check your documentation for other uses.
    vi also allows other sorts of customizations, one especially sort is abbreviation.
    If you''re familiar with the autocorrect feature found in word processing software,
    you''re already familiar with abbreviations. An abbreviation is just a way to
    type a short phrase and have the computer replace it with a long phrase. They
    are fairly simple and straightforward to use: :abbr shortform replaces short with
    length whenever you type the former into the text. For example, :abbr jt1 Jonathan
    Thomas Lasso means that I''m in input mode and jt1, vi replaces with Jonathan
    Thomas Lasso. To remove this abbreviation, simply : disapp jt1.


    You can also use abbreviations to correct common spelling errors: :abbr the will
    fix that common typo without requiring human intervention. You can extend this
    to as many of these minor corrections as you like.


