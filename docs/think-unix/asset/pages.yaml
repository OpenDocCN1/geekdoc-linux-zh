  md: '# 108


    # Part I


    # Unix Concepts


    Somehow, we''ve managed to get all the way up to Chapter 5 without teaching you
    text editor. (No, this wasn''t easy, believe me!) The most widely available full-screen
    text editor on Unix is vi. Many versions of vi are available. There''s the original,
    the improved vi (which stands for ''new vi''), elvis, vim, and many others. The
    version of vi I''m using in this chapter is vi 5.4 in its vi compatibility mode.
    This turns off some very useful features, as multiple undo and redo, makes it
    behave like other versions of vi. vim is the version of vi installed by Red Linux,
    and compatibility mode is its default behavior.


    The other popular editor in the Unix world is Emacs, which is an abbreviation
    of "editor macros." There are two versions of Emacs, GNU Emacs and XEmacs, with
    multiple versions of vi users who can move with fairly little pain between the
    two. Emacs is much larger than vi and is almost entirely customizable in LISP
    an unusual but powerful computer language. In fact, Emacs is so customizable that
    you can make it like vi, if you want. Emacs users don''t simply use it as an editor
    but also use it to read email and Usenet News, as a scheduler, and to browse the
    Web. Part of vi note that their computers already have operating systems and that
    all they want is a fast and efficient text editor. Editor preference is a religious
    war in the Unix world, eliciting eloquent and passionate arguments for both vi
    and Emacs.


    Without taking a formal position in the editor war, this book chooses to cover
    vi but not Emacs.¹ Reasons for this include the fact that Emacs has online tutorials
    available, as well as dozens of books, and that single chapter on Emacs can''t
    convey any of the good reasons to use it. A single chapter on vi, while also insufficient,
    can convey more of its flavor and flexibility. Furthermore, system with Emacs
    almost certainly has vi as well, and there are systems without Emacs that do have
    vi. Finally, if you administer Unix systems, or if you intend to administer Unix
    systems in the future, it is much easier to get working on a crashed system than
    it is to access Emacs. Many "rescue disks" have vi, but won''t fit on a floppy.


    In addition to vi proper, this also covers important and related concepts that
    have wide applicability wherever in Unix. Dotfiles are the most common way to
    customize Unix applications and utility behavior. Regular expressions are an advanced
    sort of search-and-replace mechanism that is nearly standard across Unix applications
    and are far more powerful and expressive (that is to say, far more cryptic to
    outsiders and difficult to learn, albeit well worth the effort) than anything
    available on Windows or Macintosh. Understanding these ideas is critical to effective
    use of vi.


    +   ¹ Personally, I use vi, and this book was written in vi. Although Emacs has
    many features, the most immediately useful of these for writers and programmers
    are present in vi. Nevertheless, Emacs is clearly more flexible.'
