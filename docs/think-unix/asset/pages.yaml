  md: '# Part III X Window System Concepts


    Now that you''re familiar with the basics of the X program that really matters,
    xterm, it''s time to discuss why the X Window System is really better than anything
    available for Windows or Macintosh: Unlike those systems, X is almost infinitely
    flexible. Every aspect of X''s behavior can be configured. As always, there is
    a learning curve. Most programs can be thoroughly configured only after significant
    effort been put into the process. There are two general ways to customize the
    X Window System: first, to customize what begins when you start X or log in, and
    second, configure particular applications. Although some recent applications have
    graphical configuration tools, I won''t talk about that because they explain themselves
    for the most part. What I will talk about X resources, the configuration method
    used by applications based on the standard toolkit and Athena widgets, as well
    as by other applications that choose to follow this standard.


    X resources are notoriously difficult for users to understand and edit, although
    they are much simpler than most users believe. Several tools exist to help use
    X resources, and I will discuss some of these briefly. I will also pay attention
    to configuring colors and fonts, of the most commonly altered resources, which
    requires a little bit of extra understanding.


    # Starting X


    These days, most systems already have X started when you sit down at the machine
    and you log through a graphical login program, such as xdm. In some systems, however
    X does not start by default, and you must start it after you log in. In either
    case, X usually has a large number of defaults that are set for you by the system
    and a list of programs that run for you by the system. Usually, you can override
    these defaults with dotfiles in your home directory, exactly what files contain
    these defaults can vary depending on how you start X.


    # Logging Using xdm


    xdm is the X Display Manager. Although it can manage remote logins and complex
    environments, it is often used to manage one display, usually the system console.
    xdm is also quite configurable, so anything I say about it might be different
    in your installation. Check your documentation or ask your system administrator
    for details. (I bet you''re sick of repeating that phrase by now. Don''t worry,
    this is the last chapter, so you won''t hear it many times!)


    xdm starts by asking for your username and password. After you''ve entered this
    information, the system might load some default X resources, on top of which it
    will install any X resources you''ve configured. Finally, the system will run
    a script that includes default programs to run, including your window manager.
    By default, that script will look for a script named .xsession in your home directory
    and run that, if it is present. This allows you to override system defaults and
    do things your own way.'
