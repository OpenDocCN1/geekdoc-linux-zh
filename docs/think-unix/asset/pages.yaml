  md: '# Configuring X Chapter 11


    Besides #define, there are a few other commands that we care about. Up near the
    top of my .xdefaults file, I have the following command:


    ```

    #ifdef COLOR

    *customization: -color

    #endif

    ```


    What this means is that, if COLOR is defined, set the resources listed between
    that #if and the #endif. Just every sh if statement must end with an fi, every
    #if, #ifndef, and #endif statement must end with #endif.


    #ifdef processes the text if parameter is defined at all; it doesn''t care whether
    to set something specific or merely. (You can define a variable with #define whatever,
    without providing a particular value for that define.) #indef processes the text
    if that particular value is not defined. Finally, #if lets you do numerical comparisons.
    In my .xdefaults, I have the following command:


    ```

    #if HEIGHT == 768

    xtermfont: 7x14

    xtermfont1: 5x7

    xtermfont2: 6x10

    xtermfont3: 7x13

    xtermfont4: 8x16

    xtermfont5: 10x20

    xtermfont6: 12x24

    #elif HEIGHT == 600

    xtermfont: 6x10

    xtermfont1: 5x7

    xtermfont2: 5x8

    xtermfont3: 6x9

    xtermfont4: 7x14

    xtermfont5: 8x16

    xtermfont6: 10x20

    #elif HEIGHT == 1024

    xtermfont: 7x14

    xtermfont1: 5x7

    xtermfont2: 6x10

    xtermfont3: 7x13

    xtermfont4: 8x16

    xtermfont5: 10x20

    xtermfont6: 12x24

    #endif

    ```


    xterm supports different fonts through the font menu we mentioned in the previous
    chapter. font is the default font, and font font6 are the fonts available on the
    menu from top to bottom. xrdb automatically defines the HEIGHT variable to be
