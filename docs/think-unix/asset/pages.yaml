    # Deleting and Editing Text


    Adding text to a document is only part of the picture:To get work done, you also
    need to remove and alter text. (And believe me, I know about removing and altering!)
    Generally speaking, while in insert mode (including append) you can backspace
    (or delete, deleting on your keyboard configuration) over text on the current
    line of the display that you have typed in entering insert mode. This is the one
    sort of editing you can do without switching into command mode.


    Two other keystroke editing commands available in insert mode are Control-W and
    Control-U. Control-W deletes the last word you typed, and Control-U deletes the
    entire current line. These only function as far as you entered insert mode or
    the beginning of the line, whichever is nearer. If that is, half pasting into
    a line you entered insert mode and type Control-U, it won''t delete the first
    part of that line.


    After switching into command mode, several other deletion commands become available.
    x deletes the single character under the cursor, and d deletes the current line.
    Either of these can be pasted back into with p or r. When pasting complete lines,
    p places the text on the line below the cursor, and r places it on the line above
    the cursor. When pasting individual characters, p places the text after the cursor,
    and r places it before the cursor.


    Even with these few commands (there are a number of others, some of we''ll discuss
    shortly), you can do all the basic editing you need to in a document, not as efficiently
    as you might want. There are neat tricks you can do with these keystrokes: my
    favorite is swapping two characters when I''ve accidentally typed them in the
