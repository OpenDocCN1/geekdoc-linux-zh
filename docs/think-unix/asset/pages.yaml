    # Quoting


    Several times I''ve used single quotes to keep the shell from interpreting certain
    strings, and characters. In fact, these are only two of the four types of quoting
    that Unix offers: Backslashes escape individual characters; backticks execute
    code and are interpreted as the output of that code; single quotes keep the shell
    from interpreting anything within quotes; and double quotes preserve some of the
    text within the quotes while substituting other portions of text.

    The different sorts of quoting are one of the most powerful features of the Unix
    shells, and are one of the most confusing. Quoting works almost identically between
    shells, but as always check your documentation to be certain. Because the different
    quote marks are so similar, it is sometimes difficult to be sure which sort to
    use in a given situation. This section will try to clarify this important subject.'
