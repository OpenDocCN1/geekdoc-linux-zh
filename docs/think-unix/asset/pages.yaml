  md: "# Part II Shell Concepts\n\ncase matches a word with a list of terms. Each\
    \ term is followed by a closing parenthesis, and the list of commands to be executed\
    \ in that case is terminated with a pair of semicolons. Only after all specific\
    \ terms and their related commands are listed you have an asterisk instead of\
    \ a term, indicating that this final case matches all others. An asterisk is listed\
    \ above another portion of the case state-, it will be executed. After a single\
    \ portion of that case statement is executed the rest is ignored; if we listed\
    \ two sections for peas above, only the first would be executed.\n\nYou can also\
    \ list multiple terms, separated by a pipe:\n\n```\n[jon@frogbog thinkunix]$ $FOOD=carrots\n\
    [jon@frogbog thinkunix]$ case $FOOD in\n> peas|carrots)\n  echo \"Peas and carrots\
    \ go well together.\"\n  ;\n> *)\n  echo \"Yuck, I hate $FOOD\"\n  ;\n> esac\n\
    ```\n\nPeas and carrots go well together.\n\nIf you're not a programmer, and you're\
    \ not writing interfaces, you might not use case. If you want it, however, it's\
    \ there.\n\n# Practice Problems\n\n+   1. Make a directory named theoretical and\
