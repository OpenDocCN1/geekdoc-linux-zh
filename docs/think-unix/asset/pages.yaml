    # Links


    Links are the type of special file most commonly needed by typical users. Links
    let two filenames refer to the same actual file or directory on disk, and come
    in two varieties: hard links and soft links. Before we can adequately discuss
    each sort of link, we must take a quick look at how files are stored on disk.


    # How Directories Really Work


    If you think about it, there are only two ways a directory could work: It either
    literally contain files or point to files that are stored elsewhere. The for-
    case would be as chapters to a book: Files would be stored in sequence within
    the directory and a table of contents could be built from this data. Clearly,
    this would be large and slow, and changing the contents of the directory would
    involve moving chunks of data around in rapid succession. Instead, if a directory
    only pointed to files, it would be the table of contents. Removing a chapter would
    only require that its name be crossed out and the page counted.'
