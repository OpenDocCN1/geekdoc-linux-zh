  md: '# Part IV Appendices


    Window Maker A window manager based on the look and feel of the NeXT interface.
    Relatively configurable and sometimes even lightweight, Window Maker is a popular
    choice among users who bother to change their default window manager. It''s not
    at anything, but it''s pretty good about everything. Its Web page is at http://www.windowmaker.org/


    wmx An pathologically small and fast window manager, its configurability suffers
    as a result. For size, the small-is-beautiful crowd, it''s a wonderful choice.
    And it looks really cool, too. Its home page is at http://www.all-day-breakfast.com/wmx/


    word The quantity of data a CPU can process most conveniently. Usually a number
    of bits representing a multiple of the byte. On octahedral machines, 36-bit words
    were common because they were four octal long. On more modern machines, 32-bit
    words are the most common, with 64-bit machines becoming more common by the day.


    X See XWindow System


    X Window System One of the largest, most used, and most poorly understood tools
    on Unix. Although O''Reilly & Associates publishes the official manuals, they''re
    not of much use. Nor is the official X Consortium Web site at http://www.x.org/
    much use, for that matter. I''ve never seen a book about X at the user level that
    was worth reading, unfortunately. One Web site with many links to useful technical
    information is http://www.rahul.net/kenton/xsites.html.


    If you''re interested in different window managers and want to find out about
    several before trying them out, the best place to look is http://www.plig.org/xwm/,
    a large and very comprehensive list of window managers, along with sample screen
    shots and configuration files.Very classy, and very useful.


    zsh The ultimate kitchen-sink Bourne enhancement. It has tons of stuff that the
    author just liked. I''m not really sure who runs zsh, but somebody must like it.
    The zsh home page is http://www.zsh.org/'
