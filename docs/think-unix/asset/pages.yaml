  md: '# Introduction


    # About This Book


    So you are here, standing in the bookstore, flipping through this book, trying
    to decide whether Think Unix is for you. Fortunately, you decided to read this
    part of the book, so I can answer your question directly.


    # Is This Book For You?


    First of all, this book is intended for people with some computer experience.
    If you have never used a PC or Macintosh, there are probably better places for
    you to start this book. I don''t start at the beginning. I assume you have an
    idea of what a file is; what a folder or subdirectory is; where to find the keyboard,
    monitor, and how to turn your computer on. Furthermore, this book is written for
    people who are not afraid of trying new things and for people who occasionally
    made educated guesses about how the whole thing works.


    This isn''t the kind of book that tells you to enter your username at the login:
    prompt and your password at the password: prompt. (If you don''t know this now,
    I''m telling you now: Enter your username at the login: prompt and your password
    at the password: prompt.)'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Think Unix Introduction


    On the other hand, this book is written for people who have never used Unix. Experienced
    users might learn something but should probably look elsewhere.This book has no
    information about systems administration, for example, though I hope it provides
    a good foundation for such knowledge.


    This book is written for people who read closely. This is a short book, and I
    don''t waste much space. The examples are chock-full of useful information, even
    if it might not be directly relevant. For example, in the first chapter I discuss
    reading documentation, I use the man page for logout.That''s the only place logout
    is discussed. If you skip it, you might not know how to log out of your system!


    Because it is a short book, I''ve cut some things out. There''s very little discourse
    of the "Unix culture.\(Yes, there is such a thing, and it''s what made the Internet.)I
    will mention it in passing; however, when it actually affects the system works.
    Furthermore, I don''t cover applications: I don''t discuss readers, Web browsers,
    spreadsheets, or word processors. What I say does a having on how these programs
    operate on Unix, or at least how they should. (Many of these people clearly display
    their PC or Macintosh heritage, and don''t act as Unix programs ought to.)


    Another feature of this book is that fact of practice problems. Although nothing
    can substitute for hands-on experience, practice problems give you a way to judge
    your understanding of a topic and decide whether you need to reread the section
    or even ask a friend for help. I recommend that, if you know a Unix guru already,
    you bribe her with large quantities of chocolate, tea, cheese, or her favorite
    beverage. Many Unix people are microbrew fanatics.(Disclaimer: I''m a professional
    Unix guru, and I like both chocolate and good beer, so I might be a bit biased
    by this point.)


    Finally, if you don''t have a sense of humor, this book might not be for you.
    If you didn''t crack a smile once during this section, we might not get along.
    (You didn''t have to find every joke funny, of course, but the others in this
    book fall along these general lines.) I use funny command and filenames, sometimes
    to make a point but also to keep it interesting for myself.


    # This Book''s Approach


    Unix is distinguished from operating systems such as Windows and Mac OS in that
    it is "deep": beyond the surface user interface lies a wealth of functionality
    and power rival by few other systems. The price of this richness is that there''s
    a lot to learn.


    Because of this depth, this book''s approach to Unix is a high-level conceptual
    view. Many computer books, especially ones about Unix, take what I consider to'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'a “phrasebook” approach. That is, they go about teaching a large number of
    individual commands, often with a somewhat useful classification scheme—for example,
    “commands dealing with directories” or “commands dealing with files.” It’s as
    though these books were tourists’ phrasebooks, helping foreigners journey through
    a place they can’t even hope to understand.


    By contrast, this approach is more like that of a foreign-language textbook: Rather
    than concentrating on prepacked statements, you will learn to think and speak
    Unix. By that, I mean that you will learn to solve the problems that Unix was
    designed to do things, rather than just muddling through. You will learn the logical
    structure of the operating system—its grammar, if you will. My goal isn''t simply
    to get comfortable with navigating the Unix prompt, but also to let you feel at
    home learning new commands not discussed in this book and, most importantly, combining
    multiple commands to achieve particular goals.


    In vein, the first chapter of Think Unix is dedicated to Unix documentation. Learning
    to look up the operating system is necessary if you want to become a proficient
    user of the system. Because of this attention, Think Unix doesn''t burden you
    with an appendix describing several hundred Unix commands. Instead, you will learn
    to look to the system itself for information.


    Because Unix is a deep system, it is possible to learn a little bit at a time.
    Usually, what you don''t know doesn''t interfere with what you''re doing. Learn
    enough to navigate comfortably, and return to learn more. In this book, I''ve
    covered things about Unix I don''t know, and I''ve using Unix professionally for
    six years.


    There are disadvantages to this approach to learning Unix. Foremost among them
    is the absence of necessary knowledge at any given point in the learning process.
    This is the result of any linear approach to learning a complex system: It''s
    rarely possible to start from nothing and proceed based only on what is learned,
    especially if the practical is discussed before all of the theoretical learning
    is finished. Of course, nobody wants to plow 200 pages of theory before learning
    anything useful, without understanding everything. You may wish to mark these
    sections and return to them later, or might simply wish to give the book one reading
    if you''ve never used Unix before. Any well-written book should reward multiple
    readings.


    # Reference Platform


    The reference platform—that is, the type of machine on which the examples are
    tested and from which their output is displayed—is a Linux machine with GNU tools.
    When referencing the Korn Shell I use pdksh, and for the C Shell I use tsch. In
    short, I use my home machine: a Red Hat Linux 6.1 box with Bash 1.14 as the'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Think Unix Introduction


    default shell. The shell is the program that interprets the command line and allows
    the user to interact with the system. Many shells are available on Unix systems.)


    This choice of platform is not because Linux in general, or Red Hat Linux in particular,
    it is “better” than any other version of Unix. Instead, it''s a popular and easy-to-obtain
    distribution with adequate commercial support and boxed sets available at many
    retail outlets. If you don''t already have some form of Unix on your home PC,
    I recommend starting with the most recent of whichever distribution the least
    Linux guru recommends. (I recommend Linux over other versions for home PCs because
    there are a larger number of Linux experts in FreeBSD, NetBSD, or OpenBSD. Furthermore,
    recent Linux distributions have installation processes simpler than for other
    Unix versions. Both of these traits are important to new users. If your local
    guru recommends one of the BSD versions, feel free to give it a try)


    Sometimes to make a point, or because there is significant divergence between
    flavors of Unix (yes, many versions of Unix are known as flavors), I demonstrate
    a particular command on one of the many other flavors of Unix. When I do, I mention
    the specific version I use so that you know what to expect. Because they''re what
    I use at, I''ll tend to provide examples from Solaris 2.6 and Irix 6.5. Again,
    this isn''t intended to imply any sort of superiority, merely availability.


    # An Ultra-Super-Brief History of Unix


    One reason why Unix is a operating system, in the sense I referred earlier in
    this introduction, is that it has a history. Unix is just 30 years old, depending
    on how you count it, and its predecessors are several years older than that. The
    point, the Macintosh OS is about 15 years old and Windows somewhat younger. (Windows,
    of course, used to—and in some cases does—run on top of MS-DOS, that''s a particularly
    shallow operating system, in terms of the services it provides.)


    One advantage of living in the modern age is that computers are much faster than
    we really need to be and that possess more memory and disk storage we should know
    how to fill. I certainly not going to into into specifics here if I do that future
    generations will laugh at how slow our computers were and how insignificant their
    storage. Similarly, I won''t tell you how slow computers were in 1969, when Unix
    was born, and I won''t tell you how little memory and disk space they had.


    If I did, you would almost certainly laugh, and you probably wouldn''t believe
    me anyway. If you''re still reading this in the bookstore, you''d probably think
    that I was either stupid or lying to you, and as a result you might not buy this
    book. If you''ve already bought the book, if you''re reading it in a library,
    or if you''ve borrowed a'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'friend''s copy, I still won''t tell you, because then you might not read the
    book, and I

    wouldn''t like that one.


    Suffice to say it, these were very, and I do mean very, small computers.


    In fact, the computer on Unix was born (a PDP-7, if you must know) was

    small even for its day. The people who wrote it (Ken Thompson and Dennis

    itchie, among many others) did so after moving off the Multics project,

    ran on much larger computers. Because of their limited resources, Unix

    programs had to be small. Unlike most modern applications on Windows or

    Macintosh, you didn''t have a single program that did a bunch of things—

    like, for example, a typical WYSIG word processor—but many smaller pro-

    grams, of which each did one. One goal was to have small programs so that

    they could fit into memory. Disk space was at such a premium that everything was

    as small as possible, including program names. It was (and) a common Unix-

    vention to remove the vowels from a command''s name to save space. It also hap-

    p to save a fair amount of typing if you use the system method.


    The decisions made in the first several years of development shaped the Unix

    approach to problem solving. The main consequence is the idea of small programs,

    each with limited functionality, which can be put together in various combinations

    to produce results. This philosophy is often known as the “toolbox approach,”
    and

    understanding this is the key to my suggestion that Unix can be learned as a language.


    Because there are a multitude of small commands, and the idea is to put these

    commands together to get what you want, you need a way to connect them. The

    book is about those connections: what they are, how they work, and how to string

    several commands together into Unix sentences. After you learn to put sentences

    together and you start putting together whole paragraphs'' worth of commands,

    have begun to Think Unix.'
  merge: -1
