    # Absolute and Relative Paths


    If Elvis was sitting at the prompt in his home directory, directories could be
    identified as Desktop/Autostart,Desktop/Templates, and Desktop/Trash. Because
    the forward slash (/) is used as a directory separator, slashes in filenames cannot
    be used. Were Elvis early in the Desktop directory, those could be identified
    simply as Autostart, Templates, and Trash. The name of a file or directory can
    be given relative to your current location in the directory tree.


    There must, of course, be some absolute point from which all directories of a
    given system can be located.¹² Logically speaking, point is the directory that
    contains all the other directories on a system. On Unix, this point is called
    the root directory, and all files lie somewhere inside the root directory or its
