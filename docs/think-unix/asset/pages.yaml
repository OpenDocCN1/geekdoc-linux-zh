  md: '# # Redirecting STDERR


    Now that we''ve used <, >, <<, >>, and how we might redirect the standard error
    stream?


    Unfortunately, the easy way to redirect STDERR doesn''t work in the Bourne Shell,
    which is almost everyone uses to write shell scripts. Additionally, the simple
    and perhaps logical answer would be to extend the existing syntax, using >>>,
    or to use another symbol, such as ), or that bears some visual resemblance to
    our original symbol. There are actually two ways to do this on Unix: the easy
    (but not quite useful) way, and the hard (but most useful) way.


    # ## The Easy Way


    The easy way to redirect STDERR is to redirect STDERR to STDOUT to a file. You
    can accomplish this by using & to redirect to a file. Let''s say that we were
    running a find to list all the files on the system, and we wanted to see the error
    messages inside our output, which we were sending to a file. We could use the
    command `find -name ''*'' -print > ~/alifes.txt`. All the output, find''s error
    messages, would be in that file.


    Unfortunately, if we wanted to redirect only the error messages but find''s normal
    output on the screen, we would have some difficulty with that. To do this, we
    must redirect STDERR the hard way.


    # ## The Hard Way


    The hard way to redirect STDERR relies on a feature present in only some Unix
    shells: the Bourne, Korn, and Bash all have this feature. The C Shell and tsh
    don''t. For more details, see Chapter 6. For now, simply type the following command
    out of which shell you have: \3


    ```

    cat /etc/passwd | grep username: | cut -d '' '' -f 7

    ```


    Replace username with your own command that should print a file and path. If the
    program is referenced cs or tsh, this section doesn''t apply to you, unless you
    change your shell. If it''s sh, k, or bash, it does.\4 The fact that you can''t
    redirect particular handles with cs or tsh leads many Unix experts to pronounce
    them "broken". I take no position on this than note that I don''t cover those
    shells. Even if you run those shells and you''re not willing to switch, this is
    probably still worth reading, for the theory.


    +   3. Assuming your site doesn''t use NIS to keep track of accounts. NIS is beyond
    the scope of this book; however, you can get the NIS account list by typing ypeat
    password instead of cat /etc/passwd.

    4. This seems as a good point to point out that Unix shells have two names: "real
    names" and the names of the command that runs the shells. The Bourne Shell is
    also known as sh, the Korn is ksh, the Bourne Again is bash, and tsh is tsh.'
