    # Color Names and Numbers


    Because X is a framework for graphical environments, color is important. We like
    to color-code displays of information so that we have important information simply
    jump out at us. With colors, we must be able to specify particular colors. To
    with realistic tones, we must be able to specify shades of colors more specific
    than blue or green. In X, there are several standard ways to specify colors, including
    device-independent color specifications that are used by few, if users. The most
    common scheme to specify colors is to use the RGB color model, which we will look
    at in more detail.


    # The RGB Color Model


    Most people use computers know that every pixel on the computer screen is made
    of three elements: a red element, a green element, and a blue element. Any color
    that can be displayed on a CRT or LCD must be expressed as a value for the red
    portion, the blue portion, and the green portion of pixel. The brightest, pure
    blue would be the blue pixel at 100% brightness and the green and red pixels at
    0%. (Actually, the red, green, and blue portions of each pixel are really subpixels,
    but I may refer to them as pixels in this discussion for convenience.)


    With 100% defined as 1.0 and 0% defined as 0.0, you can specify an RGB intensity
    specification as rgbi:red/green/blue. A pure blue would be specified as rgbi:1.0/0.0/0.0
    and a medium gray would be rgbi:0.5/0.5/0.5.'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'The intensity model is only one of the options. More common are scaled colors.
    Because computers are digital, there is not the infinite gradation implied by
    the use of intensity. Instead, each of these percentages must be turned into a
    number. Generally, colors in X are 24-bit values, which implies an 8-bit (one
    byte) value for each of the elements. These 8-bit subvalues range from 0 to 255,
    as all 8-bit values, are expressed in hexadecimal. Pure green, then would be expressed
    as rgb:00/FF/00, and that same gray expressed earlier is rgb:80/80/80. The RGB
    color model allows you to specify each scaled value from one to four hexadecimal
    digits, as long as each of the red/green/blue values for a given color share the
    same number of bits.


    # Old-Style Color Numbers


    Back in the days, before the presence of multiple color models in X, a color was
    simply specified as a hexadecimal number preceded by a hash sign. You can see
    in this color definition from the following example:


    ```

    #define WAYDARKBLUE #000033

    ```


    The pairs of hex digits in this 24-bit value are in the same order as in the above;
    only the notation differs. These values can also be from 12 to 48 bits, in multiples
    of 12, as in the new RGB notation. This color (#000033, has no red or green in
    it, and only a little blue. How much? 33 out of 255, converted to decimal, is
    51 out of 255, which is equal to 0.2, or 20%. In the new color model, this could
    be expressed as rgb:00/00/33, and in the color intensity model, it would be rgb:0.0:0.2.
    I''m too lazy to update this, and I am somewhat away how older machines would
    deal or fail to deal with this, so I leave the number in the old-style scheme,
    at least for the moment.


    # Color Names: rgb.txt


    Fortunately, we don''t have to think of colors as numbers: The X Window System
    gives us a simple method of converting colors to numbers. Somewhere on your system
    is a file named rgb.txt (this file should be in the directory lib/X11 relative
    to X''s top-level directory). On my Red System, this''s absolute path is /usr/X116/lib/X11/rgb.txt,
    which might well differ on your system.


    Let''s look at a small portion of this file:


    ```

    255 218 185 peach

    255 218 185 Peach most

    255 222 173 navy wajo

    ```


    > 3. In many, if not most, displays are not 24-bit displays. More common are 8-bit
    displays, which use colormaps that use a palette—a subset of colors—in a window.
    Also common are 32-bit displays, which generally comprise a 24-bit display and
    an 8-bit alpha channel, which is displayed on top of or which modifies the underlying
    24-display.'
