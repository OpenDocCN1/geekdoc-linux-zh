    don’t generally do it themselves but look to another machine that does the actual
    work. The machine making the request and receiving the response is the client;
    the machine receiving the request and responding is the server. The primary advantage
    of a client/server architecture is that the clients doesn’t usually require much
    in the way of maintenance. All that is required is they can talk to the server.


