    -D

    $ elvis@frogbog$

    ```


    A single right-angle bracket (>) redirects STDOUT to a file; it even looks like
    an arrow pointing to it. Not surprisingly, to redirect STDIN from a file requires
    a single left-angle bracket (<). Elvis now wants to see the names in west.txt
    in alphabetical order because he knows we need a convenient example for redirecting
    STDIN from a file:


    ```

    $ elvis@frogbog ] sort west.txt

    ```


    +   Aristotle

    Heraclitus

    Plato

    Plotinus

    Socrates


    All done, without a troublesome complaint from the system or a good reason why.
    It''s simply a pair of right-angle brackets without spaces (>>). With appending,
    Elvis can add to his list of Western philosophers:


    ```

    $ elvis@frogbog$ cat >> west.txt

    Kierkegaard

    Pascal

    Descartes

    Sartre

    -D

    ```


