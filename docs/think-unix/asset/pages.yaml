- img_proc: true
  md: '# X Window System Concepts


    Next is the average width of the font, in points—another virtually useless field—and
    finally the registry and encoding. The registry would tell the system what kinds
    of characters are included in the font, and the encoding is a sort of subregistry
    tells the system what particular characters are included. This allows you to have
    a generalized encoding and a more specific encoding.


    Outline fonts are not stored as a series of pixels but as a set of instructions
    on how to draw them. These fonts can be displayed at any size, but are more likely
    to look out particularly at small sizes and low resolutions. Fonts which are outline
    fonts, such as ur palatino, shown earlier.


    Finally, X font strings wildcards. You can fill in with an asterisk for which
    you choose not to supply information. For example, if you have the Palatino typeface
    supplied by one foundry, an asterisk in the field is irrelevant because it can
    be replaced by only one foundry. If, however, you have this typeface supplied
    by more than one foundry, an asterisk in the field is the equivalent of saying
    “I don’t care,” which is likely to produce duplicate results. For example, an
    asterisk in slant means that, if the font exists in italic and upright, the italic
    variant will be selected. Also, any font name using wildcards should be quoted
    in certain circumstances, to inhibit interpretation of the wildcard by the shell
    or other applications.


    All this is complicated. The quick route to enlightenment is probably to start
    xfont, pictured in Figure 11.3, and to alter values until you get an intuitive
    feel for what’s going on. xfont allows you one useful feature: if you want to
    use a font string for the font displayed, you can select the button and use the
    middle button to post the font name in another window.


    ![](img/2f323bb3f55b6c176d89a3f1c4fe9183_248_0.png)


    Figure 11.3


    xfont, displaying a particular font.


    # A Few Final Words


    It’s late at night, and my deadline is fast approaching. It feels wrong to leave
    you with the suggestion that “fonts are complicated, so play around until you
    understand them,” but in some sense that’s Unix is all about. The strategy of
    me'
