  md: "# Conditional Execution and Loops Chapter 8\n\nOf course, we've learned every\
    \ one of these pieces already except for the for loop, but it is we that the for\
    \ loop brings them all together that is important. We are using flow control statements\
    \ (the for loop), variables (foo), back quotes, quotes, pipes, and regular expressions\
    \ all at once. If you're comfortable with this little renaming program, consider\
    \ yourself a Unix user.\n\n# while and until Loops\n\nWhereas a for loop iterates\
    \ over each item in a list, a while loop executes a particular condition is true.\
    \ That, not surprisingly, is the exit status of a command or series of commands.\
    \ Let's say I had a series of nested subdirectories each named tmp, and I wanted\
    \ to od into the innermost subdirectory of name. A while loop would be a convenient\
    \ way to do this:\n\n```\n@frogbog jon$ cd tmp\n> do\n  pwd\n> done\n/home/jon/tmp\n\
    /home/jon/tmp\n/home/jon/tmp/tmp\n/home/jon/tmp/tmp/tmp\n/home/jon/tmp/tmp/tmp/tmp\n\
    /home/jon/tmp/tmp/tmp/tmp/tmp\n/home/jon/tmp/tmp/tmp/tmp/tmp/tmp\n/home/jon/tmp/tmp/tmp/tmp/tmp/tmp/tmp\n\
    bash: tmp: No such file or directory\n@frogbog jon$ \n```\n\nThe general format\
    \ is that the word is followed by a list of Unix commands. If the exit status\
    \ of the last command in list is true (zero), the commands between the do and\
    \ done are executed. In the previous example, the while executes od returns an\
    \ error, which happens when there are no more directories into which it can cd.\n\
    \nI use the while command for two reasons. First, the list of commands between\
    \ the do and the done can be empty; second, it's nice at this stage of the game\
    \ to see what's going on. If I absolutely positively didn't use a useless dummy\
    \ command as NULLVALUE=0 or echo \" > /dev/null.\n\nThe until command is just\
    \ like the while command, except that the until loop runs while the exit status\
    \ of the first list of commands is not zero. That is, an endless while loop would\
    \ be of the format\n\n```\n@frogbog jon$ while true\n> do\n```"
