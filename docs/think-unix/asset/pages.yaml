    # Why Many Users Avoid Desktop Environments


    Many users, myself included, generally steer clear of desktop environments. They
    offer benefits but take up vast amounts of memory and slow the system. Mostly,
    the applications included with these environments run fine without all the extra
    weight of massive infrastructure those environments depend upon. Furthermore,
    each of these environments has its own configuration method, which is generally
    less powerful and less flexible than the standard methods for configuration.


    In many power, users feel overwhelmed by desktop environments and feel that sufficient
    enhancement to the ease of use provided by the environment does not outweigh the
    loss of power and control. One measure of this brain damage is that each environment
    provides its own terminal program to replace the venerable xterm. None of these
    replacements is configurable, stable, or functional as the original, although
    they may be simpler for novices to configure. Finally, many users feel that desktop
    environments are a waste of all-to-limited screen space.'
