    However, because the people who wrote the main pages are not perfect, or because
    they haven''t read this chapter, sometimes variable options and arguments look
    like the surrounding text. In general, this should be made clear in the description
    portion of the page. Careful reading is often rewarded.


    Besides brackets, there are two more common modifiers for options and arguments.
