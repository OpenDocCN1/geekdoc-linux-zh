  md: 'Part II


    Shell Concepts


    Why are spaces only compressed while newlines are dispensed with entirely? From
    the shell''s perspective, spaces are discarded: In the second example, one and
    two are separate arguments to the echo command, and each argument to the echo
    command is returned, with a single space between arguments.


    # Single Quotes (''’)


    If you want each space to be included in your echo command, they must be part
    of a single argument. Single quotes delimit a string that the shell will take
    literally, treating it as a single unit, or token:


    ```

    [jon@frogbog$] echo one two''

    one two

    [jon@frogbog$]

    ```


    Everything between single quotes is taken literally. This includes backslashes,
    newlines, variable names, double quotes, backticks, and so on:


    ```

    [jon@frogbog$] echo `three''

    >

    four

    five ''`#$%"\''

    thtree

    four

    five ''`#$%"\''

    [jon@frogbog$]

    ```


    In fact, the only character that you can''t put between single quotes is another
    single quote: If you did, the system would know that you intended it as a display
    quote?(Sometimes, an exclamation mark will also cause a problem, depending on
    shell configuration related to history commands).


    If you have a file with more than one funny character in its name, single quotes
    are a great way to deal with that:


    ```

    [jon@frogbog$] cat `a funny file name (with lots of characters, but single quotes
    in the whole thing)`

    Nothing to see, move along!

    [jon@frogbog$] mv `a funny file name (with lots of characters, but single quotes
    in the whole thing)` a-shorter.txt

    [jon@frogbog$]

    ```


    Of course, we''ve used single quotes to protect find, grep, sed, and awk commands
    from being interpreted by the shell. All the way back in Chapter 3, we first used
    single quotes to protect a command when we ran find /name ''*'' -print >&allfiles.txt.
    In that case, the single quotes keep the shell from converting the asterisk, they
    surround from being interpreted by the shell. Without them, the shell would replace
    asterisk with a list of every file in the current directory.'
