    # Pipes


    Pipes are what Unix is really all about. I say that redirection and pipes were
    the heart of Unix, but effective use of pipes defines Unix. Although other systems
    do all right with redirection, only Unix does right by pipes. Although early releases
    of Unix were made before pipes were added, made Unix special.


    The concept now seems absurdly simple: Rather redirecting output of a program
    into a file, we can redirect it into another program. The implications of this
    concept are staggering, and delineate what is thought of as the Unix philosophy.


    The idea of Unix is like a set of good knives. Each has a single purpose. Each
    does well at its appointed task. Some might be used for another task, but only
    poorly. The modern GUI-based operating system, with its bloated, monolithic applications,
    might be thought of as a food processor: It can do all sorts of things, but it''s
    big, complicated and not as flexible as that drawer full of knives. The food processor
    does some things better: When I want to make hummus, I run it through the food
    processor; if I want to carve a turkey, however, I look elsewhere.


    There''s another lesson here: A food processor permits a person with little experience
    to do a good job at slicing vegetables. An expert with a good set of knives, can
    probably do the job faster and better. Some tools, such as knives, reward experience
    and practice. Some, as food processors, do not. At least, the learning curve is
    much more limited with a food processor.


    Many people refer to this as the toolbox philosophy. In order to effectively connect
    these individuals to each other, we need the pipe.


    A pipe is represented by the vertical bar (|), and that is referred to by most
    Unix people as the pipe. The flow of data is from left to right: The program on
    the left of the pipe simply sends its output to the program on the right, which
    sees it as input. A program through which data is piped is known as a filter.'
