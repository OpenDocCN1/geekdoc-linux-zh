    than ask the same questions over and again. (Unfortunately, it tends not to work
    quite that, but it''s much more convenient to tell people to read the FAQ that
    it is to answer the question in full each time it''s asked.) These days the FAQ
    is often posted on a Web page in addition to, or sometimes instead of, being sent
    to the newsgroup on a monthly basis.


    As long as I''m on the topic, newsgroups are often a good source of information
    specific to a given software package. Newgroups are arranged in a tree, by subject.
    comp.os.linux, announce and include comp.os.linux.hardware (for questions related
    to hardware), comp.os.linux.advocacy (for discussions regarding ways to convince
    people to switch or to improve the image of Linux in the wider world), and so
    on. Most Unix groups are in the comp.os.unix hierarchy; many of these groups have
    FAQs.


    Because of the large volume of spam posted to Usenet (a situation that has improved
    at present), and because of the smaller topic, many packages have mailing lists.
    Mailing lists are like newsgroups, the messages go to your mailbox rather than
    forcing you to get them on Usenet. These are generally referenced on the relevant
    software package''s Web page, and often have publicly accessible archives as well.
    I highly recommend you search the archives before sending mail to the, so you
    do not annoy the list readers with questions that have already been answered.
    Those people are your tech support, and it''s in your best interest to reduce
    the work they need to do for help out. If you do, you can often get better help
    from experienced users than you can from official customer support; if you don''t,
    you probably won''t get help from anyone.


    If you use Netscape to browse or read email, you can also use it to read Usenet
