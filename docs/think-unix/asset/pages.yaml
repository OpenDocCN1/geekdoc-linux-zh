    # Chapter 3


    marker (EOF), which on standard Unix systems is represented by Ctrl+D. One more
    important stream is STDERR, which stands for standard_error. This is where error
    messages go, as you''ll find that it''s convenient to send errors some-where different
    than STDOUT or that it''s convenient to send errors the same place as STDOUT,
    when they''d tend to go elsewhere.


    # Reading, Writing, Appending


    Let''s say Elvis wants to take a quick by cutting some text into a file: He''s
    on the phone with Devo about a possible collaboration, and (like us) hasn''t yet
    learned to use a text editor.


    ```

    $ elvis@frogbog$ cat > devo.txt

    Country-Western ''Whip It''?

    ```


