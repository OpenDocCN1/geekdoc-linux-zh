    | Swap: 20480k av 0K used 20480k free 52648k cached |


    Mem represents memory installed on the system. The machine has 192MB of RAM, of
    which just half is used. Most of that RAM, however, is used for buffers and cache,
    to speed up apparent performance. The system also has 200MB of swap space, disk
    partitions used by the system as they were RAM. None of the swap space is currently
    used, which indicates that shortage of memory isn''t limiting our performance.


