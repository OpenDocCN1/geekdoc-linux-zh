  md: '# Desktop Environments


    For some people, a window manager isn''t enough: Some people prefer fully-integrated
    environments that offer a more consistent user experience. The three most popular
    of these are CDE, KDE, and GNOME. We''ll look briefly at each of in turn.


    # CDE


    CDE stands for Common Desktop Environment. It is built upon Motif and, like Motif,
    is only available commercially. Sun and Compaq (formerly Digital) ship CDE as
    the default graphical environment with their flavors of Unix, as several other
    Unix vendors do. Several companies offer versions of CDE for Linux as well.


    CDE uses Motif for its window manager and adds an applications similar to that
    of Windows 95 along the bottom of the screen. This bar has some application buttons
    and menus available. Four different desktops can be accessed via the labeled buttons
    on the application bar. CDE also offers a calendar program, and other custom applications.
