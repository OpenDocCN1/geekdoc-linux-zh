  md: '# vi, Dotfiles, and Regular Expressions Chapter 5 117


    variables every time we edit a file. vi gives us a configuration file in which
    we can save our settings. This file is .virc. Remember that vi was originally
    built on top of the line-oriented reex editor, which explains the first half of
    the many. Many configuration filenames on Unix either begin or end with re, which
    is short for "run control"; that is, they control the programs they do when they
    run. (These files are collectively referred to as rc files, although they don''t
    share a common configuration format.) Configuration files stored in user directories
    are useless to avoid cluttering up directory listings.


    The format of vi''s .ex is simple: It''s a series of commands, one per line. (Remember,
    ex commands are the ones with colons in front of them.) Because vi expects only
    ex commands in the configuration file, omit the colon that leads off command.


