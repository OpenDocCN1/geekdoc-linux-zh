  md: '# v6, Dotfiles, and Regular Expressions Chapter 5 113


    It''s important to understand that vi''s conception of a line of text is different
    from a line of text displayed on your screen. For vi, a line of text doesn''t
    exist in the last row of your display but at the next carriage return character.
    A single line, therefore, can "wrap" over multiple screen lines and still be treated
    as one by one by the editor. This is appropriate for both configuration files
    and for programmers, less appropriate for writing large quantities of text. We''ll
    talk about how to make vi behave reasonably breaking lines in text documents later
    in this chapter.


    If you''ve accidentally deleted the wrong line, or you meant to delete only the
    sentence but not the paragraph? If you didn''t mean to join those lines, or that''s
    not what you meant to paste that? vi''s undo command is u, although it works as
    well. Standard implementations will undo your edit by undo a second time. Some
    fancy implementations, such as vi, allow you to undo multiple commands and have
    implemented a :redo command.


    # Saving and Loading Files


    We''ve already discussed how to save a file when you leave vi, but the user who
    waits to leave the editor to save the file is in a nasty surprise when the power
    goes out, when the network goes disconnects, or when the system crashes. (Yes,
    it does happen, even with Unix.) It has less frequently, of course, on traditional
    desktop operating systems, but even Unix is imperfect!) Fortunately, it''s easy
    to save vi''s current status. From command mode, type :w and hit Enter, and the
    file will be saved.


    What if you''ve been working for hours on a file, only to realize that you don''t
    have write permission for that? Save the file under a different name: :w new_filename.txt
    to do this. If you type :w and then Enter, vi implementations will rescue the
    file under its original name.


    To escape this, we might want to edit the file rather than the old file. To do
    without leaving vi, you can type :edit_me.txt and the system will load whatever
    file you''ve specified. If you''ve altered the file and want to lose your changes
    since the last time you''ve saved, you might need to force the system with :open_me.txt
    instead. You can use :o to edit any other file on the system, not just a variant
    of your current file.


    One more useful command is :r readme.txt, which inserts the specified file into
    the current document right underneath the current cursor. To insert the /etc/group
    at your current position, you could simply type ir /etc/group.


    # Suggested Exercises


    +   1. Enter vi. Leave vi, using a different command to quit.

    2. Enter vi, specifying a file that exists on the command line. Make changes to
    the file and then quit, discarding your changes. (Make sure this isn''t an important
    file, just in case!)'
