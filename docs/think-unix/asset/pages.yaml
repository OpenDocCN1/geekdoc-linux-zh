  md: '# Configuring X Chapter 11


    There is, of course, a notional root widget specified by an empty string before
    this period. That way, there''s a whole tree of widgets, just like directories
    or domain names, and it has a root, just like of them. In practice, the root hardly
    matters because it has no properties of its own: Setting .background would have
    no effect.


    I could have specified xterm.VT100.font because there are no other widgets in
    the tree that can be substituted, but I intend to set xterm*SimpleMenu*font to
    as generally as possible. In fact, in the previous example, I could set xterm*SimpleMenu*font
    to one value and xterm*font no other value. The measure would always use the correct
    font, from the SimpleMenu font resource. How does the system know to do this?
    It knows the most specific resource setting takes precedence.


    What''s the most specific setting? It''s simply setting with the first period
    in the name closest to the generic, or with a more precise widget name than other
    apparently widgets. For example, .background is as nonspecific as a resource and
    can be overridden by any widget with a name to the left of the asterisk, as xterm*background.
    This can be overridden by xterm.VT100*background or by xterm*SimpleMenu*background
    and so on. Whatever is most precise will take precedence. This allows you to have
    very vague defaults: *font: fixed means "Use the fixed font unless I say otherwise,"
    and xterm*font: 7x14 means "Use the 7x14 font for text unless I say otherwise."
    By this measure, xterm.VT100.font and xterm.FontMenu.font are saying


    Another way to measure specificity is to imagine how far to the right that resource
    would appear in the widget tree. Actually happens is that the tree sets the resource,
    and the resource traverses the tree. Each time a widget is used, the resource
    manager starts at the top of the tree and resets the resource to the given value
    each time it moves to another branch of that tree. When it reaches the end, the
    value of the resource is whatever the last thing that was interpreted in.


    Where do you find what resources are good to set? Somewhere in your system''s
    installation of X is an app-defaults directory that contains default resources
    for different applications. (On My Red Hat system, this directory is /usr/X11/lib/X11/app-defaults.)
    These resources all begin with an asterisk; the system prefers the top-level widget
    name. In most cases, the one that is executable, although that might be different
    in a given application. (You can override the default name with the -name command-line-option.)


    Certain widgets are common to all widgets of a given type from a widget set have
    a .label resource that specifies the text label for that widget. The simplest,
    and often the best, to discover good resources is to read the main page for the
    given application. Most X application pages have a Resources section that describes'
