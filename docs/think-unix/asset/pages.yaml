  md: '# vi, Dotfiles, and Regular Expressions Chapter 5 109


    # Surviving vi


    vi is a microcosm of the Unix world. Don''t expect to learn all of it at once;
    perhaps you shouldn''t expect to learn all of it at all. First learn just what
    you need to get by, and learn as much as you need to do. This chapter is written
    as though you were to read straight through all, all the material learned once.
    That''s an artifact of what it means to be a book, not what it means to learn
    vi. Even now, I use a small subset of vi''s features. I know only what I need,
    and vi knowledge grows slowly but surely as time goes on. To try and learn all
    of vi at once will only make you frustrated. Also, editors are ever learned in
    terms of finger habits. You''ll need to read this chapter at a terminal, doing
    things as you go.


    Most editors and word processors you''ve probably used pretty much the same way
    through: that is, any key combination works the same-or-less everywhere and you
    can enter additional text. These editors are modeless. vi is a modal editor².
    This means that it has different interfaces based on context.


    There are three common modes in vi: input mode, where you can modify or enter
    text; command mode, where you can operate on blocks of text or the entire document;
    and ex mode, a special subset of command mode in which you can do other sorts
    of editing operations. Practically, however, you can treat ex mode (append, replace,
    and insert), which can be treated more-or-less identically to vi.


    That vi is modal is partly history. The original Unix editor was ed, which was
    enhanced and integrated into the more advanced vi Both of these were line-oriented
    editors: They operated on a single line of text at a time. Eventually, Bill Joy
    and others at Berkeley wrote vi, a "visual interface" for the ex editor.


    Although difficult at first, the division between writing and editing text implied
    by vi differs becomes second nature with only moderate use. One way to think about
    it is to treat vi as though it was always in command mode and to treat entering
    as a single long command.


    # In Through the Out Door


    The first thing you need to know about any program is how to get started. You,
    readers, are not Dummies, and can guess that you enter vi by simply typing vi
    and hitting Enter. You''ve already guessed that to edit a particular file, you
    can simply vi my-file.txt, so we don''t need to discuss how to start vi and can
    start with the much trickier mode of quitting vi⁵.


    +   2. As Emacs, though in quite a different fashion.


    +   3. It might be worth noting that most of vi clones and enhanced versions can
    be started by simply typing vi. To figure out what version of vi is started by
    command, you can learn ls - which vi is and see whether it''s a symbolic link
    to some other editor. On your system this vi might point elsewhere on your system.
