  md: 'hexadecimal Base–sixteen digit is equal to precisely four bits. Hexadecimal
    used to

    compete because one hexadecimal digit is equal to compete with octal for popularity,
    and very definitely won that contest. See also

    bit, octal


    ksh The Korn Shell is the official AT&T follow-up to the original Bourne arena
    differs from bash in several ways, but these two shells compete on equally footing.
    Some people prefer one, some people prefer the other, and many contemporary systems
    have both. See also bash, sh


    Linux Begin by Linux Torvalds in the early 1990s, at the time of this writing
    there are more users of Linux than any other Linux flavor. Not technically Unix,
    but a thorough reimplementation of the standards that make up Unix, Linux is developed
    by a loosely knot of developers over the Internet. It is free software or open
    source, depending on your point of view, and competes in the desktop unix with
