    # Practice Problems


    +   1. Send yourself email with telnet. (If you don''t receive email on the machine
    you log in, you might need to know the incoming SMTP server for your domain. Examine
    your helpdesk or system administrator.) Examine the Received headers and see which
    mail passed through.


    +   2. If a POP3 mail server is available, read your email using telnet via the
    POP3 protocol. Look at the Received headers on several messages, and trace the
    path from their initial sender to the recipient.


    +   3. Pick a familiar Web site and, using telnet, retrieve the page of the site
    without specifying an HTTP version. Repeat this process, first specifying Version
    1.0, and then again specifying Version 1.1 of the HTTP protocol.


    +   4. Using HTTP 1.1, retrieve multiple pages from a single site without closing
    your connection.


    # Using Machines Remotely


    We''ve already discussed how to use telnet to log in to another machine remotely,
    although at this point we''ve mostly used it to email and browse the Web. Logging
    on to another machine is fundamentally different from using another system''s
    services: When you do the latter, you rely on your local machine only for its
    display, for input, and for network services. All actual computation and storage
    occur on the remote system. When you use a remote system to provide services,
    processing or storage of data generally occurs on your local system.(Except, of
    course, when the service remote system is providing storage.)


    > 10. Most people don''t do that, we''re not most people: We''re Unix people.
    Most people just use telnet to log on to other systems and use them remotely.'
