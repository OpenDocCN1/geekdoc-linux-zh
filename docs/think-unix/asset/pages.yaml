  md: '# Part III X Window System Concepts


    If you set the background resource for the xterm font menu, that would change
    the background color only for that font menu.


    # Specificity and Order of Evaluation


    To fully specify a particular resource, you would start with the top widget name
    and progress down the tree, ending with the name of the particular resource. That
    is, the full name of the resource that represents the background for the font
    menu is xterm.fontMenu.background. Sometimes, however, you might want to change
    more than one resource at a time. If you wanted to change the background not only
    for the font but for all and for the VT100 window, which is the terminal itself,
    you could change the resource *xterm*background. In this case, the background
    resource for any widget in the xterm widget tree would be set whenever you changed
    the value of the resource.


    Customized values for X resources are stored in the file .xdefaults in your home
    directory. Entries in that file look like:


    ```

    xterm*background: WAYARDBLUE

    xterm*foreground: Green

    xterm*scrollBar: true

    xterm*reverseWrap: true

    ```


    Here I set the background and foreground colors for all widgets in the xterm tree,
    turn on the scrollbar necessary, and set the reverseWrap option, which is defined
    on the longterm menu but not menus. However, to change the default font for the
    VT100 window but not menus, I need to be more specific in my resource setting:


    ```

    xterm*SimpleMenu*font: -bbh-lucida-medium-r-normal-sans-*-120-*-*--*--*

    VT100*font: 7x14

    ```


    In this case, the VT100 font is set separately from the SimpleMenu font. SimpleMenu
    is a widget that does not refer to any object on the screen from which the different
    menus are defined. Any of the other menus will take the properties assigned to
    xterm''s *SimpleMenu widget.


    SimpleMenu is a standard widget in the Athena Widget set. If I wanted to set the
    SimpleMenu font for all menus derived from this widget in all applications, I
    could set


    > *SimpleMenu*font: fixed


    In this case, the asterisk stands not only for intermediate widgets in the hierarchy,
    but for top-level widgets (that is, windows or applications) as well. What if
    I had an application top-level resource named SimpleMenu and I wanted to set its
    default font different from the other SimpleMenu fonts? I could specify that SimpleMenu
    was a top-level widget by prepending a period:


    ```

    .SimpleMenu*font: 6x10

    ```'
