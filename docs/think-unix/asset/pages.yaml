    To talk to one another, or even in the case of routers) through one another, they
    must be speaking the same language;Need to know what part of the packet represents
    the number, what part of that machine cares about the packet, and so on. The agreement
    among computers on how to divide this data is known as a protocol. The analogy
    is to social protocols, which tell us how we should behave in polite company.
    A system behaves according to a given networking protocol by sending out compliant
    packets. By Unix people, whose


    limited (by choice) to the Internet, we care only about Internet protocols. The
    complete suite of Internet protocols is known as TCP/IP, named after two of the
    standard.


    # # IP


    Several protocols are used for different purposes on the Internet, but protocols
    can have layers, and the one which all Internet networking protocols run—and thus
    which they depend—is known simply as IP, which stands for Internet Protocol. The
    version in use is just about everywhere version four, often referred to IPv4.


    The IP protocol does not do much. In essence, it has the source and destination
    sockets for a packet and note that it is indeed an IP packet. You can send packets
    via IP, but it doesn''t do much. It doesn''t keep track of the packets arrived
    at their destination, it doesn''t check the order in which packets arrived at
    their destination, and it doesn''t check how many copies of a given packet arrived
    at the destination.


    What is IP? Plenty good! It''s simple, easy for programmers to implement, and
    a good foundation for more complicated protocols. The three most popular protocols
    on top of IP are known as TCP, UDP, and ICMP.


    > 5. Actually, Unix systems talk to other network types as well, including DEC,
    IPX (NetWare), and AppleTalk, but these are diminishing in importance as the Internet
    grows, and for most purposes, we can ignore all the other protocols.'
