  md: '# Shell Scripts


    Just as vsh has a configuration file named .bashrc that stores its configuration
    defaults and runs whenever you start vsh, each shell has one or more startup scripts
    that are executed whenever a shell is started. Which startup file depends on whether
    the current shell is a login shell.


    A login shell is almost what like:When you log in to a system via a text terminal,
    sh, telnet, or the console, you get a login shell. In general, login shells read
    from different configurations and are listed when someone runs the command to
    see who is logged on the system. xterm windows can run your shell either as a
    login shell or a non-login shell. (We''ll talk more about that in Part III)


    If you run a bash shell, it first looks at the system''s generic startup script
    in ~/.profile. After running that, it looks for one of the following three files,
    in order:-bash_profile, ~/.bash_login, or ~/.profile. After it finds one of those
    files, it does not look for any of the others but just runs that.


    When not a login shell, bash runs the commands located in ~/.bashrc. To make sure
    that my environment is always the same, I create a .bash_profile with several
    useful commands, the first of which is source ~/.bashrc, to set my environment
    variables and run my complete configuration. It executes the commands in the current
    shell. It''s built into the shell, check your shell''s man page for details on
    usage.) My general rule is anything that should be run only when logging into
    a box is in the .bash_profile, and anything that should be in xterm should be
    set in .bashrc. In practice, most of my configuration is done in .bashrc, but
    might differ in your environment.


    When invoked as a login shell, ksh first looks for /etc/profile, like bash. Then
    it will look for a ~/.profile file. Because some configuration options might be
    different in bash, I need to have a .bash_profile so that bash doesn''t try to
    read the Korn shell .profile file in my home directory. If, unless you don''t
    switch shells like a manic, this might be unnecessary in your configuration.


    If your system sets the ENV variable, ksh will also read that file for startup
    information. My system sets this to ~/.kshrc, but that might be not be true on
    your system. You can, of course, set ENV to an appropriate value in your ~/.profile
    to make your systems behave appropriately.


    The C shell uses ~/.shrc and ~/.login. The latter of these is equivalent to a
    ~/.profile file in the Bourne shell derivatives. Unlike the Bourne shell derivatives,
    however, the ~/.cshrc file is processed before the ~/.login file. If you use tcsh,
    it will use a ~/.tsh file in preference to a ~/.tshrc, if both are present. (You
    might source the latter from the former, if you so desire, as tcsh is entirely
    backward-compatible.)'
