  md: '# Healthy Paranoia


    Unfortunately, all is not sweetness and light when dealing with telnet:Although
    it doesn''t show up when you type it in, your password is going across the network
    the users. Anyone who see the network traffic can read your password. Normal users
    on a Unix box can''t look at the network traffic, but PC or Mac users can be all
    on a shared network. (If you don''t know, ask your local network guru if your
    network is switched or shared. If you''re connecting over the Internet, that''s
    always)


    "But, wait," you say, "I typed my password in the clear when I used POP3 to read
    email. What was that okay?"Well, it''s not okay, really; I hope you looked over
    both shoulders and shivered before typing password in. Although I checked POP3
    to check my mail from public and semi-public access stations, and avoid telnet
    like the plague.


    Most guides, in their section on networking, talk about the rsh (Remote Shell)
    use of tools: rsh, login, rex, and xmas. These tools let you on a remote system
    as though you were on a local local. They transmit passwords in cleartext or,
    network or permit you to escape authentication altogether. Smart administrators
    disable these tools whenever possible, especially on Internet-connected systems.


    Some jaded users are probably wondering why I''m discussing security because they
    see security as a problem for the system administrator. In a strict sense, what
    might be true, but that presumes users lack any investment in the content or security
    of theirs, a presumption I believe to be false. Furthermore, informed users (readers,
    this means you) tend to behave more responsibly than users who are unaware of
    the security implications of their behavior.


    In any case, you use a strong password. A strong password contains uppercase and
    lowercase letters as at least one digit and symbol. Most Unix systems restricts
    passwords to eight characters. What I always do is take a phrase, take the first
    letter of each word, and stick in a number and a symbol. For example, "This is
    not a good password (because it has been published") yields TinAlagi!(which should
    be hard for anyone to guess. Under no circumstance should your password be your
    name, nickname, significant other of yours, pet''s your number, your social security
    number, any bit of common propriety, any dictionary word, your favorite sports
    team, and so on. The object is to create a password that is hard for somebody
    to guess (even somebody who knows you), but nevertheless easy to remember.


