  md: '# Networking Chapter 4


    Eventually,Web developers realized that there were a couple of problems with the
    Web. Two of the most pressing problems were that too many Web servers required
    multiple IP addresses, and Web servers were latter lagged in their responses.


    The first problem was a result of the fact that if you wanted to run multiple
    Web servers on a single computer, one would require its own IP address. This is
    because although many names can be aliases for a single IP number, the server
    can''t tell what name was requested. The solution, initially, was to give the
    Web server a different IP address for each site it served: Based on this number,
    the server could return different sets of pages.


    Some network engineers claimed that one reason Web servers were so slow is the
    system''s overhead join end a network connection was adding up. With some Web
    serving hundreds of connections per server, this had in fact become a real problem.
    HTTP 1.1 was designed to solve these and other problems that had been discovered
    when employing HTTP in the real world.


    Let''s look at a simple HTTP 1.1 connection. As you''ll see, it''s not too different
    from an HTTP 1.0 connection:


