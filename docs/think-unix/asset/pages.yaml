  md: '# Unix Documentation Chapter 1


    We''re going on a short tour of some of the places all the information you might
    be hidden. Of, much of this documentation uses the same command synopsis format
    as man pages, so you haven''t wasted your time by learning how to read them. Knowing
    how to read man pages is the number one underrated Unix skill; finding the documentation
    you need is the number two underrated Unix skill.


    Some Users say that man pages are helpful only if you already know what you''re
    looking for. Although it certainly doesn''t hurt to know the name of the command
    you''re after, there is another way: apropos or man -k. Some systems have one,
    some systems have the other, and some systems even have both. If your system has
    both, they tend to work identically. In the following, I use apropos, but man
    -k would work identically on systems that have an apropos command.


    To use the apropos command, simply run it with an appropriate keyword for what
    you would like information on. If I wanted information on documentation, I type
    the:


    ```

    [ @jong jon ] apropos documentation

    perld (1) - Look Perl documentation in pod format.

    perld (1) - plain old documentation

    perltc (1) - perl documentation table of contents

    ```


    That''s not exactly what I was looking for, so I''d try a different keyword:


    ```

    [ @jong jon ] apropos manual

    man (1) - format and the on-line manual pages

    man2html (1) - format a man page in html manuals with -mdoc

    plex (1) - XS language reference manual

    where (1) - locate the binary, source, and manual pages for a command

    xman (1x) - Manual page display program for the X Window System

    ```


    We go go! Not only can I find the documentation for the man command, but I''ve
    found xman, so I can read man pages in X, and man2html, so I can convert man pages
    to HTML. Note that apropos searches only the short description given in the Name
    portion of the man page.


    what is a complement to the apropos command:You provide the command name, and
    it provides the short description. If I saw reference to the password command
    and wanted to know what it is, I might type the following:


    ```

    [ @jong jon ] $ password

    passwd (1) - update a user''s authentication tokens

    passwd (5) - password file

    ```


    7. Furthermore, apropos uses a preset database to speed up these searches. If
    your sysadmin has lax in her or that, database might be out of date. (If you are
    the admin, you can rebuild the database with makewhat.makewhat lives in different
    places on different systems; check your manual for more details).'
