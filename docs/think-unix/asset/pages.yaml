    synchronized, one minute and 20 seconds elapsed between the time message was received
    on mailbox and when it was received on razorback. This delay might be affected
    by whether all the machines are simultaneously, the number of people on the mailing
    list, and others.


    It''s clear that every host that passed the message is accounted for: Each header
    lists the host that the mail came from and the machine that received it. Even
    if a machine didn''t add its own header, its name would still appear in the header
    above where that would be. Any omitted header or passes through the same machine
    for the same target would be evidence of a mail configuration problem on that
    machine.


    Sometimes, spammers or editors might attempt to hide the origin of their mail
    by adding fake Received headers at the top of their mail, which would appear below
    the actual headers. You can recognize this by the presence of other inappropriate
    or irrelevant headers stuck between Received headers. The Delivered-To header
    is a special case because it is another piece of evidence in the forensic chain,
    but the intrusion of other headers is often evidence that the sender forged some
    of the headers.'
