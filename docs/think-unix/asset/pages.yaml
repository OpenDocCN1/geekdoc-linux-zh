  md: '# A Brief Demonstration


    Let''s start and stop some useless jobs and see how it all works:


    ```

    [ jon@frogbug thinkunix $ cat

    Control-Z

    [1]+ Stopped cat

    [ jon@frogbug thinkunix $ pr

    Control-Z

    [2]+ Stopped pr

    [ jon@frogbug thinkunix $ jobs

    [1]+ Stopped cat

    [2]+ Stopped pr

    [ jon@frogbug thinkunix $ fg

    Control-Z

    [2]+ Stopped pr

    ```


    After starting cat, which sits waiting for input from STDIN, we suspend it and
    start pr, which also waits for input when we suspend it with Control-Z. We run
    the shell built-in command jobs, which shows us that we have two stopped. The
    most recent job is marked with a plus sign, the job before that is unmarked. We
    continue the most recent job in the foreground—that is, as the process with which
    we are currently interacting—by typing fg, and then we suspend it again so we
    can play a bit more with job control.


    ```

    [ jon@frogbug thinkunix $ bg %1

    [1]- cat &

    [ jon@frogbug thinkunix $ Enter cat

    [1]+ Stopped (tty input)

    ```


    We can act on another job after the last job by specifying it with a percent sign
    and the job number. Here, we send the first job into the background so that it
    can continue to run while we interact with other programs. When returned to the
    prompt, we hit Enter and see, that despite our omission, cat stopped itself again,
    because (so the system reports) it''s waiting for input from the terminal.


    ```

    [ jon@frogbug thinkunix $ fg cat

    Control-C

    ```


    Because there''s nothing we really want to do with cat anyway, we hit Control-C
    to kill it. We hit kill pr to:


    ```

    [ jon@frogbug thinkunix $ kill %2

    Enter

    [2]+ Stopped pr

    [ jon@frogbug thinkunix $ Enter

    [2]+ Terminated pr

    [ jon@frogbug thinkunix $

    ```'
