    # # Low-Level Protocols


    Already we''ve talked about packets shuttling between hosts along routes, but
    we haven''t said the first word about how packets are shuffled. We''re not going
    to say much about this because you have to be a programmer or a network engineer
    really care, knowing the names of these things and a rough idea of what they might
