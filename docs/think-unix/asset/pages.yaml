    # A Short Treatise on Unix Genealogy


    Understand the ps command, our next subject of investigation, you must know a
    little bit about Unix genealogy. Any operating system that runs on dozens if hundreds
    of different computers is liable to obtain a sort of local color in many of those
    places. Those regional differences are bound to influence the children of their
    itinerant parents.


    The great-grandaddy of all Unix was the Bell Labs version of the software. Back
    in those days, Bell shared the source code with everyone. Source code is what
    programmers write before it gets into binaries by a compiler.


    Let''s go over this slowly. At the most basic level, a computer program is nothing
    but stream of ones and zeros, machine code. People don''t write machine code (although
    it was used to, when there was no other way to program computers), but instead
    use other computer languages, which source code turns into machine code, or binaries.
    Source code is much easier to read than an endless stream of 1s and 0.


    There''s an intermediate form known as assembly language. Each architecture has
    its assembly language. Assembly language is usually made of short mnemonics, three
    or four letters long, that correspond directly to a single CPU instruction. Some
    of these mnemonics are followed by the data on which they operate. Most programmers
    know one sort of assembly language or another, but use it on a daily basis.


    Before Unix, every operating system was written in assembly language. At the time,
    most programmers could hand-tune assembly language better than the compilers,
    and with such relatively simple machines, efficiency was paramount. In the early-mid-1970s,
    the Bell Labs people rewrote Unix in the C computer language, using assembly language
    only for small pieces of code that couldn''t be otherwise written or needed an
    exceptional degree of optimization.


