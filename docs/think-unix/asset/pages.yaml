  md: '# 150 Part II Shell Concepts


    Variables need not be named with capital letters, although it is traditional to
    do so for important or persistent variables. As in the preceding example, when
    I want the shell to replace a variable with its contents, I prepend the variable
    name with a dollar sign. At execution, variable is replaced with its contents.

    For example, imagine that I have a variable WHATEVER that is set to /etc/passwd
    and I the command cat WHATEVER. The shell would substitute the contents of WHATEVER
    for the prefixed variable name, and thus interpret that as cat /etc/passwd. If,
    I had defined the command as cat whatever the shell would not substitute the variable''s
    contents for its name, and the command would be interpreted by the computer as
    cat WHATEVER, which wouldn''t do much unless I happened to have a file named WHATEVER
    in the current directory.


    This brings us to the question of how to set a variable. Generally, you can simply
    type VARIABLE=value at the prompt:


    ```

    ```

    [ @frobob ] $ PATH=/usr/local/bin:/usr/bin:/bin

    [ @frobob ] $ echo PATH

    usr/local/bin:/usr/bin:/bin

    [ @frobob ] $ PATH:/sbin

    [ @frobob ] $ echo PATH

    usr/local/bin:/usr/bin:/sbin

    [ @frobob ] $ unset PATH

    [ @frobob ] $ echo PATH


    [n @frobob ] $ echo exit

    ```

    ```


    A variable can be used in combination with plain text and other variables. In
    the third command above, I add /sbin to the path I set in the first command. And
    in the fifth command, get rid of my path: unset clears a variable, removing any
    value it has. I can use the set command to set a Boolean variable, one that is
    either set or has no contents. (You saw a variation of that when I used set -o
    vi to set vi for command-line editing: set -o is used to set options.)


    For the reasons why Unix needs a PATH variable, it needs a MANPATH variable as
    well. The purpose of MANPATH is to list those places where man pages be stored
    on the system. Man pages are stored in subdirectories named man1, man2, man3,
    and so on in a top-level directory generally named /usr/share/man or /usr/man,
    along with parallel directories such as /usr/local/man. My MANPATH is as follows:


    ```

    ```

    [ @frobob ] $ echo MANPATH

    /home/jon/man:/usr/man:/usr/local/man:/usr/X11R6/man

    [ @frobob ] $ echo

    ```

    ```


    With my PATH, I have added a subdirectory underneath my home directory where I
    can place man pages I have added to the system.'
