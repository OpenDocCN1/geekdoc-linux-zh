    You might have noticed that all the numeric addresses you''ve seen have numbers
    separated by periods. Furthermore, if you''ve looked at least of these addresses,
    you might have noticed that each of those numbers is between 0 and 255—precisely
    one byte. The form of four-byte addresses with dots between each byte is known
    as dotted quad notation, for more-or-less obvious reasons. That makes an Internet
    address 32 bits long, which makes a maximum possible number of hosts on the Internet
    4,294,967,296.


    A fair number of these addresses are reserved for special features or for private
    networks connected to the Internet whose machines are never directly accessed
    over the Internet. This reduces the number of available addresses around 20 million.
    Even with the huge number of hosts on the Internet, it seems that we might be
    running short (this point is still under debate, and more strategies are to use
    the actual number of IP addresses in use). To solve this and other problems, version
    six of IP (also known as IPv6) will have a 64-bit address space so that every
    computing device made can be connected full-time to the network, and every other
    device made can have a network computer built into it.


    The other part of it is the port number. Because we''re in a multitasking environment,
    it''s possible—almost certain, in fact—that we''ll want to have more than one
    network connection at a given time. To handle this, the system needs a different
    ID for each network connection. A system can have up to 65,536 ($2^{16}$, or 16
    bits) different ports to which a connection can attach.


    Some of these ports have special meanings: Port 25 is always used to receive email
    from other computers on the network, for example. All ports with numbers less
    than 1,024 ($2^{10}$) are reserved for special purposes. After an initial connection
    is made, the system does a sleight of hand and moves to a different port (which
    can have only one connection at a time, to keep from getting confused) stay open
    for other connections.


