    # Regular Expressions


    In this chapter''s introduction, I noted that regular expressions (often shortened
    to regex by users) are an advanced search-and-replace feature that is nearly standard
    across Unix applications. Most search-and-replace functions look for the exact
    string of text you type, but what when you want to find one of several variations
    on that text? Regular expressions can contain metacters, which can stand for one
    or more characters in your string. In this sense, it like filename globbing significantly
    more powerful. You could think of regex as a small computer language used only
    for describing strings of text, that helps you think about it. (If it doesn''t,
    just think of them as normal strings of text with a number of special characters
    that mean different things.)


    Unfortunately, regular expressions are nearly standard across Unix: Different
    programs were written differently and thus support different regular expression
    functionality. All these are to compatible but never quite perfectly so. In this
    section, I use the GNU versions of grep and sed, and I''m still using vi as my
    version of vi. If the regular expressions don''t work in your versions of these
    programs, check your documentation and see how your flavor handles regular expressions.'
