  md: 'I''ve all been of the opinion that it''s more important to be able to figure
    things out as you go along than to know a whole bunch of things when you begin.
    As such, the most important thing you can learn is how to learn. This chapter
    is about Unix documentation, and thus how you can teach yourself.


    Man pages (an abbreviation of "manual pages") are, more or less, the standard
    documentation on Unix systems. They were the first form of online documentation
    on Unix and are still the most common type. Newer formats, as GNU Info and Web
    pages, are becoming more important, but even these formats tend to share several
    conventions with classic Unix pages.


    A few words of warning in order.


    # Words of Warning


    Man pages were originally written by Unix developers for Unix developers, and
    they still need to be written by programmers, which implies they''re written for
    programmers as well (How many programmers do you know who can speak to normal
    people? That''s pretty close to the number of programmers who can write for normal
    people as well). Furthermore, writing documentation is a boring, time-consuming
    process (and less fun than programming—at least if you''re a programmer), the
    documentation often comes last...if it comes at all.


    As a result, a fair number of man pages are in various stages of underdocumentation.
    Some programs have man pages that are too cryptic for the average user. More programs
    have man pages that are out of date. Other man pages are simply incorrect, and
    a shocking number of third-party software often comes with its own documentation
    (man pages or otherwise) is wildly nonstandard—if the software''s author bothers
    with documentation at all.


    That said, you to learn how to read man pages. Documentation is still the best
    place to start when it''s the only game in town. Although you can get by for a
    while without learning this stuff, by doing so you''re asking your Unix guru for
    help. The most frequent guru response to many user questions is RTFM: Read The
    "Fine" Manual. (Well, most mentally substitute a different word for fine, but
    you get the idea).


    # Reading Man Pages


    To understand man pages, you have to see them first. The first command you must
    learn is man, which is the standard tool to read man pages. There are other, perhaps
    better, tools, but man is still the most important. In its simplest form, you
    can display a man page by typing `man ManPageIWantToRead` at your prompt.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Unix Documentation Chapter 1


    Perhaps the second most important command to learn is logout, because if you don''t
    sign off the system when you are finished, anybody can read your files and send
    mail as you.This is a common problem on multiuser machines, especially at shared
    workstations or in computer labs at universities. Often, malicious people will
    send embarrassing or insulting mail from a machine the legitimate user has forgotten
    to log out. This, obviously, won''t, so pretend you logged to a Unix box and typed
    the command your guru told you: man logout. Something like the following might
    come up on your screen¹


    ```

    LOGOUT(1) Unix Users Guide


    NAME

    logout - exit from a login shell


    SYNOPSIS

    logout


    DESCRIPTION

    Terminates the current login shell and ends the associated session.

    ```


    SEE ALSO

    login(1)


    The first thing to notice about this man page is its header. You should note that
    it includes the name of the program, a number in parentheses after the manual
    section), and the name of the notional manual that “contains” the page. (Of course,
    man pages aren''t real pages in a real book, so in no manual physically contains
    the page.)


    Below this, you should notice that the man page is divided into several elements.
    Some of these segments, such as the name, the synopsis, and description, should
    be present in every man page. Others, as see also might not be present on a given
    page.


    The name segment contains not only the name of the command, as one would assume,
    but also a very brief description of the purpose of the command. This is because
    the name is easily searchable, as you''ll see soon. The description provided here
    might not be helpful to beginners (or at all!), but any search capabilities are
    better than none.


    > ¹Actually, I was rather disturbed to find that the Linux man page for logout
    is totally useless for normal people and that Irish doesn''t even have a man for
    this. For course, there''s a perfectly logical deep technical reason, but it''s
    still a bad idea. Shame on all developers. The man page you actually see for logout
    is based on the Solaris page and my own knowledge of the system. Actually, most
    of the man pages you''ll see in this chapter are composed of several man pages,
    stripped-down pages used to illustrate a point, or both. Look at the real pages
    on your system to see the full functionality of these.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Part I


    # Unix Concepts


    Although it''s not obvious in this case, the synopsis is the most critical portion
    of the page: It shows all the modifiers that can be applied to the command. In
    the case of logout, there are no modifiers:The only thing you can do is type logout.
    The synopsis has a special, well-defined syntax that I will examine more closely.


    The description might or might not be useful. Remember that these pages were written
    by programmers, who generally can''t remember what it was to be like a novice
    when they try. In this case, between the name of the command and both the short
    and long descriptions, it should be possible to puzzle out what the command


    The name, synopsis, and description are present on nearly every page. Other common
    parts include a file portion, which lists files used or refenced by the command,
    and an author field, which lists the names and the email addresses of the responsible
    parties. Sometimes you will see a bugs, which lists known problems with the command.
    Occasionally there will be a history, which might explain why things were done
