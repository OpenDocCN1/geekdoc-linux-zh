  md: 'Not surprisingly, there''s more than one way to quit vi. It all depends on
    what you want to do, but every way to leave vi requires that you be in command
    mode. If you''ve just started vi and have a nice blank screen, you''re already
    in command mode. If you''re not sure, hit Esc to insert mode, if you''re in it.
    If you''re not, hitting Esc doesn''t hurt anything. Heck, when I want to really
    sure I''m in command mode, hit it four or five times in a row. If you started
    typing a command but lost track or made a mistake, Esc cancels a partially entered
    command and lets you begin again.


    The simplest way to leave vi is to type **ZZ**. This will save any changes you''ve
    made and exit. Another way to accomplish the same thing is to type `:wq` (the
    colon means that this is an command, which in this case is write and quit). If
    for reason you need to force the system to write the file, just type `:q!` instead.
    (You might want to do this if you''ve changed the file but want the system to
    quit without.) Most people use either this last command or ZZ as their preferred
    method of quitting vi. It doesn''t really matter which of these you use; pick
    one and stick with it, at least for a while.


    In vi (and other editors) you''re editing something called a buffer, which is
    a bunch of text in memory (usually not always) associated with a file. The file
    doesn''t actually change until you save the changes to the buffer are written
    to disk. If you don''t want to save the file because you''ve completely wrecked
    the buffer or just changed your mind? Simply quit with :q! In general, :commands
    that end with an exclamation mark, or bang, force the command in some way or deal
    with fighters. (We''ll talk about that case later.)


    You might want to try entering and leaving several times, just to become comfortable
    with it. Try all these different methods and find what works for you.


    # Basic Movement Keys


    Before we really learn to write in vi, we need to learn to move around. When vi
    was new, every computer keyboard was entirely different. You couldn''t even guarantee
    that a particular terminal had arrow keys. Although modern vi implementations
    support arrow keys, that is not universal. All vi flavors support an unusual but
    consistent set of movement keys: h, j, k, and l. As with all commands, these keystrokes
    are sensitive and are to be entered in command mode.


    Although these might appear to be the most ridiculous keystroke commands you''ve
    ever heard, there''s some internal logic. Of these four keys, h is the leftmost,
    and l is the rightmost, and moves the cursor right. Slightly less logical the
    choice of j to move downward; I fancy that this is because Control-J, ASCII code
    10 (decimal), is the control character that moves the cursor down a line. That
    leaves k, which moves upward.'
