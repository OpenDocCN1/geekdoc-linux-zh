    forward slash. To give an absolute path to a file or directory, it must have a
    leading slash, representing the root directory, and then every directory between
    that and the one you''re interested in. The Desktop/Autostart directory (a path
    relative to Elvis''s home directory) might have an absolute path of /home/elvis/Desktop/Autostart
    or (generally on a larger system) /users/e/elvis/Desktop/Autostart.


    Think of the root directory on Unix as you look like different disks on the system
    each like a folder. (On Unix, actually, all disks are mounted by the system administrator
    in a particular subdirectory, but that might be at any level in the system, just
    directly under the root directory.) PCs it somewhat different because each drive
    has its own root directory, but pay along a minute and pretend that each drive
    letter is a filename in an imaginary root directory. (It''s a stretch, but I promise
    you the concepts are logically equivalent.)


    As both PCs and Macs, filenames must be unique within a given subdirectory, but
    those filenames can be used at other points of the filesystem: I can have a file
    named test in my home directory, and could have a file named test in any subdirectory
    in that directory. (Here, if I wanted to, I could even have a file named test
    in a directory name, but might get confusing. Of course, I do not it.)


    On Unix, each directory has a parent directory: /home/elvis/Desktop''s parent
    directory is /home/elvis, and its home directory is /home. Of course, that''s
    helpful for dealing with absolute paths. How could you use this concept of a directory
    with relative paths?


    The answer is surprising, perhaps, also elegant: Each directory inside that it
