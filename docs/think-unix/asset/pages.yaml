  md: "Imagine a graph of a computer network, or pages on the World Wide Web. Imagine\
    \ the links as lines, and the pages or systems as dots where the lines meet. These\
    \ dots are nodes. Terminals are nodes, computers are nodes,Web pages are nodes.\
    \ You're a node, too, but what's the line, and what's on the other end of it?\n\
    \nAn entry in the GNU Info hypertext system.\n\nFour bits, equal to hexadecimal.\
    \ One byte is made up of two nibbles, hence the name. See also bit, byte, *hexadecimal*\
    \ \n\nThe base-eight numbering system. One octal digit equal to three bits. In\
    \ the 1970s, there was debate as to whether octal or hexadecimal was better for\
    \ use in computer systems. The argument for octal was that it was more human-readable,\
    \ and it didn't require the use of letters as digits. The argument for hex was\
    \ that all words were powers of two bits *long* and that it was more compact.\
    \ Hexadecimal won, decisively. See also bit, hexadecimal, word\n\nA name for free\
    \ software that emphasizes the practical rather than ethical or political aspects\
    \ of the movement. Advocates of open source claim that open source is morally\
    \ superior, rather that it is technically superior, more secure, and Provides\
    \ for a greater level of control than closed-source countless. The Open Source\
    \ Initiative home page is at http://www.opensource.org/. See also *free software*\n\
    \nWhen people graduate from shell scripts and require more power and control,\
    \ perl is the language they turn to. A sort of mish of C, sh, sed, awk, and regular\
    \ expressions, it is a highly flexible and powerful combination. If you want to\
    \ learn perl, the place to start is\n\n+   Schwartz, Randel, et al.\nLearning\
    \ Perl, 2nd edition\nO'Reilly & Associates. 1997.\n\nThe standard reference work\
    \ on the topic\n\n+   Wall, Larry, et al.\nProgramming Perl, 2nd edition\nO'Reilly\
    \ & Associates. 1996.\n\nSee also *awk, C, sed, sh*\n\nPINE is the standard terminal–based\
    \ mail program for users new to Unix. More like a typical PC application to a\
    \ Unix application, PINE makes it difficult to make dangerous mistakes. It's slow,\
    \ relatively large, and full of pretty menus"
