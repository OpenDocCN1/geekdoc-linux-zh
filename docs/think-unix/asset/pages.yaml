  md: '# Variables and Quoting Chapter 7 155


    Around the time vi was written, this had clearly become an important problem.
    The solution to the TERM variable and a file in the /etc/termcap contained information
    about the capabilities of various terminals. The user would set a TERM variable
    when logging on to a machine so that screen-addressable programs would work properly.


    Eventually, the terminal industry settled down, and several types became facto
    standards that other manufacturers would emulate. Several DEC models became popular
    targets for emulation, chief among these the vt100 and vt102 terminals, although
    the vt220 was also quite popular. The vt102 was just an update of the vt100. The
    most notable difference was a fix for some display bugs. (I''ll come back to this
    in a minute)


    Not surprisingly, none of the terminals emulated the vt100 or vt102 did perfectly.
    As a result of this, many terminal emulations are still listed in the /etc/terminfo
    directory. The /etc/terminfo setup was another attempt to solve the problems as
    /etc/termcap and is the infrastructure upon which the curses and full-screen programming
    interfaces rely. (Traditionally, term was the BSD Unix solution to these problems
    and /etc/terminfo was the System V solution.)


    In fact, many programs that claim to emulate a vt100 terminal actually emulate
    the vt102 due to the absence of a bug regarding the display of attributes as bold
    or underline. If your display is correct except for the underlining or bold of
    text, try your TERM from vt100 or vice versa.


    # Arbitrary Variables


    Of course, no shell limits you to the built-in variables with special functions.
    Instead, you can create any number of arbitrary variables that you desire, as
    long as their names do not conflict with special-purpose variable names. (In bash
    you can type help variables to see a complete list of reserved variable names.
    Check the documentation for other shells as necessary)


    Why would you create a variable? Some variables are used by other programs on
    your system to provide configuration information. One interesting pair of variables
    is EDITOR and VISUAL. In the Korn Shell, these variables control whether you use
    your command line with Emacs or vi command-line editing keys, as we saw in the
    previous chapter. In other shells, however, these variables are accessible by
    running programs to determine which editor to use when an editor is required.
    VISUAL usually overrides EDITOR, PAGER defines the default pager (more, less,
    cat, or whatever else you desire) for displaying informational screens. Depending
    on the software you run, other variables might be useful for configuration.'
