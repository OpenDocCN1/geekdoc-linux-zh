  md: '# Shell Concepts


    Another fundamental property of computers is conditional execution. Put simply,
    it means computers can change what they do depending on the circumstances. That
    sounds completely obvious, but consider the implications:Without the capacity
    to make decisions and act on input, a computer is just an expensive calculator.
    Without conditional execution, user input doesn''t mean much of anything because
    there''s no way to say,"If the user picks save, store the file on disk, but if
    the user picks load, ask what file to read off the disk." Conditional execution,
    broadly speaking, is the ability for a programmer to say,"If it is so, do this;
    otherwise,do this thing."


    Conditional execution also makes loops. A loop is exactly what it sounds like:
    a number of instructions that is repeated. It might do something for each item
    on a list. It might repeat itself a fixed number of times, or it might wait for
    a specific condition to be met, receiving a particular response from the user.
    In this chapter, we discuss how to use both conditional execution and loops to
    work efficiently in the shell. As always, bash is our reference platform, although
    everything in this chapter should work well on ksh and most everything in this
    chapter should work in either of these shells.(They do syntax for equivalent functionality,
    but I do not cover it. Sufficient resources should be available on the Internet
    or in bookstores if you''re interested in these shells.)


    # Sequential Execution


    To understand conditional execution we must first understand the alternative,
    sequential execution. Sequential execution is just what it sounds like: one command
    run after another, regardless of the circumstances. This isn''t the same as typing
    in one command at a time because you might type different commands depending on
    what has already happened. For example:


    ```

    [jon@frogbob jon]$ cd new_directory

    bash: new: No such file or directory

    [jon@frogbob jon]$ mkdir new_directory

    [jon@frogbob jon]$ cd new_directory

    bash: new: No such file or directory

    [jon@frogbob jon]$ cd new_directory

    [jon@frogbob new_directory]$

    ```


    I make several mistakes in that sequence of commands. Because I''m using this
    shell interactively, I am able to correct these mistakes. That is a particular
    sort of conditional execution.


    Unix uses the semicolon (;) to separate commands for sequential execution. Each
    command in sequence, from left to right, is without regard for the success or
    failure of the previous command:


    ```

    [jon@frogbob jon]$ mkdir the_flintstones; cd the_flintstones; touch barley

    bash: the flintstones: no such file or directory

    [jon@frogbob jon]$ pwd

    ```'
