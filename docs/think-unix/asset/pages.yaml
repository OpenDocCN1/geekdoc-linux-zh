  md: '# 134


    Part II Shell Concepts


    Once or twice already we have run the concept of the shell, the Unix program that
    interacts with the user. This doesn''t just include allowing the user to run programs
    but also allows redirection of output and piping output from one program to another.
    The logout command is actually built into your shell, as are unmask. The shell
    is also responsible for several features that we haven''t discussed. In this chapter
    we will discuss command-line editing and job control. In the next three chapters
    we will discuss other important shell concepts, including quoting, using variables,
    loops, conditional execution, and more.


    There, strictly speaking, no requirement that a shell function in accordance with
    the standard Unix way of doing things. If one wanted to create a shell that worked
    identically to MS-DOS would be eminently possible. In fact, there''s no requirement
    that shell even have a command line—you could potentially write a shell with a
    menu-based interface. In the Unix world, however shells fall into one of two “families”
    and work along those lines.


    # Shell Wars


    A long time ago (if for 1978 is long past), in a laboratory far, far away (unless
    you happen to be near Murray Hill, New Jersey, home of the fabled Bell Labs, which
    was the birthplace of Unix) the Bourne Shell was written. This shell, named after
    its author, Stephen Bourne, was a replacement for the original Unix shell, known
    simply as “shell”. At about the same time, a heroic band of rebels (if the stories
    are to believed) centered around Berkeley, California, created another shell,
    the C Shell (The vast majority of work is created by Bill Joy.)


    Each of these shells offered significant improvements over the previous shell:
    The Bourne Shell (/bin/sh) allowed for advanced scripting and the use of the shell
    to write relatively complex programs, and the C Shell (/bin/sh) had advanced functionality
    for command-line editing and the control of multiple simultaneous processes (job
    control). It combined these with a programming syntax reminiscent of C, the programming
    language in which most of Unix is written.


    Several things had that conspired to keep all users on a single shell. While the
    Bourne Shell didn''t have command-line editing features or job control, the C
    Shell’s redirection features were somewhat less powerful than those of the Bourne
    Shell, and its programming features were a little buggy. By a result of this,
    the default at many sites was the C Shell for interactive but use shell scripts
    in the Bourne Shell.


    Later, both of these shells were found to be inadequate in one way or another,
    and many other shells were written to compensate. The three most popular replacement
    shells are (in no particular order) the Korn Shell (/bin/ksh or /usr/bin/ksh,
    depending on your system), the Bourne Again Shell (/bin/bash, /usr/bin/bash, or'
