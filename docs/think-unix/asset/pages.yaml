- img_proc: true
  md: '# Listing Fonts


    The simple way to list fonts is to run the program xlsfonts, which displays all
    fonts installed on the system when without any options or arguments. Fonts can
    be named several different ways. Let''s examine some output from xlsfonts. (This
    output is not necessarily in the order in which it would appear but as it is convenient
    for us to learn.)


    ```

    [jon@frogbog jon]$ xlsfonts

    ...

    10x20

    12x24

    5x7

    5x8

    6x10

    6x12

    6x13

    6x13bold

    6x9

    7x13

    7x13bold

    7x14

    7x14bold

    8x13

    8x13bold

    8x16

    9x15

    9x15bold

    ```


    These fonts are all monospaced fonts at a particular pixel size. 10x20 is 10 pixels
    wide by 20 pixels high, 5x7 is five pixels wide by seven high, and so on. Some
    of these fonts also have bold variants. All fonts used for display byterm must
    be monospaced fonts. These fonts are not only monospaced fonts, but bitmaps are
    stored in the system by a pixel-by-pixel basis. If requested, the system will
    try to scale the fonts and use them at a size other than their physical resolution,
    but these fonts look blocky and jagged and are quite ugly as a result at any size
    other than their default.


    Not all mapped fonts are monospaced fonts. Some are proportional or variable width


    ```

    [jon@frogbog jon]$ xlsfonts

    ...

    lucidansans-10

    lucidans-12

    lucidans-14

    lucidans-18

    lucidans-24

    ```'
