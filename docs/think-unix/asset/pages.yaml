  md: 'To change every occurrence of dog to cat, we could do something like the following:


    ```

    cat animals.txt | sed -e ''s/dog/cat/g'' > animals.txt

    ```


    sed runs through its input line-by-line, does search and replace, and sends each
    line to its output. The term to search for is a regular expression, and the replacement
    term is a normal string of text with a couple of special regular-expression symbols
    permitted. It wouldn''t make sense to replace one expression with another, in
    both terms, [B]d[ogg]ies, it might be obvious to a person that a capital letter
    in the search pattern should remain capitalized in the replacement pattern, but
    what if we were replacing [se]ou]ts with [ch]uts? Because of the difficulty of
    solving this problem in the more general cases, Unix makes the decision not to
    solve the problem.


    By default, sed uses the forward slash to separate the search pattern, the replacement
    pattern, and whatever option you append to that. However, you can use any other
    character for separator as long as you consistently use it that command. For example,
    s[hl]ouse= or s[xm]erverx is


    So what''s option g at the end of our original search example, cat animals.txt
    | sed ''s/dog/cat/g'' > animals.txt.new? G stands for "global," indicating that
    the search and replace not only the first occurrence on a given line but every
    occurrence on that line. The other frequently used option is 1, which does non-case
    sensitive matching; that is, s/dog/cat/ replaces every occurrence of dog, Dog,
    DOG, dOG, and so forth on the given line with cat. For the reasons discussed above,
    cat is always lowercase; I know no general solution to the problem of replacing
    one string with another while preserving case.


    # Arbitrary Numbers and Hold Buffers


    Sometimes it might be necessary to keep part of a pattern while replacing other
    parts of it. Imagine I had a long list of phone numbers all in slightly different
    formats: Phone numbers might be like (410) 555-1214, (410)5551214, 4105551214,
    410 555-1212, or 410-555-1212. To make this file readable, I want to rewrite all
    phone numbers as last form. I can do this with sed


    ```

    sed ''s/\(\([0-9]\\{3\)\) \([0-9]\\{3\)-\([0-9]\\{4\)\)\)\\([0-9]\\{3\)\)\([0-9]\\{3\)\)\([0-9]\\{4\)\)\|([0-9]\\{3\)\)
    [][0-9]\\{3\}-[0-9]\\{4\}/1-\2-\3/g''

    ```


    and will regulate all the phone numbers in this file to the format 410-555-1214,
    regardless of whether those numbers stand alone on a line or are mixed in


    +   8. Unix tends to err on the side of predictability. Rather than a complex
    and difficult algorithm that corrects what you want 90 percent of the time but
    does something and unpredictable the rest of the time, Unix will use a simple
    and straightforward algorithm that is predictable 100 percent of the time. Complete
    predictability is a crucial attribute of powerful tools.

    9. Being a U.S. resident, and believing that the world revolves around my country,
    I shall pretend that only ten-digit U.S. phone numbers exist.'
