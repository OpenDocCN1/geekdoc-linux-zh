  md: '# Glossary and References Appendix B


    It''s worth noting the ascendancy of Unix in the 1980s coincided with the fall
    into LISP machines and computers based entirely on that language. It''s my suspicion
    that Emacs was created so that those users could emulate LISP machines on faster,
    less expensive and arguably elegant Unix machines. See also LISP, vi


    Enlightenment is a heavily customizable window manager. Although it''s heavy on
    memory usage and wastes bazillions of CPU cycles, most machines are powerful enough
    that some users can run it. It''s very pretty looking, and it can be very, very
    difficult to use if the theme designer chooses to make things tough. The Enlightenment
    home page is at http://www.enlightenment.org.


    FAQ Frequently Asked Questions. Most newsgroups and informative Web sites maintain
    a list of frequently asked questions. It is considered to check this list to see
    whether your question is answered before sending mail to any person, list, or
    newsgroup. A large, far from complete, set of FAQs is maintained at http://www.faqs.org.


    FSF Free Software Foundation is committed to the principle of free software. They
    are the people behind the GNU project. Many people are fully committed to the
    ideals of free software, but many others are not, and they often deploy the tactics
    or goals of FSF Some of these people believe in open source software, and are
    committed to commercial software. The FSW Web site is at http://www.fsw.org/.
    See also free software, GNU, open source


    FWVM Virtual Window Manager. Once the most popular window managers in the Linux
    world, this stalwart is still in use by the faithful. Its configuration files
    can be customized using the Preprocessor and other macro languages, making it
    extremely flexible. The FWVM Web site is at http://www.fwvm.org/.


    GNU, a recursive acronym named “GNU Not Unix,” is an attempt to create an entirely
    free (in the sense of free software) Unix distribution. Having completed a large
    portion of the work but not developed a kernel, Linux stepped in to complete the
    system. Partisans of the FSF often refer to Linux as GNU/Linux to indicate that
    many of the tools come from the GNU project; others claim the GNU is responsible
    for a lesser portion of the system than it does. See also free software, FSF,
    Linux, open source'
