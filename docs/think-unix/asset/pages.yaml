    ```


    There''s a pseudo-user called games on the system, which can be logged in and
    has no home directory. When the xhetris program executes, it can read and write
    to files that only the games pseudo-user would normally be permitted. In this
    case, there''s high-score file is stored on the system writable only by that user.
    Elvis runs the game, the system acts as though he were the user games, and thus
    is able to store the high-score file. To set the setuid bit on a file, you can
    tell chmod to give it mode u+s. (You can think of this as uid set, this isn''t
    technically accurate.)


    # setgid


    The setgid bit, which stands for "set group id", works almost identically to setuid,
    except that the system acts as though the user''s group is that of the given file.
