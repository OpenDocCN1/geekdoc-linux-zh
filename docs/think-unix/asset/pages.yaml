  md: '# Part III X Window System Concepts


    The standard graphics system for Unix is formally known as The X Window System
    and is known informally as XWindows (which for some strange reason upsets some
    purists), and is known less formally as X. I say it is greater rather than a graphical
    user interface in fact there is not a single GUI built on top of X but many different
    GUIs that you can choose to use. No matter what GUI you choose, almost any X-based
    application will run just fine on, the look and feel might not be at all consistent
    with the rest of your environment.


    This chapter is dedicated to helping you understand the design decisions that
    created this system and to giving you a quick look around the X Window System.
    Frankly, it''s not worth the time to teach you most X applications because many
    are simply point-and-click menu-based interfaces. This chapter should get you
    comfortable with X, and the next chapter will teach you how to customize your
    environment.


    # What X Does Differently


    If you''re not already on the concept, you should know that X does things a little
    differently than either Windows or Macintosh. In particular, the X Window philosophy
    is "mechanism, not policy," and almost the entire design flows from that idea.
    Another idea is that X network transparent and client/server. First we need a
    bit of history, and then we can discuss all of this means to you.


    # A Little Bit of History


    The X Window System grew out of a 1980s MIT project known as Project Athena. There
    were two goals for the project: first, to discover how MIT should integrate computers
    into their curriculum; and second, to build a distributed environment for the
    MIT campus. Project Athena started in 1983 and scheduled to run for five years.
    (Ultimately, the project was extended for another three years and finally shut
    down in 1991 after achieving many of its goals.) What distributed computing environment
    really means is that anyone on the MIT campus should be able to get to any file,
    any machine, and any printer from anywhere. To do this, you need a good network
    on campus, and software and hardware-to support that network.


    In 1984, the Macintosh was released, and, as part of Project Athena, the X Window
    System was created. Like Apple''s Macintosh, X was designed to be a graphical
    system. Unlike Macintosh, the X design team was not staffed by a team of artists,
    and therefore it simply didn''t look as nice. Furthermore, the Macintosh operating
    system was tightly coupled to the hardware, whereas the design of X was not.'
  merge: -1
  pgno: 208
- img_proc: true
  md: "Why wasn't the design of X closely tied to the computer for which it was designed?\n\
    Simply, MIT didn't know what hardware become available, or what hardware\npeople\
    \ at the university would design. Therefore, the X Window System needed to\be\
    \ designed on any graphical computer made available to the staff or student\n\
    body of the university.\n\nAt first, of course, hardware support was rather limited.\
    \ Nonetheless, the idea of\na graphical tool held. Rather than having one computer\
    \ that both displayed-CPU-intensive tasks and large range, complex pieces of software,\
    \ it might be\nmore efficient to use one, shared computer to do the calculations—our\
    \ stan-\ndard multiuser Unix server—and a separate machine to display the\ngraphics.\
    \ That separate machine wouldn't have to do much work. Like an old term-\\inal,\
    \ it would merely need to display whatever was set to by the main computer.\n\n\
    # The X Window Client/Server Model\n\nThe division of tasks between two separate\
    \ machines in this fashion is known as\nt client/server model, a now commonplace\
    \ term in the computing industry. In the\\standard client/server model nomenclature,\
    \ the server is the heavy-duty machine in\nt background, and the client is the\
    \ machine responsible for display and possibly\ninital processing of data.\n\n\
    To illustrate the traditional client/server model, imagine a Web browser and a\\\
    plex Web site, that is the server, and your Web\nbrowser is the client. In fact,\
    \ for many specialized applications the browser/server\nmodel has overtaken the\
    \ traditional client/server model, which presupposes custom-\nwritten software\
    \ on a particular target platform (see Figure 10.1).\n\n![](img/2f323bb3f55b6c176d89a3f1c4fe9183_209_0.png)\n\
