    # Job Control


    Because Unix is a multitasking operating system, there''s a very good chance that
    you might be doing more than one thing at a time. (In another era, this would
    be thought of as “hyperactive,” or perhaps “lacking focus”; but today we call
    it “Making effective use of technology!” How times! Given we''re doing more than
    one thing at a time, it''s a pretty good chance that we might want to have influence
    over what we''re doing and when we are doing it. In a system developed today,
    this would probably be done through some cute graphical control panel, but because
    Unix''s multitasking heritage goes back nearly 30 years, there are several command-line
    tools for controlling your jobs.


    # What''s a Job?


    “Wait,” you say, “I was just getting used to processes! What are these jobs you''re
    talking about?”


    Good question. Back in the old days, before users had so much as a teletype to
    talk to their computers, if you wanted the computer to do work, you would need
    to submit a large pile of punch cards which you had punched out your instructions.
    You would hand your large pile of punch cards to the wizards in charge of the
    machine, and much later you would receive back your pile of cards and output (hopefully
    the output you were hoping for, but more likely an error message you punched one
    of your cards wrong) - the pile of cards was your job.


    In Unix terms, a job is a process or series of processes you''re running. That
    is, its based on what was entered on a single command line than on a per-process
    basis. Since you need tools to suspend jobs, you can have more than one job at
    a time, and run them in the background, switch jobs to the background, and switch
    them back to the foreground again.


    Suspending jobs is usually easy: most programs permit you to suspend your key,
    which on every system defaults to Control-Z. Some programs by default will disable
    the suspend key. Notable in this regard are many mail readers and editors. Often
    there will be an option to prevent the program from disabling suspend. A Unix
    user who prefers that the system gives him rope to hang myself, to reen suspend
    in my applications, but opinions on this matter differ considerably.


