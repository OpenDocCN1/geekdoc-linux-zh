    # Reading Input


    The read command is for us. It''s a pretty simple command. The read is followed
    by any number of variable names. The shell reads one line from standard input
    and assigns one word to each variable, in order. Any extra text is appended to
    the last variable, and if fewer words are input than there are variables requested,
    excess variables are set to null strings:


    ```

    []@frogbog jon$ TEST2=something

    []@frogbog jon$ read TEST1 TEST2

    test!

    []@frogbog jon$ echo $TEST2

    []@frogbog jon$ read TEST1 TEST2

    test test2 test3

    []@frogbog jon$ echo $TEST1

    test!

    []@frogbog jon$ echo $TEST2

    test2 test3

    []@frogbog jon$

    ```


    The shell uses the IFS to determine what constitutes a word. IFS is for Inter-Field
    Separator and is by default set to space, a tab, and a newline, in that order.
    Any character contained in the IFS indicates a word break when present in a string.
    tabs, spaces, and newlines all indicate word boundary. (Newlines cannot separate
    words in the above example because the read command uses a newline to indicate
    the end of input.)


