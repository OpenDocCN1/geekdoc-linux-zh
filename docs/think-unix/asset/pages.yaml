    # Fixing Mistakes


    We make three kinds of mistakes when working on computers: typing errors, logical
    errors, and errors in judgement. Errors in judgement are beyond the scope of this
    discussion, but the effects of the other two might be ameliorated with command-line
    editing and history commands. Command-line editing allows us to interactively
    correct mistakes on previously typed commands, and history functions allow us
    to return or alter commands we have already run. If these sound similar, they
    are, because different shells support different mechanisms, it behooves us to
    learn both groups of features. We''ll cover interactive command-line editing first
    because it''s simpler to use. If you''re just getting started, you might want
    to learn this right way and return to history substitution only when you''re comfortable
    and learn to more.


    # Interactive Command-Line Editing


    Interactive command-line editing is supported by all the more recent shells: tcsh,
    ksh, and bash all support sets of commands for editing previously typed commands,¹


    The most popular of these commands are the arrow keys.You can use the arrow to
    scroll through all the previous commands you''ve typed, and when you''ve found
    the command you''d to execute, hit Enter. If you find that you passed the command
    for which you are searching, hit the arrow down until you''ve found it.


    If you''re using the Korn Shell or the Bourne Shell and this doesn''t work, type
    the command set -e emacs and see whether it works then. If you''re using tcsh,
    type bindkey to reset it. Note that all these commands implement emacsstyle editing.
    Most of the keys you''ll use are similar to their vi counterparts, we''ll take
    a look at how to switch to vi-style editing in a few moments.


