    # Thriving in vi


    By now, you will be fairly comfortable with vi. That doesn''t mean knowing and
    using every single command, but it does mean knowing enough to wander around and
    edit files. Few people use all the features, and fewer still remember them all.
    I keep a reference card at hand and refer to it frequently. This section covers
    some parts of vi that aren''t crucial if you occasionally use vi to edit some
    configuration files but are great if you spend any significant amount of time
    working in vi.


    If you''re not yet comfortable with vi, return to this section when you''re ready.
    You won''t get much benefit from the rest of this chapter until then anyway.


    # More Editing Commands


    Besides simple line-oriented editing, vi allows you to work with logical units
    in your document. Instead of deleting single lines or characters, you can combine
    a single with one of the movement commands we discussed earlier: a will delete
    from your cursor position back to the beginning of the paragraph, d will delete
    from your cursor position forward to the end of the sentence, e will delete from
    the cursor to the end of the current word, w will delete to the beginning of the
    next word, and so on.


    The delete command works like "cut" in modern GUI systems, and the paste command
    works similarly too. The GUI''s "copy" command in vi becomes yank, y copies the
    current line so that it can be pasted into the text. You can combine a single
    y with movement commands in the same way as the a command can be combined with
    movement keys. For example, y copies the text between the cursor and the end of
    the sentence, yw copies to the beginning of the next word.'
