    The syntax for ssh, the program that replaces rsh, login, reexec, is fairly straightforward.
    If I''m at razorback''s console and Elvis, who is looking over your shoulder,
    wants to log on to frogbob, I might let him:


    ```

    $ jon@razback jon $ ssh elvis@frogbob

    elvis@frogbob''s password:

    ```


    Last login: Sat Jan 15 13:55:14 2000 from localhost

    No mail:


    ```

    $ elvis@frog elvis $

    ```


    Older versions of ssh don''t accept the user@host notification and require ssh
    -1 username host.domain instead.


    Sometimes, you just want to execute a command on a remote machine and log out.
    ssh, lets you do that, to:


    ```

    $ jon@razback jon $ ssh frogbob hostname

    jon@frogbob''s password:

    frogbob.localdomain

    $ jon@razback jon $ ssh -1 elvis frogbob whoami

    elvis@frogbob''s password:

    elvis

    ```


    ```

    $ jon@razback jon $

    ```


    You can also pipe data through ssh as though it were just another program. My

    laptop, frogbob, doesn''t have printing configured; razorback, my desktop, does.

    From my laptop, I can print the lpr program for razorback:


    ```

    $ jon@frog jon $ cat snorkel.ps | ssh -1 jon razorback lpr

    ```


    And, lo behold, the files. (lpr is part of the BSD of print pools; lp is

    its rough equivalent to SYS boxes. Both send jobs to the print queue.).

    One other trick ssh lets you do automatic forwarding of X connection.

    X XWindow program run while logged in to your remote system

    appears on your local display. If you''re familiar with X, this is more and less

    of a trick than it seems at first. If you''re not familiar with X, we''ll talk
    about it in

    Chapters 10 and 11.


    scp, SSH''s replacement for cp, has a syntax similar to old-fashioned ep. In

    fact, you could use scp as a replacement for ep if you wished, you wouldn''t

    get any benefit from this. Much more is the capability to securely

    copy files from computers:


    ```

    $ jon@frogbob tmp $ ls

    $ jon@frog tmp $ scp jon@razorback:some_file.txt

    jon@razback''s password:

    some_file.txt | 0 KB | 0.7 KB/s | ETA: 00:00:00 | 100%

    ```'
