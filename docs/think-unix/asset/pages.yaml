    X will log you after the last command in your .xssession file has run. Therefore,
    if you want to log out the thing you should do is exec your window manager, if
    you quit your window manager. Some people prefer to have a particular term that,
    when closed, will cause the system to log you out, but I find that confusing and
    dangerous. (If I have 10 or 12 xterm windows open, trying to figure this out which
    one I can''t safely close is a bad idea.) The reason you exit this window manager
    or xterm is simply because exec will exit the shell that runs through your .xssession
    file. This will save a process and its associated memory, although in reality
    it no big deal.


    Using to exit your window manager has other benefits as well. The benefit of my
    .xssession file reads as follows:


    ```

    # And run our window manager of choice

    - /usr/X11R6/bin/RunWM && exec /usr/X11R6/bin/RunWM

    - /usr/local/bin/mwm && exec /usr/local/bin/mwm

    - /usr/bin/X11wm && exec /usr/bin/X11wm

    - $HOME/bin/wm && exec /usr/local/bin/wm

    - /usr/bin/X11/4dwm && exec /usr/bin/X11/4dwm

    - /usr/bin/X11/twm && exec /usr/bin/X11/twm

    ```


    Because whatever command is run via exec will return to the script afterward,
    I include a list of preferred window managers that, if present, are executed.
    Only the first preferred window manager is run, and when it exits, I am logged
    out of X rather than dropped into the next window manager. In this case, my choice,
    /usr/X11R6/bin/RunWM, is a script in Red Hat Linux that uses a file in your home
    directory to determine your preferred window manager. If that isn''t present,
    I look for a localized version of Window Manager, followed by a system default
    version. If neither of those is present and I have installed a copy of wwm in
    my home directory, I run that, followed by a systemwide version of that window
    manager. If neither of those is present, I will run 4Dwm, SGI''s modified version
    of mwm, and even if that is absent, I will run twm, which is almost certainly
    present here.


    The other side of this is that anything you want to start in addition to your
    window manager must be started in the background so that the startup script will
