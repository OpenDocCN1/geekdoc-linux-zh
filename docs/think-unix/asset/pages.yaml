- img_proc: true
  md: '# Files and Processes Chapter 2


    Devices come in two major flavors, character devices and block devices. In a listing
    of the /dev directory, character devices have a c as the first character of the
    permissions, whereas block devices have (not surprisingly) a b in that.


    Block devices are intended to be read in blocks: all at once. The number of bytes
    at a time is the block size. Many devices have a block size of 512 bytes, though
    disks can have a significantly larger block size (4,096 bytes or even more). Block
    devices are not often used for interactive devices. You generally do not notice
    that the system holds on to your data until you have a number of bytes before
    writing to disk, an operation known as buffering. If you flush a block device,
    to force the system to write out data at that moment, it generally passes the
    data with blank characters until the end of the block.


    Character devices, by contrast, are meant to be read as a single character at
    a time. Devices that are more interactive and require the appearance of better
    performance or devices that cannot guarantee data in a timely fashion are generally
    character devices. Typical examples are mice, because you certainly wouldn''t
    wait for a certain amount of movement before the system became aware of it, and
    keyboards, because you receive and transmit data as you it and not for 512-byte
    chunks. Some character devices aren''t really devices because they don''t refer
    to a piece of hardware (they''re not physical devices attached to the system).
    Instead, they refer to places. The most common example is /dev/null, is a "bucket",
    a place you can send data to be discarded. /dev/zero is an endless supply of zeros
    that can be read by programs. Some systems also have a /dev/random, which produces
    an unpredictable rate of data. Neither of these is very important now, though
    we will talk a little bit more about /dev/null in the next chapter.


    Two other kind of "devices" are Named pipes, represented in -l by a p, and FIFOs,
    represented by an s, are sometimes present, usually in the /dev directory. Programs
    on the system use these devices to exchange information. Mostly you should know
    they''re present and leave them to the system administrator.


    # Filesystems


    Because Unix sees all disks on the system as a single directory tree, and because
    a system might not always have the same disks attached to it, there''s a need
    to be able to attach or detach disks from the directory tree. These processes
    are known as mounting and unmounting the disks, respectively. (These terms are
    a holdover from the days when tapes or large disks would need to be connected
    to or detached from the device mechanism The term carried over from the hardware
    activities to the associated software processes, much like we talk about "printing"
    to the screen by old terminals physically printing everything.)


    +   19. Actually, many modern today do compression, which requires blocks of data.
    For most purposes, you never notice the difference, but old hard disks, and Unix
    still thinks of them as character devices. 20...devices aren''t really files either,
    but who''s counting?'
