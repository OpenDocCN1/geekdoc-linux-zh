    solved different parts of the problem in different ways. These include implementing

    VPN (Virtual Private Network) solutions, to create secure tunnels between sites
    over

    public networks; implementations of POP3 and IMAP4 for SSL, the encryption

    standard that Web sites use to protect e-commerce and sensitive information; and

    various one-time password devices, to prevent passwords sniffed over the network

    from being reused against your system. Ask your system administrator what you

    site uses.


    The popular Unix-specific tool is ssh, Secure Shell, a replacement for the rsh

    family of programs. SSH encrypts not only your passwords but all network traffic

    over its connection. As a result, nobody can see anything between those

    two machines on your network. On the Windows side, a nice share is Client CRT;

    for Macintosh, NiftyTelnet + SSH is a very good freeware client.


    # Digression: SSH and the Law


    As the time of this writing (January 2000), SSH is encumbered with various legal
    issues that have pre-

    ented from becoming a universal solution. There are patent problems, U.S. export
    law, and the license

    of the ssh program itself.


    The first problem is that one of the encryption technologies used by ssh is patented
    in the United States, a

    problem for licensing fees are required when used in commercial or other applications.
    This is the sim-

    blest problem to solve, requiring only a modulus of patience: The RSA patent expires
    September 20, 2000.


    U.S. export regulations regarding encryption are presently in flux, are poorly
    understood by lawyers due

    a lack of applicable case law (several cases are presently working through the
    courts, but the reg-

    ulations are changing even as the cases progress), and are often welded by the
    government in surprising

    and perhaps unfair ways. Days prior to this writing new regulations that to make
    it possible

    to export cryptographic software from the United States with only modest interference,
    and the practical

    detetails are not present.


    The SSH program has two versions: The older version, 1.2, is in use, while the
    newer 2.0 version

    is not yet popular. One reason for this is that the license for the earlier version
    restricts use for commercial

    gain, but is fairly nonspecific to what that means. The newer license is more
    permissive, making it diff-

    to use SSH 2 in commercial environments without the payment of hefty fees. However,

    many institutions are unable to implement either version of SSH due to these licensing
    issues.


    Work is in progress to address the licensing issues: One project is producing
    a tool, ish, interoper-

    tes with version 2.0. Another tool, OpenSSH, has its work on an earlier version
    of SSH with a still-

    different license and is compatible with SSH version 1.2.


    One thing is certain: Computer security, and cryptography in particular, is a
    fast-changing area and no

    hope to keep up with it. As such, the best advice I can offer is to your system
    administrator, who knows

    what your site implements (and who might be familiar with the current status of
    tools), and to ask

    a lawyer when appropriate.'
