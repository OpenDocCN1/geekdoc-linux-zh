- img_proc: true
  md: '# v6, Dotfiles, and Regular Expressions Chapter 5 111


    There are two basic ways to learn these key commands. The first, somewhat enjoyable,
    is to enter vi and move around a document. The more enjoyable is to play games.
    Rogue and Nethack, two popular dungeon exploration games for Unix, use vi keys
    to move your adventurer through the dungeon. Nethack in particular is a good way
    to wait several hours, as example writing in a book, and you can comfort yourself
    with the knowledge that you''re improving your Unix skill set.


    Sometimes you move through text faster than a full screen of text, and Control-B
    moves back an equal distance. You can think of these as Forward and Backward.
    When you''ve found the text most interested in, you can press H (perhaps the Head
    of the screen, or simply a variant on the standard h command) to move to the top
    line of the screen, M (presumably short for Middle) to move to the middle line
    of the screen, and L (representing Line) to move to the bottom line on screen.


    Moving to the beginning or end of a line is simply and equally unintuitive: $
    moves to the end of the current line, and ^ moves to the beginning of the current
    line. * moves to the first whitespace character on the line, which is important
    if you are a programmer type.


    You may also move the text in logical rather than physical units: w moves forward
    one word, b moves back one word, and e moves to the end of the word. W, B, and
    E do the same thing as their lowercase variants, but without punctuation. Keys
    and move forward and back one sentence, respectively: you might imagine them as
    arrows pointing right and left. Fancier arrows and and move forward and back one
    paragraph.


    Remember you don''t need to know all these commands to move effectively through
    your document. Personally, I use the four directional keys, back and forward one
    keys, and beginning and end of line keys. Sometimes I use the others, but only
    I write this book, I find that I''m using more and more of them, but you certainly
    shouldn''t pressure yourself to learn all of them right. (I say that now, but
    the practice problems later in the chapter will assume knowledge of most of these
    keys. Feel free to use a cheat-sheet when answering these questions.)


    # Adding and Inserting Text


    The simplest way to add text into a buffer is to type a (for append), which moves
    to the space following the cursor, or if there is, and puts you into insert mode.
    Type away and (as always) hit Esc to exit. This raises the obvious question about
    how to edit the first character in a line if there''s already text there. Simply
    type i, short for insert, which enters insert mode under the cursor. If you only
    had a, you''d never be able to add text after the last character in the line;
    conversely, if you only had a, you wouldn''t be able to insert text before the
    first letter on the line.'
