    set HISTSIZE=10, only 10 commands will be stored in your history before rotating-out.
    That means that, with either variety of command-line editing, you can only look
    at a small handful of commands. If instead you type HISTSIZE=5000, that provides
    a fairly substantial list of previously run commands for you to work with. It
    also means you might spend well more time looking for the right command.

