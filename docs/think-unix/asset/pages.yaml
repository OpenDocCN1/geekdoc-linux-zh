    Another example worth returning is setting the prompt in ksh to an equivalent
    of bash''s PS1=\\whoami@\w\$`. We''ve already seen that an excellent replacement
    for this is PS1=`''whoami''@hostname cut -d . -f1`basename $PWD$`, but what happens
    when different types of quotes are used? Let''s look at


    ```

    [jon@frogbog jon]$ PS1=`''whoami''@hostname cut -d . -f1`basename $PWD$`''

    [jon@frogbog jon]$ cd bin

    [jon@frogbog bin]$ PS1=`''whoami''@hostname cut -d . -f1`basename $PWD$`''

    [jon@frogbog bin]$ cd

    [jon@frogbog bin]$ pwd

    /home/jon

    [jon$]$

    ```


    When double quotes are used, the back-quoted expression changes the last term
    in the brackets to the current directory, whereas it works fine with single quotes.
    What gives?


    When single quotes are used, the back-quoted expressions within the prompt are
    not interpreted at the time PS1 is set. That is, PS1 is set to ```''whoami''@hostname
    cut -d . -f1`basename $PWD$`. When the shell then sets the prompt, it sees the
    back quotes and interprets them at runtime. When you switch directories `basename
    $PWD$` is run again, producing appropriate results based on the current of the
    directory.


    By contrast, when double quotes are used, the back-quoted expression is interpreted
    at the time the variable is set. Therefore, if I''m in the $HOME/tmp directory
    when I set my prompt, PS1 is set to `[jon@frogbog tmp]$`, and the prompt is reevaluated
    every time it is displayed, there is nothing to be interpreted.'
