  md: '# 148


    # Part II Shell Concepts


    The fundamental fact of computer operation is the manipulation of symbols. In
    fact, besides working with literal numbers, symbolic manipulation is all that
    computers are capable of doing. Word processors do nothing but rearrange numbers
    (which represent letters) and other numbers (representing font size, style, and
    margins) that are connected to each other. As the writer, you are also manipulating
    symbols—words, ideas, and representations of places and people—albeit at a higher
    level than that at which computers work. When the computer program attempts to
    work with those higher level symbols, that''s where it makes the most mistakes.
    Spell checkers, notoriously, accept any correctly spelled rather than just the
    correct word, and grammar checkers are ever because the level at which they function
    is so higher than spell checkers.


    Up to this point, I have discussed relatively low-level concepts: files, processes,
    packages, and lots of data. Now, we''re stepping up into the realm of higher-level
    symbolic manipulation and regular expressions, that''s great, because that''s
    where we''re headed. Writing regex can be thought of as a specialized form of
    computer programming, and the remainder of Part II in Unix can be thought of as
    an introduction to shell scripts, computer programs in the syntax of whatever
    Unix you''re using.


    Don''t let the thought of programming a computer scare you away, even if you''ve
    never done it before. In fact, you already have if the regular expression practices
    work or you violated key mappings. Although some of the things I do in the next
    couple of chapters might be rather over-the-top, each one of them can be broken
    down into smaller pieces and digested.


    This chapter is about two of those smaller pieces: variables and quoting, for
    who didn''t glance at the chapter title before pressing onward. Variables are
    other symbols, and quoting is simply a way to tell the symbol what you mean literally
    and what you mean symbolically.


    # Variables


    If you think you''re new to variables, you''re not. All the way back in Chapter
