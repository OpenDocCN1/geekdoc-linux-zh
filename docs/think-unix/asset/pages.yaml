    Port 110 is the standard POP3 connection port. When we connect to our server,
    it responds with a banner message indicating the protocol, host, and server version.
    POP stands for Post Office Protocol, and the number three represents the version
    of that protocol supported. Communication protocols, as software, evolve as need
    dictates. Also like software, these versions are numbered, so that you know what
    you''re getting and can have an idea as to what''s supported.


    All POP status messages, including the banner when connected to a server, have
    one or two status indicators, as opposed to the many status codes reported by
    SMTP. These are -OK for successfully executed commands and -ERR for unsuccessful
    commands. This makes it possible to write incredibly simple client software that
    nevertheless supports error checking. Anything on the rest of the line, is as
    far as the protocol is concerned, simply a comment intended for human consumption;
    these comments are fairly informative, to help debug problems when we manually
    connect to our server.


    Our first mission, when we connect, is to authenticate so that the server knows
    whose mailbox to look at. Unlike SMTP: it matters that we claim to be, we are
    asked for a password. Because this is a simple, direct connection and the password
    is displayed onscreen as you type, so take a good look and make sure nobody''s
    watching before you do. The syntax of the USER and PASS commands is fairly simple
    and self-evident. Commands are not case sensitive, like in SMTP, and I''ve capitalized
    them in our previous examples to make clear what a command is and what''s argument.


