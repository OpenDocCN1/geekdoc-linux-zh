  md: '# Unix Documentation Chapter 1 23


    Some Unix systems have a command pg that does basically the same thing, but a
    little bit differently. Other, newer, Unix systems might have a command pag that
    doesn''t help you read man pages more is generally considered to be at least as
    flexible as pg, at least in its most recent incarnations. (As there are with Windows
    and Mac programs, there are different versions of Unix programs. These Unix programs,
    however, can be as much as 30 years old.) I''d recommend using pag unless you
    really know what you''re doing.


    The most advanced (and hence the most complicated) plaintext reader available
    on most systems is less. It lets you to scroll forward and backward in your text
    file, and has all sorts of search capabilities built in. The spacebar progresses
    through the document page-by-page, whereas the b key goes through the document
    reverse. (On some systems, the PageUp and PageDown keys have been mapped to the
    same function.) To quit less, just use the letter q. The h brings up a help menu
    listing all the keys, and the man page is fairly if you''re interested in some
    of the advanced features of less.


    Where are the text files you want to read? Scattered in directories throughout
    the system, no doubt. Often, programs downloaded from the Internet README files
    or other documentation along with the program. Administrators leave these files
    where the files were put, often /usr/doc, /usr/src/, /usr/local/, or /usr/local/src.
    Many Linux systems put the documentation for individual programs in /usr/doc/;
    each has a separate subdirectory named by package and version number, such as
    /usr/doc/gzip-1.2.4. (If you don''t understand these directories, no worry; I
    discuss them in Chapter 2.


    Given the popularity of the Internet, it is inevitable that many programmers have
    put their documentation on the World Wide Web or even in HTML files stored locally
    on your system. The best way to find this documentation is often your favorite
    Web search (Yahoo! is still my favorite) or Google is what I use for searching.
    A well-written query should result in finding the documentation you need if it''s
    on the Internet. (If it''s stored locally on your system, HTML documentation is
    likely to be in the same places as plain-text manuals.)


    It''s best to read this documentation with your favorite Web browser, if you have
    one. If you''re stuck in a text console, the best (and quite nearly only!) text-based
    browser on Unix is lynx. lynx can run without any options to begin browsing the
    Web, and with the name of a locally accessible file.


    In the same vein a great deal of information about Unix software is available
    on the Internet. Often the best resource for information on a given program or
    environment is the FAQ: Frequently Asked Questions list for a given piece of software.
    Traditionally, the FAQ has been posted to the appropriate newsgroup for the software
    on a regular basis, in the hopes that people would read the FAQ rather'
