  md: '# Unix Concepts


    A file handle is an abstract representation of a file. That is, when a computer
    program needs to access a file, it doesn''t use the name of the file being accessed
    time. Instead, the program creates a named file handle. Essentially, the programmer
    says "Whenever I talk about MY_OPEN_file, I''m really talking about /some/really/long/path/to/a/particular/file."This
    has a whole bunch of advantages for the programmer: first, she doesn''t need to
    type that each time she wants to read or write from it. Second, if the file changes
    its name or directory before the program is finished, there''s less to change.
    And, more importantly, if the file changes its name or directory where the program
    is running, or if the program doesn''t know the filenamebefore, it can still deal
    with it.


    Most programming languages use names for file handles, but Unix uses numbers.
    Names might be convenient, although longwinded, but it would be a lot trickier
    to figure out what part of the command line is a file handle and what part is
    not. Numbers make this part easy.


    All redirection is actually done with numbered file handles (also known as file
    descriptors); redirection commands imply a default descriptor. The generalized
    format is simply the file descriptor immediately to the left of the redirection
    command. STDIN is 0, STDOUT is 1, and STDERR is 2. When the command cat < file.txt,
    we''re really running cat 0< file.txt. Similarly, when we run ls > whatever, what
    we''re really doing is ls 1> whatever.


    If we want to redirect STDERR to a file in our previous example with find, we
    should find / -name ''*'' -print 2 errors.txt. This prints the normal of output
    to the console while sending the errors to errors.txt.


    This enables us to get even more complicated and sending normal output to file
    while getting getting rid of error messages entirely. find / -name ''*'' -print
    find.txt 2> /dev/null sends the useful output to find.txt and sends all the error
    messages to the bucket prime.


    # Practice Problems


    +   1. cat /etc/passwd > something.txt. What is contained in something.txt after
    this command?

    2. Using a redirection from a file, displaying the contents of /etc/group onscreen.

    3. Through cat, redirect from /etc/group to something.txt.

    4. Using cat, redirect input from /dev/null to a file named null.txt. What are
    the contents of null.txt after you''ve done this?

    5. Assuming that no directory is named zip in your current directory, change your
    directory to zip, redirect standard error to null.txt. (If your system gives you
    an error when you attempt this, feel free to rm null.txt and try again.) What
    are the contents of null.txt when this is done?'
