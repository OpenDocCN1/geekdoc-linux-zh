    # Double Quotes (")


    Sometimes you don''t want the shell to take everything literally. Sometimes you
    want to print the contents of a variable in the middle of a back-quoted command
    within a string. For these tasks, double quotes are the right tool for the job.
    Double quotes disable wild card substitution leave history substitution, variable
    substitution, back quote substitution, and backslash escaping exactly. Double
    quotes turn everything between them into a single element, disabling only a few
    crucial features.


    Of course, it is easy to say that, but it is hard to see what it means in a practical
    sense. One way to think about it is to consider double quotes "weak quoting,"
    while single quotes are "strong quoting": Single quotes make everything literal,
    while double quotes make only some things literal. (In this scheme of things,
    backslashes make only one—the next character—literal, and back quotes are something
    else entirely.) Perhaps it''s best to see examples of what quotes differ:


    ```

    $[frogbog jon]$ echo *

    arc bin Desktop docs gfx GNUstep include Mail main mediabits

    News news nmail public_html queue scripts src thinkunix tmp

    visor rootenv.0

    [frogbog jon]$ echo ''*''

    ```


    *


    ```

    $[frogbog jon]$ echo "*"

    ```


    *'
