    # # Loops


    Often it is useful to run several commands not just once but for every file in
    a

    group of files, until a condition is met, or for a specific number of times. Loops

    allow us to repeat tasks as desired, on any number of criteria. The two basic

    types of loops available on Unix for loops and while loops. We will also discuss

    two sorts of loops related to while, until loops, and loops that execute

    predetermined number of times.


    # # for Loops


    My favorite type of loop is the for loop. Most often I used to repeat an action
    for

    group of files, although it can be used for any number of things. Let''s say I
    wanted

    to work on several files in the superheroes directory, but I wanted to back up
    all the

    files before messing around them just in case. (This is a particularly useful

    th to want. I very strongly suggest that you should want to back up files before

    working on them.) Let''s say I wanted all my superheroes to have backup files
    with a

    retired extension appended to their names:


    ```

    [jon@heroes]$ ls

    aqua-man green-lantern spider-man-the-tick

    batman robin superman wonder-woman

    [jon@superheroes]$ for foo in *

    > do

    > cp foo $foo.retired

    > done

    [jon@superheroes]$ robin the-tick

    aqua-man robin.retired the-tick.retired

    batman spider-man wonder-woman

    batman-retired spider-man.retired wonder-woman.retired

    green-lantern superman

    green-lantern.retired superman.retired

    [jon@superheroes]$ _

    ```'
