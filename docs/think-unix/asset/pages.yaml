    In a command syntax, **bracketed arguments and options are optional.**^2 *Passwd*
    has several options: `-u`, `-d`, and `-S`. What is that group of options, `[-f]`?
    It''s optional, for certain, but inside that there is another option piece: `-f`
    is not a valid option `-u` is used as well. But none of these is actually available
    to users other than the system administrator. (Why am I examining them, you? Because
    you need to learn to read pages, and that''s why.)


    You should also note that the optional argument is a variable: you are not expected
    to put the word `username` at the end of the `passwd` command. Instead, `username`
    is a placeholder for your data. Perhaps you want to change your friend Bob''s
    password; in that case, you could type `passwd bob`, and if you were logged in
    as the system administrator, the system would prompt you for Bob''s password.^3
    If Alice asked you to change her password, you could type `passwd alice` to change
    her password. The only time you might `passwd username` is if you actually had
    a user whose account name was `username`, you''d probably do that only if you
    were being deliberately, or if you were writing examples in a computer book.


    In general, variables are set apart in pages by a change in emphasis:they are
