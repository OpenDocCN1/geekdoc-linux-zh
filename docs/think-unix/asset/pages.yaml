    - Meng Tzu

    - Wang Bi


    The files, after all, are just streams of bytes. The cat command just concatenates
    two files or streams of bytes. When the order of files is reversed, so is the
    order in which they are printed. Sequential data is, well, sequential.


    You might have noticed that both filenames with .txt. If you''re used to Windows
    this will probably surprise you most Windows filenames have an extension. (Heck,
    old DOS machines had only eight characters for a filename and three more for an
    extension.) Unlike Windows, but like Macs, the extensions are more or less optional.
    The system doesn''t use them for anything important; they''re present for the
    user''s convenience. Why did Elvis bother to end these filenames with .txt? Because
    it''s useful to know how to read a file. You''re not bound to these rules, but
    people make these conventions because they are useful. Some Unix programs force
    you use specific extensions, but most of the time these defaults can be overridden.


    Unix filenames are more flexible than those on Windows or Mac: They can contain
    several characters long on most modern Unix systems and can contain any character
    except a forward slash. Personally, I recommend sticking to letters, numbers,
    periods, hyphens, and underscores. Most other characters have special meanings
    and must be escaped with backslashes, as in our exploration of the echo in Chapter
    1. Older Unix systems have further limitations on filenames; check your manual.


    Filenames are also case sensitive: Capital and lowercase letters are treated entirely.
    ThisFile is different from thisfile. When filenames are sorted, uppercase letters
    appear before lowercase letters. Files that contain important information, as
    README files or other documentation, often begin with capital letters so that
    they are easy to find.'
