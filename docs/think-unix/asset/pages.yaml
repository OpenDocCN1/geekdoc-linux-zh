    These are a particular number of pixels height, but each character in the font
    might be a different number of pixels wide. Most books are produced in proportional
    fonts they are nicer for reading.


    All are short names for fonts; most fonts have long names. Long names for X fonts
    look like this:


    ```

    adobe-medium-i-normal-12-120-75-75-p-63-iso8859-1

    nb-bkh-lucida-medium-i-normal-sans-10-100-75-p-59-iso8859-1

    schumacher-clean-bold-r-normal-0-0-100-75-c-60-iso8859-1

    urw-palatino-bold-r-normal-0-0-0-p-iso8859-1

    ```


    The hyphen at the beginning of a font name is not optional. This hyphen is followed
    by the name of the font foundry; the company that produced this font. In these
    examples, the font foundries are adobe, bkh, schumacher, and urw. After another
    hyphen, the name of the typeface follows. In the examples, the typefaces are times,
    lucida, clean, and palatino. After another hyphen is the weight of the font, which
    in all the previous fonts are either medium or bold, although font weights can
    be light or other weight.


    After another hyphen comes the slant of the font, which is usually r, which stands
    for regular, or i, which stands for italic. Next is the width, which is almost
    always normal, and an additional style, which is almost never used. Next some
    values representing the size of the font. The size is in pixels and then the size
    in points (one is 1/72 of an inch). Pixel sizes are generally more useful point
    sizes are not necessarily calibrated how one might expect. In theory, pixel size
    is device dependent, and point size is device independent. Don''t ask me what
    this really means; I''m not sure anyone knows.


    Next are the horizontal and vertical resolutions. These resolutions are for the
    display and are usually 72, 100 dots per inch. If any fonts have horizontal and
    vertical resolutions, the inclusion of bold is at least somewhat surprising. After
    this is the spacing, which is P for proportional, M for monospaced, or C for cell.
    The difference between cell and monospaced fonts is that the latter has no restrictions
    other than fixed width. In practice there is really just information few if any
    fonts are available in more than one of these flavors.'
