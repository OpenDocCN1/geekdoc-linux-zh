    LISP A popular language among computing types, the LISP (Processor) is renowned
    for its elegance and purity. For many people, that makes it impractical and difficult,
    though its following is devoted. So,, in fact, Emacs and the Saw window manager
    are almost entirely on LISP. The whole LISP culture that existed for decades is
    fatal; many were forced to switch to Unix when their LISP machines were decommissioned.
    They grumbled so much about it that a number of them got together and wrote a
    book:


    > Garfield, Simson L., et al.

    The Unix Hater''s Handbook


    The days, the book is outdated, but it always missed the point. This disagreement
    between LISP users and other Unix suggests that there may be more one sort of
    elegance. But we won, who gloat? Besides, their book is out of print. See also
    Emacs, SawMill


    Lynx A terminal-based Web browser. Small, fast, fairly complete, and without distracting
    graphics. Lynx can be used when you have no X running. Lynx''s Web site is at
    http://lynx.browser.org/


    machine language The ones and zeros that the computer actually executes, the final
