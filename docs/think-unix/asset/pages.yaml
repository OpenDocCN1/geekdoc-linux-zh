  md: '# Appendixes


    Nemeth, Evi, et al.

    UNIX System Administration Handbook, 2nd Edition

    Prentice Hall. 1995.


    You should also buy the book if you use Unix extensively, and refer to it before
    bothering your admin with redundant questions:

    Mui, Linda

    What You Need To Know When You Can''t Find Your UNIX System Administrator

    O''Reilly & Associates. 1995.


    See also here

    SysV Unix, the standard AT&T release of Unix. Heavily influenced by BSD Unix,
    SysV Unix was a step above previous AT&T releases, SysV V, Release 4 (SVR4) is
    the standard to which most commercial Unix flavors claim to see. Also BSD


    tcsh An enhancement of csh that nevertheless contains the systematic flaws as
    the original. it is much better for interactive use than anything other than bash,
    ksh, and zsh. If you''re addicted to csh, this is what you should be running.


    tty An abbreviation for teletype, it has shorthand for all character-based terminals
    hooked up to a Unix box. Every user on the system is attached to a nonlocal try
    whenever a window is open.


    Unix If you don''t have an idea of what Unix is by this point, I''m not sure I
    can help you. Let me point you at some resources:

    If your question is "Why Unix?” Neal has written an essay titled "In the Beginning...
    Was the Command Line." is available online, though in less-convenient formats,
    at http://www.cryptomonicon.com/beginning.html, and in print:


    Stephenson, Neal

    In the Beginning..Was the Command Line

    Avon Books. 1999.


    If you''d like a glimpse at the history of Unix, the book to read is


    Salus, Peter H.

    A Quarter Century of UNIX

    Addison-Wesley Pub. Co. 1995.'
