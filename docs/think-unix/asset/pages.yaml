  md: '# Dignersion: Unix as a Multiuser Operating System


    Nearly since its inception, Unix has been a multitasking, multiuser operating
    system; it has been designed for simultaneous use by more than one person at a
    time. A book ordered toward PCs or Macs would tell you now that this was because
    hardware was expensive, and multiuser was a way of spreading out expensive investment.
    Furthermore, sort of book would tell you, on an interactive system (where users
    interact with the computer in real-time rather than send a bunch of punch cards
    down to a machine room and get back output later) it''s rare that a single user
    saturates the machine''s capacity, having multiple users on a system that is much
    more effective.


    Of course, this is not a Mac- or PC-oriented book, so I don''t have to tell you
    that. Instead, I can tell you that multiuser systems have much wider applicability
    for single-user systems. In families, it would be nice for Mom''s financial records
    to be stored safely away from Junior''s homework, and it would be nice if Junior
    in couldn''t read Sis''s diary. And it would be nice if each of them had their
    own icons on their desktops, without messing up Dad''s filing system. Only a multiuser
    system can do that effectively.


    As far multitasking goes, that fairly comes (poorly implemented) in the PC world,
    precisely the same reason it exists in the Unix world. Additionally, in a highly
    networked world, it''s nice if you can send out or copy files over the network
    while you''re doing processing. Or, in the server world, a computer can be a Web
    server, file server, and mail server all at the same time.


    An effective multiuser system, obviously, needs separate areas for each person''s
    files and settings to distinguish who''s who. The latter, the authentication mechanism,
    is why Unix asks for your username and password before you use the system. Separate
    areas for files and settings exist for each user in a separate directory (or folder,
    for Mac users) called a home directory. When you log in, the default place where
    your files are stored is your home directory.


    # Now Back to Our Show


    Now Elvis has logged in to this Unix box, and he''d like to see his list of Western
    philosophers, but he can''t remember what he called it. He does remember that
    it''s in his home directory, so he can just take a look:


    ```

    [ elvis@frogbog elvis]$ ls -s

    Desktop Mail README tao.txt things.txt myfile

    ```


    > 6. In the Unix world, settings are always stored in files (and almost always
    in plaintext!), this is redundant but perhaps helpful for PC or Mac users.'
