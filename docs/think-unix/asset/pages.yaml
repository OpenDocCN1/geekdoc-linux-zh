    procmail procmail is a mail filtering system that separates mail into different
    folders by regular expression matching. procmail is truly Byzantine in its syntax
    and complexity, but inately powerful as well. The man pages are comprehensive
    and yet somehow thoroughly unhelpful. The procmail site is http://www.procmail.org/,
    from there you might try to find a helpful tutorial. procmail and Mutt make a
    particularly powerful combination. See also Mutt


    regex regular expression


    regexp See *regular expression*


    **regular expression** The pattern-matching and substitution language almost standard
    across Unix applications. More powerful than it needs to be for most applications,
    powerful enough to things you can hardly imagine. If you become obsessed with
    regexps, you might want to read a book about them:


    Friedl, Jeffrey E., editor.


    Mastering Regular Expressions


    O''Reilly & Associates. 1997.


    **root** The top entry in any hierarchy. The root directory is the top-level directory
    on a Unix system, the root window is the top window in X''s window hierarchy,
    the root server is the domain name server, and the root account is the system
    administrator''s account. See also *system administrator*


    **SawMail** A manager that is highly customizable in LISP The SawMail Web page
    is at http://sawmail.sourceforge.net/. See also LISP


    **sed** is a “stream editor” that applies regular expressions as a filter. It
    has a small programming language and can be combined with very powerful ways with
    awk, the combination of sed and awk is losing to ground perl. See also *awk, perl,
    regular expression*


    **sh** The Bourne Shell, the standard for shell language programming. Highly portable
    among Unix systems, it nevertheless lacks many features for interactive use. All
    shell scripts should run in the Bourne Shell, no matter what shells greatly share
    sh syntax as bash, ksh, and zsh. See also *bash, ksh, zsh*


    **shell** Any program that enables you to interact with the system and execute
    commands. A shell is a program like any other, but which acts as your interface
    and provides your command line. Many shells are highly programmable and'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Glossary and References Appendix B


    contain tons of features to simplify your life, or improve it, at any rate. At
    least,

    that''s what their authors tell us.


    One can “shell out” to a command line from various applications. This simply means
    that the program executes a shell and gives the user access to the system. This
    is not often more useful than suspending the program, but sometimes we have no
    choice. See also bash, es, ksh, tsh, zsh


    **source code** The program as the programmer writes it. The source code is the
    most human-readable version of what is compiled by the compiler into a binary.
    Source code contains more information about the programmer''s thought process
    and is much more useful than having binaries when debugging somebody''s program.
    Having the source code gives you technical opportunity to fix bugs, make improvements,
    and port code to different platforms. See also binary, compile


    **spool** A file that receives some data for later use. The file that contains
    all your current email is mail spool, the file that contains a list of things
    to send to the printer is your print spool, and so on.


    **ssh** The most popular way to protect your password and other private information
    when logging on to a remote host. Please read my footnote (#11) in Chapter 4 before
    using ssh, but please do telnet or login to other systems.


    **sysadmin** *See system administrator*


    **system administrator** The person who maintains and manages a computer or group
    of computers. It''s a tough job, and I get to do it. The system administrator
    creates and manages accounts, allocates system resources, and makes sure it''s
    running smoothly. Nobody notices a system administrator who is doing a good job,
    and everyone notices the system administrator when there''s a problem. As a result,
    many system administrators have taken an interest in tea, coffee, chocolate, or
    beer.


    If some reason this sounds interesting to you, rare one on the topic is available
    at http://www.adminspotting.org/. If this does not dissuade you, there are three
    books on the subject reading:


    Carling, M., et al.


    Linux System Administration


    New Riders. 1999.


    Frisch, Aeleen.


    Essential System Administration, 2nd Edition


    O''Reilly & Associates. 1995.'
