  md: '# 22


    # Part I Unix Concepts


    That would certainly provide a quick idea of what the pass command does. Note
    that what searches all manual sections unless -K otherwise specified.


    One final way for you to search many pages is man -K (That''s a capital K, not
    a lowercase k) man -K searches not only the short description, but the entire
    text of every page you can find on your system. This can take a very long time,
    especially on systems with many pages or slow disks, sometimes it''s the only
    way to find the information you''re searching for.


    If you choose to use the what command to view many pages in your XWindow System,
    you can read the documentation in nice, proportional font. It has a search feature
    that enables you to search the current page or apropos, through not man , and
    you might have multiple pages displayed at once. Unfortunately one nice feature
    that is missing in man is the capability to click through to another page in the
    See Also portion of the man or to click any of the pages returned by an apropos
    search. Nevertheless, reasonably proficient Unix users can thoroughly customize
    man and it might be worth a look.


    GNU Info is another very common format for software documentation, especially
    for GNU Info is a hypertext system, essentially similar to the World Wide Web.
    Each system has a central directory of all GNU pages on the system, and you can
    search your query.


    The standard tool to read GNU documentation is info. It runs in a terminal console,
    so you can just type info from a terminal session to start it up. It has built-in
    help and a tutorial, so it should be relatively easy to navigate despite its somewhat
    less-intuitive keystroke. To see a specific node (that''s the Info terminology
    equivalent to a man page or Web page), you can type info commandname.


    Of course, many people write large portions of their documentation in plain text,
    which has the advantage of being easy to write and simple to read without complex
    tools. The three most common ways to read ASCII text are cat, more, and less.
    Each of them can run simply with the command followed by the name of the file.


    cat is the simplest of the three: It simply outputs the text to the screen. This
    is for short files, but longer files might scroll off the screen or out of your
    backscroll buffer, if you have one more displays the text page at a time, prompting
    you to press a key after each screen.


    +   8. The GNU project is a group of people who have cloned most of the standard
    Unix tools. GNU tools, and many administrators build the GNU tools on their systems
    in order to have standard-tools available everywhere. (Other administrators claim
    that GNU tools are inferior to native tools and refuse to build this. This is
    an essentially religious conflict, sort of Mac versus Windows. Unix is full of
    religious conflicts; that''s part of being a deep system with a culture that has
