  md: '# Choosing a Linux Distribution


    The Linux operating system that''s installed on your computer is not a single,
    huge program. It''s a collection of many programs. You can get each component
    of the Linux system yourself, downloading and installing them separately to create
    exactly the system that fits your needs. However, it''s not simple; you must know
    Linux well to do this. Most users don''t install the pieces themselves. Rather,
    they install a Linux distribution.


    A distribution (often called a distro) is a collection of programs put together
    by a group or a company. It includes all the components needed to provide a complete
    Linux system when it''s installed on your computer. However, distributions can
    differ in the components included, focusing on different aspects. For instance,
    one distribution may emphasize easy use and installation whereas another emphasizes
    a large set of applications.


    Fedora Core, the successor to the very popular Red Hat Linux, the main distribution
    discussed in this book. In addition, the Mandrake and SuSE distributions are described.
    These three distributions are oriented toward desktop computer users and provide
    installation procedures similar to Windows installation procedures. Many, many
    other distributions are available. This chapter describes the major distributions.
    More complete coverage of distributions is available at www.distrowatch.org, which
    maintains a database of 320 distributions.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Distribution Contents


    Linux distributions can include the following components:


    +   - Linux kernel: The core of Linux. The kernel interacts with the hardware
    to perform the tasks you require of your computer, such as save text in a file,
    display text or graphics on the screen, or send text or graphics to the printer.
    There is no operating system without the kernel.


    +   - Shell: A program that interfaces between the computer user and the kernel.
    The most common shell used on Linux is the Bash (Born again shell), so named because
    it is derived from an earlier shell called the Bourne shell). The interfaces for
    Linux are described further in Chapter 5.


    +   - Linux commands, utilities, and applications: Programs that perform tasks.
    The task may be simple, such as displaying the contents of a file on the screen.
    Or the task may be complex, such as word processing with its complex functionality.
    Whenever you type a Linux command or start an application, you run a program that
    provides the functionality you need.


    +   - Compilers: Compilers translate the language that humans understand into
    language that the computer understands. That is, humans writes programs in languages,
    such as C or Java, similar to human languages. Compilers convert the C or Java
    code into machine language so that the computer can run the program.


    +   - Desktops: Applications that provide a graphical interface to Linux. Several
    desktops are available, allowing you to select the one that best fits your needs.
    Some desktops provide an interface that is similar to the Windows interface. The
    interfaces for Linux are described further in Chapter 5.


    Some components are required to provide a usable Linux system, such as the kernel,
    a shell, and many Linux commands and utilities. All distributions provide the
    minimum requirements. However, most distributions provide more than the bare minimum.
    Distributions differ from the following characteristics:


    +   - More or fewer applications: Distributions provide different applications.
    For instance, almost all distributions provide word processing applications. In
    fact, most distributions provide OpenOffice, an application similar to Microsoft
    Office. However, not all distributions include it. Other word processing applications
    are available, such as KOffice, an office suite developed for use with KDE desktop.
    Some distributions offer more than one office application.


    A distribution can include hundreds or thousands of applications. You can see
    which applications are included in the Distribution Web. In addition, DistroWatch
    reports on a list of applications, showing whether a distribution'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'includes the applications. For instance, the list of applications for Fedora
    is provided at www.distwatch.org/table.php?distribution=fedora.


    The presence or absence of any single application is not a sufficient reason for
    choosing a distribution. Any application can be added after Linux is installed.
    However, if a distribution includes all the applications you need and installs
    them during the installation procedure, its easier than downloading and adding
    applications separately.


    +   - More or up-to-date versions of your components: Linux software is updated
    frequently. Some distributions include the newest releases, striving to be the
    most cutting-edge. Other distributions emphasize stability, not including new
    software releases until the version has proven stable. Some distributions provide
    procedures to keep your Linux current after it''s installed. For instance, Fedora
    includes a utility calleddate that keeps track of your current versions and automatically
    gets installs updates when they become available. Installing and updating software
    is discussed in Chapter 10.


    +   - Different desktops: Most distributions provide a desktop. The two main desktops
    are KDE and GNOME, but more are available. Most distributions provide KDE, GNOME,
    or both.


    +   - Utilities developed specifically for the distribution: Some companies develop
    utilities specifically for their distributions, making maintenance and administration
    easier for users. For instance, SuSE has developed YaST (Yet Another Setup Tool)
    to simplify installing and configuring your distribution.


    +   - Different installation procedures: In the past, Linux had a reputation for
    difficult installation. simpler. Mandrake, for instance, has focused on developing
    an installation procedure that detects hardware efficiently and is easy to use.
    Mandrake''s popularity has increased since its reputation for easy installation
    and has spread.


    +   - Varying levels of support: Some Linux distributions provide official support,
    equivalent to proprietary software support. For instance, Mandrake provides 30
    days of telephone support, with more available for purchase, and SuSE provides
    free installation support, with other support provided for a fee. Other distributions
    expect users to solve their own problems.


    Each distribution has a Web site providing information about the distribution.
    You can generally download the distribution at the Web site. The files you download
    are usually CD images (ISO images) that you write to CD; then you install from
    the CDs. Some distributions are also sold in a boxed set, with CDs and perhaps
    a manual.'
  merge: -1
