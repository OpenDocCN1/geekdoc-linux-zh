  md: '# # Copying Music Files from CD to Hard Disk


    You can copy music tracks from a CD to your hard disk. It''s useful for listening
    to music without needing to find and insert the CD. Copying the music and distributing
    it to other people is illegal. Copying the music to your computer and returning
    the CD for a refund is plain theft. The process of transferring the digital file
    for a piece of music from an audio CD to hard disk is called ripping. An application
    that transfers music tracks is called a CD Ripper.


    Transferring music from a music CD to the computer''s hard drive includes converting
    the file into a different format. The most popular format is MP3. However, you
    can store music in the open source format Ogg Vorbis, with a better compression.
    If a piece of music is stored in MP3 and Ogg Vorbis in the same size file, the
    Ogg Vorbis forms better.


    The Sound Juicer CD Ripper is available in the main menu of most Linux distributions.
    The Sound Juicer window is shown in Figure 16-5.


    ![](img/9a91733a8fb0082106ab0e361495babe_263_0.png)


    Figure 16-5 Sound Juicer CD Ripper.


    Sound Juicer reads the CD in the CD drive and lists the tracks. When you click
    Extract, the tracks that are checked are copied to hard disk. You can select the
    format to save the files.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Summary


    Multimedia refers to digital sound and video, an application area that is growing
    and changing rapidly. Although working with multimedia files is much easier than
    it used to be, for Windows and Linux, it can still be problematic on occasion.
    You are more likely to encounter problems in this area than any other.


    This chapter describes the more common uses of multimedia files. It explains how
    to:


    +   - Configure your sound card

    - Listen to audio CDs

    - Listen to downloaded music files

    - Listen to Internet Radio

    - Copy CD tracks to your hard disk

    - Play video files


    Advanced multimedia applications are also available for Linux, but not discussed
    in this book. For more information, see www.linux-sound.org.


    The next chapter discusses email applications—how to select one and how to use
    it.'
  merge: -1
