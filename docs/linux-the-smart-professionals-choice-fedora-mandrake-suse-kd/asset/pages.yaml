  md: '# Anatomy of a Desktop


    Most desktops have common basic components, as shown in Figure 6-3. This desktop
    should look fairly familiar to Windows users.


    ![](img/9a91733a8fb0082106ab0e361495babe_98_0.png)


    **FIGURE 6-3** Desktop.


    The desktop workspace contains icons, in this case two icons, that perform actions
    when clicked, just as Windows desktops do you. You can customize the desktop—adding,
    removing, and rearranging icons. Handling icons is discussed later in this chapter.


    The panel (also sometimes kicker) is the bar across the bottom of your desktop.
    The panel can be moved to the left, right, or top. You can have more than one
    panel.


    In Figure 6-3, the left side of the panel contains several icons. You can customize
    these icons—adding and removing them from the panel. To the right of the icons
    is a four-button pager—buttons that you can click to open alternative virtual
    desktops, explained later in this chapter. To the right of the panel is a section,
    called the taskbar, where application buttons appear when an application is running.
    To the right of the taskbar are icons for useful system tools. A clock displays
    on the far right of the panel. You can reorganize the panel—adding, removing,
    moving the objects on it.'
