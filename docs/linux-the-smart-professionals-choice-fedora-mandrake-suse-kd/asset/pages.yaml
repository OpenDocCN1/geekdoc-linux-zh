  md: '# Mozilla Message Filters


    You can set up a set of rules that direct incoming email into folders, rather
    than into your inbox. If you receive a lot of email, organizing your email is
    very helpful. Click Tools. Select Message Filters. The window in Figure 17-7 opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_274_0.png)


    FIGURE 17-7 Mozilla message filters window.


    The window shows a list of the current filters—sets of rules.


    You can create a new filter, delete a filter, or edit an existing filter. You
    can also change the order of the filters in the list using the Move and Move Down
    buttons.


    Each filter has one or more rules in it. Rules test whether email meets specific
    criteria. If the message matches, it''s handled as defined by the rule. For instance,
    a rule might look for messages coming from mom@home.com and send any messages
    from that address to the “Family” folder.


    You can log the action of your filters. Click Filter Log. Check “Enable the Filter
    Log.”


    Click Run Now to apply the filters to the folder selected in the drop-down list
    at the bottom of the window. Any messages found that match an existing filter
    are handled immediately.


    Creating a message filter is discussed in the next section.'
