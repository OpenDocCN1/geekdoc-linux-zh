  md: '# Entering Commands


    To use the command line, you can open a terminal window, also sometimes called
    the console, in which you can work directly in the shell. This is similar to opening
    a DOS or Command Prompt Window in Windows.


    Some distributions provide an icon on the panel that you can click to open a terminal
    window. The icon includes a monitor screen. Others don''t provide a terminal screen.
    Usually the desktop menu (right-click on the desktop) includes an item to open
    the terminal window. You can always find it on the main menu, either as a main
    menu item or on a submenu under system.


    The terminal window displays the system prompt, followed by the cursor, showing
    that it''s waiting for you to enter a command.


