  md: '# Working on the Desktop


    The desktop is a workspace with some tools sitting on it. When you want to perform
    a task, you start an application that opens in a window on the desktop. You can
    open many windows at once, each performing different tasks, using the same or
    different applications.


    Your desktop offers many features to assist you. Many of the following features
    will be familiar to many Windows users:


    +   **Icons**: You can click icons on the desktop or panel to start applications
    locations. In most distributions, the desktop icons activate with a double-click
    and panel icons activate with a single-click. However, this is configurable and
    some distributions start icons with a single-click. You can add, remove, or reorganize
    icons on the desktop or panel, discussed later in this chapter.


    +   **Menus**: Linux provides a main menu and many component-specific menus. You
    can add, remove, or edit menu items. When you install a new application, a menu
    item is usually added to the main menu.


    +   **Main menu**: Contains available applications and utilities as many menu
    items or items on submenus, similar to the start menu on Windows. The main menu
    is opened by clicking an icon on the panel, usually the leftmost icon. The main
    menu icon is a large K for KDE and a foot for GNOME. However, distributions often
    use their own logo as the main menu icon, such as the red hat on the Fedora and
    the green dragon head on the SuSE panel.


    +   **Component-specific menu**: Menus specific to a component open when you right-click
    the component. If you right-click on the desktop background, you see one menu;
    if you right-click on the panel, you see a different menu. If you right-click
    an icon, you see another menu still. And if you right-click inside an open window,
    you still see another menu. Menu contains selections that are specific to the
    object.


    In many menus, one letter is underlined in the menu selection. You can type the
    letter, rather than highlight and click, to select the menu item. Some menus show
    shortcuts for their actions, such as <Alt+F9>. This means you can press <Alt+F9>
    without opening the menu and the action is performed.


    +   **Tool tips**: Information that displays when you move the mouse pointer over
    an object and hold it for a short time, called hovering. You can turn tips off
    and on.'
  merge: -1
