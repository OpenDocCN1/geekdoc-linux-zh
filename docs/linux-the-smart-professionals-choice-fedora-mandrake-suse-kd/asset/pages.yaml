  md: '# Editing and Saving Files with vi


    vi operates in one of two modes. vi behaves differently, depending on which mode
    it''s in:


    +   - Normal mode: The characters you type are editing commands that perform operations
    on your file, as moving the cursor, deleting a character or a line, etc. There
    are two types of commands:

    - Key sequences: Pressing key issues commands to vi. For instance, pressing x
    deletes the character after the cursor.

    - Command line: A semicolon allows you to type commands with arguments. The cursor
    moves to the bottom of the screen, waiting for you to type a command.

    - Insert mode: When you type keys, the characters are inserted into the file.
    Typing certain commands, such as i (the insert command), puts vi into Insert mode.
    Pressing <Esc> key ends Insert mode, returning vi to normal mode.


    vi opens in Normal mode. vi changes to insert mode when you enter a command that
    inserts text into a file. For instance, the <> key is the insert command. It changes
    vi to insert mode and allows you to type text into the file. vi stays in insert
    mode until you press <Esc>, which ends Insert mode and returns to Normal mode.
    Another command changes vi to insert mode is <a>, append command, which allows
    you to insert text after the cursor.


    In Normal mode, keys are commands. Most commands require a two key sequence. Almost
    all the commands allow you to type a number before the command. The command is
    repeated the number of times specified by the number. For instance, <dd> is the
    command to delete a line. <3dd> deletes 3 lines. If you enter a number before
    vi, the number 1 is assumed.


    A small set of commands is described in this chapter. This is sufficient for most
    editing tasks. However, vi has many abilities not presented here. If you often
    edit the command line, you will appreciate learning more of vi''s capabilities.
    See the vi (or vim) documentation on your system for complete documentation.


    After adding/editing the file content as described in the remainder of this chapter,
    save the file by pressing <<ZZ> (notice that ZZ is uppercase). You can close a
    file without saving any changes by typing:


    ```

    :q!

    ```


    You can save a file without exiting vi with the command :w.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Moving Around a File in vi


    Usually, you can use the arrow keys on your keyboard to move around the open file
    in vi. In some cases, such as a very old or very minimal Linux installation, the
    arrow keys don''t operate.


    You can always move around your file using the key commands in Table 18-1.


    | Key | What It Does |

    | --- | --- |

    | i | Moves cursor down line. |

    | k | Moves cursor up one line. |

    | l | Moves cursor character to the right. |

    | h | Moves cursor character to the left. |

    | G | Moves cursor to the last line of the file. |

    | L | Moves cursor to the last line on the screen. |

    | Ctrl-d | Moves down one screen. |

    | Ctrl-u | Moves up one line. |

    | :n | Moves the cursor to line n. For instance, :1 moves to the first line of
    the file. |

    | $ | Moves to the end of the current line. |

    | ^ | Moves to the first non-space character in the current line. |

    | 0 (zero) | Moves to the beginning of the line. |

    | w | Moves to the beginning of the next word. |

    | b | Moves to the beginning of the previous word. |

    | e | Moves to the end of the word. |


    > NOTE

    Be sure to use the correct command. vi is case sensitive. It doesn''t see a a
    and A as the same command.


    In addition to the commands to move the cursor, you can move to specific characters
    or strings by searching for them. You can search for a character in the line using
    the f(find) command. The syntax is fx, where x is the character to find. For instance,
    fh moves to h.


    To search the entire file, press /. The cursor moves to the bottom of the screen.
    Type the text to search for. When you <Enter>, the cursor moves to the next instance
    of the text. After finding one instance of the text, just press / again to search
    further for the same text. Use ? to search backward through the file.'
