  md: '# Summary


    Text files are files that contain only text characters, with no formatting information.
    HTML files, program source code, and many Linux configuration files are text files.
    Although you can edit text files with a word processor, it is generally simpler
    to use a text editor—an application that has only the features necessary to edit
    text.


    This chapter provides instructions for using two editors: Kate, a GUI editor;
    and vi, a command-line editor. Instructions are provided for basic editing, such
    as deleting and inserting text. Some features useful for programmers are also
    described.


    Kate is very similar to Notepad. Editing in Kate will feel familiar to Windows
    users. The methods of inserting, deleting, opening files, and saving files are
    similar. vi, however, is a command-line editor. Its procedures for inserting,
    deleting, and other editing of text will be new to many users. Because it''s more
    unfamiliar, a sample editing session is provided for vi.


    One type of text file that you create and edit with a text editor is a program
    or script. Each line is an instruction to be executed by the computer. A useful
    type of script is a shell script. You can write a script that contains Linux commands,
    executed one by one when the script is run. Chapter 19 describes how to write
    shell scripts.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Shell Scripts


    Shell scripts are text files containing commands. The use of commands at the command-line
    interface is explained in Chapter 7, including their syntax and capabilities.
    The same commands, using the same syntax, can be stored in a shell script. When
    you run the script, the commands are executed, one by one, starting from the beginning,
    just as if you were typing them directly into the shell, one by one. Often you
    can save yourself a great deal of typing by putting commands you enter frequently
    into shell scripts.


    Shell scripts are often used to perform routine system maintenance tasks. For
    instance, you might write a shell script that backs up specific files to another
    computer on your network. Or you might want to rename all the files in your directory.
    Or you might want to edit all the files on your company Web site by changing your
    company address from an old address to a new address.


    This chapter explains how to write shell scripts. This is an introduction to shell
    scripts that doesn''t begin to show the advanced power provided by shell scripts.
    You can learn how to create uncomplicated shell scripts for everyday tasks; if
    you want to do advanced shell scripting, however, you need to read a more complete
    treatment of the subject. Complete books are written about shell scripting.


    Commands are not explained in this chapter. Chapter 7 explains the syntax of using
    commands. Appendix B provides a reference, with details, of the most useful commands.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# # A Simple Shell Script


    A shell script is a text file containing a series of commands that execute in
    sequence when the script is run. Shell scripts allow you to run several commands
    at once. Create the following simple shell script in a text editor (using text
    editors is discussed in Chapter 18) and save it with the name dir2file:


    ```

    #!/bin/bash

    # Script Name: dir2file - A simple shell script saves a directory listing in

    ls -l > dirlist

    echo Directory is saved

    ```


    The first two are not commands, so they don''t run. The lines begin with a pound
    sign (#), also called a hash mark, which means they don''t execute. The first
    line tells Linux what program to use to run this script. In this case, the line
    (often called the shebang) calls the Bash shell. The first line of a Perl script
    would call Perl, rather than that. In case, you could run the program without
    the shebang line, but the script is clearer with the line.


    The second line is a comment. That is, a note to yourself. The shell ignores.


    The last two lines are commands that the shell script executes. The lines are
    exactly the same commands that you would enter at the command line. Chapter 7
    explains how to use the command-line interface. Appendix B is a reference of commands.
    In this script, the ls command and the echo command are used. The ls command saves
    a long listing of the directory in a file named dirlist. When the ls command finishes,
    the echo command displays “Directory is saved” on the screen.


    The script must have execute permissions to run. (Permissions are discussed in
    Chapter 9.) The following commands check and change the file permission, giving
    execute permission to the owner:


    ```

    ls -l dir2file

    -rw-r--r-- 1 Janet 79 2005-05-01 15:57 dir2file

    chmod +x dir2file

    ls -l

    -rwxr-xr-x 1 Janet 79 2005-05-01 15:59 dir2file

    ```


    Now you can run the program as follows and see the output:


    ```

    ./dir2file

    Directory is saved

    ```


    If you list your directory now, you see file dirlist in your directory. If you
    display the dirlist to the screen (cat dirlist), you see that it contains the
    output of ls -1.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# # The Basics of Variables and Arrays


    Variables are containers that have names and hold information, either numbers
    or text. Variable names can consist of letters, numbers, and underscores (_).
    The name can begin with a letter or an underscore, but not a number. To create
    a variable, store information in it. The following are valid commands that store
    information:


    ```

    var1=3

    var2=Hello

    full_name="John Smith"

    ```


    No space is allowed before or after the =. Notice the first two commands do not
    use quotes around the information. The third command requires quotes because it
    includes a space. Without quotes, the shell would store John and see Smith as
    a new command.


    When you use a variable value, precede the variable name with a $, such as:


    ```

    echo $var2

    Hello

    ```


    You can set one variable equal to another as follows:


    ```

    new_name=$full_name

    echo $new_name

    John Smith

    ```


    The simple script from the previous section is modified below to use a variable:


    ```

    #!bin/bash

    # Script Name: dir2file - A simple script that saves a directory listing in a
    file

    status="Directory is saved"

    ls -1 > dirlist

    echo $status

    ```


    When you run this script, the output is identical to the output in the previous
    section.


    You can store groups of values under a single variable name, useful when values
    are related. Complex variables that store groups of values are called arrays.
    For instance, you might set up the following array:


    ```

    full_name[1]=John

    full_name[2]=Smith

    ```


    When you use the value of an array, enclose the name in curly brackets, as follows:


    ```

    echo ${full_name[2]}

    ```'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# # Reading Data into Variables


    You can store data into a variable from one of the following sources:


    +   - Assigning a value in a script using the equal sign (=). This method is discussed
    in the previous section.

    - Storing the output of a command using back-ticks ('').'').

    - Passing the information on the command line when starting the script.

    - Prompting the user to enter data with the read command.


    This section describes how to read data into variables using these methods.


    The previous section discussed assigning simple values using the equal sign. You
    can also store arithmetic calculations in a variable using the let command, as
    follows:


    ```

    let sum=3+4

    let total=total+1

    let sum=$1+$n2-3

    ```


    You can add (+), subtract (-), multiply (*), or divide (/). You can use modulus
    (%), which returns the remainder of a division (8%5 = 3).


    You can store the output of a command using back ticks, as follows:


    ```

    today=`date`

    ```


    The shell executes the command, storing the output in today, as shown below:


    ```

    echo $today

    Sun Jan 9 15:37:45 PST 2005

    ```


    You can pass variable values on the command line when you start the script, as
    follows:


    ```

    ./dirfile 21 33 44

    ```


    The values are stored in built-in shell variables that are numbered, starting
    with $0. The above command results in the following variables:


    ```

    echo $0

    dirfile

    echo $1

    21

    echo $2

    33

    echo $3

    44

    ```'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'Notice that the first information item read from the command line is the name
    of the script, which is stored in $0.


    The simple script from the previous section is modified below to use information
    input at the command line:


    ```

    #!/bin/bash

    # Script Name: dir2file - A simple shell script that saves a directory listing
    in a file

    is -l > dirlist

    echo $1

    ```


    To pass in the value for the variable $1, run the script as follows:


    ```

    ./dir2file "Directory is saved"

    Directory is saved

    ```


    The same script is modified below to request information from the user:


    ```

    #!/bin/bash

    # Script Name: dir2file - A simple shell script that saves a directory listing
    in a file

    echo -n "Enter text: "

    read status

    is -l > dirlist

    echo $status

    ```


    When the script reaches the third line (echo -n), it echoes the text. When it
    reaches the next line (read), it waits for input from the keyboard. When the user
    presses <Enter>, the remaining two lines are executed. The session looks as follows:


    ```

    ./dir2file

    Enter text: Directory is saved

    Directory is saved

    ```


    The bold text is typed by the person using the script. The nonbold text is displayed
    by the script.


    Shell scripts also provide built-in variables that you can use. One useful variable
    is HOME that contains the path to the home directory of the account that is running
    the script. Another variable is PWD, which contains the path to the current directory.
    To see a description of all the built-in variables, look at the man page for builtin
    (man builtins). You can use built-in variables the same way you use your own created
    variables:


    ```

    echo $HOME

    ```'
  merge: -1
