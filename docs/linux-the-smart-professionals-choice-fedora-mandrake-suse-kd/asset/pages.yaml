- img_proc: true
  md: '# Examining Files from the Command Line


    To use the command line, open a terminal window. You see the home directory of
    the account you are using. To see a listing of the files in the directory, use
    the `ls` command, as follows:


    | ls | Images | test.txt |


    The output shown just lists the names. Some distributions output color-coded listings
    to show the type of files, such as blue for directories. Others show a forward
    slash (/) after the names of directories, as shown in the following output:


    | Desktop/ | Images/ | test.txt |


    To see more information about the files, use the options of the `ls` command.
    All the options are documented in the man page for `ls`, accessed by typing:


    ```

    man ls

    ```


    One useful option is -l to get a long listing, as follows:


    ```

    ls -l

    drwx------ 3 janet janet 4096 Oct 2 13:21 Desktop/

    ```


    The first character is d for directory. A file would show a - for the first character.
    The next 9 characters are the permissions, as explained in the "File Permissions"
    section of this chapter. The first janet is the user owner. The second janet is
    the group owner. 4096 is the file size. Oct 2 at 13:21 is the date/time the file
    was modified. Desktop is the filename.


    You can use `ls` to list the contents of a directory by specifying its name, as
    follows:


    ```

    ls /home/robert

    Desktop mysecretstuff

    ```


    Actually, you can only look at the contents of the robert directory if you have
    permission to do so. If you don''t have permission, you will see an error message
    such as:


    ```

    ls: /home/robert: Permission denied

    ```


    You can save the directory listing in a file, rather than display it to the screen,
    with the following command:


    ```

    ls > dir_listing

    ```'
