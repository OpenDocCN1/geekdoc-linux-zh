  md: '# Installing Packages Using RPM


    RPM is a command-line utility that is included with almost all distributions.
    RPM maintains a database that keeps track of the packages and versions installed.
    If a package is not available on your distribution Web site, you can find and
    download it, described earlier in this chapter. After it''s downloaded, you can
    use the RPM commands to install the software.


    RPM filenames include the package name, version, and the type of machine. For
    instance, a MySQL database server rpm could be named MySQL-server-4.1.7-0.i386.rpm.
    It''s packed for i386 machines, meaning almost any Intel or AMD computer. Download
    the package to the directory where RPMs are stored on your system. For Fedora,
    the directory is /RPMMS.


    To install an RPM, change to the directory where the RPM file is stored and type:


    ```

    rpm -Uvh filename

    ```


    For instance:


    ```

    rpm -Uvh MySQL-server-4.1.7-0.i386.rpm

    ```


    RPM will tell you if the package is already installed. It will check the dependencies
    before it installs and display an error message for any missing dependencies,
    such as:


    Error: Failed dependencies: dependencypackename >= 5.3 needed by packagename


    The message means the package (packageename) is dependent on dependencypackename,
    version 5.3 or newer, being installed. You need to download and install the missing
    package before you install your new package.


    Using the -U installs or updates, whichever is appropriate. You can use an -i
    option for install only. The -v options results in informative output. The -h
    option results in a status report, a line of ###.


    You can display information about packages by typing:


    ```

    rpm -qi packename (for installed packages)

    rpm -qip packename (for packages not installed)

    ```


    You need to root permissions to install packages.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Installing Packages from Source Code


    Sometimes it is necessary to install a package from source code. Perhaps the package
    you need is only available in source code. Perhaps you need the package installed
    with a configuration that is not available as an RPM. You can download the source
    code, compile it on your own computer, and install it.


    Instructions for installing are available on the package Web site and included
    in the package. In general, the procedure for installing from source code is:


    +   1. **Download the source code file.** Filenames are `packagename.version.tar.gz`.
    For example, the source code for PHP could be named `php-5.0.2.tar.gz`. The directory
    `src` or `/local/src` is used to store source code.

    2. **Unpack the tarball.**

    ```bash

    cd /local/src

    gunzip -c packageName.tar.gz | tar -xf -

    ```

    A new directory called `packageName` is created with several subdirectories. Change
    to the new directory (e.g., `cd packageName`).

    3. **Read any installation notes.** Often you see files such as INSTALL.TXT.

    4. **Set up the configuration files needed to compile.** Type:

    ```bash

    ./configure

    ```

    Often you use options with the configure command, as follows:

    ```bash

    ./configure --option -option

    ```

    The installation instructions will explain the available options. Lines are output
    as the configure procedure runs. This step may take several minutes. If there''s
    a problem, an error message displays.

    5. **Compile the software.** Type:

    ```bash

    make

    ```

    You will see many lines of output. This step may take a few minutes. The executable
    files are created in this step.

    6. **Install the software.** Type:

    ```bash

    make install

    ```

    This step copies the files into the proper locations.


    Some packages require additional or unique steps. Be sure to read the available
    documentation.'
  merge: -1
  pgno: 173
