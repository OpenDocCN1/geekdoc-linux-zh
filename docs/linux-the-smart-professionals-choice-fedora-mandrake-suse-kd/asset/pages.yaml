  md: '# Red Hat/Fedora


    Even if you have no experience with Linux, you''ve probably heard of Red Hat—the
    most well-known commercial version of Linux. Red Hat has recently undergone some
    organizational changes. Free Red Hat Linux has been replaced by Fedora Core, released
    by the Fedora project, which is initiated, supported, and contributed to by Red
    Hat. Fedora is an open source developer project with public testing, participation,
    and feedback. Fedora includes only open source software. Information on Fedora
    is available at fedhat.com. Red Hat now sells Red Hat Enterprise Linux—commercial
    software appropriate for organization-wide use, emphasizing stability, reliability,
    and commercial


    You can''t buy Fedora from Red Hat. Red Hat only sells Red Hat Enterprise, a commercial
    version of Linux. To obtain Fedora, you download files from the Fedora Project
    Web site: fedora.com/download/. The files are images of installation CDs, which
    you can write to CD or install from disk. Installation is discussed in Chapter
    4. However, the files are large and downloading them over a dial-up connection
    is painful. You can purchase installation CDs from various vendors. The vendors
    do not provide a boxed set of software and manuals, as you receive when you purchase
    Windows or a commercial distribution of Linux; they just provide CDs. A list of
    vendors is available at fedora.redhat.com/download/vendors.html.


    Fedora features include the following:


    +   * Multiple desktops: Provides both GNOME and KDE. GNOME is the default.


    +   * Software updates: Red Hat has a utility up2date that keeps track of your
    current versions and automatically gets and installs for you when they become
    available.


    +   * System utilities: Provides system tools developed by the Fedora project.
    Tools provide an easy-to-use graphical interface, as well as a text-based interface.
    The names begin with redhat-config, such as redhat-config-network.


    +   * Installation procedure: Provides either graphical or text interface for
    the installation procedure, using its own installer called Anaconda. The installation
    procedure detects and configures the system hardware. Fedora provides Kickstart,
    a utility that allows scripted, unattended installation useful for system administrators.


    +   * Well supported: One of the best supported distributions. Red Hat maintains
    a mailing list at www.redhat.com/mailing/listinfo/fedora-list. Also try the Fedora
    Forum at fedora.org and the Fedora forum on Linux Questions at www.linuxquestions.org/questions/forumdisplay.php?forumid=35.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Mandrake


    Mandrake Linux is particularly oriented toward Linux novices and home users.

    Mandrake focuses on user-friendly graphical installation and utilities. It''s
    the easiest distribution to install, allowing successful installation by users
    without any Linux experience. It''s very competent in recognizing hardware during
    the installation process.


    Mandrake Linux has two versions:


    +   - Mandrake Distribution: The stable, official Mandrake Distribution is available
    for download from the Web site (mandrakelinux.com) in files that are CD images
    (ISO files). Its also available in three boxed sets

    - Discovery: A simplified package that provides the essentials for a desktop user,
    with an automated installation procedure and a handpicked selection of applications.
    It includes 2 CDs and a manual.

    - Power Pack: An advanced desktop package that provides thousands of open source
    and commercial applications. It includes 6 CDs and 2 manuals.

    - Power Pack Plus: An advanced package that provides a powerful desktop plus the
    server tools necessary to create and manage a small to medium size network. It
    includes 8 CDs, 1 DVD, and 2 manuals.

    - Cooker: The developmental version of Mandrake Linux, Cooker is constantly evolving.
    New packages can appear daily. It''s released frequently for testing, reporting,
    and feedback. When a cooker version is deemed ready, meaning no new features are
    added, only bug fixes, and it becomes the beta for the official Mandrake Distribution.


    If you want the cutting-edge software, install Cooker. If you like your software
    a little more stable, install the official Distribution.


    Mandrake features include the following:


    +   - Multiple desktops: Provides both Gnome and KDE. KDE is the default.

    - Mandrake Club: Provides help forums and other extras. Provides early software
    downloads. Requires a small fee to join.

    - Mandrake Experts: A Web site (www.mandrakeexpert.com) where volunteer experts
    answer questions. A list of experts is available. Or post your question publicly
    for any expert to choose. Phone consultation with experts is possible.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# SuSE


    SuSE (pronounced sueh) has a desktop focus. The SuSE developers have developed
    an easy-to-use installer and simple configuration tools. SuSE has the best documentation
    of any distribution, thorough and understandable.


    SuSE is developed privately, not publicly. The software is not available during
    the development process. It''s developed by the SuSE developers, depending on
    sales of boxed sets for much of its revenue. SuSE includes some commercial software,
    in addition to the free open source software. Two boxed sets are available:


    +   - Personal: A version that provides the essentials for a desktop user, including
    office applications, email software, Internet applications, and others. The documentation
    includes only an installation guide. The user''s guide is only available online.


    +   - Professional: A version that includes more software. It provides server
    and network utilities and development tools, in addition to personal desktop applications.
    It includes a printed user''s guide and an administrator''s guide.


    SuSE also provides business software such as an enterprise server.


    SuSE provides the opportunity to install its free code directly from FTP. The
    FTP version is mainly the same, except that some of the commercial software included
    on the CDs is removed. This is not something you want to do via a dial-up connection.


    SuSE features include the following:


    +   - Multiple desktops: Provides both GNOME and KDE. KDE is the default.


    +   - Linux with Windows: SuSE Linux installs easily alongside a Windows system.
    The installation procedure will make room for the Linux system on the hard disk
    in the space (partition) where Windows is already installed by resizing the space.


    +   - Well-supported: SuSE supports a very active mailing list at www.suse.co.uk/uk/private/support/online_help/mailinglists/index.html.
    Several forums are available at forums.suseluxupport.de/, such as general questions,
    install problems, and network problems. Or try the SuSE Forums at www.linuxforums.org/forum/forum.php?f=36.'
  merge: -1
