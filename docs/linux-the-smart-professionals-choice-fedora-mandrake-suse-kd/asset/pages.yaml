  md: '# Spam


    Spam, called junk mail by Mozilla, is unsolicited mail that shows up in your mailbox.

    Most people prefer not to receive spam. However, most people prefer receiving
    spam to not receiving legitimate mail. Consequently, spam filters must balance
    between letting too much mail through, thereby missing some spam, and not letting
    enough mail through, identifying “real” as spam (false positives).


    Mozilla includes a Bayesian spam filter. This type of spam control looks at a
    sample of real mail and a sample of junk mail and uses statistical analysis of
    the contents of the messages to identify spam. Consequently, the more messages
    of junk/non-junk status it has to analyze, the better it gets at recognizing spam.


    The junk mail controls must be “trained” before use. You should identify as large
    a sample of mail as possible. To mark the messages, highlight them. Click Select.
    Mark->as junk or Mark->as not junk. Junk mail is marked with a trash can. You
    can also mark as junk by clicking the round icon in the Junk column, something
    that can happen accidentally when you click a message to read it. The junk mail
    handler requires both junk nonjunk messages to analyze.


    Junk mail controls, shown on the right, are opened by highlighting an account,
    clicking Tools and selecting Junk Mail Controls. Check or uncheck the box to enable
    junk mail handling.


    Check whether you want to mark mail as junk when it comes from a sender in your
    address book. Although junk mail may not come from a familiar address, a very
    well mail might identify itself from a familiar address.


    You can log your junk mail activity. Click Junk Mail Log and check the Enable
    box.


    Check your junk folder for false positives. Mark them as not junk. The more classified
    messages in the junk mail database, the better Mozilla becomes at correctly identifying
    junk without false positives.


    ![](img/9a91733a8fb0082106ab0e361495babe_276_0.png)'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Mozilla Address Book


