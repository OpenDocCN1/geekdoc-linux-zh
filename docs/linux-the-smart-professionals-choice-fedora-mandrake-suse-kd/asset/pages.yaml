    are located, click Tools and select Options. Click the Tabs to see a list of paths
    where files are located. Find the path may look like the following:


    ```

    /opt/OpenOffice.org/share/templates/English;/home/jane/OpenOffice.org.1/user/templates

    ```


    The template location specifies two directories, separated by a semicolon. You
    can edit this path to store templates in a different or an additional location.


    You can create a new folder by clicking File and selecting Templates->Organize
    to open the organizer. Highlight any folder in the left pane. Click Commands and
    select New. The new folder is unnamed. Type a new name and press <Enter>.


    The default template is used when you create a new document. You can edit the
    template name Default or select a different template to the default. To specify
    a template as default, open the organizer and highlight the template that you
    want to be the default. (It must be located in the default template folder.) Click
    Commands. Set as Default Template.


    A printer setting is included in a template. To define a printer, open the organizer,
