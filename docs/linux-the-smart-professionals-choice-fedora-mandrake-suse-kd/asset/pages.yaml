- img_proc: true
  md: '# APPENDIX A


    # Regular Expressions


    Regular expressions are used to match strings to patterns, rather than only to
    literal character strings. The regular expression (sometimes referred to as regex)
    is a pattern you want to match, such as a pattern that matches all names that
    begin with B or phone numbers. Regular expressions are used by many Linux commands
    and applications that find/select specific text for processing. You can use regular
    expressions with grep, vi, sed, awk, Perl, PHP, OpenOffice, and many other applications.


    Regular expressions are combinations of the following:


    +   - Literal characters: Normal characters that have no special meaning. A B
    is just a B, the second letter of the alphabet. It has no other meaning.


    +   - Special characters: Characters that have special meaning when used in a
    regular expression. Special characters are not just a letter of the alphabet or
    a punctuation mark.


    You may have experience with special characters. For instance, an asterisk (*)
    is used by Windows, as well as by Linux, to mean any string of characters in a
    file-name. You would use *.txt to find all the text files in a directory or prog
    to find all the files that began with prog, regardless of the remainder of the
    file name.


    To create regular expressions, you need to understand what special characters
    mean and when to use one. This appendix describes the most useful special characters,
    with examples of their use.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# # Match a Single Character ( . ) (?)


    You can match any single character with a dot (.). A dot means there must be a
    character in the string.


    You can make a single character optional by placing a question mark (?) after
    it.


    | Regular Expression | Match | Not a Match |

    | :--- | :--- | :--- |

    | .t | at, xt | ax, xx |

    | m.x | mix | miix |

    | mi?x | mix, mx | miix |

    | m.?x | mix, max, mx | miix, maax |


    # # Specify the Location (^) ($)


    You can specify that a string only matches when it occurs at the beginning of
    a line with circumflex (^). You can specify that a string only matches when it
    occurs at the end of a line with $.


    | Regular Expression | Match | Not a Match |

    | :--- | :--- | :--- |

    | ^Sir | Sir, Sir John | Dear Sir, |

    | John$ | John, Sir John | John Smith |

    | ^Sir$ | Sir | Dear Sir, Sir John |

    | ^$ | a (any line with only one character) | aa (any line with more or less one
    character) |

    | ?$ | a (any line with zero or one character) | aa (any line with more than one
    character) |

    | ^$ | (any blank line) | (any nonblank line) |


    # # Group Characters ( ( ) )


    You can group characters together, so that they are treated as one character,
    with parentheses.


    | Regular Expression | Match | Not a Match |

    | :--- | :--- | :--- |

    | a(bc)?x | abcx, ax, lax | abx, acx |

    | ^a.(bc)5 | abcx5, aqbc56 | axb5, aqc5, laxb |'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# # Match One of a Set of Literal Characters ( [ ] )


    You can put a set of literal characters inside square brackets. The pattern matches
    if any one of the set of characters is found. You can indicate a range of characters
    within the brackets by using a hyphen (-).


    NOTE

    If want to include a hyphen as a literal character, include it at the beginning
    or the end of the set.


    | Regular Expression | Match | Not a Match |

    |---|---|---|

    | a[bcd]ef | abef, acef, adef | aef, bcef |

    | a[b-d]ef | abef, acef, adef | aef, bcef |

    | a[..]-b | a,b, a,b, a-b | ab, axb, a-b |

    | file[1-2][0-9]? | file1, file15, file20 | file3, file40 |


    # # Exclude a Set of Literal Characters ( [^ )


    You can put a set of literal characters inside square brackets, preceded by a
    circumflex (^). The pattern matches only if none of the set of characters is found.


    | Regular Expression | Match | Not a Match |

    |---|---|---|

    | a[^bcd]ef | axef, akef | abef, acef, adef, axk |

    | a[^b-d]ef | axef, akef | abef, acef, adef, axk |

    | file[^1-2][0-9]? | file3, file45 | file3, file1, file10 |


    # # Match a String of Characters (+) (*) {n} )


    You can match a string of one or more characters by adding a plus (+) after the
    character.


    You can match a string of zero or more characters by adding an asterisk (*) after
    the character.


    You can match a string of a specified number of characters by adding curly brackets
    enclosing a number ({n}) after the character.'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'You can specify a range of repetitions with two numbers enclosed in curly brackets.


    | Regular Expression | Match | Not a Match |

    | --- | --- | --- |

    | ab+c | abc, abbc, abbabc | ac, axc |

    | ab*c | ac, abc, abbc | axc |

    | ab(3)c | abbbc | ,abc, abbc, abbbbc |

    | ab(2,3)c | abc, abbc | ac, abc, abbbbc |

    | a[bc]+d | abd, acccd, abcbcd | ad, axd |

    | a(bc)*d | ad, abcd, abcbcd | abd, axd |

    | ^+$ | a, aaa (any line with one or more characters in it) | (a blank line) |


    # # Match One of Alternate Literal Strings (( | ))


    You can put a set of literal strings, each separated by a pipe bar (|), between
    parentheses. The string matches if it contains any one of the alternate literal
    strings.


    | Regular Expression | Match | Not a Match |

    | --- | --- | --- |

    | a(bc|def|x) | abcx, adex, afgx | ax, abx, abcdex |

    | I(love|hate) carrots | I love carrots | I like carrots


    Special characters and literal characters can be mixed together to form a regular
    expression. Really long, complex regular expressions can be built to match any
    conceivable string.


    A special character is sometimes part of a literal string. If you want to include
    special characters in a regular expression to be treated as literal characters,
    you insert a backslash (\ in front of the special character. For example, look
    at the following two expressions:


    ```

    ^.\$

    .\$

    ```


    The first pattern matches a line that has one character on it, any character.
    The second expression matches a line that has one dot on it. The \ in front of
    the dot makes it into a literal dot, rather than a special character that represents
    any character. Using a \ in front of a special character is called escaping the
    character.


    If you need to use \ as a literal character, you would include \\ in the regular
    expression.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Using Regular Expressions


    How you use regular depends on the specific application you''re using. In most
    languages, such as Perl or PHP, you use a function in the language that compares
    the regular expression to a string, returning a value meaning the string matched
    or missed. In many applications with a GUI, such as OpenOffice, you type the regular
    expression into a field. Each application has its own method for regular expression
    input.


    In many cases, you use characters to indicate the beginning and end of the regular
    expression. The characters that you specify the beginning and end are called delimiters.
    In some applications, you can specify what delimiter you want to use. Forward
    slashes (/) and quotation marks are often used as delimiters.


    # Examples


    This section provides some practical examples of regular expressions. Double quotes
    used as the delimiter for these examples.


    The following regular expression matches any word of normal text:


    ```

    `[A-Za-z] [a-z]*`

    ```


    The regular expression contains a space at the end, after the \*, to indicate
    the end of the word.


    Two regular expressions that match phone numbers:


    ```

    `^(([0-9]\(3)\) [0-9]{3}-[0-9]{4})$`

    ```


    Matches phone numbers of the format (nnn) nnn-nnnn. Notice the parentheses are
    escaped. A more flexible regular expression might be:


    ```

    `^[0-9]( - ){7,20}$`

    ```


    Matches a string that can contain numbers, parentheses, spaces, and dots. The
    string must be at least 7 characters long but not more than 20 characters long.


    To match a zip code, including zip+4, use:


    ```

    `^[0-9]{5}(\-[0-9]{4})?$`

    ```


    Matches a string of five numbers in the first section ([0-9]{5}). The rest of
    the regular expression is enclosed in parentheses, making it a single unit that
    matches the +4 part. after the closing parenthesis makes the entire +4 section
    optional.'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'The following regular expression matches a common email address.


    "^.+\+@+\.(com|net)$$"


    The regular expression includes a literal @ sign. A \ escapes the dot, making
    it a literal dot. Only .com and .net email addresses are accepted by this regular
    expression.'
  merge: -1
