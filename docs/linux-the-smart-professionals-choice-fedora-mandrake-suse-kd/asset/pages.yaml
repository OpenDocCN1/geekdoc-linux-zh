  md: "# Passwords\n\nPasswords are important to the security of your Linux system.\
    \ They protect you from unauthorized use both from your terminal and from the\
    \ Internet. Your root password is particularly important. In general, make your\
    \ password difficult for someone to guess, but easy to remember. Some suggestions\
    \ for creating passwords are:\n\n+   - Use a mixture of characters, including\
    \ uppercase letters, lowercase letters, numbers, and punctuation.\n- Use at least\
    \ 8 characters.\n- The starting letters of a favorite saying making a password\
    \ that's hard to guess. For instance, Take me out to the Ball Game! becomes TmotBG!\n\
    - Substitute numbers for letters, such as 1 (one) for l (L) or 0 (zero) for o\
    \ (oh). For instance, Tm0ttBG! \n\nSome practices to avoid:\n\n+   - Don't use\
    \ any word that can be found in a dictionary. Cracking software can try dictionary\
    \ words one by one.\n- Don't use dates. It's a common practice and there are a\
    \ limited number of possibilities. In addition, birthdays can be discovered.\n\
    - Don't use any part of your name.\n- Don't use your children's or pets' names.\
    \ Someone who knows you might guess these.\n- Don't write your password down and\
    \ paste it to the front of your terminal. Or any variation of this. Use a password\
    \ you can remember.\n- Don't tell anyone your password. If someone needs to use\
    \ your computer, create a new account for him or her to use."
  merge: -1
