  md: '# Applications


    Applications are programs. Most of the applications you use for your work are
    large, complex applications like word processors, spreadsheets, or databases.
    Many applications are installed when your system is installed. You can install
    a new application when you need it. Installing applications is discussed later
    in this chapter.


    Different Linux distributions include different software, hundreds or thousands
    of applications. The distribution defines a default set of software to install.
    You can modify the set during installation, installing more, fewer, or different
    applications.


    Most distributions include a set of common applications. The Linux commands are
    installed. Utilities for administering your system are installed. Certain types
    of applications are installed, although different distributions may select specific
    applications. For instance, all applications will install a text editor, but might
    install different text editors. Most distributions include a word processor, usually
    OpenOffice, and a graphics application, usual Gimp.


    An application is a program, or group of programs, so it''s started by typing
    a program name. When you click a menu item or an icon to start an application,
    the program name is sent to Linux. For instance, when you click OpenMenu on owner,writer,
    the name of the program, is sent to Linux.


    You can add or remove applications on the main menu. Right-click the main menu
    icon and select Menu Editor. The window on the right displays, with the current
    menu in the left pane.


    To add an application, highlight the location where you want the new item and
    click New Item. In the Command field, type the path/program name or browse to
    the program that runs when your item is selected. You can select an icon by clicking
    the ? button on the right. If you want a desktop icon that starts the application,
    you can drag the newly added menu item onto the desktop.


    ![](img/9a91733a8fb0082106ab0e361495babe_167_0.png)'
  merge: -1
