  md: '# Creating a Spreadsheet


    When you start OpenOffice Calc from the main menu (Office->openOffice Calc), the
    window shown in Figure 12-1 opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_197_0.png)


    **FIGURE 12-1** OpenOffice Calc.


    It opens with a blank spreadsheet, ready for you to enter content.


    You can create a new spreadsheet at any point in OpenOffice, when you are in Calc
    or when you are in Writer, by clicking F11 and selecting New->Spreadsheet.


    Each spreadsheet is created with three pages, or sheets, named Sheet1, Sheet2,
    and Sheet3 by default. You can change the name of a sheet by right-clicking the
    tab for the sheet, at the bottom of the screen, and selecting Rename Sheet. You
    can add more sheets if three aren''t enough. Click Insert and select Sheet.


    The box on the right of the window is called the Stylist. It''s used to apply
    cell and page styles. Styles are discussed later in this chapter.'
  merge: -1
