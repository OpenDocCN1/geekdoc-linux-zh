  md: '# Summary


    Your Linux system can access the Internet. The process is basically the same process
    used to access the Internet from Windows:


    +   1. Set up a connection to the Internet. You may have set up your connection
    during installation. If not, you can set it up now.

    This chapter describes:

    - What types of Internet access are available

    - What hardware is needed

    - How to configure a network connection

    2. Access the Internet using a browser.

    This chapter describes:

    - What browsers are available

    - How to browse the Internet with Mozilla

    - How to use Mozilla menus, toolbars, sidebar, and tabs

    - How to control pop-up windows with Mozilla

    - How to manage downloads, cookies, passwords, and forms with Mozilla

    - How to add plug-ins'
