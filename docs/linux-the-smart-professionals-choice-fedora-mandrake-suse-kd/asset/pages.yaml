  md: '# CHAPTER 17


    # Email, Messaging, and News


    The Internet makes worldwide communication possible. Three of the most popular
    forms of communication are:


    +   **Email**: One of the first applications on the Internet, predating even the
    WWW. I expect that all of you have experience with email, perhaps often using
    Outlook or Outlook Express on Windows. Email is modeled after the postal service,
    sending messages to addresses, putting the messages into mailboxes. However, it''s
    much faster. An email message gets to the recipient in seconds. Recipients don''t
    need to be on-line to receive email; they can read and answer messages at their
    own convenience.


    +   **Instant messaging**: While email is modeled on postal service, instant messaging
    is modeled on telephone service. Instant messaging sessions resemble conversations,
    where the participants need to be online simultaneously. Text messages are sent
    and responses received instantly. A window on the participants'' screens displays
    the instant messages in the order they are sent, showing the ongoing conversation.
    Instant messaging is free and available for all computer users who are connected
    to the Internet.


    +   **Newgroups**: Usenet newsgroups are also an early application (1978) on the
    Internet, bringing people flow with similar interests together. Each newsgroup
    is like a public bulletin board devoted to a specific subject. Anyone can post
    a message and read existing messages. The cumulative expertise available in a
    newsgroup is extensive. Most questions on a subject are answered immediately.
    Tens of thousands of newsgroups are available, covering every imaginable subject.


    This chapter provides instruction for communicating using all three methods.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Email Accounts


    To send and receive email, you need an email account. That is, an email address.
    An email account is established for you by a system administrator. This may be
    your system administrator at your place of employment. Or it may be a system administrator
    at your ISP or Web hosting company. Some ISPs provide you,with more than one email
    account. Or you may have more than one email address from different sources, such
    as one from your ISP and one from your Web hosting company. Each email account
    includes a mailbox where incoming email messages are stored.


    Email is sent to the mailbox by a software application called the SMTP server.
    It receives all the email addressed to a particular domain and sends it to the
    individual mailbox. The SMTP server also handles the outgoing email, sending it
    across the Internet to the intended destination. In addition, if your email messages
    are received and stored on a remote server, such as your ISP''s computer, the
    messages must be downloaded to your computer. An additional software application
    handles the downloading—either a POP3 server or an IMAP server.


    Mail software on your account allows you to read, send, and otherwise manage the
    messages in your mailbox. Several email software applications are available. Some
    major email software is described in the next section.


    You need to set up your email software for each email account you use. The email
    soft-ware needs to communicate with the SMTP server. If you need to download email
    from an ISP, the email software needs to communicate with the server that handles
    the downloading. You provide the email software with the server addresses when
    you set up the email account. Your ISP or system administrator provides you with
    the needed information.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Email Software


    Some email software available on Linux is:


    +   - Evolution: An open source email package. Evolution is very similar to Outlook.
    Those with experience with Outlook or Outlook Express will feel at home in Evolution.
    Evolution has an integrated calendar and address book. Like Outlook, icons in
    the sidebar provide access to Inbox, Calendar, Tasks, and Contacts. Evolution,
    available from Novell, is usually installed by default. For more information,
    see www.novell.com/products/desktop/features/evolution.html.

    - KMail: An email application that is part of the KDE desktop installation. KMail
    is only available as part of KDE, not in a separate package.

    - Mozilla: Mozilla is a suite of applications, including a full-featured email
    application. Mozilla is included by default on many Linux distributions. However,
    not all Mozilla installations include the email application. For instance, Fedora
    installs Mozilla by default without the email application. You can add it later
    from the installation CD, as discussed in Chapter 10.

    - Thunderbird: The next generation Mozilla email software. Thunderbird is email
    only, it''s faster and easier than Mozilla. Thunderbird runs on Windows, as well
    as Linux. Currently, Thunderbird is not included in most distributions, so you
    must download and install it yourself. Installing software is discussed in Chapter
    10 (www.mozilla.org)

    - Netscape: Based on the Mozilla mail client. Similar functionality and interface.


    This discusses Mozilla email. Most of the information applies to Thunderbird,
    as well. Thunderbird has basically the same features, plus some additional features,
    but they may be found in a different location. For instance, Mozilla settings
    are found in Edit->Preferences; Thunderbird settings are found in Tools->Options.
    Most of the information applies to Netscape, as well.


    It''s not necessary to use email software on Linux. If you prefer to use Webmail,
    you can refer to an email account that you access through your browser, such as
    a Yahoo! or Hotmail account. The email software and messages reside on a computer
    on the Internet. From your browser, you can log to read email, send email, get
    addresses from your address book, etc. Webmail is unrelated to your operating
    system. You can use a Webmail account equally easily from Linux or Windows.'
  merge: -1
  pgno: 268
- img_proc: true
