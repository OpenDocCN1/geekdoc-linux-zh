- img_proc: true
  md: '# # Creating and Opening Images in the GIMP


    You can start the GIMP from the main menu. When the GIMP starts, it opens the
    GIMP toolbox, discussed later in this chapter. No window for images opens until
    an image is created or opened, which opens a separate window. When you click File
    and select New or Open, it opens an editing window. Figure 13-7 shows an open
    image.


    ![](img/9a91733a8fb0082106ab0e361495babe_219_0.png)


    **FIGURE 13-7** The GIMP editing window.


    If you select New, the window opens with a blank page in the window. If you open
    another image, it opens in a new window, without closing the current window.


    In the editing window, you can create or edit an image using the toolbox, which
    is still open in a separate window. The toolbox contains tools for the most common
    editing functions. You can also use the menu items in the editing window. You
    can perform many operations on the image, such as modify all part of it, change
    its color, remove parts of the image, add figures to the image. You can also create
    many special effects, such as change it to sepia tones like an old photo, add
    fog, clothe the while, and many other effects. It''s wise to create a copy of
    an existing image before experimenting on it, although you can undo a series of
    steps to return the image to its original condition.


    Graphics > Creating and Opening Images in the GIMP'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# The GIMP Toolbox


    When you start the GIMP, it opens the toolbox, shown on the right. The top section
    of the toolbox contains a set of tools, activated by clicking an icon. There are
    tools you can use to select a section of the image and tools that change the image.
    For instance, the first tool selects a rectangular section of the image. Other
    tools include a paintbrush, a pencil, an eraser, a tool that adds text to the
    image, tools that change colors, and more. In this image, the paintbrush is selected.
    When you click an icon, the mouse pointer changes into an associated shape. You
    then use the mouse to edit the image in the image window.


    The left section below the tool icons is used to select colors you can use, in
    this case gray (foreground and white). To change a color, double-click one of
    the colored squares.


    The right section allows you to open a section for brush options, a section for
    setting parameters, or a section for selecting a gradient.


    The bottom section of the toolbox displays options related to the tool chosen.
    In the figure, the paintbrush is chosen. The options in the lower box apply to
    the paintbrush, such as Opacity and Brush size. If you click the space by Brush,
    you can select different brush sizes. If the text tool were chosen, the bottom
    section would offer text tools, such as font type and size.


    The first button of the four bottom buttons sets the selected options to be the
    default. The second button restores the most recently saved defaults. The button
    on the right restores the defaults to the values set by the software developers.


    ![](img/9a91733a8fb0082106ab0e361495babe_220_0.png)'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# # Changing Image Size in GIMP


    You can change image size in one of three ways:


    +   - **Crop**: Keep part of an image and discard the rest.

    - **Scale**: Change the size of an image, keeping all the content of the image.
    For instance, if you scale the smaller, all parts of the image shrink to fit new
    image size.

    - **Resize**: Change the size of the window, keeping the image the same size.
    This is generally used to make the window larger, thereby making room to add new
    elements to the image.


    To crop an image, you select the section you want to keep and throw away the rest.
    Use a select tool from the toolbox to select the part of the image to keep. For
    instance, click the first tool to use the tool that selects a rectangular section
    of the image. Then, move your mouse to the image window. The mouse pointer shows
    a rectangle beside the pointer, so you know which tool is active. Click and drag
    the mouse to enclose the image section that you want to keep. To remove the selection
    and select again, right-click and select Selection->None.


    Click on the image menu bar and select *Crop* to *Selection*. The image outside
    of your selection disappears. You can undo a crop to return the cropped part of
    the image.


    To scale an image, click image and select *Scale Image*. A dialog window opens
    allows you to specify the width and height for the new size. Or, in the ratio
    fields, you can specify the percentage to scale by, such as .60 (60%) or 1.5 (150%).
    By default, the ratio of width to height remains the same. If you want to change
    the size of the image, click the link icon to the right of the ratio fields. It
    separates into two links. Then you can set the height and width independently.


    To resize an image, click image and select *Canvas Size*. A dialog window opens,
    similar to the scale image dialog window. You can set the width and height of
    the window. If you resize the window smaller, you can only see part of the image
    in the window. If you resize the window larger, extra space is added to the window
    where you can add elements to the image.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Removing Elements from an Image in GIMP


    The simplest way to remove an element from the image is to use the eraser tool.
    However, erasing part of the image leaves an empty space where the element was
    removed. A better way to remove an element from an image may be to cover it up.
    You can select a section of the image and cover it with a plain color or a pattern
    using the bucket fill tool—the tipping paint in the toolbox. The section is filled
    with a color from the foreground/background colors, whichever you select.


    However, covering the element to be removed with a solid color is seldom the solution.
    In most cases, the element is on grass, water, snow, or other backgrounds. The
    element being removed needs to be covered by its background. For instance, in
    Figure 13-7, there''s a telephone pole in the background, between the camera and
    a distant house with snow, a house and the sky as its background. You can remove
    the telephone pole by copying the section with the color of the snow, the middle
    section with the color of the house behind it, and the top part with the color
    of the sky.


    The clone tool from the GIMP toolbox is useful for covering elements with their
    background. The clone tool copies a section of a picture from one place and adds
    it in a different place. Thus, you can copy a section of the background and place
    it over the element to be removed.


    The clone tool icon in the toolbox looks like a rubber stamp. It''s in the bottom
    row of the tool icons shown in the section, “The GIMP Toolbox,” earlier in this
    chapter. When you click the clone tool button, the clone options display in the
    bottom section of the toolbox. The brush size determines the size of the section
    that is copied. Click Brush to select a different brush size.


    To move a section of the image from one location to another, follow these steps:


    +   1. Ctrl-click the section to serve as the source. A section matching the brush
    size is selected.

    2. Move the mouse pointer to the element you want to cover up.

    3. Click the new location. The source section replaces the target section. If
    you hold the click and drag the mouse around, a corresponding section from the
    source area is copied to the target area.


    With practice, any figure in an image can be removed by covering it up with the
    background behind it so that the replacement looks natural.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Adding Elements to an Image in the GIMP


    Elements can be added directly into your image, using tools from the toolbox and
    items from the menu. However, it''s usually a better idea to add a layer to your
    image and add elements on the new layer. Adding a layer is like adding a page
    to the image. The new layer doesn''t affect the existing image; it just places
    a new layer on top of the existing image. You can then add elements on the new
    layer.


    The new layer can be the size of the current image, smaller, or larger. Smaller
    layers are useful when you add small elements. For instance, you can add a bird
    to the sky by adding a bird size layer with the bird figure on. You can drag the
    new layer around the image to position it. You can scale it to match the size
    of the image. And, at any time, you can delete the new layer, deleting only the
    new elements, returning the image to its original condition.


    To add a layer, click Layer and select New, which opens the window on the right.
    You can give the layer a meaningful name. Two fields allow you to enter the layer
    width and height. The default displays is the image size. You can type a width
    and/or height for the layer. The bottom section selects the fill for the layer.
    It can be transparent, which means you can see the contents of the layer beneath
    it. Or, you can make the layer a solid color, either white or the foreground or
    background color shown in the GIMP toolbox. You can then add content to the layer.


    You can paste a figure from copied, click Edit and select Copy to copy the entire
    image, or if a section of the image is selected, to copy the selection. To move
    the pasted figure to the image, move the mouse pointer to the image where you
    wish to add the figure and click Edit and select Paste. The copied section is
    added to the image as a floating selection, which can be moved. You can position
    the pasted figure and anchor it as the active layer. You can convert the floating
    image to a new layer. Click Layers and select either Anchor Layer or New Layer.
    Nothing else will work until you set the floating selection.


    When you save your image, save it as a GIMP file (.xcf extension) to save the
    layer information. If you save it in a different format, you may lose part of
    the file information. Before you save as a .gif or .jpg, you will need to merge
    the layers. Click Layers and select Flatten Image to merge all layers into one.
    Be sure to save the image in GIMP format, first in GIMP, in case you need to change
    the image later. The .gif or .jpg image does not contain the layers information.


    ![](img/9a91733a8fb0082106ab0e361495babe_223_0.png)


    Graphics > Adding Elements to an Image in the GIMP'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# # Working with Layers in the GIMP


    Many images consist of a stack of two or more layers. An image is generally easier
    to manipulate when its elements are on different layers, allowing an individual
    element to be worked on without disturbing the other elements. A layer has four
    basic attributes:


    +   - **Active/Inactive**: You can only change the active layer.

    - **Opacity**: An image is a stack of layers. Opacity is the degree to which you
    can see through a layer to the layer beneath it.

    - **Visible**: A layer can be visible or invisible. You can''t see an invisible
    layer at all. However, it''s still there.

    - **Position**: The location of the layer in the stack of layers—top, bottom,
    or some-where in between.


    See layer information, click Dialogs and select Layers, which opens the window
    on the right. The dialog shows three layers in the image, with thumbnail images.
    Use this window to manage the attributes.


    Highlight a layer to make it active (in this figure, the first layer). This does
    not mean you can see the layer. Other layers may be covering it. However, in this
    figure, the active layer can be seen because it is on top.


    ![](img/9a91733a8fb0082106ab0e361495babe_224_0.png)


    The eye on the left means the layer is visible. If a layer is covering the active
    layer, the toolbar tools affect the active layer, but you can''t see what is happening.
    Click the eye to make the layer invisible, so you can see the active layer.


    The box between the eye and the thumbnail is a link. When this box is clicked
    for two layers, they move together when moved with the move tool.


    The background layer is the bottom image. It can''t be moved. However, the two
    upper layers can. If you click the down arrow, the highlighted layer moves down
    one position. The up arrow moves it up one position.


    The active layer can be acted upon by any of the toolbox tools. It can be moved
    using the move tool in the toolbox. It can be deleted. Any effects in the menus
    can be applied to it. Images can be pasted into it. It can be duplicated using
    the middle button on the bottom of the layers dialog.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Summary


    Graphic images are stored in files in one of several graphic formats. The most
    common formats are .bmp (mainly used for Windows files), .gif, .jpg, .png (3 formats
    for Web images), and .tif (used for exchanging graphics between operating systems).
    To view a graphic image on the screen, you must use an application that understands
    the specific graphics format. Konqueror can understand and display most file formats.


    Images are obtained from several sources. This chapter discusses how to obtain
    images from the following sources:


    +   **Scanner**: Describes scanning using the Kooka application

    - **Digital camera**: Describes moving pictures from the camera to the computer
    using Konqueror

    - **Screen shots**: Shows how to take screen shots using Ksnapshot or the GIMP

    - **Create using an application**: You can create your own images. Or you may
    need to edit existing images. This chapter describes how to create and edit three
    types of graphics using applications that are installed on almost all Linux distributions:

    - **Drawings**: Describes how to create and edit drawings using OpenOffice

    - **Presentation Graphics**: Describes how to create and edit slide shows using
    OpenOffice Impress

    - **Pictures**: Describes how to create and edit images using the GIMP'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# CHAPTER 14 Printing


    Printing on Linux, as on Windows, requires a printer driver that is specific to
    the printer connected directly to your computer. The printer driver sends the
    information from the computer to the printer in the format that particular printer
    understands. Therefore, Linux needs to know the manufacturer and model of the
    printer, so that the correct printer drivers are used.


    A printer can be connected directly to your computer. If your computer is connected
    to a LAN (local area network), you can send files to a printer that is connected
    to another computer on the LAN or connected directly to the LAN. You specify the
    type of connection when you install the printer.


    Files sent to the printer are sent to a queue that is associated with the printer.
    The printer job waits in the queue until its turn to print. You can create more
    than one queue to a printer, although you are unlikely to need to. If a printer
    is a network printer, print jobs from more than one computer on the network can
    be sent to the same queue.


    The software that handles printing for most Linux systems is called CUPS (Common
    UNIX Printing System). CUPS handles all the details from clicking the Print button
    on the application to passing the data to the printer in an understandable format.
    LPRng is another printing system available on most Linux systems, but it''s rare
    that you would choose to use it rather than CUPS.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# # Installing Your Printer on Fedora


    On Linux, files to be printed are first sent to a queue, where they await their
    turn to print on a specific printer. Before you can use your printer, you need
    to set up at least one queue for the printer. Most Linux distributions provide
    a utility with a GUI interface that makes it easy to set up your printer.


    Before you start installing your printer, be sure it''s connected to the computer
    and turned on, so that Linux can recognize it. You must use the root account.


    On the Fedora main menu, select System Settings->Printing. The window in Figure
    14-1 displays.


    ![](img/9a91733a8fb0082106ab0e361495babe_227_0.png)


    **FIGURE 14-1** Printer configuration window.


    When the configuration window opens, it displays any printers currently configured.
    In this figure, no printers are currently shown. Click **New** to start printer
    installation. In the print queue windows, you can click **Forward** to the next
    window or **Back** to return to a previous window.


    +   1. An Add Print Queue window opens.


    +   2. A window requests name and description for the printer. Type a short name
    that you can remember. Add a description with more information if you have more
    one print queue, so you can identify which is which.


    +   3. A Queue type window opens. Select the appropriate item from the “Select
    a queue type” drop-down list at the top. If your printer is connected to your
    computer, select *Locally-connected*. Other choices may be Networked Windows (the
    printer is connected to a Windows computer on the same network as your computer)
    or Networked CUPS (the printer is connected directly to the network, rather than
    to a specific computer).


    The list box shows the printer connections of the type selected. For instance,
    if Locally-connected is chosen, you might see `/dev/lp0`.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '4. The next windows allow you to select printer manufacturer and model. Generic
    is selected by default. Click Generic to see a drop-down list of manufacturers.
    Select your manufacturer and a list of models is provided, as shown in Figure
    14-2. Find and select your model.


    ![](img/9a91733a8fb0082106ab0e361495babe_228_0.png)


    FIGURE 14-2 Printer model window.


    5. In the next window, click Finish to create the new print queue.


    6. You are asked whether you want to print a test page. It is best to click Yes.
    You are then asked whether the test page printed correctly. Wait until the page
    prints and click Yes or No. If you answer no, you are given information to help
    you determine and correct the problem, usually an incorrect manufacturer or model.
    If you answer yes, your new printer is added, as shown in Figure 14-3.


    ![](img/9a91733a8fb0082106ab0e361495babe_228_1.png)


    FIGURE 14-3 Installed printers.


    14-3 shows two print queues available. The names and descriptions are shown in
    the information typed in Step 2. Hpdj450 is a printer connected to a different
    computer on the same network. The printer was installed on the other computer.
    Laser is the default printer, meaning files are sent to this queue unless you
    specify the other queue. To set the default, highlight a print queue and click
    Default.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Installing Your Printer on Other Distributions


    Most distributions have a utility, similar to the Fedora utility, that allows
    you to install a printer. You must use the root account to install a printer.


    Mandrake provides a printer management utility called Printerdrake, provided in
    the Mandrake Control Center. Be sure your printer is connected and turned on.
    Open the main menu. Select Configure your computer->Hardware->Printer.


    When the printer starts, it scans the hardware to detect any connected printers.
    If a printer is detected that hasn''t been installed yet, it asks whether you
    want to install it now. If you say yes, the installation procedure runs. Mandrake
    may need to install software. For instance, it may need to update the CUPS software.
    You may be requested to insert a CD from the installation CDs.


    When the utility utility opens, it lists all the installed printers, as shown
    in Figure 14-4.


    ![](img/9a91733a8fb0082106ab0e361495babe_229_0.png)


    From this window, you can add, edit, or delete a printer. Or set a printer as
    the default.


    Printers on SuSE are installed using YaST. Click Hardware. Click Printer. The
    utility will autod list of printers found. Select the printer to install and click
    Configure. If your printer was not detected, select Other and click Configure
    to start a manual configuration procedure for installing and testing the printer.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Printing


    Most printing is done using the application that created the files. The Print
    button in the application sends the file to the default printer. When you press
    the Print button, you see a window that looks very much like the print on Windows,
    where you can select a printer, pages to print, number of copies, and other options.


    The KDE desktop provides kprinter, an application that prints to printers or to
    PDF files. If you can find it in the main menu, select Run and type kprinter.
    In the window that opens, click Expand to see the window in Figure 14-5.


    ![](img/9a91733a8fb0082106ab0e361495babe_230_0.png)


    FIGURE 14-5 kprinter window.


    In Name, you can select the printer. You can also select Print to File (PDF).
    The folder to the right of the list box allows you to browse for the files to
    print. Click tabs to select pages to print, number of copies, and a schedule for
    the job to print.


    You can send a file to a printer from the command line with the following command:


    ```

    lpr -Pname filename

    ```


    name is the name of the print queue, such as Laser. If you leave the -P option
    out, the file is sent to the default print queue.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Managing Print Jobs


    Print jobs sit in the queue until it''s turn to print. They remain in the queue
    until the entire file is sent to the printer. Even a complete reboot may not remove
    a print job from the queue. You can look at the print queues and manage the jobs
    in the queue from the KDE Control Center. Open the Control Center from the main
    menu. Click Peripherals. Click Printers. Or, if you are unable to locate the print
    manager in the main menu, click Run and type kjviewer. The window in Figure 14-6
    opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_231_0.png)


    **FIGURE 14-6** Print job manager.


    The print in the figure shows a status of Processing, meaning it''s printing.
    In most cases, the job prints. Nothing else is needed. occasionally a print job
    may show a status of Error. A job can encounter problems and be unable to print.
    Or, sometimes a job prints garbled output to the printer, often using huge amounts
    of paper. The print job manager allows you to remove print jobs from the queue.
    You can also hold and resume jobs, send a job to the printer, restart a job, raise
    or lower the priority of a job, and order management tasks.


    You can check print queues from the command line with the command:


    1pq

    Laser is ready

    no entries


    1pq shows no jobs are in the print queue. You can use an -1 option to get additional
    information. You can remove a print job with:


    1prm jobid


    You can also find out information about the queues with 1lpstat (see Appendix
    B).'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Summary


    Files sent to the printer are sent to a queue that is associated with the printer.
    The print job waits in the queue until its turn to print. You can create more
    than one queue to a printer, although you are unlikely to need to. If a printer
    is a network printer, print jobs from more than one computer on the network can
    be sent to the same queue.


    The software that handles printing for most Linux systems is called CUPS (Common
