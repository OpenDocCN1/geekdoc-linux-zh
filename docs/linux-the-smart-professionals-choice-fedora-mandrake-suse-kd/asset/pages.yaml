  md: '# # Collecting Information for Mandrake


    Mandrake gathers the information it needs to install Linux. As part of the installation
    procedure it probes the hardware to determine the mouse, keyboard, and monitor
    types. If it is unable to identify the hardware, it displays a screen requesting
    information. However, Mandrake is particularly good at identifying hardware and
    seldom needs to display hardware screens. The following screens display:


    +   1. Language: If the selected language is incorrect, highlight the correct
    language. Click the triangle by a category entry to see a drop-down list of languages.

    2. License agreement: Mandrake displays a license agreement. You must click Agree
    before you can proceed.

    3. Type: If Mandrake finds another Linux on your hard disk, a screen is displayed
    where you can select a New installation or to Upgrade the existing Linux.

    4. Security level: Mandrake allows you to select a security level. The Standard
    security level is sufficient for most purposes. Enter an email address for the
    person who should be informed of security problems.


    +   5. Selecting where to install Mandrake: Linux can be installed alone on your
    hard disk or share hard disk with other operating systems, each with its own section
    of the hard disk, called a partition. Depending on what is currently on your hard
    disk, Mandrake offers 2 or more of the following choices:


    +   * Use free space: Inst Installs Mandrake on free, unused space on your hard
    disk. This is the choice if no operating systems are currently installed.

    * Use existing partition: Select this choice if you want to install Mandrake on
    existing Linux partitions.

    * Use the free space on the Windows partition: If your computer is currently running
    the Windows system only, Mandrake can create a Linux partition on the hard disk
    using part of the Windows space. The Windows partition will be smaller after Linux
    is installed.

    * Erase entire disk: Replace all current operating systems, including all data
    on the hard disk.

    * Remove Windows: Replace the current Windows partition, erasing all data in the
    process.

    * Custom partitioning: Allows you to create partitions manually. Unless you have
    a specific need to partition manually, such as a unusual purpose for your computer,
    don''t select this option. You must be fairly knowledgeable to partition manually.'
