  md: '# # Summary


    The Linux operating system that''s installed on your computer is a collection
    of many programs, called a distribution, put together by a group or a company.
    All distributions contain a core of essential components, necessary for Linux
    to run your computer. However, most distributions include more than the bare essentials.
    They differ on the number of applications included, installation procedures, system
    utilities, levels of support, and other factors.


    Distributions are available via a download from Web sites or on CDs. The downloadable
    software consists of CD images that you write to CD. You then install Linux from
    the CDs you created. Some distributions provide boxed sets with CDs and manuals.


    Fedora Core, the successor to the very popular Red Hat Linux, is the main distribution
    discussed in this book. Its strengths are strong support, graphical installation
    procedures and administrative utilities, and easy software updates. Fedora is
    not available in a boxed set. You must download it yourself or purchase it from
    vendors that download and create CDs for you. No manuals, but documentation is
    available on your system and at the Web site.


    In addition, the Mandrake and SuSE distributions are described in this book. Both
    emphasize ease of installation and use. These three distributions are oriented
    towards desktop computer users and provide installation procedures similar to
    Windows installation procedures. Other popular distributions are Slackware, Debian,
    MEPIS, Xandros, Linspire, and Gentoo, described briefly in this chapter. Live
    CDs that enable your computer from the CD are also available. Many, many distributions
    are available. More complete coverage of distributions is available at www.distrowatch.org,
    which maintains a database of 320 distributions.


    Choosing a distribution is your first step. Next, you need to get ready to install
    your Linux. You need to be sure you have the necessary computer resources, obtain
    the Linux software, and decide on the type of installation you want. Chapter 3
    provides the information you need to prepare for installation.'
  merge: -1
