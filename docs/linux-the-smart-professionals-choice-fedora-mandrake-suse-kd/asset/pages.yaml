  md: '# Linux Commands


    Linux commands are programs, developed by GNU or other projects, and included
    with the Linux distribution. You can see some Linux commands by typing:


    ls /bin


    The output includes many of the Linux commands you use. For instance, the 1 command
    used above to see what''s in the bin directory runs a program stored in the bin
    directory, as shown in the output from the 1s command. The commands are binary
    files. To see the file type, enter:


    ```

    file /bin/1s

    /bin/1s: ELF 32-bit LSB executable, Intel 80386 version...

    ```


    This is an executable file if you tried to display it on the screen with something
    like cat

    bin/1s, the output would be garbage.


    You can run this program by typing 1s at any command line. You don''t need to
    use the path because the program is on the system path. When you type any command
    at the command line, Linux searches the path and executes the first program it
    finds that matches the command you type. You can see the system path by typing:


    ```

    echo PATH

    /usr/kerberos/bin:/usr/local/bin:/usr/bin:/usr/X11R6/bin:/usr/home/jane/bin

    ```


    The system path is a series of directories, separated by colons (:). Notice that
    the directories are named bin, which stands for binary. The name is not required,
    just customary. Different distributions use different paths. This is the path
    for a Fedora user account. The root account has a different path, including directories
    containing system administration commands. The following is the path for a SuSE
    account:


    ```

    /home/jane/bin:/usr/local/bin:/usr/bin:/usr/X11R6/bin:/usr/games:/opt/gnome/bin:/opt/kde3/bin:/usr/lib/java/bin

    ```


    You can add commands to your system by copying a program into any directory on
    the system path. You can add commands you write and compile yourself or commands
    you download from the Internet. It is custom to put commands added by the user
    into /usr/local/bin or /usr/bin. SuSE provides a default bin directory in the
    home directory that can be used for commands you want to run or perhaps permit
    only to a few accounts.


    Linux commands can be saved in a file called a shell script. By one. When the
    script run, it executes the commands, one can also include control statements,
    such as if and loops. Writing shell scripts is discussed in Chapter 19.'
  merge: -1
