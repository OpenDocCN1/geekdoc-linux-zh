  md: '# Formatting Cells


    OpenOffice Calc has two formatting options:


    +   * **Manual formatting:** Formatting by highlighting cells, columns, rows and
    clicking-toolbar buttons. You can also format manually from the Format menu. You
    can format cells (font, size, color, number format),or pages (margins, background,
    headers/footers, etc.).

    * **Styles:** Styles are collections of formatting that you can apply to one or
    more components of your spreadsheet. In Calc, you can create cell or page styles.
    Calc comes with built-in styles that you can use as is or modify and use. Creating
    and applying styles is discussed in this chapter.


    Styles allow you to make a formatting change to an entire spreadsheet easily.
    For instance, if you use a default cell style that specifies one font, you can
    change the font in the entire spreadsheet by changing the font for the default
    style. Styles also can be shared with co-workers for company-wide standard spreadsheets.


    First, select the cells to be formatted. You can select a single cell by clicking
    it, a row or column by clicking the letter or number, or any rectangular section
    of cells by dragging the mouse across the cells.


    To format by the Format menu, select Cells to see the window in Figure 12-2, which
    allows you to set many formatting options—number format, alignment, borders, etc.


    ![](img/9a91733a8fb0082106ab0e361495babe_199_0.png)


    FIGURE 12-2 Cell formatting window.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'You can format the height of rows and width of columns with the mouse. Move
    the mouse pointer over the line between two letters or two numbers. The pointer
    turns into a line. Drag the line to make the row or column larger or smaller.
    You can also format width and height by the Format menu. Select Column to set
    the column width or Row to select the row height.


    Quick manual formatting is available using the format toolbar. You can set the
    font and size with the drop-down lists. You can click icons for bold, italics,
    and underline, set colors for text and background, align the contents of the cell
    vertically and horizontally, and turn borders on or off. You can format numbers
    as currency or percentages and change the number of decimal places by clicking
    the icon repeatedly.


    OpenOffice Calc is installed with some built-in styles. To apply styles, use the
    Stylist-list box shown in Figure 12-1—that provides the available styles, listed
    by type. The two icons over the list box switch the list between cell and page
    styles. To apply a style from the Stylist, double-click the desired style in list.


    To create or modify a style, click Format on the menu bar and select Style Catalog.
    The Style Catalog window opens (shown in Figure 11-2), in which you can create
    or modify styles. When you press New or Modify, the window shown in Figure 12-2
    opens, displaying the values for the currently selected style. Modify makes changes
    to the selected style. New creates a new style with the settings of the current
    style. After you make the modifications you need, you save the style with the
    changes, providing a new name if it''s a new style. After using new, if you modify,
    you have the same style with the old settings plus the new style with the new
    settings.


    You can apply conditional formatting to cells. Click Format and select Conditional
    Formatting. You can apply styles to cells based on the values in the cell. For
    instance, you can direct Calc to apply style “large” to cells when the value is
    higher than 100.


    Stored formats—collections of shading, colors, and borders—are available for you
    to apply to the highlighted section of your spreadsheet. You can highlight the
    complete spreadsheet. Click the Autoformat button to see a list of predefined
    formats that you can select. You can add formats to your Autoformat choices, but
    you must add them using OpenOffice Writer. See the Tables and Columns section
    of Chapter 11.


    You can combine two or more cells into one cell. Select the cells you want to
    combine. Click Format. Select Merge Cells->Define.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Formatting Pages


    You can format a spreadsheet page from the Format menu. Select Page to see the
    window in Figure 12-3.


    ![](img/9a91733a8fb0082106ab0e361495babe_201_0.png)


    FIGURE 12-3 Page formatting window.


    From this window, you can set page size, orientation, margins, background, borders,
    and more. To set a header, click the Header tab. A window allows you to turn the
    header on and set margins and spacing. The More button allows you to set borders
    and background for the header. Click the Edit button to add the content to the
    header. Type the content and/or buttons to add the filename, page numbers, date,
    and time.


    You can create and use page styles in the way you create and use cell styles,
    described in the previous section. You can apply the page format using the Stylist.
    You can create or modify a page style from the Format menu, selecting Style Catalog,
    select-ing Page styles from the drop-down list above the list box, and clicking
    New or Modify.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Editing the Spreadsheet Content


    The process of adding and editing spreadsheet content is familiar. Type numbers,
    text, or formulas into cells; delete cell contents with <Backspace> or <Del>;
    replace text by highlighting and typing new text over it. The Edit menu contains
    familiar items, such as copy, cut, paste, and replace. You can insert a row or
    a column by right-clicking a number or letter. You can insert cells by right-clicking
    a cell.


    Calc provides an automatic fill feature. When you select a cell, the lower-right
    corner shows a small box. If you drag the box over some cells, the contents of
    the cell are inserted into all the cells highlighted. If the box contains a number
    or month, the value is incremented in each cell.


    You can split your window, either vertically or horizontally, so you can edit
    two parts of the spreadsheet at once. Highlight any cell (except A1) in row 1
    to split vertically or in column A to split horizontally. Click View. Select Split
    Window. The window splits at the selected cell. To return to a single window,
    select View>Split Again.


    You may make any section of rows or columns non-scrolling to keep the labels on
    the screen. Select a cell below that you don''t want to scroll or to the right
    of the cell you don''t want to scroll. Click Window. Select Freeze. For instance,
    if you select cell B2, both row 1 and column A will stay on the screen when you
    scroll.


    OpenOffice provides the Navigator, a useful tool for moving around in the spreadsheet
    and moving elements of the spreadsheet to different locations. Use of the Navigator
    is described in Chapter 11, in the section "Editing Documents Contents",


    You can add graphics to a spreadsheet, just as you can to a document. Graphics
    can be inserted from any file or draw directly into the spreadsheet using OpenOffice
    drawing tools. Graphics in spreadsheets are handled the same as graphics in word
    processing documents, as described in Chapter 11.


    You can create and edit charts in your spreadsheet. Highlight the cells you want
    to include in the chart. Click Insert Chart. A wizard opens that allows you to
    select the type of chart (bar chart, pie chart, etc.), labels and other features
    and creates the chart. When you select a chart in your spreadsheet, the main toolbar
    (on the left) changes to provide several buttons that change the appearance of
    the chart. For more changes, you can double-click any element in the chart to
    see an element-specific window that allows you to change the borders, colors,
    fonts, labels, transparency, etc.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Formulas and Functions


    In any other spreadsheet, Calc lets you enter formulas. Formulas can add (+),
    subtract (-), multiply (*), divide (/), or raise to a power (^). They can also
    include greater than (>), less than (<), greater than equal to (>=), less than
    equal to (<=), or not equal to (<>).


    To enter a formula, select a cell and type =. All formulas must begin with an
    equal sign. Type the formula following the.


    Many functions are available that assist in entering formulas. Functions accept
    a range of cells indicated by a colon (:), such as B2:B5, and a series of cells
    indicated by a semicolon (;). For instance, you can add the B3, B4, and B5:


    ```

    =SUM(B3:B5)

    ```


    Sum is a popular function that it has a button on the toolbar—the middle icon
    on the right. Select the cell where the sum should go, by clicking the Sum icon.
    Calc will give you range of cells to sum, selecting them with a blue box. You
    can change the range by dragging the corner handle of the blue box.


    You can find the function you need by clicking the first icon shown on the toolbar,
    before the Sum icon. The window in Figure 12-4 opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_203_0.png)


    FIGURE 12-4 Functions window.


    The functions are shown in the list box, by category. When you double-click a
    function, fields are available to enter the numbers or cell names needed.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# # Saving and Printing


    OpenOffice Calc uses XML to store its documents. XML is a widely used, standard
    format for storing information in an application-independent format. An OpenOffice
    Calc spreadsheet is stored in a file with .sxc extension. The file, however, is
    not a single file; it is a zip archive containing several files required for managing
    an XML document. An .sxc file cannot be opened in another Office application.


    You can save your document as other types of files:


    +   - Microsoft Excel: All versions of Excel back to Excel 5.0. All sheets are
    saved. (.xls extension)

    - StarCalc: Spreadsheet application published by Sun. OpenOffice evolved from
    StarOffice. (.sdc extension)

    - dBASE: Spreadsheet data is formatted as a dBASE file. (.dbf extension)

    - Data Interchange Format: A format for exchanging files between spreadsheet applications.
    (.dif extension)

    - SYLK: A text format commonly used to exchange tabular, spreadsheet type between
    spreadsheet applications. (.lk extension)

    - Text: File that contains only the content, without any formatting. (.txt extension)

    - HTML: File that contains HTML code (.html extension)


    Calc can read spreadsheets. Although Calc can open the document, some advanced
    or complex elements may not be converted correctly. The simpler a document is,
    the more likely it is to convert without problem.


    You can turn on a view that shows where your pages break. Click View. Select Page
    Break Preview. The page breaks will start new pages when you are printed. You
    can insert manual page breaks from the Insert menu.


    You can print part of your spreadsheet. Select the cells to print, click Format,
    and select Page Ranges->Define. You can print a row or column of labels on each
    page. Highlight the row or column to be repeated. Click Insert and select Names->Define.
    Type a name for the highlighted area and click Add. Select the name you just added
    to the list box, click More, and check "Repeat Column" or "Repeat Row".


    You can prevent the printing of cells. Highlight the cells. Right-click a highlighted
    cell and select Format Cells. Click the Cell Protection tab. "Hide when printing.".


    You can save your documents in PDF format. Click File. Select Export as PDF.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Summary


    Spreadsheet applications are widely used. Calc is the spreadsheet application
    in OpenOffice. It has functionality equal to Microsoft Excel, the leading spreadsheet
    application.


    OpenOffice Calc uses XML to store its documents. XML is a widely used, standard
    format for storing information in an application-independent format. OpenOffice
    Calc can read Excel files. Excel can''t read OpenOffice Calc files in Calc XML
    format, but OpenOffice Calc can save documents in Excel format, so that Excel
    can open them. Calc also reads and writes documents in formats, such as HTML and
    SYLK, that are general formats, allowing the exchange of spreadsheets among applications.


    This chapter describes how to:


    +   * Create a spreadsheet

    * Format cells and pages

    * Edit a spreadsheet

    * Use formulas and functions

    * Save and print spreadsheets


    The next chapter discusses the use of graphics on Linux, including drawing, presentation
    graphics, and pictures. Drawing and presentation graphics are created using the
    OpenOffice applications Impress and Draw.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# CHAPTER 13


    # Graphics


    Linux has graphics tools for the most common graphics needs:


    +   * **Pictures**: Applications can create and edit graphic files containing
    digital images—pictures. You can create the pictures in the graphic application
    or you can edit a picture contained in another file. For instance, you can edit
    a picture taken with a digital camera or scanned by a scanner. On Linux, the most
    powerful, full-featured application for creating or editing pictures is the GIMP
    (GNU Image Manipulation Program). The GIMP offers similar functionality to Photoshop.

    * **Diagrams**: Drawings composed of shapes and lines connecting the shapes. Organizational
    charts and network diagrams are composed of shapes and lines. Dia is a diagramming
    program, similar to Visio.

    * **Drawings**: Drawings are line art, usually just black and white. Cartoons
    and logos are commonly made with a drawing application. OpenOffice provides an
    application called Draw that allows you to create and edit drawings. You can draw
    directly in OpenOffice documents, as described in Chapter 11. Or, you can export
    drawings made using Draw in graphic formats that can be used by other applications.

    * **Presentation Graphics**: Creating slides that accompany talks and presentations
    is a common use of graphics. OpenOffice provides the Imp application for creating
    slides, comparable to using PowerPoint in MS Office.


    The source of your graphics can be original art or drawings that you create. It
    can also be photographs that you take yourself. If you are using art or photographs
    originated by someone else, you need to be sure you can legally use the picture.
    Pictures are copyrighted by default and can''t be used without permission.


    Archives of pictures are available on the Web. Some pictures need to be purchased;
    some are free. You need to read the information accompanying any pictures you
    wish to use. If explicit permission is not provided for public use, you need to
    get specific permission from the copyright owner.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Graphics File Formats


    Graphics files contain information that describes images. An application must
    be able to interpret graphic formats in order to read or display a graphics file.
    A text editor or a word processing program can''t correctly open a graphics file
    to produce a picture, although you can insert a graphics file into OpenOffice
    documents.


    The information stored in a graphics file can be in one of several formats, with
    different purposes. Usually the file has an extension that identifies the type
    of format. Graphics applications save files with the appropriate extension. However,
    because Linux recognizes file types by information the file rather, than by the
    extension, when using a Linux application, you might see a message stating that
    the file extension does not match the file format. Some common formats are shown
    in Table 13-1.


    TABLE 13-1 Graphics File Formats


    | Ext | Name | Used for | Advantages/Disadvantages |

    |---|---|---||}{

    | .bmp | MS Windows bitmap format | MS Windows graphics files | Recognized by
    most Windows applications. |

    | .gif | Graphics Interchange Format | Web page: line drawings, cartoons | Better
    quality than .jpg for images with 256 or fewer colors. Used for animated graphics.
    |

    | .jpg | Joint Photographic Experts Group | Most used type for Web page: photographs,
    art | Better quality for photographs than .gif. Smaller file size than .png. |

    | .png | Portable Network Graphics | General graphic images; recognized by browsers
    | Newer format designed to replace .gif. A universal format with no patent restrictions.
    Smaller file size than .gif. Better transparency support. No animation support.
    |

    | .tif | Tagged-Image File Format | Popular for graphics exchanged between operating
    systems | Early type that was designed to be hardware and OS independent. The
    newer .png format is better suited to exchange in many environments |


    You can convert files from one format to another. You can read a file into an
    application and use *Save* to save the file in a different format. If you want
    to convert quickly, without editing, use the convert command at the command line.
    For example, you can convert an existing .gif file to a .jpg file, use:


    ```

    convert rose.gif rose.jpg

    ```'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Viewing Graphics Files


    Images can only be displayed by applications that can interpret the information
    in a graphics file. The application must understand the specific format the graphic
    file is stored in. An application may understand .jpg files, but not .bmp files.


    Konqueror can display most graphics formats. Konqueror can display thumbnails
    of the graphics files when it displays the files in a directory. Thumbnails are
    small versions of the image. To configure Konqueror to display thumbnails, check
    View and select Preview to see the submenu shown on the right. Show Previews.
    Check or uncheck the types of previews you want to see. For graphics thumbnails,
    check Pictures and Images.


    ![](img/9a91733a8fb0082106ab0e361495babe_208_0.png)


    With previews on, thumbnails of most graphics files display, but not all. For
    instance, thumbnails of .bmp files and .tif files are not shown. However, this
    doesn''t mean that Konqueror can''t render the graphics format. If you double-click
    the icon for a .bmp or .tif file, the image displays in the Konqueror window.


    Graphics file extensions are associated with applications, as described in Chapter
    9. To see which application is associated with a particular file type, highlight
    a file with the extension, right-click, and select Edit File Type. You can see,
    and change, the application that opens the file with the given extension.


    Konqueror can interpret most graphics file types, but not all. For instance, Konqueror
    can''t interpret .svg files, a graphics file type that uses XML. If you double-click
    an .svg file icon, it opens in the application associated with the .svg file type,
    usually sodipodi.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Scanning Documents


    If you have a scanner, you can scan KDE documents in Linux. You can scan two types
    of documents:


    +   - Images: A document is scanned and stored in a graphics file format. The
    image must be viewed with software that can display,graphics. The image is a picture
    of the document.


    +   - Text: A document that contains text can be converted into a text document.
    Using a process called optical character recognition (OCR), the characters that
    are scanned read as letters and stored in a text file. OCR doesn''t get the characters
    100% correct. Its accuracy depends on the quality of the document being scanned.
    However, if you need to edit a document, it''s often faster to scan and edit the
    OCR errors than to type the document.


    Scanning on Linux is provided by Kooka, an open source raster image scan program
    that is an official part of the KDE Graphics Package. Kooka uses the SANE (Scanner
    Access Now Easy) library. Kooka provides OCR, as well as scanning documents in
    image format.


    The SANE Web allows you to search a database of scanners. You can enter a manufacturer
    and model to determine whether the scanner is supported (www.sane-project.org/cgi-bin/driver.pl).
    If possible, check for scanner support before purchasing a scanner.


    If you want to use OCR on your scanned image, additional software is required.
    You may need to install it. Check your distribution software for a package called
    gocr. If you can''t find it on your system or your installation CDs, you can install
    a package from jocr.sourceforge.net. See *Chapter 10* for information on installing
    packages.


    Start Kooka from the main menu, in the graphics or multimedia submenu, or select
    Run and type kooka. When Kooka starts, it scans your system for scanners and provides
    a list of scanners found. Select the scanner you want to use.


    When Kooka is open, look at the bottom-left section for your scanner settings.
    What settings can change on the scanner you are using. You can usually set color
    and resolution and offset brightness and other options. You may have to experiment
    with settings to obtain the best scan. Higher resolution can improve the image,
    but can result in huge image files. The default is often 72 for a screen display,
    appropriate for Web images. However, if the text is what you want to transcribe
    using OCR, choose a higher resolution.'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'Preview the first. Click Preview Scan when the document is in the scanner.
    When it''s scanned, you can select a section of the picture to scan, rather than
    the whole picture. Select the section to scan with the mouse. Click ImageCanvas
    and select Create from selection. When you are satisfied with the preview, click
    Final Scan.


    When the final scan is complete, a window (shown on the right) opens where you
    can select the graphics format for the image. A description of a format displays
    when you highlight a format from the list box.


    ![](img/9a91733a8fb0082106ab0e361495babe_210_0.png)


    If you check the "Don’t ask again" box below the list box, Kooka will save all
    future images in the selected format. To change the format in the future, click
    Settings and Configure Kooka->Save Image->Always show memory assistant.


    Click OK when you have selected the desired format.


    The final image displays in the right section of the Kooka window. Right-click
    the image to see some options, such as Scale to width, Zoom, or Rotate Image.


    You can click the Gallery tab to see a list of the images you have scanned. When
    you are ready to save a scanned image, right-click its name in the gallery and
    select Save Image.


    If the image scanned is a document that you want to transcribe using OCR, click
    ImageCanvas and select OCR image. A window that allows you to change settings
    displays. You may need to experiment to achieve the best results. You can start
    with the defaults. Click Start OCR. The process may take a little time. When it''s
    finished, a window opens showing the output from the OCR process, with an editing
    window below. You can try different settings for more accurate results.


    When you are satisfied with the OCR output, click Open in Kate. Kate is a KDE
    text editor, described in Chapter 18. Kate can be used to edit the file, including
    checking the file with the spell checker, useful for finding the OCR errors in
    the file. You can save the file from Kate as a text file. You can then open it
    in any text editor or processor for further use or editing.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# Presentation Graphics


    You can use OpenOffice Imp to create presentation graphics, similar to PowerPoint
    in MS Office. Start Imp from the main menu with Office->Presentation or from Writer
    with File->New->Presentation. When you start Imp, an OpenOffice AutoPilot runs
    that asks questions. First, select whether you want to open an "Empty Presentation,"
    open "from Template," or "Opening Existing Presentation." If you choose Empty
    Presentation for a new presentation and click Next, you are asked to select a
    background and an output medium. Select Original to use your own background.


    Next, you are asked to select a slide transition from a drop-down list and a presentation
    type. Default means the presentation requires a key click to move from one slide
    to the next. Automatic means the presentation moves from one slide to the next
    automatically.


    When you click Create, the screen in Figure 13-1 opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_211_0.png)


    FIGURE 13-1 Imp layout screen.


    The window provides layouts for the slide. If you want to create your own layout,
    select the first layout—the blank page. The layouts provide sections for slide
    components. For instance, the layout in the lower-left corner has a title across
    the top, a graphic section on the left and a bulleted list on the right. Select
    a layout. Click OK.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'Figure 13-2 shows the Impress window. It''s open with the lower-left layout
    selected from Figure 13-1.


    ![](img/9a91733a8fb0082106ab0e361495babe_212_0.png)


    FIGURE 13-2 OpenOffice Impress.


    The layout provides instructions for adding your contents—click to add text and
    double-click to add a graphic. Notice the small menu window. You can use this
    window to insert the next slide, to follow the current slide. Notice the tabs
    at the bottom showing which slide is open. A tab displays provides for each slide
    in the presentation.


    If you selected the blank page layout, you can add your own content, placing it
    according to your layout. The main toolbar (left) and the object toolbar provide
    drawing tools (described in the section "Drawing with OpenOffice Draw\ For instance,
    long-click the T icon (text) to see three choices for adding text—a horizontal
    text box, a vertical box, and callouts. The Insert menu also provides objects
    you can add to your slide, such as spreadsheets, charts, and special fields (date,
    author, filename).


    You can save your presentation as an Impress presentation, which has an .odp extension,
    or as a PowerPoint file. You can export your presentation to PDF, HTML code, Flash,
    or one of many graphics formats, such as .gif or .jpg.'
  merge: -1
