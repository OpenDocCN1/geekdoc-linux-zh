- img_proc: true
  md: '# Infinite Loops


    Loops can be infinite loops. That is, loops that continue repeating forever. Infinite
    loops are seldom written deliberately. They usually result from a scripting error.
    No one is immune.


    The following program results in an infinite loop:


    ```

    #!/bin/bash

    while [ $n -lt 10 ]

    do

    echo $n

    let n=$n+1

    done

    ```


    The output from this program is:


    0

    0

    0

    ...


    continuing forever because $n is set to 0 at the beginning of each loop. Therefore,
    $n will never become equal to 10. So, the loop will never stop.


    Another common scripting mistake is to leave out the statement that increments
    the value being tested. For instance, if you leave out the let-1 command in the
    above script, you would create an infinite loop.


    You can stop an infinite loop with <Ctrl-c>. Perhaps more than one <Ctrl-c>. It
    should break out of the script. Also, a <Ctrl-z> works. It stops the script. Sometimes
    the output will continue to display for a time, but it will stop shortly.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# # Scheduling Scripts to Run Automatically


    Linux allows you to schedule a command to run at a specified time. You can use
    this ability to schedule scripts to run automatically. You schedule jobs using
    the crontab command.


    The first time you schedule a job, you create a file with the commands you want
    to schedule. Each command goes on a separate line. The crontab format requires
    six items on the line, each separated by a space. The items are, in the order
    of occurrence:


    +   - Min: Minute to run. Values can be 0–59.

    - Hour: Hour to run. Values can be 0–23.

    - Day of month: Day of the month to run. Values can be 1–31.

    - Month: Month to run. Values can be 1–12.

    - Day of week: Day of week to run. Values can be 0–6, with 0 being Sunday.

    - Command: Command to run.


    Each item must be present. If an item is not relevant for your scheduling, enter
    *. Below are two crontab entries that run a shell script:


    ```

    59 0 * * * /home/janet/backup

    0 2 * * 5 /home/janet/cleanup

    ```


    The first line runs the script backup at midnight every night. The second line
    runs cleanup at 2 a.m. every Friday.


    Create a named crontab that contains entries for the jobs you want to run automatically.
    To schedule your jobs, type:


    crontab crontab


    This will schedule your jobs. If the command fails, you may need to change the
    root account. As root, you can schedule the job for another user, as follows:


    ```

    crontab -u janet crontab

    ```


    You can see what is scheduled for you by typing:


    ```

    crontab -l

    ```


    You can change your scheduled jobs by typing:


    ```

    crontab -e

    ```'
  merge: -1
  pgno: 313
