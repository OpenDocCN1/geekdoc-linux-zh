    on the main menu. For instance, for the Fedora main menu, you can start xmms by
    selecting Sound & Video->Audio Player. If you don''t find it on your distribution,
    you can install it from xxms.org, as discussed in Chapter 10.


    NOTE

    On Fedora, xmms is installed but doesn''t include MP3 support. You can download
    and install xmms from the project Web site with MP3 support.


    When you start xmms, it opens the window shown on the right, with all the expected
    buttons, such as play/pause, stop, next track, etc. When a sound file is playing,
    its name, length, and other information displays. The left slider under the window
    is


    ![](img/9a91733a8fb0082106ab0e361495babe_254_0.png)


    control. The right slider controls the balance between speakers. Xmms has other
    functions that are not displayed until needed. If you click EQ, an equalizer,
    as shown on the left, opens under the xmms main window, allowing you to adjust
    the sound as needed.


    ![](img/9a91733a8fb0082106ab0e361495babe_254_1.png)


    The PL button opens the play list editor window shown on the right. You can add
    and remove songs anywhere on your hard disk. You can create and save different
    play lists and use whichever play list you want. In the main xmms window, you
