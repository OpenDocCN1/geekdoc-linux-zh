  md: '# Graphics in Documents


    OpenOffice Writer provides two methods for adding graphics to your document. As
    in Word, you can add graphics by:


    You can insert graphics from a file using two methods:


    +   - **Embed**: Inserting the graphic into the document. When you embed the graphic,
    it''s always part of the document. You don''t need to be concerned with a separate
    graphics file. Embedding is often preferred when you need to send the document
    to others. When you copy and paste a graphic, it is automatically embedded.

    - **Link**: The graphic is not included inside the file. Rather, a link to the
    graphics file is included in the document. The document is much smaller without
    the embedded graphic. When the graphic file is updated, the graphic in the document
    is also updated. No need to reinsert the new graphic.


    You can insert a graphic directly into a document or into a frame. A frame is
    useful for keeping the graphic and its caption tether. A graphic or a frame can
    be anchored to a page location, a paragraph, or a character. When the page/paragraph/character
    moves, the graphic/frame moves with it, with the same orientation.


    If you want to put your graphic into a frame, insert the frame first, and then
    insert the graphic inside the frame. To insert a graphic into a document or frame,
    click Insert and select Graphics->F11. A window opens where you can browse to
    the graphic file. To link the graphic, rather than embed it, click the Link box
    at the bottom of the window. A Preview box is also available to be checked.


    To add a caption to a graphic, select the graphic, click Insert, and select Caption.
    The screen to the right appears. Select a Category or type a new one (e.g., Figure).
    You type the caption text. A caption preview appears at the top. The number is
    added automatically. The graphic is put into a frame when the caption keeps the
    caption and graphic together when they meet.


    | Properties | |

    |---|---|

    | Category | Figure | Ok |

    | Numbering | Arabic (1 2 3) | Cancel |

    | Caption | | Help |

    | Position | | Options |

    | Apply border and shadow | |

    | Object name | Graphic3 |'
