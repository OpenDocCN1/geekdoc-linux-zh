  md: '# Configuring the Desktop


    You can change many settings for both the desktop and the panel. In fact, many
    people go to great lengths to express their creativity with their desktops. Some
    creative desktops can be seen at l.lynucs/index.php?p=featured.


    Almost everything about your desktop is configurable. Some changes are made in
    desktop and panel menus and some on the main menu. In some cases, a setting can
    be changed by more than one method. In general, KDE and GNOME provide different,
    although similar, procedures for configuring your desktop.


    Specific instructions for the most frequently changed settings are provided in
    this chapter. However, space is not available to provide instructions for all
    possible desktop configurations. If you want to make a change to your desktop
    and don''t find instructions in this book, it doesn''t mean the change isn''t
    possible. It probably is.


    In KDE, many changes can be made in the KDE Control Center, accessed from the
    main menu, either directly or through the Preferences. When you start the KDE
    Control Center, you will see a similar screen to the one shown in Figure 6-7.


    ![](img/9a91733a8fb0082106ab0e361495babe_103_0.png)


    82 Using Your Desktop > Configuring the Desktop'
