  md: '# CHAPTER 18

    Editing Text Files


    Text files are files that contain only text characters, with no formatting information.
    HTML files, program source code, and many Linux configuration files are text files.
    Although you can edit text files with a word processor, it''s generally simpler
    to use an application that has only the features necessary to edit text.


    Many text editors have a GUI interface. If you are working on your desktop, a
    GUI editor is useful. However, sometimes you need a command-based editor to use
    at the command line. This chapter provides instructions for using a GUI editor
    and a command-based editor:


    +   - Kate: (KDE Advanced Text Editor) A basic text editor with a GUI, similar
    to Notepad. Kate has many more capabilities than Notepad.

    - vi: A command-based text editor, suitable for use at the command line. vi is
    installed on every Linux and UNIX system, regardless of what other text editors
    are installed. Many Linux distributions provide an updated version of vi called
    vim. Any commands that work in vi also work in vim.


    If you come from a Windows background, the vi-based environment may be unfamiliar
    to you. In vi, you press keys to execute editing commands that change the file
    contents. You may be more familiar with clicking icons or selecting menu items
    to change the file.


    Both editors allow basic editing, such as insert text, delete text, replace text,
    copy text. Both editors also have advanced features and features useful for programmers,
    as as:


    +   - Multiple document editing: Can have many documents open at the same time.
    Can copy from one file to another.

    - Plug-ins: Add plug-ins for additional functionality. For instance, Kate has
    a spell checker plug-in.

    - Syntax highlighting: Colored highlighting of source code syntax.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Opening a File in Kate


    Kate can be started from the KDE main menu (Editors->Kate). Or you can start it
    by typing Kate at the command line, either using Run or in a terminal window,
    both in KDE and GNOME. Kate is shown in Figure 18-1.


    ![](img/9a91733a8fb0082106ab0e361495babe_289_0.png)


    FIGURE 18-1 Kate text editor.


    The figure shows Kate empty, with no file opened. By default, Kate opens the last
    file edited. To stop files at startup, click Settings and select Configure Kate.
    Uncheck “Reopen files at startup.” You can open a file from the File menu item
    or by dragging and dropping a file from the desktop, Konqueror, or other sources
    into Kate.


    In the figure, the Files tab is selected, opening the file list that shows all
    open files. Currently, only one file is open—Untitled 1. Click the Folders tab,
    to open the File Selector, where you can locate and open a file.


    The editing window can be split, allowing you to edit more than one file at a
    time or two locations in the same file. Select View and select Horizontal or Vertical
    Split. Select Close Current to close a section of the window. Select New to open
    a new editing window.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# # Editing in Kate


    The process of adding and editing document content is familiar to users of text
    editors (such as Notepad) or word processors (such as Word or WordPerfect). Insert
    text at the cursor by typing. Delete text with <Backspace> or <Del>. Replace text
    by highlighting and typing new text over it. The Kate Edit menu contains familiar
    items, such as copy, cut, paste, and find replace. The undo command can do up
    to 256 actions in a row.


    Kate allows you to highlight rows, instead of columns. To change column selection,
    click Edit and toggle Block Selection. Select it to change back to row selection.


    Plug-ins are available for Kate that add to its basic capabilities. For instance,
    a spellchecker-plugin is available. You must activate a plug-in before you use
    it. To do so, click Tools and select Configure Kate. Expand Applications (click
    the plus sign, +) and click Plugins. A list of plug-ins that you can check or
    uncheck displays. If you check the box by Spell and click OK, a Spelling item
    is added to the Tools menu.


    Kate provides a find command that allows you to find and open a file based on
    its content. Click Tools and select Find in File to show the window on the right.
    Enter the text you are searching for in the Pattern field. In the Files field,
    specify the filenames to be searched in. The Directory field specifies where to
    search. Check recursive to search subdirectories. The files found are shown in
    the list box. If you double-click a filename, it opens in Kate.


    The pattern field allows you to enter a regular expression—a pattern that can
    be used to match strings. For instance, you can search for numbers or words beginning
    with S. The Find and Find Replace commands found on the Edit menu also allow you
    to search for regular expressions. Using regular expressions is explained in Appendix
    A.


    ![](img/9a91733a8fb0082106ab0e361495babe_290_0.png)'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Kate Features for Programmers


    Kate has several features that are useful for writing program code:


    +   * Line Numbers: Kate can add temporary line numbers to the beginning of each
    line in a file. Line numbers are useful for programmers when debugging a program.
    Click View. Select Show Line Numbers.


    +   * Syntax Highlighting: Kate highlights syntax for many programming languages,
    from C and C++ to HTML and JavaScript. Click Tools. Select Highlight Mode. By
    default, Normal mode is checked, which means no syntax highlighting. Select a
    category from Sources, Markup, Scripts, or Other and select the language you are
    writing code.


    +   * Word Wrap: Word wrap is on by default. You can turn it off by clicking Settings
    and selecting Configure Kate. Expand Editor (click the +). Click Editing. Uncheck
    the box by "Enable Word Wrap."


    +   * Indenting: You can indent or unindent a highlighted block of text using
    the Indent of spaces to indent in Settings->Configure Kate. Expand Editor. Click
    Editing. Select a number for the "Tab and Indent Width" text box. You can also
    check "Replace tabs with spaces" if you desire. You can set Kate to automatically
    indent within parentheses and brackets by clicking Indentation and checking "Automatically
    Ind."


    +   * Comments: Kate can add comments to your code, based on the language selected
    when Highlight mode is turned on. With no text highlighted, you can insert comment
    marks by clicking Tools and selecting Comment. You can then type the comment text.
    Or you can highlight some text and select Comment and Kate will comment out the
    code, using the method appropriate to the selected language. You also uncomment
    existing comments by highlighting the comment and selecting Uncomment from the
    Tools menu.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# # Opening a File in vi


    vi is a command-line editor, for use in a terminal window. To open a file in vi,
    type:

    vi testfile


    testfile is the filename. In Figure 18-2, testfile doesn''t exist, so a new file
    is opened.


