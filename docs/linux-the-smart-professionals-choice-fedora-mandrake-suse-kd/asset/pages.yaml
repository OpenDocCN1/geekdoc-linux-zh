- img_proc: true
  md: 'pathname specifies the directory where subdirectories should start. It''s common
    to dot to mean the current directory and / to search the entire file system. conditions
    sets the parameters. Many conditions are available. You can use more than one
    in a command. Some useful conditions are shown in Table 9-1.


    # TABLE 9-1 Parameters for Use with the find command


    | Parameter | Means | Example |

    | --- | --- | --- |

    | -print | Display the matches on the screen. | -print |

    | -name filename | Pattern to match filenames. | find . -name "**" |

    | -group name | Files owned by the specified group. | find . -group janet |

    | -user name | Files owned by the user. | find . -user janet |

    | -atime +n|-n | Last access time is more than, less, or exactly n days ago. |
    find . -atime +5 |

    | -ctime +n|-n | Last changed time is more than, less, or exactly n days ago.
    | find . -ctime -5 |

    | -size nc | Files n characters long. | find . -size 100c |

    | -empty | Files that are empty. | |


    For example, the following command searches the entire file system for all files
    beginning with chapter, owned by janet, and last accessed less than 3 days ago.


    find / -name "chapter**" -user janet -atime -3


    The grep command searches the contents of files. It has the general format:

    grep options pattern files


    grep searches the contents of the specified files for the pattern. It outputs
    any matches found. The options specify the operation of grep, such as -c, which
    instructs grep to output a count of matched lines, rather than the entire line,
    and -v, which outputs the lines that don''t match, rather than the lines that
    do. The pattern can be a string of characters or a regular expression—a pattern
    used to match strings, as all words that begin with uppercase A or all lines that
    contain a number. Regular expressions are explained in Appendix A. The grep command
    is explained in more detail in Chapter 7 and in Appendix B.'
