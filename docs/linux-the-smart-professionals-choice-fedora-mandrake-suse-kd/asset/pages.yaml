  md: '# # Newsgroups


    Newsgroups are discussion groups on the Internet provided by Usenet. Each newsgroup
    is devoted to a specific topic, any topic you can think of and many that would
    never occur to you. A newsgroup is analogous to a public message board for a specific
    subject. Anyone can post a message to the newsgroup. Anyone can read all the messages
    posted. Anyone can respond to any message, posting a response.


    Newsgroups are available two ways:


    +   * **Web site**: Many Web sites offer access to newssgroups. Using your browser,
    you read and post messages at the Web site. Some sites offer a subset of newssgroups.
    Others let you read, but not post. Some Web sites change for newsgroup access.


    For example, Google provides access to Usenet Newsgroups. On the Google search
    page, click Groups. One choice on the resulting page is All Usenet Newsgroups.
    You can read the public messages. If you want to post to a newsgroup, you need
    to create a Google account.


    +   * **Newsgroup server**: You can receive newsgroups directly from a newsgroup
    server. Many ISPs provide a newsgroup server, although some provide only a subset
    of available newsgroups. Many colleges and universities provide a newsgroup server.
    Large organizations might provide one. Or, you can independently purchase access
    to a newsgroup server for a monthly fee from a Usenet service, such as www.newshosting.com
    and www.easynet.com.


    To access Usenet newsgroups directly from a server, you will need reader application
    software on your computer. Mozilla mail provides a newsreader. It can be quite
    convenient to receive and post newsgroup messages in the same application that
    handles email messages. The rest of this section describes using Mozilla to read
    newsgroup postings.


    Using Mozilla mail, newsgroup postings arrive in your mail window looking very
    similar to email messages. Before you can read and post messages, two steps are
    required:


    +   1. Create a newsgroup account.


    +   2. Subscribe to newsgroups of interest.


    To create a newsgroup account, click **File** and select **New->Account**. The
    screen shown in Figure 17-1 opens. Check **Newsgroup**. The new account procedure
    requests the needed information—the name of the newsgroup server you want to use.'
  merge: -1
  pgno: 284
- img_proc: true
  md: 'To subscribe to newsgroups, highlight the newsgroup account in the Mozilla
