    Desktop Environment). Both resemble Windows and provide the same features, such
    as windows, icons, menus, etc. The differences between GNOME and KDE are mainly
    in the administrative utilities, the tools for configuring the desktop, and the
    default applications chosen for installation with the desktop. Which desktop you
    use is mainly a matter of personal preference. You may want to try both GNOME
    and KDE before you decide. Using a desktop is in Chapter 6.


    The CLI is a text environment. You type commands for Linux to execute and Linux
    displays text messages in response. When you are working with the CLI, you are
    interacting with a program called a shell. The shell accepts your commands, processes
    them, and passes them into the kernel. Using the command-line interface is discussed
    in detail in Chapter 7.


    Linux can open a desktop at start or boot in a command-line environment. Most
    users prefer Linux to start with a desktop. When the user wants to use the command-line,
    he or she opens a CLI window.'
