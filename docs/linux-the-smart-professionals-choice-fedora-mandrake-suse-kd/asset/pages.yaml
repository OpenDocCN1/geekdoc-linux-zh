    When you type a command and press <Enter>, the command executes.


    The system prompt is configurable. Different distributions of Linux set different
    system prompts during installation. It might be as simple as $, or contain useful
    information. The system prompt in Figure 7-1 provides extra information—the current
    account (janet@localhost) and directory (janet). This prompt is set during the
    installation of Fedora, Mandrake, and other distributions.'
