- img_proc: true
  md: '# CHAPTER 10


    # Applications and Programs


    All information on Linux is organized into files. Programs and applications are
    no exception. Programs are files that contain instructions that Linux follows
    to perform tasks. Applications are one or more programs that perform work. The
    word processing document that you create is stored in a file. The word processing
    application that you use to create and store the file is also stored in a file—a
    program. Or more likely, many programs working together.


    A program can be quite simple, with one instruction that tells Linux to display
    “Hello World” on the screen. An application may be quite complex, such as a word
    processing application. The word processing application programs contain the instructions
    that tell Linux tells Linux to store the document in a file. The instructions
    may be complex, what to do when you click a button or type a word. When you click
    Save, the application tells Linux to store the document in a file. The instructions
    may be complex, with many tasks being performed at once, but the principle is
    the same as the simple program that displays Hello World. The program contains
    instructions that Linux follows.


    This chapter discusses programs and applications. Information on running programs,
    starting applications, and managing software applications is included.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Programs


    Programs are files containing instructions that the computer executes. However,
    computers require instructions in machine language, not in a language that humans
    use. The solution is interpreters and compilers—programs that translate a human-readable
    file into machine language that the computer can execute.


    Programming languages are the languages that humans use to write programs. Programming
    languages differ. Each has a very detailed syntax that allows a compiler to recognize
    its instructions and convert them to machine language. Some popular languages
    for writing programs are C, C++, Java, and Perl.


    The program file that contains the instructions written in a programming language
    is the source code. The source code is converted by a compiler or interpreter
    specific to the language. Interpreters convert the program and execute it. Compilers
    can save the program in machine language so that the program doesn''t have to
    be converted every time it runs. The saved program is a binary file (a file the
    computer understands), called the executable. Some compilers understand more than
    one language.


    Programs in executable files are run by typing the program name. The name includes
    the path. For instance, a program you write and compile in your own directory
    runs when you:


    ```

    /programname

    ```


    Programmers will find an open source C and C++ compiler developed by GNU available
    on most Linux systems. A simple command that compiles a C program is:


    ```

    gcc -o myprogram.c

    ```


    The -o option provides a name for the executable file. The source code is in the
    file myprogram.c. After gcc compiles it, you can type ./myprogram to run the program.
    The compiler has many options. Type man gcc to see more information about using
    the gcc compiler.


    Most Linux systems also include Perl and Python, two open source languages. Many
    system administrators use Perl to write programs to manage their Linux systems.
    Shell scripts are also frequently used by system administrators. Shell scripts,
    discussed in Chapter 19, are programs containing Linux commands.


    Programs can''t execute unless their permissions include x for the account types
    that are to execute them. Even the owner can''t execute a program without permissions.'
