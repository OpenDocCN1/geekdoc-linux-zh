  md: '# The Command-Line Interface on Linux


    The command-line interface (CLI) is a text environment in which you type commands
    for Linux to execute and Linux displays text messages in Linux. In the CLI, you
    use the keyboard, rather than the mouse, to send instructions to Linux when working
    with the CLI, you are interacting with a program called a shell. The shell accepts
    your commands, processes them, and passes them into the kernel, the part of Linux
    where the basic computer work takes place. Linux offers a choice of several shells,
    but this book provides information only for Bash, the most popular Linux.


    Linux can boot directly into a command-line environment. You see a screen that
    is empty, waiting for your input. Rather than seeing a login window, you type
    your account ID and password on a blank command line. In this type of setup, you
    use the CLI exclusively. Users with this type of setup do not generally use the
    desktop at all.


    Often, users want to use the GUI most of the time, but use the CLI for certain
    tasks. These set up Linux to boot to the desktop. Whenever they want to use the
    CLI, they can open a CLI window.


    The desktop is easier to use than the CLI. On the desktop, you select tasks from
    menus. In the CLI, you need to type the command. It''s up to you to know which
    command, how it''s spelled, what arguments and options produce the desired effects,
    and how to interpret the text output. However, the CLI has some advantages that
    make its use attractive in some situations:


    +   - Faster execution: The GUI brings with it a certain amount of overhead, such
    as drawing graphics on the screen, When you type commands directly into the CLI,
    commands execute faster without the GUI.

    - Short command entry: in many cases, typing a command takes less time than navigating
    through menus. Often, file management and other system tasks can be entered more
    quickly at the command line than by using menus. In addition, the CLI allows you
    to chain commands together, resulting in a single output, in a way not possible
    in menus.

    - Fewer resources: The GUI requires disk space, memory, and other computer resources.
    When running Linux on an underpowered computer, running without the GUI might
    be necessary.

    - More functionality: Some commands and options are not available on a menu. They
    can only be executed from the command line.


    Using the command-line interface is discussed in detail in Chapter 7.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Choosing the Interface


    The installation procedure for most Linux distributions provides the opportunity
    for to select the software you want to install. In general, there''s a default
    set of applications, or perhaps different sets of applications, that you can choose
    from. In addition, you probably have the opportunity to include or remove any
    applications from the set installed.


    During Fedora installation, for example, a screen displays that the default set
    of packages, including GNOME, to be installed. The screen gives you the choice
    to install the default set or to customize the software packages to be installed.
    If you select customize, a screen allows you to check and uncheck software packages.
    GNOME is checked by default. You can check KDE in addition to GNOME or instead
    of it. You can uncheck both.


    If you install GNOME or KDE, your system boots to the installed desktop. If you
    installed when both, most distributions provide the opportunity to select which
    desktop when you log in. If neither desktop was installed, your computer will
    enter the command-line environment when you log in.


    If your computer boots into a GUI and you want to boot into the CLI, or vice versa,
    you can change the default boot interface by editing a file called inittab. Linux
    reads this file for instructions when it starts up. You need to locate this file,
    probably in /etc. Chapter 9 tells you how to find files. To change your interface,
    you need to edit the following line in inittab (Chapter 18 discusses editing files):


    ```

    id:ninitdefault:

    ```


    n is a number that causes Linux to boot in the GUI or the CLI; 5 signals the GUI
    and 3 signals the CLI. Change n to the number for your preferred default interface.'
  merge: -1
  pgno: 92
