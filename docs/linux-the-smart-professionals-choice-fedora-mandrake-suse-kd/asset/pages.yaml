  md: '# # Creating the Root Account for Fedora


    Users must have an account to use Linux. When you boot, your first screen will
    ask you to log in to an account. A root account is required. The root user is
    also often called the super user. Other user accounts are universally installed
    as well. Accounts are discussed in detail in Chapter 8.


    In this screen, shown in Figure 4-14, you create the root account. Other user
    accounts are created later.


    ![](img/9a91733a8fb0082106ab0e361495babe_64_0.png)


    Type a password for the root account. Type the same password twice, to be that
    you don''t make a mistake. It is extremely important that you remember this password.
    You can''t make any changes to your Linux system without using the root account.
    Even if you install user accounts later and you can log in to a user account,
    you can''t do many things that need to be done unless you use the root account.


    Choose your password to be as secure as possible, easy to remember but not to
    guess:


    +   - Use at least 8 characters.

    - Use one or more of each of the following: uppercase letters, lowercase letters,
    numerals, and punctuation marks.

    - Don''t use a word that is in the dictionary.

    - Don''t use a name, phone number, or date.'
  merge: -1
