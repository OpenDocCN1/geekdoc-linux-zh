  md: '# # Installing from the Distribution Web Site


    Distribution specific RPMs are provided on most distribution Web sites. Most distributions
    provide utilities you can use to install software from the Web site. Fedora includes
    YUM, a command-line utility used to connect to the Red Hat Web site and download
    install packages. Fedora also includes Update, a utility that provides a graphical
    interface to YUM. Update is installed during Fedora installation and requires
    you to be registered with the Red Hat Web site.


    Update requires a connection to the Internet. It provides an icon on your desktop
    panel, shown on the right, that notifies you of your update status. The blue icon
    with the check on that all the packages on your system are up-date. The icon is
    red, with an exclamation point, there are updates available for your system. A
    tool with status information displays when you move the mouse pointer over the
    icon.


    To use update, right-click the status icon. Select Launch Update. An information
    screen displays. A screen shows the channels you can update. One channel should
    be Fedora Core. Be sure that at least one channel is checked. Click Forward. A
    screen for selecting software that you don''t want to update displays. By default,
    it exempts the kernel. You can add any other software you don''t want to update.


    Update connects to the Red Hat Web site and displays a list of available packages—packages
    that are not installed or that are newer than your currently installed packages.
    Check one or more that you want to install. Or you can check "Select All" to update
    all your packages. Update checks the dependencies for the packages you check to
    install and installs any needed packages. Update displays a message when it is
    finished installing packages.


    SuSE installs and updates packages using YaST, which comes from the distributions.
    Open Main Menu. Select System->Online Update. YaST selects the closest Web site
    for packages for your update. You can Configure Fully Automatic to have YaST find
    and install all updates automatically, daily, with your intervention.


    Mandrake also provides updates from a Web site. Access the Mandrake Control Center
    from main menu->System->Configuration->Configure your computer. Click the Software
    Management icon. Click Updates. A screen displays the list of software available
    for installation, with descriptions.'
