  md: '# Tables and Columns


    OpenOffice Writer does not have a separate menu item for tables. Tables are inserted
    from the Insert menu or from the Insert button (the top button) on the main toolbar
    (on the left side). When you select Table from the insert menu, a window opens
    where you can select the number of rows and columns and the borders. A default
    style is applied. You can change the default table style by clicking Tools and
    selecting Options. Click Text document. Click Table. Change the settings and click
    OK.


    Writer stores formats, configurations of shading, colors, and borders that you
    can apply to a table. Click the Autoformat button to see a list of predefined
    formats that you can select. You can add formats to your autoformat choices. With
    your cursor in the format-ded table, click Format and select Autoformat. Click
    Add. Type a name for the format when prompted.


    You can convert text into table. Highlight the text. Click Tools. Select Text->Table.
    You can convert a table to text, as well.


    When your cursor is in a table, the Format menu includes items for formatting
    tables. If you select Tables, a window opens where you can set spacing and alignment,
    text flow, column widths, borders, and background colors. The menu also includes
    items for-formatting numbers, columns, cells, and rows.


    Tables can be used to control page layout when paragraph styles prove insufficient.
    For instance, a sidehead layout, such as a resume, can be formatted into table
    cells with the borders turned off. Tables can also be useful to position graphics
    on a page.


    You can set up multiple column layouts on a page. The column layout is part of
    the page style. To set up the column layout, click Format and select Column. In
    the window that opens, you can set the number of columns, widths, separators,
    and space between columns. The settings apply to the entire page and to all pages
    with the same page style. If you want different pages with different column layouts,
    you need to define different page styles.


    To have different column layouts on the same page, you must use sections. Insert
    a section from the Insert menu. A window allows you to format the section in columns.
    You can also format the section spacing, background, and footnotes.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Frames


    Frames are boxes into which you can type text or insert graphics or sound files.
    Frames can be moved and formatted. A frame can be anchored to a page, a paragraph,
    or a character. When the page/paragraph/character moves, the anchored frame moves
    with it, with the same orientation, bringing its contents along. A frame can also
    be treated like a character. Frames are useful for laying out your document pages.


    To insert a frame, click Insert and select Frames. The window in Figure 11-6 opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_188_0.png)


    **FIGURE 11-6** framing window.


    The window in Figure 11-6 shows many options for formatting the frame. In the
    Type tab, set the width and height. By default, it''s anchored to a paragraph.
    The horizontal and vertical positions are relative to the anchor object, e.g.,
    paragraph.


    You can change the formatting at any time. Select the frame by clicking its border,
    displaying the frame handles. Drag the frame to move it or drag the handles in
    out to resize it. The Frame toolbar contains icons to arrange and align the frame.
    Or, click Format and select Frames to see the window in Figure 11-6.


    You can link frames together so that the content of one frame flows into another
    frame. With the first frame selected, click the link icon on the toolbar, and
    then click the second frame. A line appears, showing the flow from one frame to
    the next.'
