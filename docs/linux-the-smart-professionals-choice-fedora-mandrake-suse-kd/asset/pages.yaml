  md: '# ## CHAPTER 5


    # # Interacting with Linux


    Linux is an operating system. It transforms a collection of electronic parts into
    a usable tool that takes your instructions and executes them—stores information
    in files, sends data to the printer, displays information on the screen, starts
    application, and performs many other tasks. Linux provides two basic types of
    interface for you to use your computer work: select menu items and click icons
    to accomplish your computer tasks. If you come from a Windows background, you
    are familiar with a GUI. Command-line interface: A text interface in which you
    type commands that Linux executes. If you come from a UNIX background, you are
    familiar with a command-line interface (CLI). Or, if you have worked in DOS or
    at the command-line prompt on a Windows computer, you have some experience with
    a CLI.


    +   - Graphical user interface: A graphical user interface (GUI) in which you
    select menu items and click icons to accomplish your computer tasks. If you come
    from a Windows background, you are familiar with a GUI.


    +   - Command-line interface: A text interface in which you type commands that
    Linux executes. If you come from a UNIX background, you are familiar with a command-line
    interface (CLI). Or, if you have worked in DOS or at the command-line prompt on
    a Windows computer, you have some experience with a CLI.


    When you work on your computer, the interface provides the communication between
    you and the Linux kernel, the part of Linux where the low-level work takes place.
    The kernel communicates directly with the hardware to save files on the hard disk,
    send data streams to the printer, send information out onto the network, and other
    basic tasks. Your instructions are accepted by the interface, processed, and passed
    into the kernel.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# The Graphical User Interface on Linux


    The graphical user interface (GUI) provides graphical images on the screen that
    can be selected using the mouse. The most familiar computer GUI is a windowing
    system. Many windows can coexist on the screen, with independent tasks being performed
    in each window. The user can open, close, move, resize, and otherwise manipulate
    the windows.


    The desktop environment so familiar to Windows users is a windowing system''s
    intended to represent the top of your office desk. When your computer is an empty
    working surface. The tools you need to perform tasks are available on the desktop,
    as icons and menus, tool trays, a clock, a calculator, and other tools. You can
    open whichever application you need on the working surface. In fact, you can open
    as many applications as you need, simultaneously, in different windows.


    Linux offers two popular desktop environments:


    +   * **GNOME**: GNU Network Object Model Environment (GNOME) is open source software,
    a project that''s part of the GNU project. The first public version, GNOME 1.0,
    was released in March 1999.

    * **KDE**: K Desktop Environment (KDE) is free, open source software produced
    by the KDE project. The first public version, KDE 1.0, was released in July 1998.


    Because both emulate a desktop, they are similar in many ways. Both desktops provide
    the following:


    +   * A work surface with icons on it.

    * A bottom panel with icons that start applications or menus.

    * Many applications, such as email software, browsers, file editors, etc.

    * A menu for starting applications, almost identical to the Windows Start menu.

    * Virtual desktops. That is, alternative desktops. You can have one virtual desktop
    set up with the tools for one project, as icons, menus, and open software, and
    another virtual desktop set up with the tools for a different project. Then, you
    can switch between desktops, depending on which project you''re working on. You
    can have several virtual desktops.

    * Configuration tools that enable you to change and control much of the look and
    feel of the desktop

    * Administrative tools for managing your system.'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'The differences between GNOME and KDE are mainly in the administrative utilities,
    the tools for configuring the desktop for installation with the desktop. For example,
    both KDE and GNOME provide a Paint program, but it is not the same Paint program.
    Another example is that KDE ships with a word processor called KWord, whereas
    GNOME ships with AbiWord, but both provide access to OpenOffice.


    Almost all Linux distributions provide GNOME or KDE. Some distributions allow
    you to choose your desktop while installing Linux. Many install, allow you to
    choose your desktop when you log in. Which is mainly a matter of personal preference.
    You may want to try both before you decide.


    Some software packages only run under one desktop, also run under the other. And
    some packages are shipped with both desktops, such as the GIMP. When GNOME and
    KDE are both installed, all packages shipped with both are installed, forming
    a single pool of software packages. The desktop provides access to any package
    that can run with it. For instance, if a GNOME package can also run under KDE,
    the KDE start menu will show the package, even though the package actually shipped
    with GNOME.


    # Other GUIs


    Many other GUIs in addition to KDE and GNOME are available. Linux prioritizes
    flexibility and configurability and gives choices whenever possible. Almost all
    Linux distributions include GNOME and KDE, but many include other GUIs as well.
    For instance, Mandrake includes a desktop called IceWM that is smaller and faster
    than GNOME or KDE.


    Most users install desktops other than the big two for special purposes only,
    such as when installing Linux on a machine with limited resources—a situation
    calling for a GUI that uses less disk space andor memory. Some people choose to
    use a different GUI just because they like it. Your GUI can be quite elaborate
    and individualistic if you spend the time customizing it. In the future, when
    you are a Linux guru, you may want to look into other GUIs.'
  merge: -1
  pgno: 88
