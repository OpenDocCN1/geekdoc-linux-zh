  md: '# Purchasing Linux


    The easiest way to obtain Linux is to purchase it. In fact, the very easiest way
    to obtain Linux is to purchase a computer with Linux already installed. Although
    it''s certainly not as easy to buy a computer with Linux installed as buy one
    with Windows installed, it''s possible. Some companies that sell Linux workstations
    Monarch Computer Systems (www.monarchcomputing.com) and Penguin Computing (www.penguincomputing.com).
    Laptops can also be purchased with Linux installed at these companies and at Emperor
    Linux (www.EmperorLinux.com), which specializes in selling laptops.


    More than, you want to install Linux on a computer you already own—one with no
    operating system or with Windows already installed. To purchase Linux, order it
    from the distribution Web site or from a Web site that distributes Linux CDs.
    You can purchase Linux in two varieties:


    +   * Boxed sets: Some distributions are available in boxed sets, similar to Windows
    software, that can be purchased from the distribution company, usually on the
    company site. The CDs are packaged in a nice box, along with their manuals and
    other documentation. When you purchase a boxed set, you usually receive technical
    support as part of the purchase. Prices begin around $30. The following are some
    Linux distributions in a boxed set:

    * Mandrake (www.mandrakesoft.com/products), starting at $49.90

    * SuSE (www.suse.com/us/private/index.html), starting at $29.95

    * Slackware (store.slackware.com), $39.95


    +   * CDs: You can order just CDs, the same CDs you would have if you downloaded
    the CD image (ISO image) files and copied them onto CD yourself. For a reasonable
    price, you can purchase the CDs and save yourself the trouble. If your Internet
    connection is slow, downloading can be a long and painful process. A 650MB ISO
    image can take 27 hours to download. The Fedora distribution is only available
    this way; a boxed set is not available. Some distributions in boxed sets are also
    available as CDs only. Two places where you can purchase Linux CDs are as:


    +   * www.cheapbytes.com: Sells many Linux distribution CDs. Also sells other
    products.


    +   * www.easyluxcds.com: Offers many different Linux distributions. Also sells
    training CDs.


    22 Getting Ready to Install Linux > Purchasing Linux'
