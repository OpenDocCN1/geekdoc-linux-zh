  md: '# From the Series Editor


    Barry J. Rosenberg


    A few years ago, I found myself in a new job in which I had to master many new
    skills in a very short time. I didn''t have to become an instant expert, but I
    did have to become instantly competent.


    I went to the bookstore but was shocked by how much the publishing world had changed.
    At a place where wit and intelligence had once been celebrated, dummies were now
    venerated. What happened?


    Well, I made a few phone calls, got Aunt Barbara to sew a few costumes, and convinced
    Uncle Ed to let us use the barn as a stage. Oh wait... that was a different problem.
    Actually, I made a few phone calls and got some really talented friends to write
    books that clever people would be ashamed to read. We called the series "Spring
    Into..." because all the good names were already taken.


    With Spring Into..., we feel that we''ve created the perfect series for busy professionals.
    However, there''s the rub—we can''t be sure unless you tell us. Maybe we''re hitting
    the ball out of the park and straight through the uprights, bending it like Beckham,
    and finding nothing but net. On the other hand, maybe we''ve simply spun a twisted
    ball of clichés. You only can tell us. Therefore, if anything—positive or negative—is
    on your mind about these books, please email me at


    barry.rosenberg@awl.com


    I promise not to add you to any email lists, spam you, or perform immoral acts
    with your address.


    Sincerely,

    Barry


