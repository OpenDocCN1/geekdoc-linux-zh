  md: '# Organizing the Desktop


    Your desktop can be organized to suit your individual work style. Quick access
    to applications is provided through icons on the desktop. Application icons on
    the panel provide access when the desktop is covered by open windows. Many useful
    utilities can reside on the panel, as the clock and an icon that minimizes all
    windows at once. Icons for locations, such as Home, or files, such as today, are
    also handy.


    You can drag applications and locations onto the desktop or panel. Find the application
    and highlight it on the menu. Or open the directory. Then use the mouse to drag
    the application or directory to the desired location.


