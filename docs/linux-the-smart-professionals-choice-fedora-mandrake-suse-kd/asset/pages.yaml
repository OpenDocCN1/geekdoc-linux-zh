- img_proc: true
  md: '# Digital Cameras


    Konqueror is the simplest way to move pictures from your camera to your computer.

    Konqueror uses a package called gphoto2, which is usually installed on your Linux
    system, to read pictures from your camera.


    Linux provides support for many digital cameras. To see whether your camera is
    supported, open a terminal window and type:


    ```

    gphoto2 --list-cameras

    ```


    A long list of cameras displays (currently more than 400). If you don''t find
    your camera listed, check the Web site (gphoto.sourceforge.net) for the most recent
    version. If a newer version is available, install it. Installing packages is discussed
    in Chapter 10.


    To move your pictures, connect your USB digital camera to your computer. Instructions
    should be provided with your camera. On many Linux distributions, a camera icon
    appears on your desktop when you connect your camera. If you double-click the
    icon, you see your camera directories and can copy files to your hard disk.


    If the camera icon doesn''t appear, you can navigate to the pictures using Konqueror.

    Open Konqueror with the navigation panel open. If the navigation panel is not
    displayed, click Window and select Show Navigation Panel.


    Type the following into the Location field:


    ```

    camera:/

    ```


    An icon for your digital camera appears in the main window. Click the icon to
    see the folders related to your camera. Navigate to your photo directories. Copy
    the picture files or drag and drop them into a folder in your navigation window
    on the left.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Screen Shots


    You can use software to take a picture of the screen and store it in a graphics
    file. You can use Snapshot for this. From KDE, open Snapshot from the main menu
    in Graphics Utilities. If not, you can select Run from the main menu and type
    Snapshot. Snapshot opens with the window shown in Figure 13-3.


    ![](img/9a91733a8fb0082106ab0e361495babe_214_0.png)


    **Figure 13-3** Snapshot window.


    When Snapshot opens, it takes a picture of the screen, displaying the snapshot
    in the Current Snapshot section. The current snapshot in the figure shows a Linux
    desktop. You can print or save the snapshot. The snapshots are saved in .png format.


    You can change the settings and take another snapshot. You can set a delay, so
    you have time to display some software on the screen that you want in the snapshot.
    You can set it to grab only the window containing the pointer, rather than the
    complete screen. When you have the settings changed, click New Snapshot. Snapshot
    closes its window. Click the window you want to take a picture of. Snapshot reopens
    with the new snapshot previewed.


    If you''re going to edit the screenshot, you can take a screenshot directly in
    GIMP. When GIMP is running, click File and select Acquire->Screen Shot. Check
    "Single Window" or "Whole Screen.". Click OK. The screen image opens in GIMP,
    where you can edit and or save it.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# # Diagramming with Dia


    Dia is designed for diagramming, such as organizational charts or network diagrams.
    Dia creates graphic images with shapes and lines, similar to Visio. You insert
    shapes and connect them with lines.


    Dia may be available on the main menu. In Fedora, it''s available in the graphics
    submenu. If it''s not on your system, you can download it from www.gnome.org/projects/dia.
    Installing packages is discussed in Chapter 10.


    Start Dia from the main menu. A window in Figure 13-4 opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_215_0.png)


    **FIGURE 13-4** Dia toolbox window.


    Figure 13-4 shows two different versions of Dia''s open window. The top section
    of the windows is the same. The bottom section differs. The top section contains
    a basic set of tools for creating drawings. The second row contains basic shapes,
    such as rectangle and circle. The third row contains several styles of lines—straight,
    curved, jagged. The large T in the top row is a tool for inserting text. To its
    left is the move tool, used to move shapes around the drawing.


    To create a drawing, click File and select New. The window in Figure 13-5 opens.


    Insert shapes into your drawing. Click a shape from the window shown in Figure
