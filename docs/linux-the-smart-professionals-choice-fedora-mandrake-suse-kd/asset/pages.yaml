- img_proc: true
  md: '# CHAPTER 6


    # Using Your Desktop


    Linux provides two basic types of interface for you to use when working with your
    computer: GUI (graphical user interface) and CLI (command-line interface). An
    overview of the interface types is provided in Chapter 5. In this chapter, the
    most common type of interface, a GUI called a desktop, is discussed in detail.
    The CLI is discussed in Chapter 7.


    Linux can start without a desktop, but most users prefer to have Linux start with
    a desktop. The installation instructions provided in Chapter 4 result in a desktop
    opening at startup. A desktop interface functions as the top of your desk, supplying
    an empty surface and a set of tools.


    Different distributions provide different desktops, but most provide KDE (K Desktop
    Environment) and/or GNOME (GNU Network Object Model Environment)—the Big Two of
    Linux desktops. The default desktop differs by distribution. For instance, Fedora
    defaults to GNOME, and Mandrake/SU defaults to KDE. However, you can change the
    default once you decide which desktop you prefer.


    KDE and GNOME are open source software, each developed in a project of its own.
    New versions are released independently of Linux releases or the release of any
    specific Linux distribution. As a result, different distributions include different
    KDE and/or GNOME versions. In addition, KDE and GNOME are very configurable. Almost
    everything they can be changed. Consequently, KDE and GNOME don''t look exactly
    the same in different distributions or versions of distributions.


    When using this book, remember that KDE or GNOME may not look exactly like the
    book. Most of the figures in the book are Core 2 (KDE 3.2/GNOME 2.6) or Mandrake
    10 (KDE 3.2/GNOME 2.4). Your version may be older or newer. Because KDE and GNOME
    may not always look and behave exactly as shown in the book, it''s best to consider
    the instructions in this chapter as suggestions, rather than an exact map. It
    provides clues to the most likely places to find configuration tools, but not
    necessarily a detailed route.


    This chapter describes the contents of your desktop and how to use it. Then, if
    you find uncomfortable with the default appearance and behavior of your Linux,
    you find how to change everything.'
