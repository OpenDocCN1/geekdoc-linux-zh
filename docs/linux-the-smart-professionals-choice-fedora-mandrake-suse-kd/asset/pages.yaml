  md: '# What’s Unusual About This Book?


    This book—like the other books in the Spring In ... Series—provides the following
    eccentricities:


    +   - Each topic is explained in a discrete one- or two-page unit called a “chunk”.

    - Each chunk builds on the previous chunks in that chapter.

    - Most chunks contain one or more examples. I learn from examples. I don''t think
    my learning style is unique. I believe I have company in my appreciation for examples.

    - The heading for each chunk appears in the table of contents. The small chunk
    means the chunk heading pinpoints small amounts of information. Finding information
    is so easy.


    Information is packed densely in each chunk. I have toiled to make each word contribute
    to your understanding of Linux. The result is focussed information—information
    you can find when you need it.


    # Who Helped Me Write This Book?


    Linux is the motivation for this book. I am a huge Linux fan. So, I would have
    to say that all the Linux developers in the world helped me write this book. What
    would I have to say if Linux were not the great operating system that it is?


    Of course, having something to say is not sufficient. You must say it clearly
    and accurately. Editors have the difficult job of keeping an author on track toward
    clear and accurate. My editors are extraordinarily good at this part of their
    job. Without my editors, this book would veer much further toward what-in-the-world-does-that-mean
    and that-can''t-be-right.'
