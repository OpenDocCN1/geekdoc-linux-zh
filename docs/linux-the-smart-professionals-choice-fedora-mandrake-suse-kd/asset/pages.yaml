  md: '# CHAPTER 16


    # Multimedia


    multimedia refers to digital sound and video. The possible uses for sound and
    video on computers is boundless—from playing CDs and DVDs communicating over distances
    with sound and video to providing virtual tours to software that speaks and understands
    human languages. This is an application area that is growing and changing rapidly.
    Yesterday something was impossible; today it''s feasible.


    Sound and video are everywhere. Web excursions frequently encounter sound or video
    that you want to explore. Although working with multimedia files is much easier
    than it is used to be, both for Windows and Linux, it can still be problematic
    on occasion. We are more likely to encounter problems in this area than any other.


    This chapter describes common uses of multimedia files. Most of the applications
    discussed in this chapter work easily out of the box. Some are included with Linux
    and some need to be installed. Software for more advanced multimedia applications,
    useful for musicians and moviemakers, is available, such as recorders, sound and
    video editors, and so forth. Advanced applications are not discussed in this chapter.
    Linuxsound.org for information.


    One music problem unique to open source software is the legal status of MP3. MP3
    encoding (writing music into an MP3 file) is a patented procedure. Software that
    can encode in MP3 format must pay license fees, a requirement not compatible with
    open source licensing. Therefore, Linux distributions include applications that
    can encode several types of files, including MP3 files, including MP3 files, with
    the MP3 encoding disabled. Or don''t include any MP3 encoders at all. For instance,
    Fedora includes the X Multimedia System without MP3 capabilities. Using MP3 encoding
    software for personal use, if you don''t sell any MP3s, is believed to be perfectly
    legal. Licensing is applied to the developers of the encoders, not the users.
    You can see more at http://www.mp3licensing.com.


    However, an open source file format, Ogg Vorbis, is available with better sound
    quality for a given compression than MP3. If you''re saving sound files for use
    on your Linux system, Ogg Vorbis is a better choice than MP3.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Configuring Your Sound Card


    In most cases, your sound card was detected and configured during installation.
    It may have been tested, as well, during installation. If you are unsure whether
    your sound card was properly detected and configured, you can test it using the
    configuration procedures for your distribution, usually found on the main menu.


    +   - Fedora: select System Settings-->Soundcard Detection. Fedora probes for
    your sound card and displays a screen showing which sound card detected. The window
    includes a Play sound button.

    - Mandrake: select Configure your computer--Hardware->Hardware. The HardDrake
    application probes for hardware and opens a window showing all the detected hardware
    in the left pane. The sound card is listed under Sound card. Click the entry for
    a sound card to see details in the right pane.

    - SuSE: select System->YaST. Click Hardware in the left pane and Sound in the
    right pane to detect and configure the sound card. Mandrake probes for a sound
    card, then opens a window listing the detected sound card. Buttons are available
    to add a sound card and to configure options.


    If your sound is not listed, you may need to locate and install a driver for your
    sound card. Or your sound card may not be supported. Check the Web site for Linux
    distribution to see whether your card is supported. Perhaps you just need to download
    a driver. Also check the manufacturer’s Web site for information.


    Most distributions provide a mixer application that allows you to configure the
    sound. In Fedora, open the main menu and select Sound & Video->Volume Control.
    The window in Figure 16-1 opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_251_0.png)


    **Figure 16-1** volume control.


    In Mandrake, open the main menu and select Multimedia->Sound->Kmix. In SuSE, in
    the open sound window, click Volume.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Playing Audio CDs


    Most Linux distributions install with a CD player. The player starts automatically
    when a CD is put into the drive. Or, often an icon for a CD player is in your
    system tray on the desktop panel. Or start a CD player from the main menu.


    Two common CD players are:


    +   - **CD Player:** A simple CD player, often the default CD player in GNOME.
    It opens in the following window.


    ![](img/9a91733a8fb0082106ab0e361495babe_252_0.png)


    The player includes the usual play/pause, stop, rewind, fast forward, previous
    track, next track, and eject buttons. When a CD is playing, the name of the CD''s
    playing is usually displayed.


    +   - KsCD: The KDE simple CD Player is usually the default CD player on KDE desktops.
    It opens in the following window.


    ![](img/9a91733a8fb0082106ab0e361495babe_252_1.png)


    In addition to the volume slider and the stop, play/pause and other usual buttons,
    the Random button tells KsCD to play the tracks on the CD in random order. The
    Loop button creates a loop that plays the CD repeatedly.


    The Extras button lets you select Configure KsCD. A window opens where you can
    select colors. You can check "Show icon in the system tray." You can specify "Autoplay
    when CD inserted," "Eject CD when finished playing," and/or "Stop playing CD on
    Exit." The latter is important because the CD keeps playing until "Stopped," even
    if the CD player window is closed.'
