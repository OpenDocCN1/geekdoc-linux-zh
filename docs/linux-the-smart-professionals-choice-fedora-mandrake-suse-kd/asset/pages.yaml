  md: '# # Tracking Changes


    If one or more people are working with you to produce a document, you can mark
    all the changes you make in the document so your collaborator(s) can see what
    you have done. You can also add notes and comments to the document.


    To mark changes, click Edit and select Changes->Record. Record starts marking
    changes, but whether you see the revision marks depends on whether Show is checked.
    Click Edit and select Changes->Show to toggle on or off.


    You can change the way revisions are marked. Click Tools. Select Options. Click
    the plus sign (+) beside Text Documents. Click Changes. The window in Figure 11-9
    opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_193_0.png)


    Figure 11-9 Changes options.


    You can change the way insertions or deletions are marked. Notice that Color is
    By author. This means that each author''s revisions are in a different color.


    You can add notes and/comments. A comment is associated with a specific revision;
    a note is added anywhere in the document. To add a comment, click on a revision
    mark, click Edit, and select Changes->Comment. A window opens where you can type
    a comment. Click OK. The comment displays in a tool tip when the mouse pointer
    hovers over


    To add a note, click on any text in the document. Click Insert. Select Note. Type
    the note if desired. Click OK. The location of the note is marked in yellow. If
    you move the mouse pointer over the yellow marker, the note appears in a tool
    tip.'
