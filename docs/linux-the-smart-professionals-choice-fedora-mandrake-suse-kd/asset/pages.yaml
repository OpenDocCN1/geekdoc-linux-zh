  md: '# Document File Formats


    OpenOffice Writer uses XML to store its documents. XML is a widely used, standard
    format for storing information in an application-independent format. An OpenOffice
    Writer document is stored in a file with an .osw extension. The file, however,
    is not a single file; it is a zip archive containing several files required for
    managing an XML document. An .sxw file cannot be opened in another word processor.


    You can save your document as other types of:


    +   * Microsoft Word: All versions of Word back to Word 6.0, with a .doc extension.

    * RTF: A format that most word processing applications understand, used for transferring
    programs between applications. If you are unsure what application might need to
    open the document, you can use RTF. The file is saved with an .rtf extension.

    * StarOffice: Word processing application published by Sun. OpenOffice from StarOffice.
    File is saved with an .sdw extension.

    * Text: File that contains only the content, without any formatting. File is given
    a .txt extension.

    * HTML: Document is saved as a file containing HTML code, with a .html extension.


    If you routinely exchange documents with Word users, you can set Writer to save
    documents in Word format by default. Click Tools. Select Options. Click the plus
    (+) by Load/Save. Click General. In the Always save as drop-down list, select
    the file format you prefer.


    Writer can read files formatted as Word documents. When you open the file, Writer
    recognizes it as a Word document and opens it correctly. Although Writer can open
    the document, some advanced or complex elements may not be converted correctly.
    The simpler the document is, the more likely it is to convert without problem.
    Some elements that may be converted incorrectly and require manual correction
    are AutoShapes, revision marks, OLE objects, form fields, indexes, tables, multicolumn
    formatting, hyperlinks, bookmarks, Microsoft Art graphics, and animated characters/text.


    You can save your documents in PDF format. Click File. Select Export as PDF.'
  merge: -1
