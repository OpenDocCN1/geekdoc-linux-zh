    Several dictionaries are installed with Writer, depending on the settings chosen
    during installation. To add dictionaries for other languages, click File and select
    Autopilot. Choose Install new dictionaries. A list of available dictionaries displays.
    Select the language you want to display installation instructions. You can also
    create and use custom dictionaries.


    OpenOffice provides custom dictionaries that you can edit. You can also create
    new dictionaries of your own. A custom dictionary is useful for specific projects
    that you don''t want to add to your main dictionary. To edit or create dictionaries,
