- img_proc: true
  md: "# If Statements\n\nIf statements test conditions and execute commands when\
    \ the condition is true. The if statement has the following general format:\n\n\
    ```\nif [ condition ]\n  then\n    commands\nelif [ condition ]\n  then\n    commands\n\
    else\n  commands\nfi\n```\n\nThe if statements begins with if and ends with fi\
    \ (if spelled backward). All three parts are not required. Only the if section\
    \ is required. The elif (elseif) and the else sections are optional. Also, notice\
    \ that the if section and the elif section start with then, but the else section\
    \ does not. You can use more than one elif section, but only one if and else section\
    \ is allowed. An if statement can be as simple as:\n\n```\nif [ $x -eq 1 ]\n \
    \ then\n    echo Hello\nfi\n```\n\nA more complex statement is:\n\n```\nif [ $day\
    \ = \"Sunday\" -o $day = \"Sunday\" ]\n  then\n    echo Sleep in\nelif [ $day\
    \ = \"Monday\" ]\n  then\n    echo Call in sick\nelse\n  echo Go to work\nfi\n\
    ```\n\nYou can nest if statements inside of if statements, as follows:\n\n```\n\
    if [ $city = \"Miami\" ]\n  then\n    if [ $name = \"John\" ]\n      then\n  \
    \      echo Hello John in Miami\n    else\n      echo Hello friend in Miami\n\
    \  fi\nfi\n```"
  merge: -1
  pgno: 307
- img_proc: true
  md: "# # Case Statements\n\nCase statements allow you to test a string using a series\
    \ of patterns, executing only the commands for the matching pattern. The general\
    \ format of the case statement is:\n\n```\ncase string in\n  pattern_1)\n    commands\n\
    \    ;\n  pattern_2)\n    commands\n    ;\n  pattern_3)\n    commands\n    ;\n\
    \  ...\nesac\n```\n\nThe patterns you can use are:\n\n+   * Matches any string\
    \ of characters.\n* ? Matches any single character.\n* [...] Matches any character\
    \ or a range of characters in the brackets. A range is specified with a hyphen\
    \ (e.g. A-Z or 1-4).\n* | Matches the pattern on either side of the | (e.g., John|Sam).\n\
    \nAn example case statement is:\n\n```\n#!/bin/bash\nname=John\ncase $name in\n\
    \  John)\n    echo Welcome $name\n    ;\n  Sam)\n    echo Hello $name\n    ;\n\
    \  *)\n    echo You're not invited\n    ;\nesac\n```\n\nThe * is used for the\
    \ last case, to handle all the conditions not listed specifically in previous\
    \ sections of the case statement. Any string that doesn't contain John or Sam's\
    \ name matches the last case."
  merge: -1
  pgno: 308
- img_proc: true
  md: "# For Loops\n\nA loop repeats commands once for each item in a list of arguments.\
    \ The general format of a for loop is:\n\n```\nfor index in list\n  commands\n\
    ```\n\nThe index is a variable name. It takes on a value from the list with each\
    \ iteration of the loop. The list is a list of arguments through which for loops.\
    \ A simple for for loop is:\n\n```\nfor name in John Sam Paul\n  echo $name\n\
    ```\n\nItems in the list can be separated by a space or by the end of a line.\n\
    \nYou can provide the for loop with a list of arguments by executing a command.\
    \ For instance, the following script processes the output of the date command.\n\
    \n```\n#!/bin/bash\n# Script name: splitdate - outputs parts of the date in a\
