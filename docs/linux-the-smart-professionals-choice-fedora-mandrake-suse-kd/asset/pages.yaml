- img_proc: true
  md: '# File Permissions


    Because Linux is a multi-user system, directories and files need to be protected
    from unauthorized use. Each directory and file has associated permissions, settings
    that determine who can access the file and what they can do with it.


    Permissions to the file are given to three types of user accounts:


    +   - **Owner**: The account that owns the file

    - **Group**: Members of a group that owns the file

    - **All users**: All accounts on the system


    Users can be given permission to do one or more of three things to the file:


    +   - **Read**: Look at the contents of the file

    - **Write**: Save the file to the hard disk

    - **Execute**: Run the file or enter the directory


    The permissions can be given in any combination. For instance, file1 might have
    permissions as follows:


    +   - **Owner**: Read, write, execute

    - **Group**: Read, execute

    - **All users**: Read


    The owner can look at, edit, save, and run the file. Members of the group can
    only look at and run the file, but they cannot change it. Everyone on the system
    can look at the contents of the file. Remember that a directory is simply a file,
    so directories can be given the type of permissions as a file.


    File permissions are often displayed in a shorthand format as follows:


    ```

    rwx------

    ```


    The r, w, and x stand for read, write, and execute, as described earlier in this
    section. The 9 characters shown represent three groups of three: `rwx`, `r--`,
    and `--`. The first group displays the permissions for the owner, the second is
    the permissions for the group, and the third is the permissions for everyone.
    Thus, in this case, the owner can read, write, and execute the file, but the group
    and all users can only read the file, not write/execute it. Only the owner or
    the root account can change file permissions.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Changing Permissions


    You can change the permissions for a file using the Properties screen shown in
    Figure 9-2. To open the permission screen, right-click the file to be changed
    and select Properties. Then, click the Permissions tab.


    The screen shows the permissions for each of the three types of accounts. If you
    click the button for a particular account type, you see three choices: Forbidden,
    Can Read, and Can Read & Write. If you want to give execute permission to the
    file, check the Execute box. When the settings are right, click OK.


    On the command line, the chmod command is used to change the permissions. The
    format is one of the following:


    ```

    chmod accounttypes+permissions filename

    chmod accounttypes-permissions filename

    chmod accounttypes=permissions filename

    ```


    The three accounts are indicated by letters: u for user (owner), g for group,
    o for others, and a for all account types. The three permissions are r, w, and
    x, as discussed previously. The three symbols that sign permission are + (plus)
    to add permissions, - (minus) to remove permissions, and = (equal) to sign new
    permissions. Thus, one might be:


    ```

    chmod g+w file

    ```


    The command gives write permission to the group for a file named file. It doesn''t
    change any other permissions for the file. If the group already had read permission,
    it still has read permission. Another command might be:


    ```

    chmod g-w file

    ```


    The command removes write permission to the group for the file without changing
    any other permissions for the file. Another command might be:


    ```

    chmod o=x file

    ```


    The command gives execute permission to group and all accounts on the file. Group
    and all other accounts are not given read or write permissions. Because u was
    not specified in this command, the permissions for the owner are not changed.
    You can set all permissions at once using:


    ```

    chmod a=r file2

    ```


    The means all users—all three account types. All user accounts on the system can
    now look at the contents of file2. However, they can''t write or execute it.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Managing Owners and Groups


    Permissions to your files are given to the owner, the group, or all accounts.
    You may want to transfer a file you created to another owner. More often, you
    want to change the group for a file as a way of allowing specific users to access
    it.


    On many systems, when a file is created, the group for the file is the same name
    as the owner who created it. For instance, a file created by jane may belong to
    the janet group. If you give permissions on the file to other accounts by adding
    them to the janet group, you allow them access to all files you create. A better
    solution is to create a new group, add the members you want to be able to access
    the file to the new group, and change the group for the file. Then, if you give
    write permission to the group for the file, all group members (but not all accounts)
    have write permission.


    On some systems, the group for a user account is one general group that includes
    all accounts. You need to set your permissions on your file with that in mind.
    To limit the access to your file, you can change the group.


    You can change the owner or group of a file at the command line using one of the
    following commands that change the owner and group of file2:


    ```

    chown salesmanager file2    (changes owner to account salesmanager)

    chgrp file2                 (changes group to sales)

    ```


    If you are in the Konqueror manager, you can use the Run Command in the Tools
    menu to quickly execute a single command. Or open a terminal window with Tools->Open
    Terminal.


    A group must exist before you can give ownership of a file. Creating groups is
    done using the Users and Groups utility discussed in Chapter 8. To create a group
    on Fedora, select main menu->System Settings->Users and Groups to get the window
    in Figure 8-2. Click Add Group. Type the new group name in the dialog box. Click
    OK. Or create a group, more quickly, at the command line by typing:


    ```

    groupadd username

    ```


    To add an account to a group, in the Users and Groups window, highlight an account
    and click the group by a group name to add the account to the group. Or use the
    command-line command:


    ```

    usermod -G groupname username (notice the uppercase G)

    ```


    The account you use to change owners and groups must have the power to change
    them. If you see a message like "Operation not permitted," the account can''t
    make the change you entered. Changing to the root account (as root) solves the
    problem.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# File Types


    Although Linux handles other types of files (as block device), this chapter only
    discusses ordinary, also called normal, files and symbolic links. Ordinary files
    include data, configuration, text, graphics, directories, and other files. Links
    are filenames that only point to another file. Ordinary files are categorized
    by the information they contain. Linux desktops and applications recognize file
    types by the filename extension, as Windows recognizes .doc extensions as MS Word
    files.


    File extensions are associated with an application. When you double-click a file,
    the file extension determines which application the file is opened in. A document
    with an .sxw extension is opened in OpenOffice. New applications usually create
    associations for the file extensions during installation.


    You can change the associations manually if necessary. To add or edit an association,
    highlight the file with the extension, right-click, and select Edit File Type
    to see the screen on the right. The top pane shows .HTML, .htm, and .HT should
    be opened using Konqueror. Click Add to add an extension using a pattern, such
    as *.abcdef. Linux extensions can be any number of characters, not just three.


    More than one application can be listed in the lower pane. For instance, use Mozilla
    before Konqueror. The file is opened in Mozilla if possible; if not, the file
    opens in Konqueror. Clicking the Add button displays a list of applications to
    select.


    Whereas desktops and applications recognize extensions, Linux doesn''t. It looks
    inside a file to determine file type. You can use the file command at the command
    line to select the actual file type, regardless of the extension, as follows:


    # file testfile


    testfile: ASCII text


    The file command has a very large list of file types it recognizes. In general,
    files with “text” in the file type, such as “c program text,” can be looked at
    and edited with Linux tools. Data is a file type used when Linux can''t recognize
    a more specific type.


    ![](img/9a91733a8fb0082106ab0e361495babe_156_0.png)'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# # Finding Files


    Linux has excellent file-finding utilities for both the desktop and the command
    line. On the KDE desktop, open the main menu and select Files. Or in Konqueror,
    click Tools and select Find Files. The screen in Figure 9-3 opens with blank fields.


    ![](img/9a91733a8fb0082106ab0e361495babe_157_0.png)


    Figure 9-3 File-utility.


    * Typing *test* for the filename finds all files with test anywhere in the name,
    * is a wildcard meaning any string of characters. Typing or browsing to /home/jane
    starts the search in the jane directory. “Include subdirectories” is checked.
    When you click the Find button, files display in the bottom pane. Four directories
    and four files are found. Two of the files and two of the others are in the subdirectory.


    Clicking the Contents tab displays a screen where you can select the type of file
    and the file contents to search for, such as a string like “Hello World.” Clicking
    the Properties tab allows you to search by last access date, file size, owner
    or group. When you click Find, the parameters set in all tabs are used in the
    search. GNOME has a search utility with very similar functionality, also accessible
    from the main menu.


    From the command line, you can use the find command to find files by filename
    or properties and the grep command to find files by content. The find command
    syntax is:


    find path conditions`'
