    also allows you to have multiple desktops, each configured differently. You can
    have one desktop that you use for your financial work and another configured for
    use on your art projects. The desktops can have different applications available,
    with any other configuration changes that are appropriate for the desktop functionality.


    Multiple desktops are also called virtual desktops. The section of the panel related
    to virtual desktops is shown in Figure 6-17.


