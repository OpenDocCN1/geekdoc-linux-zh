  md: '# Summary


    Programs and applications on Linux are organized into files. Programs are files
    that contain instructions that Linux follows to perform tasks. Applications are
    one or more programs that perform work. A program can be quite simple or quite
    complicated, but the principle is the same. The program contains instructions
    that Linux follows.


    You can write programs or use programs and applications developed by others. Different
    Linux distributions include different software, hundreds or thousands of applications.
    The distribution defines a default set of software to install. You can modify
    the set during installation, installing more, fewer, or different applications.
    Or, you can download and install applications after Linux is installed to add
    new software or to update the software you''re using.


    This chapter explains:


    +   * What programs are and how to run them

    * How to use and add Linux commands

    * The formats in which applications are available

    * How to install applications from CDs and from the application Web site

    * How to find application packages on the Internet

    * How to use RPM

    * How to install applications from source code


    The next chapter discusses the most used application—word processing. OpenOffice,
    an office suite similar to Microsoft Office, is introduced. Instructions for creating
    and editing documents and using advanced word processing features are provided.'
  merge: -1
