  md: '# CHAPTER 1


    # Understanding Open Source Software


    If this is your first venture into open source software, you need to understand
    open source beliefs and practices. If you come from a background in Windows and/or
    other commercial, proprietary software, you''ll find that the open source viewpoint
    is quite different from the viewpoint of proprietary software vendors. Open source
    software is developed and distributed differently. Your procedures for obtaining
    the software and its updates are very different. Your methods of obtaining support
    for your use of the software are different, as well. This chapter explains the
    philosophy and practices of the open source community of software developers and
    users.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# # Open Source Software


    Open source means exactly what it says—the source of the software must be open,
    available to everyone, not secret. The source is the program code that produces
    the functionality of the software (that is, the underlying program code that makes
    a spell checker checking and an address book store addresses). The source code
    is written in a known programming language, such as C or Java. Many people know
    this language. Therefore, anyone who sees the source knows how the program does
    its job.


    Open source software provides the source with the software. The source is considered
    to be free, as free speech. Anyone is free to use the program for any purpose,
    to modify the program, or redistribute the program. No permission required.


    The alternative to open source software is proprietary software—that is exclusively
    owned by one or more individuals or by a company. The owner''s permission is required
    for any use of the software and charging. Many commercial software companies make
    a profit by owning the software and charging customers to use it. For these companies,
    the software is the company''s product. The source code is the company''s trade
    secret, the basis for its hopes of profit, an asset to be guarded. Much of the
    commercial software you are familiar with, such as Windows, MS Office, and Photoshop,
    is proprietary software. The company provides the software to those who pay for
    it in a format (binary code) that hides the source code. Users can see what the
    software does (e.g., finds incorrect spelling) but don''t know how the software
    accomplishes the task.


    Most open source software development is organized as a project. Volunteer developers,
    often located throughout the world, coordinate their work via the Internet. Open
    source projects communicate with their users, and the via a project Web site where
    the software is available for download. The Web site also provides information
    about the software and its developers, documentation for the software, a bug database
    and procedures for entering bug reports into the database, mailing lists and forums
    where users can discuss the software, and other related information.


    Open source software development is open. That is, the software source is posted
    on the Web as it is being developed, available for any interested person to use
    or to work on. The users are a diverse group, with varying uses for the software
    and levels of skill in using the software, who have direct access to the developers
    through the Web. The result is quick identification of bugs and problems, feedback
    on useful and not-so-useful features, bug fixes provided by users, and suggestions
    for new features and/or implementation.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Open source proponents believe software produced by this process—openly publicly,
    with a great deal of testing, input, review, criticism, and discussion—is higher
    quality. The fact that developers are motivated by interest, rather than by employment
    considerations, is believed to increase quality as well. Some open source software
    has certainly succeeded well. Apache is probably the best known success story,
    a classic open source project that has succeeded quite well. Apache has approximately
    67% of the Web server market. Linux as open source is discussed later in this
    chapter.


    Commercial software companies in the open source world won''t depend on proprietary
    software for profit. Customers are charged for enhancements to the software or
    services related to the software, as shown in the following examples:


    +   - Developing and developing bundles of software combined to work well together

    - Developing versions of the software with simple installation procedures

    - Providing technical support for users of the software

    - Providing consulting and programming expertise for the software

    - Providing modified versions of the software for special purposes


    The only restriction is that the open source software may not be converted into
    proprietary software for any purpose. The source must remain open.


    Users of commercial proprietary software expect a phone number they can call when
    they have problems. Users of commercial open source software can expect the same.
    This doesn''t mean there is no help for users who download and install open source
    software themselves. Quite the contrary. Open source users support each other.
    Information is available from many sources, not just one. Mailing lists and forums
    for open source software around the Web where hundreds of knowledgeable users,
    often including the developers, willingly help newbies. When you ask a question
    on a mailing list, the answer shows up in your mailbox within seconds.


    Open source software releases are irregular and arbitrary. A new software version
    is released when the developers believe it is ready, often with little prior notice.
    A new version can be released in response to a bug or a security problem within
    a day. Users of open source software must keep themselves informed. Otherwise,
    a new version that solves an annoying problem or the identification of a security
    problem may go unnoticed.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# # Open Source License


    Software falls under copyright law. Written program code is copyrighted, by default,
    automatically. If anyone uses the code without permission from the owner of the
    copy-right, it''s theft. The copyright owner can, of course, allow anyone to use
    the software, setting any conditions the owner chooses. Software licenses provide
    the conditions under which the copyright owner allows you to use the software.\.


    If you have ever purchased or installed software, you have probably encountered
    a license. Commercial usage usually includes a written license. If you download
    software, there is usually a screen that requires you to click your agreement
    to the license before you can actually install/use the software. Such a license
    is called the end user license agreement, not so affectionately known as the EULA.


    When you read a EULA, you discover that you haven''t actually purchased the software.
    You have, instead, purchased a license to use the software. The EULA specifies
    the conditions, or terms, under which you can use the software. The EULA may include
    some restrictive conditions, such as limiting the software to installation on
    one computer. It''s wise to read the EULA so you know your legal rights and responsibilities.
    The EULA is generally not open for negotiation.


    Open source software also comes with a license. The most common open source license
    is the General Public License (GPL). The GPL is quite unrestricted. It states
    that you can use the software for any purpose. You can change it if you want.
    You can redistribute it if you want. However, you cannot redistribute it as proprietary
    software. Anyone receiving the software from you has the right to and has the
    right to change or redistribute it.


    The GPL was developed by GNU (discussed later in this chapter). It''s often referred
    to as copyleft, developed by GNU as a general method for making a program free
    software and requiring all modified and extended versions of the program to be
    free software as well. You can see the text of the GPL, as well as other information
    regarding its use, at www.gnu.org/licenses/licenses.html?TOCGPL.


    Other open source software licenses are available, such as a license for documentation.
    You can see information about open source licenses at www.gnu.org/licenses/licenses.html.'
  merge: -1
