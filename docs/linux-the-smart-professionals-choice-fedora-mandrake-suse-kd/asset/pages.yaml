  md: 'Changes can be accepted or rejected. When a change is accepted, the revision
    mark is removed from the document, the change history can no longer be recovered.
    When a change is rejected, it''s removed from the document. That is, inserted
    text is removed or removed text is put back in. Click Edit. Select Changes->Accept
    or Reject. The window in Figure 11-10.


    ![](img/9a91733a8fb0082106ab0e361495babe_194_0.png)


    FIGURE 11-10 Accept or Reject windows.


    You can accept or reject a single change or all changes at once. Click the Filters
    tab to display only specific changes, such as changes by an author or by date.


    To stop recording changes, toggle record by selecting Edit->Changes->Record again.


    You can merge two documents into one document, with the changes from both documents
    marked in the merged document. Click Edit and select Changes->Merge Document.
    Select the document to merge. The changes in the selected document are merged
    into the current open document. You can merge additional documents if needed.
    Select Changes->Merge Document and select a document as many times as necessary,
    until all documents, with their changes, are merged into the current document.


    If you have two documents that are two versions of the same content saved without
    tracking the changes, you can compare the documents to find the changes between
    the documents. Click Edit and select Compare Document. Select a document to compare
    to the current document. The window in Figure 11-10 opens, showing all inserts
    and deletions. In addition, the revision marks are added to the current document,
    showing insertions and deletions. The open document now looks as if it edited
    with track changes to produce the document it was compared to. The changes can
    now be accepted or rejected individually or all at once.'
