  md: "# While Loops and Until Loops\n\nThe commands in a while loop continue to execute\
    \ as long as the condition is true. The general format of a while loop is:\n\n\
    ```\nwhile [ condition ]\ndo  commands\ndone\n```\n\nThe while loop first tests\
    \ the condition. If it's true, the commands are executed. When the script reaches\
    \ done, it returns to the while line and tests the condition again. If the condition's\
    \ still true, it executes the commands again. If the condition is not true, it\
    \ proceeds to the command following the while loop.\n\nThe simple shell script\
    \ below executes the while loop four times:\n\n```\n#!/bin/bash\n# Script name:\
    \ numbers - outputs a list of numbers\nn=0\nwhile [ $n -lt 3 ]\ndo\n  echo $n\n\
    \  let n=$n+1\necho After loop\n```\n\nThe program execution is shown below:\n\
    \n```\n/numbers\n0\n1\n2\nAfter loop\n```\n\nThe until loop is very similar, except\
    \ it stops looping when the condition is true. To get the above output, you would\
    \ use the following until loop, changing -lt to -eq:\n\n```\nn=0\nuntil [ $n -eq\
    \ 3 ]\ndo\n  echo $n\n  let n=$n+1\necho After loop\n```"
  merge: -1
