  md: '# # Autocorrection


    As you enter or edit content, OpenOffice Writer assists you by changing text that
    it identifies as incorrect. You may find some or all of its actions annoying.
    You can change the settings to store or modify the objectionable help. Click Tools
    and select Autocorrect. A window opens with the following tabs:


    +   - **Options:** A list of corrections you can check and uncheck, such as "Capitalize
    the first letter of every sentence."

    - **Replace:** A table of character strings and words or symbols that replace
    them when they occur. For instance, if you type hte, Writer changes it to. You
    can add your favorite errors to the table. Just type the error and its correction
    in the top boxes and click New. You can remove a correction by highlighting it
    and clicking Delete.

    - **Exceptions:** Lists of exceptions for two of Writer''s autocorrection features.
    The two features sometimes correct unfortunate errors, but other times create
    errors. You can turn the corrections completely off in the Options tab. Or, you
    can modify the corrections using the Exceptions tab.


    +   - **Uppercase first letter of sentence:** The end of the sentence is identified
    by the period. However, this can result in the first letter after an abbreviation
    changed to uppercase, not what you want. Writer maintains a list of abbreviations.
    Letters after the abbreviations are not changed to uppercase. You can add abbreviations
    to this list. And remove them.

    - **Lowercase second letter:** When Writer sees the first two characters of a
    word in uppercase, it changes the second letter to lowercase, assuming that it
    is an error. Sometimes, the two uppercase letters are intended. Writer maintains
    a list of words that begin with two uppercase letters, such as CDs and PCs. The
    second letters are not changed to lowercase for these words. You can add words
    to this list. And remove them.


    +   - **Word Completion:** A list of frequently used words. When you type three
    letters that match one of these words, Writer completes the word for you. You
    can disable the feature in the Word Completion tab. Or, you can add words to the
    list. Or remove words.'
  merge: -1
