    Check Email account. Newsgroups are discussed later in this chapter.

    The next screen asks you for your name and email address. The name you enter will
    be displayed to the recipient when you send them an email. Your email address
    is supplied by your ISP, such as janet@ispname.com.


    The information requested by the next screen is shown in Figure 17-2.


    ![](img/9a91733a8fb0082106ab0e361495babe_269_1.png)


