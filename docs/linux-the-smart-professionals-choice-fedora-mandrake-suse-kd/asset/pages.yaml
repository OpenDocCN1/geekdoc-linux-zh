- img_proc: true
  md: '# Managing Application Software


    At some point in your Linux use, you are likely to need to add to or update the
    application software on your system. You may not have installed all the software
    needed during installation. Or a new version of your current software may be released
    with new features that you really need. Or you want to perform a task that your
    current software cannot seem to handle and you have located, by googling and/or
    consulting with peers, a package that you believe can handle the task.


    Application software is available in packages that provide the application program
    and any files and programs that are needed to install it. Applications can be
    installed from source code or from package files created specifically for Linux
    installation.


    +   **RPM files:** Files created to use with the RPM (Red Hat Package Manager)
    utility that installs, updates, and removes software. If it''s possible to install
    from an RPM, it''s preferable to do so. It''s much easier than installing from
    source.

    **Source code:** Text files containing source code. You compile and install the
    software yourself. Sometimes it''s necessary to install from source, either because
    no RPM exists for the software you''re installing or because you need to install
    the software with a different configuration than the RPM provides.


    > NOTE

    Debian developed DEB files, similar in function to RPM files. If you are using
    Debian, look into DEB files and the apt software that installs them.


    You can install software from:


    +   **Installation CD:** Most distributions provide a utility that shows what''s
    available on the CDs and installs a requested package. Only install from very
    recent CDs because packages are updated often. CDs may not contain current versions.

    **Distribution Web site:** The Web site for your Linux distribution provides many
    packages. Most distributions use utilities that check the Web site for available
    packages and download and install the packages.

    **Internet:** More specialized or unusual software may not be available on the
    distribution Web site. The version may be the most recent. In this case, you may
    need to find the software on the Internet, download it, and install it. You may
    find it on a Web site that archives RPMs or on the Web site for the specific software,
    such as its project Web site.


    Many software packages access and use other software; the package depends on the
    other being present. The packages needed are "dependencies". The RPM utility and
    the desktop utilities inform you of any unmet dependencies when you are installing
    software, sometimes installing the needed software automatically.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Installing from the Distribution CDs


    Most distributions include several CDs, containing many packages that can be installed.
    A default set of packages is installed during installation. You can modify the
    list of packages to install during installation. However, this process is not
    restrictive. You can install packages from the distribution CDs later needed.


    Most distributions include a GUI application for installing software from the
    CDs. In Fedora, open the menu and select System->Install/Remove Packages to see
    the window in Figure 10-1.


    ![](img/9a91733a8fb0082106ab0e361495babe_169_0.png)


    **Figure 10-1** Package manager.


    The screen in Figure 10-1 lists groups of packages that you can check to install.
    When a group is checked, the Details link provides a list of individual packages
    that can be checked for installation. Uncheck any currently checked packages to
    remove them.


    When the package(s) you want to install are checked, click Update. A window will
    tell you how many packages are to be installed or removed and the disk space required.
    Click Continue. A progress bar monitors the update. You are prompted to insert
    CDs when needed.


    Mandandra and SuSE have similar utilities. In Mandrake, access the Mandrake Control
    Center from main menu->System->Configuration->Configure your computer. Click the
    Software Management icon. In SuSE, use YaST to install software from the CDs.'
