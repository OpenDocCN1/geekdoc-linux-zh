  md: '# Creating Directories, Files, and Links


    You can create new directories, files, and links from your desktop using Konquerer.
    In\Konqueror, navigate to the directory that is to house your new item. Click
    Edit and select

    Create New. A menu of items you can create is opened, including:


    +   - Directory: The directory name.

    - HTML File: Type the filename. The new file contains skeleton HTML code.

    - Text File: Type the filename.

    - Link to Application: Similar to a Windows shortcut. Clicking the link starts
    the

    application. In the first screen displayed, type name of the link. Then select
    the

    Execute tab. In the execute screen, type the command to start the application
    or

    click the Browse button to select application.

    - Link to Location: Shortcut to a location. When you click the link, the location

    opens in Konqueror. In the screen displayed, type a filename for the link. Type
    the

    URL to the location or click the Browse button to navigate to the URL.


    Names can be up to 255 characters. Linux accepts almost any character in a filename,\some
    characters have a special meaning to the Linux shell and can complicate your life
    when

    used in a filename. It''s best to use only letters, numbers, underscores, hyphens,
    and dots

    in filenames. Upper- and lowercase letters are not the same (file1 is not File1!).
    Filenames

    don''t need to have an extension, although many applications use specific extensions.

    Technically, the dot is just another character, so you could name a file something
    like

    file.test_mine. System file names have those that begin with a dot, so don''t
    use a dot

    to begin filenames for other types of files.


    You can create a directory in any directory where you have write permission using
    the

    command line mkdir command:


    ```

    mkdir path/dirname

    ```


    If your path includes directories that don''t yet exist, you can create them in
    one com-

    and with the -p option, as follows:


    ```

    mkdir -p /usr/local/newparent/mydir

    ```


    If newparent doesn''t exist, it''s created, then mydir is created inside newparent.


    Files can be created by applications, such as a word processor. File editors create
    and edit

    plain text files, as Notepad does on Windows. Links can be created at the command
    line

    using the ln command (see Appendix A).'
