  md: '# CHAPTER 15

    The Internet


    An Internet connection is standard for most computers today. I believe I can assume
    that you have experience using the Internet, probably with Microsoft Internet
    Explorer. Your Linux system can access the Internet. The process is basically
    the same:


    +   1. Set up a connection to the Internet. You may have set up your connection
    during installation. If not, you can set it up now.

    2. Access the Internet using a browser.


    If you are using a computer at work, you are probably connected to your company
    network. The first step above is handled by your company. However, you can connect
    to the Internet from your home computer. In the past, connecting from Linux was
    difficult. More recently, many Linux distributions have designed utilities that
    make connection as simple as it is for Windows.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Accessing the Internet


    To connect to the Internet, you need networking hardware and access to the Internet.
    Access is provided in one of the following ways:


    +   - **Office LAN:** A work computer is connected to a company LAN. You may need
    to configure your connection in Linux, or this may be automatic. Your system administrator
    will provide you with the information you need. Or, your IT department may configure
    the connection. Connecting the LAN to the Internet is handled by the company.

    - **Home broadband:** A home computer is connected via broadband—cable modem,
    DSL, or services, provided by a cable or phone company or an independent Internet
    service provider (ISP). Your broadband connection needs to be configured with
    your connection information. You may have done this during installation. If not,
    you can do it. The information is provided by your ISP.

    - Some service providers install software on your computer that you run to connect
    to the Internet. If so, the service provider may or may not support Linux. Discuss
    Linux with the service provider. However, many broadband connections are now “always
    on” connections. The connection opens when your computer boots and you can use
    it any time. It doesn''t matter if the connection is made for Linux or another
    operating system.

    - **Home dial-up:** A home computer is connected via phone line and modem. The
    connection to the Internet is provided by an ISP, via a phone number provided
    by the ISP. Many ISPs provide software that you install and use to dial the ISP
    number. Not all ISPs support Linux. For instance, if the software doesn''t run
    on Linux, you may not be able to connect from Linux using the specific ISP. You
    need to discuss this with the ISP before signing up to their service. Or, if you
    are already using an ISP, you may need to find a new one.


    Broadband connections are more expensive, generally, than dial-up connections.
    However, with more and more graphic and multimedia content on the Web, the gain
    in speed is more than worth the cost. Usually broadband connections can be up
    to 50 times the speed of dial-up connections. Waiting for large graphics to download
    over dial-up connections can be painful.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Hardware Accessing the Internet


    Connecting to the Internet requires that either a modem (dial-up) or an Ethernet
    port is installed in your computer. In addition, a broadband connection requires
    additional hardware.


    +   - Modem: All computers sold in the last few years include a 56K modem. Most
    hardware modems are detected by Linux. You can check the Web site for your distribution
    to be sure your modem is supported.

    Software modems, also called Winmodems, require Linux drivers to work. Winmodems
    are becoming more and more popular with computer manufacturers because they cost
    less. New laptops usually come with Winmodems. More and more modem vendors are
    providing Linux drivers. Also, projects developing Linux drivers are making progress.
    Winmodems will become less of a problem. As time moves along, your life will be
    simpler if you don''t have a Winmodem. Information on using Winmodems with Linux
    is available at linmodems.org and at walbran.org/sean/linux/linmodem-howto.html.

    - Ethernet port: Your computer or may not include an Ethernet port, either as
    a separate card (network interface card [NIC]) or built into the motherboard.
    To use a broadband connection, you need an Ethernet port. Many broadband service
    providers, such as cable companies, install a NIC if it''s needed for broadband
    setup. Linux can detect the port. Check the Web site for your Linux distribution
    to be sure your NIC is supported.

    - Broadband hardware: Broadband connections require hardware between your computer
    and the broadband source. Each type requires a different setup.


    +   - Cable modem: The cable modem is transported on the cable that brings in
    your TV signal. A cable modem, not a phone modem, is connected to your Ethernet
    port and to the cable to translate the signal.

    - DSL: A DSL modem, provided by your DSL provider, is connected to your Ethernet
    port and to your phone line. It is not a phone modem.

    - Wireless: Wireless service requires a hardware unit that includes the electronics
    and antenna for receiving and transmitting the wireless signals, usually installed
    outside. A cable runs to your Ethernet port.


    After you have the required hardware, you need to set up your network connection,
    providing some information. For instance, for a dial-up connection, you please
    provide the phone number. The information needed is provided by your service provider.
    Most Linux distributions include a GUI utility for setting up network connections.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# # Checking Your Network Connections


    Your connection may have been set up during installation. The quickest way to
    test a connection is to try it. If you have a broadband connection, try your browser.
    Or, dial your ISP using your dial-up connection. Or, you can check your network
    connections using utilities provided with your Linux distribution.


    To see your network connection setup on Fedora, open the main menu and select
    Settings->Network. Figure 15-1 shows the Network Configuration window.


    ![](img/9a91733a8fb0082106ab0e361495babe_237_0.png)


    **Figure 15-1** Network Configuration on Fedora.


    The window on the left in Figure 15-1 shows the network devices that are set up.
    In this case, it shows one active network connection on device eth0. This is an
    Ethernet connection through a NIC. This computer is set up for a broadband connection.
    If you double the entry, a window opens showing the device configuration.


    If you click the Hardware tab, the window on the right opens. It shows the network
    hardware detected by Linux. In this case, Linux found one NIC and one modem. If
    you double-click an entry, you can see the configuration of the hardware.


    The Linux system represented by Figure 15-1 detects a modem, but no network device
    is configured to use the modem. You can configure a connection for the modem.
    In this figure, a network device is configured to use the NIC. If the NIC and
    your broadband were connected during Linux installation, your system is probably
    configured to use the NIC. You can add a connection device at any time. Adding
    a device is discussed in the next section.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Adding a Dial-Up Network Connection


    If your modem is installed and Linux recognizes it, but you can''t reach the Internet,
    you can configure a network connection using the window opened in Figure 15-1.
    Click New. Select Modem to see the window shown in Figure 15-2.


    ![](img/9a91733a8fb0082106ab0e361495babe_238_0.png)


    FIGURE 15-2 Modem configuration on Fedora.


    Don''t select a country. Enter the information you received from your ISP or system
    administrator. The "Provider name" is a label of your choice for this connection.


    When you click Forward, a window opens with two choices: "Automatically obtain
    IP Address Settings" or "Statically set IP address." This information is also
    provided by your ISP. After this screen, your modem connection is configured.
    The Network Configuration window (Figure 15-1) will show a new line for the modem.
    The status is shown as Inactive. Click Activate to change the status to active.


    You can add an icon to your to start your connection. In the main menu, select
    System Settings. Right-click Network and select Add Launcher to Panel.


    If you have a problem, your modem setup may be inaccurate. In the hardware window
    (Figure 15-1, right side), highlight the modem and click Edit. You can change
    modem configuration there. The modem is properly shown as /dev/modem. This might
    be incorrect, if you are also running Windows and can use the modem there, where
    COM1, try /dev/tty50 on Linux, COM2, /dev/tty51, etc.


    More information on setting up your modem can be found in the Modem How To, found
    at www.tldp.org.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Adding a Broadband Network Connection


    If your NIC and broadband modem (cable or DSL) were connected when you installed
    Linux, your connection is probably already working. If you add the connection
    hardware to a working system, Linux detects it during the next reboot and configures
    it. The configuration process asks you whether “Automatically obtain IP address
    settings from DHCP” or “Statically set IP address.\ The information needed to
    choose between these options is provided by your ISP.


    If you need to configure a connection, you can add one in the Network Configuration
    window shown in Figure 15-1. Click New. Select xDSL to see the window shown in
    Figure 15-3.


    ![](img/9a91733a8fb0082106ab0e361495babe_239_0.png)


    **FIGURE 15-3** Broadband configuration on Fedora.


    Your ISP provides you with the information needed for this configuration window.


    After this screen, your cable or DSL connection is configured. The Network Configuration
    window (Figure 15-1) will show a new line for the connection, similar to the line
    shown in the current figure. The status is shown as Inactive. Click Activate to
    change the status to active.


    Most broadband connections are “always on” connections. The connection is always
    available and open when your computer is running. You don’t need to “start” it,
    as you do with a dial-up connection. Just open your browser and connect.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Web Browsers


    Web browsers get Web pages from Web sites on the World Web (WWW) and display the
    Web pages on your screen. For dynamic Web sites, information is often sent from
    the browser to the Web site as well, as user ID/passwords, information provided
    in forms, and product orders. The major Web browsers for Linux:


    +   - Konqueror/Nautilus: The Web browsers provided with the major Linux desktops.
    (KDE) and Nautilus (GNOME) are fully functional, Mozilla has many more powerful
    features. Konqueror is discussed in other chapters.

    - Mozilla: The major open source browser, based on the Netscape source code that
    was made open source in 1998. Netscape provides some support for the Mozilla project.
    Mozilla is a suite of products, including a Web browser, email software, a news
    reader, and an HTML editor. Email is discussed in Chapter 17. Mozilla is included
    in most major Linux distributions. Mozilla runs on Windows, as as Linux.

    - Firefox: The next generation Mozilla browser. Firefox is a browser only. It''s
    faster, more efficient, and better than Mozilla. Firefox 1.0 was released in October
    2004, and its use is growing rapidly. Firefox runs on Windows, as as Linux. Currently,
    Firefox is not included in most distributions, so you must download and install
    it. Installing software is discussed in Chapter 10. (www.mozilla.org)

    - Netscape: Netscape is very similar to Mozilla, but it isn''t an open source
    project. Netscape uses Mozilla as its base, but adds more documentation and user
    friendly interface features. Netscape runs on Windows and Mac, as well as Linux.
    Netscape is not included with Linux, so you must download and install it yourself
    is discussed in Chapter 10. (www.netscape.com)

    - Lynx: A character based browser for use at the command line. It doesn''t display
    graphics or play multimedia files. It used most often for system administration
    tasks. Lynx is probably installed on your Linux system.


    This chapter discusses the Mozilla browser. Most of the information applies to
    Firefox, as well. Firefox has most of the same features, but they may be found
    in a different location. For instance, Mozilla settings are found in Edit->Preferences;
    Firefox settings are found in Tools->options. Most of the information applies
    to Netscape, as well.


    The Internet > Web Browsers 219'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# # Browsing with Mozilla


    A Mozilla browser window open to fedora.redhat.com is shown in Figure 15-4.


    ![](img/9a91733a8fb0082106ab0e361495babe_241_0.png)


    **Figure 15-4** Mozilla.


    To go to a page, use the location bar. To overwrite the current address, click
    the icon at the beginning of the location bar first; then type the URL.


    You can search using the location bar. Type in terms and click Search to run a
    Google search. The results display in the sidebar.


    You can change the settings for Mozilla. Click Edit and select Preferences. Click
    Appearance to change fonts and colors. Click Navigator to change Mozilla behavior.
    In the Navigator windows, you can set your home page, set Mozilla to your default
    browser, select which buttons are on the toolbar, change the search engine used,
    and set many other options.


    You can copy or save all or part of a Web page using the Edit menu. You can print
    the page from the Print button.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Mozilla Menus and Toolbars


    The menu is similar to the IE menu bar, except Mozilla says Bookmarks rather than
    Favorites. The Mozilla Windows menu is where you can open the other applications
    in the suite, such as email or address book. The Go menu is similar to History
    in IE.


    There are two toolbars. The usual buttons for back, forward, top, search, home,
    etc. are on the toolbars. You can select the items you want on your toolbars by
    clicking Edit and selecting Preferences. Click Navigation. In the bottom section
    of the page, check the items you want on your toolbars—Home, Search, Print, and
    Go.


    The second toolbar is the personal toolbar, a place for you to store frequently
    used Web pages. The bookmarks on the personal toolbar are Red Hot Web pages, added
    by the Fedora developers. If you download and install Mozilla yourself, links
    to mozilla.org and MozillaMine appear on the personal toolbar.


    You can customize the personal toolbar completely. You can add a bookmark to your
    personal toolbar. Copy a bookmark or a folder of bookmarks from your bookmark-down
    list and paste it onto the personal toolbar. You can also add a bookmark to the
    personal toolbar from any open Web page. Drag the icon at the beginning of the
    location bar to the personal toolbar.


    You can delete any bookmark from the personal toolbar. Right-click the bookmark
    and select Delete.


    You can hide any toolbar by clicking the small triangle on the left side of the
    toolbar. Click the triangle again to redisplay the toolbar. You can totally remove
    a toolbar, including the triangle section, by clicking View and selecting Show/Hide.


    The status bar appears at the bottom of the browser. The left section of the status
    bar is the component bar. Buttons for switching to other applications in the Mozilla
    suite, such as email or the address book, are found on the component bar. The
    component bar is not found on Firefox because Firefox is not a suite.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# # The Mozilla Sidebar


    The Mozilla sidebar is an area where you can keep the items you use often. Each
    item is accessed using a tab. If the sidebar is not available, click View and
    select Show/Hide-> Sidebar. You can add or remove items from the sidebar.


    By default, the sidebar contains default items: Search, Bookmarks, and History.
    If you click a tab, the features for that item open in the sidebar. For instance,
    if you click the Search tab, the features of the search function as shown in the
    window on the right, you can select a field where you enter terms (PHP is entered).
    You can select a search engine in the drop-down list (Google is currently selected).
    Click Search. The search results display in the sidebar. Click a result to open
    the Web page in the browser window. The sidebar retains your results for you.


    If you click the Bookmarks tab, all your bookmarks are available in the sidebar
    (shown in Figure 15-4). You can open a bookmarked page by clicking it. The History
    tab is similar, listing pages that you have previously visited.


    You can add items to your sidebar—news, weather, address book, stock quotes, FedEx,
    many others. Or you can remove items. Tabs in the upper corner of the sidebar.
    Select Customize Sidebar. The window below opens.


    ![](img/9a91733a8fb0082106ab0e361495babe_243_0.png)


    The left pane shows available tabs. The right pane shows the current sidebar tabs.
    To add a tab to the left pane and click Add. You can click Preview, before you
    click.


    To remove a tab from the sidebar, click the tab in the right pane and click Remove.


    Notice the dotted area on the middle right border of the sidebar—the handler.
    Click this area and the sidebar will close. Click it again and the sidebar opens.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Tabbed Browsing in Mozilla


    Tabbed browsing in Mozilla allows you to keep more than one Web page open in a
    single browser window. You use its tab to bring a Web page forward.


    Tabbed browsing is shown in Figure 15-4. Figure 15-5 shows the tabbed browsing
    section of Figure 15-4.


    ![](img/9a91733a8fb0082106ab0e361495babe_244_0.png)


    The Fedora project is open in Figure 5-4. Figure 15-5 shows the top of the Fedora
    Web page. Notice the top row of this figure. There are three tabs. The tabs display
    the title for the Web page, the title that appears in the Web page title bar,
    as much of the title as allows.


    The first tab is currently the Fedora Project tab. The second tab shows Janet
    Valade''s Home Page. If you click this tab, you see the home page. The third tab
    shows RealPlayer 10. If you click this tab, the RealPlayer Web page displays.


    To see another Web page, you can replace one of the current tabs in the Web page
    or open a new tab. When a tab is selected and the Web page in the tab is visible,
    you can type a URL to open a new Web page selected in the tab. For instance, with
    the Fedora Web page open, you can type a URL into the location box and the new
    Web page will replace the Fedora Web page, still in the current tab.


    To open a new tab, right-click a blank space on the bar which has tabs display.
    Select New Tab. A new tab opens in the current browser window. The new tab will
    be blank, labeled (Untitled). You can also open a new tab by clicking the New
    Tab button, shown at the beginning of the tab bar, to the left of the first tab.


    If you have only one Web page in the browser window, with no tabs currently open,
    you can begin tabbed browsing by clicking File and selecting New->New tab. The
    current Web page remains and is given a tab and a new blank tab opens in the browser
    window.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Controlling Pop-Ups with Mozilla


    Some people do not want pop-up and pop-under windows. However, some sites provide
    some of their functionality in pop-up windows. For instance, a site might provide
    their login page in a pop-up window or allow printing through a pop-up window.
    Mozilla allows you to block pop-up windows. It also allows you to set up a list
    of sites that are exceptions to the pop-up blocking.


    To configure pop-up settings, click Edit and select Preferences. Expand Privacy
    and Security (click +). Click Pop-up Windows. The window in Figure 15-6.


    ![](img/9a91733a8fb0082106ab0e361495babe_245_0.png)


    **Figure 15-6** Mozilla pop-ups.


    Check “Block unrequested popup”. You can have a sound play when a pop-up is blocked.
    The Allowed sites button opens a window where you can enter sites that are exceptions,
    which those pop-ups you want to accept. In the Sites window, type a URL and click
    Add.


    You can check “Display an icon in the Navigator status bar.” The icon displays
    when a pop-up is blocked. If you click the icon, the Sites window opens, with
    the site URL already filled in; you only need to click Add to the site to the
    exceptions list.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# # Downloads, Forms, Passwords, and Cookies


    Mozilla provides managers for several features:


    +   - **Download Manager**: When a download starts, the download manager opens
    a list of recent downloads, adding the new one to the list. The time required
    for the download is shown. A status bar keeps track of the download progress.
    If a download takes hours, you can do something else on your computer, leaving
    the download to the download manager. Don''t just close the download manager until
    the list is completely downloaded.

    - **Password Manager**: When you log in to a Web site, Mozilla asks whether you
    want to save the password for future use. If you save it, Mozilla will automatically
    enter it whenever you return to the login page for this site. In addition, Mozilla
    can display your passwords. Click Tools!. Select Password manager->Manage Passwords.
    A window opens that lists the sites and login names saved. To see passwords, click
    Show Passwords. You can remove any login information from the list.

    - **Form Manager**: When you fill in a form, Mozilla asks whether you want to
    save the information. If you save it for a few sites, Mozilla can fill in forms
    for you, saving a great deal of typing. At a blank form, you can double-click
    a field. Or, at a blank form, click Edit. Select F11 in Form. A window opens showing
    the data entered. None of the data filled in by Mozilla is sent until you actually
    submit the form by clicking Submit or a similar button.

    - **Cookie Manager**: Mozilla keeps track of cookies stored on your computer.
    You can open the cookie manager at Tools->Cookie Manager to see a list of cookies,
    with information about each cookie. You can remove individual cookies or all cookies.


    The password and form managers are saving potentially sensitive information. If
    other people can access your computer, you can encrypt this information so they
    can''t see it. This is inconvenient because you must set and remember a password
    for the encryption. To use encryption, click Edit and select Preferences. Expand
    Privacy & Security. Click Master Password to set a password. Click Passwords to
    turn on encryption.


    Firefox has similar features, but they are accessed in different places. For instance,
    to access the Download Manager, click Tools->Downloads. To access passwords, forms,
    and cookies, click Tools->Options->Privacy.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Plug-Ins


    Plug-ins are small programs that expand the functionality of Mozilla. Plug-ins
    can be installed when Mozilla is installed. You can install additional plug-ins
    later as well.


    Plug-ins typically are opened within Mozilla. For instance, the RealPlayer video
    gives Mozilla the ability to play video clips inside the browser, not needing
    to open a separate application to play the clips. Other popular plug-ins are Macromedia
    Flash Player and Java.


    Mozilla was probably installed when your Linux was installed. Some plug-ins are
    usually installed with it. For instance, if you encounter a media file on the
    Internet that requires an application to play, you may be prompted to download
    the plug-ins.


    Some popular plug-ins can be downloaded from addons.update.mozilla.org/plugins/.
    The available plug-ins are:


    +   - Acrobat Reader: Opens Acrobat PDF files in your Mozilla browser.

    - Flash Player: Plays Flash files.

    - Java: Allows your computer to run applications and applets that use Java technology.

    - RealPlayer: Displays video files in RealVideo format inside your Mozilla browser.
    Installing and using RealPlayer is discussed in detail in Chapter 16.


    Plug-ins are installed, by default, in the plug-ins subdirectory in the directory
    Mozilla is installed.


    To see which plug-ins are currently installed, go to this Netscape Web page that
    also works for Mozilla at channels.netscape.com/ns/browsers/plugins.jsp. You can
    look in the plug-ins directory to see which plug-ins are.


    > NOTE

    In Firefox, you can see which plug-ins are installed by clicking Tools. Select
    Options. Click Downloads. Click the Plug-Ins button.'
  merge: -1
  pgno: 247
