- img_proc: true
  md: 'Windows manipulation: Windows can be moved, minimized, maximized, resized,
    moved out of the way, or closed.


    Move: Click the top bar of the window and drag the window around the desktop using
    the mouse. Click the button in the upper-left corner and select move.


    Resize: Drag the sides or corners of the window using the mouse. To maximize the
    window to full-screen size, click the middle button in the upper-right corner.


    Move out of the way: Double-click the title bar of the window. The window rolls
    up like a window. To unroll it, double-click the rolled window. Click the button
    in the upper-right corner to minimize the window. If your panel has the Show desktop
    icon, click it to minimize all windows at once. If the Show desktop icon isn''t
    present, you can add it to the panel, as described later in this chapter.


    Close: Click the x button in the upper-right corner or select close from the upper-left
    drop-down menu.


    Look and feel: The look and feel of the Linux desktop is very configurable. For
    instance, the desktop background displays a default appearance provided by the
    distribution. The background for Fedora, Mandrake, and SuSE is beautiful. Fedora
    and Mandrake include logos on the background. However, you can change this background
    to any color, pattern, design, or picture that you want.


    You can change the appearance of all elements of the desktop, such as the window
    borders and title bar and the panel. Linux users often configure their desktop
    with a theme—a unified set of colors and images, that integrate all parts of the
    desktop into a single look and feel. Some themes are included with your distribution
    that you can use. Others are available for download from the Web. Some people
    develop their own theme.


    Some behavior of desktop components can also be changed. For instance, icons can
    be configured to activate with a single-click or a double-click. Windows can become
    active when clicked or when the mouse pointer passes over them. Tool—information
    that displays when the mouse pointer passes over a component—can be turned on
    or off.


    Remember that almost everything is configurable. This section describes the usual
    behavior of desktop components. However, most appearance and behavior are configurable.
    Any distribution might decide to configure their desktop differently. A previous
    user of your system might have changed some features. If the behavior of your
    system is different from the description in this chapter, you can change it to
    your preferred appearance or behavior. Configuring Linux is described later in
    this chapter.


    ![](img/9a91733a8fb0082106ab0e361495babe_102_0.png)'
  merge: -1
