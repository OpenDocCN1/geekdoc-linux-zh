  md: '# Linux Accounts


    Linux is a multi-user operating system—a system that allows many users to work
    on the computer, at the same time. For this to work, each user''s work must be
    kept separate. One user cannot be allowed to interfere with another''s work, either
    accidentally or with evil intentions. A system that allows to delete the report
    you spent writing would not be very popular. Linux accounts keep users'' work
    private and protected.


    A Linux system basically consists of files and processes. All information is organized
    in files and each file is owned by an account, protected from other accounts.
    All work done on your computer, including the invisible work that keeps your computer
    running, is done in a process—a program that is running. A program is run by an
    account. Consequently, you can do nothing on Linux without an account.


    You may be the only person working on your computer. If so, you can''t work on
    Linux without an account. So, at least one account is required. Accounts help
    protect you from unauthorized access from the Internet, as well as unauthorized
    access from your desk chair.


    You will see accounts on your system that you didn''t create. These are special
    accounts that run system and application processes. Some are created during installation.
    Others are created by the installation process when you install a software application.
    However, these are not accounts that you are likely to log in to. Only a system
    administrator is likely to need to understand or work with special accounts.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Account Types


    All accounts are not equal. Each account has a set of privileges—a set of actions
    it is allowed to perform. There are two types of accounts:


    +   - Root: The root account, called the super user, is allowed to do anything.
    It can access every file, directory, and program on the system. Every Linux system
    must have a root account.

    - User: User accounts are more restricted. Unless given additional permissions,
    user accounts can only access directories and files that were created using the
    account itself.


    During installation, a root account, and probably one or more user accounts, were
    created and passwords. Don''t forget the root password. You must use the root
    account to make changes to the system. Root can add new accounts at any time.


    It is wise to log in and use your user account most of the time. In fact, don''t
    use the root account unless you really need to. The root account has unlimited
    power that allows you to make some disastrous mistakes.


    User accounts can temporarily grant root privileges. If you need to perform a
    task that requires root privileges while logged in your user account desktop,
    you can enter the root password and perform the task. For instance, if you go
    main menu->System Settings and select Users or Groups or Root while logged in
    your user account, you will be prompted by the window shown in Figure 8-1.


    ![](img/9a91733a8fb0082106ab0e361495babe_135_0.png)


    Figure 8-1 Root password prompt.


    When working in the shell in a terminal window, you can change from one account
    into any other account, as long as you know the password. Change account using:


    ```

    su accountname

    ```


    Unless you are logged in root, you will be prompted for a password. Root can su
    to any account without needing a password.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Groups


    Each account is assigned membership in a group when it is created. Privileges
    assigned to a group are available to all accounts in the group. An account can
    belong to more than one group at a time.


    Groups are a useful way to grant privileges to an account. For instance, suppose
    you have a program, called destroy, that only certain people should use. You can
    set up this program so it''s available for use by people in the expert group,
    but not all users. When you install a new account that needs to run the destroy
    program, you assign the account to the expert group. If you install a new program,
    destroy2, for the use of this group of people, you set up the new program so that
    only the expert group can run it.


    At least one group must be assigned to each account when it''s created. A group
    must exist before any account can be assigned to it. Linux allows you to set a
    default group that is assigned to each new account. Some Linux systems assign
    the same group, usually named users, to all new accounts. The user group has no
    extraordinary privileges. Other Linux systems assign an individual group to each
    new account. For instance, when Fedora creates a user account, it also creates
    a group with the same name and assigns it to the new account. Thus, the account
    janet belongs to the group janet. The groupet has no extra privileges.


    Linux installs several groups by default. Root is one group installed by Linux;
    the root account is a member of the root group. If a new account is assigned to
    the root group, the new account will have the same privileges that are assigned
    to root.


    You can create groups for your own purposes. Group names should represent the
    purpose of the group, such as the sales group or the mail group. Group names are
    limited to 16 or fewer characters.


    Groups allow privileges to accounts by mean of file permissions. File permissions
    are discussed in Chapter 9.'
  merge: -1
