  md: '# Copying, Renaming, and Moving Files


    Konqueror allows you to copy, rename, and move directories and files. When you
    move a directory, all its contents are copied or moved as well.


    Highlight a directory or file icon to copy or moved. Use the Ctrl or the Shift
    key with the mouse to select more than one icon. Right-click your highlighted
    icon(s) and select Cut or Copy to put the file(s) onto the clipboard, similar
    to the Windows clipboard. You can then Paste the file(s) wherever it''s needed.
    Select Rename to give the file a new name. Copy to and Move to provide a list
    of directories where you can create a new copy of the file. Select Copy Here in
    the target directory.


    You can also copy or move a file by dragging it to a new location. For instance,
    you can highlight a file icon in the right pane of Konqueror and use your mouse
    to drag it to any folder in the left pane of Konqueror. To a directory that opens
    in another window. Or to an application that''s open in another window.


    You can copy, rename and move files at the command line using the cp and mv commands.
    To copy or move a file, type:


    ```

    cp path/sourcename path/targetname (copies file)

    cp -r path/sourcename path/targetname (copies directory)

    mv path/sourcename path/targetname (moves a file or directory)

    ```


    +   - If targetname doesn''t exist, a copy of sourcename is created and given
    the name targetname.

    - If targetname exists and is a file, it is overwritten if sourcename is a file,
    but not copied at all if sourcename is a directory.

    - If targetname exists and is a directory, a copy of sourcename is written into
    targetname and given its original name


    To copy or move files, your account needs to have write permissions to the directory
    where you are copying or moving the file or directory.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# # Viewing and Editing Text Files


    Text files are files that contain only text characters, with no formatting information.
    Text files contain information stored in ASCII code, a code that is understood
    by most applications. HTML files, program source code, and many Linux configuration
    files are stored in text files. Although you can view and edit the contents of
    text files with a word processor, it''s generally quicker and simpler to open
    them with a text editor—an application that has the features necessary to edit
    text. Some text editors are:


    +   - Kate: A basic text editor with a GUI interface, very similar to Notepad.
    Kate is discussed in full detail in Chapter 18.

    - KWrite: A text editor similar to Kate, with a few more useful features, such
    as a spell checker. KWrite is the default text editor for KDE. When you double-click
    a text file, it opens in KWrite.

    - Emacs: A popular editor, developed by GNU, with advanced features for programmers.


    +   - vi: A command-based text editor, suitable for use at the command line. vi
    is installed on every Linux and UNIX system, regardless of what other text editors
    are installed. vi is described in detail in Chapter 18. Many Linux distributions
    provide an updated version of vi called vim. Any commands that work in vi also
    work in vim.


    You can look at the contents of a file at the command line without opening the
    file in a text editor with the command:


    ```

    filename

    ```


    The entire file contents display on the screen at once. You can display the contents
    one screen at a time with the following command:


    ```

    less filename

    ```


    Output pauses after one screen display. Press <spacebar> to display the next page.
    Press <q> to quit the command, stopping the output.


    Linux provides two applications for automating repetitive text editing:


    +   - sed: A powerful, fast search and replace utility. Your search term can be
    a pattern (regular expression, discussed in Appendix A), sed can process many
    large files in seconds.

    - awk: A simple, limited primitive scripting language. gawk processes each line
    in the file, rearranging, removing, and/or adding text as directed.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Deleting Files and Directories


    To delete a file or a directory when in Konqueror, highlight the icon and right-click.
    Select either Move to Trash or Delete. Move to trash is the safer option because
    the file can be retrieved from the trash so long as the trash hasn''t been emptied.
    Files that are deleted are not retrievable.


    Konqueror also allows you to delete a file or directory using your mouse to drag
    it into the trash on your desktop.


    To delete a file from the command line, type:


    ```

    rm filename

    ```


    You can use wildcards (e.g., ch* or ch?) to delete more than one file at a time.
    Be cautious when using wildcards. Linux allows you to issue a command like the
    following:


    ```

    rm *

    ```


    It deletes all the files in the current directory. It is easy to make a disastrous
    mistake with wildcards. Listing the files with the wildcard, such as:


    ```

    ls *

    ```


    shows the files that will be deleted. It''s worth a few seconds to be careful.


    To remove a directory, use the command:


    ```

    rmdir dirname

    ```


    However, dirname needs to be empty. If it''s not, you will get an error message
    and it won''t be deleted. You can remove all the files and issue rmdir again.
    Or, you can use the rm command,


    ```

    rm -r dirname

    ```


    This will remove dirname and all its contents, including all nested directories.
    This command deserves a caution. Be sure you know what''s in the directory and
    that you want to delete it all by issuing this command.


    To delete files, you must write permissions on the directory containing the files.
    You don''t need to write permissions on the files themselves. However, if you
    don''t have write permissions on the file you are deleting, you will be asked
    whether you really want to delete the file. If you answer yes, the file is then
    deleted.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Summary


    All information on Linux is organized into files. All information, without exception.
    Some files you might need to know about and manage are data files, programs, image
    files, and configuration files. Although you usually create and manage files with
    applications, on some occasions you need to create, copy, move, delete, and otherwise
    manage files directly.


    Files are located in directories, also called folders, organized in a hierarchical
    file system. Each account has a home directory where it can store files. Each
    file is uniquely identified by an absolute file path, which lists all the directories
    between / (the top directory called root) and the file.


    Each file has properties, such as its name, location, size, and date created.
    Each file is protected by a system of permissions that define whether only the
    user owner, the group owner, or anyone can access it and what each can do with.


    You can create and delete files. You can examine and change the properties and
    permissions of a file from the desktop or from the command line. You can edit
    file contents using text editors. This chapter explains how to do the following:


    +   * Examine and change file permissions

    * Examine and change owners and groups

    * Associate file types with applications

    * Find files

    * Create directories, files, and lists

    * Copy, rename, move, and delete files and directories

    * Edit the contents of text files


    Chapter 10 discusses programs and applications. In particular, you find out how
    to install and update software on your Linux system.'
  merge: -1
