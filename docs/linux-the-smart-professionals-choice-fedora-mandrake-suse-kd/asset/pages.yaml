  md: '# Logging Out


    Powering off your machine without logging out and shutting down properly can cause
    problems. Linux may be in the middle of some background activities necessary to
    run your computer and may not be able to finish its tasks.


    To log out, select Log Out on the main menu or on the desktop menu displayed when
    right-click on the desktop. In most cases, a window with at least three choices
    displays, similar to the SuSE window shown in Figure 6-20.


    ![](img/9a91733a8fb0082106ab0e361495babe_115_0.png)


    FIGURE 6-20 SuSE logout window.


    One choice is logout Log Out, or in this case Login as different user. Selecting
    this choice logs out this session, but displays a login screen so you can log
    in as a different user (with a different desktop). Linux is not shut down. A second
    choice restarts (reboots) the computer. Linux is shut but restarts without your
    assistance.


    A third choice is Shut Down, or Turn off computer. This closes everything. The
    computer may power itself off or display a message that it is ready to be powered
    off.


    Power is not necessary. Linux can run indefinitely without problems. It saves
    you the trouble of the shutdown/boot process between users. Saves time and some
    say it is better for the computer. If you are reluctant to leave the computer
    on it''s possible for someone else to access it, you can lock the screen so that
    no one can use it without the password. To lock the screen, select Lock screen
    from the main menu. If anyone tries to use the computer with a locked screen,
    a password prompt displays and the computer can''t be used until the password
    is entered.'
  merge: -1
