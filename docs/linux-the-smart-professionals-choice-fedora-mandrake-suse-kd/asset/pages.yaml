- img_proc: true
  md: '# Booting from the CD or from a Floppy


    To install the CDs that you have purchased/written, you need to boot from your
    CD drive. Most computers are set up so that they try to boot in the following:


    +   - **From the floppy:** If a bootable disk is in the floppy drive, the computer
    boots from the disk.

    - **From the CD drive:** If a bootable CD is in the drive, the computer boots
    from the CD.

    - **From the hard drive:** If no floppy or CD is found, the computer attempts
    to boot from the hard drive.


    Test whether your computer boots from the CD by putting a CD in the drive and
    turning on the computer. If your computer ignores the CD and boots from the hard
    drive, the boot order may be different, with the hard drive coming before the
    CD drive. The boot order can be changed using the setup program. The manual for
    your motherboard program explains how to use the setup program. In general, you
    enter the motherboard program when your computer first boots by pressing a specific
    key, such as the Del key. Instructions, such as "Del to enter Setup," display
    on the screen. Enter the boot options and change the order, usually using the
    tab or arrow keys. Be sure to save the new settings when using the setup program.


    Some older computers or laptops may refuse to boot from the CD, requiring you
    to make a boot floppy. Distributions provide a method for making a boot floppy
    on a Windows system; the procedure may differ, however, read the documentation
    for information. To make a boot floppy for Mandrake:


    +   - Start rarewriting. The program is located on the first CD in the directories.
    Click the program or type its name in a command prompt window. User interface
    appears after a short wait.

    - Select Image File. In most cases, the image file should be \.image\cdrom.img.

    - Put a floppy disk into the floppy drive.

    - Make sure the floppy disk selected is correct. \A: is usually correct.

    - Click Write.


    After creating the floppy, you can boot your computer with the floppy, which starts
    the installation. The installation will then continue using the CDs.


    NOTE

    Fedora Core 1 provides a very similar procedure. However, starting with Fedora
    Core 2, the dissutory is no longer provided on the CDs.


    ![](img/9a91733a8fb0082106ab0e361495babe_50_0.png)'
  merge: -1
