  md: '# # Redirecting Input and Output


    Often commands need to receive input from the keyboard and/or send output to the
    screen. Whenever data is moved from one program or device to another, it is transferred
    in a stream. When a program runs, it is connected automatically to an input and
    an output stream: stdin and stdout. By default, stdin is connected to the keyboard
    and stdout is connected to the screen. You can redirect stdin and stdout.


    The ls outputs a list of files to stdout, which by default is connected to the
    screen. You can change the output location using the redirect metacharacter—the
    greater sign (>), as follows:


    ```

    ls > dirlist

    ```


    The list of files is redirected to a file called dirlist and does not display
    on the screen. If dirlist doesn''t exist, it''s created. If dirlist exists, it''s
    replaced. To overwrite the file, you can append the output to the existing file,
    by using >>, instead of >. Or, you can set noclobber, a shell option that stops
    file overwriting, printing an informative message, as “Can’t overwrite existing
    file,” as follows:


    ```

    set - noclobber

    ```


    The redirect metacharacter for stdin is the lesser than sign (<). For example:


    ```

    mail < message

    ```


    The mail command inputs the text from the file named message, rather than from
    the keyboard, and sends the message via email.


    A third stream stderr is connected to running programs. Error messages use the
    stderr stream, which is connected by default to the screen. When you redirect
    output using>, stderr is not redirected; it still displays on the screen. To redirect
    stderr, use a command similar to:


    ```

    ls &> dirlist

    ```


    Now, both the list of files and any error message are sent to the file list.


    Sometimes you want to connect stdout on one program directly to stdin on another
    program. Making this type of connection is called piping and is done using the
    metacharacter |. Suppose you want to send a list of all the files in your directory
    directly to the printer. You can use the following command:


    ```

    ls | lpr

    ```'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Running Commands in the Background


    Some commands take a long time to finish executing. For instance, the following
    commands store the name of every file on your computer in the file allfiles:


    ```

    ls -IR / > allfiles

    ```


    This command can tie up your command line for a long time until it completes the
    job. If you don''t want to wait for a command to finish, you can execute the job
    in the background, allowing you to enter other commands while your first command
    is executing. You can start the command in the background by adding an ampersand
    (&) to the end of the command, as follows:


    ```

    ls -1R / &

    ```


    A number is assigned to background jobs in consecutive order. The job number displays
    when the command is submitted and used to monitor the status of the background
    job.


    You can also send a job that is already running to the background, as follows:


    ```

    Ctrl-z

    ```


    The first line suspends the job. The second line starts the job in the background.


    You can list the jobs that are running by typing:


    ```

    jobs

    1 ls -1R /

    ```


    You can bring any job into the foreground with the command:


    ```

    fg jobnumber

    ```


    For example:


    ```

    fg 1

    ```'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Editing the Command Line


    Several command-line features assist you with entering commands. For instance,
    wildcards are available, the same wildcards that you can use with Windows. The
    asterisk (*) can be substituted for a string of characters and a question mark
    (?) can be substituted for a single character. Thus, the following command lists
    all filenames that var and end with a single character:


    ```

    ls *var?

    xvar1

    Study_varA

    ```


    File and directory names are completed for you when you press the Tab key. As
    soon as you have typed enough of the name so that it refers to only one file,
    press the Tab and the remainder of the filename is filled in the command line.


    The shell stores a history of the commands you enter. You can see it by typing
    history, which lists the commands, adding a line number at the start of each line.


    You can repeat commands using begin with an exclamation point:


    +   * !! Repeats the last command entered.

    * !string Type an exclamation point, followed by one or more letters that begin
    a command. The last command that begins with the letters is repeated. For instance,
    if you type lc, the last command begins with c is repeated.

    * In Type the !, followed by a line number. The command shown on that line number
    in the history list is repeated. For instance, if you type i6, the command on
    line six of the shell is repeated.


    You can also repeat a command using the up-arrow key. Each time you press <up
    arrow>, the previous command displays. Continue to press <up arrow> until you
    reach the command you want to repeat.


    You can edit the repeat command and reenter it using ^old^new. The following command
    will replace string1 with string2 in the first command that just executed:


    ```

    srot test.txt

    ^ro^or

    ```


    As shown, you accidentally typed srot, when you meant to type sort. The second
    line tells the shell to re-enter the command, changing ro to or.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Command-Line Help


    Linux provides several commands that give help with the details of its many commands:


    +   **help**: Gives a list of the shell commands, a subset of Linux commands including
    cd, alias, bg, jobs, and others. Type `help commandname` for details.


    +   **man**: The man (manual) pages document all programs on Linux. To see the
    details of any command, type `man commandname`. If you don''t know the name of
    the command you want, you can search all the descriptions using the -k option.
    For example, if you type man -k copy, a list of all commands that have copy in
    their displays.


    +   **info**: A program that displays online documentation via a hierarchical
    menu of topics that you can select. In addition, related information is hyperlinked.
    Info often contains information that is more complete, with more conceptual information,
    than the man pages. When you type info with no arguments, the top-level menu displays.
    If you know a topic name, you can type info topicname.


    +   **help option**: Many programs have an option that displays information about
    using the program. It''s worth a try to type the program name, followed by -h
    or --help. For instance, typing info --help displays a brief help file.


    Man pages are divided into numbered sections, based on the type of command, such
    as the one you are interested in executable programs, system calls, or games.
    Most of the commands that you are interested in while learning Linux are in section
    1—Executable programs or shell commands. If you specify the section number, the
    man command does not need to search all the man pages, only one section, speeding
    the command considerably. For instance, you might use the following command to
    look up all the available options for the ls command:


    ```

    man 1 ls

    ```


    When software is installed on Linux, the associated help, and/or info files are
    installed in the appropriate location. The man command looks for files in a specific
    directory, in subdirectories for each section. To see where the man pages are
    located, use manpath at the command line.'
  merge: -1
