    then\n  echo \"File size is not zero\"\nelse\n  echo \"File size is zero\"\nfi\n\
    \nif [ -e $file ]\nthen\n  echo \"File exists\"\nelse\n  echo \"File does not\
    \ exist\"\nfi\n```\n\n产生了以下结果 –\n\nFile has read access\nFile has write permission\n\
    File has execute permission\nFile is an ordinary file\nFile is a directory\nFile\
    \ size is not zero\nFile exists\n\n注意：\n\n- 运算符和表达式之间必须有空格，例如 2+2 是不正确的，而应该写成\
    \ 2 + 2。\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| -b | 检查文件是否为块设备，如果是，条件为真。\
    \ | [ -b file ] 为假。 |\n| -c | 检查文件是否为字符设备，如果是，条件为真。 | [ -c file ] 为假。 |\n| -d\
    \ | 检查文件是否为目录，如果是，条件为真。 | [ -d file ] 为假。 |\n| -f | 检查文件是否为普通文件而非目录或特殊文件。 | [\
    \ -f file ] 为真。 |\n| -g | 检查文件是否设置了组 ID (SGID)，如果是，条件为真。 | [ -g file ] 为假。 |\n\
    | -k | 检查文件是否设置了粘滞位 (sticky bit)，如果是，条件为真。 | [ -k file ] 为假。 |\n| -p | 检查文件是否为命名管道，如果是，条件为真。\
    \ | [ -p file ] 为假。 |\n| -t | 检查描述符是否打开并关联终端，如果是，条件为真。 | [ -t file ] 为假。 |\n|\
    \ -u | 检查文件是否设置了用户 ID (SUID)，如果是，条件为真。 | [ -u file ] 为假。 |\n| -r | 检查文件是否可读，如果是，条件为真。\
    \ | [ -r file ] 为真。 |\n| -w | 检查文件是否可写，如果是，条件为真。 | [ -w file ] 为真。 |\n| -x | 检查文件是否可执行，如果是，条件为真。\
    \ | [ -x file ] 为真 |\n\n## 在 Linux 中运行 Shell 脚本\n\n下载软件后，.sh 文件只是用于安装应用程序或在操作系统下执行其他任务的\
    \ shell 脚本。在 Linux 或 UNIX 中运行 .sh 脚本最简单的方法是输入以下命令之一。打开终端（你）并输入：\n\n```bash\nsh\
    \ file.sh\n```\n\n或\n\n```bash\nbash file.sh\n```\n\n## 以 Root 用户身份运行 Shell\n\n\
    有时你可能需要安装一个需要 root 权限的应用程序。\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| -s |\
    \ 检查文件大小是否大于 0，如果是，则为真。 | [ -s file ] 为真。 |\n| -e | 检查文件是否存在。即使是目录也为真。 | [ -e\
    \ file ] 为真。 |\n\n```bash\nsudo bash filename.sh\n```\n\n输入你的密码。另一个选项是使用以下 su\
    \ 命令变为超级用户：\n\n```bash\nsu -\n```\n\n输入 root 用户密码最后运行你的脚本：\n\n```bash\nbash filename.sh\n\
    ```\n\n## chmod 命令：在 Linux 中运行 Shell 脚本\n\n另一个推荐选项是使用 chmod 命令设置可执行权限：\n\n```bash\n\
    chmod +x file.sh\n```\n\n现在你可以运行 .sh 文件了。\n\n```bash\n./file.sh\n```\n\n# 第十二章：SHELL\
    \ 嵌入与选项\n\n本章研究了类型 shell、嵌入式 shell 和 shell 替代方案。\n\n## Shell 安装\n\n可以安装 shell\
    \ 在命令行中工作；命令行可以产生包含当前 shell 分叉的新过程。你可以使用变量来证明创建了新的 shell。变量 $var 仅存在于（临时）子 shell\
    \ 中。\n\n```bash\npaul@RHELv4u3 gen$ reverberation $var\npaul@RHELv4u3 gen$ reverberation\
    \ $(var=5;echo $var\n5\npaul@RHELv4u3 gen$ reverberation $var\npaul@RHELv4u3 gen$\n\
    ```\n\n你可以将一个 shell 安装到插入的 shell 中；这被称为嵌套嵌入 shell。\n\n```\npaul@deb503:~ A=shell\n\
    paul@deb503:~ reverberation $C$BA $(B=sub;echo $C$BA; reverberation $(C=sub;echo\
    \ $C$BA))\n```\n\nshell subshell subshell\n\n## 反引号\n\n单个安装可以改变当前的索引，并使用反引号而不是美元符号括号组合来嵌入。\n\
    \n```bash\npaul@RHELv4u3 ~$ reverberation `cd/and so forth; ls -d * | grep pass`\
    \ passwd-passwd.OLD\npaul@RHELv4u3 ~$\n```\n\n反引号 /() 和 $() 文档可以用于嵌入 shell。\n\n\
    ## 反引号或单引号\n\n使用反引号进行安装使用的是一个字符，而不是美元符号括号的组合。另一方面，要小心，反引号经常与单引号混淆。\n\n ” 和 ` 之间的区别至关重要！\n\
    \n```bash\npaul@RHELv4u3 gen$ reverberation `var=5;echo $var`\n```\n\n"
