    # Ampersand Referencing


    The sed metachar & represents the contents of the pattern that was matched. For
    instance, you have a file phone.txt full of phone numbers -


    ```text

    5555551212

    5555551213

    5555551214

    6666551215

    6666551216

    7777551217

    ```


    You want to make the area code (the first three digits) surrounded by parentheses
    for easier reading. To do this, you can use the ampersand replacement character,
    like so


    # Hex digits [0-9 a-f A-F]


    ```bash

    $ sed -e ''/s/[:digit:]][[:digit:]][[:digit:]]/&g/'' phone.txt

    (555)5551212

    (555)5551213

    (555)5551214

    (666)5551215

    (666)5551216

    (777)5551217

    ```


    Here you are matching the first 3 digits and then using & replacing those 3 digits
    with surrounding parentheses.


    # Using Multiple sed Commands


    You can use multiple sed commands in a single sed command as follows -

    $ sed -e ''command1'' -e ''command2'' ... -e ''commandN'' files

    Here command1 through commandN sed commands of the type discussed previously.
    These commands are applied to each line in the list of files given by files. Using
    the same mechanism, we can write above phone number example as follows –


    ```bash

    $ sed -e ''/s/[:digit:]\{3\}/&g/'' \

    -e ''s/\([[:digit:]\{3\}\)/(\1/'' phone.txt

    (555)555-1212

    (555)555-1213

    (555)555-1214

    (666)555-1215

    (666)555-1216

    (777)555-1217

    ```


    > In the above example, instead of repeating the character class [:digit:] three
    times, you replaced it with \{3\}, which means to match the preceding regular
    expression three times. I used \ to give line break you you should remove this
    before running this command.


    # Back References


    The ampersand metacter is useful, but even more useful is the ability to define
    specific regions in a regular expression so you can refer them in your replacement
    strings. By defining specific parts of a regular expression, you can refer back
    to those parts with a special reference character. To do back references, you
    have to first define a region and refer back to that. To define a region you insert
    backslash parentheses around each region of interest. The first region you surround
    with backslashes is then referenced by \1, the second region by \2, and so on.


    # Assuming phone.txt has the following text –


    | (555)555-1212 |

    | (555)555-1213 |

    | (555)555-1214 |

    | (666)555-1215 |

    | (666)555-1216 |

    | (777)555-1217 |


    # Now try the following command –


    ```bash

    $ cat phone.txt | sed ''s/\(.*\)\(.*-\)\(.*\$\)/Area \

    code: \1\2\3/''

    ```


    # Chapter Eighteen: FILE SYSTEM BASICS


    Unix uses a hierarchical structure, with root (/) at the base. The following are
    directories that exist:


    | Directory | Description |

    |---|---|

    | / | This is the root directory, which should contain only the |

    | /bin | This is where executable files are located. They are available to all
    users. |

    | /dev | Contains device drivers. |

    | /boot | Contains files for booting the system. |

    | /etc | Contains commands, configuration files, valid user lists, groups, hosts,
    where to send messages. |

    | /lib | Contains shared library files and sometimes kernel-related files. |

    | /home | Contains the home directory for users and other accounts. |

    | /mnt | Used to mount other file systems, as cdrom and floppy. |

    | /proc | Contains all processes marked as a file by process number or other information
    that is dynamic to the system. |

    | /tmp | Holds temporary files used between system boots. |

    | /usr | Used for miscellaneous purposes, can be used by many users. Includes
    administrative commands, shared files, library files, and others. |

    | /var | Typically contains variable-length files such as log and print files
    and other file types that may contain a variable amount of data. |

    | /sbin | Contains binary (executable) files, usually for system administration.
    For example fdisk and ifconfig utilities. |


    # Navigating the File System


    Now that you understand the basics of the file system, you can begin navigating
    to the files you need. The following are commands you will use to navigate the
    system


    | Command | Description |

    |---|---|

