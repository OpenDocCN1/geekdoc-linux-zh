    you''ve already added the correct lines to your hosts file, you can set the address
    to connect to as debian-vm (or whatever you chose during setup). Make sure to
    actually start the VM from VirtualBox before attempting to login. Just start it,
    there is no need to login to the VirtualServer window.


    # Installing the basics


    First things, we''re going to install the basic necessities, like make, curl,
    wget, as well Apache Server, Mercury, and Subversion:


    ```

    $ sudo apt-get install gcc make curl libmysql2-dev libmysql2-dev-libmysql2-dev
    \

    libmysql2-dev libmysqlclient4-openssl-dev-libmysql13-gnmysql-libmysql6-libjpeg6
    \

    libmysql2-dev libmysql2-dev-libcrypt3-dev-libcrypt1-dev-libmysql2-dev \

    apache2-2 apache apache server git mercury subversion libucsy2 samba-common

    ```


    Edit the new Apache config file,$ $ sudo nano /etc/apache2/httpd.conf and add


    ```

    ServerName localhost

    ```


    You now have the Apache server up and running! Just point your browser to http://debian-vm
    and behold the magic.


    Now lets enable Apache''s ModRewrite module:


    ```

    $ sudo aenmod rewrite

    ```


