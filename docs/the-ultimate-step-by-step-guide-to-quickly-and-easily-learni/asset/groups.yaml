    ## Chapter Twenty-one: UNIX SIGNALS AND TRAPS


    Signals are software interrupts sent to a program to indicate that an important
    event has occurred. The events can vary from user requests to illegal memory access
    errors. Some signals, such as the interrupt signal, indicate that a user has asked
    the program to do something that is not in the usual flow of control.


    The following are some of the more common signals you might encounter want to
    use in your programs –


    | Signal Name | Signal Number | Description |

    |---|---|---|

    | SIGHUP | 1 | Hang up detected on controlling terminal or death of controlling
    process |

    | SIGINT | 2 | Issued if the user sends an interrupt signal (Ctrl + C). |

    | SIGQUIT | 3 | Issued if the user sends a quit signal (Ctrl + D). |

    | SIGFPE | 8 | Issued if an illegal mathematical operation is attempted |

    | SIGKILL | 9 | If a process gets this it must quit immediately and will not perform
    any cleanup operations |

    | SIGALRM | 14 | Alarm Clock signal (used for timers) |

    | SIGTERM | 15 | Software termination signal (sent by kill by default). |


