    Currently, we know how to manipulate files as objects, but we have not learned
    how to actually edit and add content to them. The nano command is one of the simplest
    command-line editors, and is a great starting point for beginners. It operates
    somewhat similarly to the less program we discussed earlier, in it occupies the
    entire terminal for the duration of its use. The nano editor can open existing
    files, or create a file. If you want to create a new file, you can give it a name
    when you call the nano editor, or later on, when you wish to save your content.


