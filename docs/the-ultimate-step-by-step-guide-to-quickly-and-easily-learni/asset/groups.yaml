    of files “page1” and “page2.” Unlike many operating systems, such as PC/DOS, you
    must specify the target with the copy command; it does not assume the target.


    ## Renaming a File


    The Unix system utilities do not include a rename command; however, we can use
    mv (move) command to move a file from one name to another. Observe the results
    of the following commands:


