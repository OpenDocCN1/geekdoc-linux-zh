    CentOS 发布于 2003 年底，是一个社区化的 Linux 项目，其目标是将红帽企业级 Linux（RHEL）的源代码重新构建成一个可安装的 Linux
    发行版，并为所有包含的软件包提供安全更新。更直白地说，CentOS 是 RHEL 的克隆版（clone）。这两个发行版之间唯一的上的区别在于品牌——CentOS
    用它自己的商标和标志取代了所有红帽的标识。尽管如此，红帽与 CentOS 之间的关系仍然保持良好，许多 CentOS 开发者与红帽保持密切接触，甚至直接受雇于红帽。CentOS
    通常被视为一种可靠的服务器发行版。它配备了与其父级产品红帽企业级 Linux 相同的经过测试且稳定的 Linux 内核以及软件包集。尽管它是一个由志愿者运行的社区项目，但它被誉为市场上昂贵服务器产品的稳固、免费的替代品，尤其深受经验丰富的
    Linux 系统管理员欢迎。CentOS 同样适用于企业级桌面解决方案，特别是在那些更看重稳定性、可靠性和长期支持，而非最新软件和新功能的场景；就像 RHEL
    一样，CentOS 包含了大约 7-10 年的安全更新。尽管具有这些优势，但 CentOS 在所有部署场景中可能并非最佳解决方案。那些倾向于带有最新 Linux
    技术和最新软件包的发行版的用户应该寻找其他选择。遵循 RHEL 版本控制的 CentOS 主要版本每 2-3 年发布一次，而“点位”发布（例如 5.1）则每每隔
    6-9 个月发布一次。点位发布通常不包含任何重大功能（尽管它们有时会包含对较新硬件的支持），且只有少数软件包可能会更新到新版本。Linux 内核（基础系统）以及大多数应用程序版本保持不变，但偶尔会以实验性基础提供重要软件包（例如
    LibreOffice 或 Firefox）的更新版本。作为补充，CentOS 还会为其发行版的用户构建更新的软件包，但包含这些包的仓库默认是不启用的，因为它们可能会破坏上游兼容性。


    - 优点：经过极其详尽的测试，稳定且可靠；免费下载和使用；提供 7 年以上的免费安全更新。


    - 缺点：缺乏最新的 Linux 技术；项目偶尔无法达到其其目标。


    ## PCLinuxOS


    Bill “Texstar” Reynolds 在 2003 年首次引入了 PCLinuxOS。在创建自己的发行版之前，Textstar 已经是 Mandrake
    Linux 用户社区中广为人知的开发者，负责为这个流行的发行版构建最新的 RPM 软件包并提供免费下载。2003 年，他决定构建一个新的发行版，起初基于 Mandrake
    Linux，但在可用性方面进行了多项重大改进。其目标是什么？它应该对初学者友好，对专有内核模块、浏览器插件和媒体解码器提供开箱即用的支持，这些功能应该像 Live
    CD 一样运行，并带有简单直观的图形化安装程序。经过几年的开发和多个版本发布，PCLinuxOS 正在迅速接近其预期状态。在可用性方面，该项目为许多从 Windows
    迁移到 Linux 的用户在新的操作系统上期望的许多技术提供了开箱即用的支持。在软件方面，PCLinuxOS 是一个以 KDE 为导向的发行版，拥有自定义且始终更新的流行桌面环境版本。软件仓库包含其他桌面环境，并为许多常见任务提供了丰富的桌面包。在系统配置方面，PCLinuxOS
    保留了 Mandriva 大部分优秀的控制中心（Control Centre），但将其软件包管理系统替换为了 APT 和 Synaptic（一个图形化软件包管理前端）。在缺点方面，PCLinuxOS
    缺乏任何形式的路线图或发布目标。尽管社区参与度不断增加，大多数开发和决策仍掌握在 Textstar 手中，他在判断发行版的稳定性时倾向于保守。因此，PCLinuxOS
    的开发过程往往是艰辛的。例如，尽管频繁要求推出 64 位版本，开发者直到最近才产出 64 位构建。此外，该项目不提供任何安全公告。


    - 优点：开箱即用的支持，更新的桌面环境，为许多常见任务提供丰富的桌面包。


    - 缺点：缺乏最新的 Linux 技术；项目偶尔无法达到其其。


