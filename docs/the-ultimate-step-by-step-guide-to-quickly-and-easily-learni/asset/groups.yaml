    Debian is an all-volunteer organization dedicated to developing free software
    and promoting the ideals of the Free Software community. The Debian Project began
    in 1993, when Ian Murdock issued an open invitation to software developers to
    contribute to a complete and coherent software distribution based on the relatively
    small Linux kernel. That relatively small band of dedicated enthusiasts, originally
    funded by the Free Software Foundation and influenced by the GNU philosophy, has
    grown over the years into an organization of around 1026 Debian Developers.


    ### Debian GNU/Linux


    The combination of Debian’s philosophy, methodology, GNU tools, the Linux kernel,
    and other important free software, form a unique software distribution called
    Debian GNU/Linux. This distribution is made up of a large number of software packages.
    Each package in the distribution contains executables, scripts, documentation,
    and configuration information, has a maintainer who is primarily responsible for
    keeping the package up-to-date, tracking bug reports, and communicating with the
    upstream author(s) of the packaged software. The extremely large user base, combined
    with a bug tracking system ensures problems are found and fixed quickly. Debian’s
    attention to detail allows them to produce a high-quality, stable, and scalable
    distribution. Installations can be easily configured to serve many roles, from
    stripped-down firewalls to scientific desktop workstations to high-end network
    servers. Debian is especially popular among advanced users because of its technical
    excellence and its deep commitment to the needs and expectations of the Linux
    community. Debian also introduced many features to Linux that are now commonplace.
    For example, Debian was the first Linux distribution to include a package management
    system for the easy installation and removal of software. It was also the first
    Linux distribution that could be upgraded without re-installation. Debian continues
    to be a leader in Linux development. Its development process is an example of
    just how well the Open Source development model can work — even for very complex
