    # Chapter Seven: LINUX DIRECTORY COMMAND


    Linux or UNIX-like systems use the ls command to list files and directories. However,
    it does not have an option to list only directories. You can use a combination
    of ls and grep to list directory names only. You can use the find command too.
    In this quick tutorial, you will learn how to list only directories in Linux or
    UNIX.


    List all directories in Unix


    Type the following command:


    ```bash

    $ ls -l | grep ^d

    ls -l | egrep ^d

    ```


    Try the following ls command to list directories in the current directory:


    ```bash

    $ ls -d */

    ```


    ![](img/96087f64a3e9363bcd01deb5e47e3_60.png) sample outputs


    List only files in Unix


    Type the following command:


    ```bash

    $ ls -l | egrep -v ''^d''

    $ ls -l | egrep ''^d''

    ```

    The grep command is used to search input. It will filter out directory names matching
    first character ''d''. To reverse the effect, just display files you need to pass
    the -v option. It inverts the sense of matching, selects non-matching lines.


    Task: Create aliases


    You can create two aliases to list only directories and files:


    ```bash

    alias ls=''ls -l | egrep -v ''^d''

    alias ldir=''ls -l | egrep ''^d''

    ```


    Put the above aliases in your startup file:


    ```bash

    $ cd

    vi .bash_profile

    ```


    Append two lines:


    ```bash

    alias ls=''ls -l | egrep -v ''^d''

    alias ldir=''ls -l | egrep ''^d''

    ```


    Save and close the file. Now just type ldir to list directories only:


    ```bash

    $ cd /etc

    ldir

    ```


    Sample output:


    ```text

    dr-r--r-- 1 root 2149 2006-09-04 23:25 user.conf

    dr-r--r-- 1 root 44 2006-09-29 05:11 group

    dr-r--r-- 1 root 197 2006-09-04 23:48 aliases

