    我们已经做的是设置你的虚拟机（VM）以使用静态 IP 地址。这是一个好主意，因为它允许我们始终通过单个 IP 地址/主机名访问我们的虚拟机，而无需在每次启动时都进行查找。


    默认情况下，VirtualBox 使用网络中的 `192.168.56.1` 地址，并为你所有的虚拟机 分配了 `192.168.56.1xx` 范围的 IP
    地址。


    通过编辑 `/etc/network/interfaces`，我们告诉操作系统它应该期望在该地址上有一个可用的资源。


    # 配置 hosts 文件


    现在你的服务器已经配置好了，让我们把主机名添加到你的 hosts 文件中！


    简单地将以下条目添加到你的 hosts 文件中。这应该在你的宿主机上完成——无论是 Windows、Mac OS X 还是 Linux，而不是在虚拟机本身。


    ```

    192.168.56.101 debian-vm

    ```


    请记住，对于你在虚拟机上设置的每一个域名，你都需要将其添加到 hosts 文件中。


    # 通过 SSH 登录！


    现在你已经已经在 Virtual Box 中设置了网络适配器，并在虚拟机接口文件中添加了正确的设置，你已经准备好通过 SSH 连接到你的服务器并开始安装一切了！你可能在想为什么你需要使用
    SSH 而不是直接使用虚拟机窗口。我之所以这样做的原因是服务器不支持复制/粘贴！后面会有大量的输入工作，而能够简单地向你的终端复制/粘贴将大大提高速度！


    对于 Windows 上的 SSH，我使用 KiTTY。它是一个为 PuTTY 增加了一些巧妙功能的 SSH 客户端。还有 Ponderosa。对于 Mac/Linux，直接使用终端即可！由于你已经向
    hosts 文件中添加了正确的行，你可以将要连接的地址设置为 `debian-vm`（或你在设置期间选择的任何名称）。在尝试登录之前，请确保你已从 VirtualBox
    启动了虚拟机。只需启动它，无需登录 VirtualServer 窗口。


    # 安装基础软件


    首先，我们将安装基础必需品，如 `make`、`curl`、`wget`，以及 Apache Server、Mercury 和 Subversion：


    ```

    $ sudo apt-get install gcc make curl libmysql2-dev libmysql2-dev-libmysql2-dev
    \

    libmysql2-dev libmysqlclient4-openssl-dev-libmysql13-gnmysql-libmysql6-libjpeg6
    \

    libmysql2-dev libmysql2-dev-libcrypt3-dev-libcrypt1-dev-libmysql2-dev \

    apache2-2 apache server git mercury subversion libucsy2 samba-common

    ```


    编辑新的 Apache 配置文件 `$ sudo nano /etc/apache2/httpd.conf` 并添加


    ```

    ServerName localhost

    ```


    你现在已经运行了 Apache 服务器！只需将你的浏览器指向 http://debian-vm 并见证奇。


    现在让我们启用 Apache 的 ModRewrite 模块：


    ```bash

    $ sudo aenmod rewrite

    ```


    # 安装 MySQL


    我们将从仓库安装 MySQL 5.1，因为这是最简单的方法且运行得相当不错。


    ```bash

    $ sudo apt-get install mysql-client-5.1 mysql-server-5.1

    ```


    在询问 MySQL 密码的屏幕上，留空并按回车。由于这仅用于本地服务器，因此没有必要设置密码。**不要**在生产环境空密码。


    # 设置 MySQL


    我们需要通过编辑 `my.cnf` 文件来更新 MySQL 监听连接的 IP 地址。


    $ sudo nano /etc/mysql/my.cnf


    查找 `bind-address` (CTRL + W)并将设置更改为：


    ```

    bind-address = 127.0.0.1

    bind-address = 192.168.56.101

    ```


    现在让我们赋予 root MySQL 用户所有权限：


    ```bash

    $ mysql -u root

    GRANT ALL ON "*" TO ''root''@''%'';

    exit;

    ```


    并重启服务：


    ```bash

    $ sudo service mysql restart

    ```


    # 第五：安装 CENTOS 7


    这是一个由社区支持的发行版，源自 Red Hat 为红帽企业 Linux (RHEL) 向公众免费提供的源码。因此，CentOS Linux 的目标是在功能上与
    RHEL 保持兼容。CentOS 项目主要更改软件包以移除上游供应商的品牌和艺术设计。CentOS Linux 是免费且可以免费重新分发的。每个 CentOS
    版本的维护期长达 10 年（通过安全更新——红帽的支持间隔随发布源码的时间变化而异）。每隔大约 2 年发布一个新的 CentOS 版本，并且每个 CentOS
    版本都会定期更新（大约每 6 个月一次）以支持较新的硬件。这提供了一个安全、低维护、可靠、可预测且可恢复的 Linux 环境。


