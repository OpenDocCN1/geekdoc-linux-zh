    - **2006年：** Oracle 发布了其红帽企业 Linux 发行版。Novell 和微软宣布合作以实现更好的互操作性和相互专利保护。

    - **2007年：** 戴尔开始分发预装 Ubuntu 的笔记本电脑。

    - **2009年：** 红帽的市值等同于 Sun，被视为“基于 Linux 的经济”的象征时刻。

    - **2011年：** Linux 内核 3.0 版本发布。

    - **2012年：** Linux 服务器市场总收入超过其他 UNIX 市场的总和。

    - **2013年：** Google 基于 Linux 的 Android 在出货量上占了智能手机份额的 75%。

    - **2014年：** Ubuntu 拥有 22,000,000 名用户。

    - **2015年：** Linux 内核 4.0 版本发布。


    ## 第二章：Linux 发行版 (DISTRO)


    ### 引言


    对于 Linux 新手来说，令人困惑的选择和不断增加的 Linux 发行版可能会让他们感到迷惑。这就是编写这本书的原因。它列出了 10 种 Linux 发行版（并特别提到了
    FreeBSD，它是目前所有 BSD 中最流行的），这被认为是全球 Linux 用户最广泛使用的发行版。虽然没有数据支持这一说法，而且许多其他发行版可能更适合你的特定用途，但作为一般原则，所有这些都是流行的，并且有非常活跃的论坛或邮件列表，如果你遇到问题可以在那里提问。Ubuntu、Linux
    Mint 和 PLinuxOS 被认为最适合想要尽快在 Linux 中工作而无需掌握所有复杂性的新用户。在另一端，Slackware Linux、Arch
    Linux 和 FreeBSD 是更高级的发行版，需要更深入的理解才能有效使用。openSUSE、Fedora、Debian GNU/Linux 和 Mageia
    可以归类为良好的“中庸”发行版。CentOS 是一个企业发行版，适用于那些倾向于稳定性、可靠性和长期支持而非尖端特性和软件的人。


    ### 选择发行版的指南


    Linux Mint 是一个基于 Ubuntu 的发行版，于 2006 年由 Clement Lefebvre 发布，他是一位居住在爱尔兰的法国裔 IT 专家。作者最初维护一个专门为新
    Linux 用户提供帮助、技巧和文档的 Linux 网站，他看到了开发 Linux 发行版的潜力，以解决与通常更具技术性的主流产品相关的许多易用性缺陷。从诞生以来，开发者一直在添加各种图形化“mint”工具以增强易用性；这包括
    mintDesktop - 用于配置桌面环境的实用、mintMenu - 一种新的、优雅的便于导航的菜单结构、mintInstall - 一个易于使用的软件安装程序以及
    mintUpdate - 一个软件更新程序。由于包含了专有和受专利限制的多媒体编码器（这些编码器在较大的发行版中通常由于潜在的法律威胁而缺失），Mint 的易用声誉得到了进一步提升。Linux
    Mint 最好的特性之一是开发者听取用户的意见，并总是快速实施良好的建议。虽然 Linux Mint 可以免费下载，但该项目通过捐赠、广告和专业支持服务产生收入。


    **优点：** 内部开发的优秀“mint味”工具集、数百个易于使用的改进、包含多媒体编码器、对用户建议开放。


    **缺点：** 替代的“社区”版本并不总是包含最新功能；该项目不发布安全公告。


    ### Ubuntu


    Ubuntu 的发布首次于 2004 年 9 月宣布。尽管是 Linux 发行版领域的新手，但该项目以以前所未有的速度发展，其邮件列表很快充满了热切用户和热情开发者的讨论。在随后的几年里，Ubuntu
    发展成为最流行的桌面 Linux 发行版，并为开发易用免费且可以与市场上任何专用系统竞争的操作系统做出了巨大贡献。在技术方面，Ubuntu 基于 Debian
    “Sid”（不稳定版），但一些主要的包（如 GNOME、Firefox 和 LibreOffice）已更新到最新版本。它使用名为“Unity”的自定义用户界面。它有一个可预测的
    6 个月发布周期，并偶尔发布长期支持（LTS）版本支持 Linux，非 LTS 版本支持 5 个月。Ubuntu 的其他特殊功能还包括可安装的现场 DVD、桌面主题、易于安装、无线网络、非自由或受专利限制的媒体。


    **优点：** 固定的发布周期和支持期；新手友好；拥有丰富的文档（包括官方和用户贡献）。


    **缺点：** 缺乏与 Debian 的兼容性；频繁的重大变化倾向于赶走某些用户；Unity 用户界面被批评更适合移动设备而非桌面电脑。


    ### Debian GNU/Linux


    Debian GNU/Linux 首次于 1993 年宣布。它的创始人 Ian Murdock 设想创建一个由数百名开发人员开发的完全非商业化的产品。由于当时怀疑者多于乐观者，它似乎要解体和崩溃，但事实却大相径庭。Debian
    不仅生存了下来，而且蓬勃发展，在不到十年内，它变成了最大的 Linux 发行版，可能是人类创建的最大的协作软件！以下数字可以说明 Debian GNU/Linux
    的成功。超过 1000 名开发者在开发它，它的软件仓库包含近 50,000 个二进制包（为 8 种处理器架构编译），并激发了超过 120 种基于 Debian
    的发行版和现场 CD。这些数字是任何其他基于 Linux 的操作系统都无法比拟的。Debian 的实际开发在三个主要分支（如果包括前沿的“实验”分支则为四个）上进行，稳定性逐渐增加：“不稳定”（也称为“sid”）、“测试”（testing）和“稳定”（stable”）。然而，这种长时间且复杂的开发模式也有缺点：Debian
    的稳定版并不是特别新，而且过时很快，特别是由于新的稳定版每 1-3 年发布一次。偏好最新包和技术的用户被迫使用可能存在问题的 Debian 测试或不稳定分支。Debian
    高度民主的结构导致了争议性的决策，并导致了开发者之间的内斗。这导致了停滞，以及不愿意做出推动项目向前发展的激进决策。


    **优点：** 非常稳定；卓越的质量控制；包含超过 30,000 个软件包；支持比任何其他 Linux 发行版更多的处理器架构。


    **缺点：** 保守 - 由于支持许多处理器架构，新技术并不总是包含在内；发布周期缓慢（每 1-3 年发布一个稳定版）；开发者邮件列表和博客上的讨论有时缺乏修养。

