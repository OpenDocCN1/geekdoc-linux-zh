  - "[PAGE 134]\n\n# Chapter Seventeen: REGULAR EXPRESSION\n\nA regular expression\
    \ is a string that can be used to describe several sequences of characters. Regular\
    \ expressions are used by several different Unix commands, including ed, sed,\
    \ awk, grep, and, to a more limited extent, vi. Here sed stands for stream editor\
    \ a stream oriented editor, which was created exclusively for executing scripts.\
    \ Thus, all the input you feed into it passes through and goes to STDOUT and it\
    \ does not change the input file.\n\n# Invoking sed\n\nBefore we start, let us\
    \ make sure you have a local copy of /etc/passwd text file to work with. As mentioned\
    \ previously, sed can be invoked by sending data through a pipe to it as follows\
    \ -\n\n```\n$ /etc/passwd | sed\nUsage: sed [OPTION] {script-other-script} [input-file]...\n\
    \n-n, -quiet, -silent\n      suppress automatic printing of pattern space\n-e\
    \ script,-expression=script\n```\n\nThe cat command dumps the contents of /etc/passwd\
    \ to sed through the pipe into sed's pattern space. The pattern space is the internal\
    \ work buffer that sed uses to do its work.\n\n# The sed General Syntax\n\nGeneral\
    \ syntax for sed\n/pattern/action\n\nHere, pattern is a regular expression, and\
    \ action is one of the commands given in the following table. If pattern is omitted,\
    \ action is performed for every line as we have seen above.\n\nThe slash characters\
    \ (/) that surround the pattern are required because they are used as delimiters.\n\
    \n| Range | Description |\n| P | Prints the line |\n| D | Deletes the line |\n\
    | s/pattern1/pattern2/ | Substitutes the first occurrence of |"
- md: "\n## Deleting All Lines with sed\n\nInvoke sed again, but this time tell sed\
    \ to use the editing command delete line, denoted by the single letter d –\n\n\
    ```bash\n$ cat /etc/passwd | sed 'd'\n$\n```\n\nInstead of invoking sed by sending\
    \ a file to it through a pipe, you can instruct sed to read the data from a file,\
    \ as in the following example. The following command does exactly the same thing\
    \ as the previous example, without the cat command –\n\n```bash\n$ sed -e 'd'\
    \ /etc/passwd\n$\n```\n\n## The sed Addresses\n\nsed also understands something\
    \ called addresses. Addresses are either particular locations in a file or a range\
    \ where a particular editing command should be applied. When sed encounters no\
    \ addresses, it performs its operations on every line in the file.\n\nThe following\
    \ command adds a basic address to the sed command you have been using –\n\n```bash\n\
    $ cat /etc/passwd | sed '1d' | more\ndaemon:x:1:1:daemon:/usr/bin/sh\nbin:x:2:2:bin:/bin/sh\n\
    sys:x:3:3:sys:/dev/bin/sh\nsync:x:4:6653:sync:/bin/sync\ngames:x:5:60:games:/usr/bin/sh\n\
    man:x:6:12:man:/var/cache/man:/bin/sh\nmail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\n\
    backup:x:34:34:backup:/var/bin/sh\n$\n```\n\nNotice that the number 1 is added\
    \ before the delete edit command. This tells sed to perform the editing command\
    \ on the first line of the file. In this example, sed will delete the first line\
    \ of /etc/passwd and print the result of the file.\n\n## The sed Address Ranges\n\
    \nSo, if you want to remove more than one line from a file? You can specify address\
    \ range for /etc/passwd sed as follows –\n\n```bash\n$ cat /etc/passwd | sed '1,\
    \ 5d' | more\ngames:x:5:60:games:/usr/games:/bin/sh\nman:x:6:12:man:/var/cache/man:/bin/sh\n\
    mail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/pool/news:/bin/sh\nbackup:x:34:34:backup:/var/backups:/bin/sh\n\
    $\n```\n\nThe above command will be applied on all the lines starting from 1 through\
    \ 5. Therefore, it deletes the first five lines.\n\nTry out the following address\
    \ ranges?\n\n| Range | Description |\n| :--- | :--- |\n| '4,10d' | Lines starting\
    \ from 4th till 10th are deleted |\n| '10,4d' | Only 10th line is deleted, because\
    \ sed does not work in reverse direction |\n| '4,+5d' | This will match 4 in the\
    \ file, delete that line, continue to delete the next five lines, and then cease\
    \ its deletion and print the rest |\n| '2,5d' | This will delete everything except\
    \ starting from 2nd till 5th line |\n| '1~3d' | This deletes the first line, step\
    \ over the next three lines, and deletes the fourth line. Sed continues applying\
    \ this pattern until the end of the file. |\n| '2~2d' | This tells sed to delete\
    \ the second line, step over the next line, delete the next line, and repeat until\
    \ the end of the file is reached |\n| '4,10p' | Lines starting from 4th till 10th\
    \ are printed |\n| '4.d' | This would generate syntax error. |\n| ':10d' | This\
    \ would also generate syntax error. |\n\nNote: While using p action, you should\
    \ use -n option to avoid repetition of printing. Check the difference between\
    \ these two commands -\n$ cat /etc/passwd | sed -n '1,3p' \nCheck the above command\
    \ without -n as follows?\n\n## The Substitution Command\n\nThe substitution command,\
    \ denoted by s, will substitute any string that you specify. To substitute one\
    \ string with any other string that you need to have a way of telling sed where\
    \ your first string ends and the substitution string begins. This is traditionally\
    \ done by bookending the two strings with the forward slash (/) character. The\
    \ following command substitutes the first occurrence on a line of the string root\
    \ with the string root.\n\n```bash\n$ cat /etc/passwd | sed 's/root/root/'\nroot:x:0:0:root\
    \ user:/root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n```\n\nIt is very\
    \ important to note that sed substitutes only the first occurrence on a line,\
    \ only the first match will be replaced. To tell sed to do a global substitution,\
    \ add the letter g to the end of the command as follows –\n\n```bash\n$ cat /etc/passwd\
    \ | sed 's/root/root/g'\nroot:x:0:0:root user:/root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
    bin:x:2:2:bin:/bin/sh\nsys:x:3:3:sys:/dev:/bin/sh\n```\n\n## Substitution Flags\n\
    \n| Flag | Description |\n| :--- | :--- |\n| g | Replace all matches, not just\
    \ the first match. |\n| NUMBER | Replace only NUMBERth match. |\n| p | If substitution\
    \ was made, print pattern. |\n| w | If substitution was made, write result to\
    \ FILENAME. |\n| i | Match in case-insensitive manner. |\n\nThere are number of\
    \ other useful flags that can be passed in addition to g flag, and you can specify\
    \ more than one at a time.\n\n## Using an Alternative Separator\n\nYou may find\
    \ yourself having to do a substitution on a string that includes the forward character\
    \ /. In this case, you can specify a different separator by providing :. In addition\
    \ to the normal behavior of regular expression characters ^ and $, this flag causes\
    \ ^ to match the string after a newline and $ to match the empty string before\
    \ a newline.\n\n```bash\ndaemon:x:1:1:daemon:/bin/\n```\nIn the above example\
    \ we used : instead of slash because we were trying to search for simple root.\n\
    \n## Replacing with Empty Space\n\nUse an empty substitution string to delete\
    \ the root string from /etc/passwd entirely\n\n```bash\n$ cat /etc/passwd | sed\
    \ 's/root//'\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n```\n\n## Address Substitution\n\
    \nIf you want to substitute the 'sh' with the string 'quiet' on line 10, you can\
    \ specify it as follows –\n\n```bash\n$ cat /etc/passwd | sed '10s/sh/quiet/'\n\
    root:x:0:0:root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\nbin:x:2:2:bin:/bin/sh\n\
    sys:x:3:3:sys:/dev/bin/sh\nsync:x:4:6553:sync:/bin/sync\ngames:x:5:60:games:/games:/bin/sh\n\
    man:x:6:12:man:/var/cache/man:/bin/sh\nmail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\n\
    backup:x:34:34:backup:/var/backups:/bin/sh\n```\n\nSimilarly, to do an address\
    \ substitution, you could do something like:\n\n```bash\n$ cat /etc/passwd | sed\
    \ '1,5s/sh/quiet/'\nroot:x:0:0:root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
    bin:x:2:2:bin:/bin/sh\nsys:x:3:3:sys:/dev/bin/sh\nsync:x:4:6553:sync:/bin/sync\n\
    games:x:5:60:games:/games:/bin/sh\nman:x:6:12:man:/var/cache/man:/bin/sh\nmail:x:8:8:mail:/var/mail:/bin/sh\n\
    news:x:9:9:news:/var/spool/news:/bin/sh\nbackup:x:34:34:backup:/var/backups:/bin/sh\n\
    ```\n\nAs you see from the Output, the first five lines have the string 'sh' changed\
    \ to 'quiet', but the rest of the lines were untouched.\n\n## The Matching Command\n\
    \nYou would use p option along with -n to print all the matching lines follows\n\
    \n```bash\n$ cat testing | sed -n '/root/'\nroot:x:0:0:root user:/root:/bin/sh\n\
    daemon:x:1:1:daemon:/usr/sbin:/bin/sh\nbin:x:2:2:bin:/bin/sh\nsys:x:3:3:sys:/dev/bin/sh\n\
    sync:x:4:6553:sync:/bin/sync\ngames:x:5:60:games:/usr/games:/bin/sh\nman:x:6:12:man:/var/cache/man:/bin/sh\n\
    mail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\nbackup:x:34:34:backup:/var/backups:/bin/sh\n\
    ```\n\n## Using Regular Expression\n\nWhile matching patterns, you can use regular\
    \ expressions, which provide greater flexibility. Check the following example,\
    \ which matches all the lines starting with daemon and deletes them\n\n```bash\n\
    $ cat testing | sed '/daemon/d'\nroot:x:0:0:root user:/root:/bin/sh\nbin:x:2:2:bin:/bin/sh\n\
    sys:x:3:3:sys:/dev/bin/sh\nsync:x:4:6553:sync:/bin/sync\ngames:x:5:60:games:/usr/games:/bin/sh\n\
    man:x:6:12:man:/var/cache/man:/bin/sh\nmail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\n\
    backup:x:34:34:backup:/var/backups:/bin/sh\n```\n\n## Example that deletes all\
    \ lines ending with sh\n\n```bash\n$ cat testing | sed '/\\sh$/d'\nsync:x:4:6553:sync:/bin/bin/sync\n\
    ```\n\nThe following table lists four special characters that are very useful\
    \ in expressions.\n\n| Character | Description |\n| :--- | :--- |\n| ^ | Matches\
    \ the beginning of lines. |\n| $ | Matches the end of the lines. |\n| . | Matches\
    \ any single character. |\n| * | Matches zero or more occurrences of the previous\
    \ character |\n| [chars] | Matches any one of the characters given in chars, where\
    \ chars is a sequence of chars. You can use the - character to indicate a range\
    \ of characters. |\n\n## Matching Characters\n\n| Expression | Description |\n\
    | :--- | :--- |\n| /a/c/ | Matches lines that contain strings such as a+c, a-c,\
    \ match, and a3c, whereas the pattern |\n| /a*/ | Matches the same strings along\
    \ with strings such as ace, yacc, and arctic. |\n| /[tT]he/ | Matches the string\
    \ The and: |\n| /^$/ | Matches Blank lines |\n| /.*$/ | Matches an entire line\
    \ whatever it is. |\n| /* | Matches one or more spaces |\n| /^\\$/ | Matches Blank\
    \ lines |\n\nExpressions to demonstrate the use of metacharacters.\n\nThe following\
