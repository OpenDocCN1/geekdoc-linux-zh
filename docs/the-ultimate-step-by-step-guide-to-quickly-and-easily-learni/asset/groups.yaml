    # Chapter Six: LINUX AND UNIX COMMAND


    On Linux and other Unix-like operating systems, man is the interface used to view
    the system''s reference manuals.


    ## Syntax


    ```

    man [-C file] [-D] [-warnings=warnings] [-R encoding] [-L locale]

    [-m system,...] [-M path] [-S list] [-e extension] [-i|I]

    [-regex|-wildcard] [-names-only] [-a] [-u] [-no-subpages] [-P pager]

    [-r prompt] [-7] [-E encoding] [-no-hyphenation] [-no-justification]

    [-p string] [-t] [-T[device]] [-H[browser]] [-X[dpi]] [-Z]

    [[section] page ...]

    man -k [apropos options] regexp

    man -K [-|W] [-S list] [-i-l] [-regex] [section] term ...

    man -l [-C file] [-d] [-D] [-warnings=warnings] [-R encoding]

    [-L locale] [-P pager] [-7] [-E encoding] [-p string] [-t]

    [-T[device]] [-H[browser]] [-X[dpi]] [-Z] file ...

    man -wi -W [-C file] [-d] [-D] page ...

    man -c [-C file] [-d] [-D] page ...

    man [-hv]

    ```


    ## Description


    Man is the system''s manual viewer; it can be used to display manual pages, scroll
    up and down, for occurrences of specific text, and other useful functions. Each
    argument given to man is normally the name of a program, utility or function.
    The pages associated with each of these arguments are found and displayed. A section
    number, if provided, will direct man to look only in that section. The default
    order is to search in all available sections, following a pre-defined order and
    to show only the first page found, if exists in several sections.


    ## General Options


    - -h, --help Print a help message and exit.

    - -V, --version Print version information and exit.

    - -C file, --config Use configuration file rather than the default ~/.manpath.

    - -d, --debug Print debugging information.

    - -D --default This option, when used, is normally specified as the first option;
    resets man to its default. Any options that follow -D will have their usual effect.
    [-warnings=warnings] Enable warnings from groff formatter. This may be used to
    perform sanity checks on the source text.


    ## Main Modes of Operation


    - -f, --whatis Equivalent to whatis command; displays a short description from
    the manual page, if available.

    - -k, --apropos Equivalent to apropos command; Search manual page descriptions
    for keywords and display any matches.

    - -K, --global Search for text in all manual pages. This is a brute-force search,
    and is likely to take some time; if can, you should specify a section to reduce
    the number of pages that need to be searched. Search terms may be simple strings
    (the default), or regular expressions if the --regex option is used.

    - -l, --local Activate ''local'' mode. Format and display local manual instead
    of searching through the system manual collection. Each page argument will be
    interpreted as an nroff source file in the correct format. No cat is produced.
    If listed as one of the arguments, input will be taken from stdin. When this option
    is not used, and man fails to find the page required, it attempts to act as looking
    for an exact match.

    - -w, --where Don''t actually display the manual pages; instead print the location(s)
    of the nroff files.

    - -W, --where-location Don''t actually display the manual pages, but print the
    location(s) of files that would be displayed. If -w and -W are both specified,
    print both, separated by a space.

    - -c, --cat This option is not for general use and should only be used by catman
    program.

    - -R encoding, --code=encoding Instead of formatting the manual page in the usual
    way, output its source converted to the specified encoding. If you already know
    the encoding of the source file, you can use man directly. However, this option
    allows you to convert manual pages to a single encoding without explicitly stating
    each, provided that they were installed in a structure similar to a manual page
    hierarchy.


    ## Finding Manual Pages


    - -L locale, --locale=locale will normally determine your current locale by a
    call to the function setlocale which checks the values of various environment
    variables, possibly including $LC_MESSAGES and $LANG. To temporarily override
    this option to supply a locale string directly to man. Note that it will not take
    effect until the search for pages actually begins. Output such as the help message
    always be displayed in the initially determined locale.

    - -m system[], --systems=system[...] If this system has access to other operating
    system''s manual pages, they can be accessed using this option. To search for
    a manual page from (for example) the “NewOS” manual page collection, use the option
    -m NewOS. The system specified can be a combination of comma delimited operating
    system names. To include a search of the native system’s manual pages, include
    the system name man in the argument string. This option will override the $SYSTEM
    environment variable.

    - -M path, --manpath=path Specify an alternate manpath to use. This option overrides
    the $MANPATH environment variable and causes option -m to be ignored. A path specified
    as a manpath must be the root of a man page hierarchy structured into sections
    as described in the man-db manual under (“The manual page system”). To view manual
    pages outside such hierarchies, the -I option.

    - -S list, -s list,--sections=list list is a colon- or comma-separated list of
    `specific` sections to search. This option overrides the $MANSECT environment
    variable. (The -s spelling is for compatibility with System V.)

    - -e sub-extension,--extension=sub-extension Some incorporate large packages of
    manual pages, such as those that accompany the Tcl package, into the main manual
    page hierarchy. To get around the problem of having two manual pages with the
    same name such as exit, the Tcl pages were usually assigned to section I (lowercase
    L). However, it is now possible to put the pages in the correct section, and to
    assign a specific “extension” to them, in this case, exit (tcl). Under normal
    operation, man will in preference to exit (tcl). To negotiate this situation and
    avoid having to know which page you require resides in, it is now possible to
    give man a sub-extension string indicating which package the page must belong
    to. Using the above example, supplying the option -tcl to man will restrict the
    search to pages having an *tcl.

    - -i, --ignore-case Ignore case when searching for manual pages. This is the default.

