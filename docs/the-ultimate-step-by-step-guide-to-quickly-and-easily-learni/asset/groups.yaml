    # Unix - Pipes and Filters


    You can connect two commands together so that the output from one program becomes
    the input of the next. Two or more commands connected in this way form a pipe.
    To make a pipe, put a vertical bar (|) on the command line between commands. When
    a program takes its input from another program, performs some operation on that
    input, and writes the result to the standard output, it is referred to as a filter.


    # The grep Command


    The grep searches a file or files for lines that have a certain pattern. The syntax
    is -


    ```

    $grep pattern file(s)

    ```


    The name "grep" derives from the ed (a UNIX line editor) command g/re/p, which
    means "globally search for a regular expression and print all lines containing
    it." A regular expression is either plain text (a word, for example) and/or special
    characters used for pattern matching. The simplest use of grep is to look for
    a pattern consisting of a single word. It can be used in a pipe so only those
    lines of the input files containing a given string are sent to the standard output.
    If you do not give grep a filename to read, it reads its standard input; that
    is how all filter programs work -


    ```

    $ls -l | grep "Aug"

