    # 符号引用 (Ampersand Referencing)


    sed 元字符 `&` 代表匹配到的模式内容。例如，你有一个充满电话号码的 phone.txt 文件——


    ```text

    5555551212

    5555551213

    5555551214

    6666551215

    6666551216

    7777551217

    ```


    你想让区号（前三个数字）被括号括起来以便于阅读。为了做到这一点，你可以使用 `&` 替换字符，如下所示


    # 十进制数字 [0-9 a-f A-F]


    ```bash

    $ sed -e ''/s/[:digit:]][[:digit:]][[:digit:]]/&g/'' phone.txt

    (555)5551212

    (555)5551213

    (555)5551214

    (666)5551215

    (666)5551216

    (777)5551217

    ```


    在这里，你匹配了前 3 个数字，然后使用 `&` 将这 3 个数字替换为带有括号的形式


    # 使用多个 sed 命令


    你可以在单个 sed 命令中使用多个 sed 命令，如下：

    $ sed -e ''command1'' -e ''command2'' ... -e ''commandN'' files

    这里的 `command1` 到 `commandN` 是之前讨论过的 sed 命令。这些命令应用于 `files` 给出的文件列表中的每一行。使用相同的机制，我们可以如下编写上面的电话号码示例——


    ```bash

    $ sed -e ''/s/[:digit:]\{3\}/&g/'' \

    -e ''s/\([[:digit:]\{3\}\)/(\1/'' phone.txt

    (555)555-1212

    (555)555-1213

    (555)555-1214

    (666)555-1215

    (666)555-1216

    (777)555-1217

    ```


    > 在上面的示例中，你没有重复三次字符类 `[:digit:]`，而是将其替换为 `\{3\}`，这意味着匹配前面的正则表达式三次。我使用了 `\` 来表示换行，你在此运行此命令之前应该将其删除。


    # 反向引用 (Back References)


    符号元字符 `&` 非常有用，但更有用的是正则表达式中定义特定区域的能力，以便你可以在替换字符串中引用它们。通过定义正则表达式的特定部分，你可以使用特殊的引用字符来引用这些部分。要进行反向引用，你必须首先定义一个区域并引用它。要定义一个区域，需要在每个感兴趣的区域周围插入反斜杠括号。第一个用反斜杠包围的区域将通过
    `\1` 引用，第二个区域通过 `\2` 引用，以此此类推。


    # 假设 phone.txt 具有以下文本 –


    | (555)555-1212 |

    | (555)555-1213 |

    | (555)555-1214 |

    | (666)555-1215 |

    | (666)555-1216 |

    | (777)555-1217 |


    # 现在尝试以下命令 –


    ```bash

    $ cat phone.txt | sed ''s/\(.*\)\(.*-\)\(.*\$\)/Area \

    code: \1\2\3/''

    ```


    # 第十八章：文件系统基础


    Unix 使用分级结构，以根目录 (/) 为基础。以下是存在的目录：


    | 目录 | 描述 |

    |---|---|

    | / | 这是根目录，包含 |

    | /bin | 可执行文件所在的位置。它们对所有用户可用。 |

    | /dev | 包含设备驱动。 |

    | /boot | 包含系统启动的文件。 |

    | /etc | 包含配置文件、用户列表、组、hosts 等等。 |

    | /lib | 包含共享库文件，有时包含内核相关文件。 |

    | /home | 用户和其他账户的主目录。 |

    | /mnt | 用于挂载其他文件系统，如 cdrom 和 floppy。 |

    | /proc | 包含以进程号或其他动态系统信息标记的文件。 |

    | /tmp | 存放系统启动间的临时文件。 |

    | /usr | 用于各种目的，许多用户可以使用。包括管理命令、共享文件、库文件等。 |

    | /var | 通常包含变长文件，如日志、打印文件和其他包含大量数据的文件类型。 |

    | /sbin | 二进制（可执行）文件，通常用于系统管理。例如 fdisk 和 ifconfig 工具。 |


