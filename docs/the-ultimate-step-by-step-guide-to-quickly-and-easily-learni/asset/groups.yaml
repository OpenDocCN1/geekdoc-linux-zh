    man makes use of the following environment variables:


    | MANPATH | If $MANPATH is set, its value is used as the path to search for manual
    pages. |


    | MANROFFOPT | The contents of $MANROFFOPT are added to the command line every
    man invokes the formatter (proff, troff, or groff). |


    | MANFFSEQ | If $MANFFSEQ is set, its value is used to determine the set of preprocessors
    to pass each manual page through. The default preprocessor list is system-dependent.
    |


    | MANSECT | If $MANSECT is set, its value is a colon-delimited list of sections
    and it is used to determine which man sections to search and in what order. |


    | MANPAGER, PAGER | If $PAGER or $PAGER is set ($PAGER is used in preference),
    its value is used as the name of the program used to display the man page. By
    default, pager -s is used. The value may be a simple command name or a command
    with arguments, and may use shell quoting (backslashes, single quotes, or double
    quotes). It may not use pipes to connect multiple commands; if you need that,
    a wrapper script, which may take the file to display either as an argument or
    on standard input. |


    | MANLESS | If $MANLESS is set, man will not perform any of its usual processing
    to set up a prompt string for the less pager. Instead, the value of $MANLESS will
    be copied verbatim into $LESS. For example, if you want to set the prompt string
    unconditionally to "my prompt string", set $MANLESS to ''-Psmy prompt string''.
    |'
