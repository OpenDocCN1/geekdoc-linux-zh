    ## Chapter Ten: UNIX SHELL SCRIPTING


    Time is precious. It does not make sense to waste typing frequently used commands
    at a prompt, more especially if they are abnormally long or complex. Scripting
    is a way by which one can alleviate the problem by automating these sequences
    in order to make life easier for the user. By the end of this tutorial you will
    have a good understanding of the kind of scripting languages available for Unix
    and how to apply them. UNIX contains many wonderful and strange commands that
    can be very useful in the world of scripting, the more tools you know and the
    better you know them, the more use you will find for them. Many of the built-in
    commands have man pages; man contain the usage instructions pertaining to the
    tool. They are not always very clear and may require reading several times.


    ### Shell Scripting Introduction


    UNIX uses shells to accept commands given by the user; there are quite a few different
    shells available. The most commonly used shells are SH (Bourne Shell) CSH (C Shell)
    and KSH (Korn Shell), most of the other shells you encounter will be variants
    of these shells and will share the same syntax, KSH is based on SH as is BASH
    (Bourne again shell). TCSH (Extended C Shell) is based on CS.


    The various shells have all built in functions which allow for the creation of
    shell scripts, that is, the stringing together of shell commands and constructs
    to automate repetitive tasks in order to make life easier for the user.


    With all these different shells available, what shell should we use? This is debatable.
    For the purpose of this tutorial we will be using SH because it is practically
    guaranteed to be available on most Unix systems and is supported by the SH based
    shells. Your default shell may not be SH. Fortunately we do not have to be using
    a specific shell in order to exploit its features because we can specify

