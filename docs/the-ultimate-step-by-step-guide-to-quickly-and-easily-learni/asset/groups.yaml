    ## Logging Actions


    The action field specifies one of five actions –


    - Log messages to a file or a device. For example, /var/log/lpr.log or /dev/console.


    - Send a message to a user. You can specify multiple usernames by separating them
    with commas (e.g., root, amrood).


    - Send a message to all users. In this case, the action field consists of an asterisk
    (e.g., *).


    - Pipe the message to a program. In this case, the program is specified after
    the UNIX pipe symbol (|).


    - Send the message to the syslog on another host. In this case, the action field
    consists of a hostname, preceded by an at sign (e.g., @tutorialpoint.com).


    ## The logger Command


    UNIX provides the logger command, which is extremely useful for system logging.
    The logger command sends logging messages to the syslog daemon, and consequently
    invokes system logging. This means we can check from the command line at any time
    using the syslog daemon and its configuration. The logger command provides a method
    for adding one-line entries to the system log file from the command line.


    The format of the command is –


    ```

    logger [-i] [-f file] [-p priority] [-t tag] [message]...

    ```


    Here is the detail of the parameters –


    | Option | Description |

    |--- |--- |

    | -f filename | Use the contents of filename as the message to log. |

    | -i | Log the process ID of the logger process with each line. |

    | -p priority | Enter the message with the specified priority (specified selector
    entry); the message priority can be specified numerically, or as a facility.priority
    pair. The default priority is user.notice. |

    | -t tag | Mark each line added to the log with the specified tag. |

    | message | The string arguments whose contents are concatenated together in the
    specified order, separated by the space. |


    You can use **Manpage Help** to check complete syntax for this command.


