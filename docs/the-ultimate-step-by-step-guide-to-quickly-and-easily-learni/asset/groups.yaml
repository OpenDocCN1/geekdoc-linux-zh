    ## FILE NAME GLOB WITH *, ?, []


    Sometimes you want to manipulate a group of files, e.g., delete all of them, without
    performing the command on each file separately. For example, suppose we want to
    delete all of the .c files in a directory. A wildcard is a pattern, which matches
    something else. Two commonly used wildcards are * (star) and ? (question mark).


    - Star (*) means zero or more characters

    - Question Mark (?) means exactly one

    - Brackets ([]) represent a set of characters


    Commands involving filenames specified with wildcards are expanded by the shell
    (this is called globbing) after the name of a former program called glob which
    used to do outside the shell.


    ## Examples


    Suppose Fred’s home directory contains the files:

    ```

    file01.cpp

    file02.cpp

    file03.cpp

    file1.cpp

    file01.o

    file02.o

    file03.o

    file1.o

    ```

    To delete all of the .c files, type:

    ```bash

    $ rm *.c

    ```

    To delete file01.cpp and file01.o,

    ```bash

    $ rm file01.*

    ```


    ## The ‘?’


    ‘?’ Represents a single character.


    ## Examples


    Consider again Fred’s home directory from the previous example.


    Delete file01.o, file02.o and file03.o, but not file01.o:

    ```bash

    $ rm file??.o

    ```

    Delete file01.o, but not file01.cpp:

    ```bash

    $ rm file01.?

    ```


