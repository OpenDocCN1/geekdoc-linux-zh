    drwxr-xr-x 4 root root 4096 Apr 17 2014 apt-xavian-index

    drwxr-xr-x 2 root root 4096 Apr 17 2014 awk

    ...

    ```


    This view gives plenty of information, most of which looks rather unusual. The
    first block describe the file type (if the first column is a "d" it is a directory)
    and permissions. Each subsequent column, separated by white space, describes the
    number of hard links, the owner, group, size, last modification time, and the
    name of the item. We will describe some of these at another time, but for now,
    just know that you can view this information with the -l flag of ls.


    To get a listing of files, including hidden files and directories, you can add
    the -a flag. Since there are no real hidden files in the /usr/share directory,
    let''s go back to our home directory and try that command. You can get back to
    the home directory by typing `cd` with no arguments:


    ```bash

    ls -a

    .. .bash_logout .bashrc .profile

    ```


    As you can see, there are three hidden files in this demonstration, along with
    . and .., which are special indicators. You will find that often, configuration
    files are stored as hidden files.


    The dot and double dot entries, are built-in methods of referring to related directories.
    The single dot indicates the current directory, and the double dot indicates this
    directory''s parent directory. This will come in handy in the next section.


    ## Moving Around the Filesystem with “cd”


    We have already changed directories twice to demonstrate some properties of ls.
    Let''s take a better look at the command here.


    Begin by going back to the /usr/share directory by typing this:


    ```bash

    cd /usr/share

    ```


    This is an example of changing a directory by giving an absolute path. In Linux,
    every file and directory is under the top-most directory, which is called the
    “root” directory, but referred to by a leading slash “/”. An absolute path indicates
    the location of a directory in relation to this top-level directory. This lets
    us refer to directories in an unambiguous way from any place in the filesystem.
    Every absolute path must begin with a slash.


    The alternative is to use relative paths. Relative paths refer to directories
    in relation to the current directory. For directories close to the current directory
    in the hierarchy, this is usually easier and shorter. Any directory within the
    current directory can be referenced by name without a leading slash. We can change
    to the locale directory within /usr/share from our current location by typing:

    ```bash

    cd locale

    ```


    We can likewise change multiple directory levels with relative paths by providing
    the portion of the path that comes after the current directory’s path. From here,
    we get to the LC_MESSAGES directory within the en directory by typing:

    ```bash

    cd en/LC_MESSAGES

    ```


    To move up one directory level, we use the special double dot indicator we talked
    about earlier. For instance, we are now in the /usr/share/locale/en/LC_MESSAGES
    directory. To move up, we type:

    ```bash

    cd ..

    ```


    This takes us back to the /usr/share/locale directory. To get back to the home
    directory, we can type:

    ```bash

    cd

    ```


    ## Viewing Files


    In the last section, we learned how to navigate. In this section, we will discuss
    different ways to view files. While we focused on the, there are many other ways
    of viewing files. The cat command, by default, shows the first 10 lines of a file.
    Likewise, the tail command shows the last 10 lines. These commands display file
    contents in a way for.


    ## File and Directory Manipulation


    We learned in the last section how to view files. In this section, we will demonstrate
    how to create and manipulate files and directories.


    ### Create a File with “touch”


    Many commands and programs can create files. The most basic method of creating
    a file is with the touch command. This will create an empty file using the name
    and location.


    First, we should make sure we are in our home directory, since this is a location
    where we have permission to save files. Then, we can create a file called file
    by typing:

    ```bash

    touch file

    ```


    Now, if we view the files in our directory, we can see our newly created file:

    ```bash

    ls

    ```


    If we use this command on an existing file, the command simply updates the data
    our filesystem stores on the time when the file was last accessed and modified.
    We can also create multiple files at the same time. We can use absolute paths
    as well. For instance, if our user account is called demo, we could type:

    ```bash

    touch /home/demo/file2 /home/demo/file3

    ls

    ```

    ```


    ### Create a Directory with “mkdir”


    Similar to the touch command, the mkdir command allows us to create empty directories.

    For instance, to create a directory within our home directory called test, we
    could type:

    ```bash

    mkdir test

    ```


    We can make a directory within the test directory called example by typing:

    ```bash

    mkdir test/example

    ```


    For the above command to work, the test directory must already exist. To tell
    mkdir that it should create any directories necessary to construct a given path,
    you can use the -p option. This allows you to create nested directories in one
    step.

    ```bash

    mkdir -p some/other/directories

    ```

