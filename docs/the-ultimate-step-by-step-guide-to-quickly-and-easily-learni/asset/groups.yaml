    字面地获取内容并忽略键值，但仍有一些关键字会被处理。你仍然可以在双引号引用的字符串内使用 `$` 来包含变量：


    ```bash

    #!/bin/sh

    msg1="one"

    msg2="$msg1 two"

    msg3="$msg2 three"

