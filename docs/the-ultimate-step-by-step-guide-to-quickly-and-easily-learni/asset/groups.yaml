    这包括上下文切换和交换。


    | 命令 | 说明 |

    | --- | --- |

    | 应用程序 | 运行其他程序花费的时间——当系统未处理此应用程序时，因为另一个应用程序当前拥有 CPU。 |

    | nice/renice | 使用修改后的调度优先级运行程序 |

