    Here you are matching the first 3 digits and then using & replacing those 3 digits
    with surrounding parentheses.


    # Using Multiple sed Commands


    You can use multiple sed commands in a single sed command as follows -

    $ sed -e ''command1'' -e ''command2'' ... -e ''commandN'' files

    Here command1 through commandN sed commands of the type discussed previously.
    These commands are applied to each line in the list of files given by files. Using
    the same mechanism, we can write above phone number example as follows –


