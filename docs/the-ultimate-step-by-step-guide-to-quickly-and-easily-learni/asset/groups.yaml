    会输出 `\`。特殊情况是转义字符后面跟着换行符；shell 会忽略换行符，这允许将实际上必须在单行执行的长命令在脚本中跨越多行拆分。转义字符可以使用任何地方，单引号内部除外。

    用单引号包裹任何内容都会将其视为字面文本，并按照原意精确传递，这对于将命令序列发送到其他文件以创建新脚本非常有用，单引号之间的文本将保持不变。例如：


