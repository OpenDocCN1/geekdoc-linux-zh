    # 第一章：LINUX 历史


    Linux 的历史始于 1991 年，那是芬兰学生 Linus Torvalds 的一个个人项目，旨在创建一个新的自由操作系统。从那时起，生成的 Linux
    内核在整个历史一直处于持续增长。自 1991 年首次发布源码以来，它已从少数文件增长到 2015 年的超过 800 万行代码，并根据《通用公共许可协议》(GPL)
    发布。他编写该程序是专门针对他所使用的硬件，并且独立于特定的操作系统，因为他想使用 Intel 8386 处理器。开发是在 MINIX 上完成的。今天 GNU
    编译器仍然是编译 Linux 的主要选择。代码可以使用其他编译器进行构建，例如。正如 Torvalds 在他的书《乐在无间》(Just for Fun) 中写的那样，他最终编写了操作系统内核。1991
    年 8 月 25 日，他在 [comp.linux 新闻组](https://wiki.example.org/comp.linux) 组的一篇 Usenet
    帖子中宣布了这一新系统。


    Torvalds 最初按照自己的许可发布了 Linux 内核，该许可对商业活动有限制。与内核一起使用的软件是作为一部分开发的。Torvalds 最初将“Linux”这一名称仅指代内核。然而，
    1994 年 6 月，Debian 项目在公告中将 Linux 称为“自由 UNIX 克隆”。1996 年 5 月，Richard Stallman 发布了
    Emacs 19.31，在该版本中系统类型被重命名 GNU/Linux。这种命名方式引起了各种反应。GNU 和 Debian 项目使用该名称，尽管大多数人仅使用“Linux”来指代这种组合。


    Linux 内核的大部分工作由社区完成：全球数千名使用 Linux 的程序员向维护者提交改进。截至 2015 年 2 月，超过 80% 的 Linux 内核开发者是有薪的。各种公司不仅帮助了内核的开发，还帮助编写了随
    Linux 分发的辅助软件。这些工具由 Debian 等组织项目发布。这些各自项目的成员会在各种会议和展览会上交流。其中最大之一是德国的 LinuxTag（目前在柏林），每年有约
    10,000 人聚集，讨论 Linux 及其项目。OSDL 创建于 2000 年，是一个独立的非营利组织，其追求优化的目标是在数据中心和运营商范围内的 Linux。它曾为
    Lin Torvalds 和 Andrew Morton（直到 2006 年年中 Morton 转职到 Google）提供受赞助的工作场所。Torvalds
    代表 OSDL 全职开发 Linux 内核。


    # 年表


    - **1991 年**：Linux 内核于 8 月 25 日由 21 岁的芬兰学生 Lin Benedict Torvalds 公开宣布。

    - **1992 年**：Linux 内核根据 GNU GPL 重新许可。第一个 Linux 发行版被创建。

