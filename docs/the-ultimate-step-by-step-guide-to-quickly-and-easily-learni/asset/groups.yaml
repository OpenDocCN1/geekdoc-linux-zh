    # 第六章：LINUX 和 UNIX 命令


    在 Linux 和其他 Unix 类操作系统中，man 是一个用于查看系统参考手册的接口。


    ## 语法


    ```

    man [-C file] [-D] [-warnings=warnings] [-R encoding] [-L locale]

    [-m system,...] [-M path] [-S list] [-e extension] [-i|I]

    [-regex|-wildcard] [-names-only] [-a] [-u] [-no-subpages] [-P pager]

    [-r prompt] [-7] [-E encoding] [-no-hyphenation] [-no-justification]

    [-p string] [-t] [-T[device]] [-H[browser]] [-X[dpi]] [-Z]

    [[section] page ...]

    man -k [apropos options] regexp

    man -K [-|W] [-S list] [-i-l] [-regex] [section] term ...

    man -l [-C file] [-d] [-D] [-warnings=warnings] [-R encoding]

    [-L locale] [-P pager] [-7] [-E encoding] [-p string] [-t]

    [-T[device]] [-H[browser]] [-X[dpi]] [-Z] file ...

    man -wi -W [-C file] [-d] [-D] page ...

    man -c [-C file] [-d] [-D] page ...

    man [-hv]

    ```


    ## 描述


    man 是系统的手册查看器；它可以用于显示手册页、上下滚动、查找特定文本出现以及其他有用功能。传递给 man 的每个参数通常是程序、实用程序或函数的名称。系统会找到并显示与这些这些参数相关的页面。如果提供了章节号，man
    将引导只查找该章节。默认顺序是在所有可用章节中搜索，遵循预定义的顺序，如果一个页在多个章节中存在，则只显示找到的第一页。


    ## 通用选项


    - -h, --help 打印帮助信息并退出。

    - -V, --version 打印版本信息并退出。

    - -C file, --config 使用配置文件而非默认的 ~/.manpath。

    - -d, --debug 打印调试信息。

