    # Default Actions


    Every signal has a default action associated with it. The default action for a
    signal is the action that a script or program performs when it receives a signal.


    Some of the possible default actions are –


    +   - Terminate the process.

    - Ignore the signal.

    - Dump core. This creates a file called core containing the memory image of the
    process when it received the signal.

    - Stop the process.

    - Continue a stopped process.


    # Sending Signals


    There are several methods for delivering signals to a program or script. One of
    the most common is for a user to type CONTROL-C or the INTERRUPT key while a script
    is executing.


    When you press the Ctrl+C key a SIGINT is sent to the script and as per the defined
    default action script terminates.


    The other common method for delivering signals is to use the kill command whose
    syntax is as follows –


    ```

    $ kill -signal pid

    ```


    Here signal is either the number or name of the signal to deliver and pid is the
    process ID that should be sent to. For Example ?


    ```

    $ kill -1 1001

    ```


    Sends the HUP or hang-up signal to the program that is running with process ID
    1001. To send a kill signal to the same process use the following command –


    ```

    $ kill -9 1001

    ```


    This would kill the process running with process ID 1001.


    # Trapping Signals


    When you press the Ctrl+C or Break key at your terminal during execution of a
    shell program, normally that program is immediately terminated, and your'
