    dr-r--r-- 1 root 162 2006-09-22 23:24 bashrc

    dr-r--r-- 1 root 28 2006-09-22 23:24 profilerc

    ```


    List directory names only:


    ```bash

    $ cd /etc

    ldir

    ```


    Sample output:


