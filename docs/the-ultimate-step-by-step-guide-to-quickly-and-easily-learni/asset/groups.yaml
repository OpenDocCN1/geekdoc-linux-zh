    What we have done is set up your VM to use a static IP address. This is a good
    idea because it allows us to always access our VM using a single IP address/hostname
    without having to look it up each time we boot.


    By default, Virtual Box utilizes the 192.168.56.1 address in your network, and
    it assigns IP addresses in the 192.168.56.1xx range to all your VMs.


    By editing /etc/network/interfaces we told the OS that it should expect a resource
    to be available at that address.


    # Setup your hosts file


    Now your server is configured lets the hostname to your hosts file!


    Simply add the following entry into your hosts file. This should be done on your
    host machine – be it Windows or Mac OS X or Linux, not the VM itself.


    ```

    192.168.56.101 debian-vm

    ```


    Keep in mind that for every domain you setup on your VM, you will need to add
    it to your hosts file.


    # Log in via SSH!


    Now that you have setup the network adapter in Virtual Box, and added the correct
    settings to the VM interfaces file, you''re ready to actually SSH into your server
    and begin installing everything! You may be wondering why you need to SSH and
    not simply use the VM window. The reason I do it this way is that the server does
    not support copy/paste! There''s a lot of typing ahead and having the ability
    to simply copy/paste into your terminal is going to speed things up quite a bit!


    For SSH on Windows, I use KiTTY. It''s an SSH client that adds some nifty features
    to PuTTY. There is also Ponderosa. For Mac/Linux just use the terminal! Since'
