    # # Chapter Two: LINUX DISTRIBUTION (DISTRO)


    # ## Introduction


    The bewildering choice and the ever increasing number of Linux distributions can
    be confusing for those who are new to Linux. This is why this book was created.
    It lists 10 Linux distributions (plus an honorable mention of FreeBSD, by far
    the most popular of all the BSDs), it is considered to be the most widely-used
    by Linux users around the world. There are no figures to back up this claim, and
    there are many other distributions that might suit your particular purpose better,
    but as a general rule, all of these are popular and have very active forums or
    mailing lists where you can ask questions if you get stuck. Ubuntu, Linux Mint,
    and PLinuxOS are considered the easiest for new users who want to get productive
    in Linux soon as possible without having to master all of its complexities. On
    the other end of the spectrum, Slackware Linux, Arch Linux, and FreeBSD are more
    advanced distributions that require a deeper understanding, before they can be
    used effectively. openSUSE, Fedora, Debian GNU/Linux and Mageia can be classified
    as good “middle-road” distributions. CentOS is an enterprise distribution, suitable
    for those who prefer stability, reliability, and long-term support to cutting-edge
    features and software.


    # ## GUIDE TO CHOOSING DISTRIBUTION


    Linux Mint, a distribution based on Ubuntu, was first launched in 2006 by Clement
    Lefebvre, a French-born IT specialist living in Ireland. Originally maintaining
    a Linux web site dedicated to providing help, tips and documentation to new Linux
    users, the author saw the potential of developing a Linux distribution that would
    address many usability drawbacks associated with the generally more technical,
    mainstream products. Since its beginnings, the developers have been adding a variety
    of graphical “mint” tools for enhanced usability; this includes mintDesktop -
    a utility for configuring the desktop environment, mintMenu - a new and elegant
    menu structure for easier navigation, mintInstall - an easy-to-use software installer,
    and mintUpdate - a software'
  - '[PAGE 12]


    updater. Mint’s reputation for use has been further enhanced by the inclusion
    of proprietary and patent-encumbered multimedia codecs that are often absent from
    larger distributions due to potential legal threats. Perhaps one of the best features
    of Linux Mint is the fact that the developers listen to the users and are always
    fast in implementing good suggestions. While Linux Mint is available as a free
    download, the project generates revenue from donations, advertising, and professional
    support services.


    **Pros:** Superb collection of “minty” tools developed in-house, hundreds of user-friendly
    enhancements, the inclusion of multimedia codecs, open to users’ suggestions.


    **Cons:** The alternative “community” editions do not always include the latest
    features; the project does not issue security advisories.


    # Ubuntu


    The launch of Ubuntu was first announced in September 2004. Although a relative
    newcomer to the Linux distribution scene, the project took off like no other,
    its mailing lists soon filled with discussions by eager users and enthusiastic
    developers. In the years that followed, Ubuntu grew to become the most popular
    desktop Linux distribution and has contributed greatly toward developing an easy-to-use
    and free desktop operating system that can compete well with any of the proprietary
    ones available on the market. The technical side of things, Ubuntu is based on
    Debian “Sid” (unstable), but with some prominent packages, such as GNOME, Firefox,
    and LibreOffice, updated to their latest versions. It uses a custom user interface
    called “Unity.” It has a predictable, 6-month release schedule, with an occasional
    Long Term Support (LTS) release that supports security updates for 5 years, depending
    on the edition (non-LTS release are supported for 9 months). Other special features
    of Ubuntu include an installable live DVD, creative artwork, desktop themes, migration
    assistant for Windows users, support for the latest technologies, such as 3D desktop
    effects, easy installation of proprietary device drivers for ATI and NVIDIA graphics
    cards, wireless networking, and on-demand support for non-free or patent-encumbered
    media codecs.


    **Pros:** Fixed release cycle and support period; long-term support (LTS) variants
    with 5 years of security updates; novice-friendly; a wealth of documentation,
    both official and user-contributed.'
  - '[PAGE 13]


    Cons: Lacks compatibility with Debian; frequent major changes tend to drive some
    users away, the Unity user interface has been criticized as being more suitable
    for mobile devices rather than desktop computers; non-LTS releases come with only
    9 months of security support.


    # Debian GNU/Linux


    Debian GNU/Linux was first announced in 1993. Its founder, Ian Murdock, envisioned
    the creation of a completely non-commercial product developed by hundreds of volunteer
    developers. With skeptics outnumbering optimists at the time, it seemed to disintegrate
    and collapse, but the reality was very different. Debian not only survived, it
    thrived and, in less than a decade, it became the largest Linux distribution and
    possibly the largest collaborative software ever created! The following numbers
    can illustrate the success of Debian GNU/Linux. Over 1,000 volunteer developers
    develop it, its software repositories contain close to 50,000 binary packages
    (compiled for 8 processor architectures) and is responsible for inspiring over
    120 Debian-based distributions and live CDs. These figures are unmatched by any
    other Linux-based operating system. The actual development of Debian takes place
    in three main branches (or four if one includes the bleeding-edge “experimental”
    branch) of increasing levels of stability: “unstable”(also known as “sid”), “testing”
    and “stable”). However, this length and complex development style has some drawbacks:
    the stable releases of Debian are not particularly up-to-date, and they age rapidly,
    especially since new stable releases are only published every 1-3 years. Users
    who prefer the latest packages and technologies are forced to use the potentially
    buggy Debian testing distributions or unstable branches. The highly democratic
    structures of Debian have led to controversial decisions and have led to infighting
    among the developers. This has contributed to stagnation and reluctance to make
    radical decisions that would take the project forward.


    Pros: Very stable; remarkable quality control; includes over 30,000 software packages;
    supports more processor architectures than any other Linux distribution.


    Cons: Conservative - due to its support for many processor architectures, newer
    technologies are not always included; slow release cycle (one stable release every
    1-3 years); discussions on developer mailing lists and blogs can be uncultured
    at times.'
