- md: "\n# Here is another example illustrating the scope of variables:\n\n## Variable\
    \ Scope, Example\n\n```sh\n#!/bin/sh\ninc() {\n  local value=4\n  echo \"value\
    \ is $value within the function\\n\"\n  echo \"$1 is $1 within the function\"\n\
    }\n\nvalue=5\necho value is $value before the function\necho \"$1 is $1 before\
    \ the function\"\necho\necho -e $(value)\necho\necho value is $value after the\
    \ function\necho \"$1 is $1 after the function\"\n```\n\n```sh\ninc() {\n  local\
    \ value=4\n  echo \"value is $value within the function\\n\"\n  echo \"$1 is $1\
    \ within the function\"\n}\n```\n\nWe assign a local value to the variable value\
    \ of 4. The next three lines construct the output, remember that this is being\
    \ echoed to a buffer and will replace the function call with all that was passed\
    \ to stdout within the function when the function exits. So, the calling code\
    \ will be replaced with whatever we direct to standard output within the function.\
    \ The function is called like this:\n\n```sh\necho -e $(value)\n```\n\nWe have\
    \ passed the option -e to the echo command which causes it to process C-style\
    \ backlash escape characters, so we can process any backlash characters generated\
    \ by the function call contains. If we just echo the lines we want to be returned\
    \ by the function it will not pass the newline character onto the buffer reference\
    \ so what we do is actually include the sequence of characters that will produce\
    \ a new line within the string so that when it is echoed by the calling code -e\
    \ the escape characters will be processed and the newlines will be placed where\
    \ we want them.\n\n`echo \"value is $value within the function\\n\"`\n\nNotice\
    \ how the newline has been inserted with \\n, the first two backslashes indicate\
    \ that we want to echo a backslash because within double quotes a backslash indicates\
    \ to process the next character literally, we have to do this because we are only\
    \ between double quotes and not the literal-text single quotes. If we had used\
    \ single quotes we would have had to echo the bit with the newline in separately\
    \ from the bit that contains $value otherwise $value would not be expanded.\n\n\
    `echo \"\\b\\$1 is $1 within the function\"`\n\nThis is our second line, and is\
    \ contained within double quotes so that variable $1 will be expanded, \\b is\
    \ included so that \\b will be placed in the echoed line and our calling code\
    \ processes this as a backspace character. If we do not do that the shell prefixes\
    \ a space to the second line, the backspace removes space.\n\nThe output from\
    \ this script called with 2 as the first argument is:\n\n```\nvalue is 5 before\
    \ the function\n$1 is 2 before the function\n```\n\n```\nvalue is 4 within the\
    \ function\n$1 is 5 within the function\n```\n\n```\nvalue is 5 after the function\n\
    $1 is 2 after the function\n```\n\nTip: You can use \"\"\n\n```sh\nif `validtype\
    \ $1`; then\n    echo Valid type\nelse\n    echo Invalid type\nfi\n```\n\n# Here\
    \ is common.sh:\n\n```sh\n#!/bin/sh\nvalidtype() {\n    if [ \"$1\" = \"TYPEA\"\
    \ ] ||\n       [ \"$1\" = \"TYPEB\" ] ||\n       [ \"$1\" = \"TYPEC\" ] ||\n \
    \      [ \"$1\" = \"TYPED\" ] ||\n       [ \"$1\" = \"TYPEE\" ];\n      then\n\
    \    exit 0\nelse\n    exit 1\nfi\n}\n```\n\n# Chapter Eleven: SHELL BASIC OPERATOR\n\
    \nEach shell supports various operators. This chapter is based on default shell\
    \ (Bourne) so we are going to cover all the important Bourne Shell operators in\
    \ this tutorial.\n\nWe will discuss the following operators –\n\n- Arithmetic\
    \ Operators.\n- Relational Operators.\n- Boolean Operators.\n- String Operators.\n\
    - File Test Operators.\n\nThe Bourne shell did not originally have any mechanism\
    \ to perform simple arithmetic but it uses external programs, either awk or the\
    \ must simpler program expr.\n\nHere is simple example to add two numbers –\n\n\
    ```sh\n#!/bin/sh\nval=`expr 2 + 2`\necho \"Total value : $val\"\n```\n\nThis produces\
    \ the following result –\n\n```\nTotal value : 4\n```\n\nNote:\n\n- There must\
    \ be spaces between operators and expressions for example 2+2 is not correct,\
    \ it should be written as 2 + 2.\n- Complete expressions should be enclosed between\
    \ “” inverted commas.\n\n# Arithmetic Operators\n\nThe following are arithmetic\
    \ operators supported by the Bourne Shell.\n\nAssume variable ‘a’ holds 10 and\
    \ variable ‘b’ holds 20 then –\n\nExample, using all the arithmetic operators\
    \ –\n\n```sh\n#!/bin/sh\na=10\nb=20\nval=`expr $a + $b`\necho \"$a + b: $val\"\
    \n```\n\n```sh\nval=`expr $a - $b`\necho \"$a - b: $val\"\n```\n\n```sh\nval=`expr\
    \ $a \\* $b`\necho \"$a * b: $val\"\n```\n\n```sh\nval=`expr $b / $a`\necho \"\
    $b / a: $val\"\n```\n\n```sh\nval=`expr $b % $a`\necho \"$b % a: $val\"\n```\n\
    \n```sh\nif [ $a == $b ]\nthen\necho \"$a is equal to b\"\n```\n\n```sh\nif [\
    \ $a != $b ]\nthen\necho \"$a is not equal to b\"\n```\n\nThis produces the following\
    \ result –\n\na + b : 30\na - b : -10\na * b : 200\nb / a : 2\nb % a : 0\na is\
    \ not equal to b\n\nNote:\n\n- There must be spaces between operators and expressions\
    \ for example 2+2 is not correct, whereas it should be written as 2 + 2.\n- Complete\
    \ expression should be enclosed between “” commas.\n- You should use * symbol\
    \ for multiplication.\n- The if...then...fi statement is a decision making statement,\
    \ which will be explained in the next chapter.\n\n| Operator | Description | Example\
    \ |\n| :--- | :--- | :--- |\n| + | Addition - Adds values on either side of the\
    \ operator | `expr + $b` will give 30 |\n| - | Subtraction - Subtracts right hand\
    \ operand from left operand | `expr - $b` will give -10 |\n| * | Multiplication\
    \ - Multiplies values on either side of the operator | `expr \\* $b` will give\
    \ 200 |\n| / | Division - Divides left operand by right hand operand | `expr /\
    \ $a` will give 2 |\n| % | Modulus - Divides left operand by right hand operand\
    \ and returns remainder | `expr % $a` will give 0 |\n| = | Assignment - Assign\
    \ right operand in left operand | `a=$b` would assign value of b into a |\n| ==\
    \ | Equality - Compares two numbers, if both are same returns true. | `[$a ==\
    \ $b]` would return false. |\n| != | Not Equality - Compares two numbers, if both\
    \ are different returns true. | `[$a != $b]` would return true. |\n\nAll the arithmetical\
    \ calculations are done using integers. It is very important to note that all\
    \ conditional expressions should be put inside brackets with spaces around them,\
    \ for example [a == $b ] is correct whereas [$b] is incorrect.\n\n# Relational\
    \ Operators\n\nBourne Shell supports the following relational operators, which\
    \ are specific to values. These operators will not work for string values unless\
    \ value is numeric. For example, the following operators check relation between\
    \ 10 and 20 as \"10\" and \"20\" but not \"ten\" and \"twenty\". Assume variable\
    \ holds 10 and b holds 20 then –\n\nThis example uses all the relational operators\
    \ –\n\n```sh\n#!/bin/sh\na=10\nb=20\n\nif [ $a -eq $b ]\nthen\n  echo \"$a -eq\
    \ $b : a is equal to b\"\nelse\n  echo \"$a -eq $b: a is not equal to b\"\nfi\n\
    ```\n\n```sh\nif [ $a -ne $b ]\nthen\n  echo \"$a -ne $b: a is not equal to b\"\
    \nelse\n  echo \"$a -ne $b: a is equal to b\"\nfi\n```\n\n```sh\nif [ $a -gt $b\
    \ ]\nthen\n  echo \"$a -gt $b: a is greater than b\"\nelse\n  echo \"$a -gt $b:\
    \ a is not greater than b\"\nfi\n```\n\n```sh\nif [ $a -lt $b ]\nthen\n  echo\
    \ \"$a -lt $b: a is less than b\"\nelse\n  echo \"$a -lt $b: a is not less than\
    \ b\"\nfi\n```\n\n```sh\nif [ $a -ge $b ]\nthen\n  echo \"$a -ge $b: a is greater\
    \ or equal to b\"\nelse\n  echo \"$a -ge $b: a is not greater or equal to b\"\n\
    fi\n```\n\n```sh\nif [ $a -le $b ]\nthen\necho \"$a -le $b: is less or equal to\
    \ $b\"\nelse\necho \"$a -le $b: is not less or equal to $b\"\nfi\n```\n\nThis\
    \ produces the following result -\n\n```\n10 -eq 20: a is not equal to b\n10 -ne\
    \ 20: a is equal to b\n10 -gt 20: a is not greater than b\n10 -lt 20: a is less\
    \ than b\n10 -ge 20: a is not greater or equal to b\n10 -le 20: a is less or equal\
    \ to b\n```\n\nNote:\n\n- There must be spaces between operators and expressions\
    \ for example 2+2 is not correct, whereas it should be written as 2 + 2.\n- if...then...else...fi\
    \ statement is a decision making statement which will be explained in the next\
    \ chapter.\n\n| Operator | Description | Example |\n| :--- | :--- | :--- |\n|\
    \ -eq | Checks if the value of two operands are equal, if then condition becomes\
    \ true. | [ $a -eq $b ] is not true. |\n| -ne | Checks if the value of two operands\
    \ are equal, if they are not equal then condition becomes true. | [ $a -ne $b\
    \ ] is not true. |\n| -gt | Checks if the value of left operand is greater than\
    \ the value of right operand, if then condition becomes true. | [ $a -gt $b ]\
    \ is not true. |\n| -lt | Checks if the value of left operand is less than the\
    \ value of right operand, if then condition becomes true. | [ $a -lt $b ] is true.\
    \ |\n| -ge | Checks if the value of left operand is greater than or equal to the\
    \ value of right operand, if then condition becomes true. | [ $a -ge $b ] is not\
    \ true. |\n| -le | Checks if the value of left operand is less than or equal to\
    \ the value of right operand, if then condition becomes true. | [ $a -le $b ]\
    \ is true. |\n"
  mdcn: "\n\n# 这里是另一个说明变量范围的示例：\n\n## 变量范围，示例\n\n```sh\n#!/bin/sh\ninc() {\n  local\
    \ value=4\n  echo \"value is $value within the function\\n\"\n  echo \"$1 is $1\
    \ within the function\"\n}\n\nvalue=5\necho value is $value before the function\n\
    echo \"$1 is $1 before the function\"\necho\necho -e $(value)\necho\necho value\
    \ is $value after the function\necho \"$1 is $1 after the function\"\n```\n\n\
    ```sh\ninc() {\n  local value=4\n  echo \"value is $value within the function\\\
    n\"\n  echo \"$1 is $1 within the function\"\n}\n```\n\n我们将变量 `value` 赋值为局部值 `4`。接下来的三行构建了输出，请记住这些内容被输出到缓冲区中，并在函数退出时，将用函数内部所有传递到\
    \ stdout 的内容替换函数调用。因此，调用代码将被我们在函数内部重定向到标准输出的任何内容替换。函数的调用方式如下：\n\n```sh\necho -e\
    \ $(value)\n```\n\n我们向 `echo` 命令传递了 `-e` 选项，使其处理 C 风格的反斜杠转义字符，因此我们可以处理函数调用包含的任何反斜杠字符。如果我们只是\
    \ echo 函数想要返回的行，它将不会将换行符传递到缓冲区引用，因此我们实际上是在字符串中包含了将产生新行的行的字符序列，这样当调用代码通过 `-e` 进行输出时，转义字符将通过处理，换行符将放置在我们想要的位置。\n\
    \n`echo \"value is $value within the function\\n\"`\n\n注意换行符是如何通过 `\\n` 插入的，前两个反斜杠表示我们要输出一个反斜杠，因为在双引号内反斜杠表示字面地处理下一个字符，我们必须这样做是因为我们只处于双引号之间，而不是字面文本的单引号之间。如果我们使用单引号，则必须将带有换行符的部分与包含\
    \ `$value` 的部分分开输出，否则 `$value` 将不会被展开。\n\n`echo \"\\b\\$1 is $1 within the function\"\
    `\n\n这是我们的第二行，包含在双引号中，因此变量 `$1` 将被展开，包含了 `\\b`，以便 `\\b` 被放置在输出行中，我们的调用代码将其处理为退格字符。如果我们不这样做，shell\
    \ 会在第二行前面加一个空格，退格会删除该空格。\n\n以 `2` 作为第一个参数调用此脚本的输出为：\n\n```\nvalue is 5 before\
    \ the function\n$1 is 2 before the function\n```\n\n```\nvalue is 4 within the\
    \ function\n$1 is 5 within the function\n```\n\n```\nvalue is 5 after the function\n\
    $1 is 2 after the function\n```\n\n提示：你可以使用 `\"\"`\n\n```sh\nif `validtype $1`;\
    \ then\n    echo Valid type\nelse\n    echo Invalid type\nfi\n```\n\n# 这里是 common.sh：\n\
    \n```sh\n#!/bin/sh\nvalidtype() {\n    if [ \"$1\" = \"TYPEA\" ] ||\n       [\
    \ \"$1\" = \"TYPEB\" ] ||\n       [ \"$1\" = \"TYPEC\" ] ||\n       [ \"$1\" =\
    \ \"TYPED\" ] ||\n       [ \"$1\" = \"TYPEE\" ];\n      then\n    exit 0\nelse\n\
    \    exit 1\nfi\n}\n```\n\n# 第十一章：SHELL 基础运算符\n\n每个 shell 支持多种运算符。本章基于默认 shell\
    \ (Bourne)，因此我们将在本教程中涵盖所有重要的 Bourne Shell 运算符。\n\n我们将讨论以下运算符——\n\n- 算术运算符。\n-\
