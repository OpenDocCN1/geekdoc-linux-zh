- md: '

    man makes use of the following environment variables:


    | Variable | Description |

    | :--- | :--- |

    | MANPATH | If $MANPATH is set, its value is used as the path to search for manual
    pages. |

    | MANROFFOPT | The contents of $MANROFFOPT are added to the command line every
    man invokes the formatter (proff, troff, or groff). |

    | MANFFSEQ | If $MANFFSEQ is set, its value is used to determine the set of preprocessors
    to pass each manual page through. The default preprocessor list is system-dependent.
    |

    | MANSECT | If $MANSECT is set, its value is a colon-delimited list of sections
    and it is used to determine which man sections to search and in what order. |

    | MANPAGER, PAGER | If $PAGER or $PAGER is set ($PAGER is used in preference),
    its value is used as the name of the program used to display the man page. By
    default, pager -s is used. The value may be a simple command name or a command
    with arguments, and may use shell quoting (backslashes, single quotes, or double
    quotes). It may not use pipes to connect multiple commands; if you need that,
    a wrapper script, which may take the file to display either as an argument or
    on standard input. |

    | MANLESS | If $MANLESS is set, man will not perform any of its usual processing
    to set up a prompt string for the less pager. Instead, the value of $MANLESS will
    be copied verbatim into $LESS. For example, if you want to set the prompt string
    unconditionally to "my prompt string", set $MANLESS to ''-Psmy prompt string''.
    |


    # BROWSER


    If $BROWSER is set, its value is a colon-delimited list of commands, of which
    in turn is used to try to start a web browser for man —html. In each command,
    %s is replaced by a filename containing the HTML output from groff, is replaced
    by a single percent sign (%), and %c is replaced by a colon (:).


    # SYSTEM


    If $SYSTEM is set, it will have the same effect as if it had been specified as
    the argument to the -m option.


    # MANOPT


    If $MANOPT is set, it will be parsed prior to mans command line and is expected
    to be in a similar format. As all of the other man specific environment variables
    can be expressed as command line options, and are candidates for being included
    in $MANOPT it is expected that they will become obsolete. Note: all spaces that
    should be interpreted as part of an option''s argument must be escaped (preceded
    with a backslash)


    # MANWIDTH


    If $MANWIDTH is set, its value is used as the line length for which manual pages
    should be formatted. If it is not set, manual pages will be formatted with a line
    length appropriate to the current terminal (using ioctl if available, the value
    of $COLUMNS, or falling back to 80 characters if neither is available). cat-troff
    pages will only be saved when the default formatting can be used, that is when
    the terminal line length is between 66 and 80 characters.


    # MAN_KEEP_FORMATTING


    Normally, when output is not being directed to a terminal (such as to a file or
    a pipe), formatting characters are discarded to make it easier to read the result
    without special tools. However,


    ```

    if $MAN_KEEP_FORMATTING is

    set to any non-empty value, these

    formatting characters are retained.

    This may be useful for wrappers

    around man that can interpret

    formatting characters.

    ```


    # MAN_KEEP_STDERR


    Normally, when output is being

    directed to a terminal (usually a

    pager), any error output from the

    command used to produce formatted

    versions of man pages is discarded to

    avoid interfering with the pager''s

    display. Programs as groff often

    produce relatively minor error

    messages about typographical

    problems such as poor alignment,

    which are unsightly and generally

    confusing when displayed along with

    the page. However, you might

    want to see them anyway, so

    if $MAN_KEEP_STDERR is set to a

    non-empty value, error output will be

    displayed as usual.


