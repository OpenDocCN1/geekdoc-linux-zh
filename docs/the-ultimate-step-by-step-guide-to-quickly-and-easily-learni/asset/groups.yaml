    一组开发者开始致力于图形环境 GNOME，目标是成为 KDE 的免费替代品，而当时的 KDE 依赖于专有的 Qt GUI 工具包。这一年，IBM 宣布了一项支持
    Linux 的广泛计划。


    ## 2000年：


    戴尔（Dell）宣布其现在是全球第二大 Linux 系统供应商，也是首个在其全产品线提供 Linux 的大制造商。


