    The script would print "The third choice is excellent" if and only the first parameter
    was "3" AND the second parameter was "4".

    "&&" and "||" are both lazily evaluating which means that in the case of "&&",
    if the first test fails it won''t bother evaluating the second because the list
    will only be true if BOTH pass and since one has already failed there is no point
