    # Mageia


    Mageia may be the newest distribution on this list, but its roots go back to July
    1998 when Gael Duval launched Mandrake Linux. At the time, it was just a branch
    of Red Hat Linux with KDE as the default desktop, better hardware detection, and
    some user-friendly features, but it gained instant popularity due to positive
    reviews in the media. Mandrake was later turned into a commercial enterprise and
    renamed to Mandriva (to avoid trademark-related hassles and to celebrate its merger
    with Brazil''s Conectiva) before almost bankrupt in 2010. A Russian venture capital
    firm eventually saved it, but at this cost when the new management decided to
    lay off most of the established Mandriva developers in the company''s Paris headquarters.
    Upon finding themselves out of work, they decided to form Mageia, a community
    project that is a logical continuation of Mandrake and Mandriva, perhaps more
    so than Mandriva itself. Mageia is primarily a desktop distribution. Its best-loved
    features are cutting-edge software, a superb system administration suite (Mageia
    Control Centre), the ability to attract a large number of volunteer contributors,
    and extensive internationalization support. It features one of the easiest, but
    most powerful system installers on its installation DVD, while it also releases
    a set of live images with both KDE or GNOME desktops and comprehensive language
    support, with the ability to install it onto a hard disk directly from the live
    desktop session. The distribution’s well-established package management features,
    with powerful command-line options and a graphical software management module,
    allow easy access to thousands of software packages. The unique Mageia Control
    Center continues to improve with each release, offering a powerful tool for configuring
    just any aspect of their computer without ever reaching for the terminal.


    **Pros:** Beginner-friendly; excellent central configuration utility; very good
    out-of-the-box support for dozens of languages; installable live media.


    **Cons:** Lacks reputation and mindshare following its split from Mandriva, some
    concern over the developers’ ability to maintain the distribution long-term on
    a volunteer basis.


    # Fedora


    Although Fedora was formally unveiled in September 2004, its origins date back
    to 1995 when it was launched by two Linux visionaries — Bob Young and Marc Ewing
    — under the name of Red Hat Linux. The company’s first product, Red Hat Linux
    1.0 “Mother’s Day,” was released the same year and was quickly followed by several
    bug-fix updates. In 1997, Red Hat introduced its revolutionary RPM package management
    system with dependency resolution and other advanced features which greatly contributed
    to the distribution’s rapid rise in popularity and its overtaking of Slack Linux
    as the most widely-used Linux distribution in the world. In later years, Red Hat
    standardized on a regular, 6-month release schedule. In 2003, just after the release
    of Red Hat 9, the company introduced some radical changes to its product line-up.
    It retained the Red Hat trademark for its commercial products, notably Red Hat
    Enterprise Linux, and introduced Fedora Core (later renamed to Fedora), a Red
    Hat sponsored, community-criticized distribution designed for the “Linux hobbyist”.
    After the initial criticism of the changes, the Linux community accepted the “new”
    distribution as the logical continuation of Red Hat. A few releases were all it
    took for Fedora to regain its former status as one of the best-operating systems
    on the market. At the same time, Red Hat quickly became the biggest and most profitable
    Linux company in the world, with an innovative product line-up, excellent customer
    support, and other popular initiatives, such as its Red Hat Certified Engineer
    (RHCE) certification program. Although Fedora’s direction is still largely controlled
    by Red Hat, Inc. and the product is sometimes seen — rightly or wrongly — as a
    test bed for Red Hat Enterprise Linux, there is no denying that Fedora is one
    of the most innovative distributions available today. Its contributions to the
    Linux kernel, glibc and GCC are well-known and its recent integration of SELinux
    functionality, virtualization technologies, system service manager, cutting-edge
    journaled file systems, and other enterprise-level features are much appreciated
    by the company’s customers. Fedora still lacks a clear desktop-oriented strategy
    that would make the product easier to use for those beyond the “Linux hobbyist”
    target.


    **Pros:** Highly innovative; outstanding security features; a large number of
    supported packages; strict adherence to the free software philosophy; availability
    of live CDs featuring many popular desktop environments.


    **Cons:** Fedora’s priorities tend to lead enterprise features, rather than desktop
    usability; some bleeding edge features, such as early switch to KDE 4 and GNOME
    3, occasionally alienate desktop users.


    # openSUSE


    The beginnings of openSUSE date back to 1992 when four German Linux enthusiasts
    — Rowland Dyroff, Thomas Feher, Hubert Mantel and Burch Steinbild — launched the
    project under the name of SUSE (Software and System Entwicklung) Linux. In the
    early days, the young company sold sets of floppy disks containing a German edition
    of Slack, but it wasn''t long before SUSE Linux became an independent distribution
    with the launch of version 4.2 in May 1996. In the following years, the developers
    adopted the RPM package management format and introduced YaST, an easy-to-use
    graphical system administration tool. Frequent releases, excellent printed documentation,
    and easy availability of SUSE Linux in stores across Europe and North America
    resulted in growing popularity of the distribution. SUSE Linux was acquired by
    Novell, Inc. in late 2003, and then into the hands of Attachmate in November 2010.
    Major changes in the development, licensing and availability of SUSE Linux followed
    shortly after the first acquisition - YaST was released under the GPL, the ISO
    images were freely distributed from public servers, and most significantly, the
    development of the distribution was opened to public participation for the first
    time. Since the launch of the openSUSE project and the release of version 10.0
    in October 2005, the distribution became completely free in both senses of the
    word. The openSUSE code became a base system for Novell''s commercial products,
    first named as Novell Linux, but later renamed to SU Linux Enterprise Desktop
    and SU Linux Enterprise Server. Today, openSUSE has a large following of satisfied
    users. The principal reason for openSUSE receiving high marks from its users are
    pleasant and polished desktop environments (KDE and GNOME), an excellent system
    administration utility (YaST), and for those who bought the boxed edition, some
    of the best-printed documentation available. However, the infamous deal between
    Novell and Microsoft, which apparently concedes that its intellectual property
    rights over Linux, has resulted in condemnation by many Linux personalities and
    has prompted some users to switch distributions. Although Novell has downplayed
    the deal, and Microsoft has yet to exercise any rights, this issue remains a thorn
    in the side of the otherwise very community-friendly Linux Company.


    **Pros:** Comprehensive and intuitive configuration tool; large repository of
    software packages, excellent web site infrastructure, and printed documentation.


    **Cons:** Novell''s patent deal with Microsoft in 2006 seemingly legitimized Microsoft’s
    intellectual property claims over Linux; its resource-heavy desktop set-up and
    graphical utilities are sometimes seen as “bloated and slow.”


    # Arch Linux


    The KISS (Keep It Simple, Stupid) philosophy of Arch Linux was devised around
    the year 2002 by Judd Vinet, a Canadian computer science graduate who launched
    the distribution the same year. For several years it lived as a marginal project
    designed for intermediate and advanced Linux users and only shot to stardom when
    it began promoting itself as a “rolling-release” distribution that only needs
    to be installed once and is kept up-to-date thanks to its powerful package manager
    and always fresh software repository. As such, Arch Linux “releases” are few and
    far between and are now limited to a basic installation DVD that is issued only
    when considerable changes in the base system warrant a fresh install. Besides
    featuring the much-loved “rolling-release” update mechanism, Arch Linux is also
    renowned for its fast and powerful package manager called Pacman, the ability
    to install software packages from source code, easy creation of binary packages
    thanks to its AUR infrastructure, and the ever increasing software repository
    of well-tested packages. This highly regarded documentation, complemented by the
    excellent Arch Linux Handbook makes it possible for even less experienced Linux
    users to install and customize the distribution. The powerful tools available
    at the user’s disposal mean that the distro is infinitely customizable to the
    minutest detail and that no two installations possibly be the same. On the negative
    side, any rolling-release update mechanism has its dangers: a human mistake can
    creep in, a library or dependency goes missing, a new version of an application
    already in the repository has critical bug... It is not unheard to end up with
    an unbootable system following a Pacman upgrade. As such, Arch Linux is the kind
    of distribution that requires its users to be alert and have enough knowledge
    to fix any such problems. In addition, the infrequent install releases means that
    it is sometimes no longer possible to use the old media to install the distribution
    due to important system changes or lack of hardware support in the older Linux
    kernel.


    **Pros:** Excellent software management infrastructure; unparalleled customization
    and tweaking options; superb online documentation.


    **Cons:** Occasional instability and risk of breakdown.


