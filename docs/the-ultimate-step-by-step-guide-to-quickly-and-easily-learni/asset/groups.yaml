    # # Chapter Six: LINUX AND UNIXMAN COMMAND


    On Linux and other Unix-like operating systems, man is the interface used to view
    the system''s reference manuals.


    # ## Syntax


    ```

    man [-C file] [-D] [-warnings=warnings] [-R encoding] [-L locale]

    [-m system,...] [-M path] [-S list] [-e extension] [-i|I]

    [-regex\|-wildcard] [-names-only] [-a] [-u] [-no-subpages] [-P pager]

    [-r prompt] [-7] [-E encoding] [-no-hyphenation] [-no-justification]

    [-p string] [-t] [-T[device]] [-H[browser]] [-X[dpi]] [-Z]

    [[section] page ...]

    man -k [apropos options] regexp

    man -K [-|W] [-S list] [-i-l] [-regex] [section] term ...

    man -l [-C file] [-d] [-D] [-warnings=warnings] [-R encoding]

    [-L locale] [-P pager] [-7] [-E encoding] [-p string] [-t]

    [-T[device]] [-H[browser]] [-X[dpi]] [-Z] file ...

    man -wi -W [-C file] [-d] [-D] page ...

    man -c [-C file] [-d] [-D] page ...

    man [-hv]

    ```


    # ## Description


    Man is the system''s manual viewer; it can be used to display manual pages, scroll
    up and down, for occurrences of specific text, and other useful functions. Each
    argument given to man is normally the name of a program, utility or function.
    The pages associated with each of these arguments are found and displayed. A section
    number, if provided, will direct man to look only in that section of the manual.
    The default order is to search in all of the available sections, following a pre-defined
    order and to show only the first page found, if pages exists in several sections.


    # ## General Options


    +   -h, --help Print a help message and exit.


    +   -V, --version Print version information and exit.


    +   -Cfile, --config- Use configuration file rather than the'
  - '[PAGE 48]


    file=file default of ~/.manpath.


    -d, --debug Print debugging information.


    -D, --default This option, when used, is normally specified as the first option;
    it resetsmans behaviour to its default. Its use is to reset those options that
    may have been set in 8MANOPT. Any options that follow -D will have their usual
    effect.


    - warnings[=warnings] Enable warnings from the groff text formatter. This may
    be used to perform sanity checks on the source text of manual pages. warnings
    is a comma-separated list of warning names; if it is not supplied, the default
    is "mac". See the "Warnings" node in the groff info for a list of available warnings.


    # Main Modes of Operation


    -f, --whatis Equivalent to the whatis command; displays a short description from
    the manual page, if available.


    -k, --apropos Equivalent to the apropos command; Search the manual page descriptions
    for keywords and display any matches.


    -K, --global-apropos Search for text in all manual pages. This is a brute-force
    search, and is likely to take some time; if you can, you should specify a section
    to reduce the number of pages that need to be searched. Search terms may be simple
    strings (the default), or regular expressions if the --regex option is used.


    -l, --local-file Activate ''local'' mode. Format and display local manual instead
    of searching through the system''s manual collection. Each manual page argument
    will be interpreted as an nroff source file in the correct format. No cat is produced.
    If a da (''-'') is listed as one of the arguments, input will be taken from stdin.
    When this option is not used, and man fails to find the page required, before
    displaying the error message it attempts to act as if this option was supplied,
    using the name as a filename and looking for an exact match.'
