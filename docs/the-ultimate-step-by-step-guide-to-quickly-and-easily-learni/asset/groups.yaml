    ## 第三章：许可协议


    代码以多种许可协议贡献给 Linux 内核，但所有代码必须兼容 GNU 第 2 版本 (GPLv2)，该版本是涵盖整个内核分发的许可协议。特别是，这意味着所有代码贡献要么受
    GPLv2 覆盖（可选的允许在后续版本的 GPL 下分发语言），要么受三条款 BSD 许可证覆盖。任何未受兼容许可覆盖的贡献将不会被引入内核。贡献给内核的代码不需要进行版权转让（也不被要求）。所有合并到主线的代码都保留其原始所有权；结果是内核现在拥有数千个所有者。这种所有权结构的一个影响是，任何试图更改内核许可协议的尝试都注定几乎会失败。在现实情况下，很少能获得所有版权持有者的同意（或将其从内核中移除）。因此，在可预内没有迁移到
    GPL 第 3版本的展望。所有贡献给内核的代码必须是合法的自由软件，这一点至关重要。因此，不接受匿名（或假名）贡献者的代码。


    所有贡献者都被要求对其代码进行“签名（sign off）”，声明该代码可以在 GPL 协议下随内核一起分发。所有者未授权为自由软件的代码，或可能给内核带来版权相关风险的代码（例如源自缺乏适当保护的逆向工程工作的代码）不能被贡献。在
    Linux 开发邮件列表中，关于版权相关的问题非常常见。这些问题通常会有不乏的答案，但人们应该记住，回答这些问题的人不是律师，无法提供法律建议。如果你有与
    Linux 源代码相关的法律问题，与了解该领域的律师交谈是不可替代的。依赖从技术邮件列表获取的答案是一项风险很大的事务。


    ## 社区


    Linux 社区主要有两种基本形式：开发者社区和用户社区。


    Linux 最具吸引力的特征之一是它对开发者是开放的；任何具备所需技能的人都可以改进 Linux 并影响其开发方向。专有产品无法提供这种开放性，而开放性正是自由软件进程的一个特征。开发者社区可以自愿维护和支持整个发行版，例如
    Debian 或 Gentoo 项目。Novell 和 Red Hat 也分别支持其产品的社区驱动版本，即 openSUSE 和 Fedora。这些社区分发版的改进随后会被整合到商业服务器和桌面产品中。Linux
    内核本身主要由其开发者社区支持，是世界上规模最大、最活跃的软件项目之一。一个典型的三个月内核开发周期可能涉及 1000 多名来自 100 多家不同公司（或完全没有公司）的开发者。


    随着 Linux 的增长，参与其开发的开发者（及公司）数量不断增加。硬件供应商希望确保 Linux 良好地支持他们的产品，使其产品对 Linux 用户具有吸引力。将
    Linux 作为集成产品组件的嵌入式系统供应商，希望 Linux 尽可能强大并适用于手头的任务。分发版商和其他软件供应商的基础产品基于 Linux，因此他们对
    Linux 内核的能力、性能和可靠性有明确的利益。其他开发者社区关注运行在 Linux 上的不同应用和环境，例如 Firefox、OpenOffice、GNOME
    和 KDE。终端用户也可以对 Linux 的开发做出价值的贡献。通过如 Linux.com、LinuxQuestions 等在线社区，以及由发行版和应用程序托管的众多化社区，Linux
    用户群通常是一个发声的群体，但并可能是 Linux 操作系统的倡导者和引导者。Linux 社区不仅仅存在于网络上。被称为 Linux 用户小组（LUGs）的本地小组经常聚在一起讨论有关
    Linux 操作系统的问题，并为其他本地用户提供免费演示、培训、技术支持和安装测试。


    ## 开发


    Linux 是一个由许多不同开发语言组成的操作系统。分发版代码中很大比例是用 C 语言（52.86%）或 C++ 语言（25.56%）编写的。其余代码均占个位数比例，Java、Perl
    和 Lisp 成了前五大语言。Linux 内核本身对 C 语言的使用更加主导，内核 95% 以上的代码是用该语言编写的。然而，其他语言也构成了内核，使其与其他操作系统更具异构性。内核社区演化出了自己独特的运行方式，使其能够在每天更改数千行代码的环境中顺畅运行（并产生高质量的产品）。这意味着
    Linux 内核的开发过程与专有开发方法有很大不同。


    内核的开发过程对新开发者来说可能看起来奇怪且令人畏惧，但背后有充分的理由和坚实的经验。不理解内核社区规则（或者糟糕的是，试图违反或绕过规则）的开发者将感到非常沮丧。开发社区虽然对努力学习的人很有帮助，但对那些不听劝或不在乎开发过程的人没有时间。虽然许多
    Linux 开发者仍使用 Emacs 或 Vim 等基于文本的工具开发代码，但 Eclipse、Anunta 和 Netbeans 都提供了更健壮的集成开发环境。


    ## 第四章：安装 Debian 8


    ### 什么是 Debian


    Debian 是一个全自愿组织，致力于开发自由软件并促进自由软件社区的理想。Debian 项目始于 1993 年，当时 Ian Murdock 向软件开发者发出了开放邀请，请他们贡献一个基于较小的
    Linux 内核的完整且连贯的软件分发版。这群由热血爱好者最初由自由软件基金会资助并受 GNU 哲学影响，多年来已成长为一个由 1026 名 Debian
    开发者组成的组织。


    ### Debian GNU/Linux


    Debian 的哲学、方法论、GNU 工具、Linux 内核以及其他自由软件相结合，形成了一个名为 Debian GNU/Linux 的独特软件分发版。该分发版由大量的软件包组成。每个软件包包含执行文件、脚本、文档和配置信息，维护者主要负责保持软件包更新、跟踪
    Bug 报告并与软件包的上游作者交流。极大的用户群结合 Bug 跟踪系统确保了问题被快速发现和修复。Debian 对细节的关注使他们能够生产出高质量、稳定且可扩展的分发版。安装可以轻松配置以用于许多角色，从精简的防火墙到科学桌面工作站，再到高端网络服务器。由于技术上的卓越性以及对
    Linux 社区需求和期望的深度承诺，Debian 特别受到高级用户的喜爱。Debian 还为 Linux 引入了许多常见的功能。例如，Debian 是第一个包含软件包系统的
    Linux Linux，方便安装和删除软件。它还是第一个无需重新安装即可进行升级的 Linux 分发版。Debian 一直是 Linux 开发的领导者。它的开发过程证明了开源开发模型可以多么良好地工作——即使对于构建和维护如此复杂的任务。


    '
