    # Redirection


    As illustrated above, many Unix commands read from standard input (typically the
    keyboard) and write to standard output (typically the terminal screen). The redirection
    operators enable you to read input from a file (<) or write program output to
    a file (>). When output is redirected to a file, the program output replaces the
    original contents of the file if it already exists; to add program output to the
    end of an existing file, use the append redirection operator (>>).


    Observe the results of the following command:


    ```

    ./a.out

    ```


    You will be prompted to enter a Fahrenheit temperature. After entering a numeric
    value, a message will be displayed on the screen informing you of the equivalent
    Centigrade temperature. In this example, you entered a numeric value as standard
    input via the keyboard and the output of the program was displayed on the terminal
    screen.


    In the next example, you will read data from a file and have the result displayed
    on the screen (standard output):


    ```

    cat data.in

    ./a.out < data.in

    ```


    Now you will read from standard input (keyboard) and write to a file:


    ```

    ./a.out > data.two

    35

    cat data.two

    ```


    Now read from standard input and append the result to the existing file:


    ```

    ./a.out < data.in >> data.two

    ```


    As another example of redirection, observe the result of the following two commands:


    ```

    ls -la /etc > temp

    more temp

    ```


    Here we have redirected the output of the ls command to the file "temp" and then
    used the more command to display the contents of this file a page at a time. In
    the next section, we will see how the use of pipes could simplify this operation.


    # Using Pipes and Filters


    A filter is a Unix program, which accepts input from standard input and places
    its output in standard output. Filters add power to the UNIX system as programs
    can be written to use the output of another program as input and create output.
    A pipe (indicated by the symbol "|" — vertical bar) is used between UNIX commands
    to indicate that the output from the first is used as input by the second. Compare
    the output from the following two commands:


    ```

    ls -la /etc

    ls -la /etc | more

    ```


    The first command displays all of the files in the "etc" directory in long format.
    It is difficult to make use of this information since it scrolls rapidly across
    the screen. In the second line, the results of the ls command are piped into the
    more command. We can now examine this information one screen at a time and even
    back up to a prior screen of information if we wish. As you become more familiar
    with UNIX, you will find piping output to the more command can be very useful
    in a variety of applications.


    The sort command can be used to sort the lines in a file in a desired order. Now
    enter the following commands and observe the results:


    ```

    who

    sort cars

    who | sort

    ```


    The who command displays a list of users currently logged onto the system; the
    sort command enables us to sort the information. The second command sorts the
    lines in the file cars alphabetically by first field and displays the result in
    standard output. The third command illustrates how the result of the who command
    can be passed to the sort command prior to being displayed. The result is a listing
    of logged on users in alphabetical order.


    The following example uses the "awk" and "sort" commands to select and reorganize
    the output generated by the "ls" command:


    ```

    ls -l | awk ''/:/ {print $5,$9}'' | sort -nr

    ```


    **Note:** Curly braces do not necessarily display correctly on all devices. In
    the above example, there should be a left curly brace in front of the word print
    and a right curly brace following the number 9.


    Observe that the output displays the filesize and filename in decreasing order
    of size. Here the `ls` command generates a "long" listing of the files in the
    current directory, which is piped to the `awk` utility, whose output is piped
    to the `sort` command.


    `awk` is a powerful utility which processes one or more program lines to find
    patterns within what is found. Slash (/) characters are used as delimiters around
    the pattern to be matched and the action to be taken is enclosed in curly braces.
    If no pattern is specified, all lines in the file are processed and if no action
    is specified, all lines matching the specified pattern are output. Since a colon
