    # Chapter fourteen: UNIX - SHELL INPUT/OUTPUT REDIRECTIONS


    Time is precious. It does not make sense to waste typing a frequently used sequence
    of commands at a command prompt, more especially if they are abnormally long or
    complex. Scripting is a way by which one can alleviate this problem by automating
    command sequences in order to make life at the shell easier and more productive.
    Scripting is all about making the computer, the tool, do the work. By the end
    of this tutorial you will have a good understanding of the kind of scripting languages
    available for Unix and how to apply them to your problems. UNIX contains many
    wonderful and strange commands that can be very useful in the world of scripting,
    the more tools you know and the better you know them, the more use you will find
    for them. Most of the Unix commands and many of the built-in commands have man
    pages; man pages contain the usage instructions pertaining to the parent tool.
    They are not always very clear and may require reading several times. In order
    to access a man page in Unix the following command sequence is applied'
- md: "\n# Chapter Fifteen: UNIX SHELL FUNCTION\n\nFunctions enable you to break down\
    \ the overall functionality of a script into smaller, logical subsections, which\
    \ are then called upon to perform their individual tasks when needed. Using functions\
    \ to perform repetitive tasks is an excellent way to create code reuse. Code reuse\
    \ is an important part of modern object-oriented programming principles. Shell\
    \ functions are similar to subroutines, procedures, and functions in other programming\
    \ languages.\n\n## Creating Functions\n\nTo declare a function, simply use the\
    \ following syntax –\n\n```\nfunction_name () {\n  list of commands\n}\n```\n\n\
    The name of your function is function_name, and that is what you will use to call\
    \ it from elsewhere in your scripts. The function name must be followed by parentheses,\
    \ which are followed by a list of commands enclosed within braces.\n\n## Example\n\
    \nExample using function –\n\n```bash\n#!/bin/sh\n\n# Define your function here\n\
    Hello() {\n  echo \"Hello World\"\n}\n```\n\n```bash\n# Invoke your function\n\
    Hello\n```\n\n## Output\n\n```\n$.test.sh\nHello World\n$\n```\n\n## Pass Parameters\
    \ to a Function\n\nYou can define a function, which would accept parameters while\
    \ calling those functions. These parameters would be represented by $1, $2 and\
    \ so on. The following is an example where we pass two parameters Zara and Ali\
    \ and then we capture and print these parameters in the function.\n\n```bash\n\
    #!/bin/sh\n\n# Define your function here\nHello () {\n    echo \"Hello World $2\"\
    \n}\n```\n\n```bash\n# Invoke your function\nHello Zara Ali\n```\n\n## Output\n\
    \n```\n$./test.sh\nHello World Zara Ali\n$\n```\n\n## Returning Values from Functions\n\
    \nIf you execute an exit command from inside a function, its effect is not only\
    \ to terminate execution of the function but also of the shell program that called\
    \ the function. If you want instead just terminate execution of the function,\
    \ then there is a way to come out of a defined function. Based on the situation\
    \ you can return any value from your function using the `return` command whose\
    \ syntax is as follows –\n\n```\nreturn code\n```\n\nHere `code` can be anything\
    \ you choose, but obviously you should choose something that is meaningful or\
    \ useful in the context of your script as a whole.\n\n## Example\n\nFollowing\
    \ function returns a value 1 –\n\n```bash\n#!/bin/sh\n\n# Define your function\
    \ here\nHello () {\n    echo \"Hello World $1 $2\"\n    return 10\n}\n```\n\n\
    ```bash\n# Invoke your function\nHello Zara Ali\n```\n\n```bash\n# Capture value\
    \ returned by last command\nret=$?\n```\n\n```bash\necho \"Return value is $ret\"\
    \n```\n\n## Output\n\n```\n$./test.sh\nHello World Zara Ali\nReturn value is 10\n\
    $\n```\n\n## Nested Functions\n\nOne of the more interesting features of functions\
    \ is that they can call themselves as well as call other functions. A function\
    \ that calls itself is known as a recursive function.\n\nThe following example\
    \ demonstrates a nesting of two functions –\n\n```bash\n#!/bin/sh\n\n# Calling\
    \ one function from another\nnumber_one () {\n  echo \"This is the first function\
    \ speaking...\"\n  number_two\n}\n\nnumber_two () {\n  echo \"This is now the\
    \ second function speaking...\"\n}\n\n# Calling function one.\nnumber_one\n```\n\
    \n## Output\n\n```\nThis is the first function speaking...\nThis is now the second\
    \ function speaking...\n```\n\n## Function Call from Prompt\n\nYou can define\
    \ for commonly used functions inside your profile so they will be available whenever\
    \ you log in. Alternatively, you can group the definitions in a file, say test.sh,\
    \ and then execute the file in the current shell by typing –\n\n```bash\n$ test.sh\n\
    ```\n\nThis has the effect of causing any functions defined inside test.sh to\
    \ be read in and defined to the current shell as follows –\n\n```bash\n$ number_one\n\
    ```\n\nThis is the first function speaking...\n\nThis is now the second function\
    \ speaking...\n\n$\n\nTo remove the definition of a function from the shell, use\
    \ the unset command with the .f option. This is the same command you use to remove\
    \ the definition of a variable to the shell.\n\n```bash\n$ unset -f function_name\n\
    ```\n\n## Unix - Pipes and Filters\n\nYou can connect two commands together so\
    \ that the output from one program becomes the input of the next. Two or more\
    \ commands connected in this way form a pipe. To make a pipe, put a vertical bar\
    \ (|) on the command line between commands. When a program takes its input from\
    \ another program, performs some operation on that input, and writes the result\
    \ to the standard output, it is referred to as a filter.\n\n## The grep Command\n\
    \nThe grep searches a file or files for lines that have a certain pattern. The\
    \ syntax is -\n\n```bash\n$grep pattern file(s)\n```\n\nThe name \"grep\" derives\
    \ from the ed (a UNIX line editor) command g/re/p, which means \"globally search\
    \ for a regular expression and print all lines containing it.\" A regular expression\
    \ is either plain text (a word, for example) and/or special characters used for\
    \ pattern matching. The simplest use of grep is to look for a pattern consisting\
    \ of a single word. It can be used in a pipe so only those lines of the input\
    \ files containing a given string are sent to the standard output. If you do not\
    \ give grep a filename to read, it reads its standard input; that is how all filter\
    \ programs work -\n\n```bash\n$ls -l | grep \"Aug\"\n-rw-rw-rw- 1 john doc 11008\
    \ Aug 6 14:10 ch02\n-rw-rw-rw- 1 john doc 8515 Aug 6 15:30 ch07\n-rw-rw-rw- 1\
    \ john doc 2488 Aug 15 10:51 intro\n-rw-rw-rw- 1 carol doc 1505 Aug 23 07:35 macros\n\
    ```\n\n| Option | Description |\n|---|---|\n| -v | Print all lines that do not\
    \ match pattern. |\n| -n | Print the matched line and its line number. |\n| -1\
    \ | Print only the lines of files with matching (letter \"1\") |\n\nThere are\
    \ various options, which you can use along with grep command -\n\nNext, let's\
    \ use a regular expression that tells grep to find lines with \"car\", followed\
    \ by zero or more other characters abbreviated in a regular expression (.*), then\
    \ followed by \"Aug\". Here we are using -i option to have case insensitive sensitive\
    \ -\n\n-i | Match either upper- or lowercase.\n\n```bash\n$ls -1 | grep -i \"\
    carol.*\"\n-rw-rw-r- 1 carol doc 1605 Aug 23 07:35\n```\n\n-c | Print only the\
    \ count of matching lines.\n\n## The Sort Command\n\nThe sort command arranges\
    \ lines alphabetically or numerically. The example below sorts the lines in\n\n\
    ```bash\n$sort\nAfghani\nBangkok\nBig Apple\nIsle\nMandalay\nSushi\nSweet Tooth\n\
    ```\n\n| Option | Description |\n|---|---|\n| -r | Reverse the order of sort.\
    \ |\n| -f | Sort upper- and lowercase together. |\n| -n | Sort numerically (example:\
    \ 10 will sort after 2). |\n| +x | Ignore first fields when sorting |\n\nThe sort\
    \ command arranges lines of text alphabetically. There are many options that control\
    \ the sorting. More than two commands may be linked by a pipe. Taking the previous\
    \ example, we can further sort by\n\n10 sushi\n``````bash\n$sort -n\n1 apple\n\
    2 deil\n10 sushi\nAfghani\nBangkok\nBig Apple\nIsle\nMandalay\nSushi\nSweet Tooth\n\
    $\n```\n\n## The pg and more Commands\n\nA long output would normally zip you\
    \ by the screen, but if you run text through more or pg as a filter, the display\
    \ stops after each screen of text. Let us assume that you have a long directory\
    \ listing. To make it easier to read the sorted listing, pipe the output through\
    \ more as follows\n\n```bash\n$ls -l | grep \"Aug\" | sort +4n | more\n-rw-rw-r-\
    \ 1 carol doc 1605 Aug 23 07:35 macros\n-rw-rw-r- 1 john doc 2488 Aug 15 10:51\
    \ intro\n-rw-rw-rw- 1 john doc 8515 Aug 6 15:30 ch07\n\n-rw-rw-r- 1 john doc 14827\
    \ Aug 9 12:40 ch03\n--More-(74%)\n```\n\nThe screen will fill up with one screen\
    \ of text consisting of lines sorted by order of size. At the bottom of the screen\
    \ is the more prompt where you can type a command to move through the sorted text.\
    \ When you are done with this screen, you can use any of the commands listed in\
    \ the discussion of the more program.\n"
  mdcn: "\n\n# 第十五章：UNIX SHELL 函数\n\n函数允许你将脚本的整体功能拆分为更小的、逻辑性的子部分，然后在需要时调用这些子部分来执行各自的任务。使用函数执行重复任务是创建代码复用的极佳方法。代码复用是现代面向对象编程原则的重要部分。Shell\
    \ 函数类似于其他编程语言中的子程序、过程和函数。\n\n## 创建函数\n\n要声明一个函数，只需使用以下语法——\n\n```\nfunction_name\
    \ () {\n  命令列表\n}\n```\n\n你的函数名称为 `function_name`，你将在脚本的其他地方用它来调用函数。函数名后面必须紧跟括号，括号之后是用大括号括起来的命令列表。\n\
    \n## 示例\n\n使用函数的示例——\n\n```bash\n#!/bin/sh\n\n#在此处定义你的函数\nHello() {\n  echo \"\
    Hello World\"\n}\n```\n\n```bash\n# 调用你的函数\nHello\n```\n\n## 输出\n\n```\n$.test.sh\n\
    Hello World\n$\n```\n\n## 向函数传递参数\n\n你可以定义一个函数，它在调用这些函数时接受参数。这些参数将由 `$1`、`$2`\
    \ 等表示。以下是一个示例，我们传递了两个参数 `Zara` 和 `Ali`，然后在函数中捕获并打印了这些参数。\n\n```bash\n#!/bin/sh\n\
    \n#在此处定义你的函数\nHello () {\n    echo \"Hello World $2\"\n}\n```\n\n```bash\n# 调用你的函数\n\
    Hello Zara Ali\n```\n\n## 输出\n\n```\n$./test.sh\nHello World Zara Ali\n$\n```\n\
    \n## 从函数返回数值\n\n如果你在函数内部执行 `exit` 命令，它的效果不仅是终止函数的执行，还会终止调用该函数的 Shell 程序。如果你只想终止函数的执行，那么有一种方法可以退出定义的函数。根据具体情况，你可以使用\
    \ `return` 命令从函数返回任何值，其语法如下——\n\n```\nreturn code\n```\n\n在这里，`code` 可以是你选择的任何内容，但显然你应该选择在整个脚本语境下有意义或有用的值。\n\
    \n## 示例\n\n以下函数返回返回值 1 ——\n\n```bash\n#!/bin/sh\n\n#在此处定义你的函数\nHello () {\n  \
    \  echo \"Hello World $1 $2\"\n    return 10\n}\n```\n\n```bash\n# 调用你的函数\nHello\
    \ Zara Ali\n```\n\n```bash\n# 接收上一个命令返回的值\nret=$?\n```\n\n```bash\necho \"Return\
    \ value is $ret\"\n```\n\n## 输出\n\n```\n$./test.sh\nHello World Zara Ali\nReturn\
    \ value is 10\n$\n```\n\n## 嵌套函数\n\n函数较有趣的特性之一是它们既可以调用自己，也可以调用其他函数。调用自身的函数被称为递归函数。\n\
    \n下面的示例演示了两个函数的嵌套——\n\n```bash\n#!/bin/sh\n\n# 从一个函数调用另一个函数\nnumber_one () {\n\
    \  echo \"This is the first function speaking...\"\n  number_two\n}\n\nnumber_two\
    \ () {\n  echo \"This is now the second function speaking...\"\n}\n\n# 调用函数一。\n\
    number_one\n```\n\n## 输出\n\n```\nThis is the first function speaking...\nThis\
    \ is now the second function speaking...\n```\n\n## 从提示符调用函数\n\n你可以在你的 profile\
    \ 文件中定义常用的函数，这样在每次登录时都可以使用它们。或者，你可以将定义分组在一个文件中（例如 `test.sh`），然后通过输入以下命令在当前 Shell\
    \ 中执行该文件——\n\n```bash\n$ test.sh\n```\n\n这将导致 `test.sh` 中定义的任何函数读取并定义到当前 Shell\
    \ 中，如下所示——\n\n```bash\n$ number_one\n```\n\nThis is the first function speaking...\n\
    \nThis is now the second function speaking...\n\n$\n\n若要从 Shell 中移除函数的定义，请使用 `unset`\
    \ 命令配合 `.f` 选项。这与你从 Shell 中移除变量定义使用的命令相同。\n\n```bash\n$ unset -f function_name\n\
    ```\n\n## Unix - 管道与过滤器\n\n你可以将两个命令连接在一起，使得一个程序的输出成为下一个程序的输入。以这种方式连接的两个或多个命令形成一个管道。要创建管道，在命令行中的命令之间放置一个竖线\
    \ (`|`)。当一个程序从另一个程序获取输入，对该输入执行某些操作，并将结果写入标准输出时，它被称为过滤器。\n\n## grep 命令\n\n`grep`\
    \ 在文件或文件中搜索包含特定模式的行。其语法为——\n\n```bash\n$grep pattern file(s)\n```\n\n\"grep\"\
    \ 的名称源于 ed（一种 UNIX 编辑器）命令 `g/re/p`，其意思是“全局搜索正则表达式并打印所有包含该内容的行”。正则表达式可以是纯文本（例如一个单词）和/或用于模式匹配的特殊字符。`grep`\
    \ 最简单的用法是查找由单个单词组成的模式。它可以在管道中使用，这样只有输入文件中包含给定字符串的的行才会被发送到标准输出。如果你不给 `grep` 提供要读取的文件名，它将读取标准输入；这就是所有过滤器程序的工作方式——\n\
    \n```bash\n$ls -l | grep \"Aug\"\n-rw-rw-rw- 1 john doc 11008 Aug 6 14:10 ch02\n\
    -rw-rw-rw- 1 john doc 8515 Aug 6 15:30 ch07\n```\n\n"
