    # Chapter Five: INSTALLING CENTOS 7


    This is a community-supported distribution derived from sources freely provided
    to the public by Red Hat for Red Hat Enterprise Linux (RHEL). As such, CentOS
    Linux aims to be functionally and compatible with RHEL. The CentOS Project mainly
    changes packages to remove upstream vendor branding and artwork. CentOS Linux
    is free and free to redistribute. Each CentOS version is maintained for up to
    10 years (by means of security updates — the duration of the support interval
    by Red Hat has varied over time with respect to Sources released). A new CentOS
    version is released approximately every 2 years and each CentOS version is periodically
    updated (roughly every 6 months) to support newer hardware. This results in a
    secure, low-maintenance, reliable, predictable and reproducible Linux environment.


    # Installation of CentOS7


    Finally, the much-awaited CentOS 7 is out. CentOS (Community Enterprise Operating
    System) are forked from Red Hat Linux, a Linux Distro fine tuned for servers.
    You will learn how to install CentOS 7 in a few easy steps.


    # Step 1: Download the ISO Image


    To get a copy of CentOS 7 download from the link below:


    http://mirror.centos.org/centos/7/


    CentOS 7 is only available for 64-bit platforms; currently there is no 32-bit
    ISO image. This is primarily due to the fact that most production servers are
    64-bit.


    # Step 2: Make a bootable Drive


    After you download the ISO image, make a bootable drive using Unetboot. Alternatively,
    you can burn a DVD using Brasero or your favorite CD/DVD burning software.


