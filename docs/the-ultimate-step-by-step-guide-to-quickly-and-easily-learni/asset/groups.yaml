    ## Copying, Erasing, Renaming


    Warning: The typical Unix operating system provides no ''unerase'' or ''undelete''
    command. If you mistakenly delete a file you are dependent upon the backups or
    system administrator have maintained in order to recover the file. You need to
    be careful when using commands like copy and move, which may result in overwrriting
    existing files. If you are using the C or Shell, you can create a command alias,
    which will prompt you for verification before overwriting files with these commands.


    ## Copying Files


    The cp command is used to copy a file or group of files. You have already seen
    an example application of the cp command when you copied the sample files. Now
