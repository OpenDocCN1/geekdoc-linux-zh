    # The sed Addresses


    sed also understands something called addresses. Addresses are either particular
    locations in a file or a range where a particular editing command should be applied.
    When sed encounters no addresses, it performs its operations on every line in
    the file.


    The following command adds a basic address to the sed command you have been using
    –


    ```

    $ cat /etc/passwd | sed ''1d'' |more

    daemon:x:1:1:daemon:/usr/bin/sh

    bin:x:2:2:bin:/bin/sh

    sys:x:3:3:sys:/dev/bin/sh

    sync:x:4:6653:sync:/bin/sync

    games:x:5:60:games:/usr/bin/sh

    man:x:6:12:man:/var/cache/man:/bin/sh

    mail:x:8:8:mail:/var/mail:/bin/sh

    news:x:9:9:news:/var/spool/news:/bin/sh

    backup:x:34:34:backup:/var:/bin/sh

    $

    ```


    Notice that the number 1 is added before the delete edit command. This tells sed
    to perform the editing command on the first line of the file. In this example,
    sed will delete the first line of /etc/password and print the result of the file.


