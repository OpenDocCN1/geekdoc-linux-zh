    +   • You should \ on the * symbol for multiplication.

    • The if...then...fi statement is a decision-making statement, which will be explained
    in the next chapter.


    | Operator | Description | Example |

    |---|---|---|

    | + | Addition - Adds values on either side of the operator | `expr sa + $b` will
    give 30 |\n| - | Subtraction - Subtracts right hand operand from left hand operand
    | `expr sa - $b` will give -10 |\n| * | Multiplication - Multiplies values on
    either side of the operator | `expr sa \* $b` will give 200 |\n| / | Division
    - Divides left operand by right hand operand | `expr sb / $a` will give 2 |

    | % | Modulus - Divides left operand by right hand operand and returns remainder
    | `expr sb % $a` will give 0 |

    | = | Assignment - Assign right operand in left operand | a=$b would assign value
    of b into a |

    | == | Equality - Compares two numbers, if both are same then returns true. |
    `[ $a == $b]` would return false. |

    | != | Not Equality - Compares two numbers, if both are different then returns
    true. | `[ $a != $b]` would return true. |


    It is very important to note that all the conditional expressions should be put
    inside square brackets with one spaces around them, for example [ $a == $b ] is
    correct whereas [$a=$b] is incorrect.


    All the arithmetical calculations are done using long integers.


