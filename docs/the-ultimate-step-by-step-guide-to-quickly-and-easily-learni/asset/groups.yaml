    # Chapter Eight: WORKING WITH FILES


    This chapter will first describe general characteristics of Unix commands. It
    will then discuss commands, which are commonly used to create and manipulate files.
    A summary of some of the most commonly used UNIX commands is presented in Command
    Comparisons.


    # Unix File Names


    It is important to understand the rules for creating UNIX files: UNIX is case
    sensitive! For example, “fileName” is different from “filename.”. It is recommended
    that you limit names to the alphabetic characters, numbers, underscore (_), and
    dot (.). Dots (.) used in UNIX filenames are simply characters and not delimiters
    of filename components; you may include more than one dot in a filename. Including
    a dot as the first character of a filename makes the file invisible (hidden) to
    the normal ls; use the -a flag of the ls to display hidden files. Although many
    systems will allow more, the recommended length is 14 characters per file name.
    Unix shells typically include several important wildcard characters. The asterisk
    (*) is used to match o or more character (e.g., abc* will match any file beginning
    with the letters abc), the question mark (?) is used to match any single character,
    and the left ([ and right (]) brackets are used to enclose a string of characters,
    any one of which is to match. Execute the following commands and observe the results:


    ```

    ls m*

    ls *.f

    ls *?

    ls [a-d]*

    ```


    Notes for PC users: Unix uses forward slashes (/) instead of backslashes (\) for
    directories


    # Looking at the Contents of Files


    You can examine the contents of files using a variety of commands. cat, more,
    pg, head, and tail are described here. Of course, you can always use an editor;
    to use vi in “read-only” mode to examine the contents of the file “argtest”, enter:


    ```

    vi -R  argtest

    ```'
- md: '

    You can now use the standard vi commands to move through the file; however, you
    will not be able to make any changes to the contents of the file. This option
    is useful when you simply want to look at a file and want to guarantee that you
    make no changes while doing so.


    Use the vi `"` command to exit the file.


    ## Cat Command


    cat is a utility used to concatenate files. Thus, it can be used to join files
    together, but it is perhaps more commonly used to display the contents of a file
    on the screen.


    Observe the output produced by each of the following commands:


    ```

    cd xmp

    cat cars

    cat -vet cars

    cat -n cars

    ```


    The semicolon (;) in the first line of this example is a command separator which
    enables entry of more than one command on a line. When the <Return> key is pressed
    following this line, the command cd is issued which changes to your home directory.
    Then the command “cd xmp” is issued to change into the subdirectory “xmp.” Entering
    this line is equivalent to having entered these commands sequentially on separate
    lines. These two commands are included in the example to guarantee that you are
    in the subdirectory containing “cars” and other example files. You need not enter
    these commands if you are already in the “xmp” directory created when you copied
    the example file. The “-vet” option enables display of tab, end-of-line, and other
    non-printable characters within a file; the “-n” option numbers each line as it
    is displayed.


    You can also use the cat command to join files together:


    ```

    cat page1

    cat page2

    cat page1 page2 > document

    cat document

    ```


    Note: If the file “page1” had previously existed, it will be replaced by the contents
    of files “page1” and “page2.”


    Cautions to using the cat command: The cat command should only be used with "text"
    files; it should not be used to display the contents of binary compiled C or FORTRAN
    programs. Unpredictable results may occur, including the termination of your logon
    session. Use the command "file *" to display the characteristics of files within
    a directory prior to using the cat command with an unknown file. You can use od
    (enter "man od") for details on use of Octal Dump command. For example, to display
    the contents of "a.out" in hexadecimal character representation, enter:


    ```

    od -xc a.out

    ```


    Warning: cat (and other Unix commands) can destroy files if not used correctly.
    For example, as illustrated in the Sobell book, the cat (also cp and mv) command
    can overwrite and destroy those files. Observe the results of the following command:


    ```

    cat letter pagel > letter

    ```


    Typically, UNIX does not return a message when a command executes successfully.
    Here the UNIX operating system will attempt to complete the requested command
    by first initializing the file "letter" (now nothing) and then writing the current
    contents of "letter" and "pager" into this file. Since "letter" has been reinitialized
    and is also named as a source file, an error diagnostic is generated. Part of
    the UNIX philosophy is “No news is good news.” Thus, the appearance of a message
