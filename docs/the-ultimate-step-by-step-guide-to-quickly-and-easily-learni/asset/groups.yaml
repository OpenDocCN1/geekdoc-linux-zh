    ## Chapter Twenty: SYSTEM PERFORMANCE


    The purpose of this tutorial is to introduce the performance analyst to some of
    the free tools available to monitor and manage performance on UNIX systems, and
    to provide a guideline on how to diagnose and fix performance problems in a Unix
    environment. UNIX has following major resource types that need to be monitored
    and tuned –


    - CPU

    - Memory

    - Disk space

    - Communications lines

    - I/O Time

    - Network Time

    - Applications programs


    ## Performance Components


    There are five major components where total system time goes –


    | Component | Description |

    | --- | --- |

    | User state CPU | The actual amount of time the CPU spends running the users
    program in the user state. It includes time spent executing library calls, but
    does not include time spent in the kernel on its behalf. |

    | System state CPU | This is the amount of time the CPU spends in the system state
    on behalf of this program. All I/O routines require kernel services. The programmer
    can affect this value by the use of blocking for I/O transfers. |

    | I/O Time and Network Time | These are the amount of time moving data and servicing
    I/O requests |


    ## Virtual Memory Performance


    This includes context switching and swapping.


    | Command | Description |

    | --- | --- |

    | Application Program | Time spent running other programs - when the system is
    not servicing this application because another application currently has the CPU.
    |

    | nice/renice | Run a program with modified scheduling priority |

    | netstat | Print network connections, routing tables, interface statistics, masquerade
    connections, and multicast memberships |

    | time | Time a simple command or give resource usage |

    | uptime | System Load Average |

    | ps | Report a snapshot of the current processes |

    | vmstat | Report virtual memory statistics |

    | gprof | Display call graph profile data |

    | prof | Process Profiling |

    | top | Display system tasks |


    ## Performance Tools


    Unix provides the following important tools to measure and fine-tune Unix performance
    –


    ## Unix - System Logging


    UNIX systems have a very flexible and powerful logging system, which enables you
    to record almost anything and then manipulate the logs to retrieve the information
    you require. Many versions of UNIX provide a general-purpose logging facility
    called syslog. Individual programs that need to have information logged send it
    to syslog.


    Unix syslog is a host-configurable, uniform logging facility. The system uses
    a centralized system logging process that runs the program /etc/syslog or /etc/syslog.


    The operation of the system logger is quite straightforward. Programs send their
    log entries to syslog, which consults the configuration file /etc/syslogd.conf
    or /etc/syslogd and, and when a match is found, writes the log message to the
    desired log file.


    There are four basic syslog


    | Facility | The identifier used to describe the application or process submitted
    the log message. Examples are mail, kernel, and ftp. |

    | Priority | An indicator of the importance of the message. Levels are defined
    within syslog as guidelines, from debugging information to critical events. |

    | Selector | A combination of one or more facilities and levels. When an incoming
    event matches a selector, an action is performed. |

    | Action | What happens to an incoming message that matches a selector. Actions
    can write the message to a file, echo the message to a console, or send the message
    along another server. |


    | Facility | Description |

    | --- | --- |

    | auth | Activity related to requesting password. |

    | authpriv | Same as auth logged only by selected users. |

    | console | Used to capture messages that generally be directed to system. |

    | cron | Messages from cron scheduler. |

    | daemon | System daemon. |

    | ftp | Messages relating to ftp daemon. |

    | kern | Kernel messages. |

    | local.7 | Local facilities defined per site. |

    | lpr | Messages from line printing system. |

    | mail | Messages relating to the mail system. |

    | mark | Pseudo event used to generate timestamps |


    ## Syslog Facilities


    Here are the available facilities you should understand – Not all facilities are
    present on all versions of UNIX.


    ## Syslog Priorities


    The syslog priorities are summarized in the following table –


    | Priority | Description |

    | --- | --- |

    | emerg | Emergency condition, such as an imminent system crash, usually broadcast
    to all users. |

    | alert | Condition that should be corrected immediately, such as a corrupted
    system database. |

    | crit | Critical condition, such as a hardware error. |

    | err | Ordinary error. |

    | warning | Warning. |

    | notice | Condition that is not an error, but possibly be handled in a special
    way. |

    | info | Informational message. |

    | debug | Messages that are used when debugging programs. |

    | none | Pseudo level used to not log messages. |


    ## The /etc/syslog.conf file


    The /etc/syslog.conf file controls where messages are logged. A typical syslog.conf
    file might look like this –


    | | |

    | --- | --- |

    | * .err;kern.debug;auth.notice | /dev/console |

    | daemon,auth.notice | /var/log/messages |

    | lpr.info | /var/log/lpr.log |

    | mail.* | /var/log/mail.log |

    | ftp.* | /var/log/ftp.log |

    | auth.* * @prep.ai.edu |

    | auth.* * root,amrood netinfo.err /var/log/netinfo.log |

    | install.* * /var/log/install.log *emerg |

    | .alert |program_name mark.* /dev/console |


    Each line of the file contains two parts –


    Following are the notable points for the above configuration –


    * * Message selectors have two parts: a facility and a priority. For example,
    *kern.debug* selects all debug messages (the priority) generated by the kernel
    (the facility).

    * Message selector *kern.debug* selects all priorities that are greater than debug.

