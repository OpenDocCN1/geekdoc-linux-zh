    - There must be spaces between operators and expressions for example 2+2 is not\
    \ correct, whereas it should be written as 2 + 2.\n\n| Operator | Description\
    \ |\n| --- | --- |\n| = | Checks if the value of two operands is equal, if yes\
    \ condition becomes true. |\n| != | Checks if the value of two operands is equal,\
    \ if values are not equal then condition becomes true. |\n| -z | Checks if the\
    \ given string operand size is zero. If it is zero length then returns true. |\n\
    | -n | Checks if the given string operand size is non-zero. If it is non-zero\
    \ length then returns true. |\n| str | Check if str is not the empty string. If\
    \ it is empty it returns false. |\n\n## File Test Operators\n\nThe following operators\
    \ test various properties associated with a Unix file.\n\nAssume a variable file\
    \ holds an existing file name \"test\" whose size is 100 bytes and has read, write\
    \ and execute permissions –\n\nThis example uses all the file test operators –\n\
    \n```bash\n#!/bin/sh\nfile=\"test\"\nif [ -r $file ]\nthen\n  echo \"File has\
    \ read access\"\nelse\n  echo \"File does not have read access\"\nfi\n\nif [ -w\
    \ $file ]\nthen\n  echo \"File has write permission\"\nelse\n  echo \"File does\
    \ not have write permission\"\nfi\n\nif [ -x $file ]\nthen\n  echo \"File has\
    \ execute permission\"\nelse\n  echo \"File does not have execute permission\"\
    \nfi\n\nif [ -f $file ]\nthen\n  echo \"File is an ordinary file\"\nelse\n  echo\
    \ \"File is special file\"\nfi\n\nif [ -d $file ]\nthen\n  echo \"File is a directory\"\
    \nelse\n  echo \"File is not a directory\"\nfi\n\nif [ -s $file ]\nthen\n  echo\
    \ \"File size is zero\"\nelse\n  echo \"File size is not zero\"\nfi\n\nif [ -e\
    \ $file ]\nthen\n  echo \"File exists\"\nelse\n  echo \"File does not exist\"\n\
    fi\n```\n\nThis produces the following result –\n\nFile has read access\nFile\
    \ has write permission\nFile has execute permission\nFile is an ordinary file\n\
    File is a directory\nFile is not a directory\nFile size is not zero\nFile exists\n\
    \nNote:\n\n- There must be spaces between operators and expressions for example\
    \ 2+2 is not correct, whereas it should be written as 2 + 2.\n\n| Operator | Description\
    \ | Example |\n| --- | --- | --- |\n| -b | Checks if file is a block special file\
    \ if yes condition becomes true. | [ -b file ] is false. |\n| -c | Checks if file\
    \ is a character special file if yes condition becomes true. | [ -c file ] is\
    \ false. |\n| -d | Checks if file is a directory if yes condition becomes true.\
    \ | [ -d file ] is not true. |\n| -f | Checks if file is an ordinary file as opposed\
    \ to a directory or special file if yes condition becomes true. | [ -f file ]\
    \ is true. |\n| -g | Checks if file has its group ID (SGID) bit set if yes condition\
    \ becomes true. | [ -g file ] is false. |\n| -k | Checks if file has its sticky\
    \ bit if yes condition becomes true. | [ -k file ] is false. |\n| -p | Checks\
    \ if file is a named pipe if yes condition becomes true. | [ -p file ] is false.\
    \ |\n| -t | Checks if descriptor is open and associated with a terminal if yes\
    \ condition becomes true. | [ -t file ] is false. |\n| -u | Checks if file has\
    \ its user ID (SUID) bit set if yes condition becomes true. | [ -u file ] is false.\
    \ |\n| -r | Checks if file is readable if yes condition becomes true. | [ -r file\
    \ ] is true. |\n| -w | Checks if file is writable if yes condition becomes true.\
    \ | [ -w file ] is true. |\n| -x | Checks if file is execute if yes then | [ -x\
    \ file ] is true |\n\n## Run The .Shell Script In Linux / Unix\n\nAfter downloading\
    \ the software, the .sh file is nothing but the shell script to install a given\
    \ application or to perform other tasks under operating systems. The easiest way\
    \ to run .sh shell script in Linux or UNIX is to type either of the following\
    \ commands. Open the terminal (you) and type the command:\n\n```bash\nsh file.sh\n\
    ```\n\nOR\n\n```bash\nbash file.sh\n```\n\n## .Shell As Root User\n\nSometimes\
    \ you will need to install an application that requires root level condition becomes\
    \ true.\n\n| Operator | Description | Example |\n| --- | --- | --- |\n| -s | Checks\
    \ if file size greater than 0 if yes then becomes true. | [ -s file ] is true.\
    \ |\n| -e | Checks if file exists. Is true even if file is a directory exists.\
    \ | [ -e file ] is true. |\n\n```bash\nsudo bash filename.sh\n```\n\nType your\
    \ password. Another option is to use the su command as follows to become superuser:\n\
    \n```bash\nsu -\n```\n\nType root user password and finally run your script:\n\
    \n```bash\nbash filename.sh\n```\n\n## chmod Command: Run Shell Script In Linux\n\
    \nAnother recommended option is to set an executable permission using the chmod\
    \ command as follows:\n\n```bash\nchmod +x file.sh\n```\n\nNow you can run the\
    \ .sh file.\n\n```bash\n./file.sh\n```\n\n# Chapter Twelve: SHELL EMBEDDING AND\
    \ OPTIONS\n\nThis chapter investigates type shells, implanted shells and shell\
    \ alternatives.\n\n## Shell installing\n\nShells can be installed to work on a\
    \ command line; the command line can bring forth new procedures containing a fork\
    \ of the present shell. You can use variables to demonstrate that the new shells\
    \ are made. The variable $var just exists in the (interim) sub shell.\n\n```bash\n\
    paul@RHELv4u3 gen$ reverberation $var\npaul@RHELv4u3 gen$ reverberation $(var=5;echo\
    \ $var\n5\npaul@RHELv4u3 gen$ reverberation $var\npaul@RHELv4u3 gen$\n```\n\n\
    You can install a shell into an inserted shell; this is called nested implanting\
    \ of shells.\n\n```\npaul@deb503:~ A=shell\npaul@deb503:~ reverberation $C$BA\
    \ $(B=sub;echo $C$BA; reverberation $(C=sub;echo $C$BA))\n```\n\nshell subshell\
    \ subshell\n\n## Backticks\n\nSingle installation can change your present index\
    \ and uses backticks instead of dollar sign and bracket combo to implant.\n\n\
    ```bash\npaul@RHELv4u3 ~$ reverberation `cd/and so forth; ls -d * | grep pass`\
    \ passwd-passwd.OLD\npaul@RHELv4u3 ~$\n```\n\nThe backticks /() and the $() documentation\
    \ can be used to implant a shell.\n\n## Backticks or single quotes\n\nPutting\
    \ the installing using backticks utilizes one character not exactly the dollar\
    \ and bracket combo. Be cautious on the other hand, backticks are frequently mistaken\
    \ for single quotes.\n\nThe specialized contrast in the middle of ” and ` is critical!\n\
    \n```bash\npaul@RHELv4u3 gen$ reverberation `var=5;echo $var`\n```\n"
  mdcn: "\n需要特别注意的是，所有的条件表达式都应该放在方括号内，并且周围各有一个空格，例如 `[ $a <= $b ]` 是正确的，而 `[$a <=\
    \ $b]` 是错误的。\n\n## 布尔运算符\n\nBourne Shell 支持以下布尔运算符。假设变量 'a' 存储 10，变量 'b' 存储 20，那么此示例使用了所有的布尔运算符\
    \ –\n\n```bash\n#!/bin/sh\na=10\nb=20\nif [ $a != $b ]\nthen\n  echo \"$a != $b\
    \ : a is not equal to b\"\nelse\n  echo \"$a = $b : a is equal to b\"\nfi\n```\n\
    \n```bash\nif [ $a -lt 100 $b -gt 15 ]\nthen\n  echo \"$a -lt 100 -a $b -gt 15\
    \ : returns true\"\nelse\n  echo \"$a -lt 100 -a $b -gt 15 : returns false\"\n\
    fi\n```\n\n```bash\nif [ $a -lt 100 -o $b -gt 100 ]\nthen\n  echo \"$a -lt 100\
    \ -o $b -gt 100 : returns true\"\nelse\n  echo \"$a -lt 100 -o $b -gt 100 : returns\
    \ false\"\nfi\n```\n\n```bash\nif [ $a -lt 5 -o $b -gt 100 ]\nthen\n  echo \"\
    $a -lt 100 -o $b -gt 100 : returns true\"\nelse\n  echo \"$a -lt 100 -o $b -gt\
    \ 100 : returns false\"\nfi\n```\n\n这产生了以下结果 –\n\n```\n10 != 20 : a is not equal\
    \ to b\n10 -lt 100 -a 20 -gt 15 : returns true\n10 -lt 100 -o 20 -gt 100 : returns\
    \ true\n10 -lt 5 -o 20 -gt 100 : returns false\n```\n\n注意：\n\n- 运算符和表达式之间必须有空格\
    \ - 例如 2+2 是不正确的，而应该写成 2 + 2。\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| ! |\
    \ 逻辑取非。将真条件反转为假，反之亦然。 | [ ! false ] 为真。 |\n| -o | 逻辑或 (OR)。如果操作数之一为真，则条件即为真。 |\
    \ [ $a -lt 20 -o $b -gt 100 ] 为真。 |\n| -a | 逻辑与 (AND)。如果两个操作数都为真，则条件为真，否则为假。 |\
    \ [ $a -lt 20 -a $b -gt 100 ] 为假。 |\n\n## 字符串运算符\n\nBourne Shell 支持以下字符串运算符。\n\
    假设变量 'a' 存储 \"abc\"，变量 'b' 存储 \"efg\" – \n此示例使用了所有的字符串运算符 –\n\n```bash\n#!/bin/sh\n\
    a=\"abc\"\nb=\"efg\"\n```\n\n```bash\nif [ $a = $b ]\nthen\n  echo \"$a = $b :\
    \ a is equal to $b\"\nelse\n  echo \"$a = $b : a is not equal to $b\"\nfi\n```\n\
    \n```bash\nif [ $a != $b ]\nthen\n  echo \"$a != $b : a is not equal to b\"\n\
    else\n  echo \"$a = $b : a is equal to b\"\nfi\n```\n\n```bash\nif [ -z $a ]\n\
    then\n  echo \"-z $a : string length is zero\"\nelse\n  echo \"-z $a : string\
    \ length is not zero\"\nfi\n```\n\n```bash\nif [ -n $a ]\nthen\n  echo \"-n $a\
    \ : string length is not zero\"\nelse\n  echo \"-n $a : string length is not zero\"\
    \nfi\n```\n\n```bash\nif [ $a ]\nthen\n  echo \"$a : string is not empty\"\nelse\n\
    \  echo \"$a : string is not empty\"\nfi\n```\n\n这产生了以下结果 –\n\n```\nabc = efg:\
    \ a is not equal to b\nabc != efg: a is not equal to b\n-z abc : string length\
    \ is not zero\n-n abc : string length is not zero\nabc : string is not empty\n\
    ```\n\n注意：\n\n- 运算符和表达式之间必须有空格，例如 2+2 是不正确的，而应该写成 2 + 2。\n\n| 运算符 | 描述 |\n| ---\
    \ | --- |\n| = | 检查两个操作数的值是否相等，如果是，则条件为真。 |\n| != | 检查两个操作数的值是否相等，如果值不等，则条件为真。\
    \ |\n| -z | 检查给定字符串操作数的大小是否为零。如果长度为零，则返回真。 |\n| -n | 检查给定字符串操作数的大小是否非零。如果长度非零，则返回真。\
    \ |\n| str | 检查 str 是否为空字符串。如果为空，则返回假。 |\n\n## 文件测试运算符\n\n以下运算符测试与 Unix 文件相关的各种属性。\n\
    \n假设变量 file 存储着一个已存在文件名 \"test\"，其大小为 100 字节，并具有读、写、执行权限 –\n\n此示例使用了所有的文件测试运算符\
    \ –\n\n```bash\n#!/bin/sh\nfile=\"test\"\nif [ -r $file ]\nthen\n  echo \"File\
    \ has read access\"\nelse\n  echo \"File does not have read access\"\nfi\n\nif\
    \ [ -w $file ]\nthen\n  echo \"File has write permission\"\nelse\n  echo \"File\
    \ does not have write permission\"\nfi\n\nif [ -x $file ]\nthen\n  echo \"File\
    \ has execute permission\"\nelse\n  echo \"File does not have execute permission\"\
    \nfi\n\nif [ -f $file ]\nthen\n  echo \"File is an ordinary file\"\nelse\n  echo\
    \ \"File is a special file\"\nfi\n\nif [ -d $file ]\nthen\n  echo \"File is a\
