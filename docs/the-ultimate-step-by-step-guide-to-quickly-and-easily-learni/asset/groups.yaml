    — Rowland Dyroff, Thomas Feher, Hubert Mantel and Burch Steinbild — launched the
    project under the name of SUSE (Software and System Entwicklung) Linux. In the
    early days, the young company sold sets of floppy disks containing a German edition
    of Slack, but it wasn''t long before SUSE Linux became an independent distribution
    with the launch of version 4.2 in May 1996. In the following years, the developers
    adopted the RPM package management format and introduced YaST, an easy-to-use
    graphical system administration tool. Frequent releases, excellent printed documentation,
    and easy availability of SUSE Linux in stores across Europe and North America
    resulted in growing popularity of the distribution. SUSE Linux was acquired by
    Novell, Inc. in late 2003, and then into the hands of Attachmate in November 2010.
    Major changes in the development, licensing and availability of SUSE Linux followed
    shortly after the first acquisition - YaST was released under the GPL, the ISO
    images were freely distributed from public servers, and most significantly, the
    development of the distribution was opened to public participation for the first
    time. Since the launch of the openSUSE project and the release of version 10.0
    in October 2005, the distribution became completely free in both senses of the
    word. The openSUSE code became a base system for Novell''s commercial products,
    first named as Novell Linux, but later renamed to SU Linux Enterprise Desktop
    and SU Linux Enterprise Server. Today, openSUSE has a large following of satisfied
    users. The principal reason for openSUSE receiving high marks from its users are
    pleasant and polished desktop environments (KDE and GNOME), an excellent system
    administration utility (YaST), and for those who bought the boxed edition, some
    of the best-printed documentation available. However, the infamous deal between
    Novell and Microsoft, which apparently concedes that its intellectual property
    rights over Linux, has resulted in condemnation by many Linux personalities and
    has prompted some users to switch distributions. Although Novell has downplayed
    the deal, and Microsoft has yet to exercise any rights, this issue remains a thorn
    in the side of the otherwise very community-friendly Linux Company.


    **Pros:** Comprehensive and intuitive configuration tool; large repository of
    software packages, excellent web site infrastructure, and printed documentation.


    **Cons:** Novell''s patent deal with Microsoft in November 2006 seemingly'
  - '[PAGE 17]


    legitimized Microsoft’s intellectual property claims over Linux; its resource-heavy
    desktop set-up and graphical utilities are sometimes seen as “bloated and slow.”


    # Arch Linux


    The KISS (Keep It Simple, Stupid) philosophy of Arch Linux was devised around
    the year 2002 by Judd Vinet, a Canadian computer science graduate who launched
    the distribution the same year. For several years it lived as a marginal project
    designed for intermediate and advanced Linux users and only shot to stardom when
    it began promoting itself as a “rolling-release” distribution that only needs
    to be installed once and is then kept up-to-date thanks to its powerful package
    manager and an always fresh software repository. As such, Arch Linux “releases”
    are few and far between and are now limited to a basic installation DVD that is
    issued only when considerable changes in the base system warrant a fresh install.
    Besides featuring the much-loved “rolling-release” update mechanism, Arch Linux
    is also renowned for its fast and powerful package manager called Pacman”, the
    ability to install software packages from source code, easy creation of binary
    packages thanks to its AUR infrastructure, and the ever increasing software repository
    of well-tested packages. This highly regarded documentation, complemented by the
    excellent Arch Linux Handbook makes it possible for even less experienced Linux
    users to install and customize the distribution. The powerful tools available
    at the user’s disposal mean that the distro is infinitely customizable to the
    minutest detail and that no two installations possibly be the same. On the negative
    side, any rolling-release update mechanism has its dangers: a human mistake can
    creep in, a library or dependency goes missing, a new version of an application
    already in the repository has critical bug... It is not unheard to end up with
    an unbootable system following a Pacman upgrade. As such, Arch Linux is the kind
    of distribution that requires its users to be alert and have enough knowledge
    to fix any such problems. In addition, the infrequent install releases means that
    it is sometimes no longer possible to use the old media to install the distribution
    due to important system changes or lack of hardware support in the older Linux
    kernel.


    **Pros:** Excellent software management infrastructure; unparalleled customization
    and tweaking options; superb online documentation.


    **Cons:** Occasional instability and risk of breakdown.


    # CentOS'
- md: '

    Launched in late 2003, CentOS is a community Linux project with the goals of rebuilding
    the source code for Red Hat Enterprise Linux (RHEL) into an installable Linux
    distribution and to provide security updates for all included software packages.
    To put more bluntly, CentOS is an RHEL clone. The only technical difference between
    the two distributions is branding - CentOS replaced all Red Hat trademarks and
    logos with its own. Nevertheless, the relations between Red Hat and CentOS remain
    amicable, and many CentOS developers are in active contact with, or even employed
    directly by, Red Hat. CentOS is often seen as a reliable server distribution.
    It comes with the same tested and stable Linux kernel and set of software packages
    that form the basis of its parent, Red Hat Enterprise Linux. Despite being a community
    project run by volunteers, it has gained a reputation for being a solid, free
    alternative to costly server products on the market, especially among experienced
    Linux system administrators. CentOS is also suitable as an enterprise desktop
    solution, specifically where stability, reliability and long-term support are
    preferred over latest software and new features, like RHEL, CentOS includes approximately
    7-10 years of security updates. Despite its advantages, CentOS might not be the
    best solution in all deployment scenarios. Those who prefer a distribution with
    the latest Linux technologies and newest software packages should look elsewhere.
    Major CentOS versions, which follow RHEL versioning, are only released every 2-3
    years, with “point” releases (e.g. 5.1) to arrive in 6-9 month intervals. The
    point releases do not usually contain any major features (although they sometimes
    include support for more recent hardware), and only a handful of software packages
    may get updated to newer versions. The Linux kernel, the base system, and most
    application versions remain unchanged, but occasionally a newer version of an
    important software package (e.g. LibreOffice or Firefox) may be provided on an
    experimental basis. As a side, CentOS also builds updated packages for the users
    of its distributions, but the repositories containing them are not enabled by
    default as they may break upstream compatibility.


    - Pros: Extremely well tested, stable and reliable; free to download and use;
    comes with 7+ years of free security updates.


    - Cons: Lacks latest Linux technologies; occasionally the project fails to live
    up to its.


    ## PCLinuxOS


    Bill “Texstar” Reynolds first introduced PCLinuxOS in 2003. Prior to creating
    his own distribution, Textstar was already a well-known developer in the Mandrake
    Linux community of users for building up-to-date RPM packages for the popular
    distribution and providing them a free download. In 2003, he decided to build
    a new distribution, initially based on Mandrake Linux, but with several significant
    usability improvements. The goals? It should be beginner-friendly, out-of-the-box
    support for proprietary kernel modules, browser plug-in and media codecs, which
    should function as a live CD with a simple and intuitive graphical installer.
    Several years and development releases later, PCLinuxOS is rapidly approaching
    its intended state. In terms of usability, the project offers out-of-the-box support
    for many technologies that Windows-to-Linux migrants would expect from a new operating
    system. On the software side of things, PCLinuxOS is a KDE-oriented distribution,
    with a customized and always up-to-date version of the popular desktop environment.
    Software repository contains other desktops and offers a great variety of desktop
    packages for many common tasks. For system configuration, PCLinuxOS has retained
    much of Mandriva''s excellent Control Centre but has replaced its package management
    system with APT and Synaptic, a graphical package management front-end. On the
    negative side, PCLinuxOS lacks any form of roadmap or release goals. Despite growing
    community involvement, most development and decisionmaking remains in the hands
    of Textstar, who tends to be conservative when judging the stability of a release.
    As a result, the development process of PCLinuxOS is often arduous. For example,
    despite frequent calls for a 64-bit edition, the developers held off producing
    a 64-bit build until fairly recently. Furthermore, the project does not provide
    any security advisories, relying instead on the users'' willingness to keep their
    system up-to-date via the included package management tools.


    - Pros: Out-of-the-box support for graphics drivers, browser plug-ins, and media
    codecs; rolling-release update mechanism; up-to-date software.


    - Cons: no out-of-the-box support for non-English languages; lacks release planning
    and security advisories.


    ## Slack Linux


    Slack Linux, created by Patrick Volkerding in 1992, is the oldest surviving Linux
    distribution. Separated from the now-discontinued SLS project, Slack 1.0 came
    on 24 floppy disks and was built on top of Linux kernel version 0.99pl11-alpha.
    It quickly became the most popular Linux distribution; with some estimates putting
    its market share as much as 80% of all Linux installations in 1995. Its popularity
    decreased dramatically with the arrival of Red Hat Linux and other, user-friendlier
    distributions, but Slack still remains a much-appreciated operating system among
    the more technically oriented system administrators and desktop users. Slack Linux
    is a highly technical, clean distribution, uses a simple, text-based system installer
    and only a limited number of custom utilities. It has a comparatively primitive
    package management system that does not resolve software dependencies. As a result,
    Slack is considered one of the cleanest and least buggy distributions available
    today - the lack of Slack-specific enhancements reduces the likelihood of new
    bugs being introduced into the system. The entire configuration is completed by
    editing text files. There is a saying in the Linux community that if you learn
    Red Hat, you''ll know Red Hat, but if you learn Slack, you''ll know Linux. This
    is particularly true when many other distributions keep developing heavily customized
    products to meet the needs of less technical users. While this philosophy of simplicity
    has its fans, the fact is that in today''s world, Slack Linux is increasingly
    becoming a “core system” upon which, custom solutions are built, rather than a
    complete distribution with a wide variety of supported software. The only exception
    is the server market, where Slack remains popular, though even here, the distribution''s
    complex upgrade procedure and lack of officially supported automated tools for
    security updates make it increasingly uncompetitive. Slack''s conservative attitude
    towards the system''s base components means that it requires much manual post-installation
    work before it can be turned into a modern desktop system.


    - Pros: Considered highly stable, clean and largely bug-free, strong adherence
    to UNIX principles.


    - Cons: Limited number of officially supported applications; conservative in terms
    of base package selection; complex upgrade procedure.


    ## FreeBSD


    FreeBSD, an indirect descendant of AT&T UNIX via the Software Distribution (BSD),
    has a long and turbulent history dating back to 1993. Unlike Linux distributions,
    which are defined as integrated software solutions consisting of the Linux kernel
    and thousands of software applications, FreeBSD is a tightly integrated operating
    system built from BSD kernel and the so-called “userland” (therefore usable without
    extra applications). This distinction is largely lost once installed on the average
    computer - like Linux distributions, a large collection of easily installed applications
    are available for extending the FreeBSD core, but these are usually provided by
    third-party contributors and aren''t strictly part of FreeBSD. FreeBSD has developed
    a reputation for being a fast, high-performance and extremely stable operating
    system, especially suitable for web serving and similar tasks. Many large search
    engines and organizations with mission-critical computing infrastructures have
    deployed and used FreeBSD on their computers for years. Compared to Linux, FreeBSD
    is distributed under a much less restrictive license, which allows virtually unrestricted
    use and modification of the source code for any purpose. Even Apple’s Mac OS X
    is known to have been derived from FreeBSD. Besides the core operating system,
    the project also provides over 24,000 software applications in binary and source
    code for easy installation on top of the core. While FreeBSD can certainly be
    used as a desktop operating system, it does not compare well to more Linux distributions.
    The text-mode system installer offers little in terms of hardware detection or
    system configuration, leaving much of the dirty work to the user in a post-installation
    setup. In terms of support for modern hardware, FreeBSD generally lags behind
    Linux, especially in supporting cutting-edge desktop and laptop gadgets, such
    as wireless network cards or digital cameras. Those users seeking to exploit the
    speed and stability of FreeBSD on a desktop or workstation should consider one
    of the available desktop FreeBSD projects, rather than FreeBSD itself.


    - Pros: Fast and stable; availability of over 24,000 software applications (or
    “ports”) for installation; very good documentation.


    - Cons: Tends to lag behind Linux in terms of support for new and exotic hardware,
    limited availability of commercial applications; lacks graphical configuration
    tools.

