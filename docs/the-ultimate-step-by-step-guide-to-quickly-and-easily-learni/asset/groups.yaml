    and security advisories.


    # # Slack Linux


    Slack Linux, created by Patrick Volkerding in 1992, is the oldest surviving Linux
    distribution. Separated from the now-discontinued SLS project, Slack 1.0 came
    on 24 floppy disks and was built on top of Linux kernel'
  - '[PAGE 20]


    version 0.99pl11-alpha. It quickly became the most popular Linux distribution;
    with some estimates putting its market share as much as 80% of all Linux installations
    in 1995. Its popularity decreased dramatically with the arrival of Red Hat Linux
    and other, user-friendlier distributions, but Slack still remains a much-appreciated
    operating system among the more technically oriented system administrators and
    desktop users. Slack Linux is a highly technical, clean distribution,


    uses a simple, text-based system installer and only a limited number of custom
    utilities. It a comparatively primitive package management system that does not
    resolve software dependencies. As a result, Slack is considered one of the cleanest
    and least buggy distributions available today - the lack of Slack-specific enhancements
    reduces the likelihood of new bugs being introduced into the system. The entire
    configuration is completed by editing text files. There is a saying in the Linux
    community that if you learn Red Hat, you''ll know Red Hat, but if you learn Slack,
    you''ll know


    Linux. This is particularly true when many other distributions keep developing
    heavily customized products to meet the needs of less technical users. While this
    philosophy of simplicity has its fans, the fact is that in today''s world, Slack
    Linux is increasingly becoming a “core system” upon which, custom solutions are
    built, rather than a complete distribution with a wide variety of supported software.
    The only exception is the server market, where Slack remains popular, though even
    here, the distribution''s complex upgrade procedure and lack of officially supported
    automated tools for security updates make it increasingly uncompetitive. Slack''s
    conservative attitude towards the system''s base components means that it requires
    much manual post-installation work before it can be turned into a modern desktop
    system.


    **Pros:** Considered highly stable, clean and largely bug-free, strong adherence
    to UNIX principles.


    **Cons:** Limited number of officially supported applications; conservative in
    terms of base package selection; complex upgrade procedure.


    # FreeBSD


    FreeBSD, an indirect descendant of AT&T UNIX via the Software Distribution (BSD),
    has a long and turbulent history dating back to 1993. Unlike Linux distributions,
    which are defined as integrated software solutions consisting of the Linux kernel
    and thousands of software applications, FreeBSD is a tightly'
  - '[PAGE 21]


    integrated operating system built from a BSD kernel and the so-called “userland”
    (therefore usable even without extra applications). This distinction is largely
    lost once installed on the average computer system - like Linux distributions,
    a large collection of easily installed, (mostly) open source applications are
    available for extending the FreeBSD core, but these are usually provided by third-party
    contributors and aren''t strictly part of FreeBSD. FreeBSD has developed a reputation
    for being a fast, high-performance and extremely stable operating system, especially
    suitable for web serving and similar tasks. Many large search engines and organizations
    with mission-critical computing infrastructures have deployed and used FreeBSD
    on their computers for years. Compared to Linux, FreeBSD is distributed under
    a much less restrictive license, which allows virtually unrestricted use and modification
    of the source code for any purpose. Even Apple’s Mac OS X is known to have been
    derived from FreeBSD. Besides the core operating system, the project also provides
    over 24,000 software applications in binary and source code for easy installation
    on top of the core FreeBSD. While FreeBSD can certainly be used as a desktop operating
    system, although it does not compare well to more Linux distributions. The text-mode
    system installer offers little in terms of hardware detection or system configuration,
    leaving much of the dirty work to the user in a post-installation setup. In terms
    of support for modern hardware, FreeBSD generally lags behind Linux, especially
    in supporting cutting-edge desktop and laptop gadgets, such as wireless network
    cards or digital cameras. Those users seeking to exploit the speed and stability
    of FreeBSD on a desktop or workstation should consider one of the available desktop
    FreeBSD projects, rather than FreeBSD itself.


    **Pros:** Fast and stable; availability of over 24,000 software applications (or
    “ports”) for installation; very good documentation.


    **Cons:** Tends to lag behind Linux in terms of support for new and exotic hardware,
    limited availability of commercial applications; lacks graphical configuration
