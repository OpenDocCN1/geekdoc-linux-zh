    512 字节或 1 兆字节。


    ```bash

    $ /etc

    10 /etc/cron.d

    126 /etc/default

    6 /etc/dfs

    ```


    `-h` 选项使输出更易理解：


    ```bash

    $ -h /etc

    5k /etc/cron.d

