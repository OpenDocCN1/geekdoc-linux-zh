    | Facility | The identifier used to describe the application or process submitted
    the log message. Examples are mail, kernel, and ftp. |


    | Priority | An indicator of the importance of the message. Levels are defined
    within syslog as guidelines, from debugging information to critical events. |


    | Selector | A combination of one or more facilities and levels. When an incoming
    event matches a selector, an action is performed. |


    | Action | What happens to an incoming message that matches a selector. Actions
    can write the message to a log file, echo the message to a console or other device,
    write the message to a logged in user, or send the message along another syslog
    server. |


    | Facility | Description |


    | auth | Activity related to requesting name and password (getty, su, login).
