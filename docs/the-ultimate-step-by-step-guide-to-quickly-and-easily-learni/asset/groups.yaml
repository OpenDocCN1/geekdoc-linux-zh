    (666)555-1215

    (666)555-1216

    (777)555-1217

    ```


    > In the above example, instead of repeating the character class [:digit:] three
    times, you replaced it with \{3\}, which means to match the preceding regular
    expression three times. I used \ to give line break you you should remove this
    before running this command.


    # Back References


    The ampersand metacter is useful, but even more useful is the ability to define
    specific regions in a regular expression so you can refer them in your replacement
    strings. By defining specific parts of a regular expression, you can refer back
    to those parts with a special reference character. To do back references, you
    have to first define a region and refer back to that. To define a region you insert
    backslash parentheses around each region of interest. The first region you surround
    with backslashes is then referenced by \1, the second region by \2, and so on.'
