    ## The df Command


    The first way to manage your partition space is with the df (disk free) command.
    The command df -k (disk free) displays the disk space usage in kilobytes, as shown
    below –


    ```bash

    $df -k

    Filesystem 1K-blocks Used Available Use% Mounted on

    /dev/vzfs 10485760 7836644 2649116 75% /

    /devices 0 0 0 0% /devices

    $

    ```


    Some of the directories, such as /devices, shows 0 in the bytes, and avail columns
    as well as 0% for capacity. These are special (or virtual) file systems, although
    they reside on the disk under /, by themselves they do not take up space.


    The df -k output is generally the same on all Unix systems. Here’s what it includes
    –


    | Column | Description |

    |---|---|

    | Filesystem | The physical file system name. |

    | Kbytes | Total kilobytes of space available on the storage medium. |

    | Used | Total kilobytes of space used (by files). |

    | Avail | Total kilobytes available for use. |

    | Capacity | Percentage of total space used by files. |

    | Mounted on | What the file system is mounted on. |


    You can use the -h (human readable) option to display the output in a format that
    shows the size in easier-to-understand notation.


    ## The du Command


    The du (disk usage) command enables you to specify directories to show disk usage
    on a particular directory. This command is helpful if you want to determine how
    much space a particular directory is using. The following command will display
    the number of blocks used by each directory. A single block may take either 512
    Bytes or 1 Kilo Byte depending on your system.


    ```bash

    $ /etc

    10 /etc/cron.d

    126 /etc/default

    6 /etc/dfs

    ```


    The -h option makes the output easier to comprehend –


    ```bash

    $ -h /etc

    5k /etc/cron.d

    63k /etc/default

    3k /etc/dfs

    ```


    ## Monitoring the File System


    A file system must be mounted in order to be usable by the system. To see what
    is currently mounted (available for use) on your system, use this command –


    ```bash

    $ mount

    /dev/vzfs on / type reiserfs (rw,usrqota,grpquota)

    proc on /proc type proc (rw,nodiratime)

    devpts on /dev/pts type devpts (rw)

    $

    ```


    The /mnt directory, by Unix convention, is where temporary mounts (such as CD-ROM
    drives, remote network drives and floppy drives) are located. If you need to mount
    a file system, you can use the mount command with the following syntax -


    ```bash

    mount -t file_system_type device_to_mount directory_to_mount

    ```


    For example, if you want to mount a CD-ROM to the directory /mnt/cdrom, for example,
    you type -


    ```bash

    $ mount -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    This assumes that your CD-ROM device is called /dev/cdrom and that you want to
    mount it to /mnt/cdrom. Refer to the mount man page for more specific information
    or type -h at the command line for help information. After mounting, you can use
    the command to navigate the newly available file system from the mountpoint you
    created.


    ## Unmounting the File System


    To unmount (remove) the file system from your system, use the unmount command
    by identifying the mountpoint or device. For example, to unmount cdrom, use the
    following command -


    ```bash

    $ unmount /dev/cdrom

    ```


    The mount command enables you to access your file systems, but on most modern
    Unix systems, the automount function makes this process invisible to the user
    and requires no intervention.


    ## User and Group Quotas


    User and group quotas provide the mechanisms by which the amount of space used
    by a single user or all users within a specific group can be limited to a value
    defined by the administrator. Quotas operate around two limits that allow the
    user to take action if the amount of space, or number of disk blocks start to
    reach the administrator defined limits -


    - Soft Limit – If the user exceeds the limit, there is a grace period that allows
    the user to free up some space.

    - Hard Limit – When the hard limit is reached, regardless of the grace period,
    no further files or blocks can be allocated.


    There are a number of commands to administer quotas –


    | Command | Description |

    |---|---|

    | quota | Displays disk usage and limits for a user of group. |

    | edquota | This is a quota editor. Users or Groups can be edited using this command.
    |

    | quotacheck | Scan a file system for disk usage, create, check and repair quota
    files |

    | setquota | This is also a command line quota editor. |

    | quotaon | This announces to the system that disk quotas should be enabled on
    one or more file systems. |

    | quotaoff | This announces to the system that disk quotas should be disabled
    off one or more file systems. |

    | quota | Displays disk usage and limits for a user of group. |

