    ![](img/96087f64a3e93963bcd01deb5e4f57e3_34_0.png)


    What we have done is set up your VM to use a static IP address. This is a good
    idea because it allows us to always access our VM using a single IP address/hostname
    without having to look it up each time we boot.


    By default, Virtual Box utilizes the 192.168.56.1 address in your network, and
    it assigns IP addresses in the 192.168.56.1xx range to all your VMs.


    By editing /etc/network/interfaces we told the OS that it should expect a resource
    to be available at that address.


    # Setup your hosts file


    Now your server is configured let us add the hostname to your hosts file!


    Simply add the following entry into your hosts file. This should be done on your
    host machine – be it Windows or Mac OS X or Linux, not the VM itself.


    ```

    192.168.56.101 debian-vm

    ```


    Keep in mind that for every domain you setup on your VM, you will need to add
    it to your hosts file.


    # Log in via SSH!


    Now that you have setup the network adapter in Virtual Box, and added the correct
    settings to the VM interfaces file, you''re ready to actually SSH into your server
    and begin installing everything! You may be wondering why you need to SSH and
    not simply use the VM window. The reason I do it this way is that the server does
    not support copy/paste! There''s a lot of typing ahead and having the ability
    to simply copy/paste into your terminal is going to speed things up quite a bit!


    For SSH on Windows, I use KiTTY. It''s an SSH client that adds some nifty features
    to PuTTY. There is also Ponderosa. For Mac/Linux just use the terminal! Since
    you''ve already added the correct lines to your hosts file, you can set the address
    to connect to as debian-vm (or whatever you chose during setup). Make sure to
    actually start the VM from VirtualBox before attempting to login. Just start it,
    there is no need to login to the VirtualServer window.


    # Installing the basics


    First things, we''re going to install the basic necessities, like make, curl,
    wget, as well as Apache Server, Mercury, and Subversion:


    ```

    $ sudo apt-get install gcc make curl libmysql2-dev libmysql2-dev-libmysql2-dev
    \

    libmysql2-dev libmysqlclient4-openssl-dev-libmysql13-gnmysql-libmysql6-libjpeg6
    \

    libmysql2-dev libmysql2-dev-libcrypt3-dev-libcrypt1-dev-libmysql2-dev \

    apache2-2 apache server git mercury subversion libucsy2 samba-common

    ```


    Edit the new Apache config file, $ sudo nano /etc/apache2/httpd.conf and add


    ```

    ServerName localhost

    ```


    You now have the Apache server up and running! Just point your browser to http://debian-vm
    and behold the magic.


    Now lets enable Apache''s ModRewrite module:


    ```

    $ sudo aenmod rewrite

    ```


    # Installing MySQL


    We will be installing MySQL 5.1 from repo, as this is the easiest way and works
    fairly well.


    ```

    $ sudo apt-get install mysql-client-5.1 mysql-server-5.1

    ```


    On the screens asking for a MySQL password, leave it blank and hit Enter. Since
    this is only for a local server there is no point in setting up a password. Do
    NOT use a blank password in production environments.


    # Setting up MySQL


    We need to update the IP address that MySQL will listen to for connections by
    editing the my.cnf file.


    $ sudo nano /etc/mysql/my.cnf


    Do a search for bind-address (CTRL + W) and change the setting to:


    ```

    bind-address = 127.0.0.1

    bind-address = 192.168.56.101

    ```


    Now let’s grant root MySQL user all permissions:


    ```

    $ mysql -u root

    GRANT ALL ON "*" TO ''root''@''%'';

    exit;

    ```


    and restart the service:


    ```

    $ sudo service mysql restart

    ```


    # Chapter Five: INSTALLING CENTOS 7


    This is a community-supported distribution derived from sources freely provided
    to the public by Red Hat for Red Hat Enterprise Linux (RHEL). As such, CentOS
    Linux aims to be functionally and compatible with RHEL. The CentOS Project mainly
    changes packages to remove upstream vendor branding and artwork. CentOS Linux
    is free and free to redistribute. Each CentOS version is maintained for up to
    10 years (by means of security updates — the duration of the support interval
    by Red Hat has varied over time with respect to Sources released). A new CentOS
    version is released approximately every 2 years and each CentOS version is periodically
    updated (roughly every 6 months) to support newer hardware. This results in a
    secure, low-maintenance, reliable, predictable and reproducible Linux environment.


    # Installation of CentOS7


    Finally, the much-awaited CentOS 7 is out. CentOS (Community Enterprise Operating
    System) are forked from Red Hat Linux, a Linux Distro fine tuned for servers.
    You will learn how to install CentOS 7 in a few easy steps.


    # Step 1: Download the ISO Image


    To get a copy of CentOS 7 download from the link below:


    http://mirror.centos.org/centos/7/


    CentOS 7 is only available for 64-bit platforms; currently there is no 32-bit
    ISO image. This is primarily due to the fact that most production servers are
    64-bit.


    # Step 2: Make a bootable Drive


    After you download the ISO image, make a bootable drive using Unetboot. Alternatively,
    you can burn a DVD using Brasero or your favorite CD/DVD burning software.


    # Step 3: Begin Installation


    To begin installation, click on the Install to Hard Drive icon on the desktop.


    # Step 4: Select Language and Keyboard


    Select your preferred language.


    ![](img/96087f64a3e93963bcd01deb5e4f57e3_38_0.png)


    # Step 5: Change the Installation Destination


    By default, the Anaconda installer will choose automatic partitioning for your
    hard disk. Click on the INSTALLATION DESTINATION icon to change to custom partitioning.


    ![](img/96087f64a3e93963bcd01deb5e4f57e3_38_1.png)


    Select the hard drive where you want to install CentOS 7 and under Other Storage
    Options, choose ''I will configure partitioning'' then click Done.


    # Step 6: Select the Partitioning Scheme


    Next, select the partitioning scheme to use for the mountpoints. In this case,
    choose Standard Partition.


    ![](img/96087f64a3e93963bcd01deb5e4f57e3_39_0.png)


    # Step 7: Create a Swap Space


    You can create a swap space in one of the partitions and set the desired capacity,
    which is dependent on how much RAM, the system has. Choose the File system for
    swap space as swap, and select the Reformat option. You can also name your swap
    space to whatever name you like but a name like swap is more descriptive.


    # Step 8: Create a Mountpoint


    The next step is to create the mountpoint where the root partition will be installed.
    Depending on your requirements, you might need to put the boot, home and root
    partitions on different mountpoints. In this instance, we shall only create one
    mountpoint /.


    Next, use the Label and Desired Capacity to whatever you wish. A rule of thumb
    is to use descriptive names for the label especially if the computer is to be
    managed by different system administrators. Choose the file system as ext4 and
    select the Reformat option.


    ![](img/96087f64a3e93963bcd01deb5e4f57e3_40_0.png)


    # Step 9: Accept Changes


    After Steps 7 and 8 have successfully completed click on Done button. A prompt
    will appear with a summary of the changes that will take place. If you are satisfied
    with them click Accept Changes.


    # Step 10: Set Date and Time


    Click on the Clock icon under the localization menu and select your time zone
    from the map of the world, then click Done.


    ![](img/96087f64a3e93963bcd01deb5e4f57e3_41_0.png)


    # Step 11: Begin Installation


    Click on the Begin Installation button.


    ![](img/96087f64a3e93963bcd01deb5e4f57e3_41_1.png)


    Installation will begin immediately and as it proceeds you will need to set up
    a user account as well as the root password.


    # Step 12: Set Up Root Password


    Click on the ROOT PASSWORD option and enter a password and confirmation of the
    same then click Done.


    ![](img/96087f64a3e93963bcd01deb5e4f57e3_42_1.png)


    # Step 13: Create a User Account


    The next step is to create a user account. Enter the details and if this is an
    administrator account, check Make this user administrator and Require a password
    to use this account for security purposes.

