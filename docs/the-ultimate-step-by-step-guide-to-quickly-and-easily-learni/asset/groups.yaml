    # Ignoring Signals


    If the command for trap is null, the specified signal will be ignored received.
    For example, the command –

    $ trap "2"


    Specifies that the interrupt signal is ignored. You might want to ignore certain
    signals when performing some operations that you do not want interrupted. You
    can specify multiple signals to be ignored as follows -

    $ trap "1 2 3 15"


    Note that the first argument must be specified for a signal to be ignored and
    is not equivalent to writing the following, which has a separate meaning of its
    own -

    $ trap 2


    If you ignore a signal, all subshells also ignore that signal. However, if you
    specify an action to be taken on receipt of a signal, all subshells will still
    take the default action on receipt of that signal.


    # Resetting Traps


    After you have changed the default action to be taken on receipt of a signal,
    you can change it back again with trap if you simply omit the first argument;
    so.

    $ trap 1 2


    Resets the action to be taken on receipt of signals 1 or 2 back to the default.


