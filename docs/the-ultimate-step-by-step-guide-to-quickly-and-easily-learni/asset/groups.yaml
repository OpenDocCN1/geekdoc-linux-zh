    # Chapter One: LINUX HISTORY


    The history of Linux began in 1991 with a personal project by Finnish student
    Linus Torvalds to create a new free operating system. Since then, the resulting
    Linux kernel has been marked by constant growth throughout its history. Since
    the initial release of its source code in 1991, it has grown from a small number
    of files to 2015 with over 8 million lines of source code under the General Public
    License (GPL). He wrote the program specifically for the hardware he was using
    and independent of operating system because he wanted to use the Intel 8386 processor.
    Development was done on MINIX. The GNU compiler is still the main choice for compiling
    Linux today. The code can be built with other compilers, such as. As Torvalds
    wrote in his book ‘Just for Fun,’ he eventually ended up writing operating system
    kernel. On 25 August 1991, he announced this new system in a Usenet posting to
    the newsgroup comp.linux.


    Torvalds first published the Linux kernel under its own license, which had a restriction
    on commercial activity. The software used with the kernel was developed as part
    of the GNU project licensed under the GPL, a free software license. The first
    release of the Linux kernel, 0.01, included a binary of GNU''s Bash shell. In
    the “Notes for Linux release 0.01”, Torvalds lists the software that is required
    to run Linux: Sadly, a kernel by itself gets nowhere. To get a working system,
    you need a shell, compilers, a library. These are separate parts and may be stricter
    (or even looser) copyright. Most of the tools used with Linux are GNU software
    and are under the GNU copyright. These tools are not in the distribution - ask
    for more info. In 1992, he suggested releasing the kernel under the GNU GPL. He
    first announced this decision in the release notes of version 0.12. In the middle
    of December 1992, he published version 0.99 using GNU components with Linux to
    make a fully functional free operating system. Torvalds has stated, “Making GPL
    was definitely the best thing I ever did.”


    Torvalds initially used the designation “Linux” only for the Linux kernel. The
    kernel, however, frequently used together with other software, especially of the
    GNU project. This quickly became the most popular adoption of GNU software. In
    June 1994 in GNU’s Bulletin, Linux was referred to as a “free UNIX clone,” and
    the Debian project began calling its product Debian/Linux. In May 1996, Richard
    Stallman published the editor Emacs 19.31, in which the type of system was renamed
    from Linux to Linux. This spelling was intended to refer specifically to the combination
    of GNU and Linux, but this was so abandoned in favor of “GNU/Linux.” This name
    garnered varying reactions. The GNU and Debian projects use the name, although
    most people simply use the term “Linux” to refer to the combination.


    The largest part of the work on Linux is performed by the community: the thousands
    of programmers around the world that use Linux to send their suggested improvements
    to the maintainers. Various companies have also helped not only with the development
    of the kernels but also with writing the body of auxiliary software, which is
    distributed with Linux. As of February 2015, over 80% of Linux kernel developers
    are paid. It is released both by organized projects such as Debian and projects
    connected directly with companies such as Fedora and openSUSE. The members of
    these respective projects meet at various conferences and fairs, in order to exchange
    ideas. One of the largest of these is the LinuxTag in Germany (currently in Berlin),
    where about 10,000 people assemble annually, in order to discuss Linux and the
    projects associated with. The Open Source Development Lab (OSDL) was created in
    the year 2000, and is an independent nonprofit organization, which pursues the
    goal of optimizing Linux for employment in data centers and in the carrier range.
    It served as sponsored working premises for Lin Torvalds and also for Andrew Morton
    (until the middle of 2006 when Morton transferred to Google). Torvalds worked
    full-time on behalf of OSDL, developing the Linux kernels.


    # Chronology


    - **1991**: The Linux kernel is publicly announced on 25 August by 21-year-old
    Finnish student Lin Benedict Torvalds.

    - **1992**: The Linux kernel is re-licensed under the GNU GPL. The first Linux
    distributions are created.

    - **1993**: Over 100 developers work on the Linux kernel. With their assistance,
