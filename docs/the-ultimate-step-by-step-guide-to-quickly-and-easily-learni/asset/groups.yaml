    ## Moving and Renaming Files and Directories with “mv”


    We can move a file to a new location using the mv command. For instance, we can
    move file into the test directory by typing:


    ```

    mv file test

    ```


    For this command, we list all items that we want to move, with the location to
    move them to. We can move that file back to our home directory by using the special
    dot reference to refer to our current directory. We should make sure we are in
    our home directory, and then execute the command:


    ```

    cd

    mv test/file

    ```


    This may seem unintuitive at first, but the mv command is also used to rename
    files and directories. In essence, moving and renaming are all just adjusting
    the location and name for an existing item.

    So to rename the test directory to testing, we could type:


    ```

    mv test testing

    ```


    **Note:** It is important to realize that your Linux system will not prevent you
    from certain destructive actions. If you are renaming a file and choose a name
    that already exists, the previous file will be overwritten by the file you are
    moving. There is no way to recover the previous file if you accidentally overwrite
    it.


    ## Copying Files and Directories with “cp”


    With the mv command, we could move or rename a file or directory, but we could
    not duplicate it. The cp command can make a new copy of an existing item.


    For instance, we can copy file3 to a new file called file4:


    ```

    cp file3 file4

    ```


    Unlike the mv operation, after which file3 would no longer exist, we now have
    both file3 and file4.


    **Note:** As the mv command, it is possible to overwrite a file if you are not
    careful about the filename you are using as the target of the operation. Instance,
    if file4 already existed in the example above, its contents would be completely
    replaced by the contents of file3.


    In order to copy directories, you must include the -r option in the command. This
    stands for “recursive,” as it copies the directory, plus all of the directory’s
    contents.


    This option is necessary with directories, regardless of whether the directory
    is empty. For instance, to copy the some directory structure to a new structure
    called again, we could type:


    ```

    cp -r some again

    ```


    Unlike files, with which an existing destination would lead to an overwrite, if
    the target is an existing directory, the file or directory is copied into the
    target:


    ```

    cp fileil again

    ```


    This will create a new copy of fileil and place it inside of the again directory.


    ## Removing Files and Directories with “rm” and “rmdir”


    To delete a file, you can use the rm command.


    Note: Be extremely careful when using any destructive command like rm. There is
    no “undo” command for these actions so it is possible to accidentally destroy
    important files permanently.


    To remove a regular file, just pass it to the rm command:


    ```

    cd

    rm file4

    ```


    Likewise, to remove empty directories, we can use the rmdir command. This will
    only succeed if there is nothing in the directory in question. For instance, to
    remove the example directory within the testing directory, we can type:


    ```

    rmdir testing/example

    ```


    If you wish to remove a non-empty directory, you will have to use the rm command
    again. This time, you will have to pass the -r option, which removes all of the
    directory’s contents recursively, plus the directory itself.


    For instance, to remove the again directory and everything within it, we can type:


    ```

    rm -r again

    ```


    Once again, it is worth reiterating that these are permanent actions. Be entirely
    sure that the command you typed is the one that you wish to execute.


