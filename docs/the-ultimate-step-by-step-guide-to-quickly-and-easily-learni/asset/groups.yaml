    # Chapter Eleven: SHELL BASIC OPERATOR


    Each shell supports various operators. This chapter is based on default shell
    (Bourne) so we are going to cover all the important Bourne Shell operators in
    this tutorial.


    We will discuss the following operators –


    +   - Arithmetic Operators.

    - Relational Operators.

    - Boolean Operators.

    - String Operators.

    - File Test Operators.


    The Bourne shell did not originally have any mechanism to perform simple arithmetic
    but it uses external programs, either awk or the must simpler program expr.


    Here is simple example to add two numbers –


    ```

    ```sh

    #!/bin/sh

    val=`expr 2 + 2''

    echo "Total value : $val"

    ```

    ```


    This produces the following result –


    ```

    Total value : 4

    ```


    Note:


    +   - There must be spaces between operators and expressions for example 2+2 is
    not correct, it should be written as 2 + 2.

    - Complete expressions should be enclosed between “,, inverted commas.


    # Arithmetic Operators


    The following are arithmetic operators supported by the Bourne Shell.


    Assume variable ‘a’ holds 10 and variable ‘b’ holds 20 then –


    Example, using all the arithmetic operators –'
