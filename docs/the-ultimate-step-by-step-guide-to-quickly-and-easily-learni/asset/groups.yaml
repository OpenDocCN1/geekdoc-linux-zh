    # FILE NAME GLOBB WITH *, ?, []


    Sometimes you want to manipulate a group of files, e.g., delete all of them,

    without performing the command on each file separately. For example,

    suppose we want to delete all of the .c files in a directory. A wildcard is a
    pattern,

    which matches something else. Two commonly used *n wildcards are * (star)

    and ? (question mark).


    +   * Star (*) means zero or more characters

    * Question Mark (?) means exactly one

    * Brackets ([]) represent a set of characters


    Commands involving filenames specified with wildcards are expanded by the shell

    (this is called globbing) after the name of a former program called glob which

    used to do outside the shell.


    # Examples'
