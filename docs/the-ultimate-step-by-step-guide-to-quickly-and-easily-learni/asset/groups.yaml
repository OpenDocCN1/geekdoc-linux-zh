  - "[PAGE 90]\n\nWhen a Unix command exits exits with what is known as an exit status,\
    \ this indicates to anyone who wants to know the degree of success a command,\
    \ usually when a command executes without error terminates with an exit status\
    \ of zero. An exit status of some other value would indicates that an error has\
    \ occurred, the details of which are specific to the command. man pages detail\
    \ the exit status messages.\n\nA list is defined in the SH “a sequence of zero\
    \ or more commands separated by newlines, semicolons, and ampersands, and optionally\
    \ terminated by one of these three characters.” Hence in the generic definition\
    \ of if above the list will determine which of the execution paths the script\
    \ takes. For example, there is a command called test on UNIX, which evaluates\
    \ an expression and if it evaluates true will return zero and return one otherwise,\
    \ this is how we can test conditions in the list part(s) of if because test is\
    \ a command.\n\nWe do not actually have to type the test command directly into\
    \ the list to use it; it can be implied by encasing the test case within () and\
    \ (]) characters, as illustrated by the following (silly) example:\n\n```\n#!/bin/sh\n\
    if [ \"$1\" = \"1\" ]\nthen\n    echo \"The first choice is nice\"\nelif [ \"\
    $1\" = \"2\" ]\nthen\n    echo \"The second choice is just as nice\"\nelif [ \"\
    $1\" = \"3\" ]\nthen\n    echo \"The third choice is excellent\"\nelse\n    echo\
    \ \"I see you were wise enough not to choose\"\n    echo \"You win\"\nfi\n```\n\
    \nWhat this example does is compare the first parameter (command line argument\
    \ in this case) with the strings “1”, “2” and “3” using tests (=) for equality,\
    \ if any of them match it prints out the corresponding message. If none of them\
    \ match it prints out the final case. OK the example is silly and actually flawed\
    \ (the user wins even if they type in (4) or something) but it illustrates how\
    \ the if statement works.\n\nNotice that there are spaces between (if) and (),\
    \ ([ and the test and the test and"
