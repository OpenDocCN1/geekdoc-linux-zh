    # -M path, —manpath=path


    Specify an alternate manpath to use. This option overrides the $MANPATH environment
    variable and causes option -m to be ignored.


    A path specified as a manpath must be the root of a man page hierarchy structured
    into sections as described in the man-db manual under (“The manual page system”).
    To view manual pages outside such hierarchies, the -I option.


    # -S list, -s list,—sections=list


    list is a colon- or comma-separated list of `order specific` sections to search.
    This option overrides the $MANSECT environment variable. (The -s spelling is for
    compatibility with System V.)


    # -e sub-extension,—extension=sub-extension


    Some incorporate large packages of manual pages, such as those that accompany
    the Tcl package, into the main manual page hierarchy. To get around the problem
    of having two manual pages with the same name such as exit, the Tcl pages were
    usually assigned to section I (lowercase L). However, it is now possible to put
    the pages in the correct section, and to assign a specific “extension” to them,
    in this case, exit (tcl). Under normal operation, man will in preference to exit
    (tcl). To negotiate this situation and avoid having to know which page you require
    resides in, it is now possible to give man a sub-extension string indicating which
    package the page must belong to. Using the above example, supplying the option
    -tcl to man will restrict the search to pages having an *tcl.


    # -i, —ignore-case


    Ignore case when searching for manual pages. This is the default.'
- md: '

    # Search for manual pages case-sensitively.


    | -regex | Show all pages with any part of either their names or descriptions
    matching each argument as a regular expression, as with apropos. Since there is
    usually no reasonable way to pick a "best" page when searching for a regular expression,
    this implies -a. |

    | -wildcard | Show all pages with any part of their names or descriptions matching
    each argument using shell-style wildcards, as with apropos --wildcard. The page
    argument must match the entire name or description, or match on word boundaries
    in the description. Since there is usually no reasonable way to pick a "best"
    page when searching for a wildcard, this implies -a. |

    | -names-only | If the -regex or -wildcard option is used, match only page names,
    not page descriptions, as with whatis. Otherwise, this has no effect. |

    | -a, -all | By default, man will exit displaying the most suitable manual page
    it finds. Using this option forces man to display all the manual pages with names
    that match the search criteria. |

    | -u, -update | This option causes man to perform an inline-level consistency
    check on its database caches to ensure that they are an accurate representation
    of the filesystem. It will only have a useful effect if man is installed with
    the setuidbit set. |

    | -no-subpages | By default, man will try to interpret pairs of manual page names
    given on the command line as equivalent to a single manual page name containing
    a hyphen or an underscore. This supports the common pattern of programs that implement
    a number of subcommands, allowing them to provide manual pages for each that can
    be accessed using similar syntax as would be used to invoke the subcommands themselves.
    For example, the command:


    ```

    man -aw git diff

    displays the manual page:

    ```


    ```

    /usr/share/man/man1/git-diff.1.gz

    ```

    To disable this behavior, use the --no-subpages option.


    For example:


    ```

    man -aw --no-subpages git diff

    Will instead show the manual pages for both git and diff:

    ```


    ```

    /usr/share/man/man1/git.1.gz

    /usr/share/man/man3/Git.3pm.gz

    /usr/share/man/man1/diff.1.gz

    ```


    # Controlling Formatted Output


    - -P pager, --pager=pager Specify output pager to use. By default, man uses pager
    -s. This option overrides the SMAN environment variable, which in turn overrides
    the $PAGER environment variable. It is used in conjunction with -f or -k.


    The value may be a simple command name or a command with arguments, and may use
    shell quoting (backslashes, single quotes, or double quotes). It may not use pipes
    to connect multiple commands; if you need that, use a wrapper script, which may
    take the file to display either as an argument or standard input.


    - -r prompt, --prompt=prompt A recent version of less is used as the pager, man
    will attempt to set its prompt and some sensible options. The default prompt looks
    like:


    ```

    Manual page name(sec) line x

    ```

    where name denotes the manual page, sec denotes the section it was found under
    and x the current line number. This is achieved by using the $LESS environment
    variable.


    Supplying -r with a string will override this default. The string may contain
    the $SMAN_PN which will be expanded to the name of the current manual page and
    its section surrounded by "c" and ")." The string used to produce the default
    could be expressed as:


    ```

    \ Manual\ page\ $SMAN_PN\ ?\ltline\ %lt?L:\.

    byte\ ??B%%s/.\ (END):?p\nnp\..\n(press h for help or q to quit)

    ```

    It is broken into three lines here for the sake of readability. For its meaning
    see the man page for less.


    The shell first evaluates the prompt string. All double quotes, back-quotes and
    backslashes in the prompt must be escaped by a preceding back\. The prompt string
    may end in an escaped S which may be followed by further options for less. By
    default, man sets the -ix8 options.


    If you want to override man''s prompt string processing completely, use the SMAN
    environment variable described below.


    - -7, --ascii


    When viewing a pure ASCII manual page on a 7-bit terminal or emulator, some characters
    may not display correctly when using the latin1 device description nroff with
    GNU nroff. This option allows pure ASCII pages to be displayed in ASCII with the
    latin1 device. It will not translate any latin1 text. The following table shows
    the translations performed: some parts of it may only be displayed properly when
    using GNU''s latin1 device. This option is ignored when using options -t, -H,
    -T, or -Z and may be useless for versions of nroff other than GNU''s.


    # -E encoding, --encoding=encoding


    Generate output for a character encoding other the default. For backward compatibility,
    encoding may be an nroff device such as ascii, latin1, or utf8 as well as a true
    character encoding such as UTF-8.


    # -no-hyphenation, --nh


    Normally, nroff will automatically hyphenate text at line breaks in words that
    do not contain hyphens, if it is necessary to lay out words on a line without
    excessive spacing. This option disables automatic hyphenation, so words will only
    be hyphenated if they already contain hyphens. If you are writing a man page and
    want to prevent nroff from hyphenating a word at an inappropriate point, do not
    use this option, but consult nroff documentation instead; for instance, you can
    put "%%" inside a word to indicate that it may be hyphenated at that point, or
    put "%%" at the start of a word to prevent it from being hyphenated.


    # -no-justification, --nj


    Normally, nroff will automatically justify to both margins. This option disables
    full justification, leaving justified only to the left margin, sometimes called
    "ragged-right".


    If you are writing a man page and simply want to prevent nroff from justifying
    certain paragraphs, do not use this option, but consult nroff documentation; for
    instance, you can use "na", "nf", "fi", and "ad" requests to temporarily adjust
    and filling.


    # -p string, --preprocessor=string


    Specify the sequence of preprocessors to run before nroff or troff. Not all installations
    have a full set of preprocessors. Some of the preprocessors and the letters used
    to designate them are: eqn (e), grap (g), pic (p), tbl (t), vgrind (v), refer
    (r). This option overrides the $MANROSEQ environment variable. zsoelim is always
    run as the first preprocessor.


    - -t, --troff Use groff -mandoc to format the man page to standard output. This
    option is not required in conjunction with -H, -T, or -Z.


    - -T[device], --troff-device=[device] This option is used to change groff (or
    possibly troff''s) output to be suitable for a device other than the default.
    It implies -t. Examples include divi, latin1, pt, utf8, X75 and X100.


    - -H[browser], --html=[browser] This option will cause groff to produce HTML output,
    and will display the output in a web browser. The choice of browser is determined
    by the browser argument if one is provided, by the SBROWSER environment variable,
    or by a compile-time default that is unset (lynx). This option implies -t, and
    will only work with GNU troff.


    - -X[dpi], --gdxview=[dpi] This option displays the output of groff in a graphical
    window using gtxdevice. The dpi (dots per inch) may be 75, 75-12, 100, or 100-12,
    respectively; the -12 variants use a 12-point font base. This option implies -t.


    - -Z, --ditroff will run groff and then use appropriate post-processor to produce
    output suitable for the chosen device. If groff, this option suppresses the use
    of a post-processor. It implies -t.


    # Section Numbers


    The section numbers of the manual are listed below. While reading documentation,
    if you see a command name followed by a number in parentheses, the number refers
    to one of these sections. Some commands may have documentation in more than one
    section, so the numbers after the command name may direct you to the correct section
    to find a specific type of information.


    The section numbers, and the topics they cover, are as follows:


    | section # | Topic |

    | 1 | Executable programs or shell commands |

    | 2 | System calls (functions provided by the kernel) |

    | 3 | Library calls (functions within program libraries) |

    | 4 | Special files (usually found in /dev) |

    | 5 | File formats and conventions eg /etc/passwd |

    | 6 | Games |

    | 7 | Miscellaneous (including macro packages and conventions), e.g. man, groff
    |

    | 8 | System administration commands (usually for root) |

    | 9 | Kernel routines [Non standard] |


    # Exit Status


    When it terminates, **man** will return one of the following exit status:


    | 0 | Returned upon successful program execution. |

    | 1 | Returned if there was a usage, syntax, or configuration file error. |

    | 2 | Returned if there was an operational error. |

    | 3 | Returned if a child process returned a non-zero exit status. |

    | 16 | Returned if one or more of the pages, files, or keywords searched for did
    not exist or was not matched. |

