- pgno: 86
  md: '# To add curves and corners to the straight segments:


    +   1. With the Bezier Selection Tool still active, position the mouse crosshair
    over a control point, press the left mouse button and drag. Two handles will appear
    and the straight line will become curved (Figure 24).


    +   2. Release the left mouse button when the curved segment is close to the shape
    you want. The control point will remain selected with the handles visible. You
    can now manipulate the handles individually to create smooth curves or sharp corners.


    +   3. To create a smooth curve:


    +   A. Position the mouse crosshair over a handle (Figure 25).


    +   B. Press the left mouse button and drag the handle to a new position (Figure
    26). Notice that you can drag a handle far away from or place it directly on top
    of its control point.


    +   C. Release the left mouse button when you are happy with the shape of the
    curve (Figure 27).


    (continued)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_86_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_86_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_86_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_86_3.png)'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Chapter 6


    4. To create a sharp corner at a control point:


    A. Position the mouse crosshair over a handle (Figure 28).


    B. Press and hold down the Shift key.


    C. Press the left mouse button and drag the handle to a new position (Figure 29).
    Notice that instead of curving, a sharp bend appears in the selection segment
    at the control point.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_87_0.png)


    D. Release the left mouse button when you are happy with the shape of the bend
    (Figure 30). Once you are satisfied with the shape of the selection segments,
    the final step is to activate the bezier selection.


    Figure 29. Press the left mouse button and drag the handle to a new position.
    As you drag, a bend forms at the curve.


    # To activate the bezier selection:


    Click inside the bezier selection area to activate the selection. The control
    points will disappear and the selection segments will change to a dashed, moving
    boundary (Figure 31).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_87_1.png)


    Figure 30. Release the mouse button and Shift key when you are happy with the
    curve.


    +   * Tips


    +   - Bezier selections are complicated and time consuming to create. Once you''ve
    created one, you''ll probably want to use it again in the future, so save it.
    Turn to page 86 for directions how to do this.


    +   - The Bezier Selection Tool supports both antialiasing and feathering. To
    learn more about these options and turn them on, turn to page 62.


    +   - You can add to, subtract from, or intersect a selection. For details how
    to do this turn to pages 77–79.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_87_2.png)


    Figure 31. Click inside the bezier selection boundary to activate the selection.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# The Intelligent Scissors Tool


    Figure 32. The mouse crosshair where you would like to start the selection. In
    this figure, the panther''s mouth will be selected.


    The Intelligent Scissors Tool works like the Free-hand Selection Tool in clicking
    and dragging creates a selection boundary. However, this tool does have a mind
    of its own. When you make a selection, this tool to guess which edge you are trying
    to select using the colors you select. The Intelligent Scissors Tool supports
    several options. Along with antialiasing and feathering, you can set curve resolution,
    edge detect threshold, and elasticity. In addition, if the Intelligent Scissors
    Tool does not create the exact you you select, you can convert the Intelligent
    Scissors selection to a Bezier Curve Selection and edit the curves as described
    on pages 70–72.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_88_0.png)


    Figure 33. As you drag the mouse, a rough selection appears around the area.


    # To create an Intelligent Scissors selection:


    +   1. Use the Layers & Channels dialog box to which layer is active. (This is
    the layer whose pixels will be selected).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_88_1.png)


    +   2. Click the Intelligent Scissors Tool in the Toolbox or press I on the keyboard.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_88_2.png)


    +   3. Position the mouse crosshair where you would like to start the selection
    (Figure 32).


    +   4. Press the left mouse button and drag As you drag, a selection boundary
    will appear (Figure 33).


    Figure 34. When you release the button, the Intelligent Scissors Tool shapes the
    selection boundary, smoothing it out.


    +   5. When you have encompassed the area you want to select, release the left
    mouse button. The Intelligent Scissors Tool will make its best guess and shape
    the selection boundary accordingly (Figure 34). If the selection is not exactly
    the way you want it, you should convert the boundary to a bezier selection and
    reshape it. If you like the shape of the selection, skip to step 8 (continued)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_88_3.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Chapter 6


    6. To convert the Intelligent Scissors boundary to a Bezier Selection Tool boundary:


    +   A. Double-click the Intelligent Scissors Tool in the Toolbox. The Tool Options
    dialog box will open, showing Intelligent Scissors options (Figure 35).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_89_0.png)


    +   B. Click the Convert to Bezier curve button. Control points will appear around
    the selection boundary (Figure 36) and the Tool Options dialog box will change
    to display Bezier Selection options (Figure 37).


    +   7. Manipulate the bezier control points and handles as you would any bezier
    selection. (See pages 70–72 for details about how to do this.)


    +   8. When you are happy with the selection boundary shape, click inside the
    selection boundary to activate the selection. The selection boundary will change
    to a dashed, moving boundary (Figure 38).


    # Tips


    +   - This tool works best on an image with high contrast areas.

    - This tool supports antialiasing and feather. To learn more about these options
    and turn them on, take a look at page 62.

    - You can add, subtract from, or intersect a selection. For details on how to
    do this turn to pages 77–79.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_89_1.png)


    Figure 35. Use the Tool Options dialog to change the Intelligent Scissors selection
    to a bezier curve selection.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_89_2.png)


    Figure 36. Control points appear around the selection boundary. To access the
    handles and change the shape of the curve, click a control point.


    74'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Intelligent Scissors Tool Options


    Along with feathering and antialasing, the Intelligent Scissors Tool also supports
    three other options. They are:


    +   - Curve Resolution—this option controls how smooth a selection is. The higher
    the setting, the smoother the curve.


    +   - Edge Detect Threshold—sets how sensitive the Intelligent Scissors Tool is
    to edges in an image. The higher the setting, the more sensitive the tool becomes.


    +   - Elasticity—this option sets the tool''s ability to move away from the boundary
    you have outlined when it tries to find an edge in image. If elasticity is set
    low, the Intelligent Scissors Tool will keep the selection boundary it sets closer
    to the one you drew with the tool. If the elasticity is set high, the tool will
    move the selection boundary further away from the one you drew. In fact, if elasticity
    is set very high, the tool may even snap the selection boundary to a color area
    that did not intend to select.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_90_0.png)


    Figure 37. When the bezier control points appear around the selection boundary,
    the Tool Options dialog box changes to display Bezier Selection Options.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_90_1.png)


    Figure 38. Click inside the selection boundary to activate the selection.


    # To set Intelligent Scissors Tool options:


    +   - In the GIMP Toolbox, double-click on the Intelligent Scissors Tool. The
    Tool Options dialog box will open, displaying the options available for that tool
    (Figure 35).


    +   - Use the slider bars to the right of Curve Resolution, Edge Detect Threshold,
    and Elasticity to set those options (Figure 39).


    +   - Click Close. The Tool Options dialog box will close.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_90_2.png)


    Figure 39. Use the slider bars to set the sensitivity of the Intelligent Scissors
    Tool.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Creating Multiple Selections


    Suppose you want to add a filter effect to several areas of an image. Instead
    of selecting one area, applying the filter, selecting another area and applying
    the filter again, you can select several areas at once and apply the filter once.


    # To create multiple selections:


    +   1. Create the first selection using the selection tool of your choice (Figure
    40).

    2. Press and hold the Shift key on the keyboard.

    3. Make a second selection (Figure 41).

    4. Repeat steps 2–3 to create additional selections.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_91_0.png)


    Figure 40. Create the first selection using the selection tool of your choice.
    In this figure, the Bezier Selection Tool used to select the tip of the crayon.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_91_1.png)


    Figure 41. Hold down the Shift key and make a second selection. Be sure to release
    the mouse button before releasing the Shift key. Otherwise, the first selection
    will disappear.


    # Tips


    +   - So long as the extra selections do not touch or overlap, the selections
    will remain separate.

    - If you release the Shift key before you release the mouse button, the first
    selection will disappear, leaving only the second selection.

    - You can change selection tools while making selections in order to select different
    shaped areas (Figure 42).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_91_2.png)


    Figure 42. Use the different selection tools to select the areas that you need.
    In this figure both the Rectangular Select and the Bezier Selection Tools were
    used.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Adding to a Selection


    If you want to extend the area of a selection you have made, you can do so using
    any of the selection tools.


    To add to a selection:


    +   1. Create the first selection using the selection tool of your choice (Figure
    43).


    +   2. Press and hold down the Shift key on the keyboard.


    +   3. Using the selection tool of your choice, create a second selection that
    overlaps the first selection (Figure 44).


    +   4. Release the mouse button and then the Shift key. The two selections will
    merge to become a single selection (Figure 45).


    # Tips


    +   ■ You can change selection tools while making selections in order to select
    different shaped areas.


    +   ■ If you release the Shift key before you release the mouse button, the first
    selection will disappear, leaving only the second selection.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_92_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_92_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_92_2.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Chapter 6


    # Subtracting from a Selection


    If you want to remove part of a selection after you have made it, all you need
    to do is subtract that area from the selection using any one of the selection
    tools.


    To subtract from a selection:


    +   1. Create the first selection using the selection tool of your choice (Figure
    46).


    +   2. Press and hold down the Ctrl key on the keyboard.


    +   3. Using the selection tool of your choice, create a second selection that
    overlaps the first selection, covering the selection area that you want to remove
    (Figure 47).


    +   4. Release the mouse button and then the Ctrl key. The area where the second
    selection overlapped the first will be subtracted from the first selection (Figure
    48).


    +   Tips


    +   You can change selection tools while making selections in order to subtract
    different shaped areas.


    +   If you release the Ctrl key before release the mouse button, the first selection
    will disappear, leaving only the second selection.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_93_0.png)


    Figure 46. Create the first selection using the tool of your choice.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_93_1.png)


    Figure 47. Hold down the Ctrl key while making the second selection.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_93_2.png)


    Figure 48. When you release the mouse button and then the Ctrl key, the area covered
    by the second selection disappears from the first selection.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Intersecting Two or More Selections


    You can also create a selection from the overlapping areas of two selections.
    This is called an intersection.


    To intersect two selections:


    +   1. Create the first selection using the selection tool of your choice (**Figure
    49**).

    2. Press and hold down the Shift and Ctrl keys on the keyboard.

    3. Using the selection tool of your choice, make a second selection that overlaps
    the first selection area that you want to create (**Figure 50**).

    4. Release the mouse button, and then the Shift and Ctrl keys. The area where
    the two selections overlapped will remain as the active selection (**Figure 51**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_94_0.png)


    **Figure 49.** Create the first selection using the selection tool of your choice.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_94_1.png)


    **Figure 50.** Hold down the Shift and Ctrl keys while making the second selection.


    # ✓ Tips


    +   - You can change selection tools while making the intersection in order to
    select shaped areas.

    - If you release the Shift and Ctrl keys before you release the mouse button,
    the first selection will disappear, leaving only the second selection.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_94_2.png)


    **Figure 51.** When you release the mouse button and then the Ctrl and Shift keys,
    only the intersection of the overlapping selection areas remains.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Chapter 6


    # Growing or Shrinking a Selection


    As you know, each selection tool comes with special options. But sometimes you''ll
    need to fine tune a selection to make it work better with the effect you have
    in mind. One way to tune a selection is to expand or shrink an entire selection
    boundary by a set of pixels.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_95_0.png)


    # To grow a selection:


    +   1. Create the selection (Figure 52).

    2. Right-click on the image and choose Select→Grow from the pop-menu (Figure 53).
    The Grow Selection dialog box will open (Figure 54).

    3. Enter the number of pixels by which you want the selection to expand in the
    Grow selection by text box.

    4. Click OK. The Grow Selection dialog box will close and the selection will expand
    by the number of pixels you entered (Figure 55).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_95_1.png)


    # To shrink a selection:


    +   1. Create the selection (Figure 52).

    2. Right-click on the image and choose Select→Shrink from the pop-menu (Figure
    56). The Shrink Selection dialog box will appear (Figure 57).

    3. Enter the number of pixels by which you want the selection to shrink in by
    text box.

    4. Click OK. The Shrink Selection dialog box will close and the selection will
    shrink by the number of pixels you entered (Figure 58).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_95_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_95_3.png)


    80'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Sharpening a Selection


    The Sharpen command removes pixels from the edge of an antialiased or feathered
    selection, making the edge less fuzzy and more distinct.


    | File | | |

    |---|---|---|

    | Edit | | Toggle Ctl+T |

