- pgno: 159
  md: '# Automatic Color Enhancements


    These three commands—Auto-Stretch Contrast, Auto-Stretch HSV, Normalize—automatically
    enhance an image''s color using various channels. Auto-Stretch Contrast uses RGB
    channels to find the lowest and highest value of each channel and expand them
    to cover the full contrast range. Auto-stretch HSV, does the same thing as Auto-Stretch
    Contrast, but using HSV channels instead. Like Auto-Stretch Contrast, Normalize
    also finds the lowest and highest value using RGB channels. But, Normalize combines
    the channels instead of using them individually. (For a discussion about why turn
    to pages 34–35. To learn more about channels, take a look at Chapter 13, Channels
    and Layer Masks.)


    > Figure 42. Right-click on the image and choose Image→Colors→Auto-Stretch Contrast
    from the pop up menu.


    | File | Colors | Equalize |

    |---|---|---|

    | Edit | | Invert |

    | Select | | |

    | View | | |

    | Image | Channel Ops | |

    | Layers | Alpha | Posterizer |

    | Tools | | Threshold |

    | Filters | | Grayscale |

    | Script-Fu | Color Balance |

    | Dialogs | Indexed | Brightness-Contrast |

    | Resize | Hue-Saturation |

    | Scale | Curves |

    | Histogram | Desaturate |

    | Transforms | Auto-Stretch Contrast |


    # To apply Auto-stretch Contrast to a layer or selected area:


    +   1. Use the Layers & Channels dialog box to select a layer. (For details about
    how to do this, turn to page 92.)


    +   2. If you wish, use the selection tool of your choice to select an area of
    the image. (For directions on how to use the selection tools, turn to Chapter
    6, Making Selections.)


    +   3. Right-click on the image and choose Image→Colors→Auto-Stretch Contrast
    from the pop-up menu (Figure 42). The command will automatically read the RGB
    values and enhance the image (Figure 43a–b).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_159_0.png)


    Figure 43a. The original image before Auto-stretch Contrast is applied.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_159_1.png)


    +   * Tip


    +   * Generally, this command will give an image a red cast.


    Figure 43b. The image tone is adjusted when Auto-stretch Contrast is chosen. Notice
    how the lights and dark in the image are emphasized.'
