- pgno: 71
  md: '# Resizing the Image Window as You Zoom


    Many times when zooming in or out, an image window will become smaller than the
    image—blocking view of the entire image—or larger than the image—using precious
    screen real estate. With the GIMP, you can quickly resize an image window using
    the Shrink Wrap command or can set the image window to automatically resize.


    # To resize an image using Shrink Wrap:


    Right-click on the image and choose View→Shrink Wrap from the pop-up menu (**Figure
    8**) or press Ctrl+E on the keyboard.


    # To automatically resize image windows when zooming:


    +   - Double-click the Magnify Tool button in the Toolbox. The Tool Options dialog
    box will open (**Figure 9**).

    - Select the Allow Window Resizing check button.

    - Click Close. The next time you zoom in or to view an image, the image window
    will automatically resize to accommodate the new view size.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_71_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_71_1.png)


    > Tip

    > When you zoom in or out to view an image, the image itself is not affected,
    only your view of windows


    ![](img/5164bc49fb24f10213e18cc994b7b40c_71_2.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Rulers and Guides


    The horizontal and vertical rulers are located at the top and left of the image
    window (Figure 10). The two rulers meet at a small square called the ruler point.
    The rulers monitor the location of the mouse using small rulers on them. All measurements
    are made from the zero point. This is the point where both the vertical and horizontal
    rulers show a value of 0. In the GIMP all images are measured in pixels. Therefore,
    the rulers'' unit of measure is more about pixels. (To turn to page 25).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_72_0.png)


    Figure 10. Guides are dashed blue lines that can be positioned anywhere in the
    image window.


    Guides (also known as guidelines) are an extension of rulers that can be positioned
    anywhere in the image window (Figure 11). They are very useful for setting up
    areas where you are going to draw or paint or for helping position and shape selections.
    A guide consists of a dashed line. When the mouse pointer is positioned close
    to a guide, the guide turns red and the mouse pointer changes.


    Figure 12. Right-click on the image window and choose View Toggle Rulers from
    the pop-up menu.

    | File | | |

    |---|---|---|n| Edit | | |

    | Select | | |

    | View | Zoom In | |

    | Image | Zoom Out | |

    | Layers | Zoom | |

    | Tools | Window Info... | Shft+Ctrl+I |

    | Filters | 2 Toggle Rulers | Shft+Ctrl+R |

    | Script-Fu | 2 Toggle Guides | Shft+Ctrl+T |

    | Dialogs | New View |

    | | Shrink Wrap | Ctl+E


    # How to view/hide rulers:


    Right-click on an image and View→Toggle Rulers from the pop-up menu (Figure 12)
    or press Shift+Ctrl+R on the keyboard.


    # To add guides to an image window:


    +   1. Position the mouse over one of the rulers. Use the horizontal ruler to
    create horizontal guides and the vertical ruler to create vertical guides.

    2. Press the left mouse button and drag. A guide will appear under the mouse pointer
    (Figure 13).

    3. Release the mouse button when you are happy with the guide''s position.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_72_1.png)


    Figure 13. Drag the guide to its position in the image window.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# To move a guide:


    +   1. Select the Move Tool from the Toolbox.


    +   2. Position the mouse over the guide you want to move. The mouse pointer will
    change to a tiny pointing hand.


    +   3. Press the left mouse button and drag the guide to its new position (Figure
    14).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_73_0.png)


    # To view/hide guides:


    Right-click on an image and choose→Toggle Guides from the pop-up menu (Figure
    15) or press Shift+Ctrl+T on the keyboard.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_73_1.png)


    # To remove a guide:


    +   1. Select the Move Tool from the Toolbox.


    +   2. Position the mouse over the guide you want to remove. The mouse pointer
    will change to a tiny pointing hand.


    +   3. Press the left mouse button and drag the guide back to the ruler it came
    from.


    # Snap To Guides


    An important guide feature is Snap To Guides which makes precise alignment easy
    by forcing a selection to line with a guide.


    # To turn on Snap To Guides:


    Right-click on an image and choose→Snap To Guides from the pop-up menu (Figure
    16). The next time you create a selection or paint a line, the selection or line
    will snap to the closest guide.


    Figure 16. Right-click on an image and choose View→Snap Guides from the pop-up
    menu.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Viewing an Image in Two Image Windows


    Using New View, an image can be opened in two or more image windows at the same
    time. This can be very helpful. One image window could be in a large display size
    to edit the detail while the other image window could be in a smaller view to
    see the changes made to the entire image. Changes made in one window appear in
    the other and vice versa. This is because it is the same image viewed in two windows.
    The two image windows are linked.


    | File | | |

    | --- | --- | --- |

    | Edit | | |

    | Select | | |

    | View | | |

    | Image | Zoom In | |

    | Layers | Zoom Out | |

    | Tools | Window Info... | |

    | Filters | Toggle Rulers | Shft+Ctrl+1 |

    | Script-Fu | Toggle Guides | Shft+Ctrl+R |

    | Dialogs | | Shft+Ctrl+T |

    | | New View | |

    | | Shrink Wrap | Ctrl+E |


    > Figure 17. Right-click on the image and choose View→New from the pop-up menu.


    To view the same image in two image windows:


    +   1. Open an image or get one started in a new image window.

    2. Right-click on the image and choose View→New View from the pop-up menu (Figure
    17). A new image window will appear next to the original (Figure 18).


    # Tip


    +   - If you look at the title bars of the two image windows, you will notice
    that the original file name has -1.0 appended to it and the new image window has
    -1.1 appended to it. If you opened another image window -1.2 would be appended
    to the file name.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_74_0.png)


    Figure 18. A new image window displaying the image appears next to the original
    image window. These two image windows are linked. Any changes made to the image
    in either window appear in both windows.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Duplicating an Image


    Suppose you want to try out some different effects and don''t want to change the
    original image. If you used New View to open several image windows, any changes
    made to the image in any of the image windows would change the rest, too. This
    is where Duplicate comes in handy. Duplicate image windows are separate copies
    of an original image. Changes made in a duplicate image window won''t appear in
    the original image window. The copies are completely separate images.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_75_0.png)


    # To duplicate an image:


    +   1. Open the image you want to duplicate (Figure 19).

    2. Press Ctrl+D on the keyboard. A duplicate image will appear next to the original
    (Figure 20).


    > Tip

    If you look at the title bar of the duplicate image, you''ll notice it''s an unsaved,
    untitled image.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_75_1.png)


    # Summary

    In this chapter you learned how to:


    +   - Zoom in and out

    -* Zoom to a specific magnification

    -* Zoom to a specific area

    -* Resize the image window as you zoom

    -* View rulers

    -* Add and move guides

    -* View an image in two windows

    -* Duplicate an image'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# # MAKING

    SELECTIONS


    | Elliptical Selection Tool | The GIMP | |

    |---|---|---|n| Rectangular Select Tool | | Free-hand Selection Tool |

    | Fuzzy Selection Tool | | Intelligent Scissors Tool |

    | Bezier Selection Tool | | |


    When you want to edit an area of an image, the GIMP needs to know which section
    it is that you want to change. The selections are made using one of six selection
    tools found at the top of the GIMP Toolbox (Figure 1). A selection consists of
    the portion of the image inside a selection boundary—a moving dashed line is often
    described (Figure 2). (The moving dashed line is often described as “marching
    ants”).


    Once a selection is made, only the area inside the selection boundary can be edited.
    A selection contains the pixels from the currently layer. Any area outside of
    the boundary or on other layers will not be effected by changes made to the selected
    area. (To learn more about layers, turn to Chapter 7, A Layer Primer.)


    **Figure 1.** There are six selection tools you can use to select areas of an
    image for editing.


    | Selection Selected |

    boundary area |


    Selection boundary

    Selected area


    **Figure 2.** A selected area is surrounded by a dashed, moving selection boundary.
    In this figure, the eye and leg of the frog are selected.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Selection Tool Options


    Before the selection tools, you should know that they have various options that
    can be turned on or off. Each of the six selection tools can be set to feather
    and/or antialias. (The exception is the Rectangular Select Tool which only supports
    feathering.) These two options set how a selection reacts with the surrounding,
    unselected area.


    +   - Feather—this option makes the transition from the selection to the surrounding
    area (Figure 3). If you apply a filter to a selected area and feather the edges,
    the change from the filtered area to the non-filtered area will be less abrupt.


    +   - Antialias—like feather, antialasing creates a smooth transition from the
    selected area to the unselected area. While feathering blends pixels from the
    edge of selection out into the unselected area, antialasing blends pixels only
    over the edge of the selection (Figure 4). Antialasing is especially useful when
    you are working with type and want to create smooth edges.


    It''s easy to turn these options using the Tool Options dialog box.


    To turn feathering or antialasing on:


    +   1. In the GIMP Toolbox, double-click on the selection tool whose options you
    want to change. The Tool Options dialog box will open, displaying the options
    available for that tool (Figure 5).


    or


    ![](img/5164bc49fb24f10213e18cc994b7b40c_77_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_77_1.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Making Selections


    Figure 5. In the Tool Options dialog box, select the Antialiasing and/or Feather
    check boxes. Use the Feather Radius slider to set the depth of the feathering.


    Choose File→Dialogs→Tool in the GIMP Toolbox (Figure 6), then click the selection
    tool in the Toolbox whose you want to change.


    or


    Right-click on an image and choose Dialogs→ Tool Options (Figure 7), then click
    the selection tool in the Toolbox whose you want to change.


    or


    Press Shift+Ctrl+T on the keyboard, then click the selection tool in the Toolbox
    whose you want to change.


    Figure 6. In the GIMP Toolbox, choose File→Dialogs→ Tool Options.


    +   2. To feather on:


    +   A. Select the Feather check box.


    +   B. Move the Feather Radius left or right for more feathering. A higher feather
    radius setting makes for more feathering: the pixels from the edge of the selection
    will spread out into the unselected area, blending more.


    Figure 7. Choose Dialogs→ Tool Options from the pop-up menu.


    +   3. Select the Antialiasing check button to turn that option. (This option
    is not available for the Rectangular Select Tool.)


    +   4. Click Close. The Tool Options dialog box will close.


    # Tips


    +   The feathering and antialiasing options will remain on until you deselect
    the Antialiasing and Feather check buttons.


    +   You can also add feathering to a specific selection using Select→ Feather
    on the pop-up menu. For details about using this command, to page 82.'
  merge: -1
