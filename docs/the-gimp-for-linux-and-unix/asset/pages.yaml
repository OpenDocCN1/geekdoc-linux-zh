    6. Press the left mouse button and drag in any direction (up, down, sideways,
    or diagonally). A yellow dashed rectangle with squares at the corners will appear
    and the selection will scale up or down (Figure 29). In addition, a Scaling Information
    box may open, displaying the old and new width and height of the selection or
    layer (Figure 30).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_172_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_172_1.png)


    **Figure 31.** If you hold down the Shift key while dragging, only the width of
    the selection or layer scales.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_172_2.png)


    # Tips


    +   - To only change the width of a selection or layer, hold down the Shift key
    while dragging (Figure 31).


    +   - To only change the height of a selection or layer, hold down the Ctrl key
    while dragging (Figure 32).


    +   - To scale a selection or layer keeping both the width and height proportionally
    the same, hold down both the Shift and Ctrl keys while dragging (Figure 33).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_172_3.png)


    **Figure 32.** If you hold down the Ctrl key while dragging, only the height of
    the selection or layer scales.


    # Repeating a Transformation


    To repeat the last transformation, right-click on the image and choose Filters→
    Repeat last from the pop-up menu or press Alt+F on the keyboard.


    **Figure 33.** If you hold down both the Shift and Ctrl keys while dragging, the
    selection or layer scales proportionally.


    157'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Chapter 10


    # To scale an image using the Scale command:


    +   Right-click on the image and choose Image→Scale from the pop-up menu (Figure
    34). The Image Scale dialog box will open (Figure 35).


    +   Enter new dimensions (in pixels) in the New width and Height text boxes.


    Enter new proportions in the X ratio and Y ratio text boxes, where X is the width
    and Y is the height.


    +   If you want to keep the width and height of the image proportionally the same,
    make sure the Constrain Ratio button is selected.


    +   Click OK. The display area and the image itself will scale to the new size
