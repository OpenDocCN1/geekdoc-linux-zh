    # Tips


    +   - If you are trying to use the least number of colors possible and don''t
    like the results of the color conversion, press Ctrl+Z on the keyboard to undo
    the changes, then try the conversion with a different number of colors.


    +   - For more details about creating images with the fewest number of colors,
    take a look at the "Color and Web Images" section on page 40.


    CONVERT AN IMAGE TO INDEXED COLOR


    # To Dither or Not to Dither?


    If you select the dithering option when converting an image to indexed color,
    the GIMP will try to create colors not available in the color palette by mixing
    adjacent colors. This doesn''t create new colors, it just blends existing colors
    in the color palette. The image in Figure 5 is dithered, whereas the same image
    in Figure 6 is not.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_286_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_286_2.png)


    Figure 5. This image is made up of a palette of 10 colors and is dithered.


    Figure 6. This image is also made up of a palette of 10 colors, but it is not
    dithered.


