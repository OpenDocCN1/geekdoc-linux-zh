    +   4. Enter a font name that is loaded on your computer in the Font text box.
    (To find what''s loaded on your computer, take a look at the available font list
    in the Text Tool dialog. To open this dialog box, follow steps 2–3 on page 208).


    +   5. Click the Glow Color button to open the Script-Fu Color Picker (Figure
    26).


    +   6. Use the Script-Fu Color Picker to set the color of the drop-shadow.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_202_2.png)


    Figure 39. In the GIMP Toolbox, choose Xns->Script- Alien Glow from the pop-up
    menu.


