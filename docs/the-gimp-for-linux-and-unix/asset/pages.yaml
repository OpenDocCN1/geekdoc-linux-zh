  md: '# The Crop Tool


    When an image is cropped, unneeded edges or portions of the image are cut away.


    To crop an image:


    +   1. Click the Crop Tool in the Toolbox to select it or press Shift+C on the
    keyboard. The mouse pointer will change to a crosshair.


    +   2. Position the mouse at the upper-left corner of the area you want to keep.


    +   3. Press the left mouse button and drag diagonally to the right to select
    the area you want to keep (Figure 7). Horizontal and vertical lines forming a
    cropping rectangle will appear, indicating the area that you have selected. The
    rectangle will contain four handles—black squares—that let you resize and move
    the cropping rectangle. Also, a Crop Information dialog box will open (Figure
    8).


    +   4. If you need to make the cropping rectangle smaller or larger, you can resize
    it:


    ![](img/5164bc49fb24f10213e18cc994b7b40c_164_0.png)


    Figure 7. Drag the mouse to create a cropping rectangle. Everything within the
    cropping rectangle will remain after the image is cropped.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_164_1.png)


    | X Origin: 130 |

    | Y Origin: 5 |

    | Width: 123 |

    | Height: 127 |


    Figure 8. The Crop Information box tells you the width, height, and location of
    the selected area.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_164_2.png)


    +   A. Position the mouse crosshair over either the top-left or bottom-right handle.
    The mouse pointer will change to an arrow pointing into a corner (Figure 9).


    +   B. Press the left mouse button and drag to resize the cropping rectangle.


    +   C. Release the left mouse button when you are happy with the size and shape
    of the cropping rectangle.


    (continued)


    Figure 9. Drag the mouse to resize the cropping rectangle.


    CROP TOOL: CROP AN IMAGE'
