- pgno: 227
  md: '# Chapter 13


    # Creating Two Interesting Masks


    The number of ways you can use a layer mask is only limited by your imagination.
    Two interesting ways to use a layer mask include creating a layer mask using a
    text cutout and using a gradient.


    To create a layer mask using a text cutout:


    +   1. Open the image to which you want to add the layer mask text cutout (Figure
    39).


    +   2. Using the Layers & Channels dialog box, create a new white layer on top
    of any existing layers. The image will be hidden by the new white layer. For directions
    on how to do this, turn to page 93.


    +   3. Add a layer mask to the new layer. (See page 200 for directions on how
    to do this.) The Layers tab of the Layers & Channels dialog box will contain the
    original layers, and the new layer and layer mask (Figure 40).


    +   4. Make sure the layer mask is selected.


    +   5. Set black as the foreground color. (Turn to page 42 to find out how to
    do this)


    +   6. Select the Text Tool in the GIMP Toolbox.


    +   7. Position the mouse pointer over the area where you would like the text
    to appear and click. The Tool dialog box will open (Figure 41).


    +   8. Use the Tool dialog box to select a font and font size. In addition type
    the text you want to create in the large text box at the bottom of the dialog
    box. (To learn more about adding text to images, see Chapter 14, Working with
    Text.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_227_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_227_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_227_2.png)


