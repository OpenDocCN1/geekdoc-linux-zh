  md: "# Deleting a Selected Area\n\nWhen you delete the area within a selection (**Figure\
    \ 78**), portion of the image will disappear. In its place one of two things will\
    \ appear:\n\n+   - If the image is made up of only one layer (*the background\
    \ layer*), the active background color in the color selector on the Toolbox will\
    \ become visible (**Figure 79**); or\n- If the image contains more than one layer\
    \ or an alpha channel, the checkerboard background, denoting transparency, will\
    \ become visible (**Figure 80**).\n\nTo delete a selected area:\n\nRight-click\
    \ on the selected area and choose Edit $\rightarrow$ Clear from the pop-up menu\
    \ (**Figure 81**) or press Ctrl+K on the keyboard.\n\n# Tips\n\n+   - For information\
    \ about alpha channels, what they are used for, and how to add one to an image,\
    \ turn to page 194.\n- To learn about layers and the background layer, turn to\
    \ page 91.\n\n![](img/5164bc49fb24f10213e18cc994b7b40c_103_0.png)\n\n**Figure\
    \ 78.** Select the area of the image you want to remove. In this figure, the dark\
    \ gray background around the baby's head has been selected.\n\n![](img/5164bc49fb24f10213e18cc994b7b40c_103_1.png)\n\
    \n**Figure 79.** When an area of a one layer image is deleted, the background\
    \ color remains. In this figure, a white background replaces the dark gray background\
    \ because the background color in the color selector is set to white.\n\n![](img/5164bc49fb24f10213e18cc994b7b40c_103_2.png)\n\
    \n**Figure 80.** When an area of an image with more than one layer or an alpha\
    \ channel is deleted, the area becomes transparent."
  merge: -1
  img_proc: true
