- pgno: 154
  md: '# Specialized Adjustments


    There are several other commands that also change the brightness values and colors
    in an image. These include Invert, Equalize, Desaturate, Posterize, Threshold,
    and three automatic color enhancement commands—Normalize, Auto-stretch Contrast,
    and Auto-stretch HSV. In many cases, these specialized commands create dramatic
    effects that can be applied to layers or selected areas. By large, these commands
    are used to create special effects and enhance the color in an image rather than
    correct it.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_154_0.png)


    # Invert


    The Invert command switches pixel color with opposite color values, making a positive
    image appear as a negative and a negative image as a positive.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_154_1.png)


    # To invert a layer or selection:


    +   1. Use the Layers & Channels dialog box to select a layer. (For details about
    how to do this, turn to page 92.)


    +   2. If you wish, use the selection tool of your choice to select an area of
    the image. (For directions on how to use the selection tools, turn to Chapter
    6, Making Selections.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_154_2.png)


    +   3. Right-click on the image and choose Image→Colors→Invert from the pop-up
    menu (Figure 28). The colors in the image will invert (Figures 29a–b).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_154_3.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_154_4.png)'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Equalize


    The Equalize command finds the brightest and darkest values in an image and averages
    them out so the darkest value becomes black and the brightest value becomes white.
    This command can improve dark images or images that do not have enough contrast.


    # To equalize a layer or selection:


    +   1. Use the Layers & Channels dialog box to select a layer. (For details about
    how to do this, turn to page 22.)


    +   2. If you wish, use the selection tool to choose an area of the image.


    Figure 30. Right-click on the image and choose Image→Colors→Equalize from the
    pop-up menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_155_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_155_1.png)


    # Desaturate


    The Desaturate command removes color from the currently selected layer or selection.
    You can create an attention-getting effect by leaving one object colored while
    removing all other color from an image.


    # To desaturate a layer or selection:


    +   1. Use the Layers & Channels dialog box to select a layer. (For details about
    how to do this, turn to page 22.)


    +   2. If you wish, use the selection tool to select an area of the image. (For
    directions on how to use the selection tool, turn to Chapter 6, Making Selections.)


    +   3. Right-click on the image and choose Image→Colors→Desaturate from the pop-up
    menu (Figure 32). The color in the layer will change to grayscale.


    Figure 32. Right-click on the image and choose Image→Colors→Desaturate from the
    pop-up menu.'
  merge: -1
  img_proc: true
