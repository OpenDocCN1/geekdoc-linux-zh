- pgno: 330
  md: '# The GIMP Screen


    When you launch the GIMP the only thing that appears on the screen is the GIMP
    toolbox. To start a new image, in the GIMP toolbox choose File->New or press Ctrl+N
    on the keyboard. To open an existing image, in the GIMP toolbox choose File->Open
    or press Ctrl+O.


    # What You''ll See When You

    Launch the GIMP


    See inside flip for details about GIMP tools.


