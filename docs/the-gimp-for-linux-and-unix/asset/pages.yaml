- pgno: 223
  md: '# Chapter 13


    # Layer Masks


    A layer mask controls how different areas of a layer are revealed. In a layer
    mask, white is opaque, black is transparent, and gray is semi-transparent. Layer
    masks work as test areas, letting you try out different effects without making
    permanent changes. If you create an effect you like, you can apply the mask to
    the layer and make it permanent. If you don''t like it, you can remove the layer
    mask.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_223_0.png)


    # To add a mask to a layer:


    +   On the Layers tab in the Layers & Channels dialog box, right-click on the
    layer that you want to add the mask to, then choose Add Layer Mask from the pop-up
    menu (Figure 27). The Add Mask Options dialog box will open (Figure 28).


    +   In the Initialize Layer Mask Area to select one of the following radio buttons:


    ![](img/5164bc49fb24f10213e18cc994b7b40c_223_1.png)


    +   White (Full Opacity) creates an opaque layer mask. (This is the default and
    a good selection for the first time mask use.)


    +   Black (Full Transparency) creates a completely transparent layer mask.


    +   Layer''s Alpha Channel creates a layer mask using the values found in the
    layer''s alpha channel.


    +   Click OK. The Add Mask Options dialog box will close and the layer mask will
