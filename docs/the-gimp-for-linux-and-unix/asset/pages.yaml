  md: '# Trying Out a Layer Mask


    **Figure 30.** Open a test image.


    If this is the first time you are using a layer mask, follow the directions below
    to get a sense of what a layer mask can do.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_224_0.png)


    To try a layer mask:


    +   1. Open a test image (**Figure 30**).

    2. Using the Layers & Channels dialog box, create a new layer with a white layer
    fill type. (Turn to page 93 for directions.) The image will disappear under the
    solid white layer.

    3. Add a White (Full Opacity) layer mask (**Figure 31**). (Take a look at page
    200 for directions about how to do this.)

    4. Set the foreground color to black. (Turn to page 42 for directions.)

    5. Select either the Pencil or Paintbrush Tool from the GIMP Toolbox.

    6. Use the Brush Selection dialog box to select a brush. (For directions on how
    to do this turn to page 110).

    7. Make sure the layer mask is selected.

    8. Position the mouse pointer over the layer mask, press the left mouse button
    and drag. As you paint, the image under the layer mask will be revealed (**Figure
    32**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_224_1.png)


    **Figure 31.** Add a new layer with a white fill, then add a full opacity, white
    mask to that new layer.


