- pgno: 204
  md: '# CREATING COMPOSITE IMAGES


    ![](img/5164bc49fb24f10213e18cc994b7b40c_204_0.png)


    Composite images are made by combining elements from different images or photographs.
    Using the techniques you have learned, you can place these different elements,
    one of the other, and manipulate any way you want using opacity and blending modes.


    But how does one put a composite image together? By using familiar commands, as
    copy, cut, and, in addition, portions of images can be cloned,*, and then blurred
    or sharpened to create a uniform look.


    To copy a selection:


    +   1. Use the selection tool of your choice to select an area of the image (for
    details how to do this, turn to Chapter 6, Making Selections) (Figure 1)

    2. Right-click on the image and choose Edit→Copy from the pop-up menu (Figure
    2) or press Ctrl+C on the keyboard. The selected area will be copied to the clipboard,
    ready for you to paste into another layer or image.


    | File | Edit | Cut | Ctrl+X |

    |---|---|---|---|

    | Select | Copy | Ctrl+C |

    | View | Paste | Ctrl+V |

    | Image | Paste Into | |

    | Layers | Clear | Ctrl+K |

    | Tools | Fill | |


    Figure 1. Use a selection tool to select an area of the image. In this figure,
    the sunflower has been selected using the Fuzzy Selection Tool.


    Figure 2. Right-click on the image and choose Edit→Copy from the pop-up menu.'
