    8. To adjust highlights, enter a number in the rightmost Input Levels text box
    or slide the white Input Level triangle to the left.


    9. To make the image brighter overall, enter a number in the left Output Levels
    text box or slide the black Output Level triangle to the right (Figure 5).


    10. To make the image darker overall, enter a number in the right Output Levels
