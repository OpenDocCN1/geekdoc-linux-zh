    # Adding an Alien Glow


    ![](img/5164bc49fb24f10213e18cc994b7b40c_202_1.png)


    The Alien Glow script-fu is a mini-program that adds a three-dimensional, glowing
    effect to text using layers. It works just like other script-fu programs in that
    there is a dialog box used to set options.


    # To add an Alien Glow:


