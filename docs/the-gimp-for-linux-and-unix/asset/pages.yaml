  md: '# The Flip Tool


    With the Flip Tool, you can flip a selection or layer vertically or horizontally
    with just a click of the mouse.


    To flip a selection or layer horizontally:


    +   1. Use the Layers & Channels dialog box to select which layer will be flipped
    (for details about this dialog box, see page 92).

    and/or

    Use one of the selection tools of your choice to select an area. (For directions
    about the selection tools, turn to Chapter 6, Making Selections.)

    2. Double-click on the Flip Tool in the GIMP Toolbox. The Tool Options dialog
    box will open (**Figure 16**).

    3. Select the Horizontal radio button.

    4. Click Close to close the Tool Options dialog box.

    5. With the Flip Tool selected, click on the layer or selected area. The layer
    or selection will flip horizontally (**Figures 17a–b**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_167_0.png)


    **Figure 16.** In the Tool Options dialog box, select the Horizontal radio button,
    then click Close.


