- pgno: 201
  md: '# Rounded Corners and a Drop Shadow


    It''s easy to add rounded corners with a drop shadow to an image using a script-fu.


    # To add rounded corners with a drop shadow:


    +   1. Use the Layers & Channels dialog box to select the bottommost layer of
    the image (for directions on how to do this, turn to page 92) (Figure 34).

    2. Right-click on the image and choose Script-Fu→Decor→Round Corners from the
    pop-up menu (Figure 35). The Script-Fu Corners dialog box will open (Figure 36).

    3. In the Radius of Edges text box, enter the value (in degrees) for how much
    the corners will be rounded. The higher the number, the round corners.

    4. Select the Add drop-shadow check button.

    5. Use the x and y text boxes to set how the drop shadow is offset from the image
    (The default setting of 8 for both works perfectly well).

    6. To set how fuzzy the drop shadow is, enter a value in the Blur Radius text
    box. The higher the number, the fuzzier the drop shadow.

    7. If you want the image to have an opaque background color, select the background
    check button. If this check button is unset, the image will have a transparent
    background.

    8. To set the script-fu to work on a copy of the image and keep the original intact,
    select the Work on copy check button.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_201_0.png)


    Figure 35. Right-click on the image and choose Script-Fu→Decor→Round Corners from
    the poop-up menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_201_1.png)


    Figure 36. Use the Script-Fu Round Corners dialog box to set the size of the rounded
    corners, add a drop shadow, set the drop shadow offset and blur, and add a background.
    (If this is the first time you are using these, try the default settings.)'
