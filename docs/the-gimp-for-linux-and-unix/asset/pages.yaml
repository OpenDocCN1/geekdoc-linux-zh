    +   2. To select a new line shape, click on a brush in the brush window (Figure
    11). The brush name and pixel size will appear in the Brush Selection dialog box.


    +   3. To set the opacity of the line, use the Opacity slider bar (Figure 12).
    The higher the setting more opaque the line will be. A setting of 0 is completely
    transparent, whereas a setting of 100 is completely opaque.


