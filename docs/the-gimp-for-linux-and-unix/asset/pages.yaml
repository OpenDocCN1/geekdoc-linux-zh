  md: '# Chapter 7


    # Merging and Flattening Layers


    Merging and flattening layers perform essentially the same thing, but with one
    very important difference. When layers are merged, only the ones that are visible
    (with the eye icon showing in the Layers & Channels dialog box) are combined into
    one layer. When layers are flattened, all visible and invisible are combined into
    one layer.


    To merge all visible layers:


    +   Right-click on the image and choose Layers→Merge Visible Layers from the pop-up
    menu (Figure 32).


    or


    +   In the Layers & Channels dialog box, right-click in the layer window and choose
    Merge Visible Layers from the pop-up menu (Figure 33).


    or


    +   Press Ctrl+M on the keyboard.


    The Layer Merge Options dialog box will appear (Figure 34).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_119_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_119_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_119_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_119_3.png)


    Figure 34. Select the radio button next to the option you would like to choose.
    In this figure, Clipped to bottom layer has selected. This means that the merged
    layers will be cropped to the finest visible layer (in this example, the pencils
    layer as shown in Figure 33).


    Figure 33. In the layer window, right-click and choose Merge Visible Layers from
    the pop-up menu. In this example, the Background layer is hidden.


    104'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# A Layer Primer


    2. Select the radio button that describes how the layers combined into one layer:


    +   - Expanded as necessary—this option sizes the resulting layer to accommodate
    the merged layers.

    - Clipped to image—this option also sizes the resulting layer to accommodate the
    merged layers. (It has the exact same effect as the option above.)

    - Clipped to bottom—this option creates a resulting layer that is the same size
    as the bottom visible layer. If one (or more) of the layers being merged are larger
    than the bottom layer, the layer(s) are cropped to fit the smaller, bottom layer.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_120_0.png)


    **Figure 35.** Since Clipped to bottom layer was selected in Figure 34, this example
    shows how the upper layers—flowers and palette—have been cropped to fit the bottom,
