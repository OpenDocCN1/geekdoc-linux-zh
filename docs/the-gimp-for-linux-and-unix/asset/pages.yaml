  md: '# Creating Clones


    The Clone Tool works like the Paintbrush Tool, letting you stroke color into an
    image. But instead of painting in solid colors, the Clone Tool paints over part
    of an image or pattern. The Clone Tool is great for retouching photographs. Instead
    of trying to fix a damaged area from scratch, and attempting to match color and
    texture, you can just clone the exact colors and textures from a similar area
    of the photo.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_209_0.png)


    # To clone an area in an image:


    +   1. Double-click the Clone Tool in the GIMP Tool. The Options box will open
    (**Figure 20**).

    2. Select the Image Source radio button, then click Close.

    3. Use the Brush Selection dialog box to select a brush, blending mode, and opacity
    (**Figure 21**). For details about how to do this to page 110; blending modes
    are discussed on pages 170–173.

    4. Use the Layer & Channels dialog box to select the area you want to clone. (To
    find out how to do this, turn to page 92.)

    5. With the Clone Tool still selected, position the mouse pointer over the area
    of the source image that you want to clone (**Figures 22a–b**).

    6. Press and hold down the Ctrl key, and then click.

    7. Release the Ctrl key, move the mouse pointer to the destination image, and
    position the pointer where you want to paint the clone (this can be in the same
    or another image window) (**Figure 23**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_209_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_209_2.png)'
