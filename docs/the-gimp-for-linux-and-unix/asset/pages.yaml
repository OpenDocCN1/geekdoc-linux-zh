- pgno: 113
  md: '# Showing and Hiding Layers


    If you''re working on a complicated image, it can be useful to hide any layers
    you are not currently working on.


    # To hide or view a layer:


    +   1. Open the Layers & Channels dialog box by right clicking on the image and
    choosing Layers->Layers & Channels from the pop-up menu (Figure 3).


    +   2. To hide the layer, in the layer window, click the eye icon that corresponds
    to the layer you want to hide. The layer will disappear from your image (Figure
    18). To view the layer, click the area where the eye icon was. The eye will reappear
    and the layer will be visible (Figure 19).


    # Tips


    +   - Even if a layer is hidden, it can still be the active layer. So be careful!
    If your hidden layer is active, you may make changes to the layer that you did
    not intend.


    +   - If you want to hide all layers except one, here''s how: Position the mouse
    over the eye icon of the layer you want to see, press the Shift key on the keyboard,
    and then click the eye icon. All layers except that one will be hidden. To view
    all the layers again, press the Shift key when clicking the eye icon.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_113_0.png)


    Figure 18. When you click the eye icon the layer is hidden. In this example, the
    flowers layer is hidden, still active. Since it''s active there''s a dashed rectangle,
    indicating where the layer is.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_113_1.png)


    Figure 19. When you click again, the eye icon and the layer in the window reappear.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Floating Selections


    A floating selection is a selected area that is not attached to any layer. It
    is displayed in the Layers & Channels dialog box as a “Floating Selection” (Figure
    20). Any changes or edits made to a floating selection will not affect any other
    part of the image. Floating selections are very flexible since they can be moved
    independently of any layer, used to create a new layer, or attached to one. In
    fact, you can use a floating selection to move part of an image from one layer
    to another. There are four ways to create a floating selection:


    +   - When a selection is moved, it detaches from its layer and becomes a floating
    selection. (For details on moving a selection, turn to page 147.)


    +   - When text is created using the Text Tool, the text is added to the image
    as a floating selection. (To find out how to add text to an image, turn to page
    208.)


    +   - When an item is pasted into an image using the clipboard, it becomes a floating
    selection. (To learn how to paste an item into an image, turn to page 182.)


    +   - When a selection is set to float using the Float command. (To find out how
    to do this, below.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_114_0.png)


    | Figure 21. Choose Select→Float from the pop-up menu. |

    | | | |

    |---|---|---|n| File | | |

    | Edit | | |

    | Select | Toggle | Ctl+T |

    | View | Invert | Ctl+I |

    | Image | All | Ctl+A |

    | Layers | None | Shift+Ctl+A |

    | Tools | Float | Shift+Ctl+L |

    | Filters | Sharpen | Shift+Ctl+H |

    | Script-Fu | Border | |

    | Dialogs | Feather | Shift+Ctl+F |

    | | Grow | |

    | | Shrink | |

    | | Save To Channel By Color... |


    # To float a selected area:


    +   - Use the selection tool of your choice to select the area you want to float.
    (For directions on how to do this, turn to Chapter 6, Making Selections.)


    +   - Right-click on the selected area and choose Select→Float from the pop-up
    menu (Figure 21) or press Shift+Ctrl+L on the keyboard. The selected area will
    float and appear in the Layers & Channels dialog box as a Floating Selection (Figure
    20).'
  merge: -1
  img_proc: true
