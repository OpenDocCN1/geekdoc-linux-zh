- pgno: 272
  md: '# Two Special Plug-ins


    There are many special graphics plug-ins that come with the GIMP, but we will
    discuss just two of them here: Gfig and IfsCompose. Gfig is a self-contained drawing
    program that works with the GIMP to let you create geometric patterns and shapes.
    IfsCompose lets you repetitive, complex geometric shapes and patterns, such as
    snowflakes and fern leaves.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_272_0.png)


    Figure 3. Right-click on the image window and choose Filters→Renderer→Gfig from
    the pop-up menu.


    # To create a geometric shape with Gfig:


    +   1. Open an image or create a new one.

    2. Use the Layers & Channels dialog box to select the layer where you want the
    geometric shape to appear. (For details on selecting a layer, turn to page 92.)


    (continued)


    Figure 4. Use the Gfig plug-in to draw geometric shapes.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_272_1.png)


    Click to paint object into the open GIMP image window


    Click to clear the drawing window'
