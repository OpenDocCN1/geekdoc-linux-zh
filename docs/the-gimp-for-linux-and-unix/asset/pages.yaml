- pgno: 62
  md: '# Selecting Colors


    # Color Palettes


    When you want to work with a specific color or a group of colors, color palettes
    are the way to go. For instance, if you wanted to create buttons for a Web page
    and keep the colors consistent, you could create a color palette for that purpose.
    With the GIMP, you can edit existing palettes and create new ones.


    # To adjust a color in an existing palette:


    +   1. Press Ctrl+P on the keyboard to open the Color Palette dialog box (Figure
    17).


    +   2. Use the Color Palette drop-down list to select a color palette (Figure
    10).


    +   3. In the palette window, click on the color square that you want to change
    (Figure 18).


    +   4. Click Edit. The Color Selection dialog box will appear (Figure 3).


    +   5. Use the Color Selection dialog box to adjust the color. (For directions
    on how to do this, take a look at step 2 over page 42).


    +   6. Click OK in the Color Selection dialog box to close it and return to the
    Color Palette dialog box. The selected color square will change to the new color.


    +   7. When you are finished changing colors, click Close to close the Color Palette
    dialog box.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_62_0.png)


    Figure 17. Open the Color Palette dialog box and select a palette from the Color
    Palette drop-down list. In this figure, Coldfire is selected.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_62_1.png)


    Palette window


    Figure 18. In the palette window, click the color square that you want to change.


    # Why Don''t My Keyboard Shortcuts Work?


    If the GIMP Toolbox or any other desktop window or icon (besides a GIMP image
    window) has focus (is selected), GIMP keyboard shortcuts won''t work. To make
    them work, just click on a GIMP image window to select it, then press the shortcut
    you want to use.'
  merge: -1
  img_proc: true
