  md: '# Chapter 14


    # # Adding Special Effects to Text


    There are so many special effects one can add to text that it is mind boggling!
    In this section you''ll find two of the many possibilities. Try mixing different
    filters, blending modes, and gradients. For some interesting ideas, look at http://www.xach.com/GIMP/dates/


    +   1. Open the image to you want to add the effect (Figure 46).


    +   2. Select with the foreground color (see page 42 for directions).


    +   3. Use the Text Tool to create the text you want to add to the image. The
    text will appear as a floating selection in the image (Figure 47).


    +   4. Right-click on the image window and choose Script-Fu→Decor→Xach-Effect
    from the pop-up menu (Figure 48). The Script-Fu Xach-Effect dialog box will open
    (Figure 49).


    +   5. In the X and Y boxes, enter the value (in pixels) that you would like the
    highlight moved over (offset) from the original.


    +   6. Use the Highlight Color, Opacity, and Drop Shadow Color buttons to pick
    the Script-Fu Color picker box (Figure 50) to select colors for these effects.


    +   7. In the Drop Shadow opacity box, enter a percentage value. The more transparent
    the drop shadow will be.


    +   8. To set how fuzzy the drop shadow is, enter a value in pixels in the Drop
    Blur Radius text box. The higher the number, the fuzzier the drop shadow.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_247_0.png)


