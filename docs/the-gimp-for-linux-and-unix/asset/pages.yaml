- pgno: 287
  md: '# Chapter 17


    # Viewing and Editing a Color Palette


    Once you''ve converted an image to indexed color, thus creating a custom palette,
    you may want to view the color palette and edit the colors.


    To view and edit the color palette created from an indexed image:


    +   1. Right-click on the image and choose Dialogs -> Indexed Palette from the
    pop-up menu (Figure 7). The Indexed Color Palette dialog box will appear, displaying
    the color palette for that image (Figure 8).


    +   2. To edit, right-click on the color square. The Color Selection dialog box
    will open, displaying the color in the old color area (Figure 9).


    +   3. Use the color wheel and the slider bars to adjust the color.


    +   4. When you are done adjusting the color, click OK to close the Color Selection
    dialog box. The adjusted color will appear in the color square right clicked on
    (Figure 10), and the color in the image will change to reflect the new color (Figure
    11).


    Tip


    +   This is a temporary color palette that will only be available while working
    on the indexed image. When the image is closed, the palette will be gone. If you
    want to save the palette to use with other graphics, turn to page 50 for directions.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_287_0.png)


    Figure 7. Right-click on the image and choose Dialogs-Indexed Palette from the
    pop-up menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_287_1.png)


