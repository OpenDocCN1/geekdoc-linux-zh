  md: '# Chapter 10


    # Scaling and Resizing an Image


    Scaling and resizing both change the size of an image but with different results.
    Scaling changes both the size of the image display area and the image itself.
    Resizing changes the size of the image display area, but doesn''t alter the image.
    (It works the same way for scaling and resizing a layer as discussed on page 96.)


    Unfortunately, the GIMP is a bit inconsistent with scaling. When an image is scaled
    using the Scale command on the image, it follows the scaling rule as stated above.
    However, when image is scaled using the Transform Tool, only the image size changes
    remains same.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_171_0.png)


