  md: '# Chapter 8


    # Changing Brushes


    You can set almost every aspect of the lines you draw—from thickness and shape,
    to spacing and opacity—by changing brush properties.


    To change the brush properties:


    +   1. In the GIMP Toolbox, choose File→Dialogs→Brushes (Figure 8).


    or

    Right-click on an image and choose Dialogs→Brushes from the pop-up menu (Figure
    9).


    or

