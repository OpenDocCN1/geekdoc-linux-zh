- pgno: 39
  md: '# Launching the GIMP for the First Time


    When you launch the GIMP for the very first time, a GIMP Installation dialog box
    will appear (Figure 19). This box contains bit about the GIMP General Public License
    and tells you about the personalization files that need to be installed to use
    the GIMP. This dialog box will appear only once. You won''t see it again after
    you have installed the personalization files.


    # To install GIMP personalization files:


    +   1. Launch the GIMP for the first time. The GIMP Installation dialog box will
    open (Figure 19).

    2. Click Install. The GIMP program will install the personalization you need.
    When it is finished, an Installation Log box will appear, confirming that everything
    has been installed (Figure 20).

    3. Click Continue. The GIMP program will load (Figure 21). The GIMP Toolbox and
    GIMP Tip of the day dialog box will appear (Figure 22). This dialog box will display
    a happy time with you to launch the GIMP. If you don''t want to see it, use the
    Show tip check box. (By the way, the cute dog with the head and the paintbrush
    in his mouth is Wilber, the GIMP mascot.).

    4. Click Close. The GIMP Tip of the day dialog box will close, leaving the Toolbox
    ready for you to use (Figure 1).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_39_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_39_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_39_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_39_3.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Starting a New Image


    Figure 23. Choose File→New in the GIMP Toolbox.


    When the GIMP is launched, all that appears is a small toolbox (**Figure 1**).
    Now what? This unassuming little toolbox is your gateway to creating images.


    To start a new image:


    +   1. Choose File→New in the GIMP Toolbox (**Figure 23**)


    Figure 24. Right-click on an image window and choose File→New from the pop-up
    menu.


    or


    Press Ctrl+N on the keyboard.


    or


    If you already have an image window


    Figure 25. Use the Image dialog box to set the size, color mode, and fill for
    the new image.


    The New Image dialog box will open (**Figure 25**).


    +   2. Use the Width and Height text boxes to set the dimensions of the new image.
    These dimensions are always set in pixels. Pixels are the tiny rectangular dots
    used to display an image on a computer screen.


    (continued)


    # How Big is a Pixel?


    Pixels aren''t absolute measurement units such as inches or centimeters are on
    a ruler. The size of a pixel depends upon the actual size of your computer monitor
    and its **resolution**. Resolution is the number of pixels displayed vertically
    and horizontally on the computer screen. Some typical resolution settings are
    1024x768, 800x600, and 640x480. Normally, most monitors have between 50 and 100
    pixels per inch (20 to 40 pixels per centimeter).


    To summarize, pixels are not concrete in the way that inches and centimeters are.
    A pixel''s actual real-world size depends upon a number of variables.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_40_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_40_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_40_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_40_3.png)'
  merge: -1
  img_proc: true
