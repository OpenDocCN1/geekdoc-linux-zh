  md: '# Hue, Lightness, and Saturation


    Hue-Saturation changes the color mixture in an image just as the Color Balance
    command does, but with more dramatic results. Using the Hue-Saturation command,
    you can adjust the hue, lightness, and saturation of an image''s individual color
    components. This adjustment tool is based on the HSV color model (for a description
    of this color model, turn to page 35).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_151_0.png)


    # To adjust hue, lightness, and saturation:


    +   1. Use the Layers & Channels dialog box to select a layer. (For details on
    how to do this, turn to page 92).


    +   2. If you wish, use the selection tool to select an area of the image. (For
    directions on how to use the selection tools, turn to Chapter 6, Making Selections.)


    +   3. Right-click on the image and choose Image→Colors→Hue-Saturation from the
    pop-up menu (Figure 20). The Hue-Saturation dialog box will appear (Figure 21).


    +   4. Make sure the Preview check button is selected.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_151_1.png)


