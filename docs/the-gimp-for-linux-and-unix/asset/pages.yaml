- pgno: 188
  md: '# Aligning Layers


    | File | Figure 4. Right-click on the image and choose Layers-> Align Visible
    Layers from the pop-up menu. |

    |---|---|

    | Edit | |

    | Select | |

    | View | |

    | Image | |

    | Layers | Layers & Channels... |

    | Tools | Raise Layer Ctrl+F |

    | Filters | Lower Layer Ctrl+B |

    | Script-Fu | Anchor Layer Ctrl+H |

    | Dialogs | Merge Visible Layers Ctrl+M |

    | Flatten Image

    | Alpha To Selection

    | Mask To Selection

    | Add Alpha Channel

    | Align Visible Layers |


    The Align Visible Layers command can be used to precisely align all (of course!)
    layers. If you don''t want to align a particular layer, just use the Layers &
    Channels dialog to hide it (for directions about how to do this, turn to page
    98).


    # To align visible layers:


    +   1. Use the Layers & Channels dialog box to hide the layers you don''t want
    (**Figure 3**).

    2. Right-click on the image and choose Layers-> Align Visible Layers from the
    pop-up menu (**Figure 4**). The plug_in_align_layers dialog box will open (**Figure
    5**).

    3. In the Parameter settings area, use the Horizontal style drop-down list to
    set how the layers will be positioned horizontally in relation to themselves.
    There are five settings for this option: None, Collect, Fill (left to right),
    Fill (right to left), or Snap to grid.

    4. Use the Horizontal base drop-down list to set the edge to which the layers
    will line up: Left edge, Center, or Right edge.

    5. Use the Vertical style drop-down list to set how the layers will be positioned
    vertically in relation to themselves. There are five settings for this option:
    None, Collect, Fill (top to bottom), Fill (bottom to top), Snap to grid.

    6. Use the Vertical base drop-down list to set the edge to which the layers will
    line up: Top edge, Center, or Bottom edge.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_188_0.png)


    **Figure 5.** Use the plug_in_align_layers dialog box to set the visible layers
    are aligned.


    (continued)'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Chapter 11


    7. Select the Ignore bottom layer if visible check button if you don''t want the
    bottommost layer to move. This is a good idea when the Background layer is selected,
    because most times you won''t want the background moving.


    8. Select the Use (invisible) bottom layer as the base check button if you want
    the bottom layer to be aligned. Even if the Background layer is hidden, this option
    will group the layer with all other visible layers and align them.


    9. Use the Grid size slider to set up a grid to which the layers can align (this
    slider is only relevant if you use Snap grid from either the Horizontal or Vertical
    style drop-down lists).


    10. Click OK. The plug_in_align_layers dialog box will close and the layers will
    be aligned (Figures 6a–b).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_189_0.png)


    Figure 6a. This image shows the original layout of the three cars. Each car is
    on its own layer (the layers are displayed in Figure 3).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_189_1.png)


    Figure 6b. The three cars after they have been aligned using the plug_in_align_layers
    dialog box. The cars were aligned using the following settings: Horizontal style
    (left to right); Horizontal base, Left edge; Vertical style (top to bottom); Vertical
    base, center.


    # ✓ Tips


    +   - To align layers exactly on one of another, select Select from both the Horizontal
    and Vertical drop-down lists, and select Center from both the Horizontal and Vertical
    base drop-down lists.


    +   - If you decide to use a grid for alignment, you should know that by default
    the grid is invisible. To view it, right-click on the image and choose Filters→Render→Grid
    from the pop-up menu (Figure 7). A dialog box will open (Figure 8). Set the X
    and Y to set the Grid size you are using the slider in the plug_in_align_layers
    dialog box. Click OK in the Grid dialog box. The grid and a grid will appear on
    your image.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_189_2.png)


    Figure 7. Right-click on the image and choose Filters→Render→Grid from the pop-up
