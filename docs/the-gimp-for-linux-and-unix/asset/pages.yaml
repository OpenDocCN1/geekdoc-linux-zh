- pgno: 230
  md: '# WORKING WITH TEXT


    Text is created in the GIMP using the Text Tool in the GIMP Toolbox. It appears
    selected in the image window on the active layer. The text''s attributes—font,
    size, style, and the text itself—are all entered before the text appears in the
    image—once created, it can be moved, recolored, filled with a pattern or gradient,
    or manipulated using filters. You should know, though once text is created, none
    of the text attributes (font, size, style, or the text itself) can be changed—you''ll
    have to create new text.


    In this chapter, you''ll find out how to create text and discover the difference
    between Type 1 and TrueType fonts. Then, you''ll learn how to add fonts so the
    GIMP can use them. From there, you''ll rotate and transform text, move a layer,
    fill with a pattern, and create fading text. Finally, you''ll find out how to
    add layer effects to semi-transparent text, add a sparkle effect, and create amazing
    effects using script-fu mini-programs.


    # Put Text on Its Own Layer


    When working with text in an image, it''s always a good idea to create the text
    on its own layer. That way you can manipulate it without affecting other image
    elements. And, if you don''t have the text after working with it, you can easily
    delete it.


    Another: since text isn''t editable after it''s created, there''s no way to find
    out what font is if you want to create more that''s exactly the same. One way
    to get around this is to enter the font name and size as the layer name. For instance,
    you could name a layer "Times, 50 point, bold, italic".'
  merge: -1
  img_proc: true
