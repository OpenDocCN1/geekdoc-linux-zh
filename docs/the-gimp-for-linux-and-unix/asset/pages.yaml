- pgno: 175
  md: '# Chapter 10


    # Shearing a Layer or a Selection


    Shearing moves the vertical planes of an image up or down, or horizontal planes
    sideways, creating a leaning effect. You can shear a selected area or a layer.
    (Remember that if your image consists of one layer, the Background, the entire
    image will be sheared.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_175_0.png)


    Figure 40. If you wish, you can select the area that will be skewed. In this figure,
    the tea in the cup is selected.


    To shear a layer or selection:


    +   1. Use the Layers & Channels dialog box to select which layer will be sheared.


    and/or  Use one of the selection tools of your choice to select an area (Figure
    40).


    +   2. Double-click on the Transform Tool in the GIMP Toolbox. The Tool Options
    dialog box will open (Figure 41).


    +   3. In the Transform area, select the Shearing radio button.


    +   4. Click Close to close the Tool Options dialog box.


    +   5. With the Transform Tool selected, position the mouse pointer over the image
    or selected area. The mouse pointer will change to a black arrow.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_175_1.png)


    Figure 41. In the Tool Options dialog box, select the Shearing radio button, then
    click Close.


    +   6. Position the mouse pointer over the layer or selection.


    +   7. Press the left mouse button and drag either up, down, left, or right. A
    dashed rectangle with squares at the corners will appear and the image will shear
    vertically or horizontally (Figure 42). In addition, a Shearing Information dialog
    box will open, displaying X and Y Shear Magnitude (Figure 43). If you drag left
    or up, the Shear Magnitude values will be positive. If you drag right or down,
    the values will be negative.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_175_2.png)


    Figure 42. Drag the mouse to shear the image.


    160'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Adding Perspective


    Adding perspective to a layer or selection gives the illusion that the area is
    receding to a vanishing point. (Remember that if your image consists of one layer,
    the Background, then perspective will be added to the entire image).


    **Figure 43.** The Shear Information dialog box displays the amount of X and Y
    shearing.


    # To add perspective to a layer or selection:


    +   1. Use the Layers & Channels dialog box to select which layer will be sheared
    (for details about this dialog box, see page 92).


    and/or

    Use one of the selection tools of your choice to select an area.

    2. Double-click on the Transform Tool in the GIMP Toolbox. The Tool Options dialog
    box will open (**Figure 44**).

    3. In the Transform area, select the Perspective radio button.

    4. Select the Smoothing check button if you want the edges of the image blurred
    to create a smooth look.

    5. Click Close to close the Tool Options dialog box.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_176_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_176_1.png)


    **Figure 44.** In the Tool Options dialog box, select the Perspective radio button,
    then click Close.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_176_2.png)


    **Figure 45.** When you click on the image, a dashed rectangle with squares at
    the corners appears.


    (continued)'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Chapter 10


    +   6. With the Transform Tool selected, position the mouse pointer over the image
    or selected area.


    +   7. Click. A dashed rectangle with squares at the corners will appear (Figure
    45).


    +   8. Position the mouse pointer over one of the corner squares, press the left
    mouse button and drag. The perspective of the image will change (Figure 46).


    +   9. Continue dragging the corner squares until the effect you want is achieved
    (Figure 47).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_177_0.png)


    Figure 46. When you drag one of the squares, the perspective of the image changes.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_177_1.png)


    Figure 47. Continue dragging the squares until the perspective of the image is
    the way you want it.


    # Summary

    In this chapter you learned how to:

    * Move a selected area

    * Scale an image

    * Crop an image

    * Resize an image

    * Flip a layer or selection horizontally or vertically

    * Shear a layer or selection

    * Rotate a layer or selection

    * Add perspective


