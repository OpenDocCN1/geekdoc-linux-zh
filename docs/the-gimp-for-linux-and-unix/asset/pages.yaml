- pgno: 313
  md: '# How Does Offset Printing Work?


    When you prepare a project—brochure, newsletter, poster, etc.—for commercial printing,
    you will deal with a print shop and possibly a service bureau.


    Traditionally, a service bureau takes your prepared GIMP files and ever prints
    them using a high-resolution printer, giving you camera-ready output, or images
    the files onto. If you get camera-ready output, the print shop will use a camera
    to shoot pictures of the output to create film.


    With the advent of computers and transportable large storage media as DAT tapes,
    ZIP and JAZ drives, many artists skip the service bureau, cutting out the intermediate
    step of film or camera-ready output, and go straight to the print shop with disks
    containing their project files. Most service bureaus and print shops prefer to
    use PostScript (.ps) or encapsulated PostScript (.eps) files, while others prefer
    Tagged Image Format (.tif) files.


    The print shop takes any of these media—camera-ready output, film, or computer
    files—and uses them to make printing plates. The printing plates are usually made
    of acid etched metal. The plates are then put on large rollers on a printing press
    by the pressman. If your project contains more than one color, the pressman uses
    registration marks to make sure all the plates are exactly aligned. He or she
    then runs the printing press. As the plates rotate, the rollers pick up a very
    thin coating of ink and an ink impression is transferred to the paper.


    After the ink dries, the paper is trimmed and folded using crop marks as a guide.
    The print job may then be stapled or bound, depending upon the print job''s number
    of pages. The completed print job is packed in boxes and shipped to you.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_313_0.png)'
  merge: -1
  img_proc: true
