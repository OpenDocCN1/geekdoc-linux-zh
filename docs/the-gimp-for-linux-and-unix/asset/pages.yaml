- pgno: 22
  md: '# The GIMP Toolbox Menus


    There are two menus available in the GIMP Toolbox (Figures 3–4). These menus give
    access to general commands, such as starting a new graphic, setting preferences,
    or creating new images using script-fus.


    | File | |

    |---|---|

    | New | Ctl+N |

    | Open | Ctl+O |

    | About... | |

    | Preferences... | |

    | Tip of the day | |

    | Dialogs | |

    | Quit | Ctl+Q |


    **Figure 3.** The File menu is used to create and open images, and exit the GIMP.
    It is also used to set preferences, the Tip of the day, learn about the creators
    of the GIMP, and the special GIMP dialogs.


    **Figure 4.** The Xns menu is used to open the DB Browser, create screen shots,
    access script-fus, and view GIMP-related Web sites using a browser. Typically,
    the script-fus located on the Xns menu create new images in a new image window.


    # Script-fus and Plug-ins


    Script-fus and plug-ins are two very powerful programming features that add functionality
    to the GIMP.


    Plug-ins are little programs that let the user add extra features to the GIMP.
    In fact, much of the GIMP, except for core features, plug-ins have been integrated
    into the GIMP program. Since the GIMP is a modular program, it''s easy to enhance
    the GIMP directly through the use of plug-ins without having to recompile or reinstall
    the entire program. Typically, plug-ins are coded in C. If you have some experience
    with C and want to create your plug-ins, visit http://gimp-plug-ins.sourceforge.net/doc/writing/html/plugin-in.html
    for directions.


    Script-fus are essentially the macros of the GIMP. If you are familiar with macros
    (or scripting languages) from word processing programs, you know that a macro
    will vary various actions or repetitive tasks. Script-fus are usually written
    using a programming language called SCHEME. Go to http://xcf.berkeley.edu/~gimp-script-fu/script-fu.html
    to find out more about script-fus and how they are created.


    To find out how to use the script-fus and plug-ins that come with the GIMP, turn
    to Chapter 16, Plug-ins and Script-fus, starting on page 247.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Chapter 1


    # The GIMP Pop-up Menus


    The GIMP works mainly through the use of pop-up menus. These menus give access
    to all possible commands that affect an image, such as copying, adding layers,
    or applying a filter. All of the GIMP menus are shown in Figures 5–14 on the following
    three pages.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_23_0.png)


    **Figure 5.** The File menu is used to create, save, close, and print images.
    It is also used to set user preferences, email an image, and exit the GIMP. (You
    can also create and import images, set preferences, and exit the GIMP using the
    File menu in the GIMP Toolbox.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_23_1.png)


    **Figure 6.** The Edit menu is used to cut, copy, and paste images, into selected
    areas, clear areas of color, fill areas with color, or add to a selection, and
    undo and redo actions. The Cut, Copy, and Paste Named commands let cut, copy,
    and paste multiple items.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_23_2.png)


    **Figure 7.** On the Select menu, the All command selects an entire layer. The
    None command removes all selections (not the areas inside the selections, just
    the selections, themselves). Other Select commands handle the selection boundary
    (toggle), and sharpen, float, grow, feather, or save selections to channels.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_23_3.png)


    **Figure 8.** The View menu is used to zoom in or out (changing your view of an
    image) and toggle rulers, and snap to guides on and off. The New View command
    displays the image in a secondary image window. Shrink Wrap lets you see the entire
    image window regardless of the zoom.'
