- pgno: 31
  md: '# Some Terms You Should Know


    On the next three pages is a quick list of a few GIMP terms that you will see
    throughout the book. Take a look at them to get an idea of what the GIMP can do.
    For more about GIMP terms, turn to Appendix A. Glossary, starting on page 293.


    # Active layer and transparent layer (Figure 28)


    The highlighted layer on the Layers tab dialog box of the Layers & Channels dialog
    is the active layer. When a layer is active, it is the only layer that can be
    edited. An image can have just one layer—usually named the Background layer—or
    more than one layer. Most typically, all layers in an image except the background
    layer are transparent. Layer transparency can be set using the Opacity slider.
    Layers can be moved and aligned, and their stacking order changed. A layer mask
    controls the way a layer is revealed. Turn to Chapter 7, A Layer Primer, and Chapter
    11, Layer Techniques, to find out more about layers.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_31_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_31_0.png)


    # Alpha channel (Figure 29)


    A special grayscale channel that is used to save selections. These selections
    are used to protect areas of an image from editing. To find out more about alpha
    channels, take a look at page 194.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_31_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_31_2.png)


    # Blending mode (Figure 30)


    A blending mode changes the way a layer''s pixels blend with the pixels in the
    layer directly below it. In the image to the right, a white semitransparent layer
    using an blending mode has been placed on top of the point shoe. To learn more
    about blending modes, turn to pages 170–173.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_31_4.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# The Basics


    ![](img/5164bc49fb24f10213e18cc994b7b40c_32_0.png)


    Channel (Figure 31)

    A component of an image that contains the pixel information for an individual
    color. RGB image has three color channels while a grayscale image has one color
    channel. The rose image to the left has been broken down into its three channels.
    To learn more about channels and how to use them, turn Chapter 13, Channels and
    Layer Masks.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_32_1.png)


    Filter (Figure 32)

    Filters are used to apply special effects to an image or selected area. All of
    the filters to plug-ins. Many script-fus use several filters to create complex
    effects. The Pagecurl filter has been applied to the image at the left. Take a
    look at Chapter 15, Using Filters, to find out how they work and the effects they
    create.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_32_2.png)


    Hue, Saturation, and Value (Figure 33)

    Hue is the actual color itself, as green or purple, regardless of the saturation
    or value. Saturation is a description of a color purity. The less gray color contains,
    the higher the saturation. Value is a description of the brightness of a color.
    To find out about the HSV color model, turn to page 35.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_32_3.png)


    Pixels (Figure 34)

    The dots used to display bitmap images in a pattern on the computer screen. The
    GIMP is a pixel-based image manipulation program. Viewed at 200% magnification,
    the bananas at left are showing their pixels. Take a look at page 25 to learn
    more about pixels.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Chapter 1


    # Selection (Figure 35)


    An area of an image that has been isolated to restrict changes to that area. A
    dashed, moving selection boundary (also called marching ants) delineates the selected
    area. If a selection is moved, the space left behind is filled with the current
    background color if the selection is on the Background layer; if the selection
    is on another layer, the space becomes transparent. A floating selection is a
    selection that is not anchored to a layer. Take a look at Chapter 6, Making Selections,
    to learn about the ins and outs of selecting.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_33_0.png)


    # Transparency (Figure 36)


    An area of an image where the pixels contain no color. A transparent area in an
    image is shown in the GIMP image window with a light and dark gray checkerboard
    pattern. To learn more about layer transparency, turn to page 174. To learn about
    creating transparent effects with layer masks, turn to page 200.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_33_1.png)


    # Summary


    | In this chapter you learned about: |

    | * GIMP installation | * The pop-up menus |

    | * GIMP resources on the Web | * Large menus and dialog boxes |

    | * The GIMP screen | * Special GIMP dialog boxes |

    | * Changing keystroke combinations | * Setting levels of undo and redo |

    | * The GIMP Toolbox | * The GIMP controls |

    | * The GIMP Toolbox menus | * Some GIMP terms you should know |'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# STARTUP


    When the GIMP is launched, a small Toolbox appears on the screen (Figure 1). Using
    this Toolbox, you can open an image window.


    The image window is the area on the screen where images are created. The image
    window consists of the image display area or canvas edged with a dashed line.
    There are rulers across the top and at the left of the image window divided into
    pixels. If the image display area is too large to show all at once, you can use
    scrollbars at the bottom and to the right of the image window to move the image
    display area. You can resize an image window by positioning the mouse pointer
    at any edge or corner, pressing the left image button, and dragging to a new size.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_34_0.png)


    Figure 1. The GIMP Toolbox is your gateway to creating amazing images.'
  merge: -1
  img_proc: true
