- pgno: 48
  md: '# # COLOR

    AND THE GIMP


    his chapter covers the basics of how color works in the GIMP. You''ll discover
    the difference between vector- and pixel-based programs, how color models work,
    and how blending modes affect colors in an image.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_48_0.png)


    # ## Vector- and Pixel-Based Imaging Programs


    Computer imaging programs are either vector based or bitmap based.


    Figure 1. This vector image looks the same whether viewed close or far away.


    In vector-based programs, such as CoreDraw and Adobe Illustrator, objects are
    created using drawing tools that make shapes defined by mathematical formulas.
    A vector object appears on the screen with smooth lines and continuous colors,
    whether you are looking at it from far away or close up (**Figure 1**). Vector
    drawings are *resolution-independent*, meaning that the printed quality depends
    only on the resolution of the printer.


    In bitmap-based programs, such as the GIMP, Corel PhotoPaint, and Adobe Photoshop,
    images are made of tiny dots called *pixels* that are arranged and colored to
    form a pattern. The shape and color of a pixel image appear smooth from a distance,
    but if you were to view a pixel image close up, you would see tiny individual
    squares (**Figure 2**). Pixel images depend on the resolution at which they are
    saved for printquality.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_48_1.png)


    Figure 2. This pixel image looks smooth from far away but shows its pixels when
    viewed close up.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Color Models and Modes


    A color model breaks colors down into their component primary parts. A color model
    is used to represent color images in a standardized way. In the GIMP, color models
    are applied to images as color models.


    # RGB Model


    The Red, Green, Blue color model (normally called RGB) is used to display a color
    image on a computer monitor. RGB is an additive color model, meaning that every
    color can be created using red, green, and blue in varying degrees of brightness.
    (Brightness is expressed in a measurement called value). Each of these three colors
    occupies its own channel within a pixel. This means that RGB color has three channels.
    Typically color information is saved in every 1-bit, 8-bit, or 24-bit color depth.
    Twenty-four-bit color stores the most information per pixel, up to a value of
    256 per channel. In each channel a value of 0 is the darkest (black) and a value
    of 255 is the lightest (white). **Figures 3a–b** show an RGB image and its three
    channels on the Channels tab of the Layers & Channels dialog box.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_49_0.png)


    Figure 3a. This image is set in RGB mode (you''ll have to use your imagination
    here since this figure isn''t in color). Notice that the mode, RGB, appears in
    the title bar. This is a quick way to verify in which mode image is set.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_49_1.png)


    Figure 3b. The Channels tab page of the Layers & Channels dialog box shows the
    available channels.


    # CMYK Model


    The Cyan, Magenta, Yellow, Black color model (known as CMYK—the K represents black)
    is used in high-quality offset color printing. Instead of using light to display
    color as the RGB model, ink or toner is used. CMYK is a subtractive color model,
    meaning that as the colors get darker. RGB at its highest value creates white;
    CMYK has four channels per pixel. Since the GIMP was originally designed for creating
    digital and Web images, it doesn''t support the CMYK color model. You may be interested
    to know that the next released version of the GIMP will support this color model.


    # Other Names for Pixel and Vector


    Pixel-based programs are often referred to as bitmap or raster programs. Vector-based
    programs are also called drawing or object-oriented programs.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Color and the GIMP


    # HSV Model


    The Hue, Saturation, Value (HSV) model is used in combination with the RGB model
    in the GIMP. Hue represents the color in—green, pink, orange, etc. Sat refers
    to the intensity of the color and is measured as a percentage: at 100% saturation
    the color appears as the full color, whereas with 10% saturation the color appears
    washed out. Value is the intensity of light on the color. This component is also
    expressed as a percentage. A value of 100% is white and of 0% is black. The color
    in use appears true at a value of 50%. HSV has three channels.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_50_0.png)


    **Figure 4.** This image is set in Indexed color mode. Using the custom palettes,
    you can create interesting color effects.


    # Indexed Mode


    Indexed mode sets a specific number of colors used in an image from 1 to 256.
    Indexed color has one channel (**Figure 4**).


    The GIMP comes with many custom color palettes that can be used with an indexed
    color image to create interesting effects. There are palettes that contain only
    desert types and browns or sunset hues. There''s even a B Palette that contains
    the 216 colors displayed in a browser. For more details about using color palettes,
    turn to page 47. To learn more about creating images for the Web, take a look
    at Chapter 17, Creating Images for the Web.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_50_1.png)


    **Figure 5.** This image is set in grayscale mode.


    # Grayscale Mode


    An image set in grayscale mode contains no color, only varying shades of gray.
    There are 256 shades of gray from black (0) to white (255). The median shade of
    gray on the grayscale spectrum is set at a value of 128. Grayscale has one channel
    (**Figure 5**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_50_2.png)


    # Bitmap Mode


    Bitmap mode is the simplest of all. It contains only black or white pixels—no
    color or shades of gray (**Figure 6**).


    **Figure 6.** This image is set in bitmap mode. Notice that there are only black
    and white areas, no gray.'
  merge: -1
  img_proc: true
