    # The Colors on the Printed Page Don''t Match the Colors on My Monitor


    This version of the GIMP doesn''t include any special color calibration tools
    to set monitor color to match the printed page. Thus, color differences are bound
    to happen. If you are sending a file out to a printer for high-end printing, you
    can get around this. Just print a *proof* of a color printer, setting the printed
    colors to exactly what you want. Then, give both the file and printed proof to
    the printer, telling her to match the printed proof colors.


