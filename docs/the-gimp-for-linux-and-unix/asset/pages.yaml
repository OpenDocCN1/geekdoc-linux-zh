- pgno: 98
  md: '# Moving Selections


    If you move the mouse crosshair over the selected area right after making the
    selection, the mouse cursor changes to the Move Tool''s double-headed arrows even
    though the Move Tool has not been selected. This lets you move either the image
    contained within the selected area, creating a floating selection, or move the
    selection boundary itself.


    A floating selection is an area of an image that is unattached to any layer. To
    learn more about floating selections and what you can do with them, turn to page
    99.


    Moving the selection boundary without moving the contents is very handy for fine-tuning.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_98_0.png)


    MOVE A SELECTION BOUNDARY


    ![](img/5164bc49fb24f10213e18cc994b7b40c_98_1.png)


    # To move a selection boundary


    +   1. Create a selection using the tool of your (**Figure 62**).

    2. If you have just created the selection, position the mouse inside the boundary.
    The mouse crosshair will change to double-headed arrows.

    If you have edited the area within the selection boundary and want to move only
    the boundary, click the Move Tool in the Toolbox.

    3. Press and hold down the Ctrl and Alt keys on the keyboard.

    4. Press the left mouse button and drag the selection boundary to its new position
    (**Figure 63**).

    5. Release the mouse button, and then the Ctrl and Alt keys when you are happy
    with the boundary''s position.


    # Moving Selection Boundaries


    If you use the Move Tool to move a selection boundary and not hold down the Ctrl
    and Alt keys, the entire image will move in the image window.


    83'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Chapter 6


    # Inverting a Selection


    If you want to select a large, complex section of an image, but don''t want to
    take the time going around every corner and curve with a selection boundary, you
    can select the area you don''t want, then use the Invert command. This switches
    the selected and unselected areas.


    # To invert a selection:


    +   1. Create the selection that you want to invert (Figure 64). (In other words,
    you are selecting the area you don''t ultimately selected.)


    +   2. Right-click on the image and choose Select→vert from the pop-up menu (Figure
    65) or press Ctrl+I on the keyboard. The selected and unselected areas will switch
    (Figure 66).


    # Selecting an Entire Layer


    Using the Select All command, it''s easy to select an entire layer.


    # To select an entire layer:


    +   1. Use the Layers & Channels dialog box to set which layer is active. (This
    is the layer whose pixels will be selected. If the image has only one layer, the
    entire image will be, course, selected.)


    +   2. Right-click on an image and choose Select→All from the pop-up menu (Figure
    67) or press Ctrl+A on the keyboard. An active selection boundary will appear
    around the entire image (Figure 68).


