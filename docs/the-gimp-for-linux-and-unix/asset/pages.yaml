  md: '# Brightness and Contrast


    Like Curves and Levels, the Brightness-Contrast command adjusts the highlights,
    midtones, and shadows in an image, but in a simpler way. Instead of making adjustments
    channel by channel, Brightness-Contrast makes changes using all the pixel values
    in an image at the same time.


    > Figure 25. Right-click on the image and choose Image→→ Brightness-Contrast from
    the pop-up menu.


    # To adjust brightness and contrast:


    +   1. Use the Layers & Channels dialog box to select a layer.


    +   2. If you wish, use the selection tool of your choice to select an area of
    the image.


    3. Right-click on the image and choose Image→→ Brightness-Contrast from the pop-up
    menu (Figure 25). The Brightness-Contrast dialog box will appear (Figure 26).


    +   4. Make sure the Preview check box is selected.


    +   5. Use the Brightness and Contrast sliders to adjust the image.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_153_0.png)


    Enter a number in the corresponding text boxes of the dialog box. You can enter
    values from -127 to 127. Zero (0) represents the current values of the image.
    The higher the setting for each slider, the brighter and more contrasted the image
    will be.


    Figure 26. Use the Brightness-Contrast dialog box to adjust the brightness and
    contrast values of an image.


    > Figure 27a. The original image before adjusting brightness and contrast.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_153_1.png)


    +   6. When you are finished adjusting the brightness and contrast, click OK.
    Or click Cancel to close the Brightness-Contrast dialog box without applying any
    changes. Brightness and contrast can make quite a difference (Figures 27a-b).


    > Figure 27b. The image after brightness and contrast adjustment. Notice how the
    lights and dark are emphasized.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_153_2.png)'
