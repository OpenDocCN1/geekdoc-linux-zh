    +   2. Click Apply. The Mask Options dialog box will close and the layer mask
    will become a permanent part of the layer (Figure 38). In addition, the layer
    mask thumbnail will disappear from the layer window.


    Figure 37. Use the Layer Masks dialog box to either apply the layer mask or discard
    it.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_226_1.png)


    +   1. On the Layers tab page in the Layers & Channels dialog box, right-click
