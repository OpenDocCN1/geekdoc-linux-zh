- pgno: 316
  md: '# GLOSSARY


    # Airbrush Tool


    The Airbrush Tool paints soft-edged strokes on an image.


    # Alpha channel


    A special grayscale channel that is used to save selections. These selections
    are used to protect areas of an image from editing.


    # Antialias


    Antialiasing creates a smooth transition from a filtered (or altered) area to
    a non-filtered area.


    # Background color


    Set using color selector in the GIMP Toolbox, the background color is applied
    when the Eraser Tool is used, a selection on the Background layer is moved, or
    when an area is erased using the Clear command.


    # Bezier curve


    A curved selection segment created using the Bezier Selection Tool can be reshaped
    using its control points and levers.


    # Bezier Selection Tool


    The Bezier Selection Tool is used to select areas with bezier curves.


    # Bitmap mode


    The simplest color mode. It contains no color or shades of gray, only black and
    white.


    # Blending modes


    A blending mode changes the way a layer''s pixels blend with the pixels in the
    layer directly below it.


    # Blend Tool


    The Blend Tool is used to fill an area or selection with a gradual transition
    of two or more colors.


    # Bucket Fill Tool


    The Bucket Fill Tool is used to fill areas or selections with solid colors or
    patterns.


    # Channel


    A component of an image that contains the pixel information for an individual
    color. RGB image has three color channels while a grayscale image has one color
    channel.


    # Clone Tool


    The Clone Tool strokes color onto an image just like the'' Tool, but instead of
    painting solid colors, the Clone Tool paints part of a selected image or pattern.


    # CMYK color model


    The Cyan, Magenta, Black color model is used in high-quality offset printing.
    (Black is the "key color," hence the K initial.) CMYK is a subtractive color model,
    meaning that as colors are mixed, darker colors are created.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Appendix A


    # Color mode


    A way that color information is specified. For example, an image can be set in
    RGB mode, when converted to grayscale mode.


    # EncapsulatedPostScript (EPS)


    An image file format that is commonly used to move files from one application
    to another and also for color printing.


    # Color Picker Tool


    The Color Picker Tool selects colors in an image.


    # Eraser Tool


    The Eraser Tool erases color from an image, leaving the current background color
    in its place.


    # Color selector


    The bottom area of the GIMP Toolbox that is used to select and switch between
    the foreground and background colors.


    # Equalize


    When an image is equalized, the brightest values in the image are redistributed,
    making it brighter.


    # Composite


    An image made by combining elements from different images or photographs.


    # Feathering


    Feathering makes the transition from an altered area to an unaltered smoother.


    # Convolver Tool


    The Convolver Tool is used to blur or sharpen areas of an image.


    # File extension


    The three or four letters that come after the period in a file name.XCF is the
    GIMP''s native file format.


    # Crop Tool


    The Crop Tool cuts away part of an image, leaving only a selected area.


    # Filter


    Filters are used to apply special effects to an image or selected area.


    # Curves


    Curves adjust the tonal range of an image using a plotted curve representation
    of the image''s colors.


    # Flip Tool


    The Flip Tool is used to mirror or flip an image vertically or horizontally.


    # Dither


    When colors are limited in an indexed image, dithering simulates colors not available
    in the color palette by mixing adjacent pixels.


    # Floating Selection


    A selected area that isn''t anchored to a layer. A floating selection occurs when
    a cut or copied portion of an image is pasted or textured created.


    # Dots Per Inch (DPI)


    The unit of measure that indicates the resolution of a printer or imagesetter.


    # Foreground color


    Set using the color selector in the GIMP Toolbox, the foreground color is applied
    when painting a tool, text is created, or the Stroke command applied.


    # Desaturate


    When an image is desaturated, all color is removed, leaving a grayscale image.


    # Free-hand Selection Tool


    The Free-hand Selection Tool works just like a pencil and is used to select areas
    by clicking and dragging the mouse.


    # Elliptical Selection Tool


    The Elliptical Selection Tool is used to select round areas.


    GLOSSARY


    294'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Fuzzy Selection Tool


    # Glossary


    The Fuzzy Selection Tool creates selections using color. When a pixel is selected,
    the Fuzzy Selection Tool also selects adjacent pixels that are similar in hue
    and value.


    To exchange an image''s light values with dark values, creating an image that
    looks like a film negative.


    # Grayscale mode


    An image in grayscale mode contains no color, only varying shades of gray. There
    are 256 shades of gray from black (0) to white (255).


    # Layer


    Layers are like a clear glass window stacked on top of the other. Every new GIMP
    image starts with one layer, a special layer called the Background layer.


    # Layer mask


    A layer mask controls the way different areas of an image are revealed.


    # Guides


    Guides (also known as guidelines) are horizontal and vertical lines that are positioned
    on an image to set up areas for drawing or selection. A guide looks like a dashed
    blue line.


    # Levels


    Levels are used to make exact adjustments to an image''s tonal range by setting
    highlights, midtones, and shadows.


    # HSV color model


    The Hue, Saturation, Value color model is used in combination with the RGB color
    model in the GIMP. Hue represents the color in use, saturation represents the
    intensity of the color, and value represents the intensity of light on the color.


    # Magnify Tool


    The Magnify Tool is used to enlarge and reduce the view of an image. It doesn''t
    change the actual size of the image, only your view of it.


    # Image display area


    The area in the image window where the graphic is displayed. Also called a canvas.


    # Move Tool


    The Move Tool moves selections, layers, and guides.


    # Image window


    The area in the screen where images are created.


    # Opacity


    The density of a color in an image that ranges from transparent to opaque. In
    the GIMP, you can select an opacity for a layer or tool.


    # Indexed color model


    An indexed image contains a specific number of colors from 1 to 256.


    # Paintbrush Tool


    The Paintbrush Tool is used to paint strokes on an image.


    # Intelligent Scissors Tool


    The Intelligent Scissors Tool works with a mind of its own. After a selection
    has been drawn using the mouse, the Intelligent Scissors Tool goes to making its
    best guess as to exactly which edge is selected. Result selection is smoothly
    shaped, but can sometimes be unpredictable.


    # Pencil Tool


    The Pencil Tool draws hard-edged strokes on an image.


    # Pixels


    A unit of measure that is dependent upon the size of a computer monitor and its
    resolution setting.


    # 295'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Appendix A


    # Saturation


    # Pixels per Inch (PPI)


    A description of a color''s purity is separate from its hue or brightness. The
    less gray a color, the higher the saturation.


    The unit of measure that indicates the resolution of a digital image or a monitor.


    # Plug-in


    # Scale


    A little program that lets the user add extra features to GIMP. Much of the GIMP—except
    the core features—plug-ins that have been integrated into the GIMP program.


    Scaling an image changes both the size of the image display area and the image
    itself.


    # Point


    # Script-fu


    A unit of measure that indicates the size of text. 72 point text is 1" (2.5 cm)
    high.


    A mini-program that automates special effects containing many steps.


    # Rectangular Select Tool


    # Selection


    The Rectangular Select Tool is used to select rectangular areas. This tool works
    by clicking and dragging a selection boundary around a specific area of an image.


    An area of an image that has been isolated to restrict changes to that area. Unselected
    areas are protected from change.


    # Resize


    # Text Tool


    Resizing an image changes the size of the image display area, but not change the
    size of the image display area. If the new size of the image display area is smaller
    than the original size, any part of the image that does not fit into the image
    display area will be cropped.


    The Text Tool is used to create text in an image. When text is created it appears
    as a floating selection.


    # Threshold


    # Resolution


    When the Threshold command is applied to an image, all color or grayscale pixels
    to black and white, creating a high contrast image.


    The fineness of detail in a digital image (measured in pixels per inch (ppi)),
    a monitor (measured in ppi), or a printer (measured in dots per inch (dpi)), the
    more detailed the image. GIMP images are automatically created to 72 ppi.


    # Transform Tool


    The Transform Tool is used to rotate, scale, resize, or add perspective to images.


    # Transparency


    # RGB color model


    An area of an image where the pixels contain no color. A transparent area in an
    image is shown in the GIMP with light and dark grey checkerboard pattern.


    The Red, Green, Blue color model is used to display a color image on a computer
    monitor. RGB is an additive color model, meaning that every color can be created
    using red, green, and blue in varying degrees of brightness.


    # TrueType and Type 1 Fonts


    TrueType and Type 1 are technical standards used to create fonts. Both of these
    font types can be installed and used with the GIMP


    # Sample merged


    # Wilber


    When this option is turned on, the selected color is a blending of two or more
    layers.


    The GIMP mascot.


    GLOSSARY'
  merge: -1
  img_proc: true
