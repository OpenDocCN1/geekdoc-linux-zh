- pgno: 259
  md: '# Chapter 15


    # Layer Masks and Filters


    Using layer masks, you can apply semi-transparent textures to images.


    As you probably remember, black areas of a layer mask are transparent, white areas
    are opaque, and gray areas are semi-transparent. When you apply a filter to a
    layer mask, the black, white, and gray that the filter creates translates to an
    interesting texture. (To find out layer masks and how to use them, turn to pages
    200–206.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_259_0.png)


    # To use a layer mask to apply a texture:


    +   1. Create a new image with a white background.


    +   2. Copy and paste a picture or object into the new image (Figure 18). The
    pasted item will appear in the Layers & Channels dialog box as a floating selection
    (Figure 19).


    +   3. In the Layers & Channels dialog box, click the New Layer button. This will
    place the pasted item onto its own, transparent layer.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_259_1.png)


    +   - Posted object


    ![](img/5164bc49fb24f10213e18cc994b7b40c_259_2.png)


    > I Can''t Access Any Filters!


    If you open a filter menu and discover that the filter items are all grayed out
    and unavailable, chances your image is set in indexed color mode. To use a filter,
    you''ll need to convert the image to RGB mode (turn to pages 36–38 for details
    on color correction).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_259_3.png)


    236'
  merge: -1
  img_proc: true
