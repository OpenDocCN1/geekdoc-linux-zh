- pgno: 166
  md: '# Autocrop and Zealous Crop


    There are two other ways to crop an image in the GIMP—using the Autocrop or Zealous
    Crop commands. The Autocrop command removes excess space around an image by detecting
    pixels that contain no color variation—all white, black, or all red, for instance—then,
    cropping in pixels with color variation. Zealous crop works just like Autocrop,
    but with one difference, in addition to cropping the edges of an image, it also
    moves objects together eliminating any extra space between them.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_166_0.png)


    13a. This is the original image before the Autocrop command is chosen.


    # To apply Autocrop to an image:


    Right-click on the image and choose Image→Transforms→Autocrop from the pop-up
    menu (Figure 12). The image will be cropped (Figures 13a).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_166_1.png)


    13b. When Autocrop is chosen, the extra area around the bears is cut away.


    # To apply Zealous Crop to an image:


    Right-click on the image and choose Transforms→Zealous Crop from the pop-up menu
    (Figure 14). The image will be cropped (Figure 15).


    | File | |

    | Edit | |

    | Select | |

    | View | |

