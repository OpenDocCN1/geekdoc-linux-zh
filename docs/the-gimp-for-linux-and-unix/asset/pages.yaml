- pgno: 186
  md: "# # LAYER TECHNIQUES\n\n| File | | |\n| --- | --- | --- |\n| Edit | | |\n|\
    \ Select | | |\n| View | | |\n| Image | | |\n| Layers | | |\n| Tools | | |\n|\
    \ Filters | | |\n\n**Figure 1.** Right-click on the image and choose Layers $\r\
    ightarrow$ Channels from the pop-up menu.\n\nIn Chapter 7, A Layer Primer, you\
    \ discovered the basics of what layers are and how they work. In this chapter,\
    \ you'll learn about layers—locking them together, as well as rotating and aligning\
    \ layers. In addition, you'll find out blending modes and how to use them to create\
    \ special effects.\n\n# ## Locking Layers Together\n\nIf you have created an image\
    \ using several layers, you may want to lock them together. That way, if one of\
    \ the locked layers is moved, the entire group of layers will move, keeping the\
    \ image intact.\n\nTo lock layers together:\n\n| Layers & Channels | x |\n| Image:\
    \ grand canyon.tif-2 |\n| Layers Channels: |\n| Mode: Normal | Keep Trans |\n\
    | Opacity: 100.0 |\n| + Water |\n| Sky |\n| + Background |\n\n+   1. Right-click\
    \ on the layered image and choose Layers $\rightarrow$ Channels from the pop-up\
    \ menu (**Figure 1**). The Layers & Channels dialog box will open (**Figure 2**).\n\
    2. Position the mouse pointer over one of the eye icon of the layers you want\
    \ to lock.\n3. Click in the area between the eye icon and the layer thumbnail.\
    \ An icon that looks like the Move Tool will appear (**Figure 2**). All layers\
    \ displaying the crossed arrow icon will be locked together.\n\n**Figure 2.**\
    \ When the double-headed arrows appear, know that the layers are locked together.\n\
    \nLOCKED layers"
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Chapter 11


    # Moving Layers as a Unit


    Once layers are locked together, it''s easy to move them as one unit with the
    Move Tool.


    To move layers as a unit:


    +   1. Lock the layers together that you want to move as a unit.


    +   2. Select the Move Tool from the GIMP Toolbox.


    +   3. Position the mouse pointer over the image, press the left mouse button,
    and drag. The layers will move together.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_187_0.png)


    > Figure 3. The eye icon to hide any layers you don''t want aligned. In this figure,
    all layers are visible.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_187_1.png)


    # Types of Alignment


    There are so many options in the plug_align_layers dialog box (Figure 5) that
    it can become a bit confusing! Below are illustrations that show horizontal and
    vertical alignment work together. Not all the possibilities are listed here, but
