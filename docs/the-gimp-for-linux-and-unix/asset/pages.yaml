  md: '# Fade Out with the Paintbrush Tool


    One other interesting option available with the Paintbrush Tool is the ability
    to set the line to gradually fade out.


    To set a Paintbrush stroke to fade out:


    +   1. Double-click on the Paintbrush Tool in the GIMP Toolbox. The Tool Options
    dialog box will open (Figure 14).


    +   2. Use the Fade Out slider to set how long it takes for a brush to fade out.
    The higher the setting, the longer the brush stroke must be before the line will
    fade out. A setting of 0, disables the effect.


    +   3. Click Close to close the Tool Options dialog box. You can create interesting
    effects using fade out (Figure 15).


