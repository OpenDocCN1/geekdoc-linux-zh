- pgno: 79
  md: '# The Rectangular Select Tool


    With the Rectangular Select Tool you can select rectangular and square areas.
    This tool works by clicking and dragging a boundary or marquee around a specific
    area of an image.


    To select a rectangular area:


    +   1. Use the Layers & Channels dialog box to set which layer is active. (This
    is the layer whose pixels will selected.)


    +   2. Click the Rectangular Select Tool in the GIMP Toolbox or press R on the
    keyboard.


    +   3. Position the mouse crosshair at the upper-left corner of the area you want
    to (Figure 8).


    +   4. Press the left mouse button and drag diagonally down and to the right (Figure
    9). As you drag a rectangle will appear.


    +   5. Release the left mouse button when the entire area you want selected is
    encompassed by the rectangle. The selection will become activated and the rectangle''s
    edge will change to a moving, dashed selection boundary (Figure 10).


    # Tips


    +   Select an area that is an exact square, hold down the Shift key on the keyboard
    while dragging the mouse. Be sure to release the left mouse button first, before
    releasing the Shift key or the selection which will spring to a rectangular shape.


    +   This tool supports feathered. To learn more about this option and turn it
    on, take a look at page 62.


    +   If you are not happy with a selection, you can make a new one. When you make
    a new selection, the first one disappears.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_79_0.png)


    Figure 8. Position the mouse crosshair at the upper-left corner of the area you
    want to select.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_79_1.png)


    Figure 9. As you drag the mouse rectangle appears indicating the area that will
    be selected.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_79_2.png)


    Figure 10. When you release the mouse button, the selection becomes active and
    the edge of the rectangle changes to a dashed, moving line.'
