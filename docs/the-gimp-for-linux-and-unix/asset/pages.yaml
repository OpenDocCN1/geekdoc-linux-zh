  md: '# Chapter 8


    # Gradients and the Blend Tool


    Another way to add interesting color to an image is to use a gradient. A gradient
    is a graduated blend of two or more colors created using the Blend Tool. You can
    create gradients using just the foreground and background colors in the color
    selector, or use the Gradient Editor to create fantastic blends of color.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_139_0.png)


    # To apply a gradient:


    +   1. Use the Layers & Channels dialog box to select the layer on which you would
    like to draw. (For directions on how to do this, turn to page 92).


    +   2. Choose foreground and background colors. (For details about how to do this,
    turn to pages 42–45.).


    +   3. Use one of the selection tools to select the area you would like to fill
    (this is optional).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_139_1.png)


    +   4. Click the Blend Tool button in the Toolbox or press L on the keyboard to
    select the tool.


    +   5. Position the mouse crosshair at one side of the area you want to fill with
    a gradient (Figure 50).


    +   6. Press the left mouse button and drag. A line will appear indicating the
    direction and angle you have dragged the mouse (Figure 51).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_139_2.png)


    +   7. Release the left mouse button. A two color gradient will fill the area
    (Figure 52).


    +   * Tip


    +   * The further you drag the mouse, the smoother the transition will be from
    the foreground color to the background color.


    124'
