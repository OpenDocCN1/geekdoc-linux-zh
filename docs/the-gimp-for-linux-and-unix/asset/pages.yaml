- pgno: 122
  md: '# PAINTING LINES AND SHAPES


    In Chapter 4, Selecting Colors, you learned how to choose colors using the Picker
    Tool and color palettes. In this chapter, you''ll discover how to apply colors
    using the Pencil, Paintbrush, Airbrush, Bucket Fill, and Blend Tools (Figure 1).
    In addition to add colors, you''ll find out how to paint with patterns and gradients—a
    graduated blend of two or more colors. Painting with the GIMP is fun and easy,
    so let''s get started!


    ![](img/5164bc49fb24f10213e18cc994b7b40c_122_0.png)


    # The Pencil and Paintbrush Tools


    The Pencil and Paintbrush Tools work much like a pencil on paper or on canvas.
    Just press the left mouse button and drag to draw a line. Unlike an ordinary pencil
    or brush, though they have a few features: you can easily draw straight lines,
    and change the properties of the line that you will draw—shape, thickness, spacing,
    and opacity (Figure 2).


    Figure 2. Various strokes with the Pencil and Paintbrush Tools: ① Circle fuzzy
    (19) brush, 100% opacity; ② Circle (15) brush, 35% opacity; ③ Circle (11) brush,
    50% opacity, spacing set to 130; ④ Circle fuzzy (19) brush, 100% opacity; ⑤ Circle
    fuzzy (17) brush, 100% opacity, spacing set to 50; ⑥ Circle fuzzy (17) brush,
    out set to 70. Notice that strokes ⑦ and ⑧ are made with the same brush but different
    tools. No matter what you select, a Pencil Tool stroke will always have a sharp
    edge.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Chapter 8


    # To draw a line with the Pencil or Paintbrush Tool:


    +   1. Use the Layers & Channels dialog box to select the layer on which you would
    like to draw. (For directions on how to do this, turn to page 92).


    +   2. Choose a foreground color. (For details on how to do this, turn to pages
    42–45.)


    +   3. Select the Pencil Tool, click the Pencil Tool in the Toolbox or press Shift+P
    on the keyboard. The mouse pointer will change to a tiny pencil.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_123_0.png)


    or Select the Paintbrush Tool, click the Paintbrush button in the Toolbox or press
    P on the keyboard. The mouse pointer will change to a tiny pencil.


    +   4. In the image window, position the mouse pointer where you would like to
    start the line.


    +   5. Press the left mouse button and drag. A line will appear as you drag (Figure
    3).


    +   6. When you finished drawing, release the left mouse button (Figure 4).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_123_1.png)


    # Tips


    +   - If you want to keep the line within a specific area, use a selection tool
    to select that area.


    +   - No matter what kind of brush you select, the Pencil Tool will always draw
    a line with a clearly defined edge.


    108'
