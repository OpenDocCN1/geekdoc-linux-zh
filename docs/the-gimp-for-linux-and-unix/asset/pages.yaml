- pgno: 42
  md: '# To open an existing image:


    1. Choose File→Open in the GIMP Toolbox (Figure 28).


    or


    If you have an image window already open, right-click on the image window and
    choose File→Open from the pop-up menu (Figure 29).


    or


    Press Ctrl+O on the keyboard.


    The Load Image dialog box will appear (Figure 30).


    2. Use the Directories list to move to the directory where the file is stored.


    3. Use the Files list to select the file you want to open.


    4. Click OK. The image will appear in an image window (Figure 31).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_42_0.png)


    Figure 30. Use the Load Image dialog box to move to the directory where the file
    is stored and select it.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_42_1.png)


    Figure 31. The image file opens in an image window.


    # File Types You Can Open with the GIMP


    The GIMP can be used to open a whole kitchen sink''s worth of different file types.
    You should use the GIMP''s native file format. XCF, when you want to preserve
    layers, channels, and guides because most other file formats cannot save these
    things. Some other formats the GIMP can open include:


    +   * BMP—Windows and OS/2 bitmap format

    * GIF—Graphics Interchange Format, commonly used for Web images

    * JPEG—Joint Photographic Experts Group format, typically used for full-color
    Web images

    * PSD—Photoshop''s native file format

    * SGIX—Silicon Graphics image format'
  merge: -1
  img_proc: true
