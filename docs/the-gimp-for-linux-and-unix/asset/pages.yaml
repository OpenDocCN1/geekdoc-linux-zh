    # Help with Web Design


    The best source for advice on the Web is the Web itself. There are many sites
    on the Web that offer advice on Web page design and style. Page design isn''t
    just about pretty pictures—it includes creating user-friendly sites that make
    it easy for visitors to find the information they need. A few sites that offer
    interesting advice and tools for Web design:


    ```

    Sun Microsystem Inc''s Guide to Web Style:

    http://www.sun.com/styleguide

    ```


    ```

    Web Designer''s Paradise:

    http://desktoppublishing.com/webparadise.html

    ```


