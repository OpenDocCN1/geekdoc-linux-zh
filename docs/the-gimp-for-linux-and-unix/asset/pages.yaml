  md: '# 7


    # # A LAYER PRIMER


    When you start a new image in the GIMP, it consists of a background layer. You
    can think of it as the canvas under a painting. One or more layers can be added
    on top of the background layer. Layers are like clear glass windows stacked on
    top of the other. You can draw (or an image) on one of the glass windows, then
    set how it interacts with those below it using opacity and modes. You can edit
    an area on one layer without affecting image elements on other layers.


    Figure 1 shows an image with four layers. Each item—flowers, palette, and pencils—is
    on its own layer. The fourth layer is the background layer. These four layers
    are shown in the Layers & Channels dialog box. The layers are shown from top to
    bottom with the textured background layer (which is behind the three layers) at
    the bottom of the list. This is the stacking order.


    +   - The flowers layer on top

    - Stacking order


    | Layers & Channels |

    | Image :clip-8 |

    | Layers Channels |

    | Mode Normal | Keep Trans |

    | Opacity 100.0 |

    | flowers |

    | palette |

    | pencils |

    | Background |


    Figure 1. The Layers & Channels dialog box shows an image''s layers. In this image
    there are four layers—flowers, palette, pencils, and Background.


