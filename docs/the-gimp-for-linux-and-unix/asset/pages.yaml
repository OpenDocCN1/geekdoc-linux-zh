    # For More Information on Creating Web Pages


    Even if you know everything about HTML and coding Web sites, there''s more to
    organizing and

    designing a great Web site that meets the eye. There are many books available
    about creating

    interesting Web sites. A few helpful ones with some provocative ideas include:


    +   - Information Architecture for the World Wide Web by Louis Rosenfeld and Peter
    Morville

    (O''Reilly & Associates)


    +   - The Non-Designer''s Web Book: An Easy Guide to Creating, Designing, and
    Posting Your

    Own Site by Robin Williams and John Tollett (Peach Press)


    +   - Typography: The Best Work from the Web by Jeff Carlson, Glenn Fleishman,
    and Toby

    Malina (Rockport Publishing)


    +   - Web Design in a Nutshell: A Desktop Quick Reference by Jennifer Niederst
    (O''Reilly &

    Associates)


    +   - Web Style Guide: Basic Design Principles for Creating Web Sites by Patrick
    J. Lynch and

    Sarah Horton (Yale University Press)


    +   - Website Graphics by Noel Douglas (Thames & Hudson)'
