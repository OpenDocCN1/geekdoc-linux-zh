- pgno: 293
  md: '# Which File Format Should I Use for Web Graphics?


    Graphics Make Pages visually interesting while helping to bring across the message
    they are trying to convey. Graphics inserted into Web pages have to be saved in
    either the .gif, .jpg, or .png file format.


    The .jpg (Joint Photographic Experts) file format is ideal for photographs and
    images with depth and small color changes, such as lighting effects. When saving
    a graphic as a .jpg, you can set the graphic''s quality. The higher the quality,
    the larger the file size. Keep the quality as low as possible (without sacrificing
    too much of the image''s quality) to minimize file size.


    The .gif and .png file formats are typically used for black and white, art, line
    drawings, and index color images that contain fewer than 256 colors. The .png
    file format was created to replace the .gif format (because of patent disputes)
    and is actually an improvement over the old .gif standard. Unfortunately, only
    the latest browsers are able to read the .png format.


    # To save a graphic as a .gif file:


    +   1. Convert the image to indexed color. (See page 36 for details on how to
    do this.) If the image contains transparency, it will be layered. Do not flatten
    the image. If you do, the transparent areas of the image will be filled with the
    current background color.


    +   2. Right-click on the image and choose File→Save from the pop-up menu (Figure
    24). The Save Image dialog box will appear (Figure 25).


    +   3. Use the Directories list box to move to the directory where you want to
    save the file.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_293_0.png)


    Figure 24. Right-click on the image and choose File→ Save from the pop-up menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_293_1.png)


    Figure 25. In the Save Image dialog box, use the Directories list box to move
    to the directory where you want to store the .gif file.'
  merge: -1
  img_proc: true
