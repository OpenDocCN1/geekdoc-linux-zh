- pgno: 304
  md: '# PRINTING

    AND Output


    Graphics are stored by the GIMP as pixels, but when they are printed, graphics
    are rendered as dots. The quality of the printed page depends upon the resolution
    of the graphic and the output device. The higher the resolution, the finer and
    sharper the output will be.


    Since the GIMP was originally created as a Web graphics design program, any images
    created solely using the GIMP will only be saved with a resolution of 72 pixels
    per inch (ppi). This resolution looks fine for graphics on a computer monitor
    (because resolution is 72 ppi) (Figure 1), but when printed on a page, it will
    look pretty bad—most definition will be lost and the image will appear very pixelated
    (Figure 2). Frankly, there are a few tricks you can use to get around this. (The
    next version of the GIMP promises to have full-resolution printing capabilities—I
    can''t wait!)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_304_0.png)


    Figure 1. While a GIMP graphic looks great on a monitor...


    Figure 2. It may not look so good in print.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Chapter 18


    # Creating Images that Print Well (Get Out Your Calculator)


    If you are creating an image for printing, the 72 ppi resolution the GIMP offers
    just isn''t acceptable (**Figures 3a–f**). There''s a simple way to get around
    this right from the start.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_305_0.png)


    Before you even create a new image window, figure out the resolution that you
    will need. Printers, such as inkjets and laserjets, typically print at resolutions
    ranging from 300 to 720 dots per inch (dpi). Higher quality output devices, such
    as Verity and Linotronic imagesetters, create output with resolutions ranging
    from 1200 to 4000 dpi. So do you need? If you are creating a flyer for your office,
    300 dpi should do very well. But, if you''re creating a high-quality art poster,
    1200 dpi should be a minimum. (If you''re going to do high-end work, contact your
    printer first to find out what works best for you.)


    **Figure 3a.** This grayscale image is set at 72 dpi; its file size is 8K.


    Of course, higher resolutions make for larger file sizes. For instance, **Figure
    3b** is set at 150 dpi image and is 32K, whereas **Figure 3e** is set at 1200
    dpi and is a 2MB.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_305_1.png)


    **Figure 3b.** This grayscale image is set at 150 dpi; its file size is 32K.


    Suppose you want to create a flyer for the local garden club, printed on your
    color inkjet printer on regular 8.5" by 11" paper. Since the GIMP only creates
    images at 72 ppi, you''ll need to create a large image that will *scale down to
    300 dpi when printed*. (When a large image is scaled down while printing, all
    the pixels are squashed together, making for an image that appears sharper when
    it prints.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_305_2.png)


    **Figure 3c.** This grayscale image is set at 300 dpi; its file size is 127K.


    To create the garden club flyer you''ll need to multiply the width and height
    of the printed image by the resolution (expressed in dpi) that you want to use:


    paper width x resolution (dpi) = GIMP image width


    paper height x resolution (dpi) = GIMP image height


    282'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Printing and Output


    So, to create a flyer that is 8.5" by 11" and prints at 300 dpi, you would need
    to create an image that is 2500 pixels wide by 3300 pixels high because:


    8.5" x 300 dpi = 2550 pixels


    11" x 300 dpi = 3300 pixels


    Even though a 2500 by 3300 pixel image is quite large, the GIMP (thankfully) adjusts
    the image window size so it is never larger than your computer screen.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_306_0.png)


    3d. This grayscale image is set at 600 dpi; its file size is 505K.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_306_1.png)


    3e. This grayscale image is set at 1200 dpi; its file size is 2MB.


    # I''ve Created My Image Using These Calculations—Now What?


    After figuring out the size of the GIMP image and creating it using the width
    and height dimensions based on image resolution, you''ll want to print it at the
    correct resolution (of course)! Use the following steps to print your image:


    +   * Select your printer using the Printer drop-down list as described in step
    2 on page 285.

    * Select the printer you are going to use following the steps on page 286.

    * Set page size and paper orientation using the instructions on page 287.

    * Set printer resolution (if your printer supports this feature) as described
    on page 288.

    * Scale the image down to the resolution you calculated following the directions
    on page 288. Select the PPI radio button and set the Scale slider to the resolution
    calculated.

    * Print your image (see page 285)—if you''re creating the print yourself or generate
    a .ps or .eps file for a service bureau or commercial printer (see page 291).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_306_2.png)


    3f. This grayscale image is set at 2400 dpi; its file size is 8MB.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_306_3.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Wait! I''ve Already Created an Image!


    But, what happens if you''ve already created an image and want to print it at
    a higher resolution? You can scale the image a bit (doubling image size will make
    the image fuzzy, choppy), using cubic interpolation. The GIMP will compare adjacent
    pixel colors and fill in the gaps with pixels that are a blend of the adjacent
    colors.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_307_0.png)


    Figure 4. Right-click on the image and choose File->Preferences from the pop-up
    menu.


    # To scale an image using cubic interpolation:


    +   1. Open the image you want to scale up.


    +   2. Right-click on the image and choose File->Preferences from the pop-up menu
    (**Figure 4**). The Preferences dialog box will open with the Display tab in front
    (**Figure 5**).


    +   3. Select the Cubic interpolation check button, then click OK to close the
    Preferences dialog box.


    +   4. Right-click on the image and choose Image->Scale from the pop-up menu (**Figure
    6**). The Image Scale dialog box will open (**Figure 7**).


    +   5. Make sure the Constrain Ratio check button is selected. This will keep
    the width and height scaling proportionally the same.


    +   6. Enter the new width and height (in pixels) in the New width and New text
    boxes.


    +   7. Click OK. The Image Scale dialog box will close and the image will scale
    up to its new size (it will take a few seconds depending on the speed of your
    computer).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_307_1.png)


    Figure 5. In the Preferences dialog box, select the Cubic interpolation check
    button, then click OK.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_307_2.png)


    Figure 6. Right-click on the image and choose Image->Scale from the pop-up menu.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Printing an Image


    Once you''ve created an image, as you''ll probably want to print it for proofing
    or as final output. You should know however, that if your image contains more
    than one layer, only the active layer will be printed. To print an image, you''ll
    need to flatten it first (turn to page 106 for directions).


    # To print an image:


    +   - Right-click on the image and choose File→Print from the pop-up menu (Figure
    8). The print dialog box will open (Figure 9).


    +   - Use the Printer drop-down list to select your printer. Most likely this
    is lp, lp0, or lp1.


    +   - Use the Output Type buttons to select whether the image will be printed
    in black and white or color.


    +   - Click Print. The Print dialog box will close and the image will print.


    # Tips


    +   - Once you set various printer options, they will be set up and ready to go
    every time you print. You should know, however, that the options you set aren''t
    permanent. If you exit the GIMP, restart it, the options in the Print dialog box
    will return to the default settings.


    +   - To print an image to a file, use the Printer drop-down list in step 2 to
    select File, then continue setting the various printer options.


    +   - In case you were wondering when you select your printer in step 2, lp stands
    for the port that the printer is connected to. If you have more than one printer,
    it will be sequentially numbered, lp, lp0, lp1, etc.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_308_0.png)


    Figure 8. Right-click on the image and choose File→Print from the pop-up menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_308_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_308_2.png)


    Figure 9. Use the Print dialog box to set printing options.


    285'
  merge: -1
