- pgno: 254
  md: '# USING FILTERS


    A-mong the many tools and features that the GIMP has to offer, filters are (in
    my mind) possibly the coolest of the most all. Filters can quickly add subtle
    effects or the most amazing distortions. For instance, you can apply artistic
    effects that make an image look like it''s been painted with oils or created with
    mosaic tiles. You can use the Blur or Sharpen filters to subtly retouch an image.
    Apply distortion filters to make an image look like it''s been engraved or embossed.
    Any number of filter effects can be combined using layers, layer masks, and alpha
    channels.


    # The Way Filters Work


    Filters can be applied to an entire layer or a selection on a layer. If you are
    using a selection, you can create a smoother transition between the filtered and
    non-filtered area by feathering the selection before applying the filter. (To
    out how to feather a selection, turn to page 82.)


    All of the filters work in basically the same way: you select the filter''s menu
    item and a dialog box opens, then you set the options, click OK, and the filter
    goes to work. Starting on page 239 is a guide to many of the GIMP filters, showing
    what they can do.


    # Play It Again, Sam...


    If you need to apply a filter more than once to the same selection or different
    images, right-click on image and choose Filters→Repeat list from the pop-up menu
    or press Alt+F on the keyboard. To view the last filter dialog box that you used,
    right-click on the image and choose Filters→Re-show last from the pop-up menu
    or press Shift+Alt+F on the keyboard.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Chapter 15


    # Using Filters


    There are so many effects you can create using filters! This section will take
    you, step-by-step, by applying several filters and techniques that you can use
    to create interesting effects. That should give you a good idea of how filters
    work (since they all work in basically the same way). The next section, which
    starts on page 239, is a guide to many of the GIMP filters, showing how each affects
    an image.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_255_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_255_1.png)


    # To make a layer or selection look like it''s an oil painting:


    +   1. Use the Layers & Channels dialog box to select the layer that you want
    to make like an oil painting (**Figure 1**).

    and or/

    Use a selection tool of your choice to select an area that you want to make like
    an oil painting.

    2. Right-click on the image and choose Filters -> Artistic -> Oilify from the
    pop-up menu (**Figure 2**). The Oilify dialog box will appear (**Figure 3**).

    3. Use the Mask Size slider to set the size of the "paintbrush" used to create
    the oil painting. The higher the setting, the larger the brush.

    4. Select the intensity algorithm button if you want the filter to enhance the
    image''s colors.

    5. Click OK. The Oilify dialog box will close and the filter will be applied to
    the layer or selection, making it look like an oil painting (**Figure 4**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_255_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_255_3.png)


    232'
