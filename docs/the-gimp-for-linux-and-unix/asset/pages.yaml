- pgno: 190
  md: '# Rotating Layers


    There are two ways to rotate layers—you can use the Transform Tool or the Rotate
    command. While the Transform Tool will rotate a layer to any degree, the Rotate
    command will only rotate to 90 or 270 degrees. Turn to page 154 for directions
    on how to rotate a layer using the Transform Tool.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_190_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_190_1.png)


    # To rotate a layer using the Rotate command:


    +   1. Use the Layers & Channels dialog box to select which layer will be rotated
    (for directions about how to do this, turn to page 92).


    +   2. Right-click on the image and choose Image→Transforms→ Layer. The Layer
    menu will open (Figure 9).


    +   3. Choose either the Rotate 270 or Rotate 90 menu item. The layer will rotate
    (Figures 10a–b).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_190_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_190_3.png)


    # Transforming Layers


    Any of the transformations discussed in Chapter 10, Transform Your Art–such as
    scaling, shearing, and adding perspective—can be applied to individual layers.
    Chapter 10 starts on page 147.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Chapter 11


    # Erasing Part of a Layer


    The Eraser Tool works like the Pencil and Paintbrush Tools—you just click and
    drag. Instead of adding color though, the Eraser Tool removes it, leaving behind
    the current background color (if the erasure happens on the Background layer)
    or transparency (if the erasure is on a transparent layer). In addition, you can
    select the shape and size of the eraser stroke, its opacity, and spacing using
    the Brush Selection dialog box (just like the Pencil and Paintbrush Tools).


    To erase part of a layer:


    +   1. Use the Layers & Channels dialog box to select which layer will be rotated
    (for directions about how to do this, turn to page 92).


    and/or

    Use one of the selection tools to restrict the area that will be erased (**Figure
    11**).


    +   2. Click the Eraser Tool in the GIMP Toolbox or press Shift+E on the keyboard
    to select it. The mouse pointer will change to a small pencil.


    +   3. Position the mouse pointer over the area you want to erase.


    +   4. Press the left mouse button and drag. The area that passes under the mouse
    pointer will be erased (**Figure 12**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_191_0.png)


    Figure 11. If you wish, you can select an area in order to restrict the erasing.
    In this image, the rocky area above the kayaks has been selected.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_191_1.png)


    Figure 12. As the mouse is dragged, the area is erased. In this figure the Circle
    (17) brush was selected, creating the thick, clean erasure.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_191_2.png)


    Figure 13. In the Tool Options dialog box, select the Hard edge and/or Incremental
    check boxes.


    168'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Tips


    +   To change the shape, size, and opacity of the erasure, change the Brush Selection
    dialog box settings as described on pages 100–111.


    +   You can use the Eraser Tool to erase straight lines just as you would draw
    a straight line using the Pencil or Paintbrush Tool. For directions about how
    to do this, take a look at page 109.


    +   When changing the size and shape of an erasure using the Brush Selection dialog
    box, you may have noticed that there is a Mode drop-down list available in the
    dialog. This drop-down list lets you set blending modes. To learn more about these
    modes, turn to pages 170–173.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_192_0.png)


    Figure 14b. In the Tool Options dialog box, you can access blending modes using
    the Mode drop-down list.


    # Eraser Tool Options


    There are two options that you can select to change the effect of the Eraser Tool
    (Figure 13):


    +   Hard edge removes any fuzzy edge, no matter which brush is selected.


    +   Incremental sets the eraser stroke to become more permanent when strokes cross.
    This option only works when the brush opacity is less than 100% in the Brush Selection
    dialog box.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_192_1.png)


    # To set Eraser Tool Options:


    +   1. Double-click on the Eraser Tool in the GIMP Toolbox. The Options dialog
    box will open (Figure 13).


    +   2. Select the Hard edge and/or Incremental buttons.


    +   3. Click Close.'
