    in the directory (Figure 15).


    Figure 15. Enter typelist, then press Enter on the keyboard to create new fonts.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_236_1.png)


    19. Type mkfontdir at the command prompt, then press Enter on the keyboard. The
    mkfontdir program will create a list of the fonts and save it in the directory.


    Figure 16. Use the xset +fp command to tell the X server where the Type 1 fonts
    are.


    20. Type exit at the command prompt, then press Enter on the keyboard. This will
    log you off and return you to your regular login.


    21. Type xset +fp YourDirectory at the command prompt, then press Enter on the
    keyboard (Figure 16). Substitute the full path of the directory where your fonts
    are stored for YourDirectory. In this example, xset +fp /home/phyllsid/fonts is
    typed server now knows about the fonts and where to find them. Launch the GIMP
    and use the Text Tool to see your new fonts (Figure 17).


    # Tips


    +   - If you log out or shut down your computer, you will need to perform steps
    17–21 again to access the Type 1 fonts.

    - Special thanks to James Macnol for creating the typelist program!


