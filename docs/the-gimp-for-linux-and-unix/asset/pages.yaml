- pgno: 149
  md: '# Chapter 9


    # Color Balance


    When adjusting individual color elements in an image, it''s important to remember
    that each color adjustment affects the overall balance of an image. The Color
    Balance command is used to change the color mixture in an image. This tool uses
    a generalized color correction, creating subtle changes in color.


    # To adjust color balance:


    +   1. Use the Layers & Channels dialog box to select a layer. (For details about
    how to do this, turn to page 92).


    +   2. If you wish, use the selection tool of your choice to select an area of
    the image. (For directions on how to use the selection tools, turn to Chapter
    6, Making Selections.)


    +   3. Right-click on the image and choose Image→Colors→Color Balance from the
    pop-up menu (Figure 14). The Color Balance dialog box will appear (Figure 15).


    +   4. Make sure the Preview check button next to the color is selected.


    +   5. Select the radio button next to the color tone you would like to adjust:
    Shadows, Midtones, or Highlights (Figure 16).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_149_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_149_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_149_2.png)


