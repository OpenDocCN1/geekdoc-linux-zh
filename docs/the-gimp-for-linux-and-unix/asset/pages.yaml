- pgno: 26
  md: '# The Basics


    # Special GIMP Dialog Boxes


    There are seven special GIMP dialog boxes that are used for image editing (Figures
    16–22). To open one of these dialog boxes, choose File→Dialogs in the GIMP Toolbox
    or right-click on an image window and choose Dialogs from the pop-up menu. (The
    Indexed Palette dialog box is only available on the pop-up menu.) If you are working
    with several dialog boxes at once, you can maximize screen real by double-clicking
    a dialog box that is not in use—just double-click the dialog box''s Title Bar.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_26_0.png)


    Brush Selection dialog box (Figure 16)

    Use the Selection dialog box to select preset or custom brushes for use with a
    painting or editing tool. You can also use the Brush Selection dialog box to set
    a blending mode, opacity, and stroke spacing. To find out more about the Brush
    Selection dialog box, turn to page 110.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_26_1.png)


    Color Palette dialog box (Figure 17)

    The Color Palette dialog box lets you select colors from predefined palettes.
    These colors are applied using a painting or editing tool, or using a command
    as Stroke or Fill. You can also use the Color Palette dialog box to edit existing
    palettes and colors, and create new palettes. To learn more about the Color Palette
    dialog box and how to use it, turn to page 47.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_26_2.png)


    Gradient Editor dialog box (Figure 18)

    The Gradient Editor dialog box works in conjunction with the Blend Tool. Using
    the Gradient Editor dialog box, you can select from the extensive list of gradients,
    edit or create a new one. Turn to page 127 to find out more about the Gradient
    Editor dialog box.


    11'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Chapter 1


    Indexed Color Palette dialog box (Figure 19)

    The Indexed Color Palette dialog box is similar to the Color Palette dialog box
    in that it shows a color palette and let you edit existing layers. But, where
    the similarity ends. This color palette is composed of the colors in an open image
    set in indexed color mode. It is a temporary palette that is only available while
    the image is open. To find out more about the Indexed Color Palette, turn to page
    51.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_27_0.png)


    SPECIAL DIALOG BOXES


    Layers & Channels dialog box (Figure 20)

    The Layers & Channels dialog box is used to display the layers and channels that
    make up an image. Using this dialog box, you can create, duplicate, and delete
    layers and channels. In addition, you can move layers and channels up or down
    in the stacking order and anchor floating layers.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_27_1.png)


    By default, when you create a new image, it will have one layer called the Background
    layer. The number of channels an image has depends on the color mode the image
    is set in. (An RGB image has three channels and an indexed, grayscale, or bitmap
    image has one channel).


    You can edit each layer separately without changing the other layers and set a
    blending mode and opacity for each layer. The active layer is highlighted. The
    eye icon indicates a visible layer. Take a look at page 92 to learn more about
    this dialog box.


    12'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# The Basics


    ![](img/5164bc49fb24f10213e18cc994b7b40c_28_0.png)


    Pattern Selection dialog box (Figure 21)

    The Pattern Selection dialog box contains many preloaded patterns. These patterns
    are used in conjunction with the Bucket Fill Tool to fill areas with the selected
    pattern. To find out how to use the Pattern Selection dialog box turn to pages
    121–122.


    SPECIAL DIALOG BOXES


    ![](img/5164bc49fb24f10213e18cc994b7b40c_28_1.png)


    Tool Options dialog box (Figure 22)

    The contents of this dialog box change depending upon which tool is selected in
    the GIMP Toolbox. Access this dialog box by double-clicking on a tool button in
    the Toolbox or by choosing the menu item in the File→Dialogs menu in the GIMP
    Toolbox or by right-clicking and choosing the Dialogs menu item from the pop-up
    menu. The Tool Options dialog box can be seen in its various permutations on pages
    63, 68, 74, 75, 116, 118, 126, 152, 154, 188, and 189.


    13'
