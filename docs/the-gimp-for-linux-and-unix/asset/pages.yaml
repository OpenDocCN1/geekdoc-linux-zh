    ![](img/5164bc49fb24f10213e18cc994b7b40c_287_2.png)


    Figure 9. Use the Color Selection dialog box to set a new color (turn to page
    42 for details).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_287_3.png)


    Figure 10. The edited color square changes color.


