- pgno: 331
  md: '# THE GIMP FOR LINUX & UNIX


    Need to learn the GIMP fast?

    Try a Visual QuickStart!


    +   - Takes an easy, visual approach to teaching the G Image Manipulation Program,
    using pictures to guide you through the software and show you what to do.


    +   - Works like a reference book—you look up what you need and then get straight
    to work.


    +   - No long-winded passages—concise, straightforward commentary explains what
    you need to know.


    +   - Companion Web site at www.peachpit.com/vqs/gimp/ offers updates and resources.


    +   - Phyllis Davis is a writer, graphics and Web designer, teacher, and software
    developer. Some of her writing credits include Visual QuickStart Guides on WordPerfect
    8 for Linux, FrontPage, and CoreDRAW, as well as Peter Norton''s Guide to Visual
    Basic. When she''s not writing and designing books or creating Web sites, Phyllis
    can be found developing and teaching computer courses, digging in her garden,
    tap dancing, and with her wonderful little boy, Julian.


