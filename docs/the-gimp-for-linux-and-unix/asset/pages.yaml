  md: '# Chapter 7


    # Changing the Stacking Order


    The layers shown on the Layers tab page in the Layers & Channels dialog box are
    positioned one on top of the other in a stacking order. The uppermost layer in
    the layer window is the layer on top in the image window (Figure 27). The lowermost
    layer (usually the background layer) is on the bottom. You can change how the
    layers are stacked, moving them up or down the pile. (The background layer always
    remains on the bottom.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_117_0.png)


    # To move a layer in the stacking order:


    +   1. Open the Layers & Channels dialog box by right clicking on the image and
    choosing Layers→ Channels from the pop-up menu (Figure 3). The layer will appear
    in the image window stacked from top to bottom. Notice how this stacking corresponds
    to the overlapping layers in the image window (Figure 27).

    2. Highlight the layer you want to move up in the stacking order (Figure 27).

    3. Click the Raise Layer button at the bottom left of the dialog box.


    Right-click on the layer''s name and choose Raise Layer from the pop-up menu (Figure
    28).


    Press Ctrl+F on the keyboard.

    The layer will move up the list and move forward in the image window (Figure 29).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_117_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_117_2.png)


    MOVE A LAYER UP THE STACKING ORDER


    Figure 28. In the layer window, right-click on the layer you want to move and
    choose Raise Layer from the pop-up menu.


    102'
  merge: -1
  img_proc: true
