- pgno: 80
  md: '# The Elliptical Selection Tool


    The Elliptical Selection Tool works just like the Rectangular Select Tool—click
    and drag.


    To select an elliptical area:


    +   1. Use the Layers & Channels dialog box to set which layer is active. (This
    is the layer whose pixels will be selected).


    +   2. Click the Elliptical Selection Tool in the GIMP Toolbox or press E on the
    keyboard.


    +   4. Press the left mouse button and drag diagonally down and to the right (**Figure
    12**). As you drag an ellipse it will appear.


    +   5. Release the left mouse button when the area you want is encompassed by
    the ellipse. The selection will become activated and the ellipse''s edge will
    change to a moving, dashed selection boundary (**Figure 13**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_80_0.png)


    **Figure 11.** Position the mouse crosshair at the upper-left corner of the area
    you want to select.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_80_1.png)


    **Figure 12.** As you drag the mouse an ellipse appears indicating the area that
    will be selected.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_80_2.png)


    **Figure 13.** When you release the mouse button, the selection becomes active
    and the edge of the ellipse changes to a dashed, moving line.


    # ✓ Tips


    +   To select an area that is an exact circle, hold down the Shift key on the
    keyboard while dragging the mouse. Be sure to release the left mouse button first,
    before releasing the Shift key or the selection will spring to an elliptical shape.


    +   This tool supports antialiasing and feathering. To learn more about these
    options and turn them on, take a look at page 62.


    +   You can add, to subtract, from or intersect a selection. For details about
    how to turn this to pages 77–79.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_80_3.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Chapter 6


    # # The Free-hand Selection Tool


    The Free-hand Selection Tool (also called the lasso) works like a pencil on paper.
    As you press the mouse and drag, a selection boundary appears. Wherever you stop
    dragging and release the mouse, the GIMP will automatically close the boundary
    you have drawn, creating a closed selection area.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_81_0.png)


    **Figure 14.** Position the mouse crosshair where you would like the selection
    to start.


    # To create a freehand selection:


    +   - Use the Layers & Channels dialog box to set which layer is active. (This
    is the layer whose pixels will be selected.)


    +   - Click the Free-hand Selection Tool in the Toolbox or press F on the keyboard.


    +   - Position the mouse crosshair where you would like to start the selection
    (Figure 14).


    +   - Press the left mouse button and drag. As you drag, a selection boundary
    will appear (Figure 15).


    +   - When you have encompassed the area you want to select, release the left
    mouse button. The GIMP will automatically close the selection boundary and it
    will become active (Figure 16).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_81_1.png)


    **Figure 15.** Press the left mouse button and drag to create the selection.


    # ✓ Tips


    +   - This tool supports antialiasing and feathering. To learn more about these
    options and turn them on, take a look at page 62.


    +   - You can add, subtract from, or intersect a selection. For details about
    how to do this turn to pages 77–79.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_81_2.png)


    **Figure 16.** When you release the left mouse button, the selection is activated.


    66'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# The Fuzzy Selection Tool


    The Fuzzy Selection Tool creates a selection using color. When you click on a
    pixel in an image, any touching or adjacent pixels are similar in hue and value
    to that pixel are selected. This tool can be useful for selecting areas filled
    with one color, as backgrounds. The Fuzzy Selection Tool supports the feather
    and antialias options, as well as a Sample Merged option. When Sample Merged is
    turned on, the colors created by the blending of two or more layers are selected.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_82_0.png)


    Figure 17. Position the mouse crosshair over the pixel containing the color you
    want to zoom in. (You may need to see the exact pixel).


    # To select an area using the Fuzzy Selection Tool:


    +   1. Use the Layers & Channels dialog box to set which layer is active. (This
    is the layer whose pixels will be selected). If you turn the Sample Merged option
    on, the blended color from all layers will be used to create the selection. (The
    Sample Merged option is described on page 68).

    2. Click the Fuzzy Selection Tool in the Toolbox or press Z on the keyboard.

    3. Position the mouse crosshair over the color you want to select (you may need
    to zoom in to select an exact pixel (Figure 17)).

    4. Click the area surrounding colors similar to the pixel you clicked on will
    be selected (Figure 18).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_82_1.png)


    Figure 18. When you click, the area containing colored pixels is selected.


    # Tip


    +   - To select a wider range of colors, don''t click in step 4. Instead, press
    the left mouse button and drag the mouse crosshair over all the colors you want
    to select, then release the mouse.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Chapter 6


    # To turn on the Sample Merged option:


    +   1. In the GIMP Toolbox, double-click on the Fuzzy Selection Tool. The Tool
    Options dialog box will open, displaying the Fuzzy Selection Tool options (19).


    +   2. Select the Sample Merged check button.


    +   3. Click Close. The Tool Options dialog box will close.


    # Tip


    +   The Sample Merged option will remain until its check button is unselected.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_83_0.png)


    **Figure 19.** Choose the Sample Merged check button, then click Close.


    > If You Make a Mistake, Don''t Panic!

    ### If You Make a Mistake, Don''t Panic!

    If you select and edit an area you didn''t mean to or deactivate a selection before
    you meant to, don''t worry! Just press Ctrl+Z on the keyboard or right click on
    the image and choose Edit→Undo from the pop-up menu to undo the change. (Remember,
    by default, you can undo up to five actions. To find out how to change the default
    number of undo actions, turn to page 14.)


    > Who was Bézier Anyhow?

    ### Who was Bézier Anyhow?


    ### Who was Bézier Anyhow?

    The Bezier curve–the curve representation used most frequently in computer graphics—is
    named after Pierre Bézier, a French engineer who worked for the car manufacturer
    Renault. In the 1960s, in an attempt to draw car parts, he developed the mathematical
    equations that represent a curve geometrically.


    68'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# The Bezier Selection Tool


    The Bezier Selection Tool creates selections using control points, levers, and
    handles (Figure 20). The handles determine the curvature of segments of the selection
    boundary. The levers are just a visual representation of which handle goes with
    which control point.


    With the Bezier Selection Tool, you can create straight selection segments and
    curvy segments. After you have created a bezier selection, you can edit it, using
    the control points and handles to change the shape of the selection segments.


    When creating a selection with the Bezier Selection Tool, it''s easiest to use
    the following steps:


    +   - Create a basic, straight segment selection;

    - Move any control points that are out of place; and then

    - Edit the control points to add curves and sharp bends.


    To create the basic, straight segment selection:


    +   1. Use the Layers & Channels dialog box to set which layer is active. (This
    is the layer whose pixels will be selected.)

    2. Click the Bezier Selection Tool in the Toolbox or press B on the keyboard.

    3. Position the mouse crosshair over image where you would like the first segment
    to start.

    4. Click. A circular control point will appear where you clicked (Figure 21).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_84_0.png)


    Figure 20. The control points and handles control the shape of a bezier selection
    boundary. In this figure, a bezier selection boundary has been shaped around the
    outer edge of the jabbitrack.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_84_1.png)


    Figure 21. A circular control point appears where you click the mouse.


    # Closing an Image while a Selection is Active


    If you are working on an image saved in the native GIMP file format, xcf, and
    close it while a selection is active, that selection will still be active and
    available the next time you open the file.


    (continued)'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Chapter 6


    +   5. Move the mouse crosshair to a new position and click again. A second control
    point will appear where you clicked and a straight selection boundary segment
    will appear between the two control points (Figure 22).


    +   6. Repeat step 5 until you have created a basic, straight segment selection
    around the area you want to select (Figure 23). If a control point is not in the
    correct position, don''t worry! You can move it using the following directions.


    +   ✓ Tip


    +   - Take care when placing control points. While you can move them, you can''t
    add or delete them.


    To move a control point:


    +   1. Position the mouse crosshair over the control point you want to move.


    +   2. Press and hold down the Ctrl key on the keyboard.


    +   3. Press the left mouse button and drag the control point to a new position.


    +   4. When the control point is in the correct position, release both the mouse
    button and the Ctrl key on the keyboard. Now that you have created the basic outline,
    it''s time to add some curves and sharp bends to the bezier selection.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_85_0.png)


    Figure 22. When you click, a second control point appears under the mouse crosshair
    and a selection boundary segment appears, joining the two control points.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_85_1.png)


    Figure 23. Continue adding control points until the entire area is encompassed
    by selection boundary segments.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_85_2.png)


    Figure 24. When you press the left mouse button and drag, the selection boundary
    segment becomes curved and two handles appear.'
  merge: -1
