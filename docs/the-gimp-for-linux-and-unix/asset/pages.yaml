  img_proc: true
- pgno: 21
  md: '# Chapter 1


    # The GIMP Toolbox (Figure 2)


    The GIMP Toolbox is the first (and only) thing you''ll see when you launch the
    GIMP. (To create or open an image, use the File menu in the GIMP Toolbox.) The
    21 tools in the Toolbox are used to manipulate a graphic in various ways. If you
    use other graphics programs, the Toolbox works just as you would expect: click
    the tool button to select the tool. To access the options for a tool, double-click
    on the tool button.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_21_0.png)'
