- pgno: 225
  md: '# Chapter 13


    # To edit a layer mask:


    +   1. On the Layers tab page in the Layers & Channels dialog box, click the layer
    mask thumbnail to make it active.


    +   2. Select any painting or editing tool.


    +   3. If you selected a painting tool, use the Brush Selection dialog box to
    select a brush.


    +   4. To hide the layer, paint the mask with black (the result of painting black
    onto a layer mask is shown in **Figure 33**).


    and/or


    To reveal the layer, paint the mask with white (the result of painting white onto
    a layer mask is shown in **Figure 34**).


    and/or


    To make the layer semi-transparent, paint the mask with gray (the result of painting
    gray onto a layer mask is shown in **Figure 35**). (The darker the gray, the more
    transparent the layer will be.)


    # Tips


    +   To edit the layer instead of the layer mask, click the layer''s thumbnail
    on the Layers tab page.


    +   Try editing a layer mask by adding a gradient with the Blend Tool. Turn to
    205 for directions.


    # To view/hide the effects of a layer mask:


    Hold down the Ctrl key on the keyboard and click the layer mask thumbnail on the
    Layers tab page in the Layers & Channels dialog box. When the layer mask effects
    are hidden, a red outline will appear around the layer mask thumbnail and the
    layer mask''s effects will disappear from the image.


    202


    ![](img/5164bc49fb24f10213e18cc994b7b40c_225_0.png)


    **Figure 33.** Paint the mask with black to hide the layer. Notice that only the
    portion of the layer mask that is white still shows the layer underneath.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_225_1.png)


    **Figure 34.** Paint the mask with white to reveal the layer. Notice that the
    portion of the layer mask that is still black hides the layer underneath.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_225_2.png)


    **Figure 35.** Paint the mask with gray to make the layer semi-transparent. Notice
    that the portion of the layer mask that is white leaves the layer underneath completely
    visible.'
