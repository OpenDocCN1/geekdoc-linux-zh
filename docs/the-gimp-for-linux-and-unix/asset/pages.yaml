    currently selected gradient to color the page curl of the currently selected foreground
    and background colors (Turn to page 127 to find out how to set the current gradient).


    +   7. Use the Curl opacity slider to set the transparency of the page curl. The
    lower the setting, more transparent the page curl will be.


