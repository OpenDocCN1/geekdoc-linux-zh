  md: '# Scaling and Resizing Layers


    Scaling and resizing each change the size of a layer but with different consequences.
    Scaling changes both the size of a layer and its contents. Resizing changes the
    size of the layer, but does not alter the contents.


    To scale a layer:


    +   1. Open the Layers & Channels dialog box by right-clicking on the image and
    choosing Layers→Layers & Channels from the pop-up menu (Figure 3).


    +   2. Right-click on the name of the layer you want to scale and choose Scale
    Layer from the pop-up menu (Figure 13).


    or Highlight the layer you want to scale, then press Ctrl+S on the keyboard.


    The Scale Layer dialog box will open (Figure 14).


    +   3. Use the New width and New height text boxes to enter the layer''s new dimensions
    in pixels. If the Constrain Ratio check button is selected, the horizontal and
    vertical proportions of the layer will remain the same.


    +   4. Click OK. The Scale Layer dialog box will close and the layer will scale
    to its new size.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_111_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_111_1.png)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# A Layer Primer


    # To resize a layer:


    +   1. Open the Layers & Channels dialog box by right clicking on the image and
    choosing Layers→Layers & Channels from the pop-up menu (Figure 3).


    +   2. Right-click on the name of the layer you want to resize and choose Resize
    Layer from the pop-up menu (Figure 15).


    Highlight the layer you want to scale, then press Ctrl+R on the keyboard.


    The Resize Layer dialog box will open (Figure 16).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_112_0.png)


    +   3. Use the New width and Height text boxes to enter the layer''s new dimensions
    in pixels. If the Constrain Ratio check is selected, the horizontal and vertical
    proportions of the layer will remain the same.


    +   4. If the layer''s new size will be smaller than it originally was, you can
    set where the newly sized Y offset will be positioned using the X and Y Offset
    boxes or view the preview window (Figure 17). Enter pixel amounts in the text
    boxes or position the mouse pointer over the original layer rectangle, press the
    left button, and drag the rectangle to a new position.


    Figure 16. Use the New width and Height text boxes to set the layer''s size in
    pixels. If the Constrain Ratio check is selected, the width and height remain
    proportionally.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_112_1.png)


    +   5. Click OK. The Resize Layer dialog box will close and the layer will resize.


    > Tip


    +   If the layer''s contents are bigger than the layer''s new size, the contents
    will be cropped to fit the new size.


