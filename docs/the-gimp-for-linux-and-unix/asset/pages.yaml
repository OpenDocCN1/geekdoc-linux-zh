    # To draw a straight line with the Airbrush Tool:


    +   - Use the Layers & Channels dialog box to select the layer on you would like
    to draw.


    +   - Choose a foreground color.


    +   - Click the Airbrush Tool in the Toolbox or press A on the keyboard. The mouse
    pointer will change to a tiny pencil.


    +   - In the image window, position the mouse pointer where the line will start.


    +   - Click a fuzzy dot will appear under the mouse pointer (Figure 30).


    +   - Press and hold down the Shift key.


    +   - Move the mouse pointer to where you want the line to end and click. A straight
    line will appear between the two points you clicked (Figure 31).


    +   - To add another straight line to the one you just drew, continue holding
    down the Shift key, and then move the mouse pointer to a new position and click.
    A second segment will appear attached to the first.


    +   - Continue adding lines or release the Shift key to draw a new line (Figure
    32).


    Figure 31. Move the mouse pointer to a new position and click again. A straight
    line appears between the two points.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_132_0.png)


    Figure 32. Continue down the Shift key to add straight lines to the original one.


    # Tips


    +   - If you want the line to be darker just move the mouse slower as you drag.


    +   - The shape, size, and opacity of a line created by the Airbrush Tool can
    be changed using the Brush Selection dialog box. For directions on changing brush
    properties, turn to page 110.


