  md: 'Figure 47. Use the Script-Fu dialog box to set the pattern''s variables.


    # A Quick Way to Make Patterns


    There are some amazing tools that come with the GIMP! Open the Xns→Script-Fu→Patterns
    on the Toolbox (Figure 46) and you will find nine mini-programs (called script-fus)
    that will quickly create seamless patterns.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_138_0.png)


    # To create a pattern:


    +   1. In the GIMP Toolbox, choose Xns→Script-Fu→Patterns (Figure 46). The Patterns
    menu will open.

    2. Choose one of the mini-programs listed on the Patterns menu. For this example,
    3D Truchet is chosen. A Script-Fu dialog box for the mini-program will appear
    (Figure 47).

    3. Use the text boxes and drop-down lists to set the effect you would like to
    create. (To start, don''t change anything, just leave the default settings).

    4. Click OK. The mini-program will run. When it is finished, an amazing pattern
    will appear in a new image window (Figure 48). Try out all the pattern mini-programs.
    It''s amazing that you can create with just a few clicks (Figures 49a–d!)


