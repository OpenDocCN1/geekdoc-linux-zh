- pgno: 131
  md: '# Chapter 8


    # The Airbrush Tool


    The Airbrush Tool works in a similar fashion to the Pencil and Paintbrush Tools—to
    draw a line, just click and drag: to draw lines, hold down the Shift key while
    clicking. What''s really neat about the Airbrush Tool is that it works like, well,
    an airbrush. If a simple line is drawn, the Airbrush Tool produces a semi-transparent,
    soft stroke that looks much like sprayed paint. And, if the Airbrush Tool is held
    in place while drawing a line, the area under the tools gets darker, as if more
    paint is being applied.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_131_0.png)


    Figure 28. Drag the mouse pointer to draw a line.


    # To draw a line with the Airbrush Tool:


    +   1. Use the Layers & Channels dialog box to select the layer on which you would
    like to draw. (For directions on how to do this, turn to page 92).


    +   2. Choose a foreground color.


    +   3. Click the Airbrush Tool in the Toolbox or press A on the keyboard. The
    mouse pointer will change to a tiny pencil.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_131_1.png)


    +   4. In the image window, position the mouse pointer where you would like to
    start the line.


    +   5. Press the left mouse button and drag. An airushed line will appear as you
    drag (Figure 28).


    +   6. When you are finished drawing, release the left mouse button.


    +   Tip


    +   The shape, size, and opacity of a line created by the Airbrush Tool can be
    changed using the Brush Selection dialog box. For directions on changing brush
    properties, turn to page 110.


    # Setting Airbrush Tool Options


    As you may have already guessed, there are two Airbrush Tool options that can
    be—Rate and Pressure. Rate sets how fast the "paint" comes out of the tool and
    Pressure sets how much "paint" is sprayed. The higher settings for both of these
    options make the Airbrush Tool act more like a real airbrush.


    To set these, double-click on the Airbrush Tool in the Toolbox to open the Tool
    Options dialog box (Figure 29). Use the Rate and Pressure sliders to set the options.


    Figure 29. Use the sliders to set the Rate and Pressure options.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_131_2.png)


    # Chapter 8'
  merge: -1
  img_proc: true
