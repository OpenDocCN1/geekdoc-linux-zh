  md: '# Chapter 14


    # Fading Text


    Using the Blend Tool and a layer mask, it''s easy to quickly create text that
    fades out.


    # To create fading text:


    +   1. Use the Text Tool to create some text. It will appear in the image window
    as a floating selection (**Figure 41**).


    +   2. In the Layers & Channels dialog box, click New Layer to anchor the text
    to its own layer.


    +   3. Right-click on the new text layer and choose Add Layer Mask from the pop-up
    menu (**Figure 42**). The Add Mask Options dialog box will open (**Figure 43**).


    +   4. Select the Black (Full Transparency) radio button.


    +   5. Click OK. The Add Mask Options dialog box will close and a layer mask thumbnail
    will appear next to the layer thumbnail in the Layers & Channels dialog box.


    +   6. Select the Blend Tool in the GIMP Toolbox.


    +   7. Make sure the foreground and background colors are set to the default (black
    and white, respectively) in the color selector. (Turn to page 46 for directions.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_245_0.png)


    Figure 41. Use the Text Tool to create the text you want to fade out, then anchor
    it to its own layer.


    | Raise Layer | Ctl+N |

    |---||

    | Lower Layer | Ctl+F |

    | Duplicate Layer | Ctl+B |

    | Delete Layer | Ctl+X |

    | Scale Layer | Ctl+S |

    | Resize Layer | Ctl+R |

    | Add Layer Mask | |

    | Merge Visible Layers | Ctl+M |

    | Flatten Image | |

    | Alpha To Selection |


    Figure 42. Right-click on the new layer and choose Add Layer Mask from the menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_245_1.png)


    Figure 43. In the Add Mask Options dialog box, select the Black (Full Transparency)
    radio button, then click OK.


