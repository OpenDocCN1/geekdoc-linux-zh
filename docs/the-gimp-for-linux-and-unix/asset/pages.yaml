- pgno: 53
  md: '# Chapter 3


    # To convert an image to RGB or grayscale:


    +   1. Open the image you want to convert.


    +   2. Right-click on the image and choose either Image→RGB or Image→Grayscale
    from the pop-up menu (**Figure 14**). The image will convert to RGB or grayscale
    depending upon the mode you selected.


    # Tips


    +   There will be one color mode that is grayed out and unavailable for selection
    because that is the one currently in use.


    +   If you change color modes and then realize that you made a mistake, you can
    always undo the change by pressing Ctrl+Z on the keyboard or by right clicking
    on the image and choosing Edit→Undo from the pop-up menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_53_0.png)


    # Channels and File Size


    While color modes do determine the number of colors displayed in an image, they
    also affect an image''s file size and the number of channels it has. The more
    channels there are the greater the file size. For instance, in **Figures 15a–c**
    below, the same image is displayed as a bitmap, in grayscale, and RGB. Notice
    the difference in file sizes.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_53_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_53_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_53_3.png)'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Channels


    Every GIMP image is made of one or more channels. These channels show the information
    about the different color elements in an image. As discussed on page 34, RGB color
    has three channels and CMYK color has four.


    Color tuning can be made to an individual channel using the Channels tab page
    on the Layers & Channels dialog box (Figure 16). But usually adjustments are made
    using the combined channels, affecting all the channels at once.


    Special grayscale channels, called alpha channels, can be added to an image and
    are used to save a selected area as a mask. (Channels and masks are discussed
    in detail in Chapter 13, Channels and Layer Masks).


    Channels can be added to any type of image, RGB, Indexed, grayscale, or bitmap.
    An image in the GIMP can have as many channels as you want, though this does considerably
    the file size.


    # Transparency


    When working on an image in the GIMP, any area of the image can be transparent,
    meaning that the pixels contain no color. A transparent area in the GIMP is shown
    with a light and dark gray checkerboard pattern (Figure 17).


    Transparency is a wonderful and important feature when working with layers. Layers
    are like clear glass windows stacked on one of the other. You can draw on one
    of these windows, then set whether the layer is visible, semi-transparent, or
    completely hidden. Transparency is set using a percentage of opacity. The more
    opaque a layer is, the less transparent it is. For a complete discussion of layers,
    turn to Chapter 7, A Layer Primer.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_54_0.png)


    Figure 16. Channels show the information about the different color elements in
    an image. Every image in the GIMP has at least 1 channel. The RGB image whose
    channels shown here 3 channels.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_54_1.png)


    Figure 17. Transparent areas in an image are shown with a checkerboard pattern.


    Transparent area


    # How Many Channels are There?


    The default number of channels for each image is as follows:


    | CHANNELS | MODES |

    | --- | --- |

    | 1 | Bitmap, Grayscale, Indexed |

    | 3 | RGB, HSV |

    | 4 | CMYK |


    39


    CHANNELS: TRANSPARENCY'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Chapter 3


    # Blending modes


    Blending modes work with layer transparency. A blending mode changes the way a
    layer''s pixels blend with the pixels in the layer directly below it. Some of
    the blending modes are quite subtle, only changing a few colors or shifting hues,
    while others produce dramatic effects (Figures 18a–c). Blending modes are discussed
    in detail in Chapter 11, Layer Techniques.


    > Figure 18a. This is the original image before a layer is added using a blending
    mode.


    # Color and Web Images


    When creating images for use on the Web, you need to keep in mind that the bigger
    the file, the longer the load time for those folks browsing your site. The best
    thing you can do is try to keep file size down sacrificing too much of the image
    quality.


    One way to cut image size down is to convert the image to Indexed mode, selecting
    the Generate optimal palette radio button in the Indexed Color Conversion dialog
    box (Figure 9). In the # of colors box, enter the number of colors you think would
    work, then click OK. If the results look okay, try converting the image using
    fewer colors. If the results look bad, undo the conversion by pressing Ctrl+Z
    on the keyboard and try again.


    > Figure 18b. A semi-transparent layer using Addition blending mode has been placed
    on top of the original object.


    For details about images and the Web, turn to Chapter 17, Creating Images for
    the Web.


    > Figure 18c. A semi-transparent layer using a Difference blending mode has been
    placed on top of the original object.


    Summary

    In this chapter you learned about:

    * Vector- and pixel-based programs

    * Converting images to RGB or grayscale

    * Color models and modes

    * Channels and transparency

    * Converting images to bitmap or indexed

    * Blending modes

    * Color and Web images'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# SELECTING COLORS


    **Figure 1.** The color selector at the bottom of the GIMP Toolbox contains a
    foreground and background color.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_56_0.png)


    Now that you''ve learned a bit about how color works in the GIMP, it''s time to
    discover how to select colors for use in your images. There are several ways to
    select color in the GIMP. Three methods include using the color selector at the
    bottom of the Toolbox, using a predefined color palette, or picking colors from
    the image itself.


    # Using the Color Selector


    The color selector is located at the bottom of the GIMP Toolbox (**Figure 1**).
    You will see two large overlapping squares, two small overlapping squares, and
    a double-headed arrow (**Figure 2**).


    The large overlapping squares are the foreground and background colors. By default,
    the foreground color is black and the background color is white. The foreground
    color is used in any image you paint using the Pencil, Paintbrush, or Airbrush
    Tools, create type, or fill an area using the Bucket Fill Tool. When editing—erasing
    or cutting—an-image, the hole that''s left is filled with the background color.


    The small overlapping squares are used to reset the default foreground and background
    colors while the double-headed arrow is used to switch the foreground and background
    colors.


    Color Picker


    Color selector


    Foreground color square


    Switch foreground and background colors


    ![](img/5164bc49fb24f10213e18cc994b7b40c_56_1.png)


    Reset default colors


    Background color square


    **Figure 2.** The color selector lets you set foreground and background colors.'
  merge: -1
  img_proc: true
