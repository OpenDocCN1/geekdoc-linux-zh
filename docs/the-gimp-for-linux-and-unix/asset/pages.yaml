- pgno: 193
  md: '# Blending Modes


    Blending modes work with layer transparency. A blending mode changes the way a
    layer''s pixels blend with the pixels in the layer(s) below it. Some of the blending
    modes are quite subtle, only changing a few colors or shifting hues, while others
    produce dramatic effects.


    These blending modes are available using the Mode drop-down list in the Brush
    Selection box (**Figure 14a**), the Tool Options dialog box with the Bucket Fill
    or Blend Tool selected (**Figure 14b**), or the Layers & Channels dialog box (**Figure
    14c**). The Tools that use the Brush Selection dialog box to change width and
    size of strokes are the Pencil, Paintbrush, Airbrush, and Eraser Tools. The blending
    modes can be set to change the effect after tool strokes.


    On pages 172–173 are samples of the blending modes. Use the directions below to
    duplicate how the samples were made using your own image. Try out the blending
    modes and see what they can do!


    # To test the blending modes:


    +   1. Open the image you would like to use for the test (**Figure 15**).


    +   2. Right-click on the image and choose Layers→Channels from the pop-up menu
    (**Figure 1**). The Layers & Channels dialog box will open (**Figure 2**).


    +   3. Click the New Layer button at the bottom of the Layers & Channels dialog
    box. The New Layer Options dialog box will appear (**Figure 16**).


    +   4. Make sure the Transparent radio button is selected in the Layer Fill Type
    area, then click OK. A new layer named "New Layer" will appear selected in the
    layers window.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_193_0.png)


    Figure 15. Open the image on which you want to test the blending modes.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_193_1.png)


    Figure 16. In the New Layer Options dialog box, sure the Transparent radio button
    is selected, then click OK.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_193_2.png)


    Figure 17. When the selected area on the new layer is filled with white, the area
    on the layer underneath is obscured.'
