- pgno: 242
  md: '# Working with Text


    **Figure 33.** Use the Text Tool to create text.


    # To move a text layer:


    +   1. Use the Text Tool to create some text (**Figure 33**). It will appear in
    the image window as a floating selection.


    +   2. In the Layers & Channels dialog box, click New Layer to anchor the text
    to its own layer.


    +   3. Select the Move Tool from the GIMP Toolbox. The mouse pointer will change
    to double-headed arrows.


    +   4. Position the mouse pointer over the selected text layer, then press the
    left mouse button and drag the text to its new position (**Figure 34**).


    > Tip


    To find out how to move text that has been selected, turn to page 148.


    **Figure 34.** Use the Move Tool to move the text layer.


    # It''s Easy to Add an Outline to Text


    If you want to create text that is outlined, here''s what you need to do:


    +   1. Create the text using the Text Tool. It will appear in the image window
    as a floating selection.


    +   2. Use the Brush Selection dialog box to select the Circle (01) brush. (The
    bigger, the thicker the outline).


    +   3. Set the foreground color to the color you want to use to outline the text.


    +   4. Right-click on the floating, selected text and choose Edit→Stroke from
    the pop-up menu. An outline will appear around the text.'
