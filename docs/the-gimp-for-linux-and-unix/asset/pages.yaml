- pgno: 29
  md: '# Setting Levels of Undo and Redo


    By default, the GIMP lets undo the last five actions you have performed. You can
    change this to any number you want, though this takes up extra space in RAM and
    may slow your computer down. The number of redo levels automatically corresponds
    to the number of undo levels.


    # To set the levels of undo:


    +   1. Right-click on the image window and choose File→Preferences (Figure 23).


    or

    Choose File→Preferences in the GIMP Toolbox (Figure 24).


    The Preferences box will open with the Display tab in front (Figure 25).

    2. Click the Interface tab to bring it to the front (Figure 26).

    3. In the Levels of undo text box, enter the number of levels you would like.

    4. Click OK. The Preferences dialog box will close and the levels of undo will
    change to your setting.


