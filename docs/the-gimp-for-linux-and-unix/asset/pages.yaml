- pgno: 277
  md: '# Incredible Script-fus


    There are so many wonderful script-fus that come with the GIMP that you need several
    hours to try every one! There are two places where script-fus are found in the
    GIMP The script-fus that create new images from scratch are available on the Xtns
    menu (Figure 15). The script-fus that alter and enhance an existing image are
    accessed by right clicking on the image and choosing one from the Script-Fu menu
    on the pop-up menu that appears (Figure 16).


    This section will cover just a few of these amazing script-fus. Many script-fus
    and the effects they create are displayed in the Scriptfu gallery at the end of
    this chapter, starting on page 258. Several script-fus are discussed and explained
    elsewhere in this book:


    +   - Pattern-creating script-fus are discussed in Chapter 8, Painting Lines and
    Shapes, on page 123.

    - Shadow script-fus are explained in Chapter 11, Layer Techniques, on pages 175–180.

    - The Xach-Effect, a special highlighting and shadowing effect, is discussed in
    Chapter 14, Working with Text, on pages 224–225.

    - Logos script-fus that create amazing text effects are also discussed in Chapter
    14, Working with Text, on pages 227–230.

    - Script-fus that create Web page elements are explained in Chapter 17, Creating
    Images for the Web, on page 268.


