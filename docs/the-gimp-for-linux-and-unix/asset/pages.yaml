  img_proc: true
- pgno: 140
  md: '# Blend Tool Options


    There are numerous options that can be set for this amazing tool:


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_1.png)


    +   * Opacity—this option sets how opaque the gradient fill is.


    +   * Offset—this option sets where the foreground color starts to blend into
    the background color. The higher the value, is, the sharper the edge is between
    the color blends.


    +   * Blend—this drop-down list sets which color starts and finishes the blend.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_3.png)


    +   * Gradient—there are many gradient types you can choose to change the shape
    of the gradient. Several of them are in Figures 53a–h.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_4.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_5.png)


    +   * Repeat—this option sets the gradient fill to automatically repeat the gradient
    (Figures 54a–b). When creating a gradient, the shorter distance the mouse is dragged,
    the more repeats there will be.


    +   * Adaptive supersampling—this option makes a blend look smoother by adding
    intermediate colors to the transition.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_6.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_7.png)


    # To set Blend Tool options:


    +   1. Double-click on the Blend Tool in the Toolbox. The Tool Options dialog
    box will open (Figure 55).


    +   2. Use the Opacity slider to set how opaque the fill will be. The higher the
    setting the more opaque the fill. A setting of 0 is completely transparent (invisible),
    whereas a setting of 100 is completely opaque.


    +   3. Use the Offset slider to set where the foreground color starts to blend
    into the background color.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_8.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_140_9.png)


    (continued)'
