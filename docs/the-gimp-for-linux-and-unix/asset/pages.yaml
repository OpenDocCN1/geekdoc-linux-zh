  md: '# Getting Images Out of the Way


    If you are working on several images at one time, you may want to get a few of
    the image windows out of the way but not close them. There are two ways to do
    this: minimize the window or roll it


    Figure 40. Click the button on the Control Panel that corresponds to the image
    you want to view.


    # To minimize an image window:


    Click the Minimize button in the upper right-hand corner of the image window (Figure
    39).


    # To view a minimized image window:


    Depending upon the type of Linux/Unix distribution you are using, a minimized
    window will appear differently. For RedHat Linux or KDE, just click the button
    on the Control Panel to view a minimized window (Figure 40).


    # To roll up an image window:


    Double-click on the Title Bar. The image will roll up, displaying only the Title
    Bar (Figure 41).


    # Tip


    +   - To roll the image window, double-click on the Title Bar again.


    # To close an image window:


    Right-click on the image window and choose File→Close from the pop-up menu (Figure
    42).


    or


    Press Ctrl+W on the keyboard.


    or


    Click the Close button in the upper right-hand corner of the image window (Figure
    43).


    Figure 41. Image windows that are rolled up display only their Title Bars.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_46_0.png)


    Figure 42. Right-click on the image window and choose File→Close from the pop-up
    menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_46_1.png)


    Figure 43. Click the Close button in the upper right-hand corner of the document
    window.'
