- pgno: 101
  md: '# Chapter 6


    # Save Your Selections


    When you make a complicated selection, chances that you will want to use it again.
    You can save any selection you create to an alpha channel which this saves the
    selection''s shape and transparency. You can then use the selection again at any
    time by activating the channel. For details on activating a channel and using
    a saved selection, turn to page 199 in Chapter 13, *Channels and Layer Masks*


    ![](img/5164bc49fb24f10213e18cc994b7b40c_101_0.png)


    **Figure 70.** You can use channels to save any selection you make. In this figure
    the middle and right shells are selected.


