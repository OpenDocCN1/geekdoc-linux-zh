    Edit→Paste from the pop-up menu (**Figure 6**) or press Ctrl+V on the keyboard.
    The cut or copied area will be pasted into the image window as a floating selection
    (**Figure 7**).

    4. You can anchor the floating selection to the active layer or put it on a new
    layer of its own (see page 100 for details).


