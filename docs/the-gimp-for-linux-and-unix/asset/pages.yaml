- pgno: 198
  md: '# Quick Layer Effects


    There are many special effects you can create using layers and GIMP. A few quick
    ones, including Drop Shadow, Perspective (drop shadow), Round Corners, and Alien
    Glow, are discussed here.


    # Create a drop shadow:


    +   1. Use the Layers & Channels dialog box to select which layer will have a
    drop shadow added to it (for directions about how to do this, turn to page 92)
    (Figure 23).

    2. Right-click on the image and choose Script-Fu→Shadow→ Drop Shadow from the
    pop-up menu (Figure 24). The Script-Fu Drop-Shadow dialog box will open (Figure
    25).

    3. To set where the drop shadow will appear, enter values in pixels in the X and
    Y offset text boxes. (X offset moves the shadow horizontally, Y offset moves the
    shadow vertically, thus positive numbers move the shadow right and down, whereas
    negative numbers move the shadow left and up, respectively.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_198_0.png)


    Figure 25. Use the Script-Fu Drop-Shadow dialog box to set the offset, size, color,
    and opacity of the drop shadow. (If this is the first time you are using this
    feature, try the default settings.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_198_1.png)


    Figure 26. Use the Script-Fu Color dialog box to set the color of the drop shadow.


    (continued)


    Figure 27a. This is the original image before the drop shadow is added to the
    pumpkin layer.


    Figure 27b. This is the same image after the drop shadow has been added behind
    the pumpkin.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_198_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_198_3.png)


