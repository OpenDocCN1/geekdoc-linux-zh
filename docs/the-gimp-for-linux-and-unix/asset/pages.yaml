    The Create directory dialog box will appear (**Figure 35**).


    +   B. Type a name for the new directory in the Name text box.


    +   C. Click Create. The Create directory dialog box will close and the new directory
    will appear in the Directories list box.


    +   3. Type the name for the image in the Selection text box. Be sure to add a
