- pgno: 144
  md: '# # ADJUSTING COLOR AND TONE


    Eventually, you will come across an image—be it a photograph, scanned image, or
    image from another source—needs to be adjusted. GIMP offers many color correction
    tools to enhance and adjust the color and tone of an image. All of these tools
    work in basically the same way—by determining the existing range of pixel values
    in an image and replacing them with a new range of values. The main difference
    between the color correction tools is the amount of control you have over the
    range of values.


    This chapter will take you through using the GIMP''s color correction tools, from
    the most sophisticated ones that give the greatest control—such as levels, and
    curves—to those that give the least control—such as invert, threshold, normalize,
    and posterize. The Levels and Curves let you make exact adjustments to a layer''s
    highlights, midtones, and shadows using the lightest and darkest pixels in each
    individual channel. The simpler tools make adjustments using the combined values
    of all channels.


    All of the commands in this chapter can be applied to a selected area of a layer
    or an entire layer. The more complex tools let you see a preview of an adjustment
    to let you decide whether the change is what you want.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_144_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_144_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_144_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_144_3.png)


    Original image.


    Posterize applied.


    Invert applied.


    Threshold applied.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Chapter 9


    # Levels


    Levels are used to make exact adjustments to a layer''s selection tonal range
    by adjusting highlights, midtones, and shadows using a histogram. A histogram
    is a graph that shows the number of pixels at each level of brightness in a layer
    or selection.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_145_0.png)


    # To adjust color and tone using Levels:


    +   1. Use the Layers & Channels dialog box to select a layer. (For details about
    how to do this, turn to page 92.)


    +   2. If wish, use the selection tool of your choice to select an area of the
    image. (For directions on how to use the selection tools, turn to Chapter 6, Making
    Selections.)


    +   3. Right-click on the image and choose Image -> Levels from the pop-up menu
    (Figure 1). The dialog box will appear (Figure 2).


    +   4. Make sure the Preview check button is selected.


    +   5. Use the Modify Levels for Channel drop-down list to select which channel
    will be adjusted (Figure 3). It''s best to use Value first. This is the combination
    of all three channels—Red, Green, and Blue. After correcting the Value, you can
    move on to individual channels, if need be.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_145_1.png)


    +   6. To adjust the shadows, enter a number in the leftmost Input Levels box
    or slide the Input Level triangle to the right (Figure 4).


    +   7. To adjust midtones, enter a number in the center Input Levels box or slide
    the gray Input Level triangle to the left or right.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_145_2.png)'
  merge: -1
  img_proc: true
