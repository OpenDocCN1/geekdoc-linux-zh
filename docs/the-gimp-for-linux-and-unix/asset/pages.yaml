- pgno: 291
  md: '# Chapter 17


    # Quickly Creating Web Page Elements


    Many of the graphics on Web sites are used to emphasize text, or as links to other
    pages or Web sites. When creating buttons, bullets, arrows, or any other Web page
    element, it is good to come up with a style and use it throughout the site. This
    makes for a consistent look and makes it easier for folks browsing your site to
    find what they want. The GIMP comes with several scripts that quickly create Web
    page elements.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_291_0.png)


    # To use a script-fu to create Web page elements:


    +   1. In the GIMP Toolbox, open the Xns->Script-Fu->Web page themes menu (Figure
    19).


    +   2. Move the mouse pointer over to one of the styles and from the fly-menu
    select the Web page element that you want to create (Figure 20). In this example,
    Xns->Script-Fu->Web page themes->GIMP.Org->Big Header is selected. A Script-Fu
    dialog box for the item you selected will open (Figure 21).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_291_1.png)


    +   3. Use the various boxes, color buttons, check buttons, and radio buttons
    to set the different options. (For more information about how script-fu dialog
    boxes work, turn to page 254.)


    # Don''t Go Overboard


    Animations and cute graphics are great for attracting attention, but too many
    can get distracting and detract from the items you really want to emphasize. Just
    as one lightly seasons one''s food, animations and graphics should be sprinkled
    sparsely over a Web page.


    268'
  merge: -1
  img_proc: true
