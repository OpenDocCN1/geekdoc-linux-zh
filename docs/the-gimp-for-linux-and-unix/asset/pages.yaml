- pgno: 162
  md: '# TRANSFORM

    Your ART


    ![](img/5164bc49fb24f10213e18cc994b7b40c_162_0.png)


    **Figure 1.** The GIMP Toolbox contains four tools that will help you transform
    your art.


    As you may have already noticed, there are four transformation tools available
    in the GIMP Toolbox (**Figure 1**). The transformation tools alter an image in
    some way, making it look different. For instance, using these tools to **flip**
    an image horizontally or vertically, rotate a portion of an image, or even **crop**
    the image down to a smaller size. Transformations are fast and easy, so let''s
    get started!


    # The Move Tool


    **Figure 2.** Select the area you want to move using one of the selection tools.


    The Move Tool lets you well, move things. There are two ways to move things: you
    can select an area, then immediately move it without using the Move Tool; or select
    an area, make it float, then move it using the Move Tool.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_162_1.png)


    **Figure 3.** Drag the selected area to its new position. In this figure, the
    space left behind the moved area is automatically filled with the current background
    color because the image only contains one layer.


    # To move a selected area without using the Move Tool:


    +   1. Select the area you want to move using one of the selection tools (**Figure
    2**).

    2. Position the mouse pointer over the selection, press the left mouse button
    and drag. The selected area will move (**Figure 3**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_162_2.png)


    147'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Chapter 10


    # To move a selected area using the Move Tool:


    +   1. Select the area you want to move using one of the selection tools (Figure
    4). (For details about using the selection tools, turn to Chapter 6, Making Selections.)


    +   2. Click the Move Tool in the GIMP Toolbox to select it or press M on the
    keyboard. The mouse pointer will change to double-headed arrows.


    +   3. Right-click on the image and choose Select→Float from the pop-up menu (Figure
    5) or press Shift+Ctrl+L on the keyboard. The selected area will become a floating
    selection. (To learn more about floating selections, turn to page 99)


    +   4. Position the mouse pointer over the floating selection, press the left
    mouse button, and drag the selection to a new position (Figures 6a-b).


    # Tips


    +   - When the Move Tool is selected, you can nudge a floating selection up, down,
    or sideways, using the arrow keys to move it.


    +   - To anchor the floating selection back to the layer it came from, move the
    mouse pointer outside of the selected area. The mouse pointer will change to a
    downward pointing arrow. Click. The layer will be anchored.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_163_0.png)


    Figure 4. If you wish, select the area you want to move. In this figure, the body
    of the fish is selected.


