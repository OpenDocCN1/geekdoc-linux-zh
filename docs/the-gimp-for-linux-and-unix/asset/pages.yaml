- pgno: 107
  md: '# Chapter 7


    # The Layers & Channels Dialog Box


    When working with layers, you''ll use the Layers & Channels dialog box (Figure
    2). To open the dialog box, right-click on an image and choose Layers→Layers &
    Channels from the pop-up menu (Figure 3).


    In this chapter, you''ll discover how to use the layer window to set the active
    layer and edit layer properties. Also, you''ll use the buttons at the bottom of
    the dialog box to create and duplicate layers, move layers up and down the stacking
    order, delete layers, and anchor a floater. We''ll discuss the other items available
    on the Layers tab page—Mode drop-down list, Keep Trans button, and Opacity slider—in
    Chapter 11, Layer Techniques.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_107_0.png)


    > Figure 2. The Layers tab page in the Layers & Channels dialog box is used to
    manipulate your image by layer.


    # The Active Layer


    When the Layers & Channels dialog box is open, you''ll notice that one of the
    layers is highlighted in blue (Figure 2). The highlighted layer is the active
    layer. In the image window, the active layer has a dashed yellow rectangle around
    it. Any changes you make using GIMP tools and filters will affect the active layer.
    Other layers will not be affected. With just a click of a mouse, you can set which
    layer is the active layer.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_107_1.png)


    > Figure 3. Right-click on the image and choose Layers→Layers & Channels from
    the pop-up menu to open the Layers & Channels dialog box.


    # To make a layer the active layer:


    +   1. Right-click on the image and choose Layers→Layers & Channels from the pop-up
    menu (Figure 3). The Layers & Channels dialog box will now displaying the Layers
    tab page (Figure 2).

    2. Click on the name of the layer you want to be the active layer. That layer
    will become highlighted and active.


    92'
  merge: -1
  img_proc: true
- pgno: 108
  md: "# A Layer Primer\n\n# Manipulating Layers\n\nIt's easy to work with layers\
    \ in an image. You can create new layers, duplicate existing ones, or turn a floating\
    \ selection into a layer. Layers can be renamed, deleted, and hidden from view.\
    \ Layers can also be scaled and resized. In fact, there are many more ways to\
    \ manipulate layers. To find out more about using layers, turn to Chapter 11,\
    \ Layer Techniques.\n\n![](img/5164bc49fb24f10213e18cc994b7b40c_108_0.png)\n\n\
    # To create a new layer:\n\n+   1. Right-click on the image and choose Layers→Layers\
    \ & Channels from the pop-up menu (Figure 3). The Layers & Channels dialog box\
    \ will open displaying the Layers tab page (Figure 2).\n2. Click the New Layer\
    \ button at the bottom left of the dialog box.\n   Right-click in the layer window\
    \ and choose. New Layer from the pop-up menu (Figure 4)\n   With the Layers &\
    \ Channels dialog box active (the title bar will be highlighted), press Ctrl+N\
    \ on the keyboard.\n   3. Type a name for the new layer in the Layer name text\
    \ box.\n   4. Enter the layer's width and height in pixels using the Layer width\
    \ and Layer height text boxes. (continued)\n\nFigure 4. Right-click in the layer\
    \ window and choose New Layer from the pop-up menu.\n\n![](img/5164bc49fb24f10213e18cc994b7b40c_108_1.png)\n\
    \n![](img/5164bc49fb24f10213e18cc994b7b40c_108_2.png)\n\nFigure 5. Use the New\
    \ Layer Options dialog box to set the layer's name, its size, and fill type.\n\
    \n93"
