- pgno: 195
  md: '# Chapter 11


    # Blending Mode Examples


    The following two pages contain examples of the different blending modes and how
    they affect an image. In the text describing each mode, the image itself is referred
    to as the "image layer" and the layer above, using the blending mode, is called
    the "blending layer." The last four modes described on the next page are not good
    examples if they aren''t in color, so I''ve only included descriptions of what
    they do.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_195_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_195_1.png)


    **Normal mode.** This mode paints pixel to create a result that is a blend of
    the image and blending layers.


    **Normal mode, 50% opacity.** In this image, the blending layer is set to normal
    mode with opacity at 50%.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_195_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_195_3.png)


    **Dissolve mode.** This mode creates a stippled texture on the blending layer
    and becomes more solid with higher opacity settings. This example is set at 50%
    opacity.


    **Multiply mode.** This mode uses channels to remove the lighter parts of the
    image layer to create a darker image layer. Multiplying any color with black makes
    darker; with white, colors are unchanged.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_195_4.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_195_5.png)


    **Screen mode.** This mode uses channels and multiplies the inverse of the image
    layer with the blending layer. The resulting color is always lighter. Screening
    any with white makes it lighter; with black, colors are unchanged.


    **Overlay mode.** This mode makes dark areas darker and light areas lighter. Contrast
    and detail remain in the image layer while the colors are mixed with the blending-layer.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Layer Techniques


    ![](img/5164bc49fb24f10213e18cc994b7b40c_196_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_196_1.png)


    Difference mode. This mode uses channels to subtract colors in the image layer
    from the blending layer or vice versa, depending upon which layer has the higher
    brightness.


    Addition mode. This mode is similar to Screen mode, but instead of multiplying
    inverse values, it adds the image and blending layers channel values. The resulting
    color is always lighter.


    # BLENDING MODE EXAMPLES


    Subtract mode. This mode subtracts image layer channel values from blending layer
    values. Subtracting any color with white makes it darker; with black, colors are
    unchanged.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_196_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_196_3.png)


    Darken Only mode. This mode compares image layer and blending layer channel values
    in order to display the lowest value. Darkening any color with black makes it
    darker; with white, colors are unchanged.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_196_4.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_196_5.png)


    Lighten Only mode. This mode compares image layer and blending layer channel values
    in order to display the highest value. Lightening any color with white makes it
    lighter; with black, colors are unchanged.


    Value mode. This mode uses the image layer to determine hue and saturation values
    and the blending layer to determine value (brightness). Contrast and detail are
    retained in the image layer.


    Hue mode. In this mode, the blending layer''s hue is applied to the image layer.
    The saturation and brightness values of the image layer are not changed.


    Saturation mode. In this mode, the blending layer''s saturation value is applied
    to the image layer. The image layer''s hue and brightness values are not changed.


    Color mode. In this mode, the blending layer''s hue and saturation values are
    applied to the image layer. The image layer''s brightness value remains unchanged.


    Behind mode. This mode is only used for transparent areas of the blending layer
    (it''s not available in the Layers & Channels dialog box).


    # 173'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Chapter 11


    # Setting Layer Opacity


    When working with a layered image, you may want to create a special effect by
    making one or more layers semi-transparent. This lets the layers below show through.
    The lower the opacity setting in the Layers & Channels dialog box, the more transparent
    an image is.


    To set layer opacity:


    +   1. Right-click on the layered image and choose→Layers & Channels from the
    pop up menu (Figure 21). The Layers & Channels dialog box will open (Figure 22).

    2. Highlight the layer that you want to make transparent.

    3. Use the Opacity slider to set the transparency of the layer.


