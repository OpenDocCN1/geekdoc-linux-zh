  md: '# Chapter 10


    # The Transform Tool


    The Transform Tool is one of those all time great tools. With it you can rotate,
    scale, *shear*, and add *perspective* to an image.


    To rotate a layer or selection using the Transform Tool:


    +   1. Use the Layers & Channels dialog box to select which layer will be rotated.


    *and/or*


    Use one of the selection tools of your choice to select an area (**Figure 20**).


    +   2. Double-click on the Transform Tool in the GIMP Toolbox. The Options dialog
    box will open (**Figure 21**).


    +   3. In the Transform area, select the Rotation button.


    +   4. Click Close to close the Tool Options dialog box.


    +   5. With the Transform Tool selected, position the mouse pointer over the image
    or selected area. The mouse pointer will change to swirling arrows.


    +   6. Press the left mouse button and drag to the right or left. A yellow dashed
    rectangle with squares at the corners will appear and the image will rotate (**Figure
    22**). In addition, a Rotation Information dialog box will open, displaying the
    angle of the layer or selection (**Figure 23**).


    +   7. Release the left mouse button when you are happy with the rotation angle.


    +   ** Tip


    +   * To rotate an angle in 15° increments, hold down the Ctrl key while rotating.


