- pgno: 97
  md: '# Chapter 6


    # Feathering a Selection


    As discussed on page 62, feathered makes the transition from the selection to
    the surrounding area smoother. If you''ve made a selection and want to set more
    feathered, use the Feather command on the Select flyout.


    | File | Figure 60. Choose Select→ |

    |---|---|

    | Edit | Feather from the pop-up menu. |

    | Select | Toggle Ctrl+T |

    | View | Invert Ctrl+I |

    | Image | All Ctrl+A |

    | Layers | None Shift+Ctrl+A |

    | Tools | Float Shift+Ctrl+L |

    | Filters | Sharpen Shift+Ctrl+H |

    | Script-Fu | Border |

    | Dialogs | Grow Shrink Save To Channel By Color... | Feather Shift+Ctrl+F |


    # To feather a selection:


    +   1. Create the selection you want to feather using the selection tool of your
    choice.

    2. Right-click on the image and choose Select→Feather from the pop-up menu (Figure
    60) or press Shift+Ctrl-F on the keyboard. The Feather Selection dialog box will
    appear (Figure 61).

    3. In the Feather selection text box, enter the number of pixels by which you
    want to feather the edge of the selection.

    4. Click OK. The Feather Selection dialog box will close and any effect applied
    to the area of the selection will be feathered (Figure 3).


    # Tips


    +   * You can also set any of the selection tools to feather using the Tool Options
    dialog box. For details on how to do this, turn to page 62.

    * A high number entered in the Feather selection by text box will create a selection
    with a very fuzzy edge. To make an edge more distinct, use the Sharpen command
    as described on the previous page. You can also apply the Sharpen filter to a
    specific area. For details about applying a filter, turn to page 231.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_97_0.png)


