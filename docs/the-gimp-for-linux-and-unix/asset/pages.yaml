  md: '# Chapter 13


    # # How to Use an Alpha Channel


    Now that you know how to create alpha channels, it''s time to find out what magic
    you can do with them.


    First off, you know that the black area of an alpha channel represents the isolated
    area of the image that cannot be edited. Conversely, the white area represents
    the part of the image that can be changed. These black and white areas can be
    edited and reshaped, leaving the unchanged and editable areas.


    Second, you can activate an alpha channel as a selection, using it to edit the
    unselected areas of an image.


    Figure 20. In the channel window, select the channel that you want to edit. Make
    sure it''s visible.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_221_0.png)


    # ## To reshape an alpha channel:


    +   1. On the Channels tab in the Layers & Channels dialog box, select the alpha
    channel that you want to edit (Figure 20).


    +   2. Make sure alpha channel is visible.


    +   3. If you find it hard to see the alpha channel, hide the image''s layers
    by clicking the eye icons on the Layers & Channels dialog box.


    +   4. Select either the Pencil or Paintbrush Tool from the GIMP Toolbox.


    +   5. Set the foreground color to color either black or white—black if you want
    to add to the protected area, white if you want to add to the editable area. (Turn
    to page 42 to find out how to select the foreground color).


    +   6. Use the Brush Selection dialog box to select a brush. (For directions on
    how to do this, turn to page 110).


    +   7. Position the mouse pointer over the area you want to edit, press the left
    mouse button, and start painting (Figure 21). The shape of the black and white
    areas will change as you paint (Figure 22).


    Figure 21. Position the mouse pointer and start painting.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_221_1.png)


    Figure 22. The shape of the black and white areas change as you paint.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_221_2.png)


