- pgno: 289
  md: '# Creating Backgrounds


    A good background can set the look for an entire Web site. In some cases, a solid
    color background can be simple and elegant. In other cases, you may want to create
    something with more texture or a pattern. Be careful when creating backgrounds,
    though as a texture or pattern that is very busy or brightly colored can make
    hard to read.


    # To create a background:


    +   1. Create a new RGB image with a white fill that is 150 pixels wide and 150
    pixels high (Figure 15).


    +   2. Use the Bucket Fill tool to fill the image with a solid color or a pattern
    (for directions on filling an area with a solid color, turn to page 119; to find
    out how to fill an area with a pattern, turn to page 121).


    +   3. If you filled the image window with a solid color, you can add texture
    by applying a Filter such as Apply Canvas, Cubism, Noisify, or Randomize (Figure
    16). (To find out how to apply a filter, turn to page 231.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_289_0.png)


    Figure 15. Create a new RGB image with a white fill that''s 150 pixels wide and
    high.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_289_1.png)


    Figure 16. You can add texture to a solid figure using a filter. In this figure,
    the Apply Canvas filter was used.


    # Web Graphics and File Size


    When creating graphics for the Web, you should remember that the larger the file,
    the longer it will take to load in a browser. Suppose you are using a 56k modem.
    Modern downloads information at 48k per second. This means a 200k image would
    take five seconds to load. This may not sound like much, but if you have ten 200k
    images, your Web page would take at least 50 seconds to load (ugh!). The rule
    of thumb Web page load times is that a page should take no longer than ten seconds
    to load. This means that the maximum combined size for all the text, graphics,
    and other Web elements on a page should be no more than 500k.'
  merge: -1
  img_proc: true
