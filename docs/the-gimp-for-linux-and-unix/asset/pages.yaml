- pgno: 269
  md: '# Chapter 15


    # Some Filter Combinations


    **Figures 30–33** below show some interesting filter combinations that have been
    applied to images. Each description contains a listing of the filters used, the
    filter settings, and any other pertinent information.


    **Figure 30.** In this image, the Oilify filter was applied twice with a Mask
    Size setting of 11. Then, the Sharpen filter was applied with a sharpness setting
    of 62.


    **Figure 31.** In this image, the Oilify filter was applied with a Mask Size setting
    of 17, then the Ripple filter was applied with a Period setting of 20 and an Amplitude
    setting of 3.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_269_0.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_269_1.png)


    **Figure 32.** In this image, the section behind the bus was selected and an Abstract
    2 gradient was stroked to give the appearance of a motion trail. The wheels and
    side panel of the bus were then selected and the Motion Blur filter was applied.
    Finally, the area around the wheels was selected and the Noisify filter was applied
    to create the grainy road.


    **Figure 33.** The butterfly in this image was pasted onto two layers. With the
    bottommost butterfly layer selected, the Sharpen filter was applied with a Sharpness
    setting of 65, then the Glass Tile filter was applied with the Tile Width and
    Height sliders set to 36. The upper butterfly layer was then selected and the
    Sharpen filter was applied with a Sharpness setting of 36, the Posterize command
    was applied with a setting of 2 levels, and the layer opacity was set to 50%.


    # Summary


    In this chapter you learned how to:


    +   * Repeat a filter

    * Make an image look like an oil painting

    * Make an image look like it''s on a curling page


    +   * Make an image''s border wavy

    * Use a layer mask to apply a texture

    * Give an image the appearance of motion


    246'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# PLUG-INS AND SCRIPT-FUS


    Plug-ins and script-fus are two very powerful programming features that add amazing
    functionality to the GIMP.


    Plug-ins are little programs that let the user add extra features to the GIMP—much
    of the core features—consists of plug-ins that have been integrated into the GIMP
    program. Since the GIMP is a modular program, it''s easy to enhance the GIMP directly
    through the use of plug-ins without having to recompile or reinstall the entire
    program. There are many GIMP users and developers who have written plug-ins and
    contributed them to the GIMP community on the Web. You have already seen and used
    many plug-ins when working with filters in Chapter 15, Using Filters.


    Script-fus are essentially the macros of the GIMP. If you are familiar with macros
    (or scripting languages) from word processing programs, you know that you can
    record a macro that you will replay various actions or repetitive tasks. The GIMP''s
    script-fus are programs that one can write to automate special effects containing
    many steps. Creating a script-fus is well beyond the scope of this book, but you
    can use (and enjoy!) the plethora of script-fus included with the GIMP. In fact,
    you have already worked with some script-fus in Chapter 14, Working with Text
    (see pages 227–230).


    This chapter will show you where to find the special plug-ins and script-fus included
    with the GIMP, and basic instructions on how to use them.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Chapter 16


    # Which Plug-ins and Script-fus

    Installed?


    It''s easy to find out which plug-ins are available in your version of the GIMP
    using DB Browser. DB Browser is itself a plug-in that contains a database of all
    installed extensions, script-fus, and plug-ins. You''ve already seen and many
    of the special GIMP plug-ins when working with filters in Chapter 15. These plug-ins
    are available on the Filters->Render menu. Take a look at page 245 to see some
    of the great effects they create.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_271_0.png)


    Figure 1. In the GIMP Toolbox, choose Xtns->DB Browser.


    # To view installed plug-ins and script-fus:


    +   1. In the GIMP Toolbox, choose Xtns->DB Browser (Figure 1). The DB Browser
    window will open (Figure 2).

    2. Use the scroll bars to view the list of installed extensions, script-fus, and
    plug-ins at the left side of the dialog box.

    3. To find out who wrote a particular item, select it. The author''s name and
    a brief description of what the item does appear on the right side of the DB Browser
    window.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_271_1.png)


    Figure 2. Use the DB Browser to view the installed extensions, script-fus, and
    plug-ins.


