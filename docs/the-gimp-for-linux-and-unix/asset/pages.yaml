  md: '# Transforming Text


    Rotating, scaling, shearing, adding perspective, flipping, and moving text is
    easy whether it''s on its own layer or part of a layer containing an image.


    To rotate, scale, shear, or add perspective to text:


    +   1. Use one of the selection tools to select the text you want to rotate (Figure
    27)


    or

    Use the Layers & Channels dialog box to select a text for rotation.

    2. Double-click on the Transform Tool in the GIMP Toolbox. The Tool Options dialog
    box will open (Figure 27).

    3. In the Transform area, select the region button next to one of the options—Rotation,
    Scaling, Shearing, or Perspective.

    4. Select the Smoothing check box if you want the edges of the text blurred to
    create a smoother look.

    5. Click Close. The Tool Options dialog box will close.

    6. With the Transform Tool selected, position the mouse pointer over the text
    or layer.

    7. Press the left mouse button and drag. The selected text or layer will rotate,
    scale, shear, or add perspective, depending upon the option you selected (Figure
    28).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_240_0.png)


    Figure 26. Use a selection tool to select the text you want to transform.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_240_1.png)


    Figure 27. Use the Tool Options dialog box to select the type of transformation.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_240_2.png)


    Figure 28. Drag the mouse to transform the text. In this example, perspective
    has been added to the text.


    # Tip


    +   - To find out more about the Transform Tool and what it can do, turn to pages
    154–162.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_240_3.png)'
  merge: -1
  img_proc: true
