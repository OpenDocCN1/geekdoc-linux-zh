- pgno: 315
  md: '# Chapter 18


    8. In the Rotation area, select a rotation for the printed image. (Be aware that
    90 is the default for this option. This prints a landscape image.)


    9. In the Output area, select the Preview check button. This will let the service
    bureau view the image before it is printed.


    10. Click OK. The image will be saved as either a .ps or an .eps file.


    # Tips


    +   - By Choosing File→Save as in step 2, a new copy of the file remains opened
    while the original version is automatically closed. This keeps the original version
    intact (all layers, guides, etc., preserved).


    +   - You may have noticed the Encapsulated PostScript check button in the Output
    area. If you are generating an .eps file, this check button will automatically
    be selected. If you are generating a .ps file, the check button will not be selected.
    Leave this check button as is since fully encapsulated PostScript (.eps) is different
    than plain PostScript (.ps).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_315_0.png)


    26. Use the Save PostScript dialog box to set the image''s size and rotation.


    # Call the Service Bureau First


    Before creating output for a service bureau, call them first to find out what
    file type they use and what media you should use to transport the file to them.


    # Summary


    In this chapter you learned how to:


    +   - Calculate image size to print at a specific resolution


    +   - Scale an image using cubic interpolation


    +   - Print an image


    +   - Select a different printer


    +   - Select a different page size, paper, or orientation


    +   - Select a different printer tray and printer resolution


    +   - Adjust the brightness of the printed image


    +   - Generate a .ps or .eps file


