  md: '# Creating Composite Images


    # Pasting into a Selected Area


    The GIMP offers more than one way to paste a selection into an image. As well
    as using the simple paste command described on page 182, you can also use the
    Paste Into command. Paste Into lets you paste a selection from the clipboard into
    a selected area of an image.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_206_0.png)


    To paste into a selected area:


    +   1. Open the image you want to paste the selection into or create a new image
    (Figure 8).


    +   2. Cut or copy a selected area.


    +   3. Using the selection tool of your choice, select that area you want to paste
    the cut or copied item into (Figure 9).


    +   4. Right-click on the image and choose Edit→Paste Into from the pop-up menu
    (Figure 10). The cut or copied item will appear in the selected area (Figure 11).


    # Tip


    +   If the cut or copied selection is larger than the selected area you are going
    to paste into, the cut or copied selection will automatically be cropped to fit
    the smaller area.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_206_1.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_206_2.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_206_3.png)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_206_4.png)'
