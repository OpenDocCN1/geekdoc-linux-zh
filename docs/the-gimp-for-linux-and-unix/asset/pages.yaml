- pgno: 68
  md: '# MOVING ABOUT


    Being able to view your images close is very important. If you want to do any
    type of detailed work, zooming in on the area you want to change is the way to
    go. After making changes, you can view the entire image again by zooming. In fact,
    with the GIMP you can view the same image in two windows at the same time—one
    window zoomed in to work on the detail, the other zoomed out to see the entire
    image and the changes you have made.


    This chapter takes you through the ins and outs of viewing images in the GIMP.
    You''ll discover how to change the viewing size, zoom to a specific scale, and
    zoom in on a specific area. Next, you''ll find out how to set an image window
    to resize as you zoom. Finally, you''ll learn how to show the same image in two
    (or more) windows and create duplicate images.


    There are several ways to zoom in and out in the GIMP. You can use the Magnify
    Tool found in the Toolbox (Figure 1), choose magnifications using a menu, or use
    keyboard shortcuts. When you zoom in or out to view an image, the image itself
    is not affected, only your view of it.


    > **Figure 1.** You can use the Toolbox''s Magnify Tool, menu commands, or keyboard
    shortcuts to zoom in and out.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_68_0.png)'
  merge: -1
  img_proc: true
- pgno: 69
