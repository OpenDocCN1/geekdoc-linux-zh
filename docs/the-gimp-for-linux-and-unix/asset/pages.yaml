  md: '# To anchor a floating selection to a new layer:


    +   1. Open the Layers & Channels dialog box by right clicking on the image and
    choosing Layers→Layers & Channels from the pop-up menu (**Figure 3**). The Floating
    Selection will be available in the layer window (**Figure 20**).


    +   2. Click the New Layer button at the bottom left of the dialog box. The floating
    selection will be attached to a new layer with the name "Floating Layer" (**Figure
    22**). If you wish, you can rename the layer (see page 95 for details about how
    to do this).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_115_0.png)


    **Figure 22.** When the floating selection is attached to a layer, it is automatically
    named Floated Layer.


    # To anchor a floating selection to an existing layer:


    +   1. **Before** you create the floating selection, opens the Layers & Channels
    dialog box by right clicking on the image and choosing Layers→Layers & Channels
    from the pop-up menu (**Figure 3**).


    +   2. Highlight the layer that you want to add the floating selection to (**Figure
    23**).


    +   3. Create the floating selection. The Floating Selection will be available
    in the layer window (**Figure 24**).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_115_1.png)


    **Figure 23.** Before you create the floating selection, highlight the layer to
    which you want to add the selection.


    # Layers and File Formats


    The GIMP file format, .xcf, saves multiple layers, channels, and guides. So, if
    you want to save these things, save your image as a .xcf file. If you save the
    file to another file format, .tif or .jpg, for instance, all layers will be flattened
    and individual layer information will be lost.'
