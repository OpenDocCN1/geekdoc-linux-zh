- pgno: 284
  md: '# # CREATING IMAGES FOR THE WEB


    The GIMP was originally designed as a program to create graphics for the Web.
    It has expanded from there by leaps and bounds, becoming a full-fledged image
    manipulation program, but it hasn''t lost its Web-based ancestry.


    In this chapter you''ll convert an image to indexed color mode using the WWW-optimised
    palette and learn how to reduce the number of colors in an image to make file
    size smaller. Next, you''ll view and edit the color palette created by an indexed
    image and view the Web color palette. Then you''ll create a back-ground and view
    the Web page theme script-fus to quickly create basic elements, such as buttons
    and bullets, for a Web page. Finally, you''ll find out how to save an image in
    a Web graphic file format and use the GIMP''s special animation filters to create
    an animated gif file.


    #  Ruler Units and Image Resolution


    The GIMP is set up, ready to create graphics for the Web right from the first
    time you use it. You may have already noticed that the ruler measurement unit
    is pixels and the resolution of images is automatically set at 72 ppi (pixels
    per inch). Both of these settings are exactly what you need for creating Web graphics.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Chapter 17


    Notice that this is an RGB image


    # Converting to Indexed Color


    One of the first things you need to do when creating graphics for the Web is to
    convert your image to indexed color. (For details about the indexed model, turn
    to page 35.) There are several options to consider when doing this. You can convert
    the image:


    ![](img/5164bc49fb24f10213e18cc994b7b40c_285_0.png)


    +   - To 255 colors to take full advantage of the widest possible color palette
    (this tends to make file size larger).


    +   - To the least possible number of colors, for instance 120 or 50, without
    sacrificing too much image quality (the fewer colors there are, the smaller the
    file size).


    +   - Using the WWW-optimised palette. This palette contains the 216 colors that
    display the same in every browser.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_285_1.png)


    To convert an image to indexed color:


    +   1. Open the image you want to convert to indexed color (Figure 1).


    +   2. Right-click on the image and choose Image→Indexed from the pop-up menu
    (Figure 2). The Indexed Color Conversion dialog box will appear (Figure 3).


    +   3. To convert the image to 255 colors or less, select the Generate optimal
    palette radio button, then enter the number of colors in the text box.


    +   4. To convert the image to the Web-ready palette, select the radio button
    next to Use WWW-optimised palette.


    Figure 2. Right-click on the image and choose Image→Indexed from the pop-up menu.


    ![](img/5164bc49fb24f10213e18cc994b7b40c_285_2.png)


    Figure 3. Use the Indexed Color Conversion dialog box to use a palette with a
    specific number of colors or use the WWW-optimised palette.


    262'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Creating Images for the Web


    5. If you want to dither the image, select the check box next to Enable Floyd-Steinberg
    dithering.


    6. Click OK. The Indexed Color Conversion dialog box will close and the image
