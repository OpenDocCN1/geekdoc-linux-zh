  md: '# Working with Text


    ![](img/5164bc49fb24f10213e18cc994b7b40c_232_0.png)


    +   8. Use the Weight drop-down list to set whether the text is black (extra bold),
    bold, or medium (regular) (Figure 3). Different options will be available depending
    upon the font you selected.


    +   9. Use the Slant drop-down list to set whether the text is normal (n) or italic
    (i) (Figure 4). Different options will be available depending upon the font you
    selected.


    4. Use the Slant drop-down list to set whether the text is italicized (i) or regular
    (r).


    ![](img/5164bc49fb24f10213e18cc994b7b40c_232_1.png)


    +   10. Use the Set width drop-down list to set whether the spacing is normal
    or condensed. Some fonts offer narrower (condensed) versions. Different options
    will be available depending upon the font you selected.


    +   11. If you want to add extra space around the text, enter a number (in pixels)
    in the Border box text. This is handy if you want to move letters around and need
    extra space.


    +   12. Click OK. The text will appear as a floating selection in the image window
    (Figure 5). You can now move it to a new position, if need be, then anchor it
    to the layer you selected in step 1, or anchor it to a new layer by clicking the
    New Layer button in the Layers & Dialog box. (For more about floating selections
    and anchoring them, turn to pages 99–100.)


    ![](img/5164bc49fb24f10213e18cc994b7b40c_232_2.png)


    Figure 5. The text appears as a floating selection in the image window.


    # What Are Points?


    Text is usually measured in points in most word processing, page layout, and graphic
    image manipulation programs. Unlike pixels, which change size depending upon the
    resolution of your monitor (see page 25 for a sidebar of pixels), a point is a
    fixed value. 72 point text is 1" (2.54 cm) high; 18 point text is 1¼ (6 mm) high.
    The text in this sentence is set in 10 point type.


