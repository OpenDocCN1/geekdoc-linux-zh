    \n## DISTRO\n\n### Fedora opts out live-patching\nAlong the Linux 4.0 kernel release\
    \ brought official support for live-patching for the first time, the Fedora team\
    \ has confirmed that it has no intentions of enabling the feature in its popular\
    \ distribution. Despite planning to release Fedora 22 with the Linux 4.0 kernel\
    \ as standard, the team decided against introducing the new live-patching functionality\
    \ which enables portions of the kernel to be patched without the usual need for\
    \ update. As a result, for Fedora 22 users, “Live-patching could be very useful,\
    \ but it is not quite necessary in Fedora,” said Boyer of the Feature Team, “The\
    \ Fedora team has this functionality disabled, both in Fedora 22 and upcoming.\
    \ We do not really need patching in Fedora itself. It’s understandable that people\
    \ who want to patch without reboot avoid stability issues targeted at small bugs\
    \ and security patches. You cannot patch from kernel 4.0 to 4.1. Given that the\
    \ kernel release is stable enough for the lifetime of Fedora release, we don't\
    \ have opportunity to build live patches. Our update infrastructure is also not\
    \ really geared towards frequent updates.” For fans who would still like to use\
