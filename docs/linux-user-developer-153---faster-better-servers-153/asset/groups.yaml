    ## 顶级 Android 应用


    这些应用并不与项目绑定——你可以随时随地反复使用它们。


    ### 树莓派远程控制 (Raspberry Pi Remote)


    如果你希望能够从远处控制服务，免费的 Raspberry Pi Remote 可能是你的首选。安装它后，只要你的树莓派连接了互联网，你就可以远程控制摄像头模块等设备。


    ### JuiceSS – SSH 客户端


    如果你正在使用 SSH 从其他设备控制你的树莓派，而不是通过你的 Android 平板电脑或手机？Android 有多个终端客户端和支持多设备的 SSH 客户端——我们喜欢免费的
    JuiceSS，因为它有一个清晰、漂亮的界面。


    ### RIPEFR


    这个应用可能更适合大屏幕平板电脑而不是小手机，但它是一份 GPIO 引脚的参考指南，涵盖了 A、B 以及 A+ 布局（树莓派 2 与 B+ 的布局完全相同）。这些内容都非常清晰易懂，而且是免费。


    ### AndFPTP (ftp 文件客户端)


    有时你可能需要向树莓派传输文件，这时你也可以使用 AndFPTP。它比 simple 要简单得多，如果你的树莓派是一个 Web 服务器，它可能会很有用。其设计简单，而
    3.89 英镑的 Pro 版本包含了同步等额外功能。


    ### Rasp-i


    这是一个功能丰富的应用，可以容纳多个树莓派。除了监控树莓派的状态外，你还可以执行 Linux 命令、重启树莓派并处理 Python 脚本。这是一个免费应用，并提供应用内购买项目。


    ### Fing – 网络工具


    Fing 是一个通用的网络扫描器，可以通过名称和 MAC 地址识别网络上的所有设备。你也可以发送 ping 包来测试连接。当我们偶尔忘记树莓派的地址时，它真的非常有用。


    ### VNC Viewer


    为了更有效地远程控制你的树莓派，我们建议使用 VNC Viewer。这是一个优秀的 VNC 客户端可以让你看到桌面 GUI，因此需要在树莓派上运行 VNC
    服务器。RealVNC 有开源版本的服务器，你也可以获取免费许可，该软件仅供个人使用且不包含加密功能。


