    where the latest RPM tools are available. Use uspec-helper to access extra tools:
    spec-cleaner and rediff. The first is a tool for adapting a spec file for debian,
    the second is a tool for comparing sections of a build tree, showing you changed
    variables and values and more. The syntax is simple:


    ```

    spec-cleaner --d spec.new

    ```


    rediff updates a patch file to work with a new version of a source tariff. Place
    the old patch, spec file and a new tariff into a new directory and:


    ```

    rediff-patch <path_to_rediff> <tariff>

    ```


    On the Control tab you are expected to fill in the description, package requirements
    or conflicts, including specific versions. After that, what would you like do
    in the debian/control file?


    The Dependencies and Conflicts allow you to specify package requirements or conflicts,
    including specific versions. After that, select the package contents on the Files
    tab, create a desktop menu entry on the Menu tab and press the green button on
    the Build tab to generate the DEB package. With this tool, it should be both faster
    and easier to create a Debian package:


    www.linuxuser.com 27'
  - '[PAGE 27]


    # Tutorial Game controllers


    # Set up game controllers to work on Linux


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_27_0.png)


    Try out Linux with a PlayStation, Xbox or other USB controller - perfect for media
    PCs


    Keyboard and mouse are the mainstay of GUI interaction. While we may laugh at
    the very first mice from the Sixties, it''s been the primary way we interact with
    graphical interfaces for a long time now, and even with the advent of touchscreen
    computers it doesn''t seem like it''s going away. Using a gamepad as an alternative,
    there are still other ways to control on a graphical desktop. In this cases, we''re
    talking about game controllers. They are quite simple in many ways - you move
    the point and press to interact. The moving part is a little different of course,
    but it''s functionally the same.


    Rob Zwweets

    models complex systems developer proficient in Python. He loves to experiment
    with computing


    # Resources


    +   Desktop environment

    Compatible USB game controller


    In this tutorial we''re going to show you how to set up a USB controller with
    a Linux environment, with clicks and extra buttons for the controllers that have
    more than a few inputs. Having a setup like this can be good for many reasons,
    having a low number of USB ports or a media PC, for example. We''ll show you how
    to give it a try.


    # 01 Universal controllers


    To start with, we''re going to look at making USB controllers and PS3 controllers
    work on Linux as mice. These connect via normal drivers in the kernel, so all
    we need to do is change the settings with X to make them work.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_27_1.png)


    > They are quite similar to a mouse in many ways - you move the point and press
    to


    Above You''ll need a USB or previous-gen console controller


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_27_2.png)'
