    # 教程


    # 适用于树莓派的顶级 Android 应用


    将最实用的工具下载到你随身携带最多的设备上。


    通常情况下，我们的教程是关于完成某个特定项目并达到特定目标的。然而，这一次我们要尝试一些与众不同的。我们将展示一些可以与你的树莓派一起使用的 Android
    应用。这些应用并不限于特定的项目——你可以随心所使用，它们可以为你的整个树莓派体验增添色彩。列表中的某些应用是树莓派专用的，而另一些是通用的但在树莓派发布的。你可能已经知道其中一两个，但我们希望你能从这些精选中发现发现。如果你有一台
