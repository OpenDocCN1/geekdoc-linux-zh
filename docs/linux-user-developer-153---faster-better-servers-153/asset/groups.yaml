    # 通过你亲自构建的升级型或全新的服务器来提升你的计算能力


    虽然大型企业和大数据可能正在使用更多的服务器，但服务器的概念在短期内不会消失。无论你的 IT 基础设施有多大，服务器都是任何系统中不可或缺的一部分。无论是位于数据中心，还是隐藏在你的（通风良好的）基座服务器中，在
    2015 年服务器仍有许多用途。对于办公室来说，你可能想省点钱，那么家用服务器非常适合你的需求，而且你完全知道该如何维护它。


    你可以以更高效的方式控制网络中的某些方面。服务器有许多组件需要注意，但归根结底就是合适的硬件选择以及针对当前任务的良好选择。在教程中，我们将专注于文件服务器和
    Web 服务器，这两种服务器系统可以通过多种方式进行扩展和修改，以适应你所处的情况。在教你如何构建一个更好的 Web 服务器之后，我们将先简单转转弯，告诉你如果你想升级当前的服务器以与新技术竞争，你应该了解哪些知识。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_13_0.png)


    ## # 升级到更好的服务器


    如果你有一台服务器，升级可能就是它运行得更好所需。


    你可能已经有一台服务器，在这种情况下，与其实际上从零开始构建更好的服务器，你可能只是想升级你的服务器使其比以前更高效。实现这一点的有多种方法，其中一些需要硬件升级。如果你决定走硬件升级路线，只需查看我们推荐的硬件类型概述并了解相关内容即可。对于
    Linux 系统，你可以简单地在机箱中添加一个额外的硬盘，只要你在位槽和电源方面有空间。安装完成后，重启系统并添加新硬盘，使其自动挂载到特定位置——例如，挂载到存储空间更大的文件系统。否则，你可以创建一个文件系统的副本，删除它，然后将其恢复到更大的硬盘上，其工作方式几乎没有变化。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_14_0.png)


    在服务器中，内存比台式式 PC 重要得多，因为你需要为几个人提供服务。


