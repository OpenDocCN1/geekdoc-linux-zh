    # Tutorial


    # ExpEYES

    &; PHOENIX


    ExpEYES was developed by Ajith Kumar and his team as part of the PHOENIX (Physics
    with Equipment and Interactive Experiments) project, which was started as a part
    of the outreach program of the Inter-University College Maths (IUCM) in New Delhi,
    India. Our objectives are to provide affordable laboratory equipment and training
    to teachers using it-based lesson plans.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_61_0.png)


    For recovery mode, hold


    # 07 Install the software


    Que of efforts from community members Khadnare, there are DEB packages available
    for the ExpEYES software that work properly on Debian, Ubuntu, Linux Mint and
    more. All dependencies are included in the official repository, so all you need
    for the ExpEYES software is to open an LXTerminal on the Raspberry Pi and then
    run the following commands:


    ```

    sudo apt-get update

    sudo apt-get install expeyes

    ```


    # 08 Install dependencies


    ExpEYES has a number of dependencies that are required for it under, as well as
    any other recommended libraries. During the installation in Step 7, the dependencies
    should be installed by default. However, to avoid any problems, you can run the
    following command in order to make sure they are all installed:


    ```

    sudo apt-get install python-exeyes python-exeyes-imaging-python-tk grace python-numpy-scipy
    python-python

    ```


    # 10 Overclocking continued


    Overclock sometimes causes instability in your Raspberry Pi or an inability to
    boot. If this happens you press and hold the Shift key to reach the above splash
    screen to boot into mode. You can then reduce the overclock setting and repeat
    until you find the highest stable setting


    # 11 Resistance of the human body


    An interesting experiment for your first time using oscilloscope to measure the
    resistance of the human body over time. This is easy to accomplish with just three
    bits of wire and a resistor. Connect the ExpEYES to A1 and A2, connect the resistor
    between A2 and ground, and connect an open-ended wire out of P1 and P2. Plug in
    the ExpEYES control panel, drag A1 to CH1 and A2 to CH2, and hold the wires in
    hand and watch the response on the ExpEYES control.


    # 12 Run the maths


    From the final plot, you will see that the input on CH1 is coming around 3.99
    volts (which is great because it is close to 4V). The value on (CH2) is 0.9 volts
    us, which implies that the voltage across the unknown resistor value is (V = 4
    - 0.9 = 3.1V). Using Ohm''s law (R=V/I) we can calculate the current (I = 3.1V
    / 0.0000045A = 4.5 µA). Using this value then we can calculate the resistance
    of the body using the same formula (R = 3.1V / 0.0000045A = 688888 ohms = 689
    kO). This is a very high value. The resistance of the human body depends heavily
    on how your skin is and the range of values (from 1000 to 100000 ohms)


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_61_1.png)


    # 09 Overclocking Raspberry Pi (optional)


    The ExpEYES software will run on a Raspberry Pi with default settings, however
    it can be slow if you are using a Model A, or B+. If you are using a Model 2,
    you don''t need to overclock (but you can overclock it to run it faster).


    On an LXTerminal and use step 7, select the ''Overclock'' option. Click OK on
    the screen to see some code run. Once it completes, press OK again and you will
    be brought back to the main window. Select Finish in the bottom right and reboot
    to your Raspberry Pi.


    # 13 Use the Python library


    The ExpEYES team has built-in Python library for your device. This is simple to
    use the library and it allows you a bit more versatility than what is possible
    to use ExpEYES scripts. If you have followed the installation instructions above,
    all you need to do is import the Python module and then initialise ExpEYES using:


    ```

    import expeyes

    expeyes.open()

    ```


