    \n生成的样本随后被放置在采样缓冲区（sample buffer）中。如果缓冲区已满，则会清除该条件并通知 `synth_loop` 线程缓冲区刚刚填满。此时此时，合成器将清空已播放完毕的缓冲区并对其进行循环处理。\n\
