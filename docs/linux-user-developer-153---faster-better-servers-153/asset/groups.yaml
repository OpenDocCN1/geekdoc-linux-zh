    ### Usecheck when you build an application or a library from source


    - Follow policies

    - Whether you build out custom packages locally or through repositories, the distribution-specific
    package building policies for Linux apply. For Ubuntu, Debian, Fedora, openSUSE,
    see details in the main policy controls fields should be accurately marked as
    growing repositories may impact performance.


    ### 04 Drawing a dummy spec

    The image on page 24 illustrates a simple spec file, which can be compiled into
    an RPM containing nothing. To make things work before you rebuild, use the %build(dummy)/usecheck
    directory. During build, usecheck may run on many issues, such as when you want
    to fix problems rather than just the score, or if you choose to set the Build-Failed
    command in your spec. For a package that includes unauthorized permissions, add
    it here.


    ### 05 A simple way to use usecheck

    Usecheck is available to use when you build an application or library from source.
    Usecheck works in Debian and Red Hat, where you can check for details (package
    name, version, description, etc.) and author fields. You can keep your clean system
    tidy and free. If you need to wipe off files, simply remove the usecheck from
    your package manager tool (apt, yum, or dnf). You can''t install-usecheck scripts
    with it, and it''s not working when packing some properties, as it needs extra
    hooks for many systems. However, usecheck is for local installations or small
    OEM tasks, to try.


    ### 06 A brief look at handling the deb format

    Just like RPM, DEB files can be opened with archive managers so that you can see
    all the other tarballs: data.tar.gz and control.tar.gz. They are pretty self-explanatory:
    the first contains package files, the second contains metadata. DEB packages are
    different from RPM but still straightforward. Since in Debian/Ubuntu and its clones
    there is one dominating technology to handle packages and repositories and it
    has various charms, such as appropriate fields for search queries, while deb is
    a simple package manager tool (similar to RPM).


