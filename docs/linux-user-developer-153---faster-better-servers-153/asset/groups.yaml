    # Tutorial AWS Cloud


    ## 09 Set up Postfix as MTA


    Install Postfix with the package manager of your distribution, like so:


    ```

    yum install postfix

    ```


    ...and start the service using:


    ```

    service postfix start

    ```


    In order to start Postfix on autostart upon system reboot, add it to chkconfig
    using the command:


    ```

    /sbin/chkconfig --level 345 postfix on

    ```


    ## 10 Change the hostname of your EC2 virtual machine


    On EC2, Amazon assigns a hostname to your instance based on its IP address. This
    setting is reflected in the ''Received'' header. To change the hostname of your
    EC2 instance, edit the file /etc/sysconfig/network:


    Replace ''hostname=local.domain'' with


    ```

    HOSTNAME=mail.mydomain.com

    ```


    ...with the value of choice, such as mail.mydomain.com.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_33_0.png)


    ## 11 Basic configuration of Postfix


    Open the configuration file of Postfix in your choice:


    ```

    nano /etc/postfix/main.cf

    ```


    Find the following addresses and make sure they correspond to your settings as


    ```

    $mydomain = $domain

    hostname = mail.mydomain.com # the hostname of the MX server

    mydomain = $mydomain.com # the fully qualified destination = $mydomain, localhost,$mydomain,
    localhost

    mydetwork_style = static

    inet_interfaces = all

    home_mail = Maildir/

    ```


    Save the file and restart the Postfix daemon:


    ```

    service postfix restart

    ```


    ![table showing Postfix configuration parameters]


    ## 12 Test outgoing mail in the command line


    Postfix should be able to send outgoing mail from the command line as:


    ```

    echo "testing Postfix: Linux users" | mail -s test user@email-address.com

    ```


    Identifying the system user as the sender in the ''From:'' header. Postfix will
    accept incoming mail for Linux users and save messages in the user''s home directory:


    ```

    /home/user/Maildir/

    ```


    To verify the Postfix daemon is running in the background, you can peek into its
    mail log with the command:


    ```

    /var/log/maillog

    ```


    Fetching mail from the local server directory over SSH is the enhancement that
    we''ve provided for. Now that Postfix is running, it''s time to set Dovecot.


    ## 13 Install Dovecot


    Install the Dovecot binary:


    ```

    yum install dovecot

    ```


    Start the service:


    ```

    service dovecot

    ```


    Ensure that Dovecot starts on reboot:


    ```

    /sbin/chkconfig --level 345 dovecot

    ```


    ## 14 Dovecot has connections to listen for


    Open the configuration file of Dovecot:


    ```

    nano /etc/dovecot/dovecot.conf

    ```


    Set the following parameters:


    ```

    protocols = imap lmtp

    listen = *, ::

    ```


    Save the file and quit the editor.


    > Keep it simple

    > When setting up email servers, remember to keep it simple. Avoid fancy encryption
    and endpoint authentication that might make the mail work flawlessly. If you hit
    a roadblock later in the configuration, it will be easier to debug the cause.


    ## 15 Tell Dovecot to look for mail


    Open the following config file:


    ```

    /etc/dovecot/conf.d/10-main.conf

    ```


    in order of choice and select the mail location of Dovecot to the same place as
    the mail directory used by Postfix the latter is defined in /etc/postfix/main.conf.


    Look for the passwd and userdb sections. Make the necessary adjustments to these
    sections that include:


    > Above for

    > in-depth guides to Dovecot''s config file,

    > check the wiki at

    > bit.ly/1VEMZ


    ```

    passwd (driver = passwd-file)

    addr = /etc/passwd-dovecot

    userdb (driver = static)

    mail_location = /home/$user/home=$

    mail_location = maildir:/Maildir/

    ```


    ## 16 Enable authentication for test


    Open the Dovecot configuration file:


    ```

    /etc/dovecot/conf.d/10-master.conf

    ```


    Scroll down to the section:


    ```

    service mail-login (# ...

    inet_listener_maps = (

    ```


    and switch SSL authentication to narrow down possible connections to settings:


    ```

    ssl =

    ```


    Save and close the file. Open the new file as:


    ```

    /etc/dovecot/conf.d/10-auth.conf

    ```


    and set these authentication parameters to allow:


    ```

    disable_auth = no

    auth_mechanisms = plain

    ```


    This is not safe, fact As your configuration is functional, remember to reverse
    this and use SSL encryption, using a trusted authority!


    ## 17 Setup authentication with a password file


    GNU nano 3.2.1 File: .../dovecot/conf.d/a Set up


    ```

    # -d connect to user@domain if there is no domain

    # to home directory

    ```


    ```

    doc <wiki/Variables.txt for full list, see examples:

    mail_location =home/user/Maildir/

    mail_location =home/user/Maildir/var/index/mail/

    # <doc/wiki/UserDatabase.txt>

    ```


    ```

    # Authentication for system users. Included from auth.conf

    # <doc/wiki/PasswordDatabase.txt>

    # PAM is typical nowadays for most systems.

    # You will need /etc/passwd-dovecot to use userdbd

    # authentication to actually work. <doc/wiki/PasswordDatabase.txt>

    ```


    ```

    # If you need special permissions to change directory

    attributes, do it by following this method:

    chown -R user:group /home/user/Maildir

    chmod 700 /home/user/Maildir

    ```


    ## 18 Create a password database


    For the sake of simplicity, this file will serve as your database for mail users.
    In most trivial implementation, ''password database'' uses the following format:


    ```

    /etc/passwd

    ```


    Note that passwords should only be used during initial configuration to narrow
    down potential issues. SSL is not a permanent solution: Dovecot''s versatile authentication
    methods for today.


    ## 19 Adjust user privileges


    When authenticating users for email, Dovecot needs appropriate access privileges.
    You can adjust them (for ec2-user as an example) like:


    ```

    chgrp -Rf /home/user/Maildir/

    chown -Rf /home/user/Maildir/

    chmod /home-user/Maildir/

    ```


    ## 20 Restart Postfix and Dovecot


    ```

    service postfix restart; restart dovecot

    ```


    Postfix and Dovecot are now operational in the simplest of all configurations.
    Linux users should be able to set up mail via IMAP on standard port 143 and SMTP
    without configuration, and then read as email.


    # Tutorial WebKit


    ## Build WebKit on a Linux system


    For a few years back, it seemed like every new browser was made in WebKit. While
    Apple''s Safari, Google''s Chrome and the Chromium project seemed to launch it
    into the spotlight and result in its dominance. While the standard source is optimized
    for OS X and Windows, there is a branch for Linux. With this source you can continue
    to develop your own browser using WebKit as a lightweight engine. In this tutorial,
    we will show you how to get WebKit up on your system, with some pointers on how
    to construct a browser using the source that you then go and begin custom project.


    Rob Wesley models complex systems and is a web developer with Python, Django and
    PHP He loves to experiment with concurrency


    ## 01 Grab the source code


    We need to get the source code for WebKit, which is part of the normal WebKit
    source tree. Open up a terminal and cd to the place you like to keep your source,
    or create a new directory for it with mkdir. Sync the source locally in the terminal
    with:


    ```

    git clone https://github.com/webkit/webkit.git

    ```


    The source will take up just 4 GB of space, so make sure you have space and something
    to do while you wait.


