    Store and serve files around your network or further


    File servers are very useful for both home and business environments. For home,
    it''s a good way to have a low-power, dedicated solution to storing your media
    without needing to specifically turn on your desktop machine to get the files
    - a desktop machine that might use more power than using one.


    For enterprise, it can not only be for backups, but also provides for off-machine
    networked storage for individual users that can be accessed from within and outside
    the network. So, let''s set up a server.


