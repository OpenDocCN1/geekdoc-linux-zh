    ```

    yum install postfix

    ```


    ...并使用以下命令启动服务：


    ```

    service postfix start

    ```


    为了让 Postfix 在系统重启时自动启动，请使用命令将其添加到 chkconfig 中：


    ```

    /sbin/chkconfig --level 345 postfix on

    ```


    ## 10 更改你的 EC2 虚拟机的主机名


    在 EC2 上，Amazon 根据其 IP 地址为你的实例分配主机名。此设置会反映在“Received”（接收）头部中。要更改 EC2 实例的主机名，请编辑
    `/etc/sysconfig/network` 文件：


    将 ''hostname=local.domain'' 替换为：


    ```

    HOSTNAME=mail.mydomain.com

    ```


    ...以及你选择的值，例如 mail.mydomain.com。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_33_0.png)


    ## 11 Postfix 的基础配置


    在你选择的编辑器中打开 Postfix 配置文件：


    ```

    nano /etc/postfix/main.cf

    ```


    找到以下地址并确保它们与你的设置对应：


    ```

    $mydomain = $domain

    hostname = mail.mydomain.com # MX  服务器的主机名

    mydomain = $mydomain.com # 完全限定目标地 = $mydomain, localhost,$mydomain, localhost

    mydetwork_style = static

    inet_interfaces = all

    home_mail = Maildir/

    ```


    保存文件并重启 Postfix 守护进程：


    ```

    service postfix restart

    ```


    ![显示 Postfix 配置参数的表格]


    ## 12 在命令行中测试发出的邮件


    Postfix 应该能够从命令行发送外出的邮件：


    ```

    echo "testing Postfix: Linux users" | mail -s test user@email-address.com

    ```


    在“From:” 头部中将系统用户识别为发送者。Postfix 将接受来自 Linux 用户的邮件并将消息保存存在用户的家目录中：


    ```

    /home/user/Maildir/

    ```


    要验证 Postfix 守护进程是否在后台运行，你可以使用命令查看其邮件日志：


    ```

    /var/log/maillog

    ```


    通过 SSH 从本地服务器目录获取邮件是我们为你提供的增强功能。现在 Postfix 正在运行，是设置 Dovecot 了。


    ## 13 安装 Dovecot


    安装 Dovecot 二进制文件：


    ```

    yum install dovecot

    ```


    启动服务：


    ```

    service dovecot

    ```


    确保 Dovecot 在重启时启动：


    ```

    /sbin/chkconfig --level 345 dovecot

    ```


    ## 14 Dovecot 有待监听的连接


    打开 Dovecot 配置文件：


    ```

    nano /etc/dovecot/dovecot.conf

    ```


    设置以下参数：


    ```

    protocols = imap lmtp

    listen = *, ::

    ```


    保存文件并退出编辑器。


    > 保持简单

    > 在在设置邮件服务器时，请记住保持简单。避免可能让邮件工作完美运行的复杂加密和端点身份验证。如果你稍后在配置遇到障碍，调试原因将变得更容易。


    ## 15 告诉 Dovecot 查找邮件


    打开以下配置文件：


    ```

    /etc/dovecot/conf.d/10-main.conf

    ```


    根据你的选择，将 Dovecot 的邮件位置设置为与 Postfix 使用的邮件目录相同的地方，后者定义在 `/etc/postfix/main.conf`
    中。


    查找 passwd 和 userdb 部分。对这些部分进行必要的调整，包括：


    > 以上是关于

    > Dovecot 配置文件的深度指南，

    > 请检查 wiki：

    > bit.ly/1VEMZ


    ```

    passwd (driver = passwd-file)

    addr = /etc/passwd-dovecot

    userdb (driver = static)

    mail_location = /home/$user/home=$

    mail_location = maildir:/Maildir/

    ```


    ## 16 为测试启用身份验证


    打开 Dovecot 配置文件：


    ```

    /etc/dovecot/conf.d/10-master.conf

    ```


    滚动到以下部分：


    ```

    service mail-login (# ...

    inet_listener_maps = (

    ```


    并将 SSL 身份验证切换以缩小可能连接的设置范围：


    ```

    ssl =

    ```


    保存并关闭文件。打开新文件作为：


    ```

    /etc/dovecot/conf.d/10-auth.conf

    ```


    设置这些身份验证参数以允许：


    ```

    disable_auth = no

    auth_mechanisms = plain

    ```


    事实是不安全的。由于你的配置是功能性的，请记住反转此操作并使用受信任权威机构的 SSL 加密！


    ## 17 使用密码文件设置身份验证


    GNU nano 3.2.1 文件: .../dovecot/conf.d/a 设置


    ```

    # -d 如果没有域名，则连接到 user@domain

    # 目录

    # 家目录

    ```


    ```

    doc <wiki/Variables.txt 获取完整列表，请参示例：

    mail_location =home/user/Maildir/

    mail_location =home/user/Maildir/var/index/mail/

    # <doc/wiki/UserDatabase.txt>

    ```


    ```

    # 用于系统用户的身份验证。包含自 auth.conf

    # <doc/wiki/PasswordDatabase.txt>

    # 如今对于大多数系统，PAM 是典型的。

    # 你需要 /etc/passwd-dovecot 来使用 userdbd

    # 身份验证才能生效。<doc/wiki/PasswordDatabase.txt>

    ```


    ```

    # 如果你需要特殊权限来更改目录属性，

    # 请按照此方法操作：

    chown -R user:group /home/user/Maildir

    chmod 700 /home/user/Maildir

    ```


    ## 18 创建密码数据库


    为了简单起见，此文件将作为你的邮件用户数据库。在大多数简易实现中，“密码数据库”使用以下格式：


    ```

    /etc/passwd

    ```


    注意，密码应仅在初始配置期间使用，以缩小潜在问题。SSL 并不是永久解决方案：今天的 Dovecot 有多种身份验证方法。


    ## 19 调整用户权限


    在对用户进行身份验证时， Dovecot 需要适当的访问权限。你可以这样调整它们（例如针对 ec2-user）：


    ```

    chgrp -Rf /home/user/Maildir/

    chown -Rf /home/user/Maildir/

    chmod /home-user/Maildir/

    ```


    ## 20 重启 Postfix 和 Dovecot


    ```

    service postfix restart

    service dovecot restart

    ```


    测试发送邮件：


    ```

    echo "test email" | mail -s "test subject" user@example.com

    ```


