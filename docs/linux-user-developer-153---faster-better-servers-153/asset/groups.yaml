    With Postfix and Dovecot you can set up and run your own mail server in the cloud
    on a Linux server.


    A mail server consists of two components: an MTA (Mail Transfer Agent) and an
    MDA (Mail Delivery Agent). An MTA such as Postfix transfers email messages between
    the Internet and an MDA such as Dovecot delivers them to the file of your server.


    ## 01 Launch an EC2 instance of Linux


    In a web browser, sign in to your AWS account (preferably using the root password).
    Navigate to the EC2 section of the AWS Management console and launch a new EC2
    instance (for example, Amazon Linux). Here, the instance is running Amazon Linux
    from RHEL/Fedora family.


