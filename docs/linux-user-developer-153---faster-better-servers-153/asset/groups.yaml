    # Build your own DEB and RPM packages


    Replace your ''make install'' habit and learn how to deliver Linux software like
    a pro


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_23_0.png)


    If you count the most prominent and well-known Linux distributions, you''ll notice
    nearly all of them use two packages: DEB or RPM. The first one and its derivatives,
    the RPM was originally created by Red Hat. Both belong to the same approach: every
    file in a system must belong to a package, the whole installation is a collection
    of binary packages.


    The Linux naturally breaks into two parts, DEB and Red Hat systems are different
    and require different sets of commands. However, as you will see later, the procedure
    is really straightforward and easy to follow once you have got your head around
    a few examples.


    Though I was born without wit, I started writing on Linux when I first installed
    my floppy disk. Maybe you''re already familiar with building Linux applications
    from source, or you just want to deliver to your distro''s official repositories.


    | File | Edit | Bookmarks | Tools | Settings | Help | Close | Red Hat |

    |---|---|---|---|---|---|---|---|

    | New | Open | Save As | | | | | |


    Summary: A Linux RPM. Creates file prefix

    Version: 1

    Vendor: Linux User

    Package: dummy

    License: GPG

    Group: System/Libraries

    BuildArch: noarch

    Source: dummy.file

    description: Creates some dummy files


    ```

    #install

    # create directory $(buildroot)/dummy

    # (%install) -d -m 755 $(buildroot)/dummy

    # and copy the file from SOURCE1 to $(buildroot)/dummy

    # (%install) -m 644 $(SOURCE1)$buildroot)/dummy

    # (%install) -m 644 $(SOURCE1)$buildroot)/dummy/another.file

    ```


    ```

    %files

    $(buildroot)/dummy

    $(buildroot)/another.file

    ```


    The right file has an easy-to-read structure and a lot of macros, which you are
    advised to learn. Line: .spec


    # From repository


    If you decide to build packages, you may want to organise them into repositories
    to use with software management tool. In the case of Ubuntu and Debian, you will
    need to install dpkg-dev package. Now, put .deb files into a directory of your
    choice. You will then need a script to create and maintain repository files; it
    could be like:


    ```bash

    #!/bin/bash

    cd /path/to/debs

    dpkg-buildbuild --gz Packages

    ```


    Finally add a line to sources, the line will look like this:


    ```

    [local]

    name=your-distribution-release

    baseurl=file:///path/to/repo

    enabled=1

    gpgcheck=1

    ```


    Yum repositories are also supported in OpenSUSE/Suse Linux Enterprise, and you
    can add them with the YaST software or the command line, like this:


    ```bash

    zypper addrepo 1 /path/to/repo

    ```


    It''s really simple to create our packages now!


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_24_0.png)


    # 01 Why we might need to edit


    Let us list some cases where your files are in a package. To start with, your
    distribution may make the package you need. You may need to build it from scratch
    (the hard way) or use distribution (generally preferred). However, not all software
    is open, so you may need a binary-only application or a set of files to make it
    installable with a few clicks. This is often the case for proprietary software,
    software items like Skype or Skype.


    # 02 The inside of RPM


    When you download an RPM file it will be easy to install and test, but you can
    also use it as an archive file. RPM file is just like a ZIP archive. It works
    the same way as you. When you''ll see the file, there''s more to it as RPM contains
    metadata which contains scripts to execute after installation, permissions, copying
    and removing files, or any other action in bash.


    When you unpack an RPM file it is designed for, if x86_64, i386, or noarch, it
    is generated from a source of an application and a file which defines the commands
    and requirements to build it. This is also known as SRPM. If you need to repack
    a property application, sometimes only a property spec file is required, as it
    obtains the rpm files automatically.


    # 03 Compile RPM from a source RPM


    For the impatient, the command is: rpmbuild --build /tmp/rpmbuild-1.0.0-source.rpm.
    Another way is to install the source packages as follows:


    DEB and RPM packages are easy to install and use. You can always pull out their
    contents with standard archive managers.


    # Alien vs DEB/RPM


    Alien is a tool that converts a deb package into an RPM package. It works greatly
    for many things like binary-only packages that need a DEB to RPM, using the following:


    ```bash

    alien -c /path/to/yourpackage.deb

    ```


    ```bash

    rpm -i /tmp/rpmbuild-mypackage.spec

    ```


    and then address the spec file:


    ```bash

    rpmbuild --build &mypackage.spec

    ```


    Note that all comments should be issued under a regular user account and not,
    due to security reasons.


    To make things work, you''ll need the rpmbuild and all dependencies and compilers
    required to build it. If you need to install a package something that is already
    present in your system''s packages, you may try zypper -d my package in OpenSUSE,
    yum install build-package in OpenHEL/Magora.

