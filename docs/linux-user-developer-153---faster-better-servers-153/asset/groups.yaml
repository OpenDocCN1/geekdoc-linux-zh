    that offers better tool sets for audio and video production design and publishing.
    15.04 brings with it many of the changes that were seen in Ubuntu 14.04, among
    the them back to Xfce 4.2 which brings some small improvements.


    The only real change is the addition of a new meta package for the audio-based
    setup. Many of the other de-packages are self-contained. Ubuntu Studio brings
    in audio editors, synthesizers, virtual amps, JACK and Gladish for connecting
    them and pairing audio through your workflow. Blender, OpenShot, GIMP and Ink
    for image, DaVinci and Shotwave for video, and others. Audacity, OpenOffice and
    Calibaf for publishing, plus software for designing de-figns.


    It''s a distribution with all the software clearly created and, importantly, Ubuntu
    Studio is a desktop for anyone. Xfce is a great desktop environment which, while
    better than Ubuntu, offers the same experience as outside its creative software.
    Even if you''re not looking for ways to make video or audio using FOSS, you will
    enjoy the many benefits of this distro in daily use as well as in the occasional
    creative project.


    In fact, there are tools in Ubuntu Studio even for non-creative users, typescript
