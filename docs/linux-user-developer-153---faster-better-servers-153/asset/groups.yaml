    ## DEB & RPM 包教程


    ### 当从源码构建应用程序或库时使用 usecheck


    - 遵循策略

    - 无论你是在本地构建自定义包还是通过仓库构建，都适用于特定的 Linux 发行版包构建策略。对于 Ubuntu、Debian、Fedora、openSUSE，详情请参见主策略控制字段，这些字段应准确标记，因为增长的仓库可能会影响性能。


    ### 04 绘制一个虚拟 spec (dummy spec)

    第 24 页的图片展示了一个简单的 spec 文件，它可以编译成一个没有任何内容的 RPM 包。在重新构建之前使其运行，请使用 `%build(dummy)/usecheck`
    目录。在构建过程中，usecheck 可能会针对许多问题运行，例如当你想修复问题而不仅仅是评分时，或者你在 spec 中设置了 Build-Failed 命令时。对于包含未授权权限的包，请将其添加到此处。


    ### 05 使用 usecheck 的简单方法

    当从源码构建应用程序或库时，可以使用 usecheck。usecheck 在 Debian 和 Red Hat 中可用，你可以在其中检查详情（包名、版本、描述等）和作者字段。你可以保持系统整洁无闲。如果你需要删除文件，只需从你的包管理器工具（apt、yum
    或 dnf）中移除 usecheck。你无法用它安装-usecheck 脚本，而且它在打包某些属性时不起作用，因为许多系统需要额外的钩（hooks）。不过，usecheck
    用于本地安装或小型 OEM 任务。


    ### 06 简述 deb 格式

    像 RPM 一样，DEB 文件可以使用管理器打开，这样你可以看到所有的 tar 包：data.tar.gz 和 control.tar.gz。它们非常自而易见：第一个包含包文件，第二个包含元数据。DEB
    包与 RPM 不同，但仍然直观。由于 Debian/Ubuntu 及其克隆版本中有一种处理包和仓库的主导技术，它具有各种特性，例如用于搜索查询的适当字段，而
    deb 是一个简单的包管理器工具（类似于 RPM）。


    ### 07 构建 DEB 包

    首先，获取基础性组件：


    ```bash

    sudo apt-get install build-essential autotools-dev dpkg-dev deb-helper-mk

    ```


    假设你已经有了 `my-package-0.2.tar.gz`，你想将其转换为 DEB 包，首先手动创建一个如下的构建目录：


    ```bash

    debuild -p /src/my-package/0.2

    ```


    然后将该目录放入并解压（`tar xzf my-package-0.2.tar.gz -C .`），使用以下命令构建程序：


    ```bash

    ./configure --prefix=usr && make

    ```


    如果你正在重新编译一个已于某个仓库中的程序，可以先使用 `apt-build-dep mypackage` 来轻松解决依赖关系，以便 `./configure`
    运行得更顺畅。


