    \nwww.linuxuxer.com | 67\n\n# Python column\n\n## Profiling Python Code\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_67_0.png)\n\
    \nJoey Benard is a software engineer who spends his time building tools for researchers\
    \ with scientific computing and writing apps.\n\nOne of the problems when writing\
    \ code on the Raspberry Pi is that the resources are limited, which means that,\
    \ as a programmer, need to be more aware of what your code is doing and how it\
