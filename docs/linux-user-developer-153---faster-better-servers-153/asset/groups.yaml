    # Science on Pi


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_60_0.png)


    The EXPEYES kit contains everything you need to get underway, with over 50 documented
    experiments from the EXPEYES website. The only other thing you might need in hand
    is a computer. You will also need a Raspberry Pi or another computer with a USB
    port to run the digital oscilloscope software and connect to EXPEYES.


    # 02 Open it up


    It pays dividends to make sure your operating system is updated to the latest
    version, before you start with a lot of hassle


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_60_1.png)


    The kit itself is highly portable and great for taking down to Dams and hackpaces


    # 03 What''s inside?


    As you may guess, the EXPEYES kit includes the main EXPEYES digital oscilloscope,
    but it also contains a range of other hardware including a DC motor, magnets,
    LEDs, piezoelectric disks, and a small screwdriver for opening the screws and
    more. You also get a CD with the EXPEYES software and documentation ready to go
    on a doable date.


    # 05 Using the live CD


    Perhaps the easiest way to get up and running with a computer with a CD is to
    use the live CD included in the EXPEYES kit. Making sure you are booting into
    the live CD from your BIOS boot menu, then be greeted with a Linux-based desktop.
    For more see Applications:EXPEYES-Journal. You can run it from a terminal window:


    # Supported platforms


    # 04 What can it do?


    The chip at the heart of the EXPEYES is an ARM Cortex-M4 microcontroller, running
    at 8 MHz connected to a USB interface. These are low-cost parts but provide great
    value for money. As we have already mentioned, the EXPEYES is capable of acting
    as a four-channel oscilloscope with high resolution and a built-in signal generator
    of variable frequency. At some point, that''s an impressive set of features that
    can accurately ensure that nothing is missing critical (like learning, hobby projects,
    quick readings and so on).


    ```

    sudo python /home/shares/expeyes/crop.js

    ```


    # 06 Update your Raspberry Pi


    As with every project you undertake on the Raspberry Pi it pays dividends to make
    sure that your system is updated to the latest version, as this can save you a
    lot of hassle. To do this use the LX terminal and then sudo apt-get update followed
    by sudo apt-upgrade and wait patiently for the upgrade process to complete.


    The EXPEYES software is written in Python. The core software you device is epistemic:
    if we can run it and it has a Python module to be enabled it will work with any
    USB port. You can visit the EXPEYES website for pages that explain how to work
    with software on Linux at www.expeyes.com. Installation, there is also a way that
    will enable you to work without having a USB capability.'
