- md: "\n# Tutorial Subversion\n\n## Locking your files\n\nLocking is important to\
    \ understand that in Subversion, it is a mechanism that can prevent exclusion\
    \ between users to avoid conflicts. However, everyone will have a unique lock\
    \ on repository items including creation, enforcement and removal.\n\nChanges\
    \ can be easily unnamed using the svn command. It can be noted here that the properties\
    \ respond to the issues of use like svn commit, svn update and revert in the same\
    \ way that the contents of the file do.\n\nAs expected, the former will allow\
    \ the developer to see the current value of a property that they are about. One\
    \ can retrieve information about the file and directory properties by using the\
    \ svn and diff commands. It is illustrated in the following:\n\n```bash\n### [root@biblr-swampaj]#\
    \ svn status properties\n```\n\n```bash\n# feature/properties.txt\n```\n\n```bash\n\
    ### [root@biblr-swampaj]# svn diff properties\n```\n\n```bash\n# feature/properties.txt\n\
    ```\n\nProperty changes on feature/properties.txt\n\n```bash\n> [root@biblr-swampaj]#\
    \ svn lock feature:properties.txt\n\n> \"feature/properties.txt' locked by user\
    \ 'xxx\"\n```\n\nNow, if the user 'xxx' tries to lock the same file, Subversion\
    \ will throw an error. But the user can forcibly lock the same file using the\
    \ --force-option, as shown below:\n\n```bash\n[root@biblr-swampaj]# svn lock feature:properties.txt\n\
    \"feature/properties.txt' locked by user 'xxx\"\n```\n\nYou can also pass a message\
    \ to the lock with the -m option, and this message will be the reason for locking.\
    \ Unlike the svn commit, the lock does not have the preferred text. It is also\
    \ important that the lock will show the latest version of the file. If that was\
    \ not the case, the repository would have requested the lock request update and\
    \ commit lock. As can be seen from the above examples, svn lock command will provide\
    \ the confirmation of a successful commit. When a file is locked or not confirmed\
    \ by the user,\n\nIt's also worth noting that when a developer introduces a new\
    \ version to a control, Subversion will automatically create a lock.\n\nLet's\
    \ look more about locking in Subversion.\n\nA lock can be designated as metadata\
    \ that grants access to one user, the user is referred to as lock owner. Locking\
    \ in Subversion prevents conflicts saves time and effort. By locking a specific\
    \ file, they know that their efforts will not get wasted. It is to be noted that,\
    \ by default, not locked in Subversion means that any one can commit changes to\
    \ the file at any time. Subversion provides the lock lock command to enable a\
    \ user to lock a specific file, preventing others from committing to it. The locked\
    \ file cannot be modified in any way in the repository and can be deleted or removed,\
    \ by the lock owner. The following examples illustrate use of svn lock:\n\n```bash\n\
    ### [root@biblr-swampaj]# svn status feature:properties.txt\n\nK feature/properties.txt\n\
    ```\n\nThe K's displayed next to the file indicates that the lock token is present.\n\
    \nIf we look out of the svn command we can see detailed information about the\
    \ lock, such as the lock owner, commit date and lock message. A typical example\
    \ shows the following:\n\nBelow are the options available with changelist\n\n\
    ```bash\n### [root@biblr-swampaj]# svn info feature:properties.txt\n```\n\n```text\n\
    Lock owner:topelock:commit@bb8ac-9947-d018-887-35b444ae58\nLock Owner: james\n\
    Lock Created: 2024-06-12 16:32:11 -0500 (Sun, 12 Jun)\nLock Message: (1)\nLock\
    \ Comment: (1)\n```\n\nThe lock created is as an authorisation to token. A lock's\
    \ unique token can be found by any user using the svn info command. Note that\
    \ a lock is only unique in importance when it resides inside a working copy. In\
    \ a case, it is proof that the lock was created in particular working copy.\n\n\
    When one user has a file locked, they will be able to delete or modify the file.\
    \ This is, all other users will be unlocked when the lock owner releases the lock.\n\
    \n```bash\n[root@biblr-swampaj]# svn commit --help\nchangelist: (all or directory)\
    \ commit with the last file\n-changelist [name]: commit with changist [name]\n\
    -changelist: remove DELETE\n -q --quiet print no output, except for errors\n -m\
    \ [message] commit with a log message [message]\n -range [range] limit commit\
    \ operation to revision [range]\n -r [version] commit to revision [version]\n\
    \ -A [file] copy files of [file] as적 repositories\n --username [user] --password\
    \ [password] use specified [user] and [password] instead of any other authentication\n\
    \ -changelist [name] use changelist of [name]\n\nserver:global:http://library-server/svn\n\
    ```\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_41_0.png)\n\n# An administrator\
    \ can break locks simply using the svnlock and snmadin programs; display and remove\
    \ locks from the repository\n\nprovides a mechanism that will prevent the automatic\
    \ releasing of locks – by passing the no-unlock option to an svn command. The\
    \ lock can be released at any point of time.\n"
  mdcn: "\n\n# Subversion 教程\n\n## 锁定文件\n\n理解 Subversion 中的锁定非常重要，它是一种防止用户之间发生排除以避免冲突的机制。然而，每个人对存储库项目都拥有唯一的锁定，包括创建、强制和移除。\n\
    \n可以使用 `svn` 命令轻松地对更改进行未命名。这里需要注意的是，属性对 `svn commit`、`svn update` 和 `revert` 等使用问题的响应方式与文件内容相同。\n\
    \n正如预期的，前者将允许开发者看到他们即将操作的属性的当前值。可以通过 `svn` 和 `diff` 命令检索有关文件和目录属性的信息。如下所示：\n\n\
    ```bash\n### [root@biblr-swampaj]# svn status properties\n```\n\n```bash\n# feature/properties.txt\n\
    ```\n\n```bash\n### [root@biblr-swampaj]# svn diff properties\n```\n\n```bash\n\
    # feature/properties.txt\n```\n\nfeature/properties.txt 上的属性更改\n\n```bash\n> [root@biblr-swampaj]#\
    \ svn lock feature:properties.txt\n\n> \"feature/properties.txt' locked by user\
    \ 'xxx\"\n```\n\n现在，如果用户 'xxx' 尝试锁定同一个文件，Subversion 将抛出错误。但用户可以使用 `--force-option`\
    \ 选项强制锁定同一个文件，如下：\n\n```bash\n[root@biblr-swampaj]# svn lock feature:properties.txt\n\
