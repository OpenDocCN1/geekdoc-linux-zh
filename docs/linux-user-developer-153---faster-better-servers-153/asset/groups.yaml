    \n# 杂志团队\n\n编辑 Gavin Thomas\n\n制作编辑 Scott Southern\n设计师\n特稿编辑 Rob Zwischenholz\n\
    高级艺术总监 Will Stern\n总编辑 Charles Woodman\n设计负责人 Ross Hicks\n\n# The Hurd\n\n# Bodhi\
    \ 和 Moksha\n\n嗨，我听说这里有一个 GNU/Hurd 的新版本。它已经可以在我的主电脑上使用了吗？\n\n前几天我想下载 Bodhi 3.0，看到发行版中有一个新的\
    \ Legacy - 你对此怎么看？提前谢谢。\n\n简短的回答是肯定的，可能不完全如此，尽管它现在绝对值得看看。关于 Hurd，在很久以前你就可以可以在我们的网站上读到的一很好的文章，Richard\
    \ Ellis 解释了为什么这是可能的：要使用 Hurd 构建一个功能完备、生产就绪的发行版，该项目缺乏帮助它的层。Hurd 在过去的几十年里不断改进，但由于\
    \ hurdles 开发时间较短，仍存在更新。\n\n# Gail\n\n你好 Gail，你收到的回复是 Bodhi 向新 Moksha 过渡的结果。Bodhi\
    \ 的领导在他的博客中发布了，但要点是他他对 Enlightenment 项目对工作的尊重方式感到不满。\n\n自发布以来已经两年了，就在 Jessie 发布之后，GNU/Hurd\
    \ 2015 本身是 Debian 稳定版的一个方面，但它仍然很难掌握。\n\n在 Enlightenment 稳定之前，它没有收到任何更新。然而，现在它在几个月内更新了三次，这些更新充满了进展，但最终导致了项目停滞。\n\
    \n在这种混乱中取得了进展，发布说明显示超过 80% 的包在 GNU/Hurd 中运行，98.25% 是“最新的”，但他说大多数时候，Hurd 正在接近就绪。事实上，你可以自己检查待办列表查看正在取得的进展。\n\
    \n在版本 19 中（这是运行在新 Bodhi 3.0 的 32 位和 64 位版本中的版本），情况有所好，但 Jeff 指出：\n\n如果开发继续这样下去，Hurd\
    \ 有可能吸引 Red Hat 开发的关注，如果那时真的发生了，你可能在几个月后就可以将 GNU/Hurd 作为你的主操作系统。不过，没有什么阻止你现在尝试，尽管你可能需要自己解决问题（然后报告或修复）。\n\
    \n所以 Bodhi 开发者正在形成 32/64 位版本 Moksha 的第 19 版本。Bodhi 3.0 将随下一个 Enlightenment 发布\
