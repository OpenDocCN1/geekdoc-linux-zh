    # The Hurd


    # Bodhi

    and Moksha


    Hi I heard here that is a new version of GNU/Hurd. It is ready for me to use on
    my main computer?


    I want to download Bodhi 3.0 the other day and see a new Legacy in the distribution
    - what do you think about it? Thank you in advance.


    The short answer is yes, probably not just, although it is definitely worth checking
    out now. The Hurd is long ago that you can read an excellent article on our website
    Richard Ellis explains why it''s possible: to make a functional, production-ready
    distro using the Hurd, the project lacks layers to get it to help. The Hurd has
    improved and improved over the last few decades, but there are updates due to
    the short development of hurdles.


    # Gail


    Hello Gail, The reply you received is an effect of Bodhi''s transition to new
    Moksha. Bodhi''s leader, posted up in his blog, but the gist of it is that he
    was unhappy with how the Enlightenment project moved respect for the work.


    It has been two years since its debut release and just after the launch of Jessie,
    GNU/Hurd 2015 is itself an aspect of the Debian stable, but it remains very difficult
    to master.


    Until Enlightenment was stable that it wasn''t receiving any updates. However,
    now, it has been updated three times in months and these were fraught with progress
    that eventually stalled the project.


    Headway with this mess, with the release notes indicating that over 80% of the
    packages are working in GNU/Hurd and 98.25% are "up-to-date", but he says that
    most of the time, the Hurd is approaching readiness. In fact you can check the
    to-do list for yourself to see the progress being made.


    In Version 19, which is what is running in the 32-bit and 64-bit versions of the
    new Bodhi 3.0, it is better, but Jeff notes that


    If development continues like this, there''s a chance the Hurd will attract attention
    and development Red Hat, and if then it happens you might be able to run GNU/Hurd
    as your main OS in a few more months. Nothing stopping you from trying it now,
    though you may have a way to work through (then report or fix)


    So the Bodhi developers are forming version 19 of the 32/64-bit Moksha. Bodhi
    3.0 releases with the next Enlightenment - This offers an alternative to the 32/64-bit
    build that was created but still using Enlightenment. This is just a temporary
    fix, from Bodhi 3.1.0, in August this year, Moksha will be included as the default
    choice.


