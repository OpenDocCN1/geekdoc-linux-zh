    said, ''You can run safely, updates ahead''


    Better Snappy package management means that you can roll-back individual updates
    to Ubuntu of other identical systems to see if they cause unexpected problems.
    You can roll updates back, as each version is a complete image. That''s very nice
    indeed,'' praised the way the platform embraces transactional updates without
    the base system but for applications on top of that system


