    # 14 The Python library (continued)


    Now we will plot a sine wave using the ExpEYES and PyLab libraries. On the device,
    connect D1 to IN1 and SINE to A1 with some wire. Run the following code and you
    should see that a sine wave has been plotted.


    ```

    import expeyes

    from expeyes import *


    p=expeyes.open()

    p.set_state(10,1)

    p.set_wave_freq(2.5)

    t,v = p.capture(1,300)

    plot(t,v)

    ```


    # 15 Further experiments


    This tutorial has shown just a simple example of ExpEYES experiments available
    at http://expeyes.in There is a variety of different techniques and phenomena
    explored in those experiments, so it is highly recommended to get your hands on
    an ExpEYES kit and work through them. Running through these examples as a beginner
    will give you a much deeper understanding of electronics.


    # 16 The digital storage oscilloscope (plus extra)


    A useful tool in any engineer or hacker''s toolbox, as it enables you to get insights
    into your projects that are not possible with visual checks or using a multimeter.
    Compared against professional units, this is a great product as well as a portable
    USB device with platform support when you aren''t just lugging around.


    # Make a Pi 2 desktop


    Use your Raspberry Pi as a desktop replacement thanks to the increased power of
    the Raspberry Pi 2. The Raspberry Pi 2''s increased power over its predecessor
    is well-documented now. More CPU cores and RAM making it six times faster is an
    impressive number, and you can see the actual changes that it makes the simple
    project that was just out of reach for the original Pi 2.


    # 01 Get Raspberry


    We will be using Raspberry for our desktop. Not only is it simple to use but it
    is supported by the Pi Foundation and community, which means it''s going to be
    the most flexible operating system with the most choices for desktop. Download
    it from: https://raspberrypi.org/downloads


    All components for it were available, Pi was just a little further to provide
    a fluid desktop experience. With the improved resources, many of the restrictions
    are gone – enough of them to build a Pi desktop. So grab a Pi 2 and we''ll get
    started.


    ## What you''ll need


    - Raspberry Pi 2

    - Raspbian

    - Keyboard

    - Mouse

    - Wireless dongle

    - Monitor

    - Case

    - Powered USB hub (optional)


    # Raspberry Pi desktop


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_64_0.png)


    # 02 Install Raspbian


    Once Raspbian is downloaded, you can install it to this desktop by hitting the
    micro SD into an SD card reader and connecting it to your main system (a PC or
    laptop). Open up the terminal, `cd` to the location of the image and use it.


    ```

    $ sudo dd bs=4m if=raspbian.img of=/dev/sdcard

    ```


    # 03 Setup options


    On first boot, there will be some setup stuff that is necessary to go through.
    The most important things to do is first hit ''Enable Boot to Desktop'' and then
    extend the partition to fill the SD card. After you do that, doing anything else
    through these menus and reboot before moving on to the next step.


    # 04 First boot


    You will boot into a fresh version of Raspbian with the newer interface and apps
    available to use. From here you can start as a PC if you wish, but it is worth
    noting that Raspbian has some things that you should do to make it truly desktop.


    # 05 Software updates


    Our first step is to perform an update on the system to make sure it''s up to
    date and working properly. To do this, open up the terminal from the menus and
    use:


    ```

