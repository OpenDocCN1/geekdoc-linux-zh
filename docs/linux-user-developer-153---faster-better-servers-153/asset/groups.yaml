    \ MIDI 音符已经开启，它会将其关闭，反之亦然。该 `toggle` 方法专门用于键盘输入。\n\n```python\nclass KBInput:\n\
    \    def __init__(self, synth):\n        self.synth = synth\n\n    def keymap(self,\
    \ key):\n        self.map = {\n            'a': 60, 'w': 61, 's': 62,\n      \
