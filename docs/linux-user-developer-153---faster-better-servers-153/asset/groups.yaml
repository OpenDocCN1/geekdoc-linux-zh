    This package provides an interface to Matplotlib, the popular plotting library
    for Python.


    If you use PyQt, it is recommended that you execute the following commands:


    ```bash

    $ apt-get install python3-qt

    ```


    ## Work with fractions


    Julia supports fractions natively using the `Rational` type. For example:


    ```julia

    julia> x = 1/3

