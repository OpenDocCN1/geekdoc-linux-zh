    # GROUP TEST

    Raspberry Pi HTPC OS


    We narrow down the very best home theatre distros to make your choice a little
    easier


    OSMC

    The overshoot of Raspberry does more than just re-package Kodi as it does (a feat
    OpenELEC does better anyway), it also offers a competitor, different interface
    to make a more unique system which comes with a custom settings menu. It is now
    available in NOOBs, replacing Raspberry.

    Download: bit.ly/1YbKgaHw


    XBian

    Although slightly overlooked for the past two or so years, Xbian has been the
    third Raspberry operating system offering an XBMC/ Kodi solution to turn your
    Pi into some updates that truly make it a firm competitor against the rest of
    the disturbs in this test.

    Download: bit.ly/1HcFunw


    OpenELEC

    Very much associated with the Kodi development team, ELEC stands for Embedded
    Linux Entertainment Center and the software itself is developed for many platforms.
    It is de-updated for Raspberry Pi 2 recently, along with the switch to Kodi branding,
    for the latest version of the software.

    Download: bit.ly/1JFAFj4b


