    ## 06 The Gadfly package


    Gadfly is another Julia package that can drawing, Its interface as simple as the
    R ggplot2 package. As a result, the Gadfly package is the most powerful of all
    packages that we have presented, but it is the most difficult to use. Gadfly is
    automatically drawn in a web browser.


    ## 03 The TextPlots package


    TextPlots is a simple plotting library that generates terminal plots using Braille
    characters. It enables you to plot any continuous real-valued function or collection
    of data points.


    ## 07 Plot a function


    As all packages define and use a function to call `plot()`, if you need to load
    another package when the TextPlots is already loaded, you will get the following
    warning message on screen:


    Plot the function $f(x)=\cos(x)$ using TextPlots as shown:


    Warning: Winston in module Main conflicts with an existing definition.


    The same plot can be done in Winston:


    ```julia

    using Winston:

    x = linspace(0, 3pi, 100)

    c = cos(x)

    p = Frame(title="Using Winston", xlabel="x", ylabel="y")

    plot(p, c=c, color="red")

    ```


    ## 04 The Winston package


    Winston is a helpful and easy-to-use Julia package. From the part that Julia is
    loaded, Winston offers the `plot()` command to let you add objects into existing
    definitions.


