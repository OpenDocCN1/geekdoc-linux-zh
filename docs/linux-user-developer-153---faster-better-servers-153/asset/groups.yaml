    ```


    Then you put that directory in and unpack it (tar xzf my-package-0.2.tar.gz -C
    .) to build the program using the following commands:


    ```bash

    ./configure --prefix=usr && make

    ```


    If you''re recompiling a program that already exists in one of your repositories,
    you can easily ease the dependency resolution by using apt-build-dep mypackage
    before in order to make the ./configure run more smoothly.


