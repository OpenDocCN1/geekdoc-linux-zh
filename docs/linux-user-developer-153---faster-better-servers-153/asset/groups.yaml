    ## Ubuntu 的未来


    你好 Luke；我听了很多关于 Ubuntu 手机的消息，我在 Ubuntu 在线峰会上看到了 Mark Shuttle 的问答，他提到了相当的担忧，而且根据我的理解，还提到了即将切换到
    Ubuntu 8.04。我想知道你是否有什么方法可以让我亲自查看桌面目前的状态？


    你好 Ben。你说得完全正确——当被问及 Ubuntu 8 是否能在 16.04 前准备好时，Mark 给出了一个相当中肯回答，说这将是一个“选项”，最终将由社区决定明年当
    Canonical 从 Ubuntu 7 X 过渡到 Ubuntu 8 时，桌面系统是否足够稳定。


    至于讨论这个问题，目前实际上有一个名为 Ubuntu Desktop Next 的 Ubuntu 变体已经准备好一年了。这是一个不稳定的、实验性的桌面镜像，但最新版本的
    Ubuntu Desktop Next 16.04 可以让你看到是否使用了 Unity 8。你可以从 Ubuntu 网站下载并亲眼查看：http://bit.ly/3bx5Pw


    > 从 USB 闪存 Live 启动并选择 Ubuntu Desktop Next 可能比安装该发行版更可行。


