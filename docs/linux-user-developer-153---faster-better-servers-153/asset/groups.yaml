    # 教程


    # ExpEYES

    & PHOENIX


    ExpEYES 由 Ajith Kumar 和他的团队开发，作为 PHOENIX（带有设备的交互式实验物理）项目的一部分。该项目最初作为印度新德里大学间数学学院（IUCM）推广计划的一部分启动的。我们的目标是为使用基于硬件课程计划的教师提供廉价的实验室设备和培训。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_61_0.png)


    如需恢复模式，请按住


    # 07 安装软件


    感谢 Khadnare 等社区成员的努力，ExpEYES 软件现在已提供 DEB 软件包，这些软件包可以在 Debian、Ubuntu、Linux Mint
    等更多系统上正常运行。所有依赖项都包含在官方仓库中，因此运行 ExpEYES 软件只需要在树莓派上打开一个 LXTerminal，然后运行以下命令：


    ```

    sudo apt-get update

    sudo apt-get install expeyes

    ```


    # 08 安装依赖项


    ExpEYES 有许多运行所需的依赖项，以及其他推荐的库。在步骤 7 的安装过程中，依赖项应该默认安装。然而，为了避免任何问题，你可以运行以下命令以确保它们都已安装：


    ```

    sudo apt-get install python-exeyes python-exeyes-imaging-python-tk grace python-numpy-scipy
    python-python

    ```


    # 10 持续超频


    超频有时会导致你的树莓派不稳定或无法启动。如果发生这种情况，请按住 Shift 键进入上述启动闪屏以进入启动模式。然后你可以减小超频设置并重复，直到你找到最高的稳定设置。


    # 11 人体电阻


    这是一个有趣的实验，让你第一次使用示波器测量人体电阻随时间变化的实验。仅需三根电线和一个电阻即可轻松完成。将 ExpEYES 连接到 A1 和 A2，将电阻连接在
    A2 和地之间，从 P1 和 P2 引出一根末端开放的电线。插入 ExpEYES 控制面板，将 A1 拖到 CH1，将 A2 拖到 CH2，用手握住线并观察
    ExpEYES 控制板上的响应。


    # 12 运行数学计算


    从最终图表中，你会看到 CH1 上的输入约为 3.99 伏（这非常棒，因为接近 4V）。(CH2) 上的值为 0.9 伏，这意味着未知电阻值两的电压为 (V
    = 4 - 0.9 = 3.1V)。使用欧姆定律 (R=V/I)，我们可以计算电流 (I = 3.1V / 0.0000045A = 4.5 µA)。使用该值，我们随后可以使用相同的公式计算人体电阻
    (R = 3.1V / 0.0000045A = 688888 欧姆 = 689 kO)。这是一个非常高的值。人体电阻很大取决于皮肤状况以及数值范围（1000
    到 100000 欧姆）。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_61_1.png)


    # 09 树莓派超频（可选）


    ExpEYES 软件可以在默认设置下运行在树莓派上，但如果你使用的是 Model A 或 B+，速度可能会缓慢。如果你使用的是 Model 2，则不需要超频（但你可以超频以使其运行得更快）。


    在 LXTerminal 上并使用步骤 7，选择“Overclock”（超频）选项。点击屏幕上的 OK 查看一些代码运行。完成后，再次按 OK，你将返回主窗口。选择右下角的
    Finish（完成）并重启到你的树莓派。


    # 13 使用 Python 库


    ExpEYES 团队为你的设备内置了 Python 库。使用该库非常简单，它允许你比使用 ExpEYES 脚本更大的灵活性。如果你遵循了上面的安装说明，你只需要导入
    Python 模块，然后使用以下代码初始化 ExpEYES：


    ```

    import expeyes

    expeyes.open()

