    # DISTRO


    # Fedora opts out live-patching


    Along the Linux 4.0 kernel release brought official support for live-patching
    for the first time, the Fedora team has confirmed that it has no intentions of
    enabling support for the feature in its popular distribution.


    Despite planning to release Fedora 22 with the Linux 4.0 kernel as standard, the
    team decided against introducing the new live-patching functionality which enables
    portions of the kernel to be patched without the usual need for an update reboot.
    As a result, live-patching of the kernel will not be available to Fedora 22 users.


    “Live-patching could be very useful, but it is not quite necessary in Fedora,”
    said Boyer of the Feature Team, “and we don''t need a whole lot of sets for Fedora.
    The Fedora team has this functionality disabled, both in Fedora 22 and upcoming.


    “We do not really need patching functionality in Fedora itself. It’s understandable
    that people who want to patch without rebooting avoid stability issues targeted
    at small bugs and security patches. You cannot, live patch from kernel 4.0 to
    4.1. Given that the kernel release is stable enough for the lifetime of a Fedora
    release, we don''t have opportunity to build the live patches. Our update shipping
    infrastructure is also not really geared towards frequent updates.”


    For fans who would still like to use live-patching, the kernel-patching Copr has
    the functionality.


