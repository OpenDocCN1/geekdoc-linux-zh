    # 树莓派 HTPC 测评


    ## OSMC


    ## XBian


    这个领域的新秀，其特点是相对于 Kodi 有最激进的背离。


    多年被忽视的 XBian，其知名度缺失是一个令人担忧的问题呢？


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_73_0.png)


    - OSMC 是所有 Kodi 前端中外观最独特的


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_73_1.png)


    这种设置是 XBian 相比于其他系统的关键优势之一。


    ## 易用性


    虽然 OSMC 的外观与默认（可能也是最好）的 Kodi 不同，但在菜单操作方面，它们本质上是一样的。它还有一个“My OSMC”菜单，其中包含普通 Kodi
    设置中没有的设置和信息，这可能很有用。


    XBian 缺失的最重要功能之一是完善的设置向导。最近的版本添加了一些微调，帮助你更好地浏览界面，但当你深入挖掘菜单时，就会变得令人沮丧。与 Kodi 的其他出色的精妙工具相比，XBian
    的初次设置是非常出色的。


    ## 兼容性


    它基于 Kodi 所有出色的播放功能和解码器构建。你可以在其上运行任何类型的媒体，并且很可能播放它们并访问它提供的任何其他功能，如字幕或语言跟踪，让体验感觉同样轻松。


    一个完全构建的 XBian 几乎可以运行所有内容，或者至少可以运行大多数媒体消费者关心的所有内容。我们在本次测试组的 OSMC 部分简要提到了最出色的胜利；它包括
    YouTube（大约是这样）和其他视频解码器、播客、RSS 馈源等。


    ## 速度


    在树莓派 2 上，OSMC 运行得非常好，仅带有树莓派上运行 Kodi 时常见的轻微提示和卡顿。它运行得相当快，尽管软件在运行时会减慢界面，有时会导致输入延迟几秒钟，这很烦恼，但并不
    true有致命。


    XBian 可能是这次测试的三种 Kodi 实现中慢慢的——这种差异在大局上并不明显，但当 OpenLEC 瞬间运行大量内容时，它有一点不易察觉的卡顿。除此之外，界面导航良好且完全可以播放。


    ## 更新


    OSMC 有自己的更新软件，你可以对其设定计划，考虑到它的速度，最好将其留到你使用它时进行。然而，如果你现在绝对需要一个新版本，也可以手动进行。


    你可以从设置中更新 XBian，当它在更新时，界面运行正常。它还像其他系统一样具有计划调度功能，并允许你选择要更新的包。它提供了一种轻松的更新体验，就像你选择手动更新时一样，让你完全清楚正在发生什么。


    ## 总结


    > OSMC 在成为像 OpenLEC 或其前身 Raspmic 的更好的替代品之前做了更多工作。在未来的一年里关注它，它有很大的潜力。


    XBian 非常棒，一种直观的初次设置，不会让你翻遍其他菜单。总的 Kodi 体验是值得的。


    ## OpenELEC


    满足你所有嵌入式电脑需求的顶尖 Kodi。


    ## Raspbian


    通用的 Linux 发行版能抵挡专用的 HTPC 操作系统吗？


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_74_0.png)


    OpenELEC 是这些测试软件中运行最快的。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_74_1.png)


    Kodi 在 Raspbian 上运行良好，但你需要自己寻找解码器。


    ## 易用性


    OpenELEC 基本上是纯 Kodi，这意味着出色的 Kodi 用户体验是软件包的一部分。它有一个小型向导，允许你从一开始激活额外选项，但同样，你可能需要挖掘菜单来获取无线设置。OpenELEC
    的自定义设置与界面的其他部分更一致。


    Raspbian 非常棒——确实——但它没有特别针对你的电视进行良好优化。新的菜单有更大的图标等，但它更适合桌面环境。在不安装 Kodi 的情况下播放视频的最佳方法是使用其他视频播放器。


    ## 兼容性


    当两个软件的核心功能相同时，很难不重复我们的话。如果你还没有从我们测试组的前两个产品中了解到，Kodi 在这方面很棒，我们很喜欢。在为了选择而第三次拥有它后，感觉更好。


    一些基础格式，如 AVI 和 MPEG，在命令行 Kodi (OMXPlayer) 和你可以使用的 Kodi 基础安装中均运行良好。然而，你需要寻找其他解码器来播放任何其他内容。Kodi
    本身运行没有正常错误。


    ## 速度


    OpenELEC 的启动速度可能是所有软件中最快的，并且在树莓派上使用时具有其他出色的 Kodi 速度。OpenELEC 的最新版本针对新处理器进行了优化，因此即使在刮取所有后续资源后，你也能获得比旧版本更多的体验。


    在所有设置中最慢的，虽然导航 Raspbian 有点慢。它并不是事实上的慢。


    ## 更新


    有一套手动更新系统可以保持你的版本是最新的。它有点慢。


    ## 总结


    OpenELEC 是最快的，尽管它有一点倒退。


    Raspbian 完全不适合 HTPC，它是为了标准用途的。


    linuxuser.com 75


    ## XBian


    XBian 的目标是为微型电脑提供最快的 Kodi。


    我们对树莓派作为 HTPC 的实验是一场小灾难。它很棒，但真的不适合用简单的控制来播放媒体。幸运的是，正如测试所示，有优秀的替代方案。


    Robert Zebest


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_75_0.png)


    '
