    [root@nblr-gwos swajam]# svn log properties.txt

    ```


    # A property is structured as a simple key-value pair: the key is a string and
    the value content can be anything


    | Command | Description |

    |---|---|

    | svn log -r24 | Displays logs for the revisions 4 in chronological order |

