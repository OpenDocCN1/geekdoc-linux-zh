    # Review Raspberry Pi HTPC


    # In brief: Compare and contrast our verdicts


    | OSMC | XBian | OpenLEC | Raspian |

    |---|---|---|--|

    | Ease of use | OSMC definitely needs a little UX development | A great setup
    wizard with the usual Kodi interface | Pure and excellent Kodi, although Wi-Fi
    settings are hidden | Not so easy to play bits of media from on standard desktop
    |

    | Compatibility | Kodi just about everything you want it to be | You have access
    to a lot of web videos and services with Kodi | Kodi is just the base for HTPC''s
    playback needs | There is a low number of codecs to support for MKV |

    | Speed | Loads at a speed and the Kodi interface is nice and quick to use | Loads
    slowly compared to OSMC and LibreLEC but it is worth the wait | It is almost instant
    when loading up and the OS that we tested | The CLI update is smooth, though much
    slower than others |

    | Updates | The update is bit hidden away and slows down the interface | A very
    good all manual and scheduled updater | Scheduled and manual updating that keeps
    your version-to-date | Not well suited for home theatre PCs at all |

    | Overall | OSMC could be very good but it needs a bit more | XBian is a fantastic
    Pi product and an excellent HTPC | Always solid, again but could use some UX tweaks
    |


    # # XBian


    The Raspberry Pi has always been very popular as a HTPC; it''s perfect for it—even
    if that was the intention of the Raspberry Foundation and since its inception,
    a number of Kodi (XBMC) solutions have appeared. Different operating systems have
    been the best for over the years, but right now Xeon seems to be the best out
    there, dethouring the elite OpenLEC.


    XBian offers this a bit better experience with the initial setup and Kodi settings
    menu after, it''s really not put ahead, making just a little nicer to use for
    technically proficient people. OpenLEC is still great, though, the new Raspberry
    Pi 2 has extra power. It boots up in instant and is as fast as any other platform,
    but it might be more familiar to people although fewer differences compared to
    other Kodi alternatives. OSMC is great and we have found differences of quality
    that are quite sure to replace the entire interface but The ''My OSMC'' menu feels
    like it wants to replace a little work and a few features before it does. We''re
    looking forward to seeing how it develops, but for now it''s bit of a step backward.


    XBian aims to deliver the fastest Kodi for mini computers


    Our experiment with Raspberry as a HTPC was a bit of a disaster. It''s great but
    really not suited for easy playback of media with simple controls. Luckily, there
    are excellent alternatives although, as shown in this test.


    Robert Zebest


