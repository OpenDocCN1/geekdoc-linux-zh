    # RasPi


    面向树莓派爱好者的数字杂志


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_76_0.png)


    在 Google Play 和 iTunes 上下载免费应用


    www.linuxuser.co.uk/RasPiCode


    facebook.com/LinuxUserUK #RasPIMag


    ##评测 Gizmo 2


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_77_0.png)


    ## 迷你型 PC


    ### Gizmo 2


    基于 AMD 加速处理单元（APU）的开源硬件设备能否比随处可见的树莓派真正的跨跃？


    | 特性 | 规格 |

    | :--- | :--- |

    | 操作系统 | TimeSys Embedded Linux (兼容其他 OS) |

    | 处理器 | AMD G-Series GX-210HA APU，1 GHz 双核 |

    | 内存 | 1 GB DDR3 |

    | 尺寸 | 111 x 100 x 38 mm |

    | 存储 | micro SD, mSATA |

    | 网络 | 千兆以太网 |

    | 端口 | 2x USB 2.0, HDMI, 模拟信号, mSATA/PCIe,高速扩展端口,低端口 |

    | 价格 | £146.29/£199.99 |


    原始 Gizmo 板板是 Sage Electronics、TimeSys 等公司的结晶，曾在第 125 期中进行过评测，它的出现引起了轰动。它采用开源硬件加速设计，配备了性能惊人且轻量级的
    AMD 处理单元（APU），几乎可以轻松运行地球上所有的操作系统，即使在 Intel 给出自己的解决方案后，它证明了自己是一个赢家。


    AMD GX-210HA APU 拥有两个运行在 1 GHz 的 64 位 x86 核心以及集成的 Radeon HD 821OE 显卡硬件。事实上，整个
    Gizmo 2 的性能大同小，但这并非坏事——在 9 W 的热设计功率（TDP）下拥有 85 gigaflops 的计算能力。Gizmo 2 提供了更好的向后兼容性。附带的
    SD 卡可以快速更换为任何兼容 x86 的操作系统，通过安装 micro 卡或从板载的一个端口启动来实现。然而，在发布时，系统只能从较慢的 USB 2.0
    端口启动，但发布后的 SeaBIOS 固件更新解决了这个问题，允许从更快的 USB 3.0 端口运行启动。


    Gizmo 2 是一个正方形布局，最长边仅为 111 mm——与原始设计一致，尽管厚重的外壳被一个令人恼的、带有嗡嗡声的风扇和散热器组合所取代，这是由于升级所必要的。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_78_0.png)

    ![](img/dc2302183c6b3ebee0d18a3807d4d058_78_1.png)

    ![](img/dc2302183c6b3ebee0d18a3807d4d058_78_2.png)

    ![](img/dc2302183c6b3ebee0d18a3807d4d058_78_3.png)


    ## 缺点


    > 在发布时，系统只能从较慢的 USB 2.0 端口启动，但发布后的 SeaBIOS 固件更新已解决此问题，允许从快速 USB 3.0 端口运行启动。对于更持久的存储扩展，虽然是通过网络端口实现的，但通常是在原始
    Gizmo 上的标准 SATA 连接器上。


    凭借电源和熟悉的 x86 架构，Gizmo 2 弥补了爱好级单板计算机与桌面机之间的差距。


    - 缺乏扩展板限制了其灵活性，而 Gizmo 2 的高价位使其超出了爱好者的预算，这可能是有害的。


    至于在性能任务中大部分令人失望的部分：Gizmo 2 在同类产品中并没有让人失望。2.0 ms 的第 95 百位数时间比任何基于 ARM 的板卡都更快，例如树莓派
    K1 在相同测试中的得分为 7.31 ms。


    价格正在下降，限时提供的 JTAG 调试器配件也是如此。与树莓派相比，这也是一个问题：在支持 54 个引脚的插针中只有近 20 个，在自己的项目中使用 Gizmo
    稍微困难了一点，如果你更有创意，则需要使用第三方板卡或你自己的板卡。


    ## 总结


    考虑到内置额外功能的缺失，Gizmo 2 的价格在面对树莓派 2 甚至售价 133 美元的最新 Minnow Board 时也显得吃力——后者比 Gizmo
    2 要友好爱好得多。


    不过它确实有所改进。此前附带的 Explorer Board（一种通过板后部低速扩展头连接到 PCB 的爱好者友好型引出板）已被移除，以降低价格。


    如果你追求 x86 兼容性，并且可能接受一块低于 10 W TDP 的板卡，那么 Gizmo 2 是无可比拟的，特别是当你的用例可以从 GPU 加速受益时。对于密集的嵌入式应用，Gizmo
    2 是难敌的。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_79_0.png)


