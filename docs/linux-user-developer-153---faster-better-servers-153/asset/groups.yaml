    ## Program a utility by using a simplified version of the cp tool – it is not
    as difficult as you might think!


    > We will show how you can program a traditional UNIX utility in C. Its main purpose
    is to make you realise that the implementation of tools is not actually difficult.
    The tool will be a simplified version of the command that is used for copying.
    The well-known cp utility has many more command line options and is implemented
    as an autonomous function, not a program.


    The difference between the two files is in their permissions: ''test'' is an executable
    file (rwxr-xr-x). You can manually change the permissions of ''myTestNEW'' using
    chmod. The original file will not have the permissions of the new file, so you
    should definitely mention it. Code prints nothing when everything works as expected
    – only errors when things fail! The simplicity of writing a utility using just
    a few lines of C is also to manage to realise that all original UNIX utilities
    were implemented using code that was as clean and simple as the code written.


    Get to grips with UNIX utilities by writing a simplified version of the cp tool.


    UNIX enables you to open a file for reading in many ways. The most straightforward
    of them is the open function which is used. The open function returns a file pointer
    whose name is a string as an argument and assigns a stream with its return value.
    You can open a file for reading with:


    Programming the same task in a scripting language can be simpler. The following
    example in C does the same task: fp = fopen(file,"r");


    The opening of a file returns the value of:


    ```

    FILE *f = fopen(file,"w");

    ```


    It is important to remember the fact that you must always check the return value
    of the function to detect problems, errors or as soon as possible. It is up to
    you what to do after detecting an abnormal status but it is important to do it
    correctly.


    > It is amazing to realise that all original UNIX utilities were implemented using
    code that was clean and simple as the one presented here.


    The final version of the program (myCp) is clean and has no severe errors, and
    is easy to read.


    If you can copy a file using C code, then the new file will not have execute permissions,
    as was the case with the myCp example.


    If you examine the code using trace(), you will find that the script executes
    the following C system calls:


    A good sign is that we should not do tests since it is a very important part of
    software development (but not a replacement for good design).


    ```

    read(3,buffer[1024],1024);

    write(4,buffer[1024],1024);

    ```


    The diff command (type man diff) can help you examine if the original file is
    identical to the generated.


    So, the FileCp program implements file copying by using the more powerful read()
    and write() system calls. This is the fundamental kernel operation, whereas write()
    is a library function that acts on top of the file. As performance matters, write()
    is better for writing small amounts of data, whereas read() is faster for larger
    amounts. Although the cp utility uses write(), it''s better to use write() which
    you already know how to use.


    ```

    $ diff test myTEST

    ```


