    ## Mini PC


    ### Gizmo 2


    Can an open hardware device based on an AMD Accelerated Processing Unit offer
    a true step up from the ubiquitous Raspberry Pi?


    | Feature | Specification |

    | :--- | :--- |

    | Operating system | TimeSys Embedded Linux (other OS compatible) |

    | Processor | AMD G-Series GX-210HA APU, dual core at 1 GHz |

    | Memory | 1 GB DDR3 |

    | Dimensions | 111 x 100 x 38 mm |

    | Storage | micro SD, mSATA |

    | Networking | Gigabit Ethernet |

    | Ports | 2x USB 2.0, HDMI, analog, mSATA/PCIe, high-speed expansion port, low-speed
    port |

    | Price | £146.29/£199.99 |


    The original Gizmo board, a collaboration between Sage Electronics, TimeSys, and
    others, and reviewed back in issue 125, hit the mark with a splash. Featuring
    an open hardware accelerated design, a surprisingly powerful lightweight AMD processing
    unit (APU) that felt pretty much easy every operating system under the sun, it
    proved a winner, even when Intel answered with its own solution.


    To the AMD GX-210HA APU, booting two 64-bit x86 processing cores running 1 GHz
    and embedded Radeon HD 821OE graphics hardware. In fact, the total Gizmo 2 is
    more of the same and that''s no bad thing—85 gigaflops of compute power in a 9
    W thermal design profile (TDP). The Gizmo 2 offers better backward compatibility.
    A bundled SD card can be quickly replaced with any x86-compatible operating system,
    either by installing the micro card or booting from one of the board''s ports.
