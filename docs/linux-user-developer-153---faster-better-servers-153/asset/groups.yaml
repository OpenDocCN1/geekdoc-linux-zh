    ## Ubuntu Next


    Hi Luke; I''ve been hearing a lot about Ubuntu phones, and I caught Mark Shuttle''s
    Q&A at the Ubuntu Online Summit where he was talking a fair about concern, and
    also about the upcoming switching to Ubuntu 8.04 and from what I understand. I''m
    wondering if you know of any way that I can take a look at the current state of
    the desktop myself?


    Hi Ben. You are absolutely right - when asked if Ubuntu 8 would be ready in time
    for 16.04, Mark gave a fairly answer saying it would be an "option" and that,
    ultimately, the community would decide whether the desktop system is stable enough
    next year we need to go for Canonical as it transitions across from Ubuntu 7 X
    to Ubuntu 8.


    In terms of talking about it for, right now, there''s actually an Ubuntu flavour
    called Ubuntu Desktop Next that''s been ready for about a year now. This is an
    unstable, experimental desktop image but the newest version, Ubuntu Desktop Next
    16.04 gives you a view of Unity 8 or not. You can download it from the Ubuntu
    website and see for yourself: http://bit.ly/3bx5Pw


    > Left Live-boot from a USB stick and choosing Ubuntu Desktop Next is likely to
    work than installing the distro

