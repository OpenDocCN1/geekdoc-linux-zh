    Installation is as simple as typing in `pkg.add("name")` of the package.


    ## Install a Julia package

    Plotting functionality included within the core system. To add functionality you
    will need to install external Julia packages. Therefore, before doing anything
    in Julia, you will need to use packages. `pkg.add` installs a new package, and
    completes an installation.


    message after executing the `using PyQt` command in the Julia shell. The good
