    ## X modifications


    First of all, we need to install the specific joystick drivers that we want to
    use for X. Do this by opening up the terminal and installing the package:


    ## Check controller inputs


    If you need to change the inputs because your USB controller isn''t quite working
    with the PS3 setup, then you''ll have to figure out which buttons are on the controller.
    Install the joystick test software with:


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_28_0.png)


    ```bash

    $ sudo apt-get install xerver-xorg-joystick

    ```


    With games consoles come new controllers, and the PlayStation 4 has interesting
    classic pads.


    ## Get the files


    We''ve created a basic configuration file that you can use to make your controller
    like a mouse. It''s been around the PS3 controller for a while, but we''ll show
    you how to modify it. Download it here:


    Shock Duck has a touchpad on the front. The controller isn''t quite like the others,
    but development is a great way to add extra buttons. Find more details here: github.com/chipsn-dev


    ```bash

    $ wget http://www.linuxuser.com/uk-content/uploads/2015/05/58-joystick.cfg

    ```


    ## Test Inputs


    ## Move yours


    Still in the terminal, load the tester with jtestgtk while it is running. You''ll
    be able to see how the calibration of any analog inputs is handled (which is a
    bit tricky), as well as which button is activated:


    ## Key bindings


    We are going to copy the 5.1-joystick.cfg from /usr/share/X11/joystick/, make
    a copy of it and move the file into the folder:


    Once you''ve figured out which buttons are what, you can now see which keys map
    to keyboard presses. Still in the terminal, find this out by:


    ```bash

    $ sudo cp 5.1-joystick.cfg /usr/share/X11/

    ```


    ```bash

    $ DISPLAY=:0 evtest -np -p _all_keys

    ```


    ... and open the file:


    ## Reboot to use


    For everything to take effect, give yourself a reboot. Log back into your desktop
    environment and test your joystick. The PS3 controller will now move in the same
    way and have right- and left- buttons assigned, as well as few Escape buttons.


    ## Read to use


    All you need to do is important to know what key you want to use. It is best to
    use get''s function to find it and then make the value of binding of each part
    as you have recorded.


