    # Ubuntu Next


    Hi LU&D; I''ve been hearing a lot about Ubuntu phones, and I caught Mark Shuttle''s
    Q&A at the Ubuntu Online Summit where he was talking a fair about concern, and
    also about the upcoming switching to Ubuntu 8 and Mr. For from what I understand
    the two different versions of Ubuntu 16.04 and Ubuntu 8 are not going to be ready
    in time for October. I''m wondering if you know of any way that I can take a look
    at the current state of the desktop environment myself? I''m curious and just
    want to see what it''s.


    Hi Ben. You are absolutely right - when asked if Ubuntu 8 would be ready in time
    for the 16.04 LTS, Mark gave a fairly answer saying it would be an "option" and
    that, ultimately, the community would decide whether the desktop system is stable
    enough the next year we need to go for Canonical as it transitions across from
    Ubuntu 7 and X with de-packing to Ubuntu 8.

    In terms of talking about it for, right now, there''s actually an Ubuntu flavour
    called Ubuntu Desktop Next that''s been ready for about a year now. This is an
    unstable, experimental desktop image but the newest version, Ubuntu Desktop


    Next 16.04 gives you a view of Unity 8 or not. You can download it from the Ubuntu
    website and see for yourself: http://bit.ly/3bx5Pw

    It is worth noting, that you may run into some issues when trying to get it working.
    The biggest one is a bug with the greater that prevents from working on getting
    answers reports. There''s a workaround for this, as well as instructions on how
    to create it at ubuntu.com/UbuntuDesktop.

    It''s not a certain that this will work for you if you encounter the same issue,
    but it''s a good start and it''s worth keeping an eye out on the forums, where
    many other users are reporting


    > Left Live-boot from a USB stick and choosing Ubuntu Desktop Next is likely to
    work than installing the distro


    94'
