    # 观点编码


    ## 使用简化版的 cp 工具编写一个实用工具——它并没有你想象的那么困难！


    > 我们将展示如何用 C 语言编写一个传统的 UNIX 实用工具。它的主要目的是让你意识到，工具的实现实际上并不困难。该工具将是用于复制命令的简化版本。众所知的
    cp 实用具有更多的命令行选项，并且是实现为一个独立的函数，而不是一个程序。


