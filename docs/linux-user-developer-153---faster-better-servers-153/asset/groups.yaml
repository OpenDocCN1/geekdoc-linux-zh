    # # Top Android apps


    These apps aren''t tied to projects – you can use them whenever and as often as
    you like


    # ## Raspberry Pi Remote


    If you want to be able to control services from afar the free Raspberry Pi Remote
    could be the app for you. Install it and you can control things like the camera
    module at range, as long as your Pi is Internet-enabled.


    # ## JuiceSS – SSH client


    If you are using SSH to control your Pi from another device, not your Android
    tablet or phone into the mix? There are a terminal clients for Android and SSH
    with multiple devices - we like the free JuiceSS because it has a clear, nice
    interface.


    # ## RIPEFR


    This app is probably suited to a larger-screen tablet than a small handset but
    it is a reference guide to the GPIO pin, covering the A, B, and the A+ and Pi
    2 layouts are identical to the B+. This is all really clear and set up, and it''s
    free,


    # ## AndFPTP (ftp file client)


    Sometimes you might need to transfer files onto your Pi, and for this you may
    also AndFPTP. It is much than simple and could be useful if your Pi is a web server.
    The design is simple, while the Pro version at £3.89 includes extra features like
    sync


    # ## Rasp-i


    This is a well-featured app that can accommodate more than one Pi. As well as
    monitor the status of your Pi, you can execute Linux commands, reboot the Pi,
    and handle Python scripts. A free app with in-app purchases available.


    # ## Fing – Network Tools


    Fing is a general network scanner that identifies everything on your network by
    name and MAC addresses. You can also send a ping to feel the need. It is really
    useful if we all forget your Pi''s address from time to time.


    # ## VNC Viewer


    For even more remote remote control of your Ras Pi, we recommend using VNC Viewer.
    This is an excellent VNC client that enables you to see the desktop GUI so you
    get a VNC server running on it. RealVNC makers have an open source version of
    VNC server to download, and you can also get a free license for the main VNC software,
    which is only for personal use and does not include encryption.


