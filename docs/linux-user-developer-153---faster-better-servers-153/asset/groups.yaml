    ## EXPAND YOUR WEB SERVER


    Tailor your web server to suit all of your individual needs


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_20_0.png)


    ## Mail server


    Part of the benefits of being a web server is that it enables you to add your
    own mail server to it, even host your own web mail client. Having Apache is the
    first step to do this, and it is quite straightforward to then set up a mail server
    on top of it.


    Nginx is another popular choice, which looks more modern and also lets you add
    other webmail services to, along with your own web server.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_20_1.png)


    ## Nginx server


    Instead of using Apache for the server, you can also look into and try Nginx.
    Nginx handles requests slightly differently than Apache and can result in a lighter
    load on your web server, it is available in the repos of most distros, like Apache,
    so it can be installed in the same way for.


    If you need help setting it up, refer back to one of our tutorials from Mihalas
    – it is inside issue 144, if you have it to hand, and on our website: bit.ly/AYkk8


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_20_2.png)


    ## 06 Localuse


    While it will be great to access these files externally, we might have as well
    have access the FTP internally if you prefer to use a shared folder. Find the
    `local_enable` and change it to YES to make sure it''s accessible elsewhere.


    ## 07 Edit files


    As we are only letting people onto the server, we can make so anyone has access
    to. To do this, go back into the config file, look for the line `write_` and change
    it to YES. You may also need to uncomment by removing it.


    ## 08 FTP Folder


    If you didn''t create a shared folder for the previous server, now is good time
    to create a dedicated directory. In the home folder, use mkdir to create a directory
    you wish for the FTP server to be able to access it.


    ```bash

    sudo mkdir -p /home/ftp/files

    sudo chown -R ftp:group /home/ftp

    sudo chmod -R 775 /home/ftp

    ```


    ## 09 Restart server


    Once the config file has been edited and the folder is created, it is now time
    to start it. Restart the FTP server using and you will be able to access the folder.
    Any changes that you make to the configuration will require this to restart to
    become active.


