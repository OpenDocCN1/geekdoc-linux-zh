    \ function made, with a breakdown of the following columns:\n\n- calls: number\
    \ of calls\n- tottime: total time spent in function (excluding subcalls)\n- cctime:\
    \ cumulative time spent in each function plus all sub-functions\n- percall: time\
    \ divided by number of calls\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_67_1.png)\n\
    \n| 4. The Python Profilers |\n| --- |\n| 4.1. Introduction to profiling |\n|\
    \ 4.2. User's Manual |\n\nAnother parameter for the (run) function is a filename\
    \ in which you want to save the raw profiling data in order to do more complex\
    \ analysis. For example, you can use the stats from the profile to apply some\
