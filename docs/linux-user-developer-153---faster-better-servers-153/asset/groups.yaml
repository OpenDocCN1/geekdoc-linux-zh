    # 常见问题


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_69_0.png)


    ## 什么是 PaPiRus？


    为你的 Pi 用户需要一种低成本、低功耗的显示器？看看 PaPiRus HAT 吧！


    Gavin Thomas 是 Luko 和 PaPiRus 的编辑。他是一位经验丰富的记者，拥有许多项目。


    - 我猜这不属于复古纸质手工吧？

    - 上文提到它突破了最初的……对这种感兴趣……

    - 如果你……对小显示屏感兴趣但想要触摸功能？看看 PaPiRus，它由 Luko 最近为 Raspberry Pi 2 更新了版本。

    - 这次不是这样，尽管 PaPiRus 在很多方面非常像纸。


    - 噢，现在我困惑了。那么 PaPiRus 到底是什么？


    嗯，PaPiRus 是一个适用于 Pi 的 HAT，能够让你在项目中使用 Adafruit 显示器。它还让新用户的操作变得简单得多。因此，PaPiRus 是一个符合基金特定规范的扩展板。


    - 另一个像手机那样的数字显示器，或者说你的视角非常有限。因为显示器是折射光而不是从玻璃屏幕后面发射光，所以它也舒服得多。


    - 下一个：什么是电子纸（ePaper）——Kindle 用的那种东西？


    基本上如此。电子纸在 Kindle 和 Pebble 手表上非常著名地应用，孩子们仍然知道它的功耗极低，而且它像墨水一样反射光线。


    - 电子纸显示器——他们给的那些东西？——什么种质量


    当 Kindle 和 Pebble 开始使用这项技术时，质量大约相当于标准印刷报纸的水平。那时候的新产品现在仍然处于同一水平，尽管你是用智能手机创作，不过再次强调，关键优势是它的功耗极低。


    - 提醒我——再次——HAT 到底是什么？


    去年，PaPiRus 基金发布了 HAT 规范，这是一套生产 Raspberry Pi 扩展模块的指南，它们可以整齐地安装在 Pi 本身顶部——即“顶层附加硬件”（Hardware
    Attached on Top）——以及……


    - 为什么反射光很重要？


    嗯，它看起来和读起来和普通的打印文本完全一样，你可以以任何角度拿着 Adaplay 仍然看到显示的内容，而使用…………


    进一步阅读：

    通过我们的网站了解 PaPiRus 以及我们提供的各种软件包。

    如果是从 Kickstarter 获得的这期杂志，它现在应该还（在那儿）。


    70


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_70_0.png)


    ## PaPiRus 常见问题


    PaPiRus 带有 GPIO 引出连接器和焊盘，具有更强的通用性，还有一个用于配合底座闹钟唤醒的可选复位插针。


    作为一种设备，PaPiRus 通过板子上的安装孔设计为完美安装在你的 Pi 上。


    ## RasPi 杂志第十期已出版


    十个供你尝试的实用项目以及一个 Bunker T Pi 专栏。


    听过我们 RasPi 的故事吗？现在可以从 Google Play、Zine 等更多平台下载，这本面向 Raspberry Pi 爱好者的高级数字杂志充满了项目、专业建议和社区创作，为你的项目提供灵感。


    非常适合平板电脑（以及工作台！），这是一个非常非常划算的交易——每期在 Play Store 仅需 6.99 美元，一年 7.99 英镑，或者 Android
    上仅需 3.90 美元。对于读者，全年仅需 4.99 英镑。为什么今天不尝试这一期呢？


    ## 10 个启发性项目


    从微风到 Wi-Fi 信号接收器，有很多内容让你周末过得充实。其中一些项目设计得很简单，其余项目提供了建议，并附带你所需的所有代码。


    ## Talking Pi


    每个月，你的 Raspberry Pi 问题会在杂志的 Talking Pi 栏目得到解答。在本期中，有一个超大版本的 RasPi 问答，涵盖了你最常见的问题。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_70_1.png)


    ## 这为什么是一件好事？


    嗯，在任何项目中，你都可以 PaPiRus 作为永久显示器，但需要降低功率方面的消耗。如果你在花园里设置了一个小型气象站，或者用于 24/7 显示当前读数的数据记录器，或者你正在将
    Raspberry Pi 用于数字标牌，甚至是商店里的一个网络，这至关重要。然而，PaPiRus 可以让图像在屏幕上停留几天而图像不会缓慢消失。


    之后，你可以使用唤醒闹钟功能在设定时间调度你的 Pi，在永久性项目安装方面提供更多选择。此外，PaPiRus 有四个开关，你可以在需要其中一个模块时选择包含它。


    - 我也感兴趣。只有一个问题：显示效果如何？


    PaPiRus 提供几种尺寸和分辨率选项：1.44 英寸屏幕显示分辨率为 96，2 英寸屏幕分辨率为 200 x 96，以及 2.7 英寸屏幕分辨率为 264
    x 176。你可以在我们的网站上找到这些选项的所有信息，网站很快就会提供接线图、数据表和每个代码。


    ## 听起来太棒了！板子还有其他选项吗？


    板子本身集成了温度传感器和电池备份的实时时钟。带有……


    ## 街机、延时视频、气象站及更多


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_70_2.png)


