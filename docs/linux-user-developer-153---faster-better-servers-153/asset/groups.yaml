    # 开源


    06 新闻与观点 | 88 问答 | 94 来信


    发行版


    # Ubuntu Desktop Next 转向 Snappy


    # 新包格式不再仅仅用于物联网


    Canonical 已经确认其 Ubuntu Desktop Next 正在转向其新的 Snappy 包格式，以取代目前一直使用的传统的 Debian-deb
    格式。


    Canonical 引入了 Ubuntu Core，这是该公司基于 Debian 的 Linux 变体，专为嵌入式和云平台设计。Canonical 创始人
    Mark Shuttleworth 将 Snappy 描述为“十年之”。与操作系统此前青睐的“老旧 deb”格式相比，这是一次巨大的转变，每个 Snappy
    组件和应用程序都被设计为拆分可以原子更新的 OS 实体——包括回滚更新的能力。


    它具有许多实用的属性。Shuttleworth 说，“如果你能确切知道特定系统上运行着什么，并以高精度和安全性协调更新，你可以安全地运行，提前更新’。”


    更好的 Snappy 包管理意味着你可以回滚到其他相同系统的 Ubuntu 的单独更新，以查看它们是否导致了意外问题。你可以回滚更新，因为每个版本都是一个完整的镜像。这确实非常好，”他对该平台在不使用基础系统的情况下对系统之上的应用采用事务性更新的方式表示赞加。


    Snappy 包格式及相关管理的完整性已经在嵌入式和云市场中得到证明。Canonical 将其用于 Ubuntu Core，在那里允许单独更新，并被视为一种安全特性。


    现在，Canonical 已经确认它将转向桌面端，即将发布的 Ubuntu 15.10 Willy Wehr。“我们对 15.10 的计划是有一个基于 Snappy
    的基础。Canonical 的选择将是，‘这样当前的 .deb Ubuntu Desktop Next 将被构建并用新的 Snappy 版本取代。’”


    Canonical 声称，预计基于 deb 的功能将用于构建，“该该功能是缺失的’。”目前，Canonical 尚未需要在其 Ubuntu 发行版中用 Snappy
    替换 apt 包系统和 deb 格式，而是先通过 edge Desktop Next 项目进行测试。


    “对于 Ubuntu 来说，找到新方法向更广泛的受众交付软件非常重要，”Shuttleworth 在基于 Snappy 的 Ubuntu Core 发布时称，“在利用
    Snappy 环境方面还有很多要做，而且 GitHub 上大量的软件现在可以更容易地流向 Ubuntu 用户。’”


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_5_0.png)


    # Snappy Ubuntu


    一种更新桌面和设备的新方法，一种更可靠的方法。


    Snappy Ubuntu 是 Ubuntu 的一种变体，具有事务性更新，是一种更可靠、更安全的更新方法，但应用程序通过独立的方法部署。


    Ubuntu Core 的新架构让我们拥有了更好的安全保障和 apt 更新，这就是为什么我们称之为‘snappy’。


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_5_1.png)


    尝试 Snappy


    虽然在商业软件和信任供应商方面安全水平的信心是平等的，但在开源软件和设备的情况下，这种是可以构建的



