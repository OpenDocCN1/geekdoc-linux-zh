    \ in a similar way using cProfile:\n\n- python -m memory_profiler\n\nThe output\
    \ from memory_profiler is given by the line, rather than by each line, it will\
    \ print out the current usage, memory usage from the previous line and contents\
    \ of the given line. If you want to narrow down your area of interest to a single\
    \ function, you can import a function decorator to profile that function at a\
    \ time. To use it, you would use:\n\n- from memory_profiler import profile\n\n\
    ```\n@profile\ndef my_func():\n```\n\nIt is important to note that cProfile also\
    \ includes a decorator named profile, so you will be able to use both at the same.\
    \ Memory_profiler also includes an exclusive decorator called prof which can be\
