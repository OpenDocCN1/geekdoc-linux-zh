    \ that samples your program at regular intervals to see what is doing is very\
    \ high, but because it is Python it is easy to extend and add any extra functionality\
    \ you need.\n\nThere are two categories of profiling: time and memory. Time profiling\
    \ involves how much time your program takes to run. This is useful when trying\
    \ to improve the overall performance or find inefficiencies. Memory profiling\
    \ is used to analyze how efficiently you are using memory and potentially find\
