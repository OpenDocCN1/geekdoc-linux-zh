    # Tutorial


    ## Game controllers


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_29_0.png)


    Above the screen keyboard takes a little getting used to, be is a...


    ## Edit the config file


    The 50-joystick.json is where settings for each button returns are located. We
    assign each button to an action and this can be any keyboard key. Open it if you
    want to try modifying how the buttons work.


    ## Label the buttons


    What''ve done in our file is what each button corresponds to as a comment. We
    also put which key it relates to, which can help identify exactly what the setup
    should do. We recommend that you give it a try.


    ## Add a space


    In the current setup, triangle on the PS3 controller is free. If you want to use
    the controller to replace the keyboard a little as well, we can try and map the
    triangle space. In the key list, you will see that space is listed as key 65.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_29_1.png)


    ## 13 Program the button


    We have labelled it on the original file, but triangle is over "MapButton13" on
    the joystick config file. We need to change the line so it makes a space, so we
    do this by editing it to become like the following:


