    ## 10 WebKit used explain


    There are some basic principles of the WebKit handles to render. This is handled
    by the WebCore engine and is made up of specific systems: the Document Object
    Model (DOM), tree and the tree style. These render each webpage and we will break
    down and discuss them in the next steps.


    ## 11 How the DOM tree works


    Each webpage is parsed into a DOM tree of nodes, all of them to base nodes of
    Node. These nodes are relevant for actually rendering data: WebKitHTML.Document,
    which is found in the tree; all the nodes from the HTML or XML are in Elements,
    and all the raw text that gives between elements, the content on the page is actually
    rendered.


    ## 12 Structure of the render tree


    The rendering of nodes creates the render nodes in the DOM tree, with extra objects
    and nodes that do not exist in DOM. These are found in RenderObject. The RenderObject
    for a DOM node can be obtained:


