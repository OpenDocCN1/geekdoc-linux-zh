    ## Ubuntu Studio 15.04


    The distro for creatives, Ubuntu Studio updates to Vivid Vervet with a new version
    of Xfce.


    One of the more known Ubuntu Flavours, Ubuntu Studio is the spin aimed at creatives
    that offers better tool sets for audio and video production and publishing. 15.04
    brings with it many of the changes that were seen in Ubuntu 14.04, among them
    back to Xfce 4.2 which brings some small improvements.


    The only real change is the addition of a new meta-package for audio-based setup.
    Many of the other packages are self-contained. Ubuntu Studio brings in audio editors,
    synthesizers, virtual amps, JACK for connecting them and pairing audio through
    your workflow. Blender, OpenShot, GIMP and Ink for image, DaVinci and Shot for
    video, and others. Audacity, OpenOffice and Callibre for publishing, plus software
    for designing.


    It''s a distribution with all the software clearly created and, importantly, Xfce
    is a great desktop environment which, while better than Ubuntu, offers the same
    experience. Even if you''re not looking for ways to make video or audio using
    FOSS, you will enjoy the many benefits of this distro in daily use as well as
    the occasional creative project. In fact, there are tools in Ubuntu Studio even
    for non-creative users, for music scores, video editors and a screen recorder,
    a document scanner and application for photography. a well-equipped desktop for
    most home computers, let alone for an artist''s computer. 15.04 doesn''t really
    bring changes between those of the previous version, but it brings a fresh release
    nonetheless. If you need Ubuntu Studio for professional work, look no further
    than this excellent distro for the software selection is incredibly varied and
    fully categorised in the menus.


