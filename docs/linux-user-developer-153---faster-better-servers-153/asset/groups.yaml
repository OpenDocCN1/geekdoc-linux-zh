    # Tutorial Julia


    ## Draw and plot graphs using Julia


    Learn how to use 4 packages developed in the Julia programming language to generate
    plots


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_43_0.png)


    Julia is a programming language for technical computing, it was designed and developed
    to address the requirements of high-performance numerical and scientific computing,
    and you can also develop general-purpose programs in Julia. Julia tries to replace
    MATLAB, Octave and the NumPy module of Python but faster. The design is based
    on three principles: it is fast, expressive, and a dynamic programming language.
    The core of Julia is written in C, Fortran, and LLVM.


    Mihail Tsoukalos is Unix Administrator, a programmer for Unix and Linux, a mathematician.
    He has been using Julia since 1993.


    On an Ubuntu or Debian system, you can install Julia by executing `apt-get install
    julia` then check the installed version of Julia. Julia library provides libraries
    for linear algebra, random number generation, signal processing and string. We
    will present four Julia packages used for drawing and plotting.


    ## 01 The Julia shell


    Using Julia, you are mainly going to interact with the Julia shell that you can
    execute by just typing `julia`. The Julia shell is the best place to discover
    the language and try to understand its various features. You can exit the Julia
    shell by typing `exit()`.


    As most of the presented packages will need a graphical user interface, you might
    need to execute the next command before continuing, in order to install some of
    the libraries that are required.


    ```bash

    $ apt-get install libairo2-dev libpang0-dev zlib1g-dev tk-dev tcl-dev

    ```


    Below this plot was made using the Gadfly package - the most powerful of the presented
    packages.


    ## Resources


    - [Julia](https://juliaang.org)

    - [TextPlots package](https://github.com/sumnemo/TextPlots.jl)

    - [Winston package](https://github.com/sumnemo/Winston.jl)

    - [PyPlot package](https://github.com/sumnemo/PyPlot.jl)

    - [Gadfly package](https://github.com/JuliaPlots/Gadfly.jl) [jlie](https://github.com/sumnemo/jlie.jl)


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_43_1.png)


