    Q: Can I edit photos on Linux?

    A: GIMP - the GNU Image Processor - is the premier open source and image editor
    with all the same features you find in Photoshop (albeit with GIMP support), although
    the workflow is it different. It''s readily available for free, and easily installed
    from the website as well.


    Q: How do I edit video in Linux?

    A are a few great video editors in Linux like Kdenlive, which is a professional-level
    tool with lots of features for most non-professionals. For possibly something
    more advanced, OpenShot on Linux requires a little more skill to use. It is available
    on PyQt, which promises to reproduce your videos quickly.


    Q: How can I make music in Linux?

    A Audacity allows you to record and manipulate audio, with a lot of powerful tools.
    It is great for about anything you''d want to do on the audio.


    Q: How can I paint digitally on Linux?

    A: Krita is a great piece of software that is a bit more recent on the open source
    scene, and created by many digital artists as a great free alternative to many
    other proprietary apps.


