    ## X 修改


    首先，我们需要安装我们想要为 X 使用的特定摇杆驱动程序。打开终端并安装该软件包即可完成：


    ## 检查控制器输入


    如果你因为 USB 控制器在 PS3 设置下无法正常工作而需要更改输入，那么你必须弄清楚控制器上的按键。使用以下命令安装摇杆测试软件：


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_28_0.png)


    ```bash

    $ sudo apt-get install xerver-xorg-joystick

    ```


    游戏机伴随着新的控制器，而 PlayStation 4 拥有有趣的经典手柄。


    ## 获取文件


    我们创建了一个基础配置文件，可以用它让你的控制器像鼠标一样。它针对 PS3 控制器已经存在了一段时间，但我们将向你展示如何修改。在此处下载：


    Shock Duck 前面有一个触摸板。该控制器与其他控制器不同，但开发是添加额外按钮的好极方法。在此处查看更多详情：github.com/chipsn-dev


    ```bash

    $ wget http://www.linuxuser.com/uk-content/uploads/2015/05/58-joystick.cfg

    ```


    ## 测试输入


    ## 移动你的设备


    仍在终端中，在运行 jtestgtk 时加载测试器。你将能够看到如何处理任何模拟输入的校准（这有点复杂），以及哪个按键被激活了：


    ## 键绑定


    我们将从 `/usr/share/X11/joystick/` 复制 `5.1-joystick.cfg`，创建一个副本并将文件移动到文件夹：


    一旦你弄清楚了按键的功能，你现在就可以查看哪些键映射到了键盘按下。仍在终端中，通过以下方法查询：


    ```bash

    $ sudo cp 5.1-joystick.cfg /usr/share/X11/

    ```


    ```bash

    $ DISPLAY=:0 evtest -np -p _all_keys

    ```


    ... 并打开文件：


    ## 重启生效


    为了让所有更改生效，请重启。重新登录桌面环境并测试你的摇杆。PS3 控制器现在将以相同的方式移动，并分配了左键和右键，以及几个 Escape 键。


    ## 阅读使用


    你需要做的只是知道你想使用哪个键。最好使用 get''s 函数来找到它，然后按照你记录的内容设置每个部分的绑定值。


