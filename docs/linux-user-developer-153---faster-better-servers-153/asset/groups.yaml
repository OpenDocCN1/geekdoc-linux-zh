    # Tutorial


    09 Accessorise your PI

    Just setting up the operating system on the Raspberry Pi is only a small part
    of the process – we also have to consider the hardware supporting that it will
    actually make it usable as a desktop replacement.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_65_0.png)


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_65_1.png)


    12 Case for protection

    The Pi is pretty sturdy and well suited if we say we don''t regularly keep out
    of a case–it''s indestructible. While we''re doing a lot of different projects
    involving different components, a desktop Pi will require this level of access.
    We like the Pimoni PiBox cases, but there are several other secure, protective
    alternatives.


    10 Human input devices

    Standard USB keyboards and mice are best suited for this task, much more than
    a lot of the keyboard and mouse that are popular among Pi Users. Don''t try and
    save on USB ports by getting a keyboard with USB connections of its own; the Pi
    cannot use USB hubs, even when using two on a keyboard.


    You can run

    a pretty decent

    Minecraft

    a a handful of your

    friends with the Pi

    2+ inside the

    console in the

    previous issue!\![image](https://www.raspberrypi.com/sites//projects/minecraft.png)


    11 Monitor to see

    The Pi can output a maximum of 1080p, which in normal displays is 1920 x 1080.
    While it outputs only in HDMI, a lot of modern monitors have an HDMI input. If
    you don''t want to get a brand new monitor though, you can always get a HDMI to
    DVI or HDMI to VGA adapter.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_65_3.png)


    13 Wireless for Internet

    While some are fine using wired connections, not everyone has that luxury. Wireless
    dongles are a perfect fit for the Pi, especially they are almost no larger than
    the USB port themselves. However, not any dongle will work and you''ll have to
    check against this list to make sure that you get a compatible one: http://linux.org/RPI_USB_Wi-Fi_Adapters.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_65_4.png)


    14 Anything else?

    Our standard desktop PC setup is complete, with one USB port to spare. You can
    use that single for USB sticks or portable storage, or you can invest in a USB
    hub to give yourself more connectivity options. Otherwise, investing in a 2A power
    supply will make sure you''re never short on power for anything.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_65_5.png)'
