    \nIn part of our Subversion tutorial we learned the various aspects of this version\
    \ control system and how to use Subversion to perform the most common and widely\
    \ used version operations. Now how to check to get also comfortable with submitting\
    \ and receiving changes, keeping track of every change that has been made. You\
    \ can explore this by simply examining previous versions of files and directories.\
    \ Let us now look at the various ways to examine the history.\n\nDiff is a particularly\
    \ useful command for comparing your working copy to the repository. The following\
    \ command can be used to compare the working copy of a file to the specified repository:\n\
    \n```bash\nroot@po swayam$ diff -r 3 properties.txt\n```\n\n- svn diff – this\
    \ command shows line-level details of a particular change.\n- svn log – this will\
    \ give you log with date and author information attached to revisions, as well\
    \ as what changed in each revision.\n- svn cat – this helps in retrieving a file\
