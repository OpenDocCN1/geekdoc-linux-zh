    \ very difficult to master.\n\nUntil Enlightenment was stable that it wasn't receiving\
    \ any updates. However, now, it has been updated three times in months and these\
    \ were fraught with progress that eventually stalled the project.\n\nHeadway with\
    \ this mess, with the release notes indicating that over 80% of the packages are\
    \ working in GNU/Hurd and 98.25% are \"up-to-date\", but he says that most of\
    \ the time, the Hurd is approaching readiness. In fact you can check the to-do\
    \ list for yourself to see the progress being made.\n\nIn Version 19, which is\
