  mdcn: "\n\n# 开源\n您的 Linux 新闻与观点来源\n\n## 观点 \n\n### 自由软件\n\n### 小即是美\n\n互联网是一股民主化的力量，打破了文化、种族和宗教界限，但其服务仍被少数几大公司主导。\n\
    \n> 欧盟正在对 Google 的竞争性活动进行调查。此举是欧盟针对强大科技公司的一系列反垄断调查中的最新进展。Facebook 无处不在，作为一家公司，它正变得“仁慈”。Google\
    \ 增加收入的手段对终端用户几乎难以察觉，但它也是拥有世界维网的众多公司之一。其他还包括亚马逊、Facebook 和 Twitter。\n\nWeb 的承诺一直是它的多样性，一种即时媒体，我们可以在其中向全球公民分享并阐述我们的开放创新。没有人能否认这些公司提供的服务对用户具有价值，但公司的首要“职责”是为股东回报利润。利润在不同国家之间转移，公司通常在运营所在地纳税。其服务带来的便利性和成本降低是其成功和无处不在的次要结果，而搜索和记录变得消失，多样性和选择也之消失。\n\
    \n公司主导的文化导致了一个后果，即自由软件的开发者往往会转化为公司化。GPLv3 和 LGPLv3 可能会被“社区协议”和开放开发许可协议破坏，这些协议将代码的自由限制在控股公司，并允许重新许可以及随后的专利条款删除。\n\
    \n自由软件只有在被用于盈利时，才会由公司推行。许多组织合作开发开源项目以降低成本。这些源码项目存在是因为它们对底线更有利，或者出于其他原因。公司使用开放标准是因为它们降低了准入门槛并鼓励了创新。\n\
    \n欧盟对 Google 竞争行为的调查可能不仅是为了证明合理性，而且跨大西洋贸易投资伙伴关系（TTIP）协议——一种在网络类型国家之间达成的贸易协议——将赋予他们保护其公民的“权利”。这将使一套完善的合同能够治理互联网并摧毁我们的法律保护——即所谓的投资者争端解决机制（ISDS）？\n\
    \n然而，大多数公司在有利于它们的情况下运营时，倾向于支持专有标准；事实上，像 Apple 这样的少数公司支持必须摧毁一切的开放标准。微软的例子是，据发现的源码项目（通常在版权许可下发布）要求贡献者将其版权转让给实体公司。这使得贡献变得困难。如果他们和开源项目也失去了强制执行软件。用户的问题以及\n\
    \nRichard Hillary 为多种出版物撰写关于：音乐、数字权利、Linux 和各类型软件的文章。\n\n> 我们应该寻找传播多样性的方法。我们必须希望欧盟对\
    \ Google 的调查能带来更多可选方案！！\n\n这种程度的合作可以用于平息企业控制对英国医疗服务体系（NHS）的攻击，重新规范市场并防止破产；对于竞争对手律师来说，世界需要找到如何处理公司治理权。\n\
    \n我们正在寻找传播多样性的方法。正如蒂姆·伯纳斯-李（Tim Berners-Lee）在网络类型会议上所说：“除非我们有一个开放、信赖且无需担心后门发生了什么的互联网，否则我们如何拥有开放政府、良好的民主、关注医疗的社区以及文化多样性呢？仅仅认为我们能做到是不够的，因为认为我们可以坐而其成这种想法是天真的。”\n\
    \n## 嵌入式\n\n### Erle-copter 无人机搭载 Ubuntu 发布\n配备支持 Snappy 的四旋翼特制型号\n\nErle Robotics\
    \ 宣布了 Erle-copter 无人机的特版，该版本采用了 Canonical 的 Ubuntu Core 操作系统和 Snappy 包管理系统。基于\
    \ Canonical 声称该操作系统已准备好机器人项目中的事务型应用，Erle-copter Core 特制版配备了预装在 Erde-brain 微型计算机飞行系统中的操作系统版本。这随后由机器人操作系统（ROS）Indigo\
    \ 提供支持，其目标是教学和变革，但需要额外的软件。该无人机售价为 399 欧元，据称旨在通过电源模块、电池和无线电控制，激励人们关注即将到来的机器人革命。据介绍，配备\
    \ 5,000mAh 电池后，该无人机在具有 536MB 可写空间的持久性 Ubuntu Core 系统运行下，可提供 20 分钟的飞行时间；公司已确认，同时还可以完全访问\
    \ Snappy 包管理器以及基于 ROS 框架特定方法的 Canonical 官方软件商店。在撰稿时，Erle Robotics 已承诺在 5 月底开始交付首批基于\
    \ BeagleBone 微型计算机的 Erle-copter 无人机（单独售价 269 欧元）。\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_8_0)\n\
    \n## 发行版\n\n### Fedora 放弃热补丁\n随着 Linux 4.0 内核发布首次带来了对热补丁（live-patching）的官方支持，Fedora\
    \ 团队确认他们没有在其流行的发行版中启用该功能的打算。尽管计划将 Linux 4.0 内核作为标准发布 Fedora 22，但团队决定不引入新的热补丁功能（该功能允许在无需更新的情况下对内核部分进行补丁）。因此，对于\
    \ Fedora 22 用户来说，Feature 团队的 Boyer 表示，“热补丁可能非常有用，但在 Fedora 中并非必须。Fedora 团队在 Fedora\
    \ 22 以及未来的版本中都禁用了此功能。我们在 Fedora 本身并不需要补丁。可以理解，那些想要在不重启的情况下打补丁的人是为了避免针对小 Bug 和安全补丁的稳定性问题。你无法从内核\
    \ 4.0 进行补丁。”用户的问题以及\n\nRichard Hillary 撰写关于：音乐、数字权利、Linux 和各类型软件的文章。\n\n> 我们应该寻找传播多样性的方法。我们必须希望欧盟对\
    \ Google 的调查能带来更多可选方案！！\n\n这种 程度的合作可以用于平息企业控制对 NHS 的攻击，重新规范市场并防止破产；对于竞争对手律师来说，世界需要找到如何处理公司治理权。\n\
    \n我们正在寻找传播多样性的方法。正如蒂姆·伯纳斯-李（Tim Berners-Lee）在网络类型会议上所说：“除非我们有一个开放、信赖且无需担心后门发生了什么的互联网，否则我们如何拥有开放政府、良好的民主、关注医疗的社区以及文化多样性呢？仅仅认为我们能做到是不够的，因为认为我们可以坐而其成这种想法是天真的。”\n\
