    Renderers are created when a DOM node is attached. This is the render tree which
    is used to draw the page. The render tree is built from the DOM tree and is used
    to determine the layout.


    ```cpp

    void attach();

    ```


    ## 14 Destroy the render tree


    When the DOM node is removed, the render tree is also destroyed.


    ```cpp

    void detach();

    ```


