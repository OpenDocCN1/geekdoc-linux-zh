  mdcn: "\n\n# 教程\n\n## 09 为你的树莓派配配件\n仅仅在树莓派上安装操作系统只是过程的一小部分——我们还需要考虑支持它的硬件，以便它能够真正作为桌面电脑来使用。\n\
    \n![](img/dc2302183c6b3ebee0d18a3807d4d058_65_0.png)\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_65_1.png)\n\
    \n## 12 保护壳\n树莓派相当坚固，如果我们保证不经常把它放在外壳之外，它是无不可摧的。虽然我们在进行许多涉及不同组件的不同项目，但桌面级树莓派需要这种程度的可访问性。我们喜欢\
    \ Pimoni PiBox 外壳，但其他其他安全的、保护性的替代方案。\n\n## 10 人机输入设备\n标准的 USB 键盘和鼠标最适合这项任务，远比许多\
    \ Pi 用户流行的键盘和鼠标要好用。不要试图通过购买自带 USB 接口的键盘来节省 USB 端口；树莓派无法使用 USB 集线器，即使在键盘上使用了两个。\n\
    \n你可以用上一期中控制台内的树莓派 2+ 和几个朋友运行相当不错的 Minecraft！！![image](https://www.raspberrypi.com/sites//projects/minecraft.png)\n\
    \n## 11 显示器查看\n树莓派最大输出为 1080p，在普通显示器上是 1920 x 1080。虽然它只通过 HDMI 输出，但许多现代显示器都有 HDMI\
    \ 输入。如果你不想买全新的显示器，你可以可以买一个 HDMI 转 DVI 或 HDMI 转 VGA 的适配器。\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_65_3.png)\n\
    \n## 13 无线连接上网\n虽然有些人可以使用有线连接，但并不是每个人都有这种奢侈。无线适配器非常适合树莓派，尤其是它们几乎和 USB 端口本身一样大。然而，并不是所有的适配器都能用，你必须检查此列表以确保买到兼容的：http://linux.org/RPI_USB_Wi-Fi_Adapters。\n\
    \n![](img/dc2302183c6b3ebee0d18a3807d4d058_65_4.png)\n\n## 14 还有别的？\n我们的标准桌面 PC\
    \ 配置已完成，还有一个 USB 端口。你可以用这个端口接 U 盘或便携式存储设备，或者投资一个 USB 集线器来提供更多连接选项。否则，投资一个 2A 电源将确保你任何时候都不会用电不足。\n\
    \n![](img/dc2302183c6b3ebee0d18a3807d4d058_65_5.png)\n\n# 树莓派桌面\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_66_0.png)\n\
    \nLibreOffice 默认没有安装，但作为顶级的开源办公套件（或泛指 Linux 办公套件），在 Raspbian 上可以轻松使用，这是很有用的。\n\
    \n![](img/dc2302183c6b3ebee0d18a3807d4d058_66_1.png)\n\n## 15 添加额外软件\n\n我们的树莓派桌面还没有完全完成。我们需要添加一些额外的软件，让它感觉更像一个真实的桌面。虽然我们在基础软件中已经安装了浏览器，我们应该添加的第一个软件是办公套件。\n\
    \n## 16 使用 LibreOffice 工作\n\nLibreOffice 默认没有安装，但作为开源办公套件（或泛指 Linux 办公套件），在 Raspbian\
    \ 上可用，这是很有用的。打开终端并使用以下命令安装：\n\n```\n$ sudo apt-get install libreoffice\n```\n\n\
    ## 17 使用 GIMP 处理照片\n这是一个大项——原始的树莓派无法处理 LibreOffice，但使用 GIMP 是没用的。GIMP 运行得良好，尽管更复杂的任务可能会让它变慢。使用以下安装：\n\
    \n```\n$ sudo apt-get install gimp\n```\n\n## 18 使用 RIX 音乐\n\n如果你需要听音乐，RIX 是你可以查看的最好的软件之一。它是免费的，你可以在需要时在\
    \ Pi Store 中找到它。\n\n## 19 树莓派桌面\n\n现在你准备好将你的树莓派作为桌面系统使用了，并在需要时利用它的功能。软件仓库和 Pi\
    \ Store 应该包含你想要的任何其他软件，或者充分利用你新树莓派系统的软件：上，通过 Pi Store，你可以运行完整的办公套件而不会遇到任何尴尬。\n\
    \nwww.linuxuxer.com | 67\n\n# Python 专\n\n## Python 代码性能分析\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_67_0.png)\n\
    \nJoey Benard 是一位软件工程师，他花时间为进行科学计算的研究人员构建工具并编写应用程序。\n\n在树莓派上编写代码面临的问题之一是资源有限的，这意味着作为程序员，需要更关注你的代码在做什么以及如何运行。由于\
    \ Python 是首选语言，我们将使用性能分析（profiling）来精确定位瓶颈。性能分析分为两类：确定性分析（deterministic）和采样（sampling）。确定性分析跟踪程序中每条指令的执行。这种方法的优点是你可以得到正确的结果，但缺点是它引入了大量的开销。最简单的性能分析是使用\
    \ `time` 函数，你可以将其用于代码块以查看需要多长时间。Python 标准库包含了两个模块：`profile` 和 `cProfile`。`cProfile`\
    \ 提供了关于模块的详细信息。另一个选项是在命令行中使用它。如果你不需要那种控制，可以使用 `cProfile`。在本期中，我们将使用性能分析来查看脚本。默认输出显示了脚本在所有函数上花费的总时间以及每个函数的被调用次数，带有以下列：\n\
    \n- calls: 调用次数\n- tottime: 函数内总时间（不包括子调用）\n- cctime: 函数内累积时间（包括所有子调用）\n- percall:\
    \ 时间除以调用次数\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_67_1.png)\n\n| 4. Python\
    \ 性能分析 |\n| --- |\n| 4.1. 什么是性能分析 |\n| 4.2. 用户手册 |\n\n另一个参数 `(run)` 是文件名，你可以在其中保存原始性能分析数据以便进行更复杂的分析。例如，你可以使用\
    \ `stats` 来应用不同的排序或过滤。对于内存性能分析，最常用的选项是 `memory_profiler`。它通过 pip 可用，使用以下命令安装它：\n\
    \n- install memory_profiler\n\n如果你想查看整个脚本的内存使用情况，可以使用类似于 `cProfile` 的方法增加行：\n\n\
    - python -m memory_profiler\n\n`memory_profiler` 的输出按行给出的，它会打印当前行的内存使用情况。如果你想将感兴趣的区域缩小到一个函数，可以导入一个装饰器来分析该函数。要使用它，你会使用：\n\
    \n- from memory_profiler import profile\n\n```\n@profile\ndef my_func():\n```\n\
    \n需要注意的是，`cProfile` 也包含一个名为 `profile` 的装饰器，可以用于分析外部脚本或代码。要记录数据，使用：\n\n- mprof\
    \ run myscript.py\n\n然后你可以通过以下命令获取内存使用图：\n\n- mprof plot\n\n通过 `memory_profiler`\
    \ 还有其他几个函数。现在你已经知道代码的哪些部分需要检查，我们将查看细节并跟踪可能适用于你的特定问题。如果它们没有指向你应该进一步考虑的方向。\n\n#\
    \ 完整代码列表\n\n# 每当你使用 `memory_profiler` 或 `cProfile` 的任何可用装饰器时，可以使用此文件。你可以使用如下命令运行：\n\
    # python -m memory_profiler myscript.py\n\n```\nmyscript.py\n\n@profile\ndef my_func(x):\n\
    \    if x == 0:\n        return 1\n    elif x == 1:\n        return 1\n    else:\n\
    \        return my_func(x-1)\n\nmy_func(3)\n```\n\n# 下文件用于显式运行来自性能分析器的函数：\n\n\
    ```\nmyscript.py\n\nimport memory_profiler as mp\n\ndef my_func(x):\n    if x\
    \ == 0:\n        return 1\n    elif x == 1:\n        return 1\n    else:\n   \
    \     return my_func(x-1)\n\nmp.run(\"my_func(3)\")\n```\n\n# 输出将是：\n\n12 functions\
    \ (3 primitive calls) 耗时 0.000 秒\n排序方式：标准名称\n\n| ncalls | totaltime | pertime\
    \ | percall | filename | lineno(function) |\n|---|---|---|---|---|---|\n| 1 |\
    \ 0.000 | 0.000 | 0.000 | 0.000 | <string>:1:<module>> |\n| 10/1 | 0.000 | 0.000\
    \ | 0.000 | 0.000 | myscript2.py:3(my_func |\n| 1 | 0.000 | 0.000 | 0.000 | 0.000\
    \ | (Method \"disable\" of 'lprof. |\n| | | | | | objects\") |\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_68_0.png)\n\
    \n"
