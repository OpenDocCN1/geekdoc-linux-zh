    # # From repository


    If you decide to build your packages, you may want to organise them into repositories
    to use with a software management tool. In the case of Ubuntu and Debian, you
    will need to install the dpkg-dev package. Now, put your .deb files into a directory
    of your choice. You will then need a script to create and maintain repository
    index files; it could be like this:


    ```

    ```bash

    #!/bin/bash

    cd /path/to/debs

    dkg-packages --dev | zip -gz Packages

    ```

    ```


    Finally add a line to your sources, listing your repository. The line will look
    like this:


    ```

    ```text

    deb /path/to/debs /

    ```

    ```


    In Fedora/CentOS and various distributions you will need to create an RPM package
    instead of a deb package. You can use the `rpmbuild` tool to create and maintain
    repository index. In Fedora/CentOS and various distributions you will need to
    create an RPM package instead of a deb package. You can use the `rpmbuild` tool
    to create and maintain repository index.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_24_0.png)


    After that, create a repo file in the /etc/yum.repos.d/ directory. The content
    of the file should comply with the simple template below:


    ```

    ```

    [local]

    name=your-distribution-release local packages

    baseurl=file:///path/to/rps

    enabled=1

    gpgcheck=1

    ```

    ```


    Yum repositories are also supported in OpenSUSE/Suise Linux Enterprise, and you
    can add them with the YaST software or the command line, like this:


    ```

    ```bash

    zypper addrepo 1 /path/to/rps

    ```

    ```


    It''s really simple to create ours packages you know now!


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_24_1.png)


    # 01 Why we might need to edit


    Let us first list some cases where your files are in a package repository. To
    start with, your distribution may make the package you need. You may need to build
    it from scratch (the hard way) or use distribution (generally preferred). However,
    not all software is open, so you may need a binary-only application or a set of
    random files to make it installable with a few clicks. This is often the case
    for proprietary software, software items like the Viwind Builder or Skype VoIP.


    # 02 The inside of RPM


    When you download an RPM file it will be easy to install and test, but you can
    also use it as an archive file. RPM file is just like a ZIP archive. It works
    the same way as you. When you''ll see the file, there''s more to it as RPM contains
    metadata which contains scripts to execute after installation, permissions, copying
    and removing files, or any other action in bash.


    When you unpack an RPM file it is designed for, if x86_64, i386, or noarch, it
    is generated from a source of an application and a file, which defines the commands
    and requirements to build it. This is also known as SRPM. If you need to re-pack
    a property application, sometimes only a property spec file is required, as it
    obtains the rpm files automatically.


    # 03 Compile RPM from a source RPM


    For the impatient, the command is: rpmbuild --build /tmp/rpmbuild-1.0.0-source.rpm.
    Another way is to install the source packages as follows:


    Left Deb and RPM packages are easy to install and use. You can always pull out
    their contents with standard archive managers


    # Alien vs DEB/RPM


    Alien is a tool that converts a deb package into an RPM package. It works greatly
    for many things like binary-only packages that need a DEB to RPM, using the following:


    ```

    ```bash

    alien -c /path/to/yourpackage.deb

    ```

    ```


    rpm -i /tmp/rpmbuild-mypackage.spec


    , and then address the spec file:


    ```

    ```bash

    rpmbuild --bbdb &mypackage.spec

    ```

    ```


    Note that all comments should be issued under a regular user account and not,
    due to security reasons.


    To make things work, you''ll need the rpmbuild and all dependencies and compilers
    required to build it. If you need to install a package something that is already
    present in your system''s packages, you may try zypper -d my package in OpenSUSE,
    yum install build-package in OpenHEL/Magora, or yumbuilddep rpm


    As you noticed, the contents of the src.rpm file are installed into the rpmbuild
    directory inside your home folder (-). This is where standard tree of an RPM package
    resides, along with a full set of subdirectories: build, rpm, rpms, source, specs,
    spsrc


    The reversed action is shown


    ```

    ```bash

    alien /path/to/mypackage.rpm

    ```

