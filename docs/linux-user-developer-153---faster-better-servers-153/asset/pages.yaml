  md: '# Review Raspberry Pi HTPCS


    # OSMC


    # XBian


    The new kid in town that features the most radical departure from Kodi


    Overlooked for years, is XBian''s lack of notoriety for a reason for concern?


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_73_0.png)


    +   - OSMC is the most unique-looking of Kodi front-ends


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_73_1.png)


    This setup is wizards of XBian''s keys advantages over the rest


    # Ease of use


    # Ease of use


    While OSMC has a different look to the default (and probably best) Kodi, it''s
    essentially the same in terms of moving through the menus. There''s also a ''My
    OSMC'' menu with settings and information not found in the normal Kodi settings,
    which it could be useful to use.


    One of the most things missing from XBian is a decent setup wizard. Recent versions
    have added some tweaks to help you navigate the interface better, but when you''re
    go digging in menus it gets frustrating. XBian are an excellent first-time setup
    compared with the rest of Kodi''s great whisk.


    # Compatibility


    # Compatibility


    It''s built on all of Kodi''s excellent playback and codecs. You can run any type
    of media on it and will most likely be able to play it and access any other features
    that it has, like subtitles or language tracking to make a just feel just as easy.


    With a fully built XBian runs almost everything, or at least everything that matters
    to the majority of media consumers. We briefly mentioned the best wins in the
    OSMC part of this test group; it includes YouTube (about a right) and other video
    codecs, podcasts, RSS feeds and more.


    # Speed


    # Speed


    On the Raspberry Pi 2, OSMC runs extremely well with the small hints and bits
    of lag that are common with Kodi on the Raspberry Pi. It runs fairly quickly,
    although the software slows down the interface while it''s running, sometimes
    as far as registering input for a few which is annoying but not really detrimental.


    XBian is probably the slowest out of the three Kodi implementations in this test
    - the difference is not in the great scheme of things, but when OpenLEC runs plenty
    instantly, it''s a bit not noticeable lag. Otherwise, interface navigation is
    fine and perfectly playable.


    # Updates


    # Updates


    OSMC has its own updating software that you can set on a schedule, and with the
    speed in it, it is best to save it for a time when you''re using it. However,
    you can also do it manually if there is a new build you absolutely need right
    now.


    You can update XBian from the setup, and when it''s updating, the interface works
    fine. It also has a scheduling feature like the others and lets you choose packages
    to update. It gives a breeze update which is just just when you choose manual
    update, leaving you exactly know what is going on.


    # Overall


    # Overall


    > OSMC does a little more work before it becomes a better alternative to the likes
    of OpenLEC – or its predecessor Raspmic. Keep an eye on it over the next year,
    there''s a lot of potential.


    XBian is great, a straightforward first-time setup that won''t have you digging
    around other menus. The overall Kodi experience is worth it.'
