    Tukasa


    This is actually a problem with Linux and not OCS: the cron job doesn''t know
    the path config. The solution is to enter the cron job as follows:


    ```

    * * * * * /etc/usr/local/bin/ocs-inventory-agent >/dev/null 2>&1

    ```


    You can check this by running ocs-inventory-agent --local=/ from the command line
    and then from the cron. The cron which has the correct path, works; the cron job
    (without the path), you get a <NETWORK> section.


