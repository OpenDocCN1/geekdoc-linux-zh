    # ## GPIO Tool for Raspberry Pi


    Since some people have a list of GPIO pins they want to manage, but lost are always
    looking for inspiration. Download GPIO Tool for Raspberry Pi and you can create
    new lists. It''s a must have bag but it''s free, with in-app purchases.


