  md: '# Tutorial Game controllers


    # Set up game controllers to work on Linux


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_27_0.png)


    Try out Linux with a PlayStation, Xbox or other USB controller - perfect for media
    PCs


    Keyboard and mouse are the mainstay of GUI interaction. While we may laugh at
    the very first mice from the Sixties, it''s been the primary way we interact with
    graphical interfaces for a long time now, and even with the advent of touchscreen
    computers it doesn''t seem like it''s going away. Using a gamepad as an alternative,
    there are still other ways to control on a graphical desktop. In this cases, we''re
    talking about game controllers. They are quite simple in many ways - you move
