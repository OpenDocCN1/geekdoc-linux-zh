  md: '# RasPiViv


    Nente Beng tells us how he built an environmental control system to keep seven
    poison dragon fogs


    # So, what do you keep in the vivarium?


    Right now I have poison dragon frogs—they are from South America. They secrete
    alkaloids, but in captivity, because their diet is just fruit, they can''t produce
    any poison. They''ve been interesting to me since I saw them first when I was
    in grade school at a trip to the Denver Zoo, and I just wanted them then. Even
    later in life I wanted to keep them but the opportunity never came—they''re rare—until
    I found an incredible collector who breeds them to support his hobby. Now I have
    a total of eight, which I think would be a breeding pair, and I recently obtained
    five yellow-banded poison dragon frogs.


    Further, I was just making this for myself and posted it on a forum. Then some
    of people became really interested, so I said I would work together a guide (see
    www.raspi.com).


    So the temperature and humidity are read every 60 seconds and I used the DHT11
    and Adafruit''s DHT22 sensor (and the driver for it, which is for brains and works
    with a relay and a basic transistor switch). The main idea was to have a fan that
    turns on if the temperature or humidity gets too high. The database is read every
    five minutes, and the fan turns on to blow in some fresh air.


    lighting, any mixing system or fans you have—essentially for any component that
    you want to control, it''s just a matter of getting a relay module and wiring
    it up.


    # Are you planning to upgrade the RasPi software at any point?


    I''m still working on this in my downtime and got insanely busy, so I haven''t
    been able to do much more yet. I''d like to add some more control using simple
    software and I''m hoping to implement that. I want them to be able to do it by
    just adding lines to the code.


    # What kind do you need for the vivarium?


    The temperature is really important, which a lot of people have because your humidity
    is going to be kept between 75 and 85 degrees, and the temperature is going to
    be between 70 and 80 degrees. It is important because the frogs use the humidity
    to regulate themselves, like we do.


    So basically, I needed a way to monitor and regulate the humidity, looked around
    for a couple of days and then found a couple of systems that are much better than
    what people use, but they weren''t good enough.


    You don''t see me in the den because there''s also an account and secure—so I
    have a web interface controller. Check out the tutorial for it. I''ve been using
    the Raspberry Pi with all the components, and now I have a Raspberry Pi 2 just
    so I could potentially pull off some live feed camera that you can watch as well
    as all the other stuff that it does.


    # What hardware did you need to make your own server?


    The RasPiViv is set up as a LAMP server. I started playing around with the DHT22
    temperature-humidity sensor—originally I just wanted to prototype the temperature
    and the humidity, but then I got into using relays to control the lighting and
    it just progressed from


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_56_0.png)


    Nente Beng is an amateur photographer and writer from Weaston Denver in Northern
    Colorado. He has written about electronics, technology, and as much as he can
    come up with Linux communities in all the places he likes.


    # Like it?


    Fancy building your own vivarium? Check this step-by-step guide that takes you
    from the hardware to the regulation control.


