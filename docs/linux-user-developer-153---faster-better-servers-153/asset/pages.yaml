    # Ubuntu Desktop Next switches to Snappy


    # New package format not just for the Internet of Things anymore


    Canonical has confirmed that its Ubuntu Desktop Next is making the move to its
    new Snappy package format, in place of the traditional Debian-deb format it has
    used until now.


    Canonical introduced Ubuntu Core, a variant of the company''s Debian-based Linux
    designed for embedded and cloud platforms, Snappy has been described by Canonical
    founder Mark Shuttleworth as ''the best in ten years. A dramatic shift from the
    ''aged-deb'' format


    previously favoured by the operating system, each Snappy component and application
    are designed to split OS entities which can be updated atomically - including
    the ability to roll-back updates.


    Do have many useful properties. If you can know exactly what''s running on a particular
    system and coordinate updates with high precision and safety, Shuttleworth said,
    ''You can run safely, updates ahead''


    Better Snappy package management means that you can roll-back individual updates
    to Ubuntu


    of other identical systems to see if they cause unexpected problems. You can roll
    updates back, as each version is a complete image. That''s very nice indeed,''
    praised the way the platform embraces transactional updates without the base system
    but for applications on top of that system


    The complete with the Snappy package format and associated management has been
    proved in embedded and cloud markets. Canonical uses it for Ubuntu Core, where
    it allows individual updates and is seen as a security feature.


    Now, Canonical has confirmed it is move to the desktop, the upcoming Ubuntu 15.10
    Willy Wehr. ''Our plan for 15.10 is to have a base based on Snappy. Canonical''s
    choice will be, ''so that the current .deb Ubuntu Desktop Next will be built and
    replaced with the new Snappy version.''


    What is expecting deb-based will be built for, Canonical claimed that ''that feature
    is absent.'' At present, Canonical has never had to replace the apt package system
    and deb formatting with Snappy on its Ubuntu distributions, testing the waters
    with edge Desktop Next project first.


    ''It''s important for Ubuntu to find new ways to deliver software to a wider audience,''
    Shuttleworth claimed at Snappy-based Ubuntu Core''s launch. ''There is a lot to
    do in making the most of the Snappy environment, and there is plenty of software
    on GitHub that can now flow more easily to Ubuntu users.''


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_5_0.png)


    # Snappy Ubuntu


    A new way to update Ubuntu for desktops and devices, a more reliable approach.


    Snappy Ubuntu is a new variant of Ubuntu with transactional updates, a more reliable
    and safer way to update Ubuntu, but applications are deployed through a separate
    method.


    The new architecture of Ubuntu Core has us better security guarantees and apt
    updates - and that''s why we call it ''snappy''


    Snappy works and Ubuntu Core can be updated atomically or rolled back if needed
    - a philosophy that can be deployed on many different systems. It''s called ''transactional''
    or ''image-based'' systems, and it is designed to make it available on every Ubuntu
    device.


