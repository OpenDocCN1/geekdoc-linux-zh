    I am currently monitoring those. When I execute the /usr/bin/ocs-inventory-client,
    the server gives me the IP address correct. But after some time, when they send
    their inventory, the IP addresses of clients disappear from the server. They are
    gone until I execute /usr/bin/ocs-inventory-command manually.


    I have set a cron job for every six hours to send inventory to the server. When
