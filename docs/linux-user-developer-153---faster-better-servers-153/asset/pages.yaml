    10 GB


    Ubuntu Studio 15.04 doesn''t really bring changes between those of the previous
    version, but it brings a fresh release nonetheless. If you need Ubuntu Studio
    for professional work, look no further than this excellent distro for your work.


    **Gavin Thomas***'
