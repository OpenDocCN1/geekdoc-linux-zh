  md: '# EMBEDDED


    # Erle-copter drone launches with Ubuntu


    Special edition model with quadcopter with Snappy support


    Erle Robotics has announced a special edition of the Erde-copter drone, featuring
    Canonical''s Ubuntu Core OS and Snappy package management system. Building following
    Canonical''s claim that the operating system is ready for transactional application
    in robotics projects, the Erle-copter Core special edition features a build of
    the operating system preloaded into the Erde-brain microcomputer flight system.
    This is then supported by the Robot Operating System (ROS) Indigo aimed to teach
    and revolution, but requires add-on-software. At priced at €399, the drone is
    claimed to be aimed to inspire people about the upcoming robotics revolution with
    power module, a battery and radio controls. When fitted with a 5,000mAh battery,
    the drone is said to offer a 20-minute flight time under the everlasting Ubuntu
    Core system with 536MB of writable free space, the company


    has confirmed, along with full access to the Snappy package manager and Canonical''s
    own software distribution store based on the ROS framework''s more specific approach.
    At the time of writing, Erle Robotics has pledged to begin shipping the first
    Erle-copter Ubuntu Core edition drones by the end of May, based on the BeagleBone
    Black microcomputer, is available separately, at €269.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_8_0.png)


    # DISTRO


    # Fedora opts out live-patching


    Along the Linux 4.0 kernel release brought official support for live-patching
    for the first time, the Fedora team has confirmed that it has no intentions of
    enabling support for the feature in its popular distribution.


    Despite planning to release Fedora 22 with the Linux 4.0 kernel as standard, the
    team decided against introducing the new live-patching functionality which enables
    portions of the kernel to be patched without the usual need for an update reboot.
    As a result, live-patching of the kernel will not be available to Fedora 22 users.


    “Live-patching could be very useful, but it is not quite necessary in Fedora,”
    said Boyer of the Feature Team, “and we don''t need a whole lot of sets for Fedora.
    The Fedora team has this functionality disabled, both in Fedora 22 and upcoming.


    “We do not really need patching functionality in Fedora itself. It’s understandable
    that people who want to patch without rebooting avoid stability issues targeted
    at small bugs and security patches. You cannot, live patch from kernel 4.0 to
    4.1. Given that the kernel release is stable enough for the lifetime of a Fedora
    release, we don''t have opportunity to build the live patches. Our update shipping
    infrastructure is also not really geared towards frequent updates.”


    For fans who would still like to use live-patching, the kernel-patching Copr has
    the functionality.


