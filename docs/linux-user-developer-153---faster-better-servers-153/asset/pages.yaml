    It’s common to describe repositories in terms of a ‘trunk’ and ‘branches’. The
    trunk is the main body of code within version control. If you use Subversion you
    have branches; it’s easy to create a basically copy of the trunk in the repository.
    Each commit creates a new directory, also known as a branch. It has become practice
    for developers to create their own branch in the repository. With this, a developer
    is able to do his work without interfering with other developers.


    The svnlock command helps the developers to create, release, and steal locks,
    this is useful when a developer wants to lock a file before starting editing.
    Subversion provides a special property for this: svn:locks.


    Creating a branch is simple. Since a branch is a copy of the trunk, using the
    svn copy command working in a branch is no different from working in the versioned
    repository.


    As good practice, developers are encouraged to attach the svn:locks property to
    any file they consider to lock. This is because it avoids merge conflicts when
    multiple people commit simultaneously.


    Let us understand another important concept in Subversion – Changelists are arbitrary
    lists that let associate multiple files with one commit. You can modify and delete
    changists using the svn changelist command. It is noted that a changelist is effectively
    created the first time a file is changed in a working.


    The act of replicating changes from one branch to another is possible by using
    the svn merge command. The basic-type merge instructs Subversion to merge all
    changes that have not yet been merged into the current working directory. After
    merging, you may need to resolve some conflicts or the merge will work properly.
    If there are issues, it’s good to idea to abort the changes by running svn revert
    -r – but if they are good then you can commit the changes.


    A very useful concept in Subversion, the changists are artifacts of a particular
