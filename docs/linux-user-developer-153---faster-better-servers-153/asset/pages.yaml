  md: '# Feature Build better servers


    # BUILD A WEB SERVER


    Host your webservices deidication on a dedicated server that you control


    Your own web server can be a useful addition to any system. If you don''t have
    massive loads to worry about you can install it to host your own cloud server,
    or if you have large of scalable server space you can build it on one or two with
    similar software setup.

    We are going to use Ubuntu Server for this, so follow our advice on the previous
    pages on how to get a server running before we start adding Apache servers. Feasibility,
    you could have the server be both a file and web server in this way.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_19_0.png)


    # It works!


    This is the default page for this server.

    The web server software is running but no content has been added, yet.


    # 01 Install Apache


    Once you''ve got your server set up and can SSH in, it''s time to install the
    Apache web server. Do that using the following:


    ```

    $ sudo apt-get install apache2

    ```


    It will automatically set the domain address to the following: 127.0.0.1


    # 02 Test server


    If you did install a GUI on your server, you can test that Apache is working by
    going to a browser in and navigating to 127.0.0.1. From an external system, navigate
    to the full address of your system in your browser and it should show the Apache
    confirmation page on-screen.


    > With a web server you can now use it to host a website or to access storage
    from the server remotely over the Internet


    # 03 Install FTP


    With a web server you can now use to host a website or access storage from the
    server over the Internet. We can set up the latter using FTP, or in case your
    server VSFTTP, install it to the system:


    ```

    $ sudo apt-get install vsftpd

    ```


    # 04 Configure FTP


    We can access the configuration file for FTP by opening /etc/vsftpd.conf sudo
    nano /etc/vsftpd.conf. From here we can connect it to our almost, but first it
    is necessary that we increase the security slightly before using it properly as
    an FTP server, just to be on the safe side.


    # 05 Secure FTP


    The main change is to make the FTP server to turn off anonymous users. In the
    config file, look for the line with "anonymous". We want to set this to NO if
    it is not already, just to make sure that there is all of your content is kept
    private.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_19_1.png)'
