    # 02 Install Raspbian


    Once Raspbian is downloaded, you can install it to this desktop by hit the micro
    SD into an SD card reader and connect it to your main system (a PC or laptop).
    Open up the terminal, `cd` to the location of the image and use it.


    ```

    $ sudo dd bs=4m if=raspbian.img of=/dev/sdcard

    ```


    # 03 Setup options


    On first boot, there will be some setup stuff that is necessary you go through.
    The most important things to do is first hit ''Enable Boot to Desktop'' and then
    extend the partition to fill the SD card. After you do that, doing anything else
    through these menus and reboot before moving on to the next step.


    # 04 First boot


    You will boot into a fresh version of Raspbian with the newer interface and apps
    available to use. From here you can start it as a PC if you wish, but it is worth
    noting that Raspbian has some things that you should do to make it truly desktop.


    # 05 Software updates


    Our first step is to perform an update on the system to make sure it''s up to
    date and working properly. To do this, open up the terminal from the menus and
    use:


    ```

    $ sudo apt-get update

    ```


    ... to refresh the software list, followed by the next command to upgrade new
    software:


    ```

    $ sudo apt-get upgrade

    ```


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_64_1.png)


    Above Make sure you set the Pi to boot straight to the desktop, like your main
    computer


    # 06 Firmware upgrade


    When we''re updating, it''s a good idea to upgrade the firmware on the device.
    Still in the terminal, you''ll want to activate the firmware software with:


    ```

    $ sudo rpi-update

    ```


    # 07 Extra configuration


    At this point, you might want to tweak the Pi little further. After the initial
    configuration, you''ll need to go back into the terminal and launch it with:


    ```

    $ sudo rpi-config

    ```


    # 08 Advanced options


    From here you can activate some options that you might need in the future. Enabling
    the Pi camera driver is a good first step, and you even have to Scratch if you
    want to focus on game development. Otherwise, there are also some overclocking
    options that you can consider if the system starts giving you slow.'
