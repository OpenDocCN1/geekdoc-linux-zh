  md: "# Tutorial Subversion\n\n# # Locking your files\n\nLocking is important to\
    \ understand that in Subversion, it is a mechanism that can prevent exclusion\
    \ between users to avoid conflicts. However, everyone will have a unique lock\
    \ on repository items including creation, enforcement and removal.\n\nchanges\
    \ can be easily unnamed using the svn command. It can be noted here that the properties\
    \ respond to the issues of use like svn commit, svn update and revert in the same\
    \ way that the contents of the file do.\nAs expected, the former will allow the\
    \ developer to see the current value of a property that they are about. One can\
    \ retrieve information about the file and directory properties by using the svn\
    \ and diff commands. It is illustrated in the following:\n\n```\n### [root@biblr-swampaj]#\
    \ svn status properties\n```\n\n```\n# feature/properties.txt\n```\n\n```\n###\
    \ [root@biblr-swampaj]# svn diff properties\n```\n\n```\n# feature/properties.txt\n\
    ```\n\nProperty changes on feature/properties.txt\n\n> [root@biblr-swampaj]# svn\
    \ lock feature:\nproperties.txt\n\n> \"feature/properties.txt' locked by user\
    \ 'xxx\"\n\nNow, if the user 'xxx' tries to lock the same file, Subversion will\
    \ throw an error. But the user can forcibly lock the same file using the --force-option,\
    \ as shown below:\n\n```\n[root@biblr-swampaj]# svn lock feature:\nproperties.txt\n\
    ```\n\n```\n\"feature/properties.txt' locked by user 'xxx\"\n```\n\nYou can also\
    \ pass a message to the lock with the -m option, and this message will be the\
    \ reason for locking. Unlike the svn commit, the lock does not have the preferred\
    \ text. It is also important that the lock will show the latest version of the\
    \ file. If that was not the case, the repository would have requested the lock\
    \ request update and commit lock. As can be seen from the above examples, svn\
    \ lock command will provide the confirmation of a successful commit. When a file\
    \ is locked or not confirmed by the user,\n\nIt's also worth noting that when\
    \ a developer introduces a new version to a control, Subversion will automatically\
    \ create a lock.\nLet's look more about locking in Subversion.\nA lock can be\
    \ designated as metadata that grants access to one user, the user is referred\
    \ to as lock owner. Locking in Subversion prevents conflicts saves time and effort.\
    \ By locking a specific file, they know that their efforts will not get wasted.\
    \ It is to be noted that, by default, not locked in Subversion means that any\
    \ one can commit changes to the file at any time. Subversion provides the lock\
    \ lock command to enable a user to lock a specific file, preventing others from\
    \ committing to it. The locked file cannot be modified in any way in the repository\
    \ and can be deleted or removed, by the lock owner. The following examples illustrate\
    \ use of svn lock:\n\n```\n### [root@biblr-swampaj]# svn status feature:\nproperties.txt\n\
    ```\n\n```\nK feature/properties.txt\n```\n\nThe K's displayed next to the file\
    \ indicates that the lock token is present.\n\nIf we look out of the svn command\
    \ we can see detailed information about the lock, such as the lock owner, commit\
    \ date and lock message.\nA typical example shows the following:\n\nBelow are\
