    # Use an Xbox 360 pad


    Using a 360 controller on Linux is a slightly different process as it uses its
    own specific driver. While it is different (and to the controller), there are
    also ups that gives you a little more control over what you can do.


    # Add new drivers


    Open the terminal and install the xboxdrv drivers so we can use with the 360 controllers
    if you have a USB adapter:


    ```

    $ sudo apt-get install xboxdrv

    ```


    # Quick mouse


    Once it''s installed, you can plug it in your controller and quickly activate
    it to use with the built-in tools by using the two commands:


    ```

    $ sudo rmmod pad

    $ sudo xboxdrv --mouse

    ```


    # Default mouse controls


    By default the controller will have a series of mouse and keyboard functions.
    The left stick is used for the mouse pointer, while the A button is used for left-click
    and the B button for right-click. If you enter, the control on the left stick
    is back and there are a few more assigned by default.


    # Modify the buttons


    Even though this is the default, you can change it as you wish - to do it on the
    command line when you want to setup the mouse by adding extras to the command.
    The left stick mapping is a bit more complicated than on the PS3 controller. Refer
    to the xboxdrv documentation on how you can make it of them: bit.ly/Ry5


    # Custom script


    If you want the 360 controller to start on startup, you will need to use a script
    and activate it during startup - otherwise you will have to manually enter the
    command every time turn on your system.


    # Control your PC


    With these tools you can start properly controlling your controller using these
    games. Use it in your room, on your main system, or wherever is the most convenient
    for you. Soon you should be able to do it, with PS4 and Xbox One controllers as.


    Above You can use multiple controllers by running instances of the xboxdrv driver'
