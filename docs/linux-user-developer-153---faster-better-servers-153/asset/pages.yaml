    # 11 Plot two or more functions with Gadfly


    Gadfly can easily plot two or more functions on the same output. The following
    draws cos(x), sin(x) and tan(x) functions on the same plot:


    ```

    julia*plot(cos, sin, tan), -pi, pi)

    ```


    Gadfly automatically adjusts the legend style at the right side of the output:


    # 12 Draw boxes using Gadfly


    A box plot can give you regarding regarding shape, variability and median of a
    statistical data set and enables to detect outliers quickly and clearly. Gadfly
    can easily draw a box plot with random values using the following command:


    ```

    julia*plot(randn(20), randn(30), geom.boxplot)

    ```


    # 13 Get data from import files


    Julia lets you read text file, import data and assign it to a variable using your
    code. The following command reads the called text file and declares that values
    on the same line are separated using commas:


    ```

    data = read("test.csv",")

    C1 = data[:,1]

    C2 = data[:,2]

    ```


    # 08 Beautify the default output


    The next command enhances the previously generated output by making it more elegant:


    ```

    plot(0, 25, guide.ticks(ticks=1:25), orientation=:vertical, guide.ticks(ticks=1:25),
    guide.label("f(x)", guide.xlabel("X Value"), title("For A LIIT example"), default_color="#F0F0F0",
    default_point, size=20, fill_color(color="red", stroke="blue", width=2)

    ```


    # 09 Options of the TextLets package


    The following command plots functions on the same output:


    ```

    plot(x->cos(x), x->x(x), -3,:border)

    ```


    The subsequent command removes the border from the output of TextLets:


    ```

    plot(x->cos(x), x->x(x), -3,:border, title=title, labels=labels)

    ```


    Finally, the following command draws pairs of points on the screen (a scatter
    plot):


    ```

    plot(-1, 1, 1, 1, [0, -1, 0])

    ```


    # 10 Draw a histogram using Gadfly


    Gadfly can easily plot histograms. The following draws a histogram with randomly
    generated values:


    ```

    julia*plot(x=randn(1000), histogram(bincount=100))

    ```


    The bincount variable defines the number of equal-width bins in the range:


    # 14 Save the output to an image


    This package allows you to save the output to an image. As you can understand,
    there is no point of saving the output of TextLets to a file - you can just copy
    and paste it. The command for saving the current Windowplot graph into a file
    namedsave.png, is the following:


    ```

    julia*save_fig("mysave.png")

    ```


    The command for saving the current Gadfly graph into a file named gadsave.png
    is shown below:


    ```

    julia*draw("PNG":"Gadsave.png", 100cm, 5cm)

    plot(cos, 0, 25)

    ```


    Alternatively, you can use the following equivalent technique:


    ```

    julia* p=plot(cos, 0, 25)

    draw("PNG":"Gadsave.png", 100cm, 5cm)

    ```


