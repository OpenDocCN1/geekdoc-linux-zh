  md: '# # Feature Build servers


    # # CHOSING HARDWARE


    What kind of hardware will you require to build a better server?


    The hardware you choose is a very important consideration for building your system.
    Servers handle requests differently than a normal desktop machine, often handling
    people''s requests with different priorities that have changed and these can be
    different between types of servers.


    Software counts well, if of course, but without a solid base it will be more power
    to have the server work. Scalability and peak loads need to be considered as a
    factor, so make sure that you have a bit more power than you need. With that said,
    let''s start looking at the details.


    There are six main components you need to put into thought, and the four most
    important are the motherboard, RAM, CPU and storage. As you can see, you don''t
    need to worry about the other components as much.


    A minor concern could be with a graphics card of some sort, if you want to directly
    interface with the system or do something with the benefits of different cores
    you insert. You''ll also need a good storage solution for your server.


    Motherboards come in various styles. A lot of server boards will have two ports
    to connect to a CPU, which is good for small businesses or if you expect a lot
    of requests on a regular basis. These are more enough but the benefits in the
    long run for a bigger server are more than worth it.


    For home use, a single slot for a processor will do fine for most cases, the main
    exception


    being a server where you plan to have a lot of connections to manage. In this
    case, you want to keep an eye out for motherboards with plenty of storage and
    connection slots to make it flexible and scalable as as possible.


    they don''t have ECC. ECC fixes single-by-errors that make up the most common
    forms of data corruption in the RAM.


    While ECC RAM does important, it''s more important in web servers and generally
    more necessary in business and enterprise servers. On every level, a larger amount
    of RAM is good.


    # CPU


    The most important thing for a server CPU is the number of cores - that''s why
    many cores can be quite useful. Especially if you plan to run many VMs at once.
    Clock speed is not as important, but you should have at least one that is not
    ridiculously slow and cheap.


    With Intel''s HyperThreading, each core can work by creating threads within each
    core. AMD processors will have more cores for lower price, especially if you''re
    on a budget.


    # PSU


    It''s best practice to skip on a power supply, it''s essential when it comes to
    server. When you may need 1,000+ watts for your ridiculous gaming rig the server
    will be more reserved in the power for a peak, depending on its intended use.
    For power supplies with an ''80 Plus'' rating, it''s better to have some level
    of certification that they have a degree of efficiency - this is a good idea for
    servers that have the highest ratings, meaning they''re at least 90 per cent (95
    per cent efficient for server power supplies)


    # RAM


    A larger amount of RAM is more important for servers than on a desktop PC, especially
    you need to run more operations at once. Speed and storage are important, but
    RAM with threads will not grant you a better server system - in fact, it may be
