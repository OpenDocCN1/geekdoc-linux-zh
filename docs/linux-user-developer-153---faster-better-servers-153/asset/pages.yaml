  md: '# # Tutorial DEB & RPM packages


    # ## Usecheck when you build an application or a library from source


    +   - Follow policies

    - Whether you build out custom packages locally or through repositories, the distribution-specific
    package building policies for Linux. For Ubuntu, Debian, Fedora, openSUSE, see
    details in the main policy controls fields should be accurately marked as growing
    repositories may performance.


    04 Drawing a dummy spec

    The image on page 24 illustrates a simple spec file, which can be compiled into
    an RPM containing nothing. To make things work before you rebuild, use the %build(dummy)/usecheck
    directory. During build, usecheck may run on many issues, such as when you want
    to fix problems rather than just the score, or if you choose to set the BuildFailed
    command in your spec. For a package that includes unauthorised permissions, add
    it here.


    05 A simple way to use usecheck

    Usecheck is available to make when you build an application or library from source.
    Usecheck works in Debian and Red Hat, where you can check for details (package
    name, version, description, etc.) and author fields. You can keep your clean system
    tidy and free. If you need to wipe off files, simply remove the usecheck from
    your package manager tool (apt, yum, or dnf). You can''t install-usecheck scripts
    with it, and it''s not working when packing some properties as, as it needs extra
    hooks for many systems. However, usecheck is for local installations or small
    OEM tasks, to try.


    06 A brief look at handling the deb format

    Just like RPM, DEB files can be opened with archive managers so that you can see
    all the other tarballs: data.tar.gz and control.tar.gz. They are pretty self-explanatory:
    the first contains package files, the second contains metadata. DEB packages are
    different from RPM but still straightforward. Since in Debian/Ubuntu and its clones
    there is one dominating technology to handle handling packages and repositories
    and it has various charms, such as appropriate fields for search queries, while
    deb is a simple package manager tool (similar to RPM).


    07 Built DEB packages

    First, get the essentials:


    ```

    sudo apt-get install build-essential autotools-dev dpkg-dev dhf-helper-mk

    ```


    Imagine, for you got your my-package-0.2.tar.gz, which you want to convert into
    a DEB package, first a build directory manually like this:


    ```

    mdebian -p /src/my-package/0.2

    ```


    Then you put that directory in and unpack it (tar xzf my-package-0.2.tar.gz -C
    .) to build the program using the following commands:


    ```

    /configure --prefix=usr && make

    ```


    If you''re recompiling a program that already exists in one of your repositories,
    you can easily ease the dependency resolution by using apt-build-dep mypackage
    before in order to make the /configure run more smoothly.


