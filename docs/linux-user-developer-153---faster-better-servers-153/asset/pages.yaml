  md: '# Set up DNS routing


    # Associate an EIP with your running instance


    In the Network and Security/EC2 section of the AWS Management Console, select
    the EIP and click on Address. In this following dialog, it will replace any previously
    associated EIP with your instance.


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_32_0.png)


    # Set up DNS for your domain


    If you own a domain name, you can reserve a new domain name with Amazon Route
    53 where de appropriate. We use AWS Route 53 for our services (Networking/Route53)


    To set up the routing, you will need at least two domain names. Route 53 offers
    one free domain name per month (excluding traffic costs extra).


    The configuration is on every DNS service you use. For example, you will need
    to create a new record in your domain host with the name of your instance and
    the IP address of it in the NS entry. Then go to your registrar and replace the
    default name with your domain name in your DNS configuration settings.


    # Verify DNS routing


    You can verify your DNS setup using nslookup(intdomain.com) or MTool(toolbox.com).


    It is also worth noting that if you are about to run multiple instances on the
    same domain, a missing record


    # Request Reverse DNS and remove limitations


    In this regard, Amazon enforces strict mail security policies unless you ask them
    to limit it. If you format the alm (from:SPF) string explaining your usage scenario.
    For example, by (Step 2), you can request a reverse DNS record for static IP address
    (the public IPs of AWS infrastructure for your email mailer addresses). As an
    effect, a reverse DNS will decrease the likelihood of your emails being flagged
    as spam. Save a copy of the record for you before you submit it, in case you need
    it for future reference.


    # Connect to instance and prepare the system


    In the AWS Management Console, select the EC2 services. In the Instances list,
    select your instance and click Connect. Configure the login settings with your
    username, the key pair and the EIP or Public DNS.


    At the prompt of your Linux instance, access root privileges by typing


    ```

    sudo su

    ```


    # Set up DNS routing


    Once the basic setup is done, go to the DNS of your choice (AWS Route 53, it''s:Route
    53) and add the required records.


    +   - An A record pointing to the domain name of your instance

    - An MX record pointing to a subdomain (mail.yourdomain.com)

    - An MX record lists all mail server(s) for your domain and priority priority
    (any integer will do).


    You need at least one mail server CNAME (the MX entry (a subdomain of your Postfix
    server), which points to the qualified domain name that resolves to the IP address
    of your Linux instance (the A record).


    Stop and remove it to avoid anything:


    +   - service sendmail stop

    - remove sendmail


    Create a new user without the ability to sign in:


    ```

    user -d /home/mail -u 5000 -s /sbin/nologin

    mail -m

    ```


    Ensure your records are linked to each other as shown below


    > Postfix, Dovecot and ThunderbirdnWith Postfix you will be able to set up a mail
    transfer agent (MTA) and Thunderbird (or any other) as the best mail client of
    your choice and set up a root key-signed mail relay using open source software
    and your Linux instance in EC2.'
