    \ are shifted by three and then added to the output buffer. Using a circular buffer\
    \ ensures that we can't overflow (this is a very primitive method of adding notes,\
    \ but it works).\n\nThe resulting sample is then placed in the sample buffer.\
    \ If the buffer is full, the condition is cleared and the synth_loop thread is\
