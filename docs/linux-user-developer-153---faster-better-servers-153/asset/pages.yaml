    # # Profiling Python Code


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_67_0.png)


    Joey Benard is a software engineer who spends his time building tools for researchers
    with scientific computing problems and writing Android apps


    To maximise your Raspberry Pi, you need to use profiling to figure out exactly
    where the problems are


    One of the problems when writing code on a Raspberry Pi is that the resources
    are limited, which means that, as a programmer, need to be more aware of what
    your code is doing and how it is doing. Since Python is the language of choice
    on the Raspberry Pi, we will use that to look at several levels of what we need
    profiling and instrumentation of your code to help you identify exactly where
    the bottlenecks are.


    This means that you cannot do any benchmarking at the same time as you do profiling.
    It might not be practical to use deterministic profiling on a program that needs
    to run for a long period of time. It is a probabilistic method that samples your
    program at regular intervals to see what it is doing.


    is very high, but because it is Python it is easy to extend and add in any extra
    functionality you might need. If you don''t need that control, you can use the
    module cProfile. This profile is written in C and has quite a low amount of overhead.
    By importing the relevant module, you can use the function to run profiling


    There are two categories of profiling: time and memory. Time profiling involves
    how much time your program takes to run. This is useful when trying to improve
    the overall performance or to find where your code might be poorly implemented.
    Memory profiling is used to analyze how efficiently you are using memory and potentially
    find areas where you are dealing with memory leaks or inefficiencies. There are
    also two different methods of profiling: deterministic and sampling. Deterministic
    profiling tracks the execution of every instruction within your program. The advantage
    of this method is that you get correct results but the disadvantage is that it
    introduces a large amount of overhead


    The simplest form of profiling is to use the ''time'' function. You can use it
    around a chunk of code to see how long that section takes to run. This is quite
    a bit of a time profiler. The Python standard library includes two profiling modules:
    profile and cProfile. cProfile provides detailed information about your module


    Function. You can use the function to run profiling your code needs to be packed
    as a callable function that can be called. The other option is to include it in
    the command line.


    # # Why Profiling?


    It''s the official language of Python. Read the docs at python.org/doc


    In this issue we will profile a Python script rather than just a function. The
    default output is a summary line showing the total time spent in all functions
    and how many calls each function made, with a breakdown of the following columns:


    +   calls - number of calls

    tottime - total time in function

    ottime - time spent by by calls

    cctime - cumulative time spent in each function plus all sub-functions

    percall - time divided by number of calls


