  md: "# # Code a simple synthesiser\n\n![](img/dc2302183c6b3ebee0d18a3807d4d058_50_0.png)\n\
    \n# Cython code listing\n\nCython is a tool that compiles Python down to C code\
    \ that would be used by the interpreter to run code. This has the advantage of\
    \ compiling Python code into C code, which is significantly faster. This is achieved\
    \ by giving C types to Python objects.\n\nOnce you have C code it can be compiled\
    \ into a shared library (using gcc) which can then be imported and used from Python.\
    \ By writing Cython code optimized for the Python interpreter, you can get a similar\
    \ experience to Python but with better performance than pure Python. Cython has\
    \ a compiler that you can run:\n\n```\n# cython -a synth.pyx\nThis generates an\
    \ html file which shows where to make\noptimisations, giving insight into how\
    \ much overhead is introduced.\nFor more details visit http://cython.org.\n```\n\
    \nthat reason, we use a USB sound card and will disable the\nbuid-in card as default\
    \ by use the USB one:\n\n```\nsudo rm /etc/rules.d/alsa\nsudo editor /etc/modules\n\
    ```\n\nChange 'snd-bcm2835' to '#snd-bcm235' and save, then:\n\n# 03 Test sound\
    \ card\n\nNow we test the USB sound card. Type als sampler and\nensure that the\
    \ volume is set to a comfortable level. If you're\nplugging speakers in, you'll\
    \ probably want to set it to 100%. Then\ntype speaker test, which will generate\
    \ some noise on the\nsound card, until you are happy that it's working.\n\n# 04\
    \ Start project\n\nCreate a directory for the project. Then we\ndownload one copy\
    \ of a square wave that we will use as a\nwavetable, like so:\n\n```\nmkdir synth\n\
    cd synth\nwget wavfile.sc.co.uk/synth/square.wav\n```\n\n# 05 Compilation script\n\
    \nWe need a script to profile our Python code\n(resulting in synth.html). Generate\
    \ Cython code for it and\ncompile to a binary using gcc:\n\n```\n# compile.sh\n\
    !/bin/bash\ncython -a synth.pyx\ncython --embed synth.pyx\ngcc --shared -fPIC\
    \ -march=native -fno-math-math\n-id=0 -O3 -I /usr/include/python2.7 -o synth\n\
    synth.cython-python2.7 -pthread\n```\n\n(Note the options that the compiler to\
    \ use the following\npoint unit.) Make it executable with:\n\n```\n# chmod +x\
    \ compile.sh\n```\n\n```\nimport pyaudio\nimport time\nfrom array import *\nfrom\
    \ cython import cimport as c_array\nimport wave\nimport threading\\import tty,\
    \ terms, sys\n```\n\n```\nclass MIDITable:\n    # Generation code\n    http://www.adamasley.com/software/beep.c\n\
    ```\n\n```\ndef __init__(self):\n    self.notes = []\n    self.fill = []\n```\n\
    \n```\ndef fill_notes(self):\n    # Frequency of MIDI note 0 in Hz\n    frequency\
    \ = 8.17579\n```\n\n```\n# Ratio = 2 to the 1/100\nratio = 1.0594631\n```\n\n\
    ```\nfor i in range(0, 128):\n    self.notes.append(frequency)\n    frequency\
    \ = frequency * ratio\n```\n\n```\ndef get_note(self, n):\n    return self.notes[n]\n\
    ```\n\n```\nclass ADSR:\n    float attack, decay, sustain, release\n    float\
    \ release, multiplier\n    float char_state\n    int samples_per_ms, samples_gone\n\
    ```\n\n```\ndef __init__(self, sample_rate):\n    self.attack = 1.0/100\n    self.decay\
    \ = 1.0/100\n    self.sustain = 0.7\n    self.release = 1.0/50\n    self.state\
    \ = 'A'\n    self.multiplier = 0.0\n    self.samples_per_ms = int(sample_rate/1000)\n\
    ```\n\n```\ndef next_val(self):\n    self.samples_gone += 1\n    if self.samples_gone\
    \ >= self.samples_per_ms:\n        self.samples_gone = 0\n    else:\n        return\
    \ self.multiplier\n```\n\n```\nif self.state == 'A':\n    self.multiplier += self.attack\n\
    \    if self.multiplier >= 1:\n        self.state = 'D'\nelif self.state == 'D':\n\
