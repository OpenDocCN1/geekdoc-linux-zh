  md: 'date of written, etc. You can view the log history of a single file or directory
    by using the following command:


    ```

    [root@nblr-gwos swajam]# svn log properties.txt

    ```


    # A property is structured as a simple key-value pair: the key is a string and
    the value content can be anything


    | Command | Description |

    |---|---|

    | svn log -r24 | Displays logs for the revisions 4 in chronological order |

    | svn log -r24 | Displays logs for the revisions 4 in reverse chronological order
    |


    ```

    [root@nblr-gwos swajam]# svn property copy -c 200; My-Firm Software feature/properties.txt

    property ''copy'' set on ''feature/properties.txt''

    ```


    Please note that the logs are printed in reverse chronological order. By using
    the verbose (-v) option you can view more information about a file or directory.
    With svn, the body of the log will be suppressed. When you use the -v option,
    the files will be displayed. It is important to note that if we make a commit
    and immediately run log, the most recent commit will not appear in the log list
    due to the behaviour of commit and the default behaviour of svn solution.


    In addition to log, Subversion also provides the property command. This command
    uses the configured editor to modify the properties. When you use svn property,
    Subversion edits the property on a temporary file, shows the current value of
    the property and lets you modify that value in the editor to save the new value,
    then deletes the temporary file.


    You can use svn to list the various versions of a file. With svn, you can examine
    an earlier version of the file without downloading it. Svn list will show you
    what the files were in that version. You can use the verbose flag (-v) to get
    a more detailed listing. To view the content, you will need to download the file
    to your local machine.


    With other commands, Subversion can manage properties that can act on multiple
    paths at the same time. You will be able to modify the properties of all files
    by using svn.


    Adding and editing properties is useful if you can easily get the stored property
    value. Subversion provides two commands to display the name and values of properties:
    svn property list will show the names of properties on a path, and svn property
    will show the values of properties on a path. By using svn property, you can get
    the name and value of a specific property.


    Another way is to commit a simple change without having a working copy. By specifying
    the file as the target, it will show the line-by-line attribute of a file as it
    currently appears in the working copy. This command is made directly to the file
    in the repository.


    Subversion provides examples to illustrate the use of property and commands.


    If you are not using a working copy, you can safely delete the entry. This can
    be done by removing the directory canaries of your operating system.


    ```

    [root@nblr-gwos swajam]# svnlist feature/properties.txt

    property ''feature/properties.txt'':

    ```


    Properties are metadata and can be considered as two columns, mapping property
    name to attribute value for each copy. A property is structured as a simple key-value
    pair: the key is a string and the value content can be anything you like.


    ```

    [root@nblr-gwos swajam]# svn property copy feature/properties.txt

    property ''feature/properties.txt'':

    (200) My-Firm Software

    ```


    By using binary data, Subversion provides properties to store extra information
    about a file. Subversion automatically attaches properties such as svn: date,
    author, log, and others to all the files. Note that Subversion attaches these
    properties to a single version of a file.


    There is a variation of property command where we can specify -v and it will list
    both the name and the value for all properties.


    There are a number of ways by which you can view or modify properties. If you
    have properties with human-readable values, you can easily add a new property
    by specifying the property name and the corresponding name on the command line
    using svn property. You can also edit properties, and using the editor you can
    specify a name of a file that then creates the new property value.


    Subversion provides one more property-related command - prop and this can be used
    to delete the properties all together. Here is an example of how to use this command:


    ```

    [root@nblr-gwos swajam]# svn prop feature/properties.txt

    feature/properties.txt.

    property ''copy'' deleted from ''/feature/properties.txt''.

    ```


    It is important to remember that the changes you make are local modifications.
    These can be made permanent only when you commit them to the repository repository.


