    # Build a WebKit browser


    # Learn how to get WebKit built and running on a Linux system to develop browsers


    For a few years back, it seemed like every new browser was made in WebKit. While
    Apple''s Safari, Google''s Chrome and the Chromium project seemed to launch it
    into the spotlight and result in its dominance in browser technology.


    While the standard source is optimized for OS X and Windows, there is a branch
    for Linux-PH. With this source you can continue to develop your own browser using
    WebKit as a lightweight rendering engine.


    In this tutorial, we will show you how to get WebKit up on your system, along
    with some pointers on how to construct a browser using the source that you can
    then go and begin creating custom project.


