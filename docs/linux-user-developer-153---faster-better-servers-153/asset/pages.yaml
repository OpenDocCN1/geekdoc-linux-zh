  md: '# Tutorial AWS Cloud


    # Run your mail server in the cloud


    # Are you tired of generic email addresses? Postfix and Dovecot de to the rescue!


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_31_0.png)


    Running a mail server in the cloud doesn''t have to be complicated or expensive.
    With Postfix and Dovecot you can set up and run your own mail server in the cloud
    on a Linux server.


    A mail server consists of two components: an MTA (Mail Transfer Agent) and an
    MDA (Mail Delivery Agent). An MTA such as Postfix transfers email messages between
    the Internet and an MDA such as Dovecot delivers them to the file system of your
    server.


    # 01 Launch an EC2 instance of Linux


    In a web browser, sign in to your AWS account (preferably using the credentials
    of an IAM user instead root password). Navigate to the EC2 section of the AWS
    Management console and launch a new EC2 instance (for example, Amazon Linux).
    Here, the instance is running Amazon Linux from the RHEL/CentOS/Fedora family.


    The set of mail clients is vast (e.g., Outlook, Thunderbird or K-Mail). Using
    standard email protocols (IMAP and SMTP), you can access your mail server from
    any device. This setup is known to be free of ‘gotchas\’. If you need to add new
    levels of complexity such as virtual domains, non-linux systems and SSL encryption,
    then your functionality is working flexibly.


    As for the choice of hosting services, AWS is an excellent pick: it’s low-cost,
    versatile and speedy. You can start from the Free Tier, get things running smoothly
    on a budget and expand as your needs grow.


    # 02 Elastic IP and assign it to instance


    In Network Security and Elastic IPs, allocate a new address of the type VPC to
    your AWS account. This so-called ‘elastic IP’ incurs a symbolic hourly fee unless
    you make it attached to a running instance that has no public IP.


    +   - AWS account

    - Web browser

    - SSH client


    You can finally control the firewall rules for your cloud mail server during the
    instance configuration steps


    # Resources


    1 Choose AMI | 2 Choose Instance Type | 3 Configure Firewall | 4 Add | 5 Tag |
    6 Security Group | 7 Review


    # Step 6: Configure Security Group


    A security group controls the traffic that reaches your instance. On this page,
    you can add rules to allow specific traffic to reach access to the HTTP and HTTPS
    ports. You can create a new security group or select from an existing one. Learn
    more about EC2 security groups.


    +   - Assign a security group: Create a new security group

    - Select an existing security group


    | Type | Protocol | Port Range | Source |

    |---|---|---|---||

    | | | | imagine_mail_group_cloud | imagine_mail_group_cloud |

    | SSH | TCP | 22 | Anywhere | 0.0.0.0/0 |

    | IMAP | TCP | 143 | Anywhere | 0.0.0.0/0 |

    | Custom Type | TCP | 993 | Anywhere | 0.0.0.0/0 |

    | SMTP | TCP | 587 | Anywhere | 0.0.0.0/0 |

    | SMTP | TCP | 465 | Anywhere | 0.0.0.0/0 |


    Cancel Previous Review and Launch


    32'
