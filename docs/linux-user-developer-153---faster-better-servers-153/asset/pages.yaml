    \ We will use threading to notify when we\n    self.more_samples = threading.Event()\n\
    \    self.exit = threading.Event()\n```\n\nWavetable synthesis is one where you\
    \ use a single cycle of a wave as a lookup table to synthesize sound. In this\
    \ case we have a waveform to choose from. CD-quality audio has a sample rate of\
    \ 44,100 Hz, which is what we use in our implementation. At each sample, the synthesiser\
    \ outputs a value from the wavetable and then increments the counter. However,\
    \ if the wavetable has a frequency of 440 Hz then we need to be able to step through\
    \ it in increments to avoid aliasing. Assuming the wavetable has a frequency of\
    \ 440 Hz and we need to step at a step size of 0.5 it can be thought of as drawing\
    \ a straight line between two points on the output. If the index is 10 or 11 it\
    \ would be 5 + (10-5) * 0.5 which goes over the end of the wavetable, you wrap\
    \ around and start again. There is no discontinuity as you're only using a single\
    \ cycle of the wave in the table of the wave.\n\n```\n# MIDI table of -> frequencies\n\
    self.midi_table = MIDITable()\n\ndef stop(self):\n    self.audio.stop()\n    self.exit.set()\n\
    \    self.stream.stop_stream()\n    self.stream.close()\n```\n\nThe wavetable\
    \ oscillator gives a note at the defined frequency, but it's always at maximum\
    \ amplitude and sound loud. The start of each cycle will be a pop or click, which\
    \ is where the Attack, Decay, Sustain and Release envelopes help. Change the amplitude\
    \ of the audio output over time to make the sound more natural. We apply a multiplier\
    \ to the sample value returned by the wavetable oscillator. Having a releasing\
    \ time from 100% to 0% will make the sound fade out smoothly. With the ADSR curves\
    \ the synthesiser can sound very much like real instruments.\n\n```\nndef load_wavetable(self):\n\
