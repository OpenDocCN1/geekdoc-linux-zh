  md: '# Tutorial WebKit


    # Qt Creator


    While we are building this local environment, we need a graphical Qt Creator so
    that we can run it there; then you will have to edit it and use a custom build
    system. To actually start, you can look into how to build bit.ly/vrun


    # 06 Set the paths


    Before we can continue building WebKit, we need to set the correct paths for the
    Qt development software. We first need to set QtDIR to the location of the Qt
    installation. By exporting this path with:


    ```

    $ export QtDIR=[directory]

    ```


    Then make sure that Qt 5 is in the PATH. Use the following to do:


    ```

    $ export PATH=$PATH:$QtDIR/bin

    ```


    # 07 Get any other dependencies


    Depending on your development environment, we may need to add extra dependencies
    to make sure everything compiles. Ensure that the following packages are just
    installed to ensure the compiling goes smoothly.


    ```

    $ sudo apt-get install bison flex libsigbuf-dev libdbus-dev libx11-dev

    ```


    There may be other packages that you can install as you go, but these seem to
    be the common after packages in our tests:


    ![](img/dc2302183c6b3ebee0d18a3807d4d058_37_0.png)


    # 10 WebKit used explain


    There are some basic principles to the WebKit handles to render. This is handled
    by the WebCore engine and is made up of specific systems: the Document Object
    Model (DOM), tree and the tree style. These render each webpage and we will break
    down and discuss them in the next steps.


    # 11 How the DOM tree works


    Each webpage is parsed into a DOM tree of nodes, all of them to base nodes of
    Node. These nodes are relevant for actually rendering data: WebKitHTML.Document,
    which is found in the tree; all the nodes from the HTML or XML are in Elements,
    and all the raw text that gives between elements, the content on the page is actually
    rendered


    # 12 Structure of the render tree


    The rendering of nodes creates the render nodes in the DOM tree, with extra objects
    and nodes that do not exist in DOM. These are found in RenderObject. The RenderObject
    for a DOM node can be obtained:


    ```

    RenderObject* render();

    ```


    ... which can be used similarly as:


    ```

    RenderObject* firstChild() const;

    RenderObject* lastChild() const;

    RenderObject* previousSibling() const;

    RenderObject* nextSibling() const;

    ```


    # 13 Create the render tree


    Renderers are created when a DOM node is attached to a renderer. The node will
    determine if it is a text node or a box. All descendants are render nodes created
    after their parents. You can use the method with:


    ```

    void attach();

    ```


    ... or DOM nodes are being in the rendering process and it fully underway.


    # 14 Destroy the render tree


    ```

    void detach();

    ```


    This destroys the render tree and is supposed to occur when a tab or window is
    closed, as it ends the need to see the information that was present in the DOM
    tree. This is a good step to help complete the process.


    # 08 Start to build WebKit


    Finally, we can actually building the WebKit source. Go to the directory you''ve
    downloaded the WebKit source to build it using:


    ```

    $ web/scripts/build-webkit -Qt

    ```


    This will take a while, depending on your system. If there are any errors or missing
    dependencies, it will stop and you may have to download the libraries that it
    needs.


    # 09 Test of WebKit


    Once it is compiled (and it will take a while depending on your system), you can
    run this basic version of WebKit using:


    ```

    $ Tools/Scripts/run-launcher -Qt

    ```


    This is the QtTestBrowser, which is a very quick implementation of WebKit. You
    can run through the files to get an idea of how it uses WebKit.


