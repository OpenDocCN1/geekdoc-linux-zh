  \ 分级结构中其下方的所有名称。\n\n例如，图 6-5 显示了 DNS 域树的一小部分。树的顶部是 `root domain`（根域），它是所有域的锚点。根域正下方是四个\
  \ `top-level domains`（顶级域），分别为 `edu`、`com`、`org` 和 `gov`。\n\n![ 域树一小部分的示意图。树的顶部是根域，它是所有域的锚点。](img/9781119648505-fg0602.png)\n\
  \n图 6-5： 顶级域。\n\n*(注：此处省略后续重复翻译，内容已去重)*\n\n\n\n\n- 尽管 DNS 树结构很浅，但它非常宽广。换句话说，每个顶级域名下方都紧跟着大量的二级域名。例如，在我写这本书时，`com`\
  \ 域名下有超过 200 万个二级域名。\n\n### 完全限定域名\n\n如果域名名以点结尾，那么该点代表根域名，该域名被称为`完全限定域名`（`fully\
  \ qualified domain name`，`FQDN`）。完全限定域名也被称为`绝对名称`（`absolute name`），它是无歧义的，因为它一直追溯到根域名。相比之下，如果域名名不以点结尾，则该名称可能在某些其他域名的语文中被解释。因此，不以点结尾的\
  \ DNS 名称是`相对名称`（`relative names`）。\n\n这个概念与 Windows 中相对路径和绝对路径的工作方式相似。例如，如果路径以反斜杠开头，如\
  \ `\\Windows\\System32\\dns`，则路径是绝对的。然而，不以反斜杠开头的路径（如 `System32\\dns`）使用当前文件夹作为起始点。如果当前文件夹恰好是\
  \ `\\Windows`，那么 `\\Windows\\System32\\dns` 和 `System32\\dns` 指向同一个位置。\n\n在许多情况下，相对域名和完全限定域名是可以互换的，因为解释它们的软件始终在根域名的范围内解释相对名称。这就是为什么例如，你可以在网页浏览器中输入\
  \ `www.wiley.com`（不带末尾点）而不是 `www.wiley.com.` 来访问 Wiley 的主页。某些应用程序（如 DNS 服务器）可能会在根域名之外的范围内解释相对名称。\n\
  \n## 使用 Windows DNS 服务器\n\n安装和管理 DNS 服务器的程序取决于你使用的网络操作系统。本节专门针对在 Windows 2019 中使用\
  \ DNS 服务器。在 Linux 或 Unix 环境中使用 DNS 服务器虽然相似，但没有图形用户界面的帮助。\n\n你可以从服务器管理器（在任务栏上选择服务器管理器）在\
  \ Windows Server 2019 上安装 DNS 服务器。安装完成后，你可以通过 DNS 管理控制对其进行管理。在这里，你可以执行常见的管理任务，例如添加区域、更改区域设置或向现有区域添加新记录。DNS\
  \ 管理控制台隐藏了资源记录的细节，让你能够友好的图形用户界面进行工作。\n\n要向区域添加新主机（由名为 `A 记录` 的 DNS 记录定义），在 DNS 管理控制台中右键点击该区域并选择\
  \ `Add New Host` 命令。此操作将打开新主机对话框，如图 6-6 所示。\n\n在这里，你指定以下信息：\n\n- **Name（名称）：** 新主机的主机名。\n\
  - **IP Address（IP 地址）：** 主机的 IP 地址。\n- **创建关联指针 (PTR) 记录：** 在反向查找区域文件中自动创建 `PTR\
  \ 记录`。如果你想允许对主机进行反向查找，请选择此选项。（`反向查找`根据给定的 IP 地址确定域名。之所以这样做，是因为普通的 DNS 查询是根据给定的域名确定\
  \ IP 地址。）\n- **允许任何经过身份验证的用户更新：** 如果你想允许其他用户更新此记录或具有相同主机名的其他记录，请选择此选项。通常你应该取消勾选此选项。\n\
  - **生存时间（生存时间）：** 该记录的 TTL 值，表示数据应缓存多长时间（以秒为单位）。\n\n你可以以相同的方法添加其他记录，例如 `MX 记录`。\n\
  \n![新主机对话框的截图。](img/9781119648505-fg0606.png)\n\n[图 6-6:] 新主机对话框。\n\n## 配置 Windows\
  \ DNS 客户端\n\n客户端计算机不需要大量配置即可正常与 DNS 工作。客户端必须拥有至少一个 DNS 服务器的地址。通常，此地址由 `DHCP` 提供，因此如果客户端配置为从\
  \ `DHCP` 服务器获取 IP 地址，它也会从 `DHCP` 获取 DNS 服务器地址。\n\n要配置客户端计算机从 `DHCP` 获取 DNS 服务器位置，请通过控制面板中的“网络”或“网络连接”打开网络属性对话框（取决于客户端运行的\
  \ Windows 版本）。然后选择 `TCP/IP` 协议并点击“属性”按钮。此操作将调出 `TCP/IP 属性`对话框，如图 4-4 所示。要配置计算机使用\
  \ `DHCP`，选择“自动获得 IP 地址”和“自动获得 DNS 服务器地址”选项。点击“确定”即可。\n\n# 第 7 章：哦，我们织就了错综复杂的网：线缆与交换机\n\
  \n### 本章内容\n\n- ![项目](img/check.png) 初识以太网\n- ![项目](img/check.png) 查看不同类型的网络线缆\n\
  - ![项目](img/check.png) 安装双对线\n- ![项目](img/check.png) 使用交换机\n\n线缆是你的网络管道系统。事实上，处理网络线缆与处理管道非常相似：你必须使用正确的管道（线缆）以及正确的连接器（交换机）。网络线缆比管道有一个优势：它们漏水时你不会湿。\n\
  \n本章介绍的关于网络线缆知识比你可能需要的要得多。我将向你介绍常用的布线系统——以太网。然后你将了解如何处理用于以太网网络的线缆。最后，我将向你如何使用交换机，它们为计算机之间提供了必要的连接。\n\
  \n## 什么是以太网？\n\n以太网是连接计算机创建标准化方法。\n\n你可以将以太网想象成一种网络建筑规范：它规定了使用何种线缆、如何连接线缆、线缆多长、计算机如何通过线缆传输数据等。\n\
  \n![技术细节](img/technicalstuff.png) 虽然以太网现在是网络领域的主流选择，但过去并非如此。在旧时代，以太网有两个主要的竞争对手：\n\
  \n- **令牌环（Token Ring）：** 这种 IBM 网络标准在某些组织中使用（特别是使用 IBM 主机或中间机的系统中）。\n- **ARCnet：**\
  \ 这种标准有时用于工业网络应用，如建筑自动化和工厂机器人控制。\n\n但这些旧网络早已过时，所以你不需要担心它们。以太网现在是唯一的实际选择。\n\n以下是你在讨论以太网标准的聚会上可能会遇到的一些小知识：\n\
  \n- 以太网是构建网络基础的一 set 标准。所有现代操作系统都可以在以太网上运行。如果你在坚固的以太网基础上构建网络，就可以混合不同的操作系统：Windows、macOS\
  \ 和 Linux。\n- 以太网通常被网络专家称为 `802.3`（读作“eight-oh-two-dot-three”），这是 `IEEE`（读作“eye-triple-ee”，而不是“ai*eeee!*”）使用的官方指定，这是一群戴着领结并喜欢争论电感和串扰问题的电气工程师团体——有他们做真是件幸事。如果没有他们，你就无法混合不同公司制造的以太网组件。\n\
  \n\n\n\n\n*   原始版本的以太网传输速率极低，仅为每秒 1000 万位，即 10 Mbps（`Mbps` 通常被读作“megabits per second”）。因为\
  \ 8 位组成一个字节，这大约相当于每秒 120 万字节。在实践中，以太网无法以这种速度传输信息，因为数据必须以不超过 1,500 个`bytes` 的包进行传输，这些包被称为\
  \ `packets`。因此，150KB 的信息必须被分成 100 个包。\n\n    ![技术细节](img/technicalstuff.png) 以太网的传输速度与电信号在电缆上的移动速度快无关。电信号的传输速度约为光速的\
  \ 70%，正如柯克船长所说，“曲速系数 0.7”。\n\n*   一种更快的以太网版本被称为 `100 Mbps Ethernet` 或 `Fast Ethernet`（快速以太网），其数据传输速度是普通网络的十倍。\n\
  \n*   今天最常见的以太网版本是 `gigabit Ethernet`（千兆以太网），数据传输速度为 1,000 Mbps。\n\n*   你现在购买的大多数网络组件都支持\
  \ 10、100 Mbps 和 1,000 Mbps。这些组件被称为 `10/100/1000 Mbps components`。\n\n*   某些网络组件支持\
  \ 10 千兆以太网，数据传输速度为 10,000 Mbps（或 10 Gbps）。十兆以太网通常用于服务器和网络交换机之间的高速连接。\n\n## 关于电缆的一切\n\
  \n尽管你可以使用无线技术创建无需电缆的网络，但大多数网络仍然使用电缆将每台计算机物理地连接到网络中。多年来，各种类型的电缆被用于以太网网络。现在几乎所有的网络都是用双绞线构建的。在这种电缆中，成对的线相互缠绕在一起以减少电干扰。（理解为什么缠绕电线有助于减少干扰几乎需要一个物理学博士学位，所以如果这个概念听起来不合合理，不要感到沮丧。）\n\
  \n虽然不太可能，但你可能会在老旧网络上遇到旧类型的电缆。在双绞线成为标准之前，使用的是 `coaxial` 同轴电缆（也称为 `coax`，读音为“COE-ax”）。最常见的同轴电缆类型是\
  \ RG-58，类似于电视电缆。第二种更老老的类型被称为 10base5，由于其笨重的厚度也被称为 `thicknet`（厚线网）。\n\n你可能还会遇到跨越远距离并高速传输的光电缆，或者在大楼布线间之间承载多组双绞线的粗壮双绞线束。然而，大多数网络使用简单的双绞线。\n\
  \n双绞线有时被称为 `UTP`（`U` 代表 `u`nshielded，非屏蔽，但“twisted-pair”是其标准名称）。图 7-1 显示了一根双绞线。\n\
  \n![图片描述了用于构建以太网网络的双绞线。](img/9781119648505-fg0701.png)\n\n图 7-1 所示 双绞线。\n\n当你使用\
  \ UTP 电缆构建以太网网络时，你采用星形布局连接计算机，如 图 7-2 所示。这个星形的中心是一个 `switch`（交换机）。根据型号的不同，以太网交换机允许你通过双绞线连接\
  \ 4 到 48 台（或更多）计算机。\n\n![提示](img/tip.png) 在 UTP 星形布局中，如果一根电缆损坏，只有连接到该电缆的计算机受影响。网络的其余部分继续运行。\n\
  \n![使用双绞线布线的网络中星形布局计算机的示意图。](img/9781119648505-fg0702.png)\n\n图 7-2 所示 使用双绞线布线的网络。\n\
  \n### 电缆类别\n\n双绞线有各种被称为 `categories`（类别）的等级。这些类别由 ANSI/EIA 标准 568 指定（`ANSI` 代表美国国家标准协会；`EIA`\
  \ 代表电子工业协会）。标准指示了电缆的数据容量——带宽。表 7-1 列出了目前可用的各种双绞线类别。（更高类别，包括 Cat-7 和 Cat-8，尚处于设计阶段，尚未商用。）\n\
  \n| **类别** | **最大数据速率** | **用途** |\n| --- | --- | --- |\n| 1 | 1 Mbps | 仅语音 |\n\
  | 2 | 4 Mbps | 4 Mbps 令牌环 |\n| 3 | 16 Mbps | 10BaseT 以太网 |\n| 4 | 20 Mbps | 16 Mbps\
  \ 令牌环 |\n| 5 | 100 Mbps (2 对) | 100BaseT 以太网 |\n|   | 1000 Mbps (4 对) | 1000BaseTX\
  \ |\n| 5e | 1000 Mbps (2 对) | 1000BaseTX |\n| 6 | 1000 Mbps (2 对) | 1000BaseTX |\n\
  | 6 | 1000 Mbps (4 对) | 1000BaseTX |\n| 6a | 10000 Mbps (2 对) | 10 Gbps |\n\n表 7-1\
  \ 所示 双绞线\n\n### 线对是怎么回事？\n\n大多数双绞线有四对线，总共八根。标准以太网只使用其中两对，因此另外一对是闲置的。你可能想通过购买只有两对电缆来省钱，但这是一个坏主意。如果网络出现问题，有时可以通过切换到额外的线对来解决。然而，如果你使用的是双对电缆，你就没有备用了了。\n\
  \n### 屏蔽还是不屏蔽\n\n非屏蔽双绞线（UTP）为普通环境设计。当你使用 UTP 电缆时，必须小心避开荧光灯、空调或电动机。UTP 是最便宜的电缆类型。\n\
  \n在有大量电干扰的环境（例如工厂）中，你可能需要使用屏蔽双绞线（STP）。因为 STP 的价格可能是普通 UTP 的三倍，除非万不得，否则你不想使用 STP。只要留心，UTP\
  \ 可以忍受正常办公环境中电干扰。但对于恶劣环境，即电缆放置在户外、埋在地下或位于工业设备附近，你应该使用 STP 电缆。\n\n大多数 STP 线由铝箔层屏蔽。对于电干扰异常严重的建筑，更昂贵的编织铜屏蔽提供了更强的保护。\n\
  \n### 何时使用空间地板电缆\n\n屏蔽和非屏蔽双绞线的外护有两种类型：\n\n*   PVC：最常见且最便宜的类型。\n*   **Plenum**（空间地板）：一种特殊的防火电缆，设计用于建筑的空间地板（定义见下文）。空间地板电缆具有特殊的特氟龙涂层，不仅耐热，而且燃烧时产生的毒气也较少。遗憾的是，空间地板电缆的价格是普通\
  \ PVC 电缆的两倍以上。\n\n![警告](img/warning.png) 大多数建筑法规要求当布线安装在建筑的*空间地板*（作为建筑空气流通系统的一个隔间，通常是吊天花板上方或架空地板下方空间）时，使用空间地板电缆。\n\
  \n\n\n\n\n![Tip](img/tip.png) 如果空调和供暖系统的送风和回风线路都使用了风道，那么吊顶上方的区域就`not` 空板空间（plenum\
  \ space）。只有在空调和供暖系统没有风道的情况下，才需要空板缆。如果有疑问，在安装电缆之前，请让当地检查员查看你的设施。\n\n### 有时是单芯，有时是股线\n\
  \n构成电缆的铜线有两种类型：单芯和股线。你的网络会同时包含这两者：\n\n*   **股线 (Stranded)：** 每个导体由一组扭在一起的细线组成。股线电缆比单芯电缆更有弹性，因此不易折断。然而，股线电缆比单芯电缆贵，而且远距离信号传输能力。。股线缆适用于`patch\
  \ cables`（例如从配线架到集线器和交换机）。\n\n    ![Tip](img/tip.png) 严格来说，连接电脑和墙壁插座的电缆被称为`station\
  \ cable`（跳线）——而不是`patch cable`——但它是股线的合适用途。（尽管技术上不准确，大多数人将连接电脑和墙壁插座的电缆称为“patch cable”。）\n\
  \n*   **单芯 (Solid)：** 每个导体都是单根单一的固体线。单芯电缆比股线电缆便宜，信号传输距离更远，但它缺乏弹性。如果你弯折次数过多，它就会断裂。通常，单芯电缆用于建筑墙内和天花板内的永久布。\n\
  \n### 安装指南\n\n安装网络线最困难的部分是将电缆穿过天花板、墙壁和地板的物理任务。这项工作非常复杂，我建议你不要自己尝试，除非是小型办公室。对于大型工程，请聘请专业的缆安装人员。如果天花板和墙壁空间难以进入，即使是小工程也可能需要专业人士。\n\
  \n如果你自己安装电缆，请记住这些点：\n\n*   你可以购买预制长度的对绞电缆，例如 10、15 或 20 英尺。也有更长的，例如 50 英尺或 100 英尺。\n\
  \n*   或者，你可以购买大卷电缆，根据长度切割，并自己连接连接器。\n\n*   使用电缆时，务必比你需要的多一点，尤其是当你穿墙布线时。例如，当你沿着墙向上布线时，在墙上方的天花板留出几英尺的余量。这样如果你需要维修，就有足够的电缆可用。\n\
  \n*   布线时，避开干扰源，如荧光灯、大电机、X 射线机、核反应堆、回旋器、磁通容器或其他可能隐藏在你办公室关门后的各种设备。\n\n    ![Warning](img/warning.png)\
  \ 荧光灯是天花板板后电缆最常见的干扰源。远离灯具。保持三英尺即可。\n\n*   集线器和电脑之间允许的最大电缆长度为 100 米（约 328 英尺）。\n\n\
  *   如果你必须在人走动的地板上布线，请遮盖电缆以免有人绊倒。大多数五金店都卖电缆保护器。\n\n*   在穿墙布线时，请在每根电缆的两端贴标签。大多数电器商店都出售非常适合此工作的电缆标签纸。这些标签纸包含大约\
  \ 50 页预切好的字母和数字标签。它们看起来比用胶带绕在电缆上用马克笔在胶带上写字专业得多。\n\n    你还可以购买可以打印用于连接电缆标签的打印机。作为最后手段，你始终可以使用永久马克笔直接在标签上写字。\n\
  \n*   ![Tip](img/tip.png) 如果你在新建筑中安装电缆，请在每根电缆的两端至少标记三次，标签之间留出大约一英尺的空间。石膏板工人或油漆可能会在你的电缆上喷洒泥或漆，导致标签难以寻找。\n\
  \n*   当几根电缆汇在一起时，用塑料扎带扎好，或者更好用魔术条。避免使用胶带（更糟的是美纹带）。胶带不持久，但粘性胶水会。一年后那里会是一团糟。电器商店可以买到扎带。\n\
  \n*   ![Tip](img/tip.png) 扎带有各种实用的用途。有一次在徒步旅行期间，我用一对扎带把一个毫无防备的伙伴的帽子系在高树的树枝上。他对我这种创新的扎带用法并不感，但我的其他徒步伙伴却很佩服。\n\
  \n*   当你在吊顶板上方布线时，使用扎带、钩子或夹子将电缆固定在天花板或支撑天花板瓦的金属框架上。不要只把电缆铺在板上顶部。\n\n### 你需要的工具\n\
  \n当然，为了做好工作，你必须拥有正确的工具：\n\n*   从一套基础电脑工具开始，你可以从任何电脑商店和大多数办公用品商店以约 15 美元购买。这些工具包包含了套筒扳手和螺丝刀，用于打开你的电脑并插入适配器。\n\
  \n    ![Tip](img/tip.png) 如果满足以下条件，电脑工具箱可能包含了你需要的一切：\n\n    *   你所有的电脑都在同一个房间。\n\
  \n    *   你正在桌子后面或沿地板布线。\n\n    *   你正在使用预制电缆。\n\n    ![Tip](img/tip.png) 如果你没有电脑工具箱，确保你有几把一字螺丝刀和十字螺丝刀。\n\
  \n*   如果你使用的是大卷电缆并计划自己连接，除了基础工具箱外，还需要以下工具：\n\n    *   `线剪`：同轴电缆需要大的；对绞电缆需要小的。\n\n\
  \    *   `接线钳`：连接连接器。不要用廉价的 25 美元工具。一个好的 100 美元的接线钳会为你省很多麻烦。\n\n        ![Remember](img/remember.png)\
  \ *当你接线时，不要*\n\n    *   `剥线器`：只有当接线钳不包含时才需要。\n\n    *   `电缆测试仪`：可以让你判断电缆是否正常。\n\n\
  *   如果你计划穿墙布线，你还需要这些工具：\n\n    *   `锤子`\n\n    *   `孔锯`：如果你计划在墙上开孔以布电缆，这个很有用。\n\n\
  \    *   `手电筒`\n\n    *   `梯子`\n\n    *   `拿梯子的人`\n\n    *   `鱼簧`：可能需要。鱼簧是一段卷起来的硬性钢带。使用它时，你将钢带送入一个墙开口，将其引向另一个开口，你的伙伴在那里准备好抓住它。接下来，你的伙伴将电缆连接到鱼簧上，并大喊：“拉吧！”或“开火！”然后你收回鱼簧连同它的电缆。（你可以在货齐全的五金店的电器区找到鱼簧。）\n\
  \n![Warning](img/warning.png) 如果你计划穿过混凝土底布线，你需要租一台电镐和挖掘机，然后雇一个人在你工作时拿着黄色旗帜。最好为电缆找其他路线。\n\
  \n### 对绞电缆的引脚定义\n\n对绞电缆中的每对线有四种颜色：橙色、绿色、蓝色或棕色。构成每对的两根线是互补的：一根是白色带色的；另一根是彩色带白色。例如，橙色对有一根带白色条纹的橙色线（`orange\
  \ wire`）和一根带橙色条纹的白色线（`white/orange wire`）。同样，蓝色对有一根带白色条纹的蓝色线（`blue wire`）和一根带蓝色条纹的白色线（`white/blue\
  \ wire`）。\n\n\n\n\n\n当你将双绞电缆连接到模块化连接器或插座时，你必须将正确的导线连接到正确的引脚。这比听起来要困难；你可以使用几种不同的标准来为连接器布线。为了让情况更加复杂，你可以使用两种流行的标准接线方法之一：`EIA/TIA\
  \ 568A` 或 `EIA/TIA 568B`，也称为 `AT&T 258A`。这两种布线方案均如 表 7-2 所示。\n\n![警告](img/warning.png)\
  \ 使用哪种布线方案并不重要，但要选择其中一种并坚持使用。如果你在电缆的一端使用一种布线标准，而在另一端使用另一种标准，电缆将无法工作。\n\n| 引脚 | 功能\
  \ | EIA/TIA 568A | EIA/TIA 568B AT&T 258A |\n| :--- | :--- | :--- | :--- |\n| 1\
  \ | 发送 + | 白/绿 | 白/橙 |\n| 2 | 发送 – | 绿 | 橙 |\n| 3 | 接收 + | 白/橙 | 白/绿 |\n| 4 | 未使用\
  \ | 蓝 | 蓝 |\n| 5 | 未使用 | 白/蓝 | 白/蓝 |\n| 6 | 接收 – | 橙 | 绿 |\n| 7 | 未使用 | 白/棕 | 白/棕\
  \ |\n| 8 | 未使用 | 棕 | 棕 |\n\n表 7-2\n\n### 双绞电缆的连接\n以太网仅使用四对中的一对，连接到 `1`、`2`、`3` 和\
  \ `6`。其中一对传输数据；另一对接收数据。这两个标准之间的唯一区别是哪一对传输，哪一对接收。在 `EIA/TIA 568A` 标准中，绿色对用于发送，橙色对用于接收。在\
  \ `EIA/TIA 568B` 和 `AT&T 258A` 标准中，橙色对用于发送，绿色对用于接收。\n\n不要试图只连接 `1`、`2`、`3` 和 `6`。请按照\
  \ 表 7-2 所示连接所有四对。\n\n### RJ-45 连接器\n如果你有正确的压线工具，为双绞电缆连接 RJ-45 连接器并不太困难。唯一的诀窍是确保将每根导线连接到正确的引脚上，然后用力压紧工具以确保良好的连接。以下是连接\
  \ RJ-45 连接器的步骤：\n\n1. **将电缆末端剪至所需的长度。**\n   确保你的切口是平直的，而不是斜切的。\n2. **将电缆插入工具的剥线部分，使电缆末端对齐停止块。**\n\
  \   挤压手柄并缓慢拉出电缆，保持其平直。这会剥去正确长度的外绝缘层，而不会刺破内部导线的绝缘层。\n3. **排列导线使其平整，并根据 表 7-2 对齐。**\n\
  \   你必须稍微拨弄导线，让它们按照正确的顺序排列。\n4. **将导线滑入连接器上的引脚孔。**\n   双检查确保所有导线都滑入了正确的引脚孔。\n5.\
  \ **将插头和导线插入工具的压线部分，然后挤压手柄压紧插头。**\n   用力压紧！\n6. **从工具中取出插头并双检查连接情况。**\n   你完成了！\n\
  \n处理 RJ-45 连接器和双绞电缆时，还需要记住以下其他几点：\n\n* RJ-45 连接器上的引脚没有编号。\n  ![提示](img/tip.png)\
  \ 你可以这样持有连接器：使金属导体朝上，如 图 7-3 所示，以此判断哪是 `引脚 1`。`引脚 1` 在左侧。\n* 有人的电缆布线方式不同——使用绿白对作为\
  \ `引脚 1` 和 `2`，使用橙白对作为 `引脚 3` 和 `6`。只要电缆两端的连接器布线方式相同，这样做就不会影响网络运行（网络是“色盲”的）！\n*\
  \ 在连接连接器时，不要剥露超过半英寸的电缆外皮。如果不确定，请专业人员安装。\n\n![图片显示了连接到双绞电缆的 RJ-45 连接器](img/9781119648505-fg0703.png)\n\
  \n图 7-3\n\n### 交叉线\n交叉线不再像以前那样被需要，因为大多数交换机都可以自动检测是否需要交叉线，并允许你使用标准线。\n\n![提示](img/tip.png)\
  \ 如果你仔细研究 表 7-3 足够久并对比 表 7-2，你可能会发现交叉线的一端按照 `EIA/TIA 568A` 标准布线，另一端按照 `EIA/TIA 568B`\
  \ 标准布线。\n\n### 制作交叉线\n如果你想制作交叉线，你必须反转电缆一端的布线，如 表 7-3 所示。此表显示了如何为交叉线布线。根据 `连接 A`\
  \ 列连接一端，根据 `连接 B` 列连接另一端。\n\n| 引脚 | 连接 A | 连接 B |\n| :--- | :--- | :--- |\n| 1 |\
  \ 白/绿 | 白/橙 |\n| 2 | 绿 | 橙 |\n| 3 | 白/橙 | 白/绿 |\n| 4 | 蓝 | 蓝 |\n| 5 | 白/蓝 | 白/蓝\
  \ |\n| 6 | 橙 | 绿 |\n| 7 | 白/棕 | 白/棕 |\n| 8 | 棕 | 棕 |\n\n表 7-3\n\n### 交叉线\n交叉线可以用于直接连接两个设备，但交叉线通常用于级联交换机。\n\
  \n### 墙壁插座和配线架\n如果你需要，可以在用户端的墙上安装一个墙壁插座，并将电缆的另一端连接到配线架。这样电缆本身完全包含在墙壁和天花板空间内。要将计算机连接到网络，你需要将跳线（正式称为\
  \ `站线`）的一端插入墙壁插座，另一端插入计算机。在配线间，你使用跳线将墙壁插座连接到网络集线器或交换机。\n\n图 7-4 显示了这种安排的工作原理。\n\n\
  ![使用跳线连接墙壁插座到网络集线器或交换机的示意图](img/9781119648505-fg0704.png)\n\n\n\n\n\n当你使用双绞电缆布线网络时，你并不是将计算机相互连接。相反，每台计算机都连接到一个名为\
  \ `switch`（交换机）的独立设备上。\n\n在使用交换机时，你只需要了解几个细节。它们如下：\n\n*   安装 `switch` 通常非常简单。只需接入电源线，然后插入跳线以连接网络即可。\n\
  *   `switch` 上的每个端口都有一个 RJ-45 接口和一个 LED 指示灯，标记为 `Link`，当端口上建立连接时，该灯会亮起。\n    ![Tip](img/tip.png)\
  \ 如果你将电缆的一端插入端口，另一端插入计算机或其他网络设备，`Link` 灯应该会亮。如果灯没有亮，说明电缆、集线器或 `switch` 端口，或者电缆另一端的设备出了问题。\n\
  *   每个端口可能有一个闪烁的 LED 指示灯，用于指示网络活动。\n    ![Tip](img/tip.png) 如果你盯着 `switch` 看一会儿，可以通过观察哪些活动指示灯闪烁最频繁，来发现谁最使用网络。\n\
  *   端口可能还 fact 有一个冲突指示灯，每当端口发生数据包冲突时，它就会闪烁。\n    ![Warning](img/warning.png) 冲突指示灯偶尔闪烁是完全可以的，但如果它频繁闪烁，你的网络可能存在问题：\n\
  \    *   通常，闪烁意味着网络过载，应该用 `switch` 分段以提高性能。\n    *   在某些情况下，闪烁可能是由故障的网络节点引起的，坏数据包阻塞了网络。\n\
  \n## 比较托管和非托管型交换机\n\n并不是所有的交换机都是一样的。某些交换机是为家庭或单一办公室的小型网络设计的。小型网络的管理非常简单，`switch`\
  \ 本身不需要任何额外的管理或配置。你只需将所有计算机接入 `switch`，网络就会自动运行。\n\n然而，在较大的网络中，交换机的工作要复杂得多。在这些环境中，你需要能够监控和配置网络中每台交换机的行为。提供这种能力的交换机称为\
  \ `managed switches`（托管交换机）。不提供这种能力的交换机称为 `unmanaged switches`（非托管交换机）。\n\n`managed\
  \ switch` 拥有自己的 IP 地址，并提供一个基于 Web 的管理控制台，你可以通过将喜欢的浏览器指向 `switch` 的 IP 地址来访问它。登录管理控制台后，你可以执行此类操作，例如为每个端口配置不同类型的网络流量、查看每个端口的流量情况、监控每个端口的性能以及\
  \ `switch` 的整体性能。\n\n![Tip](img/tip.png) 一般般情况下，如果你的网络需要超过一个 `switch`，就应该使用 `managed\
  \ switches`。`Managed switches` 比 `unmanaged switches` 贵，但当你的网络增长到需要多一台交换机时，你会感激托管交换机所带来的益处。\n\
  \n## 交换机的级联\n\n如果单台 `switch` 的端口不足以供你的整个网络使用，你可以通过 `daisy-chaining`（级联）的方式来连接交换机，如图图\
  \ 7-5 所示。（注意，虽然你可以对非托管交换机进行级联，但如果你的网络足够大需要多一台交换机，我建议你使用托管交换机。）\n\n![Schematic illustration\
  \ of a network, in which the switches are connected by daisy-chaining.](img/9781119648505-fg0705.png)\n\
  \nFIGURE 7-5: 你可以将交换机级联在一起。\n\n在大多数交换机上，使用哪个端口级联到另一台交换机并不重要。只需在两个交换机上都选择一个端口，并使用跳线通过这些端口将交换机相互连接。如果你的\
  \ `switch` 有不同速度的端口，请使用最快的端口连接交换机。\n\n![Tip](img/tip.png) 如果你的建筑已经预留了线路，并且每个办公桌附近都有网络插座，可以使用小型\
  \ `switch` 通过单个插座将两或多台计算机连接到网络。只需用一根电缆将 `switch` 插入墙上插座，然后将每台计算机插入 `switch` 的端口。\n\
  \n## 交换机堆叠\n\n某些被称为 `stackable switches`（可堆叠交换机）的交换机可以通过添加额外的交换机模块来扩展，这些模块为 `switch`\
  \ 增加了额外的端口。额外的模块可以是通过特殊互连端口连接的物理独立交换机，也可以是可以插入大型机箱的模块。可堆叠交换机本质上是托管交换机，可堆叠交换机的定义特性是，所有连接到单一堆栈中的交换机都像一个交换机一样被管理。\n\
  \n例如，一个可堆叠交换机最初可能只配置了一个提供 48 个端口的模块。如果你需要更多端口，可以添加第二个带有 48 个额外端口的模块，创建一个具有 96 个端口的单交换机。\n\
  \n可堆叠交换机比非堆叠交换机贵，但管理一个大型交换机比管理多个较小交换机的简单性可能使增加的成本合理。\n\n## 查看分布交换机和接入交换机\n\n大到需要多一台交换机的网络，可能也大到需要几种不同类型的交换机：\n\
  \n*   **接入交换机（Access switches）：** `access switch` 通常是一种具有大量 1 Gigabit (Gb) 端口的交换机，其工作是将计算机和打印机等设备连接到网络。例如，如果你的公司有\
  \ 100 名员工，并且每个用户处都布了 Cat-5e 电缆，你至少需要 200 个 1 Gb 交换端口来支持这些用户。你还需要为打印机和 Wi-Fi 接入点准备一些额外端口。\n\
  \    你的网络设计可能会导致五台 48 口接入交换机，提供 240 个 1 Gb 端口。\n*   **分布交换机（Distribution switches）：**\
  \ `distribution switch` 设计并不是用于直接支持用户的。相反，它的设计是为了连接接入交换机以及服务器。因为分布交换机的目的是管理来自所有接入交换机的聚合流量，它们有时被称为\
  \ `aggregation switches`（聚合交换机）。\n    通常，分布交换机使用 10 Gbps 端口而不是 1 Gbps 端口。增加速度非常有帮助，因为分布交换机每个端口的数据量远大于接入交换机的每个端口。接入交换机也应该配置几个用于连接分布交换机的\
  \ 10 Gbps 端口。\n*   **核心交换机（Core switches）：** 最大的网络可能还会利用 `core switches`，用于连接分布交换机。核心交换机管理分布交换机之间的流量。\n\
  \    图 7-6 显示了一个通过分布交换机连接的四个独立接入交换机的网络。\n\n![Schematic illustration of the distribution\
  \ and access switches.](img/9781119648505-fg0706.png)\n\nFIGURE 7-6: 分布和接入交换机。\n\
  \n## 通过以太网供电\n\n除了传输数据，以太网还可以为不消耗大量电的设备供电。提供电是以太电路称为 `Power over Ethernet` (PoE)。使用\
  \ PoE 需要使用设计用于提供 PoE 的特殊交换机。\n\nPoE 网络上常用的三种设备：\n\n*   **IP 电话：** 使用 TCP/IP 传输语音对话的电话系统经常使用\
  \ PoE 为桌面上的电话供电。这消除了为电话供电使用独立电源的需求。\n\n\n\n\n\n*   **Wi-Fi 接入点：** Wi-Fi 接入点通常使用\
  \ `PoE` 而不是独立的电源。由于 Wi-Fi 接入点通常安装在天花板上，为它们供电可能非常困难。使用 `PoE` 就不需要电工在每个 Wi-Fi 接入点旁边安装电源插座。\n\
  *   **监控摄像头：** 监控摄像头与 Wi-Fi 接入点的原因相同，通常使用 `PoE`：消除在每个摄像头位置都需要电源插座。\n\n`PoE` 不需要任何特殊的线缆，但需要特殊的\
  \ `PoE` 交换机。`PoE` 交换机比非 `PoE` 交换机贵。但如果你计划部署 IP 电话、Wi-Fi 接入点或监控摄像头，你应该考虑使用 `PoE`\
  \ 交换机为它们供电。\n\n## 查看三种类型的机房\n\n作为本章的最后一个主题，让我们简要看看你可能放置网络交换机的三个不同类型的房间：\n\n*   **主入口点\
  \ (MPOE)：** 每栋办公大楼都有一个主配电室，来自外界的服务（不仅包括电力，还有数据连接）都会进入大楼。在网络术语中，这种房间被称为 `MPOE`。\n\
  \n`MPOE` 通常是你的网络连接互联网的地方。按照规定，你希望避免在该房间内放置交换机和路由器等网络设备，因为那里通常没有空调。\n\n*   **主配线间\
  \ (MDF)：** 你的主要计算机房（你可以称之为`服务器房`）通常是你放置汇聚交换机的房间。这个房间被称为 `MDF`。如果 `MDF` 靠近接入交换机服务的用户，接入交换机也可以放置在\
  \ `MDF` 中。\n*   **中间配线间 (IDF)：** 对于远离 `MDF` 的用户组，你可以考虑设置一个靠近这些用户的独立 `IDF`。这个房间将包含这些用户的接入交换机，并通过一根或多根以太网线连接到\
  \ `MDF` 中的汇聚交换机。（`IDF` 也经常被称为`配线间`。）\n\n在多层建筑中，每层都设置一个 `IDF` 是很常见的。如果你的网络跨越校园内的几栋大楼，每栋大楼都有一个\
  \ `IDF` 也很常见。\n\n# 第 8 章\n\n# 建立无线网络\n\n### 本章内容\n\n![Bullet](img/check.png) 理解无线网络标准\n\
  * ![Bullet](img/check.png) 复习基础无线电术语\n* ![Bullet](img/check.png) 考虑基础设施网络和自形网络\n\
  * ![Bullet](img/check.png) 使用无线接入点工作\n* ![Bullet](img/check.png) 为无线网络配置 Windows\n\
  * ![Bullet](img/check.png) 保护无线网络安全\n\n自从以太网网络诞生以来，电缆变得越来越小且越容易处理。最初的以太网线大约有拇指粗，重量巨大，而且很难在狭窄的转角弯曲。然后出现了同轴电缆，它更轻、更容易处理。同轴电缆被非屏蔽双绞（`UTP`）电缆取代，这是目前大多数网络使用的电缆。\n\
  \n尽管多年来电缆变得更小、更便宜且更容易处理，但仍然是`电缆`。因此，你必须在墙上钻孔，将电缆穿过天花板，并让绝缘掉进头发里来为你的整个家或办公室布线。\n\n\
  使用电缆联网的替代方案当然是`不使用`电缆联网……也称为`无线网络`。无线网络使用无线电波来发送和接收网络信号。结果是计算机可以连接到家中或办公室内任何位置的无线网络。\n\
  \n无线网络对于笔记本电脑来说特别有用。毕竟，笔记本电脑的主要优点是你可以随身携带到任何地方。在工作时，你可以在办公桌前、会议室、休息室甚至是外的停车场使用笔记本电脑。在家里，你可以在卧室、厨房、书房或游戏室，或者泳池边使用它。有了无线网络，无论你把笔记本电脑带到哪里，都可以连接到网络。\n\
  \n无线网络对于其他类型的移动设备（如智能手机和平板）也变得极其有用。诚然，这些设备可以通过移动网络连接，但费用会迅速增加。然而，通过无线网络，你可以连接智能手机或平板电脑，而无需向手机公司支付连接费用。\n\
  \n本章将向你介绍建立无线网络的内部细节。我会告诉你需要了解关于无线网络标准的知识、如何规划你的无线网络，以及如何安装和配置无线网络组件。如果你最终建立了一个有线和无线的混合网络，我也会向你展示如何创建它。\n\
  \n## 深入无线网络\n\n正如我之前提到的，无线网络只是一种使用无线电信号而非直接电缆连接来交换信息的网络。简单如此。带有无线网络连接的计算机就像手机。就像你使用手机不需要连接（系在）电话线上一样，使用无线网络连接计算机也不需要连接到网络电缆。\n\
  \n以下是你设置和使用基础无线网络需要理解的关键概念和术语：\n\n*   **WLAN：** 无线网络通常被称为无线局域网（`WLAN`）。有些人喜欢将这个缩写颠倒过来变为本地无线网络，即\
  \ `LAWN`。\n*   **Wi-Fi：** `Wi-Fi` 术语通常用于描述无线网络，尽管它在技术上仅指一种无线网络形式：`802.11` 标准。（更多信息请参见本章后面的无线标准。）\n\
  *   **SSID：** 无线网络有一个名称，被称为 `SSID`。`SSID` 的全称是`服务集标识符。（这难道不是一个很好的《问答节目》问题吗？我要这个冷门的四个字母缩写，400\
  \ 美元！）所有属于同一个无线网络的计算机必须具有相同的 `SSID`。\n*   **通道：** 无线网络可以在任何通道上传输。然而，为了让计算机之间通信，它们必须配置为在同一通道上传输。\n\
  *   **自形 (Ad-hoc)：** 最简单的无线网络由两个或多个带有无线网络适配器的计算机组成。这种网络被称为自形模式网络。\n*   **基础设施模式\
  \ (Infrastructure mode)：** 更复杂的网络类型是基础设施模式网络。这实际上一组无线计算机不仅可以相互连接，还可以通过名为`无线接入点`（`WAP`）的设备连接到现有的有线网络。\n\
  \n\n\n\n\n首先，无线电是由通过大气传输的电磁波组成的。你看不到也听不到它们，但无线电接收机可以接收它们并将它们转换为声音、图像或——在无线网络的情况下——数据。无线电实际上是电子能量的周期性波，它们以特定的速率重复：即`frequency`（频率）。\n\
  \n图 8-1 显示了两种频率频率。第一个是每秒一个循环；第二个是每秒两次循环。（真实的无线电工作频率没有那么低，但我认为每秒一次和两次循环比画每秒 680,000\
  \ 次和每秒 240 万次更容易画。）\n\n![图表描述了无线波通常具有频率。](img/9781119648505-fg0801.png)\n\n图 8-1：\
  \ 无线波通常具有频率。\n\n![提示](img/tip.png) 频率的单位是`cycles per second`（每秒循环次数），它表示波在 1 秒内完成了多少次完整循环（显而易见）。为了纪念海里希·赫兹（Heinrich\
  \ Hertz）——他是第一个成功发送和接收无线电的人（发生在 19 世纪 80 年代）——每秒循环通常被称为`Hertz`（赫兹），缩写为 `Hz`。因此，`1\
  \ Hz` 就是每秒一次循环。\n\n![技术细节](img/technicalstuff.png) 顺便一下，当在 `Hz` 前加上加上 `K`（代表 `kilo`，1000）、`M`（代表\
  \ `mega`，1 百万）或 `G`（代表 `giga`，10 亿）时，`H` 仍然大写。因此，`2.4 MHz` 是正确的（而不是 `2.4 Mhz`）。\n\
  \n无线电频率的妙之处在于，发射器可以调到精确的频率广播无线电。同样，接收器也可以调到精确的频率接收无线电，忽略其他频率的波。这就是为什么你可以调节汽车里的收音机来收听几十个广播电台：每个电台都以自己的频率进行广播。\n\
  \n### 波长与天线\n\n与频率相关的术语是 `wavelength`（波长）。无线电以光速传输，`wavelength` 指无线电信号在每个循环中传输的距离。或者换句话说，`wavelength`\
  \ 指每个波峰之间的物理距离。例如，光速大约为每秒 182,282 英里，因此 `1 Hz` 无线电波的波长约为 182,282 英里。`2 Hz` 信号的波长大约是一半：仅\
  \ 91,141 英里。\n\n如你所见，波长随着频率的增加而减少。在 `580 KHz` 广播的典型 AM 广播电台的波长约为 522 码。对于在 `100\
  \ MHz` 广播的电视站，大约是 3 码。对于在 `2.4 GHz` 广播的无线网络，波长仅比 5 英寸短一点。\n\n波长越短，天线就越小就能充分接收信号。因此，高频传输需要更小的天线。你可能已经注意到，AM\
  \ 广播电台通常在高塔上安装巨大的天线，但手机发射器要小得多，而且它们的塔也没有那么高，因为手机的工作频率比 AM 广播电台高得多。那么，是谁决定什么类型的无线电可以使用特定频率的？这就是频谱（spectrums）和联邦通信委员会（FCC）的作用所在。\n\
  \n### 频谱与 FCC\n\n`Spectrum`（频谱）是指无线电可以运行的连续频率范围。在美国，联邦通信委员会（FCC）不仅监管在超级碗赛期间可以展示多少珍妮特·杰克逊的内容，还监管无线电频谱不同部分的使用方式。基本上，FCC\
  \ 将无线电频谱划分为几十个小范围——`bands`（频段），并将某些用途限制在某些频段。例如，AM 广播工作在 `535 KHz` 到 `1,700 KHz`\
  \ 的频段上。\n\n表 8-1 列出了一些最受欢迎的频段。注意，这些频段中有些很宽——UHF 电视从 `470 MHz` 开始到 `806 MHz` 结束——但其他频段被限制在特定频率。一个频段内最低和最高频率之间的差异是\
  \ `bandwidth`（带宽）。\n\n| **频段** | **用途** |\n| --- | --- |\n| 535 KHz–1,700 KHz |\
  \ AM 广播 |\n| 5.9 MHz–26.1 MHz | 短波广播 |\n| 26.1 MHz–27.4 MHz | 民用波 (CB) |\n| 54 MHz–88\
  \ MHz | 电视 |\n| 88 MHz–108 MHz | FM 广播 |\n| 174 MHz–220 MHz | 电视 |\n| 470 MHz–806\
  \ MHz | 电视 |\n| 806 MHz–890 MHz | 蜂 |\n| 900 MHz–1850 MHz | 蜂窝 |\n| 1850 MHz–2435\
  \ MHz | 无线网络 |\n| 2.4 GHz–5 GHz | 无线网络 |\n| 5 GHz | 卫星 |\n\n表 8-1 频谱的热门段\n\n###\
  \ 802.11：理解无线标准\n\n无线网络流行的标准是 `802.11`。这些标准使用了与以太网许多许多技术。`802.11` 标准处理了 IEEE 七层模型的底两层：物理层和介质访问控制（MAC）。注意\
  \ TCP/IP 应用于该模型的更高层。结果是，TCP/IP 在 `802.11` 网络上运行良好。\n\n 原始的 `802.11` 标准于 1997 年通过。该标准的两个扩展\
  \ `802.11a` 和 `802.11b` 于 1999 年通过。然后是 2003 年的 `802.11g` 和 2009 年的 `802.11n`。\n\n\
  `802.11n` 统治了几年，直到 2014 年出现了最新的标准——`802.11ac`。目前更多变体正在开发中，包括将在 `900 MHz` 上运行的 `802.11ah`。\n\
  \n表 8-2 总结了 2016 年初 `802.11` 五种最流行变体的基本特征。目前，大多数无线网络基于 `802.11n` 和 `802.11ac` 标准。\n\
  \n| **标准** | **速度** | **频率** | **典型范围（室内）** |\n| --- | --- | --- | --- |\n| 802.11a\
  \ | 54 Mbps | 5 GHz | 150 英尺 |\n| 802.11b | 11 Mbps | 2.4 GHz | 300 英尺 |\n| 802.11g\
  \ | 54 Mbps | 2.4 GHz | 300 英尺 |\n| 802.11n | 高达 600 Mbps（但大多数设备在 100 Mbps 范围内）\
  \ | 2.4 GHz | 230 英尺 |\n| 802.11ac | 高达 1,300 Mbps | 5 GHz | 230 英尺 |\n\n\n\n\n\n\
  802.11ac 无线设备在室内的最大传输范围约为 230 英尺。当你把一组无线电脑聚在一起时，如果某些电脑在彼此的范围内，而另一些则不在，这可能会产生一种有趣的现象。假设\
  \ Bart、Homer 和 Lisa 都有无线笔记本电脑。Bart 的电脑距离 Homer 的电脑 150 英尺，而 Bart 的电脑距离 Lisa 的电脑在相反方向上也有\
  \ 150 英尺（参见图 8-2）。在这种情况下，Bart 可以同时访问 Homer 和 Lisa 的电脑，但 Homer 只能访问 Bart 的电脑，而 Lisa\
  \ 也只能访问 Bart 的电脑。换句话说，Homer 和 Lisa 无法访问彼此的电脑，因为他们之间的距离是 300 英尺，远远超过了 230 英尺的范围限制。（这听起来开始像道代数题了。假设\
  \ Homer 以每小时 2 英的速度开始向 Bart 走去，Lisa 以每小时 4 英的速度开始向 Bart 跑去……。）\n\n**注意：** 尽管 802.11ac\
  \ 的正常范围是 230 英尺，但在实际操作中范围可能会更短。障碍物——实墙、恶天气、无线电话、微波炉、后院核反应堆等——都会共同缩短无线适配器的有效范围。如果你在连接网络时遇到困难，有时只需调整天线就有帮助。\n\
  \n此外，无线网络往往随着距离的增加而变慢。802.11ac 网络设备声称工作速度可达 1,300 Mbps，但它们通常只在近距离达到该速度。离得越远，实际速度就越慢。在最大距离处，你可能可以连接，但你的有效连接速度会很慢。你应该意识到，当你处于无线设备范围的边缘时，更有可能因为天气不好突然丢失连接。\n\
  \n![Homer、Bart 和 Lisa 玩耍无线网络的示意图。](img/9781119648505-fg0802.png)\n\nFIGURE 8-2:\
  \ Homer、Bart 和 Lisa 玩耍他们的无线网络。\n\n## 使用无线网络适配器\n\n每台连接到你无线网络的电脑都需要一个无线网络适配器，它类似于用于标准以太网连接的网络接口卡\
  \ (NIC)。然而，无线网络适配器后面没有电缆接口，而是有一个天线。\n\n几乎所有的便携电脑（如笔记本电脑和平板）都内置了无线网络，因此你不需要为便携电脑添加额外的无线网络适配器。但是，台式电脑的情况就不同。它们通常没有内置无线网络。如果你的电脑没有，你就必须购买两种无线适配器中的一种：\n\
  \n* **无线 PCI 卡：** 你将这种无线网络适配器安装在台式电脑内部的可用槽中。是的，你需要拆解电脑，所以只有当你具备专业知识和勇气去研究电脑内部时，才使用这种类型的卡。一个典型的\
  \ 802.11ac 版本大约花费 75 美元。\n* **无线 USB 适配器：** 这个小设备是一个插在电脑 USB 接口上的独立设备。USB 适配器的价格与\
  \ PCI 适配器差不多。而且你不需要拆解电脑就可以安装它。\n\n## 设置无线接入点\n\n与有线网络不同，无线网络不需要单独交换机。如果你只是想让一组无线电脑组网，且电脑彼此很近，你只需要为每台电脑购买一个无线适配器——*变变！*——网络瞬间建成了。\n\
  \n但如果你已经有一个现有的有线网络呢？假设你在办公室工作，有 15 台电脑都很好地连接了线，你只想在网络中添加几台无线笔记本电脑。或者，假设你的书房里两台通过网线连接的电脑，但你想连接卧室的一台电脑，而不想在天花板上拉电缆。\n\
  \n这就是 WAP（无线接入点）大显身场的地方。WAP 实际上执行两个功能：\n\n* 它作为所有带有无线网络适配器的电脑的中心连接点。实际上，WAP 执行的功能与网络交换机对有线网络执行的功能相同。\n\
  * 它将你的无线网络与现有的有线网络连接起来，让你的有线电脑和无线电脑像一个大大家庭一样相处。这听起来像是一个苏斯博士故事的开头（“现在无线网机没有线线的集线器。但双绞网机有电缆连接到那里……”）。\n\
  \n![提示](img/tip.png) 无线接入点有时被称为接入点 (APs)，基本上是一个带有天线（或通常是一对天线）和一个 RJ-45 以太网端口的盒子。你将\
  \ AP 接入网线，然后将线缆另一端插入集线器或交换机，你的无线网络就能连接到你的有线网络。\n\n图 8-3 显示了接入点如何作为无线电脑的中心连接点，以及它如何将你的无线网络桥接到有线网络。\n\
  \n### 基础设施模式\n\n当你使用 AP 设置无线网络时，你正在创建一个*基础设施模式网络*：AP 为网络提供永久的基础设施。AP 安装在固定位置，因此网络具有稳定的边界。每当移动电脑漫游到某个\
  \ AP 的范围内，另一个 AP 会自动接管用户而不会中断用户的网络服务。\n\n一个接入点和所有连接到它的无线电脑被称为*基本服务集* (BSS)。每个 BSS\
  \ 通过*服务集标识* (SSID) 进行识别。当你配置接入点时，会指定你想要使用的 SSID。大多数接入点的默认 SSID 是包含制造商名称通用名称。不过，你可以轻松将其更改为更有意义的名称。\n\
  \n### 多功能 WAP\n\n![提示](img/tip.png) 无线接入点通常包含其他内置功能。某些接入点兼作以太网交换机，有一组 RJ-45 端口供你插入其他设备。此外，某些接入点内置了宽带或\
  \ DSL 路由器，使你能够连接互联网。图 8-4 显示了一个用于家庭或小型办公室用途的典型 802.11ac 无线路由器。此类类型的设备通常包含以下内容：\n\
  \n* 一个支持多个无线设备的 802.11ac 无线接入点\n* 一个具有防火墙功能的路由器，可以直接连接到宽带或 DSL 路由器的输出端\n* 一个四口千兆以太网交换机，用于连接有线电脑或其他设备\n\
  * 一个或多个 USB 端口，允许将 USB 打印机或磁盘驱动器连接到你的网络\n\n![提示](img/tip.png) 设计用于家庭网络互联网网关的多功能接入点有时被称为*无线路由器*或*家用网关*。\n\
  \n## 漫游能力\n\n你可以使用两个或多个无线接入点来创建一个大型无线网络，电脑用户可以在不同区域之间漫游并保持连接到无线网络。当用户离开一个 AP 的范围时，另一个\
  \ AP 会自动接管用户而不会中断用户的网络服务。\n\n\n\n\n\n为了设置两个或多个接入点以实现漫游，你必须仔细放置接入点，确保办公室或建筑内所有接入接入的区域都在至少一个接入点的覆盖范围内。然后，只需确保所有计算机和接入点使用相同的\
  \ `SSID` 即可。\n\n为了漫游而连接的两个或多个接入点以及连接到任何接入点的所有无线计算机，组成了一个`扩展服务集`(ESS)。`ESS` 中的接入点通常连接到有线网络。\n\
  \n漫游的一个局限性是 `ESS` 中的每个接入点必须位于同一个 `TCP/IP` 子网中。这样，在 `ESS` 内从一个接入点漫游到另一个接入点的计算机就可以保留相同的\
  \ IP 地址。如果接入点位于不同的子网，漫游计算机在从一个接入点移动到另一个时必须更改 IP 地址。\n\n### 无线桥接\n\n无线 AP 的另一个用途是桥接无法通过电缆连接的独立子网。假设你有两栋相距仅约\
  \ 50 英利的办公楼。要从一栋楼到另一栋楼铺设电缆，你需要埋设管道——这是一项可能非常昂贵的工作。由于楼之间距离近，你可以使用一对无线接入点作为两个网络之间的`无线桥接`来连接它们。将一个接入点连接到第一个网络，将另一个接入点连接到第二个网络。然后配置两个\
  \ AP 使用相同的 `SSID` 和信道。\n\n### 自形成网络\n\n建立无线网络并不需要 `WAP`。每当两个或多个无线设备进入彼此的范围时，它们就可以相互连接，形成一个自形成网络（ad-hoc\
  \ network）。例如，如果你和你的几个朋友都拥有带有无线适配器的笔记本电脑，你们可以在任何地方聚会并形成一个自形成网络。\n\n自形成网络中在彼此范围内范围内的所有计算机都是`独立基本服务集`(IBSS)。\n\
  \n## 配置无线接入点\n\n无线接入点的物理设置非常简单：你将其从盒子里取出，放在靠近网络插座和电源插座的架子或书柜顶部，插上电源线，再插上网线。\n\n\
  接入点的软件配置稍微复杂一些，但仍然不复杂。它通常通过网络界面完成。要进入接入点的配置页面，你需要知道它的 IP 地址。然后只需在网络上任意一台计算机的浏览器地址栏中输入该地址即可。\n\
  \n多功能接入点通常为网络提供 `DHCP` 和 `NAT` 服务，并兼当网络的网关路由器。因此，它们通常有一个私有 IP 地址，通常位于互联网私有 IP 地址范围的开头，通常为\
  \ `192.168.0.1` 或 `10.0.0.1`。请咨询随 AP 提供的文档以获取更多信息。\n\n![提示](img/tip.png) 如果你使用既作为无线\
  \ AP 又作为互联网路由器的多功能 AP，且忘记了 IP 地址，可以在网络上任意计算机的命令提示符上运行 `IPCONFIG` 命令。默认网关 IP 地址应该是接入点的\
  \ IP 地址。\n\n### 基础配置选项\n\n图 8-5 显示了典型路由器的主配置屏幕。我通过在 Web 浏览器地址栏中输入 `192.168.0.1`\
  \ 并在提示时登录密码来打开此配置页面。\n\n![典型无线路由器主配置页截图。](img/9781119648505-fg0805.png)\n\n图 8-5：\
  \ 典型无线路由器的主配置页。\n\n在此路由器的主设置页上，你可以配置路由器的主机名和 IP 地址，以及是否启用路由器的 `DHCP` 服务器。在其他选项页上找到选项允许你配置无线设置，例如网络名称\
  \ (`SSID`)、要实施的安全类型以及各种其他设置。\n\n### DHCP 配置\n\n你可以将大多数多功能接入点配置为 `DHCP` 服务器。对于小型网络，接入点通常是整个网络的\
  \ `DHCP` 服务器。在这种情况下，你需要配置接入点的 `DHCP` 服务器。\n\n图 8-6 显示了典型无线路由器的 DHCP 配置页。要启用 `DHCP`，你需要选择\
  \ `Enable`（启用）选项，然后指定供 `DHCP` 服务器使用的其他配置选项。\n\n![典型无线路由器配置动态主机主机配置协议的截图。](img/9781119648505-fg0806.png)\n\
  \n图 8-6： 为典型无线路由器配置 DHCP。\n\n对 `DHCP` 要求更高的较大网络可能会在另一台计算机上运行单独 `DHCP` 服务器。在这种情况下，你可以通过禁用接入点中的\
  \ `DHCP` 服务器来使用现有服务器。\n\n有关配置 `DHCP` 服务器的更多信息，请参阅第 6 章。\n\n## 连接到无线网络\n\n在 Windows\
  \ 计算机上连接无线网络非常简单。Windows 会自动检测范围内的任何无线网络并将其显示在列表中，如图 8-7 所示。\n\n要连接到网络，只需点击它，然后输入安全密钥。\n\
  \n在连接时，你可以选择自动连接到该网络。如果你选择此选项，就不需要手动选择网络或输入安全密钥。\n\n![在列表中选择无线网络的截图。](img/978119648505-fg007.png)\n\
  \n图 8-7：Windows 会记住你连接过的每一个网络，这对于经常使用的网络是一个优点，但对于可能再次使用的网络是一个缺点。要让 Windows 忘记某个网络，请按照以下步骤操作：\n\
  \n1. 点击`开始`，然后点击`设置`。\n   设置窗口出现。\n2. 点击`网络和 Internet`。\n   进入网络和 Internet 页面，列出了已知网络。\n\
  3. 滚动到已知网络列表底部，然后点击`管理 Wi-Fi 设置`。\n   进入管理 Wi-Fi 设置页面，包含已知网络。\n4. 在已知网络部分，点击你想忘记的网络。\n\
  \   该网络被选中，如图 8-8 所示。\n5. 点击`忘记`。\n   网络将被忘记。再次登录此网络时你需要输入安全密钥。\n\n![在 Windows 10\
  \ 中忘记无线网络的截图。](img/9781119648505-fg0808.png)\n\n图 8-8：\n\n## 注意无线网络安全\n\n在向你的网络发布无线接入点之前，你应该首先考虑无线网络带来的固有的安全风险。除非你采取一些基本的预防措施，否则添加无线接入点会将网络内部结构暴露给范围内的任何人。\n\
  \n有关通用的网络安全的详细信息，请参阅第 19 章。本节的信息将帮助你防止不受欢迎的访客通过你的无线接入点访问网络，但无论你是否提供无线访问，第 19 章中概述的安全技术都是必不可少的。\n\
  \n以下段落描述了无线网络最可能遇到的类型安全威胁。在规划网络安全时，你应该考虑每种此类威胁：\n\n\n\n\n\n## 无线安全风险\n\n- **入侵者（Intruders）：**\
  \ 对于有线网络，入侵者通常必须进入你的设施才能物理上连接到你的网络。无线网络的情况并非如此。任何拥有无线设备的人，只要进入你网络无线信号的范围，就可以访问你的网络。在家里，你的邻居可能会看到你的无线网络。在办公室，坐在大楼外长椅上的孩子们可能也能看到你的无线网络。\n\
  \n- **搭车者（Freeloaders）：** `Freeloaders` 是那些想通过搭你的无线网络免费接入互联网的入侵者。如果他们成功接入了你的无线网络，他们可能不会做任何恶意行为：他们只是打开网页浏览器上网即可。这些人是太舍不得每月在家里花\
  \ 40 美元购买宽带连接的人，所以他们宁愿开车进你的停车场偷用你的。\n\n  尽管搭车者可能相对无害，但他们可能成为潜在的麻烦源。他们会占用你的带宽。他们可能会使用你的网络下载非法色情内容，或者尝试劫持你的邮件服务器来发送垃圾邮件。他们最初可能只是无意中寻找免费的网络接入，但一旦进入，他们的好奇心可能会增长，导致他们在你网络中到处窥探。\n\
  \n- **窃听者（Eavesdroppers）：** `Eavesdroppers` 喜欢监听你的网络流量。他们实际上并没有尝试通过你的无线网络获取访问——至少起初不是。他们只是在听。他们监视你通过无线网络发送的数据包，希望找到有用的信息，如密码或信用卡号。\n\
  \n- **破坏者（Spoilers）：** `spoiler` 是一种以干扰网络使其无法使用为乐的黑客。破坏者通常通过向网络泛入无意义的流量来实现这一行为，使合法流量淹没在数据流中。破坏者还可能尝试通过不安全的无线连接在你的网络中放置病毒或蠕虫程序。\n\
  \n希望我已经说服了你，无线网络确实存在许多安全风险。以下是你可以采取的一些步骤来帮助保护你的无线网络：\n\n- **创建一个安全的无线密码。** 在设置无线网络时，你应该做的第一件事是更改访问网络所需的默认密码。大多数无线路由器制造商都使用众周知的标准密码来保护\
  \ `SSID`。确保你将其更改为只有你知道的密码，然后只与你想要授权访问的人分享该密码。\n\n- **更改管理员密码。** 大多数接入点都有基于 Web 的设置页面，你可以从任何网络浏览器访问该页面以配置接入点的设置。设置页面受用户名和密码保护，但用户名和密码最初被设置为易猜的默认值。任何获得你网络访问权限都可以登录管理员页面并接管你的网络。\n\
  \n- **隐藏 `SSID`。** 保护无线网络可以采取的简单步骤是禁用网络 `SSID` 的自动广播。这样，只有那些知道你网络存在性的人才能访问它。（保护\
  \ `SSID` 并不是一个完整的解决方案，所以你不应该将其作为唯一的安全机制。）\n\n- **禁用访客模式。** 许多接入点都有访客模式功能，允许客户端计算机指定空白\
  \ `SSID` 或将“任何（any）”指定为 `SSID`。如果你想确保只有知道 `SSID` 的客户端才能加入网络，你必须禁用此功能。\n\n- **使用\
  \ MAC 地址过滤。** 保护无线网络最有效的方法之一是使用名为 `MAC address filtering` 的技术。`MAC address filtering`\
  \ 允许你为允许访问或禁止访问网络的设备指定 `MAC` 地址列表。如果具有不同 `MAC` 地址的计算机尝试通过接入点加入网络，接入点将拒绝访问。\n\n \
  \ ![Tip](img/tip.png) 对于具有固定数量的无线网络，`MAC address filtering` 是一个很棒的主意。如果你在办公室设置无线网络，让几名员工连接他们的笔记本电脑，你可以在\
  \ `MAC filtering table` 中指定这些计算机的 `MAC` 地址。这样，其他计算机将无法通过接入点访问网络。\n\n  `MAC address\
  \ filtering` 并非万无一击，但它在防止不受欢迎的人访问网络方面非常有帮助。遗憾的是，`MAC address filtering` 也非常不方便。每当你为新设备授予访问权限时，都要找到该设备的\
  \ `MAC` 地址并将其添加到允许设备列表中。\n\n- **将接入点放置在防火墙之外。** 无线网络最有效的安全技术是将所有的无线接入点放置在防火墙*之外*。这样，来自无线用户的所有网络流量都必须通过防火墙才能访问网络。\n\
  \n  你可以想象，这样做可以显著限制无线用户的网络访问。为了绕过这些限制，你可以为无线用户启用虚拟专用网络（`VPN`）连接。`VPN` 将允许授权无线用户获得全网络访问。\n\
  \n  显然，这个解决方案需要一些设置工作，并且对你的用户来说可能有些不便，但它是完全保护无线接入点的极佳方法。\n\n# 第 9 章\n\n### 连接互联网\n\
  \n本章内容\n\n- ![Bullet](img/check.png) **查看 DSL 和电缆**\n- ![Bullet](img/check.png)\
  \ **检查高速私专线**\n- ![Bullet](img/check.png) **使用路由器**\n- ![Bullet](img/check.png)\
  \ **使用防火墙保护你的连接**\n- ![Bullet](img/check.png) **使用 Windows 自带的防火墙**\n\n所以你决定将网络连接到互联网。你要做的只是给电缆公司打电话让他们派人过来，对吧？错了。遗憾的是，连接互联网不仅仅是给电缆公司打电话。首先，你必须确保电缆是正确的连接方式。然后，你需要选择并配置访问互联网的软件。最后，你可能会整夜担心黑客会通过你的互联网连接入侵你的网络。\n\
  \n别担心。本章的建议将帮助你决定如何连接互联网，一旦做出决定，如何安全地连接。\n\n### 连接互联网\n\n连接互联网并不是免费的。首先，你必须购买制作连接所需的计算机设备。然后，你需要从互联网服务提供商（`ISP`）处获取连接。ISP\
  \ 根据连接的速度和容量收取月费。\n\n以下章节描述了连接网络用户到互联网的最常用方法。\n\n### 使用电缆或 DSL 连接\n\n对于小型和家庭办公室，连接互联网的两种常用方法是电缆和数字用户线路（`DSL`）。\n\
  \n\n\n\n\n- **电缆和 DSL 的速度比拨号连接快得多。** 根据你所获得的服务，电缆连接的速度可以比拨号连接快 10 到 200 倍。DSL 线的速度也与电缆相当。（尽管\
  \ DSL 是专用连接，但电缆连接是多个订阅者之间共享的。当几位订阅者同时使用连接时，电缆连接的速度可能会慢。）\n\n- **使用电缆和 DSL，你始终连接到互联网。**\
  \ 你不需要像使用调制解调器那样，每次上网时都要连接和断开。不再需要等待调制解调器拨打你的服务商，也不需要听它在尝试建立连接时发出的恼人调制尖叫声。\n\n-\
  \ **上网时，电缆和 DSL 不会占用电话线。** 使用电缆，你的互联网连接通过电视电缆工作，而不是电话线缆。对于 DSL，电话公司会为 DSL 服务安装一条独立的电话线，因此你的普通电话线不受影响。\n\
  \n遗憾的是，世界上没有免费的午餐，电缆和 DSL 提供的高速、全天连接并非没有代价。首先，你可能需要为电缆或 DSL 支付更高的月费。在美国大部分地区，住宅用户的电缆费用每月约为\
  \ 50 美元；商业用户预计需要支付更多，特别是当有多个用户通过电缆连接到互联网时。\n\nDSL 服务的费用取决于你选择的接入速度。在某些地区，住宅用户只需每月\
  \ 30 美元即可获得相对较慢的 DSL 连接。对于更高的接入速度或商业用户，DSL 的费用可能会贵得多。\n\n此外，电缆和 DSL 接入并非随处可用。但如果你住在没有电缆或\
  \ DSL 的地区，你仍然可以通过卫星连接或蜂窝网络来获取高速互联网访问。\n\n### 使用高速专线连接\n\n如果你的网络规模很大，且高速互联网访问是首要任务，请联系当地的电话公司（或几家公司）安装专用高速数字线路。这些线路可能会花费你大量的资金（每月数百美元），因此它们最适合有\
  \ 20 个或更多用户同时访问互联网的大型网络。\n\n接下来的段落描述了高速专线的三个基本方案：\n\n- **T1 和 T3 线路：** T1 和 T3 线路运行在标准的铜线电话线上。T1\
  \ 线的连接速度高达 1.544 Mbps。T3 线路稍快一点：它的数据传输率为 44.184 Mbps。当然，T3 线路比 T1 线路昂贵。\n\n  如果你没有足够的用户来支撑一整条\
  \ T1 或 T3 线路的费用，你可以只租赁线路的小部分。通过分拆 T1 线路，你可以获得 128 Kbps 到 768 Kbps 的连接速度；通过分拆 T3\
  \ 线路，你可以选择 4.6 Mbps 到 32 Mbps 之间的速度。\n\n  ![提示](img/tip.png) 你可能在 T1 或 T3 线路是否真的比电缆或\
  \ DSL 连接快。毕竟，T1 的运行速度为 1.544 Mbps，T3 的运行速度为 44.184 Mbps，而电缆和 DSL 声称其运行速度与此相当。但存在许多差异使得\
  \ T1 或 T3 线路的高昂额外成本变得合理。特别是，T1 或 T3 线路是`dedicated* line` —— 不由任何其他用户共享。T1 和 T3 是更高质量的连接，因此你实际上可以获得\
  \ 1.544 或 44.184 Mbps 的连接速度。相比之下，由于连接质量差且连接通常与其他用户共享，电缆和 DSL 连接的运行速度通常远低于其广告的最大速度。\n\
  \n  此外，电缆和 DSL 连接的下载数据速度远快于上传速度。因此，虽然你可能可以通过电缆连接以 100 Mbps 的速度下载数据，但上传数据能超过 7 或\
  \ 8 Mbps 就已经很幸运的了。\n\n- **商业级电缆：** 电缆电视供应商（如 Comcast）在其电缆网络上提供商业级服务。价格和速度取决于你所在的地区。例如，在我居住的地方，我可以以每月约\
  \ 400 美元的价格获得 100 Mbps 服务。\n\n  与住宅电缆一样，商业级电缆的上传速度通常远慢于下载速度。例如，一个允许 100 Mbps 下载的典型计划只能支持\
  \ 10 Mbps 上传。因此，如果你需要上传大量数据，你会发现性能下降。\n\n  商业级电缆服务的另一个缺点是，怎么说呢，它就是电缆服务。你的互联网连接是由为你社区提供电缆电视服务的人员提供的。虽然商业级客户比住宅客户享有优先服务，但商业级服务通常不包含\
  \ T1/T3 或光纤服务那样的响应时间保证。因此，如果你的连接中断，你可能会发现停机几小时甚至几天，而不是几分钟，最坏的情况下是几小时。\n\n- **光纤：**\
  \ 最快、最可靠且最贵的互联网连接形式是光纤。光纤使用玻璃纤维通过光信号以极快的速度传输数据。由于在光纤内部传输的光信号不受电磁干扰的影响，光纤连接极其可靠；唯一能中断光纤连接的可能是有人物理上切断了线。\n\
  \n  光纤可能也非常贵。在某些地区，100 Mbps 的光纤连接每月可能超过 1000 美元。然而，这种连接非常可靠，故障响应时间以分钟而非小时计算。而且随着光纤运营商继续扩大网络，价格正在下降。\n\
  \n- **无线提供商：** 在没有有线服务（如电缆或光纤）的地区，你可能找到无线服务，通过蜂窝或其他无线技术提供互联网访问。\n\n### 共享互联网连接\n\
  \n在你选择了连接互联网的方法后，可以将注意力转向设置连接，以便网络上的多个用户可以共享它。实现这一点的最佳方法是使用一种称为路由器的独立设备。你可以花费不到\
  \ 75 美元为小型网络购买一个便宜的路由器。适用于大型网络的路由器自然会贵一些。\n\n由于网络和互联网之间的所有通信都通过路由器，因此路由器是提供必要的安全措施的场所，以保护你的网络免受许多许多危害。因此，用于互联网连接的路由器通常兼任防火墙，正如本章稍后的“使用防火墙”节所述。\n\
  \n### 使用防火墙保护你的连接\n\n如果你的网络连接到互联网，一系列安全问题就会浮出水。你可能将网络连接到互联网是为了让网络用户能够访问互联网。遗憾的是，你的互联网连接是双向的。它不仅允许你的网络用户跨越网络边界去访问互联网，还允许他人进入并访问你的网络。\n\
  \n而且他们确实会进入。世界上充斥着寻找像你这样的网络进行入侵的黑客。他们这样做可能只是好玩，也可能是为了窃取你客户的信用卡号，或者强迫你的邮件服务器代表坏人发送成千上万封垃圾邮件。无论他们的动机是什么，请放心，如果你不采取保护措施，你的网络会被入侵。\n\
  \n\n\n\n\n`firewall` 是一种具有安全意识的路由器，位于互联网和你的网络之间，其唯一任务是：防止它们进入我们的系统。`firewall` 充当互联网与你的局域网（LAN）之间的安全守员。所有进出局域网的网络流量必须通过\
  \ `firewall`，这可以防止对网络未经授权的访问。\n\n![Warning](img/warning.png) 只要你的网络连接到互联网，无论该连接是宽带（电缆调制解调器或\
  \ DSL）、T1 还是其他高速连接，某种类型的 `firewall` 都是必不可少的。如果没有它，黑客早晚会发现你未受保护的网络并告诉他的朋友，在几小时内，你的网络就会完蛋完了。\n\
  \n你可以通过两种基本方式设置 `firewall`：\n\n*   **防火墙设备（Firewall appliance）：** 最简单的方法，通常也是最佳选择。`firewall\
  \ appliance` 基本上是一个集成了内置防火墙功能的独立路由器。大多数 `firewall appliances` 均包含基于 Web 的界面，允许你通过浏览器从网络上的任何计算机连接到\
  \ `firewall`。然后你可以根据需要自定义 `firewall` 设置。\n*   **服务器计算机（Server computer）：** 可以配置为防火墙计算机使用。服务器可以运行几乎任何网络操作系统，但大多数专用的防火墙系统运行\
  \ Linux。\n\n无论你使用 `firewall appliance` 还是 `firewall computer`，`firewall` 都必须位于你的网络和互联网之间，如图图\
  \ 9-1\n\nFIGURE 9-1: 防火墙路由器在网络和互联网之间建立安全链接。\n\n`perimeter`（边界）一词有时用于描述 `firewall`\
  \ 在你网络上的位置。简而言之，`firewall` 就像一道完全包围你物业的边界围栏，强制所有访客从正门进入。\n\n![Warning](img/warning.png)\
  \ 在大型网络中，确定 `perimeter` 的准确位置可能有点困难。如果你的网络有两个或多个互联网连接，请确保这些连接每一个都连接到 `firewall`，而不是直接连接到网络。你可以通过为每个互联网连接提供单独的\
  \ `firewall` 或使用具有多个互联网端口的 `firewall` 来实现。\n\n![Tip](img/tip.png) 某些 `firewall routers`\
  \ 还可以为你的网络执行病毒保护。有关病毒保护的更多信息，请参阅第 20 章。\n\n#### 家用网关与防火墙路由器\n\n如果你浏览当地大型电子产品店的货架，你会看到各种被称为\
  \ `Wi-Fi routers` 的设备。从技术上讲，这些设备实际上被称为 `residential gateways`（家用网关），因为它们提供的不仅仅是\
  \ Wi-Fi 功能。`residential gateway` 通常在一个方便的组合中结合四个不同的组件：\n\n*   一个可以将小型网络连接到互联网的 `router`。\n\
  *   一个保护内部网络免受想要入侵你网络的黑客攻击的 `firewall`。\n*   一个小型 `switch`（通常有四个端口），用于将几台计算机连接到网络。如果你有四个以上的用户，可以将一个较大的\
  \ `switch` 连接到网关的一个交换机端口上。（有关交换机的更多信息，请参阅第 7 章。）\n*   一个无线接入点（Wireless Access Point），允许无线设备连接。（有关无线访问的更多信息，请参阅第\
  \ 8 章。）\n\n`residential gateways` 适用于家庭网络或非常小的公司。然而，如果你的网络有十多台计算机，你应该考虑升级到专用的 `firewall\
  \ router`，它将防火墙和路由器功能与交换及 Wi-Fi 功能隔离开。\n\n真正的 `firewall router` 只有两种端口：\n\n*   广域网\
  \ (WAN) 端口，将 `firewall router` 连接到互联网\n*   局域网 (LAN) 端口，将 `firewall router` 连接到你的内部网络\n\
  \n某些 `firewall routers` 包含多个 WAN 端口，允许你连接到两个独立的互联网连接。有关此功能的更多信息，请参阅本章后面的“提供备份互联网连接”部分。\n\
  \n#### 查看内置 Windows 防火墙\n\nWindows 包含一个内置防火墙，提供基本的数据包过滤防火保护。在大多数情况下，使用专用的 `firewall\
  \ router` 更好，因为这些设备提供的安全功能比 Windows 内置防火墙更好。尽管如此，内置防火墙适用于家庭网络或非常小的办公室网络。\n\n以下是激活\
  \ Windows 内防火墙的步骤：\n\n1.  **打开控制面板。**\n2.  **点击系统和安全链接。** 出现系统和安全页面。\n3.  **点击 Windows\
  \ 防火墙链接。** 出现 Windows 防火墙页面。\n4.  **点击启用或关闭 Windows 防火墙链接。** 显示图 9-2 所示的页面。\n\n\
  ![激活 Windows 防火墙的快照](img/9781119648505-fg002.png)\n\nFIGURE 9-2: 激活防火墙。\n\n5.  **选择启用\
  \ Windows 防火墙选项。** 注意，你可以独立地为公共网络（即连接到互联网的连接）和家庭或工作网络（即如果你有连接其他计算机的网络）启用或关闭防火墙。我建议你对两者都启用或对两者都关闭。如果你正在使用连接你的计算机或工作网络到互联网的独立防火墙，请关闭防火墙。如果你没有独立的防火墙，则请启用防火墙。我还建议启用“当防火墙阻止新程序时通知我”选项。这样当防火墙阻止可疑程序时，你会收到通知。\n\
  6.  **点击确定。** 防火墙已启用。\n\n注意，Windows 防火墙包含一些可以配置的额外选项。然而，除非你上过大学高级计算机安全课程，否则我不建议动用这些选项。\n\
  \n![Warning](img/warning.png) 如果你使用独立的防火墙路由器来保护网络，请*不要*启用 Windows 防火墙。因为网络上的其他计算机直接连接到路由器而不是你的计算机，Windows\
  \ 防火墙无法保护网络的其余部分。此外，作为一个不希望的副作用，网络的其余部分将失去访问你计算机的能力。\n\n## 提供备份互联网连接\n\n对于大多数企业来说，可靠的互联网连接至关重要。考虑失去互联网连接的后果：\n\
  \n*   **所有电子邮件停止流动。** 你的用户无法发送也无法接收电子邮件。客户、和其他业务伙伴无法与你通信。\n*   **访问网页停止。** 你的用户无法访问任何网站。如果你订阅了任何关键的\
  \ Web 服务，例如会议网站（如 GoToMeeting 或 Zoom）、在线银行或其他关键服务，当你的互联网线路中断时，这些服务将无法使用。\n*   **如果你使用基于\
  \ IP 的电话服务（如 RingCentral 或 8x8），你的电话将无法工作。**\n\n\n\n\n\n- 如果你将数据存储在云端（例如 OneDrive、Dropbox\
  \ 或 Google Drive），那么你可能无法访问你的数据。\n\n简而言之，如果没有互联网，你的业务可能会陷入停滞。\n\n出于这个原因，提供不仅仅是一个互联网连接，而是两个连接是明智的做法。你可以配置防火墙路由器，在主连接失败时自动切换到备用互联网线路。这种功能被称为\
  \ `failover`（故障备转移），在大多数专用防火墙路由器设备中都可用。（注意，故障备转移通常在家用网关，即常见的 Wi-Fi 路由器上可用。）\n\n\
  ![Tip](img/tip.png) 在大多数情况下，你可以使用速度较慢的互联网连接作为备份连接。例如，如果你的主互联网连接是 1 Gbps 的光纤连接，你可以使用\
  \ 100 Mbps 的电缆连接作为备份。如果主线路中断，性能将明显变慢，但至少你仍然保持连接状态。\n\n在选择备份互联网连接时，通常最好使用与提供主连接的**不同的供应商。这样，如果你的主连接提供商发生系统性故障，该故障不太可能影响到你的备份连接。\n\
  \n一个常见的场景是使用蜂窝网络作为你的备份连接。名为 CradlePoint ([`www.cradlepoint.com`](http://www.cradlepoint.com))\
  \ 的公司提供了几种专门为此目的设计的设备。例如，CradlePoint 的 `AER1600` 设备包括：\n\n- 五个以太网端口，每个端口都可以配置为互联网连接\
  \ (WAN) 或内部连接 (LAN)。\n- 两个 LTE 蜂窝调制解调器用于连接到手机运营商。你只需要为你选择的运营商提供一张 SIM 卡。（如果你愿意，可以提供两张\
  \ SIM 卡以提供两个备份手机运营商。）\n\n提供备份互联网线路有许多选择。没有任何是不免费的，但请将其成本与完全没有互联网连接的成本进行比较。对于大多数企业来说，每月支付少量额外费用以确保互联网始终可用是值得的。\n\
  \n# 第三部分\n\n## 与服务器协作\n\n在本部分中……\n\n- 设置虚拟服务器。\n- 安装并配置 `Windows Server 2019`。\n\
  - 理解并使用 `Active Directory`（活动目录）用户账户。\n- 管理网络上的存储。\n\n# 第 10 章\n\n## 网络虚拟化\n\n在本章中\n\
  \n- ![Bullet](img/check.png) 探讨虚拟化的基础\n- ![Bullet](img/check.png) 权衡虚拟化的优势\n- ![Bullet](img/check.png)\
  \ 查看虚拟机视器（Hypervisor）的功能\n- ![Bullet](img/check.png) 考虑磁盘和网络是如何虚拟化的\n- ![Bullet](img/check.png)\
  \ 激活 Hyper-V\n- ![Bullet](img/check.png) 创建和使用虚拟机\n\n虚拟化是当今网络领域最热门趋势之一。根据一些行业人士的说法，虚拟化是晶体管发明以来计算机领域发生的最好的事件。如果你还没有开始虚拟化你的网络，你正站在站台上看着火车离站。\n\
  \n本章对虚拟化进行了简要介绍，重点是利用它来发挥你的网络服务器硬件，用更少的硬件提供更多的服务器。除了虚拟化的通用概念外，还将了解如何通过激活微软的 `Hyper-V`（Windows\
  \ 自带的免费虚拟化产品）来尝试虚拟化。\n\n### 理解虚拟化\n\n虚拟化的基本思想是使用软件来模拟硬件的存在。这种强大的思想让你能够在单台物理计算机系统上运行多个独立的计算机系统。假设你的组织总共需要\
  \ 12 台服务器来满足其需求。你可以将这 12 台服务器中的每一台都运行在单独的计算机，这样你的服务器机房里就有 12 台计算机；或者你可以使用虚拟化将这 12\
  \ 台服务器运行在仅 2 台计算机上。实际上，每台计算机都会模拟 6 个独立的计算机系统，每个系统运行你的其中一台服务器。\n\n每个模拟的计算机被称为 `virtual\
  \ machine`（虚拟机`）。从任何角度来看，每台虚拟机看起来都像是一个完整的、自包含的计算机系统，拥有自己的处理器（或更可能是多个处理器）、内存、磁盘驱动器、CD-ROM/DVD\
  \ 驱动器、键盘、鼠标、显示器、网络接口、USB 端口等。\n\n和真实的计算机一样，每台虚拟机都需要操作系统来开展有效工作。在典型的网络服务器环境中，每台虚拟机都运行自己的\
  \ `Windows Server` 副本。操作系统并不知道自己运行在虚拟机上而不是真实机器上。\n\n如果你希望能够明智地讨论虚拟化，需要熟悉以下几个术语：\n\
  \n- **主机（Host）**：运行一个或多个虚拟机的实际物理计算机。\n- **裸机（Bare metal）**：运行一个或多个虚拟机的主机的另一种术语。\n\
  - **客户（Guest）**：运行在主机上的虚拟机的另一种术语。\n- **客户操作系统（Guest operating system）**：运行在虚拟机内的操作系统。虚拟机本身只是一台机器；它需要操作系统才能运行。客户操作系统让虚拟机拥有了生命。\n\
  \n![Warning](img/warning.png) 在许可方面，微软将每台虚拟机视为一台独立的计算机。因此，如果你在一台主机上运行 6 个客户，且每个客户都运行\
  \ `Windows Server`，那么你需要 6 份 `Windows Server` 许可。\n- **虚拟机视器（Hypervisor）**：创建和运行虚拟机的虚拟化操作系统。有关关于虚拟机视器的更多信息，请阅读下一节，“理解虚拟机视器]”。\n\
  - **硬件抽象层（HAL）**：一种充当中间人将实际硬件与其交互的软件分离的软件层。操作系统提供 HAL，因为它使用设备驱动程序与实际硬件通信，以便运行在操作系统中的软件无需知道与其交互的设备细节。虚拟机视器也提供\
  \ HAL，使虚拟机中的客户操作系统能够与虚拟化硬件进行交互。\n\n### 理解虚拟机视器\n\n虚拟化的核心是 `hypervisor`（虚拟机视器），这是一种管理创建和运行虚拟机的软件层。虚拟机视器提供几个核心功能：\n\
  \n- 它提供 HAL，将其运行的主机硬件资源虚拟化。这包括处理器核心、内存和 I/O 设备（如磁盘驱动器、键盘、鼠标、显示器、USB 设备等）。\n- 它创建硬件资源池，并分配给虚拟机。\n\
  - 它创建虚拟机。虚拟机是理想化计算机系统的完整实现，可以使用可用硬件资源。每台虚拟机的硬件从虚拟机视器管理的可用硬件池中提取。\n- 它管理虚拟机的执行，根据需要为虚拟机分配主机硬件资源，并根据用户启动和停止虚拟机。\n\
  - 它确保每台虚拟机与其他虚拟机完全隔离，这样如果某台虚拟机出现问题，就不会影响其他所有虚拟机。\n- 它管理虚拟机通过虚拟网络进行通信，允许虚拟机相互连接，并与超出主机范围的物理网络连接。\n\
  \n你应该了解两种基本类型的虚拟机视器：\n\n\n\n\n\n- **第 1 型（Type-1）：** 第 1 型虚拟机管理器直接运行在宿主机计算机上，中间没有操作系统。这是效率最高的一种虚拟机管理器类型，因为它可以直接访问宿主系统的硬件资源。\n\
  两个广为人知的第 1 型虚拟机管理器示例是 VMware 的 `ESXi` 和微软的 `Hyper-V`。`ESXi` 是 VMware 流行虚拟化产品包的一部分，而\
  \ `Hyper-V` 是包含在最新版本 Windows Server 中的内置虚拟化平台。\n\n- **第 2 型（Type-2）：** 第 2 型虚拟机管理器作为应用程序运行在直接运行于宿主机计算机上的操作系统中。第\
  \ 2 型虚拟机管理器的效率低于第 1 型，因为当你使用第 2 型虚拟机管理器时，你额外增加了一个硬件抽象层——第一层由在宿主机上原生运行的操作系统提供，第二层由在宿主机操作系统上作为程序运行的虚拟机提供。\n\
  \n![Tip](img/tip.png) 对于生产环境，您应该始终使用第 1 型虚拟机管理器，因为它们比第 2 型效率高得多。然而，第 1 型虚拟机管理器的费用明显高于第\
  \ 2 型。因此，许多人使用廉价或免费的第 2 型虚拟机管理器在决定购买昂贵的第 1 型虚拟机管理器之前进行虚拟化实验。\n\n## 理解虚拟磁盘\n\n在虚拟环境中，计算机并不是唯一虚拟化的对象。除了创建虚拟计算机之外，虚拟化还会创建虚拟磁盘存储。磁盘虚拟化允许您将各种物理磁盘存储设备组合，创建磁盘存储池，然后根据需要将它们分配给您的虚拟机。\n\
  \n磁盘存储的虚拟化并非新鲜事。事实上，在实际的存储环境中实际上涉及多个层虚拟化。最底层是真实的物理磁盘驱动器。物理磁盘驱动器通常被组合成单个驱动器的阵列。这种组合是一种虚拟化，因为它创建了一个实际上并不存在的单一磁盘驱动器的映像。例如，四个\
  \ 2TB 的磁盘驱动器可能会组合在一个阵列中形成单个 8TB 的磁盘驱动器。\n\n注意，磁盘阵列通常通过冗余提供数据保护。这通常被称为 `RAID`，全称为“冗余磁盘阵列”（redundant\
  \ array of inexpensive disks）。\n\nRAID 的一种常见形式是 `RAID-10`，它允许您创建磁盘镜像对，使数据始终写入镜像对中的两个驱动器。因此，如果镜像对中的一个驱动器发生故障，另一个驱动器可以承担负载。使用\
  \ `RAID-10`，整个阵列的可用容量等于阵列中驱动器总容量的一半。例如，一个由四个 2TB 驱动器组成的 `RAID-10` 阵列包含两对镜像的 2TB\
  \ 磁盘驱动器，总可用容量为 4TB。\n\n另一种常见的 RAID 形式是 `RAID-5`，其中磁盘驱动器被组合在一起，组中的一个驱动器用于冗余。那么，如果阵列中的任何一个驱动器损坏，剩余的驱动器可以用来重新创建故障驱动器上的数据。`RAID-5`\
  \ 阵列的总容量等于所有单个驱动器容量之和减去一个驱动器的容量。例如，在 `RAID-5` 配置下，四个 2TB 驱动器组成的阵列总可用容量为 6TB。\n\n\
  在典型的虚拟环境中，宿主机计算机可以通过几种不同的方式连接到磁盘存储：\n\n- **本地磁盘存储：** 在本地磁盘存储中，磁盘驱动器直接挂载在宿主机计算机上，并通过其内部磁盘驱动器控制器连接到宿主机。例如，宿主机计算机可能在与计算机本身相同的机箱内挂载四个\
  \ 1TB 的磁盘驱动器。这四个驱动器可能被用于形成一个可用容量为 2TB 的 `RAID-10` 阵列。\n本地磁盘存储的主要缺点是它受限于宿主机的物理容量，并且仅安装在其上的宿主机可用。\n\
  \n- **存储区域网络（SAN）：** 在 `SAN` 中，磁盘驱动器包含在一个独立的设备中，该设备通过高速控制器连接到宿主机。`SAN` 与本地存储的区别在于\
  \ `SAN` 是一个独立的设备。它到宿主机高速连接通常与本地磁盘存储的内部连接一样快，但 `SAN` 包含一个负责管理磁盘驱动器的独立存储控制器。典型的 `SAN`\
  \ 可以容纳几十或多个磁盘驱动器，并允许与多个宿主机建立高速连接。`SAN` 通常可以通过添加一个或多个扩展机箱来扩展，每个机箱可以包含几十或多个磁盘驱动器。因此，单个\
  \ `SAN` 可以管理数百 TB 的磁盘数据。\n\n- **网络附属存储（NAS）：** 这种存储类型与 `SAN` 类似，但它不是通过高速控制器连接到宿主机，而是通过标准的以太网连接和\
  \ `TCP/IP` 连接到宿主机计算机。`NAS` 是所有磁盘存储形式中最便宜的，但也是慢的。\n\n无论存储如何连接到宿主机，虚拟机管理器都会整合其存储并创建磁盘存储池，通常称为“数据存储”（data\
  \ stores）。例如，访问三个 2TB `RAID-5` 磁盘阵列的虚拟机管理器可以将它们合并以创建一个单一的 6TB 数据存储。\n\n从此数据存储中，您可以创建“卷”（volumes），它们本质上是可以分配给特定虚拟机的虚拟磁盘驱动器。然后，当虚拟机中安装操作系统时，操作系统可以挂载虚拟机的卷以创建操作系统可以访问的驱动器。\n\
  \n例如，考虑一个运行 Windows Server 的虚拟机。如果您连接到该虚拟机、登录并使用 Windows 资源管理器查看可用的磁盘存储，您可能会看到一个容量为\
  \ 100GB 的 `C:` 盘。该 `C:` 盘实际上是由虚拟机管理器创建并挂载到虚拟机的 100GB 卷。该 100GB 卷反过来是从数据存储中分配的，数据存储的大小可能为\
  \ 4TB。该数据存储由连接到宿主机的 `SAN` 中包含的磁盘存储创建，该 `SAN` 可能由四个 2TB 物理磁盘驱动器组成的 `RAID-10` 阵列组成。\n\
  \n因此，您可以看到要让物理磁盘驱动器上的原始存储对客户端操作系统可用，至少需要四层虚拟化：\n\n- 物理磁盘驱动器使用 `RAID-10` 聚合，以创建一个具有内置冗余的统一磁盘映像。`RAID-10`\
  \ 实际上即是第一层虚拟化。这一层完全由 `SAN` 管理。\n\n- `SAN` 上的可用存储被虚拟机管理器抽象化以创建“数据存储”（data stores）。这实际上是第二层虚拟化。\n\
  \n- 数据存储的一部分被用于创建“卷”（volumes），然后呈现给虚拟机。卷代表了第三层虚拟化。\n\n- 客户端操作系统看到的“卷”就像物理设备一样，可以进行挂载并格式化，以创建用户访问的可用磁盘存储。这是第四层虚拟化。\n\
  \n\n\n\n\n尽管这看起来非常复杂，但这些虚拟化层在存储管理方面为你极大的灵活性。你可以向 `SAN` 添加新的磁盘阵列，或向网络中添加新的 `NAS`，然后从它们创建新的数据存储，而不会影响现有的数据存储。卷可以从一个数据存储移动到另一个数据存储，而不会影响其所挂载的虚拟机。事实上，你可以即时增加卷的大小，虚拟机将立即看到磁盘驱动器存储容量的增加，甚至无需重启。\n\
  \n## 理解网络虚拟化\n\n当你在宿主机系统上创建一个或多个虚拟机时，你需要为这些虚拟机提供一种方式，使它们不仅能够相互通信，还能与你网络上的其他物理计算机进行通信。为了实现这种连接，你必须在虚拟化环境中创建一个`virtual\
  \ network`。虚拟网络将虚拟机相互连接，并连接到物理网络。\n\n要创建一个虚拟网络，你必须创建一个`virtual switch`，它通过主机的网络接口将虚拟机相互连接并连接到物理网络。就像物理交换机一样，虚拟交换机也有端口。当你创建一个虚拟交换机时，将该交换机连接到宿主机的一个或多个网络接口。然后，这些接口通过网线连接到物理交换机，从而有效地将虚拟交换机连接到物理网络。\n\
  \n然后，当你创建虚拟机时，将每个虚拟机连接到虚拟交换机上的一个端口。当所有虚拟机都连接到交换机后，`VMs` 就可以通过交换机相互通信。它们还可以通过宿主机网络接口的连接与物理网络上的设备进行通信。\n\
  \n## 观察虚拟化的优势\n\n你可能怀疑虚拟化是无效的，因为真实计算机在本质上比模拟计算机快。虽然真实计算机确实比模拟计算机快，但虚拟化技术已经如此先进，运行在虚拟化机器而非真实机器上的性能损耗仅为几个百分点。\n\
  \n虚拟化所带来的微小开销通常会被一个简单的事实所抵消：即使是使用最频繁的服务器，其大部分时间也都在闲置等待事情可做。事实上，许多服务器几乎`all` 时间都在无所事事。随着计算机变得越来越快，它们无所事事的时间就会更多。\n\
  \n虚拟化是充分利用这些闲置处理能力的绝佳方法。\n\n除了这种基础的效率优势外，虚拟化还有几个极具吸引力的优势：\n\n*   **硬件成本**：使用虚拟化时，通过减少硬件成本你通常可以节省大量资金。假设你用一台主机服务器替换十台每台\
  \ 4,000 美元的服务器。诚然，你在这台服务器上的花费可能会超过 4,000 美元，因为它需要配置顶级内存、处理器核心、网络接口等。所以你最终可能会为这台主机服务器花费\
  \ 10,000 美元或 15,000 美元。此外，你还需要花费大约 5,000 美元购买`hypervisor`软件。但这远于你购买十台每台 4,000 美元的独立计算机的总花费（40,000\
  \ 美元）。\n*   **能源成本**：许多机构发现，转向虚拟化使其服务器计算机的总用电量减少了 80%。这种节省是使用更少的计算机硬件完成更多工作的直接结果。运行十台虚拟服务器的一台主机所使用的能量，大约是十台服务器分别运行在独立硬件上所需能量的十分。\n\
  *   **减少停机时间**：虚拟环境的停机时间通常比非虚拟环境更短。例如，假设你需要升级其中一台服务器计算机的`BIOS`。对于物理服务器，这种类型的升级通常要求你关闭运行在服务器上的操作系统，升级`BIOS`，然后重启服务器。在升级期间，服务器将不可用。\n\
  \    在虚拟环境中，你不需要关闭运行服务器的主机来升级该主机的`BIOS`。相反，你只需要将运行在需要升级的主机上的服务器移动到另一台主机。当服务器被移动时（此操作可以在不关闭的情况下完成），你就可以关闭主机并升级其`BIOS`。然后，在重启主机后，你可以将服务器移回主机——同样，无需关闭服务器。\n\
  *   **可恢复性**：虚拟化最大的优势之一不是成本成本，而是从硬件故障中快速恢复的能力。假设你的组织有十台服务器，每台服务器都运行在独立的硬件上。如果其中任何一台服务器由于硬件故障（例如，主板损坏）而宕机，该服务器将一直处于宕机状态，直到你能修复计算机。另一方面，如果这十台服务器作为虚拟机运行在两台不同的主机上，而其中一台主机发生故障，运行在故障主机上的虚拟机可以在几分钟内在另一台主机上启动。\n\
  \    诚然，服务器在单台主机上的运行效率会低于在两台主机上的效率，但点在于，它们在短暂的停机后就能全部恢复运行。\n    事实上，使用目前最先进的`hypervisors`，从故障主机到另一主机的迁移可以自动且瞬间完成，因此停机时间几乎被消除。\n\
  *   **灾难恢复**：除了硬件故障时的可恢复性优势外，虚拟化的更大优势在真正的灾难恢复情况下会发挥作用。假设你的组织的服务器架构由 20 台独立的服务器组成。在发生毁灭性灾难的情况下（例如机房火灾毁了所有硬件），你需要多久才能让这\
  \ 20 台服务器恢复运行？可能恢复时间将以周来计算。\n    相比之下，虚拟机实际上只是可以备份到磁带的文件。结果，在灾难恢复情况下，你所做的只是重建一台主机计算机并重新安装`hypervisor`软件。然后你可以从磁带恢复虚拟机备份，重启虚拟机，并在几天而非几周恢复运行。\n\
  \n## 选择虚拟化主机\n\n在决定虚拟化服务器后，你面临的是选择运行虚拟服务器的主机的任务。好消息是，你需要的服务器数量比使用物理服务器要少。坏消息是，你需要购买非常出色的服务器作为主机，因为每个主机将支持多个虚拟服务器。\n\
  \n**提示**：这里有一些入门建议：\n\n*   如果可能，请至少购买两台主机，并确保每台主机都能独立运行你所有的虚拟机。这样，如果其中一台主机发生故障，你可以将所有服务器临时移动到正常主机上，直到修复故障主机。当两台主机都正常后，你可以将负载分布在两台主机上获得更好的性能。\n\
  *   汇总你计划为每个服务器分配的内存总量来确定每台主机的`RAM`量。然后给自己留出充足的缓冲。如果你的服务器总共需要 50GB `RAM`，请为每台主机配备\
  \ 72GB，如果你有两台主机，总共就是 144GB。这将为你的增长提供充足的空间。\n\n\n\n\n\n*   **对处理器核心进行类似的计算。** 在主机上过度分配（overubscribe）处理器核心比过度分配内存要容易得多。像大多数计算机一样，服务器的大部分时间都处于空闲状态。虚拟化让大量服务器能够高效利用处理器核心。\n\
  *   **获取你能负担得起的最佳网络连接。** 理想情况下，每个主机都应该有一对小型可热插拔（SFP）端口，你可以在上面运行 10Gb 光纤。这样，你的主机就能以最高速度与核心交换机进行通信。\n\
  *   **为主机的子组件提供冗余。** 大多数主机支持两个处理器、两个内存库、两个网络接口和两个电源。这可以确保最长的运行时间。\n\n## 理解 Windows\
  \ Server 2019 许可\n\n在规划服务器架构时，你可能需要考虑到，你必须购买足够的 Windows Server 许可来覆盖你运行的所有服务器。在虚拟化之前，这很容易：每台服务器都需要自己的许可。有了虚拟化，情况变得复杂了——而且微软并没有通过简化流程来让它变得更容易。\n\
  \nWindows Server 2019 提供三个版本。这些版本如下：\n\n*   **标准版 (Standard Edition)：** 适合未进行虚拟化或虚拟化但服务器数量较少（每台主机约\
  \ 12 台）的客户。标准版每个许可的价格为 972 美元。每个许可允许你运行两个虚拟机，这看起来像是一个非常划算的交易。然而，一个主要的缺点是，该许可还限于每个处理器最多\
  \ 8 个核心、两个处理器的主机，总共 16 个核心。如果你的主机每个处理器超过 8 个核心或有超过两个处理器，你就需要额外的许可。\n*   **数据中心版\
  \ (Datacenter Edition)：** 适合已虚拟化且拥有大量服务器的客户。数据中心版每个许可的价格为 6,155 美元。每个许可允许你在单个主机上运行无限数量的虚拟机。同样，每个许可限制为每个处理器\
  \ 8 个核心、两个处理器，总共 16 个核心。如果你的主机每个处理器超过 8 个核心或超过两个处理器，你就需要额外的许可。\n*   **基础版 (Essentials\
  \ Edition)：** 专为建立第一台服务器的小企业设计。它仅限于 25 个用户。我在这里不再进一步考虑这个版本。\n\n所以，你必须进行一些实际计算来确定你需要哪些许可。假设你需要在两台主机上共运行\
  \ 16 台服务器。以下是两种允许的许可方案：\n\n*   购买 8 个标准版许可，总计 7,776 美元。这平均每台服务器仅 486 美元。只要你的主机每个核心少于\
  \ 8 个处理器且每台主机少于两个处理器，这些许可将允许你运行 16 个虚拟机（每个许可两个）。如果你的主机超过了该限制——例如，每个核心 12 个处理器，你需要购买\
  \ 16 个标准版许可，总计 15,552 美元，平均每台服务器 972 美元。\n*   购买 2 个数据中心版许可，总计 12,310 美元。平均每台服务器约为\
  \ 769 美元。这比标准版许可贵，但它允许你运行无限数量的服务器。相比之下，额外的标准版服务器需要额外的许可。与标准版一样，如果你的主机每个处理器超过 8 个核心或每台主机两个处理器，你必须为每台主机购买额外的许可，总额将达到\
  \ 24,620 美元。平均每台服务器约为 1,539 美元。\n\n显然，微软对在更强大的主机上运行 Windows Server 收取的费用更高，这是一种有趣的定价策略。事实证明，在接下来的几年里，你很难买到低于每个处理器\
  \ 8 核或每台主机两个处理器的单许可限制的主机。这是因为英特尔双插槽 Xeon 处理器随着每一代的更新核心越来越多越来越多。当前代的 Xeon 处理器每个处理器支持高达\
  \ 18 个核心。英特尔仍然制造 4 核、6 核和 8 核版本的 Xeon 处理器，但谁知道未来会带来什么？\n\n无论如何，微软按核心计费的特性鼓励你购买核心数接近但低于每处理器\
  \ 8 核增量的主机处理器。换句话说，在你的主机中使用 8 核或 16 核处理器；避免使用 10 核或 18 核处理器，因为它们会让你恰好超过许可的核心限制。\n\
  \n## 介绍 Hyper-V\n\n虚拟化是一个复杂的课题，而精通诸如 VMware Infrastructure 这样功能完备虚拟化系统的细节已超出本书的范围。不过，你可以通过下载并尝试微软的免费虚拟化产品\
  \ Hyper-V 来接触虚拟化池的浅水。Hyper-V 自 Windows Server 2008 以来的所有服务器版本以及自 Windows 8 以来的所有桌面版本中都带有它。\n\
  \n带有 Windows 桌面版本的 Hyper-V 版本称为 Client Hyper-V。从 Client Hyper-V 开始的一个好处是，它与 Windows\
  \ Server 包含的企业级 Hyper-V 版本相似。你在桌面版 Windows 上学到的关于 Hyper-V 的大部分也适用于服务器版本。\n\n###\
  \ 理解 Hyper-V 虚拟机程序 (hypervisor)\n\n尽管 Hyper-V 构建在所有现代版本的 Windows 中，但它并不是作为 Windows\
  \ 内部应用程序运行的 2 类型虚拟机程序。相反，Hyper-V 是一个真正的 1 类型虚拟机程序，直接运行在主机计算机硬件上。即使是包含在桌面版 Windows\
  \ 中的 Hyper-V 版本也是如此。\n\n在 Hyper-V 中，每个虚拟机都运行在一个名为 `partition`（分区）的隔离空间内。每个分区都有访问其自己的处理器、内存、磁盘、网络和其他虚拟资源的权限。\n\
  \nHyper-V 中有两种类型的分区：`parent partition`（父分区）和一个或多个`child partitions`（子分区）。父分区是一个特殊分区，托管与\
  \ Hyper-V 关联的 Windows 操作系统。子分区托管你根据需要创建的额外虚拟机。\n\n当你激活 Hyper-V 功能时，虚拟机程序会被安装，现有的\
  \ Windows 操作系统会被移动到运行在父分区中的虚拟机中。然后，每当你启动主机计算机时，虚拟机程序就会加载，创建父分区，并在 Windows 在父分区内的虚拟机中启动。\n\
  \n尽管看起来虚拟机程序似乎运行在 Windows 内部，但实际上恰恰相反：Windows 运行在虚拟机程序内部。\n\n除了 Windows 操作系统外，父分区还运行允许管理虚拟机程序上虚拟机的软件。这包括创建新虚拟机、启动和停止虚拟机、更改分配给现有虚拟机的资源（例如添加更多处理器、内存或磁盘存储），以及将虚拟机从一台主机移动到另一台主机。\n\
  \n## 理解虚拟磁盘\n\n每个 Hyper-V 虚拟机必须至少关联一个虚拟磁盘。`virtual disk`（虚拟磁盘）仅仅是位于主机操作系统文件系统中的磁盘文件。该文件具有两种扩展名之一，取决于你为虚拟磁盘选择的两种数据格式之一：\n\
  \n*   `.vhd`：一种旧格式，虚拟磁盘最大尺寸为 2TB\n*   `.vhdx`：一种较新的格式，可以支持高达 64TB 的虚拟磁盘\n\n对于这两种虚拟磁盘格式，Hyper-V\
  \ 允许你创建两种不同类型的虚拟磁盘：\n\n\n\n\n\n- **固定大小磁盘：** 一种在创建磁盘时，其磁盘空间就会预先分配为驱动器完整大小的虚拟磁盘。例如，如果你使用\
  \ `.vhdx` 格式创建一个 100GB 的固定大小磁盘，则会为驱动器分配一个 100GB 的 `.vhdx` 文件。即使驱动器中仅包含 10GB 数据，它仍然会占用主机系统磁盘驱动器\
  \ 100GB 空间。\n- **动态扩展磁盘：** 一种虚拟磁盘有一个最大磁盘空间，但实际上仅消耗存储磁盘上数据所需的磁盘空间。例如，如果你创建一个最大空间为\
  \ 100GB 的动态扩展磁盘，但只在其中放入 10GB 数据，那么该磁盘的 `.vhdx` 文件将仅占用主机系统磁盘驱动器的 10GB 空间。\n\n![Tip](img/tip.png)\
  \ 不要被*固定大小*和*动态扩展*这些名称所误导。如果空间不足，这两种磁盘以后都可以进行扩展。主要的区别在于驱动器允许的最大磁盘空间是在驱动器首次创建时分配的，还是在向驱动器添加数据时按需分配的。在创建驱动器时分配空间会获得更好的性能，因为\
  \ Hyper-V 不需要在每次向驱动器添加数据时都获取更多磁盘空间。如有必要，两种驱动器以后都可以扩展。\n\n## 启用 Hyper-V\n\n在安装 Windows\
  \ 时，Hyper-V 不会自动启用；你必须在使用 Hyper-V 之前先启用此功能。\n\n要在 Windows 服务器版本上启用 Hyper-V，请调用服务器管理器并打开添加角色和功能向导。然后启用\
  \ Hyper-V 角色。完成向导后，Hyper-V 将安装第 1 型虚拟机程序并将现有 Windows Server 操作系统移动到父分区。然后你就可以开始构建虚拟机。\n\
  \n要在 Windows 桌面版本上启用 Hyper-V，请按照以下步骤操作：\n\n1. **打开控制面板。**\n2. **选择程序和功能。** 打开“程序和功能”窗口。\n\
  3. **点击启用或关闭 Windows 功能。** 打开“Windows 功能”对话框，如图 10-1 所示。\n4. **选择 Hyper-V 功能并点击确定。**\
  \ 客户端 Hyper-V 虚拟机程序将作为应用程序安装在现有的桌面 Windows 操作系统上，你可以开始使用 Hyper-V 了。\n5. **在提示时，重启电脑。**\
  \ 需要重启来启动 Hyper-V 虚拟机程序。当你的电脑重启时，启动的是 Hyper-V 虚拟机程序，而不是 Windows。随后，虚拟机程序会将你的桌面 Windows\
  \ 加载到父分区。\n\n![在 Windows 桌面版本上启用 Hyper-V 的截图。](img/9781119648505-fg1001.png)\nFIGURE\
  \ 10-1: 在 Windows 桌面版本上启用 Hyper-V。\n\n## 熟悉 Hyper-V\n\n要管理 Hyper-V，请使用 Hyper-V 管理器，如图\
  \ 10-2 所示。要启动此程序，点击开始按钮，输入 `Hyper-V`，然后选择 Hyper-V 管理器。\n\n![Hyper-V 管理器的截图。](img/9781119648505-fg1002.png)\n\
  FIGURE 10-2: Hyper-V 管理器。\n\nHyper-V 管理器窗口分为五个窗格：\n\n- **导航：** 窗口左侧是导航窗格，列出了 Hyper-V\
  \ 主机，Hyper-V 将其称为*虚拟化服务器*。在图 10-2 中，只列出了一个主机：我的 Windows 计算机。在拥有多个主机的企业环境中，每个主机都会列在此窗格中。\n\
  - **虚拟机：** 此窗格列出了为所选主机定义的虚拟机。在图 10-2 中，我目前为止只创建了一个虚拟机，名为 `VMWIN19-01`。\n- **检查点：**\
  \ 在 Hyper-V 中，*检查点*是虚拟机的恢复点。当你准备对虚拟机进行修改时，可以创建一个检查点。这样如果出现问题，你可以恢复到检查点。\n- **虚拟机摘要窗格：**\
  \ 检查点窗格下方是一个窗格，为“虚拟机”窗格中选定的虚拟机提供摘要信息。在图 10-2 中，你可以看到一台 Windows Server 2016 机器的摘要信息。此窗格有三个选项卡：摘要、内存网络。在图中，选择了内存选项卡，因此你可以看到分配给机器的内存。\n\
  - **操作：** 操作选项卡包含你可以点击的按钮，用于启动针对所选主机（`DOUG-2014-I`）和所选机器（`VMWIN19-01`）的操作。\n\n##\
  \ 创建虚拟交换机\n\n在 Hyper-V 中开始创建虚拟机之前，你应该创建一个虚拟交换机，以便你的虚拟机相互通信以及与外部通信。要实现这一点，你需要使用虚拟交换机管理器。以下是步骤：\n\
  \n1. **在 Hyper-V 管理器中，点击虚拟交换机管理器。** 这将打开虚拟交换机管理器窗口，如图 10-3 所示。\n2. **选择你要创建的虚拟交换机类型。**\
  \ Hyper-V 允许你创建三种类型的交换机：\n    - **外部：** 绑定到物理网络适配器的虚拟交换机，允许虚拟机相互通信，并与你物理网络上的其他计算机通信。这通常是你应该创建的交换机类型。\n\
  \    ![虚拟交换机管理器窗口的截图。](img/9781119648505-fg1003.png)\n    FIGURE 10-3: 虚拟交换机管理器窗口。\n\
  \    - **内部：** 不绑定物理网络适配器的虚拟交换机。这种类型的交换机允许此台计算机上的虚拟机相互通信并与主机计算机通信，但不能与物理网络上的其他计算机通信。\n\
  \    - **私有：** 允许虚拟机相互通信但不能与主机计算机或物理网络上的任何计算机通信的虚拟交换机。\n3. **点击创建虚拟交换机。** 显示新虚拟交换机的设置，如图\
  \ 10-4 所示。\n4. **在名称字段中为新虚拟交换机输入名称。** 使用任意名称。\n5. **选择要绑定到虚拟交换机的物理网络适配器。** 如果你的计算机有多个网络适配器，请选择要使用的一个。将虚拟交换机绑定到物理网络适配器允许虚拟机不仅相互通信，还可以通过你选择的适配器与其他计算机通信。\n\
  ![创建虚拟交换机的截图。](img/9781119648505-fg1004.png)\nFIGURE 10-4: 创建虚拟交换机。\n6. **如果你的网络有多个\
  \ VLAN，勾选启用操作系统的虚拟 标识并输入你想让交换机连接的 VLAN ID。** 如果你的网络没有多个 VLAN，可以跳过此步骤。\n7. **点击确定。**\
  \ 虚拟交换机已创建。你的 Hyper-V 环境现在已准备好虚拟网络，你可以开始创建虚拟机。\n\n## 创建虚拟磁盘\n\n在创建虚拟机之前，最好先为虚拟机创建一个虚拟磁盘。注意，你可以在创建虚拟机的同时创建虚拟磁盘。然而，先创建虚拟磁盘会给你提供更大的灵活性。因此，我建议单独创建虚拟磁盘和虚拟机。以下是创建虚拟磁盘的步骤：\n\
  \n1. **在 Hyper-V 管理器中，点击新建并选择硬盘。** 这将打开新建虚拟磁盘向导，如图 10-5 所示。\n![新建虚拟磁盘向导的截图。](img/9781119648505-fg1005.png)\n\
  \n\n\n\n\nFIGURE 10-5: 新建虚拟硬盘向导。\n\n2. **点击下一步。**\n\n系统会询问使用哪种磁盘格式，如图 10-6 所示。我建议你始终使用\
  \ `VHDX` 格式，它可以支持大于 2TB 的驱动器。\n\n![选择磁盘格式的截图。](img/9781119648505-fg1006.png)\n\n\
  FIGURE 10-6: 选择磁盘格式。\n\n3. **选择 VHDX，然后点击下一步。**\n\n当你点击下一步时，会显示“选择磁盘类型”页面，如图 10-7\
  \ 所示。\n\n![选择磁盘类型的截图。](img/9781119648505-fg1007.png)\n\nFIGURE 10-7: 选择你的磁盘类型。\n\
  \n4. **选择你想要使用的磁盘类型。**\n\n选项有固定大小（Fixed Size）、动态扩展（Dynamically Expanding）和差分（Differencing）。如果你担心磁盘性能，请选择固定大小；否则，选择动态扩展。\n\
  \n5. **点击下一步。**\n\n出现“指定名称和位置”页面，如图 10-8 所示。\n\n6. **指定新磁盘的名称和位置。**\n\n为虚拟硬盘驱动器输入你喜欢的任何名称。然后点击“浏览”按钮，浏览到你想让\
  \ Hyper-V 创建 `.vhdx` 文件的位置。\n\n![提示](img/tip.png) 确保选择的位置有足够的磁盘空间来创建 `.vhdx` 文件。如果你正在创建动态扩展磁盘，应确保该位置有足够的空间来容纳驱动器的增长。\n\
  \n7. **点击下一步。**\n\n出现“配置磁盘”页面，如图 10-9 所示。\n\n![指定磁盘名称和位置的截图。](img/9781119648505-fg1008.png)\n\
  \nFIGURE 10-8: 指定磁盘的名称和位置。\n\n![指定磁盘大小的截图。](img/9781119648505-fg1009.png)\n\nFIGURE\
  \ 10-9: 指定磁盘的大小。\n\n8. **为硬盘驱动器指定最大大小。**\n\n![提示](img/tip.png) 此页面还允许从现有的物理硬盘驱动器或现有的虚拟硬盘驱动器复制数据。从现有物理驱动器复制数据是将物理计算机转换为虚拟计算机快速方法；只需将物理磁盘复制到虚拟磁盘，然后使用新的虚拟磁盘作为新虚拟机的基础。\n\
  \n9. **点击下一步。**\n\n出现确认屏幕，总结了你为新磁盘选择的选项。\n\n10. **点击完成。**\n\n新磁盘已创建。注意，如果你选择了“固定磁盘”作为磁盘类型，创建磁盘可能需要一段时间，因为你指定的整个磁盘存储容量将分配给该磁盘。请耐心等待。\n\
  \n你完成了！你现在已经创建了一个可以作为新虚拟机基础的虚拟磁盘。\n\n## 创建虚拟机\n\n创建虚拟磁盘后，创建一个使用它的虚拟机是件非常直接的事。请按照以下步骤操作：\n\
  \n1. **在 Hyper-V 管理器中，选择“新建”，然后选择“虚拟机”。**\n\n这将调出“新建虚拟机向导”，如图 10-10 所示。\n\n![新建虚拟机向导的截图。](img/9781119648505-fg1010.png)\n\
  \nFIGURE 10-10: 欢迎使用新建虚拟机向导。\n\n2. **点击下一步。**\n\n出现“指定名称和位置”页面，如图 10-11 所示。\n\n\
  ![指定虚拟机名称和位置的截图。](img/9781119648505-fg1011.png)\n\nFIGURE 10-11: 指定虚拟机的名称和位置。\n\n\
  3. **输入你想要为虚拟机使用的名称。**\n\n你可以在此处选择任何喜欢的名称。\n\n4. **指定虚拟机配置文件的位置。**\n\n每个虚拟机都有一个关联的\
  \ `XML` 文件，用于定义配置。\n\n5. **点击下一步。**\n\n出现“指定代代”，如图 10-12 所示。\n\n6. **为虚拟机指定你想要使用的代代。**\n\
  \n在大多数情况下，你应该选择第 2 代。如果客户操作系统早于 Windows，请使用第 1 代。\n\n7. **点击下一步。**\n\n出现“分配内存”，如图\
  \ 10-13 所示。\n\n8. **指示你想要为虚拟机分配的 RAM 数量。**\n\n默认值为 `2048MB`，但你几乎肯定想要增加它。我还建议你勾选“为此虚拟机使用动态内存”复选框。\n\
  \n9. **点击下一步。**\n\n出现“配置网络”页面，如图 10-14 所示。\n\n10. **选择你想为虚拟机使用的虚拟交换机。**\n\n11. **点击下一步。**\n\
  \n出现“连接虚拟磁盘”页面，如图 10-15 所示。\n\n12. **假设你已经创建了虚拟磁盘，选择“使用现有虚拟磁盘”选项。**\n\n如果你尚未创建虚拟磁盘，可以使用“创建虚拟硬盘”选项来创建一个。\n\
  \n13. **点击下一步。**\n\n显示摘要页面，列出了你所做的选择。\n\n14. **点击完成。**\n\n虚拟机已创建。\n\n![连接虚拟磁盘的截图。](img/9781119648505-fg1015.png)\n\
  \nFIGURE 10-15: 连接虚拟磁盘。\n\n## 安装操作系统\n\n创建虚拟机后，下一步是配置它以安装操作系统。首先，你需要获取 `.iso` 文件格式的安装媒体。准备好\
  \ `.iso` 文件后，请按照以下步骤操作：\n\n1. **在 Hyper-V 管理器中，选择该虚拟机并点击“设置”。**\n\n出现“设置”对话框，如图\
  \ 10-16 所示。\n\n2. **在硬件列表中点击“SCSI 控制器”。然后选择“DVD 驱动器”，并点击“添加”。**\n\n出现如图 10-17 所示的配置页面。\n\
  \n3. **点击映像文件选项，点击“浏览”，选择包含操作系统安装程序的 `.iso` 文件。**\n\n4. **点击“确定”。**\n\n你回到 Hyper-V\
  \ 管理器屏幕。\n\n![编辑虚拟机设置的截图。](img/9781119648505-fg1016.png)\n\nFIGURE 10-16: 编辑虚拟机的设置。\n\
  \n\n\n\n\nFIGURE 10-17: 配置 DVD 驱动器。\n\n5. **在仍选中新虚拟机的情况下，点击连接（Connect）。**\n\n打开一个控制台窗口，显示虚拟机当前已关闭（参见图\
  \ 10-18）。\n\n![通过控制台查看虚拟机的快照](img/9781119648505-fg1018.png)\n\nFIGURE 10-18: 通过控制台查看虚拟机。\n\
  \n6. **点击连接（Connect）。**\n\n7. **点击启动（Start）。**\n\n虚拟机启动电源。\n\n8. **当提示按任意键从 CD 或\
  \ DVD 启动时，按任意键。**\n\n操作系统的安装程序开始运行。\n\n9. **按照安装程序的说明安装操作系统。**\n\n就是这些了。你现在已经成功创建了一个\
  \ Hyper-V 虚拟机！\n\n# 第 11 章\n\n## 设置 Windows Server\n\n本章内容\n\n* ![Bullet](img/check.png)\
  \ **规划 Windows Server 2019 部署**\n* ![Bullet](img/check.png) **安装 Windows Server\
  \ 2019**\n* ![Bullet](img/check.png) **配置 Active Directory 并创建新域**\n\n本章介绍了你在安装\
  \ Windows Server 时需要遵循的程序——特别是 Windows Server 2019。请注意，虽然提供的特定细节是针对 Windows Server\
  \ 2019 的，但安装之前的版本非常相似。因此，如果你正在安装旧版本，在适应这些程序时不会遇到困难。\n\n在本章中，我从开始就提出了两个重要的假设。首先，我假设你正在虚拟机上安装服务器。直接在物理硬件上安装服务器的程序类似，只不过安装介质是\
  \ DVD 光盘而不是 ISO 磁盘镜像。\n\n其次，我假设你正将 Windows Server 2019 安装到全新的虚拟机中，而不是尝试升级一个已经运行之前的版本\
  \ Windows Server 2019 的现有虚拟机。虽然可以将之前的 Windows Server 版本升级到 2019，但我通常不建议这样做，因为可能会出现很多问题。\n\
  \n## 规划 Windows Server 安装\n\n在开始运行安装程序实际安装 Windows Server 操作系统之前，你需要做出若干初步决定，如下文节节所示。\n\
  \n### 检查系统要求\n\n在安装 Windows Server 操作系统之前，你应该确保计算机符合最低要求。表 11-1 列出了 Windows Server\
  \ 2019 的官方最低要求。（Windows Server 2012 的最低要求是相同的）。表 11-1 还列出了我认为如果你期望服务器作为中度使用的文件服务器获得满意性能，那么更符合现实的最低要求。\n\
  \n| 项目 | 官方最低要求 | 更现实的最低要求 |\n| --- | --- | --- |\n| CPU | 1.4 GHz | 3 GHz |\n|\
  \ RAM | 2GB* | 4GB |\n| 空闲磁盘空间 | 32GB | 100GB |\n\n**从技术上讲，最小内存大小为 512MB。但如果你想安装桌面体验（Desktop\
  \ Experience）选项，则需要 2GB，该选项让你能够使用与 Windows 10 相同的 GUI 界面与 Windows Server 交互。除非你有丰富的\
  \ Windows Server 经验并且不在意在命令行环境中工作，否则我建议安装此选项。\n\n表 11-1 Windows Server 2019 最低硬件要求（标准版）\n\
  \n### 读取发布说明\n\n与所有版本的 Windows Server 一样，Windows Server 2019 提供了一系列发布说明，你在开始安装程序之前应该阅读它们，只需检查其中包含任何特定程序或警告是否适用于你的情况。\n\
  \n你可以在 `https://docs.microsoft.com/en-us/windows-server/get-started-19/rel-notes-19`\
  \ 获取发布说明。\n\n### 考虑你的许可选项\n\n运行 Windows Server 操作系统需要两种许可：*服务器许可（server license）*，它允许你运行单个服务器实例，以及*客户端访问许可（CALs）*，它允许用户或设备连接到服务器。当你购买\
  \ Windows Server 时，通常会购买一个服务器许可加上若干个 CAL。\n\n更复杂的是，CAL 有两种不同类型：按用户和按设备。*按用户（Per-user）*的\
  \ CAL 限制了同时访问服务器的用户数量，无论你组织中有多少设备（如客户端计算机）。相比之下，*按设备（per-device）*的 CAL 限制了可以访问服务器的唯一设备数量，无论你组织中有多少用户。\n\
  \n请注意，你可以在 `docs.microsoft.com/en-us/windows-server/get-started-19/windows-server-server`\
  \ 找到更多关于许可的信息。\n\n![Tip](img/tip.png) 如果你想跟进评估，请从 `microsoft.com/en-us/windows-server/evaluate/`\
  \ 下载。\n\n### 决定你的 TCP/IP 配置\n\n在安装操作系统之前，你应该有一个实施 TCP/IP 的计划。以下是你需要决定或查询的一些内容：\n\
  \n* 你的网络的 IP 地址和子掩码。\n* 你的网络的域名。\n* 服务器的主机名。\n* 服务器的静态 IP。（所有服务器都应该具有静态 IP。）\n*\
  \ 服务器是否将作为 DHCP 服务器。\n* 服务器的默认网关（即网络路由器的 IP 地址）。\n* 服务器是否将作为 DNS 服务器。\n\n关于规划 TCP/IP\
  \ 配置的更多信息，请参见第 5 章。\n\n### 选择工作组或域\n\n*域（domain）*是一种将用户帐户和各种网络资源置于单一目录数据库控制下的方法。域确保安全策略在整个网络中一致地应用，并极大地简化了大型网络上管理用户账户的任务。\n\
  \n*工作组（workgroup）*是网络上计算机的简单关联，可以轻松查找共享文件和打印机。工作组没有复杂的目录数据库，因此无法执行严格的安全策略。\n\n工作组应仅用于只有少数用户的微型网络。坦率地说，任何大到有运行\
  \ Windows Server 2019 的专用服务器的网络，都大到不能使用工作组了。因此，如果你正在安装 Windows 服务器，应该始终选择域。\n\n\
  决定使用域后，你必须做出两个基本决定：\n\n* 域名将是什么？如果你有一个互联网域名（例如 `mydomain.com`），你可能想将其作为网络的域名。否则，你可以任取任何名称。\n\
  * 哪些计算机将作为该域的域控制器？如果此服务器是域中的第一台服务器，你必须将其指定为域控制器并采取步骤创建域。如果你已经有一台作为域控制器的服务器，你可以将此计算机作为额外的域控制器，或者将其指定为成员服务器。\n\
  \n![Tip](img/tip.png) 如果网络需求发生变化，你可以将服务器的角色从域控制器更改为成员服务器，反之亦然。如果你的网络有多台服务器，最好至少创建两个域控制器。这样，如果其中一个故障了，另一个可以接管。\n\
  \n\n\n\n\n## 运行设置\n\n现在你已经规划了安装计划并准备好了计算机，可以运行设置（Setup）程序了。以下说明介绍了使用安装 DVD 的 ISO\
  \ 镜像在虚拟机上安装 Windows Server 2019 必须遵循的步骤。在开始此程序之前，你需要从微软网站下载 ISO 文件。此外，你应该设置好虚拟机并将\
  \ ISO 文件挂载到虚拟机的 DVD/CD 驱动器上。（要了解如何使用微软的 Hyper-V 设置虚拟机，请参阅第 10 章。）\n\n1. **按照你想要的规格配置新虚拟机，在虚拟\
  \ DVD 驱动器上挂载安装 ISO 文件，并启动虚拟机。**\n\n   片刻之后，Windows 安装向导就会启动，并询问你的语言、时间及货币格式以及键盘布局。\n\
  \n2. **点击下一步。**\n\n   出现欢迎界面，如图 11-1 所示。\n\n   ![Windows 安装欢迎页快照！](img/9781119648505-fg1101.png)\n\
  \n   FIGURE 11-1: 欢迎使用 Windows 安装！\n\n3. **点击现在安装。**\n\n   Windows 询问你想要安装哪个版本的操作系统，如图\
  \ 11-2 所示。\n\n   共有四个版本可用：\n\n   * `Windows Server 2019 Standard`：操作系统的精简版本，不具备图形用户界面（GUI）。你必须使用\
  \ `PowerShell` 或 Windows 管理控制台远程管理此版本的服务器。\n\n   * `Windows Server 2019 Standard\
  \ (Desktop Experience)`：这是你想要选择的版本，这样你将拥有一个模仿 Windows 10 模型的友好用户界面。\n\n   * `Windows\
  \ Server 2019 Datacenter`：Windows Server 的高性能版本，专为拥有大量服务器的大型数据中心设计。\n\n   * `Windows\
  \ Server 2019 Datacenter (Desktop Experience)`：数据中心版的 GUI 版本。\n\n   对于本书，我使用标准桌面体验版本来演示如何管理\
  \ Windows Server 2019 的各个方面。\n\n   ![选择要安装的操作系统版本的快照。](img/9781119648505-fg1102.png)\n\
  \n   FIGURE 11-2: 选择要安装的 OS 版本。\n\n4. **选择你想安装的版本，然后点击下一步。**\n\n   安装向导显示许可协议信息。如果你喜欢法律术语，请阅读它。\n\
  \n5. **点击我接受许可条款，然后点击下一步。**\n\n   安装向导询问你是想执行升级安装还是全新安装。\n\n6. **点击你想要使用的安装选项。**\n\
  \n   设置程序继续显示计算机上可用的磁盘驱动器，以便你选择安装 Windows 的位置，如图 11-3 所示。在示例中，只有一个驱动器，所以并没有真正的选择。\n\
  \n7. **选择你想要安装 Windows 的磁盘，然后点击下一步。**\n\n   设置程序会格式化驱动器，并将文件复制到新格式化的驱动器中。这一步通常需要一些时间。我建议你带上一部喜欢的书。从第\
  \ 1 章开始阅读。\n\n   所有文件复制完成后，设置程序将重启你的计算机。然后设置程序会检查计算机上的所有设备并安装任何必要的设备驱动程序。在此期间，你可以阅读书籍的第\
  \ 2 章。\n\n   当设置程序完成驱动程序安装时，它会要求你输入计算机管理员账户所需的密码，如图 11-4 所示。\n\n   ![决定安装 Windows\
  \ 的磁盘器的快照。](img/9781119648505-fg1103.png)\n\n   FIGURE 11-3: 决定安装 Windows 的位置。\n\
  \n   ![设置管理员用户名和密码的快照。](img/9781119648505-fg1104.png)\n\n   FIGURE 11-4: 设置管理员密码。\n\
  \n8. **两次输入管理员密码，然后点击完成。**\n\n   ![记住](img/remember.png) 必将此密码记录在某处并放在安全的地方。如果你丢失了此密码，将无法访问你的服务器。\n\
  \n   设置管理员密码后，Windows 将显示如图 11-5 所示的登录界面。\n\n   ![登录新服务器的快照。](img/9781119648505-fg1105.png)\n\
  \n   FIGURE 11-5: 登录新服务器。\n\n9. **使用管理员账户登录。**\n\n   当你登录后，Windows 显示服务器管理器，如图 11-6\
  \ 所示。具体而言，你可以：\n\n   * 点击 `添加角色和功能`添加角色。\n   * 点击 `其他服务器`来管理其他服务器。\n   * 点击 `本地服务器`进行配置。\n\
  \   * 点击 `云服务`进行集成。\n\n## 添加角色和功能\n\n*服务器角色*是服务器在网络中扮演的角色，例如文件服务器、Web 服务器或 DHCP\
  \ 服务器。*功能*是操作系统本身的附加能力，如 .NET Framework 或 Windows 备份。\n\n以下介绍了如何安装服务器角色。对于本示例，我们将安装`活动目录服务`和`DNS\
  \ 服务器`角色。这些角色对于创建域并将此服务器指定为域控制器所需的。\n\n1. **点击服务器管理器上的“添加角色和功能”。**\n\n   出现添加角色和功能向导，如图\
  \ 11-7 所示。\n\n2. **点击下一步。**\n\n   向导询问你想执行哪种安装类型。在大多数情况下，你应该保留默认选择（“基于角色”或“基于功能”）。只有当你配置远程虚拟机服务器时才选择备选项（“远程服务安装”）。\n\
  \n   ![角色和功能向导的快照。](img/9781119648505-fg1107.png)\n\n   FIGURE 11-7: 添加角色和功能向导。\n\
  \n3. **点击下一步。**\n\n   向导让你选择想要安装角色或功能的服务器，如图 11-8 所示。在示例中，只列出了一个服务器。如果你在服务器仪表板中通过“管理其他服务器”来添加其他服务器，这些服务器也会出现在此页面。\n\
  \n   ![选择要管理的服务器的快照。](img/9781119648505-fg1108.png)\n\n   FIGURE 11-8: 选择要管理的服务器。\n\
  \n4. **点击下一步。**\n\n   出现选择服务器角色页面，如图 11-9 所示。此页面让你为服务器选择一个或多个角色。\n\n   ![选择服务器角色页的快照。](img/9781119648505-fg1109.png)\n\
  \n   FIGURE 11-9: 选择服务器角色页面。\n\n\n\n\n\n### 5. 选择 Active Directory 域服务。\n\n出现“添加角色和功能”对话框，如图\
  \ 11-10 所示。在这里，Windows 正在告诉你，为了安装 Active Directory 域服务角色，还需要安装其他其他功能，例如组策略管理和远程服务器管理工具。\n\
  \n![添加所需的额外角色和服务的快照。](img/9781119648505-fg1110.png)\n\nFIGURE 11-10： 添加额外的所需的角色和服务。\n\
  \n### 6. 点击“添加功能”。\n“添加角色和功能”对话框消失，你被返回到向导的“选择服务器角色”页面。\n\n### 7. 选择 DNS 服务器角色。\n\
  “添加角色和功能”对话框再次出现，这次它会告知你需要添加以支持 DNS 服务器角色的额外功能。\n\n### 8. 点击“下一步”。\n你再次返回到向导的“选择服务器角色”页面。\n\
  \n### 9. 点击“下一步”。\n出现“选择功能”页面，如图 11-11 所示。此页面列出了你可以安装的额外服务器功能。如果你需要，可以在此处选择额外的功能，但现在让我们只关注\
  \ Active Directory 域服务和 DNS 服务器角色。\n\n![选择功能页的快照。](img/9781119648505-fg1111.png)\n\
  \nFIGURE 11-11： 选择功能页面。\n\n### 10. 暂时跳过这些功能并点击“下一步”。\n由于你选择了安装 Active Directory\
  \ 域服务，系统会显示一个非常有用的信息页面，如图 11-12 所示。\n\n![了解 Active Directory 域服务的信息页快照。](img/9781119648505-fg1112.png)\n\
  \nFIGURE 11-12： 关于 Active Directory 域服务的你需要的内容。\n\n### 11. 点击“下一步”。\n现在，由于你还选择了\
  \ DNS 服务器角色，向导显示了另一个关于 DNS 服务器角色的有用信息页面，如图 11-13 所示。\n\n![了解 DNS 服务器角色的信息页快照。](img/9781119648505-fg1113.png)\n\
  \nFIGURE 11-13： 关于 DNS 服务器角色的你需要的内容。\n\n### 12. 点击“下一步”。\n如图 11-14 所示，出现一个确认页面，列出了你选择的角色和功能。\n\
  \n![安装新服务器角色的确认页快照。](img/9781119648505-fg1114.png)\n\nFIGURE 11-14： 你准备好安装新的服务器角色了吗？\n\
  \n### 13. 点击“安装”。\nWindows 安装服务器角色和相关功能。安装期间会显示进度屏幕，以便你判断安装进度。安装完成后，将显示最终的结果页面。\n\
  \n### 14. 点击“关闭”。\n你完成了！\n\n## 创建新域\n\n现在，你已经创建了一个带有 Active Directory 域服务角色的服务器，你可以采取下一步了：创建一个全新的域，稍后你可以向其中添加额外的服务器和计算机。请注意，此步骤通常在组织内只需执行一次，而且不太可能由你亲自完成——这类工作通常由熟练的网络顾问执行最好。然而，了解它是如何操作将帮助你更好地理解\
  \ Active Directory 的工作原理以及它如何在组织中配置的。\n\n要启动此过程，请注意在完成“添加角色和功能向导”后，你会返回到服务器管理器界面，并看到一个警告消息指示你需要配置\
  \ Active Directory 域服务。警告消息以黄色显示，并包含一个 `More`（更多）链接，你可以点击它来启动配置。以下是步骤：\n\n### 1.\
  \ 在“需要配置”警告中点击“更多”。\n显示“所有服务器任务详细和通知”屏幕，如图 11-15 所示。\n\n![Active Directory 域服务角色需要进行的额外配置快照。](img/9781119648505-fg1115.png)\n\
  \nFIGURE 11-15： Active Directory 域服务角色需要进行额外配置。\n\n### 2. 点击“将此服务器提升为域控制器”链接。\n\
  Active Directory 域服务配置向导启动，如图 11-16 所示。在本次练习中，我们将启动一个新的森林，其根域名为 `lowewriter.pri`。\n\
  \n### 3. 选择“添加新森林”，然后为新森林的根域输入名称。\n在这里，我正在输入 `lowewriter.pri` 作为根域名。\n\n### 4. 点击“下一步”。\n\
  向导的下一页如图 11-17 所示，允许你为域控制器设置各种配置选项。你可以让这些选项保持默认设置，但你需要输入一个密码，以便在需要修复损坏的 Active Directory\
  \ 控制器时使用。你可能永远不需要这个密码，但为了防万一，请将其记录下来并存储在安全的地方。\n\n![Active Directory 域服务角色需要进行的额外配置快照。](img/9781119648505-fg1116.png)\n\
  \nFIGURE 11-16： Active Directory 域服务角色需要进行额外配置。\n\n![为域控制器设置各种配置选项的快照。](img/9781119648505-fg1117.png)\n\
  \nFIGURE 11-17： 在此处你可以设置域控制器选项。\n\n### 5. 输入两次恢复密码，然后点击“下一步”。\n你会看到一个 DNS 选项屏幕，显示了关于\
  \ DNS 委托的潜在问题，对于我们的小练习来说，你可以安全地忽略它。\n\n### 6. 点击“下一步”。\n下一个屏幕显示向导已根据你输入的根域名建议了一个\
  \ NETBIOS 名称。NETBIOS 是一种古老的（约 1983 年）网络标准，信你不信，它仍然深层于现代网络的底层。因此，NETBIOS 名称是必不可少的。向导建议的名称几乎总是合适的，所以你可以继续——这里没什么好看的。\n\
  \n### 7. 再次点击“下一步”。\n向导的下一个屏幕允许你设置 Active Directory 创建和使用的各种文件位置。你应该始终保持这些默认值。\n\
  \n### 8. 再次点击“下一步”。\n现在你进入了一个总结你所选选项的页面。检查细节以确保选择明智，然后继续。\n\n### 9. 再次点击“下一步”。\n\
  在这一步中，向导检查所有先决条件是否已就绪以便创建新域，如图 11-18 所示。如果显示任何红色错误，你需要在继续之前解决问题。\n\n![向导检查所有先决条件是否就绪并创建新域的快照。](img/9781119648505-fg1118.png)\n\
  \nFIGURE 11-18： 太棒！所有先决条件已就绪。\n\n### 10. 点击“安装”。\n向导运行一段时间以配置 Active Directory。在此过程中，服务器将重启。当再次启动时，新域将准备就绪，如图\
  \ 11-19 所示的登录界面所示。注意登录界面现在显示你将登录到 `LOWEWRITER` 域。\n\n![登录新域的快照。](img/9781119648505-fg1119.png)\n\
  \nFIGURE 11-19： 登录新域。\n\n\n\n\n恭喜！如果你已经在自己的计算机上按照这些步骤操作，那么你已经成功创建并配置了一台 Windows\
  \ Server 2019 服务器，它既作为 DNS 服务器又作为 Active Directory 控制器，并且你创建了一个新域——这可不是易事！\n\n#\
  \ 第 12 章\n\n# 管理 Windows 用户账户\n\n### 本章内容\n\n- ![Bullet](img/check.png) 理解 Active\
  \ Directory\n- ![Bullet](img/check.png) 检查用户账户\n- ![Bullet](img/check.png) 创建用户账户\n\
  - ![Bullet](img/check.png) 设置账户选项\n- ![Bullet](img/check.png) 组操作\n- ![Bullet](img/check.png)\
  \ 创建登录脚本\n\n每个访问网络的用户都必须有一个用户账户。用户账户允许你（作为网络管理员）控制谁可以访问网络，谁不能访问。此外，用户账户允许你指定每个用户可以使用哪些网络资源。如果没有用户账户，你所有的资源都将对任何随手进入你网络的人开放。\n\
  \n用户账户由 `Active Directory` 管理，这是 Windows 用于管理网络上存在的各种实体的目录服务——不仅包括用户，还包括计算机、打印机、组和其他类型的对象。\n\
  \n本章将为你概述 `Active Directory` 是如何组织的。然后，将深入探讨操作 `Active Directory` 用户账户的细节。\n\n##\
  \ 理解 Active Directory 的组织结构\n\n`Active Directory` 本质上是一个数据库管理系统。`Active Directory`\
  \ 数据库存储了目录跟踪的单个对象。`Active Directory` 使用分层数据库模型，将项目按树形结构分组。\n\n`object`（对象）、`organizational\
  \ unit`（组织单位）、`domain`（域）、`tree`（树）和 `forest`（森林）术语用于描述 `Active Directory` 组织数据的方式。以下章节将解释这些重要\
  \ `Active Directory` 术语的含义。\n\n### 对象\n\n`Active Directory` 中的基本数据单元称为 `object`。Active\
  \ Directory 可以存储许多类型对象的信息。你处理最多的对象是用户、组、计算机和打印机。\n\n图 12-1 显示 `Active Directory\
  \ Manager` 显示了 Windows Server 2019 预配置的内置对象列表。要进入此管理工具，选择开始    管理工具 ⇒   `Active\
  \ Directory Users and Computers`。然后点击 `Built-in` 节点以显示内置对象。\n\n![Active Directory\
  \ Manager 控制台显示的对象列表快照。](img/9781119648505-fg1201.png)\n\n图 12-1： Active Directory\
  \ Manager 控制台显示的对象。\n\n对象具有称为 `properties`（属性）或 `attributes`（属性）的描述性特征。你可以通过在管理台中双击对象来调用对象的属性。\n\
  \n### 域\n\n`domain` 是 Active Directory 中分组相关对象的基本单位。通常，域对应于公司中的部门。一个拥有独立财务、制造和销售部门的公司可能有命名为（你猜得到了）`Accounting`、`Manufacturing`\
  \ 和 `Sales` 的域。或者，域可能对应于地理位置。一家在底特律、达拉斯和丹佛设有办事处的公司可能有命名为 `det`、`dal` 和 `den` 的域。\n\
  \n注意，由于 `Active Directory` 域使用 DNS 命名规范，你可以创建被认为是子域的子域。你应该在创建任何其他域之前，始终为整个网络创建一个顶级域。如果你的公司名为\
  \ Nimbus Brooms，并且你注册了 `nimbusbroom.com` 为你的域名，你应该在创建任何其他域之前创建一个名为 `nimbusbroom.com`\
  \ 的顶级域。然后你可以创建如 `accounting.nimbusbroom.com`、`manufacturing.nimbusbroom.com` 和 `sales.nimbusbroom.com`\
  \ 等子域。\n\n每个域必须至少有一个 `domain controller`（域控制器），这是一个负责该域的服务器。虽然一个域控制器是最低要求，但最好在域内至少提供两个域控制器。这样，如果其中一个故障，`Active\
  \ Directory` 将继续为该域运行。`Active Directory` 使用名为 `replication`（复制）的功能来保持所有域控制器同步。\n\
  \n### 组织单位\n\n许多域的对象过多，无法在一个组中共同管理。幸运的是，`Active Directory` 允许你创建一个或多个 `organizational\
  \ units`，也称为 `OUs`。`OUs` 允许你在域内组织对象，而无需创建额外域带来的额外工作和低效性。（在这方面，`OU` 类似于文件系统中的文件夹。）\n\
  \n在域内创建 `OUs` 的原因之一是为不同的用户分配每个 `OU` 的管理权限。然后这些用户就可以执行常规的管理任务，如创建新用户账户或重置密码。\n\n\
  假设丹佛办公室的域名为 `den`，包含了财务部门和法律部门。与其为这些部门创建单独的域，不如为部门创建组织单位。\n\n### 树\n\n`tree` 是一组共享命名空间的\
  \ `Active Directory` 名称。域 `nimbusbroom.com`、`accounting.nimbusbroom.com`、`manufacturing.nimbusbroom.com`\
  \ 和 `sales.nimbusbroom.com` 构成了一棵源自共同根域 `nimbusbroom.com` 的树。\n\n构成树的域通过 `transitive\
  \ trusts`（传递信任）相互关联。在传递信任中，如果 `DomainA` 信任 `DomainB` 且 `DomainB` 信任 `DomainC`，则\
  \ `DomainA` 自动信任 `DomainC`。\n\n![提示](img/tip.png) 注意，单个域本身仍然被视为一个树。\n\n### 森林\n\n\
  正如其名，`forest` 是树的集合。换句话说，森林是一个多个不共享共同父域的域树的集合。每个域必须属于一个森林，所以即使你的组织只有一个域，你也将有一个森林。\n\
  \n但假设你的公司（Nimbus Brooms）收购了 Tracorum Technical Enterprises，后者已经有一个命名为 `trorumtech.com`\
  \ 的根域，以及它自己的几个子域。你可以从这两个域树中创建一个森林，以便这些域可以相互信任。\n\n## 理解 Windows 用户账户\n\n现在我们已经回顾了\
  \ Active Directory 的基本组织结构，让我们看看如何创建和管理用户账户。正如你可能猜到的，用户账户是管理 Windows 服务器的基本工具之一。作为网络管理员，你大部分时间将花在处理用户账户上——创建新的、删除过、为健忘的用户重置密码、授予新的访问权限等。\n\
  \n以下章节描述了用户账户的一些相关特征。\n\n### 本地账户与域账户\n\n`local account`（本地账户）存储在特定计算机上的用户账户，仅适用于该计算机。通常，你网络上的每台计算机对于每个使用该计算机的每个人都有一个本地账户。\n\
  \n相比之下，`domain account`（域账户）是由 `Active Directory` (AD) 存储的用户账户，可以从域内的任何计算机访问。域账户是集中式式的。本章主要涉及设置和维护域账户。\n\
  \n### 用户账户属性\n\n每个用户账户都有几个重要的账户属性，用于指定账户的特征。三个最重要的账户属性是\n\n- **用户名 (Username)**：识别账户的唯一名称。用户在登录网络时必须输入用户名。用户名是公开信息。换句话说，其他网络用户可以（通常应该）知道你的用户名。\n\
  \n\n\n\n\n- **密码：** 访问账户时必须输入的秘密单词。你可以设置 Windows 以强制执行密码策略，例如密码的最小长度、密码是否必须包含字母和数字的混合，以及用户在必须更改密码之前密码有效期多久。\n\
  - **组成员身份：** 用户账户所属的组。组成员身份关系是授予用户访问权限的关键，使其能够访问各种网络资源（如文件共享或打印机）或执行某些网络任务（如创建新用户帐户或备份服务器）。\n\
  \n许多其他账户属性还记录了关于用户的信息，例如用户的联系信息、是否允许用户仅在特定时间或从特定计算机访问系统等。\n\n## 创建新用户\n\n理论部分已经足够了，让我们进入实践。以下是创建\
  \ Active Directory（活动目录）用户账户的步骤：\n\n1. **选择 `开始 ⇒ Windows 管理工具 ⇒ Active Directory\
  \ 用户和计算机`。**\n\n   此命令将启动 Active Directory 用户和计算机管理控制（参见图 12-1）。\n\n2. **对你想要添加用户的域的组织单元（OU）点击右键，然后从上下文菜单中选择\
  \ `新建 ⇒ 用户`。**\n\n   选择此命令将启动“新建对象 - 用户”向导（如图图 12-2 所示），在所选 OU 中创建一个新的用户对象。\n\n\
  \   ![填写字段以创建新用户的新建对象向导截图](img/9781119648505-fg1202.png)\n\n   图 12-2： 使用向导创建新用户。\n\
  \n3. **输入用户的名字、中间名首字母和姓氏。**\n\n   当你填写这些字段时，新建对象向导会自动填充 `全名` 字段。\n\n4. **如果你希望全名显示的内容与向导建议的不同，请更改\
  \ `全名` 字段。**\n\n   例如，你可能想调换姓名的顺序，让姓显示在前。\n\n5. **输入用户登录名称。**\n\n   该名称在域内必须是唯一的。（别担心，如果你尝试使用一个不唯一的名称，将收到错误消息。）\n\
  \n   ![提示](img/tip.png) 创建用户登录名称时选择一个遵循的命名方案。你可以使用名字的首字母加上完整的姓氏、完整的名字加上姓氏的首字母，或任何符合你喜好的方案。\n\
  \n6. **点击下一步。**\n\n   出现“新建对象 - 用户”向导的第二页，如图图 12-3 所示。\n\n   ![设置用户密码的截图](img/9781119648505-fg1203.png)\n\
  \n   图 12-3： 设置用户密码。\n\n7. **输入两次密码。**\n\n   系统要求你输入密码然后进行确认，请确保输入正确。如果你在两个框中输入的内容不一致，系统会要求你修正错误。\n\
  \n8. **指定你想应用的密码选项。**\n\n   可用以下密码选项：\n\n   - 用户必须在下次登录时更改密码\n   - 用户无法更改密码\n  \
  \ - 密码永不过过期\n   - 帐户已禁用\n\n   有关这些选项的更多信息，请参见本章后面的“设置帐户选项”。\n\n9. **点击下一步。**\n\n\
  \   你将进入“新建对象 - 用户”向导的最后页，如图图 12-4 所示。\n\n10. **验证信息是否正确，然后点击完成创建帐户。**\n\n    如果帐户信息不正确，点击\
  \ `back` 按钮并更正错误。\n\n   完成了！现在你可以自定义用户帐户设置了。至少，你可能想将用户添加到一个或多个组中。你可能还想为用户添加联系信息或设置其他帐户选项。\n\
  \n   ![验证用户帐户信息的截图](img/9781119648505-fg1204.png)\n\n   图 12-4： 验证用户帐户信息。\n\n  \
  \ ![提示](img/tip.png) 创建新用户的另一种方法是简单地复制现有用户。当你复制现有用户时，只需提供新的用户名和密码，Windows 将将所有其他属性设置从现有用户复制到新用户。\n\
  \n## 设置用户属性\n\n创建用户帐户后，你可以通过右键点击新用户并从上下文菜单中选择 `属性` 来为用户设置附加属性。此命令将调出 `属性` 对框 (如图图\
  \ 12-5),其中包含你可以为用户设置的各种选项。\n\n### 更改用户的联系信息\n\n`属性` 对框的几个选项卡包含用户的联系信息，例如：\n\n- **地址：**\
  \ 更改用户的街道地址、邮政信、城市、州和邮政编码。\n- **电话：** 指定用户的电话号码。\n- **组织：** 记录用户的职位名称和其老板名称。\n\n\
  \   ![常规选项页的截图](img/9781119648505-fg1205.png)\n\n   图 12-5： 常用选项卡。\n\n### 设置帐户选项\n\
  \n`属性` 对框的 `帐户` 选项卡(如图图 12-6) 显示你可以为用户设置的各种选项。你可以更改用户的登录名称，更改你在创建帐户时设置的密码选项，并为帐户设置过期日期。\n\
  \n帐户选项列表中可用以下帐户选项：\n\n- **用户必须在下次登录时更改密码：** 此默认选项允许你创建一个一次性密码，让用户开始使用网络。当用户首次登录网络时，系统会其更改密码。\n\
  - **用户无法更改密码：** 如果你不想允许用户更改密码，请使用此选项。（显然，你不能同时使用此选项和前一个选项。）\n- **密码永不过期：** 使用此选项跳过该用户的密码过期策略，使用户将永远不需要更改密码。\n\
  - **使用可逆加密存储密码：** 此选项使用黑客可以轻易破解的加密方案存储密码，因此你应该像躲避瘟疫一样避免它。\n- **帐户已禁用：** 此选项允许你创建一个尚尚需要的帐户。只要帐户保持禁用状态，用户就无法登录。请参见接下来的“禁用和启用用户帐户”以了解如何启用禁用的帐户。\n\
  - **交互式登录需要智能卡：** 如果用户的计算机具有智能卡读取器以自动读取安全卡，请选择此选项以要求用户使用它。\n- **帐户适用于委托：** 此选项表示该帐户是信任的，并且可以设置委托。此高级功能通常保留给管理员帐户。\n\
  - **帐户敏感且不可委托：** 此选项防止其他用户冒充此帐户。\n- **为此帐户使用 DES 加密类型：** 此选项为需要额外安全性的应用程序增强加密。\n\
  \n   ![设置用户帐户信息的截图](img/9781119648505-fg1206.png)\n\n   图 12-6： 在此处设置帐户信息。\n\n\n\
  \n\n\n*   **不需要 Kerberos 预身份验证：** `Kerberos` 是一种用于身份验证用户的常用安全协议。只有当你使用其他类型的安全机制时，才选择此选项。\n\
  \n### 指定登录时间\n\n你可以限制用户允许登录系统的时间。在 `User Properties` 对话框的 `Account` 选项卡上点击 `Logon\
  \ Hours` 按钮，打开 `[User] Logon Hours` 对话框，如 图 12-7 所示。\n\n![用户属性对话框截图，表示限制用户的登录时间。](img/9781119648505-fg1207.png)\n\
  \n图 12-7： 限制用户的登录时间。\n\n最初，`Logon Hours` 对话框允许用户在白天或夜晚的任何时间登录。要更改你希望用户访问的时间，请点击某一天和时间或一段日期和时间，选择\
  \ `Logon Permitted`（允许登录）或 `Logon Denied`（拒绝登录），然后点击 `OK`。\n\n### 限制访问特定计算机\n\n\
  通常，用户可以使用其用户帐户登录到属于用户域的任何计算机。然而，你可以通过点击 `User Properties` 对话框 `Account` 选项卡上的 `Log\
  \ On To` 按钮将用户限制在某些计算机上。此按钮会弹出 `Logon Workstations` 对话框，如 图 12-8 所示。\n\n要将用户限制在某些计算机，请选择\
  \ `Following Computers` 单选按钮。然后，对于你允许用户登录的每台计算机，在文本框中输入计算机名称并点击 `Add`。\n\n![提示](img/tip.png)\
  \ 如果你犯了错误，可以选择错误的计算机名称，然后点击 `Edit` 修改名称，或点击 `Remove` 删除该名称。\n\n![限制用户访问特定计算机的截图。](img/9781119648505-fg1208.png)\n\
  \n图 12-8： 限制用户访问特定计算机。\n\n### 设置用户的配置文件信息\n\n从 `Profile` 选项卡中（如 图 12-9 所示），你可以配置关于用户配置信息的三个部分：\n\
  \n*   **Profile Path（配置文件路径）：** 此字段指定用户漫游配置的位置。\n*   **Logon Script（登录脚本）：** 此字段是用户登录脚本的名称。`logon\
  \ script` 是用户每次登录时运行的批处理文件。登录脚本的主要目的是映射用户需要访问的网络共享。登录脚本是 Windows NT Server 早期版本的遗留。在\
  \ Windows Server 2012 中，配置文件是用户登录时配置其计算机的首选方式，包括设置网络共享。然而，许多管理员仍然喜欢登录脚本的简单性。欲需更多信息，请参阅本章稍后的“创建登录脚本”章节。\n\
  *   **Home Folder（主文件夹）：** 此部分是你指定用户默认存储位置的地方。\n\n![提示](img/tip.png) 从 `Profile`\
  \ 选项卡中，你可以指定用户现有配置的位置，但它实际上并不能让你设置该配置。\n\n![Profile 选项卡的截图。](img/9781119648505-fg1209.png)\n\
  \n图 12-9： Profile 选项卡。\n\n## 重置用户密码\n\n据某些估计，大多数网络管理员最耗时的一项任务就是重置用户密码。不要假设所有用户都是健忘的白痴，请设身处地想，他们被强迫将密码设置为某些难以理解的字符（94kD82leL384K），一周后他们又将其更改为更难记忆的字符（dJUQ63DWd8331），而且他们没有记下来。然后，当他们忘记密码时，网络管理员就生气了。\n\
  \n所以，当用户打电话说他忘记了密码时，你至少能做的就是在重置密码时（表现得）很愉快。毕竟，用户可能已经花了 15 分钟尝试记忆，最后才放弃并承认失败。\n\n\
  以下是重置用户域帐户密码的步骤：\n\n1.  **以管理员身份登录。**\n    ![记住](img/remember.png) 你必须拥有管理员权限才能执行此过程。\n\
  2.  **选择 开始 ⇒ 管理工具 ⇒ Active Directory Users and Computers。**\n    出现 `Active Directory\
  \ Users and Computers` 管理控制。\n3.  **在 `Active Directory Users and Computers` 管理控制中，点击控制树中的\
  \ `Users`。**\n    参考 图 12-1。\n4.  **在详细信息窗中，右键点击忘记密码的用户，然后从上下文菜单中选择 `Reset Password`（重置密码）。**\n\
  \    弹出对话框允许你更改密码。\n5.  **在两个密码框中输入新密码。**\n    ![提示](img/tip.png) 确保你的输入正确。\n6.\
  \  **（可选）勾选 `User Must Change Password at Next`（用户下次必须更改密码）。**\n    如果你选择此选项，分配的密码将仅对一次登录有效。\n\
  7.  **点击 `OK`。**\n    就是这样！用户的密码已重置。\n\n## 禁用和启用用户帐户\n\n为了临时防止用户访问网络，你可以禁用其帐户。当你准备好恢复完全访问时，可以启用启用帐户。以下是步骤：\n\
  \n1.  **以管理员身份登录。**\n    你必须拥有管理员权限才能执行此过程。\n2.  **从服务器管理器，选择 工具 ⇒ Active Directory\
  \ Users and Computers。**\n3.  **在 `Active Directory Users and Computers` 管理控制中，点击\
  \ Users。**\n4.  **在详细信息窗中，右键点击你想启用或禁用的用户；然后从上下文菜单中选择 `Enable Account`（启用帐户）或 `Disable\
  \ Account`（禁用帐户）。**\n\n## 删除用户\n\n人来往往去。当他们离开时，他们的用户帐户也应该随之删除。删除用户帐户出奇地简单。只需遵循以下步骤：\n\
  \n1.  **以管理员身份登录。**\n    你必须拥有管理员权限才能执行此过程。\n2.  **选择 开始 ⇒ 管理工具 ⇒ Active Directory\
  \ Users and Computers。**\n3.  **在出现的 `Active Directory Users and Computers` 管理控制中，点击\
  \ Users。**\n4.  **在详细信息窗中，右键点击你想删除的用户，然后从上下文菜单中选择 `Delete`（删除）。**\n    Windows 会询问你是否真的要删除该用户，以防你在开玩笑。\n\
  5.  **点击 `Yes`。**\n    砰！用户帐户被删除了。\n\n![警告](img/warning.png) 删除用户帐户是永久的、不可逆的操作。只有在你绝对确定永远不想恢复该帐户时才执行。如果存在任何恢复帐户的可能性，请改为禁用帐户。\n\
  \n## 使用组\n\n`group`（组）是一种特殊的帐户类型，代表一组具有共同网络访问需求的用户。组可以极大简化为用户分配网络访问权限的任务。与其为每个用户单独分配访问权限，不如将权限分配给组本身。这样，这些权限就会扩展到你添加到组的任何用户。\n\
  \n以下章节描述了使用组时需要理解的关键概念，以及你在为服务器设置组时采用的一些常用操作。\n\n### 创建组\n\n以下是创建组的步骤：\n\n1.  **以管理员身份登录。**\n\
  \    你必须拥有管理员权限才能执行此过程。\n2.  **从服务器管理器，选择 工具 Active Directory Users and Computers。**\n\
  \n\n\n\n\n3. **右键点击您想要添加组的域，然后从上下文菜单中选择新建 ⇒ 组。**\n\n4. **在新对象 – 组对话框中（如图 12-10\n\
  \n图 12-10: 创建新组。\n\n### 向组添加成员\n\n*组*（Groups）是称为*成员*（members）的对象集合。组的成员可以是用户帐户或其他组。新创建的组（见前面的章节）没有成员。如你所见，在添加至少一个成员之前，组是不可用的。\n\
  \n按照以下步骤向组添加成员：\n\n1. **以管理员身份登录。**\n   您必须具有管理员权限才能执行此操作。\n\n2. **选择开始 ⇒ 管理工具 ⇒ Active\
  \ Directory 用户和计算机。**\n   出现 Active Directory 管理台。\n\n3. **打开包含您想要添加成员的组的文件夹，然后双击该组。**\n\
  \   出现组属性对话框。\n\n4. **点击成员选项卡。**\n   显示该组的成员，如图 12-11 所示。\n\n5. **点击添加，输入您想要添加到此组的用户或其他组的名称，然后点击确定。**\n\
  \   成员被添加到列表中。\n\n6. **对每个您想要添加的用户重复步骤 5。**\n   继续操作直到您添加了所有人！\n\n7. **点击确定。**\n\
  \n![在组属性对话框中向组添加成员的快照。](img/9781119648505-fg1211.png)\n\n图 12-11: 向组添加成员。\n\n就这些了。\n\
  \n![提示](img/tip.png) 在组属性对话框的“所属于”选项卡上，你可以看到当前组所属的每个组的列表。\n\n## 创建登录脚本\n\n*登录脚本*（logon\
  \ script）是每当用户登录时自动运行的批处理文件。使用登录脚本的最常见目的是映射用户需要访问的网络共享。这是一个映射了三个网络共享的简单登录脚本：\n\n\
  ```\necho off\nnet use m: \\\\server1\\shares\\admin\nnet use n: \\\\server1\\shares\\\
  mktg\nnet use o: \\\\server2\\archives\n```\n\n在这里，server1 上的两个共享映射到驱动器 M: 和 N:，server2\
  \ 上的一个共享映射为驱动器 O:。\n\n如果您需要，可以使用特殊变量 `%username%` 获取用户的用户名。如果您为每个用户创建了文件夹，并想为每个用户的文件夹映射驱动器，则此变量非常有用：\n\
  \n```bash\nnet use u: \\\\server1\\users\\%username%\n```\n\n例如，如果用户用用户名 `dlowe`\
  \ 登录，驱动器 U 将映射到 `\\\\server1\\users\\dlowe`。\n\n![提示](img/tip.png) 脚本应保存在 `Scripts`\
  \ 文件夹中，该文件夹深位于 `SYSVOL` 文件夹内部——通常位于：\n\n```\nc:\\Windows\\SYSVOL\\Sysvol\\domainname\\\
  Scripts\n```\n\n其中 `domainname` 是您的域名称。由于您频繁访问此文件夹，我建议在桌面上为其创建一个快捷方式。\n\n创建登录脚本后，您可以使用用户属性对话框的“配置”选项卡将其分配给用户。更多信息，请参阅本章前面的部分“设置用户配置信息”。\n\
  \n第 13 章\n\n## 管理网络存储\n\n本章内容\n\n![项目](img/check.png) **理解磁盘存储**\n\n![项目](img/check.png)\
  \ **查看文件服务器**\n\n![项目](img/check.png) **创建共享**\n\n![项目](img/check.png) **设置权限**\n\
  \n大多数计算机网络的主要目的之一是提供磁盘存储的共享访问。在本章中，你将了解到网络提供共享磁盘存储的几种方法。然后，你将发现如何配置 Windows Server。\n\
  \n## 理解磁盘存储\n\n大多数计算机网络的主要目的之一是提供磁盘存储的共享访问。在本章中，你将了解到网络提供共享磁盘存储的几种方法。然后，你将发现如何配置\
  \ Windows Server。\n\n### 理解磁盘存储\n\n大多数计算机网络的主要目的之一是提供磁盘存储的共享访问。在本章中，你将了解到网络提供共享磁盘存储的几种方法。然后，你将发现如何配置\
  \ Windows。\n\n#### 硬盘驱动器\n\n大多数计算机网络的主要目的之一是提供磁盘存储的共享访问。在本章中，你将了解到网络提供共享磁盘存储的几种方法。然后，你将发现如何配置\
  \ Windows Server。\n\n硬盘驱动器具有许多优势——最主要的是低成本和高容量。硬盘驱动器最大的缺点是速度。磁盘驱动器的速度受限于它依赖机械运动来访问数据。\n\
  \n为了理解这一点，请考虑磁盘驱动器读取特定扇区需要发生什么：\n\n1. 因为每个磁盘表面都有数千条磁道，`读写写头`（实际向磁道中读取或写入数据的机制）必须移动，使其准位在包含该扇区的磁道上方。\n\
  2. 当读写写头到位后，磁盘必须等待数据在盘片上旋转，直到它到达读写头下方。平均而言，数据位于距离读写头盘片的一半位置；有时它会近一点，但数据更远的概率相等。无论如何，磁盘驱动器都必须等待数据绕圈旋转。\n\
  \n![技术细节](img/technicalstuff.png) 磁盘驱动器等待数据的确切时间取决于磁盘的旋转速度。典型的硬盘驱动器每分钟旋转 7,200 转\
  \ (RPM)。这听起来非常快，但在计算机术语中它是极其缓慢的。7,200 RPM 等同于每秒 120 转。这意味着每圈 0.00833 秒。将其减半，你可以看到磁盘驱动器平均等待\
  \ 0.004167 秒让数据到达读写头。\n\n\n\n\n\n让我们通过将其与现代 CPU 的典型时钟频率进行比较，直观地理解这个问题。CPU 通常以从 2.0\
  \ GHz 到 3.5 GHz 之间的时钟频率运行；为了方便计算，我们选择 2.0 GHz。这意味着*每秒*会有十次时钟信号。在磁盘驱动器等待数据到达的 0.004167\
  \ 秒内，CPU 时钟已经跳动了 800 万次以上。因此，在等待数据在磁盘上旋转时，CPU 可以执行 800 万次其他任务。\n\n这里有一个更好的方法来直观感受磁盘有多慢：想象一下，你可以将\
  \ CPU 时钟和磁盘驱动器都慢到 CPU 时钟每秒只跳动一次。打一下响指，数着*一，千，二，千*来开始这个心理练习。按照这个速度，你必须等待三个多月，数据才能旋转到读写头可以读取的位置。\n\
  \n为了好玩起见，让我们回到回到过程中的第 1 步，即读写头移动到包含要访问扇区的轨道上。在大多数磁盘驱动器中，这种移动可能需要一圈到三整圈不等才能完成。在我们“每秒点击一次”的示例中，我们平均需要等待六个月才能开始等待数据。所以现在，我们平均总共等待了九个月，仅仅是为了到达读取数据的就绪位置。\n\
  \n### 3. 而且我们还没完\n\n当数据到达读写头时，读写头会被激活以读取或写入数据。然后，读写头只能以数据通过读写头下方的速度读取数据。计算数据飞过头下方所需的时间要比计算移动读写头和等待数据到达要复杂得多。我们就假设实际读取数据还需要额外的几天或几周吧。\n\
  \n这很有趣，对吧？这整个详细讨论的意义在于说明为什么在涉及到网络整体性能时，磁盘存储是最令人头手的瓶颈之一。\n\n公平地说，磁盘驱动器制造商付出了巨大努力来减少磁盘技术固有速度慢的影响。例如，所有磁盘驱动器都包含相当大量的内部存储用作\
  \ `cache`（缓存），它将最近读取的数据存储在快速内存中，以便在需要时再次快速读取。尽管如此，缓存内存也只能略微提高磁盘磁盘性能。我们需要的是本质上更快的存储技术，这正是固态硬盘大显身场的地方。\n\
  \n### 固态硬盘救援来！\n\n`solid state drive`（SSD）使用集成电路将数据存储在电子内存中，而不是磁性旋转磁盘上。\n\n![技术细节](img/technicalstuff.png)\
  \ 有人使用 `solid state disk`（固态磁盘）这个词，我可以原谅他们，因为 SSD 的功能是替代旋转磁盘的。但由于 SSD 不包含磁盘，那些人在技术上是不正确的。指出他们的不准确性是失去朋友的好方法，所以我建议你自己默默微笑，随它去吧。\n\
  \nSSD 基于一种名为 `flash memory`（闪存）内存技术，这种技术自 20 世纪 80 年代一直存在，但最近才成为旋转磁盘的可负担替代品。SSD\
  \ 的速度比旋转磁盘快得多，因为在访问数据时不涉及任何机械部件：没有需要移动的读写头，也没有需要等待的旋转盘片。SSD 可以以电子速度读写数据，而不是机械速度。（由于缺少运动部件，SSD\
  \ 也比旋转磁盘更可靠。）\n\n然而，这种性能优势是有代价的。SSD 存储的成本通常是 HDD 存储的两到五倍，取决于你需要的驱动器类型。\n\n关于 SSD\
  \ 需要注意的一个重要点是，它们被设计成模拟传统的旋转磁盘存储。因此，SSD 使用与旋转磁盘相同的电子连接，这意味着你可以互换使用 SSD 和 HDD。每当我在这书中提到\
  \ `disks`（磁盘）或 `disk storage`（磁盘存储）时，你可以假设我指的是 SSD 或 HDD 存储。\n\n### 它是 RAID！\n\n\
  我在第 10 章中提到，单个磁盘驱动器通常使用名为 `RAID` 的技术组合在一起，RAID 全称是 `redundant array of inexpensive\
  \ disks`（廉价冗余阵列）。事实上，RAID 阵列是磁盘存储的通用需求，原因有两个：\n\n*   RAID 允许你将多个磁盘驱动器组合为一个单元，其总容量超过组成阵列的单个磁盘的容量。\n\
  *   RAID 提供了一个重要的安全预防，使你的数据能够在阵列中一个磁盘丢失的情况下生存。（在某些情况下，RAID 阵列可以承受两个甚至更多磁盘丢失的影响。）\n\
  \n你需要了解 RAID 的几种基本 `levels`（级别/级别）：\n\n*   **RAID 0**，使用名为 `striping`（条带化）的技术将两个或多个磁盘驱动器创建一个单一映像，其总容量是各个磁盘容量之和。RAID\
  \ 0 几乎从不使用，因为尽管它允许更大的容量，但它没有对阵列中某一个驱动器的故障提供任何保护。事实上，如果 RAID 0 阵列中的一个驱动器故障，你将丢失存储在阵列所有驱动器上的所有数据。\n\
  *   **RAID 1**，其中一对磁盘驱动器被 `mirrored`（镜像），这样如果其中一个发生故障，另一个驱动器会保护数据。\n*   **RAID 10**，其中偶数个磁盘驱动器既进行条带化又进行镜像。换句话说，每对驱动器都是镜像的，而生成的镜像对又进行条带化以增加阵列的容量。因此，阵列的总容量等于驱动器容量的一半；例如，如果用八块\
  \ 2TB 的驱动器创建一个 RAID 10 阵列，总容量为 8TB（16TB 原始容量的一半）。RAID 10 是最安全的 RAID 类型之一，因为阵列可以承受任何驱动器的丢失，只要丢失的两个驱动器不在同一个镜像对中，它就可以承受多个驱动器的丢失。RAID\
  \ 10 也是最快的 RAID 之一。这是因为 RAID 10 所需镜像和条带化的开销很小。由于其速度和安全性，RAID 10 阵列通常用于组织关键的数据。\n\
  *   **RAID 5**，其中磁盘条带化但不镜像。相反，在条带磁盘之间使用冗余，以便如果丢失了一个驱动器，该磁盘上的数据可以使用幸存磁盘上的数据重建。\n\n\
  \    RAID 5 使用 `parity`（校验位）原理来实现冗余。理解校验的最简单方法是考虑一个例子：假设你在三张单独纸上写了三个数字——例如 5、10\
  \ 和 15。不幸的是，如果你丢失了其中一张纸，你就会丢失写在上面的那个数字。为了防止这种情况，你决定计算第二个数字，使得所有四个数字之和为零。在这种情况下，第四个数字将是\
  \ –30（因为 5 + 10 + 15 等于 30，所以 30 加上 –30 得到零）。现在，如果你丢失了其中一张纸——比如带有数字 10 的那张——你只需要反向确定第四个数字的数学过程。换句话说，你\
  \ `减去` 你已知的三个数字。在挠头记忆如何减负数后，你将得到答案——10，这恰好就是那个缺失的数字。\n\n\n\n\n\n在 RAID 5 阵列中，对于写入阵列的每一位数据都会计算校验位，生成的校验位值均匀地分布在阵列中的所有磁盘上，这样即使丢失任何一个磁盘，也可以从存存驱动器上的数据重建丢失的数据。\n\
  \nRAID 5 阵列的有效容量等于所有硬盘的总容量减去一个。因此，如果一个 RAID 5 阵列由五块 2TB 的硬盘构建，那么其有效容量为 8TB (4 ×\
  \ 2TB)。\n\n`RAID 6` 与 RAID 5 几乎相同，不同在于它计算两个校验位并将它们分布在各个磁盘上。这允许你丢失阵列中的两块硬盘而仍然能够恢复数据。RAID\
  \ 6 阵列的有效容量等于所有硬盘的总容量减去两个。因此，由五块 2TB 硬盘构建的 RAID 6 阵列的有效容量为 6TB (3 × 2TB)。\n\n##\
  \ 将磁盘连接到服务器的三种方法\n\n我在第 10 章中也提到将磁盘连接到服务器计算机的三种主要方法。无论你的服务器是虚拟服务器还是物理服务器，情况都是如此。回顾一下：\n\
  \n*   **本地磁盘存储：** 所有服务器计算机都至少有一个直接连接到服务器的硬盘，并安装在服务器同一个机箱内。大多数服务器可以容纳额外的硬盘，这些硬盘可以整合为\
  \ RAID 阵列，创建仅供该服务器使用的磁盘存储。\n\n*   **存储区域网络 (SAN)：** SAN 本质上是一个由磁盘控制器组成的网络，用于管理磁盘驱动器阵列。控制器本身通过专门为此目的设计的特殊网络连接到服务器计算机并相互连接。SAN\
  \ 中最常用的网络技术称为 `Fibre Channel`（光纤通道），其运行速度远高于大多数以太网络 —— 在我写这本书时，最快的光纤通道速度为 256 Gbps。\n\
  \n    SAN 允许你将磁盘存储与服务器计算机分离，从而独立地管理存储和服务器。如果你需要更多的服务器，可以添加更多服务器并将它们连接到 SAN。如果你需要更多的磁盘空间，可以向\
  \ SAN 添加额外的硬盘，你的服务器就可以使用它们。\n\n*   **网络附属存储 (NAS)：** NAS 比 SAN 简单得多；NAS 存储只是连接到你以太网的磁盘存储。要使用\
  \ NAS，你需要购买一个或多个 NAS 设备，这些设备包含磁盘存储和一个向网络提供磁盘存储的控制器。由于 NAS 是通过你的以太网访问的，因此它的速度比 SAN\
  \ 存储慢得多。但价格也便宜得多。\n\n## 专注于文件服务器\n\n现在我们已经查看了磁盘存储的工作原理以及如何连接它，让我们转向在网络上创建和管理存储的主要方法：通过设置一个或多个\
  \ `file servers`（文件服务器）。`file server` 只是主要作用是共享其磁盘存储的网络服务器。使用文件服务器是提供共享网络存储的最常见方式。\n\
  \n文件服务器可以是任何设备，从被作文件服务器使用的简单台式电脑到带有冗余组件的昂贵服务器（25,000 美元或以上），以便在组件故障时服务器继续运行。\n\n\
  ![Tip](img/tip.png) 本章的其余部分将向你展示如何配置 Windows Server 2019 作为文件服务器运行。\n\n### 理解权限\n\
  \n在详细介绍设置文件服务器之前，你需要对权限的概念有深入的理解。`Permissions` 允许用户访问网络上的共享资源。仅仅共享资源（如磁盘文件夹或打印机）并不能保证给用户能够访问该资源。Windows\
  \ 根据分配给该资源的各种组的权限以及用户的组属性来做出此决定。例如，如果用户属于一个被授予访问资源权限的组，则允许访问。否则，则拒绝访问。\n\n从理论上，权限听起来非常简单。但在实践中，它们可能会变得复杂。以下段落解释了访问控制和权限工作的某些细微差别：\n\
  \n*   NTFS 卷上的每个对象 —— 即每个文件和文件夹 —— 都有一组权限 ——与其关联的访问控制列表 (`ACL`)。\n\n*   `ACL` 标识哪些用户和组可以访问该对象，并指定每个用户或组拥有的访问级别。文件夹的\
  \ `ACL` 可能指定一组用户可以读取文件夹中的文件，而另一组用户可以读取和写入文件夹中的文件，而第三组用户被拒绝访问该文件夹。\n\n*   容器对象 ——\
  \ 文件和卷 允许其 `ACLs` 被其所包含的对象继承。因此，如果你为文件夹指定了权限，这些权限将扩展到该文件夹内部的文件和子文件夹。\n\n表 13-1 列出了可以应用于\
  \ NTFS 卷上文件和文件夹的六种权限。\n\n| 权限 | 描述 |\n| --- | --- |\n| 完全控制 | 用户对文件或文件夹具有不受限制的访问。\
  \ |\n| 修改 | 用户可以更改文件或文件夹的内容、删除文件或文件夹、读取文件或文件夹，或更改文件或文件夹的属性。对于文件夹，此权限允许你在文件夹内创建新文件或子文件夹。\
  \ |\n| 读取并执行 | 对于文件，此权限授予读取或执行文件的权限。对于文件夹，此权限授予读取文件夹内容的权限。 |\n| 列出文件夹内容 | 此权限仅适用于文件夹；它授予列出文件夹内容的权限。\
  \ |\n| 读取 | 此权限授予读取文件或文件夹的权限。 |\n| 写入 | 此权限授予更改内容或其属性的权限。对于文件夹，此权限授予在文件夹内创建新文件和子文件夹的权限。\
  \ |\n\n### 文件和文件夹权限\n\n实际上，这六种文件和文件夹权限由各种特殊权限组合组成，授予对文件或文件夹更详细的访问权限。表 13-2 列出了适用于这六种文件和文件夹权限的特殊权限。\n\
  \n![Tip](img/tip.png) 将权限分配给组而不是单个用户。这样，如果特定用户需要访问特定资源，请将该用户添加到具有使用资源权限的组。\n\n|\
  \ 特殊权限 | 完全控制 | 修改 | 读取并执行 | 列出文件夹内容 | 读取 | 写入 |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 遍历文件夹/执行文件 | * | * | * | * | | |\n| 列出文件夹/读取数据 | * | * | * |\
  \ * | * | |\n| 读取扩展属性 | * | * | * | * | * | |\n| 创建文件/写入数据 | * | * | | | | | * |\n\
  | 创建文件夹/追加数据 | * | * | | | | | * |\n| 写入属性 | * | * | | | | | * |\n| 写入扩展属性 | * |\
  \ * | | | | | * |\n| 删除子文件夹和文件 | * | * | | | | | |\n| 删除 | * | * | | | | | |\n|\
  \ 读取权限 | * | * | * | * | * | * |\n| 修改权限 | * | | | | | | |\n| 取消所有权 | * | | | |\
  \ | | |\n| 同步 | * | * | * | * | * | * |\n\n### 理解共享\n\n*share*（共享）只是通过网络提供给其他用户使用的文件夹。每个共享包含以下元素：\n\
  \n*   **共享名称：** 共享在网络上的标识名称\n\n*   **路径：** 本地计算机上被共享文件夹的路径，例如 `C:\\Accounting`\n\
  \n\n\n\n\n- **描述**：对共享内容的单行描述。\n- **权限**：被授予共享权限的用户或组列表。\n\n当您安装 Windows 并配置各种服务器角色时，系统会创建特殊的共享资源来支持这些角色。除非您清楚自己在做什么，否则你不应该扰动这些特殊共享。表\
  \ 13-3 列出了一些最常见的特种共享。\n\n| **共享名称** | **描述** |\n| --- | --- |\n| `drive$` | 驱动器的根目录。\
  \ |\n| `ADMIN$` | 用于计算机的远程管理。此共享指向 OS 文件夹（通常为 `C:\\Windows`）。 |\n| `IPC$` | 命名管道使用，这是一种允许进程之间进行通信的编程功能。\
  \ |\n| `NETLOGON` | 域控制器运行所必需。 |\n| `SYSVOL` | 另一个必需的域控制器共享。 |\n| `PRINT$` | 用于打印机的远程管理。\
  \ |\n| `FAX$` | 传真客户端使用。 |\n\n表 13-3 特殊共享\n\n注意，某些特殊共享以美元符号（`$`）结尾。这些是隐藏共享，对用户不可见。然而，在需要时您通过输入完整的共享名称（包括美元符号）仍然可以访问它们。例如，特殊共享\
  \ `C$,` 的创建是为了允许您从网络客户端连接到 `C:` 驱动器的根目录。您并不希望用户看到此共享，对吧？（当然，诸如 `C$` 等共享也受到权限保护，因此即使普通用户发现\
  \ `C$` 是服务器 `C:` 驱动器的根目录，他仍然无法访问它。）\n\n# 管理您的文件服务器\n\n要管理 Windows Server 2019 系统上的共享，请打开“服务器管理器”，并在窗口左侧的任务窗格中选择“文件和存储服务”。然后点击“共享”，以显示图\
  \ 13-1 所示的管理控制台。\n\n接下来的章节描述了您在管理文件服务器时将用到的一些最常用程序。\n\n![Windows Server 2019 中管理共享的快照。本章节描述了一些最常用的程序。](img/9781119648505-fg1301.png)\n\
  \n图 13-1: 在 Windows Server 2019 中管理共享。\n\n## 使用新建共享向导\n\n为了有用，文件服务器应该提供一个或多个*共享*——即被指定为可通过网络公开访问的文件夹。要创建新共享，请使用新建共享向导：\n\
  \n1. **在服务器管理器中，选择“文件和存储服务”，点击“共享”，然后从“任务”下拉菜单中选择“新建共享”。**\n\n   出现“新建共享向导”的启动界面，如图图\
  \ 13-2 所示。在这里，向导提供了几种后续操作选项。最常用的选项是 SMB 共享，它是 Windows 网络的标准文件共享协议。\n\n2. **在配置文件列表中选择“SMB\
  \ 共享 - 快速”，然后点击“下一步”。**\n\n   新建共享向导会请求共享的位置，如图图 13-3 所示。\n\n3. **选择您希望共享所在的服务器。**\n\
  \n4. **通过选择以下两个选项之一选择共享的位置：**\n\n   - **按卷选择：** 此选项选择共享文件夹将要所在在的卷，同时让新建共享向导为您创建一个文件夹。如果您选择此选项，向导将在指定的卷上创建共享文件夹。如果文件夹尚不存在，且您不介意\
  \ Windows 将其放置在默认位置（即您指定的卷中名为 `Shares` 的文件夹内），则请使用此选项。\n   - **输入自定义路径：** 如果文件夹已存在，或者您想在\
  \ `Shares` 文件夹以外的位置创建文件夹，则请使用此选项。\n\n   在本例中，我选择了“按卷选择”示例，以便让向导在 `C:` 驱动器的 `Shares`\
  \ 文件夹中创建共享。\n\n   ![新建共享向导启动界面的快照。](img/9781119648505-fg1302.png)\n\n   图 13-2:\
  \ 新建共享向导启动了。\n\n   ![选择共享所需的服务器和路径的对话框快照。](img/9781119648505-fg1303.png)\n\n   图\
  \ 13-3: 向导询问您想将共享放在哪里。\n\n5. **点击“下一步”。**\n\n   出现图 13-4 所示的对话框。\n\n6. **在“共享名称”字段中输入您想要用于共享的名称。**\n\
  \n   默认名称是被共享文件夹的名称。如果文件夹名称很长，可以使用更简洁的名称。在本例中，我输入了共享名称 `Data`。\n\n   ![输入名称的快照。](img/9781119648505-fg1304.png)\n\
  \n   图 13-4: 向导询问名称。\n\n7. **为共享输入描述。**\n\n8. **点击“下一步”。**\n\n   出现图 13-5 所示的对话框。\n\
  \n   ![共享设置的快照。](img/9781119648505-fg1305.png)\n\n   图 13-5: 共享设置。\n\n9. **选择您想要使用的共享设置：**\n\
  \n   - *基于权限的枚举（Access-Based Enumeration）：* 隐藏用户没有权限访问的文件。\n   - *共享缓存：* 使文件在离状态可用。\n\
  \   - *加密数据：* 对通过共享访问的文件进行加密。\n\n10. **点击“下一步”。**\n\n    出现图 13-6 所示的对话框。\n\n  \
  \  ![权限设置的快照。](img/9781119648505-fg1306.png)\n\n    图 13-6: 权限设置。\n\n11. **（可选）如果想自定义权限，请点击“自定义”按钮。**\n\
  \n    点击此按钮将调出“高级安全”对话框，您可以在其中同时自定义 NTFS 和共享权限。\n\n12. **点击“下一步”。**\n\n    出现如图\
  \ 13-7 所示的确认页面。\n\n    ![确认设置的快照。](img/9781119648505-fg1307.png)\n\n    图 13-7:\
  \ 确认设置。\n\n13. **验证所有设置无误后点击“创建”。**\n\n    共享已创建，并显示如图 13-8 所示的完成对话框。\n\n    ![结果的快照。](img/9781119648505-fg1308.png)\n\
  \n    图 13-8: 您完成了！\n\n## 不使用向导共享文件夹\n\n如果您认为向导应该仅限于*哈利·波特*电影，可以在不使用向导的情况下设置共享。只需按照步骤操作：\n\
  \n1. **按下 Windows 键，点击“此电脑”，导航到要共享的文件夹。**\n\n2. **右键点击文件夹，从上下文菜单中选择“属性”。**\n\n \
  \  此操作将打开文件夹的属性对话框。\n\n3. **点击“共享”选项卡。**\n\n   “共享”选项卡显示在前，如图图 13-9 所示。\n\n   ![用于手动共享的共享选项卡快照。](img/9781119648505-fg1309.png)\n\
  \n   图 13-9: 手动共享文件夹。\n\n4. **点击“高级共享”按钮。**\n\n   出现图 13-10 所示的对话框。\n\n5. **勾选“共享此文件夹”复选框将文件夹标记为共享。**\n\
  \n   在选择此复选框之前，对话框中的其他控件将不可用。（在图 13-10 中，我已经勾选了“共享此文件夹”框。）\n\n\n\n\n6. 在 `Share\
  \ Name` 字段中输入您想要用于共享的名称，然后在 `Comments` 字段中输入共享的描述。\n   默认名称是被共享文件夹的名称。如果文件夹名称较长，您可以在此处使用更简洁名称。\n\
  \   描述是完全可选的，但有时有助于用户确定文件夹的意图内容。\n\n7. 点击 `Permissions` 按钮，然后设置您想要应用于该共享的权限。\n \
  \  更多信息，请参阅下一节。\n\n8. 点击 `OK`。\n   文件夹现在已共享。\n\n![设置共享名称对话框的截图。](img/9781119648505-fg1310.png)\n\
  \nFIGURE 13-10: 设置共享名称。\n\n### 授予权限\n\n当你首次创建文件共享时，所有用户都获得该共享的只读访问。如果你想允许用户修改共享中的文件或允许他们创建新文件，你需要添加权限。以下是使用\
  \ Windows 资源管理器执行的方法：\n\n1. 按 `Windows` 键并点击 `Computer` 打开 Windows 资源管理器；然后浏览到你想要管理权限的文件夹。\n\
  2. 右键点击你想要管理的文件夹，然后从上下文菜单中选择 `Properties`。\n   出现文件夹的 `Properties` 对话框。\n3. 点击 `Sharing`\
  \ 选项卡；然后点击 `Advanced Sharing`。\n   出现 `Advanced Sharing` 对话框。\n4. 点击 `Permissions`。\n\
  \   出现图 13-11 所示的对话框。此对话框列出了你授予文件夹权限的所有用户和组。最初，读取权限授予名为 `Everyone` 的组，这意味着任何人都可以查看共享中的文件，但没有人可以创建、修改或删除共享中的文件。\n\
  \   当你从列表中选择一个用户或组时，列表底部的复选框会更改，指示你为每个用户或组分配了哪些特定权限。\n\n   ![设置共享权限的截图。此对话框列出了所有拥有文件夹权限的用户和组。](img/9781119648505-fg1311.png)\n\
  \n   FIGURE 13-11: 设置共享权限。\n\n5. 点击 `Add` 按钮。\n   出现图 13-12 所示的对话框。\n6. 输入你想要授予权限的用户或组的名称，然后点击\
  \ `OK`。\n   ![Tip](img/tip.png) 如果你不确定名称，点击 `Advanced` 按钮。此操作将弹出一个对话框，你可以在其中搜索现有用户。\n\
  \   当你点击 `OK` 时，你将返回 `Share Permissions` 选项卡（参见图 13-11），并已添加新的用户或组。\n\n   ![带有某些输入选项的添加权限标签页截图。](img/9781119648505-fg1312.png)\n\
  \n   FIGURE 13-12: 添加权限。\n\n7. 选择适当的 `Allow` 和 `Deny` 复选框，以指定允许该用户或组哪些权限。\n8. 对于你想添加的任何其他权限，重复步骤\
  \ 5–7。\n9. 完成后，点击 `OK`。\n\n关于添加权限，这里还有其他想法：\n\n* 如果你想授予所有人此文件夹的完全访问权限，就不用添加其他权限。相反，选择\
  \ `Everyone` 组，然后为每种权限类型选择 `Allow` 复选框。\n* 你可以通过选择权限并点击 `Remove` 按钮来删除权限。\n* 如果你不想折腾\
  \ `Share` 和 `Storage Management` 控制，可以从 `My Computer` 设置权限。右键点击共享文件夹，从上下文菜单中选择 `Sharing`\
  \ 和 `Security`，然后点击 `Permissions`。然后你可以按照前面的步骤操作，从步骤 5 开始。\n* ![Remember](img/remember.png)\
  \ 在此过程中分配的权限仅适用于共享本身。底层文件夹也可以分配权限。如果是这样，则始终以最严格的限制为准。例如，如果共享权限授予用户 `Full Control`\
  \ 权限，但文件夹权限仅授予用户 `Read` 权限，那么用户对该文件夹只有 `Read` 权限。\n\n# 第 4 部分：管理你的网络\n\n### 在此部分……\n\
  \n* 学习网络管理的本质。\n* 照看你的用户。\n* 使用组策略工作。\n* 管理网络上的所有软件。\n* 与笔记本电脑和智能手机等移动设备一起。\n\n\
  # 第 14 章：欢迎来到网络管理\n\n### 本章内容\n\n![Bullet](img/check.png) 探索网络管理员的众多工作\n![Bullet](img/check.png)\
  \ 记录网络\n![Bullet](img/check.png) 清除、吸尘和拖地\n![Bullet](img/check.png) 管理网络用户\n![Bullet](img/check.png)\
  \ 选择正确的工具\n![Bullet](img/check.png) 构建你的资源库\n![Bullet](img/check.png) 获取认证\n\n*诚聘。需要一名网络管理员来帮助小企业控制失控的网络。必须具备良好的组织和管理能力。仅需要中等计算机经验。仅限兼职。*\n\
  \n这听起来像你公司应该发布的广告吗？每个网络都需要一个网络管理员，无论网络是有 2 台电脑还是 2,000 台电脑。当然，管理一个 2,000 台电脑的网络是一项全职工作，而管理一个\
  \ 2 台电脑的网络不是。至少，不应该是。\n\n本章向你介绍网络管理这项无聊且乏味的工作。哦——你之所以读这一章是因为你被选为网络经理，所以我最好换个说法：\n\
  \n*本章将带你进入奇妙、令人兴奋的网络管理世界！噢，老天！这将非常有趣！*\n\n## 网络管理员做什么\n\n网络管理员“管理”网络：安装、配置、扩展、保护、升级、调优和修复网络。\n\
  \n网络管理员负责网络硬件（如电缆、集线器、交换机、路由器、服务器和客户端）和网络软件（如网络操作系统、电子邮件服务器、备份软件、数据库服务器和应用程序）。最重要的是，管理员通过回答用户的问题、倾听他们的困难并解决他们的问题来照顾网络用户。\n\
  \n在大网络中，这些职责构成了一项全职工作——或者一个全职员工团队。大型网络往往是不稳定的：用户来来去，设备故障，软件卡死，生活似乎是一个又接一个危机。\n\n\
  较小的网络要稳定得多。在你让网络运行起来后，你可能不需要花大量时间管理它的硬件和软件。偶尔可能会出现问题，但由于网络上只有几台电脑，问题应该少之无几。\n\n\
  无论网络大小如何，管理员都要处理日常杂务：\n\n* 参与购买新电脑、打印机或其他设备的每一个决策。\n* 每当网络中添加一台新电脑时，就戴上口袋保护罩。网络管理员的工作包括考虑布线配置的变化、为新电脑分配计算机名称、将新用户集成到安全系统中以及授予用户权限。\n\
  \n\n\n\n*   **每当软件供应商发布新版本的软件时，阅读有关新版本的说明并决定其新功能是否值得升级。** 在大多数情况下，升级到新软件最困难的部分是确定\
  \ `migration path`（迁移路径）——在将整个网络升级到新版本的同时，尽可能减少对网络及其用户的干扰。如果该软件恰好是你的网络操作系统，这一点尤为真实，因为对网络操作系统的任何更改都可能影响整个网络。\n\
  \n![Remember](img/remember.png) 在升级之间，软件供应商会定期发布补丁和服务包来修复细微问题。欲更多信息，请参阅第 19 章。\n\
  \n*   **执行日常工作，如备份服务器、存档旧数据以及释放服务器磁盘空间。** 网络管理的大部分工作涉及在用户注意到问题之前，通过发现并纠正问题来确保事物持续运行。从这个意义上说，网络管理是一项不讨好报的工作。\n\
  \n*   **收集、组织并跟踪整个网络的软件库存清单。** 你永远不知道市场部的 Joe 使用的那台老旧的 `Windows Vista` 电脑何时会出故障，而且你必须重新安装那个旧版本的\
  \ `Lotus Approach`。你清楚安装盘在哪里吗？\n\n## 选择兼职管理员\n\n网络越大，需要的技术支持就越多。大多数小型网络——只有十十几台电脑——可以由一个兼职网络管理员来处理。理想情况下，这个人应该是一个深藏不露的电脑极客：一个对计算机有秘密兴趣但不愿承认这一点的人。一个会将书带回家并在周末阅读的人。一个仅仅为了解决问题而乐于解决计算机问题的人。\n\
  \n管理网络的工作确实需要计算机技能，但并不完全是一项技术性工作。网络管理员的大部分工作是日常家务。基本上，网络管理员定期对网络进行除尘、吸尘和拖地，以防止它变得混乱。\n\
  \n以下是关于挑选兼职网络管理员的一些额外建议：\n\n*   网络管理员需要是一个有组织的人。进行一次突击办公室检查，让桌子最整洁的人负责网络。（不要提前通知他们，否则大家可能在检查前一天晚上故意弄乱自己的桌子。）\n\
  \n*   为网络管理留出足够的时间。对于小型网络（比如不超过 20 多台电脑），每周花一两小时就足够了。在网络管理员适应工作并熟悉网络细节时，初期需要更多时间。不过，在最初的适应期后，小型办公室网络管理每周花费不超过一两小时。（当然，较大的网络需要更多时间来管理。）\n\
  \n*   确保每个人都知道网络管理员是谁，并确保网络管理员有权对网络做出决策，例如每个用户拥有何种访问权限、哪些文件可以和不能存储在服务器上、多长时间进行一次备份等等。\n\
  \n*   选一个果断且不介意得罪别人的人。一个优秀的网络管理员应该确保在硬盘故障 `before` 确保备份正常工作，并在病毒清除整个网络 `before`\
  \ 确保防病毒保护已到位。这种警察式的管理会让人感到反感，但这是为了他们好。\n\n*   在大多数情况下，安装网络的人也是网络管理员。这是恰当的因为没有人比设计和安装网络的人更了解网络了。\n\
  \n*   网络管理员需要一个接班人——一个对网络也几乎同样了解、渴望立功，并且在面对最糟糕的网络任务被派给他们时报以微笑的人。\n\n*   网络管理员应该某种官方头，例如\
  \ `Network Boss`（网络老大）、`Network Czar`（网络沙皇）、`Vice President in Charge of Network\
  \ Operations`（网络运营副总裁）或 `Dr. Network`（网络博士）。一个胸章、一个个性化的口袋笔罩或一套 `Spock ears`（耳朵）也有帮助。\n\
  \n## 网络管理的“三个 U”\n\n网络经理的大部分工作是日常事务——相当于吸尘、除尘和拖地，或者给你的汽车换机油和换轮胎。\n\n网络管理员必须警觉执行的三个最重要的日常任务是我称的“网络管理的三个\
  \ U”。它们是：\n\n*   **Back up（备份）：** 网络经理必须确保网络已妥善备份。如果出现问题且网络没有备份，猜猜谁来背锅？另一方面，如果灾难发生，但你能够通过昨天的备份恢复一切，只损失了少量工作，谁会获得表扬、丰厚的奖金和巴哈马的假期？第\
  \ 22 章描述了网络备份的选项。`soon` 阅读。\n\n*   **Lock up（锁定）：** 网络管理员的另一项主要任务是保护网络免受外部世界的侵害。这些侵害以多种形式出现，包括试图入侵你网络的黑客，以及通过电子邮件或不可靠网站到达的病毒程序。第\
  \ 19 章详细描述了这项任务。\n\n*   **Clean up（清理）：** 用户认为网络服务器就像阁楼一样：他们想把文件扔到那里并永远留在那里。无论你的网络有多大的磁盘空间，用户填满的速度比你想象的要快，因此网络经理就有了偶尔清理阁楼的趣趣工作。我能提供的最佳建议是不断抱怨那里有多乱，并警告你的用户大扫除已在计划中。\n\
  \n## 管理网络用户\n\n管理网络技术是网络管理中最简单的一部分。计算机技术起初可能会令人困惑，但计算机没有人那么复杂。管理网络的真正挑战是管理网络用户。\n\
  \n管理技术与管理用户的区别显而易见：你可以搞懂计算机，但谁能真正搞懂人？使用网络的人比网络本身更不可预测。这里是一些处理用户的技巧：\n\n*   **将用户培训作为网络经理工作的关键部分。**\
  \ 确保每个使用网络的人都理解它是如何工作的以及如何使用。如果网络用户不理解网络原理，他们可能会无意中对它做各种奇怪的操作。\n\n*   **尊重地对待网络用户。**\
  \ 如果用户不知道如何使用网络，这不是他们的错。向他们解释。提供一门课程。给每人买一本这本书，并告诉他们在午休时间阅读。手把手教他们。只要不要把他们当成傻瓜对待。\n\
  \n*   **制作一份网络快速参考表（cheat sheet）。** 它应该包含用户在网络网络方面需要的所有信息——写在一页纸上。每个人都需要一份。\n\n\
  *   **尽可能快速响应。** 如果你不快速修复网络用户的问题，他可能会尝试自己去修复。你不希望发生那种情况。\n\n![Tip](img/tip.png)\
  \ 你对网络用户心理的越了解，你对他们经常表现出的古怪行为的准备工作就越充分。为此，我建议你从头到尾读一遍《精神疾病诊断与统计手册》（也称为 `DSM-5`）。\n\
  \n## 为网络管理员获取软件工具\n\n网络经理需要某些工具来完成工作。大型、复杂、昂贵网络的经理需要大型、复杂、昂贵的工具。小型网络的经理需要小工具。\n\n\
  \n\n\n经理需要的一些工具包括硬件工具，如螺丝刀、电缆钳和锤子。然而，我所指的工具是软件工具。我之前提到了其中几个：Visio（帮助你绘制网络拓图）和一个帮助你映射网络的网络发现工具。这里是其他几个：\n\
  \n*   **内置 TCP/IP 命令：** 许多管理网络所需的软件工具是随网络自带的。作为网络管理员，你应该仔细阅读网络软件附带的说明，查看可以使用哪些管理工具。例如，Windows\
  \ 包含一个 `net diag` 命令，可以使用它来确保网络上的所有计算机都能相互通信。（你可以从 MS-DOS 提示符运行 `net diag`。）对于 TCP/IP\
  \ 网络，可以使用我在表 14-1 中总结的 TCP/IP 诊断命令。\n\n*   **系统信息 (System Information)：** 这个 Windows\
  \ 自带的程序是网络管理员非常有用的实用程序。\n\n*   **热补丁检查器 (Hotfix Checker)：** 这个来自微软的实用 PowerShell\
  \ 工具可以扫描你的计算机，查看需要应用哪些补丁。你可以从微软网站免费下载。只需访问 [`www.microsoft.com`](http://www.microsoft.com/en-us/default.aspx)\
  \ 并搜索 `get-hotfix`。\n\n*   **协议分析器：** `protocol analyzer`（或数据包嗅探器）可以监控并记录沿网络传输的单个数据包。你可以配置协议分析器来过滤特定类型的包，监控特定类型的问题，并对捕获的数据包进行统计分析。\n\
  \n    ![Tip](img/tip.png) 有许多商用数据包嗅探可用，但许多网络管理员发现免费的程序 Wireshark 同样好用。更多信息请访问 [`www.wireshark.org`](http://www.wireshark.org)。\n\
  \n*   **网络监器 (Network Monitor)：** 所有版本的 Windows 都包含一个名为 Network Monitor 的程序，它提供基本的协议分析，并通常有助于解决棘手的网络问题。\n\
  \n| **命令** | **显示内容** |\n| --- | --- |\n| `arp` | 地址解析协议 (ARP) 使用的地址解析信息 |\n| `hostname`\
  \ | 你的计算机主机名 |\n| `ipconfig` | 当前的 TCP/IP 设置 |\n| `nbtstat` | TCP/IP 上 NetBIOS 连接的状态\
  \ |\n| `netstat` | TCP/IP 统计信息 |\n| `nslookup` | DNS 信息 |\n| `ping` | 验证指定的计算机是否可用\
  \ |\n| `route` | 电脑的路由表 |\n| `tracert` | 从你的计算机到指定主机的路由 |\n\n表 14-1 TCP/IP 诊断命令\n\
  \n## 构建知识库\n\n斯科提（Scotty）在原版《星际迷航》剧中留过他最经典的台词之一，当时他拒绝休假，以便赶上他的技术期刊进度。“你从不放松吗？”柯克（Kirk）问道。“我正在放松！”斯科提回答道。\n\
  \n要成为一名优秀的网络管理员，你需要阅读计算机书籍——很多。而且你需要喜欢这样做。如果你是那种会把电脑书籍带到海滩的人，你将成为一名出色的网络管理员。\n\n\
  阅读各种主题的书籍。我不推荐特定的书名，但我建议你针对以下每个主题都买一本优秀且全面的书：\n\n*   网络安全与黑客\n*   无线网络\n*   网络布线与硬件\n\
  *   以太网\n*   Windows Server 2008、2012 和 2016\n*   Windows 7, 8, 8.1 和 10\n*   Linux\n\
  *   TCP/IP\n*   DNS\n*   Sendmail 或 Microsoft Exchange Server，取决于你使用哪种邮件服务器\n\n\
  除了书籍，你可能还想订阅一些杂志以跟跟网络行业的动态。以下是你可能应该考虑的几个，以及它们的网址：\n\n*   *InformationWeek:* [`www.informationweek.com`](http://www.informationweek.com/)\n\
  *   *InfoWorld:* [`www.infoworld.com`](http://www.infoworld.com/)\n*   *Network\
  \ Computing:* [`www.networkcomputing.com`](http://www.networkcomputing.com/)\n*\
  \   *Network World:* [`www.networkworld.com`](http://www.networkworld.com/)\n* \
  \  *2600 The Hacker Quarterly* (一本关于计算机黑客和安全的极佳杂志): [`www.2600.com`](http://www.2600.com/)\n\
  \n    ![Tip](img/tip.png) 它是网络管理员获取技术信息的最佳来源之一。你需要在浏览器的收藏夹中存放包含有用网络信息的网站。此外，你可能还想订阅许多在线通讯之一，它们通过电子邮件定期发送最新信息。\n\
  \n## 追求认证\n\n还记得《奥兹魔法师》结尾处的那个场景吗？巫师给稻草人一张文凭，给胆小狮子一枚勋章，给锡人人一份证明？\n\n网络认证就像是那样。我现在就能想象出那个场景：\n\
  \n*   *巫师：* “至于你，我那背负网络负担的朋友，任何戴着厚眼镜的极客都能管理网络。在我出生的地方，有人整天除了配置路由器什么都不干。在我出生的地方，他们除了没有大脑外一无所有。但现在，根据我授予的权力，我授予你这份证书。”\n\
  *   *你：* “CND？”\n*   *巫师：* “傻瓜网络认证。”\n\n我的意思是，认证本身并不能保证你真的懂得管理网络。这种能力来自经验——而不是考试。\n\
  \n尽管如此，在当今竞争激烈的就业市场中，认证变得越来越重要。因此你可能追求认证，不仅是为了提高技能，还为了你的简历。认证是一项开支。每次考试可能花费数百美元，取决于你的技术水平，你可能需要购买书籍或参加培训课程。\n\
  \n你可以追求两种认证：厂商认证和中立认证。微软和思科等主要的软件供应商为其设备和软件提供认证计划。CompTIA 一个非营利行业协会提供著名的中立认证。\n\n\
  ## 有用的装傻与借口\n\n作为网络管理员，你有时无法解决问题，至少不能立即解决。在这种情况下你可以做两件事。第一是解释问题特别复杂，你会尽快提供解决方案。第二种方案是直视用户的眼睛，面严肃地尝试这些虚假的解释：\n\
  \n*   归咎于你正在使用的任何软件版本。“哦，他们在版本 39 中修复了这个问题。”\n*   归咎于廉价的进口内存芯片。\n*   归咎于民主党。或共和党。无所谓。\n\
  *   归咎于石油公司高管。\n*   归咎于干旱。\n*   归咎于降雨。\n*   归咎于气候变化。\n*   希望问题不是由杂散静电引起的。这类问题很难追踪。告诉你的用户，在使用电脑前不妥善放电会导致各种问题。\n\
  *   你需要更多内存。\n*   你需要更大的磁盘。\n*   你需要更快的处理器。\n*   归咎于贾比贾·宾克斯（Jar Jar Binks）。\n* \
  \  你在 Windows 10 中不能做这一点。\n*   你只能在 Windows 10 中做这一点。\n*   可能是病毒。\n*   或者是太阳黑子。\n\
  *   没有啤酒和电视会让荷马变成什么什么什么。\n\n\n\n\n\n![Bullet](img/check.png) 设置帮助台\n![Bullet](img/check.png)\
  \ 查看支持工单\n![Bullet](img/check.png) 观察用户如何与帮助台沟通\n![Bullet](img/check.png) 远程帮助用户\n\
  ![Bullet](img/check.png) 构建知识库\n![Bullet](img/check.png) 构建自助服务门户\n![Bullet](img/check.png)\
  \ 调查用户满意度\n![Bullet](img/check.png) 监控帮助台的运行状况\n![Bullet](img/check.png) 使用商业帮助台解决方案\n\
  \n几年前，我曾帮助购买并配置了一个云端设备，它可以在办公室主大堂的大屏幕电视上显示公司信息。我花了一些时间研究才弄明白，但当我们搞定后，事实证明它是解决手头问题的绝佳方案。\n\
  \n最近，我们需要增加第二个大屏幕电视，以便在第二个屏幕上显示完全相同的信息。于是，我购买了另一个同样的设备，花了整个上午大部分时间尝试如何将其整合到我们的账户中。最后，在无奈之下，我拨打了了供应商帮助台电话寻求支持。他们礼貌地询问我是否读过说明书（我没读），然后耐心地引导我完成了那个超级简单的两步流程。第二个设备在约\
  \ 5 分钟内就启动运行了。\n\n这个故事的启示是，有时即使是那些本该更懂行的人（即*我*）也不会遵守说明书，并最终需要帮助。我当时正需要帮助台。\n\nIT\
  \ 管理员最重要的功能之一就是支持你的用户。做到这一点的最佳方法就是建立帮助台。\n\n如果你在一家小公司工作，几乎一个人就是整个 IT 部门，那么你可能*就是*帮助台。在小型组织中（例如，少于\
  \ 40 人），一个人可能管理整个 IT 基础设施，包括设置和维护服务器硬件和软件、网络设备和应用程序软件，并且仍然能处理偶尔需要帮助的用户拨打的电话。但随着员工的增加，你最终需要建立一个正式的帮助台，并配备专门人员来解决用户的问题。\n\
  \n在本章中，我将向你简要介绍在建立和管理高效帮助台时需要考虑的因素。\n\n## 建立帮助台的章程\n\n无论你是从零开始，还是在评估现有帮助台的有效性，最好的起点都是为帮助台制定一份章程。没有清晰的章程，你永远无法衡量你帮助台的有效性。\n\
  \n章程应该明确帮助台的核心使命，这无疑包括解决你组织计算机系统用户所遇到的 IT 问题。章程还应该考虑以下因素：\n\n* 帮助台的任务如何与公司的核心价值观相契？\n\
  * 帮助台在公司整体组织中处于什么位置？它向谁汇报？\n* 帮助台是寻求解决*所有* IT 问题，还是有更有限的范畴？换句话说，如果一个用户不懂如何创建和使用\
  \ Microsoft Excel 透视表，提供此类培训是否在帮助台的职责范围内？还是说帮助台的任务是否仅限于在 Excel 损坏时帮助用户，而不是在用户不会使用时提供帮助？\n\
  * 在决定如何分配资源时，帮助台是否应该将某些用户的需求置于其他用户之上？例如，某个部门（如工厂生产或薪资部门）是否比其他时间敏感性不那么部门优先级更高？执行管理层是否应该比其他用户获得更高优先级的响应？\n\
  * 是否可以识别特定的性能指标来衡量帮助台的有效性？是处理的电话总数、首次通话解决问题的百分比，还是用户满意度调查的正面评分？\n* 你期望帮助台有多有多快的响应速度？由真人接听帮助台电话是否重要？那个人需要是能够实际解决问题的技术人员，还是由非技术人员接听并将将其分配给相应的技术人员也可以接受？\n\
  \n帮助台章程应由代表所有利益相关者的团队制定。这不仅包括 IT 员工和执行管理层，还包括受帮助台支持的各个部门的代表。\n\n![Remember](img/remember.png)\
  \ 应定期审查章程，以评估帮助台是否满足了用户的需求。这种评估也应对所有利益相关者的代表。\n\n## 跟踪支持工单\n\n帮助台管理支持请求最重要的工具是`support\
  \ ticket`（支持工单）。支持工单跟踪支持请求从开始到完成的状态，并记录与请求相关的每个细节，包括：\n\n* **请求工单的人员的基本识别信息：** 这可能包括姓名和联系信息、简短标题（由请求支持的用户或帮助台人员创建）、工单创建的日期和时间、问题的详细描述，以及最初分配给该工单的支持技术人员的标识。\n\
  * **工单类别：** 你需要制定一份适合你公司的类别列表，但你可能会包含类似于下方的类别：\n    * 登录和密码\n    * 新用户入职\n    *\
  \ 员工离职\n    * 硬件\n    * 电子邮件\n    * 打印\n    * 内部网\n    * Microsoft Office\n    *\
  \ 病毒/恶意软件\n    * 电话\n    * 其他\n* **工单状态的指示：** 以下是状态选项的示例：\n    * 已接收\n    * 已分配\n\
  \    * 进行中\n    * 已升级\n    * 已解决\n    * 已关闭\n* **所有通信记录，包括电子邮件、消息和所有电话对话的详细记录：**\
  \ 这些记录应包含通信的日期和时间。\n* **截图、事件日志和任何其他相关文件。**\n* **为解决问题所做的所有操作的详细描述。**\n* **问题最终如何解决的细节。**\n\
  \n![Tip](img/tip.png) 情况下，发起支持请求的用户应该能够访问工单并有机会向其中添加注释。让用户参与进来将有助于提高故障排除过程的整体满意度，并帮助他们理解他们的问题没有被遗忘，而是确实正在处理中。\n\
  \n整个工单数据库也应供帮助台人员使用，以便他们查看之前的问题。支持技术人员应该能够在数据库中搜索同一用户或其他报告过类似问题的用户创建的工单。这样，技术人员就可以避免重复造轮。\n\
  \n你可能倾向于使用自建数据库来跟踪你的帮助台工单，也许使用如 `Microsoft Access` 等数据库程序或 `Microsoft OneNote` 等更通用的程序。然而，当你发现这个自建方案没有具备你所需的灵活性、不利于搜索，并且缺乏让你的帮助台脱颖而出的功能（如自动提醒或用于委派或升级问题的内置工作流）时，你很快就会发现它无法满足你的需求。\n\
  \n幸运的是，有很多优秀的软件可以帮助你管理帮助台的故障工单。只需在网上搜索关键词 `help desk software`，你就能找到几十种供的选择。\n\n\
  ## 决定如何与用户沟通\n\n\n\n\n\n用户必须有一种可靠且响应迅速的方法来与帮助台进行通信。以下是一些值得考虑的最佳方案：\n\n- **电话**：显而易见的通信方式是通过电话。如果你的帮助台规模较小，只有几位支持技术人员，只需发布每位技术人员的电话号码或分机即可。对于较大的帮助台，你希望提供一个单一的接入号码，并且*不要*发布单个支持技术人员的号码。\n\
  \n  电话的优点是联系是即时的（假设真的有人接电话），而且是人性的（假设电话是由真人接听的）。缺点是很难对入电电话进行分类。理想情况下，应该由专人负责接听入电电话并将其转给适当的技术人员。\n\
  \n  你可能想要设置电话树，提供如“按 1 寻求登录帮助”、“按 2 寻求财务软件软件帮助”等选项。只要树形结构简单，用户能够快速联系到可以帮助他们的真人，这样做就是可以的。如果用户必须进行一堆按键选择，最终却落入语音信，他们会感到很沮丧。\n\
  \n  电话的缺点是没有详细的对话记录。在每次通话后，技术人员应该在支持工单中记录通话细节。然而，准确记录每一个细节并不容易，因此错误或误解不可避免地会出现。\n\
  \n- **电子邮件**：这是与帮助台通信的一种常用且有效的方法。只需使用易于记忆的名称（如“Support”或“Help”）设置一个支持邮箱，并将技术人员的\
  \ Outlook 配置文件连接到该支持邮箱。然后，支持技术人员就可以监控支持邮箱，并在收到新的帮助请求时做出响应。\n\n  电子邮件的主要优点之一是它能创建准确的通信记录。邮件可以附加到工单中，因此技术人员可以快速查看该工单之前的活动。\n\
  \n- **在线聊天**：用户与支持技术人员通信的一种日益流行的方式。许多用户更倾向于聊天而不是电子邮件，因为后者的响应更快；更倾向于聊天而不是电话，因为聊天的干扰性较小。支持人员通常也喜欢聊天，因为消息之间的延迟允许他们同时处理多个问题。双赢！\n\
  \n  作为额外的奖励，聊天转录本可以复制到工单中，从而保留整个对话的记录。\n\n  有很多适用于支持人员人员的聊天服务。我很喜欢的一个是 Slack ([www.slack.com](http://www.slack.com/))。除了简单的聊天，它还提供视频聊天、屏幕共享、文件传输以及许多对支持团队非常有用的功能。\n\
  \n## 使用远程协助\n\n为网络用户提供技术支持最令人恼恼的方面之一是你经常必须去用户的桌旁查看其电脑发生了什么。如果另一个用户的桌子在房间另一头或走廊尽头，这已经够麻烦了，但如果你需要支持的用户在另一个城市、甚至是不同的州，这几乎无法进行。\n\
  \n幸运的是，Windows 包含一个名为 `Remote Assistance`（远程协助）的方便功能，它旨在让你无需前往用户所在地即可为终端用户提供支持。通过\
  \ `Remote Assistance`，你可以在自己屏幕上的窗口中看到用户的屏幕，因此可以观察用户正在做什么。必要时，你甚至可以接管执行故障排除或纠正操作以帮助解决用户的问题。\n\
  \n请注意，Windows `Remote Assistance` 有商业替代方案，它们在执行此任务时做得更好。本章向你如何使用 `Remote Assistance`是因为它是免费的，而且自\
  \ Windows XP 以来所有的 Windows 都带有此功能。\n\n### 启用远程协助\n\n在为远程计算机提供帮助之前，必须在该计算机上启用 `Remote\
  \ Assistance`。你应该在需要它之前启用它，以便在时间来临时可以轻松地访问用户的计算机。但由于该操作足够简单，你可能可以通过电话引导用户完成这些步骤，从而获得访问权限。\n\
  \n以下是步骤：\n\n1. **点击开始按钮，输入 `Remote Assistance`，然后点击`向此计算机发送远程协助邀请`。**\n\n   这将弹出“系统属性”对话框，如图图\
  \ 15-1 所示。\n\n   ![启用远程协助的系统属性对话框截图。](img/9781119648505-fg1501.png)\n\n   图 15-1：\
  \ 启用远程协助。\n\n2. **勾选`允许远程协助连接到此计算机` 框。**\n\n3. **点击高级按钮。**\n\n   出现“远程协助设置”对话框，如图图\
  \ 15-2 所示。\n\n   ![设置高级远程协助选项的截图。](img/9781119648505-fg1502.png)\n\n   图 15-2： 设置高级远程协助选项。\n\
  \n4. **勾选`允许远程控制此计算机` 框。**\n\n   此选项将允许你以后远程接管这台计算机。\n\n5. **点击确定。**\n\n   你返回到“系统属性”对话框。\n\
  \n6. **点击确定。**\n\n   完成了。你现在可以启动远程协助会话了。\n\n### 邀请他人协助进行远程协助会话\n\n请求远程协助的用户必须发起请求，你才能连接到用户的计算机提供帮助。你可能需要通过电话引导用户完成此操作。以下是步骤：\n\
  \n1. **点击开始按钮，输入 `Invite`，然后点击`邀请他人连接到你的电脑`。**\n\n   出现 Windows 远程协助窗口，如图图 15-3\
  \ 所示。\n\n2. **点击`邀请信任的人帮助你`。**\n\n   出现如图图 15-4 所示的屏幕。\n\n3. **点击`将此邀请保存为文件`，并将邀请文件保存到方便的磁盘位置。**\n\
  \n   此选项会创建一个可以保存到磁盘的特殊文件。弹出“另存为”对话框，允许你在任何所需的磁盘位置保存邀请文件。然后你可以将邀请通过电子邮件发送给助手，助手可以使用该邀请连接到你的电脑。\n\
  \n   ![Windows 远程协助窗口的截图。](img/9781119648505-fg1503.png)\n\n   图 15-3： Windows 远程协助窗口。\n\
  \n   ![邀请他人帮助的截图。](img/9781119648505-fg1504.png)\n\n   图 15-4： 邀请他人帮助。\n\n4. **如果你使用\
  \ Microsoft Outlook，可以选择`使用电子邮件发送邀请`。**\n\n   此选项会启动 Outlook 并创建一封已附加邀请文件的电子邮件。\n\
  \n   无论何种方式，都会显示一个密码，如图图 15-5 所示。你需要在需要时向助手提供此密码。（通常，你会通过电话提供。）\n\n   ![作为附件发送邀请文件和密码给助手的截图。](img/9781119648505-fg1505.png)\n\
  \n   图 15-5： 你需要告诉助手密码。\n\n5. **将邀请文件通过电子邮件给你想帮助的人。**\n\n   使用你偏好的电子邮件程序将邀请文件作为附件发送。\n\
  \n6. **等待助手请求密码。**\n\n\n\n\n\n当你的助手在远程协助屏幕上输入密码时，远程协助会话就会建立。系统会提示你是否允许助手控制你的计算机，如图\
  \ 15-6 所示。\n\n![允许助手控制用户计算机权限的屏幕截图](img/9781119648505-fg1506.png)\n\n图 15-6： 授予助手控制权限。\n\
  \n7. **点击“是”。**\n\n现在你的助手可以访问你的计算机。为了方便远程协助会话，会出现如图 15-7 所示的工具栏。你可以使用此工具栏与助手聊天，或临时暂停远程协助会话。\n\
  \n![Windows 远程协助工具栏截图](img/9781119648505-fg1507.png)\n\n图 15-7： Windows 远程协助工具栏。\n\
  \n### 响应远程协助邀请\n\n如果你收到了远程协助会话邀请，可以按照步骤建立会话：\n\n1. **点击“开始”按钮，输入 Invite，然后点击“邀请某人连接到你的电脑”。**\n\
  \n这将打开 Windows 远程协助窗口（参见图 15-3）。\n\n2. **点击“帮助邀请过你的人”。**\n\n3. **点击“使用邀请文件”。**\n\
  \n出现一个打开对话框。\n\n4. **找到你收到的邀请文件，选择它并点击“打开”。**\n\n系统会提示你输入远程协助密码，如图 15-8 所示。\n\n\
  ![输入远程协助密码的截图](img/9781119648505-fg1508.png)\n\n图 15-8： 输入远程协助密码。\n\n![提示](img/tip.png)\
  \ 作为步骤 1 到 3 的替代方案，你可以直接双击收到的邀请文件。Windows 远程协助将启动并提示输入密码。\n\n5. **输入请求帮助的用户提供的密码，然后点击“确定”。**\n\
  \n远程用户将被提示授予你启动远程协助会话的权限（远程用户在此看到如图 15-6 所示的屏幕）。当用户授予权限后，远程协助会话就会建立。现在你可以在远程协助窗口中看到用户的屏幕，如图\
  \ 15-9 所示。\n\n![正在进行的远程协助会话的截图](img/9781119648505-fg1509.png)\n\n图 15-9： 正在进行的远程协助会话。\n\
  \n6. **要控制远程用户的计算机，点击“请求控制”。**\n\n远程用户将被提示允许控制。假设权限已授予，你现在可以控制另一台计算机。\n\n7. **进行你的操作。**\n\
  \n现在你已经连接到远程计算机，可以执行任何必要的疑故障排除或纠正操作来解决用户的问题。\n\n8. **如有必要，使用“聊天”窗口与用户通信。**\n\n可以通过点击工具栏中的“聊天”按钮来唤出聊天窗口。图\
  \ 15-10 显示了正在进行的聊天。\n\n9. **要结束远程协助会话，只需关闭远程协助窗口。**\n\n远程用户将收到远程协助会话已结束的通知。\n\n\
  ![使用聊天窗口的截图](img/9781119648505-fg1510.png)\n\n图 15-10： 使用聊天窗口。\n\n### 创建知识库\n\n\
  帮助热线的一个重要方面都是创建并维护一个常见问题及其解决方案的全面知识库。每当发现反复出现的问题时，应分配一名具有写作能力的帮助热线团队成员在知识库中创建新文章。文章应清晰列出通常遇到的症状，以及解决该问题的详细、分步骤的解决方案。\n\
  \n知识库应该在整个公司共享，也许发布在公司内网网上。这样，用户就可以自行进行搜索。在公司内网上共享一个内容丰富的知识库可以减少帮助热线收到的支持电话数量，因为用户可以自行查找解决方案。\n\
  \n### 创建自服务帮助门户\n\n提高帮助热线效率的最佳方法之一是创建一个自服务帮助台门户，用户可以在那里自行查找解决方案。一个良好的帮助台门户应该提供以下内容：\n\
  \n*   **帮助热线的联系信息：** 不仅仅是提供电子邮件地址，门户还应包含一个简单的表单来描述问题。最简单的方法是跟进一封包含调查调查链接的电子邮件。\n\
  *   **当前和之前的工单摘要：** 对于当前工单，用户应该能够添加注释。对于已关闭的工单，用户应该能够重新打开，以防问题再次发生。\n*   **聊天会话链接：**\
  \ 一个允许用户搜索知识库的搜索字段。\n*   **即将升级的信息。**\n\n如果你的公司有 Web 开发人员（或者你自己恰好是 Web 开发人员），你可以开发帮助台门户。否则，你可以找到许多满足此需求的商业选项。（更多信息，请参见本章节后面的“使用帮助热线管理”部分。）\n\
  \n### 使用满意度调查\n\n在每个支持请求后跟进一份简短的调查是一个好主意，让用户对帮助热线支持的满意度进行评分。这样做最简单的方法是跟进一封包含调查页面链接的电子邮件。请注意，调查应该是简短的——只需显示在单个页面上的几个问题即可。\n\
  \n以下是针对调查的一些建议问题：\n\n*   你对帮助热线就此问题提供的支持满意度如何？\n*   你的的问题是否及时得到了解决？\n*   问题是否在首次联系（电话、聊天或电子邮件）期间得到了解决？\n\
  *   支持技术对你情况的理解程度如何？\n*   技术人员在关闭工单之前是否确保了你的问题已解决？\n*   在问题解决后，技术人员是否询问了是否有其他可以帮助你的问题？\n\
  *   你有任何意见吗？\n\n在互联网上搜索“帮助热线满意度调查”等术语，会发现许多可以帮助进行满意度调查的软件。最著名的之一是 Survey Monkey（[`www.surveymonkey.com`](http://www.surveymonkey.com)）。Survey\
  \ Monkey 甚至有一个帮助热线满意度调查模板帮助你开始（参见图 15-11）。\n\n![Survey Monkey 帮助热线满意度调查模板截图](img/9781119648505-fg1511.png)\n\
  \n图 15-11： Survey Monkey 的帮助热线满意度调查模板。\n\n\n\n\n\n## 跟踪帮助台性能\n\n如果你想知道你的帮助台团队效率和有效性如何，你需要跟踪若干因素，并定期评估你的工作情况。以下是每月需要跟踪的一些最重要的指标：\n\
  \n*   **工单总数：** 你需要跟踪的最重要基准数据是帮助台收到的工单总数。如果你不知道帮助台进入了多少工单，你就无法理解其他统计数据。关注这个数字的增长可以帮助你证明增加额外人员的必要性。\n\
  *   **成功解决的工单数：** 我们希望这个数字等于收到的工单数量。但注意其之间的差异非常重要，因为有时你会遇到な无法解决的问题。你需要密切关注这些问题，以确定是问题本身太棘手、用户不合理，还是你的员工直接放弃了。\n\
  *   **工单分类：** 假设你已经创建了一组良好的分类，跟踪每个类别工单的整体百分比将帮助你理解如何培训和配置帮助台人员。（你能说“饼图”这个词吗？）\n\
  *   **平均响应时间：** 跟踪响应传入工单所需的时间。初始响应越快，用户的挫败感就越小。\n*   **平均解决时间：** 跟踪从收到工单到最终解决所需的时间。同样，解决得越快，用户的满意度越高。\n\
  *   **每张工单平均耗时：** 整体平均值很有用，但每个类别的平均小时更有用。某些类型的问题确实比其他问题难以解决。\n*   **用户满意度：** 这项指标将来自你的满意度调查。\n\
  *   **员工表现：** 你的帮助台团队成员工作得有效吗？如果一个团队成员在某些类别的问题上花费的时间明显多于其他团队成员，那么该成员可能需要更多培训。（另一方面，也完全可能是该成员是团队中最擅长处理难题问题的人，因此棘手的问题通常会交给他或她！）\n\
  \n## 使用帮助台管理软件\n\n正如本章所示，运行一个高效的帮助台是一项大工程。而且，高效的帮助台对你公司的整体表现至关重要。帮助台越快解决用户的问题，你的用户就能越快回到高效工作中。\n\
  \n与其尝试去拼凑运行帮助台所需的各种部分，不如考虑购买一个包含 IT 服务管理所有方面的综合软件包。这种软件并不便宜，但从长远来看，它可以为公司节省资金。\n\
  \n良好的帮助台管理软件应包含以下功能：\n\n*   **工单管理：** 对故障工单从创建到解决进行全面管理，并能够根据状态、类别、用户、技术人员和其他因素进行排序和过滤。工单系统应允许自定义字段，以便你将公司的独特需求集成到系统中。\n\
  *   **自服务门户：** 软件应该让你能够轻松地建立一个自服务门户，让你的用户能够在无需联系帮助台的情况下找到解决方案。\n*   **知识库：** 一个良好的、可自定义的知识库是不可少的。\n\
  *   **报告：** 软件应该跟踪重要的性能指标，并具有报告功能，让你跟踪帮助台的运行情况。\n*   **资产管理：** 明显的加分项。某些产品将其作为额外付费功能。\n\
  *   **部署灵活性：** 理想情况下，你应该有选择在本地部署软件或将软件作为云服务使用。\n\n在互联网上搜索 `help-desk software`，你会发现许多可选方案。以下只是少数知名产品——请注意，此列表并不完整：\n\
  \n*   **Zendesk ([www.zendesk.com](http://www.zendesk.com)):** 一种优秀的云端解决方案，为帮助台团队的每个成员收取每月订阅费用。大多数组织选择专业版（截至本文编写每月\
  \ 19.99 美元）或企业版（截至本文编写每月 49 美元）。**记住：** 费用按帮助台团队成员计算，而不是按每个终端用户。Zendesk 一直是排名最高的帮助台解决方案供应商之一，因此它是你应该仔细考虑的对象。\n\
  *   **RescueAssist Service Desk ([`get.gotoassist.com`](http://get.gotoassist.com/)):**\
  \ 一种全面的帮助台解决方案，包含了强大的远程协助功能，由流行的 GoToMeeting 会议软件制造商制作。\n*   **Salesforce ([www.salesforce.com](http://www.salesforce.com)):**\
  \ 如果你的公司已经是 Salesforce 的客户，考虑使用它的帮助台功能来实现帮助台的自动化。\n\n第 16 章\n\n## 使用组策略\n\n### 本章内容\n\
  \n*   查看组策略概念\n*   在 Windows Server 上启用组策略\n*   创建、过滤和强制执行策略对象\n\n`Group Policy`\
  \ 是 Windows 操作系统的一个功能，允许你控制整个网络中 Windows 以及其他微软软件某些方面的工作方式。你可以在管理控制台中发现许多功能（例如 `Active\
  \ Directory Users and Computers`）实际上是由 `Group Policy` 控制的。例如，你必须使用 `Group Policy`\
  \ 来控制用户更改密码的频率，以及密码必须的复杂程度。因此，`Group Policy` 是任何 Windows 网络管理员的重要工具。\n\n遗憾的是，`Group\
  \ Policy` 可能是个令人生困惑的怪兽。所以，如果你发现这一章比其他章节更混乱，不要气馁。在你花时间实际操作之后，`Group Policy` 会变得清晰。\n\
  \n## 理解组策略\n\n简单来说：`policy` 定义了特定 Windows 功能的配置选项。每个策略都指定了 Windows 或其他微软软件的某些方面应如何配置。例如，策略可以指定任何用户启动\
  \ Internet Explorer 时初始显示的主页。当用户登录域时，该策略会被检索并应用到该用户的 Internet Explorer 配置中。\n\n\
  特定策略的生效是通过 `Group Policy Object`（简称 `GPO`）来实现的。`GPO` 是一个或多个策略的集合，适用于计算机或用户。例如，单个\
  \ `GPO` 可以设置默认的 Internet Explorer 主页，还可以设置 Internet Explorer 安全选项。当该 `GPO` 应用于计算机或用户时，`GPO`\
  \ 中包含的所有策略都会被应用。\n\n适用于计算机的 `GPO` 将对该计算机的所有用户生效，而适用于用户的 `GPO` 无论该用户登录哪台计算机都将对该用户生效。作为网络管理员，你主要关注的是适用于用户的策略。但计算机策略有时也有用。\n\
  \n要使用 `Group Policy`，你必须学会两件事：(1) 创建单独的 `GPOs` 以指定你想应用哪些策略，然后 (2) 将这些 `GPOs` 应用——或*链接*（link）到用户和计算机。这两项任务都可能有点棘手。\n\
  \n\n\n\n\n创建 GPO（组策略对象）的技巧在于找到你想使用的特定策略或多个策略。在数千计的可用策略中寻找某个特定策略可能会令人沮丧。假设你想强制所有网络用户每\
  \ 30 天更改一次密码。你的用户会恨死你，但你还是决定这样做这样做。好消息是，你知道有一个策略可以实现这一点。坏消息是，你不知道去哪里找到它。在在本章的后半部分，你将可以在标题为“创建组策略对象”的章节中找到处理组策略的这方面的帮助。\n\
  \n创建 GPO 后，你将面临将其链接到你希望应用它的用户或计算机的任务。创建一个适用于所有用户或计算机的 GPO 是足够简单的。但如果你想更具选择性，情况就会变得复杂——例如，如果你想让\
  \ GPO 仅适用于特定组织单元（OU）中的用户或属于特定组的用户。在在本章的后半部分，你将可以在标题为“筛选组策略对象”的章节中找到处理组策略的这方面的帮助。\n\
  \n## 在 Windows Server 2019 上启用组策略管理\n\n在 Windows Server 2019 上使用组策略之前，你必须在服务器上启用组策略。该过程非常简单，且每台服务器只需执行一次。以下是步骤：\n\
  \n1. 在服务器管理器（Server Manager）中，点击`添加角色和功能`。\n2. 按照向导操作直到进入“选择功能”页面，该页面如图图 16-1 所示。![在\
  \ Windows Server 2019 上启用组策略管理的快照。](img/9781119648505-fg1601.png)\n   图 16-1： 在\
  \ Windows Server 2019 上启用组策略管理。\n3. 如果“组策略管理”复选框尚未勾选，请勾选它。\n4. 点击`下一步`。\n5. 当确认页面出现时，点击`安装`。\n\
  \   请耐心；安装可能需要几分钟。\n6. 点击`关闭`。\n   大功完成！\n\n完成此过程后，服务器管理器“工具”菜单上会出现一个名为`组策略管理`的新命令。\n\
  \n## 创建组策略对象\n\n创建 GPO 的最简单方法是使用组策略管理控制台（Group Policy Management Console），你可以通过在服务器管理器中选择`工具\
  \ ⇒ 组策略管理`来运行。\n\n单个 GPO 可以由一个设置或多个独立的组策略设置组成。组策略管理控制台通过几个类别提供了数千个可供使用的组策略设置。你对组策略使用得越多，这些类别就越容易理解。当你开始操作时，预计你会花费大量时间在策略列表中寻找你需要的那个特定策略。\n\
  \n学习如何使用组策略管理控制台的最简单方法是使用它创建一个简单的 GPO。在接下来的过程中，我将向你展示如何创建一个定义策略的 GPO，该策略对域中的所有计算机启用\
  \ Windows 更新，以便用户无法禁用 Windows 更新。\n\n1. 在服务器管理器中，选择`工具 ⇒ 组策略管理`。\n   组策略管理控制台出现，如图\
  \ 16-2 所示。\n   ![组策略管理控制台的快照。](img/9781119648505-fg1602.png)\n   图 16-2： 组策略管理控制台。\n\
  2. 在导航窗中，展开“域”节点直到你的域节点，然后选择该域的“组策略对象”节点。\n3. 右键点击“组策略对象”节点，然后从出现的上下文菜单中选择`新建`。\n\
  \   此命令将调出如图 16-3 所示的对话框。\n   ![创建新组策略对象的快照。](img/9781119648505-fg1603.png)\n  \
  \ 图 16-3： 创建新的 GPO。\n4. 为 GPO 输入一个名称，然后点击`确定`。\n   对于此示例，输入类似 `Windows Update` 的内容作为管理\
  \ Windows 更新功能的 GPO 名称。\n   当你点击`确定`时，GPO 被创建并出现在组策略管理窗口的“组策略对象”部分。\n5. 双击新的 GPO。\n\
  \   GPO 打开，如图 16-4 所示。请注意，在此阶段，GPO 的“位置”部分没有列出任何活动目录（Active Directory）对象。因此，此 GPO\
  \ 尚未链接到任何活动目录域或组。我稍后介绍这个主题。首先，为新的 GPO 创建策略设置。\n   ![新组策略对象页面的快照。](img/9781119648505-fg1604.png)\n\
  \   图 16-4： 一个新的 GPO。\n6. 点击`设置`选项卡。\n   短暂出现“正在生成报告”的消息，然后显示策略设置，如图 16-5 所示。\n\
  \   ![组策略对象策略设置的快照。](img/9781119648505-fg1605.png)\n   图 16-5： 策略设置。\n7. 右键点击`计算机配置`，然后从上下文菜单中选择`编辑`。\n\
  \   此命令将打开组策略管理编辑器，如图 16-6 所示，你可以在其中编辑计算机配置策略。\n   ![编辑组策略对象的快照。](img/9781119648505-fg1606.png)\n\
  \   图 16-6： 编辑 GPO。\n8. 在导航窗中，导航到`计算机配置 ⇒ 管理模板 ⇒ Windows 组件 ⇒ Windows 更新`。\n   此步骤将打开\
  \ Windows 更新策略，如图 16-7 所示。\n   ![Windows 更新策略的快照。](img/9781119648505-fg1607.png)\n\
  \   图 16-7： Windows 更新策略。\n9. 双击`配置自动更新`。\n   此步骤将调出配置自动更新对话框，如图 16-8 所示。\n10. 选择`已`以启用该策略。\n\
  11. 按照你的意配置 Windows 更新。\n    对于此示例，我配置 Windows 更新为每天凌晨 3 点下载。\n12. 点击`确定`。\n   \
  \ 你返回到组策略管理编辑器。\n13. 关闭组策略管理编辑器。\n    此步骤将你返回组策略管理窗口。\n14. 右键点击`计算机配置`，并从上下文菜单中选择`刷新`。\n\
  \    策略设置已可见，如图 16-9 所示。（为了显示策略的细节，我展开了管理模板和 Windows 组件部分。）\n15. 在组策略管理窗口的导航窗中，将新的\
  \ Windows Update GPO 拖到顶级域（在本例中为 `lowewriter.pri`）。\n    当你松开鼠标时，会出现如图 16-10 所示的对话框。\n\
  \    ![确认范围的快照。](img/9781119648505-fg1610.png)\n    图 16-10： 确认范围。\n16. 点击`确定`。\n\
  \    域已添加到范围，如图 16-11 所示。\n17. 关闭组策略管理窗口。\n    新的 GPO 现在已生效。\n\n\n\n\n\n![域已添加到范围的快照。](img/9781119648505-fg1611.png)\n\
  \n图 16-11： GPO 已完成。\n\n## 过滤组策略对象\n\n组策略最令感到困惑的方面之一是，尽管它适用于用户和计算机，但你并不将 GPO 与用户或计算机关联。相反，你将\
  \ GPO 链接到站点、域或组织单位（OU）。从初看之下，这一方面似乎限制了组策略的实用性。对于大多数简单的网络，你大部分会在域级别上处理组策略，偶尔在 OU\
  \ 级别上处理。站点级 GPO 仅用于非常大或复杂的网络。\n\n如果你必须手动为域内的每个用户或计算机分配相同的 GPO，那么组策略将不会大有用处。尽管 OU\
  \ 可以帮助拆分组策略的分配，但即使这种能力也是有限的，因为特定的用户或计算机只能成为一个 OU 的成员。幸运的是，GPO 可以拥有 `filters`（过滤器），以进一步细化\
  \ GPO 适用于哪些用户或计算机。虽然你可以过滤 GPO 使其仅适用于单个用户或计算机，但你更有可能使用组来应用你的 GPO。\n\n假设你想使用组策略为 Internet\
  \ Explorer 分配两个不同的默认主页。对于营销部门，你希望默认主页是 [`www.dummies.com`](http://www.dummies.com)，但对于会计部门，你希望默认主页是\
  \ [`www.beancounters.com`](http://www.beancounters.com)。你可以通过在 Active Directory\
  \ 用户和计算机中创建名为 `Marketing` 和 `Accounting` 的两个组，并将营销和会计用户分配到相应的组，来轻松地完成这项任务。接下来，你可以创建两个\
  \ GPO：一个用于营销部门的主页，另一个用于分配会计部门的主页。然后，你可以将这两个 GPO 都链接到域，并使用过滤器指定每个策略适用于哪个组。\n\n对于接下来的步骤，我创建了两个组策略，命名为\
  \ `IE Home Page Dummies` 和 `IE Home Page Beancounter`，以及两个 Active Directory 组，名为\
  \ `Marketing` 和 `Accounting`。以下是过滤这些策略以将其正确链接到组的步骤：\n\n1. **选择 开始 ⇒ 管理工具 ⇒ 组策略管理。**\n\
  出现组策略管理控制台。（复习其外观请参考图 16-2。）\n\n2. **在导航窗格中，导航到你要应用过滤器的 GPO。**\n在本例中，我导航到 `IE Home\
  \ Page Dummies` GPO，如图 16-12 所示。\n\n3. **在“安全过滤”部分，点击“已验证的用户”，然后点击“删除”。**\n此步骤删除“已验证的用户”，以便\
  \ GPO 不会应用于所有用户。\n\n![组策略对象 IE Home Page Dummies 的快照。](img/9781119648505-fg1612.png)\n\
  \n图 16-12： IE Home Page Dummies GPO。\n\n4. **点击“添加”。**\n此步骤将弹出“选择用户、计算机或组”对话框，如图\
  \ 16-13 所示。\n\n![选择用户、计算机或组对话框的快照。](img/9781119648505-fg1613.png)\n\n图 16-13： 选择用户、计算机或组对话框。\n\
  \n5. **在文本框中输入 `Marketing` 然后点击“确定”。**\nGPO 已更新，指示它适用于 `Marketing` 组的成员，如图 16-14\
  \ 所示。\n\n6. **对 IE Home Page Beancounter GPO 重复步骤 2 到 5，将其应用于 `Accounting` 组。**\n\
  你已经完成了！\n\n![使用过滤器的组策略对象的快照。](img/9781119648505-fg1614.png)\n\n图 16-14： 使用过滤器的 GPO。\n\
  \n## 强制更新组策略\n\n处理组策略时最令人沮丧的方面之一是等待你所做的策略更改真正生效。默认情况下，Windows 每当用户登录时会自动应用组策略。在用户登录后，Windows\
  \ 每隔 90 分钟检查一次组策略的更改。（你可以通过更改`Set Group Policy Refresh Interval for Computers`策略来更改默认间隔，该策略位于计算机配置 ⇒ 管理模板 ⇒ 系统 ⇒ 组策略。）\n\
  \n你可以通过打开命令提示符（按开始，输入 `cmd`，按 Enter）并输入以下命令随时强制刷新组策略：\n\n```\nGPUPDATE\n```\n\n\
  此命令强制立即刷新所有 GPO。\n\n注意，此命令仅在运行它的计算机上有效；它不会影响你网络上的其他计算机。你可以通过在组策略管理控制台中右键点击组织单位，并选择`组策略更新`命令，在\
  \ Active Directory 组织单位中的所有计算机上强制执行组策略更新。\n\n![警告](img/warning.png) 与所有组策略更改一样，在强制更新所有计算机之前，请确保你已在有限数量的计算机上测试了你的更改！\n\
  \n# 第 17 章：管理软件部署\n\n### 本章内容\n\n- ![Bullet] 理解软件许可证类型\n- ![Bullet] 使用许可证服务器\n-\
  \ ![Bullet] 探索部署选项\n- ![Bullet] 保持补丁和服务包的最新更新\n\n任何网络管理员的一项至关重要的任务都是管理整个网络中用户使用的各种软件碎片。你的网络大部分（如果不是全部）用户都会在他们的计算机上安装一个版本的\
  \ Microsoft Office。根据业务类型，其他软件可能会被广泛使用。例如，会计师需要会计软件，工程公司需要工程软件，以此类推……\n\n购买一个计算机程序副本并自由地安装到网络中每台计算机上的日子早已远去。大多数软件都有一个内置功能——通常称为`copy\
  \ protection`（复制保护），旨在防止此类滥用。即使在没有复制保护的情况下，几乎所有软件销售时都带有许可协议，规定了你可以在多少台计算机上安装和使用该软件。因此，管理软件许可证是网络管理的重要部分。\n\
  \n某些软件程序具有许可证功能，使用服务器计算机来调节同时运行软件的用户数。作为网络管理员，你的工作是设置许可证服务器并保持其运行。\n\n在网络上管理软件的另一个方面是找到在多台计算机上安装软件的最快捷方法。你最不想做的事情是在网络中的每台计算机上单独手动运行软件的安装程序。相反，你希望利用网络本身来辅助软件的部署。\n\
  \n最后，你希望确保安装在整个网络中的软件程序都与供应商提供的最新补丁和更新保持同步。\n\n本章将详细阐述这些网络软件管理的各个方面。\n\n## 理解软件许可证\n\
  \n与流行观点相反，你并不是真的购买了软件。相反，你购买的是使用软件的权利。当你从商店购买计算机程序时，完成购买后你真正拥有的只是软件的包装盒、录制软件的光盘，以及一份允许你根据软件供应商提供的条款使用软件的许可证。软件本身仍然归供应商所有。\n\
  \n\n\n\n这意味着你有义务遵守随附软件的许可协议条款。很少有人在购买和使用软件之前实际上会阅读软件协议的完整文本。如果你确实这样做了，你会发现一份典型的协议包含以下限制，例如：\n\
  \n*   `你被允许在一台且仅限一台计算机上安装软件。` 某些许可协议对此规则有特定的例外，允许你在工作的一台电脑和家里的一台电脑上安装软件，或者在一台台式电脑和一台笔记本电脑上安装，前提是这两台电脑由同一个人使用。然而，大多数软件许可都遵循“单电脑规则”。\n\
  *   `许可协议可能允许你对光盘制作备份副本。` 不过，你可以制作的备份副本数量可能限制在一个或两个。\n*   `你不允许对软件进行反向工程。` 换句话说，你不能使用编程工具解剖软件以学习其工作原理的秘密。\n\
  *   `某些软件限制了其用途类型。` 例如，你可能会购买一个禁止商业用途的程序学生版或家庭版。某些软件——例如 Oracle 的 `Java`——禁止核设施使用它。\n\
  *   `某些软件具有出口限制，防止你将其带出该国。`\n*   `几乎所有的软件许可都将软件供应商的责任限制为更换缺陷安装光盘。` 换句话说，软件供应商对软件中的漏洞可能造成的任何损坏不负责。在少数情况下，这些许可限制在法院中被撤销，公司被认为对缺陷软件造成的损害负责。但在大多数情况下，使用软件的风险自担。\n\
  \n在许多情况下，软件供应商会提供几种不同类型的许可供你选择。当你购买用于网络使用的软件时，你需要了解这些许可类型之间的区别，以便决定获取哪种类型的许可。以下是最常见的类型：\n\
  \n*   `零售版（Retail）：` 你直接从软件供应商、本地商店或在线商店购买的软件。零售软件许可通常允许单个用户安装和使用软件。根据协议，该许可可能允许该用户在两台计算机上安装软件——一台在工作，一台在家里。关键点是只能有一个用户可以使用该软件。（然而，在多个用户共享的计算机上安装软件通常是可以接受的。在这种情况下，只要他们一次只使用一个，多个用户就可以使用该软件。）\n\
  \    零售许可的主要益处是，当用户升级其计算机时，许可会随用户移动。换句话说，如果你买了新计算机，你可以从旧计算机上删除软件并将其安装到新计算机上。\n*\
  \   `原始设备制造商（OEM）：` 由计算机制造商安装在新计算机上的软件。例如，如果你从 `Dell` 购买了计算机并随电脑订购了 `Microsoft Office\
  \ Professional`，你获得的是一个 `OEM` 许可。关于 `OEM` 许可最重要的点是，它仅适用于你购买软件的特定计算机。你永远不被许可在购买软件的计算机之外任何计算机上安装该软件。\n\
  \    所以，如果有一天，你由于冲动将计算机从办公室五楼的窗户扔出去，计算机在下方的停车场摔成了碎片，那么你的 `OEM` 版 `Office` 基本上就永远丢失了。当你购买一台替换计算机时，你必须为新计算机购买新的\
  \ `OEM` 版 `Office` 许可。你不能在新计算机上安装旧软件。\n*   `批量版（Volume）：` 允许你在多一台计算机上安装和使用软件。最简单的批量许可类型仅规定了你可以在多少台计算机上安装软件。例如，你可能会购买一个\
  \ 20 用户版本的程序，它允许你在 20 台计算机上安装软件。通常，你需要遵守信誉制度以确保不超过数量。\n    ![提示](img/tip.png) 建立某种系统来跟踪此类软件许可。例如，你可以创建一个\
  \ `Microsoft Excel` 表格，在其中记录你为每个人安装软件的姓名。\n    批量许可许可可能会变得相当复杂。例如，`Microsoft` 提供了几种不同类型的批量许可计划，每种计划都有不同的定价、功能和权益。表\
  \ 17-1 总结了较流行的许可计划的功能。欲需更多信息，请参阅 [`www.microsoft.com/licensing`](http://www.microsoft.com/licensing/)。\n\
  *   `订阅版（Subscription）：` `订阅` 并不是一种独立的许可类型，而是批量许可的可选附加组件。支付的订阅费用使你在订阅期内（通常为年度）有权获得技术支持和免费产品升级。对于某些类型的产品，订阅还包括定期下载新数据。例如，防病毒毒软件通常包含一个定期更新你的病毒特征数据的订阅。如果没有订阅，杀毒软件将很快失效。\n\
  \    注意，传统上通过零售、`OEM` 或批量许可计划提供的许多类型软件正在向订阅计划演变。`Microsoft`（其 `Office 365`）、`Adobe`（其\
  \ `Creative Design Suite`）和 `Autodesk`（其 `AutoCAD` 系列产品）等供应商正在朝这个方向移动，其他公司也是如此。\n\
  \n| **计划** | **功能** |\n| --- | --- |\n| 开放许可 (Open License) | 最少购买五个最终用户许可。 |\n\
  | 开放价值 (Open Value) | 最少购买五个最终用户许可并在订阅期内（三年）获得免费升级。 |\n| 选择许可 (Select License) |\
  \ 这是一种为拥有 250 人或更多员工的公司设计的许可计划。 |\n| 企业级 (Enterprise) | 这是选择许可计划的替代方案，旨在以成本效益的方式为至少\
  \ 250 名员工的组织提供 `Windows`、`Office` 和某些其他程序。 |\n\nTABLE 17-1 微软批量许可计划\n\n## 使用许可服务器\n\
  \n某些程序允许你购买网络许可，使你能够在任意数量的计算机上安装软件，但限制任何时刻可以使用软件的人数。为了控制有多少人使用软件，会建立一个特殊的许可服务器。每当用户启动程序时，程序都会检查许可服务器以查看是否有可用许可。如果是，程序允许启动，许可服务器上的可用许可数量减一。稍后，当用户退出程序时，许可将返回服务器。\n\
  \n一种常用的许可服务器软件是由 `Flexera Software` 提供的 `FlexNet Publisher`。（该程序以前命名为 `FlexLM`，许多依赖它的程序仍以\
  \ `FlexLM` 的名分分发。）它被 `AutoCAD` 以及许多其他网络软件应用程序使用。`FlexNet Publisher` 使用软件供应商颁发的特殊许可文件来指示你购买了给定产品的多少许可。尽管许可文件是一个简单的文本文件，但其内容是晦涩的，并且是由只有软件供应商才能访问的程序生成的。以下是\
  \ `AutoCAD` 典型许可文件的示例：\n\n```\nSERVER server1 000ecd0fe359\nUSE_SERVER\nVENDOR adskflex\
  \ port=2080\nINCREMENT 57000ARDES_2010_0F adskflex 1.000 permanent 6 \\\nVENDOR_STRING=commercial:permanent\
  \ BORROW=4320\nSUPERSEDE \\\n```\n\n\n\n\n\n```\n`DUP_GROUP=UH ISSUED=07-May-2007\
  \ SN=339-71570316 SIGN=“102D 85EC 1DFE D083 B85A 46BB AFB1 33AE 00BD 975C 8F5C 5ABC\
  \ 4C2F F88C 9120 0FB1 E122 BA97 BCAE CC90 899F 99BB 23C9 CAB5 613F E7BB CA28 7DBF\
  \ 8F51 3B21\" SIGN2=\"033A 6451 5EEB 3CA4 98B8 F92C 184A D2BC BA97 BCAE CC90 899F\
  \ 2EF6 0B45 A707 B897 11E3 096E 0288 787C 997B 0E2E F88C 9120 0FB1 782C 00BD 975C\
  \ 8F5C 74B9 8BC1”\n```\n（别在这里产生任何奇思妙想。我更改了这个许可证文件中的数字，所以它实际上无法运行。我还没疯到去发布一个真实的有效的\
  \ AutoCAD 许可证文件！）\n\n选择使用许可证服务器的软件有一个缺点，当服务器不可用时，你必须采取特殊步骤才能运行软件。例如，如果你在笔记本电脑上安装了\
  \ AutoCAD，但你想在离开办公室时使用它该怎么办？在这种情况下，你有两个选择：\n\n- **使用虚拟专用网络 (VPN) 软件连接网络。** 接入 VPN\
  \ 后，许可证服务器将变为可用，你就可以使用该软件。（在第 24 章中阅读关于 VPN 的介绍。）\n- **借用许可证。** 当你借用许可证时，可以在断开网络的情况下限期使用软件。当然，借用的许可证会从服务器上的可用许可证数量中减去。\n\
  \n![Tip](img/tip.png) 在大多数情况下，许可证服务器是一个任务关键型应用程序——它和你网络上的任何其他功能一样重要。如果许可证服务器宕机，所有依赖它的用户都将无法工作。别担心——他们会通知你的。他们会排队在你门口，要求你什么时候能让许可证服务器重新运行，以便他们恢复工作。\n\
  \n由于许可证服务器提供了如此重要的功能，请对其倍加小心。确保许可证服务器软件运行在稳定、维护良好的服务器计算机上。不要在许可证服务器计算机上加载许多其他服务器功能。\n\
  \n并确保对它进行备份。如果可能，将许可证服务器软件安装在第二台服务器计算机上作为备份。这样，如果主许可证服务器计算机宕机且你无法恢复它，你就可以快速切换到备份许可证服务器。\n\
  \n## 部署网络软件\n\n在获取软件的正确许可证后，网络管理员的下一个任务是部署软件——即将软件安装在用户的计算机上，并配置软件使其在你的网络上高效运行。接下来的章节描述了向网络部署软件的几种方法。\n\
  \n### 手动部署软件\n\n大多数软件都以 CD 或 DVD 介质的形式发行，并带有一个你运行以安装软件的 `Setup` 程序。`Setup` 程序通常会向你提出一系列问题，例如你想将程序安装在哪里，你是想安装程序的所有功能还是只安装最常用的功能等。你可能还被要求输入序列号、注册码、许可证密钥或其他证明你购买了该软件的代码。在回答了所有问题后，`Setup`\
  \ 程序就会安装该程序。\n\n如果只有少数网络用户将使用某个程序，那么 `Setup` 程序可能是部署该程序最方便的方法。只需将安装介质带到你想安装程序的计算机上，将光盘插入\
  \ CD/DVD 驱动器，然后运行 `Setup` 程序即可。\n\n![Warning](img/warning.png) 当你完成从 CD 或 DVD 手动安装软件后，不要忘记从驱动器中取出光盘！把光盘留留在驱动器里很容易的，如果用户很少或从不使用驱动器，可能过了几周或几个月后才有人发现光盘丢失了。到那时，你将很难记得它在哪儿了。\n\
  \n### 从网络共享运行 Setup\n\n如果你计划在网络上的两台或三台计算机上安装程序，你会发现从网络共享运行 `Setup` 程序比从原始 CD 或 DVD\
  \ 运行容易得多。要这样做，请按照以下步骤操作：\n\n1. **创建一个网络共享并在共享内创建一个文件夹，用于存储 `Setup` 程序和其他安装程序所需的其他文件。**\n\
  \n   我通常会设置一个名为 `Software` 的共享，然后在这个共享中为我想要从网络提供的每个程序创建一个单独的文件夹。你应该为所有网络用户启用读取权限，但仅允许你自己和其他管理员拥有完全访问权限。\n\
  \n   在第 13 章中了解更多关于创建共享和权限的内容。\n\n2. **将程序 CD 或 DVD 的全部内容复制到步骤 1 中创建的文件夹中。**\n\n\
  \   为此，将 CD 或 DVD 插入计算机的 CD/DVD 驱动器。然后，使用 Windows 资源管理器选择光盘的所有内容并将其拖到你在步骤 1 中创建的文件夹中。\n\
  \n   或者，你可以点击开始，输入 `cmd`，按回车打开命令提示符。然后，输入如下命令：\n\n   ```\n   xcopy d:\\*.* \\\\\
  server1\\software\\someprogram\\*.* /s\n   ```\n\n在此示例中，`d:` 是你的 CD/DVD 驱动器器号，`server1`\
  \ 是你的文件服务器名称，`software` 和 `someprogram` 是你在步骤 1 中创建的共享和文件夹名称。\n\n3. **要在客户端计算机上安装程序，请打开\
  \ Windows 资源管理器窗口，导航到步骤 1 中创建的共享和文件夹，并双击 `Setup.exe` 文件。**\n\n   `Setup` 程序启动。\n\
  \n4. **按照 `Setup` 程序显示的说明操作。**\n\n   当 `Setup` 程序完成后，软件即可使用。\n\n![Warning](img/warning.png)\
  \ 将 `Setup` 程序复制到网络共享可以避免你忍受将安装光盘带到每台需要安装软件的计算机上的烦恼。但这不能免除为每台计算机购买有效许可证的烦恼！在超过从供应商处获得的许可证允许的计算机数量安装软件是违法的。\n\
  \n### 静默安装\n\n将程序安装介质的内容复制到网络共享确实避免了你在各个计算机之间携带安装光盘的烦恼，但你仍然必须每台计算机上运行 `Setup` 程序并回答它所有烦人的问题。如果有一种方法可以自动化\
  \ `Setup` 程序，让它在你运行后无需你的任何进一步交互即可运行，那不是很好吗？对于许多程序，你可以做到。\n\n在某些情况下，`Setup` 程序本身有一个命令行开关可以导致它静默运行。你通常可以在命令提示符中输入以下内容来发现哪些命令行开关可用：\n\
  \n   ```\n   setup /?\n   ```\n\n   运气的话，你会发现 `Setup` 程序本身有一个开关，例如 `/quiet` 或 `/silent`，它可以使用程序的默认设置在无任何交互的情况下安装程序。\n\
  \n![Technical stuff](img/technicalstuff.png) 如果 `Setup` 程序没有提供任何命令行开关，不要绝望。下面的步骤描述了一种通常可以让你静默安装软件的技术：\n\
  \n1. **打开资源管理器窗口并导航到 `C:\\Users\\name\\AppData\\Local\\Temp`****\n\n   然后，删除此文件夹的全部内容。\n\
  \n   这是 `Temp` 文件夹，各种程序会在其中存放临时文件。Windows 可能不允许你删除此文件夹中的每个文件，但尽可能清空 `Temp` 文件夹作为开始此过程的一个好主意。\n\
  \n2. **运行 `Setup` 程序并按照安装步骤操作直到最后一步。**\n\n   ![Warning](img/warning.png) 当你到达显示程序准备好安装软件的确认屏幕时，停止！*不要*点击\
  \ OK 或完成（Finish）按钮。\n\n\n\n\n\n3. **返回你在步骤 1 中打开的 `Temp` 文件夹，然后寻找，直到找到你在步骤 2 中运行的\
  \ Setup 程序创建的 `.msi` 文件。**\n\n`.msi` 文件是 Setup 运行以安装程序的实际 Windows 安装程序。它可能有一个晦涩懂的名字，例如\
  \ `84993882.msi`。\n\n4. **将 `.msi` 文件复制到网络共享目录，你希望从该位置在你的客户端计算机上安装程序。**\n\n例如，`\\\
  \\server1\\software\\someprogram`。\n\n5. **（可选）将 `.msi` 文件重命名为 `setup.msi`。**\n\n\
  这一步是可选的，但我更倾向于运行 `setup.msi` 而不是 `84993882.msi`。\n\n6. **使用记事本创建一个批处理文件，使用 `/quiet`\
  \ 参数运行 `.msi` 文件。**\n\n要创建批处理文件，请遵循以下步骤：\n\n1. 在存储 `.msi` 文件的文件夹中点击右键。\n2. 选择 `New`（新建）⇒\
  \ `Text Document`（文本文档）。\n3. 将文本文档重命名为 `setup.bat`。\n4. 右键点击 `setup.bat` 文件并选择 `Edit`（编辑）。\n\
  5. 在文件中添加以下行：\n   ```\n   setup.msi /quiet\n   ```\n6. 保存文件。\n\n现在，你可以通过进入创建 `setup.bat`\
  \ 文件的文件夹并双击 `setup.bat` 文件来安装软件了。\n\n### 创建管理安装映像\n\n某些软件（如 Microsoft Office 和 AutoCAD）附带工具，可以让你创建一个完全配置的静默安装程序，然后你可以使用该程序来静默安装软件。对于微软软件，这种静默安装程序被称为\
  \ `administrative installation image`（管理安装映像）。（注意，Office 的 OEM 版本不包含此功能。你需要购买批量许可证才能创建管理安装映像。）\n\
  \n要创建管理映像，你只需运行供应商提供的配置工具。该配置工具允许你选择在安装软件时希望应用哪些安装选项。然后，它会在你指定的网络共享上创建一个网络设置程序。随后，你可以通过打开\
  \ `Explorer`（资源管理器）窗口，导航到保存网络设置程序的网络共享，并运行该程序，在客户端计算机上安装软件。\n\n### 使用组策略推送软件\n\n\
  对于网络软件部署，你应该考虑的最后一个选项是使用 Windows 组策略向网络用户自动安装软件。组策略是 Windows Server 的功能，允许你创建分配给用户的策略。你使用\
  \ Windows 组策略功能来指定某些用户应该可以使用某些软件程序。\n\n注意，组策略实际上并不是分配给单个用户，而是分配给组织单元（OU），OU 用于在活动目录（Active\
  \ Directory）中对用户进行分类。因此，你可能会创建一个策略，指定会计部门 OU 中的每个人都应该拥有 Excel。\n\n然后，每当会计部门的任何人登录\
  \ Windows 时，Windows 都会检查用户计算机上是否安装了 Excel。如果 `not` 安装 Excel，Windows 就会在计算机上“发布”（Advertising）Excel。在计算机上\
  \ `发布` 软件意味着会将一小部分软件下载到计算机中——仅足以在开始菜单上显示该程序的图标，并将 Excel 与 Excel 文件扩展名（`.xls`, `.xlsx`）关联。\n\
  \n如果用户点击了已广告应用程序的开始菜单图标，或尝试打开与广告程序关联的文档，该应用程序将自动安装到用户的计算机上。用户需要在应用程序安装期间等待几分钟，但安装是自动的。\n\
  \n欲需有关设置组策略软件安装的更多信息，请在网上搜索 `Group Policy software`。\n\n## 保持软件更新\n\n每个网络管理员面临的烦恼问题之一就是应用软件补丁以保持操作系统和其他软件的更新。`software\
  \ patch`（软件补丁）是修复偶尔出现的微小故障的微型更新，例如细微的安全或性能问题。这些故障的影响不足以发布软件的新版本，但它们又重要到需要修复。大多数补丁修复了计算机黑客在不断试图破坏计算机世界时发现的安全漏洞。\n\
  \n每隔一段时间，所有所有发布的发布的补丁会被合并成一个服务包（service pack）。尽管最勤奋的网络管理员会在补丁发布时应用所有补丁，但许多管理员只是等待服务包。\n\
  \nWindows 包含了 `Windows Update` 功能，它会在补丁和服务包可用时自动安装它们。这些补丁不仅适用于 Windows，还适用于其他微软软件。要使用\
  \ `Windows Update`，点击开始按钮，输入 `Windows Update` 并按回车键。将出现 Windows Update 设置，如图 17-1\
  \ 所示。\n\n![Windows Update 窗口截图。](img/9781119648505-fg1701.png)\n\n图 17-1： Windows\
  \ Update。\n\n第 18 章\n\n# 移动设备管理\n\n本章内容\n\n- **查看移动设备**\n- **配置 Windows 移动设备以访问\
  \ Exchange**\n- **考虑安全影响**\n\n有一位计算机顾问曾在 eBay 上花 15.50 美元买了一台二手的 BlackBerry 设备。当他换上新电池并打开设备时，他发现里面包含了某知名金融机构高管的机密电子邮件和个人联系信息。\n\
  \n哎！\n\n事实证明，该公司的一名前高管在离开公司几个月后在 eBay 上卖掉了他的旧 BlackBerry。他本以为由于移除了电池，BlackBerry\
  \ 上的所有内容都已被擦除。\n\n这个真实故事的意义在于，智能手机和平板板电脑等移动设备为网络管理员带来了一系列特殊的挑战。现在即使是小型网络的管理员也面临着这些挑战。几年前，例如，只有大公司拥有与\
  \ Exchange 电子邮件集成的 BlackBerry 或其他移动设备。现在，只有少数员工的公司也拥有连接到公司网络的移动设备已不常见了。\n\n本章是对移动设备及其运行的操作系统的简要介绍，重点介绍\
  \ iPhone 和 Android 设备。你将了解到更多关于这些设备如何与 Exchange 电子邮件交互的信息，以及你可以采取哪些步骤来确保它们的安全性。\n\
  \n## 移动设备的多种类型\n\n从几何时起，有手机和 PDA。手机只是手机：一个你可以随身携带的手持电话。好的手机具有很棒的功能，如通话记录、通讯录，也许还有一个简单的游戏，但除此之外没别的了。PDA\
  \ —— `Personal Digital Assistants`（个人数字助理）是小型手持式计算机，旨在取代人们过去随身携带的老式日程记本（后者用于跟踪预约日历和通讯录）。\n\
  \n当移动运营商开始向其网络添加数据功能时，一切都改变了。现在手机可以拥有完整的移动网络访问功能。这一事实导致了手机增加了复杂的 PDA 功能，PDA 也增加了手机功能，使得两者之间的界限变得模糊。\n\
  \n\n\n\n\n`mobile device`（移动设备）可以是任何一种单手可以握住并通过无线网络连接的各种设备。`handheld`（手持设备）是此类设备的类似通用名称。以下列表描述了移动设备的一些最常见特点：\n\
  \n*   **手机（Mobile phone）：** 主要用途是提供电话服务。大多数手机还包括短信功能、通讯人录、日程日历和游戏；它们还可能提供互联网访问功能。\n\
  *   **智能手机（Smartphone）：** 智能手机是一种兼具手持电脑功能的手机。智能手机采用触屏，而不是物理按钮或按键。除了手机通常具备的功能外，智能手机还提供电子邮件、日历、联系人、任务列表和网络访问，以及可以在手机上购买和安装的应用程序。\n\
  *   **Android：** Android 是由 Google 开发的用于智能手机的开源操作系统（OS）。Android 是最受欢迎的智能手机平台，自 2015\
  \ 年以来销售的智能手机中超过 80% 都在使用它。\n*   **iOS：** iOS 是用于苹果流行的 iPhone 和 iPad 移动设备的操作系统。尽管在数量上少于\
  \ Android 设备，但许多人认为 iOS 设备比 Android 设备更具创新性。限制 iOS 市场份额的主要因素是成本：苹果设备的价格远高于同类的 Android\
  \ 设备。\n*   **黑莓（BlackBerry）：** 黑莓曾是智能手机领域的霸主。多年来，黑莓在移动设备市场上处于事实上的垄，因为它是第一款能够与 Microsoft\
  \ Exchange 良好同步的移动设备。现在 Android 和苹果设备的同步能力与黑莓一样好（实际上做得更好），黑莓设备已经过时了。然而，黑莓仍然存在，仍然有很多黑莓用户。（注意，较新的黑莓手机运行的是\
  \ Android 而不是旧的专有黑莓 OS。）\n\n# 考虑移动设备的安全性\n\n作为网络管理员，你移动设备的主要职责之一是保持它们的安全。遗憾的是，这是一项巨大的挑战。以下是一些原因：\n\
  \n*   **移动设备通过你无法控制的外部网络连接到你的网络。** 你可以尽很大努力设置防火墙、加密和其他许多安全功能，但移动设备是通过公共网络连接的，这些网络的管理员可能没有你这般负责。\n\
  *   **移动设备很容易丢失。** 用户可能会将智能手机留在餐厅或酒店，或者手机可能会在地铁上从口袋里掉出来。\n*   **移动设备运行的操作系统没有 Windows\
  \ 那样具有安全意识。**\n*   **那些不敢在自己的桌面电脑上安装违规软件的用户，完全不在意向他们的手持设备上下载免费游戏或其他应用程序。** 谁知道这些下载携带了什么样的病毒或木马？\n\
  *   **不可避免的是，有人会购买自己的手持设备并在你不知情或未经许可将其连接到你的网络。**\n\n以下是一些增强你移动设备安全性的建议：\n\n*   为移动设备建立明确、一致的策略并执行这些策略。\n\
  *   确保员工理解他们不允许将自己的设备带入你的网络。仅允许公司拥有的设备连接。\n*   培训用户了解使用移动设备相关的安全风险。\n*   为你的移动设备实施防病毒保护。\n\
  \n## 管理 iOS 设备\n\n2007 年，苹果 iPhone 作为许多年来来最具创新性的型设备之一进入了技术市场。在短短几年内，iPhone 夺取了巨大的市场份额，此前该市场几乎完全由\
  \ RIM 及其黑莓设备占据。从那时起，iPhone 在手机市场的份额已经超过了前任王者黑莓。\n\niPhone 的成功在很大程度上归于其名为 iOS 的操作系统的天才设计。2010\
  \ 年，苹果发布了 iPad，这是一种运行与 iPhone 相同 iOS 的平板电脑。2012 年，苹果推出了 iPad 的较小版本：iPad mini。这些设备统称为\
  \ `iOS devices`。\n\n## 理解 iPhone\n\niPhone 本质上是四种设备的结合：\n\n*   一部手机\n*   一个容量为 16GB\
  \ 到 512GB 的 iPod\n*   一台数字摄像机\n*   一个带有自带浏览器（`Safari`）和应用程序（如电子邮件、日历和联系人管理）的互联网设备\n\
  \niPhone 最直观的特征是它缺少键盘。相反，iPhone 的几乎整个正面都是高分辨率、触摸敏感的 LCD 显示屏。显示屏不仅是 iPhone 的主要输出设备，还是它的主要输入设备。显示屏可以变成拨打电话号码的数字键盘，或输入文本的键盘。你还可以使用各种手指手势，例如点击图标启动程序或通过捏合动作来缩放显示屏。\n\
  \niPhone 还具有其他几个创新功能：\n\n*   `accelerometer`（加速度计）跟踪 iPhone 在三个方向上的运动。加速度计的主要用途是根据用户握手机的方式将将屏方向从横屏调整为竖屏。其他一些应用程序（主要是游戏）也会使用加速度计。\n\
  *   Wi-Fi 接口让 iPhone 连接到本地 Wi-Fi 网络以获得更互联网访问。\n*   GPS 功能为许多应用程序（包括 Google 地图）提供位置感知。\n\
  *   虚拟专用网络（`VPN`）客户端让你连接到你的内部网络。\n\n在 iPhone 的所有独特功能中，最重要的可能是它庞大的第三方应用程序集合，这些程序可以从特殊的网页门户——App\
  \ Store 下载。其中许多应用程序是免费的，或只需几美元。（许多只需 99 美分或 1.99 美元。）截至本文编写时，App Store 提供了超过 180\
  \ 万应用程序——从业务生产力工具到游戏应有尽。\n\n## 理解 iPad\n\niPad 本质上是一个没有电话功能但屏幕更大的 iPhone。iPhone\
  \ 拥有 3.5 英寸屏幕；iPad 拥有 9.7 英寸屏幕；它较小的堂胞 iPad mini 拥有 7.9 英寸屏幕，而 iPad Pro 则拥有令人惊人的\
  \ 12.9 英寸屏幕。\n\n除了这些基本差异，iPad 与 iPhone 几乎相同。任何可以在 iPhone 上运行的应用程序都可以在 iPad 上运行，并且许多应用程序被设计为充分利用\
  \ iPad 更大的屏幕。\n\n本章接后的所有信息同样适用于 iPhone 和 iPad。\n\n# 将 iOS 设备集成到 Exchange\n\niOS\
  \ 设备可以通过 Exchange ActiveSync 功能与 Microsoft Exchange 电子邮件集成，该功能自 2010 年以来的所有 Exchange\
  \ 版本中均默认启用。\n\n要验证单个邮箱箱的 Exchange ActiveSync 功能，请遵循以下步骤：\n\n1.  **选择 开始 ⇒ 管理工具 ⇒\
  \ Active Directory 用户和计算机。**\n    打开 Active Directory 用户和计算机控制。\n2.  **展开域，然后找到你想要启用移动访问的用户。**\n\
  3.  **右键点击该用户，然后从上下文菜单中选择“属性”。**\n4.  **点击“Exchange 功能”选项卡。**\n    显示 Exchange 功能选项，如图\
  \ 18-1 所示。\n    ![为用户启用 Exchange ActiveSync 的截图](img/9781119648505-fg1801.png)\n\
  \    图 18-1： 为用户启用 Exchange ActiveSync。\n5.  **确保已启用 Exchange ActiveSync 选项。**\n\
  \    如果选项尚未启用，右键点击每个选项并从上下文菜单中选择“启用”。\n6.  **点击确定。**\n\n\n\n\n\n7. **对于任何其他想要启用移动访问的用户，重复步骤\
  \ 5 和 6。**\n\n8. **关闭“活动目录 用户和计算机”。**\n\n这些操作就这些了。在启用这些功能后，任何运行 Windows Mobile 的用户都可以将其手持设备与他们的\
  \ Exchange 邮箱箱进行同步。\n\n### 为 iOS 设备配置 Exchange 电子邮件\n\n在为邮箱箱启用 ActiveSync 后，你可以按照以下步骤配置\
  \ iPhone 或 iPad 连接 Exchange 帐户：\n\n1. **在 iPhone 或 iPad 上，点击“设置”，然后点击“邮件、联系人、日历”。**\n\
  \n   出现如图 18-2 所示屏幕。此屏幕列出了手机上可能已配置的现有电子邮件帐户，并允许你添加新帐户。\n\n   ![手机上可能已配置的现有电子邮件帐户列表快照，允许用户添加帐户。](img/9781119648505-fg1802.png)\n\
  \n   图 18-2： 添加电子邮件帐户。\n\n2. **点击“添加帐户”。**\n\n   出现如图 18-3 所示的屏幕，允许你选择想要添加的电子邮件帐户类型。\n\
  \n3. **点击“Exchange”。**\n\n   出现如图 18-4 所示的屏幕，你可以在其中输入 Exchange 帐户的基本信息。\n\n   ![iPhone\
  \ 支持的多种类型电子邮件帐户的快照。](img/9781119648505-fg1803.png)\n\n   图 18-3： iPhone 支持多种类型的电子邮件帐户。\n\
  \n   ![输入电子邮件地址和密码的快照。](img/9781119648505-fg1804.png)\n\n   图 18-4： 输入你的电子邮件地址和密码。\n\
  \n4. **输入你的电子邮件地址、密码和帐户说明。**\n\n5. **点击“下一步”。**\n\n   出现如图 18-5 所示的屏幕。\n\n   ![输入\
  \ Exchange 服务器信息的快照。](img/9781119648505-fg1805.png)\n\n   图 18-5： 输入你的 Exchange\
  \ 服务器信息。\n\n6. **在“服务器”字段中，输入你的 Exchange 服务器的 DNS 名称或 IP 地址。**\n\n   例如，我为 Exchange\
  \ 服务器输入了 `smtp.lowewriter.com`。\n\n7. **在相应的字段中输入你的域名、Windows 用户名和你的 Windows 密码。**\n\
  \n8. **点击“下一步”。**\n\n   出现如图 18-6 所示的屏幕。在这里，你选择想要同步的邮箱箱功能：邮件、联系人、日历、提醒和/或备忘录。\n\n\
  9. **选择你想同步的功能，然后点击“完成”。**\n\n   电子邮件帐户已创建。\n\n配置好电子邮件帐户后，用户可以通过 iPhone 屏幕上的邮件图标访问它。\n\
  \n   ![选择要同步的功能的快照。](img/9781119648505-fg1806.png)\n\n   图 18-6： 选择要同步的功能。\n\n##\
  \ 管理 Android 设备\n\n本节是对 Android 平台的简要介绍。你将了解到 Android 到底是什么，并发现在 Android 手机上设置 Exchange\
  \ 电子邮件访问的步骤。\n\nAndroid 手机和 iPhone 之间存在关键差异。最重要的区别——在许多方面，也是*唯一*的差异区别——是 Android\
  \ 手机基于源自 Linux 的开源操作系统，该系统可以扩展并适配以运行在来自不同供应商的各种设备上。对于 iPhone，你被限制在 Apple 硬件上。但对于\
  \ Android 手机，你可以从各种制造商购买硬件。\n\n### 查看 Android 操作系统\n\n大多数人将 Android 操作系统与 Google\
  \ 联系在一起，Google 确实是 Android 背后的驱动力。Android 操作系统是由开放手机联盟（OHA）管理的开源操作系统。Google 在 Android\
  \ 的开发中仍起着重要作用，但有 50 多家公司参与了 OHA，包括硬件制造商（如 HTC、Intel 和摩托罗拉）、软件公司（如 Google 和 eBay）以及移动运营商。\n\
  \n![技术细节](img/technicalstuff.png) Android 操作系统是由开放手机联盟（OHA）管理的开源操作系统。Android 操作系统是，是\
  \ Android 手机基于源自 Linux 的开源操作系统，该系统可以扩展并适配以运行在来自不同供应商的各种设备上。对于 iPhone，你被限制在 Apple\
  \ 硬件上。但对于 Android 手机，你可以从各种制造商购买硬件。除了所有操作系统提供的基本功能外，Android 还有一些额外功能：\n\n* 优化的图形引擎，可以产生\
  \ 2D 和 3D 图形\n* GPS 功能，可以与 Google Maps 等集成\n* 罗针和加速度计功能，可以判断手机正在移动以及朝哪个方向移动\n* 内置\
  \ SQL 数据库用于数据存储\n* 支持多种网络技术，包括 3G、4G、蓝牙和 Wi-Fi\n* 内置媒体支持，包括常见的图像、音频和视频格式\n\n###\
  \ 浏览 Android 应用程序\n\nAndroid 操作系统预装了若干应用程序，提供了大多数人对智能手机的需求。这些应用程序包括：\n\n* **拨号**：提供让用户通话的基本手机功能。\n\
  * **浏览器**：内置网络浏览器，类似于 Google Chrome 浏览器。\n* **信息**：提供短信（SMS）和多媒体短信（MMS）。\n* **邮件**：一个基础电子邮件客户端，与\
  \ Google Gmail 配合最好，但也可以配置为与包括 Exchange 在内的其他服务器工作。\n* **联系人**：提供联系人列表，并与拨号和电子邮件应用程序集成。\n\
  * **相机**：允许使用手机摄像头硬件（如果有）拍摄照片。\n* **计算器**：一个简单的计算器应用程序。\n* **闹钟**：一个基础闹钟。你可以设置三个不同的闹钟。\n\
  * **地图**：Google Maps 的集成版本。\n* **YouTube**：YouTube 的集成版本。\n* **音乐**：类似于 iPod 的 MP3\
  \ 播放器。你可以从亚马逊购买并音乐文件。\n* **Google Play**：允许为 Android 手机购买并下载第三方应用程序。\n* **设置**：让你控制手机的各种设置。\n\
  \n\n\n\n灾难计划。\n\n第 19 章\n\n# 欢迎来到网络安全\n\n本章内容\n\n![Bullet](img/check.png) **评估安全风险**\n\
  \n![Bullet](img/check.png) **确定你的基础安全哲学**\n\n![Bullet](img/check.png) **物理保护你的网络设备**\n\
  \n![Bullet](img/check.png) **考虑用户账户安全**\n\n![Bullet](img/check.png) **研究其他网络安全技术**\n\
  \n![Bullet](img/check.png) **确保你的用户安全**\n\n作为一名 IT 专业人员，网络安全是最可能让你彻夜难眠的事情。考虑以下场景：\n\
  \n*   一个下午 3 点，你的手机开始疯狂响响，因为网络上的任何人都无法访问他们的任何文件。你很快发现你的网络已被`勒索软件`渗透，这是一种恶性软件，加密了你网络上的每一个字节的数据，导致在你支付赎金恢复数据之前，这些数据对你的用户来说毫无用。\n\
  \n*   你的公司成为了 CNN 的头条，因为一次安全泄露导致了客户信用卡信息被盗。\n\n*   在上班的最后一天，一个不满的员工将公司的联系列表和其他重要的知识产权拷贝到闪存盘中，连同他的\
  \ Swingline 订书机一起离开了。几个月后，你的公司与这个混蛋现在工作的公司竞争，输掉了最大的合同。\n\n你无法绝对防止此类场景的发生，但通过适当的安全措施，你可以大大降低它们发生的概率。幸运的是，所有现代操作系统都内置了网络安全的安全防护措施，即使有人破门而入也能阻止他们偷取你的文件。\n\
  \n本章简要概述了保护网络时涉及的内容。你将在部分的其余章节中找到更多细节。第 20 章 深入探讨了使用防火墙和防病毒软件保护你的用户免受互联网危险的细节。第\
  \ 21 章 探索了防止坏人通过电子邮件渗透你的网络的方法。而第 22 章 和 223 章 查看了你在遭遇成功的网络攻击或其他灾难时需要使用的工具。\n\n##\
  \ 你需要安全吗？\n\n大多数小型网络位于小型企业或部门，那里每个人都认识并信任其他人。人们在休息喝咖啡时不会锁上办公桌，尽管每个人都知道备用金箱在哪里，但钱从未消失过。\n\
  \n在像这样世外桃源的环境中，网络安全不是必要的，对吧？你觉得它是必要的。以下是为什么任何网络在建立时至少应该考虑安全问题的原因：\n\n*   即使在最友好的办公环境中，某些信息也是且应当是机密的。如果这些信息存储在网络上，你希望将它们存储在仅供授权用户访问的目录中。\n\
  \n*   并非所有的安全泄露都是恶意的。网络用户可能经常扫描文件，并遇到一个不熟悉的文件名。用户可能会打开该文件，结果发现它包含机密人事信息、精彩的办公室八卦或你的简历。好奇心而非恶意往往是安全泄露的根源。\n\
  \n*   当然，现在办公室里的每个人都是值得信任的。然而，如果有人变得不可信了呢？注：原文此处似乎存在大量重复和逻辑混乱，翻译时已按原文意图处理）。\n\n\n\
  \n“闭门策略”（closed door approach）会带来更强的安全性，但可能导致“沉默锥综合征”（Cone of Silence Syndrome）：就像\
  \ Max 和长官在沉默锥内虽然听不见对方说话但仍在交流一样，你的网络用户会不断抱怨无法访问所需的信息。结果，你会发现自己经常需要调整用户的访问权限。只有当你的网络包含大量敏感信息，且你愿意投入时间管理网络安全策略时，才选择闭门策略。\n\
  \n你可以将“开门策略”视为一种 `权限模型`（entitlement model），其基本假设是用户有权访问网络。相比之下，闭门策略是一种 `许可模型`（permissions\
  \ model），其基本假设是用户对任何东西都没有权限，访问每个网络资源都必须获得许可。\n\n![技术细节](img/technicalstuff.png)\
  \ 如果你从未听说过“沉默锥”，请前往 YouTube ([www.youtube.com](http://www.youtube.com/)) 并搜索“Cone\
  \ of Silence”。你会找到几段原剧《妙计妙谍》（Get Smart）的片段。\n\n## 物理安全：锁好你的门\n\n任何计算机网络的第一级安全是`物理安全`。当我走进一家会计师事务所接待区，看到前台桌放着一台无人看管的电脑时，我感到非常惊讶。通常，前台人员登录系统后离开了座位，让电脑处于无人监管的状态。\n\
  \n物理安全对于工作站很重要，但对于服务器来说至关重要。如果任何优秀的黑客能够获得服务器的物理访问，他们迅速击败除最偏执的安全措施以外的一切。为了保护服务器，请遵循以下指南：\n\
  \n* 锁上机房门。\n* 只给给你信任的人。\n* 记录谁持有钥匙。\n* 将服务器安装在带有锁的机箱或机架上。\n* 在机房里养一只受过训练的警报狗，只给它足够的保持饥饿和愤怒的食物即可。（开玩笑的。）\n\
  \n![记住](img/remember.png) “带锁的门”和“锁上的门”之间有巨大的区别。如果不使用锁，锁就毫无用处。\n\n客户端计算机应该在物理上安全：\n\
  \n* 指示用户在登录且解锁状态下不要离开无人监管的电脑。用户每当离开座位时（即使只有片刻），也应该锁定电脑。（要锁定电脑，请同时按下 `Windows 键`\
  \ 和 `L`。）\n* 在人流量大的区域（如前台桌），如果电脑带有钥匙锁，用户应使用钥匙锁电脑。\n* 用户离开时应锁好办公室门。\n\n![警告](img/warning.png)\
  \ 这里还有一些你可能没有考虑到的对物理安全的威胁：\n\n* 夜间清洁小组可能对你的设施拥有完全的访问权限。你如何知道每天晚上为你办公室打扫的人实际上是在为你的主要竞争对手工作，或者他们并不把计算机黑客视为一种业余爱好？你并不知道，所以要把清洁小组视为一种威胁。\n\
  * 你的垃圾怎么办？纸碎机不仅仅是给安然公司的会计师用的。你的垃圾桶可能包含各种有用信息：销售报告、安全日志、公司安全策略的打印副本，甚至是手写的密码。为了获得最好的安全性，每一张通过垃圾桶离开大字的纸都应该先经过粉碎机。\n\
  * 你把备份磁带存在哪里？不要只把它们堆在服务器旁边。这不仅让它们容易被盗，而且违背了最初备份数据的初目的之一：保护服务器免受火灾等物理威胁的影响。如果火灾烧了你的机房，而备份磁带毫无保护地堆放在服务器旁边，你的公司可能会破产，你肯定会失去工作。请将备份磁带安全地存在防火箱内，并在异地保留一份。\n\
  * 我见过一些网络，服务器在锁锁的机房里，但集线器或交换机却在一个不安全的柜子里。记住，集线器或交换机上的每个未使用的端口都代表通向你网络的门。集线器和交换机应该像服务器一样受到保护。\n\
  \n## 保护用户账户\n\n除了物理安全，谨慎使用用户账户是你的网络最重要的安全类型。配置妥当的用户账户可以防止未经授权的用户访问网络，即使他们获得了网络的物理访问权限。以下章节描述了你可以采取的一些步骤来加强网络对用户账户的使用。\n\
  \n### 混淆你的用户名\n\n哈？涉及到安全时，`混淆`（obfuscation）简单意味着选择晦涩的用户名。例如，大多数网络管理员根据用户名和姓的某种组合来分配用户名，例如\
  \ `BarnyM` 或 `baMiller`。然而，如果黑客知道至少一个员工的名字，就可以很容易猜出这样的用户 ID。在黑客知道用户名后，就可以专注于破解密码。\n\
  \n你可以使用更晦涩的名字来减慢黑客的速度。以下是一些可以做的建议：\n\n* 在名字末尾添加一个随机三位数。例如：`BarnyM320` 或 `baMiller977`。\n\
  * 在名字中间插入一两个数字。例如：`Bar6nyM` 或 `ba9Miller2`。\n* 确保用户名与电子邮件地址不同。例如，如果一个用户的电子邮件地址是\
  \ `baMiller@Mydomain.com`，则*不要*使用 `baMiller` 作为用户的账户名。使用更晦涩的名字。\n\n![警告](img/warning.png)\
  \ *不要*依靠混淆来将人们挡在网络之外！基于混淆的安全是无效的。资源丰富的黑客可以发现最晦涩的名字。混淆可以*减慢*入侵者，但不能阻止他们。如果你减慢了入侵者的速度，你更有可能在他们破解网络之前发现他们。\n\
  \n### 明智地使用密码\n\n网络安全最重要的方面之一是密码的使用。\n\n![记住](img/remember.png) 用户名通常不被视为`秘密`。即使你使用了晦涩的名字，即使是随意的黑客最终也会破解它们。\n\
  \n另一方面，密码是最高机密的。你的网络密码是唯一防止冒充者通过你的用户名登录网络并从而获得你通常拥有的访问权限的因素。*用你的生命守护你的密码。*\n\n这里是创建良好密码的一些提示：\n\
  \n* 不要使用显而易见的密码，例如你的姓、孩子的名字或狗的名字。\n* 不要根据你的爱好选择密码。我的朋友喜欢玩船，他的密码就是他船的名字。任何认识他的人都能很快猜出他的密码。用船命名密码要受五鞭。\n\
  * 将你的密码存在脑子里——而不是写在纸上。\n    ![警告](img/warning.png) 特别糟糕：将密码写在贴纸并贴在电脑显示器上。\n* 大多数网络操作系统允许你设置密码过期时间。例如，你可以指定密码在\
  \ 30 天后过期。当用户密码过期时，用户必须更改它。你的用户可能认为这个过程很麻烦，但它有助于限制他人窃取密码后以后尝试入侵你计算机系统的风险。\n* 你可以配置用户账户，使他们在更改密码时不能重复使用*近期*的密码。例如，你可以指定新密码不能与用户过去的三个密码中的任何一个相同。\n\
  \n\n\n\n*   你也可以配置安全策略，要求密码必须包含大写字母、小写字母、数字和特殊符号的混合。因此，像 `DIMWIT` 或 `DUFUS` 这样的密码是不行的；像\
  \ `87dIM@wit` 或 `duF39&US` 这样的密码是允许的。\n\n*   ![Warning](img/warning.png) 一些小型网络的管理员选择完全放弃密码，因为他们觉得自己的网络安全不是问题。或者至少他们会选择显而易见的密码、给每个用户分配相同的密码，或者将密码打印在巨大的海报上挂在整个建筑里。忽略基本的密码安全很少是一个好主意，即使在小型网络中也是如此。只有当你的网络非常小（例如只有两三台电脑）、你不在文件服务器上存储敏感数据，或者网络的主要目的是共享打印机而不是共享文件时，你才应该考虑不使用密码。（即使你不使用密码，实施基本的安全措施，例如限制某些用户对某些网络目录的访问）仍然是可能的。只需记住，如果不使用密码，没有任何能阻止用户使用他人的用户名登录。）\n\
  \n### 傻瓜级密码生成指南\n\n你如何想出既没人猜得到又能自己记住的密码呢？大多数安全专家说，最好的密码不对应于英语中的任何单词，而是由字母、数字和特殊字符的随机序列组成。然而，你到底该如何记住一个像\
  \ `Dks4%DJ2` 这样的密码呢？尤其是当你三周后必须将其更改为像 `3pQ&X(d8` 这样的东西时。\n\n*   ![Tip](img/tip.png)\
  \ 这里有一个折中方案，可以让你创建一个由两个连续的四字母单词组成的密码。拿一本你喜欢的书（如果是这一本，那你该去过点生活了），随机翻到任意页。找到页面上第一个四个或五个字母的单词。假设那个单词是\
  \ `When.`。然后重复过程找到另一个四个或五个字母的单词；假设你第二次选择了单词 `Most`。现在将这些单词组合成你的密码：`WhenMost`。我想你会同意\
  \ `WhenMost` 比 3PQ&X(D8)` 更容易记忆，而且猜的难度可能差不多。我可能不想让洛斯阿拉莫斯核实验室的人使用这种方案，但它对我们大多数人来说足够了。\n\
  \n关于从你喜欢的书中调制密码，还有额外的想法：\n\n*   如果最后选出的单词相同，就选另一个单词。如果组合看起来太普通（例如 `WestWind` 或 `FootBall`），请选择不同的单词。\n\
  \n*   为了增加趣味性，可以在单词之间插入几个数字或特殊字符。你最终得到像 `into#cat`、`ball3%and` 或 `tree47wing` 这样的密码。如果你愿意，可以使用第二个单词的页码作为分隔。例如，如果单词是\
  \ `know` 和 `click`，第二个单词来自第 435 页，则使用 `know435click`。\n\n*   为了进一步迷惑你的朋友和敌人，可以使用乔叟的《坎\
  \ terbury 故事》中的中世纪密码。乔叟是密码的绝佳来源，因为他生活在带有拼写检查字处理器时代。他用 `seyd` 代替 `said`，用 `gret`\
  \ 代替 `great`，用 `welk` 代替 `walked`，用 `litel` 代替 `little`。他还使用了许多适合密码的七、八字母单词，如 `glotenye`（贪婪）、`benygne`（良性的）和\
  \ `opynyoun`（意见）。而且他的英语成绩还拿了 A。\n\n*   ![Tip](img/tip.png) 如果你使用了这些任何密码方案，且有人入侵了你的网络，别怪怪我。你才是那个懒得记住\
  \ `D#Sc$h4@bb3xaz5` 的人。\n\n*   如果你确实决定使用密码，例如 `KdI22UR3xdkL`，你可以在网上找到随机密码生成器。只需访问搜索引擎（如\
  \ `Google`）并搜索 `Password Generator`。你会发现一些根据你指定的标准生成随机密码的网页，例如密码的长度、是否包含字母、数字、标点、大写和小写字母等。\n\
  \n*   ![Tip](img/tip.png) 最近的研究表明，我们过去 30 年左右对密码安全的许多信念可能实际上是适得其反。为什么呢？有两个原因：\n\n\
  *   频繁更改密码以及使其变得过于复杂难以记忆的要求，只会鼓励用户把密码写下来，这使得它们很容易被偷。\n\n*   密码泄露的一种常见方式是窃取加密后的密码数据库，然后可以使用简单的字典方法对其进行攻击。即使是最复杂的密码，如果长度较短，也可以通过字典攻击破解；使密码难以破解的最重要因素不是复杂度，而是长度。\n\
  \n因此，美国国家标准与技术研究院 (`NIST`) 建议了创建安全密码的新指南：\n\n*   鼓励使用更长的密码。\n\n*   放弃复杂性要求。相反，鼓励用户创建他们可以轻松记住的密码。由普通单词组成的简单句子或短语即可，只要句子或短语足够长。例如，“我的密码是一个简单的句子”就是一个很好的密码。\n\
  \n*   放弃定期更改密码的要求；这只会鼓励用户写下他们的密码。\n\n旧习惯很难改变，这些新指南需要一段时间才能流行。我个人，在没有增加长度到 12 个字符的情况下，我不会放弃定期更改密码的要求。\n\
  \n## 保护管理员账户\n\n理理，至少有一个网络用户必须有权在没有任何限制的情况下使用网络。这个用户就是 `administrator`。管理员负责设置网络安全系统。为了做到，管理员必须免于所有安全限制。\n\
  \n![Warning](img/warning.png) 当你安装网络软件时，许多网络会自动创建一个管理员账户。此初始管理员的用户名和密码发布在网络文档中，并且所有使用相同网络操作系统的网络都是相同的。在网络运行后，你必须做的第一件事之一就是更改标准管理员账户的密码。否则，任何知道默认管理员用户名和密码的人都可以以完全管理员权限和权利访问你的系统，从而绕过你辛辛苦设置的安全限制。\n\
  \n![Warning](img/warning.png) ***别忘记管理员账户的密码！*** 如果网络用户忘记了他们的密码，你可以以管理员（supervisor）身份登录并更改该用户的密码。但是，如果你忘记了管理员的密码，你就麻烦了。\n\
  \n## 管理用户安全\n\n用户账户是网络安全管理的骨干。通过使用用户账户，你可以确定谁可以访问你的网络，以及每个用户可以和不能访问哪些网络资源。你可以将网络访问限制在特定的计算机或一天的某些时段。此外，你可以锁定不再需要访问网络的用户。以下章节描述了为你的网络设置用户安全的基础知识。\n\
  \n### 用户账户\n\n\n\n\n\n每个访问网络的用户都必须有一个 `user account`（用户账户）。用户账户允许网络管理员确定谁可以访问网络以及每个用户可以访问哪些网络资源。此外，用户账户可以进行，以为用户提供许多方便的功能，例如个性化的开始菜单或最近使用文档的显示。\n\
  \n每个用户账户都与一个 `username`（有时称为 `user ID`）相关，用户在登录网络时必须输入该名称。每个账户还带有相关的其他信息，特别是：\n\n\
  *   **用户的密码：** 这还包括密码策略，例如用户必须多久更改一次密码、密码必须有多复杂程度等。\n*   **用户的联系信息：** 这包括全名、电话号码、电子邮件地址、邮寄地址和其他相关信息。\n\
  *   **账户限制：** 这允许用户仅在某天的特定时间段登录的限制。此功能可以将你的用户限制在正常工作时间内，这样他们就无法在凌晨 2 点溜进来进行未经授权的工作。此功能还可以防止你的用户加班，因为他们在下班时间后无法访问网络，因此请谨慎使用。你还可以指定用户只能在某些计算机上登录。\n\
  *   **账户状态：** 你可以临时禁用用户账户，使用户无法登录。\n*   **主目录：** 这指定了一个共享网络文件夹，用户可以在其中存储文档。\n* \
  \  **拨号入权限：** 这些权限授权用户通过拨号连接远程访问网络。\n*   **组成员身份：** 这些根据用户所属的组授予用户某些权利。\n\n![Tip](img/tip.png)\
  \ 欲了解更多信息，请参见本章后面的章节“小组治疗”。\n\n### 内置账户\n\n大多数网络操作系统预配置了两个内置账户：`Administrator` 和\
  \ `Guest`。此外，某些服务器服务（如 Web 服务器或数据库服务器）会创建自己的用户账户来运行。以下章节描述了这些账户的特征。\n\n*   **Administrator\
  \ 账户：** `Administrator` 账户是网络之王。此用户账户不受普通账户必须遵守的任何账户限制。如果你以 `administrator` 身份登录，你可以做任何事情。因此，请避免在日常任务中使用\
  \ `*Administrator` 账户。仅在确实需要时才以 `Administrator` 身份登录。\n\n    ![Tip](img/tip.png)\
  \ 因为 `Administrator` 账户对你的网络具有无限访问权限，所以在安装服务器后立即对其进行加密至关重要。当操作系统 `Setup` 程序要求为 `Administrator`\
  \ 账户设置密码时，请从由大写和小写字母、数字和符号组成的良好随机组合开始。不要一开始选一个容易记忆的密码，以为以后会把它更改成更复杂的密码。你会忘记的，在此期间，有人会闯入并格式化服务器的\
  \ `C:` 盘或盗你客户的信用卡号。\n*   **Guest 账户：** 另一个常用的创建默认账户是 `Guest 账户`。该账户设置为空密码和（如果有的话）访问权限。`Guest`\
  \ 账户的设计允许任何人走到计算机前登录，但在他们登录后，它会阻止他们做任何事情。在我看来这是在浪费时间。我建议你禁用 `Guest` 账户。\n*   **服务账户：**\
  \ 某些网络用户并不是真实的人。我不是说你的某些用户是亚人类。相反，某些用户实际上是需要访问安全资源的软件进程，因此需要用户账户。这些用户账户通常在你安装或配置服务器软件时自动为你创建。\n\
  \n    例如，当你安装微软的 Web 服务器 (`IIS`) 时，会创建一个名为 `IUSR` 的 Internet 用户账户。该账户的完整名为 `IUSR_<servername>`。所以如果服务器命名为\
  \ `WEB1`，则账户名为 `IUSR_WEB1`。`IIS` 使用此账户允许匿名 Internet 用户访问你网站的文件。\n\n    ![Tip](img/tip.png)\
  \ 除非你非常清楚自己在做什么，否则不要动这些账户。例如，如果你删除或重命名了 `IUSR` 账户，你必须重新配置 `IIS` 使用更改后的账户。如果不这样做，`IIS`\
  \ 将拒绝任何尝试访问你网站的人。（假设你确实清楚自己在做什么，重命名这些账户可以增加你网络的安全性。但是，在开始玩这些账户之前，请研究其后果。）\n\n###\
  \ 用户权利\n\n用户账户和密码是网络安全游戏中的第一道防线。在用户通过输入有效的用户 ID 和密码访问网络后，第二道安全防线——`rights`（权利）就会介入。\n\
  \n在网络生活的残酷现实中，所有用户都是平等的，但某些用户比其他用户平等。《网络独立宣言》序言包含这样一段陈述：“我们认为这些真理是不言而易的，某些用户被网络管理员赋予了某些不可剥夺的权利……”\n\
  \n你可以分配给网络用户的权利取决于你使用的哪种网络操作系统。以下是 Windows 服务器的一些可能的用户权利：\n\n*   **本地登录：** 用户可以直接从服务器键盘登录到服务器计算机。\n\
  *   **更改系统时间：** 用户可以更改服务器注册的时间日期。\n*   **关闭系统：** 用户可以对服务器执行有序关机。\n*   **备份文件和目录：**\
  \ 用户可以对服务器上的文件和目录进行备份。\n*   **恢复文件和目录：** 用户可以恢复备份的文件。\n*   **取得文件和其他对象的所有权：** 用户可以接管其他用户的文件和其他网络资源。\n\
  \n`NetWare` 有一套类似的用户权利。\n\n### 权限（谁获得什么）\n\n用户权利控制用户在整个网络范围内做什么。`Permissions`（权限）允许你通过控制单个用户或组对特定网络资源（如文件或打印机）的访问权限，来精调你的网络安全。例如，你可以设置权限允许财务部门的用户访问服务器\
  \ `\\ACCTG` 目录下的文件。权限还可以允许某些用户读取某些文件但不允许修改或删除它们。\n\n每个网络操作系统以不同的方式管理权限。无论细节如何，效果都是你可以授予每个用户以某些方式访问某些文件、文件夹或驱动器。例如，你可能会授予用户对某些文件的完全访问权限，但对其他文件授予只读访问权限。\n\
  \n![Tip](img/tip.png) 你为文件夹指定的任何权限都会自动适用于该文件夹的任何子文件夹，除非你显式地为子文件夹指定不同的权限。\n\n![Technical\
  \ stuff](img/technicalstuff.png) 你只能对格式化为 `NTFS` 或 `ReFS` 卷上创建的文件或文件夹使用 Windows\
  \ 权限。如果你坚持对 Windows 共享驱动器使用 `FAT` 或 `FAT32`，你就无法保护驱动器上的单个文件或文件夹。这是为 Windows 服务器使用\
  \ `NTFS` 的主要原因之一。\n\n### 小组治疗\n\n`group account`（组账户）是一种不代表单个用户的账户。相反，它代表一组以类似方式使用网络的用户。与其为这些用户逐个授予访问权限，不如将权利授予组，然后将个人用户分配到组。当你将用户分配到组时，该用户将继承组所指定的权利。\n\
  \n\n\n\n\n例如，假设你为财务人员创建了一个名为 `Accounting`（会计）的组，然后允许 `Accounting` 组的成员访问网络上的财务文件和应用程序。这样，你无需为每个财务用户授予这些文件和应用程序的权限，只需将每位财务用户变为\
  \ `Accounting` 组的成员即可。\n\n以下是关于组的一些额外详细信息：\n\n- 组是实现网络管理完美境界的关键之一。尽可能避免逐个管理网络用户。相反，将他们归类成组并管理组。当财务部门的所有\
  \ 50 个用户都需要访问一个新的文件共享文件夹时，你更倾向于更新 50 个用户账户，还是只更新 1 个组账户？\n- 一个用户可以属于多个组。这样，该用户就会继承每个组的权限。例如，你可以为\
  \ `Accounting`（会计）、`Sales`（销售）、`Marketing`（营销）和 `Finance`（财务）设置组。需要访问 `Accounting`\
  \ 和 `Finance` 信息的用户可以成为这两个组的成员。同样，需要同时访问 `Sales` 和 `Marketing` 信息的用户可以成为 `Sales`\
  \ 和 `Marketing` 组的成员。\n- 你可以向个人用户授予或撤销特定权限以覆盖组设置。例如，你可能会为财务部门经理授予一些额外的权限。你也可以对某些用户实施额外的限制。\n\
  \n### 用户配置文件 (User profiles)\n\n`User profiles`（用户配置文件）是 Windows 的一项功能，用于跟踪单个用户对其\
  \ Windows 配置的偏好。对于未连接网络的计算机，配置文件允许两个或多个用户使用同一台电脑，每个用户都有自己的桌面设置，如壁纸、颜色、开始菜单选项等。\n\
  \n当配置文件在网络上使用时，其真实优势就显而易见了。用户的配置文件可以存储在服务器计算机上，每当该用户从网络上的任何 Windows 计算机登录时，就可以访问该配置。\n\
  \n以下是受用户配置文件设置管理的 Windows 某些元素：\n\n- 来自“显示属性”（`Display Properties`）对话框的桌面设置，包括壁纸、屏幕保护程序和颜色方案\n\
  - 开始菜单程序和 Windows 栏选项\n- 收藏夹（Favorites），方便用户访问其经常访问的文件和文件夹\n- 网络设置，包括驱动器映射、网络打印机和最近访问的网络位置\n\
  - 应用程序设置，例如 `Microsoft Word` 的选项设置\n- 文档文件夹\n\n### 登录脚本 (Logon scripts)\n\n`logon\
  \ script`（登录脚本）是一种每当用户登录时自动运行的批文件。登录脚本可以为你执行多项重要的登录任务，例如映射网络驱动器、启动应用程序、同步客户端电脑的时钟等。登录脚本存储在服务器上。每个用户账户都可以指定是否使用登录脚本以及使用哪种脚本。\n\
  \n此登录脚本映射了几个网络驱动器并同步了时间：\n\n```\nnet use m: \\\\MYSERVER\\Acct\nnet use n: \\\\\
  MYSERVER\\Admin\nnet use o: \\\\MYSERVER\\Dev\nnet time \\\\MYSERVER /set /yes\n\
  ```\n\n登录脚本已经有些过时了，因为登录脚本执行的大部分工作可以通过用户配置文件来实现。尽管如此，许多管理员仍然倾向于登录脚本的简单性，因此即使在 Windows\
  \ Server 2019 系统上仍然在使用。\n\n## 保护人为防火墙 (Securing the Human Firewall)\n\n安全技术，如物理安全、用户账户安全、服务器安全：网络安全的关键是保护网络用户。最好的安全安全计划是配置文件配置文件存储在服务器计算机上，每当该用户从网络上的任何\
  \ Windows 计算机登录时，就可以访问该配置。以下是受用户配置文件设置管理的 Windows 某些元素：\n\n- 来自“显示属性”（`Display Properties`）对话框的桌面设置，包括壁纸、屏幕保护程序和颜色方案\n\
