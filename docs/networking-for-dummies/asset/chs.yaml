  \n## Z\n* Zendesk，279–280\n\n## 关于作者\n**Doug Lowe** 写的计算机书籍多到可以填满加州所有的鸟笼。他的其他著作还包括第七版《网络技术精通》（Networking\
  \ All-in-One For Dummies）、《Microsoft PowerPoint 2019 入门》、《第五版《Java 精通》（Java All-in-One\
  \ For Dummies）以及第二版《电子学精通》（Electronics All-in-One For Dummies）（均由 Wiley 出版）。\n\n\
  \n\n\n\n尽管 Doug 尚未获得过普利策奖，但他仍然保持着谨慎的乐观。他希望 Claude-Michel Schönberg 和 Alain Boublil\
  \ 能将这本书改编为音乐剧，剧名名为《悲惨世界网络版》（*Les Réseau Miserables*。（希望那个充满复仇心理的网络管理员角色能由一位会唱歌的人来扮演。）\n\
  \nDoug 住在加利福尼亚州阳光明媚的弗雷诺，在那里，每年至少有三四个光辉的日子，可以透过雾霾看到不处的内华·内华达山脉。\n\n## 献辞\n\n这一本献给\
