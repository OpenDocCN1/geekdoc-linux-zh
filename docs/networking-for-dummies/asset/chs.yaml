  \n\n\n\n\n`144 . 28 . 16 . 17`\n\n`IP address: 10010000 00011100 00100000 00001001`\n\
  \n`Subnet mask: 11111111 11111111 11110000 00000000`\n\n`Network ID: 10010000 00011100\
  \ 00100000 00000000`\n\n`144 . 28 . 16 . 0`\n\n因此，该子网的网络 ID 为 `144.28.16.0`。\n\n\
  子网掩码通常以点分十进制表示表示。因此，上一个示例中使用的 20 位子网掩码表示为 `255.255.240.0`：\n\n```\nSubnet mask:\
  \ 11111111 11111111 11110000 00000000\n255 . 255 . 240 . 0\n```\n\n![Tip](img/tip.png)\
  \ 不要将子网掩码与 IP 地址混淆。子网掩码并不代表互联网上的任何设备或网络。它只是用来指示 IP 地址的哪部分应用于确定网络 ID。（你可以一眼识别出子网掩码，因为第一个字节始终是\
  \ `255`，而 `255` 并不是任何类别 IP 地址的有效第一个字节。）\n\n### 子网汇总总结\n\n你应该了解适用于子网掩码的若干额外限制——特别是：\n\
  \n*   网络 ID 位的最少限制为 8 位。因此，子网掩码的第一个字节始终是 `255`。\n\n*   网络 ID 位的最大限制为 30 位。你必须为地址的主机\
  \ ID 部分留至少两个位，以便至少有两个主机。如果你将所有 32 位都用于网络 ID，那么将没有位位留给主机 ID。显然，这是不可行的。仅为主机 ID 留留一个位也不行。这是因为全\
  \ 1 的主机 ID 被保留用于广播地址——而全 0 则指向网络本身。因此，如果你用 31 位用于网络 ID 并仅留 1 位给主机 ID，那么主机 ID 1 将用于广播地址，主机\
  \ ID 0 将是网络本身，为实际主机留不下任何空间。这就是为什么网络 ID 的最大大小为 30 位。\n\n*   因为网络 ID 始终由连续的 1 位组成，因此子网掩码的每个字节只有\
  \ 9 种可能的值（包括 0）。供你参考，这些值列在 表 6-2 中。\n\n| 二进制字节 | 十进制 | 二进制字节 | 十进制 |\n| --- | ---\
  \ | --- | --- |\n| 00000000 | 0 | 11111000 | 248 |\n| 10000000 | 128 | 11111100\
  \ | 252 |\n| 11000000 | 192 | 11111110 | 254 |\n| 11100000 | 224 | 11111111 | 255\
  \ |\n| 11110000 | 240 | | |\n\n表 6-2 八个子网字节值\n\n### 私有地址和公共地址\n\n任何直接连接互联网的主机都必须有一个全球唯一的\
  \ IP 地址。然而，并不是所有主机都直接连接互联网。有些主机位于未连接互联网的网络中。有些主机隐藏在防火墙后面，因此它们的互联网连接是间接的。\n\n几块 IP\
  \ 地址被专门留用于此——用于未连接互联网的私有网络，或用于隐藏在防火墙后的网络。存在三个这样的地址范围，如 表 6-3 所示。当你创建一个私有 TCP/IP\
  \ 网络时，请使用这些范围中的一个 IP 地址。\n\n| 子网掩码 | 地址范围 |\n| --- | --- |\n| `255.0.0.0` | `10.0.0.1`–`10.255.255.254`\
  \ |\n| `255.255.240.0` | `172.16.1.1`–`172.31.255.254` |\n| `255.255.0.0` | `192.168.0.1`–`192.168.255.254`\
  \ |\n\n表 6-3 私有地址\n\n### 理解网络转换\n\nTCP/IP 网络上的每个主机都必须有一个 IP 地址。每个主机都必须经过正确配置，以便知道自己的\
  \ IP 地址。当新主机上线时，必须被分配一个子网正确范围内的 IP 地址——且该地址尚未被使用。虽然你可以为每台计算机分配分配 地址，但如果网络超过几台计算机，这项很快就会变得难以应对。\n\
  \n这就是动态主机配置协议（DHCP）发挥用场的地方。DHCP 自动配置网络上每个主机的 IP 地址，从而确保每个主机都有有效的 IP 地址。你可以想象，DHCP\
  \ 可以为网络管理员节省大量繁琐工作。\n\n在本节中，你将了解 DHCP 的内部机制：它是什么、它是如何工作的以及如何设置。\n\n### 理解 DHCP\n\
  \nDHCP 允许 TCP/IP 网络上的单个主机从服务器获取配置信息——特别是它们的 IP 地址。DHCP 服务器跟踪哪些 IP 地址已经分配，因此当计算机请求\
  \ IP 地址时，DHCP 服务器会提供一个尚未被使用的 IP 地址。\n\nDHCP 的替代方案是为网络上的每台计算机分配静态 IP 地址，这可能是好的，也可能产生问题：\n\
  \n*   对于只有几台计算机的网络，静态 IP 地址是可以的。\n\n*   ![Warning](img/warning.png) 对于超过几台计算机的网络，使用静态\
  \ IP 地址是一个巨大的错误。最终，某个可怜、忙碌的管理员（猜是谁？）会犯给两台计算机分配相同 IP 地址的错误。那时你必须手动检查每台计算机的 IP 地址以找到冲突。对于任何最小网络以外的网络，DHCP\
  \ 是必不可少的。\n\n### NAT\n\n许多防火墙使用其他技术来确定每个数据包应该交付给哪个用户。实际上，这个过程比这复杂一点，因为很有可能有两个用户来自同一个公共\
  \ IP 的请求。在这种情况下，NAT 设备使用其他技术来确定每个数据包应该交付给哪个用户。\n\n\n\n\n\n*   路由器地址，也称为默认网关地址\n\
  *   配置信息的过期时间\n*   域名\n*   DNS 服务器地址\n*   Windows 内部网络命名服务 (WINS) 服务器地址\n\n### DHCP\
  \ 服务器\n\nDHCP 服务器可以是位于 TCP/IP 网络上的某台服务器计算机。幸运的是，所有现代服务器操作系统都内置了 DHCP 服务器功能。若要在网络服务器上设置\
  \ DHCP，你只需要启用服务器的 DHCP 功能并配置其设置即可。在本章的稍后部分，在“管理 Windows Server 2019 DHCP 服务器” 节中，我将向你展示如何为\
  \ Windows 2019 配置 DHCP 服务器。\n\n运行 DHCP 的服务器计算机不必完全专门用于 DHCP 服务，除非网络规模非常大。对于大多数网络来说，文件服务器可以兼任\
  \ DHCP 服务器的职责，特别是当你为 IP 地址提供较长的租约时间时。（我将在本章的稍后部分解释租租约的概念。）\n\n大多数多功能路由器也内置了 DHCP\
  \ 服务器。因此，如果你不想让你的网络服务器之一承担 DHCP 功能的负担，可以启用路由器的内置 DHCP 服务器。允许路由器作为你网络的 DHCP 服务器的一个优点是，你很少需要关闭路由器。相比之下，你有时需要重启或关闭文件服务器以执行系统维护、应用升级或进行某些必要的故障排除。\n\
  \n![Tip](img/tip.png) 大多数网络只需要一个 DHCP 服务器。在同一网络上设置两个或更多服务器需要你仔细协调每个服务器所负责的 IP 地址范围（称为\
  \ `scopes`，即范围）。如果你不小心地为同一个范围设置了两个 DHCP 服务器，当这两个服务器尝试为两个不同的主机分配相同的 IP 地址时，你可能会导致地址分配冲突。为了防止这种情况发生，除非你的网络大到一台服务器无法处理工作负载，否则请只设置一个\
  \ DHCP 服务器。\n\n### 理解范围\n\n`scope`（范围）简单来说就是 DHCP 服务器配置分配的 IP 地址范围。在最简单的情况下（即由单个\
  \ DHCP 服务器负责整个子网的 IP 配置），范围对应于该子网。然而，如果你为一个子网设置了两个 DHCP 服务器，你可以为每个服务器配置一个范围，仅分配整个子网范围内的一部分。此外，一个\
  \ DHCP 服务器可以为多个范围服务。\n\n在启用 DHCP 服务器之前，你必须创建一个范围。当你创建一个范围时，可以为其提供以下属性：\n\n*   `scope\
  \ name,`（范围名称），帮助你识别范围及其用途。\n*   `scope description,`（范围描述），让你提供有关范围及其用途的更多信息。\n\
  *   范围的 `starting IP address`（起始 IP 地址）。\n*   范围的 `ending IP address`（结束 IP 地址）。\n\
  *   范围的 `subnet mask`（子网掩码）。你可以使用点进制表示法或无类别域间路由 (CIDR) 表示指定子网掩码。\n*   一个或多个排除地址范围。这些地址不会分配给客户端。（更多信息，请参见下一节“感觉被排除在外？”）\n\
  *   一个或多个保留地址。这些地址始终被分配给特定的主机设备。（更多信息，请参见本章稍后部分的“建议预留”节。）\n*   `lease duration,`（租约时长），指示允许主机使用\
  \ IP 地址的时间。当租约持续时间过半时，客户端会尝试续租。例如，如果你指定的租约时长为八天，则客户端将在四天后尝试续租。这样，主机就有充足的时间在地址被重新分配给其他主机之前完成续租。\n\
  *   子网的 `router address`（路由器地址）。![Tip](img/tip.png) 此值也称为 `default gateway address`（默认网关地址）。\n\
  *   网络 DNS 服务器和 WINS 服务器的 `domain name and the IP address`（域名和 IP 地址）。\n\n### 感觉被排除在外？\n\
  \n每个人偶尔感到排除在外。由于有一个妻子和三个女儿，我很清楚那种感觉。然而，有时，被排除在外是一件好事。在 DHCP 范围的情况下，排除可以帮助你防止 IP\
  \ 地址冲突，并允许你将单个子网的 DHCP 工作负载分配给两个或多个 DHCP 服务器。\n\n`exclusion`（排除）是指不包含在范围内、但属于范围起始地址和结束地址范围内的地址范围。实际上，排除范围允许你在范围中“挖一个洞”：落在洞内的\
  \ IP 地址将不会被分配。\n\n以下是从范围中排除 IP 地址的几个原因：\n\n* 运行 DHCP 服务的计算机本身通常必须具有静态 IP 地址。因此，DHCP\
  \ 服务器的地址应列为排除项。\n*    你可能想为其他服务器分配静态 IP 地址。在这种情况下，每个服务器 IP 地址都应列为排除项。\n\n![Tip](img/tip.png)\
  \ 预留（Reservations）通常是解决问题的更好的解决方案，正如我在下一节中描述的。\n\n### 建议预留\n\n在某些情况下，你可能希望为特定的主机分配特定的\
  \ IP 地址。实现此目标的方法之一是主机配置静态 IP 地址，以便主机不使用 DHCP 获取其 IP 配置。然而，这种方法有两个主要的缺点：\n\n* TCP/IP\
  \ 配置提供的不仅仅是 IP 地址。如果你使用静态配置，你必须手动指定子网掩码、默认网关地址、DNS 服务器地址以及主机所需的其他配置信息。如果这些信息发生变化，你不仅要在\
  \ DHCP 服务器上更改，还要在每个主机上更改。\n* 你必须记得从 DHCP 服务器的范围内排除该静态地址。\n\n![Tip](img/tip.png)\
  \ 为主机分配固定 IP 地址的更好方法是创建 DHCP 预留。`reservation`（预留）简单表示当特定主机向服务器请求地址时，服务器应提供你指定的地址。主机在请求配置之前不会接收\
  \ IP 地址，但每当主机请求时，它总是接收相同的地址。\n\n要创建预留，你需要将要分配给主机的 IP 地址与主机的 MAC 地址关联。因此，在创建预留之前你需要从主机获取\
  \ MAC 地址：\n\n* 通常，你可以通过命令提示符运行 `ipconfig /all` 命令获取 MAC 地址。\n* 如果计算机尚未配置 TCP/IP，你可以通过选择开始 ⇒ 所有程序 ⇒ 辅助工具 ⇒ 系统工具 ⇒ 系统信息来获取\
  \ MAC 地址。\n\n![提示：] 如果你设置了多个 DHCP 服务器，请确保在每个服务器上都指定相同的预留。如果你忘记在其中一个服务器上重复预留，该服务器可能会将地址分配给其他主机。\n\
  \n### 租约多久？\n\n配置 DHCP 服务器时所做出的最重要的决定之一是指定租约时长的长度。默认值为八天，这在许多情况下是合适的。然而，你可能会遇到需要更长或更短间隔的情况：\n\
  \n* 网络越稳定，租约时长就可以存在得越久。如果你定期向网络添加新计算机（或更换现有计算机），你可以安全地将租约时长延长八天以上。\n\n\n\n\n\n*\
  \   网络越不稳定，租约持续时间应该越短。例如，你可能在大学图书馆里有一个无线网络，学生们带上笔记本电脑进入图书馆，每次工作几个小时。对于这种网络，一小时的短持续时间可能是合适的。\n\
  \n![警告](img/warning.png) 不要将你的网络配置为允许无限期的租约。虽然某些管理员认为在稳定网络上，这种持续时间可以减少 DHCP 服务器的工作量，但没有任何一个网络是永久稳定的。每当你发现一个配置了无限期租约的\
  \ DHCP 服务器时，请查看活动租约。我向你保证，你会分配给已不存在计算机的 IP 租约。\n\n## 管理 Windows Server 2019 DHCP\
  \ 服务器\n\n配置和管理 DHCP 服务器时需要遵循的准确步骤取决于你使用的网络操作系统或路由器。接下来的段落描述了如何在 Windows Server 2019\
  \ 中与 DHCP 服务器配合。其他操作系统的步骤也类似。\n\n如果你尚未在服务器上安装 DHCP 服务器，请使用 `Server Manager` 进行安装（点击任务栏中的\
  \ `Server Manager`，然后使用 `Add Roles and Features` 添加 DHCP 角色）。一旦安装了 DHCP 服务器角色，你就可以通过打开\
  \ DHCP 管理控制台来管理它，如图 6-2\n\n图 6-2： DHCP 管理控制台。\n\n![新范围向导的快照。](img/9781119648505-fg0603.png)\n\
  \n图 6-3： 新范围向导。\n\n## 配置 Windows DHCP 客户端\n\n为 Windows 客户端配置 DHCP 非常简单。安装 TCP/IP\
  \ 协议时会自动包含 DHCP 客户端，因此你只需要配置 TCP/IP 使用 DHCP 即可。要此操作，在 `Control Panel` 中选择 `Network`\
  \ 或 `Network Connections`（取决于客户端运行的 Windows 版本），打开 `Network Properties` 对话框。然后选择\
  \ `TCP/IP` 协议并点击 `Properties` 按钮。此操作将打开 `TCP/IP Properties` 对话框，如图 6-4 所示。要配置计算机使用\
  \ DHCP，选择 `Obtain an IP Address Automatically` 和 `Obtain DNS Server Address Automatically`\
  \ 选项。点击 `OK`即可完成。\n\n![配置 Windows 客户端使用动态主机配置协议的快照。](img/9781119648505-fg0604.png)\n\
  \n图 6-4： 配置 Windows 客户端使用 DHCP。\n\n## 使用 DNS\n\nDNS（域名系统）是 TCP/IP 设施，允许你使用名称而不是数字来引用主机计算机。没有\
  \ DNS，你将从 `99.84.233.99` 买书，而不是从 [`www.amazon.com`](http://www.amazon.com) 购买；你将在\
  \ `104.78.128.48` 出卖旧家具，而不是在 [`www.ebay.com`](http://www.ebay.com) 上出售。\n\n理解 DNS\
  \ 如何工作以及如何设置 DNS 服务器对于建立和管理 TCP/IP 网络至关重要。本章其余部分将向你介绍 DNS 的基础，包括 DNS 命名系统如何工作以及如何设置\
  \ DNS 服务器。\n\n### 域和域名\n\n为了给互联网上的每台主机计算机提供唯一的 DNS 名称，DNS 使用了一项经过时间检验的技术：分而治之。DNS\
  \ 使用分级命名系统，类似于 Windows 计算机上文件夹的层级组织方式。然而，DNS 将名称组织成 `domains`（域）。每个域都包含了直接出现在 DNS\
  \ 分级结构中其下方的所有名称。\n\n例如，图 6-5 显示了 DNS 域树的一小部分。树的顶部是 `root domain`（根域），它是所有域的锚点。根域正下方是四个\
  \ `top-level domains`（顶级域），分别为 `edu`、`com`、`org` 和 `gov`。\n\n![ 域树一小部分的示意图。树的顶部是根域，它是所有域的锚点。](img/9781119648505-fg0602.png)\n\
