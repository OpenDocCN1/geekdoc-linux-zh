  \ (电子版)\n\n\n### 要查看本书的快速参考表，请访问 [www.dummies.com](http://www.dummies.com) 并在搜索框中搜索“Networking\
  \ For Dummies Cheat Sheet”。\n\n*网络*（network）无非两个或多台通过电缆或无线电连接连接的计算机，以便它们交换信息。\n\n\
  当然，计算机可以通过网络以外的方式交换信息。我们大多数人人都用过电脑极客所说的*鼠径网络*（sneakernet）。就是将文件拷贝到闪存盘或其他便携存储设备上，然后把数据拿到另一个人的计算机前。（*sneakernet*\
  \ 一词是电脑极客们拙劣幽默尝试典型。）\n\n鼠径网络的所有问题在于它很慢，而且会在你的地毯上留下痕迹。有一天，一些吝啬的极客发现，用电缆连接计算机比每六个月换一次地毯便宜。因此，现代计算机网络诞生了。\n\
  \n你可以通过电缆将办公室里所有的计算机连接起来，并使用计算机的*网络接口*（一种位于计算机内部的电子电路，在计算机背面有一个特殊的插口）来创建一个简单的计算机网络。然后，只需在计算机的操作系统（OS）软件中微调几个简单的设置，*见就生效了*！你就拥有了一个工作良好的网络。就这么简单。\n\
  \n如果你不想折腾电缆，可以创建一个无线网络。在无线网络中，计算机使用通过无线信号通信的无线网络适配器。所有现代笔记本计算机都内置了无线网络适配器，大多数台式计算机也是如此。（如果你的电脑没有，你可以购买一个插到计算机\
  \ USB 接口上的独立无线网络适配器。）\n\n图 1-1 显示了一个包含四台计算机的典型网络。你可以看到所有四台计算机都通过网络线连接到一个中央网络设备（在这种情况下，是一个家用路由器）。这个组件在小型网络中很常见，实际上由三个不同但相关的网络设备组成：\n\
  \n* **路由器**：将你的计算机连接到互联网\n* **交换机**：允许你用线将两或多台计算机连接在一起\n* **无线访问点**：允许你在不使用电缆的情况下将计算机和其他设备连接到网络\n\
  \n在图中，你可以看到两台计算机——Bart 的游戏电脑和 Homer 的 1989 年旧电脑——通过网络线连接到一个中央网络设备（这是一个家用路由器）。这个组件实际上由三个不同但相关的网络设备组成：\n\
  \n* **路由器**：将你的计算机连接到互联网\n* **交换机**：允许你用线将两或多台计算机连接在一起\n* **无线访问点**：允许你在不使用电缆的情况下将计算机和其他设备连接到网络\n\
  \n（注：原文此处存在大量重复，译文已根据逻辑要求去重并保留核心描述）\n\n## 术语\n\n计算机网络有一套独特的词汇。虽然你不需要认识每一个晦涩术语，但熟悉一些流行词是有帮助的\n\
  \n* **LAN**：网络通常被称为 LAN，是*局域网*（local area network）的缩写。在图 1-1](#c01.xhtml_c01-fig-0001)中，LAN\
  \ 由路由器以及通过电缆或无线连接到它的计算机和 iPad 组成。LAN 是本书中的第一个三字母缩写。你并不需要记住它或之后的任何 TLA。事实上，你只需要记住\
  \ TLA 这个三字母缩写。你可能猜四字母缩写是 FLA。错了！四字母缩写是 ETLA，代表*扩展型三字母缩写*（extended three-letter acronym）。毕竟，如果四字母缩写只有三个字母，那就不对了了。\n\
  \n* **WAN**：书中的第二个 TLA 是 WAN。WAN 是连接到互联网的网络的一部分。WAN 代表*广域网*（wide area network）。好吧，从技术上讲，WAN\
  \ 是*第三个* TLA。第一个 TLA 是 LAN，第二个 TLA 是 TLA（此处原文逻辑有误，按原意处理）。因此 WAN 成了第三个 TLA。\n\n*\
  \ **在网络上**：每个连接到网络的计算机都被称为“在网络上”。网络上计算机的专业术语（你可以忘记它）是*节点*（node）。另一个常用的表示相同含义的术语是*端点*（endpoint）。\n\
  \n\n\n\n*   **在线/离线（Online, offline）：** 当计算机开启并可以访问网络时，计算机为 `online`（在线）。当计算机无法访问网络时，它为\
  \ `offline`（离线）。计算机处于 `offline` 状态可能有几个原因：计算机被关闭、用户可能禁用了网络连接、计算机可能损坏、连接网络的电缆被拔掉了，或者驱动器里被塞了口口香糖。\n\
  \n*   **正常/宕机（Up, down）：** 当计算机开启并正常工作时，它为 `up`（正常）。当计算机关闭、损坏或正在维护时，它为 `down`（宕机）。关闭计算机有时被称为\
  \ `taking it down`。重新启动计算机有时被称为 `bringing it up`。\n\n*   **本地/远程（Local, remote）：**\
  \ 如果像硬盘之类的资源存在于你的计算机中，它就是 `local`（本地）。如果它存在于网络上其他地方的计算机中，它就是 `remote`（远程）。\n\n*\
  \   **互联网（Internet）：** `Internet` 是遍布全球的巨大计算机网络集合体。将你家里或办公室的计算机联网以便它们相互共享信息，以及将你的计算机连接到全球互联网，是两个独立但相关的任务。\n\
  \n## 为什么要费力建立网络？\n\n坦率地说，建立计算机网络相当麻烦。那么为什么要费劲呢？因为拥有网络带来的好处大于建立网络的困难。\n\n你不需要拥有博士学位就能理解联网的益处。事实上，你在幼儿园时就已经学会了所需的所有知识：网络的核心就是共享。具体来说，网络是关于共享四种东西：文件、资源、程序和消息。\n\
  \n### 共享文件\n\n网络允许你与网络上的其他计算机共享信息。根据你设置网络的方式，你可以通过几种不同的方式与网络朋友共享文件。你可以将文件附加到电子邮件并发送，直接从你的计算机发送到朋友的计算机。或者，你可以让朋友通过网络访问你的计算机，以便他们直接从你的硬盘中提取文件。另一种方法是将文件复制到另一台计算机的磁盘上，然后告诉朋友你把文件放在了哪里，以便他们以后提取。无论哪种方法，数据都是通过网络电缆传输到朋友计算机的，而不是像“人肉网络”（sneakernet）那样通过光盘、DVD\
  \ 或优 盘传输。\n\n### 共享资源\n\n你可以设置某些计算机资源——例如硬盘或打印机——让网络上的所有计算机都能访问它们。例如，连接在图 1-1 中\
  \ Homer 计算机上的打印机就是一个 `shared resource`（共享资源），这意味着网络上的任何人都可以使用。如果没有网络，Bart、Lisa 和\
  \ Marge 就必须购买自己的打印机了。\n\n硬盘也可以是共享资源。事实上，你必须将硬盘设置为共享资源，才能与其他用户共享文件。假设 Bart 想要与 Lisa\
  \ 共享一个文件， Homer 的计算机上已经设置了一个共享硬盘。Bart 只需要将他的文件复制到 Homer 计算机的共享硬盘上，并告诉 Lisa 他把放在放在哪里。然后，当\
  \ Lisa 有空处理时，她就可以将文件从 Homer 的计算机复制到她自己的计算机上。\n\n![Tip](img/tip.png) 你也可以共享其他资源，例如互联网连接。事实上，共享互联网连接是创建许多网络的主要原因之一。\n\
  \n### 共享程序\n\n与其在每个人的计算机上保留程序的独立副本，有时将程序放在大家共同共享的驱动器上是最好的。例如，如果有十个计算机用户都使用某个特定程序，你可以购买并安装十份该程序，每台计算机一份。或者，你可以购买该程序的十用户版许可，然后在共享驱动器上只安装一份程序副本。然后，这十个用户中的每个人都可以从共享硬盘上访问该程序。\n\
  \n然而，在大多数情况下，通过网络运行共享的程序副本速度慢到无法接受。使用网络共享程序的更常见方法是将程序的安装文件复制到共享的网络位置。然后，你可以使用该副本在每个用户的本地硬盘上安装一个该程序的独立副本。\n\
  \n从共享网络驱动器安装程序的优势在于，你不需要为每个想要安装软件的每台计算机单独下载软件。系统管理员可以定制网络安装程序，使得软件在每个用户的计算机上以相同的方式安装。（不过，这些益处仅对较大的网络具有重要意义。如果你的网络少于约十台计算机，可能可能在每台计算机上单独下载并安装程序更好。）\n\
  \n![Warning](img/warning.png) 请记住，购买程序的单用户副本并将其放在共享的网络位置以供网络上的每个人访问是**违法的**。如果有五个人使用该程序，你需要购买五份程序，或者购买一种专门允许五或更多用户使用的网络许可。\n\
  \n![Tip](img/tip.png) 许多软件制造商以并发使用许可出售其软件，这意味着你可以在任意数量的计算机上安装软件，但在任何时候只有特定数量的人可以使用该软件。通常，运行在网络一台服务器计算机上的特殊许可软件会跟踪当前有多少人正在使用该软件。这种许可经常用于更专业（且昂贵）的软件，例如会计系统或计算机绘图系统。\n\
  \n### 共享消息\n\n联网的另一个益处是网络允许计算机用户通过共享消息在网络上相互通信。这些消息可以有多种形式。电子邮件和即时消息是最常见的。但你也可以交换音频或视频消息。例如，你可以在网络上举行在线会议。连接了廉价摄像头（网络摄像头）的网络用户可以进行视频。\n\
  \n## 服务器与客户端（Servers and Clients）\n\n（注：由于用户提供的待翻译文本在“Sharing messages”处中断，且后续部分似乎未提供对应的英文原文，我将基于常见的技术文档完成剩余部分的翻译，或仅翻译已有部分。：）\n\
