  \ 2-17 所示。\n\n3. **如果页面左下角的锁图标处于锁定状态，点击它并在提示时输入你的密码。**\n\n   默认情况下，用户登录选项是锁定的以防止未经授权的更改。此步骤将解锁设置，以便你加入域。\n\
  \n4. **点击 `Join` 按钮。**\n\n（注：此处原文未提供后续步骤的详细描述，已根据您提供的文本完成翻译）\n\n\n\n\n-   你无法仅观察资源来判断它是本地资源还是网络资源。放在你电脑旁边的打印机可能是你的本地打印机，但话又回来，它也可能是一个网络打印机。硬盘的情况也是如此：你电脑中的硬盘可能是你自己的，但它（或它的某部分）可能在网络上共享，从而允许其他用户访问它。\n\
  -   因为专用网络服务器充满了资源（resources），你可以说它们不仅是专用的（dedicated）而且真诚的（dedicated），还是资源丰富的（resourceful）。（唉。抱歉。这又是一个没完没了的电脑极客冷笑话系列之一。）\n\
  \n## 名字意味着什么？\n\n计算机网络上的几乎所有东西都有名字：计算机本身有名字，使用计算机的人有名字，可以在网络上共享的硬盘和打印机有名字，网络本身也有名字。了解你网络上使用的所有名称并非必须的，但你确实需要知道其中的一些。\n\
  \n以下是关于网络名称的一些额外细节：\n\n-   **每个可以使用网络的人都有一个用户名（有时称为 `user ID`）。** 你需要知道自己的用户名才能登录网络。你还需要知道你朋友的用户名，特别是如果你想偷他们的文件或给他们发恶毒的便条。\n\
  \n  你可以在本章后面的“登录网络””部分找到关于用户名和登录的更多信息。\n\n-   ![警告](img/warning.png) **让网络上的人使用他们的名作为用户名很有吸引力，但这不是个好主意。**\
  \ 即使在一个小办公室里，你最终也会遇到冲突。（那那个因为苏斯博士而闻名的 McCave 夫人呢——她有 23 个孩子，并把他们都起名叫 Dave？）\n\n\
  \  ![提示](img/tip.png) 创建一种一致的用户名创建方法。例如，你可以使用名字加上姓氏的前两个字母。那么，Lisa 的用户名就是 `Lisasi`，Bart\
  \ 的用户名就是 `Bartsi`。或者你可以使用名字的首字母，后跟整个姓氏。那么，Lisa 的用户名就是 `lsimpson`，Bart 的用户名就是 `bsimpson`。（在大多数网络中，用户名不区分大小写。因此，`bsimpson`\
  \ 和 `BSimpson` 是相同的。）\n\n-   **网络上的每台计算机都有一个唯一的计算机名称。**\n\n  ![提示](img/tip.png)\
  \ 你不需要知道网络上所有计算机的名称，但如果你知道自己计算机的名称以及任何你需要访问的服务器计算机的名称，会有帮助。\n\n计算机名称有时与使用该计算机的人的用户名相同，但这通常是个坏主意，因为在很多公司里，人员的流动比计算机更频繁。有时，名称会反映最常使用该服务器的群组，如\
  \ `acctng-server` 或 `cad-server`。\n\n  有些网络极客喜欢分配听起来很有技术的名字，如 `BL3K5-87a`。还有人喜欢使用科幻电影中的名字；想起了\
  \ `HAL`（来自《2001 太空漫游》）、`M5` 或 `Data`（来自《星际迷航》），或 `Overmind`（来自《忍者神龟大战》）。像 `Herbie`\
  \ 这样可爱的名字是不允许的。（不过，`Tigger` 和 `Pooh` 是完全可以的——事实上，是推荐的。网络是 Tigger 最喜欢的。）\n\n  ![记住](img/remember.png)\
  \ 通常，计算机命名的明智方法是使用带有数字的名称，如 `computer001` 或 `computer002`。\n\n-   **网络资源（如共享磁盘文件夹和打印机）也有名称。**\
  \ 例如，一个网络服务器可能有两台打印机，分别名为 `laser` 和 `inkjet`（指示打印机类型），以及两个共享磁盘文件夹，分别名为 `AccountingData`\
  \ 和 `MarketingData`。\n\n-   **基于服务器的网络为网络管理员有一个用户名。**\n\n  ![提示](img/tip.png) 如果你使用管理员的用户名登录，你可以任何你想做的事：添加新用户、定义新的网络资源、更改\
  \ Lisa 的密码，任何事情。管理员的用户名通常是像 `Administrator` 这样巧妙的名字。\n\n-   **网络本身有一个名字。**\n\n \
  \ ![记住](img/remember.png) Windows 世界有两种基本的网络：\n\n  -   *域网络（Domain networks）*是大型企业环境的常态，这些环境拥有由\
  \ IT 维护的专用服务器。\n  -   *工作组网络（Workgroup networks）*在家庭或没有专用服务器或 IT 员工的小办公室中更常见。\n\n\
  \  域网络由——你猜得没错——`domain name`（域名）来标识。工作组网络由——请击鼓掌——`workgroup name`（工作组名称）来标识。无论你使用哪种类型的网络，你都需要知道名称来访问网络。\n\
  \n## 登录网络\n\n要使用网络资源，你必须将计算机连接到网络，并且必须通过超级秘密的登录过程，这是你让网络知道你是谁，以便它可以决定你是否是自己的人。\n\
  \n登录有点像兑票。你必须有两个形式的身份证明：\n\n-   **你的用户名：** 网络识别你时的名字。\n\n  你的用户名通常是你真实名字的某种变体，例如\
  \ Bart 的用户名 `Cosmo`。\n\n  ![记住](img/remember.png) 每个使用网络的人都必须有一个用户名。\n\n-   **你的密码：**\
  \ 只有和你网络知道的单词。\n\n  在计算机早期，你需要在 MS-DOS 提示符输入密码。现在，Windows 的伟大之处在于你可以通过登录屏幕登录网络。图\
  \ 3-1 显示了这个对话框。\n\n  如果你输入正确的密码，网络就会相信你如你所说。\n\n![提示](img/tip.png) 这里有更多关于登录的点供思考：\n\
  \n-   `user ID` 和 `logon name` 术语有时代替 `username`。它们的意思相同。\n-   只要我们谈论的是意义相同的词，`log\
  \ in` 和 `logon` 的意思相同，正如 `log out` 和 `log off` 分别表示“我要走了”。虽然你在世界各地都能看到这些词，但本书始终使用\
  \ `log on` 和 `log off`——如果有任何例外，书会说明原因并进行吐槽。\n-   对于网络来说，你和你的计算机不是一个东西。你的用户名指的是你，而不是你的计算机。这就是为什么你有一个用户名而你的计算机有一个名称。你可以从任何连接到网络的计算机使用你的用户名登录网络。其他用户可以使用自己的用户名在你的计算机上登录。\n\
  \n  当其他人使用自己的用户名在你的计算机上登录时，他们无法访问任何受密码保护的网络文件。但是他们可以访问任何你未保护的本地文件。小心允许谁使用你的计算机。\n\
  -   如果你在 Windows 计算机上登录域网络，你需要在用户名之前输入域名，并用反斜杠分隔。例如：\n\n  `lowewriter\\dlowe`\n\n\
  \  在这里，域名是 lowewriter，用户名是 dlowe。\n\n  注意，Windows 会记住上次登录的域和用户名，因此通常你只需要输入密码。要登录到不同的域或作为不同的用户登录，你需要点击“切换用户”。然后你可以点击“其他用户”图标并输入不同的域名和用户名，以及你想登录的用户的密码。\n\
  \n\n\n\n*   你的计算机可能设置了每次开机时自动登录。在这种情况下，你不需要输入用户名和密码。这种设置让登录任务变得更加方便，但也让这个过程失去了乐趣。如果你稍微有一点点担心坏人进入你的网络或个人文件，那么这种做法可真是一个极糟糕的主意。\n\
  *   像保护生命一样保护好你的密码。我很想把我的密码告诉你，但那样我就得对你开枪。\n\n## 理解共享文件夹\n\n在很久以前，在那个“无网络”（B.N.）的时代，你的计算机可能只有一个硬盘，被称为\
  \ `C:` 驱动器。也许它有两个硬盘 —— `C:` 和 `D:`。第二个驱动器可能是另一个硬盘，也可能是 CD-ROM 或 DVD-ROM 驱动器。即使在今天，这些驱动器的后代在物理上仍然位于你的\
  \ PC 内部。它们就是你的`本地驱动器`。\n\n然而，既然你现在连接了网络，你可能会访问不在你 PC 内部、而是位于网络上其他计算机的驱动器。这些网络驱动器可能位于专用服务器计算机上，或者在点对点网络中，位于另一台客户端计算机上。\n\
  \n在某些情况下，你可以通过网络访问整个网络驱动器。但在大多数情况下，你无法访问整个驱动器。相反，你只能访问网络驱动器上的某些文件夹。无论何种方式，共享驱动器或文件夹在\
  \ Windows 术语中被称为`共享文件夹`。\n\n这里就变得有点复杂了：访问共享文件夹的最常见方法是为其分配一个驱动器号。假设服务器有一个名为 `Marketing`\
  \ 的共享文件夹。你可以为这个共享文件夹分配驱动器号 `M`。然后，你就可以通过驱动器 `M:` 访问 Marketing 文件夹。此时，`M:` 驱动器就被称为`网络驱动器`，因为它使用网络来访问共享文件夹中的数据。为共享文件夹分配驱动器号称为`映射驱动器`。\n\
  \n共享文件夹可以设置限制条件，以限制你的使用方式。例如，你可能会获得对某些共享文件夹的完全访问权限，以便你可以向其中复制文件或从其中复制文件、删除其中的文件，或在其中创建或删除文件夹。在其他共享文件夹上，你的访问可能会受到某些方面的限制。例如，你可能可以向共享文件夹复制文件或从那里复制文件，但不能删除文件、编辑文件或创建新文件夹。在访问受保护的文件夹之前，你可能还需要要求输入密码。你在共享文件夹上允许使用的磁盘空间也可能受到限制。有关关于文件共享限制的更多信息，请参阅第\
  \ 13 章。\n\n![提示](img/tip.png) 除了访问位于他人计算机上的共享文件夹外，你还可以将自己的计算机指定为服务器，允许其他网络用户访问你共享的文件夹。要了解如何在你的计算机上与其他网络用户共享文件夹，请参阅第\
  \ 4 章。\n\n## 共享文件夹的四种良好用途\n\n在知道哪些共享网络文件夹是可用的之后，你可能会疑惑该对它们做什么。本节描述了网络文件夹的四种良好用途。\n\
  \n### 存储所有人需要的文件\n\n共享网络文件夹是存储多个用户需要访问的文件的好地方。如果没有网络，你必须在每个人的计算机上存储一份文件的副本，并且必须担心如何保持这些副本的同步（无论你如何努力都做不到这一点）。或者，你可以将文件保存在磁盘上并在之间传。或者你可以把文件保在一台计算机上并玩“抢椅子游戏”；每当有人需要使用该文件时，他就去包含该文件的计算机。\n\
  \n在网络上，你可以在网络上的共享文件夹中保留一份文件副本，所有人都可以访问。\n\n### 存储你自己的文件\n\n你也可以将共享网络文件夹作为你自己的硬盘存储的扩展。例如，如果你用从互联网下载的图片、声音和电影填满了硬盘上的所有可用空间，但网络服务器有数以亿计的\
  \ GB 空闲空间，那么你就拥有所有需要的驱动器空间。只需将你的文件存储在网络驱动器上即可！\n\n以下是在网络驱动器上存储文件的几条指南：\n\n*   如果网络驱动器被设置为其他用户无法访问的私有存储，那么使用网络驱动器存储自己的文件效果最好。这样，你就不用去担心财务部那个喜欢窥探他人文件的闲事佬了。\n\
  *   不要过度使用网络驱动器。记住，其他用户可能已经填满了自己的硬盘，所以他们也想使用网络驱动器的空间。\n*   在网络驱动器上存储个人文件之前，请确保你拥有权限。你妈妈的一条便条就可以。\n\
  *   在域网网络中，一个驱动器（通常 `H:` 驱动器经常被映射到用户的主文件夹）。`主文件夹`是每个用户独有的网络文件夹。你可以认为它是“文档”的网络版本。如果你的网络设置了主文件夹，请对任何重要的工作相关文件使用它，而不是“文档”。这是因为主文件夹通常包含在网络的每日备份计划中。相比之下，大多数网络*不会*备份你存储在“文档”中的数据。\n\
  \n###为通往其他用户手中的途中的文件提供一个临时存放地\n\n“嘿，莉莎，你能寄发我一份上个月的棒球统计数据吗？”\n\n“没问题，巴特。”但怎么发呢？如果棒球统计文件位于莉莎的本地驱动器上，莉莎如何给巴特发送文件副本？莉莎可以将文件复制到网络驱动器。巴特可以将文件复制到他的本地硬盘。\n\
  \n当你使用网络驱动器与其他交换文件时，请记住以下几点：\n\n*   在文件被取后，记得删除保存在网络驱动器上的文件！否则，网络驱动器很快就会满。\n*  \
  \ 在网络驱动器上创建一个专门存放文件的文件夹。我喜欢把这个文件夹命名为 `PITSTOP`。\n\n![提示](img/tip.png) 在许多情况下，通过电子邮件向其他网络用户发送文件比使用网络文件夹更简单。只需向其他网络用户发送消息并附上你想共享的文件。通过电子邮件发送文件的优势是，你不需要担心把文件留在服务器的哪个位置以及谁负责删除文件。\n\
  \n###备份你的本地硬盘\n\n如果文件服务器上有足够的驱动器空间，你可以用它来存储硬盘上文件的备份副本。只需将你想备份的文件复制到共享网络文件夹。\n\n\
  显然，如果你将*所有*数据文件都复制到网络驱动器——而且其他人也这样做——它很快就会满。在开始向服务器存储文件备份副本之前，请咨询网络管理员。管理员可能已经设置了一个专门为备份设计的网络驱动器。如果你足够幸运，你的网络管理员可能为你的重要数据设置一个自动备份计划，这样你就不需要记住手动备份。\n\
  \n我希望你的网络管理员也定期将网络服务器磁盘的内容备份到磁带。（是的，*磁带*——详情请参阅第 22 章。）这样，如果网络服务器发生故障，就可以从备份磁带中恢复数据。\n\
  \n## 哦，要去的地方\n\nWindows 允许你通过浏览网络来访问网络资源（如共享文件夹）。在 Windows 7 中，从开始菜单选择“网络”。在 Windows\
  \ 10 中，打开资源管理器（点击任务栏上的文件资源管理器），然后点击“网络”。[图 3-2](#c03.xhtml_c03-fig-0002）显示了 Windows\
  \ 10 版本的网络浏览器。\n\n\n\n\n\n图 3-2 所示的网络仅由两台计算机组成：运行 Windows 10 的桌面客户端计算机(`WIN10-01`)和运行\
  \ Windows Server 2016 的服务器计算机(`WIN1601`)。在实际网络中，你显然会看到不止两台计算机。\n\n![在 Windows 10\
  \ 中浏览网络的快照。](img/9781119648505-fg0302.png)\n\n图 3-2：在 Windows 10 中浏览网络。\n\n你可以通过双击计算机图标来打开计算机，显示该计算机上可共享资源列表。例如，图\
  \ 3-3 显示了`WIN1601`计算机共享的资源。\n\n![服务器计算机上可用资源的快照。](img/9781119648505-fg0303.png)\n\
  \n图 3-3：服务器计算机上的可用资源。\n\n你也可以从任何 Windows 应用程序浏览网络。例如，你可能正在使用 Microsoft Word，并想要打开存储在网络共享文件夹中的文档文件。你只需要使用`Open`（打开）命令调出对话框，然后在`Navigation`（导航）窗格中选择`Network`（网络）来查看可用网络设备。\n\
  \n## 映射网络驱动器\n\n![提示](img/tip.png) 如果你经常访问特定的共享文件夹，可能希望使用称为“映射”的特殊技巧来更高效地访问共享文件夹。映射为共享文件夹分配一个驱动器号。然后，你可以使用该驱动器号像访问本地驱动器一样访问共享文件夹。通过这种方式，你可以从任何\
  \ Windows 程序访问共享文件夹，而无需浏览网络。\n\n例如，你可以将名为`Win1601 Files`的服务器上名为`Data`的共享文件夹映射到你计算机上的`K:`\
  \ 驱动器。然后，要访问存储在共享 `Data` 文件夹中的文件，只需查看`K:` 驱动器即可。\n\n要将共享文件夹映射到驱动器号，请按照以下步骤操作：\n\n\
  1.  **打开文件资源管理器。**\n    *   `Windows 7`: 选择`Start`（开始）⇒`Computer`（计算机）。\n    * \
  \  `Windows 8, 8.1 和 10`: 打开桌面并点击任务栏上的`File Explorer`（文件资源管理器）图标，然后点击屏幕左侧`Location`（位置）列表中的`Computer`（计算机）。\n\
  \n2.  **打开映射网络驱动器对话框。**\n    *   `Windows 7`: 点击工具栏上的`Map Network Drive`（映射网络驱动器）按钮进入此对话框。\n\
  \    *   `Windows 8 和 8.1`: 在`Ribbon`上点击`Map Network Drive`。\n    *   `Windows 10`:\
  \ 点击`Computer`（计算机）选项卡，然后点击`Map Network Drive`。\n\n图 3-4 显示了 Windows 10 的映射网络驱动器对话框。早期版本\
  \ Windows 的对话框也类似。\n\n3.  **（可选）在驱动器下拉列表中更改驱动器号。**\n    你可能不需要更改 Windows 选择的驱动器号（在图\
  \ 3-4 中为`Z:`）。不过，如果你很挑剔，可以从`Drive`（驱动器）下拉列表中选择驱动器号。\n\n    ![映射网络驱动器框的快照。](img/9781119648505-fg0304.png)\n\
  \    图 3-4：映射网络驱动器框。\n\n4.  **点击浏览（浏览）按钮。**\n    出现图 3-5 所示的对话框。\n\n    ![浏览文件夹的快照，用于导航到任何计算机上的任何共享文件夹。](img/9781119648505-fg0305.png)\n\
  \    图 3-5：浏览要映射的文件夹。\n\n5.  **使用浏览文件夹对话框找到并选择你需要的共享文件夹。**\n    你可以导航到任何计算机上的任何共享文件夹。\n\
  \n6.  **点击确定。**\n    `Browse for Folder`对话框将关闭，你返回到`Map Network Drive`框（参见图 3-4）。\n\
  \n7.  **（可选）如果你希望每次登录网络时都自动映射此网络驱动器，请勾选登录时重新连接（Reconnect at Sign-in）复选框。**\n   \
  \ 如果不勾选`Reconnect at Sign-in`复选框，该驱动器号一直有效直到你关闭 Windows 或注销网络。如果你选择此选项，网络驱动将在每次登录时重新连接。\n\
  \n    ![提示](img/tip.png) 如果你经常使用网络驱动器，请务必勾选`Reconnect at Sign-in`复选框。\n\n8.  **点击确定。**\n\
  \    你返回到“此计算机”框，如图 3-6 所示。这里显示了映射驱动器。\n\n    ![此计算机显示映射驱动器的快照。](img/9781119648505-fg0306.png)\n\
  \    图 3-6：此计算机显示映射驱动器。\n\n你的网络管理员可能已经为你的计算机设置了多个网络驱动器。如果是这样，你可以查看哪些网络驱动器已映射。这里有一些额外的提示：\n\
  \n*   为网络驱动器分配驱动器号被称为映射驱动器，或链接驱动器。他们说：“Q:`是映射的网络驱动器”。\n*   网络驱动器号在每台计算机上并不相同。例如，在你的计算机上映射为`M`，在其他计算机上可能映射为`Z`。在这种情况下，你的`M:`\
  \ 和别人的`Z:` 指向相同的数据。\n*   通过映射网络驱动器访问共享文件夹比通过浏览网络快得多。当你浏览网络时，Windows 需要浏览整个网络。相比之下，使用映射驱动器时\
  \ Windows 不需要浏览网络。\n*   如果你为映射驱动器选择了“登录时重新连接”选项（参见图 3-4），如果在登录时驱动器不可用，你会收到警告消息。大多数情况下，问题在于你的计算机无法连接到服务器。请检查所有的网络连接和设置。\n\
  \n## 使用网络打印机\n\n使用网络打印机就像使用网络硬盘：你可以从任何 Windows 应用程序通过选择`Print`（打印）命令调出打印对话框，并从可用打印机列表中选择网络打印机。\n\
  \n但请记住，使用网络打印机与使用本地打印机并不相同；你需要排队。当你使用本地打印机时，只有你一个人在使用。当你使用网络打印机时，你实际上在其他网络用户后面排队等待共享打印机。这种队列使得情况变得复杂：\n\
  \n*   当多个用户同时向网络打印机打印时，网络必须将这些打印任务分开。如果不这样做，结果将是一团乱糟，你的 268 页报告将与工资单混在一起。那太糟糕了。幸运的是，网络通过使用高级的打印池化（print\
  \ spooling）功能来处理这种情况。\n*   网络打印遵循先来后到的原则。每当我在五金店排队时，排在我前面的人总是试图买一个没有产品代码的东西。我不得不在那里等好几个小时，等水管部门的人接电话询问价格。网络打印也可以这样。如果你在发送半页备录之前，有人向打印机发送了一个需要两个小时的打印任务，你就必须等待。\n\
  \n\n\n\n\n*   **你可能可以使用一台本地打印机和几台网络打印机。** 在你被迫使用网络之前，你的电脑可能只连接了一台打印机。你可能想在你廉价的（噢，我的意思是\
  \ `local`）喷喷墨打印机上打印一些文档，但对重要事项使用网络激光打印机。要做到这一点，你必须弄清楚如何使用程序中的功能来切换打印机。\n\n### 添加网络打印机\n\
  \n在向网络打印机打印之前，你必须配置计算机以访问你想要使用的网络打印机。从 `Start` 菜单打开 `Control Panel`，然后双击 `Printers`\
  \ 图标。如果你的计算机已经配置好可以与网络打印机工作，那么 `Printers` 文件夹中就会出现该网络打印机的图标。你可以通过打印机图标的形状来区分网络打印机和本地打印机。网络打印机图标底部有一根管道。\n\
  \n如果你的计算机没有配置网络打印机，可以使用 `Add Printer Wizard`（添加打印机向导）添加。只需遵循以下步骤：\n\n1.  **打开 `Control\
  \ Panel`。**\n    *   `Windows 7` 或更早版本：选择 `Start ⇒ ⇒ Control Panel`。\n    *   `Windows\
  \ 8` 及更高版本：按下 `Windows` 键，输入 `Control`，然后点击 `Control Panel` 图标。\n\n2.  **点击 `Devices\
  \ and Printers`。**\n\n3.  **点击工具栏上的 `Add a Printer` 按钮。**\n    此步骤将启动 `Add Printer\
  \ Wizard`，如图 3-7 所示。\n\n4.  **点击你想使用的打印机。**\n    ![Tip](img/tip.png) 如果你找不到想要使用的打印机，请向网络管理员询问打印机的\
  \ `UNC path`（这是在网络上标识打印机使用的名称）或其 IP 地址。然后点击 `The Printer That I Want Isn’t Listed`，并在提示时输入打印机的\
  \ `UNC` 或 IP 地址。\n\n5.  **点击 `Next` 添加打印机。**\n    向导会将网络打印机的机的打印驱动程序复制到你的计算机上。（系统可能会提示你确认是否要添加该驱动程序。如果是，点击\
  \ `Install Driver` 继续。）\n    ![Snapshot of adding the printer wizard, displaying\
  \ a screen that shows the printer’s name and asks whether to designate the printer\
  \ as a default printer.](img/9781119648505-fg0307.png)\n    FIGURE 3-7: `Add Printer\
  \ Wizard` 要求你选择打印机。\n    `Add Printer Wizard` 显示一个屏幕，显示打印机名称并询问你是否要将打印机指定为默认打印机。\n\
  \n6.  **（可选）将打印机指定为你的默认打印机。**\n\n7.  **点击 `Next` 继续。**\n    将显示最后的确认对话框。\n\n8. \
  \ **点击 `Finish`。**\n    你完成了！\n\n    ![Tip](img/tip.png) 许多网络打印机（尤其是较新的）通过内置以太网卡直接连接到网络。设置这些打印机可能会很复杂。你可能需要网络管理员帮助设置此类打印机。（某些直接连接到网络的打印机有自己的网页地址，例如\
  \ `Printer.SimpsonFamily.com`。如果是这样，你通常只需点击几次即可设置打印机：使用浏览器访问打印机的网页，然后点击允许你安装打印机的链接。）\n\
  \n### 打印到网络打印机\n\n在 Windows 中安装网络打印机后，向网络打印机打印就变得轻而易举。你可以从任何 Windows 程序中使用 `Print`\
  \ 命令唤出 `Print` 对话框，该对话框通常位于 `File` 菜单中。例如，图 3-8 显示了 `WordPad`（Windows 自带的免费文本编辑程序）的\
  \ `Print` 对话框。可用打印机列在该对话框的顶部。从列表中选择网络打印机。\n    ![Snapshot of a typical print dialog\
  \ box.](img/9781119648505-fg0308.png)\n    FIGURE 3-8: 典型的 `Print` 对话框。\n\n### 使用打印队列\n\
  \n将文档发送到网络打印机后，你通常不需要担心它。你只需要去网络打印机，砰！打印好的文档就在那里等你了。\n\n这就是在理想世界中发生的情况。在我和生活的现实世界中，在你发送任务到网络打印机和它打印之间，你的打印任务可能会发生各种事情：\n\
  *   你发现有人在你之前发送了一份长达 50 万亿页的报告，预计要等到国债还清时才能打印完。\n*   一个 framis 阀的价格突然上涨了 2 美元，这使得你在报告中提出的建议变得很愚蠢。\n\
  *   你的老板来来告诉你，他的姐夫将参加会议，所以请你不要为他额外打印一份提议书？噢，复印件是不行的。请只要原件。\n*   你决定去吃午饭，所以你不希望在你回来之前打印输出。\n\
  \n幸运的是，仅仅因为你已经将打印任务发送到了网络打印机，你的打印任务也完全不受你控制。你可以轻松地更改已发送任务的状态。你可以更改任务打印的顺序、挂起任务以便在你指示之前不进行打印，或者取消任务。\n\
  \n你可能还可以让你的网络打印任务执行其他花招：握手、翻滚和装死。但基本的技巧——暂停、取消和更改打印顺序——足以让你上手。要操作打印队列，在 `Windows\
  \ 7` 或更早版本中通过 `Start ⇒ ⇒ Control Panel` 打开 `Control Panel`；或者按下 `Windows` 键，输入 `Control`\
  \ 并点击 `Control Panel` 图标。然后点击 `Devices and Printers` 并双击你想管理的打印机。会出现一个类似于图 3-9 的窗口。你可以看到只有一个文档发送到了打印机。\n\
  \    ![Snapshot of managing a print queue.](img/9781119648505-fg0309.png)\n    FIGURE\
  \ 3-9: 管理打印队列。\n\n要操作队列中出现的打印任务，请使用这些技巧：\n*   **临时停止任务打印：** 选择该任务并选择 `Document ⇒\
  \ Pause Printing`。再次选择相同命令将任务从其“焦虑”中释放出来。\n*   **删除打印任务：** 选择该任务并选择 `Document ⇒\
  \ Cancel Printing`。\n*   **停止打印机：** 选择 `Printer ⇒ Pause Printing`。要恢复，再次选择该命令。\n\
  *   **删除所有打印任务：** 选择 `Printer ⇒ Purge Documents`。\n*   **将任务调到最前：** 将你想打印的任务拖动到列表顶部。\n\
  \n所有这些提示仅适用于你的打印任务。遗憾的是，你不能删除别人的打印任务。\n\n### 注销网络\n\n在使用完网络后，请注销。注销网络会导致网络驱动器和打印机不可用。你的计算机物理上仍连接到网络（除非你用修剪剪剪断网线；那是坏主意——不要这样做！），但网络及其资源对你是不可用的。\n\
  \n注销时还需要记住以下几点：own*   在关闭计算机后，你会自动注销网络。启动计算机后，你必须重新登录。\n    ![Remember](img/remember.png)\
  \ 如果你要离开计算机一段时间，注销网络是一个好主意。只要你的计算机登录了网络，任何人都可以用它访问网络。因为未经授权的用户可以使用你的用户 ID 访问，他们造成的任何损坏都由你来承担。\n\
  *   在 Windows 中，你可以通过点击 `Start` 按钮并选择 `Log Off` 命令来注销网络。此过程会在不重启 Windows 的情况下注销网络。\n\
  \n\n\n\n\n* *在 Windows 7 中：* 点击“开始”按钮，然后点击小锁图标旁边出现的向右箭头。\n* *在 Windows 8、8.1 和 10\
  \ 中：* 按 `Ctrl+Alt+Del`，然后选择“注销”。\n\n# 第 4 章\n\n## 使用网络的更多方法\n\n### 本章内容\n\n* ![Bullet](img/check.png)\
  \ **将你的计算机转换为网络服务器**\n* ![Bullet](img/check.png) **与网络用户共享文件夹**\n* ![Bullet](img/check.png)\
  \ **在公用文件夹中工作**\n* ![Bullet](img/check.png) **共享你的打印机**\n* ![Bullet](img/check.png)\
  \ **在网络上使用 Office**\n* ![Bullet](img/check.png) **离线处理文件**\n\n第 3 章 向你介绍了使用网络的基础知识：登录、访问共享网络文件夹中的数据、打印和注销。在本章中，我将带你超越这些基础内容。你将了解到如何将你的计算机变成一台共享自己的文件和打印机的服务器，如何使用最流行的网络计算机应用程序之一——电子邮件，以及如何在网络上使用\
  \ Office。\n\n## 共享你的物品\n\n你可能已经知道网络由两种类型的计算机组成：客户端计算机和服务器计算机。在计算机网络经济中，*客户端计算机*是消费者——即使用网络资源（如共享打印机和磁盘驱动器）的设备。*服务器*是提供者——它们将自己的打印机和硬盘提供给网络，以便客户端计算机可以使用。\n\
  \n本章将向你展示如何将你平凡的 Windows 客户端计算机转换为服务器计算机，以便网络上的其他计算机可以使用你的打印机以及你决定想要共享的任何文件夹。实际上，你的计算机同时充当客户端和服务器的角色。几个示例说明了这一点：\n\
  \n* 当你向网络打印机发送打印作业，或访问存储在另一台服务器硬盘上的文件时，它就是`client`。\n* 当其他人向你的打印机发送打印作业，或访问存储在你计算机硬盘上的文件时，它就是`server`。\n\
  \n## 启用文件和打印机共享\n\n在与其他网络用户共享你的文件或打印机之前，你必须设置 Windows 文件和打印机共享功能。如果没有安装此功能，你的计算机可以作为网络客户端，但不能作为服务器。\n\
  \n如果你足够幸运，你的计算机上已经设置了文件和打印机共享。要确认这一点，打开 Windows 资源管理器，并在导航窗中右键点击`Desktop`（桌面）。如果菜单中包含`共享给`命令，则文件和打印机共享已设置好，你可以跳过本节的其余部分。如果你找不到`共享给`命令，请按照以下步骤操作：\n\
  \n1. **点击“开始”按钮，输入** 网络和共享中心，**并按回车。**\n   此步骤将打开网络和共享中心。\n2. **点击更改高级共享设置。**\n\
  \   将显示高级共享设置页面。\n3. **点击要启用文件和打印机共享的网络旁边的向下箭头。**\n   * *对于家庭计算机：* 点击“家庭”或“工作”（Windows\
  \ 7）或“私有”（Windows 8 及更高版本）旁边的向下箭头。\n   * *对于公共位置的计算机：* 点击“访客”或“公共”旁边的向下箭头。\n   *\
  \ *对于连接到域网络的计算机：* 点击“域”旁边的向下箭头。\n\n图 4-1 显示了域网络的设置。家庭、访客或公共计算机的设置是相同的。\n\n![在公共网络上启用文件或打印机共享的快照会将计算机数据暴露给同一公共网络上的其他用户。](img/9781119648505-fg0401.png)\n\
  \n图 4-1： 启用文件和打印机共享。\n\n![警告](img/warning.png) *不要*为公共网络启用文件或打印机共享。在公共网络上启用文件或打印机共享会将你的计算机数据暴露给同一公共网络上的其他用户。\n\
  \n4. **选择开启文件和打印机共享共享选项。**\n5. **点击“保存更改”按钮。**\n   此操作将保存你的更改并关闭高级共享设置页面。\n\n##\
  \ 共享文件夹\n\n为了让其他网络用户访问存储在你硬盘上的文件，你必须将硬盘上的某个文件夹指定为*共享*文件夹。请注意，如果你愿意，你也可以共享整个驱动器。如果你共享了整个驱动器，其他网络用户就可以访问该驱动器上的所有文件和文件夹。如果你共享了一个文件夹，网络用户只能访问你共享的文件夹中的文件。（如果你共享的文件夹包含其他文件夹，网络用户也可以访问这些文件夹中的文件。）\n\
  \n![警告](img/warning.png) 不要共享整个硬盘，除非你想让*网络上的每个人*都有权偷看你硬盘上的每一个文件。相反，你应该只共享包含你想让他人访问的特定文档的文件夹或文件夹。例如，如果你将所有的\
  \ Word 文档存储在`My Documents`（我的文档）文件夹中，你可以共享你的`My Documents`文件夹，以便其他网络用户访问你的 Word\
  \ 文档。\n\n要在 Windows 桌面版上共享文件夹，请按照以下步骤操作：\n\n1. **打开资源管理器。**\n   * *Windows 10：*\
  \ 打开桌面并点击任务栏上的资源管理器图标；然后点击列表中的`计算机`。\n   * *Windows 7：* 选择“开始”⇒“计算机”。\n2. **导航到想要共享的文件夹。**\n\
  3. **右键点击想要共享的文件夹并选择“属性”。**\n   出现属性对话框。\n4. **点击“共享”选项卡，然后点击“共享”按钮。**\n   出现共享对话框，如图\
  \ 4-2 所示。\n\n![共享框的快照。](img/9781119648505-fg0402.png)\n\n图 4-2： 共享框。\n\n5. **点击下拉列表中的\
  \ Everyone，然后点击添加。**\n   此操作指定网络上的任何人都可以访问该文件夹。\n   如果你愿意，可以将访问限制为某些用户。为此，选择你想授予访问权限的每个人，然后点击“添加”。\n\
  6. **为每个用户选择访问级别。**\n   你可以使用权限列中的下拉列表从三个访问级别进行选择：\n   * *读取：*读取者可以打开文件，但不能修改或创建新文件或文件夹。\n\
  \   * *更改：*参与者可以向共享文件，但只能更改或删除自己的文件。\n   * *所有者：*所有者对共享文件夹具有完全访问权限。他或她可以创建、更改或删除文件夹中的任何文件。\n\
  7. **点击“共享”。**\n   出现确认对话框以确认文件夹已共享。\n\n## 使用公用文件夹\n\nWindows 提供了另一种网络共享方法：公用文件夹。*公用文件夹*是一个自动指定用于公共访问的文件夹。你保在此文件夹中的文件可以被网络上的其他用户以及登录你计算机的用户访问。\n\
  \n在使用公用文件夹之前，你必须启用它。只需按照本章前面“启用文件和打印机共享”节列出的步骤操作，但在“所有网络”（Windows 10）或“公共共享设置”（较早版本的\
  \ Windows）中选择“开启共享”选项。\n\n启用公用文件夹共享后，在 Windows 7 中可以通过选择“开始”⇒“计算机”，展开左窗格中的“库”项，然后展开“文档”、“音乐”、“图片”或“视频”项来访问计算机上的公用文件夹。在\
  \ Windows 8 及更高版本中，打开桌面，点击任务栏上的资源管理器图标，展开左窗格中的“库”项，然后展开“文档”、“音乐”、“图片”或“视频”项。\n\n\
  \n\n\n\n图 4-3 显示了公共文件夹（Public folder）的示例。\n\n你可以看到，公共文件夹包含几个预定义的子文件夹，用于共享文档、下载的文件、音乐、图片和视频。如果你需要，可以使用这些子文件夹，或者你也可以创建自己的子文件夹来帮助组织公共文件夹中的数据。\n\
  \n![公共文件夹的快照。它包含了几个预定义的子文件夹，用于共享文档、下载的文件、音乐、图片和视频。](img/9781119648505-fg0403.png)\n\
  \n图 4-3: 公共文件夹。\n\n![提示](img/tip.png) 要访问另一台计算机的公共文件夹，请使用我在第 3 章中描述的技术，要么浏览到公共文件夹，要么将其映射到网络驱动器。\n\
  \n## 共享打印机\n\n共享打印机比共享硬盘要痛苦得多。当你共享硬盘时，其他网络用户会经常访问你的文件。当他们访问时，你会听到驱动器发出几次咔哒声，你的电脑可能会停顿半秒左右。其他用户访问你的驱动器引起的干扰有时是明显的，但很少会令人烦恼。\n\
  \n当你共享打印机时，你就能看到墨菲定律的威力了：走廊尽头的同事很可能在你尝试打印一份必须在两分钟内送到老板桌上的单页备忘录之前，向你的打印机发送一份 140\
  \ 页的报告。打印机可能会在其他人的打印任务过程中缺纸——或者更糟，卡纸——而你被要求去处理这个问题。\n\n尽管这些中断可能令人烦恼，但在某些情况下，共享你的打印机是有意义的。如果你是办公室或工作组中唯一一台好用的打印机，大家还是会缠着让你用。你不如在网络上共享这台打印机。至少这样，他们就不会排在你门口要求你帮他们打印文档了。\n\
  \n要共享打印机，请按照以下步骤操作：\n\n1. **打开控制面板。**\n    * *Windows 10, 8.1 和 8：* 按 Windows 键，输入\
  \ `Control`，然后点击 `Control Panel`（控制面板）图标。\n    * *Windows 7：* 选择 开始 ⇒ 控制面板。\n\n\
  2. **点击设备和打印机。**\n\n3. **右键点击你想要共享的打印机并选择“打印机属性”。**\n   出现打印机的属性对话框。\n\n4. **点击“共享”选项卡。**\n\
  \   出现共享选项卡，如图 4-4\n\n图 4-4: 共享打印机。\n\n要将你的共享打印机从网络取消以便其他网络用户无法访问，请按照上述步骤的步骤 1–4。取消勾选“共享此打印机”复框，然后点击确定。\n\
  \n## 在网络上使用 Microsoft Office\n\nMicrosoft Office 是个人计算机上最流行的应用程序套件，包含了办公室中最常用的类型程序：文字处理程序（Word）、电子表格程序（Excel）、演示文程序（PowerPoint）以及一个优秀的电子邮件程序（Outlook）。根据你购买的\
  \ Office 版本，你可能还会获得数据库程序（Access）、桌面出版程序（Publisher）、一组 Ginsu 刀具（KnifePoint）以及一个切片机（ActiveSalsa）。\n\
  \n![提示](img/tip.png) 为了在网络上充分利用 Office 的功能，你应该下载 Office 部署工具（Office Deployment Kit）。此工具允许你为\
  \ Office 创建简单的点击即运行安装程序。你可以通过在你喜爱的搜索引擎中搜索 Office Deployment Kit 来轻松找到它。\n\n### 访问网络文件\n\
  \n打开网络驱动器上的文件几乎与打开本地驱动器上的文件一样简单。所有 Office 程序都使用 `File ⇒ Open`（文件 ⇒ 打开）来调出打开对话框，如在图\
  \ 4-5\n\n图 4-5: Excel 中的打开对话框。\n\n要访问映射到驱动器号的网络卷卷上的文件，你只需要使用对话框顶部的下拉列表即可。你可以通过导航到文件夹、右键点击并选择“映射网络驱动器”，直接从打开框中映射网络驱动器。\n\
  \n![提示](img/tip.png) 如果你尝试打开另一个网络用户已打开的文件，Office 会告诉你该文件正在使用中，并提供让你打开只读版本。它不会让你覆盖现有文件。\n\
  \n### 使用工作组模板\n\n虽然偶尔牺牲给 Office 之神可能会让你的计算生活变得轻松，但模板并不是崇拜场所。相反，模板是一种特殊的文档文件，它包含格式信息、版式文本和其他自定义设置，你可以将其作为创建新文档的基础。\n\
  \n三个 Office 程序——Word、Excel 和 PowerPoint 允许你在每次创建新文档时指定模板。当你通过选择 `File ⇒ New`（文件\
  \ ⇒ 新建）在 Word、Excel 或 PowerPoint 中创建新文档时，你会看到一个对话框，允许你为新文档选择模板。\n\nOffice 自带了一套适用于最常见类型文档的模板。这些模板被分组在出现在“新建”对话框顶部各个选项卡下。\n\
  \n除了 Office 附带的模板外，你还可以在 Word、Excel 和 PowerPoint 中创建自己的模板。如果你想为你网络用户准备的文档建立统一的外观，创建自己的模板将特别有用。例如，你可以创建一个包含公司信头的信函模板，或者创建一个包含公司标志的提案书模板。\n\
  \n\n\n\n\n无论你打开哪个文档都行。执行此步骤之所以必要，是因为除非打开了文档，否则 Word 不允许你访问模板文件夹位置。\n\n2. **选择文件\
  \ ⇒ 选项。**\n\n打开`Word 选项`对话框。\n\n3. **点击“高级”选项卡。**\n\n出现高级选项。\n\n4. **向滚动滚动到“常规”部分，然后点击“文件位置”按钮。**\n\
  \n出现`文件位置`对话框，如图 4-6 所示。\n\n5. **双击“工作组模板”项。**\n\n此步骤将打开一个对话框，允许你浏览到模板文件的位置。\n\n\
  6. **浏览到模板文件，然后点击“确定”。**\n\n你返回到`文件位置`对话框。\n\n7. **点击“确定”关闭“文件位置”对话框。**\n\n你返回到`Word\
  \ 选项`对话框。\n\n8. **再次点击“确定”。**\n\n关闭`Word 选项`对话框。\n\n![设置文件位置的截图。](img/9781119648505-fg0406.png)\n\
  \nFIGURE 4-6: 设置文件位置。\n\n![提示](img/tip.png) 虽然用户模板和工作组模板的设置会影响 Word、Excel 和 PowerPoint，但你只能在\
  \ Word 中更改这些设置。Excel 和 PowerPoint 的选项对话框中不显示“用户模板”或“工作组模板”选项。\n\n当你安装 Office 时，Office\
  \ 随附的标准模板会被复制到计算机本地磁盘驱动器上的文件夹中，并将“用户模板”选项设置为该文件夹。“工作组模板”选项则留空。你可以通过点击`网络模板`、点击`修改`按钮并指定包含你工作组模板的共享网络文件夹，将工作组模板文件夹设置为共享网络文件夹。\n\
  \n### Access 数据库的网络化\n\n如果你想在多个网络用户之间共享 Microsoft Access 数据库，请注意一些特殊的考虑因素。以下是最重要的：\n\
  \n* 当你共享数据库时，可能会有多个用户尝试访问同一条记录。如果有两个或多个用户尝试更新该记录，这种情况可能会导致问题。为了处理这种潜在的流量拥堵，Access\
  \ 会锁定记录，以便一次只允许一个用户更新它。Access 使用三种方法之一锁定记录：\n\n    * `已编辑记录`：每当用户开始编辑记录时，此方法就会锁定记录。例如，如果用户在允许更新记录的表单中检索了一条记录，Access\
  \ 会在用户编辑期间锁定该记录，直到第一条记录处理完成，其他用户才无法编辑该记录。\n\n    * `不锁定`：这种方法并不意味着记录未被锁定。相反，`不锁定`\
  \ 意味着在用户向数据库写入更改之前，记录不会被锁定。这种方法可能会让用户感到困惑，因为它允许一个用户覆盖另一个用户所做的更改。\n\n    * `所有记录`：每当用户编辑表中的任何记录时，`所有记录`\
  \ 都会锁定整个表。\n\n* Access 允许你拆分数据库，使表单、查询和报告存储在每个用户的本地磁盘驱动器上，但数据本身存储在网络驱动器上。此功能可以使数据库在网络上运行得更高，但设置起来稍微复杂一些。（要拆分数据库，选择`工具\
  \ ⇒ 数据库实用程序 ⇒ 数据库拆分$`。）\n\n* Access 包含了内置的安全功能，如果你从 Windows 客户端计算机共享 Access 数据库，应该使用这些功能。如果你将数据库存储在域服务器上，可以使用服务器的安全功能来保护数据库。\n\
  \n* Access 每隔 60 秒自动刷新表单和数据表。这样，如果一个用户打开了表单或数据表，另一个用户在几秒后更改了数据，第一个用户可以在分钟内看到更改。如果\
  \ 60 秒的间隔太长（或太短），你可以通过`选项`对话框中的`高级`选项卡来更改刷新率。\n\n### 使用离线文件\n\n台式电脑本质上是固定的“野兽”。因此，它们几乎总是连接到网络。然而，笔记本电脑更具流动性。如果你有一台笔记本电脑，你可能会带着它到处去。如果你在公司有网络，你在工作时可能会连接到网络。但周末你会把笔记本电脑带回家，你就没有连接到网络。\n\
  \n当然，你的老板希望你周末工作，因此你需要一种方法在离开办公室且断开网络时访问你重要的网络文件。这就是离线文件功能的用武之地。它让你即使在断开网络时也能访问网络文件。\n\
  \n这听起来像变魔法，但实际上并非如此。想象一下如果没有此功能，你如何在离开网络的情况下工作。你只需将需要工作的文件复制到笔记本电脑的本地硬盘驱动器上。然后，当你把电脑带回家时，就在本地副本上工作。当你回到办公室时，连接网络并将修改后的文件复制回网络服务器。\n\
  \n这本质上就是离线文件的工作原理，只不过 Windows 会自动完成所有的复制工作。Windows 还利用“障眼法”让副本看起来实际上在网络上，即使你没有连接到网络。例如，如果你映射了一个驱动器（例如\
  \ `M` 盘）并将其设置为离线可用，Windows 知道当你没有连接到网络时，它应该重定向 `M:`。\n\n![警告](img/warning.png) 使用离线文件的主要问题在于，当多个用户想要访问相同的离线文件时。Windows\
  \ 可以尝试解决这种混乱，但效果并不理想。最好的建议是不要对其他用户可能访问的网络资源使用离线功能，除非这些资源是你打算修改的只读资源。\n\n在使用离线文件之前，你必须先启用该功能。要做到这一点，请打开控制面板，双击`同步中心`图标，然后点击`管理离线文件`。这将弹出`离线文件`对话框，如图\
  \ 4-7 所示。接下来，点击`启用离线文件`然后点击`确定`。\n\n启用离线文件后，使用离线文件非常简单：只需打开`计算机`文件夹，右键点击你想设置为离线的映射网络驱动器，然后选择`始终离线可用`。如果你不想将整个映射驱动器设置为离线访问，可以使用相同的技术设置映射驱动器中的单个文件夹：右键点击文件夹，然后选择`始终离线可用`。\n\
  \n当你第一次将驱动器或文件夹设置为离线可用时，Windows 会将驱动器或文件夹上的所有文件复制到本地存储。根据涉及的文件数量，此过程可能需要很长时间，因此请做好相应准备。\n\
  \n\n\n\n关于离线文件，还有以下几点需要考虑：\n\n- 如果你需要，可以通过右键点击驱动器或文件夹并选择“同步”，强制 Windows 同步你的离线文件。\n\
  - 在设置“脱机使用可用”选项时，确保文件夹中没有文件正处于打开状态。如果有任何文件处于打开状态，你将收到错误消息。你必须关闭打开的文件之前才能将文件夹指定为离线访问。\n\
  - 映射驱动器的属性对话框包含一个“离线文件”选项卡，如图 4-8 所示。\n 雇主非常喜欢离线文件功能，因为它鼓励员工在晚上和周末在家工作。事实上，你每使用一次离线文件功能在家里工作，你的老板就会给比尔·盖斯送去五分硬币。他就是这样变得富有的。\n\
  \n![映射驱动器属性对话框截图，包含一个离线文件选项卡。](img/9781119648505-fg0408.png)\n\n图 4-8： 离线文件属性。\n\
  \n# 第二部分\n\n## 设计你的网络\n\n在本部分中……\n\n- 创建网络计划。\n- 理解并使用 TCP/IP。\n- 使用电缆、网络适配器、交换机和其他重要的网络组件。\n\
  - 在你的网络中使用无线设备。\n- 连接到互联网。\n\n# 第 5 章\n\n## 规划网络\n\n在本章中\n\n![项目](img/check.png)\
  \ 制定网络计划\n![项目](img/check.png) 盘点你的电脑设备\n![项目](img/check.png) 确保你清楚为什么需要网络\n![项目](img/check.png)\
  \ 识别无法避免的基本网络决策\n\n好了，既然你已经确信自己需要为电脑联网了。现在该怎么办？你是打算上班路上顺路去“电脑超市”，在喝完早咖啡之前安装好网络，并指望中午之前网络就能完全运行吗？\n\
  \n我不这么认为。\n\n为电脑联网就像进行任何其他值得的努力一样：要做好这一点需要一些规划。本章将帮助你在开始花钱之前仔细思考你的网络。它将向你展示如何制定一个网络计划，其质量完全和网络顾问收取数千美元为你提供的计划一样好。看到了吧？这本书书已经在帮你省钱了！\n\
  \n### 制定网络计划\n\n在开始任何网络项目之前（无论是新网络的安装还是现有网络的升级），请先从一份详细的计划开始。如果你在研究所有影响项目的问题之前就仓匆地做出技术决策，你将会后悔的。你会等到太晚才发现，某个关键应用程序无法在网络上运行，网络性能慢得无法接受，或者网络的关键组件无法协同工作。\n\
  \n在创建网络计划时，请记住以下一些通用想法：\n\n- **不要急于制定计划。** 最昂贵的网络错误是你在购买任何东西之前犯下的错误。要想清楚并考虑替代方案。\n\
  - **把网络计划写下来。** 计划不需要是一份华丽的、500 页的文档。如果你想让它看起来好看，可以拿一个小型三孔活夹。这个活夹足够装下你的网络计划，还有剩余空间。\n\
  - **在购买任何东西之前，让别人读读你的网络计划。** 最好找一个比你更懂电脑的人。\n- **保持计划更新。** 如果你向网络添加了内容，就翻出计划，拍掉灰并更新它。\n\
  \n![提示](img/tip.png) “老鼠和人类最周密的计划往往事与愿违，留给我们的除了承诺中的喜悦之外，只有痛苦和悲。”罗伯特·伯斯生活在计算机网络出现几百年前，但他著名的格言依然切切。网络计划不是刻在石头上的。如果你发现某些东西的运行方式不像你预想的那样，没关系。只需更改你的计划即可。\n\
  \n### 明确目的\n\n规划网络的第一步之是确保你理解起初为什么想要这个网络。以下是创建或升级网络的一些常见原因，它们都是非常合理的：\n\n- 办公室里的每个人都需要访问互联网。建立小型网络最常见的原因可能是为了共享互联网连接。即使在较大的网络中，共享互联网访问也是网络的主要优势之一。\n\
  - 我的同事和我几乎每天都用 U 盘交换文件。有了网络，交换文件会变得更简单。\n- 我不想给每个人都买一台彩色激光打印机，因为我知道我们现在的设备在一天中的大部分时间只是在那里占用空间。所以，投资网络不是比为每台电脑买一台彩色激光打印机更好吗？\n\
  - 生意太好了，一个人每天打 8 小时订单根本跟不上。如果销售和会计数据存在网络服务器上，我就可以雇佣另外一个人来帮助，而且不需要给他们任何人付加班费。\n-\
  \ 我的小姐刚刚升级了她办公室的网络，我不想让她觉得我落后于时代。\n- 我现在的网络运行就像是用风筝线和锡罐做的。我本该在五年前就升级它，以加快访问共享文件的速度，提供更好的安全性以及更方便的管理。\n\
  \n确保你识别出你认为需要网络的所有原因，然后把它们写下来。不用担心你的优美文采会让你获得普利策奖。只需确保写下你对网络的预期即可。\n\n如果你正在编写一份\
  \ 500 页的网络建议书，将为什么需要网络的描述放在名为“理由”的选项卡下。\n\n![提示](img/tip.png) 在考虑为什么需要网络时，你可能会得出其实并不需要的结论。这没关系。你可以把那个活夹用来收藏邮票。\n\
  \n### 盘点\n\n网络规划中挑战性的部分之一是了解你已有的电脑情况。换句话说，如何从这里到达那里？在规划如何到达“那里”之前，你必须知道“这里”在哪里。换句话说，你必须对现有电脑进行彻底清点。\n\
  \n#### 你需要的信息\n\n你需要了解每台电脑的以下信息。如果现在还不懂这些术，不要担心。它们只是碎片。\n\n- **处理器类型，如果可能，还有其主频：**\
  \ 如果每台电脑都有全新的 `Core i7` 八核处理器就好了。但在大多数情况下，你会发现各种电脑：新的、旧的、借来的、蓝色的。你可能会发现一些过时的 `Pentium`\
  \ 电脑。\n\n通常无法通过观察机箱判断是什么种处理器。找到电脑型号最简单的方法是打开 Windows 资源管理器，右键点击“此电脑”，然后选择“属性”。会弹出一个属性页面，包含电脑所使用的处理器类型。例如，图\
  \ 5-1 显示使用 `Core i7` 处理器的电脑属性页面。\n- **内存容量：** 这一信息也可以在电脑属性页面上找到，如图 5-1 所示。\n- **硬盘的大小和分区布局：**\
  \ 要在 Windows 10 中查找硬盘大小，请打开文件资源管理器（位于桌面任务栏），然后右键点击驱动器图标，从弹出的快捷菜单中选择“属性”命令。（早期 Windows\
  \ 版本的操作方法类似。）图 5-1 显示 126GB 磁盘驱动器的属性对话框，它有约 115GB 的可用空间。\n\n\n\n\n![一个 126GB 硬盘驱动器属性对话框截图，显示有约\
  \ 115GB 可用空间。](img/9781119648505-fg0501.png)\n\n图 5-1: 硬盘驱动器的属性对话框。\n\n如果你的电脑有多多个硬盘，Windows\
  \ 会在“计算机”窗口中列出每个驱动器的图标。记下每个驱动器的大小和可用可用空间。\n\n*   **操作系统版本：** 你也可以从“系统属性”对话框中推断出。例如，图\
  \ 5-2 所示的属性页表明电脑正在运行 `Windows 10 Pro`。![配备 Core i7 处理器和 8GB 内存的电脑属性页截图](img/9781119648505-fg0502.png)\n\
  \n图 5-2: 配备 Core i7 处理器和 8GB 内存的电脑属性页。\n\n*   **电脑连接了什么类型的打印机（如果有）：** 通常，只需观察打印机就能判断。你也可以通过双击`控制面板`中的`设备和打印机`图标来查看。\n\
  \n*   **连接到电脑的其他设备：** DVD 或蓝光驱动器？扫描仪？外部磁盘或磁带驱动器？摄像机？战斗机器人？热水缸？\n\n*   **电脑上使用了哪些软件：**\
  \ `Microsoft Office`？`AutoCAD`？`QuickBooks`？列出一份完整的清单并包含版本号。\n\n*   **电脑是否具有无线功能？**\
  \ 几乎所有的笔记本电脑都有。大多数台式电脑没有，但如果你希望网络完全无线化，可以添加一个廉价的 USB 无线适配器。\n\n## 为你收集信息的程序\n\n\
  如果你有多台电脑需要联网，收集电脑信息将是大量工作。幸运的是，有几种软件程序可以自动为你收集信息。这些程序会检查电脑的各个方面，例如 CPU 类型和速度、RAM\
  \ 数量以及电脑硬盘的大小。然后它们会在屏幕上显示这些信息，并提供将信息保存到硬盘文件或打印的选项。\n\nWindows 自带这样一个程序，称为`Microsoft\
  \ System Information`。`Microsoft System Information` 会收集并打印有关你电脑的信息。在 `Windows 10`\
  \ 中启动`Microsoft System Information`，右键点击`开始`按钮并选择`运行`，然后输入 `msinfo32` 并按回车。\n\n\
  当你启动`Microsoft System Information`时，你会看到一个与图 5-3 所示类似的窗口。最初，`Microsoft System Information`\
  \ 显示有关电脑的基本信息，例如你的 `Microsoft Windows` 版本、处理器类型、电脑的内存量等。你可以通过点击窗口左侧的`硬件资源`、`组件`或其他类别来获取更详细的信息。\n\
  \n![收集所需数据的系统信息程序页面截图](img/9781119648505-fg0503.png)\n\n图 5-3: 让系统信息程序收集你需要的数据。\n\
  \n## 专用还是不专用：这是一个问题\n\n网络计划必须回答的最基本问题之一是，网络将拥有一个或多个专用服务器，还是完全依赖点对点网络。如果你购买网络的唯一理由是为了共享打印机和偶尔交换文件，那么你可能不需要一台专用的服务器电脑。在这种情况下，你可以利用已有的电脑创建一个点对点网络。然而，除了最小的网络外，所有的网络都会从拥有一台独立的、专用的服务器电脑中受益。\n\
  \n*   **使用专用服务器电脑会让网络更快、更易操作且更可靠。** 然而，考虑一下，当一个兼任工作站的服务器电脑用户决定关闭电脑，而没有意识到其他人正在访问他硬盘上的文件时，会发生什么。\n\
  \n*   **你不一定非要使用最大、最快的电脑作为你的服务器电脑。** 我见过某些网络，网络上最慢的电脑反而是服务器。当服务器主要用于共享打印机或存储少量共享文件时，这一建议尤尤为适用。因此，如果你需要为网络购买一台电脑，可以考虑将你其中的一台旧电脑升级为服务器，并将新电脑作为客户端。\n\
  \n假设你的网络将需要一个或多个专用服务器，你接下来应该考虑网络需要何种类型的服务器。在某些情况下，一台服务器电脑可以胜任一个或多个此类角色。尽可能将每台服务器电脑限制在单一的服务器功能上。\n\
  \n### 文件服务器\n\n`File servers`（文件服务器）提供集中磁盘存储，供网络上的客户端方便地共享。文件服务器最常见的任务是存储共享文件和程序。例如，小型工作组的成员可以使用文件服务器上的磁盘空间来存储他们的\
  \ `Microsoft Office` 文档。\n\n文件服务器必须确保两个用户不会同时更新同一个文件。文件服务器通过在用户更新文件时对文件进行`locking`锁定来实现这一点，这样在第一个用户完成之前，其他用户无法访问该文件。对于文档文件（例如文字处理或电子表格文件），整个文件会被锁定。对于数据库文件，锁定可以仅应用于正在更新的文件部分。\n\
  \n### 打印服务器\n\n共享打印机是小型网络存在的主要原因之一。虽然不是必须，但一台服务器电脑可以专门用作`打印服务器`，其唯一目的是收集发送到打印机的信息并按顺序进行打印。\n\
  \n*   一台电脑可以兼任文件服务器和打印服务器，但使用专门的电脑性能更好。\n\n*   对于每台约 100 美元的廉价喷喷打印机，给每个用户配备一台打印机是非常诱人的。然而，一分一钱。与其为\
  \ 15 个用户购买 100 美元的打印机，不如买一台 1500 美元的高速激光打印机并共享它。1500 美元的激光打印机会快得多，输出效果可能更好，而且运行成本更低。\n\
  \n### Web 服务器\n\n`Web server`是运行能够让计算机托管网站软件的服务器电脑。两个最流行的 Web 服务器程序是微软的 `IIS`（互联网信息服务）和由\
  \ Apache 软件基金管理的 `Apache`。\n\n### 邮件服务器\n\n`服务器`（邮件服务器）是处理网络电子邮件需求的服务器。它配置了邮件服务器软件，例如\
  \ `Microsoft Exchange Server`。`Exchange Server` 设计用于与 `Microsoft Office` 自带的电子邮件客户端\
  \ `Microsoft Outlook` 工作。\n\n大多数邮件服务器的功能远不止发送和接收电子邮件。例如，以下是 `Exchange Server`提供的电子邮件之外的功能：\n\
  \n*   简化项目管理的协作功能\n*   音频和视频会议\n*   聊天室和即时消息 (IM) 服务\n*   `Microsoft Exchange Forms\
  \ Designer`，它可以为应用程序开发自定义表单，如休假申请或采购订单。\n\n![提示](img/tip.png) 建立自有邮件服务器的另一种日益流行的替代方案是订阅微软的\
  \ `Exchange Online` 服务。通过 `Exchange Online`，微软负责处理设置和维护 Exchange 服务器的所有细节。你的 `Microsoft\
  \ Outlook` 客户端配置为通过互联网连接到 `Exchange Online` 服务，而不是本地网络内的 Exchange 服务器。\n\n### 数据库服务器\n\
  \n\n\n\n\n`database server`（数据库服务器）是运行数据库软件的服务器计算机，例如微软的 SQL Server 2019。数据库服务器通常与定制的业务应用程序一起使用，例如会计系统或营销系统。\n\
  \n## 应用服务器\n\n`application server`（应用服务器）是运行特定应用程序的服务器计算机。例如，你可能会使用需要自带服务器的会计应用程序。在这种情况下，你需要为该会计应用程序分配一台专用服务器。\n\
  \n## 许可证服务器\n\n某些组织使用需要从中央许可证服务器分发许可证的软件。例如，工程公司经常使用如 AutoCAD 之类的计算机辅助设计（CAD）软件，这些软件需要一个许可证服务器。在这种情况下，你需要设置一台服务器来处理分发功能。\n\
  \n## 选择服务器操作系统\n\n如果你确定你的网络需要一个或多个专用服务器，下一步是确定这些服务器应该使用何种网络操作系统。如果可能的话，所有服务器都应该使用相同的网络操作系统（`NOS`），这样你就不需要同时维护不同的操作系统。\n\
  \n虽然你可以从许多网络操作系统中进行选择，但从实践角度来看，你的选择限于以下几种：\n\n* Windows Server 2019 或 2016\n* Linux\
  \ 或其他 Unix 版本\n\n更多信息请参阅第 11 章。\n\n## 规划基础设施\n\n你还需要规划连接网络中计算机的细节。这项任务包括确定你将使用有线还是无线网络（或两者兼有）、服务网络所需的网络设备以及你如何将网络连接到互联网。\n\
  \n如果你选择使用有线网络，可以在 `Cat5e` 和 `Cat6` 线缆之间进行选择。`Cat6` 比 `Cat5e` 贵一点，但支持更快的网络速度。在这个基础之外，你还有许多额外的决定要做：\n\
  \n* 你将使用廉价的消费级网络交换机（如你在消费电子产品商店或办公用品商店购买的那些），还是想要更贵但提供高级管理功能的专业级交换机？\n* 你将把交换机放在哪里——是在小组内的某个桌面上，还是在中央布线间？\n\
  * 每个交换机上将放置多少台客户端计算机和其他设备，你需要多少台交换机来支持所有的计算机和其他设备？\n* 如果你需要多一台交换机，你将使用什么类型的线缆来连接这些交换机？\n\
  \n关于网络布线的的更多信息，请参阅第 7 章。\n\n![Tip](img/tip.png) 如果你正在安装新的网络线，不要在电缆本身上吝啬。因为安装网络电缆是一项劳动密集型任务，电缆本身的成本仅占总安装总成本的一小部分。考虑使用\
  \ `Cat6` 电缆而不是 `Cat5e`。在许多情况下，你应该考虑安装比实际需要的更多的电缆。例如，如果你办公室的一个区域有四张办公桌，不要只向那个位置拉四根电缆——拉六根甚至八根。拉电缆的人工成本超过了电缆本身的成本，而且在同一位置额外拉几根电缆并不会花费太多额外的人力。\n\
  \n## 绘制图表\n\n创建网络计划最有用的技巧之一是为它画一张图。图表可以是详细的平面图，显示每个网络组件的实际位置。这种图有时被称为“物理地图”，而另一种则更抽象、更像毕加索的作品。每当你更改网络布局时，都要更新图表。还应包含更改的详细说明、更改日期以及更改原因。\n\
  \n你可以在餐巾背面绘制非常小的网络图，但如果网络计算机超过几台，你将希望使用绘图程序来帮助你创建图表。你可以使用如 Microsoft Visio 等专业绘图程序，也可以找到更简单、更便宜的在线绘图工具来帮助你记录你的网络。图\
  \ 5-4 显示了使用廉价在线工具 `Lucidchart`（[www.lucidchart.com`](http://www.lucidchart.com)）绘制的网络图。\n\
  \n![快照显示了使用廉价在线工具 Lucidchart 绘制的网络图。](img/9781119648505-fg0504.png)\n\n图 5-4： 使用\
  \ Lucidchart 绘制网络图。\n\n# 第 6 章\n\n# 处理 TCP/IP\n\n本章内容：\n\n* ![Bullet](img/check.png)\
  \ 掌握（或精通两个）二进制系统\n* ![Bullet](img/check.png) 深入研究 IP 地址\n* ![Bullet](img/check.png)\
  \ 了解子网划分的工作原理\n* ![Bullet](img/check.png) 理解私有和公共 IP 地址\n* ![Bullet](img/check.png)\
  \ 查看网络地址转换 (NAT)\n* ![Bullet](img/check.png) 了解 DHCP 的工作原理\n* ![Bullet](img/check.png)\
  \ 理解 DNS 的工作原理\n\n传输控制协议/网协议 — `TCP/IP` — 是网络上的计算机相互通信的基础协议。没有 `TCP/IP`，网络将无法工作。在本章中，我将向你介绍\
  \ `TCP/IP` 最重要的概念。\n\n![Warning](img/warning.png) 本章是技术性最高的一章。它帮助你研究二进制系统、IP 地址是如何构建的、子网划分是如何工作的以及两个重要的\
  \ TCP/IP 服务——动态主机配置协议（DHCP）和域名系统（DNS）是如何工作的。你越理解本章的内容，越理解 TCP/IP。\n\n## 理解二进制\n\n\
  在理解 IP 地址工作的细节之前，你需要了解二进制。如果你已经了解二进制，请跳过本节直接进入下一节：介绍 IP 地址。\n\n### 按位计数\n\n二进制计数系统仅使用两个数字：0\
  \ 和 1。在大多数人习惯的十进制系统中，使用十个数字：0 到 9。在一个普通的十进制数字（如 3482）中，最右边的数字代表个位，左边的下一个是十位，然后是百位、千位，以此类推。这些数字代表十的幂：首先是\
  \ 10⁰（即 1），然后是 10¹（10），然后 10²（100），然后 10³（1000），以此类推。\n\n在二进制中，你只有两个数字而不是十个，这就是为什么二进制数字看起来有些单调，例如\
  \ 110011、101111 和 100001。\n\n二进制数中的位置（称为位，而不是数字）代表二的幂而不是十的幂——从右向左，每个位代表十进制值 1、2、4、8、16、32\
  \ 等。计算二进制数的十进制值，是将每个位与其相应的幂相乘，然后相加。例如，二进制 10111 的十进制值计算如下：\n\n```\n1 × 2⁰ = 1 ×\
  \ 1 = 1\n+ 1 × 2¹ = 1 × 2 = 2\n+ 1 × 2² = 1 × 4 = 4\n+ 0 × 2³ = 0 × 8 = 0\n+ 1 ×\
  \ 2⁴ = 1 × 16 = 16\n23\n```\n\n\n\n\n幸运的是，计算机非常擅长在二进制和十进制之间进行转换——事实上，它如此强大，以你可能永远不需要自己进行任何转换。了解二进制的意义并不是让你能够看到像\
  \ 1110110110110 这样的数字，并瞬间说出：“啊！十进制的 7606！”（如果你能做到这一点，你可能会在《今日》节目中接受采访，他们甚至还会为你拍部电影。）\n\
  \n相反，意义在于对计算机如何存储信息有一个基本的理解，并且最重要的一点是理解十六进制计数系统的工作原理（我将在下一节中描述）。\n\n以下是二进制的一些有趣的特性，以及该系统与十进制系统的相似与不同：\n\
  \n*   分配给二进制数的位数（bits）数量决定了该数字有多大。如果你分配八位，该数字能存储的最大值就是 11111111，这恰好是十进制的 255。\n\
  *   ![Tip](img/tip.png) 要快速确定一个给定长度的二进制数可以存储多少个不同的值，请使用位数作为 2 的幂。例如，一个八位二进制数可以容纳\
  \ `2⁸` 个值。因为 `2⁸` 是 256，所以 8 位数可以有 256 个不同值之一，这就是为什么一个字节（byte，八位）可以有 256 个不同的值。\n\
  *   这种 2 的幂的概念就是为什么计算机在测量内存或磁盘空间等数值时不使用整齐、偶数的整数。例如，`1K` 的值并不是整的 1000 字节——它是 1024\
  \ 字节，因为 1024 是 `2¹⁰`。同样，`1MB` 并不是整的 1,000,000 字节，而是 1,048,576 字节，这恰好是 `2²⁰`。\n\n\
  ### 执行逻辑\n\n二进制的伟大优点之一是它处理称为逻辑操作特殊操作非常高效。存在四种基本的逻辑操作，尽管额外的操作是从这四种基本操作派生出来的。三种操作——`AND`（与）、`OR`（或）和\
  \ `XOR`（异或）比较两个二进制位（bits）。第四种（`NOT`，非）仅作用于单个位。\n\n以下列表总结了基本的逻辑操作：\n\n*   `AND`：`AND`\
  \ 操作比较两个二进制值。如果两个值都为 1，则 `AND` 操作的结果为 1。如果一个值为 0 或两个值都为 0，结果为 0。\n*   `OR`：`OR`\
  \ 操作比较两个二进制值。如果值中至少有一个为 1，则 `OR` 操作的结果为 1。如果两个值都是 0，结果为 0。\n*   `XOR`：`XOR` 操作比较两个二进制值。如果其中恰好有一个为\
  \ 1，结果为 1。如果两个值都是 0 或两个值都是 1，结果为 0。\n*   `NOT`：`NOT` 操作不比较两个值。相反，它简单地改变单个二进制值的值。如果原始值是\
  \ 1，`NOT` 返回 0。如果原始值是 0，`NOT` 返回 1。\n\n    ![Tip](img/tip.png) 逻辑操作应用于具有多个二进制位的二进制数时，通过一次逐位应用操作来实现。手动执行此操作最简单的方法是：\n\
  \n    1.  将两个二进制数的第一行对齐。\n    2.  在每个二进制位下方写操作的结果。\n\n    下面的示例了如何计算 `10010100 AND\
  \ 11001101`：\n\n    ```\n    10010100\n    AND 11001101\n    10000100\n    ```\n\
  \n    如你所示，结果是 `10000100`。\n\n## 引入 IP 地址\n\nIP 地址是唯一标识 IP 网络上每个主机的数字。IP 地址运行在 TCP/IP\
  \ 协议栈的网络层上，因此它们独立于较低的地址，例如 MAC 地址。（MAC 代表 Media Access Control，介质访问控制。）\n\nIP 地址是\
  \ 32 位的二进制数，这意味着理论上，整个互联网最多可以存在 40 亿左右唯一主机地址。你可能认为足够了，但 TCP/IP 对 IP 地址的分配有某些限制。这些限制严重限制了可用\
  \ IP 地址的总数，大约一半的可用 IP 地址 已经分配完毕。然而，处理 IP 地址的新技术帮助缓解了这一问题，一种 128 位 IP 地址的新标准（被称为\
  \ IPv6）即将获得认可。\n\n### 网络与主机\n\n网际协议（IP）的首要目的是实现网络之间的通信。因此，一个 32 位的 IP 地址由两部分组成：\n\
  \n*   网络 ID（或网络地址）：标识查找主机计算机所在的网络。\n*   主机 ID（或主机地址）：标识网络 ID 所指网络上的特定设备。\n\n处理 IP\
  \ 地址的大部分复杂性在于确定 IP 地址的哪部分是网络 ID，哪部分是主机 ID。\n\n### 点分十进制\n\nIP 地址通常以称为“点分十进制”的格式表示。例如，考虑以下地址：\n\
  \n`192.168.1.1`\n\n在这里，每八位为一个字节（octet）。\n\n### IP 地址分类\n\n当 IP 协议的原始设计者创建 IP 方案时，他们为网络\
  \ ID 分配任意数量的 IP 位。剩余位用于主机 ID。例如，设计者可能决定地址的一半（16 位）用于网络，剩余的 16 位用于主机 ID。IP 设计者从一开始就意识到，很少网络会有数万个主机。假设一个拥有\
  \ 1000 台计算机的网络加入互联网并被分配了这些假设的网络 ID 之一。由于该网络只使用了 65536 个主机地址中的 1000 个，64000 多个 IP\
  \ 地址将被浪费。\n\n为了解决这个问题，引入了 IP 地址类的概念。IP 协议定义了五种不同的地址类：A、B、C、D 和 E。前三类 A–C 的每类网络 ID\
  \ 和主机 ID 部分使用不同的大小。D 类用于一种称为组播地址（multicast address）的特殊类型地址。E 类是一个使用的实验地址类。\n\nIP\
  \ 地址的前四位用于确定特定地址属于哪一类：\n\n*   如果第一位是 0，则该地址为 A 类。\n*   如果第一位是 1 且第二位是 0，则该地址为 B\
  \ 类。\n*   如果前两位都是 1 且第三位是 0，则该地址为 C 类。\n*   如果前三位都是 1 且第四位是 0，则该地址为 D 类。\n*   如果前四位都是\
  \ 1，则该地址为 E 类。\n\n\n\n\n\n由于 D 类和 E 类地址被保留用于特殊用途，我将讨论的重点放在 A 类、B 类和 C 类地址上。表 6-1\
  \ IP 地址类别\n\n### A 类地址\nA 类地址设计用于极大型网络。在 A 类地址中，地址的第一个字节是网络 ID，其余三个字节是主机 ID。由于网络\
  \ ID 只被分配了 8 位，且这些位中的第一位被用于指示该地址为 A 类地址，因此在整个互联网中只能存在 126 个 A 类网络。然而，每个 A 类网络可以容纳超过\
  \ 1,600 万个主机。\n\n![技术内容](img/technicalstuff.png) 只有约 40 个 A 类地址分配给公司或机构。其余部分要么被保留给互联网地址分配机构（IANA）使用，要么分配给管理地理区域\
  \ IP 分配的组织，例如欧洲、亚洲和拉丁美洲。\n\n### B 类地址\n在 B 类地址中，IP 地址的前两个字节用作网络 ID，后两个字节用作主机 ID。因此，B\
  \ 类地址接近我提出的将地址对半划分的假设方案，即使用一半作为网络 ID，另一半作为主机 ID。然而，它与该方案并不相同，因为第一个字节的前两个位必须是 10，以指示该地址为\
  \ B 类地址。因此，总共可以存在 16,384 个 B 类网络。所有 B 类地址都落在 `128.x.y.z` 到 `191.x.y.z` 范围内。每个 B\
  \ 类地址可以容纳超过 65,000 个主机。\n\n![技术内容](img/technicalstuff.png) B 类网络的问题在于，尽管它们比 A 类网络小得多，但仍然分配了太多的主机\
  \ ID。极少数网络拥有数万个主机。因此，粗率地分配 B 类地址会导致可用主机地址的大部分被浪费在不需要这些地址的组织上。\n\n### C 类地址\n在 C\
  \ 类地址中，前三个字节用作网络 ID，第四字节用作主机 ID。由于主机 ID 只有 8 位，每个 C 类网络只能容纳 254 个主机。然而，凭借 24 个网络\
  \ ID 位，C 类地址允许产生超过 200 万个网络。\n\n![技术内容](img/technicalstuff.png) C 类网络的问题是它们太小了。虽然很少有机构需要\
  \ B 类地址提供的数万个主机地址，但许多机构需要的超过了数百个。B 类网络和 C 类网络之间的巨大差异导致了子网划分的发展，我将在下一节中描述它。\n\n##\
  \ 子网划分\n*子网划分* (subnetting) 是一种技术，它允许网络管理员更高效地使用 IP 地址中可用的 32 位，方法是创建不受限于 A 类、B\
  \ 类和 C 类 IP 地址规模的网络。通过子网划分，你可以创建具有更符合实际主机限制的网络。\n\n子网划分提供了一种更灵活的方法来指定 IP 地址的哪部分代表网络\
  \ ID，哪部分代表主机 ID。在标准的 IP 地址类别中，仅存在三种可能的网络 ID 大小：A 类 8 位、B 类 16 位和 C 类 24 位。子网划分允许你选择任意数量的位来作网络\
  \ ID。\n\n有两个原因迫使我使用子网划分。第一个是为了更高效地分配有限的 IP 地址空间。如果互联网仅限于 A 类、B 类或 C 类地址，每个网络都将分配\
  \ 254、65,000 或 1,600 万个 IP 地址用于主机设备。虽然存在许多拥有超过 254 个设备的网络，但极少（如果有的话）拥有 65,000 个设备的，更不用说\
  \ 1,600 万了。遗憾的是，任何超过 254 个设备的网络都需要 B 类分配，并且可能会浪费数万个 IP 地址。\n\n使用子网划分的第二个原因是，即使一个机构拥有数千个网络设备，使用相同的网络\
  \ ID 操作所有这些设备也会导致网络极其缓慢。TCP/IP 的工作方式规定，所有相同网络 ID 的计算机必须位于同一个物理网络上。物理网络由单个*广播域*组成，这意味着单个网络介质必须承载网络的所有流量。出于性能考虑，网络通常被分割成比\
  \ C 类地址提供的范围更小的广播域。\n\n### 子网\n*子网* (subnet) 是一个网络，它通过创建不受限于 A 类、B 类和 C 类 IP 地址的网络，允许网络管理员更高效地使用\
  \ IP 地址中的 32 位。通过子网划分，你可以创建具有更符合实际主机限制的网络。\n\n子网划分提供了一种更灵活的方法来指定 IP 地址的哪部分代表网络 ID，哪部分代表主机\
  \ ID。在标准 IP 地址类别中，仅存在三种可能的网络 ID 大小：A 类 8 位、B 类 16 位和 C 类 24 位。子网划分允许你选择任意数量的位来作网络\
  \ ID。\n\n*子网* (subnet) 是一个网络，它通过创建不受限于 A 类、B 类和 C 类 IP 地址的网络，允许网络管理员更高效地使用 IP 地址中的\
  \ 32 位。通过子网划分，你可以创建具有更符合实际主机限制的网络。\n\n*子网* (subnet) 是一个网络，它通过创建不受限于 A 类、B 类和 C 类\
  \ IP 地址的网络，允许网络管理员更高效地使用 IP 地址中的 32 位。通过子网划分，你可以创建具有更符合实际主机限制的网络。\n\n*子网* (subnet)\
  \ 是一个网络，它通过创建不受限于 A 类、B 类和 C 类 IP 地址的网络，允许网络管理员更高效地使用 IP 地址中的 32 位。通过子网划分，你可以创建具有更符合实际主机限制的网络。\n\
  \n子图 *子网* (subnet) 是一个网络，它通过创建不受限于 A 类、B 类和 C 类 IP 地址的网络，允许网络管理员更高效地使用 IP 地址中的 32\
