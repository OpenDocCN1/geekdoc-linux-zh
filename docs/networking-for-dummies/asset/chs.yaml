  \ 和 `Finance` 信息的用户可以成为这两个组的成员。同样，需要同时访问 `Sales` 和 `Marketing` 信息的用户可以成为 `Sales`\
  \ 和 `Marketing` 组的成员。\n- 你可以向个人用户授予或撤销特定权限以覆盖组设置。例如，你可能会为财务部门经理授予一些额外的权限。你也可以对某些用户实施额外的限制。\n\
  \n### 用户配置文件\n\n`User profiles`（用户配置文件）是 Windows 的一项功能，用于跟踪单个用户对其 Windows 配置的偏好。对于未连接网络的计算机，配置文件允许两个或多个用户使用同一台电脑，每个用户都有自己的桌面设置，如壁纸、颜色、开始菜单选项等。\n\
  \n当配置文件在网络上使用时，其真实优势就显而易见了。用户的配置文件可以存储在服务器计算机上，每当该用户从网络上的任何 Windows 计算机登录时，就可以访问该配置。\n\
  \n以下是受用户配置文件设置管理的 Windows 某些元素：\n\n- 来自“显示属性”（`Display Properties`）对话框的桌面设置，包括壁纸、屏幕保护程序和颜色方案\n\
  - 开始菜单程序和 Windows 栏选项\n- 收藏夹（Favorites），方便用户访问其经常访问的文件和文件夹\n- 网络设置，包括驱动器映射、网络打印机和最近访问的网络位置\n\
  - 应用程序设置，例如 `Microsoft Word` 的选项设置\n- 文档文件夹\n\n### 登录脚本\n\n`logon script`（登录脚本）是一种每当用户登录时自动运行的批文件。登录脚本可以为你执行多项重要的登录任务，例如映射网络驱动器、启动应用程序、同步客户端电脑的时钟等。登录脚本存储在服务器上。每个用户账户都可以指定是否使用登录脚本以及使用哪种脚本。\n\
  \n此示例登录脚本映射了几个网络驱动器并同步了时间：\n\n```\nnet use m: \\\\MYSERVER\\Acct\nnet use n: \\\\\
  MYSERVER\\Admin\nnet use o: \\\\MYSERVER\\Dev\nnet time \\\\MYSERVER /set /yes\n\
  ```\n\n登录脚本已经有些过时了，因为登录脚本执行的大部分工作可以通过用户配置文件来实现。尽管如此，许多管理员仍然倾向于登录脚本的简单性，因此即使在 Windows\
  \ Server 2019 系统上仍然在使用。\n\n## 保护人为防火墙\n\n安全技术，如物理安全、用户账户安全、服务器安全：网络安全的关键是保护网络用户。最好的安全安全计划是配置文件配置文件存储在服务器计算机上，每当该用户从网络上的任何\
  \ Windows 计算机登录时，就可以访问该配置。以下是受用户配置文件设置管理的 Windows 某些元素：\n\n*(此处后续重复内容已根据“不要重复输出原文”原则进行去重)*\n\
  \n\n\n\n无论你使用防火墙设备还是防火墙计算机，防火墙都必须位于你的网络和互联网之间，如图 20-1\n\n图 20-1： 防火墙路由器在网络和互联网之间建立安全链接。\n\
  \n`perimeter`（边界）一词有时描述防火墙在网络中的位置。简单来说，防火墙就像一个围栏，完全包围着你的财产，并强制所有访问者从大门进入。\n\n![警告](img/warning.png)\
  \ 在大型网络中——尤其是校园网络甚至大都市网络——有时很难准确判断边界的所在位置。如果你的网络有两个或多个广域网（WAN）连接，请确保这些连接每一个都连接到防火墙，而不是直接连接到网络。你可以通过为每个\
  \ WAN 连接提供单独的防火墙或使用具有多个 WAN 端口的防火墙来实现。\n\n## 防火墙的多种类型\n\n防火墙采用四种基本技术将不受欢迎的访问者排除在网络之外。以下章节介绍了这些基本的防火墙技术。\n\
  \n### 包过滤\n\n`packet-filtering`（包过滤）防火墙检查通过防火墙的每个数据包，并根据你设置的一组规则对数据包进行测试。如果数据包通过测试，则允许通过。如果数据包未通过，则被拒绝。\n\
  \n包过滤器是最便宜的防火墙类型。因此，包过滤防火墙常见。然而，包过滤存在许多精明的黑客可以利用的缺陷。因此，单靠包过滤并无法构成完全有效的防火墙。\n\n包过滤器通过检查每个\
  \ TCP/IP 数据包中包含的源和目的 IP 及端口地址来工作。`TCP/IP ports` 是分配给特定服务的数字，有助于识别每个数据包旨在用于哪个服务。例如，HTTP\
  \ 协议的端口号为 `80`。因此，任何指向 HTTP 服务器的入站数据包将端口 `80` 为目的端口。\n\n端口号通常在 IP 地址后跟冒号指定。例如，IP\
  \ 地址为 `192.168.10.133` 的服务器上的 HTTP 服务将是 `192.168.10.133:80`。\n\n实际上有数千个已建立的端口正在在使用。表\
  \ 20-1 列出了一些最常用的端口。\n\n| **端口** | **描述** |\n| --- | --- |\n| 20 | 文件传输协议 (FTP) |\n\
  | 21 | 文件传输协议 (FTP) |\n| 22 | 安全外壳协议 (SSH) |\n| 23 | Telnet |\n| 25 | 简单邮件传输协议 (SMTP)\
  \ |\n| 53 | 域名服务器 (DNS) |\n| 80 | 世界维员网 (HTTP) |\n| 110 | 邮局协议 (POP3) |\n| 119 |\
  \ 网络新闻传输协议 (NNTP) |\n| 137 | NetBIOS 名称服务 |\n| 138 | NetBIOS 数据报服务 |\n| 139 | NetBIOS\
  \ 会话服务 |\n| 143 | 互联网消息访问协议 (IMAP) |\n| 161 | 简单网络管理协议 (SNMP) |\n| 194 | 互联网中继聊天\
  \ (IRC) |\n| 389 | 轻量级目录访问协议 (LDAP) |\n| 396 | IP 之 NetWare |\n| 443 | TLS/SSL 之上的\
  \ HTTP (HTTPS) |\n\n表 20-1 一些常用的 TCP/IP 端口\n\n你为包过滤器设置的规则允许或拒绝指定特定 IP 地址或端口的数据包。例如，你可能允许发往邮件服务器或\
  \ Web 服务器的数据包，并拒绝所有其他数据包。或者，你可以设置一条规则专门拒绝发往 NetBIOS 使用端口的数据包。此规则可以防止互联网黑客尝试访问 NetBIOS\
  \ 服务器资源，如文件或打印机。\n\n包过滤最大的弱点之一是，它几乎完全信任数据包本身在声称来源和去向时说了真话。黑客通过使用名为 `IP spoofing`（IP\
  \ 欺骗）的攻击技术来利用这一弱点，在发送到你网络的数据包中插入虚假的 IP 地址。\n\n包过滤的另一个弱点是它孤地检查每个数据包而不考虑之前有哪些数据包通过防火墙以及之后会有哪些数据包。换句话说，包过滤是\
  \ `stateless`（无状态的）。请放心，黑客已经发现了如何利用包过滤的无状态特性来穿过防火墙。\n\n尽管有这些缺陷，包过滤器防火墙仍许多优势，解释了为什么它们被广泛使用：\n\
  \n*   **包过滤器非常高效。** 它对每个入站和出站数据包仅保留几毫秒，检查数据包内部以确定目的和源端口。在确定这些地址和端口后，包过滤器快速应用规则并发送数据包或拒绝它。相比之下，其他防火墙技术具有更明显的性能开销。\n\
  *   **包过滤器对用户来说几乎完全透明的。** 用户只有在防火墙拒绝数据包时才会意识到在使用包过滤器。其他防火墙技术需要客户端和或服务器进行特殊配置以与防火墙配合。\n\
  *   **包过滤器价格低廉。** 大多数路由器都内置了包过滤。\n\n### 状态包检测\n\n`Stateful packet inspection` (SPI，状态包检测)\
  \ 是简单包过滤智能性上的跃跃。具有 `SPI` 的防火墙成组查看数据包而不是逐个查看。它跟踪哪些数据包通过了防火墙，并能够检测指示未经授权访问的模式。在某些情况下，防火墙会在数据包到达时保留它们，直到防火墙收集到足够的信息来决定是否授权或拒绝这些数据包。\n\
  \n![提示](img/tip.png) 状态包检测曾仅用于昂贵的企业级路由器。但现在，SPI 防火墙的价格已足够中小网络使用。\n\n### 电路级网关\n\n\
  `circuit-level gateway`（电路级网关）根据 TCP/IP 地址和端口号管理客户端与服务器之间的连接。连接建立后，网关不会干预系统之间流动的数据包。\n\
  \n例如，你可以使用 Telnet 电路级网关允许 Telnet 连接（端口 `23`）访问特定服务器，并禁止到该服务器的其他类型连接。连接建立后，电路级网关允许数据包在连接上自由流动。因此，电路级网关无法阻止\
  \ Telnet 用户运行特定程序或使用特定命令。\n\n### 应用网关\n\n`application gateway`（应用网关）是一种比包过滤、状态包检测或电路级网关防火墙更智能的防火墙系统。包过滤器相同对待所有\
  \ TCP/IP 数据包。相比之下，应用网关了解通过防火墙的数据包的应用程序细节。例如，Web 应用网关了解 HTTP 数据包的细节。因此，它可以检查除源目的地址和端口之外的内容，以确定数据包是否应允许通过防火墙。\n\
  \n\n\n\n\n此外，应用网关充当代理服务器的角色。简单来说，`proxy server` 是位于客户端计算机和真实服务器之间的服务器。代理服务器拦截发往真实服务器的数据包并对其进行处理。代理服务器可以检查数据包，并决定将其传递给真实服务器，也可以拒绝该数据包。或者，代理服务器也能够直接对数据包做出响应，而完全不涉及真实服务器。\n\
  \n例如，Web 代理通常会在本地缓存中存储常用网页的副本。当用户从远程 Web 服务器请求网页时，代理服务器会拦截该请求，并检查其缓存中是否已有了该页面的副本。如果是，Web\
  \ 代理将直接将页面返回给用户。如果不是，代理会将请求转发到真实服务器。\n\n应用网关了解各种类型 TCP/IP 服务器处理 TCP/IP 数据包序列的细节，因此它们可以对入站数据包是否合法或是否为攻击的一部分做出更智能的决策。因此，应用网关比简单的数据包过滤防火墙更安全，因为后者一次只能处理一个数据包。\n\
  \n然而，应用网关安全性的提升是需要代价的。无论是从购买价格还是从配置和维护的成本来看，应用网关都比数据包过滤器更贵。此外，应用网关会减慢网络性能，因为它们在允许数据包通过之前会对其进行更详细的检查。\n\
  \n### 下一代防火墙\n\n许多现代防火墙使用 `next generation` 一词来描述新型的先进威胁防护智能，这些智能旨在监控指示可能恶意攻击的数据包行为类型。包含这些新保护措施的防火墙被称为\
  \ `next-generation firewall`，通常缩写为 `NGFW`。\n\n下一代防火墙执行标准防火墙的所有功能并更多。通过使用名为 `deep\
  \ packet inspection` 的技术，下一代防火墙会在数据包进入你的网络时查看其表面之外，寻找简单类型防火墙会忽略的威胁。下一代防火墙通常可以在恶意软件进入你的网络之前将其阻止。\n\
  \n## 病毒防护\n\n病毒是如今最被误解的计算机现象之一。什么是病毒？它是如何工作的？它是如何在计算机之间传播的？我很高兴你这么问。\n\n### 什么是病毒？\n\
  \n不要误会——病毒是真实的。现在大多数人由于连接了互联网，病毒真的爆发了。每个计算机用户都容易计算机病毒的攻击，而使用网络会增加你的脆弱性，因为它让所有网络用户都暴露在被任何一个网络用户计算机上的病毒感染的风险之中。\n\
  \n病毒并不会凭空出现。`Viruses` 是由脑子坏掉且应该被关起来的恶意程序员创建的计算机程序。\n\n让病毒成为病毒的是它能够复制自身的能力，这些副本可以传播到其他计算机。这些副本又会产生更多的副本并传播到更多的计算机，以此循环往复。\n\
  \n然后，病毒会耐心等待，直到某些因素触发它——也许当你输入特定命令或按下某个键时，或者当某个日期到来，或者当病毒创建者向病毒发送消息时。病毒攻击时的行为取决于病毒创建者想要病毒做什么。有些病毒会无害地显示“抓到你了”的消息。有些病毒会向你通讯录中找到每一个人发送电子邮件。有些会抹掉你硬盘上的所有数据。哎。\n\
  \n几年前，病毒通过附着在软磁盘上从一台计算机移动到另一台计算机。每当你从朋友那里借用软磁盘时，你就面临着计算机可能被潜伏在磁盘上的病毒感染的风险。\n\n如今，病毒程序员发现电子邮件是传播他们病毒的一种更有效的方法。通常，病毒会伪装成有用或有趣的邮件附件，例如如何在业余时间赚取\
  \ 1,000,000 美元的说明、裸体明星的照片，或者是失散多年的恋人发来的情人节问候。当一个好奇但毫无防备的用户双击附件时，病毒就会活跃起来，将自己复制到用户的计算机上，并在某些情况下将自己的副本发送给用户通讯录中的所有联系人。\n\
  \n病毒进入网络计算机后，病毒就可以找出如何将自己传播到网络上的其他计算机上。\n\n这里是更多关于保护你的网络免受病毒攻击的小贴士：\n\n*   `virus`\
  \ 一词通常不仅指真正的病毒程序（可以自我复制的），还指任何其他设计用于伤害你计算机的程序。这些程序包括所谓的 `Trojan horse` 程序，它们通常看起来像游戏，但实际上是硬盘格式化程序。\n\
  *   `worm`（蠕虫）与病毒类似，但它实际上不会感染其他文件。它只是将自己复制到网络上的其他计算机上。蠕虫复制到你的计算机后，无法知道它会在那里做些什么。例如，蠕虫可能会扫描你的硬盘以寻找有趣的信息，如密码或信用卡号，然后将它们通过电子邮件发送给虫作者。\n\
  *   计算机病毒专家已识别出几千种“毒株”病毒。其中许多都有华丽的名字，例如 I Love You 病毒、Stoned 病毒和迈开朗基罗病毒。\n*   杀毒软件可以识别已知病毒并将其从你的系统中删除，它们还可以发现未知病毒的典型迹象。遗憾的是，编写病毒的那些笨蛋并不笨（智力上），所以他们不断开发新技术来逃避杀毒软件的检测。新病毒频繁被发现，杀毒软件也会定期更新以检测并删除它们。\n\
  \n### 杀毒程序\n\n保护网络免受病毒感染的最佳方法是使用杀毒程序。这些程序拥有数千种已知病毒的目录，可以检测并删除它们。此外，它们可以识别病毒对你的计算机文件典型的典型更改，从而减少某些先未知病毒未被检测到的概率。\n\
  \n较版本的 Windows（8 及更高版本）包含内置的杀毒防护。对于旧版本，你可以从微软下载一种名为 Microsoft Security Essentials\
  \ 的优秀免费杀毒解决方案。微软内置或免费杀毒防护的流行替代方案包括 Norton AntiVirus、Webroot SecureAnywhere Antivirus\
  \ 和 Kaspersky Antivirus。\n\n制作杀毒程序的人对病毒世界的动态了如指掌，并经常发布软件更新来对抗最新的病毒。由于病毒编写者不断开发新病毒，除非你通过下载最新更新来保持软件更新，否则你的杀毒软件几乎毫无用处。\n\
  \n以下是在你的网络上部署杀毒防护的几种方法：\n\n*   你可以在每个网络用户的计算机上安装杀毒软件。如果你能指望所有用户都保持杀毒软件更新，那么这种技术将是最有效的。由于这不太可能实现，你可能希望采用一种更可靠的病毒防护方法。\n\
  *   托管杀毒服务在你的网络中的每台客户端计算机上放置杀毒客户端软件。然后，杀毒服务器定期定期更新客户端，以确保它们保持最新状态。\n\n\n\n\n*  \
  \ 基于服务器的防病毒软件可以保护您的网络服务器免受病毒。例如，您可以在邮件服务器上安装防病毒软件，扫描所有入站邮件的病毒，并在网络用户看到它们之前将其删除。\n\
  *   某些防火墙设备包含防病毒强制检查，除非用户的防病毒软件已更新到最新，否则不允许其访问互联网。这种类型的防火墙提供了目前最好的防病毒保护。\n\n## 安全计算\n\
  \n除了使用防病毒软件外，您还可以采取一些额外的措施来确保无病毒的计算环境。如果您还没有和孩子讨论过这些安全计算实践，最好尽快与他们谈谈。\n\n*   定期备份您的数据。如果病毒感染了您的电脑且防病毒软件无法修复损坏，您可能需要通过备份来恢复数据。请确保从受病毒感染之前创建的备份进行恢复！\n\
  *   如果您从商店购买软件并发现光盘包装的封条已破损，请退回软件。不要尝试在您的计算机上安装它。虽然您对“受污染软件”的听闻不如“受污染牛肉”那样，但如果您购买了被打开过的软件，它很可能已经感染了病毒。\n\
  *   在电脑去维修店或经过顾问处理后，使用您的防病毒软件扫描磁盘是否有病毒感染。这些人并无恶意意，但他们偶尔会无意中传播病毒，仅仅是因为他们处理了许多奇怪的电脑。\n\
  *   不要打开来自陌生人的邮件附件，或您未预期的附件。\n*   在访问任何不属于您的 CD-ROM 或闪存驱动器，使用您的防病毒软件扫描其是否有病毒感染。\n\
  \n## 修补漏洞\n\n每个网络管理员面临的烦恼之一是应用软件补丁，以保持操作系统和其他软件更新到最新版本。软件 `patch` 是一项微型更新，用于修复偶尔出现的小故障，例如微小的安全或性能问题。这些故障还不足以发布软件的新版本，但它们重要到需要修复。大多数补丁纠正了计算机黑客发现的安全漏洞，黑客正不懈地试图证明他们比微软的安全编程人员更聪明。\n\
  \n定期地，所有最近发布的补丁会合并成一个 `service pack`（服务包）。尽管最勤奋的网络管理员会在补丁发布时就应用所有补丁，但许多管理员只是等待服务包：\n\
  \n*   对于所有版本的 Windows，您可以使用内置的 `Windows Update` 功能应用补丁，以保持您的操作系统和其他 Microsoft 软件更新到最新。`Windows\
  \ Update` 会扫描您的计算机软件并创建一个您可以下载和安装的软件补丁和其他组件列表。要使用 `Windows Update`，打开 `Control Panel`，点击\
  \ `System and Security`，然后点击 `Windows Update`。\n*   ![Tip](img/tip.png) 您可以配置 `Windows\
  \ Update` 自动通知您更新，这样您就不需要记得检查新补丁。\n*   您可以订阅一种服务，该服务会自动向您发送电子邮件，告知新的补丁和更新。\n\n![Tip](img/tip.png)\
  \ 维护大型网络的补丁可能是网络管理的主要挑战之一。如果您的网络中有超过几十台计算机，请考虑投资旨在简化此过程的服务器软件。例如，`Ivanti Patch`\
  \ (`[`www.ivanti.com`](http://www.ivanti.com)`) 是一种基于服务器的程序，它可以从各种制造商收集软件补丁，并让您创建自动推送到客户端计算机的发行包。有了像\
  \ `Ivanti Patch` 这样的软件，您不需要依赖终端用户下载和安装补丁，也不需要逐个访问每台计算机来安装补丁。\n\n# 第 21 章\n\n# 保护您的电子邮件\n\
  \n### 本章内容\n\n*   了解什么是垃圾邮件以及为什么您应该担心它\n*   设置软件捕捉垃圾邮件\n*   调整您的垃圾邮件过滤器\n*   减少您收到的垃圾邮件数量\n\
  \n垃圾邮件、垃圾邮件、垃圾邮件、垃圾邮件、垃圾邮件、垃圾邮件、垃圾邮件。\n\n著名的 `Monty Python`（蒙派 Python）喜剧就是这样的：餐厅里的一个女士只想点一份不含垃圾肉的东西。\n\
  \n这基本上总结了如今大多数人收件箱的情况。合法邮件淹在垃圾邮件中。您不想看一个没有充满垃圾邮件的收件箱吗？\n\n没有人喜欢垃圾邮件。您不喜欢，您的用户也不喜欢。相信我，如果他们的收件箱里收到太多垃圾邮件，他们会让你知道。他们会让你对每一封带有冒犯性主题的邮件、每一封试图向他们推销不感兴趣产品的邮件，以及每一封试图让他们提供银行账户密码或信用卡的邮件承担个人责任。\n\
  \n作为网络管理员，您的工作之一是保护用户免受垃圾邮件的影响。反垃圾邮件的圣杯是一个永不让任何垃圾邮件进入任何人收件箱的解决方案，但同时绝不会误将任何一封合法的邮件识别为垃圾邮件。\n\
  \n祝你好运。这种完美并不存在。你能期待的最好就是找到正确的平衡点：一个折中方案，只让少量的实际垃圾邮件进入用户的收件箱，并且偶尔将合法的邮件误识别为垃圾邮件。\n\
  \n在本章中，我将解释寻找和部署此类解决方案需要了解的知识。我将向您介绍各种类型的垃圾邮件、垃圾邮件的来源、垃圾邮件者如何获取人们的电子邮件地址，以及最重要的——您可以用来将垃圾邮件隔在收件箱之外的许多有效技术。\n\
  \n## 定义垃圾邮件\n\n`spam` 最基本的定义是“任何进入您收件箱但您并未请求的邮件”。垃圾邮件是 `unsolicited email`（未经请求的电子邮件）。它是不受欢迎的邮件，是您未预期的邮件。它是来自您不认识或没听过的人的邮件，通常试图向你推销你不感兴趣或绝不可能需要的东西，并且经常试图欺骗你交出金钱、宝贵的个人信息或两者兼有。\n\
  \n垃圾邮件的定义特征之一是批量发送的，通常一次性发送给数千甚至数百万接收者。大多数垃圾邮件并不是特别有针对性的。垃圾邮件者并没有花时间研究谁可能对特定产品感兴趣，而是发现向他们能获得的每一个电子邮件地址推销产品更容易、更廉。。\n\
  \n垃圾邮件通常与物理形式的垃圾邮件相比较——即每天出现在您信箱里的折页、目录和其他推销广告。事实上，垃圾邮件通常被称为“垃圾邮件”。\n\n然而，物理垃圾邮件和垃圾邮件之间存在至关重要的区别。对于物理垃圾邮件，发件者必须支付邮费。因此，尽管垃圾邮件可能令人厌恼，但大多数垃圾邮件都是经过仔细定位的。垃圾邮件者不想浪费钱在邮费上给那些对他们要卖的产品感兴趣的人寄信。他们仔细衡量回复率，以确保他们的邮寄活动是有利润的。\n\
  \n相比之下，发送大量电子邮件的成本非常低。可以肯定，垃圾邮件是昂贵的。但垃圾邮件的大部分成本由接收者承担，他们必须花费时间和金钱来接收、存储和管理不受欢迎的邮件；并由网络提供者承担，他们必须扩大网络容量和速度，以适应网络必须承载的海量垃圾邮件。\n\
  \n\n\n\n估计值各不相同，但大多数研究表明，通过互联网发送的所有邮件中，多达四分之一是垃圾邮件。在我写这些的时候，有迹象表明垃圾邮件实际上正在变得减少，仅占所有发送邮件的一半。但有些机构报告说，他们收到的邮件中有\
  \ 80% 或 90% 是垃圾邮件。\n\n![Warning](img/warning.png) 有一点是可以肯定的：垃圾邮件不仅烦人，而且很危险。除了用垃圾邮件填满用户的收件箱之外，垃圾邮件通常还带有病毒或其他恶意软件的附件，或者诱导用户点击将他们带到可能感染你网络的链接。如果你的网络曾被病毒攻陷，那么很有可能是该病毒是通过垃圾邮件进入你的网络。\n\
  \n因此，了解垃圾邮件并采取预防措施阻止它是任何网络管理员工作中的重要组成部分。\n\n## 采样多种类型的垃圾邮件\n\n垃圾邮件是指未经请求的/或不受欢迎的电子邮件。这是一个相当广泛的定义，但垃圾邮件有几种明显不同的类别：\n\
  \n*   **广告：** 大多数垃圾邮件来自你从未听过的公司的广告，试图向你推销你不感兴趣的产品。垃圾邮件推销的最常见产品类型是药品，但垃圾邮件也经常推广食品补充剂、昂贵产品（如手表或包包）的仿制品、减肥产品等。\n\
  \n*   **钓鱼邮件：** 最烦人和最危险的垃圾邮件类型中包括钓鱼邮件，它们试图让收件者透露私人信息，如信用卡账号或密码。钓鱼邮件伪装成来自银行或其他知名机构的合法邮件，通常包含一个指向虚假网站的链接，该网站类似于机构的实际网站。例如，你可能会收到一封邮件，告知你的信用卡有一笔可疑费用，并带有一个你可以点击以登录并验证该费用是否合法的链接。当你点击链接时，会被带到一个看起来与你的信用卡公司实际网站完全相同的页面。然而，这个虚假页面仅是为了收集你的用户名和密码。\n\
  \n    另一种类型的钓鱼邮件包括一个声称是未付发票或包裹交付失败通知的附件。该附件包含试图用恶意软件感染你计算机的木马程序。\n\n*   **诈骗：**\
  \ 最常见的邮件诈骗被称为预付费诈骗，这种诈骗承诺如果你现在通过电汇或汇票支付一笔相对较小的资金，未来将获得巨额奖励或奖。你可能听说过或实际上收到过被称为“尼日利亚王子诈骗”的经典诈骗，一个自称是尼日利亚王子的人需要你帮助转账巨额资金（例如\
  \ 4000 万），但无法使用非洲银行账户。王子需要使用你的个人银行账户，并为你的帮助支付一定比例的费用——也许 100 万美元。但你必须先开一个具有最低余额的尼日利亚账户——可能是\
  \ 1000 美元或 10000 美元——以便于转账。你所做的就是汇款，他们会处理剩下的事情。\n\n    这个故事有很多变体，但它们都有一个共同点：好得令人难以相信。他们承诺在以后给你巨款，以换取现在的一笔相对较小的资金。\n\
  \n*   **色情网站广告：** 这类网站作为病毒和其他恶意软件的主要来源而臭名昭著。\n\n*   **暴富计划：** 传销计划、多级营销、虚假房地产计划，凡你能想到的——它们都属于承诺让你发富的垃圾邮件类别。\n\
  \n*   **回声（Backscatter）：** 回声是一种特别烦人的现象，你的收件箱被充斥着几十个甚至数百个投递失败报告（NDR），表明你声称发送的一封邮件没有到达。当你检查\
  \ NDR 时，可以很容易判断你从未向目标接收者发送过邮件。实际情况是，你的电子邮件地址被用作垃圾邮件活动的发件人地址，而你收到了那些无法投递的垃圾邮件服务器发出的\
  \ NDR。\n\n![Tip](img/tip.png) 虽然在技术上不是垃圾邮件，但许多人将过去打交过道的公司的广告和新闻邮件视为垃圾邮件的一种。垃圾邮件定义中的一个重要元素是“未经请求”这个词。当你在公司网站上注册时，你实际上是在邀请该公司向你发送邮件。\n\
  \n## 使用反垃圾软件\n\n从用户收件箱中消除垃圾邮件的最有效方法是使用反垃圾软件。反垃圾软件检查所有入站邮件，旨在区分垃圾邮件和合法邮件。根据软件的配置，被识别为垃圾邮件的邮件会被删除、移动到单独的位置，或者只是通过在邮件主题行添加标记来标记为可能的垃圾邮件。\n\
  \n反垃圾软件通过使用复杂的技术分析每封入站邮件，这些技术确定了邮件确实是垃圾邮件的概率。当达到特定的概率阈值时，该邮件被视为垃圾邮件并被删除、移动或标记。如果未达到阈值，邮件将像往一样传递给用户。\n\
  \n![Tip](img/tip.png) Microsoft Exchange 邮箱包含一个垃圾邮件文件夹，这通常是被识别为垃圾邮件的邮件的最终终点。当你找不到预期的邮件时，应该始终检查垃圾邮件文件夹。\n\
  \n并不是所有反垃圾程序都使用垃圾邮件文件夹。某些程序将垃圾邮件存储在用户收件箱之外，网络上的单独位置或云端。这些程序通常会发送一封邮件（通常称为摘要），列出被识别为垃圾邮件的邮件。当你找不到预期的邮件时，应该查看这封邮件。\n\
  \n判断一封邮件是否为垃圾邮件并不是一门精确的科学。因此，误报（将合法邮件错误地识别为垃圾邮件）和漏报（垃圾邮件未被检测为垃圾邮件并进入用户收件箱）并不罕见。误报可能导致你的用户收不到他们预期的邮件。漏报会让用户困惑，到底垃圾邮件过滤器是怎么没抓到那封垃圾邮件的。有时，对人类来说显然是垃圾邮件的邮件会直接溜过反垃圾软件。\n\
  \n任何反垃圾工具的挑战在于如何在不过多的误报和漏报之间找到正确的平衡。大多数反垃圾工具允许你在某种程度上调整过滤器，将其设置为更具宽松性或不那么宽松——也就是说，倾向于产生更多的漏报或更多的误报。过滤器设置得越严格，误报就越多。放宽过滤器会导致更多的漏报。\n\
  \n![Tip](img/tip.png) 漏报的可能性是很少将反垃圾程序配置为简单删除垃圾邮件的一个好主意的主要原因之一。大多数程序可以配置为仅删除最明显的垃圾邮件——那些可以\
  \ 100% 确定识别为垃圾邮件的邮件。可能可能是垃圾邮件但确定性低于 100% 的邮件应该标记为垃圾邮件但不删除。\n\n## 理解垃圾邮件过滤器\n\n反垃圾程序使用多种不同的技术来确定特定邮件邮件为垃圾邮件的概率。这些技术由过滤器使用，过滤器检查每封邮件；每个过滤器使用一种特定的技术。\n\
  \n以下是一些常用的过滤器类型：\n\n\n\n\n\n### 关键词检查\n识别垃圾邮件最明显的方法是寻找出现在邮件主题或邮件正文中的特定词汇。例如，关键词检查过滤器可能会寻找脏话、性词汇以及诸如“快速发财！”之类的单词或短语。\n\
  \n虽然这是识别垃圾邮件最明显的方法，但它也是不可靠的。垃圾邮件发送者很久以前就学会了在垃圾邮件中避开常用词，以规避这类过滤器。通常情况下，他们会故意拼错单词，或者用数字或符号代替字母，例如用数字\
  \ `0` 代替字母 `o`，或用符号 `!` 代替字母 `l`。\n\n关键词检查最大的问题是它经常会导致误报。朋友和亲戚可能会在邮件中无意间或无意中使用任何被禁的词。有时，禁词会出现在其他完全无辜的单词中间。例如，如果你将\
  \ `Cialis` 列为你想要拦截的关键词，你也会拦截 `specialist` 或 `socialist` 等单词。\n\n出于这些原因，关键词过滤器通常只用于最明显且最具冒犯性的词和短语，如果真的使用的话。\n\
  \n### 贝叶斯分析\n垃圾邮件过滤最受信任的形式之一是`Bayesian analysis`，它的工作原理是假设某些词在垃圾邮件中出现的频率比其他邮件高。这听起来很关键词检查很，但贝叶斯分析比简单的关键词检查要复杂得多。贝叶斯过滤器维护了一个可能在垃圾邮件中遇到的单词索引。索引中的每个单词都有一个相关的概率，分析中的邮件中的每个单词都会在该索引中查找，以确定该邮件为垃圾邮件的整体概率。如果从该索引计算出的概率超过了某个阈值，该邮件就会标记为垃圾邮件。\n\
  \n这就是贝叶斯分析的魔力所在：该索引是根据用户的实际邮件进行自学习的。每当过滤器误判邮件时，用户都会通过告诉过滤器判断是错误的来训练过滤器。用户通常通过点击标记为“这是垃圾邮件”或“这不是垃圾邮件”的按钮来操作。当用户点击这两个按钮中的任何一个时，过滤器会调整导致其得出错误结论的单词的相关概率。因此，当过滤器将来遇到类似的邮件时，它更有可能做出正确的判断。\n\
  \n### 发送者策略框架 (SPF)\n惊讶的是，`SMTP`（互联网电子邮件协议）的内置安全性非常差。特别是，任何邮件服务器都可以轻松发送声称来自任何域的邮件。这使得伪造邮件中的\
  \ `From` 地址变得非常容易。`SPF` 允许你通过 DNS 指定哪些特定的邮件服务器允许从你的域名发送邮件。反垃圾邮件 SPF 过滤器的工作原理是根据邮件\
  \ `From` 地址所指定域的 DNS 中的 SPF 记录，查找发送邮件的邮件服务器。\n\n### 黑名单\n另一种受信任的垃圾邮件过滤形式是`blacklist`（也称为\
  \ `blocklist`），它使用已知垃圾邮件发送者的列表来阻止来自不可信信源的邮件。黑名单有两种类型：私有和公共。私有黑名单是你自己设置的列表，用于指定你不想接收来自其的的源。公共黑名单是由公司或组织维护并供他人使用的列表。\n\
  \n请注意，仅仅将发送者邮件地址列入黑名单并没有什么帮助。因为发送者邮件地址很容易被伪造。相反，黑名单跟踪的是已知为垃圾邮件源的单个邮件服务器。\n\n![Warning](img/warning.png)\
  \ 遗憾的是，垃圾邮件发送者通常不会建立自己的服务器来发送垃圾邮件。相反，他们劫持其他服务器来做这些脏工作。合法的邮件服务器可能会被垃圾邮件发送者劫持，从而变成垃圾邮件源，而所有者往往并情情。这引发了一个不幸的可能性：你自己的邮件服务器可能会被垃圾邮件发送者接管，你可能会发现你的邮件服务器列在公共黑名单。如果发生这种情况，你将无法向任何使用该黑名单的人发送邮件，直到你纠正了导致你的服务器被劫持的问题，并向黑名单所有者申请将你的服务器移除。\n\
  \n### 白名单\n任何反垃圾邮件解决方案中最重要的元素之一是`whitelist`（白名单），它确保来自已知发送者的邮件永远不会被拦截。通常情况下，白名单由你你信任的邮件地址列表组成。当反垃圾邮件工具确认邮件中的\
  \ `From` 地址未被伪造（可能通过使用 SPF 过滤器）时，白名单过滤器会在白名单数据库中查找该地址。如果找到了该地址，该邮件将立即被标记为合法邮件，且不再应用其他过滤器。因此，如果邮件被白名单过滤器标记为合法，则其他过滤器就不会被使用。\n\
  \n![Tip](img/tip.png) 大多数白名单过滤器都允许你将整个域名以及单个邮件地址加入白名单。你绝对*不*想将 `gmail.com` 或 `comcast.net`\
  \ 等大型邮件提供商的域名加入白名单。但你应该将所有业务合作伙伴和客户的域名加入白名单，以确保来自这些关键公司新员工的邮件永远不会被标记为垃圾邮件。\n\n某些垃圾垃圾程序会自动将所有发送邮件的接收者地址添加到白名单。也就是说，你发送给任何人的邮件会自动添加到白名单。随着时间的推移，此功能可以大幅减少误报的发生。\n\
  \n![Tip](img/tip.png) 使用白名单预先允许你期待来自新客户、供应商或服务提供商的重要邮件。例如，如果你更换了薪资提供商，请提前查询新提供商将使用哪些邮件地址，以便你的薪资员工不会错过重要的邮件。\n\
  \n### 灰名单\n灰名单是一种有效的反垃圾邮件技术，它利用了这样一个事实：如果合法的邮件服务器在第一次尝试时无法成功投递邮件，它将在稍后重试，通常是 30\
  \ 分钟后。灰名单过滤器会自动拒绝第一次投递，但会记录被拒绝信息的详细信息。然后，当第二次接收到相同的邮件时，灰名单过滤器会接受该邮件并记录发送者，以便未来来自发送者的邮件在第一次尝试时就被接受。\n\
  \n灰名单之所以有效，是因为垃圾邮件发送者通常配置他们的服务器不要进行第二次尝试。因此，灰名单过滤器知道，如果在最初拒绝后收到了第二份邮件，那么该邮件可能是合法的。\n\
  \n## 查看三种类型的反垃圾邮件软件\n市面上各种反垃圾邮件程序分为三大大类：本地部署、硬件设备和云端（托管）。以下章节描述了为你的组织提供反垃圾邮件服务的这些方法的相对优点。\n\
  \n### 本地部署反垃圾邮件\n\n\n\n\n\n本地部署的反垃圾邮件程序运行在你网络上的服务器上，并与你的电子邮件服务器直接交互。到达你服务器的邮件会被传递给反垃圾邮件程序，该程序会对邮件进行评估，以判断其是垃圾邮件还是合法邮件。反垃圾邮件软件使用多种技术来识别垃圾邮件，并且通常可以进行配置以获得最佳性能。被识别为法的邮件将交回邮件服务器进行正常处理。根据你配置软件的方式，被识别为垃圾的邮件可能会发送到用户的垃圾箱，或存储在其他位置。\n\
  \n在较小的组织中，反垃圾邮件软件可以运行与电子邮件服务器相同的服务器上（例如，`Microsoft Exchange`）。在较大的组织中，反垃圾邮件软件可以配置为运行在专用服务器上，与邮件服务器分开。\n\
  \n### 本地反垃圾邮件的优势\n\n以下是使用本地反垃圾邮件产品的一些优势：\n\n- **你对软件的配置和操作具有完全控制权。** 大多数本地反垃圾邮件软件具有高度可配置性，通常提供十种或更多不同的过滤方法，你可以以许多不同的方式对其进行自定义。（更多信息，请参阅本章节前面的`理解垃圾邮件过滤器`部分。）\n\
  - **本地反垃圾邮件软件通常不仅与 Microsoft Exchange 集成，还与 Microsoft Outlook 深度集成。** 垃圾邮件通常出现在用户的垃圾箱中，软件通常提供一个\
  \ `Outlook` 插件，让用户轻松标记被错误识别的邮件。\n- **本地软件相对廉价。** 通常，你需要支付一笔预付款来购买许可证，并支付年度维护费用，以接收不仅针对软件而且针对垃圾邮件过滤器的定期更新。\n\
  \n### 本地反垃圾邮件的劣势\n\n以下是本地反垃圾邮件软件的主要劣势：\n\n- **你负责软件的安装、补丁、配置、更新以及其他维护。**\n- **由于邮件服务器与反垃圾邮件软件之间的关系复杂，本地反垃圾邮件软件会定期发生故障。**\
  \ 这种故障通常会导致你整个组织的邮件流中断。此时，纠正问题将成为你的责任，以便邮件重新开始。（这通常发生在你老板期待接收重要邮件的时刻，你会发现自己正在老板的注视下诊断并修复问题。）\n\
  - **本地反垃圾邮件软件增加了你服务器的负载，需要处理器时间、内存、磁盘存储和网络带宽等额外资源。**\n\n### 反垃圾邮件设备\n\n`antispam\
  \ appliance`（反垃圾邮件设备）本质上是一个安装在你现场的专用箱式本地服务器。该设备通常是一个自包含的基于 `Linux` 的计算机，运行预装在设备上的反垃圾邮件软件。这使得设备本质上是即插即用的——你只需设置它、连接到网络、开启电源并使用简单的\
  \ Web 界面进行配置。当设备运行时后，它可以提供本地反垃圾邮件软件的许多甚至全部功能。\n\n以下是使用反垃圾邮件设备的一些主要优势：\n\n- 因为设备包含了自身的硬件和预装的操作系统，你不需要担心单独购买硬件、安装操作系统、安装软件或任何与设置服务器相关的任务。\n\
  - 设置好后，设备基本上可以自律运行。你需要偶尔检查一下它，但设备的设计初衷是自给自足的。\n- 设备可能提供其他安全功能，例如防病毒和防火墙护护。因此，单台设备就可以处理你网络的大多数安全和保护需求。\n\
  \n使用反垃圾邮件设备并非没有劣势：\n\n- 最终，你会发现设备容量不足。例如，如果你网络上的用户数量增加了一倍，你可能会耗尽磁盘空间。\n- 如果设备故障，你可能在让其恢复运行方面遇到困难。当普通的\
  \ `Windows` 服务器故障时，你通常可以排查问题。但由于设备的自包含特性，当它无响应时，排查可能非常困难。\n\n### 云端反垃圾邮件服务\n\n云端反垃圾邮件服务（也称为\
  \ `hosted antispam`）是一种基于互联网的服务，在邮件到达你的邮件服务器之前就对其进行过滤。当你使用托管反垃圾邮件时，你需要重新配置你的公共 `DNS`，使你的邮件服务器（`MX`\
  \ 记录）指向云反垃圾邮件服务器而不是你的邮件服务器。这样，所有发送到你组织的邮件在到达你的邮件服务器之前首先由反垃圾邮件服务的服务器处理。只有被认为是法的邮件会被转发到你的邮件服务器；垃圾邮件存储在云端，用户如有需要可以对其进行查看和检索。\n\
  \n通常，你根据用户数量支付托管反垃圾邮件费用。例如，你可能每个用户每月支付 2 美。随着组织的增长，你只需购买额外的订阅即可。\n\n使用云端反垃圾邮件的一些主要优势：\n\
  \n- 你可以跳过安装和配置软件、将软件与 `Exchange` 集成、维护和修补软件，以及与在本地自托管服务器相关的所有其他杂事。你的每月订阅费用涵盖了他人完成所有这些工作的成本。\n\
  - 因为你不需要购买软件或硬件，所以没有初始投资。你只需订阅该服务并支付每月服务费。（作为一个额外奖励，如果你对服务不满意，可以轻松切换到其他服务。切换到不同的反垃圾邮件设备或本地解决方案要复杂且昂贵得多。）\n\
  - 云端反垃圾邮件解决方案可以随你的组织轻松扩展。如果你将用户数量增加一倍，只需每月支付双倍费用。你不需要担心磁盘空间、内存、时钟周期或网络带宽耗尽。\n- 云端反垃圾邮件减轻了你网络和邮件服务器的巨大负载。因为别人为你过滤垃圾邮件，垃圾邮件从未进入你的网络。在大多数组织中，电子邮件是网络上最消耗资源的应用程序之一。使用云端反垃圾邮件可以轻松减少一半的入流量；在某些情况下，它可能会减少高达\
  \ 90% 的流量。\n\n正如预期的，使用云端反垃圾邮件也有缺点：\n\n- 你放弃了一些控制权。云端服务的配置选项通常比本地软件少。例如，你可能较少自定义垃圾邮件过滤器的选项。\n\
  - 如果服务宕机，你的入邮件也会停止，除了拨打技术支持电话外你无能为力。噢，你还可以听到占线信号，因为当服务故障时，受影响的不只有你——还有你和其他所有其他客户。（当然，这为此类服务提供了足够的动力确保他们立即修复问题。）\n\
  \n## 减少垃圾邮件\n\n![提示](img/tip.png) 没有任何反垃圾邮件程序是完美的，所以你需要理解并预期会有某些垃圾邮件进入你的收件箱。以下是你（以及你的用户）应该记住的一些提示，以尽量减少未被检测到的垃圾邮件数量：\n\
  \n\n\n\n\n- **永远不要信任索要密码或信用卡卡的电子邮件。** 银行绝不会向你发送邮件通知某个潜在问题，并包含指向其在线门户网站登录页的链接。信用卡公司同样不会向你发送邮件提醒潜在的欺诈，并包含一个要求你提供信用卡号以验证交易的页面链接。此类邮件看起来可能非常有说服力，但你可以放心它们是诈骗性的。\n\
  \n如果你怀疑，请不要点击链接。相反，打开浏览器窗口并导航到你确认为是你的银行或信用卡公司门户网站合法登录页的地址。\n\n- **永远打开垃圾邮件中的附件。**\
  \ 垃圾邮件中的附件几乎肯定包含恶意软件。垃圾邮件中的恶意软件通常会收集你电脑所有的联系人并发送给垃圾邮件发送者，或者劫持你的电脑，让垃圾邮件发送者可以使用它发送垃圾邮件。\n\
  \n- **不要回复垃圾邮件。** 如果你回复垃圾邮件，只是向垃圾邮件发送者确认了他们找到了一个有效的邮箱地址。你会收到更多的垃圾邮件。\n\n- **使用反垃圾邮件程序的“这是垃圾邮件”功能。**\
  \ 如果你的反垃圾邮件程序有“这是垃圾邮件”或类似的按钮，请务必使用它。这样做会提醒反垃圾邮件程序它漏掉了一封垃圾邮件，这有助于改进反垃圾邮件程序用于检测垃圾邮件的过滤器。\n\
  \n- **退订合法但不需要的邮件。** 许多用户认为是垃圾邮件的内容，实际上是来自合法机构的邮件。如果垃圾邮件来自声誉良好的机构，它可能不是真的垃圾邮件；你可能曾经订阅过该机构的邮件。点击此类邮件上的退订链接，将自己从邮件列表列表中移除。\n\
  \n![Warning](img/warning.png) 垃圾邮件发送者通常会在他们的垃圾邮件中包含退订链接。如果该邮件实际上是垃圾邮件，点击退订链接等同于回复垃圾邮件——它只是向垃圾邮件发送者确认他们找到了一个有效的邮箱地址，你会收到更多的垃圾邮件。更糟糕的是，链接可能会带你进入恶意网站，该网站会尝试在你的电脑上安装恶意软件。因此，在点击退订链接之前，请确保该邮件确实来自合法发件者。\n\
  \n- **保护你的邮箱地址。** 小心你给谁提供邮箱地址，尤其是当你在线上填写表单时。确保你只给信任的网站提供你的邮箱地址。并在注册账户时要阅读正文——你通常会发现复选框，允许你退订新闻稿或产品更新公告之类的邮件。\n\
  \n- **使用备用邮箱地址。** 管理收到的垃圾邮件的一种实用技术是使用如 `Gmail` 等提供商设置一个免费邮箱账户。然后当你不想使用真实邮箱地址时，用此账户用于那些注册需要邮箱的网站。如果备用邮箱成为垃圾邮件的目标，你可以删除或更改该备用邮箱。\n\
  \n- **不要发布你的邮箱地址。** 如果你有个人网站或活跃在社交媒体上，请不要在那里发布你的邮箱地址。垃圾邮件发送者喜欢从公共网站和社交媒体上抓取邮箱地址。\n\
  \n# 第 22 章\n\n# 备份你的数据\n\n### 本章内容\n\n- ![Bullet](img/check.png) 理解备份的必要性\n- ![Bullet](img/check.png)\
  \ 学习备份黄金\n- ![Bullet](img/check.png) 理解不同类型的备份\n- ![Bullet](img/check.png) 考虑文件级备份与虚拟机备份之间的区别\n\
  - ![Bullet](img/check.png) 处理磁带\n\n如果你是那个不幸的网络管理员，你网络上数据的安全性就是你的责任。事实上，这是你的首要责任。你拿钱是为了在半夜失眠担心你的数据。它们明天还在吗？如果不在，你还能找回来吗？而且最重要的一点是——如果你找不回来，你明天还有工作吗？\n\
  \n本章将介绍创建稳健备份计划的细节。没有人会为了这些事颁发勋章，但应该有人为此颁发。\n\n## 3-2-1：备份黄金\n\n拥有备份数据是任何灾难恢复计划的基石。没有备份，简单的硬盘故障就可能让你的公司在尝试重建丢失数据时落后几天甚至几周。事实上，没有备份，你公司的存在都将面临危及。\n\
  \n但你不能仅依靠随意的、偶尔的备份来过日子。相反，你需要为数据备份创建一个全面的计划。然后，你需要付诸行动，确保你的备份按照计划运行。\n\n为了启动你的计划，我建议从最广泛认可的创建备份计划规则开始，称为\
  \ `3-2-1` 规则：\n\n- **保留数据的三份副本。** 其中一份是你的主副本，即每天访问的那个副本。另外两份是备份副本。\n- **使用两种不同类型的介质。**\
  \ 如果你将三份副本都存在同一种介质上，三份副本将面临相同的风险。因此，你应该使用至少两种介质。本地磁盘存储用于主副本，但另外两份副本中的至少一份应该是磁盘以外的，例如云或磁带。\n\
  - **将一份副本存在异地。** 如果三份副本都存储在一起，火灾等物理灾难可能会破坏所有三份副本。因此，至少有一份备份副本应该存储在其他地方。\n\n`3-2-1`\
  \ 规则已经存在了几十年并一直运行良好，但考虑到今天的环境，我认为它需要更新。以下是我提出的 `3-2-1` 规则的新版本：\n\n- **保留数据的三份备份副本。**\
  \ 在当今这个对我们数据威胁持续且复杂的世界上，一个主副本和两个备份副本已不再足够。因此，我建议你在主数据之外，再为三份备份副本制定计划。\n\n![Tip](img/tip.png)\
  \ 在本章稍后的后的部分，我将讨论备份*还原点*（restore points）的概念，这指的是备份中包含多少份特定日期的数据副本。当我说你应该保留三份备份时，我指的不是保留三个还原点。相反，你应该保留三组不同的备份，每组都存储在不同的介质和位置。这三份备份中的每份可以也应该包含不止一个还原点。\n\
  \n- **将两份副本存在异地。** 你的主备份副本应该离主数据近，以便快速恢复。拥有两种不同类型的介质并不是那么重要，但在发生物理灾难时，将备份存储在异地是至关重要的。异地备份的一种选择方案是云。另一种是位于不同地点的备份目标，例如位于分公司。\n\
  \n- **将一份副本离线存储。** 异地并不等同于离线。如今，你的异地备份副本可能是异地备份设备或云。尽管这些备份位置看起来很安全，但对于动力高昂且高水平的网络攻击来说，它们并不是完全安全的。如果你所有的备份都在线状态，黑客就可以入侵它们并删除你的备份。那将是终极噩梦场景：你某天去上班，发现你的主数据被删除了，本地备份被删除了，而你本认为是安全的异地备份也被删除了。\n\
  \n因此，你的第三道也是最后一道防线应该是一种可以完全从所有网络中移除的备份形式，使其对网络攻击完全免疫。在大多数情况下，这种形式的最优存储介质是磁带。\n\n\
  \n\n\n\n![Warning](img/warning.png) 许多云备份提供商坚持认为他们的备份解决方案可以消除对磁带备份的需求。他们是错误的。无论它们的安全措施有多先进，如果你的备份软件可以连接到云备份，那么黑客也可以。\n\
  \n以下是一个实现 3-2-1 规则的备份计划示例：\n\n*   主备份写入到网络附属存储 (NAS) 设备中，其容量至少是实际备份数据量的两倍。（有关关于\
  \ NAS 的更多信息，请参阅 第 13 章。））\n*   异地备份写入到位于另一建筑的第二个相同 NAS 设备中。\n*   离线备份写入到磁带设备，并在备份完成后取出磁带。\n\
  \n## 你应该多频繁地备份数据？\n\n备份计划中的另一个关键因素是数据备份数据的频率。回答*那个*问题的最佳方法是问自己*这个*问题：你的公司能够承受损失多少工作量？\n\
  \n如果你的公司能够承受损失一整周的工作，那么你可以使用每周备份一次数据的简单备份计划。如果允许阈值仅为一天，那么你需要一个更健壮的系统，每天备份一次数据。\n\
  \n如果即使损失一天的工作也是不可接受的，你可以创建一个每小时复制一次数据的备份计划，或者在必要时增加备份频率。\n\n![Tip](img/tip.png)\
  \ 计算损失成本的一种简单方法是，问问自己你的公司无法工作一小时、一天和一周的成本是多少。例如，假设你的公司是一家拥有 20 名员工的咨询公司，每人的平均计费率为每小时\
  \ 100 美元。计算很简单：如果没有人工作一小时，损失的收入为 2,000 美元。对于八小时的工作日，损失收入为 16,000 美元。对于一整周，损失为 80,000\
  \ 美元。此计算将帮助你确定应该在备份解决方案上投入多少资金。\n\n在确定备份数据的频率时，需要考虑的一个重要因素是确定每次备份完成所需的时间。这段时间被称为*备份窗口*（backup\
  \ window）。例如，如果备份你的数据需要两个小时，你显然无法每小时备份一次。\n\n幸运的是，你通常可以通过选择备份方法来绕过短短的备份窗口，即每次不备份所有数据，而只备份上次备份以来更改的数据。（有关更多信息，请参阅本章稍后的章节“检查基于文件的备份”。）\n\
  \n![Tip](img/tip.png) 你不需要为备份计划的所有三个层使用相同的备份间隔。例如，你的主备份可能每小时运行一次，异地备份每天一次（通常在半夜），而你的异地备份每周一次（通常在周末）。\n\
  \n## 选择备份数据的存储位置\n\n如果你计划在网络服务器的硬盘硬盘上备份数据，那么你显然需要某种介质来备份这些数据。这种介质被称为*备份目标*（backup\
  \ target），因为它是你的备份数据发往的位置。（正在被备份的数据称为*备份源*（backup source）。）\n\n最常见的备份目标选项是：\n\n\
  *   **存储区域网络 (SAN)：** 直接连接到你的服务器的磁盘存储。你网络的主要数据很可能存在 SAN 上。（有关关于 SAN 的更多信息，请参阅 第\
  \ 13 章。）\n    在任何情况下，你*不应该*将数据备份到与实时数据所在的同一个 SAN 上。原因很简单：如果 SAN 故障，你不仅会丢失实时数据，还会丢失备份。\n\
  \    但是，你可以建立第二个 SAN 来接收你的备份。这样，你的备份数据将与实时数据存储在独立的设备上。\n*   **NAS：** 直接连接到你网络的设备。NAS\
  \ 设备通常用作备份设备，因为它比 SAN 便宜。根据你的需求，你可以获得架式的企业级 NAS 设备，也可以购买廉价的便携消费级 NAS 设备。（有关关于 NAS\
  \ 的更多信息，请参阅 第 13 章。）\n*   **备份设备 (Backup appliance)：** 专门设计作为备份目标的磁盘设备。备份设备之所以受欢迎，是因为它们只需要很少工程工作即可完成：你只需插入、打开电源，然后配置你的备份软件将备份数据发送到它。\n\
  \    备份设备通常包含高级功能，帮助它们将尽可能多的备份数据压缩到磁盘存储中。例如，大多数备份设备使用*去重*（de-duplication）来避免重复存储相同的数据块。通过去重技术，备份设备几乎总是能将你的数据压缩至少\
  \ 2:1 倍，通常是 3:1 甚至 4:1 或更多。\n*   **云备份：** 一种日益增长的选项是使用第三方服务通过互联网将数据备份到远程位置。云备份的优势是它已经是异地存储。\n\
  *   **磁带：** 磁带是备份最古老的存储介质，仍然是最广泛使用的类型之一。磁带备份最大的优势之一是磁带盒很小，因此可以很容易地运输到异地。（有关磁带备份的更多信息，请参见下即将介绍的“备份到磁带”。）\n\
  \n## 建立两个关键备份目标\n\n在确定备份数据的频率以及在何种介质上存储备份时，你应该考虑建立两个备份目标：\n\n*   **恢复点目标 (RPO)：**\
  \ 你希望能够恢复数据的时间点。RPO 反映了你备份的频率：如果你每天备份一次，你的 RPO 就是一天。\n*   **恢复时间目标 (RTO)：** 在发生损失时恢复数据所需的时间。\n\
  \    在现实中，无法设置一个适用于所有类型损失的单一 RTO，因为恢复所需的时间取决于数据丢失事件的性质和程度，以及你将从哪组备份中进行恢复。如果你是从位于高速磁盘并靠近主存储的主备份中恢复，恢复速度将非常快——以小时为单位。另一方面，如果你是从损坏了你的实时数据、主备份和异地备份的网络攻击中恢复，你将从离线备份中恢复数据，离线备份可能存储在速度得多的磁带上——可能以天为单位。如果你是从毁了服务器机房的火灾中恢复，你需要在更换所有服务器设备之前才能开始恢复。\n\
  \    有关针对数据面临的各种风险规划恢复计划的更多信息，请参阅 第 23 章。\n\n## 备份到磁带\n\n使用磁带备份的另一个益处是你可以无人值运行它。事实上，你可以调度磁带备份在无人使用网络的非工作时间自动运行。然而，为了让无人值备份工作，你必须确保有足够的磁带容量来备份整个网络服务器的硬盘，而不需要手动更换磁带。如果你的网络服务器只有\
  \ 100GB 数据，你可以轻松地将其备份到单盘磁带上。然而，如果你有 1,000GB 数据，请购买带有杂志切换器的磁带驱动器，切换器可以容纳几盘磁带并自动将它们循环出入驱动器。这样，你就可以无人值守地运行备份。\n\
  \n\n\n\n今天最常用的磁带驱动器是线性磁带（LTO）。LTO 磁带技术有时被称为 `Ultrium`，尽管 `Ultrium` 一词指的是存放 LTO 磁带的盒盒的大小和形状，而不是磁带本身。\n\
  \nLTO 磁带自 2000 年引入以来已经历了八代，每一代在单张磁带上存储的数据更多。LTO 磁带使用内置的数据压缩技术，因此单张磁带的容量同时以原始（未压缩）容量和估计压缩容量的形式列出。（压缩容量是一个估计值，因为所实现的压缩程度取决于你的数据性质。）\n\
  \n各代及其容量和写入时间如下：\n\n| 代际 | 原始容量 | 压缩容量 | 满带写入时间 (h:mm) |\n| --- | --- | --- | ---\
  \ |\n| LTO-1 | 100GB | 200GB | 1:25 |\n| LTO-2 | 200GB | 400GB | 1:25 |\n| LTO-3\
  \ | 400GB | 800GB | 1:25 |\n| LTO-4 | 800GB | 1.6TB | 1:50 |\n| LTO-5 | 1.5TB |\
  \ 3.0TB | 3:10 |\n| LTO-6 | 2.5TB | 6.25TB | 4:35 |\n| LTO-7 | 6TB | 15TB | 5:55\
  \ |\n| LTO-8 | 12TB | 30TB | 9:15 |\n\n如你所见，每一代磁带的容量大约都增加了一倍。\n\n填满单张磁带所需的总时间为磁带备份任务完成所需提供了实用的参考。新磁带看起来似乎更慢，因为填满磁带需要的时间长得多，但考虑到磁带上存储的数据量大得多，它们实际上快得多。例如，一张\
  \ `LTO-5` 磁带仅需 3 多小时即可复制 3TB 的数据，速度约为每小时 1TB。但最新版本的 `LTO-8` 可以在 9 小时 15 分钟内将 30TB\
  \ 的数据复制到磁带上；那是惊人的每小时 3.25TB，是 `LTO-5` 的三倍。\n\n记住，许多其他因素会影响数据写入磁带的速度。与任何其他网络性能问题一样，整个系统的速度取决于其最慢链路的速度。无论你的磁带驱动器理论上写入磁带的速度有多快，如果它通过缓慢的网络连接到你的服务器，就无法达到这种速度。因此，你应该让磁带驱动器尽可能靠近它备份的数据，并在磁带驱动器和数据之间使用尽可能快的连接。\n\
  \n![Tip](img/tip.png) 如果备份的总数据量超过了单张磁带的容量，你应该考虑使用机器人磁带库，它可以在一张磁带装满时自动更换磁带。这样，你可以加载备份所需的任意磁带，以便整个磁带备份任务无需手动更换磁带即可完成。\n\
  \n## 理解备份软件\n\nWindows Server 带有一个名为 Windows Server Backup (WSB) 的基础备份程序。然而，这个备份程序对于任何实际用途来说都不够完善。以下是\
  \ `WSB` 的局限性：\n\n* `WSB` 只能备份到本地磁盘驱动器或网络共享。它不能备份到可移动介质（包括磁带）。\n* 如果你备份到网络共享，`WSB`\
  \ 每次运行时都会自动覆盖之前的备份。这意味着当 `WSB` 备份以网络共享作为目标运行时，在备份完成之前，你没有任何备份。\n* `WSB` 只能备份安装了它的单台服务器。你不能使用单一的\
  \ `WSB` 用户界面来备份网络上的所有服务器。因此，你必须在每台服务器上单独配置 `WSB` 以确保所有服务器都已备份，并且你必须登录每台服务器并启动 `WSB`\
  \ 以确保备份运行成功。\n\n由于 `WSB` 有许多局限性，大多数组织应该使用专为备份服务器计算机而设计的更复杂的备份程序。\n\n备份程序不仅仅是将数据从硬盘复制到磁带。备份程序使用特殊的压缩技术来挤压你的数据，以便你将更多数据挤入更少的磁带中。2:1\
  \ 的压缩率很常见，因此你通常可以将 100GB 的数据压缩到一张在不压缩的情况下只能容纳 50GB 的磁带上。（磁带驱动器制造商倾向于使用压缩数据来说明其驱动器的容量，假设压缩比为\
  \ 2:1。因此，200GB 磁带的未压缩容量为 100GB。）\n\n![Warning](img/warning.png) 你是否能实现 2:1 的压缩率取决于你所备份的数据性质：\n\
  \n* **文档：** 如果你的网络主要用于 Microsoft Office 应用并充满了 Word 和 Excel 文档，你可能会获得比 2:1 更好的压缩。\n\
  * **图形：** 如果你的网络数据主要由图形文件组成，你可能无法获得多少压缩。大多数图形文件格式已经是压缩的，因此无法再被压缩。\n\n备份程序还帮助你跟踪哪些数据已经备份，哪些还没有。它们还提供选项，例如我在下一节中描述的增量备份或差异备份。\n\
  \n![Remember](img/remember.png) 如果你的网络有多一台服务器，请投资于良好的备份软件。一个流行的选择是 Barracuda Backup。除了能够处理多台服务器外，备份软件的主要优势之一是\n\
  \n## 检查文件级备份\n\n备份数据的一种流行方案是使用备份程序从你的服务器复制单个文件到备份介质。此类软件通常通过在每台服务器上安装一个名为 `agent`（代理）的程序来工作。然后，你使用一个单一的集中程序来调度和管理由安装在每台服务器上的代理执行的单独备份。\n\
  \n![Tip](img/tip.png) 备份程序允许你选择任何驱动器和文件夹的组合进行备份。因此，你可以根据需要自定义备份操作的文件选择。例如，你可以设置一个备份计划，备份服务器上的所有共享文件夹和驱动器，但跳过很少更改的文件夹，例如操作系统文件夹或已安装的程序文件夹。然后你可以以不那么频繁的基础上备份这些文件夹。你为备份操作选择的驱动器和文件夹统称为\
  \ `backup selection`（备份选择）。\n\n在使用文件级备份时，你可以执行四种类型的备份：全备份、复制备份、增量备份和差异备份。这四种备份之间的区别涉及被称为\
  \ `archive bit`（归档位）的小技术细节，它指示文件自上次备份以来是否被修改过。`archive bit` 是一个与文件名、创建日期和其他目录信息一起存储的小标记。每当程序修改文件时，`archive\
  \ bit` 就会被设置为 On（开启）。这样，备份程序就知道该文件已被修改并需要备份。\n\n四种备份类型的每种都以不同的方式使用归档位：\n\n| ** 类型**\
  \ | 根据归档位选择文件？ | 备份后重置归档位？ |\n| --- | --- | --- |\n| 普通 (Normal) | 否 | 是 |\n| 复制\
  \ (Copy) | 否 | 否 |\n| 增量 (Incremental) | 是 | 是 |\n| 差异 (Differential) | 是 | 否 |\n\
  \n`archive bit` 可以是一个很好的 Abbott and Costello 笑段子（“好的，我想知道是谁修改了归档位。”“什么？”“谁？”“不，什么。”“等一下……直接告诉我修改归档位的家伙叫什么名字！”“好。”）\n\
  \n### 全备份\n\n\n\n\n\n`full backup`（全备）是最基本的备份类型。在 `full backup` 中，备份范围内的所有文件都会被备份，无论归档位（archive\
  \ bit）是否已设置。换句话说，即使文件自上次备份以来未修改，也会被备份。当每个文件被备份时，其归档位会被重置，因此后续基于归档位设置选择文件的备份将不会备份这些文件。\n\
  \n当 `full backup` 完成后，备份范围内的没有任何文件被设置归档位。因此，如果你在 `full backup` 之后立即进行增量备份或差异备份，增量备份或差异备份将不会选择这些文件进行备份，因为没有一个文件的归档位被设置。\n\
  \n一种简单且常见的备份方案是每晚安排一次 `full backup`。这样，你的所有数据每天都会进行备份。\n\n## 拷贝备份\n\n`copy backup`（拷贝备份）与\
  \ `full backup` 类似，不同之处在于复制每个文件时，归档位不会被重置。因此，拷贝备份不会破坏正常备份与增量备份或差异备份之间的循环。\n\n拷贝备份通常用于在正常备份周期之间的偶尔单次备份。例如，如果你正准备进行操作系统升级，应该在继续之前备份服务器。如果你执行\
  \ `full backup`，归档位会被重置，你的常规备份将会受到干扰。但如果你执行 `copy backup`，任何已修改文件的归档位将保持不变。因此，你的常规正常备份以及增量或差异备份将不受影响。\n\
  \n如果你不在备份例程中加入增量或差异备份，那么 `copy backup` 和 `full backup` 之间的区别就没有意义。\n\n## 增量备份\n\n\
  `incremental backup`（增量备份）仅备份自上次备份以来修改的文件。增量备份比全备快得多，因为用户在任何一天可能只修改了服务器上的一小部分文件。因此，增量备份备份的文件远少于\
  \ `full backup`。\n\n当增量备份复制每个文件时，它会重置文件的归档位。这样，除非用户修改了文件，否则该文件在随后的增量备份中不会被再次备份。\n\
  \n以下关于使用增量备份的一些想法：\n\n*   **使用增量备份的一种常用方案如下：**\n    * 每周一次 `full backup`，通常在周五进行，以便全备可以在周末完成。\n\
  \    * 在每个剩余的正常工作日进行 `incremental` 备份（通常为周一、二、三、四）。\n*   **当你使用增量备份时，完整的备份由全备磁带和自你执行全备以来制作的所有增量备份磁带组成。**\n\
  \    如果硬盘崩溃，你必须将数据恢复到新硬盘上，首先恢复 `full backup`，然后恢复所有随后的增量备份。\n*   **增量备份增加了恢复单个文件的复杂性，因为文件的最新副本可能位于全备或任何一个增量备份中。**\n\
  \    ![技术细节](img/technicalstuff.png) 备份程序跟踪每个文件最新版本的位置，以简化这一过程。\n\n## 差异备份\n\n`differential\
  \ backup`（差异备份）与增量备份类似，不同之处在于在备份文件时不不会重置归档位。因此，每个差异备份都代表上次 `full backup` 与硬盘当前状态之间的差异。\n\
  \n要从差异备份进行完全恢复，你首先恢复上次 `full backup`，然后恢复最近的差异备份。\n\n假设你在周五执行了 `full backup`，并在周一、二、三执行了差异备份，服务器在周五早上崩溃了。周五下午，你安装了一块新硬盘。为了恢复数据，你首先恢复上周末的\
  \ `full backup`。然后恢复周四的差异备份。周二和周三的差异备份不需要。\n\n增量备份和差异备份的主要区别是：\n\n*   `Incremental`\
  \ 备份生成的备份更小、速度更快。\n*   `Differential` 备份更容易恢复。\n\n## 备份与虚拟化\n\n如果你的服务器使用 `VMware`\
  \ 或 `Hyper-V` 虚拟化，你应该采用完全不同的备份方法。虚拟备份解决方案不需要创建基于备份所有服务器上成千上万（甚至数百万）单个文件的复杂每周全备和每日增量备份方案，而是可以专注于备份代表整个虚拟机（VM）的文件。这些文件很大，但存在软件可以让你轻松快速地将这些文件复制到其他媒体上。\n\
  \n`VMware` 和 `Hyper-V` 等虚拟化平台内置了管理这种复制的能力，但你也可以购买第三方解决方案将这种复制能力转换为功能完整的备份解决方案。例如，位于瑞士的\
  \ `Veeam` 公司 (`www.veeam.com`) 有一套专为虚拟环境设计的强大备份解决方案。通过 `Veeam`，你可以对虚拟机进行全备和增量备份，并能够恢复单个文件或整个机器。`Veeam`\
  \ 的最佳特性之一是你可以直接从备份镜像运行虚拟服务器，而无需先进行耗时的恢复。这可以将你的恢复时间从几小时缩短到几分钟。而且，在从备份镜像继续运行的同时，你可以同时将机器恢复到主介质。恢复完成后，`Veeam`\
  \ 将自动切换到恢复后的机器副本。\n\n虚拟机感知备份程序具有与基于文件的备份不同的备份类型。例如，`Veeam` 有五种基本的备份作业类型：\n\n*  \
  \ **全备（Full backup）：** `full backup` 只是整个虚拟机的拷贝。虚拟机及其所有数据都被写入单个文件中。自然，如果虚拟机很大，全备可能需要很长时间。注意，当你首次使用任何\
  \ `Veeam` 备份方法备份虚拟机时，会产生一个全备，以为其他类型的备份提供起点。\n*   **正向增量备份（Forward incremental backup）：**\
  \ 通常称为 `incremental backup`，`forward incremental backup` 仅复制虚拟机中自上次备份虚拟机以来更改的磁盘块。与基于文件的增量备份一样，正向增量备份创建一组增量文件，这些文件必须与原始全备结合才能恢复虚拟机。\n\
  *   **反向增量备份（Reverse incremental backup）：** `reverse incremental backup` 与正向增量备份类似，但有一个不同点：它不是创建一个包含自上次备份以来更改的独立备份文件，而是反向增量备份将所有更改的数据整合到最近的全备中，同时创建一个独立文件，用于存储所有更改数据块的先前的版本。当使用反向增量时，虚拟机的当前版本始终包含在全备文件中。要恢复虚拟机的以前版本，首先恢复全备。然后将一个或多个反向增量文件应用到全备上，对数据进行“回溯”，直到达到所需的恢复点。\n\
  \n\n\n\n\n- **合成全备份：** 当使用正增量备份时，`Veeam` 软件可以在不实际从源虚拟机传输所有数据的情况下，创建一个新的全备份。相反，它会创建最近一次全备份的副本；然后应用自最近一次全备份以来产生的所有增量备份。其结果被称为一个`synthesized\
  \ full backup`（合成全备份），因为它与普通的全备份完全相同，但在制作时并未实际从源虚拟机中复制任何数据。\n\n大多数 `Veeam` 备份计划都结合了定期的全备份、后续的一系列全增量备份以及定期的合成全备份。例如，你可能会采用一个为期四周的周期，如下所示：\n\
  \n* **第 1 周：** 周五进行全备份，随后在周一至周四进行每日正增量备份。\n* **第 2 周：** 周五进行合成全备份，随后在周一至周四进行每日正增量备份。\n\
  * **第 3 周：** 周五进行合成全备份，随后在周一至周四进行每日正增量备份。\n* **第 4 周：** 周五进行合成全备份，随后在周一至周四进行每日正增量备份。\n\
  \n在这个周期结束时，你将拥有一个全备份、三个合成全备份和 20 个正增量。这个周期产生了 24 个不同的恢复点，你可以从中从中恢复数据。\n\nVeeam 还提供了第五种备份类型，称为\
  \ `backup copy`（备份副本）。当你运行备份副本时，现有的 `Veeam` 备份会被复制到另一个位置，创建备份的备份。备份副本作业用于在远程位置或云存储创建异地备份，也可以用于创建磁带备份。\n\
  \n## 验证磁带的可靠性\n\n提到磁带，根据我痛苦的经历，我发现磁带驱动器非常可靠，但它们偶尔会故障。问题在于它们并不总是会在故障时告诉你。磁带驱动器可以旋转几个小时，假装在备份你的数据——但实际上，你的数据并没有可靠地写入磁带。换句话说，磁带驱动器可能会欺骗你，让你认为备份运行正常。那么当灾难发生你需要备份磁带时，你可能发现这些磁带是毫无用处的。\n\
  \n![Tip](img/tip.png) 不要恐慌！这里有一个简单的方法可以确保你的磁带驱动器正在工作。只需激活备份软件的“备份后比较”功能。一旦你的备份程序完成数据备份，它就会回带磁带，读取每个已备份的文件，并将其与硬盘上的原始版本进行比较。如果所有文件对比一致，你就知道你的备份是可靠的。\n\
  \n关于磁带的可靠性，这里还有一些额外的想法：\n\n* `compare-after-backup`（备份后比较）功能会使备份所需的时间增加一倍，但如果你的整个备份都能装在一盘磁带上，这就不重要了。你可以在下班后运行备份。备份和修复操作花费一小时还是十小时并不重要，只要在第二天早晨网络用户上班之前完成即可。\n\
  * 如果你的备份需要多一盘磁带，你可能不想每天都运行 `compare-after-backup` 功能。但请务必定期运行它，以检查你的磁带驱动器工作正常。\n\
  * 如果你的备份程序报告错误，请丢掉磁带并使用新磁带。\n* 实际上，你应该忽略最后那条关于等待备份程序报告错误的建议。你应该在备份程序报告错误*之前*丢弃磁带。大多数专家建议，磁带在使用约\
  \ 20 次后就丢弃。如果你每天都使用同一盘磁带，请每月更换一次。如果你每天都有磁带，请每年更换两次。如果你有更多磁带，请制定一个在使用约 20 次后更换的周期。\n\
  \n## 保持备份设备清洁和可靠\n\n备份可靠性的一个重要方面是对磁带驱动器的妥善维护。每当你备份到磁带时，磁带的小碎片和斑点会擦落在磁带驱动器内部的读头上。最终，磁头会变得太脏，无法可靠地读取或写入数据。\n\
  \n为了解决这个问题，请定期清洁磁头。最简单的方法是使用磁带驱动器的清洁盒。驱动器会自动识别何时插入了清洁盒，然后执行程序，让清洁磁带在磁头上反复移动以进行清洁。清洁程序完成后，磁带会弹出。整个过程只需要大约\
  \ 30 秒。\n\n由于不同驱动器的维护要求不同，请查看每个驱动器的用户手册，以了解如何以及多久清洁驱动器。作为一般原则，每周清洁一次。\n\n磁带驱动器清洁最烦人的一点是清洁盒的寿命有限，不幸的是，如果你插入一个用完的清洁盒，驱动器会接受它并假装在清洁驱动器。出于因此，请记录使用清洁盒的次数，并按照制造商的建议更换。\n\
  \n## 设置备份安全\n\n备份为你的网络了一个经常被忽视的安全漏洞：无论你如何仔细设置用户账户并执行密码策略，如果任何用户（包括游客）都能执行系统备份，该用户就可能进行未经授权的备份。此外，备份磁带本身也容易被盗。因此，请通过采取以下措施确保你的备份策略和程序的安全性：\n\
  \n* **为执行备份的用户创建一个账户。** 因为此用户账户拥有整个服务器的备份权限，请务必保管好密码。任何知道备份账户用户名和密码的人都可以登录并绕过你对该用户普通\
  \ ID 设置的任何安全限制。\n* **通过限制备份用户 ID 到特定的客户端和每天特定的时段来应对潜在的安全问题。** 如果你非常聪明（而且偏执），你可能可以设置备份账户，使其只能运行备份程序。\n\
  * **使用加密来保护你备份磁带的内容。**\n* **将备份磁带存放在一个安全的地方，例如……嗯，保险箱。**\n\n第 23 章\n\n# 灾难规划\n\n\
  ### 本章内容\n\n* ![Bullet](img/check.png) **了解影响你组织的灾难类型**\n* ![Bullet](img/check.png)\
  \ **考虑灾难的影响**\n* ![Bullet](img/check.png) **制定生存灾难的计划**\n\n在大约 30 年前的一个愚人节，我和同事发现，某个倒霉蛋在前一天晚上闯入办公室，并用铁锤把我们的电脑设备砸死了。（我不是在胡编。）\n\
  \n在紧挨着那堆曾是 `Wang` 微型计算机系统的扭曲残骸的架子上，静静地放着一个未被触动的磁带盒，它包含了被销毁计算机上所有信息的唯一完整备份。破坏者没有意识到，再挥一下铁锤就会让这次严重的不便演变成一场彻底的灾难。诚然，在买新电脑之前，我们陷入了困境。在那个时代，你不能直接走进当地的\
  \ `Computers R Us` 买一台现货的电脑——这是一台必须特殊订购的 `Wang` 微型计算机系统。然而，在我们获得新电脑后，从备份磁盘进行简单的恢复就让我们直接回到了\
  \ 3 月 31 日的状态。如果没有那个备份，重回正轨将花费几个月。\n\n\n\n\n\n从那时起，我就对灾难规划一直疑疑神神。在那之前，我以为灾难规划意味着做好良好的备份。这只是其中一部分，但我永远无法忘记那一天，我们离失去一切只有一步之遥。破坏者现在可能比以前聪明得多：他们知道要销毁备份带，还要破坏电脑本身。为灾难做好准备远不止是进行定期备份那么简单。\n\
  \n如今，灾难规划的流行术语是`业务连续性计划` (BCP)。我想`灾难规划`这个词听起来可能太负面了，好像我们正在为灾难的发生而做计划。新术语将注意力重新放在更积极的方面上，即制定一项计划，使企业在灾难发生时能够尽可能少地中断并继续运营。\n\
  \n关于此主题的更多深入信息，请参阅 Peter Gregory (Wiley) 编写的 `IT Disaster Recovery Planning For\
  \ Dummies,》。\n\n## 评估不同类型的灾难\n灾难的形式和规模各异。某些类型的灾难发生概率比其他类型高。例如，你的建筑被雷击中的概率比被彗星击中的大。在某些情况下，特定类型灾难发生的可能性取决于你所在的位置。例如，纽约的毁灭性暴雪比比佛罗里达更容易发生。\n\
  \n此外，每种类型灾难的影响也因公司而异。对于一家公司来说可能是灾难的事情，对另一家公司可能只是微小的不便。例如，一家律所可能会忍受一两天的电话服务中断——失去电话通信将是一个巨大的不便，但不是灾难。然而，对于一家电话营销公司来说，电话停机一天是一个更严重的问题，因为公司的收入依赖于电话。\n\
  \n制定业务连续性计划的步骤之一是评估可能影响你组织的各种类型灾难的风险。权衡灾难发生的概率与灾难可能造成的影响严重程度。例如，陨石撞入你的建筑可能非常严重，但这种事件发生的概率微乎其微。另一方面，你的建筑被火灾毁的概率要高得多，而一场毁灭性火灾的后果与陨石冲击相当。\n\
  \n接下来的章节描述了大多数公司面临的最常见风险类型。在整个讨论过程中请注意，尽管这些风险中许多与计算机和网络技术有关，但有些并不是。业务连续性规划的范围远比计算机技术要大。\n\
  \n### 环境灾难\n大多数人在想到灾难恢复时，首先想的就是环境灾难。某些类型的环境灾难是区域性的。其他一些可以在任何地方发生。以下是一些例子：\n\n- **火灾**：火灾可能是大多数人在考虑灾难规划时，首先想到的灾难。火灾可能由不安全状况引起；疏忽（例如不符合标准的电气布线）；自然原因（如雷击）；或纵火引起。\n\
  - **地震**：地震不仅会对你的建筑造成结构性损坏，还会中断关键服务和公用事业（如水和）的供应。严重的地震罕见且不可预测，但某些地区发生的频率比其他地区更高。如果你的业务位于地震频发区，你的`BCP`\
  \ 应该考虑公司将如何应对毁灭性的地震。\n- **天气**：天气灾难可能给你的业务造成重大中断。中天气可能会导致交通系统关闭，使你的员工无法上班。极端天气可能会损坏你的建筑或中断服务供应，如电力和水。\n\
  - **水**：洪水会对计算机等电气设备造成破坏性影响。如果洪水水进入了你的机房，计算机设备很可能被完全毁。洪水不仅可能由恶天气引起，还可能由水管破裂或喷淋器故障引起。\n\
  - **雷电**：雷暴可能导致雷击对你的计算机和其他电子设备造成电气损坏，以及局部电源的浪涌。\n\n### 蓄意灾难\n某些灾难是他人蓄意行为的结果。例如：\n\
  \n- **故意破坏**：破坏行为或纵火可能会损坏或破坏你的设施或计算机系统。这种破坏行为或纵火可能是由不满的员工或客户特意针对你的，或者也可能是随机的。无论何种情况，结果都是样的。\n\
  \  ![Remember](img/remember.png) 不要忽视破坏的可能性。一个获取了管理员账户和密码的不满员工，可以对你的网络做各种恶毒的事情。\n\
  - **盗窃**：盗窃始终是一个可能。你可能某天上班时发现你的服务器或其他计算机设备被盗窃了。\n- **恐怖主义**：恐怖主义曾是大多数美国人并不关心的事情，但\
  \ 2001 年 9 月 11 日改变了一切。无论你住在世界的哪个角落，恐怖袭击的可能性都是现实。\n\n### 服务中断\n你可能没有意识到你的业务有多依赖服务和服务公用事业的供应。`BCP`\
  \ 应该考虑到你将如何处理某些服务的丢失：\n\n- **电力**：电力对于计算机和其他类型的设备至关重要。在一次停电期间（我住在加利福尼亚州，所以我习惯了），我发现我甚至无法用纸笔工作，因为我所有的卷笔刀都是电动的。停电并不罕见，但处理它们的技术随处可用。不间断电源\
  \ (`UPS`) 设备可靠且廉价的。\n- **通信**：通信连接可能被许多原因中断。几年前，我办公室街对面建造了一座铁路过天桥。有一天，一台挖掘机切断了电话线，导致我们的电话服务——包括我们的`Internet`\
  \ 连接——完全中断了一个半天。\n- **水**：水供应中断可能不会关闭你的计算机，但它可能会迫使你关闭设施直到水供应恢复，从而中断你的业务。\n\n###\
  \ 设备故障\n现代公司日常运营依赖许多不同类型的设备。任何一个关键系统的故障都可能在系统修复之前中断业务：\n\n- **计算机设备故障显然会影响业务运营。**\n\
  - **空调系统对于调节温度至关重要，特别是在机房内。** 如果温度过高，计算机设备可能会受到损坏。\n- **电梯、自动门和其他设备可能对你的业务也是必要的。**\n\
  \n### 其他灾难\n你应该评估许多其他潜在灾难。这里只是几个：\n\n- 劳动纠纷\n- 因辞职、受伤、生病或死亡导致关键人员流\n- 职场暴力\n- 公共健康问题，如流行病、霉菌感染等\n\
  - 失去关键供应商\n- 邻近灾难，例如街对面发生的火灾或警方行动导致你的业务被临时封锁。\n\n## 分析灾难的影响\n\n\n\n\n对于某些业务流程，持续几小时甚至一天的中断可能是微不足道的。但对于其他流程，即使损失几个小时也可能代价高昂。\n\
  \n## 开发业务连续性计划\n\n业务连续性计划（BCP）是指在正常运营故障时，你将如何继续关键业务流程的计划。由于灾难影响的流程包括：\n\n-   **编辑**：例如：排版、制作\n\
  -   **采购**：例如：作者、签约\n- ****人力资源**：例如：薪酬、招聘\n-   **营销**：例如：促销活动、展会\n-   **销售与账单**：例如：订单处理、收款\n\
  -   **高层与财务**：例如：现金流、融资\n\n如果你的主办公室因为街对面发生火灾而关闭一周，由于你制定了业务连续性计划，由于灾难发生，你就不需要暂停业务。\n\
  \n评估灾难对流程影响的一种常见方法是评估以下时间范围：\n\n- 0 到 2 小时\n- 2 到 24 小时\n- 1 到 2 天\n- 2 天到一周\n-\
  \ 超过一周\n\n对于某些业务流程，两小时或一天的中断可能是微不足道的。但对于其他流程，即使损失几个小时也可能代价高昂。\n\nBCP 的关键是对业务流程至关重要的每个组件进行冗余。这些组件包括：\n\
  \n-   `设施`：如果你的公司已经有了多个办公地点，你可以在灾难期间临时搬进其中一个。如果没有，你应该提前与房地产经纪人达成协议，以便快速安排备选地点。通过提前安排，你可以在随时搬进应急地点。\n\
  -   `计算机设备`：在某处存储一套备用计算机是有好处的，以便在紧急情况下将其取出。理想情况下，这些计算机已经安装了你的关键软件。其次是准备好详细的计划，以便你的\
  \ IT 人员能够在新设备上快速安装软件，使业务恢复运行。\n    ![警告](img/warning.png) 始终在备选地点保留一套备份介质。\n-  \
  \ `电话`：提前与你的电话公司讨论应急电话服务。如果你被迫在 24 小时内搬到另一个地点，多快能让电话恢复运行？你能否安排将拨入免费电话转接到新地点？\n-\
  \   `员工`：除非你在政府机构工作，否则你可能没有冗余员工。但是，你可以提前安排。\n-   `办公用品`：除非你在政府机构工作，你可能没有冗余员工。但是，你可以提前安排。\n\
  -   `纸质复印件`：除非你在政府机构工作，你可能没有冗余员工。但是，你可以提前安排。\n\n## 举行火灾演习\n\n任何灾难恢复计划如果不进行测试都是不完整的。最基本的灾难演习类型是对你的网络进行简单测试。你应该定期进行测试以确保其正常工作。你也可以对更严重的场景进行演练。例如，你可以留出一天，演练全体员工搬到备选地点的过程。你可以双检所有备份设备、文档和数据是否都按计划可用。\n\
  \n\n\n本章还向你介绍了远程计算机工作的第三个重要功能：内置的 `Remote Desktop Connection`（远程桌面连接）功能，它可以让你连接到远程计算机，并像坐在电脑前一样一样操作该计算机。此功能为远程工作提供了各种机会。例如，假设你在办公室有一台电脑，上面安装了你所有重要的工作软件和文件。你可以通过与工作网络建立\
  \ `VPN` 连接，然后使用 `Remote Desktop Connection` 连接到工作电脑，从而从家里电脑访问那台电脑。大功告成！你在家里办公了！\n\
  \n## 使用 Outlook 网页版\n\n大多数从家里连接到办公室网络的人实际上只需要电子邮件。如果访问办公室网络的唯一理由是为了获取邮件，请尝试这个简单易用的工具：`Outlook\
  \ Web App`（Outlook 网页版），也称为 `OWA`。此 `Microsoft Exchange Server` 功能可以让你从任何连接互联网的计算机访问公司邮箱。远程计算机只需要一个网络浏览器和互联网连接；不需要\
  \ `VPN` 或其他特殊配置。\n\n最好的部分是，你不需要进行任何特殊操作来启用 `OWA`；在安装 `Microsoft Exchange` 时，它是默认启用的。虽然你可以配置许多选项来改进其体验，但\
  \ `OWA` 开箱即用。\n\n要从任何网络浏览器访问 `OWA`，只需浏览到为你的组织指定的 `OWA` 地址即可。默认地址是你邮件服务器的 `DNS` 名称，后跟\
  \ `/exchange`。例如，对于邮件服务器 `smtp.lowewriter.com`，`OWA` 地址为 `smtp.lowewriter.com/exchange`。\n\
  \n![技术细节](img/technicalstuff.png) 连接必须使用安全版本的普通 `HTTP` 网页协议。你必须在 `OWA` 地址之前输入 `https://`。完整地址将类似于\
  \ [`https://smtp.lowewriter.com/exchange`](https://smtp.lowewriter.com/exchange)。\n\
  \n当你浏览到你的 `OWA` 地址时，系统会提示输入用户名和密码。请使用你的网络登录用户名和密码。`OWA` 会显示在浏览器窗口中，如图 24-1 所示。\n\
  \n如果你熟悉 `Outlook`，那么使用 `OWA` 将没有任何困难。几乎所有的 `Outlook` 功能都可用，包括收件箱、日历、联系人、任务、提醒甚至公共文件夹。你甚至可以设置自动回复。\n\
  \n`OWA` 和 `Outlook` 之间的区别是顶部没有菜单栏。然而，菜单栏提供的大部分功能在 `OWA` 的其他地方可用。如果你找不到某个功能，请查看 `Options`（选项）页面，你可以通过选择页面右上角的\
  \ `Options` ⇒   `Show All Options`（显示所有选项）来进入。图 24-2 显示了 `Options` 页面。在这里你可以创建自动回复、设置签名并更改许多其他选项。\n\
  \n![Outlook 网页版浏览器窗口截图，看起来像 Outlook](img/9781119648505-fg2401.png)\n\n图 24-1： OWA\
  \ 看起来非常像 Outlook。\n\n![设置 Outlook 网页版选项的截图。](img/9781119648505-fg2402.png)\n\n图\
  \ 24-2： 在此处设置 OWA 选项。\n\n## 使用虚拟专用网络\n\n`virtual private network`（`VPN`）是一种网络连接类型，它创造了一种幻，认为你直接连接到了网络，但实际上你并非如此。例如，假设你在办公室建立了一个\
  \ `LAN`，但有时会在家里工作。但你将如何从家里访问工作电脑上的文件呢？\n\n* 你可以简单地将所需的文件从工作电脑拷贝到 U 盘并带回家，处理文件后将更新后的文件拷贝回\
  \ U 盘，第二天带回公司。\n* 你可以将文件发送到你的个人邮箱账户，在家里处理，然后将更改后的文件发回你的工作邮箱账户。\n* 你可以买一台笔记本电脑并使用\
  \ `Windows Offline Files`（Windows 离线文件）功能自动同步工作网络文件与笔记本上的文件。\n\n或者，你可以建立一个 `VPN`，允许你从家里登录工作网络。`VPN`\
  \ 使用安全的互联网连接将你直接连接到工作网络，因此你可以访问网络文件，就像你有一条非常长的以太线从家里电脑一直延伸到办公室并直接插入工作网络一样。\n\n以下是至少三种\
  \ `VPN` 是理想解决方案的场景：\n\n* 员工需要偶尔从家里工作（如上述描述的情景）。在这种情况下，`VPN` 连接在家里电脑和办公室网络之间建立了一个安全连接。\n\
  * 移动用户——他们可能永远不会出现在办公室——需要从移动电脑连接到工作网络，通常位于酒店房间、客户办公室、机场或咖啡馆等地点。这种类型的 `VPN` 配置与家庭用户的配置类似，只是远程用户计算机的精确位置不是固定的。\n\
  * 你的公司在两个或多个地点设有办公室，每个地点都有自己的 `LAN`，你想连接这些地点，以便任一网络上的用户都能访问对方的网络资源。在这种情况下，`VPN`\
  \ 不是连接单个用户与远程网络，而是将两个远程网络连接在一起。\n\n### 查看 VPN 安全性\n\n`VPN` 中的 `V` 代表 `virtual`（虚拟的），这意味着\
  \ `VPN` 创建了本地网络连接的假象，但实际上连接是通过公共网络（互联网）建立的。人们有时使用 `tunnel`（隧道）一词来描述 `VPN`，因为 `VPN`\
  \ 在两个位置之间创建了一个“隧道”，该隧道只能从两端进入。只要数据在“隧道”内从一端传输到另一端，它就是安全的——也就是说，在 `VPN` 提供的保护范围内。\n\
  \n`VPN` 中的 `P` 代表 `private`（私立的），这是创建“隧道”的目的。如果 `VPN` 无法建立有效的安全保障，导致数据无法从两端中的一个进入隧道，那么\
  \ `VPN` 就毫无用处了；你还不如把你的网络和远程计算机暴露给互联网，让黑客随心所欲。\n\n在 VPN 技术出现之前，提供隐私远程网络连接的唯一方法是通过直拨线路或专用专线，这些线路过去（现在仍然）非常昂贵。例如，为了建立一个远程办公室，你可以从电话公司租一条私用\
  \ `T1` 线来连接两个办公室。这条私用 `T1` 线提供了极好的安全性，因为它在物理上连接了两个办公室，且只能从两个端点访问。\n\n`VPN` 与私用租线相同的对点连接，但它是通过互联网实现的，而不是通过昂贵的专用线路。为了创建一个确保数据从\
  \ `VPN` 一端传输到另一端时具有隐私性的“隧道”，数据使用特殊的安全协议进行加密。\n\n`VPN` 安全协议中最重要的是 `Internet Protocol\
  \ Security`（`IPSec`），它是一套用于加密和验证在互联网上传输的数据包的标准集合。换句话说，它提供了一种加密数据包内容的方法，使得只有知道秘密密钥的人才能解码数据。它还提供了一种可靠识别数据包来源的方法，使得\
  \ `VPN` 隧道两端的双方都可以相信数据包是真实的。\n\n\n\n\n另一种常用的 VPN 协议是第二层隧道协议（L2TP）。该协议不提供数据加密。相反，它的设计目的是创建端到端的连接——`tunnels`（隧道）——数据可以通过其中传输。L2TP\
  \ 实际上是两个旧协议的组合：思科的二层转发协议（L2FP）和微软的点对点隧道协议（PPTP）。\n\n如今的许多 VPN 都使用 L2TP 和 IPSec 的组合：`L2TP\
  \ over IPSec`。这种类型的 VPN 结合了 L2TP 和 IPSec 的优特性，提供了高水平的安全性和可靠性。\n\n### 理解 VPN 服务器和客户端\n\
  \nVPN 连接需要一个 VPN `server`（服务器）——隧道一端的守门人——以及另一端的 VPN 客户端。服务器和客户端之间的主要区别在于，客户端发起与服务器的连接，而\
  \ VPN 客户端每次只能与一个服务器建立连接。然而，服务器可以接受许多客户端的连接。\n\n通常情况下，VPN 服务器是一个独立的硬件设备，最常见的是安全设备，例如\
  \ Cisco ASA 安全设备。VPN 服务器也可以通过软件实现。例如，Windows Server 包含了内置的 VPN 功能，尽管它们并不容易配置。VPN\
  \ 服务器也可以在 Linux 和 macOS 中实现。\n\n图 24-3 显示了 Cisco ASA 设备的众多 VPN 配置屏幕之一。此屏幕提供了 IPSec\
  \ VPN 连接的配置细节。此屏幕上最重要的信息是预共享密钥（Pre-Shared Key），它用于加密通过 VPN 发送的数据。客户端需要提供相同的密钥才能参与\
  \ VPN 连接。\n\n![Cisco ASA 安全设备上 IPSec 配置页面的快照。](img/9781119648505-fg2403.png)\n\n\
  图 24-3： Cisco ASA 安全设备上的 IPSec 配置页面。\n\n![记住](img/remember.png) VPN 客户端通常是运行在想要连接到远程网络的客户端计算机上的软件。VPN\
  \ 客户端软件必须配置 VPN 服务器的 IP 地址，以及身份验证信息（如用户名和用于加密数据的预共享密钥）。如果客户端使用的密钥与服务器使用的密钥不匹配，VPN\
  \ 服务器将拒绝客户端的连接请求。\n\n图 24-4 显示了一个典型的 VPN 软件客户端。当客户端配置了正确的连接信息时（可以通过点击 `New` 按钮来实现），只需点击\
  \ `Connect`。片刻之后，VPN 客户端将宣布连接已建立且 VPN 已连接。\n\n![虚拟专用网络客户端的快照。](img/9781119648505-fg2404.png)\n\
  \n图 24-4： VPN 客户端。\n\n![提示](img/tip.png) VPN 客户端也可以是硬件设备，例如另一个安全设备。这在用 VPN 连接两个不同地点的网络时最为常见。例如，假设你的公司在\
  \ Pixley 有一个办公室，在 Hooterville 有另一个第二个办公室。每个办公室都有自己的带有服务器和客户端计算机的网络。通过 VPN 连接这些办公室最简单的方法是在每个位置放置一个相同的安全设备。然后，你就可以配置这些安全设备通过\
  \ VPN 进行通信。\n\n## 使用远程桌面连接进行连接\n\n远程桌面连接（RDC）旨在让你从远程位置登录 Windows 计算机。这对于从家里访问工作计算机（或反之）非常有用，也用于管理没有物理控制台的虚拟服务器。\n\
  \n请注意，为了远程连接到域上的计算机，你的计算机必须能够访问该域。实现这一点的最简单方法是通过 VPN 连接到该域。当你连接到 VPN 后，远程桌面客户端将能够找到你尝试连接的计算机。\n\
  \n![技术细节](img/technicalstuff.png) 远程桌面连接使用一种名为 `Remote Desktop Protocol`（RDP）的协议。严格来说，RDP\
  \ 指的是协议而不是连接本身。然而，`RDP` 一词经常被用作 RDC 的替代词。例如，在句子中这样使用它：“我今天不想开车上班，所以我想直接 RDP 进去就行了。”如果你的老板批准了你的计划，你可以这样工作几天而不洗澡。\n\
  \n在接下来的章节中，你将学习如何启用和使用远程桌面连接来远程连接到工作。\n\n### 启用远程桌面连接\n\n在可以使用 RDP 访问服务器之前，你必须在服务器上启用远程访问。要此操作，请遵循以下步骤（在服务器计算机上操作，而不是你的桌面计算机）：\n\
  \n1. **打开控制面板并点击系统。**\n   此步骤将调出系统设置页。\n2. **点击远程设置链接。**\n   出现远程访问选项，如 图 24-5 所示。\n\
  3. **选择“允许此计算机远程连接”单选按钮。**\n4. **点击 OK。**\n\n![配置远程访问的快照。](img/9781119648505-fg2405.png)\n\
  \n图 24-5： 配置远程访问。\n\n完成了！\n\n你可以点击 `Select Users` 按钮来创建授权远程访问计算机的用户列表。请注意，你在启用 RDP\
  \ 时登录的帐户会自动获得访问权限，因此你不需要添加自己。\n\n![警告](img/warning.png) 毫无疑问，RDP 是方便实用的。然而，它本质上也是危险的。除非你已经通过使用强密码采取了保护账户的安全措施，否则不要启用它。此外，你应该已经安装了防火墙以防止不受欢迎的访客进入你的网络。有关账户安全的更多信息，请参阅\
  \ 第 19 章。\n\n### 远程连接\n\n在服务器上启用远程访问后，你可以使用 Windows 自动安装的远程桌面客户端连接到服务器。步骤如下：\n\n\
  1. **点击开始按钮，输入单词 Remote，然后点击远程桌面连接图标。**\n   远程桌面连接客户端启动，如 图 24-6 所示。\n   ![使用远程桌面连接连接的快照。](img/9781119648505-fg2406.png)\n\
  \   图 24-6： 使用远程桌面连接进行连接。\n2. **输入想要连接的计算机名称。**\n   或者，你可以使用下拉列表从可用列表中选择计算机。\n \
  \  你也可以输入想要连接的计算机的 IP 地址。\n3. **点击 Connect 按钮。**\n   你已连接到所选的计算机，然后会被提示登录凭据，如 图\
  \ 24-7 所示。\n   ![提示](img/tip.png) 如果你没有看到此屏幕，而是收到了一条显示无法联系计算机的消息，请检查你是否输入了正确的计算机名称或\
  \ IP 地址。如果名称或地址正确，可能是你没有先连接到 VPN。除非能够通过 VPN 访问域，否则远程桌面客户端将无法找到计算机。\n   ![登录到远程计算机的快照。](img/9781119648505-fg2407.png)\n\
  \   图 24-7： 登录到远程计算机。\n4. **输入你的用户名和密码，然后点击 OK。**\n   假设你输入了有效凭据，远程计算机的桌面将显示，如 图\
  \ 24-8 所示。\n5. **现在你可以使用远程计算机了！**\n\n\n\n\n\n![远程计算机桌面的截图。](img/9781119648505-fg2408.png)\n\
  \n图 24-8 你已连接！\n\n你可能会在图 24-8 中注意到，远程桌面窗口不够大无法显示远程计算机的整个桌面。因此，会出现滚动条，允许你水平或垂直滚动桌面。你可以随时最大化远程桌面窗口，以查看远程计算机的整个桌面。\n\
  \n![提示](img/tip.png) 这里是关于使用远程桌面连接的其他一些技巧：\n\n*   **远程桌面一次只允许一个用户登录远程计算机。** 如果在你尝试连接时，有另一个用户正在远程登录，你将收到一条通知，告知你有另一个用户已登录。你可以选择取消，或者尝试强制进入另一个用户的远程会话。如果你选择后一种选项，另一个用户将看到一条消息，说明你想连接。如果另一个用户接受了你的请求，该用户将被注销登录，而你将登录。如果另一个用户拒绝了你的请求，你的登录尝试将被取消。如果用户没有响应，Windows\
  \ 最终会将另一个用户踢出去让你进入。\n\n*   **当你使用远程桌面连接客户端时，不能直接按 `Alt+Tab` 切到客户端计算机上运行的另一个程序。**\
  \ 相反，你必须先点击最小化按钮最小化 RDC 客户端窗口。然后你就可以访问计算机上运行的其他程序。\n\n*   **如果你最小化了 RDC 客户端窗口，返回时必须重新提供登录凭据。**\
  \ 这一安全功能是为了防止你忘记自己还开着一个 RDC 会话。\n\n![提示](img/tip.png) 如果你在特定的计算机上频繁使用 RDC（例如你自己的台式电脑），我建议你创建一个\
  \ RDC 的快捷方式，并将其放在桌面、启动菜单顶部或任务栏的快速启动部分。\n\n### 在远程桌面中使用键盘快捷键\n\n在远程桌面会话中工作时，某些标准的\
  \ Windows 键盘快捷键的作用并不完全如你预期。表 24-1 列出了可以在远程桌面会话中使用的特殊键盘快捷键。\n\n| **快捷键** | **作用**\
  \ |\n| --- | --- |\n| `Ctrl+Alt+Break` | 在全屏和窗口视图之间切换。 |\n| `Ctrl+Alt+Pause` | 与\
  \ `Ctrl+Alt+Break` 类似，但不是将远程窗口最大化全屏，而是在黑色背景下显示远程窗口。 |\n| `Alt+Insert` | 在远程桌面运行的应用程序之间循环切换，相当于本地机器上的\
  \ `Alt+Tab`。 |\n| `Alt+PageUp` | 与 `Alt+Insert` 。 |\n| `Alt+PageDown` | 与 `Alt+Insert`\
  \ 类似，但反转应用程序循环的顺序。这相当于本地机器上的 `Alt+Shift+Tab`。 |\n| `Ctrl+Alt+End` | 向远程桌面发送 `Ctrl+Alt+Del`。\
  \ |\n| `Alt+Home` | 调出远程系统的启动菜单。 |\n| `Alt+Delete` | 在远程桌面窗口上打开 Windows 菜单。（Windows\
  \ 菜单是每个窗口左上角的，具有移动、调整大小、最小化、最大化和关闭窗口的选项。） |\n| `Ctrl+Alt+Plus Sign (+)` | 捕捉整个远程面的屏幕并保存到剪贴板。这相当于在本地机器上按\
  \ `Print Screen`。 |\n| `Ctrl+Alt+Minus Sign (–)` | 捕捉当前窗口图像并保存到剪贴板。这相当于在本地机器上按 `Alt+Tab`。\
  \ |\n\n表 24-1 远程桌面快捷键\n\n# 第 25 章\n\n# 云城的生活\n\n本章内容\n\n![项目](img/check.png) **检查云计算的基础知识**\n\
  \n![项目](img/check.png) **查看三类云计算服务**\n\n![项目](img/check.png) **理解云计算的优缺点**\n\n![项目](img/check.png)\
  \ **浏览几家主要的云计算服务提供商**\n\n世界上最受欢迎的两个科幻系列——《星球大战》和《星际迷航》都出现了悬浮在云端之城市。在《星球大战五：帝国大击战》中，韩索驾驶“千年隼号”前往云城，希望他的朋友兰多·卡里西安安能帮助修理他们受损的超速驱动器。在原始《星际迷航》剧集“云中人”中，“企业号”的船员访问了一个名为\
  \ Stratos 的悬浮在云中的城市。\n\n巧合吗？也许吧。或者吉恩·罗登伯和乔治·卢斯早知道未来在云端。无论如何，计算机网络的未来正迅速向云端发展。具体来说就是云计算。本章介绍了云计算。你将发现它是什么、采用它的优缺点，以及主要的云供应商提供哪些服务。\n\
  \n## 介绍云计算\n\n云计算的基本思想是将一个或多个网络计算资源外包给互联网。“云”代表了处理常见任务的新方法。以下是云与传统方式不同的几个例子：\n\n\
  *   **电子邮件服务**\n    *   *传统：* 电子邮件服务通过本地服务器提供。然后你的客户端可以使用 `Outlook` 连接到服务器发送和接收电子邮件。\n\
  \    *   *云：* 与互联网提供商签约，例如 `Gmail` 或微软的 `Exchange Online`。云电子邮件服务通常收取较低的每月用户费用，因此你为电子邮件支付的金额完全取决于邮件用户的数量。\n\
  \n*   **磁盘存储**\n    *   *传统：* 设置一个具有足够磁盘空间的本地文件服务器。\n    *   *云：* 注册互联网服务，并将数据存储在互联网上。云存储通常按每月每\
  \ GB 计费，因此你只需为你使用的存储空间付费。云存储的磁盘容量本质上是无限的。\n\n*   **会计服务**\n    *   *传统：* 购买昂贵的会计软件并将其安装在本地服务器计算机上。\n\
  \    *   *云：* 注册基于 Web 的会计服务。然后你所有的会计数据都保存并管理在提供者的服务器上，而不是你的服务器上。\n\n*   **虚拟服务器**\n\
  \    *   *传统：* 购买昂贵的计算机，安装虚拟平台（如 VMware 的 `ESXi` 或微软的 `Hyper-V`），并创建虚拟机。\n    *\
  \   *云：* 注册托管在云供应商服务器上的虚拟机。跳过购买昂贵计算机和安装 `ESXi` 或 `Hyper-V` 的步骤。\n\n## 查看云计算的优势\n\
  \n云计算是一种不同的——在许多方面都是更好的——网络方法。以下是转向云网络的一些几个主要优势：\n\n*   **高成本效益：** 云计算通常比传统计算更便宜。考虑一个典型的文件服务器应用：为了实现文件服务器，首先必须购买一台具有足够磁盘空间的文件服务器计算机以满足用户需求，这相当于\
  \ 1TB 的磁盘存储。你希望数据存储越可靠越好，因此你购买了一台服务器级计算机和完全冗余的硬盘驱动器。为了讨论，假设服务器的总价格（包括其硬盘驱动器、操作系统许可和设置的人工成本）约为\
  \ 10,000 美元。假设服务器可以使用四年，每年每年约为 2,500 美元。\n\n    如果你从云文件共享服务获取磁盘存储，预计获得同等容量的存储只需支付该金额的四分之一。\n\
  \n\n\n\n同样的经济性适用于大多数其他云解决方案。例如，云端电子邮件解决方案的成本通常约为每个用户每月 5 美元左右——远低于建立和维护本地 `Microsoft\
  \ Exchange Server` 的成本。\n\n*   **可扩展性**：如果你对文件服务器的存储需求估算错误，导致用户最终需要 20TB 而非是 10TB，会发生什么？对于传统的文件服务器，你必须购买额外的硬盘来容纳额外空间。比你预想的要早，服务器机柜内的空间就会耗尽。然后你将不得不购买外部存储柜。最终，你也会把那个存储柜也填满。\n\
  \n现在假设在你将服务器容量扩展到 20TB 之后，用户的需求又缩减到了 10TB。遗憾的是，你无法退回硬盘来获得退。\n\n![Remember](img/remember.png)\
  \ 使用云计算，你只需为实际使用的容量付费，并且可以在任何需要时添加额外容量。在文件服务器的示例中，你可以向云存储写入任何需要的数据。每个月，系统根据你的实际用量计费。因此，你不需要购买和安装额外的硬盘来增加存储容量。\n\
  \n*   **可靠性**：特别是对于小型企业来说，云服务比内部服务要可靠得多。就在我写这一章的一周前，我朋友用于备份公司数据的带驱动器故障了。结果是在带驱动器维修期间，他有三天无法备份数据。如果他使用的是云备份，他就可以立即恢复数据，而不会在那三天内没有备份可用。\n\
  \n云服务可靠性提高的原因纯粹是规模问题。大多数小企业无法负担为了使计算机业务运行尽可能可靠而所需的冗余费用。我朋友的公司买不起两台带驱动器，以便在主驱动器故障时有一台备用设备。\n\
  \n相比之下，云服务通常由 `Amazon`、`Google`、`Microsoft` 和 `IBM` 等大公司提供。这些公司拥有尖端的数据中心，为云服务提供了多重冗余。云存储可能保留在多个服务器上，这样如果某个服务器故障，其他服务器就可以接管负载。在某些情况下，这些服务器位于国家不同地区的不同数据中心。因此，即使发生关闭整个数据系统的灾难，你的数据仍然可用。\n\
  \n*   **无忧无虑**：面对吧，IT 可能会是一件麻烦。通过云服务，你基本上将复杂的系统维护工作外包了，例如软件升级、补丁、硬件维护、备份等。你只需使用服务，而由他人负责确保这些服务正常运行。\n\
  \n*   **全球可用**：云服务的最大优点之一是，只要你有互联网连接，就可以在任何地方使用它们。假设你在五个城市都有办公室。使用传统的计算方式，每个办公室都需要自己的服务器，而且你必须仔细设计系统，允许每个办公室的用户访问共享数据。\n\
  \n使用云计算，每个办公室只需连接到互联网即可访问云应用程序。如果你的用户是移动办公的，云端应用程序也非常棒，因为他们可以在任何能找到互联网连接的地方访问这些应用程序。\n\
  \n## 详述云计算的缺点\n\n尽管云计算相比传统技术有许多优势，但它并非没有缺点。以下是采用云计算时面临的一些主要障碍：\n\n*   **固化的应用程序**：你的组织可能依赖于并不特别适合云计算的固化应用程序——或者至少在迁移到云端时需要大量的转换工作。例如，你可能使用一个依赖本地文件存储的会计系统。\n\
  \n幸运的是，许多云提供商都提供此类迁移帮助。在许多情况下，你在本地运行的相同应用程序可以在云端运行，因此无需转换。\n\n*   **互联网连接速度**：云计算将你的网络大部分负担转移到了互联网连接上。你的用户以前通过千兆比特速度连接在本地文件服务器上访问数据；现在他们必须通过带宽较慢的互联网连接访问数据。\n\
  \n![Remember](img/remember.png) 尽管你可以将连接升级到更高的速度，但这样做需要花费资金——这笔钱很可能会抵消你通过迁移到云端所节省的资金。\n\
  \n*   **互联网连接可靠性**：你访问的云资源可能拥有世界上所有的冗余，但如果你的用户通过单一互联网连接访问云，那么该连接就会变成一个关键漏洞。一旦它故障，任何依赖于云的应用程序将无法使用。如果这些应用程序是任务关键型的，业务将陷入停滞，直到连接恢复。\n\
  \n这里是缓解这种风险的两种方法：\n\n    *   确保你使用的是企业级互联网连接。企业级连接更昂贵，但提供的比消费级连接好得多的容错和维修服务。\n \
  \   *   如果可以，请提供冗余连接。这样，如果一个连接故障，流量可以通过备用连接重新路由。\n\n*   **安全威胁**：你可以断定，全世界的黑客都在不断寻找突破所有主要云提供商安全边界的方法。当他们得手时，你的数据可能会被暴露。\n\
  \n缓解这种威胁的最佳方法是确保执行了强密码策略，并确保你的数据已进行备份。\n\n## 检查三种基本的云服务\n\n通过云可以提供三种不同的服务：应用程序、平台和服务（基础设施）。接下来的段落将更详细地描述这三类云服务。\n\
  \n### 应用程序\n\n通常被称为 *软件即服务*（SaaS），功能完整的应用程序可以通过云交付。最广为人知的示例之一是 *Google Apps*，它是一个云端办公应用程序套件，旨在直接竞争微软的传统办公应用程序，包括\
  \ `Word`、`Excel`、`PowerPoint`、`Access` 和 `Outlook`。Google Apps 还可以替换用于支持 Microsoft\
  \ Office 的后端软件，包括 `Exchange` 和 `SharePoint`。\n\n当你使用云应用程序时，你不必担心任何通常与在网络上运行应用程序相关的细节，例如部署应用程序以及应用产品升级和软件补丁。云应用程序通常根据运行软件的用户数收取小额的月费，因此成本很低。\n\
  \n此外，作为云应用程序的用户，你不需要担心为运行运行应用程序提供硬件或操作系统平台。应用程序提供商会为你处理这些细节，因此你只需专注于开发应用程序以最好地满足你用户的需求。你的用户可以使用任何带有标准网络浏览器的操作系统来访问应用程序。\n\
  \n### 平台\n\n也被称为 *平台即服务*（PaaS），这类服务是指提供远程虚拟操作系统平台访问的提供商，你可以在该平台上构建自己的应用程序。\n\n\n\
  \n\n\n在最简单的层，PaaS 供应商会为您提供一个完整且功能性的远程虚拟机，该虚拟机已完全配置完成并准备供您部署应用程序。如果您使用网络提供商来托管贵公司的网站，那么您已经在使用\
  \ PaaS 了：大多数网站托管提供商都会提供一个运行良好的 Linux 系统，并完整配置了所有必要的服务器，例如 `Apache` 或 `MySQL`。您只需要在提供商的服务器上构建并部署您的\
  \ Web 应用程序即可。\n\n更复杂的 PaaS 解决方案包含了专用软件，您的自定义应用程序可以调用这些软件来提供数据存储、在线订单处理和信用卡支付等服务。这种类型的\
  \ PaaS 供应商中最著名的例子之一是 Amazon。\n\n![记住](img/remember.png) 当您使用 PaaS 时，您负责开发运行在远程平台上的自己的自定义应用程序。而\
  \ PaaS 供应商则负责维护平台本身的细节工作，包括基础操作系统和运行该平台的硬件。\n\n### 基础设施\n\n如果您不想委托维护操作系统和其他平台其他元素的责任，可以使用`基础设施即服务`\
  \ (IaaS)。当您使用 IaaS 时，您购买的是可以通过云访问的原始计算能力。通常，IaaS 为您提供访问远程虚拟机的机会。您可以按照自己的意愿管理和配置该远程机器。\n\
  \n## 公有云与私有云\n\n最常见的云计算形式使用的是所谓的`公有云`——即通过互联网向世界上任何人开放提供的云服务。Google Apps 是公有云服务的绝佳示例。任何可以使用互联网的人都可以访问\
  \ Google Apps 的公有云服务：只需将浏览器指向 [`http://gsuite.google.com`](http://gsuite.google.com/)\
  \ 即可。\n\n公有云就像公用事业一样，任何人都可以按需付费进行订阅。公有云服务的缺点之一是它们本质上是不安全的。当您使用公有云服务时，您是将宝贵的数据委托给了您无法控制的第三方。诚然，您可以使用强密码保护对公有云服务的访问，但如果您的用户名和密码泄露，您的公有云服务可能会被破解，数据也可能被盗。我们偶尔都会听到关于某公司或某公司后门安全性被破坏的新闻。\n\
  \n除了安全性，公共云计算的另一个缺点是它依赖于高速、可靠的互联网连接。您的云服务提供商可能拥有世界上所有的冗余，但如果您的互联网连接中断，您将无法访问您的云服务。如果您的连接很慢，您的云服务也会很慢。\n\
  \n`私有云`模仿了云计算的许多功能，但实现在本地网络内的私有硬件上，因此它不对公众开放。私有云本质上更安全，因为公众无法访问它们。此外，它们仅依赖于私有网络连接，因此不受公共互联网连接的限制。\n\
  \n![提示](img/tip.png) 根据原则，私有云由拥有资源创建和维护自己云服务器的大型组织实施。\n\n云计算领域的一个相对新成员是`混合云`，它结合了公有云和私有云的特点。通常，混合云系统使用一个小型私有云为某些应用程序提供本地访问，并使用公有云提供其他应用程序。您可能在私有云上维护最频繁使用的数据，以便通过本地网络快速访问，并使用公有云存储存档和其他较少使用的数据，因为这些数据对性能的要求没有那么高。\n\
  \n## 介绍一些主要的云提供商\n\n有成百上千甚至数千公司提供云服务。然而，如今的大部分云计算由少数几个提供商提供，将在以下章节中进行描述。\n\n###\
  \ Amazon\n\n到目前为止，全球最大的云服务提供商是 Amazon。Amazon 在 2006 年启动了其云平台——`Amazon Web Services\
  \ (AWS)`。从那时起，已有数十万客户注册。AWS 的最著名用户包括 Netflix、Pinterest 和 Instagram。\n\nAWS 包含以下功能：\n\
  \n*   **Amazon CloudFront:** 一种 PaaS 内容分发系统，旨在向大量用户分发网络内容。\n*   **Amazon Elastic\
  \ Compute Cloud:** 也称为 `Amazon EC2`。一种提供对原始计算能力访问的 IaaS 系统。\n*   **Amazon Simple\
  \ Storage Service:** 也称为 `Amazon S3`。为无限量的数据提供基于 Web 的数据存储。\n*   **Amazon Simple\
  \ Queue Service:** 也称为 `Amazon SQS`。提供一种数据传输系统，允许应用程序向其他应用程序发送消息。SQS 让您能够构建协同工作的的应用程序。\n\
  *   **Amazon Virtual Private Cloud:** 也称为 `Amazon VPC`。使用虚拟私有网络 (VPN) 连接将您的本地网络连接到\
  \ Amazon 的云服务。\n\n### Google\n\nGoogle 也是最大的云服务提供商之一。它的产品包括：\n\n*   **Google Apps:**\
  \ Microsoft Office 的替代品，通过云端提供基本的电子邮件、文字处理、电子表格和数据库功能。Google Apps 对公众免费，甚至可以供小型企业免费使用（多达\
  \ 50 个用户）。对于较大的企业，Google 提供了一个高级版本 `Google Apps for Business`。每用户每月 5 美元，您可以获得额外功能，例如每个用户\
  \ 25GB 的电子邮件数据、存档以及自定义您的帐户策略的高级选项。\n*   **Google Cloud Connect:** 一种云解决方案，让您直接从\
  \ Microsoft Office 内部处理 Google 云数据工作。\n*   **Google App Engine:** 一种 PaaS 接口，允许您开发与\
  \ Google 云服务工作的自己的应用程序。\n*   **Google Cloud Print:** 允许您将打印机连接到云端，以便从任何地方访问它们。\n\
  *   **Google Maps:** 全球信息系统 (GIS)。\n\n### Microsoft\n\nMicrosoft 有自己的云策略，设计目的是为了保护其操作系统和\
  \ Office 应用的核心业务免受 Google Apps 等其他云提供商的竞争。\n\n以下段落总结了 Microsoft 的几项云产品：\n\n*   **Microsoft\
  \ Office 365:** Microsoft Office 的云版本。根据 Microsoft 网站，Office 365 以低廉且可预测的月费用提供“随处访问云端电子邮件、网络会议、文件共享和\
  \ Office Web Apps”。欲需更多信息，请查看 [`www.office365.com`](http://www.office365.com) 。\n\
  *   **Windows Azure:** 一种 PaaS 产品，允许您构建网站、部署运行 Windows Server 或 Linux 的虚拟机，或访问如\
  \ `SQL Server` 等服务器应用程序的云版本。\n*   **Microsoft Business Productivity Suite:** 一种\
  \ SaaS 产品，提供对 Microsoft 最受欢迎的两个力力服务器的云访问：`Microsoft Exchange` 和 `Microsoft SharePoint`。该套件让您可以部署这些服务器，而无需创建和维护自己的本地服务器。\n\
  \n## 进入云端\n\n在您理解了云计算是多么酷之后，您应该做什么来让您的网络迈向云端呢？让我提供一些建议吧：\n\n\n\n\n\n-   **不要依赖糟糕的网络连接。**\
  \ 最重要的一点，在你将任何网络操作迁移到云端之前，如果你决定采用云计算，请确保你*没有*依赖于消费级的互联网连接。消费级网络连接可能很快，但一旦发生故障，谁也知道你要等多久才能修复连接。你绝对不想在电缆公司考虑派人去你现场时还要上几个小时甚至好几天。相反，请花钱购买高速的企业级连接，这种连接可以随着你对其依赖程度的增加而扩展。\n\
  \n-   **评估你可能已经在云端运行的应用程序。** 如果你使用 `Gmail` 而不是 `Exchange` 来邮件，恭喜你！你已经拥抱了云。其他可能已经在使用的云服务示例还包括远程\
  \ Web 或 `FTP` 托管、`Dropbox` 或其他文件共享服务、`Carbonite` 或其他在线备份服务、薪资服务等。\n\n-   **不要一次性迁移到云端。**\
  \ 从识别一个适合云端的应用程序开始。如果你的工程公司在项目结束时会归档项目，并希望将它们从主文件服务器移出但保持随时可用，请考虑云端文件存储服务。\n\n-\
  \   **选择声誉良好的。** `Google`、`Amazon` 和 `Microsoft` 都是在云计算领域拥有良好记录的大型公司。许多其他大型老牌公司也提供云服务。不要把你公司的未来寄托在一个六个月前还不存在的公司身上。\n\
  \n-   **研究、研究、再研究。** 深入研究网络，买几本书。由 Judith Hurwitz、Marcia Kaufman、Dr. Fern Halper\
  \ 和 Daniel Kirsch 编写的《混合云入门》（*Hybrid Cloud For Dummies*，Wiley 出版）是一个很好的起点。\n\n#\
  \ 第 26 章\n\n# 迈向混合\n\n### 本章内容\n\n-   探讨混合云的基础\n-   研究混合云的好处\n-   处理身份管理\n-   创建混合云基础设施\n\
  \n当我们大多数人听到*混合*（hybrid）这个词时，我们会想到 `丰田 Prius` 和其他类似的混合动力汽车。这些汽车将传统的汽油内燃机与由可充电电池驱动的高效电动机结合，生产出一种比纯汽油车和纯电动汽车更好的车辆：混合动力汽车燃油效率远高于纯汽油车，续航能力也远高于纯电动汽车。\n\
  \n混合动力汽车于 1999 年上市。几十年后，“混合”一词在计算领域也变得普通。如今，许多各种大小的公司都在推崇混合云作为其主要的 IT 倡议之一。在本章中，我将解释这到底是什么意思，以及为什么这是一个好主意。我还会告诉你如何尝试进入混合云领域。\n\
  \n## 什么是混合云？\n\n如今大多数组织都有两个不同的 IT 引擎。传统的 IT 引擎基于服务器计算机、存储设备和网络组件，它们被整齐地安装在机架上并锁在闭门之后，由高薪专业人员进行操作和维护。\n\
  \n另一个引擎是云端。[第 25 章] 解释了云如何通过将关键工作负载从本地计算机移出，彻底改变 IT 世界，消除了为了支持这些应用程序而在硬件和人员上大量投入的需求。\n\
  \n然而，云引擎的一个关键问题是，它的工作方式与传统的 IT 引擎非常不同。你的云引擎并不是你拥有完全控制权的物理计算机设备，而是由你订阅服务的众多云提供商组成的。你无法直接控制你习惯管理的任何细节。\n\
  \n例如，云提供商负责传统的 IT 细节，如购买和维护硬件、保持系统补丁和调优、备份数据等。你不需要担心他们使用什么种的服务器、安装了什么操作系统、依赖哪种虚拟化平台，或信任哪种备份技术。云提供商会为你处理所有这些。\n\
  \n你只需要做的就是根据你的需求定制云服务。你通常通过使用基于 Web 的管理控制台来设置用户账户、配置服务等。遗憾的是，没有两个云提供商使用相同的管理控制台。每家都有完全不同的界面，并且需要不同的技能来管理。\n\
  \n想象一下，如果你的混合动力汽车既有汽油引擎又有电动机，但你必须为操作每个引擎拥有不同的驾照。或者如果两个引擎有独立的运行控制——根据开启了哪个引擎，使用不同的加速踏板、方向盘和刹车踏板。或者你必须根据哪个引擎发出了异响将车辆送到不同的修理工那里。或者如果交通规则根据使用的引擎不同而不同——电动模式时限速是每小时\
  \ 45 英里，汽油模式时是 60 英里，或者你使用汽油引擎时在道路右侧行驶，使用电动机时在左侧行驶。\n\n这就是大多数组织对他们的 IT 引擎所忍受的状况。而这正是混合云意图解决的问题。混合云试图将本地\
  \ IT 引擎与云引擎统一起来，使它们同步运行。\n\n[图 26-1] 显示了我所说的。在这里，你可以看到 [第 25 章] 中描述的三类云服务——应用程序（软件即服务，或\
  \ `SaaS`）、基础设施（基础设施即服务，或 `IaaS`）和平台（平台即服务，或 `PaaS`）都与本地 IT 基础设施集成，创建一个名为混合云的协同生态系统。\n\
  \n![旨在统一本地 IT 与云服务的混合云示意图。](img/9781119648505-fg2601.png)\n\n[图 26-1：] 混合云试图将本地\
  \ IT 与云服务统一。\n\n这比看起来要困难得多。但最近的趋势使我们更接近了能够在本地 IT 和基于云 IT 之间无缝移动的现实。\n\n## 混合云的好处是什么？\n\
  \n将传统的 IT 引擎和云引擎拉近距离为你的 IT 组织提供了许多益处。我在接下来的章节中涵盖了其中最重要的几点。\n\n### 弹性\n\n随着年龄的增长，我发现买带松紧带的裤子非常有帮助。*弹性*（Elasticity）在\
  \ IT 系统中也是一个宝贵的特性。弹性简单来说意味着你的 IT 基础设施可以扩展以适应增长，并在你的 IT “减重”时可以缩小。例如，如果你推出了一条新的业务线或开了一家分公司，你的\
  \ IT 应该能够扩展以适应新工作。但如果你卖掉了该业务或关闭了办公室，你应该能够收缩。\n\n云服务本质上是弹性的。例如，基于云的电子邮件服务通常按用户每月收取一定费用。如果你增加了\
  \ 50 个用户，你就付得更多；如果你失去了 50 个用户，你就付得更。\n\n通过混合云，你可以将这种弹性扩展到你的本地 IT。理想情况下，一个经历突然增长的本地应用程序在需要时可以直接扩展到云端以适应增长，这样你就不需要等待额外的本地存储或其他资源可用。\n\
  \n### 灵活性\n\n\n\n\n\n面对需要部署到网络中的新应用程序，你应该将其部署在云端还是本地 IT 系统上？有了了混合云，这种选择并不是不可定论的：你可以先部署到云端，如果需要更好的性能或更多控制权，再将其移动到本地。或者，你也可以先部署在本地，当你的本地资源不再够用或者发现管理底层硬件负担过重时，再迁移到云端。\n\
  \n### 敏捷性\n\n`Agility`是指快速部署新应用程序的能力，使您的公司能够立即从新应用中受益，而无需等待传统的 IT 经过数月或数年的流程。混合云允许您快速地将新应用程序部署到云端，同时为它们最终迁移到本地平台做好计划。\n\
  \n### 创新\n\n对于小型公司来说，许多新技术实施成本高昂。例如，人工智能和机器学习是增长的趋势，可以显著改进您的业务流程并为公司带来竞争优势。但大多数公司无法负担花费多年来开发这些技术。然而，云提供商可以。而且混合云可以更轻松地将这些技术集成到您的系统中。\n\
  \n### 运营效率\n\n如果本地 IT 引擎和云引擎使用完全不同的工具进行管理，且可能由完全不同的团队负责，那么您正在付费用两种不同的方式做同样的事情。如果您尽可能地整合本地和云\
  \ IT 的管理，您的组织将变得精简得多。\n\n## 集成身份\n\n我所说的`identity,`是指用于对系统用户进行身份验证和授权的各种系统。当你开始使用云应用程序时，在每个应用程序上管理身份将成为一个问题。简而言之，你订阅的几乎每一个云服务都有其自己的身份管理系统，在其中你设置用户并分配权限。每个服务将有自己的密码管理系统，对长度和复杂度有不同的要求。\n\
  \n所有这些身份管理系统都是在你已拥有的 `Active Directory` 之外的额外系统。\n\n如果能将它们统一起来，使你所有的云服务都与现有的 `Active\
  \ Directory` 账户集成，并且通过单一管理控制台管理账户并授权对云服务的访问，那不是很好吗？\n\n好消息是你`可以`这样做——或者至少可以接近。采取实现这一目标的步骤将极大简化你的本地\
  \ IT 与云 IT 之间的关系。\n\n### Azure Active Directory\n\n统一身份管理的一个显而易见的起点是 `Azure Active\
  \ Directory` (AAD)。`AAD` 是微软的 `Active Directory` 云端版本。单 `AAD` 无法解决你所有的云身份管理问题。但它能让你将\
  \ `Office 365` 身份与 `Active Directory` 集成，而且如果你选择使用 Azure 作为云平台，它会将你的本地 `Active Directory`\
  \ 扩展到 Azure。\n\n`AAD` 以订阅服务的形式出售，四个版本：\n\n- `Free`：包括基本的 `Active Directory` 功能，目录中的对象数量有限（当前限制为五十万，因此免费版可以容纳相当大的目录）。遗憾的是，这个版本的功能非常匮乏——你在标准本地\
  \ `Active Directory` 中熟悉并喜爱的许多功能都需要高级版订阅。\n- `Office 365`：此版本包含在 `Office 365` 订阅中，提供无限的目录大小、免费版的所有基本功能，以及自服务密码管理、登录页的公司定制以及其他一些小功能。\n\
  - `Premium P1`：每用户每月 6 美元，你可以获得额外的功能，例如自定义密码限制、限制对某些计算机和/或某些时间段的访问等。\n- `Premium\
  \ P2`：每用户每月 9 美元，提供更多功能。\n\n这里有一些关于 `AAD` 值得考虑的额外细节：\n\n- 就像云应用程序通常被称为 `SaaS` 一样，`AAD`\
  \ 有时被称为“身份即服务”（IDaaS）。我想有些人就是喜欢在“as a Service”前面加一些东西。\n- `AAD` 可以以混合模式运行，在这种情况下它可以与你现有的本地\
  \ `Active Directory` 服务器协作。或者，你可以以独立模式运行并消除你的本地 `Active Directory` 服务器。\n- 设置 `AAD`\
  \ 并不适合心细脆弱的人或新手。你需要合格系统工程师的帮助才能正确完成工作。\n\n### 单点登录\n\n提高本地 `Active Directory` 与云身份之间连续性的另一种方法是部署单点登录\
  \ (SSO)解决方案。正如其名，`单点登录`是指登录一次身份提供者，并由该身份提供者处理你其他服务的登录。当 SSO 正确实施时，你可以使用 `Active\
  \ Directory` 证书登录一次 Windows。然后，你的 SSO 平台就可以自动登录你全天使用的任何云服务。\n\n一些云服务提供与 `Active\
  \ Directory` 的 SSO 集成。例如，流行的 `RingCentral` 电话系统可以与 `Active Directory` 集成，因此无需单独登录\
  \ `RingCentral`。\n\n但大多数云服务并不提供那种程度的集成。要实现真正的 SSO，你需要使用专门为此目的而设计的第三方工具。其中最著名的之一是\
  \ `Okta` (`www.okta.com`)。通过每用户每月少量的费用，`Okta` 可以管理数千个云应用程序的登录。\n\n图 26-2 显示了一个典型的\
  \ Okta 板，它提供了一键访问各种云服务的权限。这些服务由账户管理员配置，允许用户访问其所需的服务。因此，Okta 允许 IT 控制对云服务的访问，并保护用户免于管理服务账户的任务。\n\
  \n![试图统一本地 IT 与云服务的混合云快照](img/9781119648505-fg2602.png)\n\n图 26-2： 混合云试图统一本地 IT\
  \ 与云服务。\n\n以下是关于如 Okta 等身份管理平台能力的一些值得思考的观点：\n\n- Okta 做的远不止是记住你的用户名和密码——所有现代网络浏览器都有这种能力。`Okta`\
  \ 实际上与云服务提供商合作协商用户身份验证过程，这通常不仅仅是提供用户名和密码。而且与浏览器内置的密码管理不同，`Okta` 为你的整个组织提供了单一管理点。\n\
  - 像 `Okta` 这样的 SSO 平台极大地提高了你的密码安全性，原因很简单：因为 SSO 平台记得用户所有账户的密码，所以用户就不需要记住了。因为用户不需要记住所有这些密码，他们就不会采取把密码写在贴在显示器上的便利贴上的做法。\n\
  - `Okta` 甚至可以设置为让用户永远不需要*知道*自己的密码。这个功能非常有用，因为它允许你的组织保持对其用户账户的控制。例如，当用户离开你的组织时，只需在\
  \ `Okta` 中禁用该用户，即可防止前员工使用你公司付费的云订阅。如果没有像 `Okta` 这样的身份管理器，你必须手动禁用用户访问过的每个云服务的账户。\n\
  \n\n\n\n\n* Okta 可以管理云提供商的密码重置。如果提供商要求定期重置密码，Okta 可以自动完成。同样，用户不需要知道密码。\n\n## 展望混合云虚拟化平台\n\
  \n在本章中我想涵盖的最后一个主题是允许你扩展虚拟化基础设施的平台，使其跨越本地服务器和公有云服务器。这是一个相对新的可能性，但它代表了 IT 基础设施的未来。\n\
  \n几乎所有实现服务器虚拟化的公司都使用了两种产品之一：VMware 的 `vSphere` 或微软的 `Hyper-V`。（你可以在第 10 章中了解更多关于\
  \ `Hyper-V` 的信息。）`vSphere` 和 `Hyper-V` 的本质是相同的：在一台或多个服务器计算机上安装虚拟机程序，使你能够创建运行在主机服务器上的多个虚拟机。这两个平台都提供了类似的功能：\n\
  \n* 可以多个主机服务器组合成单个集群，作为一个整体进行管理。\n* 可以轻松地将单个虚拟机从同一集群中的一台主机移动到另一台主机。\n* 虚拟化平台可以管理连接到主机服务器（存储区域网络，或\
  \ `SAN`）或网络（网络附属存储，或 `NAS`）的存储池。单个虚拟机从这些存储池中分配存储。\n* 虚拟化平台还可以管理虚拟网络，促进虚拟机、主机服务器和外部世界之间的通信。\n\
  \n传统上，运行虚拟化平台所需的所有硬件都位于你的数据中心内。或者，如果你的组织规模很大，硬件可能会分布在多个通过专用网络电路连接的数据中心之间。\n\n现在考虑一下\
  \ IaaS 提供商的出现，他们创建了你可以通过云访问的类似虚拟化平台。两个最广为人知的提供商是亚马逊云服务 (AWS) 和微软 Azure。AWS 使用其自研的虚拟化平台，允许你从各种预配置模板轻松部署新的服务器、存储和网络。Azure\
  \ 执行的本质上是相同的操作，但它的虚拟化平台是基于 `Hyper-V` 的。\n\n微软和 VMware 最近都扩展了它们的虚拟化平台，以无缝采用云基础设施。设置这些内容可能很复杂，但在完成后，你不仅可以包含位于本地的物理服务器和存储，还可以将云服务器和存储包含在单一的统一集群中。这样，你就可以轻松地在本地基础设施和云基础设施之间移动虚拟机和数据。\n\
  \n由于云基础设施的扩展比本地基础设施容易得多，这可以极大地简化大多数 IT 组织面临的增长挑战。如果你的本地存储超出容量，你可以将一些工作负载移动到云基础设施。如果你认为这种增长是永久性的，你可以订购额外的本地存储，并在安装配置完成后，将工作负载移回你的本地基础设施。但如果你认为增长是暂时的，你可以将工作负载留在云端，直到它收缩到之前的大小，然后将其移回。\n\
  \nVMware 这种集成方法被称为 `VMware Cloud`。由于 VMware 本身并不是主要的云提供商，它与其他云提供商协同工作——最引注目的是 AWS。简而言之，你可以使用\
  \ `VMware Cloud` 在 AWS 上配置 VMware 主机、存储和网络，并将这些资源与你的本地 `vSphere` 集群集成。整个过程都从熟悉的\
  \ `vCenter` 控制台进行管理，因此你不需要专门的专家团队来管理云端。\n\n微软的方法与 VMware 几乎相反：微软不是将虚拟化平台扩展到云端，而是将它的\
  \ `Azure IaaS` 平台扩展到你的本地 `Hyper-V` 环境。它的产品被称为 `Azure Stack`。结果是相同的：一个单一的虚拟化平台，将本地和云的服务器、存储和网络集成到一个无缝的环境中。\n\
  \n说实话，构建一个真正的混合云比我在这里描述的要复杂得多，因为在规划和实施真正的混合云环境时，必须考虑到许多细节。安全和隐私显然是巨大的关注点，在很多情况下合规性也是如此（特别是如果你处于医疗或金融行业）。备份和灾难恢复是一个需要解决的大问题。\n\
  \n成本也是一个巨大的关注点。混合云的理念是简化操作，使系统在提供更多功能的同时实际上成本更低。但云合约可能非常复杂。你通常不仅要消耗的 CPU 时钟周期和数据存储量付费，还要为传输的数据量付费，这可能会迅速变成一项大支出。本地\
  \ IT 和云 IT 之间的基本区别在于，你预先支付本地 IT 的费用，然后希望没有过度支出。对于云 IT，你根据实际消耗付费。结果可能是成本大幅降低。但你也可能收到一份意料之外的巨额账单，因此你需要确保彻底理解定价模型，以便预测成本。\n\
  \n## 第 7 部分\n\n# 十诫\n\n在本部分中……\n\n* 学习网络中的不成文规则。\n* 发现你应该避免的常见网络错误。\n* 复习一份你应该保留在柜子里的十件实用网络工具。\n\
  \n# 第 27 章\n\n# 网络十诫\n\n“网络管理员是是有福的，因为他不走在愚者的议会中，不站在疏忽者的道路上，也不坐在新手的位子上，唯独喜爱网络律法，并日夜冥想这律法。”*\n\
  \n—《网络》1:1\n\n于是，这十条网络诫律代代相传，贴在电脑极客的眼睛之间（贴在他们破碎的眼镜架上），并用记号笔写在他们的门柱上。遵守这些诫律，你、你的用户以及你用户的用户将一切顺利。\n\
  \n## 第一诫：你应当虔诚地备份数据\n\n祈祷是件好事，我诚心建议这样做。但在保护网络数据方面，没有什么能比得上周诚地执行良好的备份计划。\n\n确保你遵循\
  \ 3-2-1 规则：至少 `三` 份数据备份，`2` 份位于不同的地点（本地），`1` 份无法从网络访问（离线）。\n\n有关制定无敌备份计划的更多信息，请参阅第\
  \ 22 章。\n\n## 第二诫：你应当保护你的网络免受入侵者\n\n在经典电影《独立日》中，来自外星球的外星人试图毁灭地球上的生命。不幸的是，他们的 IT\
  \ 主管没有保护好网络，因此杰夫·戈德堡能够入侵并拯救世界。\n\n在电影中，杰夫·戈德堡施用他的黑客技能行善。在现实世界中，并不是所有人都是无私。世界上充满了渴望偷取你的数据、以此勒索或彻底破坏它的坏分子。\n\
  \n为了应对这些威胁，请确保采取措施，例如使用安全的防火墙阻止入侵者进入你的网络，使用杀病毒软件以及使用反垃圾软件防止恶意邮件进入用户的信箱。\n\n有关如何保护你的网络的更多信息，请参阅第\
  \ 19 章和第 20 章。\n\n## 第三诫：你应当教导你的用户安全计算之道\n\n\n\n\n世界上所有的安全防护都无法阻止用户点击恶意链接或打开受感染的文件。除了防火墙和安全软件外，培训你的用户掌握网络安全知识至关重要。你的用户是防御网络威胁的最后、也是最好的一防线。\n\
  \n幸运的是，互联网上有许多安全培训机会。只需使用你最喜欢的搜索引擎搜索“网络安全用户培训”（cyber security user training），你就会发现无数可能，有些是免费的，有些是付费的。\n\
  \n网络安全培训的重要部分是定期进行网络钓鱼演练，帮助你的用户识别并忽略网络钓鱼邮件。你也可以找到提供此类服务的机构。只需在网上搜索“钓鱼测试”（phish testing），就能找到大量选项。\n\
  \n更多信息请参阅第 21 章。\n\n## 第四、你应该保持你的网络驱动器纯净并清除旧文件\n\n不要等到你的 `10TB` 网络驱动器剩余可用空间只剩 `1GB`\
  \ 时才考虑清理它。为磁盘维护设定一个常规计划，仔细筛选网络磁盘上的文件和目录，以删除旧的垃圾文件。\n\n## 第五、除非你清楚自己在做什么，否则不要拨动你的网络配置\n\
  \n网络是非常脆弱的。在你的网络建立运行后，除非你清楚自己在做什么，否则不要乱动它。你可能想登录防火墙路由器，看看是否可以调整某些设置来再榨取一点性能。但除非你真的知道自己在做什么，否则请务必小心！（如果你*认为*自己知道做什么，更要格外小心。那些认为自己知道做什么的人往往会自惹麻烦！）\n\
  \n## 第六、你不应该嫉妒邻居的网络\n\n网络嫉妒是网络管理员之间的一种常见疾病。如果你的网络服务器运行 `Windows Server 2016` 状况良好，不要强迫自己立即升级到\
  \ `Windows Server 2019`。除非你有充分的理由，否则克制升级的冲动。\n\n如果你是一个极客控，会更容易受到网络嫉妒的影响。总会有更好的交换机可用，或者某些花哨的网络协议设备让你垂涎。不要向这些低级欲望屈服！抵御魔鬼，魔鬼就会逃离！\n\
  \n## 第七、你不应该在没有适当通知的情况下关闭你的网络\n\n出于礼貌考虑，在关闭网络进行维护之前，请尽量给你的用户足够的提前通知。显然，你无法预测随机故障何时发生。但如果你知道要在周四上午修补服务器，那么提前两天告诉大家这种不便，比提前两分钟告知会获得更多加分。（如果你在周六上午修补服务器，会获得更多加分。）\n\
  \n## 第八、你应该保持充足的备件供应\n\n没有理由你的网络仅仅因为一根电缆断了就要中断两天。始终确保你手里至少有最少量的网络备件。（巧的是，第 29 章\
  \ 建议了你在衣柜里应该保留十件东西。）\n\n## 第九、你不可以在没有许可的情况下盗用邻居的程序\n\n如果克鲁索探长（Inspector Clouseau，出自经典电影《粉红豹》系列电影）突然冲进你的办公室，在你从网络服务器运行\
  \ `Excel` 时越过你的肩膀向看，并问道：“你有*许可证*（liesaunce）吗？”\n\n“*许可证*？”你困惑地回答。\n\n“是的。当然了，要有*许可证*——我就是这么说的！法律明确禁止在没有适当*许可证*的情况下在网络上运行计算机程序。”\n\
  \n你可不想得罪克鲁索探长，对吧？那么请确保你在网络上运行的应用程序拥有正确的许可证。\n\n![提示](img/tip.png) 如果你没见过彼得·塞拉斯饰演的克鲁索探长，请立即观看《粉红豹大归》。\n\
  \n## 第十、你应该在石板上写你的网络配置\n\n网络文档应该被记录下来。如果你跨过了约旦河，如果你不在某处记录，还有谁会对网络一无所知？把一切都写下来，放入一个标记为《网络圣经》的官方活夹中，并像保护圣物一样保护它。\n\
  \n你应该希望的是，2000 年后，当考古学家在你所在的地区探索洞穴时，他们发现了隐藏在罐里的网络文档，并惊叹我们时代的人是如何如此仔细地记录他们的网络配置的。\n\
  \n他们可能会得出荒谬的结论，例如我们会向一个名为 `TCP/IP` 的神供奉烧毁的数据包，并在一种被称为“日志”（logging）的仪式中忏悔我们的罪孽，但这让这一切变得更有趣了。\n\
  \n第 28 章\n\n# 十大网络错误\n\n当你刚刚学会如何避免最尴尬的电脑错误时（例如将你的 `CD drive` 托盘当作杯架），网络就连接到了你的电脑上。现在你拥有一了全新的可以做的蠢事清单，这些错误能让一个普通的电脑极客捧腹大笑，因为对他来说这些太基础了。嗯，那是因为他是一个电脑极客。没人告诉*他*不要折叠软盘——他天生带有一种额外的基因，让他对这类事情有本能的认知。\n\
  \n这里是一些网络新手常犯的常见错误列表。避免这些错误，你就剥夺了当地电脑极客嘲笑你的乐趣。\n\n## 在硬件上节门开支\n\n良好的电脑设备并不便宜。你可以走进当地的电子商店，购买建立一个廉价网络所需的所有物品：电缆、交换机和作为服务器的电脑。但一分一钱。专业级设备的价格贵得多，在商业环境中，它是值得的。\n\
  \n为什么？因为专业级设备的设计考虑了性能、可靠性和集中化管理。\n\n专业级服务器计算机通常在所有关键系统中都包含冗余——双电源、双网络端口、双磁盘控制器，通常还包括双\
  \ CPU 和主板。所以，如果某个组件故障，服务器可以继续运行。\n\n专业交换机通常包含管理功能，让你精确定位网络中的问题、分段网络以获得更好的性能，并监控员工的网络使用情况。\n\
  \n你可能还想通过从交换机直接拉廉价电缆到网络上的每台电脑来降低成本。但从长远来看，这种“守财奴式”的做法实际上可能比最初投资良好的电缆布线更贵。专业安装的电缆基础设施寿命比它所服务的电脑要长得多，而且要可靠得多。\n\
  \n## 在用户登录时关闭或重启服务器计算机\n\n毁掉你网络用户账户最快的方法是在用户登录时关闭服务器计算机。按重置键重启它可能会产生同样灾难性的影响。\n\n\
  如果你的网络设置了专用的文件服务器，你可能不会产生关闭或重启它的冲动。但如果你的网络设置为真正的点对点网络，即每台工作站电脑（包括你自己的）兼作服务器计算机，请小心关闭或重启电脑的这种冲动。此时可能有人正在访问你电脑上的某个文件或打印机。\n\
  \n所以，在关闭或重启服务器计算机之前，请检查是否有人登录。如果是，请礼貌地要求对方注销。\n\n![记住](img/remember.png) 很多问题只需重启受影响的特定即可解决。\n\
  \n## 删除服务器上的重要文件\n\n\n\n\n如果没有网络，你可以对你的电脑做任何你想做的事，你唯一能伤害的是你自己。（有点像旧的“无受害者犯罪”争论。）但是，一旦将你的电脑连接到网络，你就承担了某种责任。你必须学会如何像网络社会中负责任的成员一样生活。\n\
  \n因此，你不能仅仅因为不需要某些文件就从网络服务器上随意删除它们。这些文件可能并不属于你。你也不希望别人删除你的文件，对吧？\n\n对于那些维持网络运行的文件要格外小心。例如，某些版本的\
  \ Windows 使用名为 `wgpo0000` 的文件夹来存放电子邮件。如果你删除了这个文件夹，你的电子邮件就作废了。删除前先看清楚。\n\n![Warning](img/warning.png)\
  \ 当你第一次不小心从网络共享中删除一个重要文件时，你可能会惊讶地发现，回收站对网络文件是无效的。回回收站保存的是你从计算机本地硬盘上删除的文件副本，但它*不会*保存你从网络共享中删除的文件副本。因此，你无法找回不小心从网络上删除的文件。\n\
  \n## 从服务器复制文件、进行修改后再复制回\n\n有时，如果先将文件复制到本地硬盘，再处理网络文件会变得更容易。这样你就可以更高效地从应用程序中访问它，因为你不需要使用网络。这对于必须排序以打印报告的大型数据库文件来说尤其如此。\n\
  \n但是，如果你将文件复制到 PC 的本地硬盘，对文件进行修改，然后将更新后的版本复制回服务器，你就是在自找麻烦。为什么呢？因为其他人可能同时在尝试同样的事情。如果发生这种情况，你们其中一人所做的更新——谁先将文件复制回服务器——就会丢失。\n\
  \n将文件复制到本地驱动器很少是一个好主意。\n\n## 仅仅因为第一次没打印就再次发送到打印机\n\n如果你把东西发送到打印机但什么都没有发生，该怎么办？\n\
  \n*   **正确答案：** 找出为什么什么都没有发生，并*修复它*。\n*   **错误答案：** 再次发送，看看这次是否可行。\n\n    ![Warning](img/warning.png)\
  \ 有些用户会反复发送，希望某某天它就能成功。当别人终于清理了纸卡，看着 30 份相同的信件打印出来时，场面会相当尴尬。或者，由于你选择了错误的打印机，导致你的文档\
  \ 30 份都在另一台打印机上打印出来。\n\n## 假设服务器已安全备份\n\n有些用户产生了一个不幸的假设，网络某种程度上代表了一个高效、有组织且值得信任的官僚机构。这与事实相去甚远。永远假设假设管理员每天都在备份网络数据，即使他们确实在做。去检查他们。某一天进行一次突击检查：戴上白手套闯机房，要求查看备份磁带。检查磁带循环，确保有超过一天的备份。\n\
  \n如果你对网络的备份程序不满意，请亲自负责确保你绝不会丢失任何数据。将你最有价值的文件备份到优盘中。或者购买一个廉价的 2TB 或 4TB 移动硬盘，将你的关键数据备份到其中。\n\
  \n## 在不考虑安全问题的情况下连接互联网\n\n如果你将一台未联网的计算机连接到互联网并感染了病毒或被黑客入侵，只有该电脑会受影响。但如果你将一台联网计算机连接到互联网，整个网络都会变得脆弱。\n\
  \n![Warning](img/warning.png) ***注意：*** 在没有先考虑安全问题的情况下，绝不要将联网计算机连接到互联网：\n\n*   你将如何保护自己和网络免受病毒侵害？\n\
  *   你将如何确保位于文件服务器上的敏感文件不会突然被全世界访问？\n*   你如何如何防止恶意的黑客潜入你的网络，盗取客户文件，并在黑市场上出售客户的信用卡数据？\n\
  \n![Tip](img/tip.png) 有关这些及其他网络安全问题的答案，请参阅第 5 部分 中的章节。\n\n## 未经许可就插无线接入点\n\n与此，在未先获得网络管理员许可的情况下，将任何设备插入你的网络都是大忌。但无线接入点（WAPs）尤为阴险。许多用户落入了营销陷阱，认为无线网络就像将这些设备之一接入网络一样简单。这样，你的无线笔记本电脑或手持设备就可以瞬间加入网络。\n\
  \n问题是，在 WAP 周约四分之一英里内的任何人都可以这样做。因此，你必须采取额外的安全措施，确保黑客无法通过位于停车场或街对面的无线计算机进入你的网络。\n\
  \n你如果认为这不太可能，请再想一遍。互联网上的几个地下网站实际上显示了大城市中未加密无线网络的地图。有关保护无线网络的更多信息，请参阅第 8 章。\n\n##\
  \ 认为网络一掉线你就无法工作\n\n几年前，我意识到没有电我就无法工作。如果发生停电，我发现自己没有电，我甚至无法点蜡烛用铅笔和纸工作，因为我唯一的削卷刀是电动的。\n\
  \n有些人对网络也有同样的态度：他们认为如果网络挂了，他们大可以回家了。事实并非如此。你的电脑连接到网络并不意味着在网络掉线时你就无法工作。确实——如果网络中断，你无法访问任何网络设备。无法无法从网络驱动器获取文件，也无法在网络打印机上打印。但你可以使用电脑进行本地工作——访问本地硬盘上的文件和程序，并在本地打印。\n\
  \n## 服务器空间不足\n\n在服务器上犯的最致命错误之一就是让磁盘空间耗。当你购买一台拥有数百 GB 空间的新服务器时，你可能认为永远不会用完空间。然而，一个挤满了用户的网络消耗数百\
  \ GB 空间的速度快得惊人。\n\n不幸的是，当剩余空间仅剩几个 GB 时，糟糕的事情就开始了。Windows 性能开始变差，甚至变得极其缓慢。错误开始出现。当你最终彻底耗尽空间时，用户们会聚集在你门口要求立即修复：\n\
  \n*   避免这种不幸状况的最好方法是每天监控服务器的剩余磁盘空间。每周跟踪剩余磁盘空间也是个主意，以便寻找趋势。例如，如果你的文件服务器有 500GB 剩余空间，而用户每周消耗大约\
  \ 25GB 空间，你就知道 20 周后可能会用完空间。有了这些知识，你就可以制定计划。\n*   为服务器增加额外的磁盘存储并不总是解决空间不足问题的最佳方案。在购买更多磁盘之前，你应该：\n\
  \    *   寻找可以删除的旧且不需要的文件。\n    *   考虑使用磁盘配额来限制用户消耗网络磁盘空间。\n\n## 总是归咎于网络\n\n\n\n\n\
  \n有些人把网络看作是村子里的傻瓜，每当出现任何问题时，都可以归咎于它。网络确实会产生问题，但它并不是万恶之源源：\n\n*   如果你的显示器只显示大写字母，可能是因为你按了\
  \ `Caps Lock` 键。\n    *不要归怪网络。*\n\n*   如果你把咖啡洒在了键盘上，额吧，那是你的错。\n    *不要归怪网络。*\n\n\
  *   如果你的学步儿童把橡皮泥塞进 `USB` 端口，孩子终究是孩子。\n    *不要归怪网络。*\n\n明白意思了吗？\n\n# 第 29 章：你应该储存在柜子里的十件事\n\
  \n当你第一次为办公室电脑建立网络时，你需要找到一个可以存放网络好东西的柜子。如果你找不到整个柜子，就找一个架子、一个抽屉，或者至少一个结固的纸箱。\n\n以下是建议手头的物品清单。\n\
  \n## 胶带\n\n大力胶带曾帮助*阿波罗* 13 号船员从那次近乎灾难的月球旅行中回来。\n\n你实际上并不需要大力胶带，但它具有象征意义，表明你意识到事情有时会出问题，并且你愿意通过即兴发挥让你的网络恢复运行。\n\
  \n所以，买一卷大力胶带并把它显眼地展示出来。\n\n## 工具\n\n确保你至少有一套基础计算机工具箱，那种在几乎任何办公用品店都能花 15 美元买到的种类。至少，你需要一套好的螺丝刀，加上剪线钳、剥线钳和用于组装\
  \ `RJ-45` 连接器的压接器。\n\n## 跳线\n\n手中准备充足的跳线。你会经常用到它们：当你把用户从一个办公室移动到另一个时，当你向网络中添加电脑时，或者当你需要重新整理配线架时（假设你使用配线架布线网络）。\n\
  \n购买跳线时，买不同长度和颜色的。快速让配线架变得混乱的一个好方法是在可以用 3 英尺线缆就能解决问题的地方使用 15 英尺线缆。多种颜色可以帮助你理清一大堆电缆。\n\
  \n![提示](img/tip.png) 你购买跳线的最后一个地方应该是那些大型办公用品店或消费电子产品商店。相反，去网上买吧。在连锁店卖 15 或 20 美元一条的线缆，在网上只需\
  \ 3 或 4 美元。\n\n## 电缆扎带和魔术贴\n\n`Cable ties` ——那些你绕在一组电缆周围并拉紧收紧的小塑料扎带——对于保持你的网络电缆整洁有序大有帮助。你可以在大型家居建材商店购买\
  \ 1000 条装的大包。\n\n比电缆扎带更好的是卷装 `Velcro`，你可以将其剪成合适的长度来整齐地捆扎电缆。我更倾向于使用魔术贴而不是扎带，因为魔术贴是可以重复使用的。要拆掉扎带，必须切断它。\n\
  \n## 奶油角 (Twinkies)\n\n如果密封在小小的独立包装中，奶油馅蛋糕可以保存多年。事实上，它们的保质期可能比网络本身还要长。你可以把它们留给未来的网络极客，确保后代能够获得持续的网络支持。\n\
  \n2012 年 11 月，全世界的计算机极客面临着比玛雅历终结更具威胁的危机：Hostess 公司和奶油角蛋糕可能停产。幸运的是，神灵干预了，奶油角被救了，从而确保了全球计算机网络的持续运行。\n\
  \n## 备件\n\n准备一些用户电脑上最经常损坏的零件，这样在需要时就不必订购备件。我通常手头保留以下：\n\n*   电源\n*   显示器\n*   键盘\n\
  *   鼠标\n*   备用硬盘\n*   UPS 以及备用电池\n*   内存\n*   视频线\n*   声卡\n*   网卡\n*   机箱风扇\n\n\
  如果你有足够的用户量支持，我建议你也预留一或多台备用电脑，这样如果网络中的某一台电脑坏了，你可以迅速更换为备用。\n\n## 廉价网络交换机\n\n准备几个廉价（约\
  \ 20 美元）四口或八口网络交换机。你不想将它们用于主网络基础设施，但当你需要在某处添加电脑或打印机，而没有可用的网络插口时，它们确实非常有用。例如，假设你的某个用户短期内需要第二台电脑，但用户办公室只有一个网络插口。与其给用户办公室拉一根新线，不如将廉价交换机插在现有插口上，然后将两台电脑都插在交换机上。\n\
  \n## 石碑上的网络完整文档\n\n我在书中多次提到编写网络文档的重要性。不要花几个小时记录你的网络，然后把文档藏在办公桌后面的一堆旧杂志下面。将文件夹和其他网络用品一起放在柜子子里，这样你和所有人就一直知道去哪里找它。并将构成网络网络文件夹的\
  \ `Word`、`Excel`、`Visio` 或其他文档的备份副本保存在防火箱内或另一个地点。\n\n![警告](img/warning.png) 不过，你千万不要敢把密码刻在网络文档里。竟然都想这种事，真为你感到耻！\n\
  \n![提示](img/tip.png) 如果你决定将网络文档刻在真正的石板上，请考虑使用`砂岩`。它美观、廉价且容易更新（只需擦掉旧信息并刻上新信息）。但请记住，`砂岩`会被洒掉的无糖可乐侵蚀。哦，还要确保把它储存在加固的架子上。\n\
  \n## 网络手册和光盘\n\n在奥兹国，网络稻草常见的哀叹是：“如果我有一本手册就好了。”确实，手册可能不是普利策奖的竞争者，但并不意味着你也应该把它扔进垃圾填埋场。\n\
  \n![记住](img/remember.png) 将你在网络上使用的所有软件的手册和光盘放在它们该去的地方——放在和其他网络工具和器放在一起的柜子里。\n\n\
  ## 本书的十拷贝\n\n显然，你希望手头有足够的书可以分发给所有的网络用户。他们知道得越多，就越少打扰你。\n\n天哪，10 份可能不够——20 份可能更接近你的需求。\n\
