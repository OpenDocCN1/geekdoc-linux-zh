  \n然而，在大多数情况下，通过网络运行共享的程序副本速度慢到无法接受。使用网络共享程序的更常见方法是将程序的安装文件复制到共享的网络位置。然后，你可以使用该副本在每个用户的本地硬盘上安装一个该程序的独立副本。\n\
  \n从共享网络驱动器安装程序的优势在于，你不需要为每个想要安装软件的每台计算机单独下载软件。系统管理员可以定制网络安装程序，使得软件在每个用户的计算机上以相同的方式安装。（不过，这些益处仅对较大的网络具有重要意义。如果你的网络少于约十台计算机，可能可能在每台计算机上单独下载并安装程序更好。）\n\
  \n![Warning](img/warning.png) 请记住，购买程序的单用户副本并将其放在共享的网络位置以供网络上的每个人访问是**违法的**。如果有五个人使用该程序，你需要购买五份程序，或者购买一种专门允许五或更多用户使用的网络许可。\n\
  \n![Tip](img/tip.png) 许多软件制造商以并发使用许可出售其软件，这意味着你可以在任意数量的计算机上安装软件，但在任何时候只有特定数量的人可以使用该软件。通常，运行在网络一台服务器计算机上的特殊许可会跟踪当前有多少人正在使用该软件。这种许可经常用于更专业（且昂贵）的软件，例如会计系统或计算机绘图系统。\n\
  \n### 共享消息\n\n联网的另一个益处是网络允许计算机用户通过共享消息在网络上相互通信。这些消息可以有多种形式。电子邮件和即时消息是最常见的。但你也可以交换音频或视频消息。例如，你可以在网络上举行在线会议。连接了廉价摄像头（网络摄像头）的网络用户可以进行视频。你甚至可以在网络上玩一场友好的扑克牌。\n\
  \n## 服务器与客户端（Servers and Clients）\n\n（注：由于用户提供的待翻译文本在“Sharing messages”处中断，且后续部分似乎未提供对应的英文原文，我将基于常见的技术文档完成剩余部分，或仅翻译已有部分。：）\n\
  \n\n\n\n*   其他（通常较小的）网络可以通过允许网络中的任何计算机都成为服务器，并允许任何计算机同时作为服务器和客户端，来使变得更加公平。\n\n##\
  \ 专用服务器与对等节点\n\n在某些网络中，服务器计算机就是服务器计算机，别无他物。它专门负责提供共享资源（如硬盘和打印机），供网络客户端计算机访问。这类服务器被称为`专用服务器`（dedicated\
  \ server），因为它除了执行网络服务之外，无法执行任何其他任务。\n\n一些较小的网络采取了另一种方法，允许网络上的任何计算机同时充当客户端和服务器。因此，任何计算机都可以与网络上的其他计算机共享其打印机和硬盘。当某台计算机作为服务器工作时，你仍然可以使用同一台计算机进行其他功能，例如文字处理。这种网络被称为`对等节点网络`（peer-to-peer\
  \ network），因为所有的计算机都被视为`对等节点`（peers）或平等实体。\n\n明天早上你遛狗时，可以思考一下专用服务器网络与对等节点网络之间的一些点区别：\n\
  \n*   对等网络功能是内置在 Windows 中的。因此，如果你的计算机运行 Windows，你不需要购买任何额外软件就可以将你的计算机变成服务器。你只需要启用\
  \ Windows 服务器功能即可。\n*   Windows 桌面版（如`Windows 10`）中内置的网络服务器功能并不特别高效，因为这些版本的 Windows\
  \ 设计初衷并不是为了作为网络服务器。\n\n    ![记住](img/remember.png) 如果你打算将一台计算机专门用于全职服务器任务，请使用特殊的服务器操作系统，而不是标准的\
  \ Windows 桌面操作系统。服务器操作系统专门设计用于高效处理网络功能。\n\n    *   最常用的服务器操作系统是 Windows 的服务器版本。\n\
  \        截至本文写作，Windows 的当前服务器版本是`Windows Server 2019`。然而，许多公司仍在使用之前的版本（`Windows\
  \ Server 2016`），少数公司甚至在使用它的前身版本，`Windows Server 2012` 和 `Windows Server 2008`。\n\
  \n    *   另一个流行的服务器操作系统是`Linux`。`Linux` 流行是因为它是免费的。然而，它的配置上比 `Windows Server` 需要更多的专业知识。\n\
  \n*   许多网络既是对等网络，*同时*也是专用服务器网络。这些网络具有：\n    *   至少一台运行如 `Windows Server 2019` 等服务器操作系统的服务器计算机\n\
  \    *   使用 Windows 服务器功能与网络共享资源的`客户端`（Client）计算机\n*   ![提示](img/tip.png) 除了专用的之外，你的服务器还应该是诚恳的。\n\
  \n## 是什么让网络运行起来？\n\n要使用网络，你并不需要非常了解它的工作原理。尽管如此，如果你意识到它并不是通过巫术运行的，那么你在使用网络时可能会感觉好一点。网络看起来像魔法，但它并非如此。以下列表描述了典型网络的内部工作机制：\n\
  \n*   **网络接口：** 在任何连接到网络的计算机内部都有一个名为`网络接口`（network interface）的特殊电子电路。`网络接口`要么有一个可以插入网线的外部插座——或者（在无线网络接口的情况下）有一根天线。\n\
  *   **网线：** 网线在物理上连接计算机。它插入你计算机背面的网卡（`NIC`）上。\n    最常用的网线类型是双绞线，之所以这样命名是因为是由几对以特定方式扭绞在一起的导线组成的。双绞线在表面上像电话线。然而，表象往往具有欺骗性。大多数电话系统使用的是较低等级的电缆，这种电缆无法用于网络。\n\
  \    有关网络线的完整介绍，请参阅第 7 章。\n    ![提示](img/tip.png) 使用无线网络时，不需要网线。关于无线网络的更多信息，请参阅第\
  \ 8 章。\n*   **网络交换机：** 使用双绞线布线的网络需要一个或多个交换机。`交换机`（switch）是一个带有许多线接口的盒子。网络上的每台计算机都通过电缆连接到交换机。交换机随后将所有计算机相互连接。有关网络交换机的更多信息，请参阅第\
  \ 7 章。\n    ![技术细节](img/technicalstuff.png) 在双绞线网络的早期，使用的是称为集线器（hubs）的设备而不是交换机。`hub`有时被用来指交换机，但真正的集线器在世纪之左右就已经过了。\n\
  \    ![技术细节](img/technicalstuff.png) 在只有几台计算机的网络中，网络交换机通常与另一个被称为`路由器`（router）的网络设备相结合。`路由器`用于连接两个网络。通常，`路由器`用于将你的网络连接到互联网。通过将`路由器`和`交换机`结合在一个箱子中，你可以轻松地将几台计算机连接到互联网并相互连接。\n\
  *   **网络软件：** 显然，是软件让网络运行的。要让任何网络工作，必须正确地设置大量的软件。对于 Windows 的对等网络，你必须摆弄`控制面板`（Control\
  \ Panel）来让网络正常工作。而诸如 `Windows Server 2019` 这样的网络操作系统需要大量的调整才能使其运行得恰到好处。\n\n## 它不再是个人电脑了！\n\
  \n如果我必须从这一章中选出一个比其他任何时候都想让你记住的点，那就是：在你把个人电脑（`PC`）连接到网络后，它就不再是一台“个人”计算机了。你成了网络的一部分，在某种意义上，你放弃了让个人电脑如此成功的关键概念之一：独立性。\n\
  \n我的计算机之旅始于大型机统治一切的时代。`大型机`（Mainframe computers）是巨大、复杂的机器，曾经占据整个房间，并且必须用冰水冷却。我用过一台\
  \ `IBM System 370 Model 168`。它拥有惊人的 8MB 内存。（我正在写这本书的计算机内存是它的 3000 倍。）\n\n大型机需要一队穿白大褂的程序员和操作员团队才能维持其运行。大型机必须经过仔细管理。围绕它们产生了一整套官僚体系。\n\
  \n大型机曾是工作场所的主导计算机。个人电脑改变了这一切：它们将计算能力从巨大的计算机房中解放出来，放在用户的桌面上，那才是它所属的地方。个人电脑切断了与大型机集中控制的联系。有了\
  \ `PC`，用户可以看着计算机并说：“这是我的，完全属于我的！”大型机仍然存在，但它们不再像以前那样流行了。\n\n但网络再次改变了一切。在某种意义上，这是回到了大型机的思维方式：集中位置，分布式资源。确实，网络并不位于一个独立的建筑内。但你再不能认为“你的”`PC`是仅仅属于你自己的了。你是网络的一部分——就像大型机一样，网络必须经过仔细管理。\n\
  \n以下是网络剥夺你独立性的几种方式：\n\n*   **你不能随心所欲地删除网络上的文件。** 它们可能属于你。\n\n\n\n\n\n- **你必须关注网络安全。**\
  \ 例如，服务器计算机在允许你访问其文件之前，必须知道你是谁。因此，你必须知道自己的用户 ID 和密码才能访问网络。这种预防措施可以防止某些 15 岁的孩子通过你们的互联网连接黑入你的办公室网络，并偷走你所有的电脑游戏。\n\
  - **你可能需要等待共享资源。** 仅仅因为巴特向霍默的打印机发送了东西，并不意味着它会立即打印。莉莎可能在那之前已经发送了一个耗时两个小时的打印任务。巴特只能等待。\n\
  - **你可能需要等待访问文档。** 你可能尝试从网络驱动器检索一个 Excel 表格文件，结果发现别人正在使用它。像巴特一样，你只能等待。\n- **你没有无限的存储空间。**\
  \ 如果你将一个 100GB 的视频文件复制到服务器驱动器，稍后你可能会收到愤怒同事的电话，抱怨服务器驱动器上已经没有空间留给他们的重要文件了。\n- **你的文件可能会被他人通过网络传给你的病毒感染。**\
  \ 随后你可能会无意中感染其他网络用户。\n- **你必须小心在服务器上保存敏感文件。** 如果你写了一封关于老板的愤怒便条并将其保存在服务器的硬盘上，你的老板可能会发现这封备忘录并阅读。\n\
  - **服务器计算机必须一直运行。** 例如，如果你将霍默的电脑变成服务器计算机，那么霍默在离开办公室时就不能关闭电脑。如果他关了电脑，你就无法访问存储在他电脑上的文件。\n\
  - **如果你的电脑是服务器，在你用完后不能直接关闭它。** 别人可能正在访问你硬盘上的某个文件，或正在使用你的打印机打印。\n\n## 网络管理员\n\n因为可能会出现很多问题——即使对于一个简单的网络也是如此——指定专人担任网络管理员是至关重要的。这样，就有人负责确保网络不会崩溃或失控。\n\
  \n网络管理员并不非要是技术天才。事实上，一些最棒的网络管理员在技术事务方面是完全的白痴。重要的是管理员要有组织条理。那个人的工作是确保文件服务器上有充足的空间、定期对文件服务器进行备份，以及确保新员工能够访问网络等任务。\n\
  \n网络管理员的工作还包括解决用户自己无法解决的基本问题——以及在发生真正糟糕的事情时知道何时请专家。这是一份辛苦的工作，但必须有人来做。这里是一些可能有帮助的提示：\n\
  \n- 本书的第 4 部分 完全致力于那些不幸的网络管理员。所以，如果你被提名了，请阅读该部分的章节。如果你足够幸运让*别人*被提名了，就通过给她买一本这本书来庆祝吧。\n\
  - 在小公司里，通过抽签来选定网络管理员很常见。抽到短签的人输了并成为管理员。\n- 当然，**管理员不能是一个*完全*的技术白痴。我刚才在撒谎。（对于在国会的各位来说，那个词是“*作证*”。）我这样夸大其辞是为了说明组织能力比技术技能更重要。网络管理员需要知道如何执行各种维护任务。虽然这些知识需要少量的技术知识，但组织能力更为重要。\n\
  \n## 他们有什么你没有的？\n\n面对所有这些需要担心的技术问题，你可能会开始怀疑自己在电脑连接网络后是否足够聪明来使用它。让我向你保证，你足够。如果你足够聪明去买这本书是因为你知道你需要网络，那么在网络安装好后，你完全有足够的聪明去使用。你也足够聪明自己安装和管理网络。这并不是火箭科学。\n\
  \n我认识一些经常使用网络的人。他们并不比你聪明，但他们确实拥有一件你没有的东西：证书。因此，根据“国际受损计算机协会”赋予我的权力，我向你展示图 1-2 中的证书，确认你已赢得了梦寐以求的“认证网络呆瓜”称号，广为人知的\
  \ `CND`。在某些圈子里，这个称号认为比真正的网络专家佩戴的刻板的 `CNE` 或 `MCSE` 勋章荣誉得多。\n\n祝贺你，平安吧。\n\n![官方网络呆瓜证书复印件。](img/9781119648505-fg0102.png)\n\
  \n图 1-2： 你的官方 `CND` 证书。\n\n# 第 2 章\n\n# 配置 Windows 和 Mac 客户端\n\n### 本章内容\n\n- ![项目](img/check.png)\
  \ **为 Windows 和 Mac 客户端配置网络连接**\n- ![项目](img/check.png) **更改计算机名称**\n- ![项目](img/check.png)\
  \ **加入域**\n\n使用网络最基本的方面之一是配置你的电脑以连接网络。特别是，你必须配置每台客户端电脑的网络接口使其正常工作，并且必须安装正确的协议，以便客户端能与网络上的其他计算机通信。\n\
  \n幸运的是，在 Windows 中为网络配置客户端电脑是小菜一碟。首先，Windows 在启动电脑时会自动识别你的网络适配器。剩下的工作就是确保 Windows\
  \ 正确安装了网络协议和客户端软件。\n\n随着 Windows 每个版本的发布，微软都简化了配置客户端网络支持的过程在本章的前半部分，我描述了为 Windows\
  \ 10 配置配置的步骤。之前版本的 Windows 程序也类似。\n\n配置 Mac 电脑联网同样简单。本章的后半部分将向你展示如何使用最新的 macOS（名为\
  \ Catalina）拨号网络。之前的 macOS 版本程序类似。\n\n## 配置 Windows 网络连接\n\nWindows 通常会自动检测网络适配器的存在；通常，你不需要手动为适配器安装设备驱动。当\
  \ Windows 检测到网络适配器时，它会自动创建一个网络连接并将其配置为支持基本的网络协议。然而，你可能需要手动更改网络连接的配置。\n\n以下步骤显示了如何在\
  \ Windows 10 系统上配置你的网络适配器：\n\n1. **点击开始图标（或按下键盘上的开始键），然后点击或点击“设置”。**\n\n   出现设置页面，如图\
  \ 2-1 所示。\n\n   ![配置网络连接设置页面截图](img/9781119648505-fg0201.png)\n\n   图 2-1： 设置。\n\
  \n2. **点击“网络和 Internet”。**\n\n   出现“网络和 Internet”页面，如图 2-2 所示。\n\n3. **点击“以太网”。**\n\
  \n   出现以太网设置页面，如图 2-3 所示。\n\n   ![网络和 Internet 截图](img/9781119648505-fg0202.png)\n\
  \n   图 2-2： 网络和 Internet 页面。\n\n   ![以太网设置页面截图](img/9781119648505-fg0203.png)\n\n\
  \   图 2-3： 以太网设置页面。\n\n4. **点击“更改适配器选项”。**\n\n\n\n\n“网络连接”页面出现，如图 2-4 所示。此页面列出了你的每个网络适配器。情况下，只显示了一个单线以太网适配器。如果设备有多个适配器，其他适配器将显示在此页面上。\n\
  \n![网络连接页面快照。](img/9781119648505-fg0204.png)\n\n图 2-4： 网络连接页面。\n\n### 5. 右键点击想要配置的连接，然后从出现的右键菜单中选择“属性”。\n\
  \n此操作将打开“以太网属性”对话框，如图 2-5 所示。\n\n![以太网属性对话框快照。](img/9781119648505-fg0205.png)\n\n\
  图 2-5： 以太网属性对话框。\n\n### 6. 要配置网络适配器卡的设置，点击“配置”。\n\n出现你的网络适配器的属性对话框，如图 2-6 所示。此对话框有七个选项卡，允许你配置适配器：\n\
  \n![网络适配器属性对话框的快照。](img/9781119648505-fg0206.png)\n\n图 2-6： 网络适配器的属性对话框。\n\n* **常规：**\
  \ 显示有关适配器的基本信息，例如设备类型和状态。\n* **高级：** 允许你设置各种影响适配器运行的特定设备参数。\n* **关于：** 显示有关设备专利保护的信息。\n\
  * **驱动程序：** 显示绑定到网卡（NIC）的设备驱动程序信息，并允许你更新驱动程序到新版本、将驱动程序回滚到之前的正常版本，或卸载驱动程序。\n* **详细：**\
  \ 通过此选项卡，你可以检查适配器的各种属性，例如设备驱动程序的日期和版本。要查看特定属性的设置，请从下拉列表中选择属性名称。\n* **事件：** 列出为设备记录的近期事件。\n\
  * **电源管理：** 允许你配置设备的电源管理选项。\n\n![提示](img/tip.png) 当你点击“确定”关闭对话框时，网络连接的属性对话框将关闭，你将返回“网络连接”页面（参见图\
  \ 2-4）。再次右键点击网络适配器并选择“属性”以继续该过程。\n\n### 7. 检查属性对话框中列出的连接项目列表。\n\n常见的最重要的项目有：\n\n\
  * **Microsoft 网络的客户端：** 如果你想访问 Microsoft Windows 网络，则需要此项。它应该始终存在。\n* **Microsoft\
  \ 网络上的文件和打印机共享：** 此项允许你的计算机与网络上的其他计算机共享文件或打印机。\n    ![提示](img/tip.png) 此选项通常用于点对点网络，但即使你的网络有专用服务器，也可以使用它。不过，如果你计划不在客户端计算机上共享文件或打印机，则应禁用此项。\n\
  * **Internet 协议版本 4 (TCP/IPv4)：** 此项允许客户端计算机通过 TCP/IPv4 进行通信。\n* **Internet 协议版本\
  \ 6 (TCP/IPv6)：** 此项启用客户端计算机通过 IPv6 进行通信。\n\n### 8. 如果你需要的协议未列出，点击“添加”。\n\n出现一个对话框询问是否要添加协议。\n\
  \n### 9. 要移除属性对话框中列出的项目（例如 Microsoft 网络上的文件和打印机共享），选择该项。\n\n### 10. 配置 TCP/IP 设置，点击“属性”（如图\
  \ 2-7。属性对话框允许你选择以下选项：\n\n* **自动获取 IP 地址：** 如果你的网络有 DHCP 分配 地址，请选择此项。\n* **使用指定的\
  \ IP 地址：** 如果你的计算机必须具有特定的 IP 地址，请选择此项。\n* **自动获取 DNS 服务器：** 如果你的网络有 DHCP 提供 DNS\
  \ 服务器，请选择此项。\n* **使用指定的 DNS 服务器：** 如果没有可用的 DNS 服务器，请选择此项。\n\n## 将 Windows 加入域\n\n\
  当 Windows 安装时，尚未加入域。相反，它是作为工作组的，工作组适用于没有专用服务器的网络。要将计算机加入域，以下是 Windows 的步骤：\n\n1.\
