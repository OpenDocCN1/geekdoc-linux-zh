    # GUI Apps with Fyne


    the list as before, so your item disappears. If you run your app once more, you
    will see that it is empty, but you can add new items and mark them as done as
    often as you like, as shown in Figure 3.


    # Storing Data


    You now have a fully functional app to track your to-do items, but the app will
    forget the items when you exit. To remedy this, you can connect to a database
    or store data in a file. However, Fyne lets you store your data in Preferences,
    a simple key-value store used to easily keep track of user interface state and
    small data storage without worrying about file storage or connection handling.
    You can access this feature using the `Preferences()` method on the `App` type
    created earlier.


    # Loading To-Do Items


    You need to ensure that any existing to-do items are loaded when the app starts.
    To do this, you can simply set up the `todos` variable to be the result of a `loadAll`.
    Immediately before calling `loadUI`, you need to call


    ```

    list = loadTODos(a.Preferences())

    ```


    This call will pass your application preferences to a new `loadTODos` function
    that will return a slice of all stored to-dos.


    # Saving the Data


    Before you have data to parse, you need to save it! To do this, you will use another
    new method, `saveTODos`, which will take the current slice to save and a reference
    to the preferences you will be using:


    ```

    saveTODos(todos, p)

    ```


    Be sure to call this method inside `deleteTODO` and `addToDo` after updating the
    data. The methods that actually do the work in this example are really simple
    – you just concatenate all the items to a single string using a `joiner` constant
    and then split the items out on `load`, as shown in Listing 11.


    # Listing 11: storage.go


    ```

    01  package main

    02

    03  import "fyne.io/fyne/v2"

    04

    05  const joiner = ","

    06

    07  func loadTODos(p fyne.Preferences) []string {

    08      all := p.String("items")

    09      if all == "" {

    10          return []string{}

    11      }

    12      return strings.Split(all, joiner)

    13  }

    14

    15  func saveTODos(items []string, p fyne.Preferences) {

    16      allItems := strings.Join(items, joiner)

    17      p.SetString("items", allItems)

    18  }

    ```


    # Local Storage or Cloud


    Regardless of your operating system or device, Listing 11 will store the data
    for you. However, many apps now want to have centrally stored information on a
    cloud service. The great news is that Fyne supports this too! Using exactly the
    same code from Listing 11, you can have a cloud back end for your data, which
    is set up by simply calling `SetCloudProvider` in your app with a suitable provider
    description. You can find more information about setting this up in a recent Fyne-Conf
    video [3].


    # Packaging and Installing


    Once you have a completed your app, the next step is make it more readily available
    either for yourself or others.


    First, you need to add an icon before installing or sharing the app.


    Although Fyne is a vector graphics-based toolkit, you will need a bitmap image
    for the app icon. For greatest compatibility, create a 1024x1024 PNG file, name
    it `Icon.png`, and save it to the project folder. Once created, this will be used
    as the app icon. The best way to bundle apps is to use the `fyne` command-line
    tool:


    ```

    > go install fyne.io/fyne/v2/cmd/fyne@latest

    ```


    Once installed you can call `fyne` package to set up an app bundle. It will use
    the appropriate format for the current operating system. You can also install
    it at the same time using `fyne install`. This will package the app and put it
    into your standard app location (`/usr/local/bin` for most Linux distributions).


    If you get a “command not found” message, be sure to check that the `Go` binary
    location (usually `~/.go/bin`) is in your `$PATH`. Once complete, the app will
    be available in your favorite app launcher (Figure 4).


    # Sharing with Others


    Before sharing your app, you should consider adding a tutorial for new users.
    This is really easy for a to-do list app because you can just add items to the
    UI when the app has not been used before – `fiss`String with `Property`iss`String`
    `Failback`. The fallback case will be used when the requested preference key has
    not previously been saved. Try the following:


    ![](img/740bd926461af28ed755753238e647a2_45_0.png)'
