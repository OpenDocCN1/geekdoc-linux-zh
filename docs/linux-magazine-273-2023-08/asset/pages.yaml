  md: '# Audio editor


    # Tenacity


    Writing audio software is a difficult and thankless task. Not only is the signal-processing
    code a challenge to program, and the Linux audio stack difficult to interact with,
    creating a user in-terface to help users ignore its complexity is almost impossible.
    It’s why the applications that find a successful approach change very little over
    time. Modern Cu-base still has a lot in common with 1989 Cubase, Ableton hasn’t
    changed since its release in 2001, and on Linux, Ardour re-mains as austere as
    it did in 2005, albeit with a host of mod-ern features and incredibly pow-erful
    levels of control. But it’s Au-dacity that’s perhaps changed the least while remaining
    one of the most popular audio editors on Windows, macOS, and Linux. Audacity is
    used by everyone, from ordinary desktop users converting FLACs to MP3s, through
    amateur musicians mastering their audio for distri-bution on Bandcamp, to profes-sional
    podcasters. It remains a rock-solid application that can record and edit glitch-free
    for hours.


    ![](img/740bd926461af28ed755753238e647a2_85_0.png)


    Tenacity is a fork of Audacity that’s already overhauled its aesthetic and hopes
    to take things further with community involvement.


    Despite this commitment to consistency, Audacity develop-ment has been considered
    too slow by many, especially when the project added, and reneged on, adding opt-out
    telemetry after it was taken over by the Muse Group (the same organization behind
    the brilliant MuseScore). This led to two separate forks of the project, both
    committed to bringing Audacity into the mod-ern age without any telemetry, and
    under the auspices of their respective open source commu-nities. Initiatives such
    as these are difficult to pull off and rarely succeed in supplanting an origi-nal,
    but both projects have sur-vived and have recently merged under the name of the
    most suc-cessful, Tenacity.


    Tenacity promises to be a fresh, modern, more convenient, and more practical audio
    editor than Audacity. The latest release is a great showcase of what progress
    has already been made. The main differences can be seen in the user interface,
    which has been rerathered. Icons, text rendering, and theme colors all look vastly
    improved and are vastly superior to the


    ![](img/740bd926461af28ed755753238e647a2_85_1.png)


    Competition is a good thing, and hopefully Tenacity can keep up with recent Audacity
    developments to include real-time audio effects.


    originals on a dark-themed desk-top. This was a feature that Audac-ity seemed
    reluctant to add, and its own dark mode can be hit-and-miss when it comes to integrating
    with the VU meters, for example, or the waveform rendering. It helps to make Tenacity
    more pleasurable to use, while also helping it feel more modern. It’s also built
    without Au-dacity’s telemetry, requiring neither the build flag to be set nor
    the run-time setting to be unset, ensuring you data isn’t going anywhere. Ev-erything
    else is the best of what Audacity included when the fork occurred at version 3.0.2.
    This means you get decades of devel-opper and user experience and a rock-solid
    audio editor. Audacity is still a great project, of course, and has itself improved
    significantly by finally adding real-time effects pro-cessing, albeit at an early
    stage, and it will be interesting to see whether Tenacity can merge these additions
    into its own code, now significantly diverged from Audaci-ty’s, or whether the
    team will be able to maintain enough momen-tum to create a truly independent project
    with its own unique ap-proach to audio editing. There’s no doubt that there’s
    huge demand for an open source audio editor like this, and there’s potentially
    signifi-cant rewards for the project that succeeds.


    Project Website

    https://github.com/tenacityteam/tenacity'
