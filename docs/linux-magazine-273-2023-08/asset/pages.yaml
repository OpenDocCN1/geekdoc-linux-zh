  md: '# Collecting Points


    The individual player ratings are shown in the YAML file in Listing 1. For the
    purpose of illustration, this model is limited to a total of six players. Each
    entry in players identifies a player by name and specifies their rating in three
    categories with values from 0 to 9: offense, defense, and goalie (i.e., the willingness
    to play as a goalkeeper). If a player does not have a rating in a category, the
    algorithm simply assumes a value of 0.


    For example, Listing 1 rates player tony as a 3 in terms of goalkeeping skills,
    while player manuel has a goalie value of 9 (any matches with the names of existing
    goalkeepers are pure coincidence). Because every team needs a goalkeeper and nobody
    else has goalkeeper qualities, a good algorithm should assign tony and manuel
    to play on different teams. On top of this, the algorithm needs to ensure that
    both teams have roughly equal offensive and defensive players to keep the match
    exciting and open.


    Listing 2 reads the YAML data from the file and then stores it in a data structure
    for the team-building Go binary later. Listing 3 shows the main program that defines
    what happens after you call it from the command line. As a kind of warm-up, Listing
    4 shows a simple algorithm that randomly assigns players to two teams. You can
    see the output from the program in Figure 1. The teams are quite lopsided and
    the algorithm obviously far from perfect, but stay tuned, improvements are coming.


    # Listing 2: data.go


    ```

    ```

