    \ — more so in the context of\na school project.\n\nAs a consequence, Trisquel\
    \ moved\nfrom being a Debian derivative with\nsome non-free packages added to\
    \ a proj-\nected based on Ubuntu with its proprietary\npackages removed. The choice\
    \ was\nmade because of the increasing popular-\nity of Ubuntu (which was released\n\
    roughly at that time), which pointed to a\nneed for a version of Ubuntu without\n\
    proprietary components, and because\nUbuntu’s fixed release cycle would facili-\n\
    tate our work.\n\n> **LM:** What changes to Ubuntu are\n> needed to provide a\
