    with an AUP extension. You can save your project and still export the audio for
    playback on other devices. You will receive a notice stating this is an audio
    file, not a project. Click **OK** to acknowledge the message and continue saving
    your project file.


    ![](img/740bd926461af28ed755753238e647a2_22_0.png)


    **Figure 6: Audacity''s Generate options.**


    ![](img/740bd926461af28ed755753238e647a2_22_1.png)


    **Figure 7: Inserting three seconds of silence at the cursor''s position in a
