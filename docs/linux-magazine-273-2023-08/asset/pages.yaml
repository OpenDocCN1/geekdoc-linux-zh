  md: 'correction below Lens Correction Profile. This works as long as the RAW file
    has a JPEG embedded in it, where the camera has automatically corrected the distortion.
    Otherwise you have to experiment with the slider below Automatic.


    As mentioned, the Lensfun lens-correction profile also automatically removes vignetting
    (that is, circular shadowing), especially in the corners of the image. If you
    want or need to correct this manually, use the Vignetting Correction tool in Transform.
    This tool lets you add a vignette by dragging the Intensity slider to the left.
    In general, vignetting is not as disturbing as chromatic aberrations or distortion;
    quite often, a slight vignette even has an aesthetic effect (Figure 8).


    Finally, export the photo. To do this, click on the floppy-disk icon bottom left.
    The Save dialog box appears. When you get there, select the Target folder, the
    File format (JPEG, PNG, or TIFF), the Bit depth (8- or 16-bit), and the Compression,
    and press OK or \*1\* to confirm.


    adjustments. The application gives you options for finding a perfect color balance
    across the image. As a result, you no longer need to resort to other tools for
    the final editing steps.


    In fact, the software is, in our opinion, one of the best RAW developers currently
    available. RawTherapee is fun to work with, because it runs at an acceptable speed
    even on older hardware and is relatively easy to use. In addition, the results
    can definitely compete with the results of far better-known programs. If the developers
    can find a way to implement 10-bit screen output, RawTherapee is likely to continue
    to thrill its users for many years to come. 1


