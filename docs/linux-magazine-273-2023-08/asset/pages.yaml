  md: "# # LINUX NEWsSTAND\n\n> **Order online:**  \n> https://bit.ly/Linux-Newssstand\n\
    \nLinux Magazine is your guide to the world of Linux. Monthly issues are packed\
    \ with advanced technical articles and tutorials you won't find anywhere else.\
    \ Explore our full catalog of back issues for specific topics or to complete your\
    \ collection.\n\n# **#272/July 2023**  \n**Open Data**\n\n![](img/740bd926461af28ed755753238e647a2_94_0.png)\n\
    \nAs long as governments have kept data, there have been people who have wanted\
    \ to see it and people who have wanted to control it. A new generation of tools,\
    \ policies, and advocates seeks to keep the data free, available, and in accessible\
    \ formats. This month we bring you snapshots from the quest for open data.\n\n\
    **On the DVD:** xubuntu 23.04 Desktop and Fedora 38 Workstation\n\n# **#271/June\
    \ 2023**  \n**Smart Home**\n\n![](img/740bd926461af28ed755753238e647a2_94_1.png)\n\
    \nSmart home solutions will save you time and energy – and, did I mention, you\
    \ can amaze your friends. This month we show you how to take charge of your home\
    \ environment with smart devices and open source automation software.\n\n**On\
    \ the DVD:** SystemRescue 10.0 and Linux Lite 6.4\n\n# **#270/May 2023**  \n**Green\
    \ Coding**\n\n![](img/740bd926461af28ed755753238e647a2_94_2.png)\n\nA sustainable\
    \ world will need more sustainable programming. This month we tell you about some\
    \ FOSS initiatives dedicated to energy efficiency, and we take a close look at\
    \ some green coding techniques in Go.\n\n**On the DVD:** Fedora 37 Workstation\
    \ and TUXEDO OS 2\n\n# **#269/April 2023**  \n**The Fetiverse**\n\n![](img/740bd926461af28ed755753238e647a2_94_3.png)\n\
    \nSocial media tools connect the world, bringing us the latest news and commentary\
    \ from politicians, movie stars, community leaders, and remote friends. But the\
    \ tracking and data mining of the commercial social media platforms has left many\
    \ users searching for a better option. This month we dive down into the alternative\
    \ universe for social media users: the Fetiverse.\n\n**On the DVD:** EndeavourOS\
    \ Cassini 22.12 and Debian 11.6 “bullseye”\n\n# **#268/March 2023**  \n**Data\
    \ Poisoning**\n\n![](img/740bd926461af28ed755753238e647a2_94_4.png)\n\nThink computers\
    \ don’t make mistakes? If you slip some doctored-up training samples into the\
    \ mix, you can get a fancy machine-learning system to think a dog is a cat or\
    \ a 1 is an 8 – and you can trigger this bad behavior through a hidden signal\
    \ no one else will notice.\n\n**On the DVD:** MX Linux 21.3 and Puppy Linux FossaPup\
    \ 9.5\n\n# **#267/February 2023**  \n**Backup**\n\n![](img/740bd926461af28ed755753238e647a2_94_5.png)\n\
    \nIn theory, everyone could use the same backup tool, but the best way to build\
    \ regular and systematic backups into your life is to find a solution that fits\
    \ with your own habits and methods. This month, we preview some popular backup\
    \ apps in the Linux space so you can find one that works for you.\n\n**On the\
    \ DVD:** Linux Mint 21 Cinnamon and Kali Linux 2022.4"
  merge: -1
