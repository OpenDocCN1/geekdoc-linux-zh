    Visual ping


    # ## gping


    If there’s one command that Linux users everywhere have relied on for decades,
    it’s ping. Written in the early 1980s, before almost anyone had Internet access
    and networks were built with coaxial cables, it’s a command that’s followed us
    from simple home networks and dial-up modem connections, through full-fiber symmetric
    broadband, and into the multi-provider cloud-synergized scaling. Ping has survived
    because it performs one simple task perfectly, letting you always know whether
    some other machine on a network is accessible and responding to your requests
    to acknowledge itself. The name “ping” famously refers to the pulse sound of submarine
    sonar when the sound echos off some remote object. Linux ping does the same for
    remote servers, telling you a remote machine is accessible and how long it takes
    for a packet to trek from your machine to the remote machine and back. Ping’s
    output is nothing more than a line of text for each packet showing the destination
    IP and the time the trip took. This leaves a lot of room for improvement, especially
    if you want to track responses over time, and that’s exactly what the super-simple
    and super-useful gping does.


    ![](img/740bd926461af28ed755753238e647a2_82_1.png)


    > > Gping can resolve both IPv4 and IPv6 target addresses and use color to better
    differentiate between response times. when it hits the edge, allowing you to see
    quickly any variation in the remote host’s accessibility from your current machine.
    Best of all, adding more than one target to the command will graph response times
    for each separately on the same graph, so you can better check network performance,
    or keep an eye on your own servers, and it looks awesome when you’re trying to
    impress people with your command-line skills.


    Gping is still a command-line ping but with a graph showing response times for
    one or more servers. At its simplest, it’s a drop-in replacement for ping where,
    instead of the individual line of output for each response, there’s a point drawn
    on a graph. You can change the interval, the amount of buffer, and the horizontal
    and vertical margins, but the graph will also start to scroll


    **Project Website**

    https://github.com/orf/gping'
