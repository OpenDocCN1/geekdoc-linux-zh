    line in the preview. In the sample image, for example, the lamp is a good choice
    for this.


    # Remove Distracting Objects


    To remove distracting objects from an image, enable the spot removal tool in Details.
    As soon as you click on the pencil icon, the mouse cursor turns into a small cross,
    and you can set a point to remove the car fragment. Hold down Ctrl and click on
    the offending element. You will then see two small concentric circles at this
    point. Drag the inner circle outward to make it larger.


    Actually, there are two brushes on top of each other now: The place covering the
    target area is at the bottom, and the one for the source area is at the top. Click
    on the circles and move the upper brush to the place you want to blend the car
    with – in this case, an area of the image to the left of the car (Figure 5). Except
    when removing very small spots, you will typically need to set several points
    to remove the object completely. Finally, use the pencil icon again to hide the
    brush marks or the retouched areas in the preview.


    ![](img/740bd926461af28ed755753238e647a2_90_1.png)


    Figure 5: The new spot removal tool lets users remove distracting objects, provided
    they are not too large.'
