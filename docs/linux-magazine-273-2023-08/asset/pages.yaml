    # Screen controller


    # DDCcontrol


    We looked at a small command-line utility called ddcctl for controlling monitors
    a little while ago. It is an excellent tool for controlling various monitor settings
    exposed over a screen''s I2C bus using the DDC/CI standard. The only problem was
    that ddcutl could be a little too limited, especially when it came to exploring
    a screen''s more experimental or bespoke features and other parameters exposed
    over I2C from your monitor. DDCcontrol is a more comprehensive utility with the
    same goals. It works at a hardware level, rather than through user space, and
    can access manufacture-specific parameters not accessible with ddcctl. Like ddcutl,
    however, it does all this over the I2C bus, and this means there''s always a risk
    you could mess with


    something you can''t revert, so it''s worth being cautious and to only experiment
    on hardware you''re prepared to lose.


    With that out of the way, DDC-control runs from the command line and can first
    conveniently scan your I2C bus for any screens. This is especially helpful because
    getting the wrong device can destroy more than just your monitor. As with dd,
    sending potentially destructive commands to other devices on your system will
    cause problems bigger than the wrong screen brightness, and with the correct device
    now added to the command, you can safely probe your screen for capabilities. This
    risk is mitigated in DDCControl by using a database of known screens and their
    features, allowing you to safely access parameters


    ![](img/740bd926461af28ed755753238e647a2_83_1.png)


    > If the command-line options in DDCcontrol are too much, there''s an excellent
    GUI that provides the same options in a much more pleasant graphical window.


    outside of the MDCS specification. They''re typically options that might otherwise
    require a menu deep-dive or the activation of some engineering mode, such as refresh
    rates and color gamuts. It''s still useful for switching inputs, but you might
    also find you can split the display and change the dark levels of your panel.


    # Project Website


    https://github.com/ddccontrol/ddccontrol


    # Process manager


    # killport


    It''s ugly, it leaves you feeling guilty, and it''s something you really shouldn''t
    do. But it is sometimes necessary to kill a running process. This usually happens
    only after trying everything else. You''ve asked politely using the application''s
    Quit option. You pressed colon and typed q. Even mashing Escape or Ctrl+C hasn''t
    worked, while the process ID in top persists in sucking your compute and memory
    resources. This is where kill, or even kill -9, is your friend. Like a cold-blooded
    assassin, it will destroy a process and purge your system of its memory. But what
    happens when you don''t know which process to kill, or


    don''t know which process is responsible for the process in stasis. Like any good
    assassin, you then need to do a little reconnaissance.


    The top command and its ilk are great at displaying which processes are statted
    and which are using CPU and memory resources, and you can use commands such as
    lsof to list which processes are accessing which files and devices. But processes
    accessing the network or running as a server are harder to track down. These processes
    will use a port for communication, usually waiting on data to arrive or processing
    data as it passes through, and killing processes such as these is precisely why
    the aptly named killport was developed. At its simplest, you run killport with
    a single argument for the port number. For


    ![](img/740bd926461af28ed755753238e647a2_83_2.png)


    > Killport helps you to stop services running on specific ports without having
    to learn the arcane ways of netstat.


    instance, killport 22 would kill the SSH daemon if you''re running it with the
    default configuration. Similarly, you can include more than one port to request
    the massacre of an entire suite of processes and you can specify the signal if
    you want to inflict extra torture before a brute force attack. It''s simple but
    works brilliantly and is a much better option than trying to work out which processes
    are attached to which services through netstat.


    # Project Website


    https://github.com/jkfran/killport'
