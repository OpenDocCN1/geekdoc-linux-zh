- pgno: 71
  md: "When the create function is called, it receives a number of variables to get\
    \ started, including the x and y screen coordinates where the button should be\
    \ drawn, the width and height of the button, and the label text displayed on the\
    \ button. self.rect stores the Pygame rect object, which has functions to check\
    \ whether coordinates are within its bounds, along with several other useful utilities,\
    \ and self.matrixCommands and self.osCommands are the actions taken when the button\
    \ is pressed.\n\nThe addOCommand function takes its associated string argument\
    \ and passes it to the operating system when the button is pressed:\n\n```\n```\n\
    def addOCommand( self , cmd ):\n    self.osCommands.append( cmd )\n```\n```\n\n\
    The addMatrixCommand function is the same, except it transmits to the matrix.\n\
    \nThe render function is responsible for drawing the button on the screen. As\
    \ you have seen before, it creates a surface and fills it – with green in this\
    \ case. If its label is not empty, the program renders the text, calculates how\
    \ to center the text, and adds the text to the button blit. The surface is then\
    \ drawn to the screen with a reference saved to its Pygame rect.\n\n# The Matrix\
    \ Class\n\nThe matrix class draws and manages the interface on the touchscreen.\
    \ As usual, an _init_ function initializes the different components of the interface,\
    \ but this example has a lot of them. The graphics system starts and creates a\
    \ window to draw on. Although the window has a caption, it is generally not\n\n\
    visible because the window is in fullscreen mode.\n\nAs usual, the fonts and serial\
    \ communications are initialized, although pygame.font.SysFont has an empty string\
    \ as its first argument, thus asking Pygame for the default font:\n\n```\n```\n\
    buttonFont = pygamе. font. SysFont( \"\", 32)\nself.matrixPort = matrixSerial()\n\
    ```\n```\n\nThe next line creates self.buttons as a list, which is where each\
    \ of the buttons added to the interface are stored. Most of the rest of the init\
    \ function creates each of the buttons and defines their functionality. They all\
    \ follow the general format:\n\n![](img/740bd926461af28ed755753238e647a2_71_0.png)\n\
    \n```\n```\nbtn = button( self.screen, buttonFont)\nbtn.create( `<x> , <y> , <width>\
    \ , <height> , <label> )`\n\nbtn.addMatrixCommand( chr ( 0x10 ) + chr ( 0xA5 )\
    \ )\n\nbtn.addMatrixCommand( chr ( 0x10 ) + chr ( 0xA00 ) )\n\nbtn.addMatrixCommand(\
    \ chr ( 0x10 ) + chr ( 0xA5 ) )\nbtn.addMatrixCommand( chr ( 0x10 ) + chr ( 0xA1\
    \ ) )\nself.buttons.append( btn )\n```\n```\n\nThe first line creates a button\
    \ and passes in self.screen and buttonFont. The create makes the button, and addMatrixCommand\
    \ adds commands for the video matrix. The command string comes from the matrix\
    \ documentation; it tells you to send the first three hex values to start\n\n\
    Table 1: Buttons and Configurations\n| Line Nos. | Button | Action |\n| :--- |\
    \ :--- | :--- |\n| 57-61 | *Separate Scoreboards* | Each display shows its own\
    \ scoreboard computer. |\n| 63-67 | *Single Scoreboard* | Both screens display\
    \ the first scoreboard computer. |\n| 69-73 | *Both Program* | Both screens display\
    \ the video switcher program output. |\n| 75-78 | *Court A Program* | Switch only\
    \ the court A screen to the video switcher output. |\n| 80-83 | *Court B Program*\
    \ | Switch only the court B screen to the video switcher output. |\n| 85-88 |\
    \ *Court A Scoreboard A* | Switch only the court A screen to its scoreboard computer.\
    \ |\n| 90-93 | *Court B Scoreboard B* | Switch only the court B screen to its\
    \ scoreboard computer. |\n| 95-98 | *CR Gym 1 Action* | View Scoreboard (NUC)\
    \ 1 on the control room monitor. |\n| 100-103 | *CR Gym 2 Action* | View Scoreboard\
    \ (NUC) 2 on the control room monitor. |\n| 105-108 | *CR Program Action* | View\
    \ the video switcher program output on the control room monitor. |\n| 110-113\
    \ | *Record* | Start recording onto an SD card or flash drive. |\n| 115-118 |\
    \ *Stop* | Stop recording. |"
