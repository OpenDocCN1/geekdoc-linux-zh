    Figure 4: The scorekeeper''s scoreboard interface.


    The gameEvent function (lines 20-31) logs any change to the scoreboard. In a future
    version, this function will allow for recovering the scoreboard after a crash
    and exporting a game report. To begin, the code checks whether self.dbGameID (which
    was initialized to None in line 10) is set. If not, then you don''t have a database
    ID, so you just return.


    The self.db.ping convenience function, with an argument of True, checks whether
    the database connection is live and, if not, reconnects automatically in the next
    line. The two lines that follow get the game period and time in seconds. These
    two values pinpoint a unique time within the game.


