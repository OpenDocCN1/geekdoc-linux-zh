    # MakerSpace


    # Scoreboards and Video Routing in Python


    Scorekeeper


    We look at a broadcast video system network that uses Python code to control a
    video router and check out another program that creates a scoreboard. By Scott
    Summer


    Each year my church hosts a basketball league, and several years ago we wanted
    to up-grade to digital scoreboards because our existing classic board was showing
    its age. The first version of this new scoreboard software was written in Python
    [1] and used the GTK toolkit to create the public display. A web page designed
    for an iPad allowed courtside control.


    The gym is a shared space that also hosts a meeting room, party hall, and general-purpose
    room. To support these roles, two NUC small-form-factor computers drive the displays
    (100-inch LCD TVs).


    ![](img/740bd926461af28ed755753238e647a2_63_1.png)


    Windows was necessary to support all of the display software so that PowerPoint
    and ProPresenter would run natively.


    In general, a video system has a hub-and-spoke-style network wherein each device
    has a dedicated home that runs to a video switcher (Figure 1). The video switcher,
    as its name implies, accepts all of the video inputs and allows the operator to
    pick which one should be displayed, overlaid, or otherwise presented to the final
    output (Figure 2).


    Displays are slightly more complicated because they need to select the switched
    video program from the video switcher or the scoreboards at any given time, which
    is accomplished by a matrix router. See the “Matrix Routers” box for more details.


    Think of the router as a grid with sources (video signals — see the “Video Signals
    and Conversions” box) coming in on the left and going out along the bottom. Each
    column (an output or destination) is allowed one connection.


    # Matrix Routers


    In the video world, a router is a really helpful device. It accepts some number
    of video signals in and can send them to any of its destinations. This example
    uses a small four-input by four-output version, but other versions are available
    with up to thousands of I/O points.


    Photo by Johnny Briggs on Unsplash'
