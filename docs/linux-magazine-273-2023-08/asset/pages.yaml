    projects have disagreements over compiler features. I personally feel that the
    Linux kernel is one of the most im- portant software projects (or the actual most
    important software project) in the world, and therefore the compiler exists almost
    as a service tool for Linux. It makes perfect sense to me that any compiler would
    want to adopt the fea- tures desired by the Linux kernel project.


    However, there is an absolutely legiti- mate point on the other side: The com-
    piler is truly the fundamental software, and all other software projects are the
    beneficiaries that need to have some faith that the compiler people will make
    good decisions for everybody.


    The validity of both of these perspec- tives creates an amazing situation when
    kernel and compiler projects find them- selves at odds. As an aside, same sit-
    uation arises when hardware projects and compiler projects find themselves at
    odds. In such situations, the manner in which the debate proceeds, and in which
