- pgno: 69
  md: '# MAKERSPACE   DIY Scoreboard


    Both the clockRun and clockStop functions change the state of self.scoreboard.
    clk. running. If that variable is True, the clock is updated. If it''s False,
    the clock is not updated and is, for all practical applications, paused. clockStop
    also calls self.gameEvent to add an entry that the clock was stopped. Be-cause
    the clock is not team-specific, the second argument is 0. The JavaScript version
    of these functions (lines 80-92) are not shown. Once the Python function is called
    by jQuery, a JavaScript interval is either set or cleared to update the control
    page.


    For the clockSet function, the variable self. scoreboard. clk. seconds keeps track
    of the game time remaining in seconds, which is set to one second more than requested.
    Next, self. scoreboard. clk. tick automatically subtracts one second. Passing
    manual = True forces a reread of the clock even though it is not running. Finally,
    self. scoreboard. clk. clock-String, which is a text representation of the time
    remaining in minutes and sec-onds, returns.


    The JavaScript version can be found on lines 101-116 (not shown). It asks the
    operator what the clock should be set to and will contain either the requested
    time or null if the dialog box was canceled.


    If the value is valid, the request is split into minutes and seconds and then
    converted to seconds. After a new object is created and a seconds parameter added,
    it is posted by jQuery back to the Python function. The control screen then updates
    with the new clock value and the update interval clears so clock requests are
    not made until it starts running again.


    The possession ()  sic]  function (333-339) calls the toggle method of self. score-board.
    possession, which flips which team currently has the ball (indicated by the  and
    > symbols as arrows).


    Lines 336 and 337 check to see which team has possession and add a gameEvent to
    reflect the change. Finally, two strings are returned separated by a colon; each
    string is either a space or one of the  or > symbols. The JavaScript version is
    on lines 71-78 (not shown).


    After posting a possession change by jQuery the return string is split into two
    parts, and the left and right divs are up-dated on the control screen.


    # The Clock Class


    The clock class (lines 341-371) man-ages the game clock for the main graphics
    (scoreboard) display. The __init__ function sets up a few things: self. screen
    is a reference to the screen object passed when creating the clock; self. width
    stores the screen width by calling get _width() on the screen object; self. height
    is set explicitly to define how tall you want the clock to be displayed; and self.
    seconds is the time on the clock, initialized to 6 * 60 seconds to reflect six-minute
    periods.


    Line 347 creates a Pygame surface onto which the clock is drawn, and line 348
    sets up the font. Finally self. running tracks whether the clock is running or
    paused.


    Lines 351-354 calculate the clock values and convert to int; seconds is the mod
    (remainder) of self. seconds / 60. Finally, self. clockString is assembled from
    the calculated values.


    The main loop calls the tick function (lines 356-363) once a second. If time is
    left on the clock and either self. running or manual is set to True, self. seconds
    de-crements by one, and the same calcula-tions as before are repeated to update
    self. clockString. The manual parameter used when setting the clock forces the
    clock to be regenerated immediately rather than waiting for the next auto-matic
    call to tick.


    The render function (lines 365-371) draws the clock. self. clockFont.render takes
    self. clockString and a color table as arguments. The True argument says to anti-alias
    the text as it is drawn. The re-sult is timeSurf, a Pygame surface with the current
    game time drawn onto it.


    After the center point of timeSurf is calculated, self. clockSurf is cleared by
    filling it with black and blitting (copy-ing) timeSurf onto it. Then the surface
    is returned. This copying might seem like an extra step, but here''s what''s happen-ing:
    When self. clockFont. render gener-ates the text, the surface is the exact size
    of the text it generated. For it to fill the space at the dimensions specified
    in __ init __, you have to copy it into the larger surface.


    # The Possession Class


    The possession class (lines 373-406) in-dicates who has the ball at any given
    time. __init__ ( self ) sets up the graphical display, with the initial state
    specified by self. direction (who cur-rently has the ball). A surface is created
    and initialized with self. leftString and self. rightString.


    The convenience function makeSurfaces creates self. leftSurf and self. rightSurf
    possession arrows rendered with  and > symbols.


    When the toggle function (lines 388-396) is called, possession has changed from
    one team to the other. The if checks to see which team currently has possession
    and then updates all of the variables to their opposite states. Note that self.
    leftString and self. right-String either have an arrow or an empty string.


    When everything is ready to be drawn in the render function, self. posSurf is
    cleared by filling it with black (line 399) before generating the label text,
    calculat-ing the center point, and blitting it onto the final surface.


    Lines 404 and 405 make sure the arrow is blitted on the appropriate side of the
    surface. If self. direction is <, the arrow is drawn on the left side of the surface;
    otherwise, it''s drawn on the right before the final surface is returned.


    # Labels and Counters


    The label class (lines 408-430) rep-resents an arbitrarily labeled value on the
    scoreboard. The label and its value can have separate fonts and colors. The Py-game
    surface is created on line 418.


    The render function starts by clearing the surface (fill() with black) then ren-dering
    the value, calculating its center point, and drawing it. Lines 426-428 do the
    same thing for the label text before returning on line 430.


    Lines 432-454 describe the counter class. Counters are identical to labels, except
    their self. value is expected to be an integer.


    # The Board Class


    Everything comes together in the board class (lines 456-538). All of the mod-ules
    we have defined to this point are initialized here, starting with pygame. disp.
    lay. init., which starts the Pygame engine. The pygame. display. set _mode creates
    the drawing surface, setting the window size. display = 1 makes the Pygame window
    default to the second monitor, and flags = pygame. FULLSCREEN is self-descriptive.'
