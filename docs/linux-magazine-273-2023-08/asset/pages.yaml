  md: "# **3D viewer**  \n# F3D\n\nEver since computers could draw dots and connect\
    \ lines between them, we've had 3D viewers. Even in the 1960s, computers could\
    \ drive oscilloscopes and cathode ray tubes to show three-dimensional objects\
    \ mapped into a two-dimensional plane. It's an obsession that stuck with computers\
    \ through the space-station approach in the 1968 movie 2001: A Space Odyssey,\
    \ in the video game Maze (aka Maze War) in the 1970s, and through the plethora\
    \ of wireframe and filled polygons that filled out television in the 1980s before\
    \ accelerated graphics made it trial from the 1990s onwards. Now you can view\
    \ things in 3D anywhere, from your phone, within a web browser, and in real 3D\
    \ with a VR headset. But you're still stuck if you need a quick preview of a 3D\
    \ object from the command line. With a few minutes to spare on a desktop, you\
    \ could quickly drop a file into Blender, create a quick scene, and render this,\
    \ but the brilliant F3D does a better job with the output and does this without\
    \ any complicated UI interaction right from the command line.\n\nF3D will load\
    \ a whole host of 3D files, from VTK files from 1993 to scientific datasets and\
    \ PTS point clouds generated by modern LiDAR with millions of points. Whatever\
    \ the content, it's beautifully rendered into a separate desktop window where\
