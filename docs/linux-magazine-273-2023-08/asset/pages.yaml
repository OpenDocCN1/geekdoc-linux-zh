  md: '# Survival roguelike


    # Cataclysm: Dark Days Ahead


    ![](img/740bd926461af28ed755753238e647a2_86_0.png)


    **Cataclysm: Dark Days Ahead** is an open source roguelike adventure that''s now
    even available on Steam.


    This is a complicated adventure game with a steep learning curve. It runs from
    the command line, and when you create a character and drop into the game world,
    everything initially looks a lot like the original NetHack. It''s built using
    text characters with cursors, with a central character for your avatar, a ''fog
    of war'' that lifts according to your line of sight as you explore, and a selection
    of stats and attributes on the right. Like NetHack, the ASCII text can be replaced
    with graphical tiles which can make the game feel a lot more modern but will also
    pull the gameplay out of the terminal and onto your desktop. Either way, both
    versions of the game play identically, and they''re both equally difficult. Cataclysm
    describes itself as a ''turn-based survival game set in a post-apocalyptic world'',
    and this is the world you need to explore from the outset while attending to your
    attributes to keep you alive. Turn-based means there''s a move cost in every action
    you perform, and starting difficulty is dependent on which starting scenario you
    choose, with ''Evacuee'' giving you enough resources to help initially. This also
    depends on which character profession you choose, because different professions
    come equipped with different default inventories. There are many professions to
    choose between, from Ballroom Dancer to Punk Rock


    Dude, and everything seems to affect everything else. It takes many hours to begin
    to understand the effects of the choices you make both before the game starts,
    and within the gaming environment itself, but some excellent onboarding guides
    and online videos can really help. The end result is a roguelike with elements
    of NetHack, a scenario like Fallout, and an emphasis on survival and combat. Like
    NetHack, it rewards the time you invest in learning it with a deep gaming experience,
    albeit with a much harder learning curve.


    **Project Website**

    https://cataclysmdda.org


    # Plant simulator


    # botany


    ![](img/740bd926461af28ed755753238e647a2_86_1.png)


    **Botany** lets you grow ASCII plants on the command line and let your friends
    visit to help water and watch over your creation.


    We''re used to the idea that many AAAA games are becoming more complicated and
    more demanding, often taking dozens or even hundreds of hours to conquer. But
    there''s a sub-class of games that attempt to do the opposite. It''s one of the
    reasons why Stardew Valley was so successful, as many players used its farming
    and growing aspects to wind down and relax without having to plough their real
    gardens. The wonderful botany takes this even further in both its implementation
    and in the demands it puts on you mentally. It does this first by being a simple
    Python 3 command-line application you can grab and run from its repository without
    requiring installation or dependencies for configuration. Secondly, it requires
    very little attention or thought. Like a real plant, it demands simply that you
    take a look occasionally and don''t abandon it. On first launch, the game starts
    with you being given a seed. You''re not told any of this directly, but you can
    read about it within the included instructions. It then becomes your task to water
    the plant, check on its growth and remember to come back every 24 hours to do
    the same. There are more than 20 different species of plants, all drawn as ASCII
    art, and when random attributes when you first run the game, but just like with
    real plants, it takes days for anything to appear from that initial seed. If you
    forget to water your ASCII, it will perish, and your flower can mutate at any
    stage of its development. But if it survives, you can harvest the growth


    and use this to seed a new generation with a 20-percent growth bonus. Even more
    impressively, you can visit other people growing plants from their command line
    by entering their name, and they can visit you. Visitors can view and even water
    your plant, helping to keep it very healthy if you go on holiday, for instance,
    which is a lot easier to organize over a network than someone visiting your IRL
    garden.


    **Project Website**

    https://github.com/jifunks/botany'
  merge: -1
