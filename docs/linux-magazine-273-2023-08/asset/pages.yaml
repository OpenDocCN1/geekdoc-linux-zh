  md: "# Programming Snapshot – Go Algorithms\n\npromptly came up with a better solu-\
    \  \ntion. Like Magic!  \nThe permutation algorithm designed  \nby ChatGPT is\
    \ based on recursion. It  \ncalls the `perm()` function twice with two  \ninitially\
    \ empty team slices, `subset1` and  \n`subset2`. To do this, the exported `perm()`\
    \  \nfunction starts the `_perm()` function,  \nmasked by an underscore, in line\
    \ 4 of  \nListing 8, populating it with the two sub-  \nset parameters and the\
    \ index of the ele-  \nment currently being processed. With  \n`i dx` initially\
    \ set to $\\varnothing$, the function remem-\nbers its current position in the\
    \ array slice  \nof available players and then calls itself  \ntwice with two\
    \ new tryout teams. In one  \ncall, it appends the current element ref-  \nerenced\
    \ by `i dx` to `subset1`, while it ap-  \npend s it to `subset2` in the following\
    \ call  \n(lines 17 and 18).  \nThis recursively creates all possible  \nconstellations\
    \ and reliably divides the  \narray elements into two subgroups.  \nHowever, the\
    \ function does not pay at-  \ntention to whether  \nthe teams actually  \ncontain\
    \ all the  \nplayers required to  \ncreate a team. In  \nfact, it even leaves\
    \  \nthe subsets empty in  \nparts (Figure 4).  \nThat’s not a  \ndeal-breaker.\
    \ The  \ncode in Listing 8  \nstarting in line 8  \nchecks whether  \nthe groups\
    \ gener-  \nated here have the  \nrequired number  \nof players and ig-  \nnores\
    \ any solu-  \ntions that do not  \nmeet this criterion.  \nLine 9 only calls\
    \  \nthe callback func-  \ntion f with the two  \nteam candidates  \nfor numerically\
    \  \nmatching constel-  \nlations; these are  \nmarked by the red  \narrows in\
    \ Figure 4.  \nThe caller then  \nuses this to evalu-  \nate the constella-  \n\
    tion to home in on  \nthe best result in  \nthe end.\n\n![](img/740bd926461af28ed755753238e647a2_62_0.png)\n\
    \nThis procedure, which is implemented  \nin a quite compact way, generates all\
    \  \npossible computers. In Figure 5, I’ve re-  \nduced the problem to six players\
    \ for the  \npurpose of illustration. However, it is  \nstill not perfect, because\
    \ it also evaluates  \nsymmetrical matches (Team A against  \nTeam B and vice\
    \ versa) as new. Again,  \nthe event space is small, so this is not  \ntoo much\
    \ of an issue.  \nThe brute binary generated by the  \nbuild command  \nlaunches\
    \ itself to the `teams.yaml` YAML  \nfile, working its way through all the pos-\
    \  \nsible team constellations and outputting  \nthe best values  \nbased on the\
    \ eval-  \nuation function.  \nFigures 6 and 7  \nshow two\n\n```\ngo build brute.go\
    \  \nteams.go  \ndiff.go\n```\n\n![](img/740bd926461af28ed755753238e647a2_62_1.png)\n\
    \nexamples of usable setups, one for the  \ntask posed at the beginning with a\
    \ pool  \nof six players and one for a game with  \ntwo teams of eight.  \nIn\
    \ both solutions, the algorithm  \nfound distributions where each team  \nhas\
    \ a goalie and the player skill values  \nfor offense and defense are roughly\
    \  \nbalanced. This will keep the match ex-  \nciting until the last minute, assuming\
    \  \nthat all of the players put in a 100-per-  \ncent performance, but that’s\
    \ a different  \nstory.\n\n![](img/740bd926461af28ed755753238e647a2_62_2.png)\n\
