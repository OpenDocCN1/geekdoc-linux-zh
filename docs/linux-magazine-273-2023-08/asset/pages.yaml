    These container types include **Box** and **HBox** (for packing child items into
    vertical or horizontal boxes), **Split** (to allow users to drag a split bar separating
    two child items), or **Stack** (to allow multiple items to be drawn on top of
    each other). The most popular, and flexible, container is **Border**, which you
    will use twice in the to-do list app. The **Border** container takes four required
    fields for items to be positioned along the top, bottom, left, and right edges,
    and an optional fifth parameter for the content that should fill the remaining
    (central) space. The app is split into two main areas: the top bar (where you
    will position the *New item* entry widget) and the to-do list area, which fills
    the main area. In essence, the app''s entire layout is captured as:


    ```

    ```

    container.NewBorder(head, nil, nil, nil, list)

    ```

    ```


    The app uses a new package called *container*, which is from `fyne.io/fyne/v2/container`.


    To make the top bar, you will use another **Border** container, which will have
    an **Entry** widget for the user input (Listing 3) and a new **Button** widget
    using an icon for adding content, which is available in the standard theme. (I
    will add code to respond to user input later.)


