- pgno: 72
  md: "the command. The last byte contains the routing as 8 indexed addresses. The\
    \ high-order digit defines the output or destination, and the low-order digit\
    \ defines the input or source. Here, 0x00 says “connect the first output to the\
    \ first input.” The next line connects the second output to the second input.\
    \ Table 1 shows the configuration for each button.\n\nOne output of the matrix\
    \ is connected to a monitor in the control room so that the sources can be easily\
    \ monitored. The three CR buttons allow any of the matrix sources to be viewed\
    \ on the control room monitor (Figure 7).\n\nAll of the buttons except the last\
    \ two use addMatrixCommand. The Record and Stop buttons use addOSCommand instead\
    \ and then use wget to trick the digital recorder into thinking the buttons on\
    \ its web GUI are being pressed to start and stop the recording onto an SD card\
    \ or flash drive (Listing 2).\n\nThe render function iterates over self.buttons,\
    \ calling each render method and creating all of the buttons onscreen, as well\
    \ as all the Pygame rect objects to see whether they’ve been clicked. Once everything\
    \ has been drawn to the buffer, the function calls pygame.display.flip to make\
    \ it visible in the drawing window.\n\nThe loop function makes everything interactive\
    \ by watching for button presses, sending commands when they are, and keeping\
    \ up with everything that’s happening.\n\nThe looping value is first set to True,\
    \ before the function enters the while loop with looping as its argument. If looping\
    \ is set at any point to False, the loop exits.\n\nThe function then waits for\
    \ Pygame events and checks to see if the event is a button click. To see if any\
    \ of the buttons have been pressed, the function loops over self.buttons again\
    \ and gets the coordinates of the mouse click:\n\n```\nfor btn in self.buttons:\
    \ if btn.rect.collidepoint(\U0001F449 event.pos ) = True: for cmd in btn.matrixCommands:\
    \ self.matrixPort.send( \U0001F310 cmd + chr ( 0x77 ) )\n```\n\nIf True, a button\
    \ has been pressed. To make the button do its thing, the program loops over btn.matrixCommands\
    \ and sends each string to the matrix. To give the matrix time to process each\
    \ command, the function waits half a second before moving on.\n\nThe lines that\
    \ follow do the same thing for any operating system commands (btn.osCommands)\
    \ but pass them to os.system instead. The call to matrix on the last line of the\
    \ program sets everything in motion.\n\n# Conclusion\n\nI hope this article has\
    \ given you some insight into a different type of network. When you think about\
    \ the idea that similar control rooms like this exist all over the world and they\
    \ each feed their own set of displays or a broadcast video system network, you\
    \ can see the similarities and differences between the Internet and IP routing.\
    \ You’ve also seen how these scoreboards are generated and controlled to support\
    \ a local basketball league. Now that all the games and the season are done, it’s\
    \ time to hit the showers.  ■■■\n\n# Info\n\n+   [1]  Python: www.python.org \
    \ \n+   [2]  CherryPy: https://docs.cherrypy.dev/  \n+   [3]  Code for this article:\
    \ https://linuxguru.blog.thegeek.cloud/s/6r2x9tOWJ6JN3Z  \n+   [4]  Pygame: https://pygame.org\
    \  \n+   [5]  HTML5: https://www.w3docs.com/learn-html/ html5-elements-reference.html\
    \  \n+   [6]  jQuery: https://www.jquery.com\n\n# Author\n\nScott Sumner has worked\
    \ in the museum and nonprofit industry for most of his professional career. He\
    \ enjoys exploring technology solutions with Arduinos, Raspberry Pis, microcontrollers,\
    \ and Linux systems.\n\n# Listing 8: wget Trick\n\n```\nbtn.addOSCommand ( r\"\
    wget --header=\"Accept: */*\" --header=\"Accept-Encoding: gzip, deflate\" --header=\"\
    Accept-Language: en-US,en;q=0.9\" --header=\"Connection: keep-alive\" --header=\"\
    Cookie: serenity-session=729952074\" --user-agent=\"Mozilla/5.0 (X11; Linux x86_64;\
    \ rv:60.0) Gecko/20100101 Firefox/60.0\" http://172.16.2.20/cgi-bin/system.cgi?command=recording&action=start\"\
    \ )\n```"
