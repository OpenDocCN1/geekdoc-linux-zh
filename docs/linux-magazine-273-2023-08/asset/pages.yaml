    because they reproduce the sound as naturally as possible. On the ProFX, you can
    test what the same mix sounds like on a stereo system at the push of a button.
    You can also connect Bluetooth speakers and similar playback devices, as long
    as they have an analog input.


    The main mix is sent from the mixer via balanced XLR cables, which guarantee an
    interference-free signal at distances of 50 meters or more. One of Mackie’s trademarks
    is that the mixers are totally silent if no signal is being transmitted. The ProFX
    delivers on this


    # Scenarios


