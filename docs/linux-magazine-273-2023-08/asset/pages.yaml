    # ## Displaying a Data List


    To complete the user interface, you need to define the main to-do list. The **List**
    widget is ideal for this task, but it is a little more complex than the previously
    discussed widgets. **List** is a "collection widget" (along with **Table** and
    **Tree**) designed to handle lots of data at high performance. I will create a
    list using `widget.NewList`. Rather than passing static data, `widget.NewList`
    uses callbacks to understand how content should be displayed. The three callbacks
    it uses define the number of list items, how an item is created, and what data
    each row should contain. This more complex setup means that **Fyne** can reuse
    widgets as a user scrolls, which is much faster and more efficient for CPU and
    memory.


    For now, I will use dummy content in the sample to-do list. It will display five
    items, and each one will show "TODO item" (as the data for the third callback
    doesn''t yet exist to display). For each row in **List**, I use a **Check** widget
    to give each item a checkbox, which will allow users to mark completed items and
    display the associated text. This code, together with the earlier items, comprises
    the entire user interface. For simplicity, the graphical setup code is moved into
    a new function called `loadUI` as shown in Listing 4.


    # ## Launching the GUI


    Because the code is now in the `loadUI` function, you also need to update the
    **main** function to set the content to be the result of calling `loadUI`. A list
    can be very small, but you want to see multiple items at the same time. To do
    this, you call **Resize** on **Window** with a suitable size (not pixels because
    a


    # ## Listing 4: ui.go


