    Figure 7: Chromatic aberrations are frequently very stubborn; you may have to
    modify the automatic correction results manually.


    # Minimize the Noise


    Zoom into the image and check the image noise and sharpness in each image area
    by moving the view. To do this, first click on the magnifying glass on the right
