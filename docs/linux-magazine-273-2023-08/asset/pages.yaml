    To save your file as a completed audio file, select *File | Export*. A dialog
    opens, prompting you to select a file type. I always export as MP3, but that''s
    a personal preference.


    You may also download the source code for Audacity [4] and compile it on your
    system to enable or disable options and customize your installation. I have never
    needed to do this because the standard features and locations have always worked
    for me.


    # ## Summary


    Audacity is a professional audio application that supports a broad range of recording
    and playback hardware. It is a free, open source, easy-to-use application with
    advanced features, dozens of effects, plugins, and output options. It''s an excellent
    choice for podcasters who need an uncomplicated solution that works equally well
    on Linux, Windows, and macOS systems. The Audacity development team releases regular
    updates and security and bug fixes. Working with Audacity is fun and productive.
    It will serve you well for many years. Happy podcasting!


    ![](img/740bd926461af28ed755753238e647a2_22_2.png)


    **Figure 8: Three seconds of silence added to the track.**


    # ### Info


    +   [1] Audacity: https://www.audacityteam.org/

    +   [2] Poly: https://www.poly.com/us/en

    +   [3] Focusrite Scarlett 2i2: https://focusrite.com/en/usb-audio-interface/scarlett/scarlett-2i2

    +   [4] Audacity source code: https://www.audacityteam.org/download/source/


    # ### Author


    **Ken Hess** is a freelance technical writer and journalist. He covers a variety
    of open source topics, including Linux databases, and virtualization. You can
    reach him via his website at www.kenhess.com.'
