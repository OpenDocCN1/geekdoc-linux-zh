    # Conclusion


    When I first started reading about Net-\nBox, I found their aim of being “the
    pre-\nmiere network source of truth” kind of\ncheesy. It’s just a web GUI for
    a network\nmap with some stuff from a database\nafter all. Since installing and
    using it,\nhowever, I’m a true believer. I think\n\n56 | AUGUST 2023 | ISSUE 273
    | LINUX-MAGAZINE.COM\n\nevery single networker should be mapp-ed\nout using NetBox.
    I have installed the\ncommunity edition at work as well as on\nmy home network.
    It really is your net-\nwork’s “truth” – or at least it becomes\nthat once you
    put in the work.


    I am still in the process of document-\ning the network in my organization. It
    is\nan enormous task and one that never\nends, because updates will need to be\nmade
    as the network expands, contracts,\nand changes. My intent is to build Net-\nBox
    out thoroughly enough that I can\ngive a new employee a login to NetBox\nso they
    can find their way around the\nentire organization, even if they aren’t\nable
    to access everything that they see in\nthere. I also need to add maps for each\nbuilding
    in the NetBox’s location


    section, which I could do by simply up-\nloading PNG images of our physical\nmaps.
    I might not give a new employee\nthe credentials for our building’s\nswitches,
    but they will know where the\nswitches are located, what devices con-\nnect to
    them and through which ports,\nand the IP addresses those devices have,\nas well
    as be able to very quickly and\neasily find product information. NetBox\nwill
    give new employees all that they\nneed to know about the devices that\nthey will
    work on to be able to effec-\ntively and efficiently do their jobs. With\ndozens
    of printers and hundreds of PCs\non our network, the ability to pinpoint\none
    device and its connection to a spe-\ncific switch by searching for a room or a\nbuilding,
    and to have a link to the user’s\nguide and installation manual, drivers\ndownload
    page, specifications, asset tag\nnumber and corresponding serial num-\nber, and
    so on, will greatly improve team\nefficiency in the long run, though it will\nabsolutely
    take time to implement. None\nof that time is wasted, however, because\nanyone
    who is mapping out the network\nin NetBox is also learning all of the ins\nand
    outs of it simultaneously.


    Something incredibly important that I\ndidn’t focus on in this article: Knowing\nwhat
    is on your network and where that\ngear is located is critical to network secu-\nrity
    and is connected directly to CIS\nSafeguards numbers 1.1, 1.2, 1.3, 2.4, 6,\nand
    many others in the CIS Risk Assess-\nment Methodology (RAM)\[18\].


    Initially, I found a ton of overlap be-\ntween tools that we were already using\nand
    NetBox. However, to add more devices\nto the database and put in more details\nabout
    each device, I realized that I had\nbeen looking at it all wrong. While alter-\nnates
    exist to basically all of NetBox’s func-\ntions, the disconnect between the individu-\nal
    programs and services creates ineffi-\nciency. NetBox offers a fantastic opportu-\nnity
    for long-term improvement in network\nmanagement. NetBox, if well-imple-\nmented,
    will act as a central knowledge\nhub for the network, with each of those\nother
    programs and services functioning as\nspokes off of that hub. NetBox doesn’t lay\nover
    the top of your existing management\nstack, but instead coalesces with it in a\nway
    that empowers your IT team. While\nNetBox may initially look like a lot of work,\n\nLINUX-MAGAZINE.COM
