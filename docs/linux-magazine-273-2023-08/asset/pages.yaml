  md: "# COVER STORY\n\n# Sound Studio Workshop\n\nsounds perfect in your studio will\
    \ not make it better for everyone else. You can find software solutions that will\
    \ let you measure and analyze the sound output in the room accurately. I used\
    \ the Java Room EQ Wizard (REW) app in the test; you can download it free of charge\
    \ [4]. You will also find a commercial Pro version of the REW proprietary freeware\
    \ [5], which – above all – enables more precise measurements, as needed when building\
    \ loudspeakers. Having said this, the free version comes with everything you need\
    \ to optimize a home studio. It generates the required measurement tones and meaningful\
    \ graphs of the measured signals.\n\nOn first launch, REW offers to calibrate\
    \ the connected microphone (Figure 11). It then measures the sound waves that\
    \ the speakers spread in the room and graphically displays whether and how the\
    \ results deviate from an expected ideal result. You can reduce these deviations\
    \ by removing obstacles near the speakers and dampening reflections in the room.\
    \ Reflections not only create reverberant effects that wash out the sound image,\
    \ they also cancel out or boost frequencies, and that distorts the sound entirely.\n\
    \nOptimizing room acoustics is an expensive discipline if you want everything\
