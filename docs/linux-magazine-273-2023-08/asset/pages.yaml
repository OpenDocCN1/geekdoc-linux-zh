    with Linux, the jackd package, and the application stack. The 2x4 interface lets
    you output the sound sources to two separate targets: Main Mix and Control Room.
    The Control Room target also serves the headphone output, to which you could connect
    another amplifier and speakers if required (Figure 4). When you are working on
    a recorded mix, this lets you use different output systems at the same time. I
    normally use


    promise even if you route the main mix out 2 to 3 meters away using simple jack
    cables.


    Many of today’s popular sound mangleers combine incoming stereo signals into a
    single channel either physically or in the software. Many errors that you will
    not notice in stereo playback do not sound right if output in mono. Once your
    mix sounds good on decent stereo monitors, set up the mono output in the same
    way, switching between the two output modes. If your work also sounds acceptable
    in mono, you can assume that it will sound okay on a smartphone speaker.


