  md: '![](img/740bd926461af28ed755753238e647a2_33_0.png)


    Figure 3: You can choose the ANSI or default ISO keyboard layout if you purchase
    online.


    Once I got used to this feature, I quite liked it. There is no reason why the
    clickpad needs to be in the dead center of the keyboard – why not put it closer
    to the hand that uses it? That said, it did take me some time to figure it out.
    The controls for activating each half, or putting it in a mode where both halves
    work


    together, were not well documented, and once in a while, the clickpad would appear
    to turn itself off unexpectedly. I eventually got it working the way I needed
    it to. (Tapping twice in the upper corner of the pad activates the half-pad mode.)
    Once I understood this, I could finally understand the cryptic symbols printed
    on


    the top of the clickpad (Figure 4). Cool feature, but a worthy reminder that I
    was still in the Linux world, where innovation comes first and documentation often
    follows later. Buying a pre-built system saves you from most of the tinkering,
    but not all – you still have to tinker a little bit.


    ![](img/740bd926461af28ed755753238e647a2_33_1.png)


    # Conclusion


    I’m a prototypical business user, and I need something that isn’t a lot of trouble
    – light, convenient, easy to type on, and easy to plug things into. The TUXEDO
    laptop gave me everything I needed and more. ■■■


    Figure 4: Once I figured out what was going on, the hieroglyphics on the clickpad
    made perfect sense.


    Info

    [1] TUXEDO’s Infinity Pro 16 Gen7 MK1: <https://www.tuxedocomputers.com/en/TUXEDO-InfinityBook-Pro-16-Mk1-Gen7.tuxedo>

    [2] Tomte Configuration Service: <https://www.tuxedocomputers.com/en/fos/Help-Support/Frequently-asked-questions/What-is-TUXEDO-Tomte.tuxedo>

    [3] ANSI vs ISO Keyboard Layout: <https://switchhandclick.com/ansi-vs-iso-layout>


    Author

    Joe Casad is the editor in chief of *Linux Magazine*.'
