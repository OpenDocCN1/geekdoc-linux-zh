- pgno: 16
  md: '![](img/740bd926461af28ed755753238e647a2_16_0.png)


    How often you record is closely related to episode duration. It’s far better to
    produce two 30-minute podcasts than a single podcast lasting an hour. Generally,
    the more frequently you can produce a podcast the better. Once a week is ideal.
    This keeps your podcast in the minds of two listeners and helps them to remember
    you. Once every two weeks is another good option, especially to start with, but
    once a month might be too little. Either way, the more frequent your podcasts,
    the larger your monthly download figures will be, and this helps hugely if you
    ever want to sell advertising sponsorship.


    It’s essential you communicate clearly when a podcast episode is expected – and
    stick to it. Rain or shine, PulseAudio failure or hard drive crash. It’s the one
    thing that differentiates amateurs from the professionals; professionals understand
    that listeners need an absolutely predictable routine. Predictable releases are
    a sign of strength and stability, because no one wants to invest time in something
    that may ultimately peter out, and the more your listeners need to do to work
    out which was your last episode and which is your next, the fewer listeners you’ll
    have.


    # ## People Power


    Three or four co-hosts is an ideal number because it allows listeners to get to
    know your personalities, and it allows them to feel they’re among friends (Figure
    1). Co-hosts can help share the burden of being engaged, doing the research, playing
    devil’s advocate, and approaching a discussion from another perspective, or by
    simply compensating for another host who can’t make it. It helps if you already
    know each other and are already comfortable and relatively unguarded in each other’s
    company. Even for well-planned or scripted podcasts, it’s the unpredictable parts
    that listeners enjoy, and spontaneous, divergent conversations are an important
    part of this. It’s important that differing opinions on


    topics are reflected by the hosts. A podcast should not become a vanity project
    for the strongest personality, or worse, the person who puts the podcast together.


    The role of the main host is the most important and under-appreciated in the whole
    podcast enterprise. The main host is the person asking questions on behalf of
    the listener, sensitive to whether what’s being talked about is likely to be understood.
    This is important whenever you have experts talking – an expert might assume a
    level of knowledge that you can’t also assume of your listenerhip, and it’s the
    main host’s job to ask for clarification on points or challenge an assumption
    when needed. The main host should also try to make sure all hosts are equally
    included in the conversation, perhaps by asking a quieter host their opinions,
    or breaking into the monologue of a verbose participant to give someone else a
    chance to share an opinion.


    Whoever drives the podcast needs to be subtle and transparent. If they’re doing
    a brilliant job, no one will know. This is a thankless task that might even weaken
    your position within the hosting dynamic as you play more than one role from more
    than a single angle, but it’s essential that someone adopts this persona, and
    it might as well be the podcast founder.


    ![](img/740bd926461af28ed755753238e647a2_16_1.png)


    **Figure 1:** The rapport between co-hosts is sometimes more important than the
