    \ read the plugin page carefully. If you get errors when trying to make changes\
    \ to your devices after using the topology views plug-in, create a custom field\
    \ called Coordinates that is data type text and is hidden. Then follow the instructions\
    \ on the plugin page to do the needed conversion. After that you will begin to\
    \ able to edit devices without getting an error message each time.\n\nHaving said\
    \ that, the topology views plugin looks downright awesome, and I highly recommend\
    \ it for creating topology maps. Just be aware that this error could occur and\
