- pgno: 64
  md: '![](img/740bd926461af28ed755753238e647a2_64_0.png)


    **Figure 2:** The video control room is a converted classroom. From left to right,
    the first two monitors in the background are the main displays of the NUCs running
    the scoreboard software. The text window is the output of the Python program,
    and the scoreboard itself is on the secondary monitor output. The third monitor
    is routable from the video matrix to select what is shown. In the foreground are
    the matrix control touchscreen and the camera controller. The tall monitor is
    the switcher multiview. The NUCs and the matrix are visible at the very bottom
    of the rack under the table.


    Inputs can connect to as many outputs as needed. To say it another way, all of
    the outputs can display a single input, but each output can only display one thing
    at a time. When a selection is made, the selected input and output are connected
    as if they were wired together directly. These connections are easily changed
    throughout the day as the needs of the basketball game dictate.


    # ### Video Signals and Conversions


    Many different video formats can carry live video down a wire. You''re probably
    familiar with HDMI because it has been widely adopted since its introduction.
    The video system discussed here primarily uses a serial digital interface (SDI),
    which is a digital standard for broadcast video. Hardware converters between these
    formats also exist, so changing between them is as easy as connecting a cable
    of each type. The cost for this conversion is a slight delay in the video signal
    that is normally not noticeable; however, if you have stacked several conversions,
    the delays can start to add up and become visible. This scenario generally presents
    itself as audio out of sync with its associated video.


    # ### The Scoreboard


    In addition to team points, a scoreboard also offers other game information, such
    as time remaining, period of play, time outs, or player numbers. Figure 3 shows
    the general flow of the program. At program startup, the graphics initialize and
    the initial state of the scoreboard renders. Concurrently, the web server starts
    and the operator brings this page up on a courtside computer (Figure 4).


    As the basketball game progresses, the operator uses the web interface to update
    the game score and other statistics.


    ![](img/740bd926461af28ed755753238e647a2_64_1.png)


    **Figure 3:** The servers, clients, displays, and their associated libraries communicate
    and interact with each other.


    Each action on the web interface starts as a JavaScript function that runs in
    the browser, communicating with the CherryPy [2] server through background Ajax
    calls. When CherryPy receives these commands, it updates the graphics screen to
    reflect the change on the scoreboard itself and then sends the updated values
    back to the browser so that the operator’s interface is also updated.


    Listing 1 shows some of the code behind the scoreboard. (You can download the
    complete code online [3].) To begin, you must import the external libraries the
    program needs: The pygame graphics library [4] draws the scoreboard; `thread`
    allows multiple branches of the program to run at the same time, so you can run
    the scoreboard display and the web control interface at the same time; `pymysql`
    is the MySQL database library for Python; and cherrypy sets up the CherryPy framework.


    # ### The Web Class


    The web class (lines 6–339) connects to a MySQL database that will be used to
    retrieve team names, determine which team plays which, and record game history.
    When the class is instantiated, the `__init__` function is called automatically
    to set up a few things needed later. Line 8 creates a class variable `self.scoreboard`
    and saves the reference to the scoreboard class that’s passed in as an argument.


    The reconnect function is really only one call split up across multiple lines
    for easier readability (lines 12–18). `pymysql` connect creates `self.db`, the
    local reference to the database. Each line supplies the appropriate credential.'
