- pgno: 70
  md: "Because this program uses Pygame's font capabilities, these are initialized\
    \ on line 460, after which all of the fonts are loaded. In Pygame a font is the\
    \ face itself and an associated size, so the same font file may be loaded multiple\
    \ times with different sizes.\n\nLine 446 loads self.logo, which is the logo displayed\
    \ along the bottom of the scoreboard. The convert at the end of the line makes\
    \ the image's internal format match Pygame's initialized display format so the\
    \ logo blit onto the screen is faster.\n\nLine 468 creates an instance of the\
    \ clock class, with a reference to self.screen passed in so that it can draw the\
    \ updated clock directly.\n\nThe final lines of the program (not shown) initialize\
    \ five different instances of the counter class for the home and visitor's scores,\
    \ number of timeouts for each team, and the game period. In each case, valueFont\
    \ and labelFont are set to one of the font/size pairs initialized earlier. A label\
    \ indicates which court each scoreboard is tracking.\n\n# A Typical Game Day\n\
    \nWhen the crew arrives on game day, the first task is to set up the scoreboard\
    \ operator's console (two Raspberry Pis, one per scoreboard). Once that's done,\
    \ robotically controlled cameras are placed around the court and everything is\
    \ tested. The young- est teams play first in a half-court model. Halfway through\
    \ the day, play switches to full-court games (Figure 5).\n\nAt halftime of each\
    \ game, video mes- sages play onto the screens, and the scoreboard returns to\
    \ normal operation (Figure 6). At the halfway point of the day one scoreboard\
    \ system is routed to both score displays because a single court is now in use.\
    \ This switching is accomplished with a matrix video router.\n\n# Controlling\
    \ a Video Matrix\n\nAlthough the basic operation of a ma- trix router is fairly\
    \ simple to under- stand, it's always easier to have mean- ingful names and labels\
    \ attached in- stead of remembering sets of numbers. Adding some shortcuts to\
    \ common con- figurations makes things even easier, which is the purpose of the\
    \ matrix con- trol program (not shown, but available online [3]).\n\nThe Raspberry\
    \ Pi communicates with the matrix over a USB serial connection set up in Python:\n\
    \n```\nclass matrixSerial:\n    def __init__(self):\n        self.port = serial.Serial\
    \ (\"\n        \"/dev/ttySBO\", 9600)\n\n    def send(self, cmd):\n        self.port.write(cmd)\n\
    ```\n\nThe __init__ line creates self.port, which is an instance of the Serial\
    \ object with the name of the serial device and the requested baud rate. The defaults\
    \ are\n\nfine for everything else. The send func- tion takes in cmd and transmits\
    \ it with a call to self.port.write, thus sending data to the matrix.\n\n# The\
    \ Button Class\n\nThe main function of the program is to present easy options\
    \ to the user on a touchscreen; a button class sets up the actions to button presses.\
    \ When the class is instantiated, it receives screen, screen object, and font,\
    \ which is a Pygame font object to be used to label the buttons. Each of these\
    \ is stored in class properties for use by other methods.\n\n![](img/740bd926461af28ed755753238e647a2_70_0.png)\n\
    \nFigure 5: Depending on the age group playing, the game may be on full or half\
    \ courts. Each scoreboard must be routed to follow the current court configuration.\n\
    \n![](img/740bd926461af28ed755753238e647a2_70_1.png)\n\nFigure 6: The scoreboard\
    \ display as seen on the large, audience-facing monitors."
