    # Programming Snapshot – Go Algorithms


    (i.e., the one with the lowest value) in bestTeams and bestOff.


    When storing the best results, though, it is important to avoid a hidden stumbling
    block: If you thought you could just keep the values of the t1 and t2 variables
    with the teams in a safe place, think again. Because the Go runtime modifies the
    teams referenced by t1 and t2 in the underlying array, you end up with garbled
    lineups. An array slice in Go is always just a pointer to a real array (Figure
    2). If you only save the pointer, you will inevitably see arbitrary changes to
    the underlying array.


    Lines 11 to 14 avoid this trap by duplicating the teams, once found, using Go’s
    built-in copy() function. It is also important to make sure that the target array
    slice (the first argument for copy()) is the same length as the original that
    you want to copy. If the length of the former is zero, copy() will simply copy
    zero bytes, leaving the user pulling their hair out in frustration.


    So how does Listing 7 find all possible team constitutions? To do this, Listing
    7 calls the perm() function from Listing 8 in line 7; the function expects an
    array slice of available players and a callback function that it calls exactly
    once for each combination it finds. With each individual datapoint, as shown in
    Listing 7 starting in line 7, the program can then unleash actions on the two
    teams, such as rating them and keeping the best results found so far.


    # Help from ChatGPT


