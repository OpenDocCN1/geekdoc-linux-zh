    one displayed, use the command


    ```

    ```fdupe -r -d -N /path```

    ```


    You do not need to press Delete here – the -N (no-prompt) option works without
    any confirmation.

    Another selection option after calling fdupe with the -d option relies on the
    sel parameter. You can select all files with a specific term in the path by typing
    sel <term>. To select all files whose path starts with the term, use selb <term>.
    Use sel e <term> to select files whose path ends with the term. To select all
    files whose path corresponds exactly to the term, use sel <term> command. After
    that, you can decide which of the candidates you want to keep. Further options
    are described by the help command, which displays the matching fdupe man page
    sections.


    # ## Hard and Soft Links


    Beyond this, you can tell fdupe to reduce the space required by duplicates by
    converting the duplicates into hard links. A hard link connects a name directly
    to a specific file in the system. Several hard links can refer to the same file
    (i.e., several directory entries or file names can exist for the same file). Unlike
    a soft link, where the pointer changes as soon as you rename the file, a hard
    link continues to point to the underlying file afterwards.

    Suppose you manage a computer used by multiple users, and they store the same
    files in their home directories (e.g., YouTube videos or audio files). In this
    case, you cannot simply delete the files. Instead, the -h option lets you convert
    the duplicates to hard links. If a user deletes their copy, the other copies are
    still kept. However, this option is not universally suitable – if a user changes
    the metadata of a song or photo, for example, the data will also change in all
    linked objects. The same applies to editing text files. Because of this, -h is
    more suitable for read-only files. Another switch to be used with caution is -s
    (--symlink), which converts duplicates of a file into symbolic links (soft links).
    In some cases, users save the symlink and accidentally delete the actual file.


    # ## Why the Command Line?


    Why choose a command-line solution when there are graphical alternatives that
    could actually give


    ![](img/740bd926461af28ed755753238e647a2_78_0.png)


    > Figure 1: The simplest method of finding duplicates does not need any call parameters
    to specify the directory.


    ![](img/740bd926461af28ed755753238e647a2_78_1.png)


    > Figure 2: Use the -r parameter to dig down further in a directory tree search.


    ![](img/740bd926461af28ed755753238e647a2_78_2.png)


    > Figure 3: The -d parameter is used to delete any duplicates found and lists
    them in a numbered list.'
