    \n# ## Web Server Setup\n\nTo set up the web server, you will want to create an\
    \ SSL certificate to allow HTTPS encrypted traffic (Figure 7):\n\n```\n```\n$\
    \ sudo openssl req -x509 -nodes \\\n        -days 365 -newkey rsa:2048 \\\n  \
    \      -keyout /etc/ssl/private/netbox.key \\\n        -out /etc/ssl/certs/netbox.crt\n\
    ```\n```\n\nThis certificate is self-signed, which is fine for our purposes here.\
    \ For production use, you most likely will not want to use a self-signed certificate.\n\
    \nNext, you will be prompted for some optional details that you might want to\
    \ include in the certificate. I suggest making a little game out of it to see\
    \ if anyone actually reads your certificate details!\n\nNow you will install the\
    \ NGINX web server [17]:\n\n```\n```\n$ sudo apt install -y nginx\n```\n```\n\n\
    The next step is critical: You must add your hostname and IP address from earlier\
    \ to the server’s configuration file:\n\n```\n```\n$ sudo nano \n        /opt/netbox/contrib/nginx.conf\n\
    ```\n```\n\nChange `netbox.example.com` to the hostname or IP address that you\
    \ entered previously in configuration.py. Note that you can have more than one\
    \ entry here, such as the installation’s IP address and hostname. Simply separate\
    \ them with a space. You can use the `$ ip address` and `$ hostname` commands\
    \ in the terminal to find out this information if you’ve forgotten.\n\nNow you\
    \ will copy the NetBox HTTPS config file to the NGINX directory, delete the default\
    \ enabled site, replace it with a link to this one, and restart the HTTPS service\
    \ by entering the commands in Listing 6 in order.\n\n# #### Listing 6: Setting\
    \ Up the NGINX Server\n\n```\n```\n01 $ sudo cp /opt/netbox/contrib/nginx.conf\
    \ /etc/nginx/sites-available/netbox\n02 $ sudo rm /etc/nginx/sites-enabled/default\n\
    03 $ sudo ln -s /etc/nginx/sites-available/netbox /etc/nginx/sites-enabled/netbox\n\
    04 $ sudo systemctl restart nginx\n```\n```\n\nIf you make any future changes\
    \ to the config file, you need to recap that file to the `sites-available` directory\
    \ using the command in line 1 of Listing 6 and then by restarting NGINX using\
    \ line 4. Failure to do so will result in your configuration not actually changing.\n\
    \n(There is an optional LDAP service installation section in the online NetBox\
    \ documentation as well, but that is beyond the scope of this article.)\n\nYou\
    \ should now be up and running (Figure 8). You can access your NetBox installation\
    \ by going to your web browser and entering the hostname or IP address that you\
    \ used in the NGINX configuration file and in `configuration.py` in the addressbar.\
    \ You will log in with the username and password that you previously created.\
    \ Upon login, I suggest creating a new user for yourself and whatever else needs\
    \ access to NetBox.\n\nWhen you connect to your new NetBox instance using this\
    \ SSL certificate, you will get a warning about connecting to an insecure server\
    \ (Figure 9). For my installation that isn’t a concern, but it might be for you.\
    \ If that is the case, you can look into a certificate that is not self-signed.\
    \ It is probably safe in this case to ignore that warning altogether for the purposes\
    \ of this article.\n\n# ## Assigning User Rights\n\nYou can give users rights\
    \ to view only or to edit. These rights are based on each individual subsection\
    \ of each aspect of the network. This is quite granular, which is fantastic but\
    \ also a bit confusing. I strongly suggest using groups smartly – think first\
