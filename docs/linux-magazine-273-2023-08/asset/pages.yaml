    Removing a proprietary package is\nrelatively simple. We do that through\nthe\
    \ ubuntu-purge scripts [3] (Figure 2).\nCurrently, we have 150 source packages\n\
    filtered out, which results in a larger\nnumber of binary packages. Adding a\n\
    package to the list can sometimes re-\nquire a detailed analysis to investigate\n\
    licensing or other legal reasons and to\nmake sure there is a free alternative\n\
    when possible.\n\nRemoving proprietary components\nfrom a free package is more\
    \ involved. It\nusually requires continuous mainte-\nnance to make sure the package\
    \ remains\nfunctional, as well as to minimize the\namount of work we need to do\
    \ when the\npackage is upgraded upstream. The larg-\nest of these kind of cases\
    \ is Linux, for\nwhich we use the Linux-libc-dev deblob\nscripts, which we incorporate\
    \ into the\nUbuntu kernel packaging workflow [4]\n(Figure 3). Another large example\
    \ is\nFirefox, among many other cus-\ntomizations, is modified to not use ad-\n\
    dons.mozilla.org to search for exten-\nsions, as that repository contains both\n\
    free and non-free software.\n\nFirefox is also a good example of the\nrebranding\
    \ task category. Some pack-\nages have a trademark license that has\nseparate\
    \ requirements from the soft-\nware license itself. In some cases, it re-\nquires\
    \ that the package must be re-\nbranded if changes are made, as it hap-\npens\
    \ with Mozilla products and Ubuntu\nitself. Our custom version of Firefox is\n\
    called Browser.\n\n> **LM:** Besides the ethical choice, are\n> there any advantages\
    \ to a free distro?\n\n> **RR:** Free distros usually make better\n> choices for\
