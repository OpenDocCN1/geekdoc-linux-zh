    in Listing 8 myself, but relied on the assistance of the all-singing, all- dancing
    electronic brain on ChatGPT. I simply asked ChatGPT in plain English for a method
    that could split an array of N players into all possible combinations of two teams.
    It came back with a solution within 10 seconds (Figure 3) – a live-saver for overworked
    programmers!


