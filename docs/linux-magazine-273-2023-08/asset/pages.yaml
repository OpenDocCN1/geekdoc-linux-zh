    on.


    With that in mind, NetBox is certainly an example of you get out what you put
    into it. However, I can tell you that a well-executed NetBox installation can
    quickly become the one-stop shop for your employees to go to when they receive
    a work order or need to know about a specific machine or device type. A rich set
    of APIs means that NetBox can be extended to serve as an information source for
    automated provisioning and management tools.


    NetBox can even serve as a backup to your inventory management. Because new devices
    can be added easily by importing CSV files, big projects are also easy to incorporate
    into NetBox. Personally, I’ll wait until new items are inventoried into the inventory
    management software and then pull a report of newly added items, format it as
    needed for NetBox, upload, and then add IPs (Figure 2). The entire process takes
    perhaps 15 minutes from start to finish to add what is basically an unlimited
    number of devices of one device type. If you know the IPs and locations where
    they will be installed.


    I have also found advantages to using NetBox that I didn’t expect or even imagine.
    My team recently needed to answer approximately a half zillion questions pertaining
    to us as a cybersecurity exercise. NetBox put the answer to nearly all of those
    questions at our fingertips – no guessing and no estimates. How many desktops
    are in the high school library? Three steps needed to find out. Where is our domain
    controller located? Three steps. How many endpoints do we have that are no longer
    supported by a manufacturer’s warranty? Click, click, click. NetBox has


    ![](img/740bd926461af28ed755753238e647a2_48_1.png)


    Figure 2: Managing virtual machines in NetBox.'
