    # # WRITE FOR US


    *Linux Magazine* is looking for authors to write articles on Linux and the tools
    of the Linux environment. We like articles on useful solutions that solve practical
    problems. The topic could be a desktop tool, a command-line utility, a network
    monitoring application, a homegrown script, or anything else with the potential
    to save a Linux user trouble and time. Our goal is to tell our readers stories
    they haven''t already heard, so we''re especially interested in original fixes
    and hacks, new tools, and useful applications that our readers might not know
    about -- stories that take a traditional application and put it to work in a novel
    or creative way.


    Topics close to our hearts include:


    +   - Security

    +   - Advanced Linux tuning and configuration

    +   - Internet of Things

    +   - Networking

    +   - Scripting

    +   - Artificial intelligence

    +   - Open protocols and open standards


    If you have a worthy topic that isn''t on this list, try us out -- we might be
    interested!


    Please don''t send us articles about products made by a company you work for,
    unless it is an open source tool that is freely available to everyone. Don''t!
    send us webzine-style "Top 10 Tips" articles or other superficial treatments that
    leave all the work to the reader. We like complete solutions, with examples and
    lots of details. Go deep, not wide.


    We have a couple themes coming up that we could use your help with. Please send
    us your proposals for thoughtful and practical articles on:


    +   - Cryptocurrencies

    +   - Systemd hacks


    Describe your idea in 1-2 paragraphs and send it to: **edit@linux-magazine.com**.
    Please indicate in the subject line that your message is an article proposal.


