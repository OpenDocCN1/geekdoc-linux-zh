    \ you need to optimize a home studio. It generates the required measurement tones\
    \ and meaningful graphs of the measured signals.\n\nOn first launch, REW offers\
    \ to calibrate the connected microphone (Figure 11). It then measures the sound\
    \ waves that the speakers spread in the room and graphically displays whether\
    \ and how the results deviate from an expected ideal result. You can reduce these\
    \ deviations by removing obstacles near the speakers and dampening reflections\
    \ in the room. Reflections not only create reverberant effects that wash out the\
    \ sound image, they also cancel out or boost frequencies, and that distorts the\
    \ sound entirely.\n\nOptimizing room acoustics is an expensive discipline if you\
    \ want everything to be perfect. Fortunately, you can get very close to perfection\
    \ even with simple means. Soft carpets and heavy curtains often already work wonders,\
    \ and you can easily prevent the sound being wiped out in the corners of the room\
