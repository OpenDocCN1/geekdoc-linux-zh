    \ {\n\tbestTeams := make([][]Player, 2)\n\tbestDiff := -1\n\n\tperm(players, func(t1\
    \ []Player, t2 []Player) {\n\t\td := diff(t1, t2)\n\t\tif bestDiff < 0 || d <\
