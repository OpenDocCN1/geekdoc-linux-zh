    from the import path `fyne.io/fyne/v2` (`app` (your IDE will probably automatically
    add this).


    In the new app, you can create a new window by simply requesting it with:


    ```go

    w := app.NewWindow("TODO")

    ```


    This sets up the variable `w` for the new window. The window will have the title
    “TODO” which may be displayed in your window border. At this point, you could
    build the app. However, without any content, the window would be fairly useless,
    so I’ll show you how to add a widget.


    ## Adding a Widget


    In Fyne, an app can be created by drawing basic types (called CanvasObjects) to
    a position within the window. These items are available in the `fyne.io/fyne/v2/canvas`
    package. However, you can use a collection of pre-made widgets (`fyne.io/fyne/v2/widget`)
    that provides several interactive widgets for the standard user controls and visual
    items found in most apps.


    You can create a new label widget to display the text “TODO App” by simply calling
    `widget.NewLabel("TODO App")`. Then use the `SetContent` method to place this
    widget inside the previously created window. The line of code now becomes:


    ```go

    w.SetContent(

    widget.NewLabel("TODO App"))

    ```


    Finally, you must show the window. Because GUI toolkits also have an event loop
    that manages how the app runs and listens for user input, you also need to run
    the app. Conveniently, Fyne has a method that simultaneously shows the window
    and runs the application:


    ```go

    w.ShowAndRun()

    ```


    That is all there is to creating your first graphical app.


    ## Running the App


    To run the app, you can use `go run`, or you could build it using `go build` and
    then later run the executable that was created. However, because you have added
