    **图 2：** 视频控制室是由一间教室改造而成的。从左到右，背景中的前两个显示器是运行记分牌软件的 NUC 的主显示输出。文本窗口是 Python 程序的输出，而记分牌本身则位于辅助显示器输出上。第三个显示器可以通过视频矩阵路由以选择显示内容。前景中是矩阵控制触摸屏和摄像机控制器。高显示屏是切换器多画面监视器。NUC
    和矩阵位于桌子下方机架的最底部，清晰可见。


    输入可以连接到尽可能多的输出。换一种说法，所有输出都可以显示同一个输入，但每个输出一次只能显示一件事。当做出选择时，选定的输入和输出会像直接接线一样连接在一起。这些连接可以根据篮球比赛的需求在一天中随时轻松更改。


    ### 视频信号与转换


    许多不同的视频格式可以通过电缆传输实时视频。由于 HDMI 自引入以来被广泛采用，你对此可能并不陌生。此处讨论的视频系统主要使用串行数字接口（SDI），这是一种用于广播视频的数字标准。这些格式之间存在硬件转换器，因此在它们之间切换就像连接每种类型的电缆一样简单。这种转换的代价是视频信号会有轻微的延迟，通常不易察觉；然而，如果你叠加了多个转换，延迟可能会开始累积并变得可见。这种场景通常表现为音频与其相关视频不同步。


    ### 记分牌


    除了队伍得分外，记分牌还提供其他比赛信息，例如剩余时间、比赛节数、暂停或球员号码。图 3 展示了程序的总体流程。在程序启动时，图形初始化并渲染记分牌的初始状态。与此同时，Web
    服务器启动，操作员在侧边电脑上打开此页面（图 4）。


    随着篮球比赛的进行，操作员使用 Web 界面更新比赛比分和其他统计数据。


    ![](img/740bd926461af28ed755753238e647a2_64_1.png)


    **图 3：** 服务器、客户端、显示器及其相关库彼此通信和交互。


    Web 界面上的每个操作都从运行在浏览器中的 JavaScript 函数开始，通过后台 Ajax 调用与 CherryPy [2] 服务器通信。当 CherryPy
    接收到这些命令时，它会更新图形屏幕以反映记分牌本身的变化，然后将更新后的值发回浏览器，以便操作员界面也得到更新。


    列表 1 展示了记分牌背后的一些代码。（你可以在线下载完整代码 [3]。）首先，必须导入程序所需的外部库：pygame 图形库 [4] 用于绘制记分牌；`thread`
    允许程序的多个分支同时运行，因此你可以同时运行记分牌显示和 Web 控制界面；`pymysql` 是 Python 的 MySQL 数据库库；而 cherrypy
    则设置 CherryPy 框架。


