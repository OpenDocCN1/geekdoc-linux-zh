    f，传入两个球队候选项；这些组合在图 4 中由红色箭头标记。调用方随后使用此结果评估组合，以最终锁定最佳结果。


    ![](img/740bd926461af28ed755753238e647a2_62_0.png)


    这个以非常紧凑方式实现的过程生成了所有可能的组合。在图 5 中，为了说明目的，我将问题简化为六名球员。然而，它仍然不完美，因为它还将对称的比赛（A 队对 B
    队以及 B 队对 A 队）作为新情况进行评估。不过，由于事件空间很小，这并不是一个大问题。


    ![](img/740bd926461af28ed755753238e647a2_62_1.png)


    通过 build 命令生成的暴力二进制文件会启动并指向 teams.yaml YAML 文件，遍历所有可能的球队组合，并根据评估函数输出最佳数值。


    ```go

    go build brute.go

    teams.go

    diff.go

    ```


    图 6 和图 7 展示了两种可用的设置示例，一种针对开头提出的包含六名球员池的任务，另一种针对拥有八名球员两队的游戏。


    ![](img/740bd926461af28ed755753238e647a2_62_2.png)


    在这两种解决方案中，算法都找到了每队都有一名守门员且进攻和防守的球员技能值大致平衡的分配方案。这将使比赛保持到最后时刻的紧张刺激，假设所有球员都发挥了 100%
    的水平，但这又是另一个故事了。


    1. Michalewicz, Zbigniew, and David B. Fogel. How to Solve It: Modern Heuristics.
    Springer, 2004, https://link.springer.com/book/10.1007/978-3-662-07807-5


