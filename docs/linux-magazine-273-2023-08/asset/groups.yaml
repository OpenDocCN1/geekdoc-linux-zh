    \ 年 7 月  \n**开放数据**\n\n![](img/740bd926461af28ed755753238e647a2_94_0.png)\n\n\
    只要政府保存数据，就会有人想查看它，也有想控制它的人。新一代的工具、政策和支持者寻求保持数据自由、可用且格式可访问。本月，我们为你带来追求开放数据的快照。\n\
    \n**DVD 内容：** xubuntu 23.04 桌面版和 Fedora 38 工作站版\n\n### #271/2023 年 6 月  \n**智能家居**\n\
    \n![](img/740bd926461af28ed755753238e647a2_94_1.png)\n\n智能家居解决方案将为你节省时间和能源——而且，我提过吗，你还可以让你的朋友目瞪口呆。本月，我们将向你展示如何使用智能设备和开源自动化软件来控制你的家庭环境。\n\
