    \ 3 所示。\n\n### 存储数据\n\n你现在拥有一个完全功能的应用程序来跟踪你的待办事项，但该应用程序将在你退出时忘记这些项目。为了解决这个问题，你可以连接数据库或将数据存储在文件中。然而，Fyne\
    \ 允许你将数据存储在 Preferences 中，这是一个简单的键值存储，用于轻松跟踪用户界面状态和小型数据存储，而无需担心文件存储或连接处理。你可以使用之前创建的\
    \ `App` 类型上的 `Preferences()` 方法访问此功能。\n\n### 加载待办事项\n\n你需要确保在应用程序启动时加载任何现有的待办事项。为此，你可以简单地设置\
    \ `todos` 变量为 `loadAll` 的结果。在调用 `loadUI` 之前，你需要调用\n\n```\nlist = loadTODos(a.Preferences())\n\
    ```\n\n此调用将你的应用程序偏好设置传递给一个新的 `loadTODos` 函数，该函数将返回所有存储的待办事项切片。\n\n### 保存数据\n\n\
    在你有数据要解析之前，你需要保存它！为此，你将使用另一个新方法 `saveTODos`，它将接收要保存的当前切片和你将使用的偏好设置引用：\n\n```\n\
    saveTODos(todos, p)\n```\n\n务必在更新数据后，在 `deleteTODO` 和 `addTODO` 内部调用此方法。在此示例中实际执行工作的那些方法非常简单——你只需使用\
    \ `joiner` 常量将所有项目拼接成一个字符串，然后在 `load` 时拆分项目，如列表 11 所示。\n\n### 列表 11：storage.go\n\
    \n```\n01  package main\n02\n03  import \"fyne.io/fyne/v2\"\n04\n05  const joiner\
    \ = \",\"\n06\n07  func loadTODos(p fyne.Preferences) []string {\n08      all\
    \ := p.String(\"items\")\n09      if all == \"\" {\n10          return []string{}\n\
    11      }\n12      return strings.Split(all, joiner)\n13  }\n14\n15  func saveTODos(items\
    \ []string, p fyne.Preferences) {\n16      allItems := strings.Join(items, joiner)\n\
    17      p.SetString(\"items\", allItems)\n18  }\n```\n\n### 本地存储或云端\n\n无论你的操作系统或设备如何，列表\
    \ 11 都会为你存储数据。然而，许多应用程序现在希望信息集中存储在云服务上。好消息是 Fyne 也支持这一点！使用与列表 11 完全相同的代码，你可以为你的数据拥有一个云端后端，只需在应用程序中调用\
    \ `SetCloudProvider` 并提供适当的提供商描述即可设置。你可以在一期最近的 Fyne-Conf 视频中查找关于设置此功能的更多信息 [3]。\n\
    \n### 打包和安装\n\n一旦你完成了你的应用程序，下一步就是让它更容易为你自己或他人使用。\n\n首先，你需要在安装或分享应用程序之前添加一个图标。\n\
    \n虽然 Fyne 是一个基于矢量图形的工具包，但你需要一个位图图像作为应用程序图标。为了获得最大的兼容性，创建一个 1024x1024 的 PNG 文件，将其命名为\
    \ `Icon.png`，并保存到项目文件夹中。创建后，这将用作应用程序图标。打包应用程序的最佳方法是使用 `fyne` 命令行工具：\n\n```\n>\
    \ go install fyne.io/fyne/v2/cmd/fyne@latest\n```\n\n安装完成后，你可以调用 `fyne package`\
    \ 来设置应用程序包。它将使用当前操作系统的适当格式。你也可以使用 `fyne install` 同时安装。这将打包应用程序并将其放入你的标准应用程序位置（对于大多数\
    \ Linux 发行版是 `/usr/local/bin`）。\n\n如果你收到“命令未找到”的消息，请确保 `Go` 二进制文件位置（通常是 `~/.go/bin`）在你的\
    \ `$PATH` 中。完成后，应用程序将出现在你喜欢的应用程序启动器中（图 4）。\n\n### 与他人分享\n\n在分享你的应用程序之前，你应该考虑为新手添加一个教程。对于一个待办清单应用程序来说，这真的很容易，因为你可以在应用程序之前未使用时向\
    \ UI 添加项目 – 使用 `GetString` 配合 `GetPreferenceString` 的 `Fallback`。当请求的偏好设置键之前未保存时，将使用回退情况。尝试以下操作：\n\
    \n![](img/740bd926461af28ed755753238e647a2_44_0.png)\n![](img/740bd926461af28ed755753238e647a2_45_0.png)\n\
    \n"
