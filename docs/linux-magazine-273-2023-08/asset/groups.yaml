    relatively little overhead (Figure 7).


    For mastering, you mainly need plugins for the equalizer and compressor/limiter.
    Much has happened in this sector in terms of free extensions for Linux in the
    last two or three years. In addition to simple classics from the LADSPA era like
    the FooLimiter and high-end convenience plugins from Calf, you will find new modules
    that offer even more settings and elaborate, well-designed graphical interfaces
    of very high quality (Figure 8).


    ![](img/740bd926461af28ed755753238e647a2_27_0.png)


    **Figure 7: The Ardour mixer follows a philosophy that says the most annoying
    feature is the one that’s missing. In terms of signal routing, it’s hard to imagine
    more possibilities.**


    ### Hear, Hear!


    One way to listen to audio while mixing and recording is to use headphones. For
    tests, I often use AKG’s classic K240 DF and a fairly new offering by the name
    of MC-350 (Figure 9) by Mackie. The MC-350 headphones differ significantly from
    AKG by offering noise-canceling. The design is much like that of earmuffs for
    hearing protection, and it prevents the signal mixing with the ambient noise.
    When recording voices or guitars, this gives you a sound that you can’t achieve
    at all with speakers and only to a limited extent with open headphones. You can
    hear the recorded signal without it mixing with the sound output in the room at
    the same time.


    The result is sometimes amazing. A guitar voice amplified by guitariX (a guitar
    amplifier for Linux running on JACK), which seems beautifully round and musical
    in the test with Tannoy’s speakers, sounds totally distorted and lacking distinguishable
    harmonies through the Mackie headphones, and this is exactly what the recording
    actually sounds like. This is definitely not because the Mackie somehow can’t
    handle the signal. The headphones don’t distort anything, they just relentlessly
    reproduce the settings selected in guitariX. If you listen to the track through
    the speakers, it mixes with the internal sound of the Ibanez RG guitar being played,
    with these well-defined acoustic sounds merging with the fat crunch of guitariX.


    In a nutshell: Especially when you are setting up effects for acoustic signals,
    it is a good idea to use headphones. This revealing effect is less extreme with
    the open AKG headphones. But you can also discover the error by simply turning
    up the volume a bit.


    ### The Right Speakers


    If you produce audio yourself, you should be careful not to be too swayed by equipment
    trimmed for good looks. Mixes made with mid-range hi-fi equipment have a strong
    tendency to sound poorer, duller, too spiky, and thus unlike what the artist intended.


    Monitors for sound engineers sound analytical. They don’t emphasize what the listener
    finds particularly brilliant, and they don’t exaggerate the thrust that bass produces.
    To achieve this, they avoid distortion and coloration to the extent possible and
    reproduce sounds in a particularly well-defined manner – spatially, so that the
    individual voices can be precisely balanced in the mix.


    I tested these capabilities with a classic pair of speakers, the 2-way Tannoy
    Reveal Near-Field Studio Monitor system with built-in 50-watt amplifiers (Figure
    10). I set up the boxes in an triangle at a distance of about 1.20 meters from
    the workplace (see the “Speakers Set Up Correctly” box). This way, you can hear
    everything, including the errors. The spatial representation seems noticeably
    stronger than with the stereo system setup in the same room featuring a Denon
    amplifier and two 3-way hi-fi speakers by Canton.


    The Tannoy speakers are available second hand for about EUR 200. Together they
    weigh 10 kilos and expect a signal from a jack cable fed in by a decent interface.
    Can a small, lightweight compact device like the StealthBar by Mackie for EUR
    100 match this? As the name suggests, the StealthBar is a compact bar that is
    best positioned under the screen. The device is a USB interface and a Bluetooth
    speaker at the same time (see the box entitled “Using the StealthBar Correctly”).
    Although the StealthBar is only 50 centimeters wide, it delivers good stereo mapping,
    even if it requires a bit more concentration to implement the spatial impression
    with the small speaker.


    ### Analyzing the Room Acoustics


    If your own space is acoustically quirky and not representative of a general listening
    environment, tailoring the sound so it


    ### Speakers Set Up Correctly


    One of the biggest advantages that headphones offer is their ease of use: No matter
    where you put them on, they always sound the same. Compared with this, the sound
    waves output by speakers into the room are reflected by the walls, and the sound
    also strongly depends on the positioning. The most important rule of thumb is
    that you need to sit exactly in the center between the speakers. The ideal is
    an isocleses triangle, the size of which you need to adjust to the physical properties
    of the speakers. The StealthBar, on the other hand, is optimized for a short distance;
    you get the best spatial impression at a distance of about one meter. It still
    sounds OK at a greater distance, but locating voices in the stereo mix is more
    difficult. For Tannoy’s near-field monitors, the manufacturer recommends an isocleses
    triangle at head height with a side length of about two meters. In the absence
    of a very large room and proper tripods, I have the Tannoy’s set up at opposite
    ends of a desk with a width of two meters. To listen really intensely, I have
    to roll my chair away from the desk slightly.


    ![](img/740bd926461af28ed755753238e647a2_28_0.png)


    **Figure 8: If you are missing any adjustment options in Calʼs mastering plugins,
    take a look at LSPʼs EQs and dynamics processors. In terms of signal routing,
    itʼs hard to imagine more possibilities.**


    ### Using the StealthBar Correctly


    Fortunately, the small compact system supports every possible connection option.
    The StealthBar can be used as a good USB master directly with JACK, as well as
    a plain vanilla output device for another interface. Integrated as a master via
    USB with JACK, it is unobtrusive. On the back, there is a mini-jack input that
    feeds the stereo-in of the USB interface. As a nice extra, the StealthBar offers
    a Bluetooth interface. No problem for PulseAudio: Immediately after pairing, sound
    output from the browser is audible. Unfortunately, this Bluetooth port is not
    integrated into JACK. Even if you ignore the additional latency of PulseAudio,
    you can’t listen to sounds from Ardour and other JACK applications in this way.
    But what if you want to use JACK with a different interface? In this obvious case,
    you need to connect the stereo output of the device to the back of the StealthBar
    via the mini-jack. Then, just like with Tannoy’s classic monitors, the StealthBar
    works as an active analog monitoring speaker.


    ![](img/740bd926461af28ed755753238e647a2_28_1.png)


    **Figure 9: The Mackie headphones, shown here next to the StealthBar speaker,
    are also available in white.**


    ![](img/740bd926461af28ed755753238e647a2_29_0.png)


    ![](img/740bd926461af28ed755753238e647a2_29_1.png)

