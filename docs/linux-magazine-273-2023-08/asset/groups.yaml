  mdcn: "\n\n![](img/740bd926461af28ed755753238e647a2_16_0.png)\n\n你录制更新的频率与单集时长密切相关。制作两集各\
    \ 30 分钟的播客，远比制作一集 1 小时的播客要好。一般来说，你制作播客的频率越高越好。每周一次是理想的选择。这能让你的播客时刻保持在听众脑海中，并帮助他们记住你。每两周更新一次是另一个不错的选择，尤其是作为起步阶段，但每月一次可能太少了。无论哪种方式，你的播客更新频率越高，你每月的下载量就越大，这对于未来你想要售卖广告赞助非常有帮助。\n\
    \n当播客单集预计何时发布时，清晰地进行沟通至关重要——并且要严格遵守。无论是刮风下雨，还是 PulseAudio 故障或硬盘崩溃。这是区分业余爱好者和专业人士的唯一标志；专业人士明白听众需要一个绝对可预测的例行安排。可预测的发布是实力和稳定的标志，因为没有人愿意把时间投入到最终可能会无疾而终的事情上，而且你的听众越需要费力去弄清哪一集是上一集、哪一集是下一集，你失去的听众就越多。\n\
    \n## 群众的力量\n\n三到四个联合主持人是一个理想的数字，因为这能让听众熟悉你们的人格特点，并让他们感觉置身于朋友之间（图 1）。联合主持人可以分担承担职责、进行研究、提出反对意见、从另一个视角进行讨论，或者仅仅是在另一位主持人无法出席时进行补充的负担。如果你们彼此已经相识，并且在相处时感到舒适且相对放松，那会很有帮助。即使是经过周密计划或有剧本的播客，听众也享受不可预测的部分，而自发的、发散性的对话是其中重要的一部分。重要的是，主持人们对主题的不同意见需要得到体现。播客不应该成为最强人格者的虚荣项目，更糟糕的是，不应该成为制作播客的那个人的一言堂。\n\
    \n主主持人的角色是整个播客事业中最重要且最被低估的。主主持人是代表听众提问的人，对谈话内容是否可能被理解保持敏感。这在有专家参与时尤为重要——专家可能会假设听众具备某种知识水平，而这是你无法假定你的听众都具备的，主主持人的工作就是在必要时要求澄清观点或挑战假设。主主持人还应确保所有主持人都平等地参与对话，例如询问较安静的主持人的意见，或者打断冗长发言者的独白，给其他人分享意见的机会。\n\
    \n无论谁负责推进播客，都需要做到微妙和透明。如果他们做得很棒，没人会注意到。这是一项吃力不讨好的工作，甚至可能削弱你在主持动态中的地位，因为你从多个角度扮演了多个角色，但让某个人承担这个角色至关重要，而最好由播客的创始人来承担。\n\
    \n![](img/740bd926461af28ed755753238e647a2_16_1.png)\n\n**图 1：** 联合主持人之间的融洽关系有时比播客创意本身更重要，尽管混合不同的人格和观点也是至关重要的。\n\
    \n![](img/740bd926461af28ed755753238e647a2_17_0.png)\n\n**图 2：** 现场表演和录制播客可能非常有趣，但这并不一定意味着能产生质量最高的单集。\n\
    \n## 发布与分析\n\n在达成一致的计划、完成录音以及至关重要的编辑步骤之后（图 2），你准备好向全世界分享你的播客了。我们显然建议你在知识共享许可证下发布你的播客，许多基于\
    \ Linux 的播客选择知识共享署名-非商业性使用（CC BY-NC）或署名-相同方式共享（CC BY-SA）许可证。如果你不介意别人从你的作品中获取经济价值，CC\
    \ BY-SA 许可证是理想的选择。选择其中一种也有助于音乐和标志的选择，因为这样就可以自由地在自己的播客中使用类似许可的创意作品。\n\n在片头、片尾和片段转换中使用音乐可以为你的播客增添专业的制作质感。虽然通过\
    \ Fiverr 等平台可以廉价地委托制作音乐和设计作品，但选择知识共享许可的媒体能给你更大的控制权。例如，许多知识共享音乐曲目是以*分轨*（stems）包的形式提供的，捆绑了用于制作最终混音的单个轨道。这为播客制作者提供了很大的灵活性，让他们可以重复音乐的某一部分，移除人声轨道，或者创建一个完全不同的混音，适合嵌入播客中。\n\
    \n下一个大问题是你打算如何托管你的播客。一个 30 分钟的单声道播客通常约为 30MB。一个中等成功的播客可能拥有 10,000 名听众，每集需要大约 300GB\
    \ 的带宽。自托管通常足以起步，特别是如果你能获取一个与播客相关的域名名，你可以为每集发布相关内容设置 WordPress 等动态 CMS，或者使用静态站点生成器，在每次发布时更新。另一个重要方面是社区反馈，值得提供几种选项，包括电子邮件或基于网页的评论，以及维护成本低廉且更容易的选项，如\
    \ IRC 账号、Telegram 群组或 Discord 服务器。Spotify 可以为你处理所有这些，但你会失去对后续如何发布或聚合你的播客的控制权。\n\
    \n当然，没有 RSS 订阅源，播客就不成其为播客。RSS 仍然是你发布播客以及人们收听播客的核心。RSS 文件是一种 XML 格式的文本文件，播客播放器解析它来了解播客位于何处以及有哪些可用的单集（参见题为“播客\
    \ RSS 格式”的方框）。\n\nRSS 足够简单，可以手动创建，你会在 WordPress 和其他站点上找到插件，使这一过程更加无痛。让你的播客被纳入\
    \ Apple 的播客计划 [2]、Spotify 的类似计划 [3] 或 YouTube 也很容易，尽管对于 Apple 和 Spotify，你需要同意并接受某些内容、RSS\
    \ 格式化和编码要求。你可以使用播客聚合服务或托管商绕过所有这些，他们乐于提供你的播客服务，提交给最热门的服务以纳入其中，甚至代表你谈判广告。聚合服务通常前期费用很低，尽管它们会从广告收入中抽取相当大的一块。\n\
    \n关于金钱的话题，从播客中赚钱很难，且不应是你的主要动机。不过，你可能会赚足够的钱来支付托管费和设备费。对于开源和与 Linux 相关的播客，你可能需要考虑使用\
    \ Patreon [4]，它让听众可以少量捐款支持播客的运营。你可以通过为支持者提供额外内容、提前收听单集，或提供无广告的播客订阅源来鼓励这种行为。你也可以出售商品（图\
    \ 3）或为播客出售广告。销售广告是一项独特的技能，但如果你乐于接受挑战，没有什么能阻止你联系你认为可能感兴趣的公司，以谈判广告、赞助或产品评测。这些通常根据公司的广告预算，按季度或每六个月提前谈判，广告主希望看到稳定的听众数量、收听小时数，以及对其广告的一定程度的参与度——通过联盟链接或通过播客专属的优惠券代码或类似方式。\n\
    \n![](img/740bd926461af28ed755753238e647a2_17_1.png)\n\n**图 3：** 资助播客的方式之一是通过商品，这些商品通常可以按需制作和发货，供应商按整体价格的特定百分比收取费用。\n\
    \n## 播客 RSS 格式\n\nRSS 文件包含指向每个单集的链接、诸如时长和大小之类的元数据，以及一个链接回你整体网络存在的部分（图 4）。听众通过\
    \ RSS URL 订阅，并在新一集发布后立即收到推送。创建自己 RSS 订阅源最简单的方法是使用 CMS（如 WordPress）的插件，或者复制类似播客的\
    \ RSS 订阅源。找到一个 XML 编辑器可能有帮助，例如 Red Hat 的 Visual Studio Code XML 扩展，用它删除除一个播客单集外的所有内容，然后简单地用你自己的元数据替换。播客特定内容保存在\
    \ `<channel>` 元素中，第一部分用于描述你播客的全局数据，如名称、描述以及图片和标志的链接。在此之下，每个单集封装在 `<item>` 标签内，包含特定于每个单集的类似详细信息。\n\
    \n提供有意义的统计数据出奇地困难，且与你可能熟悉的基于 Web 的指标有很大不同。许多播客播放器会为单个听众打开多个流，离线缓存播客，或根本无法听完一集。你可以仔细构建针对唯一\
    \ IP 地址和下载兆字节的分析，但通常依靠 Apple Podcasts、Spotify 和 YouTube 提供的更先进的工具更容易，这些工具通常可以突出最流行的部分，并通过评论或反馈帮助促进参与度。然后可以将这些数字外推以包含自托管的下载量。但尽量不要过多地思考这些数字。它们可以是增长的一个有用指标，但它们自然会在一年中波动，且通常很难从中推导有意义的得数据。忠于你最初的计划和愿景，但最重要的是，享受乐趣。其他的一切都会随之自行解决。\n\
    \n### 信息\n- 1. 英语播客历史：[https://historyofenglishpodcast.com](https://historyofenglishpodcast.com)\n\
    - 2. Apple 播客创作者中心：[https://podcaster.apple.com/](https://podcaster.apple.com/)\n\
    - 3. Spotify 播客创作者中心：[https://podcaster.spotify.com](https://podcaster.spotify.com)\n\
    - 4. Patreon：[https://www.patreon.com](https://www.patreon.com)\n\n### 作者\nGraham\
    \ Morrison 是一位杰出的 Linux 作者和编辑。他为 *Linux Magazine* 撰写 FOSSPicks 专栏，并近 14 年来几乎每两周（现在每周）制作播客，最初是在他编辑、制作和出版的\
    \ *TuxRadar* 上，最近则是在 *Late Night Linux* 上。\n\n![](img/740bd926461af28ed755753238e647a2_18_0.png)\n\
