    ### 链接管理器


    ## wallabag


    只要有网页浏览，就有保存和管理链接以备后读的方法。当然，大多数人使用书签，但跨设备同步书签或使用第三方服务保存书签并缓存其内容以提高可读性或离线访问也是常见的做法。其中最好的选择之一是
    Pocket，这是一个以前被称为 Read It Later 的商业订阅服务，拥有慷慨的免费层级，并于 2017 年被 Mozilla 公司收购。得益于其商业背景及其在
    Mozilla 下的持续支持，Pocket 拥有成熟的平台支持，包括 Android、iPad、iOS、macOS 和 Windows 应用程序，以及 Firefox
    的第一方集成。这使得 Pocket 方便且随时随地可访问。它甚至是创建这些页面的核心，因为作者广泛使用它来缓存他们在任何机器或设备上发现的开源软件。


    尽管 Mozilla 身为 Firefox 和开放 Web 的守护者，并做出了相反的承诺，但 Pocket 的服务器代码仍然是专有的，而且该服务最近去除了其最有用的功能之一。这是通过向特定地址发送电子邮件将链接添加到你的
    Pocket 账户的能力。如果你手头没有集成的客户端，这是一个很好的解决方案；如果你使用的是不支持 Pocket 的 Web 浏览器（例如优秀的 albertbrowser），这也是唯一的选择。这就是我们引入真正的开源替代方案的地方，而
    wallabag 是其中最好的。Wallabag 是一个 PHP Web 应用程序和服务器，配有相应的应用程序和浏览器集成。你可以自行托管服务器，或者支付少量费用（约
    10 美元）使用该项目的托管服务。自行设置相对复杂，但可以使用廉价的 VPS 或家庭服务器完成。你需要域名、NGINX、MySQL/MariaDB、Let’s
    Encrypt 以及一些配置微调——这对普通的 Linux 爱好者或系统管理员来说都不是什么难事，早餐前就能搞定，而且为了隐私和安心，经常值得这样做。然后你可以从
    Web 客户端为任何配套应用程序生成客户端密钥，这些应用程序将在你调用时安全且私密地将链接添加到你的账户。


    ![](img/740bd926461af28ed755753238e647a2_81_1.png)


    巧妙的标签系统可用于手动对链接进行分类，或使用自动模式匹配，例如将某些网站列为“科学”或“合成器”。无论你是使用 Web 门户，还是 Android 和 iOS
    应用程序来阅读保存的内容，这些都能使浏览新链接和存档链接变得更加易于管理。每个客户端都会提取你的链接内容，允许你在 wallabag 自己的无干扰阅读环境中阅读文章，或者你可以使用集成的
    RSS 生成功能将你的链接列表转换为 RSS 源，用于原生 Linux 新闻阅读器（如 Read It Later），甚至使用 Calibre 自动将文章发送到你的墨水屏设备。甚至还有一个命令行客户端用于添加、删除和标记文章，它完美替代了
    Pocket 旧的电子邮件功能，让你可以为任何浏览器或脚本解决方案添加 wallabag 支持。Wallabag 之所以表现出色，是因为它是开源的，开发者可以使其在从
    Emacs 到 macOS 上的 Safari 等任何地方正常工作，现在是尝试它的最佳时机。


    - 1. **自托管：** 即使是 Raspberry Pi 也可以运行服务器，或者使用廉价的 VPS，但你自己的域名是必需的。

    - 2. **浏览器集成：** 大多数浏览器（包括 Firefox）都可以集成 wallabag 插件，以便无缝地将网站和标签添加到你发现的链接中。

    - 3. **缩略图或列表视图：** 缩略图预览视图包含任何保存网页的简介。

    - 4. **标签：** 你自己的标签可以手动添加，或者（更重要的是）根据特定规则自动添加。

    - 5. **终端客户端：** 可以使用命令行工具添加、删除和列出你的链接。

    - 6. **文章视图：** Wallabag 会提取文章内容，使其更具可读性和可访问性。

    - 7. **导入：** 从许多其他服务（包括 Pocket、Readability 和各种书签管理器）添加你的链接数据库。


    **项目网站**

    https://www.wallabag.it


