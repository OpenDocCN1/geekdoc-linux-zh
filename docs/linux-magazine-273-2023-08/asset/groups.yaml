  - '[PAGE 10]


    You can read a very in-depth post, written by KDE developer Xaver Hugel (https://zamaduaa.github.io/wayland/2023/05/18/hdr-and-color-management-in-kwin.html),
    about HDR and color management in KWin. In his post, Hugel says, “We didn''t do
    a lot of hacking at the hackfest, but I did manage to drive an HDR screen with
    a wide color gamut and with HDR mode enabled while having KWin do the required
    color conversions to make SDR content look correct.”


    One thing to keep in mind is that, with KDE Plasma 6, Wayland will be the default
    display manager.


    Also, according to Hugel, HDR support will be “quite basic at first.” Because
    of that, users won''t be able to jump in and immediately watch videos or play
    games in HDR. The development team has a long road ahead of them before HDR support
    in Linux matures.


    # ## Bodhi Linux 7.0 Beta Ready for Testing


    Bodhi Linux has been around for some time now, and the latest release promises
    new versions of software, better hardware support, heightened security, improved
    performance, and much more to entice new users and please those who have been
    on board.


    Front and center of the new version is Moksha 0.4.0-8 desktop, which includes
    a number of improvements, including completely refactored modules, a new keybindings
    viewer, better window snapping, Do Not Disturb feature for menu items, an In-ternal
    Notification API which was backported from e25, and much more. As well, there
    are new themes for both Plymouth and the Greater application.


    For the base, you''ll find Ubuntu 22.04.2 LTS, a choice of three different kernels
    (Standard 5.15.0-71-generic, HWE 5.19.0-41, and 6.2.6), EFL 1.26.99-2, the mozillateam
    PPA, kelebek333''s PPA, nvidia-legacy PPA, and Ubuntu Backports is enabled.


    A lot of work has also gone into improving and fixing the many modules included
    with Bodhi Linux, and there''ve been plenty of software updates, including Chromium
    (non-Snap version) 113.0.5672.63, Terminology 1.13.1-3, the Web Browser Manager
    (which allows you to select any number of browsers to install), and Thunar 4.16.


    You can read all about version 7.0 here (https://www.bodhilinux.com/release/7-0-0/)
    and download the beta version here (https://sourceforge.net/projects/bodhilinux/files/7.0.0-beta/).


    # ## Changes Coming to Ubuntu PPA Usage


    With the upcoming Ubuntu 23.10 (Mantic Minotaur), there will be a considerable
    change to how PPAs are handled. As you may know, in the current iteration of the
    software-proprieties software, when you add a PPA from the command line, a .list
    file is created in /etc/apt/sources. 1list.d/, and the associated GPG key is added
    to /etc/apt/trusted. gpg.d/.


    When 23.10 is released, those PPAs will use the Deb822 format for .source files
    and their corresponding GPG keys will be added directly to the file in a Signed-By
    field. This means users won''t have to manage a collection of .1.1st files.


    According to the developers, this change offers one very important benefit: When
    a PPA is removed from a system, the GPG keys will be automatically removed as
    well. Keys will now be unique to a PPA and cannot be used for other repositories,
    and other keys cannot be used to sign a PPA. These benefits will go a long way
    to enhance the security of PPAs. Another benefit of the new system is that users
    won''t have to worry about deleting .1ist files that can accumulate on a system.


    Of course, there''s always a downside, the biggest of which is that PPAs will
    have root access to a system. Because of this, a program maintainer could add
    malicious code to a repository, and the next time you upgrade, that malicious
    code would be installed and have unfettered access to your machine.


    Read the announcement from the ubuntu-devel mailing list (https://lists.ubuntu.com/archives/ubuntu-devel/2023-May/042573.html).'
  - "[PAGE 11]\n\n![](img/740bd926461af28ed755753238e647a2_11_0.png)\n\n> Chronicler\
    \ Zack Brown reports on the latest news, views, dilemmas, and developments within\
    \ the Linux kernel community.\n\n*By Zack Brown*\n\n**Author**\n\nThe Linux kernel\
    \ mailing list comprises the core of Linux development activities. Traffic volumes\
    \ are immense, often reaching 10,000 messages in a week, and keeping up to date\
    \ with the entire scope of development is a virtually impossible task for one\
    \ person. One of the few brave souls to take on this task is **Zack Brown**.\n\
    \n# ### Rust in Linux\n\nA fascinating aspect of Linux kernel development has\
    \ been the attempts to switch away from C and assembly language to something else\
    \ like C++. Linus Torvalds is notorious for caring a lot about the beauty of the\
    \ kernel code as well as important features such as CPU and RAM usage and security.\
    \ For him to accept any other language, it would have to be a pretty amazing language.\
    \ For comparison, the developers tried adding C++ support to the kernel in the\
    \ late 1990s, but it didn’t pass muster.\n\nThe Rust programming language is the\
    \ first serious attempt by kernel developers to add support to the kernel since\
    \ then. Linux followed a rudimentary first attempt to go into kernel version 6.1\
    \ in late 2022. Since then, many more Rust patches have been submitted. Unlike\
    \ the case with C++, Rust doesn’t seem to be leaving any time soon. Instead, it\
    \ seems as though Linus is fairly committed to giving it a real try.\n\nIt’s a\
    \ surprising decision because Rust is so new. Rust was invented in 2006 while\
    \ C++ was invented in 1979. Even today, Rust has hardly taken over the world.\
    \ And yet it has been given this amazing pride of place in the Linux kernel. I’m\
    \ not denigrating! It’s fascinating to consider Rust’s characteristics that would\
    \ place it even above C++ as being welcome into the kernel development process.\
    \ However, it’s not at all surprising that Linus would evaluate a new language\
    \ based on its merits rather than its popularity.\n\nIncorporating Rust into the\
    \ kernel takes a twisting and turning path. The portions of the kernel written\
    \ in C and assembly need to connect with the portions written in Rust in such\
    \ a way that there’s no loss of speed or security, and in such a way that both\
    \ Rust and C developers can write good and readable code.\n\nFor example, Wedson\
    \ Almeida Filho recently posted a patch to introduce a mutex structure for Rust\
    \ that, as he put it, “allows Rust code to use the kernel mutex idiomatically.”\n\
    \nWedson’s patch modifies both C and Rust files in the kernel source to add this\
    \ support. If you’re curious what the Rust code would look like for a mutex initialization\
    \ routine, here is a snippet of Wedson’s patch:\n\n```\n```rust\nmacro_rules!\
    \ new_mutex {\n    ( $(inner:expr $ (, $name:literal)? )? $\n      $(,)*) => {\n\
    \        $(sync::Mutex::new(\n            $inner, $name ?\n        ))\n      \
    \  $(crate::$optional_name($( $name)?), ?\n        $(crate::static_lock_class!())\n\
    \    );\n}\n```\n```\n\nRust is a strange and fascinating language that is seemingly\
    \ so different from C, but with features that make it a welcome addition to the\
    \ kernel project.\n\nPeter Zijlstra replied, “I despise all these stupid helpers\
    \ … but I suppose it’s the best they could come up with to interface the languages\
    \ :/ The only hope is that the thing can do cross-language LTO [Link Time Optimization]\
    \ or something to re-inline stuff.”\n\nWedson replied:\n*One thing we could [do\
    \ to improve the situation is] to convert some of the existing macros into inline\
    \ functions on the header files.*\n*We can’t do it for all cases (e.g., cases\
    \ like mutex_init that declare a new static variable when lockdep is enabled)\
    \ but mutex_lock is just a function when lockdep is disabled, and just calls mutex__lock_nested()\
    \ when it is enabled.*\n*How do you feel about this?”*\n\nIn reply, Peter asked,\
    \ “Can rust actually parse C headers and inline C functions? I thought the whole\
    \ problem was that it can only call C ABI symbols (which inline functions are\
    \ not).”\n\nWedson replied:\n*“Rust can’t. We use a tool called bindgen to read\
    \ C header files and generate equivalent Rust (extern “C”) declarations for functions.\
    \ The tool has been*"
  - '[PAGE 12]


    enhanced recently (https://github.com/rust-lang/rust-bindgen/pull/2335) to handle
    static inline functions by automatically generating helpers like the one above
    (in addition to the Rust decls).


    > “So the situation is improved in that we don''t need to manually write (and
    commit) the helpers. It may improve further in the future if we get better in-tegration
    of the languages.”


    Peter accepted this, saying that in that case, “feel free to convert macros to
    inline functions where the difference is moot. There is indeed no real reason
    for mutex_lock() to not be an inline function in that case.” In response to Wedson
    saying that Rust could not ac-tually parse C headers and inline func-tions, Peter
    added, “that''s sad, I was hoping it would write the equivalent inline function
    in rust.”


    David Light chimed in at this point, regarding converting macros to inline functions.
    He remarked, “mutex_lock() is probably ok. But there are cases where gc generates
    much better code for #de-fines than for inline functions. Almost certainly because
    the front end gets to optimise #defines, but inlines are done much later on.”


    Marco Elver suggested using ‘static __always_inline’ in C files for macros that
    would be better converted to inline functions. He asked, “Can bindgen deal with
    ‘static __always_inline’ functions?” And Miguel Ojeda replied, “If you mean the
    new feature where ‘bindgen’ gener-ates wrappers automatically, it seems to handle
    them given ‘__always_inline’ = > ‘inline’ which is what I imagine it looks for
    [..], though I haven''t tried to use the feature within the kernel yet.”


    Miguel, speaking for the Rust commu-nity, also said, “We initially minimized changes
    on the C side on purpose, but if maintainers are OK with that (modulo exceptions),
    it would be great.”


    The conversation ended there, though this thread is absolutely part of a much
    larger and ongoing discussion between the C and Rust communities of kernel developers.
    There are many Rust patches flying around these days that are being taken very
    seriously by both groups.


    Rust is a highly impressive language. Its designers seem to take the position
    that they will build protection against memory leaks and segmentation


    violations into the language itself, at the cost of including a few relatively
    convo-luted language features. They also seem to make it relatively easy to avoid
    these convolutions at the cost of writing slower code. So for someone who only
    wants the higher level language fea-tures, such as easy-to-use complex data structures
    in a fast compiled language, you can have that without too much language complexity
    if you don''t mind taking a small speed hit. For people who want code that is
    fully speed-com-petitive with the C language, you can have that if you take advantage
    of Rust''s more complex memory protec-tion features.


    I don''t know why Linus chose to ac-cept Rust into the kernel, but I speculate
    that it was precisely because of those memory protection features. There seem
    to be very few powerful low-level lan-guages that incorporate such features, and
    it seems like a tough needle to thread. I believe Linus probably feels that the
    compromise of Rust''s additional complexity as a language is a very fair trade
    for the protections it provides, which are also very difficult to find else-where.
    I''m fascinated to watch the fur-ther progression of Rust development in the Linux
    kernel.


    # Compiler and Kernel Frenemies


    Theodore Ts''o posted a patch to update the ext4 filesystem code, in the course
    of which he mentioned that another patch by Matthew Wilcox needed to be applied
    on top of his, making a particular func-tion return an error pointer instead of
    simply the null value.


    The details of Matthew''s patch (and Ted''s patch) are not necessary to know,
    and both patches were accepted into the kernel. However, Linus Torvalds commented:


    > “[It] would be wonderful if we could mark the places that return an error pointer
    as returning ‘nonnull’, and catch things like this automatically at build time
    where people compare an error pointer to NULL.”


    > “However, it sadly turns out that com-pilers have gotten this completely wrong.
    ‘gcc apparently completely screwed things up, and ‘nonnull’ is not a warn-ing
    aid, it''s a ‘you can remove tests against NULL silently’.”'
  md: "\nYou can read a very in-depth post, written by KDE developer Xaver Hugel (https://zamaduaa.github.io/wayland/2023/05/18/hdr-and-color-management-in-kwin.html),\
    \ about HDR and color management in KWin. In his post, Hugel says, “We didn't\
    \ do a lot of hacking at the hackfest, but I did manage to drive an HDR screen\
    \ with a wide color gamut and with HDR mode enabled while having KWin do the required\
    \ color conversions to make SDR content look correct.”\n\nOne thing to keep in\
    \ mind is that, with KDE Plasma 6, Wayland will be the default display manager.\n\
    \nAlso, according to Hugel, HDR support will be “quite basic at first.” Because\
    \ of that, users won't be able to jump in and immediately watch videos or play\
    \ games in HDR. The development team has a long road ahead of them before HDR\
    \ support in Linux matures.\n\n## Bodhi Linux 7.0 Beta Ready for Testing\n\nBodhi\
    \ Linux has been around for some time now, and the latest release promises new\
    \ versions of software, better hardware support, heightened security, improved\
    \ performance, and much more to entice new users and please those who have been\
    \ on board.\n\nFront and center of the new version is Moksha 0.4.0-8 desktop,\
    \ which includes a number of improvements, including completely refactored modules,\
    \ a new keybindings viewer, better window snapping, Do Not Disturb feature for\
    \ menu items, an Internal Notification API which was backported from e25, and\
    \ much more. As well, there are new themes for both Plymouth and the Greater application.\n\
    \nFor the base, you'll find Ubuntu 22.04.2 LTS, a choice of three different kernels\
    \ (Standard 5.15.0-71-generic, HWE 5.19.0-41, and 6.2.6), EFL 1.26.99-2, the mozillateam\
    \ PPA, kelebek333's PPA, nvidia-legacy PPA, and Ubuntu Backports is enabled.\n\
    \nA lot of work has also gone into improving and fixing the many modules included\
    \ with Bodhi Linux, and there've been plenty of software updates, including Chromium\
    \ (non-Snap version) 113.0.5672.63, Terminology 1.13.1-3, the Web Browser Manager\
    \ (which allows you to select any number of browsers to install), and Thunar 4.16.\n\
    \nYou can read all about version 7.0 here (https://www.bodhilinux.com/release/7-0-0/)\
    \ and download the beta version here (https://sourceforge.net/projects/bodhilinux/files/7.0.0-beta/).\n\
    \n## Changes Coming to Ubuntu PPA Usage\n\nWith the upcoming Ubuntu 23.10 (Mantic\
    \ Minotaur), there will be a considerable change to how PPAs are handled. As you\
    \ may know, in the current iteration of the software-properties software, when\
    \ you add a PPA from the command line, a .list file is created in /etc/apt/sources.list.d/,\
    \ and the associated GPG key is added to /etc/apt/trusted.gpg.d/.\n\nWhen 23.10\
    \ is released, those PPAs will use the Deb822 format for .sources files and their\
    \ corresponding GPG keys will be added directly to the file in a Signed-By field.\
    \ This means users won't have to manage a collection of .list files.\n\nAccording\
    \ to the developers, this change offers one very important benefit: When a PPA\
    \ is removed from a system, the GPG keys will be automatically removed as well.\
    \ Keys will now be unique to a PPA and cannot be used for other repositories,\
    \ and other keys cannot be used to sign a PPA. These benefits will go a long way\
    \ to enhance the security of PPAs. Another benefit of the new system is that users\
    \ won't have to worry about deleting .list files that can accumulate on a system.\n\
    \nOf course, there's always a downside, the biggest of which is that PPAs will\
    \ have root access to a system. Because of this, a program maintainer could add\
    \ malicious code to a repository, and the next time you upgrade, that malicious\
    \ code would be installed and have unfettered access to your machine.\n\nRead\
    \ the announcement from the ubuntu-devel mailing list (https://lists.ubuntu.com/archives/ubuntu-devel/2023-May/042573.html).\n\
    \n![](img/740bd926461af28ed755753238e647a2_11_0.png)\n\n> Chronicler Zack Brown\
    \ reports on the latest news, views, dilemmas, and developments within the Linux\
    \ kernel community.\n\n*By Zack Brown*\n\n**Author**\n\nThe Linux kernel mailing\
    \ list comprises the core of Linux development activities. Traffic volumes are\
    \ immense, often reaching 10,000 messages in a week, and keeping up to date with\
    \ the entire scope of development is a virtually impossible task for one person.\
    \ One of the few brave souls to take on this task is **Zack Brown**.\n\n### Rust\
    \ in Linux\n\nA fascinating aspect of Linux kernel development has been the attempts\
    \ to switch away from C and assembly language to something else like C++. Linus\
    \ Torvalds is notorious for caring a lot about the beauty of the kernel code as\
    \ well as important features such as CPU and RAM usage and security. For him to\
    \ accept any other language, it would have to be a pretty amazing language. For\
    \ comparison, the developers tried adding C++ support to the kernel in the late\
    \ 1990s, but it didn’t pass muster.\n\nThe Rust programming language is the first\
    \ serious attempt by kernel developers to add support to the kernel since then.\
    \ Linux followed a rudimentary first attempt to go into kernel version 6.1 in\
    \ late 2022. Since then, many more Rust patches have been submitted. Unlike the\
    \ case with C++, Rust doesn’t seem to be leaving any time soon. Instead, it seems\
    \ as though Linus is fairly committed to giving it a real try.\n\nIt’s a surprising\
    \ decision because Rust is so new. Rust was invented in 2006 while C++ was invented\
    \ in 1979. Even today, Rust has hardly taken over the world. And yet it has been\
    \ given this amazing pride of place in the Linux kernel. I’m not denigrating!\
    \ It’s fascinating to consider Rust’s characteristics that would place it even\
    \ above C++ as being welcome into the kernel development process. However, it’s\
    \ not at all surprising that Linus would evaluate a new language based on its\
    \ merits rather than its popularity.\n\nIncorporating Rust into the kernel takes\
    \ a twisting and turning path. The portions of the kernel written in C and assembly\
    \ need to connect with the portions written in Rust in such a way that there’s\
    \ no loss of speed or security, and in such a way that both Rust and C developers\
    \ can write good and readable code.\n\nFor example, Wedson Almeida Filho recently\
    \ posted a patch to introduce a mutex structure for Rust that, as he put it, “allows\
    \ Rust code to use the kernel mutex idiomatically.”\n\nWedson’s patch modifies\
    \ both C and Rust files in the kernel source to add this support. If you’re curious\
    \ what the Rust code would look like for a mutex initialization routine, here\
    \ is a snippet of Wedson’s patch:\n\n```rust\nmacro_rules! new_mutex {\n    (\
    \ $(inner:expr $ (, $name:literal)? )? $\n      $(,)*) => {\n        $(sync::Mutex::new(\n\
    \            $inner, $name ?\n        ))\n        $(crate::$optional_name($( $name)?),\
    \ ?\n        $(crate::static_lock_class!())\n    );\n}\n```\n\nRust is a strange\
    \ and fascinating language that is seemingly so different from C, but with features\
    \ that make it a welcome addition to the kernel project.\n\nPeter Zijlstra replied,\
    \ “I despise all these stupid helpers … but I suppose it’s the best they could\
    \ come up with to interface the languages :/ The only hope is that the thing can\
    \ do cross-language LTO [Link Time Optimization] or something to re-inline stuff.”\n\
    \nWedson replied:\n*   One thing we could [do to improve the situation is] to\
    \ convert some of the existing macros into inline functions on the header files.\n\
    *   We can’t do it for all cases (e.g., cases like mutex_init that declare a new\
    \ static variable when lockdep is enabled) but mutex_lock is just a function when\
    \ lockdep is disabled, and just calls mutex__lock_nested() when it is enabled.\n\
    *   How do you feel about this?”\n\nIn reply, Peter asked, “Can rust actually\
    \ parse C headers and inline C functions? I thought the whole problem was that\
    \ it can only call C ABI symbols (which inline functions are not).”\n\nWedson\
    \ replied:\n*   “Rust can’t. We use a tool called bindgen to read C header files\
    \ and generate equivalent Rust (extern “C”) declarations for functions. The tool\
    \ has been enhanced recently (https://github.com/rust-lang/rust-bindgen/pull/2335)\
    \ to handle static inline functions by automatically generating helpers like the\
    \ one above (in addition to the Rust decls).\n\n    “So the situation is improved\
    \ in that we don't need to manually write (and commit) the helpers. It may improve\
    \ further in the future if we get better integration of the languages.”\n\nPeter\
    \ accepted this, saying that in that case, “feel free to convert macros to inline\
    \ functions where the difference is moot. There is indeed no real reason for mutex_lock()\
    \ to not be an inline function in that case.” In response to Wedson saying that\
    \ Rust could not actually parse C headers and inline functions, Peter added, “that's\
    \ sad, I was hoping it would write the equivalent inline function in rust.”\n\n\
    David Light chimed in at this point, regarding converting macros to inline functions.\
    \ He remarked, “mutex_lock() is probably ok. But there are cases where gc generates\
    \ much better code for #defines than for inline functions. Almost certainly because\
    \ the front end gets to optimise #defines, but inlines are done much later on.”\n\
    \nMarco Elver suggested using ‘static __always_inline’ in C files for macros that\
    \ would be better converted to inline functions. He asked, “Can bindgen deal with\
    \ ‘static __always_inline’ functions?” And Miguel Ojeda replied, “If you mean\
    \ the new feature where ‘bindgen’ generates wrappers automatically, it seems to\
    \ handle them given ‘__always_inline’ => ‘inline’ which is what I imagine it looks\
    \ for [..], though I haven't tried to use the feature within the kernel yet.”\n\
    \nMiguel, speaking for the Rust community, also said, “We initially minimized\
    \ changes on the C side on purpose, but if maintainers are OK with that (modulo\
    \ exceptions), it would be great.”\n\nThe conversation ended there, though this\
    \ thread is absolutely part of a much larger and ongoing discussion between the\
    \ C and Rust communities of kernel developers. There are many Rust patches flying\
    \ around these days that are being taken very seriously by both groups.\n\nRust\
    \ is a highly impressive language. Its designers seem to take the position that\
    \ they will build protection against memory leaks and segmentation violations\
    \ into the language itself, at the cost of including a few relatively convoluted\
    \ language features. They also seem to make it relatively easy to avoid these\
    \ convolutions at the cost of writing slower code. So for someone who only wants\
    \ the higher level language features, such as easy-to-use complex data structures\
    \ in a fast compiled language, you can have that without too much language complexity\
    \ if you don't mind taking a small speed hit. For people who want code that is\
    \ fully speed-competitive with the C language, you can have that if you take advantage\
    \ of Rust's more complex memory protection features.\n\nI don't know why Linus\
    \ chose to accept Rust into the kernel, but I speculate that it was precisely\
    \ because of those memory protection features. There seem to be very few powerful\
    \ low-level languages that incorporate such features, and it seems like a tough\
    \ needle to thread. I believe Linus probably feels that the compromise of Rust's\
    \ additional complexity as a language is a very fair trade for the protections\
    \ it provides, which are also very difficult to find elsewhere. I'm fascinated\
    \ to watch the further progression of Rust development in the Linux kernel.\n\n\
    ## Compiler and Kernel Frenemies\n\nTheodore Ts'o posted a patch to update the\
    \ ext4 filesystem code, in the course of which he mentioned that another patch\
    \ by Matthew Wilcox needed to be applied on top of his, making a particular function\
    \ return an error pointer instead of simply the null value.\n\nThe details of\
    \ Matthew's patch (and Ted's patch) are not necessary to know, and both patches\
    \ were accepted into the kernel. However, Linus Torvalds commented:\n\n> “[It]\
    \ would be wonderful if we could mark the places that return an error pointer\
    \ as returning ‘nonnull’, and catch things like this automatically at build time\
    \ where people compare an error pointer to NULL.”\n\n> “However, it sadly turns\
    \ out that compilers have gotten this completely wrong. ‘gcc apparently completely\
    \ screwed things up, and ‘nonnull’ is not a warning aid, it's a ‘you can remove\
    \ tests against NULL silently’.”\n"
  mdcn: "\n\n你可以阅读一篇非常深入的文章，该文由 KDE 开发者 Xaver Hugel 撰写（https://zamaduaa.github.io/wayland/2023/05/18/hdr-and-color-management-in-kwin.html），主要介绍了\
    \ KWin 中的 HDR 和颜色管理。在文章中，Hugel 表示：“我们在黑客马拉松上并没有进行大量的代码修改，但我确实成功驱动了一块具有高色域范围并启用\
    \ HDR 模式的 HDR 屏幕，同时让 KWin 执行必要的颜色转换，使 SDR 内容看起来正确。”\n\n有一点需要注意，在 KDE Plasma 6\
    \ 中，Wayland 将成为默认的显示管理器。\n\n此外，根据 Hugel 的说法，HDR 支持在初期将“相当基础”。因此，用户将无法立即跳出来直接在\
    \ HDR 模式下观看视频或玩游戏。在 Linux 上的 HDR 支持走向成熟之前，开发团队还有很长的路要走。\n\n## Bodhi Linux 7.0\
    \ Beta 准备就绪，接受测试\n\nBodhi Linux 已经存在一段时间了，最新版本的发布承诺带来软件的新版本、更好的硬件支持、增强的安全性、改进的性能，以及更多内容，以吸引新用户并满足老用户的期待。\n\
    \n新版的核心亮点是 Moksha 0.4.0-8 桌面环境，它包含多项改进，包括完全重构的模块、新的快捷键查看器、更好的窗口吸附功能、针对菜单项的“请勿打扰”功能，以及从\
    \ e25 回溯移植的内部通知 API，还有更多其他内容。此外，Plymouth 和 Greater 应用程序也拥有新主题。\n\n作为基础系统，你将在其中找到\
    \ Ubuntu 22.04.2 LTS、三种不同的内核选择（Standard 5.15.0-71-generic、HWE 5.19.0-41 和 6.2.6）、EFL\
    \ 1.26.99-2、mozillateam PPA、kelebek333 的 PPA、nvidia-legacy PPA，并且已启用 Ubuntu Backports。\n\
    \n许多工作也投入到了改进和修复 Bodhi Linux 中包含的众多模块中，并且有大量软件更新，包括 Chromium（非 Snap 版本）113.0.5672.63、Terminology\
    \ 1.13.1-3、Web Browser Manager（允许你选择安装任意数量的浏览器）以及 Thunar 4.16。\n\n你可以在此阅读有关 7.0\
    \ 版本的所有详细信息（https://www.bodhilinux.com/release/7-0-0/），并在此下载 beta 版本（https://sourceforge.net/projects/bodhilinux/files/7.0.0-beta/）。\n\
    \n## Ubuntu PPA 使用方式的变更\n\n随着即将发布的 Ubuntu 23.10（Mantic Minotaur），PPA 的处理方式将发生相当大的变化。如你所知，在当前版本的\
    \ software-properties 软件中，当你通过命令行添加 PPA 时，会在 /etc/apt/sources.list.d/ 中创建一个 .list\
    \ 文件，并且相关的 GPG 密钥会被添加到 /etc/apt/trusted.gpg.d/ 中。\n\n当 23.10 发布时，这些 PPA 将使用 Deb822\
    \ 格式来创建 .sources 文件，并且相应的 GPG 密钥将直接通过 Signed-By 字段添加到文件中。这意味着用户不再需要管理一堆 .list\
    \ 文件。\n\n根据开发人员的说法，这一变更带来了一个非常重要的好处：当从系统中移除 PPA 时，GPG 密钥也会被自动移除。密钥将特定于某个 PPA，不能用于其他存储库，其他密钥也不能用于签名该\
    \ PPA。这些好处将极大地增强 PPA 的安全性。新系统的另一个好处是，用户不必担心删除可能在系统中累积的 .list 文件。\n\n当然，总有不足之处，最大的缺点在于\
    \ PPA 将拥有系统的 root 权限。因此，程序维护者可能会向存储库中添加恶意代码，而下一次你升级时，这些恶意代码将被安装，并对你的机器拥有不受限制访问权限。\n\
    \n阅读来自 ubuntu-devel 邮件列表的公告（https://lists.ubuntu.com/archives/ubuntu-devel/2023-May/042573.html）。\n\
    \n![](img/740bd926461af28ed755753238e647a2_11_0.png)\n\n> 编年史家 Zack Brown 报道 Linux\
    \ 内核社区的最新新闻、观点、困境和发展。\n\n*By Zack Brown*\n\n**作者**\n\nLinux 内核邮件列表是 Linux 开发活动的核心。流量巨大，一周往往达到\
    \ 10,000 条消息，而独自跟上整个开发范围的最新动态几乎是不可能完成的任务。敢于承担这项任务的少数勇敢者之一是 **Zack Brown**。\n\n\
    ### Linux 中的 Rust\n\nLinux 内核开发中一个迷人的方面，是试图从 C 和汇编语言转向其他语言（如 C++）的尝试。Linus Torvalds\
    \ 以极其在意内核代码的美学，以及 CPU 和 RAM 使用率和安全性等重要功能而闻名。如果要让他接受其他语言，那必须是一种相当令人惊叹的语言。作为对比，开发者在\
    \ 20 世纪 90 年代末曾尝试在内核中添加 C++ 支持，但未通过审核。\n\nRust 编程语言是内核开发者自那以后第一次认真尝试为内核添加支持。Linux\
    \ 遵循了最初的尝试，在 2022 年底将其纳入 6.1 版本。此后，提交了更多 Rust 补丁。与 C++ 不同，Rust 似乎短期内不会离场。相反，看起来\
    \ Linus 相当致力于认真尝试它。\n\n这是一个令人惊讶的决定，因为 Rust 太新了。Rust 诞生于 2006 年，而 C++ 诞生于 1979\
    \ 年。即便在今天，Rust 也几乎没有征服世界。然而，它却在 Linux 内核中获得了如此令人惊叹的地位。我并非贬低！考虑 Rust 的特性，甚至将其置于\
    \ C++ 之上并欢迎其进入内核开发过程，这非常迷人。然而，Linus 基于其优点而非流行程度来评估一种新语言，这一点也不令人惊讶。\n\n将 Rust 融入内核是一条蜿蜒曲折的道路。用\
    \ C 和汇编编写的内核部分需要与用 Rust 编写的部分以特定方式连接，以便不损失速度或安全性，并且让 Rust 和 C 开发者都能编写良好且可读的代码。\n\
    \n例如，Wedson Almeida Filho 最近提交了一个补丁，为 Rust 引入了一个互斥量结构，用他的话说是“允许 Rust 代码惯用地使用内核互斥量”。\n\
    \nWedson 的补丁修改了内核源代码中的 C 和 Rust 文件，以添加此支持。如果你想知道互斥量初始化例程的 Rust 代码是什么样子，以下是 Wedson\
    \ 补丁的一个片段：\n\n```rust\nmacro_rules! new_mutex {\n    ( $(inner:expr $ (, $name:literal)?\
    \ )? $\n      $(,)*) => {\n        $(sync::Mutex::new(\n            $inner, $name\
    \ ?\n        ))\n        $(crate::$optional_name($( $name)?), ?\n        $(crate::static_lock_class!())\n\
    \    );\n}\n```\n\nRust 是一种奇特而迷人的语言，表面上与 C 差异巨大，但其特性使其成为内核项目受欢迎的补充。\n\nPeter Zijlstra\
    \ 回复道：“我讨厌所有这些愚蠢的辅助函数……但我猜这是他们在语言接口方面能做出的最好安排 :/ 唯一的希望是，这个东西可以做跨语言 LTO [链接时优化]\
    \ 或类似的事情来重新内联代码。”\n\nWedson 回复：\n*   我们可以[改善现状的一件事是]将一些现有的宏转换为头文件中的内联函数。\n*  \
    \ 我们不能在所有情况下这样做（例如，当 lockdep 启用时声明新的静态变量的情况，如 mutex_init），但当 lockdep 禁用时 mutex_lock\
    \ 只是一个函数，而当启用时它只调用 mutex__lock_nested()。\n*   “你对这一点有什么看法？”\n\n作为回应，Peter 问道：“Rust\
    \ 真的能解析 C 头文件并内联 C 函数吗？我以为整个问题在于它只能调用 C ABI 符号（内联函数不是符号）。”\n\nWedson 回复：\n*  \
    \ “Rust 不能。我们使用一个叫做 bindgen 的工具来读取 C 头文件，并为函数生成等效的 Rust (extern \"C\") 声明。该工具最近得到了增强（https://github.com/rust-lang/rust-bindgen/pull/2335），通过自动生成如上所述的辅助函数（除了\
    \ Rust 声明外）来处理静态内联函数。\n\n    “因此，情况有所改善，因为我们不再需要手动编写（并提交）辅助函数。如果我们能获得更好的语言集成，未来可能会进一步改善。”\n\
    \nPeter 接受了这一观点，并表示在这种情况下，“请随意将宏转换为内联函数，此时差异无关紧要。在这种情况下，确实没有理由让 mutex_lock() 不是内联函数。”\
    \ 针对 Wedson 说 Rust 实际上无法解析 C 头文件和内联函数一事，Peter 补充道：“这很遗憾，我希望它能用 Rust 编写等效的内联函数。”\n\
    \nDavid Light 在此时插话，关于将宏转换为内联函数。他指出：“mutex_lock() 可能没问题。但有情况下，gc 为 #define 生成的代码比内联函数好得多。几乎肯定是因为前端可以优化\
    \ #define，而内联发生得更晚。”\n\nMarco Elver 建议在对宏进行更好的内联函数转换时，在 C 文件中使用 ‘static __always_inline’。他问道：“bindgen\
    \ 能处理 ‘static __always_inline’ 函数吗？” 而 Miguel Ojeda 回复道：“如果你指的是‘bindgen’自动生成包装器的新功能，考虑到\
    \ ‘__always_inline’ => ‘inline’，它似乎能处理这些，这就是我想象它寻找的东西[..]，虽然我还没有在内核中尝试过使用这个功能。”\n\
    \n代表 Rust 社区的 Miguel 还说：“我们最初故意最小化 C 端的更改，但如果维护者对此没有异议（除了例外情况），那就太好了。”\n\n对话到此结束，尽管此线程绝对是\
    \ C 和 Rust 内核开发者社区之间更大且持续讨论的一部分。如今有许多 Rust 补丁在流传，双方都对此非常重视。\n\nRust 是一种令人印象深刻的语言。其设计者似乎持一种立场，即他们将在语言本身中构建针对内存泄漏和段错误的保护，代价是包含一些相对晦涩的语言特性。他们似乎也让避免这些晦涩特性变得相对容易，代价是编写更慢的代码。因此，对于只想要高级语言特性（例如在快速编译语言中使用易用的复杂数据结构）的人来说，如果你不介意承受微小的速度损失，你可以拥有这些特性而不必面对太多的语言复杂性。对于想要代码速度完全与\
    \ C 语言竞争的人来说，如果你利用 Rust 更复杂的内存保护特性，你也可以拥有。\n\n我不知道 Linus 为什么选择接受 Rust 进入内核，但我推测这正是因为那些内存保护特性。似乎很少有强大的低级语言包含这样的特性，这似乎是一项很难做的平衡工作。我相信\
    \ Linus 可能觉得，相对于 Rust 提供的保护（这些保护在其他地方也很难找到），该语言额外的复杂性是一个公平的交易。我 fascinated 于观察\
    \ Rust 在 Linux 内核中的进一步发展。\n\n## 编译器和内核的“宿敌”\n\nTheodore Ts'o 提交了一个更新 ext4 文件系统代码的补丁，在此过程中他提到，Matthew\
    \ Wilcox 的另一个补丁需要叠加在他的补丁之上，使特定函数返回错误指针，而不仅仅是空值。\n\nMatthew 的补丁（以及 Ted 的补丁）细节不需要知晓，且两个补丁都被内核接受。然而，Linus\
    \ Torvalds 评论道：\n\n> “如果我们能标记那些返回错误指针的地方为返回‘nonnull’，并在构建时自动捕获此类事情（当人们将错误指针与 NULL\
    \ 比较时），那就太棒了。”\n\n> “然而，不幸的是，编译器在这方面完全搞错了。‘gcc 显然把事情搞得一团糟，‘nonnull’ 不是一个警告辅助工具，而是一个‘你可以静默删除对\
    \ NULL 的测试’的指令。”\n\n"
