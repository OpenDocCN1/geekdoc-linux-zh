    \ 终于加入了选择性图像编辑等许多长期期待的特性，以帮助其挑战行业霸主 darktable。\n\n## 创客空间\n\n- 64 DIY 记分牌\n我们查看了一个使用\
    \ Python 代码控制视频路由器的广播视频系统网络，并介绍了另一个创建记分牌的程序。\n\n![](img/740bd926461af28ed755753238e647a2_4_1.png)\n\
    \n两款精彩发行版\n双面 DVD！\n详见第 6 页\n\n- @linux_pro\n- @linuxpromagazine\n- Linux Magazine\n\
    - @linuxmagazine\n\n## 双面 DVD 上的两款精彩发行版！\n\n### Linux Mint 21.1\n#### 64 位\n\n\
    ![](img/740bd926461af28ed755753238e647a2_5_0.png)\n\n![](img/740bd926461af28ed755753238e647a2_5_1.png)\n\
    \nLinux Mint 是最受欢迎的 Debian 衍生版之一，以其对用户的响应速度著称。基于 Ubuntu 22.04 的 Linux Mint 21.1\
    \ 代号为 Vera，将得到支持直至 2027 年。\n\n在该版本中，Cinnamon 桌面默认采用更鲜艳的色彩和更精简的图标集，仅包含安装图标、挂载设备以及移动到\
    \ ~/Desktop 的任何项目。主文件夹、计算机、回收站和网络图标已被移除，因为它们可以从文件管理器中轻松访问。偏好旧外观的用户可以使用 Mint-Y-Legacy\
    \ 主题。与这种更新的外观相配合的是新的鼠标和系统声音选项。此外，驱动器管理器（Drive Manager）已被重新设计，不再需要 root 密码。更新管理器现在包含\
    \ Flatpak 包和一个用于自动化 ISO 图像验证的菜单项。Nemo 文件管理器和桌面也进行了多项外观上的更改，以提升美观度和效率。这些更改中的许多是细微的，但合在一起提升了\
    \ Linux Mint 对各级别用户的易用性。\n\n### openSUSE Leap 15.5\n#### 64 位\n\nOpenSUSE 的开发始终与\
    \ SUSE Linux Enterprise (SLE) 紧密相连。然而，Leap 15.5 是首个使用 SLE 源代码包的首发版。根据 openSUSE\
    \ 下载页面，此举旨在提高这个成熟发行版的稳定性。该版本将接收维护和安全更新直至 2024 年底。需要更长支持周期的用户可以迁移至 SLE 商业支持。\n\n\
    Leap 15.5 延续了 openSUSE 扩展包含最新技术的做法，例如容器、不可变系统、虚拟化和嵌入式开发。在桌面方面，KDE Plasma 5.27\
    \ 的引入带来了新的欢迎向导、增强的 KRRunner 功能、优化的颜色选择器和 ark 压缩工具、Kate 编辑器以及 Kdenlive 视频编辑器。此外，新版\
    \ Flatpak 具有增强的安全性，而高级用户可以探索更快的 Vim 编辑器版本（引入了新的脚本语言），netatwark（一种用于网络容器的工具），以及为\
    \ Cisco 的 OpenH264 编解码器提供的新软件源，其包在 BSD 许可证下发布。对于所有级别的 Leap 15.5 用户而言，这是一个建立在长期开发历史稳定基础上的增量升级。\n\
    \n## 致新闻亭读者\n\n**欢迎阅读最新一期的《Linux Magazine》！** 希望您喜欢本月的技术文章、教程和项目精选。\n\n您可能注意到本月封面价格上涨了。不幸的是，*Linux\
    \ Magazine* 在新闻亭销售的成本不断上升，迫使我们提高价格。\n\n**如果您直接从我们这里购买 *Linux Magazine*，不仅可以省钱，还能更快获取！**\
    \ 您将始终获得最佳价格，且您的直接支持让我们能够继续每月制作 *Linux Magazine*。\n\n![](img/740bd926461af28ed755753238e647a2_6_0.png)\n\
    \n![](img/740bd926461af28ed755753238e647a2_6_1.png)\n\n感谢您持续的支持！\n\n![](img/740bd926461af28ed755753238e647a2_6_2.png)\n\
    \n## 新闻\n\n### 技术、趋势和工具的更新\n\n### 本月新闻\n\n- 08\n  - 基于 Fedora 的 Ultramarine Linux\
    \ 旨在简化使用\n  - Debian 12 终于发布了\n\n- 09\n  - Armbian 23.05 现已可用\n  - Linux Mint\
    \ 终于获得手势支持\n  - 全 Snap 版本的 Ubuntu 正在开发中\n  - 更多在线内容\n\n- 10\n  - Mageda 9 Beta\
    \ 2 准备接受测试\n  - KDE Plasma 6 旨在带来基础 HDR 支持\n\n- 11\n  - Bodhi Linux 7.0 Beta 准备接受测试\n\
    \  - Ubuntu PPA 使用规则即将改变\n\n### 基于 Fedora 的 Ultramarine Linux 旨在简化使用\n\nUltramarine\
    \ Linux 38 基于 Fedora 38，提供 Budgie、KDE Plasma、GNOME 或 Pantheon 桌面环境。最新版本的发布增加了一些特别的内容来提升性能。\n\
    \n这种提升来自 System76 CPU 调度器，它会对进程进行优先级排序。唯一的缺点是，只有 GNOME 版本能自动检测正在使用的应用程序。然而，所有四个版本都包含各种系统调整，以确保用户获得尽可能流畅的体验。这包括改善启动和关机时间。\n\
    \n此外，Ultramarine 还包含最新版本的预装软件。您会发现默认支持 Flatpak，甚至还可以安装非自由软件。\n\n预装软件包括 Firefox、LibreOffice、Clapper\
    \ 音频/视频播放器、基本 GNOME 应用（软件、天气、文件、地图）以及大量实用工具。得益于 Flatpak 支持，您可以轻松安装第三方专有软件，如 Spotify\
    \ 和 Slack。\n\nUltramarine Linux 最大的吸引力在于其性能。开发人员所做的所有调整都带来了巨大差异，Ultramarine Linux\
    \ 的性能优于许多类似的 Linux 桌面发行版。一旦开始使用，您就会注意到其速度。\n\n立即下载 ISO（[https://ultramarine-linux.org/download](https://ultramarine-linux.org/download)）。您也可以使用脚本将\
    \ Fedora 迁移到 Ultramarine Linux，您可以通过命令 `wget https://ultramarine-linux.org/migrate.sh`\
    \ 下载该脚本。使用 `chmod +x migrate.sh` 赋予命令执行权限，然后使用 `sudo ./migrate.sh` 运行脚本。\n\n###\
    \ Debian 12 终于发布了\n\nDebian 遵循着许多其他 Linux 发行版都遵循的节奏。自 1996 年首次发布以来的几十年里，Debian\
    \ 已发展成为市场上最稳定的操作系统之一。部分原因在于开发团队在版本发布之间会花费大量时间。\n\n与每六个月发布一次的 Ubuntu 不同，Debian\
    \ 的新版本大致每年发布一次。因此，您可以确信每个版本都投入了大量精力，使其坚如磐石。\n\n随着 12.0（又名 \"bookworm\"）的发布，您将发现多个桌面的更新，如\
    \ GNOME 43、KDE Plasma 5.27、LXDE 1.1、LXQt 1.2.0、MATE 1.26 和 XFCE 4.18。不，这些并不是每个组件的最新版本，但这就是\
    \ Debian 的风格（保持尽可能稳定）。\n\n其他软件更新包括 Apache 2.4.57、BIND DNS Server 9.18、Cryptsetup\
    \ 2.6、GIMP 2.10.34、GnuPG 2.2.40、Incrapsule 1.2.2、GNU C Library 2.36、LibreOffice\
    \ 7.4、Linux 内核 6.1、MariaDB 10.11、Nginx 1.22、OpenJDK 17、OpenLDAP 2.5.13、OpenSSH\
    \ 9.2p1、PHP 8.2、Python 3.11.2、Samba 4.17 等。总体而言，Debian 12 中发现了 11,089 个新包，总数达到\
    \ 64,419 个。它还改善了对非自由固件的支持和管理，并支持 ARM64 架构下的 UEFI。\n\n"
