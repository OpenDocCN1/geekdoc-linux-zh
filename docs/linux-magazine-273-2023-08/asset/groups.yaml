  - "[PAGE 68]\n\n# # DIY Scoreboard MAKERSPACE\n\nLine 27 builds a SQL statement.\
    \ The INSERT INTO command names the table followed by a list of column names separated\
    \ by commas. The VALUES keyword assigns the values for each column, provided in\
    \ the same order. Line 29 creates a database cursor that interacts with the SQL\
    \ statement. In this case (line 30), it just executes the SQL line created in\
    \ line 27, but it has many more capabilities, especially when retrieving records.\
    \ Line 31 calls commit to confirm that you want to write the data.\n\nThe cherrypy\
    \ decorator (lines 33-339) creates a small web server for controlling the scoreboard.\
    \ Each Python function becomes a web address that returns its designated content\
    \ to the browser that has called it.\n\nThe index function acts just like index.html\
    \ in a traditional web server. In the absence of another address, it is the default\
    \ title returned. Most of this function is a very large multiline string (not\
    \ shown here, grab the full code online [3]) enclosed by triple quotes (''') that\
    \ instructs Python to ignore any newlines or other special characters until it\
    \ encounters another triple quote. The enclosed string is the HTML5 [5] and JavaScript\
    \ of the control web page. After the massive text string, the Python format command\
    \ inserts all of the current variables into the web page (lines 240-251).\n\n\
    The cherrypy.expose decorator tells CherryPy that it should allow this function\
    \ to be reachable through its web server. Without this decorator the function\
    \ remains private from anyone on the web, which allows the program to be structured\
    \ with additional functions as needed, with only those specifically designed to\
    \ be web-accessible published. You’ll see this decorator before each function\
    \ in the web class, so it’s only described once here.\n\nThe teams function (lines\
    \ 257-267) is somewhat of a misnomer in that it generates a game selector. For\
    \ the purposes of this database, a game is a pair of teams at a specific date\
    \ and time on a specific court. This function retrieves all of the games and returns\
    \ an HTML select widget.\n\nThe function begins by creating an SQL cursor and\
    \ statement and then executing it (as in lines 29-31). However, now it’s retrieving\
    \ records, so the cursor has the results of the query, which is data instead of\
    \ just a message that the query succeeded.\n\nAfter starting the HTML select widget\
    \ on line 262, the program loops over the SQL results. As the name implies, cursor.fetchall\
    \ gives all of the results as an iterator. game will contain one row from the\
    \ database for each time through the loop. Each pass creates an HTML option and\
    \ lists the game date, time, and teams.\n\nThe processGameSelect function (lines\
    \ 270-279) is called when the scoreboard operator selects a game from the drop-down\
    \ just generated. It receives the gameID argument and uses that to get the game\
    \ details from the database. Line 272 is an almost identical SQL statement to\
    \ line 259, but with a WHERE clause added to the dong with the gameID.\n\nAfter\
    \ doing the SQL dance one more time, line 274 calls cursor.fetchone. The last\
    \ time, all of the records were retrieved, but this time only one is needed, which\
    \ is saved into game. gameID is saved into a class variable, and self.teamName\
    \ sets the names retrieved from the database.\n\nThe teamName function (lines\
    \ 281-284) accepts a team number and name as arguments. Each of two if statements\
    \ determines which team is being named and then saves the new name to a variable\
    \ in the scoreboard class.\n\n# ## Housekeeping\n\nThe score, timeouts, and period\
    \ functions (lines 286-312) accept the team1 and team2 arguments (per1 and per2\
    \ only accept a period number) which are the amounts to change each value. Negative\
    \ values are allowed so that values can be corrected or reset for the next game\
    \ or period. Note also that the variables are preceded with int. All arguments\
    \ from CherryPy come in as strings, so they have to be converted to integers before\
    \ they can be used algebraically.\n\nFinally, the two newly adjusted values are\
    \ returned, separated by a colon, to go back to the JavaScript function and be\
