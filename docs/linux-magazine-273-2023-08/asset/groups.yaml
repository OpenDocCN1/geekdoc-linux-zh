  mdcn: "\nDebian 支持九种不同的架构，包括 32/64 位 PC、ARM64、ARMv7、64 位小端 MIPS、64 位小端 PowerPC 以及\
    \ IBM Z。你可以在这里阅读 Debian 12 的完整发布说明，并从 Debian 官方下载页面（[https://www.debian.org/download](https://www.debian.org/download)）下载\
    \ ISO 镜像。\n\n## Armbian 23.05 现已发布\n\nArmbian 即将迎来其成立 10 周年的纪念日，并宣布发布了版本 23.05。该版本基于\
    \ Debian，专为 ARM 和 RISC-V 架构创建。版本 23.05 的绰号为 “Suni”，它基于一个过去三年一直在开发的完全重构的构建框架。\n\
    \n根据项目网站的说法，“……许多专注于 ARM 的 Linux 发行版本质上只是换了个名字的 Armbian！我们致力于简化复杂性，并为社区提供卓越的解决方案。”\n\
    \nArmbian 的最新版本提供了几项改进，包括基于 Armbian bookworm 的镜像，以便获取来自 Debian 的最新更新，i3 支持，对 armbian-installer\
    \ 的改进，优化的软件包基础，一致的应用软件包，改进的基于 Ubuntu 的组装，快速且安全的更新，包含 armbian-gaming 脚本，以及大量的错误修复和安全补丁。\n\
    \n没有 ARM 或 RISC-V 硬件的用户可以下载用于 AMD/Intel 机器的基于 Ubuntu 的镜像。此版本去除了许多 Ubuntu 特有的部分（例如移除了\
    \ Ubuntu Pro 和 Snap）。\n\n阅读详细的新增功能日志以了解 Armbian 23.05 的新特性，并下载 ISO 镜像以安装在你选择的单板计算机上。在下载页面上，你还会找到\
    \ AMD64 镜像的链接。\n\n## Linux Mint 终于支持手势操作\n\n多年来，在 Linux 上为触摸屏和触控板获取多点触控手势一直是个问题。虽然一些发行版提供了该功能，但支持程度相当有限（充其量也是如此）。\n\
    \n希望随着 Linux Mint 21.2（以及 Cinnamon 5.8）的发布，这一切都会改变。当使用默认的陈皮（Cinnamon）桌面时，用户终于可以享受到支持媒体播放器控制、平铺（tiling）和其他实用功能的手势操作。\n\
    \n根据 Clement “Clem” Lefebvre 的说法（[https://blog.linuxmint.com/?p=4518](https://blog.linuxmint.com/?p=4518)），这些手势将支持触控板、触摸屏和平板电脑。\n\
    \nLinux Mint 21.2（基于 Ubuntu 22.04）还将享受一些额外的更新和调整，例如 Xfce v4.18、全局深色模式（得益于 xdg-desktop-portal\
    \ 的实现），以及软件管理器（Software Manager）也进行了 UI 刷新，并提供了更好的应用程序评分/排序算法和针对经过调整的软件包的专用列表、改进的登录界面（包括对多种键盘布局和更好的触控板支持）、自动检测和启用点按点击（tap-to-click）、对\
    \ Wayland 会话的支持、对 HEIF 和 AVIF 图像的支持、改进的 Pix 图像查看应用、对 Flatpak 应用的更好支持，以及对 Gnome\
    \ 的 libadwaita 库的改进支持。\n\nLinux Mint 21.2（Victoria）计划在 2023 年 6 月发布。对于想要测试 Linux\
    \ Mint 21.2 的用户，你必须使用 Daily Builds（[linuxmint-developer-guide.readthedocs.io/en/latest/daily_builds_ppa.html](http://linuxmint-developer-guide.readthedocs.io/en/latest/daily_builds_ppa.html)）PPA\
    \ 并从稳定版升级到不稳定版本，或者你可以等待他们发布 beta 版本，这很可能在最终发布前几周发生。请务必每天查看官方 ISO 镜像页面（[https://community.linuxmint.com/iso](https://community.linuxmint.com/iso)）。\n\
    \n## 全 Snap 版 Ubuntu 正在开发中\n\n鉴于 Canonical 一直在为其旗舰操作系统 Ubuntu 推广 Snap 软件包，Canonical\
    \ 将这一举措提升到新的级别，提供完全由 Snap 软件包组成的 Ubuntu 版本，这并不令人惊讶。\n\n在任何人开始恐慌之前，全 Snap 版的 Ubuntu\
    \ 不会成为默认选项。当你明年下载 Ubuntu（届时全 Snap 版将可用）时，它默认提供的是该操作系统的传统 Debian 版本。\n\n那么，全 Snap\
    \ 版 Ubuntu 的吸引力在哪里？它将是不可变的（immutable），这意味着它被设计为以只读方式挂载操作系统，因此无法更改。一旦安装了操作系统，系统文件和目录就不能被更改。这对\
    \ Ubuntu 来说并非新鲜事，因为 Ubuntu Core（另一个不可变版本）自 2015 年以来就已存在。不可变操作系统背后的理念是使其更加安全。\n\
    \n这一公告微妙地在 omgubuntu.com 上发布的 CUPS Snap 公告（[https://www.omgubuntu.co.uk/2023/05/cups-snap-ubuntu-23-10#comment-6196766355](https://www.omgubuntu.co.uk/2023/05/cups-snap-ubuntu-23-10#comment-6196766355)）的评论中公布。Canonical\
    \ 的 Oliver Grawert 表示：“随着下一个 LTS 版本，它将有一个桌面版本（不过它是可选的，经典的桌面安装确实不会消失）。”\n\nUbuntu\
    \ 的下一个 LTS 版本是 24.04，将于 2024 年 4 月发布，因此你可以确信，关于这个新的全 Snap 版 Ubuntu 桌面发行版的信息会像涓涓细流般逐渐流出。\n\
    \n## Mageia 9 Beta 2 准备就绪，等待测试\n\nMageia 于 2011 年从 Mandriva Linux 分支而来，自那以后，它已经成为一种独立的存在。此次最新发行版发布于第一个\
    \ beta 版本三个月之后，团队投入了大量时间来修复顽固问题、添加安全修复和应用更新。\n\nBeta 2 功能包括 Linux 内核 6.3.3、Glib\
    \ 2.36、RPM 4.18.0、Chromium 110、Firefox ESR 102.11、LibreOffice 7.5.2、KDE Plasma\
    \ 5.27.4、Gnome 44、Xfce 4.18.1、LXQt 1.3.0 和 Mesa 23.1.0。\n\n用户将发现 Mageia 包含三个不同的软件源：核心（Core，包含免费和开源软件）、非自由（Non-free，包含可免费使用和分发但包括专有软件的软件包）以及有损的（Tainted，包含在免费许可下发布但在某些国家侵犯专利和版权法的软件包）。Mageia\
    \ 确实配置了 32 位软件源，但在 64 位系统上它们是禁用的。\n\n当你下载 Mageia 的版本时，务必选择你首选的桌面环境：KDE Plasma（[https://www.mageia.org/en/downloads/get/?q=Mageia-9-beta2-Live-Plasma-x86_64.iso](https://www.mageia.org/en/downloads/get/?q=Mageia-9-beta2-Live-Plasma-x86_64.iso)）、Gnome（[https://www.mageia.org/en/downloads/get/?q=Mageia-9-beta2-Live-GNOME-x86_64.iso](https://www.mageia.org/en/downloads/get/?q=Mageia-9-beta2-Live-GNOME-x86_64.iso)）、Xfce（32\
    \ 位（[https://www.mageia.org/en/downloads/get/?q=Mageia-9-beta2-Live-Xfce-ls86.iso](https://www.mageia.org/en/downloads/get/?q=Mageia-9-beta2-Live-Xfce-ls86.iso)）或\
    \ 64 位（[https://www.mageia.org/en/downloads/get/?q=Mageia-9-beta2-Live-Xfce-x86_64.iso](https://www.mageia.org/en/downloads/get/?q=Mageia-9-beta2-Live-Xfce-x86_64.iso)））。\n\
    \n要了解有关新发行版的更多详细信息，请查看 Mageia 官方博客（[https://blog.mageia.org/en/2023-05-24/the-release-of-beta2-brings-mageia-9-stable-closer-to-reality/](https://blog.mageia.org/en/2023/05/24/the-release-of-beta2-brings-mageia-9-stable-closer-to-reality/)）。目前，Mageia\
    \ 9 没有官方发布日期，但请继续关注官方博客（[https://blog.mageia.org/en/](https://blog.mageia.org/en/)）获取更多信息。\n\
    \n![](img/740bd926461af28ed755753238e647a2_9_0.png)\n\n每周五位最新的新闻送达你的收件箱\n\n免费订阅\
    \ Linux Update bit.ly/Linux-Update\n\n## KDE Plasma 6 有望带来基础 HDR 支持\n\n当 KDE Plasma\
    \ 6.0 最终到来时，用户将发现高动态范围（HDR）支持终于到位了。由于 4K 屏幕正在成为常态，HDR 支持已成为必需品。\n\n借助 HDR，视频内容的效果可以远远超出如今已过时的标准——媒体机构几十年来一直固守这些标准。KDE\
    \ Plasma 6.0 中的 HDR 支持是通过 2023 年 5 月由红帽（Red Hat）组织的一次 HDR 黑客马拉松以及 Plasma 冲刺（Sprint）实现的。\n\
    \nKDE Plasma 6.0 将仅为 Wayland 会话提供 HDR 支持，据 KDE 开发者 Nate Graham（[https://pointiestick.com/2023/05/20/this-week-in-kde-preliminary-hdr-support/](https://pointiestick.com/2023/05/20/this-week-in-kde-preliminary-hdr-support/)）称，这“为\
    \ Wayland 上的颜色管理奠定了基础。”\n\n## 更多在线资源\n\n-  Linux Magazine\n  - www.linux-magazine.com\n\
    - ADMIN HPC\n  - http://www.admin-magazine.com/HPC/\n- 节省存储空间\n  - Jeff Layton\n\
    \  - 人们经常求助于数据压缩来节省存储空间，但降低精度也是一种有用的技术。\n- ADMIN Online\n  - http://www.admin-magazine.com/\n\
    - Windows 的软件包管理工具\n  - Eugeni Strimon\n  - Chocolatey 和 WinGet 在 Windows 上提供完全成熟的软件包管理功能，但哪一个最适合你的环境？\n\
    - CrowdSec 众包安全服务\n  - Thomas Joss\n  - 通过众包安全，组织形成一个社区，通过共享攻击数据对网络攻击采取集中行动，从而可以在早期阶段检测和避免威胁。我们解释了这一策略如何通过\
    \ CrowdSec 云服务发挥作用。\n- 验证你的配置\n  - Ankur Kumar\n  - 自动化验收测试是捕捉与配置错误相关问题的强大工具。我们将展示如何使用名为\
    \ goss 的免费工具实现你自己的验收测试环境。\n\n"
