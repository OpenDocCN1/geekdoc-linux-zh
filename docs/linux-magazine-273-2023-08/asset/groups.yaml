    # COVER STORY


    ## Sound Studio Workshop


    Sounds perfect in your studio will not make it better for everyone else. You can
    find software solutions that will let you measure and analyze the sound output
    in the room accurately. I used the Java Room EQ Wizard (REW) app in the test;
    you can download it free of charge [4]. You will also find a commercial Pro version
    of the REW proprietary freeware [5], which – above all – enables more precise
    measurements, as needed when building loudspeakers. Having said this, the free
    version comes with everything you need to optimize a home studio. It generates
    the required measurement tones and meaningful graphs of the measured signals.


    On first launch, REW offers to calibrate the connected microphone (Figure 11).
    It then measures the sound waves that the speakers spread in the room and graphically
    displays whether and how the results deviate from an expected ideal result. You
    can reduce these deviations by removing obstacles near the speakers and dampening
    reflections in the room. Reflections not only create reverberant effects that
    wash out the sound image, they also cancel out or boost frequencies, and that
    distorts the sound entirely.


    Optimizing room acoustics is an expensive discipline if you want everything to
    be perfect. Fortunately, you can get very close to perfection even with simple
    means. Soft carpets and heavy curtains often already work wonders, and you can
    easily prevent the sound being wiped out in the corners of the room using wall
    hangings. As a last resort, you could use an equalizer upstream of JACK’s master
    output. This setup is tricky, and it generates more system load.


    ## Conclusions


    If you get past the simplest podcast scenarios, you will find that USB mixers
    work like a charm on Linux today. Devices that offer complex signal routing are
    easy to wire thanks to JACK and Carla. Finally, Ardour implements all of these
    options in a way that is typical of premium music production and performance.


