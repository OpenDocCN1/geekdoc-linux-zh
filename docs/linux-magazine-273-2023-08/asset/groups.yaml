    \ chr ( 0x10 ) + chr ( 0xA00 ) )\nbtn.addMatrixCommand( chr ( 0x10 ) + chr ( 0xA5\
    \ ) )\nbtn.addMatrixCommand( chr ( 0x10 ) + chr ( 0xA1 ) )\nself.buttons.append(\
    \ btn )\n```\n\n第一行创建一个按钮，并传入 `self.screen` 和 `buttonFont`。`create` 生成按钮，而 `addMatrixCommand`\
    \ 为视频矩阵添加指令。指令字符串来自矩阵文档；它告诉你发送前三个十六进制值以开始指令。最后一个字节包含路由信息，作为 8 个索引地址。高位数字定义输出或目标，低位数字定义输入或源。在这里，0x00\
    \ 表示“将第一个输出连接到第一个输入”。下一行将第二个输出连接到第二个输入。表 1 显示了每个按钮的配置。\n\n矩阵的一个输出连接到控制室内的监视器，以便可以轻松监控源信号。三个\
