    # ## Summary


    Audacity is a professional audio application that supports a broad range of recording
    and playback hardware. It is a free, open source, easy-to-use application with
    advanced features, dozens of effects, plugins, and output options. It''s an excellent
    choice for podcasters who need an uncomplicated solution that works equally well
    on Linux, Windows, and macOS systems. The Audacity development team releases regular
    updates and security and bug fixes. Working with Audacity is fun and productive.
    It will serve you well for many years. Happy podcasting!


