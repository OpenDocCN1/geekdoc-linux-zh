  - "[PAGE 46]\n\np.StringWithFallback(\"items\",  \n\"Do this item\"+joiner+\"Learn\
    \ Fyne!\"  \n+joiner+\"Build an app\")\n\nNow, you can package the code for distribution.\
    \ The command `fyne package` will prepare a bundle (for a Linux host, this will\
    \ create `tododapp.tar.xz`). The bundle will contain your binary, an icon file,\
    \ and the metadata needed to install on other computers. These binaries are relocatable,\
    \ so it will work for computers with a different configuration. New app users\
    \ will see the welcome screen shown in Figure 5 with a tutorial and an icon!\n\
    \n# Building for Other Platforms\n\nAnother great feature of the fyne command-line\
    \ tool is that it can package code for other platforms, just like the Go compiler.\
    \ You can specify the operating systems that you want to bundle the app for, one\
    \ at a time. For example:\n\n```\n> fyne package --os windows\n```\n\nDue to the\
    \ graphical libraries required to compile (like the ones you installed at the\
    \ beginning of the article), there are some additional requirements for cross-platform\
    \ compilation. See the Fyne documentation for more information [4].\n\n![](img/740bd926461af28ed755753238e647a2_46_0.png)\n\
    \nIf you are familiar with a Docker or podman install, then you can use the `fyne-cross`\
    \ [5] tool, which will handle all the complex developer setup process inside containers.\
    \ As long as you have a container engine running, it should be as simple as:\n\
    \n```\n> go install 2  \ngithub.com/fyne-io/fyne-cross@latest  \n> fyne-cross\
    \ android\n```\n\nFigure 6 shows how the same app will look when running on an\
    \ iOS or Android mobile device. The package was created using `fyne-cross` and\
    \ installed using standard developer tools.\n\nFinally, if you are interested\
    \ in automating your build for multiple platforms along with having the downloads\
    \ hosted for you, check out build platform tools such as Geofrey by Fyne Labs\
    \ [6].\n\n# Conclusion\n\nIn less than 100 lines of code, you now have a graphical\
    \ application that will work on the desktop or mobile device of your choice. You\
    \ can find the full application source code on the project's GitHub page [7].\
    \ Development with Fyne is easy to get started with. I hope you will be inspired\
    \ to explore the potential of this GUI toolkit further.\n\nVisit the Fyne website\
    \ [8] to see a list of other applications with Fyne, check out the Fyne documentation\
    \ and tutorials [9]. As a Linux enthusiast, you may also be interested in trying\
    \ out the full desktop environment that was built using Fyne, FyshOS [10].\n\n\
    ![](img/740bd926461af28ed755753238e647a2_46_1.png)\n\n+   [1] Getting Started\
    \ documentation: https://developer.fyne.io/started/  \n+   [2] Creating your own\
    \ layout code: https://developer.fyne.io/explore/container  \n+   [3] Cloud storage\
    \ with Fyne: https://help.btfn7l55XmN8  \n+   [4] Cross-platform compiling: https://developer.fyne.io/started/cross-compiling\
    \  \n+   [5] fyne-cross: https://github.com/fyne-io/fyne-cross  \n+   [6] Geoffrey:\
    \ https://fynelabs.com/geoffrey  \n+   [7] To-do app source code: https://github.com/andydotxyz/linuxmagazine-todoapp\
    \  \n+   [8] Other Fyne apps: https://apps.fyne.io  \n+   Fyne tutorials and documentation:\
    \ https://developer.fyne.io  \n+   [10] FyshOS: https://fyshos.com/desktop/\n\n\
    Andrew Williams is a software engineer and entrepreneur based in Scotland, UK,\
