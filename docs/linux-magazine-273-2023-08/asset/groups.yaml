    应用程序使用一个新的包 *container*，它来自 `fyne.io/fyne/v2/container`。


    为了制作顶栏，你将使用另一个 **Border** 容器，它将为**Entry** 组件（用于用户输入，列表 3）和一个使用标准主题中可用的图标来添加内容的新
    **Button** 组件。（我稍后会添加响应用户输入的代码。）


