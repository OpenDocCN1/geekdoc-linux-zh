    \n### Listing 4: random.go\n\n```go\npackage main\n\nimport (\n    \"math/rand\"\
    \n    \"time\"\n)\n\nfunc mkTeams(players []Player) [][]Player {\n    rand.Seed(time.Now().UnixNano())\n\
