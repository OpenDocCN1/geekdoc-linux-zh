  - '[PAGE 5]


    # # Linux Mint 21.1 and openSUSE Leap 15.5


    Two Terrific Distros on a Double-Sided DVD!


    ![](img/740bd926461af28ed755753238e647a2_5_0.png)


    ![](img/740bd926461af28ed755753238e647a2_5_1.png)


    # ## Linux Mint 21.1

    ### 64-bit


    Linux Mint is one of the most popular Debian derivatives, noted for its responsiveness
    to users. Linux Mint 21.1, codenamed Vera, is based on Ubuntu 22.04 and will be
    supported until 2027.


    For this release, the Cinnamon desktop defaults to more vibrant colors and a reduced
    set of icons that includes only the installation icon, mounted devices, and any
    items moved to ~/Desktop. The Home folder, Computer, Trash, and Network icons
    were removed because they are readily available from the file manager. Those who
    prefer the old look can use the Mint-Y-Legacy theme. Complementing this updated
    look are new mouse and system sound options. In addition, the Drive Manager has
    been redesigned and no longer requires the root password. The Update Manager now
    includes Flatpak packages and a menu item to automate ISO image verification.
    The Nemo file manager and the desktop have also undergone numerous cosmetic changes
    for both aesthetics and efficiency. Many of these changes are minor, but together
    they increase Linux Mint’s user-friendliness for users of all levels.


    # ## openSUSE Leap 15.5

    ### 64-bit


    OpenSUSE’s development has always been closely tied to SUSE Linux Enterprise (SLE).
    However, Leap 15.5 is the first release to use source packages from SLE. According
    to the openSUSE download page, this move is intended to increase the stability
    of this already mature distribution. The release will receive maintenance and
    security updates until the end of 2024. Those who require longer support can migrate
    to SLE commercial support.


    Leap 15.5 continues openSUSE’s practice of expanding its inclusion of recent technologies,
    such as containers, immutable systems, virtualization, and embedded development.
    On the desktop, the introduction of KDE Plasma 5.27 means a new welcome wizard,
    enhanced features for KRRunner, the refinement of the color picker and the ark
    compression utility, the Kate editor, and the Kdenlive video editor. In addition,
    the new Flatpak version features enhanced security, while advanced users can explore
    a faster version of the Vim editor that introduces a new scripting language, as
    well as netatwark, a tool for networking containers, and a new repository for
    Cisco’s OpenH264 codec, whose packages are released under a BSD license. For all
    levels of users, Leap 15.5 is an incremental upgrade built on the stable base
    of a long history of development.'
