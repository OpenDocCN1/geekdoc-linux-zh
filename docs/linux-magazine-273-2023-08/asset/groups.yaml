    # 封面故事


    ### 声音工作室实战


    与屏幕上的虚拟按钮相比，使用真实的旋钮和按钮会带来更满足的感觉。ProFX 前四个声道的插入式连接器在这个价位段中是一项罕见功能。这些连接器允许将信号路由到外部设备，设备处理后再将其反馈到你的混音中。这一切都通过
    JACK 以立体声混音的形式传输到 Linux，并可以在 Ardour 中进行录制。


    但您也可以将任何支持 JACK 的 Linux 软件发送的信号发送到连接在调音台输出的音响系统。这意味着，例如，您可以使用 Hydrogen 鼓机，同时通过
    MIDI 键盘演奏像 Yoshimi 或 VeeOne 这样的软音源——同时还有通过麦克风或吉他输入调音台的信号（图 5）。


    ![](img/740bd926461af28ed755753238e647a2_26_0.png)


    ![](img/740bd926461af28ed755753238e647a2_26_1.png)


    ### 混音与母带处理


    Ardour 为混音和母带处理提供了广泛的自动化选项。调音台本身以及所有插件的每一个参数都可以使用直观的曲线轨道与音频并行编程；您可以直接在软件界面中绘制曲线；MIDI
    控制器或支持 OSC 的智能手机应用程序也适合执行此任务。


    在编辑器中，点击 A 会打开一个菜单，允许您显示轨道的元轨道；然后您可以为几乎任何参数绘制曲线，从音量到完全晦涩的插件设置（图 6）。此外，Ardour 完全依赖
    JACK 的信号路由，允许您对几乎任何输出通道进行灵活控制；这项功能在任何其他 Linux 软件中，即使是商业软件，都找不到。还可以以相对较低的开销实现第二个（或更多）主通道作为总线（图
    7）。


    对于母带处理，您主要需要均衡器和压缩器/限幅器插件。在过去两三年内，Linux 上的免费扩展在这方面发生了许多变化。除了像 FooLimiter 这样的 LADSPA
    时代简单经典插件和 Calf 的高端便捷插件外，您还会发现提供甚至更多设置以及精心设计的、非常高质量的图形界面的新模块（图 8）。


    ![](img/740bd926461af28ed755753238e647a2_27_0.png)


    **图 7：Ardour 调音台遵循一种理念，认为最烦人的功能就是缺失的那个。就信号路由而言，很难想象有比这更多的可能性。**


    ### 倾听，倾听！


    一种在混音和录音时聆听音频的方式是使用耳机。对于测试，我常使用 AKG 的经典 K240 DF 和 Mackie 推出的较新的产品 MC-350（图 9）。MC-350
    耳机与 AKG 有显著不同，提供了降噪功能。其设计很像听力保护耳罩，防止信号与环境噪声混合。在录制人声或吉他时，这能让您获得扬声器完全无法实现、开放式耳机也只能有限实现的声音。您可以在录制信号与房间内同时输出的声音不混合的情况下听到它。


    结果有时令人惊叹。由 guitariX（一个基于 JACK 运行的 Linux 吉他放大器）放大的吉他人声，在 Tannoy 扬声器的测试中听起来圆润且富有音乐性，但通过
    Mackie 耳机听则完全失真且缺乏可辨识的和声，而这正是录音实际的声音。这绝对不是因为 Mackie 耳机无法处理信号。耳机并没有扭曲任何声音，它们只是无情地复现在
    guitariX 中选择的设置。如果您通过扬声器聆听该轨道，它会与正在演奏的 Ibanez RG 吉他的内部声音混合，这些定义明确的声学声音与 guitariX
    的厚实失真融合在一起。


    简而言之：特别是在为声学信号设置效果时，使用耳机是个好主意。这种揭示效果在开放式 AKG 耳机中不那么极端。但您也可以通过稍微调大音量来发现错误。


    ### 正确的扬声器


    如果您自己制作音频，应注意不要过于被注重外观的设备所左右。使用中等价位 Hi-Fi 设备制作的混音往往听起来较差、沉闷、过于尖锐，因此不同于艺术家的初衷。


    音响工程师的监听音箱听起来很分析性强。它们不强调听众觉得特别出色的地方，也不夸大低音产生的冲击力。为此，它们在可能范围内避免失真和着色，并以特别明确的方式重现声音——空间上，以便各个声音可以在混音中精确平衡。


    我用一对经典扬声器测试了这些功能，即带有内置 50 瓦放大器的 Tannoy Reveal 近场监听双单元系统（图 10）。我将箱子以三角形布置，距离工作位置约
    1.20 米（见“扬声器正确设置”专栏）。这样，您可以听到一切，包括错误。与在同一房间中配备 Denon 放大器和两对 Canton 三单元 Hi-Fi 扬声器的立体声系统设置相比，空间表现似乎明显更强。


    Tannoy 扬声器可以以约 200 欧元的二手价格买到。它们总重 10 公斤，需要由合格的接口通过杰克线提供信号。像 Mackie 的 StealthBar
    这样的小型轻量紧凑设备，售价 100 欧元，能与之匹敌吗？顾名思义，StealthBar 是一个紧凑的条形音箱，最好放置在屏幕下方。该设备同时是 USB 接口和蓝牙扬声器（见“正确使用情况下的
    StealthBar”专栏）。尽管 StealthBar 仅 50 厘米宽，但它提供了良好的立体声映射，即使使用小扬声器实现空间印象需要一点更多的专注力。


    ### 分析房间声学


    如果您自己的空间声学特性怪异，不能代表一般的聆听环境，那么调整声音以使其


    ### 扬声器正确设置


    耳机提供的最大优势之一是易用性：无论您把它们戴在何处，它们听起来都是一样的。相比之下，扬声器输出到房间的声音波被墙壁反射，声音也强烈依赖于位置。最重要的经验法则是，您需要正好坐在两个扬声器之间的中心。理想情况是一个等腰三角形，其大小需要根据扬声器的物理特性进行调整。另一方面，StealthBar
    是为短距离优化的；在约一米的距离处可获得最佳空间印象。在更远的距离处听起来仍然还可以，但在立体声混音中定位声音会更困难。对于 Tannoy 的近场监听器，制造商建议在头部高度设置一个边长约为两米的等腰三角形。在没有非常大的房间和合适的三脚架的情况下，我将
    Tannoy 设置在一个宽度为两米的书桌的相反两端。要真正专注地聆听，我不得不将椅子稍微移开书桌。


    ![](img/740bd926461af28ed755753238e647a2_28_0.png)


    **图 8：如果您觉得 Calʼs 母带处理插件缺少任何调整选项，请查看 LSPʼs 的均衡器和动态处理器。就信号路由而言，很难想象有比这更多的可能性。**


    ### 正确使用 StealthBar


    幸运的是，这个小紧凑系统支持各种可能的连接选项。StealthBar 可以直接作为良好的 USB 主设备与 JACK 一起使用，也可以作为其他接口的普通输出设备。作为通过
    USB 与 JACK 集成的主设备，它非常无侵入性。背面有一个迷你杰克输入，为 USB 接口的立体声输入提供信号。作为一个不错的额外功能，StealthBar
    提供蓝牙接口。对 PulseAudio 来说没有问题：配对完成后，来自浏览器的声音输出即可听到。不幸的是，这个蓝牙端口未集成到 JACK 中。即使忽略 PulseAudio
    的额外延迟，您也无法以这种方式聆听 Ardour 和其他 JACK 应用的声音。但如果想使用不同的接口配合 JACK 怎么办？在这种显而易见的情况下，您需要通过迷你杰克将设备的立体声输出连接到
    StealthBar 背面。然后，就像 Tannoy 的经典监听器一样，StealthBar 作为有源模拟监听扬声器工作。


    ![](img/740bd926461af28ed755753238e647a2_28_1.png)


    **图 9：此处展示的 Mackie 耳机旁边是 StealthBar 扬声器，它们也有白色款。**


    ![](img/740bd926461af28ed755753238e647a2_29_0.png)


    ![](img/740bd926461af28ed755753238e647a2_29_1.png)

