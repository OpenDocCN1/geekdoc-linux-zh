    ## 最小化噪点


    放大图像，并通过移动视图检查每个图像区域的噪点和锐度。为此，首先点击工具栏右侧的放大镜。虽然风景照片经过了一些细致的修饰，但图像噪点相对较低。但图像还可以进一步优化。在启用降噪之前，先在
    Raw（原始）下对 Color Interpolation（颜色插值）进行一些实验。这主要是关于 Method（方法）：虽然 AMAZe 是这里的默认值，但你总是应该尝试
    AMAZe+Bilinear（双线性）算法。RawTherapee 使用边缘检测滤镜将图像分为高纹理和低纹理区域。对于结构丰富的区域，它使用更锐利的 AMaZDeescreeining
    方法；对于更单调的区域，则使用更柔和的双线性算法来扼杀噪点的萌芽。AMaZDe+Bilinear 方法不一定能减少噪点。结果看起来更细腻，对人眼来说更令人愉悦（图
    6）。如果你觉得这仍然太强烈，请在 Details（详细）下启用 Noise Reduction（降噪）。这可以去除颜色噪点，这对于较新的相机来说，最高到
    ISO 1600 左右都是很好的选择。


    ![](img/740bd926461af28ed755753238e647a2_91_1.png)


    不要对图像噪点过于敏感——这是大多数缺乏经验的摄影师犯的一个错误。一方面，对于较新的相机来说，噪点往往并不重要。即使高达 ISO 6400 的图像在今天基本上也不再是问题了。而且低噪点并不是好照片最重要的特征之一。事实上，一定量的噪点往往在美学上看起来更悦目，或者至少比平滑处理后的照片更自然。不要害怕高
    ISO 值，也不要过于激进地进行降噪。


    ## 校正镜头像差


    校正镜头像差，如色差、暗角和畸变，在风景摄影中起着重要作用。由于 Mostviertel 风景中几乎没有这类错误，我将借助另外两张示例照片来演示这一步骤。


