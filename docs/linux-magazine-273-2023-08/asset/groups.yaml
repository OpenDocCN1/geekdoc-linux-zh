    ## 使用 RawTherapee 5.9 编辑风景照片


    ### 完美平衡


    当前版本的 RawTherapee 终于添加了选择性图像编辑等长期期待的功能，以帮助其与该领域的标杆软件 darktable 展开竞争。


    **作者：ANNA SIMON**


    在处理风景照片时，常常会出现图像中某些区域（尤其是极亮或过暗的区域）存在偏色，或者颜色显得过于浓烈或过于苍白的情况。调整对比度或饱和度往往会加剧这种现象。对于风景摄影师来说，良好的遮罩和选择功能是必不可少的。


    目前，无论是免费还是商业的 RAW 处理器，都提供了广泛的选择性图像处理工具。但在所有开源程序中，此前只有 darktable 提供了这些功能。尽管 darktable
    基本上是一款优秀的软件，但对于某些用户来说它存在一些缺点。它需要一段时间才能上手，并且你必须彻底理解其内部运作机制才能获得良好的结果。此外，如果显卡速度不快，darktable
    的运行可能并不够流畅。


    经过数年的开发，RawTherapee 5.9 [1] 于 2022 年 11 月发布，新增了以直观且有效的方式修改图像特定区域的能力 [2]。开发者 Jacques
    Desmis 在编写此功能时，受到了流行的 Nik 插件中巧妙的选择技术的启发。好消息是：该程序是一款性能与 darktable [3] 相当的 RAW 处理器，但避免了上述提到的缺点
    [4]。


    与大多数同类程序不同，实际上只有一个 RAW 处理器支持 RawTherapee。它没有真正的管理模块，仅具备一种文件浏览器或图像查看器。启动应用程序后，使用浏览器导航到存储照片的目录。双击缩略图即可在编辑器中打开照片。你可以将编辑工具栏找到在右侧。


    ### 预备工作


    首先调整一些默认设置。点击相应按钮，你会进入一个带有多个选项卡的独立窗口。首先，你需要处理两个选项：用户界面颜色以及颜色管理，或者是自动检测屏幕配置文件。RawTherapee
    的标准用户界面颜色过暗，无法正确调整颜色强度和图像亮度。你可以在 *General | Appearance*（通用 | 外观）选项中较深的定义位置选择一个较浅的颜色。推荐
    *Tool Wa Grey – Average Surround* 设计，因为它非常接近中性灰。


    然后，将程序设置为自动检测并使用你的屏幕配置文件。为此，你首先需要在操作系统的颜色设置中安装一个配置文件。在 RawTherapee 设置中，点击 *Color
    Management*（颜色管理），在 *Monitor*（监视器）组中，勾选 *Use operating system’s main monitor color
    profile*（使用操作系统的主监视器颜色配置文件），然后重启软件。


    在默认配置下，该工具会为 RAW 文件激活精密的、最小干预的自动图像优化。要充分利用一张照片，通常只需移动几个滑块即可。一旦打开 RAW 文件，RawTherapee
    会自动对图像应用三个处理步骤。*Exposure*（曝光）模块中的 *Auto tone curve*（自动色调曲线）承担了大部分工作。该程序通过将实际的
    RAW 文件与嵌入文件中的 JPEG 进行比较来生成曲线。它试图模仿当今相机内通常非常实用的图像优化功能。


    应用程序启用了 *Input Sharpening*（输入锐化，位于 RAW 选项卡的最末尾）。与传统的锐化不同，这种高效的锐化方法不在处理结束时进行，而是在一开始，即在图像在线性
    RGB 色彩空间中降低饱和度后立即进行。该工具还开启了色度异常自动校正功能。


    ### 提亮与压暗


    示例照片展示的是下奥地利州 Mostviertel 地区 Lunz am See 社区附近的一座山地风景。在进行其他任何操作之前，你通常需要根据程度不同对许多风景图像进行提亮。相机默认会欠曝，以便尽可能保留图像最亮区域的结构（图
    1）。


    为此，请将 *Exposure*（曝光）模块中的 *Exposure compensation*（曝光补偿）滑块稍微向右移动。经过多次尝试，我们在测试中发现
    0.8 的值是完美的。然后，使用灰色渐变滤镜来压暗天空。该工具使图像的上部变暗，插入从亮到暗的平滑过渡。你可以使用模块标题栏中的按钮启用该滤镜。将 *Intensity*（强度）设置为大约
    1.5。使用下方的滑块，你可以根据需要调整其他滤镜属性，如位置和大小。


    ### 对比度与饱和度


    接下来，增加饱和度和局部对比度。将 *Exposure*（曝光）下方的 *Saturation*（饱和度）滑块向右移动到大约 67 的值，并在 *Local
    Contrast*（局部对比度）下启用 *Detail*（细节）。这将应用一种介于锐化和（全局）对比度增加之间的效果。如果加强此效果，通常会增加图像的清晰度。


    内部滤镜使用模糊遮罩——这解释了确定模糊程度的 *Radius*（半径）滑块。如果你放大此值，对比度会增加。如果你减小它，它会影响更精细的细节，图像看起来会更锐利。对于此控制器，有意义的值通常在
    100 到 150 之间。


    *Intensity*（强度）指定了对比度增加的程度。此外，你可以使用 *Dark areas*（暗部区域）和 *Light areas*（亮部区域）来确定与某些区域相比，效果在其他区域是更强还是更弱。你需要小心处理此效果：如果你选择的值太高，图像会显得过于生硬。你需要使用较高的强度值，例如
    0.75。


    还要注意光晕——那些看起来不自然的过亮或过暗区域，通常出现在对比度边缘附近。你可以在示例图像的云朵中看到光晕：它们直接位于图像左半部分的山脊旁。你需要将滑块设置为
    0.5，以降低亮部区域的强度。


    ### L\*a\*b\*b 微调


    前景中草的颜色现在有点太浓烈了，而背景中的山脉——以及深色——看起来太苍白。你可以使用 *Exposure*（曝光）中的 *Lab module*（Lab
    模块）来校正这些细节。


    正如工具名称所示，它不在 RGB 色彩空间（即红、绿、蓝三个颜色通道）中操作，而是在 L\*a\*b\*b 色彩空间中操作。在这个空间中，照片由三个通道组成：L\*（亮度）、a\*
    和 b\*。L\* 仅存储亮度信息。a\* 通道存储绿色和红色的强度与色调，而 b\* 通道包含蓝色和黄色的信息。


    对于某些编辑步骤，尤其是在精确调整色相和饱和度时，在 L\*a\*b\*b 空间中获得的通常比在 RGB 空间中工作的工具效果更好。


    该工具有六种（初始隐藏的）曲线类型，允许你操纵特定颜色或色调范围的亮度、色相和饱和度（或色度）。曲线缩写 *CC, CH, CL, LH, LC,* 和 *HH*
    是简写（见表 1）。


    顶部三条曲线在许多其他 RAW 处理器和照片编辑器中也有存在。例如，点击三角形，然后从菜单中选择 *Min/Max Control Points*（最小/最大控制点）即可显示
    *CH* 曲线。现在你看到一个中间由样条曲线水平分割的方形。底部边缘有一个彩虹色渐变。还有红色、黄色、绿色、青色、蓝色和紫色的六条垂直线。如果你点击黄色垂直线与水平样条线相交的点并向上或向下拖动，预览中的黄色色调会变得更浓或更淡。你可以类似地使用
    *LH* 和 *HH* 曲线来操纵单个色相的亮度和色调（图 2）。


    ![](img/740bd926461af28ed755753238e647a2_88_0.png)


    **表 1：曲线名称**


    | 缩写 | 含义 |

    | ----------- | ------- |

    | CC | 根据色度的色度 |

    | CH | 根据色相的色度 |

    | CL | 根据亮度的色度 |

    | HH | 根据色相的色相 |

    | LC | 根据色度的亮度 |

    | LH | 根据色相的亮度 |


    '
