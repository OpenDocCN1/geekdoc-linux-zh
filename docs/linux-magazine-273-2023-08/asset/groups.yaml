    \ I’ll assume that you have one machine to install NetBox and another for a backup\
    \ (based on your organization’s typical operating procedures and standards).\n\
    \n## PostgreSQL\n\nFirst, you need to install PostgreSQL [5] with the following\
    \ commands:\n\n![](img/740bd926461af28ed755753238e647a2_49_0.png)\n\n```bash\n\
    $ sudo apt update\n$ sudo apt install -y postgresql\n$ psql -U\n$ sudo -u\n```\n\
    \nThe third command above verifies that you have at least version 11 of PostgreSQL\
    \ installed. Once you're in the PostgreSQL shell (the last command), run the following\
    \ commands:\n\n```sql\n$ CREATE DATABASE netbox;\n$ CREATE USER netbox WITH PASSWORD\
    \ 'SuperSecurePasswordDifferentCopyPasteThis';\n$ ALTER DATABASE netbox OWNER\
    \ TO netbox;\n```\n\nTo leave the PostgreSQL shell, enter:\n\n```bash\n$ \\q\n\
    ```\n\nTo double-check that the installation was successful, enter:\n\n```bash\n\
    $ psql --username netbox --password --host localhost netbox\n```\n\nYou will then\
    \ enter your SuperSecurePassword for the NetBox user password. Please do not use\
    \ SuperSecurePassword for your password; it is neither super nor secure. Follow\
    \ your own organization’s guidelines keeping in mind that, if implemented to its\
    \ fullest extent, NetBox may well be the keys to your kingdom.\n\nOnce you enter\
    \ your password, you should see the following output:\n\n```text\npsql (14.8,\
    \ OpenSSL 1.1.1f)\nSSL connection (protocol: TLSv1.3, cipher: TLS_AES_256_GCM_SHA384,\
    \ bits: 256, compression: off)\nType \"help\" for help.\n```\n\nNow complete a\
    \ connection info check with:\n\n```text\nnetbox> \\conninfo\nSuccess: You are\
    \ connected to database netbox as user netbox on host localhost (address 127.0.0.1)\
    \ at port 5432 with the SSL connection described above. You can now quit by entering:\n\
    netbox> \\q\n```\n\n## Redis\n\nYour next installation step is to install Redis\
    \ [6] using:\n\n```bash\n$ sudo apt install -y redis-server\n```\n\nYou need to\
    \ verify that you are now running at least version 4.0 of Redis with:\n\n```bash\n\
    $ redis-server -v\n```\n\nThe output you see should be something like this:\n\n\
    ```text\nRedis server v=6.0.16 sha=00000000:0\nmemic=jemalloc-5.2.1 bits=64\n\
    buildId=828defb5a45b9b2a8d\n```\n\nLastly, you need to verify that the Redis service\
    \ is working properly. Enter the following command:\n\n```bash\n$ redis-cli ping\n\
    ```\n\nwhich should result in PONG as the response.\n\n## NetBox and Dependencies\n\
    \nYou will need to also install the NetBox dependencies (as shown in Figure 3)\
    \ using:\n\n```bash\n$ sudo apt install -y python3 python3-pip python3-venv python3-dev\
    \ build-essential libxml2-dev libxslt1-dev libffi-dev libpq-dev libsasl2-dev zlib1g-dev\
    \ git\n```\n\nDouble-check that you have at least version 3.8 of Python [7] installed\
    \ by running:\n\n```bash\n$ python3 -V\n```\n\nNow you need to create the installation\
    \ directory and cd (change directory) into it and download NetBox with:\n\n```bash\n\
    $ cd ~\n$ sudo mkdir -p /opt/netbox/\n$ cd /opt/netbox/\n$ sudo git clone -b master\
    \ --depth 1 https://github.com/netbox-community/netbox.git .\n```\n\n## Configuration\n\
    \nIf you read the NetBox documentation, you will notice that my configuration\
    \ instructions vary somewhat from the documentation. The documentation does mention\
    \ doing what I recommend, but it doesn't make it obvious, so I will try to make\
    \ these steps a bit easier to understand.\n\n### Listing 1: Modifying Database\
    \ Parameters\n\n```python\nDATABASE = {\n    'ENGINE': 'django.db.backends.postgresql',\
    \    # Database engine\n    'NAME': 'netbox',                            # Database\
    \ name\n    'USER': 'netbox',                            # PostgreSQL username\n\
    \    'PASSWORD': 'SuperSecurePassword',            # PostgreSQL password\n   \
    \ 'HOST': 'localhost',                         # Database server\n    'PORT':\
    \ '',                                   # Database port (leave blank for default)\n\
    \    'CONN_MAX_AGE': 300,                         # Max database connection age\
    \ (seconds)\n}\n```\n\nNote: The period (.) at the end of the last command is\
    \ required for the command to work properly.\n\nNext you need to create the NetBox\
    \ user and change ownership of the installation directory to that user with:\n\
    \n```bash\n$ sudo adduser --system --group netbox\n$ sudo chown --recursive netbox\
    \ /opt/netbox/netbox/media/\n```\n\nFirst, I'll edit the NetBox configuration\
    \ file using Cockpit [8] on Ubuntu Server (see the \"Config Editors\" box as follows:\n\
    \n```bash\n$ cd /opt/netbox/netbox/netbox/\n$ sudo cp configuration_example.py\
    \ configuration.py\n$ sudo nano configuration.py\n```\n\n### Config Editors\n\n\
    I did the install for this article using Cockpit on Ubuntu Server because (in\
    \ my experience) it makes administration very easy. I installed a 45Drives add-on\
    \ for Cockpit called cockpit-navigator, which greatly improves running servers\
    \ in general, especially if you need to edit lots of config files and create configs\
    \ from templates and perform other common configuration actions regularly. You\
    \ can also do all this in the terminal (which Cockpit also includes) if you prefer\
    \ to use something like nano [10] or Vim [11].\n\n![](img/740bd926461af28ed755753238e647a2_50_0.png)\n\
    \n**Figure 4:** You can edit configuration.py with Navigator from 45Drives in\
    \ Cockpit to set up NetBox if you prefer a graphical editor.\n\n### Listing 2:\
    \ Modifying Redis Parameters\n\n```python\n01 REDIS = {\n02 \t'tasks' : {\n03\
    \ \t\t'HOST': 'localhost',\t\t# Redis server\n04 \t\t'PORT': 6379,\t\t\t\t# Redis\
    \ port\n05 \t\t'PASSWORD': '',\t\t# Redis password (optional)\n06 \t\t'DATABASE':\
    \ 0,\t\t\t# Database ID\n07 \t\t'SSL': False,\t\t\t# Use SSL (caching)\n08 \t\
    },\n09 \t'caching' : {\n10 \t\t'HOST': 'localhost',\n11 \t\t'PORT': 6379,\n12\
    \ \t\t'PASSWORD': '',\n13 \t\t'DATABASE': 1,\t\t\t# Unique ID for second database\n\
    14 \t\t'SSL': False,\n15 \t}\n16 }\n```\n\nIf you are also installing this on\
    \ Ubuntu Desktop, use:\n\n```bash\n$ sudo gedit configuration.py\n```\n\nFor versions\
    \ of Ubuntu newer than 20.04, use:\n\n```bash\n$ sudo gnome-text-editor configuration.py\n\
    ```\n\nYou will then be able to edit the file directly in a text editor. This\
    \ might be easier if you are less familiar with using Vim or nano from the terminal.\n\
    \nYou will need to modify four keys in the config file (Figure 4). First, you\
    \ will change the ALLOWED_HOSTS parameter:\n\n```python\nALLOWED_HOSTS = ['netbox.example.com',\
    \ '192.168.2.13']\n```\n\nIf you are unsure about what to enter here, use your\
    \ server’s IP address, which you can get by typing\n\n```bash\n$ ip addr\n```\n\
    \ninto the terminal. You can also type `$ hostname` into the terminal and put\
    \ your server’s hostname here as well, or you can use both if that makes sense.\
    \ My installation has four entries here, separated by commas. You will enter this\
    \ in a web browser later to get to the NetBox web GUI.\n\nWarning: Do not type\
    \ this in the example ALLOWED_HOSTS comment directly above the ALLOWED_HOSTS parameter.\
    \ If you get a 400 bad request error, I suggest checking the ALLOWED_HOSTS comment\
    \ to see if you accidentally entered your IP address or hostname there.\n\nNext\
    \ you need to modify the database parameters as shown in Listing 1.\n\nYou then\
    \ need to modify the Redis parameters as shown in Listing 2.\n\nFinally, you will\
    \ need to modify the secret key parameter. First, you need to generate your secret\
    \ key with:\n\n```bash\n$ python3 /opt/netbox/netbox/generate_secret_key.py\n\
    ```\n\nCopy and paste the generated key into the SECRET_KEY parameter space below\
    \ the REDIS parameter. You will use this key if you decide to set up a second\
    \ NetBox server for backup, so jot it down for future reference. If you forget\
    \ to do this, you can always get back into configuration.py to retrieve the secret\
    \ key if needed later.\n\nNow you can create and edit the local_requirements.txt\
    \ file with:\n\n```bash\n$ cd /opt/netbox/\n$ sudo nano local_requirements.txt\n\
    ```\n\nIf you intend to use a remote database as mentioned in the online documentation,\
    \ you will want to enter djangostorages [12] here. What is not clear in the documentation\
    \ is that you also need to enter any other plugins that you intend to use in the\
    \ local_requirements.txt file in /opt/netbox. (For a list of NetBox plugins, see\
    \ the NetBox Community Plugins GitHub page [13].) In addition, the plugins need\
    \ to be listed in the previously modified configuration.py file in /opt/netbox/netbox/netbox.\n\
    \nIn local_requirements.txt, simply enter each desired plugin (Figure 5), one\
    \ per line, as follows:\n\n- djangostorages\n- netbox-topology-views\n- netbox-inventory\n\
    - netbox-rqcode\n\nIn local_requirements.txt, note that the plugins use dashes\
    \ (-). When you edit the configuration.py file, you will change some of the dashes\
    \ to underscores (_). I found this super frustrating and inconsistent because\
    \ it is not always dashes in one place and underscores in the another, but it\
    \ is often different between the two. (If you build plugins for NetBox and can\
    \ avoid this, please consider making your plugin names one word to avoid this\
    \ issue.)\n\nNow that you have edited and saved the local_requirements.txt file\
    \ to include your desired plugins, you also need to enable them by once again\
    \ modifying the configuration.py file. You can open configuration.py with:\n\n\
    ```bash\n$ cd /opt/netbox/netbox/netbox/\n$ sudo nano configuration.py\n```\n\n\
    Look for the PLUGINS parameter and, depending on the plugin, you may also need\
    \ to change PLUGINS_CONFIG as well. Based on the plugins I added to my local_requirements.txt\
    \ file, my PLUGINS section should look like this:\n\n![](img/740bd926461af28ed755753238e647a2_51_0.png)\n"
  mdcn: "\n在信息管理方面堪称福音。NetBox 不需要使用者对系统有深入了解，甚至不需要身处 IT 部门。对于所有层级的用户来说，在 NetBox 中搜索和导航都是直观且简单的。\n\
    \n## 安装\n\n虽然你可以在 NetBox 文档中找到安装 NetBox 的命令，但我将在此为你逐一讲解，并补充一些我在部署和配置特定安装环境时总结的注意事项、怪癖和建议。\n\
    \n我在一台裸机 Ubuntu 系统 [3] 上运行 NetBox，配备单个固态硬盘（SSD），数据库通过 cron 作业和从 LVL1/Techs 论坛\
    \ [4] 获取的脚本每日备份到网络服务器。此外，我建议至少配备一台现场备份机器和一台异地备份机器，或者更好的是，在云中运行一台虚拟机（VM）用于故障切换（设置这些备份不在本文讨论范围内）。我将假设你有一台用于安装\
    \ NetBox 的机器和另一台用于备份的机器（基于你组织典型的运营程序和规范）。\n\n## PostgreSQL\n\n首先，你需要使用以下命令安装 PostgreSQL\
    \ [5]：\n\n![](img/740bd926461af28ed755753238e647a2_49_0.png)\n\n```bash\n$ sudo\
    \ apt update\n$ sudo apt install -y postgresql\n$ psql -U\n$ sudo -u\n```\n\n\
    上面的第三个命令用于验证你至少安装了 PostgreSQL 11 版本。进入 PostgreSQL  shell（最后一个命令）后，运行以下命令：\n\n\
    ```sql\n$ CREATE DATABASE netbox;\n$ CREATE USER netbox WITH PASSWORD 'SuperSecurePasswordDifferentCopyPasteThis';\n\
    $ ALTER DATABASE netbox OWNER TO netbox;\n```\n\n要退出 PostgreSQL shell，请输入：\n\n\
    ```bash\n$ \\q\n```\n\n为了再次确认安装成功，请输入：\n\n```bash\n$ psql --username netbox --password\
    \ --host localhost netbox\n```\n\n然后你需要输入 NetBox 用户的 SuperSecurePassword。请不要将\
    \ SuperSecurePassword 作为你的密码；它既不是超级也不是安全的。请遵循你组织的指南，并牢记如果充分利用，NetBox 很可能就是你的王国钥匙。\n\
    \n输入密码后，你应该看到以下输出：\n\n```text\npsql (14.8, OpenSSL 1.1.1f)\nSSL connection (protocol:\
    \ TLSv1.3, cipher: TLS_AES_256_GCM_SHA384, bits: 256, compression: off)\nType\
    \ \"help\" for help.\n```\n\n现在使用以下命令完成连接信息检查：\n\n```text\nnetbox> \\conninfo\n\
    Success: You are connected to database netbox as user netbox on host localhost\
    \ (address 127.0.0.1) at port 5432 with the SSL connection described above. You\
    \ can now quit by entering:\nnetbox> \\q\n```\n\n## Redis\n\n你的下一个安装步骤是使用以下命令安装\
    \ Redis [6]：\n\n```bash\n$ sudo apt install -y redis-server\n```\n\n你需要使用以下命令验证你至少正在运行\
    \ Redis 4.0 版本：\n\n```bash\n$ redis-server -v\n```\n\n你看到的输出应该类似以下内容：\n\n```text\n\
    Redis server v=6.0.16 sha=00000000:0\nmemic=jemalloc-5.2.1 bits=64\nbuildId=828defb5a45b9b2a8d\n\
    ```\n\n最后，你需要验证 Redis 服务是否正常工作。输入以下命令：\n\n```bash\n$ redis-cli ping\n```\n\n响应应为\
    \ PONG。\n\n## NetBox 及依赖项\n\n你还需要使用以下命令安装 NetBox 的依赖项（如所示）：\n\n```bash\n$ sudo\
    \ apt install -y python3 python3-pip python3-venv python3-dev build-essential\
    \ libxml2-dev libxslt1-dev libffi-dev libpq-dev libsasl2-dev zlib1g-dev git\n\
    ```\n\n通过运行以下命令，双重检查你至少安装了 Python [7] 3.8 版本：\n\n```bash\n$ python3 -V\n```\n\n\
    现在你需要创建安装目录并 cd（更改目录）进入该目录，并下载 NetBox：\n\n```bash\n$ cd ~\n$ sudo mkdir -p /opt/netbox/\n\
    $ cd /opt/netbox/\n$ sudo git clone -b master --depth 1 https://github.com/netbox-community/netbox.git\
    \ .\n```\n\n## 配置\n\n如果你阅读 NetBox 文档，你会发现我的配置说明与文档略有不同。文档确实提到了我推荐的做法，但表述并不明显，所以我会尝试让这些步骤更易于理解。\n\
    \n### 列表 1：修改数据库参数\n\n```python\nDATABASE = {\n    'ENGINE': 'django.db.backends.postgresql',\
    \    # 数据库引擎\n    'NAME': 'netbox',                            # 数据库名称\n    'USER':\
