    \n## 马道格的汪星屋\n\n尽管有政府监管，早期技术仍然存续——人工智能（AI）也将如此。 文 Jon “MADDOG” HALL\n\n![](img/740bd926461af28ed755753238e647a2_76_0.png)\n\
    \nJon “maddog” Hall 是一位作家、教育家、计算机科学家和自由软件先驱，自 1994 年第一次会见 Linus Torvalds 并促成 Linux\
    \ 移植到 64 位系统以来，一直是 Linux 的热情倡导者。他担任 Linux International® 的主席。\n\n### 并不智能\n\n\
    我为 Linux 杂志撰写文章已超过二十年。有些文章非常技术性，有些是面向商业的，有些则涉及自由开源与闭源在系统生产中的哲学。\n\n然而，近期各政府限制人工智能（AI）的举措促使我本月撰写了一篇观点文章，描述为什么这种限制行不通。\n\
    \n我回顾历史上其他“限制”行为，例如禁运。你真的认为处于禁运下的国家无法获得它们开展任何人工智能（AI）活动所需的硬件和软件吗？无论是通过从某些国家走私，还是依靠某个“伙伴”打破禁运？\n\
    \n我记得过去对加密的限制。美国对向境外运输加密技术有着极其繁琐的规定，以至于即使你从加拿大买了一箱加密软件，从未拆封，试图将其寄回，联邦执法部门也会追究你的责任。我们试图告诉政府，所有优秀的密码学家正在离开美国，前往可以出售其技能的地方，但无济于事——政府不予理会。\n\
    \n现在是人工智能（AI）了。权贵和富豪们联合起来告诉软件社区，政府应该对 AI 的使用进行许可和控制，好像没人拍过一部关于 AI 的电影似的。好像你需要一台房间大小的计算机才能做\
    \ AI。好像这些工业巨头可以给每个曾思考过 AI 的人的思想加上锁。\n\n首先，大多数人甚至无法定义“AI”。他们认为计算机永远不会变得足够智能来完成*他们*的工作。这是他们的第一个错误。如果你谈论的是真正的\
    \ AI，那么计算机（或机器人）不仅能够完成你的工作，它还会比你更快、更好地完成这项任务，而且无需休息、睡觉或吃饭——每天 24 小时，每年 365 天。而且计算机/机器人不仅能做你的工作，它还会建造像它自己或更优秀的计算机/机器人，以并行方式完成你的工作。\n\
    \n我见证了 AI 从科幻小说中的概念发展到如今的地步。多年来，我们低估了复制人类思维和意识所需的 CPU、内存、数据及其他因素。大多数人仍然低估了这些因素，可能差了好几个数量级，但通过结合大规模数据农场、巨大的处理能力和编程方法，我们可以自动化许多筛选过程，使我们更接近看似智能的结果。\n\
    \n我是那些认为人脑是一台复杂的电化学机器的人之一。神经元（约 860 亿个，加减 80 亿个）提供“存储”，并通过突触连接（每个神经元与其他神经元有 7,000\
    \ 个突触连接）相互连接——这些能量火花触发了每个神经元每秒发送给其他神经元的 5 到 50 条“信息”，而我们仍在探索其机制。在成年人中，这些突触连接数以万亿计。\n\
    \n通过漫长的进化过程，我们内置了相当多的“编程”，但婴儿在某种程度上仍然是一张白纸，受到影响并被教导如何思考——从而培养那些突触连接。\n\n是的，我们对\
    \ ChatGPT 能做什么感到惊叹，但请记住，许多例子已被证明远非“智能”。它们来自可能不完整的、且已被证明在 ChatGPT 回答中存在不准确性的数据集。这些例子往往需要超出\
    \ ChatGPT 所用数据集范围的情境，即使该数据集非常庞大。\n\n话虽如此，总有一天 AI 会变得“智能”，没有任何法律能阻止其解释或滥用。\n\n\
    试图限制其发展的政府和公司只会迫使那些想要“在 AI 上领先”的其他政府和公司转入地下。我们将像多年前有过太空竞赛和核军备竞赛一样，拥有一场 AI 竞赛。区别在于，你不需要发射火箭或运输铀来开发\
    \ AI。\n\n我们已不再处于计算机科学领域，那里需要数十亿美元和政府支持来构建系统。几乎任何个人都可以资助 AI 系统的开发，就像他们多年前编写自己的加密代码一样。每个开发者都会在法律之外证明其开发的正当性。赢得\
    \ AI 战争的唯一方式是公开参与其中。这样，当 AI 来到你家门口时，你可能已经做好了准备。\n\n## 使用 fdupes 检测重复项\n\n### 双重麻烦\n\
    \n命令行 fdupes 工具帮助你查找重复的文件夹和目录。\n\n文 FERDINAND THOMMES\n\n硬盘有一个令人不快的倾向，即比预期更快地填满。原因并不总是立即显而易见。在这种情况下，保持井井有条不应被低估。杂乱、组织不良的硬盘往往比组织良好的硬盘填满得更快。由于生活是秩序与混乱的混合体，大多数用户可能都面临这个问题。\n\
    \n硬盘利用率意外偏高通常是由重复文件造成的。典型的候选者是照片、音乐或视频，它们可以迅速占用数 GB 的空间，且往往难以查找。Linux 上有多个图形应用程序可帮助你检测和删除此类重复项，命令行上也有多个工具。\n\
    \n### GUI 还是 CLI？\n\n用于清理的知名图形界面工具包括 FSlint 和 dupeGuru。在本文中，我将关注 2000 年首次发布的命令行工具\
    \ fdupes [1]。大多数发行版的存档中都包含该工具，其大小仅略超 100KB；你可以使用发行版选择的软件包管理器进行安装。列表 1 展示了 Debian、Fedora\
    \ 和 Arch Linux 的操作指南。\n\n2022 年 9 月的 2.2.1 版本尚未进入所有存储库 [2]。如果你想从源代码编译 fdupes，可以使用\
    \ GitHub 上的 tarball。解压后，只需遵循熟悉的三步流程：`./configure`、`make` 和 `make install`。从 fdupes\
    \ 2.0 开始，有两个依赖项你可能需要根据发行版自行解决。为此，请遵循解压后存档中 INSTALL 文件的说明。\n\n安装后，你可以立即使用该工具，无需任何配置。该工具通过几个步骤识别指定目录中的重复文件。文件名对于检测重复项并不重要。相反，两个文件必须首先大小相同；在此前提下，fdupes\
    \ 比较它们的 MD5 校验和。\n\n最后，软件执行逐字节比较，以确保绝对是同一个文件。\n\nFdupes 拥有许多选项，让你控制搜索和后续的重复项处理。最初，你可以通过运行\
    \ `fdupes --help` 命令来熟悉该工具。这将帮助你识别适合你使用场景的选项。\n\n### 试运行\n\n为了测试，我在 *Documents*\
    \ 目录中创建了一个 *fdupes* 目录，然后创建了 10 个文本文件，其内容均为 *fdupes finds and removes duplicates*。列表\
    \ 2 展示了如何快速完成此操作。\n\n随后的 `ls -l` 确认文件已创建。在新目录中查找重复项最简单的方法是使用 `fdupes ~/Documents/fdupes`\
    \ 命令（图 1）。通过空格分隔路径，你可以同时指定多个目录。要在目录中递归搜索，你需要使用 `-r` 选项，例如 `fdupes -r ~/Documents`（图\
    \ 2）。在这种情况下，该工具找到了我的 10 个文本文件以及一些其他重复项。使用 `-r` 选项来指定你希望包含的子目录路径。\n\n`-s`（`-size`）选项显示匹配结果的大小。你可以使用\
    \ `-t` 或 `--time` 来了解文件最后修改的时间。`-G` 或 `--minsize=SIZE` 和 `-L` 或 `--maxsize=SIZE`\
    \ 让你进一步缩小选择范围。\n\n### 删除时要小心\n\n但查找只是任务的一部分；毕竟，我们想要删除重复项以清理硬盘。这时 `-d`（`-delete`）选项派上用场。使用\
    \ `-d` 时，务必确保你的文件指定是正确的——使用 fdupes 删除的文件无法恢复。命令\n\n```\nfdupes -d ~/documents/fdupes\n\
    ```\n\n#### 列表 1：安装 fdupes\n\n```python\n#### Debian 及其衍生版本：\n$ sudo apt install\
    \ fdupes\n\n#### Fedora：\n$ sudo dnf install fdupes\n\n#### Arch Linux 及其衍生版本\n\
