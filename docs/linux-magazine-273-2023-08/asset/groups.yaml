  mdcn: "\n## 创客空间自制计分板\n\n`clockRun` 和 `clockStop` 函数都会更改 `self.scoreboard.clk.running`\
    \ 的状态。如果该变量为 `True`，时钟会被更新。如果为 `False`，时钟则不会更新，实际上等同于暂停。`clockStop` 还会调用 `self.gameEvent`\
    \ 以添加一条记录，表明时钟已停止。由于时钟不特定于某支队伍，第二个参数设为 0。这些函数的 JavaScript 版本（第 80-92 行）未在此处展示。一旦\
    \ Python 函数被 jQuery 调用，就会设置或清除一个 JavaScript 定时器，以更新控制页面。\n\n对于 `clockSet` 函数，变量\
    \ `self.scoreboard.clk.seconds` 跟踪以秒为单位的剩余比赛时间，该值被设置为比请求时间多一秒。接着，`self.scoreboard.clk.tick`\
    \ 会自动减去一秒。传入 `manual = True` 会强制重新读取时钟，即使它当前未在运行。最后，返回 `self.scoreboard.clk.clockString`，这是以分钟和秒表示的剩余时间的文本形式。\n\
    \nJavaScript 版本位于第 101-116 行（未展示）。它会询问操作员应将时钟设置为何值，如果对话框被取消，则包含请求的时间或 `null`。\n\
    \n如果数值有效，请求会被拆分为分钟和秒，然后转换为秒。创建新对象并添加秒参数后，通过 jQuery 将其发回 Python 函数。随后控制屏幕会用新的时钟值进行更新，并清除更新间隔，以便在时钟再次开始运行前不发出时钟请求。\n\
    \n`possession()` 函数（第 333-339 行）调用 `self.scoreboard.possession` 的切换方法，该方法会翻转当前持有球的队伍（由\
    \ `<` 和 `>` 符号作为箭头指示）。\n\n第 336 行和第 337 行检查哪支队伍持有球，并添加一个 `gameEvent` 以反映这一变化。最后，返回两个由冒号分隔的字符串；每个字符串要么是空格，要么是\
    \ `<` 或 `>` 符号之一。JavaScript 版本位于第 71-78 行（未展示）。\n\n通过 jQuery 发布持球权变更后，返回的字符串会被拆分为两部分，并更新控制屏幕上的左侧和右侧\
    \ div。\n\n## 时钟类\n\n时钟类（第 341-371 行）管理主图形（计分板）显示中的比赛时钟。`__init__` 函数设置了几项内容：`self.screen`\
    \ 是创建时钟时传入的屏幕对象的引用；`self.width` 通过调用屏幕对象的 `getWidth()` 方法来存储屏幕宽度；`self.height`\
    \ 被显式设置以定义时钟显示的高度；而 `self.seconds` 是时钟上的时间，初始化为 6 * 60 秒，以反映六分钟的节次。\n\n第 347 行创建了一个\
    \ Pygame 表面，用于绘制时钟，第 348 行设置了字体。最后，`self.running` 跟踪时钟是处于运行还是暂停状态。\n\n第 351-354\
    \ 行计算时钟数值并转换为 int；秒数是 `self.seconds / 60` 取模（余数）的结果。最后，通过计算出的数值组装出 `self.clockString`。\n\
    \n主循环每秒调用一次 tick 函数（第 356-363 行）。如果时钟上仍有剩余时间，且 `self.running` 或 `manual` 被设置为\
    \ `True`，则 `self.seconds` 减一，并重复之前的计算以更新 `self.clockString`。设置时钟时使用的 `manual`\
    \ 参数强制时钟立即重新生成，而不是等待下一次自动调用 tick。\n\n渲染函数（第 365-371 行）负责绘制时钟。`self.clockFont.render`\
    \ 接受 `self.clockString` 和一个颜色表作为参数。`True` 参数表示在绘制文本时进行抗锯齿处理。结果是一个 Pygame 表面 `timeSurf`，上面绘制了当前的比赛时间。\n\
    \n在计算 `timeSurf` 的中心点后，`self.clockSurf` 通过填充黑色进行清除，并将 `timeSurf` 贴到其上（blit，即复制）。然后返回该表面。这种复制操作看似多余，但实际情况是：当\
    \ `self.clockFont.render` 生成文本时，表面的大小恰好是所生成文本的大小。为了填充 `__init__` 中指定尺寸的空间，必须将其复制到较大的表面中。\n\
    \n## 持球权类\n\n持球权类（第 373-406 行）指示在特定时刻谁持有球。`__init__(self)` 设置图形显示，初始状态由 `self.direction`（当前谁持有球）指定。创建一个表面并用\
    \ `self.leftString` 和 `self.rightString` 进行初始化。\n\n便捷函数 `makeSurfaces` 创建 `self.leftSurf`\
    \ 和 `self.rightSurf`，这两个持球权箭头分别用 `<` 和 `>` 符号渲染。\n\n当调用切换函数（第 388-396 行）时，持球权从一支队伍变更到另一支队伍。`if`\
    \ 语句检查当前哪支队伍持有球，然后将所有变量更新到其相反状态。注意，`self.leftString` 和 `self.rightString` 要么是一个箭头，要么是一个空字符串。\n\
    \n当一切都准备好在渲染函数中绘制时，`self.posSurf` 通过填充黑色（第 399 行）进行清除，然后生成标签文本，计算中心点，并将其贴到最终表面。\n\
    \n第 404 行和第 405 行确保箭头贴到表面的正确一侧。如果 `self.direction` 是 `<`，箭头绘制在表面的左侧；否则，绘制在右侧，然后返回最终表面。\n\
    \n## 标签和计数器\n\n标签类（第 408-430 行）代表计分板上带有任意标签的数值。标签及其数值可以使用不同的字体和颜色。Pygame 表面在第\
    \ 418 行创建。\n\n渲染函数通过清除表面（用黑色填充）开始，然后渲染数值，计算其中心点并绘制它。第 426-428 行对标签文本执行相同的操作，然后在第\
    \ 430 行返回。\n\n第 432-454 行描述了计数器类。计数器与标签相同，除了其 `self.value` 预期为整数。\n\n## 面板类\n\n\
    所有组件都在面板类（第 456-538 行）中汇聚。我们此前定义的所有模块都在此处初始化，从启动 Pygame 引擎的 `pygame.display.init()`\
    \ 开始。`pygame.display.set_mode` 创建绘图表面，设置窗口大小。`display = 1` 使 Pygame 窗口默认使用第二个显示器，而\
    \ `flags = pygame.FULLSCREEN` 顾名思义。\n\n由于该程序使用 Pygame 的字体功能，这些功能在第 460 行进行初始化，随后加载所有字体。在\
    \ Pygame 中，字体是指字体本身及其关联的大小，因此同一个字体文件可以用不同的大小多次加载。\n\n第 446 行加载 `self.logo`，这是显示在计分板底部的标志。行末的\
    \ convert 使图像的格式与 Pygame 初始化的显示格式匹配，从而使标志贴到屏幕上时速度更快。\n\n第 468 行创建时钟类的一个实例，传入 `self.screen`\
    \ 的引用，以便可以直接绘制更新后的时钟。\n\n程序的最后几行（未展示）为主队和客队的得分、每支队伍的暂停次数以及比赛节次初始化了五个不同实例的计数器类。在每种情况下，`valueFont`\
    \ 和 `labelFont` 都设置为之前初始化的字体/大小组合之一。标签指示每个计分板正在跟踪哪个球场。\n\n## 典型比赛日\n\n当团队在比赛日到达现场时，首要任务是设置计分板操作员的控制台（每个计分板配备两台\
    \ Raspberry Pi）。完成后，机器人控制的摄像机被放置在球场周围，并对一切进行测试。年轻的队伍首先在半场模式下进行比赛。当天比赛进行到一半时，比赛切换到全场模式（图\
    \ 5）。\n\n每场比赛的中场休息时，视频消息会在屏幕上播放，随后计分板恢复正常操作（图 6）。当天进行到一半时，由于现在只使用一个球场，一个计分板系统被路由到两个得分显示上。这种切换是通过矩阵视频路由器实现的。\n\
    \n## 控制视频矩阵\n\n虽然矩阵路由器基本操作起来相当简单易于理解，但给它们附上有意义的名称和标签总是比记忆一组数字更让人容易接受。为常见配置添加一些快捷方式会让事情变得更加简单，这就是矩阵控制程序的目的（未在此展示，但可在线获取\
    \ [3]）。\n\nRaspberry Pi 通过 Python 中建立的 USB 串行连接与矩阵通信：\n\n```python\nclass matrixSerial:\n\
    \    def __init__(self):\n        self.port = serial.Serial(\n            \"/dev/ttySBO\"\
    , 9600)\n\n    def send(self, cmd):\n        self.port.write(cmd)\n```\n\n`__init__`\
    \ 行创建 `self.port`，它是 Serial 对象的一个实例，包含串行设备的名称和请求的波特率。其他默认值即可满足所有需求。send 函数接收 `cmd`\
    \ 并通过调用 `self.port.write` 将其传输，从而将数据发送到矩阵。\n\n## 按钮类\n\n程序的主要功能是为用户在触摸屏上提供易于操作的选项；按钮类设置了按键按下时的动作。当类被实例化时，它接收屏幕、屏幕对象和字体，其中字体是一个用于标记按钮的\
    \ Pygame 字体对象。这些中的每一项都存储在类属性中，以供其他方法使用。\n\n![](img/740bd926461af28ed755753238e647a2_70_0.png)\n\
    \n图 5：根据参赛年龄组别，比赛可能在全场或半场进行。每个计分板都必须被路由以跟随当前的球场配置。\n\n![](img/740bd926461af28ed755753238e647a2_70_1.png)\n\
    \n图 6：在面向观众的大屏幕监视器上看到的计分板显示。\n\n"
