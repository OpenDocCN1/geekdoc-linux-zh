    之所以得以生存，是因为它完美地执行了一项简单任务：让您始终知道网络上的其他机器是否可访问并响应您的身份验证请求。“ping”这个名字 famously 指的是潜艇声呐脉冲声，即声波从远程物体反射回来的声音。Linux
    的 ping 对远程服务器做同样的事，告诉您远程机器是否可访问，以及数据包从您的机器到远程机器再返回所需的时间。ping 的输出只不过是每行显示一个数据包的目标
    IP 地址和往返时间的文本。这留下了很大的改进空间，特别是如果您想随时间追踪响应，而这正是超级简单且超级实用的 gping 所做的。


    ![](img/740bd926461af28ed755753238e647a2_82_1.png)


    Gping 可以解析 IPv4 和 IPv6 目标地址，并使用颜色更好地区分响应时间。Gping 仍然是一个命令行 ping 工具，但带有一个显示一个或多个服务器响应时间的图表。在最简单的情况下，它是
    ping 的直接替代方案，其中，每个响应的单独输出行变成了图表上绘制的一个点。您可以更改间隔、缓冲区量以及水平和垂直边距，但当图表到达边缘时，它也会开始滚动，让您能够快速查看从当前机器到远程主机可访问性的任何变化。最好的是，在命令中添加多个目标会在同一个图表上分别绘制每个目标的响应时间，因此您可以更好地检查网络性能，或关注您自己的服务器，当试图用您的命令行技能给人留下深刻印象时，它看起来非常酷。


    **项目网站**

    https://github.com/orf/gping


    ![](img/740bd926461af28ed755753238e647a2_83_0.png)


    ## DDCcontrol


    屏幕控制器


    我们之前看过一个名为 ddcctl 的小型命令行实用程序，用于控制显示器。它是使用 DDC/CI 标准通过屏幕的 I2C 总线控制各种显示器设置的极佳工具。唯一的问题是，ddctl
    可能有点过于受限，特别是在探索屏幕更具实验性或定制化的特性以及从您的显示器通过 I2C 暴露的其他参数时。DDCcontrol 是一个具有相同目标但更全面的实用程序。它在硬件层面工作，而不是通过用户空间，并且可以访问
    ddcctl 无法访问的特定于制造商的参数。然而，与 ddcctl 一样，它也是通过 I2C 总线执行这些操作的，这意味着始终存在风险，您可能会弄乱一些无法恢复的设置，因此值得保持谨慎，并只在您准备好失去的硬件上进行实验。


    解决了这个问题后，DDCcontrol 从命令行运行，并首先方便地扫描您的 I2C 总线上的任何屏幕。这特别有帮助，因为选错设备可能会破坏的不仅仅是您的显示器。与
    dd 类似，向系统中的其他设备发送潜在破坏性命令会导致比错误的屏幕亮度更大的问题，而一旦将正确的设备添加到命令中，您就可以安全地探测您的屏幕能力。DDCcontrol
    通过使用已知屏幕及其功能的数据库来缓解这种风险，使您可以安全地访问 DDC/CI 规范之外的参数。这些通常是可能需要深入菜单挖掘或激活某种工程模式才能访问的选项，例如刷新率和色域。它对于切换输入仍然有用，但您也可能发现可以分割显示并更改面板的背光级别。


    ![](img/740bd926461af28ed755753238e647a2_83_1.png)


    如果 DDCcontrol 的命令行选项太多了，还有一个出色的 GUI，它在更令人愉悦的图形窗口中提供相同的选项。


    **项目网站**

    https://github.com/ddccontrol/ddccontrol


    ## killport


    进程管理器


    它很丑陋，让你感到内疚，而且是你不该做的事情。但有时杀死正在运行的进程是必要的。这通常是在尝试了其他所有方法之后才发生的。你已经礼貌地使用应用程序的退出选项请求过。你按了冒号并输入了
    q。甚至狂按 Esc 或 Ctrl+C 也没用，而 top 中的进程 ID 持续吞噬你的计算和内存资源。这时，kill 甚至 kill -9 就成了你的朋友。就像冷血的刺客一样，它会摧毁进程并清除其内存。但当你不知道该杀死哪个进程，或者不知道该由哪个进程负责那个停滞的进程时会发生什么？像任何优秀的刺客一样，你需要做一些侦察。


    top 命令及其同类工具很擅长显示哪些进程处于停滞状态以及哪些进程在使用 CPU 和内存资源，你可以使用诸如 lsof 等命令来列出哪些进程正在访问哪些文件和设备。但访问网络或作为服务器运行的进程更难追踪。这些进程将使用端口进行通信，通常是在等待数据到达或处理传输中的数据，而杀死像这样的进程正是名为
    killport 的适当命名的工具被开发出来的原因。在最简单的情况下，你只需使用端口号作为单个参数运行 killport。例如，如果你以默认配置运行 SSH
    守护进程，`killport 22` 将会杀死 SSH 守护进程。同样，你可以包含多个端口来要求对一整套进程进行“大屠杀”，如果你想在暴力攻击之前施加额外的痛苦，还可以指定信号。它很简单但运行出色，是比试图通过
    netstat 弄清楚哪些进程附加到哪些服务好得多的选择。


    ![](img/740bd926461af28ed755753238e647a2_83_2.png)


    Killport 帮助你在没有学习 netstat 的晦涩方法的情况下，停止运行在特定端口上的服务。


    **项目网站**

    https://github.com/jkfran/killport


