    # Sound Explorer


    Once you get your podcast operation up and running, you might decide you want
    a real mixer and some higher-end software. We''ll introduce you to Ardour and
    get you started with some basic audio hardware. By Hartmut Noack


    ![](img/740bd926461af28ed755753238e647a2_23_0.png)


    Podcasting often occupies a space on the low end of the audio recording spectrum.
    All you really need is a computer, suitable software, and a microphone. Some users,
    however, might wish to avoid this most basic scenario. You might ask, “If I’m
    going to all the trouble to set up a studio for podcasting, what else can I do
    with it?” Or you might want your studio to grow into something more sophisticated.
    Perhaps you are a musician yourself? Or you wish to host live music – or other
    performance alternatives that require mixing and multiple mics.


    In these scenarios, you could easily outgrow the simple mic + Audacity configuration.
    If you’re looking for something more, try Ardour.


    Ardour [1] is still considered the reference application as a free tool for recording
    and mixing on Linux. A variety of alternatives also exist – for instance, Muse
    is a good option if you are composing music with MIDI, and Qtractor offers some
    innovative features for working loops and samples – but when it comes to mixing
    and mastering, Ardour is unsurpassed.


    This article describes how to get past the most basic podcast configuration and
    equip your studio for live recording.


    I’ll also describe some of the hardware you might want to incorporate into your
    studio. Although the setup described in this article might be more detailed, and
    more sophisticated, than a basic Audacity configuration, it is still relatively
    simple and inexpensive. Professional recording studios spend way more money on
    hardware.


    # Mastering Live Performance


    Mastering, putting the final touch to a finished mix, requires something more
    than “it sounds pretty good on my headphones.” If you want to make sure that the
    mix still sounds well enough on a single smartphone speaker while performing well
    on various stereo systems, you need to test it before releasing it.


    Recording live performances raises another issue. Laptop concerts are commonplace,
    and these kinds of performances can easily be managed today using free software
    on Linux and the stereo output of a simple USB interface. But today’s technology
    gives you far greater opportunities. The options range from simple pre-monitoring
    options for DJs that let you sync the sound source precisely with the beat to
    analog mixers as musical instruments.'
