  mdcn: "\n下方的校正。只要 RAW 文件中嵌有 JPEG，且相机已自动校正了失真，此方法即可生效。否则，你必须在“自动”下方的滑块上进行试验。\n\n\
    如前所述，Lensfun 镜头校正配置文件还会自动去除暗角（即圆形阴影），尤其是在图像角落处。如果你希望或需要手动校正此问题，请使用“变换”工具中的暗角校正功能。该工具允许你向左拖动“强度”滑块来添加暗角。通常，暗角不像色差或失真那么令人烦恼；事实上，轻微的暗角往往还具有美学效果（图\
    \ 8）。\n\n最后，导出照片。为此，点击左下角的软盘图标。将显示“保存”对话框。在那里，选择目标文件夹、文件格式（JPEG、PNG 或 TIFF）、位深度（8\
    \ 位或 16 位）以及压缩方式，然后按“确定”或 *1* 以确认。\n\n调整。该应用程序为你提供在整个图像上找到完美色彩平衡的选项。因此，你不再需要依靠其他工具来完成最终编辑步骤。\n\
    \n事实上，该软件在我们看来是目前可用的最佳 RAW 开发者之一。RawTherapee 用起来很有趣，因为它即使在较旧的硬件上也能以可接受的速度运行，且相对易于使用。此外，其结果绝对能够与那些知名度更高的程序的结果相媲美。如果开发者能找到实现\
    \ 10 位屏幕输出的方法，RawTherapee 很可能在未来许多年继续令其用户感到兴奋。\n\n## 结论\n\nRawTherapee 非常适合处理风景照片，这主要归功于新的局部调整功能。该应用程序为你提供在整个图像上找到完美色彩平衡的选项。因此，你不再需要依靠其他工具来完成最终编辑步骤。\n\
