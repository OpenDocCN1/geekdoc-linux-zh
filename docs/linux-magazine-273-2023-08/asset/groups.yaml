    \ post 完成并收到响应时，调用 function ( data )，其中 data 是包含新更新分数（或超时或时期）的返回字符串。首先，使用 data.split\
    \ 将 data 拆分为两部分，然后使用 jQuery 更新控制页面上的分数。\n\n### 时间与控球权\n\n时钟是一个独特的情况，因为它是唯一独立更新的游戏变量。其他一切都是对场上发生之事的响应。\n\
    \nclock 函数（第 314-331 行）中的 getClock 返回一个表示当前比赛时间的字符串，由操作员网页上 JavaScript 函数中的重复间隔调用，以更新操作员时钟。图形线程中的计时器事件既更新内部时钟变量，也重绘记分牌显示器上的时钟。\n\
    \nupdateClock 仅存在于 JavaScript 中，负责保持控制页面时钟的最新状态。它通过 jQuery 调用 getClock 获取当前时钟时间，然后使用当前值更新\
    \ HTML div：\n\n```javascript\nfunction updateClock() {\n    $.post ( “getClock”,\
    \ {},\n        function ( data ) {\n            $( “#clock”).html ( data );\n\
    \        });\n}\n```\n\n"
