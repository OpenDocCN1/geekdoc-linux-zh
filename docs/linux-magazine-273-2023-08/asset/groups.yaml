    ## 深入探究


    ### 命令行 – most


    使用 `--pager PAGER` 参数可以在分页器中显示。然而，bat 充其量只是一个基础的分页器。


    至于 *more*，它已经有 45 年的历史了。它的古老体现在某些版本的 more 甚至直到今天仍不支持向后滚动，以及 `--print-over` (-p)
    选项的持续存在——该选项在显示下一屏时会清除当前屏幕内容，而不是滚动；还有 `-p|plain (-n)` 选项，本应抑制下划线显示，但如今却处于未启用状态。对
    more 最好的评价是，它比 bat 多了几个选项。


    这些局限性使得大多数用户选择了 `less`。虽然 less 功能强大，但它有时似乎对 more 过于敏感，其数十个选项（包括用于搜索和导航的选项）让人望而却步。总体而言，`less`
    是一个坚实的基础，这就是为什么尽管 most 的功能列表更长，less 仍然是标准的分页器。


    ### 充分利用 most


    通过利用当今唾手可得的内存资源，most 提供了 less 所不具备的功能。特别是，如果以特定方式编译，most 可以打开至少两行的多个文件，这一功能非常适合文件比较。通过列出命令和任何选项之后的空格分隔列表来打开多个文件：


    ```

    most OPTIONS FILE1 FILE2

    ```


    文件名显示在窗口底部的状态行中。状态行下方是当前的活动状态或一组基本说明（图 2）。


    在每个窗口内，只需输入字母即可发出命令，而不需要在启动 most 时像选项那样加上一个或两个连字符前缀。但请注意，每个命令所使用的具体选项取决于 most
    的编译方式，因此如果手册页中列出的某个选项不起作用，另一个可能会成功（这里涵盖的选项是那些对我起作用的选项，有时需要经过尝试和错误才能确定）。每个窗口都可以独立滚动，也可以使用
    `i` 或 `L` 与其他窗口同步，这会在状态行中添加一个星号 (*)。默认情况下，most 不自动换行；长行由窗口右边缘的一个美元符号 ($) 表示。你可以通过使用右箭头键滚动或扩展终端窗口宽度来查看行的剩余部分。


    然而，在命令中添加 `-w` 选项可以实现自动换行，并在右边缘标记一个反斜杠 (\)。方便的是，通过在命令中添加 `-e` 选项，你可以编辑当前窗口，这意味着
    most 也可以充当文本编辑器。要切换到另一个窗口，输入 `n`，命令中输入的下一个文件名将出现在窗口底部；你可以按回车键访问该文件。不过，你可能更倾向于使用
    `Ctrl + X + 2` 来分割当前窗口。


    与 less 类似，most 也有大量用于导航的键盘快捷键。most 的手册页列出了数十个快捷键，其中许多有两个甚至三个替代方案。庆幸的是，在窗口内部，你不需要学习所有快捷键也能高效导航。话虽如此，`t`
    和 `b` 对于跳转到窗口的顶部和底部非常方便。`NUMBER +` 用于跳转到特定行号，`NUMBER %` 用于跳转到文件的特定百分比位置也很方便。在长文件中，你也可以选择使用
    `NUMBER U` 向上跳转固定数量的屏幕。更简单地说，你可以直接使用向上和向下箭头键滚动，既可以按默认的单行滚动，也可以通过在按箭头键之前输入数字来选择滚动行数。


    most 还提供了一组搜索功能。启动 most 时，你可以添加 `-c` 使搜索区分大小写。在 most 中，`f` 会提示输入要向前搜索的字符串。类似地，问号
    (?) 会提示输入要向后搜索的字符串。对于 `f` 和 `?`，`Ctrl + G` 可以取消搜索。一旦定位到某个字符串，`n` 会设置一个书签。从那里开始，先按
    `Ctrl + X`，再按 `Ctrl + x`（两次使用相同的键），可以返回到另一个书签，从而允许你在编辑时来回切换，这是一个方便的功能。


    ### 简化学习


    most 相比 less 的另一个优势是它的组织性更好。一方面，most 需要添加到命令中的选项要少得多，而且其中大多数选项只是开启或关闭普通用户不太需要的功能。虽然
    most 的手册页仍然异常冗长，但它比 less 的更短，且组织得远好。


    ![](img/740bd926461af28ed755753238e647a2_40_0.png)


    most 的环境变量也是如此。它们的数量少于 less，而且有几个变量旨在尽量减少记忆选项和命令的需要。MOST_SWITCHES 设置选项，每行一个。例如，


    ```

    define MOST_SWITCHES "-g"

    ```


    会停止连续显示多于一行的空白行。MOST_INIIFILE 甚至更方便，因为它定义了一个配置文件，并在 `/etc/most.conf` 或当前用户主目录中的
    `.mostrc` 中查找它。无论在哪里找到该文件，此配置都会使用以下格式设置默认按键绑定：


    ```

    setkey “FUNCTION” “KEYBOARD SHORTCUT”

    ```


    花时间创建一个配置文件可以定期为用户节省记忆的需要，以及复杂的输入。MOST_HELP 还可以用于设置自定义帮助文件，包含默认文件中未提及的细节。


    此外，那些在 most 中编辑的用户可能也希望在 MOST_EDITOR 中设置他们首选的编辑器。most 的优势不仅在于功能和组织性，还在于这些节省时间的工具。就像文字处理器中的模板一样，设置这些环境变量需要时间，但最终可以迅速让用户上手并节省时间。


