    ## 结论


    当我最初开始阅读有关 NetBox 的资料时，我发现其“成为首选网络真实数据来源”的目标听起来有点矫揉造作。毕竟，它只是一个网络地图的 Web 图形界面，外加数据库中的某些内容。然而，自从安装并使用它以来，我成了一名坚定的支持者。我认为每个网络工程师都应该使用
    NetBox 来绘制网络地图。我不仅在公司，甚至在家用网络中也安装了社区版。它确实是你网络的“真相”——至少在你付出努力之后它会成为如此。


    我仍在记录我所在组织网络的过程中。这是一项巨大的任务，而且永无止境，因为随着网络的扩张、收缩和变化，需要进行更新。我的意图是将 NetBox 构建得足够完善，以便我可以给新员工提供
    NetBox 的登录凭证，让他们能够熟悉整个组织的布局，即使他们无法访问其中看到的所有内容。我还需要在 NetBox 的位置部分添加每栋建筑的地图，这可以通过直接上传物理地图的
    PNG 图像来实现。我可能不会给新员工提供大楼内交换机的凭据，但他们将知道交换机的位置、哪些设备通过哪些端口连接到它们以及这些设备的 IP 地址，并且能够非常快速轻松地找到产品信息。NetBox
    将为新员工提供他们需要了解其操作设备的方方面面，从而能够高效且有效地完成工作。在我们网络中有数十台打印机和数百台 PC 的情况下，能够通过搜索房间或建筑来精确定位某个设备及其与特定交换机的连接，并拥有指向用户指南、安装手册、驱动程序下载页面、规格、资产标签编号和对应序列号的链接，从长远来看将极大提高团队效率，尽管实施这一过程绝对需要时间。然而，这些时间并没有被浪费，因为任何在
    NetBox 中绘制网络地图的人同时也在学习网络的所有内部细节。


    本文中我没有着重强调的一点极其重要：了解你的网络上有什么设备以及这些设备位于哪里，对于网络安全至关重要，并且直接关联到 CIS 风险评估方法论 (RAM)
    中的 CIS 保障措施 1.1、1.2、1.3、2.4、6 以及许多其他项 [18]。


