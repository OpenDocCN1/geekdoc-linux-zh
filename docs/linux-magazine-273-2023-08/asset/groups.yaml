    Red（红色）滑块稍微向右移动。最后，在 100% 视图中检查所有图像区域。移除色差时经常发生的情况是，在其他区域产生了新的色差。


    ![](img/740bd926461af28ed755753238e647a2_92_0.png)


    畸变时有发生。枕形畸变经常发生，尤其是在广角镜头中，对于含有树木或水平地平线的图像来说可能相当恼人。你可以在 Transform（转换）底部的 Lens Corrections（镜头校正）模块中找到相关设置。在
    Lens Correction Profile（镜头校正配置文件）组中选中了 Automatic（自动）选项。但这在很多相机上不会生效，因为镜头选择失败。你需要在
    Lens（镜头）旁边的列表中选择正确的镜头。之后，畸变和暗角都应该消失。


    如果在 Lensfun 数据库中找不到你镜头的校正配置文件怎么办？在这种情况下，首先尝试自动畸变


    图 8：在大多数情况下，可以使用 Lensfun 镜头校正配置文件来校正畸变和暗角。

