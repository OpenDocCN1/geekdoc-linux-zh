    \ 5 中显示的欢迎屏幕，其中包含教程和图标！\n\n## 为其他平台构建\n\nfyne 命令行工具的另一个强大功能是，它可以像 Go 编译器一样为其他平台打包代码。你可以指定你希望为应用捆绑包的目标操作系统，一次指定一个。例如：\n\
    \n```\n> fyne package --os windows\n```\n\n由于编译所需的图形库（例如文章开头安装的那些），跨平台编译有一些额外的要求。请参阅\
    \ Fyne 文档以获取更多信息 [4]。\n\n![](img/740bd926461af28ed755753238e647a2_46_0.png)\n\n\
    如果你熟悉 Docker 或 podman 安装，那么你可以使用 `fyne-cross` [5] 工具，它将在容器内处理所有复杂的开发人员设置过程。只要你有一个正在运行的容器引擎，它应该就像以下这样简单：\n\
    \n```\n> go install github.com/fyne-io/fyne-cross@latest\n> fyne-cross android\n\
    ```\n\n图 6 展示了当该应用运行在 iOS 或 Android 移动设备上时的外观。该打包是使用 `fyne-cross` 创建并安装，使用的是标准开发人员工具。\n\
    \n最后，如果你有兴趣自动化多平台构建并托管下载，请查看诸如 Fyne Labs 的 Geoffrey 之类的构建平台工具 [6]。\n\n## 结论\n\n\
    在不到 100 行代码的情况下，你现在拥有了一个可以在你选择的桌面或移动设备上运行的图形化应用程序。你可以在项目的 GitHub 页面找到完整的应用源代码\
    \ [7]。使用 Fyne 进行开发非常容易上手。我希望你能受到启发，进一步探索这个 GUI 工具包的潜力。\n\n访问 Fyne 网站 [8] 查看其他使用\
    \ Fyne 构建的应用程序列表，浏览 Fyne 文档和教程 [9]。作为一个 Linux 爱好者，你可能也会感兴趣尝试使用 Fyne 构建的完整桌面环境\
    \ FyshOS [10]。\n\n![](img/740bd926461af28ed755753238e647a2_46_1.png)\n\n- [1]\
    \ 入门文档：https://developer.fyne.io/started/\n- [2] 创建你自己的布局代码：https://developer.fyne.io/explore/container\n\
    - [3] 使用 Fyne 进行云存储：https://help.btfn7l55XmN8\n- [4] 跨平台编译：https://developer.fyne.io/started/cross-compiling\n\
    - [5] fyne-cross：https://github.com/fyne-io/fyne-cross\n- [6] Geoffrey：https://fynelabs.com/geoffrey\n\
    - [7] To-do 应用源代码：https://github.com/andydotxyz/linuxmagazine-todoapp\n- [8] 其他\
    \ Fyne 应用：https://apps.fyne.io\n- [9] Fyne 教程和文档：https://developer.fyne.io\n-\
    \ [10] FyshOS：https://fyshos.com/desktop/\n\nAndrew Williams 是一位居住在苏格兰的软件工程师和企业家，他在许多开源技术方面拥有丰富经验，曾是\
    \ Enlightenment、EFL、Maven 和 Fyne 等大型项目的核心开发者。他是 Fyne 工具包的创始人，也是 Fyne Labs 的首席执行官，致力于拓展平台无关应用程序开发的可能性。他还是\
    \ *《使用 Fyne 构建跨平台 GUI 应用程序》* 和 *《Go 中的 GUI 应用程序开发实战》* 的作者。\n\n![](img/740bd926461af28ed755753238e647a2_46_2.png)\n\
    \n# 指尖上的网络知识，尽在 NetBox\n\n## 真相揭示者\n\nNetBox 是关于你网络的单一信息来源，你可以在这里存储那些曾经容易丢失的重要详细信息。\n\
    \n作者：Adam Drix\n\n随着网络规模的扩大和复杂度的增加，记录你管理的所有设备及其关系变得越来越困难。在最糟糕的情况下，网络知识可能只记录在一堆电子表格或手绘草图上——甚至可能只存储在少数几万名过度劳累的\
    \ IT 员工脑海中。许多免费和专有解决方案提供了一种可视化和记录网络的方式，通常还结合了额外的管理功能。这些工具中的许多都非常有用，但有些可能缺少你需要的关键功能，或者处于光谱的另一端，可能会遭受功能臃肿之苦。其他工具会将你锁定在特定的管理或监控环境中。考虑到这一切，使用一个具有坚实基础并附加组件的软件包将会更好，这允许你构建出记录特定网络的最佳环境。\n\
    \n如果你正在寻找一种能够拥抱复杂性同时“保持简单”的多功能解决方案，你可能会对 NetBox [1] 感兴趣。NetBox 自称是“首选的网络事实来源”。它通过结合传统的的数据中心基础设施管理（DCIM）和\
    \ IP 地址管理（IPAM）与扩展和 API 来让你对网络进行建模和记录。如果你想在下决心并投入组织资源之前先尝试一下，可以查看一个始终运行的 NetBox\
    \ 演示 [2]。\n\n## 信息枢纽\n\nNetBox 作为关于你网络信息的枢纽（图 1）。在我的组织中，NetBox 已成为不仅仅是一种管理 IP\
    \ 地址的方式。得益于 NetBox 的灵活性，你可以添加笔记（使用 Markdown），添加产品图像（以及产品位置的图像）等等。如果你需要记录机架中哪个设备是哪个，该机架位于何处，以及它看起来是什么样子，只需拍摄该特定设备的照片，并立即通过手机上传。瞧，所有拥有\
    \ NetBox 访问权限的人都可以看到确切位置的精确机器。如果你的所有设备都是同一型号，在同一时间购买，安装在同一位置，并且整齐地排列在绵延数英里的机架行中，这可能不是什么大事。对我来说，处理机架、办公室、教室、图书馆、锅炉房、走廊等，以及多年未记录的变化，这种能力非常有用。当我到达一个房间或办公室时，如果不清楚需要处理哪台机器，只需快速查看\
    \ NetBox，无需启动任何设备、寻找资产标签或查看设备插入交换机上的哪个端口，即可告诉我。无需搜索产品信息，因为它就在那里，还有指向驱动程序的链接。\n\
    \n说到机架，NetBox 允许你无论设备类型如何都将设备放入机架，并在 Web GUI 中构建机架视图。NetBox 使用你提供的设备类型正面和背面的图像来填充机架的正面和背面高程视图，我发现这非常方便。寻找特定设备并不总是像寻找比如从底部数第五个\
    \ 4U 机箱那么简单。相反，我可能在寻找位于两个 NAS、三个交换机和一个侧放架子上的工作站之间的某台域控制器，且没有任何剩余的资产标签或贴纸。这些高程视图，以及这些机架的创建方式，是一个非常强大的功能，即使不考虑该软件能做的其他所有内容也是如此。\n\
    \n在我看来，NetBox 最贴心的功能在于它包含你选择包含的任何信息，全部集中在一处且极易查找。例如，搜索“245”会给我所有名称中包含“245”的房间、其标识符或注释中包含这些数字的每个设备，以及具有该型号号的任何内容。我对这类软件的信条是我应该能够在三步内找到我正在寻找的东西。例如，我可以输入“245”并找到该房间，点击它以查看该房间中的设备，再点击它不仅可以获得\
    \ IP 地址，还可以获得指向用户手册、安装指南、该设备的通用和特定图像、哪个设备的哪个端口连接到哪个交换机的对应端口、所需功率等的链接。\n\n鉴于此，NetBox\
    \ 绝对是一个“你投入什么就得到什么”的例子。然而，我可以告诉你，执行良好的 NetBox 安装可以迅速成为员工在收到工单或需要了解特定机器或设备类型时的一站式商店。丰富的\
    \ API 集意味着 NetBox 可以扩展以作为自动化配置和管理工具的信息源。\n\nNetBox 甚至可以作为你库存管理的备份。因为可以通过导入 CSV\
    \ 文件轻松添加新设备，大型项目也容易纳入 NetBox。个人而言，我会等到新物品被列入库存管理软件，然后拉取新添项目的报告，按 NetBox 所需格式调整，上传，然后添加\
    \ IP（图 2）。从头到尾，添加基本上无限数量的单一设备类型（如果你知道它们的 IP 和安装位置），整个过程可能只需 15 分钟。\n\n我还发现了使用\
    \ NetBox 的一些未预期甚至未想象的优点。我的团队最近需要回答大约半百万个关于我们的网络安全演习问题。NetBox 让我们指尖上几乎能回答所有这些问题——无需猜测，无需估算。高中图书馆有多少台台式机？三步即可知道。我们的域控制器在哪里？三步。我们有多少个端点不再受制造商保修支持？点，点，点。NetBox\
    \ 拥有\n\n![](img/740bd926461af28ed755753238e647a2_48_0.png)\n\n图 1：NetBox 概览落地页在一个地方提供关于你网络的信息。\n\
    \n![](img/740bd926461af28ed755753238e647a2_48_1.png)\n\n图 2：在 NetBox 中管理虚拟机。\n\
    \n"
