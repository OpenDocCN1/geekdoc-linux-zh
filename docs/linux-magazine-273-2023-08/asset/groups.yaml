    # Algorithm-driven team building

    Team

    Spirit


    Instead of the coach determining the team lineup, an algorithm selects the players
    based on their strengths for Mike Schilli''s amateur soccer team. **By Mike Schilli**


    ![](img/740bd926461af28ed755753238e647a2_57_0.png)


    ![](img/740bd926461af28ed755753238e647a2_57_1.png)


    ![](img/740bd926461af28ed755753238e647a2_57_2.png)


    A t the weekly pickup soccer game in my adopted hometown of San Francisco, with
    16 players signed up for an eight-on-eight match, there is always the question
    of who is going to compete against whom on match day. Preparing the team sheet
    is usually something taken care of by experienced players, but it is time-consuming
    and it leads to endless discussions about whether the eight players on one side
    are simply too skilled for the other eight players, leading to a lopsided game
    that is no fun to play. To resolve this, I''ve developed an algorithm to generate
    the team lineup. This allows me to take an interesting excursion into the world
    of combinatorics and explore the development of suitable algorithms in this month''s
    column.


    How many ways are there to assign 16 players to two teams of eight players each?
    If one team is fixed, the opponent''s team is automatically derived from the remaining
    participants; this means that the result is written in combinatorics style as
    “8 over 16,” which you compute as

    (16*15*…\*10*9)/(8*7*...\*2*1)

    with a result of 12,870. Any home computer can churn through that many combinations
    effortlessly. Even if your task was to assign 22 players to two teams of 11 each,
    it''s in the same league with 705,432 possibilities.


    courses, “You can''t manage what you can''t measure.” However, before you can
    determine the quality of a team, an expert has to grade the strength of the individual
    players on a few criteria, and then an algorithm can assign the teammates to teams
    and compare their cumulative strengths.


    # Brute Force


    In small event spaces like this, it is definitely an option to simply try out
    all the combinations, call an evaluation function on each pass, store the best
    scores, and output the top result at the end.


    Using this brute force method for a larger event space would simply not work,
    because combinations can easily spiral out of control exponentially. It would
    make more sense to first choose a non-perfect but reasonable solution as a starting
    point and then change it incrementally to see if the results improve or get worse.
    Simulated annealing is the technical term for this process [1].


    Before moving on to find better solutions, you first need a metrics function to
    grade the quality of each team. This metric can then be used to compare different
    constellations and select the best one. Like the mantra of all management


