    \ 目录中的 configuration.py 文件中列出。\n\n在 local_requirements.txt 中，只需将每个所需的插件（图 5）每行一个输入如下：\n\
    \n- djangostorages\n- netbox-topology-views\n- netbox-inventory\n- netbox-rqcode\n\
