    ### 工作就绪


    我必须承认，启动一个系统并看着它在 Linux 中启动起来，而不必重新格式化驱动器或绕过 UEFI 启动安全启动保护，确实带来某种乐趣。启动 TUXEDO
    系统带来的乐趣更是加倍，因为它启动*速度快*——比 Windows 系统更快，也比大多数 Linux 替代品更快。一些评论者报告 TUXEDO 系统启动时间短至六秒。在我的情况下，到登录屏幕需要大约
    16 秒，输入凭据后则快速完成登录。


    一个旨在在任何硬件上启动的中性 Linux 必须携带组件、功能、驱动程序和设置，如果你完全了解硬件，这些其实并不需要。因此，像 InfinityBook 这样的预装系统，同时提供硬件和
    Linux，通常具有更好的性能更高效的功耗。TUXEDO 的工程师优先考虑快速启动，他们对硬件的深入了解使他们能够以通用系统无法实现的方式优化启动过程。


