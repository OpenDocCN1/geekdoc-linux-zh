    \ skills 键下定义玩家的能力，包括技能名称和从 8 到 9 的数值评级。\n\n基于此，图 2 中 Go 代码的第 19 行定义了带有 Players\
    \ 字段的 Config 结构，其值是一个包含 Player 类型元素的数组切片。该类型在第 14 行定义，进而包含玩家姓名的 Name 字段和同类型的 Skills\
    \ 字段。skills 类型从第 8 行开始定义，并在 Goalie、Defense 和 Offense 字段中指定了玩家实力，值为 int 类型。\n\n\
    由于 Go 可以原生处理 YAML 数据，字段名称和类型后面的代码可以提供有用的提示（例如，如果 YAML 中使用的字段名称与类型中使用的不同）。在我们的情况下，Go\
    \ 数据结构中的字段名称是大写的（YAML 库要求如此），但配置文件中的 YAML 字段是小写的。例如，第 9 行 `Goalie int 'yaml:goalie'`\
    \ 定义了 `Goalie` 字段为 int 类型，而其在 YAML 数据中的对应物名为 `goalie`。\n\n这就是 YAML 评估器 `yaml.Unmarshal()`\
    \ 在第 31 行所需的全部内容。它一次性遍历配置 YAML 数组的所有元素，用它们填充程序的内部 Go 结构，并负责分配所需的内存资源——这是现代计算机科学的奇迹。例如，如果代码希望稍后访问从上往下第三个玩家的进攻技能，它可以访问相关的整数值为\
    \ `config.Players[2].Offense`。\n\n## 无计划\n\n图 3 定义了 main() 程序，它首先调用 yamlParse()\
    \ 从图 2 读取 YAML 数据。然后，第 13 行调用稍后定义在下方（直到行号结束）的 mkTeams() 函数，以排列两个团队。其返回值是一个包含两个元素的\
    \ teams 数组切片，这两个元素代表（正如你所猜到的）团队。这些元素进而各自由 Player 类型球员组成的数组切片组成。从第 19 行开始的 for\
    \ 循环迭代两个团队；从第 21 行开始的内部 for 循环则迭代各个球员。Printf() 打印出团队中每个球员的名字以及根据三个预定义标准的球员评级摘要。\n\
    \n现在，作为热身，图 4 展示了一个随机化团队的简单算法。图 4 中 mkTeams() 的实现首先使用标准 math/rand 包中的种子（当前时间）初始化随机生成器。这是为了确保对虚拟教练的调用每次返回不同的团队。然后，Rand.Shuffle()\
    \ 函数打乱从第 11 行开始包含 16 名球员的数组切片中的元素。从第 19 行开始的 return 语句返回切片的两个半部分给调用者。这就完成了团队阵容。\n\
    \n在实际构建命令生成 Go 二进制文件之前，编译器首先需要从 GitHub 检索图 2 中使用的 YAML 包并对其进行编译（图 5，前两行）。然后，图\
    \ 5 最后一行的调用将一切结合起来形成随机二进制文件，其在命令行上的调用及生成的输出如图 1 所示。\n\n### 图 4：random.go\n\n```go\n\
    package main\n\nimport (\n    \"math/rand\"\n    \"time\"\n)\n\nfunc mkTeams(players\
    \ []Player) [][]Player {\n    rand.Seed(time.Now().UnixNano())\n\n    rand.Shuffle(len(players),\
    \ func(i, j int) {\n        players[i], players[j] = players[j], players[i]\n\
    \    })\n\n    if len(players) < 2 || len(players)%2 != 0 {\n        panic(\"\
    Needs even number of players\")\n    }\n\n    return [][]Player{\n        players[0\
    \ : len(players)/2],\n        players[len(players)/2:]\n    }\n}\n```\n\n### 图\
    \ 5：编译\n\n```\n$ go mod init teams\n$ go mod tidy\n$ go build randcom.go teams.go\
    \ data.go\n```\n\n## 系统化方法\n\n不幸的是，这个算法有点力不从心。如图 5 所示，随机数生成器将仅有的两名具备守门员技能的球员分配到同一支球队，尽管每支球队至少需要一名守门员。进攻和防守能力也不平衡。因此，算法设计的下一阶段需要根据球员的个人实力将他们分配到两个均等的团队。\n\
    \n正如我前面提到的，由于事件空间较小，遍历所有选项并确定和比较个别解决方案的适用性很容易。为此，图 6 提供了一个适用性函数 diff()，用于评估两个团队\
    \ teamA 和 teamB 中分配的公平性。如果整数结果接近零，则比赛平衡；其值越大，比赛越可能不公平。\n\n为了确定得分，该函数添加了两支球队在进攻、防守和守门员能力方面的绝对差异。它给进攻技能赋予\
    \ 2 的权重，给守门员赋予 10 的权重；毕竟，如果你没有守门员，你已经输掉比赛了。\n\n### 图 6：diff.go\n\n```go\npackage\
    \ main\n\nfunc diff(teamA []Player, teamB []Player) int {\n\td := Skills{}\n\n\
    \tfor idx, player := range teamA {\n\t\ts1 := player.Skills\n\t\ts2 := teamB[idx].Skills\n\
    \n\t\td.Offense += s1.Offense - s2.Offense\n\t\td.Defense += s1.Defense - s2.Defense\n\
    \t\td.Goalie += s1.Goalie - s2.Goalie\n\t}\n\n\treturn 2 * abs(d.Offense) +\n\t\
    \tabs(d.Defense) +\n\t\t10 * abs(d.Goalie)\n}\n\nfunc abs(x int) int {\n\tif x\
    \ < 0 {\n\t\treturn -x\n\t}\n\treturn x\n}\n```\n\n## 古怪的 Go\n\n你可能认为编程语言会天生提供一种确定整数绝对值的函数，但\
