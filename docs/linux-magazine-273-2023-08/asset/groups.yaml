    # COVER STORY


    # Audacity


    ![](img/740bd926461af28ed755753238e647a2_20_0.png)


    Quality sound begins with quality equipment, and I cover recording hardware choices
    in the next section.


    Operating Audacity is simple. Because most laptop computers have an internal microphone,
    you can start recording when Audacity opens on your system. Press the Record button
    and start talking. You’ll see the sound waves appear on the screen as you speak
    (Figure 1). Voilà! You’re a podcaster! Well, not quite, but you’re on your way.


    As a podcaster, you’ll likely want or need to use some type of effect, such as
    Truncate Silence, Amplify, or Noise Reduction. To apply an effect on an entire
    file, press Ctrl + A to highlight the entire file, click Effect from the menubar
    (Figure 2), and then select your effect. Most effects have their own settings
    that you can adjust to suit your needs. Before you apply an effect, click the
    Preview button to listen to a sample of the applied effect using your custom settings.
    Adjust and preview until you are satisfied with your selections, and then click
    OK to apply the effect. You can apply effects to a portion of your audio file,
    too. To do so, highlight the area you want to adjust, and then repeat the above
    steps to apply an effect. Remember the universal undo key sequence, Ctrl + Z,
    if you want to reverse a change.


    A word of caution if you use Noise Reduction to remove hiss or static in a file.
    Audacity does a good job of removing these anomalies, but there is a cost. An
    audio might sound “tinny” or unnatural if you must significantly reduce noise.
    It’s better to record your audio again rather than annoy your listeners with a
    robotic voice – unless that’s what you’re going for.


    ![](img/740bd926461af28ed755753238e647a2_20_1.png)


    # Recording Hardware


    Although I have used a standalone microphone and speakers, a headset with microphone
    and laptop microphones, and a headset or earbuds with no microphone, I prefer
    a headset with a built-in microphone for recording my podcasts. I currently use
    a C320-M headset by Plantronics (see Figure 3), which is now part of the electronics
    vendor Poly. It is a well-built, low-noise headset that allows me to hear myself
    speak. Noise-canceling headphones often distance me from the conversation because
    I can’t fully hear myself speaking, so I don’t know how to modulate my voice for
    the recording.


    To see a list of your attached devices, select Edit | Preferences from the main
    menu options.


    > *Pro Tip: Remember your branding. Mention the name of your podcast multiple
    times during your podcast.*


    I also have a Focusrite Scarlett 2i2 audio interface [3] (shown as an available
    device in Figure 4) that handles two input sources. Audacity sees this device
    as a single source. If you have multiple speakers, each needing a microphone,
    you’ll need an interface device to connect multiple inputs. Using this device,
    I can attach two microphones and record them simultaneously. An interface device
    is a versatile choice because you use XLR inputs or 1/4-inch TRS connectors, and
    various adapters exist for each.


    I like cardioid lapel microphones or headsets with built-in microphones for multi-speaker
    podcasts. The speaker can relax more and speak normally rather than trying to
    stay an inch from a stationary or handheld microphone. The lapel microphones picks
    up the speaker’s voice without them having to


    ![](img/740bd926461af28ed755753238e647a2_20_2.png)'
  - '[PAGE 21]


    focus on the distance and positioning, which gives the podcast a more natural
    and conversational tone. Additionally, without so much focus on microphone mechanics,
    you’ll likely have fewer pauses and fillers to remove from the recording.


    Audacity is compatible with almost every piece of recording equipment compatible
    with your computer. Generally, if your computer recognizes it, so will Audacity.
    Remember to make careful and thoughtful hardware choices by reading reviews and
    asking questions about how well the components work with Audacity.


    # Dealing with Audacity’s Quirks


    Audacity is a superb audio program with some interesting odd-ball features. The
    most notable quirk is that you must attach record and playback hardware before
    you start Audacity. Audacity won’t recognize any hardware plugged in while it’s
    active. Your system will recognize and make the new hardware available to you,
    but if Audacity is open when you plug in the device, you won’t see it in the device
    list. Attach microphones, headsets, or other audio devices and then open Audacity.
    The new hardware will appear in the device list. Once attached, you can switch
    between audio devices without closing and reopening the application. For example,
    if you attach an external microphone and then start Audacity, you can use the
    external microphone for a recording, switch to the onboard microphone, and continue
    recording without closing and reopening. Be careful when selecting Playback and
    Recording devices from your lists. You won’t damage anything by selecting a microphone
    as a playback device but selecting the correct playback device will prevent hours
    of frustration and troubleshooting.


    Another significant quirk is that you can’t record over a particular spot in a
    record – or at least I have never figured out how to do it. For example, suppose
    you record a conversation and want to record over a mistake. In that case, you
    might attempt to place your cursor to the left of the piece you want to record
    over, hit record, and expect your new recording to be inserted where you’ve placed
    the cursor. You’ll find that your recording begins at the end of your current
    recording. You must copy, cut, and paste your new clip into the recording to replace
    the bad audio. However, you can highlight your new clip, copy it (Ctrl + C), highlight
    where you want to place the bad clip, and press Ctrl + V. Your new clip will paste
    into your original clip replacing your bad audio.


    If you press the Record button again and begin talking, Audacity adds your new
    recording at the end of your previous clip. My cursor is near the 2.0 second mark
    but the new clip was added to the end of the first one (Figure 5).


    > Pro Tip: Sponsorships are great, but long spots make an audience lose interest.
    Two or three 10-second spots are better than a single 30-second one.


    The final quirk I’ll mention is that when listening to an audio file, you might
    need to stop and come back later and pick up where you left off. If you expect
    to resume listening, do not press the Stop button. Press the Pause button instead.
    If you press the Stop button, Audacity returns you to your cursor, which could
    be several minutes or hours from where you started. If you press Pause to stop
    listening temporarily, press Pause again to resume listening. I have listened
    to my podcast recordings, some stretching to over an hour, only to press stop
    and then forget where I stopped. It is an annoyance that only needs to happen
    a few times to train you to press Pause instead.


    # Advanced Features


    Audacity has some interesting advanced features. You can find a few of these under
    the Generate menu (Figure 6), including Chirp, DTMF Tones, Noise, Silence, and
    Click Track.


    The one I use most is Silence. I often add a few seconds of silence at the beginning
    of an audio file I know I’m handing off to another person for production to allow
    for intro music, sponsored ads, or voice-over mixing. To add silence to a track,
    click the mouse to set the cursor. Then, select Generate | Silence and provide
    a duration (Figure 7). An interval of silence will appear in the track (Figure
    8).


    # Saving Projects and Exporting Audio


    After you edit your audio file, you’ll want to save it. You have some options
    for doing that. If you need to save your project and come back to it later, preserving
    your edits and history, select File | Save Project | Yes. This option will save
    your


    ![](img/740bd926461af28ed755753238e647a2_21_0.png)


    Figure 4: Viewing the list of available devices.


    ![](img/740bd926461af28ed755753238e647a2_21_1.png)


    Figure 5: Attempting to record over part of a clip.'
