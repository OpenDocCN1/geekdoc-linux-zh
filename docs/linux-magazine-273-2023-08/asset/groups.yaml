    Many different video formats can carry live video down a wire. You''re probably
    familiar with HDMI because it has been widely adopted since its introduction.
    The video system discussed here primarily uses a serial digital interface (SDI),
    which is a digital standard for broadcast video. Hardware converters between these
    formats also exist, so changing between them is as easy as connecting a cable
    of each type. The cost for this conversion is a slight delay in the video signal
    that is normally not noticeable; however, if you have stacked several conversions,
    the delays can start to add up and become visible. This scenario generally presents
    itself as audio out of sync with its associated video.


