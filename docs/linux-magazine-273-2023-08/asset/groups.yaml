    \ 和 `self.osCommands` 则是当按钮被按下时执行的操作。\n\n`addOSCommand` 函数接收其关联的字符串参数，并在按钮被按下时将其传递给操作系统：\n\
    \n```python\ndef addOSCommand( self , cmd ):\n    self.osCommands.append( cmd\
    \ )\n```\n\n`addMatrixCommand` 函数的作用相同，只是它将指令传输给矩阵（video matrix）。\n\n`render`\
    \ 函数负责在屏幕上绘制按钮。正如你之前所见，它创建一个表面（surface）并进行填充——在本例中为绿色。如果其标签不为空，程序将渲染文本，计算如何居中该文本，并将文本添加到按钮的\
    \ `blit` 操作中。随后，该表面被绘制到屏幕上，并保存其 Pygame `rect` 对象的引用。\n\n### 矩阵类\n\n矩阵类负责在触摸屏上绘制和管理界面。与往常一样，`_init_`\
    \ 函数初始化界面的不同组件，但此示例包含许多组件。图形系统启动并创建一个用于绘制的窗口。尽管窗口有标题，但由于窗口处于全屏模式，标题通常不可见。\n\n\
    与往常一样，字体和串口通信被初始化，尽管 `pygame.font.SysFont` 的第一个参数是一个空字符串，因此这是要求 Pygame 使用默认字体：\n\
    \n```python\nbuttonFont = pygame.font.SysFont( \"\", 32)\nself.matrixPort = matrixSerial()\n\
    ```\n\n下一行将 `self.buttons` 创建为一个列表，这是存储添加到界面中的每个按钮的地方。init 函数的其余大部分内容为每个按钮创建并定义其功能。它们都遵循以下通用格式：\n\
    \n![](img/740bd926461af28ed755753238e647a2_71_0.png)\n\n```python\nbtn = button(\
