  - '[PAGE 76]


    # **MADDOG''S DOGHOUSE**


    Earlier technologies have persisted despite government regulations – so will AI.  BY
    JON “MADDOG” HALL


    ![](img/740bd926461af28ed755753238e647a2_76_0.png)


    Jon “maddog” Hall is an author, educator, computer scientist, and free software
    pioneer who has been a passionate advocate for Linux since 1994 when he first
    met Linus Torvalds and facilitated the port of Linux to a 64-bit system. He serves
    as president of Linux International®.


    # ### Not Intelligent


    I have been writing articles for Linux magazines for over two decades. Some articles
    were very technical, some were business-oriented, and some had to do with the
    philosophy of free and open source versus closed source in producing systems.


    However, recent movements by various governments to “limit AI” have caused me
    to write an opinion article this month describing why this limiting will not work.


    I look back in time to other “limiting” exercises, such as embargoes. Do you really
    think that countries that are under embargo cannot get the hardware and software
    they need to do whatever they want to do with AI, either by smuggling it out of
    some country or relying on one of their “partners” to break the embargo?


    I remember the limitations on encryption back in the day. The United States has
    such arcane rules about shipping encryption out of the country that even if you
    bought a box of encryption software from Canada, never unwrapped it, and tried
    to send it back, it was cause for the Feds to come after you. We tried to tell
    the government that all of the best crypto- gist were leaving the USA for places
    where they could sell their skills, but no use – the government would not listen.


    Now it is artificial intelligence (AI). The mighty and the wealthy are coming
    together to tell the software community that the government should license and
    control the use of AI as if no one had even one movie about AI. As if you need
    a computer the size of a room in order to do AI. As if these titans of industry
    could somehow put locks on every mind who has ever thought about AI.


    First there is the issue that most people cannot even define “AI.” They think
    computers will never become intelligent enough to do *their* job. That is their
    first mistake. If you are talking real AI, then the computer (or robot) will not
    only be able to do your job, it will do the job faster and better than you to,
    with no time off to sleep or eat – 24 hours a day, 365 days a year. And the computer/robot
    will not only be able to do your job, but it will build computer/robots like it
    or better than itself to do your job in parallel.


    I have seen AI go from a concept in science fiction to where it is today. For
    many years, we underestimated the amount of


    CPU, memory, data, and other factors needed to duplicate human thought and consciousness.
    Most people still underestimate those factors, possibly by several orders of magnitude,
    yet through a combination of massive data farms, huge amounts of processing power,
    and methods of programming, we can automate a lot of the filtering that can bring
    us closer to what appears to be intelligence.


    I am one of those people who think the human mind is a sophisticated electro-chemical
    machine. Neurons (about 86 billion, +/- 8 billion) supply “storage” and are connected
    by synaptic connections (7,000 synaptic connections per neu- ron to other neurons)
    – sparks of energy that fire off the 5 to 50 “messages” that each neuron sends
    per second to other neurons in ways that we still are exploring. In an adult,
    these synaptic connections measure in the trillions.


    There is a certain amount of “programming” built into us through eons of evolution,
    but a baby is still in some ways a blank slate and is influenced and taught how
    to think – to grow those synaptic connections.


    Yes, we are amazed at what ChatGPT can do, but remember that many of these examples
    have been shown to be far from “intelligent.” They come from datasets which may
    not be com- plete, and which have been shown to be inaccurate in ChatGPT’s answers.
    These examples often need context which is outside the dataset being used by ChatGPT,
    even as huge as it is.


    All of that having been said, someday AI will be “intelligent,” and no laws will
    stop its explication or misuse.


    The governments and companies that try to limit its develop- ment will only force
    other governments and companies who want to “get ahead on AI” to go underground.
    We will have an AI race just as we had a space race and a nuclear arms race years
    ago. Except you do not need to shoot off rockets or ship ura- nium to develop
    AI.


    We are no longer in the realm of computer science where you need billions of dollars
    and government support to build a sys- tem. Almost any individual could fund the
    development of an AI system, just as they wrote their own encryption code years
    ago. Each developer will justify their development outside of the law. The only
    way to win the war of AI is to engage in it openly. Then you may be ready when
    AI comes to your doorstep. 000'
  - "[PAGE 77]\n\n# # Detect duplicates with fdupes\n# Double Trouble\n\nThe command-line\
    \ fdupes tool helps you find duplicate folders and directories.\n\nBY FERDINAND\
    \ THOMMES\n\nHard disks have the unpleasant tendency of filling up faster than\
    \ expected. It is not always immediately obvious why. Keeping things tidy should\
    \ not be underestimated in this context. Untidy, poorly organized hard disks tend\
    \ to fill up faster than well-organized ones. Because life is a mixture of order\
    \ and chaos, most users probably face this problem.\n\nThe unexpectedly high utilization\
    \ level of hard disks is often caused by duplicate files. The typical candidates\
    \ are photos, music, or videos, which can quickly occupy several gigabytes of\
    \ space and are often difficult to find. There are several graphical applications\
    \ on Linux to help you detect and remove duplicates like this, and there are several\
    \ more for the command line.\n\n# ## GUI or CLI?\n\nWell-known tools with a graphical\
    \ interface for a cleanup include FSlint and dupeGuru. In this article, I will\
    \ look at fdupes for the command line [1], first released in 2000. Most distributions\
    \ include the tool, which weighs in at just over 100KB, in the archives; you can\
    \ install using your distribution's choice of package manager. Listing 1 shows\
    \ a guide for Debian, Fedora, and Arch Linux.\n\nThe current 2.2.1 version from\
    \ September 2022 has not made its way into all repositories [2]. If you want to\
    \ compile fdupes from the source code, you can use the tarball from GitHub. After\
    \ unpacking, just follow the familiar three-step process of ././*configure*, *make*,\
    \ and *make install*. As of fdupes 2.0, there are two dependencies that you may\
    \ also need to resolve yourself, depending on the distribution. To do this, follow\
    \ the instructions in the INSTALL file from the unpacked archive.\n\nAfter the\
    \ install, you can use the tool immediately without any configuration. It identifies\
    \ duplicate files in the specified directories in several steps. The file name\
    \ is not important for detection as a duplicate. Instead, two files must first\
    \ be the same size; given this, fdupes compares their MD5 checksums.\n\nFinally,\
    \ the software performs a byte-by-byte comparison, to make sure that it is definitely\
    \ the same file.\n\nFdupes has numerous options that let you control the search\
    \ and the subsequent duplication. Initially, you will want to familiarize yourself\
    \ with the tool by running the fdupes --help command. This will help you identify\
    \ the options that suit your use case.\n\n# ## Test Run\n\nFor the test, I created\
    \ an *fdupes* directory in the *Documents* directory and then created 10 text\
    \ files whose content read *fdupes finds and removes duplicates*. Listing 2 shows\
    \ how to do this quickly.\n\nA following *ls -l* confirms that the files were\
    \ created. The easiest way to search for duplicates in the new directory is to\
    \ use the *fdupes ~/Documents/fdupes* command (Figure 1). By separating the paths\
    \ with spaces, you can specify multiple directories at the same time. To search\
    \ recursively in directories, you need to use the -r option, as in *fdupes -r\
    \ ~/Documents* (Figure 2). In this case, the tool finds my 10 text files along\
    \ with some other duplicates. Use the *-r* option to specify the path of subdirectories\
    \ you want to include.\n\nThe *-5* (-size) options shows you the size of the hits.\
    \ You can use *-t* or *--time* to find out when a file was last modified. *-G*\
    \ or *--minsize=SIZE* and *-L* or *--maxsize=SIZE* lets you further narrow down\
    \ the selection.\n\n# ## Be Careful When Removing\n\nBut finding is only the first\
    \ part of the task; after all, we want to delete duplicates to clean up the hard\
    \ disk. This is where the (-delete) option comes in. When using -d, always make\
    \ sure that your file specification is correct – files deleted with fdupes cannot\
    \ be recovered. The command\n\n```\nfdupes -d ~/documents/fdupes\n```\n\n```\n\
    #### Listing 1: Installing fdupes\n```python\n#### Debian and derivatives:\n$\
    \ sudo apt install fdupes\n\n#### Fedora:\n$ sudo dnf install fdupes\n\n#### Arch\
    \ Linux and derivatives\n$ sudo pacman -S fdupes\n```\n```\n\n```\n#### Listing\
    \ 2: Create Multiple Text Files at the Same Time\n```python\nmkdir /home/$USER/Documents/fdupes\\\
    \n& & cd /home/$USER/Documents/fdupes\\\n& & for i in {1..10}; do echo\\\n   \
    \  \"fdupes finds and removes duplicates.\"\\\n     > fdupes$i.txt ; done\n```\n\
    ```"
