    ## GUI Apps with Fyne


    ![](img/740bd926461af28ed755753238e647a2_41_0.png)


    ### Designing cross-platform GUI apps with Fyne


    ### Platform Agnostic


    The Fyne toolkit offers a simple way to build native apps that work across multiple
    platforms.

    We show you how to build a to-do list app to demonstrate Fyne''s power. *By Andrew
    Williams*


    One of the biggest challenges in modern app development is the requirement to
    develop a separate codebase for each platform that you want to support. Fortunately,
    the Fyne graphical user interface (GUI) toolkit lets you program your app once
    and then deploy it rapidly to multiple devices.

    Fyne is an open source GUI toolkit built for the Go programming language, a popular
    general-purpose compiled programming language created by Google a little over
    10 years ago. Go is frequently used for cloud services and infrastructure projects.
    However, the Fyne toolkit makes it possible to quickly build native GUIs for desktop
    and mobile devices.

    One of a number of GUI toolkits for Go, Fyne aims to be the simplest to use, appealing
    to both beginners and experienced GUI developers.

    Fyne''s idiomatic design makes it easy for Go developers to rapidly learn its
    principles. Fyne allows developers to create their own custom widgets thanks to
    its rich widget set and extensibility.

    With graphical elements inspired by Material Design, Fyne will feel familiar to
    many end users, while remaining open to theming by app developers.

    Fyne is fully unit tested and supports rigorous test-driven development. Released
    under the same permissive BSD licence as Go, Fyne is supported by an active development
    community.

    In this article, I will show you how to set up your system to program your first
    app with Go and Fyne. I will cover the basic APIs for showing windows, laying
    out content, and using the standard widgets, along with storing data and working
    with event handlers. By the end of this article, you will have a complete graphical
    application running on your computer and smartphone device.


    ### Setup


    To get started with Fyne, you need to install a few developer tools including
    Git, Go, and a C compiler. Assuming you are working on a Linux desktop with an
    X11 setup, you also need to install some libraries. Don''t worry – this only applies
    to developing Fyne apps. Your users won''t need any of these dependencies to run
    the finished apps. Fyne (like Go) focuses on single binary compiler output with
    zero dependencies. As long as your users have a working graphics driver, your
    apps will work without any additional setup.

    You should use your computer''s package manager to install the necessary tools.
    All distributions are different, but the most common systems will need to use
    the following commands. For Debian and Ubuntu, use:


    ```

    sudo apt-get install golang gcc libglib-mesa-dev xorg-dev

    ```


    On Fedora, use:


    ```

    sudo dnf install golang gcc libCurl-dev libXrandr-dev

    ```

