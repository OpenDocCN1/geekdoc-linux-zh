    perspective:


    “The advantage of compiler warnings really is that they get caught quickly and
    developers will react to them much better. They might cause the code to be properly
    re-organized or rewritten to be much nicer, for example.”


    “The ‘trivial tree’ kind of fixes for random other issues that get noticed separately
    tend to a much more about ‘work around issue’. It might be the proper fix, of
    course, but it didn’t end up being taken into account when writing the code, so
    it often ends up being just a ‘papering over the warning’ kind of fix. Particularly
    since the person trying to fix the problem generally isn’t the main developer
    of that code.”


    In fact, at this point, the conversation began to get very technical—Nick posted
    some raw code as a sample of what he thought might satisfy Linus. And they (plus
    Theodore Ts’o) started getting into the real nitty gritty of things before the
    thread finally petered out.


    I’m fascinated by the strange relationship between the kernel project and the
    various compiler projects. It’s such a chicken-and-egg-type problem when these
    projects have disagreements over compiler features. I personally feel that the
    Linux kernel is one of the most important software projects (or the actual most
    important software project) in the world, and therefore the compiler exists almost
    as a service tool for Linux. It makes perfect sense to me that any compiler would
    want to adopt the features desired by the Linux kernel project.


    However, there is an absolutely legitimate point on the other side: The compiler
    is truly the fundamental software, and all other software projects are the beneficiaries
    that need to have some faith that the compiler people will make good decisions
    for everybody.


    The validity of both of these perspectives creates an amazing situation when kernel
    and compiler projects find themselves at odds. As an aside, same situation arises
    when hardware projects and compiler projects find themselves at odds. In such
    situations, the manner in which the debate proceeds, and in which the conflicts
    and disagreements are ultimately resolved, seem to me like they contain the secrets
    of the universe.


