    \n## 严格类型\n\n为了让 Go 程序能够理解包含球员技能的 YAML 数据，由于 Go 的严格类型检查，它首先需要定义类似的数据结构。图 2 从图\
    \ 1 读取整个 YAML 结构，该结构由 teams 键下的字典和 players 键下的球员列表组成。然后，这两种结构被定义为 struct 类型。\n\
    \n### 图 3：teams.go\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n)\n\nfunc\
    \ main() {\n    players, err := yamlParse()\n    if err != nil {\n        panic(err)\n\
    \    }\n\n    teams := mkTeams(players)\n    if err != nil {\n        panic(err)\n\
