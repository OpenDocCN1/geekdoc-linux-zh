    \ FOSS 计划，并仔细研究一些 Go 语言中的绿色编码技术。\n\n**DVD 内容：** Fedora 37 工作站版和 TUXEDO OS 2\n\n\
    ### #269/2023 年 4 月  \n**Fetiverse**\n\n![](img/740bd926461af28ed755753238e647a2_94_3.png)\n\
    \n社交媒体工具连接着世界，为我们带来来自政治家、电影明星、社区领袖和远方朋友的最新新闻和评论。但商业社交媒体平台的跟踪和数据挖掘让许多用户正在寻找更好的选择。本月，我们深入探索社交媒体用户的替代宇宙：Fetiverse。\n\
    \n**DVD 内容：** EndeavourOS Cassini 22.12 和 Debian 11.6 “bullseye”\n\n### #268/2023\
    \ 年 3 月  \n**数据投毒**\n\n![](img/740bd926461af28ed755753238e647a2_94_4.png)\n\n\
    认为计算机不会犯错误吗？如果你将一些篡改过的训练样本混入其中，你可以让一个花哨的机器学习系统认为狗是猫，或者 1 是 8 —— 并且你可以通过其他人都注意不到的隐藏信号来触发这种不良行为。\n\
    \n**DVD 内容：** MX Linux 21.3 和 Puppy Linux FossaPup 9.5\n\n### #267/2023 年 2 月\
    \  \n**备份**\n\n![](img/740bd926461af28ed755753238e647a2_94_5.png)\n\n理论上，每个人都可以使用相同的备份工具，但将定期和系统性的备份融入生活的最佳方法是找到符合你自身习惯和方法的解决方案。本月，我们预览了\
    \ Linux 领域一些流行的备份应用程序，以便你找到一个适合你的。\n\n**DVD 内容：** Linux Mint 21 Cinnamon 和 Kali\
    \ Linux 2022.4\n\n## 服务\n\n## 活动\n\n## 精选活动\n\n用户、开发人员和供应商在全球各地的 Linux 活动中相遇。我们《Linux\
    \ Magazine》很自豪能够赞助此处展示的精选活动。\n\n关于你附近的其他活动，请在线查看我们在 https://www.linux-magazine.com/events\
    \ 上的详尽活动日历。\n\n如果你知道另一个你希望我们添加到日历中的 Linux 活动，请向 info@linux-magazine.com 发送包含所有详情的消息。\n\
    \n![](img/740bd926461af28ed755753238e647a2_95_0.png)\n\n- **RustConf 2023**\n\
    \  - **日期：** 2023 年 9 月 12-15 日\n  - **地点：** 新墨西哥州阿尔伯克基及线上\n  - **网站：** https://rustconf.com/\n\
    \  - 不要错过 Rust 语言社区最大的年度聚会，时间为 9 月 12-15 日，地点在新墨西哥州阿尔伯克基。该活动包括顶级 Rust 开发者的演讲和培训、数字和现场讨论等更多内容！请在\
    \ rustconf.com 上了解更多并立即注册。\n\n- **EuroBSDCon 2023**\n  - **日期：** 2023 年 9 月 14-17\
    \ 日\n  - **地点：** 葡萄牙科英布拉\n  - **网站：** https://2023.eurobsdcon.org/\n  - EuroBSDCon\
    \ 是面向使用和开发 4.BSD（Berkeley Software Distribution）系列操作系统及相关项目的用户和开发者的国际年度技术会议。不要错过了解\
    \ BSD 世界最新消息、见证当代部署案例研究以及结识其他使用 BSD 导向技术的用户和公司的机会。\n\n- **SDC '23**\n  - **日期：**\
    \ 2023 年 9 月 18-21 日\n  - **地点：** 加利福尼亚州弗里蒙特\n  - **网站：** https://storedveloper.org/\n\
    \  - 我们很高兴地宣布，SDC'23 今年将再次成为面对面活动。参加 SDC 是一种经济有效的方式，可通过教程、会议、主旨演讲者以及参与并行的 Plugfests\
    \ 在不同领域获取培训。利用这个机会，在一个地方向专家学习。\n\n### 活动\n\n| 活动 | 日期 | 地点 | 网站 |\n|---|---|---|---|\n\
    | GUADec | 7 月 26-27 日 | 拉脱维亚里加 | https://events.gnome.org/event/101/ |\n| WeAreDevelopers\
    \ World Congress | 7 月 27-28 日 | 德国柏林 | https://www.wearedevelopers.com/world-congress/\
    \ |\n| RustConf 2023 | 9 月 12-15 日 | 新墨西哥州阿尔伯克基 | https://rustconf.com/ |\n| stackconf\
