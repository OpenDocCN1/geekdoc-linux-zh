    # 封面故事


    ## 声音工作室工作坊


    在你自己的工作室里听起来完美的声音，对其他人来说未必更好。你可以找到软件解决方案，让你能够准确地测量和分析房间中的声音输出。我在测试中使用了 Java Room
    EQ Wizard (REW) 应用，你可以免费从[4]下载它。你还会找到 REW 专有免费软件的商业 Pro 版本 [5]，它——尤其是——能够实现更精确的测量，这在构建扬声器时是必需的。话虽如此，免费版包含了你优化家庭工作室所需的一切。它生成所需的测量音调和有意义的测量信号图表。


    首次启动时，REW 会提议校准连接的麦克风（图 11）。然后它测量扬声器在房间内扩散的声波，并以图形方式显示结果是否偏离以及偏离预期的理想结果的程度。你可以通过移除扬声器附近的障碍物并衰减房间内的反射来减少这些偏差。反射不仅会产生混响效果，使声音图像变得模糊，还会抵消或增强某些频率，从而完全扭曲声音。


    如果你想让一切完美无缺，优化房间声学是一门昂贵的学科。幸运的是，即使使用简单的方法，你也可以非常接近完美。柔软的地毯和厚重的窗帘往往已经能产生奇迹般的功效，你可以使用墙面挂饰轻松防止声音在房间的角落被抵消。作为最后的手段，你可以在
    JACK 的主输出上游使用均衡器。这种设置很棘手，并且会产生更大的系统负载。


    ## 结论


    一旦你超越了最简单的播客场景，你会发现如今 USB 混音器在 Linux 上运行得非常好。由于有 JACK 和 Carla，提供复杂信号路由的设备也很容易连接。最后，Ardour
    以高端音乐制作和表演的典型方式实现了所有这些选项。


