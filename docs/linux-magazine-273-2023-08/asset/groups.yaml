    \ 文件，你还需要通过再次修改 configuration.py 文件来启用它们。你可以使用以下命令打开 configuration.py：\n\n```bash\n\
    $ cd /opt/netbox/netbox/netbox/\n$ sudo nano configuration.py\n```\n\n查找 PLUGINS\
    \ 参数，根据插件的不同，你可能还需要更改 PLUGINS_CONFIG。根据我添加到 local_requirements.txt 文件中的插件，我的 PLUGINS\
