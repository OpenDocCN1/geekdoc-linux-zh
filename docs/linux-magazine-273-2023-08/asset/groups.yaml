    # 现场录音！


    Audacity 是一款免费、开源且易于使用的多轨道音频录制和编辑工具，非常适合制作播客。


    *作者 Ken Hess*


    ![](img/740bd926461af28ed755753238e647a2_19_0.png)


    Audacity [1] 是任何录制或编辑音频文件的人不可或缺的“必备”工具之一。它是跨平台的（macOS、Windows、Linux），这使得文件共享和协作变得更加容易。Audacity
    音频编辑器和录音机拥有易于使用的界面，并支持广泛的硬件。Audacity 支持单声道或立体声的直接麦克风录音或混音器录音，并包含一些便捷的键盘快捷键以提高编辑效率。您可以直接录制到
    Audacity，也可以打开大多数音频文件和部分视频文件类型进行编辑。在本文中，我将介绍如何使用单一声源（麦克风）直接录制到 Audacity，以及一些基本的编辑。您只需使用少量的特效和功能即可进行简单的播客制作。我在本文中描述的特效是我使用频率最高的。我确实进行过一些高级编辑，但那些少数几次是例外情况。


    *专业提示：通过删除静音、添加片头和片尾片段以及添加背景音乐，使您的播客更吸引听众。*


    关于播客被问得最多的问题之一是：“开始制作播客需要花费多少钱？”答案听起来可能带有讽刺意味，但范围从 0 美元到数千美元不等。如果您有一台运行 Linux
    的可用电脑，使用内置麦克风并安装 Audacity，那么成本就是 0 美元。如果您使用免费的在线聚合服务，托管也可能是免费的。这些服务会将您的播客分发给七或八家主要的播客提供商，例如
    Google Podcasts、Apple Podcasts、Amazon Music 等。您也可以购买一台新电脑、一台新的高端麦克风或一套麦克风、一个混音设备，以此类推。如果您有一台可用的电脑，可以在上面安装
    Linux，安装 Audacity，并购买一个好麦克风。麦克风的价格通常反映了其质量。然而，一款 100 美元价位的麦克风就足以为您服务。如果您获得了赞助商或捐赠者，您以后总是可以升级设备。


    Audacity 的官方功能包括能够：


    - 录制现场音频

    - 将磁带和唱片转换为数字录音或 CD

    - 编辑 WAV、AIFF、FLAC、MP2、MP3 或 Ogg Vorbis 声音文件

    - 使用可选库导入和导出 AC3、M4A/M4R (AAC)、WMA 及其他格式

    - 剪切、复制、拼接或混合声音

    - 以 16 位、24 位和 32 位进行高质量录音

    - 添加多种特效，包括改变录音的速度或音高，以及淡入（Fade In）、淡出（Fade Out）和截断静音（Truncate Silence）

    - 使用 LADSPA、LV2、Nyquist、VST 和 Audio Unit 插件

    - 编写您自己的自定义插件


    ## 使用 Audacity


    自 2008 年我第一次开始制作播客以来，我就一直在使用 Audacity。那时它已经是一个成熟的产品，具备了我创建和编辑播客及其他音频文件所需的所有功能和插件。对于播客而言，Audacity
    最重要的两个方面是录制和编辑。每个人都会告诉你声音是电影或视频最重要的部分，但对于没有视觉线索来推导含义或背景的播客来说，这一点更为重要。您的音质必须卓越。您可以使用
    Audacity 的功能和插件来改善录音质量不佳的音频，但它听起来总是不会达到理想状态。


    优质的声音始于优质的设备，我将在下一节中介绍录音硬件的选择。


    操作 Audacity 很简单。由于大多数笔记本电脑都有内置麦克风，当 Audacity 在您的系统上打开时，您可以立即开始录音。按下录音按钮并开始说话。您会看到声波随着您说话出现在屏幕上（图
    1）。看！您现在是一位播客主持人了！好吧，还不完全是，但您已经在路上了。


    ![](img/740bd926461af28ed755753238e647a2_20_0.png)


    作为播客主持人，您可能希望或需要使用某种特效，例如截断静音（Truncate Silence）、放大（Amplify）或降噪（Noise Reduction）。要对整个文件应用特效，请按
    Ctrl + A 高亮整个文件，从菜单栏点击“特效”（图 2），然后选择您的特效。大多数特效都有自己的设置，您可以进行调整以满足您的需求。在应用特效之前，请点击“预览”按钮，使用您自定义的设置试听应用后的效果。调整并预览，直到您对选择感到满意，然后点击“确定”以应用该特效。您也可以将特效应用于音频文件的一部分。要这样做，请高亮您想要调整的区域，然后重复上述步骤以应用特效。如果您想要撤销更改，请记住通用的撤销键序列
    Ctrl + Z。


    ![](img/740bd926461af28ed755753238e647a2_20_1.png)


    如果您使用降噪功能来去除文件中的嘶嘶声或静电，请留意以下提示。Audacity 在去除这些异常方面做得很好，但有代价。如果您必须大幅降低噪音，音频可能会听起来“闷闷的”或不自然。最好重新录制您的音频，而不是用机械的声音烦扰您的听众——除非这正是您想要的效果。


    ## 录音硬件


    虽然我曾经使用过独立麦克风和扬声器、带麦克风的耳机和笔记本电脑麦克风、不带麦克风的耳机或耳塞，但我更喜欢使用内置麦克风的耳机来录制我的播客。我目前使用的是
    Plantronics（现为电子产品供应商 Poly 的一部分）生产的 C320-M 耳机（见图 3）。这是一款做工精良、低噪声的耳机，让我能听到自己的声音。降噪耳机通常会让距离感偏离对话，因为我无法完全听到自己说话，所以我不知道如何在录音中调节我的声音。


    要查看已连接设备的列表，请从主菜单选项中选中 编辑 | 首选项。


    > *专业提示：记住您的品牌。在您的播客期间多次提及您的播客名称。*


    我还有一个 Focusrite Scarlett 2i2 音频接口 [3]（在图 4 中显示为可用设备），它可以处理两个输入源。Audacity 将此设备视为单一声源。如果您有多个扬声器，每个都需要麦克风，您将需要一个接口设备来连接多个输入。使用此设备，我可以连接两个麦克风并同时录制它们。接口设备是一个多功能的选择，因为您可以使用
    XLR 输入或 1/4 英寸 TRS 连接器，并且每种接口都有各种适配器。


    ![](img/740bd926461af28ed755753238e647a2_20_2.png)


    在多人说话的播客中，我喜欢心形指向性领夹麦克风或内置麦克风的耳机。这样可以说话者可以放松下来并正常说话，而不是试图保持距离静止或手持麦克风一英寸的距离。领夹麦克风可以捕捉说话者的声音，而无需他们专注于距离和定位，这赋予了播客更自然和对话式的语气。此外，由于对麦克风机械操作的关注减少，您可能会更少的停顿和填充词需要从录音中删除。


    Audacity 几乎兼容所有与您电脑兼容的录音设备。通常，如果您的电脑识别它，Audacity 也会识别它。请记住通过阅读评论和询问组件与 Audacity
    配合工作的情况，仔细思考并选择合适的硬件。


    ## 应对 Audacity 的怪癖


    Audacity 是一个出色的音频程序，具有一些有趣的怪僻功能。最显著的怪癖是，在启动 Audacity 之前必须连接录音和回放硬件。Audacity 不会识别在活动期间插入的任何硬件。您的系统会识别新硬件并使其可用，但如果在
    Audacity 打开时插入设备，您将不会在设备列表中看到它。请先连接麦克风、耳机或其他音频设备，然后打开 Audacity。新硬件将出现在设备列表中。一旦连接，您可以随时在音频设备之间切换，而无需关闭并重新打开应用程序。例如，如果您连接了一个外部麦克风然后启动
    Audacity，您可以使用外部麦克风进行录音，切换到内置麦克风，并在不关闭和重新打开的情况下继续录音。在从列表中选择回放和录音设备时要小心。将麦克风选择为回放设备不会损坏任何东西，但选择正确的回放设备可以避免数小时的挫败感和故障排查。


    另一个显著的怪癖是您无法覆盖录音中的特定位置——至少我从未弄清楚如何做到这一点。例如，假设您录制了一段对话并想覆盖一个错误。在这种情况下，您可能试图将光标放置到您想覆盖的部分左侧，按下录音，并期望新的录音会插入到您放置光标的位置。您会发现新的录音是从当前录音的末尾开始的。您必须复制、剪切并粘贴您的新片段到录音中，以替换不好的音频。然而，您可以高亮您的新片段，复制它（Ctrl
    + C），高亮您想要放置坏片段的位置，然后按 Ctrl + V。您的新片段将粘贴到您的原始片段中，替换不好的音频。


    如果您再次按下录音按钮并开始说话，Audacity 会将您的新录音添加到之前片段的末尾。我的光标在 2.0 秒标记附近，但新片段被添加到了第一个片段的末尾（图
    5）。


    > 专业提示：赞助很棒，但长广告会让观众失去兴趣。两或三个 10 秒的广告比单个 30 秒的广告更好。


    我要提到的最后一个怪癖是，在收听音频文件时，您可能需要停下来，稍后再回来继续收听。如果您打算恢复收听，请勿按下停止按钮。相反，按下暂停按钮。如果您按下停止按钮，Audacity
    会将您带回光标位置，这可能距离您开始的地方有几分钟甚至几小时。如果您按下暂停以暂时停止收听，请再次按下暂停以恢复收听。我收听我的播客录音，有些长达一个多小时，结果按下停止后忘记我在哪里停止了。这是一个令人烦恼的问题，只需要发生几次就能训练您改为按下暂停。


    ## 高级功能


    Audacity 具有一些有趣的高级功能。您可以在“生成”菜单（图 6）中找到其中的一些，包括 Chirp、DTMF 音调、噪声、静音和 Click Track。


    我使用最多的是静音。我经常在音频文件的开头添加几秒静音，我知道我要将其交给另一个人进行制作，以便为片头音乐、赞助广告或旁白混合留出时间。要在轨道中添加静音，请用鼠标点击设置光标。然后，选择
    生成 | 静音 并提供持续时间（图 7）。静音间隔将出现在轨道中（图 8）。


    ## 保存项目和导出音频


    编辑完音频文件后，您可能想要保存它。您有一些选项可以做到这一点。如果您需要保存您的项目并稍后回来，保留您的编辑和历史记录，请选择 文件 | 保存项目 | 是。此选项将保存您的


    ![](img/740bd926461af28ed755753238e647a2_21_0.png)


    图 4：查看可用设备列表。


    ![](img/740bd926461af28ed755753238e647a2_21_1.png)


    图 5：尝试覆盖片段的一部分。


