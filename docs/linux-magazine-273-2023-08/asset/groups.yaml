    新的十年，延续传统，展示世界上最好的开源内容


    # **立即注册**


    ![](img/740bd926461af28ed755753238e647a2_14_1.png)


    扫描二维码或访问 2023.allthingsopen.org


    # 表演时间


    如果你使用 Linux，你已经拥有了进入播客领域所需的大多数工具。只要仔细计划，一步一步来即可。


    Graham Morrison 著


    我们中的许多人曾经和朋友们坐在一起讨论某些事情，也许是在喝了一杯啤酒或康普茶之后，结果有个人说，“这绝对适合做成一个绝妙的播客！”每个人都说“是的！”并热情地点头，谈话随即转向讨论播客的名字、托管在哪里，以及录制到智能手机上是否足够好。每个人都兴奋地上床睡觉，结果第二天早上醒来时却在想，为什么一个关于《塞尔达传说》中蘑菇品种的播客听起来是个好主意。


    或者并非如此。有时，播客创意确实能扛过第二天的考验，而现在是开始你自己的播客的最佳时机。作为 Linux 和开源用户，你的技术技能已经非常适合这项任务，而且作为一个话题，与
    Linux 和开源技术相关的知识是永恒的、始终有趣的，并且适用于从政治到烹饪的广泛其他主题。这使你比那些早上醒来有好播客创意的大多数人拥有显著优势，这种优势将帮助你克服阻止人们制作第一个播客的许多初始障碍。


    ## 要有计划


    首先要考虑的是计划，而你计划的第一部分应该是决定谁应该主持播客。这甚至比创意的初始强度更重要，因为一组引人注目的个性几乎可以谈论任何事情。许多听众也希望感觉他们像是在听朋友，或者理解他们及其兴趣的人的声音。虽然更难，但你也可以独自完成，通过传递你对某个主题的热情，使其具有足够的感染力，让听众不想错过任何一集。一个很好的例子是
    *History of English Podcast* [1]，由 Kevin Stroud 于 2012 年创立，原本打算只持续 100 集。他的想法是讨论英语单词和短语的词源，追踪其使用从大约伊朗高原上游荡的部落到诺曼征服英国，再到现代世界持续的语言流动。十年后，Keith
    刚刚发布了第 168 集，他刚刚讲到了 16 世纪末。他可能永远无法追上，但他对该主题的热情压倒了他 modest 的雄心，也压倒了他听众的雄心，这是好创意的一个绝佳标志。


    与 *History of English Podcast* 一样，你很可能想到了一个你非常了解并想与他人分享的主题——你需要将其分解为适合单集的内容，或者作为跨越多集的持续部分。你可能想谈论新闻故事，或者你和你的共同主持人的发现。如果这些主题属于可预测的类别部分，会有帮助，即使你穿插了更随意的、特定于各自剧集的部分。杂志出于类似原因也做同样的事。它们也有可预测的部分，如新闻、评论和教程，但也有更自由格式和适应性强的特写和访谈，它们是封面主题的一部分。


    另一件需要考虑的事情是你的播客是否适合家庭观看。适合家庭的播客会避免脏话或某些主题。这可能会限制你的范围或自发性，或者如果需要删除某些部分或单词，会使编辑变得更加困难，但它可以通过扩大受众来弥补，因为像
    Apple Podcasts 和 YouTube 这样的平台会标记那些不能广泛消费的内容。更实际地说，如果人们想在开车时和家人一起听，这也会有帮助。


    ## 时长和频率


    为播客做准备和设置就像为假期打包——你为一个周末打包的东西和一个为一周打包的东西几乎是一样的。就播客而言，这意味着准备 30 分钟录音和准备 2 小时录音的努力是一样的。但你必须抵制让播客太长的诱惑，尤其是其他播客对你的听众注意力有着如此激烈的竞争。将
    30 分钟的播客纳入你的收听计划比 2 小时的播客容易得多，而在找东西听（比如吸尘时）查看播放队列时，2 小时的马拉松会议更容易被跳过。更长的录音和较短的时长还会给你更多的编辑选择，从而带来更高质量的内容。俗话说，永远让你的观众欲求更多。


