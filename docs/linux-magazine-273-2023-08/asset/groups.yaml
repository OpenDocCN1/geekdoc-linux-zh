    \n## 赞助商\n\n![](img/740bd926461af28ed755753238e647a2_34_6.png)\n\n# 免费发行版的老兵 \
    \ \nTrisquel\n\n![](img/740bd926461af28ed755753238e647a2_35_0.png)\n\nRúben Rodríguez\
    \ 讨论 Trisquel，一个在过去 16 年里持续开发的免费 Linux 发行版。  \n作者：Bruce Byfield\n\n自由软件基金会（FSF）维护着一个不包含专有软件的免费发行版列表\
    \ [1]。虽然 DistroWatch 列出了 274 个 Linux 发行版，但 FSF 仅列出了 10 个免费发行版，其中许多已不再开发。一个显著的例外是\
    \ Trisquel，它自 2007 年以来每 1 至 3 年发布一个版本 [2]（图 1）。Trisquel 由 Rúben Rodríguez 创立，他至今仍是该发行版的主要开发者之一。最近，Rodríguez\
    \ 抽出时间讨论了这个在过去 16 年中占据他生活很大部分的发行版。\n\n> **Linux Magazine (LM)：** Trisquel 是如何起步的？最初的目标是什么，项目中是否有决定性时刻？\n\
    \n### 作者\n\nBruce Byfield 是一位计算机记者，也是专注于自由和开源软件的自由撰稿人和编辑。除了写作项目外，他还教授现场和电子学习课程。在他的业余时间，Bruce\
    \ 撰写关于西北海岸艺术的文章（http://brucebyfield.wordpress.com）。他也是 Prentice Pieces 的联合创始人，这是一个关于写作和幻想的博客，位于\
    \ https://prenticepieces.com/。\n\nRúben Rodríguez (RR)：这个项目始于近 20 年前，当时我在西班牙的维戈大学。我的大学希望制作一个定制的\
    \ GNU/Linux 发行版，这在当时相当流行，我和其他对这项技术感兴趣的朋友被找来参与。我最终领导了这个项目，并在（潮流过去且大学兴趣消退后）将其作为一个独立项目继续下去。\
    \  \n\n当我初次涉足这个领域时，我的大部分知识是技术性的，来自实验、一些课程以及我在大学里和同伴们的黑客行为。我会说这个项目本身对我来说非常有教育意义，不仅在技术方面，也在社会方面，例如如何管理一个社区。\n\
    \n![](img/740bd926461af28ed755753238e647a2_35_1.png)\n\n图 1：Trisquel 桌面。\n\n#\
    \ 发行版漫步 – Trisquel\n\n本地用户组。直到项目开始一年后，当我的学校举办了一场由理查德·斯托曼（Richard Stallman）的演讲时，我才了解到自由软件、许可证和\
    \ GNU 项目的理念。这改变了我的方法，因为当时我认识到，我们只应该提供和推荐那些可以自由选择、研究、修改和共享的软件——在学校项目的背景下更是如此。\n\
    \n因此，Trisquel 从一个添加了某些非自由软件包的 Debian 衍生版，转变为一个基于 Ubuntu 并移除其专有软件包的项目。做出这一选择是因为\
    \ Ubuntu 日益流行（大约在那个时候发布），这表明需要一个大版本没有专有组件的 Ubuntu，而且 Ubuntu 固定的发布周期将便于我们的工作。\n\
    \n> **LM：** 提供完全免费的发行版需要对 Ubuntu 进行哪些更改？\n\n> **RR：** 主要有三类工作：移除非自由软件包、移除原本自由软件包中的非自由组件，以及为了符合商标规定而进行的品牌重塑。\n\
    \n移除专有软件包相对简单。我们通过 ubuntu-purge 脚本 [3] 来完成（图 2）。目前，我们过滤了 150 个源代码包，这导致了数量更多的二进制包。将软件包添加到列表中有时需要进行详细分析，以调查许可证或其他法律原因，并确保尽可能有免费的替代方案。\n\
    \n从自由软件包中移除专有组件则更复杂。它通常需要持续的维护，以确保软件包保持功能正常，并在上游升级该包时最小化我们需要做的工作。这类案例中最大的是 Linux，我们使用\
    \ Linux-libc-dev 去杂化脚本，并将其整合到 Ubuntu 内核打包工作流程中 [4]（图 3）。另一个大型示例是 Firefox，在众多其他自定义中，被修改为不使用\
    \ addons.mozilla.org 来搜索扩展程序，因为该仓库包含自由和非自由软件。\n\nFirefox 也是品牌重塑任务类别的一个很好的例子。一些软件包拥有商标许可，其要求与软件许可本身不同。在某些情况下，如果进行了更改，它要求软件包必须重新命名，正如\
    \ Mozilla 产品和 Ubuntu 本身的情况。我们的自定义 Firefox 版本被称为 Browser。\n\n> **LM：** 除了伦理选择外，免费发行版有任何优势吗？\n\
    \n> **RR：** 免费发行版通常在默认设置方面在隐私方面做出更好的选择。例如，Browser 配置了比 Firefox 默认设置更严格的隐私配置。Trisquel\
    \ 还配置为最小化来自不同系统组件的自动（因此是未请求的）网络连接和打开的网络端口。\n\n> **LM：** 免费发行版有任何缺点吗？\n\n> **RR：**\
    \ 我们尽量让尽可能多的硬件设备正常工作，但有些需要专有驱动程序，并且在 Trisquel 上原样无法工作。用户总是可以选择安装这些组件，但我们把选择权留给他们，并且不推荐（或记录）如何这样做，因为我们认为不宣传此类软件更为重要。我们推荐像\
    \ lt-node.org 这样的资源来检查兼容性。\n\n> **LM：** Trisquel 与 FSF 列出的其他免费发行版相比如何？\n\n> **RR：**\
    \ 列表上的所有发行版都符合 FSF 的自由系统发行版\n\n```bash\npurge-bionic\n\n# /bin/sh\n\n# Non-free\
    \ packages. Don't include packages for which a helper exists, only\n# packages\
    \ that we want gone completely.\nREMOVE=\"\n      9mmu\n      a2ps-perl-ja\n \
    \     adsys-sql\n      acctonemo\n      aee\n      app-install-data-commercial\n\
    \      app-install-data-partner\n      amd64-microcode\n      ba54-facutter\n\
    \      bcm43xx-fwcutter\n      b43-fwcutter\n      b43-installer\n      b43-kyle\n\
    \      b43lameomiserz\n```\n\n图 2：用于从 Ubuntu 中移除非自由元素的 ubuntu-purge 脚本的一部分。\n\n\
    ```sh\n# case $i in\n#     -force) force--; shift;;\n#     *) forces;;\n# esac\n\
    # we don't want g_d, diff output translations to affect us.\nLC_ALL=C; export\
    \ LC_ALL\nLANGUAGE=; export LANGUAGE\noversa3 extraes3 overss3\n# kwerg: Srewsber\
    \ gnu-sed\n# deblob dirs echo \"80\" | sed s,'[\\]'\\%,\\'1\\\\8,\\\\1\\\\8',''\n\
    if test -f linux-kver.tar; then\n    z=star; x=deb\n    zextstar_l z=linux-kver.tar.gz;\
    \ then\n    zextstar_r2 z=linux-kver-r2.tar.gz; then\n    zextstar_v2 z=dm2sun2\n\
    # elif test -f linux-kver-l2; then\n#     zextstar_l2 z=dm2sun12\n# elif test\
    \ -f linux-kver1.tar.gz; then\n#     zextstar_g2 z=dm2sun2g2\n# elif test -f linux-kver.tar.gz;\
    \ then\n#     zextstar_g z=dm2sun2g\n# else\n# echo linux-kver.tar not found;\
    \ tried b2, x2, l2, g2 and tg2 to -R2\n# exit 1\n# fi\n# case t -f deblob-kver;\
    \ then\n```\n\n图 3：用于从 Linux 内核中移除专有条目的脚本开头部分。\n\n"
