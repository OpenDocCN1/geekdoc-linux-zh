    \ 服务，我稍后会解释这一点。\n\n现在你需要通过输入以下命令创建 NetBox 超级用户：\n\n```bash\n$ source /opt/netbox/venv/bin/activate\n\
    ```\n\n命令提示符中添加的 `(venv)` 是正常的。现在，添加超级用户：\n\n```bash\n(venv) $ cd /opt/netbox/netbox\n\
    (venv) $ python3 manage.py createsuperuser\n```\n\n你可以使用 `deactivate` 命令退出虚拟环境并返回到正常的终端窗口，但我通常发现自己在关闭并打开新的终端（或者刷新页面，因为我正使用\
    \ Cockpit 连接）。\n\n添加超级用户后，你需要将日常维护脚本作为 cron 作业添加，以便偶尔进行一些清理。为此，在 `cron.daily`\
    \ 文件夹中添加脚本的链接，如下所示：\n\n```bash\n$ sudo ln -s /opt/netbox/contrib/netbox-housekeeping.sh\
    \ /etc/cron.daily/netbox-housekeeping\n```\n\n此时，你应该拥有一个正在运行的 NetBox 实例，你可以通过输入之前在\
    \ `configuration.py` 中定义的 IP 地址或主机名来连接它。你需要拥有 Uncomplicated Firewall (UFW)，这可能需要运行：\n\
    \n```bash\n$ sudo ufw allow 9090\n$ sudo ufw allow OpenSSH\n$ sudo ufw allow https\n\
    $ sudo ufw allow http\n$ sudo ufw enable\n$ sudo ufw status\n```\n\n我添加了端口 9090\
    \ 和 22，因为我使用了 Cockpit，并且也希望有能力通过 SSH 连接到此服务器，但这超出了本文的范围。如果你不知道如何通过 SSH 连接到服务器，或者尚未安装和使用\
    \ Cockpit 或类似的服务器管理 Web GUI（如 Webmin），我建议你先做这些事情，因为这将帮助你熟悉从终端管理无 GUI 的服务器。即使你运行的是\
    \ Ubuntu 桌面版，也可以使用 SSH 或 Cockpit 连接到你的机器。\n\n## 创建服务\n\n现在你需要复制默认的 Gunicorn [16]\
    \ 配置并创建服务，以便使用第 5 节中的代码打开和关闭 NetBox。\n\n### 第 5 节：创建服务\n\n```bash\n$ sudo cp /opt/netbox/contrib/gunicorn.py\
    \ /opt/netbox/gunicorn.py\n$ sudo cp -v /opt/netbox/contrib/*.service /etc/systemd/system/\n\
    $ sudo systemctl daemon-reload\n$ sudo systemctl start netbox netbox-rq\n$ sudo\
    \ systemctl enable netbox netbox-rq\n$ systemctl status netbox.service\n```\n\n\
    第 5 节中的代码复制默认的 Gunicorn 配置文件，然后创建 NetBox 系统服务，启动它，启用其在系统每次启动时运行，并检查其是否正常运行且已启用启动。完成此步骤后，如果你运行\
    \ `upgrade.sh` 命令并且它提示你重启 NetBox 服务，你现在将能够成功执行。\n\n## Web 服务器设置\n\n要设置 Web 服务器，你需要创建一个\
    \ SSL 证书以允许 HTTPS 加密流量（图 7）：\n\n```bash\n$ sudo openssl req -x509 -nodes \\\n\
    \        -days 365 -newkey rsa:2048 \\\n        -keyout /etc/ssl/private/netbox.key\
    \ \\\n        -out /etc/ssl/certs/netbox.crt\n```\n\n此证书是自签名的，对于我们的用途来说没问题。在生产环境中，你可能不希望使用自签名证书。\n\
    \n接下来，系统会提示你输入一些可选的详细信息，你可以将这些信息包含在证书中。我建议把它当成一个小游戏，看看是否真的有人阅读你的证书详细信息！\n\n现在你将安装\
    \ NGINX Web 服务器 [17]：\n\n```bash\n$ sudo apt install -y nginx\n```\n\n下一步至关重要：你必须将之前提到的主机名和\
    \ IP 地址添加到服务器的配置文件中：\n\n```bash\n$ sudo nano /opt/netbox/contrib/nginx.conf\n\
    ```\n\n将 `netbox.example.com` 更改为你之前在 `configuration.py` 中输入的主机名或 IP 地址。注意，这里可以有多个条目，例如安装的\
    \ IP 地址和主机名。只需空格分隔即可。如果你忘记了这些信息，可以使用终端中的 `$ ip address` 和 `$ hostname` 命令来查找。\n\
    \n现在你将把 NetBox HTTPS 配置文件复制到 NGINX 目录，删除默认启用的站点，将其替换为指向此文件的链接，并通过按顺序输入第 6 节中的命令来重启\
    \ HTTPS 服务。\n\n### 第 6 节：设置 NGINX 服务器\n\n```bash\n$ sudo cp /opt/netbox/contrib/nginx.conf\
    \ /etc/nginx/sites-available/netbox\n$ sudo rm /etc/nginx/sites-enabled/default\n\
    $ sudo ln -s /etc/nginx/sites-available/netbox /etc/nginx/sites-enabled/netbox\n\
    $ sudo systemctl restart nginx\n```\n\n如果你将来对配置文件进行任何更改，你需要使用第 6 节第 1 行中的命令将该文件重新复制到\
    \ `sites-available` 目录，然后通过第 4 行重启 NGINX。如果不这样做，你的配置将实际上不会更改。\n\n（在线 NetBox 文档中还有一个可选的\
    \ LDAP 服务安装章节，但这超出了本文的范围。）\n\n现在你应该已经可以正常运行了（图 8）。你可以通过进入 Web 浏览器并在地址栏中输入你在 NGINX\
    \ 配置文件和 `configuration.py` 中使用的域名或 IP 地址来访问你的 NetBox 安装。你将使用之前创建的用户名和密码登录。登录后，我建议你为自己以及其他需要访问\
    \ NetBox 的人员创建一个新的用户。\n\n当你使用此 SSL 证书连接到你的新 NetBox 实例时，你会收到关于连接到不安全服务器的警告（图 9）。对于我的安装来说这不是问题，但对你可能很重要。如果是这种情况，你可以研究非自签名的证书。就本文的目的而言，在这种情况下完全可以忽略该警告。\n\
    \n## 分配用户权限\n\n你可以授予用户仅查看或编辑的权限。这些权限基于网络每个方面的每个子部分。这非常细致，很棒但也令人有些困惑。我强烈建议明智地使用组——先思考为你的组织设置权限的最佳方式。\n\
    \n还有一个用于单点登录 (SSO) 的插件，这可能适合你的安装环境。你可能希望一个人添加所有新设备，另一个人向这些设备添加 IP 地址。如果是这样，你会给予第一个人更改设备类型和设备的权限，但仅查看\
    \ IP 地址，反之亦然。\n\n![](img/740bd926461af28ed755753238e647a2_54_0.png)\n\n"
