    # ## Getting Started


    Once you’ve installed the necessary tools, you are now ready to build a basic
    Go app to make sure that everything is working. First, make a new folder and set
    it up as a Go project using `go mod init` (Listing 1). You now have a `go.mod`
    file. You can test to see if the Go compiler is working by quickly sending some
    basic file content to `main.go` and then building the app (Listing 2). All you
    need is the package name (`main`) and a simple `main()` function to let the compiler
    know you are building an application instead of a library.


    If your build completes without error, then it has succeeded. You will see a file
    called `todoapp`. You can run `todoapp` at this stage, but you will not get output
    because you have not built your app yet!


    # ## Showing a Window


    I’ll now demonstrate how to write some code to display a window onscreen. First,
    you need to install the Fyne library into your project with `go get`. The following
    command will download the Fyne project’s source code from GitHub and store it
    in a Go cache. It then marks Fyne as a dependency of your project so that your
    code editor or IDE can make sensible suggestions for auto-completion and compilation:


    ```

    ```

    > go get fyne.io/fyne/v2@latest

    go: added fyne.io/fyne/v2 v2.3.4

    ```

    ```


    # ### Listing 1: Create a Project


    ```

    ```bash

    > mkdir todoapp

    > cd todoapp

    > go mod init todoapp

    go: creating new go.mod: module todoapp

    ```

    ```


    # ### Listing 2: Test the Install


    ```

    ```go

    > echo "package main

    func main() { }" > main.go

    > go build

    ```

    ```


    After installing the Fyne library, you next must create a new application instance,
    which is the variable that will be used to create new windows, access storage,
    and use other important features. You can create a new app by inserting the following
    into your main func:


    ```

    ```go

    a := app.New()

    ```

    ```


    However, it is best practice to identify your app, which can be done using:


    ```

    ```go

    app.NewWithID("com.example.myapp")

    ```

    ```


    The code should be added to the top of your main function. This app package is
    from the import path `fyne.io/fyne/v2` (`app` (your IDE will probably automatically
    add this).


    In the new app, you can create a new window by simply requesting it with:


    ```

    ```go

    w := app.NewWindow("TODO")

    ```

    ```


    This sets up the variable `w` for the new window. The window will have the title
    “TODO” which may be displayed in your window border. At this point, you could
    build the app. However, without any content, the window would be fairly useless,
    so I’ll show you how to add a widget.


    # ## Adding a Widget


    In Fyne, an app can be created by drawing basic types (called CanvasObjects) to
    a position within the window. These items are available in the `fyne.io/fyne/v2/canvas`
    package. However, you can use a collection of pre-made widgets (`fyne.io/fyne/v2/widget`)
    that provides several interactive widgets for the standard user controls and visual
    items found in most apps.


    You can create a new label widget to display the text “TODO App” by simply calling
    `widget.NewLabel("TODO App")`. Then use the `SetContent` method to place this
    widget inside the previously created window. The line of code now becomes:


    ```

    ```go

    w.SetContent(

    widget.NewLabel("TODO App"))

    ```

    ```


    Finally, you must show the window. Because GUI toolkits also have an event loop
    that manages how the app runs and listens for user input, you also need to run
    the app. Conveniently, Fyne has a method that simultaneously shows the window
    and runs the application:


    ```

    ```go

    w.ShowAndRun()

    ```

    ```


    That is all there is to creating your first graphical app.


    # ## Running the App


    To run the app, you can use `go run`, or you could build it using `go build` and
    then later run the executable that was created. However, because you have added
    a new library, you should run `go mod tidy` first to ensure the project metadata
    is up-to-date. After this, you can run the app with:


    ```

    ```bash

    > go mod tidy

    go: finding module for package

    fyne.io/fyne/v2/app

    go: found fyne.io/fyne/v2/app in

    fyne.io/fyne/v2 v2.3.4

    > go run .

    ```

    ```


    Telling the Go compiler to run “.” means it runs all the files in the current
    directory (`main.go` for your app). Your app should now look something like Figure
    1. Depending on your desktop settings, the app may appear with a light or a dark
    theme.


    # ## Building the User Interface


    Before you start building more complex content for your app, I need to explain
    Container types. Containers are what allow multiple elements to be arranged in
    an area, and they do so according to a layout. There are many standard containers
    for common types of positioning in Fyne. You can also


    ![](img/740bd926461af28ed755753238e647a2_42_0.png)'
  - '[PAGE 43]


    add your own layout code. (I won''t cover that in this article, but you can find
    out more online [2].)


    These container types include **Box** and **HBox** (for packing child items into
    vertical or horizontal boxes), **Split** (to allow users to drag a split bar separating
    two child items), or **Stack** (to allow multiple items to be drawn on top of
    each other). The most popular, and flexible, container is **Border**, which you
    will use twice in the to-do list app. The **Border** container takes four required
    fields for items to be positioned along the top, bottom, left, and right edges,
