    By Joe Casad


    在旧时代，我们都不介意购买零售版 Windows 笔记本电脑，重新格式化（或缩小）分区，然后用 Linux 进行设置。结果因人而异，但最终你都能让它工作起来。但你花了多少时间去移除你不想要的操作系统，以便安装你真正想要的系统呢？随着
    Linux 开始走向主流，人们清楚地意识到世界需要为那些希望在没有麻烦和复杂的情况下将计算机启动到首选系统的 Linux 用户提供可靠、稳定且安全的选择。


    销售预装 Linux 笔记本电脑的零售商名单包括联想和戴尔这样的巨头，但也包括一些专门从事 Linux 系统的较小供应商，因此他们将 Linux 作为其关注的唯一焦点。我们在
    *Linux Magazine* 之前的几期中已经评测了该领域的许多产品。最近，我们收到了 TUXEDO InfinityBook Pro 16 Gen7
    MK1 系统 [1]，该系统在 TUXEDO 网站上标价 1,224 欧元。


    TUXEDO 在欧洲多年来一直很受欢迎，并且在北美市场的影响力也在增加。像其他一些 Linux 专业品牌一样，TUXEDO 维护自己的 Linux 发行版，他们称之为
    TUXEDO OS。TUXEDO 表示他们的 InfinityBook MK1 系统（图 1）是为“内容创作者、软件开发人员或商务用户”设计的。评测系统运行频率为
    4.6GHz，拥有 14 个处理器核心、31GB 内存和一块 Samsung SSD 980 1TB 硬盘。


