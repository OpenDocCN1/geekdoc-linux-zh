    \nAs mentioned, the Lensfun lens-correction profile also automatically removes\
    \ vignetting (that is, circular shadowing), especially in the corners of the image.\
    \ If you want or need to correct this manually, use the Vignetting Correction\
    \ tool in Transform. This tool lets you add a vignette by dragging the Intensity\
    \ slider to the left. In general, vignetting is not as disturbing as chromatic\
    \ aberrations or distortion; quite often, a slight vignette even has an aesthetic\
    \ effect (Figure 8).\n\nFinally, export the photo. To do this, click on the floppy-disk\
    \ icon bottom left. The Save dialog box appears. When you get there, select the\
    \ Target folder, the File format (JPEG, PNG, or TIFF), the Bit depth (8- or 16-bit),\
    \ and the Compression, and press OK or *1* to confirm.\n\nadjustments. The application\
    \ gives you options for finding a perfect color balance across the image. As a\
    \ result, you no longer need to resort to other tools for the final editing steps.\n\
    \nIn fact, the software is, in our opinion, one of the best RAW developers currently\
