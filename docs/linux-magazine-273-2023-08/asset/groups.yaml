  mdcn: "\n# LINUX MAGAZINE\n\n第 273 期 – 2023 年 8 月\n\n## 播客制作\n\n支持你的热情，并触达你的在线受众\n\
    \n- **NetBox**：让你随时掌握网络知识\n- **Fair Play**：这款酷劲十足的 Go 程序根据技术将足球运动员分成实力均衡的队伍\n\
    - **Fyne GUI 工具包**：一次编写代码，支持多个平台\n- **RawTherapee**：使用这款 RAW 照片编辑器转换你的数字图像\n-\
    \ **fdupes**：清理重复文件\n- **10 款 FOSS 瑰宝**：这是你在 Linux 上的思维火花\n\nLINUX NEW MEDIA\n\
    开源世界的脉搏\n\n![](img/740bd926461af28ed755753238e647a2_1_0.png)\n\n### TUXEDO InfinityBook\
    \ Pro 14 - Gen8\n\n- 移动性\n- 电池续航\n\n17 毫米超薄 & 仅 1.3 公斤轻。采用超便携镁合金机身的优质商务笔记本，提供极致的移动体验。\n\
    \n### TUXEDO Stellaris 16 - Gen5\n\n- CPU 性能\n- GFX 性能\n\n得益于 GeForce RTX 4090\
    \ 和 Intel Core i9，在紧凑的外形因子中提供顶级桌面 PC 级性能。\n\n- 兼容 Linux\n- 长达 5 年保修\n- 即刻可用\n\
    - 德国制造\n- 德国数据隐私保护\n- 德国技术支持\n\n![](img/740bd926461af28ed755753238e647a2_1_1.png)\n\
    \n## 编辑部\n\n### 欢迎辞\n\n### 黑暗时期与黑色墨水\n\n亲爱的读者，\n\n在我撰写本专栏时，Reddit 的“黑暗时期”正处于新闻焦点。当你阅读时，你大概比我现在知道的更多，但就目前而言，尽管该公司声称这一切最终都会过去，但这次中断看起来影响重大。回顾一下：Reddit\
    \ 实际上是一家公司，虽然它具有许多使其看起来更像社区群组集合的特征，但该公司宣布将开始对访问其 API [1] 的应用程序收费。这一消息意义重大，因为有多家公司的收入来源于提供\
    \ Reddit 接口的应用程序，其中一些供应商已宣布，为访问 Reddit API 付费将导致他们倒闭。Apollo，一款苹果产品 Reddit 客户端的制造商，已经宣布这一变更将使他们每年损失\
    \ 2000 万美元。\n\nReddit 已经平稳运行了 17 年。为什么要现在打破现状？该公司正为今年晚些时候通过 IPO 上市做准备，这并非秘密 [2]。整个情景符合这些科技创业公司发展的常规剧本。风险投资家投资一家私人公司使其成长（侧重于增长，而非利润），然后在某个时间点，通过\
    \ IPO 上市，每个人都能赚一大笔。但 IPO 只有在华尔街喜欢其所购买的东西时才能成功，而华尔街喜欢的是利润。所以，如果 Reddit 想要大放异彩，它们需要从一个强调增长的公司（即最大限度地访问\
    \ API）转变为一个强调利润的公司（即除非带来收入，否则不允许访问）。\n\n据报道，Reddit 是世界上最繁忙的第 10 个网站，美国最繁忙的第 6\
    \ 个网站，拥有 5700 万日活跃用户，因此抵制行动是大新闻。该公司坚称，抵制只关闭了其论坛的一小部分。在总共 100,000 个活跃的子版块中，最初有\
    \ 6,000 个下线，随后最多有 9,000 个下线，有些在本周稍后恢复。截至写作时，仍有约 3,500 个处于下线状态。但实际数字可能不如它在关键时刻为\
    \ Reddit 带来的关注重要。\n\n确实，部分关注可能来自投资者的正面关注，因为 Reddit 高管正在“强硬”行事并要求利润。但也值得记住，Reddit\
    \ 处于一种大多数公司永远不会面临的特殊境地。它们整个商业模式依赖于其看起来和行为上像一个社区。Reddit 上大多数版主都是自愿奉献时间的。根据西北大学研究人员最近的一项研究\
    \ [3]，志愿者每年为 Reddit 节省了 340 万美元的劳动力成本。当然，Reddit 是一家大公司（在 2019 年研究时，340 万美元相当于收入的\
    \ 2.8%）。但在互联网经济中，赤字与盈余之间的界限非常微妙，340 万美元可能会产生差异。大多数志愿者很乐意将时间捐赠给值得的事业，但一个为了取悦华尔街而提升利润的企业巨头可能不是许多这些志愿者认为值得的事业。\n\
    \n我对 Reddit 有一些同情。难道它们应该永远免费向那些不贡献任何费用来支付基础设施的公司开放吗？然而，如果它们依靠免费劳动力并高喊社区精神，它们是否应该被施加比其他大谈利润的创业公司不同的标准？该公司表示，它正在与几家客户公司谈判，希望它们能够继续服务，尽管两家最大的客户，Apollo\
    \ 和 Reddit Is Fun (RIF)，已经宣布将关闭其论坛。\n\nReddit 首席执行官 Steve Huffman 最近被问及他认为真实答案是否是在互联网广告上建立庞大公司的盈利模式根本行不通。他的回答是：“你是说\
