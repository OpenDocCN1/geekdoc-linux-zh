    ## 入门


    安装好必要的工具后，你现在就可以构建一个基本的 Go 应用程序，以确保一切运行正常。首先，创建一个新的文件夹并使用 `go mod init` 将其设置为
    Go 项目（列表 1）。现在你拥有了一个 `go.mod` 文件。你可以通过快速向 `main.go` 写入一些基本文件内容，然后构建应用程序（列表 2），来测试
    Go 编译器是否正常工作。你只需要包名（`main`）和一个简单的 `main()` 函数，以告知编译器你正在构建一个应用程序而不是库。


    如果你的构建在没有错误完成，则说明构建成功。你会看到一个名为 `todoapp` 的文件。此时你可以运行 `todoapp`，但由于你还没有构建应用程序本身，所以不会得到任何输出！


    ### 列表 1：创建项目


    ```bash

    > mkdir todoapp

    > cd todoapp

    > go mod init todoapp

    go: creating new go.mod: module todoapp

    ```


    ### 列表 2：测试安装


    ```go

    > echo "package main

    func main() { }" > main.go

    > go build

    ```


    ## 显示窗口


    现在我将演示如何编写代码以在屏幕上显示一个窗口。首先，你需要使用 `go get` 将 Fyne 库安装到你的项目中。以下命令将从 GitHub 下载 Fyne
    项目的源代码并将其存储在 Go 缓存中。然后，它将 Fyne 标记为你项目的依赖项，以便你的代码编辑器或 IDE 能够做出合理的自动补全和编译建议：


    ```bash

    > go get fyne.io/fyne/v2@latest

    go: added fyne.io/fyne/v2 v2.3.4

    ```


    安装 Fyne 库后，接下来必须创建一个新的应用程序实例，这是用于创建新窗口、访问存储以及使用其他重要功能的变量。你可以通过在 main 函数中插入以下内容来创建一个新的应用程序：


    ```go

    a := app.New()

    ```


    不过，最佳实践是标识你的应用程序，可以使用以下方法：


    ```go

    app.NewWithID("com.example.myapp")

    ```


    代码应添加到你的 main 函数的顶部。这个 app 包来自导入路径 `fyne.io/fyne/v2`（`app`（你的 IDE 很可能自动添加这个）。


    在新应用程序中，你只需通过请求即可创建新窗口：


    ```go

    w := app.NewWindow("TODO")

    ```


    这为新的窗口设置了变量 `w`。窗口将拥有标题“TODO”，它可能会显示在你的窗口边框中。此时，你可以构建应用程序。然而，由于没有任何内容，窗口会相当无用，因此我将向你展示如何添加一个组件。


    ## 添加组件


    在 Fyne 中，应用程序可以通过将基本类型（称为 CanvasObject）绘制到窗口内的位置来创建。这些项目可以在 `fyne.io/fyne/v2/canvas`
    包中找到。但是，你可以使用预制组件的集合（`fyne.io/fyne/v2/widget`），它提供了大多数应用程序中常见的标准用户控件和视觉项的多个交互组件。


    你可以通过简单地调用 `widget.NewLabel("TODO App")` 创建一个新的标签组件，以显示文本“TODO App”。然后使用 `SetContent`
    方法将此组件放入之前创建的窗口中。这行代码变为：


    ```go

    w.SetContent(

    widget.NewLabel("TODO App"))

    ```


    最后，你必须显示该窗口。由于 GUI 工具包还有一个管理应用程序运行方式和监听用户输入的事件循环，因此你还需要运行该应用程序。 conveniently，Fyne
    有一个方法可以同时显示窗口并运行应用程序：


    ```go

    w.ShowAndRun()

    ```


    这就是创建你的第一个图形应用程序的全部内容。


    ## 运行应用程序


    要运行应用程序，你可以使用 `go run`，或者使用 `go build` 构建它，然后稍后运行创建的可执行文件。但是，由于你添加了一个新的库，你应该先运行
    `go mod tidy` 以确保项目元数据是最新的。之后，你可以使用以下命令运行应用程序：


    ```bash

    > go mod tidy

    go: finding module for package

    fyne.io/fyne/v2/app

    go: found fyne.io/fyne/v2/app in

    fyne.io/fyne/v2 v2.3.4

    > go run .

    ```


    告诉 Go 编译器运行“.”意味着它运行当前目录中的所有文件（对于你的应用程序来说是 `main.go`）。你的应用程序现在应该看起来像图 1。根据你的桌面设置，应用程序可能会显示浅色或深色主题。


    ![](img/740bd926461af28ed755753238e647a2_42_0.png)


    ## 构建用户界面


    在你开始为应用程序构建更复杂的内容之前，我需要解释容器类型。容器允许多个元素按照布局排列在一个区域内。Fyne 中有许多用于常见定位类型的标准容器。你还可以添加自己的布局代码。（本文不会涵盖这一点，但你可以在网上了解更多
    [2]。）


    这些容器类型包括 **Box** 和 **HBox**（用于将子项打包到垂直或水平框中）、**Split**（允许用户拖动分隔两个子项的分隔栏）或 **Stack**（允许多个项相互叠加绘制）。最受欢迎且灵活的容器是
    **Border**，你将在待办事项应用程序中两次使用它。**Border** 容器需要四个必填字段，用于定位位于上、下、左、右边缘的项目，以及一个可选的第五个参数，用于填充剩余（中心）空间的内容。应用程序分为两个主要区域：顶栏（你将在此处放置
    *新条目* 输入组件）和待办事项列表区域，该区域填充主要区域。本质上，应用程序的整个布局被捕捉为：


    ```

    container.NewBorder(head, nil, nil, nil, list)

