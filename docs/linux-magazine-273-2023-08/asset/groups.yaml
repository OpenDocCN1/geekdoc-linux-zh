    Web 类（第 6–339 行）连接到一个 MySQL 数据库，该数据库将用于获取队伍名称、确定哪支队伍与哪支队伍比赛，并记录比赛历史。当实例化该类时，`__init__`
    函数会自动调用，以设置稍后需要的一些内容。第 8 行创建了一个类变量 `self.scoreboard`，并保存了作为参数传入的记分牌类的引用。


    重连函数实际上只是一个调用，为了方便阅读而分拆在多行中（第 12–18 行）。`pymysql` connect 创建 `self.db`，即数据库的本地引用。每一行提供相应的凭据。


