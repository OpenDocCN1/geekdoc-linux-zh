    ![](img/740bd926461af28ed755753238e647a2_17_0.png)


    **Figure 2:** Performing and recording a podcast live can be a lot of fun, but
    it doesn’t necessarily result in the best quality episodes.


    # Publishing and Analytics


    With a plan agreed, recordings made, and the important step of editing complete
    (Figure 2), you’re ready to share your podcast with the world. We’d obviously
    recommend releasing your podcast under a Creative Common license, and many Linux-based
    podcasts choose either the Creative Commons Attribution-NonCommercial (CC BY-NC)
    or the Attribution-ShareAlike (CC BY-SA) licenses. The CC BY-SA license is ideal
    if you’re not concerned about people deriving monetary value from your work. Choosing
    either will also help with music and logo choices, because you’re then free to
    use similarly licensed creative works within your own podcast.


    Using music in the intro, the outro, and segment transitions adds a professional
    production quality to your podcast. Although music and design work can be commissioned
    cheaply through platforms such as Fiverr, choosing from Creative Commons-licensed
    media gives you much greater control. Many Creative Commons music tracks, for
    instance, are provided as a pack of *stems*, bundling the individual tracks used
    to produce the final mix. This gives podcasters a lot of flexibility, letting
    them repeat a section of the music, remove vocal tracks, or create an entirely
    different mix suitable for embedding within the podcast.


    The next big question is how you intend to host your podcast. A 30-minute mono
    podcast is usually about 30MB. A moderately successful podcast might have 10,000
    listeners, and this requires around 300GB of bandwidth per episode. Self-hosting
    is usually good enough to start with, especially if you can grab a domain name
    related to your podcast, and you can either set up a dynamic CMS such as WordPress
    for posting content related to each episode, or you can use a static site generator
    updated for each release. Another important aspect is community feedback, and
    it’s worth


    offering several options, including email or web-based comments, alongside cheaper
    and easier-to-maintain options like an IRC presence, a Telegram group, or a Discord
    server. Spotify will do all this for you, but you lose control over how you might
    publish or aggregate your podcast later.


    Of course, a podcast wouldn’t be a podcast without an RSS feed. RSS remains central
    to how you publish your podcast and how people listen to it. An RSS file is an
    XML-formatted text file that podcast players parse to understand where the podcast
    is located and which episodes are available (see the box entitled “Podcast RSS
    Format”).


    RSS is simple enough to create manually, and you’ll find plugins for WordPress
    and other sites that can make the process even more painless. It is also easy
    to get your podcast included in Apple’s Podcasters Program [2], Spotify’s equivalent
    [3], or YouTube, although you’ll need to agree and accept certain content, RSS-formatting,
    and encoding requirements for Apple and Spotify. You can bypass all of this using
    a podcast aggregating service or host, who will happily serve your podcasts, submit
    them for inclusion on the most popular services, and even negotiate advertising
    on your behalf. Aggregating services usually cost very little up front, although
    they will take a substantial cut from any advertising revenue.


    On the subject of money, making any from a podcast is difficult and shouldn’t
    be your principal motivation. You might, however, make enough money to help with
    hosting bills and equipment. For open source and Linux-related podcasts, you might
    want to consider using Patreon [4], which enables listeners to make a small contribution
    to the running of the podcast. You can encourage this with additional content
    for backers, early access to episodes, or access to a podcast feed without any
    advertising. You can also sell merchandise (Figure 3) or sell advertising for
    the


    ![](img/740bd926461af28ed755753238e647a2_17_1.png)


    **Figure 3:** One way to help fund a podcast is through merchandise, which can
    often be made and dispatched on demand, with the supplier taking a certain percentage
    of the overall price.'
