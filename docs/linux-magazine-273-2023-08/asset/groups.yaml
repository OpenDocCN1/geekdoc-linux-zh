    # ON THE COVER


    +   42  Coding with Fyne

    +       Give your custom Go app a graphical interface.


    +   48  NetBox

    +       Put all those useful bits of network information in one place.


    +   58  Programming Snapshot - Teams

    +       Mike spins up an inventive solution for choosing sports teams based on
    player statistics.


    +   64  DIY Scoreboard

    +       We''ll show you how to create your own scoreboard with a Raspberry Pi
    and a little Python.


    +   78  fdupes

    +       If you don''t love housekeeping, you''ll love this handy tool for finding
    duplicate files and folders.


    +   88  RawTherapee Workshop

    +       Access the raw image data to go deeper with your photo editing.


    # NEWS


    +   8  News

    +       • Fedora-Based Ultramarine Linux

    +       • Debian 12 Has Finally Been Released

    +       • Armbian 23.05

    +       • Linux Mint Finally Receiving Support for Gestures

    +       • An All-Snap Version of Ubuntu Is in the Works

    +       • Mageia 9 Beta 2 Ready for Testing

    +       • KDE Plasma 6 Looks to Bring Basic HDR Support

    +       • Bodhi Linux 7.0 Beta Ready for Testing

    +       • Changes Coming to Ubuntu PPA Usage


    +   12  Kernel News

    +       • Rust in Linux

    +       • Compiler and Kernel Frenemies


    # REVIEWS


    +   32  TUXEDO InfinityBook Pro 16 Gen7 MK1

    +       The next-generation laptop from TUXEDO is faster and lighter than previous
    business models.


    +   36  Distro Walk – Trisquel

    +       Rüben Rodriguez discusses Trisquel, a free Linux distro that has been
    in continuous development for the past 16 years.


    # IN-DEPTH


    +   40  Command Line – most

    +       The most terminal pager offers a feature-rich, better organized alternative
    to less.


    +   42  GUI Apps with Fyne

    +       The Fyne toolkit offers a simple way to build native apps that work across
    multiple platforms. We show you how to build a to-do list app to demonstrate Fyne''s
    power.


    +   48  NetBox

    +       NetBox is a single source of information on your network where you can
    store all those important details that used to get lost.


    +   58  Programming Snapshot – Go Algorithms

    +       Instead of the coach determining the team lineup, an algorithm selects
    the players based on their strengths for Mike Schill’s amateur soccer team.


    # COVER STORIES


    +   16  Podcasts

    +       If you use Linux, you already have most of the tools you need to get in
    the podcast game. Just plan carefully and take it a step at a time.


    +   20  Audacity

    +       This free, open source, easy-to-use, multi-track audio recording and editing
    tool is perfect for podcasts.


    +   24  Sound Studio Workshop

    +       Once you get your podcast operation up and running, you might decide you
    want a real mixer and some higher end software. We''ll introduce you to Ardour
    and get you started with some basic audio hardware.


    +   95  Back Issues   67  Call for Papers

    +   96  Events         68  Coming Next Month'
