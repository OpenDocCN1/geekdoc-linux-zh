    当然，区分特征并不是系统捆绑的常见 KDE 和 Linux 工具，而是 TUXEDO 自己的增值贡献。TUXEDO 控制中心是管理硬件环境的中央用户界面（图
    2），它是硬件和软件之间紧密协调的最佳例子之一。你可以获得 CPU 速度、系统温度和风扇使用率的快速仪表板视图。你还可以选择预定义硬件配置文件，立即针对不同的使用案例调整系统。例如，你可以选择一个最低功耗配置文件或一个用于办公用途的“中档性能”配置文件。一个让我心动的配置文件是“安静”配置文件。作为一个从来不喜欢电脑风扇噪音的人，过去我会对这个选项感到非常高兴，但
    TUXEDO 笔记本电脑的风扇非常安静，我几乎没注意到它。你还可以创建自己的自定义硬件配置文件。控制面板还提供键盘背光、网络摄像头、关闭计时器和硬盘加密的设置。当然，TUXEDO
    控制面板所做的许多事情还有其他方法，但界面非常合理且设计良好，让这些设置触手可及无疑是一个优势。


    ![](img/740bd926461af28ed755753238e647a2_32_0.png)


    TUXEDO OS 内置的另一个有趣功能是 Tomte 配置服务 [2]。开发者将 Tomte 称为“一项自动识别客户设备并检查缺失驱动程序和必需包的服务”。系统在安装期间和其他重要时刻自动访问
    Tomte，但你可以使用 tuxedo-tomte 终端命令手动与 Tomte 交互。


    ### 试驾


    MK1 使用起来很愉快。键盘易于使用（北美左撇子，参见标题为“左 Shift”的框）。


    电池提供了 10 小时的续航时间，这意味着你理论上可以在机场全天工作而无需寻找电源插座。


    我能够轻松播放视频，没有卡顿。系统拥有一切我需要的功能，画面看起来很棒。内置扬声器在观看电影或偶尔的 YouTube 片段时功能正常，但如果你经常听大量音乐曲目，你需要耳机或外部扬声器。


    系统在音频录制方面也表现良好。我启动了 Audacity，发现一切工作正常，无需任何折腾或重新配置——不仅适用于语音录制，也适用于多轨原声音乐。


    点击板一开始让我有些困惑。这是一个非常大的点击板，分为两半。你可以将整个点击板作为一个单元使用，左半部分为鼠标左键，右半部分为鼠标右键；或者你可以禁用其中一半，使用另一半同时作为鼠标右键和左键。


    ### 左 Shift


    > 当我刚拿到系统时，打字时犯的错误比平时多。过了一段时间我才注意到 Shift 键的区别。左 Shift 键明显比右 Shift 键小；作为一个全天都在电脑上打字的人，我习惯了全尺寸的左
    Shift。事实证明，我评测的电脑配备了 ISO 键盘，这在欧洲很常见，但在美国并不常见。右撇子不会注意到区别，但对左撇子来说，ISO 键盘需要一些适应 [3]。过了一段时间后我习惯了，打字错误也少了。


    幸运的是，如果你在 Tuxedo 的在线商店购买新电脑，你可以选择 ANSI 或 ISO 键盘选项（图 3）。即使你是右撇子，你也可能需要花一点时间考虑你习惯的键盘布局并选择它，而不是盲目跟随默认设置。ISO
    键盘在欧洲和世界其他地方使用更频繁，因为它是国际标准，更适用于容纳其他语言。ANSI 是一个美国标准组织，ANSI 布局是专门为英语创建的。


