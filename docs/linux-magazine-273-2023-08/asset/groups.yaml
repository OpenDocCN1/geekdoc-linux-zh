    \            # PostgreSQL 密码\n    'HOST': 'localhost',                       \
    \  # 数据库服务器\n    'PORT': '',                                   # 数据库端口（留空则使用默认值）\n\
    \    'CONN_MAX_AGE': 300,                         # 数据库连接最大存活时间（秒）\n}\n```\n\n\
    注意：最后一个命令末尾的句点（.）是命令正常工作的必要条件。\n\n接下来，你需要创建 NetBox 用户并将安装目录的所有权更改为该用户：\n\n```bash\n\
    $ sudo adduser --system --group netbox\n$ sudo chown --recursive netbox /opt/netbox/netbox/media/\n\
    ```\n\n首先，我将使用 Cockpit [8] 在 Ubuntu 服务器上编辑 NetBox 配置文件（参见如下“配置编辑器”方框）：\n\n```bash\n\
    $ cd /opt/netbox/netbox/netbox/\n$ sudo cp configuration_example.py configuration.py\n\
    $ sudo nano configuration.py\n```\n\n### 配置编辑器\n\n我使用 Ubuntu Server 上的 Cockpit\
    \ 进行了本文的安装，因为（根据我的经验）它使管理变得非常容易。我安装了 45Drives 为 Cockpit 制作的插件 cockpit-navigator，它极大地提高了服务器运行的效率，尤其是当你需要编辑大量配置文件、从模板创建配置文件并定期执行其他常见配置操作时。如果你更喜欢使用\
    \ nano [10] 或 Vim [11] 等工具，也可以在 Cockpit 包含的终端中完成所有这些操作。\n\n![](img/740bd926461af28ed755753238e647a2_50_0.png)\n\
    \n**图 4：** 如果你更喜欢图形化编辑器，可以使用 Cockpit 中 45Drives 的 Navigator 编辑 configuration.py\
    \ 来配置 NetBox。\n\n### 列表 2：修改 Redis 参数\n\n```python\n01 REDIS = {\n02 \t'tasks'\
    \ : {\n03 \t\t'HOST': 'localhost',\t\t# Redis 服务器\n04 \t\t'PORT': 6379,\t\t\t\t\
    # Redis 端口\n05 \t\t'PASSWORD': '',\t\t# Redis 密码（可选）\n06 \t\t'DATABASE': 0,\t\t\
    \t# 数据库 ID\n07 \t\t'SSL': False,\t\t\t# 使用 SSL（缓存）\n08 \t},\n09 \t'caching' :\
    \ {\n10 \t\t'HOST': 'localhost',\n11 \t\t'PORT': 6379,\n12 \t\t'PASSWORD': '',\n\
    13 \t\t'DATABASE': 1,\t\t\t# 第二个数据库的唯一 ID\n14 \t\t'SSL': False,\n15 \t}\n16 }\n\
    ```\n\n如果你也在 Ubuntu 桌面上安装此软件，请使用：\n\n```bash\n$ sudo gedit configuration.py\n\
    ```\n\n对于 20.04 更新版本的 Ubuntu，请使用：\n\n```bash\n$ sudo gnome-text-editor configuration.py\n\
    ```\n\n然后你就可以直接在文本编辑器中编辑文件了。如果你不太熟悉在终端中使用 Vim 或 nano，这样可能会更容易。\n\n你需要修改配置文件中的四个键（图\
    \ 4）。首先，你将更改 ALLOWED_HOSTS 参数：\n\n```python\nALLOWED_HOSTS = ['netbox.example.com',\
    \ '192.168.2.13']\n```\n\n如果你不确定这里该填什么，请使用你的服务器 IP 地址，你可以通过在终端输入以下命令获取：\n\n```bash\n\
    $ ip addr\n```\n\n你也可以在终端输入 `$ hostname` 并将服务器的主机名放在这里，或者如果这样做有意义的话，两者都可以使用。我的安装在此处有四个条目，用逗号分隔。你稍后将在\
    \ Web 浏览器中输入此地址以访问 NetBox 网页 GUI。\n\n警告：请勿将此内容输入在 ALLOWED_HOSTS 参数正上方的示例 ALLOWED_HOSTS\
    \ 注释中。如果你遇到 400 bad request 错误，建议检查 ALLOWED_HOSTS 注释，看看是否不小心在那里输入了 IP 地址或主机名。\n\
    \n接下来，你需要如列表 1 所示修改数据库参数。\n\n然后，你需要如列表 2 所示修改 Redis 参数。\n\n最后，你需要修改 secret key\
    \ 参数。首先，你需要使用以下命令生成你的密钥：\n\n```bash\n$ python3 /opt/netbox/netbox/generate_secret_key.py\n\
    ```\n\n将生成的密钥复制并粘贴到 REDIS 参数下方的 SECRET_KEY 参数位置。如果你决定设置第二台 NetBox 服务器作为备份，你将使用此密钥，所以请记录下来以备将来参考。如果你忘记这样做，以后需要时随时可以回到\
    \ configuration.py 中找回密钥。\n\n现在你可以使用以下命令创建并编辑 local_requirements.txt 文件：\n\n```bash\n\
