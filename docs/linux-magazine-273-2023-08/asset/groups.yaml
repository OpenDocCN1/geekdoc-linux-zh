    \ == len(players)/2 {\n\t\tf(subset1, subset2)\n\t\treturn\n\t}\n\n\tif idx ==\
    \ len(players) {\n\t\treturn\n\t}\n\n\t_perm(players, idx+1, append(subset1, players[idx]),\
