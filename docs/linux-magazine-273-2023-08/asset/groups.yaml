    been a godsend in terms of information management. NetBox doesn''t require someone
    to have intimate knowledge of the systems or even be in the IT department. Searching
    and navigating NetBox is intuitive and simple for all levels of users.


    # ## Installation


    While you can find the commands for installing NetBox in the NetBox documentation,
    I will walk you through them here and add some of the caveats, quirks, and counsel
    that I pieced together when deploying and configuring my particular installation.


    I am running NetBox on a bare metal Ubuntu install [3] with a single solid-state
    drive (SSD) with the database being backed up daily to a network server using
    a cron job and a script lifted from the LVL1/Techs forum [4]. In addition, I recommend
    having at a minimum a backup machine on-site and another off-site, or better yet,
    a virtual machine (VM) running in the cloud for failover (setting up these backups
    is outside the scope of this article). I’ll assume that you have one machine to
    install NetBox and another for a backup (based on your organization’s typical
    operating procedures and standards).


    # ## PostgreSQL


    First, you need to install PostgreSQL [5] with the following commands:


    ![](img/740bd926461af28ed755753238e647a2_49_0.png)


    ```

    ```

    $ sudo apt update

    $ sudo apt install -y postgresql

    $ psql -U

    $ sudo -u

    ```

    ```


    The third command above verifies that you have at least version 11 of PostgreSQL
    installed. Once you''re in the PostgreSQL shell (the last command), run the following
    commands:


    ```

    ```

    $ CREATE DATABASE netbox;

    $ CREATE USER netbox WITH PASSWORD

    ''SuperSecurePasswordDifferentCopyPasteThis'';

    $ ALTER DATABASE netbox OWNER TO netbox;

    ```

    ```


    To leave the PostgreSQL shell, enter:


    ```

    ```

    $ \q

    ```

    ```


    To double-check that the installation was successful, enter:


    ```

    ```

    $ psql --username netbox --password --host localhost netbox

    ```

    ```


    You will then enter your SuperSecurePassword for the NetBox user password. Please
    do not use SuperSecurePassword for your password; it is neither super nor secure.
    Follow your own organization’s guidelines keeping in mind that, if implemented
    to its fullest extent, NetBox may well be the keys to your kingdom.


    Once you enter your password, you should see the following output:


    ```

    ```

    psql (14.8, OpenSSL 14.8-990

    Ubuntu 14.8-990, OpenSSL 1.1.1f)

    SSL connection (protocol: TLSv1.3, ciphler: TLS_AES_256_GCM_SHA384, bits: 256,
    compression: off)

    Type "help" for help.

    ```

    ```


    Now complete a connection info check with:


    ```

    ```

    netbox> \conninfo

    Success: You are connected to database netbox as user netbox on host localhost
    (address 127.0.0.1) at port 5432 with the SSL connection described above. You
    can now quit by entering:

    netbox> \q

    ```

    ```


    # ## Redis


    Your next installation step is to install Redis [6] using:


    ```

    ```

    $ sudo apt install -y redis-server

    ```

    ```


    You need to verify that you are now running at least version 4.0 of Redis with:


    ```

    ```

    $ redis-server -v

    ```

    ```


    The output you see should be something like this:'
  - "[PAGE 50]\n\n```\n```\nRedis server v=6.0.16 sha=00000000:0\nmemic=jemalloc-5.2.1\
    \ bits=64\nbuildId=828defb5a45b9b2a8d\n```\n```\n\nLastly, you need to verify\
    \ that the Redis service is working properly. Enter the following command:\n\n\
    ```\n`$ redis-cli ping`\n```\n\nwhich should result in PONG as the response.\n\
    \n# ## NetBox and Dependencies\n\nYou will need to also install the NetBox dependencies\
    \ (as shown in Figure 3) using:\n\n```\n```\n$ sudo apt install -y python3\npython3-pip\
    \ python3-venv python3-dev\nbuild-essential libxml2-dev\nlibxslt1-dev libffi-dev\
    \ libpq-dev\nlibsasl2-dev zlib1g-dev git\n```\n```\n\nDouble-check that you have\
    \ at least version 3.8 of Python [7] installed by running:\n\n```\n`$ python3\
    \ -V`\n```\n\nNow you need to create the installation directory and cd (change\
    \ directory) into it and download NetBox with:\n\n```\n```\n$ cd ~\n$ sudo mkdir\
    \ -p /opt/netbox/\n$ cd /opt/netbox/\n$ sudo git clone -b master --depth 1\nhttps://github.com/netbox-community/netbox.git\
    \ .\n```\n```\n\n# ## Configuration\n\nIf you read the NetBox documentation, you\
    \ will notice that my configuration instructions vary somewhat from the documentation.\
    \ The documentation does mention doing what I recommend, but it doesn't make it\
    \ obvious, so I will try to make these steps a bit easier to understand.\n\n#\
    \ ### Listing 1: Modifying Database Parameters\n\n```\n```\nDATABASE = {\n   \
    \ 'ENGINE': 'django.db.backends.postgresql',    # Database engine\n    'NAME':\
    \ 'netbox',                            # Database name\n    'USER': 'netbox',\
    \                            # PostgreSQL username\n    'PASSWORD': 'SuperSecurePassword',\
    \            # PostgreSQL password\n    'HOST': 'localhost',                 \
    \        # Database server\n    'PORT': '',                                  \
    \ # Database port (leave blank for default)\n    'CONN_MAX_AGE': 300,        \
    \                 # Max database connection age (seconds)\n}\n```\n```\n\nNote:\
    \ The period (.) at the end of the last command is required for the command to\
    \ work properly.\n\nNext you need to create the NetBox user and change ownership\
    \ of the installation directory to that user with:\n\n```\n```\n$ sudo adduser\
    \ --system --group netbox\n$ sudo chown --recursive netbox\n/opt/netbox/netbox/media/\n\
    ```\n```\n\nFirst, I'll edit the NetBox configuration file using Cockpit [8] on\
    \ Ubuntu Server (see the \"Config Editors\" box as follows:\n\n```\n```\n$ cd\
    \ /opt/netbox/netbox/netbox/\n$ sudo cp configuration_example.py configuration.py\n\
    $ sudo nano configuration.py\n```\n```\n\n# ### Config Editors\n\nI did the install\
    \ for this article using Cockpit on Ubuntu Server because (in my experience) it\
    \ makes administration very easy. I installed a 45Drives add-on for Cockpit called\
    \ cockpit-navigator, which greatly improves running servers in general, especially\
    \ if you need to edit lots of config files and create configs from templates and\
    \ perform other common configuration actions regularly. You can also do all this\
    \ in the terminal (which Cockpit also includes) if you prefer to use something\
    \ like nano [10] or Vim [11].\n\n![](img/740bd926461af28ed755753238e647a2_50_0.png)\n\
    \n**Figure 4:** You can edit configuration.py with Navigator from 45Drives in\
    \ Cockpit to set up NetBox if you prefer a graphical editor."
  - "[PAGE 51]\n\n# **Listing 2: Modifying Redis Parameters**\n\n```\n01 REDIS = {\n\
    02 \t'tasks' : {\n03 \t\t'HOST': 'localhost',\t\t# Redis server\n04 \t\t'PORT':\
    \ 6379,\t\t\t\t# Redis port\n05 \t\t'PASSWORD': '',\t\t# Redis password (optional)\n\
    06 \t\t'DATABASE': 0,\t\t\t# Database ID\n07 \t\t'SSL': False,\t\t\t# Use SSL\
    \ (cahining)\n08 \t},\n09 \t'caching' : {\n10 \t\t'HOST': 'localhost',\n11 \t\t\
    'PORT': 6379,\n12 \t\t'PASSWORD': '',\n13 \t\t'DATABASE': 1,\t\t\t# Unique ID\
    \ for second database\n14 \t\t'SSL': False,\n15 \t}\n16 }\n```\n\nIf you are also\
    \ installing this on Ubuntu Desktop, use:\n\n```\n$ sudo gedit configuration.py\n\
    ```\n\nFor versions of Ubuntu newer than 20.04, use:\n\n```\n$ sudo gnome-text-editor\
    \ configuration.py\n```\n\nYou will then be able to edit the file directly in\
    \ a text editor. This might be easier if you are less familiar with using Vim\
    \ or nano from the terminal.\n\nYou will need to modify four keys in the config\
    \ file (Figure 4). First, you will change the ALLOWED_HOSTS parameter:\n\n```\n\
    ALLOWED_HOSTS = ['netbox.example.com',\n '192.168.2.13']\n```\n\nIf you unsure\
    \ about what to enter here, use your server’s IP address, which you can get by\
    \ typing\n\n```\n$ ip addr\n```\n\ness into the terminal. You can also type `$`\
    \ hostname into the terminal and put your server’s hostname here as well, or you\
    \ can use both if that makes sense. My installation has four entries here, separated\
    \ by commas. You will enter this in a web browser later to get to the NetBox web\
    \ GUI.\n\nWarning: Do not type this in the example ALLOWED_HOSTS comment directly\
    \ above the ALLOWED_HOSTS parameter. If you get a 400 bad request error, I suggest\
    \ checking the ALLOWED_HOSTS comment to see if you accidentally entered your IP\
    \ address or hostname there.\n\nNext you need to modify the database parameters\
    \ as shown in Listing 1.\n\nYou then need to modify the Redis parameters as shown\
    \ in Listing 2.\n\nFinally, you will need to modify the secret key parameter.\
    \ First, you need to generate your secret key with:\n\n```\n$ python3 /opt/netbox/netbox/\n\
    \tgenerate_secret_key.py\n```\n\nCopy and paste the generated key into the SECRET_KEY\
    \ parameter space below the REDIS parameter. You will use this key if you decide\
    \ to set up a second NetBox server for backup, so jot it down for future reference.\
    \ If you forget to do this, you can always get back into configuration.py to retrieve\
    \ the secret key if needed later.\n\nNow you can create and edit the local_requirements.txt\
    \ file with:\n\n```\n$ cd /opt/netbox/\n$ sudo nano local_requirements.txt\n```\n\
    \nIf you intend to use a remote database as mentioned in the online documentation,\
    \ you will want to enter djangostorages [12] here. What is not clear in the documentation\
    \ is that you also need to enter any other plugins that you intend to use in the\
    \ local_requirements.txt file in /opt/netbox. (For a list of NetBox plugins, see\
    \ the NetBox Community Plugins GitHub page [13].) In addition, the plugins need\
    \ to be listed in the previously modified configuration.py file in /opt/netbox/netbox/netbox.\n\
    \nIn local_requirements.txt, simply enter each desired plugin (Figure 5), one\
    \ per line, as follows:\n\n+   djangostorages\n+   netbox-topology-views\n+  \
    \ netbox-inventory\n+   netbox-rqcode\n\nIn local_requirements.txt, note that\
    \ the plugins use dashes (-). When you edit the configuration.py file, you will\
    \ change some of the dashes to underscores (_). I found this super frustrating\
    \ and inconsistent because it is not always dashes in one place and underscores\
    \ in the another, but it is often different between the two. (If you build plugins\
    \ for NetBox and can avoid this, please consider making your plugin names one\
    \ word to avoid this issue.)\n\nNow that you have edited and saved the local_requirements.txt\
    \ file to include your desired plugins, you also need to enable them by once again\
    \ modifying the configuration.py file. You can open configuration.py with:\n\n\
    ```\n$ cd /opt/netbox/netbox/netbox/\n$ sudo nano configuration.py\n```\n\nLook\
    \ for the PLUGINS parameter and, depending on the plugin, you may also need to\
    \ change PLUGINS_CONFIG as well. Based on the plugins I added to my local_requirements.txt\
    \ file, my PLUGINS section should look like this:\n\n![](img/740bd926461af28ed755753238e647a2_51_0.png)"
