    of available players and then calls itself twice with two new tryout teams. In
    one call, it appends the current element referenced by `idx` to `subset1`, while
    it appends it to `subset2` in the following call (lines 17 and 18).


    This recursively creates all possible constellations and reliably divides the
    array elements into two subgroups. However, the function does not pay attention
    to whether the teams actually contain all the players required to create a team.
    In fact, it even leaves the subsets empty in parts (Figure 4). That’s not a deal-breaker.
