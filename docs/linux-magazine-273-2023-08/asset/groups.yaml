  mdcn: "\n\n## 收集积分\n\n图 1 中的 YAML 文件显示了各名球员的评级。为了便于说明，该模型将总人数限制在六名球员。players 条目中的每一项通过姓名标识一名球员，并规定其在三个类别中的评级，数值范围为\
