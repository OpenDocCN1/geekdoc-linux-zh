  - "[PAGE 52]\n\n```\n```\nPLUGINS = [\n    'netbox_inventory',\n    'netbox_grocode',\n\
    \    'netbox_topology_views'\n]```\n```\n\nI will use a configuration that is\
    \ similar to the default suggested plugin configuration as shown in Listing 3.\n\
    \nI tend to switch things up between using nano in the terminal and using Navigator\
    \ from 45Drives to modify files, but you can also use gedit [14] (or Gnome Text\
    \ Editor [15]) if using Ubuntu Desktop to modify the configu-ration.py file and\
    \ to create and populate the local_requirements.txt file. I prefer troubleshooting\
    \ configs with a graphical editor to remebering the quit and save commands in\
    \ a terminal text editor. It is all the same to NetBox in the end, so use whichever\
    \ is easiest for you.\n\nI strongly recommend setting the always_save_coordinates\
    \ to False because they ended up causing me quite a bit of grief. It appears that\
    \ what happens is that they will set a custom field for each device. The problem\
