    \ tidy\n$ go build randcom.go teams.go data.go\n```\n\n## Systematic Approach\n\
    \nUnfortunately, this algorithm comes up short. As Figure 5 shows, the random\
    \ number generator assigned the only two players with goalkeeping skills to the\
    \ same team, even though each team needs at least one goalkeeper. The offensive\
    \ and defensive capabilities are also unbalanced. For this reason, the next stage\
    \ in the algorithm design needs to assign the players to two equal teams based\
    \ on their individual strengths.\n\nAs I mentioned earlier, due to the small event\
    \ space, it is easy to work through all of the options, determining and comparing\
    \ the suitability of the individual solutions. For this purpose, Listing 6 provides\
    \ a suitability function diff() that rates the fairness of the assignments in\
    \ the two teams, teamA and teamB. If the integer result is close to zero, the\
    \ match is balanced; the larger its value, the more unfair the match is likely\
    \ to be.\n\nTo determine the score, the function adds the absolute differences\
    \ of the teams in terms of offense, defense, and goal-keeping capability. It weights\
    \ the offensive skills with a factor of 2 and applies a factor of 10 to the goalkeeper;\
    \ after all, if you don't have a goalkeeper, you've already lost the match.\n\n\
    ### Listing 6: diff.go\n\n```go\npackage main\n\nfunc diff(teamA []Player, teamB\
    \ []Player) int {\n\td := Skills{}\n\n\tfor idx, player := range teamA {\n\t\t\
    s1 := player.Skills\n\t\ts2 := teamB[idx].Skills\n\n\t\td.Offense += s1.Offense\
    \ - s2.Offense\n\t\td.Defense += s1.Defense - s2.Defense\n\t\td.Goalie += s1.Goalie\
    \ - s2.Goalie\n\t}\n\n\treturn 2 * abs(d.Offense) +\n\t\tabs(d.Defense) +\n\t\t\
    10 * abs(d.Goalie)\n}\n\nfunc abs(x int) int {\n\tif x < 0 {\n\t\treturn -x\n\t\
    }\n\treturn x\n}\n```\n\n## Quirky Go\n\nYou'd think that a programming language\
    \ would inherently provide a function for determining the absolute value of an\
