    # # cron User Configuration


    Users view and configure cron settings with the crontab command. The command for
    viewing a crontab file is -l. The recommended procedure for changing a crontab
    file is as follows:


    +   1. cd to a directory readable (or searchable) **only** by the userid (this
    is because the text file generated in the next step might be readable by other
    users).


    +   2. Enter the command `crontab -i mycronfile`. This causes the user''s crontab
    file to be written to the mycronfile.


    +   3. Edit the mycronfile. Make all desired changes.


    +   4. Enter the command `crontab mycronfile`. This causes the cron daemon to
    copy mycronfile to the actual location using *cron*. The cron daemon also reloads
    the user''s new crontab file, introducing it into its run schedule any changes
    made to his or her *crontab file*. *cron* performs syntax checking on the *crontab*
    itself, but does not verify the existence or syntax of the command.


    +   5. Enter the command `crontab -l`, in order to verify that the intended changes
    were made (refer to the second principle in chapter 2).


    Note


