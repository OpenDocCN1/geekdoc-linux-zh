    # Block Unwanted Queries with Allow-Query Function


    Sites using BIND Version 8.1 or newer] can use a new security feature in the named.conf
    file called the allow-query function. This feature allows the UNIX administrator
    to specify which clients query a nameserver. One practical use for this feature
    is to permit only inside systems to query a DNS server for inside DNS information.
    An example.boot file fragments:


    > [1] Refer to the section on how to know your BIND version later in this chapter
    for more information on determining version of BIND is running.


    ```

    ...

    options {

    allow-query { 128.126.120/24; 128.126.130/24 };

    };

    ...

    ```


    In this example, the nameserver will accept queries only from systems on the 128.126.120.*
    and 128.126.130.* networks.

    In BIND Version 8.1 and later, the allow-query function can also be enforced at
    the zone level. An example file fragment:


    ```

    zone "lab.sun.com" {

    type primary;

    file "db.lab.sun.com";nallow-query { 124.30/16 };

    };

    ```


    In this example, only systems on the 124.30.*.* network may query this nameserver
    for information about the domain lab.sun.com.


    # Note


    Despite the potential that the allow-query function affords (permitting domain
    queries only from certain networks), a firewall or filtering router should be
    used to prevent DNS queries from the Internet from reaching interior DNS servers.
    This is an example of protecting in layers (see chapter 2).'
