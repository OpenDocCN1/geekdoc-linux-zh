    # Auditing Tools


    There are some public-domain auditing tools available that will help determine
    what security issues may exist on a UNIX system.


    # COPS


    COPS is an auditing tool used to recover back doors that a user may use as an
    unauthorized means for gaining root privileges. COPS is discussed in detail in
    chapter 4.


    # Crack


    Crack is a tool used to guess passwords on a UNIX system. Crack runs a dictionary
    attack (so named because Crack uses a common word dictionary as its source of
    passwords) on UNIX accounts.

    A UNIX administrator should periodically run Crack to discover which accounts
    have passwords that can be easily guessed (such as common words or names). A UNIX
    administrator would notify users owning accounts by telling them out (not so easily).

    Rather guess passwords by trying to log in, Crack runs the crypt(3C) function
    and compares the result against the encrypted password string from /etc/shadow.
    If result matches the password string in /etc/shadow, the password is cracked.

    This is the primary reason why password strings were moved from /etc/passwd (the
    globally readable file) to /etc/shadow (readable only by user root)—to hide these
    encrypted password strings that could otherwise be cracked. The UNIX administrator
    can easily run Crack because he has access to the /etc/shadow file.

    Crack can be downloaded from ftp://coast.cs.purdue.edu/pub/tools/unix/crack/.


