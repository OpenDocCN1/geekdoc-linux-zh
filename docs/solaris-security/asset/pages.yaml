- img_proc: true
  md: 'Chapter 16 will expose the UNIX administrator to the thoughts and processes
    required to mitigate the effects of a man-made or natural disaster and restore
    system operations.


    While one could argue that disaster recovery and security are unrelated topics
    that cannot be discussed together, it can also be argued that security can be
    defined as doing anything anything to ensure the continuity of business operations.
    The ideas presented in the following chapter are offered in light of the book''s
    intended audience—UNIX administrators, security specialists, and their managers—they
    have to effect change in this area.


    Part IV Disaster and Recovery


    Chapter 16: System Recovery Preparation


    # Chapter 16. System Recovery Preparation


    The best-laid plans for success have little business value if there are no corresponding
    plans for what to do and when the unthinkable occurs.

    Disaster need not take the form of a disgruntled employee or a hacker. A flood,
    hurricane, tornado, extended power outage, and other events outside of our control
    have as much potential for disrupting computer and business operations. While
    it may not be practical to prepare for these kinds of disasters by ensuring they
    have zero impact on the business, it is exceedingly practical to prepare for how
    to pick up the pieces and continue when a disaster occurs.


    **What''s in this chapter**


    +   - What can go wrong with a system

    - How to prepare in advance for an effective system recovery


    **Why this is important**

    Failures will occur, and recoveries will need to be done. Recovery preparedness
    is the single most important factor in recovery success!


    # What Can and Will Go Wrong


    Natural Disaster


    Earthquakes, hurricanes, floods, wind, ice storms, snow, and rain can literally
    spell disaster for a business by directly damaging company facilities and assets
    or by disrupting transportation, communications, or public utilities that enable
    the company to continue business.


    Man-Made Disaster


    Sudden business failure of a key supplier, union strikes, terrorism, and war can
    threaten a company''s survival by hindering its ability to continue business.


    Inside Utility Failure


    Electric power and air conditioning are the environmental utilities that support
    a data center or server. Interruption of either of these inside utilities threatens
    the continued operation of company servers. An uninterruptible power supply (UPS)
    can—at a minimum—soften the impact of a power failure by giving UNIX system administrators
    an opportunity to cleanly shut down servers.\ However, if a data center''s computers
    are protected with a UPS, the air conditioning also needs to be on UPS (a generator).
    Otherwise, the computers will continue running in a data center with no air conditioning,
    leading to more problems.'
