    R$<%@y.LOCAL>$* @@ether @@$2 $:1<@2>$$3 user@host.com

    R$<%@y>$* @@ether @@$2 $:1<@2>$$3 user@etherhost

    R$<%@x>$* @@ether @@$ $:1<@2>$$3 user@etherhost

