    # # Managing C2 Security


    Sites have implemented C2 security have done for a variety of reasons, but the
    common theme is the ability to account for all system changes. Regards of this,
    the essential issues with C2 security are


    +   - Configuration of C2 audit capture

    - Management of C2 logs

    - Management of system performance with C2 security turned on

    - Audit events'
