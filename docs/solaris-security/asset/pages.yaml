    # Unsecure PATH Elements in Scripts Launched by cron


    The PATH statement (whether set in /etc/default/cron or the launched program itself)
    should contain no unsecure directories. For example, PATH in a cron-launched shell
    script for root is set to /usr/bin. A hacker knowing this could create executable
    programs in the /tmp directory that were the same name as commands used in the
    cron-launched shell script. Then, when the shell script ran a particular command,
    the hacker''s copy in /tmp would be run (as) instead of the correct version in
    /usr/bin.


    If PATH were set to /usr/bin:/tmp, a hacker could still have some fun. The intended
    command used by cron -launched shell script could be removed from /usr/bin (only
    if there was already a security problem with permissions incorrectly set in /usr/bin);
    this would cause the script to run the hacker''s version in /tmp.


    # Indeterminate PATH Elements in Scripts Launched by cron


    The PATH statement should contain no indeterminate directories. PATH should not
    contain any "-" or "-" entries, which could be unsecure (readable or—write—writable
    by others). "-" or "-" in PATH open the door to Trojan horse attacks. [1]


    > [1] Refer to the Glossary for a definition of Trojan horse.


    # Use of stdin and stdout in cron and at Jobs


    Since there is no user terminal or terminal session associated with a cron or
    at jobs, stdin and stdout must be restricted. Specifically, any command in a cron
    job reading stdin will get an immediate end-of-file (as though the user, if the
    command was running from a terminal, pressed Ctrl-D). Any command in a cron writing
    to stdout will have its output sent to the owner of the cron job in a mail message.
    This may or not be the desired result.


