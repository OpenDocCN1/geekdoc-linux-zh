  md: 'The days of blindly trusting the integrity of public-domain software—even on
    well-known sites—are over. A popular public security package (used throughout
    this book) was compromised by a hacker and subsequently downloaded by unsuspecting
    administrators before its back door was discovered and the package repaired. This
    appendix provides information needed to raise your confidence in your ability
    to verify the integrity of public-domain software.


    # Note


    This procedure verifies only the archive site''s software package integrity—that
    it has not been tampered with since its last release. It does not ensure anything
    about its behavior while running on a system. In other words, if the software
    obtained is the genuine article with regard to its digital signature, that does
    not mean that the software will work properly.


    # Verification PGP


    PGP is a frequently used tool for the verification of digital signatures and,
    hence, the integrity of software packages. PGP is available from


    +   - http://www.mit.edu/network/pgp.html (only for U.S. citizens in the United
    States or Canadian citizens in Canada)

    - ftp://ftp.pgp.net/pub/pgp/


    The process of verifying the integrity of a package is shown here by way of example:
    we obtain the software package rpcbind from ftp.porcupine.org and copy two copies
    from the site:


    +   - rpcbind_2.1.tar.gz—the software package archive

    - rpcbind_2.1.tar.sig—the software package archive digital signature


    While the manager''s public PGP key is on FTP or Web (the site tietse.pgp), it
    is important to obtain the public key by some other means. In this example, the
    manager''s key is available from CERT advisory CA-99-010 Trojan Trojan Wrappers
    (see the URL at the end of this appendix), or from MIT''s public PGP key server
    at http://pgp5.ai.mit.edu/pks-commands.html# extract, or from his Web site at
    http://www.porcupine.org/wiet/


    # Note


    Obtaining and trusting a PGP key obtained from the same site as a software package
    is ill-advised. This is because an intruder who compromises a site will be able
    to create a public key that will "validate" any compromised software.


    Indeed, any public key associated with a site should be obtained independently
    or verified by other means, such as a direct phone call to the owner of the public
    key.


    The following example assumes that PGP has been obtained and installed on the
    system.


    +   1. Import originator''s PGP key to your keyring.

    2.

    3. % pgp -ka tietse.pgp

    4. ViaCrypt PGP 2.7.1 - Pretty Good Privacy for everyone.

