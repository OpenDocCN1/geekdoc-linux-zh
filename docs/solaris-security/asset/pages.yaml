    # The Root Account


    The user root is the ultimate prize to computer hackers. This, used by UNIX system
    administrators, has unlimited access to virtually all programs, files, and resources
    a computer has to offer. If a hacker can change his identity from a normal user
    to any other user, root is frequently the account of choice because of its unrestricted
    access.


    The root user is the ultimate prize to computer hackers. This account, with unlimited
    access to virtually all programs, files, and resources a computer has to offer.
    If a hacker can change his identity from a normal user to any other user, root
    is frequently the account of choice because of its unrestricted access.


    The root account is omnipotent not because of its name, but because of its userid,
    0. The first line from the /etc/passwd file is shown in Figure 5.1 to illustrate.


    Figure 5.1 Root User Is 0


    ```

    root:x:0:0:Super:::/bin/sh

    user id 0 makes root "root"

    name "doesn''t matter

    ```


    Other accounts can be created with a userid of 0; those others have all the power
    and privilege that root has. Further, the root''s account name can be changed,
    as long as the user number is 0, it is still root.


    # Other Administrative Accounts and Groups


    Several administrative accounts exist on Solaris systems. While these accounts
    do not have root privileges, they should be protected though they did. System
    processes using these accounts control basic system functions such as electronic
    mail, relational database access, and printing. A compromise of any of these accounts
    can result in wholesale exposure and damage to files in their respective subsystem.
    For example, in the lp account can result in an intruder''s having complete control
    over the printing subsystem, and hence, the hacker may be able to alter the contents
    of any printout.


    # Which Administrative Accounts Should Be Locked


    Several administrative accounts should be locked so that no one can log in and
    cause trouble. These accounts include daemon, bin, sys, adm, lp, uocp, nuucp,
    list, nobody, and noaccess. The procedure for locking an account is explained
    in the shadow file section in this chapter.


    # Sysadmin Group


    Such vulnerabilities are not limited to user accounts; the sysadmin group (group
    14) must be similarly protected because members of this group can perform administration
    tasks with Admintool.


    # Sys Group


    The sys group (group 3) must be similarly protected, as it is allowed to run the
    fsdump command. fsdump is the system backup program; it is possible, then, for
    a nonroot to read every file on a system and be able to restore any or all of
    these on a system where the user had root privileges. Such a user, for example,
    be able to read the /etc/shadow and crack account passwords (etc/shadow) is discussed
    later in the shadow file section; cracking account passwords is discussed in the
    section on the Crack tool near the end of the chapter.'
