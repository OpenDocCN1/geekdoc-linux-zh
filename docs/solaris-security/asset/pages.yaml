    5.


    Finally, most automounters are really underlying NFS problems. If filesystems
    are mounted with NFS, then any problem experienced is probably with the automounter
    itself. Conversely, if filesystems *cannot* be mounted manually with NFS, then
    NFS is the source of any problem.


    # Indirect Automounter Maps


    Indirect automounters are usually used for directories such as home directories
    or tools. Indirect maps include about a parent directory, as well as its subdirectories.
    Here is an example of indirect automounter maps; the file `/etc/auto_master` (or
    NIS/NIS+ `auto_master` map) would contain the following:


    ```

    /home               auto_home

    ```


    The NIS/NIS+ `auto_home` referenced would contain the following entries:


    ```

    bob               orcas:/export/bob

    phil             cypress:/export/home/phil

    susan           sanjuan:/export/home/susan

    ```


    `auto_master` and `auto_home` maps together define a collection of directories
    under `/home` (such as `/home/bob`, `/home/phil`, and `/home/susan`). These directories
    are mounted only when referenced (such as the `cd` or `ls` command) and are disconnected
    after a short period of not being used.


    To continue this, if the host (which serves up bob/home directory / export/home/bob)
    should fail or become unreachable, then any read or write attempts to `/home/bob`
    will hang, the automounter will continue running. If bob''s home directory is
    not accessed, the failure of the NFS server serving his home directory will not
    even be noticed by the automounter client.


    # Direct Automounter Maps


    Direct automounters are typically used for directories such as `/var/mail`, `/usr/man`,
    or `/usr/local`. This is an example of direct automounter maps.


    ```

    /usr/man         beatle:/usr/share/man

    /var/mail       mailsrv:/var/mail

    ```


    Direct automounter maps are decidedly less secure than indirect maps. If an NFS
    server crashes or becomes unreachable, all clients referencing that server via
    direct automounter maps will hang until the NFS server is available again. This
    is true


    +   - Regardless of client-side or server-side NFS mount options (such as hard
    or soft)

    - Even the automounter is not attempting I/O to the mounted filesystem


    For these reasons, direct maps should be changed to indirect maps; the procedure
    for doing is


    +   1. Create a new `auto_master` entry called `indirect`.'
