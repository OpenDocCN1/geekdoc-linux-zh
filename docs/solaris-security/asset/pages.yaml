    # # X-Windows Security


    One of the greatest security risks is a system will fail when a user walks away
    from a logged-in session. While it may be reasonable to require that users on
    a "character" terminal or console log off if they leave their systems unattended,
    X-Windows users will shriek if required to log off. Their arguments are valid;
    it can take a while to set up all of their X-Window programs, windows, and sessions;
    furthermore, they may be running processes that take a long time (longer than
    the interval between bathroom breaks) to complete.


