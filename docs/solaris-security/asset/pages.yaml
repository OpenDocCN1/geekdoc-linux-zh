    # Physical Security Considerations


    In keeping with the concept of protecting in layers discussed in chapter 2, I
    have several recommendations regarding physical security of data centers. None
    of these precautions prevent a determined intruder from accessing or destroying
    computer equipment, but they will slow them down. The following sections discuss
    several physical security issues.


    # Theft and Access Prevention


    Physically fasten all systems and peripherals to equipment racks utilizing the
    locking tabs. Utilize a physical access mechanism that records who enters the
    data center at what time. This raises the degree of accountability regarding physical
    access to data centers by making everyone aware that entrances to the data centers
    are controlled and registered.


    # Audit PROMs


    Periodically audit every system''s PROM to ensure that it has not been replaced.
    This could easily be done by recording all system hosts and comparing them later
    to what was recorded earlier. Do not think that this is not a security check.
    An intruder could—given motive, means, and opportunity—physically break into a
    system, swap a system''s PROM for another with different security and boot settings
    with the same host. So, and in itself, auditing hosts does not conclusively prove
    that tampering has occurred.


    # OpenBoot Passwords


    Password protect OpenBoot on all data center (plus desktop and lab) systems, whether
    they are in a locked room or not. Assign a different password to each system''s
    OpenBoot, using a nonpredictable password scheme.


    Configure automatic, password-protected screen locks. Lock all when you are leaving
    the room. Chapter 5 will cover procedures for setting up auto screen locks. The
    password used to unlock the lock is the login password. To lock the lock, click
    on the padlock on the front panel.


    # Note


    Auto screen locking in the common desktop environment (CDE) works only in Solaris
    version 2.6 and newer (CDE version 1.2).


    # CD-ROM Drives'
