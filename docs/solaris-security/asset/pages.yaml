    # DNS Security Weaknesses and Solutions


    # Too Much Information Visible to the Internet


    Generally speaking, all of the machine names and their respective IP addresses
    in an organization can be easily queried by anyone on the Internet. Even if an
    effective, properly configured firewall is in place, the ability to view names
    and IP addresses of servers and workstations is enough to make more than a few
    administrators nervous. Consider, if DNS entries for machine names such as billing,
    fin-server, or gl-master would be like publishing the plans for a secret submarine
    base outside of gates! Publishing the names and addresses of important systems
    and devices poses a security threat because it defines named targets for intruders
    to try to attack. A DNS architecture split-horizon DNS avoids this concern.


    # Split-Horizon DNS


    A split-horizon DNS architecture is one in which publicly reachable systems and
    network elements are defined in the publicly reachable DNS domain, while the internal
    infrastructure of the same organization is defined in an isolated, unreachable
    DNS domain. Figure 14.2 illustrates this architecture.'
