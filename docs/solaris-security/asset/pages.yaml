    **Why this is important**

    UNIX systems record security (and other) events in system logs. UNIX system administrators
    need to know how these logging mechanisms function so that they can be understood
    and modified as needed.


    # What Is a System Log


    A system log is a recording of certain events. The kind of events found in a system
    log is determined by the nature of the particular log and any configurations used
    to control those events that are logged. System logs are usually human-readable
    text files containing a timestamp and other information specific to the message
    or subsystem.


