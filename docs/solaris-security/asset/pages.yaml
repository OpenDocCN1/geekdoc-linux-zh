  md: 'OpenBoot is activated as soon as a SPARC system is turned on. Depending on
    the configuration settings, the system will either be booted from a local disk
    (hard disk or CD-ROM) or over the network, or the system will display an OpenBoot
    prompt and await further instructions. Most systems (and every system''s factory-installed
    default) will automatically boot from an internal hard disk and not stop or display
    the OpenBoot prompt at all.


    In addition to boot, OpenBoot can also be accessed while the system is running
    Stop-A on the system keyboard (a system where a Sun keyboard is attached to the
    keyboard port); by sending a break code or power cycling the console terminal
    (on a system where a terminal is attached to the console serial port); by halting
    the system; or by sending the eeprom command.


    # Warning


    Administrators must be careful whenever doing a Stop-A on a running system. Stop-A
    stops the system. Integrity of the system''s data is at risk, not to mention availability
    of its services.


    # Why Users Must Be Kept Out of OpenBoot


    There are two reasons why no end user should ever have access to OpenBoot:


    +   1. A clever user with access to OpenBoot can boot the system from almost any
    SCSI device (external hard disk or CD-ROM). A user who can boot a system from
    his own media can take complete control over system; you might as well give the
    user root password.

    2. A user who can Stop-A a system can change any of dozens of OpenBoot environment
    variables, giving the most UNIX administrator a long-term headache.


    # Protecting OpenBoot by Setting Security Parameters


    This section describes the procedure used to protect a system''s OpenBoot. I recommend
    that all center systems and end-user systems be protected. There are three levels
    of security in OpenBoot: none, command, and full. Sun systems are shipped with
    the OpenBoot security level set to none. The three levels are explained in Table
    3-1.


    | Mode | Available Commands |

    |---|---|n| none | No password required. OpenBoot settings can be changed (the
    disk partition from which the system is booted) and any OpenBoot command executed.
    With physical access to the system has full control over it |

    | command | All commands except for boot and go require the system. The system
    may be booted from the default boot device. The go command (continuing system
    operation after pressing Stop-A or sending the break sequence) is also allowed.
    The user must enter the OpenBoot password for all other commands |

    | full | All OpenBoot commands except go (continuing system operation after pressing
    Stop-A or sending the break sequence) require the OpenBoot password |'
