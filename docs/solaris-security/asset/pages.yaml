- img_proc: true
  md: '+   * Audit trail analysis

    * Management of removable media

    * Device allocation


    Each of these is discussed in the following sections.


    #  Configuration of C2 Audit Capture


    The configuration files /etc/security/audit_class, /etc/security/audit_event,
    and /etc/security/audit_control, along with the auditfig command, determine what
    events are recorded and in which directory they are stored.


    #  Management of C2 Logs


    This is primarily a matter of managing the space that C2 consumes. Every site''s
    auditing and C2 log space consumption rates are different. Depending upon the
    logging granularity—as well as the storage capacity of the C2 itself—finding space
    for managing the C2 logs will be insignificant, nightmare, or somewhere in between.


    #  Management of Performance


    C2 may break the back of a system that is already near the edge with performance.
    The extra I/O related to writing C2 logs may turn a sluggish system into an excruciatingly
    slow system. This matter requires expertise in system performance and tuning in
    order to determine the cause of any problems exacerbated by C2 logging.


    #  Audit Events


    On a system with C2 auditing turned on, certain events require immediate attention.
    The audit system will launch the audit_warn script when disk space runs low or
    other malfunctions occur. Audit_warn sends e-mail to the alias audit_warn, and
    it also writes a message to the system console.


    #  Audit Trail Analysis


    The auditreduce and audit tools form the core of audit trail analysis. auditreduce
    is used to extract and filter audit trail for specific reports, and audit makes
    reports that are not human readable. The Basic Security Module Guide includes
    several examples of shell scripts used to further process auditreduce and audit
    output.


    #  Removable Media Management


    When C2 is turned on, Volume Manager is disabled; disettes and CD-ROM disks are
    not automatically mounted. This can be a problem on a system where frequent disks
    and/or CD-ROM access is needed by an end user. But then, the functions requiring
    C2 security should probably reside on a separate system from that of an end user
    to mount and unmount CDs and diskettes.


    +   * Perman mount the boot device and allocate the device to a specific user
    (see the next section on device allocation).

    * Copy the contents of the diskette or CD to a fixed hard disk.

    * Redesign the application requiring both C2 and mountable diskettes or CDs.


    #  Device Allocation'
