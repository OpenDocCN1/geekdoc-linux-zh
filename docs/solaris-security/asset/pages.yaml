    # Causes of Security Weaknesses


    # Growth of Network Connectivity


    The primary scenarios of security as the one described in the previous section
    is (and NT systems, VAX systems, AS/400 systems, and all the rest) are being connected
    to small and large networks—including the Internet—without adequate consideration
    for security risks. Networks that were restricted to closed buildings or campuses
    are connected to each other (the Internet in order to facilitate must-have functions
    without regard to the risks of doing so). Security has de-facto an afterthought
    (if considered at all) though relegated to the chain of command in information
    technology (IT) organizations, and those organizations have paid the price for
    their ignorance.


    In the 1980s, companies built Ethernet and Token Ring LANs and connected all of
    their computers to them. These LANs were isolated islands that did not need security
    beyond outside control.

    Many organizations had guest accounts without passwords, and as easily secured
    administrative passwords, and they never removed or locked the accounts of departing
    employees (who the security guards at the front door prevent former employees
    from reentering the building); this effectively prevented them from accessing
    the network. The organization facilitated functions such as data transfer between
    desktop systems and mainframes, and print services for desktop systems, and electronic
    mail.


    By the 1990s, companies began to see the advantages of connecting their LANs to
    each other, to their business partners'' LANs, and finally, to the Internet itself.
    Interastrous functions expanded to include interbusiness functions.

    The explosive popularity of the World Wide Web (WWW) in the mid-1990s resulted
    in a vast increase in the number of businesses connecting their LANs to the Internet.

    In most cases, businesses were connecting their servers and workstations to LANs
    and their LANs to wide area networks (WANs), business partners, and the Internet
    without serious thought to the security of their systems. Long-dependent islands
    that lacked outside control were still there.


    The Incident-Computer Emergency Response Team (CERT) reported that security at
    the system level was generally inadequate. With the Worm we gave to the Carnegie
    Mellon Emergency Response Team (CERT) and increased security awareness among vendor
    systems and administrators, the state of security and preparedness was still behind
    the talent and determination of today''s amateur and professional hackers. Security
    was not a prime concern in the era when UNIX was developed; its security model
    was designed for small-medium workgroups in an intranet environment. Frankly,
    there exist many OEM add-on security features and third-party products to provide
    adequate protection to UNIX systems that are exposed to additional risks.


    # Software Vulnerabilities


    System and application software not originally intended to understand Internet
    attack are now exposed to the Internet. Client/server applications designed for
    intranet security have now been connected to the Internet and now are exposed.
    This is true even in situations where servers are protected by firewalls and other
    methods. No matter how secure an application may be, that application, the tools
    used to develop and run it, the components protecting it have weaknesses.'
