    # Permissions: Numeric Form


    We have seen thus far file and directory permissions in symbolic form. That is,
    the position-rwxrwxrxr notation of what has permissions. There is also a numeric
    form that is a bit more shorthand than symbolic permissions.

    It is not only useful but essential that the UNIX administrator understand the
    numeric form of file and directories. This is because some notations or commands
    (primarily umask, which is discussed later in this chapter) use the numeric form
    of permissions. It is therefore important that the UNIX administrator understands
    both numeric and symbolic permissions. Numeric employs allows permissions for
    read/write/execute for user/group/other, plus sticky bit, SetUID, and SetGID settings.
    Incidentally, this numeric system is closer to where permissions are actually
    stored and used internally in UNIX. I will explain the numeric system—and how
    it relates to symbolic permissions—in detail. The numeric and symbolic systems
    look like Figure 4.3 side-by-side.


