    # .hosts File—Gateway to the r-commands


    The so-called r-commands consist of rlogin, rsh, rcp, and rdist. They are called
    r-commands because

    all start with the r prefix, which stands for remote. All have to do with running
    shells or commands

    systems—rlogin = remote login, rsh = remote shell, rcp = remote copy, rdist =
    remote distribution

    Theice thing—and the bad—about the r-commands is, that through the use of .hosts
    file, a

    user on one system can log in or execute commands on a remote system without having
    to supply a

    password.


    # Warning


    The use of .hosts to permit trusted r commands across a network is not

    recommended, particularly by root. In all the smallest environments, the implicit

    webs of trust set up through the overuse of .hosts can quickly grow out of control

    and expose the site to unacceptable security risks.'
