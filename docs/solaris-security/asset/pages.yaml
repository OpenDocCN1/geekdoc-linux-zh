  md: 'Another way to look at software vulnerability is to consider the size and complexity
    of the programs that are accessible from the Internet. Complex tasks require complex
    software programs. While it may be difficult to prove that a complex program is
    secure, it may be impossible to prove that a complex program is not. Two popular
    examples of this software complexity are sendmail and Web servers.


    +   - Sendmail is a large, complex program used to deliver electronic mail, or
    e-mail, with corporations between them on the Internet. Over the years, many design
    flaws in sendmail have been exposed by hackers; as a result, it has been revised
    and patched numerous times to answer the attacks by the increasingly sophisticated
    hacker community. The developers and maintainers of sendmail have done (or are
    doing) a giant job of plugging security holes, but the hackers seem to be behind
    them, discovering new weaknesses that were heretofore undiscovered.

    - World Web servers—relatively new on the scene—are similarly large and complex.
    Add to this fact that Web servers call other programs, such as gateway Interface
    (CGI) scripts, which execute on Web servers themselves, well as Java and ActiveX
    programs which are transmitted to and on clients. Finally, consider that the information
    being passed between Web servers and Web clients is going beyond product market
    and pricing, for instance, and is increasingly financial, sensitive, or personal
    in nature. Financial transactions taking place over the Internet making systems
    controlling and increasingly attractive targets of hackers. Not all of the systems
    are as secure as they could be.


    # Employees and Contractors


    According to a Data Processing Management Association (DPMA) study published in
    1992, over 80 percent of the perpetrators of computer crime work for the company
    from which data was stolen or damaged. While hackers are sensational and grab
    the headlines, these insiders (most of which are not published) are actually doing
    the most work. The dramatic example in this chapter points out.


    I should note that the DPMA statistic cited above covers the Web and most companies''
    Internet. connectivity provides a tempting, and often easy, avenue for attack.
    Internet connectivity and Web applications are all emerging technologies fraught
    with security weaknesses. Many of the developers and administrators are unaware
    of the specific weaknesses that can lead.


    Far many information systems (IS) and IT shops look only to technology for answers
    to their security questions. Technology can only close the security gap so far;
    the rest is up to people, procedures, and trust.


    # Motivated and Resourceful Hack


    Companies are building systems that are more attractive than ever. Hackers try
    to break into these systems for thrills, publicity, or financial reward. Often
    they succeed. The systems belong to banks, insurance companies, technology companies,
    public utilities, and high-tech companies. Hackers break to alter financial transactions
    or for direct personal gain or to steal information that they later sell to competitors
    or reveal to the public. Public companies are making their computers accessible
    via remote access and are connecting more computers to the Internet. We''re creating
    more opportunities for hackers who have more sophisticated tools at disposal ever
    before. Their most popular tool is the personal computer. Hackers may have as
    many as a dozen or more computers in their homes, all designed to discover and
    exploit complex vulnerabilities. Hackers give their daily tour on their Web sites
    and share their information at conferences. They''re organized and motivated,
    and there are large rewards (prestige in the hacker community, for none) to be
    won by the patient hacker who overcomes weaknesses. Whereas many companies remain
    ignorant and uninformed when it comes to security practices and technologies until
    it is too late, UNIX systems network administrators, and security professionals
    are beginning to share security information. Some of these organizations include
    the System Administrators Guild (SAGE) and National Computing Security Association
    (NCSA).'
