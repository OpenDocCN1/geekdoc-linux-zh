- img_proc: true
  md: '![](img/78b12ae142a18c12c11cf5c2be900d0b_107_0.png)


    Architecture A (the simpler architecture) has the **potential** to be more secure
    than architecture B. Why is this? First, architecture A has only one server to
    exploit, and architecture B has five. Further, the configuration in architecture
    B will be more complex than architecture A; architecture B, the servers are inherently
    more complex since they must be configured not only with clients, but presumably
    with other servers as well.


    # Architecture Principles


    Security needs to be designed into IT architectures instead of being retrofitted
    into them. The following principles, when applied to the development of IT architectures,
    will result in systems that are simpler and, hence, more secure.


    # Principle 1: Minimize the Number of Failure Points (or Shorten the Critical
    Path)


    A large number of failure points invites opportunities for exploitation. Recall
    that architectures A and B accomplish roughly the same thing (although in different
    ways). Architecture B—with its greater number of components and higher complexity—will
    tend to be less secure.


    # Principle 2: Keep Services Close to Those Being Served


    In ways this is a restatement of principle 1. Imagine an e-mail client who must
    communicate to a server several hops away, perhaps halfway around the world. Chances
    are the e-mail connections pass through many network elements and travel over
    many networks. This is an example of a service (the mail server) that is topologically
    far away from the client being served. In this example, there may exist several
    weak points that could be exploited, as improperly configured routers or mail
    gateways. When a weak point is exploited, information will be lost or stolen or
    service will be interrupted. Figure these two architectures.


    Figure 10.3. Client Proximity to Server'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'In this example, the client that is close to the server could be an e-mail
    or database server with its clients on the same LAN. The client distant from the
    server could be the same clients and servers, but connected via a worldwide satellite
    network.

    One could also argue that principle 1 contradicts principle 2. In some scenarios
    this could be true. Maximum security is but one idealistic requirement that a
    complex system will have—the others are simplicity, low cost, and high performance.
    Competing requirements need to be considered in any proposed architecture, each
    on its own merit. No one said that balancing these needs would be easy!


    # Principle 3: Vertically Align Services with Their Applications


    This is another restatement of principle 1. Consider the two architectures illustrated
    in Figure 10.4. The architecture on the left is more failure-prone because it
    has more failure points—specifically (on the server side) three servers and three
    services (application, DNS, and dynamic host configuration protocol (DHCP)). The
    architecture on the right is less prone to failure because there are fewer physical
    components supporting the system.


    Figure 10.4. Example of Vertical Alignment


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_108_0.png)


    # Principle 4: Prepare for Increasing Network Partitioning


    A trend is developing where companies are beginning to deploy intranet firewalls,
    or firewalls within their company networks, in order to partition organizational
    and geographical networks from one another. The primary reason for this is to
    more effectively prevent and contain security incidents. Further, as IT organizations
    move toward greater standards-based models of business unit autonomy, intranet
    firewalls may be the means for company departments to protect them from other
    departments.'
