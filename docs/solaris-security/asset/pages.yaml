  md: 'In a NIS/Autounter environment where users'' home directories are exported
    from desktop systems and mountable everywhere (a common architecture), a user
    can launch a denial-of-service attack on the mail server by turning off or disconnecting
    his workstation and sending himself mail. The mail server will try to authorise
    the user''s home directory and could hang while doing so. The ForwardPath option
    in sendmail version 8 (in Solaris 7) permits the UNIX administrator to define
    a single directory on the mail server that can handle all the user''sforward files.
    A sample ForwardPath entry in sendmail.conf would be


    ```

    ForwardPath=/usr/local/mailforwards/$u.forward=$/.forward

    ```


    This sends sendmail to first look for the file /usr/local/mailforwards/userid.forward.
    If this file is found, the user''s .forward file in his home directory is ignored.
    If sendmail does not find a file /usr/local/mailforwards/userid.forward, it will
    next look in the user''s home directory for a .forward file. Sites that wish to
    never permit .forward files in home directories can define ForwardPath as follows:


    ```

    ForwardPath=/usr/local/mailforwards/$u.forward

    ```


    This sends sendmail to look only in /usr/local/mailforwards for userid.forward
    files. This eliminates the need for sendmail to look in a user''s home directory.


