    # Klaxon


    Klaxon is a utility used to detect port scanning activity generated by tools such
    as Satan and ISS. Klaxon can also determine the identity (using the Internet protocol
    described in RFC2931) of the remote user using the port scanner.

    Klaxon is available from ftp://ftp.eng.auburn.edu/pub/doug/


    # Courtesy


    Courtesy is a utility designed to detect incoming port scans from port scanners
    such as the Satan program. Courtesy requires libpcap (available at ftp://ftp.ee.lib/libpcap-0.0.tar.Z),
