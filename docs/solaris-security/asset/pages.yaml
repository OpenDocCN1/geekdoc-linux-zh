  md: '# Part 2: The Standalone System


    Systems must first be physically and logically secure. This applies whether a
    Sun system is networked or not. Regardless of network connectivity, certain features
    and characteristics increase the risk of loss or exposure to the person(s) or
    company using it. Topics covered in this next section include:


    +   - Part II Standalone System

