    Tocsin is a promiscuous network monitor to detect SYN and RST attacks. These kinds
    of attacks are not detected by tools such as TCP Wrappers and Klaxon. For more
    information on SYN and RST attacks, see the glossary of attacks appendix.

    Tocsin is available from ftp://ftp.eng.auburn.edu/pub/doug/'
