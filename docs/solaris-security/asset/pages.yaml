    S20setup S73caches.daemon S85power S99dlogin

    S21perfl S73ifs.client S88sendmail

    S30sysid.net S74autofs


    At system startup, all these files that start with the letter S (S01MOUNTFSYS,
    then S05RMTMPFILES) are executed in order. The shell scripts pass the single argument
    start. All other files in the directory are ignored (the files with the letter
    K'
