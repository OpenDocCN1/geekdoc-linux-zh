  md: '29. Implement inet connection Wrappers. See 13, "inet Connection Tracing."

    30. Install and configure TCP Wrappers. See 13, "TCP Wrappers."

    31. Implement public-rpcbind on a system which must be an NFS, NIS, or NIS+ server.
    See 13, "Public rpcbind.", Otherwise disable rpcbind.


    32. If the system is a NIS server:


    +   - Move NIS maps out of /etc. See 14, "NIS Maps out of /etc"

    - Make sure NIS maps directory is safe. See 14, "Protect NIS Maps Directory."

    - Bind to a public server (or servers) rather than for a NIS server. See 14, "Avoid
    local NIS Servers."

    - Make the NIS domain name different from the NIS domain name. See 14, "Implement
    /var/yp/securenets."

    - Restrict the systems that can access the NIS maps. See 14, "Hide Shadow Fields."

    - Consider hiding shadow fields.

    - Do not root and other administrative accounts in NIS. See 14, "Keep Root and
    Other Administrative Accounts of NIS."

    - Make sure the security level is set to 2. See 14, "NIS Security Level."


    33. If the system is a NIS server:


    +   - Back up NIS tables at least once per day. See 14, "Back Up NIS Tables."

    - Make sure NIS transactions are frequently flushed. See 14, "Flush NIS Transactions."

    - Do not root and other administrative accounts in NIS. See 14, "Keep Root and
    Other Administrative Accounts of NIS."


    34. If the system is running NIS:


    +   - Make sure the security level is set to 2. See 14, "NIS Security Level."

    - Back up NIS tables at least once per day. See 14, "Back Up NIS Tables."

    - Make sure NIS transactions are frequently flushed. See 14, "Flush NIS Transactions."

    - Do not root and other administrative accounts in NIS. See 14, "Keep Root and
    Other Administrative Accounts of NIS."


    35. Disable nscd caching. See 14, "nscd."


    36. See what network services are reachable on the system. Take any corrective
    action. See 13, "System Accessibility."


    37. Implement an intrusion detection system. See 13, "Intrusion Detection."


    38. Run Tripwire and baseline the system again. Put the Tripwire database in a
    safe place off of the system. See 4, "Tripwire."


    39. Create an incident response team. See 16, "Create an Incident Response Team."


    40. Document the system hardware and subsequent modifications in an electronic
    logbook. See 16, "System Event Logbooks., "Hardware and Software Service Agreements."


    41. Make sure the system is covered under a hardware and software support contract.


    42. Determine what hardware spare parts should be on-site, if any, acquire them.
    See 16, "Hardware Spares."


    44. Make sure Unix administrators are aware of the architecture and all procedures
    for the system. Working-hours and after-hours contact information for everyone
    who administers the system. See 16, "Contacts and Cross-Training."


    45. Back up the system again on the media site.


    46. Get the latest CERT and Sun Security Bulletin reports and check for any-acute
    security holes that must be remedied. Subscribe to two or more security incident
    mailing lists and read all of the advisories that arrive.


    47. NOW connect the system to the network!'
