  md: 'Ordinally NFS will respond to requests that originate from UDP port. However,
    NFS can be configured to respond only to requests originating from privileged
    ports; that is, from ports originating from the root user on another UNIX system.
    When NFS portmon is set on the server, the server ensures NFS mount and I/O requests
    coming from unprivileged ports. To set NFS portmon, add the following entry to
    /etc/system (and reboot the system):


    ```

    * set portmon to deny unauthorized access

    set nfssrv:nfs_portmon=1

    ```


    # NFS Authentication


    The share command provides four options for authenticating NFS mounts and subsequent
    accesses. They are


    +   * sys--(RPC AUTH_SYS) ordinary UNIX userid, groupid, and file/directory permission
    bits are passed over the network and are not authenticated by the NFS server.
    This is the default.

    * dh--(RPC AUTH_DEFS) Diffie-Hellman/DES public key authentication.

    * krb4-(Secure RPC AUTH_KERB) Kerberos Version 4 authentication.

    * none--(RPC AUTH_NONE) map all NFS clients to the client user''s nobody on the
    NFS server. Note: this is supported by share, but not by mount or the automunter.


    This is an example of share command specifying authentication.


    ```

    share - NFS -o sec=dh,rw=homeusers -d "Home Dirs" /export/home

    ```


    In this example, NFS clients use DES authentication in order to mount and access
    the /export/home directory. Both Diffie-Hellman and Kerberos options encrypt authentication
    information that is transmitted over the network. The other, sys and none, do
    not use encryption. The Diffie-Hellman and Kerberos options require Secure RPC.
    Refer to chapter 13 and the section on authentication for more information.


    # Servers as NFS Clients


    NFS presents the UNIX administrator with opportunities to finalize information
    storage. However, these economics can be taken too far. Servers that depend on
    NFS servers for continued operation are jeopardizing their stability. Consider
    the architecture illustrated in Figure 15.2—the mailsrv depends upon the integrity
    of the server dbsvr for its integrity. The opportunities for system failure for
    the server mailsrv have been greatly increased with this NFS mount. If the server
    dbsvr crashes, or if the network connecting mailsrv and dbsvr fails, the system
    mailsrv is in trouble.


    Figure 15.2. Server-to-Server NFS Dependency


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_158_0.png)


    Possible remedies involve a change in the intersystem architecture so that the
    server mailsrv no longer depends upon the server dbsvr for its stability. Another
    remedy is to use a different mechanism such as rdist to make /usr/local visible
    on mailsrv.'
