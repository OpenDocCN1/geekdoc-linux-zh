    # Principle 2a: Don''t Trust Yourself, or Verify Everything You Do


    A systems administrator is his or her own enemy. Working multiple priorities,
    deadlines, and long hours contribute to mistakes. Some of these mistakes will
    result in simple failures in functionality; others will fill up dips, buffers,
    queues, or process tables; the worst will silently open gaping security holes
    or damages in subtle, hard-to-detect ways. More than 50 percent of data damage
    or loss incidents are due to human error.


    [2] Source: Data Processing Management Association, 1992.


    Verify everything you do. It is not sufficient to kill a process, remove or chmod
    a file, or lock an account and move on. Stop; check, and verify. Chmod the file
    and it is safe. Copy the copy to directory and read it back. Remove the file and
    directory for it. Protect the directory and try to remove or change it.

    Develop a healthy distrust for everything the computer to do. Be a skeptic. Challenge
    the computer (or yourself) to prove that it told you to it.

    Veteran airline pilots go through their flight checklists and read the items out.
    Experienced campaigners measure twice and sow once. UNIX systems administrators
    likewise ought to verify everything, great and small.


    # Principle 3: Make-Would Intruders Believe You Will Be Caught


    Retail stores vulnerable to phishing put up signs that say, "If we catch you,
    we prosecute you." They erect detectors, cameras, and monitors. The message is
    clear: they are watching for thieves and can catch them.

    Information is the merchandise of the computer age and, using means similar to
    retail stores, information systems must contain visible warnings, barriers, and
    detectors that will help to deter, detect, and catch would-criminals. Since these
    perpetrators of information theft are most likely employees or associates of the
    organization owning the system, these means must be visible to legitimate system
    users via good password security and messages that say, "We are watching you."


    # Principle 4: Protect in Layers


    The often-fatal mistake systems administrators, network administrators, or technology
    architects make is that they rely on a single layer or method of security to protect
    a system or service. An exploitation of one protection mechanism the system will
    expose that or service. For example, a corporation allows certain individuals
    to telnet to the Internet to any of its servers inside the corporate network.
    An access list on the corporation''s Internet firewall filters telnet sessions
    so that they can originate only from known, approved IP addresses. A,, redundant
    access control mechanism limiting inbound access is on the server. The server
    is inside a locked room. All accounts require passwords.


    Suppose that a bug in the firewall''s access list is discovered that will allow
    certain other types of access to these servers. Figure 2.1 illustrates this bug
    and bug gain access to the inside of the corporation''s network.


    # Figure 2.1. Protecting in Layers'
