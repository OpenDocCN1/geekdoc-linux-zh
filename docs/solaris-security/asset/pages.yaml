    # # Chapter 15. NFS and the Automounter


    The network file system (NFS) proves over to be the weak link in an enterprise’s
    computing infrastructure. Often misunderstood, NFS security is frequently compromised
    in favour of enabling data access for business users. Given the nature of NFS
    versions and its security features, it is no wonder that data security has been
    compromised in order to give people the access they need (or want).

    In recent years, NFS security has improved markedly, and these features can be
    incorporated into the enterprise.


    # ## What’s in this chapter


    +   - Basic workings of NFS

    - Improved NFS server and client security

    - NFS authentication

    - NFS and access control lists

    - Automounter security


    # ## Why this is important


    NFS and the automounter are network services; the network frequently proves to
    be the weak link in system security. System administrators need to know how to
    set up NFS and automounter so that they are secure.


    # ## NFS


    NFS gives the appearance of the existence of specific directories and files on
    a computer, when in fact those specific directories and files reside on another
    computer. From the UNIX user’s perspective, NFS is the invisible mechanism that
    makes one computer’s specific directories and files appear to exist on another,
    or several, computers.

    All normal filesystem commands such as ls, du, cat, and vi work on files presented
    through NFS just as those files were physically present on the system.


    # ## NFS Operations


    The principal operations carried out by machines participating in NFS are share
    and mount. *Share* is an operation carried out by a system, making one or more
    of its resident directories available for access by other systems. This is the
    role of an NFS server. Mount* is the complementary operation carried out by another
    system whereby the shared filesystem is made to appear to be resident on the mounting
    system, or *NFS client*. Figure 15.1 the NFS server serves the directory /export/home,
    which is mounted at the location /home on the NFS client.


    Figure 15.1. NFS Architecture'
  merge: -1
  pgno: 155
- img_proc: true
  md: "# Improving Security with NFS Server\n\nAn NFS server's directories are shared\
    \ with the share command. Security can be improved by restricting which systems\
    \ may mount a server's NFS directory. Syntax of the share command is:\n\n```\n\
    share -F Ftype -o options -d description path\n```\n\nOptions consists of one\
    \ (or, more, separated by commas) of the following:\n\n+   - ro-directory is shared\
    \ read-only to all clients.\n- ro=[client,...]-the directory is shared read-only\
