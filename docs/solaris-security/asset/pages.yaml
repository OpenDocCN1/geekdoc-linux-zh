  md: 'SunSKIP is a software that transparently and automatically authenticates and
    encrypts all TCP/IP network traffic between systems. SunSKIP is bundled as part
    of the SunSKIP Net solution, or can be chosen as stand-alone product. SunSKIP
    is available for the Solaris Operating Environment, as well as Windows 95, Windows
    98, and Windows NT 4.0. SunSKIP''s Global Version supports 40-bit RC2 and 40-bit
    RC4 data encryption. The Export-Controlled Version supports encryption used in
    the Global version or in the Export-Controlled Version, plus 3-Key TDES and SAFER-256
    encryption. SunSKIP has an Automatic Discovery mechanism, which eliminates the
    need for manual key distribution. More information about SunSKIP is available
    at http://www.sun.com/software/skip/ds-skip/. Also, see the section on virtual
    private networks in Chapter 13 for more information on SKIP.


    # SunScreen Secure Net


    SunScreen Net is an integrated firewall and SKIP server backup. The Secure Net
    firewall can operate in routing mode, and optionally includes proxies for content
    filtering and user authentication. Secure Net provides proxies for HTTP, Telnet,
    FTP, and SMTP. In operating mode, Secure Net can be configured in a high-availability
    (HA) cluster, where a backup Secure Net system can take over for a failed system.
    At all times, the backup Secure Net system stores the state of the primary system
    for seamless failover.


    Secure Net firewall can also operate in stealth mode, with no IP or MAC address,
    making it more difficult to attack. In stealth mode, the OS is hardened to make
    the firewall even secure.


    Secure Net can perform Network Address Translation (NAT), where internal addresses
    are mapped to different external addresses, thereby masking the identity of the
    entities in the enterprise. As packets pass through the Secure Net firewall, between
    an internal host and a public network, the addresses are replaced with new addresses.
    NAT also permits the use of "private" (non-routable) addresses by translating
    these addresses to valid, registered addresses when systems with private addresses
    communicate with systems on public networks, such as the internet. More information
    on Secure Net is available at http://www.sun.com/software/securenet/


    # Trusted Solaris


    Trusted Solaris is a highly secure version of Solaris, designed and certified
    for trusted computer system compartmented mode workstation (CMW), otherwise known
    as security level B1.


    +   - Trusted Solaris 1.2—based on Solaris 5.1.3_U1

    - Trusted Solaris 2.5.1—based on Solaris 2.5.1 11/97


    Trusted Solaris is designed for an environment where the utmost in information
    security is required. Extensions to the filesystem, kernel, system administration
    users, interfaces and networking effectively restrict the flow of sensitive information
    so that individuals lacking proper security clearances cannot access it. Trusted
    Solaris designed so that most third-party products can run without modification
    or recompilation.

    Refer to the Trusted Solaris 2.5 Technical White Paper for more information. This
    document is available from


