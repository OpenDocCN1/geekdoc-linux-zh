    # Authentication


    Authentication refers to a process of identifying yourself to a system in order
    to access information.

    Solaris supports three authentication methods: System, DES (also known as Diffie-Hellman),
    and

    Kerberos, NIS and NIS+ support all three methods.


    # System Authentication


    System authentication simply refers to the standard UNIX file/directory permissions
    and userid/groupid

    structure, nothing more. This is the default method for authentication—there is
    nothing more to

    making this work than setting good file and directory ownership and permissions.


    # DH Authentication


    DH (Diffie-Hellman) is used to authenticate users and systems. DH uses the data
    encryption standard

    and public-key cryptography to safely encrypt authentication information over
    the network. Solaris

