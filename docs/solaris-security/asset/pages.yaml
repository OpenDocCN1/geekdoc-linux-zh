  md: 'Examples of network services include


    +   - telnet—allows users on other systems to log in to this system and initiate
    a login shell from

    - ftp—allows users on other systems to initiate a file transfer session with this
    system in order to pick up or drop files

    - sendmail—allows other systems to establish a connection in order to send and
