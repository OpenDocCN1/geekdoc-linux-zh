  md: '# PROM


    The PROM software and its environment variables load into memory before execution.
    The PROM reads the *auto-boot* and *boot-device* variables in order to determine
    whether the PROM should attempt a boot and, if so, from which device (*disk* or
    net). See chapter 3 for additional information.


    # init


    The UNIX kernel is loaded, the root filesystem is mounted, and the *init* process
    is started. If the system is booting to single-user mode, booting stops and the
    following prompt is displayed:


    ```

    INIT:SINGLE USER MODE

    Type Ctrl-d to proceed with normal start-up,

    (or give root password for system maintenance)

    ```


    If the root password is entered, a root shell is launched. At this point the UNIX
    administrator is free to examine the system and perform any maintenance. When
    complete, the UNIX administrator exits the root shell by typing *exit* or *+D*.


    # Multiser mode


    When the UNIX system boots to multiuser mode (whether by default or when the administrator
    exits the root shell in single-user mode), the *init* process reads /etc/initab
    in order to determine what to do next.


    # The rc mechanism


    The rc mechanism is the collection of scripts executed when the system''s level
    is changed. The rc scripts carry out the tasks required to change from one level
    to another. This section describes what the rc mechanism does to boot to a multiuser
    mode. The first script /etc/rc2 determines the current run state of the system.
    If the previous state was 0, then each script in the directory /etc/rc2 that begins
    with the letter S is executed, effectively starting all local and network services
    except the NFS service.


    It is easy to tell what happens when /etc runs, by listing the scripts in the
    directory /etc/rc2. During the rc startup phase, the files in /etc/rc2 that begin
    with the letter S are executed in the order that they appear in alphabetical order.
    The convention for naming files in this is *Smnndd*, where nn is a number used
    to control the run sequence of the files and ddd is a string of characters describing
    the script. A typical list of files in /etc/rc2 is as follows:


    +   K20pc S47appp S74syslog S89bdconfig

    K60ifs.server S69inet S74nntpd S91elleconfig

    K76snmpdx S70uuc S75cron S92rtvc-config

    K73rmi S71rc S76nscd S92volmgmt

