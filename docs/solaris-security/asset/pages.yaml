    # Auth (or Ident) Protocol


    When someone initiates a connection to an Internet site, that site may try to
    authenticate that user by querying the user''s originating Internet site. The
    *auth* protocol is used in an attempt to verify the identity of the user.

    The *auth* protocol (sometimes known as *ident or identent*), is described in
    the Internet RFC''s 1413, 1416, and 1700,[1] use TCP port 113 when making an *auth*
    query. Any program can make an *auth* query; these queries are usually answered
    by the *sendmail* daemon on the site being queried.


    > [1] For more information on RFCs, refer to appendix D.


    Some sites could make *auth* information unavailable. This can generally be done
    without causing other services to fail—most services failing to get an *auth*
    protocol authentication will run anyway. It is recommended that *auth* be disabled
    at the firewall by blocking TCP and UDP port 113. Figure 11.3 illustrates how
    the *auth* protocol is used.


