  md: 'The /etc/inet/netmasks file is used to determine the range of IP addresses
    on the network(s) to which the system is connected. The file /etc/inet/netmasks
    is a symbolic link to /etc/inet/netmasks. This information is needed so that the
    network drivers can determine which packets to be sent out to the destination
    host(s) or instead of the default router.


    ```

    207.127.1.0 255.255.255.0

    96.0.0.0 255.255.255.0

    ```


    Each entry in /etc/inet/netmasks contains two fields: a network number and its
    respective subnet mask.


    ```

    /etc/defaultrouter

    ```


    The /etc/defaultrouter is a plain text file that contains the name or IP address
    of the default router. Packets destined for computers or devices not on the same
    subnet as the system sending them are sent to the default router, which presumably
    will forward them to the proper destination. For more information see the section
    on routing later in this chapter.


    Note


    If the name of the default router is used, there must be an entry for that name
    in the /etc/inet/hosts file, since no directory service (i.e., DNS, NIS, or NIS+)
    is running on the system when the system defined in /etc/inet/hosts the routing
    table is being set up.


    ```

    /etc/nodename

    ```


    The /etc/nodename file is a plain text file that contains only the name of the
    system. This name matches the name of the system defined in /etc/inet/hosts.


    ```

    /etc/hostname.interface

    ```


    The /etc/hostname.interface file is a plain text file containing the host name
    of the "xxx" network adaptor. This file is used together with /etc/inet/hosts
    to determine which IP address network adaptor should be assigned when the system
    is booted. For example, consider a system with two network interfaces—le0 and
    le1. Two hostname.interface files must be used—etc/hostname.le0 and /etc/hostname.le1.
    The next section describes how these files are used, together with /etc/inet/hosts
    and /etc/inet/netmasks, to configure a system''s network interfaces.


    # How Adaptors Are Configured


