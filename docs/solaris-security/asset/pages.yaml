    # Disable nscd Caching


    In certain circumstances nscd is known to produce erratic behavior. Consider disabling
    nscd''s cache.

    Refer to the nscd section at the end of this chapter.


    # Other NIS Weaknesses


    Features absent in NIS include


    +   * Quality password enforcement—NIS does not enforce the use of mixed-case
    and nonalphabetic characters in passwords; thus, user accounts in NIS will invariably
    contain easily guessed passwords. This makes the need to hide shadow fields much
    more urgent.

    * Password aging—NIS does not support password aging.

    * Secure RPC—ordinary UNIX permissions and nothing more govern which users have
    access to directories and files.


    # NIS+


    NIS+, introduced with Solaris 2.x, is an extensible version of NIS that includes
    the following additional features:


    +   * More control over who can read the NIS maps.

    * Users log into NIS+ with a network password (in addition to logging into their
    own machine).

    * Scales for larger organizations.

    * Delegation of maps to other administrators.


    The following sections discuss NIS+ security weaknesses and solutions.


    # NIS+ Default Access Rights


    NIS default access rights are the first line of defense, for they determine who
    can read the NIS+ maps. The nisdefaults command shows NIS+ access rights for the
    domain (see Figure 14.3).


    Figure 14.3. NIS+ Principal Classes


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_148_0.png)


    Within each principal class (nobody, user, group, world), the four symbols are
    r (read), m (modify), c (create), and d (destroy). Read permissions are all you
    need to read NIS+ tables. Modify, create, and destroy are needed only by domain
    owners, typically UNIX administrators.

    The niscal command can show rights for an individual NIS+ table.'
