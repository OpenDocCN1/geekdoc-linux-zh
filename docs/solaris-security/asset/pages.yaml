    UNIX to retain the image of that program in memory. Memory management changes
    and improvements in SVR4 and Solaris x2 have rendered this obsolete.


    **Permissions: Sticky Bit—Directory** If the directory is writable and the sticky
    bit is set, files within the directory can be removed or renamed if at least one
    of the following conditions is met:


    +   * The file is owned by the user.

    * The directory is owned by the user.

    * The file is writable by the user.

    * The user is root.


    Typically, the /tmp and /var/tmp directories on a UNIX system will have the sticky
    bit set. The reason for this is that /tmp and /var/tmp are publicly readable and
    writable. The sticky bit prevents users removing files owned by others. Ordinarily,
    files are allowed to be deleted based on the permissions of the directory, not
    the file. Without the sticky bit set in /tmp and /var/tmp, anyone would be able
    to remove any file, since /tmp and /var/tmp are world writable. With the sticky
    bit set in /tmp and /var/tmp, the ability to delete a file is based unless the
    process owns the file.


    # Putting It All Together: Who and the What


    The concept of user and group identity and file permissions fits a two-dimensional
    model as illustrated in Table 4-1.


    | | Read | Write | Execute | SetUID | SetGID | Sticky Bit |

    |---|---|---|---|---|---|-|

    | User | On or Off | On or Off | On or Off | | | |

    | Group | On or Off | On or Off | On or Off | On or Off | On or Off | On or Off
    |

    | Other | On or Off | On or Off | On or Off | | | |


    # How to View File and Directory Permissions


    The *ls* command is used to view permissions on a directory. The letter *l* option
    tells *ls* to display the permissions fields themselves. Here is an example of
    *ls*:


    ```

    % ls -la test

    -rwxrwxr-wx  1 pet staff     577 Feb  3  20:33 .profile

    %

    ```


    These are the elements of the output from the *ls* command.


    +   * **rwxrwxr-wx** the permission that specifies which users have permissions
    for reading and writing the file or directory (see Figure 4.2 for a detailed explanation)


    # Figure 4.2. ls Command File/Directory Permissions'
