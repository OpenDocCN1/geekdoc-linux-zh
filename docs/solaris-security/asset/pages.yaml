  md: 'Virtually all information stored on a UNIX system is stored in a filesystem.
    Information can be altered or stolen from a computer system whose filesystem access
    permissions are improperly set.


    # # What Is the Filesystem?


    The filesystem is the part of the computer used to store and manage the computer''s
    files; it consists of the operating system, system application programs, and data.
    Part managing a system''s files includes setting access permissions to control
    which users of a computer can access and by what methods: read-only, read write,
    and execute (applies only to system and application files).


    Many UNIX security problems are a direct result of improper understanding and,
    thus, manipulation of files through misunderstanding or plain haste, many administrators
    open security holes by modifying or permission settings on files and directories.
    Changes in permissions are often made to temporarily solve a short-term file or
    directory access problem. Many times the result is that they leave the door open
    permanently.


    # # Some Applications Require Permissions


    Unfortunately, many UNIX-based third-party applications still require that file
    and/or directory permissions for data managed be wide open (read/write access
    by all users) in order to function. A UNIX e-mail application I used to work with
    required all user mailboxes have read/write permissions (imagine how easy it would
    be for one user to access and manipulate another user''s mailbox). In another
    case, an engineering application I supported that the /tmp directory have read/write
    access without the "sticky bit" being set (the use of the sticky bit is discussed
    later in this chapter). There are just a few examples of applications sloppy security
    settings in order to function.


    While troubleshooting, an administrator are tempted to set access permissions
    access and leave them open when a problem is instead of standard of file access.
    But often, even though a file or directory (or no permissions at all), a UNIX
    administrator wants to leave things as they are, call the problem "solved," and
    move on to another support issue, when in fact, an even larger problem has been
    created in this place. This is comparable to leaving the front door open one days,
    nights, and weekends because it is too late to figure out who has the keys and
    who doesn''t. Some mitigate their wide-open permission architecture at the UNIX
    filesystem level by adding a layer of security which specified for each application
    and is beyond scope of this book. An example of security without an application
    is a mechanism where users can view or modify records or fields in a database.
    Returning to the concept of protecting in layers, an application designer should
    utilize security features wherever possible, including protecting files at the
    UNIX filesystem level.


    # # Understanding File and Directory Permissions


    Solaris 2.x and Solaris 7 conform to the UNIX System V Release 4 for the implementation
    of the UNIX permissions structure. This structure controls which users access
    what information on a UNIX system.


    It is necessary to know two things about file permissions: the **identity of the
    user** (or defined group of users) accessing a file, and the **type of access**
    used by that user (read, write, search, or execute). Practically everything that
    may seem complicated (and all too it is complicated) about UNIX file/directory
    access is derived from these two pieces of information: **who** and **permission
    level**


    # # Who: User, Group, and Other


    In UNIX, there are three categories of users: an individual user (also known as
    owner), a defined group of users, and everyone else (also known as other or world).'
