    # # Chapter 14. Name Services


    Name services are the least-understood factions on a UNIX system; frequently they
    are cobbled together until they, and then aren''t touched for they will break
    down again. All too often security holes exist that invite disaster a UNIX administrator
    make a mistake or an intruder decide to make some trouble.


    **What is in this**


    +   - Overview of DNS and how to improve its security

    - Architecture of split-horizon DNS and why it is useful

    - NIS''s security weaknesses

    - Ensuring NIS+ security

    - The name service switch

    - Ncd and its role in name services


    **Why this is important**


    Name servers provide organization-wide information services which are only as
    reliable as the servers secure.


    # ## Name Service (DNS)


    The unseen backbone of internet navigation, DNS translates domain names into IP
    addresses and addresses into domain names.

    Why is DNS needed? Software programs communicate with each other by referencing
    their respective IP addresses; however, IP addresses are abstract, that they can
    be easily forgotten. DNS was developed because people remember names far easier
    than addresses. In every instance where a person type in a domain name (for example,
    in a Web browser), the software program must summon DNS under the IP address of
    the computer with that particular domain.


    DNS is a hierarchical directory service, with each server containing a list of
    node names and their respective IP addresses, as well as a possible list of subdomains
    and the IP address(es) of server(s) that contain information about the subdomains.

    Each name in Figure 14.1 is a DNS domain. Each DNS domain contains the following
    information:


    +   - A list of computer names (and their IP addresses) that are registered name
    servers for the domain.

    - A list of computer names and their respective IP addresses that are part of
    the domain.

    - A list of subdomains, and the computer names and IP addresses that are the domain
    servers for those subdomains. From Figure 14.1, the domain sun contains three
    subdomains—corp., west, and east—along with the names and IP addresses of the
    DNS servers for respective domains. The process of naming a subdomain and assigning
    one or more servers for the subdomain is called *deletion*. This term will be
    used throughout the section on DNS.


    Figure 14.1. DNS Domain Hierarchy'
