    Be very careful with security mode set to full.


    # All Passwords Lost—Partial Recovery Procedure


    This procedure describes the steps used to recover a system when the OpenBoot
    and root passwords are lost and the OpenBoot security level is set to full.

    Prerequisites: a replacement PROM to be used temporarily; Solaris-release CD-ROM.

    Caveat: This will allow the recovery of the root password, but not the PROM password.
    If the PROM password is forgotten, it cannot be reset or recovered—ever. In this
    event, replace the PROM as soon as possible.


    +   1. Carefully remove the old PROM from the system. It will be needed later.

    2. Insert a new PROM, one with the security mode set to none.

    3. Follow the instructions in the section on recovering a root password (later
    in this chapter).

    4. Shut the system down. Power it off.

    5. Switch back to the original PROM removed in step 1.

    6. Boot the system.

    7. Log in as root using the password set in step 3.


    # Boot Device Recommendations


    A system, even one in a secure data center, should be configured to boot from
    an internal disk rather than an external device or a SCSI bus.

    In a situation where someone has gained physical access to a data center (but
    not to the inside of a system, for whatever reason), a system configured to boot
    from an external device could have that external device replaced by another a
    simple cable change. One can simply attach a different hard disk to the SCSI bus
    by bypassing the correct device and attaching another with the same SCSI device.
    The only clue (which could be erased) is free SCSI device time-out messages. A
    system booted from this new external device can have a completely altered identity
    (different name, network address, password file, access permissions over the network,
    etc.), thereby compromising any information on the system and possibly on other
    systems as well.

    A system configured to boot from an internal disk must be physically opened in
    order to change the boot device. This makes it somewhat more difficult for an
    intruder to take over a system, even one one has physical access to.


