    # Running Tiger


    Tiger can be run by unpacking the Tiger archive and running the tiger script.
    It is recommended that Tiger be run as frequently as once per day on servers and
    perhaps less frequently on desktop systems.


    # Tripwire


    Tripwire, another package from Purdue University, is a sophisticated filesystem
    auditing tool used to detect signs that a UNIX filesystem has been tampered with.
    Tripwire reads a configuration file to find which files and directories on a UNIX
    system are examined. Each file and directory in the configuration file is rigorously
    examined and the results of examination are compared against a database containing
    information about every file and directory to be checked. Differences between
    a baseline information and what is currently found are listed in a report the
    UNIX administrator can use to determine the changes found by Tripwire are legitimate
    or not.


    # Where to Find Tripwire


    # Setting Up and Running Tripwire


    Tripwire comes with a default configuration file that is essentially a list of
    files and directories that Tripwire should examine. The configuration file should
    be edited to make sure that all system files and directories are included.


