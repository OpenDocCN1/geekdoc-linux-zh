  md: 'Similar to telnet, in the absence of an appropriate .hosts entry, a user attempting
    to access a remote system via an r-command will be required to enter the account''s
    password. This password is transmitted in the clear over the network.


    The inherent weaknesses of the r-commands include


    +   - Any password entered is done in the clear; anyone snooping the network will
    easily be able to see the password.

    - The entire r-command session is in the clear. Every character of the session,
    including passwords, can easily be recorded.


    See the section on secure replacement for rsh and login below for information
    on a more secure alternative to rsh and login.


    # /etc/hosts.equiv File


    The /etc/hosts.equiv file is similar to the .hosts file, but opens a wider security
    hole than does .hosts.


    Warning


    > hosts.equiv allows a user from a remote system to become any user on a local
    system. It can also permit any user on a remote system to become any user on a
    local system. For this reason the use of hosts.equiv is strongly discouraged.


    # Auditing .hosts and hosts.equiv Files


    The .hosts and hosts.equiv files should be audited periodically by the COPS and/or
    Tripwire tools. The following COPS modules include checks for .hosts and hosts.equiv
    security: root.chk and root.pl, trust.pl, user.chk, and user.pl.

    Refer to chapter 4 for more information about about running COPS and Tripwire.


    # Secure Replacement for telnet, rsh, and login


    rsh and login represent one of UNIX''s biggest security holes. Unless equivalence
    is set up (which itself can be dangerous) with .hosts or /etc/hosts.equiv, the
    user will be prompted for a password that, if typed, is transmitted in the clear
    over the network. This means that anyone with a network sniffer, like the Solaris
    snnoop program, can easily see this password and save it for future mischief.

    The entire rsh/login session is transmitted in the clear.

    ssh, or secure shell, is a nice drop-replacement for UNIX''s rsh, login, and telnet.
    ssh functions behave the same as rsh, but with the following enhancements:


    +   - Better authentication using RSA technology—this eliminates IP, and DNS spoofing
    weaknesses

    - Full-session encryption, including passwords


    Public daemon ssh for Solaris is available at http://www.cs.htsu.fi/ssh or ftp://ftp.cs.htsu.fi/pub/ssh/

    Commercially supported versions for Solaris (as well as Windows 3.x, 9x, and NT)
    are available at http://www.datafellows.com/ or http://www.ssh.fi.


    # ftp'
