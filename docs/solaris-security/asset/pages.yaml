    # Auditing Startup and Shutdown Mechanisms


    Because many system safeguards are either running or inaccessible the UNIX administrator
    must be especially careful to ensure the integrity of the startup and shutdown
    scripts. Two tools can be used to audit system startup and shutdown scripts COPS
    and Tripwire.


    # COPS


    The rc.chk program in COPS is used to audit a system''s startup and shutdown programs.
    rc.chk looks for all world-writable files in the /etc/init.d, /etc/shutdown.d,
    and /etc/rc* directories, as well as in the file /etc/inittab (COPS is described
    in detail chapter 4.)


    # Tripwire


    Tripwire (also discussed in chapter 4) can be configured to audit a system''s
    startup and shutdown scripts. Make sure Tripwire is checking the following files
    and directories.


    +   * /etc (contains rc scripts and numerous configuration files)

    * /etc/init.d (contains startup and shutdown scripts)

    * /etc/rc0.d (contains shutdown scripts)

    * /etc/rc1.d (contains shutdown scripts)

    * /etc/rc2.d (contains startup scripts)

    * /etc/rc3.d (contains startup scripts)

    * /usr/bin (system programs used during startup and shutdown)

    * /kernel (UNIX kernel and device drivers)


