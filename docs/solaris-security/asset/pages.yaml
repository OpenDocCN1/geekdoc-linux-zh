  md: 'Techniques for removing such files are discussed in the next section.


    # Alias the ls Command


    The ls command can be aliased so that the -a and -b options are used without having
    to be typed every time. Procedures for aliasing ls follow. For C shell users,
    include the following entry in the .login file.


    ```

    alias ls ''/usr/bin/ls -a -b \!*''

    ```


    For Bourne shell and Korn shell users, include the following entry in the profile
    file.


    ```

    ls() { /usr/bin/ls -a -b $*; }

    ```


    # Alias the rm Command


    For safety, the rm command can be aliased in order to force the UNIX administrator
    to verify the deletion of each file, preventing accidental deletion. Many UNIX
    administrators have their personal stories of having removed entire filesystems
    by accident. The -i option tells rm to ask for verification of each file being
    removed. An example of rm with the -i option is


    ```

    % rm -i *

    rm: foo is a directory

    rm: gcos.txt (yes/no)? n

    rm: hal.doc (yes/no)?

    rm: status.out (yes/no)? y

    %

    ```


    Some notes about rm:-


    +   - Directories and subdirectories are not removed (unless the -rf option is
    also used).

    - "No" is the default response (the file hal.doc is not removed in the example
    above).


    # Randomize Filesystem Node Numbers with fsirand


    The inode numbers in a filesystem can be predicted for filesystem files such as
    /(the root entry for any filesystem), last+found, etc. A clever hacker can open
    and alter files by node number instead of name. A great way to thwart this vulnerability
    is by randomizing a filesystem''s node numbers with the fsirand command. fsirand
    does not alter the visible filesystem, only its inode numbers. Filesystems must
    be unmounted before fsirand can run. Any filesystem altered by fsirand first be
    backed up with fsck run.


    Note


    fsirand functionality is present in mkfs in Solaris 2.5 and newer.


    47'
