  pgno: 140
- img_proc: true
  md: '# Figure 14.2. Split-Horizon DNS Architecture


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_141_0.png)


    Some important characteristics of this architecture include


    +   - The public xyz.com DNS server, as well as the systems *www*, *ftp*, and
    *mail*, are the only systems defined in the public xyz.com DNS server database.

    - Neither the internal DNS server(s) nor any internal servers or workstations
    are defined in the public xyz.com DNS database. From the perspective of the internal,
    the internal DNS servers do not exist.

    - reserver.com entries on internal servers and workstations point to the internal
    xyz.com DNS server(s).

    - The firewall allows the internal DNS server to query the Internet.

    - The firewall blocks queries and transfer requests from the Internet from reaching
    the internal DNS server(s).


    Follow this procedure for setting up a split-horizon DNS architecture.


    +   1. Set up external DNS server. Follow the procedure described in SunSolve
    publication DNS PSD/FAQ (Infodoc 11975, version 2.5, February 19, 1997), section
    3.7, "How to Set Up a Primary Server". Include in the zone files only the publicly
    hosts that need to be accessed from the Internet.

    2. Set up internal DNS server. Follow the procedure described in SunSolve publication
    DNS PSD/FAQ (Infodoc 11975, version 2.5, February 19, 1997), section 3.7, "How
    to Set Up a Primary Server". Include in the zone files all internal and external
    hosts in the network.

    3. Set up Internet firewall to block all TCP port 43 (DNS zone transfer) packets
    from the internal DNS server to and from the Internet. This will block all zone
    transfer attempts between the internal DNS server and the Internet.

    4. Set up the internal firewall to block all UDP port 43 (DNS query) packets to
    the internal DNS server from the Internet; the Internet firewall will permit UDP
    port 43 packets from the internal DNS server to the Internet. This will block
    all queries from the Internet to the internal DNS server, but will allow the internal
    DNS server to query the Internet.


    Note


    In an older variation of the split-horizon DNS architecture, the internal DNS
    servers would be set up with "forwarders" entries pointing to the external DNS
    servers.'
