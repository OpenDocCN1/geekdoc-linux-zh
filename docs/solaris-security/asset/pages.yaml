  md: "A directed broadcast packet is a packet whose destination IP address is the\
    \ broadcast address of a network. For instance, the broadcast address for the\
    \ class C network 10.31.6.0 is 10.31.6.255. Directed broadcasts are potentially\
    \ dangerous because they permit a single packet to be sent to all systems on a\
    \ network.\n\nWhen a Solaris system is configured to be a router, it should not\
    \ forward directed broadcasts. Add the following entry to the end of /etc/init/inet.\n\
    \n```\nndd -set /dev/ip ip_directed_broadcasts 0\n```\n\n# Configure Source Routing\n\
    \nA source-routed packet is a packet wherein the sender specifies the path by\
    \ which the packet will be taken to its destination, as opposed to letting routers\
    \ choose the best path. These are potentially dangerous because they permit an\
    \ intruder to launch an attack on a network. I recommend that the Solaris system\
    \ not forward source-routed packets. Add the following entry to the end of /etc/init/inet.\n\
    \n```\nndd -set /dev/ip ip_forward_src_routed 0\n```\n\n# Turn Off IP Forwarding\
    \ with /etc/notrouter\n\nIP forwarding can be disabled by creating the file /etc/notrouter\
    \ (Solaris 2.4 and newer) and rebooting the system. This is not foolproof, however,\
    \ as an intruder with root access can simply turn IP forwarding back on with the\
    \ netstat command.\n\nnetstat\n\nThe netstat command is used to examine network\
