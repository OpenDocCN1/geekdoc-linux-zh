    # Appendix F. Implementing C2 Security


    The Basic Security Module (BSM) package is Sun Systems'' implementation of C2
    security. This appendix describes the steps used to install, activate, and manage
    C2 security on a Solaris system. Why run C2 security? Primarily, C2 security enables
    the tracing of all system events back to specific users through the use of extensive
    audit trails. This appendix is an overview of C2 security. For complete information,
    consult the texts listed in the references at the end of this appendix.


    # What Is C2 Security?


    C2 security enhances system security and offers several benefits, including


    +   - Traceability of all system events back to specific users

    - Inability to abort the system using Stop-A (if a user''s stopping the system
    is a truly concern, then the system should also be in a locked room, since there
    is little that C2 security can do to prevent a user from simply turning the system
    off and on


    # Implications of C2 Security


    C2 security has several side effects (some people would call these detriments),
    including


    +   - The audit logs can consume a considerable amount of disk space (as much
    as tens or hundreds of MB).

    - The system will run slower by 5-10% due to the overhead of capturing and writing
    to the audit trail logs; a system "on the edge" from a performance perspective
    will appear to run much slower.

    - Volume manager is unavailable. This means that diskettes and CD-ROM disks are
    not automatically mounted when inserted into their drives. Instead, they must
    be mounted with the mount command.


    # Enabling C2 Security


    This section details the installation of the following packages from the Solaris
    OS media (these packages are installed by default unless excluded during an install
    or upgrade):


    +   - SUNWAR—Solar core architecture

    - SUNcsr—core SPARC

    - SUNWcu—core SPARC

    - SUNWea—header files

    - SUNWman—man pages


    Follow this procedure to enable C2 security.'
