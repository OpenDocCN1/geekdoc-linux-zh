  md: 'The most common weakness of NFS is that the NFS server shares its directory(ies)
    with too few restrictions.


    +   * Directories are available to too many clients (possibly altogether unrestricted)

    * Many directories are shared.

    * Directories are shared read/write when read-only would suffice.


    Refer to the share(1M) and share_nfs(1M) man pages for complete information.


    # Improving Security with NFS Mount


    An NFS client mounts directories shared by NFS servers with the mount command.
    Syntax of the mount command is


    ```

    mount -f NFS -o [rw|ro] [bg|fg] [suid|nosuid] [soft|hard] [intr|nintr] [sec=option]
    server:/directory /localdirectory

    ```


    Mount options are


    +   * rw—directory is mounted read/write (settings on NFS server will prevail).

    * ro—directory is read-only.

    * fg—if the first mount attempt fails, subsequent attempts will be made in the
    foreground (default).

    * bg—if the first mount attempt fails, subsequent attempts will be made in the
    background.

    * suid—UID execution is allowed (default).

    * nosuid—not allowed.

    * hard—continue to retry the mount until the server responds (default).

    * soft—return an error if the NFS server does not respond.

    * intr—client can interrupt processes (with a keyboard interrupt) waiting on a
    mount (default).

    * nointr—client cannot interrupt processes waiting on a mount.

    * sec—RPC security setting (can be one of none, sys, dh, kerb).


    Refer to the mount(1M) man page for a complete listing of options.

    Example mount command is


    ```

    mount - NFS -o ro,bg,sec=dh appserver:/d1/local /usr/local

    ```


    In this example, the client system wishes to mount the appserver directory /d1/local
    onto the local directory /usr/local, in read-only mode, DES authentication.

    The file /etc/vfstab is used to permanently set up NFS client mounts. The format
    of vfstab for NFS mounts is


    ```

    server:/directory /localdirectory NFS - yes options

    ```


    Here is an example /etc/vfstab entry.


    ```

    appserver:/d1/ /usr/local NFS - yes ro,bg,sec=dh

    ```


    In this example, the /etc/vfstab entry is corresponding to the preceding example
    mount command.


