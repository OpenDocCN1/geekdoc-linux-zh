    # ftfp


    Trivial file transfer (ftftp) is a host-to-host file transfer program similar
    to, but simpler than, ftp. ftp has no user or authentication mechanism. ftp is
    generally dangerous and, unless absolutely necessary, should be turned off. If
    ftp is a site necessity, limit its use to few systems (and never a system reachable
    from the Internet), and make sure it is restricted to use only a single directory
    with the -s /ftpasswd option. Modify /etc/net/inetd.conf as follows:


    ```

    tftp dgram wait root /usr/etc/in.tftp in.tftp -s /ftpboot

    ```


