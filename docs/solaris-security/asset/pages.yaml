    # Virtual Private Networks


    A virtual private network (VPN) is an encrypted network connection between two
    systems. A VPN allows parties to connect data via the Internet (or other public
    network) without fear of an eavesdropper recording and/or interfering with the
    connection. A system-to-system VPN is analogous to an encrypted telephone call—the
    parties on the call don''t have to worry about the presence of a wiretap since
    their conversation will be encrypted and virtually untouchable. Frequently, VPNs
    are more effective than dedicated data circuits. This is because each party needs
    only a dedicated connection through which they communicate. This becomes more
    cost-effective as the number of parties using VPNs increases.


