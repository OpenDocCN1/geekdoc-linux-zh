    # TCP Wrappers


    TCP Wrappers is a public-domain tool used to control systems (and, optionally,
    users on those systems) can access network services. TCP Wrappers is used to restrict
    inbound network access only, and when on certain services defined in the file
    /etc/inetd/inetd.conf. TCP Wrappers can be found at http://tcp.porcupine.org/pub/security/.


    # Converting a Service to TCP Wrappers


    It is easy to convert most services to TCP Wrappers. The following example shows
    how inbound telnet is converted to TCP Wrappers. This example assumes that TCP
    Wrappers have already been built and installed.

    Modify the file /etc/inetd/inetd.conf. The original entry for telnet


    ```

    telnet stream tcp nowait root /usr/sbin/in.telnet in.telnet

    ```


    The new entry for telnet is


    ```

    telnet stream tcp nowait root /usr/sbin/in.tcpd /usr/sbin/in.telnet

    ```


    The fundamental difference is explained: to respond an inbound telnet request,
    instead of running in.telnet, inetd runs in in.tcpd, the TCP Wrappers program,
    which checks its access control lists before launching the initial in.telnet program
    (only if it should).


    # Example: How to Restrict Telnet to Certain Systems


    TCP Wrappers uses the two files /etc/hosts.allow and /etc/hosts.deny to determine
    which systems and users should have access to which services. An example /etc/hosts.allow
    file follows.


    ```

    # /etc/hosts.allow file

    #

    in.telnetd: .sun.com, 207.127.1.1.

    ```'
