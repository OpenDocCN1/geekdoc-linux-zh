    # nisadded -d -t netmasks > /tmp/netmasks

    # vi /tmp/netmasks


    # nisadded -r -f /tmp/netmasks netmasks

    ```


    In this example, nisadded is first used to dump the netmasks table to a flat file;
    the flat file is edited, and nisadded is used to reload the netmasks table from
    the modified flat file.


    Note


    When adding or removing entries from the table passwd passwd, both the passwd
    and shadow tables must be dumped, edited, and restored. The proper sequence is


    ```

    # nisadded -d -t passwd > /tmp/passwd

    # nisadded -d -t shadow > /tmp/shadow

    # chmod 600 /tmp/shadow

    # vi /tmp/passwd /tmp/shadow

    ...

    # nisadded -r -f /tmp/passwd-passwd

    # nisadded -m -f /tmp/shadow -t passwd.org_dir shadow[44]

    # rm /tmp/shadow

    ```


    > [44] This

    command is shown without underscores so that the underscore is visible.


    # Back Up NIS+ Tables


    All NIS+ tables must be backed up at least once per day to be safe. Prior to a
    tape backup, run the nisbackup command. nisbackup creates a snapshot of all NIS+
    tables which can be handy during a recovery operation.


    # Flush NIS+ Transactions


    I recommend that the nisping -C command be executed periodically (at least once
    per day, but in a busy environment one or more times per hour) to checkpoint NIS+
    and flush all transactions to disk.


