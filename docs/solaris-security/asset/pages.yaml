    # Conventions Used in This Book


    # Commands and Filenames


    I emphasize commands and filenames within paragraphs with italics. For example,
    the file /etc/passwd contains system password information. The trap command is
    used to prevent premature exit. Commands and filenames outside of paragraphs are
    set in Courier font; for example


    ```

    share -F NFS -o rw=homeusers -d "Home Directories" /export/home

    ```


    Portions of commands indicating syntax (vs the actual intended content) are set
    in italics, as follows.


    ```

    share -F Ftype -o options -d description

    ```


    In the example above, Ftype, options, description, and path are to be replaced
    with actual values appropriate in practice (I will always point this out in the
    text where such examples occur in the book).


    # File Contents and Scripts


    Shell scripts and the contents of files are set apart from paragraphs and are
    set in Courier font. The following example user''s .profile file illustrates.


    ```

    .profile file for application users

    trap exit 1 2 3 15

    PATH=/export/app/bin

    exec /export/app/bin/application

    exit

    ```


    A sample /etc/default/passwd file appears as follows.


    ```

    #ident ":()passwd.dfl 1.3 92/07/14 SMI"

    MAXWEEKS=4

    MINWEEKS=1

    WARNWEEKS=3

    PASSLENGTH=6

    ```


    # Computer Sessions


    Examples of sessions with the computer are set apart from paragraphs and set in
    Courier font. Input from the user is underlined to distinguish it from computer
    output. An example session follows.


    ```

    % id

    uid=1001(jim) gid=101(users)

    % su bob

    Password: ********

    ```'
