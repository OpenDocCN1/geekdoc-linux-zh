- img_proc: true
  md: 'On the other hand, heavily used network services employ their own dedicated
    processes (daemons) that listen for and handle requests. This improves response
    time for those network services. Were inedt to directly handle a heavily used
    network service as sendmail, inedt would have to launch the sendmail process each
    time a mail message arrived! This would bring a heavily used mail relay system
    to a near standstill, so it would be spending nearly all of its time starting
    (and starting.) sendmail processes.


    # Routing


    For most UNIX systems, there is usually only one network router available to route
    packets to other networks. There are cases, however, where a UNIX system has more
    than one router from which to choose when making a packet delivery decision. Figure
    9.3 illustrates this scenario.


    Figure 9.3. Single and Multiple Routers and Networks


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_101_0.png)


    The case of a single router leading to all networks is solved with the use of
    /etc/ defaultrouter. For example, if the IP address of the router is 10.12.17.2,
    then /etc/ defaultrouter would appear as


    ```

    10.12.17.2

    ```


    The case of multiple routing to multiple networks is solved in one of two ways:
    static routes and dynamic routes.


    # Adding Static Routes


    Static routes are added manually to the workstation with the route command. The
    format of the route command is route add net-address subnet-mask router hops


    Note


    UNIX and network administrators must work together when setting up routes on any
    workstation so that its routing configuration matches the actual network topology.


    102'
