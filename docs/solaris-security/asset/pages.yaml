    # Chapter 6. System Startup and Shutdown


    This chapter details the mechanisms controlling system startup and shutdown.[1]


    > [1] For information on boot PROMs and how information in the PROM controls system
    startup, see chapter 3.


    # What''s in this chapter


    +   - The meaning of system run levels

    - The locations and identities of files controlling system startup and shutdown

    - Tools and techniques you can use to audit and modify these files


    # Why this is important


    A UNIX system administrator needs to understand the UNIX startup and shutdown
    mechanisms. Because these mechanisms are not universally understood, they could
    be the focus of attack or exploitation.


    # System Run Levels


    It is important to be familiar with run levels—what they mean, how to determine
    a system''s run level, and how to change the run level. This is because tasks
    of booting and shutting down a system are nothing more than controlling the system''s
    run levels. The active Solaris operating system is classified as running at a
    particular level. A run level describes a system''s availability to users—for
    instance, whatever services are available. For example, booting system from level
    0 (not running) to level 2 (multiseruser). Getting a system into maintenance mode
    is a change from level 2 (multiseruser mode) to level 1 (single-user mode). The
    run levels and their meanings are described in Table 6-1 and illustrated in a
    state diagram (see Figure 6.1). See the init(1M) man page for additional information.


    | Run Level | Description |

    |---|---|

    | 0 | Used to operate the system and bring it to the PROM firmware, where it is
    safe to power down the system. |

    | 1 | Single-user administrative/maintenance mode. |

    | 2 | Multiseruser mode; all facilities except NFS are available over the network.
    |

    | 3 | Multiseruser mode, including NFS. |

    | 4 | Not currently used by Solaris. |'
