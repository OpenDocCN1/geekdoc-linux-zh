  md: '# Create Incident Repon Team


    It is easy to do the wrong thing during a security incident. A UNIX administrator
    not familiar with the concept of the chain of evidence might accidentally destroy
    evidence or render it unusable in a court of law. The UNIX administrator (or his
    boss) might not call the right people during an incident, costing the organization
    valuable time.


    # System Filesystem Design


    How are the servers and desktop systems designed? Are clean segregation between
    OS partitions, home directories, and applications utilized? Are Solaris-furnished
    programs in /usr/bin and /usr/sbin modified or renamed? Are public-domain programs
    in /usr/bin or /usr/sbin?

    Why does this matter? This is an important aspect of system recovery. To be effective,
    a recovery must be executed quickly and accurately. A loosely managed system with
    locally tools and data files sprinkled here (particularly in directories intended
    for other purposes, such as Solaris binaries and data files) will be difficult
    to recover.


    **Recommendation:** In terms of the design and layout of individual desktop and
    server systems, I urge


    +   * Maintain a high degree of segregation between OS partitions and used for
    home directories and applications.

    * Install all tools and applications on a centralized server and mount the server(s)
    directories to local client.

    * Do not alter in any contents of /usr/bin or /usr/sbin; instead, put all local
    tools in a separate (preferably NFS-mounted) directory such as /local/bin.

    * Similarly, wherever possible do not use local tools'' configuration files; use
    a separate (preferably NFS-mounted) directory such as /local/etc.


    These recommendations lead to the following system procedure:


    +   1. Load OS from CD-ROM.


    +   2. Localize the system, preferably using a canned shell script. This should
    include all settings peculiar to the site such as specifying DNS and NIS servers,
    print queues, NFS/automounter settings, patch updates, etc.


    The same recommendations lead to the following system recovery procedure:


    +   1. Load OS from CD-ROM.


    +   2. Localize the system, preferably using a canned shell script. This should
    include all settings peculiar to the site such as specifying DNS and NIS servers,
    print queues, NFS/automounter settings, patch updates, etc.


    +   3. Recover home and application(s) directory(ies) from latest backup.


    These build and recovery procedures appear to be ridiculously simple, as well
    as they should be. They are the product of strict segregation of the OS from home
    and application directories and of a discipline to "leave the os alone" and when
    possible.


    # Filesystem Geometry


    A filesystem''s geometry is defined as the settings used by mkfs (make filesystem)
    to create the filesystem on a disk partition. mkfs generally does a decent job
    of setting up the right number of nodes and superblocks on a filesystem, but a
    skilled UNIX administrator can customize mkfs settings in order to squeeze more
    space or performance out of a filesystem.'
