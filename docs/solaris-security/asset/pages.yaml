    # Procedures for Changing OpenBoot Security Levels


    The following sections describe the procedure for changing OpenBoot security levels.


    # How to Set the OpenBoot Password from Solaris


    This example sets the OpenBoot password from Solaris (as root).


    ```

    # eeprom security-password

    Changing PROM password:

    New password:********

    Retype new password:********

    #

    ```


    # How to Set the OpenBoot Password from the OpenBoot Prompt


    This example sets the OpenBoot password from the OpenBoot prompt.


    ```

    ok password

    ok New password (only first 8 chars are used): ********

    ok Retype new password:********

    ok

    ```


    # How to Set OpenBoot Security Levels from Solaris


    This example sets the security level to command from Solaris (as root).


    ```

    # eeprom security-mode-command

    #

    ```


    If the OpenBoot password has never been set, eeprom will prompt for it, as in
    the first example above.


    # How to Set OpenBoot Security Levels from the OpenBoot Prompt


    This example sets the security level to command.


    ```

    ok setenv security-mode command

    ok

    ```


    This example sets security level to full.


    ```

    ok setenv security-mode full

    ok

    ```


