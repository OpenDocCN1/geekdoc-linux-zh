    % niscat -o passwd

    ...

    Access Rights : ---rmcmdr---r---

    %

    ```


    In this example of rights for the passwd table, principal nobody has no rights,
    principal owner has full read, modify, create, destroy rights, and principals
    group owner and world have read-only rights. Any NIS+ table can be queried for
    current rights.

    as long there are no rights for nobody, the only principals who can read the NIS+
    tables are those who have been given specific authorizations to NIS+.


    # Access Rights for Principal nobody


    Access rights should be extended to principal nobody only if NIS+ tables need
    to be read by NIS clients (typically SunOS) or unauthenticated clients. Recognize,
    however, that this will have a significant impact on security: anyone will be
    able to read the tables with read access extended to nobody.


    # NIS+ Security Level


    NIS+ should be run at security level 0. To change the security level, run the
