    # ### Why this is important


    User accounts lie at the very heart of UNIX system security. They are the first
    layer of defense against misuse and attack. It is necessary for a UNIX administrator
    to thoroughly understand what user accounts are and how they work.


    # ## Introduction


    People identify themselves to a computer via a *userid* (also known as UID). The
    computer systems we interact with grant access to information based upon userids.

    Comput grant access to information based upon who they think they are, not upon
    whom they actually are. Take, for example, a financial clerk who has access to
    bank account information. The clerk is logged into the computer system—that is,
    the clerk has identified himself by providing a userid and password. The computer
    then lets access. Let''s say that the clerk gets up to take a five-minute stretch—he
    walks away from his terminal. Anyone could sit down that terminal and enter transactions
    as though they were the clerk. The computer does not know the difference—it doesn''t
    know whether the person entering transactions is the original clerk who signed
    on early.


    # ## User Account Security


    The hacker who seeks information from a computer system needs only to find a way
    to trick either a person or the computer himself about her identity. Hackers are
    interested in the operating system'
