  md: '# Foreword


    The other day there was a news story about hackers who took over U.S. government
    Web sites. Most people probably thought of two things about this: that the hackers
    were very good, or that the government was really incompetent. And the story undoubtedly
    confirmed a widespread fear that cyberspace is a very bad neighbourhood where
    lawlessness and no one is safe. Are any of these beliefs accurate? Are all of
    them correct? As generally the case, none is completely correct, but all have
    an element of truth.


    We can address the first belief easily enough. In fact, it’s many who completely
    executed the designers. But such hackers are a small minority. Most are copycats—so-called
    “script kiddies”—who run programs that exploit known vulnerabilities—a large part
    of a running system on this point; and as we say, this is a very important matter.


    But if typical hackers are then the government—more accurately, the system administrators
    who ran the various machines—that bad? Again, this will become clear later. The
    last point—note that the Internet is inherently dangerous—is the most interesting.
    Translated into technical language, the same could be expressed somewhat differently—that
    the protocols used on the Internet are flawed and that if the designers had proper
    attention to security, we would have no any problems today. The corollary is,
    that with a bit of willpower, we could deploy newer and better protocols and fix
    the problem. As this quote from a Web page says, many businesses appear to support
    the idea.


    Our secure server software (SSL) is the industry standard and among the best available
    today for secure commerce transactions. It encrypts all of personal information,
    including credit card number, name and address, so that it cannot be read as information
    over the Internet.


    The context of this is an explanation of why it’s safe to shop on this particular
    Web site. The page goes on to cite the large numbers of people who have shopped
    without any problems. The implication that cryptography is both necessary and
    sufficient to resolve all concerns. That cryptography is needed beyond almost
    argument. Given the so-called “password sniffers”—avesdropping programs that pick
    up passwords in transit—there is little doubt that anonymous programs have been
    developed to steal credit card numbers. In fact, credit card numbers are easily
    recognized and can be contained in a large packet. But to defy the claim that
    cryptography is sufficient is ignorant.


    Ignoring the flaws in Web cryptography—those are inherent in the nature of human
    interactions when using the Web; it’s doubtful that any designers could have done
    better—the real threat comes from the company’s success in attracting so many
    credit card numbers stored on its sites by those who successfully access them.
    In others, the use of encryption and authentication—is all about that better protocols
    could allow for—the data in transit, but leave it unprotected on the destination
    host. If only other forms of cryptography can prevent all ways to hack into that
    host can we say that better protocols would do the trick. From other views, the
    secure Internet protocols are designed as well as they could be; if the Internet
    is a danger and then what is the problem? What is wrong with our security? That’s
    a trick question, the right question is, what is wrong with ours? While there
    are many problems attributable to the Internet itself—and these are the problems
    most easily fixed by cryptography—what we generally see is the use of the Internet
    to exploit such security problems. The distinction can be seen easily by asking
    this question of any security: If the Internet did not exist, could a local user
    exploit that hole to gain privileges? In cases, the answer is—in other words,
    the Internet has provided the access, rather than an inherent part of the problem.


    This realization—that security is the real issue—is the key to securing on the
    Internet. All cryptography in the world won’t protect a machine that is insecure.
    The trick, then, is how to protect hosts—and it’s not trivial.


    One solution, of course, is to limit what a host can do. If a program isn’t available,
    it isnt a security risk. But deciding what programs should and shouldn’t run on
    a given computer is a delicate task; one has to'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'balance functionality against security. Indeed, the intertwined nature of services
    on a modern operating system, programs you need won''t run without other programs
    you regard as more dubious. Thorough knowledge is necessary when making such trade-offs.


    The purpose of a firewall—primarily Internet security device we use today—is as
    dubious. firewall shields risky services from hostile outsiders, permitting them
    by presumably intruders. In others, there is the problem by limiting access, hence
    changing the risk/benefit equation. Firewalls, then, are not network security;
    they are communications interruptors. They limit access to risky services.


    From this we can see the limitation of firewalls: they don''t provide security
    for, anyone who can bypass them—an outsider who has found some way around or through
    the firewall—can exploit residual problems on nominally protected machines. Firewalls
    are quite valuable, but they cannot pennies, and must be properly placed to use.


    One point must be raised before we answer the questions posed at the beginning
    of this discussion is the nature of the holes they hold. It turns out that virtually
    all of them are bugs, either in code or system configuration. If we could eliminate
    bugs, we could eliminate almost all security problems, and the most would be fixed
    by cryptography.


    Of course, we can''t prevent every bug, especially in code supplied to us by others.
    But we can apply patches as they are developed. Most successful attacks, turn
    out, rely on known holes, which already exist. The case is virtual for all of
    the attacks launched by the script kiddies.


    Beyond, that system configuration can make a big difference. This is especially
    true for containing penetrations. For example, suppose that an intruder has gained
    access to a system. Can he or she be stopped at the point, before damage is done?
    That generally depends on whether or not the intruder can obtain root privileges,
    which is critically dependent on local system configuration


    Host security, then, rests on four legs: bug-free code and design, up-to-date
    patches, good configuration, and the proper balance between functionality and
    security. Three of these four are the responsibility of the system administrator.
    You cannot have a secure system with good system administration.


    Tough system administration is not easy. Apart from internal pressures—there is
    a perpetual tension between security on one hand and functionality and ease of
    use on the other—information is hard to come. Too many references are vague or
    general or try to cover too many platforms. But the devil is in the details, and
    a vendor-supplied upgrade can overwrite carefully tuned security mechanisms.


    Were the system administrators to blame for the break-ins we described earlier?
    We do not know. But if they were


    —Steven M. Belovin

    AT&T Labs Research


