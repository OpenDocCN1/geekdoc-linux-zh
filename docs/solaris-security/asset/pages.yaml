  md: '# Appendix C. Obtaining and Applying Solaris Patches


    Patches are used to repair software bugs and security holes. A patch is a group
    of files including a newer version of one or more operating system modules, device
    drivers, system programs or utilities, or configuration files. The newer version
    of the program, driver, or file contains a fix or repair of some kind intended
    to correct a vulnerability or malfunction. A system lacking the latest security
    patches is vulnerable to the latest hacking techniques.


    # Sources for Patch Information


    +   * SunSolve: http://www.sunsolve.com/ (web site for registered Sun maintenance
    customers, continuing whitepapers and patches; also, periodically mailed CDs containing
    same)


    +   * Sun Patch Club Report (weekly e-mail reports on Solaris patches): SunSolve-EarlyNotifier@Sun.com


    +   * Sun Security Bulletin: security-alert@Sun.com (periodic e-mail reports on
    Solaris security bugs and recommended fixes)


    +   * CERT (Computer Emergency Response Team, at Carnegie Mellon University):
    http://www.cert.org/


    +   * CIAC (Computer Incident Advisory Capability): http://ciac.iacnl.gov/


    # Understanding Solaris Patches


    Solaris patches are uniquely identified with a six-digit patch number and a two-digit
    patch version number. For example, patch 10242-03 is the third version of the
    patch 10242. Sun uses one numbering system for all versions of Solaris. Solaris
    patches are typically distributed as compressed tar archives. Example Solaris
    patch filenames are 10242-03.tar.Z, 10242-03.tar.gz, or 10242-03.zip.


    Note


    > The following procedure does not need to be performed routinely. It is included
    only for those who wish to understand Solaris''s patch architecture.


    To wrap a patch: create a new directory, copy the patch file to it, and run one
    of the following commands. Using our example Solaris patch filenames 10242-03.tar.Z,
    10242-03.tar.gz, and 10242-03.tar.zip.


    +   * For a patch filename ending in .Z, enter zcat file | xvf-, where file is
    the name of the patch file.


    +   * For a patch filename ending in .gz, enter zcat file | xvf-, where file is
    the name of the patch file.


    +   * For a patch filename ending in .zip, enter unzip file | xvf-, where file
    is the name of the patch file.


    Unwrapping the patch causes a directory to be created; the name of the directory
    is the same as the name of the patch, example 10242-03. The patch directory contains
    the files and directories:'
  merge: -1
  pgno: 178
- img_proc: true
  md: '+   • Install-info—a text file containing generic patch instructions.

    • README.patch (for example, README.106242-03)—a text file containing specific
    information about this patch.

    • One or more package directories, for example SunWacc. This directory contains
    updated Solaris files to be replaced.

    • installpatch—the patch install (obsolete in Solaris 2.6).

    • backpatch—the patch backup script (obsolete in Solaris 2.6).


    Patch history and backup information in /var/sadm/patch. This is the directory
    that grows as patches are installed (particularly if older versions of patches
    are not backed out).


    # Understanding Solaris Patch Clusters


    Solaris patches are collections of Solaris patches that are packaged for some
    common purpose. Examples of patch clusters include


    +   • Solaris 2.x or Solaris 7 recommended patches

    • Solaris 2.x or Solaris 7 patches containing security fixes (Sun includes security
    patches in its list of recommended patches)

    • Solaris 2.x or Solaris 7 Year-2000 patches


    Note


    The recommended patches are the most important patches and fix critical system
    and security holes. While the general set of recommended patches are interoperable
    and do not cause undesirable behavior, the experienced and wary UNIX administrator
    should be on the side of caution and proceed slowly and carefully when installing
    even recommended patches.


    # Sources for Patches


    Sun customers can access Sun''s complete patch archive at SunSolve Web site at
    http://solve.suncom/ (this gets assigned for site contracts once a Sun Solve contract
    is in force) to access all patches. Sun customers can also periodically receive
    SunSolve CDs, which include patches for current and some prior releases of Solaris.

    Users who are not on maintenance can access Sun''s publicly available patches
    on this same Web without having to log. Find the patches on the page and proceed.

    Sun''s publicly available patches are also available at


    +   • http://metalab.unc.edu/pub/suninfo/sun-patches/


    # Patch Installation Strategies


    Patches consume disk space—some lots of disk space—on Solaris systems. When installed,
    patch installation includes backup data, which is used to back out the patch in
    case problems are encountered with the patched version of any software.


    # Before Installing Patches


    Before you install patches, you should


    +   • Consider installing the patch on a test system to ensure that no unexpected
    behavior occurs.

    • Find and study all related README files. On a SunSolve Patch CD, they can be
    found:'
  merge: -1
  pgno: 179
- img_proc: true
  md: '+   ○ As the README FIRST at the topmost directory on the SunSolve Patch CD

    ○ As the file `<PKG>_README (example: 2.3_MCAD_GFX_README) for specific package
    or product patches; in the subdirectories of the SunSolve Patch CD:

    ○ As the file `<VER>-Recommended.README (example: 2.6_Recommended.README)

    ○ As the file `<PATCH>_README (example: 106242-01.README) in an individual patch


    +   3. Do a full backup of every system being patched.

    4. Back out earlier versions of the system patch. For example, if patch 106242-06
    is being installed on a system that contains patch 106242-05 (or any prior version),
    then patch 106242-05 (or any prior version) should be backed out.

    5. Reboot the system and stay in single-user mode. Be sure /usr and /var are mounted
    (in case the system does not mount them in single-user mode).

    6. Be sure no applications, database servers, etc. are running.


    # Patches to Install


    Every Solaris system should contain the recommended patches.\Sun''s other patches
    (not included in the Solaris patch clusters) are patches that should be installed
    only to counteract actual observed problems that the patch is designed to address.
    In other words, Solaris patches should not be installed because *they are reasons*.
    Reasons not to install patches on the recommended list include


    +   ● The problem that the patch was designed to solve may not be occurring on
    your system.

    ● A patch can introduce new problems or anomalies.

    ● Patches consume disk space.


    # Testing Patches


    Don''t assume that systems will behave normally after the installation of a patch.
    Patches should first be installed on a small number of systems, and then the systems
    should be tested to ensure that the installation does not cause any undesired
    behavior.


    # Patches Requiring System Reboot


    Read the `<PATCH>_README` in each patch to determine if any special procedures
    are required, such as a system reboot. In cases where a reboot is required, the
    reboot should be performed as soon as possible after the installation of *each*
    patch.


    # The patchdiag Program


    The *patchdiag* examines a local system to determine whether it needs additional
    patches or patch updates. A system''s complement of patches is compared to a data
    file of patches that can be downloaded from SunSolve. *patchdiag* is included
    in the SunSolve CD starting with Version 3.0.12 and is also available at SunSolve
    (available only to customers on current maintenance or support contracts).


    # Patch Installation Procedure, Solaris 2.x—2.5.1


    The `installpatch` and `backoutpatch` scripts, included with every patch, are
    used to install and remove patches. The `showrev -p` command is used to list the
    patches installed on the system.


    Note


    Do not use the `installpatch -d` when installing patches. This option does not
    save backout information needed to remove the patch later. The penalty for backing
    out a patch installed without the backout option is a complete OS install.'
