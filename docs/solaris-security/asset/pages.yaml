  md: '# Part 1: Introduction


    Part 1 illustrates how large the computer security problem is today. Chapter 1
    introduces a dramatized computer security incident and then explains how advances
    in technology have increased the complexity of system architectures and how new
    business paradigms have expanded the interconnectivity of computers and networks.
    These together have broadened and increased the risk of disruption of business
    operations to administrator errors and acts of malice by both insiders as well
    as those outside the company.


    Part I Introduction


    Chapter 1, "The Security Problem," shows the breadth of the security problem with
    an illustration and describes the factors for increased risk.


    Chapter 2, "The Security Paradigm," introduces new thought processes that will
    help the Solaris system administrator "take the blinders off" and operate with
    security as a part of every procedure and decision.


    # Chapter 1. The Security Problem


    Ted started paging at 6:30 A.M. on the first day of a four-day holiday weekend.
    Ted was staying in this town, and was on call for the UNIX engineering team, but
    didn''t expect any users to need help. He searched in the dark for the reliant
    and silent. Ted started to dodge, when his on-call autopilot kicked in. He sat
    up, turned on the light, and saw the pager message typed in the answering service
    that took-after UNIX support calls. The pager''s display reveal


    > !!!CANNOT LOG IN!

    DEMO IN 1 HR

    PH 01-32-49-47634


    Exclamation points always happen often, but when they did, all other work stopped
    until the emergency was fixed.


    The user was the president of engineering, Ted''s boss, in Brussels, Belgium,
    doing an important product for a large customer. The company''s future was riding
    on a sale that Ted''s boss was trying to create.


    Ted walked across the room to his UNIX workstation connected to the company local
