  md: "trap door\n\nSee [back door]\n\nTrojan horse\n\nA program containing a (usually\
    \ nefarious) purpose or some other world-writable directory. Its as perceived\
    \ or intended one.\nFor example\n\nA fake su is placed in /tmp or some other world-writable\
    \ directory. If root's PATH is incorrectly set to include \"\" (specifically,\
    \ if \" appears before /usr/bin), and if the UNIX administrator executes su while\
    \ in that directory, then the fake su will be the one executed—not the real su\
    \ in /usr/bin. The fake su would ask for the root password just like the real\
    \ su, but instead of suing, the fake su would e-mail the password entered to the\
    \ owner of the Trojan horse. Then the Trojan horse would execute the real su as\
    \ a means of concealing what happened (the UNIX administrator would probably think\
    \ he just mistyped the root password the first time).\n\nvirus\n\nA program that\
    \ inserts itself into an executable program, makes copies of itself, and through\
    \ its design is able to be moved from computer to computer. Viruses are found\
    \ on unprotected operating systems such as MacOS or MS Windows and do not pose\
    \ a significant threat to the UNIX community. See worm.\n\nwar dialing\n\nSetting\
    \ up a computer and sequentially call every phone number in a given prefix, recording\
    \ instances where computers were reached.\n\nwire tap\n\nThe act of physically\
    \ attaching connectors or other devices to a communications wire in order to intercept\
    \ communications traffic.\n\nworm\n\nA program that runs on a system, makes copies\
    \ of itself, and through its design is able to move (or be moved) from computer\
    \ to computer. Unlike a virus, a worm does not change other programs. The most\
    \ famous worm is the Internet Worm of 1988. See the references The Internet Worm\
    \ Incident and The Internet Worm Program: An Analysis listed in appendix D.\n\n\
    # Appendix I. Secure System Checklist\n\nThis appendix contains a checklist of\
    \ steps to perform on a new or existing system to ensure that it is secure as\
    \ possible. Each section references one or more sections in the book (the chapter\
    \ number is given first, then section title)\n\n+   1. (For new users) Load the\
    \ OS directly from an official Sun release CD-ROM. Make sure the system's partitions\
    \ are large enough for patches and OS upgrades.\n  - Save copies of all mkfs output\
    \ when building filesystems by hand. 16. Filesystem Geometry. A complete record\
    \ of all filesystems built during installation can be found in the file /var/sdm/system/logs/inst.log\n\
    \  - Do not install CDE, OpenWindows, or ToolTalk on servers. These packages have\
    \ security holes that are left off a server.\n  - Before connecting the system\
    \ to the network, install and run Tripwire in order to baseline the system before\
    \ tampering possibly occur. See 4, \"Tripwire.\""
