    # Direct Root Login


    For greater accountability, it is advisable that accounts never log in directly.
    Instead UNIX administrators should log in using their unprivileged accounts, and
    then use the switch su su command (explained below) to become root. This provides
    an audit trail of who became root in the first place. A system can be configured
    to restrict locations for which root can log in directly. This is controlled by
    the CONSOLE= setting in the file /etc/default/login (there will be a complete
    description of /etc/default/login later in this).

    To allow root to log in only at the system console, set CONSOLE=/dev/console in
    the file /etc/default/login. This seems appropriate in a setting where the system''s
    console is in a locked room. It would be better to prevent root from direct login
    everywhere; set CONSOLE=/dev/null in /etc/login, because every administrator who
    would need to be root should log in using his own ordinary account, and then su
    to become root. This forces accountability, since the system records who su to
    root.


