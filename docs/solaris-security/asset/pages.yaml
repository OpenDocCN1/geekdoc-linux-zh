  md: '# Filesystem Quotas


    A frequent source of grief for the UNIX administrator is the management of shared
    disk space. Users too often consume all available disk space, precipitating errors
    for everyone using that filesystem. Unfriendly users can disrupt others'' work
    by deliberately filling a filesystem with one or more large files. Disk quotas
    can be used to limit the amount of disk space each user is allowed to use. This
    is the procedure for setting up a filesystem for quota use.


    +   1. The option quota must be added to /etc/stab or the appropriate automount
    map. Here is an example vstab

    2. /dev/dsk/c0t1d0s7 /dev/rdsk/c0t1d0s7 /export/home ufs 2 quota

    3.


    +   4. As root, create a file called quotas in the root directory of the filesystem
    (in this case. /export/home/quotas). In this example, use the command touch /export/home/quotas.


