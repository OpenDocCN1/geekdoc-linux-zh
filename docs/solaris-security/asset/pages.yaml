  md: 'Using the Dynamic illustration in Figure 9.3 as an example, the UNIX workstation
    on the right-hand side of the illustration will be set up as follows:


    +   - The file /etc/defaultrouter would contain the IP address of one of the two
    routers—presumably the one leading to other networks, in this case 10.14.48.1.

    - To add a route to the second network, the following command line is to add to
    the end of the startup file /etc/rc.d/S72netsvc

    - route add net 10.15.0.0 255.255.0.0 10.14.48.2 1


    This effectively tells the UNIX workstation, "To reach IP network 10.15.x.x, send
    packets to route 10.14.48.2—and, by the way, network 10.15.x.x is one route hop
    away."


    # Adding Dynamic Routes


    An alternative to adding static routes with the route command is to run in or
    in rdisc. Either of these routing daemons is started at boot time by using the
    appropriate command line to /etc/rc.d/S72netsvc. The advantage of using these
    routing daemons is that the UNIX system only listen on the network for routing
    information packets and uses the information in those packets to dynamically update
    the system''s routing table. In a frequently changing network, this can be a boon
    to UNIX and network administrators because the UNIX system need not be reconfigured
    with new static routes each time the network topology changes; instead new routing
    information will reach the UNIX system automatically.


    # Warning


    > There is always a dark side to configurations and methods designed to save time
    and increase efficiency, and dynamic routing is no exception. An intruder can
    easily forge packets containing false routing information and send them to a UNIX
    system known to listen to routing information packets. This can be used to cause
    great harm to the organization that owns the system.


    This is a book on Solaris technology, not general systems administration. Here,
    discussions on how to set up dynamic routing will stop here. It should be enough
    for the UNIX administrator to know the pros and cons of static and dynamic routing
    and decide which is best for any particular environment. Further, the UNIX-network
    interactions can be so complex in the realm of network topology and routing that
    I could write several chapters on this topic alone. Please refer to "Where to
    Go for Additional Information" at the end of this chapter for references to books
