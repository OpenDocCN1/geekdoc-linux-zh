  md: 'This glossary contains a collection of the various types of attacks that can
    be launched upon a network, system, or organization. Examples follow many of the
    definitions.


    Note


    Hackers have proven themselves to be among the world''s most creative people.
    Hence, the following list will probably be obsolete by the time this book goes
    to press. The best way to stay on top of new forms of attack is to subscribe to
    CERT and other security alert mailing lists, as well to periodically visit security
    Web sites. Refer to appendix A for a list of mailing lists and Web sites.


    # Glossary


    back door


    Computer code written into an application that permits the application developer
    (or anyone else with the necessary knowledge) to gain access to information or
    application features without having to supply authentication information. Most
    applications'' back doors are placed intentionally for use during application
    development and debugging; generally speaking, back doors are present in production
    versions of programs because the application developer forgot to remove them.
    Back doors are also result of break-ins; left behind by hackers, they are the
    means for subsequent unauthorized returns to a system in order to facilitate illegal
    behavior.


    denial of service


    An event or action that prevents a system from providing its usual services. Examples


    +   - Sending hundreds or thousands of e-mail messages to a site in attempt to
    fill a mail server''s queue or to cause it crash

    - Consuming space in filesystems in order to prevent disk space usage

    - Sending phony routing information protocol (RIP) packets to a router in order
    to alter its routing tables and prevent it from functioning correctly (which would
    cause a loss of network connectivity)

    - Sending thousands of TCP SYN packets to a system in order to prevent it from
    being able to accept TCP connections

    - Shutting off a building''s electric power


    All of these examples rely on a common theme: consume one or more resources in
    order to prevent or disrupt the functioning of legitimate processes needing those
    resources.


    dictionary attack


    An attempt to break into a user account by guessing passwords from a dictionary.
    See also password cracking and password guessing.


    # DNS cache attack (also known as a poison cache)


    An attack on a DNS server where phony responses (to queries that were never sent)
    are sent to a DNS server in order to alter the DNS server''s cache. Since the
    DNS server answers frequently hits queries from its cache, responses to queries
    after the attack will be incorrect.


    The most common reason for a DNS cache attack is to cause the DNS server to change
    its responses. For example


    A hacker constructs phony DNS response packets and sends to sun.com''s DNS server.
    The hacker has built a Sun Microsystems Web server and is trying to corrupt Sun''s
    DNS server so that Internet queries will point to the hacker''s Web server instead
    of Sun''s Web server.


    197'
