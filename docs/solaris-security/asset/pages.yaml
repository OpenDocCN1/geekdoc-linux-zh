    # # Avoid Illic NIS Servers


    By default, NIS clients serve at boot time by broadcasting "are there any NIS
    servers out there?"; the client will bind to the first NIS server to respond,
    legitimate or not. Measures to control this


    +   - Don''t give root passwords to users of machines on your network. If some
    users have root passwords, consider moving their machines to a subnet (the point
    here is to prevent someone creating an unauthorized NIS server).

    - Use Tripwire, COPS, and other tools to audit filesystems and detect changes
    such as NIS client or server configuration.

    - Bind all NIS clients to known servers instead of having them broadcast to the
    entire subnet. This is done by running ypinit -c and ensuring NIS systems should
    bind to (decreasing order of preference). ypinit -c must be run when new NIS servers
    are built or when ones are decommissioned. Finally, any NIS server specified with
    ypinit must also be defined in /etc/hosts. Use rpcinfo commands to detect illicit
    NIS servers. An example dialogue follows.


    ```

    # rpcinfo -b ypvers 1

    128.116.71.18 dancer

    # rpcinfo -b ypvers 2

    128.116.71.18 dancer

    128.116.71.20 vixen

    128.116.71.76 prancer

    128.116.71.217 bob

    ```


    It is necessary to query for hosts running yp versions 1 and 2. In this example,
    the known NIS servers *dancer, vixen, and prancer* are listed (*dancer* is a SunOS
    server). Also present is the system *bob*, an end-user''s workstation, with no
    NIS server.


    > **Note**


    The **rpcinfo -b** commands shown above must be run on each subnet at the site.
    This is because the **rpcinfo -b** queries (as well as any system''s responses)
    generally will not cross subnet boundaries. The site''s network administrator
    should be consulted for confirmation.


    # # Keep Root and Other Administrative Accounts out of NIS


    The root account should always be *local*; that is, the root account should not
    be in NIS. The two most important reasons for this are


    +   - If the root password is discovered by an intruder, the intruder will have
    root access to all machines in the NIS domain.

    - If NIS or the network malfunctions, it may not be possible to log in as root
    on any machine in the domain.'
  merge: -1
