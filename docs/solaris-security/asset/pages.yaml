  md: '# ISS


    Internet Security Scan, or ISS, is a port scanning tool similar to Satan in that
    the tool scans systems or subnets looking for weaknesses that should be taken
    care of.

    ISS is available from ftp://coast.class.purdue.edu/pub/tools/unix/iss/


    Note


    The public-domain version of ISS has not been updated since 1995; its effectiveness
    has diminished since then. A commercial version with regular updates has replaced
    it at http://iss.net.


    # Intrusion Detection


    Upon reading the previous section, you might wonder whether an intruder could
    use these tools to discover weaknesses that could then be break into or otherwise
    disrupt a site. This is not only possible, but probable. Furthermore, hackers
    have far better than Satan and ISS for discovering a site''s security weaknesses.

    It is used to disable unauthorized data access, using devices such as firewalls
    and tools such as TCP Wrappers. Frequently, however, hacking attempts unnoticed
    until it was to a system or network, is a growing problem in the security tools
    arsenal and is maturing and getting the attention it deserves.

    One or more subtle intrusion detection tools should be used in any site connected
    to the Internet (inbound or outbound) be outfitted with one or more of these tools,
    and some "interior" servers, such as DNS or e-mail, should be configured as well.
