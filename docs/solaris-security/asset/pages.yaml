    # Filesystem Auditing Tools


    There are several tools available that enable the UNIX administrator to audit
    a filesystem. The tools that will be discussed in this chapter include Sun Microsystems''
    Automated System Enhancement Tool (ASET) and the public-domain tools Computer
    Oracle and Password System (COPS), Tiger, Tripwire, and lsof.


    # ASET


    ASET is a Solaris software package used to enhance security by checking the permissions
    and contents of system files. ASET can also be used to increase security on a
    system by tightening filesystem access permissions.


    # Where to Find ASET


    ASET is included in the standard Solaris 2.5, 2.5.1, 2.6, and Solaris 7 release
    media. The Solaris package name for ASET is `SUNWast`. Check for ASET on a system
    with the following command:


    ```

    # pkginfo | grep SUNWast

    ```


    # ASET Security Levels


    ASET has the following three security levels, each of which is suitable for different
    environments.


    +   **Low** no system behavior is altered. ASET only makes checks and reports
    weaknesses.


    +   **Medium** some system files'' access permissions are restricted in order
    to reduce the risk of attack.


    +   **High** many system files'' access permissions are restricted. This setting
    is the most secure, for use in Internet or Extranet mail, ftp, or Web servers.


    # Running ASET'
