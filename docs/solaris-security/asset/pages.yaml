    # Shell and Application Security


    # Forced Application Startup


    As UNIX applications get into the hands of increasing nontechnical users, UNIX
    administrators are frequently asked to restrict application users to their applications
    and prevent them from being able to reach a UNIX shell prompt. The example user''s
    .profile file illustrates.


    ```

    # .profile file for application users

    trap exit 1 2 3 15

    PATH=/export/app/bin

    exec /export/app/bin/application

    exit

    ```


    In this example, the trap command is used. This is a safeguard that tells the
    shell script .profile to exit (logging the user off) if an interrupt signal is
    received (such as typing ^C). This is not absolutely foolproof, as a lucky user
    might be able to interrupt .profile before the trap command is executed. If the
    application permits a user to run a UNIX shell, then this method is not completely
    foolproof. Another possible option is to change the user''s shell to the application
    itself. An example /etc/passwd file entries.


    ```

    bob:x:1018:101:Bob Jones:/home/bob:/export/app/bin/application

    ```


    This may or not work, depending on whether the application requires certain environment
    variables be set before execution. The UNIX administrator will have to weigh these
    options in deciding how to reliably restrict users to an application.


    # Include System Name in Root Shell Prompt


    Many UNIX administrators can attest to performing the correct operation on the
    wrong system. Frequently they forget which system they were on the time. The system
    name should be part of root''s shell prompt so that the UNIX administrator will
    never need to expend extra effort to see which shell she is.

    To put the system name in root''s shell prompt in Bourne shell (/bin/sh) or Korn
    shell (/bin/ksh), add the following to /.profile:


    ```

    PS1=''uname -n'' # ""

    export PS1

    ```'
