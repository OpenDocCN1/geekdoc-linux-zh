    **Permission Details: SetUID–File** The SetUID bit for a file is relevant only
    if the file is a program. SetUID is used to allow a user to assume the identity
    of a particular user regardless of whether he is running the program. This is
    useful in cases where only programs are allowed to access certain resources.


    As an example, /etc/shadow contains the encrypted passwords for all users on a
    UNIX system. For security reasons, no user should be able to write to, or even
    edit, this file. How, can a user change his or her password?


    The answer: A user can change as an ordinary user, but that has the ability to
    read and write to a file that others cannot read or write. In this example, the
    SetUID bit is the password word. SetUID is set to root (the SetUID allows root
    to modify the file). Because password is SetUID to root it is necessary when a
    user needs to change his or her password.


    As a security feature, an ordinary user cannot create a SetUID program. While
    a user can activate the SetUID on any file or program, the chmod command prevents
    the SetUID bit. This prevents a user from being able to create a SetUID program.
    Users can SetUID only on a program they own; once given away, the SetUID bit is
    cleared.


    **Permission Details: SetUID–Directory** Setting the SetUID bit on a directory
    has no effect on directory.


    **Permission Details: SetGID–File** The SetGID bit allows us to change its userid
    to that of another user, the SetGID allows a running program to change its groupid
    from that of the user running it to the groupid of the running program. This gives
    the program access to all files and directories owned by the group.


    **Permission Details: SetGID–Directory** When the SetGID bit is set on a directory,
    subsequent files and directories created inherit this group of the directory,
    not the group of the process creating the file or directory.


    The following sequence illustrates this mechanism.


    ```

    % id -a

    uid=1001(pete) gid=10(staff) groups=10(staff), 8(lp)

    % mkdir test

    % chgrp lp test

    % chmod 777 test

    % chmod +s test

    % ls -la

    total 32

    drwxr-xr-x 8 pete staff 512 Mar 6 21:03 .

    drwxr-xr-x 6 root root 512 Feb 3 21:37 .

    drwxrsrwswx 2 pete lp 512 Mar 6 21:03 test


    % cd test

    % touch newfile

    % ls -la newfile

    -rw-r--r 2 pete lp 512 Mar 6 21:04 newfile

    ```'
