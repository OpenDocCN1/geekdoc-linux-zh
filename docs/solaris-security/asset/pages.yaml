    - Chapter 8, "System Logs"


    # Chapter 3. The PROM, OpenBoot, and Physical Security


    The SPARC and UltraSPARC PROM and its software, called OpenBoot, are discussed
    in this chapter, as are issues related to a system''s physical security.

    **What''s in this chapter**


    +   - What the PROM is

    - What OpenBoot is

    - How to access OpenBoot

    - Why there are security implications to settings in OpenBoot

    - Things you need to know about physical security


    **Why this is important**

    Someone who can access OpenBoot or its settings can gain complete control of a
    computer system. There are steps you can take to protect a system from a physical
    access perspective.


    # What is the PROM?


    The Sun system PROM (PROM stands for *programmable read-only memory*) is a computer
    chip containing information and firmware. The information on the PROM includes
    the system''s hostid and several configuration settings such as the boot device
    and system boot parameters. The firmware on the PROM is called OpenBoot.


    # What is OpenBoot?


    OpenBoot is firmware that is part of all SPARC boot PROMs. It contains information
    about how a SPARC system is booted, plus built-in commands for testing the hardware
    on a SPARC system.

    **Note**


    References to OpenBoot commands and features apply to OpenBoot versions 2.0 and
    later. This book describes OpenBoot 2.0 (which first appeared on the SPARCStation
    2 system) and version 3.0.'
