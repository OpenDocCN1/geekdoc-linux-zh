  md: 'Even precarious examples of being held hostage by NFS include the following:


    +   - A user logs onto a server, which in some environments causes the server
    to NFS-mount the user''s home directory, which resides on his desktop. The integrity
    of the server now depends upon the integrity of a desktop system. The desktop
    could easily be turned off, possibly hanging the server.

    - In this case, your server depends on NFS in a different organization. The other
    organization, with goals and priorities of its, may fail to perceive the importance
    of the stability of your server which depends on it (your emergency may not be
    theirs).


    These examples drive home the following point: servers should not be NFS clients,
    particular of NFS servers not in your complete control.


    # NFS and Access Control Lists


    ACLs, explained in chapter 4, were implemented in Solaris 2.5 NFS clients which
    will use them. If an NFS server supporting ACLs encounters a client does not support
    ACLs, the ACLs will be bypassed and normal UNIX user/group permissions will be
    enforced. If an NFS client supporting ACLs mounts a filesystem from a server that
    does not support ACLs, then any ACL client settings will be ignored.


    # NFS on the Network


    Despite all of the remedies we have discussed, NFS traffic on the network is still
    in the—anyone with a sniffer in the right place can easily see and record all
    of the information being transmitted. This makes NFS over a public network (such
    as the Internet) especially perilous. There are at least two ways to remedy this:


    +   - Employ a SKIP tunnel (or other tunneling protocol) between the NFS server
    and each NFS client.


    > ¹ See the section on virtual private networks in chapter 13 for additional information
    on SKIP and IPSec.


    +   - Employ encryption technology at the network level (for instance, between
    the routers connecting the server and client).


    # Disabling NFS


    To disable NFS, refer to instructions in Table 13-2.


    # Autounter


    The autounter is a client-side enhancement to NFS. Instead of mounting all NFS
    filesystems at boot time, the autounter mounts NFS filesystems when they are needed
    and unmounts them when they are not. The autounter is configured with a set of
    maps that specify the mount points, the servers serving them, and any NFS options.
    The real power of the autounter lies in the ability to distribute the autounter
    maps via NFS or NIS+. Corresponding, there is no mechanism for distributing /etc/fstab
    (hard NFS) information via NIS or NIS+, thus the autounter security policies and
    practices apply only to the NFS or NIS+. Attention to share options, authentication,
    and basic file/directory permissions apply equally to NFS and Autounter. In addition
    to this, the following autounter features require attention.


    +   - Permissions of /etc/auto_map, /etc/auto_home, and any site-specific autounter
    map files. These should be owned by root, group bin, and permissions--rw-r--r--
    Remove the read-only bit for you if you do not want users see what can be mounted.'
