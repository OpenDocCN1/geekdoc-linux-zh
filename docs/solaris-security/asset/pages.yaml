  md: '# Ksh and umask -S


    The Korn shell has a nice feature with its built-in umask command. The -S option
    is used to symbolically—rather than numerically—display the user''s umask. For
    example


    ```

    % sh

    % umask

    0027

    % ksh

    % umask

    0027

    % umask -S

    u=rwx,g=rx,o=

    %

    ```


    # Default File Permissions and umask


    Permissions for files that are created with commands such as vi, cp, or touch
    with shell redirection are determined by applying the process''s umask value to
    the initial value 666. This is illustrated in the following example.


    ```

    % umask

    0027

    % touch foo

    % ls -ld foo

    -rw-r--r--  1 pete      staff  0 Oct 17:17 foo

    %

    ```


    In this example, the file''s permissions can be calculated as 666 (initial value)
    less 027 (umask) equals 640 (the file''s permissions).


    # Root User mask


    I recommend that root''s umask be set to 077 or 027. This will result in any file
    created by root being not readable or writable by others.


    # Default Directory Permissions and umask


    Permissions for directories created with commands such as mkdir are determined
    by applying the process''s umask value to the initial value 777. The following
    example illustrates this.


    ```

    % umask

    0027

    % mkdir foo

    % ls -la foo

    -drwxr-x--  2 pete      staff  0 Oct 17:18 foo

    %

    ```


    In this example, the directory''s permissions are calculated as 777 (initial value)
    less 027 (umask), giving 750 (the directory''s permissions).'
