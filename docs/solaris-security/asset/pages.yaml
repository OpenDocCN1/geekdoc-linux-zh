    # /etc/inetd.conf


    The /etc/inetd.conf file equates each service (by its name) with network services
    offered by the system. The file /etc/inetd.conf contains the configuration characteristics
    for each particular service needed to start that service.

    The file /etc/inetd.conf is a link to /etc/inetd.conf; /etc/inetd.conf exists
    for system-level compatibility with older versions of UNIX. The fields in /etc/inetd.conf
    are defined as:


    name protocol waitstatus user args


    where name is the name for the service; type is the name of these—stream, dgram,
    raw, seqpacket, or tli; protocol is one of the protocol types listed in /etc/inetd/protocols;
    waitstatus is either wait or nowait; user account which will run the path is the
    full pathname of the service (the value internal has a special purpose explained
    below); args contains all program arguments (starting with arg0, the program name
    itself).

    Here is a portion of /etc/inetd.conf file.


    ```

    #

    #ident "(#)inetd.conf 13 98/06/02 SMI" /* svr4.0 1.5 */

    #

    # Configuration file for inetd(1M). See inetd.conf(4).

    #

    # To re-configure the running inetd process, edit this file, then

    # send the inetd process SIGHUP.

    #

    # Syntax for socket-based Internet services:

    # <service_name> <socket_type> <proto> <flags> <user> <path> <args>

    #

    # Syntax for TLI-based Internet services:

    # <service_name> tli <proto> <flags> <user> <path> <args>

    #

    # Ftp and telnet are standard Internet services.

    #

    ftp stream tcp nowait root /usr/sbin/in.ftpd in.ftpd

    telnet stream tcp nowait root /usr/sbin/in.telnet in.telnet

    # Tnamed serves the obsolete I-116 name server protocol.

    ```'
