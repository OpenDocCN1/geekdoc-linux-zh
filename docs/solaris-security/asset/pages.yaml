    - routed—facilitates the exchanging of routing information in systems where the
    workstation itself is a router, or where the workstation is on a complex network
    with multiple routers providing connectivity to other networks


    # Unnecessary Services


    Solaris systems are equipped with a wide variety of network services, most of
    which are activated. It is in the best interests of each system (and its owner)
    that have nonessentials services deactivated. Refer to chapter 13 for information
    for disabling unnecessary network services.


    # Network Service Numbers


    Network services (also known as port numbers) are predefined in the Internet''s
    Request for Comments (RFC) 1700. For more information on RFCs, refer to the appendix
    on suggested reading.


    # Network Service Configuration


    Services are configured with two configuration files—/etc/inet/services and /etc/inet/inetd.conf.
    These two files work together to determine which network services are activated
    and how they are configured.


    /etc/inet/services


    The /etc/inet/services file equate each service name with a port number and port
    type. The /etc/services is a link to /etc/inet/services; /etc/services exists
    for system-level compatibility with older versions of UNIX. The fields in /etc/inet/services
    are defined as


    ```

    name port/protocol [aliases]

    ```


    where name is the name for service, port is the IP port number, protocol is the
    protocol used (either transmission control protocol [TCP]) or user datac protocol
    [UDP]), and aliases is an optional list of alternate names for the service.

    A portion of /etc/inet/services follows:


    ```

    #ident "@(#)services 1.1697/05/12 SMI" /* Svr4.0 1.8 */

    #

    # Network services, Internet site

    #

    tcpmux 1/tcp

    echo 7/tcp

    echo 7/udp

    discard 9/tcp sink null

    discard 9/udp sink null

    systat 11/tcp users

    daytime 13/tcp

    ```'
