    # How to Disable Un Services


    The following procedure is to identify and disable a service determined to be
    unnecessary.


    +   1. Use vi (or another editor) to comment the entry in the file /etc/net/services
    by prepending it with a # character. It would also be useful to add a descriptive
    comment to the line above the commented line, explaining of who is commenting
    it and why.

    2. Use vi (or another editor) to locate any corresponding entry in /etc/net/inetd.conf.
    A corresponding entry will begin with the name as the first field in the /etc/net/services
    file. Comment the entry by prepending it with a # character. Add a descriptive
    comment as in step 1.

    3. Locate the inetd process and send it a SIGHUP signal.


