    The remaining chapters in the book are primarily technical and written for the
    UNIX administrator. However, any IT/security administrator who needs to learn
    more about UNIX technology (in the security context) will find all of the technical
    chapters easy to read. Most chapters open with "What''s in this chapter" and "Why
