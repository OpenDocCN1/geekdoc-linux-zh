  md: '# Patch Installation


    To install a single patch on a system, use the following procedure.


    +   1. Enter the command `mkdir tmp/patch`.

    2. Copy the patch file to the directory `/tmp/patch.

    3. Uncompress the file with `uncompress` (if the patch filename ends with .Z),
    gunzip (if the patch filename ends with .g2), or unzip (if the patch filename
    ends with .zip).

    4. Unwrap the patch file with the `tar` command. For example, if the patch filename
    is 106545-03.tar, the command would be `tar xf 106545-03.tar`.

    5. Install the patch with the `patchadd` command. For example, enter the command
    `patchadd /tmp/patch/106545-03`.

    6. Examine the patch installation log. To continue this, the log file is `/var/sadm/patch/106545-03/log`.


    # Bulk Patch Installation


    To apply many patches at once on a system, use the following procedure.


    +   1. Enter the command `mkdir /tmp/patch`.

    2. Copy all patches to the directory `/tmp/patch`.

    3. Uncompress the patch file with `uncompress` (if the patch filename ends with
    .Z), gunzip (if the patch filename ends with .g2), or unzip (if the patch filename
    ends with .zip).

    4. Unwrap the patch file with the `tar` command. For example, if the patch filename
    is 106545-03.tar, the command would be `tar xf 106545-03.tar`.

    5. Install the patches with the `patchadd` command. For example, enter the command
    `patchadd -M /tmp/patch/106545-03/patch/107436-01 /tmp/patch/108974-02`.

    6. Examine the patch logs logs.


    To apply many patches at once on several systems, use first `rdist` (or similar
    tool) to distribute patches to all of the systems; then use `rsh` or `sh` to execute
    patch.

    Although it may be potentially time consuming to do so, you should examine the
    logs for all patch installs on all systems for errors.


    # Solaris Upgrades


    Because patches are specific to a particular version of Solaris, an OS upgrade
    removes the patch by removing `/var/sadm/patch`. Thus, when upgrading Solaris,
    you are starting with a clean system in regard to patches. Although you might
    be thinking about all the disk space that was recovered by the upgrade removing
    those old OS patches, keep in mind that the new version may consume space over
    time.

    When installing or upgrading to a new version of Solaris, you should immediately
    install any patches for maintenance updates on the release CD. Also, you should
    acquire the latest recommended patches for the new Solaris and install them.


