  md: '# DNS rogue server


    Not really a direct attack, but a case of running a phony DNS server, presumably
    hoping that systems will query it and get phony answers back. This can cause clients
    to use the wrong servers for higher-level services such as the World Wide Web,
    e-mail, or news.


    # dumpster diving


    Going through a company''s trash (or recycle) bins in order to retrieve documents
    (or equipment) yielding clauses about the company''s computing and network infrastructure.
    The worst possible discovery would be a printout (or sticky note) containing a
    password.


    # e-mail message source routing


    Sending e-mail to a site address that forces the site to forward the message to
    its destination.

    For examplenA troublemaker sends e-mail to joe%mycompany.com@yourcompany.com.

    The message is first sent to mycompany.com, and then forwarded to mycompany.com,
    and delivered to joe.


    # forward attack, form 1


    Hacking a user''s world-writable .forward file in order to fold sendmail into
    executing any command on behalf of the user. For example


    A hacker changes the user sue''s .forward file to contain the:


    ```

    \user

    |"cp /bin/sh /home/sue/su-sh;chmod u+s /home/user/sue-

    sh"

    ```


    and then sends mail to sue. The command sequence above is then executed.

    The command creates a version of sh that runs as user sue.


    # forward attack, form 2


    A special form of a denial of service attack; for example


    A mail server NFS-mount home directories from end-user workstations in order to
    read users'' .forward files. A clever user can turn off his workstation; the next
    time someone sends mail to that, the mail server may hang while trying to mount
    the user''s home directory cannot be mounted because his machine has been off.
    See "Implement ForwardPath" in chapter 11 for information on how to prevent this
    type of attack.


    In a variant of this attack, a user turns off his workstation and hundreds or
    thousands of e-messages to be sent to his system. This causes the process table
    (or virtual memory) on the mail server to completely fill up, effectively hanging
    the system. This is because the sendmail processes (for each mail message generated)
    cannot open his .forward file, and so the sendmail processes sit and wait. This
    is an especially troublesome attack since, upon reboot, sendmail again attempts
    to process the huge mail queue and potentially fills the process table again.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# IP address spoofing


    Configuring a system that its stated IP address is that of another system. This
    is done in an attempt to break into a system in cases it is suspected of trusting
    another. For example


    A server named pumpkin at IP address 11.40.34.16 (via an *hosts* file) another
    server, named melon, at address 11.40.36.18. An intruder, suspecting this trust
    relationship, configures his system so that the "from" IP field in packets it
    sends to pumpkin is really what he could, for instance, construct a phony *rsh*
    packet in an attempt to fool pumpkin into thinking that phony packets were being
    sent from melon; if successful, the intruder’s phony commands might get out on
    pumpkin.


    # LD_LIBRARY_PATH attack


    Some programs use shared libraries (those files with names ending in .so, found
    in the /usr/lib,/usr/open/lib,/usr/lib directories); the LD_LIBRARY_PATH variable
    is used by these programs to figure out which shared library routines to use and
    in what order. The LD_LIBRARY_PATH attack is a special kind of Trojan horse attack,
    similar in fact to one where the PATH statement is used incorrectly (*Trojan horse*
    and its example in this section). Works by taking advantage of an error (usually
    by a UNIX system administrator) in the LD_LIBRARY_PATH environment variable, so
    that Trojan library routines are used instead of the intended library routines.


    # logic bomb


    An otherwise legitimate program is contaminated with a section of code designed
    to do nothing until a specific condition is met. (See also time bomb.) For instance


    > A shell script launched by *cron* detects the presence of the file /tmp/halt
    and halts the system.


    # MAC address spoofing


    Configuring a system so that its MAC address is the same as that of another system
    on the network. would disrupt any attempts to communicate with the correct system,
    particularly if the masquerading system is faster than the real one.


    # NIS/ NIS+ server spoofing


    In an environment where NIS/NIS+ clients bind to servers by sending NIS broadcast
    packets, a devious person could create a phony NIS/NIS+ server to prevent NIS/NIS+
    clients from connecting with legitimate/NIS+ servers.


    # password cracking


    Obtaining an /etc/passwd, /etc/shadow, or NIS/NIS+ password file containing encrypted
    passwords. An intruder would then run on these passwords in an attempt to discover
    account passwords by brute force. See also dictionary attack.


    # password guessing


    A very low-tech form of password cracking where an intruder is trying to guess
    a user''s password by using information the intruder may know about the user (such
    as birthdays or children''s or spouse names). See also dictionary attack.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# port scanning


    Running a security tool such as Satan or ISS against a system (collection of systems
    on a network) in order to discover what vulnerable network services are configured
    on the system(s).


    # program buffer overflow


    Overflowing a program''s input buffer in a way that causes executable code to
    be copied into the stack and subsequently executed. A well-known example is the
    *finger* exploit used in the Internet Worm incident. Refer to the two papers on
    the Internet Worm in appendix D.


    # session hijacking


    Listening to a session between two computers and then injecting packets (one or
    both directions) in an attempt to alter the outcome of the session. This is also
    known as a *sequence number attack* because the intruder must try to guess the
    next sequence numbers in the connection stream in order to quickly forge packets
    with those sequence numbers.


    # shoulder surfing


    Looking over a person''s shoulder when that person is typing in a password. This
    is why it is proper etiquette to literally turn back when another is entering
    a password. This is a subtle form of *social engineering*.


    # snooping


    Using a program such as *snoop* in order to capture and record network packets
    containing passwords and sensitive information. A fine example can be found in
    chapter 9 in the section on *Snooping*, where a *telnet* session account password
    is being captured.


    # social engineering


    Using the phone, e-mail, or other means to convince an unsuspecting individual
    to yield sensitive information or commit a foolish act. For example


    > Intruder, calling the Helpdesk":"Hello, this is Phil Jones. I''m out of town
    and need to get in to a report. I have a noisy line or have fat-fin-gered my password—could
    you reset it for me?


    > Helpdesk":"Sure, no problem. I''ve changed it to "martini.\ Be sure to change
    the password to something once you log in."


    > Intruder":"Thanks a lot. This really helps. Good-bye."


    > Intruder, calling department admin":"Hello, this is Phil Jones. I''m out of
    town and need to get in to get a report. I''ve lost the access number, can you
    give it to me?"


    > Admin":"Sure, it''s 801-555-1234."


    With just a couple of calls, the intruder was able to get the remote access phone
    number and get a user''s password changed to a known value. Within minutes the
    intruder will be logged into the system with a legitimate user account and password.


    # time bomb


    An otherwise legitimate program is contaminated with a section of code designed
    to do something nasty when a specific date or time occurs. Also see *logic bomb*.'
