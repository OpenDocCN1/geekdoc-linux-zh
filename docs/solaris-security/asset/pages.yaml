  md: 'The ndd command is used to examine and change network device driver characteristics.
    Most of the settings that can be changed in the network drivers are not security
    related but are instead involved with network tuning. However, there are a few
    settings that the security-conscious administrator needs to know about. I describe
    them in the following sections.


    # Note


    The ndd settings described here are related to packet routing on a network. These
    settings, some of which may alter the behavior of the network, should be coordinated
    with the LAN administrator.


    # Warning


    Sun does not publish the /dev/ip and /dev/tcp tunable parameters; they may change
    any time.


    # Configure IP Forwarding


    IP forwarding is a characteristic of a Sun workstation acting as a router; in
    other words, a workstation having connections to two or more networks and forwarding
    network packets between them. With inexpensive routers available, a UNIX workstation
    gets into service as a router. It may still be common for a UNIX workstation to
    have connections to two or more networks—not for the purpose of being a router,
    to give nodes on the two or more networks access to the service offered by the
    workstation. Figure 9.1 illustrates this distinction.


    Figure 9.1. Workstations with Multiple Network Connections


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_91_0.png)


    The Solaris network drivers give the workstation connected to two or more networks
    the ability to act as a router and forward packets. This is accomplished with
    the ndd command, shown in these examples.[2]


    > [2] The usual underscores in these examples is omitted because the underscores
    would hide the underscores in the commands themselves; i.e... "ip_forwarding."'
