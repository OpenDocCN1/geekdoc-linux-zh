  md: 'Individual users, called userids, are defined in the system''s/etc/passwd file
    or in the NIS passwd or passwd.org databases. People logging on to a UNIX system
    identify themselves with a userid and their corresponding password.


    Each user is defined as a member of a group; this group is defined in the /etc/passwd
    or the NIS passwd or passwd.org_databases. In addition to a primary group, a user
    can belong to secondary groups. These groups of users are defined in the /etc/group
    file or in NIS+ group databases. The /etc/passwd and /group files (and their NIS
    and NIS+ counterparts) are described in chapter 5.


    # Permission Summary: Read, Write, Execute, SetUID, SetGID, Sticky Bit


    The basic permissions allowed for a file or directory in UNIX are read, write,
    or execute (the term is used in place of process or directory—more than one).
    There are special permission parameters known as SetUID, SetGID, and Sticky. This
    section describes the details of each type of permission for files and directories.


    The terms read, write, bit and so on refer to how UNIX stores information about
    file permissions. Each item, such as read, is stored as one bit. Since a bit of
    computer information can only be 0 or 1, you can think of this bit as a flag;
    either the flag is on (if it is set to 1)—allowing or the flag is off (if it is
    set to 0)—denying.


    The term refers to how a process can run on a UNIX system. Programs, processes,
    typically read or write files on a UNIX system. The term process and group can
    be used interchangeably here. In the context of file permissions, you can think
    of a process in terms of a user. A user must run some process in order to access
    a file, even if the process chosen is cat (which outputs the contents of a file)
    or vi (an editing program used to view or edit the contents of a file)


    **Permission Details: Read**—File will be able to read the contents of a file.


    **Permission Details: Read**—Directory is a special file in a special format,
    consisting of filenames and inodes. For example, the ls program will be able to
    list files within a directory with the read bit set reside.


    **Permission Details: Write**—File will be able to replace or append the contents
    of a file. This includes removing the contents of the file by deleting it/dev/null.
    The file cannot be removed—that depends on the permissions of the directory containing
    the file.


    **Permission Details: Write**—Directory will be able to create or remove files
    or directories residing in the directory. Files in the directory cannot be overwritten
    (unless their permissions allow it), they can be removed and recreated.


    More clarification: A user with access to a directory can remove files from that,
    regardless of whether they have permission to write (or even read) files. Removal
    of a file is an action taken on the directory containing the file, not on the
    file itself.


    **Permission Details: Execute**—File can be executed if it is a program. If the
    file is not a program, it cannot be.


    > Permission Details: Execute—Directory must be read in order to obtain a list
    of the files contained in it. With only the execute bit set on a directory, it
    is still possible to open a file or directory within that as long as the process
    knows the exact name of the file or directory and as long as permissions on the
    file or directory itself permit.


    This characteristic of permissions—the capability of allowing a process to open
    a file or directory while simultaneously denying the ability to list that directory’s
    contents—can be used to effectively hide entire directory trees, from unprivileged
    users. (Since the root userid accesses files and directories without consulting
    the read or write bits, this method should not be considered hacker-proof, but
    only as one means for slowing down unauthorized users.)


    Here’s how it works: consider the directory /home/phil/dbdb1998 which contains
    the files file1.txt and file2.bit (see Figure 4.1).


    ```

    ¹) If the file is a script, the execute bit will prevent it from being run, but
    the only way in which it can be run. A shell script with an execute can be executed
    (that is, by typing its name at a prompt). A script file without an execute can
    be read by running the shell with the name of the file as an argument. For shell
    script count.sh no execute bits can be run by typing count.sh

    ```


