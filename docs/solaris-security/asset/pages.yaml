    # Files Access Control Lists


    UNIX system administrators find that the UNIX file and directory permission scheme
    is insufficient in complex environments. Aspects of managing access to files and
    directories do not translate well to large environments. Consider the following
    scenario.


    A medium-sized company has several departments. Access control has been set up
    so that UNIX groups correspond to the different departments. Default file permissions
    are set up so that only users and groups can read and write to files and directories;
    thus, files and directories in one department are unavailable to all others. How
    users share files in their departments with certain individuals in other departments
    without resorting to read or write in bits? Answer: It cannot be done.


    Solaris access control lists (ACLs) can help manage this problem. The getfac and
    setfac commands are used to get and set ACL entries for files and directories.
    The command to set ACL entries for a file or directory is used to change ACL permissions.
    From our example, consider a specific file cust.db has the following permissions:


    ```

    ls -la cust.txt

    -rw-r--r-- 1 jsmith acct 65536 Jan 22 1999 cust.db

    %

    ```


    In this example, cust.db is owned by user jsmith. Both user jsmith and group acct
    read/write access to cust.db. No other users have access whatsoever to it. Consider
    a situation where sjones need read/write access to cust.db, but where sjones is
    not a member of the group group. A possible solution is to use setfacl to add
    sjones as a user with read/write access. The following session illustrates this
    situation.


    ```

    ls -la cust.db

    ```'
