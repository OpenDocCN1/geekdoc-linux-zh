  md: '# Writing Directly to the Console


    Some environments require the ability to write messages directly to /dev/console
    rather than using syslog or other standard message mechanisms. UNIX will find
    that, in changing permissions of /dev/console from its default of 0600 to something
    like 0620 (/dev/console writable by group) or 0622 (/dev/console writable by other),
    these permissions will "stick" until the user logs off, at which time /dev/console
    permissions revert to 0600. The sysadmin may be tempted to write some of a workaround
    such as adding chmod 0622 /dev/console to a user''s profile or login, which is
    a less-than-satisfactory method. There is an acceptable way of doing this, however,
    the file /etc/logindperm is used by the login program to change permissions of
    several console devices such as the keyboard, mouse, frame buffer, and sound.
    Any entry can be added to /etc/logindperm to allow nondefault permissions for
    /dev/console. A sample entry might be


    ```

    /dev/console      0622      /dev/console # change default console mode

    ```


    In this example, login will change the permissions of /dev/console to 0622 (read,
    write by owner; by group and other).


    > Note


    This information is provided only for those canned or preexisting applications
    that require this functionality. Any new application or tool should not be designed
    for I/O to /dev/console; use a secure and flexible alternative such as syslog
    instead. Because /dev/console is not meant to be written by others, Sun Microsystems
    cannot support system behavior associated with such a change.


    # Program Buffer Overflow


    One of the common threads in UNIX security bugs is to do program buffer overflows.
    Many of the common UNIX commands have been victims of buffer overflow bugs. An
    intruder will discover a way of overflowing a buffer on a particular command in
    such a way that executable code is spilled into the stack. This executable code,
    written by the intruder, will contain instructions to give him root access or
    to cause some other form of trouble. Solaris can be configured to prevent stack-based
    buffer overflows. The procedure is


    +   1. Add the following lines to /etc/system:

    2.

    3. set noexec_user_stack=1

    4. set noexec_user_stack_log=1

    5.



    +   2. Restart the system with the init 6 command.


    Any attempts to execute code in the stack will be logged by syslog if syslog''s
    kern facility is set to the notice (or higher) level. Refer to chapter 8 for more
    information on syslog. An example log message follows:


    ```

    a.out[347] attempt to execute code on stack by uid 555

    ```'
