  md: 'NIS''s purpose is the centralization of information found in the following
    files:


    +   - Password information in /etc/passwd /etc/shadow

    - Group information in /etc/group

    - Hosts (names and IP addresses) information in /etc/net/hosts

    - Various network configuration information in /etc/net/networks, /etc/net/services,
    /etc/net/protocols, /etc/arp/ethers, /etc/net/netmasks, /etc/bootparms, /etc/publickey

    - Network group definitions (for which there is no-NIS implementation)

    - Automount tables (/etc/auto_master)

    - E-mail aliases and settings in /etc/mail/aliases and sendmail variables


    Any or all of these settings can be centralized with NIS. Each client can be configured
    to read the NIS tables or its own flat files; this is controlled by the /etc/nsswitch.conf.
    Here is an example /etc/nsswitch.conf file for a NIS client.


    ```

    #

    /etc/nsswitch.nis:

    # An example file that could be copied over to /etc/nsswitch.conf; it

    # uses NIS (YP) in conjunction with files.

    # "hosts": and "services": in this file are used only if the

    # /etc/netconfig file has a "-\-" for nametoaddr_libs of inet

    transports.

    # the following two lines obviate the "+entry" in /etc/passwd and

    /etc/group.

    passwd files nis

    group files nis

    # consult /etc "files" only if nis is down.

    hosts: nis [NOTFOUND=return] files

    networks: nis [NOTFOUND=return] files

    protocols: nis [NOTFOUND=return] files

    prpc: nis [NOTFOUND=return] files

    ethers: nis [NOTFOUND=return] files

    netmasks: nis [NOTFOUND=return] files

    bootparms: nis [NOTFOUND=return] files

    publickey: nis [NOTFOUND=return] files

    netroup: nis files

    automount: files nis

    aliases: files nis

    # for efficient getservbyname() avoid nis

    services: files nis

    sendmailvars: files

    ```


    See the section on name service files later in this chapter for additional information.

    While NIS is not particularly secure, I will discuss several steps that can be
    taken to strengthen NISnsecurity in the NIS security weaknesses and solutions.


