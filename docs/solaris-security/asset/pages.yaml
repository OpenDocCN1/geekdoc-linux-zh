    # How Network Services Are Started


    The Internet server process inetd is started when the system is booted. The bootstrap
    script /etc/rc.d/S72inetsvcs starts the inetd process. inetd reads the configuration
    files at /etc/inet/services and /etc/inetd.conf and then listens for connection
    requests from other computers over the network. The inetd process simultaneously
    listens on all ports defined in /etc/inet/services.

    If a connection request arrives undefined (not defined in /etc/inet/services),
    then no service is started. The requesting client receives a "connection refused"
    message.

    When a request arrives on a defined port (one defined in /etc/inet/services and
    /etc/inetd.conf), inetd will launch the service by starting the program listed
    in the path field in /etc/inetd.conf (the program will be run as the user specified
    in /etc/inetd.conf). The new program will communicate over the network to the
    computer that originally requested the service.

    Some services have the world internal in the path field in /etc/inetd.conf. When
    a connection request arrives for these services, inetd does not start another
    process, but communicates over the network to the requesting computer directly
    (in other words, the network service functionality is built into inetd). Only
    services that can be processed quickly are done using this method. Examples include
    echo, charge, and discard.


    # Daemon Network Services Not Started with inetd


    It is possible common to start network services without inetd''s help. An example
    of these services is sendmail.

    Sendmail is used to send and receive email, independently of inetd by its own
    rc file, S8sendmail. The sendmail daemon listens on port 25 (as defined in /etc/inet/services)
    and manages its network communications. The inetd process is never involved in
    sendmail configuration or communications.

    Here are examples of network services that run without inetd and what would happen
    if they are used.


    +   - DNS, started by S72 inetsvcs

    - NIS, started by S71rpc or S71yp

    - NIS+, started by S71rpc

    - NFS, started by S15nfs.server

    - in.routed, started by S72inetd


    What does this mean? The inetd process is used to manage commonly used services,
    but not heavily used ones. Heavily used services listen on ports using dedicated
    daemon processes that are running all the time (the assumption that inetd has
    the spawned process servicing the request after fulfilling it).

    This is really a matter of system efficiency. For services not heavily used, inetd
    is a single process listening on a multitude of ports, that a multitude of daemon
    processes do not have to. This saves space in the system''s process table.'
  merge: -1
