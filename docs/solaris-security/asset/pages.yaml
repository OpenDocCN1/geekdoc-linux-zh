    # # System Shutdown


    This section describes the steps performed during a shutdown procedure.


    # # init


    When a system administrator shuts the system with a shutdown or init 0, the command
    first launches the script /etc/rc0. In a manner similar to startup, /etc/rc0 executes
    shell scripts in certain directories. They are as follows:


    +   - /etc/shutdown.d (this is for historical reasons only, and is usually empty).
    Shell scripts are passed the single argument option.

    - /etc/rc0/d*. Shell scripts are passed the single argument stop.

    - /etc/rc0/d/S* (usually nothing). Shell scripts are passed the single argument
    stop.


    Next, /etc/rc0 attempts to kill all processes with the killall command, by trying
    to kill all processes "gently," and then more forcefully. /etc/rc0 dismounts all
    filesystems (except root).


    # # uadmin


    init finally runs the uadmin command. uadmin performs the final few steps of system
    shutdown:


    +   - All processes are killed.

    - The filesystem cache is fleshed.


    > [2] The filesystem cache may contain writes to the disk(s) that have not yet
    been written to the disk itself. It is important to complete these writes in order
    to ensure integrity of filesystem information.


    +   - The root filesystem is unmounted.

    - The processor is halted.


