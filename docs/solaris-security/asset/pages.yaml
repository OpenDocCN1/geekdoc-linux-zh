  md: '# Chapter 2. The Security Paradigm


    Most UNIX administrators do not know where to begin when it comes to securing
    their systems. Some begin by installing one or more public-domain security tools
    on their systems; others modify their systems to make them less vulnerable; and
    still have relatively open systems inside a very secure facility. None of these
    methods offer adequate protection by themselves. They are piecewise; they don''t
    fit into a strategy; and they don''t reflect any overall approach or design. Moreover,
    they don''t reflect the attitude required for long-term success.


    Before any systems, firewalls, or architectures can be changed, security principles
    must be developed, understood, and embraced by the administrators and managers
    who are responsible for them. This chapter is devoted to the introduction and
    justification for these principles.


    # Principle 1: The Hacker Breaks into your System Will Probably Someone You Know


    While many hackers are nameless, nameless individuals in time zone or on another
    continent, statistics reveal that most security incidents are inside jobs. What
    is an inside job? It does sabotage in one form or another. Examples include


    +   - Sabotaging backup processes to give the appearance of normal backups (but
    future recovery will be impossible)

    - Planting time bombs—deliberate errors in programs or processes that will cause
    malfunctions after the employee leaves the company

    - Changing root permissions on critical systems and not telling anyone before
    leaving the company (another form of time bomb)

    - Deliberately erasing backup media

    - Removing OS or product media to make recoveries or installations more difficult


    Never give out root to users.¹ Either use tools to get what they need or deny
    them access they are requesting. As a result, give root-level privileges only
    for those functions absolutely must have in order to do their jobs.


    > ¹I once heard an amazing story about a UNIX administrator who had a fiery ignorant
    user who needed the root password to over user management and made the system.
    The administrator refused to give the root password to the user, but he did so
    in a creative way: he changed the name ''root'' to a polynamed user called ''root''
    and gave its password to the troublesome user. The user never suspected that he
    did not have root privileges, and wanting to save face, never once called the
    administrator when he fixed filesystems problems.


    Users with root privileges are potential problems. Users with root may become
    intoxicated with their newfound power and begin to tinker with things they''re
    unfamiliar. With users with root access accidentally delete or change something
    that will hinder their ability to carry out their real jobs (not systems administration!).
    Finally, a diabolical user will use his power to further his dark aspirations
    and beyond his own system. This leads to the second principle.


    # Principle 2: Trust No One, or Be Careful About Who You Are Required to Trust


    Breach of trust is the greatest threat to computers and information stored on
    UNIX. Systems administrators introduce too many trust relationships between the
    machines they''re responsible for in order to make their tasks easier to carry
    out. Frequently, systems administrators create, simple webs of trust among them
    using the root user. For instance, the root user (which has complete control over
    all aspects of a system) on all systems will trust the root user over many, if
    not all, systems on the network.


    Why is this a bad idea? It is the same trust relationships that hackers will discover
    and exploit. A hacker breaks into a root machine will first examine the /hosts
    and /etc/hosts equiv on that machine to see whom it trusts. If machine trusts
    tamarack, then our hacker will will'
