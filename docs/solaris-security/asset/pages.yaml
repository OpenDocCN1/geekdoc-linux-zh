    # syslog Facilities and Severity Levels


    syslog system messages are categorized by facility and severity. The facilities
    are listed in Table 8-1,

    syslog severity categories are listed, in decreasing order, in Table 8-2.


    | Table 8-1. syslog Facilities |

    | Facility | Message Description |

    | user | Generated by processes. This is the default facility; messages not fitting
    any of the other listed categories here are classified as facility user. |

    | kern | Generated by the system kernel. |

    | mail | Generated by the e-mail system. |

    | daemon | Generated by system daemons, such as ftpd. |

    | auth | Generated by the authorization programs login, su, and getty. |

    | lpr | Generated by the printing system. |

    | news | Generated by the Usenet News system. |

    | uccp | Generated by the UUCP system. |

    | cron | Generated by cron and at. |

    | local0-7 | Generated by up to eight locally defined categories numbered 0 through
    7. |

    | mark | Generated by syslog for timestamping logs |


    | Table 8-2. syslog Severity Levels |

    | Severity | Description |

    | emerg | The most severe messages, such as immediate system shutdown. |

    | alert | System conditions requiring attention. |

    | crit | Critical system conditions, such as failing hardware or software. |

    | err | Other system errors. |

    | warning | Warning messages. |

    | notice | Notices requiring attention at a later time. |

    | info | Informational messages. |

    | debug | Messages for debugging purposes. |


    # syslog Message Classification Notation


    The notation used to classify syslog messages is facility.severity. For example,
    a warning message from the printing system will be classified as lpr.warning.

    For any severity level specified, messages are generated for that and all less-severe
    levels. For example, lpr.warning causes warning—err,—crit, alert,— and emerg-level
    messages from the lpr service to be generated.

    Wild card character is used in syslog notation. For example, *.err means severity
    level err messages from all facilities (except the mark facility).


