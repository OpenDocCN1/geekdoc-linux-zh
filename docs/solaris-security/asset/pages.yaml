- img_proc: true
  md: 'The downside of mkfs customizing is that the emergency repair of a filesystem
    using fck (filesystem check) can make recovery of a filesystem difficult, if not
    impossible. The reason for this is that fck assumes default locations for the
    filesystem''s superblocks; if the filesystem was built with custom mkfs settings,
    the superblock locations will not be fck expects to find them. If the UNIX administrator
    did not record the superblock locations when building the filesystem, then will
    not be able to tell fck where they are; without information, a corrupted filesystem
    is potentially unrecoverable filesystem.

    Recommendation: When building filesystems with custom geometry, use the -v option
    with mkfs and make a copy of the mkfs session. It might just be needed someday.


    # # Tape Backups


    Sooner or later, backups are the life blood of an organization. At some point,
    hardware or software will fail; a UNIX administrator, operator, database administrator
    (DBA), or user will make a mistake; and data will need to be recovered from a
    tape backup. Next to making systems, tools, and data available to users, the most
    important activity is making that backups are working.

    Recommendations:


    +   - Examine backup run logs to ensure backups are properly.

    - Have Another administrator audit the backup configuration to make sure that
    all systems are backed up and that filesystems are backed up.

    - Randomly examine backup media to ensure restore software can actually copy the
    contents to a tape. The ability to merely read a tape''s contents is insufficient.

    - Utilize off-site storage of backup media. Fires, floods, and sabotage will surely
    destroy a server along with the backup tapes, which are usually right next to
    it.


    # # System Recovery Testing


    Without system recovery experience, a UNIX administrator can find the prospect
    of a ground-up system recovery frightening. There is only one way to overcome
    this.\Recommendation: Conduct a full server recovery test every three months.
    Use the following procedure:


    +   1. When possible, clone the server and practice recoveries on the clone; this
    will enable the UNIX administrator to practice full recoveries during working
    hours without disrupting production availability.

    2. Rebuild the production server twice; make sure backup tapes are readable.

    3. Rebuild the clone from scratch (typically: boot and load the OS from CD, install
    backup recovery software, recover the rest of the system from backup tapes).

    4. Perform regression testing on the functions of the server clone to ensure that
    it is providing services.


    # # Release Media


    A vital part of a system recovery is having release media and knowing where it
    is.

    Recommendation: Have two or more sets of release media for each Solaris supported
    on the site. Have one set of release media for each supported version stored with
    off-site backup tapes.


    # # System Event Logbooks


    Without adequate recordkeeping, during a system recovery may be difficult to determine


    +   - Disk partitioning

    - Filesystem customizations'
  merge: -1
  pgno: 167
- img_proc: true
  md: '+   - OS version and install options

    - SCSI device addresses

    - Patches


    **Recommendation:** Maintain a meticulous journal of every detail of a system''s
    construction, wiring, device addresses, out-of-the-ordinary configurations, and
    other changes made along the way.


    # Solaris and Tool Patches


    During a recovery meal, it might be difficult to retrieve Solaris patches; for
    instance, the Internet connection (if patches are obtained over the Internet)
    may be down.


    **Recommendation:** Maintain a local archive of all patches used at the site.


    # CD-ROM Drives


    Chapter 3 recommends that servers do not have CD-ROM drives directly attached.
    Otherwise, the intruder with Solaris release media who has gained physical access
    to a system will have too easy time breaking into the system if a CD-ROM drive
    is attached.


    **Recommendation:** Have one or more internal or external CD-ROM drives available.
    Make sure that the SCSI address for CD-ROM drives is free (the SCSI address is
    6 by default).


    # Hardware and Software Service Agreements


    A full spectrum of service agreements is available from Sun to match the business''s
    needs for each desktop and server system. Options range from carry-in and cross-ship
    service to on-site repair and replacement. *Carry-in* service means the failed
    system must be taken to a service depot. *Cross-ship* service, the vendor will
    ship a replacement system to the customer before receiving the failed system from
    the customer.


    **Recommendation:** Match business continuity needs for each server and desktop
    system to appropriate hardware service plan.


    # Keep Hardware Spares


    Even with a hardware service plan, sooner or later it may take an unacceptable
    long period of time to get a special part to repair a device or, worse, a server
    system. The most convenient way to keep spare parts is to have a spare system.
    This spare system can be in the form of a development server, a test server, or
    (l) a test recovery. It is not said idle—fact, it is better if it does *not* idle;
    idle system has a way of working when it is needed. The spare system does not
    necessarily need to have the entire CPU or memory to complement its production
    counterpart; that can make the spare system unnecessarily. Instead, equip it with
    the minimum necessary to run the most important functions or applications. After
    all, this is an emergency system, and the real production system will (hopefully)
    be fast and online.


    **Recommendation 1:** Have a spare system available that can run critical applications
    or be cannibalized for parts in the event of a hardware failure.


    **Recommendation 2:** Employ as few hardware system types as possible; this will
    minimize the number of spares needed.


    # Copies of Critical Server PROMs


    Many businesses have licensing agreements that prohibit moving the server from
    one to another. The recommendation in the preceding section of having a spare
    system is easily defeated if any of the server software packages are tied to the
    server''s host.


    One possible remedy is to have a spare PROM for each server. This will permit
    the UNIX administrator to temporarily move software packages tied to specific
    hostid from one server to another.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'Recommendation: Obtain a spare PROM for each server that serves hostid-specific
    software. Contact your nearest Sun branch office for information.



    Systems with the same hostid should not be running concurrently. Any spare PROM
    should be used only if the other system with the same hostid is not running. Software
    vendors whose licensing schemes are tied to hostid may object unless they are
    well informed. Ethical behavior is the responsibility of the UNIX administrator
    and others involved with having and using spare PROMs.


    # Disk Space to Spare


    One possible in the event of a server failure is to temporarily recover all or
    part of its contents to one or more others until the failed server is recovered.

    For this alternative to be, servers must be running well below their disk capacity.
    Flexibility is sacrificed if servers are run at 100% disk utilization.


    Recommendation: Have enough online disk capacity to accommodate at least configurations
    having data temporarily served by other servers. Use of NIS+ (or NIS) and the
    automounter makes these transitions easier accomplish.


    # Recovery Documentation


    Without adequate documentation, a UNIX administrator may find it difficult to
    properly recover a server.

    Recommendation: Maintain up-to-date documentation on server architecture, backup
    and recovery procedures, off-site storage media recovery, and operational procedures.
    Make sure that a hard-copy list of passwords is available (and well protected!).
    Keeping only online copies is fruitless if the system they are stored on is down.
    Make sure that everyone who has to use it has the most current version and where
    it is. Destroy old copies.


    # Contacts and Cross-Training


    Disasters always happen after hours or on three-day weekends when key personnel
    are out of duty. During natural disasters, people may be unable to return to work
    easily to assist with contact lists, pagers, cell phones, and cross-training so
    everyone on the UNIX team how to recover systems. It is also important to make
    sure that everyone on the team have authority to handle emergencies, authorize
    return of off-site storage media, initiate contingency, and so on.

    Recommendation: Ensure hot not achievable after hours using contact lists, pagers,
    and cell phones. Delegate authority to personnel so the few who can assist with
    a recovery are empowered to do what''s needed to continue recovery operations.
    Have a backup communications plan in the event that power failure or service problems
    make ordinary communications unavailable.


    # Partner with Inside Suppliers


    Next to the company''s network engineers, the UNIX team''s most important ally
    is the facilities group—the team who delivers electric power and air conditioning.

    Large-scale UPS systems or on-site generators are expensive, but may be easily
    justifiable if assure continuing business operations. Likewise, redundant heating,
    ventilation, and air conditioning (HVAC) systems, portable rental AC systems,
    and a few powerful electric fans can reduce the impact of an HVAC failure by buying
    time for repairs or a clean shutdown.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'Recommendation: Coordinate disaster recovery plans with the team that provides
    electric power and air conditioning; without these facilities, you might as stay
    home.


    # Partner with Outside Suppliers


    Frequently, computer equipment will become damaged beyond repair during natural
    or man-made disasters. Community or regional disasters exacerbate the matter by
    disrupting the transportation systems needed to facilitate the shipment of replacement
    computers and supplies.

    Recommendation: Partner, formally or informally, with key hardware suppliers to
    ensure the rapid availability of replacement systems and supplies so that recovery
    operations can begin as soon as possible.


