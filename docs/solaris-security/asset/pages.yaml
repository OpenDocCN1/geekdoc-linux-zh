    # # umask and How It Works


    The umask is a value that determines the default permission settings assigned
    when new files and directories are created.

    Each UNIX system has a default umask value; each user can change is her own umask
    value (and usually does so at login time in a .bashrc, .login, or .profile file);
    each process can also examine or alter its umask value with the umask command.

    umask is an inherited feature. If a process sets a particular umask, its children
    will inherit the umask value.

    Here''s how umask works. Numerically, it specifies permissions are not granted
    by default when a file or directory is created. For example, the user''s umask
    is set to 027. The umask 027 is broken down into 0, 2, and 7. The 0 means that
    the user will have all permissions; the 2 means that group will not have write
    (2) permissions; the 7 means that other will not execute (7) permissions. This
    is illustrated in Figure 4.4.


    Figure 4.4. umask Example


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_38_0.png)


    Another way to think about umask is to subtract each of its digits from 7; the
    resulting digits are the permission set for a file or directory that is created
    while umask is in effect. This is illustrated in Figure 4.5.


    Figure 4.5. umask Subtraction Example


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_38_1.png)


    In addition to being numerically, a umask can also be set symbolically, with options
    similar to chmod''s symbolic syntax. For example


    ```

    umask u+rw,g+rx,o-a ...is the the same as: umask 027

    umask u+rw,g+r,o+r ...is the same as: umask 133

    ```'
