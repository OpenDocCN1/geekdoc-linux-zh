    # Chapter 11. Electronic Mail


    One of the most exploited network services is e-mail. Its complexity and ubiquity
    has led to the discovery of security holes over the years. Configuration of e-mail
    is potentially complex and not easily understood; a misconfigured system can have
    weaknesses that lead to bigger problems. Most people think of e-mail as consisting
    only of the graphical user interface (GUI) or character interface used to read
    and send e-mail messages. Few consider the transport and delivery systems as part
    of the e-mail architecture.

    **What''s in this chapter**


    +   - Basics of sendmail and mail agents

    - A survey of e-mail-related security risks

    - How to mitigate security risks


    **Why this is important**

    e-mail, used practically everywhere, presents the UNIX administrator with one
    of the most significant vulnerabilities that must be properly dealt with.


    # Overview of E-Mail


    Solaris e-mail consists of three agents: transport agent, delivery agent, and
    user agent. Figure 11.1 illustrates these agents in end-to-end mail message delivery.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Figure 11.1. Mail Agents


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_110_0.png)


    # Transport Agent


    The transport mechanism for Solaris is sendmail. Sendmail receives new messages
    from users, makes mail routing decisions by examining delivery addresses, and
    initiates the forwarding of mail messages by selecting and calling mail delivery
    agents. Sendmail transports messages using the simple mail transport protocol
    (SMTP) message protocol. SMTP is a TCP protocol that uses port number 25. Sendmail
    uses domain name service (DNS) in order to determine which system to forward each
    mail message.


    # Delivery Agent


    The delivery mechanism is used to deposit a mail message into a user''s mailbox-that
    is, to actually perform the task of appending the message to the file /var/mail/<userid>.
    The delivery agent used by Solaris is a program mail.local.


    # User Agent


