    # Quick Look at the Contents


    This book discusses the physical, logical, and human-factor aspects of computer
    and network security in the specific context of Solaris 2.x and Solaris 7 running
    on Sun Microsystems. There are five parts.


    +   * **Introduction.** The computer security problem is dramatically illustrated
    in chapter 1, "The Security Problem." Chapter 2,"The Security Paradigm," is a
    principle-based recommendation for use by all UNIX administrators, but also to
    those managing computers of other devices.

    * **The standalone.** This part focuses on the computer and covers all aspects
    of security. Regardless of whether it is or not connected to a network, every
    system is a standalone system. Chapter 3, "PROM, OpenBoot, and Physical Security,"
    covers one of the least-known vulnerabilities of a Solaris system, as well as
    practical measures for securing a Sun on a desktop or in a data center. Chapter
    4, "The Filesystem," is a comprehensive review of file and directory structures,
    and includes sections on Solaris auditing and tools for UNIX administrators. Every
    user account is covered in chapter 5, "User Accounts and Shutdown" Chapter 6,
    "System Startup" Chapter 7, "On and at," and chapter 8, "System Logs," provides
    a look through all those respective areas.

    * **The network-connected system.** This part of the book is dedicated to describe
    the role and place of a Sun system on a network. Many vulnerabilities of a Solaris
    system are related to being connected to a network. Chapter 9, "Network Interfaces
    and Services," discusses the logical attachment of Systems to the network and
    its various services. The principles of network and system architecture are discussed
    in chapter 10, "System Architecture." "Electronic Mail" is part of chapter 11.
    Chapter 12 reveals worth printing. Chapter 13, "Network Access Control," describes
    the best methods for controlling access to a system network. DNS, NIS, and NIS
    are covered in chapter 14, "Name Services." Chapter 15, "NFS and the Automounter,"
    describes services and offers of improving their security.

    * **Disaster and recovery.** This part deals with system recovery from hardware
    failure, major error, or external events. We will cover chapter 16, "System Recovery
    Preparation," giving a detailed look at measures to be taken to secure a Solaris
    system.

    * **Appendices.** Appendix A, "Online Sources for Security Information," is a
    review of web sites, FTP sites, and mailing lists. Likewise, a comprehensive list
    of security tool resources is found in Appendix B, "Online Sources for Public-Domain
    Tools." Complete information is found in Appendix C, "Obtaining Solaris Patches."
    Appendix D, "Suggested Reading," refers the reader to online and in-print publications
    of further interest. Solaris''s security products are discussed in Appendix E.
    The steps required to implement and manage C2 security are found in appendix F.
    Appendix G explains how to verify the integrity of public-domain software. A glossary
    of attacks appears in appendix H. Appendix I is a secure system checklist.


