    # # Install Log


    The system log, found in /var/sadm/system/logs/install_log, is generated when
    Solaris is installed on the system. The install log contains all of the character
    output generated throughout Solaris installation. The log contains information
    such as disk partitioning and formatting, software module installation status,
    and mount points.


    # # sysdidtool Log


    The sysdidtool log, found in /var/sadm/system/logs/sysdidtool.log, is generated
    by the sysdidtool tool suite. itself runs automatically at installation time or
    when the system is configured with sys-unconfig. This log can be used for double-checking
    the configuration of a newly installed or reinstalled system to see what, if any,
    changes have occurred.


    # # Tools to Help with Logging


    # # Logcheck


    Logcheck is a public-domain tool to examine syslog and any other logfiles. When
    something is suspicious, it sends an email message alerting the UNIX administrator
    that something is up. Logcheck employs a filter containing keywords; when a log
    entry containing a keyword is found, a message is sent. Logcheck utilizes the
    "report everything that is not ignored"—a nice feature, since it is difficult
    to know in every possible type of message that could be logged. It runs from cron
    as often as needed (once per hour is the minimum frequency). This is a description
    of Logcheck configuration files.


    +   - logcheck.hacking—File of known attack messages to log. Only put messages
    in here if you''re sure they cause false alarms. A rather generic way of checking
    for malicious activity and can be inaccurate unless you know what hacking activity
    looks like. The default is to look for generic Internet security (ISS) probes
    and obvious attacks.

    - logcheck.violations—File of security patterns to specifically look for. This
    log contains keywords that administrators should be aware of. It may or may not
    cause false alarms. Generally, anything that is negative is in this file. It may
    miss some items, but will be caught by the next check. Move suspicious items into
    this file to have reported regularly.

    - logcheck.ignores—File that contains more sentences that have keywords from the
    violations file. These are normal and not for concern but could cause a false
    alarm. An example of this is the word "refused" which is often reported by sendmail
    if a message cannot be delivered; it can also be a more serious security violation
    of a system attaching to illegal ports. Obviously, you would include the sendmail
    warning as part of'
