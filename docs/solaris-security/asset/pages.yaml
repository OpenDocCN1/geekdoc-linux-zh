    # What Is it?


    at is a scheduling system to execute a command (or series of commands) at a single
    specified time in the future. The measures of time used are hours, days, and months.
    Absolute and relative intervals are allowed. Some scheduling examples include


    +   - Now

    - Plus two hours thirty minutes

    - Tomorrow at 10 A.M.

    - Four hours from now

    - Two weeks from now at 4 P.M.


    at is distinguished from cron primarily that at is used to execute a command over
    and at a specific time, whereas at is used to execute a command one at the same
    time as they can control UNIX administrators control which users have access to
    at, described earlier.


    # How at Works


    At system startup, the cron daemon starts and reads all entries in /var/spool/cron/atjobs.
    These at job entries contain all of the information environment needed to run
    the at job, the actual at job command(s). The names of the at job themselves tell
    cron when to start the at job; the format of the filename is n.m where n is the
    number of seconds since January 1, 1970, and m is a sequence digit used to distinguish
    multiple at jobs configured to start exactly the same second.

    The mechanism for starting at jobs is essentially the same as for cron: cron forks,
    the parent process goes back to sleep, and the child process changes its userid
    to that of the userid for which the job is being launched; the child executes
    the at job file in /var/spool/cron/atjobs.


    # User Access to System


    The files /etc/cron.d/at.allow and /etc/cron.d/at.deny work exactly like the files
    /etc/cron.d/cron.allow and /etc/cron.d/cron.deny described earlier.


    # Common Mistakes to Avoid


    # Failure to Adequately Conceal Programs Launched by cron


    Scripts and programs launched by cron—particularly for userid root—should not
    be readable by anyone but the user/owner.'
