    # Security Remedies and Public-Domain Software


    This book illustrates security weaknesses in the Solaris operating system and
    proposes remedies for those weaknesses. Remedies takes the form of


    +   - System configuration changes. Frequently, a security weakness can be mitigated
    simply by changing a configuration.


    +   - The use of Sun-supplied software. This book will describe the package name,
    where it can be found, and where to find installation instructions.


    +   - The use of commercial software. Sometimes, only a commercial software package
    is available as a security remedy. This book describes security programs and where
    they can be found.


    +   - Process and procedure changes. Frequently a system''s weakness lies in the
    action (or inaction) of users and administrators. This book proposes several changes
    in behavior that are intended to raise system security awareness.


    # Warning


    Solaris™ Security warrants not the use of configuration changes or public-domain
    or commercial software. It is the final decision of the UNIX administrator or
    other site professional to decide what measures need to be taken to remedy security
    weaknesses.


    All public-domain software tools must be verified. A well-known security tool
    was once compromised (fitted with a back door) and distributed to the unsuspecting
    public for a short time. A UNIX administrator should no longer take the integrity
    of a site for granted because it is on a respected or well-known website. Appendix
    G contains information on how to verify the integrity of software obtained from
    the Internet.


    The term public domain does not necessarily constitute a legal right to use for
    all individuals, organizations, or situations. The license agreement for any public-domain
    software package should be first examined to ensure that its terms and conditions
    are not in conflict with the package''s intended use. Each site''s UNIX administrator
    or other site professional must exercise sound judgement.


