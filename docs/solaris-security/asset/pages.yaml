  md: '# Hardware Failure


    Hardware failures are probably the most familiar type of failure. These include
    failure of power supplies, system boards and adapters, memory, disk storage, and
    especially cabling and cable connections.


    # UNIX Administrator Error


    Nearly every experienced UNIX administrator has a tale to tell, as having entered
    the command `rm -rf / *`, thereby removing all files from a system. UNIX administrators
    are human and capable of making honest, high-impact mistakes.


    # Documentation Error


    Errors in procedural documentation can lead UNIX administrators, programmers,
    and users to do the wrong thing, without themselves knowing it until weeks or
    months later (if ever).


    # Programmer Error


    Despite thorough testing (if when one is fortunate enough to test thoroughly),
    software bugs creep to the surface and manifest themselves in the form of data
    corruption or destruction.


    # User Error


    Through inadequate training, heavy workload, poor documentation, or lack of attention
    to detail, a user can corrupt or destroy information by making mistakes. Lack
    of (or inadequate) data access controls increase the exposure and impact to this
    type of error.


    # Sabotage


    Whether from insiders or outsiders, the malicious corruption or destruction of
    information and information systems is probably the most sensational form of human-caused
    information destruction. Because it can be perpetrated by trusted insiders, it
    can be the most difficult to detect and prevent.


    # Preparing for Recovery


    Recovery preparation begins when the building is designed, the data center location
    is chosen, hardware and software vendors are selected, and systems are designed.
    Recovery preparation, security, is not a Band-Aid to be applied to an existing
    infrastructure, but part of a sound methodology. Along every step of the way,
    what can go wrong and how the design can help to continue business.


    With increasing demand, businesses depend more and more on computers and networks
    than the networks are the business. The popular notion 20 years ago was that every
    process performed by a computer system had its manual backup procedure with which
    everyone was familiar. If there was a system failure, data input sheets were filled
    by mail-order cards and replaced with hand-written forms. Drafters returned to
    their drafting tables. Merchants continued their marketing planning.


    When the system fails, what will the online bookstore do? When the computers fail,
    what the banker (with online banking services) do? What will the online stock
    trader do? What will the ISP do? They cannot fall back on manual procedures when
    their computers fail because they have no manual procedures.


    The answer lies in preparation. Business operations must continue as quickly as
    possible—long delays can cause a failure. Even of short outage, what does destruction
    of normal business operations cost and what lost? The finger-pointers will all
    look to the person responsible for the networks and computers. That person is
    probably you. We''ll take a closer look in the following sections at the aspects
    of system design and management, with a keen eye on recovery awareness, preparation,
    and ease of recovery.'
