    for each examined file. Information about each file is stored in this database.
    On subsequent runs, information about each file is compared against the values
    stored in the database. Any files that have changed (not just the contents, ownership,
    permissions, modification/access dates, etc.) will be detected by Tripwire and
    listed in a report.'
