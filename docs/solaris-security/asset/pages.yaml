    # Use the ls Command to Show Hidden Files and Hidden Characters in Filenames


    The UNIX administrator should always use the -a (show hidden files) and -b (print
    nonprintable characters) options when using ls. The -a option tells ls to show
    ordinary files and directories plus hidden files and directories. A hidden file
    or directory is one whose name begins with a dot character. This UNIX administrator
    ordinarily should be seeing all the contents of a directory with the ls command.
    For instance, when troubleshooting a situation where a filesystem has run out
    of available disk space, the culprit might be a hidden file. If the UNIX administrator
    does not list hidden files with ls, the guilty files will be a little more difficult
    to find.


    The -b option tells ls to print nonprintable characters in file (or directory)
    names in octal notation. Nonprintable characters in filenames? You bet. They can
    be created by accident or even purposely by a mischievous user. Consider this
    example.


    ```

    % touch abc<space>d

    % ls

    abd

    % rm abd

    abd: No such file or directory

    % ls -b

    abd\010d

    ```'
