  md: '# Solaris™ Security


    By Peter H. Gregory


    Publisher : Prentice Hall PTR

    Pub Date : August 17, 1999

    ISBN : 0-13-096053-5

    Pages : 336


    At last, a security book just for Solaris and UNIX(r) system administrators. Learn
    the specifics for making your system secure, whether it''s an organization-wide
    network or a standalone workstation. Expert author Peter Gregory has managed security
    for everything from top-secret corporate research facilities to casinos. Take
    advantage of his experience to build a secure, reliable system of your own.


    Solaris Security looks at the physical, logical, and human factors that affect
    security, including:


    +   - PROMs, physical security, bootpaths, permissions, auditing tools, system
    logs, passwords, and more

    - Secure network interfaces and services for remote and Internet access, intrusion
    detection, access control, email, and printing

    - Enhanced security for NIS, NIS+, DNS, and NFS


    A special section shows you how to plan for the inevitable disasters so you can
    recover your data quickly and accurately without compromising security. References
    to books, journals, and online resources will help you keep up with the latest
    innovations.


    Every chapter opens with a checklist of key topics and their significance, so
    you can quickly find the information you need. Whether you are a security manager,
    Information Technology/Systems manager or a network administrator, Solaris(tm)
    Security is the single resource to answer all your questions and get your systems
    in shape now and for the future.'
