  md: '# Warning


    Baslining an existing system with Tripwire is considerably more difficult because
    the system may already have been compromised. This is because Tripwire can detect
    tampering only after a system has been baselined. The only reliable solution is
    to reinstall Solaris and all of the system''s applications from original manufacturer
    data (not from local backups, which may have been compromised!)


    +   * Install all required patches and security patches. See appendix C, "Obtaining
    and Applying Solaris Patches.

    * Back up the system twice. Store one backup on-site (in a secure location) and
    send the other off-site.

    3. Make the system as physically secure as possible. See 3, "Threat and Access
    Prevention."

    4. Set the OpenBoot variety to command or shell. See 3, "Protecting OpenBoot by
    Security Parameters."

    5. (For fileservers) Implementing unnecessary fileset quotas. See 4, "Filesystem
    Quotas."

    6. In environments with complex file and directory requirements, implementing
    access control lists. See 4, "Filesystem Access Control Lists."

    7. Disable all unnecessary accounts: daemon, bin, sys, adm, ftp, uctp, listen,
    nobody, noacess. See 5, "Which Administrative Accounts Should Be Locked."

    8. Allow root to log in at all system accounts; set CONSOLE=/dev/console in /etc/default/login.

    9. Make the sum command available only to UNIX administrators. See 5, "Restricting
    Use of Su."

    10. Log all login attempts. See 6, "Logging."

    11. Set root (and other administrative accounts) that the system name is part
    of the shell prompt. See 5, "Include System Name in Root Prompt."

    12. Use secure settings in /etc/default/login. See 5, "Default Login Environment."

    13. Use screen locks when logging into X-Windows. See 5, "X-Windows Security."

    14. Restrict access to root and accounts that need them. See 7, "User Access to
    cross switch.", and 7, "User Access to System."

    15. On turning off failed login attempts. See 8, "Logging."

    16. Allow Alias and rm as commands for root and other administrative accounts.
    See 8, "Alias the rm Command to Prevent Accidental File Deletion."

    17. Disable unnecessary IP packet forwarding. See 9, "Turn off IP Forwarding with
    /etc/router."

    18. Disable all unnecessary network services. See 13, "Necessary and Unnecessary
    Services."

    19. Disable telnet, rsh, upc and rsh; Use Ssh instead. See 13, "Secure Replacement
    for telnet, rsh, and login."

    20. Disable NFS server capabilities (unless system must be an NFS client). See
    13, "How to Disable Unnecessary Services."

    21. Disable NFS client capabilities (unless system must be an NFS server). See
    13, "How to Disable Unnecessary Services."

    22. Disable automounter (unless system must be an autount client). See 13, "Disable
    Service Not Defined in /etc/inetd and /etc/inetd.conf."

    23. Stop running smrash as a daemon (unless system is a mail server). See 13,
    "How to Disable Unnecessary Services."

    24. If the system is a mail server, strengthen sendmail. See 11, "Mitigating E-Mail
    Security Weaknesses."

    25. If the system is a mail relay, consider relaying sendmail with SMTP or postfix.
    See 11, "Replace Sendmail."

    26. Disable e-mail source routing. See 11, "Prevent Message Source Routing."

    27. Remove all unnecessary e-mail aliases. See 11, "Remove Unnecessary E-Mail
    Aliases."

    28. Implement ForwardPath if it is an e-mail server. See 11, "Implement ForwardPath."


