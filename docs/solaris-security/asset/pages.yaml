  md: '# Firewalls


    A firewall is a network device designed to allow the network administrator to
    determine which network

    protocols will be allowed to enter or leave a network, as well as which systems
    or networks those

    protocols are allowed to pass. Firewalls accomplish this with a set of rules that
    define which

    packets are allowed. Some example firewall rules are[1]


    > [1] These rules are only examples and may not reflect security requirements
    for your site.


    +   * Deny inbound and outbound telnet to the Internet to this site.

    * Allow inbound and outbound SMTP mail between the local mail server mysite.com
    and any on the Internet.

    * Allow ftp from the Internet to only the ftp server mysite.com.

    * Allow www from the Internet to only the web server www.mysite.com.

    * Allow outbound ftp from this system to anywhere on the Internet.

    * Allow outbound ftp from this site to anywhere on the Internet.

    * Deny all other services except those listed above.


    A firewall is typically placed in the network at the boundary between one organization
    and another,

    commonly, and the Internet.

    Firewalls should not be considered the line of defense, but a line of defense—firewalls
    can be

    configured incorrectly, they can fail, and network paths (accidentally or otherwise)
    be built around

    them.

    in an organization where the UNIX administrator is not familiar with or responsible
    for the organization''s

    firewall(s), it is imperative that firewalls be thoroughly understood so that
    the UNIX administrator can

    properly select access control policies on server and desktop systems.

    Refer to appendix E for more information on Sun firewall products.


    # Testing System Accessibility


    No UNIX administrator should trust his her diligence and typing skills so much
    as to leave security

    configurations unset. But on the other hand, thoroughly testing a UNIX system
    for network access

    vulnerability can take hours, if not days. Some public-domain tools have been
    implemented

    toutomate the work of uncovering vulnerabilities. I''ll discuss a few of these
    in the following sections.


    # Satan


    The Security Administrator''s Tool for Analyzing Networks (Satan) is a tool used
    by UNIX and network

    administrators to discover weaknesses in system and network configurations.

    Satan is a port scanner that works by probing a system over the network—or all
    systems on a

    subnet—looking any weaknesses found. For each weakness found, Satan displays a
    tutorial explaining the problem and

    possible solutions.

    Satan is available at the following sites:


    +   * http://www.fish.com/satan/

    * http://www.trouble.org/~zen/satan/satan.html'
