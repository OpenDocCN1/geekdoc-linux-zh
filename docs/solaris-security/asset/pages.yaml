  md: 'For the user, group, and other digits, the permission numbers are


    +   - 1 execute

    - 2 write

    - 4 read


    To combine any permissions 1, 2, or 4, add the values of the digits. For instance:


    +   - 6 read and write (4 + 2)

    - 7 read, write, and execute (4 + 2 + 1)


    Zero in a field implies no permission.

    Examples of permissions for user, group, and other are


    +   - 751–7 is the user permission (read, write, execute); 5 is the group permission
    (read, execute); 1 is the other permission (execute).

    - 640–5 is the user permission (read, write); 4 is the group permission (read);
    0 is the other permission.


    Most of the time, only three digits are used to express permissions. However,
    a four-digit (such as 2000) is used to express sticky, SetUID, and SetGID permissions.
    The permission numbers are


    +   - 1 sticky

    - 2 SetGID

    - 4 SetUID


    Just with the other three digits, this is added to show permissions in combination.
    For example, a 5 would include sticky and SetUID.

    Here is an example using all four digits. A file''s permission is 2751. This is
    broken down as follows:


    +   - 2751 SetGID (2000); user can execute/write/read (700); group can execute/read
    (50); other can execute (1).


    # Setting File and Directory Permissions–Numeric


    If you''re reading this chapter sequentially, then you''re just getting used to
    numeric permissions. We would discuss them later.

    The chmod command is used to change permissions for a file or directory. The numeric
    form of chmod is


    ```

    chmod nnnn filename

    ```


    where nnnn is the numeric permission to apply, and filename is a list of one or
    more files and directories. For example, to set a file that all users (including
    user and group) can execute a file name calc (but not read or write its contents),
    then the command to do would be


    ```

    chmod 111 calc

    ```


    The command to set the /tmp directory for read/write/execute for all users, plus
    the sticky bit,[2] would be


    > [2] This is a typical permission for the /tmp directory.


    ```

