    # System Device Access Permions


    Solaris is shipped with appropriate permissions assigned to device files such
    as disk drives, tape drives, and memory.

    A word should be said for Sun''s indirect references to commonly used devices.
    For instance, typical devices are referenced by SCSI controller and device, such
    as


    ```

    /dev/dsk/c0t3d0s

    ```


    This example signifies a disk device, controller 0, SCSI target 3, disk 0, slice
    0. But examination of this file shows it is not a file, but instead a logical
    link to the file name


    ```

    ../devices/iommu@f,e0000000/sbus@f,e0001000/espdma@f,400000/esp@f,

    800000/sd3,0:a

    ```


    Permissions of this file (in -l format) are `brw------ root sys`.

    Warning


    Under no circumstances should the permissions of a disk device be changed. A change
    could result in an entire filesystem being readable or writable by everyone.


    Tape drive device permissions are looser, as tape drives are by default considered
    to be accessible by all users. Permissions of tape drives (in -l format) are `crw-rw-rw--
    1 root sys`. For a production environment, tape device permissions should be tightened
    so that only the user performing backups will have read and write permissions
    to relevant tape drives.'
