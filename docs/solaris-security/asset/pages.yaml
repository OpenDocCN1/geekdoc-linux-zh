  md: 'ftp is a significant security risk. Like telnet and the r-commands, all ftp
    traffic is transmitted in the clear over the network. If ftp is a site necessity,
    then consider these recommendations:


    +   - Avoid anonymous ftp. Instead, explicitly control and identify who will be
    accessing the site outside world and aside individual users and passwords.

    - Turn on ftp logging and debugging. The ftp entry in /etc/net/inetd.conf should
    appear as follows:


    ```

    ftp stream tcp nowait root /usr/sbin/in.ftpd in.ftpd -

    dl

    ```


    +   - Follow the recommendations in the ftpd(1M) man page.

    - Never ftp as root (remember, the password is sent in the clear over the network);
    to enforce this, add root to /etc/ftpsusers (users in this file are prohibited
    from connecting to the system using ftp).


    # Warning


    If anonymous ftp is a site necessity, it is essential that the instructions in
    the ftpd(1M) man page regarding anonymous ftp be followed to the letter.


    Sites requiring greater access control and/or logging capabilities should replace
    Sun''s ftpd with Washington University''s ftp package, known as wu-ftp. It is
