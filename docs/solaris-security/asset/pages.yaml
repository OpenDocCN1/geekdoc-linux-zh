    # nscd


    nscd, the name service cache daemon, names service requests for hosts, passwd,
    and group.

    it caches these services whether the system is using flat files (e.g., /etc/nethosts,
    /etc/group,

    /etc/passwd), DNS, NIS, or NIS.

    scd can be the cause of several problems, including


    +   - Changes in /etc/nwitch.conf are not fully effective until flat files or
    NIS are restarted.

    - Changes in hosts, group, or passwd in flat files or NIS+ may not immediately
    take effect; sometimes nscd caches the old information too long.

    - Changes in NIS are ignored. For example, a user changes his password on his
    NIS client with ypasswd and then logs out. The user cannot log using the new password
    because nscd has cached the old and will not query NIS for password (or other)
    changes until its cache expires (the user can still log with the old password).


    > were never desired to coexist.


    +   - nscd performs negative caching. For example, a user tries to ping a host
    not defined in

    DNS. Minutes later, the host name is defined in DNS. However, the user is still
    unable to ping

    t server (by name) because nscd has cached the nonexistence of the host.

    - nscd has been known to peg the CPU and have memory leaks.

    - nscd''s cache has been known to become corrupted.


    Because it is integrated into the system mechanisms it cannot find hosts (in /etc/hosts,
    NIS,

    or NIS+), nscd cannot be disabled; some functions may not work. To disable caching,
    the

    configuration file /etc/nscd.conf needs to include the following three entries:


    ```

    enable-cache   hosts no

    enable-cache   passwd no

    enable-cache   group no

