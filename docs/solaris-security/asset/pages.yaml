    # ### Why is important


    Network access represents the majority of a system''s vulnerability. Knowledge
    of these services and how they are controlled is vital to the security of an entire
    organization.


    # # Network Access Control Principles


    This chapter is built around one underlying principle regarding network access:
    **disable what is not needed, and build access controls around what is needed.**


    # ### Unnecessary Network Access Points Are Security Risks


    Consider the hypothetical spelling service. You connect to a system''s spelling
    service and type a string of words; the service returns the same string but with
    misspellings corrected. Now suppose a couple of unintentional bugs have been introduced
    into the spelling service, or one or more of which permits someone to either penetrate,
    control, or disable the system.

    At one time or another, or one more UNIX-based network services have suffered
    from this degree of weakness. And such as these are still being discovered. For
    every network service that is turned off, potential security holes are eliminated.
    For example, if the spelling service is turned off, any weaknesses in the spelling
    service are released. It is for that reason that unnecessary services should be
    deactivated. Properly deactivated network services eliminate any current or future
    threat of system penetration, control, or disabling via that network service.

    I will describe the process of turning network services on and off after the next
    section.


    # ### Ungarded Network Access Points Are Security Risks


    Not every network service can be turned off. Or, put another way, if every network
    service were turned off, then the system''s network cable might be disconnected!

    Usually, there are some network services that are necessary, and the good news
    is that most can have access controls applied. Later on I will talk about the
    application of network access control for network services that must be turned
    on.


    # ### Necessary and Unnecessary Services


    How can you determine if a network service is a necessary one? That is a difficult
    question to answer; this section will explain the services that are activated
    on a standard Solaris 7 system, what they mean, what they are used for, and what
    happens if they are turned off. I''ll also show you how to tell if a service is
    turned on or not, and how to create a simple service of your own.'
