  md: '# # Part 3: The Network-Connected System


    Network communications have multiplied the usefulness of computers and information,
    but connecting any system to a network increases the risk of mishap. The amount
    of risk is proportional to the number of people who can access the system and
    to the number and types of services that are accessible by these people.


    **Topics covered include


    +   - Part III The Network-Connected System

    - Chapter 9, "Network Interfaces and Services"

    - Chapter 10, "Network/System Architecture"

    - Chapter 11, "Electronic Mail"

    - Chapter 12, "Printing"

    - Chapter 13, "Network Access Control" (Authentication, Firewalls, Intrusion Detection,
    and Virtual Private Networks)

    - Chapter 14, "Name Services" (DNS, NIS, NIS+)

    - Chapter 15, "NFS and the Automunter"


    # # Chapter 9. Network Interfaces and Services


    We''ll talk about physical and logical network interfaces and network services
    in this chapter.

    **What''s in this chapter**


    +   - About network interfaces

    - How network interfaces are configured

    - About network services

    - How network services are configured

    - How routing information is configured

    - How to scoop (Sun''s network sniffer snippet)


    **Why this is important**

    UNIX system network interfaces and services are the facilities used to access
    a UNIX system over a network; UNIX security is frequently compromised by improper
    knowledge and configuration of network interfaces and services.


    # # Networks


    A network is a specific collection of equipment and wiring set up to facilitate
    the communications between two or more computers (or other network devices) such
    as printers, plotters, scanners, and modems). If you need more information on
    networks and how they work, refer to the list of publications at the end of this
    chapter.


    # # Network Interfaces


    A network interface is the physical part of a Sun computer used to communicate
    via a network to other computers. The interface consists of electronic circuitry
    plus one or more physical connectors used for attaching network cables to the
    computer. A network interface is configured with commands later in this chapter.


    # # Network Interface Characteristics'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'A network interface on a Sun system has a number of characteristics worth knowing
    about. These

    characteristics are


    +   - MAC address. MAC is an acronym for Media Access Control, the name of the
    ISO

    communications layer 2, known as the data link layer.[1] Otherwise as the Ethernet

    address or physical address, the MAC address is a generally unchangeable characteristic

    usually "born" into each Ethernet network interface card in the computer. An example
    MAC

    address is 8:0:20:22:e3:e2. Ethernet standards assume that no two interfaces (in
    the

    entire world) have the same MAC address.


    (1) For more information on TCP/IP concepts, please refer to the references listed
    at the end of this chapter.


    # Note


    In many cases (particularly in the newer architectures) the MAC addresses of

    network interface cards (NICs) are in fact changeable. Solaris provides a

    way of changing a network interface''s MAC address; this is discussed in the

    section on network interface configuration layer in this chapter. However,

    except in rare circumstances (such as a server with multiple network interfaces

    connected to the same subnet) MAC addresses should be considered\unchangeable
    and should not be modified. An example in this chapter

    shows how to change the MAC address.


    +   - IP address. This is the generally known address assigned to the computer.
    An

    example IP address is 204.63.68.119. Unlike a MAC address (which is generally

    unchangeable), an IP address is defined and configured by the UNIX or network
    administrator

    according to a predefined subnet plan.

    - Subnet mask. While not actually a characteristic of the network interface itself,
    the subnet

    mask is used by the network drivers to determine whether outbound packets

    be sent directly to their destinations or to the default router.

    - Promiscuous mode. This characteristic, when turned on, determines that every
    packet seen

    on the network should be passed to the software drivers and buffered, presumably
    for use by a

    program running on the system. Ordinarily the drivers filter only which packets
    intended for a

    particular computer are passed to the software drivers and buffered; the rest
    (those packets

    intended for other computers) are ignored. The snoop program places the network
    interface in

    promisous mode so that it can display all packets on the network. See the example
    snoop

    session at the end of this chapter.


    # Network Interface Configuration


    Several commands are used to configure a network interface. Also, the static values
    in some

    configuration files define initial network interface settings after system boot.


    # ifconfig


    The ifconfig command is used to examine and change the following network interface
    characteristics.


    +   - Status (up or down)

    - IP address

    - Subnet mask

    - Broadcast address (the used to send a packet to all computers on the same subnet)

    - Maximum transmission unit (mtu)—the maximum packet size

    - MAC address'
