    # Chapter 10. Network/System Architecture


    The relationship between UNIX system (and systems'') architecture to network is
    discussed in this chapter. UNIX and network architectures are symbiotic; when
    either is developed or modified, both need to be considered so that they operate
    correctly and securely.


    # What is in this chapter


    +   * Principles for overall system design and implementation that will lead to
    a more secure environment


    Why is this important

    UNIX system administrators must have the ability to step back and consider the
    overall network and systems and applications architectures. UNIX systems in a
    network are rarely “islands,” but instead have a complex web of relationships
    and dependencies. The stability and security of the individual systems and of
    the overall architecture depend upon choices made during the design and implementation
    of the systems.


    # What is An Architecture?'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'Whether the scope is a system, many systems, a network, or all of these, an
    architecture is the collection of elements that work together to fulfill some
    intended objective. That objective could be


    +   * A file-sharing system for a group of people

    * A software development platform

    * Electronic mail

    * A network to facilitate communications among several users, each of whom uses
    a complex


    # Simple vs. Complex Architectures


    Complex systems are inherently more difficult to administer than simple systems.
    A hacker, when given a choice, would probably choose to attack a complex system
    for the following reasons:


    +   * A complex system inherently contains more components (whether hardware or
    software).

    * The components a system has, the greater the likelihood that there exists a
    poorly designed or misconfigured element.

    * A poorly designed or misconfigured element can be an invitation to attack or
    exploitation.

    * A system with many components may be inviting to attack or exploitation simply
    because of the greater likelihood that an attack will go unnoticed.


    For example, consider two e-mail architectures. The first architecture, which
    we''ll call architecture A, consists of a central distributed mail servers and
    mail clients. The second architecture, architecture B, consists of distributed
    mail servers and mail clients (perhaps in a distributed or load-balancing architecture).
    Assume that both architectures are applied to the same problem. Both of the architectures
    are illustrated in Figures 10.1 and 10.2.


    # Figure 10.1. Architecture A Example


    ![](img/78b12ae142a18c12c11cf5c2be900d0b_106_0.png)


    # Figure 10.2. Architecture B Example


    107'
