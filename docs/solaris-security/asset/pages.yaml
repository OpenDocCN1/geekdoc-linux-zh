    # Chapter 7. CRON and AT


    We will examine the UNIX job scheduling subsystems cron and at in this chapter.

    What''s in this chapter


    +   - How cron and at work and how they are configured

    - Common mistakes and pitfalls

    - Auditing and mitigating security risks


    Why this is importantnBecause cron and at are what UNIX administrators tend to
    use to add their scheduled jobs to a system, cron and at tend to be a favorite
    for hackers. Many UNIX administrators make common mistakes while using cron and
    at, and these mistakes can be easily avoided.


    # cron


    # What is cron?


    cron is a job scheduling system used to execute regularly scheduled commands at
    predetermined times. Typically, the commands executed by cron are batch programs
    that are used to perform chores'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'such as cycling logfiles, purging information from files or directories, backing
    up and cleaning up databases, and so on. A program configured to run by *cron*
    is commonly known as a *cron job*nThe UNIX administrator can control which users
    have access to *cron* (described later in this chapter).


    *cron* is configured to execute programs at regular intervals. These intervals
    are measured in minutes, hours, days, weeks, and months. Simple and complex scheduling
    schemes can be configured for programs. Examples include


    +   * Every five minutes

    * Every day at 4:05 A.M.

    * Every Monday at 4:05 A.M., 12:05 P.M., and 4:05 P.M.

    * At every hour on the fifth of each month

    * Every December 31 at A.M.


    A user schedules jobs to run by configuring a *crontab* file. A *crontab* file
    contains each command a user wishes to run, with the days and times that each
    command should run. The syntax for a *crontab* file is


    ```

    minute hour day-of-month day-of-week command

    ```


    Minute is coded 0–59, hour is coded 0–23, month is coded 1–12, and day-of-week
    is coded 0–6 (Sunday, 1 = Monday, etc.). A field can have a single number, a list
    of comma-separated numbers, a range of numbers, or an asterisk.

    Lines beginning with the # symbol are comment lines.

    Here is an example *crontab* file.


    ```

    #ident "(@) root 1.14 97/03/31 SMI" /* Svr4.0 1.1.3.1 */

    #

    # root crontab

    #

    10 3 * * 0 /4 /etc/cron.d/logchecker

    10 3 * * 0 /usr/lib/bin/newslog

    45 3.15 * * 0 /usr/lib/bin/fs/nfsind

    ```


    In this example, *logchecker* runs on Sundays and Thursdays at 3:10 A.M. *newslog*
    runs on Sundays at 3:10 A.M. *nfsind* runs on Sundays

    It is important to understand that there is no intrinsic between or to the intervals
    described above. When *cron* runs a job every five minutes, it doesn''t start
    and end next—*cron* runs the job five minutes forever. Furthermore, a program
    started by *cron* cannot tell *cron* to execute it in five minutes as it is configured
    to not tell *cron* not to execute it.

    Refer to the *crontab*(1) for a complete description of *crontab* options.


    # How Cron Works


    At system startup, the *cron* daemon reads and reads all users *crontab* files.
    *cron* also reads the file /etc/cron

    It then does nothing until it is time for the next job to be launched for any
    user. *cron* forks (into two identical processes) and the *cron* parent process
    goes back to sleep. The *cron* child changes its usage to that of the user for
    which the job is being launched, the child executes the job.


    # How Cron Is Configured


    *cron* examines the file /etc/def/*cron at system startup to determine the values
    of CRONLOG, PATH, and SUPATH. These values are shown in Table 7-1.'
