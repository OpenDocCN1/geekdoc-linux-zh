- img_proc: true
  md: '# Patch Installation


    To install a single patch on a system, use the following procedure.


    +   1. Enter the command `mkdir /tmp/patch.

    2. Copy the patch file to the directory /tmp/patch.

    3. Uncompress the patch file with `uncompress` (if the patch filename ends with
    .Z) or `gunzip` (if the patch filename ends with .gz).

    4. Unwrap the patch file with the `tar` command. For example, if the patch filename
    is 10645-03.tar, the command would be `tar xvf 10645-03.tar`.

    5. Install the patch with the `installpatch` command. For example, enter the command
    `/tmp/patch/10645-03/installpatch /tmp/patch/ 10645-03.

    6. Examine the patch installation. To continue this example, the log file is /var/sadmpatch/10645-03.log.


    # Bulk Patch Installation


    To apply many patches at once on a system, use the following procedure.


    +   1. Enter the command `mkdir /tmp/patch`.

    2. Copy all patch archives to the directory /tmp/patch.

    3. Run the following script to install all patches unattended.

    4.

    5. #!/bin/sh

    6. #

    7. cd /tmp/patch

    8. uncompress *Z

    9. for patch in *

    10. do

    11. tar xvf $patch

    12. installpatch /tmp/patch/$patch

    13. done

    14. rm -rf /tmp/patch

    15.


    To apply many patches at once on several systems, use first `rdist` (or similar
    tool) to distribute patches and the wrapper script to all of the systems; use
    `rsh` or `Ssh` to execute the wrapper script above.

    Although it may be potentially time consuming to do so, you should examine the
    logs for all patch installs on all systems for errors.


    # Patch Installation Procedures for Solaris 2.6 and Solaris 7


    The `patchadd` and `patchm` commands were introduced with Solaris 2.6. Instead
    of being shipped with each (each are `installpatch` and `backpatch`), `patchadd`
    and `patchm` are part of Solaris.

    patchadd` provides a means for the bulk installation of patches, including installation
    of patches to client systems over the network. Thus, on Solaris 2.6 and later,
    there is no need for bulk installation wrappers such as the example in the preceding
    section.


    Note


    Do not use the `patchadd -d` option when installing patches. This option does
    not save backup information needed to remove the patch at a later time.'
