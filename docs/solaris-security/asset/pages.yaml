    # Part 4: Disaster and Recovery


    UNIX administrators pride themselves on the architectures, policies, and procedures
    they develop, and make a fine computing environment has been built upon a good
    combination of technical knowledge, business acumen, and common sense. But, like
    life insurance, the effort required to prepare for recovery in the event of a
    disaster is a category of thought and action that many disregard. It is not human
    nature to be proactive about worst case scenarios.'
