    # Ignore Redirects


    A redirect packet is an Internet control message protocol (ICMP) message telling
    a system (or router) to

    change routing table. This is potentially dangerous because an intruder, knowing
    that a Solaris

    system is acting as a router, can attempt to alter its routing table (for instance,
    as part of a denial-of-

    attack) by sending it redirects.

    Any Solaris system—even one configured as a router—should ignore redirects. To
    have the system do

    so, add the following entry to the end of /etc/init/ininit.


    ```

    ndd -set /dev/ip ip_ignore_redirects 1

    ```


    # Send Redirects


    Not only Solaris systems ignore redirect packets, but they should also be configured
    to not send

    redirect packets. To accomplish this, add the following entry to the end of /etc/init/ininit.


    ```

    ndd -set /dev/ip ip_send_redirects 0

    ```


    # Forward Directed Broadcasts'
