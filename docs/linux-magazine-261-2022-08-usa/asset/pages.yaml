    stated in a recent update, "One thing of note is how the long-time ARM generic
    kernel (multiformat) is pretty much done after 10+ years. Congrats to everyone
    involved. StrongARM platforms remain with their separate kernels and it is so,
    but compared to things where a decade ago, this is a big step


    Beyond major advancement, the 5.19 kernel will be rather boring for standard users,
    alike and changes to the "big" side. The majority of the new additions and changes
    to the 5.19 kernel are hardware-related driver support. With the architecture
    updates (such as NVMe support for Apple Silicon and updates (https://github.com/apple/linux/tree/main)
    and Loop-g64 architecture), improvements to today are kernels, 5.19 might be the
    most "boring" big deal to have around in some time.


    The 5.19 kernel is scheduled to release around July 2022.


    # ## Millions of MySQL Servers Exposed


    The Server Foundation recently reported that over 3.6 million MySQL servers are
    publicly exposed (https://www.shadowservers.org/news/over-3-6-million-exposed-mysql-servers-on-ipv4-and-ipv6).
    The discovery was made when the research group began scanning for accessible MySQL
    instances over port 3306. The results of their scan up 2.3 million IPv4 addresses
    and 1.3 million responded to the query. These accessible servers responded with
    a Server Greeting.


    Although researchers did not check for the level of possible access or data exposure,
    this is still an important attack surface that must be closed. The most widely
    version of MySQL with the vulnerable attack surface (with IPv4 addresses) was
    found to be 5.7.33, whereas the IPv6 addresses showed version 5.5.10.12 which
    was the most widely used.


    The most important thing can do to avoid potential issues from the Internet to
    your MySQL server:


    For anyone wanting to replicate these scans (see if your MySQL servers are accessed
    from the Internet), you can use the command nmap -sv -sc SERVER (where SERVER
    is the IP address or domain of your MySQL server), (https://nmap.org/book/nmap-ing.html).
    It is also advisable that you always keep your MySQL servers up to date.


