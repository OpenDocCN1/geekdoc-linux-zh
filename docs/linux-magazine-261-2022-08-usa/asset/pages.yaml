    ![](img/31162a00ee46c5d590c544cb2d944405_94_0.png)


    # #260/July 2022


    # Privacy


    If you are really serious about privacy, you''ll need to learn on how your browser''s
    tracking button. Those who need anonymity the most depend on the Tor network -
    a global project offering safe surfing in surveillance states. We also look at
    Portmaster, an application firewall with some useful privacy features.


    **On the DVD:** Ubuntu 22.04 and Fedora Workstation 36


    ![](img/31162a00ee46c5d590c544cb2d944405_94_1.png)


    # #259/June 2022


    # Zero Trust


    Twenty Years ago, everyone thought a gateway firewall was all you needed to stay
    safe from intruders, but trust had a different history story. Today, the best
    advice is: Don''t trust anyone. Your internal network could be just as dangerous
    as the Internet.


    **On the DVD:** Zorin OS 16.1 Core and Super GRUB2


    ![](img/31162a00ee46c5d590c544cb2d944405_94_2.png)


    # #258/May 2022


    # Clean IT


