    # Simple Gemini Servers and Clients


    For basic testing, a one-line Bash script can be used for either a Gemini server
    or a client. The Gemini protocol typically uses Sockets Layer (SSL) and Transport
    Layer Security (TLS) encryption. Bash ncat utility is needed (Note: the command
    does not support SSL).

    The Bash code to serve each single Gemini page is:


    ```

    ```

    while true; do

    echo -n "Content-Type: text/gemini\r\n"

    cat page1.gemini |

    ncat -p 1984 --; done

    ```

    ```


    This bash echoes the Gemini content type ("text/gemini") and lists (cat) the example
    file when a request is received. The ncat utility uses (-l option) on port 1965
    (the default Gemini port) for incoming requests.

    The script to connect to a Gemini server is:


    ```

    ```

    echo "gemini://192.168.0.105" |

    ncat --ssl 192.168.0.105 1965

    ```

