  md: "# # IN-DEPTH\n\n# Hot Backups\n\n# How Do LVM Snapshots Work?\n\nyears: LVM\
    \ (Logical Volume Manager). As its name suggests, it is designed to manage logical\
    \ volumes. Its claim to fame is its flexibility; it allows administrators to add\
    \ more drives to a cluster and use them as an extension to existing filesystems.\
    \ One overlooked drawback of LVM is its snapshot function.\n\nAn LVM snapshot\
    \ volume does not actually contain all of the files as they were in the original\
    \ filesystem when the snapshot was taken.\n\nWhen a snapshot is taken, the snapshot\
    \ volume makes notes of the original filesystem at the time of the snapshot. When\
    \ a file is modified after the snapshot, the old version of the file is found\
    \ in the snapshot; thus, the snapshot volume only contains files that have been\
    \ modified since the snapshot.\n\nAs a result, a snapshot volume does not need\
    \ to be as large as the original volume because it only contains the changes between\
    \ the original and the current date. Using a small snapshot volume, however, comes\
    \ with risks: if the original is modified to a file that is changed in the snapshot,\
    \ the snapshot volume will be dropped and rendered broken. It is important to\
    \ allocate enough room for the snapshot volume.\n\nThe main drawback of LVM is\
    \ that its deployment must be planned in advance. Lets say we deploy a database\
    \ that stores data application in /var/pictures. In order to take snapshots in\
    \ the future, we must intend to create /var/pictures first. For such a purpose,\
    \ a partition within a drive created as a logical volume within an LVM container\
    \ must exist.\n\nWe must create a Volume group using vgcreate (2). Finally, we\
    \ have to create a logical volume over the Volume group using vgcreate and format\
    \ it.\n\nThe snapshot can be mounted as a regular filesystem. If the user needs\
    \ to access a file that was modified since the snapshot was taken, the file will\
    \ be retrieved from the original filesystem. If the file has been modified-\n\n\
    Not every filesystem is suitable in conjunction with LVM snapshots. Filesystems\
    \ must support freezing in order to guarantee that the results are correct when\
    \ they are taken. XFS and ext4 are known to work, and there are more options.\n\
    \nCare must be taken to leave free space in the volume group to host snapshots.\
    \ The snapshot area needs to be large enough to store the changes you want to\
    \ back up, but if the store is available,\n\nIf you need to make a backup of /var/pictures,\
    \ you will need to create a snapshot volume using the volume group-\n\n# No Silver\
    \ Bullets\n\nSnapshots don't have clear disadvantages. The main disadvantage is,\
    \ as previously mentioned, using snapshots requires careful planning. If you intend\
    \ to use snapshots as part of your backup strategy for a team, you need to know\
    \ the contents of that snapshot-capable storage to use.\n\nAnother issue is performance.\
    \ LVM is particularly known for taking a performance hit when it creates multiple\
    \ snapshots from the same system [3].\n\nA snapshot volume may be mounted as a\
    \ regular filesystem under a direct directory when you are:\n\n```\nroot@home:~#\
