    # Next-Generation HTTP/3 Protocol Arrives as a Standard


    The Internet Technology Force (IETF) has officially released the third major revision
    of the HyperText Transfer Protocol (HTTP/3) as a standard. (https://github.com/2022/06/07/http3_rfc_9114_published).
    RFC 9114 (https://www.rfc-ietf.org/info/rfc9114) describes the new HTTP, which
    provides better will to... stream multiplexing, per stream flow control, and latency
    connection establishment.


    The change involves the v3 protocol, which was originally developed by Google,
    has since been extended and adopted by Microsoft, Soft, and others. Unlike previous
    versions of the HTTP, which relied on the slow but careful TCP protocol for establishing
    and verifying connections, the new version uses faster and more agile QUIC as
    transport protocol. QUIC, which stands for "Quick UDP Internet Connections," is
    based on the connectionless UDP transport


