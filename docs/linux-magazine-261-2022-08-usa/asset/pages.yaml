    $1,099. The original announcement came out May 2022, and by the time, the laptop
    was unavailable for pre-order. Fast forward to today and powered hardware, the
    US can now order one of these new pieces of Linux-powered hardware. The Dev One
    keeps prices slightly lower by going without CPU and graphics; the base model
    has an 8 core, 16-thread Ryzen 7 5850U processor with a 1.4GHz clock speed, integrated
    AMD Radeon graphics, and 16GB of DDR4-3200 RAM (upgradeable to 64GB). The chassis
