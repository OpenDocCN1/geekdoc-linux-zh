    # ### Is It a Bug or Is Time to Go?


    David McColl wanted to mount a nearly old Common Internet File System (CIFS) 1.0
    drive into a kernel bug that caused the mount to fail. He spent hours in Gbisecting
    the exact path that caused the problem and posted his findings in the hope that
    a fix might be found.


    CIFS is a variant of Server Message Block (SMB) introduced by Microsoft with Windows
    95 in 1996. SMB was developed by IBM in the 1980s. CIFS and SMB are similar file
    system protocols for other users on the same network.


    There was some discussion on the Kernel Mailing List, including efforts by folks
    such as Steve French and Ronnie Sallibert about checking David''s bug possible
    regressions in the next release.


    However, their discussion persisted after a while, prompting Thomas Levens - who
    expressed concern with these types of regressions and other tracking - "David,
    Ronnie, and Steve: What is the status here? It seems like some debugging goes
    back and forth every time. What some progress have been made and where I just
    missed?",


    David replied that he had most likely not forgotten and was continuing to use
    a workaround to access the CIFS 1.0 drive. He also was checking each kernel release
    to see if the issue


    ![](img/31162a00ee46c5d590c544cb2d944405_11_0.png)


    had been resolved. In addition, Ronnie remarked, "I tried but could not find a
    system old enough to reproduce. Member, this is an authentication mechanism that
    Microsoft begged people to stop using and migrate away over 20 years ago. [I''m
    not sure how to say this, but it is just so much time you could spend on something
    that was declared obsolete 20 years ago."


    Thorsten replied in that, perhaps the best solution would be to simply revert
    the patch David had found to be the cause. To Ronnie remarked, "Right now you
    likely just revert it. Maybe in the next kernel. But in a kernel not too far into
    the future the code that this patch implements will simply not be more in the
    linux kernel and will not be available through the standard API. At that point
    it is no longer a matter of reverting the patch by a matter of reverting an equivalent
    development or porting it to the next kernel."


    Thorsten felt he needed some advice from above. "I pointed Linus towards this
