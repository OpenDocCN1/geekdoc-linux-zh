  md: '# EDITORIAL


    Welcome


    # IF YOU THINK IT''S GREAT


    Dear Reader,


    A few months ago, I wrote about the strange case of misbehaving color.js and faker.js
    open source libraries. These popular tools were sabotaged by their own developers,
    who had been disillusioned by the way it goes without contributing or providing
    compensation. The larger point was the need for an orderly transition when a developer
    has to step away for good. Burnout is a reality thing for FOSS developers, but
    it has a way of coming. People change jobs, get married, have kids... open source
    projects need to provide continuity when a developer leaves


    leadership for a tool that ships part their distribution. The best part is that
    all appears to have happened nicely. Of course, the Mint guys have forked Timeshift
    and their own project, but it is much better for the rest of us to keep it all
    together and avoid the confusion and duplication that comes with unnecessary forks.


    After I wrote you in Linux Issue 256 (3), I heard from a reader who suggested
    I mentioned that one way to make some open source projects continue and a good
    way to show appreciation for the work they do is to make a contribution. Many
    FOSS projects offer a way to donate. Linux users tend to skip contribution pages
    - it is supposed to be free, free for spending their time to improve your experience
    and in some cases, paying out of pocket for web hosting and office supplies. The
    suggestion, was to download the tool and try it out; if you like it, go to the
    site and donate. It seemed worthy advice, so I''m passing it on. If you like,
    it''s great, remember.


    When we call out a fiery explosion the color.js crash, it is also good to shine
    some light on the successes - projects that successfully pass the baton in an
    order that maximizes continuity. In the 1 monthly report at the Mint site, Mint
    announced that it had taken over maintenance of Timeshift, a snapshot tool that
    is being "a matter of feature" in Windows and the Timeshift tool in max.qs.


    According to the news post by Mint project leader Clement "Clem" Lefebvre, but
    Tony George was working on the project in order to focus on other tools and maintains,
    such as the Apple Integration Ubuntu Kernel Update (UKU). The Team thanks Tony
    George''s work [2]. To the Mint blog, developers reached out to George to see
    how they could maintain Timeshift, and the result was that he passed the maintenance
    over to Mint. Timeshift is maintained as part of Mint''s Xapps, which Clem calls
    a collection of "generic-applications for traditional GTK desktop environments.


    BTW: The announcement on the Mint blog includes a link for Timeshift fans to send
    a $5 donation to Tony George for his work (4). Oh, and there is also where Mint
    users can kick in for Mint (5).


    ![](img/31162a00ee46c5d590c544cb2d944405_2_0.png)


    Joe Cas

    Editor in Chief


    # Info


    +   (1) Mint Monthly News: https://blog.linuxmint.com/

    (2) TeeTech: https://tejeteech.com/

    (3) "To the Colors" by Joe Cas, Linux Magazine, issue 256, March 2022:

    https://www.linux-magazine.com/issues/252/256/Welcome

    (4) Timeshift donation:

    https://tejeteech.com/product/timeshift-donation/

    (5) Mint Monthly: https://www.linuxmint.com/donors


    George engineered the software for Linux as he moves others to, and Mint stepped
    up'
