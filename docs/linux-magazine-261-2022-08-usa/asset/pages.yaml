  md: '# LINUX VOICE ZRYTHM


    # Conclusions


    The Zrythm project enters the scene with a very carefully considered design. I
    actually prepared an installer and have no regrets about doing so though the program
    isn''t really ready for production yet at its current stage. You can clearly see
    that Alexander Theodore keeps who he is and


    working hard to create a powerful new source DAW. If Theodotou keeps working at
    pace for another year, you can look forward to a new and very interesting audio
    tool for the Linux desktop.


    # The Author


    Hartmaat Noord works in Cells and Hannover as a lecturer, author, and musician.
    When he is not sitting in front of his Linux audio work, he hangs around on web
    servers. His web server at http://lapoc.de is host to host CC-licensed examples
    of his own work with free software.


    # Info


    +   [1] Zrythm: https://www.zrythm.org

    [2] Video tutorials: https://www.zrythm.org/en/learn/

    [3] CSS interface design: https://manual.zrythm.org/de/theming.css

    [4] Scripting: https://manual.zrythm.org/en/scripting/intro.html

    [5] Bug report: https://todo.sr/~alalexee/zrythm-bug


    # Save Often, Save Zry


    Development of Zrythm is still in the alpha phase, and can be seen, in regular
    crashes. These crashes were triggered by various options in our lab, such as color
    for a track or cutting of audio. Crashes were also observed simply when the application
    ran for a longer period of time. The problems were always associated with a flood
    of runs on the JACK back. A lock at top in the terminal showed a challenging 300
    percent CPU load and for Zrythm in this situation. Even now and then the engine
    hung up for some cases, Zita-a2 running, which makes MIDI devices that are registered
    in ALSA went zombie. This small server is necessary for normal operation of Ubuntu
    Studio, the reboot of the computer was the easiest way.


    When asked Theodotou for how to avoid this kind of disaster, he explained in the
    interview that he had to contain errors of this kind. They rarely occur, and he
    fixed them as soon as the user brings it to his attention. Users should therefore
    report scenarios of this kind with logs and backtracks and describes for promoting
    the error. The Zrythm project uses the Source developer platform for bug reports.
    Reports can also be documented within the bug report to keep optimistic that reports
    are not just dumped into a black hole.


    Bear in mind that JACK is a professional audio system. It''s real-time performance
    with guaranteed latency of under fifteen milliseconds. Since all this is powered
    to be available to simple users, you have to grant it as a special privilege to
    the audio user group in /etc/jack.conf


    However you do so, it is a very good idea to save your work regularly - next session.
    Automatic logging of data loss in cases where our lab was always possibly possible
    to restore the project completely from backup, including the last actions that
    you did not save manually.


    In our lab we used Zrythm 2.04 with its special low-latency kernel. This gives
    applications that JACK in frame has more than a web browser and 30 games able
    to push the system limits. When going so extremely exhaust RAM, there are limits
    for the CPU, so there is a little bit left in calling up recording consoles and
    killing -9. In Zrythm''s case, we were forced to press the reset button in our
    lab after 20 minutes of waiting in case.


    However, as it comes at a price: Zrythm creates a backup every minute. To do this
    it creates a copy of the current state with all audio files in /local/share/zrythm/projects/<Project>/backups/.
    It doesn''t seem to be a cleanup mechanism, which means that this direction is
    going towards a 90GB log in our lab - and with only three processes, of each less
    than three minutes long. You will want to delete the backups now and time. In
    addition, the interval can be extended in the settings.


    AUGUST 2022


