  md: '# COVER STORY


    # Multiboot for USB


    # Creating multiboot-capable USB sticks


    # # Many Boots


    A USB stick holding all the distributions could be a useful mobile toolbox. This
    month we explore three tools for creating multiboot-capable memory sticks.


    By *Erik Bärwald*


    Live boot has been part of the Linux scene for many years. The idea behind it
    is simple but very powerful: Carrying the operating system wherever you go, and
    when you plug it in, boot into it. Live systems let you test out an operating
    system before you install, which is why many Linux distros offer pre-built Live
    images. Perhaps the most use for Live systems is troubleshooting. If a hard drive
    has a configuration error installed from a source, boot to a live disk and search
    for the trouble. Troubles, such as Knopix and RescueCD, allow system administrators
    to fix items without losing travel-media – typically read-only, which was a limitation
    on availability for everyday users. In the age of USB sticks, live systems have
    become more flexible. Support for persistence means you can customize the system
    in ways that were not possible before, eliminating strict size limitations. USB
    sticks come in array of sizes, and are much larger than drives we were in the
    not-so-distant past.


    The ease and flexibility of USB sticks has led to another important innovation
    in history. The first USB-based tools were modeled after the previous CD/DVD media.
    You modeled a system to the stick, then started with the system in place to boot.
    The new best of boot live tools take the technology to another level. These tools
    basically manage a boot loader that you can copy multiple systems onto one disk.
    You can then choose different systems from the same USB stick.


    You might be wondering when to start multiple boot images on the same stick. It
    doesn''t take long to find situations where you might customize system images
    for different uses, such as for home or work, or different presents: a game distro
    for your system live time and a rescue for your job in it!


    As before, the IT industry still has a need for the troubleshooting powers of
    live drives, and multiboot offers offer an important benefit. You can store images
    for


    different hardware systems on a single disc – carry one image for EFI systems
    and one for BIOS systems. The possibilities are endless.


    Innovations in persistence and multiboot mean that Linux is a viable option for
    those who might not considered it in the past. This month we examine some of the
    leading live boot options. We''ll start with Ventoy, which supports a wide range
    of hardware, platforms, and round out our story, introduce you to a pair of other
    leading candidates: Multiboot and System.


    Read on to look at multiboot for USB, but keep in mind, if you want to try these
    tools for yourself, make sure your system is configured to support USB boot –
    see the box entitled “Enabling USB Boot”.


    # Enabling USB Boot


    Early PCs could boot from a disk. Hard drives ended the mainstream, floppy boot
    stayed around and was often the best way to recover the computer when a configuration
    error caused an unusable environment. When DVDs were later replaced the floppies
    became the lead removable storage options, giving us to revive the Linux systems
    we know now.


    A setup menu where your computer''s firmware sets the hardware order of preference
    for where to boot the operating system. If your computer won''t boot from a USB
    drive, you might need to check the documentation for how to access the setup menu,
    and to ensure that the USB boot is enabled – and that the boot is configured so
    that the system will drive before booting from somewhere else. If you see a screen
    when your system starts


    Changing the boot order was easy in BIOS days, today''s UEFI systems can be more
    complex. The Ventoy tools, for instance, say that Ventoy supports UEFI boot, but
    boot is not reliable and is enabled by default [2]. If you are using a multiboot
    tool that disables or doesn''t support secure boot, you will need to enable boot
    in the setup.'
