  md: '# Managing time-triggered events with Zeit


    # # Timetable


    Zeit offers a graphic front for the cronab and tools, making it easier to manage
    the time-controlled execution of programs, alarms, and timers. By Frank Hofmann


    When it comes to managing the time-controlled execution of programs, we use the
    entries in /etc/crontab file (for repetitive tasks scheduled at regular intervals)
    or we use the cronab for a one-time action.


    While we use a kind of order book that stores the commands to be executed by the
    whole system, cronab works differently. The crontab contains entries for the whole
    system, while the files in /var/spool/cron/ contain entries. Each line in the
    crontab fully describes a single job. Care must be taken when specifying jobs
    because the entry''s format is arcane. You can learn its syntax, but mastering
    it is a trivial task. If you use an IPC interface, you will be familiar with the
    format.


    Despite and care, you may find out that cronjobs start or are executed at the
    wrong time. A graphical user interface (GUI) can help reduce


    errors, ever experienced users. However, several attempts at a suite for time-controlled
    calls (e.g., KCron, KcCron, CronMagie, Gnome Task Scheduler [1], and Vcron) have
    fallen short due to owing complexity or simplicity.


    Zeit [3], a graphic front for the cronab, promises to remedy this and make time-triggered
    events easier. In development since 2015, Zeit is now considered for use and offers
    both English and Russian versions.


    # Installation


    I installed Zeit v0.6.0 on Debian "Bulls" without any problems. Zeit is not included
    in the official Debian and Ubuntu sources. You can install it via the GitHub repository
    or by an Ubuntu PPA.


    You have a few options for installing Zeit. You can add


    the PPA repo by typing apt-add-repository ppa and installing the packages with
    your package manager (Listing 1). Because this option is not available on Debian,
    I took the alternative of deploying the zeit package provided by the developer''s
    GitHub. I deployed it to test the system using 594. There were no problems during
    the process. After grabbing the package from the project, I used the package library-binutils-binding,
    which is what I use for now. When installed, Zeit uses about 450KB of disk space.


    If there are no ready made packages available for your distribution, you can download
    the source from the GitHub repository and compile it. This did not test here,
    but it is worth preventing you from doing so, if necessary. Zeit Zeit uses the
    Qt libraries; you will


    +   Listing 1: Installation via a PPA


    ```

    $ sudo apt-add-repository ppa:blaze/mine

    $ sudo apt update

    $ sudo apt install zeit

    ```'
