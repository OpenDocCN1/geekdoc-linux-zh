    # # First look at the Zrythm Digital Audio Workstation

    Alpha Symphony


    Zrythm is an open source digital audio workstation that will one day compete with
    commercial tools like Bitwig Studio and Tracktion Waveform.


    BY HARTMUT NOACK


    Linux offers many many options for producing music – some commercial and some
    open source. The open side has made lots of progress over the past few years,
    but the all-free studio still has gaps. For instance, when a maker wishes to record
    for music production, the most viable solutions, such as Tracktion and Bitwig
    Studio, are still proprietary. The Zrythm [1] project by Alexander Theodorou seeks
    to close this gap with free software (2).


    To achieve these effects, a DAW needs to offer a wide range of options for auto-mating
    parameters.


    Theodorou''s commitment to the project is evident from his website: He provides
    short but succinct clips presenting the central function and answering the most
    frequently asked questions [2].


    Zrythm is a free Digital Audio Workstation (DAW) that is still in the development
    stage, but you can download it right now to try it out.


    # Installation


    Zrythm is available as free software under the GNU GPLv3 license. You can download
    the source code anonymously and as a daily build. Like Ardour, Zrythm offers a
    convenient installer for all Linux variants. The developer asks for a contribution
    of an affordable £10 for the installer, and you can pay by PayPal or credit card


    # Strong Start


    Alexander Theodorou has already been working on the LV2 plugin for some time when
    he decided to build a freely licensed DAW that would meet his needs. He is specifically
    interested in electronic dance music (EDM). With EDM a DAW must be able to handle
    MIDI sequences alongside live vocals. Alexander has written comprehensive options
    for music production and looping deconstructing samples.


    The installer packages show out the usual Linux system format /usr. In addition,
    there is an Appliance that only installs the core files in home and can be deleted
    if you don''t like it. In our lab, the Appliance made out of the Ubuntu 20.04
    with the version 5.13.0-5 kernel and Jackmd 1.9.12 running at startup time. The
    installer prompts for the desired audio back-end, and you can run a function test
    right away. Apart from the unavoidable setup delay,


    The use of effects as instruments is also popular in Zrythm. Samples and entire
    mixes are processed with intensive filters with settings that change dynamically
    over the course of the


