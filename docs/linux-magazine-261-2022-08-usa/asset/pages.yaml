    # Responding to Readings


    If Im-sensors has a fault, it is that there is no way to see how temperatures
    change over time. However, regular readings (or even a hand on the sensor) can
    tell you if the temperature is stable or not.


    But what should you do if the temperature is high or approaching critical? Common
    answers are: in short term shut down immediately and wait a couple of hours, temporarily
    remove the overheated hardware – if it is overheating, then in the long term,
    remove the side case and add fans. Use room fans or in portable air computers.
    For monitoring, set Im-sensors to start automatically when booting the run:


