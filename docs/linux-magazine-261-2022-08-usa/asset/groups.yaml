    ![](img/31162a00ee46c5d590c544cb2d944405_1_1.png)


    # 编辑观点


    ## 如果你**认为这很棒**，那么欢迎光临


    亲爱的读者：


    几个月前，我写过关于 color.js 和 faker.js 开源库行为异常的奇怪案例。这些流行工具被它们自己的开发者破坏了，他们对那种既不贡献也不提供报酬的方式感到幻灭。更核心的一点是，当开发者必须永久离开时，需要一种有序的过渡。职业倦怠对于开源软件开发者来说是现实，但它总会来临。人们会换工作、结婚、生孩子……当开发者离开某个分发版中工具的领导职位时，开源项目需要提供连续性。最好的消息是，一切似乎都进展得很顺利。当然，Mint
    的人们分叉了 Timeshift 并创建了自己的项目，但对我们其他人来说，保持整体完整并避免不必要的分叉带来的混乱和重复要好得多。


    在 Linux Issue 第 256 (3) 期给你们写信后，我收到了一位读者的建议，他建议我提到，让某些开源项目持续下去的一种方法以及感谢他们所做工作的好方法，就是做出贡献。许多开源项目提供了捐赠方式。Linux
    用户往往会跳过贡献页面——因为它本应该是免费的，免费让开发者花时间来改进你的体验，在某些情况下还要自掏腰包支付网络托管和办公用品。建议是下载工具并尝试一下；如果你喜欢，就去网站捐赠。这似乎是值得采用的建议，所以我转达给你们。记住，如果你喜欢，那就太好了。


    当我们谈论 color.js 崩溃的剧烈爆炸时，关注一些成功也是好的——那些以最大化连续性的顺序成功接棒的项目。在 Mint 站点的每月一份报告中，Mint
    宣布它已接手了 Timeshift 的维护，这是一款快照工具，在 Windows 中正成为“功能问题”，以及 max 中的 Timeshift 工具。


    根据 Mint 项目负责人 Clement "Clem" Lefebvre 发布的新闻，Tony George 此直负责该项目，以便专注于其他工具和维护，例如
    Ubuntu 内核更新。Mint 开发者联系了 George，看看他们如何如何维护 Timeshift，结果是将维护工作交给了 Mint。Timeshift
    现在作为 Mint 的 GTK 桌面环境应用程序的一部分进行维护。顺便说一下：Mint 博客公告包含一个链接，让 Timeshift 的粉丝可以向 George
    捐赠 $5。哦，而且 Mint 用户也可以加入。


    ![](img/31162a00ee46c5d590c544cb2d944405_2_0.png)


    Joe Cas

    总编辑


