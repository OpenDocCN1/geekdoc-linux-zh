    \ `./ventoy.sh` 来调用界面。在所有情况下，验证后你都会看到程序窗口，且控制控件在每种情况下都是相同的（见图 1）。\n\n程序窗口列出了你已连接的可移动介质。在设备框中开始选择。选择设备后，窗口将显示本地运行的\
    \ Ventoy 版本，以及如果存在的话，任何已连接 USB 闪盘上运行的 Ventoy 版本。在下一步中，选择你想要安装操作系统的设备。\n\n在您点击\
