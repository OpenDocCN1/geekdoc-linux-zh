    ## 命令行 – lm-sensors


    ## 监测你的硬件温度


    ### 散热散热


    ![](img/31162a00ee46c5d590c544cb2d944405_43_0.png)


    通过 lm-sensors，你可以监控硬件的内部温度以避免过热。作者：Bruce Byfield


    在过去的十年中，笔记本电脑趋向轻薄化和功能化的趋势，这加剧了本就存在的问题。


    硬件温度长期一直是系统管理员和服务器农关注的焦点。随着全球夏季的到来，消费级口袋设备内部的记录性温度已成为一个主要关注的问题。过热量可能会导致电脑运行异常。在极端情况下，过热可能导致你的电脑关机，或者更糟糕的是，会对敏感元件造成永久性损坏。如果你将笔记本电脑放在腿上使用，可能会导致严重的三度烫伤。


    由于关涉众多，监控硬件温度有着迫切的需求，至少是在新机器上、在炎热的日子里以及当你的计算机长时间运行的季节，而许多人使用的工具仅仅是够用，甚至已经过时。结果是，用户不仅没有办法应对热量，而且还缺乏充分或及时的工具。坦率地说，lm-sensors
    软件包可以帮助解决这个问题，尽管它需要一些配置并加载内核模块。


    无论何种，理想的情况是让更多的冷空气进入机箱，热空气排出机箱，通过空气和风扇将空气推向后部和顶部。然而，这些空气可能会被组件以及它们固定在机身上的点阻挡。此外，炎热的日子意味着进入箱体的空气冷却效果没有寒冷的日子那么好。


    为了监测这种困难且不断的情况，现代硬件配备了热传感器。读取温度差意味着你可以构建一张气流图——或者 Linux 内核模块将读取设置和其他信息输出到 /sys/class/hwmon
    伪文件系统中，并在那里为应用程序进行配置。它并不是为了供人类阅读而设计的，尽管可以使用对普通用户来说不实用的复杂负载来描述信息。


    ## 热热力学问题


    ## 作者


    **Bruce Byfield** 是一位专注于自由和开源软件的计算机记者、作家兼编辑。除了写作项目外，他还教授 Linux 和在线学习课程。在他的个人空间里，他编写关于西海岸（https://brucebyfield.wordpress.com）的内容。他还是
    Pretentice 的联合创始人，这是一个关于写作和自由思考的博客，地址为 https://pretentice.com/。


    简单来说，电脑在在使用时会产生热量。在封闭空间内，热量很容易上升而不是发散。风扇可以正常工作，但在笔记本电脑上可能特别困难，因为其组件被挤在比工作站更狭小的空间内。


