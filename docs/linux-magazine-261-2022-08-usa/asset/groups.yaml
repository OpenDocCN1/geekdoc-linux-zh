    64 位系统以来，他一直是 Linux 的热忱倡导者。他担任 Linux International 的主席！


    ## DOGHOUSE

    关于迁移到开源的思考——这不必是令人不可负担的，并且可能会显著降低成本。


    作者：JOHN ''MADDOG'' HALL


    # 向开源迁移


    有些人带着“迁移到开源”的问题来找我，却不知道从何开始。这些人反复提到公司、教育机构和政府（地方、地区或国家级）。

    在大多数情况下，他们似乎认为某件事弹指之间就会发生了。其他时候，他们似乎觉得，如果一个人能做到，每个人都可以开始。

    对于对此我有几点观点，这些观点已被各种个人和团体成功使用。


    ## 4. “如果坏了，就修修！”

    这是“如果没坏，就不要修”的对立面。如果一个现有系统运行缓慢、多 Bug 或需要新硬件，不要在上面继续浪费金钱。

    使用 FOSS（自由及开源软件）重写整个系统是值得的，也许可以采用三层客户端模型，使用 FOSS 数据库 MySQL、中间层代码和用于展示数据的 Web 服务器。这套
    Linux、Apache MySQL、PHP/Perl/Python (LAMP) 栈既高效又灵活。


    ### 1. 从应用程序开始

    有一些跨平台运行的应用程序——网页浏览器、办公套件（LibreOffice）、数据库。这些开源应用程序可以替代昂贵的专有应用程序，并防止你将操作系统绑定到那些非免费的系统上。


    ### 2. 消除专有性

    你可能不需要在某台服务器上使用难以使用的专有系统，但在 Linux 上安装这些系统意味着你为所需的服务器购买更少的服务器（可能还需要昂贵的许可证）。这为完全将数据库切换到
    FOSS 铺平了道路。


    ### 3. “走吧，不再回头”

    如果你拥有与自由源软件运行良好的系统，那么你工作得非常顺利。“为什么要切换到 FOSS？现在不是时机。”我正在继续运行。花费时间和金钱将一个更好的专有系统改为
    FOSS 可能并不划算。

    如果你正在为新系统购买设备，可以考虑使用 FOSS。由你决定如何让新系统“支持”运行。你的用户中没有人接受过你所用系统的培训。通过使用 FOSS，你可能会节省数千（在某些情况下是数百万）美元许可费用。


    ## 5. 并行运行以确保平稳过渡

    不要试图一次完成过渡。计划并确保过渡平滑。你想成为英雄，而不是替罪羊。

    我有一个在土耳其银行工作的朋友。他们梦想着将整个系统转换为 Linux。他们决定使用 FOSS，但他必须拒绝老板以完成他必须做的事。

    我的朋友做了并行工作，并确保他需要的系统在 Microsoft 和 Linux 上都能运行。他告诉我们并行运行系统，以确保在两个系统上都能完成所有工作。周五当大家都离开后，他开始让
    IT 员工切换到 Linux。到了周一，他在系统中收到了邮件回复。


    “我的桌面怎么了？”

    “哦，我们安装了新版本的操作系统。你遇到问题了吗？你可以工作吗？”

    “是的，我可以工作，或者它就是这样。”

    “如果你无法工作，请给我们打电话，我们会提供帮助。”

    周一他们接到三个电话。周二接到两个电话。周三接了一个电话。剩下的时间里再也没有电话了。


