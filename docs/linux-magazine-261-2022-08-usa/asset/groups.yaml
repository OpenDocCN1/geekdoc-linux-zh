    ## Writer''s IDE


    ### Zettl


    While there are many text editors for Linux, there aren''t many that are suitable
    for long-form projects. Every writer is different, but many could benefit from
    an editor that helps with note-taking, annotation, and bibliography. This is probably
    why Linux-based authors chose versions of Vim or Emacs, yet the ancient version
    of the proprietary Zettiver still runs on.


    Zettl, however, is a new editor that has some features that are larger and more
    intuitive. It runs on Electron, but puts editing in writing environment with lots
    of features that could empower your workflow.


    The most important thing is that Zettl is built around the plain text of Markdown.
    Markdown is a great choice for those who can use it both as a writer and as a
    reader. Markdown elements simply improve readability and presentation. Typing
    these elements into the editor such as for headings will immediately change the
    text - not fully, but enough to differentiate it from plain parts of text. Start
    a draft and the editor automatically formats it. Add a link and the raw Markdown
    displays, replaced by only the link. This live preview allows you to see one panel
    for the text and another panel for the Markdown, which the majority of other editors
    do not. You feel control in Zettl and it''s great to see features such as real-time
    word count, distance free, and a typewriter mode where moving the cursor in the
    middle of the text with ease.


    The beautiful style reign extends to cover highlighting, as well as special metadata.
    A great example of the idea in a data block of YAML is how metadata is consumed
    by the content management system. It is one of the best things about Zettl, because
    the keys you hide away in this YAML can be seen in.


    1. Tutorial: Learn about the application from this tutorial.

    2. Editor: Markdown previews and lists of words help you make a very powerful
    tool.

    3. Headings: Are automatically extracted into a navigable outline.

    4. Tags: Tags and links can be created to refer to other documents.

    5. Custom views: Make your app yours with dark mode, distinction free mode, and
    a typewriter mode.

    6. Workspaces: Each project can have its own workspace, accessible via a heatmap
    search and metadata tagging


    Project Website

    https://www.zettl.com/


    ## Debugger


    ## # magic-trace


    Debugging tools are important parts of the process. Debugging tools like magic-trace
    (above) are most useful when you have compiled the applications you want to trace.
    Each link of the binary connects an executable to the source code, and it can
    help when you need to debug a process. Likewise, if you haven''t built the binary
    from source code yourself, many distributions include debug packages that do the
    same effect, letting you see the source code for an executable. But there are
    also lots of times when you want to debug or inspect without having access to
    the source code, and this is when a tool can help.


    The trace output can extract symbols from the kernel. When you exit the process,
    the results are compiled into a trace. This binary can be loaded into a web-hosted
    GUI. It''s a little like a glass plot of the process, letting you see is happening
    in tiny slices of time.


    Project Website

    https://github.com/jaenet/magic-trace


    ## Decompiler


    ## # Snowman


    A decompiler turns binaries into source code that can be inspected and potentially
    rebuilt. Snowman is a decompiler that has its UI and accompanying command-line
    tools, and it can turn binaries into C/C++ code that can be inspected and modified.
    Snowman''s decompiler interface is simple and easy to use, and you start by opening
    the executable file you want to analyze; you will see the disassembly for the
    code in the left panel before spending some time analyzing the data flows for
    every event in the code.


    Selecting any line in the code will immediately skip the assembly instruction
    and function call, helping you quickly navigate the disassembled code.


    Project Website

    https://github.com/yegord/snowman

