    # LINUX DOGHOUSE – MIGRATION


    ![](img/31162a00ee46c5d590c544cb2d944405_67_0.png)


    MADDOG''S

    Jon maddog is an author, educator, computer scientist, and free software pioneer
    who has been a passionate advocate for Linux since 1999 when he first met Linus
    Torvalds and helped in bringing Linux to a 64-bit system. He serves as president
    of Linux International!


    # DOGHOUSE

    Thoughts on migrating to open source – which doesn''t have to be overwhelming
    and might result in significant cost reductions.


    BY JOHN ''MADDOG'' HALL


    # Moving to open source


    Some people have approached me with issues of "migrating to open source" and do
    not know how to get started. These people repeat that companies, educational institutions,
    and governments (local, regional, or national).

    Most of the time, they seem to think that something happens with a single snap.
    Other times they seem to have the impression that if one can do it, everyone can
    even start.

    I have several opinions on this that have been used successfully by various people
    and groups.


    4. "If it is Broken, Fix it!"

    This is the opposite of "If it is not broken, don''t fix it." Have an existing
    system that is slow, buggy, or requiring new hardware. Don''t throw good money
    after that.

    It is worthwhile to rewrite the whole system using FOSS, perhaps with a three-tiered-client
    model using FOSS database, MySQL, an intermediate level of code and a web server
    to present the data. This Linux, Apache MySQL, PHP/Perl/Python (LAMP) stack has
    been both efficient and flexible.


    +   1. Start with Applications

    There are applications that work across multiple platforms - web browsers, office
    suites (LibreOffice), databases. These open source applications can satisfy for
    more expensive proprietary applications and will keep you from tying your operating
    systems to that which are not free.

    2. Eliminate the Property

    You may not need the hard-to-use proprietary system on one server, but installing
    those systems on Linux means you will need to buy fewer servers (and perhaps expensive
    licenses) for the them you need. This prepares the way for switching the databases
    completely to FOSS.

    3. "Go, and No More"

    You have systems that work well with free source software, so you are working
    perfectly fine. "Why switch to FOSS? It''s not a move now." I''m running. The
    time and money to work making a better proprietary system to FOSS is probably
    not worth.

    If you are buying a new, for new system, considering FOSS to use it. It is yours
    to know how the new system is "supported" to work. None of them users have been
    trained in the system you use. By using FOSS, you may save thousands (in some
    cases, millions) of dollars in license fees.


    5. Run Parallel to Ensure a Smooth Transition

    Do not try to make the transition at once. Plan and make the transition smooth.
    You want to be a hero, not a goat.

    I had a friend who worked for a bank in Turkey. They had a dream of transforming
    the whole system to Linux. They decided to use FOSS, but he had to refuse the
    boss in order to do what he had to do.

    My friend worked a parallel and made sure that the systems he needed worked on
    Microsoft and Linux. He told us to run the systems in parallel, to ensure everything
    could be done on both systems. One Friday when everyone had gone, he started the
    IT staff to switch to Linux. On the Monday when systems in he received email replies.


    "What happened to my desktop?"

    "Oh, we installed a new version of the operating system. Are you having problems?
    Can you do your work?"

    Yes, I can do work or it is just like that."

    "If you cannot do your work, call us and we will help."

    They had three calls on Monday. Then they had two calls on Tuesday. Then one call
    on Wednesday. There were no more calls for the rest of the week. On Friday he
    retired.


    68 AUGUST 2022 ISSUE 261 LINUX-MAGAZINE.COM LINUXMAGAZINE.COM'
