    # 滑溜的坡度


    要成为具有许多弯道的赛道大师（如日本的黑森林），你需要精通漂移（右箭头）或左侧故事。要做到这一点，点击主菜单中的故事模式按钮，你将看到一个带有背景故事的视频：自由软件的奠父
    Gnu 被 Nolok 绑架，他被关在岩浆城堡马格纳堡（12）。为了释放 Gnu，你需要扮演 Tux 或其他某些角色，并面对总共 25 个挑战。


    个人人物在故事模式左下角的地图上被标记（图 13）。如果你在地图上看到锁符号，说明你收集的分数还不足以通过。相反，一个小奖台表示有挑战在等待你。开车到地图上标记的地方并展示你的进度。


    如果你成功了，你将获得铜杯、银杯或铂金杯，取决于难度级别，并通过一些分数获得（图 14）。当你达到一定的分数时，会解锁更多的标记和赛道。你还可以点击屏幕上的
    Add-ons 从网上下载新卡片和赛道。收藏正在不断增长。


    最后的挑战将你带到岩浆堡，你将面对 Nolok。你需要击败 Nolok 来释放 Gnu。


    # 秘籍


    如果你一个接一个接受挑战，SuperTKart 会更有趣。但有一个捷径：只需使用你选择的编辑器编辑 `/config/supertkart/players.xml`
    文件。<story>` 标签包含了挑战列表。


    在每个挑战之后，将 `solve="bronze"`（杯）、`solve="silver"`（银杯）、`solve="hard"`（金杯）或 `solve="best"`（铂金杯）。下次你玩
    SuperTukart 时，你将拥有所有的奖杯和分数可以匹配。


