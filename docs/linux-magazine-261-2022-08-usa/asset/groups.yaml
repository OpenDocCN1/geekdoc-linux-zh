    ## Command Line – lm-sensors


    ## Taking your hardware''s temperature


    ### Beat the Heat


    ![](img/31162a00ee46c5d590c544cb2d944405_43_0.png)


    With lm-sensors, you can monitor your hardware''s internal temperature to avoid
    overheating. By Bruce Byfield


    The trend in the last decade toward thinner and fewer laptops has aggravated the
    problem ever more before.


    Hardware temperatures have long been the concern of system administrators and
    server farms. With summer worldwide, the record temperature inside a consumer
    pocket has become a major concern. Too much heat can cause a computer to act erratically.
    In extreme cases, overheating can result in your computer shutting off, or worse,
    cause permanent damage to sensitive components. If you''re using a laptop positioned
    on your legs, you could leave with third-degree burns.


    With so much at stake, there is a real need to monitor hardware temperatures,
    at least on new machines, on hotter days and long seasons on your computer units,
    for which utilities that many use are merely useful or even obsolete. As a result,
    no users have the heat to contend with, but also inadequate or obsolete tools
    for. Frankly, the lm-sensors package can help solve this problem, although it
    requires some setup and the loading of kernel modules.


    In any case, the ideal is to have more cool air coming into the case and hot air
    leaving the case, with air and fans pushing the air to the back and the top. However,
    this air can be blocked by components and the points where they are secured to
    the chassis. Moreover, hot days mean that the air entering the case does not cool
    as well as it does on colder days.


    To monitor this difficult and ever changing situation, modern hardware has thermal
    sensors. Reading the differences in temperatures means you can construct a map
    of how the air flows - or Linux kernel modules read set, and other information
    out to the /sys/class/hwmon pseudo-filesystem where it is configured for applications.
    It is not intended to be human-readable, although information can be described
    with complicated workloads that are impractical for average users.


    ## A Matter of Thermal Thermodynamics


    ## Author


    **Bruce Byfield** is a computer journalist and writer editor specializing in free
    and open source software. In addition to his writing projects, he teaches about
    Linux and e-learning courses. In his space, he writes about West Coast (https://brucebyfield.wordpress.com).
    He is also co-founder of Pretentice, a blog about writing and freethinking at
    https://pretentice.com/


    Quite simply, computers give off heat when they are in use. When in a confined
    space, heat can easily rise rather than disperse. Fans generate properly but can
    be especially difficult with a laptop, where components are crammed into even
    smaller space than in a workstation or.


    ## Command Line - lm-sensors


    ```bash

