    the most popular of the so-called BSD family, is also related to NetBSD, DragonBSD,
    and OpenBSD. Unlike Linux, FreeBSD develops not only its kernel, but also its
    own hardware and devices. Consequently, most of its release notes are more technical
    than those of a typical Linux distribution, detailing options, and hardware support,
    rather than new features. See https://www.freebsd.org/releases/13.1/ for more
    information.


    ## Next-Generation HTTP/3 Protocol Arrives as Standard


    The Internet Technology Force (IETF) has officially released the third major revision
    of the HyperText Transfer Protocol (HTTP/3) as a standard. Unlike previous versions
    of the HTTP, which relied on the slow but careful TCP protocol for establishing
    connections, the new version uses faster and agile QUIC as transport. QUIC, which
    stands for "Quick UDP Internet Connections," is based on the connectionless UDP
    transport.


    ## The Next Kernel Could Be a Big Deal


    The Linux kernel continues to evolve, with the latest updates focusing on performance
    optimizations and better support for emerging hardware architectures. These changes
    ensure that Linux remains the leading operating system for servers and continues
    to be competitive for desktop users worldwide.


    ## Millions of MySQL Servers Exposed


    A security vulnerability has left millions of MySQL servers exposed to the internet
    due to misconfiguration. Security experts urge users to check their settings immediately
    to prevent potential data breaches.

