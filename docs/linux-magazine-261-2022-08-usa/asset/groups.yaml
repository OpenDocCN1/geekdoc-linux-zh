    The Gemini Protocol [1] is a relatively new Internet protocol for accessing remote
    documents. Unlike an HTML page that contains layers of style sheets, JavaScript,
    and HTML tags, a Gemini document is a simple readable document.

    Gemini''s format is so easy to learn, with five codes. New coders could easily
    put together a small communication server or client without any programming skills.


    In this article, I introduce the Gemini protocol with three projects. The first
    project creates a Gemini server with just one line of code. In the second project,
    a Bash script creates a common gateway interface (CGI) page that connects to a
    server to store temperature and humidity data. The third project uses Gemini document
    links to control Raspberry Pi general input/output (GPIO) pins to drive a rover.


