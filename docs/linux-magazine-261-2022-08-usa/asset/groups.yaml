    \ consistency of data structures and detect broken links. How to avoid hiccups\
    \ for you and your users.\n\n### Shell Script\n\nThe shell script (Listing 1)\
    \ uses a recursive function named check() which expects one parameter: the directory\
    \ you want to check for broken links. In the function, a for loop iterates across\
    \ all entries (links to links).\n\n### Sample Data\n\nAs example, I will use the\
    \ directory structure shown in Figure 1, which is similar to a piece of software.\
    \ The directory tree in Figure 1 contains two versions of the software. There\
    \ are three links: the old version (named old), the current version (named current),\
    \ and the third file named dataset (which is missing). For every entry, the first\
    \ check checks whether the entry is a directory (link 4). If so, the function\
    \ is called with this directory as.\n\n### Listing 1: find-broken-links.sh\n\n\
    Figure 1: The example directory structure.\n\n```\ncurrent -> version2\nversion1\n\
    \  data\n    |--- dataset1\n    |--- dataset2\nversion2\n  data\n    |--- dataset1\n\
    \    |--- dataset2\n    |--- dataset3 -> project/version1/dataset/3\n```\n8 directories,\
    \ 5 files\n\n```\n01 check() {\n02   for entry in \"$1\"; do\n03     echo \"$entry\
    \ ...\"\n04     if [ -d \"$entry\" ]; then\n05       check \"$entry\"\n06    \
    \ else\n07       if [ -L \"$entry\" ]; then\n08         target=$(readlink \"$entry\"\
    )\n09         if [ ! -e \"$target\" ]; then\n10           echo \"broken link:\n\
    11             from $entry to $target\"\n12         fi\n13       fi\n14     fi\n\
    15   done\n16 }\n17 \n18 fi\n19 check $1\n```\n\n### Listing 2: Output of broken-links.sh\n\
    \n```\n$ ./broken-links.sh\n\nbroken: from ./project/current/data/dataset3 to\
    \ project/version1/dataset3\nbroken: from ./project/data/dataset3 to project/version1/dataset3\n\
    ```\n\nparameter (line 5). Otherwise, two more tests are made is it a link (link\
    \ 7), and if so, where it points to (lines 8 and 9)? In line 8, the read command\
    \ returns the link points and stores the result in a local variable target. If\
    \ not, the script checks if the link exists. The function sends a message to (line\
    \ 10). The router ignores entries in the directory that are not links. Once the\
    \ line has been processed, check() returns the tail point. If you call the script,\
    \ you will see output similar to that in Listing 2 I make the call using period()\
    \ for the current directory as the starting point. The output includes two lines\
    \ because current points to version2 and my function follows the link.\n\n###\
    \ find\n\nOld ways will now out to the complexity of the shell script and option\
    \ that a more elegant solution is using the find tool. With find I will be happy\
    \ to do this. I will use the -type switch, which is intended for detecting broken\
    \ links. Listing 3 shows how this option also works. Now I know which link is\
    \ broken, but not where it points. In Listing 4, I will combine find with for\
    \ (shortening the list by half). In line 1, let find do all the work and get a\
    \ list of all the broken links before the starting directory. In loop 2, readlink\
    \ then determines the link target.\n\n### Listing 3: Searching with find\n\n```\n\
    01 # -type l\n02 ./project/version2/data/dataset3\n```\n\n### Listing 4: find-broken-links.sh\n\
    \n```\n01 entry=($find \"$\" -type l)\n02 for in $entry; do\n03 target=$(readlink\
    \ \"$entry\")\n04 echo \"broken link from $target\"\n05 done\n```\n\n### Python\
    \ Script\n\nIf you don't like to use the shell for programming, Python may be\
