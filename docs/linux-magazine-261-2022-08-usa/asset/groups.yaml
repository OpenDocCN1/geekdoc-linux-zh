    Zrythm 给人的感觉是该软件还有一段路要走。例如，目前还不清楚如何设置片段的结束点，以便在配置循环时只重复可见块。当然，这不是问题；你可以导入固定长度的片段。对于长度正确的片段，编辑器提供了非常有趣的操纵选项。编辑器顶部的两个绿色指示器让你初始设置片段中实际播放和重复的数据。此外，一个小蓝色指针可以允许你设置重复的开始位置（图
    5）。


    一些在其他地方不常见的实用 MIDI 选项。例如，你可以将边框顶部和弦中的和弦作为元数据高亮。还有一个鼓点音的开关，且插入和编辑非常简单。


    唯一稍显粗糙的功能是 MIDI 编辑器中设置速度（velocity）的那个。最大速度为 127 的事件无法用绘制工具触碰；相反，边框边缘会被高亮，你只能让边框变小或变。对于这个小问题，我建议使用工具栏中的
    Ramp（渐变）工具。你可以使用 Ramp 工具降低之后的所有条目，之后你可以再次回来。


    这些循环工具同时适用于音频和 MIDI 片段。Zrythm 目前在音频工作功能方面提供不多——除了用于向下流的音量曲线外。然而，你会发现一些在其他地方不常见的实用
    MIDI 选项。


    Theodou 目前仅实现了一些键盘命令，更多的键盘命令将对于更精确地控制事物很有帮助。


    **图 5：** 在 Zrythm 的音频片段中仅选择了一个较长鼓样本中的单个低音节拍；编辑器作为循环播放。


    ![](img/31162a00ee46c5d590c544cb2d944405_71_1.png)


    ## ZRYTHM LINUX VOICE


    如果 DEB 包包含“Plugins”（插件），你将体验到明显的差异。


    在编辑器的右侧，你可以显示一个显示每个音符精确数据的列表。你有图形化编辑器，但手动编辑列表中数值的能力仍然在愿望清单中。然而，你可以通过脚本调整用户界面并提供额外的自定义（参见书籍《脚本与自定义》）。


    ## 脚本与自定义


    Zrythm 是一个 GTK4 应用程序，这意味着你可以使用 CSS 设计一个外观和感觉类似于网页的界面。


