    ## # FOSSPicks


    自由开源世界中的闪光明珠与新发布


    在之前的一份办公室工作中，Graham 曾写过一个小游戏，花很长时间才输入一个特定的句子。玩游戏的打字听起来可能并不高效。作者：GRAHAM MORRISON


    ## 作者的 IDE


    ### Zettl


    虽然 Linux 有许多文本编辑器，但适合长篇项目的并不多。每位作者都不同，但许多人可以从有助于笔记、注释和参考文献的编辑器中获益。这可能就是为什么基于 Linux
    的作者选择了 Vim 或 Emacs 的版本，而老老的专用软件 Zettiver 仍在运行。


    然而，Zettl 是一款全新的编辑器，具有一些更大、更直观的功能。它运行在 Electron 之上，但将编辑置于许多可以增强工作流的写作环境中。


    最重要的是 Zettl 是围绕 Markdown 纯文本构建的。对于既是作者又是读者的人来说，Markdown 是一个很好的选择。Markdown 元素简单地提高了可读性和呈现。在编辑器中输入这些元素（如标题）会立即更改文本——不是完全改变，但足以与普通文本区分开来。开始草稿后编辑器会自动进行格式化。添加链接后，原始
    Markdown 显示，并仅被链接替换。这种实时预览允许你在一个面板查看文本，另一个面板查看 Markdown，这是大多数其他编辑器做不到的。你在 Zettl
    中感到掌控感，并且看到如实时字数统计、无焦模式和打字机模式（轻松在文本中间移动光标）等功能是非常棒的。


    美丽的风格延伸到了代码高亮以及特殊元数据。YAML 数据块中这一理念的一个佳例子是元数据如何被内容管理系统消耗。这是 Zettl 的优点之一，因为你隐藏在此
    YAML 中的键可以被查看到。


    1. 教程：通过此教程学习有关应用程序的信息。

    2. 编辑器：Markdown 预览和词汇列表帮助你创建一个非常强大的工具。

    3. 标题：自动提取为可导航的大纲。

    4. 标签：可以创建标签和链接来引用其他文档。

    5. 自定义视图：通过深色模式、无焦模式和打字机模式让你的应用专属化。

    6. 工作空间：每个项目都可以有自己的工作空间，通过热力图搜索和元数据标记访问。


    项目网站

    https://www.zettl.com/


    ## 调试器


    ## # magic-trace


    调试工具是过程中的重要部分。当你编译了想要跟踪的应用程序时，像 magic-trace（上所示）这样的调试工具最有用。二进制文件的每个链接都将可执行文件连接到源代码，当你需要调试进程时，它可以提供帮助。同样，如果你没有自己从源代码构建二进制文件，许多发行版都包含了调试包，可以实现相同的效果，让你看到可执行文件的源代码。但也有许多时候，你希望在没有源代码的情况下进行调试或检查，这时工具就能派上用场。


    跟踪输出可以从内核中提取符号。当你退出进程时，结果会被编译成跟踪轨迹（trace）。这个二进制文件可以加载到网络托管的 GUI 中。这就像进程的一个玻璃图谱，让你看到在微小时间片内发生的事情。


    项目网站

    https://github.com/jaenet/magic-trace


    ## 反汇编译器


    ## # Snowman


    反汇编译器将二进制文件转换为可以检查并可能重建的源代码。Snowman 是一个具有其 UI 和配套命令行工具的反汇编译器，它可以将二进制文件转换为可以检查和修改的
    C/C++ 代码。Snowman 的反汇编译器界面简单易用，你只需打开想要分析的可执行文件即可；你将在左侧面板看到代码的反汇编，然后花些时间分析代码中每个事件的数据流。


    选择代码中的任何行都会立即跳过汇编指令和函数调用，帮助你快速导航反汇编代码。


    项目网站

    https://github.com/yegord/snowman


    '
