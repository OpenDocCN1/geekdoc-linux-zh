    # 24 发行版之旅 – Linux Mint

    Clement Lefebvre 简述了 Linux Mint 的历史以及围绕该发行版形成的社区。


    # USB 启动


    Live boot 在 15 年前是一个非常激动的想法——随身带一张 CD，随时随地启动。但旧式的启动 CD 有一些局限性。首先，它们的大小固固。然后是无法保存任何内容的问题。今天的
    USB 工具解决了这些问题，并提供了一个当时没人想到的：在单个 U 盘上访问多个启动镜像。


