    ## HP 和 System76 发布 Dev One 笔记本电脑


    HP 与 System76 合作创建了一款面向开发者的笔记本电脑，名为 Dev One，它配备了 System76 自己的 Pop!OS Linux 发行版，起价
    1,099 美元。最初发布于 2022 年 5 月，当时该笔记本还无法预订。回到今天，在强大的硬件支持下，美国现在可以订购这些新款 Linux 驱动硬件之一了。Dev
    One 通过不配备 CPU 和显卡来保持价格较低；基础型号配备了 8 核16 线程的 Ryzen 7 5850U 处理器，主频为 1.4GHz，集成 AMD
    Radeon 显卡，以及 16GB DDR4-3200 RAM（可升级至 64GB）。机箱厚度为 0.75 英寸，配备 1TB PCIe 3x NVMe M.2
    2280 SSD，显示屏为 14 英 FHD，分辨率为 1920x1080，亮度为 1000 尼特。然而，屏幕并不光滑。新的 Dev One 还具有经过调的
    Linux 内核，它放弃了 Windows 内核而采用 System Key，旨在帮助你更快、更好地编写代码。规格声称续航时间长达 12 小时。尽管传言盛传这将让你购买
    System76，System76 的 CEO 兼创始人 Carl 保证这只是一个传言。值得注意的是这种表达中存在差距。


    ## NixOS 22.5 现在可用


    随着 NixOS 22.5 的发布，声明式配置有了显著改进。新的包管理器允许用户精确地定义整个环境。该更新还包含了多个安全补丁并改进了对现代硬件的稳定性。


    ## Titan Linux 是基于 Debian 的新 KDE Linux


    FreeBSD 的“表兄弟”是一个类 Unix 系统，共享许多相同的应用程序。主要区别是 FreeBSD 是在宽松的许可证下发布的，而 Linux Mint
    的大部分内容是在 GPL 许可证下发布的。当你使用 FreeBSD 时，你还会发现设备名称和其他系统细节的差异。FreeBSD 是所谓 BSD 家族中最受欢迎的成员，也与
    NetBSD、DragonBSD 和 OpenBSD 相关联。与 Linux 不同，FreeBSD 不仅开发内核，还开发自己的硬件和设备。因此，它的大多数发布说明比典型的
    Linux 发行版更具技术性，详细介绍了选项和硬件支持，而不是新功能。更多信息请参阅 https://www.freebsd.org/releases/13.1/。


    ## 下一代 HTTP/3 协议作为标准到来


    互联网工程任务组（IETF）正式将超文本传输协议的第三个重大修订发布为标准。与之前的 HTTP 版本依赖缓慢但仔细 TCP 协议建立连接不同，新版本使用更快更灵活的
    QUIC 作为传输。QUIC 代表“快速 UDP 网络连接”，基于无连接的 UDP 传输。


    ## 下一个内核可能是一个大动作


    Linux 内核持续演进，最新更新侧重于性能优化和对新兴硬件架构的良好支持。这些更改确保 Linux 仍然是服务器领先的操作系统，并继续在全球范围内桌面用户中保持竞争力。


    ## 数百万 MySQL 服务器暴露


    一个安全漏洞由于配置错误已导致数百万 MySQL 服务器暴露在互联网上。安全专家敦促用户立即检查设置，以防止潜在的数据泄露。


