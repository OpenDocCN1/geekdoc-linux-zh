    # 新闻

    Linux 新闻


    微软。Apache 项目到为止一直不支持 Apache Web 服务器的 HTTP/3，但该标准的采用可能会改变这一局面。根据 IETF 的说法，该标准与之前的
    HTTP/2 兼容，这应该有助于过渡。


    ## 下一个 Linux 内核可能是一件大事


    Linux 将首次获得对 StrongARM 平台的支持。在经过 10 多年的工作后，Lin Torvalds（Linux 的创建者也是内核开发的领导者）在最近的更新中表示：“值得注意的一点是，长期
    ARM 通用内核（多格式）在工作 10 多年后已基本完工。祝贺所有参与者。StrongARM 平台仍然保持各自独立的内核，事实如此，但与十年前的情况相比，这是大的一步。”


    除了重大进展外，5.19 内核对于标准用户来说将相当无聊，在“重大”方面的变化较少。5.19 内核的大部分新增和更改是与硬件相关的驱动支持。随着架构更新（例如针对
    Apple Silicon 的 NVMe 支持以及 [https://github.com/apple/linux/tree/main](https://github.com/apple/linux/tree/main)
    更新和 Loop-g64 架构），内核的改进，5.19 可能是一段时间以来最“无聊”的大事。


    5.19 内核计划于 2022 年 7 月左右发布。


    ## 数百万 MySQL 服务器暴露


    Server Foundation 最近报告说，有 360 万个 MySQL 服务器处于公开暴露状态（[https://www.shadowservers.org/news/over-3-6-million-exposed-mysql-servers-on-ipv4-and-ipv6](https://www.shadowservers.org/news/over-3-6-million-exposed-mysql-servers-on-ipv4-and-ipv6)）。当研究小组开始扫描端口
    3306 上可访问的 MySQL 实例时发现了这一情况。他们的扫描了 230 万个 IPv4 地址，其中 130 万个响应了查询。这些可访问的服务器返回了服务器问候（Server
    Greeting）。


    研究人员没有检查可能的访问权限或数据泄露程度，但这仍然是一个必须关闭的重要攻击面。发现具有漏洞攻击面的最广泛使用的 MySQL 版本（通过 IPv4 地址）是
    5.7.33，而 IPv6 地址显示版本为 5.5.10.12，这是最广泛使用的。


    为了避免互联网到你的 MySQL 服务器产生潜在问题，最重要的事情是：


    对于任何想要复制这些扫描（查看你的 MySQL 服务器是否从互联网访问）的人，可以使用命令 `nmap -sv -sc SERVER`（SERVER 是你
    MySQL 服务器的 IP 地址或域名），[https://nmap.org/book/nmap-ing.html](https://nmap.org/book/nmap-ing.html)。同时也建议始终保持你的
    MySQL 服务器为最新版本。


    每两周在收件箱中获取最新新闻。


