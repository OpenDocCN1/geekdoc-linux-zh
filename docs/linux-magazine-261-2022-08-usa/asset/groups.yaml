    ## 插件，更多插件


    在 DAW（数字音频工作站）中整合多种类型的 Linux 插件并非易事。Zrythm 使用内部开发的 JUICE 框架以及 Filipe Coelho 的
    Carla。Carla 运行良好，并能自动化安装 Wine 组件（插件）的流程，而这在通常情况下是无法实现的。


    在 Carla 中，几乎所有功能都运行得非常稳定，尤其是任何高质量插件都能在 Zrythm 中立即可用。Carla 确实提供了一个访问插件所提供预设的工具。鼓励插件开发者在其图形界面中包含此类工具。如果你没有访问这些预设的工具，则需要为每个新案例设置参数。幸运的是，当你发现声音时，Zrythm
    会显示出来，你可以轻松地再次找到它。


    ## 单版本 1.0.0-alpha.29.0.7


    单版本


    你可以在以下发行版/操作系统上安装所有内容：

    - Arch Linux - x86_64

    - Debian 8 - x86_64

    - Fedora 34 - x86_64

    - Ubuntu 20.04 & 21.10 - amd64

    - GNU Linux - 64-bit

    - Windows 10.5 (最新)


    安装程序包含英语、法语、葡萄牙语、意大利语、德语和俄语 PDF 手册


    请选择以下选项：

    Zchord, ZCompressor, ZLimiter, ZLFOPlayer, Z2verb, ZverISP

    价格：€5.00（+ 处理器费用）


    返回 购买升级到


