    the patch David had found to be the cause. To Ronnie remarked, "Right now you
    likely revert it. Maybe in the next kernel. But in a kernel not too far into the
    future the code that this patch implements will simply not be more in the linux
    kernel and will not be available through the standard API. At that point it is
    no longer a matter of reverting the patch." [Wait, the original text has some
