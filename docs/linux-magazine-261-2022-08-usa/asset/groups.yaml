    ![](img/31162a00ee46c5d590c544cb2d944405_94_1.png)


    # #259/June 2022


    # Zero Trust


    Twenty Years ago, everyone thought a gateway firewall was all you needed to stay
    safe from intruders, but trust had a different history story. Today, the best
    advice is: Don''t trust anyone. Your internal network could be just as dangerous
    as the Internet.


    **On the DVD:** Zorin OS 16.1 Core and Super GRUB2


    ![](img/31162a00ee46c5d590c544cb2d944405_94_2.png)


    # #258/May 2022


    # Clean IT


    Most people you can save energy by changing to more light bulbs, but did you know
    you can save energy with more efficient software? This month we examine the ongoing
    efforts to bring sustainability to the IT industry.


    **On the DVD:** Manjaro 21.2 Qonos and DragonBSD 6.2.1


    ![](img/31162a00ee46c5d590c544cb2d944405_94_3.png)


    # #257/April 2022


    # Encryption


    This month, we survey the state of encryption in Linux. We look beyond the basics
    to explore some of the tools and technologies that underpin the system of secrecy
    - and we show you how you can ensure your encryption is private.


    **On the DVD:** Linux Mint 20.3 Cinnamon and deep 20.4


    ![](img/31162a00ee46c5d590c544cb2d944405_94_4.png)


    # #256/March 2022


    # Facial Recognition


    Biometrics gets a boost recently with the arrival of Microsoft''s Hello technology.
    We open the source world is catching up, with an innovative tool easily called
    Howdy. Face authentication might not be ready for the CIA yet, but we''ll help
    you get started with Howdy and explore the possibilities of authentication with
    a glance.


    **On the DVD:** antix 21 and Haiku R1/Beta 3


    ![](img/31162a00ee46c5d590c544cb2d944405_94_5.png)


    # #255/February 2022


    # Break It To Make It


    Fuzz Testing: Every wonder how attackers discover "carefully crafted input strings"
    that crash programs and surrender control? We introduce you to the world of fuzz
    testing, the art of fuzzing and explore some leading fuzz testing techniques.


    **On the DVD:** Parrot OS 4.11 and Fedora Workstation 35'
