    ## 热备份


    ![](img/31162a00ee46c5d590c544cb2d944405_49_0.png)


    ### 备份运行中的系统


    # 热备份


    热备份是指我们用于备份正在被应用程序使用的文件的工具和策略。本文解释了使用常用的 Linux 工具备份运行数据的危险性，并探讨了一些替代方案。制作备份的工具有很多，互联网也充满了关于如何使用它们的教程。在大多数情况下，这种假设是可以接受的。毕竟，用户想要备份一组在整个过程中保持静态的数据集。然而，现实场景通常要求在数据被修改时进行备份。例如，考虑一个正在加载且必须在备份写入期间继续运行的数据库，这可能会损坏备份中的文件值（图
    1）。如果损坏影响的是格式结构简单的文件（例如文本文件），这种复杂格式可能会被忽略。


    块级实用程序在活动文件系统上特别容易出现问题。dump 进程绕过文件系统接口直接读取硬件。这种方法有许多优势 [1]，但也带来了巨大的负担。当文件被写入时，它进入缓存而不会立即提交。从用户的角度来看，写入操作可能是瞬时完成的，但在内核将其写入存储器之前，文件仍然存在内存中。因此，存储在硬盘上的实际内容将是混乱的，包含部分写入的文件，等待未来的重启或
    dump 返回完整内容。


    # 自定义解决方案的陷阱


    传统的 dd、tar 或 dump 是提取活动数据文件夹快照的糟糕候选者。其中，某些比其他的更糟。


    # 折中方案


    如果程序在文件系统级运行并尝试复制一个正在使用的文件


    老式的 Unix 解决方案经过良好的测试，某些用户有理由不放弃它们。事实是，对于备份承受重载的文件夹这不应成为停止的理由；


