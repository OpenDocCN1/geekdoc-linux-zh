    # 内核 (Kernel)


    但如果知道是否还有其他人关注，那将很有意思的——我怀疑，由于非 Linux 的遗留问题，我们无法轻易地放弃它。


    这就是全部了——一个非常短的讨论。我之所以提到这个话题，是因为这有些讽刺。在 Linux 早期，微软曾是敌人，他们希望摧毁整个项目并推销自己的操作系统，甚至把我们给踢出去。


    “发送消息，你可以在拉取请求（pull request）中单独写出细节，我们喜欢你这么做：”


    “极客之路，像 Gentoo 这种唯一支持 alpha 的发行版。我下载了安装程序，除了固件 COFF 文件外，一切都是 ELF 格式。他说：‘既然这是一个活跃的仓库，那我们就开始吧。’”


    我知道你有一个 PGP 密钥，因为我的密钥环里有一个一直追溯到 2011 年的密钥。如果你丢失了那之后的密钥并需要创建一个新的，也比不为你的拉取请求签名要好。


    就这样，


    所以，Linux 一直都在破茧而出。看到 Linux 内核不断成长，击败了几乎所有其他软件项目的臃肿和无意义，总是一件迷人的事情。经过 30 年和数十亿用户，它可能会被各种噩梦和政治矛盾所困扰，但它变得更好。


    > “Herbert 对我说的：


    后来，在另一个线程中，关于内核的开发，David Howell 通过 Git 提交了一个补丁，Linux 回复道：‘你有一个模糊的荣誉，即你今天使用了一个
    Tag（标签）。在 44 次拉取中，只有两个使用了分支，其余的都使用了签名的标签。’ David 回复说，他其实并没有打算提交一个拉取请求；但在很多情况下，他只是那样脱困了！’”


    Linux 在日常工作中继续增长整个世界的基础设施，同时超越了外壳，并为了通用的爱的使命重新发明了自己的成就（这是事实）。


    # 进入历史之门，不穿裤？ (Into the Gate of History, Pantless?)


    Linux Torvalds 并不是为了公开共享来达到某个特定目的。当 Herbert 为某个与加密相关的 Linux 子系统提交合并请求时，Mike 回复道：“加密是我在这次合并中看到的第一个没有签名标签的树。请对标签本身签名。加密人员未能正确使用加密。”


    Linux 接着说道：


    “我不需要内核的签名标签，但我真的必须证明它们，而且这并不难。这里还有其他签名的拉取请求在等待中，尽管如此，你的拉取请求出来了——到目前为止 27 个中有几个没有。”


    > “我可以为你提供一个方向，让签名标签成为你工作流的一部分吗？标签可以包含拉取的细节——在这种情况下可以使用带标签的 git pull request——或者仅仅是一些消息”


    # GitHub 对 Git 的支持 (GitHub Support for Git)


    Max Philippson 为 Linux Torvalds 提交了一个拉取请求，使用了托管在 GitHub 上的仓库。在这样做时，Max 回复道：“我注意到
    github 支持未身份验证的 git 协议。”


    > Linux 回复道：

    > ''"我怀疑为了一致性，诚实是唯一的出路；去吧，既然我看到了一点点“git”，发现有一个如此更好的东西或 git 服务器，不是来自某个网页（而我是针对签名标签回复的，而不是针对点击次数的）。''’”


    > “但从技术角度来看，这是不可避免的。而且 git 无处不在，而‘github’无疑意味着它是一个关于任何内容的 git 仓库。”


    Linux 认为……（此处原文不完整，按要求未翻译内容）


