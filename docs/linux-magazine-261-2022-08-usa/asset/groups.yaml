    # 一个简单的故事板编辑器


    # 讲述者 (Storyteller)


    Krita 5 包含一个编辑器，可以轻松地为任何目的准备故事板，包括意外的用途。由 Marco Fioretti 编写并与他人分享。除了极简单的视觉故事外，所有的故事创作都会使用故事板，这可以最大限度地减少因困惑或误解而浪费大量时间——可能损失资金的风险。


    Krita 新的 Storyboard Docker 帮助你为动画和其他媒体项目准备故事板 [1]。如果你无法轻松地创作故事，故事板是一个必不可少的工具。艺术家们在电影、游戏和漫画中使用故事板。StudioPlugin
    [2] 将故事板描述为你的故事叙事流的视觉表示，逐场景地，尽可能简单，不需要详细的角色、符号、背景或其他多重细节。


    故事板通常呈现图像的草图，这意味着你可以通过简单的手绘来创建故事板；与传统工具相比，Krita 的故事板功能提供了许多优势。故事板可以作为故事演示的“大纲”，并以你可以开发甚至对其进行动画处理的格式呈现。Krita
    是学习如何使用 Krita 的好方法。你可以分享你对想要实现目标的视觉描述，然后完成它。


    # Krita 快速介绍


    Krita [3] 是一款开源的多功能绘画程序，用于数字绘画、插画、概念设计和其他创意工作。作为一个功能丰富的软件，Krita 提供了各种需求和命令，包括绘制许多位图层和矢量图层的工具。


    Krita 很容易学习，因为它按分级进行分组，让用户轻松地管理和处理图像。许多 Krita 功能放置在称为 docker（调度器）的面板中，你可以将它们从主窗口分离出来，并根据需要安排在桌面上。Krita
    还有针对特定活动（例如漫画或动画）优化的工作区。这些工作区本质上是预定义的 docker 组合，你可以通过点击主窗口右上角的小按钮来快速加载它们。


    你你可以在许多 Linux 发行版的官方存储库中找到 Krita，但它可能不是当前的 5 版本。如果你在你的发行版中找不到当前版本，可以下载 AppImage
    单文件版本，将其设置为可执行文件，并将其安装在 $PATH 中的任何位置。为了在我的 Ubuntu 系统上安装 Krita 5.06，在从网站下载 AppImage
    后，我执行了以下操作：


    ```

    # my krita-S-O-E-x86_64.appimage krita

    # chmod 755 krita

    # my krita ~/bin

    ```


