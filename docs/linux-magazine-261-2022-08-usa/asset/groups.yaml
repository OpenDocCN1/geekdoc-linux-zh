    \ 4 和 5 中的简单示例演示了 -从- \n\n### 列表 4：定义变量\n\n```\n$ started=$(date '+%H:%M:%S');\
    \ echo $started\n$ ended=$(date '+%H:%M:%S'); echo $ended\n22:04:44\n22:04:44\n\
    ```\n![](img/31162a00ee46c5d590c544cb2d944405_36_0.png)\n\n图 2：管道允许你连接任意数量的命令。\n\
