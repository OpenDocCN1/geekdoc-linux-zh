  - "[PAGE 89]\n\n# # LINUX VOICE TUTORIAL – DETECTING BROKEN LINKS\n\n# # Checking\
    \ for broken links in directory structures\nDead End\n\nBroken links can wreak\
    \ havoc in directory structures. This article shows you how to use scripts to\
    \ avoid your links lead to a dead end.\n\nBY FRANK HOFFMANN\n\nDuring a restore\
    \ process, nothing is more disappointing than discovering that some of the links\
    \ you previously backed up no work. Although the link is still there, the target\
    \ no longer exists, resulting in the link pointing nowhere. These broken links\
    \ can also cause problems when you are developing software and publishing it in\
    \ the form of an application, or if you need to install different versions of\
    \ an application.\n\nA small, manageable project structure like Figure 1 can be\
    \ tested and checked manually. With larger projects, however, this quickly leads\
    \ to errors because you are bound to overlook something. Using Unix/Linux toolbox\
    \ I came up with a combination of options that are available for everyday use:\
    \ a script as a combination of a recursive function and a for loop over all the\
    \ files and directories, a special call to find, sort, and the tools you links:\
    \ FSint, RLint, and chase.\n\n# Options\n\nFinding and fixing broken links manually\
    \ takes a lot of effort. You can avoid this scenario by using scripts and Unix/Linux\
    \ tools to check for broken links in directory structures. In this article, I'll\
    \ show several ways to check the consistency of data structures and detect broken\
    \ links. How to avoid hiccups for you and your users.\n\n# Shell Script\n\nThe\
    \ shell script (Listing 1) uses a recursive function named check() check() only\
    \ expects one parameter: the directory you want to check for broken links (link\
    \ 16). In the function, a for loop iterates across all entries (links 2 to 14).\n\
    \n# Sample Data\n\nAs example, I will use the directory structure shown in Figure\
    \ 1, which is similar to a piece of software or a project that you might have\
    \ a counter in the world. You can easily create a tree as Figure 1 with the tree\
    \ command\nThe directory tree in Figure 1 contains two versions of the software.\
    \ There are three links: the old version (named old), the current version (named\
    \ current), and the third to a data file named dataset(which is missing).\n\n\
    For every entry, the first check checks whether the entry is a directory (link\
    \ 4). If so, the function is called with this directory as\n\n# Listing 1: find-broken-links.sh\n\
    \nFigure 1: The example directory structure.\n\n```\ncurrent -> version2\nold\
    \ -> version1\nversion1\n  ndata\n    |--- dataset1\n    |--- dataset2\n    |---\
    \ documentation\nversion2\n  ndata\n    |--- dataset1\n    |--- dataset2\n   \
    \ |--- dataset3 -> project/version1/dataset/3\n```\n\n8 directories, 5 files\n\
    \n```\n01 check() {\n02   for entry in \"$1\"; do\n03     echo \"$entry ...\"\n\
    04     if [ -d \"$entry\" ]; then\n05       check \"$entry\"\n06     else\n07\
    \       if [ -L \"$entry\" ]; then\n08         target=$(readlink \"$entry\")\n\
    09         if [ ! -e \"$target\" ]; then\n10           echo \"broken link:\n11\
    \             from $entry to $target\"\n12         fi\n13       fi\n14     fi\n\
    15   done\n16 }\n17 \n18 fi\n19 check $1\n```\n\n90 AUGUST 2022\n\nISSUE 261 LINUX-PROMAGAZINE.COM\
    \ | LINUXPROMAGAZINE.COM"
