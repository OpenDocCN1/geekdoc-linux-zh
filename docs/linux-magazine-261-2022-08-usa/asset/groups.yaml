    several subdirectories and a graphical user interface. To run it on a 32-bit or
    64-bit system, navigate to ventoy_x86 or ventoy_x64. You can then call the interface
    by typing, *./ventoy.sh*. In all cases, you will see the program window after
    authentication, and the controls are identical in each case (see Figure 1);


    The program window lists the removable media you have attached. Start a selection
    in the device box. Select the device, the window shows the Ventoy version running
    locally, and if present, the Ventoy version running on any attached USB stick.
    In the next step, select the *device on which* you want to install the operating
    system.


    After you press *Install*, a warning message appears, telling you that the overwrite
    will delete all data on the removable disc. After pressing the stick, displaying
    a progress bar. After completing the install, you will also see the current version
    of the software in the Ventoy (*device*) in the main window.


    To use the removable disc which Ventoy has prepared, simply copy the operating
    system images to the visible partition. You can include images for different hardware
    architectures. The number of systems that can be used is limited by the size of
    the removable disc. Even with many images, the system starts directly from the
    files without unpacking the image.


    After copying, select the disc as boot the next time you start the computer. The
    EFI boot then launches a Grub menu that lists all the distributions you have one
    below the other. Use the arrow keys to select the desired operating system and
    press Enter to enter the boot menu. Depending on what this is, you will see the
    Grub boot menu preset for the distribution or a prompt at which you can specify
    options.


