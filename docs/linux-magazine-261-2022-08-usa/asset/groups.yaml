    用于接收。进程仅仅读取发送端管道，并将行重定向到你希望远程机器处理的信息，但这将需要不必要的内存消耗。嵌套管道在解决方案 之后。只有当远程机器同时读取数据时，进程才会写入管道，进程不需要管道的任何额外内存。t1-命令从相同点写入数据。为了在两者之间建立连接，使用了命名管道。接收端从发送管道读取，并将输出重定向到输入（图\
