    Debugger


    # # magic-trace


    Debugging tools are important parts of the development process. help programmers
    compare what is actually happening with what they think is happening, revealing
    all kinds of unintended side effects in the process. You''ve probably heard of
    GDB because it''s well known, surely powerful, and always installed along development
    environment. But it is also complicated and unintuitive. Magic-trace, on the other
    hand, is an excellent alternative to GDB that can help you understand your processes
    at a higher level and also help anyone more interested in what


    their systems might be doing and how they''re doing. Rather than GDB, the magic-trace
    is the perfect Linux tool designed to monitor exactly what your CPU is doing.
    In addition to needing help, magic-trace will only run on a Linux kernel from
    66 onwards, and won''t concurrently run from a virtualized environment. If you
    meet these requirements, then simply use the magic-trace command with the path
    of the executable you want to execute, or at that, to trace a process that is
    already running. Both commands offer much more control over which threads of a
    process are traced and at what system level they''re monitored.


    ![](img/31162a00ee46c5d590c544cb2d944405_84_0.png)


    The trace output can extract debug symbols from a different location and trace
    across the kernel.


    Your process will run up to 10% slower, and every function call is tracked. When
    you exit the process, the results are compiled into a trace file. This binary
    can be loaded into a web-hosted GUI interface like magic-trace.org, which can
    also be self-hosted. This web app will map the call stack and allows you to see
    everything that was happening during the trace. It''s a little like a glass plot
    of the boot-process. incredibly accurate and dense but quite powerful at letting
    you see what''s taking your resources in tiny slices of time.


    Project Website


    https://github.com/jaenetree/magic-trace


    ![](img/31162a00ee46c5d590c544cb2d944405_84_1.png)


    Decompiler


    # # Snowman


    A debugging tool like magic-trace (above) is most useful when you have compiled
    the applications you want to trace, with debug info. Each link of the binary data
    connects an executable to the source code used by the binary, and it can helpมากมาย
    when you need to debug a process with unexpected happening. Likewise, if you haven''t
    built the binary from source code yourself, many distributions include separate
    debug packages that do the same effect, letting you see the source code for an
    executable when running through a tool. But there are also lots of times when
    you want to debug or inspect without


    having access to the source code, and this is when a decompiler can help A decompiler
    turns binaries into source code that can be inspected and potentially rebuilt.
    Snowman is a decompiler that has its UI and accompanying command-line tools, and
    it can turn binaries into C/C++ code that can be inspected and modified. Snowman''s
    decompiler interface is simple and easy to use, and you start by opening the executable
    file you want to analyze; you will see the disassembly for the code in the left
    panel before spending some time analyzing the data flows for every event in the
    code. In, the right side panel will


    ![](img/31162a00ee46c5d590c544cb2d944405_84_2.png)


    Selecting any line in the code will immediately skip the assembly instruction
    and function call, helping you quickly navigate the disassembled code.


    show the reconstructed anything like the C/C++ code because every function and
    variable has been replaced by a placeholder name; now show the logical flow of
    execution from the code, which is easier to read than the binary, especially helped
    by the function inspector, symbol table, and binary sections


    Project Website


    https://github.com/yegord/snowman'
- md: "\n# LINUX FOSSPICKS\n\n## Web testing\n\n### Artillery probe\n\nArtillery is\
