    MATE for users who stayed away from Gnome 3. Today, Linux Mint is also known for
    innovation, and for its rolling Linux Mint Debian Edition (LMDE), which allows
    for independence between its developers and its community. Throughout 18 years
    of existence, Linux Mint has grown up by team leader Clement Lefebvre, who has
    taken the time to focus on the project''s history of Linux Mint.


