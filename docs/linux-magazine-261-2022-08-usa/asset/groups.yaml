    # # IN-DEPTH

    Hot Backups


    and the snapshot may be dropped if it needs to grow past the physical storage
    medium''s capabilities. It is worth noting that many applications might want to
    back up without guaranteeing the consistency of files while they are running.
    For example, a database might work asynchronously, performing many operations
    in a RAM cache and committing to disk periodically. Creating a backup that perfectly
    mirrors the filesystem is stored in will create a copy with inconsistent data,
    because many database operations may not have been committed to it.


    is important to check the documentation of the programs you are backing up in
    order to learn of potential pitfalls.


    Databases are notorious for including their own backup utilities, and if you intend
    to use a database (such as MariaDB or PostgreSQL) you should consider their tools
    instead of backup utilities that operate at filesystem or block level.


    # ## Conclusions


    Classic Unix tools are not advisable for making backups of files and folders that
    are being modified during the process, because backup corruption can occur as
    a result. A user who used LVM as a result has discovered that there are other
    tools for the task, such as ZFS and BTRFS snapshots.


    Many programs, especially services intended for production, suggest their means
    for creating backups (Figure 4).


