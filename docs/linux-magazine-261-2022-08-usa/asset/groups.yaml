- md: "\n# Ventoy\n\nVentoy [1] uses USB memory sticks for storing bootable operating\
    \ system images. It does not matter whether the images are in different formats\
    \ or are for EFI or for BIOS boot systems. In addition to supporting partitioning\
    \ schemes: MBR or GPT, Ventoy also supports a target architecture. The project\
    \ has already tested over 800 candidates.\n\nVentoy creates two partitions on\
    \ all USB removable media. The first partition uses the exFAT format and operates\
    \ the operating systems. The second partition is a FAT partition that contains\
    \ the EFI boot loader.\n\n# Getting Started\n\nThe graphical version of Ventoy\
    \ requires a command-line variant, as well as a version with a web-based interface.\
    \ In addition to compatible 32-bit and 64-bit hardware, Ventoy supports ARM64\
    \ architecture. The first tool is downloadable from the terminal. All versions\
    \ are available as an ISO image or 16MB for optical media.\n\nAfter downloading\
    \ and unzipping the tarball, the folder `ventoy-1.0.8/` contains subdirectories\
    \ and a graphical user interface. To run it on a 32-bit or 64-bit system, navigate\
    \ to `ventoy_x86` or `ventoy_x64`. You can then call the interface by typing,\
    \ `./ventoy.sh`. In all cases, you will see the program window after authentication,\
    \ and the controls are identical in each case (see Figure 1).\n\nThe program window\
    \ lists the removable media you have attached. Start a selection in the device\
    \ box. Select the device, the window shows the Ventoy version running locally,\
    \ and if present, the Ventoy version running on any attached USB stick. In the\
    \ next step, select the device on which you want to install the operating system.\n\
    \nAfter you press *Install*, a warning message appears, telling you that the overwrite\
    \ will delete all data on the removable disc. After pressing the stick, a progress\
    \ bar is displayed. After completing the install, you will also see the current\
    \ version of the software in the Ventoy (*device*) in the main window.\n\nTo use\
    \ the removable disc which Ventoy has prepared, simply copy the operating system\
    \ images to the visible partition. You can include images for different hardware\
    \ architectures. The number of systems that can be used is limited by the size\
    \ of the removable disc. Even with many images, the system starts directly from\
    \ the files without unpacking the image.\n\nAfter copying, select the disc as\
    \ boot the next time you start the computer. The EFI boot then launches a Grub\
    \ menu that lists all the distributions you have one below the other. Use the\
    \ arrow keys to select the desired operating system and press Enter to enter the\
    \ boot menu. Depending on what this is, you will see the Grub boot menu preset\
    \ for the distribution or a prompt at which you can specify options.\n\n# Updates\n\
    \nIf you want to update operating system images on the Ventoy medium, simply delete\
    \ the outdated image from the removable disc and copy the new one to.\n\n![](img/31162a00ee46c5d590c544cb2d944405_16_0.png)\n\
    \nFigure 1: The Ventoy program window.\n\n# COVER STORY\n\n# Multiboot for USB\n\
    \nYou can manage several different versions of the same operating system in parallel\
    \ without getting them in other's way. Ventoy generates a separate entry in the\
    \ boot menu for each individual device. The entries automatically update each\
    \ time the system is booted so that you will see all the systems.\n\nLive systems\
    \ have issues with persistence, which means that you can customize and new software\
    \ is lost after the system is shut down. Ventoy gives you the option of creating\
    \ a persistence file using a script.\n\n# Persistence\n\nIf you plan to use this,\
    \ it is a good idea to check up on the Ventoy website to see whether the live\
    \ distribution you are using by Ventoy actually supports persistence. If so, to\
    \ associate a persistence file, you can use Ventoy's web-based interface for managing.\
    \ Ventoy's modular design adds a variety of flexibility and it doesn't require\
    \ any kind of input at command line.\n\nFor persistence, the first step is to\
    \ create a file of desired size on the USB medium in the terminal. Run the command\
    \ and find the first line of image in the Ventoy list. Increase the IGR file size\
    \ to a capacity that is practical for you (second line), then it will take a moment.\
    \ By selecting the size, in the terminal, run the command to finish it.\n\n- Listing:\
    \ Creating a Persistence Image File\n\n```\n$ sh CreateVentoyPersistence.sh -i\
    \ <path/to/image> -o <device> -removable-image=<filename.img>\n```\n\n```\n$ sh\
    \ CreateVentoyPersistence.sh -i <path/to/image> -o <device> -enable=<filename>\n\
    ```\n\n```\n$ sh CreateVentoyPersistence.sh /dev/<device> -enable=<filename>\n\
    ```\n\nReplace the device with the actual name of the USB removable device; this\
    \ is usually sda. Note that you are allowed to enter permission. Open a web browser\
    \ and enter the local address http://127.0.0.1. This will show the Ventoy configuration\
    \ interface for managing persistence.\n\n![](img/31162a00ee46c5d590c544cb2d944405_17_0.png)\n\
    \nBy default, the Device Information page appears, showing you basic information\
    \ about the active USB device (Figure 2).\n\nTo enable file for persistence on\
    \ the USB disk, you need to select the Persistence plugin. On the right side of\
    \ the settings, you will find an (empty) table with a horizontal table. The table\
    \ refers to the supported hardware architecture. By default, the software enables\
    \ persistence for 64-bit systems. Now Click on the right side of the table to\
    \ create the persistence file, and name it.\n\nNote that you can create different\
    \ persistence files for different images on the removable USB disk, each created.\
    \ In the dialog for creating a persistence file, enter the location of folder\
    \ in the File Path field.\n\n# Figure 2: Enabling persistence with the web-based\
    \ management interface.\n\n![](img/31162a00ee46c5d590c544cb2d944405_17_1.png)\n\
    \nThen, in the Date File field, enter the name and path of the newly created persistence\
    \ file. Press OK to close the dialog. The mapping between the persistence and\
    \ the selected image is shown with status in the table.\n\nIn the Ventoy context,\
    \ you can create different persistence file named vent, on the removable disk\
    \ that maps the persistence files to the images. You can repeat the configuration\
    \ steps by arbitrarily to create multiple persistence files on the removable disk\
    \ and map them to images (Figure 3).\n\nAfter rebooting the removable USB medium,\
    \ the Grub boot menu in \n\n# Figure 3: you can add a persistence file with a\
    \ few mouse clicks.\n\n# COVER STORY\n\n# Multiboot for USB\n\n![](img/31162a00ee46c5d590c544cb2d944405_18_0.png)\n\
    \ndialog. The USB stick must have a partition with a standard file system.\n\n\
    Click on the Browse button and click on an image in the file manager. You can\
    \ configure the settings in the lower part of the window.\n\nIf you want to transfer\
    \ the selected to the USB stick straight away, press the install distro in the\
    \ MultibootUSB tab in the lower part of the window. The software will now create\
    \ the bootable file system and write the ISO image to the disc. At the end of\
    \ the procedure, MultibootUSB tells you that you now have a working memory. You\
    \ can now select another image by repeating the process.\n\nIf you are running\
    \ out of space, you can delete a distribution that is currently on the disc. In\
    \ order to do this, select the name of the Uninstall distro in the bottom right\
    \ and after confirmation, MultibootUSB deletes the distro.\n\nWhen you boot with\
    \ MultibootUSB disk, Syslinux starts first. A simple grub2 manager will give you\
    \ the option of booting from memory or the storage of the images on the memory.\
    \ If you select one of the images, the guest manager launches it.\n\nIf you are\
    \ booting a distro that you created on a removable media, MultibootUSB will show\
    \ a Persistence menu when you select the distribution. Use this area. MultibootUSB\
    \ will display the size of the ISO image in megabytes at the edge of the side.\n\
    \nFigure 4: MultibootUSB is visually confusing but still intuitive.\n\nVentoy\
    \ will show you a second menu, depending on the distribution. You can use the\
    \ menu to decide whether to launch the selected image or persistent data.\n\n\
    # MultibootUSB\n\nMultibootUSB [4] is a program for creating USB storage media\
    \ with multiple distributions. The free software is available to download from\
    \ Sourceforge in the best format and RPM packages. Arch Linux, Mandrive, and other\
    \ Linux distros include Multiboot in their repositories, which means you can easily\
    \ set it up with the built-in manager. After you install, you will find it in\
    \ the Start Menu, clicking the launcher (then) first time you use is a somewhat\
    \ confusing window (Figure).\n"
  mdcn: "\n\n# Ventoy\n\nVentoy [1] 使用 USB 闪存来存储可引导的操作系统镜像。无论镜是不同格式，还是用于 EFI 或 BIOS\
