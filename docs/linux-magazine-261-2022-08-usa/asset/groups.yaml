    一旦你在单机模式中获得了经验，你将与其他玩家一起赛车竞争。在分屏多人游戏模式下（主菜单中的 Split Screen multiplayer），几名玩家坐在同一张桌子前面对一个分屏屏幕。一名玩家可以使用键盘，而所有其他人都需要摇杆或游戏手。


    玩在线游戏（主菜单中的 Online），你将与互联网上的其他玩家竞争。在此过程中，你要么向自己发起挑战，要么展示别人发出的漂移。


    # 前往 Magna


