    # 编程快照 - 使用 Go 实现自动重启


    被提醒 30 秒后返回，另一个可能需要更短的超时时间。你可能需要 yoyo 为尝试次数设置限制。如果发生错误，你不希望无限重启，并可能骚扰它持续运行的服务的所有。`--timeout`
    和 `--max` 标志允许设置适当的值来控制这种行为，Go 的 `flag` 包处理来自命令行的输入和语法示例。


    `git push` 命令显示，由于服务器缓慢，提交因进入睡眠状态而失败。3 秒后，yoyo 检测到这一点，最小化了进程，然后再次唤醒，看吧，进程继续了。


    ```

    $ ./yoyo --timeout=2 --retries=2 ./test.sh

