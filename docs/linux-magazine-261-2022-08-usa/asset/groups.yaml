    # More Players, More Fun


    Once you have gained experience in single-player mode you will be racing to compete
    with other players. In split-screen multiplayer mode (the Split Screen multiplayer
    in the main menu), several players sit at the same table for in front of a split
    screen. One player can use the keyboard, while all others need a joystick or gamepad.


    Play Online (the Online in the main menu), you compete against other players on
    the Internet. In doing so, you either issue a challenge to yourself or display
    the drift of someone else launched.


    # Off to Magna


    SuperTKart is more than just a racing game: you have a competition to complete


    ![](img/31162a00ee46c5d590c544cb2d944405_79_1.png)


    **Figure 12**: Nolok (top) has kidnapped Gnu (bottom) and is holding him in his
    lava castle, Fort Magna. Put your driving skills to the test and free the grandfather
    of free software.


    # Slippery Slope


    To track masters with many bands (such as the Black Forest in Japan), you need
    to be tied to drift (the right arrow) or to the left story. To do this, click
    on the Story Mode button in the main menu and you will see a video with the background
    story: Gnu, the founding father of free software, has been kidnapped by Nolok,
    who is imprisoned in the lava castle, Fort Magma (12). To free Gnu, you need to
    take on the role of Tux or some other character and face a total of 25 challenges.


    The individuals are marked on the map at bottom left in story mode (Figure 13).
    If you see a lock symbol on the map, you have not collected enough points to take.
    A small podium, on the other hand, indicates that challenges are waiting for you.
    Drive to the spot marked on the map and demonstrate your progress.


    If you are successful, you gain a bronze, silver, or platinum trophy, depending
    on the difficulty level, and earned with some points (Figure 14). When you reach
    a number of points, more marks and tracks are unlocked. You can also click Add-ons
    on the screen to download new cards and tracks off the web. The collection is
    constantly growing.


    The final challenge takes you to Fort Magma, where youll face Nolok. You need
    to defeat Nolok to free Gnu.


    # Cheats


    SuperTKart is more fun if you take on one challenge after the other. But there
    is a short-cut to gold: simply edit the /config/supertkart/players.xml file with
    your choice of editor. The <story> tag contains a list of challenges.


    After each challenge, replace solve="bronze" (cup), solve="silver" (silver cup),
    solve="hard" (gold cup), or solve="best" (platinum cup). The next time you play
    SuperTukart, you will have all of these trophies and score to match.


    # Conclusions


    SuperTukart is great fun when you are playing on one of own against the computer
    or with other players. Be careful! The game is totally addictive!


