    ## Program Flow

    The listener reads the receive pipe and initiates approach. If it receives a line
    containing a command to be executed it checks there is a text file containing
    the working directory (Figure 4). In the next step, it writes the BEGIN_CMD_OUT
    to the stdout stream.


    After the transfer, the process changes to the desired directory and writes any
    commands to be executed to a subprocess. The command output is written to the
    data stream. The end of the command is marked by the string END_CMD_OUT. If the
    line starts with an END_COMMICATION string, the process quits.


    As a last result, the function checks whether the received line contains the BEGIN_CMD_OUT
    string. If so, it outputs all other lines on the screen until it receives the
    END_CMD_OUT string. Figure 5 shows the flow chart of the listener.


    Table 1: Functions in a Shell

    | Function | Explanation |

    |---||

    | setenv | Sets all required environmental variables. |

    | check | Checks whether the required pipes exists in /tap |

    | createpipes | Generates all required pipes in /tap |

    | removepipes | Deletes all pipes on the remote host. |

    | listen | Generates a listener that reads and processes files. |

    | establish | Generates a data stream in the direction of the second computer.
    |

    | kill | Terminates all required background processes. |

    | rcmd | Runs a command on the remote host. |

    | sendfile | Copies a file to the remote system. |


