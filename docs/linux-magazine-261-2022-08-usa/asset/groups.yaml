    ### Who Am I?


    Inxi gives users a comprehensive inventory of the system hardware – but only at
    the command line. Inxi-gui, a graphical front end, makes things a little more
    convenient. By Erik Bärwald


    ![](img/31162a00ee46c5d590c544cb2d944405_47_0.png)


    The inxi command-line program provides detailed information about most of your
    computer''s hardware. To display the data, however, you need to pass parameters
    to inxi [1], a small front end for inxi [2] by the developers of the Korean-based
    Inxi Linux distribution (for Ubuntu, Linux Mint, and derivatives), make the whole
    process easier and faster.


    The inxi-gui front end, calling inxi as its base underpinnings, also relies on
    various system utilities, each of which parses the Command column with its parameters.


    After enabling some commands, you need to authenticate yourself as an administrator.
    Then, inxi-gui shows you with a self-explanatory interface without any implants,
    which offers options you can select from the other (Figure 1).


    # Installation


    To integrate with your system, you can use the following two commands from Listing
    1. These commands create a script, which you can then run to launch it. To call
    up, you will need to activate the radio button to be the of interest to you and
    then press OK.


