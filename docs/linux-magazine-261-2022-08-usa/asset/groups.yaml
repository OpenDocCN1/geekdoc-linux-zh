    # USB Boot


    Live boot was such an exciting idea 15 years ago – just carry a CD with you and
    boot from anywhere. But old-style boot CDs had some limitations. For one thing,
    they came in a fixed size. Then there was the problem that you couldn''t save
    anything. Today''s USB tools solve those problems plus offer a feature that no
    one thought back then: access to several boot images on a single stick.


