    - (1) Mint 月刊：https://blog.linuxmint.com/

    - (2) Tech：https://tejeteech.com/

    - (3) Joe Cas 编写的《颜色》，Linux 杂志第 256 期，2022年3月：https://www.linux-magazine.com/issues/256/Welcome

    - (4) Timeshift 捐赠：https://tejeteech.com/product/timeshift-donation/

    - (5) Mint 月刊：https://www.linuxmint.com/donors George 为 Linux 编写了软件。


