    ## LINUX VOICE SUPERTUKART


    在本地或在线玩免费的 SuperTukKart 赛车游戏。


    快速的乐趣和创意的想法是 SuperTukKart 赛车的特点。这篇文章为读者提供了一些游戏技巧。


    作者：ANANIEL TIBI


    如果你看到一只企鹅开着车穿过苏格兰、黑森林或一座禅宗寺，那这只意味着一件事——它是 SuperTukKart 的粉丝 [1]。这只企鹅有一个使命要完成：软件之祖
    Gnu 被大反派 Nolak 绑架了。Nolak 将 Gnu 关在他在 Inava 的 Fort Magna 城堡里。通过在与 Nolak 的竞赛中展示你的驾驶技巧，你就可以救出
    Gnu。


    或者，你可以使用你发行版的包管理器安装该游戏。SuperTukKart 是最老的 Linux 游戏之一，所有主要的发行版都提供。甚至还有一个针对移动设备的
    Android 版本 [3]。


    ### 准备就绪


    在 Linux 上设置此游戏可以更简单。从网站 [2] 下载 tarball 包（版本 1.3 于 2021 年 9 月 28 日发布）并解压文件。不需要安装：你只需在
    shell 中输入 `sh run_gae.sh` 即可运行 `run_gae.sh` 文件。


    ### 设置


    启动界面界面布局清晰（图 1）。点击右上角的区域可以自定义你的名称，并输入用于在线账户的访问数据 [4] 以在网络上进行多人游戏。


    使用底部栏的图标，你可以配置设置（扳手图标）、查看你的最佳成绩（皇冠）、阅读游戏的简要说明（问号），以及启动教程（书本）等其他模式。


    游戏提供不同的模式。在故事模式中，你将发现各种挑战，通往 Fort Magna 并救出被囚的 Gnu。在单人模式下，你可以与电脑控制的汽车竞争。在分屏模式下，你将在同一台
    PC 上与其他玩家进行比赛，屏幕将为分屏。在在线模式下，你可以与局域网或互联网上的玩家竞技驾驶技巧。


    ### 出发！


    为了获得所需的练习，最好在接受故事模式中的挑战或与他人竞争之前，先在单人模式下对电脑玩几轮。要做到这一点，点击卡车上的“单人模式”（图 2），但不要忘记它们具有不同的特性，在重量、速度、加速度和氮表现方面有所不同。


    轻型车比重型车更灵活，这在弯道较多的赛道上是一个优势。轻型卡车如果被对手撞到，会把你撞飞出赛道。另一方面，重型卡车可以达到比轻型车更高的速度，这让你在直道上具有优势。


    然而，轻型卡车的加速度更快，而且有限的氮供应也让你在起跑、事故后或弯道较多的赛道上占据优势。尝试不同的变体以熟悉每种车的特性。


    这就是你如何证明自己对赛道的熟悉程度的，因为彩蛋隐藏得很好，有时甚至在官方赛道之外，取决于难度等级。


    在演示赛中，你将与预先录制的比赛进行竞争，来自录制比赛的赛车将作为幽灵赛车穿过赛道。游戏自带了此类的预录制比赛。为了获得最佳成绩，你可以记录自己的圈数。


    ### 供你选择


    在每种情况下，请选择最适合下一场特定比赛条件的赛车。选择难度等级设置（等级 3：初学者、高级或或专家）。一旦你掌握了足够的挑战并获得了必要的经验，你也可以选择最高难度模式——SuperTukKart。


    起初，在你掌握了故事模式中的某些挑战后，你的赛车会被标记上一把锁锁。比赛和赛道也是如此。


    游戏不仅限于赛车，还有具有不同游戏模式的漫画（图 4）。在普通比赛中，你与其他玩家的赛车竞争，玩家们试图互相碰撞。起作用的不是你的驾驶技巧，而是你的战术。


    在计时赛中，战术元素至关重要，你不允许碰撞他人。你的驾驶技巧决定一切。领先者跟随模式允许你跟随领先者（且不超过他们）。引擎会生成其中一个电脑控制的赛车作为领先者，你从比赛开始就跟随他们，同时计时器在倒计时。


    倒计时结束时，当前的领先者被淘汰，因为所有驾驶员都在领先者之前。接着，新的倒计时开始，最后一个领先者和所有之前的驾驶员都被淘汰。这一直持续，直到第二名只剩一辆赛车，加上领先者，领先者赢得比赛。


    或者，你可以将战斗转移到竞技场（图 5）。那里没有比赛，但你可以收集物品击中其他玩家。顺便说一下，如果你击中三次，你就出局了。


    如果你想踢足球或冰球而不是赛车，那么 SuperTukKart 也没问题。只需将场地改为场馆，并将球踢进对方的大门。获胜者是比赛结束时进球最多的队伍（图 6）。使用表
    1 列出的按键。


    ## LINUX VOICE SUPERTUKART


    在故事模式下，你与自己的圈数竞争。一旦你设置了等级和游戏模式，根据比赛类型选择比赛、竞技场或场馆。游戏自带了自己的挑战。


    在彩蛋寻宝模式中，你是赛道上的唯一一人，并收集隐藏的彩蛋（图 7）。


    ## 让路！


    当比赛开始时，将开始倒计时（图 8）：“准备……就……开始！”如果你在倒计时时已经在加速，你就可以在起跑时获得额外的加速助力。


    但注意不要加速过快。如果你在倒计时结束之前按下加速，你将受到时间惩罚并且不允许延迟启动。相反，如果你得太慢，在“开始”或“稍后”时加速，你将错过起跑时的加速。


    在屏幕左上角，你可以看到其他玩家按顺序图标。如果你不想使用键盘，可以使用手柄、游戏控制器或方向盘来控制你的赛车。


    ### 表 1：熟练控制


    | 按键 | 动作 |

    | --- | --- |

    | 上箭头 | 加速 |

    | 左箭头 | 向左转向 |

    | 右箭头 | 向右转向 |

    | 下箭头 | 刹车、倒车 |

    | 空格键 | 射击 |

    | B | 向后看 |

    | N | 氮加速 |

    | V | 漂移 |

    | 退格键 | 救援 |

    | Esc | 暂停游戏 |


