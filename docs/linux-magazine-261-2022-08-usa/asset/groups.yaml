    Linux Mint 20.3（代号为 Una）是这个广流行的 Ubuntu 衍生版的最新长期支持版本，支持将持续到 2025 年。MATE 版本是 Linux
    Mint 对 Gnome 2 分叉的最新开发版本，提供了稳定、中轻量且快速的开箱即用体验。


    MATE 与 Linux Mint 另一个内部开发的桌面环境 Cinnamon 共享许多功能。这两个版本的 20.3 版本都引入了文档管理器，并为“便签（”（Sticky
    Notes）添加了调整大小的搜索功能。此外，还提供了具有更大、圆角标题栏和强调色的新主题，以及深色模式。某些应用程序包含了打印机支持，并在 PDF 阅读器中加入了从右向左的支持，以便阅读漫画。MATE
    的独特功能包括为 Hypnotic IPTV 播放器提供了全新的外观和搜索功能。


    FreeBSD 的“表兄弟”是一个类 Unix 系统，共享许多相同的应用程序。主要区别是 FreeBSD 是在宽松的许可证下发布的，而 Linux Mint
    的大部分内容是在 GPL 许可证下发布的。当你使用 FreeBSD 时，你还会发现设备名称和其他系统细节的差异。FreeBSD 是所谓 BSD 家族中最受欢迎的成员，也与
    NetBSD、DragonBSD 和 OpenBSD 相关联。与 Linux 不同，FreeBSD 不仅开发内核，还开发自己的硬件和设备。因此，它的大多数发布说明比典型的
    Linux 发行版更具技术性，详细介绍了选项和硬件支持，而不是新功能。更多信息请参阅 https://www.freebsd.org/releases/13.1/。


    老用户会喜欢 MATE 的经典外观，它在应用名称和对现代计算需求的支持上与 Gnome 2 有何不同。新用户会发现 MATE 是一个自解释其义的桌面，他们可以快速适应。


    FreeBSD 更可能吸引专家用户，他们会欣赏其独特的结构和多样化的处理方式。对于任何好奇“类 Unix 操作系统”这一掩饰表达背后含义的人来说，FreeBSD
