    # Managing time-triggered events with Zeit


    ## Timetable


    Zeit offers a graphic front for the crontab and tools, making it easier to manage
    the time-controlled execution of programs, alarms, and timers. By Frank Hofmann


    When it comes to managing the time-controlled execution of programs, we use the
    entries in /etc/crontab file (for repetitive tasks scheduled at regular intervals)
    or we use the crontab for a one-time action.


    While we use a kind of order book that stores the commands to be executed by the
    whole system, crontab works differently. The crontab contains entries for the
    whole system, while the files in /var/spool/cron/ contain entries. Each line in
    the crontab fully describes a single job. Care must be taken when specifying jobs
    because the entry''s format is arcane. You can learn its syntax, but mastering
    it is a trivial task. If you use an IPC interface, you will be familiar with the
    format.


    Despite and care, you may find out that cronjobs start or are executed at the
    wrong time. A graphical user interface (GUI) can help reduce errors, ever experienced
    users. However, several attempts at a suite for time-controlled calls (e.g., KCron,
    KcCron, CronMagic, Gnome Task Scheduler [1], and Vcron) have fallen short due
    to owing complexity or simplicity.


    Zeit [3], a graphic front for the crontab, promises to remedy this and make time-triggered
    events easier. In development since 2015, Zeit is now considered for use and offers
    both English and Russian versions.


    # Installation


    Zeit v0.6.0 on Debian "Bulls" without any problems. Zeit is not included in the
    official Debian and Ubuntu sources. You can install it via the GitHub repository
    or by Ubuntu PPA. You have a few options for installing Zeit. You can add the
    PPA repo by typing apt-add-repository and installing the packages with your package
    manager (Listing 1). Because this option is not available on Debian, I took the
    alternative of deploying the package provided by the developer''s GitHub. I deployed
    it to test the system using 594. There were no problems during the process. After
    grabbing the package, I used the package library-binutils, which is what I use
    for now. When installed, Zeit uses about 450KB of disk space.


    + Listing 1: Installation via a PPA

    ```

    $ sudo apt-add-repository ppa:blaze/mine

    $ sudo apt update

    $ sudo apt install zeit

    ```


    ## IN-DEPTH


    Detailed in the Advanced section, where you can specify the exact minute, hour,
    day, and month. You can also use the same notation for crontab 1-5 for Monday
    to Friday. Context helps you in your endeavors to correctly specify individual
    values. Below the input boxes, a box will show the value you entered and clear
    when the system will execute the task. Check the Enabled checkbox at bottom; if
    checked, enabled will only be displayed as a checkbox in the list. Press OK to
    complete the creation of the task.


    **Figure 1:** Zeit with the daily reminder. Need to install the developed packages
    on your system to build the software; otherwise, your attempt to set up one-time
    jobs will fail. You don''t have to install crontab since it is typically a part
    of any Linux system from the outside.


    ## User Interface


    After installation, you will find in the Tools section of your application. If
    you use the command-approach, you can simply call the program by typing zeit with
    a clear-cut interface without any bells and wheels. In the version you used, the
    headers are Zeit, Tools, and Help. If it''s not installed, you can install it
    from the standard packages. Below the menu you will find such buttons, some of
    which cannot enable until you have selected a task from the list in the main window.


    Using the buttons, you can copy, modify, or delete tasks or commands. Note that
    alarms are listed in order (Figure 1). Clicking on an object opens a context menu
    where you can choose Copy, modify, and delete the tasks. Please note that Zeit
    immediately reflects the changes to the crontab table. You can also make a backup
    of your crontab at alert to avoid any nasty surprises.


    ## Adding Tasks


    For recurring jobs, go to Time | Add Task button, or press Ctrl + A. A dialog
    box opens where you can define the name of your task in detail (Figure 2). In
    the task name field, start by entering the description and the command to be executed.


    Next, specify the time of execution. A simple address allows for every hour, day,
    week, or month.


    ## Operating Modes


    Zeit runs without user authorizations and does not require root access. You can
    only manage your own crontab. For this, check the box in System | Mode or press
    Ctrl + S. Use the same command to switch to the normal user mode. You can also
    choose Periodic for crontab (one-time jobs) for at, and Environment Variables
    for cron. You can configure this in the View menu or use respective Ctrl + P,
    Ctrl + N, and Ctrl + E shortcuts to change Task, Command, or Variant.


    **Figure 2:** The edit for lunch at 12 noon from Monday to Friday.


    ## Editing Tasks


    To edit an existing task, select one in the list and navigate to Zeit Modify or
    click the Modify Task at bottom. Alternatively, you can use the context menu or
    Ctrl + M.


    **Figure 4:** A alert alarm can play back sounds with a media player such as VLC.


    LINUX-MAXIME.COM | LINUXPROMAGAZINE.COM

    AUGUST 2022


    ## crontab guru


    The quick and simple editor for cron schedule expressions by Crontab


    ## At 22:00 on every day-of-week from Monday through Friday.


    ```

    0 22 * * 1-5

    ```

    minute (0-59) hour (0-23) day (1-31) month (1-12) day of week (0-6)


    **Figure 5:** The crontab guru website.


    I found the description above the gray input field in crontab guru very helpful
    because it translates the crontab specification into plan.


    ## Alarms and Timers


    Zeit also allows you to set alarms and timers. You can set the alarm via Tools
    | Timer or pressing Ctrl + L. In the dialog box, you can add a description for
    the alarm, including the music file to play, and the times when it is triggered
    (Figure 4).


    ## Task List


    to the end of the task list, which you can customize it as desired. The Zeit GUI
    offers two opportunities to customize the display in the task list. you can use
    the task search by either going to View | Show Filter or by pressing Ctrl + F.
    An input for the filter then shows the list. Zeit only processes plain text, not
    regular expressions. Zeit interprets the search term and searches in the description,
    the execution times, and the stored command.


    ## Alternatives


    If Zeit is not quite of your tea, there are also a few web-based tools that will
    make it easier to create crontab entries. One candidate, crontab guru, lets you
    first formulate the entry in the web interface and then transfer the results to
    your system.


