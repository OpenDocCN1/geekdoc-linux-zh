    # Linux 教程 - 检测损坏链接


    ## 列表 7：符号链接 (symlinks)


    ```

    $ symlinks -rv

    dangling: /home/frank/project/version2/data/dataset3 -> project/version1/data/dataset3

    relative: /home/frank/project/old -> project/version1

    relative: /home/frank/project/current -> project/version2

    ```


    ## 列表 8：符号链接与 egrep


    ```

    $ symlinks -rv | egrep "dangling"

    dangling: /home/frank/project/version2/data/dataset3 -> project/version1/data/dataset3

    ```


    ## 列表 9：findbnd


    ```

    01 $ /user/share/find/findbnd/findbnd

    02 project/version2/data/dataset3 -> project/version1/data/dataset3

    ```


    symlinks [] 是一个用于清理绝对链接的工具，例如通过将绝对链接转换为相对链接并删除损坏链接。它有两个参数 -r 和 -v，分别告诉 symlinks
    递归搜索目录并输出关于链接的详细信息。列表 7 显示了一个示例目录，它找到了一个被分类为损坏（“dangling”）的链接以及两个链接。在运行时，列表 1
    和列表 3 之间没有显著区别。要仅过滤损坏链接，只需将 symlinks 与 egrep 结合（列表 8）。


    基于 GUI 的 Fslant [] 工具基于 find() 命令行工具（位于 find 软件包中），与 symlinks 属于同一类别。如果你发现任何其他参数，它遵循当前链接并逐个打印匹配项。列表
    9 显示了调用的结果，实际上与列表 2 和列表 8 的结果完全相同。仔细观察后，findbnd 的行为变得更加清晰：它是一个搜索链接的简单脚本。


    我使用了 readlink [] 和 chase [] 工具作为 (Shredder, rslant 的图形化前端) 方法，它们在 rslant 网站上看起来很真实，但我无法
    GNU/Linux 中实现它们。与 Fslant 类似，rslant 旨在发现并修复文件系统中条目的不一致之处，检测损坏链接。你可以在列表 10 的一行代码中完成操作。


    -w 选项会告诉你结果；bi 是“broken links（损坏链接）”的缩写。-o 选项决定输出格式，prept stat 值为你提供特权显示。图 2 显示了一个包含
    relink 的示例。


    ![](img/31162a00ee46c5d590c544cb2d944405_91_0.png)


    图 2：示例的 rslant 结果。


    ```

    dd@debian:~$ rmlink -T bl -o prept:stdt cod-software/

    # Bad symlinks:

    rm /home/cod-software-test/test2/v2/no-clue

    rm /home/cod-software-test/broken/

    ```


    # 教程 — 检测损坏链接


    modules os as Line 第 1 行将它们导入到当前命名空间。第 3 行定义了一个名为 walk() 的函数，该函数遍历作为顶层参数传递的目录并检查其中的所有条目。在第
    22 行调用了 walk()，在此之前评估了第 21 行作为参数传递的目录。


    首先，程序创建搜索结果（第 4 行到第 7 行）。如果发生错误，walk() 函数在此处终止。然后，代码检查目录中的每个条目，以判断它是文件（第 11 行）、链接（第
    13 行）还是目录（第 15 行）。该程序跳过文件。例如，walk() 函数被递归调用，再次以目录名作为参数。


    然而，对于链接，来自第 16 行的 readlink() 函数会搜索目标。如果它是空的，则是一个损坏的链接，函数返回相应的错误消息。在检查完目录中的所有条目后，函数返回到调用点。如果你在目录树中运行脚本，你将看到包含列表
    2 中两个条目的输出。


    relink 检测到两个损坏的链接（它就是这样工作的）。echo 输出名称并显示链接目标。chase 还执行了一项令人兴奋的任务：追踪符号别名指向的文件，如果目标不存在，在情况下返回
    1。列表 10 的第 2 行显示了对旧引用的调用，我们的结果是文件名。请记住符号链接可以跨越系统边界。你唯一的选择是检查文件系统中的每一个条目。


    ## 结论


    在结构中可靠地检测损坏链接需要开销，但这是可以实现的。这里讨论的工具将帮助你轻松处理此问题：


    ## 避免错误


    你如何从根本上防止损坏链接出现？坦率地说，这里的唯一建议是更加小心（此外没有一个存储所有链接的地方）。我没有知晓任何后台搜索来确保链接保持完好，你可能会无意中破坏链接。在删除文件之前，使用本文讨论的任何工具检查是否存在符号链接是有意义的。如果你只有对
    find 和 readlink 的访问权限，请参考列表 11 所示的步骤。调用列出了这两个组件和链接目标 -side。为了做到这一点，find 使用了 -ls
    选项。


    ## 列表 10：rmlink 和 chase


    ```

    01 $ rmlink -T bl -o prept:stdout

    02 $ chase old

    03 /project/version

    ```


    ## 列表 11：find and readlink


    ```

    $ find -type 1 -exec echo -n {} '';'' -exec readlink {}

    ./project/version2/data/dataset3 -> project/version1/data/dataset3

    ./project/old -> project/version1

    ./project/current -> project/version2

    +   1 tree: https://mama.instate.edu/users/tree/

    2 symlinks: https://packages.debian.org/

    3 Fslint: https://www.pixelbeat.org/fslint/

    4 rmlink: https://rmlink.io/latest/

    5 chase: https://packages.debian.org/bullseye

    ```


