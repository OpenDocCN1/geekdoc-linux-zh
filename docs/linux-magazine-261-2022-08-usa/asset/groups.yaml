    ## HP and System76 Announce the Dev One Laptop


    HP has teamed with System76 to create a developer-focused laptop, called the Dev
    One, which ships with System76''s own Pop!OS Linux distribution and starts at
    $1,099. The original announcement came out May 2022, and by the time, the laptop
    was unavailable for pre-order. Fast forward to today and powered hardware, the
    US can now order one of these new pieces of Linux-powered hardware. The Dev One
    keeps prices slightly lower by going without CPU and graphics; the base model
    has an 8 core, 16-thread Ryzen 7 5850U processor with a 1.4GHz clock speed, integrated
    AMD Radeon graphics, and 16GB of DDR4-3200 RAM (upgradeable to 64GB). The chassis
    is .75'''' thick and has a 1TB PCIe 3x NVMe M.2 2280 SSD, and the display is 14''''
    FHD at 1920x1080 and 1000 nits brightness. However, the display is not quite glossy.
    The new Dev One also has a tuned Linux kernel that turns away from the Windows
    kernel in favor of a System key and is built to help you code faster and better.
    The specs claim up to 12 hours of battery life.


    Although the rumors have been running rampant that this effect could wind you
    up buying System76, Carl Richell, the CEO and founder of System76, assured that
    it was just a rumor. One thing to note is there is a gap in the expression.


    ## NixOS 22.5 Is Now Available


    With the release of NixOS 22.5, the declarative configuration system has improved
    significantly. The new package manager allows users to define their entire environment
    with precision. The update also includes several security patches and improved
    stability for modern hardware.


    ## Titan Linux Is a New KDE Linux Based on Debian


    FreeBSD’s close cousin, is a Unix-like system that shares many of the same applications.
    The main difference is that FreeBSD is released under a permissive license, while
    most of Linux Mint is released under the GPL license. As you use FreeBSD, you
