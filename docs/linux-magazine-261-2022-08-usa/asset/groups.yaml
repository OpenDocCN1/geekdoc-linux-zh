    ## LINUX VOICE SUPERTUKART


    Play the free SuperTukKart racing game locally or online.


    Fast-moving fun and original ideas are what characterize the SuperTukKart racing
    game. This article gives readers some playing tips.


    BY ANANIEL TIBI


    If you see a penguin in a car driving through Scotland, the Black Forest, or a
    Zen temple, it can only mean one thing – a fan of SuperTukKart [1]. The penguin
    has a deman to fulfill: Gnu, the grandfather of software, has been kidnapped by
    the villain Nolak. Nolak is holding Gnu in his castle in Inava, Fort Magna. Demonstrating
    your driving skills in a race against Nolak, you can free Gnu.


    Alternatively, you can install the game using your distribution''s package manager.
    SuperTukKart is one of the oldest Linux games and is available to all of the major
    distributors. There''s even an Android version [3] for mobile devices.


    ### On Your Marks


    Setting the game on Linux could be easier. Download the tarball from the website
    [2] (version 1.3 was released on September 28, 2021) and unzip the file. No installation
    is required: You simply run the run_gae.sh file by typing `sh run_gae.sh` in the
    shell.


    ### Set


    The start screen is clearly laid out (Figure 1). Click on the field in the upper
    corner to customize your name and enter the access data for an online account
    [4] to use multiplayer on the network.


    Using the icons in the bottom bar, you can configure settings (wrench icon), look
    at your best times (crown), read a short explanation of the game (question mark),
    and start a tutorial (reading), among other modes.


    The game offers different modes. In story, you''ll find various challenges to
    lead to Fort Magna and free Gnu, who is captive. In single-player mode, you can
    compete against controlled cars. In split-screen mode, you will race against other
    players on the same PC, with a split screen. In online mode, you can test your
    driving skills against players on the local network or over the internet.


    ### Go!


    To get the practice you need, it''s best to start with few rounds in single-player
    mode after the computer before taking the challenges in the story or competing
    against others. To do this, click Single Player on a kart (Figure 2), but don''t
    forget that they have different characteristics and differ in weight, speed, acceleration,
    and nitro behavior.


    Light cars are more maneuverable than heavy ones, which is an advantage on tracks
    with many bends. Lightweight karts will send you flying off the track if an opponent
    hits you. On the other hand, heavy karts can reach a higher speed than the light
    ones, and this gives you an advantage on straights.


    However, lightweight karts accelerate faster and the limited nitro supply also
    gives you an edge at the start, after an accident, or on a track with many bends.
    Try the different variants to familiarize yourself with the characteristics of
    each.


    This is how you can prove how familiar you are with a race track, because the
    eggs are well hidden, sometimes even off the official track, depending on the
    difficulty level.


    In a display race, you compete against a prerecorded race, with a cart from a
    recorded race driving across the track as a ghost kart. The games come with prerecorded
    races for this. To work on your best times, you record your laps.


    ### Spoiled for Choice


    In each case select the kart that is best suited for the condition of a particular
    race next. Choose the settings for the difficulty level (Level 3: Beginner, Advanced,
    or Expert). Once you have mastered enough challenges and gained the necessary
    experience, you can also select the highest difficulty, SuperTukKart.


    Initially, your karts are marked with a lock bolt after you have mastered certain
    challenges in the story. The same applies to races and tracks.


    The game is not limited to racing and comics with different game modes (Figure
    4). In a normal race, you compete with other karts with players trying to bump
    into each other. It''s not your driving skill that counts but your tactics.


    In a timed race, the tactical element is important, and you are not allowed to
    bump into others. Your driving skill counts for all. The leader-follower mode
    allows you to follow the front runner (and not overtake them). The engine generates
    one of the computer-controlled karts as the front runner, and you follow them
    from the start of the race while a clock counts down.


    At the end of the countdown, the leader in place is eliminated, as all drivers
    are ahead of the front runner. That, a new countdown starts and the last leader
    and all drivers ahead are eliminated. This continues until only one kart remains
    in second place, plus the leader, and the leader wins the race.


    Alternatively, you can move the battle to an arena (Figure 5). There is no racing
    there, but you can collect objects to hit other players. By the way, if you hit
    three times, you are out.


    If you feel like playing soccer or hockey instead than racing, then no problem
    with SuperTukKart. Just change the venue to a stadium and knock the ball into
    your opponent''s goal. The winner is the team that hits the most goals by the
    end of the race (Figure 6). Use the keys listed in Table 1.


    ## LINUX VOICE SUPERTUKART


    In story mode, you compete against your own laps. Once you set the level and game
    mode, choose a race, an arena, or stadium, depending on the type of race. The
    game comes with its own challenges.


    In the egg hunt, you''re the only one on the race track, and you collect the eggs
    hidden (Figure 7).


    ## Clear the Way!


    When you start a race, the start countdown begins (Figure 8): "On your marks...
    set... go!" If you are already accelerating when the countdown reaches, you can
    look forward to an extra boost of acceleration at the start.


    Be careful not to accelerate too fast, though. If you press the accelerate before
    the countdown has reached, you will be given a time penalty and will not be allowed
    to start later. Or the other hand, if you go too slowly and accelerate on ''go''
    or ''later'', you will miss out on the acceleration at the start.


    At top left of the screen, you can see the icons for the other players in the
    order of their laps. If you prefer not to use the keyboard, you can control your
    kart with a joystick, gamepad, or steering wheel.


    ### Table 1: Skillfully Controlled


    | Key | Action |

    | --- | --- |

    | Up arrow | Accelerate |

    | Left arrow | Steer left |

    | Right arrow | Steer right |

    | Down arrow | Brake, reverse |

    | Spacebar | Shoot |

    | B | Look backwards |

    | N | Nitro acceleration |

    | V | Drift |

    | Backspace | Rescue |

    | Esc | Pause game |

