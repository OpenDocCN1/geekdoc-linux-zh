    在开源生态系统中找到你的位置

    OpenSourceJobHub.com


    ## Zack 的内核新闻


    ### 是 Bug 还是是时候离开了？


    David McColl 想要将一个几乎过时的通用网络文件系统 (CIFS) 1.0 驱动挂载，一个内核 Bug 导致挂载失败。他花费了几个小时通过二分法（bisecting）找到导致问题的具体路径，并发布了他的发现，希望能够找到修复方法。


    CIFS 是微软在 1996 年随 Windows 95 引入的服务器消息块 (SMB) 变体。SMB 是 IBM 在 20 世纪 80 年代开发的。CIFS
    和 SMB 是用于同一网络上其他用户的类似文件系统的协议。


    内核邮件列表上进行了一些讨论，包括 Steve French 和 Ronnie Sallibert 等人的努力，检查 David 的 Bug 在下一个版本中可能出现的回归。


    然而，他们的讨论在一段时间后仍在持续，这引起了 Thomas Levens 的关注，他对比这类回归和其他跟踪表示担忧——“David、Ronnie 和 Steve：现在情况如何？似乎每次调试都在来回反复。取得了什么进展，我刚才错过了什么？”


    David 回复说，他可能没有忘记，并且正在继续使用变通方法（workaround）来访问 CIFS 1.0 驱动。他还在检查每个内核发布以看问题是否已经解决。此外，Ronnie
    提到：“我尝试了，但找不到足够旧的系统来复现。成员们，这是微软在 20 多年前就请求人们停止使用并迁移的身份验证机制。我不确定该怎么说，在一个 20 年前就已宣布过时的东西上，你可以花费这么多时间。”


    Thorsten 回复说，也许最好的解决方案就是简单的撤销 David 发现的还原补丁。Ronnie 评论道：“现在你可能会撤销它。也许在下一个内核中。但在未来不远的内核中，该补丁实现的代码将不再存在于
    linux 内核中，并且无法通过标准 API 使用。到那时，这就不再是撤销补丁的问题了。”


    '
