    # User Interface


    After installation, you will find in Zeit the Tools section of your application.
    If you use the command-approach, you can simply call the program by typing zeit
    with a clear-cut interface without any bells and wheels.


    Debian/Linux, you can use `crontab -e` to edit your tasks. If it''s not installed,
    you can install it from the standard packages using apt.


    In the version you used, the headers are Zeit, Tools, and Help. Below the menu
    you will find such buttons, some of which you cannot enable until you have selected
    a task from the list in the main window.


    Using the buttons, you can copy, modify, or delete tasks or commands. Note that
    alarms are listed in order (Figure 1). Clicking on an object opens a context menu
    where you can choose Copy, modify, and delete the tasks. Please note that Zeit
    immediately reflects the changes to the crontab table. You can also make a backup
    of your crontab at alert at top to avoid any nasty surprises.


    # Adding Tasks


    For recurring jobs, go to Time | Add the Task button, or press Ctrl + A. A dialog
    box opens where you can define the name of your task in detail (Figure 2). In
    the task name field, start by entering the description and the command to be executed.


    Next, specify the time of execution. A simple address allows for every hour, day,
    week, month, or every weeks.


    ![](img/31162a00ee46c5d590c544cb2d944405_32_1.png)


    # Operating Modes


    Zeit runs without user authorizations and does not require root access. You can
    only manage your own crontab. For this, check the box in System | Mode or press
    Ctrl + S. Use the same command to switch to the normal user mode.


    You can also choose Periodic for crontab (one-time jobs) for at, and Environment
    Variables for cron. You can configure this in the View menu or use respective
