    - (3) "To the Colors" by Joe Cas, Linux Magazine, issue 256, March 2022: https://www.linux-magazine.com/issues/252/256/Welcome

    - (4) Timeshift donation: https://tejeteech.com/product/timeshift-donation/

    - (5) Mint Monthly: https://www.linuxmint.com/donors


    George engineered the software for Linux as he moves others to, and Mint stepped
    up.


