    \ /var/testpipe\n```\n\n命名管道可以使用 mkfifo 命令在文件系统中创建。它们保持激活状态直到使用 rm 命令删除。当我们使用管道时，必须手动处理双向工作，而匿名管道会自动完成。\n\
