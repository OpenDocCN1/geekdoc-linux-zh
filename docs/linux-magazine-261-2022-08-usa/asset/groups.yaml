    ### 发行版漫 – Linux Mint

    创新与社区


    ### Linux Mint


    Clement Lefebvre 简要介绍了 Linux Mint 的历史以及围绕该发行版成长的社区。


    *作者：Bruce Bytfield*


    Linux Mint 是三大 Debian 衍生版之一。尽管它始于 2006 年，但 Linux Mint 最初是 Ubuntu 的衍生版，为了那些避开 Gnome
    3 的用户，它以 MATE 的名义分支了 Gnome 2。今天，Linux Mint 也因创新闻名，以及它的滚动更新版本 Linux Mint Debian
    Edition (LMDE) 闻名，这使得其开发者与其社区能够保持独立。在 18 年的生存时间里，Linux Mint 在团队负责人 Clement Lefebvre
    的带领下成长，他花时间专注于 Linux Mint 项目的历史记录。


    **Linux Mint**: Linux Mint 是如何起的？


    **Clement Lefebvre**: Linux 一直是一个爱好。每年我都会参与其中，但与其说它是工作，不如说它一直是我为了消遣时间而玩的某种。我编写软件；折腾发行版；花大量时间与他人聊天。最后，我开始写关于
    Linux Mint 的文章和视频，当要托管这些内容时，我自己创建了 Linux Mint 网站。


    当时，Ubuntu 刚出生两年，但我认为它是那里最好的发行版。我对比了许多发行版，并对哪些可以改进有了非常棒的想法。我开始修改 Ubuntu，并写了相关文章。人们对此感到非常兴奋并提供了反馈。越来越多的人加入进来，它变得更加严谨、更严肃。在
    Linux Mint 2.2 Bianca 发布后，这不再仅仅是一个有趣的实验；目标变成了生产出最好的发行版。


    **LM**: 你对 Linux Mint 的哪些方面感到自豪？


    **CL**: 我认为我最自豪的是我们在过去 16 年里表现出的连贯性。用户使用反馈，我们让人们感到快乐，我们不断成长，从没有把自己重造为某种完全不同的东西，我们不断改进、添加并再次改进，在每个新版本的发布中都进行循序渐进的提升。我们的用户群一直在增长，我们设法每天做到这一点。


    **LM**: 为每个版本维护三个独立的桌面环境面临哪些挑战？


    **CL**: 我们支持其中的三个版本（Cinnamon、MATE 和 Xfce），但它们都是构建在 GTK 之上的。我们使用了在开发、维护和支持我们在所有桌面上运行的核心应用和工具时大量使用的同一套工具包。对我们来说，致力于帮助
    Mint 版本的解决方案非常有意义。XApps 项目就是一个很好的例子，展示了我们如何不是使用不同的编辑器（例如使用三个 PDF 阅读器），而是确保我们使用一套可以在处处运行的核心应用程序，尽可能地偏离
    Gnome 2：它可以进行一点创新，可以改进，但它必须保持 Gnome 2 的特性。


    Linux Mint。我们是一个团队。我们知道自己是谁，也知道用户喜欢什么；这才是最重要的。如果你问 Mint 用户为什么他们想要 Linux，我想他们会告诉你所有的需求。也许情况恰恰相反；也许是反过来。


