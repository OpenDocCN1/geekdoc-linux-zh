    \ comprehensive and complicated and has been designed to be used with some of\
    \ continuous integration systems on every deployment. As a result, the whole project\
    \ might be overwhelming for non-DevOps users. Artillery has plenty of features\
    \ for any of us. This is particularly true of the latest release, which adds a\
    \ very useful command that could really be its point and that almost anyone merging\
    \ with Linux will find useful. The full content of artillery probe, and it's brilliant\
    \ for testing both your local network performance and any of the websites you\
    \ want to ping or curl. A crude and simple method of testing for their availability\
    \ and performance is to use curl. Curl is powerful and can be used to append to\
    \ any HTTP request to give you some indication of response. All of this can be\
    \ replaced by Artillery with the probe argument. It takes a dummy name and returns\
    \ the time it takes to perform several steps: 1) the initial DNS lookup, 2) the\
    \ connection, 3) the handshake, 4) first byte transferred, and 5) transferring\
    \ the site content. All of this is shown in a text result.\n\nThe latest version\
    \ of Artillery with the probe command can be installed via `npm install -g artillery`.\n\
    \nMost importantly, probe can also send and receive all of HTTP requests, just\
    \ like curl, but using JSON for format. This makes it much more practical than\
    \ using REST API calls which can be integrated into curtain tools, making it easier\
    \ to parse files containing JSON.\n\n## Project Website\n\nhttps://www.artillery.io/\n\
    \n## Network monitor\n\n### GOSNIFF\n\nKeeping with the command-line tools that\
    \ improve the experience of more established and advanced users, GOSNIFF is a\
    \ great tool inspired by the difficulty to use tcpdump. To analyze a network you\
    \ need to know what you want to accomplish and how. This isn't easy. You need\
    \ to know which network device to use and which ports you want to monitor, for\
    \ instance. With GOSNIFF, its menu-driven interface is as easy to use as ever.\
    \ When first launched, you're presented with the devices and interfaces of yours\
    \ that it can connect to, usually with the network device already selected.\n\n\
    You need to know which interface to choose, a virtual pseudo device to be selected\
    \ that monitors everything, but this could potentially include USB and D-Bus traffic.\
    \ You need to define a filter, and this can be complex in every detail. GOSNIFF's\
    \ optimal filter is pre-filled with a tag and port 80 for web traffic which you\
    \ can modify for other ports and protocols. With the configuration of it, you\
    \ can start to initiate the monitoring process. Now, when a network packet is\
    \ selected that meets your filtering and device criteria, it's displayed on the\
    \ right, like Wireshark. This is no consideration-the filter section accepts exactly\
    \ the Berkeley Packet Filter (BPF) syntax, but there's no further option to dive\
    \ deeper into the packets. \n\nIt's not obvious, but the nature of GOSNIFF is\
    \ inspired by the Go programming language and uses its function pointers to serve.\
