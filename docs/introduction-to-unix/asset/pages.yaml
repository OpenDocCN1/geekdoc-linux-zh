  md: '# Editing in vi


    Replace n with an actual number. For example, the command "nh" moves the n spaces
    to the left in a single action. The only limitation is that the cursor cannot
    be moved beyond the beginning or end of its current line with left or right movement.
    To move away from the current line, the cursor must move up or down.


    With these complex commands, it is nearly as easy to navigate a text file in vi
    as it is to navigate a document in a word processor. Many users find that working
    with keystroke commands is actually faster, since their hands never have to leave
    the keys to reach for a mouse. Word processors use keystroke combinations as well,
    and some people find themselves using keystrokes instead of mouse clicks, even
    in other operating systems.


    # Editing in vi


    # Copying and Pasting


    One of the most common editing tasks is to copy and paste. In this action, the
    user selects a chunk of text, copies it from the screen, and reinserts it into
    another location. In vi''s specialized terminology, copy and paste is known as
    "yank and put." The concept behind this name is that, when a user removes (or
    yanks) a chunk of text from the file, the chunk is put into a register. The when
    the user has found the new location for the text block, the block is copied from
    the register and put in the correct place.


    To yank and put, place the cursor at the start of the text block you want to move.
    Determine the number of lines to yank and enter the command ny, where n equals
    the number of lines to be yanked. The text on the screen will not change, but
    the specified lines have been copied into the register. Next, move the cursor
    to the location where the text will be inserted and issue the command p. The text
    appears to the right of the cursor location. This is the most basic way to yank
    and put. Table 7.4 shows some additional commands


    # Deleting Text


    In the yank and put process described in the previous section, the yanked text
    does not disappear. With vi, yanking text and deleting text are separate actions,
    and each action must be performed in order to complete your edit. Deleted text
    does not go into a register, so you will lose any text which is deleted. Deleted
    text cannot be placed back into the file except with the restore option, which
    will restore the most recently deleted text string. Therefore, be sure that you
    have edited the file with yank and put to save any text you want to move before
    you begin deleting. Table 7.5 shows the deletion commands.'
