  md: '# CHAPTER 11 Networking II: Fundamentals of Unix Networking


    You should get the same output that you got the first time you pinged that machine.


    You now have a fully functional LAN. If your needs were as simple as sharing data
    among the three computers, you could stop working. However, most people want to
    connect their small networks to the Internet. This is where the fourth computer
    comes into play:


    Connect one of the NIGs in the fourth computer to the hub with a length of Category
    5 twisted-pair cable. Connect the other NIC to whatever is being used for the
    Internet connection: a modem, a cable modem, or Ethernet wall jack, etc. Designate
    the eth0 interface used to connect to the external network and assign it the "real"
    IP number given to you at the start of the project:


    ```

    ifconfig eth0 xx.xxx.xxx.xxx

    ```


    The other NIC, which is attached to the hub, receives the designation eth1. You
    can assign it an IP number in your 192.168.range:


    ```

    ifconfig eth1 192.168.1.100

    ```


    Ending the IP number with 100 distinguishes the gateway machine from the other
    regular machines on the network.


    Now that all machine interfaces are configured and IP numbers assigned, you can
    set up basic routing. On the gateway machine, issue the command


    ```

    route add default eth0

    ```


    This is somewhat different from the routing command discussed earlier in the chapter.
    In this instance, this machine is intended to function only as a gateway, the
    default route identifies the ethernet device connected to the external network.
    The device connected has its own route created when the interface was configured.


    Because this is a Linux-based network, you can set up IP masquerading. This is
    a useful function that allows the PCs on the network—even though they don''t have
    "real" IP numbers—to use the Internet. To the outside world, it will appear that
    all the signals from this LAN are coming from the gateway machine, but the gateway
    will know which internal computer sent which signal and route the appropriate
    response to the correct computer. Issue the command


    ```

    modprobe iptable_nat

    ```


    at the shell prompt. This command loads the kernel module that enables masquerading.


    ```

    iptables -t nat -A POSTROUTING -o ppp0 -j MASQUADE

    ```


    This command sets up the networking rules for masquerading on the gateway machine.
    Finally, issue the command


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    to turn on IP forwarding, which is a necessary component of IP masquerading.'
