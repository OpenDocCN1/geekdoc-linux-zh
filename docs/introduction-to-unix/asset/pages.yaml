  md: '# Internet Applications


    # IN THIS CHAPTER


    +   1. Electronic Mail

    2. Electronic mail clients

    3. The World Wide Web

    4. Web browsers

    5. USENET News

    6. News readers


    The first eight chapters of this text provided an introduction to Unix itself
    and to the basic commands and programs which allow the user to begin work on a
    Unix machine. The next three chapters introduce Unix networking, the element that
    makes Unix so powerful and seamless across groups of computers, whether a small
    network of two or three machines that make up the Internet.


    Much of the software that contributed to the development of the Internet was developed
    on Unix mechanisms. Because of this, Unix''s networking features have been an
    integral part of the operating system for many years. In contrast, Windows95 was
    the first version of Microsoft Windows to contain integrated networking functions.
    At their core, personal operating systems are just that: personal. Networking
    is an adjunct to normal single-user focus. Under Unix, however, networking is
    an essential component of the operating system. Many of the mechanisms are used
    to work on a single machine as are used to work on machines across a room or across
    the country; whether you are logged in remotely or sitting at the machine, the
    same commands are used to move through directories, use text-based applications,
    and other regular tasks.'
