  md: '# CHAPTER 9 Internet Applications


    In addition, it is often possible to configure these programs with mail server
    information so that there is no need for a program like fetchmail. Of course,
    these programs can also be configured to read mail from a local directory which
    is supplied by fetchmail.


    Most graphical mail clients operate more or less the same way, so only one program
    is described here. Should you have access to a different graphical mail client,
    take this description as an example and use the program''s documentation and help
    files to learn how to work with your specific software. If you have ever used
    a graphical mail client under Windows or on a Macintosh, you already know the
    basics of the analogous mail program under Unix. Graphical mail clients include
    KMail, Balsa, Netscape Mail, and Ximan Evolution, though there are many others
    in Unix software archives.


    The graphical mail client described in this chapter is KMail, which is the native
    mail client provided with the KDE graphical desktop environment. The current version
    at the time this book was written is 1.29, but the program is under active development;
    future versions may differ in the specifics of their commands or operation.


    We assume that you are using the KDE desktop and that KMail is installed. KMail
    can be started in one of three ways: click the KMail icon on the desktop, select
    the KMail entry in the Start menu, or open a terminal window and issue the command


    ```

    kmail

    ```


    at the system prompt. The editor appears, as shown in Figure 9.5.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_150_0.png)


