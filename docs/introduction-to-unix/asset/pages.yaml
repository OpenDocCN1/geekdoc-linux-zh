    Although Unix can be used on a stand-alone computer, it is particularly effective
    on a network. A network of computers can manage data flow in one of several ways:
    a local area network, a wide area network, or an internet. LANs are small groups
    of machines wired to each other; a WAN is usually a network of LANs connected
