    # Monitoring Directories and Devices


    There is a conceptual hole in this explanation. If the user does not need to know
    where the file is located, but the file must be found in order to mount, how the
    operating system resolve the path name to the actual position of the data? After
    all, if the user does not have to know where the file is stored, the operating
    system does.


    Under Unix, this problem is solved through mounting. When a device or directory
    is mounted, it is made available to the network. Thus, if the device hdal is not
    mounted, none of the data on device can be used even if a user issues the correct
    pathname. The operating system will return a "File not found" error.


    Local devices must be mounted like remote devices. Local devices are mounted during
    the boot-up process, as part of the ordinary configuration of the system. Remote
    devices, including disk partitions, can also be mounted automatically. If, for
    example, you frequently use database on a remote partition, you could configure
    the operating system to mount partition when the computer is started. Users would
    be able to access database without having to mount the partition themselves.


    # Monitoring Local Partitions


    Unlike disk partitions, a particular device can be mounted or unmounted repeatedly
    during an active session. This is an easy process, and many users and administrators
    choose to mount some devices when only when they are needed and unmount them when
    they are. This falls under the theory that the fewer running processes on the
    machine, the faster the machine and the fewer problems that might occur.


    To mount a device, you must first create a mount point where that device will
    be placed within the filesystem. Mount points are empty directories, which take'
