    # Managing Output


    Managing output from multiple processes is usually an issue for interactive processes.
    In those cases, the program halts until the user provides the necessary response
    to restart the program. With non-interactive processes, however, the program does
    not rely on continuing information from the user. When background non-interactive
    processes generate output, that output may interfere with output from the foreground
    process.


    The easiest way to solve this is to redirect the output from the background process.
    As explained in Chapter 3, Understanding Unix Commands, output can be redirected
    to a text file where it may be read or worked with at a later time. In order to
    redirect output from a background process, use the redirection operators described
    in Chapter 3 along with the ampersand character, to force a process into background
    operation. That is, issue the command as


    ```

    command > redirected-output-file &

    ```


    # Moving Jobs between Foreground and Background


    Identifying jobs and processes is the key skill needed to work with multiple processes
    at once. Using the top, ps, and jobs commands provides the information necessary
    to move processes between the foreground, and the background, where they can be
    worked interactively, and they can run without interruption. Many programs move
    themselves between foreground and background, especially those programs which
    require input before continuing their work, administrators must move processes
    well during their routine tasks.


    In order to move a process from the foreground to the background, you stop the
    process so that the shell prompt will return. To stop the foreground'
