    # The if-then-elif-else Construct


    If there are more than two possibilities for a given scenario, there is another
    construct which allows for simpler programs. Of course, the programmer can stack
    multiple if-then or if-then-else constructs, but an unspoken goal of programmers
    is to find the most elegant and brief program possible. The elif statement adds
    another layer of complexity to the conditional flow control structure.


    The elif statement provides an alternative possible value for the variable. In
    a program, it extends the range of outcomes; if Condition A is not met, the elif
    statement defines a possible Condition B which has its own outcome. If Condition
    A or B is met, the program provides the outcome defined in the then statement.
    In action, the elif statement looks like this:


    ANIMAL="horse"


    ```

    if [$ANIMAL = "horse" ]

    Then

    echo "The horse condition has been met"

    elif [$ANIMAL = "dog" ]

    then

    echo "The dog condition has been met"

    else

    echo "The condition has not been met"

    fi

    ```


    The programmer can include as many elif statements as are needed to manage the
    possible desired values. The else statement is not required, but pro'
