    #  What the Prompt Tells You


    Among many other options, the bash prompt can display the time, date, current
    directory, name of the user, name of the machine, and device name. It can also
    provide identifiers for commands or various processes currently managed by the
    shell. The appearance of the prompt will change, depending on the elements configured
    by the user or by default.


    In all cases, though, the last character of the bash prompt will be the dollar
    sign $. More precisely, the dollar sign is usually the last character of the prompt
    if you log into a regular user account. To keep the superuser account noticeably
    distinct from user accounts, the final character for the superuser''s bash prompt
    is usually the hashmark, or # character. Although it is possible to change the
    final character of the prompt, most people choose not to do so because it is useful
    to keep the two accounts separate as a reminder.


    # Anatomy of a Command


    The majority of Unix commands follow a general format. There are exceptions either
    syntax or options take an unusual format, but such commands are relatively infrequent
    and easy to memorize. The common syntax for Unix commands is


    ```

    command option(s) argument(s)

    ```


    Both components of the command are important for proper execution; while you can
    issue the command alone, not all programs run without options, and many do not
    provide useful information without the appropriate arguments.


    # The Command Word


    The command word is the name of an installed shell command or the name of a program
    installed may be an abbreviation, such as "sh" for the Bourne shell, or may be
    the complete name, as in "date" to see the system date and time. Because there
    is no systematic way to name commands, it may be difficult to find the appropriate
    command when you have not used it before. A good compendium is a useful investment
    for those who plan on doing a lot of work with Unix; for those who are casual
    users, a dictionary like the one in Appendix B may be sufficient for most needs.


