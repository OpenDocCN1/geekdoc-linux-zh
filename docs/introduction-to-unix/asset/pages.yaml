    # System Security


    Whether you are administering a large network with thousands of machines

    or a Linux network in your home, you should be concerned about secu-

    rity. The news brings a new story of security breaches almost every week,

    the relatively amusing re-design of some else''s Web pages to the technical

    comprehensive spying on a competitor''s network or in the government

    files of another nation. Security is big business, with hundreds of firms provid-

    ing software and consulting making networks safer.


    While it is possible to spend hundreds of dollars on security,

    there are habits which even the smallest network can establish. Security

    is as much as a mindset as it is a program or piece of hardware. Administrators

    keep security in mind at all times make better decisions and run tighter

    networks. In these times, it''s rare to find an administrator who doesn''t

    think about security at all.'
