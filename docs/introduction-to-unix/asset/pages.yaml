- img_proc: true
  md: 'Distinct identities also allow users to customize their working environments.
    User accounts have personal versions of the configuration files described earlier.
    These configuration files control the behavior of certain programs, such as the
    shell. An individual user can change things about these programs to suit his tastes,
    but his changes will not affect any other users on the machine. For these users
    who prefer not to make changes, the system-wide default configuration will still
    apply, but changes to personal configuration always override the system default.


    # The Superuser


    Every Unix system has a special account called the superuser or root account.
    This account has the user name “root,” and is the account that is used to manage
    everything about the system. The superuser account is all-powerful. It can read,
    write, or execute any file on the system, including users’ private files. It can
    run any program installed on the machine, including those installed in user accounts.
    It can create and delete accounts, alter account settings, and install or delete
    any type of software. In short, the root account can do anything that is possible
    on a Unix system.


    The superuser account was created for the unique requirements of system administration.
    The person who manages a Unix system must be able to access every file on the
    machine immediately, and cannot be hampered by file permissions. The superuser
    is also ultimately responsible for all files on the machine; should a user place
    illegal or invasive files in his account, such as a virus or account-cracking
    program, the superuser must remove it or be liable in legal action.


    If you install a Unix variant on your own personal computer, you will own the
    superuser account. The account is created when the operating system is installed,
    and the person installing the operating system selects the root password. The
    root password is the most important and sensitive piece of information about any
    Unix system. If someone figures out the root password, he has complete access
    to your machine and, to any network connections or hardware devices attached to
    it. He can even change the root password, effectively locking you out of your
    own system.


    Never use the superuser account for regular work, such as reading and sending
    e-mail, posting to USENET groups, or daily tasks. If you are logged in as the
    superuser, your actions are powerful; it is all too easy to delete an important
    file inadvertently, or to damage your system. It is also tempting to see what
    your users are doing in their accounts, even if you have a legitimate reason to
    Snoop. Always create a normal user account, or two, for regular and personal use.


    For those who do not run their own Unix machines, as students with accounts on
    a school Unix system, it is unlikely that root access will ever be available.
    In these cases, the root account will be held by the system adminis'
