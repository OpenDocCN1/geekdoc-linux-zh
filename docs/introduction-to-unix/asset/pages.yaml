    readers are more powerful, and many users prefer to use a text-based reader even
    if they use graphical programs for all other Internet applications. However, if
    you use an integrated Internet application like Netscape, which offers both an
    e-mail client and a news reader, you may choose to stay with the single program
    rather than learn an additional application.


    The trn news reader is very popular, and is easy to learn. Start it by issuing
    the command


    # trn


    at the shell prompt; the program appears as shown in Figure 9.9. The first time
    you run it, it will show you the groups selected by your system administrator.
    If your administrator has not configured a list of groups, trn will show you no
