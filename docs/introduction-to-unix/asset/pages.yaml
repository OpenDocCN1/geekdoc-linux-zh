    ```


    pwd does not take arguments.


    # Moving Around the File System


    There are many other places on the machine beyond the home user directory. Some
    of these locations are administrative directories which may not be accessible
    to the average user, while other directories may contain files and programs which
    are available for use by any who wants to install them in their home directories.
    Moving between directories requires certain command syntax, once mastered, offers
    a large amount of flexibility with a minimal number of keystrokes.


