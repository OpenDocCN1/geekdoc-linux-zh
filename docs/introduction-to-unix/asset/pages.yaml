  md: '# What is a Variable?


    they must begin with a letter or with the underscore symbol _. Names may contain
    only alphanumeric characters or the underscore. No other symbols may be used;
    in fact, the underscore is only used in special circumstances.


    Although these are the basic rules for variable names, there are other conditions
    which are common practice. Variables are usually named with uppercase letters,
    as in VARIABLE. This makes the variables easy to see when scanning a large chunk
    of program code. Also, variable names are usually descriptive. That is, the variable''s
    name indicates its function, as in LENGTH or NAME. A variable named FILESIZE is
    generally considered better than a variable


    # Variable Types


    The most common type of variable used in shell programming is the scalar variable.
    A scalar variable is a single piece of information. Scalar variables can be a
    number, a letter, a word, or a group of words (a string). The key to understanding
    a scalar variable is to understand that the entire value of a variable—no matter
    how many characters or words it contain—is interpreted as a single datum. If you
    use a text string containing several words as the value of a scalar variable,
    you cannot treat each individual word as a separate element within the program.
    The string, as a whole, is the value of the variable.


    In contrast to the scalar variable, another common variable type is the array
    variable. An array is a variable that can hold a number of different values. These
    values are identified by an index number, which can be part of the variable name.
    For example, the array variable ANIMALS might hold the values "dog", "fish", and
    "horse". To refer to any single one of these values within a program, you need
    to refer to its index number, which is assigned when a value is added to the array.
    Thus, the


    ```

    ANIMALS[0]="dog"

    ANIMALS[1]="fish"

    ANIMALS[2]="horse"

    ```


    would be to define the set of values which make up the total value of the ANIMALS
    array variable. (Remember that, under Unix, counting begins with zero.)


    Before an array variable can be used for the first time or be given values like
    the ones above, it must be declared. In order, you must tell the shell explicitly
    that you are creating an array variable. Do so with the declare command and the
    -a option, as in


    ```

    declare -a ANIMALS

    ```


    You can then assign values to this variable name.'
