    There are three options for declare:


    +   - i The variable is an integer

    - r The variable is read-only

    - a The variable is an array


    This command can only be used to declare variable types in bash version 20 or
    later.


    # diff


    The diff command is used to compare the contents of two named files. The differences
    between the two will be printed to the standard output. diff takes the syntax


    ```

    diff <file 1> <file 2>

