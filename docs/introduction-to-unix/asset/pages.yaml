  md: '# Abbreviations and Macros


    replace it with the string "Unix." This is much faster than reading through the
    entire essay, hoping to catch every abbreviation, and it is far more accurate.

    Table 7.6 contains the search and replace commands.


    # TABLE 7.6: Search and Replace Commands


    | Command | Function |

    | --- | --- |

    | /<pattern> | Searches forward from the cursor for the defined pattern |

    | ?<pattern> | Searches backward from the cursor for the defined pattern |

    | :s/<pattern1>/<pattern2> | Replaces the first instance of <pattern1> with the
    string <pattern2> |

    | /s/<pattern1>/<pattern2>/g | Replaces all instances of <pattern1> with the string
    <pattern2> |


    It is easy to construct the appropriate command for a search and replace operation.
    In the example given in the previous paragraph, issue the command

    :0/os/un/Unix/g

    to change all the instances of "un" to the appropriately capitalized name.


    # Abbreviations and Macros


    While the yank, cut, search, and replace tools are valuable vi functions, they
    may not be enough when working with complex files. vi offers two features which
    help to automate the most tedious of documents, such as a lengthy script or configuration
    file. This section introduces abbreviations and macros, two vi tools which streamline
    work with text files.


    An abbreviation is a shortcut which represents a longer character string. Just
    as the nickname "Sue" is a representation of the longer name "Susannah," vi allows
    you to type a shorter phrase to represent a longer word or combination of words.
    In some way, a macro is a short command which stands in a longer command or string
    of commands. Instead of typing the entire sequence with one command, create a
    macro which will handle the entire sequence with one command.


    # How to Create an Abbreviation


    To create an abbreviation in vi, use the :abbr command. This command uses the
    syntax


    ```

    :abbr abbreviation complete-phrase

    ```'
