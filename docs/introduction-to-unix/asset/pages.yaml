  md: '# The /sbin Directory


    The /sbin directory is the common home of a certain subset of executable binary
    files. These programs are usually intended for administrative purposes. For example,
    the programs used to configure network connections are usually stored in /sbin.


    # The /tmp Directory


    The /tmp directory is a catch-all location for temporary files. If you do not
    have enough room in your home directory for a large file, you may be able to store
    it in /tmp. Do not rely on this possibility, though, as system administrators
    clean out /tmp regularly to improve system performance. Learn any policies about
    using /tmp before you move files into that directory. Some programs also create
    temporary files as they work, and those files are kept in /tmp until they are
    deleted by their parent program or by system administrator.


    # The /usr Directory


    All directories on a Unix system, the /usr directory probably varies more in its
    use than any other. In general, it is used to house files which pertain to activities
    of system users. /usr often contains several subdirectories: /usr/local contains
    user-application software; /usr/local/bin contains binary executables for user-level
    application software; /usr/local/etc contains configuration files for user-level
    application software. In addition, some systems place the home directory as a
    subdirectory of /usr.


    # The /var Directory


    The /var directory is a repository for files which will vary in size. System logs
    are the most common example of such files, as they grow or shrink depending on
    the data being tracked and the rate at which they are configured to delete old
    data. Other files which vary in size might be incoming files on a file server,
    USENET feeds, or network administrative data. The /var directory is often configured
    with a hard limit on the amount of space it is allowed to occupy. With this restriction,
    files in /var cannot grow so large that they overwhelm the system and cause an
    operating system crash.


    The Unix file system is the landscape of a given machine. Users and administrators
    navigate through the file system as if it were a physical place, using maps and
    markers to identify locations. A file can take many forms, ranging from human-readable
    text to symbolic constructs intended for programming. Files are organized into
    directories, which may contain other subdirectories and which themselves are probably
    nested in parent directories. Every file has a unique identifier called the path
    name, which states the entire set of directories which contain the file. Access
