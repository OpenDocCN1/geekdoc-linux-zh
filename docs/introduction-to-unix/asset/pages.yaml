  md: '# 213


    This is particularly useful when searching for an entry in a file that may contain
    many iterations of the same text string, perhaps has a user name.


    The caret character, ^, matches the beginning of a line. Thus, when you use the
    caret at the start of a regular expression, it limits the match to strings that
    appear at the beginning of a line in the file. Even if the exact string is matched
    elsewhere in the input dataset, grep will not return a valid match unless the
    string is at the beginning of a line.


    ```

    ^[H]horse

    ```


    will match the strings horse or Horse if they are at the start of a line. Any
    other horse strings within the text will be ignored.


    Likewise, the dollar sign character, $, represents the end of a line. Thus, the
    expression


    ```

    [H]orse

    ```


    will match the strings horse or Horse only if it is the final string at the end
    of a line. Other matching strings will be ignored, as the caret character. While
    the caret is more useful than the dollar sign in matching strings, the $ can be
    helpful in particular situations. Imagine, for example, that you had created a
    user group with the group ID 2834. Because this was the last group you created,
    it would be at the end of every group listing for individual users. Simply search
    for that value with the dollar sign to identify users with that associated value.


    The two meta-characters can also be combined. If you issue the expression as


    ```

    ^[H]horse

    ```


    grep searches for this string, but will return a positive match only if the string
    appears both at the beginning and end of the same line. That is, the pattern matches
    only when horse or Horse is the only value on a given line.


    # Anti-meta-noncharacters


    The final pattern matching operator with the grep command is the backslash, \.
    The backslash is used to turn off the pattern-matching behavior of whatever character
    follows the \. This is necessary for any pattern which requires the literal value
    of a character which is normally used as a pattern-matching operator. For example,
    if you wanted to match a value which contained a dollar sign, as in the price
    value $24.99, you would need to use the combination of \$ to represent the dollar
    sign. Otherwise, the expression would mean "find the text string 24.99 at the
    end of a line.")


    List all the lines with dollar values in a file named price.txt, you might issue
    the command


    ```

    grep \$[0-9][0-9]\\.[0-9] price.txt

    ```'
