    This alias means that every time someone on the system invokes the rm command
    to delete a file, rm will run with the -i flag. This causes rm to prompt for confirmation
    that the file really be deleted, and is a common safety precaution. This alias
    can be found in many system-wide run files. Aliases may be set system-wide or
