  md: '# CHAPTER 17 Best System Administration Part II


    universal, however, and you should always be on the lookout for any places where
    an individual package''s installation procedure differs from what is described
    below. Wherever the two processes do not correspond, the procedure described in
    the package''s documentation always takes precedence over these more general instructions.


    # Configuring the Installation


    Many software programs come with a customized shell program called configure.
    Configure, setup, or something similar. The INSTALL document will tell you what
    the program is called. Be sure that you are in the package directory


    ```

    ./configure

    ```


    If necessary, replace “configure” with the actual name of the program.


    The configuration program does not usually require user input. However, some versions
    are interactive, and you should be prepared to supply required information if
    necessary. Also, some configure programs take arguments if you want to enable
    options that should be compiled into the program. Here again, the documentation
    will tell you what those options are. Most of the time, however, you can just
    run the program and it will handle itself appropriately. The configure program
    will check for your compiler, the required libraries, and other important elements
    needed for successful installation.


    # Compiling the Software


    Once the configuration program has run (or if there is no configuration for this
    package), you are ready to compile the program. This is normally a simple process.
    Issue the command


    ```

    make

    ```


    at the shell prompt. The make program uses the output of the configuration program,
    as stored in a new file called Makefile, to direct the action of the C compiler.
    At this point, the compiler will begin its work. You will probably see a number
    of messages scrolling over the screen as the program compiles.


    Depending on the size of the software package and the speed of your computer,
    this process can take anywhere from a few seconds to few hours or more. If the
    compilation seems to be taking a long time, there is little that you can do to
    speed the process. Some software packages go as far as to suggest you go have
    some coffee at this point.


    Once the compilation is finished, you will have a working piece of software, provided
    that nothing has gone wrong. If some problem has occurred, you should see error
    messages generated by the compiler. These messages can give you very useful clues
    about the problem might have been. You may be missing a library or have a necessary
    shell program installed in an'
