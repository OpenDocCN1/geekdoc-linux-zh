  md: 'compare a given variable''s value with values that were selected before the
    script was run, or with the values of other variables. The result of this comparison
    can then direct the way in which the program executes. A process is called flow
    control because it is designed to control the path which the program takes while
    it executes; it, the way in which the program “flows.”


    There are two types of flow control. Conditional flow control, the subject of
    this section, is the type of construct which directs the computer to execute a
    section of code if a certain condition is met. The other type of flow control
    is iterative flow control. Iterative flow control directs the computer to execute
    a section of code repeatedly, or to iterate the section, unless or until a certain
    condition is met.


    At this point, you might be confused. How is it that both conditional and iterative
    flow control handles the ways which must be met? This is an unfortunate piece
    of linguistic overlap. The important thing to keep in mind is that conditional
    flow control is designed to execute a given section only once, whereas iterative
    flow control is designed to repeat a given section of code over and over until
    the specified condition is met.


    # # The if-then Construct


    The main feature of conditional flow control is the if statement. “if” is a command
    that informs the shell of a decision which must be made. An if construct takes
    the general form of


    ```

    if <some condition>

    then

    <something happens>

    fi

    ```


    The term “fi” at the end of the statement is simply the word “if” spelled backward.
    It denotes the end of the conditional section.


    This sample illustrates how a conditional flow control statement works. Says If
    <some condition> is met, execute all the commands between the words “then” and
    “fi.” If the condition is not met, the commands between “then” and “fi” will be
    skipped, and the program will jump to the command immediately following the word
    “fi” and continue to execute.


    A more concrete example of an if statement would include actual conditions and
    consequences, as in


    ```

    ANIMAL="dog"


    if [ $ANIMAL = "dog" ]

    then

    echo "The condition has been met."

    fi

    ```'
