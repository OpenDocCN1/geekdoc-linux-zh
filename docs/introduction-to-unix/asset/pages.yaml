  md: '# CHAPTER 7 The vi Editor


    Assume that you attend Midvale Community College and that you must write a set
    of minutes about the Midvale student council''s meeting. To save time, you would
    like to abbreviate Midvale Community College as "mcc" and Midvale Community College
    Student Council as "sc". To make these abbreviations,


    ```

    :abbr mcc Midvale Community College

    :abbr sc Midvale Community College Student Council

    ```


    The judicious use of abbreviations can save time and keystrokes, but using abbreviations
    requires some thought. vi cannot tell the difference between the intentional use
    of a word and an abbreviation, so choosing a common word as an abbreviation may
    cause inadvertent error. For example,


    ```

    :abbr an Angela Bonpensiero

    ```


    would set the "an" as an abbreviation. Any time the "an" was typed in a text file,
    vi would substitute the text string "Angela Bonpensiero". Such an abbreviation
    might cause a sentence like this: "It was Angela Bonpensiero unusually rainy day,
    so I went to Angela Bonpensiero ATM to get some cash I could buy Angela Bonpensiero
    umbrella.",


    # How to Create a Macro


    Just as an abbreviation is shorthand for a longer word or phrase, a macro is shorthand
    for a longer command or string of commands. Suppose that you want to edit a series
    of old letters to use them for a new purpose. Because the letters are long and
    there are a number of them, it would be a bad use of time to retype all. However,
    to make the letters applicable, a number of strings must be found and replaced.
    For example, every instance of "boys" must be replaced with "children" to make
    the letters more inclusive.


    Instead of issuing the command


    ```

    :os/boys/children/g

    ```


    for each letter, create a macro to simplify the process. Assign a particular keystroke
    combination to that macro, such as "kids". When vi recognizes the combination,
    the associated command executes.


    Create this macro using the :map! command, which takes the syntax


    ```

    :map! keystroke-combination replacement-text

    ```


    as in'
