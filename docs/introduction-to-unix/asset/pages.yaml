- img_proc: true
  md: '# CHAPTER 10 Networking Introduction to Unix Networking


    before security was such a critical concern. It will be many years before the
    programs completely fade from regular use.


    # telnet and rlogin


    The telnet and rlogin programs are used to establish a simple interactive connection
    between a single local machine and a single remote machine. The command is issued
    with a full machine name as the argument, as in


    ```

    telnet somachine.bigcc.edu

    ```


    or


    ```

    rlogin somachine.bigcc.edu

    ```


    The program returns with a login prompt, just if the user was logging into the
    machine locally; of course, this assumes that the remote machine accepts telnet
    connections and that the user has an account on the remote machine. Should the
    remote machine not accept telnet connections, the process will hang without completion
    or the program will return a "Connection denied" message.


    After the user enters his name and password, he will be taken to a shell prompt.
    At this point, working with the remote machine is different from working locally.
    The same commands and programs can be used, assuming they are installed on the
    remote machine, and files can be managed in the same way. Commands issued to this
    prompt affect the remote machine, not the local machine. To affect the local machine,
    the user must suspend the telnet or rlogin process and get a local prompt.


    The only difference between a task on the local machine and one on the remote
    machine is that commands given to the remote machine must travel along the electronic
    pathway between the two computers. Depending on how far apart these machines are,
    the amount of traffic on the network, and how many hops (intermediate machines)
    the data must take, the connection may be nearly instantaneous or may lag by several
    seconds. The connection will persist until the user logs out of the remote machine.
    Upon logout, the telnet or rlogin process exits, and the user is returned to the
    local shell prompt.


    For all purposes, telnet and rlogin are synonymous.


    > Note:


    # rsh


    The rsh program allows the execution of a single shell command on a remote machine.
    rsh is an acronym for remote shell. Unlike a telnet or rlogin process, an rsh
    process is not interactive. Therefore, the command invoked by rsh can not be an
    interactive process: for example, a text editor or Lynx Web search. Any noninteractive
    shell command can be used, though.'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'To invoke rsh and execute a command remotely, you must construct a complex
    command. rsh takes the syntax


    ```

    rsh remote.machine.name -l username command

    ```


    as in


    ```

    rsh somemachine.bgcc.edu -l bjones w

    ```


    The user is prompted for a password. If the correct password is provided, the
    command is executed. In this case, the command produces a list of users logged
    into the remote machine. as soon as the command has been sent and the connection
    closes as the output received on the local machine''s standard output


    If a remote machine does not accept telnet or login connections, it is unlikely
    that it will accept rsh connections.


    # rcp


    The rcp program is a file transfer utility. With rcp, a user can copy a single
    file from one machine to another without actually logging into the other machine.
    The command takes the syntax


    ```

    rcp remote.machine:/path/remote-file /path/local-file

    ```


    to copy a file from the remote machine to the local machine, and the syntax


    ```

    rcp /path/local-file remote.machine:/path/remote-file

    ```


    to copy a file from the local machine to the remote machine.


    Thus, the command


    ```

    rcp pub.bgcc.edu:/home/bjones/.elmrc /home/bob/.elmrc

    ```


    copies the .elmrc file from the user account on pub.bgcc.edu to the bob user account
    on the local machine. Note that the user must know the bjones account password
    to transfer this file, and must have permission to write files to the bob account
    in order to complete this command.


    ```

    rcp /home/bob/.elmrc pub.bgcc.edu:/home/bjones/.elmrc

    ```


    would do the opposite, moving bob''s.elmrc into the bjones account.


    # A Security Note


    Despite developer attempts to add security features to these programs, they have
    fallen out of favor on most networks. These days, it is difficult to find machines
    that permit incoming connections from these four programs. You should not be surprised
    if attempts to connect with these programs fail.'
