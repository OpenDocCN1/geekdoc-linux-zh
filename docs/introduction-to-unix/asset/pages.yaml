    # The World Wide Web


    In the past years, the World Wide Web has exploded in popularity. The Web was
    developed by Tim Berners-Lee in the late 1980s as a way to share files and data
    without having to download individual files or use a primitive filessharing program
    called Archie. In addition, the Web made possible to share photos, sound files,
    and other file types integrated into a single document.


    Although the Web and the software which supports it were developed in a Unix environment,
    the development of a graphical Web browser for Unix lagged behind the development
    of similar programs for Windows and Macintosh. In recent years, programmers have
    focused on Unix graphical browsers, and now Unix users have several choices, some
    of which are the same used on Windows and Macintosh platforms.


    # Lynx


    It might seem strange to think it possible to browse the Web with a text-based
    program. After all, most people think, the Web is a graphics-intensive environment,
    and a text-based browser cannot show those elements of each Web page visited.
    This is actually a misunderstanding. While the Web integrates a large amount of
    graphics, it is usually not necessary to see the graphics in a particular page.
    This is especially true if the page''s authors have followed the HTML protocol
    and have labeled each image with text tags ("ALT tags," for those familiar with
    HTML).'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# CHAPTER 9 Internet Applications


    Unix offers a powerful, yet small, text-based browser called Lynx. Lynx displays
    the textual content of any Web page, along with any text tags attached to the
    image and sound files. Lynx also presents hyperlinks and form fields. As long
    as the page is programmed properly, Lynx should display it.


    Pages which are not programmed according to the HTML protocol will display badly
    or will not come up at all in Lynx. This is unfortunate, since some restrictions
    found in Lynx also apply to adaptive browsers used by people with physical restrictions,
    including blindness.


    > Note:


    Start Lynx by issuing the command


    ```

    lynx

    ```


    at the prompt. It will appear, as shown in Figure 9.6. You can also open Lynx
    to a specific Web page, by using the command with the URL as an argument, as in


    ```

    lynx http://www.mcraw-hill.com

    ```


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_152_0.png)


    FIGURE 9.6 The Lynx Web browser is text-only, but offers fast and efficient browsing
    and can also be used to incorporate Web data into shell programs.


    Obviously, since Lynx is limited to the single font available to the terminal,
    it cannot reproduce all the formatting in the average Web page. Nevertheless,
    Lynx attempts to convey the sense of the page as accurately as possible by using
    bold type, underlined type, and different colors (if the terminal is enabled for
    color). Hyperlinks usually appear in bold. The arrow keys to jump from hyperlink
    to hyperlink; the right arrow activates the link, moving to the new page, and
    the left arrow returns the browser to the previously'
