  md: '# CHAPTER 7 The vi Editor


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_112_0.png)


    FIGURE 7.1 The vi text editor running in a terminal window.


    # # vi’s Modes


    The vi modes make a clear distinction between editing commands and the actual
    text contained in the file. Depending on the mode in operation, keystrokes are
    interpreted by the editor in different ways. Users must be conscious of the current
    mode so that they can use the correct commands or enter appropriate text.


    When vi starts, it opens in edit mode. Edit mode is used for commands to the text
    editor, not for new text. If new text is entered in edit mode, vi will respond
    with a flurry of error messages since there is no text for the commands to work
    with. There are a number of text management possibilities available in edit mode,
    shown in the tables throughout the chapter.


    # Insert Mode


    Insert mode is used to add new text to a file. The first action taken upon starting
    vi is to switch to insert mode, by typing the character i. A cursor will appear
    at the start of the first line, indicating that the cursor has changed. Whenever
    the cursor is visible, the editor is in insert mode.


    As soon as the cursor appears, you can begin typing. Note that the cursor moves
    with the entered text. You should move the cursor yourself, so that you can add
    words or letters, use the arrow keys on the keyboard. Although its tools are limited,
    insert mode does offer some editing capabilities. The BACKSPACE key erases the
    character directly to the left of the cursor, while the DELETE key erases the
    character directly above the cursor.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Edit Mode


    While insert mode is necessary to get the basic text into a file, it is edit mode
    where the bulk of text file works. Once you have entered your text, switch back
    to edit mode by pressing the ESC key. The cursor will disappear, indicating that
    the mode has changed. Some of the basic edit operations are described in the “Using
    Edit Mode” section of this chapter. Edit mode allows the user to navigate the
    file, cut and paste blocks of text, find and replace text strings, and other useful
    activities.


    # Using Insert Mode


    Using insert mode is simple. Once you have entered insert mode by pressing the
    “i” key, enter the text needed for that file. To work on a file that already has
    some text, enter insert mode before adding additional text to the file. Anytime
    you want to add more text, you need to be in insert mode. Entering text in edit
    mode causes vi to treat it as a lengthy string of editing commands. The editor
    will return a mix of error messages and unintended edits.


    In addition to using the arrow keys to move through a file in insert mode, other
    navigational keys are functional in vi well. The PAGE UP and PAGE DOWN scroll
    the document, while the END key moves the cursor to the end of the line where
    it is located. The HOME key moves the cursor to the end of its current line. Most
    vi cursor movement, as well as a number of commands in edit mode, uses relative
    locations. That is, the cursor’s current location is always considered home base
    even if the cursor is at the bottom of the document or buried deep in the middle.


    # Using Edit Mode


    To enter edit mode, press the ESC key. In order to use most of the edit commands,
    you must locate the cursor at the text which is to be edited. The various keys
    used to navigate in insert mode also work in edit mode, but edit mode offers an
    additional set of navigational commands managed with multiple key combinations.


    Why use keystroke combinations instead of keyboard keys? Some older keyboards
    don’t have the full array of navigational keys. However, the better reason is
    that it will make you a faster typist. If you don’t have to move your hands to
    find the appropriate navigational key, you will maintain a steadier stream of
    input. Most people use a blend of navigational keys and keystroke combinations.


    Since every keystroke in edit mode is interpreted as a command, there are a number
    of keystrokes which move the cursor. Though using these keystrokes'
