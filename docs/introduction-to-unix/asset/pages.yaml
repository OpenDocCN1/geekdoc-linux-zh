  md: '# Remote Access Services


    Apart from the major Internet-related services described in this chapter, there
    are other services which run on many Unix networks which help to manage the incoming
    requests involved with those services. One of these services is inet. The inet
    process manages various services and controls the flow of information into your
    network in response to client requests.


    You can run servers without inet, allowing each server process to run constantly
    and respond whenever an incoming request is received. This is a fast way to respond
    to these client requests, but it is not particularly efficient. What if your Web
    site is not popular? Should an Apache process run constantly to serve a few requests
    a day? The more services you run, the more CPU cycles are devoted to managing
    those processes when idle.


    A better solution might be to place all servers under an umbrella program. That
    program would recognize the different formats of incoming requests, identify the
    process associated with each format, and start the necessary server to answer
    the client request. inet is such a program. Any server that receives requests
    from outside the network can run under inet: Web, FTP, login programs, and other
    similar programs.


    Although run under inet, it is not a particularly good idea. People expect fairly
    rapid page loads. If the Web server be started by inet to serve the page, the
    visitor may become frustrated and leave the site before the page loads. Web servers
    should be run independently. In the same vein, mail and news servers should not
    be run under inet because they pull new files on a regular basis.


    > Note:


    Most administrators who use inet configure to manage less frequently used programs
    which serve important purposes for the user base, but which can run only when
    needed. File transfer programs and remote logins are two of the most popular inet
    functions.


    # File Transfer Protocol


    File transfer protocol programs, or FTP, allow users to move files between different
    accounts on the same network or between a remote account. Administrators can configure
    the FTP daemon, ftppd, to permit anonymous login or require a local account for
    remote access. Despite being one of the oldest Internet-related mechanisms, FTP
    is still quite popular and is one of the best ways to manage files across the
    Internet and on local networks. It runs well under inet, starting only when an
    external client requests access to the FTP filesystem.'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Remote Login Access


    Another function handled efficiently by inet is remote login. As discussed earlier
    in the text, a user can log into remote machines or execute commands on those
    machines with a number of programs: telnet, rsh, login, and SSH. Although the
    first three of these four programs are security risks, some administrators still
    run them under inet. SSH can also be placed under the inet umbrella, opening secure
    channels only when prompted by an external request.


    # Configuring inet


    To set up the inet daemon inetd, you must configure two files: /etc/inetd.conf
    and /etc/services. (Note that these filenames may be slightly different on your
    Unix variant; as always, consult your documentation for the correct locations.)
    The /etc/inetd.conf file defines the various services which are controlled by
    the inet daemon, and /etc/services provides the path name for each of those servers
    and identifies the port on which each service listens for connections.


    The inet configuration files are unusually commented and reasonably easy to understand.
    The /etc/services file is quite long, and is included in Appendix C: Sample Configuration
    Files. The /etc/inetd.conf file is shown here, as an excellent example of a configuration
    file which you might encounter on your own system. A sample /etc/inetd.conf file,
    taken from a Debian or Red Hat Linux machine, might look like this:


    ```

    # inetd.conf This file describes the services that will be

    # available through the INET TCP/IP super server. To

    # re-configure the INET process, edit this file,

    # then send the INET process a SIGHUP signal.


    # Version: @(#)/etc/inetd.conf    3.10  05/27/1993

    # Authors: Original taken from BSD UNIX 4.3/TAHOE.

    # Fred N. van Kempen, <waltje@uwalt.nl.mugnet.org>


    # Modified for Debian Linux by Ian A. Murdock

    # <imurdock@shell.portal.com>


    # Modified for RHS Linux by Marc Ewing <marc@redhat.com>


    # <service_name> <sock_type> <proto> <flags> <user>

    # <server_path> <args>


    # Echo, discard, datetime, and chargen are used primarily

    # for testing.

    ```'
  merge: -1
