    # Opera


    For those users who consider themselves purists, the Opera browser is a relatively
    new alternative to Netscape and Lynx. Opera is a streamlined browser that does
    not provide programs for mail or news. It is free of charge for those who are
    willing to accept advertisements within the program frame, or at a reasonable
    price for those who prefer to run software that is ad-free.


    Download Opera at http://www.opera.com. The browser can be started in any of the
    normal ways, including issuing the command


    opera


    at the shell prompt in a terminal window. Figure 9.8 shows the browser. Most browser
    commands are the same, but Opera has some special features. The Preferences feature
    to select what types of files can display on your computer; you can toggle animated
    files, sound files, pop-up windows, JavaScript, and many other items which irritate
    some users.


    The reason many have switched to Opera has little to do with turning off popup
    windows, though. Opera is a compliant browser, which means that it displays only
    HTML code which is compliant with the current version of the HTML'
