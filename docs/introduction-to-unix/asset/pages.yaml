    # Search and Replace


    One of vi''s most powerful aspects is the ability to match patterns in edit mode.
    Pattern matching means that vi searches throughout the file for a string which
    matches one entered as a command. When the string is located, the user can either
    enter insert mode and continue to enter new text or stay in edit mode and replace
    the text with a different string.


    Suppose that you have written an essay about Unix, but to save you time you have
    typed "un" throughout the file instead. After you finish the essay, use vi''s
    search and replace functions to find each occurrence of the string "un" and'
