    # Finding Yourself on the Machine


    For users whose main computing experience is with personal operating systems like
    Windows or MacOS, the Unix emphasis on location can be difficult to understand.
    With Unix, though, it is important to know where each file is located, as well
    as to know where you are located within the system. A user normally works within
    the confines of a small subset of directories, but it is possible to work on files
    located anywhere else on the machine as long as you know where files reside.


    # Your Home Directory


    When a new user account is created on a Unix machine, a personal directory for
    that new user is also created. The location of these personal directories differs
    from Unix to variant, and may also differ according to the preferences of the
    system administrator or the function of that machine as a standalone or part of
    a larger network. On a large system with many users, the home directories may
    be divided among several parent directories to make organization and management
    easier. On smaller or single systems, all user directories will probably be kept
    in a single parent directory.'
