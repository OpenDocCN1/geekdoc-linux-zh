    # Reading the Documentation


    It may seem strange to think of reading the documentation as a step in the process
    of installing new software. When you are installing software from source code,
    however, reading the documentation is extremely important. In the directory created
    by extracting the archive, there should be documentation files. In particular,
    you should have files named README and INSTALL. Read these files carefully and
    completely.


    In addition to the README and INSTALL files, there may be other documentation
    available with the package. These files are often stored in a subdirectory named
    /doc, or otherwise will be obvious from their names. The README file may also
    indicate where the additional documentation is to be found. Note that, in some
    cases, the additional documentation is intended to be read from within the installed
    program and may be formatted unusually or as unreadable text.


    Always read all of a package''s documentation, or much of it as you can, proceeding
    with the installation. At the very least, you must read the README and INSTALL
    files to learn whether there are unique requirements for this program.


    Why is reading the documentation so important? Any idiosyncrasies of the installation
    procedure will be explained in the INSTALL and README files. These files also
    provide information that you may need to supply during the compilation, or warn
    that contain external or system information will be needed. This gives you time
    to obtain the necessary information before you begin the compilation process,
    which cannot be stopped without abandoning the installation. Special considerations
    involved in compiling this software for your particular system will be explained
    in these files. Your chances of a successful installation, and the least amount
    of wasted time, are maximized by reading the documentation before you begin the
    package.


    The following steps in this section are general procedures that are common to
    many software installations on many Unix variants. These steps are not


